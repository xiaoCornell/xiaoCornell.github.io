uthors": [{"name": "Muhammad Imran"}], "featured_authors": [{"name": "Muhammad Imran"}], "author_count": 1}, {"id": "2610.28373", "category": "quant-ph", "title": "Stable charged energy and phase transitions in an anisotropic Dicke quantum battery with Kerr nonlinearity", "abstract": "Phase transitions (PTs) in quantum many-body systems offer a powerful route to manipulate the performance of quantum batteries (QBs). Here, we investigate an anisotropic Dicke QB with Kerr nonlinearity, focusing on the role of PTs in the charging process of the QB system. By analyzing how the Kerr nonlinearity reshapes the cavity level-spacing structure, we find that multiple near-degeneracies emerge at specific nonlinearity strengths. Away from the region of multiple near-degeneracies, the stable stored energy is governed primarily by the ergodic-nonergodic transition (ENET), whereas within this region it is controlled by first- and second-order dissipative phase transitions (DPTs). We employ Liouvillian spectral theory to quantify the critical slowing down associated with the DPTs, and use the Wigner function to characterize the properties of the cavity field in the vicinity of criticality. We optimize the charging process via reinforcement learning (RL) and reveal the physical mechanism underlying performance enhancement from the perspective of ergodic and nonergodic phase dynamics. Our results offer a feasible pathway for manipulating and optimizing quantum battery performance based on intrinsic PT behaviors.", "url": "https://arxiv.org/abs/2610.28373", "type": "理论+数值", "summary": "量子多体系统中的相变（PT）提供了控制量子电池（QB）性能的强大途径。在这里，我们研究了具有 Kerr 非线性的各向异性 Dicke QB，重点关注 PT 在 QB 系统充电过程中的作用。通过分析克尔非线性如何重塑腔能级间距结构，我们发现在特定的非线性强度下会出现多个近简并性。远离多个近简并区域，稳定存储的能量主要由遍历-非遍历转变（ENET）控制，而在该区域内，它由一阶和二阶耗散相变（DPT）控制。我们采用刘维尔谱理论来量化与 DPT 相关的临界减速，并使用维格纳函数来表征临界点附近的腔场特性。我们通过强化学习（RL）优化充电过程，并从遍历和非遍历阶段动力学的角度揭示性能增强的物理机制。\n\n我们的结果为基于内在 PT 行为操纵和优化量子电池性能提供了一条可行的途径。", "authors": [{"name": "Shao-Fan He"}, {"name": "Lv-Ting Gong"}, {"name": "Fu-Quan Dou"}], "featured_authors": [{"name": "Shao-Fan He"}, {"name": "Lv-Ting Gong"}, {"name": "Fu-Quan Dou"}], "author_count": 3}, {"id": "2610.28415", "category": "quant-ph", "title": "Chaos and scrambling in anisotropic Dicke and Rabi models", "abstract": "Identifying the quantum signatures of classical chaos remains a central question in quantum physics, and quantum scrambling provides a new perspective on this correspondence. We study two distinct limits of the same model to examine how the correspondence between chaos and scrambling changes across different regimes. The thermodynamic-limit anisotropic Dicke model exhibits a close correspondence between chaos and scrambling, whereas this correspondence breaks down in the large-frequency-ratio limit of the anisotropic Rabi model (ARM). The contrasting chaotic behavior in the two limits originates from the different numbers of classical degrees of freedom, whereas their similar scrambling behavior stems from eigenstate delocalization. This implies that, in the large-frequency-ratio limit, eigenstate delocalization alone is insufficient to qualify the ARM as a classically chaotic model. This finding suggests that identifying chaos in quantum systems requires jointly considering the classical degrees of freedom and eigenstate delocalization.", "url": "https://arxiv.org/abs/2610.28415", "type": "理论", "summary": "识别经典混沌的量子特征仍然是量子物理学的一个核心问题，而量子扰乱为这种对应关系提供了新的视角。我们研究同一模型的两个不同限制，以研究混沌和无序之间的对应关系在不同制度下如何变化。热力学极限各向异性 Dicke 模型表现出混沌和扰乱之间的密切对应关系，而这种对应关系在各向异性 Rabi 模型 (ARM) 的大频率比极限下被打破。两个极限中截然不同的混沌行为源于不同数量的经典自由度，而它们相似的置乱行为则源于本征态离域。这意味着，在大频率比限制下，仅本征态离域不足以使 ARM 成为经典混沌模型。这一发现表明，识别量子系统中的混沌需要共同考虑经典自由度和本征态离域。", "authors": [{"name": "Long-Jie Li"}, {"name": "Li-Li Gao"}, {"name": "Zi-Cheng Liu"}, {"name": "Zi-Min Li"}, {"name": "Murray T. Batchelor"}], "featured_authors": [{"name": "Long-Jie Li"}, {"name": "Li-Li Gao"}, {"name": "Zi-Cheng Liu"}, {"name": "Zi-Min Li"}, {"name": "Murray T. Batchelor"}], "author_count": 5}, {"id": "2610.28538", "category": "quant-ph", "title": "NeST: ultra-high-rate qLDPC codes with sub-$50μ$s stabiliser cycles via spin shuttling", "abstract": "Quantum low-density parity-check codes now reach encoding rates up to 50% at useful distances. Their checks however are long-range group actions, not local neighbourhoods, and that connectivity has so far been supplied by neutral atoms. Silicon spin qubits offer the same primitive --- coherent transport of qubit blocks --- through electron shuttling, and on microsecond rather than millisecond timescales. They however travel along fabricated tracks rather than free space: permutations an atom array obtains by moving tweezers must here become collision-free motions on a physical lattice. We here present the first code and spin-qubit hardware co-design. We build an architecture whose geometry mimics that of a family of non-abelian groups, broad enough to host codes of excellent parameters: a hierarchy of nested conveyor-belt loops on a plain square lattice of shuttling tracks, in which every group multiplication becomes a rigid, globally controlled motion of whole qubit trains. We call it NeST, for Nested Shuttling Tracks. A code search over the family returns rate-20% mitten codes up to $[[1400,280,\\leq 28]]$, and circuit-level simulations including shuttling dephasing give thresholds above $10^{-3}$ with sub-$50\\mu$s stabiliser cycles, two to three orders of magnitude faster than neutral-atom implementations. Via extrapolations, we estimate that this largest code may reach a logical error probability per qubit per round of $10^{-14}$, assuming a ten-fold improvement on early shuttling demonstrations, with other physical errors at p=0.1%. Logic is compatible with NeST too: for the [[150,30,10]] code we build a code-surgery gadget in which every qubit again moves only by rigid belt motions, at no qubit cost and a 29% increase in gate layers. This demonstrates that ultra-low-overhead fault tolerance and a fast clock speed are not competing goals, and that silicon spin qubits can supply both.", "url": "https://arxiv.org/abs/2610.28538", "type": "理论+数值", "summary": "量子低密度奇偶校验码现在在有用距离上的编码率高达 50%。然而，他们的检查是远程集体行动，而不是局部社区，并且迄今为止，连接性是由中性原子提供的。硅自旋量子位通过电子穿梭，在微秒而不是毫秒的时间尺度上提供相同的原语——量子位块的相干传输。然而，它们沿着人造轨道而不是自由空间行进：通过移动镊子获得的原子阵列的排列必须成为物理晶格上的无碰撞运动。我们在这里展示第一个代码和自旋量子位硬件协同设计。我们构建了一种架构，其几何形状模仿非交换群家族的几何结构，其宽度足以容纳优秀参数的代码：在穿梭轨道的简单方形网格上嵌套的传送带环的层次结构，其中每个群乘法都成为整个量子位序列的刚性的、全局控制的运动。我们称之为 NeST，即嵌套穿梭轨道。\n\n对该系列的代码搜索返回高达 $[[1400,280,\\leq 28]]$ 的 20% 手套代码，并且包括穿梭移相在内的电路级模拟给出的阈值高于 $10^{-3}$，稳定器周期低于 $50\\mu$s，比中性原子实现快两到三个数量级。通过外推，我们估计这个最大的代码每轮每量子位的逻辑错误概率可能达到 $10^{-14}$，假设早期穿梭演示的改进十倍，其他物理错误为 p=0.1%。 Logic 也与 NeST 兼容：对于 [[150,30,10]] 代码，我们构建了一个代码手术小工具，其中每个量子位再次仅通过刚性皮带运动移动，没有量子位成本，并且门层增加了 29％。这表明超低开销的容错和快速的时钟速度并不是相互竞争的目标，并且硅自旋量子位可以同时满足这两个目标。", "authors": [{"name": "Adam Siegel"}], "featured_authors": [{"name": "Adam Siegel"}], "author_count": 1}, {"id": "2610.28600", "category": "quant-ph", "title": "Complete Modified Logarithmic Sobolev Inequalities for one-dimensional quantum Spin Chain", "abstract": "We prove a complete modified logarithmic Sobolev inequality with a system-size-independent constant for Chen--Kastoryano--Gilyén Gibbs samplers on one-dimensional spin chain at every fixed positive temperature. The result holds for Hamiltonians with bounded finite-range interactions, including noncommuting and spatially nonuniform interactions. It yields trace and diamond mixing times of order $O(\\log N+\\log(1/\\epsilon))$. The proof establishes complete spatial entropy factorization and absorbs quasi-local errors as conditional relative entropy at the original joint state and reference. The static estimate also yields a system-size-independent CMLSI for the single-site Petz heat-bath and regularised heat-bath dynamics.", "url": "https://arxiv.org/abs/2610.28600", "type": "理论", "summary": "我们证明了在每个固定正温度下，一维自旋链上的 Chen--Kastoryano-Gilyén Gibbs 采样器具有与系统尺寸无关的常数的完整修正对数 Sobolev 不等式。该结果适用于具有有限范围相互作用的哈密顿量，包括非交换和空间非均匀相互作用。它产生的痕量和钻石混合时间为 $O(\\log N+\\log(1/\\epsilon))$。该证明建立了完整的空间熵分解，并将准局部误差吸收为原始联合状态和参考处的条件相对熵。静态估计还为单点 Petz 热浴和正则化热浴动力学生成与系统尺寸无关的 CMLSI。", "authors": [{"name": "Li Gao"}, {"name": "Jingyu Guo"}, {"name": "Sihao Wang"}], "featured_authors": [{"name": "Li Gao"}, {"name": "Jingyu Guo"}, {"name": "Sihao Wang"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
