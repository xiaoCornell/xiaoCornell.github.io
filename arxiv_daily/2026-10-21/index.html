: "2610.28052", "category": "cond-mat", "title": "Polarity-selective domain wall propagation driven by spin-orbit torque", "abstract": "Spatial variations in magnetic anisotropy impede the spin-orbit-torque-driven motion of chiral domain walls in perpendicularly magnetized nanowires. We show that the local geometry of a two-dimensional anisotropy landscape can select which wall polarity propagates under a given current. Micromagnetic simulations of spatially correlated random anisotropy landscapes generated by diffusion-based smoothing reveal different propagation outcomes for up--down and down--up walls within the same disorder realization. A single inclined anisotropy boundary isolates the mechanism: in the presence of the Dzyaloshinskii--Moriya interaction, opposite wall polarities develop opposite current-induced tilts, producing different alignment with the boundary and hence different pinning strengths. Reversing the boundary inclination interchanges the pinned and propagating polarities. An extended collective-coordinate model captures this geometric selection and distinguishes the propagation threshold from the static pinning limit.", "url": "https://arxiv.org/abs/2610.28052", "type": "理论+数值", "summary": "磁各向异性的空间变化阻碍了垂直磁化纳米线中手性畴壁的自旋轨道扭矩驱动的运动。我们证明，二维各向异性景观的局部几何形状可以选择在给定电流下传播哪种壁极性。通过基于扩散的平滑生成的空间相关随机各向异性景观的微磁模拟揭示了在相同无序实现中上下和向下墙壁的不同传播结果。单个倾斜各向异性边界隔离了该机制：在存在 Dzyaloshinskii-Moriya 相互作用的情况下，相反的壁极性会产生相反的电流引起的倾斜，从而产生与边界的不同对准，从而产生不同的钉扎强度。反转边界倾角会互换固定极性和传播极性。扩展的集体坐标模型捕获这种几何选择，并将传播阈值与静态固定限制区分开来。", "authors": [{"name": "Nobuyuki Umetsu"}, {"name": "Michael Quinsat"}, {"name": "Masaki Kado"}, {"name": "Hiroki Tokuhira"}], "featured_authors": [{"name": "Nobuyuki Umetsu"}, {"name": "Michael Quinsat"}, {"name": "Masaki Kado"}, {"name": "Hiroki Tokuhira"}], "author_count": 4}, {"id": "2610.28055", "category": "cond-mat", "title": "Time-Reversal Symmetry in Artificial Topological Graphene Rings", "abstract": "We study an artificial graphene ring described by the low-energy two-valley Dirac Hamiltonian with a uniform mass term. When the ring is threaded by an Aharonov-Bohm flux, the problem reduces to a second-order radial equation solved by Bessel functions. We give the exact secular equation and, for narrow rings, closed expressions for the spectrum and the persistent current. We then add a uniform magnetic field perpendicular to the plane. The radial problem is solved with confluent hypergeometric functions, and the persistent current and magnetization are written as derivatives of a secular determinant from which the spurious roots have been removed. Besides the usual orbital coupling, the field enters through a valley-dependent term that comes from the Dirac structure and lifts the valley degeneracy. A weak-field expansion, accurate up to corrections of order B^4, gives this valley splitting explicitly and separates the diamagnetic and paramagnetic contributions to the susceptibility. Finally, we work out what time reversal implies for the spectrum. Physical time reversal, which exchanges the valleys, leads to an exact relation between levels at opposite fields. The effective single-valley time reversal, on the other hand, is broken by the mass term and by the boundary conditions, yet leaves no trace in the zero-field spectrum. Numerical results for the spectrum, the persistent current, and the magnetization illustrate the analysis.", "url": "https://arxiv.org/abs/2610.28055", "type": "理论+数值", "summary": "我们研究了由具有均匀质量项的低能双谷狄拉克哈密顿量描述的人造石墨烯环。当环上有阿哈罗诺夫-玻姆通量时，问题简化为由贝塞尔函数求解的二阶径向方程。我们给出了精确的世俗方程，并且对于窄环，给出了频谱和持续电流的闭合表达式。然后我们添加一个垂直于平面的均匀磁场。径向问题通过汇合超几何函数来解决，并且持续电流和磁化强度被写为长期行列式的导数，其中杂散根已被删除。除了通常的轨道耦合之外，场还通过来自狄拉克结构的谷相关项进入并提升谷简并性。精确到 B^4 阶校正的弱场展开明确地给出了该谷分裂，并将抗磁和顺磁对磁化率的贡献分开。最后，我们计算出时间反转对频谱意味着什么。物理时间反转，交换山谷，导致相反领域的水平之间的精确关系。\n\n另一方面，有效的单谷时间反演被质量项和边界条件破坏，但在零场谱中没有留下任何痕迹。频谱、持续电流和磁化强度的数值结果说明了分析。", "authors": [{"name": "J. A. da Silva Neto"}, {"name": "G. Q. Garcia"}, {"name": "A. M. de M. Carvalho"}, {"name": "C. Furtado"}], "featured_authors": [{"name": "J. A. da Silva Neto"}, {"name": "G. Q. Garcia"}, {"name": "A. M. de M. Carvalho"}, {"name": "C. Furtado"}], "author_count": 4}, {"id": "2610.28095", "category": "cond-mat", "title": "Neural Network Fractional Quantum Hall States with Learnable Orbital Pair Matrix Factors: Balancing Physical Priors and Flexibility", "abstract": "Neural network fractional quantum Hall (FQH) states offer a promising alternative for capturing Landau level (LL) mixing and for understanding FQH physics, yet the incorporation of physical priors has so far been limited to the minimal exact constraints built into the ansatz. Working in spherical geometry, we show that the network's flexibility suffers both when only minimal additional physical priors are supplied and when priors such as flux attachment are imposed rigidly. In the former case, the monopole harmonic product orbital (MHPO) ansatz is difficult to optimize, whereas in the latter, the expressivity of the neural network is restricted. We therefore propose the orbital pair matrix factor MHPO (MHPO-M) ansatz, which balances physical priors against flexibility by not only replacing the fixed Laughlin structure with learnable pair factors but also making them dependent on both the electron configurations and the orbitals. Across $\\nu=1/5$, $1/3$, and $2/5$, MHPO-M achieves the lowest variational energy among the tested variants, and a factorized orbital readout based on it enables scaling to 35 electrons, with energies competitive with trends inferred from three-LL exact-diagonalization results. These results demonstrate that physical priors can be appropriately incorporated without sacrificing the flexibility of neural network wavefunctions, opening a promising path toward accurate, scalable modeling of FQH systems with LL mixing.", "url": "https://arxiv.org/abs/2610.28095", "type": "理论+数值", "summary": "神经网络分数量子霍尔 (FQH) 态为捕获朗道级 (LL) 混合和理解 FQH 物理提供了一种有前途的替代方案，但迄今为止，物理先验的结合仅限于 ansatz 中内置的最小精确约束。在球面几何中，我们表明，当仅提供最小的附加物理先验时，以及当严格地施加诸如通量附加之类的先验时，网络的灵活性都会受到影响。在前一种情况下，单极子谐波积轨道（MHPO）模拟很难优化，而在后一种情况下，神经网络的表达能力受到限制。因此，我们提出了轨道对矩阵因子 MHPO (MHPO-M) ansatz，它不仅用可学习的对因子替换固定的 Laughlin 结构，而且使它们依赖于电子构型和轨道，从而平衡物理先验与灵活性。\n\n在 $\\nu=1/5$、$1/3$ 和 $2/5$ 中，MHPO-M 在测试的变体中实现了最低的变分能量，并且基于它的因式分解轨道读数可以扩展到 35 个电子，其能量与从三-LL 精确对角化结果推断出的趋势具有竞争力。这些结果表明，可以在不牺牲神经网络波函数灵活性的情况下适当地合并物理先验，从而为具有 LL 混合的 FQH 系统的精确、可扩展建模开辟了一条有希望的道路。", "authors": [{"name": "Yubing Qian"}, {"name": "Weiluo Ren"}, {"name": "Ji Chen"}], "featured_authors": [{"name": "Yubing Qian"}, {"name": "Weiluo Ren"}, {"name": "Ji Chen"}], "author_count": 3}, {"id": "2610.28148", "category": "cond-mat", "title": "Field theories and critical excitations at anyon condensation transitions", "abstract": "Anyon condensation transitions remain challenging to characterize especially when the condensing anyons are non-abelian. We develop two complementary approaches for extracting information about the transition from the categorical data of the parent topological order and the condensate. The first adapts a Ginzburg-Landau procedure developed for $1+1$D transitions in the SymTFT setting to $2+1$D anyon condensation transitions. The construction applies when the anyons participating in the condensate have integer quantum dimensions. The second gives a criterion for identifying which point and loop excitations become critical at a continuous transition. The key step is to determine which anyon loops remain condensed throughout. All other loops become critical, while a point excitation becomes critical if it braids trivially with every condensed loop. We illustrate both proposals in several abelian and non-abelian examples.", "url": "https://arxiv.org/abs/2610.28148", "type": "理论", "summary": "任意子凝聚转变仍然具有挑战性，特别是当凝聚任意子是非阿贝尔时。我们开发了两种互补的方法来从父拓扑顺序和凝聚体的分类数据中提取有关转变的信息。第一个将 SymTFT 设置中为 $1+1$D 跃迁开发的 Ginzburg-Landau 程序改编为 $2+1$D 任意子凝结跃迁。当参与凝聚体的任意子具有整数量子维度时，该构造适用。第二个给出了一个标准，用于识别哪些点和环路激励在连续过渡中变得至关重要。关键步骤是确定哪些任意子循环始终保持压缩状态。所有其他环路都变得至关重要，而如果点激励与每个压缩环路琐碎地编织在一起，则点激励变得至关重要。我们用几个阿贝尔和非阿贝尔的例子来说明这两个提议。", "authors": [{"name": "Luisa Eck"}, {"name": "Xie Chen"}], "featured_authors": [{"name": "Luisa Eck"}, {"name": "Xie Chen"}], "author_count": 2}, {"id": "2610.28152", "category": "cond-mat", "title": "Enhancement of Li and Na Storage in Janus HfSSe Monolayers by Co-Induced Electron-Deficient Chalcogen Sites: A First-Principles Study", "abstract": "The growing demand for high-capacity, fast-charging, and durable rechargeable batteries has intensified the search for advanced electrode materials, with two-dimensional materials offering large surface-to-mass ratios and short ion-diffusion pathways. Here, pristine and Co-doped Janus HfSSe monolayers were investigated as anode materials for Li-ion and Na-ion batteries using first-principles density functional theory. Pristine HfSSe was found to be dynamically stable and exhibited a 0.85 eV band gap, while Co substitution shifted the Fermi level toward the valence-band region. Adsorption of the first Li or Na layer induced metallic behavior, thereby improving charge transport. Co doping strengthened alkali-metal binding, with the most favorable Li and Na adsorption energies changing from -2.6125 and -1.9800 eV to -3.7405 and -3.0529 eV, respectively. Co doping created electron-deficient sites that enhanced Li/Na binding. Co-doped HfSSe accommodated up to four Li layers and three Na layers, increasing the theoretical capacities from 555.43 to 776.19 mAh/g for Li and from 370.29 to 582.14 mAh/g for Na. The average open-circuit voltages were 0.62 V for Li and 0.29-0.30 V for Na, with minimum migration barriers of 0.2153 and 0.1044 eV, respectively. These results identified Co-doped Janus HfSSe as a promising anode material for Li-ion and Na-ion batteries.", "url": "https://arxiv.org/abs/2610.28152", "type": "理论+数值", "summary": "对高容量、快速充电和耐用可充电电池日益增长的需求加强了对先进电极材料的寻找，其中二维材料提供大的表面质量比和短的离子扩散路径。在这里，使用第一原理密度泛函理论研究了原始和共掺杂的 Janus HfSSe 单层作为锂离子和钠离子电池的阳极材料。原始的 HfSSe 被发现是动态稳定的，并表现出 0.85 eV 的带隙，而 Co 取代将​​费米能级移向价带区。第一层锂或钠层的吸附诱导金属行为，从而改善电荷传输。 Co掺杂增强了碱金属结合，最有利的Li和Na吸附能分别从-2.6125和-1.9800 eV变为-3.7405和-3.0529 eV。钴掺杂产生了增强锂/钠结合的缺电子位点。共掺杂的 HfSSe 可容纳多达四层锂和三层钠，使锂的理论容量从 555.43 mAh/g 增加到 776.19 mAh/g，钠的理论容量从 370.29 mAh/g 增加到 582.14 mAh/g。\n\nLi 的平均开路电压为 0.62 V，Na 的平均开路电压为 0.29-0.30 V，最小迁移势垒分别为 0.2153 和 0.1044 eV。这些结果表明，钴掺杂的 Janus HfSSe 是一种有前途的锂离子和钠离子电池负极材料。", "authors": [{"name": "Md. Muktadir Hasan"}, {"name": "Md. Mafizul Islam"}, {"name": "Ahmed Zubair"}], "featured_authors": [{"name": "Md. Muktadir Hasan"}, {"name": "Md. Mafizul Islam"}, {"name": "Ahmed Zubair"}], "author_count": 3}, {"id": "2610.28163", "category": "cond-mat", "title": "Finite-size spin fluctuations and fixed-index sweeps in a ferromagnetic spinor condensate", "abstract": "We find a dip in the optimized rotation quantum Fisher information of a zero-magnetization ferromagnetic spin-1 Bose-Einstein condensate near the excited-state quantum phase transition. Its displacement from $\\epsilon_c=-q$ decreases on an inverse-size scale. At $q=0.6,0.8,1.0,1.2$, the dip value of $F_{\\max}$ equals $2\\langle S^2\\rangle$ for $N$ up to $3840$, linking it to total-spin fluctuations. A semiclassical orbit average normalized by the classical density of states describes the dip over $N=120$--$3840$ with maximum relative residual below $0.028$; a small power law fits comparably. Inserting the measured energy offsets directly into the semiclassical formula leaves residuals of $17$--$30\\%$, so $\\kappa$ acts as an effective cutoff. Among retained states, spin-nematic squeezing occurs at the spectral edges. Separately, fixed-index excited-state sweeps have half-excitation times between $11.2$ and $13.1$ times their ground-state counterparts, with local size exponents increasing across the four sizes.", "url": "https://arxiv.org/abs/2610.28163", "type": "理论+数值", "summary": "我们发现零磁化铁磁自旋 1 玻色-爱因斯坦凝聚体的优化旋转量子费希尔信息在激发态量子相变附近出现了下降。它相对于 $\\epsilon_c=-q$ 的位移按反比例减小。在 $q=0.6,0.8,1.0,1.2$ 处，$F_{\\max}$ 的跌幅值等于 $2\\langle S^2\\rangle$（对于 $N$ 高达 $3840$），将其与总自旋波动联系起来。由经典态密度归一化的半经典轨道平均值描述了 $N=120$--$3840$ 上的下降，最大相对残差低于 $0.028$；小幂律也同样适用。将测得的能量偏移直接插入半经典公式会留下 $17$--$30\\%$ 的残差，因此 $\\kappa$ 充当有效的截止值。在保留态中，自旋向列挤压发生在光谱边缘。另外，固定指数激发态扫描的半激发时间在基态扫描的 11.2 美元到 13.1 美元之间，四种尺寸的局部尺寸指数都在增加。", "authors": [{"name": "Yi Ding"}, {"name": "Junyan Luo"}, {"name": "Yixiao Huang"}], "featured_authors": [{"name": "Yi Ding"}, {"name": "Junyan Luo"}, {"name": "Yixiao Huang"}], "author_count": 3}, {"id": "2610.28253", "category": "cond-mat", "title": "Proliferation Transitions for Quantum Doubles of Groups", "abstract": "Proliferation transitions are phase transitions between a 2+1d topological order $\\mathcal{T}$ and another $\\mathcal{T}/\\mathcal{A}$, obtained by condensing anyons in an algebra $\\mathcal{A}\\subset \\mathcal{T}$. We consider such transitions in quantum doubles of groups, $\\mathcal{T}=D(G, \\omega)$, for finite groups $G$ possibly with three-cocycle $\\omega$, for which condensable algebras are fully classified. Given a condensable algebra $\\mathcal{A}$, we represent $\\mathcal{T}$ in terms of a Symmetry Topological Field Theory (SymTFT), that is tailored to the $\\mathcal{A}$ proliferation transition. The SymTFT bulk is constructed from the Müger center of the subcategory generated by the algebra, i.e. the category of transparent lines, which can be bosons or fermions. Properties of the transition can then be inferred directly from the algebra classification data. For gauged Landau-Ginzburg (LG*) type transitions, we show that they do not only depend on the anyons in $\\mathcal{A}$ through their field content, but the cubic interactions are fixed in terms of the multiplication structure of $\\mathcal{A}$. Applied to twin algebras, which have the same anyon content but different multiplication structures, we show that twins result in distinct proliferation transitions.", "url": "https://arxiv.org/abs/2610.28253", "type": "理论", "summary": "增殖跃迁是 2+1d 拓扑序 $\\mathcal{T}$ 和另一个 $\\mathcal{T}/\\mathcal{A}$ 之间的相变，通过压缩代数 $\\mathcal{A}\\subset \\mathcal{T}$ 中的任意子获得。我们考虑群的量子双精度中的这种转变，$\\mathcal{T}=D(G,\\omega)$，对于有限群$G$，可能具有三同循环$\\omega$，其中可凝聚代数是完全分类的。给定一个可凝聚代数 $\\mathcal{A}$，我们用对称拓扑场论 (SymTFT) 来表示 $\\mathcal{T}$，该理论是针对 $\\mathcal{A}$ 增殖转变而定制的。 SymTFT 体是由代数生成的子类别（即透明线类别，可以是玻色子或费米子）的 Müger 中心构造而成。然后可以直接从代数分类数据推断出转换的属性。对于测量的 Landau-Ginzburg (LG*) 型跃迁，我们表明它们不仅通过其场内容依赖于 $\\mathcal{A}$ 中的任意子，而且立方相互作用根据 $\\mathcal{A}$ 的乘法结构而固定。\n\n应用于具有相同任意子内容但不同乘法结构的孪生代数，我们表明孪生会导致不同的增殖转变。", "authors": [{"name": "Yuhan Gai"}, {"name": "Sakura Schafer-Nameki"}], "featured_authors": [{"name": "Yuhan Gai"}, {"name": "Sakura Schafer-Nameki"}], "author_count": 2}, {"id": "2610.28278", "category": "cond-mat", "title": "Dynamics of two bosons with density-assisted tunnelling in a one-dimensional tilted lattice", "abstract": "We investigate the dynamics of two bosons in a tilted one-dimensional optical lattice with both standard and density-assisted tunnelling. The relative sign of the two tunnelling processes strongly affects the Bloch dynamics, leading to distinct reinforcing and competing regimes. We examine how the tunnelling processes generate correlations and find that, in the absence of onsite interactions, the early-time entanglement growth follows the same scaling with the density-assisted tunnelling amplitude. Finite onsite interaction changes this picture by breaking the symmetry between the reinforcing and competing regimes and enhancing the correlation differently in two regimes. This shows how the interplay between the two tunnelling mechanisms can change dyanmics and entanglement in a controlled few-body setting. Particularly, at equal tunnelling amplitudes, the doublon and singlon sectors decouple completely for arbitrary onsite interaction, lattice tilting, and initial state.", "url": "https://arxiv.org/abs/2610.28278", "type": "理论", "summary": "我们利用标准隧道效应和密度辅助隧道效应研究了倾斜一维光学晶格中两种玻色子的动力学。两个隧道过程的相对符号强烈影响布洛赫动力学，导致不同的强化和竞争机制。我们研究了隧道效应如何产生相关性，并发现，在没有现场相互作用的情况下，早期纠缠的增长遵循与密度辅助隧道效应相同的缩放比例。有限现场交互通过打破强化和竞争机制之间的对称性并以不同方式增强两个机制中的相关性来改变这种情况。这表明两种隧道机制之间的相互作用如何改变受控少体环境中的动力学和纠缠。特别是，在相同的隧道振幅下，双克隆和单克隆扇区对于任意现场相互作用、晶格倾斜和初始状态完全解耦。", "authors": [{"name": "Muhammad S. Hasan"}, {"name": "Vikash Mittal"}, {"name": "Tomasz Sowiński"}], "featured_authors": [{"name": "Muhammad S. Hasan"}, {"name": "Vikash Mittal"}, {"name": "Tomasz Sowiński"}], "author_count": 3}, {"id": "2610.28298", "category": "cond-mat", "title": "Classical spin liquids in the kagome Ising model, and their link with magnetoelasticity", "abstract": "We investigate a nearest-neighbor Ising model on the kagome lattice coupled to elastic lattice distortions. By integrating out the lattice degrees of freedom, we derive an approximate spin-only description in terms of a kagome \\(J_1\\)-\\(J_2\\)-\\(J_{3}\\) Ising model with interactions extending to third nearest-neighbors. Using tensor network methods complemented by classical Monte Carlo simulations, we revisit its zero-temperature phase diagram and characterize the ground states studied more than thirty years ago. We discover three phases with extensive zero-temperature entropy and algebraically decaying spin correlations. Importantly, these states are not confined to fine-tuned points or frontiers between phases, but occupy extended areas of parameter space. Their quasi long-range order is reflected in Bragg-like peaks in the structure factors; we relate this, and other properties, to diverse phases found in Ising and Heisenberg models. Finally, we trace the trajectories generated by the magnetoelastic coupling through the effective-model phase diagram, explaining the emergence of self-frustration for the unfrustrated magnetoelastic model with ferromagnetic interactions.", "url": "https://arxiv.org/abs/2610.28298", "type": "理论+数值", "summary": "我们研究了与弹性晶格畸变耦合的 kagome 晶格上的最近邻 Ising 模型。通过积分晶格自由度，我们根据 kagome \\(J_1\\)-\\(J_2\\)-\\(J_{3}\\) Ising 模型推导出近似的仅自旋描述，其相互作用延伸到第三个最近邻。使用张量网络方法并辅以经典蒙特卡罗模拟，我们重新审视了其零温度相图并表征了三十多年前研究的基态。我们发现了具有广泛的零温熵和代数衰减自旋相关性的三个阶段。重要的是，这些状态并不局限于阶段之间的微调点或边界，而是占据参数空间的扩展区域。它们的准长程有序性反映在结构因子中的类布拉格峰中；我们将这一特性以及其他特性与伊辛和海森堡模型中发现的不同相联系起来。最后，我们通过有效模型相图追踪磁弹性耦合产生的轨迹，解释了具有铁磁相互作用的无受挫磁弹性模型的自我受挫的出现。", "authors": [{"name": "T. Vignau Costa"}, {"name": "J. Colbois"}, {"name": "G. L. Rossini"}, {"name": "F. Mila"}, {"name": "D. C. Cabra"}, {"name": "S. A. Grigera"}, {"name": "R. A. Borzi"}], "featured_authors": [{"name": "T. Vignau Costa"}, {"name": "J. Colbois"}, {"name": "G. L. Rossini"}, {"name": "D. C. Cabra"}, {"name": "S. A. Grigera"}, {"name": "R. A. Borzi"}], "author_count": 7}, {"id": "2610.28326", "category": "cond-mat", "title": "Electronic driving of torsional modes in carbon nanotubes via orbital-phonon coupling", "abstract": "We theoretically investigate electronic driving of a torsional mode in a suspended carbon nanotube quantum dot. The valley states in a nanotube carry opposite orbital magnetic moments along the tube axis, and intervalley mixing forms valley-mixed eigenstates whose splitting can be controlled by an axial magnetic field. We formulate an orbital-rotation coupling between the torsional angular velocity and the valley orbital angular momentum. Using a master equation for sequential tunneling through normal-metal electrodes, we calculate the steady-state current and the phonon distribution of the torsional mode. When the valley-state splitting matches the torsional phonon energy, orbital transitions can drive the mode out of equilibrium. The contacts control both phonon pumping and its electrical readout, allowing substantial excitation with a positive, vanishing, or negative current response. The mechanism requires no intrinsic spin or valley polarization of the electrodes, but uses state-dependent tunneling at the contacts.", "url": "https://arxiv.org/abs/2610.28326", "type": "理论", "summary": "我们从理论上研究了悬浮碳纳米管量子点中扭转模式的电子驱动。纳米管中的谷态沿着管轴携带相反的轨道磁矩，并且间隔混合形成谷混合本征态，其分裂可以通过轴向磁场控制。我们制定了扭转角速度和谷轨道角动量之间的轨道-旋转耦合。使用通过普通金属电极的顺序隧道效应的主方程，我们计算了扭转模式的稳态电流和声子分布。当谷态分裂与扭转声子能量匹配时，轨道跃迁可以使模式失去平衡。触点控制声子泵浦及其电读数，从而允许以正电流、消失电流或负电流响应进行大量激发。该机制不需要电极的固有自旋或谷极化，但在接触处使用状态相关的隧道效应。", "authors": [{"name": "Koji Yamada"}, {"name": "Wataru Izumida"}, {"name": "Mamoru Matsuo"}, {"name": "Takeo Kato"}], "featured_authors": [{"name": "Koji Yamada"}, {"name": "Wataru Izumida"}, {"name": "Mamoru Matsuo"}, {"name": "Takeo Kato"}], "author_count": 4}, {"id": "2610.28365", "category": "cond-mat", "title": "Initial-State-Dictated Dynamical Universality Classes in Quantum Criticality", "abstract": "The concept of universality class lies at the core of phase transition physics, with each class uniquely characterized by a dedicated set of critical exponents. Here, we introduce the concept of initial-state-dictated dynamical universality classes in nonequilibrium quantum critical dynamics. By studying the imaginary-time relaxation dynamics of the dimerized Heisenberg model, we demonstrate that distinct kinds of initial states can give rise to different dynamical universality classes within the same equilibrium universality class. Specifically, we find that \"classical'' paramagnetic (random-spin) and \"quantum'' paramagnetic (dimerized and antidimerized) initial states yield drastically different critical initial slip exponents in the bulk. This initial-state dependence also extends to boundary critical dynamics, where different initial states yield different surface critical initial slip exponents even within the same boundary universality class. Remarkably, for the antidimerized initial state, we uncover an anomalous scaling law violating the conventional relation between the bulk and surface critical initial slip exponents. Our results establish an initial-state-controlled dynamical classification of quantum criticality that extends beyond the conventional equilibrium universality paradigm.", "url": "https://arxiv.org/abs/2610.28365", "type": "理论", "summary": "普适性类的概念是相变物理学的核心，每个类都有一组专用的关键指数。在这里，我们引入非平衡量子临界动力学中初始状态决定的动力学普遍性类的概念。通过研究二聚海森堡模型的虚数时间弛豫动力学，我们证明不同种类的初始状态可以在同一平衡普遍性类别中产生不同的动力学普遍性类别。具体来说，我们发现“经典”顺磁（随机自旋）和“量子”顺磁（二聚和反二聚）初始状态在整体上产生截然不同的临界初始滑移指数。这种初始状态依赖性也扩展到边界临界动力学，其中不同的初始状态即使在相同的边界普遍性类别内也会产生不同的表面临界初始滑移指数。值得注意的是，对于反二聚化的初始状态，我们发现了一个反常的标度定律，违反了体相临界初始滑移指数和表面临界初始滑移指数之间的常规关系。\n\n我们的结果建立了量子临界性的初始状态控制的动力学分类，超出了传统的平衡普遍性范式。", "authors": [{"name": "Yu-Rong Shu"}, {"name": "Shuai Yin"}], "featured_authors": [{"name": "Yu-Rong Shu"}, {"name": "Shuai Yin"}], "author_count": 2}, {"id": "2610.28396", "category": "cond-mat", "title": "Orbital-angular-momentum control of localized Floquet states and photocurrents in Weyl semimetals", "abstract": "Structured light provides a route to controlling quantum materials not only through its polarization, but also through its spatial profile and orbital angular momentum (OAM). We develop real space theories of a Weyl semimetal driven by a vortex beam and show that optical OAM generates highly localized Floquet vortex states with pronounced circulating photocurrents. Exploiting cylindrical symmetry, we derive a Bogoliubov-de Gennes-like radial equation that resolves the states by angular momentum and reveals their evolution between the light-dressed Weyl cones. For Laguerre-Gaussian beams, the spatially varying drive produces strong hybridization between localized vortex states and bulk states. We complement this continuum description with a Wilson-lattice formulation that retains the full two-dimensional spatial structure and enables direct calculation of local photocurrents. Both approaches consistently identify OAM-induced vortex states localized around the beam axis. The lattice calculation further shows that these states support substantially stronger circulating current densities than the more extended surface states, with the largest current densities associated with the most strongly localized, low-angular-momentum vortex modes. Our results establish optical OAM as a tunable control parameter for creating and manipulating localized current-carrying states in Weyl systems and provide a real-space framework for studying photocurrents generated by spatially structured light.", "url": "https://arxiv.org/abs/2610.28396", "type": "理论+数值", "summary": "结构光提供了一种控制量子材料的途径，不仅通过其偏振，还通过其空间轮廓和轨道角动量（OAM）。我们发展了由涡旋光束驱动的外尔半金属的实空间理论，并表明光学 OAM 产生具有明显循环光电流的高度局域化的 Floquet 涡旋态。利用圆柱对称性，我们推导出类似 Bogoliubov-de Gennes 的径向方程，该方程通过角动量解析状态，并揭示它们在浅色外尔锥体之间的演化。对于拉盖尔高斯光束，空间变化的驱动会在局部涡旋态和体态之间产生强烈的杂化。我们用威尔逊晶格公式补充了这种连续描述，该公式保留了完整的二维空间结构并能够直接计算局部光电流。两种方法一致地识别了 OAM 引起的位于光束轴周围的涡旋状态。\n\n晶格计算进一步表明，这些状态比更扩展的表面状态支持明显更强的循环电流密度，其中最大电流密度与最强局域化、低角动量涡旋模式相关。我们的研究结果将光学 OAM 确立为可调谐控制参数，用于在 Weyl 系统中创建和操纵局部载流状态，并为研究空间结构光产生的光电流提供了真实空间框架。", "authors": [{"name": "Kyle S. Netherwood"}, {"name": "Juan I. Aranzadi"}, {"name": "Nils Jacobsen"}, {"name": "Michael A. Sentef"}, {"name": "Sang Soon Oh"}], "featured_authors": [{"name": "Kyle S. Netherwood"}, {"name": "Juan I. Aranzadi"}, {"name": "Nils Jacobsen"}, {"name": "Michael A. Sentef"}, {"name": "Sang Soon Oh"}], "author_count": 5}, {"id": "2610.28461", "category": "cond-mat", "title": "Ubiquitous Flat Bands in Edge-Inflated Random Graphs", "abstract": "Flat bands are usually associated with periodic lattice geometries, where destructive interference or chiral-symmetry constraints produce macroscopically degenerate eigenstates. Here we show that flat bands arise generically in a broad class of nonperiodic random networks through a simple edge-inflation procedure. Starting from random regular, Voronoi tessellation, Delaunay triangulation, scale-free, small-world, and Erdös-Rényi seed graphs, each edge is replaced by a finite one-dimensional tight-binding chain, either with fixed length $L$ or with random lengths of mean $\\bar L$. Although the original random graphs typically have adjacency matrices of full rank and therefore few or no zero eigenstates, their inflated counterparts exhibit extensive flat bands. The flat-band energies are determined by the eigenstates residing on the chains or, more generally, by the eigenvalues of identical loopless motifs replacing the seed bonds. The corresponding eigenstates are states supported on subsets of the inflated chains formed by destructive interference at the original seed vertices. For zero-energy flat bands, we relate the degeneracy to the graph nullity $\\eta(G)$ and the maximum matching number $\\nu(G)$. The numerical results support the correspondence $\\eta(G)=N-2\\nu(G)$, up to small deviations, across the random graph ensembles studied. The fraction of degenerate zero-energy states in inflated random graphs is controlled primarily by the average degree of the seed graph. We further show that the flat bands exhibit characteristic robustness to disorder: disorder on the seed sites and random magnetic flux leave the flat bands essentially unchanged, while bond disorder and disorder on the chain or motif sites broaden them. These results show that flat bands do not require crystalline order, but can emerge as robust consequences of local graph inflation and motif substitution.", "url": "https://arxiv.org/abs/2610.28461", "type": "理论+数值", "summary": "平带通常与周期性晶格几何形状相关，其中相消干涉或手性对称约束产生宏观简并本征态。在这里，我们展示了通过简单的边缘膨胀过程，平带通常出现在广泛的非周期性随机网络中。 Starting from random regular, Voronoi tessellation, Delaunay triangulation, scale-free, small-world, and Erdös-Rényi seed graphs, each edge is replaced by a finite one-dimensional tight-binding chain, either with fixed length $L$ or with random lengths of mean $\\bar L$. Although the original random graphs typically have adjacency matrices of full rank and therefore few or no zero eigenstates, their inflated counterparts exhibit extensive flat bands.平带能量由链上的本征态决定，或更一般地，由取代种子键的相同无环基序的本征值决定。相应的本征态是由原始种子顶点处的相消干涉形成的膨胀链的子集支持的状态。\n\n对于零能量平带，我们将简并性与图无效性 $\\eta(G)$ 和最大匹配数 $\\nu(G)$ 联系起来。数值结果支持 $\\eta(G)=N-2\\nu(G)$ 的对应关系，在所研究的随机图集合中存在较小的偏差。膨胀随机图中简并零能量态的比例主要由种子图的平均度控制。我们进一步表明，平带表现出对无序的鲁棒性：种子位点上的无序和随机磁通量使平带基本上保持不变，而键无序和链或基序位点上的无序使平带变宽。这些结果表明，平带不需要晶体顺序，但可以作为局部图膨胀和基序替换的强大后果而出现。", "authors": [{"name": "Richard Berkovits"}], "featured_authors": [{"name": "Richard Berkovits"}], "author_count": 1}, {"id": "2610.28472", "category": "cond-mat", "title": "Sum-over-poles framework for quantum embedding to approach the real-frequency axis", "abstract": "We introduce a real-frequency framework for the quantum embedding of solids, based on sum-over-poles (SOP) representations. We partition the lattice into periodically repeated interacting fragments and derive an embedded Dyson equation for the fragment, to be solved self-consistently. The resulting scheme generalizes the algorithmic-inversion method of our previous work to interacting Hamiltonians and is closely related to dynamical mean-field theory (DMFT), especially when an extended impurity problem is introduced. By exploiting the compact pole expansion of the embedding potential, we carry out the self-consistent procedure close to the real axis, which avoids ill-posed analytic continuation. In addition, the SOP representation allows us to introduce a pole-and-residue dynamics, which we use to reach the self-consistent solution. After deriving the method, we benchmark it against exact-diagonalization implementations of DMFT on the one-dimensional Hubbard ring at half filling. The framework offers a natural route to real-space dynamical quantum embedding, for periodic systems as well as for strongly correlated defects in materials.", "url": "https://arxiv.org/abs/2610.28472", "type": "理论+数值", "summary": "我们引入了基于极点和（SOP）表示的固体量子嵌入的实频框架。我们将晶格划分为周期性重复的相互作用的片段，并导出该片段的嵌入式戴森方程，以自洽地求解。由此产生的方案将我们之前工作的算法反演方法推广到相互作用的哈密顿量，并且与动态平均场理论（DMFT）密切相关，特别是当引入扩展的杂质问题时。通过利用嵌入势的紧极展开，我们在接近实轴的地方执行了自洽过程，这避免了不适定的分析连续。此外，SOP 表示允许我们引入极点和残差动力学，我们用它来达到自洽的解决方案。推导该方法后，我们将其与半填充一维哈伯德环上的 DMFT 精确对角化实现进行基准测试。该框架为周期性系统以及材料中强相关缺陷提供了实空间动态量子嵌入的自然途径。", "authors": [{"name": "Alessandro Carbone"}, {"name": "Massimo Capone"}, {"name": "Nicola Marzari"}, {"name": "Tommaso Chiarotti"}], "featured_authors": [{"name": "Alessandro Carbone"}, {"name": "Massimo Capone"}, {"name": "Nicola Marzari"}, {"name": "Tommaso Chiarotti"}], "author_count": 4}, {"id": "2610.28493", "category": "cond-mat", "title": "Multiscale Modeling of Zr Corrosion: Predicting Microstructures of Oxide Films", "abstract": "A first-principles-informed multiscale modeling approach is reported for oxide formation during corrosion of zirconium. The present simulations reproduce the columnar corrosion film microstructure and grain size distribution seen in micrographs of oxidized Zr surfaces. This structural feature emerges from a hexagonal ZrO layer adjacent to the $\\alpha$-Zr/ZrO$_{2-x}$ interface, which is dynamically stabilized by continuous heterogeneous grain nucleation and grain boundary mass diffusion. This ZrO layer is identified as a significant oxygen diffusion barrier and a potential contributor to sub-parabolic pretransition corrosion kinetics. The simulations also reproduce the undulatory nature of the metal/oxide interface, leading to regions with tensile stress components capable of nucleating cracks, despite the overall state of compressive hydrostatic stress within the oxide film. First principles density functional theory (DFT) computations of fundamental ZrO$_x$ properties were combined with molecular dynamics simulations using a machine-learned potential based on a DFT training set to provide extensive input to an advanced phase field model for oxide formation and its microstructure, as implemented in the new MedeA PhaseField module. The phase field simulations reported herein incorporated computed stoichiometry-dependent thermochemical data, anisotropic elastic properties, interface energies, bulk and grain boundary mass transport processes, multiphase heterogeneous grain nucleation, and strain energy-dependent phase stabilities.", "url": "https://arxiv.org/abs/2610.28493", "type": "理论+数值", "summary": "据报道，针对锆腐蚀过程中氧化物的形成，采用了基于第一原理的多尺度建模方法。本模拟再现了氧化 Zr 表面显微照片中看到的柱状腐蚀膜微观结构和晶粒尺寸分布。这种结构特征出现在$\\alpha$-Zr/ZrO$_{2-x}$界面附近的六方ZrO层中，该层通过连续异质晶粒成核和晶界质量扩散而动态稳定。该 ZrO 层被认为是重要的氧扩散屏障，并且是亚抛物线转变前腐蚀动力学的潜在贡献者。模拟还再现了金属/氧化物界面的波动性质，导致具有能够使裂纹成核的拉应力分量的区域，尽管氧化膜内的压静水应力的整体状态。\n\nZrO$_x$ 基本性质的第一原理密度泛函理论 (DFT) 计算与分子动力学模拟相结合，使用基于 DFT 训练集的机器学习势来为氧化物形成及其微观结构的高级相场模型提供广泛的输入，如新的 MedeA PhaseField 模块中所实现的那样。本文报道的相场模拟结合了计算的化学计量相关的热化学数据、各向异性弹性性质、界面能、体和晶界质量传输过程、多相异质晶粒成核和应变能相关的相稳定性。", "authors": [{"name": "K. Starkey"}, {"name": "L. Kahle"}, {"name": "M. Christensen"}, {"name": "V. Eyert"}, {"name": "A. El-Azab"}, {"name": "C. B. Geller"}, {"name": "A. P. Shivprasad"}, {"name": "E. Wimmer"}], "featured_authors": [{"name": "K. Starkey"}, {"name": "L. Kahle"}, {"name": "M. Christensen"}, {"name": "C. B. Geller"}, {"name": "A. P. Shivprasad"}, {"name": "E. Wimmer"}], "author_count": 8}, {"id": "2610.28529", "category": "cond-mat", "title": "Symmetry-Guided Machine Learning of Spin-Dependent Nonlinear Hall Response", "abstract": "A Berry-curvature dipole can produce a nonlinear Hall current even when the linear Hall response vanishes, but symmetry alone does not determine its magnitude or magnetic tunability. The interplay of structural symmetry, moment orientation, and carrier occupation is examined in a honeycomb model. Curvature maps and the band-summed dipole integrand reveal how velocity and the occupation window near the Fermi level select signed contributions. Removing threefold rotation permits a nonmagnetic dipole perpendicular to the surviving mirror. Generic magnetic reorientation activates the second component and tunes both components through positive and negative values. Global reversal preserves the dipole while reversing the intrinsic linear Hall conductivity, allowing a finite bulk dipole contribution from equally populated reversed domains under uniform-field averaging.A symmetry-constrained polynomial model predicts both dipole components for 256 held-out spin configurations, achieving coefficients of determination $R^2 > 0.9995$ at the reference chemical potential. At fixed carrier density, orientation-dependent shifts of the chemical potential modify the response and yield slightly larger prediction errors for the chosen model. Across the chemical-potential sweep,the prediction accuracy decreases more strongly for $D_y$,revealing an energy dependence of the surrogate's performance. Within semiclassical transport with a constant relaxation time, the calculated dipole determines the angular dependence of the quadratic current and its rectified and second-harmonic components. These results provide a quantitative representation of magnetic-orientation-dependent Berry-curvature dipoles and show how carrier occupation influences both the response and its predictability.", "url": "https://arxiv.org/abs/2610.28529", "type": "理论+数值", "summary": "即使线性霍尔响应消失，贝里曲率偶极子也可以产生非线性霍尔电流，但仅对称性并不能决定其大小或磁可调谐性。在蜂窝模型中检查结构对称性、力矩方向和载流子占据的相互作用。曲率图和能带求和偶极子被积函数揭示了费米能级附近的速度和占据窗口如何选择符号贡献。消除三重旋转允许非磁性偶极子垂直于幸存的镜子。通用磁重定向激活第二个组件并通过正值和负值调整两个组件。全局反转保留了偶极子，同时反转了固有的线性霍尔电导率，从而允许在均匀场平均下来自同等数量的反转域的有限体偶极子贡献。对称约束多项式模型可以预测 256 个保留自旋配置的两个偶极子分量，在参考化学势下实现确定系数 $R^2 > 0.9995$。\n\n在固定载流子密度下，化学势的方向相关变化会修改响应，并为所选模型产生稍大的预测误差。在化学势扫描过程中，$D_y$ 的预测精度下降得更厉害，揭示了替代物性能的能量依赖性。在具有恒定弛豫时间的半经典输运中，计算出的偶极子确定了二次电流及其整流和二次谐波分量的角度依赖性。这些结果提供了磁取向相关的贝里曲率偶极子的定量表示，并显示了载流子占据如何影响响​​应及其可预测性。", "authors": [{"name": "Jyotirmoy Sau"}], "featured_authors": [{"name": "Jyotirmoy Sau"}], "author_count": 1}, {"id": "2610.27007", "category": "hep-th", "title": "An Algebraic Formulation of Thermality in Nested Rindler Wedges", "abstract": "Padmanabhan and Kolekar had demonstrated the phenomenon of recursive thermality in two dimensional free field theories where the Rindler vacuum appears thermal to an observer accelerated with respect to the Rindler observer. We study the same construction at an algebraic level for conformal field theories. At each step, a parent wedge is conformally mapped to a reference Minkowski spacetime, where a new right Rindler wedge and its left sibling are selected. We illustrate that under the Bisognano--Wichmann property, thermality holds at every generation: the state associated with a parent wedge becomes a KMS state when restricted to its right child. Further, using the modular structure of the wedge and its causal sibling, we identify the sibling algebra with the modular commutant and derive the corresponding recursive modular flow explicitly.", "url": "https://arxiv.org/abs/2610.27007", "type": "理论", "summary": "Padmanabhan 和 Kolekar 证明了二维自由场理论中的递归热度现象，其中 Rindler 真空对于相对于 Rindler 观察者加速的观察者来说似乎是热的。我们在代数层面研究共形场论的相同构造。在每一步中，父楔都被共形映射到参考 Minkowski 时空，其中选择新的右 Rindler 楔及其左兄弟。我们说明，在 Bisognano-Wichmann 属性下，热性在每一代都成立：与父楔相关的状态在仅限于其右子楔时变为 KMS 状态。此外，利用楔形及其因果同级的模结构，我们用模交换子识别同级代数，并显式地推导相应的递归模流。", "authors": [{"name": "Waheed A. Dar"}, {"name": "Prince A. Ganai"}, {"name": "Nirmalya Kajuri"}], "featured_authors": [{"name": "Waheed A. Dar"}, {"name": "Prince A. Ganai"}, {"name": "Nirmalya Kajuri"}], "author_count": 3}, {"id": "2610.27054", "category": "hep-th", "title": "Nambu-Goldstone Bosons and Quantum Fisher Information", "abstract": "The quantum Fisher matrix and geometric tensor are powerful tools for quantifying the nature of quantum systems. Unfortunately, the formalism needed to compute these quantities is opaque and has limited the development of physical intuition for their behavior, even in the ground state. For quantum systems with continuous symmetries, we know the ground state can be understood in a model-independent and intuitive way from the correlation functions of conserved currents and charges. In this paper, we demonstrate an equivalence between the quantum Fisher matrix associated with the ground states of systems with continuous symmetries and the Nambu-Goldstone. bosons produced by broken generators. We will show that the information metric defined by the Fisher matrix is the same as the Zamolodchikov metric that defines the coset space of the system. Next we show that the Uhlmann curvature associated with multi-parameter estimation is the same as the charge density matrix that defines the difference between type-A and type-B Nambu-Goldstone bosons. We demonstrate these connections in several examples and discuss the generalization to finite temperature.", "url": "https://arxiv.org/abs/2610.27054", "type": "理论", "summary": "量子费希尔矩阵和几何张量是量化量子系统性质的强大工具。不幸的是，计算这些量所需的形式主义是不透明的，并且限制了它们行为的物理直觉的发展，即使在基态下也是如此。对于具有连续对称性的量子系统，我们知道可以通过守恒电流和电荷的相关函数以与模型无关且直观的方式理解基态。在本文中，我们证明了与连续对称系统的基态相关的量子费希尔矩阵与南部-戈德斯通矩阵之间的等价性。由损坏的发电机产生的玻色子。我们将证明 Fisher 矩阵定义的信息度量与定义系统陪集空间的 Zamolodchikov 度量相同。接下来我们证明与多参数估计相关的乌尔曼曲率与定义 A 型和 B 型 Nambu-Goldstone 玻色子之间差异的电荷密度矩阵相同。我们在几个例子中演示了这些联系，并讨论了有限温度的推广。", "authors": [{"name": "Eugene Chen"}, {"name": "Daniel Green"}], "featured_authors": [{"name": "Eugene Chen"}, {"name": "Daniel Green"}], "author_count": 2}, {"id": "2610.27058", "category": "hep-th", "title": "Scale-separated AdS vacua on Riemann-Flat Manifolds", "abstract": "Supergravity compactifications supported by fluxes and Casimir energy offer a simple strategy to concoct explicit, controlled and isolated vacua with parametric scale separation and soft supersymmetry breaking. Exploiting the special properties of both the Casimir and flux potentials with respect to Laplacian operators in moduli space, we prove that the simplest such class of solutions, given by toroidal compactifications of eleven-dimensional supergravity threaded by any fluxes, always exhibit perturbative instabilities in the form of tachyonic modes below the BF bound. This no-go theorem applies to any toroidal supergravity compactification supported by $p$-form fluxes. We also study compactifications on more general Riemann-flat manifolds (RFM's). Concretely, we find a tachyon-free AdS$_4$ vacuum by compactifying M-Theory on a $T^7/\\mathbb{Z}_2^3$. This constitutes the first ever example of a fully top-down, perturbatively stable, scale-separated AdS without localized sources.", "url": "https://arxiv.org/abs/2610.27058", "type": "理论", "summary": "由通量和卡西米尔能量支持的超重力致密化提供了一种简单的策略，通过参数尺度分离和软超对称破缺来构造显式的、受控的和隔离的真空。利用卡西米尔和通量势相对于模空间中拉普拉斯算子的特殊性质，我们证明了最简单的此类解，由任何通量穿过的十一维超重力的环形紧致化给出，总是以低于 BF 界的快子模式的形式表现出微扰不稳定性。这个不可行定理适用于任何由 $p$ 形式通量支持的环形超重力致密化。我们还研究了更一般的黎曼平坦流形（RFM）的紧化。具体来说，我们通过在 $T^7/\\mathbb{Z}_2^3$ 上压缩 M 理论找到了一个无快子的 AdS$_4$ 真空。这是第一个完全自上而下、扰动稳定、尺度分离、没有本地源的 AdS 的例子。", "authors": [{"name": "Miquel Aparici"}, {"name": "Ivano Basile"}, {"name": "Bruno Valeixo Bento"}, {"name": "Miguel Montero"}], "featured_authors": [{"name": "Miquel Aparici"}, {"name": "Ivano Basile"}, {"name": "Bruno Valeixo Bento"}, {"name": "Miguel Montero"}], "author_count": 4}, {"id": "2610.27063", "category": "hep-th", "title": "Bilocal flows and universality with field-dependent regulators", "abstract": "Many functional renormalization group flows employ a regulator that depends on the fields, as in proper-time and spectrally adjusted flows and in background-independent formulations of gauge theories and quantum gravity. Such a regulator generates additional terms in the flow, and their omission may spoil universality. We introduce bilocal flows, in which the effective action depends on the field and on the cutoff kernel as independent variables. The construction identifies the additional terms, and an exact sum rule shows that the first nontrivial coefficient of the anomalous dimension coincides with that of a fixed-regulator flow for every admissible regulator profile, so that universality is restored. For massless $\\lambda\\phi^4$ theory with a proper-time regulator, the reduced flow gives a profile-dependent anomalous dimension, while the completed flow gives the universal two-loop coefficient $C_\\eta=1/6$ for every profile.", "url": "https://arxiv.org/abs/2610.27063", "type": "理论", "summary": "许多功能重正化群流采用取决于场的调节器，例如在原时和光谱调整流以及规范理论和量子引力的背景无关公式中。这样的调节器会在流程中产生附加项，并且它们的省略可能会破坏通用性。我们引入双局部流，其中有效作用取决于场和截止核作为自变量。该结构识别了附加项，并且精确求和规则表明异常维度的第一个非平凡系数与每个可接受的调节器轮廓的固定调节器流量的系数一致，从而恢复了普适性。对于具有原时调节器的无质量 $\\lambda\\phi^4$ 理论，减少的流量给出了与轮廓相关的异常尺寸，而完整的流量给出了每个轮廓的通用二环系数 $C_\\eta=1/6$。", "authors": [{"name": "Alfio M. Bonanno"}, {"name": "Renata Ferrero"}], "featured_authors": [{"name": "Alfio M. Bonanno"}, {"name": "Renata Ferrero"}], "author_count": 2}, {"id": "2610.27072", "category": "hep-th", "title": "Deconfinement on $\\mathbb{Z}_{F}$ and Axion Domain Walls", "abstract": "We investigate the nontrivial dynamics on $\\mathbb{Z}_{F}$ domain walls and compute their tension in quantum chromodynamics (QCD) compactified on a circle with $N$ colors and $F < N$ massless fundamental flavors. In the process, we obtain insights on the $\\eta'$ meson's potential in a regime where it is heavy and comparable in mass to other QCD resonances, as in Nature. We employ a center-stabilized compactification of QCD on a small circle of size $L$ with color-flavor twisted boundary conditions for the quarks. We demonstrate that probe particles in color representations of $N$-ality $N/\\mathrm{gcd}(N,F)$ are deconfined on the $\\mathbb{Z}_{F}$ domain walls whenever $N$ and $F$ are not coprime. This is reminiscent of deconfinement on axion domain walls in pure Yang--Mills. Finally, in the double scaling limit $N\\rightarrow \\infty$ keeping $NL$ and $F$ fixed, the infrared spectrum spans an emergent dimension. We establish that the $\\mathbb{Z}_{F}$ domain walls are dual to electrostatic charge distributions in this emergent dimension. This duality allows us to compute their tension analytically and find a different tension scaling at large-$N$ between $\\mathbb{Z}_{F}$ domain walls in QCD and axion domain walls in pure Yang--Mills, in center-stabilized compactifications.", "url": "https://arxiv.org/abs/2610.27072", "type": "理论", "summary": "我们研究了 $\\mathbb{Z}_{F}$ 域壁上的非平凡动力学，并计算了它们在具有 $N$ 颜色和 $F < N$ 无质量基本味道的圆上压缩的量子色动力学 (QCD) 中的张力。在此过程中，我们深入了解了 $\\eta'$ 介子在重且质量与其他 QCD 共振相当的状态下的潜力，就像自然界中的那样。我们在大小为 $L$ 的小圆上采用中心稳定的 QCD 紧致化，并为夸克提供颜色风味扭曲边界条件。我们证明，只要 $N$ 和 $F$ 不互质，$N$-ality $N/\\mathrm{gcd}(N,F)$ 颜色表示中的探针粒子就会被解除限制在 $\\mathbb{Z}_{F}$ 域壁上。这让人想起纯阳米尔斯轴子域壁上的解禁。最后，在双尺度限制 $N\\rightarrow \\infty$ 中保持 $NL$ 和 $F$ 固定，红外光谱跨越一个涌现维度。我们确定 $\\mathbb{Z}_{F}$ 磁畴壁与这个新兴维度中的静电荷分布是对偶的。\n\n这种对偶性使我们能够分析计算它们的张力，并在中心稳定致密化中找到 QCD 中的 $\\mathbb{Z}_{F}$ 畴壁和纯杨米尔斯中的轴子畴壁之间的大 $N$ 处不同的张力缩放。", "authors": [{"name": "Paolo Bilisco"}, {"name": "Raffaele Tito D'Agnolo"}, {"name": "Arthur Platschorre"}, {"name": "Pablo Sesma"}], "featured_authors": [{"name": "Paolo Bilisco"}, {"name": "Raffaele Tito D'Agnolo"}, {"name": "Arthur Platschorre"}, {"name": "Pablo Sesma"}], "author_count": 4}, {"id": "2610.27073", "category": "hep-th", "title": "Gravitational Path Integral and String Theory", "abstract": "Gravitational path integral has had many applications in recent years. Using the example of supersymmetric index, which provides one of the most controlled tests of gravitational path integral, we argue that even in this controlled case, naive gravitational path integral cannot produce consistent results beyond low orders. However one can go further using stringy inputs, e.g. the choice of UV cut-off and the choice of correct path integration variable, without having to do full fledged string calculation. We also discuss to what extent we are led to string scale UV cut-off even if we begin with a supergravity theory without an a priori bias towards string theory. This is a review of mostly published results, but we clarify several details.", "url": "https://arxiv.org/abs/2610.27073", "type": "理论", "summary": "近年来，引力路径积分有很多应用。以超对称指数为例，它提供了最受控的引力路径积分测试之一，我们认为即使在这种受控情况下，朴素引力路径积分也无法产生低阶以外的一致结果。然而，我们可以进一步使用字符串输入，例如UV 截止的选择和正确路径积分变量的选择，而无需进行完整的字符串计算。我们还讨论了即使我们从超重力理论开始而没有先验地偏向弦理论，我们也会在多大程度上导致弦尺度的紫外线截止。这是对大部分已发表结果的回顾，但我们澄清了一些细节。", "authors": [{"name": "Ashoke Sen"}], "featured_authors": [{"name": "Ashoke Sen"}], "author_count": 1}, {"id": "2610.27074", "category": "hep-th", "title": "Classical solitons in anti-self-dual Yang-Mills theory", "abstract": "We study classical soliton solutions in split-signature anti-self-dual Yang-Mills theory. Using Zakharov's dressing method, we construct rational lump solitons, which are localised near two-dimensional surfaces, and wall solitons, which have codimension one. We further describe multi-phase solutions which have multiple walls meeting at trivalent junctions and form four-dimensional foam-like structures. Two-pole solutions describe soliton interactions and we find non-trivial colour-dressed phase shifts for wall interactions. We consider the four-dimensional analogue of Ward's lump scattering for the restricted kinematics of coincident poles and show that there are non-trivial interactions in the collinear limit. Finally, we show that the determinant of the soliton matrix provides a $\\tau$-function which acts as a potential for gauge-invariant scalar quantities such as the Yang-Mills Lagrangian density.", "url": "https://arxiv.org/abs/2610.27074", "type": "理论", "summary": "我们研究分裂签名反自对偶杨米尔斯理论中的经典孤子解。使用扎哈罗夫的修整方法，我们构造了有理块孤子（其位于二维表面附近）和壁孤子（其余维为一）。我们进一步描述了多相解决方案，其具有在三价连接处相遇并形成四维泡沫状结构的多个壁。两极解描述了孤子相互作用，我们发现壁相互作用的不平凡的色彩修饰相移。我们考虑了重合极点受限运动学的 Ward 集总散射的四维模拟，并表明在共线极限中存在非平凡的相互作用。最后，我们证明孤子矩阵的行列式提供了一个 $\\tau$ 函数，它可以作为规范不变标量（例如杨-米尔斯拉格朗日密度）的潜力。", "authors": [{"name": "Tristan McLoughlin"}], "featured_authors": [{"name": "Tristan McLoughlin"}], "author_count": 1}, {"id": "2610.27077", "category": "hep-th", "title": "Flux Vacua, Asymptotic Periods, and Relatively Anosov Representations", "abstract": "We develop a topological method to detect classical flux vacua of M-theory on Calabi-Yau fourfolds with a single complex structure modulus using only asymptotic period data and monodromy information. To this end, we express the index of the F-term of the flux superpotential as a winding number along the boundary of the universal cover of the complex structure moduli space. The index evaluates to a sum over zeros and poles of a suitably normalized boundary F-term, where local contributions can be computed algebraically on a dense set of boundary points. Assuming a conjectured bound on the remaining contributions, sufficiently many sign changes of the boundary F-term guarantee a flux vacuum in the interior. We illustrate the method on the mirror Fermat sextic with explicit examples and a systematic flux scan. A main technical ingredient in our construction is a continuity result for projective period maps: we prove that the non-holomorphic (3,1)-period map extends continuously to the boundary of the covering space if the monodromy representation is relatively Anosov. In general, this property does not hold for holomorphic (4,0)-periods.", "url": "https://arxiv.org/abs/2610.27077", "type": "理论", "summary": "我们开发了一种拓扑方法，仅使用渐近周期数据和单峰信息来检测具有单一复结构模量的 Calabi-Yau 四重体上 M 理论的经典通量真空。为此，我们将磁通超势的 F 项指数表示为沿着复结构模空间的通用覆盖边界的绕数。该指数计算为适当归一化边界 F 项的零点和极点之和，其中局部贡献可以在一组密集的边界点上进行代数计算。假设剩余贡献有一个推测的界限，边界 F 项的足够多的符号变化保证了内部的通量真空。我们通过明确的例子和系统的通量扫描来说明镜面费马六次方的方法。我们构造中的一个主要技术要素是射影周期图的连续性结果：我们证明，如果单向表示是相对阿诺索夫的，则非全纯（3,1）周期图连续延伸到覆盖空间的边界。一般来说，该性质对于全纯 (4,0) 周期不成立。", "authors": [{"name": "Paul Balavoine"}, {"name": "Severin Lüst"}], "featured_authors": [{"name": "Paul Balavoine"}, {"name": "Severin Lüst"}], "author_count": 2}, {"id": "2610.27084", "category": "hep-th", "title": "IR extremality and UV softness in string bootstrap", "abstract": "Whether string amplitudes can be characterized by extremality within the space of consistent S-matrices is an intriguing question. We address this question within the framework of positivity bootstrap. We compute positivity bounds by minimizing the $F^4$ Wilson coefficient while fixing subleading coefficients, and show that the Veneziano amplitude lies close to the boundary of the allowed region. However, this numerical proximity does not imply exact extremality, as demonstrated by explicit counterexamples. When additional KLT-motivated UV softness is imposed, the Veneziano amplitude is found to uniquely minimize the $F^4$ coefficient for $4\\leq D\\leq10$, connecting the extremality of the Veneziano amplitude to its stringy UV behavior and offering a new perspective on what makes string theory special.", "url": "https://arxiv.org/abs/2610.27084", "type": "理论", "summary": "弦振幅是否可以通过一致 S 矩阵空间内的极值来表征是一个有趣的问题。我们在积极引导的框架内解决这个问题。我们通过最小化 $F^4$ Wilson 系数同时固定次领先系数来计算正性边界，并表明 Veneziano 幅度接近允许区域的边界。然而，正如明确的反例所证明的那样，这种数字接近并不意味着精确的极值。当施加额外的 KLT 驱动的 UV 柔软度时，我们发现 Veneziano 振幅可以唯一地最小化 $4\\leq D\\leq10$ 的 $F^4$ 系数，将 Veneziano 振幅的极值与其弦 UV 行为联系起来，并为弦理论的特殊性提供了新的视角。", "authors": [{"name": "Shi-Lin Wan"}, {"name": "Ji-Yang Wang"}, {"name": "Shuang-Yong Zhou"}], "featured_authors": [{"name": "Shi-Lin Wan"}, {"name": "Ji-Yang Wang"}, {"name": "Shuang-Yong Zhou"}], "author_count": 3}, {"id": "2610.27093", "category": "hep-th", "title": "AdS$_2$ from Type IIA on weak G$_2$ manifolds", "abstract": "We present and study supersymmetric warped ${\\rm AdS}_2 \\times {\\rm M}_7 \\times I$ solutions of Type IIA supergravity, where M$_7$ is a weak G$_2$ holonomy manifold. Locally, the solutions are characterized by a cubic polynomial. We distinguish two branches, Branch 1 and Branch 2, and analyze their global properties, taking flux quantization into account. At the endpoints of the interval $I$ they exhibit either OF1-plane or O8/D8 type of singularities with Branch 1 allowing also for a Spin(7) cone. In the case of zero Romans mass, Branch 1 uplifts to eleven dimensions to ${\\rm AdS}_4 \\times {\\rm M}_7$ whereas Branch 2 uplifts to warped ${\\rm AdS}_3 \\times {\\rm M}_7 \\times I$ with OM2-plane type of singularities.", "url": "https://arxiv.org/abs/2610.27093", "type": "理论", "summary": "我们提出并研究 IIA 型超引力的超对称扭曲 ${\\rm AdS}_2 \\times {\\rm M}_7 \\times I$ 解，其中 M$_7$ 是弱 G$_2$ 完整流形。局部解的特征在于三次多项式。我们区分两个分支，即分支 1 和分支 2，并分析它们的全局属性，同时考虑通量量化。在区间 $I$ 的端点处，它们表现出 OF1 平面或 O8/D8 类型的奇点，分支 1 也允许 Spin(7) 锥体。在罗马质量为零的情况下，分支 1 提升到 11 个维度，达到 ${\\rm AdS}_4 \\times {\\rm M}_7$，而分支 2 提升到扭曲的 ${\\rm AdS}_3 \\times {\\rm M}_7 \\times I$，具有 OM2 平面类型的奇点。", "authors": [{"name": "Niall T. Macpherson"}, {"name": "Achilleas Passias"}], "featured_authors": [{"name": "Niall T. Macpherson"}, {"name": "Achilleas Passias"}], "author_count": 2}, {"id": "2610.27097", "category": "hep-th", "title": "Mapping AdS$_4$ quantum gravity via the Bethe Ansatz formula", "abstract": "The topologically twisted index of 3d ADHM theory can be written as a sum over solutions to the Bethe Ansatz Equations (BAEs) of the XXZ-type model constructed from quantum toroidal $\\mathfrak{g}\\mathfrak{l}_1$. Via a novel numerical algorithm, we solve for all $p(N)$ physical solutions at $N\\leq 21$, where $p(N)$ denotes the number of integer partitions of $N$. Surveying these solutions, we find that in addition to the known \"1-cut\" solution dual to dyonic black holes, where the gauge holonomies are distributed along a single curve in the complex plane, there are \"dressed\" 1-cut solutions dual to combined configurations of the black hole and M2-branes, $m$-cut solutions dual to $\\mathbb{Z}_m$ orbifolds of the black hole, a discrete family of solutions interpolating between the 1-cut and 3-cut solutions, together with other exotic solutions, at each value of $N$. The free energy of the interpolating solutions cannot be matched with the on-shell action of any known bulk solution. The $1,2,3$-cut solutions and interpolating solutions all have a well-defined large $N$ limit, and their leading order distribution of gauge holonomies can be computed analytically. Whenever possible, we fit the contributions of the solutions to the index to all orders in the $1/N$ expansion with high-precision numerics, and extract the leading non-perturbative correction. With exceptions, these are matched with the results of equivariant localization in the bulk, and the action of wrapped M2-branes respectively.", "url": "https://arxiv.org/abs/2610.27097", "type": "理论", "summary": "3d ADHM 理论的拓扑扭曲指数可以写为由量子环形 $\\mathfrak{g}\\mathfrak{l}_1$ 构建的 XXZ 型模型的 Bethe Ansatz 方程（BAE）的解之和。通过一种新颖的数值算法，我们求解了 $N\\leq 21$ 处的所有 $p(N)$ 物理解，其中 $p(N)$ 表示 $N$ 的整数分区数。调查这些解决方案，我们发现，除了已知的双动力黑洞“1-切割”解决方案（其中规范完整性沿复平面中的单条曲线分布）外，还有对偶黑洞和 M2 膜的组合配置的“修饰”1-切割解决方案，对偶于黑洞的 $\\mathbb{Z}_m$ 轨道的 $m$-切割解决方案，在 1-切割和 1-切割之间插值的离散解决方案系列。 3 切解决方案以及其他奇特的解决方案，每个价值 $N$。插值溶液的自由能无法与任何已知本体溶液的壳上作用相匹配。 $1,2,3$-cut 解和插值解都具有明确定义的大 $N$ 限制，并且可以通过分析计算它们规范完整的主阶分布。\n\n只要有可能，我们就用高精度数值将索引解对索引的贡献拟合到 $1/N$ 扩展中的所有阶，并提取领先的非微扰校正。除例外情况外，这些结果分别与本体等变定位的结果以及包裹的 M2 膜的作用相匹配。", "authors": [{"name": "Cheng Peng"}, {"name": "Xuao Zhang"}, {"name": "Ziruo Zhang"}], "featured_authors": [{"name": "Cheng Peng"}, {"name": "Xuao Zhang"}, {"name": "Ziruo Zhang"}], "author_count": 3}, {"id": "2610.27098", "category": "hep-th", "title": "A group theoretic calculation of multi-invariants of some stabilizer states", "abstract": "We study multi-invariants---a multi-partite generalization of Renyi entropies---of simple stabilizer states, for an arbitrary replica symmetry group. We develop a group theoretic technique for evaluating such invariants, which operates on the replica group and involves counting intersections among its cosets. Our techniques streamline the calculations of multi-invariants for graph states with two GHZ-like nodes and for certain generalizations thereof. The methodology developed here is most suitable when the quantum state is simple but flexibility over the replica group is desired.", "url": "https://arxiv.org/abs/2610.27098", "type": "理论", "summary": "我们研究任意复制对称群的简单稳定态的多不变量（Renyi 熵的多部分推广）。我们开发了一种群论技术来评估此类不变量，该技术对副本群进行操作并涉及计算其陪集之间的交集。我们的技术简化了具有两个类 GHZ 节点的图状态的多重不变量的计算及其某些概括。当量子态简单但需要副本组的灵活性时，这里开发的方法最合适。", "authors": [{"name": "Bartlomiej Czech"}, {"name": "Yichen Feng"}, {"name": "Jonathan Harper"}, {"name": "Xin-Xiang Ju"}], "featured_authors": [{"name": "Bartlomiej Czech"}, {"name": "Yichen Feng"}, {"name": "Jonathan Harper"}, {"name": "Xin-Xiang Ju"}], "author_count": 4}, {"id": "2610.27246", "category": "hep-th", "title": "Realization of de Sitter spacetime in AdS/CFT", "abstract": "We construct horizonless, everywhere-regular solitons containing a de~Sitter core inside an asymptotically anti--de~Sitter spacetime, using an ordinary action of Einstein gravity, a Maxwell field, and a charged scalar. The object is a gravitating gauged $Q$-ball whose false-vacuum interior acts as a positive effective cosmological constant, sourcing an inner de~Sitter region joined through a thin wall to a charged, asymptotically AdS exterior. Two general requirements are emphasized: the scalar must lie in a near-false-vacuum (slow-roll--like) regime, and the exterior is driven to the extremal Reissner--Nordström--AdS locus in the thin-wall limit, in which the wall approaches the common would-be horizon. Since the solution is static and spherically symmetric, it may correspond to a semiclassical charge-$Q$ state of the dual CFT, realizing de~Sitter space approximately within a holographic theory. We also discuss free fluctuations whose de~Sitter--core modes appear as parametrically low-lying excitations above the state, bulk reconstruction, and the near-extremal regime, where finite-${\\mathcal N}$ effects are expected to cut off the formal classical throat and replace its independent free-field modes by an interacting near-throat sector.", "url": "https://arxiv.org/abs/2610.27246", "type": "理论", "summary": "我们利用爱因斯坦引力、麦克斯韦场和带电标量的普通作用，构造了无视界、处处规则的孤子，其中包含渐进反西特时空中的去西特核。该物体是一个引力测量的 $Q$ 球，其假真空内部充当正有效宇宙学常数，产生通过薄壁连接到带电渐近 AdS 外部的内部 de~Sitter 区域。强调了两个一般要求：标量必须处于接近假真空（类似慢滚）状态，并且外部被驱动到薄壁极限中的极值 Reissner-Nordström-AdS 轨迹，其中壁接近共同的潜在地平线。由于解是静态且球对称的，因此它可能对应于对偶 CFT 的半经典电荷 $Q$ 态，从而近似在全息理论内实现去西特空间。\n\n我们还讨论了自由涨落，其去西特核心模式表现为高于状态、体重构和近极值状态的参数低位激励，其中有限${\\mathcal N}$效应预计会切断形式的经典喉部，并用相互作用的近喉部扇区取代其独立的自由场模式。", "authors": [{"name": "Yasutaka Koga"}, {"name": "Keiju Murata"}, {"name": "Seiji Terashima"}], "featured_authors": [{"name": "Yasutaka Koga"}, {"name": "Keiju Murata"}, {"name": "Seiji Terashima"}], "author_count": 3}, {"id": "2610.27319", "category": "hep-th", "title": "Classical and Stochastic Trans-Planckian Censorship", "abstract": "The trans-Planckian censorship conjecture (TCC) limits inflation to a deadline of $N_{\\rm TCC}=\\ln(M_{\\rm Pl}/H_{\\rm end})$ e-folds. We formulate it in stochastic inflation as a bound at confidence $1-\\delta$ on the probability that a history outlasts the deadline, with three readings: one worldline, the region grown from one Hubble patch, and the reheated volume. Each reading becomes a closed-form condition, rigorous for a linear roll in leading-order stochastic inflation (for the region, in a branching model) and sharp at leading order in $N_{\\rm TCC}$: a linear roll whose classical history lasts $N_{\\rm cl}$ e-folds respects the TCC if $1-N_{\\rm cl}/N_{\\rm TCC}\\geq\\{2\\mathcal{P}_\\zeta[w+\\ln(1/\\delta)/N_{\\rm TCC}]\\}^{1/2}$, with $w=0$ for a worldline and $w=3$ for a region. On a linear slope without vacuum decay, the worldline and region readings are never weaker than the classical TCC, and on the CMB-normalized attractor all readings agree closely with it, so the bounds on the scale of inflation stand. A classical phase that ends in a flat quantum well, which the overdamped classical TCC excludes, is allowed with a margin of a few e-folds per worldline. Near the onset of eternal inflation, the readings differ. On a linear slope, a region must leave the fraction $\\sqrt{6\\mathcal{P}_\\zeta}$ of the deadline unused at leading order: eternal inflation is excluded for every classical history that uses a finite fraction of the deadline, as is a band of non-eternal slopes, and the slope bound becomes $|V'|>V^{3/2}/[\\sqrt2\\,\\pi(1-N_{\\rm cl}/N_{\\rm TCC})]$. Per worldline, every slope is allowed, given a margin of a few standard deviations. A false vacuum must decay at about the eternal threshold $\\Gamma=9H^4/(4\\pi)$ or faster for a region or the volume, but only faster than $3H^4\\ln(1/\\delta)/(4\\pi N_{\\rm TCC})$ per worldline. Whether the TCC forbids eternal inflation depends on the reading.", "url": "https://arxiv.org/abs/2610.27319", "type": "理论", "summary": "跨普朗克审查猜想 (TCC) 将通货膨胀限制在 $N_{\\rm TCC}=\\ln(M_{\\rm Pl}/H_{\\rm end})$ e 倍的期限内。我们将其以随机通货膨胀的形式表示为历史超过最后期限的概率的置信度 $1-\\delta$ 的界限，具有三个读数：一个世界线、从一个哈勃补丁增长的区域以及重新加热的体积。每个读数都成为一个封闭形式条件，对于前导随机膨胀中的线性滚动（对于该区域，在分支模型中）是严格的，并且在 $N_{\\rm TCC}$ 中的前导顺序上是尖锐的：一个线性滚动，其经典历史持续 $N_{\\rm cl}$ 如果 $1-N_{\\rm cl}/N_{\\rm ，则 e-folds 尊重 TCC TCC}\\geq\\{2\\mathcal{P}_\\zeta[w+\\ln(1/\\delta)/N_{\\rm TCC}]\\}^{1/2}$，其中 $w=0$ 表示世界线，$w=3$ 表示区域。在没有真空衰变的线性斜率上，世界线和区域读数绝不会弱于经典 TCC，并且在 CMB 归一化吸引子上，所有读数都与其密切一致，因此暴胀规模的界限成立。以平坦量子阱结束的经典相（过阻尼经典 TCC 排除了这一点）是允许的，每个世界线有几个 e 折叠的余量。\n\n在永恒通货膨胀即将开始时，读数会有所不同。在线性斜率上，一个区域必须将截止日期的分数 $\\sqrt{6\\mathcal{P}_\\zeta}$ 以领先顺序保留为未使用：对于使用截止日期的有限分数的每个经典历史，永恒膨胀被排除在外，非永恒斜率带也是如此，并且斜率界限变为 $|V'|>V^{3/2}/[\\sqrt2\\,\\pi(1-N_{\\rm cl}/N_{\\rm TCC})]$。根据世界线，每个坡度都是允许的，但有几个标准偏差的余量。对于某个区域或体积，虚假真空必须以大约永恒阈值 $\\Gamma=9H^4/(4\\pi)$ 或更快的速度衰减，但每个世界线的速度只能快于 $3H^4\\ln(1/\\delta)/(4\\pi N_{\\rm TCC})$。 TCC是否禁止永恒的通货膨胀取决于读数。", "authors": [{"name": "Omer Guleryuz"}], "featured_authors": [{"name": "Omer Guleryuz"}], "author_count": 1}, {"id": "2610.27420", "category": "hep-th", "title": "Pfaffian solutions to the Ernst equation", "abstract": "We show that the Yamazaki-Hori solution to the Ernst equation can be represented in the Pfaffian form. We also discuss the consequences of this result for Nakamura's conjecture on the relation between the Ernst equation and the 2D Toda model.", "url": "https://arxiv.org/abs/2610.27420", "type": "理论", "summary": "我们证明 Ernst 方程的 Yamazaki-Hori 解可以用 Pfaffian 形式表示。我们还讨论了这个结果对 Nakamura 关于 Ernst 方程和 2D Toda 模型之间关系的猜想的影响。", "authors": [{"name": "Arsen Melikyan"}, {"name": "Aleksandr Pinzul"}], "featured_authors": [{"name": "Arsen Melikyan"}, {"name": "Aleksandr Pinzul"}], "author_count": 2}, {"id": "2610.27511", "category": "hep-th", "title": "Holographic Reconstruction from Broken Conformal Gauge Symmetry", "abstract": "We investigate bulk--boundary structures in $\\AdS_4/\\CFT_3$ from the viewpoint of gravity as a broken phase of conformal gauge symmetry. A crucial distinction is made between the Euler and Pontryagin characteristic classes. The gauge-theoretic gravitational action contains an Euler sector, whose total-derivative representation gives a boundary form depending on both intrinsic and extrinsic geometry. This structure is different from the Pontryagin descent to the three-dimensional gravitational Chern--Simons functional, whose metric variation gives the Cotton tensor and underlies the mixed boundary conditions studied by de Haro. We perform a Fefferman--Graham expansion of the Euler boundary form in asymptotically $\\AdS_4$ spacetime. The normalizable coefficient $g_{(3)ij}$ does not contribute linearly to the finite Euler boundary term: its contribution from the cubic extrinsic- curvature sector vanishes by $\\mathrm{Tr}\\,g_{(3)}=0$, while curvature-- extrinsic-curvature terms containing $g_{(3)}$ vanish at the conformal boundary. A direct Codazzi analysis additionally shows that the Cotton tensor appears in the asymptotic mixed curvature but its contribution through the tangential-connection boundary variation vanishes for standard Dirichlet data. This indicates two distinct types of bulk--boundary structure: a global/topological Euler relation and a local Pontryagin--Cotton relation. We distinguish this kinematic Cotton appearance from a finite Cotton boundary response and discuss the implications for holographic reconstruction.", "url": "https://arxiv.org/abs/2610.27511", "type": "理论", "summary": "我们从重力的角度研究 $\\AdS_4/\\CFT_3$ 中的块体边界结构，将其视为共形规范对称性的破缺相。欧拉和庞特里亚金特征类之间存在重要区别。规范理论引力作用包含一个欧拉扇区，其全导数表示给出了取决于内在和外在几何形状的边界形式。这种结构不同于三维引力 Chern-Simons 泛函的 Pontryagin 下降，后者的度量变分给出了 Cotton 张量，并且是 de Haro 研究的混合边界条件的基础。我们在渐近 $\\AdS_4$ 时空中执行欧拉边界形式的 Fefferman-Graham 展开。可归一化系数 $g_{(3)ij}$ 对有限欧拉边界项不是线性贡献：其来自三次外在曲率扇区的贡献在 $\\mathrm{Tr}\\,g_{(3)}=0$ 处消失，而包含 $g_{(3)}$ 的曲率-外在曲率项在共形边界处消失。\n\n直接 Codazzi 分析还表明，Cotton 张量出现在渐近混合曲率中，但其通过切向连接边界变化的贡献对于标准 Dirichlet 数据消失了。这表明了两种不同类型的体边界结构：全局/拓扑欧拉关系和局部庞特里亚金-科顿关系。我们将这种运动学棉花外观与有限棉花边界响应区分开来，并讨论对全息重建的影响。", "authors": [{"name": "Takeshi Fukuyama"}], "featured_authors": [{"name": "Takeshi Fukuyama"}], "author_count": 1}, {"id": "2610.27667", "category": "hep-th", "title": "Learning the open string spectrum with neural networks", "abstract": "The tree-level open superstring has an integer mass-squared spectrum on linear Regge trajectories. To what extent is this fixed by consistency conditions: locality, analyticity, crossing, unitarity together with the requirement that $2\\to2$ scattering minimize the entanglement it generates? Using the local two-channel crossing symmetric dispersion relation with one-parameter ambiguity ($\\lambda$-CSDR) we set up a bootstrap treating both the mass-squared spectrum and the partial-wave coefficients as unknowns which lets the machine learning algorithm to learn the mass-squared spectrum and partial-wave coefficients simultaneously, going beyond earlier work in which the spectrum was fixed. Using the local three-channel crossing symmetric dispersion relation with one-parameter ambiguity we obtain, within the class of amplitudes with soft Regge behavior and infinite higher-spin tower, a bound on the leading Wilson coefficients that we compare with existing bounds and trace to spin-0 dominance. We locate the Virasoro-Shapiro amplitude in the allowed region of the Wilson coefficients space. For amplitudes with two-channel crossing symmetry we find that a Non-dual amplitude exhibits a Polchinski-Strassler type transition from Regge to power-law behavior.", "url": "https://arxiv.org/abs/2610.27667", "type": "理论", "summary": "树级开放超弦在线性 Regge 轨迹上具有整数质量平方谱。这在多大程度上是由一致性条件决定的：局域性、解析性、交叉性、幺正性以及 $2\\to2$ 散射最小化其产生的纠缠的要求？利用具有单参数模糊度的局部双通道交叉对称色散关系（$\\lambda$-CSDR），我们建立了一个将质量平方谱和部分波系数视为未知数的引导程序，这使得机器学习算法能够同时学习质量平方谱和部分波系数，超越了早期固定频谱的工作。使用具有单参数模糊度的局部三通道交叉对称色散关系，我们在具有软 Regge 行为和无限高自旋塔的幅度类别内获得了领先威尔逊系数的界限，我们将其与现有界限进行比较并追踪到自旋 0 优势。我们将 Virasoro-Shapiro 振幅定位在 Wilson 系数空间的允许区域内。\n\n对于具有双通道交叉对称性的幅度，我们发现非对偶幅度表现出从 Regge 到幂律行为的 Polchinski-Strassler 类型转变。", "authors": [{"name": "Debapriyo Chowdhury"}], "featured_authors": [{"name": "Debapriyo Chowdhury"}], "author_count": 1}, {"id": "2610.27824", "category": "hep-th", "title": "Thermodynamic Supercritical Scaling Law for the charged Gauss-Bonnet AdS Black Hole", "abstract": "The phase structure of the charged Gauss-Bonnet AdS black holes varies with the spacetime dimension. Within an appropriate parameter range, only the six-dimensional case admits two physical critical points and it is an ideal model for investigating supercritical thermodynamics in black hole systems with multiple critical points. In this study, we investigate the supercritical thermodynamic properties of this model in the extended phase space and construct the supercritical phase diagrams associated with the two critical points. The thermodynamic supercritical scaling analysis for the supercritical crossover lines in the vicinity of both critical points is completed, demonstrating universality. The corresponding coefficients for the external field scaling and the order parameter scaling are obtained, and their physical significance is discussed.", "url": "https://arxiv.org/abs/2610.27824", "type": "理论", "summary": "带电高斯-邦尼特 AdS 黑洞的相结构随时空维度的变化而变化。在适当的参数范围内，只有六维情况允许两个物理临界点，是研究多临界点黑洞系统超临界热力学的理想模型。在本研究中，我们研究了该模型在扩展相空间中的超临界热力学性质，并构建了与两个临界点相关的超临界相图。完成了两个临界点附近超临界交叉线的热力学超临界标度分析，证明了普适性。得到了相应的外场标度和阶次参数标度系数，并讨论了它们的物理意义。", "authors": [{"name": "Jia-Yi Xia"}, {"name": "Zhen-Ming Xu"}], "featured_authors": [{"name": "Jia-Yi Xia"}, {"name": "Zhen-Ming Xu"}], "author_count": 2}, {"id": "2610.27853", "category": "hep-th", "title": "Free-field realizations of $\\mathcal{N} = 1$ supersymmetric $\\mathcal{W}$-algebras associated with Lie superalgebras $B (n - 1 , n)$ and $B (n , n)$", "abstract": "We extend the recursive construction of free-field realizations proposed by Ide, Ito, and Miyazaki to the $\\mathcal{N} = 1$ supersymmetric $\\mathcal{W}$-algebras $\\mathcal{SW} B (n - 1 , n)$ and $\\mathcal{SW} B (n , n)$, associated with the Lie superalgebras $B (n - 1 , n)$ and $B (n , n)$, respectively. We obtain explicit free-field realizations of $\\mathcal{SW} B (0 , 1)$, $\\mathcal{SW} B (1 , 1)$, $\\mathcal{SW} B (1 , 2)$, and $\\mathcal{SW} B (2 , 2)$. In particular, the realizations of $\\mathcal{SW} B (1 , 2)$ and $\\mathcal{SW} B (2 , 2)$ are new. Using these realizations, we compute central charges, conformal weights, and eigenvalues of the generating currents on free-field highest-weight states, and construct the local integrals of motion $I_1$, $I_3$, and $I_5$.", "url": "https://arxiv.org/abs/2610.27853", "type": "理论", "summary": "我们将 Ide、Ito 和 Miyazaki 提出的自由场实现的递归构造扩展到 $\\mathcal{N} = 1$ 超对称 $\\mathcal{W}$-代数 $\\mathcal{SW} B (n - 1 , n)$ 和 $\\mathcal{SW} B (n , n)$，与李超代数 $B (n - 1 , n)$ 和分别为$B(n,n)$。我们获得了 $\\mathcal{SW} B (0 , 1)$、$\\mathcal{SW} B (1 , 1)$、$\\mathcal{SW} B (1 , 2)$ 和 $\\mathcal{SW} B (2 , 2)$ 的显式自由场实现。特别是 $\\mathcal{SW} B (1 , 2)$ 和 $\\mathcal{SW} B (2 , 2)$ 的实现是新的。利用这些实现，我们计算自由场最高权重状态上的中心电荷、共形权重和生成电流的特征值，并构造运动的局部积分 $I_1$、$I_3$ 和 $I_5$。", "authors": [{"name": "Naozumi Tanabe"}], "featured_authors": [{"name": "Naozumi Tanabe"}], "author_count": 1}, {"id": "2610.27926", "category": "hep-th", "title": "Monodromy line defects on the fuzzy sphere", "abstract": "Monodromy line defects are of interest in the defect bootstrap program and are dual to electrically charged objects in dual gauge field descriptions. We investigate the Ising monodromy dCFT using a fuzzy sphere regularization, by imposing the twisted boundary condition in the UV. We obtain defect scaling dimensions $\\hat \\Delta$ and ratios of defect operator expansion (DOE) coefficients using this method. We extend this machinery to the continuous family of $O(2)$ monodromy defects with twist angle $2\\pi\\nu$. In both cases, the lowest neutral defect scalar lies above dimension one, providing evidence that the monodromy defect reaches a stable dCFT without additional fine tuning.", "url": "https://arxiv.org/abs/2610.27926", "type": "理论", "summary": "单峰线缺陷在缺陷引导程序中很有趣，并且在双规范场描述中与带电物体是对偶的。我们通过在 UV 中施加扭曲边界条件，使用模糊球正则化研究伊辛单峰 dCFT。我们使用这种方法获得缺陷缩放尺寸 $\\hat \\Delta$ 和缺陷算子扩展 (DOE) 系数的比率。我们将此机制扩展到扭转角为 $2\\pi\\nu$ 的 $O(2)$ 单一性缺陷的连续族。在这两种情况下，最低的中性缺陷标量都位于一维之上，这提供了单性缺陷无需额外微调即可达到稳定 dCFT 的证据。", "authors": [{"name": "Jiangyuan Qian"}], "featured_authors": [{"name": "Jiangyuan Qian"}], "author_count": 1}, {"id": "2610.27991", "category": "hep-th", "title": "Non-minimal unimodular inflation revisited: Swampland diagnostics and CMB constraints", "abstract": "We study non-minimal unimodular inflation in the Einstein frame; the effective potential takes the form $U(\\varphi)=U_0(1+\\xi\\varphi^2/\\mpl^2)^{-2}$. We consider the canonical field map and the inflationary observables directly from the Einstein-frame action. The exact potential slow-roll parameters, the leading scalar running, the scalar-amplitude normalization, the e-fold relation, and the end-of-inflation condition are obtained analytically. The model has a nontrivial structural tension: an $\\epsilon_V=1$ exit requires $\\xi>1/2$, whereas the near-origin slow-roll regime requires $\\xi\\ll1$ and gives $n_s\\simeq1-8\\xi$. We next test three distinct swampland diagnostics. The further-refined de Sitter conjecture (FRDSSC) introduces the independent conjectural parameters $a$, $b$, and $q$, while the scalar weak gravity conjecture (SWGC) and its strong form (SSWGC) contain no analogous tunable conjecture parameter in the single-field realization adopted here. All three criteria are evaluated using the canonically normalized Einstein-frame scalar. Analytic limits show that the SWGC is violated at the stationary point for every nonzero $\\xi$, whereas the SSWGC at that point requires $\\xi\\gtrsim0.0643$. In the large-field limit both scalar weak-gravity diagnostics reduce to the same threshold $\\xi\\ge0.1$. Numerical scans then show that the observationally relevant ACT/P-ACT region does not satisfy either scalar weak-gravity criterion, while the FRDSSC can be satisfied for $a$ close to unity. Consequently, the minimal model can reproduce acceptable $(n_s,r)$ at isolated field values, but this does not constitute a complete 50-60 e-fold inflationary history or simultaneous satisfaction of all three conjectures.", "url": "https://arxiv.org/abs/2610.27991", "type": "理论", "summary": "我们研究爱因斯坦框架中的非最小单模膨胀；有效势的形式为 $U(\\varphi)=U_0(1+\\xi\\varphi^2/\\mpl^2)^{-2}$。我们直接从爱因斯坦框架的作用中考虑正则场图和暴胀可观测量。解析地获得了准确的潜在慢滚参数、前导标量运行、标量振幅归一化、e倍关系和膨胀结束条件。该模型具有重要的结构张力：$\\epsilon_V=1$ 退出需要 $\\xi>1/2$，而近原点慢滚机制需要 $\\xi\\ll1$ 并给出 $n_s\\simeq1-8\\xi$。接下来我们测试三种不同的沼泽地诊断。进一步细化的德西特猜想（FRDSSC）引入了独立的猜想参数$a$、$b$和$q$，而标量弱重力猜想（SWGC）及其强形式（SSWGC）在此处采用的单场实现中不包含类似的可调谐猜想参数。所有三个标准均使用规范标准化爱因斯坦框架标量进行评估。\n\n分析极限表明，对于每个非零 $\\xi$，在驻点处都会违反 SWGC，而该点的 SSWGC 则需要 $\\xi\\gtrsim0.0643$。在大场限制中，两个标量弱重力诊断都降低到相同的阈值$\\xi\\ge0.1$。然后数值扫描表明，观测相关的 ACT/P-ACT 区域不满足标量弱重力标准，而 FRDSSC 可以满足接近统一的 $a$。因此，最小模型可以在孤立场值处重现可接受的 $(n_s,r)$，但这并不构成完整的 50-60 e 倍膨胀历史或同时满足所有三个猜想。", "authors": [{"name": "Saeed Noori Gashti"}, {"name": "Mohammad Reza Alipour"}, {"name": "Mohammad Ali S. Afshar"}, {"name": "Behnam Pourhassan"}, {"name": "İzzet Sakallı"}, {"name": "Phongpichit Channuie"}], "featured_authors": [{"name": "Saeed Noori Gashti"}, {"name": "Mohammad Reza Alipour"}, {"name": "Mohammad Ali S. Afshar"}, {"name": "Behnam Pourhassan"}, {"name": "İzzet Sakallı"}, {"name": "Phongpichit Channuie"}], "author_count": 6}, {"id": "2610.28065", "category": "hep-th", "title": "Reconstructing the Goldberg-Palatini Action from Noether Identities", "abstract": "We investigate the reconstruction of the first-order gravitational action from the Noether identities associated with diffeomorphism invariance. The independent fields are a symmetric perturbation $\\phi^{\\mu\\nu}$ of the contravariant metric density and a trace-adjusted connection $G^{\\lambda}{}_{\\mu\\nu}$, whose transformation laws are prescribed. For a local action polynomial in these fields, with the gravitational coupling as its only dimensionful constant and each additional field carrying one power of it, a dilatation, which is a particular diffeomorphism, shows that in any dimension $d>2$ the action terminates at most at cubic order, its only possible cubic term being a derivative-free $\\phi GG$ vertex. Expanding the kernels of the resulting Lorentz-covariant ansatz in tensor bases gives 31 coefficients for $d\\geq 4$. The Noether identities with general diffeomorphisms, expanded order by order in the fields, yield a linear system that eliminates the $\\phi\\phi$ kernel and determines the remaining coefficients up to an overall normalization, recovering the Goldberg-Palatini action. Since the connection can be eliminated exactly, this also fixes the complete second-order action, with its infinite set of graviton vertices. The construction requires no choice of energy-momentum tensor, the source of ambiguity in the self-coupling approach. The kernel bases, the identities and the solution are given in appendices, and the symbolic computations are publicly available.", "url": "https://arxiv.org/abs/2610.28065", "type": "理论", "summary": "我们研究了从与微分同胚不变性相关的诺特恒等式重建一阶引力作用。独立场是逆变度量密度的对称扰动 $\\phi^{\\mu\\nu}$ 和迹调整连接 $G^{\\lambda}{}_{\\mu\\nu}$，其变换定律是规定的。对于这些场中的局部作用多项式，以引力耦合作为其唯一的维数常数，并且每个附加场都带有它的一个幂，膨胀（这是一种特定的微分同胚）表明，在任何维度 $d>2$ 中，作用最多终止于立方阶，其唯一可能的立方项是无导数的 $\\phi GG$ 顶点。在张量基中展开所得洛伦兹协变 ansatz 的核给出 $d\\geq 4$ 的 31 个系数。具有一般微分同胚的诺特恒等式，在域中按顺序扩展，产生一个线性系统，消除 $\\phi\\phi$ 核并确定剩余系数直至整体归一化，恢复 Goldberg-Palatini 作用。\n\n由于可以完全消除连接，因此这也修复了完整的二阶作用及其无限的引力子顶点集。该构造不需要选择能量动量张量，这是自耦合方法中模糊性的根源。附录中给出了内核基础、恒等式和解决方案，并且符号计算是公开的。", "authors": [{"name": "F. T. Brandt"}, {"name": "Augusto C. B. Carvalho"}], "featured_authors": [{"name": "F. T. Brandt"}, {"name": "Augusto C. B. Carvalho"}], "author_count": 2}, {"id": "2610.28125", "category": "hep-th", "title": "Possible Microscopic source of torsion", "abstract": "Axial fermionic interactions connect vacuum condensation with torsionful back- grounds. We consider a quartic spin spin interaction whose mean field reduction yields a quadratic fermionic Hamiltonian. Its diagonalisation defines a particle and antiparticle condensate, while self consistency determines whether the vacuum devel- ops a non zero axial current. Cutoff, fluctuation and energy conditions delimit the validity of the approximation. When torsion couples to spin, this axial expectation value can provide a microscopic source for an axial torsion background. We then consider mixed Dirac fields on such a background. In the explicit neutrino analysis, metric curvature is neglected while torsion modifies the flavour Bogoliubov coeffi- cients, producing spin dependent oscillation frequencies, condensate densities and CP asymmetries.", "url": "https://arxiv.org/abs/2610.28125", "type": "理论", "summary": "轴向费米子相互作用将真空凝聚与扭转背景联系起来。我们考虑四次自旋自旋相互作用，其平均场减少产生二次费米子哈密顿量。它的对角化定义了粒子和反粒子凝聚体，而自洽性决定了真空是否产生非零轴向电流。截止、波动和能量条件限制了近似的有效性。当扭转与旋转耦合时，该轴向期望值可以为轴向扭转背景提供微观源。然后我们在这样的背景下考虑混合狄拉克场。在显式中微子分析中，公制曲率被忽略，而挠率改变了波戈留波夫系数，产生自旋相关的振荡频率、凝聚态密度和CP不对称性。", "authors": [{"name": "A. Capolupo"}, {"name": "S. Monda"}, {"name": "G. Pisacane"}, {"name": "A. Quaranta"}, {"name": "R. Serao"}], "featured_authors": [{"name": "A. Capolupo"}, {"name": "S. Monda"}, {"name": "G. Pisacane"}, {"name": "A. Quaranta"}, {"name": "R. Serao"}], "author_count": 5}, {"id": "2610.28165", "category": "hep-th", "title": "Surface defects on lens space and transfer matrices", "abstract": "We study surface defects in four-dimensional $\\mathcal{N}=2$ theories of class $\\mathcal{S}$ and $\\mathcal{N}=1$ theories of class $\\mathcal{S}_k$ placed on $L(r,1)\\times S^1$. The lens space index depends on the fugacities $p$ and $q$, and the effect of the defects on it is captured by difference operators acting on the fugacities and holonomies of flavor symmetries. For theories of type $A_1$ we determine in closed form the difference operators for the basic defects, labeled by $p^r$, $q^r$ and $pq$, and show that for odd $r$ there exist additional elementary defects, whose operators shift the holonomy by one half modulo $r$. All the operators commute, and the elementary operators generate the others. For even $r$ the same holds once the holonomy is extended to a twisted sector. We show that the elementary operators are traces of $L$-operators whose entries generate a Sklyanin algebra, with nome $q^r$ and shift $pq$. The lens space enters only through the parameters of the algebra and through its representation, which is realized on a doubled holonomy label. The $p$- and $q$-type algebras form a lens space version of the elliptic modular double. For class $\\mathcal{S}_k$ theories we propose, and test in several ways, that the defect operators are transfer matrices of inhomogeneous spin chains built from these $L$-operators. Throughout, we use the TQFT structure of the lens space index, which follows from S-duality, both to fix and to check the operators.", "url": "https://arxiv.org/abs/2610.28165", "type": "理论", "summary": "我们研究放置在$L(r,1)\\times S^1$上的$\\mathcal{S}$类四维$\\mathcal{N}=2$理论和$\\mathcal{N}=1$类$\\mathcal{S}_k$理论中的表面缺陷。透镜空间指数取决于逸度 $p$ 和 $q$，并且缺陷对其的影响由作用于风味对称性的逸度和完整性的差分算子捕获。对于 $A_1​​$ 类型的理论，我们以封闭形式确定基本缺陷的差分算子，用 $p^r$、$q^r$ 和 $pq$ 标记，并表明对于奇数 $r$ 存在额外的基本缺陷，其算子将完整模 $r$ 移动二分之一。所有运算符都是可交换的，并且基本运算符生成其他运算符。即使对于 $r$，一旦完整扩展到扭曲的扇区，同样的情况也成立。我们证明，初等运算符是 $L$ 运算符的踪迹，其条目生成 Sklyanin 代数，其中 nome $q^r$ 和 shift $pq$。透镜空间仅通过代数参数及其表示形式进入，这是在双重完整标签上实现的。 $p$- 和 $q$- 型代数形成了椭圆模双模的透镜空间版本。\n\n对于 $\\mathcal{S}_k$ 类理论，我们提出并以多种方式进行测试，缺陷算子是由这些 $L$ 算子构建的非齐次自旋链的传递矩阵。在整个过程中，我们使用遵循 S-对偶性的透镜空间索引的 TQFT 结构来修复和检查算子。", "authors": [{"name": "Kazunobu Maruyoshi"}, {"name": "Toshihiro Ota"}, {"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Kazunobu Maruyoshi"}, {"name": "Toshihiro Ota"}, {"name": "Masahito Yamazaki"}], "author_count": 3}, {"id": "2610.28183", "category": "hep-th", "title": "Finite Spectral Recurrences for Loop Integrals in de Sitter and Anti-de Sitter Space", "abstract": "We introduce a method that does for loop integrals in de Sitter and anti-de Sitter space what integration-by-parts identities do in flat space. A local, coordinate-free propagator algebra common to both geometries yields exact finite-difference equations in spectral labels; with external points they become differ
