ential-difference equations, and at the AdS boundary recover known Witten-diagram relations. Acting line by line, they apply in principle to any diagram. We solve them for the two-loop watermelon, isolating its ultraviolet poles, and for one-loop two- and four-point functions.", "url": "https://arxiv.org/abs/2610.28183", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bruce A. Bassett"}, {"name": "Sergio Cacciatori"}, {"name": "Ugo Moschella"}], "featured_authors": [{"name": "Bruce A. Bassett"}, {"name": "Sergio Cacciatori"}, {"name": "Ugo Moschella"}], "author_count": 3}, {"id": "2610.28319", "category": "hep-th", "title": "Causality violation in the holographic approach to N=4 SYM theory at finite 't Hooft coupling", "abstract": "In the AdS/CFT correspondence, correlation functions of the energy-momentum tensor in N=4 supersymmetric Yang-Mills theory at large but finite 't Hooft coupling can be studied using higher-derivative corrections to supergravity. We show that the commonly used holographic prescription for correlation functions which is obtained by truncating the equations of motion at order $(\\alpha')^3$ implies that the thermal equilibrium state of N=4 SYM theory in the planar limit is dynamically unstable at arbitrarily large finite 't Hooft coupling. The instability is a reflection of the unphysical causality violation brought about by treating perturbatively-derived equations as if they were non-perturbative, analogous to the instability of AdS black branes in five-dimensional Gauss-Bonnet gravity. While other holographic prescriptions for treating the $O(\\alpha'^3)$ corrections to supergravity may alleviate the pathology introduced by the truncation, the validity regime of the results obtained by any prescription at $O(\\alpha'^3)$ must be limited to the strict perturbative treatment of the $O(\\alpha'^3)$ effects on N=4 SYM observables.", "url": "https://arxiv.org/abs/2610.28319", "type": "理论", "summary": "在AdS/CFT对应中，N=4超对称Yang-Mills理论中的能量动量张量的相关函数在总体上但有限't Hooft耦合可以使用对超重力的高导数修正来研究。我们证明，通过截断 $(\\alpha')^3$ 阶运动方程获得的常用的相关函数全息规定意味着平面极限下 N=4 SYM 理论的热平衡状态在任意大的有限 't Hooft 耦合下是动态不稳定的。这种不稳定性反映了将微扰导出的方程视为非微扰方程所带来的非物理因果关系违反，类似于五维高斯-邦内重力中 AdS 黑膜的不稳定性。虽然用于处理超重力 $O(\\alpha'^3)$ 校正的其他全息处方可能会减轻截断引入的病理学，但通过任何处方在 $O(\\alpha'^3)$ 获得的结果的有效性制度必须限于对 N=4 SYM 可观测量的 $O(\\alpha'^3)$ 效应的严格微扰处理。", "authors": [{"name": "Alex Buchel"}, {"name": "Pavel Kovtun"}], "featured_authors": [{"name": "Alex Buchel"}, {"name": "Pavel Kovtun"}], "author_count": 2}, {"id": "2610.28516", "category": "hep-th", "title": "Cosmological correlators from the Euclidean sphere", "abstract": "We propose a new framework for computing late-time cosmological correlators in de Sitter spacetime by analytic continuation from the Euclidean sphere. In this framework, correlators of arbitrary massive scalar fields take the universal form of generalized Euler integrals. Using this representation, we reproduce the results obtained using the Schwinger-Keldysh formalism for a range of tree-level and loop diagrams, providing nontrivial checks of the equivalence between the Euclidean and the in-in formalisms. We further show that a Landau analysis of the generalized Euler integrals determines the singularities of the corresponding correlators in momentum space. This framework provides a systematic approach to studying the analytic structure of cosmological correlators.", "url": "https://arxiv.org/abs/2610.28516", "type": "理论", "summary": "我们提出了一种新的框架，用于通过欧几里德球面的解析延拓来计算德西特时空中的晚期宇宙学相关器。在这个框架中，任意大量标量场的相关器采用广义欧拉积分的通用形式。使用这种表示，我们重现了使用 Schwinger-Keldysh 形式主义获得的一系列树级图和循环图的结果，提供了欧几里得形式主义和 in-in 形式主义之间的等价性检查。我们进一步表明，广义欧拉积分的朗道分析决定了动量空间中相应相关器的奇点。该框架提供了研究宇宙相关器分析结构的系统方法。", "authors": [{"name": "Andrei Katsevich"}, {"name": "Zimo Sun"}], "featured_authors": [{"name": "Andrei Katsevich"}, {"name": "Zimo Sun"}], "author_count": 2}, {"id": "2610.28531", "category": "hep-th", "title": "Towards differential expansion for generic representations", "abstract": "We report the first results of phenomenological analysis, based on extended set of explicitly calculated colored HOMFLY-PT polynomials in \\cite{knotebook}. They concern differential expansion (DE), which separates the dependencies on the knot ${\\cal K}$ and the representation $R$. %of colored HOMFLY-PT polynomials. DE is well understood for symmetric and rectangular representations, while for non-rectangular $R$ even the knot-independent basis $Z_R^X$ of DE is not known. We concentrate on two issues: the possible derivation of DE and on improved characteristic of its defect. We discuss how evolution families -- twist knots, double braids and 3-pretzels -- can be used to find DE by a peculiar triangular transformation of evolution coefficients. Once $Z^R_X$ are found for particular family, they are expected to stay basically the same for arbitrary knots -- modulo controllable reductions, characterized by the defect of DE, which puts knots into different universality classes. Contrary to original expectation, these classes appear labeled not by a single number $\\delta^{\\cal K}$, but by a whole non-decreasing sequence $\\{k_j\\}$, which is squeezed between two staircases, ${\\rm entier}\\left(\\frac{j-1}{\\delta+1}\\right)\\leq k_j\\leq{\\rm entier}\\left(\\frac{j-1}{{\\rm deg}\\,\\Delta}\\right)$, where the upper bound involves Alexander polynomial $\\Delta(q^2)$ and follows from the continuation of the Melvin--Morton--Rozansky-Kashaev limit to $A=q^{-m}$ with $m>0$, when the limit gives a {\\it positive} power of Alexander. The old assumption $\\delta+1={\\rm deg}\\,\\Delta$ is oversimplified and fails for 19 non-alternating knots with 11 and 12 crossings. Last, we list the differences of non-rectangularly colored HOMFLY for various mutant pairs to demonstrate their universality (knot-independence) and nice consistency with the spirit of DE.", "url": "https://arxiv.org/abs/2610.28531", "type": "理论", "summary": "我们报告了现象学分析的第一个结果，基于 \\cite{knotebook} 中显式计算的彩色 HOMFLY-PT 多项式的扩展集。它们涉及微分展开（DE），它将节点 ${\\cal K}$ 和表示 $R$ 的依赖关系分开。彩色 HOMFLY-PT 多项式的百分比。对于对称和矩形表示，DE 很好理解，而对于非矩形 $R$，甚至 DE 的与结无关的基础 $Z_R^X$ 也是未知的。我们关注两个问题：DE 的可能推导和其缺陷的改进特性。我们讨论如何使用进化族——扭结、双辫子和 3-椒盐卷饼——通过进化系数的特殊三角变换来找到 DE。一旦找到特定族的$Z^R_X$，它们对于任意结预计将保持基本相同——模可控约简，其特征是DE的缺陷，它将结放入不同的普遍性类别。\n\n与最初的预期相反，这些类的标记不是由单个数字 $\\delta^{\\cal K}$ 标记，而是由整个非递减序列 $\\{k_j\\}$ 标记，该序列被挤压在两个楼梯 ${\\rm entier}\\left(\\frac{j-1}{\\delta+1}\\right)\\leq k_j\\leq{\\rm entier}\\left(\\frac{j-1}{{\\rm deg}\\,\\Delta}\\right)$，其中上限涉及亚历山大多项式 $\\Delta(q^2)$，并从 Melvin--Morton--Rozansky-Kashaev 极限的延拓到 $A=q^{-m}$（其中 $m>0$），当该极限给出亚历山大的 {\\it Positive} 次方时。旧假设 $\\delta+1={\\rm deg}\\,\\Delta$ 过于简单化，对于具有 11 和 12 个交叉点的 19 个非交替结失败。最后，我们列出了各种突变对的非矩形着色 HOMFLY 的差异，以证明它们的通用性（结独立性）以及与 DE 精神的良好一致性。", "authors": [{"name": "Ya.Kononov"}, {"name": "A.Morozov"}], "featured_authors": [{"name": "Ya.Kononov"}, {"name": "A.Morozov"}], "author_count": 2}, {"id": "2610.27062", "category": "math-ph", "title": "Boundary One-Point Functions in the Open XXZ Spin Chain with Generic Integrable Boundaries", "abstract": "We consider the problem of computing observables beyond the spectrum in the open XXZ spin chain with the most generic integrable boundary conditions. For such boundaries, the residual u(1) symmetry is broken and the familiar Baxter TQ equation describing the spectrum becomes inhomogeneous, placing the model outside the realm of existing approaches to correlation functions and form factors. We show that the Functional Separation of Variables method, so far developed mainly for rational, (quasi-)periodic spin chains, is largely insensitive to these modifications, and works equally well for diagonal and generic boundaries. Using this method, we compute exact determinant expressions for a prototypical example of form factors in open-boundary systems, namely the longitudinal and transverse boundary-spin one-point functions in arbitrary Hamiltonian eigenstates at finite system size. No constraint relating the two boundary configurations and no reference state are required. We verify the resulting formulae against direct finite-volume diagonalisation.", "url": "https://arxiv.org/abs/2610.27062", "type": "理论", "summary": "我们考虑在具有最通用的可积边界条件的开放 XXZ 自旋链中计算超出频谱的可观测量的问题。对于此类边界，残差 u(1) 对称性被破坏，描述频谱的熟悉的 Baxter TQ 方程变得不均匀，使模型超出了相关函数和形状因子的现有方法的范围。我们表明，迄今为止主要针对有理、（准）周期自旋链开发的变量函数分离方法在很大程度上对这些修改不敏感，并且对于对角线和通用边界同样有效。使用这种方法，我们计算开放边界系统中形状因子的典型示例的精确行列式，即有限系统尺寸下任意哈密顿本征态的纵向和横向边界自旋单点函数。不需要与两个边界配置相关的约束，也不需要参考状态。我们针对直接有限体积对角化验证了所得公式。", "authors": [{"name": "Till Bargheer"}, {"name": "Tengis Batmunkh"}, {"name": "Paul Ryan"}], "featured_authors": [{"name": "Till Bargheer"}, {"name": "Tengis Batmunkh"}, {"name": "Paul Ryan"}], "author_count": 3}, {"id": "2610.27274", "category": "math-ph", "title": "Analytical solution of electromagnetic heating in a stratified absorbing medium", "abstract": "We consider the temperature evolution in a skin tissue when it is exposed to an electromagnetic wave. The heating is caused by the absorbed power as the electromagnetic wave attenuates inside the skin. In many applications, the characteristic depth of attenuation is small in comparison with the lateral size of the electromagnetic beam. Because of this separation of length scales, the lateral heat conduction is negligible at leading order. Previously, we studied electromagnetic heating in a skin of a single homogeneous layer. We derived the leading-term analytical solution and the asymptotic corrections up to the second order for lateral heat conduction and for oblique incidence. In this study, we derive the analytical solution in the case of perpendicular incidence on a stratified skin tissue with a layer-specific profile for electromagnetic attenuation. It should be emphasized that in the current study, the heat capacity and conductivity are still uniform over the entire skin tissue; only the electromagnetic attenuation is stratified resulting in a layer-specific heating profile.", "url": "https://arxiv.org/abs/2610.27274", "type": "理论", "summary": "我们考虑皮肤组织暴露于电磁波时的温度演变。热量是由电磁波在皮肤内衰减时吸收的功率引起的。在许多应用中，与电磁束的横向尺寸相比，衰减的特征深度很小。由于长度尺度的这种分离，横向热传导在前导阶上可以忽略不计。之前，我们研究了单均质层表皮中的电磁加热。我们导出了横向热传导和倾斜入射的领先项解析解和二阶渐近修正。在这项研究中，我们推导了垂直入射到具有特定层电磁衰减分布的分层皮肤组织的情况下的解析解。需要强调的是，在目前的研究中，整个皮肤组织的热容和传导率仍然是均匀的；仅电磁衰减被分层，从而产生特定于层的加热分布。", "authors": [{"name": "Ulises Jaime-Yepez"}, {"name": "Hongyun Wang"}], "featured_authors": [{"name": "Ulises Jaime-Yepez"}, {"name": "Hongyun Wang"}], "author_count": 2}, {"id": "2610.27294", "category": "math-ph", "title": "Counterexamples to the total-current Hohenberg-Kohn conjecture", "abstract": "The total-current Hohenberg-Kohn conjecture asserts that the ground-state particle density and total current determine the scalar potential up to an additive constant and the vector potential up to a gauge transformation. We give three counterexamples for two spinless fermions in the physically relevant setting of three spatial dimensions. In each, a Hamiltonian $H^{v,\\mathbf{A}}$ has a nondegenerate ground state with identically zero total current but nonzero magnetic field. Complex conjugation then yields a second Hamiltonian $H^{v,-\\mathbf{A}}$, with the same scalar potential and interaction, whose ground state has the same density and the same zero current, while the magnetic field is reversed. The first two examples are noninteracting. One is explicit, with a smooth bounded vector potential and a Gaussian density. The other has smooth bounded scalar and vector potentials in the standard potential spaces. The third example has Coulomb repulsion with unit coupling, an isotropic harmonic scalar potential, and Dirac monopole fields of magnetic charge $\\pm 1/2$. The monopole example uses vector potentials defined on separate spatial patches, since these fields are not curls of globally defined smooth vector potentials.", "url": "https://arxiv.org/abs/2610.27294", "type": "理论", "summary": "总电流霍恩伯格-科恩猜想断言，基态粒子密度和总电流决定了直至加性常数的标量势和直至规范变换的矢量势。我们给出了三个空间维度的物理相关设置中两个无旋转费米子的三个反例。在每一个中，哈密顿量 $H^{v,\\mathbf{A}}$ 具有非简并基态，总电流为零但磁场非零。然后，复共轭产生第二个哈密顿量 $H^{v,-\\mathbf{A}}$，具有相同的标量势和相互作用，其基态具有相同的密度和相同的零电流，而磁场相反。前两个例子是非交互的。一种是显式的，具有平滑有界矢量势和高斯密度。另一个在标准势空间中具有平滑有界标量和矢量势。第三个示例具有单位耦合的库仑斥力、各向同性谐波标量势和磁荷 $\\pm 1/2$ 的狄拉克单极场。\n\n单极子示例使用在单独的空间块上定义的矢量势，因为这些场不是全局定义的平滑矢量势的卷曲。", "authors": [{"name": "Andre Laestadius"}, {"name": "Mihály A. Csirik"}], "featured_authors": [{"name": "Andre Laestadius"}, {"name": "Mihály A. Csirik"}], "author_count": 2}, {"id": "2610.27352", "category": "math-ph", "title": "Continuous and Differentiable Neural Network Representations of the Surfzone Sea-Surface from Lidar Point Clouds", "abstract": "Ocean waves are often analyzed via sea-surface observations. Multi-beam scanning lidar enables two-dimensional measurements of the water surface $\\eta(x,y)$ via sequenced point clouds of sea-surface elevation. Point cloud data, however, have to be gridded, interpolated, or mapped for use in wave analysis. We present and test a method for creating a continuous and differentiable (space and time), but grid-free, representation of the sea-surface from time sequenced lidar point clouds. We use a specific neural network architecture, a SIREN, to represent the sea-surface and to train the network on spatiotemporal 60~s of lidar data collected by a gas-electric UAS (drone) hovering over large (4 m), breaking waves in Monterey, California. The trained SIREN allows estimation of the sea-surface and its derivatives at any location and time. SIREN sea-surface representations tend to filter the highest wave number variability (splash-up and sea-spray). SIREN errors are comparable to instrument errors and insensitive to local data density. The reliability and reproducibility of our approach is tested by training two SIRENs independently on the same data. Differences between the two independent SIRENs are comparable to instrument error, but increase in data-poor regions. SIRENs' potential for directional wave analysis is demonstrated by computing spatial and temporal derivatives and by estimating wave velocity from a SIREN-generated space-time slice of the sea-surface.", "url": "https://arxiv.org/abs/2610.27352", "type": "理论", "summary": "海浪通常通过海面观测来分析。多光束扫描激光雷达可以通过海面高程的序列点云对水面 $\\eta(x,y)$ 进行二维测量。然而，点云数据必须经过网格化、插值或映射才能用于波浪分析。我们提出并测试了一种方法，用于根据时间排序的激光雷达点云创建连续且可微（空间和时间）但无网格的海面表示。我们使用特定的神经网络架构 SIREN 来表示海面，并根据由悬停在加利福尼亚州蒙特雷的大型（4 m）破碎波浪上空的气电 UAS（无人机）收集的 60~s 激光雷达时空数据来训练网络。经过训练的 SIREN 可以在任何地点和时间估计海面及其导数。 SIREN 海面表示倾向于过滤最高的波数变化（飞溅和海浪）。 SIREN 误差与仪器误差相当，并且对本地数据密度不敏感。我们的方法的可靠性和可重复性是通过在相同数据上独立训练两个 SIREN 来测试的。\n\n两个独立 SIREN 之间的差异与仪器误差相当，但在数据匮乏的地区会增加。通过计算空间和时间导数以及根据 SIREN 生成的海面时空切片估算波速，证明了 SIREN 在定向波分析方面的潜力。", "authors": [{"name": "David R. Culver"}, {"name": "Matthias Morzfeld"}, {"name": "Falk Feddersen"}], "featured_authors": [{"name": "David R. Culver"}, {"name": "Matthias Morzfeld"}, {"name": "Falk Feddersen"}], "author_count": 3}, {"id": "2610.27359", "category": "math-ph", "title": "Two routes to the Hadamard condition", "abstract": "In quantum field theory on curved spacetime, the Hadamard condition is often presented as a necessary condition on 'physically reasonable', 'vacuum-like' states of linear quantum fields, and plays a central role in many theoretical and foundational applications - ranging from proofs of the renormalizability of Wick polynomials to derivations of the Hawking temperature. In this paper, I strengthen, generalise, and bring under technical control two popular motivations for the Hadamard condition - one which appeals to the role of Hadamard states in defining physical quantities such as Wick polynomials and the expectation value of the stress-energy operator on general curved spacetime backgrounds, and one which appeals to the equivalence principle. This clarifies the role and status of the Hadamard condition, including its relationship to the equivalence principle, to well-definedness of physical quantities such as Wick polynomials and the expectation value of the stress-energy operator, and the sense in which Hadamard states are 'vacuum-like'.", "url": "https://arxiv.org/abs/2610.27359", "type": "理论", "summary": "在弯曲时空的量子场论中，哈达玛条件通常被视为线性量子场的“物理合理”、“类真空”态的必要条件，并在许多理论和基础应用中发挥着核心作用——从威克多项式的可重整性证明到霍金温度的推导。在本文中，我强化、概括了哈达玛条件的两个流行动机，并将其置于技术控制之下——一是诉诸哈达玛状态在定义物理量（如威克多项式和一般弯曲时空背景上的应力-能量算符的期望值）中的作用，二是诉诸等效原理。这阐明了哈达马条件的作用和地位，包括它与等效原理、物理量（如威克多项式和应力能量算符的期望值）的明确定义的关系，以及哈达马状态“类真空”的含义。", "authors": [{"name": "Eleanor March"}], "featured_authors": [{"name": "Eleanor March"}], "author_count": 1}, {"id": "2610.27810", "category": "math-ph", "title": "Phonon Dispersion Relation in Weakly Coupled Bose Gas Beyond Bogoliubov Approximation", "abstract": "We study the quasiparticle dispersion relation for a homogeneous Bose gas in a large cubic box with periodic boundary conditions at zero temperature. Inspired by the Bogoliubov method, we rearrange the usual Bose gas Hamiltonian in a form adapted to perturbation theory in the weak-coupling regime, both in the canonical and grand-canonical setting. We compute the first non-trivial corrections to the dispersion relation in both settings. We show that for small momenta they are linear in the absolute value of the momentum. Thus, in this approximation phonons have a well-defined velocity, which we compute.", "url": "https://arxiv.org/abs/2610.27810", "type": "理论", "summary": "我们研究了零温度下具有周期性边界条件的大立方体中均匀玻色气体的准粒子色散关系。受 Bogoliubov 方法的启发，我们重新排列了通常的玻色气体哈密顿量，使其适应弱耦合状态下的微扰理论，无论是在正则还是大正则环境中。我们计算了两种设置中色散关系的第一个重要修正。我们证明，对于小动量，它们的动量绝对值是线性的。因此，在这个近似中，声子具有我们计算的明确定义的速度。", "authors": [{"name": "Jan Dereziński"}, {"name": "Lorenzo Pettinari"}], "featured_authors": [{"name": "Jan Dereziński"}, {"name": "Lorenzo Pettinari"}], "author_count": 2}, {"id": "2610.28026", "category": "math-ph", "title": "Half-delocalization for semiclassical measures of split higher-dimensional quantum cat maps", "abstract": "We study quantum cat maps on multidimensional tori and prove an optimal lower bound for the Kolmogorov-Sinai entropy of their semiclassical measures under the hypothesis that the dynamics splits over the rationals. This is the first instance of such a bound for a dynamical system with multiple positive Lyapunov exponents. The proof is based on a new notion of conditional quantum dynamical entropy and a careful study of the multiple Ehrenfest time adapted to the dynamics.", "url": "https://arxiv.org/abs/2610.28026", "type": "理论", "summary": "我们研究多维环面上的量子猫图，并在动力学分裂有理数的假设下证明其半经典测度的柯尔莫哥洛夫-西奈熵的最佳下界。这是具有多个正李亚普诺夫指数的动力系统的这种界限的第一个实例。该证明基于条件量子动力学熵的新概念以及对适应动力学的多个埃伦菲斯特时间的仔细研究。", "authors": [{"name": "Vincent Ferrari-Dominguez"}], "featured_authors": [{"name": "Vincent Ferrari-Dominguez"}], "author_count": 1}, {"id": "2610.28193", "category": "math-ph", "title": "The concentration conjecture for Dirac--Coulomb operators", "abstract": "We prove the concentration conjecture for the three-dimensional Dirac operator with mass $m>0$ and an attractive Coulomb potential generated by finitely many point charges. For a fixed total charge $G\\in(0,1]$, the lowest eigenvalue in the spectral gap is at least $m\\sqrt{1-G^2}$, with equality precisely when all the charge is concentrated at one point. The critical one-center operator is understood as its distinguished extension. The result also extends to arbitrary nonnegative finite charge measures. The proof uses a strict two-center estimate for the weighted free Dirac resolvent and a Birman-Schwinger comparison. We establish the two-center estimate through an auxiliary axial operator, combining a zero-energy bound and a scalar resolvent estimate with a radial decomposition, an angular Schur complement, and exact polynomial inequalities.", "url": "https://arxiv.org/abs/2610.28193", "type": "理论", "summary": "我们证明了质量 $m>0$ 的三维狄拉克算子的浓度猜想以及由有限多个点电荷产生的有吸引力的库仑势。对于固定的总电荷 $G\\in(0,1]$，谱间隙中的最低特征值至少为 $m\\sqrt{1-G^2}$，当所有电荷都集中在一个点时，精确地相等。关键的一中心算子被理解为它的显着扩展。结果也扩展到任意非负有限电荷测度。证明对加权自由狄拉克解析和 Birman-Schwinger 比较使用严格的两中心估计。我们建立了两中心通过辅助轴向算子进行估计，将零能量界和标量解析估计与径向分解、角度 Schur 补集和精确多项式不等式相结合。", "authors": [{"name": "Habib Ammari"}, {"name": "Jiayu Qiu"}], "featured_authors": [{"name": "Habib Ammari"}, {"name": "Jiayu Qiu"}], "author_count": 2}, {"id": "2610.28497", "category": "math-ph", "title": "Matrix divisors, Christoffel transformations and symmetric $d$-connections", "abstract": "The Christoffel transformation $w(x)\\mapsto x^2w(x)$ relates elementary bundle modifications to gap probability recurrences. The moment matrix determines normalization and the splitting type. We define the source and target moduli problems by their local data. The modifications identify common stable loci and conjugate their point-addition maps. For Pearson ratios $d(-z-1)/d(z)$ with $°d=1,2$, we construct rational spectral coordinates and compute the induced transformation. For positive even weights with finite moments, reweighting configurations yields the transformed gap probability recurrence. Its coefficient is a rational function of the transformed spectral coordinates. A local formula applies outside these charts under the stated hypotheses.", "url": "https://arxiv.org/abs/2610.28497", "type": "理论", "summary": "Christoffel 变换 $w(x)\\mapsto x^2w(x)$ 将基本束修改与间隙概率递归联系起来。矩矩阵决定归一化和分裂类型。我们通过本地数据定义源和目标模量问题。这些修饰识别了常见的稳定基因座并结合了它们的点加图。对于 $°d=1,2$ 的皮尔逊比率 $d(-z-1)/d(z)$，我们构造有理谱坐标并计算诱导变换。对于具有有限矩的正偶权重，重新加权配置会产生变换后的间隙概率递归。其系数是变换后的光谱坐标的有理函数。在规定的假设下，本地公式适用于这些图表之外。", "authors": [{"name": "Anton Selemenchuk"}], "featured_authors": [{"name": "Anton Selemenchuk"}], "author_count": 1}, {"id": "2610.26900", "category": "quant-ph", "title": "Concurrent Entanglement Purification Scheduling in Dynamic Quantum Networks", "abstract": "Quantum networks must deliver end-to-end entanglement whose fidelity meets application requirements, which typically requires entanglement purification along multi-hop paths. Existing scheduling approaches either purify at the link level or optimize end-to-end fidelity for a static set of requests, and do not capture concurrent requests competing for network resources over time. This paper studies concurrent entanglement purification scheduling in a time-slotted quantum network with heterogeneous links, in which requests compete for link capacity and quantum memories, and each request may be served by multiple parallel paths for increased reliability. We formulate a mixed-integer linear programming (MILP) scheduler that maximizes the number of scheduled requests, with max-min path allocation as a fairness criterion, and develop reinforcement learning (RL) schedulers based on DQN, PPO, and SAC, whose rewards balance request success against Bell-pair consumption. Simulations under varying network load, topologies and target fidelity thresholds show that the RL schedulers achieve the highest success rates, improving on MILP by up to 6% and on Progressive Filling and Greedy heuristics by 16.5% and 19.5% respectively, at the cost of higher Bell pair consumption and the deferral of a small fraction of requests. MILP, in contrast, achieves the highest fairness and the lowest Bell pair consumption in most scenarios.", "url": "https://arxiv.org/abs/2610.26900", "type": "理论+数值", "summary": "量子网络必须提供保真度满足应用要求的端到端纠缠，这通常需要沿多跳路径进行纠缠净化。现有的调度方法要么在链路级别进行净化，要么优化一组静态请求的端到端保真度，并且不会捕获随时间推移竞争网络资源的并发请求。本文研究了具有异构链路的时隙量子网络中的并发纠缠净化调度，其中请求竞争链路容量和量子存储器，并且每个请求可以由多个并行路径来服务以提高可靠性。我们制定了一个混合整数线性规划（MILP）调度器，以最大化调度请求的数量，以最大最小路径分配作为公平标准，并开发基于 DQN、PPO 和 SAC 的强化学习（RL）调度器，其奖励平衡请求成功与贝尔对消耗。\n\n在不同网络负载、拓扑和目标保真度阈值下的模拟表明，RL 调度程序实现了最高的成功率，在 MILP 上提高了高达 6%，在渐进式填充和贪婪启发式上分别提高了 16.5% 和 19.5%，但代价是更高的 Bell 对消耗和一小部分请求的延迟。相比之下，MILP 在大多数场景下实现了最高的公平性和最低的贝尔对消耗。", "authors": [{"name": "Gongyu Ni"}, {"name": "Lester Ho"}], "featured_authors": [{"name": "Gongyu Ni"}, {"name": "Lester Ho"}], "author_count": 2}, {"id": "2610.27137", "category": "quant-ph", "title": "Active isolation of transmon readout with a tunable inductive bridge", "abstract": "Scalable superconducting quantum computation requires fast, high-fidelity readout. Currently, this is assisted through cryogenic amplification of the readout signal. In traditional dispersive readout schemes, the amplifiers that are used to provide high signal-to-noise ratio also generate thermal noise that can decohere the qubits, demanding additional ferrite-based isolators to suppress this noise. Here, we integrate a chip-scale microwave switch, the tunable inductive bridge, into the readout chain of a fixed-frequency transmon. Flux-pulsing the switch, such that it transmits only during the readout, did not make a discernable difference to qubit coherence, residual excited-state population, or readout fidelity metrics. By injecting broadband noise that mimics amplifier thermal photons, we show that the switch suppresses the resulting qubit dephasing by more than $30$~dB, consistent with its independently measured on-off ratio, establishing it as a potential chip-based integrated replacement for readout-chain isolators.", "url": "https://arxiv.org/abs/2610.27137", "type": "实验", "summary": "Scalable superconducting quantum computation requires fast, high-fidelity readout. Currently, this is assisted through cryogenic amplification of the readout signal.在传统的色散读出方案中，用于提供高信噪比的放大器也会产生热噪声，使量子位退相干，需要额外的铁氧体隔离器来抑制这种噪声。 Here, we integrate a chip-scale microwave switch, the tunable inductive bridge, into the readout chain of a fixed-frequency transmon.对开关进行通量脉冲，使其仅在读出期间传输，不会对量子位相干性、残余激发态总体或读出保真度指标产生明显的差异。通过注入模拟放大器热光子的宽带噪声，我们表明该开关将产生的量子位相移抑制超过 30$~dB，与其独立测量的开关比一致，使其成为读出链隔离器的潜在的基于芯片的集成替代品。", "authors": [{"name": "Chunyang Ding"}, {"name": "Chuyao Tong"}, {"name": "Paul Varosy"}, {"name": "Nikitha Jain"}, {"name": "Ziyi Zhao"}, {"name": "Eric I. Rosenthal"}, {"name": "Konrad W. Lehnert"}, {"name": "David I. Schuster"}], "featured_authors": [{"name": "Chunyang Ding"}, {"name": "Chuyao Tong"}, {"name": "Paul Varosy"}, {"name": "Eric I. Rosenthal"}, {"name": "Konrad W. Lehnert"}, {"name": "David I. Schuster"}], "author_count": 8}, {"id": "2610.27338", "category": "quant-ph", "title": "Assignment maps for arbitrary reduced quantum dynamics", "abstract": "Given an open quantum system $S$ with environment $E$, we establish a one-to-one correspondence between completely positive trace-preserving (CPTP) maps from $S$ to $E$ and assignment maps initializing the composite system $SE$ in a possibly correlated state prior to unitary evolution. We show that every possible joint state $\\rho_{SE}$ can be realized by such assignment maps, which are inherently Hermiticity-preserving and trace-preserving (HPTP). While these maps sacrifice global positivity, we derive a simple necessary and sufficient condition for any local state of $S$ to belong to their domain of validity. Furthermore, we prove that the geometry of this domain is governed by the joint state assigned to the maximally mixed input, ensuring that a non-zero volume of admissible local states can readily coexist with initial system-environment entanglement. Finally, we provide an operational protocol for witnessing such limits of validity.", "url": "https://arxiv.org/abs/2610.27338", "type": "理论", "summary": "给定一个环境为 $E$ 的开放量子系统 $S$，我们在从 $S$ 到 $E$ 的完全正迹保留 (CPTP) 映射与在酉演化之前将复合系统 $SE$ 初始化为可能相关状态的分配映射之间建立一一对应关系。我们证明了每个可能的联合状态 $\\rho_{SE}$ 都可以通过这样的分配图来实现，这些分配图本质上是厄米性保持和迹保持（HPTP）的。虽然这些地图牺牲了全局积极性，但我们得出了一个简单的充分必要条件，使 $S$ 的任何局部状态都属于其有效域。此外，我们证明该域的几何形状由分配给最大混合输入的联合状态控制，确保非零体积的允许局部状态可以轻松地与初始系统环境纠缠共存。最后，我们提供了一个操作协议来见证这种有效性限制。", "authors": [{"name": "James Fullwood"}, {"name": "Weixiang Ye"}], "featured_authors": [{"name": "James Fullwood"}, {"name": "Weixiang Ye"}], "author_count": 2}, {"id": "2610.27394", "category": "quant-ph", "title": "Choi-Jamiołkowski isomorphism(s) and channel/state duality, naturally!", "abstract": "Provided a maximally entangled state vector in ${\\mathcal{H}}\\otimes{\\mathcal{H}}$, the Choi-Jamiolkowski isomorphism of quantum information theory (or channel/state duality) produces a mapping of ${\\mathsf CP}({\\mathcal{H}},{\\mathcal{K}})$ (completely positive maps of density operators on ${\\mathcal{H}}$ tothose on ${\\mathcal{K}}$) onto the density operators on ${\\mathcal{K}}\\otimes{\\mathcal{H}}$, which extends to a unitary map. Here, ${\\mathcal{H}}$ and ${\\mathcal{K}}$ are {finite-dimensional} Hilbert this http URL nature of this construction, the form of the associated formulas, and the possibility of versions which do not require an entangled vector seed, are illuminated from the perspective of {naturality}, in the sense of Eilenberg and this http URL is a unique such correspondence (``Choi map'') natural in both ${\\mathcal{H}}$ and ${\\mathcal{K}}$ which produces density operators on either ${\\mathsf L}({\\mathcal{H}},{\\mathcal{K}})$ (Hilbert-Schmidt inner product) or ${\\mathcal{K}}\\otimes{\\mathcal{H}}^*$ instead of ${\\mathcal{K}}\\otimes{\\mathcal{H}}$. In particular, no entangled state input is required. There are no such binatural maps carried on ${\\mathcal{K}}\\otimes{\\mathcal{H}}$, but those natural in only ${\\mathcal{K}}$ are canonically associated with unitary maps ${\\mathcal{H}}\\rightarrow{\\mathcal{H}}^*$ and derive from the binatural maps. The construction recovers the standard Choi-Jamiolkowski formulae and shows how they express naturality.", "url": "https://arxiv.org/abs/2610.27394", "type": "理论", "summary": "提供 ${\\mathcal{H}}\\otimes{\\mathcal{H}}$ 中的最大纠缠状态向量，量子信息论（或通道/状态对偶性）的 Choi-Jamiolkowski 同构产生 ${\\mathsf CP}({\\mathcal{H}},{\\mathcal{K}})$ 的映射（密度算子的完全正映射${\\mathcal{H}}$ 到 ${\\mathcal{K}}$ 上的那些）到 ${\\mathcal{K}}\\otimes{\\mathcal{H}}$ 上的密度算子，扩展到酉映射。这里，${\\mathcal{H}}$和${\\mathcal{K}}$是{有限维}希尔伯特这个构造的http URL性质，相关公式的形式，以及不需要纠缠向量种子的版本的可能性，从{自然性}的角度阐明，在艾伦伯格的意义上，这个http URL是一个独特的这样的对应关系（“Choi映射”），在${\\mathcal{H}}$中都是自然的${\\mathcal{K}}$ 在 ${\\mathsf L}({\\mathcal{H}},{\\mathcal{K}})$ （希尔伯特-施密特内积）或 ${\\mathcal{K}}\\otimes{\\mathcal{H}}^*$ 上生成密度运算符，而不是 ${\\mathcal{K}}\\otimes{\\mathcal{H}}$。特别是，不需要纠缠态输入。\n\n${\\mathcal{K}}\\otimes{\\mathcal{H}}$ 上没有这样的双自然映射，但那些仅在 ${\\mathcal{K}}$ 中的自然映射与酉映射 ${\\mathcal{H}}\\rightarrow{\\mathcal{H}}^*$ 规范相关，并从双自然映射派生。 The construction recovers the standard Choi-Jamiolkowski formulae and shows how they express naturality.", "authors": [{"name": "Paul E. Lammert"}], "featured_authors": [{"name": "Paul E. Lammert"}], "author_count": 1}, {"id": "2610.27416", "category": "quant-ph", "title": "Quantum algorithm for high-dimensional nonlinear stochastic differential equations based on Carleman linearization", "abstract": "Addressing nonlinear numerical problems in quantum computing remains challenging, but several approaches, including Carleman linearization (CL), have been proposed to construct quantum algorithms for such problems. In this work, we develop a CL-based method for a high-dimensional nonlinear stochastic differential equation (SDE) $\\mathrm{d} \\mathbf{X}_t = \\left(A(t) \\mathbf{X}_t + F(t) \\mathbf{X}_t^{\\otimes s}\\right) \\mathrm{d} t + B(t) \\mathrm{d} \\mathbf{W}_t$ for an $\\mathbb{R}^N$-valued random process $\\mathbf{X}_t$, aiming at quantum speed-up with respect to the dimension $N$. We introduce auxiliary processes $\\mathbf{Y}^j_t$ that approximate $\\mathbf{X}_t^{\\otimes j}$, derive a linearized system of SDEs for them, and obtain the linear ordinary differential equation (ODE) governing their expectations. We then apply a quantum ODE solver to it and, from the resulting quantum state, extract an estimate for the expectation of a linear function of $\\mathbf{X}_t$ by overlap estimation. We show that, provided the nonlinear and noise terms in the SDE are sufficiently small relative to the linear term, the CL error decreases exponentially with the truncation order $J$ in CL, and we can estimate the target expectation with a ${\\rm polylog}(N)$ number of queries to unitaries encoding coefficient matrices $A$, $F$, and $B$. Finally, we also run a numerical demonstration for an SDE related to Langevin dynamics, observing the exponential decay of the CL error as $J$ increases.", "url": "https://arxiv.org/abs/2610.27416", "type": "理论+数值", "summary": "解决量子计算中的非线性数值问题仍然具有挑战性，但已经提出了包括卡尔曼线性化（CL）在内的几种方法来构建解决此类问题的量子算法。在这项工作中，我们开发了一种基于 CL 的高维非线性随机微分方程 (SDE) 方法 $\\mathrm{d} \\mathbf{X}_t = \\left(A(t) \\mathbf{X}_t + F(t) \\mathbf{X}_t^{\\otimes s}\\right) \\mathrm{d} t + B(t) \\mathrm{d} \\mathbf{W}_t$ 用于 $\\mathbb{R}^N$ 值随机过程 $\\mathbf{X}_t$，旨在相对于维度 $N$ 进行量子加速。我们引入近似 $\\mathbf{X}_t^{\\otimes j}$ 的辅助过程 $\\mathbf{Y}^j_t$，为它们导出 SDE 的线性化系统，并获得控制其期望的线性常微分方程 (ODE)。然后，我们对其应用量子 ODE 求解器，并从所得的量子态中，通过重叠估计提取 $\\mathbf{X}_t$ 线性函数期望的估计。\n\n我们表明，只要 SDE 中的非线性项和噪声项相对于线性项足够小，CL 误差就会随着 CL 中的截断阶数 $J$ 呈指数下降，并且我们可以通过对酉编码系数矩阵 $A$、$F$ 和 $B$ 进行 ${\\rm polylog}(N)$ 次查询来估计目标期望。最后，我们还对与 Langevin 动力学相关的 SDE 进行了数值演示，观察 CL 误差随着 $J$ 的增加呈指数衰减。", "authors": [{"name": "Koichi Miyamoto"}], "featured_authors": [{"name": "Koichi Miyamoto"}], "author_count": 1}, {"id": "2610.27506", "category": "quant-ph", "title": "Quantum Cryptanalysis on Two Feistel-Type Constructions", "abstract": "With the rapid advancement of quantum computing, the security of traditional cryptographic systems is facing significant challenges. As a fundamental component of symmetric cryptography, block ciphers have attracted increasing attention regarding their quantum security in recent years. In this paper, we propose new quantum attacks on two Feistel-type constructions, i.e., New Structure IV and the lightweight block cipher LBlock, under the quantum chosen-plaintext attack (qCPA) model. First, we construct an 8-round quantum distinguisher for New Structure IV and perform an $r(r>12)$-round quantum key-recovery attack. Compared with Li et al.'s qCPA-based result presented at INSCRYPT 2024, our attack reduces the time complexity by a factor of $2^{n/2}$, where $n$ denotes the subkey length. Second, we design a 9-round quantum distinguisher for LBlock and extend it to an $r(r>15)$-round quantum key-recovery attack. The proposed quantum distinguisher covers one more round than Liu et al.'s automated-search distinguisher at ASIACRYPT 2025, which results in a $2^{16}$ reduction in the time complexity of our $r$-round quantum key-recovery attack on LBlock. Furthermore, by analyzing the structure of the round function and the key scheduling of LBlock, we reduce the subkey guess space for the 15-round attack from 76 bits to 52 bits, lowering the time complexity from \\(O(2^{38})\\) to \\(O(2^{26})\\) by a factor of \\(2^{12}\\).", "url": "https://arxiv.org/abs/2610.27506", "type": "理论", "summary": "随着量子计算的快速发展，传统密码系统的安全性面临重大挑战。作为对称密码学的基本组成部分，分组密码近年来因其量子安全性而受到越来越多的关注。在本文中，我们在量子选择明文攻击（qCPA）模型下提出了对两种 Feistel 型结构（即新结构 IV 和轻量级分组密码 LBlock）的新量子攻击。首先，我们为新结构 IV 构建一个 8 轮量子区分器，并执行 $r(r>12)$ 轮量子密钥恢复攻击。与 Li 等人在 INSCRYPT 2024 上提出的基于 qCPA 的结果相比，我们的攻击将时间复杂度降低了 $2^{n/2}$，其中 $n$ 表示子密钥长度。其次，我们为 LBlock 设计了一个 9 轮量子区分器，并将其扩展到 $r(r>15)$ 轮量子密钥恢复攻击。所提出的量子区分器比 Liu 等人在 ASIACRYPT 2025 上的自动搜索区分器多覆盖一轮，这使得我们对 LBlock 的 $r$ 轮量子密钥恢复攻击的时间复杂度降低了 $2^{16}$。\n\n此外，通过分析LBlock的轮函数结构和密钥调度，我们将15轮攻击的子密钥猜测空间从76位减少到52位，将时间复杂度从\\(O(2^{38})\\)降低到\\(O(2^{26})\\)，降低了\\(2^{12}\\)。", "authors": [{"name": "Yan-Ying Zhu"}, {"name": "Bin-Bin Cai"}, {"name": "Fei Gao"}, {"name": "Song Lin"}], "featured_authors": [{"name": "Yan-Ying Zhu"}, {"name": "Bin-Bin Cai"}, {"name": "Fei Gao"}, {"name": "Song Lin"}], "author_count": 4}, {"id": "2610.27529", "category": "quant-ph", "title": "Collision-aware Bayesian mitigation of photon loss in linear optical quantum circuits", "abstract": "Photon loss is the dominant noise source in linear optical quantum circuits. Each lost photon turns an ideal n-photon outcome into a pattern with fewer photons, so the detector counts no longer follow the ideal output distribution, and the lossless events that do follow it become exponentially rare as the photon number grows. Discarding the lossy events (postselection) therefore wastes most of the data at realistic loss rates, and the ideal distribution has to be inferred from the lossy counts themselves. Recycling-based mitigation (Mills & Mezher, Quantum 2026; Quandela's photon_recycling) reweights lossy samples to recover lossless probabilities, but its estimators are biased and restricted to the no-collision sector, where each output mode holds at most one photon. We instead treat the raw counts as Multinomial observations under per-photon binomial loss and infer the ideal output distribution and the loss rate jointly from a Bayesian posterior, which extends naturally to outputs with collisions. On data from the independent Perceval simulator at the scale of prior work (n=4 photons in m=20 and m=10 modes), the posterior has lower KL divergence than both recycling and postselection at every tested loss rate in the no-collision benchmark. In the collision regime it recovers the loss rate and the collision-pattern probabilities, which recycling cannot estimate, and stays below recycling at every loss rate and below postselection except at low loss, where the two are comparable. Its advantage over recycling grows with the sample count, and it supplies credible intervals that the baselines lack.", "url": "https://arxiv.org/abs/2610.27529", "type": "理论", "summary": "光子损耗是线性光量子电路中的主要噪声源。每个丢失的光子都会将理想的 n 光子结果转变为具有较少光子的模式，因此探测器计数不再遵循理想的输出分布，并且随着光子数量的增长，遵循它的无损事件变得呈指数级稀少。因此，丢弃有损事件（选择后）会以实际丢失率浪费大部分数据，并且必须从有损计数本身推断出理想分布。基于回收的缓解（Mills & Mezher，Quantum 2026；Quandela 的 photon_recycling）重新加权有损样本以恢复无损概率，但其估计器存在偏差并仅限于无碰撞区域，其中每种输出模式最多保留一个光子。相反，我们将原始计数视为每光子二项式损失下的多项式观测，并从贝叶斯后验联合推断理想的输出分布和损失率，贝叶斯后验自然地扩展到具有碰撞的输出。\n\n根据先前工作规模（n=4 个光子，m=20 和 m=10 模式）的独立 Perceval 模拟器的数据，在无碰撞基准中每个测试的丢失率下，后验的 KL 散度均低于回收和后选择。在碰撞机制中，它恢复了回收率无法估计的丢失率和碰撞模式概率，并且在每个丢失率下都保持低于回收率，并且低于后选择，除了低丢失率，其中两者具有可比性。它相对于回收的优势随着样本数量的增加而增加，并且它提供了基线所缺乏的可信间隔。", "authors": [{"name": "Seungwoo Kim"}, {"name": "Seunghyun Ahn"}, {"name": "Donguk Nam"}, {"name": "Hyunho Cha"}, {"name": "Jungwoo Lee"}], "featured_authors": [{"name": "Seungwoo Kim"}, {"name": "Seunghyun Ahn"}, {"name": "Donguk Nam"}, {"name": "Hyunho Cha"}, {"name": "Jungwoo Lee"}], "author_count": 5}, {"id": "2610.27587", "category": "quant-ph", "title": "Microscopic Bipartition and Macroscopic Symmetry in a Rényi Entanglement Ensemble", "abstract": "Universal information extracted from entanglement at a critical point is commonly associated with the long-distance properties of the bulk state, while microscopic details of a lattice bipartition are expected to be washed out under coarse graining. Counterintuitively, we show directly that such microscopic information can survive in the statistical ensemble that determines the second Rényi entropy and obviously change the physics there. Using quantum Monte Carlo simulations of the square-lattice $J$-$Q_3$ model at the Néel--valence-bond-solid (VBS) transition, we measure magnetic and dimer order parameters in the Rényi-2 ensemble. For a standard axis-aligned bipartition, the VBS component perpendicular to the entanglement boundary remains finite in the thermodynamic extrapolation and is inequivalent to the parallel component, while the Néel order vanishes. For a $45^\\circ$ tilted bipartition, in contrast, the two VBS components remain equivalent within numerical accuracy. We interpret this contrast in terms of the Rényi twist defect: the two bipartitions have the same bulk theory but realize different microscopic defect symmetries. Our results demonstrate that lattice information invisible to the bulk continuum theory alone can remain active in the long-distance Rényi ensemble, providing a microscopic explanation for the strong bipartition dependence previously observed in entanglement studies of deconfined criticality.", "url": "https://arxiv.org/abs/2610.27587", "type": "理论+数值", "summary": "从临界点的纠缠中提取的通用信息通常与体态的长距离特性相关，而晶格二分的微观细节预计会在粗粒度下被消除。与直觉相反，我们直接证明这种微观信息可以在确定第二个 Rényi 熵的统计系综中保留下来，并明显改变那里的物理现象。使用 Néel-价键-固体 (VBS) 跃迁处的方晶格 $J$-$Q_3$ 模型的量子蒙特卡罗模拟，我们测量了 Rényi-2 系综中的磁性和二聚体有序参数。对于标准轴对齐二分，垂直于纠缠边界的 VBS 分量在热力学外推中保持有限，并且与平行分量不等价，而 Néel 阶消失。相比之下，对于 $45^\\circ$ 倾斜二分，两个 VBS 分量在数值精度内保持相等。我们用 Rényi 扭曲缺陷来解释这种对比：两个二分具有相同的体积理论，但实现了不同的微观缺陷对称性。\n\n我们的结果表明，仅对体连续统理论不可见的晶格信息可以在长距离 Rényi 系综中保持活跃，这为先前在解禁临界性纠缠研究中观察到的强二分依赖性提供了微观解释。", "authors": [{"name": "Zhe Wang"}, {"name": "Dongxu Liu"}, {"name": "Zheng Yan"}], "featured_authors": [{"name": "Zhe Wang"}, {"name": "Dongxu Liu"}, {"name": "Zheng Yan"}], "author_count": 3}, {"id": "2610.27596", "category": "quant-ph", "title": "Stabilizer Rényi moments beyond entanglement", "abstract": "Stabilizer Rényi moments depend on a choice of operator basis and need not be determined by entanglement spectra. In this paper, we study their spatial decay in critical quantum chains described by two-dimensional conformal field theories. We derive an exact entanglement baseline for reductions of pure stabilizer states and a symmetry selection rule for the charged contribution at fixed support. An exact Ising example shows that an on-site rotation changes the full decay exponent while preserving every subsystem entanglement spectrum. For growing Ising intervals at index two, we obtain an exact Pfaffian representation and compare the charged amplitude with a candidate conformal boundary calculation. The data support this prediction, but its identification with the lattice limit still requires endpoint matching and control of the order of limits.", "url": "https://arxiv.org/abs/2610.27596", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vishnu Jejjala"}, {"name": "Joydeep Naskar"}], "featured_authors": [{"name": "Vishnu Jejjala"}, {"name": "Joydeep Naskar"}], "author_count": 2}, {"id": "2610.27743", "category": "quant-ph", "title": "Multimode Parametric Amplifier for K-Band Quantum Measurements", "abstract": "We demonstrate K-band nondegenerate three-wave-mixing amplification in a multimode resonator comprising an array of 500 SNAILs. Pairing K-band signal modes with lower-frequency internal idler modes enables 20 dB of gain continuously from 19.6 to 25.6 GHz with pump frequencies below 32.2 GHz. At 20 dB gain, the 3-dB bandwidth ranges from 2.6 to 11.7 MHz, and the input-referred 1-dB compression power reaches -100.9 dBm. In the 20-22 GHz band, the average added noise is 0.73 quanta. A two-mode nondegenerate parametric amplification model describes the measured gain response and gain-bandwidth behavior, while a multimode Kerr model captures the overall compression scale. Our amplifier provides a practical solution for implementing a state-of-the-art readout of superconducting qubits in the K-band.", "url": "https://arxiv.org/abs/2610.27743", "type": "实验", "summary": "我们在包含 500 个 SNAIL 阵列的多模谐振器中演示了 K 波段非简并三波混频放大。将 K 波段信号模式与低频内部闲频模式配对，可在 19.6 至 25.6 GHz 范围内连续获得 20 dB 增益，泵浦频率低于 32.2 GHz。在 20 dB 增益时，3 dB 带宽范围为 2.6 至 11.7 MHz，输入参考 1 dB 压缩功率达到 -100.9 dBm。在 20-22 GHz 频段，平均添加噪声为 0.73 量子。双模非简并参数放大模型描述了测量的增益响应和增益带宽行为，而多模 Kerr 模型则捕获总体压缩比例。我们的放大器为实现 K 波段超导量子位的最先进读出提供了实用的解决方案。", "authors": [{"name": "Chulwoo Ahn"}, {"name": "Vladimir Manucharyan"}], "featured_authors": [{"name": "Chulwoo Ahn"}, {"name": "Vladimir Manucharyan"}], "author_count": 2}, {"id": "2610.27768", "category": "quant-ph", "title": "Bidirectional Path Integral Monte Carlo Simulation of Quantum Circuits", "abstract": "We propose an approximate classical algorithm for estimating quantum circuits' transition amplitudes, $\\langle \\Psi_f | \\hat{U} | \\Psi_0 \\rangle$, based on Monte Carlo sums over bidirectionally sampled Feynman paths. The algorithm generates Feynman paths, i.e., sequences of intermediate computational basis states, by combining information from random walks initiated at both the input and output states, $\\Psi_0$ and $\\Psi_f$, respectively. It further combines this bidirectional approach with Multiple Importance Sampling, a powerful variance reduction technique that avoids variance peaks caused by divisions by the very low sampling probabilities associated with hard to reach paths. Empirical data demonstrate the superior convergence rate exhibited by the bidirectional algorithm over a unidirectional, forward-only sampling approach. This superiority is due to the effectiveness of the proposed algorithm in finding and weighting paths with non-zero amplitude in an extremely sparse path space. Sum of paths algorithms exhibit very favourable space complexity. Monte Carlo replaces exhaustive enumeration of the exponentially large path space by stochastic sampling, the computational cost being determined by the variance of the estimator. This work demonstrates these two features by presenting results on very large quantum circuits, with up to 4096 qubits.", "url": "https://arxiv.org/abs/2610.27768", "type": "数值", "summary": "我们提出了一种近似经典算法来估计量子电路的跃迁幅度，$\\langle \\Psi_f | \\帽子{U} | \\Psi_0 \\rangle$，基于双向采样费曼路径上的蒙特卡洛求和。该算法通过组合分别在输入和输出状态 $\\Psi_0$ 和 $\\Psi_f$ 处启动的随机游走的信息，生成费曼路径，即中间计算基础状态的序列。它将这种双向方法与多重重要性采样进一步结合起来，多重重要性采样是一种强大的方差减少技术，可以避免由于与难以到达的路径相关的极低采样概率的划分而导致方差峰值。经验数据表明，双向算法比单向、仅前向采样方法具有更高的收敛速度。这种优越性是由于所提出的算法在极其稀疏的路径空间中寻找和加权具有非零幅度的路径的有效性。路径总和算法表现出非常有利的空间复杂度。\n\n蒙特卡洛通过随机采样取代了对指数大路径空间的详尽枚举，计算成本由估计器的方差决定。这项工作通过在高达 4096 个量子位的非常大的量子电路上展示结果来展示这两个特征。", "authors": [{"name": "Luis Paulo Santos"}, {"name": "Thomas Bashford-Rogers"}], "featured_authors": [{"name": "Luis Paulo Santos"}, {"name": "Thomas Bashford-Rogers"}], "author_count": 2}, {"id": "2610.27780", "category": "quant-ph", "title": "Fates of Exact Finite-$N$ First-Order Transitions: Coherent Suppression versus Spectral-Collapse Termination", "abstract": "Symmetry-protected ground-state crossings can produce exact first-order transitions (FOTs) even at finite $N$, in contrast to continuous transitions governed by soft-mode criticality. We establish exact Juddian ground-state crossings for arbitrary finite $N$ in the one- and two-photon anisotropic Dicke models and identify a common two-channel structure: the eigenvalues of the coupling matrix set the local normal-state instability thresholds, whereas its determinant fixes the exact crossing. Despite this common structure, the resulting FOTs have distinct fates determined by the bosonic response. In the one-photon model, the overlap between coherent Juddian branches vanishes in the thermodynamic or infinite frequency-ratio limits, asymptotically suppressing the FOT cusp. In the two-photon model, squeezed Juddian states lose normalizability at spectral collapse, thereby terminating the physical FOT line at finite $N$. Although the cusp strength tends to zero as the endpoint is approached, the terminating FOT retains a collective spectral signature: the different-parity gap is predicted to close with an $N$-dependent exponent $\\mu_N=(2N+3)/4$, one greater than the cusp termination exponent. By contrast, the same-parity soft mode retains $N$-independent square-root scaling and governs the critical response. Thus spectral collapse can terminate an exact finite-$N$ FOT while preserving its collective imprint in the parity-resolved spectrum.", "url": "https://arxiv.org/abs/2610.27780", "type": "理论+数值", "summary": "与由软模式临界性控制的连续跃迁相比，即使在有限的 $N$ 下，对称保护的基态交叉也可以产生精确的一阶跃迁 (FOT)。我们在单光子和双光子各向异性 Dicke 模型中为任意有限 $N$ 建立了精确的 Juddian 基态交叉，并确定了一个常见的双通道结构：耦合矩阵的特征值设置了局部正常状态不稳定阈值，而其行列式则确定了精确的交叉。 Despite this common structure, the resulting FOTs have distinct fates determined by the bosonic response.在单光子模型中，相干 Juddian 分支之间的重叠在热力学或无限频率比限制中消失，渐进地抑制了 FOT 尖点。在双光子模型中，压缩 Juddian 态在光谱崩溃时失去归一化性，从而在有限 $N$ 处终止物理 FOT 线。\n\n尽管接近终点时尖点强度趋于零，但终止 FOT 保留了集体光谱特征：预计不同奇偶校验间隙将以 $N$ 相关指数 $\\mu_N=(2N+3)/4$ 关闭，该指数比尖点终止指数大 1。相比之下，同奇偶校验软模式保留与 $N$ 无关的平方根缩放并控制关键响应。因此，光谱崩溃可以终止精确的有限$N$ FOT，同时保留其在奇偶解析光谱中的集体印记。", "authors": [{"name": "Jiong Li"}, {"name": "Li-Wei Duan"}, {"name": "Qing-Hu Chen"}, {"name": "Hai-Qing Lin"}], "featured_authors": [{"name": "Jiong Li"}, {"name": "Li-Wei Duan"}, {"name": "Qing-Hu Chen"}, {"name": "Hai-Qing Lin"}], "author_count": 4}, {"id": "2610.27854", "category": "quant-ph", "title": "Trapped-ion-based quantum repeater node across a 17 km metropolitan fiber", "abstract": "Concatenation of quantum repeater nodes has been proposed as a means to distribute entanglement efficiently across future long-distance networks. Here, we demonstrate a trapped-ion repeater node that establishes photonic entanglement over a 17 km fiber traversing a city, moving beyond laboratory-only prototypes. The node comprises two atomic ions coupled to an optical cavity. First, a detailed characterization is performed of the long fiber channel and of ion-photon entanglement distributed across it. Next, a repeater-node protocol is implemented, achieving entanglement between a local photon and a remote photon with a Bell-state fidelity of $81.6^{+1.9}_{-1.4}\\%$. These results demonstrate that trapped-ion repeater-node technology can operate over existing city-scale fiber infrastructure and represent a step toward distributed quantum repeater networks.", "url": "https://arxiv.org/abs/2610.27854", "type": "理论", "summary": "量子中继器节点的串联已被提议作为在未来的长距离网络中有效分布纠缠的一种手段。在这里，我们演示了一个俘获离子中继器节点，该节点在穿越城市的 17 公里光纤上建立光子纠缠，超越了仅限实验室的原型。该节点包括耦合到光学腔的两个原子离子。首先，对长光纤通道和分布在其上的离子光子纠缠进行详细表征。接下来，实现中继器节点协议，实现本地光子和远程光子之间的纠缠，贝尔态保真度为 $81.6^{+1.9}_{-1.4}\\%$。这些结果表明，俘获离子中继器节点技术可以在现有的城市规模光纤基础设施上运行，代表着向分布式量子中继器网络迈出了一步。", "authors": [{"name": "K. Fabitha"}, {"name": "T. Runggaldier"}, {"name": "A. Winkler"}, {"name": "F. Bernecker"}, {"name": "J. Bate"}, {"name": "M. Canteri"}, {"name": "J. Helgert"}, {"name": "T. E. Northup"}, {"name": "V. Krutyanskiy"}, {"name": "B. P. Lanyon"}], "featured_authors": [{"name": "K. Fabitha"}, {"name": "T. Runggaldier"}, {"name": "A. Winkler"}, {"name": "T. E. Northup"}, {"name": "V. Krutyanskiy"}, {"name": "B. P. Lanyon"}], "author_count": 10}, {"id": "2610.27915", "category": "quant-ph", "title": "Sparse block encoding with low subnormalisation for quantum linear solvers on unstructured meshes", "abstract": "Unstructured meshes are widely used in modelling and simulation in Computational Fluid Dynamics (CFD) due to their geometric flexibility. However, they require an efficient block encoding circuit describing the system. Here, we present a new block encoding methodology for unstructured mesh solvers based on decomposing the system matrix into a sum of 1-sparse matrices. This block encoding is engineered to reduce subnormalisation even in the absence of structure by hiding the contribution of large matrix elements behind others. We investigate three methods of 1-sparse decomposition. Our circuit constructions can optionally take advantage of limited matrix bandwidth and repeated values. For example we consider digitisation (reduced precision), where the number of multiplexed rotation gates is equal to the number of non-unique matrix entries. We evaluate our methodologies using 2D and 3D CFD matrices for unstructured aerofoil meshes, structured cavity, and duct meshes, with and without matrix preconditioning. Our results show that we are able to achieve a block encoding with a near constant subnormalisation factor as the number of matrix preconditioning infill levels increases. This significantly reduces the subnormalised condition number and, in one case, reduces the degree of the QSP polynomial approximation to $1/x$ by 100,000. Reduced precision digitisation is shown to become more effective as the number of preconditioning infill levels is increased and, in one case, reduces the number of multiplexed rotations from 2,785,576 to 546 whilst maintaining an infidelity of $2.6\\times10^{-5}$ relative to the classical solution. The effect of digitisation on QSVT solutions is demonstrated using 2D and 3D unstructured mesh aerofoil cases. Due to its flexibility and automatic applicability, we believe our 1-sparse decomposition block encoding can offer benefits to other quantum applications.", "url": "https://arxiv.org/abs/2610.27915", "type": "理论+数值", "summary": "非结构化网格由于其几何灵活性而广泛应用于计算流体动力学 (CFD) 的建模和仿真。然而，它们需要一个描述系统的高效块编码电路。在这里，我们提出了一种用于非结构化网格求解器的新块编码方法，该方法基于将系统矩阵分解为 1-稀疏矩阵之和。这种块编码经过精心设计，即使在没有结构的情况下，也可以通过将大矩阵元素的贡献隐藏在其他元素后面来减少次归一化。我们研究了 1-稀疏分解的三种方法。我们的电路结构可以选择利用有限的矩阵带宽和重复值。例如，我们考虑数字化（降低精度），其中多路复用旋转门的数量等于非唯一矩阵条目的数量。我们使用 2D 和 3D CFD 矩阵来评估我们的方法，适用于非结构化翼型网格、结构化空腔和管道网格，无论是否进行矩阵预处理。我们的结果表明，随着矩阵预处理填充级别数量的增加，我们能够实现具有接近恒定的次归一化因子的块编码。\n\n这显着减少了次归一化条件数，并且在一种情况下，将 QSP 多项式逼近的次数减少到 $1/x$ 100,000。随着预处理填充级别数量的增加，降低精度的数字化变得更加有效，并且在一种情况下，将多路旋转的数量从 2,785,576 减少到 546，同时相对于经典解决方案保持 $2.6\\times10^{-5}$ 的不保真度。使用 2D 和 3D 非结构化网格翼型案例证明了数字化对 QSVT 解决方案的影响。由于其灵活性和自动适用性，我们相信我们的 1-稀疏分解块编码可以为其他量子应用带来好处。", "authors": [{"name": "Leigh Lapworth"}, {"name": "Jarrett Smalley"}, {"name": "Christoph Sünderhauf"}], "featured_authors": [{"name": "Leigh Lapworth"}, {"name": "Jarrett Smalley"}, {"name": "Christoph Sünderhauf"}], "author_count": 3}, {"id": "2610.27929", "category": "quant-ph", "title": "Constant-Depth Quantum Barrier Option Pricing via a Static Bivariate Oracle Framework", "abstract": "Quantum amplitude estimation offers a theoretical quadratic speedup over classical Monte Carlo methods for financial derivative pricing. However, extending gate-based algorithms to path-dependent barrier options has historically been hampered by sequential path discretization, where tracking price paths across $d$ monitoring dates incurs a linear escalation in qubit footprint and gate depth ($\\mathcal{O}(d)$), posing severe coherence challenges for near-term quantum processors. In this work, we present a constant-depth quantum pricing framework that fundamentally eliminates the temporal dependency of barrier monitoring. Leveraging the Brownian reflection principle and Girsanov theorem, we project the continuous supremum dynamics onto a static bivariate joint distribution of the terminal price $S_T$ and running supremum $M_T$. This allows decoupling dynamic boundary checks into a static bivariate oracle comprising two parallel comparators and a dual-controlled rotation gate. We prove this architecture reduces circuit depth and comparator complexity from $\\mathcal{O}(d)$ to an invariant $\\mathcal{O}(1)$, while supporting discrete monitoring via zero-quantum-cost boundary corrections. Transpilation benchmarks for daily monitoring ($d = 252$) show our framework slashes physical CNOT count by 98.59% (from 2262 to 32) and compresses two-qubit depth by 98.02% (from 1514 to 30 layers). Under a realistic 127-qubit IBM Eagle noise model, the shallow circuit achieves a 7.84% relative valuation error with M3 readout mitigation. Finally, the framework seamlessly extends to nonlinear exotic payoffs lacking analytical solutions, establishing a noise-resilient pathway toward practical quantum advantage in computational finance.", "url": "https://arxiv.org/abs/2610.27929", "type": "理论+数值", "summary": "量子振幅估计为金融衍生品定价提供了比经典蒙特卡罗方法理论上的二次加速。然而，将基于门的算法扩展到路径相关的屏障选项历来受到顺序路径离散化的阻碍，其中跟踪 $d$ 监控日期的价格路径会导致量子位占用空间和门深度 ($\\mathcal{O}(d)$) 的线性升级，这对近期量子处理器带来了严重的一致性挑战。在这项工作中，我们提出了一个恒定深度的量子定价框架，从根本上消除了障碍监测的时间依赖性。利用布朗反射原理和吉尔萨诺夫定理，我们将连续上界动态投影到终端价格 $S_T$ 和运行上界 $M_T$ 的静态二元联合分布上。这允许将动态边界检查解耦到包含两个并行比较器和双控制旋转门的静态双变量预言机中。我们证明这种架构将电路深度和比较器复杂性从 $\\mathcal{O}(d)$ 降低到不变的 $\\mathcal{O}(1)$，同时通过零量子成本边界校正支持离散监控。\n\n日常监控的转译基准 ($d = 252$) 显示我们的框架将物理 CNOT 数量减少了 98.59%（从 2262 到 32），并将两个量子位深度压缩了 98.02%（从 1514 层到 30 层）。在现实的 127 量子位 IBM Eagle 噪声模型下，浅层电路通过 M3 读出缓解实现了 7.84% 的相对估值误差。最后，该框架无缝扩展到缺乏分析解决方案的非线性奇异收益，建立了一条通往计算金融领域实用量子优势的抗噪声途径。", "authors": [{"name": "Ji-Hui Mo"}, {"name": "Yuan-Hong Tao"}], "featured_authors": [{"name": "Ji-Hui Mo"}, {"name": "Yuan-Hong Tao"}], "author_count": 2}, {"id": "2610.27948", "category": "quant-ph", "title": "Cooling more while dissipating less: anomalous tradeoffs from thermodynamic geometry", "abstract": "We show that, starting from the same state, optimal driving can sometimes reach a colder (or hotter) target in the same amount of time while dissipating less energy, or equivalently dissipate the same amount of energy in a shorter time. We study this counterintuitive phenomenon in the slow-driving regime of an open quantum system, where we name it Near-Equilibrium Anomalous Tradeoff (NEAT). We establish necessary conditions for its occurrence and show its underlying geometric origin. While NEAT is reminiscent of the well-known Mpemba effect, the two phenomena are distinct in general. We demonstrate NEAT in an exactly solvable qutrit model, as well as for d-dimensional birth-death dynamics with independently controlled energy levels. Finally, we show how NEAT can improve the performance of Carnot engines.", "url": "https://arxiv.org/abs/2610.27948", "type": "理论", "summary": "我们表明，从相同的状态开始，最佳驾驶有时可以在相同的时间内达到更冷（或更热）的目标，同时消耗更少的能量，或者等效地在更短的时间内消耗相同的能量。我们在开放量子系统的慢速驱动机制中研究这种违反直觉的现象，我们将其命名为近平衡异常权衡（NEAT）。我们建立了其发生的必要条件并显示了其潜在的几何起源。虽然 NEAT 让人想起众所周知的 Mpemba 效应，但这两种现象总体上是截然不同的。我们在精确可解的 qutrit 模型中以及具有独立控制能级的 d 维生灭动力学中演示了 NEAT。最后，我们展示了 NEAT 如何提高卡诺发动机的性能。", "authors": [{"name": "Andrea Canzio"}, {"name": "Vasco Cavina"}, {"name": "Salvatore Raia"}, {"name": "Vito Vetrano"}, {"name": "Matteo Scandi"}, {"name": "Paolo Abiuso"}], "featured_authors": [{"name": "Andrea Canzio"}, {"name": "Vasco Cavina"}, {"name": "Salvatore Raia"}, {"name": "Vito Vetrano"}, {"name": "Matteo Scandi"}, {"name": "Paolo Abiuso"}], "author_count": 6}, {"id": "2610.27979", "category": "quant-ph", "title": "The Fer expansion of a driven spin under $\\mathfrak{su}(2)$ operations cannot terminate beyond first order", "abstract": "The Fer expansion writes the propagator of a driven quantum system as an ordered product of exponentials, each generated by the time integral of an effective Hamiltonian that governs the evolution left over by the previous factors. It can be stopped after finitely many factors whenever this leftover evolution is known in closed form, for instance when the effective Hamiltonian commutes with itself at all times, or precesses about a fixed axis with constant angular velocity. For $\\mathfrak{su}(2)$, in any representation, from a qubit to a spin of any size, we resum the Fer recursion into a closed map on curves in $\\mathbb{R}^3$. We prove that, for a real-analytic drive, in both cases the expansion stops beyond the first factor only trivially, when the first exponential is already exact.", "url": "https://arxiv.org/abs/2610.27979", "type": "理论", "summary": "Fer 展开将驱动量子系统的传播子写成指数的有序积，每个指数乘积都是由有效哈密顿量的时间积分生成的，该有效哈密顿量控制着先前因素留下的演化。只要这种剩余演化以封闭形式已知，例如当有效哈密顿量始终与自身交换，或者以恒定角速度围绕固定轴进动时，它就可以在有限多个因素之后停止。对于 $\\mathfrak{su}(2)$，在任何表示中，从量子位到任何大小的自旋，我们将 Fer 递归恢复为 $\\mathbb{R}^3$ 曲线上的闭合映射。我们证明，对于实解析驱动器，在这两种情况下，当第一个指数已经精确时，扩展仅会轻微地停止超过第一个因子。", "authors": [{"name": "Lorenzo Bagnasacco"}, {"name": "Daniel Burgarth"}, {"name": "Vittorio Giovannetti"}, {"name": "Kazuya Yuasa"}], "featured_authors": [{"name": "Lorenzo Bagnasacco"}, {"name": "Daniel Burgarth"}, {"name": "Vittorio Giovannetti"}, {"name": "Kazuya Yuasa"}], "author_count": 4}, {"id": "2610.27994", "category": "quant-ph", "title": "Phase shifts and fluctuations from motional, relativistic, and dark-matter effects in ion-trap clocks", "abstract": "Ions possess both center-of-mass motion and internal states, rendering trapped-ion optical clocks susceptible to perturbations of both degrees of freedom, which results in systematic shifts and fluctuations with motional and relativistic origins. We develop a quantum theory that connects these effects to filter functions determined by the employed pulse sequences and show how the interrogation can be tailored to suppress or enhance specific perturbations. Our treatment includes laser frequency noise and motional effects such as recoil and Doppler shifts, micromotion and excess micromotion, as well as state-dependent trap imperfections and accelerations, e.g., caused by Stark shifts. We further account for relativistic effects including time dilation and the mass defect, and show how the same framework can be applied to hypothetical dark-matter signals. By considering ensemble-averaged phases and their variances, we characterize both systematic shifts and fluctuations, while asynchronous operation relative to the Paul-trap drive allows motional fluctuations to average down between runs. Our results provide a unified framework for characterizing and controlling the systematic and statistical contributions that determine the trueness and precision of trapped-ion optical clocks.", "url": "https://arxiv.org/abs/2610.27994", "type": "理论", "summary": "离子同时具有质心运动和内部状态，使得俘获离子光学钟容易受到两个自由度的扰动，从而导致具有运动和相对论起源的系统位移和波动。我们开发了一种量子理论，将这些效应与由所采用的脉冲序列确定的滤波器函数联系起来，并展示了如何定制询问以抑制或增强特定的扰动。我们的治疗包括激光频率噪声和运动效应，例如反冲和多普勒频移、微运动和过度微运动，以及状态相关的陷阱缺陷和加速度，例如由斯塔克频移引起的。我们进一步解释了包括时间膨胀和质量缺陷在内的相对论效应，并展示了如何将相同的框架应用于假设的暗物质信号。通过考虑整体平均相位及其方差，我们描述了系统偏移和波动，而相对于 Paul-trap 驱动器的异步操作允许运动波动在运行之间平均下来。\n\n我们的结果提供了一个统一的框架，用于表征和控制决定俘获离子光学钟的真实性和精度的系统和统计贡献。", "authors": [{"name": "Alexander Bott"}, {"name": "Fabio Di Pumpo"}, {"name": "Enno Giese"}], "featured_authors": [{"name": "Alexander Bott"}, {"name": "Fabio Di Pumpo"}, {"name": "Enno Giese"}], "author_count": 3}, {"id": "2610.28017", "category": "quant-ph", "title": "Relativistic Strong Quantum Mpemba Effect", "abstract": "The Unruh effect links acceleration to thermalization, providing a relativistic setting for anomalous quantum relaxation. We demonstrate a {\\it relativistic} strong quantum Mpemba effect in the Unruh thermalization of a two-level detector coupled to a massless scalar field. For a fixed pair of isospectral initial states, relaxation curves that never cross in inertial motion exhibit a Mpemba crossing above a threshold acceleration. At a higher, precisely tuned acceleration, the initially farther state has zero overlap with the slowest decay mode and relaxes with a faster asymptotic exponential rate. We identify how competition between transition and dephasing channels governs the relaxation spectrum, where sufficiently strong longitudinal coupling enables acceleration to switch the relaxation bottleneck between population and coherence modes. We derive the spectral-switching condition and construct isospectral preparation protocols that eliminate slow-mode contributions within their physical domains. These protocols reveal how coherence can suppress or enhance slow-mode overlap at fixed purity, depending on the underlying spectral structure. Our results establish acceleration as a control parameter for anomalous quantum relaxation, connecting relativistic quantum dynamics with nonequilibrium thermodynamics.", "url": "https://arxiv.org/abs/2610.28017", "type": "理论", "summary": "安鲁效应将加速与热化联系起来，为反常量子弛豫提供了相对论设置。我们在与无质量标量场耦合的两能级探测器的 Unruh 热化中证明了{\\it 相对论}强量子 Mpemba 效应。对于一对固定的等谱初始状态，在惯性运动中从不交叉的弛豫曲线表现出高于阈值加速度的 Mpemba 交叉。在更高、精确调谐的加速度下，最初较远的状态与最慢的衰减模式零重叠，并以更快的渐近指数速率松弛。我们确定了过渡通道和相干通道之间的竞争如何控制弛豫谱，其中足够强的纵向耦合能够加速切换总体模式和相干模式之间的弛豫瓶颈。我们推导出光谱切换条件并构建等光谱准备协议，消除其物理域内的慢模式贡献。这些协议揭示了相干性如何在固定纯度下抑制或增强慢模重叠，具体取决于底层的光谱结构。\n\n我们的结果将加速度确立为反常量子弛豫的控制参数，将相对论量子动力学与非平衡热力学联系起来。", "authors": [{"name": "Zhilong Liu"}, {"name": "Zehua Tian"}, {"name": "Hui Jing"}, {"name": "Jieci Wang"}], "featured_authors": [{"name": "Zhilong Liu"}, {"name": "Zehua Tian"}, {"name": "Hui Jing"}, {"name": "Jieci Wang"}], "author_count": 4}, {"id": "2610.28057", "category": "quant-ph", "title": "Optimal Quantum-Circuit Synthesis and Implementation of General Unitaries with Parallelized Bitstring-Conditioned Rotations", "abstract": "We theoretically introduce a quantum-circuit synthesis protocol to realize any $n$-qubit transformation $U\\in U(2^n)$, up to a diagonal. The resulting circuit is directly native to and optimal in gate count and depth for systems where bitstring-conditioned rotations with tunable angle and axis, $C^{(n-1)}R(\\theta,\\phi)$, form the set of native operations. Subsequently, we suggest how this protocol can be implemented in a few-mode superconducting circuit, and experimentally demonstrate the method for the smallest nontrivial case, i.e., for two qubits. We report an average gate fidelity of 97.6 % for Haar-random two-qubit unitaries up to phase shifts in the computational basis. Importantly, these results suggest that multimode devices, such as those in the multimon or multiunimon families may become competitive with qubit-array networks for general-unitary implementations for qubit counts as low as three.", "url": "https://arxiv.org/abs/2610.28057", "type": "实验", "summary": "我们理论上引入了一种量子电路综合协议来实现任何$n$量子位变换$U\\in U(2^n)$，直到对角线。由此产生的电路直接适用于具有可调角度和轴的位串条件旋转 $C^{(n-1)}R(\\theta,\\phi)$ 形成本机操作集的系统，并且在门数和深度方面是最佳的。随后，我们建议如何在少模式超导电路中实现该协议，并通过实验演示最小非平凡情况（即两个量子位）的方法。我们报告了哈尔随机二量子位酉在计算基础上相移时的平均门保真度为 97.6%。重要的是，这些结果表明，多模设备（例如 multimon 或 multiunimon 系列中的设备）可能会在量子位计数低至 3 的通用统一实现方面与量子位阵列网络竞争。", "authors": [{"name": "Heikki Suominen"}, {"name": "Suman Kundu"}, {"name": "Heidi Kivijärvi"}, {"name": "Sasu Tuohino"}, {"name": "Mikko Tuokkola"}, {"name": "Eemeli Forsbom"}, {"name": "Madhavi Chand"}, {"name": "Vasilii Vadimov"}, {"name": "R. Vijay"}, {"name": "Mikko Möttönen"}], "featured_authors": [{"name": "Heikki Suominen"}, {"name": "Suman Kundu"}, {"name": "Heidi Kivijärvi"}, {"name": "Vasilii Vadimov"}, {"name": "R. Vijay"}, {"name": "Mikko Möttönen"}], "author_count": 10}, {"id": "2610.28061", "category": "quant-ph", "title": "A $q$-Inspired Radial Quantum Kinematics", "abstract": "We study how the one-dimensional deformation suggested by nonadditive $q$-calculus can be extended to a rotationally covariant quantum model and what observable consequences follow from this extension. We choose a radial extension about a distinguished center in which only the radial derivative is deformed, while tangential derivatives retain their ordinary form. Within this model, we construct self-adjoint frame-momentum operators and derive a rotationally invariant uncertainty bound with a correction proportional to the mean distance from the center. We then adopt a non-negative kinetic Hamiltonian built from these momenta and derive the leading harmonic-oscillator energy shifts for weak deformation. The energy corrections split the levels with different orbital angular momenta that are degenerate in the undeformed oscillator, while preserving the degeneracy associated with rotational symmetry.", "url": "https://arxiv.org/abs/2610.28061", "type": "理论", "summary": "我们研究如何将非加性 $q$ 微积分提出的一维变形扩展到旋转协变量子模型，以及从这种扩展中得出什么可观察的结果。我们选择围绕一个显着中心的径向延伸，其中仅径向导数变形，而切向导数保留其普通形式。在该模型中，我们构造了自伴框架动量算子，并导出了旋转不变的不确定性界限，其修正量与距中心的平均距离成正比。然后，我们采用根据这些动量构建的非负动力学哈密顿量，并推导出弱变形的主要谐振子能量变化。能量修正将具有不同轨道角动量的能级分开，这些轨道角动量在未变形振荡器中简并，同时保留与旋转对称性相关的简并性。", "authors": [{"name": "Mir Afrasiar"}, {"name": "Xian-Hui Ge"}], "featured_authors": [{"name": "Mir Afrasiar"}, {"name": "Xian-Hui Ge"}], "author_count": 2}, {"id": "2610.28162", "category": "quant-ph", "title": "Dimension-free marginal inequalities for pure three-party states", "abstract": "The quantum marginal problem, concerned with the compatibility of local and global properties of a multipartite quantum system, is arguably one of the fundamental questions in quantum theory. In this article we introduce a novel family of inequalities bounding the allowed local spectra of a pure tripartite state. The number of inequalities in this family grows with the dimension of the system. Most importantly, the inequalities hold for arbitrary dimensions. For equal local dimension at most 4, they generate the complete set of eigenvalue inequalities.", "url": "https://arxiv.org/abs/2610.28162", "type": "理论", "summary": "量子边际问题涉及多部分量子系统的局部和全局属性的兼容性，可以说是量子理论中的基本问题之一。在本文中，我们介绍了一个新颖的不等式族，它限制了纯三方状态的允许局部范围。这个家庭中不平等的数量随着系统规模的扩大而增加。最重要的是，不等式适用于任意维度。对于最多 4 的相同局部维数，它们生成完整的特征值不等式集。", "authors": [{"name": "Simon Morelli"}], "featured_authors": [{"name": "Simon Morelli"}], "author_count": 1}, {"id": "2610.28217", "category": "quant-ph", "title": "Structured light for addressable two-qubit gates in medium-sized ion crystals: modeling motional and dephasing errors", "abstract": "Geometric phase gates with addressed laser radiation are widely used in trapped-ion quantum computers to drive high-fidelity entangling gates on an arbitrary qubit pair of a larger ion chain. Such programmable connectivity exploits the collective phonons to mediate the desired interaction, while simultaneously achieving robustness to their thermal fluctuations by a careful calibration of the gate time with respect to the laser and vibrational-mode frequencies. Crosstalk errors can arise when the spectator qubits, which should ideally remain idle during the gate, are partially driven by the laser fields. The minimal crosstalk, which is set by the laser beam size on the spectator ions, can be achieved when the addressing beams propagate perpendicular to the ion chain. However, this results in exciting the radial phonons, and can complicate achieving high-fidelities as the ion chain grows due to the so-called spectral mode crowding. In this work, we present the theoretical description of a scheme recently implemented by Faorlin et $al.$. This scheme overcomes these complications by engineering addressable state-dependent forces along the ion-chain with laser beams that propagate perpendicular to it through the use of structured light gradients. In this way, one can excite the axial phonons and avoid the spectral mode crowding, while simultaneously minimizing the crosstalk. We present a detailed derivation of the entangling gate scheme, together with analytical closed-form expressions for the leading contribution to the gate error caused by thermal motional fluctuations and dephasing noise. Our results confirm that such fluctuations account for up to 93$\\%$ of the error budget under the operating conditions of the gate implemented by Faorlin et $al.$. We identify target parameters to reduce the motional error from the reported $10^{-3}$ to the $10^{-5}$ level.", "url": "https://arxiv.org/abs/2610.28217", "type": "理论", "summary": "具有寻址激光辐射的几何相位门广泛用于捕获离子量子计算机，以驱动较大离子链的任意量子位对上的高保真纠缠门。这种可编程连接利用集体声子来介导所需的相互作用，同时通过相对于激光和振动模式频率仔细校准门时间来实现对热波动的鲁棒性。当观察量子位（理想情况下在选通期间应保持空闲）部分由激光场驱动时，可能会出现串扰错误。当寻址光束垂直于离子链传播时，可以实现最小串扰，该串扰由观察者离子上的激光束尺寸设定。然而，这会导致激发径向声子，并且随着离子链由于所谓的光谱模式拥挤而增长，实现高保真度会变得复杂。在这项工作中，我们提出了 Faorlin 等人最近实施的方案的理论描述。\n\n该方案通过使用结构光梯度垂直于离子链传播的激光束沿离子链设计可寻址的状态相关力，从而克服了这些复杂性。通过这种方式，可以激发轴向声子并避免谱模拥挤，同时最大限度地减少串扰。我们提出了纠缠门方案的详细推导，以及由热运动波动和相移噪声引起的门误差的主要贡献的解析封闭式表达式。我们的结果证实，在 Faorlin 等人实施的门的操作条件下，这种波动占误差预算的高达 93$\\%$。我们确定目标参数，将运动误差从报告的 $10^{-3}$ 减少到 $10^{-5}$ 水平。", "authors": [{"name": "Pablo Viñas"}, {"name": "Alan Kahan"}, {"name": "Tommaso Faorlin"}, {"name": "Lorenz Panzl"}, {"name": "Phoebe Grosser"}, {"name": "Thomas Monz"}, {"name": "Alejandro Bermudez"}], "featured_authors": [{"name": "Pablo Viñas"}, {"name": "Alan Kahan"}, {"name": "Tommaso Faorlin"}, {"name": "Phoebe Grosser"}, {"name": "Thomas Monz"}, {"name": "Alejandro Bermudez"}], "author_count": 7}, {"id": "2610.28336", "category": "quant-ph", "title": "Floquet ground state order", "abstract": "Clean, interacting, periodically driven systems are believed to thermalize to featureless, infinite-temperature states that preclude the formation of stable ordered states. Here, we show stable quantum order, distinct from prethermal order, and its phase transitions in the ground state of the average-energy operator. Decomposing the time evolution into geometric and average-energy dynamics, we apply Geometric Floquet theory to identify the Floquet ground state. We derive a general variational principle to compute the Floquet ground state in large interacting periodically driven systems, and use it to develop a matrix product state algorithm. In driven nonintegrable chains of more than 100 interacting spins, our numerical simulations exhibit a gapped, area-law entangled Floquet ground state in extended parameter regimes; the ground-state manifold can support both dressed equilibrium order (e.g., Floquet antiferromagnets) and inherently nonequilibrium order (e.g., ground-state time crystals). This quantum order is protected by a finite average-energy gap, which closes at phase transition points upon changing model parameters. We decompose Floquet phases of matter into their equilibrium and nonequilibrium elements: whereas the Floquet ground state at any fixed time is a representative of an equilibrium phase of matter, the nonequilibrium content is entirely produced by the drive holonomy and is geometric. Finally, we identify quasilocal counterdiabatic driving as a mechanism for the stability against heating of gapped Floquet ground states in nonintegrable quantum systems, and argue why Floquet ground states evade the Eigenstate Thermalization Hypothesis. Our work enables the study of interacting nonequilibrium matter deep into the many-body regime, and lays the foundations for the engineering of strongly correlated ordered quantum states.", "url": "https://arxiv.org/abs/2610.28336", "type": "理论+数值", "summary": "人们认为，清洁、相互作用、周期性驱动的系统会热化到无特征、无限温度状态，从而阻碍稳定有序状态的形成。在这里，我们展示了与热前序不同的稳定量子序，及其在平均能量算子基态下的相变。将时间演化分解为几何和平均能量动力学，我们应用几何 Floquet 理论来识别 Floquet 基态。我们推导了通用变分原理来计算大型交互周期性驱动系统中的 Floquet 基态，并用它来开发矩阵乘积状态算法。在超过 100 个相互作用自旋的驱动不可积链中，我们的数值模拟在扩展参数范围内展示了有间隙的面积律纠缠 Floquet 基态；基态流形可以支持修饰平衡序（例如，Floquet 反铁磁体）和固有非平衡序（例如，基态时间晶体）。这种量子序受到有限平均能隙的保护，该能隙在改变模型参数时在相变点处关闭。\n\n我们将物质的 Floquet 相分解为其平衡和非平衡元素：而任何固定时间的 Floquet 基态都是物质平衡相的代表，非平衡含量完全由驱动完整产生，并且是几何的。最后，我们将准局域反绝热驱动确定为不可积量子系统中带隙 Floquet 基态加热稳定性的机制，并论证了为什么 Floquet 基态回避了本征态热化假说。我们的工作使得能够深入研究多体体系中相互作用的非平衡物质，并为强相关有序量子态的工程奠定基础。", "authors": [{"name": "Suman Mondal"}, {"name": "Paul M. Schindler"}, {"name": "Marin Bukov"}], "featured_authors": [{"name": "Suman Mondal"}, {"name": "Paul M. Schindler"}, {"name": "Marin Bukov"}], "author_count": 3}, {"id": "2610.28349", "category": "quant-ph", "title": "CO$Φ$ - COmpiling PHotonics into dIgital quantum circuits", "abstract": "Photonic and qubit-based (digital) approaches to quantum computing are largely regarded as separate paradigms. This article aims to bridge these paradigms by developing a method for mapping quantum-optical systems onto qubit-based quantum circuits. The key ingredient enabling this mapping is the introduction of a truncation of the Fock space describing single-mode optical states. Within this framework, representations of basic photonic operations are developed, including the phase-rotation operator, the displacement operator, the squeezing operator, and the beam splitter. Explicit quantum circuit constructions are provided for Fock-space truncations of dimension $N=2$ and $N=4$. We discuss benchmarking of the implemented operations and identify the regime of applicability and the limitations of the proposed method. The presented results can be used to simulate quantum optical circuits on qubit-based quantum computers, with special relevance to Gaussian Boson Sampling in the low-photon-number regime. To demonstrate the practical applicability of this approach, we complement the theoretical framework with a Python-based quantum programming tool CO$\\Phi$ that compiles Blackbird quantum-optics programs into qubit-based OpenQASM circuits using a truncated Fock-space encoding. The compiler is available on GitHub at this https URL .", "url": "https://arxiv.org/abs/2610.28349", "type": "理论", "summary": "光子和基于量子位（数字）的量子计算方法在很大程度上被视为独立的范例。本文旨在通过开发一种将量子光学系统映射到基于量子位的量子电路的方法来弥合这些范式。实现这种映射的关键因素是引入描述单模光学状态的福克空间的截断。在此框架内，开发了基本光子运算的表示，包括相位旋转算子、位移算子、压缩算子和分束器。为维度 $N=2$ 和 $N=4$ 的福克空间截断提供了显式量子电路结构。我们讨论了已实施操作的基准测试，并确定了所提出方法的适用性和局限性。所提出的结果可用于在基于量子位的量子计算机上模拟量子光学电路，特别与低光子数状态下的高斯玻色子采样相关。\n\n为了证明这种方法的实际适用性，我们使用基于 Python 的量子编程工具 CO$\\Phi$ 来补充理论框架，该工具使用截断的 Fock 空间编码将 Blackbird 量子光学程序编译成基于量子位的 OpenQASM 电路。该编译器可在 GitHub 上通过 https URL 获取。", "authors": [{"name": "Grzegorz Czelusta"}, {"name": "Marcin Markiewicz"}, {"name": "Jakub Mielczarek"}, {"name": "Artur Miroszewski"}], "featured_authors": [{"name": "Grzegorz Czelusta"}, {"name": "Marcin Markiewicz"}, {"name": "Jakub Mielczarek"}, {"name": "Artur Miroszewski"}], "author_count": 4}, {"id": "2610.28358", "category": "quant-ph", "title": "Capturing Open Quantum System Dynamics with Compact Dressed Hamiltonians", "abstract": "We advance the compact dressed Hamiltonian (CDH) framework to simulate the dynamics of open quantum systems strongly coupled to structured bosonic environments. The CDH approach combines reaction-coordinate mapping with a polaron transformation, incorporating strong system-environment hybridization into a dressed representation before truncating the collective bosonic mode. As a result of this truncation, dynamical features are captured with substantially fewer states than in the original representation. The residual environment is treated using a weak-coupling Markovian quantum master equation. We benchmark the method for spin-boson-type models including a single spin, coupled spins, and spin ensembles, considering both resonant and off-resonant regimes and weak to strong system-bath coupling. Comparisons with hierarchical equations of motion and converged reaction-coordinate calculations demonstrate that the CDH representation systematically approaches the reference dynamics with a compact Hilbert space, accurately reproducing oscillation frequencies, relaxation behavior, and long-time populations over a broad parameter regime. The method further captures cooperative phenomena, including bath-mediated interactions, synchronization between spins, and signatures for collective emission. Beyond efficient time propagation, the CDH framework provides direct access to the spectrum and eigenmodes of the Liouvillian. We demonstrate that slow dynamical modes converge rapidly in the CDH representation, enabling identification of relaxation timescales without fitting time-dependent observables. As a whole, the CDH framework provides an efficient and physical description of strongly coupled open quantum-system dynamics.", "url": "https://arxiv.org/abs/2610.28358", "type": "理论+数值", "summary": "我们改进了紧凑的哈密顿（CDH）框架来模拟与结构化玻色环境强耦合的开放量子系统的动力学。 CDH 方法将反应坐标映射与极化子变换相结合，在截断集体玻色子模式之前将强大的系统环境杂化纳入修饰的表示中。由于这种截断，动态特征被捕获的状态比原始表示中的状态少得多。使用弱耦合马尔可夫量子主方程处理残余环境。我们对自旋玻色子型模型的方法进行了基准测试，包括单自旋、耦合自旋和自旋系综，同时考虑共振和非共振状态以及弱到强的系统浴耦合。与分层运动方程和收敛反应坐标计算的比较表明，CDH 表示通过紧凑的希尔伯特空间系统地接近参考动力学，在广泛的参数范围内准确地再现振荡频率、弛豫行为和长期总体。\n\n该方法进一步捕获合作现象，包括浴介导的相互作用、自旋之间的同步以及集体发射的特征。除了有效的时间传播之外，CDH 框架还提供对刘维尔频谱和本征模的直接访问。我们证明慢动态模式在 CDH 表示中快速收敛，从而无需拟合与时间相关的可观测值即可识别弛豫时间尺度。总体而言，CDH 框架提供了强耦合开放量子系统动力学的有效物理描述。", "authors": [{"name": "Zachary Giles"}, {"name": "Dvira Segal"}], "featured_authors": [{"name": "Zachary Giles"}, {"name": "Dvira Segal"}], "author_count": 2}, {"id": "2610.28368", "category": "quant-ph", "title": "Hidden parabolic subgroups of $\\mathrm{GL}_n$ over finite chain rings", "abstract": "We give a bounded-error quantum polynomial-time algorithm for finding hidden parabolic subgroups of $\\mathrm{GL}_n(R)$ over any effectively presented finite chain ring $R$. We call auxiliary group elements or subgroups used to extract information through oracle queries \\emph{probes}. For chain length at least two, elementary abelian socle probes first recover the complete flag modulo the maximal ideal. When the residue field has size $q\\ge3$, we reconstruct the flag recursively, lifting rank-one terminal members one digit at a time. The intermediate digits reduce to abelian hidden subgroup problems, while the final digit is a finite-field multiple-shift problem solved using learning from subset and Fourier sampling. For $q=2$, where distinct flags can have the same stabilizer, we instead lift the conjugate parabolic subgroup through the congruence filtration. A final linear system determines it modulo normalizer directions. The algorithm outputs generators with probability at least $1-\\epsilon$ in time $\\mathrm{poly}(n,\\log|R|,\\log(1/\\epsilon))$. Consequences include $\\mathrm{GL}_n(\\mathbb{Z}/N\\mathbb{Z})$ for every $N\\ge2$ and, with an explicit maximal-order presentation, $\\mathrm{GL}_n(\\mathcal{O_K}/N\\mathcal{O_K})$ for number fields $K$.", "url": "https://arxiv.org/abs/2610.28368", "type": "理论+数值", "summary": "我们给出了一种有界误差量子多项式时间算法，用于在任何有效呈现的有限链环 $R$ 上查找 $\\mathrm{GL}_n(R)$ 的隐藏抛物线子群。我们将用于通过预言机查询提取信息的辅助组元素或子组称为 \\emph{probes}。对于至少两个链长，基本交换基探针首先恢复完整的标志模最大理想值。当残差字段的大小为 $q\\ge3$ 时，我们递归地重建标志，一次将一级终端成员提升一位数字。中间数字简化为阿贝尔隐藏子群问题，而最终数字是使用子集学习和傅里叶采样解决的有限域多移问题。对于 $q=2$，不同的标志可以具有相同的稳定器，我们改为通过同余过滤提升共轭抛物线子群。最终的线性系统确定其模归一化器方向。该算法在 $\\mathrm{poly}(n,\\log|R|,\\log(1/\\epsilon))$ 时间内输出概率至少为 $1-\\epsilon$ 的生成器。\n\n结果包括每个 $N\\ge2$ 的 $\\mathrm{GL}_n(\\mathbb{Z}/N\\mathbb{Z})$，以及对于数字字段 $K$ 的显式最大阶表示 $\\mathrm{GL}_n(\\mathcal{O_K}/N\\mathcal{O_K})$。", "a
