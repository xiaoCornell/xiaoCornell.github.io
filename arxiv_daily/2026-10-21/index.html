  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;

      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2610.26869", "category": "cond-mat", "title": "LatticeMind: A Validation-Gated Agentic Framework for Density Functional Theory Workflows", "abstract": "First-principles calculations are rarely single solver calls: they are multistage workflows in which structures, settings, and saved densities must pass correctly between dependent stages. Language models can write a valid single input, but reliability collapses once stages are chained: a dropped dependency, wrong file handoff, or hallucinated keyword can invalidate results even when the solver runs, and such errors surface only after costly execution. We introduce LatticeMind, a validation-gated agentic framework that converts natural-language requests into executable, checkable density functional theory (DFT) projects. A workflow contract specifies required stages, files, and dependencies; deterministic validators inspect the project before any solver launch; failed checks trigger bounded repair; and reports remain traceable to project files. On a 44-case RESCU benchmark spanning total-energy, density-of-states, band-structure, magnetic, phonon workflows, three non-flagship LLM backends reproduced every reference value; 119 of 132 runs passed on the first validated plan and the rest after one repair cycle. Ablations identify the workflow contract and pre-execution validation as the principal reliability mechanisms; a conventional trial-and-repair baseline reaches 71% at twice the token cost per success. The same architecture reproduces every reference value on a 19-case VASP benchmark, demonstrating transfer across solvers. Beyond these task families, LatticeMind generated and validated the 23 inputs of a multistage study of Rh-induced electronic responses at a Rh$_6$/In$_x$Ga$_{1-x}$N photocatalyst interface. These results establish workflow contracts, deterministic validation, bounded repair, and traceable records as a practical foundation for reliable AI-assisted scientific computing, where preventable errors are caught before execution and the solver is never the first validator.", "url": "https://arxiv.org/abs/2610.26869", "type": "理论+数值", "summary": "第一原理计算很少是单个求解器调用：它们是多阶段工作流程，其中结构、设置和保存的密度必须在相关阶段之间正确传递。语言模型可以编写有效的单个输入，但一旦阶段链接起来，可靠性就会崩溃：即使在求解器运行时，丢失的依赖项、错误的文件切换或幻觉的关键字也可能使结果无效，并且此类错误只有在昂贵的执行后才会出现。我们引入了 LatticeMind，这是一个验证门控代理框架，可将自然语言请求转换为可执行、可检查的密度泛函理论 (DFT) 项目。工作流合同指定所需的阶段、文件和依赖项；确定性验证器在启动任何求解器之前检查项目；失败的检查触发有限修复；报告仍然可以追溯到项目文件。在涵盖总能量、态密度、能带结构、磁性、声子工作流程的 44 例 RESCU 基准测试中，三个非旗舰 LLM 后端再现了每个参考值； 132 次运行中的 119 次通过了第一个验证计划，其余的则在一个修复周期后通过。\n\nAblations 将工作流契约和执行前验证确定为主要的可靠性机制；传统的试验和修复基线达到 71%，每次成功的代币成本是两倍。相同的架构重现了 19 个案例 VASP 基准上的每个参考值，展示了跨求解器的传输。除了这些任务系列之外，LatticeMind 还生成并验证了 Rh$_6$/In$_x$Ga$_{1-x}$N 光催化剂界面处 Rh 诱导电子响应的多阶段研究的 23 个输入。这些结果建立了工作流契约、确定性验证、有界修复和可追溯记录，作为可靠的人工智能辅助科学计算的实践基础，在执行之前捕获可预防的错误，并且求解器永远不是第一个验证器。", "authors": [{"name": "Nathaniel M. Vegh"}, {"name": "Yu Zhu"}, {"name": "Raphaël J. Prentki"}, {"name": "Félix Beaudoin"}, {"name": "Shuaishuai Yuan"}, {"name": "Hong Guo"}], "featured_authors": [{"name": "Nathaniel M. Vegh"}, {"name": "Yu Zhu"}, {"name": "Raphaël J. Prentki"}, {"name": "Félix Beaudoin"}, {"name": "Shuaishuai Yuan"}, {"name": "Hong Guo"}], "author_count": 6}, {"id": "2610.26982", "category": "cond-mat", "title": "Zeeman Quantum Geometry of the Layer Pseudo-spin", "abstract": "Two-dimensional layers coupled by position-dependent interlayer tunnelling host a layer pseudo-spin whose polarization is a controllable internal degree of freedom. We introduce the quantum geometry of this layer pseudo-spin: a mixed tensor formed from the interband Berry connection and the layer matrix element, which governs the response to an oscillating in-plane electric field. Because the layer pseudo-spin is an Ising-type scalar invariant under threefold rotation, its selection rules differ from those of a pseudovector spin. In a minimal two-band model, the layer-pseudo-spin quantum metric and Zeeman--Berry curvature are nonzero, while their zone integrals vanish. An in-plane drive therefore leaves the spatially averaged polarization unchanged at linear order but imprints a moiré-periodic intracell pattern, directly imageable by layer-resolved tunnelling. For twisted MoTe$_2$ bilayer, we quantify the local dipole modulation and identify the rectified, helicity-odd, and third-harmonic channels through which a net response appears at higher order.", "url": "https://arxiv.org/abs/2610.26982", "type": "理论+数值", "summary": "通过位置相关的层间隧道耦合的二维层具有层赝自旋，其极化是可控的内部自由度。我们介绍了该层赝自旋的量子几何结构：由带间贝里连接和层矩阵元素形成的混合张量，它控制对振荡面内电场的响应。由于层赝自旋是三重旋转下的伊辛型标量不变量，其选择规则与赝矢量自旋不同。在最小二能带模型中，层赝自旋量子度量和塞曼-贝里曲率不为零，而它们的区域积分消失。因此，面内驱动使空间平均偏振保持线性顺序不变，但留下了莫尔周期性的细胞内图案，可通过层分辨隧道直接成像。对于扭曲的 MoTe$_2$ 双层，我们量化了局部偶极子调制并识别了整流通道、奇数螺旋通道和三次谐波通道，通过这些通道出现高阶净响应。", "authors": [{"name": "Bingxuan Jiang"}, {"name": "Shihao Zhang"}], "featured_authors": [{"name": "Bingxuan Jiang"}, {"name": "Shihao Zhang"}], "author_count": 2}, {"id": "2610.27014", "category": "cond-mat", "title": "Heat-current-induced nonreciprocal phonon damping", "abstract": "Time-reversal symmetry enforces equal equilibrium linewidths for time-reversed phonon modes at opposite wave vectors. Here we show that a steady heat current can produce nonreciprocal anharmonic damping even in centrosymmetric nonmagnetic crystals. The effect arises from nonequilibrium occupations of scattering partners, which change the statistical weights of time-reversed three-phonon channels while their squared matrix elements remain equal. Within the single-mode relaxation-time approximation, we derive a linewidth correction that is linear in the temperature gradient and odd under wave-vector reversal. The response depends on scattering-partner velocities and equilibrium lifetimes and retains signed channel weights absent from the equilibrium linewidth. First-principles calculations for centrosymmetric MgO and diamond yield nonzero, mode-dependent linewidth corrections at selected finite wave vectors, demonstrating the mechanism in both ionic and covalent crystals. Reversing the heat current at fixed local temperature exchanges the broadening and narrowing of paired modes. This current-reversible linewidth contrast provides a spectral signature of occupation feedback, with potential implications for nonlinear phonon transport.", "url": "https://arxiv.org/abs/2610.27014", "type": "理论+数值", "summary": "时间反演对称性强制相反波矢的时间反演声子模式具有相等的平衡线宽。在这里，我们证明即使在中心对称非磁性晶体中，稳定的热流也可以产生非互易非谐波阻尼。这种效应是由散射伙伴的非平衡占据引起的，它改变了时间反转三声子通道的统计权重，而它们的平方矩阵元素保持相等。在单模弛豫时间近似中，我们得出了线宽校正，该校正在温度梯度中呈线性，在波矢量反转下呈奇数。响应取决于散射伙伴速度和平衡寿命，并保留平衡线宽中不存在的有符号通道权重。中心对称 MgO 和金刚石的第一性原理计算在选定的有限波矢量下产生非零、模式相关的线宽校正，证明了离子和共价晶体中的机制。在固定的局部温度下反转热流会交换配对模式的加宽和变窄。\n\n这种电流可逆线宽对比提供了占用反馈的光谱特征，对非线性声子传输具有潜在影响。", "authors": [{"name": "Tingwei Deng"}, {"name": "Xianyong Ding"}, {"name": "Rui Wang"}, {"name": "Xiangang Wan"}], "featured_authors": [{"name": "Tingwei Deng"}, {"name": "Xianyong Ding"}, {"name": "Rui Wang"}, {"name": "Xiangang Wan"}], "author_count": 4}, {"id": "2610.27050", "category": "cond-mat", "title": "Field Theory of the Gutzwiller Projection", "abstract": "The Gutzwiller projection produces a well-known ansatz for spin-liquid and quantum Hall ground-state wavefunctions that is amenable to numerical simulation, with the Laughlin wavefunction being the most celebrated example. A long-standing issue is the precise relation between the Gutzwiller projection and the closely related parton gauge theory. Here, we clarify this issue by providing a field-theoretic description of the Gutzwiller projection. In a path integral description, the universal physics of the projected state is described in terms of a gauge field supported on a temporal slab of vanishing width $\\epsilon \\rightarrow 0$ coupled to the bulk matter fields. We analytically derive the universal physics of various Gutzwiller projected states. Our construction is also applicable to discrete symmetries, and we use it to analyze various projected SPT states. Among our results, we show that the Gutzwiller projection is not a good ansatz for the long-distance properties of $U(1)$ Dirac spin liquids, spinon Fermi surface spin liquids or composite Fermi liquids, and that the Gutzwiller projection of a quantum spin Hall state has only quasi-long range order. In contrast, in examples where the gauge field is gapped, including Laughlin states, $\\mathbb{Z}_2$ spin liquids and Luttinger liquids, we show that the slab gauge theory from Gutzwiller projection reproduces the correct universal physics of the full parton gauge theory. We also present a generalization of our field theory that describes $G$-intertwining defects, with application to self-duality defects of recent theoretical interest.", "url": "https://arxiv.org/abs/2610.27050", "type": "理论+数值", "summary": "古茨维勒投影产生了一个著名的自旋液体和量子霍尔基态波函数的拟像，它适合数值模拟，其中劳克林波函数是最著名的例子。一个长期存在的问题是古茨维勒投影与密切相关的帕顿规范理论之间的精确关系。在这里，我们通过提供古茨维勒投影的场论描述来澄清这个问题。在路径积分描述中，投影状态的通用物理是根据与散装物质场耦合的消失宽度 $\\epsilon \\rightarrow 0$ 的时间平板上支撑的规范场来描述的。我们分析推导了各种古茨威勒投影态的普遍物理学。我们的构造也适用于离散对称性，我们用它来分析各种投影的 SPT 状态。在我们的结果中，我们表明，对于 $U(1)$ 狄拉克自旋液体、自旋费米表面自旋液体或复合费米液体的长距离特性，Gutzwiller 投影并不是一个很好的模拟，并且量子自旋霍尔态的 Gutzwiller 投影仅具有准长程有序。\n\n相比之下，在规范场有间隙的例子中，包括劳克林态、$\\mathbb{Z}_2$自旋液体和路廷格液体，我们证明来自古茨威勒投影的板条规范理论再现了完整帕顿规范理论的正确通用物理。我们还提出了描述 $G$ 交织缺陷的场论的概括，并将其应用于最近理论兴趣的自对偶缺陷。", "authors": [{"name": "Abhijat Sarma"}, {"name": "Cenke Xu"}, {"name": "Chong Wang"}], "featured_authors": [{"name": "Abhijat Sarma"}, {"name": "Cenke Xu"}, {"name": "Chong Wang"}], "author_count": 3}, {"id": "2610.27124", "category": "cond-mat", "title": "An efficient approach to electron-phonon coupling calculations of heterostructures within an all-electron framework", "abstract": "A major challenge in calculating electron-phonon coupling at interfaces from first principles is the prohibitive computational cost due to the large supercells involved. Here, we present an efficient approach, which builds the electron-phonon matrix of weakly bound heterostructures from the properties of the isolated layers. The two key ingredients, the dynamical matrices and the potential response, are constructed in two steps. In the expansion step, these quantities are folded from the unit cells onto the supercell through an exact Fourier mapping. In the addition step, the interatomic force constants and the potential responses of the heterostructure are assembled blockwise from the corresponding quantities of the isolated layers, neglecting the weak interlayer contribution. The method is implemented in the electron-phonon module of the all-electron full-potential code exciting, enabling efficient calculations of the electron-phonon self-energy. We demonstrate the approach for the phonon dispersion and spectral functions of bilayer WSe$_2$ and pyridine/MoS$_2$, in comparison with exact reference calculations.", "url": "https://arxiv.org/abs/2610.27124", "type": "理论+数值", "summary": "根据第一原理计算界面处的电子声子耦合的一个主要挑战是由于涉及大型超级电池而导致计算成本过高。在这里，我们提出了一种有效的方法，它根据隔离层的特性构建弱束缚异质结构的电子声子矩阵。动态矩阵和电位响应这两个关键要素是分两步构建的。在展开步骤中，这些量通过精确的傅里叶映射从晶胞折叠到超晶胞上。在添加步骤中，异质结构的原子间力常数和潜在响应是根据隔离层的相应量按块组装的，忽略了弱层间的贡献。该方法在全电子全势码激励的电子声子模块中实现，实现了电子声子自能的高效计算。我们展示了双层 WSe$_2$ 和吡啶/MoS$_2$ 的声子色散和光谱函数的方法，并与精确的参考计算进行了比较。", "authors": [{"name": "Ignacio Gonzalez Oliva"}, {"name": "Sebastian Tillack"}, {"name": "Fabio Caruso"}, {"name": "Pasquale Pavone"}, {"name": "Claudia Draxl"}], "featured_authors": [{"name": "Ignacio Gonzalez Oliva"}, {"name": "Sebastian Tillack"}, {"name": "Fabio Caruso"}, {"name": "Pasquale Pavone"}, {"name": "Claudia Draxl"}], "author_count": 5}, {"id": "2610.27154", "category": "cond-mat", "title": "Exact spectral integrability of a finite-channel random Schrödinger operator: from fermionization of the Dyson--Riccati gas to Kontsevich integral", "abstract": "We solve exactly, for arbitrary finite channel number $N$, the Riccati dynamics of a quasi-one-dimensional random matrix Schrödinger operator with Hermitian white-noise potential in the $\\beta=2$ unitary symmetry class. The associated Dyson--Riccati eigenvalue gas admits an exact free-fermion representation at any sample length $L$, which in the limit $L\\to \\infty$ expresses the density of states and the total Lyapunov growth rate exactly through a single Airy Hankel $\\tau$-function providing multichannel generalization of $N=1$ Halperin--Thouless formulas. The $\\tau-$function further admits an outgoing-contour Kontsevich matrix Airy integral representation. Its saddle-point and double-scaling analyses give, in a unified way, the finite-channel density Lifshitz tail, and the large-$N$ spectral edge. In particular, for $N\\gg 1$ the sharp $N=\\infty$ edge is softened within an $N^{-4/5}$ spectral window, with its profile governed by the tritronquée solution of Painlevé I. We conjecture universality of this quasi-one-dimensional scaling edge profile for a broad class of $\\beta=2$ random band matrices.", "url": "https://arxiv.org/abs/2610.27154", "type": "理论", "summary": "对于任意有限通道数 $N$，我们精确求解酉对称类中具有 Hermitian 白噪声势的准一维随机矩阵薛定谔算子的 Riccati 动力学。相关的 Dyson-Riccati 特征值气体在任何样本长度 $L$ 上都允许精确的自由费米子表示，在 $L\\to \\infty$ 的限制下，通过单个 Airy Hankel $\\tau$ 函数精确地表达态密度和总李雅普诺夫增长率，提供 $N=1$ Halperin-Thouless 公式的多通道泛化。 $\\tau-$函数进一步允许输出轮廓 Kontsevich 矩阵 Airy 积分表示。它的鞍点和双尺度分析以统一的方式给出了有限通道密度 Lifshitz 尾部和大 $N$ 频谱边缘。特别是，对于 $N\\gg 1$，尖锐的 $N=\\infty$ 边缘在 $N^{-4/5}$ 光谱窗口内被软化，其轮廓由 Painlevé I 的 tritronquée 解控制。我们推测这种准一维缩放边缘轮廓对于广泛的 $\\beta=2$ 随机带矩阵具有普遍性。", "authors": [{"name": "Yan V. Fyodorov"}, {"name": "Pierre Le Doussal"}], "featured_authors": [{"name": "Yan V. Fyodorov"}, {"name": "Pierre Le Doussal"}], "author_count": 2}, {"id": "2610.27189", "category": "cond-mat", "title": "Diffusive Description of Superconducting Single-Photon Detectors Using Quantum Mechanics", "abstract": "The methodology of non-Hermitian quantum mechanics is employed to parameterize the dynamics of coupled classical diffusion equations describing low- and high-energy quasiparticles in superconducting single-photon detectors in one to three spatial dimensions.", "url": "https://arxiv.org/abs/2610.27189", "type": "理论", "summary": "非厄米量子力学方法用于参数化耦合经典扩散方程的动力学，该方程描述一到三个空间维度的超导单光子探测器中的低能和高能准粒子。", "authors": [{"name": "Krzysztof Pomorski"}, {"name": "Eryk Halubek"}], "featured_authors": [{"name": "Krzysztof Pomorski"}, {"name": "Eryk Halubek"}], "author_count": 2}, {"id": "2610.27207", "category": "cond-mat", "title": "Density Accelerated Relaxation in Active Passive Colloidal Networks with Competing Interactions", "abstract": "We investigate quasi-2D active-passive colloidal mixtures with electric field-mediated non-identical interactions: unlike species attract and like species repel. Mapping the steady states across total area fraction and active particle area fraction identifies the regime of active percolated network formation among active fluid and clustered states. Within the percolated network regime, relaxation speeds up with increasing density, contrary to expectations for dense particulate gels. Particle-resolved dynamics and microstructure link this acceleration to activity-driven rearrangements enabled by asymmetric interactions.", "url": "https://arxiv.org/abs/2610.27207", "type": "数值", "summary": "我们研究具有电场介导的非相同相互作用的准二维主动-被动胶体混合物：不同物种相互吸引，相似物种相互排斥。绘制总面积分数和活性颗粒面积分数上的稳态图可识别活性流体和簇状状态之间的活性渗透网络形成的状态。在渗透网络体系内，松弛随着密度的增加而加速，这与对致密颗粒凝胶的预期相反。粒子解析动力学和微观结构将这种加速与不对称相互作用实现的活动驱动的重排联系起来。", "authors": [{"name": "Pronay Dutta"}, {"name": "Hima Nagamanasa Kandula"}], "featured_authors": [{"name": "Pronay Dutta"}, {"name": "Hima Nagamanasa Kandula"}], "author_count": 2}, {"id": "2610.27263", "category": "cond-mat", "title": "Soft elasticity of soft shells", "abstract": "Soft modes of a shell are one-parameter families of non-trivial deformations that preserve the elastic energy. We identify all soft modes of the soft shells described by the variational theory of put forward by Sonnet and Virga (2025). They are seen to be strictly connected with the Bonnet families, a special class of solutions to the problem posited by Bonnet, who asked whether there exist non-trivial isometries that preserve the mean curvature. Differential geometry deems as equivalent all surfaces in one and the same Bonnet family, but continuum mechanics is interested more specifically in soft deformation modes and the shapes they traverse, as they may describe ways to ignite fluctuations of soft shells that ideally require no energy to be activated. We give a general criterion for the existence of soft modes and a method to construct them based on a cascade of path integrations. We apply both criterion and method to some exemplary cases.", "url": "https://arxiv.org/abs/2610.27263", "type": "理论+数值", "summary": "壳的软模态是保留弹性能的非平凡变形的单参数族。我们识别了 Sonnet 和 Virga (2025) 提出的变分理论描述的软壳的所有软模态。它们被认为与 Bonnet 族密切相关，Bonnet 族是 Bonnet 提出的问题的一类特殊解决方案，Bonnet 询问是否存在保持平均曲率的非平凡等距。微分几何认为同一个 Bonnet 系列中的所有表面都是等效的，但连续介质力学更具体地对软变形模式及其穿过的形状感兴趣，因为它们可以描述点燃软壳波动的方法，理想情况下不需要能量即可激活。我们给出了软模式存在的一般标准以及基于级联路径集成构建软模式的方法。我们将标准和方法应用于一些典型案例。", "authors": [{"name": "Andre M. Sonnet"}, {"name": "Epifanio G. Virga"}], "featured_authors": [{"name": "Andre M. Sonnet"}, {"name": "Epifanio G. Virga"}], "author_count": 2}, {"id": "2610.27411", "category": "cond-mat", "title": "Fully Automated Wannier Disentanglement via Projectability Selection in Gaussian and Augmented Plane-Wave Frameworks", "abstract": "Constructing the frozen manifold for entangled bands requires balancing exact reproduction of the target bands with sufficient variational freedom to build a well-localized subspace from the broader Bloch pool. We present a workflow that systematically determines the energy ceiling for a target number of selected Wannier projections, freezing every Bloch state below this threshold across the sampled k-mesh. By measuring projectability, the spectral weight of each Bloch state projected onto the target localized basis, the workflow detects missing conduction channels and quantifies discrepancies between orbital character and energy-based freezing. In comparisons where we controlled the extent of the energy ceiling, freezing all sub-ceiling states is generally favored over projectability-based frozen states. Of the seven materials we tested, freezing all sub-ceiling states lowers the band error on four from between 11 meV and 1.2 eV to 18 meV or less, and matches the projectability-based choice to within about 2 meV on the remaining three. In each of the four, projectability-based frozen states give the lower spread, showing that spread alone cannot identify the better model. With the frozen states held fixed, the workflow minimizes the gauge-invariant spread, constructs the gauge from density-matrix columns on atomic orbitals, and passes an isolated set of bands to Wannier90 for localization. The workflow is implemented in two programs for seamless high-throughput Wannierization with WIEN2k (wien2wannier) and CRYSTAL (LCAO2Wannier). Using a single set of calibrated defaults, the CRYSTAL implementation with analytic overlaps produces models that reproduce the reference bands of five cells, from bulk h-BN in a joint valence-and-conduction model to a magnetic framework with 1424 orbitals. The WIEN2k implementation produces eight such models from seven calculations.", "url": "https://arxiv.org/abs/2610.27411", "type": "理论+数值", "summary": "构建纠缠带的冻结流形需要平衡目标带的精确再现与足够的变分自由度，以便从更广泛的布洛赫池构建良好定位的子空间。我们提出了一个工作流程，系统地确定选定 Wannier 投影目标数量的能量上限，将采样的 k 网格中的每个 Bloch 状态冻结在该阈值以下。通过测量可投影性，即每个布洛赫态的光谱权重投影到目标局部基础上，工作流程可以检测缺失的传导通道，并量化轨道特征和基于能量的冻结之间的差异。与我们控制能量上限范围的情况相比，冻结所有低于上限的状态通常优于基于可投影性的冻结状态。在我们测试的七种材料中，冻结所有亚天花板状态可将四种材料的带误差从 11 meV 到 1.2 eV 之间降低到 18 meV 或更小，并将其余三种材料的基于可投影性的选择匹配到约 2 meV 以内。在这四个中，基于可投影性的冻结状态给出了较低的分布，表明仅靠分布无法识别更好的模型。\n\n在冻结状态保持固定的情况下，工作流程可最大限度地减少规范不变扩展，根据原子轨道上的密度矩阵列构建规范，并将一组隔离的能带传递给 Wannier90 进行定位。该工作流程通过 WIEN2k (wien2wannier) 和 CRYSTAL (LCAO2Wannier) 两个程序实现无缝高通量 Wannierization。使用一组校准默认值，带有分析重叠的 CRYSTAL 实现生成的模型可以重现五个单元的参考带，从联合价和传导模型中的块状 h-BN 到具有 1424 个轨道的磁性框架。 WIEN2k 实现通过七次计算生成八个这样的模型。", "authors": [{"name": "William P. Comaskey"}, {"name": "Jose L. Mendoza-Cortes"}], "featured_authors": [{"name": "William P. Comaskey"}, {"name": "Jose L. Mendoza-Cortes"}], "author_count": 2}, {"id": "2610.27412", "category": "cond-mat", "title": "Learning the Geometry of Materials Space with Trained Neural Tangent Kernels", "abstract": "Neural networks trained to predict materials properties learn representations whose physical content can be difficult to extract. We use the neural tangent kernel (NTK), evaluated at trained parameters, to recover the geometry learned by a network that predicts superconducting transition temperatures from elemental composition alone. Kernel ridge regression with the trained NTK closely reproduces the network's predictive performance and substantially outperforms regression with the initial kernel. Spectral analysis and multidimensional scaling reveal a geometry dominated by a small number of directions. Clustering and local neighborhood analysis organize compounds into recognizable superconducting families and connect materials with related chemical and correlated-electron properties despite substantial differences in $T_c$. These results establish trained tangent kernels as practical probes of learned materials representations, connecting property prediction with the exploration of materials space.", "url": "https://arxiv.org/abs/2610.27412", "type": "理论+数值", "summary": "经过训练来预测材料属性的神经网络学习其物理内容可能难以提取的表示。我们使用神经正切核（NTK），在训练参数下进行评估，来恢复网络学习到的几何形状，该网络仅根据元素组成来预测超导转变温度。使用经过训练的 NTK 进行的核岭回归可以很好地再现网络的预测性能，并且大大优于使用初始核进行的回归。谱分析和多维尺度揭示了由少数方向主导的几何形状。聚类和局部邻域分析将化合物组织成可识别的超导族，并将材料与相关化学和相关电子特性联系起来，尽管 $T_c$ 存在巨大差异。这些结果建立了经过训练的切线内核作为学习材料表示的实用探针，将属性预测与材料空间的探索联系起来。", "authors": [{"name": "Daniel Kaplan"}, {"name": "Gabriel Kotliar"}, {"name": "Anirvan M Sengupta"}], "featured_authors": [{"name": "Daniel Kaplan"}, {"name": "Gabriel Kotliar"}, {"name": "Anirvan M Sengupta"}], "author_count": 3}, {"id": "2610.27430", "category": "cond-mat", "title": "Chiral magnetic excitations in the RMn6Sn6 kagome metals (R=Tb, Ho, Er, and Y)", "abstract": "Recent inelastic neutron scattering (INS) investigations of the kagome metal TbMn6Sn6 reveal novel chiral magnetic excitations associated with the kagome layer. These excitations appear to have an itinerant character with a large energy scale (> 100 meV) and heavy damping; however, the origin of these excitations, which are not predicted by local moment linear spin-wave theory, is not understood. Here, we use INS to show that chiral excitations are also found in RMn6Sn6 compounds with R=Tb, Ho, Er, and Y having uniaxial, tilted, planar ferrimagnet, and planar double-spiral magnetic structures, respectively. Thus, the chiral excitations exist regardless of the magnetic structure. Additionally, R=Er and Y demonstrate that the chiral mode intensity is weaker in planar magnetic structures, suggesting that excitations are transverse to the local Mn moment direction. The chiral excitations appear only at L=odd positions in the Brilloun zone, and correspond to chiral spin exciations of the same handedness within each kagome layer, and pi out-of-phase between layers.", "url": "https://arxiv.org/abs/2610.27430", "type": "理论", "summary": "最近对 kagome 金属 TbMn6Sn6 的非弹性中子散射 (INS) 研究揭示了与 kagome 层相关的新型手性磁激发。这些激励似乎具有大能量尺度（> 100 meV）和强阻尼的巡回特征；然而，这些激发的起源尚不清楚，而局部矩线性自旋波理论并未预测到这些激发的起源。在这里，我们使用 INS 表明，在 R=Tb、Ho、Er 和 Y 的 RMn6Sn6 化合物中也发现了手性激发，这些化合物分别具有单轴、倾斜、平面亚铁磁体和平面双螺旋磁结构。因此，无论磁结构如何，手性激发都存在。此外，R=Er 和 Y 表明平面磁结构中的手性模式强度较弱，表明激励横向于局部 Mn 矩方向。手性激发仅出现在布里永区中的 L=奇数位置，并且对应于每个 kagome 层内相同旋向的手性自旋激发，以及层之间的 pi 异相。", "authors": [{"name": "Christopher J. Ranlett"}, {"name": "Tianxiong Han"}, {"name": "S. X. M. Riberolles"}, {"name": "Dhurba R. Jaishi"}, {"name": "Tyler J. Slade"}, {"name": "Bing Li"}, {"name": "A. Sapkota"}, {"name": "D. L. Abernathy"}, {"name": "Rebecca L. Dally"}, {"name": "J. W. Lynn"}, {"name": "B. G. Ueland"}, {"name": "R. J. McQueeney"}], "featured_authors": [{"name": "Christopher J. Ranlett"}, {"name": "Tianxiong Han"}, {"name": "S. X. M. Riberolles"}, {"name": "J. W. Lynn"}, {"name": "B. G. Ueland"}, {"name": "R. J. McQueeney"}], "author_count": 12}, {"id": "2610.27436", "category": "cond-mat", "title": "Steering of topological criticality in the Su-Schrieffer-Heeger chain via non-Hermitian substitutional impurities", "abstract": "We investigate the topological phase in a one-dimensional Su-Schrieffer-Heeger (SSH) chain in the presence of a finite concentration of non-Hermitian substitutional impurities. Our primary focus is the discovery of a deterministic mechanism to actively reconfigure the topological phase boundaries by introducing site-dependent, non-reciprocal intracell and intercell hopping amplitudes. Specifically, breaking the internal structural symmetry of the non-reciprocal impurity hoppings induces a targeted macroscopic displacement of the critical point. This mechanism allows for the controlled expansion or compression of the topological phase strictly via local defect asymmetry. We validate this boundary displacement through finite-size scaling analysis. The extracted correlation length critical exponents ($\\nu \\approx 1.455$ and $\\nu \\approx 1.397$ for symmetric and asymmetric configurations, respectively) confirm a disorder-induced departure from the pristine SSH universality class, with the exponent diverging at high defect densities. We also report an impurity-induced real-to-complex spectral transition geometrically characterized by the Non-Hermitian Skin Effect. Ultimately, our results establish how isolated non-Hermitian asymmetries cooperatively interact to deterministically shift macroscopic topological protection.", "url": "https://arxiv.org/abs/2610.27436", "type": "理论+数值", "summary": "我们研究了存在有限浓度的非厄米取代杂质的情况下一维 Su-Schrieffer-Heeger (SSH) 链的拓扑相。我们的主要重点是发现一种确定性机制，通过引入位置相关的、非互易的单元内和单元间跳变幅度来主动重新配置拓扑相边界。具体来说，打破不可逆杂质跳跃的内部结构对称性会引起临界点的目标宏观位移。这种机制允许严格通过局部缺陷不对称来控制拓扑相的膨胀或压缩。我们通过有限尺寸缩放分析来验证该边界位移。提取的相关长度临界指数（对称和非对称配置分别为 $\\nu \\approx 1.455$ 和 $\\nu \\approx 1.397$）证实了无序引起的与原始 SSH 通用性类别的偏离，指数在高缺陷密度下发散。我们还报告了杂质引起的实数到复数光谱转变，其几何特征是非厄米集肤效应。\n\n最终，我们的结果确定了孤立的非厄米不对称性如何相互作用，从而确定性地改变宏观拓扑保护。", "authors": [{"name": "Juan A. Cañas"}, {"name": "Guo-Qing Zhang"}, {"name": "A. Martín-Ruiz"}], "featured_authors": [{"name": "Juan A. Cañas"}, {"name": "Guo-Qing Zhang"}, {"name": "A. Martín-Ruiz"}], "author_count": 3}, {"id": "2610.27469", "category": "cond-mat", "title": "Magnetic-Field-Induced Darkening of Bright Excitons in a MoWSe$_2$ Monolayer Alloy", "abstract": "Magnetic fields are widely used to brighten spin-forbidden dark excitons, but the inverse effect on an optically bright exciton has remained largely unexplored. We demonstrate the complementary phenomenon of magnetic-field-induced darkening of a bright exciton in Mo$_{0.68}$W$_{0.32}$Se$_2$. At 4.2 K, an in-plane magnetic field up to 25 T activates a dark-exciton line 14.2$\\pm$1.3 meV below the bright exciton while suppressing the bright-exciton emission by about 85\\%. A bright-dark mixing model quantitatively captures the coupled energy and intensity evolution with an effective in-plane $g$ factor of $|g_{\\parallel}|=5.2\\pm0.2$. Alloying is crucial to the effect, as it brings the system close to the bright-dark crossover, where a small bright-dark splitting is combined with unusually strong in-plane magnetic coupling. This places the system in a regime where field-induced level repulsion raises the bright-like branch and strongly depletes its thermal population. These results identify a general route to magnetic control of exciton populations through engineering of the bright-dark hierarchy.", "url": "https://arxiv.org/abs/2610.27469", "type": "理论", "summary": "磁场被广泛用于使自旋禁止的暗激子变亮，但对光学亮激子的相反影响仍未被探索。我们证明了 Mo$_{0.68}$W$_{0.32}$Se$_2$ 中亮激子磁场引起的暗化的互补现象。在 4.2 K 时，高达 25 T 的面内磁场会激活亮激子下方 14.2$\\pm$1.3 meV 的暗激子线，同时将亮激子发射抑制约 85\\%。明暗混合模型定量捕获耦合能量和强度演化，有效面内 $g$ 因子为 $|g_{\\parallel}|=5.2\\pm0.2$。合金化对于这种效果至关重要，因为它使系统接近明暗交叉，其中小的明暗分裂与异常强的面内磁耦合相结合。这使得系统处于一种状态，其中场引起的能级排斥使明亮的分支升高并强烈耗尽其热粒子数。这些结果确定了通过明暗等级工程对激子群进行磁控制的一般途径。", "authors": [{"name": "Katarzyna Olkowska-Pucko"}, {"name": "Artur O. Slobodeniuk"}, {"name": "Mehdi Arfaoui"}, {"name": "Elena Blundo"}, {"name": "Natalia Zawadzka"}, {"name": "Łucja Kipczak"}, {"name": "Jan Szpakowski"}, {"name": "Diana Vaclavkova"}, {"name": "Dipankar Jana"}, {"name": "Piotr Kapuściński"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Clement Faugeras"}, {"name": "Marek Potemski"}, {"name": "Adam Babiński"}, {"name": "Antonio Polimeni"}, {"name": "Maciej R. Molas"}], "featured_authors": [{"name": "Katarzyna Olkowska-Pucko"}, {"name": "Artur O. Slobodeniuk"}, {"name": "Mehdi Arfaoui"}, {"name": "Adam Babiński"}, {"name": "Antonio Polimeni"}, {"name": "Maciej R. Molas"}], "author_count": 17}, {"id": "2610.27499", "category": "cond-mat", "title": "Rashba-controlled emergence and reversal of critical-field anisotropy in p-wave magnet--superconductor hybrids", "abstract": "We show that tuning Rashba spin-orbit coupling can change the in-plane field direction along which an $s$-wave superconductor is most susceptible to Zeeman depairing. We consider a two-dimensional $s$-wave superconductor subject to an odd-parity exchange field induced by a $p$-wave magnet. Without Rashba coupling, the out-of-plane exchange field enhances the in-plane critical field but leaves its angular response exactly isotropic, despite the anisotropic magnetic spin texture. Minimizing the Bogoliubov--de Gennes grand potential over uniform singlet pairing, we find that increasing Rashba coupling first generates and then reverses the principal-axis critical-field contrast, switching the minimum-critical-field direction by $90^{\\circ}$. Equal principal-axis fields at the intervening compensation point coexist with residual angular modulation. We interpret the reversal through competing momentum-dependent depairing contributions from the magnetic and Rashba spin textures, while the on-site singlet pairing channel remains unchanged. Direction-dependent discontinuous collapses of the order parameter further shape the critical-field curves. These results identify a tunable directional paramagnetic response within the uniform-pairing sector. In heterostructures with sufficient electrostatic tunability of interfacial Rashba coupling, this reversal would enable gate control of the easy-depairing axis without reorienting the magnetic texture.", "url": "https://arxiv.org/abs/2610.27499", "type": "理论", "summary": "我们证明，调整 Rashba 自旋轨道耦合可以改变面内场方向，$s$ 波超导体最容易受到塞曼脱配对的影响。我们考虑二维 $s$ 波超导体，它受到 $p$ 波磁体感应的奇宇称交换场的影响。如果没有 Rashba 耦合，面外交换场会增强面内临界场，但尽管存在各向异性磁自旋纹理，但其角度响应完全是各向同性的。最小化均匀单重态配对上的 Bogoliubov-de Gennes 大势，我们发现增加 Rashba 耦合首先生成然后反转主轴临界场对比度，将最小临界场方向切换 $90^{\\circ}$。中间补偿点处的相等主轴场与残余角度调制共存。我们通过来自磁性和 Rashba 自旋纹理的竞争性动量依赖性脱配对贡献来解释这种逆转，而现场单线态配对通道保持不变。阶次参数与方向相关的不连续塌陷进一步塑造了临界场曲线。\n\n这些结果确定了均匀配对区域内的可调谐定向顺磁响应。在具有足够的界面 Rashba 耦合静电可调性的异质结构中，这种反转将能够实现对易脱配轴的栅极控制，而无需重新定向磁性纹理。", "authors": [{"name": "Rui-Xiang Cheng"}, {"name": "Zhao Gong"}, {"name": "Dong-Hui Xu"}, {"name": "Chui-Zhen Chen"}], "featured_authors": [{"name": "Rui-Xiang Cheng"}, {"name": "Zhao Gong"}, {"name": "Dong-Hui Xu"}, {"name": "Chui-Zhen Chen"}], "author_count": 4}, {"id": "2610.27539", "category": "cond-mat", "title": "Magnetic-Field Effects on the Electronic States of the K$_4$ Lattice", "abstract": "We investigate the electronic states of the K$_4$ lattice in a uniform magnetic field within a nearest-neighbor tight-binding model. The K$_4$ lattice is a \\rev{noncentrosymmetric three-dimensional network with triple-Dirac cones at the $\\Gamma$ and H points}. By fixing the Bloch momentum component parallel to the field, the Peierls-substituted tight-binding problem reduces to an effective two-dimensional problem and yields a Hofstadter spectrum \\rev{whose self-similar subpatterns reflect the geometry of the lattice projected onto the plane perpendicular to the field}. A square-like substructure emerges on the flux scale $\\phi = 1/8$ for $\\bm{B}\\parallel[100]$, and honeycomb- and triangular-like substructures emerge on the finer scale $\\phi = 1/32$ for $\\bm{B}\\parallel[111]$\\rev{. Here $\\phi$ is the flux through the elementary plaquette of the projected lattice, and these scales correspond to one flux quantum per projected unit cell. Owing to the screw axes of the chiral K$_4$ network, the field-parallel momentum acts as an additional flux, which, for commensurate values of this momentum, shifts the spectrum along the flux axis and brings the second triple-Dirac cone at the H point into the magnetic spectrum}. In the weak-field limit, we derive the Landau-level structure from a low-energy effective Hamiltonian around the $\\Gamma$ point. The three-component nature of the triple-Dirac cone gives rise to a cubic secular equation, whose solutions describe how a pseudospin-flat branch coexists with two relativistic Landau ladders \\rev{and a single chiral $n=0$ level dispersing linearly along the field, in agreement with the lattice calculation}.", "url": "https://arxiv.org/abs/2610.27539", "type": "理论+数值", "summary": "我们研究了最近邻紧束缚模型中均匀磁场中 K$_4$ 晶格的电子态。 K$_4$ 晶格是一个 \\rev{非中心对称三维网络，在 $\\Gamma$ 和 H 点处具有三重狄拉克锥体}。通过将布洛赫动量分量固定为平行于场，佩尔斯取代的紧束缚问题简化为有效的二维问题，并产生霍夫施塔特谱\\rev{其自相似子模式反映了投影到垂直于场的平面上的晶格的几何形状}。对于 $\\bm{B}\\parallel[100]$，在通量尺度 $\\phi = 1/8$ 上出现方形子结构，对于 $\\bm{B}\\parallel[111]$\\rev{，在更精细的尺度 $\\phi = 1/32$ 上出现蜂窝状和三角形子结构。这里 $\\phi$ 是通过投影晶格的基本斑块的通量，这些尺度对应于每个投影晶胞的一个通量量子。\n\n由于手性 K$_4$ 网络的螺旋轴，场平行动量充当附加磁通，对于该动量的相应值，该磁通沿磁通轴移动频谱，并将 H 点处的第二个三狄拉克锥带入磁频谱}。在弱场极限下，我们从 $\\Gamma$ 点周围的低能有效哈密顿量导出朗道能级结构。三狄拉克锥体的三分量性质产生了一个三次世俗方程，其解描述了赝自旋平坦分支如何与两个相对论朗道梯子\\rev{和沿场线性分散的单个手性$n=0$能级共存，与晶格计算一致}。", "authors": [{"name": "Katsuhiro Takahashi"}, {"name": "Shouya Yoshida"}, {"name": "Katsunori Wakabayashi"}], "featured_authors": [{"name": "Katsuhiro Takahashi"}, {"name": "Shouya Yoshida"}, {"name": "Katsunori Wakabayashi"}], "author_count": 3}, {"id": "2610.27582", "category": "cond-mat", "title": "Finite-temperature spectral functions of lattice polarons with process tensors", "abstract": "We develop a process tensor approach for calculating the finite-temperature spectral functions of lattice polarons. We show that the finite-temperature phonon influence functional can be expressed as the elementwise exponential of a low-rank matrix product state, enabling an efficient summation of electron worldlines. An embedding construction embeds worldlines of different propagation times into a single matrix product state. This construction yields the propagator over the full simulated time interval in a single calculation. We benchmark this approach against available finite-temperature density-matrix renormalization group results for the one-dimensional Holstein polaron. We further obtain numerically converged spectra for the two-dimensional Holstein polaron. The spectra reveal a progressive transfer of spectral weight from coherent spectral features into an incoherent background with increasing temperature.", "url": "https://arxiv.org/abs/2610.27582", "type": "理论+数值", "summary": "我们开发了一种过程张量方法来计算晶格极化子的有限温度谱函数。我们证明，有限温度声子影响函数可以表示为低秩矩阵乘积状态的元素指数，从而实现电子世界线的有效求和。嵌入结构将不同传播时间的世界线嵌入到单个矩阵乘积状态中。这种结构在一次计算中产生了整个模拟时间间隔内的传播器。我们将这种方法与一维荷斯坦极化子的可用有限温度密度矩阵重整化群结果进行基准测试。我们进一步获得了二维荷斯坦极化子的数值收敛光谱。光谱揭示了随着温度的升高，光谱权重从相干光谱特征逐渐转移到非相干背景。", "authors": [{"name": "Qi Gao"}, {"name": "Yuan Wan"}], "featured_authors": [{"name": "Qi Gao"}, {"name": "Yuan Wan"}], "author_count": 2}, {"id": "2610.27624", "category": "cond-mat", "title": "Orbital Magnetization within Self-Consistent Hartree-Fock via an Envelope Theorem", "abstract": "Orbital magnetization is an elementary thermodynamic response function of a quantum system: the derivative of the grand potential with respect to magnetic field. However, naive perturbation theory is fraught with difficulties, as even infinitesimal magnetic fields shatter any bands into a Hofstadter butterfly spectrum. Even at the self-consistent Hartree-Fock (mean field) level, rigorous formulas for the orbital magnetization have only become available within the last year. This work provides a straightforward derivation of orbital magnetization at the mean field level using a completely real-space approach. The key tools used are the magnetic perturbation theory developed in the 1960s and an envelope theorem, which is a standard result in the calculus of variations. For simplicity, we restrict to insulating states at zero temperature on the infinite plane. We also discuss the natural connections to projected position operators and quantum geometry, as well as practical numerical computations.", "url": "https://arxiv.org/abs/2610.27624", "type": "理论+数值", "summary": "轨道磁化强度是量子系统的基本热力学响应函数：大势能相对于磁场的导数。然而，朴素的微扰理论充满了困难，因为即使是无穷小的磁场也会将任何能带粉碎成霍夫施塔特蝴蝶谱。即使在自洽的 Hartree-Fock（平均场）水平上，轨道磁化强度的严格公式也是在去年才出现的。这项工作使用完全实空间的方法提供了平均场水平上轨道磁化强度的直接推导。使用的关键工具是 20 世纪 60 年代开发的磁扰动理论和包络定理，这是变分法的标准结果。为简单起见，我们限制无限平面上零温度下的绝缘状态。我们还讨论了与投影位置算子和量子几何的自然联系，以及实际的数值计算。", "authors": [{"name": "Daniel E Parker"}], "featured_authors": [{"name": "Daniel E Parker"}], "author_count": 1}, {"id": "2610.27630", "category": "cond-mat", "title": "Persistent Photo-Enhancement of Molecular Orbital Excitations in the Kondo Insulator FeSb$_2$", "abstract": "When insulators are excited by photons with above-gap energies, photo-doped carriers are transiently generated. Typically, orbital excitations weaken and broaden due to increased screening by these transient carriers, followed by a few-ps recovery via phonon thermalization. Here we report the observation of anomalous dynamics of many-body molecular orbital excitations in the narrow-gap Kondo insulator FeSb$_2$. In the pumped X-ray absorption spectra following excitation with 1~$\\mu$m photons, we observe a transient transfer of absorption intensity from the delocalized states at the main absorption peak to the localized molecular orbital states at the pre-edge. At the resonance of the low-energy molecular orbital excitations, the pumped resonant inelastic X-ray spectra show an approximately 30\\% intensity increase at a pump fluence of 11 mJ/cm$^2$ concomitant with the emergence of an energy gain feature. While the energy gain feature disappears after about 1-2~ps, the increased molecular orbital excitation intensities partially persist for at least 50~ps with no discernible energy shift. These observations require the invocation of a many-body excitation picture beyond single particle population changes.", "url": "https://arxiv.org/abs/2610.27630", "type": "理论", "summary": "当绝缘体被具有高于能隙能量的光子激发时，会瞬时产生光掺杂载流子。通常，由于这些瞬态载流子的屏蔽增加，轨道激发减弱并变宽，然后通过声子热化进行几皮秒的恢复。在这里，我们报告了窄间隙近藤绝缘体 FeSb$_2$ 中多体分子轨道激发的反常动力学的观察。在用 1~$\\mu$m 光子激发后的泵浦 X 射线吸收光谱中，我们观察到吸收强度从主吸收峰处的离域态到前边缘处的局域分子轨道态的瞬态转移。在低能分子轨道激发的共振下，泵浦共振非弹性 X 射线光谱显示，泵浦注量为 11 mJ/cm$^2$ 时强度增加了约 30%，同时出现了能量增益特征。虽然能量增益特征在大约 1-2~ps 后消失，但增加的分子轨道激发强度部分持续至少 50~ps，没有明显的能量转移。\n\n这些观察需要调用超出单粒子种群变化的多体激发图像。", "authors": [{"name": "Ke-Jun Xu"}, {"name": "Nathan Giles-Donovan"}, {"name": "Paulina Majchrzak"}, {"name": "Abhi Suthar"}, {"name": "Matthias Hepting"}, {"name": "Marco Trento"}, {"name": "Giacomo Ghiringhelli"}, {"name": "Elizabeth Skoropata"}, {"name": "Hiroki Ueda"}, {"name": "Eugenio Paris"}, {"name": "Biaolong Liu"}, {"name": "Elia Razzoli"}, {"name": "Wei-Sheng Lee"}, {"name": "Thomas P. Devereaux"}, {"name": "Zhi-Xun Shen"}, {"name": "Dung-Hai Lee"}, {"name": "Robert J. Birgeneau"}], "featured_authors": [{"name": "Ke-Jun Xu"}, {"name": "Nathan Giles-Donovan"}, {"name": "Paulina Majchrzak"}, {"name": "Zhi-Xun Shen"}, {"name": "Dung-Hai Lee"}, {"name": "Robert J. Birgeneau"}], "author_count": 17}, {"id": "2610.27663", "category": "cond-mat", "title": "Lattice symmetry breaking and strain control of single-$\\mathbf{q}$ magnetism in Na$_3$Co$_2$SbO$_6$", "abstract": "Distinguishing single-$\\mathbf{q}$ from multi-$\\mathbf{q}$ magnetism constrains microscopic spin Hamiltonians. Here we determine the ground state of the candidate Kitaev magnet Na$_3$Co$_2$SbO$_6$ through its coupling to the lattice. High-resolution neutron diffraction reveals a spontaneous monoclinic-to-triclinic distortion at the magnetic transition, in contrast to the absence of detectable lattice-symmetry breaking in triple-$\\mathbf{q}$ Na$_2$Co$_2$TeO$_6$. Together with strain-selective magnetic responses, this identifies single-$\\mathbf{q}$ order in Na$_3$Co$_2$SbO$_6$ over the proposed symmetry-preserving double-$\\mathbf{q}$ state. Uniaxial compression along a low-symmetry in-plane direction achieves the domain selection that magnetic-field training could not, revealing the intrinsic field-induced phase boundaries of the dominant domain. These results establish strain as a symmetry-conjugate field for magnetic domains and highlight magnetoelastic coupling as a route to diagnose, manipulate, and potentially tune magnetic states.", "url": "https://arxiv.org/abs/2610.27663", "type": "理论", "summary": "区分单 $\\mathbf{q}$ 和多 $\\mathbf{q}$ 磁性限制了微观自旋哈密顿量。在这里，我们通过与晶格的耦合确定候选基塔耶夫磁体 Na$_3$Co$_2$SbO$_6$ 的基态。高分辨率中子衍射揭示了磁转变时自发的单斜晶向三斜晶畸变，与三元 $\\mathbf{q}$ Na$_2$Co$_2$TeO$_6$ 中没有可检测到的晶格对称性破缺相反。与应变选择性磁响应一起，这确定了 Na$_3$Co$_2$SbO$_6$ 中所提出的对称性保持双 $\\mathbf{q}$ 状态的单 $\\mathbf{q}$ 顺序。沿低对称性面内方向的单轴压缩实现了磁场训练无法实现的域选择，揭示了主域的固有场感应相边界。这些结果将应变确立为磁域的对称共轭场，并强调磁弹性耦合作为诊断、操纵和潜在调整磁状态的途径。", "authors": [{"name": "Yuchen Gu"}, {"name": "Wu Xie"}, {"name": "Xintong Li"}, {"name": "Junhong Liu"}, {"name": "Xianghong Jin"}, {"name": "Dmitry Khalyavin"}, {"name": "Fabio Orlandi"}, {"name": "Pascal Manuel"}, {"name": "Ping Miao"}, {"name": "Yuan Li"}], "featured_authors": [{"name": "Yuchen Gu"}, {"name": "Wu Xie"}, {"name": "Xintong Li"}, {"name": "Pascal Manuel"}, {"name": "Ping Miao"}, {"name": "Yuan Li"}], "author_count": 10}, {"id": "2610.27664", "category": "cond-mat", "title": "Pressure-induced superconductivity in a bilayer metal", "abstract": "We propose a model that explains the mechanism of pressure-induced superconductivity in a bilayer metal. Four types of pair potentials are assumed for a Cooper pair consisting of two electrons on different layers. Absence of local inversion symmetry gives rise to the spin-orbit coupling which is antisymmetric in the two layers. We assume that external pressure enhances the hybridization between the two layers. The stability of the superconducting states is well explained by the frequency symmetry of the induced pairing correlations by these potentials. Pressure-induced superconductivity emerges when the following two conditions are realized. (i) The spin-orbit coupling induces the odd-frequency pairing correlations and suppresses superconductivity at ambient pressure. (ii) The interplay between the spin-orbit coupling and the hybridization induces the additional pairing correlation that belongs to an even-frequency symmetry class. We briefly discuss the relevance of our model to real materials.", "url": "https://arxiv.org/abs/2610.27664", "type": "理论", "summary": "我们提出了一个模型来解释双层金属中压力诱导超导的机制。对于由不同层上的两个电子组成的库珀对，假设有四种类型的对电势。局部反演对称性的缺失导致了两层中反对称的自旋轨道耦合。我们假设外部压力增强了两层之间的杂交。超导态的稳定性可以通过这些电势引起的配对相关性的频率对称性得到很好的解释。当满足以下两个条件时，就会出现压力诱导超导性。 （i）自旋轨道耦合引起奇数频率配对相关性并抑制环境压力下的超导性。 （ii）自旋轨道耦合和杂交之间的相互作用引起了属于偶频对称类的附加配对相关性。我们简要讨论我们的模型与真实材料的相关性。", "authors": [{"name": "Tomoya Sano"}, {"name": "Satoshi Ikegaya"}, {"name": "Shingo Kobayashi"}, {"name": "Yasuhiro Asano"}], "featured_authors": [{"name": "Tomoya Sano"}, {"name": "Satoshi Ikegaya"}, {"name": "Shingo Kobayashi"}, {"name": "Yasuhiro Asano"}], "author_count": 4}, {"id": "2610.27666", "category": "cond-mat", "title": "Symmetry Enriched Criticality from Kennedy Tasaki Self-Duality", "abstract": "The interplay between topology and quantum criticality has established symmetry enriched criticality as a new paradigm beyond conventional frameworks in condensed matter and statistical physics. However, the conditions under which such criticality emerges remain poorly understood. In this work, we show that a broad class of symmetry enriched critical points separating symmetry protected topological (SPT) and spontaneous symmetry breaking (SSB) phases is governed by Kennedy Tasaki (KT) self duality. At these criticalities, the KT transformation that interchanges the SPT and SSB phases acts as a self-dual noninvertible symmetry, endowing the critical points with nontrivial topological characteristics. We numerically demonstrate this mechanism in $\\mathbb{Z}_{n} \\times \\mathbb{Z}_{n}$ cluster qudit chains and further argue that it naturally extends to higher dimensions, providing a duality based criterion for identifying symmetry-enriched criticality across dimensions.", "url": "https://arxiv.org/abs/2610.27666", "type": "理论+数值", "summary": "拓扑和量子临界性之间的相互作用已经建立了对称性丰富的临界性，作为超越凝聚态和统计物理学传统框架的新范式。然而，人们对这种关键性出现的条件仍知之甚少。在这项工作中，我们表明，分离对称保护拓扑（SPT）和自发对称破缺（SSB）相的一大类对称性丰富的临界点受肯尼迪塔萨基（KT）自对偶性控制。在这些临界点，交换 SPT 和 SSB 相位的 KT 变换充当自对偶不可逆对称性，赋予临界点非平凡的拓扑特征。我们在 $\\mathbb{Z}_{n} \\times \\mathbb{Z}_{n}$ 集群 qdit 链中以数字方式证明了这种机制，并进一步认为它自然延伸到更高的维度，为识别跨维度的对称性丰富的临界性提供了基于对偶性的标准。", "authors": [{"name": "Mingyuan Chen"}, {"name": "Sheng Yang"}, {"name": "Xue-Jia Yu"}], "featured_authors": [{"name": "Mingyuan Chen"}, {"name": "Sheng Yang"}, {"name": "Xue-Jia Yu"}], "author_count": 3}, {"id": "2610.27709", "category": "cond-mat", "title": "A high-speed, large-aperture 3D printed laser shutter for cold atom experiments", "abstract": "Cold atom experiments require optical shutters with rapid and repeatable actuation. Existing solutions often involve high cost, limited aperture diameter and slow transitioning. We present a 3D-printable shutter design featuring a large aperture of 4.5 mm diameter, low-cost assembly, and robust performance. The device achieves switching times of $399\\pm8~\\mu$s with delays of $2.7\\pm0.2$ ms for a fully illuminated aperture, with four different shutters demonstrating repeatable performance. We measure the shutter speed to be $7.0\\pm0.1$ m/s. This approach offers an accessible, scalable solution for cold atom and other optical experiments requiring multiple shutters with precise light control and avoids the need to resize or precision-align a beam through an aperture.", "url": "https://arxiv.org/abs/2610.27709", "type": "实验", "summary": "冷原子实验需要具有快速且可重复驱动的光学快门。现有的解决方案通常涉及高成本、有限的孔径直径和缓慢的过渡。我们提出了一种可 3D 打印的快门设计，具有 4.5 毫米直径的大光圈、低成本组装和强大的性能。对于完全照明的光圈，该器件的切换时间为 $399\\pm8~\\mu$s，延迟为 $2.7\\pm0.2$ ms，四个不同的快门展示了可重复的性能。我们测量的快门速度为 $7.0\\pm0.1$ m/s。这种方法为冷原子和其他需要精确光控制的多个快门的光学实验提供了一种易于使用、可扩展的解决方案，并且无需调整通过孔径的光束大小或精确对准光束。", "authors": [{"name": "Samantha L. Rubinstein"}, {"name": "Charles W. Woffinden"}, {"name": "Maarten T. M. Christenhusz"}, {"name": "Guillaume Gauthier"}, {"name": "Tyler W. Neely"}], "featured_authors": [{"name": "Samantha L. Rubinstein"}, {"name": "Charles W. Woffinden"}, {"name": "Maarten T. M. Christenhusz"}, {"name": "Guillaume Gauthier"}, {"name": "Tyler W. Neely"}], "author_count": 5}, {"id": "2610.27718", "category": "cond-mat", "title": "Non-uniform grids to accelerate electron-phonon coupling calculations for superconductivity", "abstract": "Efficient and accurate evaluation of electron-phonon interactions is essential for predictive superconductivity calculations, but dense Brillouin zone sampling requirements pose a major computational bottleneck. To overcome this, we introduce an accelerated, highly scalable framework that combines a double delta truncation scheme with non-uniform Farey grids in both $\\mathbf{k}$ and $\\mathbf{q}$ space. The truncation strategy significantly reduces computational cost by restricting integration to states satisfying energy constraints near the Fermi level, while the Farey grids dynamically resolve sampling errors from localized scattering and stabilize convergence. Applied to elemental aluminium and several high-pressure hydrides, this combined methodology reduces computational cost by up to two orders of magnitude and yields electron-phonon coupling constants and superconducting critical temperatures Tc typically within about 5% of full-grid benchmarks. This approach overcomes sampling bottlenecks associated with dense uniform grids, making accurate, low-cost predictions of superconductivity in complex quantum materials feasible.", "url": "https://arxiv.org/abs/2610.27718", "type": "理论+数值", "summary": "高效、准确地评估电子-声子相互作用对于预测超导计算至关重要，但密集的布里渊区采样要求构成了主要的计算瓶颈。为了克服这个问题，我们引入了一种加速的、高度可扩展的框架，该框架将双增量截断方案与 $\\mathbf{k}$ 和 $\\mathbf{q}$ 空间中的非均匀 Farey 网格相结合。截断策略通过将积分限制在满足费米能级附近能量约束的状态，显着降低了计算成本，而法雷网格动态解决了局部散射的采样误差并稳定了收敛。这种组合方法应用于元素铝和几种高压氢化物，可将计算成本降低多达两个数量级，并产生电子-声子耦合常数和超导临界温度 Tc，通常在全电网基准的 5% 左右。这种方法克服了与密集均匀网格相关的采样瓶颈，使得复杂量子材料中超导性的准确、低成本预测成为可能。", "authors": [{"name": "Kang Wang"}, {"name": "Siyu Chen"}, {"name": "Sun-Woo Kim"}, {"name": "Kieran Bozier"}, {"name": "Chris Pickard"}, {"name": "Bartomeu Monserrat"}], "featured_authors": [{"name": "Kang Wang"}, {"name": "Siyu Chen"}, {"name": "Sun-Woo Kim"}, {"name": "Kieran Bozier"}, {"name": "Chris Pickard"}, {"name": "Bartomeu Monserrat"}], "author_count": 6}, {"id": "2610.27761", "category": "cond-mat", "title": "Good-$Γ$ Numbers: A Shell-Optimized Route to the Thermodynamic Limit in Quantum Monte Carlo Calculations of the High-Density Two-Dimensional Electron Gas", "abstract": "Single-particle finite-size errors remain a central obstacle in quantum Monte Carlo (QMC) simulations of periodic systems, conventionally reduced via twist averaging (TA). Here we introduce Good-$\\Gamma$ (GG) particle numbers as system sizes $N$ at which the $\\Gamma$-point Hartree--Fock (HF) energy of the high-density two-dimensional uniform electron gas (2D UEG) lies anomalously close to its thermodynamic-limit (TL) value. All results in this work concern the 2D UEG in its high-density Fermi-liquid regime, $r_s=1$--$4$. We systematically investigate the kinetic- and exchange-energy errors, $\\Delta KE(N)$ and $\\Delta EX(N)$, that underlie this one-body finite-size-error cancellation across four densities and both spin polarizations. We then compare diffusion Monte Carlo (DMC) energies extrapolated to the TL from GG-$N$ sequences against twist-averaged extrapolations at the same densities and polarizations, finding agreement to within a fraction of a millihartree in every case, independent of whether a $1/N$ or an $N^{-5/4}$ extrapolation form is used.", "url": "https://arxiv.org/abs/2610.27761", "type": "数值", "summary": "单粒子有限尺寸误差仍然是周期系统量子蒙特卡罗 (QMC) 模拟中的主要障碍，通常通过扭曲平均 (TA) 来减少。在这里，我们引入 Good-$\\Gamma$ (GG) 粒子数作为系统尺寸 $N$，其中高密度二维均匀电子气 (2D UEG) 的 $\\Gamma$ 点 Hartree--Fock (HF) 能量异常接近其热力学极限 (TL) 值。这项工作的所有结果都涉及高密度费米液体状态下的 2D UEG，$r_s=1$--$4$。我们系统地研究了动能和交换能误差 $\\Delta KE(N)$ 和 $\\Delta EX(N)$，它们是四种密度和两种自旋极化的单体有限尺寸误差抵消的基础。然后，我们将从 GG-$N$ 序列外推到 TL 的扩散蒙特卡罗 (DMC) 能量与相同密度和偏振下的扭曲平均外推进行比较，发现在每种情况下都在毫哈树的一小部分内一致，无论是否使用 $1/N$ 或 $N^{-5/4}$ 外推形式。", "authors": [{"name": "S. Azadi"}, {"name": "T. D. Kühne"}, {"name": "A. Principi"}, {"name": "M. S. Bahramy"}], "featured_authors": [{"name": "S. Azadi"}, {"name": "T. D. Kühne"}, {"name": "A. Principi"}, {"name": "M. S. Bahramy"}], "author_count": 4}, {"id": "2610.27779", "category": "cond-mat", "title": "Spin fluctuations and nearly isotropic quasiparticles in the doped three-dimensional Hubbard model", "abstract": "Away from half filling and above its Neel temperature, the three-dimensional Hubbard model is a paramagnetic metal with antiferromagnetic spin fluctuations, where controlled momentum-resolved results have been lacking. Using connected-determinant diagrammatic Monte Carlo, we compute the momentum-resolved self-energy for n = 0.4-0.95, T/t = 0.05-0.33 and U/t = 4-8, and the full-zone spin susceptibility at twelve of these points, focusing on U/t = 4. At U/t = 4 and toward half filling the spin fluctuations become strong: for n = 0.7-0.9 at T/t = 0.14 they enhance the susceptibility peak up to sevenfold and raise the momentum-dependent part of the scattering rate to four to five times its second-order value. They are driven by an effective spin interaction screened to about 2U/3 and nearly uniform over the zone. Yet the peak height is set by the slightly smaller value of this interaction at the peak wave vector, and near magnetic order this small difference changes the height by a large factor. Two-particle self-consistent theory reproduces the peak because its sum rule fixes its single constant interaction near this value, but for n = 0.7-0.9 at T/t = 0.14 its self-energy overestimates the local scattering rate and underestimates the momentum-dependent part. Though strong, the fluctuations are short ranged, with a correlation length of at most about two lattice spacings, and for n = 0.7-0.9 and T/t >= 0.14 the scattering rate near the Fermi surface varies by at most about 1% at fixed band energy, without hot spots. At U/t = 4 dynamical mean-field theory (DMFT) reproduces the local scattering rate and quasiparticle weight within a few percent, and the nonlocal part it misses is approximately a function of the band energy. Strong spin fluctuations thus coexist with nearly isotropic quasiparticles, and the results provide a benchmark for extensions of DMFT and for spin-fluctuation theories.", "url": "https://arxiv.org/abs/2610.27779", "type": "理论+数值", "summary": "远离半填充且高于尼尔温度，三维哈伯德模型是一种具有反铁磁自旋涨落的顺磁性金属，其中缺乏受控动量解析结果。使用连通行列式蒙特卡罗图，我们计算了 n = 0.4-0.95、T/t = 0.05-0.33 和 U/t = 4-8 的动量分辨自能，以及其中 12 个点的全区自旋敏感性，重点关注 U/t = 4。在 U/t = 4 和接近半填充时，自旋涨落变得很强：对于 T/t 处的 n = 0.7-0.9 = 0.14 它们将磁化率峰值增强至七倍，并将散射率的动量相关部分提高至其二阶值的四到五倍。它们由有效的自旋相互作用驱动，该自旋相互作用筛选至约 2U/3 并且在整个区域上几乎均匀。然而，峰值高度是由峰值波矢量处的这种相互作用的稍小的值决定的，并且在磁阶附近，这种微小的差异会以很大的系数改变高度。\n\n双粒子自洽理论再现了峰值，因为它的求和规则将其单一常数相互作用固定在该值附近，但对于 n = 0.7-0.9，T/t = 0.14，其自能高估了局部散射率并低估了动量相关部分。虽然波动很强，但波动范围很短，相关长度最多约为两个晶格间距，并且对于 n = 0.7-0.9 且 T/t >= 0.14，费米表面附近的散射率在固定带能量下最多变化约 1%，没有热点。当 U/t = 4 时，动态平均场理论 (DMFT) 在百分之几内重现了局部散射率和准粒子重量，并且它错过的非局部部分大约是能带能量的函数。因此，强自旋涨落与近各向同性准粒子共存，其结果为 DMFT 的扩展和自旋涨落理论提供了基准。", "authors": [{"name": "Pengcheng Hou"}, {"name": "Kun Chen"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Pengcheng Hou"}, {"name": "Kun Chen"}, {"name": "Youjin Deng"}], "author_count": 3}, {"id": "2610.27787", "category": "cond-mat", "title": "Emergent Active-Blob Length Scale Governs the Collapse Transition of Tangentially Driven Polymers", "abstract": "The coil-to-globule transition is a paradigmatic phenomenon in polymer physics and biophysics, in which polymer chains evolve from swollen to globular conformations upon decreasing solvent quality. At equilibrium, this transition can be rationalized in terms of a thermal blob length that diverges at the so-called $\\Theta$ condition, marking the crossover from self-avoiding to globular conformations. How activity modifies this conformational transition and affects the fundamental length scales at play remains poorly understood. Here, we address this question for tangentially driven polymers using Brownian dynamics simulations, systematically varying both intrachain attraction strength and activity. We find that polar activity smears out the crossover from swollen to globular conformations. Between self-avoiding and $\\Theta$ conditions, activity dominates by introducing an emergent folding length scale, which acts as an active blob length. In this regime, we demonstrate that the ratio of thermal to active length scales provides a new scaling variable that leads to a universal master curve for active polymer collapse.", "url": "https://arxiv.org/abs/2610.27787", "type": "理论+数值", "summary": "卷曲到球状的转变是聚合物物理学和生物物理学中的一个典型现象，其中聚合物链在溶剂质量降低时从溶胀构象演变为球状构象。在平衡状态下，这种转变可以根据在所谓的 $\\Theta$ 条件下发散的热团长度来合理化，标志着从自回避构象到球状构象的交叉。活性如何改变这种构象转变并影响发挥作用的基本长度尺度仍然知之甚少。在这里，我们使用布朗动力学模拟解决切向驱动聚合物的这个问题，系统地改变链内吸引力强度和活性。我们发现极性活动抹掉了从肿胀构象到球状构象的交叉。在自我回避和 $\\Theta$ 条件之间，活动通过引入紧急折叠长度尺度（充当活动斑点长度）来占主导地位。在这种情况下，我们证明热与活性长度比例的比率提供了一个新的比例变量，该变量导致活性聚合物塌陷的通用主曲线。", "authors": [{"name": "Baptiste Parage"}, {"name": "Sara Jabbari-Farouji"}], "featured_authors": [{"name": "Baptiste Parage"}, {"name": "Sara Jabbari-Farouji"}], "author_count": 2}, {"id": "2610.27798", "category": "cond-mat", "title": "Accelerating real-time hybrid-functional calculations with learned ACE and symmetry-based FFT reuse", "abstract": "Real-time hybrid-functional calculations require repeated reconstruction of nonlocal exchange, whose cost grows rapidly with Brillouin-zone sampling. We develop two methods to improve the efficiency of time evolution and spatial processing. The first learns the time evolution of adaptively compressed exchange (ACE) factors and predicts their updates, reducing the frequency of explicit reconstruction. The second uses crystal symmetry to reuse exchange fast Fourier transforms (FFTs) among equivalent real-space points. This symmetry-based FFT reuse (SBFR) reduces the number of FFTs while retaining the full $\\bm k$-point sum. The methods can be used with a variety of hybrid functionals, and we use HSE06 in this work. Relative to an ACE reference using full-row mesh FFTs, learned prediction provides more than fivefold acceleration, SBFR more than fourteenfold, and their combination more than sixty-threefold. The combined method shows efficient parallel scaling. After learning, propagation takes less than 0.5 s per step. The reduced computational cost allows us to study nonlinear and nonequilibrium electron dynamics with hybrid functionals and to examine the role of excitonic effects in semiconductors and insulators.", "url": "https://arxiv.org/abs/2610.27798", "type": "理论+数值", "summary": "实时混合功能计算需要重复重建非局域交换，其成本随着布里渊区采样而迅速增长。我们开发了两种方法来提高时间演化和空间处理的效率。第一个学习自适应压缩交换（ACE）因子的时间演化并预测它们的更新，从而减少显式重建的频率。第二种利用晶体对称性在等效的实空间点之间重复使用交换快速傅立叶变换 (FFT)。这种基于对称性的 FFT 重用 (SBFR) 减少了 FFT 的数量，同时保留了完整的 $\\bm k$ 点和。这些方法可以与各种混合泛函一起使用，我们在这项工作中使用 HSE06。相对于使用全行网格 FFT 的 ACE 参考，学习预测提供了超过五倍的加速，SBFR 超过十四倍，它们的组合超过六十三倍。组合方法显示了高效的并行缩放。学习后，每步传播时间不到 0.5 秒。\n\n计算成本的降低使我们能够利用混合泛函研究非线性和非平衡电子动力学，并研究激子效应在半导体和绝缘体中的作用。", "authors": [{"name": "Tomohito Otobe"}], "featured_authors": [{"name": "Tomohito Otobe"}], "author_count": 1}, {"id": "2610.27811", "category": "cond-mat", "title": "A Transport-Information Framework for Continuous-Fiber-Aligned Coarse-Graining Representation Sets", "abstract": "Consider representation sets of interest whose elements are associated with continuous realizations related to them through coarse-graining (CG). CG can be regarded as an operation that reduces a representation by discarding information that is not retained in its output. However, a systematic description of the information structure associated with CG in general remains to be established. Here, we propose a transport-information framework for continuous-fiber-aligned representation sets, in which each representation is associated with a continuous realization through a fiber structure, with CG defining the projection onto the representation. Within this framework, CG is described through a local-map operation that transports continuous probability mass onto representative points. The resulting transport cost is expressed as the contraction of the second-moment structure of the underlying continuous representation with the transport metric. Building on the previously proposed framework of unavoidable canonical nonlinearity (UCN), this construction provides a non-arbitrary information-theoretic interpretation of the CG-associated transport cost in terms of information indistinguishability, quantified by an expected Kullback-Leibler divergence associated with the CG geometry. The present framework provides a basis for describing information costs associated with individual CG operations and for comparing representation sets while accounting for their underlying continuous realizations.", "url": "https://arxiv.org/abs/2610.27811", "type": "理论", "summary": "考虑感兴趣的表示集，其元素通过粗粒度（CG）与与其相关的连续实现相关联。 CG可以被视为一种通过丢弃未保留在其输出中的信息来减少表示的操作。然而，与 CG 相关的信息结构的系统描述仍有待建立。在这里，我们提出了一种用于连续纤维对齐表示集的传输信息框架，其中每个表示都通过纤维结构与连续实现相关联，CG 定义了表示上的投影。在此框架内，CG 通过局部地图操作来描述，该操作将连续概率质量传输到代表点上。由此产生的传输成本表示为底层连续表示的二阶矩结构与传输度量的收缩。\n\n基于先前提出的不可避免的正则非线性 (UCN) 框架，这种结构在信息不可区分性方面提供了对 CG 相关传输成本的非任意信息理论解释，通过与 CG 几何相关的预期 Kullback-Leibler 散度进行量化。本框架提供了描述与各个CG操作相关的信息成本以及在考虑其底层连续实现的同时比较表示集的基础。", "authors": [{"name": "Koretaka Yuge"}], "featured_authors": [{"name": "Koretaka Yuge"}], "author_count": 1}, {"id": "2610.27825", "category": "cond-mat", "title": "Early-stage local melting during solid-state sintering of a Cu-Ni-Ti-Zr-Hf alloy: A combined thermodynamic and kinetic analysis", "abstract": "Complex concentrated alloys (CCAs) combining elements from 3d transition and refractory groups, specifically Cu-Ni-Ti-Zr-Hf-based shape memory systems, exhibit excellent functional properties but present significant manufacturing challenges via powder metallurgy. In this study, a non-equimolar Cu15Ni35Ti25Zr12.5Hf12.5 (at. %) alloy was successfully produced by induction melting, followed by atomization and subsequent consolidation via Spark Plasma Sintering (SPS) at temperatures ranging from 850 to 1100 C. Although global equilibrium phase diagrams predict solid-state stability up to 1260 C, localized melting unexpectedly occurred during SPS at 1100 C. By combining retrospective Scheil-Gulliver solidification simulations with 2D local equilibrium heat maps, we demonstrate that this early-stage melting is not driven by macroscopic thermal gradients, but by microsegregation inherited from atomization. During solid-state heating, thermally activated short-range diffusion, accelerated by high defect densities at particle interfaces, partitions Ti towards the interparticle network, leaving Cu-enriched regions (up to ~41 at. %) within the particle interiors. Owing to the strongly negative mixing enthalpy of Cu with Hf (-19.2 kJ/mol for $\\Delta H_{mix}^{l-l}$) and, to a lesser extent, with Ti, the local solidus of these Cu-rich regions is dramatically depressed. Upon heating to 1100 C, these regions cross their local solidus and form a liquid phase, whose solidification produces the Cu-Hf co-segregation. This framework accounts for localized melting phenomena in rapidly solidified CCA powders containing low-melting constituents with strong negative mixing enthalpies.", "url": "https://arxiv.org/abs/2610.27825", "type": "数值", "summary": "复杂浓缩合金 (CCA) 结合了 3d 过渡和难熔族元素，特别是基于 Cu-Ni-Ti-Zr-Hf 的形状记忆系统，表现出优异的功能特性，但通过粉末冶金提出了重大的制造挑战。在本研究中，通过感应熔炼成功生产了非等摩尔 Cu15Ni35Ti25Zr12.5Hf12.5 (at. %) 合金，然后在 850 至 1100 C 的温度下通过火花等离子烧结 (SPS) 进行雾化和随后的固结。虽然全局平衡相图预测高达 1260 C 的固态稳定性，但在 1100 C 的 SPS 过程中意外地发生了局部熔化。 C. 通过将回顾性 Scheil-Gulliver 凝固模拟与二维局部平衡热图相结合，我们证明了这种早期熔化不是由宏观热梯度驱动的，而是由原子化继承的微观偏析驱动的。在固态加热过程中，热激活的短程扩散，通过颗粒界面处的高缺陷密度加速，将 Ti 分配到颗粒间网络，在颗粒内部留下富铜区域（高达约 41 at.%）。\n\n由于 Cu 与 Hf 的强负混合焓（$\\Delta H_{mix}^{l-l}$ 为 -19.2 kJ/mol）以及较小程度的 Ti，这些富铜区域的局部固相线显着降低。加热到 1100°C 后，这些区域穿过其局部固相线并形成液相，其凝固产生 Cu-Hf 共偏析。该框架解释了含有具有强负混合焓的低熔点成分的快速固化 CCA 粉末中的局部熔化现象。", "authors": [{"name": "Andrea Skolakova"}, {"name": "Hana Lesakova"}, {"name": "Frantisek Lukac"}, {"name": "Marketa Jarosova"}, {"name": "Jan Pinc"}], "featured_authors": [{"name": "Andrea Skolakova"}, {"name": "Hana Lesakova"}, {"name": "Frantisek Lukac"}, {"name": "Marketa Jarosova"}, {"name": "Jan Pinc"}], "author_count": 5}, {"id": "2610.27858", "category": "cond-mat", "title": "Classical-to-Quantum Transition in Blackbody Radiation Thermodynamics: Planck's Law without Statistical Assumptions", "abstract": "Inspired by Fermi's model of radiation-matter interaction, we investigate the classical dynamics of a closed, finite-energy system, in which matter is coupled to an electromagnetic field. We find that energy is progressively transferred to increasingly high-frequency field modes, so that the effective temperature of both matter and radiation approaches zero in the long-time limit - in sharp contradiction with the finite-temperature equilibrium assumed by classical blackbody thermodynamics. Requiring consistency with the Stefan-Boltzmann and Wien laws identifies a characteristic time $t_L$, at which both laws are simultaneously satisfied. Strikingly, classical spectra obtained for different energies and cavity sizes collapse onto the universal Planck distribution at $t_L$. We conjecture that quantum dynamical localization arrests the classical energy cascade at $t_L$, and that the Planck distribution emerges as a dynamical consequence of this arrest - without invoking any a priori statistical assumption.", "url": "https://arxiv.org/abs/2610.27858", "type": "理论", "summary": "受费米辐射与物质相互作用模型的启发，我们研究了封闭有限能量系统的经典动力学，其中物质与电磁场耦合。我们发现能量逐渐转移到越来越高频的场模式，使得物质和辐射的有效温度在长时间极限内接近于零——这与经典黑体热力学假设的有限温度平衡形成鲜明矛盾。要求与斯蒂芬-玻尔兹曼和维恩定律保持一致，确定了一个特征时间 $t_L$，在该时间两个定律同时得到满足。引人注目的是，针对不同能量和腔尺寸获得的经典光谱在 $t_L$ 处崩溃到通用普朗克分布。我们推测，量子动力学局域化将经典能量级联抑制在 $t_L$ 处，并且普朗克分布作为这种抑制的动力学结果而出现——无需调用任何先验统计假设。", "authors": [{"name": "J. Wang"}, {"name": "G. Casati"}, {"name": "G. Benenti"}], "featured_authors": [{"name": "J. Wang"}, {"name": "G. Casati"}, {"name": "G. Benenti"}], "author_count": 3}, {"id": "2610.27938", "category": "cond-mat", "title": "Thermodynamic Stability of Classical $\\mathbb Z_2$ Lattice Gauge Models", "abstract": "Finite-temperature phases are traditionally studied through spontaneous symmetry breaking, but symmetry-breaking fields can remove their distinction, as in the Ising model. This motivates the search for stable nontrivial thermal phases without symmetry protection. For classical $\\mathbb Z_2$ lattice gauge models with spins on $m$-dimensional cells in a fixed spatial dimension $d$, we prove joint analyticity of the thermodynamic free-energy density in temperature and perturbation strength at sufficiently low positive temperatures under sufficiently weak local perturbations, whenever $1\\le m\\le d-2$. Perturbations need not preserve internal or gauge symmetries and may include noncommuting quantum interactions. A separate high-temperature expansion yields an analytic region reaching infinite temperature at any fixed finite perturbation strength. These results establish thermodynamic stability and support the conjecture that low- and high-temperature regimes remain separated by a thermal transition without symmetry protection.", "url": "https://arxiv.org/abs/2610.27938", "type": "理论", "summary": "传统上，有限温度相是通过自发对称破缺来研究的，但对称破缺场可以消除它们的区别，如伊辛模型中那样。这激发了寻找没有对称性保护的稳定的非平凡热相。对于在固定空间维度$d$中在$m$维单元上自旋的经典$\\mathbb Z_2$晶格规范模型，我们证明了在足够弱的局部扰动下，在足够低的正温度下，温度和扰动强度的热力学自由能密度的联合解析性，只要$1\\le m\\le d-2$。扰动不需要保持内部或规范对称性，并且可能包括非对易量子相互作用。单独的高温膨胀会产生在任何固定的有限扰动强度下达到无限温度的分析区域。这些结果建立了热力学稳定性，并支持这样的猜想：低温和高温状态通过热转变而保持分离，而没有对称性保护。", "authors": [{"name": "Shunsuke Sengoku"}, {"name": "Weiguang Cao"}, {"name": "Haruki Watanabe"}], "featured_authors": [{"name": "Shunsuke Sengoku"}, {"name": "Weiguang Cao"}, {"name": "Haruki Watanabe"}], "author_count": 3}, {"id": "2610.27964", "category": "cond-mat", "title": "Effect of interfacial water structure on the adsorption of weakly hydrated anions", "abstract": "Weakly hydrated anions tend to partition to macromolecular surfaces, leading to salting-in at low salt concentrations. Recent studies have linked this partitioning to disruption of the interfacial water network. Here, we investigate the role of interfacial-water-network disruption as an indirect driving force for the adsorption of weakly hydrated anions and its interplay with direct solute-anion and anion-cation interactions using computer simulations. We study the adsorption of SCN$^{-}$ and I$^{-}$ ions on a model extended solute that interacts with water and ions only via van der Waals interactions. To probe the indirect contribution, we increase the effective solute size while simultaneously decreasing the attractive solute-water and solute-ion interactions, resulting in progressively greater disorder in the interfacial water network in pure aqueous solutions. Our results show that iodide adsorption increases despite weaker direct solute-iodide interactions and correlates with greater disruption of the interfacial water network, although iodide remains depleted overall. In contrast, preferential adsorption of SCN$^{-}$ decreases, but the rate of decrease becomes smaller at higher levels of interfacial-water-network disorder. This suggests that the indirect contribution associated with interfacial-water-network disruption partly compensates for the decrease in SCN$^{-}$ adsorption caused by weaker direct solute-SCN$^{-}$ interactions. Our results highlight that the indirect contribution associated with interfacial-water-network disruption promotes the adsorption of weakly hydrated anions on macromolecular surfaces, while the extent of adsorption also depends on direct solute-ion interactions and anion-cation pairing. This interplay may be particularly important in mixed-salt solutions, where the presence of strongly hydrated anions can also disrupt the interfacial water network.", "url": "https://arxiv.org/abs/2610.27964", "type": "理论+数值", "summary": "弱水合阴离子倾向于分配到大分子表面，导致低盐浓度下的盐析。最近的研究将这种分配与界面水网络的破坏联系起来。在这里，我们使用计算机模拟研究了界面水网络破坏作为弱水合阴离子吸附的间接驱动力的作用及其与直接溶质阴离子和阴离子阳离子相互作用的相互作用。我们研究了 SCN$^{-}$ 和 I$^{-}$ 离子在模型扩展溶质上的吸附，该溶质仅通过范德华相互作用与水和离子相互作用。为了探究间接贡献，我们增加了有效溶质尺寸，同时减少了有吸引力的溶质-水和溶质-离子相互作用，导致纯水溶液中界面水网络的无序性逐渐增大。我们的结果表明，尽管直接溶质-碘化物相互作用较弱，但碘化物吸附仍增加，并且与界面水网络的更大破坏相关，尽管碘化物总体上仍处于耗尽状态。\n\n相反，SCN$^{-}$ 的优先吸附减少，但在界面水网络无序程度较高时减少的速率变得更小。这表明与界面水网络破坏相关的间接贡献部分补偿了由较弱的直接溶质-SCN$^{-}$相互作用引起的SCN$^{-}$吸附的减少。我们的结果强调，与界面水网络破坏相关的间接贡献促进了弱水合阴离子在大分子表面上的吸附，而吸附程度还取决于直接的溶质离子相互作用和阴离子阳离子配对。这种相互作用在混合盐溶液中可能特别重要，其中强水合阴离子的存在也会破坏界面水网络。", "authors": [{"name": "Swaminath Bharadwaj"}], "featured_authors": [{"name": "Swaminath Bharadwaj"}], "author_count": 1}, {"id": "2610.28024", "category": "cond-mat", "title": "Generalized Spin Groups and Applications to Magnons", "abstract": "Spin groups provide the natural symmetry framework for the isotropic Heisenberg model, in which spin and lattice degrees of freedom are separable. They have recently found broad applications in describing electronic band structure, magnon band topology, and transport phenomena. However, a typical spin Hamiltonian describing magnons contains not only isotropic Heisenberg exchange but also anisotropic interactions induced by spin-orbit coupling (SOC), including the Dzyaloshinskii-Moriya (DM) interaction, the Gamma exchange, and the single-ion anisotropy (SIA), which strongly influence magnon properties. More recently, some studies have also revealed relativistic magnon transport phenomena in altermagnets. Such systems typically exhibit partial spin-lattice locking, but are commonly assumed to be described by conventional magnetic groups. Here, we develop a systematic symmetry framework, generalized spin groups, for magnons. We first classify the symmetries of Heisenberg, DM, Gamma, and SIA interactions. The resulting classification contains 6 spin-only groups, together with a total of 161 nontrivial spin groups. The symmetries of magnetically ordered phases are then obtained through spontaneous symmetry breaking of the corresponding parent groups for spin Hamiltonians. We also identify 6 spin-only groups for ordered states, which generate 90, 264, 157, 264, 387, and 598 nontrivial spin groups, respectively. Finally, we apply generalized spin groups to the magnon thermal conductivity and spin conductivity tensors and derive all the symmetry-allowed forms. Our results provide a unified symmetry framework for analyzing magnon transport both with and without SOC, yielding more refined constraints on magnon responses.", "url": "https://arxiv.org/abs/2610.28024", "type": "理论", "summary": "自旋群为各向同性海森堡模型提供了自然对称框架，其中自旋和晶格自由度是可分离的。他们最近在描述电子能带结构、磁振子能带拓扑和输运现象方面发现了广泛的应用。然而，描述磁振子的典型自旋哈密顿量不仅包含各向同性海森堡交换，还包含自旋轨道耦合（SOC）引起的各向异性相互作用，包括Dzyaloshinskii-Moriya（DM）相互作用、伽玛交换和单离子各向异性（SIA），这些相互作用强烈影响磁振子性质。最近，一些研究还揭示了交流磁体中的相对论磁振子输运现象。此类系统通常表现出部分自旋晶格锁定，但通常假设由常规磁性基团描述。在这里，我们为磁振子开发了一个系统的对称框架，即广义自旋群。我们首先对 Heisenberg、DM、Gamma 和 SIA 相互作用的对称性进行分类。生成的分类包含 6 个仅自旋组，以及总共 161 个非平凡自旋组。\n\n然后通过自旋哈密顿量的相应母群的自发对称破缺获得磁有序相的对称性。我们还确定了有序态的 6 个仅自旋群，它们分别生成 90、264、157、264、387 和 598 个非平凡自旋群。最后，我们将广义自旋群应用于磁振子热导率和自旋电导率张量，并导出所有对称允许的形式。我们的结果提供了一个统一的对称框架，用于分析有和没有 SOC 的磁振子输运，从而对磁振子响应产生更精细的约束。", "authors": [{"name": "Xinhai Tu"}, {"name": "Di Wang"}, {"name": "Yuxuan Mu"}, {"name": "Xiangang Wan"}], "featured_authors": [{"name": "Xinhai Tu"}, {"name": "Di Wang"}, {"name": "Yuxuan Mu"}, {"name": "Xiangang Wan"}], "author_count": 4}, {"id"
