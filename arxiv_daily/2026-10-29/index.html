s 2 supercell honeycomb-vacancy lattice, combining analytic reductions with Bloch spectra, lattice Chern invariants, and quantum geometry. The parent lattice has three exact flat branches, a smooth periodic zero mode, and a compact localized state. A uniform gap bound shows that faint intracell-loop hopping preserves two topologically trivial insulating gaps. The intracell hopping graph also admits a staggered chiral coloring: reversing site amplitudes according to this coloring links opposite energies at momenta separated by half a reciprocal period. This constraint restricts the isolated central band to even Chern numbers and forbids a zero-energy insulating filling at every loop phase. Purely imaginary loop hopping admits a real gauge, whereas other phases allow paired band contacts connecting central bands with C3=2 and C3=4. On a specified strong-loop cut, third-order masses open the direct gaps; these gaps shrink faster than the bandwidth as the coupling grows. Changing the bond connectivity to an oriented honeycomb next-nearest-neighbor extension generates a narrower Chern band with nonuniform quantum geometry. These results distinguish individual-band topology from occupied-group topology and reveal how bond connectivity and cell translations determine which topological bands can emerge from an exactly flat parent.", "url": "https://arxiv.org/abs/2610.36738", "type": "理论", "summary": "将平带母体转变为孤立的陈氏带需要对相消干涉、跳跃相位和键的单元平移进行监督。我们在七轨道 2 × 2 超胞蜂窝空位晶格中研究这种联系，将解析约简与布洛赫谱、晶格陈不变量和量子几何相结合。母晶格具有三个精确的平坦分支、平滑的周期性零模式和紧凑的局域态。均匀的间隙界限表明，微弱的细胞环内跳跃保留了两个拓扑上微不足道的绝缘间隙。细胞内跳跃图还允许交错的手性着色：根据这种着色反转位点振幅在相隔半个倒数周期的动量处链接相反的能量。该约束将孤立的中心带限制为偶数陈数，并禁止在每个环路相位进行零能量绝缘填充。纯粹虚构的环路跳变允许真实的规格，而其他相位允许成对的带接触连接中心带，其中C3=2和C3=4。在指定的强循环切割上，三阶质量打开直接间隙；随着耦合的增加，这些间隙的缩小速度快于带宽的缩小速度。\n\n将键连接改变为定向蜂窝状次近邻延伸会产生具有不均匀量子几何形状的较窄陈能带。这些结果区分了个体能带拓扑和占据组拓扑，并揭示了键连接性和单元平移如何确定哪些拓扑能带可以从完全平坦的母体中出现。", "authors": [{"name": "Weizhuo Xu"}, {"name": "Jiachen Qian"}, {"name": "Shuaihua Zhang"}, {"name": "Yanling Wu"}, {"name": "Jun Li"}], "featured_authors": [{"name": "Weizhuo Xu"}, {"name": "Jiachen Qian"}, {"name": "Shuaihua Zhang"}, {"name": "Yanling Wu"}, {"name": "Jun Li"}], "author_count": 5}, {"id": "2610.36740", "category": "cond-mat", "title": "Spatial localization of magnetic-branch force contrasts in substitutional Mn-doped Ge: A first-principles study", "abstract": "Magnetic energy gaps do not reveal the spatial distribution of magnetic-state-dependent atomic forces. We compare ferromagnetic and antiferromagnetic forces at identical nuclear positions in 64-site substitutional Mn-doped Ge using collinear PBE calculations. For nearest-neighbour Mn pairs, the radial force projection reverses sign between magnetic branches. In the second-neighbour geometry, the shared Ge neighbour has the largest force contrast, about 2.2 times that of equally near Ge sites coordinated to one Mn. Bridge-displacement gap slopes agree with direct force derivatives across four numerical settings. Tightening the electronic threshold by 100-fold preserves magnetic ordering and the leading site, while the force-contrast vector changes by 1.08% despite a nearly unchanged energy gap. The results identify coordination-associated localization of magnetic-branch force contrasts within the frozen model, without establishing relaxed distortions, full numerical convergence or a unique exchange mechanism.", "url": "https://arxiv.org/abs/2610.36740", "type": "理论+数值", "summary": "磁能隙不能揭示磁态相关原子力的空间分布。我们使用共线 PBE 计算比较了 64 位置换锰掺杂 Ge 中相同核位置的铁磁力和反铁磁力。对于最近邻 Mn 对，径向力投影会反转磁分支之间的符号。在第二邻点几何结构中，共享的 Ge 邻点具有最大的力对比，大约是与 1 Mn 配位的同样邻近的 Ge 位点的力对比的 2.2 倍。桥位移间隙斜率与四种数值设置下的直接力导数一致。将电子阈值收紧 100 倍可以保留磁序和领先位点，而尽管能隙几乎没有变化，但力对比矢量发生了 1.08% 的变化。结果确定了冻结模型内磁支力对比的协调相关定位，而无需建立松弛扭曲、完全数值收敛或独特的交换机制。", "authors": [{"name": "ChienHsu Chen"}], "featured_authors": [{"name": "ChienHsu Chen"}], "author_count": 1}, {"id": "2610.36742", "category": "cond-mat", "title": "Antisymmetric thermopower without magnetism in three-phase composites", "abstract": "A thermopower that turns a temperature gradient into a perpendicular electric field in every in-plane direction has relied on magnetism. Reciprocity permits it without magnetism, yet under a three-fold or higher axis it vanishes both in reciprocal elastic band transport and in composites of two isotropic phases with ideal interfaces. Here we show that composites of three isotropic phases carry it, and that under such an axis three is the minimum. A third, linearly independent transport matrix escapes the exact two-phase reduction; at weak contrast the first allowed axial term is cubic, proportional to a determinant of the three matrices times material-weighted, handed three-point correlations. Treating the phases as colours identifies the arrangements that allow the response, and crystal nets from reticular chemistry supply printable three-dimensional ones. Certified two-sided bounds give axial Seebeck coefficients of 49.5-50.2 $\\mu$V K$^{-1}$ in a planar cell and 76-84 $\\mu$V K$^{-1}$ in a printable woodpile; reflections in planes containing the axis reverse the response, and recolouring 24 nets to restore their parent symmetry switches it off. Around a line heat source the axial driving field has the $1/r$ azimuthal form of the magnetic field of a straight wire and drives circulating currents.", "url": "https://arxiv.org/abs/2610.36742", "type": "理论", "summary": "将温度梯度转变为每个面内方向的垂直电场的热电势依赖于磁性。互易性允许它没有磁性，但在三倍或更高的轴下，它在互易弹性带输运和具有理想界面的两个各向同性相的复合材料中消失。在这里，我们表明三个各向同性相的复合材料携带它，并且在这样的轴下三个是最小的。第三个线性独立的传输矩阵逃脱了精确的两相约简；在弱对比度下，第一个允许的轴项是三次，与三个矩阵的行列式乘以材料加权、手三点相关性成正比。将相作为颜色来识别允许响应的排列，并且来自网状化学的晶体网提供可打印的三维晶体网。经过认证的两侧边界给出的轴向塞贝克系数在平面单元中为 49.5-50.2 $\\mu$V K$^{-1}$，在可打印的木堆中为 76-84 $\\mu$V K$^{-1}$；包含轴的平面中的反射会反转响应，并且重新着色 24 个网络以恢复其父对称性会将其关闭。\n\n围绕线热源，轴向驱动场具有直线磁场的 $1/r$ 方位角形式并驱动循环电流。", "authors": [{"name": "Joohan Nam"}], "featured_authors": [{"name": "Joohan Nam"}], "author_count": 1}, {"id": "2610.36782", "category": "cond-mat", "title": "Real-Space Selection Rule for Moiré Exciton-Phonon Coupling", "abstract": "Exciton-phonon coupling (ExPC) governs energy relaxation and exciton dynamics in photoexcited quantum materials. Recent advances have revealed rich and tunable excitonic phenomena in moiré superlattices, yet the microscopic mechanisms underlying the coupling between moiré excitons and moiré phonons remain elusive. Here, we develop a real-space representation for moiré ExPC based on a unified theoretical framework combining the many-body Bethe-Salpeter equation with phonon perturbation theory. Furthermore, we uncover a general real-space selection rule: the spatial matching of a moiré exciton's electron and hole densities with the moiré-phonon-induced potential perturbations determines their individual coupling contributions, while coherent interference between the electron and hole contributions controls the total ExPC. We demonstrate this rule in prototypical WSe2/WS2 moiré heterobilayers, revealing pronounced exciton- and phonon-mode-dependent coupling, including nearly complete suppression of ExPC through destructive electron-hole interference. These findings establish the internal electron-hole spatial configuration of moiré excitons as a key degree of freedom governing the strength and mode selectivity of their coupling to moiré phonons, opening opportunities to engineer ExPC through spatially tailored moiré potentials.", "url": "https://arxiv.org/abs/2610.36782", "type": "理论", "summary": "激子-声子耦合 (ExPC) 控制光激发量子材料中的能量弛豫和激子动力学。最近的进展揭示了莫尔超晶格中丰富且可调节的激子现象，但莫尔激子与莫尔声子之间耦合的微观机制仍然难以捉摸。在这里，我们基于多体 Bethe-Salpeter 方程与声子微扰理论相结合的统一理论框架，开发了莫尔 ExPC 的实空间表示。此外，我们发现了一般的实空间选择规则：莫尔激子的电子和空穴密度与莫尔声子引起的电势扰动的空间匹配决定了它们各自的耦合贡献，而电子和空穴贡献之间的相干干涉控制了总的 ExPC。我们在原型 WSe2/WS2 莫尔异双层中证明了这一规则，揭示了明显的激子和声子模式依赖耦合，包括通过破坏性电子空穴干涉几乎完全抑制 ExPC。\n\n这些发现将莫尔激子的内部电子-空穴空间构型确立为控制莫尔激子与莫尔声子耦合的强度和模式选择性的关键自由度，为通过空间定制的莫尔势来设计 ExPC 提供了机会。", "authors": [{"name": "Yixuan Liu"}, {"name": "Shiyu Peng"}, {"name": "Yifan Wang"}, {"name": "Peiyao Qin"}, {"name": "Wang Yao"}, {"name": "Chen Hu"}], "featured_authors": [{"name": "Yixuan Liu"}, {"name": "Shiyu Peng"}, {"name": "Yifan Wang"}, {"name": "Peiyao Qin"}, {"name": "Wang Yao"}, {"name": "Chen Hu"}], "author_count": 6}, {"id": "2610.36817", "category": "cond-mat", "title": "Mixed symmetries in active non-reciprocal systems", "abstract": "Active materials are driven out of equilibrium at the microscopic scale and display diverse phenomenology; non-reciprocity is a subclass of activity in which action-reaction symmetry is also broken. These models are often grouped by the order of symmetry of their components, such as polar bird flocks or hexatic cellular tissues. However, many biological examples exist in which the components appear to have two or more symmetries simultaneously. To study this effect we introduce two independently controllable symmetries to the non-reciprocal XY model. This lattice model demonstrates wide ranging behavior dictated by the chosen symmetries. We derive a full hydrodynamic description of our lattice model that highlights the mechanisms driving its behavior. Each combination of symmetries can lead to a different hydrodynamic model with one or two simultaneous order parameters with different levels of orientational order that can appear active or not.", "url": "https://arxiv.org/abs/2610.36817", "type": "理论", "summary": "活性材料在微观尺度上失去平衡并表现出不同的现象；非互惠是行为的一个子类，其中作用-反应对称性也被打破。这些模型通常按其组成部分的对称顺序进行分组，例如极地鸟群或六边形细胞组织。然而，存在许多生物学例子，其中的成分似乎同时具有两种或多种对称性。为了研究这种效应，我们在不可逆 XY 模型中引入了两个独立可控的对称性。该晶格模型展示了由所选对称性决定的广泛行为。我们对晶格模型进行了完整的流体动力学描述，强调了驱动其行为的机制。每种对称性组合都可以产生不同的流体动力学模型，该模型具有一个或两个同时的顺序参数，具有不同级别的取向顺序，可以显示为活跃或不活跃。", "authors": [{"name": "Yuv Agarwal"}, {"name": "Ylann Rouzaire"}, {"name": "Daniel J. G. Pearce"}], "featured_authors": [{"name": "Yuv Agarwal"}, {"name": "Ylann Rouzaire"}, {"name": "Daniel J. G. Pearce"}], "author_count": 3}, {"id": "2610.36829", "category": "cond-mat", "title": "Kinetic Sectors and Nonequilibrium Dynamics in the $δ$-Ising Model", "abstract": "We introduce and analyze the $\\delta$-Ising model, a kinetic Ising ferromagnet in which single-spin flips are accepted when their energy change does not exceed a tunable threshold. Varying the field and threshold opens or closes local flip channels, dividing parameter space into kinetic sectors, each governed by a fixed Markov transition operator. We prove that the dynamics retains global spin-inversion symmetry exactly when up and down spins have equal numbers of open channels. In one such sector on a periodic chain of length $L$, unbiased random initial states therefore reach the field-aligned and antifield states with probability $1/2$ each. Closing a single channel leaves both states absorbing but makes the probability of ordering against the field decay as $(2/\\pi)^L$. Parameter sweeps correspond to ordered products of sector operators, which separate reaching a state from holding it, so hysteresis appears when a state is reached and released at different sector boundaries. We also show how increasing the system size can induce a Mpemba-like reversal, allowing a state with more misaligned spins to reach the final ordered state sooner on average. On a periodic chain, this reversal arises because the mean absorption time grows logarithmically with system size for many short domains but linearly for a single macroscopic domain, and it disappears when the bulk flip channel is opened. These findings show how a simple, intuitive rule for Ising dynamics links local kinetic constraints to field response, memory, and relaxation within a unified framework.", "url": "https://arxiv.org/abs/2610.36829", "type": "理论", "summary": "我们介绍并分析了 $\\delta$-Ising 模型，这是一种动能 Ising 铁磁体，其中当能量变化不超过可调阈值时，单自旋翻转被接受。改变场和阈值会打开或关闭局部翻转通道，将参数空间划分为动力学扇区，每个扇区都由固定的马尔可夫转移算子控制。我们证明，当向上和向下自旋具有相同数量的开放通道时，动力学精确地保留了全局自旋反转对称性。因此，在长度为 $L$ 的周期链上的一个这样的扇区中，无偏随机初始状态以每种概率 $1/2$ 达到场对齐和反场状态。关闭单个通道会使两种状态都吸收，但会使针对场衰减的排序概率为 $(2/\\pi)^L$。参数扫描对应于扇区运算符的有序乘积，它将达到状态与保持状态分开，因此当在不同扇区边界达到和释放状态时会出现滞后。我们还展示了增加系统大小如何引发类似 Mpemba 的反转，从而允许自旋更多未对准的状态平均更快地达到最终有序状态。\n\n在周期链上，出现这种反转是因为对于许多短域，平均吸收时间随系统尺寸呈对数增长，但对于单个宏观域则呈线性增长，并且当体翻转通道打开时，这种反转就会消失。这些发现表明，伊辛动力学的简单、直观规则如何在统一的框架内将局部动力学约束与场响应、记忆和松弛联系起来。", "authors": [{"name": "Dehen Cao"}, {"name": "Wei Jiang"}, {"name": "Ya Zhang"}], "featured_authors": [{"name": "Dehen Cao"}, {"name": "Wei Jiang"}, {"name": "Ya Zhang"}], "author_count": 3}, {"id": "2610.36860", "category": "cond-mat", "title": "HorizON: A Multi-Horizon Deep Operator Network for Property Prediction of Organic Battery Stacks", "abstract": "Transition-metal-based batteries rely on critical elements such as lithium, cobalt, and nickel. Their extraction creates environmental and supply-chain challenges. Organic electrode materials (OEMs) reduce this reliance and provide broad molecular tunability. However, OEM-based batteries still show limited long-term cycling stability. Their design also requires the joint optimization of coupled metrics such as voltage, specific capacity, capacity retention, and energy density. These metrics depend on the full battery stack and on the interactions among its components rather than on the active material alone. In our previous work, we developed a data-fusion multi-task framework for average discharge voltage and first-cycle specific capacity. Both targets are single-valued. Here, we extend that framework to multi-horizon prediction by predicting a property at every cycle of a discharge trajectory rather than at a single cycle. Our multi-fidelity and Multi-horizon Deep Operator Network learns DFT redox potentials and cycle-dependent specific-capacity trajectories within one model. We train it on complete battery-stack representations and usage conditions, so it learns battery-stack interactions rather than cathode-only effects. This framework supports long-term property prediction, inverse design, and process optimization for organic battery systems.", "url": "https://arxiv.org/abs/2610.36860", "type": "理论+数值", "summary": "过渡金属电池依赖锂、钴和镍等关键元素。它们的开采带来了环境和供应链挑战。有机电极材料 (OEM) 减少了这种依赖并提供了广泛的分子可调性。然而，OEM 电池的长期循环稳定性仍然有限。他们的设计还需要联合优化电压、比容量、容量保持率和能量密度等耦合指标。这些指标取决于整个电池组及其组件之间的相互作用，而不仅仅是活性材料。在我们之前的工作中，我们开发了一个用于平均放电电压和第一周期比容量的数据融合多任务框架。两个目标都是单值的。在这里，我们通过预测放电轨迹的每个周期而不是单个周期的属性，将该框架扩展到多水平预测。我们的多保真度和多视野深度算子网络可在一个模型中学习 DFT 氧化还原电位和周期相关的比容量轨迹。\n\n我们在完整的电池组表示和使用条件上对其进行训练，因此它可以学习电池组相互作用，而不是仅学习阴极效应。该框架支持有机电池系统的长期性能预测、逆向设计和工艺优化。", "authors": [{"name": "Subhash V.S. Ganti"}, {"name": "Lukas Woelfel"}, {"name": "Arla Diengdoh"}, {"name": "Tzvetan Mihaylov"}, {"name": "Thomas Nevolianis"}, {"name": "Jan Meyer"}, {"name": "Christopher Kuenneth"}], "featured_authors": [{"name": "Subhash V.S. Ganti"}, {"name": "Lukas Woelfel"}, {"name": "Arla Diengdoh"}, {"name": "Thomas Nevolianis"}, {"name": "Jan Meyer"}, {"name": "Christopher Kuenneth"}], "author_count": 7}, {"id": "2610.36904", "category": "cond-mat", "title": "Replica Analysis of Overfitting in Vector Generalized Linear Models", "abstract": "We show how the successful recent statistical physics based theory of overfitting in Generalized Linear Models (GLMs) can be generalized to a much larger family of regression models: the so-called Vector Generalized Linear Models (VGLMs), in which not a single linear combination of covariates drives the outcome, but where one has an arbitrary finite number of such linear combinations. The latter more general and complex models can describe more sophisticated statistical patterns in data, but are even more prone to overfitting than GLMs due to their significantly larger number of parameters; this often limits their use. We show that the generalization of the overfitting theory from GLMs to VGLMs causes many mathematical challenges that were absent from the earlier work, mostly related to the increased dimensional complexity of all order parameters in the theory, but that the new problem is once more solvable using the replica method. This opens up the field to many novel and welcome applications, especially in post-genome medical inference and data analysis, where overfitting is and remains a major barrier to progress. After developing the general VGLM overfitting theory, within the replica symmetric (RS) ansatz, we illustrate its merits and its correctness via application to several relevant VGLM regression models.", "url": "https://arxiv.org/abs/2610.36904", "type": "理论", "summary": "我们展示了最近成功的基于统计物理学的广义线性模型（GLM）中的过拟合理论如何推广到更大的回归模型系列：所谓的向量广义线性模型（VGLM），其中不是单个协变量的线性组合驱动结果，而是具有任意有限数量的此类线性组合。后者更通用、更复杂的模型可以描述数据中更复杂的统计模式，但由于其参数数量明显较多，因此比 GLM 更容易过度拟合；这往往限制了它们的使用。我们表明，从 GLM 到 VGLM 的过拟合理论的推广导致了早期工作中没有的许多数学挑战，主要与理论中所有阶参数的维度复杂性增加有关，但新问题可以使用复制方法再次解决。这为许多新颖且受欢迎的应用开辟了新的领域，特别是在后基因组医学推理和数据分析领域，过度拟合现在和将来仍然是进步的主要障碍。\n\n在发展了通用 VGLM 过拟合理论之后，在复制对称 (RS) 模型中，我们通过应用于几个相关的 VGLM 回归模型来说明其优点和正确性。", "authors": [{"name": "M Diaz-Ortiz Jr"}, {"name": "ACC Coolen"}], "featured_authors": [{"name": "M Diaz-Ortiz Jr"}, {"name": "ACC Coolen"}], "author_count": 2}, {"id": "2610.36974", "category": "cond-mat", "title": "Impurity-induced trimer formation across the BCS-BEC crossover", "abstract": "By means of diffusion Monte Carlo calculations, we study the behavior of a single impurity embedded in two balanced Fermi baths across the BCS-BEC crossover. The impurity interacts attractively with both baths through Pöschl-Teller potentials of different strengths. That interaction is such that does not support an impurity--bath two-body bound state. When that attraction is sufficiently strong, we observe the formation of trimers composed of the impurity and one atom from each bath. These clusters are Borromean on the BCS side, where no two-body subsystem is bound, and evolve continuously into tango-like trimers on the BEC side. Subtracting from the total energy the binding energy of one trimer and that of the remaining bath-bath dimers restores the equation of state of the impurity-free system, supporting a dilute-cluster interpretation. The analysis of interparticle distances shows that the embedded trimer is not simply a dimer dressed by the impurity, but a genuine three-body cluster formed inside the two Fermi baths.", "url": "https://arxiv.org/abs/2610.36974", "type": "理论+数值", "summary": "通过扩散蒙特卡罗计算，我们研究了跨 BCS-BEC 交叉嵌入两个平衡费米浴中的单一杂质的行为。杂质通过不同强度的 Pöschl-Teller 势与两种浴发生有吸引力的相互作用。这种相互作用不支持杂质浴二体束缚态。当这种吸引力足够强时，我们观察到由杂质和每个浴中的一个原子组成的三聚体的形成。这些簇在BCS侧是Borromean，没有二体子系统结合，并且在BEC侧不断演化成探戈样三聚体。从总能量中减去一个三聚体的结合能和剩余的浴-浴二聚体的结合能可以恢复无杂质系统的状态方程，支持稀簇解释。粒子间距离分析表明，嵌入的三聚体并非简单地被杂质修饰的二聚体，而是在两个费米浴内形成的真正的三体团簇。", "authors": [{"name": "M. C. Gordillo"}, {"name": "J. Boronat"}], "featured_authors": [{"name": "M. C. Gordillo"}, {"name": "J. Boronat"}], "author_count": 2}, {"id": "2610.37020", "category": "cond-mat", "title": "The constrained molecular dynamics (CMD) to obtain spatio-temporal memory functions of viscoelastic liquids: stability analysis of equations of motion", "abstract": "Mechanical stress is one of the main characteristics of viscoelastic molecular systems, including vitrifying liquids and amorphous solids which are known to show long-range dynamical heterogeneities. It is therefore important to deal with time- and space-resolved local stress whose correlations can be used to obtain viscoelastic memory functions of such systems, in particular, their wave-vector dependent shear and compression relaxation moduli. However, such memory functions are not directly accessible within standard molecular dynamics (MD) simulations. Here we discuss a new method called the constrained molecular dynamics (CMD) which allows for a direct evaluation of the wave-vector and time dependent viscoelastic moduli. The study is focused, in particular, on the stability analysis of different variants of the CMD, revealing the most efficient stabilization algorithm. Our theoretical predictions for the time-dependence of the most important parameters (like the wave-vector resolved mass current) during the stabilization stage are compared with the simulation data using different CMD algorithms. An excellent agreement is observed, thus confirming the validity of our theoretical approach and its ability to accurately predict the most important initial part of CMD trajectories.", "url": "https://arxiv.org/abs/2610.37020", "type": "理论+数值", "summary": "机械应力是粘弹性分子系统的主要特征之一，包括玻璃化液体和无定形固体，已知它们表现出长程动态不均匀性。因此，处理时间和空间分辨的局部应力非常重要，其相关性可用于获得此类系统的粘弹性记忆函数，特别是其波矢量相关的剪切和压缩松弛模量。然而，这种记忆功能在标准分子动力学 (MD) 模拟中无法直接访问。在这里，我们讨论一种称为约束分子动力学（CMD）的新方法，它可以直接评估波矢量和时间相关的粘弹性模量。该研究特别关注 CMD 不同变体的稳定性分析，揭示最有效的稳定算法。我们对稳定阶段最重要参数（如波矢量解析质量流）的时间依赖性的理论预测与使用不同 CMD 算法的模拟数据进行了比较。\n\n观察到了良好的一致性，从而证实了我们的理论方法的有效性及其准确预测 CMD 轨迹最重要的初始部分的能力。", "authors": [{"name": "Olivier Benzerara"}, {"name": "Jörg Baschnagel"}, {"name": "Alexander N. Semenov"}], "featured_authors": [{"name": "Olivier Benzerara"}, {"name": "Jörg Baschnagel"}, {"name": "Alexander N. Semenov"}], "author_count": 3}, {"id": "2610.37030", "category": "cond-mat", "title": "Residual dynamics determine dissipation in strongly coupled linear Langevin systems", "abstract": "Interactions shape the properties of many physical and biological nonequilibrium systems, but whether collective operation raises or lowers entropy production remains difficult to predict. Here, we show that strong coupling suppresses irreversible circulation associated with the directly coupled degrees of freedom. In identical two-dimensional systems, this suppression is monotonic for nonzero coupling modes and guarantees a monotonic decrease of the entropy production rate (EPR), with the corresponding probability currents vanishing in the strong-coupling limit. In higher dimensions, suppressing the circulation associated with the coupled degrees of freedom does not generally eliminate all irreversible circulation, since the remaining degrees of freedom can still sustain nonequilibrium currents. The EPR of these residual dynamics sets the strong-coupling limit, providing a criterion for whether a given choice of coupled variables leads to lower dissipation than the uncoupled system. The approach to this limit depends on how the finite-coupling current correction aligns with the residual current. Further, we show that convergence to residual dynamics in the strong-coupling limit also applies to coupled non-identical systems. Finally, we demonstrate the predicted EPR reduction in nonlinear models of vertebrate hair-cell bundles and bacterial chemotaxis.", "url": "https://arxiv.org/abs/2610.37030", "type": "理论", "summary": "相互作用塑造了许多物理和生物非平衡系统的特性，但集体操作是否会提高或降低熵产生仍然很难预测。在这里，我们证明强耦合抑制与直接耦合自由度相关的不可逆循环。在相同的二维系统中，这种抑制对于非零耦合模式是单调的，并保证熵产生率（EPR）单调下降，相应的概率流在强耦合极限内消失。在更高维度中，抑制与耦合自由度相关的环流通常不会消除所有不可逆环流，因为剩余的自由度仍然可以维持非平衡电流。这些残余动力学的 EPR 设置了强耦合极限，为耦合变量的给定选择是否导致比非耦合系统更低的耗散提供了标准。达到此限制的方法取决于有限耦合电流校正如何与剩余电流保持一致。\n\n此外，我们表明，在强耦合极限下收敛到剩余动力学也适用于耦合的非同一系统。最后，我们证明了脊椎动物毛细胞束和细菌趋化性非线性模型中预测的 EPR 减少。", "authors": [{"name": "Vansh Kharbanda"}, {"name": "Anton F. Burnet"}, {"name": "Benedikt Sabass"}], "featured_authors": [{"name": "Vansh Kharbanda"}, {"name": "Anton F. Burnet"}, {"name": "Benedikt Sabass"}], "author_count": 3}, {"id": "2610.37076", "category": "cond-mat", "title": "Perimeter shell properties of branched polymer adsorbents in various conformational states", "abstract": "The structural accessibility and perimeter shell properties of branched macromolecules are studied using Monte Carlo simulations on a simple cubic lattice. Constituent polymer chains of these macromolecules are constructed in an algorithmic way as: a set of collinear monomers; a self-avoiding walk (SAW); tigthly packed monomers. These mimic the ground states for a rigid rod, flexible chain, and collapsed chain conformational states, respectively. We analyzed the set of observables that are related to adsorption, such as perimeter shell size (number of available sites for particle adsorption) per monomer $\\langle \\bar{n}_a \\rangle$, mean coordination number of perimeter shell $\\langle n_{\\rm bond} \\rangle$ (average number of contacts per adsorbed particle), and coordination accessibility per monomer $\\langle \\bar{n}_s \\rangle$. Our results demonstrate that branching reduces the perimeter shell size while it increases mean coordination number of perimeter shell across all conformational states, due to higher local monomer density near branching cores and formation of shared adsorption sites or microcages. Stiff extended structures yield the highest values for $\\langle \\bar{n}_a \\rangle$ (approaching $4$ in the limit of long chains), whereas the flexible ones provide the largest values for $\\langle n_{\\rm bond} \\rangle$. We can note that the collinearity of monomers in constituent chains works in the same direction as reduction of branching ($\\langle \\bar{n}_a \\rangle$ grows), whereas the { tight packing of them} -- in the same direction as the increase of branching ($\\langle \\bar{n}_a \\rangle$ decreases)", "url": "https://arxiv.org/abs/2610.37076", "type": "理论+数值", "summary": "使用简单立方晶格的蒙特卡罗模拟研究了支化大分子的结构可及性和周边壳特性。这些大分子的组成聚合物链以算法方式构建为：一组共线单体；自我回避行走（SAW）；紧密堆积的单体。它们分别模拟刚性杆、柔性链和折叠链构象状态的基态。我们分析了与吸附相关的一组可观察量，例如每个单体 $\\langle \\bar{n}_a \\rangle$ 的周界壳尺寸（颗粒吸附的可用位点数量）、周界壳的平均配位数 $\\langle n_{\\rm bond} \\rangle$（每个吸附颗粒的平均接触数）以及每个单体 $\\langle \\bar{n}_s \\rangle$ 的配位可达性。我们的结果表明，由于分支核心附近局部单体密度较高以及共享吸附位点或微笼的形成，支化减少了周边壳的尺寸，同时增加了所有构象状态下周边壳的平均配位数。\n\n刚性扩展结构产生 $\\langle \\bar{n}_a \\rangle$ 的最高值（在长链的限制下接近 $4$），而柔性结构则提供 $\\langle n_{\\rm bond} \\rangle$ 的最大值。我们可以注意到，组成链中单体的共线性与支化减少（$\\langle \\bar{n}_a \\rangle$ 增长）的方向相同，而{紧密堆积} - 与支化增加的方向相同（$\\langle \\bar{n}_a \\rangle$ 减少）", "authors": [{"name": "Viktoria Blavatska"}, {"name": "Jaroslav Ilnytskyi"}], "featured_authors": [{"name": "Viktoria Blavatska"}, {"name": "Jaroslav Ilnytskyi"}], "author_count": 2}, {"id": "2610.37090", "category": "cond-mat", "title": "Transport statistics in asymmetric coupled chaotic dots in series: Brownian motion model", "abstract": "We study statistics of transport properties in a system of two quantum chaotic cavities coupled in series through a tunable junction and connected to reservoirs with asymmetric leads. Within the random matrix theory framework and in the absence of time-reversal symmetry, the scattering matrix S undergoes a crossover from two independent circular unitary ensembles to a single CUE as the inter-cavity coupling increases. Modeling this crossover using Dyson's Brownian motion approach, with the junction width acting as a time-like parameter, we derive closed-form expressions for the time-dependent averages and variances of conductance and shot noise power for arbitrary lead asymmetry. These analytical results reduce to known expressions in the symmetric and fully coupled limits. The mapping between the Brownian time parameter and the physical junction width is found to be observable-dependent, reflecting the different eigenfunction correlations probed by conductance and shot noise power, and this dependence is examined and separately calibrated for each observable. Validating against random-matrix simulations and tight-binding transport calculations using Kwant, we find quantitative agreement for ensemble-averaged observables throughout the crossover, while variances, being more sensitive to microscopic fluctuations, show deviations from the Brownian-motion predictions.", "url": "https://arxiv.org/abs/2610.37090", "type": "理论+数值", "summary": "我们研究了两个量子混沌腔系统中输运特性的统计数据，这两个量子混沌腔通过可调谐结串联耦合，并通过不对称引线连接到储层。在随机矩阵理论框架内，在不存在时间反转对称性的情况下，随着腔间耦合的增加，散射矩阵 S 会经历从两个独立的圆形酉系综到单个 CUE 的交叉。使用戴森的布朗运动方法对这种交叉进行建模，并将结宽度作为类时间参数，我们得出了任意导联不对称性的电导和散粒噪声功率的时间相关平均值和方差的封闭式表达式。这些分析结果简化为对称和完全耦合极限下的已知表达式。布朗时间参数和物理结宽度之间的映射被发现与可观测值相关，反映了电导和散粒噪声功率探测的不同本征函数相关性，并且针对每个可观测值检查和单独校准这种依赖性。\n\n使用 Kwant 验证随机矩阵模拟和紧束缚输运计算，我们发现整个交叉过程中集合平均可观测值的定量一致性，而方差对微观波动更敏感，显示出与布朗运动预测的偏差。", "authors": [{"name": "Ashutosh Dheer"}, {"name": "Santosh Kumar"}, {"name": "Jayendra N. Bandyopadhyay"}], "featured_authors": [{"name": "Ashutosh Dheer"}, {"name": "Santosh Kumar"}, {"name": "Jayendra N. Bandyopadhyay"}], "author_count": 3}, {"id": "2610.37129", "category": "cond-mat", "title": "Langevin dynamics towards Generalized Gibbs Ensembles", "abstract": "In recent years, statistical physics tools have been used to study the dynamics of macroscopic quantum and classical integrable models. These studies have shown that, in the thermodynamic limit, long term time-averages of local observables equal statistical averages calculated with a Generalized Gibbs Ensemble (GGE). In the latter, the weight in phase space involves all constants of motion multiplied by Lagrange multipliers which are fixed by their initial values. We argue that the GGE can be interpreted as a proper Boltzmann measure of a different (non-standard) mechanical model. This measure can therefore be sampled with stochastic methods implemented, for example, as a Langevin process. We tailor the deterministic force in the Langevin equations so that at long times the stochastic trajectories sample the desired measure. We use the integrable Neumann Model -- the model of a classical particle constrained to move on a sphere under anisotropic harmonic potentials -- as a benchmark. We test the method in a setup where the Lagrange multipliers are fixed by the GGE governing the asymptotic dynamics of the isolated Neumann model following a quench. This problem has different phases depending on the initial conditions and quench protocol and, in all cases, with the stochastic evolution of an adequately tuned Langevin process we reproduce the asymptotic values of relevant observables.", "url": "https://arxiv.org/abs/2610.37129", "type": "理论", "summary": "近年来，统计物理工具已被用于研究宏观量子和经典可积模型的动力学。这些研究表明，在热力学极限下，局部可观测值的长期时间平均值等于使用广义吉布斯系综 (GGE) 计算的统计平均值。在后者中，相空间中的权重涉及所有运动常数乘以拉格朗日乘子，拉格朗日乘子由其初始值固定。我们认为 GGE 可以解释为不同（非标准）力学模型的正确玻尔兹曼测量。因此，可以使用实施的随机方法（例如作为朗之万过程）对该测量进行采样。我们调整朗之万方程中的确定性力，以便在很长一段时间内随机轨迹对所需的测量进行采样。我们使用可积诺依曼模型（经典粒子在各向异性谐波势下被约束在球体上移动的模型）作为基准。我们在一个设置中测试了该方法，其中拉格朗日乘子由 GGE 固定，控制失超后孤立诺伊曼模型的渐近动力学。\n\n该问题具有不同的阶段，具体取决于初始条件和淬灭协议，并且在所有情况下，通过充分调整的朗之万过程的随机演化，我们重现了相关可观测值的渐近值。", "authors": [{"name": "Rafael González-Albaladejo"}, {"name": "Leticia F. Cugliandolo"}, {"name": "Gustavo S. Lozano"}, {"name": "Daniel A. Stariolo"}], "featured_authors": [{"name": "Rafael González-Albaladejo"}, {"name": "Leticia F. Cugliandolo"}, {"name": "Gustavo S. Lozano"}, {"name": "Daniel A. Stariolo"}], "author_count": 4}, {"id": "2610.37193", "category": "cond-mat", "title": "Phase Separation in a Mixture System of Active and Passive Particles", "abstract": "We carried out molecular dynamics simulations of a mixture of self-propelled particles (SPPs) and passive particles. When the self-propulsion speed was sufficiently high, the system separated into two phases. One phase consists of ordered passive particles, and the other is a disordered mixture of both particle types. The separation arises from the interplay between the self-propelled motion of SPPs and thermal motion of the passive particles, since phase separation does not appear with either particle type alone. As the self-propulsion speed increases, the SPPs push surrounding particles away, effectively increasing their excluded size. As a result, the increase in the effective excluded sizes promotes the accumulation of passive particles and the segregation of SPPs into the dilute phase through a mechanism analogous to the depletion interaction. This mechanism explains the phase separation observed in the present study. Our findings provide insights into the potential applications of SPPs and contribute to our understanding of natural systems composed of elements with different levels of motility.", "url": "https://arxiv.org/abs/2610.37193", "type": "数值", "summary": "我们对自推进粒子（SPP）和被动粒子的混合物进行了分子动力学模拟。当自航速度足够高时，系统分为两个阶段。一相由有序的被动粒子组成，另一相是两种粒子类型的无序混合物。这种分离是由表面等离子体激元的自推进运动和被动粒子的热运动之间的相互作用引起的，因为单独的任何一种粒子类型都不会出现相分离。随着自航速度的增加，表面等离子体激元将周围的颗粒推开，有效地增加了它们排除的尺寸。因此，有效排除尺寸的增加促进了被动粒子的积累，并通过类似于耗尽相互作用的机制将 SPP 分离到稀相中。这种机制解释了本研究中观察到的相分离。我们的研究结果提供了对SPP潜在应用的见解，并有助于我们理解由具有不同运动水平的元素组成的自然系统。", "authors": [{"name": "Reo Arakaki"}, {"name": "Tetsuya Hiraiwa"}, {"name": "Ryo Akiyama"}], "featured_authors": [{"name": "Reo Arakaki"}, {"name": "Tetsuya Hiraiwa"}, {"name": "Ryo Akiyama"}], "author_count": 3}, {"id": "2610.37222", "category": "cond-mat", "title": "Magnetic crystal generation with site-resolved magnetic moments via Gaussian-mixture retargeting and finite-budget yield prediction", "abstract": "We introduce GMMag, a workflow for generating crystal structures together with their site-resolved magnetic moments, built on a conditional variational autoencoder with a graph neural network encoder and a transformer decoder. Gaussian-mixture sampling redirects generation towards selected chemical and magnetic targets without retraining. We systematically investigate how encoder and decoder design, the representation of magnetic-moment magnitudes and relative signs, and sampling choices affect reconstruction, generation quality and diversity. Because a higher screening pass rate does not necessarily yield more qualifying candidates with distinct chemical formulas absent from the reference dataset, we model how repeated generation of the same chemical formulas limits their accumulation and test the model in two separate ten-million-draw runs. As an application, the workflow identifies Nd-containing candidates with chemical formulas absent from the reference dataset, negative formation energies and high estimated saturation magnetization.", "url": "https://arxiv.org/abs/2610.37222", "type": "理论+数值", "summary": "我们介绍 GMMag，这是一种用于生成晶体结构及其位点解析磁矩的工作流程，构建在带有图神经网络编码器和变压器解码器的条件变分自动编码器上。高斯混合采样将生成重定向到选定的化学和磁性目标，而无需重新训练。我们系统地研究编码器和解码器设计、磁矩幅度和相关符号的表示以及采样选择如何影响重建、生成质量和多样性。由于较高的筛选通过率并不一定会产生更多具有参考数据集中不存在的不同化学式的合格候选者，因此我们模拟了相同化学式的重复生成如何限制其积累，并在两次单独的一千万次抽检运行中测试该模型。作为一种应用，该工作流程可识别参考数据集中不存在的化学式、负形成能和高估计饱和磁化强度的含 Nd 候选物。", "authors": [{"name": "Wen-Chuang Shang"}, {"name": "Chenyu Shen"}, {"name": "Mikito Tsujimoto"}, {"name": "Tomonori Tanaka"}, {"name": "Yoshihiro Gohda"}], "featured_authors": [{"name": "Wen-Chuang Shang"}, {"name": "Chenyu Shen"}, {"name": "Mikito Tsujimoto"}, {"name": "Tomonori Tanaka"}, {"name": "Yoshihiro Gohda"}], "author_count": 5}, {"id": "2610.37294", "category": "cond-mat", "title": "Magnetic structures in a model nickelate: Monte Carlo study", "abstract": "Within the framework of the classical Monte Carlo method with kinematic account of constant bosons concentration a model nickelate was studied, its magnetic structures for various values of exchange integrals considering up to third-nearest neighbours were determined.", "url": "https://arxiv.org/abs/2610.37294", "type": "理论+数值", "summary": "在具有恒定玻色子浓度的运动学解释的经典蒙特卡罗方法的框架内，研究了镍酸盐模型，并确定了考虑到第三近邻的不同交换积分值的磁结构。", "authors": [{"name": "V. S. Ryumshin"}, {"name": "Yu. D. Panov"}, {"name": "A. S. Moskvin"}], "featured_authors": [{"name": "V. S. Ryumshin"}, {"name": "Yu. D. Panov"}, {"name": "A. S. Moskvin"}], "author_count": 3}, {"id": "2610.37301", "category": "cond-mat", "title": "Hydrodynamic fluctuations in Luttinger liquids", "abstract": "We develop the theory of hydrodynamic fluctuations for one-dimensional quantum liquids. At low temperatures the relaxation of interacting electrons in a single-channel wire separates into two classes: equilibration, which changes the numbers of right and left movers through backscattering and is exponentially slow, and thermalization, which redistributes energy and momentum at a fixed number of movers at a power-law rate. This separation of time scales gives the electron liquid a two-fluid description analogous to superfluid $^4$He, with the zero mode of the Luttinger liquid as the superfluid component and the gas of thermal excitations as the normal component. Using Onsager reciprocity and the fluctuation-dissipation theorem, we add Langevin fluxes to the two-fluid hydrodynamic equations, including a mutual-friction noise generated by rare backscattering events that has no counterpart in helium. We apply the theory to Coulomb-coupled quantum wires and calculate the dynamic structure factors, which contain a second-sound peak next to the plasmon doublet; the Coulomb drag resistivity, where intrawire equilibration acts as a bottleneck and turns the hydrodynamic drag into an activated temperature dependence; and the near-field heat transfer between the wires. Mode frequencies, spectral weights, linewidths, and the crossover scales of the transport coefficients are expressed through the thermodynamic properties of the liquid and a few dissipative coefficients, providing spectroscopic and transport probes of two-fluid behavior in one-dimensional quantum systems.", "url": "https://arxiv.org/abs/2610.37301", "type": "理论", "summary": "我们发展了一维量子液体的流体动力学涨落理论。在低温下，单通道导线中相互作用的电子的弛豫分为两类：平衡，通过反向散射改变左右动子的数量，速度呈指数缓慢；热化，以幂律速率在固定数量的动子处重新分配能量和动量。这种时间尺度的分离使电子液体具有类似于超流体 $^4$He 的双流体描述，其中路廷格液体的零模式作为超流体成分，热激发气体作为法向成分。利用 Onsager 互易性和涨落耗散定理，我们将 Langevin 通量添加到二流体流体动力学方程中，包括由罕见的反向散射事件产生的相互摩擦噪声，而氦气中没有对应的噪声。\n\n我们将该理论应用于库仑耦合量子线并计算动态结构因子，其中包含紧邻等离激元双峰的第二声峰；库仑阻力系数，其中线内平衡充当瓶颈，并将流体动力阻力转变为激活的温度依赖性；以及电线之间的近场热传递。模式频率、光谱权重、线宽和传输系数的交叉尺度通过液体的热力学性质和一些耗散系数来表达，提供一维量子系统中两种流体行为的光谱和传输探针。", "authors": [{"name": "Alex Levchenko"}], "featured_authors": [{"name": "Alex Levchenko"}], "author_count": 1}, {"id": "2610.37367", "category": "cond-mat", "title": "Unconventional SOC-activated Altermagnetic Spin Splitting and Half-Angle Locking of Spin Transport", "abstract": "Conventional altermagnetic spin splitting arises from staggered exchange and sublattice-dependent anisotropic hopping without requiring spin-orbit coupling (SOC). Here we derive a low-energy effective model showing that SOC and staggered exchange can jointly activate additional spin splitting on momentum planes where the nonrelativistic contribution vanishes. In hexagonal $\\alpha$-MnTe, this SOC-activated contribution produces d-wave spin splitting near $\\Gamma$ with out-of-plane spin polarization. Its leading angular pattern counter-rotates by half the in-plane Néel-vector rotation angle. First-principles spin-transport calculations reveal a corresponding approximate half-angle locking between the Néel-vector orientation and the electric-field directions maximizing the signed longitudinal and transverse spin conductivities. Analytical transport calculations based on the effective model trace this locking to the same angular coupling between momentum and the Néel vector that governs the spin-splitting pattern. Our findings connect the microscopic mechanism of SOC-activated altermagnetic spin splitting to directional spin transport, providing a theoretical basis for probing Néel-vector orientation and controlling spin-current generation.", "url": "https://arxiv.org/abs/2610.37367", "type": "理论+数值", "summary": "传统的交变磁自旋分裂是由交错交换和亚晶格相关的各向异性跳跃产生的，不需要自旋轨道耦合（SOC）。在这里，我们推导出一个低能有效模型，表明 SOC 和交错交换可以共同激活动量平面上的额外自旋分裂，其中非相对论贡献消失。在六方 $\\alpha$-MnTe 中，这种 SOC 激活的贡献在 $\\Gamma$ 附近产生具有面外自旋极化的 d 波自旋分裂。其前导角图案反向旋转面内尼尔矢量旋转角的一半。第一原理自旋输运计算揭示了尼尔矢量方向和电场方向之间相应的近似半角锁定，从而最大化了带符号的纵向和横向自旋电导率。基于有效模型的分析输运计算将这种锁定追溯到动量和控制自旋分裂模式的尼尔矢量之间的相同角度耦合。\n\n我们的研究结果将 SOC 激活的交磁自旋分裂的微观机制与定向自旋输运联系起来，为探测尼尔矢量方向和控制自旋电流的产生提供了理论基础。", "authors": [{"name": "Weiwei Chen"}, {"name": "Ziyu Zhou"}, {"name": "Pan Gao"}, {"name": "Yanan Pan"}, {"name": "Zhongjun Li"}, {"name": "Ye Yang"}, {"name": "Jianhui Zhou"}, {"name": "Rui Wang"}], "featured_authors": [{"name": "Weiwei Chen"}, {"name": "Ziyu Zhou"}, {"name": "Pan Gao"}, {"name": "Ye Yang"}, {"name": "Jianhui Zhou"}, {"name": "Rui Wang"}], "author_count": 8}, {"id": "2610.37426", "category": "cond-mat", "title": "Chaos picture of spin glasses", "abstract": "The chaos picture is a novel, coherent, and intuitive theoretical framework for spin glasses, reconciling the 40-year-old droplet vs. replica symmetry breaking debate. First, we argue the formation of a hierarchical energy landscape by pinning and dynamic filtering of random droplets. As the temperature decreases, the chaos picture describes a progressive freezing of scale-dependent droplets in real space, which mirrors a hierarchical free energy landscape fracturing process in phase space. This bifurcation process is accompanied by temperature chaos, leading to dynamic pure state coexistence without violating the droplet scaling. Crucially, the interface geometry is not critical to these mechanisms, naturally incorporating the interface crossover from planar, fractal, to space-filling as the dimensionality increases, in line with the mean-field limit. Finally, the chaos picture provides profound insights into spin-glass dynamics such as aging, rejuvenation, and memory effect, while offering a streamlined reinterpretation of the complex metastate framework.", "url": "https://arxiv.org/abs/2610.37426", "type": "理论", "summary": "混沌图景是自旋玻璃的新颖、连贯且直观的理论框架，调和了 40 年来液滴与复制品对称性破缺的争论。首先，我们认为通过随机液滴的钉扎和动态过滤形成分层能量景观。随着温度降低，混沌图描述了真实空间中与尺度相关的液滴的逐渐冻结，这反映了相空间中的分层自由能景观破裂过程。这种分叉过程伴随着温度混沌，导致动态纯态共存而不破坏液滴缩放。至关重要的是，界面几何形状对这些机制并不重要，随着维数的增加，自然地结合了从平面、分形到空间填充的界面交叉，与平均场极限一致。最后，混沌图像提供了对衰老、再生和记忆效应等自旋玻璃动力学的深刻见解，同时提供了对复杂转移框架的简化重新解释。", "authors": [{"name": "Wenlong Wang"}], "featured_authors": [{"name": "Wenlong Wang"}], "author_count": 1}, {"id": "2610.37489", "category": "cond-mat", "title": "Molecular shape controls dipolar correlations in polar liquids", "abstract": "The dielectric constant of polar liquids depends not only on the magnitude of the molecular dipole moment but also on short range orientational correlations between neighboring dipoles. How molecular structure determines these correlations, quantified by the Kirkwood correlation factor $g_\\mathrm{K}$, remains unclear. Using molecular dynamics simulations of model polar liquids without hydrogen bonding, we show that molecular shape plays a central role. We interpret $g_\\mathrm{K}$ as resulting from the combination of dipolar interactions and steric effects, which together favor either alignment or antialignment of neighboring molecules. Depending on molecular shape, $g_\\mathrm{K}$ can either increases or decreases upon cooling, or change monotony. A minimal model of dipoles on a cubic lattice reproduces these three regimes and attributes the nonmonotonic case to a competition between the first layer of neighbors, which favors alignment, and the second layer, which favors antialignment.", "url": "https://arxiv.org/abs/2610.37489", "type": "理论+数值", "summary": "极性液体的介电常数不仅取决于分子偶极矩的大小，还取决于相邻偶极子之间的短程取向相关性。分子结构如何决定这些相关性（通过柯克伍德相关因子 $g_\\mathrm{K}$ 进行量化）仍不清楚。通过对没有氢键的极性液体模型进行分子动力学模拟，我们表明分子形状起着核心作用。我们将 $g_\\mathrm{K}$ 解释为偶极相互作用和空间效应相结合的结果，它们共同有利于相邻分子的对齐或反对齐。根据分子形状，$g_\\mathrm{K}$ 可以在冷却时增加或减少，或者改变单调性。立方晶格上偶极子的最小模型再现了这三种状态，并将非单调情况归因于第一层邻居（有利于对齐）和第二层邻居（有利于反对齐）之间的竞争。", "authors": [{"name": "Marceau Hénot"}], "featured_authors": [{"name": "Marceau Hénot"}], "author_count": 1}, {"id": "2610.37505", "category": "cond-mat", "title": "New Developments in Diagrammatic Monte Carlo for Interacting Lattice Fermions: Efficient Algorithms and Applications", "abstract": "This thesis develops diagrammatic methods for thermodynamic and subsystem quantities of interacting lattice fermions, providing reference calculations for quantum simulators and many-body approximations. I formulate an inverse-flavour expansion about a self-consistent Hartree saddle, enumerate non-Gaussian diagrams, and use a discrete Lehmann representation to integrate selected internal vertices analytically. Density results cover 31 state points of the six-flavour Hubbard model on a $70\\times70$ lattice at $T/t=0.15$. I generalize combinatorial summation to flavour-dependent propagators and expansion shifts. CoS++ combines partial contractions to obtain connected sums for interaction subsets. A determinant-polynomial sieve evaluates the same sums through local coefficient filters; at ninth order it is 24--25 times faster than the specified CoS baselines in three-flavour dense-random-matrix benchmarks. Thermodynamic applications include a 2048-site honeycomb lattice and a three-flavour square lattice with 1024 sites. For the second Renyi entropy, I derive a fermionic replica path integral and a stable evaluation of its two-time Green functions. The connected-determinant calculation reaches tenth order on a $3\\times3$ cluster and ninth order on larger lattices. On $50\\times50$ sites at $(U/t,\\mu/t,\\beta t)=(3,1,8)$, the ninth-order continuation at shift $\\alpha=1.3$ gives $S_2/N_s=0.06695$ with propagated Monte Carlo uncertainty $3.0\\times10^{-5}$. Comparing two expansion shifts at their respective retained orders gives an endpoint difference of $2.6\\times10^{-4}$.", "url": "https://arxiv.org/abs/2610.37505", "type": "理论+数值", "summary": "本论文开发了相互作用晶格费米子的热力学和子系统量的图解方法，为量子模拟器和多体近似提供参考计算。我制定了关于自洽哈特里鞍的逆风味展开，枚举非高斯图，并使用离散莱曼表示来分析整合选定的内部顶点。密度结果涵盖了 $70\\times70$ 格子上 $T/t=0.15$ 的六味 Hubbard 模型的 31 个状态点。我将组合求和概括为依赖于味道的传播器和扩展移位。 CoS++ 结合部分收缩以获得交互子集的连通和。行列式多项式筛通过局部系数滤波器评估相同的总和；在九阶时，它比三重随机矩阵基准测试中指定的 CoS 基准快 24--25 倍。热力学应用包括 2048 个位点的蜂窝晶格和具有 1024 个位点的三味方形晶格。对于第二个 Renyi 熵，我导出了费米子复制路径积分及其两次格林函数的稳定评估。\n\n连接行列式计算在 $3\\times3$ 簇上达到十阶，在较大晶格上达到九阶。在 $(U/t,\\mu/t,\\beta t)=(3,1,8)$ 处的 $50\\times50$ 站点上，移位 $\\alpha=1.3$ 处的九阶延拓给出 $S_2/N_s=0.06695$，传播蒙特卡罗不确定性 $3.0\\times10^{-5}$。比较两个扩展移位在各自保留阶上的端点差异为 $2.6\\times10^{-4}$。", "authors": [{"name": "Boyuan Shi"}], "featured_authors": [{"name": "Boyuan Shi"}], "author_count": 1}, {"id": "2610.37562", "category": "cond-mat", "title": "Activation force dependence of the fluidization transition in supercooled active water", "abstract": "Using an activation model reproducing facilitation mechanisms, we found recently a fluidization transition in supercooled water triggered by the motion of a few active molecules. We investigate here the effect of the activation force on the transition. The activation force increases the probability for active molecules to overcome the energy barrier induced by caging. The induced molecular motions result in an intermittent loose structure leading to a decrease of energy barriers around the moving molecule, thus facilitating the motion of nearby molecules. Therefore we expect the force, if small enough, to increase the facilitation mechanism, and as a result cooperative motions induced by it. As a result the activation force permits to tune facilitation and cooperative motions in active glass-formers. We find an optimum force for cooperative motions that we evaluate to be around 3.5pN, a value in the range of protein motor forces. As expected for a phase transition we observe peaks of cooperative motions (dynamic heterogeneity) on the transition. This result shows that dynamical heterogeneity are the cooperative motions of physical importance for the transition.", "url": "https://arxiv.org/abs/2610.37562", "type": "理论+数值", "summary": "使用激活模型再现促进机制，我们最近发现过冷水中的流化转变是由一些活性分子的运动触发的。我们在这里研究激活力对转变的影响。激活力增加了活性分子克服笼蔽引起的能垒的可能性。诱导的分子运动导致间歇性松散结构，导致运动分子周围的能垒减少，从而促进附近分子的运动。因此，我们预计，如果力足够小，就会增加促进机制，从而增加由它引起的协作运动。因此，激活力可以调节活性玻璃形成者的促进和协作运动。我们发现协作运动的最佳力约为 3.5pN，这是蛋白质运动力范围内的值。正如相变所预期的那样，我们观察到相变时协作运动的峰值（动态异质性）。该结果表明，动态异质性是对转变具有物理重要性的协作运动。", "authors": [{"name": "Quoc Tuan Truong"}, {"name": "Victor Teboul"}], "featured_authors": [{"name": "Quoc Tuan Truong"}, {"name": "Victor Teboul"}], "author_count": 2}, {"id": "2610.37569", "category": "cond-mat", "title": "Quantum critical scaling in convective active matter", "abstract": "We construct a minimal field theory for critical quantum active matter, describing a nonconserved scalar order parameter with Landau-Ginzburg ordering and self-advection. When diffusive noise dominates, higher-order quantum vertices and non-Gaussian noise fluctuations remain relevant alongside the deterministic nonlinearities, with an upper critical dimension $d_c=2$. A one-loop renormalization-group analysis in $d=2-\\epsilon$ reveals a purely dissipative fixed point, where nonlinear noise suppresses convection, and a quantum convective saddle, where interactions, convection, and non-Gaussian noise coexist. We determine the critical exponents, show that the convective regime is distinct from conventional Burgers hydrodynamics, and discuss how it could govern transient universal scaling in microscopic models of quantum active matter before a crossover to semi-classical dynamics.", "url": "https://arxiv.org/abs/2610.37569", "type": "理论", "summary": "我们构建了临界量子活性物质的最小场论，描述了具有朗道-金兹堡有序和自平流的非守恒标量有序参数。当扩散噪声占主导地位时，高阶量子顶点和非高斯噪声涨落与确定性非线性保持相关，且上临界尺寸 $d_c=2$。 $d=2-\\epsilon$ 中的单循环重正化群分析揭示了一个纯粹耗散的不动点（其中非线性噪声抑制对流）和一个量子对流鞍（其中相互作用、对流和非高斯噪声共存）。我们确定了临界指数，表明对流状态与传统的伯格斯流体动力学不同，并讨论了在交叉到半经典动力学之前它如何控制量子活性物质微观模型中的瞬态普遍标度。", "authors": [{"name": "Jamir Marino"}], "featured_authors": [{"name": "Jamir Marino"}], "author_count": 1}, {"id": "2610.37586", "category": "cond-mat", "title": "On-the-fly Estimation of Quantum-Corrected Thermodynamics in LAMMPS", "abstract": "We present a native implementation of the Two/Three-Phase Thermodynamics (xPT, $x \\in \\{2,3\\}$) method within the LAMMPS molecular dynamics framework, termed FixXPT. xPT is an approach for obtaining absolute, quantum-corrected thermodynamics (entropy, enthalpy, free energy, heat capacity, diffusivity) from the density of states function, obtained from the velocity autocorrelation function of an equilibrium trajectory. FixXPT addresses non-trivial integration challenges, including atom reordering, compute scheduling, FFT backends, unit systems, and partitioning of atomic velocities into molecular modes. Two autocorrelators are provided: a Wiener-Khinchin FFT correlator with one cumulative window-end operation, and an in-line multi-tau correlator whose memory footprint grows only logarithmically with the window length, removing the principal scaling bottleneck for long analysis windows. The velocity history of each window is distributed across the MPI ranks, so the memory the fix adds to a node stays nearly constant as ranks are added and its cost falls with the number of GPUs. Replaying identical velocity frames through FixXPT and the stand-alone pyxPT post-processor reproduces every thermodynamic observable of well-sampled groups to within 0.1 to 0.5% across the full analysis-mode matrix; sparsely populated ionic species agree within their statistical uncertainty, and the multi-tau VACF converges monotonically to the FFT result as its buffer grows, from 0.8% to 0.1% drift across a 16-fold buffer sweep. The code is distributed as a drop-in LAMMPS package.", "url": "https://arxiv.org/abs/2610.37586", "type": "数值", "summary": "我们在 LAMMPS 分子动力学框架内提出了两相/三相热力学 (xPT, $x \\in \\{2,3\\}$) 方法的本机实现，称为 FixXPT。 xPT 是一种从状态密度函数获得绝对量子校正热力学（熵、焓、自由能、热容、扩散率）的方法，状态密度函数是从平衡轨迹的速度自相关函数获得的。 FixXPT 解决了重要的集成挑战，包括原子重新排序、计算调度、FFT 后端、单位系统以及将原子速度划分为分子模式。提供了两个自相关器：一个具有一次累积窗口结束操作的 Wiener-Khinchin FFT 相关器，以及一个内联 multi-tau 相关器，其内存占用仅随窗口长度呈对数增长，从而消除了长分析窗口的主要缩放瓶颈。每个窗口的速度历史分布在 MPI 等级上，因此修复添加到节点的内存在等级增加时几乎保持不变，并且其成本随着 GPU 数量的增加而下降。\n\n通过 FixXPT 和独立的 pyxPT 后处理器重放相同的速度帧，可以在整个分析模式矩阵中再现良好采样组的每个热力学可观测值，误差范围在 0.1% 到 0.5% 以内；稀疏的离子种类在其统计不确定性范围内一致，并且随着缓冲区的增长，多 tau VACF 单调收敛到 FFT 结果，在 16 倍缓冲区扫描中从 0.8% 漂移到 0.1%。该代码作为嵌入式 LAMMPS 包分发。", "authors": [{"name": "Robert Ramji"}, {"name": "Ilya Mazalov"}, {"name": "Ricardo Buarque"}, {"name": "Alexandria Do"}, {"name": "Xiaoxu Ruan"}, {"name": "Tod A. Pascal"}], "featured_authors": [{"name": "Robert Ramji"}, {"name": "Ilya Mazalov"}, {"name": "Ricardo Buarque"}, {"name": "Alexandria Do"}, {"name": "Xiaoxu Ruan"}, {"name": "Tod A. Pascal"}], "author_count": 6}, {"id": "2610.36024", "category": "hep-th", "title": "The Art of Orbifolding by Huge Non-Abelian Groups", "abstract": "We compute torus partition functions of orbifolds of two-dimensional chiral fermions by huge non-Abelian groups involving the Conway group, one of the sporadic finite simple groups. This seemingly standard problem turns out to contain, somewhat unexpectedly, multiple major issues hitherto unresolved, both at the level of the principle and at the level of practice. We describe in detail how they can be overcome. Although the methods described in this paper are generally applicable, the choice of the particular orbifolds we consider in this paper was motivated by the search for the periodicity element of topological modular forms. We will provide a brief introduction to this question, to explain why all the techniques in this paper had to be developed. Unfortunately, the orbifolds we considered turned out not to be the periodicity element.", "url": "https://arxiv.org/abs/2610.36024", "type": "理论", "summary": "我们通过涉及康威群（零星有限单群之一）的巨大非阿贝尔群来计算二维手性费米子轨道折叠的环面配分函数。这个看似标准的问题，令人有些出乎意料的是，在原则层面和实践层面上都包含了迄今为止尚未解决的多个重大问题。我们详细描述了如何克服它们。尽管本文描述的方法普遍适用，但我们在本文中考虑的特定轨道折叠的选择是出于对拓扑模形式的周期性元素的搜索。我们将对这个问题进行简要介绍，以解释为什么必须开发本文中的所有技术。不幸的是，我们考虑的轨道折叠结果并不是周期性元素。", "authors": [{"name": "Jan Albert"}, {"name": "Masaki Okada"}, {"name": "Yuji Tachikawa"}], "featured_authors": [{"name": "Jan Albert"}, {"name": "Masaki Okada"}, {"name": "Yuji Tachikawa"}], "author_count": 3}, {"id": "2610.36025", "category": "hep-th", "title": "Instanton Structure from 325-Loop 3D $ϕ^3$ Perturbation Theory", "abstract": "The high order behavior of perturbation theory provides insight into non-perturbative phenomenon in quantum field theory. While extensively studied in simplified models, high order behavior is challenging to access in more realistic field theories due to the complexity of the standard Feynman diagrammatic expansion. Building on recent progress in global sampling on the moduli space of tropical curves, we introduce an annealed importance sampling framework for tropical field theory. Our approach overcomes the exponential weight-variance barrier, allowing precise numerical calculations to high orders. We apply our technique to compute the perturbative series for the two-point function in the massive three-dimensional $\\phi^3$ theory through 325 loops. These coefficients determine the instanton action in $\\phi^3$ theory to 0.03\\% precision, confirm the collective-coordinate exponent, and extract the one-loop determinant and the instanton fluctuation corrections through four loops, in remarkable agreement with direct semiclassical calculations. Our approach is applicable to a variety of related field theories, facilitating the quantitative exploration of their high loop behavior.", "url": "https://arxiv.org/abs/2610.36025", "type": "理论", "summary": "微扰理论的高阶行为提供了对量子场论中非微扰现象的洞察。虽然在简化模型中进行了广泛的研究，但由于标准费曼图解展开的复杂性，高阶行为在更现实的场论中很难获得。基于热带曲线模空间全局采样的最新进展，我们引入了热带场理论的退火重要性采样框架。我们的方法克服了指数权重方差障碍，允许进行高阶精确数值计算。我们应用我们的技术通过 325 个循环来计算大规模三维 $\\phi^3$ 理论中两点函数的微扰级数。这些系数以 0.03\\% 的精度确定了 $\\phi^3$ 理论中的瞬子作用，确认了集体坐标指数，并通过四个循环提取了单环行列式和瞬子波动校正，与直接半经典计算非常一致。我们的方法适用于各种相关场论，有助于对其高循环行为的定量探索。", "authors": [{"name": "Ian Moult"}, {"name": "Bo Wang"}], "featured_authors": [{"name": "Ian Moult"}, {"name": "Bo Wang"}], "author_count": 2}, {"id": "2610.36028", "category": "hep-th", "title": "Cusp regularization with spin structures and gravitational anomalies", "abstract": "The family of $SL(2,\\mathbb Z)$ black holes has an accumulation point corresponding to a cusped geometry, which causes the sum over black holes to diverge. We extend cusp regularization to the sum over geometries compatible with a fixed boundary spin structure. For $c_L=c_R$, including the cusp as a counterterm cancels the leading divergence for each of the three even boundary spin structures. The required subtraction is the same in all three sectors and is two thirds of the bosonic one. We further show that gravitational anomalies cause cancellations between black hole contributions, removing the leading cusp divergence except at $c_L-c_R=0,\\pm24$ in pure gravity and $c_L-c_R=0,\\pm12$ in $\\mathcal N=(1,1)$ supergravity. We also derive the spin structure dependent anomaly phases responsible for these cancellations.", "url": "https://arxiv.org/abs/2610.36028", "type": "理论", "summary": "$SL(2,\\mathbb Z)$ 黑洞族有一个对应于尖点几何形状的累积点，这会导致黑洞上的总和发散。我们将尖点正则化扩展到与固定边界自旋结构兼容的几何形状之和。对于 $c_L=c_R$，包含尖点作为反项可以取消三个偶边界自旋结构中每一个的前导发散。所有三个扇区所需的减法都是相同的，并且是玻色子扇区的三分之二。我们进一步表明，引力异常会导致黑洞贡献之间的抵消，从而消除了除了纯引力中的 $c_L-c_R=0,\\pm24$ 和 $\\mathcal N=(1,1)$ 超引力中的 $c_L-c_R=0,\\pm12$ 之外的主要尖点发散。我们还推导了导致这些抵消的自旋结构相关异常相。", "authors": [{"name": "Elisa Tabor"}, {"name": "Cynthia Yan"}], "featured_authors": [{"name": "Elisa Tabor"}, {"name": "Cynthia Yan"}], "author_count": 2}, {"id": "2610.36031", "category": "hep-th", "title": "Analytic Bootstrap Solution for Quantum Mechanics on a Circle", "abstract": "We solve the Schrödinger equation for a particle in the circle with a quantum mechanical bootstrap method. The main idea is that in physical situations one needs solutions of the recursion relations for the Fourier coefficients of the measure that vanish exponentially fast. We show that this results in a (generalized) continued fraction representation of the solution. The solution is an analytical function of the couplings and the energy. We also show how one this method directly computes the density of states and checking that the answer is physical is reduced to checking an inequality for a single variable. We also show how to reconstruct the wave function and how to extract the quasimomentum of the particle as a function of the energy. We illustrate our solution in the simplest case of the Mathieu equation, where we show that the method can easily resolve exponentially small bands in the band spectrum.", "url": "https://arxiv.org/abs/2610.36031", "type": "理论", "summary": "我们用量子力学自举法求解圆中粒子的薛定谔方程。主要思想是，在物理情况下，我们需要解快速指数消失的测度的傅里叶系数的递归关系。我们证明这会产生解决方案的（广义）连分数表示。解是耦合和能量的解析函数。我们还展示了这种方法如何直接计算状态密度并检查答案是否是物理的，从而简化为检查单个变量的不等式。我们还展示了如何重建波函数以及如何提取粒子的准动量作为能量的函数。我们以最简单的马蒂厄方程为例说明了我们的解决方案，其中我们表明该方法可以轻松解析带谱中的指数小带。", "authors": [{"name": "David Berenstein"}, {"name": "Upamanyu Moitra"}], "featured_authors": [{"name": "David Berenstein"}, {"name": "Upamanyu Moitra"}], "author_count": 2}, {"id": "2610.36032", "category": "hep-th", "title": "Cosmology of the Baby Universe in Coupled SYK", "abstract": "We analyze the structure of the baby universe which arises in the coupled SYK realization of the AS$^2$ geometry. To do this, we develop and leverage combinatorial arguments about traces of many Majoranas which remain valid at finite $N$ and $p$ and thus furnish the finite $\\lambda$ completion of the chord rules found in [1]. We find that there is a first order phase transition which persists in the $\\beta\\rightarrow\\infty$ limit between the thermal AdS and AS$^2$ phases parameterized by the mass of the heavy particle insertion and the ratio between the SYK and Maldacena-Qi coupling constants. We then explore Lorentzian time evolution in the baby universe and find a cosine scale factor confirming the big bang / big crunch nature of the bulk cosmology.", "url": "https://arxiv.org/abs/2610.36032", "type": "理论", "summary": "我们分析了 AS$^2$ 几何的耦合 SYK 实现中出现的婴儿宇宙的结构。为此，我们开发并利用关于许多马约拉纳痕迹的组合论证，这些论证在有限 $N$ 和 $p$ 下仍然有效，从而提供[1]中找到的和弦规则的有限 $\\lambda$ 补全。我们发现热 AdS 和 AS$^2$ 相之间存在一阶相变，该相变持续存在于 $\\beta\\rightarrow\\infty$ 极限内，该相变由重粒子插入的质量以及 SYK 和 Maldacena-Qi 耦合常数之间的比率参数化。然后，我们探索婴儿宇宙中的洛伦兹时间演化，并找到一个余弦尺度因子，证实了整体宇宙学的大爆炸/大挤压性质。", "authors": [{"name": "Andrew Sontag"}], "featured_authors": [{"name": "Andrew Sontag"}], "author_count": 1}, {"id": "2610.36035", "category": "hep-th", "title": "BPS Chaos and Fortuity in Higgs Branches I: The Gepner Point", "abstract": "The BPS states in Calabi-Yau compactifications of type II string theory can sometimes be described using quiver quantum mechanics whose Higgs branch is a complete intersection manifold. Their degeneracy resembles that of BPS black holes. A small fraction of these states corresponds to multi-center supergravity brane configurations and can be continued to the (near-Higgs) Coulomb branch. We identify them as monotone states. The overwhelming majority of states, known as pure-Higgs states, are fortuitous states, which concentrate at a particular $R$-charge. This division has a precise mathematical meaning as two different types of cohomologies of the Higgs branch target space. We argue that a natural probe of BPS chaos in these models is the Berry/Chern curvature. In the case of the Gepner model, we use localization techniques in an auxiliary two-dimensional CFT to compute the curvature, its RMT properties, and deviations from it.", "url": "https://arxiv.org/abs/2610.36035", "type": "理论", "summary": "II 型弦理论的 Calabi-Yau 紧致化中的 BPS 态有时可以使用颤动量子力学来描述，其希格斯分支是完全交集流形。它们的简并性类似于 BPS 黑洞。这些状态的一小部分对应于多中心超重力膜构型，并且可以继续到（近希格斯）库仑分支。我们将它们识别为单调状态。绝大多数状态（称为纯希格斯状态）是偶然状态，它们集中在特定的 $R$ 电荷上。作为希格斯分支目标空间的两种不同类型的上同调，这种除法具有精确的数学意义。我们认为，Berry/Chern 曲率是这些模型中 BPS 混沌的自然探针。对于 Gepner 模型，我们在辅助二维 CFT 中使用定位技术来计算曲率、其 RMT 属性及其偏差。", "authors": [{"name": "Micha Berkooz"}, {"name": "Trivko Kukolj"}, {"name": "Ohad Mamroud"}, {"name": "Josef Seitz"}], "featured_authors": [{"name": "Micha Berkooz"}, {"name": "Trivko Kukolj"}, {"name": "Ohad Mamroud"}, {"name": "Josef Seitz"}], "author_count": 4}, {"id": "2610.36045", "category": "hep-th", "title": "Local Measures in Odd de Sitter", "abstract": "We show that massless theories in odd-dimensional de Sitter space have very simple measures---the modulus squared of the late-time wavefunctional---at tree level. They are local functionals; in particular, all wavefunction coefficients vanish at separated positions. All the usual singularities of nonlocal wavefunctions in even dimensions only affect the phase in the odd dimensional case. Hence a closed formula can be written for any number of points. We focus on three examples: the non-linear sigma model, Yang-Mills theory and General Relativity, from dimensions three to seven.", "url": "https://arxiv.org/abs/2610.36045", "type": "理论", "summary": "我们表明，奇维德西特空间中的无质量理论在树级别具有非常简单的测量方法——晚期波函数的模平方。他们是当地的职能人员；特别是，所有波函数系数在分离的位置处消失。偶数维度中非局域波函数的所有常见奇点仅影响奇数维度情况下的相位。因此，可以为任意数量的点编写闭合公式。我们重点关注三个例子：非线性西格玛模型、杨米尔斯理论和广义相对论，从第三维到第七维。", "authors": [{"name": "Guilherme L. Pimentel"}, {"name": "Nicole Righi"}, {"name": "Behrang Tafreshi"}], "featured_authors": [{"name": "Guilherme L. Pimentel"}, {"name": "Nicole Righi"}, {"name": "Behrang Tafreshi"}], "author_count": 3}, {"id": "2610.36057", "category": "hep-th", "title": "The Fate of 1/4-BPS States in the D1-D5 CFT", "abstract": "We consider the 1/4-BPS operators in the D1-D5 system on AdS$_3\\times S^3\\times T^4$. We evaluate the anomalous dimensions of low-lying sectors in conformal perturbation theory around Sym$^N(T^4)$ exactly in $N$. All anomalous dimensions are consistent with recombination of the short multiplets into long ones and take a particularly simple form. We show that at finite $N$ and at first nontrivial order in the deformation, for the sectors we consider, the BPS density of states agrees with that of the supergravity point. To the order in conformal perturbation theory we consider, this confirms that not all states that can get lifted do get lifted.", "url": "https://arxiv.org/abs/2610.36057", "type": "理论", "summary": "我们考虑 AdS$_3\\times S^3\\times T^4$ 上 D1-D5 系统中的 1/4-BPS 运算符。我们精确地在 $N$ 中围绕 Sym$^N(T^4)$ 评估了共形微扰理论中低洼扇区的异常维度。所有异常维度都与短多重态重组为长多重态一致，并采取特别简单的形式。我们表明，在有限 $N$ 和变形的第一非平凡阶下，对于我们考虑的扇区，BPS 态密度与超重力点的态密度一致。根据我们考虑的共形微扰理论的顺序，这证实了并非所有可以解除的状态都会被解除。", "authors": [{"name": "Suzanne Bintanja"}, {"name": "Amey P. Gaikwad"}, {"name": "Dikshant Rathore"}], "featured_authors": [{"name": "Suzanne Bintanja"}, {"name": "Amey P. Gaikwad"}, {"name": "Dikshant Rathore"}], "author_count": 3}, {"id": "2610.36064", "category": "hep-th", "title": "Axionic Quintessence in Heterotic String Theory", "abstract": "We investigate axionic quintessence in heterotic string compactifications. Starting from the ten-dimensional theory, we derive the four-dimensional axion effective action, including gauge couplings and non-perturbative potentials, and identify the curvature terms that can correct it. We examine the geometric requirements for ultralight axions generated by exponentially suppressed worldsheet instantons, finding significant restrictions through an exploratory scan of toric Calabi-Yau hypersurfaces. In an illustrative K3-fibred setup, the minimal benchmark also encounters a tension with the positivity of the one-loop corrected gauge kinetic functions. Aligned worldsheet-instanton contributions provide a way to alleviate this tension and yield an ultralight axion with a phenomenologically relevant decay constant. Our analysis also identifies lower-action instantons whose contributions must be controlled to preserve the ultralight axion. We then study the resulting class of quintessence potentials and qualitatively compare their late-time cosmological solutions with observationally preferred ranges.", "url": "https://arxiv.org/abs/2610.36064", "type": "理论", "summary": "我们研究异质弦紧化中的轴子精髓。我们从十维理论出发，推导了四维轴子有效作用，包括规范耦合和非微扰势，并确定了可以校正它的曲率项。我们研究了由指数抑制的世界表瞬时子生成的超轻轴子的几何要求，通过对环面卡拉比-丘超曲面的探索性扫描发现了显着的限制。在示例性的 K3 纤维设置中，最小基准还遇到了与单环校正规范动力学函数的正值的张力。对齐的世界表瞬时贡献提供了一种缓解这种张力的方法，并产生具有现象学相关衰减常数的超轻轴子。我们的分析还确定了低作用瞬子，必须控制其贡献以保护超轻轴子。然后，我们研究由此产生的一类精华势，并将它们的晚期宇宙学解决方案与观测到的首选范围进行定性比较。", "authors": [{"name": "David Andriot"}, {"name": "Margherita Putti"}, {"name": "Leo Veissiere"}], "featured_authors": [{"name": "David Andriot"}, {"name": "Margherita Putti"}, {"name": "Leo Veissiere"}], "author_count": 3}, {"id": "2610.36080", "category": "hep-th", "title": "Non-Hermitian Schwinger effect in an imaginary magnetic field", "abstract": "We investigate a non-Hermitian Schwinger effect by analyzing a one-loop effective Lagrangian of scalar and Dirac quantum electrodynamics (QED) in the presence of a real electric field and a parallel imaginary magnetic field. We show that an imaginary magnetic field produces an additional pole family in the integrand of the proper-time representation. Unlike a real magnetic field, an imaginary magnetic field can generate a nonzero imaginary part of the effective Lagrangian even in the absence of an electric field. The interplay between the two fields leads to nontrivial phenomena, such as a cancellation mechanism between the contributions of two fields. We also point out that when the ratio of two field strengths is rational, some poles among the two families coincide, and a careful treatment of double poles is required. By further examining the complex Landau-level structure of the electric-pole contribution, we find that the field dependence of the vacuum decay rate from each Landau level exhibits a sinusoidal-like behavior, and their sum determines the overall field dependence. Our results clarify the analytic structure of the QED effective Lagrangian in imaginary magnetic backgrounds and provide a basis for investigating its relation to non-Hermitian phenomena in the QED vacuum.", "url": "https://arxiv.org/abs/2610.36080", "type": "理论", "summary": "我们通过分析存在实电场和平行虚磁场的情况下标量的单环有效拉格朗日和狄拉克量子电动力学 (QED) 来研究非厄米施温格效应。我们证明，虚磁场在原时表示的被积函数中产生了一个额外的极族。与真实磁场不同，虚磁场即使在没有电场的情况下也可以生成有效拉格朗日的非零虚部。这两个领域之间的相互作用导致了一些不平凡的现象，例如两个领域的贡献之间的抵消机制。我们还指出，当两个场强的比例合理时，两个族之间的某些极点是重合的，并且需要仔细处理双极点。通过进一步检查电极贡献的复杂朗道能级结构，我们发现每个朗道能级的真空衰减率的场依赖性表现出类似正弦的行为，并且它们的总和决定了总体场依赖性。\n\n我们的结果阐明了虚磁背景中 QED 有效拉格朗日的解析结构，并为研究其与 QED 真空中非厄米现象的关系提供了基础。", "authors": [{"name": "Ahmad Jafar Arifi"}, {"name": "Kei Suzuki"}], "featured_authors": [{"name": "Ahmad Jafar Arifi"}, {"name": "Kei Suzuki"}], "author_count": 2}, {"id": "2610.36094", "category": "hep-th", "title": "Hironaka decompositions in supersymmetric theories: an exploration", "abstract": "We ask when tree-level supersymmetric cohomology admits a Hironaka decomposition: a unique expansion in finitely many secondary operators with polynomial coefficients in algebraically independent bosonic primaries. Such a decomposition organizes the cohomology into towers with a common set of unrestricted dressings. For diagonal models with $N$ labels, $d\\geq1$ bosonic species and $f$ fermionic species, we construct this decomposition and obtain $(N!)^{d-1}2^{fN}$ secondaries. We also prove that the scalar-branch ring of ABJM theory admits a Hironaka decomposition at every rank and positive integer Chern--Simons level, and construct explicit bases for the $SU(2)\\times SU(2)$ Klebanov--Witten scalar ring. We also do the same for the Higgs branches of two class-S theories. However, not all supersymmetric cohomologies admit a Hironaka decomposition. In the Wess--Zumino model with $W=x^2y^2$, every positive-degree scalar annihilates the nonzero class $xy$, while $x^n$ is in cohomology for every $n\\geq 1$. These two properties rule out a Hironaka decomposition over scalar primaries.", "url": "https://arxiv.org/abs/2610.36094", "type": "理论", "summary": "我们问树级超对称上同调何时允许 Hironaka 分解：在代数独立的玻色原色中具有多项式系数的有限多个二次算子的唯一展开式。这种分解将上同调组织成具有一组通用的不受限制的敷料的塔。对于具有 $N$ 标签、$d\\geq1$ 玻色子物种和 $f$ 费米子物种的对角线模型，我们构建此分解并获得 $(N!)^{d-1}2^{fN}$ 次级。我们还证明了 ABJM 理论的标量分支环在每个秩和正整数 Chern--Simons 级上都允许 Hironaka 分解，并为 $SU(2)\\times SU(2)$ Klebanov--Witten 标量环构造显式基。我们也对两个 S 类理论的希格斯分支做同样的事情。然而，并非所有超对称上同调都承认 Hironaka 分解。在 $W=x^2y^2$ 的 Wess--Zumino 模型中，每个正度标量都会消灭非零类 $xy$，而 $x^n$ 对于每个 $n\\geq 1$ 都是上同调的。这两个属性排除了标量原色上的 Hironaka 分解。", "authors": [{"name": "Abhijit Gadde"}, {"name": "Rajat Raj"}, {"name": "Shivansh Tomar"}], "featured_authors": [{"name": "Abhijit Gadde"}, {"name": "Rajat Raj"}, {"name": "Shivansh Tomar"}], "author_count": 3}, {"id": "2610.36128", "category": "hep-th", "title": "Landau singularity of the K3 maximal cut in black-hole scattering at fifth post-Minkowskian order", "abstract": "Modeling the gravitational waves from merging black holes requires precise calculations of the two-body problem. The post-Minkowskian expansion of black-hole scattering, in powers of Newton's constant, now stands at fifth order, four loops. At this order one part of the deflection diverges when the black holes pass at about 94 percent of the speed of light. The divergence is known to come from periods of a K3 surface, which has a node at this speed. We show that the node lies on the integration contour of the K3 maximal cut, which makes this speed a Landau singularity of the cut. Requiring the divergence to cancel, without introducing new infinities, has been shown to fix the memory contribution, named for the permanent displacement that the waves leave in test masses, up to one constant. We derive the leading coefficients of its boundary integrals in closed form. We obtain both results from maximal cuts and boundary limits, without an integration-by-parts reduction of the full four-loop integrand. We also continue the K3 and Calabi--Yau periods of these integrals to the energies of bound orbits, as in the inspiral before a merger.", "url": "https://arxiv.org/abs/2610.36128", "type": "理论", "summary": "对合并黑洞产生的引力波进行建模需要对二体问题进行精确计算。后闵可夫斯基黑洞散射的扩展，以牛顿常数的幂为单位，现在处于第五阶，四个循环。在这个量级上，当黑洞以大约 94% 的光速通过时，一部分偏转会发散。已知发散来自 K3 表面的周期，该表面具有此速度的节点。我们证明该节点位于 K3 最大割的积分轮廓上，这使得该速度成为割的朗道奇点。事实证明，要求取消发散而不引入新的无穷大可以将记忆贡献（以波在测试质量中留下的永久位移命名）固定为一个常数。我们以封闭形式推导其边界积分的主系数。我们从最大割集和边界限制中获得结果，而不需要对完整的四环被积函数进行逐部分积分缩减。我们还将这些积分的 K3 和 Calabi-Yau 周期延续到束缚轨道的能量，就像合并前的螺旋一样。", "authors": [{"name": "Matthew D. Schwartz"}], "featured_authors": [{"name": "Matthew D. Schwartz"}], "author_count": 1}, {"id": "2610.36271", "category": "hep-th", "title": "The Disordered Universe 2025: Analytic Properties of Amplitudes and Correlators", "abstract": "These lectures provide an introduction to modern techniques for studying the analytic properties of loop-level scattering amplitudes and correlation functions in perturbative quantum field theory. We begin by developing the ideas behind Landau analysis, which identifies the location and nature of kinematic singularities in Feynman integrals (the universal building blocks that contribute to perturbative amplitudes and correlators). We then show how fundamental principles such as unitarity and causality constrain the analytic structure of Feynman integrals, and develop methods for working out some of these constraints in practice. Finally, we connect these observations to the properties of iterated integrals and their symbol calculus, to show how bootstrap methods can be used to determine the functional form of Feynman integrals from just knowledge of their analytic structure. These notes are based on a series of lectures held during the La Ricotta Summer School \"The Disordered Universe 2025\" from 21~July to 1~August~2025.", "url": "https://arxiv.org/abs/2610.36271", "type": "理论", "summary": "这些讲座介绍了研究微扰量子场论中环级散射振幅和相关函数的分析特性的现代技术。我们首先发展朗道分析背后的思想，该分析确定了费曼积分（有助于扰动振幅和相关器的通用构建块）中运动学奇点的位置和性质。然后，我们展示幺正性和因果性等基本原理如何约束费曼积分的分析结构，并开发在实践中解决其中一些约束的方法。最后，我们将这些观察结果与迭代积分及其符号微积分的属性联系起来，以展示如何使用引导方法仅根据其解析结构的知识来确定费曼积分的函数形式。这些笔记基于2025年7月21日至8月1日La Ricotta暑期学校“混乱的宇宙2025”期间举办的一系列讲座。", "authors": [{"name": "Mattia Capuano"}, {"name": "Chandramouli Chowdhury"}, {"name": "Chantelle Esper"}, {"name": "Alessandro Palazio"}, {"name": "Jonah Stalknecht"}, {"name": "Yong Sheng Yap"}, {"name": "Andrew J. McLeod"}, {"name": "Paolo Benincasa"}, {"name": "Guilherme Leite Pimentel"}], "featured_authors": [{"name": "Mattia Capuano"}, {"name": "Chandramouli Chowdhury"}, {"name": "Chantelle Esper"}, {"name": "Andrew J. McLeod"}, {"name": "Paolo Benincasa"}, {"name": "Guilherme Leite Pimentel"}], "author_count": 9}, {"id": "2610.36275", "category": "hep-th", "title": "Quantum hydrodynamics from Nambu's unpublished fluid notes", "abstract": "We develop a quantum hydrodynamic theory based on Nambu's unpublished note \\emph{A New Look at Fluid Dynamics}. The kinetic action defines a metric on configuration space and a mechanical connection coupling an observable cyclic deformation to unobserved fluid modes. Tracing out these modes yields a quantum channel for the observed deformation. We establish a criterion for the exact preservation of coherence between opposite momenta and show how nonzero connection curvature prevents this coupling from being removed. The leading quadratic decay of quantum coherence is determined by the prepared quantum state. For two shear flows, we identify an exact noiseless sign subsystem. Introducing additional generating flows cancels the initial residual of the Euler equations while producing nonzero connection curvature, governed by the same kinetic integrals that determine the classical correction. At fixed mean energy, choosing amplitudes adapted to the dominant coupling flow substantially reduces the initial decoherence, even along the direction that cancels the Euler residual. This advantage gradually diminishes under conditional evolution, eventually leading to a crossing of the decoherence curves. Our example shows that a preparation with a smaller initial coherence-decay coefficient can have a larger maximum sampled loss over a finite readout interval.", "url": "https://arxiv.org/abs/2610.36275", "type": "理论", "summary": "我们基于 Nambu 未发表的笔记 \\emph{流体动力学的新观点} 开发了一种量子流体动力学理论。动力学作用定义了配置空间的度量以及将可观察到的循环变形与不可观察到的流体模式耦合的机械连接。追踪这些模式会产生观察到的变形的量子通道。我们建立了一个标准，用于精确保留相反动量之间的相干性，并展示非零连接曲率如何防止这种耦合被消除。量子相干性的主导二次衰减由准备好的量子态决定。对于两个剪切流，我们确定了一个精确的无噪声符号子系统。引入额外的生成流可以消除欧拉方程的初始残差，同时产生非零连接曲率，由确定经典校正的相同动力学积分控制。在固定平均能量下，选择适合主要耦合流的振幅可显着减少初始退相干，即使沿着消除欧拉残差的方向也是如此。\n\n这种优势在条件演化下逐渐减弱，最终导致退相干曲线交叉。我们的例子表明，具有较小初始相干衰减系数的制剂可以在有限的读出间隔内具有较大的最大采样损失。", "authors": [{"name": "Kazuki Ikeda"}], "featured_authors": [{"name": "Kazuki Ikeda"}], "author_count": 1}, {"id": "2610.36455", "category": "hep-th", "title": "Trace Relations and Partition Functions", "abstract": "In general trace relations appear in finite $N$ matrix models and collective field theories. They lead, as was established previously, to reductions of large $N$ Hilbert spaces. Even more importantly they induce the appearance of a whole class of new (miraculous) states whose number grows exponentially in $N^2$. In this work we discuss their relevance to finite $N$ thermodynamics and the role they play in constraining the partition functions of finite $N$ theories.", "url": "https://arxiv.org/abs/2610.36455", "type": "理论", "summary": "一般来说，迹关系出现在有限$N$矩阵模型和集体场论中。正如之前所确定的，它们导致了大 $N$ 希尔伯特空间的减少。更重要的是，它们引发了一整类新的（神奇的）状态的出现，其数量在 $N^2$ 中呈指数级增长。在这项工作中，我们讨论它们与有限 $N$ 热力学的相关性以及它们在约束有限 $N$ 理论的配分函数中发挥的作用。", "authors": [{"name": "Robert de Mello Koch"}, {"name": "Antal Jevicki"}, {"name": "Junjie Zheng"}], "featured_authors": [{"name": "Robert de Mello Koch"}, {"name": "Antal Jevicki"}, {"name": "Junjie Zheng"}], "author_count": 3}, {"id": "2610.36604", "category": "hep-th", "title": "The heterotic superpotential and the alpha' expansion", "abstract": "We study the role of the Hull connection in the heterotic superpotential for N=1 d=4 vacua. The integrand is defined in terms of H, which is in turn defined in terms of a gravitational Chern--Simons coupling involving H. We show this recursive structure is key to W reproducing some of the ten--dimensional supersymmetry conditions written down by Bergshoeff--de Roo through \\alpha'^3. With this evidence in hand we make some observations about extending some of the tensor equations of Hull and Strominger to all orders in \\alpha'.", "url": "https://arxiv.org/abs/2610.36604", "type": "理论", "summary": "我们研究了赫尔连接在 N=1 d=4 真空杂种优势超势中的作用。被积函数是用 H 来定义的，而 H 又是用涉及 H 的引力 Chern-Simons 耦合来定义的。我们证明这种递归结构是 W 再现 Bergshoeff--de Roo 通过 α'^3 写下的一些十维超对称条件的关键。有了这些证据，我们对将赫尔和斯特罗明格的一些张量方程扩展到 α 中的所有阶进行了一些观察。", "authors": [{"name": "Jock McOrist"}], "featured_authors": [{"name": "Jock McOrist"}], "author_count": 1}, {"id": "2610.36735", "category": "hep-th", "title": "The Wess-Zumino Action of the Conformal Anomaly", "abstract": "The complete Wess-Zumino (WZ) action and stress-energy tensor (SET) of the conformal anomaly in both two and four dimensions is given. This local effective action is expressed in terms of a single scalar Nambu-Goldstone `conformalon' field $\\varphi$, parametrizing the local abelian Weyl group of conformal transformations that act transitively on the spacetime metric. Satisfying WZ consistency, and equipped with a variational principle for $\\varphi$ that determines the conformal transformation $g_{\\mu\\nu}\\!\\to\\!g_{\\mu\\nu}e^{-\\varphi}$ to an associated spacetime with no anomaly, the WZ action resolves the conformal gauge fixing ambiguity of earlier methods of `integrating the anomaly.' In $D\\!=\\!2$ the WZ action is the local form of the Polyakov action, whose massless $\\varphi$ propagator describes a correlated two-particle scalar intermediate state in the SET polarization function $\\langle TT\\rangle$. The imaginary part of this polarization obeys a UV finite sum rule, becoming a Dirac $\\delta$-function at zero energy for conformal quantum fields, demonstrating the infrared origin of the anomaly, while the real part becomes the light cone propagator of $\\varphi$. Although the $\\Box R$ term in $D\\!=\\!4$ corresponds to a cohomologically trivial cocycle, it also arises from the IR limit of massless quantum fields, independently of UV physics, and contributes to the WZ action for low energy gravity. Analogous to the WZ action for pseudo-Goldstone mesons in low energy QCD from the axial anomaly, the WZ action for the conformal anomaly provides a Nambu-Goldstone scalar field for macroscopic gravity, in addition to the metric of classical general relativity.", "url": "https://arxiv.org/abs/2610.36735", "type": "理论", "summary": "给出了二维和四维共形异常的完整 Wess-Zumino (WZ) 作用和应力-能量张量 (SET)。这种局部有效作用用单个标量 Nambu-Goldstone“共形”场 $\\varphi$ 来表示，参数化了传递作用于时空度量的局部阿贝尔韦尔群共形变换。满足 WZ 一致性，并配备 $\\varphi$ 的变分原理，确定共形变换 $g_{\\mu\\nu}\\!\\to\\!g_{\\mu\\nu}e^{-\\varphi}$ 到没有异常的相关时空，WZ 操作解决了早期“积分异常”方法的共形规范固定模糊性。在 $D\\!=\\!2$ 中，WZ 作用是 Polyakov 作用的局域形式，其无质量 $\\varphi$ 传播器描述了 SET 偏振函数 $\\langle TT\\rangle$ 中相关的两粒子标量中间态。这种偏振的虚部遵循紫外有限和规则，成为共形量子场零能量下的狄拉克 $\\delta$ 函数，证明了异常的红外起源，而实部则成为 $\\varphi$ 的光锥传播器。\n\n尽管 $D\\!=\\!4$ 中的 $\\Box R$ 项对应于上同调平凡余循环，但它也源自无质量量子场的 IR 极限，与 UV 物理无关，并且有助于低能引力的 WZ 作用。类似于来自轴向异常的低能 QCD 中赝戈德斯通介子的 WZ 作用，共形异常的 WZ 作用除了经典广义相对论的度量之外，还为宏观重力提供了南部-戈德斯通标量场。", "authors": [{"name": "Emil Mottola"}], "featured_authors": [{"name": "Emil Mottola"}], "author_count": 1}, {"id": "2610.36845", "category": "hep-th", "title": "Wilson loops of Chern-Simons-matter Theories with one parameter and Picard-Fuchs equations", "abstract": "Extending our previous work, we investigate Wilson loops of flavored Chern-Simons theory and ABJ theory by the use of Picard-Fuchs equations. The singularity structure of the equations is analyzed in detail, and local solutions around the singularities are determined. Each theory has one parameter, and the parameter dependence of the
