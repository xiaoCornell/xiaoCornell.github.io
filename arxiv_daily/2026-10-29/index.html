s, at which the rate function becomes nonanalytic. We verify our results in a generalized non-Hermitian SSH model by quenching the Peierls phase and the non-Hermitian gain-loss strength, and also use the Jordan form to analyze the dynamics at postquench exceptional points, where the conventional Fisher zero formula is not applicable.", "url": "https://arxiv.org/abs/2610.36521", "type": "理论", "summary": "非厄米淬灭中洛施密特振幅的费希尔零线可以在复杂时间平面中表现出异常结构，例如发散、分离以及所有分支或特定分支对实轴或虚轴的限制。在这里，我们使用双正交框架来揭示这些结构的起源，并通过分析归一化预淬火和淬火后复数布洛赫向量之间的点积$m_k=\\hat{\\mathbf{h}}_0\\cdot\\hat{\\mathbf{h}}_1$的值来确定相应的临界动量条件。当费舍尔零点连续覆盖实时轴时，进一步引入费舍尔零点密度来识别这些关键区域内的临界时间，在该时间点速率函数变得非解析。我们通过淬火 Peierls 相和非埃尔米增益-损失强度在广义非埃尔米特 SSH 模型中验证了我们的结果，并使用 Jordan 形式来分析淬火后异常点处的动力学，其中传统的费舍尔零公式不适用。", "authors": [{"name": "Wen-Hui Nie"}, {"name": "Chong Li"}, {"name": "Lin-Cheng Wang"}], "featured_authors": [{"name": "Wen-Hui Nie"}, {"name": "Chong Li"}, {"name": "Lin-Cheng Wang"}], "author_count": 3}, {"id": "2610.36680", "category": "quant-ph", "title": "Quantum State Preparation for Complex-Valued Amplitudes", "abstract": "We present a state preparation procedure that takes binary registers containing the real and imaginary parts of a complex number $z=x+iy$ and prepares an amplitude approximating $z/\\alpha$, where $\\alpha$ is a normalization constant. The magnitude and argument are computed using the Coordinate Rotation Digital Computer (CORDIC) algorithm. We then encode the magnitude into an amplitude, and apply phase gates to introduce the argument. A reversible in-place multiplier allows the coordinate updates to use fixed precision while clearing their temporary workspace. The procedure uses $O(n^2)$ $T$ gates and $O(n)$ additional qubits. Compared with separately encoding the real and imaginary parts and combining them through LCU, the construction can allow a smaller normalization and reduce amplitude-amplification costs. The computed polar representation also remains available for further arithmetic before amplitude-encoding.", "url": "https://arxiv.org/abs/2610.36680", "type": "数值", "summary": "我们提出了一个状态准备过程，该过程采用包含复数 $z=x+iy$ 实部和虚部的二进制寄存器，并准备近似 $z/\\alpha$ 的幅度，其中 $\\alpha$ 是归一化常数。使用坐标旋转数字计算机 (CORDIC) 算法计算幅度和参数。然后，我们将幅度编码为幅度，并应用相位门来引入参数。可逆的就地乘法器允许坐标更新使用固定精度，同时清除其临时工作空间。该过程使用 $O(n^2)$ $T$ 个门和 $O(n)$ 个额外量子位。与分别对实部和虚部进行编码并通过LCU将它们组合相比，该构造可以允许更小的归一化并降低幅度放大成本。计算出的极坐标表示也仍然可用于幅度编码之前的进一步算术。", "authors": [{"name": "Fred Sun"}], "featured_authors": [{"name": "Fred Sun"}], "author_count": 1}, {"id": "2610.36754", "category": "quant-ph", "title": "A Unified Protocol for Arbitrary Z Rotations of a Class of Bosonic cQED Qubits", "abstract": "Bosonic-qubit encodings provide diverse approaches to storing and processing quantum information, with logical operations often implemented through encoding-specific physical strategies. Here, we identify a class of bosonic Fock-based qubits in circuit QED for which distinct implementations of arbitrary Z rotations share a common structure. We formulate this structure as a six-step protocol that provides a unified procedure for implementing arbitrary Z rotations across this class of bosonic cQED qubits. The applicability of the protocol is determined by a specific condition on the encoding, providing a criterion for identifying bosonic Fock-based cQED qubits that admit the common implementation.", "url": "https://arxiv.org/abs/2610.36754", "type": "理论", "summary": "玻色子量子位编码提供了多种存储和处理量子信息的方法，逻辑运算通常通过特定于编码的物理策略来实现。在这里，我们在电路 QED 中识别了一类基于玻色 Fock 的量子位，其任意 Z 旋转的不同实现共享一个公共结构。我们将此结构制定为一个六步协议，该协议提供了一个统一的程序，用于在此类玻色 cQED 量子位上实现任意 Z 旋转。该协议的适用性由编码的特定条件决定，为识别允许通用实现的基于玻色 Fock 的 cQED 量子位提供了标准。", "authors": [{"name": "Vahid Shaghaghi"}], "featured_authors": [{"name": "Vahid Shaghaghi"}], "author_count": 1}, {"id": "2610.36936", "category": "quant-ph", "title": "Qubit-environment entanglement in pure dephasing dynamics for mixed initial states", "abstract": "Decoherence of qubits is one main limitation in quantum information processing, where the qubits themselves can be mixed because of decoherence and additional decoherence may generated through interactions with a bath. Here, we present a complete study of qubit-environment entanglement in the case of interactions that lead to pure dephasing of the qubit by allowing the initial state of the qubit to be mixed, exceeding previous restrictions. We find that the criteria for separability that hold for pure initial states of the qubit are reduced to witness status. Yet, the evolution of the witnesses reflects the array of features that entanglement can exhibit in the mixed case but are forbidden in the pure-qubit case. Most notably, this includes sudden birth of entanglement as the initial phase of the evolution is typically separable. Moreover, there is a stark numerical advantage to the study of entanglement for large environments when using the witness rather than the traditional measures available. We include the study of entanglement generated between a spin qubit and a sparse spin environment to illustrate the peculiarities of the evolution of entanglement in this case, as well as to emphasize the level of reliability of the entanglement witness.", "url": "https://arxiv.org/abs/2610.36936", "type": "理论+数值", "summary": "量子位的退相干是量子信息处理中的一个主要限制，其中量子位本身可以由于退相干而混合，并且通过与浴的相互作用可能产生额外的退相干。在这里，我们提出了对量子位环境纠缠的完整研究，在相互作用的情况下，通过允许量子位的初始状态混合，从而导致量子位的纯相移，超出了之前的限制。我们发现，适用于量子位的纯初始状态的可分离性标准被简化为见证状态。然而，见证人的演变反映了纠缠在混合情况下可以表现出但在纯量子位情况下被禁止的一系列特征。最值得注意的是，这包括纠缠的突然诞生，因为演化的初始阶段通常是可分离的。此外，使用目击者而不是传统的可用方法来研究大型环境中的纠缠具有明显的数字优势。\n\n我们对自旋量子位和稀疏自旋环境之间产生的纠缠进行研究，以说明这种情况下纠缠演化的特殊性，并强调纠缠见证的可靠性水平。", "authors": [{"name": "Małgorzata Strzałka"}, {"name": "Nico Peters"}, {"name": "Laura Ares"}, {"name": "Jan Sperling"}, {"name": "Katarzyna Roszak"}], "featured_authors": [{"name": "Małgorzata Strzałka"}, {"name": "Nico Peters"}, {"name": "Laura Ares"}, {"name": "Jan Sperling"}, {"name": "Katarzyna Roszak"}], "author_count": 5}, {"id": "2610.37012", "category": "quant-ph", "title": "The TEMPO network can be made independent of the system size", "abstract": "The time-evolving matrix product operator (TEMPO) method efficiently simulates non-Markovian open quantum system dynamics by contracting a two-dimensional tensor network representing the time-discretized Feynman-Vernon influence functional. The standard form of this network has an unfavorable scaling with the size of the system. We show that, within the usual second-order time-step error, the dimensions of all internal network bonds can be reduced to $(2m+1)(m+1)$, where $m$ is the number of independent coupling channels. This dimension does not depend on the number of distinct eigenvalues of the coupling operators. The system size only enters in the final boundary layer of the network, making large system sizes accessible to TEMPO methods. This structure was discovered by Claude Opus 5.5 during guided algorithm development.", "url": "https://arxiv.org/abs/2610.37012", "type": "理论+数值", "summary": "时间演化矩阵乘积算子 (TEMPO) 方法通过收缩表示时间离散 Feynman-Vernon 影响函数的二维张量网络，有效地模拟非马尔可夫开放量子系统动力学。该网络的标准形式不利于系统规模的扩展。我们证明，在通常的二阶时间步长误差内，所有内部网络键的维数可以减少到 $(2m+1)(m+1)$，其中 $m$ 是独立耦合通道的数量。该维度不取决于耦合算子的不同特征值的数量。系统尺寸仅进入网络的最终边界层，使得 TEMPO 方法可以访问大型系统尺寸。这种结构是 Claude Opus 5.5 在引导算法开发过程中发现的。", "authors": [{"name": "Valentin Link"}], "featured_authors": [{"name": "Valentin Link"}], "author_count": 1}, {"id": "2610.37087", "category": "quant-ph", "title": "Exact decoherence dynamics of a detector coupled to vacuum fluctuations in bounded geometries", "abstract": "The properties of quantum vacuum are highly sensitive to the underlying spacetime geometry and boundary conditions. We investigate in this paper the decoherence dynamics of a two-level system (detector) coupled to a vacuum scalar field through the $\\hat{\\sigma}_z$-coupling scheme under various boundary environments. By rigorously evaluating the reduced density matrix of the detector, we derive an exact general expression for the detector's decoherence function, $\\gamma(\\Delta t)$, and use it to characterize the dynamical decoherence of a detector in three scenarios: free space, a perfectly reflecting boundary, and a cavity formed by two parallel reflecting boundaries. We find that in free space the detector's coherence decays monotonically with time, indicating that vacuum fluctuations alone inevitably lead to a complete loss of coherence. In the single-boundary case, by contrast, the detector's coherence displays non-monotonic time evolution: $\\gamma(\\Delta t)$ increases with time up to a maximum and then settles to a steady value, indicating that the initial coherence can be partially preserved due to the presence of the boundary. When the detector is placed inside a cavity, its coherence evolution exhibits oscillatory behavior, and a significant fraction of the initial coherence survives. Moreover, for the same detector-boundary distance, more coherence is preserved in the cavity case than in the single-boundary case. These results provide a viable route for engineering quantum coherence via boundary conditions.", "url": "https://arxiv.org/abs/2610.37087", "type": "理论", "summary": "量子真空的特性对潜在的时空几何和边界条件高度敏感。我们在本文中研究了在各种边界环境下通过 $\\hat{\\sigma}_z$ 耦合方案耦合到真空标量场的两级系统（探测器）的退相干动力学。通过严格评估探测器的约简密度矩阵，我们推导了探测器退相干函数的精确通用表达式 $\\gamma(\\Delta t)$，并用它来表征探测器在三种情况下的动态退相干：自由空间、完美反射边界和由两个平行反射边界形成的空腔。我们发现，在自由空间中，探测器的相干性随时间单调衰减，这表明真空涨落本身就不可避免地导致相干性完全丧失。相比之下，在单边界情况下，探测器的相干性显示出非单调的时间演化：$\\gamma(\\Delta t)$ 随着时间的推移而增加，达到最大值，然后稳定到稳定值，这表明由于边界的存在，可以部分保留初始相干性。\n\n当探测器放置在腔体内时，其相干演化表现出振荡行为，并且初始相干性的很大一部分得以保留。此外，对于相同的探测器边界距离，腔体情况下比单边界情况下保留了更多的相干性。这些结果为通过边界条件工程量子相干性提供了可行的途径。", "authors": [{"name": "Zi'an Zhao"}, {"name": "Wenting Zhou"}], "featured_authors": [{"name": "Zi'an Zhao"}, {"name": "Wenting Zhou"}], "author_count": 2}, {"id": "2610.37092", "category": "quant-ph", "title": "Quantum Fisher Information Deficit as a Geometric Signature of Strong-to-Weak Spontaneous Symmetry Breaking", "abstract": "Recently, strong-to-weak spontaneous symmetry breaking (SW-SSB) has been established as a framework for describing quantum phases in open systems. However SW-SSB cannot be characterized by conventional charged two-point correlators. In this work, we show that, for strongly $\\mathbb{Z}_2$-symmetric states with local charged involutions, SW-SSB manifests as a persistent deficit from the maximal quantum Fisher information (QFI) under symmetry-neutral pair rotations. A model-independent inequality hierarchy establishes the equivalence of this deficit with fidelity and Rényi-1 correlators as asymptotic long-range-order diagnostics. It thereby connects finite-angle state overlaps to a constraint on the infinitesimal Bures geometry along the same pair-generated orbit. For symmetry-projected Gibbs states, we further derive a lower bound on the deficit governed by the mean energy injected by the pair operation. Crucially, locality keeps this energy cost uniformly bounded in system size and endpoint separation, maintaining a finite gap below the maximal QFI at any fixed finite temperature. When ordinary charged long range order is absent, this persistent geometric constraint provides a quantitative information-geometric characterization of thermal SW-SSB.", "url": "https://arxiv.org/abs/2610.37092", "type": "理论", "summary": "最近，强到弱自发对称破缺（SW-SSB）已被建立为描述开放系统中量子相的框架。然而，SW-SSB 不能用传统的带电两点相关器来表征。在这项工作中，我们表明，对于具有局部带电对合的强 $\\mathbb{Z}_2$ 对称态，SW-SSB 表现为对称中性对旋转下最大量子费希尔信息 (QFI) 的持续赤字。与模型无关的不平等层次结构将这种赤字与保真度和 Rényi-1 相关器作为渐近长程阶诊断建立了等价关系。因此，它将有限角度状态重叠与沿同一对生成轨道的无穷小 Bures 几何形状的约束连接起来。对于对称投影吉布斯态，我们进一步推导出由对操作注入的平均能量控制的赤字下限。至关重要的是，局部性使这种能源成本在系统尺寸和端点间隔上保持一致，从而在任何固定的有限温度下保持低于最大 QFI 的有限差距。\n\n当普通带电长程有序不存在时，这种持久的几何约束提供了热 SW-SSB 的定量信息几何特征。", "authors": [{"name": "Zhang-Chi Yin"}, {"name": "Wei Zheng"}], "featured_authors": [{"name": "Zhang-Chi Yin"}, {"name": "Wei Zheng"}], "author_count": 2}, {"id": "2610.37247", "category": "quant-ph", "title": "Quantum circuits of elastic wave equations via Schrödingerisation", "abstract": "We construct explicit quantum circuits for the velocity-stress formulation of elastic wave equations in homogeneous media using Schrödingerisation. After rewriting the equations in symmetric matrix form(SMF), we use Fourier spectral discretization for source-driven periodic problems and staggered-grid finite differences for Dirichlet, Neumann, and impedance boundary conditions. The Schrödingerisation method transforms any linear PDEs into a system of Schrödinger-type PDEs -with unitary evolution- using the warped phase transformation that maps the equations in one higher dimension. For periodic problems, we develop circuits by combining controlled Fourier-mode rotations. For physical boundaries, interleaved encoding swaps the spatial and field-component registers, enabling a more efficient circuit construction using shift operators. We analyze $p$th-order Trotter-Suzuki formulas and derive splitting-error and CNOT-gate estimates, under the assumptions of smooth auxiliary initialization and solution-state recovery. Comparison with classical partitioned splitting methods identifies a polynomial improvement in spatial-resolution dependence for the quantum state-evolution subroutine. Noiseless circuit simulations of a forced periodic problem and an impedance problem illustrate the constructions and quantify their errors against exact solutions and classical reference computations.", "url": "https://arxiv.org/abs/2610.37247", "type": "理论+数值", "summary": "我们使用薛定谔化构建了显式量子电路，用于均匀介质中弹性波方程的速度应力公式。将方程重写为对称矩阵形式（SMF）后，我们使用傅里叶谱离散化来解决源驱动的周期性问题，并使用交错网格有限差分来解决狄利克雷、诺伊曼和阻抗边界条件。薛定谔化方法使用将方程映射到一个更高维度的扭曲相变，将任何线性偏微分方程转换为具有酉演化的薛定谔型偏微分方程组。对于周期性问题，我们通过组合受控傅立叶模式旋转来开发电路。对于物理边界，交错编码交换空间和场分量寄存器，从而使用移位运算符实现更有效的电路构造。我们分析了 p 阶 Trotter-Suzuki 公式，并在平滑辅助初始化和解状态恢复的假设下推导出分裂误差和 CNOT 门估计。与经典分区分裂方法的比较确定了量子状态演化子程序的空间分辨率依赖性的多项式改进。\n\n强制周期问题和阻抗问题的无噪声电路模拟说明了结构，并根据精确解和经典参考计算量化了它们的误差。", "authors": [{"name": "Shi Jin"}, {"name": "Chundan Zhang"}], "featured_authors": [{"name": "Shi Jin"}, {"name": "Chundan Zhang"}], "author_count": 2}, {"id": "2610.37249", "category": "quant-ph", "title": "HTM: A Hybrid Classical-Quantum Computation Model", "abstract": "Classical and quantum computers have achieved collaborative computation and completed applications across numerous fields. Nevertheless, the absence of a unified hybrid computation model has led to issues such as non-standardized engineering architecture design, ambiguous task partitioning criteria and so on. To address these issues, this research proposes a hybrid classical-quantum computation model (HTM). By constructing unified state sets and transition function representations, HTM clarifies hybrid control logic and implements a control-sharing mechanism. Simultaneously, a comprehensive complexity calculation method based on entanglement and superposition was proposed, supporting computation task partitioning and resource scheduling. The HTM fills a theoretical gap in the classical-quantum hybrid computation area and implements the joint promotion and development of computing models and hardware.", "url": "https://arxiv.org/abs/2610.37249", "type": "理论+数值", "summary": "经典计算机和量子计算机已经实现了协同计算并完成了多个领域的应用。然而，由于缺乏统一的混合计算模型，导致工程架构设计不标准化、任务划分标准不明确等问题。为了解决这些问题，本研究提出了一种混合经典量子计算模型（HTM）。通过构造统一的状态集和转换函数表示，HTM 阐明了混合控制逻辑并实现了控制共享机制。同时提出了一种基于纠缠和叠加的综合复杂度计算方法，支持计算任务划分和资源调度。 HTM填补了经典-量子混合计算领域的理论空白，实现了计算模型和硬件的共同促进和发展。", "authors": [{"name": "Guoqiang Shu"}, {"name": "Zongjiang Yi"}, {"name": "Jinyang Yao"}, {"name": "Haomiao Dong"}, {"name": "Zhihang Li"}, {"name": "Fudong Liu"}, {"name": "Zheng Shan"}], "featured_authors": [{"name": "Guoqiang Shu"}, {"name": "Zongjiang Yi"}, {"name": "Jinyang Yao"}, {"name": "Zhihang Li"}, {"name": "Fudong Liu"}, {"name": "Zheng Shan"}], "author_count": 7}, {"id": "2610.37438", "category": "quant-ph", "title": "Homodyne Unravelling and Parameter Estimation in Squeezed Thermal Baths", "abstract": "We derive an alternative formulation of the stochastic master equation describing the evolution of quantum systems continuously measured via homodyne detection in a squeezed-thermal environment. This formulation allows us to identify two distinct collapse operators, corresponding respectively to the monitored and unmonitored channels, and to express the quantum state evolution directly in terms of Kraus-like operators. As a consequence, it facilitates the application of advanced numerical methods that account for higher-order corrections and discrete-time monitoring, and it also enables the efficient numerical evaluation of Cramér-Rao bounds in parameter estimation problems. To demonstrate the latter, we evaluate the Fisher information of the continuous homodyne monitoring for qubit frequency estimation in the presence of a squeezed-thermal bath. Our results show that exponential scaling of the steady-state Fisher information rate with squeezing is retained even at non-zero temperature.", "url": "https://arxiv.org/abs/2610.37438", "type": "理论+数值", "summary": "我们推导出随机主方程的替代公式，描述了在压缩热环境中通过零差检测连续测量的量子系统的演化。这个公式使我们能够识别两个不同的塌缩算子，分别对应于受监控和不受监控的通道，并直接用类克劳斯算子来表达量子态演化。因此，它促进了先进数值方法的应用，这些方法可以解释高阶校正和离散时间监控，并且还可以在参数估计问题中对 Cramér-Rao 界限进行有效的数值评估。为了证明后者，我们评估了在存在挤压热浴的情况下用于量子位频率估计的连续零差监测的费舍尔信息。我们的结果表明，即使在非零温度下，稳态费舍尔信息率的压缩指数缩放也得以保留。", "authors": [{"name": "Eoin O'Connor"}, {"name": "Francesco Albarelli"}, {"name": "Marco G. Genoni"}], "featured_authors": [{"name": "Eoin O'Connor"}, {"name": "Francesco Albarelli"}, {"name": "Marco G. Genoni"}], "author_count": 3}, {"id": "2610.37493", "category": "quant-ph", "title": "Recovering classical gauge geometry from quantum master constraints", "abstract": "Exact normalizable solutions of quantum constraints form a symplectic submanifold of the space of rays, whereas classical first-class constraints define a surface on which the symplectic form is degenerate. We ask how the degenerate directions can be recovered when quantum theory is regarded as fundamental and the constraints are imposed through a single positive master operator. For a nonnegative master function whose zero set is a Morse--Bott critical manifold, the image of the linearized Hamiltonian vector field is the symplectic orthogonal of the zero set, and coisotropy is equivalent to this linearization having square zero. The image is fixed by the zero set, but the theorem identifies it with the response of the master dynamics, which makes it accessible to quantum states. Three realizations follow. The exact quantum physical space is the opposite, rotational case of the same dichotomy. For quadratic masters, the bottom of the spectrum is $(\\hbar/2)\\Tr_+L$, so first-class zero sets carry no offset of order $\\hbar$; within the harmonic approximation this explains the $\\hbar$ versus $\\hbar^2$ offsets observed in tests of the master-constraint programme. Finally, the second time derivative of the limiting covariance of a semiclassical packet, which can be determined by bounded probes, has the gauge distribution as its image. Two oscillators at fixed total energy give exact master evolution, an exact realization of this covariance shear, and the reduced symplectic limit. For the non-Abelian SL(2,$\\R$) model we compute the coherent and Weyl master symbols, prove essential self-adjointness and a finite-time propagation estimate, and derive the spectral bottom $\\hbar^2/2$.", "url": "https://arxiv.org/abs/2610.37493", "type": "理论", "summary": "量子约束的精确可归一化解形成了射线空间的辛子流形，而经典的一类约束定义了辛形式简并的表面。我们问，当量子理论被视为基础理论并且通过单个正主算子施加约束时，如何恢复简并方向。对于零集为 Morse--Bott 临界流形的非负主函数，线性化哈密顿向量场的图像是零集的辛正交，并且各向同性等效于具有平方零的线性化。图像由零集固定，但定理通过主动力学的响应来识别它，这使得它可以被量子态访问。接下来是三个认识。确切的量子物理空间是同一二分法的相反的旋转情况。对于二次大师，频谱的底部是 $(\\hbar/2)\\Tr_+L$，因此第一类零集不带有 $\\hbar$ 阶的偏移；在谐波近似内，这解释了在主约束程序测试中观察到的 $\\hbar$ 与 $\\hbar^2$ 偏移。\n\n最后，半经典包的极限协方差的二阶时间导数（可以通过有界探针确定）将规范分布作为其图像。固定总能量的两个振荡器给出了精确的主演化、协方差剪切的精确实现以及减少的辛极限。对于非阿贝尔 SL(2,$\\R$) 模型，我们计算相干符号和 Weyl 主符号，证明本质自共轭性和有限时间传播估计，并推导谱底 $\\hbar^2/2$。", "authors": [{"name": "Alejandro Corichi"}], "featured_authors": [{"name": "Alejandro Corichi"}], "author_count": 1}, {"id": "2610.37552", "category": "quant-ph", "title": "Meet-in-the-Middle Compilation of the $[\\mathrm{CNOT}]$ Class with Fibonacci Anyons", "abstract": "Compilation of two-qubit Fibonacci anyon gates is complicated by leakage ($\\ell$) from the four-dimensional computational sector to the fifth state of the fusion space. We construct a GPU pipeline to find low-leakage representatives of the $[\\text{CNOT}]$ class on different subsets of the braid group. We exhaustively explore the full positive five-generator alphabet up to $L=21$ with minimal leakage $\\ell\\sim10^{-3}$ and error $d_{[\\text{CNOT}]}\\sim 10^{-8}$ on it. To reach larger lengths, the search space is successively narrowed to three-generator, boundary-$\\sigma_3$, and palindromic braids, and by considering only the Garside left normal form. These optimizations allow us to reach $L=72$. For $L=69$, a braid with $\\ell\\sim10^{-10}$ and $d_{[\\text{CNOT}]}\\sim 10^{-10}$ is found. In addition to directly enumerating optimal braids, we proved that $\\ell\\in\\mathbb Z[\\varphi]$, and any nonzero leakage obeys an exponential lower bound in the braid length, and obtained the limit laws $F_{3,\\infty}(\\ell)=\\ell^2$ and $F_{5,\\infty}(\\ell)=\\ell^4$ for our sets. Using asymptotics for the distribution function $F$, we showed that for sufficiently long braids, the asymptotics of exhaustive search are better than the asymptotics of random sampling for finding low-leakage braids.", "url": "https://arxiv.org/abs/2610.37552", "type": "理论+数值", "summary": "两个量子位斐波那契任意子门的编译由于从四维计算扇区到融合空间第五状态的泄漏（$\\ell$）而变得复杂。我们构建了一个 GPU 管道，以在编织组的不同子集上查找 $[\\text{CNOT}]$ 类的低泄漏代表。我们详尽地探索了直到 $L=21$ 的完整正五生成器字母表，并且泄漏 $\\ell\\sim10^{-3}$ 和错误 $d_{[\\text{CNOT}]}\\sim 10^{-8}$ 最小。为了达到更大的长度，搜索空间被连续缩小到三元、边界$\\sigma_3$和回文辫子，并且仅考虑加赛德左范式。这些优化使我们能够达到 $L=72$。对于 $L=69$，找到具有 $\\ell\\sim10^{-10}$ 和 $d_{[\\text{CNOT}]}\\sim 10^{-10}$ 的辫子。除了直接枚举最佳辫子之外，我们还证明了$\\ell\\in\\mathbb Z[\\varphi]$，并且任何非零泄漏都服从辫子长度的指数下界，并获得了我们的集合的极限定律$F_{3,\\infty}(\\ell)=\\ell^2$和$F_{5,\\infty}(\\ell)=\\ell^4$。\n\n使用分布函数 $F$ 的渐进性，我们表明，对于足够长的辫子，穷举搜索的渐进性比随机抽样的渐进性更好地寻找低泄漏辫子。", "authors": [{"name": "Matvei Fedin"}, {"name": "Andrey Morozov"}], "featured_authors": [{"name": "Matvei Fedin"}, {"name": "Andrey Morozov"}], "author_count": 2}, {"id": "2610.37635", "category": "quant-ph", "title": "Classical Verification of Quantum Computation Beyond the Polynomial Hierarchy", "abstract": "It is not known whether a classical polynomial-time verifier can verify arbitrary polynomial-time quantum computations with an efficient quantum honest prover without computational assumptions. We show that, relative to a classical oracle, such verification is possible for a language beyond the polynomial hierarchy that is decided exactly in quantum polynomial time. The protocol is public-coin, with perfect completeness and soundness error at most 1/4. To our knowledge, no language with such a proof system was previously proved to lie outside AM relative to an oracle. For every unbounded polynomial-time computable function, the oracle can be chosen so that the message count and the oracle query counts of the quantum algorithm, verifier, and honest prover are bounded by this function of the input length. The message count is optimal up to a constant factor, since for a suitable oracle every interactive proof system for the language uses at least a constant fraction of the messages of our protocol on infinitely many lengths, with a constant depending on its verifier. The language is a variant of recursive Fourier sampling in which code tables encode secrets that address data tables. The tables are evaluated recursively, and the oracle stores only the leaves. The quantum algorithm recovers every secret exactly, and the verifier checks the prover's secrets recursively against random code entries. The recursion restricts the input in a correlated way, as the same secret fixes the code bits and chooses the free coordinate, so Håstad's switching lemma does not apply. We prove a switching theorem for these restrictions, which may be of independent interest. For instances of sufficient height, no constant-depth circuit of size $2^{\\mathrm{poly}(n)}$ changes its output with probability above $2^{-\\Omega(n)}$ when the answer of a random instance is flipped by changing a single leaf.", "url": "https://arxiv.org/abs/2610.37635", "type": "理论+数值", "summary": "目前尚不清楚经典多项式时间验证者是否可以在没有计算假设的情况下使用高效的量子诚实证明者验证任意多项式时间量子计算。我们证明，相对于经典预言机，这种验证对于超出多项式层次结构的语言是可能的，而多项式层次结构是在量子多项式时间内精确决定的。该协议是公币，完整性完美，健全性误差最多1/4。据我们所知，之前没有任何具有这种证明系统的语言被证明位于相对于预言机而言的 AM 之外。对于每个无界多项式时间可计算函数，可以选择预言机，以便量子算法、验证者和诚实证明者的消息计数和预言机查询计数受输入长度的该函数限制。消息计数在常数因子范围内是最佳的，因为对于合适的预言机，该语言的每个交互式证明系统至少使用我们协议的无限多个长度的消息的常数部分，常数取决于其验证者。该语言是递归傅里叶采样的一种变体，其中代码表对寻址数据表的秘密进行编码。\n\n这些表是递归计算的，预言机只存储叶子。量子算法准确地恢复每个秘密，验证者根据随机代码条目递归地检查证明者的秘密。递归以相关方式限制输入，因为相同的秘密固定代码位并选择自由坐标，因此 Håstad 的切换引理不适用。我们证明了这些限制的转换定理，这可能具有独立的意义。对于足够高度的实例，当通过改变单个叶子来翻转随机实例的答案时，大小为 $2^{\\mathrm{poly}(n)}$ 的恒定深度电路不会以高于 $2^{-\\Omega(n)}$ 的概率改变其输出。", "authors": [{"name": "Atul Mantri"}], "featured_authors": [{"name": "Atul Mantri"}], "author_count": 1}, {"id": "2610.37660", "category": "quant-ph", "title": "Optimal quantum discrimination at Liouvillian exceptional points", "abstract": "Central to non-Hermitian sensing is the question of whether exceptional points (EPs) can make weak perturbations easier to detect. We show that despite enhanced spectral response, in finite-dimensional Lindblad systems with a unique stationary state and a nonzero relaxation gap, EPs offer no fundamental advantage in how the observation time required for reliable detection of a weak perturbation scales with the perturbation strength. We nevertheless demonstrate that by selectively choosing perturbations that enhance the quantum Fisher information rate, EPs can shorten the observation time needed to reach a predefined detection accuracy relative to a comparable non-EP reference at the same decay rate. As an illustration, we show using an optomechanical model at an EP that we can detect a weak force through the cavity output at the same reliability in less time than a non-EP reference. Our results establish fundamental limits on perturbation detection at EPs and can guide the design of faster non-Hermitian sensors based on optomechanical resonators, superconducting qubits, and trapped ions.", "url": "https://arxiv.org/abs/2610.37660", "type": "理论", "summary": "非厄米传感的核心问题是异常点 (EP) 是否可以使弱扰动更容易检测。我们表明，尽管光谱响应增强，但在具有独特稳态和非零弛豫间隙的有限维 Lindblad 系统中，EP 在如何可靠检测弱扰动所需的观测时间随扰动强度变化方面没有提供根本优势。尽管如此，我们证明，通过选择性地选择增强量子费希尔信息率的扰动，相对于相同衰减率下的非 EP 参考，EP 可以缩短达到预定检测精度所需的观察时间。作为说明，我们展示了在 EP 上使用光机械模型，我们可以在比非 EP 参考更短的时间内以相同的可靠性检测通过腔输出的弱力。我们的结果确立了 EP 扰动检测的基本限制，并且可以指导基于光机械谐振器、超导量子位和捕获离子的更快非厄米传感器的设计。", "authors": [{"name": "Aritra Ghosh"}, {"name": "M. Bhattacharya"}], "featured_authors": [{"name": "Aritra Ghosh"}, {"name": "M. Bhattacharya"}], "author_count": 2}, {"id": "2610.37665", "category": "quant-ph", "title": "Exact Analytical Treatment of Collectively Pumped Dicke Superradiance", "abstract": "We study the dynamics of an ensemble of $N$ two-level emitters undergoing collective decay at rate $\\Gamma$ and collective incoherent pumping at rate $R$, confined to the fully symmetric Dicke ladder. Although the population dynamics are confined to a finite set of rate equations, their quantum-trajectory representation involves infinitely many pump-decay histories. We derive an exact finite continued fraction for the Laplace-transformed Dicke-state populations by resumming the infinitely many quantum trajectories generated by competing pump and decay processes. Our construction provides a physically transparent interpretation of the tridiagonal resolvent and extends to arbitrary permutationally symmetric initial states. In the strong- and weak-pumping regimes, we obtain perturbative transient solutions. We also identify exact relaxation eigenvalues and emission observables at balanced pump and decay strengths. Our solution provides a starting point for extending trajectory-based analytical methods to more general driven-dissipative collective systems.", "url": "https://arxiv.org/abs/2610.37665", "type": "理论", "summary": "我们研究了 $N$ 两能级发射器集合的动力学，这些发射器以 $\\Gamma$ 速率进行集体衰变，并以 $R$ 速率进行集体非相干泵浦，仅限于完全对称的迪克梯。尽管总体动力学仅限于一组有限的速率方程，但它们的量子轨迹表示涉及无限多个泵浦衰变历史。通过恢复由竞争泵浦和衰变过程产生的无限多个量子轨迹，我们推导出拉普拉斯变换的迪克态布居的精确有限连续分数。我们的构造提供了对三对角解析的物理透明解释，并扩展到任意排列对称初始状态。在强泵浦和弱泵浦状态下，我们获得了扰动瞬态解。我们还确定了平衡泵浦强度和衰减强度下的精确弛豫特征值和发射可观测值。我们的解决方案为将基于轨迹的分析方法扩展到更通用的驱动耗散集体系统提供了一个起点。", "authors": [{"name": "Avishi Poddar"}, {"name": "Nico Baßler"}, {"name": "Julian Lyne"}, {"name": "Susanne F. Yelin"}, {"name": "Helmut Ritsch"}, {"name": "Claudiu Genes"}, {"name": "Raphael Holzinger"}], "featured_authors": [{"name": "Avishi Poddar"}, {"name": "Nico Baßler"}, {"name": "Julian Lyne"}, {"name": "Helmut Ritsch"}, {"name": "Claudiu Genes"}, {"name": "Raphael Holzinger"}], "author_count": 7}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
