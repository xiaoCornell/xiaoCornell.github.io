  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2610.35896", "category": "cond-mat", "title": "Same-spin correlation screens the exchange peak of the electron gas near 2kF", "abstract": "Exchange alone gives the electron gas a local field factor with a sharp peak just below 2kF. Quantum Monte Carlo finds none. Both spin channels are computed here from their lowest diagrams with a dynamically screened interaction and no fitting. Parallel spin correlation is the negative image of exchange and removes about half the peak; the calculated spin-resolved factors account for the QMC data at rs = 1 and 2, and at q = 0 for the compressibility and spin susceptibility obtained from the ground-state energy. The two classes of diagrams are the two terms of the kernel of Hedin's vertex equation, of which the second is routinely dropped.", "url": "https://arxiv.org/abs/2610.35896", "type": "理论+数值", "summary": "仅交换就赋予电子气局部场因子，其尖峰略低于 2kF。量子蒙特卡罗没有发现任何问题。两个自旋通道都是从最低的图表中计算出来的，具有动态筛选的交互作用并且没有拟合。平行自旋相关是交换的负像，消除了大约一半的峰值；计算出的自旋分辨因子考虑了 rs = 1 和 2 时的 QMC 数据，以及 q = 0 时从基态能量获得的可压缩性和自旋敏感性。这两类图是赫定顶点方程的核的两项，其中第二项通常被丢弃。", "authors": [{"name": "Carl A. Kukkonen"}], "featured_authors": [{"name": "Carl A. Kukkonen"}], "author_count": 1}, {"id": "2610.35931", "category": "cond-mat", "title": "An exactly solvable obstructed seam on a lattice Klein bottle: bulk-locked Majorana rings and register-dependent toric codes", "abstract": "We study a frustrated seam produced by literal reflection gluing of Wen's plaquette model on a closed lattice Klein bottle. The seam operators anticommute along two cycles for even circumference and one cycle of twice the length for odd circumference. Their algebra reduces to free Majorana rings, while the commuting bulk stabilizers constrain the allowed ring sectors. This bulk locking yields exact ground energies, excitation gaps and degeneracies, checked by phase-aware Pauli traces and finite-size diagonalization, including two 24-qubit energy predictions. The seam degeneracy is not topological: the single-site seam fields tested split it at second order. We contrast this obstructed gluing with consistent toric-code realizations. An edge register preserves the anyon labels; a Hadamard-dressed site register has colour-dependent seam transport, with ground-state degeneracy 2 or 4 for even circumference and a sign-frustrated exception at odd circumference. For the enumerated lattice isometries and sizes, we compute logical gates and distances, distinguishing abstract qubit relabelling from local hardware depth. Finally, on three 16- and 24-qubit lattices, chiral matter selects a holonomy doublet whose electric-field splitting follows two competing tunnelling routes. These matter results remain finite-size statements. The main result is the exact obstructed-seam solution with bulk sector locking; the register, gate and matter calculations delimit its relation to topological codes.", "url": "https://arxiv.org/abs/2610.35931", "type": "理论+数值", "summary": "我们研究了文的板模型在封闭格子克莱因瓶上的字面反射粘合产生的受挫接缝。对于偶数周长，接缝算子沿两个周期进行反交换；对于奇数周长，接缝算子沿两倍长度的一个周期进行反交换。它们的代数简化为自由马约拉纳环，而通勤散装稳定器则限制了允许的环扇区。这种整体锁定产生精确的基态能量、激发间隙和简并，通过相位感知泡利迹和有限尺寸对角化（包括两个 24 量子位能量预测）进行检查。接缝简并性不是拓扑性的：测试的单点接缝场将其以二阶方式分裂。我们将这种阻塞粘合与一致的环面代码实现进行对比。边缘寄存器保留任意子标签；哈达玛修饰的位点寄存器具有颜色相关的接缝传输，偶数周长的基态简并为 2 或 4，奇数周长的符号受抑异常。对于枚举的晶格等距和大小，我们计算逻辑门和距离，将抽象量子位重新标记与本地硬件深度区分开来。\n\n最后，在三个 16 和 24 量子位晶格上，手性物质选择完整双峰，其电场分裂遵循两条竞争的隧道路径。这些问题结果仍然是有限大小的陈述。主要结果是通过批量扇区锁定实现精确的阻缝解决方案；寄存器、门和物质计算界定了其与拓扑代码的关系。", "authors": [{"name": "Junhao"}, {"name": "Wang"}], "featured_authors": [{"name": "Junhao"}, {"name": "Wang"}], "author_count": 2}, {"id": "2610.35939", "category": "cond-mat", "title": "Planckian dissipation per unit critical entropy as a coupling-free probe of the strange-metal bath", "abstract": "Strange metals pair a resistivity linear in temperature with a specific heat $C/T$ rising logarithmically on cooling. We find that, if electrons scatter off a local critical bath, the coupling cancels in the ratio $Q$ of their coefficients, leaving two measurable numbers: how slowly the bath relaxes, seen in photoemission or optics, and the share of critical entropy that relaxes current. Baths form classes: $Q\\le4.91$ for a conformal bath, as SYK models confirm; 9--15 for the Yukawa--SYK field; and far less for Kondo lattices. LSCO, at $Q\\approx9$, exceeds the conformal bound, pointing to the Yukawa--SYK field.", "url": "https://arxiv.org/abs/2610.35939", "type": "理论", "summary": "奇怪的金属将电阻率与温度呈线性关系，比热 $C/T$ 在冷却时呈对数上升。我们发现，如果电子从局部临界浴散射，耦合会以其系数的比率 $Q$ 抵消，留下两个可测量的数字：在光发射或光学中看到的浴弛豫的速度，以及弛豫电流的临界熵的份额。浴槽形式类别：$Q\\le4.91$ 表示保形浴槽，正如 SYK 模型所确认的那样； 9--15为汤川--SYK油田；对于近藤晶格来说则少得多。 LSCO 位于 $Q\\approx9$，超出了共形边界，指向 Yukawa--SYK 场。", "authors": [{"name": "Dino Škrgić"}, {"name": "Dejan Stojkovic"}], "featured_authors": [{"name": "Dino Škrgić"}, {"name": "Dejan Stojkovic"}], "author_count": 2}, {"id": "2610.35946", "category": "cond-mat", "title": "Machine learning enabled design of sustainable alloys considering real world constraints", "abstract": "Designing sustainable alloys must reconcile high performance with real-world constraints, including feedstock scarcity and variability, processing and energy requirements, regulatory thresholds, and economic limitations. Addressing these constraints reaches far beyond today's conventional performance-focused frameworks. It needs to consider not only complex property-processing-performance trade-offs but also sustainable production pathways. Here, we propose a physics-informed ensemble (PIE) learning framework that integrates fundamental structure-property relationships with processing routes and sustainability criteria for mechanism-based alloy design. It predicts properties from composition-microstructure relationships and infers processing routes under sustainability constraints, establishing an interdisciplinary approach to identifying sustainable alloy solutions. We validate the approach for Mg alloys, a lightweight yet energy-intensive metallic material class, considering performance, cost, and carbon emissions. Trained on a benchmark dataset, the PIE model systematically explores plausible alloy compositions and microstructures to construct a digital library of millions of candidate alloys. From this space, we identify two sustainable Mg alloy solutions that overcome the conventional performance-cost-emission trade-off: a rare-earth-containing alloy increases yield and tensile strength by 72.8 percent and 61.1 percent, respectively, over alloys from the same family at comparable cost and emissions; and a rare-earth-free alloy reduces cost and carbon emissions by 40.4 percent and 88.9 percent, respectively, relative to its primary-feedstock counterpart, without compromising mechanical performance. This work introduces a general, physics-informed, and quantifiable framework for designing sustainable alloys under real-world constraints.", "url": "https://arxiv.org/abs/2610.35946", "type": "理论+数值", "summary": "设计可持续合金必须协调高性能与现实世界的限制，包括原料稀缺性和可变性、加工和能源要求、监管阈值和经济限制。解决这些限制远远超出了当今以性能为中心的传统框架的范围。它不仅需要考虑复杂的财产-加工-性能权衡，还需要考虑可持续的生产途径。在这里，我们提出了一种物理信息集成（PIE）学习框架，它将基本结构-性能关系与基于机制的合金设计的加工路线和可持续性标准相结合。它根据成分-微观结构关系预测性能，并推断可持续性约束下的加工路线，建立跨学科方法来识别可持续合金解决方案。我们验证了镁合金（一种轻质但能源密集型金属材料类别）的方法，同时考虑了性能、成本和碳排放。\n\nPIE 模型在基准数据集上进行训练，系统地探索合理的合金成分和微观结构，以构建包含数百万种候选合金的数字库。从这个领域，我们确定了两种可持续的镁合金解决方案，克服了传统的性能-成本-排放权衡：与成本和排放相当的同类合金相比，含稀土合金的产量和抗拉强度分别提高了 72.8% 和 61.1%；与主要原料相比，不含稀土的合金可分别降低成本和碳排放 40.4% 和 88.9%，且不会影响机械性能。这项工作介绍了一个通用的、基于物理的、可量化的框架，用于在现实世界的限制下设计可持续合金。", "authors": [{"name": "Quan Li"}, {"name": "Zhilong Wang"}, {"name": "Lei Shi"}, {"name": "Baojing Feng"}, {"name": "Changhui Liu"}, {"name": "Jie Wang"}, {"name": "Jingya Wang"}, {"name": "Weisen Zheng"}, {"name": "Matic JovicevicKlug"}, {"name": "Ziyuan Rao"}, {"name": "Jinjin Li"}, {"name": "Dierk Raabe"}, {"name": "Xiaoqin Zeng"}], "featured_authors": [{"name": "Quan Li"}, {"name": "Zhilong Wang"}, {"name": "Lei Shi"}, {"name": "Jinjin Li"}, {"name": "Dierk Raabe"}, {"name": "Xiaoqin Zeng"}], "author_count": 13}, {"id": "2610.35973", "category": "cond-mat", "title": "Bayesian Inference in Partially Observed Critical Systems", "abstract": "We ask how much of a large random system must be observed before a global average can be inferred with controlled uncertainty. For the random transposition shuffle, a conjugate Bayesian estimator of the average displacement, computed from $m$ uniformly sampled cards, has relative uncertainty $1/\\sqrt{2m}$, independent of the deck size $n$. The law of total variance exposes a second error, the floor $R_n$, which arises because the observed configuration is a single draw from equilibrium: no relative tolerance below $\\kappa\\sqrt{R_n}$ can be certified, even by a census. For the shuffle we derive $R_n=(2n^2+7)/\\bigl(5(n-1)^2(n+1)\\bigr)$ and show that the posterior remains calibrated. At the critical point of the two-dimensional Ising model the floor of the energy vanishes, whereas that of the magnetisation stays near $0.072$; its mean-field limit is $\\sqrt{2}-1$. For correlated fields read by sensor networks, the usual 95\\% interval covers the ensemble mean in 7\\% of cases. Bounding the floor from one realisation, as in single-chain Monte Carlo diagnostics, requires an assumption on the decay of correlations.", "url": "https://arxiv.org/abs/2610.35973", "type": "理论+数值", "summary": "我们问，在以受控不确定性推断全局平均值之前，必须观察大型随机系统的多少。对于随机换位洗牌，平均位移的共轭贝叶斯估计量是根据 $m$ 均匀采样的牌计算得出的，具有相对不确定性 $1/\\sqrt{2m}$，与牌组大小 $n$ 无关。总方差定律暴露了第二个错误，即下限 $R_n$，这是因为观察到的配置是从平衡中得出的单一结果：即使通过人口普查，也无法证明低于 $\\kappa\\sqrt{R_n}$ 的相对容差。对于洗牌，我们得出 $R_n=(2n^2+7)/\\bigl(5(n-1)^2(n+1)\\bigr)$ 并表明后验保持校准。在二维伊辛模型的临界点，能量下限消失，而磁化强度保持在 $0.072$ 附近；其平均场极限为$\\sqrt{2}-1$。对于传感器网络读取的相关字段，通常的 95% 区间覆盖了 7% 情况下的整体平均值。正如在单链蒙特卡罗诊断中一样，从一种实现中限制下限需要对相关性衰减做出假设。", "authors": [{"name": "Mihika Singhania"}], "featured_authors": [{"name": "Mihika Singhania"}], "author_count": 1}, {"id": "2610.35979", "category": "cond-mat", "title": "Cutting, Shuffling and Diffusion as a Coarsening Process", "abstract": "Cutting and shuffling (CS) rearranges fluid without stretching, but homogenisation requires diffusion (D); this interaction is not well understood. We show that CSD is a coarsening process, with scale $\\bar\\ell=L(n_c\\mathrm{Pe}/2)^{-1/3}$ rather than the Batchelor scale, and that cutting acts as a fractional Laplacian in wavenumber, giving the exact mixing rate $\\gamma=2^{1/3}|a_1'|n_c^{2/3}\\lambda\\mathrm{Pe}^{-1/3}$ for $n_c$ cuts per event at rate $\\lambda$, with $a_1'=-1.0188\\dots$ the first zero of $\\mathrm{Ai}'$. This holds in any dimension for random and deterministic protocols, extends to finite-time mixing, and places CSD in a known non-equilibrium universality class.", "url": "https://arxiv.org/abs/2610.35979", "type": "理论", "summary": "切割和洗牌（CS）在不拉伸的情况下重新排列流体，但均质化需要扩散（D）；这种相互作用尚不清楚。我们证明 CSD 是一个粗化过程，其尺度 $\\bar\\ell=L(n_c\\mathrm{Pe}/2)^{-1/3}$ 而不是 Batchelor 尺度，并且切割充当波数中的分数拉普拉斯算子，给出精确的混合率 $\\gamma=2^{1/3}|a_1'|n_c^{2/3}\\lambda\\mathrm{Pe}^{-1/3}$对于$n_c$，每个事件的削减率为$\\lambda$，其中$a_1'=-1.0188\\dots$是$\\mathrm{Ai}'$的第一个零。这适用于随机和确定性协议的任何维度，扩展到有限时间混合，并将 CSD 置于已知的非平衡普遍性类别中。", "authors": [{"name": "Daniel Lester"}, {"name": "Tanguy LeBorgne"}, {"name": "Joris Heyman"}], "featured_authors": [{"name": "Daniel Lester"}, {"name": "Tanguy LeBorgne"}, {"name": "Joris Heyman"}], "author_count": 3}, {"id": "2610.36029", "category": "cond-mat", "title": "AlgebrasTQD: Computing Algebras and Interfaces in Twisted Quantum Doubles", "abstract": "We present AlgebrasTQD, an open-source code written in GAP (Groups, Algorithms, and Programming), for computing condensable algebras and the corresponding topological boundaries and interfaces of twisted quantum doubles $D^\\omega(G)$. These algebras can be used to classify 1+1d gapped and gapless phases whose symmetry is related by gauging to a finite group $G$ with anomaly $\\omega\\in H^3(G,U(1))$, to study 2+1d anyon proliferation and to construct logical gates in non-Abelian topological quantum codes. The functions in AlgebrasTQD compute all condensable algebras $A(H,F,\\gamma,\\epsilon)$ with their algebra structure and anyons, sort them into isomorphism classes and identify the twin algebras that are inequivalent but share the same anyon decomposition. AlgebrasTQD also determines all the subalgebra relations, the corresponding Hasse diagram and the types of 1+1d phases for any chosen, possibly non-invertible, group-theoretical symmetry. For non-maximal algebras, the code computes the reduced topological order with its $3$-cocycle and the map of anyons across the topological interface. Finally, AlgebrasTQD includes functions that construct certain non-Clifford logical gates via non-Abelian surface codes. We summarize the formulas that are implemented in the AlgebrasTQD code, and we illustrate its use with Abelian and non-Abelian groups including $\\mathbb{Z}_2^3$ with $\\omega_\\text{III}$, $D_8$, $A_4$ with and without anomaly, twin algebras and twin phases, and the Clifford-hierarchy gates in quantum doubles of dihedral groups. All arithmetic is exact and AlgebrasTQD can be used with any finite group $G$ and 3-cocycle $\\omega$, limited only by the time and size of the calculation. The code is available at this https URL", "url": "https://arxiv.org/abs/2610.36029", "type": "理论+数值", "summary": "我们提出 AlgebrasTQD，这是一种用 GAP（群、算法和编程）编写的开源代码，用于计算可凝聚代数以及扭曲量子双精度数 $D^\\omega(G)$ 的相应拓扑边界和接口。这些代数可用于对 1+1d 有隙相和无隙相进行分类，其对称性通过测量具有异常 $\\omega\\in H^3(G,U(1))$ 的有限群 $G$ 来相关，以研究 2+1d 任意子增殖并在非阿贝尔拓扑量子码中构造逻辑门。 AlgebrasTQD 中的函数计算所有可压缩代数 $A(H,F,\\gamma,\\epsilon)$ 及其代数结构和任意子，将它们分类为同构类，并识别不等价但共享相同任意子分解的孪生代数。 AlgebrasTQD 还确定所有子代数关系、相应的哈斯图以及任何选定的、可能不可逆的群论对称性的 1+1d 相的类型。对于非极大代数，该代码使用其 $3$-cocycle 和拓扑界面上的任意子图来计算简化的拓扑序。\n\n最后，AlgebrasTQD 包括通过非阿贝尔表面码构造某些非 Clifford 逻辑门的函数。我们总结了在 AlgebrasTQD 代码中实现的公式，并说明了其在阿贝尔群和非阿贝尔群中的使用，包括 $\\mathbb{Z}_2^3$ 与 $\\omega_\\text{III}$、$D_8$、$A_4$（有或没有异常）、孪生代数和孪生相，以及二面体群的量子双打中的 Clifford 层次门。所有算术都是精确的，并且 AlgebrasTQD 可以与任何有限群 $G$ 和 3-cocycle $\\omega$ 一起使用，仅受计算时间和大小的限制。该代码可在此 https URL 获取", "authors": [{"name": "Alison Warman"}], "featured_authors": [{"name": "Alison Warman"}], "author_count": 1}, {"id": "2610.36048", "category": "cond-mat", "title": "Typicality of entanglement growth and transport fluctuations in quantum symmetric exclusion processes", "abstract": "We use macroscopic fluctuation theory (MFT) to establish the typicality of charge-transfer statistics and entanglement dynamics in the quantum symmetric exclusion process, a model of stochastically hopping free fermions with diffusive transport and long-range quantum coherence. We show that the leading long-time charge-transfer full counting statistics of individual noise realizations coincide almost surely with those of the classical symmetric exclusion process (SSEP), in equilibrium and following quenches from arbitrary occupation-diagonal product states. Our results apply to transient fluctuations in the thermodynamic limit, extending previous work that has primarily focused on stationary regimes. Our approach compares the noise averages of the charge-transfer generating function and its inverse. The former reduces to SSEP, while the latter maps to an auxiliary Brownian energy process whose MFT saddle-point problem is related to that of SSEP, yielding matching large-deviation exponents. Through free-fermion identities relating entanglement to subsystem-number fluctuations, this establishes the self-averaging of the covariance-matrix eigenvalue distribution and of Rényi and von Neumann entropies. We obtain asymptotically exact predictions for entanglement growth from domain-wall and Néel initial states, in excellent agreement with numerical simulations.", "url": "https://arxiv.org/abs/2610.36048", "type": "理论+数值", "summary": "我们利用宏观涨落理论（MFT）建立了量子对称排斥过程中电荷转移统计和纠缠动力学的典型性，这是一种具有扩散传输和长程量子相干性的随机跳跃自由费米子模型。我们表明，在平衡状态和任意占据对角积态的猝灭状态下，各个噪声实现的主要长期电荷转移全计数统计几乎肯定与经典对称排除过程（SSEP）的统计一致。我们的结果适用于热力学极限的瞬态波动，扩展了之前主要关注稳态的工作。我们的方法比较了电荷转移生成函数及其反函数的噪声平均值。前者简化为SSEP，而后者映射到辅助布朗能量过程，其MFT鞍点问题与SSEP的鞍点问题相关，产生匹配的大偏差指数。\n\n通过将纠缠与子系统数涨落相关的自由费米子恒等式，建立了协方差矩阵特征值分布以及 Rényi 和冯诺依曼熵的自平均。我们从畴壁和尼尔初始态获得了对纠缠增长的渐近精确预测，与数值模拟非常一致。", "authors": [{"name": "Ewan McCulloch"}], "featured_authors": [{"name": "Ewan McCulloch"}], "author_count": 1}, {"id": "2610.36054", "category": "cond-mat", "title": "Mesons, Confinement, and Complexity: A Krylov Space Perspective on the Long-Range Ising Chain", "abstract": "We investigate the interplay between confinement and Krylov complexity in the long-range transverse-field Ising chain, where power-law interactions $\\sim 1/r^{\\alpha}$ generate an effective confining potential between domain walls without an explicit symmetry-breaking field. Using the time-averaged Krylov state complexity after a quench as a diagnostic, we find that the complexity is strongly suppressed and only weakly system size-dependent at small $\\alpha$ and small transverse field $h_x$, where confinement is strongest, and crosses over to rapid growth at larger $\\alpha$, where it increases with system size. Within the confined regime, the oscillation frequencies of the complexity agree with the meson masses of an effective two-kink model, with the dominant frequency growing linearly with the lightest meson mass and the time-averaged complexity decreasing approximately as its inverse square. We further study operator Krylov complexity at finite temperature using the Wightman inner product. At low temperature, it exhibits bounded oscillations that directly encode the meson spectrum, whereas this structure is progressively washed out as the temperature increases. These results identify Krylov complexity as a spectroscopic probe of interaction-induced confinement and reproduce, in a microscopic lattice model, the hallmarks of Krylov complexity identified in confining field theories.", "url": "https://arxiv.org/abs/2610.36054", "type": "理论", "summary": "我们研究了长程横向场伊辛链中限制和克雷洛夫复杂性之间的相互作用，其中幂律相互作用 $\\sim 1/r^{\\alpha}$ 在畴壁之间产生有效的限制势，而没有明确的对称破缺场。使用失超后的时间平均 Krylov 状态复杂度作为诊断，我们发现复杂度被强烈抑制，并且在小 $\\alpha$ 和小横向场 $h_x$ 处仅弱依赖于系统尺寸，其中限制最强，并且在较大 $\\alpha$ 处交叉到快速增长，其中随着系统尺寸的增加而增加。在受限范围内，复杂性的振荡频率与有效双扭结模型的介子质量一致，主频率随着最轻的介子质量线性增长，并且时间平均复杂性大约以其平方反比减小。我们使用 Wightman 内积进一步研究有限温度下的算子 Krylov 复杂性。在低温下，它表现出直接编码介子谱的有界振荡，而随着温度升高，这种结构逐渐被消除。\n\n这些结果将克雷洛夫复杂性确定为相互作用引起的限制的光谱探针，并在微观晶格模型中再现了限制场论中确定的克雷洛夫复杂性的标志。", "authors": [{"name": "Xuhao Jiang"}, {"name": "Jad C. Halimeh"}, {"name": "N. S. Srivatsa"}], "featured_authors": [{"name": "Xuhao Jiang"}, {"name": "Jad C. Halimeh"}, {"name": "N. S. Srivatsa"}], "author_count": 3}, {"id": "2610.36058", "category": "cond-mat", "title": "Universal Scaling of Conditional Mutual Information in Classical Stochastic Dynamics", "abstract": "Conditional mutual information (CMI) characterizes dependence between two regions conditioned on an intervening buffer. Its characteristic decay length, the Markov length, has recently been identified as a diverging length scale at mixed-state phase transitions. Here, we investigate CMI dynamics in one-dimensional classical stochastic models and propose a universal scaling form for systems whose Markov length diverges with time. We derive this form in the inactive phase of parity-conserving directed percolation, where domain-wall coarsening generates a growing length scale and a self-similar probability distribution. We introduce a Hankel-based truncation scheme that enables matrix-product-state simulations at long times and over large spatial regions. Using this method, we verify the proposed scaling both in the inactive phase and at the nonequilibrium critical point, where the dynamical critical exponent governs Markov-length growth. More broadly, the same scaling form captures cases in which collective inference sets the diverging Markov length. Despite these distinct mechanisms, the CMI between fixed microscopic regions exhibits a common scaling dimension of two. Finally, we extend this framework to temporal CMI, establishing an analogous relation between the strength of conditional dependence in time domain and its characteristic memory time.", "url": "https://arxiv.org/abs/2610.36058", "type": "理论+数值", "summary": "条件互信息 (CMI) 描述了以中间缓冲区为条件的两个区域之间的依赖关系。其特征衰减长度，即马尔可夫长度，最近被确定为混合态相变的发散长度尺度。在这里，我们研究一维经典随机模型中的 CMI 动力学，并为马尔可夫长度随时间发散的系统提出一种通用标度形式。我们在宇称守恒定向渗透的非活动阶段推导出这种形式，其中畴壁粗化产生不断增长的长度尺度和自相似的概率分布。我们引入了一种基于 Hankel 的截断方案，可以在长时间和大空间区域上进行矩阵乘积状态模拟。使用这种方法，我们在非活动阶段和非平衡临界点验证了所提出的缩放比例，其中动态临界指数控制马尔可夫长度增长。更广泛地说，相同的缩放形式捕获了集体推理设置发散马尔可夫长度的情况。尽管有这些不同的机制，固定微观区域之间的 CMI 仍表现出共同的缩放维度为 2。\n\n最后，我们将该框架扩展到时间 CMI，在时域条件依赖性强度与其特征记忆时间之间建立类似关系。", "authors": [{"name": "Songlei Wang"}, {"name": "Chenguang Liang"}, {"name": "Zhi-Cheng Yang"}], "featured_authors": [{"name": "Songlei Wang"}, {"name": "Chenguang Liang"}, {"name": "Zhi-Cheng Yang"}], "author_count": 3}, {"id": "2610.36071", "category": "cond-mat", "title": "The Glass Transition: From Competing Theories to Discriminating Tests", "abstract": "The dramatic slowing down of liquids approaching the glass transition remains unresolved, partly because competing theoretical explanations are difficult to discriminate. Indeed, several mature, contrasting frameworks account for the main features of glassy phenomenology, making agreement with familiar observations a weak basis for identifying the microscopic mechanism responsible for the slowdown. Recent numerical advances are changing this situation in two complementary ways. Deep equilibration extends controlled equilibrium studies into regimes previously accessible only by extrapolation, allowing established predictions to be stress-tested over a broader dynamical range. At the same time, new numerical methods increasingly provide direct access to theory-specific quantities such as configurational entropy, static lengths, elastic properties, and local activation barriers. I discuss how these developments constrain thermodynamic, facilitation-based, elastic, and excitation-based descriptions. The emerging picture is not yet a unique theory, but a set of increasingly discriminating tests that can reveal where apparently successful laws cease to be universal and identify the microscopic ingredients that causally control the activation barrier.", "url": "https://arxiv.org/abs/2610.36071", "type": "理论+数值", "summary": "液体接近玻璃化转变的急剧减慢仍未得到解决，部分原因是相互竞争的理论解释很难区分。事实上，几个成熟的、对比鲜明的框架解释了玻璃现象学的主要特征，使得与熟悉的观察一致成为识别导致减速的微观机制的薄弱基础。最近的数值进展正在以两种互补的方式改变这种情况。深度平衡将受控平衡研究扩展到以前只能通过外推法才能实现的状态，从而允许在更广泛的动态范围内对既定的预测进行压力测试。与此同时，新的数值方法越来越多地提供对理论特定量的直接访问，例如构型熵、静态长度、弹性属性和局部激活势垒。我讨论这些发展如何限制热力学、基于促进、弹性和基于激励的描述。\n\n正在出现的图景还不是一个独特的理论，而是一组越来越具有辨别力的测试，可以揭示表面上成功的定律在哪里不再具有普遍性，并确定因果控制激活屏障的微观成分。", "authors": [{"name": "Massimo Pica Ciamarra"}], "featured_authors": [{"name": "Massimo Pica Ciamarra"}], "author_count": 1}, {"id": "2610.36104", "category": "cond-mat", "title": "A 3D-$Δ$PDF-like measure for hidden anisotropy in disordered materials", "abstract": "We introduce a simple correlation function for quantifying hidden local anisotropy in disordered materials. Developed in analogy with the three-dimensional difference pair distribution function (3D-$\\Delta$PDF), our approach identifies structural correlations that are lost through averaging over bulk symmetry. The same approach might be applied to models of disordered crystals, amorphous materials, and liquids alike.", "url": "https://arxiv.org/abs/2610.36104", "type": "理论", "summary": "我们引入了一个简单的相关函数来量化无序材料中隐藏的局部各向异性。我们的方法与三维差分对分布函数 (3D-$\\Delta$PDF) 类似，可识别通过对体对称性进行平均而丢失的结构相关性。相同的方法可以应用于无序晶体、无定形材料和液体等的模型。", "authors": [{"name": "Helena Barker"}, {"name": "Thomas C. Nicholas"}, {"name": "Andrew L. Goodwin"}], "featured_authors": [{"name": "Helena Barker"}, {"name": "Thomas C. Nicholas"}, {"name": "Andrew L. Goodwin"}], "author_count": 3}, {"id": "2610.36115", "category": "cond-mat", "title": "Coulomb- and exchange-driven redistribution of spectral correlations", "abstract": "Electronic correlations reorganize not only the energies of individual electronic states but also the collective structure of the spectrum. Here, first-principles density functional theory calculations combined with random-matrix spectral statistics are used to examine this reorganization in gamma-Ce within a static spin-polarized DFT+U+SOC description. We distinguish the effects of the Coulomb interaction U from those of the exchange interaction J by analyzing nearest-neighbor spacings, reduced spacing ratios, band velocities, and band curvatures across the Ce-4f manifold. Increasing U does not produce a monotonic transition between Poisson- and Wigner-Dyson-like statistics; instead, the region of strongest level repulsion migrates across the 4f manifold as the interaction increases. Exchange produces a qualitatively different response. At fixed U, strongly repulsive and strongly clustered spectral regions coexist within the same 4f manifold even while the total spin moment and 4f occupation remain nearly unchanged. The clustering persists after resolving the spectrum into its dominant j = 5/2 and j = 7/2 components and differs strongly between calculations having the same numerical value of U-J. Within the present DFT+U+SOC description, the spectral response therefore depends on the separate Coulomb and exchange interactions and cannot be represented completely by a single effective U-J parameter. These results show that energy- and character-resolved spectral statistics expose correlation-driven electronic reorganization that is hidden by conventional integrated observables.", "url": "https://arxiv.org/abs/2610.36115", "type": "理论+数值", "summary": "电子关联不仅重组了各个电子态的能量，而且重组了光谱的集体结构。在这里，第一性原理密度泛函理论计算与随机矩阵光谱统计相结合，用于在静态自旋极化 DFT+U+SOC 描述中检查 gamma-Ce 中的这种重组。我们通过分析 Ce-4f 流形上的最近邻间距、缩减间距比、能带速度和能带曲率，区分库仑相互作用 U 的影响和交换相互作用 J 的影响。增加 U 不会在类泊松统计量和类维格纳戴森统计量之间产生单调过渡；相反，随着相互作用的增加，最强能级排斥的区域会迁移到 4f 流形上。交换会产生性质不同的反应。在固定 U 处，即使总自旋矩和 4f 占据几乎保持不变，强排斥和强聚集光谱区域也共存于同一 4f 流形内。\n\n将谱解析为其主要的 j = 5/2 和 j = 7/2 分量后，聚类仍然存在，并且在具有相同 U-J 数值的计算之间存在很大差异。在当前的 DFT+U+SOC 描述中，光谱响应因此取决于单独的库仑和交换相互作用，并且不能完全由单个有效的 U-J 参数表示。这些结果表明，能量和特征分辨的光谱统计揭示了传统综合可观测值隐藏的相关驱动的电子重组。", "authors": [{"name": "Zanya Gonzalez Tellez"}, {"name": "Miguel Angel Ocaña Bribiesca"}], "featured_authors": [{"name": "Zanya Gonzalez Tellez"}, {"name": "Miguel Angel Ocaña Bribiesca"}], "author_count": 2}, {"id": "2610.36118", "category": "cond-mat", "title": "Ensemble-dependent condensate statistics and correlations in an ideal Bose gas", "abstract": "The choice of statistical ensemble has a measurable impact on the statistical description of Bose-Einstein condensates beyond the well-known grand canonical anomaly. We develop a segmented-contour approach for the ideal Bose gas, which refines the saddle-point approximation by including non-Gaussian corrections in the canonical and microcanonical ensembles. The method applies to a broad class of noninteracting spectra, and provides efficient access to condensate fluctuations, higher moments, and correlation functions. For a three-dimensional harmonic trap with fixed anisotropy, we find that the ratio of the maxima of the microcanonical and canonical condensate-number variances approaches the theoretically predicted asymptotic value $1-3\\zeta(3)^2/[4\\zeta(2)\\zeta(4)]\\approx 0.391$ only extremely slowly with increasing particle number. We also show that ensemble effects are visible in the second-order correlation function $g^{(2)}(x)$ near the condensation crossover. After ballistic release from a three-dimensional harmonic trap, the time evolution of $g^{(2)}(x)$ preserves the differences between statistical ensembles.", "url": "https://arxiv.org/abs/2610.36118", "type": "理论", "summary": "统计系综的选择对玻色-爱因斯坦凝聚态的统计描述具有可测量的影响，超出了众所周知的大正则异常。我们为理想玻色气体开发了一种分段轮廓方法，该方法通过在规范和微规范系综中包含非高斯校正来细化鞍点近似。该方法适用于广泛的非相互作用光谱，并提供对凝聚态涨落、高矩和相关函数的有效访问。对于具有固定各向异性的三维谐波陷阱，我们发现随着粒子数的增加，微正则和正则凝聚数方差的最大值之比接近理论预测渐近值 $1-3\\zeta(3)^2/[4\\zeta(2)\\zeta(4)]\\approx 0.391$ 的速度非常缓慢。我们还表明，在凝结交叉点附近的二阶相关函数 $g^{(2)}(x)$ 中可以看到系综效应。从三维谐波陷阱弹道释放后，$g^{(2)}(x)$ 的时间演化保留了统计系综之间的差异。", "authors": [{"name": "Szymon Augustynowicz"}, {"name": "Jan Okoński"}, {"name": "Maciej B. Kruk"}, {"name": "Ilja Zebergs"}, {"name": "Jan Joachim Arlt"}, {"name": "Kazimierz Rzążewski"}, {"name": "Krzysztof Pawłowski"}], "featured_authors": [{"name": "Szymon Augustynowicz"}, {"name": "Jan Okoński"}, {"name": "Maciej B. Kruk"}, {"name": "Jan Joachim Arlt"}, {"name": "Kazimierz Rzążewski"}, {"name": "Krzysztof Pawłowski"}], "author_count": 7}, {"id": "2610.36135", "category": "cond-mat", "title": "Physical structure as an organizing principle for universal Hamiltonian learning", "abstract": "Density functional theory (DFT) gives the electronic structure of materials, but its cost limits large-supercell calculations and materials screening. Machine-learned Hamiltonians bypass the self-consistent cycle but are usually system-specific; universal ones could cover new compositions and disordered solids. Such models must generalize across chemistry and keep downstream properties physical, while staying inexpensive for large cells. Here we introduce UniTB, a universal E(3) equivariant Hamiltonian representation framework that integrates physical priors rooted in density-functional tight-binding theory with deep learning. UniTB's network, which corrects a prior Hamiltonian, generalizes across chemistry through a mixture of experts routed by that prior and a charge-equilibration head as in self-consistent-charge tight binding. A projection bounds band shifts from the prior, suppressing spurious states and keeping downstream properties physical. We provide the fastest SO(2) tensor-product GPU kernels for the network. The variant UniTB-Flash assembles its prior from two-center tables at $O(N)$ cost for $N$ atoms, against $O(N\\log N)$ on a grid. Trained on 29,242 crystals, UniTB reaches a 0.48 meV matrix-element error on nonmagnetic test crystals spanning 68 elements. Without amorphous training data, both models agree with DFT optics and conductivity of amorphous Ge-Sb-Te. UniTB-Flash ranks candidates with no significant difference from UniTB, whose property values are more accurate; together they screen 16,195 crystals for five application domains of industrial relevance.", "url": "https://arxiv.org/abs/2610.36135", "type": "理论+数值", "summary": "密度泛函理论（DFT）给出了材料的电子结构，但其成本限制了大型超晶胞计算和材料筛选。机器学习的哈密顿量绕过了自洽循环，但通常是特定于系统的；通用的可以涵盖新的组合物和无序固体。此类模型必须能够推广到整个化学领域，并保持下游物理特性，同时保持大电池的廉价性。在这里，我们介绍 UniTB，一个通用的 E(3) 等变哈密顿表示框架，它将植根于密度泛函紧束缚理论的物理先验与深度学习相结合。 UniTB 的网络纠正了先前的哈密顿量，通过由先前的哈密顿量和电荷平衡头路由的专家混合来概括整个化学，就像自洽电荷紧密结合一样。投影限制了先前的能带偏移，抑制了杂散状​​态并保持了下游特性的物理性。我们为网络提供最快的 SO(2) 张量积 GPU 内核。变体 UniTB-Flash 以 $N$ 个原子的 $O(N)$ 成本从两个中心表组装其先验，而网格上的 $O(N\\log N)$ 则为 $O(N\\log N)$。\n\n在 29,242 个晶体上进行训练后，UniTB 在跨越 68 个元件的非磁性测试晶体上达到了 0.48 meV 矩阵元件误差。在没有非晶训练数据的情况下，两个模型都符合非晶 Ge-Sb-Te 的 DFT 光学和电导率。 UniTB-Flash对候选者进行排名与UniTB没有显着差异，其属性值更准确；他们共同筛选了 16,195 种晶体，用于五个工业相关应用领域。", "authors": [{"name": "Mingkang Liu"}, {"name": "Zhanghao Zhouyin"}, {"name": "Guanghui Wang"}, {"name": "Daye Zheng"}, {"name": "Lei Shen"}, {"name": "Qiangqiang Gu"}], "featured_authors": [{"name": "Mingkang Liu"}, {"name": "Zhanghao Zhouyin"}, {"name": "Guanghui Wang"}, {"name": "Daye Zheng"}, {"name": "Lei Shen"}, {"name": "Qiangqiang Gu"}], "author_count": 6}, {"id": "2610.36199", "category": "cond-mat", "title": "Three-dimensional quantum Hall insulators in magnetic pyrochlore systems", "abstract": "We show that a class of pyrochlore materials provides a route to realize 3D Quantum Hall insulators, based on magnetic texture and flat band interference. We study itinerant electrons on a pyrochlore lattice Kondo-coupled to localized moments living on another interpenetrating pyrochlore lattice, with the moments forming a field-selected three-in/one-out texture. The noncoplanar texture generates complex spin-dependent hopping amplitudes and unequal local exchange energies, reconstructing the compact-localized parent flat bands into narrow bands separated by a global three-dimensional gap. The low-energy states are concentrated predominantly on kagome planes within the three-dimensional lattice, reflecting the combined effects of quantum interference and the texture-induced sublattice potential. When the lowest band is fully occupied, the response is characterized by a Chern triplet $\\mathbf{C}=(1,1,1)$ and reciprocal Hall vector $\\mathbf{G}_{\\mathrm{H}}=(2\\pi/a)(1,1,1)$, giving $\\sigma_{yz}=\\sigma_{zx}=\\sigma_{xy}=e^2/(ha)$. The quantized bulk Hall response enforces chiral surface spectral flow, visible as noncontractible Fermi loops at the surface. Our work opens a new direction in the search for three-dimensional quantum Hall physics in magnetic pyrochlore systems, and suggests a broad design principle based on the interplay of magnetic texture and flat-band interference.", "url": "https://arxiv.org/abs/2610.36199", "type": "理论", "summary": "我们展示了一类烧绿石材料提供了一种基于磁性纹理和平带干涉来实现 3D 量子霍尔绝缘体的途径。我们研究了烧绿石晶格上的巡回电子与另一个互穿烧绿石晶格上的局部矩的近藤耦合，这些矩形成了场选择的三进一出纹理。非共面纹理产生复杂的自旋相关跳跃幅度和不等的局部交换能量，将紧凑局部的母平带重建为由全局三维间隙分隔的窄带。低能态主要集中在三维晶格内的戈薇平面上，反映了量子干涉和织构引起的亚晶格势的综合效应。当最低频带被完全占据时，响应由陈三元组 $\\mathbf{C}=(1,1,1)$ 和倒数霍尔向量 $\\mathbf{G}_{\\mathrm{H}}=(2\\pi/a)(1,1,1)$ 表征，给出$\\sigma_{yz}=\\sigma_{zx}=\\sigma_{xy}=e^2/(ha)$。量子化的体霍尔响应增强了手性表面光谱流，在表面可见为不可收缩的费米环。\n\n我们的工作为磁性烧绿石系统中三维量子霍尔物理的探索开辟了新的方向，并提出了基于磁性纹理和平带干涉相互作用的广泛设计原理。", "authors": [{"name": "Ze-Xun Lin"}, {"name": "Robert-Jan Slager"}, {"name": "Claudio Castelnovo"}], "featured_authors": [{"name": "Ze-Xun Lin"}, {"name": "Robert-Jan Slager"}, {"name": "Claudio Castelnovo"}], "author_count": 3}, {"id": "2610.36214", "category": "cond-mat", "title": "A cascade of orbital-field-driven phases with a Lifshitz-type transition to unidirectional spiral order", "abstract": "Frustration in magnetic systems gives rise to unconventional orders and exotic spin liquids. Here, we explore a new type of frustration arising from an intrinsic bond-dependent orbital-field that couples orbital degrees of freedom to spin correlations. Introducing this orbital-field interaction into the antiferromagnetic Heisenberg model on the honeycomb lattice, we show that local spin-orbital constraints generate a subextensive degeneracy, lifted by order-by-disorder to select distinct collinear magnets in a cascade of phases as the orbital field increases from a para-orbital liquid. At larger fields, the selected phase gives way to an incommensurate unidirectional spiral that spontaneously breaks chiral symmetry. This transition is driven by the coupling of a Goldstone mode to gapped dynamical spin-orbital fluctuations. The spin stiffness becomes negative along a particular direction, while the spiral wavevector grows as the square root of the distance from the transition, signaling a Lifshitz-type transition. We present a microscopic route to realizing this orbital field and discuss candidate materials.", "url": "https://arxiv.org/abs/2610.36214", "type": "理论", "summary": "磁系统中的挫败会产生非常规有序和奇异的自旋液体。在这里，我们探索了一种新型的挫败感，这种挫败感是由内在的键相关轨道场产生的，该轨道场将轨道自由度与自旋相关性耦合起来。将这种轨道场相互作用引入蜂窝晶格的反铁磁海森堡模型中，我们表明，局部自旋轨道约束会产生次广泛的简并性，随着轨道场从准轨道液体增加，通过逐序提升，以在级联中选择不同的共线磁体。在较大的场中，选定的相让位于不相称的单向螺旋，该螺旋会自发地破坏手性对称性。这种转变是由戈德斯通模式与带隙动态自旋轨道涨落的耦合驱动的。自旋刚度沿特定方向变为负值，而螺旋波矢以距跃迁距离的平方根增长，这标志着利夫希茨型跃迁。我们提出了实现该轨道场的微观途径并讨论了候选材料。", "authors": [{"name": "Hiroki Nakai"}, {"name": "Hae-Young Kee"}], "featured_authors": [{"name": "Hiroki Nakai"}, {"name": "Hae-Young Kee"}], "author_count": 2}, {"id": "2610.36318", "category": "cond-mat", "title": "Ratchet Effects for Swarmalators on Asymmetric Substrates", "abstract": "Swarmalators are particles which have internal degrees of freedom in the form of phase oscillators that can synchronize and change the dynamics of the particles. We explore the active matter disk swarmalator model proposed by Adorjáni [Phys. Rev. E 109, 024607 (2024)] where there is an additional attraction or repulsion determined by whether the phases of particles within a certain radius synchronize or anti-synchronize. This model in the absence of swarmalator rules forms a motility-induced phase-separated (MIPS) state at high activity, but when the swarmalator rules are present, a number of additional states appear including an active gel, labyrinth state, frustrated MIPS, and frustrated fluid states. Here we examine ratchet effects for the Adorjáni model coupled to asymmetric substrates. We find that swarmalator interactions can strongly enhance or suppress active matter ratcheting depending on the structural state of the system, and show that the ratchet efficiency depends on the substrate strength, substrate lattice spacing, and the motor force on the particles. The gel state exhibits the weakest ratcheting for small substrate spacing and can even produce a reversed ratchet motion, but shows the strongest ratcheting for large motor forces. The labyrinth state exhibits the strongest ratcheting over a wide range of parameters since the quasi-one-dimensional labyrinth morphology can match the substrate geometry well.", "url": "https://arxiv.org/abs/2610.36318", "type": "理论", "summary": "Swarmalators 是具有相位振荡器形式的内部自由度的粒子，可以同步和改变粒子的动力学。我们探索 Adorjáni [Phys. Rev. E 109, 024607 (2024)]其中存在额外的吸引或排斥，由一定半径内的粒子的相位是否同步或反同步决定。在没有集群规则的情况下，该模型在高活性下形成运动诱导相分离 (MIPS) 状态，但当存在集群规则时，会出现许多其他状态，包括活性凝胶、迷宫状态、受挫 MIPS 和受挫流体状态。在这里，我们研究了与不对称基底耦合的 Adorjáni 模型的棘轮效应。我们发现，集群器相互作用可以根据系统的结构状态强烈增强或抑制活性物质棘轮，并表明棘轮效率取决于基底强度、基底晶格间距和粒子上的动力。\n\n凝胶状态对于小基板间距表现出最弱的棘轮运动，甚至可以产生反向棘轮运动，但对于大动力表现出最强的棘轮运动。由于准一维迷宫形态可以很好地匹配基底几何形状，迷宫状态在各种参​​数上表现出最强的棘轮。", "authors": [{"name": "B. Albert"}, {"name": "A. Libal"}, {"name": "C.J.O. Reichhardt"}, {"name": "C. Reichhardt"}], "featured_authors": [{"name": "B. Albert"}, {"name": "A. Libal"}, {"name": "C.J.O. Reichhardt"}, {"name": "C. Reichhardt"}], "author_count": 4}, {"id": "2610.36332", "category": "cond-mat", "title": "Large superconducting diode effect indicates nonuniform triplet pairing in UTe2", "abstract": "The superconducting diode effect (SDE) is characterized by unequal critical current magnitudes for opposite-polarity current flow, owing to broken spatial-inversion and time-reversal symmetries. For a superconducting pair wavefunction to spontaneously break inversion symmetry implies the formation of Cooper pairs with nonzero momentum, yielding a nonuniform superconducting state. For singlet superconductors, the formation of such a (FFLO) state has long been understood to provide an escape from high field Pauli pair-breaking -- how and why such an effect might occur for equal spin pairing is an open question. Here we report the observation of a large SDE in bulk specimens of the three-dimensional heavy-fermion triplet superconductor UTe$_2$, with a peak diode efficiency of 33% at the high magnetic field strength of 33.6 T, representing the highest-field observation of the SDE to date. Crucially, this nonreciprocal transport is strictly confined to a narrow field regime where superconductivity coexists with a field-induced spin-polarized state near a first-order metamagnetic phase boundary. The absence of the SDE away from this slender phase-intersection argues strongly against purely extrinsic vortex pinning asymmetries. Instead, our findings indicate spontaneous inversion symmetry breaking accompanied by finite-momentum Cooper pairing. We model this behavior using a phenomenological Ginzburg-Landau theory, demonstrating that the intertwining of magnetic and triplet superconducting orders can stabilize an odd-parity FFLO state.", "url": "https://arxiv.org/abs/2610.36332", "type": "理论", "summary": "超导二极管效应 (SDE) 的特点是，由于空间反转和时间反转对称性被破坏，相反极性电流的临界电流大小不相等。对于超导对波函数来说，自发打破反演对称性意味着形成具有非零动量的库珀对，从而产生非均匀超导态。对于单线态超导体，这种（FFLO）态的形成长期以来一直被认为可以避免高场泡利对断裂——对于相等的自旋配对如何以及为什么会发生这种效应是一个悬而未决的问题。在这里，我们报告了在三维重费米子三重态超导体 UTe$_2$ 的大块样本中观察到的大型 SDE，在 33.6 T 的高磁场强度下峰值二极管效率为 33%，代表了迄今为止 SDE 的最高场观测。至关重要的是，这种不可逆输运严格限制在狭窄的场范围内，其中超导性与一阶变磁相边界附近的场诱导自旋极化态共存。\n\n远离这个细长相交处不存在 SDE 强烈反对纯粹的外在涡旋钉扎不对称性。相反，我们的研究结果表明自发反演对称性破缺伴随着有限动量库珀配对。我们使用唯象金兹堡-朗道理论对这种行为进行建模，证明磁性和三重态超导序的交织可以稳定奇宇称 FFLO 状态。", "authors": [{"name": "Zheyu Wu"}, {"name": "Daniel Shaffer"}, {"name": "Dmitry V. Chichinadze"}, {"name": "Mengmeng Long"}, {"name": "Hanyi Chen"}, {"name": "Andrej Cabala"}, {"name": "Theodore I. Weinberger"}, {"name": "Maurice Bal"}, {"name": "Steffen Wiedmann"}, {"name": "Dave Graf"}, {"name": "Vladimir Sechovský"}, {"name": "Michal Vališka"}, {"name": "F. Malte Grosche"}, {"name": "Alex Levchenko"}, {"name": "Alexander G. Eaton"}], "featured_authors": [{"name": "Zheyu Wu"}, {"name": "Daniel Shaffer"}, {"name": "Dmitry V. Chichinadze"}, {"name": "F. Malte Grosche"}, {"name": "Alex Levchenko"}, {"name": "Alexander G. Eaton"}], "author_count": 15}, {"id": "2610.36400", "category": "cond-mat", "title": "p-Adic statistical field theory of fluctuation effects in hierarchical neural networks", "abstract": "The Buice-Cowan field theory [PRE 75, 051919 (2007)] describes fluctuations and correlations of neural activity through a path integral whose mean-field limit is the Wilson-Cowan equation and whose critical behavior belongs to the directed percolation class. In its continuum limit the neurons are the points of a Euclidean space and activity spreads by ordinary diffusion, which encodes neither the hierarchical organization of cortical networks nor their small-world property. We formulate a version of the theory in which the neurons are organized in an infinite, self-similar, tree-like structure, described by the p-adic numbers. The path integral carries over unchanged, and finite networks are exact restrictions of the continuum theory. The main change is in the linear response: in the Euclidean theory every short-range kernel reduces to the Laplacian, while in the p-adic theory each connectivity kernel gives its own nonlocal p-adic diffusion operator. For couplings that decay by a fixed factor per level of the hierarchy this is the Taibleson-Vladimirov operator, and the critical theory is an ultrametric Reggeon field theory whose upper critical dimension is twice the decay exponent of the coupling. Hence the decay of the coupling up the hierarchy, and not the dimension of space, decides whether mean-field exponents apply. We obtain a Ginzburg-type criterion, loop-corrected hierarchical Wilson-Cowan equations, log-periodic corrections to scaling and power-law correlations. Exact simulations on a tree support the predictions: the avalanche-size exponent takes the mean-field value 3/2 when the coupling decays slowly and decreases toward the directed-percolation value when it decays fast. The hierarchical network is also small-world when the decay exponent is smaller than the dimension, a property that the Euclidean theory obtains only by assuming long-range coupling.", "url": "https://arxiv.org/abs/2610.36400", "type": "理论+数值", "summary": "Buice-Cowan 场论 [PRE 75, 051919 (2007)] 通过路径积分描述神经活动的波动和相关性，该路径积分的平均场极限是 Wilson-Cowan 方程，其临界行为属于定向渗流类。在其连续统极限内，神经元是欧几里得空间的点，并且活动通过普通扩散传播，它既不编码皮质网络的层次结构，也不编码它们的小世界属性。我们制定了该理论的一个版本，其中神经元被组织成无限的、自相似的树状结构，由 p 进数描述。路径积分保持不变，有限网络是连续统理论的精确限制。主要变化在于线性响应：在欧几里得理论中，每个短程核都简化为拉普拉斯算子，而在 p-adic 理论中，每个连通核都给出自己的非局部 p-adic 扩散算子。\n\n对于每层层次按固定因子衰减的耦合，这是 Taibleson-Vladimirov 算子，临界理论是超度量 Reggeon 场论，其上临界维数是耦合衰减指数的两倍。因此，决定平均场指数是否适用的是层次结构上耦合的衰减，而不是空间的维度。我们获得了金兹堡型准则、循环校正的分层威尔逊-考恩方程、对标度和幂律相关性的对数周期校正。对树的精确模拟支持了预测：当耦合缓慢衰减时，雪崩大小指数取平均场值 3/2；当耦合快速衰减时，雪崩大小指数会向定向渗透值减小。当衰减指数小于维数时，层次网络也是小世界网络，这是欧几里得理论仅通过假设长程耦合才能获得的属性。", "authors": [{"name": "W.A. Zúñiga-Galindo"}], "featured_authors": [{"name": "W.A. Zúñiga-Galindo"}], "author_count": 1}, {"id": "2610.36404", "category": "cond-mat", "title": "Hierarchical connectivity sets the upper critical dimension of neural avalanches", "abstract": "Neural avalanches with size exponent $3/2$ are usually explained by mean-field critical branching, which for short-range coupling requires dimension $N\\ge4$. We show that hierarchical connectivity removes this constraint. In a $p$-adic version of the Buice--Cowan field theory, a coupling that decays by $p^{-(N+\\sigma)}$ per hierarchical level selects the Taibleson--Vladimirov operator, and the critical theory is ultrametric directed percolation with upper critical dimension $N_c=2\\sigma$. Exact simulations on a tree give $\\tau_S=3/2$ for $\\sigma\\le N/2$, decreasing continuously for $\\sigma>N/2$.", "url": "https://arxiv.org/abs/2610.36404", "type": "理论+数值", "summary": "大小指数为 $3/2$ 的神经雪崩通常用平均场临界分支来解释，对于短程耦合，需要维度 $N\\ge4$。我们证明分层连接消除了这个限制。在 Buice--Cowan 场论的 $p$-adic 版本中，每层次衰减 $p^{-(N+\\sigma)}$ 的耦合选择 Taibleson--Vladimirov 算子，临界理论是具有上临界维度 $N_c=2\\sigma$ 的超量定向渗流。对树的精确模拟对于 $\\sigma\\le N/2$ 给出 $\\tau_S=3/2$，对于 $\\sigma>N/2$ 连续减小。", "authors": [{"name": "W.A. Zúñiga-Galindo"}], "featured_authors": [{"name": "W.A. Zúñiga-Galindo"}], "author_count": 1}, {"id": "2610.36424", "category": "cond-mat", "title": "Rotational Perturbation Theory for Magnetic Interactions", "abstract": "We develop rotational perturbation theory for magnetic interactions in collinear and noncollinear systems, distinguishing prescribed rotations of exchange fields from constrained rotations of magnetic moments. At the full exchange splitting, we derive Green-function expressions for prescribedfield energy curvatures directly from perturbation theory, without invoking the local force theorem; constrained-moment curvatures additionally require the stationary magnetic response and are related to the inverse static susceptibility. We examine noncollinear pair interactions and planar and conical spin spirals, and derive the long-wavelength ferromagnetic spin-wave stiffness and, assuming adiabatic sublattice precession, the antiferromagnetic spin-wave velocity. Orbital-nonlocal magnetic potentials and correlated electronic response reveal further requirements for connecting rotational curvatures to collective magnetic behavior. As a practical extension, we project the complete transverse pair Hessian onto an effective scalar Heisenberg exchange and quantify the unreconstructed curvature. Biquadratic and three-spin examples illustrate why locally extracted exchange coefficients need not represent transferable bilinear interactions.", "url": "https://arxiv.org/abs/2610.36424", "type": "理论", "summary": "我们开发了共线和非共线系统中磁相互作用的旋转扰动理论，区分交换场的规定旋转和磁矩的约束旋转。在完全交换分裂时，我们直接从微扰理论推导出规定场能量曲率的格林函数表达式，而无需引用局部力定理；约束力矩曲率还需要稳态磁响应，并且与逆静态磁化率相关。我们研究了非共线对相互作用以及平面和圆锥自旋螺旋，并推导了长波长铁磁自旋波刚度，并假设绝热亚晶格进动，推导出反铁磁自旋波速度。轨道非局域磁势和相关电子响应揭示了将旋转曲率与集体磁行为联系起来的进一步要求。作为一个实用的扩展，我们将完整的横向对 Hessian 投影到有效的标量海森堡交换上，并量化未重构的曲率。\n\n双二次和三自旋的例子说明了为什么局部提取的交换系数不需要表示可转移的双线性相互作用。", "authors": [{"name": "Vladimir Antropov"}], "featured_authors": [{"name": "Vladimir Antropov"}], "author_count": 1}, {"id": "2610.36468", "category": "cond-mat", "title": "Beyond Geometry: Hole-Edge Atomic Configuration as a Design Variable in Graphyne Kirigami", "abstract": "Kirigami-inspired cuts are an established route to stretchability in two-dimensional materials. At the nanoscale, however, cut edges are not purely geometric: they comprise discrete atomic configurations that can alter the mechanical response. In graphene, a given cut geometry fixes the edge structure; graphyne, a porous carbon allotrope with an intrinsic band gap, lifts this constraint, as identical cut geometries can yield distinct hole-edge configurations. Using molecular dynamics simulations, we report the first atomistic study of $\\gamma$-graphyne kirigami (GYK), and compared with graphene kirigami. GYK reaches yield strains up to 9.6 times that of pristine $\\gamma$-graphyne, with a response governed by both cut geometry and local hole-edge structure. Removing just two carbon atoms at selected edge sites further raises the yield strain by up to 35%, with little loss of yield stress. These findings identify hole-edge atomic configuration as an additional design parameter, expanding the design space for nanoscale kirigami engineering.", "url": "https://arxiv.org/abs/2610.36468", "type": "理论+数值", "summary": "受剪纸启发的切割是二维材料拉伸性的既定途径。然而，在纳米尺度上，切割边缘并不是纯粹的几何形状：它们包含可以改变机械响应的离散原子配置。在石墨烯中，给定的切割几何形状固定了边缘结构；石墨炔是一种具有固有带隙的多孔碳同素异形体，它解除了这一限制，因为相同的切割几何形状可以产生不同的孔边缘配置。使用分子动力学模拟，我们报告了 $\\gamma$-graphene kirigami (GYK) 的首次原子研究，并与石墨烯剪纸进行了比较。 GYK 的屈服应变高达原始 $\\gamma$-graphene 的 9.6 倍，其响应由切割几何形状和局部孔边缘结构控制。仅去除选定边缘位置的两个碳原子即可将屈服应变进一步提高高达 35%，而屈服应力几乎没有损失。这些发现将孔边缘原子构型确定为附加设计参数，扩大了纳米级剪纸工程的设计空间。", "authors": [{"name": "Guilherme B. Kanegae"}, {"name": "Alexandre F. Fonseca"}], "featured_authors": [{"name": "Guilherme B. Kanegae"}, {"name": "Alexandre F. Fonseca"}], "author_count": 2}, {"id": "2610.36505", "category": "cond-mat", "title": "Constructive Cavity Method for Ising Restricted and Deep Boltzmann Machines with Gaussian Couplings", "abstract": "We apply the Constructive Cavity Method (CCM) to the dense, Ising type, restricted and deep Boltzmann machine with Gaussian couplings between adjacent layers. After identifying the core and interface contributions, CCM identifies the blanket decomposition of the cavity variables with the Aizenman--Sims--Starr random overlap structure. We apply the Random Energy Model (REM) universality ansatz to represent the cavity free energies by those of a generalized random energy model (GREM) and evaluate them recursively through Poisson point processes (PPPs). In the layer-wise gauge each layer is cut with its own cumulative fraction $|U_\\ell\\cap L_p|=\\lambda_p q_\\ell^{(p)}N+o(N)$, with $\\mathbf 0=\\mathbf q_0\\le\\mathbf q_1\\le\\cdots\\le\\mathbf q_r=\\mathbf 1$, where $\\mathbf q_\\ell=(q_\\ell^{(1)},\\ldots,q_\\ell^{(K)})$. Here $U_\\ell$ is the cumulative blanket union up to blanket $\\ell$. The index $p$ labels architectural layers, whereas $\\ell$ labels the blankets. The dependence on the multilayer geometry is carried by the two matrices $M=2M_0\\Lambda$ and $M_1=\\Lambda M_0\\Lambda$. The constructive cavity field in layer $p$ has blanket variances $Q_\\ell^{(p)}-Q_{\\ell-1}^{(p)}=(M(\\mathbf q_\\ell-\\mathbf q_{\\ell-1}))_p$, while the correction field has blanket variances $Q_\\ell-Q_{\\ell-1}=\\mathbf q_\\ell^\\top M_1\\mathbf q_\\ell-\\mathbf q_{\\ell-1}^\\top M_1\\mathbf q_{\\ell-1}$. The nested REM--PPP average gives the finite-level constructive cavity functional $\\mathcal{P}_{\\mathrm{RBM/DBM}}^{\\mathrm{CCM}}(\\zeta,\\mathbf q)=\\log2+\\sum_{p=1}^K\\lambda_pX_0^{(p)}-\\frac12\\sum_{\\ell=0}^{r-1}\\zeta_\\ell(\\mathbf q_{\\ell+1}^\\top M_1\\mathbf q_{\\ell+1}-\\mathbf q_\\ell^\\top M_1\\mathbf q_\\ell)$. The balanced scalar gauge is recovered by imposing $\\mathbf q_\\ell=q_\\ell\\mathbf 1$. Selecting the physical value in the non-convex multilayer regime is a separate problem.", "url": "https://arxiv.org/abs/2610.36505", "type": "理论+数值", "summary": "我们将构造空腔法 (CCM) 应用于相邻层之间具有高斯耦合的密集伊辛型受限深度玻尔兹曼机。在确定了核心和界面贡献后，CCM 确定了具有 Aizeman--Sims--Starr 随机重叠结构的腔体变量的全面分解。我们应用随机能量模型（REM）普适性分析来用广义随机能量模型（GREM）的能量来表示空腔自由能，并通过泊松点过程（PPP）递归地评估它们。在分层量规中，每一层都用自己的累积分数 $|U_\\ell\\cap L_p|=\\lambda_p q_\\ell^{(p)}N+o(N)$ 进行切割，其中 $\\mathbf 0=\\mathbf q_0\\le\\mathbf q_1\\le\\cdots\\le\\mathbf q_r=\\mathbf 1$，其中 $\\mathbf q_\\ell=(q_\\ell^{(1)},\\ldots,q_\\ell^{(K)})$。这里 $U_\\ell$ 是直到毯子 $\\ell$ 的累积毯子并集。索引 $p$ 标记建筑层，而 $\\ell$ 标记毯子。对多层几何形状的依赖性由两个矩阵 $M=2M_0\\Lambda$ 和 $M_1=\\Lambda M_0\\Lambda$ 承载。\n\n$p$ 层中的相长空腔场具有总方差 $Q_\\ell^{(p)}-Q_{\\ell-1}^{(p)}=(M(\\mathbf q_\\ell-\\mathbf q_{\\ell-1}))_p$，而校正场具有总方差 $Q_\\ell-Q_{\\ell-1}=\\mathbf q_\\ell^\\top M_1\\mathbf q_\\ell-\\mathbf q_{\\ell-1}^\\top M_1\\mathbf q_{\\ell-1}$。嵌套的 REM--PPP 平均值给出有限级构造空腔泛函 $\\mathcal{P}_{\\mathrm{RBM/DBM}}^{\\mathrm{CCM}}(\\zeta,\\mathbf q)=\\log2+\\sum_{p=1}^K\\lambda_pX_0^{(p)}-\\frac12\\sum_{\\ell=0}^{r-1}\\zeta_\\ell(\\mathbf q_{\\ell+1}^\\top M_1\\mathbf q_{\\ell+1}-\\mathbf q_\\ell^\\top M_1\\mathbf q_\\ell)$。通过施加 $\\mathbf q_\\ell=q_\\ell\\mathbf 1$ 来恢复平衡标量规。选择非凸多层体系中的物理值是一个单独的问题。", "authors": [{"name": "Simone Franchini"}, {"name": "Francesco Concetti"}, {"name": "Giampiero Bardella"}, {"name": "Liming Pan"}], "featured_authors": [{"name": "Simone Franchini"}, {"name": "Francesco Concetti"}, {"name": "Giampiero Bardella"}, {"name": "Liming Pan"}], "author_count": 4}, {"id": "2610.36542", "category": "cond-mat", "title": "First-principles-based search for emergent topological spin textures in transition-metal dichalcogenide monolayers", "abstract": "Topological spin textures such as skyrmions and bimerons offer rich physical functionalities and strong potential for future spin-based technologies. Identifying materials that host such emergent magnetic states, however, remains challenging due to the complex interplay between microscopic magnetic interactions and large-scale spin textures. Here, using a multiscale first-principles discovery framework, we identify a broad class of two-dimensional materials that stabilize nontrivial spin textures. The framework integrates relativistic density functional theory, magnetic force theory, and atomistic spin-dynamics simulations, enabling a direct connection between electronic interactions and emergent magnetic textures and allowing efficient screening of systems with large magnetic unit cells and competing exchange interactions. Applying this approach, we systematically screen 312 monolayer transition-metal dichalcogenides across 1T and 2H phases of 3d, 4d, and 5d transition metals. We uncover a diverse set of emergent spin textures, including skyrmions, bimerons, and complex domain states, and clarify their distinct stabilization mechanisms driven by exchange interactions, Dzyaloshinskii-Moriya interactions, and magnetic frustration. These results identify promising candidate materials for topological spin textures and establish a transferable computational framework for accelerating materials discovery of complex magnetic states in two dimensions.", "url": "https://arxiv.org/abs/2610.36542", "type": "理论+数值", "summary": "斯格明子和双聚体等拓扑自旋纹理为未来基于自旋的技术提供了丰富的物理功能和强大的潜力。然而，由于微观磁相互作用和大规模自旋纹理之间复杂的相互作用，识别具有这种新兴磁态的材料仍然具有挑战性。在这里，使用多尺度第一原理发现框架，我们确定了一大类稳定非平凡自旋纹理的二维材料。该框架集成了相对论密度泛函理论、磁力理论和原子自旋动力学模拟，实现了电子相互作用和新兴磁性纹理之间的直接联系，并允许有效筛选具有大型磁性单元和竞争交换相互作用的系统。应用这种方法，我们系统地筛选了 3d、4d 和 5d 过渡金属的 1T 和 2H 相的 312 个单层过渡金属二硫属化物。\n\n我们发现了一系列不同的新兴自旋结构，包括斯格明子、双聚子和复杂的域态，并阐明了它们由交换相互作用、Dzyaloshinskii-Moriya 相互作用和磁挫败驱动的独特稳定机制。这些结果确定了拓扑自旋纹理的有前途的候选材料，并建立了可转移的计算框架，以加速二维复杂磁态的材料发现。", "authors": [{"name": "Yuhyun Cha"}, {"name": "Do Hoon Kiem"}, {"name": "Myung Joon Han"}], "featured_authors": [{"name": "Yuhyun Cha"}, {"name": "Do Hoon Kiem"}, {"name": "Myung Joon Han"}], "author_count": 3}, {"id": "2610.36567", "category": "cond-mat", "title": "Continuum neural wavefunctions for anyons on a torus", "abstract": "Mobile anyons in topologically ordered phases provide a setting to investigate how fractional exchange statistics shapes collective behavior at finite density. We introduce AnyFormer: a neural variational framework for continuum anyons on a torus that explicitly incorporates statistical interactions and global winding constraints. We construct a smooth orbital frame that enforces the matrix-valued torus boundary conditions, and supplement it with an analytic pair factor that supplies the regular collision behavior. The orbital geometry and many-body amplitudes are optimized in parallel by variational Monte Carlo. We apply AnyFormer to semions without an external field or interaction potential, isolating unique correlations generated solely by statistics. Our framework closely matches exact two-semion energies and yields lower variational energies than finite-cutoff exact diagonalization for $N = 4$ and $6$ semions. Scaling up to $N = 16$ semions, well beyond the limits of continuum diagonalization, our calculations reveal states with pronounced correlation holes, suppressed long-wavelength density fluctuations, and a reversal of pair circulation at a distance set by the mean particle spacing. For $N = 12$ and $16$ semions, the circulation develops damped spatial oscillations. AnyFormer thus provides a scalable variational neural-net framework for microscopic studies of correlations, chiral motion, and collective phases of bulk anyonic matter.", "url": "https://arxiv.org/abs/2610.36567", "type": "理论+数值", "summary": "拓扑有序相中的移动任意子提供了一个研究分数交换统计如何在有限密度下塑造集体行为的环境。我们介绍 AnyFormer：环面上连续任意子的神经变分框架，它明确地结合了统计相互作用和全局缠绕约束。我们构建了一个平滑的轨道框架，强制执行矩阵值环面边界条件，并用提供常规碰撞行为的解析对因子对其进行补充。通过变分蒙特卡罗并行优化轨道几何结构和多体振幅。我们将 AnyFormer 应用于没有外部场或相互作用势的半子，隔离仅由统计生成的独特相关性。我们的框架与 $N = 4$ 和 $6$ 半子的精确二半子能量紧密匹配，并且比有限截止精确对角化产生更低的变分能量。\n\n扩展到 $N = 16$ 半子，远远超出连续对角化的限制，我们的计算揭示了具有明显相关空洞的状态，抑制了长波长密度波动，以及在平均粒子间距设定的距离处对循环的逆转。对于 $N = 12$ 和 $16$ 半子，环流会产生阻尼空间振荡。因此，AnyFormer 提供了一个可扩展的变分神经网络框架，用于微观研究大块任意子物质的相关性、手性运动和集体相。", "authors": [{"name": "Ahmed Khalifa"}, {"name": "Shubhayu Chatterjee"}], "featured_authors": [{"name": "Ahmed Khalifa"}, {"name": "Shubhayu Chatterjee"}], "author_count": 2}, {"id": "2610.36619", "category": "cond-mat", "title": "Comprehensive QM/ML Study of Dislocation Loop Line Segments in α-Zr Part I: <a> Loop Core Geometries, Solute Binding, and Transition Barriers", "abstract": "Zr cladding alloys in nuclear reactors are exposed to high neutron fluxes, making irradiation-induced defects and solute segregation central to understanding their in-service behaviour. Dislocation cores involve short-range chemistry and long-range elastic fields, which are difficult to describe simultaneously using conventional atomistic methods. Using a hybrid quantum mechanics/machine learning (QM/ML) framework, this part of work examines prismatic <a> loops in hcp {\\alpha}-Zr. All three loop variants are considered, including faulted and perfect, interstitial- and vacancy-type, and first- and second-order prismatic configurations. Nine possible dislocation line segments are characterised in terms of core geometry, solute binding, glide barriers and faulted-to-perfect transition pathways using QM/ML and newly implemented QM/ML-NEB calculations. Shockley and half-Shockley partials, together with basal and prismatic fault ribbons, are found to govern core stabilisation. Fe and H preferentially bind to faulted segments, whereas Sn and Nb favour perfect segments. Solutes can also drive partial motion, recombination and local unfaulting. These results establish a comprehensive picture of <a> loop microstructure, solute trapping and transition mechanisms in {\\alpha}-Zr.", "url": "https://arxiv.org/abs/2610.36619", "type": "理论+数值", "summary": "核反应堆中的锆包壳合金暴露在高中子通量下，使得辐照引起的缺陷和溶质偏析成为了解其在役行为的核心。位错核涉及短程化学和长程弹性场，很难使用传统的原子方法同时描述。这部分工作使用混合量子力学/机器学习 (QM/ML) 框架，检查 hcp {\\alpha}-Zr 中的棱柱 <a> 环。考虑了所有三种环路变体，包括断层和完美、间隙型和空位型以及一阶和二阶棱柱配置。使用 QM/ML 和新实施的 QM/ML-NEB 计算，从核心几何形状、溶质结合、滑动屏障和从故障到完美的过渡路径来表征九种可能的位错线段。肖克利和半肖克利部分，以及基底和棱柱断层带，被发现控制核心稳定。 Fe 和 H 优先与有缺陷的片段结合，而 Sn 和 Nb 则倾向于与完美片段结合。溶质还可以驱动部分运动、重组和局部无断层。\n\n这些结果建立了 {\\alpha}-Zr 中 <a> 环微观结构、溶质捕获和转变机制的全面图景。", "authors": [{"name": "Junting Zhang"}, {"name": "Andrew P. Horsfield"}, {"name": "Mark R. Wenman"}], "featured_authors": [{"name": "Junting Zhang"}, {"name": "Andrew P. Horsfield"}, {"name": "Mark R. Wenman"}], "author_count": 3}, {"id": "2610.36647", "category": "cond-mat", "title": "Designing Geared Molecular Rotors in Flexible Metal-Organic Frameworks", "abstract": "Translating macroscopic mechanical concepts such as gears to the molecular scale offers a route to precise control over nanoscale motion, inspired by the efficiency of biological machines. In this work, we explore two-dimensional interlocked linker rotations in the flexible metal-organic framework NU-2002. The volume-dependent free energy landscape is mapped using bias-deletion metadynamics to identify six characteristic phases, ranging from very closed to very open pore. We then perform unbiased molecular dynamics simulations at each phase to track rotation events and evaluate co-rotation statistics, calculate free energy barriers, and measure pairwise radial force transfer between neighbouring linkers. We show that the free energy barrier acts as a rotational-speed filter, where rare rotational transitions lead to higher speeds on average. Across the volume profile, we classify four distinct geared regimes: sterically restricted rotations at small volumes (Jammed Gear), rotational coupling extending to third neighbour linkers (First Gear), in-plane partnered linker coupling (Second Gear), and uncoupled, independent rotation at large volumes (Neutral Gear). Together, these results establish framework breathing as a molecular gearbox that switches both the speed and collective coupling of linker rotation. Framework flexibility therefore offers a handle for programming collective motion in solid-state molecular machines.", "url": "https://arxiv.org/abs/2610.36647", "type": "数值", "summary": "受生物机器效率的启发，将齿轮等宏观机械概念转化为分子尺度，为精确控制纳米级运动提供了一条途径。在这项工作中，我们探索了柔性金属有机框架 NU-2002 中的二维互锁连接子旋转。使用偏差删除元动力学绘制依赖于体积的自由能景观，以识别从非常封闭到非常开放的孔隙的六个特征相。然后，我们在每个阶段进行无偏分子动力学模拟，以跟踪旋转事件并评估同向旋转统计数据，计算自由能势垒，并测量相邻连接体之间的成对径向力传递。我们表明，自由能势垒充当旋转速度过滤器，其中罕见的旋转转变会导致平均速度更高。在整个体积轮廓中，我们对四种不同的齿轮状态进行了分类：小体积下的空间限制旋转（卡塞齿轮）、延伸到第三个相邻连接器的旋转耦合（第一齿轮）、面内配对连接器耦合（第二齿轮）以及大体积下的非耦合独立旋转（空档齿轮）。\n\n总之，这些结果将框架呼吸建立为分子齿轮箱，可以切换连接器旋转的速度和集体耦合。因此，框架灵活性为固态分子机器中的集体运动编程提供了一种方法。", "authors": [{"name": "Konstantin Stracke"}, {"name": "Jack D. Evans"}], "featured_authors": [{"name": "Konstantin Stracke"}, {"name": "Jack D. Evans"}], "author_count": 2}, {"id": "2610.36659", "category": "cond-mat", "title": "Where Does the Anion-Redox Hole Go? Reliability of Open-Shell Projection-Based Embedding for Li-Rich Cathodes, from DFT Environments to Quantum Solvers", "abstract": "Anion redox in Li-rich layered oxides places holes on oxygen next to an antiferromagnetic Mn(IV) d3 lattice, a strongly correlated open-shell problem for which projection-based wavefunction-in-DFT embedding offers a route to correlated and quantum solvers, but whose errors are known mainly for closed-shell molecules. We develop a spin-unrestricted projection-based embedding, exact at the DFT-in-DFT level to the microhartree scale for closed-shell, broken-symmetry and high-spin references with point charges, and apply DMRG-in-DFT to point-charge clusters of delithiated Li(2-x)MnO3, varying the environment functional (0-100% exact exchange), geometry, active region, active-space spin, virtual space, cluster size and magnetic reference. In every setting the lowest SCF state places the hole on an oxygen pair, with no O-O bond. How the hole is shared depends on the functional together with the geometry: hybrids give a full, uncoupled hole at the DFT+U geometry but a partial, weakly covalent hole at their own geometry, a change of up to 0.5 e on one oxygen. Where spin spreads across the active/environment boundary, the integer spin projection of the active space becomes a choice worth up to 0.26 e, and at most 0.09 e once the two Mn neighbors are included. An extended state search found missed lower states for two functionals, changing a pair-oxygen spin by up to 0.45 e. Across all 82 runs the embedded mean field gives the same hole (median DMRG change 0.02-0.04 e); correlation mainly adds O-O covalency. State control and geometry consistency, not the solver, dominate the uncertainty, and total energies are not converged at 30-40 orbitals. For quantum solvers, the embedded Hamiltonian must be spin-unrestricted: a shared-orbital form reverses the hole, while sample-based quantum diagonalization reproduces exact diagonalization, as accurately as, but not better than, classical selected CI.", "url": "https://arxiv.org/abs/2610.36659", "type": "理论+数值", "summary": "富锂层状氧化物中的阴离子氧化还原在反铁磁 Mn(IV) d3 晶格旁边的氧上放置空穴，这是一个强相关的开壳问题，基于投影的 DFT 波函数嵌入为相关和量子求解器提供了一条途径，但其误差主要针对闭壳分子。我们开发了一种基于自旋不受限制的投影的嵌入，在 DFT-in-DFT 水平上精确到 microhartree 尺度，用于闭壳、破缺对称性和点电荷的高自旋参考，并将 DMRG-in-DFT 应用于脱锂 Li(2-x)MnO3 的点电荷簇，改变环境功能（0-100% 精确交换）、几何形状、活性区域、活性空间自旋、虚拟空间、簇大小和磁参考。在每种设置中，最低的 SCF 状态都将空穴置于氧对上，没有 O-O 键。空穴的共享方式取决于函数和几何结构：杂化体在 DFT+U 几何结构中提供完整的、未耦合的空穴，但在其自身几何结构中提供部分弱共价空穴，一个氧上的变化最多为 0.5 e。\n\n当自旋分布在活动/环境边界上时，活动空间的整数自旋投影成为一个值高达 0.26 e 的选择，一旦包含两个 Mn 邻居，则最多为 0.09 e。扩展状态搜索发现两个泛函丢失了较低的状态，将氧对自旋改变了高达 0.45 e。在所有 82 次运行中，嵌入的平均场给出了相同的空洞（中值 DMRG 变化 0.02-0.04 e）；相关性主要是增加O-O共价性。状态控制和几何一致性，而不是求解器，决定了不确定性，并且总能量不收敛于 30-40 轨道。对于量子求解器，嵌入的哈密顿量必须是自旋不受限制的：共享轨道形式反转空穴，而基于样本的量子对角化再现精确的对角化，与经典选择的 CI 一样准确，但不比它更好。", "authors": [{"name": "Pritam Das"}, {"name": "Satadeep Bhattacharjee"}, {"name": "Pil-Ryung Cha"}], "featured_authors": [{"name": "Pritam Das"}, {"name": "Satadeep Bhattacharjee"}, {"name": "Pil-Ryung Cha"}], "author_count": 3}, {"id": "2610.36673", "category": "cond-mat", "title": "Atom as an Agent: Emergent Order by Collective Predictive Coding", "abstract": "What is the intrinsic reason of emergence of macroscopic order parameter out of microscopic systems? In this article, we apply to physics the collective predictive coding (CPC), the theory of language/symbol emergence. As our language emerges out of our human communications, physical macroscopic order parameter emerges out of communications among atoms --- each atom is regarded as an agent who predicts each other's behavior through inference. We present three examples of classical spin systems: two-dimensional ferromagnetic and antiferromagnetic Ising models, a two-dimensional spin model with competing stripe orders, and the fully connected Sherrington--Kirkpatrick spin-glass model. In all of these examples, proper macroscopic order parameters including the replica overlap emerge automatically through communication informatics of CPC, only from observed spin configurations. We call the learned macroscopic coordinate the collective predictive order. Furthermore, for the ferromagnetic and antiferromagnetic Ising models, the equilibrium distribution of the collective predictive order yields an emergent potential with the symmetry and thermal evolution characteristic of a Landau potential. Notably, the emergence of the collective predictive order does not refer to any structure of microscopic Hamiltonians/Lagrangians. Thus our ``Atom-as-an-Agent\" (AaaA) principle offers a completely data-driven method for the emergence of macroscopic order, that is, machine learning physics.", "url": "https://arxiv.org/abs/2610.36673", "type": "理论+数值", "summary": "微观系统中出现宏观序参数的内在原因是什么？在本文中，我们将集体预测编码（CPC），即语言/符号出现理论应用于物理学。正如我们的语言源于人类的交流，物理宏观秩序参数也源于原子之间的交流——每个原子都被视为一个通过推理来预测彼此行为的代理。我们提出了经典自旋系统的三个例子：二维铁磁和反铁磁 Ising 模型、具有竞争条纹顺序的二维自旋模型以及完全连接的 Sherrington-Kirkpatrick 自旋玻璃模型。在所有这些例子中，包括副本重叠在内的适当的宏观顺序参数仅通过观察到的自旋配置通过 CPC 的通信信息自动出现。我们将学习到的宏观坐标称为集体预测顺序。\n\n此外，对于铁磁和反铁磁伊辛模型，集体预测顺序的平衡分布产生了具有朗道势的对称性和热演化特征的涌现势。值得注意的是，集体预测秩序的出现并不涉及微观哈密顿量/拉格朗日量的任何结构。因此，我们的“原子作为代理”（AaaA）原理为宏观秩序的出现提供了一种完全数据驱动的方法，即机器学习物理学。", "authors": [{"name": "Koji Hashimoto"}, {"name": "Tadahiro Taniguchi"}], "featured_authors": [{"name": "Koji Hashimoto"}, {"name": "Tadahiro Taniguchi"}], "author_count": 2}, {"id": "2610.36697", "category": "cond-mat", "title": "Ground-State Properties of a Lattice-Coupled Strongly Correlated Model for Solid Oxygen under Pressure", "abstract": "Solid oxygen is an $S=1$ molecular magnet with strong coupling between spin and lattice degrees of freedom. Recent studies suggest that magnetic moments coexist with tetramer distortions under pressure. We derive an effective spin Hamiltonian from a two-orbital Peierls--Hubbard model with spin-orbit coupling. The resulting model contains competing easy-plane single-ion and easy-axis exchange anisotropies. We analyze this model on a square lattice using quantum Monte Carlo simulations and evaluate the magnetic contribution to the lattice stiffness for several lattice distortion patterns including the tetramer pattern. We find that the tetramer pattern is the most favorable among the considered distortion patterns throughout the parameter range studied. Moreover, competition between the two anisotropies enhances the tendency toward lattice distortion and strengthens the preference for tetramerization over the other patterns.", "url": "https://arxiv.org/abs/2610.36697", "type": "理论+数值", "summary": "固体氧是一种 $S=1$ 分子磁体，自旋和晶格自由度之间具有强耦合。最近的研究表明，磁矩在压力下与四聚体扭曲共存。我们从具有自旋轨道耦合的双轨道 Peierls--Hubbard 模型导出了有效的自旋哈密顿量。所得模型包含相互竞争的易平面单离子和易轴交换各向异性。我们使用量子蒙特卡罗模拟在方形晶格上分析该模型，并评估包括四聚体模式在内的几种晶格畸变模式的磁力对晶格刚度的贡献。我们发现，在整个研究的参数范围内，四聚体模式是所考虑的畸变模式中最有利的。此外，两种各向异性之间的竞争增强了晶格畸变的趋势，并增强了四聚化相对于其他模式的偏好。", "authors": [{"name": "Naomichi Sato"}, {"name": "Makoto Naka"}, {"name": "Joji Nasu"}], "featured_authors": [{"name": "Naomichi Sato"}, {"name": "Makoto Naka"}, {"name": "Joji Nasu"}], "author_count": 3}, {"id": "2610.36705", "category": "cond-mat", "title": "In-situ Control of the Photon-Magnon Synchronized Mode in a Miniaturized Magnetometer", "abstract": "Photon-magnon synchronized modes (PMSMs) provide a route for magnetic-field sensing by exploiting their enhanced field responsivity due to cusp points (CPs). However, the previous PMSM magnetometer relies on bulky discrete components and lacks in situ control of photon-magnon interactions, limiting its integration and adaptability. Here, we demonstrate a miniaturized PMSM magnetometer integrated on a printed circuit board. A variable resistor is used to tune the photon-magnon coupling strength in situ. By adjusting the variable resistor, the electromagnetic boundary condition of the magnetometer is altered; hence, the reservoir-mediated photon-magnon interaction is changed. The coupling strength shows a non-monotonic dependence on the reflection coefficient adjusted by the variable resistor and reaches its minimum at the impedance matching condition. Furthermore, we develop a non-Hermitian model with standing-wave interference to describe the PMSM dispersion and derive the critical condition for CP formation. This work realizes a compact and tunable PMSM magnetometer and provides a pathway for controlling photon-magnon interactions in integrated magnetic sensing systems.", "url": "https://arxiv.org/abs/2610.36705", "type": "理论", "summary": "光子磁振子同步模式 (PMSM) 通过利用尖点 (CP) 增强的场响应度，为磁场传感提供了一条途径。然而，之前的 PMSM 磁力计依赖于笨重的分立元件，缺乏对光子-磁振子相互作用的原位控制，限制了其集成度和适应性。在这里，我们展示了集成在印刷电路板上的微型 PMSM 磁力计。可变电阻器用于原位调节光子-磁振子耦合强度。通过调节可变电阻，改变磁力计的电磁边界条件；因此，储层介导的光子-磁振子相互作用发生了变化。耦合强度对可变电阻调节的反射系数呈现非单调依赖性，并在阻抗匹配条件下达到最小值。此外，我们开发了一种具有驻波干扰的非厄米特模型来描述 PMSM 色散并推导出 CP 形成的临界条件。这项工作实现了紧凑且可调谐的 PMSM 磁力计，并为控制集成磁传感系统中的光子-磁振子相互作用提供了途径。", "authors": [{"name": "Yuting Shi"}, {"name": "Xudong Wang"}, {"name": "Yue Zhao"}, {"name": "Lijun Yan"}, {"name": "Bimu Yao"}, {"name": "Shishen Yan"}, {"name": "Lihui Bai"}, {"name": "Jinwei Rao"}], "featured_authors": [{"name": "Yuting Shi"}, {"name": "Xudong Wang"}, {"name": "Yue Zhao"}, {"name": "Shishen Yan"}, {"name": "Lihui Bai"}, {"name": "Jinwei Rao"}], "author_count": 8}, {"id": "2610.36710", "category": "cond-mat", "title": "Intercomponent vortex interaction and dynamics in a uniform Bose quantum liquid", "abstract": "We investigate the interaction and dynamics of vortices belonging to different components of a binary uniform quantum liquid. Using the coupled extended Gross-Pitaevskii equations with logarithmic beyond-mean-field corrections, we derive the asymptotic interaction potential between well-separated vortices. The interaction potential retains the asymptotic form $s^{-2}$ as a function of the intervortex distance s, but its coefficient depends on the background density through the quantum fluctuation. As a result, the interaction between vortices changes from attractive to repulsive at a critical density. Real-time simulations demonstrate a corresponding reversal of orbital motion of a vortex pair from clockwise to counterclockwise, consistent with their Magnus response.", "url": "https://arxiv.org/abs/2610.36710", "type": "理论+数值", "summary": "我们研究了属于二元均匀量子液体不同成分的涡旋的相互作用和动力学。使用耦合扩展 Gross-Pitaevskii 方程和对数超平均场校正，我们推导了分离良好的涡旋之间的渐近相互作用势。相互作用势保留渐近形式 $s^{-2}$ 作为涡旋间距离 s 的函数，但其​​系数通过量子涨落取决于背景密度。结果，涡旋之间的相互作用在临界密度处从吸引变为排斥。实时模拟演示了涡旋对的轨道运动从顺时针到逆时针的相应反转，这与它们的马格努斯响应一致。", "authors": [{"name": "Rabeea Kiran"}, {"name": "Hiroki Saito"}, {"name": "Hsiang-Hua Jen"}], "featured_authors": [{"name": "Rabeea Kiran"}, {"name": "Hiroki Saito"}, {"name": "Hsiang-Hua Jen"}], "author_count": 3}, {"id": "2610.36738", "category": "cond-mat", "title": "Algebraic flat bands and even central-band Chern numbers in a seven-orbital hopping model", "abstract": "Turning a flat-band parent into an isolated Chern band requires supervise of destructive interference, hopping phases, and the cell translations of the bonds. We study this connection in a seven-orbital 2 time
