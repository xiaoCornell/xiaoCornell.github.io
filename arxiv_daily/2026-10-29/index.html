 Wilson loops is also determined. In flavored Chern-Simons theory, we find an interesting phase transition. For $n$-times-wound Wilson loops, we determine their $n$-dependence by using a recursion relation obtained in our previous work.", "url": "https://arxiv.org/abs/2610.36845", "type": "理论", "summary": "扩展我们之前的工作，我们使用 Picard-Fuchs 方程研究了陈-西蒙斯理论和 ABJ 理论的威尔逊环。详细分析了方程的奇点结构，并确定了奇点周围的局部解。每种理论都有一个参数，并且威尔逊环的参数依赖性也被确定。在陈-西蒙斯理论中，我们发现了一个有趣的相变。对于$n$次缠绕的Wilson循环，我们通过使用在我们之前的工作中获得的递归关系来确定它们的$n$依赖性。", "authors": [{"name": "Takao Suyama"}], "featured_authors": [{"name": "Takao Suyama"}], "author_count": 1}, {"id": "2610.36898", "category": "hep-th", "title": "The Disordered Universe 2025: Open Effective Field Theories", "abstract": "Effective field theories (EFTs) offer a powerful method to unify diverse models under a small set of control parameters, allowing systematic expansions around well-established theories. While these techniques were traditionally developed for particle physics experiments with clean, isolated initial states, realistic macroscopic environments are often noisy and dissipative. Recognising the limitations of traditional EFTs has recently sparked intense progress at the interface of high-energy physics and condensed matter. These developments motivate a new approach to gravitation and cosmology, one that models the gravitational sector as evolving in the presence of an unobservable medium. Open Effective Field Theories provide a systematic, controllable framework for this endeavour. This chapter presents this versatile framework and illustrates how the Schwinger-Keldysh formalism captures the influence of unknown environments, manifesting as dissipation and noise, on observational probes. These notes are based on a series of lectures held during the La Ricotta Summer School \"The Disordered Universe 2025\" from 21 July to 1 August 2025.", "url": "https://arxiv.org/abs/2610.36898", "type": "理论", "summary": "有效场论 (EFT) 提供了一种强大的方法，可以在一小部分控制参数下统一不同的模型，从而可以围绕成熟的理论进行系统扩展。虽然这些技术传统上是为具有干净、孤立的初始状态的粒子物理实验而开发的，但现实的宏观环境通常是嘈杂和耗散的。认识到传统 EFT 的局限性，最近在高能物理和凝聚态物质的界面上引发了巨大的进展。这些发展激发了一种新的引力和宇宙学方法，该方法将引力部分建模为在不可观测介质存在的情况下演化。开放有效场理论为这一努力提供了一个系统的、可控的框架。本章介绍了这个多功能框架，并说明了施温格-凯尔迪什形式主义如何捕捉未知环境对观测探测器的影响，表现为耗散和噪声。这些笔记基于 2025 年 7 月 21 日至 8 月 1 日 La Ricotta 暑期学校“2025 年无序宇宙”期间举办的一系列讲座。", "authors": [{"name": "Alessandro Fumagalli"}, {"name": "Francesco Paronetto"}, {"name": "Leonardo Stanzani"}, {"name": "Mattia Varrone"}, {"name": "Lucas Vicente García-Consuegra"}, {"name": "Thomas Colas"}, {"name": "Paolo Benincasa"}, {"name": "Guilherme Leite Pimentel"}], "featured_authors": [{"name": "Alessandro Fumagalli"}, {"name": "Francesco Paronetto"}, {"name": "Leonardo Stanzani"}, {"name": "Thomas Colas"}, {"name": "Paolo Benincasa"}, {"name": "Guilherme Leite Pimentel"}], "author_count": 8}, {"id": "2610.36997", "category": "hep-th", "title": "The Disordered Universe 2025: Statistical Systems Out of Equilibrium", "abstract": "These lecture notes provide an introduction to quantum spin glasses, with a particular emphasis on their application to open problems in cosmology and holography. Focusing on the spherical $p$-spin model, we develop a complete and self-contained analysis of its thermodynamic and dynamical properties. We introduce the replica method, discuss both replica-symmetric and one-step replica symmetry-broken solutions, and characterise the resulting glassy phase. The framework is then extended to the quantum model, where we study the emergence of slow dynamics and the role of quantum correlations through Euclidean and real-time correlation functions. Finally, we explore how concepts such as replica symmetry breaking and disorder naturally arise in cosmological and holographic systems related to black hole fragmentation, highlighting spin glass models as useful theoretical laboratories for these phenomena. These notes are based on a series of lectures held during the La Ricotta Summer School: The Disordered Universe 2025 from 21 July to 1 August 2025.", "url": "https://arxiv.org/abs/2610.36997", "type": "理论", "summary": "这些讲义介绍了量子自旋玻璃，特别强调了它们在宇宙学和全息术中未解决问题的应用。专注于球形 $p$-自旋模型，我们对其热力学和动力学特性进行了完整且独立的分析。我们介绍了复制方法，讨论了复制对称和一步复制对称破缺解，并表征了所得玻璃相。然后将该框架扩展到量子模型，我们通过欧几里得和实时相关函数研究慢动力学的出现以及量子相关性的作用。最后，我们探讨了复制对称破缺和无序等概念如何在与黑洞破碎相关的宇宙学和全息系统中自然出现，强调自旋玻璃模型是这些现象的有用理论实验室。这些笔记基于 2025 年 7 月 21 日至 8 月 1 日 La Ricotta 暑期学校：2025 年无序宇宙期间举办的一系列讲座。", "authors": [{"name": "Weam Abou Hamdan"}, {"name": "Martí Berenguer Mimó"}, {"name": "Rafael Carrasco Carmona"}, {"name": "Silvia Pla"}, {"name": "Omkar Shetye"}, {"name": "Tarek Anous"}, {"name": "Paolo Benincasa"}, {"name": "Guilherme Leite Pimentel"}], "featured_authors": [{"name": "Weam Abou Hamdan"}, {"name": "Martí Berenguer Mimó"}, {"name": "Rafael Carrasco Carmona"}, {"name": "Tarek Anous"}, {"name": "Paolo Benincasa"}, {"name": "Guilherme Leite Pimentel"}], "author_count": 8}, {"id": "2610.37009", "category": "hep-th", "title": "Momentum-space entanglement and mutual information in Kaluza-Klein reduction", "abstract": "In theories with compact extra dimensions, the four-dimensional effective description is obtained by Kaluza-Klein reduction. The state available to a four-dimensional observer is the reduced density matrix obtained by tracing the higher-dimensional vacuum over the tower of massive modes, and it need not be pure. In this paper we study the momentum-space entanglement of this state for a five-dimensional scalar on $M_4\\times S^1$ with a cubic or quartic self-interaction. We compute, at leading order in the coupling, the mutual information $I_n$ between the zero modes below a resolution scale $\\mu$ and a single Kaluza-Klein level $n$. When the zero modes couple linearly and without derivatives to pairs of tower modes, $I_n$ falls as $1/m_n$, where $m_n$ is the mass of level $n$. In the cubic theory, this tail is independent of the ultraviolet cutoff, with coefficient $(\\mu R)^2/1024\\pi^3$ for compactification radius $R$, and the mutual information with the whole tower grows logarithmically with the number of levels. In the quartic theory, the tail is masked by states containing additional hard quanta, which make $I_n$ depend on the cutoff. Compared with the corrections the tower makes to low-energy amplitudes, which are dominated by the lightest levels and captured by local operators, the mutual information with the tower is not dominated by any finite set of levels and arises from the time-nonlocal part of the effective action. The local four-dimensional effective theory therefore describes the low-energy observables of the reduced system but not its state. Unbroken supersymmetry cancels the vacuum energy of the compactification but not the mutual information, which at leading order is a sum of squared amplitudes.", "url": "https://arxiv.org/abs/2610.37009", "type": "理论", "summary": "在紧额外维理论中，四维有效描述是通过Kaluza-Klein约简得到的。四维观察者可用的状态是通过追踪质量模式塔上的高维真空而获得的约化密度矩阵，并且它不需要是纯净的。在本文中，我们研究了具有三次或四次自相互作用的 $M_4\\times S^1$ 上五维标量的动量空间纠缠。我们以耦合的前导顺序计算低于分辨率尺度 $\\mu$ 的零模式和单个 Kaluza-Klein 能级 $n$ 之间的互信息 $I_n$。当零模线性耦合并且没有导数到塔模对时，$I_n$ 下降为 $1/m_n$，其中 $m_n$ 是级别 $n$ 的质量。在立方理论中，这条尾部与紫外线截止无关，致密化半径$R$的系数为$(\\mu R)^2/1024\\pi^3$，与整个塔的互信息随着层数呈对数增长。在四次理论中，尾部被包含额外硬量子的状态所掩盖，这使得 $I_n$ 取决于截止值。\n\n与塔对低能振幅所做的修正（由最轻的能级主导并由局部算子捕获）相比，与塔的互信息不受任何有限的能级集支配，并且产生于有效作用的时间非局部部分。因此，局域四维有效理论描述了简化系统的低能可观测量，而不是其状态。未破缺的超对称性消除了紧致化的真空能，但没有消除互信息，互信息在前导阶上是振幅平方和。", "authors": [{"name": "Udaykrishna Thattarampilly"}, {"name": "Yunlong Zheng"}], "featured_authors": [{"name": "Udaykrishna Thattarampilly"}, {"name": "Yunlong Zheng"}], "author_count": 2}, {"id": "2610.37038", "category": "hep-th", "title": "Another Brick in the Wall: Spectral Form Factor of Normal Modes in Horizonless Geometries", "abstract": "We compute the normal mode spectrum and its spectral form factor for a probe scalar wave in smooth horizonless backgrounds. We first consider the BTZ black hole with a brickwall that hides the near-horizon region, which has recently been proposed as a toy model for a finite-temperature semiclassical black hole microstate. In this setup, the spectral form factor may or may not have a linear ramp, depending on the details of the brickwall construction. However, we argue that even in cases that do show a ramp, this ramp does not originate from level correlations associated with quantum chaos. Then we calculate the normal mode spectrum for a genuine microstate geometry (superstratum) and find evidence of chaos, both with a ramp and level repulsion. We conclude that the eigenvalue spectrum of normal modes can indeed serve as a tool for investigating the quantum dynamics of fuzzballs; however, the brickwall models are incapable of capturing this phenomenon.", "url": "https://arxiv.org/abs/2610.37038", "type": "理论", "summary": "我们计算平滑无水平背景中探测标量波的简正模频谱及其频谱形状因子。我们首先考虑带有隐藏近地平线区域的砖墙的 BTZ 黑洞，该黑洞最近被提出作为有限温度半经典黑洞微观状态的玩具模型。在此设置中，光谱形状因子可能具有也可能不具有线性斜坡，具体取决于砖墙结构的细节。然而，我们认为，即使在确实显示出斜坡的情况下，这种斜坡也不是源于与量子混沌相关的能级相关性。然后，我们计算真实微观状态几何结构（上层）的简正模谱，并找到混沌的证据，两者都具有斜坡和水平斥力。我们得出的结论是，简正模态的特征值谱确实可以作为研究毛球量子动力学的工具；然而，砖墙模型无法捕捉这种现象。", "authors": [{"name": "A. I. Belokon"}, {"name": "M. Čubrović"}, {"name": "V. Đukić"}, {"name": "V. V. Pushkarev"}, {"name": "L. Umrikhin"}], "featured_authors": [{"name": "A. I. Belokon"}, {"name": "M. Čubrović"}, {"name": "V. Đukić"}, {"name": "V. V. Pushkarev"}, {"name": "L. Umrikhin"}], "author_count": 5}, {"id": "2610.37064", "category": "hep-th", "title": "Scattering amplitudes from geometry of kernel-free functionals on piecewise random null paths with memory", "abstract": "We introduce a simple functional of algebra-valued fields with definite Lorentz properties that is kernel-free yet it encodes the structure of tree-level scattering amplitudes. The fields are evaluated at the points of a piece-wise straight paths in the anti-self-dual plane of complexified Minkowski space, with the directions of consecutive segments correlated so that the path has a velocity memory. We show that momentum-space reduction of the functional generates the cyclic Parke--Taylor factor, off shell in terms of light-front bilinears and on shell in terms of spinor brackets. The same reduction, organized differently, can be naturally promoted to twistor space without any twistor-space input: a closed cyclic chain of Penrose transforms on a twistor line, in which the Parke--Taylor denominators arise as boundary terms of the integrals along the paths. Finally we show that derivatives with respect to one of the path parameter generate numerators that together with the Parke-Taylor denominator build scattering amplitudes. Lorentz invariance fixes the spins of the inserted fields and the homogeneities of the corresponding twistor functions without any use of supersymmetry. The three-point outputs reproduce the kinematic forms of the light-cone cubic vertices of chiral higher-spin theory, and the derivative monomials of order four generate the components of the $\\overline{\\rm MHV}$ supermultiplet of $\\mathcal N=4$ super Yang--Mills theory, off shell and on shell.", "url": "https://arxiv.org/abs/2610.37064", "type": "理论", "summary": "我们引入了一个具有确定洛伦兹性质的简单代数值域函数，它是无核的，但它编码了树级散射幅度的结构。这些场在复明可夫斯基空间的反自对偶平面中的分段直线路径的点处进行评估，连续段的方向相关，以便路径具有速度记忆。我们证明，泛函的动量空间约简生成了循环帕克-泰勒因子，在壳外用光前双线性表示，在壳上用旋量括号表示。同样的简化，以不同的方式组织，可以自然地提升到扭量空间，而无需任何扭量空间输入：彭罗斯的闭合循环链在扭量线上进行变换，其中帕克-泰勒分母作为沿路径的积分的边界项出现。最后，我们证明相对于路径参数之一的导数生成分子，分子与帕克泰勒分母一起构建散射幅度。洛伦兹不变性固定了插入场的自旋和相应扭量函数的同质性，而不使用任何超对称性。\n\n三点输出再现了手性高自旋理论光锥立方顶点的运动学形式，四阶导数单项式生成 $\\overline{\\rm MHV}$ $\\mathcal N=4$ super Yang 超倍数的分量 - 米尔斯理论，壳外和壳内。", "authors": [{"name": "Hiren Kakkad"}, {"name": "Piotr Kotko"}], "featured_authors": [{"name": "Hiren Kakkad"}, {"name": "Piotr Kotko"}], "author_count": 2}, {"id": "2610.37096", "category": "hep-th", "title": "On 2-loop AdS$_2$ superstring partition function in AdS$_5 \\times S^5$ and AdS$_4\\times CP^3$", "abstract": "We revisit the 2-loop computation of the partition function of the GS superstring expanded near the AdS$_2$ surface in AdS$_5\\times S^5$ and AdS$_4\\times {\\rm CP}^3$, dual to $\\frac{1}{2}$ BPS circular Wilson loop in ${\\cal N}=4$ SYM and ABJM theories. In arXiv:2601.08809 it was done in AdS$_5\\times S^5$ using dimensional regularization and a UV pole was found. Since dimensional regularization is problematic for the GS string, here we use a heat-kernel cutoff instead. Then the contribution of the local path integral measure, proportional to $\\delta(0)$, can no longer be ignored. We show that it cancels the $\\delta(0)$ terms coming from the quartic interactions in the action, leaving the square of the difference ${\\rm Str}\\,E$ between the regularized numbers of bosonic and fermionic modes. The result is thus UV finite, the pole of arXiv:2601.08809 being an artefact of dimensional regularization. If all fields are regularized with the same smearing kernel, ${\\rm Str}\\,E=0$ and the 2-loop coefficient $f_2$ vanishes, in tension with $f_2=\\frac{3}{32\\pi^2}$ in SYM theory. In the AdS$_4\\times{\\rm CP}^3$ case the same cancellation leaves a finite term proportional to the square of the coincident value of the massless 2d fermion Green's function, giving, ironically, $f_2=\\frac{3}{32\\pi^2}$ instead of $f_2=0$ required by localization. This term is the level-zero (string) part of the result of arXiv:2609.14497 for the AdS$_2\\times S^1$ M2 brane in AdS$_4\\times S^7/\\mathbb Z_k$, where it is cancelled by the higher $S^1$ modes, which also remove a finite mass shift of the massless fermion in conflict with the AdS$_2$ supersymmetry. This suggests that the type II string path integral measure should contain an extra contribution, supplied in the IIA case by the parent M2 brane; in the AdS$_5\\times S^5$ case it is still to be identified and may resolve the remaining 2-loop mismatch with localization.", "url": "https://arxiv.org/abs/2610.37096", "type": "理论", "summary": "我们重新审视 AdS$_5\\times S^5$ 和 AdS$_4\\times {\\rm CP}^3$ 中在 AdS$_2$ 表面附近扩展的 GS 超弦配分函数的 2 环计算，与 ${\\cal N}=4$ SYM 和 ABJM 理论中的 $\\frac{1}{2}$ BPS 圆形 Wilson 环对偶。在 arXiv:2601.08809 中，它是使用维度正则化在 AdS$_5\\times S^5$ 中完成的，并找到了 UV 极点。由于维度正则化对于 GS 字符串来说是有问题的，因此这里我们使用热核截止。那么局部路径积分测量的贡献与$\\delta(0)$成正比，就不能再被忽略了。我们证明它消除了来自动作中四次相互作用的 $\\delta(0)$ 项，留下玻色子和费米子模式的正则化数之间的差值 ${\\rm Str}\\,E$ 的平方。因此，结果是 UV 有限的，arXiv:2601.08809 的极点是维度正则化的产物。如果所有场都使用相同的涂抹核进行正则化，则 ${\\rm Str}\\,E=0$ 和 2 环系数 $f_2$ 消失，与 SYM 理论中的 $f_2=\\frac{3}{32\\pi^2}$ 存在张力。\n\n在 AdS$_4\\times{\\rm CP}^3$ 情况下，相同的抵消留下了一个与无质量 2d 费米子格林函数重合值的平方成正比的有限项，讽刺的是，给出了 $f_2=\\frac{3}{32\\pi^2}$ 而不是本地化所需的 $f_2=0$。这项是 arXiv:2609.14497 结果的零级（字符串）部分，用于 AdS$_4\\times S^7/\\mathbb Z_k$ 中的 AdS$_2\\times S^1$ M2 膜，其中它被较高的 $S^1$ 模式取消，这也消除了与 AdS$_2$ 超对称性冲突的无质量费米子的有限质量偏移。这表明 II 型弦路径积分测量应该包含额外的贡献，在 IIA 情况下由父 M2 膜提供；在 AdS$_5\\times S^5$ 情况下，仍有待识别，并且可以解决剩余的 2 环与本地化的不匹配问题。", "authors": [{"name": "Arkady A. Tseytlin"}], "featured_authors": [{"name": "Arkady A. Tseytlin"}], "author_count": 1}, {"id": "2610.37117", "category": "hep-th", "title": "The Disordered Universe 2025: Features in a $Λ>0$ Universe", "abstract": "A complete understanding of cosmology, from its earliest epoch all the way to the current dark energy dominated era, requires the development of a mathematical framework that incorporates quantum features in an expanding universe. Such a framework, alongside a description of the underlying degrees of freedom, is so far lacking. Several of the pertinent challenges and puzzles already arise upon considering even the most idealised model of an expanding universe --- the de Sitter spacetime and fluctuations thereof. In these lectures, we review some elementary ideas of the de Sitter physics, passing through the representation theory of the de Sitter group, aspects of canonical quantum gravity, all the way to attempts in describing quasi-local features. Throughout, we highlight open problems that motivate ongoing efforts to understand quantum gravity and cosmology in universes with $\\Lambda>0$. These notes are based on a series of lectures held during the La Ricotta Summer School: The Disordered Universe 2025 from 21 July to 1 August 2025.", "url": "https://arxiv.org/abs/2610.37117", "type": "理论", "summary": "对宇宙学的完整理解，从最早的时代一直到当前暗能量主导的时代，需要开发一个包含膨胀宇宙中的量子特征的数学框架。迄今为止，还缺乏这样的框架以及对基本自由度的描述。即使是考虑膨胀宇宙的最理想化模型——德西特时空及其波动，一些相关的挑战和难题也已经出现。在这些讲座中，我们回顾了德西特物理学的一些基本思想，通过德西特群的表示理论、规范量子引力的各个方面，一直到描述准局域特征的尝试。在整个过程中，我们强调了一些悬而未决的问题，这些问题激励着人们不断努力理解 $\\Lambda>0$ 宇宙中的量子引力和宇宙学。这些笔记基于 2025 年 7 月 21 日至 8 月 1 日 La Ricotta 暑期学校：2025 年无序宇宙期间举办的一系列讲座。", "authors": [{"name": "Samuel Brian"}, {"name": "Yakov Landau"}, {"name": "Tommaso Marini"}, {"name": "Daniel McLoughlin"}, {"name": "Polina Petriakova"}, {"name": "Rajat Sharma"}, {"name": "Dionysios Anninos"}, {"name": "Paolo Benincasa"}, {"name": "Guilherme Leite Pimentel"}], "featured_authors": [{"name": "Samuel Brian"}, {"name": "Yakov Landau"}, {"name": "Tommaso Marini"}, {"name": "Dionysios Anninos"}, {"name": "Paolo Benincasa"}, {"name": "Guilherme Leite Pimentel"}], "author_count": 9}, {"id": "2610.37160", "category": "hep-th", "title": "The Disordered Universe 2025: An Intro and a Vision", "abstract": "The Disordered Universe is a novel research direction that exploits ideas and techniques coming from apparently unrelated research areas, ranging from cosmology to scattering amplitudes in particle physics and disordered complex systems, with the aim of addressing open questions in cosmology at all scales, from the very infra-red (or very late time) to the early universe. This paper acts as a general introduction and vision for a set of lectures delivered at the first La Ricotta Summer School \"The Disordered Universe 2025\", held from 21 July to 10 August 2025. These lectures involved open quantum systems, analytic properties of scattering amplitudes and correlation functions, foundations and quantum aspects of the de Sitter universe, as well as statistical physics out of equilibrium and spin glasses. While the lecture notes related to each course taught at the school will be published separately and are inevitably devoted to both conceptual and technical aspects of each of these topics, the school was not meant to be a collage of independent topics: the present paper has the purpose of outlining the global vision, how cosmology ends up being a unifier and benefits from both their viewpoint and techniques, how all the concepts and techniques originally coming from these four different areas are part of the same cosmological narrative, why this point of view deserves to be explored, and drawing perspectives for the future. We consider it crucial to build a microscopic theory for the early universe and maybe one that embraces all scales.", "url": "https://arxiv.org/abs/2610.37160", "type": "理论", "summary": "无序宇宙是一个新颖的研究方向，它利用了来自明显不相关的研究领域的思想和技术，从宇宙学到粒子物理学中的散射振幅和无序复杂系统，其目的是解决从远红外（或极晚时间）到早期宇宙的所有尺度的宇宙学中的开放问题。本文是对 2025 年 7 月 21 日至 8 月 10 日举行的第一届 La Ricotta 暑期学校“无序宇宙 2025”的一系列讲座的总体介绍和愿景。这些讲座涉及开放量子系统、散射振幅和相关函数的分析性质、德西特宇宙的基础和量子方面，以及脱离平衡和自旋玻璃的统计物理。\n\n虽然与学校教授的每门课程相关的讲义将单独出版，并且不可避免地致力于每个主题的概念和技术方面，但学校并不意味着是独立主题的拼贴：本文的目的是概述全球视野，宇宙学最终如何成为一个统一体并从其观点和技术中受益，最初来自这四个不同领域的所有概念和技术如何成为同一个宇宙论叙述的一部分，为什么这个观点值得探索，并绘制对未来的展望。我们认为建立一种早期宇宙的微观理论，也许是一个涵盖所有尺度的微观理论至关重要。", "authors": [{"name": "Paolo Benincasa"}, {"name": "Guilherme Leite Pimentel"}], "featured_authors": [{"name": "Paolo Benincasa"}, {"name": "Guilherme Leite Pimentel"}], "author_count": 2}, {"id": "2610.37223", "category": "hep-th", "title": "Two types of hairy black holes in the (3+1)-dimensional $O(3)$ sigma-model", "abstract": "We construct stationary axially symmetric black holes with scalar hair in the gravitating nonlinear $O(3)$ sigma model with a partly negative symmetry-breaking potential. Our results show that it supports two qualitatively different types of asymptotically flat hairy black holes, distinguished by their connection to the corresponding solitonic branches and by the structure of their scalar hair; the type I black holes are connected to the vacuum branch and type II black holes are connected to regular scalaron-supported spinning solitons. The type II black holes have a strongly deformed scalar field structure, with the scalar field taking its vacuum value on the symmetry axis and approaching the anti-vacuum in the near-horizon equatorial region. We analyze their global charges, horizon properties, and dependence on the model parameters, comparing the solutions with Kerr black holes. For sufficiently weak gravitational coupling, the branch connectivity changes: the fundamental branches of types I and II reconnect to form one continuous family, while their corresponding second branches form another. We find that, in contrast to the vacuum-connected type I family, the scalaron-supported type II black holes extend to substantially larger horizon radii while preserving a nontrivial scalar configuration outside the horizon.", "url": "https://arxiv.org/abs/2610.37223", "type": "理论", "summary": "我们在具有部分负对称破缺势的引力非线性 $O(3)$ sigma 模型中构造了带有标量毛发的静止轴对称黑洞。我们的结果表明，它支持两种性质不同的渐近扁平毛状黑洞，它们的区别在于它们与相应的孤子分支的连接以及它们的标量毛的结构； I 型黑洞连接到真空分支，II 型黑洞连接到规则标量支持的旋转孤子。 II型黑洞具有强烈变形的标量场结构，标量场在对称轴上取真空值，在近视界赤道区接近反真空。我们分析了它们的全局电荷、视界特性以及对模型参数的依赖性，并将解与克尔黑洞进行了比较。对于足够弱的引力耦合，分支连通性会发生变化：I 型和 II 型的基本分支重新连接以形成一个连续的家族，而它们相应的第二分支则形成另一个分支。\n\n我们发现，与真空连接的 I 型黑洞相比，标量支持的 II 型黑洞延伸到更大的视界半径，同时在视界外保留了非平凡的标量配置。", "authors": [{"name": "Jutta Kunz"}, {"name": "Aliaksei Mikhaliuk"}, {"name": "Yakov Shnir"}], "featured_authors": [{"name": "Jutta Kunz"}, {"name": "Aliaksei Mikhaliuk"}, {"name": "Yakov Shnir"}], "author_count": 3}, {"id": "2610.37285", "category": "hep-th", "title": "MPS overlaps and Sklyanin determinants", "abstract": "We derive explicit overlap functions for integrable matrix product states associated with arbitrary finite-dimensional irreducible evaluation representations of the orthogonal and symplectic twisted Yangians. The central step is to relate the commuting quasi-determinants entering the universal overlap formula to Sklyanin determinants of nested subalgebras. For orthogonal evaluation representations, this relation determines their spectra directly in the Gelfand--Tsetlin basis. In the symplectic case, we combine Sklyanin determinants and minors with a factorization of the nested rank-two boundary matrices to obtain the corresponding spectra. The resulting overlap functions are explicit products parametrized by Gelfand--Tsetlin patterns and require only the highest-weight data of the underlying orthogonal or symplectic representation. Together with the universal ratio of Gaudin determinants and the model-dependent pseudovacuum overlap coefficients, they determine the normalized MPS overlaps. We also express the overlap functions in the orthogonal case beyond evaluation representations in terms of the highest weights arising along the nested twisted-Yangian subalgebras.", "url": "https://arxiv.org/abs/2610.37285", "type": "理论", "summary": "我们推导了与正交和辛扭曲杨量的任意有限维不可约评估表示相关的可积矩阵乘积状态的显式重叠函数。中心步骤是将进入通用重叠公式的交换准行列式与嵌套子代数的 Sklyanin 行列式联系起来。对于正交评估表示，这种关系直接在 Gelfand-Tsetlin 基础上确定它们的光谱。在辛情况下，我们将 Sklyanin 行列式和次式与嵌套二阶边界矩阵的因式分解相结合，以获得相应的谱。由此产生的重叠函数是由 Gelfand-Tsetlin 模式参数化的显式乘积，并且仅需要基础正交或辛表示的最高权重数据。它们与 Gaudin 行列式的通用比率和模型相关的伪真空重叠系数一起确定归一化的 MPS 重叠。我们还根据沿着嵌套扭曲杨子代数产生的最高权重来表达正交情况下超出评估表示的重叠函数。", "authors": [{"name": "Tamas Gombor"}], "featured_authors": [{"name": "Tamas Gombor"}], "author_count": 1}, {"id": "2610.37302", "category": "hep-th", "title": "On the geometric origin of central charges in gravity", "abstract": "Central extensions of asymptotic symmetry algebras are traditionally determined through an explicit computation of the algebra of conserved charges. We show that, within an ambiguity-free covariant phase space formalism based on the Noetherian split, they instead arise as intrinsic quantities completely determined by the Lagrangian through the geometry of the associated covariant phase space. We prove two general Charge Representation Theorems describing the canonical realization of diffeomorphism symmetries in the presence of field-dependent vector fields and Lagrangian anomalies, corresponding respectively to vanishing and integrable Noetherian flux. In both cases, we derive explicit expressions for the associated central extensions and establish the corresponding cocycle identities. This provides a constructive algorithm for determining central charges directly from the Lagrangian formulation of the theory, without requiring an explicit computation of the charge algebra. As a non-trivial application, we consider asymptotically locally AdS$_3$ spacetimes with Penrose--Brown--Henneaux boundary conditions. We recover the corresponding centrally extended asymptotic symmetry algebra, providing an explicit realization of the Charge Representation Theorems.", "url": "https://arxiv.org/abs/2610.37302", "type": "理论", "summary": "渐近对称代数的中心扩展传统上是通过守恒电荷代数的显式计算来确定的。我们证明，在基于诺特分裂的无歧义协变相空间形式主义中，它们作为内在量出现，完全由拉格朗日通过相关协变相空间的几何形状确定。我们证明了两个一般的电荷表示定理，描述了在场相关矢量场和拉格朗日异常存在的情况下微分同胚对称性的规范实现，分别对应于消失和可积诺特通量。在这两种情况下，我们都导出相关中心扩展的显式表达式并建立相应的共循环恒等式。这提供了一种构造性算法，用于直接从理论的拉格朗日公式确定中心电荷，而不需要显式计算电荷代数。作为一个重要的应用，我们考虑具有 Penrose--Brown--Henneaux 边界条件的渐近局部 AdS$_3$ 时空。\n\n我们恢复了相应的中心扩展渐近对称代数，提供了电荷表示定理的显式实现。", "authors": [{"name": "Lorenzo Di Giacomo"}, {"name": "Daniele Pranzetti"}], "featured_authors": [{"name": "Lorenzo Di Giacomo"}, {"name": "Daniele Pranzetti"}], "author_count": 2}, {"id": "2610.37449", "category": "hep-th", "title": "Entanglement Bounds on Cardy Growth in Higher Dimensions", "abstract": "We propose bounds relating thermal entropy to entanglement in unitary conformal field theories: $f\\le4\\pi^2a$ in four dimensions and $f\\le2.99830949\\ldots\\,F$ in three dimensions. Here $f$ is the dimensionless coefficient of the cosmological constant term in the thermal effective action, $a$ is the Euler anomaly coefficient, and $F$ is the sphere free energy. Spherical Rényi entropy relates the four-dimensional bound to the conformal collider bounds. We formulate a stronger conjectural inequality involving the stress-tensor three-point function, saturated by every free theory, and establish it in controlled regimes of weakly coupled gauge theories, large-$N$ vector models, and holographic CFTs. Finite-$N$ numerical results provide additional tests. The bounds constrain the Cardy growth of the density of states at high energy.", "url": "https://arxiv.org/abs/2610.37449", "type": "理论", "summary": "我们提出了将热熵与酉共形场论中的纠缠相关的界限：四个维度中的 $f\\le4\\pi^2a$ 和三个维度中的 $f\\le2.99830949\\ldots\\,F$。这里$f$是热有效作用中宇宙常数项的无量纲系数，$a$是欧拉反常系数，$F$是球体自由能。球形 Rényi 熵将四维边界与共形对撞机边界联系起来。我们制定了一个更强的猜想不等式，涉及应力张量三点函数，被每个自由理论饱和，并将其建立在弱耦合规范理论、大$N$向量模型和全息CFT的受控体系中。有限$N$ 数值结果提供了额外的测试。该界限限制了高能状态密度的卡迪增长。", "authors": [{"name": "Yuya Kusuki"}, {"name": "Yin Tang"}], "featured_authors": [{"name": "Yuya Kusuki"}, {"name": "Yin Tang"}], "author_count": 2}, {"id": "2610.37458", "category": "hep-th", "title": "Exact $T\\bar{T}$-Like flows in Integrable Sigma Models", "abstract": "Recently, a general exact autonomy framework for $T\\bar{T}$-like deformations of 2D integrable sigma models and 4D nonlinear electrodynamics has been developed. The theories are characterized by the Courant-Hilbert equation and admit an equivalent description in the Russo-Townsend auxiliary-field formulation. For general one-scale families, we derive an exact irrelevant flow equation of the universal form $\\partial_\\lambda \\mathcal{L}=X\\mathcal{F}(\\sqrt{Y/X}), \\,\\,\\,X=T_{\\mu\\nu}T^{\\mu\\nu}, \\,\\,\\, Y=(T^\\mu_\\mu)^2 $ where the function $\\mathcal{F}$ is determined by the underlying Courant-Hilbert solution. We obtain a parametric representation valid for arbitrary one-scale models, establish its perturbative expansion in terms of the defining function or auxiliary potential, and identify the domain in which the flow remains regular. We also show that the irrelevant flow commutes with the marginal root-$T\\bar{T}$ deformation and that both flows preserve classical integrability. Explicit results are derived for generalized Born-Infeld, q-deformed, no-$\\tau$-maximum, and logarithmic models, with the latter admitting a closed representation. Finally, we extend the flow construction to arbitrary spacetime dimension $(d)$, revealing a common one-variable structure that connects two-dimensional integrable sigma models to four-dimensional self-dual nonlinear electrodynamics. These results provide a systematic framework for constructing and classifying exact $T\\bar{T}$-like flows beyond the standard Born-Infeld setting.", "url": "https://arxiv.org/abs/2610.37458", "type": "理论", "summary": "最近，针对 2D 可积 sigma 模型和 4D 非线性电动力学的 $T\\bar{T}$ 类变形的通用精确自治框架已经开发出来。这些理论以 Courant-Hilbert 方程为特征，并允许 Russo-Townsend 辅助场公式中的等效描述。对于一般的一尺度族，我们推导出通用形式 $\\partial_\\lambda \\mathcal{L}=X\\mathcal{F}(\\sqrt{Y/X}), \\,\\,\\,X=T_{\\mu\\nu}T^{\\mu\\nu}, \\,\\,\\, Y=(T^\\mu_\\mu)^2 $ 的精确不相关流方程，其中函数 $\\mathcal{F}$ 由底层确定库朗-希尔伯特解。我们获得对任意一尺度模型有效的参数表示，根据定义函数或辅助势建立其微扰展开，并识别流动保持规则的域。我们还表明，不相关的流与边际根 $T\\bar{T}$ 变形进行交换，并且两种流都保留了经典的可积性。针对广义 Born-Infeld、q 变形、无 $\\tau$ 最大值和对数模型导出了显式结果，后者承认封闭表示。\n\n最后，我们将流结构扩展到任意时空维度 $(d)$，揭示了一种常见的单变量结构，它将二维可积 sigma 模型连接到四维自对偶非线性电动力学。这些结果提供了一个系统框架，用于构建和分类超出标准 Born-Infeld 设置的精确 $T\\bar{T}$ 类流。", "authors": [{"name": "H. Babaei-Aghbolagh"}], "featured_authors": [{"name": "H. Babaei-Aghbolagh"}], "author_count": 1}, {"id": "2610.37506", "category": "hep-th", "title": "Recovering the leading quantum correction to Newton Potential beyond the Trace Anomaly", "abstract": "The leading quantum correction to the Newton potential induced by the one-loop vacuum effective action of gravity is of order $1/r^3$. One-loop corrections are also responsible for the trace anomaly. We first show, following our previous work, that the effective action obtained by integrating the trace anomaly cannot reproduce this correction. We then complete the semiclassical Einstein equations with the vacuum-polarization stress tensor in addition to the anomalous stress tensor. The full stress tensor follows from the approximation proposed by Visser for the Schwarzschild spacetime. The stress tensor is taken in the Boulware vacuum and expanded at large distance, where it is conserved and reproduces the trace anomaly. Solving the equations perturbatively in $\\hbar$, we find that Visser's approximation generates the $1/r^3$ correction to the Newton potential, linear in the source mass $M$, with the same structure as the one-loop result. Its coefficient is controlled by a single free parameter of Visser's polynomial ansatz, which can be tuned to match the one-loop value. The dependence on the trace-anomaly coefficient appears only at order $1/r^4$.", "url": "https://arxiv.org/abs/2610.37506", "type": "理论", "summary": "由单环真空有效引力作用引起的牛顿势的主要量子修正为 $1/r^3$ 量级。单环校正也是造成迹线异常的原因。继我们之前的工作之后，我们首先表明，通过整合迹线异常获得的有效行动无法重现这种校正。然后，除了反常应力张量之外，我们还使用真空极化应力张量来完成半经典爱因斯坦方程。完整的应力张量源自 Visser 针对史瓦西时空提出的近似。应力张量在 Boulware 真空中获取并在大距离处扩展，在那里它被守恒并再现痕迹异常。对 $\\hbar$ 中的方程进行扰动求解，我们发现 Visser 近似生成了对牛顿势的 $1/r^3$ 校正，与源质量 $M$ 呈线性关系，其结构与单循环结果相同。其系数由 Visser 多项式 ansatz 的单个自由参数控制，可以调整该参数以匹配单环值。对迹异常系数的依赖性仅出现在 $1/r^4$ 阶上。", "authors": [{"name": "Riccardo Fecchio"}], "featured_authors": [{"name": "Riccardo Fecchio"}], "author_count": 1}, {"id": "2610.37546", "category": "hep-th", "title": "Reflected constraint algebras of open Carroll--Weyl null strings", "abstract": "We construct a classical reflected phase space for open Carroll--Weyl null strings with Dirichlet conditions at the target origin or linear mixed target gluings. The reflection-compatible constraints are differentiable, their Hamiltonian flows preserve the boundary domain, and the constraint system is weakly first class on its regular part. The induced boundary algebra extends the boundary Carrollian conformal algebra by an even weight-one Carroll--Weyl current, with normalization fixed by the reflected symplectic form. The regular local embedding count agrees with that of the closed theory. We exhibit a four-dimensional mixed sector with one canonical field pair and a separate solution family carrying a nonzero conserved target-space boost charge and a nondegenerate symplectic pullback. Smooth fixed-point reflection selects characteristic endpoints. For timelike defects with natural tangential variations and no additional boundary interactions, non-characteristic endpoints have vanishing Carroll flow. For displaced Dirichlet data, we derive the canonical affine lift and its required shift of the edge momentum by integrated bulk momentum.", "url": "https://arxiv.org/abs/2610.37546", "type": "理论", "summary": "我们为开放的 Carroll-Weyl 空弦构造了一个经典的反射相空间，其狄利克雷条件位于目标原点或线性混合目标粘合处。反射兼容约束是可微的，它们的哈密顿流保留边界域，并且约束系统在其常规部分是弱一流的。诱导边界代数通过均匀权重一的卡罗尔-外尔电流扩展了边界卡罗尔共形代数，并通过反射辛形式进行归一化。常规局部嵌入计数与封闭理论一致。我们展示了一个四维混合扇区，具有一个规范场对和一个单独的解决方案族，该解决方案族携带非零守恒目标空间升压电荷和非简并辛拉回。平滑定点反射选择特征端点。对于具有自然切向变化且没有额外边界相互作用的类时缺陷，非特征端点具有消失的卡罗尔流。对于位移狄利克雷数据，我们通过积分体动量推导出规范仿射升力及其所需的边缘动量移动。", "authors": [{"name": "Limin Zeng"}], "featured_authors": [{"name": "Limin Zeng"}], "author_count": 1}, {"id": "2610.37554", "category": "hep-th", "title": "Resurgence of Black Holes in Thermal OPE", "abstract": "The momentum-space thermal OPE generically gives an asymptotic high-energy expansion of thermal two-point functions. We study the resurgent structure of this expansion in holographic CFTs at infinite and finite volume, whose dual bulk geometries are planar and spherical AdS black holes, respectively. The perturbative expansion is fixed to all orders by the stress-tensor sector of the thermal OPE and can be computed from a near-boundary analysis of the bulk wave equation. Non-perturbative effects, on the other hand, encode information about the bulk geometry away from the boundary. Using exact WKB analysis, we identify the locations of the associated Borel singularities as WKB actions between the AdS boundary and distinguished points in the complex radial plane, which include the black hole singularity in certain regimes. Furthermore, we identify a complex-frequency chamber in the timelike momentum regime where Borel resummation of the high-energy expansion reconstructs the full thermal two-point function. We further derive Stokes jumps that determine the non-perturbative contributions required upon crossing the boundary of this chamber.", "url": "https://arxiv.org/abs/2610.37554", "type": "理论", "summary": "动量空间热 OPE 一般给出热两点函数的渐近高能展开。我们研究了无限和有限体积全息 CFT 中这种膨胀的复活结构，其双体几何形状分别是平面和球形 AdS 黑洞。微扰膨胀由热 OPE 的应力张量部分固定为所有阶，并且可以通过体波方程的近边界分析来计算。另一方面，非微扰效应对远离边界的体几何形状的信息进行编码。使用精确的 WKB 分析，我们将相关的 Borel 奇点的位置确定为 AdS 边界和复杂径向平面中的特征点之间的 WKB 作用，其中包括某些状态下的黑洞奇点。此外，我们确定了类时动量状态下的复频室，其中高能膨胀的 Borel 恢复重建了完整的热两点函数。我们进一步推导出斯托克斯跳跃，它确定了穿过该室边界时所需的非微扰贡献。", "authors": [{"name": "Alba Grassi"}, {"name": "Hewei Frederic Jia"}], "featured_authors": [{"name": "Alba Grassi"}, {"name": "Hewei Frederic Jia"}], "author_count": 2}, {"id": "2610.37603", "category": "hep-th", "title": "A Spin on Radiation Reaction with Cuts", "abstract": "We derive the radiation-reaction equations of motion for a spinning charged body, the $\\sqrt{\\text{Kerr}}$ particle, through quadratic order in its spin, generalising the Abraham--Lorentz--Dirac equation. Extending an argument of Coleman, we obtain radiation reaction equations by evaluating the self-field of the spinning body on its own worldline, and removing its divergences with dimensional regularisation. We use the resulting equations of motion to compute the electromagnetic waveform emitted in the scattering of the spinning body off a spectator charge, both at tree level and including the leading radiation-reaction correction, which enters at one loop. Then, we apply the construction introduced in a previous work by some of the authors -- where radiation reaction is encoded in unitarity cuts involving Compton amplitudes -- to spinning particles, and recompute the radiation-reaction contribution to the one-loop waveform. We find that the waveform calculated using classical and amplitude methods agree through quadratic order in spin, providing a check on our radiation-reaction equations. Along the way, we also reproduce known results for linear-in-spin self-force effects and for the spinless self-force in six dimensions.", "url": "https://arxiv.org/abs/2610.37603", "type": "理论", "summary": "我们通过其自旋的二次阶推导了旋转带电体（$\\sqrt{\\text{Kerr}}$粒子）的辐射反应方程，推广了亚伯拉罕-洛伦兹-狄拉克方程。扩展科尔曼的论证，我们通过评估旋转体在其自身世界线上的自场并通过维度正则化消除其发散来获得辐射反应方程。我们使用由此产生的运动方程来计算旋转体从观察者电荷散射时发出的电磁波形，既在树层面，又包括在一个循环中进入的主要辐射反应校正。然后，我们将一些作者在之前的工作中引入的结构（其中辐射反应编码为涉及康普顿振幅的幺正性割断）应用于旋转粒子，并重新计算辐射反应对单环波形的贡献。我们发现使用经典方法和振幅方法计算的波形在自旋的二次阶上一致，这为我们的辐射反应方程提供了检查。\n\n在此过程中，我们还重现了线性自旋自力效应和六维无自旋自力的已知结果。", "authors": [{"name": "Asaad Elkhidir"}, {"name": "Matteo Sergola"}, {"name": "Pablo Vives Matasan"}], "featured_authors": [{"name": "Asaad Elkhidir"}, {"name": "Matteo Sergola"}, {"name": "Pablo Vives Matasan"}], "author_count": 3}, {"id": "2610.37610", "category": "hep-th", "title": "Stability of Axion--SU(2) Chromomagnetic Condensates with Stochastic Spin-2 Dressing", "abstract": "We investigate whether a stochastic spin-2 gauge-field background can stabilize the chromomagnetic condensate of axion--SU(2) Yang--Mills theory at fixed axion Noether charge in flat spacetime. By coarse-graining the gauge field, we uncover a new class of statistically homogeneous and isotropic spin-2-dressed chromomagnetic condensates satisfying the classical background equations. We then study their fluctuations in two steps. First, at the mean-field (Hartree) level, we determine the fluctuation spectrum and the region where all modes remain positively gapped. Second, we include the leading scattering corrections from fluctuations propagating through the stochastic background. We find that gap survival is controlled by non-Gaussian correlations of the dressing. Statistical positivity constrains the otherwise undetermined higher-point contributions through model-independent consistency conditions, without fixing their detailed momentum dependence. These bounds separate the Hartree-gapped region into a part where a positive Born-level gap is ruled out and a part where stability remains possible. The results are relevant to non-Abelian gauge condensates in early-universe cosmology, including inflation, dark energy, and primordial gravitational waves, and to QCD-like gauge sectors above confinement where thermal effects are subleading.", "url": "https://arxiv.org/abs/2610.37610", "type": "理论", "summary": "我们研究了随机自旋2规范场背景是否可以稳定轴子色磁凝聚体--SU(2)杨--米尔斯理论在平坦时空固定轴子诺特电荷处。通过粗粒度规范场，我们发现了一类新的统计均匀且各向同性自旋 2 修饰的色磁凝聚体，满足经典背景方程。然后我们分两步研究它们的波动。首先，在平均场（Hartree）水平，我们确定波动谱和所有模式保持正间隙的区域。其次，我们包括通过随机背景传播的波动的主要散射校正。我们发现间隙生存是由敷料的非高斯相关性控制的。统计正性通过与模型无关的一致性条件限制了其他未确定的较高点贡献，而不修复其详细的动量依赖性。这些边界将哈特里差距区域分为排除正玻恩水平差距的部分和仍然可能保持稳定的部分。\n\n这些结果与早期宇宙宇宙学中的非阿贝尔规范凝聚态相关，包括暴胀、暗能量和原初引力波，以及约束上方的类 QCD 规范扇区，其中热效应是次主导的。", "authors": [{"name": "Sha Azyzy"}, {"name": "Azadeh Maleknejad"}, {"name": "Vahid Kamali"}], "featured_authors": [{"name": "Sha Azyzy"}, {"name": "Azadeh Maleknejad"}, {"name": "Vahid Kamali"}], "author_count": 3}, {"id": "2610.37667", "category": "hep-th", "title": "The 't Hooft model on (A)dS$_2$", "abstract": "We solve large-$N$ two-dimensional QCD with fundamental quarks---the 't Hooft model---on rigid AdS$_2$ and dS$_2$. Their isometries preserve the null gauge $A_-=0$ and in affine coordinates the curvature enters the light-front Hamiltonian only through the special-conformal generator of the null line. The $SL(2,\\mathbb{R)}$ Casimir then results in an exact meson equation: 't Hooft's equation plus a Legendre operator whose sign is determined by the curvature. On AdS$_2$ it is related to equations proposed in the context of folded/segmented strings and light-front holography. The pion is massless in the chiral limit and obeys a Gell-Mann--Oakes--Renner relation that fixes the chiral condensate, the dimensions cross over from Regge to logarithmic growth once the flux tube exceeds the curvature radius, and the flat-space integrable structure survives. We also solve the problem of a quark interacting with an antiquark placed at the boundary: beyond a critical coupling the string pulls it back to the boundary, resulting in a scattering phase. On dS$_2$ and due to the expansion of space, the mesons are unstable resonances even at $N=\\infty$ and eventually dissociate. Their widths are given by Boltzmann factors at the de Sitter temperature.", "url": "https://arxiv.org/abs/2610.37667", "type": "理论", "summary": "我们在刚性 AdS$_2$ 和 dS$_2$ 上用基本夸克（'t Hooft 模型）求解大 $N$ 二维 QCD。它们的等距保留零规范$A_-=0$，并且在仿射坐标中，曲率仅通过零线的特殊共形生成器进入光前哈密顿量。然后$SL(2,\\mathbb{R)}$卡西米尔产生精确的介子方程：'t Hooft方程加上勒让德算子，其符号由曲率确定。在 AdS$_2$ 上，它与在折叠/分段弦和光前全息术的背景下提出的方程相关。 π介子在手性极限下是无质量的，并且遵循固定手性凝聚体的盖尔曼-奥克斯-雷纳关系，一旦通量管超过曲率半径，尺寸就会从雷格跨越到对数增长，并且平坦空间可积结构得以保留。我们还解决了夸克与边界处的反夸克相互作用的问题：超出临界耦合，弦将其拉回边界，导致散射相。在 dS$_2$ 上，由于空间的膨胀，即使在 $N=\\infty$ 下，介子也会不稳定共振并最终解离。\n\n它们的宽度由德西特温度下的玻尔兹曼因子给出。", "authors": [{"name": "Panos Betzios"}], "featured_authors": [{"name": "Panos Betzios"}], "author_count": 1}, {"id": "2610.35932", "category": "math-ph", "title": "Stability analysis of the Lane--Emden equation of index $n=5$ describing polytropic gas spheres", "abstract": "We study the Lane--Emden equation of index $n=5$, the critical polytropic case separating finite-radius from infinite-radius self-gravitating equilibria. The scaling family $\\theta_\\lambda(\\xi)=\\lambda^{1/2}\\theta(\\lambda\\xi)$ generates a neutral mode $\\phi_0=\\tfrac12\\theta+\\xi\\theta'$ about the Schuster profile. Schuster's transformation and a logarithmic variable reduce the equation to the autonomous Hamiltonian system $\\ddot\\nu=\\tfrac14(\\nu-\\nu^5)$ with a first integral. Besides the Schuster (separatrix) and Srivastava solutions, every orbit crossing $\\nu=0$ is given in closed form by a Weierstrass $\\wp$-function, and the closed forms agree with direct numerical integration to about $10^{-12}$. Up to scaling and sign, the Schuster solution is the only solution regular at the center, and it separates positive solutions from solutions with infinitely many zeros. In homology-invariant variables the singular solution $\\theta=(2\\xi)^{-1/2}$ is a center exactly at $n=5$, where its stability changes. For a distance-varying Emden--Fowler system with a shifted equilibrium we prove that at $n=5$ the unique equilibrium is linearly and nonlinearly unstable. Finally, the linearization about the Schuster profile is the Schrödinger operator $L=-\\Delta_r-5\\theta_S^4$ on $L^2((0,\\infty),\\xi^2d\\xi)$. Its Friedrichs extension has essential spectrum $[0,\\infty)$, a threshold resonance at $0$ carried by the non-normalizable scaling mode, and exactly one negative eigenvalue, $\\lambda_0\\approx-1.21$, so the Schuster profile is a saddle point of the associated energy functional.", "url": "https://arxiv.org/abs/2610.35932", "type": "理论", "summary": "我们研究指数 $n=5$ 的 Lane--Emden 方程，这是将有限半径与无限半径自引力平衡分开的临界多方情况。缩放族 $\\theta_\\lambda(\\xi)=\\lambda^{1/2}\\theta(\\lambda\\xi)$ 生成关于舒斯特轮廓的中性模式 $\\phi_0=\\tfrac12\\theta+\\xi\\theta'$。舒斯特变换和对数变量通过第一个积分将方程简化为自治哈密顿系统 $\\ddot\\nu=\\tfrac14(\\nu-\\nu^5)$。除了 Schuster（分离矩阵）和 Srivastava 解之外，每个穿过 $\\nu=0$ 的轨道都由 Weierstrass $\\wp$ 函数以闭合形式给出，并且闭合形式与直接数值积分一致到大约 $10^{-12}$。在缩放和符号方面，舒斯特解是唯一位于中心的正则解，它将正解与具有无限多个零的解分开。在同调不变变量中，奇异解 $\\theta=(2\\xi)^{-1/2}$ 恰好位于 $n=5$ 处，其稳定性在此发生变化。对于具有移动平衡的距离变化 Emden--Fowler 系统，我们证明在 $n=5$ 时，唯一平衡是线性和非线性不稳定的。\n\n最后，关于舒斯特轮廓的线性化是 $L^2((0,\\infty),\\xi^2d\\xi)$ 上的薛定谔算子 $L=-\\Delta_r-5\\theta_S^4$。它的 Friedrichs 扩展具有基本谱 $[0,\\infty)$、由不可归一化缩放模式携带的 $0$ 处的阈值共振，以及恰好一个负特征值 $\\lambda_0\\approx-1.21$，因此舒斯特轮廓是相关能量泛函的鞍点。", "authors": [{"name": "S. C. Mancas"}, {"name": "Ronald Adams"}], "featured_authors": [{"name": "S. C. Mancas"}, {"name": "Ronald Adams"}], "author_count": 2}, {"id": "2610.36131", "category": "math-ph", "title": "Universal Critical Jump for Inverse-Square Ising Ferromagnets", "abstract": "For every translation-invariant ferromagnetic Ising chain with $n^2J_n\\to B>0$, we prove $2\\beta_cBm_c^2=1$, without restrictions on the finite core or the tail convergence rate. The proof bounds the energy of macroscopic interfaces and rules them out if the critical product exceeds one. Despite the nonzero jump, connected susceptibility is infinite both at criticality and in a neighboring ordered interval. At the critical coupling, the excess magnetization decays more slowly than any positive power of the field as the field tends to zero. We also prove the jump relation in continuous time, for a positive-Stieltjes class of Ohmic spin-boson models.", "url": "https://arxiv.org/abs/2610.36131", "type": "理论", "summary": "对于每个 $n^2J_n\\to B>0$ 的平移不变铁磁 Ising 链，我们证明 $2\\beta_cBm_c^2=1$，不受有限核心或尾部收敛速度的限制。该证明限制了宏观界面的能量，并在临界乘积超过 1 时将其排除。尽管存在非零跳跃，但在临界点和相邻有序区间内，连接的敏感性都是无限的。在临界耦合处，当磁场趋于零时，过量磁化强度的衰减速度比磁场的任何正功率衰减得更慢。我们还证明了欧姆自旋玻色子模型的正 Stieltjes 类连续时间的跳跃关系。", "authors": [{"name": "Dyuman Bhattacharya"}], "featured_authors": [{"name": "Dyuman Bhattacharya"}], "author_count": 1}, {"id": "2610.36198", "category": "math-ph", "title": "One-dimensional second-gradient elasticity: pantograph-inspired energies and solitary waves", "abstract": "We present a self-contained formulation of longitudinal motion in one-dimensional second-gradient continua. Starting from finite-strain kinematics, we then apply the Principle of Virtual Power to identify the governing field equation and contact actions, derive the balance laws, and establish the mechanical-energy identity for hyperelastic materials. Motivated by pantographic microstructures, we study a class of finite-strain energies formulated in terms of normalized strain measures and deformation-dependent strain-gradient moduli. For the associated equation of motion, a traveling-wave first integral yields a turning-point criterion for the existence of solitary waves with positive stretch, exponential decay, and finite mechanical energy, as well as uniqueness at each fixed speed within a prescribed strain interval. For suitable spring energies, a change of strain variable reduces this integral to a polynomial equation, yielding explicit tensile and compressive profiles for Green--Lagrange and Hencky strains under appropriate parameter and kinematic conditions. Under the positivity condition on the quartic potential, the constructed Hencky energy has several physically natural properties: it is nonnegative, admits the natural state as its unique zero and global minimizer, has a positive linearized modulus, penalizes stretch gradients, and diverges under both material collapse and unlimited extension. Furthermore, the stored energy is coercive with respect to the $H^1$ norm of logarithmic strain. Together with mechanical-energy conservation, this yields uniform upper and positive lower bounds on stretch throughout the lifespan of smooth solutions. The theory's accessible mechanical origin, relatively simple mathematical foundation, and diverse solitary waves offer a tractable entry point to studying the rich nonlinear dispersive equations governing higher-gradient elastic continua.", "url": "https://arxiv.org/abs/2610.36198", "type": "理论", "summary": "我们提出了一维第二梯度连续体中纵向运动的独立公式。从有限应变运动学出发，我们应用虚拟功率原理来识别控制场方程和接触作用，推导平衡定律，并建立超弹性材料的机械能恒等式。受缩放微观结构的启发，我们研究了一类根据归一化应变测量和变形相关应变梯度模量制定的有限应变能。对于相关的运动方程，行波一阶积分给出了存在正拉伸、指数衰减和有限机械能的孤立波的转折点准则，以及规定应变区间内每个固定速度的唯一性。对于合适的弹簧能量，应变变量的变化可将该积分简化为多项式方程，从而在适当的参数和运动学条件下产生格林-拉格朗日和亨基应变的显式拉伸和压缩曲线。\n\n在四次势的正性条件下，构造的 Hencky 能量具有几个物理自然属性：它是非负的，承认自然状态为其唯一的零和全局极小值，具有正线性模量，惩罚拉伸梯度，并在材料塌陷和无限延伸下发散。此外，存储的能量相对于对数应变的 $H^1$ 范数具有强制力。与机械能守恒一起，这在平滑解决方案的整个生命周期中产生了均匀的拉伸上限和正下限。该理论易于理解的机械起源、相对简单的数学基础和多样化的孤立波为研究控制高梯度弹性连续体的丰富的非线性色散方程提供了一个容易处理的切入点。", "authors": [{"name": "R. S. Hallyburton"}, {"name": "I. Giorgio"}, {"name": "C. Rodriguez"}], "featured_authors": [{"name": "R. S. Hallyburton"}, {"name": "I. Giorgio"}, {"name": "C. Rodriguez"}], "author_count": 3}, {"id": "2610.36388", "category": "math-ph", "title": "Propagation Estimates for the Many-body Boson Star Equation", "abstract": "We study the many-body boson star equation in the mean-field regime. Under a decay assumption on the solution to the effective one-body equation, we prove a uniform-in-time trace-norm estimate comparing the one-particle reduced density matrix of the many-body state with the projection onto the one-body solution. This establishes uniform-in-time mean-field convergence as the particle number goes to infinity. Furthermore, for the many-body dynamics, we establish both a maximal velocity bound, which can be seen as a Lieb--Robinson-type bound, and a minimal velocity bound. As an application, we recover maximal and minimal velocity bounds for the one-body boson star equation by passing to the mean-field limit.", "url": "https://arxiv.org/abs/2610.36388", "type": "理论", "summary": "我们研究平均场状态下的多体玻色子星方程。在有效单体方程解的衰减假设下，我们通过比较多体态的单粒子约简密度矩阵与单体解的投影，证明了时间一致的迹范数估计。当粒子数趋于无穷大时，这建立了时间均匀的平均场收敛。此外，对于多体动力学，我们建立了最大速度界限（可以看作 Lieb-Robinson 型界限）和最小速度界限。作为一种应用，我们通过传递到平均场极限来恢复单体玻色子星方程的最大和最小速度边界。", "authors": [{"name": "Sébastien Breteaux"}, {"name": "Charlotte Dietze"}, {"name": "Jérémy Faupin"}, {"name": "Viviana Grasselli"}, {"name": "Jinyeop Lee"}], "featured_authors": [{"name": "Sébastien Breteaux"}, {"name": "Charlotte Dietze"}, {"name": "Jérémy Faupin"}, {"name": "Viviana Grasselli"}, {"name": "Jinyeop Lee"}], "author_count": 5}, {"id": "2610.36784", "category": "math-ph", "title": "Existence of a third self-similar solution of the Yang--Mills equation in high odd dimensions", "abstract": "In a recent paper~\\cite{BGW}, Bizoń, Glogić, and Wasserman (BGW) reduced the classification of smooth self-similar Yang--Mills profiles in odd spatial dimensions $d\\ge11$ to an algebraic problem of counting roots of an explicit polynomial in a prescribed interval. Two roots correspond to explicit profiles. BGW conjectured that there is exactly one additional root and verified this in a range of odd dimensions. Here, we prove the existence of an additional root, and hence of a third smooth self-similar profile, in every odd dimension $d\\geq11$. The proof combines an endpoint sign calculation for the resonance polynomial with an algebraic argument showing that the third root is distinct from the two explicit ones. Uniqueness remains open in general.", "url": "https://arxiv.org/abs/2610.36784", "type": "理论", "summary": "在最近的一篇论文~\\cite{BGW}中，Bizoń、Glogić 和 Wasserman (BGW) 将奇数空间维度 $d\\ge11$ 中的平滑自相似 Yang-Mills 剖面的分类简化为在规定区间内计算显式多项式根的代数问题。两个根对应于显式配置文件。 BGW 推测确实存在一个额外的根，并在一系列奇数维度中验证了这一点。在这里，我们证明在每个奇数维度 $d\\geq11$ 中存在额外的根，从而证明第三个平滑自相似轮廓的存在。该证明将共振多项式的端点符号计算与代数论证相结合，表明第三个根与两个显式根不同。总体而言，独特性仍然是开放的。", "authors": [{"name": "Piotr Bizoń"}, {"name": "Robert Kluszczyński"}], "featured_authors": [{"name": "Piotr Bizoń"}, {"name": "Robert Kluszczyński"}], "author_count": 2}, {"id": "2610.36788", "category": "math-ph", "title": "Pointwise decay of cumulants and scaling regimes of chaotic states", "abstract": "We consider nonequilibrium chaotic states of classical interacting particles in a family of scaling limits motivated by kinetic theory. The particle activity and the strength of the pair interaction are rescaled simultaneously, allowing for both dilute and non-dilute regimes. Using cluster expansion, we derive pointwise bounds for truncated correlation functions (cumulants) of arbitrary order. We cover stable finite-range interactions and repulsive Riesz potentials, including non-integrable tails in bounded macroscopic domains.", "url": "https://arxiv.org/abs/2610.36788", "type": "理论", "summary": "我们考虑由动力学理论驱动的一系列尺度极限中经典相互作用粒子的非平衡混沌态。粒子活动和配对相互作用的强度同时重新调整，允许稀释和非稀释状态。使用聚类扩展，我们推导出任意阶的截断相关函数（累积量）的逐点界限。我们涵盖稳定的有限范围相互作用和排斥里斯势，包括有界宏观域中的不可积尾部。", "authors": [{"name": "Stefano Rossi"}, {"name": "Sergio Simonella"}, {"name": "Aleksis Vuoksenmaa"}], "featured_authors": [{"name": "Stefano Rossi"}, {"name": "Sergio Simonella"}, {"name": "Aleksis Vuoksenmaa"}], "author_count": 3}, {"id": "2610.37142", "category": "math-ph", "title": "Threshold Criteria for Bosonic and Fermionic Trimers on a Square Lattice: A Birman--Schwinger Comparison", "abstract": "We compare two three-particle lattice models on the square lattice at total quasimomentum zero: three identical bosons with attractive contact interactions, and a two-fermion plus one distinguishable particle system with attractive interspecies contact. Using the Birman--Schwinger principle combined with symmetry reduction and strong-coupling asymptotics, we distinguish shared methodology from model-dependent spectral conclusions. For bosons, the ground-state energy behaves as minus three times the coupling plus six minus three over twice the coupling plus higher-order corrections, and exactly two bound states exist below the threshold for large coupling; the second lies at a finite distance 0.03542 below the threshold, a genuine eigenvalue rather than a threshold resonance. For fermions, the critical mass ratio is pi divided by pi minus two, approximately 2.75194; above it, a doubly degenerate level appears at strong coupling. Near onset, the binding energy follows a linear-over-logarithmic law. The results are compared with numerical finite-grid Faddeev computations and with recent three-dimensional classifications of threshold states.", "url": "https://arxiv.org/abs/2610.37142", "type": "理论", "summary": "我们比较了总拟动量为零的方晶格上的两个三粒子晶格模型：三个具有吸引接触相互作用的相同玻色子，以及一个具有吸引种间接触的两个费米子加一个可区分的粒子系统。使用 Birman-Schwinger 原理结合对称性约简和强耦合渐近，我们将共享方法与依赖于模型的谱结论区分开来。对于玻色子，基态能量表现为负三倍耦合加上六减三两倍耦合加上高阶校正，并且恰好有两个束缚态存在于大耦合的阈值之下；第二个位于阈值以下 0.03542 的有限距离处，这是真正的特征值而不是阈值共振。对于费米子，临界质量比是 pi 除以 pi 减二，大约为 2.75194；在其上方，强耦合处出现双简并能级。接近开始时，结合能遵循线性对数定律。将结果与数值有限网格 Faddeev 计算以及最近的阈值状态三维分类进行比较。", "authors": [{"name": "Janikul Abdullaev"}, {"name": "Abdumalik Eshniyozov"}, {"name": "Mikhail Dolgopolov"}], "featured_authors": [{"name": "Janikul Abdullaev"}, {"name": "Abdumalik Eshniyozov"}, {"name": "Mikhail Dolgopolov"}], "author_count": 3}, {"id": "2610.37187", "category": "math-ph", "title": "Removing Trace Preservation from a Universal Spectral Bound for 2-Positive Maps", "abstract": "Vom Ende, Chruściński, Kimura and Muratore-Ginanneschi proved that every 2-positive trace-preserving map $\\Phi$ on $M_d=M_d(\\mathbb{C})$ satisfies $\\operatorname{Tr}\\Phi \\le d\\,m(\\Phi) + d^2 - d$, where $m(\\Phi)$ is the smallest real part of an eigenvalue of $\\Phi$, and deduced the universal relaxation-rate bound $\\operatorname{Tr} L \\le d\\,m(L)$ for generators of 2-positive trace-preserving semigroups. They asked whether trace preservation is needed, and conjectured that every conditionally 2-positive map $L$, i.e. every $L$ for which $e^{tL}$ is 2-positive for all $t \\ge 0$, satisfies $\\operatorname{Tr} L \\le d\\,m(L) + (d^2 - d)\\,s(L)$, where $s(L)$ is the largest real part of an eigenvalue of $L$. We prove this conjecture. The argument normalizes a 2-positive map by a positive definite eigenmatrix of its Hilbert-Schmidt adjoint, which turns it into a 2-positive trace-preserving map in the manner of a quantum Doob transform. The existence of such an eigenmatrix is guaranteed after adding an arbitrarily small multiple of the unnormalized depolarizing map, and the inequality then passes to the limit by continuity of the spectrum. No irreducibility, diagonalizability or faithful-invariant-state assumption is required. We also show that the constant $d$ is optimal within the class of non-trace-preserving completely positive semigroups, and we recast the result as a universal constraint on decay rates measured relative to the dominant spectral growth rate.", "url": "https://arxiv.org/abs/2610.37187", "type": "理论", "summary": "Vom Ende、Chruściński、Kimura 和 Muratore-Ginanneschi 证明，$M_d=M_d(\\mathbb{C})$ 上的每个 2-正迹保留映射 $\\Phi$ 满足 $\\operatorname{Tr}\\Phi \\le d\\,m(\\Phi) + d^2 - d$，其中 $m(\\Phi)$ 是$\\Phi$ 的特征值，并推导出 2-正迹保留半群生成元的通用松弛率界 $\\operatorname{Tr} L \\le d\\,m(L)$。他们询问是否需要保留迹，并推测每个条件 2-正映射 $L$，即每个 $L$ 对于所有 $t \\ge 0$ 来说 $e^{tL}$ 都是 2-正，满足 $\\operatorname{Tr} L \\le d\\,m(L) + (d^2 - d)\\,s(L)$，其中 $s(L)$ 是特征值的最大实部$L$。我们证明这个猜想。该论证通过希尔伯特-施密特伴随的正定本征矩阵对 2-正映射进行归一化，从而以量子 Doob 变换的方式将其转变为 2-正迹保留映射。在添加任意小倍数的非归一化去极化图之后，就保证了这样一个特征矩阵的存在，并且不等式随后通过谱的连续性达到极限。\n\n不需要不可约性、对角化性或忠实不变状态假设。我们还表明，常数 $d$ 在不保留踪迹的完全正半群中是最优的，并且我们将结果重新定义为相对于主要光谱增长率测量的衰减率的普遍约束。", "authors": [{"name": "Petri Tanninen"}], "featured_authors": [{"name": "Petri Tanninen"}], "author_count": 1}, {"id": "2610.37305", "category": "math-ph", "title": "A path-dependent entropic Lagrangian formulation for exact thermoviscous evolution of sheared magnetic tori with anisotropic resistivity", "abstract": "Resistive evolution of a three-dimensional magnetostatic equilibrium requires compatibility among induction, momentum balance and thermal transport. We construct exact thermoviscous evolutions of a non-axisymmetric magnetic torus with nonzero magnetic shear using a path-dependent entropic Lagrangian (PDEL) formulation. A symmetric positive-definite resistivity tensor is constructed so that the resistive differential expression preserves the spatial form of a known sheared toroidal equilibrium. Homogeneous expansion is coupled to an ideal gas and positive bulk viscosity in the absence of body forces and volumetric heat supply. For a one-temperature gas with heat-capacity ratio $5/3$, a $T^{-2/3}$ resistivity prefactor gives elementary time dependence for all fields. A two-temperature extension admits a $T_e^{-3/2}$ prefactor and positive interspecies heat exchange on a finite state interval. Material magnetic flux decays while the rotational-transform profile is preserved. Both branches satisfy local total-energy conservation, moving-boundary power balance and material transport of dissipation histories. A seed-specific obstruction excludes positive scalar resistivity along the same homologous trajectory; the two-temperature exchange law has a nonremovable endpoint pole. Symbolic identities, independent Cartesian differentiation and surface--volume quadrature verify these results. The solutions provide coupled MHD benchmarks with passive, inverse-designe", "url": "https://arxiv.org/abs/2610.37305", "type": "理论", "summary": "三维静磁平衡的电阻演化需要感应、动量平衡和热传输之间的兼容性。我们使用路径相关熵拉格朗日 (PDEL) 公式构建具有非零磁剪切的非轴对称磁环的精确热粘性演化。构造对称正定电阻率张量，以便电阻微分表达式保留已知剪切环形平衡的空间形式。在没有体积力和体积供热的情况下，均匀膨胀与理想气体和正体积粘度相关。对于热容比为 $5/3$ 的单温气体，$T^{-2/3}$ 电阻率预因子给出了所有场的基本时间依赖性。两个温度的扩展允许在有限状态区间内存在 $T_e^{-3/2}$ 前因子和正种间热交换。材料磁通量衰减，同时旋转变换轮廓得以保留。两个分支都满足局部总能量守恒、移动边界功率平衡和耗散历史的物质传输。\n\n种子特定的障碍物排除沿相同同源轨迹的正标量电阻率；二温交换定律有一个不可移动的端点极。符号恒等式、独立笛卡尔微分和表面-体积求积验证了这些结果。该解决方案提供耦合 MHD 基准与被动、反向设计", "authors": [{"name": "Huilong Ren"}], "featured_authors": [{"name": "Huilong Ren"}], "author_count": 1}, {"id": "2610.37346", "category": "math-ph", "title": "Algebraic Completeness of Feynman Premeasures: The Henstock-Kurzweil Path Integral and Operator Wick Calculus in Lean 4", "abstract": "We formalize in Lean 4 the gauge closure of the Feynman functional integral for the free field without Wick rotation. First, the restriction to box divisions is removed via a direction bound and a uniform Riemann-sum estimate for all $\\delta$-fine cylindrical divisions. Second, the coordinate measure on $\\mathbb{R}^k$ is identified with the standard Gaussian one. Third, the Saks-Henstock lemma and additivity are proved. Fourth, the Fresnel formula $\\int_{\\mathbb{R}} e^{i a x^2/2} dx = \\sqrt{2\\pi/a} e^{i\\pi/4}$ is proved as an improper (gauge) integral. This yields the projective consistency of the oscillating Gaussian premeasure and the existence of the free-field integral. The free field is completely closed: we prove the Fresnel formula for an arbitrary symmetric positive-definite action $A$, compute the generating functional and the two-point function $\\langle y_p y_q \\rangle = i(A^{-1})_{pq}$, and prove Wick's theorem. The interacting field $\\lambda\\varphi^4$, unbounded generators, and renormalisation remain open. All results are machine-verified with no sorry or new axioms.", "url": "https://arxiv.org/abs/2610.37346", "type": "理论", "summary": "我们在 Lean 4 中形式化了没有 Wick 旋转的自由场的费曼函数积分的规范闭合。首先，通过方向界限和所有$\\delta$-精细圆柱划分的统一黎曼和估计来消除对盒子划分的限制。其次，$\\mathbb{R}^k$ 上的坐标测量用标准高斯坐标测量来确定。第三，证明了Saks-Henstock引理和可加性。第四，菲涅尔公式 $\\int_{\\mathbb{R}} e^{i a x^2/2} dx = \\sqrt{2\\pi/a} e^{i\\pi/4}$ 被证明是一个不正确（规范）积分。这产生了振荡高斯测度的投影一致性和自由场积分的存在性。自由场是完全封闭的：我们证明任意对称正定作用$A$的菲涅耳公式，计算生成函数和两点函数$\\langle y_p y_q \\rangle = i(A^{-1})_{pq}$，并证明Wick定理。相互作用场 $\\lambda\\varphi^4$、无界生成器和重正化仍然开放。所有结果均经过机器验证，没有遗憾或新的公理。", "authors": [{"name": "Yu. N. Berdinsky"}], "featured_authors": [{"name": "Yu. N. Berdinsky"}], "author_count": 1}, {"id": "2610.37355", "category": "math-ph", "title": "Simultaneous diagonalization via congruence: Nondegenerate families of symmetric matrices", "abstract": "In this letter, we give necessary and sufficient conditions for the real symmetric matrices $A_1 , \\ldots , A_m$ to ensure they are simultaneously diagonalizable via congruence.", "url": "https://arxiv.org/abs/2610.37355", "type": "理论", "summary": "在这封信中，我们给出了实对称矩阵 $A_1​​ ， \\ldots ， A_m$ 的充分必要条件，以确保它们通过同余同时可对角化。", "authors": [{"name": "Leandro G. Gomes"}], "featured_authors": [{"name": "Leandro G. Gomes"}], "author_count": 1}, {"id": "2610.37556", "category": "math-ph", "title": "Finite-Resolution Physics from Additivity Symmetry", "abstract": "Quantum field theory unifies special relativity and quantum mechanics, yet relies on externally imposed prescriptions for quantization, renormalization, and probabilistic interpretation that lack a common algebraic foundation. This work derives these features from a single principle: the finite-resolution realization of the additive group (R, +) under four consistency constraints: finite operational resolution (FR1), multiplicative linearity (FR2), phase coherence (FR3), and statistical typicality (FR4). The Hilbert-space formalism of quantum theory, the Born probability rule, and the Kolmogorov structure of statistical mechanics emerge as limiting projections of a common additive algebra, without additional postulates. Extending this framework to spacetime translations and their automorphisms, we recover the kinematic and dynamical structure of quantum field theory and address ultraviolet divergences through intrinsic finiteness rather than external renormalization. Quantization and unitarity emerge from additive symmetry, while the gravitational field is interpreted as the algebraic kernel transporting boundary information into bulk observables, without requiring an independent quantization of the metric. This framework aims to provide a unified, finite, and algebraic foundation for physical this http URL , and algebraic foundation for physical law.", "url": "https://arxiv.org/abs/2610.37556", "type": "理论", "summary": "量子场论统一了狭义相对论和量子力学，但依赖于外部强加的量化、重整化和概率解释的规定，缺乏共同的代数基础。这项工作从一个原则中得出这些特征：在四个一致性约束下加法群 (R, +) 的有限分辨率实现：有限运算分辨率 (FR1)、乘性线性 (FR2)、相位相干性 (FR3) 和统计典型性 (FR4)。量子理论的希尔伯特空间形式主义、玻恩概率规则和统计力学的柯尔莫哥洛夫结构都是常见加性代数的限制投影，无需额外的假设。将这个框架扩展到时空平移及其自同构，我们恢复了量子场论的运动学和动力学结构，并通过内在有限性而不是外部重整化来解决紫外线发散。\n\n量化和幺正性源自加性对称性，而引力场被解释为将边界信息传输到大量可观测量中的代数核，而不需要度量的独立量化。该框架旨在为物理 http URL 提供统一的、有限的、代数基础，以及物理定律的代数基础。", "authors": [{"name": "Attilio Treppiedi"}], "featured_authors": [{"name": "Attilio Treppiedi"}], "author_count": 1}, {"id": "2610.37565", "category": "math-ph", "title": "Stability of attractive 3D Bose gases with repulsive three-body interactions", "abstract": "We consider three-dimensional Bose gases with attractive two-body interactions and repulsive three-body interactions. We prove the stability of the second kind of the system for a large class of interaction potentials and scaling regimes, which includes the Gross--Pitaevskii regime for the three-body potential. In addition, we even prove the classical stability of the system for a more restrictive class of interactions and scaling regimes. The main ingredient of the proof is a bound that was derived recently in a study by the authors on the dynamics of Bose gases with three-body interactions in the Gross--Pitaevskii regime (2026).", "url": "https://arxiv.org/abs/2610.37565", "type": "理论", "summary": "我们考虑具有吸引二体相互作用和排斥三体相互作用的三维玻色气体。我们证明了第二类系统对于一大类相互作用势和标度制度的稳定性，其中包括三体势的 Gross--Pitaevskii 制度。此外，我们甚至证明了系统对于更严格的相互作用和缩放机制的经典稳定性。证明的主要成分是作者最近在一项关于 Gross-Pitaevskii 体系中三体相互作用的玻色气体动力学的研究中得出的一个界限（2026）。", "authors": [{"name": "Arnaud Triay"}, {"name": "François L. A. Visconti"}], "featured_authors": [{"name": "Arnaud Triay"}, {"name": "François L. A. Visconti"}], "author_count": 2}, {"id": "2610.36047", "category": "quant-ph", "title": "Symmetry-resolved fermionic correlations in iron-oxide ground spaces", "abstract": "Symmetries of quantum systems provide a natural way to organize the eigenspaces of many-body Hamiltonians. When degeneracies exist, however, they play a more subtle role as different sets of symmetry operators can resolve the same energy subspace into states with very different correlation properties. We study this interplay using a sequence of FeO and Fe$_2$O$_2$ models. For a Hubbard model of FeO, the ground space is 16-fold degenerate. Resolving it by local magnetizations gives a basis of Slater determinants, while total-spin quantum numbers select entangled and non-Gaussian states from the same ground manifold. Adding density-density Hund interactions breaks the independent spin rotations and reduces the ground space to a spin-reversal pair with maximal magnetization. These states are extremely close to Slater determinants in their natural occupations, yet have finite two-body cumulants and conserved-operator algebras whose orbit dimensions differ substantially from the Slater values. Fe$_2$O$_2$ provides a larger example in which spatial mode entanglement can be substantial while fermionic non-Gaussianity remains weak, with the conserved-operator structure again distinguishing the state from the corresponding Slater transformation class. Together, these examples show that symmetry resolution, mode entanglement, reduced-density-matrix correlations, and conserved-operator structure provide complementary information about interacting and degenerate electronic ground states.", "url": "https://arxiv.org/abs/2610.36047", "type": "理论+数值", "summary": "量子系统的对称性提供了一种组织多体哈密顿量本征空间的自然方法。然而，当存在简并时，它们会发挥更微妙的作用，因为不同的对称算子集可以将相同的能量子空间解析为具有非常不同的相关属性的状态。我们使用一系列 FeO 和 Fe$_2$O$_2$ 模型研究这种相互作用。对于 Fe3O 的 Hubbard 模型，地面空间是 16 倍简并的。通过局部磁化强度求解它给出了斯莱特行列式的基础，而总自旋量子数则从同一基流形中选择纠缠态和非高斯态。添加密度-密度洪德相互作用会破坏独立的自旋旋转，并将地面空间减少为具有最大磁化强度的自旋反转对。这些状态在其自然占据中非常接近斯莱特行列式，但具有有限的二体累积量和守恒算子代数，其轨道维数与斯莱特值有很大不同。\n\nFe$_2$O$_2$ 提供了一个更大的例子，其中空间模式纠缠可能很大，而费米子非高斯性仍然很弱，守恒算子结构再次将状态与相应的 Slater 变换类区分开来。这些例子共同表明，对称分辨率、模式纠缠、降低密度矩阵相关性和保守算子结构提供了有关相互作用和简并电子基态的补充信息。", "authors": [{"name": "Federico Petrovich"}, {"name": "Daniel Staros"}, {"name": "Daniel N. Blaschke"}, {"name": "Jian-Xin Zhu"}, {"name": "M. Cerezo"}], "featured_authors": [{"name": "Federico Petrovich"}, {"name": "Daniel Staros"}, {"name": "Daniel N. Blaschke"}, {"name": "Jian-Xin Zhu"}, {"name": "M. Cerezo"}], "author_count": 5}, {"id": "2610.36067", "category": "quant-ph", "title": "Diagonal, Switching, and Locally Optimal Unraveling for efficient quantum trajectories in metastable open quantum systems", "abstract": "Open quantum systems can display metastability, with multiple long-lived states coexisting. Examples include the bistability of bright and dim manifolds in nonlinear driven resonators, or the long-lived coherent states of opposite phases in parametrically-driven systems, the building block of cat-state-based quantum computers. Metastability often emerges at system sizes where density-matrix evolution is impractical. Quantum trajectories mitigate this issue by evolving wavefunctions rather than density matrices. Metastable states then emerge as attractors towards which the system rapidly relaxes until a rare switching event brings it to another attractor. Simulating them remains costly, as one must resolve fast intra-attractor dynamics over timescales long enough to gather switching statistics. To tackle this problem, we introduce the Diagonal, Switching, and Locally Optimal Unraveling (DiSLOU) method, which combines three optimization layers: (i) Switching among locally optimal unravelings that minimize the number of quantum jumps in each metastable region. (ii) Diagonal propagation: the no-jump evolution is accelerated by diagonalizing the non-Hermitian effective Hamiltonian once per attractor. (iii) Local reduced eigenspaces: the no-jump state can be faithfully propagated in a truncated subspace of only slowly decaying eigenmodes. We benchmark DiSLOU on the driven-dissipative Kerr resonator, finding no measurable loss of accuracy and the largest speedup in the bistable regime, where standard trajectories are most expensive. We then apply the method to the more challenging problem of accurately simulating rare bit-flip events in the cat manifold emerging in a two-mode dissipatively stabilized parametric oscillator, obtaining a performance improvement of over one order of magnitude. An implementation of DiSLOU in Julia is available as an open-source package.", "url": "https://arxiv.org/abs/2610.36067", "type": "理论+数值", "summary": "开放量子系统可以表现出亚稳态，多个长寿命状态共存。例子包括非线性驱动谐振器中明流形和暗流形的双稳定性，或者参数驱动系统中相反相位的长寿命相干态，这是基于猫状态的量子计算机的构建块。亚稳态通常出现在密度矩阵演化不切实际的系统规模上。量子轨迹通过演化波函数而不是密度矩阵来缓解这个问题。然后，亚稳态作为吸引子出现，系统迅速松弛，直到罕见的切换事件将其带到另一个吸引子。模拟它们仍然是昂贵的，因为我们必须在足够长的时间尺度上解决快速的吸引子内动态，以收集切换统计数据。为了解决这个问题，我们引入了对角线、切换和局部最优解开（DiSLOU）方法，该方法结合了三个优化层：（i）在局部最优解开之间切换，最大限度地减少每个亚稳态区域中的量子跳跃数量。\n\n(ii) 对角传播：通过对每个吸引子对非厄米有效哈密顿量进行一次对角化来加速无跳跃演化。 (iii) 局部缩减本征空间：无跳跃状态可以在仅缓慢衰减本征模式的截断子空间中忠实地传播。我们在驱动耗散克尔谐振器上对 DiSLOU 进行了基准测试，发现在双稳态状态下没有可测量的精度损失，并且加速最大，其中标准轨迹是最昂贵的。然后，我们将该方法应用于更具挑战性的问题，即精确模拟双模耗散稳定参量振荡器中出现的猫流形中罕见的位翻转事件，获得超过一个数量级的性能改进。 Julia 中的 DiSLOU 实现可作为开源包提供。", "authors": [{"name": "Pietro Pacchioni"}, {"name": "Alberto Mercurio"}, {"name": "Patrick Winkel"}, {"name": "Fabrizio Minganti"}], "featured_authors": [{"name": "Pietro Pacchioni"}, {"name": "Alberto Mercurio"}, {"name": "Patrick Winkel"}, {"name": "Fabrizio Minganti"}], "author_count": 4}, {"id": "2610.36070", "category": "quant-ph", "title": "Equilibrium Learning of Quantum Circuits", "abstract": "Equilibrium learning trains a physical system using observables of its relaxed states. We extend this principle to gate-based quantum circuits by embedding a parametrized circuit in a Feynman-Kitaev (FK) Hamiltonian and imposing the compilation target either through an output clamping term or through a target-dependent cyclic condition on the clock register. The ground state energies and the overlaps of the corresponding ground states with the free history state define faithful cost functions for unitary and state compilation. We show that these costs are nonlinear functions of the compilation infidelity and therefore reshape the optimization landscape. We show that starting from the free history state, quantum phase estimation can prepare the relevant ground states and estimate the cost functions with polynomial resources. In two-qubit benchmarks, optimization with the equilibrium cost functions reaches a fixed fidelity threshold in fewer sweeps than standard compilation infidelity cost function for many instances. The results demonstrate the potential for encoding quantum learning problems as computation of equilibrium observables.", "url": "https://arxiv.org/abs/2610.36070", "type": "理论+数值", "summary": "平衡学习利用其松弛状态的可观测值来训练物理系统。我们将此原理扩展到基于门的量子电路，方法是将参数化电路嵌入 Feynman-Kitaev (FK) 哈密顿量，并通过输出钳位项或通过时钟寄存器上的目标相关循环条件强加编译目标。基态能量以及相应基态与自由历史状态的重叠定义了酉和状态编译的忠实成本函数。我们证明这些成本是编译不忠的非线性函数，因此重塑了优化景观。我们证明，从自由历史态开始，量子相位估计可以准备相关的基态并利用多项式资源估计成本函数。在两个量子位基准测试中，在许多情况下，使用平衡成本函数进行的优化比标准编译不保真成本函数所用的扫描次数要少，即可达到固定的保真度阈值。结果证明了将量子学习问题编码为平衡可观测量的计算的潜力。", "authors": [{"name": "Frank Barrows"}, {"name": "Touheed Atif"}, {"name": "Yiğit Subaşı"}, {"name": "Tyler Volkoff"}], "featured_authors": [{"name": "Frank Barrows"}, {"name": "Touheed Atif"}, {"name": "Yiğit Subaşı"}, {"name": "Tyler Volkoff"}], "author_count": 4}, {"id": "2610.36076", "category": "quant-ph", "title": "An algebraic characterisation of $n$-qubit pure-state invariants", "abstract": "We study the set of $n$-qubit pure quantum states. Specifically, we consider their incarnation as density matrices in Bloch representation. Building on prior work, we define a family of quadratic functions in Pauli expectation values, and fully characterise all instances that result in state-independent purity constraints. The resulting family of pure-state invariants is surprisingly rich in structure, with strong ties to the geometry of symplectic polar spaces. After charting the general landscape, we define a sub-family of pure-state invariants that satisfies the dynamical constraint of being stable under state update. We prove that it corresponds with (different embeddings of) symplectic Lie algebras $\\mathfrak{sp}(2^{n-1})\\subset\\mathfrak{su}(2^n)$, which admit a generating set of Pauli operators. We carefully distinguish the symplectic case from its orthogonal counterpart, using the Arf invariant of quadratic refinements of the symplectic form on the projective Pauli group, which we further identify with quaternionic structures on $\\mathbb{C}^{2^n}$ that are both generated by and restricted to Pauli operators. As a consequence of this analysis, we reveal previously largely overlooked structure in the $n$-qubit Pauli group. We highlight this in a number of examples. We characterise all state-independent uncertainty relations in variance for Pauli observables, as well as all Pauli channels for which the output fidelity and output purity are state-independent. We further show that the orbits of the projective stabiliser groups of pure-state invariants, which for $n\\geq2$ are proper subgroups of the Clifford group, form complex projective state $2$-designs, while their unitary lifts form symplectic $2$-designs.", "url": "https://arxiv.org/abs/2610.36076", "type": "理论", "summary": "我们研究 $n$-qubit 纯量子态集合。具体来说，我们将它们的化身视为布洛赫表示中的密度矩阵。基于之前的工作，我们在泡利期望值中定义了一系列二次函数，并充分描述了导致与状态无关的纯度约束的所有实例。由此产生的纯态不变量族的结构令人惊讶地丰富，与辛极空间的几何结构有着密切的联系。在绘制了总体情况之后，我们定义了一个纯状态不变量的子族，它满足在状态更新下保持稳定的动态约束。我们证明它对应于辛李代数 $\\mathfrak{sp}(2^{n-1})\\subset\\mathfrak{su}(2^n)$（不同的嵌入），它承认泡利算子的生成集。我们使用射影泡利群上辛形式的二次求精的 Arf 不变量，仔细区分辛情况与其正交对应物，我们进一步将其与 $\\mathbb{C}^{2^n}$ 上的四元结构进行识别，这些结构均由泡利算子生成并仅限于泡利算子。\n\n作为这一分析的结果，我们揭示了 $n$-量子位泡利群中以前很大程度上被忽视的结构。我们在许多例子中强调了这一点。我们描述了泡利可观测量的所有与状态无关的方差不确定性关系，以及输出保真度和输出纯度与状态无关的所有泡利通道。我们进一步表明，纯态不变量的射影稳定群的轨道（对于 $n\\geq2$ 来说是 Clifford 群的真子群）形成复杂的射影态 $2$-设计，而它们的酉升力形成辛 $2$-设计。", "authors": [{"name": "Markus Frembs"}], "featured_authors": [{"name": "Markus Frembs"}], "author_count": 1}, {"id": "2610.36421", "category": "quant-ph", "title": "Radial power-like potentials: from the Bohr-Sommerfeld $\\ell \\neq 0$ state energies to the exact ones", "abstract": "Two new Bohr-Sommerfeld (B-S) type quantization conditions for $d$-dimensional radial potentials are proposed for non-singular and singular potentials, respectively. The power-like potentials \\hbox{$V=\\operatorname{sign}(m)\\,r^m$} for $m=-3/2,-1,-1/2, 1,3,4,6$ and $V=\\log r$ (that corresponds to $m=0$) are studied in detail for radial quantum numbers $n_r \\in [0,100]$ and for angular momenta $\\ell=1,2,3,4,5$ in dimensions $d=2,3$. It is shown that for large $n_r$ the B-S energies $E_{BS}$ always tend to the exact ones. For $m=2$ (the radial harmonic oscillator) and $m=-1$ (the $d$-dimensional analogue of the $3D$ Coulomb potential) the B-S spectrum coincides with the exact one for the first and second quantization conditions, respectively. In general, up to a small parametric shift of the radial quantum number, the analytic formulas for the energy spectrum can be written for arbitrary power-like potential. A comparison of $E_{BS}$ with the energies $E^{(L)}_{BS}$, obtained for the radial potentials modified by the Langer correction for $d=3$, are in good agreement in general: in detail, it was checked for the quartic oscillator $V=r^4$. It is demonstrated that introducing a dimensionless {\\it WKB correction} $\\gamma$ into the r.h.s. of the proposed B-S type quantization condition allows us to reproduce the exact energies with $\\gamma$ being very small for positive degrees $m \\geq 0$ and sufficiently small for non-positive ones $m < 0$ for all $n_r, \\ell$ studied.", "url": "https://arxiv.org/abs/2610.36421", "type": "理论", "summary": "分别针对非奇异势和奇异势提出了 $d$ 维径向势的两种新的 Bohr-Sommerfeld (B-S) 型量化条件。详细研究了 $m=-3/2,-1,-1/2, 1,3,4,6$ 和 $V=\\log r$（对应于 $m=0$）的类幂势 \\hbox{$V=\\operatorname{sign}(m)\\,r^m$} 对于径向量子数 $n_r \\in [0,100]$ 和角动量 $\\ell=1,2,3,4,5$尺寸 $d=2,3$。结果表明，对于较大的 $n_r$，B-S 能量 $E_{BS}$ 总是趋向于精确的值。对于 $m=2$（径向谐振子）和 $m=-1$（$3D$ 库仑势的 $d$ 维模拟），B-S 谱分别与第一和第二量化条件的精确谱一致。一般来说，只要径向量子数有一个小的参数偏移，就可以为任意类似幂的势能写出能谱的解析公式。 $E_{BS}$ 与能量 $E^{(L)}_{BS}$ 的比较，通过兰格校正 $d=3$ 修改的径向势获得，总体上非常一致：详细地，检查了四次振子 $V=r^4$。\n\n证明了在 r.h.s 中引入无量纲 {\\it WKB 校正} $\\gamma$。所提出的 B-S 型量化条件允许我们重现精确的能量，对于所有研究的 $n_r, \\ell$，$\\gamma$ 对于正度 $m \\geq 0$ 非常小，对于非正度 $m < 0$ 足够小。", "authors": [{"name": "J.C. del Valle"}, {"name": "A.V. Turbiner"}], "featured_authors": [{"name": "J.C. del Valle"}, {"name": "A.V. Turbiner"}], "author_count": 2}, {"id": "2610.36438", "category": "quant-ph", "title": "Dynamical behaviour of the mass tensor in the lattice", "abstract": "We study with the semiclassical model the dynamics of a particle moving in a orthorrombic lattice by the hopping mechanism in the presence of a static Coulomb field and a rapidly oscillating homogeneous field. Based on results for the anisotropic Kepler problem, where a chaotic trajectory arises due to different masses of the particle in the X and Y directions, and since this result is also obtained in the rectangular lattice at the continuum limit, the application of the oscillating field allows reparameterizing the effective masses so that they become equal in both directions. Thus, the result is an elliptic trajectory in the continuum limit of the lattice. This chaos-order transition is confirmed by the calculation of Lyapunov exponents for the different trajectories. It is also found that the application of an external magnetic field in the Z direction of the lattice yields chaos control which can be generalized beyond the simple case of the circular trajectory shown in this work. The previous scheme of chaos control was extended for trajectories in 3D in the continuum limit of the orthorrombic lattice which is also equivalent to the far region approximation where the particle moves with respect to the Coulomb field origin. In this case it found that the chaos control technique permits to observe two different dynamical regimes which, although consistent with Bohr-van Leeuwen theorem, suggests that an observable way to distinguish one from the other is to be sought.", "url": "https://arxiv.org/abs/2610.36438", "type": "理论+数值", "summary": "我们使用半经典模型研究在存在静态库仑场和快速振荡均匀场的情况下通过跳跃机制在正交晶格中移动的粒子的动力学。基于各向异性开普勒问题的结果，其中由于 X 和 Y 方向上粒子的不同质量而产生混沌轨迹，并且由于该结果也在连续极限的矩形晶格中获得，因此振荡场的应用允许重新参数化有效质量，以便它们在两个方向上变得相等。因此，结果是晶格连续极限中的椭圆轨迹。这种混沌有序转变通过不同轨迹的李亚普诺夫指数的计算得到证实。我们还发现，在晶格 Z 方向施加外部磁场会产生混沌控制，这种控制可以推广到本工作中所示的圆形轨迹的简单情况之外。\n\n先前的混沌控制方案被扩展为正交晶格连续极限中的 3D 轨迹，这也相当于粒子相对于库仑场原点移动的远区近似。在这种情况下，它发现混沌控制技术允许观察两种不同的动力学状态，尽管这与玻尔-范列文定理一致，但表明需要寻求一种可观察的方法来区分其中一种。", "authors": [{"name": "Josué Calle"}, {"name": "Diego Sanjinés"}, {"name": "Evaristo Mamani"}], "featured_authors": [{"name": "Josué Calle"}, {"name": "Diego Sanjinés"}, {"name": "Evaristo Mamani"}], "author_count": 3}, {"id": "2610.36521", "category": "quant-ph", "title": "Anomalous Structures of Fisher Zero Lines in Biorthogonal Dynamical Quantum Phase Transitions", "abstract": "Fisher zero lines of the Loschmidt amplitude in non-Hermitian quenches can exhibit anomalous structures in the complex time plane, such as divergence, separation, and the restriction of all branches or a specific branch to the real or imaginary axis. Here, we use the biorthogonal framework to reveal the origin of these structures and determine the corresponding critical momentum conditions by analyzing the values of $m_k=\\hat{\\mathbf{h}}_0\\cdot\\hat{\\mathbf{h}}_1$, the dot product between the normalized prequench and postquench complex Bloch vectors. When Fisher zeros continuously cover the real-time axis, the density of Fisher zeros is further introduced to identify the critical times within these critical region
