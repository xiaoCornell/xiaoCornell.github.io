  <style>

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }

  <script>
    const papers = [{"id": "2611.25008", "category": "cond-mat", "title": "A Liquid Film Can Survive without Being Bulk-Like: Rupture and Mechanical Isotropy Set Different Thickness Limits in Lennard-Jones Films", "abstract": "How thick must a liquid film be before its middle behaves like ordinary bulk liquid? Free-standing films are the standard geometry for computing surface properties by molecular simulation and the simplest model of soap and foam films, coatings and polymer layers, yet the question is seldom answered quantitatively. We answer it for Lennard-Jones films by comparing two criteria: whether the film survives without rupturing, and whether the lateral pressure at its center has relaxed to the bulk value. Covering three interaction ranges (cutoffs rc = 3.5-7.5 times sigma), three temperatures and lateral system sizes from 20 to 100 times sigma, we find that the two criteria give different thicknesses and respond to different parameters. Films thinner than 6-7 times sigma (about 2 nm for argon) rupture within 105 tau (~0.2 microseconds); this kinetic limit hardly depends on the interaction range but grows with the lateral size of the system, and close to it rupture is an activated event. The center becomes mechanically bulk-like only at a larger thickness h*, where the tangential anisotropy computed with the Irving-Kirkwood definition falls below 0.003 epsilon x sigma^3; h* grows from ~11 times sigma (3.8 nm) to ~15 times sigma (5 nm) as the cutoff increases from 3.5 to 7.5 times sigma, but it is nearly independent of temperature and of lateral size. Between the two limits films are long-lived yet perturbed throughout. Neither the surface tension, which shows no thickness dependence, nor the central density, whose relative deficit is about 16 times smaller than the relative anisotropy, reveals this perturbation: the stress detects confinement before the structure does.", "url": "https://arxiv.org/abs/2611.25008", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jose Luis Altamirano-Corona"}, {"name": "Alfonso Lemus-Solorio"}, {"name": "Francisco Villanueva-Mejia"}, {"name": "Mariana Ramos-Estrada"}, {"name": "Jose L. Rivera"}], "featured_authors": [{"name": "Jose Luis Altamirano-Corona"}, {"name": "Alfonso Lemus-Solorio"}, {"name": "Francisco Villanueva-Mejia"}, {"name": "Mariana Ramos-Estrada"}, {"name": "Jose L. Rivera"}], "author_count": 5}, {"id": "2611.25010", "category": "cond-mat", "title": "Exact Fractional Chern Insulators from Hubbard Interactions", "abstract": "Laughlin's wavefunction and its parent interaction, Haldane's pseudopotential, underpin our analytic understanding of fractional quantum Hall effect. They are an exact pair in the sense that the wavefunction is the unique, zero-energy ground state of its frustration-free parent Hamiltonian. In this work, we propose exact pairs of many-body wavefunctions for fractional Chern insulators in tight binding models with onsite Hubbard interactions as their parents. The key to our construction is introduction of a Landau-dual Chern band, a multi-orbital Chern band obtained from directly sampling the spin-$s$ Dirac Landau level on a Bravais lattice. The exact many-body wavefunctions are given, analytically, in terms of the matrix coordinate $X+iY+J$, where $(X,Y)$ are the lattice coordinates and $J$ is a nilpotent matrix in spin space. The constructed exact pairs cover the fractional Chern states of the Laughlin, the Read-Rezayi, and the Halperin series. Our results prove that FCI ground states exist beyond ideal bands.", "url": "https://arxiv.org/abs/2611.25010", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jonah Herzog-Arbeitman"}, {"name": "Rui-Heng Liu"}, {"name": "Jiangping Hu"}, {"name": "Chen Fang"}], "featured_authors": [{"name": "Jonah Herzog-Arbeitman"}, {"name": "Rui-Heng Liu"}, {"name": "Jiangping Hu"}, {"name": "Chen Fang"}], "author_count": 4}, {"id": "2611.25015", "category": "cond-mat", "title": "Umklapp-enhanced high-$T_c$ topological superconductivity mediated by magnons in $p$-wave magnets", "abstract": "We show that magnon exchange can induce nodal topological superconductivity in a microscopic model of a $p$-wave magnet. Solving the weak-coupling multiband gap equation for itinerant electrons exchange-coupled to localized spins, we find a nodal $p$-wave gap and a critical temperature that rises sharply as the Fermi surface approaches the magnetic Brillouin-zone boundary. In this regime, small-reduced-momentum magnons can scatter electrons between Fermi-surface segments on opposite sides of the zone. These Umklapp processes enhance pairing because the contributions from different sites in the magnetic unit cell cancel less in their electron-magnon vertices than in those for ordinary scattering at comparable reduced momenta. Momentum-resolved winding numbers predict zero-energy Majorana flat bands at symmetry-preserving edges where the bulk nodes project to distinct momenta.", "url": "https://arxiv.org/abs/2611.25015", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kristoffer Leraand"}, {"name": "Asle Sudbø"}], "featured_authors": [{"name": "Kristoffer Leraand"}, {"name": "Asle Sudbø"}], "author_count": 2}, {"id": "2611.25028", "category": "cond-mat", "title": "Chern Numbers from Symmetry-Enforced Zeros and Dispersion Shifts", "abstract": "Wave-function zeros and their local vorticities provide a complementary characterization of Chern topology to more commonly used Berry-curvature formulations. Using wave-function overlaps between a Chern band and freely chosen reference states, we show that crystalline symmetry can enforce their zeros and fix their vorticities modulo the rotation order from the angular momenta of the band and reference state. We further show that weak local perturbations produce band-dispersion shifts proportional to the absolute square of the overlap, allowing its zeros and local structure to be read off directly from the dispersion. Combined with crystalline symmetry, this can identify Chern topology without measuring wave-function phases. Our construction applies to multicomponent and multiband wave functions and allows reference states whose momentum-space representation may vanish at some momenta. This permits compact localized states to be used directly as reference states and makes use of their known real- and momentum-space properties in flat-band systems. The dispersion shift near an overlap zero further provides a lower bound on the quantum metric at the zero.", "url": "https://arxiv.org/abs/2611.25028", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yoonseok Hwang"}, {"name": "Henry Davenport"}, {"name": "Frank Schindler"}], "featured_authors": [{"name": "Yoonseok Hwang"}, {"name": "Henry Davenport"}, {"name": "Frank Schindler"}], "author_count": 3}, {"id": "2611.25034", "category": "cond-mat", "title": "Anyon Coherent States in Fractional Chern Insulators", "abstract": "In fractional quantum Hall (FQH) systems, coherent anyonic excitations are the natural entities for describing anyon dynamics, their interactions, and braiding, yet no general expression for their wavefunctions is known beyond Laughlin's quasiholes. We introduce a systematic, operator-based construction of maximally-localized wavefunctions of anyons of either charge in FQH states and fractional Chern insulators, including those in non-ideal, non-vortexable bands. We find that these wavefunctions describe coherent quasiparticles: zero modes of local annihilation operators that saturate projected-density uncertainty bounds. These coherent states owe their existence to a nontrivial topology of the anyon band, with the winding of their Bloch coefficients encoding an anyon band's Chern number. As such, their guiding centers exist anywhere within the lattice, and their mutual overlaps decay as Gaussians determined by the effective magnetic length of the anyon band.", "url": "https://arxiv.org/abs/2611.25034", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pedro Fittipaldi de Castro"}, {"name": "Haylen Gerhard"}, {"name": "Wladimir A. Benalcazar"}], "featured_authors": [{"name": "Pedro Fittipaldi de Castro"}, {"name": "Haylen Gerhard"}, {"name": "Wladimir A. Benalcazar"}], "author_count": 3}, {"id": "2611.25037", "category": "cond-mat", "title": "Topological (in)equivalence encoded in zeros of wavefunction overlaps", "abstract": "Topological equivalence between two gapped band structures is determined by whether their occupied states can be continuously deformed into one another without closing the energy gap or breaking the protecting symmetries. We show that this relative topology can be read directly from the overlap matrix between the two occupied subspaces, in a way that treats Chern and $\\mathbb{Z}_2$ invariants within a single framework. The determinant of the overlap matrix defines a global section of a line bundle over the Brillouin zone, which vanishes at the momenta where the map between the subspaces fails to be invertible. A singular connection, whose curvature is concentrated at these zeros, assigns each zero an integer charge given by its phase winding. In two-dimensional class A, the total charge equals the difference between the Chern numbers of the two systems. In class AII, time reversal pairs zeros of opposite charge, and the relative $\\mathbb{Z}_2$ invariant is the parity of the total charge in half the Brillouin zone; the Kane-Mele Pfaffian is recovered as a special case. The zeros coincide with the gap closings of an interpolation between the two systems, and crystalline symmetries constrain their positions and charges. We illustrate the construction in the Haldane, Kane-Mele, and Qi-Wu-Zhang models, including cases where rotation symmetry alone enforces the zeros.", "url": "https://arxiv.org/abs/2611.25037", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Carolina Paiva"}, {"name": "Bruno Mera"}, {"name": "Roni Ilan"}, {"name": "Raquel Queiroz"}], "featured_authors": [{"name": "Carolina Paiva"}, {"name": "Bruno Mera"}, {"name": "Roni Ilan"}, {"name": "Raquel Queiroz"}], "author_count": 4}, {"id": "2611.25051", "category": "cond-mat", "title": "Quantum many-body scars and zero modes in the spin-1 Kitaev chain", "abstract": "We study the spin-1 Kitaev chain and, by analyzing its Hilbert-space connectivity in the Cartesian basis, show that it hosts an exponentially large number of exact zero-energy modes protected by chiral symmetry. For even-length periodic chains, their count is lower-bounded by the Jacobsthal number $(2^{L+1}+1)/3$, where $L$ is the chain length. We then construct an exponentially large number ($2^{L/2}$) of zero modes with an analytic expression that have a maximally mixed density matrix for a contiguous bipartition using the operator-state mapping. We further identify an embedded tight-binding structure governing defect dynamics that supports PXP-like quantum many-body scars (QMBS) in multiple sectors previously not reported. The associated forward-scattering approximation (FSA) Hamiltonian takes a universal form across the scarred sectors studied. A simple physical picture of defects propagating between walls provides an intuitive description of these dynamics and a structural guide to identifying sectors with fidelity revivals, while its limitations point to additional scarring mechanisms.", "url": "https://arxiv.org/abs/2611.25051", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ayush Sharma"}, {"name": "Jay Pandey"}], "featured_authors": [{"name": "Ayush Sharma"}, {"name": "Jay Pandey"}], "author_count": 2}, {"id": "2611.25089", "category": "cond-mat", "title": "Chiral Phonons Protected by Symmetry in a Strongly Anharmonic Helical Material", "abstract": "How chiral phonons survive anharmonic phonon-phonon interactions, which underpin lattice dynamics at finite temperature, remains poorly understood. Using an ab initio many-body approach, we study crystalline tellurium (Te), a strongly anharmonic helical crystal. We show that rotational symmetries in Te impose pseudoangular momentum selection rules on phonon-phonon interactions, restricting mode mixing and scattering at rotationally invariant symmetry points in the Brillouin zone. These symmetries protect the circular polarization of vibrational modes at finite temperature but not their lifetimes such that the dynamic chirality of handed vibrational modes persists to 600 K, even as lifetimes drop sharply. We find that the temperature-dependence of angular momentum generated by a thermal gradient is governed by lifetimes rather than chirality, decreasing by two orders of magnitude between 10 and 600 K.", "url": "https://arxiv.org/abs/2611.25089", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Supriyo Ghosh"}, {"name": "Dipti Jasrasaria"}], "featured_authors": [{"name": "Supriyo Ghosh"}, {"name": "Dipti Jasrasaria"}], "author_count": 2}, {"id": "2611.25097", "category": "cond-mat", "title": "Mixtures of a fluid with competing interactions and a simple solvent near a hard wall", "abstract": "We study a binary mixture of soft particles near a planar surface. The main component interacts through a competing short-range attraction and long-range repulsion (SALR) potential, modelled by a sum of three Yukawa terms, while the solvent and the cross interactions are described by two Yukawa terms. Using a field-theoretical mean-field approach we derive the coupled equations for the density profiles of both species, formulate the contact theorem for the two-component system, and obtain closed-form profiles in the mesoscopically homogeneous region by linearizing the theory and solving the associated eigenvalue problem. Their amplitudes are fixed by exact boundary conditions following from the continuity of the Yukawa potentials at the wall, which supply as many relations as there are unknowns. Although these conditions are implicit in the derivation of the contact theorem, they have not previously been used to fix the amplitudes of the linearized profiles, and they bring those profiles into quantitative agreement with the nonlinear solution. The equations are solved numerically for a fluid confined by hard walls. The theory predicts mixing of the two species far from the surface at high temperatures, and their microphase separation into alternating layers upon cooling or upon increasing the density. The mean-field profiles agree well with molecular dynamics data once the mean-field overestimate of the onset temperature of microsegregation is taken into account, and the analytical ones reproduce them closely except in the immediate vicinity of the wall.", "url": "https://arxiv.org/abs/2611.25097", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ivan Kravtsiv"}, {"name": "Oksana Patsahan"}, {"name": "Taras Patsahan"}], "featured_authors": [{"name": "Ivan Kravtsiv"}, {"name": "Oksana Patsahan"}, {"name": "Taras Patsahan"}], "author_count": 3}, {"id": "2611.25104", "category": "cond-mat", "title": "Where electrons conduct and where to change it: gauge-invariant sensitivities and the networks of sensitive bonds", "abstract": "Where is the electrical current carried in a disordered solid, and where would a local change alter it? The two questions differ. We answer the second exactly: the derivative of the Kubo-Greenwood conductivity with respect to the Hamiltonian is gauge invariant and gives the response to any local change. The construction applies to any Hamiltonian. We try it on amorphous silicon, with tight-binding cells of up to 10000 atoms and density-functional cells of up to 512 atoms, and compare it with three ways of allocating the conductivity: the space-projected conductivity (SPC), KuboMap, and the local density of states (LDOS). KuboMap follows the LDOS closely (median Spearman correlation 0.97). The sensitivity does not. It ranks the response to an on-site shift accurately and the response to removing an atom poorly, and it transfers between Hamiltonians less well than the other maps. The most sensitive bonds form connected clusters. In three large networks they are tree-like filaments of 24 to 38 atoms in the valence tail and looped networks deeper in the gap; the excess over an LDOS-weighted random selection reaches 48 standard deviations and appears only when the broadening spans about five level spacings. The filament overlaps the tail eigenstate with the most weight on it, and one of the leading conduction channels, far more than a random cluster does, but no single state or channel explains it. The networks are largely lost in thermal snapshots at 300 K. Where the conductivity is carried and where it responds are different problems: local transport maps are useful for the first and limited for the second.", "url": "https://arxiv.org/abs/2611.25104", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "D A Drabold"}, {"name": "C Ugwumadu"}], "featured_authors": [{"name": "D A Drabold"}, {"name": "C Ugwumadu"}], "author_count": 2}, {"id": "2611.25121", "category": "cond-mat", "title": "A plane-wave auxiliary-field quantum Monte Carlo study of silicon point defects", "abstract": "Accurately predicting the energetics of point defects remains a formidable challenge in computational materials science. For the tetrahedral silicon self-interstitial, for example, previous periodic coupled-cluster [CCSD(T)] and diffusion Monte Carlo (DMC) calculations disagree by about 1.2 eV. Here, we present formation energies of silicon self-interstitials and vacancies using auxiliary-field quantum Monte Carlo (AFQMC) in a plane-wave basis formulated within the projector-augmented wave framework, and compare them with the random-phase approximation (RPA) and CCSD(T). Using 16- and 64-atom cells, we demonstrate that an RPA-based correction effectively removes the two-body finite-size errors that remain after twist averaging in AFQMC for bulk silicon and for the dumbbell and hexagonal self-interstitials. With this correction, we obtain formation energies of 4.4 eV and 4.6 eV for these two self-interstitials in 16-atom cells, in good agreement with DMC and transcorrelated coupled-cluster results. For the tetrahedral interstitial and the Jahn--Teller-distorted vacancy, 16-atom cells are too small to obtain realistic formation energies; in 64-atom cells, we obtain 5.7 eV and 5.2 eV, respectively. With identical setups in 16-atom cells, CCSD(T) yields systematically lower formation energies than AFQMC, with the largest difference, 250 meV, for the tetrahedral interstitial. Our results indicate that the earlier overestimation of CCSD(T) for the tetrahedral interstitial stems from the finite-size treatment in the coupled-cluster workflow rather than from multi-configurational character of the defect.", "url": "https://arxiv.org/abs/2611.25121", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Moritz Humer"}, {"name": "Faruk Salihbegovic"}, {"name": "Martin Schlipf"}, {"name": "Zoran Sukurma"}, {"name": "Georg Kresse"}], "featured_authors": [{"name": "Moritz Humer"}, {"name": "Faruk Salihbegovic"}, {"name": "Martin Schlipf"}, {"name": "Zoran Sukurma"}, {"name": "Georg Kresse"}], "author_count": 5}, {"id": "2611.25246", "category": "cond-mat", "title": "Molecular engineering for crack-free transfer of single-crystalline oxide membranes onto silicon", "abstract": "Heterogeneous integration of single-crystalline complex oxides with silicon offers a route to incorporating their functionalities into next-generation microelectronics. Released from their growth substrates, freestanding oxide membranes enable this integration. However, cracks, wrinkles, and fragmentation during release and transfer limit membrane size and quality. Here, we present an interfacial energy-controlled release strategy that enables crack-free, single-crystalline freestanding oxide membranes with centimeter-scale lateral dimensions. Using SrTiO3 as a model system, time-resolved release studies identify water-induced blistering at the membrane-support interface during prolonged water exposure as the origin of membrane cracking. Lowering the molecular weight of the poly(propylene carbonate) support through polymer deconstruction increases its polarity and surface energy, suppresses interfacial blistering, and reduces organic residue after support removal. The resulting SrTiO3 membranes exhibit optical properties comparable to those of bulk single crystals. We extend this approach to the metallic ferromagnet La0.7Sr0.3MnO3, obtaining crack-free membranes on Si that preserve ferromagnetism and metallicity.", "url": "https://arxiv.org/abs/2611.25246", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jeongkeun Song"}, {"name": "Jihye Choi"}, {"name": "Benjamin Doughty"}, {"name": "Young-Hoon Kim"}, {"name": "Keun-Yeol Park"}, {"name": "Uvinduni I. Premadasa"}, {"name": "Miaofang Chi"}, {"name": "Seung Sae Hong"}, {"name": "Celesta S. Chang"}, {"name": "Zheng Gai"}, {"name": "Ambrose Seo"}, {"name": "Tomonori Saito"}, {"name": "Ho Nyung Lee"}], "featured_authors": [{"name": "Jeongkeun Song"}, {"name": "Jihye Choi"}, {"name": "Benjamin Doughty"}, {"name": "Ambrose Seo"}, {"name": "Tomonori Saito"}, {"name": "Ho Nyung Lee"}], "author_count": 13}, {"id": "2611.25284", "category": "cond-mat", "title": "Altermagnetic magnon splitting in hematite: from bulk g-wave to planar i-wave", "abstract": "Hematite is an insulating iron oxide with both a collinear antiferromagnetic and a weakly ferromagnetic phase with intriguing properties, such as long-range spin transport distances, that make it promising for spintronics applications. It has also been identified as a candidate for g-wave altermagnetism. Here, we present the results of fully relativistic ab initio calculations of the magnon properties of hematite, with a focus on altermagnetic effects. We quantitatively evaluate both the anisotropic and altermagnetic magnon band splitting as well as the magnon lifetimes. We show that dipolar interactions lead to a sizeable non-altermagnetic splitting and a hybridisation between opposite-chirality magnons resulting in a strong reduction of the spin expectation value of magnons close to the {\\Gamma} point and around nodal planes, even in the collinear out-of-plane phase. Both the frequencies and the lifetimes have a large altermagnetic splitting in the $k_z = 0$ plane, which is characteristic of hematite and not generally expected for g-wave altermagnets. We compare our results to the prototypical, hexagonal g-wave altermagnet manganese telluride, which has four symmetry-protected nodal planes, whereas the fourth nodal surface in hematite is not completely fixed by symmetry. We derive implicit analytical expressions for this surface and discuss how it arises from a combination of rotational and translational symmetry, which leads to a transition to i-wave symmetry at the Brillouin zone boundary. The example of hematite reveals the trigonal altermagnets as a special case where the splitting function exhibits both bulk (g-wave) and planar (i-wave) components, and shows that the point symmetries alone are not sufficient to capture the full symmetry-determined behaviour of the splitting function.", "url": "https://arxiv.org/abs/2611.25284", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tobias Dannegger"}, {"name": "Julian A. Beisch"}, {"name": "Levente Rózsa"}, {"name": "László Szunyogh"}, {"name": "Ulrich Nowak"}], "featured_authors": [{"name": "Tobias Dannegger"}, {"name": "Julian A. Beisch"}, {"name": "Levente Rózsa"}, {"name": "László Szunyogh"}, {"name": "Ulrich Nowak"}], "author_count": 5}, {"id": "2611.25456", "category": "cond-mat", "title": "Generalized Critical-State Analysis of Local Field Screening in High-Pressure Yttrium Polyhydride", "abstract": "We resolve the long-standing controversy over the interpretation of magnetic-flux expulsion in high-pressure superhydrides by measuring the local magnetic field adjacent to yttrium polyhydride at 171 GPa and 4.1 K with a $^{57}$Fe Mössbauer sensor. Nuclear forward scattering tracks the local induction $B_{\\rm sensor}(B_a)$, which nearly merges with the normal-state line near 1.5 T. Rather than assuming a constant-current Bean state, we solve the critical-state problem for the actual thin-disk geometry using the Shantsev--Clem--Sanchez method and compare generalized field-dependent critical-state models. Both the Kim and exponential laws reproduce the measured virgin branch, whereas the constant-$J_c$ Bean model fails. The corresponding zero-field critical-current densities, $(4.38\\pm1.48)\\times10^{11}$ and $(2.45\\pm0.22)\\times10^{11}$ A/m$^2$, respectively, are consistent in order of magnitude with transport estimates for granular YH$_6$. These results establish that the observed flux expulsion is a pinned critical state, not the equilibrium Meissner effect, and demonstrate a general methodology for probing local superconductivity under extreme conditions.", "url": "https://arxiv.org/abs/2611.25456", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. G. Gavriliuk"}, {"name": "I. A. Troyan"}, {"name": "A. A. Mironovich"}, {"name": "A. G. Ivanova"}, {"name": "H.-K. Mao"}, {"name": "V. V. Struzhkin"}], "featured_authors": [{"name": "A. G. Gavriliuk"}, {"name": "I. A. Troyan"}, {"name": "A. A. Mironovich"}, {"name": "A. G. Ivanova"}, {"name": "H.-K. Mao"}, {"name": "V. V. Struzhkin"}], "author_count": 6}, {"id": "2611.25491", "category": "cond-mat", "title": "Dynamical Variational Theory of Stochastic Reaction Networks", "abstract": "Discrete stochastic population dynamics describe systems ranging from biochemical reaction networks and gene regulation to epidemic spreading, ecology, and population genetics, where finite populations generate strong intrinsic fluctuations. Predicting their dynamics, including mean populations, fluctuations, time-lagged correlations, response functions, and steady states, remains challenging: the chemical master equation admits no general analytical solution, numerical solutions scale poorly with system size, and standard approximations fail at low copy numbers. Using a field-theoretic representation of the reaction dynamics, we develop a dynamical variational approximation for stochastic reaction networks based on the Plefka expansion from spin-glass physics. For reaction systems with general stoichiometry and time-dependent rates, the expansion yields tractable non-Markovian effective dynamics with self-consistent memory. We further introduce a generalized self-consistent bubble resummation that provides closed predictions for means, correlations, and response functions. The formulation applies broadly to discrete stochastic population dynamics on networks, and we provide a numerical implementation with adaptive time stepping for user-defined systems. We benchmark the method on stochastic gene regulation, enzyme kinetics, and infection dynamics, where it accurately captures both time-dependent behaviour and steady states, including fluctuation-driven effects missed by conventional approximations. Together, these results establish a general analytical framework for stochastic reaction dynamics across transient and stationary regimes in strongly fluctuating low-copy-number systems.", "url": "https://arxiv.org/abs/2611.25491", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Moshir Harsh"}, {"name": "Peter Sollich"}], "featured_authors": [{"name": "Moshir Harsh"}, {"name": "Peter Sollich"}], "author_count": 2}, {"id": "2611.25493", "category": "cond-mat", "title": "Topological Bound States in the Continuum", "abstract": "We uncover topological bound states in the continuum in AB-stacked bilayer graphene mass-wall junctions. Valley topology supports interface states propagating along the wall, while a distinct winding of the confinement conditions governs exact decoupling from conducting leads. Tuning the junction length or interlayer bias can merge oppositely charged bound states and remove confinement without changing the valley topology. At generic critical points, the state remains bound and nearby resonance widths open quartically with momentum. These results connect complementary roles of topology in interface propagation and confinement within a conducting continuum.", "url": "https://arxiv.org/abs/2611.25493", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dan-Na Liu"}, {"name": "J. Villavicencio"}, {"name": "Pierre A. Pantaleon"}], "featured_authors": [{"name": "Dan-Na Liu"}, {"name": "J. Villavicencio"}, {"name": "Pierre A. Pantaleon"}], "author_count": 3}, {"id": "2611.25522", "category": "cond-mat", "title": "Momentum-space quantum Monte Carlo for twisted bilayer graphene: Interaction effects in the presence of remote bands", "abstract": "Twisted bilayer graphene hosts strong correlation effects within topological flat bands separated from remote dispersive bands. This separation motivates projection onto the central bands, which greatly reduces the computational complexity of many-body calculations, including momentum-space quantum Monte Carlo (QMC) simulations. However, the interaction-induced Mott gap obtained in the projected model can be comparable to the noninteracting flat--remote band separation, raising the question of whether the projection remains valid. Here, we extend momentum-space QMC to explicitly include remote BM bands within a broad energy window at charge neutrality. We find that the projected description remains reliable over a broad parameter regime, up to $u_0/u_1\\lesssim0.9$: the projected and remote-band calculations yield similar low-energy electron and trion spectra, and the Kramers intervalley-coherent ground state remains stable. In particular, the Dirac trion remains robust in the finite-temperature normal state when remote bands are included. Near the band-touching limit $u_0=u_1$, remote-band electrons acquire substantial low-energy spectral weight, accompanied by suppression of the trion weight and loss of the Kramers intervalley-coherent state. Our findings establish the broad validity of flat-band projection while reconciling the projected and THF viewpoints by identifying the near-band-touching regime in which explicit remote-band degrees of freedom become essential.", "url": "https://arxiv.org/abs/2611.25522", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shibo Shan"}, {"name": "Cheng Huang"}, {"name": "Zi Yang Meng"}], "featured_authors": [{"name": "Shibo Shan"}, {"name": "Cheng Huang"}, {"name": "Zi Yang Meng"}], "author_count": 3}, {"id": "2611.25528", "category": "cond-mat", "title": "Topological trapping of active tracers in branched ring polymer matrices", "abstract": "Branched macromolecular architectures are ubiquitous in living systems and synthetic polymeric systems, create topologically complex media that strongly influence tracer dynamics beyond simple packing fraction-driven crowding effects. Motivated by biological systems such as amoebae, astrocytes, cytoskeletal assemblies, and cyclic bottlebrushes, we investigate active and passive tracer transport in polymeric environments of topologically distinct architectures. Here, using Langevin dynamics simulations, we focus on how polymer topology alters diffusion behavior in a branched-ring polymeric (BRP) environment. To isolate the role of intramolecular topology from monomer density, we specifically benchmark the BRP dynamics against an unlinked linear-ring polymer mixture (LRM). In general, we find that while passive tracers are largely unaffected by the polymer connectivity and bending rigidity, the self-propelled active tracers strongly distinguish between the two architectures. Increasing chain rigidity facilitates active diffusion in the unlinked LRM but strongly restricts mobility in the BRP matrix, driving a transition to pronounced long-time subdiffusion that becomes more prominent with propulsion strength. Different physical observables reveal that interconnected topological cages are formed in the stiff limit, leading to transient weak ergodicity breaking and leptokurtic displacement statistics. Further, the self-intermediate scattering function confirms that the short-range dynamics remain unaltered by the matrix connectivity, while relaxation at large spatial length scales is governed by the topological caging. Finally, varying the branch length and number, we identified an optimal branch architecture that maximizes active trapping. Our results establish that macromolecular connectivity and stiffness dominate the active transport even in the system of identical packing fraction.", "url": "https://arxiv.org/abs/2611.25528", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rahul Bag"}, {"name": "Baburao Simma"}, {"name": "Vrinda Garg"}, {"name": "Surya K. Ghosh"}], "featured_authors": [{"name": "Rahul Bag"}, {"name": "Baburao Simma"}, {"name": "Vrinda Garg"}, {"name": "Surya K. Ghosh"}], "author_count": 4}, {"id": "2611.25563", "category": "cond-mat", "title": "Geometry-induced orientational trapping dictates escape of active rods in corrugated channels", "abstract": "The non-equilibrium transport of anisotropic active matter through geometrically confined environments is fundamentally governed by the interplay between self-propulsion and geometry-induced entropic barriers. Using overdamped Langevin dynamics, we reveal contrasting escape mechanisms of self-driven rods in narrow corrugated channels by comparing smoothly varying sinusoidal (SC) geometries to circular (CC) cavities with localized, uniform curvature. We observe a strictly non-monotonic dependence of the mean first escape time (MFET) with increasing Peclet number (Pe) in the CC channel, contrary to the monotonic dependence in the SC channel. This non-monotonicity emerges from a competition between activity-enhanced escape at low-to-intermediate propulsion and persistent, geometry-induced orientational trapping along the circular boundary at high propulsion, which inhibits reorientation toward the exit neck. This regime crossover is further corroborated by trajectory-to-trajectory escape fluctuations and bimodal radial probability distributions reflecting persistent wall-collision and wall-aligned sliding transport. The self part of van-Hove correlation function exhibits distinct anisotropic non-Gaussian displacements in the SC channel, in contrast to symmetric profiles with extended active-trapping plateaus in the CC cavities. These results establish local channel topology as a critical determinant of confined active transport, with direct implications for microfluidic sorting, biological navigation, and targeted drug delivery in corrugated environments.", "url": "https://arxiv.org/abs/2611.25563", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Baburao Simma"}, {"name": "Rahul Bag"}, {"name": "Hari K. Reddy"}, {"name": "Radha Ramana"}, {"name": "Vrinda Garg"}, {"name": "Surya K. Ghosh"}], "featured_authors": [{"name": "Baburao Simma"}, {"name": "Rahul Bag"}, {"name": "Hari K. Reddy"}, {"name": "Radha Ramana"}, {"name": "Vrinda Garg"}, {"name": "Surya K. Ghosh"}], "author_count": 6}, {"id": "2611.25646", "category": "cond-mat", "title": "AdsNet: A Graph Neural Network for Direct Adsorption Energy Prediction", "abstract": "Fast and accurate prediction of adsorption energies is critical for high-throughput computational catalyst screening, existing methods compromise either on evaluation speed (full-graph machine learning potentials) or geometric sensitivity (coordination-based models like the alpha-scheme). Here, we present AdsNet, an equivariant graph neural network that directly predicts adsorption energies in a single forward pass, which operates on a local graph restricted only to adsorbate atoms and its immediate surface neighbors within a cutoff radius. This local graph formulation decouples computational complexity from total system size while encoding continuous geometric features (interatomic distances and directional vectors) enabling sensitivity to subtle variations in local bonding environments. AdsNet adopts a message-passing architecture with scalar and vector node features over multiple interaction layers. Trained on AdsTraj, a dataset of 33,920 density functional theory (DFT) calculated structures spanning 26 transition metals and 6 adsorbates (H*, C*, O*, CO*, OH*, HOCO*), the model achieves an adsorption energy root-mean-square error (RMSE) of 0.032 eV and a force RMSE of 0.047 eV/A. Analytic forces obtained via automatic differentiation enable structure relaxation through a projected gradient descent algorithm with adaptive line search, eliminating entire geometry optimizations. Additionally, AdsNet uniquely decomposes predicted adsorption energies into contributions from individual atoms within the local adsorbate graph - an interpretability feature unattainable with conventional machine-learning potentials. AdsNet thus establishes an accurate, highly efficient, and interpretable framework for large-scale adsorption energy prediction and local interface relaxation across various material surfaces.", "url": "https://arxiv.org/abs/2611.25646", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Changzhi Ai"}, {"name": "Frank Abild-Pedersen"}, {"name": "Johannes Voss"}], "featured_authors": [{"name": "Changzhi Ai"}, {"name": "Frank Abild-Pedersen"}, {"name": "Johannes Voss"}], "author_count": 3}, {"id": "2611.25764", "category": "cond-mat", "title": "Critical droplets and metastability in long-range chains", "abstract": "Metastable decay in first-order phase transitions proceeds through the nucleation of critical droplets. In the one-dimensional nearest-neighbor Ising chain, the cost of the two walls bounding a droplet is independent of its size. For interactions decaying as $1/r^{1+\\sigma}$, this surface cost instead depends on the droplet size and competes with the bulk free-energy gain. The critical radius scales as $R_c\\propto h^{-1/\\sigma}$ at small $h$, where $h>0$ is the bias field. The value $\\sigma=1$ separates two regimes: for $\\sigma<1$, the activation barrier diverges as $h\\to0^+$; at $\\sigma=1$, it grows logarithmically; and for $\\sigma>1$, it remains finite, as in the nearest-neighbor chain. A nonlocal $\\phi^4$ field theory yields critical droplets with algebraic tails and confirms the predicted radius and barrier scalings, while stochastic long-range dynamics independently reproduces the critical-radius scaling.", "url": "https://arxiv.org/abs/2611.25764", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Laura Batini"}, {"name": "Valerio Pagni"}, {"name": "Nicolò Defenu"}], "featured_authors": [{"name": "Laura Batini"}, {"name": "Valerio Pagni"}, {"name": "Nicolò Defenu"}], "author_count": 3}, {"id": "2611.25792", "category": "cond-mat", "title": "Current-driven resistive switching in high-field heavy fermion metal UTe2", "abstract": "In UTe$_2$, superconductivity persists up to 70 T for fields tilted by roughly 20-40° from the b axis toward c. Its normal state is a field-polarized (FP) state, which emerges above a first-order metamagnetic transition when the field component along b exceeds $\\sim$35 T. Despite being the parent of this high-field superconductivity, the FP state remains poorly understood, including whether it shares underlying physics with the low-field paramagnetic (PM) state from which it is abruptly separated. Using microstructures fabricated by focused ion beam, we reach current densities of 30-60 kA/cm2 and observe a current-induced high-resistivity state in both the PM and FP regimes over a wide range of field angles in the bc plane. Above a critical current density of order 10 kA/cm2, the resistivity sharply rises to values comparable to those near the critical end point of the metamagnetic transition. The critical current density increases with temperature, opposite to the trend expected from Joule heating, ruling out a thermal origin. The emergence of the same instability on both sides of the metamagnetic transition reveals an unexpected commonality between the FP and PM states. More broadly, the observation of a current-induced transition in a heavy-fermion metal exposes the multitude of nearby electronic states in correlated electron systems and shows that electric current, like magnetic field and pressure, can switch between them.", "url": "https://arxiv.org/abs/2611.25792", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ling Zhang"}, {"name": "Chunyu"}, {"name": "David Graf"}, {"name": "Carsten Putzke"}, {"name": "Mitchell M. Bordelon"}, {"name": "Eric D. Bauer"}, {"name": "Sean M. Thomas"}, {"name": "Filip Ronning"}, {"name": "Priscila F. S. Rosa"}, {"name": "Philip J. W. Moll"}], "featured_authors": [{"name": "Ling Zhang"}, {"name": "Chunyu"}, {"name": "David Graf"}, {"name": "Filip Ronning"}, {"name": "Priscila F. S. Rosa"}, {"name": "Philip J. W. Moll"}], "author_count": 10}, {"id": "2611.25836", "category": "cond-mat", "title": "Molecular Dynamics Simulation of the Solidification of AlCoCuFeNi High-Entropy Alloy Nanowire", "abstract": "Molecular dynamics simulation of the solidification behavior of an AlCoCuFeNi high-entropy alloy nanowire was performed using an embedded atom model potential at cooling rates of 10^11, 10^12, and 10^13 K/s. Periodic boundary conditions were applied along the nanowire axis to model an effectively infinite nanowire. The crystallization process was characterized through the temperature dependence of the potential energy. Structural evolution was analyzed using adaptive common-neighbor analysis (CNA) and radial distribution functions (RDF). The results show that the final structure changes from amorphous to crystalline with decreasing cooling rate, demonstrating the strong influence of cooling conditions on phase formation in nanoscale high-entropy alloy systems.", "url": "https://arxiv.org/abs/2611.25836", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "O.I. Kushnerov"}], "featured_authors": [{"name": "O.I. Kushnerov"}], "author_count": 1}, {"id": "2611.25928", "category": "cond-mat", "title": "Thermal investigation of buffer and transition layers in AlGaN HEMT stacks", "abstract": "In this work, we investigate thermal transport in a set of thin-film layers used in modern HEMT designs. Our theoretical analysis employs three phonon-transport models of increasing sophistication, ranging from a relatively simple Debye-approximation model to a first-principles framework that incorporates Density Functional Theory (DFT)-derived harmonic and anharmonic phonon properties. To describe ternary semiconductors, alloy scattering is also considered, and to account for the properties of non-ideal, polycrystalline thin films, scattering at grain and film boundaries is taken into account. For modeling the specific samples at hand, the latter are fitted to thermal conductivity data measured with Time-Domain Thermoreflectance (TDTR). Overall, we find that the first-principles model performs best and produces the most physically consistent results. Special emphasis is placed on establishing a reliable procedure for determining intrinsic transport properties dominated by Umklapp scattering. Building on these, it is then possible to systematically add additional scattering terms to the models and assess how model-inherent factors, such as the treatment of scattering rates or the description of the phonon dispersion, affect model accuracy and overall predictive capabilities.", "url": "https://arxiv.org/abs/2611.25928", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Simon Fernbach"}, {"name": "Lisa Mitterhuber"}, {"name": "Egbert Zojer"}, {"name": "Natalia Bedoya-Martínez"}], "featured_authors": [{"name": "Simon Fernbach"}, {"name": "Lisa Mitterhuber"}, {"name": "Egbert Zojer"}, {"name": "Natalia Bedoya-Martínez"}], "author_count": 4}, {"id": "2611.25944", "category": "cond-mat", "title": "Alloying effects on the interface cohesion of grain boundaries in the Ni--Fe--Cr system", "abstract": "Grain boundaries (GBs) in polycrystalline Ni-based alloys strongly influence mechanical strength and fracture behavior, yet the effect of alloying elements such as Fe and Cr on GB cohesion remains difficult to quantify systematically. Using density functional theory (DFT), we compute rigid-body separation (RBS) curves for six symmetric-tilt Ni GBs, extracting the work of separation $W_{\\mathrm{sep}}$ and maximum traction $\\sigma_{\\max}$ via the universal binding energy relation (UBER). We find that substitution of Cr or Fe into the GB plane increases both quantities relative to pure Ni GBs. To overcome the size limitations of DFT, we compare several machine-learning interatomic potential (MLIP) foundation models against the DFT dataset and identify a model achieving quantitative agreement with DFT for $W_{\\mathrm{sep}}$ and $\\sigma_{\\max}$. This MLIP enables systematic sampling of alloying configurations at finer concentration steps. We show that alloying-induced changes in GB cohesion depend on both, element type and local structures, revealing trends that are inaccessible with DFT alone. Extending the analysis to a ternary $\\mathrm{Ni}_{56}\\mathrm{Fe}_{20}\\mathrm{Cr}_{24}$ composition, inspired by the principal constituents of the widely used commercial Alloy 718, shows that the binary trends provide a useful basis for interpreting the combined effect of both substitutes, while explicit ternary calculations are required to capture their interplay quantitatively. Together, these results provide a validated workflow for quantifying the effect of alloying elements on GB cohesion in multicomponent alloys. The resulting values may serve as input for continuum-scale fracture models, paving the way toward atomistically informed multiscale modeling.", "url": "https://arxiv.org/abs/2611.25944", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Aljoscha Felix Baumann"}, {"name": "Reyhaneh Ghassemizadeh"}, {"name": "Daniel F. Urban"}], "featured_authors": [{"name": "Aljoscha Felix Baumann"}, {"name": "Reyhaneh Ghassemizadeh"}, {"name": "Daniel F. Urban"}], "author_count": 3}, {"id": "2611.25966", "category": "cond-mat", "title": "Sequence-encoded amphiphilicity controls the interfacial tension of biomolecular condensates", "abstract": "Biomolecular condensates exhibit surprisingly low surface tensions, despite forming dense, liquid-like phases. We propose that the low surface tension partially originates from the segmental amphiphilicity of intrinsically disordered proteins (IDPs) that results in a surfactant-like behavior. We investigate this mechanism using a minimal coarse-grained IDP model containing only hydrophobic and polar residues, allowing us to systematically vary the polar fraction and, for selected cases, to probe the influence of sequence patterning of polar residues. To control for differences in thermodynamic phase behavior, we determine phase coexistence (binodals) for each sequence and compare systems at matched distances from the critical point. We find a disproportionately high fraction of polar residues at the condensate surface, which is closely correlated with the reduction in surface tension. For the sequences studied here, overall composition alone sets the phase behavior and establishes the overall trend in surface tension: increasing the polar fraction lowers the surface tension, with a polar fraction of one third reducing the surface tension by roughly twofold relative to a purely hydrophobic chain. In addition, sequence patterning enhances interfacial localization of polar residues and can lower surface tension beyond what composition alone achieves, revealing a sequence-dependent contribution to the surface tension that leaves the bulk phase behavior essentially unchanged.", "url": "https://arxiv.org/abs/2611.25966", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nora-Elen Giesinger"}, {"name": "Jens-Uwe Sommer"}, {"name": "Arash Nikoubashman"}], "featured_authors": [{"name": "Nora-Elen Giesinger"}, {"name": "Jens-Uwe Sommer"}, {"name": "Arash Nikoubashman"}], "author_count": 3}, {"id": "2611.26150", "category": "cond-mat", "title": "Attraction kinetics controls permanent shear banding in particulate dispersions", "abstract": "We investigate the connection between kinetic attractive interactions (i.e. particle attraction that turn on and off at finite rates) and the formation of permanent shear bands in particulate systems. To that end, we develop a mean field constitutive theory based on the idea that, under shear, kinetic attraction generates an overstress only when the shear rate is comparable to the attraction kinetic rates. We verify our theory using simulations of a jammed particle system with kinetic attractive interactions. We measure the homogeneous flow curves of our system at small system sizes, and find them to be in good qualitative agreement with our theory. At larger system sizes, permanent shear banding is observed. We discuss the generality of our theoretical framework.", "url": "https://arxiv.org/abs/2611.26150", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Liheng Yao"}, {"name": "Romain Mari"}, {"name": "Kirsten Martens"}], "featured_authors": [{"name": "Liheng Yao"}, {"name": "Romain Mari"}, {"name": "Kirsten Martens"}], "author_count": 3}, {"id": "2611.26186", "category": "cond-mat", "title": "Reward misalignment as an opportunity for materials discovery", "abstract": "Reward misalignment is usually regarded as a failure of artificial intelligence. In materials discovery with generative AI models, however, disagreement between predefined rewards and expert judgment may reveal materials that the rewards overlook. We investigate this possibility using electronic flat bands as a prime example. Experts mostly agree with a numerical bandwidth score, but their disagreements are systematic and cannot be explained by an estimated 5% rate of mistaken labels. We learn the experts' preferences from pairwise comparisons and use them to guide a crystal diffusion model. The learned preferences and numerical score agree on the flattest bands but diverge elsewhere. For example, the preferences favor KCo2As2 and CoGa, reported compounds with partially flat bands that the score would discard. The framework also extends to synthesizability and phonon properties. Our findings suggest that reward misalignment can expose opportunities for materials discovery beyond what fixed rewards are designed to find.", "url": "https://arxiv.org/abs/2611.26186", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ryotaro Okabe"}, {"name": "Shoki Kishida"}, {"name": "Abhijatmedhi Chotrattanapituk"}, {"name": "Dominic Bollettieri"}, {"name": "Takuya Isogawa"}, {"name": "Yongqiang Cheng"}, {"name": "Mingda Li"}, {"name": "Masaki Adachi"}], "featured_authors": [{"name": "Ryotaro Okabe"}, {"name": "Shoki Kishida"}, {"name": "Abhijatmedhi Chotrattanapituk"}, {"name": "Yongqiang Cheng"}, {"name": "Mingda Li"}, {"name": "Masaki Adachi"}], "author_count": 8}, {"id": "2611.26213", "category": "cond-mat", "title": "Unusual increase in electrical and thermal conductivity of severely deformed CrMnFeCoNi high-entropy alloy: Roles of disordering and nanostructuring in electron and phonon transport", "abstract": "This work investigates how defect engineering and nanostructuring via severe plastic deformation influence electrical and thermal transport in the high-entropy alloy CrMnFeCoNi. High-pressure torsion (HPT) for up to N = 4 turns produces a hierarchical defect structure, including deformation twins at low strains, dislocations and Lomer-Cottrell locks at intermediate strains, and a high fraction of high-angle grain boundaries at large strains. While hardness naturally increases and saturates at ~520 Hv, both electrical and thermal conductivity exhibit an unusual increase upon HPT processing (from 0.953 MS m-1 and 10.3 W m-1 K-1 after homogenization to 1.003 +- 0.005 MS m-1 and 14.4 W m-1 K-1 after N = 4). Analysis based on the Wiedemann-Franz law indicates a modest increase in electron transport (~5%) and a significant increase in phonon transport (~100%) after HPT processing. The phonon mean free path remains small on the order of 0.6-1.1 nm, and comparison with the Cahill-Pohl model shows that heat transport occurs near the minimum thermal conductivity limit, where vibrational modes are strongly scattered. This suggests that the enhancement in thermal transport is not governed by conventional defect scattering, but it is hypothesized that modifications in atomic-scale disorder, such as deformation-induced short-range ordering, are responsible for this unusual behavior. Specific heat capacity increases after HPT, consistent with stored defect energy. The linear thermal expansion exhibits a non-monotonic behavior, decreasing initially due to internal stresses and relaxation effects, and increasing at higher strains due to grain boundary-induced anharmonicity. These findings highlight the complex interplay between defects, atomic-scale disorder, and nanostructure in governing the electrical and thermal properties of severely deformed high-entropy alloys via electron and phonon scattering.", "url": "https://arxiv.org/abs/2611.26213", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jacqueline Hidalgo-Jiménez"}, {"name": "Payam Edalati"}, {"name": "Md Amirul Islam"}, {"name": "Makoto Arita"}, {"name": "Dmitry Chernyshov"}, {"name": "Bidyut Baran Saha"}, {"name": "Kaveh Edalati"}], "featured_authors": [{"name": "Jacqueline Hidalgo-Jiménez"}, {"name": "Payam Edalati"}, {"name": "Md Amirul Islam"}, {"name": "Dmitry Chernyshov"}, {"name": "Bidyut Baran Saha"}, {"name": "Kaveh Edalati"}], "author_count": 7}, {"id": "2611.26257", "category": "cond-mat", "title": "Fast extraction of universal data from temporal spectrum: Applications to Haagerup CFT and monopole scattering", "abstract": "Extracting precise universal data on conformal field theory (CFT) on the lattice traditionally requires large-scale simulations of the ground states and excitations of critical systems. Here, we propose an alternative accurate and fast algorithm, where we read off the CFT spectrum from the transfer matrix spectrum of an infinite matrix product state after a short imaginary-time evolution. We apply this method to extract the charge-resolved spectrum of a Haagerup CFT to higher levels and obtain a central charge $c = 2.137(27)$. Moreover, we show that the Maldacena--Ludwig monopole boundary can be realized as the ground state of the Fidkowski--Kitaev Hamiltonian after space-time rotation.", "url": "https://arxiv.org/abs/2611.26257", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tokiro Numasawa"}, {"name": "Boris De Vos"}, {"name": "Masataka Watanabe"}, {"name": "Atsushi Ueda"}], "featured_authors": [{"name": "Tokiro Numasawa"}, {"name": "Boris De Vos"}, {"name": "Masataka Watanabe"}, {"name": "Atsushi Ueda"}], "author_count": 4}, {"id": "2611.26263", "category": "cond-mat", "title": "Wigner-Dyson correlations in selected sectors of an integrable spin chain", "abstract": "In quantum many-body physics spectral statistics is often used as a probe to distinguish integrable and chaotic models. We find a special case of an integrable spin chain with unusual spectral properties. With open boundary conditions the model has homogeneous exponential degeneracies; these are split for periodic boundary conditions. In the latter case, we find that a small number of sectors (selected by a global symmetry) showcase Wigner-Dyson spectral statistics, which usually signals quantum chaos. Our model is clean, translationally invariant, and it fits into the standard Yang-Baxter framework. We identify Hilbert space fragmentation as the key mechanism behind the spectral properties. The fragmentation is non-local, and its extent is different in the case of open and periodic boundary conditions. We argue that the dynamics of the model is not chaotic despite the unusual spectral correlations.", "url": "https://arxiv.org/abs/2611.26263", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Balázs Pozsgay"}], "featured_authors": [{"name": "Balázs Pozsgay"}], "author_count": 1}, {"id": "2611.26304", "category": "cond-mat", "title": "Phase diagram of the attractive lattice Fermi polaron and the instability of Nagaoka ferromagnetism", "abstract": "On the square lattice, the attractive polaron competes not only with the dimeron but also with Yang's $\\eta$ dimer, an exact eigenstate that maps onto the Nagaoka ferromagnet. With two-particle--hole Ansätze benchmarked by diagrammatic Monte Carlo, we find that the ground state evolves from polaron to dimeron to $\\eta$ dimer at low filling, and, beyond a triple point, directly from polaron to $\\eta$ dimer. Above 25\\% filling it stays a polaron. As the $\\eta$ dimer is exact, its boundary is a rigorous instability criterion for Nagaoka ferromagnetism, sharper than the previous best and logarithmic at low filling.", "url": "https://arxiv.org/abs/2611.26304", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gerard Pascual"}, {"name": "Kris Van Houcke"}], "featured_authors": [{"name": "Gerard Pascual"}, {"name": "Kris Van Houcke"}], "author_count": 2}, {"id": "2611.26320", "category": "cond-mat", "title": "Determining quantum phases of eight-fold quasicrystal optical lattices with angular structure factor", "abstract": "Quasicrystals have unique geometrical properties and are potential candidates to explore exotic states of matter. In this work, we explore the properties and the rotational symmetries of the quantum phases of ultracold atoms in the Ammann-Beenker quasicrystal optical lattice. We model the system with the quasicrystalline extended Bose-Hubbard model (qeBHM) and use mean field methods to identify the groundstate of qeBHM in the soft-core regime. To examine the diagonal long-range order of the groundstate quantum phases we develop a theoretical method to calculate the structure factor of the state. Our method clearly distinguishes various density wave (DW) and supersolid (SS) phases of the quasicrystal.", "url": "https://arxiv.org/abs/2611.26320", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kohenjit Pebam"}, {"name": "Deepak Gaur"}, {"name": "Laxmi Angom"}, {"name": "Bhumika Thoudam"}, {"name": "Momin Hrangbung"}, {"name": "Bikramjit Shoibam"}, {"name": "D. Angom"}], "featured_authors": [{"name": "Kohenjit Pebam"}, {"name": "Deepak Gaur"}, {"name": "Laxmi Angom"}, {"name": "Momin Hrangbung"}, {"name": "Bikramjit Shoibam"}, {"name": "D. Angom"}], "author_count": 7}, {"id": "2611.26327", "category": "cond-mat", "title": "Quantum Metric Control of Topological Superconductivity and Incommensurate Charge Density Wave in an Interacting Lieb-Kitaev Chain Model", "abstract": "We study an interacting spinless Lieb-Kitaev chain model in the nearly flat-band regime, motivated by the recent observation that Majorana zero modes in the noninteracting Lieb-Kitaev system inherit two decay modes: an ordinary Bogoliubov-de Gennes (BdG) length and a longer geometric length controlled by the quantum metric. By tuning both the interaction strength and quantum metric, we identify a topological superconducting (TSC) phase, an incommensurate charge-density-wave (ICDW)phase, and a commensurate charge-density-wave (CDW) phase. Inside the TSC phase, the QML is enhanced when increasing the interactions. In the ICDW phase, the interactions are modulated by quantum metric to generate an effective chemical potential, leading to a discontinuous incommensurate-to-commensurate (IC-C) transition. We verify these phases and conclusions using low energy effective theory and density-matrix renormalization group (DMRG) calculations.", "url": "https://arxiv.org/abs/2611.26327", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jiale Xuan"}, {"name": "Grant Z. X. Yang"}, {"name": "K. T. Law"}, {"name": "Xiao Yan Xu"}], "featured_authors": [{"name": "Jiale Xuan"}, {"name": "Grant Z. X. Yang"}, {"name": "K. T. Law"}, {"name": "Xiao Yan Xu"}], "author_count": 4}, {"id": "2611.26345", "category": "cond-mat", "title": "First-passage and correlated reset-count statistics under threshold and Poissonian resetting in a two-dimensional wedge geometry", "abstract": "We study the interplay between threshold resetting (TR) and Poissonian resetting in a Brownian target search problem confined to a two-dimensional open wedge of apex angle $\\alpha$. The boundary at zero angle acts as an absorbing target, while encounters with the boundary at $\\alpha$ trigger TR, instantaneously restarting the search from its initial position. For TR alone, using the renewal framework developed by Biswas et al. in Phys. Rev. Lett. 135, 227101 (2025), we obtain exact first and second moments of the first-passage time (FPT), whose density exhibits an algebraic long-time tail $t^{-1-\\frac{\\pi}{2\\alpha}}$. To combine the two resetting mechanisms, we thereafter develop a generic random-variable-based renewal formalism to derive the combined mean FPT. We show that the coefficient of variation of the underlying TR dynamics determines whether Poissonian resetting accelerates or hinders the search for $0<\\alpha<\\pi/4$, whereas for $\\alpha\\geq\\pi/4$, Poissonian resetting always reduces the MFPT. Furthermore, we derive the joint count statistics of the two resetting mechanisms and characterize their mutual dependence through Pearson's correlation coefficient. Interestingly, we uncover a crossover from weak to strong correlations as the Poissonian resetting rate is varied, with the crossover behavior exhibiting a nontrivial dependence on the initial search position. Our framework provides a basis for studying competing resetting mechanisms in more general geometries.", "url": "https://arxiv.org/abs/2611.26345", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fazil Najeeb"}, {"name": "Arnab Pal"}, {"name": "V.V Prasad"}], "featured_authors": [{"name": "Fazil Najeeb"}, {"name": "Arnab Pal"}, {"name": "V.V Prasad"}], "author_count": 3}, {"id": "2611.26349", "category": "cond-mat", "title": "Perfumer: A Large Language Model-based Agentic Framework Accelerating Structural Relaxation and Electronic Band Prediction for First-Principle Calculation", "abstract": "First-principles structural relaxation and band calculations require substantial computation and expertise. Here we present Perfumer, a large language model-based agentic framework that couples Quantum ESPRESSO with two predictive models. Across tested structures, pre-relaxation with Perfumer-relax model followed by QE refinement yielded a 2.75-fold overall speedup over QE alone. Perfumer-band model combines a periodic graph neural network with a latent Hermitian spectral head returns 12 band energies at any requested wavevector, preserving reciprocal lattice periodicity and time-reversal symmetry without constructing Hamiltonian. Trained on 125,153 self-curated band structures, Perfumer-band model reaches a median per-material mean absolute error of 0.157 eV on 2,607 test materials, including lanthanide, actinide and magnetic compounds, from held-out composition families spanning 85 elements, taking about 97 ms per material on two consumer CPU cores. The agent turns natural-language requests into relaxation-to-band workflows, from a single uploaded structure to automatically constructed new candidates and returns predicted properties.", "url": "https://arxiv.org/abs/2611.26349", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhiwei Li"}, {"name": "Yuhao Zhou"}, {"name": "Yikai Yang"}, {"name": "Haonan Wang"}, {"name": "Qing Ye"}, {"name": "Jiancheng Lv"}, {"name": "Kazunari Matsuda"}], "featured_authors": [{"name": "Zhiwei Li"}, {"name": "Yuhao Zhou"}, {"name": "Yikai Yang"}, {"name": "Qing Ye"}, {"name": "Jiancheng Lv"}, {"name": "Kazunari Matsuda"}], "author_count": 7}, {"id": "2611.26356", "category": "cond-mat", "title": "Geometric formulation of the orbital magnetic susceptibility of periodic insulators", "abstract": "A gauge-invariant projector-based expression for the orbital magnetic susceptibility of periodic insulators is obtained from a density-matrix perturbation expansion in a uniform magnetic field. It is shown that, within such an approach, it is natural to distinguish two contributions: the Van Vleck paramagnetic contribution and a geometric contribution. The latter can be expressed in terms of fundamental geometric quantities built from projector derivatives such as the curvature and metric operators, as well as the closely related magnetic moment operator. When applied to two-band and four-band models, the expression for the susceptibility reduces to a simplified formula expressed in terms of the quantum metric. The significance of quantum geometry for the orbital magnetic response is then examined within a lattice model in two dimensions describing the transition between two distinct insulators via a Dirac semimetallic phase.", "url": "https://arxiv.org/abs/2611.26356", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "J. W. F. Venderbos"}], "featured_authors": [{"name": "J. W. F. Venderbos"}], "author_count": 1}, {"id": "2611.26360", "category": "cond-mat", "title": "Are superfluidity and superconductivity related to the spontaneous breaking of $U(1)$ symmetry?", "abstract": "It is widely believed that superfluidity and superconductivity are caused by the spontaneous breaking of global $U(1)$ symmetry. We investigate this question for quantum-mechanical systems using the following precise criterion for spontaneous symmetry breaking (SSB): the system's Hamiltonian and boundary conditions are invariant under transformations of a certain symmetry group, while the ground state is not. Through a simple analysis, we show that in real-world systems, which are always finite, spontaneous breaking of $U(1)$ symmetry does not occur. Therefore, superfluidity and superconductivity can be related to SSB only in infinite systems, which do not exist in our Universe. We also discuss the relationship between the theory of SSB and reality.", "url": "https://arxiv.org/abs/2611.26360", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Maksim Tomchenko"}], "featured_authors": [{"name": "Maksim Tomchenko"}], "author_count": 1}, {"id": "2611.26381", "category": "cond-mat", "title": "Imaginary-Time Density Correlations Encode Quantum Entropy and Free Energy", "abstract": "In the classical limit, maximum-entropy inference yields an estimate of the excess entropy from the static structure factor through a single momentum sum. Quantum mechanically this estimate fails, because interactions also change the kinetic energy, while delocalization and exchange add information that equal-time correlations do not contain. We show that imaginary-time density correlations contain this information, and that with them the classical relation carries over to quantum systems. Such correlations are available from path-integral simulations and X-ray Thomson scattering. Relative-entropy inference over imaginary-time paths, with an ideal Bose or Fermi gas as reference, gives closed forms for the excess entropy and free energies, within the same Gaussian approximation as the classical relation. They recover the classical result and estimate entropy that the classical relation misses. We test them on weakly interacting bosons, interacting fermions on a ring, and the warm dense electron gas. The closed forms need only imaginary-time density correlations and their ideal-gas reference at a single state point, without using the interaction potential. Our approach can extend other classical entropy estimators to quantum systems.", "url": "https://arxiv.org/abs/2611.26381", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sagi Meir"}], "featured_authors": [{"name": "Sagi Meir"}], "author_count": 1}, {"id": "2611.26482", "category": "cond-mat", "title": "Two distinct notions of speed in antiferromagnets", "abstract": "The terahertz resonance frequencies of antiferromagnets characterize their precessional dynamics but do not necessarily imply faster laser-induced quenching of magnetic order. Here, we investigate the distinct roles of magnetic compensation and electronic scattering phase space by comparing ultrafast demagnetization in the antiferromagnetic charge-transfer insulator NiO, the metallic antiferromagnet Mn2Au, and a ferromagnetic Ni reference. The extracted response in Mn2Au is approximately four times faster than in NiO and substantially faster than in Ni. These observations are consistent with exchange-mediated scattering between antiparallel sublattices enabling rapid loss of antiferromagnetic order without requiring net angular-momentum transfer to an external reservoir, provided sufficient electronic scattering phase space is available. In insulating NiO, restricted electronic scattering channels reduces the ultrafast response. Our results distinguish ultrafast demagnetization from exchange-enhanced precession and identify the interplay of spin-flip probability and electronic scattering rate as a key factor governing the nonequilibrium response of compensated magnets.", "url": "https://arxiv.org/abs/2611.26482", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Paul Herrgen"}, {"name": "Stephan Wust"}, {"name": "Christin Schmitt"}, {"name": "Yaryna Lytvynenko"}, {"name": "Lorenzo Baldrati"}, {"name": "Rafael Ramos"}, {"name": "Takashi Kikkawa"}, {"name": "Eiji Saitoh"}, {"name": "Martin Jourdan"}, {"name": "Mathias Kläui"}, {"name": "Hans Christian Schneider"}, {"name": "Benjamin Stadtmüller"}, {"name": "Martin Aeschlimann"}], "featured_authors": [{"name": "Paul Herrgen"}, {"name": "Stephan Wust"}, {"name": "Christin Schmitt"}, {"name": "Hans Christian Schneider"}, {"name": "Benjamin Stadtmüller"}, {"name": "Martin Aeschlimann"}], "author_count": 13}, {"id": "2611.26489", "category": "cond-mat", "title": "Nonstandard quantum statistics for strongly correlated systems: Superexclusion in momentum space and comparison with exact results", "abstract": "We analyze in detail nonstandard statistics for strongly correlated fermions, which comprise the statistical spin liquid (SSL) and model non-Fermi liquid (NFL) cases. Both of those cases are based on the total exclusion of local doubly occupancies ($the~superexclusion$) either in real space (SSL case) or in reciprocal ($\\mathbf{k}$) space (NFL). The results obtained on a purely physical ground are supplemented with the exact analysis of those coming from microscopic Hubbard-like model in $\\mathbf{k}$ space. Specifically, we discuss the transmutation of those statistics to that of localized magnetic moments, as well as the transformation of the Fermi liquid into a strongly correlated fermionic liquid or Mott insulating state; the latter taking place for the half-filled-band situation. The role of exclusion of double occupancies in either real or reciprocal space in the appearance of the correlated phase is stressed. Conclusions concerning the universal features of the models, independence of either the real- or $\\mathbf{k}$-space representation, are also discussed. One of those is the boson to fermion statistics transmutation which in the limit of strong repulsive interboson interaction leads to the particle localization instead to the Bose-Einstein condensation.", "url": "https://arxiv.org/abs/2611.26489", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Piotr Kuterba"}, {"name": "Mateusz Wójcik"}, {"name": "Józef Spałek"}], "featured_authors": [{"name": "Piotr Kuterba"}, {"name": "Mateusz Wójcik"}, {"name": "Józef Spałek"}], "author_count": 3}, {"id": "2611.26529", "category": "cond-mat", "title": "Exact fermionic decay length and Majorana localization in the sign-alternating kagomé Ising model", "abstract": "We derive an exact fermionic decay length for the sign-alternating kagomé Ising model at fixed transverse momentum $p=\\pi/2$. Writing $x=\\tanh K_1$, $y=\\tanh K_2$, and $z=\\tanh K_3$ for the three dimensionless couplings, the inverse length per lattice cell is $\\xi_{\\rm f}^{-1}=|\\ln(U/|V|)|$, where $U=(1-x^2)(1+y^2z^2)$ and $V=(1+x^2)(y^2-z^2)$. The length diverges at $U=|V|$, with the sign of $V$ selecting one of two classical critical branches. In a simultaneous strong- and weak-bond scaling, these branches become the gap-closing conditions at momenta $0$ and $\\pi$ of the transverse-field Ising chain obtained from the row transfer matrix. On the topological side, the classical decay length tends to the localization length of a Majorana end mode of the Jordan--Wigner fermion chain. We also prove that the regular strong-bond Yang--Baxter family cannot be continued to the finite-coupling interior within the fixed-basis ansatz with one vanishing bond direction.", "url": "https://arxiv.org/abs/2611.26529", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shahane Khachatryan"}, {"name": "Hrachya Babujian"}, {"name": "Ara SEdrakyan"}], "featured_authors": [{"name": "Shahane Khachatryan"}, {"name": "Hrachya Babujian"}, {"name": "Ara SEdrakyan"}], "author_count": 3}, {"id": "2611.26552", "category": "cond-mat", "title": "Nematic equilibria on a Möbius strip: topology and extrinsic curvature", "abstract": "We investigate the equilibrium configurations of a nematic liquid crystal confined in a thin tubular neighbourhood of a Möbius strip. Assuming degenerate tangential anchoring and a director uniform across the thickness, we derive an effective two-dimensional Frank energy that accounts for both the intrinsic and extrinsic curvature of the mid-surface. The non-orientability of the substrate imposes identification conditions that couple the reversal of the local frame to the head-to-tail symmetry of the nematic director. We show that the resulting topological classification depends on the parity of the number of half-twists: the sector index is a winding number for even parity, whereas only its parity is physically meaningful for odd parity, in which case the net director rotation is not quantised. We analyse the narrow-strip limit and solve the full two-dimensional equilibrium problem by finite-element methods. The competition between topological sectors depends on the strip aspect ratio and elastic anisotropy. In particular, for a single half-twist, the preferred sector changes at an aspect ratio of approximately 0.58, while for two half-twists two distinct minima of the same sector exchange their energy ordering near 0.60, without any change of topology. These results reveal how non-orientable topology and extrinsic curvature jointly shape nematic equilibria on curved substrates.", "url": "https://arxiv.org/abs/2611.26552", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Massimo Frittelli"}, {"name": "Sébastien Fumeron"}, {"name": "Gaetano Napoli"}], "featured_authors": [{"name": "Massimo Frittelli"}, {"name": "Sébastien Fumeron"}, {"name": "Gaetano Napoli"}], "author_count": 3}, {"id": "2611.26578", "category": "cond-mat", "title": "Activity-driven motion and deformation of a circular membrane domain", "abstract": "Lipid bilayer membranes are nanometer-thin fluid interfaces characterized by both in-plane fluidity and lateral compositional heterogeneity. Cholesterol-rich liquid domains (\"lipid rafts\") are thought to regulate the spatial organization of membrane proteins and numerous cellular processes. While the passive diffusion and equilibrium shape fluctuations of membrane domains are well understood, much less is known about how the activity of molecular machines, such as protein pumps and enzymes, influences their mobility and deformation. Here, we analyze the dynamics of a membrane domain driven by an embedded molecular machine within the framework of two-dimensional Stokes flow. The molecular machine is modeled as a point singularity of the two-dimensional Stokes equations, including both rotational and irrotational singularities corresponding to force and source multipoles. We show that, despite being force-free, both force and source dipoles generate active flows that propel the membrane domain. For a force dipole undergoing rotational diffusion, the domain motion is diffusive at long times but exhibits a transient superdiffusive regime at intermediate times.", "url": "https://arxiv.org/abs/2611.26578", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gonzalo Ferrandez Quinto"}, {"name": "Sho Kawakami"}, {"name": "Petia M. Vlahovska"}], "featured_authors": [{"name": "Gonzalo Ferrandez Quinto"}, {"name": "Sho Kawakami"}, {"name": "Petia M. Vlahovska"}], "author_count": 3}, {"id": "2611.26599", "category": "cond-mat", "title": "Local orbital magnetization and Chern markers from equilibrium local currents", "abstract": "Local currents carry the orbital magnetization of a macroscopic sample and are key for modeling inhomogeneous magnetic materials and for understanding magnetoelectric and topological responses. However, producing realistic simulated images of local currents in inhomogeneous systems remains challenging. Building upon recent work on stochasti
