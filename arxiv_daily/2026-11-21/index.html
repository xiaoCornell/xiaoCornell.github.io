d hierarchy, and this was conjectured to hold generally. We show that this bound can be completely bypassed, and that topological codes with Clifford stabilizers in 2D can realize transversal logical gates at any level of the Clifford hierarchy. We present two explicit constructions of codes based on copies of the quantum doubles of $D_4$ and $\\mathbb{Z}_2$, with $k$ logical qubits and a logical $C^{k-1}Z$ gate, which is at level $k$ of the Clifford hierarchy. The physical circuits realizing the gates consist only of physical $Z$ or $CZ$ gates. The main new ingredient comes from the logical encoding, which depends crucially on non-Abelian group multiplication.", "url": "https://arxiv.org/abs/2611.25025", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alison Warman"}, {"name": "Sakura Schafer-Nameki"}], "featured_authors": [{"name": "Alison Warman"}, {"name": "Sakura Schafer-Nameki"}], "author_count": 2}, {"id": "2611.25038", "category": "quant-ph", "title": "Birthday-Scale Non-Adaptive Security for Strong Pseudorandom Unitaries", "abstract": "Pseudorandom unitaries (PRUs) are efficiently implementable unitary ensembles that are computationally indistinguishable from Haar-random unitaries, providing efficient substitutes for Haar-randomness in quantum information and cryptography. Strong PRUs require this indistinguishability to hold even when the adversary is given access to all of $U$, $U^\\dagger$, $U^*$, and $U^T$. In this work, we prove birthday-scale non-adaptive security for the DPFC (Clifford-Phase-Permutation-Clifford) strong PRU candidate. For an $N$-dimensional unitary, allowing arbitrary entangled inputs and coherent superpositions of query types, we show that DPFC can withstand $t \\approx \\sqrt{N}$ queries. This matches the best known query complexity even for PRUs that are not strong, compared with $t \\approx N^\\alpha$ for $\\alpha < 1/2$ in previous strong-PRU analyses. Our proof utilizes two techniques from previous works: the EPR-sector decomposition of Schuster et al. (arXiv 2025), previously used for unitary designs but not for PRUs, and the path-recording framework of Ma and Huang (STOC 2025), previously used for adaptive security analysis. We complement the non-adaptive security result with an upper bound in the adaptive setting, showing that DPFC cannot remain secure for $t \\gg \\sqrt{N}$ queries.", "url": "https://arxiv.org/abs/2611.25038", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zvika Brakerski"}, {"name": "Lior Ozer"}, {"name": "Shahar Silberstein"}], "featured_authors": [{"name": "Zvika Brakerski"}, {"name": "Lior Ozer"}, {"name": "Shahar Silberstein"}], "author_count": 3}, {"id": "2611.25048", "category": "quant-ph", "title": "A Basis-Dependent Kernel for Learning Quantum Phases of Matter", "abstract": "Identifying the phases of a quantum many-body system as its parameters vary is a central problem in condensed-matter physics. Data-driven approaches address this task by comparing quantum states, for instance through their fidelity, and locating transitions where these comparisons change abruptly. In this work, we introduce the inverse participation ratio (IPR) kernel, a kernel method built for learning quantum phases of matter from IPRs in physically motivated bases. Unlike fidelity-based kernels, the IPR kernel can identify states with physically meaningful similarity even when they are orthogonal. We test the method on ground states of the transverse-field Ising (TFIM) and Heisenberg XXZ models. For TFIM Gibbs states, we further show that the IPR kernel retains phase-relevant structure over a range of nonzero temperatures where the phase signal of fidelity-based kernels is already degraded. More broadly, our results suggest that quantum kernels benefit more from feature maps tailored to the physics of the problem than from maximal expressivity.", "url": "https://arxiv.org/abs/2611.25048", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Clemens Lindner"}, {"name": "Vinícius Mohr"}, {"name": "Adrián Pérez-Salinas"}], "featured_authors": [{"name": "Clemens Lindner"}, {"name": "Vinícius Mohr"}, {"name": "Adrián Pérez-Salinas"}], "author_count": 3}, {"id": "2611.25106", "category": "quant-ph", "title": "Agentic MLIR-to-QIR Translation with Dual-Backend Testing: A Hybrid Deterministic and LLM Approach", "abstract": "Quantum frameworks each define their own Multi-Level Intermediate Representation (MLIR) dialect, so porting a circuit to a Quantum Intermediate Representation (QIR) runtime needs a hand-written pass per dialect. Our translator selects among three paths: a deterministic compiler path for known grammars (Catalyst and Quake), a large language model (LLM) agentic path for unseen dialects, and a repair path invoked when deterministic output fails testing. A dual-backend pipeline executes the source MLIR and generated QIR on independent simulators, comparing output distributions by total variation distance (TVD). For smaller open-weight models we replace retrieval-augmented generation with inline context engineering and add a guardrail-assembler that rebuilds valid QIR from incomplete output. Across 41 circuits spanning three dialects and 1-100 qubits, the deterministic path is gate-exact on all 70 circuit-dialect pairs, averaging above 95% TVD similarity (1-TVD). On an unseen fault-tolerant (FTQC) dialect, four of six models produce valid logical-level QIR on the first iteration.", "url": "https://arxiv.org/abs/2611.25106", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sharmin Afrose"}, {"name": "Vicente Leyton-Ortega"}, {"name": "Narasinga Rao Miniskar"}, {"name": "Elaine Wong"}, {"name": "Travis S. Humble"}], "featured_authors": [{"name": "Sharmin Afrose"}, {"name": "Vicente Leyton-Ortega"}, {"name": "Narasinga Rao Miniskar"}, {"name": "Elaine Wong"}, {"name": "Travis S. Humble"}], "author_count": 5}, {"id": "2611.25107", "category": "quant-ph", "title": "Generalizing and Combining Check Constructions: Design-Space Exploration for Fault-Tolerant Quantum State Preparation", "abstract": "Fault-tolerant quantum computing needs logical states prepared such that single faults cannot spread into uncorrectable errors. Post-selection achieves this with added checks that detect dangerous faults and discard the run. How the checks are measured sets the depth and operation count of the circuit, and the best trade-off depends on the hardware. Existing automated methods, however, each use one check construction and yield fixed trade-offs. We first introduce Block Checks, in which several checks share one fault-tolerantly prepared auxiliary block, which places them and existing constructions in a single design space. Second, to explore that space, we propose a Pareto tree search that adds checks and auxiliary blocks, merges auxiliaries, and edits the circuit. On quantum codes of distance up to seven, the search finds best-known circuits for many new operation--depth trade-offs and surpasses existing methods. The code is open source as part of the Munich Quantum Toolkit (MQT) at this https URL , and all circuits are available in the QECirc library at this https URL .", "url": "https://arxiv.org/abs/2611.25107", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ludwig Schmid"}, {"name": "Robert Wille"}], "featured_authors": [{"name": "Ludwig Schmid"}, {"name": "Robert Wille"}], "author_count": 2}, {"id": "2611.25124", "category": "quant-ph", "title": "Learning Integer Winding Evolution Times in Quantum Phase Estimation", "abstract": "Learning a Hamiltonian evolution time in Quantum Phase Estimation that produces phase distributions with low Shannon entropy circumvents the fundamental limit of digitization error of phase, independent of the number of phase qubits of accuracy. By introducing an optimization loop to minimize the Shannon entropy of measured eigenvalues produced by a QPE quantum circuit, minimum eigenvalue computation accuracy is greatly improved, which we show numerically on quantum magnet models. This technique works because standard QPE has a natural correspondence between entropy of the phase distribution and the analog accuracy of the minimum eigenvalue phase. This introduces for the first time a type of parameter learning to QPE, which makes near term practicality of QPE for fundamental sciences more feasible by using shorter depth QPE circuits.", "url": "https://arxiv.org/abs/2611.25124", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Elijah Pelofske"}, {"name": "Stephan Eidenbenz"}], "featured_authors": [{"name": "Elijah Pelofske"}, {"name": "Stephan Eidenbenz"}], "author_count": 2}, {"id": "2611.25147", "category": "quant-ph", "title": "Accelerating Diffusion Maps on a Quantum Computer: Spectral Filtering and Galerkin PDE Solvers", "abstract": "Diffusion maps generalize principal component analysis (PCA) to nonlinear manifolds, enabling spectral dimensionality reduction, geometric data analysis, and elliptic PDE approximation on point clouds. For large datasets of size $N$, however, classical matrix operations incur prohibitive $\\operatorname{poly}(N)$ scaling, even when extracting low-dimensional spectral features or targeted scalar observables. We introduce a quantum algorithmic framework that bypasses explicit graph-Laplacian assembly by exploiting the symmetric factorization $G = A^T A$ directly at the block-encoding level. Combining Gaussian moment dilation, Laplace-weighted linear combinations of unitaries (LCU), and quantum singular value transformation (QSVT), we implement spectral filters of $A$ to estimate heat-semigroup overlaps, regularized inverse queries, and energy responses, as well as to prepare spectral Galerkin solution states. A common-state construction further allows the block-encoding queries to be used across multiple scalar observables. Under polylogarithmic-cost block-encoding access to $A$ and state-preparation oracles, our heat-overlap algorithm achieves $O(\\operatorname{polylog} N)$ gate complexity at fixed normalized precision, confidence, and spectral scale. Ideal statevector simulations validate our discrete circuit constructions, while a matched approximate-counting benchmark demonstrates the quadratic precision advantage of coherent amplitude estimation for energy readout.", "url": "https://arxiv.org/abs/2611.25147", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ruizhe Qian"}, {"name": "Xiantao Li"}], "featured_authors": [{"name": "Ruizhe Qian"}, {"name": "Xiantao Li"}], "author_count": 2}, {"id": "2611.25188", "category": "quant-ph", "title": "Analytic and Numerical Investigation of a Proposed Non-linear Extension of Quantum Mechanics", "abstract": "In this paper, additional properties of a previously introduced non-linear extension of quantum mechanics are investigated. Analytically, we uncover a limit in which the model reduces to ordinary linear quantum mechanics. We also perform a perturbation analysis about an exact solution studied in earlier work. The equations represent a system that is subject to a periodic driver, and we use Floquet theory to help determine its properties. Numerically, we compare the exact solution to the analytic approximation, and we exhibit several examples of how the non-linear effects influence particle trajectories, with particular emphasis on trajectories near the linear limit.", "url": "https://arxiv.org/abs/2611.25188", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alan Chodos"}, {"name": "Anastasiia Purtova"}], "featured_authors": [{"name": "Alan Chodos"}, {"name": "Anastasiia Purtova"}], "author_count": 2}, {"id": "2611.25286", "category": "quant-ph", "title": "Resilience of emergent Hamiltonian quantum memories in the presence of noise", "abstract": "Emergent Hamiltonians can freeze an entangled state prepared through coherent evolution, since that state is an eigenstate of the Hamiltonian under which it is then stored. We show that the freedom left in this construction allows the storage spectrum to be adapted to a noisy environment without changing the stored state. For a product of Bell pairs prepared from a density wave in an engineered chain, a selection rule prevents local density noise from connecting the target to any of its degenerate partners, so that rescaling the storage Hamiltonian by a factor $\\alpha$ moves every transition this noise drives. Under $1/f$ noise, the storage time then grows in proportion to $\\alpha$, a result we confirm by evolving the memory under explicit classical $1/f$ fields, whereas for an Ohmic bath the most favorable scale depends on its cutoff. Fermionic loss, treated as a solvable model, includes a transition that rescaling leaves at zero frequency, and an energy shift $\\mu$ per particle moves it away from zero, with an exact orbital solution giving the resulting lifetimes. Finally, among number-conserving quadratic reference Hamiltonians, $\\alpha$ and $\\mu$ are the only controls that keep the storage Hamiltonian nearest neighbor at every time along the preparation, so that the protocol combines local freezing with control over the storage spectrum.", "url": "https://arxiv.org/abs/2611.25286", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anubhab Sur"}, {"name": "Rubem Mondaini"}], "featured_authors": [{"name": "Anubhab Sur"}, {"name": "Rubem Mondaini"}], "author_count": 2}, {"id": "2611.25299", "category": "quant-ph", "title": "Quantum dynamical transitions when the corresponding classical phase space has a separatrix: extension of the QKNH theorem beyond double wells", "abstract": "In classical Hamiltonian systems with a slowly time-dependent parameter, adiabaticity breaks down at a separatrix, leading to probabilistic post-adiabatic transitions between different phase-space regions described by the Kruskal-Neishtadt-Henrard (KNH) theorem. Quantum mechanically, dynamical tunneling allows adiabaticity to persist where it breaks down classically, making the quantum-classical correspondence for separatrix crossing non-trivial. We recently established a quantum version of the KNH theorem (QKNH) by introducing the concept of a sweep-rate-dependent quantum separatrix in the instantaneous energy spectrum of the time-dependent system. The QKNH theorem relates the splitting of a quantum ensemble between the outgoing dynamical sectors at the quantum separatrix to their relative growth rates, and thus provides a quantum analog of the classical KNH rule. Here, we demonstrate that these findings are not restricted to double-well systems with tunneling through a potential barrier. We investigate a slowly driven quantum pendulum, in which the avoided crossings arise from above-barrier reflection. The resulting Landau-Zener probabilities have the same local lattice form as in the double-well problem, allowing the application of the QKNH theorem.", "url": "https://arxiv.org/abs/2611.25299", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Peter Stabel"}, {"name": "James R. Anglin"}], "featured_authors": [{"name": "Peter Stabel"}, {"name": "James R. Anglin"}], "author_count": 2}, {"id": "2611.25323", "category": "quant-ph", "title": "Generation of coherent-state Schrödinger cat states in a two-photon Jaynes-Cummings model implemented with Josephson junctions", "abstract": "We investigate the generation of coherent-state Schrödinger cat states using a two-photon Jaynes-Cummings model (JCM) implemented in a Josephson-junction quantum circuit. We consider a specific superconducting flux-qubit implementation and estimate the resulting two-photon coupling constant. We numerically examine three types of noise: magnetic flux noise with $1/f$ fluctuations, energy relaxation associated with the flux-qubit $T_{1}$ decay, and photon loss in the bosonic mode obtained by quantizing the phase variable of the dc SQUID used for qubit readout. We find that photon loss has a particularly significant effect on cat-state fidelity. We also investigate the time evolution of the probability-amplitude distribution in the Pegg-Barnett phase-state basis for the $l$-photon JCM ($l=1,2,3,4$), starting from a coherent bosonic state. Finally, we assume that the bosonic mode is initially prepared in a displaced thermal state and then decoupled from the heat bath. We study the subsequent unitary evolution to determine how the initial temperature affects the fidelity and Wigner function of the generated cat states.", "url": "https://arxiv.org/abs/2611.25323", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hiroo Azuma"}, {"name": "William J. Munro"}, {"name": "Kae Nemoto"}], "featured_authors": [{"name": "Hiroo Azuma"}, {"name": "William J. Munro"}, {"name": "Kae Nemoto"}], "author_count": 3}, {"id": "2611.25397", "category": "quant-ph", "title": "Counterfactual attribution of surface-code failures under non-Pauli noise: dependence on trajectory pairing", "abstract": "Under Pauli noise in a stabilizer memory, attributing a quantum error-correction failure to the noise that caused it has a canonical answer; under non-Pauli noise the attribution depends on how trajectories are paired with their counterfactuals. We define a failing shot's cause set, the sites whose removal alone removes the failure, and separate it from pairing-independent net effects. The pairing enters wherever a fixed random draw meets a Born probability; making it maximal at every random step selects shared random numbers, while continuity does not. In a distance-three surface code, exact non-Pauli noise and its Pauli twirl fail at rates equivalent within a registered margin, yet under shared draws 20.2% of exact-noise failures need three or more sites, against 2.3% under the twirl. Other admissible pairings move the mean coherent cause count from 1.61 to 80 times the minimum the marginals allow, yet pairing-independent quantities barely separate the two models. Shot-level attributions should therefore state their pairing and report pairing-independent effects alongside.", "url": "https://arxiv.org/abs/2611.25397", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kisung Jin"}, {"name": "Gyuil Cha"}], "featured_authors": [{"name": "Kisung Jin"}, {"name": "Gyuil Cha"}], "author_count": 2}, {"id": "2611.25519", "category": "quant-ph", "title": "The computational complexity of bosonic Lindbladian fixed points", "abstract": "We study the computational complexity of estimating observables and sampling from stationary states, or fixed points, of bosonic Lindbladian dynamics with bounded-degree polynomial interactions. While the complexity of transient bosonic dynamics has been investigated, understanding the computational power of bosonic fixed points requires addressing subtleties of infinite-dimensional systems, including the existence, uniqueness, and convergence of stationary states. We establish a broad complexity landscape spanning universal quantum computation, efficient classical simulation, sampling hardness, and undecidability. First, we show that universal quantum computation can be embedded into observable estimation at the unique fixed point of a bosonic Lindbladian with a Hamiltonian of degree at most twelve and only linear photon loss. Moreover, this fixed point can be prepared from vacuum in polynomial time. On the classical side, we identify Gaussian regimes with incoherent pumping that admit efficient photon-number sampling and establish stability of classical approximability under sufficiently weak non-Gaussian Kerr perturbations. Conversely, for Gaussian fixed points without incoherent pumping, we establish hardness of exact sampling under constant-rate linear loss and hardness of approximate sampling at inverse-polynomial loss rates under standard boson-sampling conjectures. We also relate sampling from non-Gaussian fixed points to variants of boson sampling. Finally, we prove that deciding the existence of a stationary density operator is $\\mathsf{RE}$-hard, even for purely dissipative Lindbladians with degree-five jump operators acting on at most four modes.", "url": "https://arxiv.org/abs/2611.25519", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "En-Jui Kuo"}, {"name": "Arsalan Motamedi"}, {"name": "Mohammad Hafezi"}, {"name": "Saeed Mehraban"}], "featured_authors": [{"name": "En-Jui Kuo"}, {"name": "Arsalan Motamedi"}, {"name": "Mohammad Hafezi"}, {"name": "Saeed Mehraban"}], "author_count": 4}, {"id": "2611.25723", "category": "quant-ph", "title": "Insurance portfolio simulation with a quantum circuit", "abstract": "A central challenge in actuarial science is characterising the distribution of losses generated by an insurance portfolio. Copulas provide a natural framework for modelling joint distributions, but flexible high-dimensional copula fitting and sampling remains challenging in practice. We propose a Quantum Circuit Born Machine (QCBM) approach adapted to insurance portfolios, combining (i) a tail-focused discretisation of heavy-tailed marginals, (ii) a Monte Carlo-style objective function that enables the numerical precision of the algorithm to scale when trained on a relatively small number of samples, and (iii) a two-stage hierarchical training scheme enabling efficient training on a simulator and fine-tuning on quantum hardware. On a mixed portfolio of equity returns and insurance losses, the trained circuit recovers the qualitative dependence structure, with near-independence between equity and losses and positive dependence among loss lines. Exponential quantile encoding substantially improves the fit to the tail of the aggregate loss distribution relative to a uniform encoding, and the hierarchical scheme substantially outperforms single-stage training of a circuit of the same size from random initialisation.", "url": "https://arxiv.org/abs/2611.25723", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "William Cashman"}, {"name": "Marco Caselli"}, {"name": "Saad Hamid"}, {"name": "Daniel Mills"}, {"name": "Pavel Stishenko"}], "featured_authors": [{"name": "William Cashman"}, {"name": "Marco Caselli"}, {"name": "Saad Hamid"}, {"name": "Daniel Mills"}, {"name": "Pavel Stishenko"}], "author_count": 5}, {"id": "2611.25752", "category": "quant-ph", "title": "Beyond Error Mitigation: Using Boosting for Noisy Quantum Machine Learning", "abstract": "Quantum error mitigation (QEM) can recover information about ideal quantum computations from noisy circuit executions, but may require a large sampling overhead. Fundamental lower bounds show that recovering noiseless observables without problem-specific information can require superpolynomially many samples, with exponential overhead for broad classes of noisy circuits. However, problem-specific information can reduce the number of samples needed to obtain the required answer. We investigate this possibility in supervised quantum machine learning, where labeled examples provide information about the function to be learned. Binary classification provides such a setting, since correct prediction depends on the sign and margin of the classifier output rather than on accurate reconstruction of every noiseless expectation value. We develop a theoretical and empirical framework for comparing boosting of noisy parameterized quantum circuits with probabilistic error cancellation (PEC), requiring both methods to reach the same learning target. For the specified circuit architectures under Pauli noise, we establish a common hypothesis-class complexity bound: matching empirical margin loss gives the same upper bound on expected classification risk. We derive resource criteria and evaluate AdaBoostR and Real AdaBoost in finite-shot teacher-student simulations across circuit depth and physical noise strength. Under the same classification-accuracy target, boosting requires fewer circuit executions as depth and noise increase. Boosting also achieves higher test accuracy than the corresponding reference. For the supervised-learning problems studied, these results demonstrate a task-dependent resource advantage: exploiting information retained in noisy outputs can avoid the cost of ideal-output reconstruction without sacrificing observed classification performance.", "url": "https://arxiv.org/abs/2611.25752", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anastasiia Lukianenko"}, {"name": "Yash J. Patel"}, {"name": "Nurbolat Kenbayev"}, {"name": "Vedran Dunjko"}], "featured_authors": [{"name": "Anastasiia Lukianenko"}, {"name": "Yash J. Patel"}, {"name": "Nurbolat Kenbayev"}, {"name": "Vedran Dunjko"}], "author_count": 4}, {"id": "2611.25880", "category": "quant-ph", "title": "Evolving Decoding Algorithms for Quantum Error Correction", "abstract": "Quantum computation entails robustness engineering: a noisy quantum state is measured continuously, and a classical algorithm (the decoder) must infer corrections that reliably remove the noise, fast enough to keep up. We write several published belief-propagation (BP) decoders for quantum low-density parity-check (qLDPC) codes in a Domain-Specific Language (DSL), and search over it with grammatical evolution. Written in the language, the published decoders show their parameters in plain view, allowing us to re-parameterise BP+OSD (ordered statistics decoding) and BP+LSD (localized statistics decoding) decoders with damping, before any search, making each 17.1--41.0$\\times$ faster at a higher error rate, and BP+OSD-0 about 103 faster than the ldpc package's version tuned on the [[72,12,6]] bivariate-bicycle code. Evolution over the language finds decoders that improve the time-error front. One makes 23% fewer logical errors than BP+OSD-0 with damping at 0.64$\\times$ its time, and decoders evolved from random code are more accurate than ldpc's tuned BP+OSD-0 at 1/31 of its time or less. Frozen at one operating point, the two fastest evolved decoders generalize well across noise levels, code sizes and round counts, staying at the time-error front. Ultimately, we demonstrate that capturing expert knowledge within a DSL creates a powerful intermediate layer---one that effectively bridges human intuition and machine-driven optimization to unlock highly efficient quantum error correction.", "url": "https://arxiv.org/abs/2611.25880", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Eduardo Dueñez"}, {"name": "Edgar Said Hernandez Sanchez"}, {"name": "Edgar A. Duéñez-Guzmán"}, {"name": "Suzanne Sadedin"}], "featured_authors": [{"name": "Eduardo Dueñez"}, {"name": "Edgar Said Hernandez Sanchez"}, {"name": "Edgar A. Duéñez-Guzmán"}, {"name": "Suzanne Sadedin"}], "author_count": 4}, {"id": "2611.25964", "category": "quant-ph", "title": "A New Quantum Algorithm Framework for Integer Order Entropy Estimation", "abstract": "Entropy estimation for unknown distributions is a basic problem in statistical property estimation. In this paper, we propose a quantum algorithm framework for estimating Rényi entropy with fixed integer order $k\\geq 2$. Given purified quantum query-access to a distribution on $n$ symbols, our algorithm estimates its order-$k$ Rényi entropy to within additive error $\\epsilon$ using $$\\widetilde{\\mathcal{O}}\\left(\\frac{n^{u_k}}{\\epsilon^{1-u_k}} + \\frac{n^{(k-1)/(2k)}}\\epsilon\\right)$$ queries, where $u_k=\\max_{2\\leq j\\leq k} \\frac{(3k-j)2^{j-2}-k}{k(2^j-1)}$. The main ingredient is a recursive construction of collision states in which intermediate states are retained and reused. We bound both the preparation and reflection costs, and choose the number of retained states at each order so that all recursive steps fit within a common query budget. We combine this construction with a sequence of decreasing probability thresholds, estimating the contribution of the labels found along the way separately from the remaining power sum. A batch estimator gives the required bound in the high-precision regime, and an initial search removes the need for prior knowledge of the power sum.", "url": "https://arxiv.org/abs/2611.25964", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zongxing Xiong"}], "featured_authors": [{"name": "Zongxing Xiong"}], "author_count": 1}, {"id": "2611.26005", "category": "quant-ph", "title": "Flat bands and bound states in the continuum in non-Hermitian pseudospin lattices", "abstract": "Flat bands support compact localized states (CLSs), whereas bound states in the continuum (BICs) remain spatially localized despite having energies embedded in the continuum of extended states. Here, we investigate the connection between these phenomena in a class of one-dimensional non-Hermitian lattices whose Bloch Hamiltonians take the pseudospin form H(k)=d(k)S. For integer pseudospin, the Hamiltonian intrinsically supports a zero-energy flat band and its associated compact localized states. When the effective pseudospin field has real transverse components and a purely imaginary longitudinal component, increasing non-Hermiticity compresses the dispersive bands toward the intrinsic zero-energy flat band, enabling their spectral overlap within a finite parameter range. The CLSs thus become embedded in the dispersive continuum and emerge as BICs. Adding a momentum-dependent Hermitian component along the gain-loss direction generally removes this spectral overlap without destroying the CLSs. We further extend this spectral mechanism to integer-pseudospin-n systems. These findings establish a connection between intrinsic flat-band localization and BIC formation through non-Hermitian spectral reconstruction.", "url": "https://arxiv.org/abs/2611.26005", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "X. Y. Chen"}, {"name": "C. H. Zhang"}], "featured_authors": [{"name": "X. Y. Chen"}, {"name": "C. H. Zhang"}], "author_count": 2}, {"id": "2611.26006", "category": "quant-ph", "title": "The influence of quantum scarring on the onset of Bohmian chaos", "abstract": "In the present work we investigate how the stable and unstable periodic orbits of a perturbed two-dimensional oscillator influence the Bohmian trajectories of the corresponding quantum system. In particular, we find that in our systems all Bohmian trajectories become chaotic in the long run and examine the times needed for them to approach their ergodic pattern. We show that these times are systematically shorter for orbits close to unstable periodic orbits than for orbits close to stable periodic orbits of the same period. We demonstrate that this behaviour is connected to scarring effects associated with both unstable and stable periodic orbits. We also investigate how the Bohmian dynamics changes when a stable periodic orbit undergoes a bifurcation and becomes unstable.", "url": "https://arxiv.org/abs/2611.26006", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Athanasios C. Tzemos"}, {"name": "George Contopoulos"}], "featured_authors": [{"name": "Athanasios C. Tzemos"}, {"name": "George Contopoulos"}], "author_count": 2}, {"id": "2611.26066", "category": "quant-ph", "title": "Finite-Key Analysis for Multiple-Antenna Quantum Key Distribution with Continuous Variables", "abstract": "Multiple-input multiple-output (MIMO) techniques, known for their use in wireless communications, can also find applications in quantum communications systems. This is, for instance, relevant to satellite-based quantum communications when atmospheric turbulence and the time-varying nature of the channel can make their implementation difficult. Here, we study the application of MIMO techniques to continuous-variable (CV) quantum key distribution (QKD) in the realistic setting where a finite number of signals are exchanged. We show how data collected during the brief overpass time of low-earth-orbit satellites over ground stations can be processed to estimate MIMO channel parameters, extract a secret key, and quantify the key generation rate. For $2\\times 2$ MIMO settings with Gaussian encoding and heterodyne detection, our finite-key analysis indicates that MIMO CV-QKD could outperform both multiplexed (with a nominal 3~dB improvement) and single-mode (with a nominal 6~dB nominal improvement) scenarios. Furthermore, we conjecture that the ultimate enhancement of a multiple-antenna CV-QKD system can be characterized by the product of the number of its inputs and outputs.", "url": "https://arxiv.org/abs/2611.26066", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masoud Ghalaii"}, {"name": "Ahmed Q. Lawey"}, {"name": "Mohsen Razavi"}], "featured_authors": [{"name": "Masoud Ghalaii"}, {"name": "Ahmed Q. Lawey"}, {"name": "Mohsen Razavi"}], "author_count": 3}, {"id": "2611.26147", "category": "quant-ph", "title": "A receiver-side approach to confirm phase randomization in BB84 time-bin QKD with weak coherent pulses", "abstract": "In quantum cryptography using time-bin BB84 protocols, the relative phase of symbol pulses has to be random to avoid vulnerability to coherent attacks. Typically this phase randomization is checked on the sender side. Here, we propose a protocol for monitoring and confirming phase randomization independently on the receiver side during operation. The proposed method can be implemented on the single-photon level without the need for any physical adaptation of the receiver. This can provide an additional tool for monitoring against possible eavesdropping attempts that affect the phase randomization.", "url": "https://arxiv.org/abs/2611.26147", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bedir Halcı"}, {"name": "Rainer Kaltenbaek"}], "featured_authors": [{"name": "Bedir Halcı"}, {"name": "Rainer Kaltenbaek"}], "author_count": 2}, {"id": "2611.26198", "category": "quant-ph", "title": "The role of complementarity and quantum correlation in the uncertainty relations and the optimum states", "abstract": "Uncertainty relations are used in quantum mechanics to illustrate the complementarity of two observables, assuming there is a lower bound for the product of their dispersions that depends on the first-order quantum correlation and the commutation relation of those observables in an optimum state. In this work, we demonstrate that the complex parameter of the optimum state equation has real and imaginary parts that depend on the first-order quantum correlation and the commutation relation between the observables in the optimum state, respectively. We apply our results to a two-level system, finding that the first-order quantum correlation and the commutation relation of two spin-1/2 projections in the optimum state complement each other and, finally, when the term correlation is used, a lower bound for the uncertainty principle does not depend on any parameter of the optimum state, in contrast to the usual form of the Heisenberg principle.", "url": "https://arxiv.org/abs/2611.26198", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sttiwuer Díaz-Solórzano"}, {"name": "Goosline Alfredo Pereira Narváez"}], "featured_authors": [{"name": "Sttiwuer Díaz-Solórzano"}, {"name": "Goosline Alfredo Pereira Narváez"}], "author_count": 2}, {"id": "2611.26210", "category": "quant-ph", "title": "Improving the signal-to-noise ratio through postselection of coincident detections in anticounterfeiting and quantum key distribution", "abstract": "In quantum communications and other photon-counting applications, reliably detecting weak optical signals against a strong noise background remains a fundamental challenge. In this paper, we develop a simple idea: when a signal is carried by pairs (or more generally multiplets) of photons emitted simultaneously, postselection of coincident detections recorded on two detectors makes it possible to improve-sometimes drastically-the Signal to Noise Ratio. Essentially, this is made possible by the fact that genuine and accidental coincidences scale differently with the width of the postselection window. As long as the window remains wide enough to retain detections from the same pair, the genuine coincidence rate is approximately unchanged. In contrast, coincidences formed from independent clicks decrease linearly as the window is narrowed. The resulting signal-to-noise ratio, therefore, increases inversely with the window width. Our approach makes it possible to reveal photon-pair signals that are otherwise hidden beneath a much stronger uncorrelated background. We analyze here applications of this idea to quantum key distribution, metrology, and anti-counterfeiting.", "url": "https://arxiv.org/abs/2611.26210", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Paula Wieteska-Bajak"}, {"name": "Mohamed Hatifi"}, {"name": "Renaud Mathevet"}, {"name": "Vincent Lacombe"}, {"name": "Jerome Wenger"}, {"name": "Thomas Durt"}], "featured_authors": [{"name": "Paula Wieteska-Bajak"}, {"name": "Mohamed Hatifi"}, {"name": "Renaud Mathevet"}, {"name": "Vincent Lacombe"}, {"name": "Jerome Wenger"}, {"name": "Thomas Durt"}], "author_count": 6}, {"id": "2611.26214", "category": "quant-ph", "title": "Cooperativity-enhanced single-photon emission in a topological quantum emitter chain", "abstract": "Single-photon emitters are one of the key elements in state-of-the art quantum technologies, yet optimizing and manipulating their emission requires precise fabrication of the emitter systems themselves. Here, we propose a route to tailored single-photon emission by exploiting cooperative effects in a topological single-photon emitter chain. Although the involvement of multiple emitters normally suppresses single-photon emission, we show that localized topological edge modes restore single-photon emission and protect against local perturbations. At the same time, cooperative effects occur due to the collective nature of the edge modes, leading to directional emission and linewidth narrowing. Our findings open new possibilities for tailoring single-photon emission by combining cooperativity and topological effects.", "url": "https://arxiv.org/abs/2611.26214", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jonathan Sturm"}, {"name": "Irene Burghardt"}, {"name": "Bert Hecht"}, {"name": "Adriana Pálffy"}], "featured_authors": [{"name": "Jonathan Sturm"}, {"name": "Irene Burghardt"}, {"name": "Bert Hecht"}, {"name": "Adriana Pálffy"}], "author_count": 4}, {"id": "2611.26231", "category": "quant-ph", "title": "A sensitivity-constrained polynomial method for DQC1 query complexity", "abstract": "The polynomial method is one of the fundamental techniques for proving lower bounds on quantum query complexity, particularly in the BQP query model. In this work, we develop an analogue of the polynomial method for the DQC1 query model. We introduce the notion of {\\em sensitivity approximate degree} for Boolean functions and show that it provides a lower bound on DQC1 query complexity. We establish several basic structural properties of this new measure. As a first result, we show that every nonconstant total Boolean function on $N$ input variables has sensitivity approximate degree $\\Omega(N)$, and hence requires $\\Omega(N)$ queries in the DQC1 model. Thus, unlike in the BQP query model, DQC1 admits no asymptotic query speedup for total Boolean functions. For symmetric partial Boolean functions, we give a complete characterization of the sensitivity approximate degree in terms of the separation between oppositely labeled Hamming weight layers. This yields a tight quadratic separation between sensitivity approximate degree and standard approximate degree, and also leads to tight quadratic separations between DQC1 and BQP query complexities. We further establish quantitative average-case classical simulation theorems for DQC1 algorithms. Finally, we apply our framework to Fourier analysis, obtaining a simple proof of an $\\Omega(N^{1/4})$ DQC1 query lower bound for the 2-Forrelation problem.", "url": "https://arxiv.org/abs/2611.26231", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Changpeng Shao"}], "featured_authors": [{"name": "Changpeng Shao"}], "author_count": 1}, {"id": "2611.26300", "category": "quant-ph", "title": "A Tensor-Algebraic No-Go Theorem for High-Dimensional Photonic Greenberger--Horne--Zeilinger States Discovered with AlphaProof Nexus", "abstract": "Photonic GHZ states generated with probabilistic pair sources can be described by edge-coloured, complex-weighted graphs. In this representation, conditioning on an event with one photon in every detector turns the output amplitudes into coherent sums over perfect matchings, and generating an \\(N\\)-photon \\(D\\)-dimensional GHZ state is equivalent to constructing a monochromatic quantum graph. Here, we prove that no complex-weighted monochromatic quantum graph exists for any even \\(N\\ge4\\) when \\(D\\ge N\\). The proof, discovered through AI-assisted formal proof search in Lean using AlphaProof Nexus, constructs a weighted sum \\(\\mathcal F\\) of amplitudes whose coefficients factor vertex by vertex. Summing over the colours at one fixed vertex reduces the problem to an \\((N-1)\\times N\\) matrix of effective edge weights. For the graph amplitudes \\(\\omega\\) and GHZ target \\(\\Delta\\), the row--column imbalance yields \\(\\mathcal F(\\omega)=0\\) but \\(\\mathcal F(\\Delta)\\neq0\\), contradicting the required equality \\(\\omega=\\Delta\\). Finally, we give a physical interpretation of the AI-discovered mathematical proof.", "url": "https://arxiv.org/abs/2611.26300", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mario Krenn"}, {"name": "Moritz Firsching"}, {"name": "George Tsoukalas"}, {"name": "Rishikesh Gajjala"}, {"name": "Xuemei Gu"}, {"name": "Swarat Chaudhuri"}], "featured_authors": [{"name": "Mario Krenn"}, {"name": "Moritz Firsching"}, {"name": "George Tsoukalas"}, {"name": "Rishikesh Gajjala"}, {"name": "Xuemei Gu"}, {"name": "Swarat Chaudhuri"}], "author_count": 6}, {"id": "2611.26315", "category": "quant-ph", "title": "All Non-Contextual Pauli Hamiltonians are Free-Fermion in Disguise", "abstract": "Decomposing Hamiltonians into classically tractable fragments is central to quantum simulation. One such way of doing so is the contextual subspace decomposition, which expresses the Hamiltonian with respect to non-contextual sets of Paulis. The conditions for contextuality rely on the anticommutation and commutation of Pauli operators; it is therefore natural to make an explicit connection between non-contextuality and fermionic physics. Theoretical work is centered around two theorems: in the first, we consider non-contextual Pauli Hamiltonians and show that they are free-fermion-disguised. In the second we write these Pauli non-contextual Hamiltonians in terms of Majorana and Dirac fermionic operators, showing that they carry a Jordan--Wigner-like fermion-to-qubit encoding. These two central theorems are formalized in the proof assistant language Lean. We use this to describe the space of fermionic non-contextual Hamiltonians, and highlight their relation to the more general class of free-fermion-disguised Hamiltonians. We further develop a heuristic algorithm to find line-graph based free-fermion fragments and their connected components of molecular Hamiltonians. We benchmark our algorithms against non-contextual searches for encoded molecular Hamiltonians and find comparable performance in identifying free-fermion solvable components. Our work has implications for what fragments to consider as useful for quantum simulation.", "url": "https://arxiv.org/abs/2611.26315", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrew M. Projansky"}, {"name": "Weishi Wang"}, {"name": "Kevin A. Reiss"}, {"name": "James D. Whitfield"}], "featured_authors": [{"name": "Andrew M. Projansky"}, {"name": "Weishi Wang"}, {"name": "Kevin A. Reiss"}, {"name": "James D. Whitfield"}], "author_count": 4}, {"id": "2611.26373", "category": "quant-ph", "title": "Effect of coupling asymmetry on the spontaneous decay and entanglement of two atoms in a common cavity", "abstract": "We investigate the dynamics and the spontaneous decay of two identical two-level atoms into the vacuum in a cavity at low temperature. We analytically derive the survival probability and the amplitudes of the state of the system by calculating the exact self-energy when the atoms are both initially excited. It is found that moderate asymmetry enhances the decay of the survival probability and increases the entanglement production in either lossless and lossy cavities.", "url": "https://arxiv.org/abs/2611.26373", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yamen Hamdouni"}], "featured_authors": [{"name": "Yamen Hamdouni"}], "author_count": 1}, {"id": "2611.26382", "category": "quant-ph", "title": "Efficient Classical Algorithms for Ground Energy Estimation of Fermions with Conjugate-Pair Orbital Interactions", "abstract": "Estimating the ground energy of interacting fermions is central to quantum many-body physics, and recent quantum algorithms provide polynomial-time guarantees for some structured families. Classical approaches commonly rely on quantum Monte Carlo, where the sign problem is a major obstacle. However, even when a nonnegative expansion without sign problem is available, rigorous guarantees for rapid mixing are still far from well understood. In this paper, we give an efficient classical randomized algorithm for approximating the ground energy of fermionic Hamiltonians with conjugate hopping matrices and conjugate-paired orbital interactions, which includes the attractive Hubbard models. This guarantee not only holds without a physical spectral gap or a weak-coupling assumption, but also covers interactions beyond onsite density attractions. Technically, we first reduce ground-energy estimation to partition-function estimation and then use a discretization with controlled energy error to obtain a nonnegative weighted sum of squared determinant moduli and then apply the Chen--Liu log-concave counting theorem. In addition, we obtain a sharper arithmetic bound by controlling how many independent sampling runs and matrix updates are needed, and using sparse matrices to reduce the cost of each update.", "url": "https://arxiv.org/abs/2611.26382", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ziyi Yang"}, {"name": "Yexin Zhang"}, {"name": "Yuexin Su"}, {"name": "Xinzhao Wang"}, {"name": "Xiaoyang Wang"}, {"name": "Tongyang Li"}], "featured_authors": [{"name": "Ziyi Yang"}, {"name": "Yexin Zhang"}, {"name": "Yuexin Su"}, {"name": "Xinzhao Wang"}, {"name": "Xiaoyang Wang"}, {"name": "Tongyang Li"}], "author_count": 6}, {"id": "2611.26395", "category": "quant-ph", "title": "Non-Binary Detector Error Models", "abstract": "A key challenge in fault-tolerant quantum error correction (QEC) is that the syndrome extraction circuits are themselves faulty. Such circuit-level noise is commonly described by a detector error model (DEM). In Stim and in almost all related works, DEMs are binary: every non-binary circuit error (e.g., CNOT gate), is decomposed into independent binary error mechanisms. In this work, we introduce non-binary DEMs, in which each fault location of the syndrome extraction circuit is modeled by one random variable over its original alphabet, e.g., the 16 two-qubit Pauli errors after a CNOT gate. We also propose a split-merge-regroup transformation that builds a compact non-binary DEM from any Clifford circuit by merging the error components that flip the same detectors and observables. Non-binary DEMs represent any Pauli channel exactly, whereas binary DEMs are exact only for channels that factorize into independent binary parts. When the channels factorize, we prove that binary and non-binary DEMs are equivalent under degenerate quantum maximum-a-posteriori (MAP) decoding, but not under quantum MAP decoding. Although the variables are non-binary, belief propagation (BP) still exchanges a single scalar message per edge. Our numerical results with surface, color and bivariate bicycle codes show that non-binary DEMs have two main advantages. First, their Tanner graphs have four to five times fewer edges, which is advantageous for hardware implementations. Second, their performance under BP, with and without OSD post-processing, is better than that of their binary counterparts, and BP with OSD runs up to $9.4\\times$ faster in a CPU.", "url": "https://arxiv.org/abs/2611.26395", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stefano Tinelli"}, {"name": "Francisco Lázaro"}, {"name": "Francisco García Herrero"}], "featured_authors": [{"name": "Stefano Tinelli"}, {"name": "Francisco Lázaro"}, {"name": "Francisco García Herrero"}], "author_count": 3}, {"id": "2611.26430", "category": "quant-ph", "title": "Tunable Ground-State Entanglement in Fully Connected Quantum Systems: From Logarithmic to Volume-Law Scaling", "abstract": "Entanglement scaling is a central probe of the complexity of quantum many-body ground states, yet once geometric locality is absent, it can depend sensitively on the structure and normalization of interactions. For fully connected Hamiltonians with the natural Kac normalization, nondegenerate gapped ground states are known to obey a logarithmic entanglement bound. Here we ask how the ground-state entanglement changes when this interaction normalization is continuously relaxed away from the Kac scale. We answer this question by constructing an explicit all-to-all bipartite Hamiltonian of $n$ qubits with Fourier pairing amplitudes and pairwise interaction strength proportional to $n^{-\\kappa}$. For sufficiently small fixed coupling, we prove that every pure ground state has entanglement entropy $\\Theta(n^{2-2\\kappa} \\log n)$ for $1/2<\\kappa\\leq1$ and $\\Theta(n)$ at $\\kappa=1/2$. We further show that the ground state is unique and separated from the rest of the spectrum by a system-size-independent gap for $3/4 \\leq \\kappa \\leq 1$, while weak-coupling analysis and numerical calculations suggest that the gap remains open also for $1/2 \\leq \\kappa < 3/4$. Thus, varying only the interaction normalization yields a controlled hierarchy from logarithmic scaling at the natural Kac normalization $\\kappa=1$ to increasingly strong subextensive entanglement and ultimately to a volume law, showing that even an arbitrarily weak relaxation of this normalization precludes a universal logarithmic entanglement bound.", "url": "https://arxiv.org/abs/2611.26430", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Donghoon Kim"}, {"name": "Tomotaka Kuwahara"}], "featured_authors": [{"name": "Donghoon Kim"}, {"name": "Tomotaka Kuwahara"}], "author_count": 2}, {"id": "2611.26436", "category": "quant-ph", "title": "When lies look like noise: certifying untrusted entanglement swapping", "abstract": "Entanglement swapping lets quantum repeaters distribute entanglement over long distances, a prerequisite for the quantum internet. We study its security in a noisy network whose intermediate nodes perform the quantum operations faithfully but may misreport the classical outcome that end users rely on. We show that the ideal functionality of entanglement swapping cannot be realised, because it gives the adversary no influence over the delivered state, whereas a node that relabels its report does have such influence. Including honest noise in the ideal setting does not help unless it also concedes a bounded fraction of misreported pairs. We therefore propose a cut-and-choose protocol that tests a random subset of pairs to certify the rest. Since no test can distinguish a misreport from readout noise, the protocol certifies the error above a pre-agreed minimum noise level, which is the misreport rate under our threat model. This yields a quality-of-service guarantee, in which a failure witnesses that the node did not deliver as agreed. Unlike verification schemes that consume the state they certify, the untested pairs remain available for use, with a finite-size guarantee. Certifying a 1% misreport rate on 10^6 pairs costs 10^4 to 1.7x10^5 test pairs, for minimum noise levels ranging from 0 to 5%. The main cost is memory, since 1% requires holding 10^5 to 10^6 pairs at once, far beyond the capacity of today's quantum memories. Verifying and releasing in blocks ties the memory to the block size at the cost of a weaker rate: a (10^4)-qubit memory certifies 14% on 4.7x10^5 delivered pairs.", "url": "https://arxiv.org/abs/2611.26436", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Maria Gragera Garces"}, {"name": "Chris Heunen"}, {"name": "Mahesh K. Marina"}], "featured_authors": [{"name": "Maria Gragera Garces"}, {"name": "Chris Heunen"}, {"name": "Mahesh K. Marina"}], "author_count": 3}, {"id": "2611.26497", "category": "quant-ph", "title": "Optimal Error corrected Hamiltonian estimation with nuisance parameters", "abstract": "Realistic quantum sensing is often affected by both noise and unknown nuisance parameters. Under Markovian dynamics, existing error correction approaches have often sought to suppress nuisance responses alongside environmental noise. Here we show that this local suppression of nuisance parameters is unnecessary and can be overly restrictive: nuisance parameters and Markovian noise impose fundamentally different constraints and require distinct treatments. We establish a general framework for quantum sensing with parameters encoded in a general time dependent Hamiltonian, in the presence of both nuisance parameters and Markovian noise. We derive a necessary and sufficient condition for Heisenberg scaling, determine the exact optimal precision, and construct protocols that attain it. Our results show that to achieve Heisenberg scaling Markovian noise must be suppressed locally by quantum error correction, whereas nuisance parameters need not, and in general should not, be eliminated locally. Instead, optimally designed coherent control can separate their accumulated effects from the target signal over the full sensing evolution. Consequently, Heisenberg scaling can remain attainable even when the target signal is instantaneously aligned with nuisance parameter directions, in sharp contrast to alignment with Markovian noise. This distinction substantially enlarges the regime in which Heisenberg scaling is attainable and provides a general principle for designing robust quantum sensors.", "url": "https://arxiv.org/abs/2611.26497", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhiyao Hu"}, {"name": "Haidong Yuan"}, {"name": "Liang Jiang"}, {"name": "Zain H. Saleem"}], "featured_authors": [{"name": "Zhiyao Hu"}, {"name": "Haidong Yuan"}, {"name": "Liang Jiang"}, {"name": "Zain H. Saleem"}], "author_count": 4}, {"id": "2611.26523", "category": "quant-ph", "title": "Hamiltonian Stabilization of the Two-Photon Dicke Model", "abstract": "Collective two-photon light--matter interactions enable pair amplification but can destroy spectral confinement, preventing a stable thermodynamic bright phase. We show that a positive Kac-scaled number-Kerr interaction renders the two-photon Dicke Hamiltonian of \\(N\\) emitters lower-bounded at all couplings while preserving its generalized \\(\\mathbb Z_4\\) symmetry. We determine the exact zero-temperature thermodynamic energy density with \\(O(N^{-1})\\) finite-size control and obtain the global phase diagram. A bright minimum is born at a saddle-node and exchanges global stability with the normal minimum at coexistence, producing a discontinuous photon-density jump. Symmetry-resolved exact diagonalization through \\(N=128\\) supports the predicted density jump and an exponentially closing same-sector normal--bright tunneling gap. Spectral collapse thus becomes the singular zero-Kerr point of a first-order phase diagram, identifying a Hamiltonian route to stabilizing pair amplification.", "url": "https://arxiv.org/abs/2611.26523", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pradip Laha"}, {"name": "Kingshuk Adhikary"}, {"name": "Subhashish Banerjee"}, {"name": "Peter van Loock"}], "featured_authors": [{"name": "Pradip Laha"}, {"name": "Kingshuk Adhikary"}, {"name": "Subhashish Banerjee"}, {"name": "Peter van Loock"}], "author_count": 4}, {"id": "2611.26537", "category": "quant-ph", "title": "On the design of sequential quantum repeaters with error detection", "abstract": "Long-distance, trust-free quantum communications rely on the development of scalable quantum repeater schemes. Sequential entanglement generation with error detection is a promising approach that combines manageable implementation requirements with a hop-by-hop architecture compatible with existing classical infrastructure. In this paper, we investigate key design choices for such schemes over a repeater chain using quantum key distribution as a benchmark. We find that simple quantum error-detecting codes, such as repetition codes or quantum parity codes, perform well under near-term hardware assumptions and outperform strategies without any encoding. In particular, we show that two-qubit repetition codes may well be all that we need to implement in many practical scenarios. We also examine different architectures for the generation of initial entanglement and assess their merits. Additionally, we show that moderate improvements in some hardware components can partially mitigate the slow technological progress of others.", "url": "https://arxiv.org/abs/2611.26537", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Javier Rey-Domínguez"}, {"name": "Koji Azuma"}, {"name": "Mohsen Razavi"}], "featured_authors": [{"name": "Javier Rey-Domínguez"}, {"name": "Koji Azuma"}, {"name": "Mohsen Razavi"}], "author_count": 3}, {"id": "2611.26542", "category": "quant-ph", "title": "Authenticating quantum key distribution through random position checks", "abstract": "Quantum key distribution (QKD) requires some form of authentication in order for the parties to be sure they are not unknowingly generating a key with an adversary pretending to be one of the honest parties. In this work, we propose a protocol in which the position of one of the parties is used as the authentication credential for key distribution. Our protocol essentially consists of a BB84 QKD protocol with quantum position verification (QPV) rounds randomly interleaved in. The approach is efficient compared with previous approaches, which required running an entire QPV protocol for every bit requiring authentication. We undertake an initial security analysis of the protocol for a restricted set of attacks.", "url": "https://arxiv.org/abs/2611.26542", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Florian J. Curchod"}, {"name": "Erik Woodhead"}, {"name": "Cameron Foreman"}, {"name": "Marcel Mordarski"}, {"name": "Harry Buhrman"}], "featured_authors": [{"name": "Florian J. Curchod"}, {"name": "Erik Woodhead"}, {"name": "Cameron Foreman"}, {"name": "Marcel Mordarski"}, {"name": "Harry Buhrman"}], "author_count": 5}, {"id": "2611.26574", "category": "quant-ph", "title": "Classical Oracle Separation of QMA from the QCMA Hierarchy and Quantum Cryptography Even When P = QCMA", "abstract": "Remark: This work is in submission at STOC'27 and thus the full manuscript has been publicly posted on the conference website since November 3rd, 2026. Inspired by the Codeword-Hash Structure problem recently introduced by Cakan (arXiV, 2026) to separate $\\mathsf{QMA}$ from $\\mathsf{QCIP}$, we introduce a new problem called Codeword-Hash pairs in Noise ($\\mathsf{CHN}$) and prove that, in the query complexity model, it is in $\\mathsf{QMA}$ but hard for the $\\mathsf{QCMA}$ hierarchy $\\mathsf{QCMAH} = \\bigcup_{d\\geq1}\\mathsf{QCMA}^{\\mathsf{QCMA}^{\\cdots^{\\mathsf{QCMA}}}}$, the classical-witness quantum-verifier analogue of $\\mathsf{PH}=\\bigcup_{d\\ge1}\\mathsf{NP}^{\\mathsf{NP}^{\\cdots^{\\mathsf{NP}}}}$. Using this problem, we show that there exists a classical oracle ${O}$ such that $\\mathsf{P}^{O}=\\mathsf{BQP}^{O}=\\mathsf{QCMA}^{O} =\\mathsf{QCMAH}^{O} \\subset \\mathsf{QMA}^{O} \\text{ but } \\mathsf{QMA}^{O}\\not\\subseteq\\mathsf{QCMAH}^{O},$ thus showing that quantum state or quantum proof advantage could exist even if classical computers can efficiently solve any problem that can be quantumly verified with a classical proof. Further, using our problem, we show that various quantum cryptographic primitives can exist even when $\\mathsf{P} = \\mathsf{QCMA}$ and thus neither quantum-computable one-way functions nor (verifiable) quantum computational advantage exist. In particular, relative to a classical oracle ${O}$ with $\\mathsf{P}^{O}=\\mathsf{BQP}^{O}=\\mathsf{QCMA}^{O}=\\mathsf{QCMAH}^{O}$, there exist pseudorandom states with classical keys and public-key encryption with copy-protected quantum decryption keys and classical public keys and ciphertexts, among other primitives, answering an open question of Kretschmer, Qian, and Tal (STOC 2025).", "url": "https://arxiv.org/abs/2611.26574", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alper Cakan"}], "featured_authors": [{"name": "Alper Cakan"}], "author_count": 1}, {"id": "2611.26582", "category": "quant-ph", "title": "End-to-End Quantum Algorithm for Differential Equations: Application to Simulating a Biomolecular System", "abstract": "Quantum algorithms for differential equations have the potential for substantial algorithmic speedups over classical methods. However, they rely on certain assumptions and abstract oracle specifications that leave their practical feasibility and computational advantages for realistic applications unclear. Here we formalize the concept of an end-to-end quantum algorithm for differential equations as one that accepts classical inputs and returns classical outputs, and provide implementations for algorithmic primitives in constructing such algorithms. We present a tailored end-to-end quantum algorithm for the linearized Poisson-Boltzmann (LPB) equation, a partial differential equation (PDE) with variable coefficients widely used in simulating a biomolecular system. We explicitly implement all aspects of the algorithm, from preparing an initial state to generating a quantum solution and estimating properties of the system. In particular, we develop a new discrete representation for variable-coefficient PDEs on a grid that enables efficient implementation of the operator oracle, and build on a recent technique based on optimal wavelet preconditioning to generate a quantum solution with a cost independent of the condition number of the discretized operator. We show the algorithm can be implemented by quantum circuits of size polylogarithmic in both the number of grid points $N_g$ and the inverse of the desired accuracy $\\varepsilon$, with an overall gate cost polylogarithmic in $N_g$ and quasilinear in $1/\\varepsilon$. We also show the classical preprocessing to construct the circuits has polylogarithmic cost in $N_g$ and $1/\\varepsilon$. Our work provides a concrete end-to-end quantum algorithm for a PDE of practical value, demonstrates an exponential improvement in scaling with $N_g$ over classical methods, and provides a foundation for assessing its potential quantum advantage in practice.", "url": "https://arxiv.org/abs/2611.26582", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mohsen Bagherimehrab"}, {"name": "Daniyaal Farooqi"}, {"name": "Gavin K. Brennen"}, {"name": "Barry C. Sanders"}, {"name": "Alán Aspuru-Guzik"}], "featured_authors": [{"name": "Mohsen Bagherimehrab"}, {"name": "Daniyaal Farooqi"}, {"name": "Gavin K. Brennen"}, {"name": "Barry C. Sanders"}, {"name": "Alán Aspuru-Guzik"}], "author_count": 5}, {"id": "2611.26587", "category": "quant-ph", "title": "High-Accuracy Neural-Network Quantum States via Randomized Real-Time Dynamics", "abstract": "Neural-network quantum states (NQSs) exhibit a disparity in converging to the ground state during energy minimization: while the energy converges quadratically with the error in the variational wave function, other observables converge only linearly, which limits the accuracy of physical predictions. Here we show how to close this gap by introducing a new algorithm that improves the accuracy of NQSs. Our method, termed dynamical averaging, estimates expectation values by averaging over a state (or observable) evolved in real-time. Using insights from quantum information, we prove an up-to-quadratic suppression of error in arbitrary ground state observables, thus matching the fast convergence of the energy. Importantly, this improved accuracy requires neither further energy minimization nor increased model complexity, but rather exploits the effect of randomization on quantum states. We demonstrate dynamical averaging on non-integrable spin models, where it accelerates convergence and substantially reduces errors in observables.", "url": "https://arxiv.org/abs/2611.26587", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "John M. Martyn"}, {"name": "Rod Rofougaran"}, {"name": "Samuel Stein"}, {"name": "Di Luo"}], "featured_authors": [{"name": "John M. Martyn"}, {"name": "Rod Rofougaran"}, {"name": "Samuel Stein"}, {"name": "Di Luo"}], "author_count": 4}, {"id": "2611.26605", "category": "quant-ph", "title": "Fast, in-place, and ancilla-free quantum algorithms for integer multiplication and inversion", "abstract": "Arithmetic operations are a fundamental building block in the design of quantum algorithms, with their implementation cost expected to have a significant impact on the viability of a wide variety of quantum applications. In this work, we present novel algorithms for a number of in-place quantum arithmetic operations that are highly efficient in terms of their space and gate count overheads compared to the current state-of-the-art. We show that in-place modular multiplication of integers, modulo a power of two, can be performed with either a classical or quantum odd multiplier using $O(n^{1+\\epsilon})$ gates and no ancilla qubits, for any $\\epsilon >0$. We then show that standard in-place integer multiplication can be performed with a non-zero classical or quantum multiplier using $O(n^{1+\\epsilon})$ gates for any $\\epsilon>0$, with no ancilla qubits required for the classical multiplier and a logarithmic number of ancilla qubits for the quantum. Using our quantum modular multiplication algorithm, we also show that in-place modular inversion, modulo a power of two, can be performed using $O(n^{1+\\epsilon})$ gates and no ancilla qubits, for any $\\epsilon>0$. To our knowledge, these are the first quantum algorithms achieving both subquadratic gate counts and sublinear ancilla counts for each of the considered in-place operations. All but one of these fast operations are optimal in terms of memory, only requiring enough space to store the output of the operation, which overwrites the input directly. We present our multiplication algorithms as consequences of a single unified theorem, which may find further application within quantum arithmetic.", "url": "https://arxiv.org/abs/2611.26605", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "David Halpenny"}, {"name": "Adithya Sireesh"}, {"name": "Petros Wallden"}], "featured_authors": [{"name": "David Halpenny"}, {"name": "Adithya Sireesh"}, {"name": "Petros Wallden"}], "author_count": 3}, {"id": "2611.26606", "category": "quant-ph", "title": "Query-Optimal Quantum Minimum Finding from Numerical Estimators", "abstract": "We propose a quantum minimum-finding algorithm for objectives accessed via numerical estimators that avoids the logarithmic query overhead of amplifying the confidence of estimates before the search. A coherent estimator that is $\\varepsilon$-accurate with probability at least $2/3$ on each of $N$ labels suffices to find a $2\\varepsilon$-optimal label using $O(\\sqrt N)$ base-estimator queries at constant confidence. The query bound and the additive-error constant are separately worst-case optimal. More generally, suppose a preparation assigns probability mass at least a known $p$ to objective values at most $a$. Without knowing $a$ or the prepared distribution, our algorithm returns a candidate and an estimate $v$ such that, jointly with constant probability, $v$ is $\\varepsilon$-accurate for the candidate and $v\\le a+\\varepsilon$. The algorithm uses $O(p^{-1/2})$ queries to each of the preparation and estimator oracles in the worst case, and the selected candidate can be retained as a quantum state. For preparation width $s_P$ and estimator workspace width $w$, it requires $O(s_P+w+\\log\\log(4/p))$ qubits, independently of the requested confidence. Applications give worst-case optimal $\\Theta(\\sqrt N/\\eta)$ queries for selecting an $\\eta$-optimal bounded expectation, and guided ground-energy estimation using $O(\\omega^{-1})$ preparations and $O((\\omega\\eta)^{-1})$ elementary controlled-evolution queries at constant confidence, where $\\omega$ is a lower bound on the guiding state's ground-space amplitude overlap.", "url": "https://arxiv.org/abs/2611.26606", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Egil Bae"}], "featured_authors": [{"name": "Egil Bae"}], "author_count": 1}, {"id": "2611.26626", "category": "quant-ph", "title": "High-temperature Gibbs states are uniformly Markovian and trivial", "abstract": "We prove that, above a constant temperature threshold, Gibbs states of local noncommuting qudit Hamiltonians exhibit exponential decay of mutual information and conditional mutual information (CMI). Specifically, we prove exponential decay of the CMI for arbitrary spatial tripartitions $A \\sqcup B \\sqcup C$ which need not comprise the entire system, thereby establishing a \\textit{uniform Markov property} for high-temperature Gibbs states. A central obstruction to proving such bounds is that conventional cluster expansions for the logarithm of reduced Gibbs states can fail to converge due to noncommutativity. Our main insight is to construct a classical representation of the Gibbs state using an overcomplete basis. Although such representations generally involve negative quasiprobability weights, we show that a decomposition based on projective 2-designs admits a convergent cluster expansion with strictly positive weights at sufficiently high temperatures, allowing us to circumvent the obstruction. The separability of high-temperature Gibbs states is a natural byproduct of this decomposition. Finally, in the context of mixed-state phases of matter, our results imply that high-temperature Gibbs states belong to the same mixed-state phase as the maximally mixed state.", "url": "https://arxiv.org/abs/2611.26626", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrew D. Kim"}, {"name": "Tai Hsuan Yang"}, {"name": "Jong Yeon Lee"}], "featured_authors": [{"name": "Andrew D. Kim"}, {"name": "Tai Hsuan Yang"}, {"name": "Jong Yeon Lee"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
