c estimation methods for tight-binding models, we show that all matrix elements of positive semidefinite operators defined on a lattice can be obtained at once from a single set of filtered random vectors. This eliminates the need for independent simulations previously required for off-diagonal elements, which significantly speeds up the calculation of spatial maps of local currents. Further, we express bond currents in terms of loop currents that obey a discrete Poisson equation, with the current vorticity acting as the source term. Its solution yields a local orbital magnetization. In analogy with the global Středa relation, the derivative of this magnetization with respect to the chemical potential defines a new local Chern marker. Built entirely from bond currents, it requires no position operator and is not bound by the zero-sum rule of projector markers in open samples. Hence, it is free of boundary-compensation artifacts, and its sample average converges to the bulk Chern number in a controlled fashion.", "url": "https://arxiv.org/abs/2611.26599", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Henrique P. Veiga"}, {"name": "Aires Ferreira"}, {"name": "Caio H. Lewenkopf"}, {"name": "João M. Viana Parente Lopes"}], "featured_authors": [{"name": "Henrique P. Veiga"}, {"name": "Aires Ferreira"}, {"name": "Caio H. Lewenkopf"}, {"name": "João M. Viana Parente Lopes"}], "author_count": 4}, {"id": "2611.26604", "category": "cond-mat", "title": "Scalable Simulation of Strongly Correlated Fermions with Neural Gaussian Tensor Networks", "abstract": "Accurate simulations of strongly correlated electrons remain a central challenge in computational physics. We introduce neural-network Gaussian projected entangled-pair states (NN-GPEPS), which exploit the locally-entangled subspace of Gaussian states to give an architecture more compatible with modern neural networks and an exact contraction cost of $O(N^{3/2})$ on two-dimensional lattices. For the Hubbard model at $U/t=8$ and $1/8$ hole doping, we obtain state-of-the-art variational energies in large lattices of up to 1024 sites. These results demonstrate an accurate approach to strongly correlated fermions by connecting neural networks with Gaussian tensor networks.", "url": "https://arxiv.org/abs/2611.26604", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Runze Chi"}, {"name": "Ao Chen"}, {"name": "Garnet Kin-Lic Chan"}], "featured_authors": [{"name": "Runze Chi"}, {"name": "Ao Chen"}, {"name": "Garnet Kin-Lic Chan"}], "author_count": 3}, {"id": "2611.26608", "category": "cond-mat", "title": "Local velocimetry for atomic superfluids: from Riemann rarefaction waves to quantized vortices", "abstract": "We demonstrate local velocimetry for atomic superfluids in two dimensions (2D). Using matter-wave interferometry based on Raman--Bragg beam splitters, we map the local gradient of the phase of the superfluid's wavefunction onto displacement of the interference fringes and reconstruct the 2D velocity field. We illustrate the capabilities of this technique by applying it to two canonical problems. First, we directly observe the self-similar evolution of the velocity field in 1D Riemann rarefaction flows. Second, we map out the full 2D velocity field around quantized vortices, explicitly demonstrating the quantization of velocity circulation.", "url": "https://arxiv.org/abs/2611.26608", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yansheng Zhang"}, {"name": "Yi Jiang"}, {"name": "Feiyang Wang"}, {"name": "Louis Depaepe"}, {"name": "J. Q. Matthew Chia"}, {"name": "Christoph Eigen"}, {"name": "Gehrig Carlse"}, {"name": "Zoran Hadzibabic"}], "featured_authors": [{"name": "Yansheng Zhang"}, {"name": "Yi Jiang"}, {"name": "Feiyang Wang"}, {"name": "Christoph Eigen"}, {"name": "Gehrig Carlse"}, {"name": "Zoran Hadzibabic"}], "author_count": 8}, {"id": "2611.26610", "category": "cond-mat", "title": "Field theory and the biquadratic spin-1 chain", "abstract": "The antiferromagnetic biquadratic spin-1 chain is gapped, $SU(3)$ symmetric, and integrable. Standard arguments suggest that its low-energy physics is described by the $\\mathbb{CP}^2$ nonlinear sigma model at $\\theta=\\pi$. Using the Bethe ansatz, we show that its low-energy excitations can be interpreted as deconfined domain walls, just as in the sigma model. However, the lattice model is integrable, whereas the field theory is generally believed not to be. We propose a solution to this mystery by finding an integrable field theory with the same low-energy limit but which is not Lorentz invariant. The integrability-preserving scaling limit is obtained by adding a higher conserved charge and tuning the chain to criticality. The gap closes quadratically, so that the limit must be described by some nonrelativistic field theory rather than the relativistic sigma model. We describe the two-particle scattering matrix of this field theory.", "url": "https://arxiv.org/abs/2611.26610", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Luisa Eck"}, {"name": "Paul Fendley"}], "featured_authors": [{"name": "Luisa Eck"}, {"name": "Paul Fendley"}], "author_count": 2}, {"id": "2611.26616", "category": "cond-mat", "title": "Fractional Charge at Dislocations from Band-Inversion Cancellation", "abstract": "Band inversions with opposite Chern numbers cancel in the Hall response and yield counterpropagating boundary modes that can gap out. However, a bulk probe of the topology that survives such a cancellation is lacking. We here show that dislocations in inversion-symmetric two-band crystals with cancelling band inversions bind a half-integer charge, which reveals the quantized bulk polarization of the bond-centered obstructed atomic limit realized by such crystals. To demonstrate this, we continuously deform a broad class of two-band lattice models into decoupled chains, without closing the bulk gap or breaking the inversion symmetry, where the dislocation charge follows from a count of occupied bonds. Notably, the fractional part of this charge is insensitive to local perturbations of the dislocation core, and it therefore persists after the in-gap core state is removed, as we show analytically in the chain limit and numerically away from it. In the Weyl-semimetal counterpart, the response to a magnetic flux separates this crystalline charge from the charge set by the Chern number of each momentum slice. We propose that a half-integer core charge that persists after the in-gap peak disappears from the local spectrum can be detected in artificial electronic and optical lattices, with metamaterials providing complementary access to the core modes.", "url": "https://arxiv.org/abs/2611.26616", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vladimir Juričić"}, {"name": "Rodrigo Soto-Garrido"}], "featured_authors": [{"name": "Vladimir Juričić"}, {"name": "Rodrigo Soto-Garrido"}], "author_count": 2}, {"id": "2611.25012", "category": "hep-th", "title": "Coupling of TQFTs to QFTs and SymTFT interfaces from bordisms", "abstract": "M-theory local models may exhibit torsional cycles and other non-trivial topology which interpolate between quantum field theory sectors localized at singularities and the asymptotic regions of the local model. We show that such structures give rise, in standard decoupling limits, to additional topological sectors which can couple non-trivially to the localized QFT. From a symmetry topological field theory (SymTFT) perspective, the physical boundary conditions associated to such local models are modified. We give a construction of SymTFT interfaces from geometric bordisms interpolating between the local singularity and the asymptotic boundary. We apply this construction to the circle compactification of a frozen $D_5$ singularity, identifying a topological interface between the $\\mathbb{Z}_4$ SymTFT of the full theory and the $\\mathbb{Z}_2$ SymTFT of its local $\\mathfrak{su}(2)$ gauge sector. We show that the resulting coupling between the gauge theory and an additional topological quantum field theory accounts for the apparent mismatch between electric and magnetic symmetries of the frozen theory.", "url": "https://arxiv.org/abs/2611.25012", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Max Hübner"}, {"name": "Ling Lin"}, {"name": "Daniel Robbins"}, {"name": "Subham Roy"}], "featured_authors": [{"name": "Max Hübner"}, {"name": "Ling Lin"}, {"name": "Daniel Robbins"}, {"name": "Subham Roy"}], "author_count": 4}, {"id": "2611.25014", "category": "hep-th", "title": "Scherk-Schwarz Compactifications: From Circles to Strings", "abstract": "This review is written with a simple question in mind: what does one need to know to enter the literature on Scherk-Schwarz compactifications? It is organized as a sequence of questions that a graduate student might naturally ask, together with the concepts, calculations, and formal tools needed to work through the literature. The discussion starts at an elementary field-theory level and gradually develops toward more advanced aspects of supergravity, orbifolds, quantum effects, and string theory. Phenomenological applications are deliberately left aside.", "url": "https://arxiv.org/abs/2611.25014", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Karim Benakli"}], "featured_authors": [{"name": "Karim Benakli"}], "author_count": 1}, {"id": "2611.25017", "category": "hep-th", "title": "Quiver-Invariant Triality between Brane Brick Models", "abstract": "We study quiver-invariant triality between 2d (0,2) supersymmetric gauge theories described by brane brick models associated with toric Calabi-Yau 4-folds. The dual theories share the same gauge groups, field content and E-terms but have distinct J-terms. We present an explicit pair of such brane brick models and identify the sequence of triality mutations relating them. This sequence returns the quiver to its original form while transforming the J- and E-terms. We explain the relation between quiver-invariant triality and the orbifold reduction of quiver-invariant brane tilings.", "url": "https://arxiv.org/abs/2611.25017", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dongwook Ghim"}, {"name": "Juno Kwon"}, {"name": "Rak-Kyeong Seong"}], "featured_authors": [{"name": "Dongwook Ghim"}, {"name": "Juno Kwon"}, {"name": "Rak-Kyeong Seong"}], "author_count": 3}, {"id": "2611.25020", "category": "hep-th", "title": "Asymmetric Orbifolds and 4-dimensional $\\mathcal N=4$ String Islands", "abstract": "We formulate heterotic and type II $\\mathbb T^6/\\mathbb Z_n$ asymmetric orbifolds preserving all 16 right-moving supersymmetries and leading to 4-dimensional islands without massless moduli other than the dilaton. We establish the consistency of the orbifold conformal field theory, including the validity of operator interpretation. In the heterotic case we classify all islands based on the $\\Gamma(22,6)$ lattice constructed via the Leech lattice. In the type II case we also provide a classification of allowed $\\Gamma(6,6)$ lattices and orbifold generators. In both cases we further examine whether a particular orbifold admits an archipelago of different islands arising from inequivalent realizations of the orbifold action.", "url": "https://arxiv.org/abs/2611.25020", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gerardo Aldazabal"}, {"name": "Eduardo C. Andrés"}, {"name": "Anamaría Font"}, {"name": "Elisa I. Marieni"}, {"name": "Kumar Narain"}, {"name": "Ida G. Zadeh"}], "featured_authors": [{"name": "Gerardo Aldazabal"}, {"name": "Eduardo C. Andrés"}, {"name": "Anamaría Font"}, {"name": "Elisa I. Marieni"}, {"name": "Kumar Narain"}, {"name": "Ida G. Zadeh"}], "author_count": 6}, {"id": "2611.25021", "category": "hep-th", "title": "Conformal manifolds of $\\mathcal{N}=1$ orbifold theories - Part I: Marginal deformations and the one-loop spectrum", "abstract": "We consider orbifolds of 4d $\\mathcal{N}=4$ super-Yang--Mills theory that preserve minimal supersymmetry and study their conformal manifolds, focusing on two families of Abelian orbifolds in the planar limit. We compute their superconformal indices, construct their complete single-trace BPS spectra and identify the conformal manifolds. These are generically spanned by a subset of the gauge-couplings, whose number we derive from both gauge and string theory, and a universal Leigh--Strassler-type superpotential deformation. We then construct the complete, planar one-loop dilatation operator on these conformal manifolds, giving perturbative access to the full non-BPS spectrum away from the orbifold point. This lays the groundwork for studying special loci of the conformal manifold in a forthcoming Part II.", "url": "https://arxiv.org/abs/2611.25021", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fabio Mantegazza"}, {"name": "Elli Pomoni"}, {"name": "Torben Skrzypek"}], "featured_authors": [{"name": "Fabio Mantegazza"}, {"name": "Elli Pomoni"}, {"name": "Torben Skrzypek"}], "author_count": 3}, {"id": "2611.25022", "category": "hep-th", "title": "Stringy Corrections from Gravity: Predictions for BFSS and ABJM", "abstract": "Despite enormous progress in string theory, the leading stringy corrections to many holographic observables remain unknown. String/M-theory dualities nonetheless allow them to be determined from gravity alone. From the winding modes of one-loop 11d supergravity on a circle, we derive the leading tree-level stringy terms in the type IIA effective action for the metric, dilaton, and Ramond--Ramond one-form, in closed form as a finite supertrace over Lorentz generators. On the thermal D0-brane geometry, this gives the first correction to the low-temperature thermodynamics of the BFSS matrix model. Its coefficient differs from published lattice Monte Carlo estimates by $\\approx 20\\%$. With the four-form flux included, the same method reproduces the $\\zeta(3)k^{2}$ term of the ABJM free energy on the three-sphere obtained by localization.", "url": "https://arxiv.org/abs/2611.25022", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Aidan Herderschee"}, {"name": "Victor Ivo"}, {"name": "Henry W. Lin"}, {"name": "Yifan Wang"}], "featured_authors": [{"name": "Aidan Herderschee"}, {"name": "Victor Ivo"}, {"name": "Henry W. Lin"}, {"name": "Yifan Wang"}], "author_count": 4}, {"id": "2611.25026", "category": "hep-th", "title": "Actionless Branes on Axion Wormholes", "abstract": "Can a Euclidean axion wormhole extend to infinity with every instanton still suppressed? The imaginary distance bound says it cannot: some instanton must become actionless first. Calabi-Yau compactifications appear to violate the bound: several axions share the field excursion, and the instantons charged under any one of them stay suppressed all the way. We show that the wormhole can hide from these instantons but not from their bound states: misaligned central charges make a bound state cheaper than its constituents, while the axions act on every constituent. On the type IIB wormhole supported by two axions of the Neveu-Schwarz two-form, a fivebrane carrying string charge becomes actionless at large volume within two thirds of the way to infinity, for either relative sign of the axions and however they share the excursion. In S-dual variables it is a D5-brane with magnetic flux for one sign and a D5-NS5 bound state for the other. Adding more axions does not help: the same branes become actionless on every Calabi-Yau threefold, because what counts is the degree of homogeneity of the saxion sector, not the number of axions. These bound states are what the convex-hull axion weak gravity conjecture requires.", "url": "https://arxiv.org/abs/2611.25026", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. Ramesh Chandra"}], "featured_authors": [{"name": "A. Ramesh Chandra"}], "author_count": 1}, {"id": "2611.25032", "category": "hep-th", "title": "Twist and Shout: defect lines on the Rényi torus", "abstract": "We consider what the entanglement between two regions of a critical system can reveal about its symmetries, including non-invertible ones. For two intervals in a two-dimensional conformal field theory, the second Rényi entropy is a partition function on a torus, and a topological defect line can be wrapped around one of the intervals. For an on-site symmetry this computes the overlap of the reduced density matrix with its image under the symmetry acting on one interval, and in general it defines an observable that depends only on the cross-ratio. As the intervals approach each other, the observable vanishes at a rate set by the lightest operator on which the line can end, and its monodromy is fixed by the spins of such operators. Since these spins are constrained by the fusion category, the observable detects 't Hooft anomalies and distinguishes categories with the same fusion rules. It can be computed in closed form for a $\\mathbb{Z}_2$, a $\\mathbb{Z}_3$ and a Fibonacci line of the $(E_8)_1$ theory, and for the spin-flip and Kramers-Wannier lines of the Ising model, where the spin-flip result agrees with an exact computation in the critical Ising chain. Averaged over a symmetry, the observable reduces to a known Jones-index bound on the mutual information. We also show that the associated twist-field crossing equations are a form of the modular bootstrap, and discuss whether the full fusion category can be recovered from entanglement on surfaces of higher genus.", "url": "https://arxiv.org/abs/2611.25032", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Naveen Balaji Umasankar"}], "featured_authors": [{"name": "Naveen Balaji Umasankar"}], "author_count": 1}, {"id": "2611.25045", "category": "hep-th", "title": "Entanglement entropy from fundamental strings", "abstract": "In previous work, we derived the local entropy capacity from off-shell string theory and combined it with the gravitational replica construction and flow-cut duality to normalize the entropy flow carried by physical fundamental strings. In this paper, we apply this framework to interval entanglement in holographic CFT$_2$. We construct explicit on-shell F1 worldsheets in the AdS$_3$ vacuum and planar BTZ, derive their Kalb-Ramond source currents, and show that the normalized spatial currents saturate the corresponding RT surface. Their flux reproduces both the vacuum single interval entropy and the finite temperature CFT$_2$ result. We then vary the NS-NS flux fraction. Although the total maximal flux remains unchanged, the F1 equations continuously redistribute the strings among different parts of the complement. In planar BTZ, the resulting signed flux through the bifurcation line reproduces the extensive thermal entropy and can vanish in the pure NS-NS limit without changing the interval entropy. Thus the on-shell string dynamics additionally determines its physical routing and boundary contact structure.", "url": "https://arxiv.org/abs/2611.25045", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Houwen Wu"}, {"name": "Shuxuan Ying"}], "featured_authors": [{"name": "Houwen Wu"}, {"name": "Shuxuan Ying"}], "author_count": 2}, {"id": "2611.25055", "category": "hep-th", "title": "$C_T$ and $C_J$ of general scalar--fermion conformal field theories in $d=4-ε$", "abstract": "We compute $C_T$ and $C_J$, the coefficients of the stress-tensor and conserved-current two-point functions, to order $\\epsilon^3$ at any fixed point of the general renormalizable theory of scalars and fermions in $d=4-\\epsilon$. We give explicit results for the chiral Ising, XY and Heisenberg models and for fixed points with emergent supersymmetry in $d=3$. In theories without a four-dimensional counterpart, fermion loops with an odd number of Yukawa vertices contribute at order $\\epsilon^3$ through traces whose continuation away from $d=3$ is ambiguous; we fix it with $\\mathcal N=1$ supersymmetry, by computing the two-point functions of the supercurrent and of the fermionic partner of a flavor current to four loops. In $d=3$, Padé approximants closely reproduce the exact $C_T$ of the $\\mathcal N=2$ super-Ising model. We estimate the universal conductivity at the charge-density-wave, Kekulé and Néel transitions of graphene to be $\\sigma/\\sigma_{\\rm free}\\approx0.91$, $0.79$--$0.83$ and $0.64$--$0.74$, and show that the exact conductivity at the supersymmetric transition on the surface of a topological insulator is $\\sigma/\\sigma_{\\rm free}=\\frac{9}{10}\\,C_T/C_{T,\\rm free}\\approx0.654$, $10\\%$ below the value previously reported.", "url": "https://arxiv.org/abs/2611.25055", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shiroman Prakash"}, {"name": "Shubham Kumar Sinha"}], "featured_authors": [{"name": "Shiroman Prakash"}, {"name": "Shubham Kumar Sinha"}], "author_count": 2}, {"id": "2611.25059", "category": "hep-th", "title": "Nonzero cubic Love numbers of Schwarzschild black holes", "abstract": "Static Love numbers of Schwarzschild black holes vanish at linear and quadratic order in General Relativity, while generic nonlinear tides remain less understood. We solve a specific non-axisymmetric octupolar tide at cubic order and, building on the symmetry of static General Relativity exploited by Parra-Martinez and Podo, match the result to a worldline effective field theory (EFT) using dimensional regularization. Surprisingly, we find a Love number that neither vanishes nor runs.", "url": "https://arxiv.org/abs/2611.25059", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bruno Bucciotti"}], "featured_authors": [{"name": "Bruno Bucciotti"}], "author_count": 1}, {"id": "2611.25090", "category": "hep-th", "title": "Soft Factorisation of WQFT and the Spinning 4PM Magnusian", "abstract": "We derive the soft divergences of $\\hat{N}=-i\\log\\hat{S}$ in the Worldline Quantum Field Theory (WQFT) formalism, focusing on poles due to single massive-massive (Coulomb) and massive-massless (tail) graviton exchanges. Our derivation is inspired by the Faddeev-Kulish procedure, switching the interaction picture to one with an infrared-finite $\\hat{N}$-matrix. Soft divergences emerging from the worldline are correlators of Wilson lines. As confirmation of this structure, we demonstrate explicitly how divergences of inclusive observables including the momentum impulse $\\Delta p_i^\\mu$ and spin kick $\\Delta S_i^\\mu$ cancel, and we reproduce the infrared divergence of the one-loop scattering waveform. Using the Magnus series representation of $\\hat{N}$ and Murua coefficients, we then calculate the Magnusian $N=\\langle0|\\hat{N}|0\\rangle$ at fourth post-Minkowskian (4PM) order, including linear-in-spin corrections. For aligned spins, $-\\partial N/\\partial L$ reproduces the full scattering angle through 3PM order; at 4PM order, $N$ develops a soft divergence as predicted by our soft factorisation. Using the Feynman $i0^+$ prescription, we also derive an infrared-finite 4PM Magnusian which compactly encodes existing results for the conservative momentum impulse and spin kick via nested iterations of Poisson brackets.", "url": "https://arxiv.org/abs/2611.25090", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Riccardo Gonzo"}, {"name": "Gustav Mogull"}, {"name": "Benjamin Sauer"}], "featured_authors": [{"name": "Riccardo Gonzo"}, {"name": "Gustav Mogull"}, {"name": "Benjamin Sauer"}], "author_count": 3}, {"id": "2611.25101", "category": "hep-th", "title": "Calabi-Yau linear models with abelian bundles", "abstract": "We introduce a construction of (0,2) gauged linear sigma models whose large radius phases realize Calabi-Yau sigma models with line bundles. We study a family of such models admitting Landau-Ginzburg orbifold phases, described as asymmetric orbifolds of (2,2) Gepner models and free left-moving fermions. These orbifolds extend the Gepner construction to a broader class of (0,2) SCFTs, and reveal unexpected features, including the emergence of free fermions in twisted sectors and substantial enhancements of the left-moving current algebra. The gauged linear sigma model connects the Calabi-Yau geometry to these rational points, where the volume modulus becomes charged under the enhanced gauge symmetry and freezes at the string scale.", "url": "https://arxiv.org/abs/2611.25101", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yann Proto"}], "featured_authors": [{"name": "Yann Proto"}], "author_count": 1}, {"id": "2611.25103", "category": "hep-th", "title": "From Instantons to AdS Boundaries: Tracing the Geometric Path from Quantum Anomalies to Massive Gravity", "abstract": "This thesis studies how boundary data enter two gravitational observables: the Dirac index on gravitational instantons and conserved charges in three-dimensional New Massive Gravity. In Einstein gravity coupled to ModMax electrodynamics, we compute the index of charged Dirac fermions on Taub-NUT and Eguchi-Hanson instantons using the Atiyah-Patodi-Singer theorem, which includes the spectral asymmetry of the boundary Dirac operator. The Taub-NUT index agrees with the Maxwell result. For Eguchi-Hanson, the gauge-field contribution to the axial anomaly depends explicitly on the ModMax parameter when expressed in terms of the solution parameters. For asymptotically anti-de Sitter solutions of New Massive Gravity with Brown-Henneaux boundary conditions, a term linear in the extrinsic curvature reproduces the holographic stress tensor of the auxiliary-field formulation. At the degenerate point, relaxed boundary conditions admit an additional constrained Fefferman-Graham coefficient. A quadratic extrinsic counterterm cancels the residual power divergence. We derive the boundary Ward identity and show that the holographic and Noether-Wald charges agree for the solutions studied.", "url": "https://arxiv.org/abs/2611.25103", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Leonardo Sanhueza"}], "featured_authors": [{"name": "Leonardo Sanhueza"}], "author_count": 1}, {"id": "2611.25240", "category": "hep-th", "title": "Holographic Duals of $SL^{(q)}(2, \\mathbb{R})$ Deformed CFTs", "abstract": "We study the holographic bulk dual of 2D CFTs evolved by $sl^{(q)}(2,R)$-deformed Hamiltonians. Working in the Hamiltonian-adapted frame, in which the $sl^{(q)}(2,R)$-deformed effective Floquet Hamiltonian generates time translations, we construct the dual Bañados geometries for the three distinct classes of dynamics: the heating phase, the non-heating phase and the phase boundary. Specifically, we show that in the heating phase, the bulk patch dual to the region between two neighbouring fixed points has a time-dependent causal horizon and asymptotes to a static AdS Rindler geometry at late times, while the non-heating phase has no horizon. We discuss how the late-time behaviour of the entanglement entropy, particularly its linear growth in the heating phase, can be understood from the bulk in two different ways: in global AdS, from the portion of the geodesic behind the horizons, and in a quotient description, from an effective shockwave produced by a boosted conical defect. Finally, for ($q=1$), we complete the holographic analysis of Ref. [1] by reproducing the exact CFT expression of the OTOC from the bulk and explaining why it exhibits an exponential growth {\\it only} when the operators lie on the side of the two fixed points.", "url": "https://arxiv.org/abs/2611.25240", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Somnath Porey"}, {"name": "Baishali Roy"}, {"name": "Rahul Roy"}, {"name": "Bobby Ezhuthachan"}], "featured_authors": [{"name": "Somnath Porey"}, {"name": "Baishali Roy"}, {"name": "Rahul Roy"}, {"name": "Bobby Ezhuthachan"}], "author_count": 4}, {"id": "2611.25473", "category": "hep-th", "title": "Upper Bounds on the Radion Mass in a Warped Extra Dimension", "abstract": "We study absolute upper bounds on the mass ratio $R_{11}=m_{r_1}/m_{h_1}$ between the radion ($r_1$) and graviton ($h_1$) lightest modes in five dimensional warped models. We consider warped models with an admissible singular behavior in the infrared: i.e.~models with power-like ($\\sim \\bar\\phi^{2n}$) and with exponential ($\\sim e^{2\\nu\\bar\\phi}$) bulk potentials, where $\\bar\\phi$ is the stabilizing bulk field. We find a correlation between $R_{11}$ and the singular behavior of the Ricci scalar, which allows to establish an absolute upper bound on the former. For the power-like models, the maximum value of $R_{11}$ increases with $n$. In the limit $n\\to\\infty$, the power-like model reproduces the exponential model and reaches the same upper bound as the latter. For the exponential model, we derive analytically the bound $R_{11}<1$, with the largest value approached for the case $\\nu\\to 1^+$ (where $\\nu=1$ corresponds to the linear dilaton model) and consistent with unitarity sum rules. For exponential models we also obtain the absolute upper bound on the second radion mode ratio $R_{21}=m_{r_2}/m_{h_1}\\lesssim 1.374$. This value is reached for $\\nu=2$ when the IR brane approaches the singularity. For this configuration, we verify that the scalar contribution satisfies the unitarity sum rule when the complete radion Kaluza-Klein tower is included.", "url": "https://arxiv.org/abs/2611.25473", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Leandro Da Rold"}, {"name": "Eugenio Megias"}, {"name": "Mariano Quiros"}, {"name": "Lindber Salas"}], "featured_authors": [{"name": "Leandro Da Rold"}, {"name": "Eugenio Megias"}, {"name": "Mariano Quiros"}, {"name": "Lindber Salas"}], "author_count": 4}, {"id": "2611.25507", "category": "hep-th", "title": "Pairwise fermionic mode correlations in electric and magnetic backgrounds: Landau-level structure and Schwinger production", "abstract": "We investigate mutual information and logarithmic negativity in fermionic Schwinger pair production in parallel electric and magnetic fields. Using spin-dependent Bogoliubov transformations, we construct the in-vacuum and derive the particle--antiparticle correlations for selected Landau modes. We also consider an initially entangled two-particle state and evaluate the correlations for six bipartitions. The physical Landau-level structure is treated explicitly by distinguishing modes with the same oscillator index from the spin representatives of a common physical Landau level. For matched higher levels, the pairwise redistribution relations retain the electric-only form, with the magnetic-field dependence entering through the Landau-level pair-production probabilities. When the two particle groups occupy different physical levels, the cross particle--antiparticle correlations become unequal, and we derive analytic relations characterizing this asymmetry. We further obtain the local logarithmic negativity from the ordinary partial transpose in a fixed occupation-space basis. Finally, we extend the analysis to a Sauter-type electric field in a constant magnetic background and examine the dependence of the pairwise correlations on the field parameters and Landau-level structure.", "url": "https://arxiv.org/abs/2611.25507", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sahil Chetan Patnekar"}, {"name": "Sristi Sanjivanee Goswami"}, {"name": "Sanjay Pant"}, {"name": "Shagun Kaushal"}], "featured_authors": [{"name": "Sahil Chetan Patnekar"}, {"name": "Sristi Sanjivanee Goswami"}, {"name": "Sanjay Pant"}, {"name": "Shagun Kaushal"}], "author_count": 4}, {"id": "2611.25576", "category": "hep-th", "title": "From Integrability to Chaos in Tensionless AdS3 String Theory", "abstract": "We study quantum-gravitational corrections to the planar integrable structure of the symmetric product orbifold $\\text{Sym}^N(\\mathbb{T}^4)$ that is dual to tensionless string theory on AdS$_3\\times$S$^3\\times \\mathbb{T}^4$. We consider the deformation that switches on R-R flux in the bulk, and analyze the associated level spacing statistics. The leading non-planar corrections lift the planar degeneracies and produce signs of random-matrix behavior. Our results provide a controlled example of string interactions driving the onset of quantum chaos.", "url": "https://arxiv.org/abs/2611.25576", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthias R. Gaberdiel"}, {"name": "Beat Nairz"}, {"name": "Cheng Peng"}], "featured_authors": [{"name": "Matthias R. Gaberdiel"}, {"name": "Beat Nairz"}, {"name": "Cheng Peng"}], "author_count": 3}, {"id": "2611.25591", "category": "hep-th", "title": "A full-color four-point form factor", "abstract": "We determine the symbol and complete functions of the full-color two-loop four-point maximally helicity violating stress-tensor form factor in $\\mathcal N=4$ super Yang-Mills theory, including $N^1$ double traces and $N^0$ single traces. Numerical unitarity and a master-integral bootstrap fix the result. A direct form-factor bootstrap reproduces the symbol. Permuting external legs in the planar 88-letter alphabet yields all 79 letters, while the $N^0$ terms contain four new nonclassical contributions. We also obtain the complete $N^0$ two-loop triple-collinear hard splitting functions.", "url": "https://arxiv.org/abs/2611.25591", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Song He"}, {"name": "Xuhang Jiang"}], "featured_authors": [{"name": "Song He"}, {"name": "Xuhang Jiang"}], "author_count": 2}, {"id": "2611.25634", "category": "hep-th", "title": "Two Faces of Spacetime Density Matrices: Entanglement and Complexity", "abstract": "We establish a direct connection between entanglement and complexity through spacetime density matrices. For stationary pure states and complementary regions at different times, spacetime replica moments encode the return amplitude of a replica-defect quench. This representation defines an associated state spread complexity, which we call Krylov-Rényi complexity. It can equivalently be obtained by using a replica-defect excitation of the replicated background state as the seed and evolving it under the original replicated Hamiltonian. We further construct Krylov-von Neumann complexity as a probe limit from first-order replica data. Timelike entanglement and complexity provide complementary information at a fixed time, while the full time dependence of the timelike entropy determines the Krylov dynamics and hence the complexity. The replica construction fixes the seed and its evolution through the background state, subsystem geometry, and regulator, without an independently chosen probe operator. Like entanglement entropy, the resulting complexity is defined nonperturbatively and probes universal properties and dynamical information about the underlying theory.", "url": "https://arxiv.org/abs/2611.25634", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wu-zhong Guo"}], "featured_authors": [{"name": "Wu-zhong Guo"}], "author_count": 1}, {"id": "2611.25749", "category": "hep-th", "title": "Second-order formulation of chiral fermions with a local boundary condition", "abstract": "Chiral fermions in $d$ dimensions arise naturally as boundary modes of a massive fermion in $d+1$ dimensions subject to a local boundary condition. When anomalies are absent, this construction can be used to define an intrinsically $d$-dimensional theory of chiral fermions. However, defining the path integral using the first-order Dirac operator with this boundary condition is technically inconvenient, even in the continuum. We present a formulation in terms of second-order differential operators that is completely equivalent to the original formulation in the continuum. Its natural lattice discretization generates Wilson's term and avoids fermion doubling. Our lattice formulation closely resembles the boundary-fermion construction of Shamir, and provides some insight into the case of a general Wilson parameter.", "url": "https://arxiv.org/abs/2611.25749", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kazuya Yonekura"}], "featured_authors": [{"name": "Kazuya Yonekura"}], "author_count": 1}, {"id": "2611.25993", "category": "hep-th", "title": "Holographic Tessellations Tensor Networks $\\{p,q\\}$ from Entangled Quantum Tetrahedron in Loop Quantum Gravity", "abstract": "The relationship between spin network states in loop quantum gravity and bulk--boundary duality is further explored using the tessellated holographic tensor network. We develop a holographic tensor network construction based on quantum entanglement between tetrahedra in loop quantum gravity (LQG). This construction relates four-valent intertwiner spaces and Bell states dressed with $SU(2)$ holonomies to effective tensors on hyperbolic $\\{p,q\\}$ tessellations. For the $\\{5,4\\}$ tessellation, six tetrahedra are assembled into a single effective cell with five network legs and one logical index. Provided that the microscopic transfer map has full row rank, a right inverse and a completion on the kernel space are employed to construct an isometric embedding, yielding an effective tensor proportional to a perfect tensor. The construction is generalized to the $p=2n-1$ family, with local dimensions supporting absolutely maximally entangled states. On finite networks satisfying a radial orientation condition, an appropriate normalization produces an isometric bulk--boundary map. For cuts satisfying the isometry condition on both sides, the boundary entropy decomposes into a link contribution $\\sum_{\\ell}\\log(2j_{\\ell}+1)$ and the bulk entropy, thereby providing a discrete realization of the quantum Ryu--Takayanagi structure. Applications to the black hole interior are formulated via postselection-based non-isometric encoding. Assuming additional Haar statistics, this framework is used to analyze the preservation of overlaps on average and the competition between entropy branches underlying the Page Curve. These results establish a constructive link between the geometric degrees of freedom of LQG and holographic codes, while clarifying the conditions required to connect them to geometric area in LQG, the location of the quantum extremal surface, and evaporation of black hole.", "url": "https://arxiv.org/abs/2611.25993", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Deden M. Akbar"}, {"name": "Freddy P. Zen"}, {"name": "Jusak S. Kosasih"}], "featured_authors": [{"name": "Deden M. Akbar"}, {"name": "Freddy P. Zen"}, {"name": "Jusak S. Kosasih"}], "author_count": 3}, {"id": "2611.26013", "category": "hep-th", "title": "Worldsheet Effective Theory of Abelian-Higgs Cosmic Strings beyond Nambu--Goto", "abstract": "Cosmic strings can support long-lived excitations confined to their cores, opening channels for energy exchange with the transverse Goldstone modes that describe the string's motion. We derive a covariant worldsheet theory of their coupled dynamics directly from the Abelian-Higgs model at critical coupling, with all interaction coefficients fixed by the microscopic theory. The resulting action, which we validate against numerical lattice field theory simulations, extends the Nambu--Goto description to include a massive scalar shape mode and a massive vector mode. Dualizing the vector reveals a geometric distinction: the shape scalar mode couples to intrinsic worldsheet curvature, while the pseudoscalar couples to normal bundle curvature. These interactions explain the distinct parametric instabilities observed in lattice simulations and predict how the relative polarization of colliding transverse waves controls the excitation of the two internal modes. Our results connect microscopic string structure to the nonlinear worldsheet dynamics, providing a predictive framework for cosmic strings beyond the Nambu--Goto approximation.", "url": "https://arxiv.org/abs/2611.26013", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sergio Alameda-Calvo"}, {"name": "Josu C. Aurrekoetxea"}, {"name": "Jose J. Blanco-Pillado"}, {"name": "Alberto García Martín-Caro"}, {"name": "J.M. Queiruga"}], "featured_authors": [{"name": "Sergio Alameda-Calvo"}, {"name": "Josu C. Aurrekoetxea"}, {"name": "Jose J. Blanco-Pillado"}, {"name": "Alberto García Martín-Caro"}, {"name": "J.M. Queiruga"}], "author_count": 5}, {"id": "2611.26087", "category": "hep-th", "title": "Equilibrium relativistic spin magnetohydrodynamics from chiral kinetic theory", "abstract": "We develop a microscopic and thermodynamically consistent framework for relativistic equilibrium spin magnetohydrodynamics of massless chiral fermions, directly from first-order chiral kinetic theory. Starting from the covariant Wigner function, we recast the chiral kinetic equation as a pure streaming equation on a magnetically shifted mass shell, incorporating both the magnetic-moment energy and the Berry-curvature phase-space measure. This formulation yields a kinetic $H$-theorem and an entropy current with vanishing divergence in global equilibrium. We construct the equilibrium distribution for an arbitrary spin frame and derive the associated currents, energy--momentum tensor, spin tensor, entropy current, and frame-independent spin polarization, including the magnetic splitting between particles and antiparticles. Thermodynamic consistency further determines the second-order magnetovortical responses, revealing a relativistic Barnett magnetization, a temperature- and chemical-potential-independent anomalous charge density, and rotation-induced density corrections that reproduce exact field-theory results. Our framework provides a unified microscopic foundation for relativistic equilibrium spin magnetohydrodynamics and establishes a direct link between quantum kinetic theory, spin polarization, magnetization, and anomalous transport.", "url": "https://arxiv.org/abs/2611.26087", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gopal Mistry"}, {"name": "Amaresh Jaiswal"}], "featured_authors": [{"name": "Gopal Mistry"}, {"name": "Amaresh Jaiswal"}], "author_count": 2}, {"id": "2611.26170", "category": "hep-th", "title": "Cardinal RG=GR: Phase-Space Cardinality and the Cosmological Constant and Hierarchy Problems", "abstract": "The effective field theory approach constructs the low-energy theory by integrating out fluctuations above an ultraviolet scale which raises the cosmological constant and hierarchy problems. We investigate an alternative prescription in which the quantum theory is restricted to a finite accessible region of phase space, characterized by a dimensionless cardinality $\\mathcal N$, rather than by independently prescribed spacetime and momentum scales. At fixed cardinality these scales are related. For Euclidean de Sitter space, the stationarity condition for the gravitational action can then be written as a stationarity condition with respect to the momentum scale, a relation which we call Cardinal RG=GR. We demonstrate the relation between $\\mathcal N$ and the Gibbons-Hawking entropy of de Sitter space, compute the cosmological constant proportional to ${1}/{\\sqrt{\\mathcal N}}$, show that it is radiatively stable and apply the same prescription to demonstrate the radiative stability of the mass parameter for a simple interacting scalar field model, thereby illuminating the resolution of the hierarchy problem. We also establish a precise limit, involving gravitational data, in which the conventional results of Quantum Field Theory and the Renormalization Group are recovered.", "url": "https://arxiv.org/abs/2611.26170", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Laurent Freidel"}, {"name": "Jerzy Kowalski-Glikman"}, {"name": "Robert G. Leigh"}, {"name": "Djordje Minic"}], "featured_authors": [{"name": "Laurent Freidel"}, {"name": "Jerzy Kowalski-Glikman"}, {"name": "Robert G. Leigh"}, {"name": "Djordje Minic"}], "author_count": 4}, {"id": "2611.26194", "category": "hep-th", "title": "Full-Color Two-loop Four-point Form Factor in N=4 SYM with Global CK-duality", "abstract": "We determine the full-color two-loop four-point MHV form factor of the stress-tensor supermultiplet in N=4 super-Yang-Mills theory. Using color-kinematics (CK) duality and unitarity cuts, we construct complete one- and two-loop integrands manifesting global off-shell CK duality without explicit $\\mu^2$ dependence. Integration-by-parts reduction to uniform-transcendentality master integrals yields purely rational numbers multiplying simple kinematic prefactors, manifesting maximal transcendentality. Expressing the form factor in terms of pentagon functions, we verify full-color infrared-pole cancellation, extract the finite remainder, and obtain new non-planar results for the two-loop triple-collinear splitting function and double-soft current.", "url": "https://arxiv.org/abs/2611.26194", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhiming Cai"}, {"name": "Yuanhong Guo"}, {"name": "Gang Yang"}], "featured_authors": [{"name": "Zhiming Cai"}, {"name": "Yuanhong Guo"}, {"name": "Gang Yang"}], "author_count": 3}, {"id": "2611.26278", "category": "hep-th", "title": "Exact Spherical Branes and Deformations: BMN, IKKT and $\\mathcal{N}=2^\\ast$", "abstract": "We present a unified analytic solution to the BPS equations of spherical Dp-branes for $1\\leq p \\leq 5$ and give the corresponding type II uplifts in closed form. These are holographically dual to maximally supersymmetric Yang-Mills theory on $S^{p+1}$. The change of variables that makes the BPS equations integrable also allows us to analytically calculate a universal result for the holographic Wilson loop and obtain UV asymptotic behaviour previously determined numerically. The same change of variables extends naturally, with suitable modifications, to the cases $p=0$ and $p=-1$. We obtain a 1-parameter family of D0-brane solutions and show how the IR conditions lead to a singular limit of the integration constant. We also solve the D(-1)-brane BPS equations and show the resulting Euclidean uplift fails regularity conditions. Separately, we obtain an explicit representation of the one-ball electrostatic solution of polarised IKKT, which lets us express multipole moments and holographic observables using elliptic invariants. Finally, we analytically solve the BPS equations of the holographic dual of $\\mathcal{N}=2^\\ast$ supersymmetric Yang-Mills theory on $S^4$, present the corresponding type IIB uplift and calculate the holographic Wilson loop.", "url": "https://arxiv.org/abs/2611.26278", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Cameron Gibson"}], "featured_authors": [{"name": "Cameron Gibson"}], "author_count": 1}, {"id": "2611.26279", "category": "hep-th", "title": "All-Order Linearized Hydrodynamics of Charged Holographic Plasmas", "abstract": "We investigate linearized all-order transport in a finite-density holographic plasma described by five-dimensional Einstein-Maxwell-Chern-Simons theory. By retaining the full frequency- and momentum-dependence of the fluid/gravity equations, we determine generalized shear, diffusion, higher-gradient, and chiral-vortical transport functions together with their real-time memory kernels. The different channels exhibit a clear hierarchy of temporal response: the leading shear and diffusion sectors respond promptly, whereas the higher-gradient sectors develop only after a finite buildup time. Remarkably, the chiral-vortical response also shows a finite buildup time despite entering at first order in the hydrodynamic derivative expansion, demonstrating that derivative order does not by itself determine the temporal organization of transport. Toward the near-extremal regime, long-time memory becomes increasingly persistent across several channels. These results reveal how finite density reshapes nonlocal transport and relaxation in strongly coupled holographic plasmas.", "url": "https://arxiv.org/abs/2611.26279", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Karthik R."}, {"name": "Shamant Shreedhar Dixit"}, {"name": "K. M. Ajith"}, {"name": "Kartheek Hegde"}, {"name": "Shreyas Punacha"}, {"name": "A. Naveena Kumara"}], "featured_authors": [{"name": "Karthik R."}, {"name": "Shamant Shreedhar Dixit"}, {"name": "K. M. Ajith"}, {"name": "Kartheek Hegde"}, {"name": "Shreyas Punacha"}, {"name": "A. Naveena Kumara"}], "author_count": 6}, {"id": "2611.26285", "category": "hep-th", "title": "Dynamical Temperley-Lieb algebras from Quiver CFTs", "abstract": "The one-loop dilatation operator of a superconformal planar gauge theory can be written as a sum of local generators. The algebra these generators satisfy is a powerful organising principle for the spectrum. For SU(2)-like bosonic subsectors we show that this algebra can be read off directly from Feynman diagrams, which we identify as a natural graphical language for it. For N=4 super Yang-Mills this simply reproduces the Temperley-Lieb (TL) algebra of the XXX spin chain. After orbifolding and marginally deforming to N=2 superconformal quiver theories, the same recipe yields dynamical generalisations of the TL algebra. In these theories, the faces of the diagrams are coloured according to the quiver nodes, and separated by domain walls corresponding to bifundamental fields. There are two inequivalent SU(2)-like subsectors, which lead to two different TL algebras. One sector is built from the two bifundamental scalars and (in the simplest case) gives a dynamical TL algebra with a colour-dependent loop fugacity in its quadratic relation. The other sector is built from one bifundamental and one adjoint scalar, and (always) gives a novel algebra, in which the cubic TL relation becomes dynamical. In this latter case, we show that each generator of this new algebra is related to a standard XXZ TL generator by a colour-dependent twist. This twist is local and not an algebra homomorphism, and can be written as a dynamical Drinfeld twist. In both sectors, the TL structure provides a natural graphical approach to the spectral problem, as well as clarifying the structure of the irreducible representations of these chains. Finally, we give a preliminary description of the loop models associated to these algebras.", "url": "https://arxiv.org/abs/2611.26285", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rob Klabbers"}, {"name": "Elli Pomoni"}, {"name": "Ana L. Retore"}, {"name": "Paul Ryan"}, {"name": "Konstantinos Zoubos"}], "featured_authors": [{"name": "Rob Klabbers"}, {"name": "Elli Pomoni"}, {"name": "Ana L. Retore"}, {"name": "Paul Ryan"}, {"name": "Konstantinos Zoubos"}], "author_count": 5}, {"id": "2611.26287", "category": "hep-th", "title": "Black holes and 2-group symmetry from blackfolds in minimal supergravity", "abstract": "We investigate the black hole phase diagram of five-dimensional minimal supergravity using the blackfold approach and the framework of generalized symmetries. Starting from supergravity coupled to probe sources, we derive the 2-group (non-)conservation laws, construct the equilibrium action for a two-dimensional 2-group fluid, and compute the associated global conserved charges. We then match the thermodynamics of the general non-extremal black string in the ungauged theory to that of this fluid, organizing the blackfold effective theory and its solutions in terms of symmetry invariants. In the non-extremal ungauged sector, we perturbatively construct new black rings, Saturns, di-rings, and bi-rings, including a black Saturn with seven independent parameters. Taking appropriate extremal limits, we identify several extremal branches, some previously unexplored and others anticipated, as well as BPS branches that approximate known supersymmetric families. Finally, we apply the same framework to construct extremal black rings in AdS$_5$, identifying three regular branches that are promising candidates for an exact completion.", "url": "https://arxiv.org/abs/2611.26287", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jay Armas"}, {"name": "Giorgos Batzios"}, {"name": "Pedro Vicente Marto"}, {"name": "Chiara Toldo"}], "featured_authors": [{"name": "Jay Armas"}, {"name": "Giorgos Batzios"}, {"name": "Pedro Vicente Marto"}, {"name": "Chiara Toldo"}], "author_count": 4}, {"id": "2611.26374", "category": "hep-th", "title": "Classification of Chern-Simons Couplings and Deformed Pull-Backs on D-Branes", "abstract": "We establish a framework for classifying higher-derivative Ramond-Ramond (RR) couplings on Dp-branes, focusing on the complete scattering amplitude of a closed-string RR state, a gauge field, and two transverse scalars. The low-energy expansion reveals infinite massless poles and local interaction terms, surpassing standard Myers and Taylor expansions. We propose a higher-class deformation of the pullback using mixed Chern-Simons transgression operators to address these complexities. Our three conjectures are as follows: 1. For fixed field content and derivative order, effective couplings form a finite-dimensional space under stated equivalences. 2. A family of mixed RR, gauge, and scalar interactions exists at all orders, represented by a finite number of effective even forms. 3. The higher-derivative contact-term sector can be constructed from a finite set of basic tensor structures using polynomials in derivative symbols. We introduce a higher-class pullback operator \\( P_{\\infty} \\) and mixed transgression operators \\( \\mathcal{T}_{\\infty} \\), emphasizing amplitude-derived pole residues and local contact terms as key physical data. This formalism distinguishes admissible tensor structures, presenting characteristic-form aspects as conjectures alongside their validity considerations.", "url": "https://arxiv.org/abs/2611.26374", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Armin Hatefi"}, {"name": "Ehsan Hatefi"}], "featured_authors": [{"name": "Armin Hatefi"}, {"name": "Ehsan Hatefi"}], "author_count": 2}, {"id": "2611.26495", "category": "hep-th", "title": "Inhomogeneous Cutoff Regularization of Loops in Cosmological Correlators", "abstract": "We revisit the use of cutoff regularization in computing loop corrections to cosmological correlators. We argue that a cutoff corresponding to a fixed physical scale must be defined with respect to the local background geometry. In the presence of superhorizon perturbations, this is naturally implemented within the separate universe picture, where different local patches are regulated at the same physical scale. Expanding this cutoff in the long-wavelength background generates a series of regulator-induced contributions to loop amplitudes, which admit a diagrammatic interpretation as long-mode insertions on the corresponding loop contractions. Our cutoff prescription preserves residual spatial dilatations and volume-preserving anisotropic rescalings. It is therefore particularly relevant for loop correlators with soft external modes. We illustrate the mechanism by computing the contributions to the one-loop scalar and tensor power spectra on superhorizon scales. In both cases, the additional corrections induced by the inhomogeneous cutoff cancel the ultraviolet boundary terms arising in the ordinary diagrams. These calculations establish, within cutoff regularization, the late-time constancy of both power spectra and clarify its physical origin. We then investigate the squeezed one-loop scalar bispectrum and show that the additional cutoff contributions are essential for satisfying the consistency relation at finite cutoff. Finally, we discuss the role of the inhomogeneous cutoff in the late-time constancy of the one-loop bispectrum.", "url": "https://arxiv.org/abs/2611.26495", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jacopo Fumagalli"}, {"name": "Keisuke Inomata"}], "featured_authors": [{"name": "Jacopo Fumagalli"}, {"name": "Keisuke Inomata"}], "author_count": 2}, {"id": "2611.26554", "category": "hep-th", "title": "Twisting Spinning Particles with Superghost Backgrounds", "abstract": "We construct twists of spinning particles in the classical BV formalism by giving constant backgrounds to the bosonic ghosts of local worldline supersymmetry, in analogy with Costello and Li's twist of supergravity, which gives a nonzero background to the ghost of local spacetime supersymmetry. We represent the superghosts on polynomial states and gauge selected worldline R symmetries, imposing the shifted R constraints absolutely and the unshifted ones relatively. On flat targets, the N=2 particle, its N=4 extension on a complex target and an N=8 particle with two fermion flavors give the de Rham, Dolbeault and polynomial linear BCOV complexes. The last two are the linearized field content of the open and closed B-model target-space theories. Pairings and interactions require target-space input beyond the reduced worldline differentials.", "url": "https://arxiv.org/abs/2611.26554", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Erik Fink"}, {"name": "Jingqian Gou"}, {"name": "Niklas Holbach"}, {"name": "Ondrej Hulik"}], "featured_authors": [{"name": "Erik Fink"}, {"name": "Jingqian Gou"}, {"name": "Niklas Holbach"}, {"name": "Ondrej Hulik"}], "author_count": 4}, {"id": "2611.26594", "category": "hep-th", "title": "UV Bounds on Inflationary Parity Violation", "abstract": "A question of fundamental interest is whether parity is violated on large scales in the Universe. This possibility has been motivated by recent analyses of the four-point matter correlation function. It has also been suggested that detectable parity violation could be generated during inflation by the dynamical Chern-Simons operator, a leading effective field theory correction to general relativity. In this work, we examine this possibility in realistic UV completions, including fermionic and string-theoretic examples. We show that existing bounds on the tensor-scalar-scalar (TSS) bispectrum strongly constrain the possibility of generating a detectable parity-odd trispectrum. For tensor-to-scalar ratios near current observational limits, detectability is incompatible with, or pushes against, the regime of validity of these UV completions. A detectable signal can remain possible for a sufficiently small tensor-to-scalar ratio, but only at the cost of an extremely large enhancement of the TSS vertex. Thus, while a future search for large scale parity violation is worth pursuing, generating a detectable signal within a consistent effective theory is highly nontrivial.", "url": "https://arxiv.org/abs/2611.26594", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexander Cassem"}, {"name": "Mark P. Hertzberg"}], "featured_authors": [{"name": "Alexander Cassem"}, {"name": "Mark P. Hertzberg"}], "author_count": 2}, {"id": "2611.26597", "category": "hep-th", "title": "Equivariant iterated Eisenstein integrals for congruence subgroups of level 2", "abstract": "The modular properties of holomorphic Eisenstein series for $\\mathrm{SL}_2(\\mathbb{Z})$ and its congruence subgroups do not carry over to their primitives. Instead, the transformation of iterated Eisenstein integrals under congruence subgroups of level $N$ introduces inhomogeneous terms comprising (among others) cyclotomic multiple zeta values of level $N$. We combine iterated Eisenstein integrals for the congruence subgroups of level $N=2$ of arbitrary iteration depth with their complex conjugates and (single-valued) level-2 cyclotomic multiple zeta values such that they define non-holomorphic modular forms. Our construction of these so-called equivariant iterated Eisenstein integrals for $\\Gamma(2)$ and $\\Gamma_0(2)$ proceeds at the level of generating series that take values in an infinite-dimensional (pro-unipotent) Lie group and closely follow Brown's analogous construction in the $\\mathrm{SL}_2(\\mathbb{Z})$ case. The required insertions of cyclotomic multiple zeta values are controlled by zeta generators for level 2 that normalise the corresponding (pro-nilpotent) Lie algebra of the generating series and whose Lie-bracket relations we determine systematically. Upon restriction to Eisenstein series of modular weight~2, we recover single-valued multiple polylogarithms on the genus 0 modular curve $\\Gamma(2)\\backslash \\mathbb{H}$.", "url": "https://arxiv.org/abs/2611.26597", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Emiel Claasen"}, {"name": "Mehregan Doroudiani"}, {"name": "Claude Duhr"}, {"name": "Axel Kleinschmidt"}, {"name": "Franca Lippert"}, {"name": "Oliver Schlotterer"}, {"name": "Yoann Sohnle"}], "featured_authors": [{"name": "Emiel Claasen"}, {"name": "Mehregan Doroudiani"}, {"name": "Claude Duhr"}, {"name": "Franca Lippert"}, {"name": "Oliver Schlotterer"}, {"name": "Yoann Sohnle"}], "author_count": 7}, {"id": "2611.26628", "category": "hep-th", "title": "Entropy Products and the Extremal Limit That Never Comes", "abstract": "Two regular black hole horizons need not have an entropy product fixed by the charges and couplings. In Einstein--Maxwell--scalar theory, we construct asymptotically flat branches with products above or below the squared extremal entropy. Regularity selects their horizon scalar values, and different branches can share the charges, couplings, and asymptotic scalar. Each product stays constant as mass and asymptotic scalar vary. The horizon areas stay apart and no extremal limit is reached: the temperature vanishes only where the mass diverges. We prove local existence.", "url": "https://arxiv.org/abs/2611.26628", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kevin Goldstein"}, {"name": "Vishnu Jejjala"}, {"name": "Suresh Nampuri"}], "featured_authors": [{"name": "Kevin Goldstein"}, {"name": "Vishnu Jejjala"}, {"name": "Suresh Nampuri"}], "author_count": 3}, {"id": "2611.24961", "category": "math-ph", "title": "Canonical and Canonoid Transformations of Hamiltonian Systems on $q$-Cosymplectic and $q$-Contact Manifolds", "abstract": "$q$-Cosymplectic and $q$-contact structures equip presymplectic and precontact geometry with additional one-forms and a normalized family of Reeb vector fields. We study canonical and canonoid transformations relative to these data, with particular attention to their origin in constrained mechanical systems. In the $q$-cosymplectic and uniform $q$-contact cases, we establish local normal forms, characterize infinitesimal automorphisms, and obtain Noether-type relations between symmetries and conserved or dissipated quantities. For a one-parameter group of canonoid transformations with generator $X$, we show that $[X,X_H]$ is Hamiltonian and determine its Hamiltonian function. In the uniform $q$-contact case, simultaneous constant rescalings of the defining forms provide canonoid transformations for every Hamiltonian. The geometric constructions are illustrated by regular relativistic mass-shell constraints and by global Lagrangian descriptions of a charge in magnetic monopole fields. These examples distinguish parameters along constraint orbits from physical time and clarify the role of gauge directions. They also recover the total angular momentum of free relativistic particles and the Poincaré angular momentum of the charge--monopole system. For two monopoles, we construct a non-uniform $2$-contact structure and prove a topological obstruction to a uniform structure with the prescribed gauge generators as Reeb fields. Irrationally related magnetic charges additionally obstruct the intermediate quotient that would produce a single contact manifold. This example identifies a limitation of the uniform theory and motivates its extension to non-uniform structures.", "url": "https://arxiv.org/abs/2611.24961", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Giuseppe Marmo"}, {"name": "Cristina Sardón"}, {"name": "Xuefeng Zhao"}], "featured_authors": [{"name": "Giuseppe Marmo"}, {"name": "Cristina Sardón"}, {"name": "Xuefeng Zhao"}], "author_count": 3}, {"id": "2611.25077", "category": "math-ph", "title": "On Hölder Equicontinuity of the Integrated Density of States for Random Schrödinger Operators on $\\mathbb{Z}^d$", "abstract": "We study a random Schrödinger operator $H_\\lambda= H_0 + \\lambda V$ on $\\mathbb{Z}^d$ consisting of a translation invariant hopping matrix $H_0$ and a random potential $V$, given by independently distributed single site potentials with absolutely continuous distributions. Assuming a regularity assumption for the hopping matrix $H_0$, we show Hölder continuity of the integrated density of states of $H_\\lambda$ up to exponents $2/3$, independently of the disorder strength $\\lambda$.", "url": "https://arxiv.org/abs/2611.25077", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jan Fischer"}, {"name": "David Hasler"}], "featured_authors": [{"name": "Jan Fischer"}, {"name": "David Hasler"}], "author_count": 2}, {"id": "2611.25285", "category": "math-ph", "title": "Interacting framework for the free magnetic dynamics", "abstract": "This is the second paper of a program aimed at a rigorous many--body theory of continuum fermions in a uniform magnetic field, built on the asymptotic quasi--local structure that the magnetic coherent--state frame induces on the CAR algebra. Here we study the free dynamics. We show that a Bogoliubov dynamics preserves the local structure exactly if and only if it is generated by a function of the Landau Hamiltonian. For this class we compute the hopping coefficients in closed form, prove that the Lieb--Robinson velocity vanishes, and determine when the almost--local algebra lies in the domain of the generator. For the Landau Hamiltonian the dynamics turns out to be periodic. We then describe the ground states and the KMS states at every temperature, prove their ergodicity under magnetic translations, and recover the KMS states at positive temperature as thermodynamic limits of local Gibbs states. Finally, we relate the exact hopping operator to the Hofstadter model. These results confirm that the frame--induced local structure is a consistent setting for the perturbed and interacting magnetic dynamics to be studied next.", "url": "https://arxiv.org/abs/2611.25285", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Giuseppe De Nittis"}], "featured_authors": [{"name": "Giuseppe De Nittis"}], "author_count": 1}, {"id": "2611.25308", "category": "math-ph", "title": "Painlevé transcendents in the defocusing Hirota equation with non-zero boundary conditions", "abstract": "We consider the Cauchy problem for the defocusing Hirota equation with non-zero boundary conditions \\begin{align*} &iq_t+ q_{xx}-2\\left(|q|^2-1\\right)q +i\\left(q_{xxx}-6|q|^2q_x\\right)=0,\\\\ &q(x,0)=q_0(x)\\to\\pm 1, \\quad x\\to\\pm\\infty, \\end{align*} which can be characterized using a Riemann-Hilbert problem through the inverse scattering transform. With the $\\bar{\\partial}$-steepest descent method and double scaling limit technique, we derive the long-time asymptotics of the solution in two transition regions \\begin{align*} \\mathcal{P}_{a} :=\\left\\{(x,t)\\in\\mathbb{R}\\times\\mathbb{R}^{+}: \\left| {x}/{t}-a\\right|t^{2/3}<C\\right\\}, \\quad a\\in\\{-4,-8\\}, \\end{align*} where $C>0$ is a constant. It is shown that the asymptotic expansions in two transition regions can be expressed in terms of the Hastings--McLeod solution of the Painlevé II equation in the generic case and Ablowitz--Segur solutions in the non-generic case.", "url": "https://arxiv.org/abs/2611.25308", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shuning Lin"}, {"name": "Engui Fan"}], "featured_authors": [{"name": "Shuning Lin"}, {"name": "Engui Fan"}], "author_count": 2}, {"id": "2611.25343", "category": "math-ph", "title": "Semiclassical Averaging and Temporal Fluctuations of Quantum Dark Solitons in the Lieb-Liniger Model", "abstract": "We study the time evolution of quantum dark-soliton states of the Lieb--Liniger model, introduced by Sato--Kanamoto--Kaminishi--Deguchi as equal-weight superpositions of one-hole yrast states, and their relation to Gross--Pitaevskii (GP) solitons. We consider a simultaneous weak-coupling and large-system limit in which the repulsive coupling constant $c$ tends to zero and the particle number $N$ and ring circumference $L$ tend to infinity, with the mean density $\\bar n=N/L$ and scaled circumference $\\Lambda=L\\sqrt{c\\bar n}$ fixed. We conjecture that, in this limit, the normalized quantum density and its evolution at fixed scaled time $\\tau=c\\bar n t$ are described by a canonical-momentum average of normalized periodic one-soliton GP densities, each evolving at its own velocity. We explicitly parametrize the GP family by canonical momentum and provide numerical evidence for this correspondence. The different velocities explain the spreading of the averaged density notch despite shape preservation by individual solitons. In the infinite-line limit, we derive an analytic expression for the initial averaged profile, establish an inverse-fifth-power decay of its density deficit with distance from the soliton center, and express the Fourier transform of its deviation from the background as a series of Bickley--Naylor functions $\\operatorname{Ki}_3$. Following the spreading of the initial notch, we investigate temporal density fluctuations of the quantum dark solitons and propose a relation between long-time mode variances and second moments of GP Fourier coefficients, supported by numerical comparisons of individual mode variances and the total variance. Yrast transition frequencies distinguish the initial dephasing time scale from the longer scale associated with finite-time averaging of fluctuations.", "url": "https://arxiv.org/abs/2611.25343", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kota Kaneko"}, {"name": "Kohei Motegi"}, {"name": "Jun Sato"}], "featured_authors": [{"name": "Kota Kaneko"}, {"name": "Kohei Motegi"}, {"name": "Jun Sato"}], "author_count": 3}, {"id": "2611.25455", "category": "math-ph", "title": "A Faà di Bruno Convolution Identity in Parafermion Operator Products", "abstract": "We give a detailed combinatorial proof of a Faà di Bruno convolution identity used in parafermion operator-product calculations. The identity establishes the cancellation of potentially more singular terms and shows that the leading contribution combines the polynomial indices additively. The proof, originating in the author's doctoral thesis, provides a general derivation of an identity stated in earlier parafermion literature.", "url": "https://arxiv.org/abs/2611.25455", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sam Kault"}], "featured_authors": [{"name": "Sam Kault"}], "author_count": 1}, {"id": "2611.25770", "category": "math-ph", "title": "Block decimation and perfect actions for $p$-adic valued path integrals", "abstract": "In earlier work we introduced a finite-partition propagator for $\\mathbb{C}_p$-valued wave functions, in which the intermediate positions are integrated against atomic measures. The iterated integral evaluates the action on the equally spaced chain between the endpoints, so each partition level is obtained by iterating an exact, tree-level block decimation of two-point lattice actions, with no integration over fluctuations. This kinematic decimation is the Fréchet derivative, at the free actions, of the variational decimation underlying classical perfect actions. Since the time step $p^n$ is small in the real norm exactly when it is large $p$-adically, refinement and coarsening (the ultraviolet and infrared directions over $\\mathbb{R}$) exchange roles, and each yields one limit. Under refinement, potentials supported on $\\mathbb{Z}_p$, given there by a convergent power series, and entering the slice action without the time-step weight produce an interaction that stabilizes off the diagonal after finitely many steps and converges uniformly on $\\mathbb{Z}_p^2$, with sharp error $p^{-M}$ after $M$ steps, to a scale-covariant (perfect) action, governed near the diagonal by a Volkenborn integral; with the weight no limit exists. For the harmonic oscillator no refinement limit exists at fixed frequency, but under coarsening the variational flow is solved in closed form: the lattice angle is multiplied by $p$ at each step, the coupling obeys a Chebyshev recursion, no caustic occurs, and the rescaled action converges to a free action with renormalized mass $m_0\\sin_p(\\theta_0)/\\theta_0$. The rescaled linearized map is diagonalizable on polynomial actions with eigenvalues $p^{2-b}$, so directions relevant over $\\mathbb{R}$ are irrelevant over $\\mathbb{Q}_p$ and conversely.", "url": "https://arxiv.org/abs/2611.25770", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Su Hu"}, {"name": "Min-Soo Kim"}], "featured_authors": [{"name": "Su Hu"}, {"name": "Min-Soo Kim"}], "author_count": 2}, {"id": "2611.25885", "category": "math-ph", "title": "Scaling limits for products of induced symplectic Ginibre matrices", "abstract": "We study the local eigenvalue correlations of products of independent induced symplectic Ginibre matrices in the large-dimensional limit. We establish the scaling limits of the correlation functions in the bulk, at the spectral edges, and outside the limiting spectral support, both near and away from the real axis. At regular spectral points, we show that the limiting correlations coincide with those of a single symplectic Ginibre ensemble, exhibiting Pfaffian structures near the real axis and determinantal structures away from it. At the origin, where the limiting spectral density develops a singularity, we derive an integral representation of the parameter-dependent limiting Pfaffian prekernel. Our proofs are based on a unified approach involving a differential equation for the skew prekernels and their asymptotics.", "url": "https://arxiv.org/abs/2611.25885", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Can Atacan"}, {"name": "Noah Aygün"}, {"name": "Yong-Woo Lee"}], "featured_authors": [{"name": "Can Atacan"}, {"name": "Noah Aygün"}, {"name": "Yong-Woo Lee"}], "author_count": 3}, {"id": "2611.26375", "category": "math-ph", "title": "Root-of-Unity Limits of Trigonometric qKZ Connections", "abstract": "Over the field of complex numbers, we study root-of-unity limits of trigonometric qKZ connections associated with tensor products of $U_q(\\mathfrak{sl}_2)$ Verma modules and of their hypergeometric solutions. As the multiplicative step approaches a primitive $m$-th root of unity and the quantum-group and twist parameters approach $1$, the $m$-step qKZ transport yields, on every fixed-degree subspace,a differential connection. We show that this connection is the pullback of the trigonometric KZ connection under the power map $z\\mapsto z^m$, with the KZ parameter rescaled by $m$, and establish formal and $\\ell$-adic versions. In degree one, with all highest weights equal to $1$, we determine the limits of normalized qKZ hypergeometric circle integrals in arbitrary angular chambers. The limits are expressed in terms of loaded hypergeometric integrals for the trigonometric KZ equations and explicit chamber-dependent upper-triangular matrices. We establish compatibility of the resulting distinguished fundamental matrices under inward analytic continuation, governed by the right weak Bruhat order,and under power maps, including composition of root orders.", "url": "https://arxiv.org/abs/2611.26375", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexander Varchenko"}], "featured_authors": [{"name": "Alexander Varchenko"}], "author_count": 1}, {"id": "2611.26399", "category": "math-ph", "title": "Curvature Integrability in Twinor Theory: An Ambitwistor Approach to the Twinor Googly Problem", "abstract": "The twinor analogue of the googly problem is addressed through an ambitwistor structure defined by null autoparallels, retaining both chiralities, sources and torsion without requiring chiral null surfaces. Under the stated quotient, evaluation and descent assumptions, holomorphic affine sections reconstruct the twinor field equation $DY=J$. Correspondence-space cohomology realizes the contracted chiral and ladder equations, including the ladder's soldering coupling and mass-normalization source. For a prescribed non-normal conformal connection, infinity-twistor parallelism recovers the energy--momentum equation, supplemented by independent spin-current equations. These constructions give a conditional auxiliary formulation; constitutive sources and gravitational prescriptions remain dynamical input.", "url": "https://arxiv.org/abs/2611.26399", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chen-Hsu Chien"}], "featured_authors": [{"name": "Chen-Hsu Chien"}], "author_count": 1}, {"id": "2611.25019", "category": "quant-ph", "title": "Entanglement Geometry Beyond Polygons: Graph-Theoretic Entanglement Inequalities", "abstract": "Entanglement entropies of pure multipartite states can be constrained by organizing subsystem cuts as edges (hyperedges) of graphs (hypergraphs). Starting from the one-party entanglement polygon inequality, we derive these constraints from strong subadditivity and pure-state complementarity, with optimal coefficients and explicit equality conditions. Our central result determines, for a distinguished two-party cut and an arbitrary weighted family of cuts, the optimal polygon coefficient: the smallest total weight of the cuts separating a member of the distinguished pair from a remaining party. A refinement involving three mutual information terms gives the exact minimum of the weighted sum at fixed entropies of the two parties and of their union, attained by at most three independent bipartite pure states. This criterion recovers the cycle and complete-graph inequalities and shows that uniform incidence parity, which we prove sufficient for polygon inequalities on hypergraphs, is not necessary. Averaging strong subadditivity over both sides of a bipartition gives a sharp $k$-marginal inequality with coefficient $2\\binom{n-2}{k-1}$, and we determine uniformly optimal coefficients for collective hyperstar inequalities. For paths and overlapping hyperchains, the deficits are exact sums of conditional mutual information terms; genuinely multipartite entangled cluster states saturate the hyperchain inequality while the chain inequality remains strict. We characterize pure chain equality states, bound the trace distance to cycle equality states independently of the number of parties and local dimensions, and obtain bond-dimension bounds for matrix product states and sequential-recovery error estimates.", "url": "https://arxiv.org/abs/2611.25019", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masoud Gharahi"}], "featured_authors": [{"name": "Masoud Gharahi"}], "author_count": 1}, {"id": "2611.25025", "category": "quant-ph", "title": "The Clifford Hierarchy from Clifford Stabilizers in 2D", "abstract": "The Bravyi-König theorem limits the constant-depth logical gates of 2D topological Pauli stabilizer codes to be in the Clifford group. Known qubit codes with Clifford stabilizers exceed it by only one level of the Cliffor
