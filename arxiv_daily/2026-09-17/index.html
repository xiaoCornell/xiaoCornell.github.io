al order extends the conventional circuit paradigm by allowing local quantum operations to be connected without a predetermined global order. Within the process-matrix framework, it is characterized by causal nonseparability, whereas extensible causal separability (ECS) requires that, under arbitrary input-ancilla extensions, a process admit a recursive decomposition into components, each compatible with a particular operation acting first. Quantum circuits with classical control of causal order (QC-CC), in which previous outcomes dynamically determine which operation acts next, are known to generate ECS processes, but whether every ECS process admits such a realization has remained a longstanding open problem. We settle it through a generalized teleportation construction that realizes every multipartite ECS process as a QC-CC. We further establish consistency between ECS definitions for trivial and nontrivial global past and future systems. These results provide ECS with an exact operational interpretation and identify QC-CC as the complete circuit structure underlying this class of processes.", "url": "https://arxiv.org/abs/2609.18559", "type": "理论", "summary": "不定因果顺序允许在没有预定全局顺序的情况下连接局部量子操作，从而扩展了传统的电路范例。在过程矩阵框架内，它的特点是因果不可分离性，而可扩展因果可分离性（ECS）要求在任意输入辅助扩展下，过程允许递归分解为组件，每个组件与首先起作用的特定操作兼容。已知具有经典因果顺序控制 (QC-CC) 的量子电路会生成 ECS 过程，其中先前的结果动态地确定接下来执行哪个操作，但是否每个 ECS 过程都承认这种实现仍然是一个长期存在的问题。我们通过广义隐形传态结构来解决这个问题，该结构将每个多方 ECS 流程实现为 QC-CC。我们进一步建立了过去和未来的平凡和非平凡全球系统的 ECS 定义之间的一致性。这些结果为 ECS 提供了精确的操作解释，并将 QC-CC 识别为此类过程的完整电路结构。", "authors": [{"name": "Wenjie Wei"}, {"name": "Shengshi Pang"}], "featured_authors": [{"name": "Wenjie Wei"}, {"name": "Shengshi Pang"}], "author_count": 2}, {"id": "2609.18568", "category": "quant-ph", "title": "Spectral Optimization for Absolutely PPT States: Purity, Entropy, and Volume Decay", "abstract": "We study maximum purity and minimum von Neumann entropy of absolutely positive partial transpose (APPT) states, together with the relative volume of their spectral sets. A consequence of Hildebrand's criterion gives an explicit outer spectral polytope, whose vertices we classify. Optimizing purity over this polytope, together with the Song--Chen result for the $2\\otimes3$ system, yields, for every $mn\\ge6$, an explicit upper bound on the purity of APPT states that is asymptotic to $4/(3mn)$. This improves the previous $2/(mn)$ upper bound for absolutely separable states. The new bound applies to every APPT state, a class containing all absolutely separable states, and is sharp for every $2\\otimes n$ system with $n\\ge3$. For every $3\\otimes n$ system with $n\\ge3$, however, the unique outer-polytope maximizer is not APPT, so the bound is strict and disproves the Dũng--Khôi qutrit--qudit conjecture. The polytope also gives an explicit entropy lower bound in arbitrary bipartite dimensions and, together with the Song--Chen extreme-point classification, the exact minimum entropy for every $2\\otimes n$ system. Finally, exact formulas for the relative volumes of an inner polytope and the outer spectral polytope give explicit two-sided bounds on the qubit--qudit relative spectral volume $a_n$ whose ratio is less than $4$ and tends to $3$. Consequently, $a_n=\\Theta\\!\\left(\\sqrt n(4/27)^n\\right)$, and the relative volume of the qubit--qudit APPT spectral set (equivalently, the absolutely separable spectral set) has exact exponential decay rate $\\ln(27/4)$.", "url": "https://arxiv.org/abs/2609.18568", "type": "理论+数值", "summary": "我们研究绝对正部分转置（APPT）态的最大纯度和最小冯诺依曼熵，以及它们的光谱集的相对体积。希尔德布兰德准则的结果给出了一个明确的外部光谱多胞形，我们对其顶点进行分类。优化这个多胞体的纯度，结合 $2\\otimes3$ 系统的 Song--Chen 结果，对于每个 $mn\\ge6$，产生一个渐进到 $4/(3mn)$ 的 APPT 状态纯度的明确上限。这改进了之前绝对可分离状态的 $2/(mn)$ 上限。新的界限适用于每个 APPT 状态，一个包含所有绝对可分离状态的类，并且对于每个具有 $n\\ge3$ 的 $2\\otimes n$ 系统来说都是锐利的。然而，对于每个具有 $n\\ge3$ 的 $3\\otimes n$ 系统，唯一的外多面体最大化器不是 APPT，因此界限是严格的，并且反驳了 Dũng--Khôi qutrit--qudit 猜想。多胞体还给出了任意二分维度中的显式熵下界，并与 Song-Chen 极值点分类一起给出了每个 $2\\otimes n$ 系统的确切最小熵。\n\n最后，内部多面体和外部光谱多面体的相对体积的精确公式给出了量子位的明确两侧边界——qudit 相对光谱体积 $a_n$ ，其比率小于 $4$ 并且趋于 $3$。因此，$a_n=\\Theta\\!\\left(\\sqrt n(4/27)^n\\right)$，以及量子位的相对体积--qudit APPT 谱集（等效于绝对可分离谱集）具有精确的指数衰减率 $\\ln(27/4)$。", "authors": [{"name": "Anh T. Tran"}], "featured_authors": [{"name": "Anh T. Tran"}], "author_count": 1}, {"id": "2609.18570", "category": "quant-ph", "title": "Catalytic Activation of Genuine Multipartite Entanglement and Nonlocality", "abstract": "We demonstrate the possibility to activate genuine multipartite entanglement (GME), the strongest form of entanglement for multipartite states, within the framework of quantum catalysis. Specifically, we show that any biseparable state (i.e. not GME) that is not partition separable can be deterministically transformed into a GME state via the help of a catalyst and local operations, without any classical communication. In turn, we construct a catalytic protocol tailored to the multipartite case. The protocol is termed \"sum-to-product\", as it transforms a mixture of states into their tensor product in a heralded manner. We apply this protocol to random network entangled states, which are biseparable by construction, and demonstrate catalytic activation of both GME and genuine multipartite Bell nonlocality.", "url": "https://arxiv.org/abs/2609.18570", "type": "理论", "summary": "我们证明了在量子催化框架内激活真正的多部分纠缠（GME）的可能性，这是多部分态的最强纠缠形式。具体来说，我们表明，任何不可分区的可分状态（即不是 GME）都可以通过催化剂和本地操作的帮助确定性地转换为 GME 状态，而无需任何经典通信。反过来，我们构建了一个适合多方案例的催化方案。该协议被称为“sum-to-product”，因为它以一种预示的方式将状态的混合转换为其张量积。我们将此协议应用于随机网络纠缠态，这些纠缠态可通过构造进行二分，并证明 GME 和真正的多部分贝尔非定域性的催化激活。", "authors": [{"name": "Eliot Donnadieu"}, {"name": "Pavel Sekatski"}, {"name": "Nicolas Brunner"}, {"name": "Victor Barizien"}], "featured_authors": [{"name": "Eliot Donnadieu"}, {"name": "Pavel Sekatski"}, {"name": "Nicolas Brunner"}, {"name": "Victor Barizien"}], "author_count": 4}, {"id": "2609.18593", "category": "quant-ph", "title": "From Reversible Quantum Dynamics to Statistical Probability: A dynamical solution to the origin of probability and Hilbert's sixth problem", "abstract": "Hilbert's sixth problem placed probability and mechanics at the center of the axiomatization of physics. It asks how irreversible statistical probability and thermodynamics can produce from the reversible, deterministic dynamics of a system. Building on an exact open quantum system theory developed in the past two decades, we construct a dynamical route from the reversible quantum dynamics to reduced statistics. For quadratic bosonic and fermionic systems bilinearly coupled to arbitrary environments, we derive the exact reduced density operator determined completely by a dissipative propagator u and a fluctuation correlation function v of the system. For continuous spectral densities with no bound-state pole, u vanishes in the long-time limit, information about the system initial states is lost completely, and the reduced density operator of systems approaches a thermal Gibbs state. Gapped spectral densities with localized bound states instead preserve long-time memory and prevent thermalization. We then remove the usual assumption of an initially thermal, mixed environment, start from a product of pure states for the system and environment, unitary evolution first generates system-environment entanglement and a periodic quasi-Gibbs reduced state for a finite environment. When the number of environmental degrees of freedom tends to infinity, the spectrum becomes continuous, the recurrence disappears, the exact reduced density operator converges to a thermal Gibbs state. The total entropy remains zero, whereas the system entropy becomes entanglement entropy and reaches its maximum. Probability is therefore not an additional random postulate imposed on unitary dynamics, it is the objective statistical structure of an open system in a composite. These results provide an exact, testable dynamical solution of the determinism to statistics.", "url": "https://arxiv.org/abs/2609.18593", "type": "理论", "summary": "希尔伯特的第六个问题将概率和力学置于物理学公理化的中心。它询问不可逆的统计概率和热力学如何从系统的可逆、确定性动力学中产生。基于过去二十年发展起来的精确开放量子系统理论，我们构建了一条从可逆量子动力学到简化统计的动力学路线。对于双线性耦合到任意环境的二次玻色子和费米子系统，我们推导出完全由系统的耗散传播器 u 和涨落相关函数 v 确定的精确约化密度算子。对于没有束缚态极点的连续谱密度，u在长时间极限内消失，系统初始状态的信息完全丢失，系统的约简密度算子接近热吉布斯态。相反，具有局部束缚态的带隙光谱密度可以保留长期记忆并防止热化。\n\n然后，我们删除最初热混合环境的通常假设，从系统和环境的纯态乘积开始，单一进化首先生成系统环境纠缠和有限环境的周期性准吉布斯还原态。当环境自由度数趋于无穷大时，谱变得连续，递推消失，精确的约简密度算子收敛到热吉布斯态。总熵保持为零，而系统熵变成纠缠熵并达到最大值。因此，概率不是强加于单一动力学的附加随机假设，而是复合中开放系统的客观统计结构。这些结果为统计的决定论提供了精确的、可测试的动态解决方案。", "authors": [{"name": "Wei-Min Zhang"}], "featured_authors": [{"name": "Wei-Min Zhang"}], "author_count": 1}, {"id": "2609.18641", "category": "quant-ph", "title": "Resonance-Protected Pointer States: Stationary-Phase Analysis of Entanglement in an Environment-Coupled Two-Spin System", "abstract": "In this manuscript, we analyze the dynamics of a model in which two spin-1/2 systems are each coupled noncommutingly to a static environmental field and to a self-Hamiltonian, while also being mutually coupled through a $\\sigma_y^{(1)}\\sigma_y^{(2)}$ interaction. By constructing an exact solution that exploits parity symmetry, and by applying the stationary-phase approximation (the saddle-point method) in the continuum limit of the environmental field, we show that coherence associated with the ordinary isolated stationary point decays as $t^{-1}$, whereas, under the resonance condition at which the local effective fields of the two spins cancel each other, only the coherence between a pair of maximally entangled, Bell-type states- the eigenbasis of the inter-system coupling-survives, decaying via the anomalously slow power law $t^{-1/2}$. Through a comparison with the pointer-basis theory of W. H. Zurek and coworkers (the 1981 and 2005 models), we further reveal a mechanism not reducible to local coupling: in this system, the pointer observable is determined not by the individual system-environment couplings but by a statistical resonance condition between the two environments.", "url": "https://arxiv.org/abs/2609.18641", "type": "理论", "summary": "在这篇手稿中，我们分析了一个模型的动力学，其中两个自旋 1/2 系统分别非对易地耦合到静态环境场和自哈密顿场，同时还通过 $\\sigma_y^{(1)}\\sigma_y^{(2)}$ 相互作用相互耦合。通过构造利用宇称对称性的精确解，并在环境场的连续极限中应用平稳相近似（鞍点法），我们表明与普通孤立驻点相关的相干性衰减为 $t^{-1}$，而在两个自旋的局部有效场相互抵消的共振条件下，只有一对最大纠缠的贝尔型状态之间的相干性 - 特征基系统间耦合仍然存在，并通过异常缓慢的幂律 $t^{-1/2}$ 衰减。通过与 W. H. Zurek 及其同事的指针基础理论（1981 和 2005 模型）的比较，我们进一步揭示了一种不可简化为局部耦合的机制：在该系统中，指针可观测量不是由单个系统-环境耦合决定的，而是由两个环境之间的统计共振条件决定的。", "authors": [{"name": "Kentaro Urasaki"}], "featured_authors": [{"name": "Kentaro Urasaki"}], "author_count": 1}, {"id": "2609.18666", "category": "quant-ph", "title": "Impact of a CSS quantum error correction code in underwater quantum key distribution", "abstract": "Quantum key distribution (QKD) enables secure underwater communications essential for maritime infrastructure. Underwater optical channels introduce substantial photon loss (erasures) and ambient noise that degrade QKD performance. This paper investigates whether two four-qubit Calderbank-Shor-Steane (CSS) quantum error correction codes (QECC) mitigate these impairments in vertical underwater communication BB84 QKD protocol. After developing a comprehensive stochastic channel model incorporating photon loss, geometric spreading, and solar noise, we assess the viability of QECC through the analytical study of the quantum bit error rate (QBER) and the secure key rate (SKR) with and without security depending on the signal-to-noise ratio (SNR) validated against Monte Carlo simulations. The standard four-qubit CSS code achieves a 3 dB SNR gain at the QBER 11% security threshold; the discard code variant achieves 4.5 dB. However, QECC includes an encoding overhead that reduces the SKR. We demonstrate a crucial relationship between the SKR and the probability of arrival of the sent photon. Analysis shows that QECC is beneficial exclusively in marginal SNR regimes; at high SNR, raw BB84 dominates. For an ocean Type III Jerlov water scenario with sunlight coming from the sun located at the top of the atmosphere, we identify operational depth-range windows where QECC enables communication otherwise infeasible. This analysis establishes that error correction deployment must be scenario-dependent: extend operational range at the cost of throughput when SNR is marginal, or prioritize key generation rates at high SNR.", "url": "https://arxiv.org/abs/2609.18666", "type": "理论+数值", "summary": "量子密钥分发 (QKD) 可实现对海事基础设施至关重要的安全水下通信。水下光通道会引入大量光子损失（擦除）和环境噪声，从而降低 QKD 性能。本文研究了两个四量子位 Calderbank-Shor-Steane (CSS) 量子纠错码 (QECC) 是否可以减轻垂直水下通信 BB84 QKD 协议中的这些缺陷。在开发了包含光子损耗、几何扩散和太阳噪声的综合随机信道模型后，我们根据蒙特卡罗模拟验证的信噪比 (SNR)，通过对量子误码率 (QBER) 和安全密钥率 (SKR) 的分析研究来评估 QECC 的可行性。标准四量子位 CSS 代码在 QBER 11% 安全阈值下实现了 3 dB SNR 增益；丢弃代码变体达到 4.5 dB。然而，QECC 包含减少 SKR 的编码开销。我们证明了 SKR 与发送光子到达概率之间的重要关系。\n\n分析表明，QECC 仅在边际 SNR 情况下有益；在高信噪比下，原始 BB84 占主导地位。对于海洋 III 型杰洛夫水场景，阳光来自位于大气层顶部的太阳，我们确定了 QECC 能够实现通信的操作深度范围窗口，否则这是不可行的。该分析表明纠错部署必须取决于场景：当 SNR 处于边际时以吞吐量为代价扩展操作范围，或者在高 SNR 时优先考虑密钥生成率。", "authors": [{"name": "Juliette Florin"}, {"name": "Nicolas Le Josse"}, {"name": "Arnaud Coatanhay"}, {"name": "Gilles Burel"}], "featured_authors": [{"name": "Juliette Florin"}, {"name": "Nicolas Le Josse"}, {"name": "Arnaud Coatanhay"}, {"name": "Gilles Burel"}], "author_count": 4}, {"id": "2609.18691", "category": "quant-ph", "title": "Universal entanglement embezzlement and divergent nonlocal magic from generic local chaotic quantum evolution", "abstract": "We show that, starting from a product state, local unitary quantum evolutions generate intermediate states which exhibit a multiscale entanglement-spectrum structure required for universal entanglement embezzlement. This facilitates entanglement extraction from a catalyst many-body state while leaving it asymptotically unchanged. Remarkably, these atypical structures emerge generically at intermediate stages, well before reaching maximum entropy where thermalization has flattened out the spectral hierarchy. The resulting state is accompanied by nonlocal nonstabilizerness that diverges with the system size, consistent with a recently established equivalence between universal embezzlement and divergent nonlocal magic. Thus, without any fine tuning, a chaotic quantum evolution generates intermediate states which form a universal family of catalytic reservoirs.", "url": "https://arxiv.org/abs/2609.18691", "type": "理论", "summary": "我们证明，从乘积态开始，局域酉量子演化产生中间态，这些中间态表现出普遍纠缠盗用所需的多尺度纠缠谱结构。这有利于从催化剂多体态中提取纠缠，同时使其渐近不变。值得注意的是，这些非典型结构通常出现在中间阶段，远远早于达到最大熵，其中热化使光谱层次变得平坦。由此产生的状态伴随着随系统规模而变化的非局部非稳定性，这与最近在普遍贪污和发散的非局部魔法之间建立的等价性一致。因此，无需任何微调，混沌量子演化就会产生中间态，形成催化库的通用族。", "authors": [{"name": "Matias Karjula"}, {"name": "Teemu Ojanen"}, {"name": "Kim Pöyhönen"}, {"name": "Tapio Ala-Nissila"}, {"name": "Moein N. Ivaki"}], "featured_authors": [{"name": "Matias Karjula"}, {"name": "Teemu Ojanen"}, {"name": "Kim Pöyhönen"}, {"name": "Tapio Ala-Nissila"}, {"name": "Moein N. Ivaki"}], "author_count": 5}, {"id": "2609.18721", "category": "quant-ph", "title": "Thermal entanglement on a frustrated tetrahedron: Probing quantum resources through concurrence and stabilizer structure", "abstract": "In a frustrated spin system, highly entangled eigenstates can form a separable thermal mixture. We study this distinction for four spin-$1/2$ moments on a tetrahedron, the elementary unit of the pyrochlore lattice, with the general four-parameter exchange Hamiltonian. Tetrahedral symmetry allows a restricted search over thermal-state decompositions to be carried out by linear optimization, yielding an upper bound on multipartite concurrence and explicit separable decompositions where this bound vanishes. At low temperature, the concurrence maps show extended separable regions near the all-in--all-out limit, whereas suppression near the spin-ice point is narrowly localized. Heating broadens the latter region as nearby multiplets are repopulated. The optimization identifies fully separable thermal states even when the eigenstate-averaged concurrence remains large. Negativity independently confirms finite-temperature entanglement in selected coupling regions. A mixed-state stabilizer Rényi diagnostic, used to explore quantum magic, favours different couplings and can increase locally with temperature. These results connect thermal entanglement to the splitting and population of symmetry multiplets, and provide a practical basis for identifying frustrated spin configurations for studies of quantum resources beyond the ground-state limit.", "url": "https://arxiv.org/abs/2609.18721", "type": "理论+数值", "summary": "在受挫自旋系统中，高度纠缠的本征态可以形成可分离的热混合物。我们使用一般的四参数交换哈密顿量来研究四面体（烧绿石晶格的基本单位）上四个自旋 $1/2$ 矩的这种区别。四面体对称性允许通过线性优化对热态分解进行有限搜索，产生多部分并发的上限和显式可分离分解，其中该界限消失。在低温下，并发图显示在全进-全出极限附近有扩展的可分离区域，而自旋冰点附近的抑制是狭窄局部的。随着附近的多重态重新聚集，加热扩大了后一个区域。即使本征态平均并发仍然很大，优化也能识别完全可分离的热态。负性独立地证实了选定耦合区域中的有限温度纠缠。用于探索量子魔法的混合态稳定器 Rényi 诊断有利于不同的耦合，并且可以随温度局部增加。\n\n这些结果将热纠缠与对称多重态的分裂和布居联系起来，并为识别受抑自旋构型以研究超出基态极限的量子资源提供了实用基础。", "authors": [{"name": "Reza Pourkhodabakhshi"}, {"name": "Francis Dominie"}, {"name": "Deep Gajera"}, {"name": "Stephanie H. Curnoe"}], "featured_authors": [{"name": "Reza Pourkhodabakhshi"}, {"name": "Francis Dominie"}, {"name": "Deep Gajera"}, {"name": "Stephanie H. Curnoe"}], "author_count": 4}, {"id": "2609.18747", "category": "quant-ph", "title": "Almost One Bit Violation of Minimum-Output Rényi Entropy Additivity Simultaneously at All Orders", "abstract": "We prove that minimum-output Rényi-entropy additivity can fail by almost one bit simultaneously at every nonnegative order. For every $\\varepsilon\\in(0,\\log2)$, there exists a finite-dimensional quantum channel with a real Stinespring isometry such that the same maximally entangled input witnesses a tensor-square entropy gap of at least $\\log2-\\varepsilon$ for all $p\\in[0,\\infty]$. The output dimension can be chosen to be $O(\\varepsilon^{-3})$ as $\\varepsilon\\downarrow0$. The construction uses direct products of free groups: tensorized Haagerup estimates control the one-copy outputs, while commutation between distinct factors forces exact Bell-branch collisions at two copies. Strong convergence gives both an existential realization through finite-dimensional representations of right-angled Artin groups followed by realification, and a Haar-orthogonal model whose success probability tends to one as the matrix dimension grows. We also determine the exact Bell quotient, prove asymptotically sharp regular-radius bounds, and show that the cubic output-dimension scale is optimal within the present purity--rank certificate.", "url": "https://arxiv.org/abs/2609.18747", "type": "理论", "summary": "我们证明了最小输出 Rényi 熵可加性在每个非负阶上几乎同时会失败一位。对于每个 $\\varepsilon\\in(0,\\log2)$，存在一个具有真实 Stinespring 等距的有限维量子通道，使得相同的最大纠缠输入见证所有 $p\\in[0,\\infty]$ 的张量平方熵间隙至少为 $\\log2-\\varepsilon$。输出维度可以选择为$O(\\varepsilon^{-3})$，如$\\varepsilon\\downarrow0$。该构造使用自由群的直接乘积：张量化的 Haagerup 估计控制单副本输出，而不同因子之间的交换迫使两个副本发生精确的贝尔分支碰撞。强收敛性通过直角 Artin 群的有限维表示和随后的实现给出了存在性实现，以及哈尔正交模型，其成功概率随着矩阵维数的增长而趋于 1。我们还确定了精确的贝尔商，证明了渐进尖锐的规则半径界限，并表明立方输出维尺度在当前的纯度等级证书内是最佳的。", "authors": [{"name": "Guocheng Zhen"}, {"name": "Chengkai Zhu"}, {"name": "Ranyiliu Chen"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Guocheng Zhen"}, {"name": "Chengkai Zhu"}, {"name": "Ranyiliu Chen"}, {"name": "Xin Wang"}], "author_count": 4}, {"id": "2609.18757", "category": "quant-ph", "title": "Query-Optimal and Gate-Efficient Lindbladian Simulation", "abstract": "We give a quantum algorithm for Lindbladian simulation given a block encoding of the Hamiltonian $H$ and a projected unitary encoding of the stacked jump operator $B=\\sum_{k=1}^m \\lvert k\\rangle\\otimes L_k$, with normalization factors $\\alpha_H$ and $\\alpha_B$, respectively. For evolution time $t$, set $\\tau=(\\alpha_H+\\alpha_B^2)t$. The algorithm approximates the evolution channel to diamond-norm error $\\varepsilon$ using $O\\!\\left(\\tau+\\frac{\\log(1/\\varepsilon)}{\\log\\!\\left(e+\\log(1/\\varepsilon)/\\tau\\right)}\\right)$ oracle queries, matching the query lower bound for Hamiltonian simulation. The number of additional one- and two-qubit gates is linear in the query complexity up to polylogarithmic factors. The query- and gate-complexity bounds extend to Lipschitz-continuous time-dependent Lindbladians under coherent time-indexed oracle access. Our construction uses a one-query transducer that implements a product of rational approximations to short-time evolution when supplied with a catalyst. We bound the error from omitting the catalyst by exploiting orthogonality between different sequences of Kraus labels. The gate implementation combines a compressed Kraus-label representation, which stores only the positions and values of the nonzero labels, with the rotation factorization of Chen et al.", "url": "https://arxiv.org/abs/2609.18757", "type": "理论+数值", "summary": "我们给出了 Lindbladian 模拟的量子算法，给定哈密顿量 $H$ 的块编码和堆叠跳跃算子 $B=\\sum_{k=1}^m \\lvert k\\rangle\\otimes L_k$ 的投影酉编码，分别具有归一化因子 $\\alpha_H$ 和 $\\alpha_B$。对于演化时间$t$，设置$\\tau=(\\alpha_H+\\alpha_B^2)t$。该算法使用 $O\\!\\left(\\tau+\\frac{\\log(1/\\varepsilon)}{\\log\\!\\left(e+\\log(1/\\varepsilon)/\\tau\\right)}\\right)$ 预言机查询将演化通道近似为钻石范数误差 $\\varepsilon$，匹配哈密顿模拟的查询下界。额外的一量子位门和二量子位门的数量与查询复杂度成线性关系，最多可达多对数因子。在连贯的时间索引预言机访问下，查询和门复杂性界限扩展到 Lipschitz 连续时间依赖 Lindbladians。我们的构造使用单查询转换器，当提供催化剂时，该转换器实现对短时演化的有理近似的乘积。我们通过利用不同克劳斯标签序列之间的正交性来限制省略催化剂的错误。\n\n门实现结合了压缩的 Kraus 标签表示（仅存储非零标签的位置和值）与 Chen 等人的旋转因子分解。", "authors": [{"name": "Boyang Chen"}, {"name": "Minbo Gao"}, {"name": "Xinzhao Wang"}, {"name": "Shuo Zhou"}], "featured_authors": [{"name": "Boyang Chen"}, {"name": "Minbo Gao"}, {"name": "Xinzhao Wang"}, {"name": "Shuo Zhou"}], "author_count": 4}, {"id": "2609.18803", "category": "quant-ph", "title": "Feasibility Ordering of Entanglement-Source Placement for Qubit Channels", "abstract": "This work studies the placement of an entanglement source along a communication line formed by two noisy qubit channels. Recent work argued, on analytical and numerical grounds, that midpoint placement should be at least as favorable as endpoint placement. Here it is shown that, for arbitrary qubit channels, if a sequential composition can preserve entanglement, then the corresponding parallel action cannot annihilate all entanglement. The proof uses the transpose-factorization criterion introduced in that recent work. Quantum Sinkhorn scaling converts every strictly positive qubit channel into a unital representative, and the special normal form of unital qubit channels then yields the required factorization of the transposed map through the original channel. Depolarizing regularization and the closedness of the set of entanglement-breaking channels extend the result to arbitrary channels. Consequently, $\\Lambda_1 \\otimes \\Lambda_2 \\in \\mathrm{EA}$ implies $\\Lambda_2 \\circ \\Lambda_1 \\in \\mathrm{EB}$, and, by exchanging the two channels, the same holds for the opposite composition order. This proves the recent conjecture that midpoint placement is optimal for all qubit channels, in the feasibility sense in which that optimality was originally defined.", "url": "https://arxiv.org/abs/2609.18803", "type": "理论+数值", "summary": "这项工作研究了沿着由两个噪声量子位通道形成的通信线路放置纠缠源。最近的研究表明，基于分析和数值的依据，中点放置应该至少与端点放置一样有利。这里表明，对于任意量子位通道，如果顺序组合可以保留纠缠，则相应的并行操作不能消除所有纠缠。该证明使用了最近工作中引入的转置因子分解标准。量子 Sinkhorn 缩放将每个严格正的量子位通道转换为单位代表，然后单位量子位通道的特殊范式通过原始通道生成转置图所需的因式分解。去极化正则化和纠缠破坏通道组的封闭性将结果扩展到任意通道。因此，$\\Lambda_1 \\otimes \\Lambda_2 \\in \\mathrm{EA}$ 意味着 $\\Lambda_2 \\circ \\Lambda_1 \\in \\mathrm{EB}$，并且通过交换两个通道，对于相反的组合顺序也同样成立。\n\n这证明了最近的猜想，即在最初定义最优性的可行性意义上，中点放置对于所有量子位通道都是最优的。", "authors": [{"name": "Samuel Marquez Gonzalez"}], "featured_authors": [{"name": "Samuel Marquez Gonzalez"}], "author_count": 1}, {"id": "2609.18806", "category": "quant-ph", "title": "Fast Evaluation of the Sixth-Order Time-Convolutionless Master-Equation Generator and Beyond", "abstract": "Direct quadrature of the Hadamard-reduced sixth-order time-convolutionless (TCL6) generator at all $N_t$ sampled times requires $O(N_t^3)$ operations at fixed system dimension. We derive an exact reduction for a finite-dimensional system coupled through one Hermitian operator to a stationary centered Gaussian bath. By separating fixed operator coefficients from scalar bath kernels, the complete TCL6 time series is reduced to cumulative sums and first-order recurrences, one-dimensional causal convolutions, and an exact dyadic recursion for interlocked histories. With the algorithm, evaluating the complete TCL6 time series requires $O(N_t\\log^2 N_t)$ operations at fixed system dimension. In addition, we show that TCL$2n$ can be evaluated with $O(N_t\\log^{n-1} N_t)$ complexity. A fixed finite Matsubara expansion of the bath correlation function permits $O(N_t\\log N_t)$ evaluation at any fixed TCL order. These reductions enable fast long-time simulations of non-Markovian open quantum systems within the regime of validity of the TCL expansion.", "url": "https://arxiv.org/abs/2609.18806", "type": "理论+数值", "summary": "在所有 $N_t$ 采样时间对哈达玛简化六阶时间无卷积 (TC​​L6) 生成器进行直接求积需要在固定系统维度进行 $O(N_t^3)$ 运算。我们推导了通过一个埃尔米特算子耦合到固定中心高斯浴的有限维系统的精确约简。通过将固定算子系数与标量浴核分离，完整的 TCL6 时间序列被简化为累积和和一阶递归、一维因果卷积以及互锁历史的精确二元递归。使用该算法，评估完整的 TCL6 时间序列需要在固定系统维度上执行 $O(N_t\\log^2 N_t)$ 操作。此外，我们还表明 TCL$2n$ 可以用 $O(N_t\\log^{n-1} N_t)$ 复杂度进行评估。浴相关函数的固定有限 Matsubara 展开允许在任何固定 TCL 阶数下进行 $O(N_t\\log N_t)$ 计算。这些减少使得能够在 TCL 展开的有效性范围内对非马尔可夫开放量子系统进行快速长时间模拟。", "authors": [{"name": "Jiahao Chen"}, {"name": "Sirui Chen"}, {"name": "Dragomir Davidovic"}], "featured_authors": [{"name": "Jiahao Chen"}, {"name": "Sirui Chen"}, {"name": "Dragomir Davidovic"}], "author_count": 3}, {"id": "2609.18911", "category": "quant-ph", "title": "Hamiltonian engineering via pulses: beyond group averaging", "abstract": "We develop a geometric framework for Hamiltonian engineering in finite-dimensional quantum systems using ideal control pulses. Starting from a bilinear Schrödinger equation with unbounded control amplitudes, we construct the closed pulse group and use extensions of control systems and Filippov's relaxation theorem to obtain a family of effective Hamiltonians given by the convex hull of the drift's adjoint orbit plus the Lie algebra of the pulse group. The geometry of this orbitope describes possibilities beyond group averaging. Using the isotypic decomposition of the adjoint representation, we characterize its affine hull and show that the group average lies in its interior. This yields locally accessible families of effective Hamiltonians around the invariant part of the drift. We apply the framework to recover the necessary and sufficient condition for dynamical decoupling from arbitrary interactions with a finite-dimensional bath. For connected abelian pulse groups, we describe the relevant representation decomposition through restricted roots. Finally, for qubit networks with identical pairwise couplings, we give a qualitative characterization and quantitative estimation of effective Hamiltonians that can be generated using our framework.", "url": "https://arxiv.org/abs/2609.18911", "type": "理论", "summary": "我们使用理想控制脉冲为有限维量子系统中的哈密顿工程开发了几何框架。从具有无界控制幅度的双线性薛定谔方程出发，构造闭合脉冲群，并利用控制系统的扩展和 Filippov 松弛定理获得由漂移伴随轨道的凸包加上脉冲群的李代数给出的一系列有效哈密顿量。该轨道的几何形状描述了超出组平均的可能性。使用伴随表示的同型分解，我们描述了它的仿射包并表明群平均值位于其内部。这会在漂移的不变部分周围产生局部可访问的有效哈密顿量族。我们应用该框架来恢复与有限维浴的任意相互作用的动态解耦的必要和充分条件。对于连通的阿贝尔脉冲群，我们通过受限根描述相关的表示分解。\n\n最后，对于具有相同成对耦合的量子位网络，我们给出了可以使用我们的框架生成的有效哈密顿量的定性表征和定量估计。", "authors": [{"name": "Ivan Beschastnyi"}, {"name": "Lucah Patel"}, {"name": "David Tinoco"}], "featured_authors": [{"name": "Ivan Beschastnyi"}, {"name": "Lucah Patel"}, {"name": "David Tinoco"}], "author_count": 3}, {"id": "2609.18922", "category": "quant-ph", "title": "Exact logical error rates for magic state cultivation", "abstract": "We compute exactly the acceptance and logical error rates for the distance $d=3$ and $d=5$ magic state cultivation circuits from Clifft [ arXiv:2604.27058 ] and SOFT [ arXiv:2512.23037 ] using Pauli propagation and binary tensor contraction. Actual $T$ gates are studied, not the $S$-gate proxy used for sampling. The calculation includes every fault order at several circuit-level noise strengths ($p$). We provide a series expansion form to the logical error rates, through order $(p/(1-p))^{10}$. The analytical results recover the numerical values from Clifft and SOFT at both $d=3$ and $d=5$ to within their sampling uncertainty. Then, we show that the $d=3$ and $d=5$ circuits actually have fault distances of $d_{\\text{fault}}=2$ and $d_{\\text{fault}}=3$ respectively, explaining the similar distance degrading effects from the companion code of [Quantum 10, 2134 (2026)].", "url": "https://arxiv.org/abs/2609.18922", "type": "理论+数值", "summary": "我们使用泡利传播和二元张量收缩从 Clifft [ arXiv:2604.27058 ] 和 SOFT [ arXiv:2512.23037 ] 精确计算距离 $d=3$ 和 $d=5$ 魔法状态培养电路的接受率和逻辑错误率。研究的是实际的 $T$ 门，而不是用于采样的 $S$ 门代理。计算包括多个电路级噪声强度 ($p$) 下的每个故障顺序。我们通过 $(p/(1-p))^{10}$ 顺序为逻辑错误率提供级数展开形式。分析结果将 $d=3$ 和 $d=5$ 时 Clifft 和 SOFT 的数值恢复到采样不确定性范围内。然后，我们证明 $d=3$ 和 $d=5$ 电路实际上分别具有 $d_{\\text{fault}}=2$ 和 $d_{\\text{fault}}=3$ 的故障距离，解释了 [Quantum 10, 2134 (2026)] 的伴随代码中类似的距离降级效应。", "authors": [{"name": "Kwok Ho Wan"}, {"name": "Ainhoa Zapirain"}], "featured_authors": [{"name": "Kwok Ho Wan"}, {"name": "Ainhoa Zapirain"}], "author_count": 2}, {"id": "2609.18948", "category": "quant-ph", "title": "Optimal Temporal Hiding in Correlated Quantum Reference-Frame Processes", "abstract": "A finite group-valued temporal reference frame defines a correlated random-unitary process rather than a list of independent channels. We identify a regime in which its complete trajectory law is an exact operational coordinate. If the carrier contains every irreducible representation of the finite group $G$, one ancilla-assisted input resolves all group elements, and for arbitrary laws $\\mu,\\nu$ on $G^n$ the strategy half-distance equals $d_{\\mathrm{TV}}(\\mu,\\nu)$. Optimal output-side causal post-processing likewise reduces to classical convolution on $G^n$. This converts temporal hiding into a $q$-ary coding problem. Uniform coset laws of an $[n,k]_q$ code are identical on every set of fewer than $d(C^\\perp)$ slots and perfectly distinguishable globally. For $M$ sectors with leakage at most $\\eta$ from $t$ selected slots and global decoding error $\\epsilon$, we obtain $(1-\\epsilon)\\log M \\leq (n-t)\\log q+\\eta+h_2(\\epsilon)$. For nested codes $C\\subset D$, the payload $R=\\dim D-\\dim C$, invisible depth $t=d_{\\mathrm{rel}}(C^\\perp,D^\\perp)-1$, and sector distance $d_{\\mathrm{rel}}(D,C)$ obey $R+t+d_{\\mathrm{rel}}(D,C)-1\\leq n$ and $R+t+2e+f\\leq n$, where $e$ and $f$ are adversarial errors and known erasures. Nested generalized Reed-Solomon codes attain the bounds in their existence range. We also give the exact projection-rank leakage profile and show that hiding arbitrary coherent superpositions from $t$ slots is precisely quantum erasure correction, yielding $\\log_q K+2t\\leq n$. The results separate classical trajectory privacy from coherent temporal privacy and quantify the robust payload hidden from reduced process tomography.", "url": "https://arxiv.org/abs/2609.18948", "type": "理论", "summary": "有限群值时间参考系定义相关随机酉过程而不是独立通道列表。我们确定了一个政权，其中其完整的轨迹定律是一个精确的操作坐标。如果载体包含有限群 $G$ 的每个不可约表示，则一个辅助辅助输入可解析所有群元素，并且对于 $G^n$ 上的任意定律 $\\mu,\\nu$，策略半距离等于 $d_{\\mathrm{TV}}(\\mu,\\nu)$。最佳输出侧因果后处理同样简化为 $G^n$ 上的经典卷积。这将时间隐藏转换为 $q$ 元编码问题。 $[n,k]_q$ 代码的统一陪集法则在每组少于 $d(C^\\perp)$ 时隙上都是相同的，并且在全局范围内完全可区分。对于 $M$ 个扇区，从 $t$ 个选定槽泄漏至多 $\\eta$ 且全局解码错误 $\\epsilon$，我们获得 $(1-\\epsilon)\\log M \\leq (n-t)\\log q+\\eta+h_2(\\epsilon)$。\n\n对于嵌套代码 $C\\subset D$，有效负载 $R=\\dim D-\\dim C$，不可见深度 $t=d_{\\mathrm{rel}}(C^\\perp,D^\\perp)-1$，扇区距离 $d_{\\mathrm{rel}}(D,C)$ 服从 $R+t+d_{\\mathrm{rel}}(D,C)-1\\leq n$ 和$R+t+2e+f\\leq n$，其中$e$和$f$是对抗性错误和已知擦除。嵌套广义里德-所罗门码达到了其存在范围的界限。我们还给出了精确的投影秩泄漏曲线，并表明从 $t$ 时隙中隐藏任意相干叠加正是量子擦除校正，产生 $\\log_q K+2t\\leq n$。结果将经典轨迹隐私与相干时间隐私分开，并量化了隐藏在简化过程层析成像中的鲁棒有效负载。", "authors": [{"name": "Maxim V. Churilov"}], "featured_authors": [{"name": "Maxim V. Churilov"}], "author_count": 1}, {"id": "2609.18969", "category": "quant-ph", "title": "A Gauge Sign Rule for Quantum Rotor Networks", "abstract": "The sign problem is the non-positive path-integral weight that makes a quantum system hard to simulate classically. It shows up in problems that look unrelated, from fermion antisymmetry and geometric frustration to real-time evolution, topological angles, and finite density. We study it here for compact continuous variables, modeled as networks of quantum rotors, $\\hat H=\\sum_i 4E_C(\\hat n_i-n_{g,i})^2-\\sum_{\\langle ij\\rangle} E_{ij}\\cos(\\hat\\phi_i-\\hat\\phi_j-\\theta_{ij})$. For these, a single gauge-invariant quantity controls the obstruction, the frustration flux through the independent loops of the interaction graph. We prove a sign rule, the rotor analogue of Marshall's. The charge-basis Hamiltonian is sign-free if and only if every loop flux vanishes modulo $2\\pi$. Exact diagonalization and density-matrix renormalization then show that the sign cost is a gauge-invariant function of the flux. For a single loop it vanishes at zero flux, peaks at $\\pi$, and is exponentially small in the loop's perimeter. Summed over many loops it is extensive, growing with system size. The same loop flux generates the sign of three problems usually treated apart, namely the Mott transition (through the slave-rotor mapping), compact $U(1)$ lattice gauge theory, and frustrated continuous optimization. A superconducting rotor array realizes both the model and its sign natively.", "url": "https://arxiv.org/abs/2609.18969", "type": "理论+数值", "summary": "符号问题是非正路径积分权重，这使得量子系统难以进行经典模拟。它出现在看似无关的问题中，从费米子反对称和几何挫败到实时演化、拓扑角度和有限密度。我们在这里研究紧凑连续变量，建模为量子转子网络，$\\hat H=\\sum_i 4E_C(\\hat n_i-n_{g,i})^2-\\sum_{\\langle ij\\rangle} E_{ij}\\cos(\\hat\\phi_i-\\hat\\phi_j-\\theta_{ij})$。对于这些，单个规范不变量控制阻碍，即通过交互图的独立循环的挫败通量。我们证明了一个符号规则，马歇尔的转子类似物。当且仅当每个环路通量以 $2\\pi$ 为模消失时，基于电荷的哈密顿量才是无符号的。精确对角化和密度矩阵重整化表明符号成本是通量的规范不变函数。对于单个环路，它在零通量时消失，在 $\\pi$ 处达到峰值，并且在环路周长中呈指数小。经过许多循环的总结，它是广泛的，并且随着系统规模的增长而增长。\n\n相同的环路通量产生通常分开处理的三个问题的符号，即莫特转变（通过从转子映射）、紧凑$U(1)$晶格规范理论和受挫连续优化。超导转子阵列本身实现了模型及其符号。", "authors": [{"name": "Swagata Acharya"}], "featured_authors": [{"name": "Swagata Acharya"}], "author_count": 1}, {"id": "2609.18978", "category": "quant-ph", "title": "Code-Visible Liouvillian Modes and Coherent Logical Errors in Quantum Codes", "abstract": "Coherent Hamiltonian drifts and systematic errors can pass through quantum error correction differently than stochastic Pauli noise: they generate phase components of the logical channel that are lost under full Pauli twirling. We consider the Lindbladian dynamics of \\(n\\) physical qubits propagated through an effective logical channel of a fixed encoding, recovery, and decoding scheme. The work is methodological in character: standard ideas of observability and minimal realization from linear systems theory are applied to the channel \\[ \\omega \\mapsto \\Phi_t(\\omega) = \\cD e^{t\\cL}\\cE(\\omega), \\] where \\(\\cE\\) encodes the logical state and \\(\\cD\\) is the chosen recovery map with final decoding. The minimal code-visible space \\(\\cK_{\\rm code}\\) is defined as the Krylov closure of the decodable logical observables with respect to \\(\\cL^\\dagger\\); its observable factorization yields a minimal realization of the logical channel. In this form, the Knill--Laflamme conditions serve as a short-time consistency check, Pauli noise on stabilizer codes reduces to a chain on syndrome-logical classes, and the choice of recovery map acts as a spectral filter on the visible modes. For quantum memory, the same language yields an estimate of the storage time in terms of the dominant visible eigenvalues of the logical channel of the correction cycle. Particular attention is paid to the spectral signatures of coherent noise and to how these signatures depend on the chosen decoder.", "url": "https://arxiv.org/abs/2609.18978", "type": "理论", "summary": "相干哈密顿漂移和系统误差可以通过与随机泡利噪声不同的量子误差校正：它们生成逻辑通道的相位分量，这些分量在完全泡利旋转下丢失。我们考虑通过固定编码、恢复和解码方案的有效逻辑通道传播的 n 个物理量子位的 Lindbladian 动力学。这项工作本质上是方法论的：线性系统理论中的可观测性和最小实现的标准思想应用于通道 \\[ \\omega \\mapsto \\Phi_t(\\omega) = \\cD e^{t\\cL}\\cE(\\omega), \\] 其中 \\(\\cE\\) 编码逻辑状态，\\(\\cD\\) 是最终解码时选择的恢复图。最小代码可见空间 \\(\\cK_{\\rm code}\\) 定义为可解码逻辑可观测量相对于 \\(\\cL^\\dagger\\) 的 Krylov 闭包；它的可观察因式分解产生了逻辑通道的最小实现。在这种形式中，克尼尔-拉弗拉姆条件用作短时一致性检查，稳定器代码上的泡利噪声减少为综合症逻辑类别上的链，并且恢复图的选择充当可见模式上的光谱滤波器。\n\n对于量子存储器，相同的语言根据校正周期的逻辑通道的主要可见特征值产生存储时间的估计。特别关注相干噪声的频谱特征以及这些特征如何依赖于所选解码器。", "authors": [{"name": "Marina Gordeychuk"}, {"name": "Oleg Kiselev"}], "featured_authors": [{"name": "Marina Gordeychuk"}, {"name": "Oleg Kiselev"}], "author_count": 2}, {"id": "2609.19018", "category": "quant-ph", "title": "Quantum-Classical Effective Fragment Potential Embedding for Condensed-Phase Quantum Chemistry", "abstract": "Quantum simulation of chemistry in realistic environments is constrained by the orbital cost of explicit solvent, ions, and other surroundings. We present the quantum-classical effective fragment potential (Q-EFP) method, in which a chemically active region is treated with a quantum algorithm and the environment is represented by the effective fragment potential (EFP) in GAMESS. Coulomb and polarization potentials enter the active-region one-electron Hamiltonian, while EFP-EFP and short-range environment contributions are assembled classically. Statevector UCCSD/STO-3G benchmarks for LiH in a mixed water/methanol environment, H2O in a five-water environment, and BeH2 in an ammonium/nitrate environment differ from matched classical CCSD/EFP calculations by 0.03, 0.38, and 0.01 kcal/mol, respectively. The active calculations require 4 to 8 qubits, compared with estimated full-system counts of approximately 84 to 246 qubits, corresponding to register reductions of about 10-fold to 35-fold. These proof-of-concept results validate the embedded Hamiltonian and Q-GAMESS workflow while separating environmental size from quantum-register size. Q-EFP is complementary to real-space Q-EFMO fragmentation and virtual-orbital Q-FVO reduction, enabling a layered route to larger solvated systems.", "url": "https://arxiv.org/abs/2609.19018", "type": "理论+数值", "summary": "现实环境中化学的量子模拟受到显式溶剂、离子和其他环境的轨道成本的限制。我们提出了量子经典有效碎片势（Q-EFP）方法，其中用量子算法处理化学活性区域，并且环境由GAMESS中的有效碎片势（EFP）表示。库仑和极化势进入活性区单电子哈密顿量，而 EFP-EFP 和短程环境贡献则以经典方式组装。 Statevector UCCSD/STO-3G 混合水/甲醇环境中的 LiH、五水环境中的 H2O 和铵/硝酸盐环境中的 BeH2 基准与匹配的经典 CCSD/EFP 计算分别相差 0.03、0.38 和 0.01 kcal/mol。主动计算需要 4 到 8 个量子位，而估计的全系统计数约为 84 到 246 个量子位，相当于寄存器减少约 10 倍到 35 倍。这些概念验证结果验证了嵌入式哈密顿量和 Q-GAMESS 工作流程，同时将环境大小与量子寄存器大小分开。\n\nQ-EFP 是对实空间 Q-EFMO 碎片和虚拟轨道 Q-FVO 还原的补充，能够为更大的溶剂化系统提供分层途径。", "authors": [{"name": "Federico Zahariev"}, {"name": "Vassiliki-Alexandra Glezakou"}, {"name": "Mark S. Gordon"}], "featured_authors": [{"name": "Federico Zahariev"}, {"name": "Vassiliki-Alexandra Glezakou"}, {"name": "Mark S. Gordon"}], "author_count": 3}, {"id": "2609.19026", "category": "quant-ph", "title": "Environment-aware transverse transport geometry for non-Gaussian oscillator states", "abstract": "Non-Gaussian oscillator states are highly sensitive to weak perturbations, but reversible phase rotations and irreversible environmental changes should not be weighted equally. We introduce a finite-dimensional, direction-dependent local transport cost on a truncated Fock space and quotient it by Hamiltonian tangent directions. The resulting transverse quantity is a seminorm, not a global distance. A weighted operator frame specifies the representation cost of physical fluxes. Although the frame ({a_M,a_M^\\dagger}) already spans the full trace-zero sector, multiphoton and diagonal directions can represent selected Lindblad tangents much more efficiently. Numerical tests on compass-like states show that phase rotations are removed, dephasing becomes inexpensive only after diagonal directions are included, and two- and three-photon processes are naturally captured by multiphoton frames. Thermal weights satisfy an operator-modular covariance but do not define a complete KMS geometry. The construction is therefore an environment-aware local diagnostic with explicit cutoff, regularization, and normalization conventions.", "url": "https://arxiv.org/abs/2609.19026", "type": "理论+数值", "summary": "非高斯振荡状态对弱扰动高度敏感，但可逆相位旋转和不可逆环境变化不应同等加权。我们在截断的福克空间上引入有限维、方向相关的局部传输成本，并通过哈密顿切线方向将其商。得到的横向量是半范数，而不是全局距离。加权算子框架指定物理通量的表示成本。尽管框架 ({a_M,a_M^\\dagger}) 已经跨越了整个零迹扇区，但多光子和对角线方向可以更有效地表示选定的 Lindblad 切线。对类似罗盘状态的数值测试表明，相位旋转被消除，只有在包括对角线方向后，移相才变得便宜，并且多光子帧自然地捕获了两光子和三光子过程。热权重满足算子模协方差，但不定义完整的 KMS 几何形状。因此，该构造是一个环境感知的局部诊断，具有明确的截止、正则化和标准化约定。", "authors": [{"name": "Arnaud Coatanhay"}, {"name": "Angelique Dremeau"}], "featured_authors": [{"name": "Arnaud Coatanhay"}, {"name": "Angelique Dremeau"}], "author_count": 2}, {"id": "2609.19027", "category": "quant-ph", "title": "Time of arrival in the semiclassical regime for Gaussian wave packets", "abstract": "We study the time-of-arrival (TOA) distribution of a Gaussian wave packet in the semiclassical regime for a general one-dimensional quadratic Hamiltonian, namely a forced harmonic oscillator with time-dependent frequency. Expanding the Gaussian probability density as a series in derivatives of the Dirac delta and using the standard rules for the composition of distributions with the classical trajectory, we obtain compact closed-form expressions for the leading semiclassical mean arrival time and its standard deviation. The mean acquires a quantum shift of order $\\sigma^2$ set by the classical velocity and acceleration and by the time derivative of the Ermakov width, while the spread reduces to the simple form $\\Delta\\mathcal{T}_x\\simeq\\sigma(t_x)/v_x$. The latter implies a time--position uncertainty relation that depends only on the fundamental solutions of the classical equation of motion. We apply the framework to free fall and to two models of a time-dependent opening trap under gravity, and we validate every expression against exact numerical integration of the TOA distribution. These results extend earlier free-fall predictions to realistic settings in which the trapping potential cannot be neglected.", "url": "https://arxiv.org/abs/2609.19027", "type": "理论+数值", "summary": "我们研究了一般一维二次哈密顿量（即频率随时间变化的受迫谐振子）的半经典状态下高斯波包的到达时间（TOA）分布。将高斯概率密度展开为狄拉克δ导数的级数，并使用经典轨迹分布的标准规则，我们获得了前导半经典平均到达时间及其标准差的紧凑封闭式表达式。均值获得 $\\sigma^2$ 阶的量子位移，该位移由经典速度和加速度以及 Ermakov 宽度的时间导数设置，而扩展则简化为简单形式 $\\Delta\\mathcal{T}_x\\simeq\\sigma(t_x)/v_x$。后者意味着时间-位置不确定关系，仅取决于经典运动方程的基本解。我们将该框架应用于自由落体和重力下随时间变化的开口陷阱的两个模型，并根据 TOA 分布的精确数值积分验证每个表达式。\n\n这些结果将早期的自由落体预测扩展到了不能忽视捕获潜力的现实环境。", "authors": [{"name": "Mathieu Beau"}, {"name": "Maximilien Barbier"}, {"name": "Vincent Bucourt"}], "featured_authors": [{"name": "Mathieu Beau"}, {"name": "Maximilien Barbier"}, {"name": "Vincent Bucourt"}], "author_count": 3}, {"id": "2609.19045", "category": "quant-ph", "title": "Quantum-Classical Fragmentation with the Effective Fragment Molecular Orbital Method", "abstract": "We present the quantum effective fragment molecular orbital (Q-EFMO) method, a hybrid framework that evaluates selected molecular-fragment correlation energies with the variational quantum eigensolver and assembles them through the size-consistent EFMO energy expression. A Hartree-Fock EFMO calculation supplies monomer references, many-body polarization, and distant-pair EFP interactions; independent VQE/UCCSD calculations provide correlation increments for monomers and selected near-field dimers. Consequently, the maximum quantum register is determined by the largest active fragment or fragment pair rather than by total system size. For a three-layer LiH benchmark in STO-3G, a full 2.5 to 3.5 Angstrom separation scan shows that two orbital-reduction schemes approach the full CCSD reference monotonically. The more aggressive scheme remains below 1 kcal/mol for separations of 2.6 Angstrom and greater and reaches 0.10 kcal/mol at 3.5 Angstrom, using 6 qubits for monomers and 12 for the largest dimers, compared with 14 qubits for the frozen-core dimer baseline. An implementation-specific cost proxy decreases from 1000 to 40, a factor of 25. These noise-free results establish the equations, software path, and resource scaling; broader chemical validation, larger bases, and hardware tests remain necessary.", "url": "https://arxiv.org/abs/2609.19045", "type": "理论+数值", "summary": "我们提出了量子有效片段分子轨道（Q-EFMO）方法，这是一种混合框架，可使用变分量子本征解算器评估选定的分子片段相关能，并通过尺寸一致的 EFMO 能量表达式将它们组装起来。 Hartree-Fock EFMO 计算提供单体参考、多体极化和远距离对 EFP 相互作用；独立的 VQE/UCCSD 计算提供单体和选定的近场二聚体的相关增量。因此，最大量子寄存器由最大的活动片段或片段对决定，而不是由总系统大小决定。对于 STO-3G 中的三层 LiH 基准，完整的 2.5 至 3.5 埃分离扫描表明，两种轨道缩减方案单调地接近完整的 CCSD 参考。更激进的方案对于 2.6 埃及以上的分离，保持在 1 kcal/mol 以下，并在 3.5 埃时达到 0.10 kcal/mol，使用 6 个量子位用于单体，12 个量子位用于最大二聚体，而冷冻核心二聚体基线使用 14 个量子位。特定于实现的成本代理从 1000 减少到 40，即 25 倍。\n\n这些无噪声结果建立了方程、软件路径和资源扩展；更广泛的化学验证、更大的基础和硬件测试仍然是必要的。", "authors": [{"name": "Federico Zahariev"}, {"name": "Vassiliki-Alexandra Glezakou"}, {"name": "Mark S. Gordon"}], "featured_authors": [{"name": "Federico Zahariev"}, {"name": "Vassiliki-Alexandra Glezakou"}, {"name": "Mark S. Gordon"}], "author_count": 3}, {"id": "2609.19116", "category": "quant-ph", "title": "Comparing magic state cultivation methods using matrix product states", "abstract": "Magic state cultivation prepares high-fidelity magic states at low expected space-time costs; however, the exact performance of some schemes is unsettled due to the difficulty in simulating non-Clifford circuits. Here, we use matrix-product states (MPS) based methods to compute the exact performance of two types of fold-transversal cultivation schemes: (i) the Sahay et al method based on the regular surface code S gate, and (ii) a method we propose based on a partially fault-tolerant fold-transversal S gate. We show that for the former protocol at $d=5$, the $|T\\rangle$ output reaches similar logical error rates to the $|S\\rangle$ output, traditionally used as a cheap full Clifford proxy. This contrasts with the $\\sim10\\times$ discrepancy reported for the $d=5$ colour-code scheme of Gidney et al. We also find that our new $d=5$ scheme has $\\sim1.3\\times$ lower expected space-time cost while still reaching $10^{-9}$ logical error rate. We show that MPS and Clifford-augmented MPS (CAMPS) perform on par with or even better than the recently introduced near-Clifford simulator Clifft on the hardest $d=5$ regular surface code scheme. Additionally, to speed up simulation, we propose a new pre-screening method based on simple Pauli propagation, lowering by up to three orders of magnitude the required number of exact simulations, and use several simulator-agnostic sampling methods such as subset sampling.", "url": "https://arxiv.org/abs/2609.19116", "type": "理论+数值", "summary": "魔态修炼以较低的预期时空成本准备出高保真的魔态；然而，由于模拟非 Clifford 电路的困难，一些方案的确切性能尚未确定。在这里，我们使用基于矩阵乘积状态（MPS）的方法来计算两种类型的折叠横向培养方案的精确性能：（i）基于常规表面代码S门的Sahay等人方法，以及（ii）我们提出的基于部分容错折叠横向S门的方法。我们表明，对于 $d=5$ 处的前一个协议，$|T\\rangle$ 输出达到与 $|S\\rangle$ 输出相似的逻辑错误率，传统上用作廉价的完整 Clifford 代理。这与 Gidney 等人的 $d=5$ 颜色代码方案报告的 $\\sim10\\times$ 差异形成对比。我们还发现，新的 $d=5$ 方案的预期时空成本降低了 $\\sim1.3\\times$，同时仍达到 $10^{-9}$ 逻辑错误率。我们表明，在最难的 $d=5$ 常规表面代码方案上，MPS 和 Clifford 增强 MPS (CAMPS) 的性能与最近推出的近 Clifford 模拟器 Clifft 相当甚至更好。\n\n此外，为了加速模拟，我们提出了一种基于简单泡利传播的新预筛选方法，将所需的精确模拟数量降低了三个数量级，并使用了几种与模拟器无关的采样方法，例如子集采样。", "authors": [{"name": "Tom Hartweg"}, {"name": "Asier Piñeiro Orioli"}], "featured_authors": [{"name": "Tom Hartweg"}, {"name": "Asier Piñeiro Orioli"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
