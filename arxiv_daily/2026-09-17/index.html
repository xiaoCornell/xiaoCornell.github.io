  <script>
    const papers = [{"id": "2609.17646", "category": "cond-mat", "title": "Robust and Efficient AI Frameworks for Scalable Material Design and Property Prediction", "abstract": "This thesis develops robust and efficient AI frameworks for accelerating crystalline materials discovery by addressing both major stages of the materials-design pipeline: crystal property prediction and crystal structure generation. Motivated by the high computational cost of Density Functional Theory (DFT) and the limited availability of labeled materials data, the thesis explores graph representation learning, pretraining, multimodal learning, and generative modeling for scalable materials design. For property prediction, the thesis first introduces CrysXPP, which learns transferable crystal representations through unsupervised graph autoencoding, reducing dependence on large property-labeled datasets. It then proposes CrysGNN, a large-scale self-supervised graph pretraining framework that captures atomic connectivity, chemical attributes, and global structural information and transfers this knowledge to downstream property predictors through knowledge distillation. CrysMMNet further enriches crystal representations by jointly modeling graph structure and textual descriptions, thereby incorporating both local chemical and global structural knowledge. For crystal generation, the thesis introduces TGDMat, a text-guided joint diffusion framework that jointly models lattice parameters, atomic types, and atomic coordinates while incorporating textual structural knowledge during denoising. This enables the generation of more valid and stable periodic materials while also supporting conditional generation from natural-language descriptions. Overall, the thesis establishes a unified AI-based framework for data-efficient property prediction and controllable crystal generation, demonstrating how graph learning, multimodal representations, and generative models can reduce computational cost and improve the scalability of materials", "url": "https://arxiv.org/abs/2609.17646", "type": "理论+数值", "summary": "本论文开发了强大而高效的人工智能框架，通过解决材料设计流程的两个主要阶段：晶体特性预测和晶体结构生成，来加速晶体材料的发现。由于密度泛函理论（DFT）的高计算成本和标记材料数据的有限可用性，本文探讨了可扩展材料设计的图表示学习、预训练、多模态学习和生成建模。对于属性预测，论文首先引入了 CrysXPP，它通过无监督图自动编码学习可转移的晶体表示，减少对大型属性标记数据集的依赖。然后提出了 CrysGNN，这是一种大规模自监督图预训练框架，可捕获原子连通性、化学属性和全局结构信息，并通过知识蒸馏将这些知识转移到下游属性预测器。 CrysMMNet 通过联合建模图结构和文本描述进一步丰富了晶体表示，从而结合了局部化学和全局结构知识。\n\n对于晶体生成，论文引入了 TGDMat，这是一种文本引导的联合扩散框架，可以对晶格参数、原子类型和原子坐标进行联合建模，同时在去噪过程中结合文本结构知识。这使得能够生成更有效和稳定的周期材料，同时还支持自然语言描述的条件生成。总体而言，论文建立了一个基于人工智能的统一框架，用于数据高效的属性预测和可控晶体生成，展示了图学习、多模态表示和生成模型如何降低计算成本并提高材料的可扩展性", "authors": [{"name": "Kishalay Das"}], "featured_authors": [{"name": "Kishalay Das"}], "author_count": 1}, {"id": "2609.17678", "category": "cond-mat", "title": "Brownian motion with geometry-dependent hydrodynamic memory", "abstract": "Micron-sized particles moving through a fluid are subject to viscous resistance and thermal fluctuations. Beyond steady Stokes friction, colloids also exhibit hydrodynamic memory effects arising from conservation laws of the surrounding fluid. Although fluid-flow problems in complex geometries and confinements are often highly involved, numerical or approximate solutions can be obtained; translating these solutions into closed-form equations of motion for individual colloids, however, is rarely possible. Here, we develop a theoretical framework that provides both underdamped and overdamped colloidal dynamics from the solution of an arbitrary flow problem: (i) Using the Lorentz reciprocal theorem, we express the colloidal equation of motion in terms of the geometry's Green's function and the fluid-flow profile. This formulation yields both the corresponding Stokes drag as well as a Basset-like hydrodynamic memory contribution. (ii) As colloid inertia is often negligible, we furthermore derive the corresponding overdamped (colloid-inertia-less) limit, which inherits the Stokes and Basset-like resistances and additionally gives rise to a spurious drift. We propose applications of this framework to passive and active particles subject to involved confinements and problem geometries.", "url": "https://arxiv.org/abs/2609.17678", "type": "理论+数值", "summary": "在流体中移动的微米级颗粒会受到粘性阻力和热波动的影响。除了稳定的斯托克斯摩擦力之外，胶体还表现出由周围流体的守恒定律引起的流体动力学记忆效应。尽管复杂几何形状和约束条件下的流体流动问题常常涉及很多，但仍可以获得数值或近似解；然而，将这些解转化为单个胶体的封闭式运动方程几乎是不可能的。在这里，我们开发了一个理论框架，从任意流动问题的解决方案中提供欠阻尼和过阻尼胶体动力学：（i）使用洛伦兹倒数定理，我们用几何格林函数和流体流动剖面来表达胶体运动方程。该公式产生相应的斯托克斯阻力以及类似巴塞特的流体动力记忆贡献。 (ii) 由于胶体惯性通常可以忽略不计，我们进一步推导了相应的过阻尼（无胶体惯性）极限，该极限继承了斯托克斯和巴塞特式电阻，并另外引起了虚假漂移。\n\n我们建议将该框架应用于受所涉及的限制和问题几何形状影响的被动和主动粒子。", "authors": [{"name": "Benjamin Sorkin"}, {"name": "Günther Turk"}, {"name": "Howard A. Stone"}], "featured_authors": [{"name": "Benjamin Sorkin"}, {"name": "Günther Turk"}, {"name": "Howard A. Stone"}], "author_count": 3}, {"id": "2609.17716", "category": "cond-mat", "title": "Activity-induced emergent flatness, instabilities and pattern formation in fluid membranes", "abstract": "We show that microscopically inversion-asymmetric, permeable active fluid membranes are statistically flat and effectively inversion-symmetric at large scales. Their fluctuations are governed by an asymptotically exact linear hydrodynamic equation giving orientational long-range order and positional quasi-long-range order. At intermediate scales, their dynamics is described by a Kardar-Parisi-Zhang equation with spatially long-range noise, producing rough membranes with short-range translational and long-range orientational order described by exactly known scaling exponents. Active stresses can destabilize the membrane at long wavelengths, while sufficiently strong active permeation flow can drive finite-wavevector instabilities and pattern formation. These results reveal a novel activity-driven route to the destruction of flat fluid membranes.", "url": "https://arxiv.org/abs/2609.17716", "type": "理论", "summary": "我们表明，微观上反演不对称、可渗透的活性流体膜在统计上是平坦的，并且在大尺度上实际上是反演对称的。它们的波动由渐近精确的线性流体动力学方程控制，该方程给出了方向长程序和位置准长程序。在中间尺度上，它们的动力学由带有空间长程噪声的 Kardar-Parisi-Zhang 方程描述，产生具有由精确已知的缩放指数描述的短程平移和长程取向顺序的粗糙膜。主动应力会使膜在长波长下不稳定，而足够强的主动渗透流会导致有限波矢量不稳定和图案形成。这些结果揭示了一种破坏平坦流体膜的新的活动驱动途径。", "authors": [{"name": "Debayan Jana"}, {"name": "Astik Haldar"}, {"name": "Abhik Basu"}], "featured_authors": [{"name": "Debayan Jana"}, {"name": "Astik Haldar"}, {"name": "Abhik Basu"}], "author_count": 3}, {"id": "2609.17741", "category": "cond-mat", "title": "A Multipolar Approach to Sliding Ferroelectricity", "abstract": "Traditional theoretical treatments of ferroelectricity do not straightforwardly extend to sliding ferroelectrics, which are increasingly-studied layered materials where a switchable electrical polarization is controlled by two-dimensional relative motion of the stacked layers. Therefore, in-depth analyses of the underlying processes which dictate their polarization behavior remain challenging. In this paper, we present a comprehensive approach for identifying the symmetry-adapted microscopic parameters which are responsible for driving the emergence of this polarization. First, we outline our approach, which appeals to group theory arguments and the distortion of Wannier orbital densities to connect macroscopic symmetries to the microscopic electronic distortions which dictate the appearance of ferroelectricity. Then, we illustrate this process by using density functional theory to apply our strategy to honeycomb bilayer systems, including hexagonal boron nitride. In this way, we find that combinations of dipole-like and quadrupole-like distortions of lone pair electron orbitals control electronic reorganization, and by extension, ferroelectricity in such systems.", "url": "https://arxiv.org/abs/2609.17741", "type": "理论+数值", "summary": "铁电性的传统理论处理并不能直接扩展到滑动铁电体，滑动铁电体是越来越多研究的层状材料，其中可切换的电极化是由堆叠层的二维相对运动控制的。因此，对决定其极化行为的基本过程进行深入分析仍然具有挑战性。在本文中，我们提出了一种综合方法来识别对称适应的微观参数，这些参数负责驱动这种极化的出现。首先，我们概述了我们的方法，该方法利用群论论证和万尼尔轨道密度的畸变，将宏观对称性与决定铁电性外观的微观电子畸变联系起来。然后，我们通过使用密度泛函理论将我们的策略应用于蜂窝双层系统（包括六方氮化硼）来说明这一过程。通过这种方式，我们发现孤对电子轨道的类偶极子和类四极子畸变的组合控制着电子重组，进而控制了此类系统中的铁电性。", "authors": [{"name": "Matthew Dykes"}], "featured_authors": [{"name": "Matthew Dykes"}], "author_count": 1}, {"id": "2609.17794", "category": "cond-mat", "title": "What does \"instant thermalization\" in large-$q$ SYK models mean?", "abstract": "Motivated by the Planckian thermalization rate $\\Gamma \\sim T$ observed in the two-body interacting SYK model, we study thermalization in the $q/2$-body case. Previous studies of such systems have established the notion of instantaneous thermalization to leading order in $1/q$. It was conjectured that the thermalization may still be Planckian but with a divergent rate $\\Gamma \\sim T q$, explaining the ``instantaneous'' part. For an analytically and numerically tractable system, we calculate the effective temperatures after a quench at time $t = 0$ and indeed find a Planckian rate, albeit with the unexpected decaying behavior $\\Gamma \\sim T q^{-1} $. This is contrasted with the behavior of the causal Green's function $\\mathcal{G}(t_1, t_2)$, which instantly acquires a thermal form in the two-time plane block $t_1, t_2 > 0$. The resulting picture is that instant thermalization is a meaningful concept only for this block, while the off-diagonal blocks $t_1 \\cdot t_2 < 0$ are inherently non-thermal at any $q$. Since the effective temperature is obtained from correlations spanning all blocks, it inherits a finite rate set by the off-diagonal. We illustrate this directly by studying the non-thermal correlations' time dependence.", "url": "https://arxiv.org/abs/2609.17794", "type": "理论+数值", "summary": "受两体相互作用 SYK 模型中观察到的普朗克热化率 $\\Gamma \\sim T$ 的启发，我们研究了 $q/2$ 体情况下的热化。先前对此类系统的研究已经建立了瞬时热化到 1/q$ 领先顺序的概念。据推测，热化可能仍然是普朗克式的，但具有不同的速率 $\\Gamma \\sim T q$，解释了“瞬时”部分。对于分析和数值上易于处理的系统，我们计算了 $t = 0$ 时刻淬火后的有效温度，并且确实找到了普朗克速率，尽管存在意外的衰减行为 $\\Gamma \\sim T q^{-1} $。这与因果格林函数 $\\mathcal{G}(t_1, t_2)$ 的行为形成对比，后者立即在两次平面块 $t_1, t_2 > 0$ 中获得热形式。由此产生的结果是，即时热化仅对于该块来说是一个有意义的概念，而非对角线块 $t_1 \\cdot t_2 < 0$ 在任何 $q$ 处本质上是非热的。由于有效温度是从跨越所有块的相关性获得的，因此它继承了非对角线设置的有限速率。\n\n我们通过研究非热相关性的时间依赖性来直接说明这一点。", "authors": [{"name": "Alexander Osterkorn"}, {"name": "Jan C. Louw"}], "featured_authors": [{"name": "Alexander Osterkorn"}, {"name": "Jan C. Louw"}], "author_count": 2}, {"id": "2609.17968", "category": "cond-mat", "title": "Prediction of the maximum penetration of a circular intruder in a two-dimensional granular bed from its early trajectory using Machine Learning", "abstract": "We test whether the maximum penetration depth of a circular intruder into a two-dimensional granular bed can be predicted from its early trajectory using machine learning, without giving the intruder density. From 100 DEM simulations with varying density, we extract kinematic features from the first 50 ms. Ridge and Random Forest predict the maximum penetration. A single feature (the intruder height at 50 ms) concentrates almost all predictive power, showing that density information is already encoded in the early impact response.", "url": "https://arxiv.org/abs/2609.17968", "type": "数值", "summary": "我们测试是否可以使用机器学习从圆形入侵者的早期轨迹预测圆形入侵者进入二维颗粒床的最大穿透深度，而无需给出入侵者密度。从 100 个不同密度的 DEM 模拟中，我们提取前 50 毫秒的运动学特征。岭和随机森林预测最大渗透率。单个特征（50 毫秒时的入侵者高度）集中了几乎所有的预测能力，表明密度信息已经编码在早期撞击响应中。", "authors": [{"name": "Patricia Altshuler"}], "featured_authors": [{"name": "Patricia Altshuler"}], "author_count": 1}, {"id": "2609.17988", "category": "cond-mat", "title": "The quantum Mpemba effect in symmetric random Clifford circuits", "abstract": "The quantum Mpemba effect is the counterintuitive phenomenon whereby a quantum state initially farther from equilibrium relaxes faster than one initially closer to it. We demonstrate this effect in random Clifford circuits with a conserved $\\mathrm{U}(1)$ charge, using the entanglement asymmetry to characterize relaxation through dynamical symmetry restoration. Exact numerical simulations show that an initially more asymmetric state can become locally more symmetric than an initially less asymmetric one. We explain this behavior by mapping the dynamics onto a charge-conserving quantum automaton, in which the decay of the entanglement asymmetry is controlled by the statistics of encounters between two particle species evolving according to a symmetric simple exclusion process. This mapping yields an analytic expression for the entanglement asymmetry and provides a simple microscopic mechanism for the quantum Mpemba effect: stronger initial symmetry breaking corresponds to a denser particle configuration, which enhances the frequency of particle encounters and thereby accelerates symmetry restoration.", "url": "https://arxiv.org/abs/2609.17988", "type": "理论+数值", "summary": "量子姆潘巴效应是一种违反直觉的现象，最初远离平衡的量子态比最初接近平衡的量子态弛豫得更快。我们在具有保守 $\\mathrm{U}(1)$ 电荷的随机 Clifford 电路中证明了这种效应，使用纠缠不对称性通过动态对称性恢复来表征弛豫。精确的数值模拟表明，最初更不对称的状态可以比最初不那么不对称的状态变得局部更对称。我们通过将动力学映射到电荷守恒量子自动机上来解释这种行为，其中纠缠不对称性的衰减由根据对称简单排除过程演化的两个粒子种类之间的相遇统计数据控制。这种映射产生了纠缠不对称性的解析表达式，并为量子 Mpemba 效应提供了一个简单的微观机制：更强的初始对称性破缺对应于更密集的粒子配置，这提高了粒子相遇的频率，从而加速对称性恢复。", "authors": [{"name": "Shion Yamashika"}, {"name": "Filiberto Ares"}, {"name": "Pasquale Calabrese"}], "featured_authors": [{"name": "Shion Yamashika"}, {"name": "Filiberto Ares"}, {"name": "Pasquale Calabrese"}], "author_count": 3}, {"id": "2609.18059", "category": "cond-mat", "title": "Disentangling Strain and Ti3+ Contributions to the Anomalous Hall Effect in Epitaxial RuO2 Films", "abstract": "The anomalous Hall effect (AHE) reported in epitaxial RuO2/TiO2 has been attributed to a strain-stabilized magnetic state, but strain can be entangled with Ru-Ti intermixing and interfacial charge redistribution, which can produce Ti3+ and potentially localized moments. Here, we disentangle these contributions using Ti-alloyed RuO2 heterostructures in which abundant Ti3+ states are retained while epitaxial strain is independently changed. The strained and relaxed films have nearly identical Ti/Ru compositions and comparable Ti3+ fractions, yet a pronounced nonlinear AHE appears only in the coherently strained film, while the relaxed heterostructure exhibits an almost linear Hall response. Spectroscopic ellipsometry further shows that the AHE-active strained state is accompanied by a reconstruction of the itinerant electronic response, including enhanced metallicity and longer carrier relaxation times. These results show that Ti3+ formation alone is insufficient to generate the anomalous Hall state and identify epitaxial strain, through its modification of the itinerant RuO2 electronic structure, as the dominant control parameter.", "url": "https://arxiv.org/abs/2609.18059", "type": "理论", "summary": "外延 RuO2/TiO2 中报道的反常霍尔效应 (AHE) 归因于应变稳定的磁态，但应变可能与 Ru-Ti 混合和界面电荷重新分布纠缠在一起，从而产生 Ti3+ 和潜在的局部矩。在这里，我们使用钛合金 RuO2 异质结构来理清这些贡献，其中保留了丰富的 Ti3+ 态，同时外延应变独立改变。应变和松弛薄膜具有几乎相同的 Ti/Ru 成分和相当的 Ti3+ 分数，但显着的非线性 AHE 仅出现在相干应变薄膜中，而松弛异质结构表现出几乎线性的霍尔响应。光谱椭圆光度术进一步表明，AHE 活性应变状态伴随着巡回电子响应的重建，包括增强的金属丰度和更长的载流子弛豫时间。这些结果表明，仅 Ti3+ 形成不足以产生反常霍尔态并通过其对流动 RuO2 电子结构的修改作为主要控制参数来识别外延应变。", "authors": [{"name": "S. G. Jeong"}, {"name": "A. Santhosh"}, {"name": "S. Lee"}, {"name": "S. Sheikh"}, {"name": "U. M. Jayathilake"}, {"name": "T. -L. Lee"}, {"name": "T. Low"}, {"name": "A. X. Gray"}, {"name": "S. A. Chambers"}, {"name": "B. Jalan"}], "featured_authors": [{"name": "S. G. Jeong"}, {"name": "A. Santhosh"}, {"name": "S. Lee"}, {"name": "A. X. Gray"}, {"name": "S. A. Chambers"}, {"name": "B. Jalan"}], "author_count": 10}, {"id": "2609.18090", "category": "cond-mat", "title": "Microscopic theory of spin-torque ferromagnetic resonance in nonmagnetic-metal/ferromagnetic-metal heterostructures", "abstract": "We develop a microscopic theory of spin-torque ferromagnetic resonance (ST-FMR) in nonmagnetic-metal/ferromagnetic-metal heterostructures. Tracing out the conduction-electron degrees of freedom in the FM, we derive an effective interfacial exchange coupling between the localized spins and the conduction electron spins in the adjacent electron system. Based on this interaction, we calculate the current-induced driving torque, resonance-frequency shift, damping modulation, and resulting dc voltage. As a concrete example, we apply the formulation to a disordered Rashba two-dimensional electron gas and demonstrate that the ST-FMR spectrum reflects the dynamical spin responses of the adjacent electron system. Our formulation applies to a broad class of heterostructures and establishes a unified microscopic framework connecting ST-FMR spectra directly to the electronic spin responses of adjacent systems.", "url": "https://arxiv.org/abs/2609.18090", "type": "理论", "summary": "我们开发了非磁性金属/铁磁性金属异质结构中自旋扭矩铁磁共振（ST-FMR）的微观理论。追踪 FM 中的传导电子自由度，我们推导出局域自旋与相邻电子系统中的传导电子自旋之间的有效界面交换耦合。基于这种相互作用，我们计算电流感应驱动扭矩、谐振频移、阻尼调制和产生的直流电压。作为一个具体的例子，我们将该公式应用于无序的 Rashba 二维电子气，并证明 ST-FMR 谱反映了相邻电子系统的动态自旋响应。我们的公式适用于广泛的异质结构，并建立了一个统一的微观框架，将 ST-FMR 光谱直接连接到相邻系统的电子自旋响应。", "authors": [{"name": "Takumi Funato"}, {"name": "Takeo Kato"}], "featured_authors": [{"name": "Takumi Funato"}, {"name": "Takeo Kato"}], "author_count": 2}, {"id": "2609.18093", "category": "cond-mat", "title": "Entropy Estimates from Stochastic Interpolants", "abstract": "We present a general method for estimating entropy differences between arbitrary probability distributions using stochastic interpolants. The marginal distributions which bridge the base and target obey a continuity equation, which allows a straightforward calculation of the entropy difference in terms of an inner product of the probability flow velocity and score fields. This formulation has several advantages: (i) no computationally expensive divergence calculations of either field are required, (ii) the score field need not even be learned directly if model transferability is not required, and (iii) on-the-fly estimates are produced nearly for free during training. When tractable base distributions are chosen (e.g. Gaussian chain, ideal gas, etc.), statistical thermodynamic entropies are then immediately recovered. Notably, the analysis relies only on the definition of the Gibbs-Shannon entropy, rather than any particular statistical mechanical ensemble, so that generalized non-equilibrium entropies may be computed. The method is demonstrated on several systems of increasing complexity: (i) a 40-dimensional Gaussian mixture model, (ii) the classical XY model of N spins arranged in one dimension, (iii) the 13-atom Lennard-Jones cluster, and (iv) an active Brownian polymer.", "url": "https://arxiv.org/abs/2609.18093", "type": "理论+数值", "summary": "我们提出了一种使用随机插值来估计任意概率分布之间的熵差的通用方法。连接基础和目标的边际分布遵循连续性方程，该方程允许根据概率流速和得分场的内积直接计算熵差。这种公式有几个优点：(i) 不需要对任一字段进行计算量大的散度计算，(ii) 如果不需要模型可迁移性，甚至不需要直接学习分数字段，(iii) 在训练期间几乎免费生成动态估计。当选择易于处理的基本分布（例如高斯链、理想气体等）时，统计热力学熵就会立即恢复。值得注意的是，该分析仅依赖于吉布斯-香农熵的定义，而不依赖于任何特定的统计力学系综，因此可以计算广义非平衡熵。\n\n该方法在几个复杂性不断增加的系统上进行了演示：(i) 40 维高斯混合模型，(ii) 一维排列的 N 自旋的经典 XY 模型，(iii) 13 原子 Lennard-Jones 簇，以及 (iv) 活性布朗聚合物。", "authors": [{"name": "Phillip M. Rauscher"}], "featured_authors": [{"name": "Phillip M. Rauscher"}], "author_count": 1}, {"id": "2609.18113", "category": "cond-mat", "title": "Nitrogen based electride superconductor Nb5Ir3N under pressure: multifunctional physical properties from DFT based first-principles investigation", "abstract": "Discovery and study of superconducting electrides have opened new avenues in condensed matter physics, driven by their intriguing multifunctional features spanning ambient and high-pressure regimes. This work investigates the ternary nitride superconductor Nb5Ir3N under pressure ranging from 0 to 20 GPa via density functional theory based simulations. Estimated structural parameters agree well with the available data, confirming their reliability and supporting the validity of this analysis. Negative formation enthalpy, together with evaluated elastic constants and phonon spectra, confirm the structural, thermodynamic, mechanical, and dynamical stability of Nb5Ir3N over the entire pressure range. Pressure dependent elastic constants and polycrystalline elastic moduli are investigated. The compound is categorized as ductile in light of estimated mechanical indices. Elastic anisotropy factors indicate that Nb5Ir3N remains anisotropic, with the degree of anisotropy gradually decreasing as pressure increases. Electronic band structure and density of states are calculated with and without spin orbit coupling to investigate its influence on the electronic structure. Calculated optical response reveals substantial intraband contributions in the low energy region, intense ultraviolet absorption, and strong reflectivity. The spectra exhibit optical anisotropy and a broadening at higher pressures. Pressure induced superconducting features are also discussed qualitatively.", "url": "https://arxiv.org/abs/2609.18113", "type": "理论+数值", "summary": "超导电子化合物的发现和研究为凝聚态物理开辟了新的途径，其驱动力是其跨越环境和高压状态的有趣的多功能特征。这项工作通过基于密度泛函理论的模拟研究了 0 至 20 GPa 压力下的三元氮化物超导体 Nb5Ir3N。估计的结构参数与现有数据非常吻合，证实了它们的可靠性并支持了该分析的有效性。负形成焓与评估的弹性常数和声子谱一起证实了 Nb5Ir3N 在整个压力范围内的结构、热力学、机械和动力学稳定性。研究了压力相关的弹性常数和多晶弹性模量。根据估计的机械指数，该化合物被归类为延展性化合物。弹性各向异性因子表明Nb5Ir3N仍保持各向异性，随着压力的增加各向异性程度逐渐减小。计算有和没有自旋轨道耦合的电子能带结构和态密度，以研究其对电子结构的影响。\n\n计算的光学响应揭示了低能量区域的大量带内贡献、强烈的紫外线吸收和强反射率。光谱表现出光学各向异性并且在较高压力下展宽。还定性地讨论了压力引起的超导特性。", "authors": [{"name": "M. Abdul Hadi Shah"}, {"name": "J.H. Abir"}, {"name": "S.H. Naqib"}], "featured_authors": [{"name": "M. Abdul Hadi Shah"}, {"name": "J.H. Abir"}, {"name": "S.H. Naqib"}], "author_count": 3}, {"id": "2609.18189", "category": "cond-mat", "title": "Chern Insulators on a Twisted Klein Bottle", "abstract": "Recently, momentum-space nonsymmorphic symmetries have attracted considerable attention. However, their realizations typically rely on fine-tuning hopping phases to satisfy the required projective symmetry algebras. Here, we show that such symmetry algebras arise naturally on bipartite lattices through the interplay of crystalline and sublattice symmetries. Unlike previously studied cases, these symmetry operators can anticommute with the Hamiltonian and are therefore referred to as momentum-space nonsymmorphic chiral symmetries. Although the free actions of these symmetries reduce the Brillouin torus to more elementary manifolds, the resulting manifolds are twisted in the Atiyah--Segal formalism. In particular, chiral glide reflection (screw rotation) gives rise to a twisted Klein bottle (dicosm) in two (three) dimensions, and this twisting dramatically alters the topological classification. Unlike the untwisted Klein bottle, whose nonorientability forces the Chern number to vanish, the twisted Klein bottle can host nonzero Chern numbers, corresponding to even Chern numbers on the torus. At open boundaries, the corresponding topological invariant manifests itself through chiral edge states exhibiting a glide-reflection structure in energy--momentum space. Our results establish momentum-space nonsymmorphic chiral symmetry as a new organizing principle for discovering and engineering topological phases beyond conventional crystalline classifications.", "url": "https://arxiv.org/abs/2609.18189", "type": "理论", "summary": "最近，动量空间非对称对称性引起了广泛的关注。然而，它们的实现通常依赖于微调跳跃相位以满足所需的射影对称代数。在这里，我们证明这种对称代数通过晶体和亚晶格对称性的相互作用在二分晶格上自然产生。与之前研究的情况不同，这些对称算子可以与哈密顿量反交换，因此被称为动量空间非对称手征对称性。尽管这些对称性的自由作用将布里渊环面简化为更基本的流形，但所得流形在 Atiyah-Segal 形式主义中是扭曲的。特别是，手性滑移反射（螺旋旋转）会产生两（三）维扭曲的克莱因瓶（二宇宙），这种扭曲极大地改变了拓扑分类。与未扭曲的克莱因瓶不同，其不可定向性迫使陈数消失，扭曲的克莱因瓶可以容纳非零陈数，对应于环面上的偶数陈数。\n\n在开放边界处，相应的拓扑不变量通过手性边缘态表现出来，在能量动量空间中表现出滑移反射结构。我们的结果将动量空间非对称手性对称性确立为一种新的组织原则，用于发现和设计超越传统晶体分类的拓扑相。", "authors": [{"name": "Rong Xiao"}, {"name": "Y. X. Zhao"}], "featured_authors": [{"name": "Rong Xiao"}, {"name": "Y. X. Zhao"}], "author_count": 2}, {"id": "2609.18208", "category": "cond-mat", "title": "Logarithmic singularity in a dynamical quantum phase transition for free fermions", "abstract": "We study the Loschmidt echo in a system of N non-interacting spinless lattice fermions released from a double-domain-wall initial state. In the large-N limit, the return probability is characterized by a large-deviation rate function known as the dynamical free energy. The Loschmidt echo is dominated by a complex instanton configuration, and the dynamical free energy develops a logarithmic singularity at the dynamical quantum phase transition. We obtain analytical results in the short-time and long-time regimes and support them with numerical computations. We show that the transition can be understood as a topological change of the dominant instanton configuration, analogous to the emergence of a cut in random matrix theory. We further show that post-selection can drive the system through two successive DQPTs, associated with successive topological changes of the dominant instanton configuration in complex time.", "url": "https://arxiv.org/abs/2609.18208", "type": "理论+数值", "summary": "我们研究了从双畴壁初始态释放的 N 个非相互作用无自旋晶格费米子系统中的洛施密特回波。在大 N 限制下，返回概率由称为动态自由能的大偏差率函数来表征。洛施密特回波以复杂瞬子配置为主，动态自由能在动态量子相变处形成对数奇点。我们获得了短期和长期状态下的分析结果，并通过数值计算来支持它们。我们证明，这种转变可以理解为主导瞬子构型的拓扑变化，类似于随机矩阵理论中切口的出现。我们进一步表明，后选择可以通过两个连续的 DQPT 驱动系统，这与复杂时间内主导瞬子配置的连续拓扑变化相关。", "authors": [{"name": "Yasser Bezzaz"}, {"name": "Dimitri M. Gangardt"}, {"name": "Pavel L. Krapivsky"}, {"name": "Jean-Marc Luck"}, {"name": "Kirone Mallick"}, {"name": "Sylvain Prolhac"}], "featured_authors": [{"name": "Yasser Bezzaz"}, {"name": "Dimitri M. Gangardt"}, {"name": "Pavel L. Krapivsky"}, {"name": "Jean-Marc Luck"}, {"name": "Kirone Mallick"}, {"name": "Sylvain Prolhac"}], "author_count": 6}, {"id": "2609.18327", "category": "cond-mat", "title": "Quantum electrodynamics of equilibrium systems: A rigorous Maxwell-regularized functional-theoretic formulation", "abstract": "A framework for quantum electrodynamics of equilibrium systems is proposed that takes the Maxwell equations as foundational and links them to the structure of density-functional theory for the quantum system. By switching from purely internal observables like the one-particle density to combined internal and external quantities, the external sources and their energy are taken into account. A fully regularized functional theory emerges that avoids the usual representability problems. With the Kohn-Sham construction that links to an auxiliary uncoupled system, the ultra-violet cutoff can be removed and one arrives at a fully renormalized and non-perturbative light-matter description. Regularized forms of density-functional theory with and without magnetic fields appear as boundary cases, while the emergent physical picture reproduces the macroscopic Maxwell equations.", "url": "https://arxiv.org/abs/2609.18327", "type": "理论", "summary": "提出了平衡系统的量子电动力学框架，以麦克斯韦方程为基础，并将其与量子系统的密度泛函理论结构联系起来。通过从纯粹的内部可观测量（如单粒子密度）切换到组合的内部和外部量，外部源及其能量被考虑在内。完全正则化的泛函理论的出现避免了常见的可表示性问题。通过连接到辅助非耦合系统的 Kohn-Sham 结构，可以去除紫外线截止，并获得完全重整化和非微扰的光物质描述。有磁场和没有磁场的密度泛函理论的正则形式表现为边界情况，而出现的物理图像再现了宏观麦克斯韦方程。", "authors": [{"name": "Markus Penz"}, {"name": "Christian Jöns"}, {"name": "Michael Ruggenthaler"}, {"name": "Angel Rubio"}], "featured_authors": [{"name": "Markus Penz"}, {"name": "Christian Jöns"}, {"name": "Michael Ruggenthaler"}, {"name": "Angel Rubio"}], "author_count": 4}, {"id": "2609.18340", "category": "cond-mat", "title": "Tuneable terahertz transitions in zigzag graphene nanoribbons", "abstract": "We show that a transverse electric field applied to a zigzag graphene nanoribbon opens a band gap whose energy can be tuned through the terahertz (THz) range. The field breaks the reflection symmetry of the ribbon, allowing optical transitions that are forbidden in its absence. The relative strengths of transitions polarized parallel and transverse to the ribbon depend strongly on excitation frequency and become equal at a particular frequency. At this frequency, each helicity selectively excites carriers in only one of the two field-induced edge-state valleys, with the selected valley reversed for the opposite helicity. Since this excitation occurs away from the valley minima, the photoexcited carriers have finite group velocity, giving rise to a circular photogalvanic response. Van Hove singularities enhance radiative recombination at the band edge, providing a route towards compact, tunable THz emitters.", "url": "https://arxiv.org/abs/2609.18340", "type": "理论", "summary": "我们证明，施加到锯齿形石墨烯纳米带上的横向电场会打开一个带隙，其能量可以在太赫兹（THz）范围内进行调节。该场打破了带的反射对称性，从而允许在没有场时被禁止的光学跃迁。平行和横向于带偏振的跃迁的相对强度很大程度上取决于激励频率并且在特定频率下变得相等。在此频率下，每个螺旋度仅选择性地激发两个场感应边缘态谷之一中的载流子，而所选谷值则针对相反的螺旋度而反转。由于这种激发发生在远离谷最小值的地方，光激发载流子具有有限的群速度，从而产生圆形光电响应。范霍夫奇点增强了带边缘的辐射复合，为紧凑、可调谐的太赫兹发射器提供了一条途径。", "authors": [{"name": "R. R. Hartmann"}, {"name": "M. E. Portnoi"}], "featured_authors": [{"name": "R. R. Hartmann"}, {"name": "M. E. Portnoi"}], "author_count": 2}, {"id": "2609.18365", "category": "cond-mat", "title": "Electronic Origins of Elastic Behavior in Rocksalt, Zinc-Blende and Wurtzite 3d Transition-Metal Nitrides", "abstract": "We present a comprehensive ab-initio study of the elastic properties of the IV-period transition metal nitrides, highlighting the correlation between their mechanical behavior and electronic structure. By analyzing the electronic density of states, we reveal how the occupation of bonding or antibonding orbitals determines the evolution of elastic properties along the period. Furthermore, we examine trends across different crystal structures, specifically comparing rocksalt, zincblende and wurtzite phases, to uncover how variations in crystal symmetry and atomic coordination influence their elastic properties.", "url": "https://arxiv.org/abs/2609.18365", "type": "理论", "summary": "我们对 IV 期过渡金属氮化物的弹性特性进行了全面的从头开始研究，强调了它们的机械行为和电子结构之间的相关性。通过分析电子态密度，我们揭示了成键或反键轨道的占据如何决定弹性特性沿周期的演变。此外，我们还研究了不同晶体结构的趋势，特别是比较岩盐、闪锌矿和纤锌矿相，以揭示晶体对称性和原子配位的变化如何影响其弹性特性。", "authors": [{"name": "Jesus Cañas"}, {"name": "Oliver Ambacher"}], "featured_authors": [{"name": "Jesus Cañas"}, {"name": "Oliver Ambacher"}], "author_count": 2}, {"id": "2609.18402", "category": "cond-mat", "title": "Fröhlich Bipolarons in Two-Dimensional Materials", "abstract": "Motivated by the progress in the physics of two-dimensional materials and the recent two-dimensional generalization of the Fröhlich model, we study the formation of bipolarons in polar monolayers. Because of very special nonlocal dielectric screening in two dimensions, this setting differs qualitatively from the conventional Fröhlich model. In monolayers, (i) long wavelength LO phonons acquire a nontrivial dispersion; (ii) the Fröhlich electron-phonon vertex becomes momentum-dependent and regular at small momenta; and (iii) direct repulsion between charge carriers takes the Keldysh-Rytova form. Using the Feynman path-integral variational approach, we show that the region in the parameter space where stable bipolarons exist is strongly modified compared to the usual quasi-two-dimensional model with dispersionless phonons. Specifically, in the most favorable limit, when the ratio $\\sigma_0$ of the static polarizability to the high-frequency polarizability tends to infinity, the lower critical coupling, sufficient for the formation of bipolarons, can be made arbitrarily small. More surprisingly, we demonstrate that no stable bipolarons can exist in the strong coupling limit: in the isolated monolayer the stability region is always confined to a finite range of coupling constants. In general, the stability region is strongly shifted toward large values of the polarizability ratio $\\sigma_0$, well beyond the parameter regimes in representative crystals, which indicates that polar monolayers do not favor bipolarons.", "url": "https://arxiv.org/abs/2609.18402", "type": "理论+数值", "summary": "受二维材料物理学进展和最近 Fröhlich 模型二维推广的推动，我们研究了极性单层中双极子的形成。由于非常特殊的二维非局域介电屏蔽，该设置与传统的 Fröhlich 模型有本质上的不同。在单层中，(i) 长波长 LO 声子获得不平凡的色散； (ii) Fröhlich 电子声子顶点在小动量下变得与动量相关且规则； (iii) 载流子之间的直接排斥采用 Keldysh-Rytova 形式。使用费曼路径积分变分方法，我们表明，与通常的无色散声子准二维模型相比，参数空间中存在稳定双极子的区域被强烈修改。具体来说，在最有利的限制下，当静态极化率与高频极化率的比率$\\sigma_0$趋于无穷大时，足以形成双极化子的较低临界耦合可以任意小。\n\n更令人惊讶的是，我们证明在强耦合极限下不存在稳定的双极子：在孤立的单层中，稳定区域始终局限于耦合常数的有限范围。一般来说，稳定区域强烈地向极化率 $\\sigma_0$ 的大值移动，远远超出代表性晶体中的参数范围，这表明极性单层不利于双极化子。", "authors": [{"name": "A. Kudlis"}, {"name": "V. Shahnazaryan"}, {"name": "I. Iorsh"}, {"name": "I. A. Shelykh"}, {"name": "I. V. Tokatly"}], "featured_authors": [{"name": "A. Kudlis"}, {"name": "V. Shahnazaryan"}, {"name": "I. Iorsh"}, {"name": "I. A. Shelykh"}, {"name": "I. V. Tokatly"}], "author_count": 5}, {"id": "2609.18449", "category": "cond-mat", "title": "A Pseudoscalar Representation Mapping from Parent-Group Vibrational Normal Modes to Symmetry-Adapted Magnetic Structures", "abstract": "Conventional approaches classify symmetry-allowed magnetic configurations but do not by themselves establish a direct, mode-resolved correspondence with parent-lattice vibrations. Here, we formulate a universal determinant-induced pseudoscalar twist for all 32 crystallographic point groups, establishing an exact representation-to-geometry correspondence between parent vibrations and magnetic order. Within the paramagnetic gray group $G\\times\\Theta_{\\mathcal{T}}$, the spatial twist determines symmetry-defined magnetic geometry, while time-reversal parity independently specifies magnetic character. Each parent phonon irrep $\\Gamma$ maps to $\\Gamma_{\\mathrm{mag}}=\\Gamma\\otimes\\Gamma_{\\mathrm{ps}}$, preserving multiplicities and yielding the projection identity $P_{\\mathrm{mag},mn}^{(\\Gamma\\otimes\\Gamma_{\\mathrm{ps}})}=P_{\\mathrm{ph},mn}^{(\\Gamma)}$ under the common Cartesian realization. This establishes the \\textit{Template Principle}: parent vibrational modes furnish real-space templates whose symmetry-enforced nodal manifolds are inherited exactly. Applied to monolayer $\\mathrm{Cd}_2\\mathrm{N}_3$, the framework identifies the ferrimagnetic ground state from the parent $A_{2u}$ sector, confirmed by first-principles calculations, alongside cluster magnetic octupoles and antiferromagnetic manifolds. It further provides an \\textit{a priori} parent-group criterion for screening symmetry-allowed linear magnetic responses.", "url": "https://arxiv.org/abs/2609.18449", "type": "理论+数值", "summary": "传统方法对允许对称的磁配置进行分类，但其本身并没有与母体晶格振动建立直接的模式解析对应关系。在这里，我们为所有 32 个晶体点组制定了通用行列式引起的赝标量扭曲，在母体振动和磁序之间建立了精确的表示与几何对应关系。在顺磁灰色群$G\\times\\Theta_{\\mathcal{T}}$中，空间扭曲决定了对称定义的磁性几何形状，而时间反转宇称独立地指定了磁性特征。每个父声子不可表示 $\\Gamma$ 映射到 $\\Gamma_{\\mathrm{mag}}=\\Gamma\\otimes\\Gamma_{\\mathrm{ps}}$，保留多重性并产生投影恒等式普通笛卡尔实现下的$P_{\\mathrm{mag},mn}^{(\\Gamma\\otimes\\Gamma_{\\mathrm{ps}})}=P_{\\mathrm{ph},mn}^{(\\Gamma)}$这就建立了\\textit{模板原理}：父振动模式提供实空间模板，其对称强制节点流形被精确继承。\n\n应用于单层 $\\mathrm{Cd}_2\\mathrm{N}_3$ 时，该框架从父 $A_{2u}$ 扇区识别出亚铁磁基态，并通过第一性原理计算以及簇磁性八极子和反铁磁流形进​​行了确认。它进一步提供了用于筛选对称性允许的线性磁响应的\\textit{先验}父组标准。", "authors": [{"name": "Yachao Liu"}, {"name": "Haibo Niu"}, {"name": "Vei Wang"}], "featured_authors": [{"name": "Yachao Liu"}, {"name": "Haibo Niu"}, {"name": "Vei Wang"}], "author_count": 3}, {"id": "2609.18485", "category": "cond-mat", "title": "Chiral classical and quantum acoustics with hole-spin qubits", "abstract": "Gate-defined hole spins combine strong spin-orbit coupling with exceptional strain sensitivity, making surface acoustic waves a natural route to remote, phase-coherent control. We show that counterpropagating surface acoustic waves can differ in coupling strength and in whether they predominantly drive spin rotations or modulate the qubit frequency. We call the transverse transition-strength imbalance spin-acoustic chirality and show that it is tunable through gate-controlled reshaping of the dot confinement. Combining a multiband Luttinger-Kohn Hamiltonian with the Bir-Pikus description of strain and 3D piezoelectric finite-element simulations, we obtain the acoustic g-matrix modulation governing coherent SAW driving. Quantizing the same strain-mediated interaction yields the corresponding single-phonon coupling, and a generalized anisotropic Rabi interaction with co-rotating, counter-rotating, and longitudinal components, linking classical chirality to quantum anisotropy and directional one-phonon emission. Magnetic field orientation and dot shape tune the acoustic chirality and operator selectivity. We illustrate this framework through bichromatic coherence protection and phonon-mediated heralded Bell-state initialization.", "url": "https://arxiv.org/abs/2609.18485", "type": "理论+数值", "summary": "门定义的孔自旋将强大的自旋轨道耦合与卓越的应变灵敏度相结合，使表面声波成为远程相位相干控制的自然途径。我们表明，反向传播的表面声波在耦合强度以及它们是否主要驱动自旋旋转或调制量子位频率方面可能有所不同。我们将横向跃迁强度不平衡称为自旋声学手性，并表明它可以通过点限制的门控重塑来调节。将多频带 Luttinger-Kohn 哈密顿量与应变的 Bir-Pikus 描述和 3D 压电有限元模拟相结合，我们获得了控制相干 SAW 驱动的声学 g 矩阵调制。量化相同的应变介导的相互作用会产生相应的单声子耦合，以及具有同向旋转、反向旋转和纵向分量的广义各向异性拉比相互作用，将经典手性与量子各向异性和定向单声子发射联系起来。磁场方向和点形状可调节声学手性和操作员选择性。\n\n我们通过双色相干保护和声子介导的贝尔态初始化来说明这个框架。", "authors": [{"name": "Zhanning Wang"}, {"name": "Yongtao Li"}, {"name": "Nelson E. Rivas"}, {"name": "Gonzalo García"}, {"name": "Irene Castro"}, {"name": "Rubén Seoane Souto"}, {"name": "Daniel Ramos"}, {"name": "José C. Abadillo-Uriel"}], "featured_authors": [{"name": "Zhanning Wang"}, {"name": "Yongtao Li"}, {"name": "Nelson E. Rivas"}, {"name": "Rubén Seoane Souto"}, {"name": "Daniel Ramos"}, {"name": "José C. Abadillo-Uriel"}], "author_count": 8}, {"id": "2609.18592", "category": "cond-mat", "title": "Optical investigation of the electronic structure of a ferromagnetic Weyl semimetal CeAlSi", "abstract": "To investigate electronic states during the ferromagnetic transition in a magnetic Weyl semimetal CeAlSi, we measured temperature-dependent optical conductivity [$\\sigma_1(\\omega)$] spectra and compared them with DFT+DMFT band calculations. The $\\sigma_1(\\omega)$ spectrum did not change significantly across the ferromagnetic ordering temperature ($T_C$), suggesting that the Ce 4f states are almost localized. DFT+DMFT calculations with almost localized Ce 4f states successfully reproduced the spectral shape and the unchanged $\\sigma_1(\\omega)$ spectra across $T_C$. The dynamic effective mass evaluated from the extended Drude model is very small, which DFT+DMFT calculations also reproduce, but the scattering probability at even lower temperatures suggests ferromagnetic fluctuations. These results suggest that the interaction intensity between the Weyl fermions and Ce 4f states is very weak, as reproduced by DFT+DMFT calculations.", "url": "https://arxiv.org/abs/2609.18592", "type": "理论+数值", "summary": "为了研究磁性外尔半金属 CeAlSi 中铁磁转变过程中的电子态，我们测量了与温度相关的光导率 [$\\sigma_1(\\omega)$] 光谱，并将其与 DFT+DMFT 能带计算进行了比较。 $\\sigma_1(\\omega)$ 谱在铁磁有序温度 ($T_C$) 范围内没有显着变化，表明 Ce 4f 态几乎是局域化的。具有几乎局域 Ce 4f 态的 DFT+DMFT 计算成功地再现了光谱形状和 $T_C$ 上未改变的 $\\sigma_1(\\omega)$ 光谱。从扩展的 Drude 模型评估的动态有效质量非常小，DFT+DMFT 计算也可以重现，但在更低温度下的散射概率表明铁磁波动。这些结果表明 Weyl 费米子和 Ce 4f 态之间的相互作用强度非常弱，如 DFT+DMFT 计算所重现。", "authors": [{"name": "Shin-ichi Kimura"}, {"name": "Yue Pan"}, {"name": "Hiroshi Watanabe"}, {"name": "Akimitsu Kirikoshi"}, {"name": "Junya Otsuki"}, {"name": "Hiroshi Tanida"}], "featured_authors": [{"name": "Shin-ichi Kimura"}, {"name": "Yue Pan"}, {"name": "Hiroshi Watanabe"}, {"name": "Akimitsu Kirikoshi"}, {"name": "Junya Otsuki"}, {"name": "Hiroshi Tanida"}], "author_count": 6}, {"id": "2609.18733", "category": "cond-mat", "title": "Exact Nonlinear Active Microrheology in Diffusive Single-File Systems", "abstract": "Active microrheology probes a crowded medium by forcing a tracer and measuring its response. In single-file transport, where particles cannot overtake, a constant force $F$ produces a subballistic displacement $\\langle X_t\\rangle\\simeq \\sqrt{t}\\,\\xi(F)$ together with a persistent bath deformation. Despite decades of work, the exact nonlinear response at arbitrary force has remained confined to a few special solvable models. Here we remove this restriction by combining recent advances in hydrodynamic transport coefficients, a pressure-balance formulation of the local drive, and single-file duality, which eliminates the resulting moving boundary. This yields a closed exact boundary-value problem for general diffusive single files, determining both $\\xi(F)$ and the full density profile. For overdamped Brownian particles with general interactions, all microscopic interaction details enter only through the equilibrium equation of state, bringing realistic interacting systems, including finite-width quasi-one-dimensional channels, within exact reach. The solution also reveals universal global laws; in particular, the bath-density dipole is fixed by the applied force independently of the interaction potential.", "url": "https://arxiv.org/abs/2609.18733", "type": "理论", "summary": "主动微流变学通过施加示踪剂并测量其响应来探测拥挤的介质。在单列传输中，粒子无法超越，恒定力 $F$ 会产生亚弹道位移 $\\langle X_t\\rangle\\simeq \\sqrt{t}\\,\\xi(F)$ 以及持续的浴变形。尽管经过了数十年的研究，任意力下的精确非线性响应仍然局限于一些特殊的可解模型。在这里，我们通过结合流体动力传输系数、局部驱动的压力平衡公式和单列对偶性的最新进展来消除这一限制，从而消除了由此产生的移动边界。这产生了一般扩散单文件的封闭精确边界值问题，确定 $\\xi(F)$ 和完整密度分布。对于具有一般相互作用的过阻尼布朗粒子，所有微观相互作用细节仅通过状态平衡方程进入，使真实的相互作用系统（包括有限宽度的准一维通道）处于精确范围内。\n\n该解决方案还揭示了全球普遍规律；特别是，浴密度偶极子由施加的力固定，与相互作用势无关。", "authors": [{"name": "Aurélien Grabsch"}, {"name": "Olivier Bénichou"}], "featured_authors": [{"name": "Aurélien Grabsch"}, {"name": "Olivier Bénichou"}], "author_count": 2}, {"id": "2609.18743", "category": "cond-mat", "title": "Transport of Deformable Vesicles Driven by Chiral Active Brownian Particles", "abstract": "Active matter systems can generate mechanical stresses that deform their surroundings, providing a route to transport and shape dynamics far from equilibrium. Deformable vesicles containing active particles offer a minimal setting in which such active stresses are directly coupled to boundary mechanics. Here, we use numerical simulations to investigate a two-dimensional, fixed-area vesicle filled with chiral active particles interacting through excluded volume and polar alignment. We find that the coupling between particle chirality and vesicle deformation produces distinct modes of collective motion, including run-and-tumble-like migration, rotor-like dynamics, and persistent spinning. Most notably, we show that vesicle rotation is non-monotonic in chirality: at fixed activity, an optimal chirality maximizes the rotational velocity. We develop an analytical theory that relates the vesicle rotation to the effective torque generated by the chiral active particles. The theory identifies the competition underlying the optimal chirality and predicts a scale-invariant dependence of the rotational velocity on activity and chirality. This scaling collapses simulation results obtained over different activity strengths onto a universal curve. Our results establish a general mechanism by which chirality and collective alignment regulate the transmission of active stresses to deformable boundaries, providing a framework for understanding transport and rotational dynamics in confined active systems.", "url": "https://arxiv.org/abs/2609.18743", "type": "理论+数值", "summary": "活性物质系统可以产生机械应力，使周围环境变形，从而提供一条传输和塑造远离平衡的动力学的途径。含有活性颗粒的可变形囊泡提供了一种最小的设置，其中这种活性应力直接与边界力学耦合。在这里，我们使用数值模拟来研究二维、固定面积的囊泡，其中充满了通过排除体积和极性排列相互作用的手性活性粒子。我们发现粒子手性和囊泡变形之间的耦合产生了不同的集体运动模式，包括运行和翻滚样迁移、转子样动力学和持续旋转。最值得注意的是，我们表明囊泡旋转在手性方面是非单调的：在固定活性下，最佳手性使旋转速度最大化。我们开发了一种分析理论，将囊泡旋转与手性活性粒子产生的有效扭矩联系起来。该理论确定了最佳手性背后的竞争，并预测旋转速度对活性和手性的尺度不变依赖性。\n\n这种缩放将不同活动强度获得的模拟结果折叠到通用曲线上。我们的结果建立了一种通用机制，通过该机制手性和集体排列调节主动应力向可变形边界的传递，为理解受限主动系统中的传输和旋转动力学提供了框架。", "authors": [{"name": "Dipak Patra"}, {"name": "Anil Kumar Dasanna"}], "featured_authors": [{"name": "Dipak Patra"}, {"name": "Anil Kumar Dasanna"}], "author_count": 2}, {"id": "2609.18771", "category": "cond-mat", "title": "Photoresponse properties of single-crystalline thick film based on high-entropy topological insulator (Bi3/4Sb1/4)2(Te2/5Se2/5S1/5)3", "abstract": "High-entropy topological insulator (Bi3/4Sb1/4)2(Te2/5Se2/5S1/5)3 has been for the first time prepared by self-propagating high-temperature synthesis and melting methods. Single-crystalline thick-filmed sample with thickness of ~0.1 mm was applied to examine the photoresponse properties by using room-temperature chopped-light technique. Photodetector based on (Bi3/4Sb1/4)2(Te2/5Se2/5S1/5)3 demonstrated strong photovoltaic response under irradiation of a white LED light, covering 420-730 nm range. The photocurrent increases from ~20 to ~55 mkA with the increase in intensity from 100 to 600 W/m2 that is originated from the increase in the number of non-equilibrium carriers generated by light. Room-temperature responsivity and detectivity of the photodetector are ~8.7 mA/W and ~109 Jones, respectively.", "url": "https://arxiv.org/abs/2609.18771", "type": "理论", "summary": "首次采用自蔓延高温合成和熔融方法制备了高熵拓扑绝缘体(Bi3/4Sb1/4)2(Te2/5Se2/5S1/5)3。采用厚度约为0.1 mm的单晶厚膜样品，通过室温斩波技术检查光响应特性。基于(Bi3/4Sb1/4)2(Te2/5Se2/5S1/5)3的光电探测器在白光LED光照射下表现出很强的光伏响应，覆盖420-730 nm范围。随着强度从 100 W/m2 增加到 600 W/m2，光电流从 ~20 mkA 增加到 ~55 mkA，这是由于光产生的非平衡载流子数量的增加。光电探测器的室温响应度和探测度分别为约 8.7 mA/W 和约 109 Jones。", "authors": [{"name": "Alexei Vasilev"}, {"name": "Marina Zhezhu"}, {"name": "Oleg Ivanov"}], "featured_authors": [{"name": "Alexei Vasilev"}, {"name": "Marina Zhezhu"}, {"name": "Oleg Ivanov"}], "author_count": 3}, {"id": "2609.18826", "category": "cond-mat", "title": "Gauge-including neural-network quantum Monte Carlo for molecules in magnetic fields", "abstract": "External magnetic fields, through their coupling to orbital and spin motion, complicate the correlated electronic states and impose coordinate-dependent phases on the wavefunction, thereby making accurate electronic structure calculations substantially more demanding. Recently, neural network-based quantum Monte Carlo (NNQMC) has emerged as a highly accurate approach to study nucleus-free systems in magnetic fields. For molecular systems, however, things get more complicated as the magnetic field would introduce a rapidly varying phase in the region far from the gauge origin. Here we introduce a gauge-including phase factor that acts directly on the full many-electron wavefunction and accounts for the prescribed magnetic phase, leaving a smoother correlated residual for the network to learn. This factor greatly improves molecular translation consistency and size consistency, providing a route for studying systems in magnetic fields with NNQMC. Upon this approach, we reproduce weak-field magnetizabilities and strong-field bond contraction in \\ce{H2}. We further apply the method to selected transitions in the \\ce{CN} red and \\ce{C2} Swan systems at magnetic fields relevant to white dwarfs. The \\ce{CN} transition exhibits a much larger field-induced shift than its \\ce{C2} counterpart, suggesting its potential as a probe of white-dwarf magnetic fields.", "url": "https://arxiv.org/abs/2609.18826", "type": "理论+数值", "summary": "外部磁场通过与轨道和自旋运动的耦合，使相关的电子状态变得复杂，并对波函数施加依赖于坐标的相位，从而对精确的电子结构计算提出了更高的要求。最近，基于神经网络的量子蒙特卡罗（NNQMC）已成为研究磁场中无核系统的高精度方法。然而，对于分子系统，事情变得更加复杂，因为磁场会在远离规范原点的区域引入快速变化的相位。在这里，我们引入了一个包含规范的相位因子，它直接作用于完整的多电子波函数并考虑规定的磁相位，为网络留下更平滑的相关残差以供学习。这一因素极大地提高了分子翻译一致性和尺寸一致性，为利用 NNQMC 研究磁场系统提供了一条途径。通过这种方法，我们在 ce{H2} 中重现了弱场磁化能力和强场键收缩。\n\nWe further apply the method to selected transitions in the \\ce{CN} red and \\ce{C2} Swan systems at magnetic fields relevant to white dwarfs. \\ce{CN} 跃迁表现出比其 \\ce{C2} 对应物大得多的场引起的位移，表明其作为白矮星磁场探针的潜力。", "authors": [{"name": "Chengye Lü"}, {"name": "Weizhong Fu"}, {"name": "Xin-gao Gong"}, {"name": "Hongjun Xiang"}], "featured_authors": [{"name": "Chengye Lü"}, {"name": "Weizhong Fu"}, {"name": "Xin-gao Gong"}, {"name": "Hongjun Xiang"}], "author_count": 4}, {"id": "2609.18851", "category": "cond-mat", "title": "Current fluctuations of diffusive systems with a battery", "abstract": "For a diffusive system on a ring, with a battery at the origin, we use the macroscopic fluctuation theory (MFT) to obtain the large deviation function of the current. In the case of non-interacting particles, the predictions of the MFT agree with the result of a direct exact microscopic calculation. To our surprise, the large deviation function of non-interacting particles with a battery has the same form as for the Symmetric Simple Exclusion Process (SSEP) with open boundary conditions. For the SSEP on a ring with a battery, the predictions of the MFT seem to agree with the results of long Monte Carlo simulations, although much longer simulations would be needed to better test the validity of these predictions.", "url": "https://arxiv.org/abs/2609.18851", "type": "理论+数值", "summary": "对于环上的扩散系统，原点是电池，我们使用宏观涨落理论（MFT）来获得电流的大偏差函数。在非相互作用粒子的情况下，MFT 的预测与直接精确微观计算的结果一致。令我们惊讶的是，非相互作用粒子与电池的大偏差函数与具有开放边界条件的对称简单排除过程 (SSEP) 具有相同的形式。对于带有电池的环上的 SSEP，MFT 的预测似乎与长时间蒙特卡罗模拟的结果一致，尽管需要更长的模拟才能更好地测试这些预测的有效性。", "authors": [{"name": "Thibaut Jonckheere"}, {"name": "Bernard Derrida"}], "featured_authors": [{"name": "Thibaut Jonckheere"}, {"name": "Bernard Derrida"}], "author_count": 2}, {"id": "2609.18882", "category": "cond-mat", "title": "Hierarchy of time scales in kinetically constrained models via stochastic-generator expansion", "abstract": "We revisit the hierarchy of relaxation time scales in stochastic kinetically constrained models (KCMs) obeying detailed balance, using an expansion method developed recently for their quantum counterparts. In the classical setting, we expand the stochastic generator in the low-temperature equilibrium concentration of excitations. As in quantum KCMs, successive truncations of the expansion reveal a nested hierarchy of metastable configurations that remain frozen on progressively longer time scales. Applying the method to the high-to-low temperature quench in the classical one-dimensional East and Fredrickson-Andersen models, we recover the known hierarchy of metastable plateaus and the associated perturbative time scales. We find that the hierarchical time scales are related to the smallest domain lengths. Our results show that the method developed for quantum kinetically constrained models can be used to provide a systematic description of slow relaxation in their classical counterparts as well.", "url": "https://arxiv.org/abs/2609.18882", "type": "理论", "summary": "我们使用最近为其量子模型开发的扩展方法，重新审视了随机动力学约束模型（KCM）中服从详细平衡的弛豫时间尺度的层次结构。在经典设置中，我们将随机发生器扩展为低温平衡激励浓度。与量子 KCM 一样，展开的连续截断揭示了亚稳态配置的嵌套层次结构，这些结构在逐渐更长的时间尺度上保持冻结状态。将该方法应用于经典一维 East 和 Fredrickson-Andersen 模型中的高低温淬火，我们恢复了已知的亚稳态平台层次结构和相关的微扰时间尺度。我们发现层次时间尺度与最小域长度相关。我们的结果表明，为量子动力学约束模型开发的方法也可用于提供经典模型中缓慢弛豫的系统描述。", "authors": [{"name": "Vanja Marić"}, {"name": "Juan P. Garrahan"}, {"name": "Lenart Zadnik"}], "featured_authors": [{"name": "Vanja Marić"}, {"name": "Juan P. Garrahan"}, {"name": "Lenart Zadnik"}], "author_count": 3}, {"id": "2609.18926", "category": "cond-mat", "title": "Geometry-Controlled Relaxation Spectra in Viscoelastic Fluids", "abstract": "Soft materials store, dissipate and release mechanical stresses through relaxation processes that often span many orders of magnitude in time. Such relaxation spectra are widely used to infer internal material dynamics and are usually regarded as fingerprints of microscopic complexity, disorder, or heterogeneity. Here we show that a broad relaxation spectrum can instead be generated by the geometry of mechanical excitation itself. Using rotationally driven colloidal dimers in a wormlike micellar fluid with a dominant bulk relaxation time of order one second, we demonstrate that torsional driving converts distance from the driven object into relaxation time. This produces a geometry-controlled hierarchy of relaxation modes: orientational recoils persist for hundreds of seconds and encode past torque protocols over comparably long times. Particle velocimetry reveals rapid angular-momentum transport away from the probe, in contrast to the slow relaxation of stored torsional stress. A continuum shell model captures the observed recoil dynamics and the selective suppression of long-lived contributions under spatial confinement. Our results show that geometry can transform a material with simple intrinsic relaxation into a system with long-lived, space-dependent memory, suggesting a route to tune material dynamics through mechanical excitation rather than composition, with potential implications for microscopic mechanical memory elements.", "url": "https://arxiv.org/abs/2609.18926", "type": "理论", "summary": "软材料通过松弛过程来存储、消散和释放机械应力，这些应力通常会跨越多个数量级。这种弛豫光谱广泛用于推断内部材料动力学，通常被视为微观复杂性、无序性或异质性的指纹。在这里，我们表明，机械激励本身的几何结构可以产生广泛的弛豫谱。在蠕虫状胶束流体中使用旋转驱动的胶体二聚体，其主要弛豫时间为一秒量级，我们证明扭转驱动将距被驱动物体的距离转换为弛豫时间。这产生了几何控制的松弛模式层次结构：定向反冲持续数百秒，并在相当长的时间内对过去的扭矩协议进行编码。粒子测速揭示了远离探针的快速角动量传输，与存储的扭转应力的缓慢松弛形成对比。连续体壳模型捕获了观察到的反冲动力学以及在空间限制下对长寿命贡献的选择性抑制。\n\n我们的结果表明，几何结构可以将具有简单内在弛豫的材料转变为具有长寿命、空间依赖性记忆的系统，这提出了一种通过机械激励而不是合成来调整材料动力学的途径，这对微观机械记忆元件具有潜在的影响。", "authors": [{"name": "Niloyendu Roy"}, {"name": "Rupayan Saha"}, {"name": "Debankur Das"}, {"name": "Matthias Krüger"}, {"name": "Clemens Bechinger"}], "featured_authors": [{"name": "Niloyendu Roy"}, {"name": "Rupayan Saha"}, {"name": "Debankur Das"}, {"name": "Matthias Krüger"}, {"name": "Clemens Bechinger"}], "author_count": 5}, {"id": "2609.18941", "category": "cond-mat", "title": "A microscopic heat engine with many hidden variables", "abstract": "Microscopic motors are commonly monitored through a single mechanical coordinate, whereas the chemical, conformational, or rotational cycles that sustain their motion remain unresolved. Mechanical stall is defined by the vanishing of the mean observed velocity; this scalar condition, however, does not generally imply thermodynamic reversibility. We analyze an overdamped Brownian motor in which one observed coordinate is coupled to several internal phases through a single shared interaction potential. Because the transmitted force and the reaction torques derive from the same energy, the resulting rank-one reciprocal structure yields an exact pointwise identity between the observed and hidden probability currents. This identity provides an exact expression for the entropy production at stall for an arbitrary periodic interaction. In particular, a positive current-square dissipation in the mechanical channel, defined from the full stationary state through the coupling-coordinate-resolved local velocity, determines together with the stall load the collective hidden current projected onto the coupling direction. The stationary one-coordinate marginal current nevertheless vanishes identically at stall; consequently, the stationary marginal density and mean displacement current do not determine this dissipation. Hidden currents orthogonal to the coupling direction dissipate without affecting the observed motion and generate an irreducible contribution that cannot be inferred from the rank-one mechanical channel.", "url": "https://arxiv.org/abs/2609.18941", "type": "数值", "summary": "微型马达通常通过单个机械坐标进行监控，而维持其运动的化学、构象或旋转循环仍未解决。机械失速是通过平均观测速度的消失来定义的；然而，这种标量条件通常并不意味着热力学可逆性。我们分析了一种过阻尼布朗电机，其中一个观察到的坐标通过单个共享相互作用势耦合到多个内部相位。由于传递的力和反作用扭矩源自相同的能量，因此所得的一阶倒易结构在观察到的概率电流和隐藏的概率电流之间产生精确的逐点恒等式。该恒等式为任意周期性相互作用的失速时的熵产生提供了精确的表达式。特别是，机械通道中的正电流平方耗散（从完全静止状态通过耦合坐标解析的局部速度定义）与失速负载一起确定投射到耦合方向上的集体隐藏电流。\n\n然而，静止的一坐标边际电流在失速时同样消失；因此，静态边缘密度和平均位移电流并不能决定这种耗散。与耦合方向正交的隐藏电流消散，不会影响观察到的运动，并产生无法从一级机械通道推断出的不可约贡献。", "authors": [{"name": "Mesfin Asfaw Taye"}], "featured_authors": [{"name": "Mesfin Asfaw Taye"}], "author_count": 1}, {"id": "2609.18984", "category": "cond-mat", "title": "Traveling Waves as Renormalization-Group Fixed Points without Universality Classes", "abstract": "Traveling waves are fundamental asymptotic structures in nonlinear physical systems. While their connection to self-similarity is recognized, their renormalization-group (RG) status remains elusive. We extend a recently developed unified RG framework for nonlinear PDEs to traveling-wave solutions, using Burgers' and KdV equations as paradigmatic examples. By employing a logarithmic transformation, we map traveling waves onto asymptotically self-similar solutions, allowing for a systematic RG treatment. Our analysis reveals a striking departure from the standard RG paradigm: for traveling waves, scale invariance uniquely forces the field's scaling dimension to vanish (A=0). This vanishing dimension implies that the RG transformation rescales space and time while leaving the field magnitude unchanged. Consequently, all analytic perturbations become scale-invariant, eliminating the conventional classification into relevant and irrelevant structures. While classical shock-wave and soliton solutions emerge as stationary RG fixed points, the mechanism for universality class formation - the progressive elimination of irrelevant structures - is fundamentally absent. Traveling waves thus represent a unique class of RG fixed points without universality classes. This finding establishes a crucial distinction between these two concepts and provides a rigorous theoretical basis for why traveling waves exhibit strong memory of initial conditions and system parameters.", "url": "https://arxiv.org/abs/2609.18984", "type": "理论", "summary": "行波是非线性物理系统中基本的渐近结构。虽然它们与自相似性的联系已被认识，但它们的重正化群（RG）状态仍然难以捉摸。我们使用 Burgers 和 KdV 方程作为范例，将最近开发的非线性偏微分方程统一 RG 框架扩展到行波解。通过采用对数变换，我们将行波映射到渐近自相似解上，从而可以进行系统的 RG 处理。我们的分析揭示了与标准 RG 范式的显着背离：对于行波，尺度不变性独特地迫使场的尺度维度消失 (A=0)。这个消失的维度意味着 RG 变换重新调整了空间和时间，同时保持场大小不变。因此，所有分析扰动都变得尺度不变，消除了相关和不相关结构的传统分类。虽然经典的冲击波和孤子解以固定 RG 不动点的形式出现，但普遍性类形成的机制（逐步消除不相关的结构）从根本上不存在。\n\n因此，行波代表了一类独特的 RG 不动点，没有通用性类别。这一发现确立了这两个概念之间的关键区别，并为行波为何对初始条件和系统参数表现出强大的记忆能力提供了严格的理论基础。", "authors": [{"name": "Ko Okumura"}], "featured_authors": [{"name": "Ko Okumura"}], "author_count": 1}, {"id": "2609.19051", "category": "cond-mat", "title": "Field-driven quantum phase transitions in a spin-1/2 Heisenberg antiferromagnet on an extended Lieb lattice", "abstract": "The magnetic behavior of the spin-1/2 Heisenberg antiferromagnet on the extended Lieb lattice is examined in the presence of an external magnetic field. Using density matrix renormalization group calculations, we determine the zero-temperature magnetization curves and construct the ground-state phase diagram in the magnetic field vs. the interaction ratio plane. Depending on the interaction ratio, the zero-temperature magnetization curves exhibit field-driven quantum phase transitions between the gapped phases manifested as the intermediate plateaus at $1/5$ and $3/5$ of the saturation magnetization and a gapless spin-canted phase, in which the magnetization varies continuously with the applied magnetic field. Quantum Monte Carlo simulations reveal clear finite-temperatures signatures of the field-induced quantum phase transitions and the intermediate magnetization plateaus, while they provide no evidence for either continuous or discontinuous thermal phase transitions.", "url": "https://arxiv.org/abs/2609.19051", "type": "理论+数值", "summary": "在存在外部磁场的情况下，检查了扩展利布晶格上自旋 1/2 海森堡反铁磁体的磁性行为。使用密度矩阵重正化群计算，我们确定了零温磁化曲线并构建了磁场与相互作用比平面中的基态相图。根据相互作用比，零温度磁化曲线表现出带隙相之间的场驱动量子相变，表现为饱和磁化强度 $1/5$ 和 $3/5$ 处的中间平台，以及无带隙自旋倾斜相，其中磁化强度随施加的磁场连续变化。量子蒙特卡罗模拟揭示了场引起的量子相变和中间磁化平台的清晰的有限温度特征，但它们没有提供连续或不连续热相变的证据。", "authors": [{"name": "David Sivy"}, {"name": "Jozef Strecka"}], "featured_authors": [{"name": "David Sivy"}, {"name": "Jozef Strecka"}], "author_count": 2}, {"id": "2609.19060", "category": "cond-mat", "title": "Robust Topology and Tunable Geometry in Generalized BHZ Model with Fractional Dispersion", "abstract": "With recent developments in fractional quantum mechanics, we introduce a fractional generalization of the Bernevig-Hughes-Zhang (BHZ) model to investigate the effects of fractional dispersion on band topology and quantum geometry. In the low-energy limit, the model reduces to a fractional Dirac Hamiltonian while preserving momentum-space periodicity, thereby ensuring a compact Brillouin zone and a well-defined topological invariant. We further show that the corresponding real-space tight-binding model can be constructed directly through a Fourier-series transformation, providing a simpler and more general alternative to the methods typically employed for fractional lattice systems. This approach readily extends beyond the generalized BHZ model considered here. Using the Bloch eigenstates, we compute the quantum geometric tensor and analyze its components, namely the Berry curvature and quantum metric. We find that fractional tuning redistributes these quantities throughout the Brillouin zone as the dispersion exponent becomes fractional, leading to pronounced modifications of the local band geometry. In contrast, the Chern number remains invariant, demonstrating the robustness of the global topological phase against fractional deformation. We further argue that this invariance persists for a broad class of fractional models.", "url": "https://arxiv.org/abs/2609.19060", "type": "理论", "summary": "随着分数量子力学的最新发展，我们引入了 Bernevig-Hughes-Zhang (BHZ) 模型的分数推广，以研究分数色散对能带拓扑和量子几何的影响。在低能量极限下，模型简化为分数狄拉克哈密顿量，同时保留动量空间周期性，从而确保紧凑的布里渊区和明确的拓扑不变量。我们进一步表明，可以通过傅里叶级数变换直接构建相应的实空间紧束缚模型，为分数格系统通常采用的方法提供了一种更简单、更通用的替代方法。这种方法很容易超出这里考虑的广义 BHZ 模型。使用布洛赫本征态，我们计算量子几何张量并分析其组成部分，即贝里曲率和量子度量。我们发现，当色散指数变为分数时，分数调谐会在整个布里渊区重新分布这些量，从而导致局部能带几何形状的显着修改。\n\n相比之下，陈数保持不变，证明了全局拓扑相对抗分数变形的鲁棒性。我们进一步认为，这种不变性对于一大类分数模型来说仍然存在。", "authors": [{"name": "Coleen Adrianne Panganiban"}, {"name": "Kristian Hauser Villegas"}], "featured_authors": [{"name": "Coleen Adrianne Panganiban"}, {"name": "Kristian Hauser Villegas"}], "author_count": 2}, {"id": "2609.17656", "category": "hep-th", "title": "The Kerr/CFT energy gap", "abstract": "Noether charges in gravity are always defined with respect to a reference metric, but the near-horizon extremal Kerr (NHEK) solution does not come with an obvious choice of reference metric (it is not asymptotically flat, for example). We discuss a one parameter generalization of the NHEK solution due to Kinnersley and Kelley which interpolates between NHEK and an analytically continued version of Minkowski spacetime. We use this interpolating family of solutions to compute the conformal energy of NHEK above the Minkowski reference metric. We find an interesting order of limits issue when computing the conformal energy of the Minkowski vacuum and we discuss a few natural prescriptions for fixing it, including one motivated by the Kerr/CFT correspondence.", "url": "https://arxiv.org/abs/2609.17656", "type": "理论", "summary": "引力中的任何电荷总是相对于参考度量来定义，但是近地平线极值克尔 (NHEK) 解没有明显的参考度量选择（例如，它不是渐近平坦的）。我们讨论了 Kinnersley 和 Kelley 提出的 NHEK 解的单参数推广，它在 NHEK 和 Minkowski 时空的解析连续版本之间进行插值。我们使用这个插值解系列来计算 NHEK 高于 Minkowski 参考度量的共形能量。在计算 Minkowski 真空的共形能量时，我们发现了一个有趣的极限阶数问题，并讨论了一些解决该问题的自然方法，其中包括由 Kerr/CFT 对应关系激发的方法。", "authors": [{"name": "Robert Penna"}], "featured_authors": [{"name": "Robert Penna"}], "author_count": 1}, {"id": "2609.17657", "category": "hep-th", "title": "Quantum Dynamics of Probe Particles in Thermal Fields and the Emergence of Stochastic Dynamics", "abstract": "Starting from a general Hamiltonian describing the quantum dynamics of probe particles interacting with a set of environment degrees of freedom, we derive the quantum master equation with which the reduced density matrix of a probe particle evolves, the general equilibration condition that they satisfy when the environment is prepared in a thermal state -- encoded in a KMS property for line operators extended in real time -- and the Langevin description that emerges. The novelty of our results resides in their generality: We do not assume a specific form of the environment self-coupling, of the environment operator that couples the particle to it, of the statistics of its correlation functions, whether the statistics of the momentum transfer is Gaussian or not, or whether the probe particles move relativistically. Our results only require that spacetime translations, parity and time reversal be symmetries of the Hamiltonian, and that there exists a separation of scales between those characterizing the dispersion relation of the probe particle and those of the environment. We also discuss the limiting case in which Gaussian Brownian motion emerges. Overall, our results constitute a first-principles derivation of what properties of the underlying quantum field theory govern the energy loss and momentum fluctuations of probe particles.", "url": "https://arxiv.org/abs/2609.17657", "type": "理论", "summary": "从描述探针粒子与一组环境自由度相互作用的量子动力学的一般哈密顿量开始，我们推导了探针粒子的约简密度矩阵演化的量子主方程、当环境准备在热状态时它们满足的一般平衡条件（编码在实时扩展的线算子的 KMS 属性中）以及出现的朗之万描述。我们的结果的新颖性在于它们的普遍性：我们没有假设环境自耦合的特定形式，将粒子耦合到环境算子的特定形式，其相关函数的统计量，动量传递的统计量是否是高斯的，或者探测粒子是否相对论性移动。我们的结果只要求时空平移、宇称和时间反转是哈密顿量的对称性，并且在表征探针粒子色散关系的那些特征与环境的色散关系之间存在尺度分离。我们还讨论了高斯布朗运动出现的极限情况。\n\n总的来说，我们的结果构成了基础量子场论的哪些属性控制探针粒子的能量损失和动量涨落的第一性原理推导。", "authors": [{"name": "Bruno Scheihing-Hitschfeld"}], "featured_authors": [{"name": "Bruno Scheihing-Hitschfeld"}], "author_count": 1}, {"id": "2609.17660", "category": "hep-th", "title": "Bosonic String Amplitudes From Ribbon Graphs", "abstract": "We develop a method for numerically computing higher genus CFT correlators and string amplitudes based on Kontsevich's ribbon graph parametrization of the moduli space $\\mathcal{M}_{g,n}$ of punctured Riemann surfaces. Using this method, we compute the compact boson partition function up to genus 6 as well as the moduli space integrand for bosonic string vacuum amplitudes up to genus 3. Our results pass a number of nontrivial numerical checks. In particular, the moduli space integrand of bosonic string amplitudes reproduce the Igusa cusp forms at genera 2 and 3.", "url": "https://arxiv.org/abs/2609.17660", "type": "理论", "summary": "我们开发了一种基于穿孔黎曼曲面模空间 $\\mathcal{M}_{g,n}$ 的 Kontsevich 带状图参数化的数值计算高属 CFT 相关器和弦振幅的方法。使用这种方法，我们计算了高达 6 的紧致玻色子配分函数以及高达 3 的玻色弦真空振幅的模空间被积函数。我们的结果通过了许多重要的数值检查。特别是，玻色弦振幅的模空间被积函数再现了属 2 和 3 的 Igusa 尖点形式。", "authors": [{"name": "Sam Christian"}, {"name": "Ben Mazel"}, {"name": "Yuchen Wang"}, {"name": "Xi Yin"}, {"name": "Yutai Zhang"}], "featured_authors": [{"name": "Sam Christian"}, {"name": "Ben Mazel"}, {"name": "Yuchen Wang"}, {"name": "Xi Yin"}, {"name": "Yutai Zhang"}], "author_count": 5}, {"id": "2609.17663", "category": "hep-th", "title": "Full Eigenstate Thermalization in Quantum Field Theory and Gravitational Scrambling", "abstract": "Using thermal analyticity, we derive directional large-frequency bounds on the smooth functions entering full eigenstate thermalization in continuum quantum field theory. The strongest directions reproduce the scales previously identified for lattice systems, while the complete analyticity domain reveals an asymmetric multifrequency structure. Thermal conformal correlators saturate the second- and third-order bounds, and the leading gravitational Regge contribution saturates the strongest fourth-order direction.", "url": "https://arxiv.org/abs/2609.17663", "type": "理论", "summary": "利用热分析性，我们推导出连续量子场论中进入完全本征态热化的平滑函数的方向高频界。最强的方向再现了先前为晶格系统确定的尺度，而完整的解析域揭示了不对称的多频结构。热共形相关器使二阶和三阶边界饱和，主导引力 Regge 贡献使最强的四阶方向饱和。", "authors": [{"name": "Ricardo Espíndola"}, {"name": "Viktor Jahnke"}], "featured_authors": [{"name": "Ricardo Espíndola"}, {"name": "Viktor Jahnke"}], "author_count": 2}, {"id": "2609.17666", "category": "hep-th", "title": "Representation Theory of Three-dimensional Corner Symmetries", "abstract": "We study the representation theory of the three-dimensional extended corner symmetry group associated with a circular corner. Using induced representation techniques, we construct families of representations of the infinite-dimensional corner symmetry group and analyze their unitarity and irreducibility. We also determine the maximal central extension of the symmetry group and construct the corresponding projective representations. The analysis is motivated by the role that corner symmetries play in quantum gravity, where boundary degrees of freedom --- acted upon by the corner transformations --- are expected to encode aspects of the quantum structure of spacetime. In three dimensions, the representation-theoretic structures that emerge are closely related to symmetry groups and quantum theories that already appeared as central to the study of gravity. This work provides a first step toward a systematic description of quantum gravitational corner degrees of freedom in three dimensions.", "url": "https://arxiv.org/abs/2609.17666", "type": "理论", "summary": "我们研究了与圆角相关的三维扩展角对称群的表示理论。使用诱导表示技术，我们构建了无限维角对称群的表示族并分析了它们的幺正性和不可约性。我们还确定了对称群的最大中心延伸并构造了相应的投影表示。该分析的动机是角对称性在量子引力中所起的作用，其中边界自由度（受角变换的作用）预计会编码时空量子结构的各个方面。在三维空间中，出现的表示理论结构与对称群和量子理论密切相关，这些理论已经成为引力研究的核心。这项工作为系统描述三维量子引力角自由度迈出了第一步。", "authors": [{"name": "Giulio Neri"}, {"name": "Ludovic Varrin"}], "featured_authors": [{"name": "Giulio Neri"}, {"name": "Ludovic Varrin"}], "author_count": 2}, {"id": "2609.17669", "category": "hep-th", "title": "Full Eigenstate Thermalization in Quantum Field Theory: Free Cumulants and Gravitational Scrambling", "abstract": "Using thermal analyticity, we derive directional large-frequency bounds on the smooth functions entering full eigenstate thermalization in continuum quantum field theory. The strongest directions reproduce the scales previously identified for lattice systems, while the complete analyticity domain reveals a broader asymmetric multifrequency structure. In thermal two-dimensional conformal field theory, exact two- and three-point functions saturate the corresponding bounds. At fourth order, where genuine dynamical information first appears, we show that the holographic CFTs studied here saturate the strongest full-ETH bounds. These results establish a direct connection between full ETH, free cumulants, and gravitational scrambling, and are consistent with the emergence of asymptotic freeness realized by the gravitational scrambling algebra.", "url": "https://arxiv.org/abs/2609.17669", "type": "理论", "summary": "利用热分析性，我们推导出连续量子场论中进入完全本征态热化的平滑函数的方向高频界。最强的方向再现了先前为晶格系统确定的尺度，而完整的解析域揭示了更广泛的不对称多频结构。在热二维共形场理论中，精确的两点和三点函数使相应的界限饱和。在第四阶，即真正的动态信息首次出现的地方，我们表明这里研究的全息 CFT 饱和了最强的全 ETH 边界。这些结果在完整 ETH、自由累积量和引力置乱之间建立了直接联系，并且与引力置乱代数实现的渐近自由性的出现一致。", "authors": [{"name": "Ricardo Espíndola"}, {"name": "Viktor Jahnke"}], "featured_authors": [{"name": "Ricardo Espíndola"}, {"name": "Viktor Jahnke"}], "author_count": 2}, {"id": "2609.17724", "category": "hep-th", "title": "Fixed Points, Floquet Entanglement Asymmetry, and Quantum Mpemba Effects", "abstract": "We investigate the dynamics of entanglement asymmetry in periodically driven two-dimensional conformal field theories with a global U$(1)$ symmetry, using a dynamical-system description based on iterated conformal maps, in particular Möbius maps. Starting from a symmetry-breaking excited state prepared by a local operator insertion, we show that a broad range of nonequilibrium phenomena, including local symmetry restoration, the quantum Mpemba effect, and its inverse, admit a simple geometric description in terms of the invariant data of the conformal map. We explicitly demonstrate this using Möbius maps, for which the invariant structure is described by the conjugacy classes. In particular, the dynamics of entanglement asymmetry is determined by the relative positions of the state-preparing operator insertion, the subsystem, and the fixed points, yielding distinct patterns of growth, decay, oscillation, and saturation. We further argue that this geometric picture extends to general holomorphic maps, establishing the conformal-map dynamics as a natural framework for organizing the phenomenology of entanglement asymmetry in periodically driven two-dimensional conformal field theories.", "url": "https://arxiv.org/abs/2609.17724", "type": "理论", "summary": "我们使用基于迭代共形映射（特别是莫比乌斯映射）的动力系统描述，研究具有全局 U$(1)$ 对称性的周期性驱动的二维共形场论中纠缠不对称的动力学。从由局域算子插入准备的对称破缺激发态开始，我们证明了广泛的非平衡现象，包括局域对称性恢复、量子 Mpemba 效应及其反演，可以根据共形图的不变数据进行简单的几何描述。我们使用莫比乌斯图明确地证明了这一点，其中不变结构由共轭类描述。特别是，纠缠不对称的动力学是由状态准备算子插入、子系统和固定点的相对位置决定的，产生不同的增长、衰变、振荡和饱和模式。\n\n我们进一步认为，这种几何图景扩展到一般的全纯映射，将共形映射动力学建立为在周期性驱动的二维共形场论中组织纠缠不对称现象学的自然框架。", "authors": [{"name": "Jayashish Das"}, {"name": "Filiberto Ares"}, {"name": "Arnab Kundu"}], "featured_authors": [{"name": "Jayashish Das"}, {"name": "Filiberto Ares"}, {"name": "Arnab Kundu"}], "author_count": 3}, {"id": "2609.17858", "category": "hep-th", "title": "Matter Swapping between Two Branes: A Local Type IIB D3-D7-D3 Realization of Charged-Fermion Mixing via E3 Instantons", "abstract": "Effective infrared two-sheeted descriptions of fermion mixing between braneworlds have emerged in several distinct realizations and lead to testable matter-swapping effects, motivating low-energy searches and cosmological applications. The recurrence of the same low-energy fermion operator motivates asking whether this structure can also arise from a D-brane mechanism. We construct a local Type IIB D3$_+$-D7-D3$_-$/E3 realization in which direct interbrane mixing is perturbatively forbidden but generated non-perturbatively by a suitable E3 instanton sector. The resulting low-energy interaction reproduces the characteristic pseudoscalar structure of the two-sheeted fermion operator, together with its scalar companion, while D7 Wilson transport provides the required gauge-invariant relative connection. The construction therefore provides a local string realization of the same operator structure, subject to the stated instanton and zero-mode conditions. The analysis further provides a concrete model-building roadmap toward a compact phenomenological realization: the compactification must achieve electromagnetic sequestering of the two fermion sectors and support a sufficiently light non-uniform D7 gauge mode capable of mediating a long-range relative interaction. In such a complete compactification, the mixing parameter $g$ would in principle become computable from microscopic string data and directly testable against low-energy constraints.", "url": "https://arxiv.org/abs/2609.17858", "type": "理论", "summary": "对膜世界之间费米子混合的有效红外两层描述已经出现在几种不同的实现中，并导致可测试的物质交换效应，激发了低能搜索和宇宙学应用。相同的低能费米子算子的重复出现引发了人们的疑问：这种结构是否也可以由 D 膜机制产生。我们构造了一个局部 IIB D3$_+$-D7-D3$_-$/E3 实现，其中直接膜间混合被扰动地禁止，但由合适的 E3 瞬子扇区非扰动地生成。由此产生的低能相互作用再现了两层费米子算子及其标量同伴的特征赝标量结构，而 D7 Wilson 输运提供了所需的规范不变的相对连接。因此，该构造提供了相同算子结构的本地串实现，但受到所述瞬时子和零模式条件的影响。\n\n该分析进一步提供了实现紧凑现象学实现的具体模型构建路线图：紧凑化必须实现两个费米子扇区的电磁隔离，并支持能够调解远程相对相互作用的足够轻的非均匀 D7 规范模式。在这样的完全压缩中，混合参数 $g$ 原则上将变得可以根据微观弦数据进行计算，并且可以根据低能量约束直接进行测试。", "authors": [{"name": "Michaël Sarrazin"}], "featured_authors": [{"name": "Michaël Sarrazin"}], "author_count": 1}, {"id": "2609.17861", "category": "hep-th", "title": "Six Particles, Infinite Optimism: Towards Positivity Bounds for Six-Point Amplitudes", "abstract": "The systematic generalisation of the well-established $S$-matrix positivity and bootstrap bounds from $2 \\to 2$ scattering processes to higher-point amplitudes has, to date, remained elusive. To address this, we consider a large class of tree-level UV-completions of a single-scalar EFT. Specifically, we consider the most general renormalisable $N$-scalar theory in $D=4$. By explicitly computing tree-level amplitudes for four-, five- and six-point scattering and expanding at low energies, we can search for positivity relations among the expansion coefficients. We find that quite generally positivity bounds are unavailable due to contamination from a specific class of Feynman diagrams that are linear in sign-indefinite cubic couplings. However, by isolating a sector of the full crossing-symmetric low-energy amplitude that is unaffected by these sign-indefinite cubic couplings, we find that selected six-, five- and four-point Wilson coefficients organise into positive semi-definite matrices. While a violation of these positivity statements only implies that a given EFT is inconsistent with our class of UV completions, the result helps to guide towards what more general positivity bounds for higher-point interactions could, and could not, look like.", "url": "https://arxiv.org/abs/2609.17861", "type": "理论", "summary": "迄今为止，对完善的 $S$ 矩阵正性和自举边界从 $2 \\to 2$ 散射过程到更高点振幅的系统推广仍然难以捉摸。为了解决这个问题，我们考虑单标量 EFT 的一大类树级 UV 完成。具体来说，我们考虑 $D=4$ 中最一般的可重整 $N$ 标量理论。通过显式计算四点、五点和六点散射的树级振幅并在低能量下扩展，我们可以搜索扩展系数之间的正相关关系。我们发现，由于在符号不定三次耦合中呈线性的特定类别费曼图的污染，正边界通常不可用。然而，通过隔离不受这些符号不定三次耦合影响的全交叉对称低能振幅部分，我们发现选定的六点、五点和四点威尔逊系数组织成正半定矩阵。\n\n虽然违反这些积极性陈述仅意味着给定的 EFT 与我们的 UV 完成类别不一致，但结果有助于指导更高点交互的更一般的积极性界限可能是什么样子，也不可能是什么样子。", "authors": [{"name": "Stefan Kremminger"}, {"name": "Andrew J. Tolley"}], "featured_authors": [{"name": "Stefan Kremminger"}, {"name": "Andrew J. Tolley"}], "author_count": 2}, {"id": "2609.17917", "category": "hep-th", "title": "Smooth cutoffs and analytic continuation in Casimir physics", "abstract": "Divergent series arising in the computation of Casimir energies admit two seemingly different treatments: a physically motivated regularization and subtraction procedure, and formal analytic continuation methods that assign finite values directly to divergent expressions. The agreement between these approaches for the Casimir energy between parallel plates is well known, but its origin is often left implicit. In this work, we provide a unified framework that makes this equivalence transparent. Building on Tao's theory of smoothed sums, we show that the introduction of a smooth cutoff leads to an asymptotic expansion whose finite, regulator-independent part is universally determined by the analytic continuation of the associated Dirichlet series. This identification follows from a Mellin-transform representation, in which divergences and finite contributions are encoded in the pole structure of the integrand. We extend this approach to a class of series relevant to Casimir problems. In this setting, we show that logarithmic divergences arise from pole coincidences, and we obtain a natural decomposition of the result into universal and cutoff-dependent terms, mirroring the structure of renormalization in quantum field theory.", "url": "https://arxiv.org/abs/2609.17917", "type": "理论", "summary": "卡西米尔能量计算中出现的发散级数允许两种看似不同的处理方法：物理驱动的正则化和减法过程，以及将有限值直接分配给发散表达式的形式分析连续方法。这些平行板间卡西米尔能量方法之间的一致性是众所周知的，但其起源往往是隐含的。在这项工作中，我们提供了一个统一的框架，使这种等价性变得透明。基于陶的平滑和理论，我们证明了平滑截止的引入导致了渐近展开，其有限的、与调节器无关的部分普遍由相关狄利克雷级数的解析延拓决定。这种识别遵循梅林变换表示，其中散度和有限贡献被编码在被积函数的极结构中。我们将这种方法扩展到与卡西米尔问题相关的一类级数。\n\n在这种情况下，我们证明对数散度是由极点重合引起的，并且我们将结果自然分解为通用项和截止相关项，反映了量子场论中重整化的结构。", "authors": [{"name": "Lucía N. Helou"}, {"name": "Francisco D. Mazzitelli"}], "featured_authors": [{"name": "Lucía N. Helou"}, {"name": "Francisco D. Mazzitelli"}], "author_count": 2}, {"id": "2609.18028", "category": "hep-th", "title": "Central charge an
