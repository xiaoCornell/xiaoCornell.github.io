d black hole entropy for regular extremal black-bounce spacetimes", "abstract": "The Bekenstein-Hawking entropy, proportional to one quarter of the horizon area, is fundamental in black hole thermodynamics and can also be understood via the AdS/CFT correspondence, such as the 3D BTZ black hole and 2D CFT. In this work, we adopt the Kerr/CFT approach to analyze the central charge and black hole entropy for regular extremal black-bounce spacetimes, including the counterparts of the Kerr, Kerr-Newman, and Reissner-Nordström black holes. These spacetimes are free of curvature singularities at $r=0$. We derive the near horizon geometries of these spacetimes and find that they exhibit enhanced symmetry, namely SL$(2,\\mathbb{R})\\times \\mathrm{U}(1)$ or SL$(2,\\mathbb{R}) \\times \\mathrm{SO}(3)$. By imposing appropriate boundary conditions, we analyze their asymptotic symmetry groups, which contain diffeomorphisms as well as the $\\mathrm{U}(1)_{\\rm gauge}$ symmetry arising from the electromagnetic field. We then extract the central charge from the charge algebra and evaluate the left-moving temperature of the Frolov-Thorne vacuum. It is worth emphasizing that in the black-bounce Kerr-Newman case, the central charge from the electromagnetic contribution vanishes. Furthermore, in the black-bounce Reissner-Nordström case, we uplift the 4D geometry to a 5D configuration by incorporating a $\\mathrm{U}(1)$ gauge fiber. Our results show that the microscopic entropy calculated from the Cardy formula is consistent with the Bekenstein-Hawking entropy. This agreement suggests that the Kerr/CFT approach remains valid for certain regular spacetimes without curvature singularities, thereby providing a microscopic statistical understanding of black hole entropy.", "url": "https://arxiv.org/abs/2609.18028", "type": "理论", "summary": "贝肯斯坦-霍金熵与视界面积的四分之一成正比，是黑洞热力学的基础，也可以通过 AdS/CFT 对应关系来理解，例如 3D BTZ 黑洞和 2D CFT。在这项工作中，我们采用 Kerr/CFT 方法来分析规则极值黑反射时空的中心电荷和黑洞熵，包括 Kerr、Kerr-Newman 和 Reissner-Nordström 黑洞的对应物。这些时空在 $r=0$ 处不存在曲率奇点。我们推导出这些时空的近地平线几何形状，发现它们表现出增强的对称性，即 SL$(2,\\mathbb{R})\\times \\mathrm{U}(1)$ 或 SL$(2,\\mathbb{R}) \\times \\mathrm{SO}(3)$。通过施加适当的边界条件，我们分析了它们的渐近对称群，其中包含微分同胚以及由电磁场产生的 $\\mathrm{U}(1)_{\\rm Gauge}$ 对称性。然后，我们从电荷代数中提取中心电荷，并评估弗罗洛夫-索恩真空的左移温度。值得强调的是，在黑弹克尔-纽曼案例中，电磁贡献的中心电荷消失了。\n\n此外，在黑反射 Reissner-Nordström 案例中，我们通过结合 $\\mathrm{U}(1)$ 规格光纤将 4D 几何结构提升到 5D 配置。我们的结果表明，根据卡迪公式计算出的微观熵与贝肯斯坦-霍金熵是一致的。这一协议表明，Kerr/CFT 方法对于某些没有曲率奇点的规则时空仍然有效，从而提供了对黑洞熵的微观统计理解。", "authors": [{"name": "Xu Ye"}, {"name": "Shan-Ping Wu"}, {"name": "Yu-Kun Zhang"}, {"name": "Shao-Wen Wei"}], "featured_authors": [{"name": "Xu Ye"}, {"name": "Shan-Ping Wu"}, {"name": "Yu-Kun Zhang"}, {"name": "Shao-Wen Wei"}], "author_count": 4}, {"id": "2609.18074", "category": "hep-th", "title": "Vacuum Structure of Maximally Supersymmetric Two-Dimensional Gauge Theories", "abstract": "We study the vacuum structure of maximally supersymmetric Yang--Mills theory in two dimensions. At low energies, the theory decomposes into superselection sectors consisting of orbifold conformal field theories and massive vacua. The sectors are indexed by the cuspidal data appearing in Lusztig's generalized Springer correspondence. This suggests an enhancement of the correspondence to holomorphic factorization algebras.", "url": "https://arxiv.org/abs/2609.18074", "type": "理论", "summary": "我们研究了二维最大超对称杨-米尔斯理论的真空结构。在低能量下，该理论分解为由轨道共形场论和大真空组成的超选择部分。这些部门通过 Lusztig 的广义 Springer 通信中出现的尖端数据进行索引。这表明与全纯因式分解代数的对应性增强。", "authors": [{"name": "Richard Eager"}], "featured_authors": [{"name": "Richard Eager"}], "author_count": 1}, {"id": "2609.18225", "category": "hep-th", "title": "Growing Einstein-Rosen Bridge with Multi-partite Entanglement", "abstract": "Can quantum entanglement continue to grow even after the entanglement entropies of subsystems have saturated? We address this question using genuine multi-entropy, which probes multi-partite entanglement structure beyond bipartite entanglement. In a two-sided BTZ black hole, this quantity grows linearly with time after every subsystem entropy of a fixed tripartition has saturated, extending the interval in which entanglement detects Einstein-Rosen bridge growth. The result refines the ER=EPR relation by identifying multi-partite structure invisible to ordinary entanglement entropies. Some spin-chain models and the spatially partitioned Sachdev-Ye-Kitaev (SYK) model exhibit distinct transients, while the late-time plateau values in holography, the SYK model, and Haar-random states share a universal behaviour.", "url": "https://arxiv.org/abs/2609.18225", "type": "理论", "summary": "即使子系统的纠缠熵已经饱和，量子纠缠还能继续增长吗？我们使用真正的多熵来解决这个问题，它探讨了二分纠缠之外的多分纠缠结构。在双面 BTZ 黑洞中，在固定三部分的每个子系统熵饱和后，该量随时间线性增长，从而延长了纠缠检测爱因斯坦-罗森桥增长的时间间隔。结果通过识别普通纠缠熵不可见的多部分结构来完善 ER=EPR 关系。一些自旋链模型和空间分区的 Sachdev-Ye-Kitaev (SYK) 模型表现出明显的瞬态，而全息术中的后期平台值、SYK 模型和 Haar 随机态具有普遍的行为。", "authors": [{"name": "Takanori Anegawa"}, {"name": "Akihiro Miyata"}, {"name": "Shota Suzuki"}, {"name": "Kotaro Tamaoka"}], "featured_authors": [{"name": "Takanori Anegawa"}, {"name": "Akihiro Miyata"}, {"name": "Shota Suzuki"}, {"name": "Kotaro Tamaoka"}], "author_count": 4}, {"id": "2609.18277", "category": "hep-th", "title": "Reduction of the six-dimensional $q$-form fields to the four-dimensional fields by coupling with gravity", "abstract": "In this paper, we investigate the localization of various $q$-form fields on a codimension-two brane. In particular, the $0$-form scalar field, the $1$-form $U(1)$ gauge vector field, and the $2$-form Kalb-Ramond field are considered with gravitational coupling, where a coupling function $F(R)$ is introduced into the six-dimensional actions of these fields. The function $F(R)$ depends on the scalar curvature of the bulk. Within this framework, we find that the massless modes of different $q$-form fields can be localized on the thick brane for positive values of the coupling parameters $t_1$ and $t_2$. For the massive modes, the different $q$-form fields exhibit similar localization properties determined by the coupling parameter $t_2$. When $0<t_2<v^2/24$, the massive modes of these fields cannot be localized on the brane, while they may exist as the resonant modes. In the case $t_2=v^2/24$, a finite number of massive modes can be localized on the thick brane, and the number of localized modes increases with the coupling parameter $t_1$. Finally, when $t_2>v^2/24$, the effective potentials associated with the Kaluza-Klein modes of these $q$-form fields form infinitely deep potential wells, so that all massive modes can be localized on the brane. Moreover, the tachyonic massive modes can always be excluded for different $q$-form fields.", "url": "https://arxiv.org/abs/2609.18277", "type": "理论", "summary": "在本文中，我们研究了余维二膜上各种 $q$ 形式字段的本地化。特别是，$0$形式的标量场、$1$形式的$U(1)$规范向量场和$2$形式的Kalb-Ramond场被考虑为引力耦合，其中耦合函数$F(R)$被引入到这些场的六维作用中。函数 $F(R)$ 取决于块体的标量曲率。在此框架内，我们发现对于耦合参数 $t_1$ 和 $t_2$ 为正值，不同 $q$ 形式场的无质量模式可以定位在厚膜上。对于大规模模式，不同的 $q$ 形式场表现出相似的局部化属性，由耦合参数 $t_2$ 决定。当$0<t_2<v^2/24$时，这些场的大量模式不能局域于膜上，但它们可能以共振模式存在。在$t_2=v^2/24$的情况下，厚膜上可以定位有限数量的大质量模式，并且局域模式的数量随着耦合参数$t_1$的增加而增加。\n\n最后，当$t_2>v^2/24$时，与这些$q$形式场的Kaluza-Klein模式相关的有效势形成无限深的势阱，使得所有质量模式都可以局域于膜上。此外，对于不同的$q$形式场，总是可以排除快子质量模式。", "authors": [{"name": "Yong-Tao Lu"}, {"name": "Heng Guo"}, {"name": "Qun Wei"}, {"name": "Bing Wei"}], "featured_authors": [{"name": "Yong-Tao Lu"}, {"name": "Heng Guo"}, {"name": "Qun Wei"}, {"name": "Bing Wei"}], "author_count": 4}, {"id": "2609.18295", "category": "hep-th", "title": "Turbulent gravitational waves", "abstract": "We construct turbulent gravitational wakes in asymptotically AdS$_4$ spacetimes by solving the full non-linear Einstein equations in the characteristic formulation. Specifically, we show that a localized boundary deformation acting on a boosted black brane generates a wake whose boundary dynamics exhibit the formation of coherent vortical structures that are advected downstream by the background flow. Analysing a wake propagating along the x direction, we show that it displays the characteristic self-similar scaling of classical turbulent wakes. We then identify the geometric imprint of the wake on the horizon area density, the traceless horizon extrinsic curvature, and bulk metric perturbations, finding coherent structures that extend from the asymptotic boundary to the horizon. These results provide the first study of turbulent gravitational wakes in four-dimensional asymptotically AdS spacetimes.", "url": "https://arxiv.org/abs/2609.18295", "type": "理论", "summary": "我们通过求解特征公式中的完整非线性爱因斯坦方程，在渐近 AdS$_4$ 时空中构造湍流引力尾流。具体来说，我们表明，作用在增强黑膜上的局部边界变形会产生尾流，其边界动力学表现出相干涡旋结构的形成，这些涡旋结构由背景流向下游平流输送。分析沿 x 方向传播的尾流，我们发现它表现出经典湍流尾流的特征自相似尺度。然后，我们识别地平线区域密度上尾流的几何印记、无痕地平线外在曲率和体度量扰动，找到从渐近边界延伸到地平线的相干结构。这些结果首次对四维渐近 AdS 时空中的湍流引力尾流进行了研究。", "authors": [{"name": "Giulio Taiocchi"}, {"name": "Christiana Pantelidou"}, {"name": "Miguel Zilhão"}], "featured_authors": [{"name": "Giulio Taiocchi"}, {"name": "Christiana Pantelidou"}, {"name": "Miguel Zilhão"}], "author_count": 3}, {"id": "2609.18410", "category": "hep-th", "title": "Differential equations for Dotsenko--Fateev integrals: the case of degenerate fields $Φ_{n,1}$", "abstract": "We study higher-order differential equations corresponding to integrals of the Dotsenko--Fateev type and associated with four-point correlation functions with degenerate fields $\\Phi_{n,1}$. We determine the general structure and coefficients of the equations in terms of the integral parameters $ \\{ A,B,C,g \\} $. In particular, special cases of these equations in CFT are used for verification. In addition, the relationship between higher-order differential equations and hypergeometric operators is established.", "url": "https://arxiv.org/abs/2609.18410", "type": "理论", "summary": "我们研究与 Dotsenko--Fateev 型积分相对应的高阶微分方程，并与具有简并域 $\\Phi_{n,1}$ 的四点相关函数相关联。我们根据积分参数 $ \\{ A,B,C,g \\} $ 确定方程的一般结构和系数。特别地，这些方程在CFT中的特殊情况用于验证。此外，还建立了高阶微分方程与超几何算子之间的关系。", "authors": [{"name": "Aleksandra Ivanova"}], "featured_authors": [{"name": "Aleksandra Ivanova"}], "author_count": 1}, {"id": "2609.18528", "category": "hep-th", "title": "Schwinger stability of T-duality-inspired extremal black holes", "abstract": "We study the near-horizon charged-scalar instability associated with Schwinger pair production in the charged regular black hole geometry of the zero-point-length T-duality prescription. Using the same effective geometry and regularized gauge potential, we construct the extremal branch, its ${\\rm AdS}_2 \\times S^2$ near-horizon throat, and the charged-scalar instability threshold for a general form factor. For the explicit T-duality form factor the extremal branch terminates at $r_\\mathrm{ext} = \\sqrt2 \\, l_0$, where the extremal charge and the near-horizon electric field vanish while the ${\\rm AdS}_2$ radius remains finite at $\\sqrt3 \\, l_0$. At this endpoint the exact near-horizon instability parameter is negative. In the semiclassical regime the corresponding charge-to-mass threshold diverges as the endpoint is approached. Thus, for each fixed massive species with finite $q/m$, a sufficiently near-endpoint portion of the extremal branch is free of the local charged-scalar instability. For comparison, the Ayón-Beato-García (ABG) Einstein-nonlinear-electrodynamics solution has a nonvanishing extremal near-horizon electric field. For an additional minimally coupled charged-scalar probe, the corresponding local Schwinger threshold remains finite. Thus the divergent near-endpoint Schwinger barrier found in the T-duality branch is not a generic consequence of regularity.", "url": "https://arxiv.org/abs/2609.18528", "type": "理论", "summary": "我们研究了零点长度 T 对偶性规定的带电规则黑洞几何中与施温格对产生相关的近地平线带电标量不稳定性。使用相同的有效几何结构和正则化规范势，我们构造了极值分支、其 ${\\rm AdS}_2 \\times S^2$ 近地平线喉道，以及一般形状因子的带电标量不稳定阈值。对于显式 T 对偶形状因子，极值分支终止于 $r_\\mathrm{ext} = \\sqrt2 \\, l_0$，其中极值电荷和近水平电场消失，而 ${\\rm AdS}_2$ 半径在 $\\sqrt3 \\, l_0$ 处保持有限。在此端点，精确的近地平线不稳定参数为负。在半经典体系中，随着接近终点，相应的荷质阈值会发散。因此，对于每个具有有限 $q/m$ 的固定质量物质，极值分支的足够接近端点的部分不受局部电荷标量不稳定性的影响。为了进行比较，Ayón-Beato-García (ABG) 爱因斯坦非线性电动力学解具有不消失的极值近地平线电场。\n\n对于附加的最小耦合带电标量探针，相应的局部施温格阈值仍然是有限的。因此，在 T 对偶分支中发现的发散近端点施温格势垒并不是正则性的一般结果。", "authors": [{"name": "Chiang-Mei Chen"}, {"name": "Kimet Jusufi"}, {"name": "Douglas Singleton"}], "featured_authors": [{"name": "Chiang-Mei Chen"}, {"name": "Kimet Jusufi"}, {"name": "Douglas Singleton"}], "author_count": 3}, {"id": "2609.18566", "category": "hep-th", "title": "Deep learning emergent spacetime from fermionic spectral functions in holography", "abstract": "We present a physics-informed machine learning framework based on Neural Ordinary Differential Equations that solves the holographic inverse problem: reconstructing the bulk spacetime and gauge field of a charged AdS black hole directly from boundary fermionic spectral functions. Encoding the UV asymptotics, horizon regularity, and zero temperature extremality as hard constraints in the neural network architecture, our framework reliably reconstructs the extremal Reissner-Nordström AdS geometry across three quantum critical regimes set by the $U(1)$ probe charge---non-Fermi liquid, marginal Fermi liquid (strange metal), and Fermi-liquid-like states---and can jointly infer the probe charge itself to sub-percent accuracy. Relaxing the near-AdS boundary constraint uncovers a geometrical degeneracy: bulk profiles that differ throughout the radial direction but share the same near-horizon $AdS_2 \\times \\mathbb{R}^2$ data reproduce identical spectral functions near the Fermi surface. This isospectral non-uniqueness is precisely the bulk degeneracy expected on general holographic grounds at zero temperature, and its spontaneous emergence across independent training runs shows that the network isolates the IR CFT universality rather than overfitting a single UV completion.", "url": "https://arxiv.org/abs/2609.18566", "type": "理论", "summary": "我们提出了一种基于神经常微分方程的物理机器学习框架，该框架解决了全息反问题：直接从边界费米子谱函数重建带电 AdS 黑洞的体时空和规范场。我们的框架将 UV 渐近性、地平线正则性和零温度极值编码为神经网络架构中的硬约束，可靠地重建了由 $U(1)$ 探针电荷设置的三个量子临界状态（非费米液体、边缘费米液体（奇怪金属）和类费米液体状态）的极值 Reissner-Nordström AdS 几何形状，并且可以联合推断探针电荷本身，精确度低于百分之一。放宽近 AdS 边界约束揭示了几何简并性：在整个径向方向上不同但共享相同近地平线 $AdS_2 \\times \\mathbb{R}^2$ 数据的体轮廓在费米表面附近再现相同的谱函数。\n\n这种等谱非唯一性正是零温度下一般全息基础上预期的整体简并性，并且它在独立训练运行中自发出现表明网络隔离了 IR CFT 普遍性，而不是过度拟合单个 UV 完成。", "authors": [{"name": "Koji Hashimoto"}, {"name": "Hyun-Sik Jeong"}, {"name": "Keun-Young Kim"}, {"name": "Daichi Takeda"}, {"name": "Kwan Yun"}], "featured_authors": [{"name": "Koji Hashimoto"}, {"name": "Hyun-Sik Jeong"}, {"name": "Keun-Young Kim"}, {"name": "Daichi Takeda"}, {"name": "Kwan Yun"}], "author_count": 5}, {"id": "2609.18668", "category": "hep-th", "title": "The geometry of multiloop Feynman Integrals from the Scattering Facet", "abstract": "The Scattering Facet (SF) of the Cosmological Polytope is a positive geometry defined from a Feynman diagram and encoding its combinatorics. Its canonical differential form reproduces the result of the integration over the energy components of loop momenta in scalar Feynman integrals, and is therefore closely related to the Loop-Tree Duality (LTD). In this article, we present a novel description of the SF as a base-fiber geometry. The fibers are a family of polytopes called deformed graphical zonotopes, which have a natural interpretation in terms of the causal evolution of the underlying Feynman diagram, and capture interesting information on scattering amplitudes. This decomposition of the SF induces a description of the canonical form leading to the so-called causal representation. Moreover, it provides new mathematical tools that allow us to characterize all its regular triangulations. Canonical forms obtained from these triangulations correspond to spanning tree representations, matching the original LTD amplitudes expressed as a sum over spanning trees. This geometrical viewpoint provides us with new methods to obtain the causal and spanning tree representations, without the need of performing any integration.", "url": "https://arxiv.org/abs/2609.18668", "type": "理论", "summary": "宇宙多面体的散射面（SF）是从费曼图定义的正几何形状并对其组合进行编码。其正则微分形式再现了标量费曼积分中环动量能量分量的积分结果，因此与环树对偶性 (LTD) 密切相关。在本文中，我们对 SF 作为基础光纤几何结构进行了新颖的描述。这些纤维是一类被称为变形图形同位素的多胞体家族，它们对底层费曼图的因果演化有自然的解释，并捕获有关散射幅度的有趣信息。 SF 的这种分解引发了对规范形式的描述，从而产生所谓的因果表示。此外，它还提供了新的数学工具，使我们能够表征其所有规则三角剖分。从这些三角测量获得的规范形式对应于生成树表示，与表示为生成树总和的原始LTD幅度相匹配。\n\n这种几何观点为我们提供了获得因果树和生成树表示的新方法，而无需执行任何积分。", "authors": [{"name": "José Ríos-Sánchez"}, {"name": "Germán Rodrigo"}], "featured_authors": [{"name": "José Ríos-Sánchez"}, {"name": "Germán Rodrigo"}], "author_count": 2}, {"id": "2609.18791", "category": "hep-th", "title": "Carrollian axion electrodynamics", "abstract": "We construct theories of Carrollian electromagnetism coupled to an axion field. Obtained by performing a $c \\to 0$ expansion of axion electrodynamics, these are of two types: electric and magnetic. We derive the Lagrangians and work out the general classical solutions for both. While the electric theory has the axion effectively decoupled from the electromagnetic fields, the magnetic theory is endowed with a nontrivial axion coupling that leads to interesting phenomenology. In particular, a Carrollian analogue of the Witten effect, wherein a magnetic monopole in the presence of a constant non-vanishing axion acquires an electric charge and becomes a dyon, is present in the magnetic theory. At the same time, the linear magnetoelectric effect vanishes entirely, a conclusion we establish by performing a thorough Dirac-Bergmann analysis of the constraint structure of the magnetic theory and a proper identification of its physical phase space.", "url": "https://arxiv.org/abs/2609.18791", "type": "理论", "summary": "我们构建了与轴子场耦合的卡罗尔电磁理论。通过执行轴子电动力学的 $c \\to 0$ 展开而获得，它们有两种类型：电和磁。我们推导出拉格朗日量并计算出两者的一般经典解。虽然电理论使轴子有效地与电磁场解耦，但磁理论赋予了重要的轴子耦合，从而产生有趣的现象学。特别是，磁理论中存在维滕效应的卡罗尔类似物，其中磁单极子在存在恒定不消失轴子的情况下获得电荷并变成动力子。与此同时，线性磁电效应完全消失，这是我们通过对磁理论的约束结构进行彻底的狄拉克-伯格曼分析并正确识别其物理相空间得出的结论。", "authors": [{"name": "Hemant Rathi"}, {"name": "Ashish Shukla"}], "featured_authors": [{"name": "Hemant Rathi"}, {"name": "Ashish Shukla"}], "author_count": 2}, {"id": "2609.18831", "category": "hep-th", "title": "Auxiliary Field Deformations of the Lambda Model", "abstract": "Many examples of integrable sigma models admit families of integrable deformations that involve coupling the undeformed ``seed'' theory to auxiliary fields with algebraic equations of motion. In this work, we apply this paradigm to the case where the seed theory is the lambda model, which interpolates between the Wess-Zumino-Witten model and the non-Abelian T-dual of the principal chiral model. We present an auxiliary field deformation of the lambda model and exhibit a Lax connection whose flatness is equivalent to the remaining equations of motion after imposing the algebraic field equations. We also carry out a Hamiltonian analysis of the deformed theory, verifying that it obeys the assumptions of theorems in arXiv:2605.18213 which guarantee both (i) that the model enjoys the Maillet structure that ensures involution of its conserved charges, and (ii) that the theory possesses a classical Yangian. Thus, as in other cases, the auxiliary field deformation of the lambda model changes its classical dynamics while leaving the integrable structure essentially unchanged.", "url": "https://arxiv.org/abs/2609.18831", "type": "理论", "summary": "可积西格玛模型的许多例子都承认可积变形族，这些变形涉及将未变形的“种子”理论与具有代数运动方程的辅助场耦合。在这项工作中，我们将此范式应用于种子理论为 lambda 模型的情况，该模型在 Wess-Zumino-Witten 模型和主手性模型的非阿贝尔 T-对偶之间进行插值。我们提出了 lambda 模型的辅助场变形，并展示了 Lax 连接，其平坦度等效于施加代数场方程后的剩余运动方程。我们还对变形理论进行了哈密顿分析，验证了它遵循 arXiv:2605.18213 中定理的假设，该假设保证了（i）该模型具有确保其守恒电荷对合的 Maillet 结构，以及（ii）该理论具有经典杨量。因此，与其他情况一样，lambda 模型的辅助场变形改变了其经典动力学，同时使可积结构基本不变。", "authors": [{"name": "Christian Ferko"}, {"name": "Cian Luke Martin"}, {"name": "Pranat Sharma"}], "featured_authors": [{"name": "Christian Ferko"}, {"name": "Cian Luke Martin"}, {"name": "Pranat Sharma"}], "author_count": 3}, {"id": "2609.18884", "category": "hep-th", "title": "The Geometry of the CKM matrix, the Standard Model and RG fixed points", "abstract": "We investigate the geometry of the Fermion mixing matrix in the Standard Model. The principal structure studied is the CKM matrix, $V$, viewed as an element of the double coset space $M$, where $M=T\\backslash SU(3)/T$, and $T=U(1)\\times U(1)$. The space $M$ is given a Riemannian metric, and has both point singularities, which it is shown correspond to the known renormalization group fixed points, and line singularities connecting the fixed points. A key discrete object inducing many of these properties is the Weyl group, $W$, of $SU(3)$, $W$ being the symmetric group $S_3$, which appears in the guise of the vertices of a hexagon in $V$.", "url": "https://arxiv.org/abs/2609.18884", "type": "理论", "summary": "我们研究标准模型中费米子混合矩阵的几何形状。研究的主要结构是 CKM 矩阵 $V$，被视为双陪集空间 $M$ 的元素，其中 $M=T\\backslash SU(3)/T$，且 $T=U(1)\\times U(1)$。空间 $M$ 被赋予黎曼度量，并且具有点奇点（显示对应于已知的重整化群固定点）和连接固定点的线奇点。引发许多这些属性的关键离散对象是 $SU(3)$ 的 Weyl 群 $W$，$W$ 是对称群 $S_3$，它以 $V$ 中六边形顶点的形式出现。", "authors": [{"name": "Brian P. Dolan"}, {"name": "Charles Nash"}], "featured_authors": [{"name": "Brian P. Dolan"}, {"name": "Charles Nash"}], "author_count": 2}, {"id": "2609.18944", "category": "hep-th", "title": "Reading Topological Hair from Black-Hole Entanglement", "abstract": "Black-hole hair can affect boundary mixed-state entanglement through local stress-energy and through topological information invisible to the classical metric. We separate these channels for a Nielsen--Olesen vortex on a nonrotating BTZ black hole. A superselection theorem shows that Shannon sector entropy cancels from the Markov gap, while standard $U(1)$ symmetry-resolved reflected entropy in a thermal $U(1)_k$ CFT is equipartitioned at leading order, excluding a universal $\\log|n|$ term in the imbalance-resolved gap. We therefore define a Wilson-threaded reflected moment in a probe $U(1)_k$ Chern--Simons completion coupled to the compact vortex-flux class. In a reflected-replica sector with linking number $\\nu$, its normalised phase is $2\\pi\\kappa pn\\nu/k$, where $\\kappa\\in\\mathbb Z$ is the mixed topological coupling; for $\\gcd(\\kappa\\nu,k)=1$, a discrete Fourier transform reconstructs $n\\bmod k$. The RT connectivity transition switches the specified linked contour on or off, whereas the independent scale $\\ell_\\star r_+/L^2=1.128378\\ldots$ determines the direction of the vortex-induced shift of that transition. The charged-moment modulus and the ordinary Markov gap remain geometric observables and are computed from a horizon-anchored Einstein-Abelian-Higgs solution with a complete first-variation kernel including the motion of the entanglement-wedge cross-section endpoints. This phase and modulus separation distinguishes topological hair from gravitational dressing without assigning an unsupported winding-dependent entropy.", "url": "https://arxiv.org/abs/2609.18944", "type": "理论", "summary": "黑洞毛发可以通过局部应力能和经典度量不可见的拓扑信息影响边界混合态纠缠。我们将这些通道分离为非旋转 BTZ 黑洞上的 Nielsen-Olesen 涡旋。超选择定理表明，香农扇区熵抵消了马尔可夫间隙，而热 $U(1)_k$ CFT 中标准 $U(1)$ 对称解析反射熵在前导顺序上均分，不包括不平衡解析间隙中的通用 $\\log|n|$ 项。因此，我们在探针 $U(1)_k$ Chern 中定义威尔逊线程反射矩 - 与紧凑涡流类耦合的西蒙斯完成。在链接数为 $\\nu$ 的反射副本扇区中，其归一化相位为 $2\\pi\\kappa pn\\nu/k$，其中 $\\kappa\\in\\mathbb Z$ 是混合拓扑耦合；对于 $\\gcd(\\kappa\\nu,k)=1$，离散傅里叶变换重建 $n\\bmod k$。 RT 连接转换打开或关闭指定的链接轮廓，而独立比例 $\\ell_\\star r_+/L^2=1.128378\\ldots$ 确定该转换的涡流引起的移位的方向。\n\n带电矩模量和普通马尔可夫间隙仍然是几何可观测量，并且是根据地平线锚定的爱因斯坦-阿贝尔-希格斯解计算的，具有完整的第一变体内核，包括纠缠楔形横截面端点的运动。这种相位和模量分离将拓扑毛发与重力修饰区分开来，而无需指定无支撑的缠绕相关熵。", "authors": [{"name": "Kumar Ghosh"}], "featured_authors": [{"name": "Kumar Ghosh"}], "author_count": 1}, {"id": "2609.19056", "category": "hep-th", "title": "Majoron dark matter detection via hybrid magnon transmon qubit system", "abstract": "Ultralight Majorons are well-motivated dark-matter candidates that can couple to electron spins, generating an oscillating pseudo-magnetic field. We propose a hybrid magnon-qubit haloscope that exploits this interaction to search for Majoron dark matter. In our scheme, the Majoron field resonantly drives the Kittel mode of a ferrimagnetic yttrium iron garnet (YIG) sphere, producing a collective magnon response enhanced by the large spin ensemble. The resulting magnon population is transduced to a superconducting transmon qubit through a cavity-mediated dispersive interaction and detected using quantum-nondemolition Ramsey interferometry. Using experimentally demonstrated parameters for magnon-cavity-qubit systems, we derive the Majoron-induced signal, evaluate the projected sensitivity, and analyze the corresponding mass-scan strategy enabled by magnetic-field tuning, benchmarking the projected reach against existing laboratory and astrophysical constraints on the axion/Majoron-electron coupling. Our results establish hybrid magnon-qubit architectures as a promising quantum-sensing platform for searches for Majoron dark matter and, more generally, ultralight bosonic fields coupled to electronic spins.", "url": "https://arxiv.org/abs/2609.19056", "type": "理论", "summary": "超轻主子星是暗物质候选者，可以与电子自旋耦合，产生振荡赝磁场。我们提出了一种混合磁振子-量子位光晕仪，利用这种相互作用来寻找马约龙暗物质。在我们的方案中，Majoron 场共振驱动亚铁磁性钇铁石榴石 (YIG) 球体的基特尔模式，产生由大型自旋系综增强的集体磁振子响应。由此产生的磁振子群通过空腔介导的色散相互作用转换为超导跨子量子位，并使用量子非破坏拉姆齐干涉测量法进行检测。使用磁振子腔量子位系统的实验证明参数，我们推导了马约隆感应信号，评估了预计的灵敏度，并分析了通过磁场调谐实现的相应质量扫描策略，根据现有实验室和天体物理对轴子/马约隆电子耦合的限制对预计范围进行了基准测试。\n\n我们的研究结果将混合磁振子-量子位架构建立为一种有前途的量子传感平台，用于搜索马约龙暗物质，更一般地说，搜索与电子自旋耦合的超轻玻色子场。", "authors": [{"name": "Le Bin Ho"}, {"name": "Do Thi Huong"}], "featured_authors": [{"name": "Le Bin Ho"}, {"name": "Do Thi Huong"}], "author_count": 2}, {"id": "2609.19075", "category": "hep-th", "title": "When duality changes the poles: $SL(2,\\mathbb{Z})$ transformations of linear response EFTs", "abstract": "We study how $SL(2,\\mathbb Z)$ transformations act on pole-truncated linear-response effective theories in $(2+1)$ dimensions. For correlators meromorphic within a finite low-frequency domain, the EFT data include both derivative-expanded transport coefficients and the retained non-hydrodynamic poles. Since the $S$-trans\\-for\\-mation inverts the optical conductivity and exchanges its poles and zeros, it does not necessarily commute with the infrared truncation. We derive explicit maps for static susceptibilities, the Einstein relation and AC transport coefficients. In the purely hydrodynamic sector the map closes on the original transport data, while in quasihydrodynamic regimes the transformed pole positions and, in general, residues constitute additional infrared data. We test the construction in the alternatively quantised D3/D5 probe-brane system, where an EFT retaining one original gapped pole can correspond to transformed EFTs retaining zero, one or two. The holographic results verify the analytic maps and exhibit an inverse-Drude conductivity at large values of the control parameter.", "url": "https://arxiv.org/abs/2609.19075", "type": "理论", "summary": "我们研究 $SL(2,\\mathbb Z)$ 变换如何作用于 $(2+1)$ 维度的极点截断线性响应有效理论。对于有限低频域内的亚纯相关器，EFT 数据包括导数扩展传输系数和保留的非流体动力极点。由于$S$反式变换会反转光导率并交换其极点和零点，因此它不一定与红外截断交换。我们导出了静态磁化率、爱因斯坦关系和交流传输系数的显式图。在纯流体动力学领域，地图以原始输运数据为基础，而在准流体动力学领域，变换后的极位置以及一般情况下的残差构成了额外的红外数据。我们在交替量化的 D3/D5 探针膜系统中测试了该结构，其中保留一个原始间隙极点的 EFT 可以对应于保留零、一或二的变换后的 EFT。全息结果验证了解析图，并在控制参数较大值时表现出逆德鲁德电导率。", "authors": [{"name": "Andrea Amoretti"}, {"name": "Daniel K. Brattan"}, {"name": "Jonas Rongen"}], "featured_authors": [{"name": "Andrea Amoretti"}, {"name": "Daniel K. Brattan"}, {"name": "Jonas Rongen"}], "author_count": 3}, {"id": "2609.17742", "category": "math-ph", "title": "Monodromy Eigenvectors for Difference Equations with Root-of-Unity Step", "abstract": "A qKZ-type discrete flat connection with multiplicative step $p$ has monodromy operators when $p$ is a root of unity. The monodromy operators are commuting endomorphisms of the connection. We construct their eigensections and eigenvalues. The construction is based on the presentation of the discrete flat connection as a discrete Gauss-Manin connection.", "url": "https://arxiv.org/abs/2609.17742", "type": "理论", "summary": "当 $p$ 是单位根时，具有乘法步长 $p$ 的 qKZ 型离散平面连接具有单性运算符。单性算子是连接的交换自同态。我们构造它们的特征截面和特征值。该构造基于将离散平面连接表示为离散高斯-马宁连接。", "authors": [{"name": "Vitaly Tarasov"}, {"name": "Alexander Varchenko"}], "featured_authors": [{"name": "Vitaly Tarasov"}, {"name": "Alexander Varchenko"}], "author_count": 2}, {"id": "2609.17803", "category": "math-ph", "title": "An additional possibilities of the standard method of inverting the Radon transform", "abstract": "The problem of inverting the Radon integral transform in finite-dimensional Euclidean space is considered. The relevance of this topic for probing issues is indicated. It is noted that for the latter direction, it is natural to consider the integrand as discontinuous function. However, the available inversion formulas are only proven for differentiable functions. Therefore, the question of obtaining formulas for discontinuous functions arises. It is set that the required results can be obtained by some modification of available proofs for smooth functions.", "url": "https://arxiv.org/abs/2609.17803", "type": "理论", "summary": "考虑有限维欧氏空间中Radon积分变换的逆问题。指出了本主题与探究问题的相关性。值得注意的是，对于后一个方向，很自然地将被积函数视为不连续函数。然而，可用的反演公式仅针对可微函数进行证明。因此，就出现了获取间断函数公式的问题。规定可以通过对平滑函数的可用证明进行一些修改来获得所需的结果。", "authors": [{"name": "D.S. Anikonov"}, {"name": "S.G. Kazantsev"}, {"name": "D.S. Konovalova"}], "featured_authors": [{"name": "D.S. Anikonov"}, {"name": "S.G. Kazantsev"}, {"name": "D.S. Konovalova"}], "author_count": 3}, {"id": "2609.17833", "category": "math-ph", "title": "Canonical and symplectic analysis of the Holst action in the $G\\rightarrow 0$ limit", "abstract": "By using the Dirac and symplectic formalisms, the analysis of the Holst action in the $G \\rightarrow 0$ limit is performed. We study the theory's full canonical structure and symmetries. In particular, we focus on the cases $\\gamma = i$ and $\\gamma \\neq i$, aiming to obtain Smolin's auto-self-dual model in terms of the Ashtekar variables and a Barbero-type formulation. We then perform the symplectic analysis and discuss the principal insight of these formalisms.", "url": "https://arxiv.org/abs/2609.17833", "type": "理论", "summary": "通过使用狄拉克和辛形式主义，对 $G \\rightarrow 0$ 极限中的 Holst 作用进行了分析。我们研究该理论的完整规范结构和对称性。我们特别关注 $\\gamma = i$ 和 $\\gamma \\neq i$ 的情况，旨在根据 Ashtekar 变量和 Barbero 型公式获得 Smolin 的自对偶模型。然后我们进行辛分析并讨论这些形式主义的主要见解。", "authors": [{"name": "Victor Julian Pérez-Aquino"}, {"name": "Alberto Escalante"}], "featured_authors": [{"name": "Victor Julian Pérez-Aquino"}, {"name": "Alberto Escalante"}], "author_count": 2}, {"id": "2609.18356", "category": "math-ph", "title": "Pathology-Free Real-Space Renormalization Group Theory on an Inverse Limit Space", "abstract": "It has been over fifty years since Kenneth Wilson had his Nobel-prize-winning ideas on the renormalization group. In this time frame, despite many attempts, no mathematical results have implemented Wilson's vision to a satisfactory degree. Although a number of predictions stemming from the renormalization group framework have been proven to date, these proofs usually rely on alternative ideas and do not cover the full predictive power of Wilson's renormalization group. The discovery of pathologies within rigorous implementations of renormalization group transformations have further reduced the enthusiasm of the mathematics community for this subject. This paper presents a novel framework to implement Wilson's original idea in a rigorous manner based on inverse limits of finite systems. Doing so, one avoids these pathologies and hence obtains a mathematically sound framework for Wilson's renormalization group. This opens up a completely new path to tackle some of the existing problems in rigorous renormalization group theory like the existence of non-trivial fixed points.", "url": "https://arxiv.org/abs/2609.18356", "type": "理论", "summary": "肯尼思·威尔逊 (Kenneth Wilson) 提出关于重整化群的诺贝尔奖获奖想法已经五十多年了。在这段时间内，尽管进行了多次尝试，但没有任何数学结果能够令人满意地实现威尔逊的愿景。尽管迄今为止，源自重正化群框架的许多预测已得到证明，但这些证明通常依赖于替代思想，并且没有涵盖威尔逊重正化群的全部预测能力。在重整化群变换的严格实现中发现的病态进一步降低了数学界对这一学科的热情。本文提出了一种新颖的框架，基于有限系统的逆极限，以严格的方式实现威尔逊的原始想法。这样做可以避免这些病态，从而为威尔逊重正化群获得一个数学上合理的框架。这为解决严格重整化群理论中的一些现有问题（例如非平凡不动点的存在）开辟了一条全新的途径。", "authors": [{"name": "Fabio Arz"}], "featured_authors": [{"name": "Fabio Arz"}], "author_count": 1}, {"id": "2609.18550", "category": "math-ph", "title": "Some Considerations on the Fluid-Dynamical Limit of Particle Systems", "abstract": "In this note we review and compare mathematical procedures aimed at rigorously deriving fluid-dynamic descriptions of classical particle systems in the large-scale limit of Hamiltonian dynamics. Despite the longstanding nature of this program, its fundamental problems remain open, with only a few notable exceptions that we briefly highlight.", "url": "https://arxiv.org/abs/2609.18550", "type": "理论", "summary": "在这篇文章中，我们回顾和比较了旨在严格推导哈密顿动力学大规模极限下经典粒子系统的流体动力学描述的数学程序。尽管该计划由来已久，但其基本问题仍然悬而未决，只有我们简要强调的一些值得注意的例外。", "authors": [{"name": "Mario Pulvirenti"}, {"name": "Sergio Simonella"}], "featured_authors": [{"name": "Mario Pulvirenti"}, {"name": "Sergio Simonella"}], "author_count": 2}, {"id": "2609.18661", "category": "math-ph", "title": "Contact canonoid maps and their conserved and dissipated quantities", "abstract": "We study conserved and dissipated quantities associated with contact canonoid transformations and their extension to possibly singular smooth maps. The defining condition is imposed on the pulled-back contact one-form, without requiring it to remain contact. A polynomial construction produces first integrals from one-forms having the same dissipation rate as the original contact form. Two normalizations extend this construction to maps whose associated Hamiltonians have different dissipation rates. On the set where the associated Hamiltonian is nonzero, we construct a smooth invariant endomorphism whose traces are conserved. This construction includes zeros of the original Hamiltonian, where the endomorphism vanishes. We relate the tensor traces to the coefficients of the Hamiltonian-normalized polynomial and obtain an upper bound of n functionally independent trace invariants in dimension 2n + 1. A five-dimensional singular map attains this bound. Examples include singular maps for the damped free particle, a transformation with unequal dissipation rates, the damped harmonic oscillator, and motion under gravity with linear friction.", "url": "https://arxiv.org/abs/2609.18661", "type": "理论", "summary": "我们研究与接触佳能变换相关的守恒量和耗散量及其对可能的奇异平滑映射的扩展。定义条件施加于拉回接触单一形式，而不要求其保持接触。多项式构造从具有与原始接触形式相同耗散率的单一形式产生第一积分。两种归一化将此构造扩展到其相关哈密顿量具有不同耗散率的映射。在相关哈密顿量非零的集合上，我们构造一个平滑不变自同态，其迹是守恒的。该构造包括原始哈密顿量的零点，其中自同态消失。我们将张量迹与哈密顿归一化多项式的系数相关联，并获得 2n + 1 维中 n 个功能独立迹不变量的上限。五维奇异映射达到此界限。示例包括阻尼自由粒子的奇异映射、不等耗散率的变换、阻尼谐振子以及线性摩擦重力下的运动。", "authors": [{"name": "R. Azuaje"}], "featured_authors": [{"name": "R. Azuaje"}], "author_count": 1}, {"id": "2609.18919", "category": "math-ph", "title": "Wehrl-type entropy problem for compact connected semisimple Lie groups", "abstract": "This paper solves the Wehrl-type entropy problem for arbitrary compact connected semisimple Lie groups. Let $G$ be a compact connected semisimple Lie group, and let $\\pi:G\\to U(V_\\lambda)$ be a finite-dimensional irreducible unitary representation associated with the highest weight $\\lambda$. We prove that coherent projectors are the unique minimizers of the Wehrl entropy over all density matrices on $V_\\lambda$. They also uniquely maximize every Husimi power moment of order $p>1$. The proof uses a second-variation at the extremizer by perturbation in directions associated with Killing fields, similar to the strategy of Frank and Lieb used in \\cite{FrankLieb}. Then the problem reduces to the extreme-moment property of highest-weight vectors.", "url": "https://arxiv.org/abs/2609.18919", "type": "理论", "summary": "本文解决了任意紧连通半单李群的Wehrl型熵问题。令$G$为紧连通半单李群，并令$\\pi:G\\to U(V_\\lambda)$为与最高权重$\\lambda$相关的有限维不可约酉表示。我们证明相干投影仪是 $V_\\lambda$ 上所有密度矩阵上 Wehrl 熵的唯一最小化器。他们还独特地最大化每个 Husimi 幂矩 $p>1$。该证明通过在与杀伤场相关的方向上进行扰动来在极端器上使用第二变体，类似于 \\cite{FrankLieb} 中使用的 Frank 和 Lieb 的策略。然后问题就简化为最高权重向量的极矩性质。", "authors": [{"name": "Haonan Zhang"}], "featured_authors": [{"name": "Haonan Zhang"}], "author_count": 1}, {"id": "2609.18937", "category": "math-ph", "title": "Polynomial rigidity of strong-field magnetic billiards", "abstract": "A magnetic billiard describes a charged particle constrained to a planar domain: the particle moves along circular Larmor arcs in the interior and undergoes specular reflection at the boundary. The round disk has an explicit first integral that is polynomial in the velocity, and a central rigidity question asks whether any other smooth convex table can have such an integral. We answer this question negatively in the strong-field regime. Let $\\Omega\\subset\\mathbb R^2$ be a bounded strictly convex domain with smooth boundary $\\gamma$, let $r=|B|^{-1}$ be the Larmor radius, and assume $0<r<r_0(\\gamma)/2$, where $r_0(\\gamma)$ is the maximal embedded tubular radius. If the magnetic billiard admits a nonconstant first integral polynomial in the velocity variables, of any finite degree, then $\\Omega$ is a disk. This removes the finite exceptional set of strong field strengths left by the earlier polynomial nonintegrability theory. The rigidity mechanism has two logically independent stages. First, the highest reflection mode gives a boundary winding identity. This determines the degree of the top coefficient and places all of its roots strictly inside the table, but it does not show that those roots coincide. Second, after the two leading reflection identities are continued to the normalization of the complexified boundary, their valuations at infinity exclude simultaneous poles of the coordinate functions. The remaining one-sided poles force the entire top coefficient to be one linear factor of multiplicity equal to the Fourier degree. Combining the location theorem with this root-collapse theorem produces a constant-angle relation between the boundary tangent and a radial direction, hence circularity. No real-analytic boundary hypothesis is imposed: analyticity follows from the algebraic strong-field parallel curves.", "url": "https://arxiv.org/abs/2609.18937", "type": "理论", "summary": "磁台球描述了被限制在平面域内的带电粒子：粒子在内部沿着圆形拉莫尔弧移动，并在边界处经历镜面反射。圆盘有一个显式的第一积分，它是速度的多项式，并且中心刚性问题询问是否任何其他光滑凸台可以具有这样的积分。我们在强场体系中否定地回答这个问题。令 $\\Omega\\subset\\mathbb R^2$ 为具有光滑边界 $\\gamma$ 的有界严格凸域，令 $r=|B|^{-1}$ 为拉莫尔半径，并假设 $0<r<r_0(\\gamma)/2$，其中 $r_0(\\gamma)$ 为最大嵌入管状半径。如果磁性台球在速度变量中承认任意有限次的非常数第一积分多项式，则 $\\Omega$ 是一个圆盘。这消除了早期多项式不可积性理论留下的有限例外强场强集。刚性机制有两个逻辑上独立的阶段。首先，最高反射模式给出了边界缠绕特性。\n\n这确定了顶部系数的阶数并将其所有根严格放置在表内，但并不表明这些根重合。其次，在两个主要反射恒等式继续到复杂边界的归一化之后，它们在无穷大的估值排除了坐标函数的同时极点。其余的单侧极点迫使整个顶部系数成为等于傅立叶阶数的重数线性因子。将位置定理与根塌陷定理相结合，产生边界切线和径向之间的恒定角度关系，从而产生圆度。不强加实解析边界假设：解析性来自代数强场平行曲线。", "authors": [{"name": "Dipesh Bhandari"}], "featured_authors": [{"name": "Dipesh Bhandari"}], "author_count": 1}, {"id": "2609.19005", "category": "math-ph", "title": "The Thermodynamic Limit of Short-Range Spin Glasses with Periodic Boundary Conditions", "abstract": "For the nearest-neighbour Edwards--Anderson Ising model on the discrete torus, we prove existence of the quenched thermodynamic limit and almost-sure self-averaging of the free-energy density. The only moment assumption in the main argument is $\\E|J|<\\infty$, and no symmetry or centering of the coupling law is needed. The proof avoids periodic subadditivity: the wrap-around bonds form a surface-order perturbation, while a tiling argument and the strong law of large numbers give the free-boundary limit. We also obtain the quantitative bounds $(O(L^{-1})$ for the disorder-averaged finite-volume correction. A precise common probability space is specified, since an almost-sure statement across volumes is otherwise not well defined.", "url": "https://arxiv.org/abs/2609.19005", "type": "理论", "summary": "对于离散环面上的最近邻爱德华兹-安德森伊辛模型，我们证明了淬火热力学极限的存在和自由能密度的几乎确定的自平均。主要论证中唯一的矩假设是 $\\E|J|<\\infty$，并且不需要耦合律的对称性或中心化。该证明避免了周期性次可加性：环绕键形成了表面序扰动，而平铺论证和强大数定律则给出了自由边界极限。我们还获得了无序平均有限体积校正的定量界限 $(O(L^{-1})$。指定了精确的公共概率空间，因为否则无法很好地定义跨体积的几乎确定的陈述。", "authors": [{"name": "Hexiang Wang"}, {"name": "Keheng Zhu"}, {"name": "Mauris Chueng"}], "featured_authors": [{"name": "Hexiang Wang"}, {"name": "Keheng Zhu"}, {"name": "Mauris Chueng"}], "author_count": 3}, {"id": "2609.17574", "category": "quant-ph", "title": "The Golden Junction of Gaussian Covariance Geometries: Sector Anisotropy, Relative-Entropy Response, and Local Penalties", "abstract": "We compare four local geometries of centered one-mode bosonic Gaussian covariances while keeping their operational meanings distinct. In a common trace-orthonormal normalization, the Bures and covariance Fisher--Rao cometric determinants cross intrinsically at \\(x^2=\\varphi\\). After introducing a constant action-matching parameter \\(\\eta\\), the Bures--Wasserstein determinant joins them only at \\((x,\\eta)=(\\sqrt\\varphi,\\sqrt\\varphi)\\). Equal determinant density does not mean tensor equality: relative to Fisher--Rao, the Bures cometric at the junction is \\[ Q_{\\rm gold}=\\varphi^{-2}\\Pi_0+\\varphi\\Pi_2, \\qquad \\det Q_{\\rm gold}=1, \\] so its inverse has the exact scalar-to-weight-two quadratic penalty ratio \\(\\varphi^3\\). The normalized Bogoliubov--Kubo--Mori metric supplies an independent relative-entropy diagnostic. It agrees radially with Bures but has shape cometric eigenvalue \\(4\\hbar^2x/\\log[(x+1)/(x-1)]\\); it therefore does not form a fourth determinant junction and becomes tangentially stiff at the pure-state boundary. Operationally, weight-two motion is generated by a system-only Gaussian unitary, whereas radial motion requires a Gaussian channel or ancillary dilation. The known Uhlmann--Ruan purification quotient realizes the local Bures state metric, but an explicit \\(\\mathfrak{sp}(4,\\mathbb R)\\) test shows that an unweighted right-invariant Frobenius gate norm does not reproduce the golden penalty. Conditional branch selection and finite-rate Bures--Wasserstein cost separation are presented as secondary statements, not as dynamical phase transitions.", "url": "https://arxiv.org/abs/2609.17574", "type": "理论", "summary": "我们比较了中心单模玻色高斯协方差的四种局部几何，同时保持其操作含义不同。在常见的迹正交归一化中，Bures 和协方差 Fisher-Rao 彗星行列式在 \\(x^2=\\varphi\\) 处本质上交叉。在引入恒定动作匹配参数 \\(\\eta\\) 后，Bures--Wasserstein 行列式仅在 \\((x,\\eta)=(\\sqrt\\varphi,\\sqrt\\varphi)\\) 处将它们连接起来。行列式密度相等并不意味着张量相等：相对于 Fisher--Rao，交界处的 Bures 彗星为 \\[ Q_{\\rm gold}=\\varphi^{-2}\\Pi_0+\\varphi\\Pi_2, \\qquad \\det Q_{\\rm gold}=1, \\] 因此其逆具有精确的标量与权重二次罚分比 \\(\\varphi^3\\)。标准化的 Bogoliubov--Kubo--Mori 度量提供了独立的相对熵诊断。它在径向上与 Bures 一致，但具有形状彗星特征值 \\(4\\hbar^2x/\\log[(x+1)/(x-1)]\\);因此，它不会形成第四行列式结，并且在纯态边界处变得切向刚性。在操作上，权重二运动由仅系统高斯酉生成，而径向运动需要高斯通道或辅助膨胀。\n\n已知的 Uhlmann-Ruan 净化商实现了局部 Bures 状态度量，但显式 \\(\\mathfrak{sp}(4,\\mathbb R)\\) 测试表明，未加权的右不变 Frobenius 门范数不能重现金罚。条件分支选择和有限速率 Bures--Wasserstein 成本分离作为辅助语句呈现，而不是作为动态相变。", "authors": [{"name": "Christian Kerskens"}], "featured_authors": [{"name": "Christian Kerskens"}], "author_count": 1}, {"id": "2609.17690", "category": "quant-ph", "title": "Quantum Encodings, Private Messages, and Communication Complexity", "abstract": "We study the complexity of quantum decomposable randomized encodings (QDRE). We establish a bi-directional connection between the QDRE model and the communication complexity model of quantum private simultaneous message protocols (QPSM), where classical communication is free, and quantum communication is the primary complexity measure. We show the following upper and lower bounds. (1) For every quantum channel mapping $n$ to $m$ qubits, we give a QPSM protocol with quantum communication $m$, using exponential pre-shared entanglement. In particular, constant-output channels have $O(1)$ quantum communication, and classical-output channels require no quantum communication. (2) With $O(n)$ pre-shared entanglement, every one-qubit-output channel has an $O(n)$-quantum-communication QPSM protocol. Conversely, there exists a channel and a constant $c>0$ for which any protocol with at most $cn$ pre-shared entanglement requires $\\Omega(n)$ quantum communication. (3) In contrast, we identify a structured class of quantum channels, Clifford-induced channels, for which there exist QPSM protocols with $O(n)$ pre-shared entangled qubits and only $O(1)$ quantum communication complexity. Through our connection, we obtain analogous upper and lower bounds on the quantum encoding size of QDRE. Our results show that the amount of pre-shared entanglement plays a central role in quantum encoding size and quantum communication complexity.", "url": "https://arxiv.org/abs/2609.17690", "type": "理论", "summary": "我们研究量子可分解随机编码（QDRE）的复杂性。我们在QDRE模型和量子私有同步消息协议（QPSM）的通信复杂性模型之间建立了双向连接，其中经典通信是免费的，而量子通信是主要的复杂性度量。我们显示以下上限和下限。 (1) 对于将 $n$ 映射到 $m$ 量子位的每个量子通道，我们使用指数预共享纠缠给出具有量子通信 $m$ 的 QPSM 协议。特别是，恒定输出通道具有 $O(1)$ 量子通信，而经典输出通道不需要量子通信。 (2) 通过 $O(n)$ 预共享纠缠，每个单量子比特输出通道都有一个 $O(n)$ 量子通信 QPSM 协议。相反，存在一个通道和一个常数 $c>0$，对于该通道，任何具有最多 $cn$ 预共享纠缠的协议都需要 $\\Omega(n)$ 量子通信。 (3) 相比之下，我们确定了一种结构化的量子通道，即 Clifford 诱导通道，其中存在具有 $O(n)$ 预共享纠缠量子位且只有 $O(1)$ 量子通信复杂性的 QPSM 协议。\n\n通过我们的联系，我们获得了 QDRE 量子编码大小的类似上限和下限。我们的结果表明，预共享纠缠的数量在量子编码大小和量子通信复杂性中起着核心作用。", "authors": [{"name": "Tom Gur"}, {"name": "Miryam Mi-Ying Huang"}, {"name": "Er-Cheng Tang"}], "featured_authors": [{"name": "Tom Gur"}, {"name": "Miryam Mi-Ying Huang"}, {"name": "Er-Cheng Tang"}], "author_count": 3}, {"id": "2609.17694", "category": "quant-ph", "title": "Efficiency-Resolved Recovery Dynamics of an Free-Running InGaAs/InP Single Photon Avalanche Detector Operated in Gated Mode", "abstract": "Detection efficiency in gated-mode single-photon avalanche detectors recovers gradually after each gate edge, limiting attainable count rates, yet quantitative recovery models exist only for free-running operation. We extract the gated recovery time constant of a free-running InGaAs/InP detector at 1550 nm by sweeping the gate frequency from 100 kHz to 1 MHz and globally fitting count rates across four dead times, requiring neither a pulsed laser nor a time-to-digital converter. The recovery time decreases linearly with detection efficiency, from 301 to 161 ns between 10 % and 25 %, at 9.3 ns per percentage point. We further resolve a periodic count-rate modulation consistent with bias-dependent capacitive gate feedthrough.", "url": "https://arxiv.org/abs/2609.17694", "type": "理论+数值", "summary": "门控模式单光子雪崩探测器的检测效率在每个门边缘后逐渐恢复，限制了可达到的计数率，但定量恢复模型仅适用于自由运行操作。我们通过将门频率从 100 kHz 扫描到 1 MHz 并在四个死区时间内全局拟合计数率，提取 1550 nm 处自由运行的 InGaAs/InP 探测器的门控恢复时间常数，既不需要脉冲激光器，也不需要时间数字转换器。恢复时间随检测效率线性降低，在 10% 至 25% 范围内从 301 纳秒降至 161 纳秒，每百分点 9.3 纳秒。我们进一步解决了与偏置相关的电容栅极馈通一致的周期性计数率调制问题。", "authors": [{"name": "Bruno Santos Souza"}, {"name": "Vitor Tavares"}, {"name": "Filippo Ghiglieno"}, {"name": "Celso Jorge Villas-Boas"}, {"name": "Paulo Henrique Dias Ferreira"}], "featured_authors": [{"name": "Bruno Santos Souza"}, {"name": "Vitor Tavares"}, {"name": "Filippo Ghiglieno"}, {"name": "Celso Jorge Villas-Boas"}, {"name": "Paulo Henrique Dias Ferreira"}], "author_count": 5}, {"id": "2609.17706", "category": "quant-ph", "title": "Diagnosing and Restoring the Degraded Fault Distance of Magic State Cultivation", "abstract": "T-state cultivation is a resource-efficient protocol producing logical T states but recent benchmarks show that its logical error rate is considerably higher than intended i.e. than S-state cultivation, which is the analogous protocol for producing logical S states. In this paper, we explain this T-S discrepancy by analytically showing, under circuit-level depolarising noise, that distance-3 (-5) T-state cultivation has fault distance 2 (3) due to Pauli hook errors that propagate to coherent Clifford errors after its final double-check circuit; such errors remain Pauli in S-state cultivation, which consequently retains fault distance 3 (5). As part of our analysis we derive a general formula, and an $\\mathcal O(n^3)$-time algorithm for fixed logical-qubit count, for the acceptance probability of a logical mixed state afflicted with a Clifford error, where $n$ is the physical qubit count. We then design flags that detect the malignant hook errors in cultivation, improving the pre-escape logical error rate from $\\mathcal O(p^3)$ to $\\mathcal O(p^5)$. At noise level $p =10^{-3}$, this is a 4.9$\\times$ improvement, costing a 1.36$\\times$ increase in attempts per accepted shot.", "url": "https://arxiv.org/abs/2609.17706", "type": "理论+数值", "summary": "T 状态培养是一种产生逻辑 T 状态的资源高效协议，但最近的基准测试表明，其逻辑错误率比预期高得多，即比 S 状态培养高，S 状态培养是用于产生逻辑 S 状态的类似协议。在本文中，我们通过分析显示在电路级去极化噪声下，距离 3 (-5) T 状态培养具有故障距离 2 (3)，这是由于泡利钩误差在其最终双重检查电路后传播为相干 Clifford 误差，从而解释了这种 T-S 差异；这些错误在 S 状态培养中保留泡利，因此保留断层距离 3 (5)。作为分析的一部分，我们推导出一个通用公式，以及一个用于固定逻辑量子位计数的 $\\mathcal O(n^3)$ 时间算法，用于计算受 Clifford 错误影响的逻辑混合状态的接受概率，其中 $n$ 是物理量子位计数。然后，我们设计了检测培养中恶性钩子错误的标志，将转义前逻辑错误率从 $\\mathcal O(p^3)$ 提高到 $\\mathcal O(p^5)$。在噪声水平 $p =10^{-3}$ 下，这是 4.9$\\times$ 的改进，每个接受的镜头的尝试次数增加了 1.36$\\times$。", "authors": [{"name": "Tim Chan"}, {"name": "Armands Strikis"}, {"name": "Zhu Sun"}, {"name": "Zhenyu Cai"}], "featured_authors": [{"name": "Tim Chan"}, {"name": "Armands Strikis"}, {"name": "Zhu Sun"}, {"name": "Zhenyu Cai"}], "author_count": 4}, {"id": "2609.17785", "category": "quant-ph", "title": "Exact damping-basis continued fractions for few-atom lasers: collective correlations beyond second-order cumulant closure", "abstract": "We combine the Briegel--Englert damping basis of a lossy cavity mode with the permutation-invariant Liouville basis of \\(N\\) identical, incoherently pumped two-level emitters. The resulting Liouvillian is exactly block tridiagonal in a single radial field index, with atomic blocks of dimension \\(\\binom{N+3}{3}\\). The stationary state follows from a matrix continued fraction whose asymptotic closure is a linear matrix equation that we prove to be uniquely solvable throughout the dissipative regime \\(A>0\\), and the same construction in the coherence-one sector yields the emission spectrum. The method is validated against direct diagonalization, weak-pump perturbation theory, and closed-system spectra, reaches \\(N=16\\) in tens of seconds in the few-quanta regime, and has a quantified precision limit at large photon number. We use it to derive an exact two-atom photon-balance identity that isolates the cavity-induced pair coherence and relates it to a singlet--triplet population difference; to establish an exact pump-order hierarchy of connected correlations for a zero-temperature cavity and a parity property of the minimal collective-spin sector; and to benchmark the second-order cumulant closure used in few-emitter laser theory, which we find to be semi-quantitative for the photon number but to predict the wrong sign of the inter-emitter coherence above inversion. In a good-cavity regime the exact solution shows near-Poissonian statistics and strong line narrowing for two and three emitters.", "url": "https://arxiv.org/abs/2609.17785", "type": "理论", "summary": "我们将有损腔模式的布里格尔-恩格勒特阻尼基础与 N 个相同、非相干泵浦两能级发射器的排列不变刘维尔基础相结合。得到的刘维尔式在单个径向场索引中恰好是块三对角，原子块的维度为 \\(\\binom{N+3}{3}\\)。稳态由矩阵连分式得出，其渐近闭包是一个线性矩阵方程，我们证明该方程在整个耗散区域 \\(A>0\\) 中是唯一可解的，并且相干一扇区中的相同结构产生发射光谱。该方法针对直接对角化、弱泵浦扰动理论和闭系统光谱进行了验证，在少量子状态下在数十秒内达到\\(N=16\\)，并且在大光子数下具有量化精度极限。\n\n我们用它来推导出精确的双原子光子平衡恒等式，该恒等式隔离了空腔引起的对相干性，并将其与单线态-三线态布居差异联系起来；为零温腔和最小集体自旋扇区的奇偶性建立精确的泵浦阶次关联关系；并对少发射器激光理论中使用的二阶累积量闭包进行基准测试，我们发现它对于光子数来说是半定量的，但预测了反演上发射器间相干性的错误符号。在良好的腔体状态下，精确解显示出接近泊松分布的统计数据以及两个和三个发射器的强烈线变窄。", "authors": [{"name": "Stephan Hartmann"}], "featured_authors": [{"name": "Stephan Hartmann"}], "author_count": 1}, {"id": "2609.17835", "category": "quant-ph", "title": "Depth analysis of the Quantum Approximate Optimization Algorithm with a Grover mixer", "abstract": "We study the Quantum Approximate Optimization Algorithm with a Grover mixer and independently sampled cost and mixing angles. Under a lattice condition on the cost values carried by the initial state, we prove a depth-independent lower bound for the variance of the loss at every depth, together with the same bound for the derivative with respect to the final mixing angle. The estimate is instance-dependent and, for fixed locality, is inverse polynomial in the number of qubits for integer-valued local objective functions with uniformly bounded local terms, in particular for MaxCut. We also establish Grover-type reachability bounds showing that the depth required to approximate a prescribed carried eigenspace is bounded below by a constant multiple of the inverse square root of its initial probability.", "url": "https://arxiv.org/abs/2609.17835", "type": "理论+数值", "summary": "我们使用 Grover 混合器以及独立采样的成本和混合角度研究量子近似优化算法。在初始状态所承载的成本值的晶格条件下，我们证明了每个深度的损失方差的与深度无关的下界，以及相对于最终混合角度的导数的相同界限。该估计与实例相关，并且对于固定局部性，是具有统一有界局部项的整数值局部目标函数的量子位数量的反多项式，特别是对于 MaxCut。我们还建立了 Grover 型可达性界限，表明近似规定的携带本征空间所需的深度受其初始概率的倒数平方根的常数倍的限制。", "authors": [{"name": "Bojko N. Bakalov"}, {"name": "Dimitar Grantcharov"}], "featured_authors": [{"name": "Bojko N. Bakalov"}, {"name": "Dimitar Grantcharov"}], "author_count": 2}, {"id": "2609.17920", "category": "quant-ph", "title": "Classical, quantum, and general probabilistic state-discrimination profiles", "abstract": "For a collection of states indexed by $[n]={1,\\ldots,n}$, let $F(H)$ denote the optimal unnormalized minimum discrimination error for each nonempty subfamily $H\\subseteq[n]$. We call $F$ the discrimination profile and characterize exactly which profiles can arise in a general probabilistic theory (GPT). For fixed $n$, the GPT region $\\mathfrak{G}_n$ is a bounded rational polytope, giving a hierarchy $\\mathfrak{C}_n\\subseteq\\mathfrak{Q}_n\\subseteq\\mathfrak{G}_n$ of classical, quantum, and GPT profiles, analogous to the local--quantum--no-signalling hierarchy in Bell theory. For $n=3$ we determine the classical and GPT polytopes explicitly. Within $\\mathfrak{G}_3$, the classical region is characterized by $\\beta:=F(123)-F(12)-F(13)-F(23)\\le0$, while the GPT maximum is $1$. For qubit triples, the maximal value is attained by the trine, $\\beta_{\\mathrm{tr}}=3\\sqrt3/2-2$, and we prove the dimension-independent quantum bound $\\beta_{\\mathrm Q}\\le2/3$, with a slight further improvement. Hence $0=\\beta_{\\mathrm C}<3\\sqrt3/2-2\\le\\beta_{\\mathrm Q}\\le2/3<1=\\beta_{\\mathrm{GPT}}$. We conjecture $\\beta_{\\mathrm Q}=\\beta_{\\mathrm{tr}}$ and prove this for arbitrary pure-state triples, together with further supporting evidence. For arbitrary $n$, every classical facet admitting a GPT violation already admits a quantum violation in dimension at most $3$. A four-state qubit example shows that quantum success profiles need not be submodular, unlike for $n=3$. Finally, we exhibit a four-dimensional quantum triple whose discrete profile is classical for all subfamilies but becomes nonclassical when unequal priors are allowed.", "url": "https://arxiv.org/abs/2609.17920", "type": "理论", "summary": "对于由 $[n]={1,\\ldots,n}$ 索引的状态集合，令 $F(H)$ 表示每个非空子族 $H\\subseteq[n]$ 的最佳非归一化最小辨别误差。我们将 $F$ 称为辨别概要，并准确地描述了一般概率理论 (GPT) 中可能出现哪些概要。对于固定的$n$，GPT区域$\\mathfrak{G}_n$是一个有界有理多面体，给出了经典、量子和GPT剖面的层次结构$\\mathfrak{C}_n\\subseteq\\mathfrak{Q}_n\\subseteq\\mathfrak{G}_n$，类似于贝尔理论中的局域-量子-无信号层次结构。对于 $n=3$，我们明确确定经典多胞形和 GPT 多胞形。在$\\mathfrak{G}_3$内，经典区域的特征为$\\beta:=F(123)-F(12)-F(13)-F(23)\\le0$，而GPT最大值为$1$。对于量子位三元组，最大值是通过三位一体获得的，$\\beta_{\\mathrm{tr}}=3\\sqrt3/2-2$，并且我们证明了与维度无关的量子界限$\\beta_{\\mathrm Q}\\le2/3$，并略有进一步的改进。因此$0=\\beta_{\\mathrm C}<3\\sqrt3/2-2\\le\\beta_{\\mathrm Q}\\le2/3<1=\\beta_{\\mathrm{GPT}}$。\n\n我们推测 $\\beta_{\\mathrm Q}=\\beta_{\\mathrm{tr}}$ 并针对任意纯态三元组证明这一点，并提供进一步的支持证据。对于任意 $n$，每个承认 GPT 违规的经典方面都已经承认维度最多为 $3$ 的量子违规。四态量子位示例表明，与 $n=3$ 不同，量子成功曲线不需要是子模的。最后，我们展示了一个四维量子三元组，其离散轮廓对于所有子族都是经典的，但当允许不相等的先验时，它会变得非经典。", "authors": [{"name": "Mihály Weiner"}], "featured_authors": [{"name": "Mihály Weiner"}], "author_count": 1}, {"id": "2609.17941", "category": "quant-ph", "title": "Rényi and Tsallis information entropies for a harmonic position-dependent mass", "abstract": "In this paper, we study Renyi and Tsallis information entropies for a Hamiltonian system with position-dependent mass confined in harmonic oscillator potential. Gegenbauer polynomials are used to obtain the position eigenfunction of such a system, and the modified Bessel function of the second kind is used to determine the equivalent momentum eigenfunction. By means of probability densities of both representations, we analytically and numerically evaluate the Heisenberg-like uncertainty of this system. Because the Renyi and Tsallis information entropies in position representation are described by integral functionals of the Gegenbauer polynomials, these quantities are much more difficult to calculate. To get around this problem, we evaluate these information entropies at the system s asymptotical limit, which corresponds to the behavior of an undeformed harmonic oscillator. Nevertheless, no approximation method is used to obtain the Tsallis and Renyi information entropies in momentum representation. In both representations, we find that these information entropies approach the Shannon entropy when the entropic parameter alpha-> 1 and are closed to the results of similar models of the literature. Finally, we evaluate the related entropic uncertainty relations numerically to validate the latter obersevations.", "url": "https://arxiv.org/abs/2609.17941", "type": "理论+数值", "summary": "在本文中，我们研究了哈密顿系统的 Renyi 和 Tsallis 信息熵，该系统的位置相关质量限制在简谐振子势内。使用Gegenbauer多项式来获得该系统的位置本征函数，并使用第二类修正贝塞尔函数来确定等效动量本征函数。通过两种表示的概率密度，我们分析并数值地评估了该系统的海森堡式不确定性。由于位置表示中的 Renyi 和 Tsallis 信息熵是通过 Gegenbauer 多项式的积分泛函来描述的，因此这些量的计算要困难得多。为了解决这个问题，我们在系统的渐近极限处评估这些信息熵，这对应于未变形谐振子的行为。然而，没有使用近似方法来获得动量表示中的 Tsallis 和 Renyi 信息熵。\n\n在这两种表示中，我们发现当熵参数 alpha->1 时，这些信息熵接近香农熵，并且接近文献中类似模型的结果。最后，我们对相关的熵不确定性关系进行数值评估，以验证后面的观察结果。", "authors": [{"name": "Dorcas A. Addo"}, {"name": "Daniel Sabi-Takou"}, {"name": "Eugene Adjei"}, {"name": "Latévi M. Lawson"}], "featured_authors": [{"name": "Dorcas A. Addo"}, {"name": "Daniel Sabi-Takou"}, {"name": "Eugene Adjei"}, {"name": "Latévi M. Lawson"}], "author_count": 4}, {"id": "2609.17970", "category": "quant-ph", "title": "The Fourier Uncertainty Principle Through the Lens of Infinite Banded Matrices", "abstract": "In this paper, we investigate the Fourier uncertainty principle through infinite banded matrices by way of a variational approach to minimizing the uncertainty product. Traditional methods for analyzing the Fourier uncertainty principle rely heavily on the Heisenberg--Weyl structure that underlie the Fourier transform and therefore do not generalize well beyond this setting. We provide three distinct approaches to developing the uncertainty principle based on the spectrum of a shifted quantum harmonic oscillator Hamiltonian, $H_{a,b}$. In the Hermite--Gauss basis, $H_{a,b}$ has an infinite, tridiagonal form which is central to the analysis. One approach exactly solves for the spectrum through analytic methods, another decomposes $H_{a,b}$ into an infinite sum of $2\\times 2$ matrices, and the third approach is an algebraic approach to establishing the spectrum via a unitary equivalence with the quantum harmonic oscillator. The approaches taken herein provide alternate avenues that are more broadly applicable to other canonically conjugate operators for other integral transforms which maintain a tridiagonal form.", "url": "https://arxiv.org/abs/2609.17970", "type": "理论+数值", "summary": "在本文中，我们通过无限带状矩阵研究傅里叶不确定性原理，通过变分方法来最小化不确定性乘积。分析傅里叶不确定性原理的传统方法严重依赖于傅里叶变换基础的海森堡-外尔结构，因此不能很好地推广到这种设置之外。我们提供了三种不同的方法来开发基于位移量子谐振子哈密顿量 $H_{a,b}$ 频谱的不确定性原理。在厄米高斯基础中，$H_{a,b}$ 具有无限的三对角形式，这是分析的核心。一种方法通过解析方法精确求解频谱，另一种方法将 $H_{a,b}$ 分解为 $2\\times 2$ 矩阵的无限和，第三种方法是一种代数方法，通过与量子谐振子的酉等价来建立频谱。本文所采用的方法提供了更广泛地适用于保持三对角形式的其他积分变换的其他正则共轭算子的替代途径。", "authors": [{"name": "Cameron L. Williams"}, {"name": "Lara C. Ortelli"}, {"name": "Gael Silva"}], "featured_authors": [{"name": "Cameron L. Williams"}, {"name": "Lara C. Ortelli"}, {"name": "Gael Silva"}], "author_count": 3}, {"id": "2609.18081", "category": "quant-ph", "title": "Remote Adiabatic Controlled-Z Gate between Distant Superconducting Qubits", "abstract": "Direct entangling gates between spatially separated qubits are a key capability for modular quantum computing. They enable nonlocal quantum circuits to be executed across different processor modules, thereby alleviating single-chip scaling constraints and expanding the effective connectivity of the system. Here, we propose and numerically investigate a remote adiabatic controlled-Z gate between two frequency-tunable superconducting qubits connected by a multi-mode coaxial cable. The cable-mediated interaction enables the gate to be implemented without additional tunable couplers, preserving a simple circuit architecture. For a 30-cm cable, simulations incorporating ten standing-wave modes yield an optimized gate infidelity of $4.71\\times10^{-7}$ with a duration of 376.7 ns in the absence of decoherence. The gate maintains high fidelity under qubit-frequency fluctuations and millimeter-scale cable-length variations. Calculations for 50- and 100-cm cable situations demonstrate its potential for even larger cryogenic systems. These results provide a promising approach to extending high-fidelity quantum operations beyond individual chips and toward scalable, interconnected superconducting quantum processors.", "url": "https://arxiv.org/abs/2609.18081", "type": "理论+数值", "summary": "空间分离的量子位之间的直接纠缠门是模块化量子计算的关键功能。它们使得非局部量子电路能够在不同的处理器模块上执行，从而减轻单芯片扩展限制并扩展系统的有效连接性。在这里，我们提出并数值研究了通过多模同轴电缆连接的两个频率可调超导量子位之间的远程绝热控制 Z 门。电缆介导的交互使得无需额外的可调谐耦合器即可实现门，从而保留了简单的电路架构。对于 30 厘米电缆，在没有退相干的情况下，包含 10 个驻波模式的模拟产生了 4.71\\times10^{-7}$ 的优化栅极不保真度，持续时间为 376.7 ns。该门在量子位频率波动和毫米级电缆长度变化下保持高保真度。对 50 厘米和 100 厘米电缆情况的计算证明了其在更大的低温系统中的潜力。\n\n这些结果提供了一种有前途的方法，可以将高保真量子操作扩展到单个芯片之外，并扩展到可扩展、互连的超导量子处理器。", "authors": [{"name": "Si-Yu Xu"}, {"name": "Yi-Rong Jin"}, {"name": "Wen-Gang Zhang"}, {"name": "Hai-Feng Yu"}], "featured_authors": [{"name": "Si-Yu Xu"}, {"name": "Yi-Rong Jin"}, {"name": "Wen-Gang Zhang"}, {"name": "Hai-Feng Yu"}], "author_count": 4}, {"id": "2609.18209", "category": "quant-ph", "title": "The Expressive Power of Constrained QAOA: What You Might Have MISsed", "abstract": "Feasibility-preserving mixer Hamiltonians offer an attractive alternative to penalty encodings for constrained quantum optimization, yet how enforcing constraints alters the state space reachable by the Quantum Approximate Optimization Algorithm (QAOA) remains largely unexplored. We address this question within the context of the Maximum Independent Set (MIS) problem. Alongside the standard controlled bit-flip mixer, we analyze the alternative $\\mathit{Flip\\text{-}or\\text{-}Stay}$ mixer, whose restriction to the feasible subspace $W_{\\mathcal{F}}$ corresponds precisely to the shifted negative Laplacian of the independent-set reconfiguration graph. Although both mixers induce identical transitions between independent sets, the diagonal modification changes the spectral structure and can substantially enlarge the set of reachable quantum states. For every connected input graph with at least two vertices, we prove that independently parameterized local controls associated with either mixer generate the full unitary Lie algebra on the feasible subspace. Standard QAOA exhibits a more nuanced algebraic structure. We prove that the dynamical Lie algebra associated with MIS-QAOA employing the conventional mixer embeds into its Flip-or-Stay counterpart. Furthermore, we construct an infinite family of graphs for which the corresponding vacuum-state dynamical group orbits exhibit strictly distinct dimensions, establishing a qualitative expressivity separation between the two architectures. For either mixer, we show that standard QAOA initialized in the empty set can prepare a state supported entirely on maximum independent sets at finite depth. For the free architectures, we also derive an exact loss-variance formula in the unitary-design limit, expressed through the number of feasible independent sets and the variance of their cardinalities.", "url": "https://arxiv.org/abs/2609.18209", "type": "理论+数值", "summary": "保留可行性的混合器哈密顿量为约束量子优化的惩罚编码提供了一种有吸引力的替代方案，但强制约束如何改变量子近似优化算法（QAOA）可到达的状态空间仍然很大程度上未被探索。我们在最大独立集（MIS）问题的背景下解决这个问题。除了标准控制的位翻转混合器之外，我们还分析了替代的 $\\mathit{Flip\\text{-}or\\text{-}Stay}$ 混合器，其对可行子空间 $W_{\\mathcal{F}}$ 的限制精确对应于独立集重配置图的移位负拉普拉斯算子。尽管两个混频器在独立组之间引起相同的跃迁，但对角线修改改变了光谱结构，并且可以显着扩大可达到的量子态组。对于每个至少有两个顶点的连接输入图，我们证明与任一混合器相关的独立参数化局部控制在可行子空间上生成完整的酉李代数。标准 QAOA 表现出更细致的代数结构。\n\n我们证明了与采用传统混合器的 MIS-QAOA 相关的动态李代数嵌入到其翻转或保持对应物中。此外，我们构建了一个无限的图族，其中相应的真空态动力群轨道表现出严格不同的维度，从而在两种体系结构之间建立了定性的表达分离。对于任一混合器，我们表明在空集中初始化的标准 QAOA 可以准备完全在有限深度的最大独立集上支持的状态。对于自由架构，我们还在单一设计极限下导出了精确的损失方差公式，通过可行独立集的数量及其基数的方差来表示。", "authors": [{"name": "Boris Tsvelikhovskiy"}, {"name": "Bao Bach"}, {"name": "Ilya Safro"}], "featured_authors": [{"name": "Boris Tsvelikhovskiy"}, {"name": "Bao Bach"}, {"name": "Ilya Safro"}], "author_count": 3}, {"id": "2609.18222", "category": "quant-ph", "title": "Unbounded Holevo additivity gaps in finite dimensions", "abstract": "We establish unbounded two-use Holevo additivity gaps in finite dimensions. For each sufficiently large fixed integer $K$ and all sufficiently large $n$, we construct channels $T_n$ with output dimension $K^n$, input dimension $\\exp(\\Theta_K(n^2))$, and \\[ \\chi(T_n^{\\otimes2})-2\\chi(T_n) \\ge n\\left[\\frac{\\log_2K}{K}-2\\log_2(1+9/K)\\right]-O(1/n). \\] The gap is linear in output qubits, with an explicit quadratic input-qubit cost and an explicit threshold on $n$. We also obtain channels whose single-use Holevo quantity tends to zero while their two-use Holevo information, and hence classical capacity, diverges. The channels arise from structured tensor products of the complementary mixed-unitary channels used in Collins's free-probabilistic proof. We establish minimum-output-entropy gaps by combining Collins--Youn's product-group Haagerup inequality with Bordenave--Collins's quantitative strong-convergence estimates", "url": "https://arxiv.org/abs/2609.18222", "type": "理论", "summary": "我们在有限维度上建立了无限的两用 Holevo 可加性间隙。对于每个足够大的固定整数 $K$ 和所有足够大的 $n$，我们构造通道 $T_n$，其输出维度 $K^n$、输入维度 $\\exp(\\Theta_K(n^2))$ 和 \\[ \\chi(T_n^{\\otimes2})-2\\chi(T_n) \\ge n\\left[\\frac{\\log_2K}{K}-2\\log_2(1+9/K)\\right]-O(1/n)。 \\] 输出量子位中的差距是线性的，具有显式的二次输入量子位成本和 $n$ 上的显式阈值。我们还获得了单次使用 Holevo 数量趋于零的通道，而其两次使用 Holevo 信息以及经典容量则发散。这些通道源自柯林斯自由概率证明中使用的互补混合酉通道的结构化张量积。我们通过将 Collins-Youn 的乘积群 Haagerup 不等式与 Bordenave--Collins 的定量强收敛估计相结合来建立最小输出熵差距", "authors": [{"name": "Jinzhao Wang"}], "featured_authors": [{"name": "Jinzhao Wang"}], "author_count": 1}, {"id": "2609.18244", "category": "quant-ph", "title": "Spectral-Gap Bounds and Timescales for Purity Loss in Hamiltonian--Pointer Interactions", "abstract": "We investigate the purity dynamics of a quantum system coupled to a continuous-variable pointer through a von Neumann-type interaction Hamiltonian of the form $\\hat H_{\\mathrm{int}}=g\\,\\hat H\\otimes\\hat p$. For an initially Gaussian pointer state, the interaction generates energy-dependent conditional translations whose mutual overlaps are determined explicitly by the populated spectral separations of the system Hamiltonian. After tracing out the pointer degrees of freedom, we obtain the reduced density operator and derive an exact analytical expression for the time-dependent purity. Using this expression, we establish two-sided purity bounds governed by the minimum and maximum nonzero energy gaps on the populated spectral support. These bounds provide a state-dependent spectral characterization of the loss of purity and become exact for two-level systems. We further show that the short-time decrease of purity is controlled by the Hamiltonian variance of the initial state, with $\\mathcal P''(0)=-(g^2/\\sigma^2) \\operatorname{Var}_{\\psi_S}(\\hat H)$. In addition, an explicit sufficient timescale is derived for the purity to approach its asymptotic value within a prescribed tolerance, revealing the scaling $t_{\\varepsilon}\\propto\\sigma/(|g|\\Delta_{\\min})$. Finally, the general results are illustrated for an equally weighted $N$-level system with an equally spaced spectrum, for which the asymptotic purity is $1/N$. The analysis clarifies the distinct roles of spectral separation, energy variance, coupling strength, and pointer width in Hamiltonian-conditioned purity loss.", "url": "https://arxiv.org/abs/2609.18244", "type": "理论+数值", "summary": "我们通过 $\\hat H_{\\mathrm{int}}=g\\,\\hat H\\otimes\\hat p$ 形式的冯诺依曼型相互作用哈密顿量研究耦合到连续变量指针的量子系统的纯度动力学。对于初始高斯指针状态，相互作用生成能量相关的条件平移，其相互重叠由系统哈密顿量的填充谱分离明确确定。在追踪出指针自由度后，我们获得了约化密度算子，并导出了与时间相关的纯度的精确解析表达式。使用这个表达式，我们建立了由填充光谱支持上的最小和最大非零能隙控制的两侧纯度界限。这些界限提供了纯度损失的状态相关光谱特征，并且对于两能级系统来说变得精确。我们进一步表明，纯度的短时下降是由初始状态的哈密顿方差控制的，$\\mathcal P''(0)=-(g^2/\\sigma^2) \\operatorname{Var}_{\\psi_S}(\\hat H)$。\n\n此外，还导出了一个明确的足够时间尺度，使纯度在规定的容差内接近其渐近值，从而揭示了缩放 $t_{\\varepsilon}\\propto\\sigma/(|g|\\Delta_{\\min})$。最后，说明了具有等间距谱的等权 $N$ 级系统的一般结果，其渐近纯度为 $1/N$。该分析阐明了光谱分离、能量方差、耦合强度和指针宽度在哈密顿条件纯度损失中的不同作用。", "authors": [{"name": "Orhan Amirov"}, {"name": "Necati Çelik"}], "featured_authors": [{"name": "Orhan Amirov"}, {"name": "Necati Çelik"}], "author_count": 2}, {"id": "2609.18246", "category": "quant-ph", "title": "New directions in dynamical expectation estimation", "abstract": "Computing dynamical expectation values typically relies on approximations optimized for the state or observable separately, without accounting for how their errors combine in the final this http URL work explores an alternative approach in which each approximation is guided by both the state and the observable, accounting for how they jointly determine the target expectation value. This idea is implemented through a sweep algorithm with coupled loss functions for forward state and backward observable updates. Exact error relations provide an analytical rationale for how the proposed losses can improve the accuracy. Numerical tests on 30-qubit random circuits show errors two to three orders of magnitude smaller than those of variational state compression at equal bond dimensions. These results motivate further exploration of joint state and observable approximation for dynamical expectation value estimation.", "url": "https://arxiv.org/abs/2609.18246", "type": "数值", "summary": "计算动态期望值通常依赖于分别针对状态或可观测值进行优化的近似值，而不考虑它们的错误如何在最终中组合。此 http URL 工作探索了一种替代方法，其中每个近似值均由状态和可观测值引导，并考虑它们如何共同确定目标期望值。这个想法是通过扫描算法实现的，该算法具有用于前向状态和后向可观察更新的耦合损失函数。精确的误差关系为所提出的损失如何提高准确性提供了分析依据。对 30 量子位随机电路的数值测试表明，在相同键维数下，误差比变分态压缩小两到三个数量级。这些结果激发了对动态期望值估计的联合状态和可观测近似的进一步探索。", "authors": [{"name": "Panjin Kim"}, {"name": "Kyung Chul Jeong"}, {"name": "Yun-Tak Oh"}], "featured_authors": [{"name": "Panjin Kim"}, {"name": "Kyung Chul Jeong"}, {"name": "Yun-Tak Oh"}], "author_count": 3}, {"id": "2609.18250", "category": "quant-ph", "title": "Quantum Probability Current Guided Reduction of Coupling Control Degrees of Freedom for Excitation Transport", "abstract": "Time-dependent coherent control can enhance excitation transport in open quantum networks, but independently controlling every inter-site coupling creates a control space of high dimension and leads to difficult optimization problems. We introduce an edge-ranking strategy based on the control-induced change in the gradient component of the time-integrated quantum probability current, which is obtained via a graph Hodge decomposition. When our strategy is applied to the seven-site Fenna-Matthews-Olson (FMO) model, the six-edge set retains $99.83\\%$ of the enhancement achieved by full control, and the four-edge set retains $97.60\\%$ while reducing the pulse fluence---used here as a proxy for control effort---by $41.55\\%$ relative to full control. Dephasing scans and comparisons with random edge sets and random networks provide numerical support for the relevance and potential broader utility of the ranking. These results show that edge selection guided by the quantum probability current can substantially reduce the control space while preserving high transport performance with lower control effort.", "url": "https://arxiv.org/abs/2609.18250", "type": "理论+数值", "summary": "时间相关相干控制可以增强开放量子网络中的激发传输，但独立控制每个位点间耦合会创建高维控制空间并导致困难的优化问题。我们引入了一种边缘排序策略，该策略基于控制引起的时间积分量子概率电流梯度分量的变化，该变化是通过图霍奇分解获得的。当我们的策略应用于七站点 Fenna-Matthews-Olson (FMO) 模型时，六边缘集保留了完全控制所实现的 99.83\\%$ 的增强，四边缘集保留了 97.60\\%$ 的增强，同时相对于完全控制减少了脉冲通量（此处用作控制效果的代理）41.55\\%$。相移扫描以及与随机边缘集和随机网络的比较为排名的相关性和潜在更广泛的效用提供了数值支持。这些结果表明，由量子概率流引导的边缘选择可以大大减少控制空间，同时以较低的控制工作量保持高传输性能。", "authors": [{"name": "Liuheng Cao"}, {"name": "Lin Zhang"}, {"name": "Junde Wu"}], "featured_authors": [{"name": "Liuheng Cao"}, {"name": "Lin Zhang"}, {"name": "Junde Wu"}], "author_count": 3}, {"id": "2609.18350", "category": "quant-ph", "title": "Signatures of Chaos in a Quasiperiodically Driven Quantum Impact Oscillator", "abstract": "We demonstrate the emergence of quantum-chaotic dynamics in a quasiperiodically driven impact oscillator near the grazing condition. While previous studies of the quantum impact oscillator under periodic driving reported strange nonchaotic dynamics, we show that quasiperiodic driving produces robust signatures of chaos. The corresponding classical system undergoes a sharp grazing-induced transition from quasiperiodic motion to chaos, as established by bifurcation analysis, Lyapunov exponents, Fourier spectra, and the 0-1 test. In the quantum system, Shannon-entropy time series exhibit broadband spectra, 0-1 test values close to unity, and predominantly positive finite-time Lyapunov exponents for both rational and irrational driving-frequency ratios. Independent quantum diagnostics reinforce this result: the out-of-time-order correlator (OTOC) displays early-time exponential growth with nearly identical rates, while the golden-ratio drive leads to a substantially faster saturation of the OTOC. Fidelity exhibits an exponential decay regime that is approximately independent of perturbation strength. These results establish quasiperiodic driving near grazing as a mechanism for generating quantum-chaotic behavior and reveal that, although the initial onset of scrambling is largely insensitive to frequency-ratio rationality, the subsequent development of global scrambling is strongly influenced by the degree of irrationality of the drive.", "url": "https://arxiv.org/abs/2609.18350", "type": "理论", "summary": "我们证明了在掠射条件附近准周期驱动的冲击振荡器中量子混沌动力学的出现。虽然之前对周期性驱动下的量子冲击振荡器的研究报告了奇怪的非混沌动力学，但我们表明准周期性驱动会产生强大的混沌特征。通过分岔分析、李亚普诺夫指数、傅里叶谱和 0-1 检验确定，相应的经典系统经历了从准周期运动到混沌的急剧掠过引起的转变。在量子系统中，香农熵时间序列表现出宽带谱、接近统一的 0-1 测试值以及有理和无理驱动频率比的主要正有限时间 Lyapunov 指数。独立的量子诊断强化了这一结果：乱序相关器 (OTOC) 以几乎相同的速率显示早期指数增长，而黄金比例驱动则导致 OTOC 的饱和速度大大加快。保真度表现出近似独立于扰动强度的指数衰减机制。\n\n这些结果将准周期驱动接近放牧作为产生量子混沌行为的机制，并表明，尽管扰乱的最初开始对频率比理性很大程度上不敏感，但全局扰乱的后续发展受到驱动的非理性程度的强烈影响。", "authors": [{"name": "Deepshikha Singh"}, {"name": "Titir Mukherjee"}, {"name": "Soumitro Banerjee"}], "featured_authors": [{"name": "Deepshikha Singh"}, {"name": "Titir Mukherjee"}, {"name": "Soumitro Banerjee"}], "author_count": 3}, {"id": "2609.18412", "category": "quant-ph", "title": "Measuring correlations in quantum and statistical systems", "abstract": "The survey discusses the problem of measuring correlations in composite quantum and statistical systems. After briefly recalling the standard methods of describing correlations, the emphasis is on the method of correlation indices. The latter method for quantifying the strength of correlations in composite physical systems is sufficiently general allowing for measuring in a unique way the correlation strength in both quantum and statistical systems, for static as well as for dynamic processes. The correlation indices, can be defined for correlation operators, reduced density matrices, and other operators containing information on correlations in the studied composite systems. The correlation indices measure all types of correlations, quantum correlations, such as entanglement, as well as classical correlations. They are applicable for characterizing static as well as dynamical processes. Examples are given of correlation indices for several quantum states and for spin and pseudospin systems. The quantification of correlations in a nonequilibrium system is exemplified by calculating the correlation index for a trapped Bose-Einstein condensate subject to the action of an alternating field.", "url": "https://arxiv.org/abs/2609.18412", "type": "理论", "summary": "该调查讨论了测量复合量子和统计系统中相关性的问题。在简要回顾了描述相关性的标准方法之后，重点是相关性指数的方法。后一种量化复合物理系统中相关强度的方法足够通用，允许以独特的方式测量量子系统和统计系统中静态和动态过程的相关强度。可以为相关算子、简化密度矩阵和包含所研究的复合系统中的相关性信息的其他算子定义相关指数。相关性指数测量所有类型的相关性、量子相关性（例如纠缠）以及经典相关性。它们适用于表征静态和动态过程。给出了几种量子态以及自旋和赝自旋系统的相关指数的示例。\n\n通过计算受交变场作用的俘获玻色-爱因斯坦凝聚体的相关指数来举例说明非平衡系统中相关性的量化。", "authors": [{"name": "V.I. Yukalov"}, {"name": "E.P. Yukalova"}], "featured_authors": [{"name": "V.I. Yukalov"}, {"name": "E.P. Yukalova"}], "author_count": 2}, {"id": "2609.18463", "category": "quant-ph", "title": "Simplification Rules for Continuous-Time Quantum Walks on Dynamic Graphs", "abstract": "Continuous-time quantum walks (CTQWs) on dynamic graphs realize quantum gates as sequences of time-evolving graph Hamiltonians, but naive constructions produce long sequences with redundancy. Simplification rules, which are graph rewrite rules that shorten a dynamic graph sequence while preserving the unitary it implements, are the CTQW analogue of circuit identities in the gate model. In this work, we give CTQW realizations of the standard single-qubit gates and introduce new graph rewrite rules. We demonstrate the simplification rules through worked circuit reductions and outline their use as transpilation primitives for converting between the circuit model and the dynamic graph framework.", "url": "https://arxiv.org/abs/2609.18463", "type": "理论", "summary": "动态图上的连续时间量子行走（CTQW）将量子门实现为时间演化图哈密顿量的序列，但简单的构造会产生具有冗余的长序列。简化规则是图重写规则，可缩短动态图序列，同时保留其实现的单一性，是门模型中电路恒等式的 CTQW 模拟。在这项工作中，我们给出了标准单量子位门的 CTQW 实现，并引入了新的图重写规则。我们通过工作电路简化来演示简化规则，并概述它们作为在电路模型和动态图框架之间转换的转译原语的用途。", "authors": [{"name": "Mostafa Atallah"}, {"name": "Daniel Dilley"}, {"name": "Jishnu Mahmud"}, {"name": "Zain H Saleem"}, {"name": "Rebekah Herrman"}], "featured_authors": [{"name": "Mostafa Atallah"}, {"name": "Daniel Dilley"}, {"name": "Jishnu Mahmud"}, {"name": "Zain H Saleem"}, {"name": "Rebekah Herrman"}], "author_count": 5}, {"id": "2609.18464", "category": "quant-ph", "title": "Lindbladian quantum chaos beyond classical strange attractors", "abstract": "We investigate the connection between classical and quantum chaos in a dissipative system of two coupled collective spins. Although the classical dynamics possesses a stable fixed-point attractor, we find pronounced signatures of chaos in the transient dynamics preceding relaxation. In the quantum model, such transient chaos is accompanied by a transition to random-matrix statistics in the relevant part of the Liouvillian spectrum and by a qualitative increase in the number of Liouvillian modes contributing to expectation values of physical observables. The transition occurs before the bifurcation at which the stable fixed point disappears and a chaotic attractor emerges. Our results show that Liouvillian quantum chaos can be associated with transient classical chaos, rather than requiring a chaotic asymptotic attractor, and provide a refinement of the Grobe-Haake-Sommers conjecture.", "url": "https://arxiv.org/abs/2609.18464", "type": "理论", "summary": "我们研究了两个耦合集体自旋的耗散系统中经典混沌和量子混沌之间的联系。尽管经典动力学具有稳定的定点吸引子，但我们在弛豫之前的瞬态动力学中发现了明显的混沌特征。在量子模型中，这种瞬态混沌伴随着刘维尔谱相关部分向随机矩阵统计的转变，以及有助于物理可观测值期望值的刘维尔模式数量的质的增加。转变发生在分叉之前，此时稳定不动点消失并且出现混沌吸引子。我们的结果表明，刘维尔量子混沌可以与瞬态经典混沌相关联，而不需要混沌渐近吸引子，并提供了格罗布-哈克-索默斯猜想的改进。", "authors": [{"name": "Ángel L. Corps"}, {"name": "Armando Relaño"}], "featured_authors": [{"name": "Ángel L. Corps"}, {"name": "Armando Relaño"}], "author_count": 2}, {"id": "2609.18559", "category": "quant-ph", "title": "Extensibly Causally Separable Processes Admit Realizations as Quantum Circuits with Classical Control of Causal Order", "abstract": "Indefinite caus
