stimate between inverse square roots of its input marginal, has a closed form but is used as a heuristic, its only analyses being asymptotic and losing a factor polynomial in the dimension. Projection-based methods are principled but have no closed forms and scale poorly with dimension. We resolve this dichotomy by showing that the partial normalization is the exact projection onto the Choi states of quantum channels in fidelity (equivalently in Bures or purified distance). Consequently, any QST algorithm with guarantees in fidelity lifts to a QPT algorithm that inherits its sample complexity, through a single closed-form congruence that preserves the Choi rank and is computed in Kraus form without any eigendecomposition of Choi dimension. We lift two single-copy protocols and prove that the non-adaptive one (Fidelity Projected Least Squares) recovers the Choi rank and reaches infidelity $\\varepsilon$ from a number of channel uses proportional to $1/\\varepsilon$. Numerically, for channels of low Choi rank, it improves on the state-of-the-art projected least squares in accuracy, and by orders of magnitude in the time and memory of the TP-regularization step and of the returned estimate.", "url": "https://arxiv.org/abs/2609.39941", "type": "数值", "summary": "量子过程层析成像 (QPT) 协议通常是通过 Choi-Jamiolkowski 同构提升量子态层析成像 (QST) 协议来设计的，但代价是需要执行额外步骤来强制保留迹线 (TP) 约束。现有的方法分为两类。民间传说部分归一化将密度估计夹在其输入边际的倒平方根之间，具有封闭形式，但用作启发式，其唯一的分析是渐近的并且在维度中丢失因子多项式。基于投影的方法是有原则的，但没有封闭的形式，并且维度扩展性很差。我们通过证明部分归一化是保真度（相当于 Bures 或纯化距离）到量子通道 Choi 态的精确投影来解决这种二分法。因此，任何保真度保证的 QST 算法都会提升为继承其样本复杂性的 QPT 算法，通过保留 Choi 秩的单个封闭形式同余，并以 Kraus 形式计算，而不对 Choi 维度进行任何特征分解。\n\n我们提出了两个单副本协议，并证明非自适应协议（保真度投影最小二乘法）可以恢复 Choi 等级，并从与 $1/\\varepsilon$ 成比例的多个通道使用中达到不忠 $\\varepsilon$。从数值上看，对于低 Choi 秩的通道，它在精度方面比最先进的投影最小二乘法有所提高，并且在 TP 正则化步骤和返回的估计的时间和内存方面提高了几个数量级。", "authors": [{"name": "A. Afham"}, {"name": "Sayantan Sen"}, {"name": "Marco Tomamichel"}], "featured_authors": [{"name": "A. Afham"}, {"name": "Sayantan Sen"}, {"name": "Marco Tomamichel"}], "author_count": 3}, {"id": "2609.39959", "category": "quant-ph", "title": "Haah's 3D cubic code thermalizes rapidly", "abstract": "Haah's 3D cubic code was introduced as a candidate for a self-correcting quantum memory in three dimensions, using the absence of string logical operators to obstruct thermal errors. It has been a long-standing open question whether it is a self-correcting quantum memory. Even though the memory time was explored numerically, no analytical upper bound was known. Here, we settle this question rigorously and show that the cubic code thermalizes rapidly at every positive temperature. Our proof relies on the framework of [Commun. Math. Phys. 407, 195 (2026)] to turn a decay-of-correlations condition into a modified logarithmic Sobolev inequality for the Davies generator. To the best of our knowledge, this is the first analytic proof of rapid mixing for all positive temperatures for any fracton code.", "url": "https://arxiv.org/abs/2609.39959", "type": "理论+数值", "summary": "Haah 的 3D 立方码被引入作为三维自校正量子存储器的候选者，利用缺乏字符串逻辑运算符来阻止热错误。它是否是一种自我校正的量子存储器一直是一个悬而未决的问题。尽管对记忆时间进行了数值探索，但分析上限尚不清楚。在这里，我们严格地解决了这个问题，并证明立方码在每个正温度下都会快速热化。我们的证明依赖于[Commun.数学。物理。 407, 195 (2026)] 将相关性衰减条件转换为戴维斯发生器的修正对数 Sobolev 不等式。据我们所知，这是任何分形代码在所有正温度下快速混合的第一个分析证明。", "authors": [{"name": "Sebastian Stengele"}, {"name": "Libor Caha"}, {"name": "Ángela Capel"}, {"name": "Simone Warzel"}], "featured_authors": [{"name": "Sebastian Stengele"}, {"name": "Libor Caha"}, {"name": "Ángela Capel"}, {"name": "Simone Warzel"}], "author_count": 4}, {"id": "2609.39974", "category": "quant-ph", "title": "The quantum query complexity of the semigroup product problem", "abstract": "We study the quantum query complexity of computing a semigroup product $x_1\\cdots x_n$, when one query reveals one input element and the multiplication table is given. For a finite aperiodic semigroup of size $N-1$, the argument of Aaronson, Grier, and Schaeffer gives an upper bound of $\\sqrt n\\,(N\\log(nN+2))^{O(N)}$ queries. To obtain query bounds that reflect algebraic structure, we study the product breadth $\\beta$: the smallest bound such that every input word has a subsequence of at most $\\beta$ letters with the same product. For nontrivial finite commutative aperiodic monoids, the bounded-error quantum query complexity is $\\Theta(\\min\\{n,\\sqrt{n\\beta}\\})$, and is thus characterized by product breadth. We further show that if such a monoid $M$ has aperiodicity index $k$ (the least positive integer satisfying $x^k=x^{k+1}$ for every $x\\in M$), then $\\beta=O(k\\log(|M|+1)\\log\\log(|M|+2))$. For monoids with a stable partial order in which the identity is the minimum element, we prove that the bounded-error quantum query complexity is at most $\\sqrt{n+1}((\\beta+2)\\log(n+2))^{O(\\log(\\beta+2))}$. For arbitrary finite aperiodic semigroups of order $N-1$, we improve the bound of Aaronson, Grier, and Schaeffer, obtaining a bounded-error quantum query complexity of at most \\[ \\min\\left\\{n,\\sqrt n\\, \\log^{O((N\\log(N+2))^{1/3})}(n+2)\\right\\}. \\] The dependence on semigroup size is nearly tight: the bounded-depth Dyck lower bound of Ambainis et al. yields aperiodic monoids requiring $\\sqrt n\\,2^{\\Omega(N^{1/3})}$ quantum queries in the relevant parameter range.", "url": "https://arxiv.org/abs/2609.39974", "type": "理论", "summary": "我们研究当一个查询揭示一个输入元素并且给出乘法表时，计算半群积 $x_1\\cdots x_n$ 的量子查询复杂性。对于大小为 $N-1$ 的有限非周期半群，Aaronson、Grier 和 Schaeffer 的参数给出了 $\\sqrt n\\,(N\\log(nN+2))^{O(N)}$ 个查询的上限。为了获得反映代数结构的查询边界，我们研究乘积广度 $\\beta$：最小边界，使得每个输入单词最多具有具有相同乘积的 $\\beta$ 字母的子序列。对于非平凡的有限交换非周期幺半群，有界误差量子查询复杂度为 $\\Theta(\\min\\{n,\\sqrt{n\\beta}\\})$，因此由乘积广度来表征。我们进一步证明，如果这样的幺半群 $M$ 具有非周期性索引 $k$（对于每个 $x\\in M$ 满足 $x^k=x^{k+1}$ 的最小正整数），则 $\\beta=O(k\\log(|M|+1)\\log\\log(|M|+2))$。对于具有稳定偏序且单位元为最小元素的幺半群，我们证明有界误差量子查询复杂度至多为 $\\sqrt{n+1}((\\beta+2)\\log(n+2))^{O(\\log(\\beta+2))}$。\n\n对于 $N-1$ 阶的任意有限非周期半群，我们改进了 Aaronson、Grier 和 Schaeffer 的界，获得至多 \\[ \\min\\left\\{n,\\sqrt n\\, \\log^{O((N\\log(N+2))^{1/3})}(n+2)\\right\\} 的有界误差量子查询复杂度。 \\] 对半群大小的依赖几乎是紧密的：Ambainis 等人的有界深度 Dyck 下界。产生非周期幺半群，需要在相关参数范围内进行 $\\sqrt n\\,2^{\\Omega(N^{1/3})}$ 量子查询。", "authors": [{"name": "Troy Lee"}, {"name": "Miklos Santha"}], "featured_authors": [{"name": "Troy Lee"}, {"name": "Miklos Santha"}], "author_count": 2}, {"id": "2609.39992", "category": "quant-ph", "title": "Predicting properties of Scrooge ensembles with high accuracy and low sample complexity", "abstract": "The Scrooge ensemble associated with a density matrix $\\rho$ is the maximally random ensemble whose average density matrix is $\\rho$. It has attracted growing interest for its applications to quantum many-body dynamics and quantum information. The intrinsic statistical properties of the Scrooge ensembles are encoded in their higher-order moments, yet they are nontrivial to analyze and prepare for they feature a non-polynomial Haar integrand, blocking direct use of Haar integration machinery. Existing physical mechanisms to sample multiple copies of states from the Scrooge ensembles, meanwhile, typically require costly postselection, rendering them inefficient for large system size. In this work, we develop efficient and accurate methods for analyzing and implementing Scrooge moments. We first introduce a polynomial approximation to the Scrooge $k$-th moments whose error is tunable down to a threshold that improves from inverse polynomial to exponential in $1/||\\rho||_\\infty$ over previous results. Building on our approximation, we then give the first efficient quantum algorithm that estimates observable expectation values using $\\widetilde{\\mathcal{O}}(k^3/\\epsilon^5)$ copies of $\\rho$ for any target error $\\epsilon$ above this threshold. We further provide a construction of a block encoding of the Scrooge $k$-th moment when the preparation circuit of $\\rho$ is known. Of independent interest could be a key subroutine in our algorithms, which efficiently implements projection onto the $k$-fold symmetric subspace for $\\rho^{\\otimes k}$ using $\\mathcal{O}(k^3/\\epsilon^2)$ samples of $\\rho$, avoiding the naive $k!$ postselection cost of such a projection. These results provide new tools for both the theoretical analysis and practical prediction of properties of Scrooge ensembles, with potential applications to quantum many-body dynamics and quantum information processing.", "url": "https://arxiv.org/abs/2609.39992", "type": "数值", "summary": "与密度矩阵 $\\rho$ 关联的 Scrooge 系综是平均密度矩阵为 $\\rho$ 的最大随机系综。它因其在量子多体动力学和量子信息方面的应用而引起了越来越多的兴趣。 Scrooge 系综的内在统计特性被编码在它们的高阶矩中，但分析和准备它们并不简单，因为它们具有非多项式 Haar 被积函数，阻碍了 Haar 积分机制的直接使用。与此同时，从 Scrooge 集合中对状态的多个副本进行采样的现有物理机制通常需要昂贵的后选择，这使得它们对于大型系统规模而言效率低下。在这项工作中，我们开发了有效且准确的方法来分析和实现 Scrooge 时刻。我们首先引入了对 Scrooge $k$ 个时刻的多项式近似，其误差可调整到一个阈值，与之前的结果相比，该阈值从逆多项式改善到指数 $1/||\\rho||_\\infty$ 。\n\n基于我们的近似，我们给出了第一个有效的量子算法，该算法使用 $\\widetilde{\\mathcal{O}}(k^3/\\epsilon^5)$ 的 $\\rho$ 副本来估计可观察的期望值，对于高于此阈值的任何目标误差 $\\epsilon$。当$\\rho$的准备电路已知时，我们进一步提供了Scrooge第$k$时刻的块编码的构造。独立感兴趣的可能是我们算法中的一个关键子例程，它使用 $\\rho$ 的 $\\mathcal{O}(k^3/\\epsilon^2)$ 样本有效地实现到 $\\rho^{\\otimes k}$ 的 $k$ 重对称子空间的投影，避免了此类投影的幼稚 $k!$ 后选择成本。这些结果为斯克鲁奇系综特性的理论分析和实际预测提供了新工具，并在量子多体动力学和量子信息处理方面具有潜在的应用。", "authors": [{"name": "Yue Wu"}, {"name": "Yuzhi Tong"}, {"name": "Helen Propson"}, {"name": "Yihui Quek"}, {"name": "Liang Mao"}], "featured_authors": [{"name": "Yue Wu"}, {"name": "Yuzhi Tong"}, {"name": "Helen Propson"}, {"name": "Yihui Quek"}, {"name": "Liang Mao"}], "author_count": 5}, {"id": "2609.40001", "category": "quant-ph", "title": "An exponential query advantage from access to Stinespring dilation unitaries in quantum channel learning", "abstract": "We present a learning task for quantum channels that exhibits an exponential separation in query complexity (in terms of the number of qubits) between two access models: i) black-box channel access and ii) access to a Stinespring dilation unitary of the channel along with its inverse. We consider the task of learning how close the unknown channel is to the set of unitary channels. This is characterized by the \\textit{optimal average gate fidelity (OAGF)}, defined as the average gate fidelity maximized over all unitary channels. For constant Kraus rank and a dilation environment of dimension $\\operatorname{polylog}(d)$, we provide an algorithm that estimates the OAGF to fixed additive accuracy using $\\operatorname{polylog}(d)$ queries to the Stinespring dilation unitary and its inverse. In contradistinction, under the black-box access model, this estimation requires at least $\\Omega(\\sqrt{d})$ queries, even for channels of constant Kraus rank and constant additive accuracy. As a corollary, we rule out a universal simulator that uses only $\\operatorname{poly}(\\log d,q)$ queries to the unknown channel to approximate the output of arbitrary $q$-query algorithms with access to a randomly-sampled Stinespring dilation unitary and its inverse, even to sufficiently small constant error. These results demonstrate that access to the system-environment joint evolution and its inverse can provide an exponential advantage in estimating an intrinsic property of a quantum channel.", "url": "https://arxiv.org/abs/2609.40001", "type": "理论+数值", "summary": "我们提出了一个量子通道的学习任务，该任务在两个访问模型之间的查询复杂性（就量子位数量而言）呈现指数分离：i）黑盒通道访问和 ii）对通道的 Stinespring 膨胀酉及其逆的访问。我们考虑学习未知通道与单一通道集的接近程度的任务。这由\\textit{最佳平均门保真度（OAGF）}来表征，定义为在所有单一通道上最大化的平均门保真度。对于恒定的 Kraus 秩和维度 $\\operatorname{polylog}(d)$ 的膨胀环境，我们提供了一种算法，该算法使用对 Stinespring 膨胀酉及其逆的 $\\operatorname{polylog}(d)$ 查询来估计 OAGF 以固定加性精度。相比之下，在黑盒访问模型下，这种估计至少需要 $\\Omega(\\sqrt{d})$ 查询，即使对于恒定 Kraus 秩和恒定附加精度的通道也是如此。\n\n作为推论，我们排除了一个通用模拟器，该模拟器仅使用 $\\operatorname{poly}(\\log d,q)$ 查询未知通道来近似任意 $q$ 查询算法的输出，并访问随机采样的 Stinespring 膨胀酉及其逆，甚至达到足够小的常数误差。这些结果表明，访问系统-环境联合演化及其逆可以在估计量子通道的固有属性方面提供指数优势。", "authors": [{"name": "Manaki Arihara"}, {"name": "Satoshi Yoshida"}, {"name": "Philip Taranto"}, {"name": "Mio Murao"}], "featured_authors": [{"name": "Manaki Arihara"}, {"name": "Satoshi Yoshida"}, {"name": "Philip Taranto"}, {"name": "Mio Murao"}], "author_count": 4}, {"id": "2609.40022", "category": "quant-ph", "title": "CSS codes for Quantum Metrology with Discrete-time Error Correction", "abstract": "The goal of quantum metrology is to estimate an unknown parameter with better-than-classical precision and, ideally, to attain Heisenberg scaling. In realistic settings, however, noise can substantially reduce this advantage and, in many cases, restore standard-quantum-limit-like performance. Preserving the quantum enhancement therefore requires noise-robust strategies, which can be implemented using quantum error correction. In this work, we develop and analyze a quantum-metrology protocol based on Calderbank-Shor-Steane (CSS) codes. The main result is that, for noise perpendicular to the sensing Hamiltonian, discrete-time error correction preserves Heisenberg-like temporal scaling over a finite interrogation-time window whose duration depends on the correction frequency. It is further shown that recovery applied only after the sensing evolution provides no metrological advantage over the corresponding uncorrected noisy protocol in the setup considered here. An analytical framework is developed for arbitrary CSS codes and applied to the Steane and Shor codes, for which the discrete-time corrected dynamics, the Heisenberg-like-to-SQL-like crossover, and the optimal interrogation time are determined and numerically analysed.", "url": "https://arxiv.org/abs/2609.40022", "type": "理论+数值", "summary": "量子计量学的目标是以优于经典精度的方式估计未知参数，并在理想情况下实现海森堡缩放。然而，在实际设置中，噪声会大大降低这种优势，并且在许多情况下，会恢复类似标准量子极限的性能。因此，保持量子增强需要抗噪声策略，这可以使用量子纠错来实现。在这项工作中，我们开发并分析了基于 Calderbank-Shor-Steane (CSS) 代码的量子计量协议。主要结果是，对于垂直于传感哈密顿量的噪声，离散时间误差校正在有限询问时间窗口上保留了类似海森堡的时间缩放，其持续时间取决于校正频率。进一步表明，仅在传感演进之后应用的恢复与此处考虑的设置中相应的未校正噪声协议相比没有提供计量优势。\n\n为任意 CSS 代码开发了一个分析框架，并将其应用于 Steane 和 Shor 代码，确定并数值分析了离散时间校正动态、类 Heisenberg 到 SQL 的交叉以及最佳询问时间。", "authors": [{"name": "Ugnė Liaubaitė"}, {"name": "Debora Ramacciotti"}, {"name": "Robert Raußendorf"}], "featured_authors": [{"name": "Ugnė Liaubaitė"}, {"name": "Debora Ramacciotti"}, {"name": "Robert Raußendorf"}], "author_count": 3}, {"id": "2609.40032", "category": "quant-ph", "title": "Pauli instability in arbitrary states: detecting magic in physical correlators", "abstract": "Measures of non-stabilizerness (``magic'') of a quantum evolution quantify how hard it is to simulate on a classical computer. A natural question is how to extract information about magic from physical correlators, for example at finite temperature or in the ground state. In this paper we show how to measure magic using out-of-time-order correlators evaluated in an arbitrary state. For every full-rank state, and in particular for every Gibbs state, the resulting quantity vanishes if and only if the evolution is Clifford. We establish its basic properties, relate it to the stabilizer entropy of the Choi state, and prove that, even with a single fixed probe operator, it gives a lower bound on the number of $T$ gates needed to implement the dynamics in any circuit architecture.", "url": "https://arxiv.org/abs/2609.40032", "type": "理论+数值", "summary": "量子演化的非稳定性（“魔法”）测量量化了在经典计算机上模拟的难度。一个自然的问题是如何从物理相关器中提取有关魔法的信息，例如在有限温度或基态下。在本文中，我们展示了如何使用在任意状态下评估的乱序相关器来测量魔法。对于每个满秩状态，特别是对于每个吉布斯状态，当且仅当进化是 Clifford 时，结果量才会消失。我们建立了它的基本属性，将其与 Choi 态的稳定器熵联系起来，并证明，即使使用单个固定探针算子，它也给出了在任何电路架构中实现动态所需的 $T$ 门数量的下限。", "authors": [{"name": "Tanner Jackson"}, {"name": "Alexey Milekhin"}], "featured_authors": [{"name": "Tanner Jackson"}, {"name": "Alexey Milekhin"}], "author_count": 2}, {"id": "2609.40036", "category": "quant-ph", "title": "Cycle Codes and Decoded Quantum Interferometry", "abstract": "Decoded Quantum Interferometry (DQI) reduces optimization problems with two-variable constraints to decoding cycle codes. For one such problem, namely MaxCut, prior work showed that DQI achieves a nontrivial satisfaction fraction guarantee only on linear-girth graphs, for which MaxCut is classically easy. However, these no-go results rely on minimum distance assumptions that do not represent true decodability thresholds for common noise channels, thus underestimating actual DQI performance. To estimate the true performance, we derive DQI satisfaction guarantees in the presence of imperfect decoding for fixed instances and generalize prior results for random instances. We then study homological cycle codes over arbitrary finite fields, and show that minimum-weight decoding is NP-hard for every field of size $q>2$, in contrast with known results for binary cycle codes. On the Linial--Simkin ensemble of regular graphs with logarithmic girth, we prove maximum-likelihood recovery bounds and a strong converse for a family of non-uniform additive noise channels. Moreover, LP decoders provide polynomial-time recovery of a positive fraction of randomly located errors with arbitrary values. These results allow us to prove upper and lower bounds on the approximate optima achievable by DQI when restricted to classical decoders. These bounds rule out quantum advantage in the regimes we analyze but also identify a family of regular Max-$k$-Cut instances on which DQI efficiently achieves a nontrivial satisfaction fraction guarantee.", "url": "https://arxiv.org/abs/2609.40036", "type": "理论+数值", "summary": "解码量子干涉测量 (DQI) 通过解码循环码的二变量约束减少了优化问题。对于这样一个问题，即 MaxCut，先前的工作表明，DQI 仅在线性周长图上实现了非平凡的满意分数保证，而对于线性周长图，MaxCut 非常容易实现。然而，这些不行的结果依赖于最小距离假设，这些假设并不代表公共噪声通道的真实可解码性阈值，因此低估了实际的 DQI 性能。为了估计真实性能，我们在固定实例存在不完美解码的情况下得出 DQI 满意度保证，并概括随机实例的先验结果。然后，我们研究任意有限域上的同调循环码，并表明最小权重解码对于每个大小 $q>2$ 的域都是 NP 困难的，这与二进制循环码的已知结果相反。在具有对数周长的正则图的 Linial-Simkin 系综上，我们证明了一系列非均匀加性噪声通道的最大似然恢复界限和强逆。此外，LP 解码器提供对任意值的随机定位错误的正分数的多项式时间恢复。\n\n这些结果使我们能够证明当限制于经典解码器时 DQI 可实现的近似最优值的上限和下限。这些界限排除了我们分析的机制中的量子优势，但也确定了一系列常规 Max-$k$-Cut 实例，在这些实例上，DQI 有效地实现了不平凡的满意度分数保证。", "authors": [{"name": "Anuj Apte"}, {"name": "Shouvanik Chakrabarti"}, {"name": "Andi Gu"}, {"name": "Stephen P. Jordan"}, {"name": "Ojas Parekh"}, {"name": "Ruslan Shaydulin"}, {"name": "Jacob Watkins"}, {"name": "Noureldin Yosri"}, {"name": "Adam Zalcman"}], "featured_authors": [{"name": "Anuj Apte"}, {"name": "Shouvanik Chakrabarti"}, {"name": "Andi Gu"}, {"name": "Jacob Watkins"}, {"name": "Noureldin Yosri"}, {"name": "Adam Zalcman"}], "author_count": 9}, {"id": "2609.40038", "category": "quant-ph", "title": "Finite-Bandwidth Protection of a Three-Level Quantum Heat Engine Against Parasitic Heat Leaks", "abstract": "Finite-bandwidth reservoir engineering can suppress unwanted transitions in a quantum thermal machine, but a physical filter also introduces a finite response time. We study this competition in a continuous three-level heat engine whose hot environment couples parasitically to the cold transition. The corresponding three-state rate network is solved exactly, showing that the parasitic transition produces a hot-to-cold thermodynamic short circuit and yielding a closed threshold for the loss of positive-power operation. We then retain a damped auxiliary mode explicitly as a physical spectral filter. Its Lorentzian response suppresses the detuned parasitic transition, whereas excessive narrowing limits the useful energy throughput. Independent local-GKSL and nonsecular Bloch--Redfield calculations both recover the no-leak Markovian engine in the weak-coupling limit and predict a finite maximum-power bandwidth, although its precise location is model dependent. A frequency-resolved Lorentzian-rate reduction, by contrast, has no interior optimum. The resulting design principle is that spectral selectivity can protect the useful thermodynamic cycle, but a real filter cannot be narrowed without a dynamical throughput cost.", "url": "https://arxiv.org/abs/2609.40038", "type": "理论+数值", "summary": "有限带宽储层工程可以抑制量子热机中不需要的转变，但物理滤波器也会引入有限的响应时间。我们在连续三级热机中研究这种竞争，其热环境与冷过渡寄生耦合。相应的三态速率网络得到了精确求解，表明寄生转变产生了热到冷的热力学短路，并产生了正功率运行损失的闭合阈值。然后，我们明确保留阻尼辅助模式作为物理光谱滤波器。其洛伦兹响应抑制失谐寄生跃迁，而过度窄化限制了有用的能量吞吐量。独立的局部 GKSL 和非世俗 Bloch-Redfield 计算都恢复了弱耦合极限下的无泄漏马尔可夫引擎，并预测了有限的最大功率带宽，尽管其精确位置取决于模型。相比之下，频率分辨洛伦兹速率降低没有内部最优。\n\n由此产生的设计原则是，光谱选择性可以保护有用的热力学循环，但如果不付出动态吞吐量成本，就无法缩小实际滤波器的范围。", "authors": [{"name": "Gilberto Aparecido Prataviera"}, {"name": "Marcos César de Oliveira"}], "featured_authors": [{"name": "Gilberto Aparecido Prataviera"}, {"name": "Marcos César de Oliveira"}], "author_count": 2}, {"id": "2609.40054", "category": "quant-ph", "title": "Transmitting algebras through quantum channels", "abstract": "We develop a theory of exact transmission of finite-dimensional $C^*$-algebras through quantum channels. These algebras describe hybrid classical-quantum information, allowing the dimension of the quantum system to depend on the classical message. Allowing arbitrary encodings and decodings yields a transmission set of algebra types, ordered by embedding, that unifies zero-error information theory with operator-algebraic error correction. We ask if this set admits a dominating algebra into which every transmittable algebra embeds. Our central finding is that domination can fail even in small dimensions. In its absence, several incomparable maximal algebras can describe different optimal uses of the same channel, forcing the user to select one depending on the operational task and the type of information to be preserved. We introduce hybrid capacities that reconstruct the only possible dominating algebra type and present a complete finite characterization of domination using minimal forbidden algebra types. We identify dominating algebras for channels whose operator systems are graph-isomorphic to $*$-algebras, including highly divisible channels, and for channels with zero one-shot zero-error quantum capacity. Under tensor products, we prove that joint coding can produce new algebra types, giving an algebraic analogue of superadditivity from Shannon theory. Domination can fail for the joint use of two channels, even when both channels separately admit dominating algebras. Finally, we construct a channel whose $n$-fold tensor powers have doubly exponentially many maximal algebra types, attaining the largest possible growth scaling for finite-dimensional channels. Consequently, new transmittable algebra types appear at arbitrarily large block-lengths for this channel, so its full transmission structure cannot be generated from any finite collection of bounded-block-length codes.", "url": "https://arxiv.org/abs/2609.40054", "type": "理论", "summary": "我们开发了一种通过量子通道精确传输有限维$C^*$-代数的理论。这些代数描述了混合经典量子信息，允许量子系统的维度取决于经典信息。允许任意编码和解码会产生一组代数类型，通过嵌入排序，它将零错误信息理论与算子代数纠错统一起来。我们问这个集合是否承认一个支配代数，每个可传递代数都嵌入其中。我们的主要发现是，即使在很小的维度上，统治也可能失败。如果没有它，几个无与伦比的最大代数可以描述同一通道的不同最佳使用，迫使用户根据操作任务和要保留的信息类型来选择一个。我们引入了混合能力，可以重建唯一可能的主导代数类型，并使用最小禁止代数类型呈现主导的完整有限特征。\n\n我们确定了算子系统与 $*$-代数图同构的通道的主导代数，包括高度可分的通道，以及具有零单次零误差量子容量的通道。在张量积下，我们证明联合编码可以产生新的代数类型，给出香农理论中超可加性的代数模拟。即使两个通道分别承认支配代数，联合使用两个通道的支配也可能会失败。最后，我们构造一个通道，其 n 倍张量幂具有双倍指数的最大代数类型，从而实现有限维通道的最大可能增长缩放。因此，新的可传输代数类型出现在该信道的任意大的块长度处，因此其完整的传输结构不能从任何有界块长度代码的有限集合生成。", "authors": [{"name": "Robert Salzmann"}, {"name": "Satvik Singh"}], "featured_authors": [{"name": "Robert Salzmann"}, {"name": "Satvik Singh"}], "author_count": 2}, {"id": "2609.40061", "category": "quant-ph", "title": "Equality in the Bosonic Quantum Entropy Power Inequality", "abstract": "The bosonic quantum entropy power inequality bounds the entropy of a beam-splitter output in terms of the input entropies. We determine its complete equality class among independent inputs of finite mean photon number: for any number of modes and any transmissivity strictly between zero and one, equality in either the linear or the exponential form holds if and only if the inputs are Gaussian with the same covariance matrix, allowing arbitrary displacements. The main step shows that equality for one output forces the two outputs to be independent: a thermal auxiliary converts equality into preservation of mutual information by a fixed noisy channel, and a two-outcome instrument shows that preservation of mutual information requires a product state with the reference. The quantum Darmois--Skitovich theorem then gives Gaussianity, while a central-limit argument reduces exponential equality to linear equality.", "url": "https://arxiv.org/abs/2609.40061", "type": "理论", "summary": "玻色子量子熵幂不等式根据输入熵限制了分束器输出的熵。我们在有限平均光子数的独立输入之间确定其完全等式类：对于任何数量的模式和严格介于零和一之间的任何透射率，线性或指数形式的等式成立当且仅当输入是具有相同协方差矩阵的高斯分布，允许任意位移。主要步骤表明，一个输出的相等性迫使两个输出相互独立：热辅助将相等性转换为通过固定噪声通道保存互信息，并且双结果仪器显示互信息的保存需要具有参考的产品状态。量子 Darmois-Skitovich 定理给出了高斯性，而中心极限参数将指数等式简化为线性等式。", "authors": [{"name": "Yonglong Li"}], "featured_authors": [{"name": "Yonglong Li"}], "author_count": 1}, {"id": "2609.40073", "category": "quant-ph", "title": "Transducer-based linear combination of unitaries: theory and applications", "abstract": "Linear combination of unitaries (LCU) is a fundamental primitive in quantum algorithms, whose cost is typically governed by the most expensive unitary appearing in the combination. We develop a transducer-based LCU framework that reduces this worst-case dependence to a weighted average query complexity, when the constituent unitaries share access to a common set of primitive oracles. Consider $A=\\sum_j c_j U_j$, where $c_j>0$ and each unitary $U_j$ can be implemented using $C_j$ primitive queries. Given an upper bound $a\\geq \\|A\\|$, our algorithm implements a block-encoding of $A/\\alpha$ with rescaling factor $\\alpha=\\mathcal{O}(a)$, using $\\widetilde{\\mathcal{O}} (C_{\\max}+\\overline{C} {\\lambda}/{a} )$ primitive queries, where $\\lambda=\\sum_j c_j$, $C_{\\max}=\\max_j C_j$, and $\\overline{C}= {\\sum_j c_j C_j}/{\\lambda}$. By comparison, the standard LCU construction requires $\\widetilde{\\mathcal{O}} (C_{\\max} {\\lambda}/{a} )$ primitive queries. The improvement can therefore be substantial when costly unitaries have small weights and $\\lambda/a$ is large. As applications, we obtain improved block-encodings of sparse matrices, leading to quantum algorithms for sparse Hamiltonian simulation and quantum linear systems with near-optimal query complexity up to polylogarithmic factors in all relevant parameters. Our main technique is the transducer framework developed by Belovs, Jeffery, and Yolcu [Quantum, 8:1444 (2024)]. Here we develop a complementary operator-level theory tailored to block-encodings. We identify the resolvent norm $K$ as a key complexity measure for transducer implementation besides the existing catalyst complexity. We show that the transducer action can be converted into an $\\epsilon$-approximate block-encoding using only $\\mathcal{O}\\left(K \\log(1/\\epsilon)\\right)$ queries to the transducer, improving the precision dependence from polynomial to logarithmic.", "url": "https://arxiv.org/abs/2609.40073", "type": "理论+数值", "summary": "酉线性组合 (LCU) 是量子算法中的基本原语，其成本通常由组合中出现的最昂贵的酉来控制。我们开发了一个基于转换器的 LCU 框架，当组成单元共享对一组公共原始预言机的访问时，该框架可以减少这种最坏情况对加权平均查询复杂性的依赖。考虑$A=\\sum_j c_j U_j$，其中$c_j>0$并且每个单一$U_j$可以使用$C_j$原语查询来实现。给定上限 $a\\geq \\|A\\|$，我们的算法使用 $\\widetilde{\\mathcal{O}} (C_{\\max}+\\overline{C} {\\lambda}/{a} )$ 原始查询，使用缩放因子 $\\alpha=\\mathcal{O}(a)$ 实现 $A/\\alpha$ 的块编码，其中 $\\lambda=\\sum_j c_j$， $C_{\\max}=\\max_j C_j$，$\\overline{C}= {\\sum_j c_j C_j}/{\\lambda}$。相比之下，标准 LCU 构造需要 $\\widetilde{\\mathcal{O}} (C_{\\max} {\\lambda}/{a} )$ 原始查询。因此，当昂贵的酉元权重较小且$\\lambda/a$较大时，改进可能会很大。\n\n作为应用，我们获得了稀疏矩阵的改进块编码，从而产生了用于稀疏哈密顿模拟的量子算法和量子线性系统，其查询复杂度接近最优，高达所有相关参数的多对数因子。我们的主要技术是 Belovs、Jeffery 和 Yolcu 开发的转换器框架 [Quantum, 8:1444 (2024)]。在这里，我们开发了一种针对块编码的补充运算符级理论。除了现有的催化剂复杂性之外，我们还将解析范数 $K$ 确定为传感器实施的关键复杂性度量。我们表明，仅使用对传感器的 $\\mathcal{O}\\left(K \\log(1/\\epsilon)\\right)$ 查询即可将传感器动作转换为 $\\epsilon$ 近似块编码，从而改善从多项式到对数的精度依赖性。", "authors": [{"name": "Dong An"}, {"name": "Dekuan Dong"}, {"name": "Changpeng Shao"}, {"name": "Yuxin Zhang"}, {"name": "Chenhao Zhao"}], "featured_authors": [{"name": "Dong An"}, {"name": "Dekuan Dong"}, {"name": "Changpeng Shao"}, {"name": "Yuxin Zhang"}, {"name": "Chenhao Zhao"}], "author_count": 5}, {"id": "2609.40080", "category": "quant-ph", "title": "Universal Entanglement Distillation", "abstract": "We present a universal entanglement distillation protocol that asymptotically achieves the distillable entanglement of any unknown bipartite state in a fixed finite dimension. That is, its ebit yield attains every rate below the optimum that would be available if the state were known, with vanishing trace-distance error. Our approach combines tomography by local operations and classical communication with an adaptive distillation routine, using a local robustness lemma to control finite-sample estimation errors. We also characterize worst-case distillation from a family of states: the optimal uniform rate is the minimum distillable entanglement on the family's closure. These results show that ignorance of the state need not incur an asymptotic rate penalty.", "url": "https://arxiv.org/abs/2609.40080", "type": "理论", "summary": "我们提出了一种通用的纠缠蒸馏协议，该协议渐进地实现了固定有限维度中任何未知二分态的可蒸馏纠缠。也就是说，它的息税前收益达到低于最佳状态的每一个速率，如果状态已知，则可获得的最佳速率，并且迹线距离误差消失。我们的方法将局部操作的断层扫描和经典通信与自适应蒸馏例程相结合，使用局部鲁棒性引理来控制有限样本估计误差。我们还描述了一系列状态的最坏情况蒸馏：最佳均匀速率是该族闭包上的最小可蒸馏纠缠。这些结果表明，对国家的无知不一定会导致渐进率惩罚。", "authors": [{"name": "Salvatore Tirone"}, {"name": "Francesco Anna Mele"}, {"name": "Vittorio Giovannetti"}, {"name": "Ludovico Lami"}], "featured_authors": [{"name": "Salvatore Tirone"}, {"name": "Francesco Anna Mele"}, {"name": "Vittorio Giovannetti"}, {"name": "Ludovico Lami"}], "author_count": 4}, {"id": "2609.40088", "category": "quant-ph", "title": "Super-Quadratic Quantum Speedups for Combinatorial Optimization via Tilted Walks", "abstract": "We introduce quantum tilted walks, a quantum algorithmic framework for solving exact combinatorial optimization problems. The framework applies an average of powers of a tilted Hamiltonian that biases the discriminant matrix of a base Markov chain (mixer) with the objective function. Our starting point is quantum short-path algorithms, which prepare the ground state of such a Hamiltonian and obtain super-quadratic speedups over exhaustive search for certain combinatorial optimization problems. Recently, Le Gall and Tamaki~( arXiv:2604.12131 ) developed a classical conditioning-and-search algorithm for weighted MAX-E$k$-LIN2 and weighted MAX-$k$-CSP. Under the same assumptions, their algorithm is only sub-quadratically slower than quantum short-path algorithms. Consequently, existing short-path algorithms do not establish a super-quadratic speedup over this stronger classical baseline. For maximization problems, we give conditions under which tilted walks increase the amplitude on the target state with high objective value when initialized from a starting state with lower objective value. This framework captures conditioning-and-search and yields super-quadratic speedups over it for the same problems. While our framework recovers quantum short-path algorithms as a special case, it neither requires ground-state preparation nor initialization in the ground state of the base mixer. We demonstrate these advantages on a synthetic optimization problem for which tilted walks achieve a super-quadratic speedup whereas the short-path algorithms do not.", "url": "https://arxiv.org/abs/2609.40088", "type": "理论+数值", "summary": "我们引入量子倾斜游走，这是一种用于解决精确组合优化问题的量子算法框架。该框架应用倾斜哈密顿量的平均功率，该倾斜哈密顿量使基马尔可夫链（混合器）的判别矩阵与目标函数产生偏差。我们的出发点是量子短路径算法，它准备这种哈密顿量的基态，并通过对某些组合优化问题的穷举搜索获得超二次加速。最近，Le Gall 和 Tamaki~( arXiv:2604.12131 ) 为加权 MAX-E$k$-LIN2 和加权 MAX-$k$-CSP 开发了一种经典的调节和搜索算法。在相同的假设下，他们的算法仅比量子短路径算法慢次二次方。因此，现有的短路径算法无法在这个更强的经典基线上建立超二次加速。对于最大化问题，我们给出了当从具有较低目标值的起始状态初始化时倾斜行走增加具有高目标值的目标状态的幅度的条件。\n\n该框架捕获条件和搜索，并针对相同问题产生超二次方的加速。虽然我们的框架将量子短路径算法恢复为特殊情况，但它既不需要基态准备，也不需要基础混合器基态的初始化。我们在综合优化问题上展示了这些优势，其中倾斜行走实现了超二次加速，而短路径算法却没有。", "authors": [{"name": "Guneykan Ozgul"}, {"name": "Shouvanik Chakrabarti"}], "featured_authors": [{"name": "Guneykan Ozgul"}, {"name": "Shouvanik Chakrabarti"}], "author_count": 2}, {"id": "2609.40100", "category": "quant-ph", "title": "Logarithmic-Depth Fermion Sampling: Anticoncentration and Average-Case Hardness", "abstract": "Sampling problems give some of the clearest conditional separations between quantum and classical computation. In Fermion Sampling, passive linear optics acts on a non-Gaussian magic input. Globally Haar-random transformations give anticoncentration and high-precision average-case hardness, but require linear depth and quadratically many gates. A natural open question is whether linear depth is necessary? We show that logarithmic depth suffices for both guarantees in the same ensemble. For fresh uniform matchings with independent Haar two-mode gates, the collision reaches the passive-Haar scale at a sharp threshold of $\\log n/\\log(9/4)\\approx0.855\\log_2 n$ layers, with an explicit limiting transition profile and a matching lower bound from two-particle correlations. The mechanism is input-dependent: the magic input suppresses the extensive weight of the slowest relaxation mode, leaving the next to set the scale. An occupation-basis input retains large collision even under full Haar randomness. At a larger logarithmic depth, we prove, in the real-RAM model, average-case $\\#\\mathsf{P}$-hardness of estimating output probabilities to additive error $2^{-O(n\\log^2 n)}$ on any fixed fraction of instances above $3/4$. We construct hard instances in four native layers, embed them in typical schedules, and interpolate along Cayley paths using a rational linear-program decoder. A finite $192$-gate alphabet preserves the collision law exactly. Both guarantees use logarithmic native fermionic depth between arbitrary mode pairs and $O(n\\log n)$ gates, replacing the global-Haar construction's quadratic budget. The accuracy proved is finer than the $1/N$ scale, where $N=\\binom{n}{n/2}$, required by sampling-to-counting; hardness of sampling within constant total-variation distance remains open.", "url": "https://arxiv.org/abs/2609.40100", "type": "理论", "summary": "采样问题给出了量子计算和经典计算之间一些最清晰的条件区分。在费米子采样中，无源线性光学作用于非高斯魔输入。全局哈尔随机变换可提供反集中和高精度平均硬度，但需要线性深度和二次门。一个自然的开放问题是线性深度是否必要？我们证明，对数深度足以满足同一系综中的两种保证。对于具有独立 Haar 双模门的新均匀匹配，碰撞在 $\\log n/\\log(9/4)\\approx0.855\\log_2 n$ 层的尖锐阈值处达到被动 Haar 尺度，具有明确的限制过渡轮廓和来自两粒子相关性的匹配下界。该机制依赖于输入：神奇输入抑制最慢松弛模式的广泛权重，留下下一个来设置比例。即使在完全哈尔随机性下，基于职业的输入也会保留较大的碰撞。\n\n在更大的对数深度下，我们证明，在真实 RAM 模型中，平均情况 $\\#\\mathsf{P}$ - 在任何高于 $3/4$ 的固定比例实例上估计加性误差 $2^{-O(n\\log^2 n)}$ 的输出概率的硬度。我们在四个本机层中构建硬实例，将它们嵌入到典型的调度中，并使用理性线性程序解码器沿凯莱路径进行插值。有限的 $192$ 门字母表准确地保留了碰撞定律。两种保证都使用任意模式对和 $O(n\\log n)$ 门之间的对数本机费米子深度，取代全局 Haar 结构的二次预算。证明的精度比采样到计数所需的 $1/N$ 尺度更精细，其中 $N=\\binom{n}{n/2}$；恒定总变异距离内采样的硬度仍然开放。", "authors": [{"name": "Natansh Mathur"}, {"name": "Iordanis Kerenidis"}], "featured_authors": [{"name": "Natansh Mathur"}, {"name": "Iordanis Kerenidis"}], "author_count": 2}, {"id": "2609.40106", "category": "quant-ph", "title": "A Complete and Natural Rule Set for Multi-Qudit Clifford Circuits in All Odd Prime Dimensions", "abstract": "We present a complete set of $16$ rewrite rules for multi-qudit Clifford circuits in all odd prime dimensions. Completeness means that any two Clifford circuits representing the same linear map can be rewritten into each other using these rules. Each rule involves at most three qudits and admits an intuitive interpretation. To establish completeness, we first work at the symplectic level, using the isomorphism between the symplectic group $\\mathrm{Sp}(2n,\\mathbb{Z}_d)$ and the quotient of the Clifford group by the Pauli group. We construct a circuit normal form that captures the stabiliser tableau of a Clifford operator and is unique up to Pauli correction. Using this normal form, we derive a complete set of symplectic relations, which we then lift to Clifford relations by incorporating Pauli corrections. We also formally verify completeness up to global phase in the Agda proof assistant.", "url": "https://arxiv.org/abs/2609.40106", "type": "理论", "summary": "我们为所有奇素数维度的多量子 Clifford 电路提供了一套完整的 16 美元重写规则。完整性意味着表示相同线性映射的任何两个 Clifford 电路都可以使用这些规则相互重写。每条规则最多涉及三个 Qudits，并允许直观的解释。为了建立完整性，我们首先在辛层面上进行工作，利用辛群 $\\mathrm{Sp}(2n,\\mathbb{Z}_d)$ 与 Clifford 群除以 Pauli 群的商之间的同构。我们构造了一个电路范式，它捕获了 Clifford 算子的稳定器画面，并且在泡利校正之前是唯一的。使用这种范式，我们推导出一套完整的辛关系，然后通过结合泡利修正将其提升为 Clifford 关系。我们还在 Agda 证明助手中正式验证了全局阶段的完整性。", "authors": [{"name": "Xiaoning Bian"}, {"name": "Sarah Meng Li"}, {"name": "Neil J. Ross"}, {"name": "John van de Wetering"}, {"name": "Yuming Zhao"}], "featured_authors": [{"name": "Xiaoning Bian"}, {"name": "Sarah Meng Li"}, {"name": "Neil J. Ross"}, {"name": "John van de Wetering"}, {"name": "Yuming Zhao"}], "author_count": 5}, {"id": "2609.40107", "category": "quant-ph", "title": "Verification Complexity and Extension of Classical Shadows", "abstract": "Classical shadows are an influential framework for compressing copies of a given quantum state $\\rho$ into classical data $S$, enabling many properties of $\\rho$ to be predicted from relatively few copies. In this work, we study two natural questions involving shadows: (1) Given $S$, when can one efficiently verify that $S$ came from a genuine $n$-qubit state? This is called the Classical Shadow Validity (CSV) problem, introduced by Karaiskos, Rudolph, Meyer, Eisert, and Gharibian [ICALP 2026]. (2) Given $S$ that allows one to capture 2-local properties of $\\rho$, can one fake or spoof a shadow $S'$ which predicts 3-local properties of some state? For (1), we show CSV is efficiently solvable for permutation-invariant shadows, QMA-hard for real, fermionic, and bosonic shadows, and both coNP-hard and QMA-hard when the observable family consists of all $n$-qubit Pauli strings. A result of independent interest along the way is a new upper bound qc-$\\Sigma_2$ $\\subseteq$ $\\mathrm{P}^{\\mathrm{PP}}$, where qc-$\\Sigma_2$ is a quantum analogue of the second level of the polynomial hierarchy in which the first proof is quantum. For (2), we show intractability: Given the 2-local marginals $S$ of a quantum state $\\rho$, estimating the 3-local marginals of $\\rho$ is intractable unless QCMA $\\subseteq$ BPP, even if the state $\\rho$ is the unique state consistent with $S$.", "url": "https://arxiv.org/abs/2609.40107", "type": "理论", "summary": "经典阴影是一种有影响力的框架，用于将给定量子态 $\\rho$ 的副本压缩为经典数据 $S$，从而可以从相对较少的副本中预测 $\\rho$ 的许多属性。在这项工作中，我们研究了两个涉及影子的自然问题：（1）给定 $S$，什么时候可以有效地验证 $S$ 来自真正的 $n$-qubit 状态？这称为经典影子有效性 (CSV) 问题，由 Karaiskos、Rudolph、Meyer、Eisert 和 Gharibian 提出 [ICALP 2026]。 (2) 给定 $S$ 允许捕获 $\\rho$ 的 2-局部属性，是否可以伪造或欺骗一个影子 $S'$ 来预测某个状态的 3-局部属性？对于（1），我们证明 CSV 对于排列不变阴影是有效可解的，对于实数、费米子和玻色子阴影来说是 QMA-hard，当可观察族由所有 $n$-qubit Pauli 串组成时，coNP-hard 和 QMA-hard 都是可解的。一路上独立兴趣的结果是一个新的上限 qc-$\\Sigma_2$ $\\subseteq$ $\\mathrm{P}^{\\mathrm{PP}}$，其中 qc-$\\Sigma_2$ 是多项式层次结构第二级的量子模拟，其中第一个证明是量子的。\n\n对于（2），我们表现出棘手性：给定量子态 $\\rho$ 的 2-局部边际 $S$，估计 $\\rho$ 的 3-局部边际是棘手的，除非 QCMA $\\subseteq$ BPP，即使状态 $\\rho$ 是与 $S$ 一致的唯一状态。", "authors": [{"name": "Georgios Karaiskos"}, {"name": "Asad Raza"}, {"name": "Dorian Rudolph"}, {"name": "Dax Enshan Koh"}, {"name": "Sevag Gharibian"}], "featured_authors": [{"name": "Georgios Karaiskos"}, {"name": "Asad Raza"}, {"name": "Dorian Rudolph"}, {"name": "Dax Enshan Koh"}, {"name": "Sevag Gharibian"}], "author_count": 5}, {"id": "2609.40116", "category": "quant-ph", "title": "Quantum Advantage of Permutation-Invariant Functions in Communication Complexity", "abstract": "We study how symmetry constrains quantum advantage in two-party communication complexity. For partial functions over any fixed alphabet of size $q$ that are invariant under simultaneous coordinate permutations, we prove that public-coin randomized and entanglement-assisted quantum communication complexities satisfy $R^{\\mathrm{pub}}(f)=O_q(Q^{\\ast}(f)^2\\log n)$, where $n$ is the input length. We also characterize quantum communication complexity by a combinatorial parameter up to a logarithmic factor. These results extend the binary-alphabet result of Guan et al. and improve its logarithmic overhead. Input-length dependence is necessary: for every fixed $\\varepsilon\\in(0,1)$, binary permutation-invariant partial functions can have quantum complexity $O_\\varepsilon(\\log\\log n)$ and randomized complexity $\\Omega_\\varepsilon((\\log n)^{1-\\varepsilon})$. Growing alphabets and graph symmetries permit exponential separations. For every fixed $\\varepsilon\\in(0,1)$, we construct permutation-invariant partial functions on length-$n$ strings over an $n$-symbol alphabet with quantum complexity $O_\\varepsilon(\\log n)$ and randomized complexity $\\Omega_\\varepsilon(n^{1-\\varepsilon})$. We also construct graph-invariant partial functions on $v$-vertex graphs with quantum complexity $O_\\varepsilon(\\log v)$ and randomized complexity $\\Omega_\\varepsilon(v^{2-\\varepsilon})$. All separation protocols use neither prior entanglement nor shared randomness.", "url": "https://arxiv.org/abs/2609.40116", "type": "理论", "summary": "我们研究对称性如何限制两方通信复杂性中的量子优势。对于在同时坐标排列下不变的任何大小为 $q$ 的固定字母表上的部分函数，​​我们证明公共硬币随机和纠缠辅助量子通信复杂性满足 $R^{\\mathrm{pub}}(f)=O_q(Q^{\\ast}(f)^2\\log n)$，其中 $n$ 是输入长度。我们还通过高达对数因子的组合参数来表征量子通信的复杂性。这些结果扩展了Guan等人的二进制字母表结果。并提高其对数开销。输入长度依赖性是必要的：对于每个固定的 $\\varepsilon\\in(0,1)$，二元排列不变的偏函数可以具有量子复杂度 $O_\\varepsilon(\\log\\log n)$ 和随机复杂度 $\\Omega_\\varepsilon((\\log n)^{1-\\varepsilon})$。不断增长的字母和图形对称性允许指数分离。对于每个固定的 $\\varepsilon\\in(0,1)$，我们在 $n$ 符号字母表上的长度 $n$ 字符串上构建排列不变的偏函数，量子复杂度为 $O_\\varepsilon(\\log n)$ 和随机复杂度 $\\Omega_\\varepsilon(n^{1-\\varepsilon})$。\n\n我们还在 $v$ 顶点图上构造图不变偏函数，其量子复杂度为 $O_\\varepsilon(\\log v)$ 和随机复杂度为 $\\Omega_\\varepsilon(v^{2-\\varepsilon})$。所有分离协议既不使用先验纠缠也不使用共享随机性。", "authors": [{"name": "Yunqi Huang"}, {"name": "Zekun Ye"}], "featured_authors": [{"name": "Yunqi Huang"}, {"name": "Zekun Ye"}], "author_count": 2}, {"id": "2609.40128", "category": "quant-ph", "title": "Optimal Resource Scaling for Early Fault Tolerant Iterative Quantum Phase Estimation under Cost Error Tradeoffs", "abstract": "The iterative quantum phase estimation algorithm (IPEA) is better suited for NISQ and early fault-tolerant hardware compared to the original algorithm, which requires the inverse quantum Fourier transform. However, current error mitigation and correction implementations lead to imperfect unitaries, causing erroneous phase feedback in IPEA. To improve the reliability of phase bits is to repeat the k^th iteration for the 2^k-th power of the unitary $N_k^*$ times, followed by a majority decision. However, due to variations in their circuit complexities, different iterations incur varying resource costs ($w_k$) and different per-shot error probabilities ($q_k$). Given tight resource constraints, we ask what the optimal number $\\{N_k^*: 1\\le k \\le L\\}$ of shots per bit is: $$\\arg \\max_{\\{N_k\\}} \\mathbb{P}(\\text{all } L \\text{ bits correct}) \\text{ s.t.} \\sum_{k=1}^L w_k N_k \\le W$$ We obtain closed-form expressions for $N^*_k$ under the conditions: $W \\gg \\sum_k w_k $(enough for at least one shot per iteration), $w_k$ increases with $k$, $q_k$ are small enough and $L$ is large. We do so by analyzing tractable upper and lower surrogate problems derived via tight concentration and anti-concentration bounds and showing that their solutions converge when $q_k\\ll 1$. We observe that when $W\\gg \\sum_k w_k \\ln\\! \\left(\\sum_k w_k\\right)$, the optimal $N_k^*$ is proportional to $\\frac{\\ln\\! \\left(\\sum_k w_k\\right)}{c_k}$ and does not depend on individual $w_k$, where $c_k=-\\ln\\left(2\\sqrt{\\left(1-\\frac{q_k}{2} \\right) \\frac{q_k}{2}}\\right) \\propto \\ln\\frac{1}{q_k}$. However, when $\\sum_k w_k \\ll W\\ll\\sum_k w_k \\ln\\! \\left(\\sum_k w_k\\right)$, the allocation is also (additively) influenced by $\\frac{1}{c_k}\\ln\\frac{1}{w_k}$ for larger values of $k$, i.e., higher powers of unitary. These results lead to simple rules of thumb for resource allocation that may benefit the design of practical systems.", "url": "https://arxiv.org/abs/2609.40128", "type": "理论+数值", "summary": "与需要逆量子傅立叶变换的原始算法相比，迭代量子相位估计算法 (IPEA) 更适合 NISQ 和早期容错硬件。然而，当前的误差缓解和校正实现会导致不完美的酉，导致 IPEA 中出现错误的相位反馈。为了提高相位位的可靠性，就是重复k^次迭代，进行酉$N_k^*$次方的2^k次方，然后进行多数决策。然而，由于电路复杂性的差异，不同的迭代会产生不同的资源成本 ($w_k$) 和不同的单次错误概率 ($q_k$)。给定严格的资源限制，我们询问每比特的最佳镜头数 $\\{N_k^*: 1\\le k \\le L\\}$ 是多少： $$\\arg \\max_{\\{N_k\\}} \\mathbb{P}(\\text{all } L \\text{ 位正确}) \\text{ s.t.} \\sum_{k=1}^L w_k N_k \\le W$$ 我们获得闭式表达式$N^*_k$ 条件为：$W \\gg \\sum_k w_k $（每次迭代至少一次），$w_k$ 随着 $k$ 增加，$q_k$ 足够小，$L$ 足够大。\n\n我们通过分析由紧集中和反集中边界导出的易处理的上代理问题和下代理问题，并表明当 $q_k\\ll 1$ 时它们的解收敛。我们观察到当 $W\\gg \\sum_k w_k \\ln\\! \\left(\\sum_k w_k\\right)$，最优的$N_k^*$与$\\frac{\\ln\\!成正比\\left(\\sum_k w_k\\right)}{c_k}$ 并且不依赖于个体 $w_k$，其中 $c_k=-\\ln\\left(2\\sqrt{\\left(1-\\frac{q_k}{2} \\right) \\frac{q_k}{2}}\\right) \\propto \\ln\\frac{1}{q_k}$。然而，当 $\\sum_k w_k \\ll W\\ll\\sum_k w_k \\ln\\! \\left(\\sum_k w_k\\right)$，对于较大的 $k$ 值，即更高的酉次方，分配也（附加）受到 $\\frac{1}{c_k}\\ln\\frac{1}{w_k}$ 的影响。这些结果得出了资源分配的简单经验规则，可能有利于实际系统的设计。", "authors": [{"name": "Mrudula A Mahindrakar"}, {"name": "Avhishek Chatterjee"}], "featured_authors": [{"name": "Mrudula A Mahindrakar"}, {"name": "Avhishek Chatterjee"}], "author_count": 2}, {"id": "2609.40144", "category": "quant-ph", "title": "Fast Cliffords When Your Quantum Memory Is Full", "abstract": "Additional qubits can reduce the depth of a quantum circuit by providing workspace for parallel computation, but standard constructions assume that this workspace is initialized in a known state. In this work we study catalytic implementations, i.e. asking whether dirty qubits can instead be used provided that their joint state including any entanglement with other registers is restored exactly at the end of the computation. We show that every $n$-qubit Clifford circuit has a catalytic implementation of depth $O(\\log n)$ using $O(n^2/\\log^2 n)$ catalytic qubits and no clean qubits, matching the asymptotic depth achievable when clean workspace is available. We extend this approach to diagonal elements of any fixed level $C_k$ of the Clifford hierarchy, which admit catalytic implementations of depth $O(\\log(n+1))$ with $O(n^k/\\log(n))$ gates and $O(n^k/\\log^2(n))$ catalytic qubits, as well as to semi-Clifford Gates.", "url": "https://arxiv.org/abs/2609.40144", "type": "理论", "summary": "额外的量子位可以通过提供并行计算的工作空间来减少量子电路的深度，但标准结构假设该工作空间是在已知状态下初始化的。在这项工作中，我们研究催化实现，即询问是否可以使用脏量子位，前提是它们的联合状态（包括与其他寄存器的任何纠缠）在计算结束时准确恢复。我们证明，每个 $n$-qubit Clifford 电路都使用 $O(n^2/\\log^2 n)$ 催化量子位且没有干净的量子位，具有深度 $O(\\log n)$ 的催化实现，与干净工作空间可用时可实现的渐近深度相匹配。我们将此方法扩展到 Clifford 层次结构的任何固定级别 $C_k$ 的对角元素，它允许深度 $O(\\log(n+1))$ 与 $O(n^k/\\log(n))$ 门和 $O(n^k/\\log^2(n))$ 催化量子位的催化实现，以及半 Clifford 门。", "authors": [{"name": "Marten Folkertsma"}, {"name": "Ian Mertz"}, {"name": "Sergii Strelchuk"}, {"name": "Sathyawageeswar Subramanian"}], "featured_authors": [{"name": "Marten Folkertsma"}, {"name": "Ian Mertz"}, {"name": "Sergii Strelchuk"}, {"name": "Sathyawageeswar Subramanian"}], "author_count": 4}, {"id": "2609.40154", "category": "quant-ph", "title": "Quantum Černý complexity of binary words", "abstract": "We introduce the quantum Černý complexity $\\mathrm{qc}(w)$ of a binary word $w$: the least dimension $d$ for which there exist quantum channels $A_0,A_1$ on $d\\times d$ density matrices and a start state $\\rho_0$ such that $w$ is the unique shortest word whose associated channel is constant on the reachable set. We show that $2\\le\\mathrm{qc}(w)\\le\\lceil\\sqrt{|w|+1}\\,\\rceil$ for every nonempty $w$, a quadratic saving over the classical analogue, and that constant words are extremal: $\\mathrm{qc}(0^m)=\\lceil\\sqrt{m+1}\\,\\rceil$. In contrast, $\\mathrm{qc}(01^n0)=2$ for every $n\\ge 1$, realized by a single qubit whose rotation angle acts as a counter; consequently there is no quantum analogue of the Černý function, and $\\mathrm{qc}$ is strongly anti-correlated with intuitive notions of descriptive complexity. We further study the variant $\\mathrm{qcp}$ in which the synchronization target is required to be a pure state. We prove that in dimension $2$ no word of length at least $2$ can be a unique shortest synchronizing word with pure target, and we exhibit an explicit qutrit instance, combining a coherent rotation with a measure-and-funnel channel, achieving $\\mathrm{qcp}(01^n0)=3$ with target a computational basis state and with synchronization holding universally over all input states. Thus purity of the reset state costs exactly one dimension on this family. We also observe that $\\mathrm{qc}$ is computable, by reduction to the first-order theory of the reals.", "url": "https://arxiv.org/abs/2609.40154", "type": "理论", "summary": "我们引入二进制词 $w$ 的量子复杂度 $\\mathrm{qc}(w)$：最小维度 $d$，在 $d\\times d$ 密度矩阵上存在量子通道 $A_0,A_1$ 和起始状态 $\\rho_0$，使得 $w$ 是唯一的最短词，其相关通道在可达集上是恒定的。我们证明，对于每个非空 $w$，$2\\le\\mathrm{qc}(w)\\le\\lceil\\sqrt{|w|+1}\\,\\rceil$ 比经典模拟节省了二次方，并且常量词是极值的：$\\mathrm{qc}(0^m)=\\lceil\\sqrt{m+1}\\,\\rceil$。相比之下，对于每个 $n\\ge 1$，$\\mathrm{qc}(01^n0)=2$，由旋转角充当计数器的单个量子位实现；因此，不存在切尔尼函数的量子模拟，并且 $\\mathrm{qc}$ 与描述复杂性的直观概念强烈反相关。我们进一步研究了变体$\\mathrm{qcp}$，其中同步目标要求是纯状态。\n\n我们证明，在维度 $2$ 中，长度至少为 $2$ 的单词不能是具有纯目标的唯一最短同步单词，并且我们展示了一个显式 qutrit 实例，将连贯旋转与测量漏斗通道相结合，实现 $\\mathrm{qcp}(01^n0)=3$ ，目标为计算基础状态，并且在所有输入状态上普遍保持同步。因此，重置状态的纯粹性在这个系列上花费了一个维度的代价。我们还观察到 $\\mathrm{qc}$ 通过还原为实数的一阶理论是可计算的。", "authors": [{"name": "Pui Hang Lee"}, {"name": "Pui-Yee Lee"}, {"name": "Bjørn Kjos-Hanssen"}], "featured_authors": [{"name": "Pui Hang Lee"}, {"name": "Pui-Yee Lee"}, {"name": "Bjørn Kjos-Hanssen"}], "author_count": 3}, {"id": "2609.40162", "category": "quant-ph", "title": "Classical and Quantum Simulation of All-to-All Quantum Dynamics in Logarithmic Space", "abstract": "We study both the classical and the quantum complexity of the problem of estimating disorder-averaged quench dynamics for all-to-all spin Hamiltonians such as quantum Hopfield, Sherrington--Kirkpatrick (SK) or Dicke-type models. Disorder averaging restores permutation invariance in this setting, so states of $N$ spins can be stored in $\\mathcal O(\\log N)$ qubits. While logarithmic-space quantum computations are known to be simulatable classically in polynomial time or in polylogarithmic space, whether a single algorithm can achieve both is open, raising the possibility of simultaneous quantum advantage. To this end, we give a quantum algorithm for permutation-invariant $k$-local dynamics without disorder using polynomial time and $\\mathcal O(\\log N)$ quantum and classical space. We show that any classical algorithm matching these resources would imply $\\mathsf{BQL}\\subseteq \\mathsf{SC}$. For short times, however, we provide such algorithms, including for SK models. For Hopfield models, we discuss how dilating the disorder to ancilla qubits reduces the problem to the disorder-free case on an enlarged system, thus extending both classical and quantum results to them. We give some evidence that their long-time dynamics are non-trivial. They thus emerge as a candidate for a simultaneous time--space advantage in quantum simulation.", "url": "https://arxiv.org/abs/2609.40162", "type": "理论+数值", "summary": "我们研究了估计全自旋哈密顿量的无序平均淬灭动力学问题的经典和量子复杂性，例如量子 Hopfield、Sherrington-Kirkpatrick (SK) 或 Dicke 型模型。无序平均恢复在此设置中的排列不变性，因此 $N$ 自旋的状态可以存储在 $\\mathcal O(\\log N)$ 量子位中。虽然已知对数空间量子计算可以在多项式时间或多对数空间中进行经典模拟，但单个算法是否可以同时实现这两个目标仍然是开放的，这提高了同时量子优势的可能性。为此，我们使用多项式时间和 $\\mathcal O(\\log N)$ 量子和经典空间，给出了一种无序排列不变 $k$-局域动力学的量子算法。我们表明，任何匹配这些资源的经典算法都意味着 $\\mathsf{BQL}\\subseteq \\mathsf{SC}$。然而，我们会在短时间内提供此类算法，包括 SK 模型。对于 Hopfield 模型，我们讨论了如何将无序扩展到辅助量子位，从而将问题简化为扩大系统上的无序情况，从而将经典和量子结果扩展到它们。\n\n我们提供了一些证据，表明它们的长期动态并非微不足道。因此，它们成为量子模拟中同时具有时空优势的候选者。", "authors": [{"name": "Maximilian Lutz"}, {"name": "Rahul Trivedi"}, {"name": "J. Ignacio Cirac"}], "featured_authors": [{"name": "Maximilian Lutz"}, {"name": "Rahul Trivedi"}, {"name": "J. Ignacio Cirac"}], "author_count": 3}, {"id": "2609.40164", "category": "quant-ph", "title": "Exact spectral gaps for random Pauli rotations", "abstract": "We resolve the spectral-gap problem posed by Baer and Haah for random Pauli rotations. In this walk, a nonidentity $n$-qubit Pauli operator $P$ and an angle $\\theta$ modulo $2\\pi$ are chosen independently and uniformly, and the step is $e^{\\mathrm{i}\\theta P}$. Writing $d=2^n$, we prove that the gap on $\\mathsf{SU}(d)$ is $(d-8)/(8(d-1))$ for $n\\ge4$. This disproves their conjectured formula on the full special unitary group. We also prove that the conjectured value, $d(d-3)/(8(d^2-1))$, is exactly the gap on $\\mathsf{PU}(d)$ for $n\\ge3$. The special-unitary gap is attained by an explicit vector in $\\bigwedge^8\\mathbb C^d$, constructed from affine three-dimensional subspaces of $\\mathbb F_2^n$. Its nontrivial central action explains why balanced tensor representations do not detect this smaller gap. On the projective group, the gap is attained in $U\\mapsto U^{\\otimes4}\\otimes\\bar U^{\\otimes4}$. The matching lower bounds hold uniformly over all finite-dimensional unitary representations. They combine the spectrum of the graph of anticommuting Pauli operators, a minimum-weight bound for binary polynomials, and a local inequality on a single-qubit Clifford-fixed subspace. The proof is analytic and requires no computational verification.", "url": "https://arxiv.org/abs/2609.40164", "type": "理论", "summary": "我们解决了 Baer 和 Haah 提出的随机泡利旋转的谱间隙问题。在此行走中，独立且统一地选择非同一性$n$-量子位泡利算子$P$和角度$\\theta$模$2\\pi$，步长为$e^{\\mathrm{i}\\theta P}$。写$d=2^n$，我们证明对于$n\\ge4$，$\\mathsf{SU}(d)$ 上的差距是$(d-8)/(8(d-1))$。这反驳了他们关于满特殊酉群的猜想公式。我们还证明了推测值 $d(d-3)/(8(d^2-1))$ 正是 $\\mathsf{PU}(d)$ 上 $n\\ge3$ 的差距。特殊酉间隙是通过 $\\bigwedge^8\\mathbb C^d$ 中的显式向量获得的，该向量由 $\\mathbb F_2^n$ 的仿射三维子空间构造而成。它的重要中心作用解释了为什么平衡张量表示无法检测到这个较小的间隙。在射影群上，间隙在 $U\\mapsto U^{\\otimes4}\\otimes\\bar U^{\\otimes4}$ 中获得。匹配下界对于所有有限维酉表示一致成立。它们结合了反交换泡利算子的图谱、二元多项式的最小权重界限以及单量子位 Clifford 固定子空间上的局部不等式。\n\n该证明是分析性的，不需要计算验证。", "authors": [{"name": "Ziyuan Dong"}, {"name": "Xiang Fan"}], "featured_authors": [{"name": "Ziyuan Dong"}, {"name": "Xiang Fan"}], "author_count": 2}, {"id": "2609.40167", "category": "quant-ph", "title": "Shadow Quantum Singular Value Transformation with Shallow Quantum Circuits", "abstract": "We introduce shadow quantum singular value transformation (Shadow QSVT): given an initial state $|{\\psi}\\rangle$, a Hermitian matrix $H$, a polynomial $f$, and a set of observables $\\{O_1,\\dots,O_m\\}$, the goal is to estimate $\\langle{\\psi}|f(H)^{\\dagger}O_j f(H)|{\\psi}\\rangle$ for all $j\\in\\{1,\\dots,m\\}$. Shadow QSVT provides a systematic route to reduce the quantum resources required by standard QSVT, which constructs a unitary block-encoding of $f(H)$. It uses structure in the input state and observables, together with the fact that many applications require only observable estimates rather than synthesizing the full unitary. We present three algorithms that exploit structure in the initial state and observables to reduce quantum circuit depth. First, we develop a state-aware QSVT algorithm that prepares the target state with low circuit depth when the Krylov subspace associated with $H$ and $|\\psi\\rangle$ is low-dimensional or admits an accurate low-dimensional approximation. Second, we introduce an observable-aware Shadow QSVT algorithm that combines a new observable-aware Krylov subspace with history states to further reduce circuit depth and gate complexity. Finally, we develop Classical Shadow QSVT, which constructs a classical representation from $H$, $f$, and $|\\psi\\rangle$ without prior knowledge of the observables or explicit preparation of the target state proportional to $f(H)|\\psi\\rangle$. This representation enables estimation of the target quantities for observables specified after the quantum computation. Together, these three algorithms provide tools for reducing the circuit depth of QSVT-based computations across a range of settings.", "url": "https://arxiv.org/abs/2609.40167", "type": "数值", "summary": "我们引入影子量子奇异值变换（Shadow QSVT）：给定初始状态 $|{\\psi}\\rangle$、埃尔米特矩阵 $H$、多项式 $f$ 和一组可观测量 $\\{O_1,\\dots,O_m\\}$，目标是估计所有的 $\\langle{\\psi}|f(H)^{\\dagger}O_j f(H)|{\\psi}\\rangle$ $j\\in\\{1,\\dots,m\\}$。 Shadow QSVT 提供了一种系统途径来减少标准 QSVT 所需的量子资源，该标准构建了 $f(H)$ 的统一块编码。它使用输入状态和可观察量中的结构，以及许多应用程序仅需要可观察估计而不是综合完整的单一这一事实。我们提出了三种利用初始状态和可观测结构来减少量子电路深度的算法。首先，我们开发了一种状态感知 QSVT 算法，当与 $H$ 和 $|\\psi\\rangle$ 关联的 Krylov 子空间是低维或允许精确的低维近似时，该算法会准备具有低电路深度的目标状态。其次，我们引入了一种可观察感知的 Shadow QSVT 算法，该算法将新的可观察感知的 Krylov 子空间与历史状态相结合，以进一步减少电路深度和门复杂度。\n\n最后，我们开发了 Classical Shadow QSVT，它从 $H$、$f$ 和 $|\\psi\\rangle$ 构造经典表示，而无需先验知识可观测值或显式准备与 $f(H)|\\psi\\rangle$ 成比例的目标状态。这种表示能够估计量子计算后指定的可观察量的目标量。这三种算法共同提供了在一系列设置中减少基于 QSVT 的计算的电路深度的工具。", "authors": [{"name": "Nai-Hui Chia"}, {"name": "Hyunseong Kim"}, {"name": "Chia-Ying Lin"}], "featured_authors": [{"name": "Nai-Hui Chia"}, {"name": "Hyunseong Kim"}, {"name": "Chia-Ying Lin"}], "author_count": 3}, {"id": "2609.40173", "category": "quant-ph", "title": "Practical fermionic shadows enabled by improved sample-complexity bounds", "abstract": "Classical shadow tomography is widely touted as supplying a family of methods for extracting information from quantum systems with polynomially scaling sample-complexities. In the current era of quantum computers possessing on the order of hundreds of qubits, however, polynomial scaling can nonetheless be prohibitive. Thus, there is a strong practical need for obtaining sample-complexity bounds which are as tight as possible. Here we address this in the case of fermionic (matchgate) shadows. For an arbitrary observable $O$ of Majorana degree $2k$, we improve the previously known sample-complexity bound of $\\mathcal{O}(n^{2k}\\|O\\|_\\infty^2)$ to $\\mathcal{O}(n^{k}\\|O\\|_\\infty^2)$, which is asymptotically tight. For example, for the estimation of the energy per mode of an open fermionic 50-site Hubbard chain with hopping and on site strenghts respectively given by $t=1$, $V=4$, and for a target additive precision of 0.1, this reduces the number of required shots from $\\sim 10^9$ to $\\sim 10^5$. That is, the new bound reduces the required number of shots by approximately $99.98\\%$.", "url": "https://arxiv.org/abs/2609.40173", "type": "理论", "summary": "经典阴影断层扫描被广泛吹捧为提供一系列从具有多项式缩放样本复杂性的量子系统中提取信息的方法。然而，在当前拥有数百个量子位的量子计算机时代，多项式缩放仍然令人望而却步。因此，迫切需要获得尽可能严格的样本复杂度界限。在这里，我们在费米子（匹配门）阴影的情况下解决这个问题。对于马约拉纳度 $2k$ 的任意可观测 $O$，我们将先前已知的样本复杂度界限 $\\mathcal{O}(n^{2k}\\|O\\|_\\infty^2)$ 改进为 $\\mathcal{O}(n^{k}\\|O\\|_\\infty^2)$，这是渐近紧的。例如，对于开放费米子 50 位哈伯德链的每个模式能量的估计，其跳跃强度和位点强度分别由 $t=1$、$V=4$ 给出，并且对于 0.1 的目标附加精度，这将所需的发射次数从 $\\sim 10^9$ 减少到 $\\sim 10^5$。也就是说，新的界限将所需的射击次数减少了大约 $99.98\\%$。", "authors": [{"name": "Maxwell West"}, {"name": "Su Yeon Chang"}, {"name": "Luke Coffman"}, {"name": "Martin Larocca"}, {"name": "M. Cerezo"}], "featured_authors": [{"name": "Maxwell West"}, {"name": "Su Yeon Chang"}, {"name": "Luke Coffman"}, {"name": "Martin Larocca"}, {"name": "M. Cerezo"}], "author_count": 5}, {"id": "2609.40174", "category": "quant-ph", "title": "Dissipation accelerates quantum and classical simulation of open-system dynamics", "abstract": "Simulating open quantum systems reveals how environmental coupling shapes relaxation, excitation transport, and the dynamics of quantum correlations. On quantum hardware, dissipative channels add operations and might seem to increase cost. However, we show that a broad class of Pauli noise, including depolarization, can ease quantum and classical simulation by exponentially suppressing high-weight components of Heisenberg-evolved observables. For bounded-degree Lindblad dynamics, this permits system-size-independent Trotter steps when estimating local observables. Combining this compression with Richardson extrapolation, we provide classical and quantum error bounds with respect to the 2-norm of the propagated observable. These give high-probability expectation-value guarantees for random input states or random Hamiltonians acting on a fixed state and control (out-of-time-order) correlators. Concretely, we show that expectation values of local observables at time $t$ can be estimated to accuracy $\\varepsilon$ using circuits of maximum depth $O\\!\\left(\\left[1+\\left(t/\\gamma\\right)^{3/2}\\right]\\log^2(1/\\varepsilon)\\right)$, independent of the system size $n$. Classically, we show that sparse Pauli propagation runs in time polynomial in $n$, $t$ and $1/\\varepsilon$ for every fixed $\\gamma>0$, with polynomial degree $O(1/\\gamma)$ in the weak dissipation limit. The gap between our quantum and classical upper bounds leaves room for a substantial polynomial quantum advantage as dissipation weakens, an observation further supported by our numerical results.", "url": "https://arxiv.org/abs/2609.40174", "type": "理论+数值", "summary": "模拟开放量子系统揭示了环境耦合如何影响弛豫、激发传输和量子关联的动力学。在量子硬件上，耗散通道会增加操作，并且似乎会增加成本。然而，我们表明，包括去极化在内的一大类泡利噪声可以通过指数抑制海森堡演化可观测量的高权重分量来简化量子和经典模拟。对于有界度 Lindblad 动力学，这允许在估计局部可观测量时使用与系统大小无关的 Trotter 步骤。将此压缩与理查森外推法相结合，我们提供了关于传播可观测量的 2-范数的经典和量子误差界限。这些为随机输入状态或作用于固定状态和控制（乱序）相关器的随机哈密顿量提供高概率期望值保证。具体来说，我们表明，可以使用最大深度 $O\\!\\left(\\left[1+\\left(t/\\gamma\\right)^{3/2}\\right]\\log^2(1/\\varepsilon)\\right)$ 的电路将时间 $t$ 的局部可观测量的期望值估计到准确度 $\\varepsilon$，而与系统大小 $n$ 无关。\n\n经典地，我们证明对于每个固定的 $\\gamma>0$，稀疏泡利传播在 $n$、$t$ 和 $1/\\varepsilon$ 的时间多项式中运行，多项式次数 $O(1/\\gamma)$ 在弱耗散极限。随着耗散减弱，我们的量子上限和经典上限之间的差距为多项式量子优势留下了空间，我们的数值结果进一步支持了这一观察。", "authors": [{"name": "Armando Angrisani"}, {"name": "Ricard Puig"}, {"name": "Yanting Teng"}, {"name": "Zoë Holmes"}], "featured_authors": [{"name": "Armando Angrisani"}, {"name": "Ricard Puig"}, {"name": "Yanting Teng"}, {"name": "Zoë Holmes"}], "author_count": 4}, {"id": "2609.40180", "category": "quant-ph", "title": "Improved Quantum Query Bounds for Boolean Matrix Product Verification", "abstract": "We prove the first non-trivial upper bound for the quantum query complexity of Boolean Matrix Product Verification ($\\mathsf{BMPV}$), answering a longstanding open question in quantum query complexity. For $n\\times n$ matrices, our upper bound is $\\widetilde O(n^{17/12})$, improving on the standard $O(n^{3/2})$ bound obtained using Grover search by Buhrman and Špalek (SODA 2006). We complement this result by showing an $\\Omega(n^{5/4})$ lower bound, which improves over the previous best known lower bound of $\\widetilde\\Omega(n^{19/18})$ by Childs, Kimmel, and Kothari (ESA 2012). Our approach centers on a connection with Orthogonal Vectors ($\\mathsf{OV}$), which asks whether an indexed list of $n$ Boolean vectors of dimension $n$ contains two vectors with disjoint supports. In particular, we prove equivalences between $\\mathsf{OV}$ and $\\mathsf{BMPV}$ and establish the above bounds for $\\mathsf{OV}$. We also prove a tight $\\widetilde \\Theta(n^{3/2})$ bound for a variant of $\\mathsf{BMPV}$ that asks whether the product contains a given row vector. Together, these results imply a polynomial separation between the quantum query complexities of deciding whether a graph has radius at most two and whether it has diameter at most two.", "url": "https://arxiv.org/abs/2609.40180", "type": "理论", "summary": "我们证明了布尔矩阵乘积验证 ($\\mathsf{BMPV}$) 量子查询复杂性的第一个重要上限，回答了量子查询复杂性中长期存在的悬而未决的问题。对于 $n\\times n$ 矩阵，我们的上限是 $\\widetilde O(n^{17/12})$，改进了 Buhrman 和 Špalek 使用 Grover 搜索获得的标准 $O(n^{3/2})$ 界限 (SODA 2006)。我们通过显示 $\\Omega(n^{5/4})$ 下限来补充这一结果，该下限比 Childs、Kimmel 和 Kothari 先前最知名的 $\\widetilde\\Omega(n^{19/18})$ 下限有所改进 (ESA 2012)。我们的方法以与正交向量 ($\\mathsf{OV}$) 的连接为中心，它询问维度 $n$ 的 $n$ 布尔向量的索引列表是否包含两个具有不相交支持的向量。特别是，我们证明了 $\\mathsf{OV}$ 和 $\\mathsf{BMPV}$ 之间的等价性，并为 $\\mathsf{OV}$ 建立了上述界限。我们还证明了 $\\widetilde \\Theta(n^{3/2})$ 对于 $\\mathsf{BMPV}$ 的变体的严格约束，该变体询问乘积是否包含给定的行向量。\n\n总之，这些结果意味着决定图的半径是否最多为 2 以及直径是否最多为 2 的量子查询复杂性之间存在多项式分离。", "authors": [{"name": "Amin Shiraz Gilani"}, {"name": "François Le Gall"}, {"name": "Xingyu Zhou"}], "featured_authors": [{"name": "Amin Shiraz Gilani"}, {"name": "François Le Gall"}, {"name": "Xingyu Zhou"}], "author_count": 3}, {"id": "2609.40182", "category": "quant-ph", "title": "A mixing time method for estimating the sample complexity of quantum state discrimination", "abstract": "We develop a mixing time method for estimating the sample complexity of quantum state discrimination. We start with considering the minimum-error discrimination of geometrically uniform pure state ensembles, and prove that its sample complexity has a tight estimate given by a quantum homogeneous mixing time [George et al., 2026] and a quantum version of the generalized Dobrushin coefficient [Wolfer, 2020]. This quantum mixing time further reduces to a classical one when the generating group $G$ forms a Gelfand pair with the stabilizer subgroup $H$ of the generator state. In this case the generalized Dobrushin coefficient can be fully expressed by representation-theoretic quantities of the commutative Hecke algebra $\\operatorname{End}_G(\\mathbb C[G/H])$. In particular, this method reduces the sample complexity estimation of learning quantum coupon collector states [Arunachalam et al., 2020] and learning phase states to classical mixing time problems. We apply this framework to answer the open problems of learning degree-$d$ phase states over $\\mathbb F_q$ in [Alrabiah et al., 2026] and generalized Boolean phase states over $\\mathbb Z_q$ [Arunachalam et al., 2023]. The framework also applies to hypergraph state ensembles, giving estimates expressed fully in terms of hypergraph data and recovering estimates for graph state ensembles in [Montanaro and Shao, 2022]. Finally, we extend the discussion to arbitrary mixed state ensembles with uniform priors, prove a sandwiched bound for minimum-error discrimination sample complexity by a quantum weakly mixing time, and provide a tight estimate for the minimax discrimination sample complexity from [D'Ariano et al., 2005] by a Dobrushin-type coefficient. We also discuss the method of strengthened data processing inequality [Gao and Rouz{é}, 2022] and give an upper bound in terms of a strengthened data processing inequality constant.", "url": "https://arxiv.org/abs/2609.40182", "type": "理论", "summary": "我们开发了一种混合时间方法来估计量子态辨别的样本复杂性。我们首先考虑几何均匀纯态系综的最小误差判别，并证明其样本复杂性具有由量子齐次混合时间 [George et al., 2026] 和广义 Dobrushin 系数的量子版本 [Wolfer, 2020] 给出的严格估计。当生成群 $G$ 与生成状态的稳定子群 $H$ 形成格尔范德对时，该量子混合时间进一步减少到经典混合时间。在这种情况下，广义Dobrushin系数可以完全由交换赫克代数$\\operatorname{End}_G(\\mathbb C[G/H])$的表示理论量来表示。特别是，该方法降低了学习量子优惠券收集器状态[Arunachalam et al., 2020]和学习经典混合时间问题的相状态的样本复杂性估计。我们应用这个框架来回答[Alrabiah et al., 2026]中学习$\\mathbb F_q$上的度$d$相态和$\\mathbb Z_q$上的广义布尔相态[Arunachalam et al., 2023]的开放问题。\n\n该框架也适用于超图状态集合，给出了完全用超图数据表达的估计，并恢复了 [Montanaro 和 Shao，2022] 中图状态集合的估计。最后，我们将讨论扩展到具有统一先验的任意混合状态系综，通过量子弱混合时间证明最小误差判别样本复杂性的夹层界限，并通过 Dobrushin 型系数提供对 [D'Ariano et al., 2005] 的最小最大判别样本复杂性的严格估计。我们还讨论了强化数据处理不等式的方法[Gao and Rouz{é}, 2022]，并给出了强化数据处理不等式常数的上限。", "authors": [{"name": "Juntai Zhou"}, {"name": "Felix Leditzky"}], "featured_authors": [{"name": "Juntai Zhou"}, {"name": "Felix Leditzky"}], "author_count": 2}, {"id": "2609.40184", "category": "quant-ph", "title": "More is Less:Optimal Security for Haar Quantum Money and More", "abstract": "Quantum cryptography leverages unclonability to enable a wide range of cryptographic applications that are impossible classically, such as digital currency protected against counterfeiting by quantum mechanics. Security requires that no efficient user can produce even one additional valid banknote beyond those already in their possession. However, existing security bounds weaken as the number of banknotes available to a user increases. In this paper, we study a construction of quantum money whose asymptotic query security does not deteriorate as long as the number of banknotes available to a user remains below the scale required for state tomography. In particular, we show that the construction based on an $n$-qubit Haar-random state and a reflection oracle achieves optimal query security: unless a user holds $\\Omega(2^n)$ banknotes, their existing banknotes cannot asymptotically speed up counterfeiting --- their best possible attack is the same as if they do not have any banknotes. To establish this result, we develop a framework based on the compressed-oracle technique for defining and analyzing progress measures for quantum tasks such as Haar state cloning. Furthermore, we prove a tight lower bound for generating $r$ additional copies, give a matching attack, and apply our results to quantum copy-protection.", "url": "https://arxiv.org/abs/2609.40184", "type": "理论", "summary": "量子密码学利用不可克隆性来实现传统上不可能实现的广泛密码学应用，例如通过量子力学防止伪造的数字货币。安全性要求高效的用户除了已经拥有的钞票之外，不能再制作一张额外的有效钞票。然而，随着用户可用纸币数量的增加，现有的安全界限会减弱。在本文中，我们研究了一种量子货币的结构，只要用户可用的纸币数量低于状态断层扫描所需的规模，其渐近查询安全性就不会恶化。特别是，我们证明基于 $n$-qubit Haar 随机状态和反射预言机的构造实现了最佳的查询安全性：除非用户持有 $\\Omega(2^n)$ 钞票，否则他们现有的钞票不能渐近地加速伪造——他们最好的可能攻击与他们没有任何钞票相同。为了确定这一结果，我们开发了一个基于压缩预言技术的框架，用于定义和分析哈尔状态克隆等量子任务的进度度量。\n\n此外，我们证明了生成 $r$ 额外副本的严格下限，给出匹配攻击，并将我们的结果应用于量子复制保护。", "authors": [{"name": "Zihan Hao"}, {"name": "Xingjian Li"}, {"name": "Qipeng Liu"}, {"name": "Wei Zhan"}], "featured_authors": [{"name": "Zihan Hao"}, {"name": "Xingjian Li"}, {"name": "Qipeng Liu"}, {"name": "Wei Zhan"}], "author_count": 4}, {"id": "2609.40194", "category": "quant-ph", "title": "Query-Limited RAM Programs and their Applications", "abstract": "Quantum one-time programs (Broadbent, Gutoski and Stebila, CRYPTO 2013) or OTPs for short, enable a functionality to be encoded into a quantum token that can be evaluated on a single chosen input and then becomes unusable. While powerful, this primitive is inherently stateless and tied to a setting in which a quantum token needs to be issued and distributed for every single evaluation of a circuit. This raises a natural question: can the one-time computation paradigm be extended to richer, stateful forms of controlled access, and would such an extension offer inherent advantages beyond standard OTPs? We introduce $\\textit{query-limited RAM programs}$ (QLPs), a RAM-generalization of QOTPs that supports structured, stateful computation under bounded or policy-driven access. QLPs allow controlled sequences of evaluations while preventing adversarial forking or rollback of computational state. This enables new applications beyond stateless one-time programs, including quantum tokens for Turing Machines whose size depends only on $\\textit{code length}$ (and not runtime), transferable $k$-time or budget-limited programs, and low-communication mechanisms for delegating computation in settings such as Software-as-a-Service. To construct QLPs, we introduce $\\textit{one-shot programs}$, unifying one-shot signatures (Amos, Georgiou, Kiayias and Zhandry, STOC 2020) with the single effective query paradigm (Gupte, Liu, Raizes, Roberts and Vaikuntanathan, STOC 2025). We prove that one-shot programs generically imply query-limited programs, demonstrating that the strengthened unclonability guarantees of one-shot signatures translate into enhanced functionality. Along the way, we clarify the relationship between signature-token primitives and quantum one-time programs via generic constructions, essentially showing that one-time signing programs imply one-time general computation.", "url": "https://arxiv.org/abs/2609.40194", "type": "理论+数值", "summary": "量子一次性程序（Broadbent、Gutoski 和 Stebila，CRYPTO 2013）或简称 OTP，可以将功能编码到量子令牌中，该令牌可以在单个选定的输入上进行评估，然后变得不可用。虽然功能强大，但该原语本质上是无状态的，并且与需要为电路的每次评估发行和分发量子令牌的设置相关联。这就提出了一个自然的问题：一次性计算范例是否可以扩展到更丰富、有状态的受控访问形式，并且这种扩展是否会提供超越标准 OTP 的固有优势？我们引入 $\\textit{查询受限 RAM 程序}$ (QLP)，这是 QOTP 的 RAM 泛化，支持有界或策略驱动访问下的结构化、有状态计算。 QLP 允许受控的评估序列，同时防止计算状态的对抗性分叉或回滚。\n\n这使得新的应用程序超越无状态的一次性程序，包括图灵机的量子令牌，其大小仅取决于 $\\textit{code length}$ （而不是运行时），可转移的 $k$ 时间或预算有限的程序，以及用于在软件即服务等设置中委托计算的低通信机制。为了构建 QLP，我们引入了 $\\textit{一次性程序}$，将一次性签名 (Amos, Georgiou, Kiayias 和 Zhandry, STOC 2020) 与单一有效查询范例 (Gupte, Liu, Raizes, Roberts 和 Vaikuntanathan, STOC 2025) 统一起来。我们证明一次性程序通常意味着查询受限程序，证明一次性签名的增强的不可克隆性保证转化为增强的功能。在此过程中，我们通过通用结构阐明了签名令牌原语和量子一次性程序之间的关系，本质上表明一次性签名程序意味着一次性通用计算。", "authors": [{"name": "Jiahui Liu"}, {"name": "Justin Raizes"}, {"name": "Bhaskar Roberts"}, {"name": "Omri Shmueli"}], "featured_authors": [{"name": "Jiahui Liu"}, {"name": "Justin Raizes"}, {"name": "Bhaskar Roberts"}, {"name": "Omri Shmueli"}], "author_count": 4}, {"id": "2609.40211", "category": "quant-ph", "title": "Submodularity of entropy under quantum convolution", "abstract": "We develop a submodular framework for the von Neumann entropy of discrete quantum convolutions, providing a noncommutative counterpart to the direct side of entropic additive combinatorics. We first introduce globally weighted quantum convolutions, which form compatible families indexed by admissible subsets of a fixed collection of inputs. Our main theorem reveals a polymatroidal geometry underlying their entropy growth: relative to any fixed admissible input block, the entropy gains admit a normalized, monotone, submodular extension to all subsets of the remaining inputs. The theorem yields convolutional strong subadditivity, quantum Ruzsa triangle inequality, and quantum entropic Plünnecke--Ruzsa inequalities for arbitrary input states. For repeated inputs, it gives sharp comparisons of entropy growth across admissible scales; in particular, the quantum doubling constant controls all higher admissible convolution entropies with optimal exponents. Together, these results bring submodular methods from additive combinatorics into the quantum setting and provide a systematic route to broad families of convolutional entropy inequalities.", "url": "https://arxiv.org/abs/2609.40211", "type": "理论", "summary": "我们为离散量子卷积的冯诺依曼熵开发了一个子模框架，为熵加性组合的直接方面提供了非交换对应物。我们首先引入全局加权量子卷积，它形成由固定输入集合的可接受子集索引的兼容族。我们的主要定理揭示了熵增长背后的多拟阵几何：相对于任何固定的可接受输入块，熵增益允许对剩余输入的所有子集进行归一化、单调、子模扩展。该定理得出任意输入状态的卷积强次可加性、量子 Ruzsa 三角不等式和量子熵 Plünnecke-Ruzsa 不等式。对于重复输入，它给出了可接受范围内熵增长的清晰比较；特别是，量子倍增常数控制所有具有最佳指数的更高可接受的卷积熵。总之，这些结果将加性组合的子模方法带入量子环境，并为广泛的卷积熵不等式提供了系统化的途径。", "authors": [{"name": "Milad M. Goodarzi"}], "featured_authors": [{"name": "Milad M. Goodarzi"}], "author_count": 1}, {"id": "2609.40214", "category": "quant-ph", "title": "Quantum Markov State Models for Metastable Dynamics", "abstract": "Open quantum systems can rapidly lose most microscopic information, leaving only a few degrees of freedom to govern their long-time dynamics. Classical Markov state models (MSMs) describe such metastable dynamics as transitions between a few representative phases and are a well-established tool in condensed matter and chemical physics. However, phase labels alone cannot capture quantum coherence that may persist between metastable states. Even when the slow modes are known, their spectral projection need not produce valid quantum states. We construct quantum Markov state models (QMSMs) that describe the surviving information and its evolution on a small physical state space containing classical sectors and quantum matrix blocks. We assume that the evolution channel $\\mathcal C$ changes little when applied a second time, with sufficiently small defect $\\eta=\\|\\mathcal C^2-\\mathcal C\\|_\\diamond$, and that the number of slow degrees of freedom is bounded independently of the full system size. Under these assumptions, we construct compression and reconstruction channels whose composition recovers every reduced state exactly, while the reverse composition gives an exactly idempotent channel approximating $\\mathcal C$, answering Kitaev's exact-rounding question \\cite{Kitaev2025}. Our constructions give an optimal diamond-norm bound of $\\mathcal{O}(\\eta^{1/3})$ on all input states, as well as an improved bound of $\\mathcal{O}(\\eta^{1/2})$ on metastable states prepared by $\\mathcal C$, with constants depending only on the slow dimension. The reduced transition channel can be iterated to predict the microscopic dynamics with controlled error. We illustrate the QMSM through a weakly driven dissipative spin chain supporting either a metastable logical qubit or long-lived classical phases.", "url": "https://arxiv.org/abs/2609.40214", "type": "理论", "summary": "开放量子系统可能会迅速丢失大多数微观信息，只留下几个自由度来控制其长期动态。经典马尔可夫状态模型（MSM）将亚稳态动力学描述为几个代表性相之间的转变，并且是凝聚态物质和化学物理领域的成熟工具。然而，仅相标签无法捕获亚稳态之间可能持续存在的量子相干性。即使慢模已知，它们的光谱投影也不需要产生有效的量子态。我们构建了量子马尔可夫状态模型（QMSM），该模型描述了包含经典扇区和量子矩阵块的小型物理状态空间上的残存信息及其演化。我们假设进化通道 $\\mathcal C$ 在第二次应用时变化很小，缺陷 $\\eta=\\|\\mathcal C^2-\\mathcal C\\|_\\diamond$ 足够小，并且慢速自由度的数量独立于整个系统大小而有界。\n\n在这些假设下，我们构造了压缩和重建通道，其组合精确地恢复了每个简化状态，而反向组合给出了一个近似于 $\\mathcal C$ 的精确幂等通道，回答了 Kitaev 的精确舍入问题 \\cite{Kitaev2025}。我们的构造给出了所有输入状态上 $\\mathcal{O}(\\eta^{1/3})$ 的最佳菱形范数界限，以及 $\\mathcal{O}(\\eta^{1/2})$ 在 $\\mathcal C$ 准备的亚稳态上的改进界限 $\\mathcal{O}(\\eta^{1/2})$，常数仅取决于慢维度。可以迭代减少的过渡通道以预测具有受控误差的微观动力学。我们通过支持亚稳态逻辑量子位或长寿命经典相的弱驱动耗散自旋链来说明 QMSM。", "authors": [{"name": "Hao-En Li"}, {"name": "Lin Lin"}, {"name": "Michael Ragone"}], "featured_authors": [{"name": "Hao-En Li"}, {"name": "Lin Lin"}, {"name": "Michael Ragone"}], "author_count": 3}, {"id": "2609.40215", "category": "quant-ph", "title": "Universal distillation of quantum entanglement", "abstract": "Distillable entanglement---the maximum rate of Bell states extractable from the given noisy entangled states via local operations and classical communication (LOCC)---has been a central quantity to characterize the operational value of entangled states. However, this operational meaning had been known to be valid only under a crucial assumption: both parties know the description of the input state and can choose the protocol tailored to it, which does not necessarily reflect the natural operational setting. Here, we show that the distillable entanglement is the fundamental operational quantity even without this assumption. We present a universal LOCC protocol---whose description does not depend on the input state and thus works universally for any input---that achieves the distillable entanglement of an arbitrary unknown input state. Our result therefore lifts the distillable entanglement to a robust notion of an operationally meaningful quantity and clarifies that input-state knowledge is not necessary to achieve the optimal rate of entanglement distillation. Our protocol is based on state merging for compound states, together with the uniform convergence property of the finite-block quantity toward distillable entanglement.", "url": "https://arxiv.org/abs/2609.40215", "type": "理论", "summary": "可蒸馏纠缠——通过局域运算和经典通信（LOCC）从给定的噪声纠缠态中提取贝尔态的最大速率——一直是表征纠缠态运算价值的核心量。然而，这种操作意义只有在一个关键假设下才有效：双方都知道输入状态的描述，并且可以选择适合它的协议，这不一定反映自然的操作设置。在这里，我们证明即使没有这个假设，可蒸馏纠缠也是基本运算量。我们提出了一种通用的 LOCC 协议——其描述不依赖于输入状态，因此对任何输入通用——实现了任意未知输入状态的可蒸馏纠缠。因此，我们的结果将可蒸馏的纠缠提升为具有操作意义的量的稳健概念，并阐明输入状态知识对于实现最佳纠缠蒸馏速率不是必需的。\n\n我们的协议基于复合状态的状态合并，以及有限块量向可蒸馏纠缠的一致收敛特性。", "authors": [{"name": "Ryuji Takagi"}, {"name": "Kaito Watanabe"}, {"name": "Takaya Matsuura"}, {"name": "Hayato Arai"}, {"name": "Masahito Hayashi"}], "featured_authors": [{"name": "Ryuji Takagi"}, {"name": "Kaito Watanabe"}, {"name": "Takaya Matsuura"}, {"name": "Hayato Arai"}, {"name": "Masahito Hayashi"}], "author_count": 5}, {"id": "2609.40216", "category": "quant-ph", "title": "Quantum Log-Determinant Methods for Torsion-Sensitive Topological Data Analysis", "abstract": "Betti numbers are central to topological data analysis but fail to capture torsion in integral homology. Torsion can distinguish topological structures with identical Betti numbers, and examples from classical topological data analysis show that it can affect the topology inferred from data. Related torsion-sensitive quantities are also known to have practical applications in graph-based machine learning, including biomedical applications. We investigate how quantum spectral methods can access this additional information. Log pseudodeterminants, obtained by summing the logarithms of the nonzero boundary-Laplacian eigenvalues, summarize spectral information about a simplicial complex. Under explicit topological assumptions, an alternating combination of these quantities gives the size of a higher critical group, the higher-dimensional analogue of a graph sandpile group. With stronger certification, a related construction recovers the size of the torsion subgroup in homology itself. This is, to our knowledge, the first provably correct quantum estimator of integral-homology torsion order. We give a new quantum algorithm for estimating these quantities
