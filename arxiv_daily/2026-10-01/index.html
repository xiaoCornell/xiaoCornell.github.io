eter, which makes high-fidelity design impractical. Neural operators address this issue by learning solution operators, accelerating parameter-space mapping by orders of magnitude. Recent Transformer-based neural operators attempt to capture global dependencies, but often at the cost of quadratic attention complexity. Transolver resolves this problem by projecting physical states into a reduced slice space for attention computation. Although fast, this projection sacrifices fine spatial information. Moreover, by operating in this reduced space with shared weights across attention heads, it may constrain the model's flexibility, thereby limiting its capacity to capture complex phenomena. To address these issues, we propose the Cluster Attention Neural Operator (CANO), which reformulates attention via a novel cross-attention mechanism that dynamically clusters queries while preserving full-resolution keys and values. This avoids slice compression loss and removes weight-sharing limits. At the same time, the model remains fast without losing global interactions. Empirically, CANO achieves state-of-the-art performance across canonical PDE benchmarks, covering fluid and solid dynamics (e.g., Navier-Stokes, Airfoil, Plasticity), irregular unstructured geometries (e.g., Pipe Turbulence, Composites), and long-term temporal rollouts. Across solid deformation and turbulent flow benchmarks, CANO achieves lower errors than baselines and exhibits strong geometric adaptability and temporal consistency.", "url": "https://arxiv.org/abs/2609.39914", "type": "理论", "summary": "参数偏微分方程 (PDE) 的传统模拟依赖于每个参数的重复计算，这使得高保真设计不切实际。神经算子通过学习解算子来解决这个问题，将参数空间映射加速几个数量级。最近基于 Transformer 的神经算子试图捕获全局依赖性，但通常以二次注意力复杂性为代价。 Transolver 通过将物理状态投影到缩小的切片空间中进行注意力计算来解决这个问题。虽然速度很快，但这种投影牺牲了精细的空间信息。此外，通过在这个缩小的空间中操作，并在注意力头之间共享权重，它可能会限制模型的灵活性，从而限制其捕获复杂现象的能力。为了解决这些问题，我们提出了集群注意力神经算子（CANO），它通过一种新颖的交叉注意力机制重新表达注意力，该机制动态地集群查询，同时保留全分辨率的键和值。这避免了切片压缩损失并消除了权重共享限制。同时，该模型在不失去全局交互的情况下保持快速。\n\n根据经验，CANO 在规范的 PDE 基准上实现了最先进的性能，涵盖流体和固体动力学（例如纳维斯托克斯、翼型、塑性）、不规则非结构化几何形状（例如管道湍流、复合材料）以及长期时间推出。在固体变形和湍流基准测试中，CANO 实现了比基线更低的误差，并表现出强大的几何适应性和时间一致性。", "authors": [{"name": "Ming Zhong"}, {"name": "Antonio Colanera"}, {"name": "Gianluigi Rozza"}, {"name": "Zhenya Yan"}], "featured_authors": [{"name": "Ming Zhong"}, {"name": "Antonio Colanera"}, {"name": "Gianluigi Rozza"}, {"name": "Zhenya Yan"}], "author_count": 4}, {"id": "2609.40049", "category": "math-ph", "title": "Discrete differential-geometric Poisson brackets: general theory and explicit constructions", "abstract": "We review the discrete theory of differential-geometric Poisson brackets as introduced by B. A. Dubrovin, and we present a complete proof of their characterisation in the non-degenerate case. We use this characterisation to show several novel examples of such structures, providing a complete classification for non-degenerate four-dimensional differential-geometric Poisson brackets under the additional assumption of the Lie algebra to be of quasi-Frobenius type. We also present a complete classification of quasi-Frobenius filiform N-graded Lie algebras, including two families in arbitrary dimensions.", "url": "https://arxiv.org/abs/2609.40049", "type": "理论", "summary": "我们回顾了 B. A. Dubrovin 引入的微分几何泊松括号的离散理论，并在非简并情况下提供了其表征的完整证明。我们使用这种表征来展示此类结构的几个新颖示例，在李代数为准弗罗贝尼乌斯类型的附加假设下，为非简并四维微分几何泊松括号提供完整的分类。我们还提出了拟 Frobenius 丝状 N 级李代数的完整分类，包括任意维度的两个族。", "authors": [{"name": "Marta Dell'Atti"}, {"name": "Giorgio Gubbiotti"}, {"name": "Pierandrea Vergallo"}], "featured_authors": [{"name": "Marta Dell'Atti"}, {"name": "Giorgio Gubbiotti"}, {"name": "Pierandrea Vergallo"}], "author_count": 3}, {"id": "2609.38300", "category": "quant-ph", "title": "Exact Operator Complexity Measures from Random Matchgate Unitaries", "abstract": "Matchgate circuits describe classically tractable dynamics in a physically relevant setting while nonetheless exhibiting features characteristic of complex quantum systems, such as high amounts of magic. This invites the broader question: to what extent are typical complexity measures saturated under trivial dynamics? Here, we address this by studying the behaviour of different Heisenberg-picture complexity measures in random matchgate ensembles. Our main technical contribution is a tractable and generalisible free-fermionic unitary Weingarten calculus formulated entirely in the Majorana basis. This method is tailored to computing moments of operators, and simplifies to a combinatorics problem which depends on the boundary conditions prescribed by a given operator functional. Using this framework, we derive closed-form expressions for the typical local-operator entanglement, operator stabiliser entropy, and higher-order out-of-time-ordered correlators. For extensive initial Majorana strings, both operator entanglement and stabiliser entropy obey volume laws, even though the underlying circuits remain classically simulable. Out-of-time-ordered correlators can likewise become exponentially small, showing that their late-time saturation value alone does not witness computational hardness and constituting a classically tractable example of emergent free independence. Finally, we relate these separations to operator resource theories, showing how operator entanglement beyond the Gaussian baseline lower-bounds the number of non-Gaussian gates in doped matchgate circuits. Our results present a practical toolbox for computing exact averages over random matchgates, while clarifying the distinction between quantum resources versus simulation complexity, and their dependence on the representation being exploited.", "url": "https://arxiv.org/abs/2609.38300", "type": "理论+数值", "summary": "匹配门电路描述了物理相关环境中经典的易处理动力学，同时展现了复杂量子系统的特征，例如大量的魔法。这就引出了更广泛的问题：典型的复杂性度量在微不足道的动态下饱和到什么程度？在这里，我们通过研究随机匹配门集合中不同海森堡图像复杂性度量的行为来解决这个问题。我们的主要技术贡献是完全在马约拉纳基础上制定的易于处理且可推广的自由费米酉温加滕微积分。该方法适合计算算子矩，并简化为取决于给定算子泛函规定的边界条件的组合问题。使用这个框架，我们推导了典型的局部算子纠缠、算子稳定器熵和高阶乱序相关器的闭合形式表达式。对于广泛的初始马约拉纳弦，算子纠缠和稳定器熵都遵守体积定律，即使底层电路仍然是经典可模拟的。\n\n失序的相关器同样可以变得指数级小，这表明它们的后期饱和值本身并不能证明计算难度，并且构成了新兴自由独立性的经典易处理示例。最后，我们将这些分离与算子资源理论联系起来，展示了超出高斯基线下限的算子纠缠如何减少掺杂匹配门电路中非高斯门的数量。我们的结果提供了一个实用的工具箱，用于计算随机匹配门的精确平均值，同时阐明量子资源与模拟复杂性之间的区别，以及它们对所利用的表示的依赖性。", "authors": [{"name": "Gregory A. L. White"}, {"name": "Jens Eisert"}, {"name": "Neil Dowling"}], "featured_authors": [{"name": "Gregory A. L. White"}, {"name": "Jens Eisert"}, {"name": "Neil Dowling"}], "author_count": 3}, {"id": "2609.38328", "category": "quant-ph", "title": "Exponential strong converse for blind quantum data compression", "abstract": "We establish exponential strong converse theorems for blind quantum data compression of finite-dimensional mixed-state sources, with and without entanglement assistance. Blind compression is a fundamental quantum information processing task in which the sender aims to transmit quantum states without direct access to the classical label. Strong converse is a notable aspect of data compression: the accuracy of the compression abruptly drops down to zero once the compression rate goes below a threshold. Strong converses for data compression have been established for pure-state sources; however, for mixed-state sources, the optimal compression rate is determined by a structural decomposition of quantum states and can change substantially under small perturbations. This sensitivity makes it difficult to quantitatively analyze the trade-off between compression rate and error. Despite recent progress, whether a strong converse holds at the optimal rate has remained unresolved in general. In this work, we resolve this question affirmatively. For unassisted compression, we show that at every rate below the optimum, the accuracy decays exponentially with the block length for general mixed-state sources without restrictions on protocols. We also prove exponential strong converse for blind compression with unlimited entanglement assistance at its optimal rate. Combining the two strong converse bounds yields exponential decay at every compression-entanglement rate pair outside the complete achievable rate region. Our proof introduces a new overlap quantity based on the structure of quantum states; this quantity connects preservation of the source information to the dimension of the transmitted system. We expect that this approach provides useful tools for converse analyses of other quantum information-processing tasks involving mixed states.", "url": "https://arxiv.org/abs/2609.38328", "type": "理论+数值", "summary": "我们为有限维混合态源的盲量子数据压缩建立了指数强逆定理，无论有没有纠缠辅助。盲压缩是一项基本的量子信息处理任务，其中发送者的目标是在不直接访问经典标签的情况下传输量子态。强逆向是数据压缩的一个值得注意的方面：一旦压缩率低于阈值，压缩的准确性就会突然下降到零。对于纯状态源，已经建立了数据压缩的强有力的对话；然而，对于混合态源，最佳压缩率由量子态的结构分解决定，并且在小扰动下可能会发生很大变化。这种敏感性使得定量分析压缩率和误差之间的权衡变得困难。尽管最近取得了进展，但总体而言，强逆向是否保持最佳速率仍然悬而未决。在这项工作中，我们肯定地解决了这个问题。\n\n对于无辅助压缩，我们表明，在低于最佳速率的每个速率下，对于一般混合状态源，在不受协议限制的情况下，精度随着块长度呈指数衰减。我们还证明了盲压缩的指数强逆，以最佳速率提供无限的纠缠辅助。结合两个强逆界，在完全可实现的速率区域之外的每个压缩纠缠速率对处产生指数衰减。我们的证明引入了基于量子态结构的新重叠量；这个量将源信息的保存与传输系统的维度联系起来。我们期望这种方法为涉及混合态的其他量子信息处理任务的逆向分析提供有用的工具。", "authors": [{"name": "Kohdai Kuroiwa"}], "featured_authors": [{"name": "Kohdai Kuroiwa"}], "author_count": 1}, {"id": "2609.38333", "category": "quant-ph", "title": "Collective Dynamics in Spin Chains with Constrained Dissipation: Classically Fragile but Quantum Robust", "abstract": "Collective non-equilibrium phenomena in many-body systems are strongly influenced by fluctuations, particularly in the vicinity of phase transitions, where the interplay between classical and quantum effects can alter cooperative behavior. Here, we investigate this classical-quantum competition in a kinetically constrained spin chain, the dissipative far-East model. In absence of fluctuations, the system exhibits emergent collective dynamics, resulting in phase coexistence. We find that this phenomenon is robust to quantum fluctuations, which further stabilize it, whereas classical fluctuations suppress phase coexistence at long times. We map out the steady-state phase diagram using a cluster mean-field approach and characterize the dynamics with stochastic tensor-network methods. Within the bistable phase we identify signatures of dynamical heterogeneity in both the local magnetization and the entanglement dynamics. This highlights how competing quantum fluctuations and classical kinetic constraints shape the relaxation dynamics and the phase structure of many-body systems.", "url": "https://arxiv.org/abs/2609.38333", "type": "理论+数值", "summary": "多体系统中的集体非平衡现象受到波动的强烈影响，特别是在相变附近，经典效应和量子效应之间的相互作用可以改变合作行为。在这里，我们研究了动力学约束自旋链（耗散远东模型）中的这种经典量子竞争。在没有波动的情况下，系统表现出新兴的集体动力学，从而导致相位共存。我们发现这种现象对量子涨落具有鲁棒性，从而进一步稳定它，而经典涨落会长时间抑制相位共存。我们使用集群平均场方法绘制稳态相图，并使用随机张量网络方法表征动力学。在双稳态阶段，我们识别了局部磁化强度和纠缠动力学中的动力学异质性特征。这凸显了竞争的量子涨落和经典动力学约束如何塑造多体系统的弛豫动力学和相结构。", "authors": [{"name": "Pietro Brighi"}, {"name": "Gianluca Frazzei"}, {"name": "Igor Lesanovsky"}, {"name": "Juan P. Garrahan"}, {"name": "Alberto Biella"}], "featured_authors": [{"name": "Pietro Brighi"}, {"name": "Gianluca Frazzei"}, {"name": "Igor Lesanovsky"}, {"name": "Juan P. Garrahan"}, {"name": "Alberto Biella"}], "author_count": 5}, {"id": "2609.38352", "category": "quant-ph", "title": "Interferometric Readout of Momentum-Space Topology in a Programmable Dissipative Photonic Circuit", "abstract": "Topology under non-Hermitian dynamics is encoded in the phase of the bulk evolution, yet strong dissipation suppresses the amplitudes carrying it. We resolve this using a programmable photonic integrated circuit that implements such dynamics in synthetic momentum space through unitary dilation, with the phase recovered by phase-shifted interferometry. For the non-Hermitian Su-Schrieffer-Heeger model, the method distinguishes trivial and non-trivial Zak phases and yields a coherence winding $q=\\pm 1$ induced by an exceptional point. Extending to a synthetic torus via a Rice-Mele pump gives the first Chern number $\\mathrm{Ch}_1=0,1$ for trivial and non-trivial cycles, showing a programmable route to momentum-space topology under strongly dissipative non-Hermitian dynamics.", "url": "https://arxiv.org/abs/2609.38352", "type": "理论", "summary": "非厄米动力学下的拓扑被编码在体演化阶段，但强耗散抑制了携带它的振幅。我们使用可编程光子集成电路解决了这个问题，该电路通过酉膨胀在合成动量空间中实现这种动态，并通过相移干涉测量恢复相位。对于非厄米特 Su-Schrieffer-Heeger 模型，该方法区分平凡和非平凡 Zak 相位，并产生由异常点引起的相干绕组 $q=\\pm 1$。通过 Rice-Mele 泵扩展到合成环面，给出了平凡和非平凡循环的第一个陈数 $\\mathrm{Ch}_1=0,1$，显示了强耗散非厄米动力学下动量空间拓扑的可编程路线。", "authors": [{"name": "Andrea Cataldo"}, {"name": "Emil J. Bergholtz"}, {"name": "Daniel Leykam"}, {"name": "Jun Gao"}, {"name": "Ali W. Elshaari"}], "featured_authors": [{"name": "Andrea Cataldo"}, {"name": "Emil J. Bergholtz"}, {"name": "Daniel Leykam"}, {"name": "Jun Gao"}, {"name": "Ali W. Elshaari"}], "author_count": 5}, {"id": "2609.38387", "category": "quant-ph", "title": "On Removing Interaction from Quantum Proofs", "abstract": "An important open question in quantum cryptography is the construction of publicly-verifiable NIZKs for QMA. Classically, one can construct NIZKs for NP in the random oracle model (and sometimes in the standard model) by compiling an honest-verifier ZK (HVZK) $\\Sigma$-protocol for NP using the Fiat-Shamir transformation. Broadbent and Grilo introduced a quantum analog of a $\\Sigma$-protocol (which they call a $\\Xi$-protocol) in which the prover's first message is quantum, and show that HVZK $\\Xi$-protocols exist for QMA. However, it is not clear how to compile such protocols into NIZKs in the (Q)ROM, because the Fiat-Shamir transformation seems to be incompatible with quantum messages. In this work we give formal evidence that this is indeed the case: we show that if generic \"Fiat-Shamir-like\" compilers for quantum protocols exist in the QROM (with small completeness and soundness error) then QMA = BQP.", "url": "https://arxiv.org/abs/2609.38387", "type": "理论", "summary": "量子密码学中一个重要的悬而未决的问题是为 QMA 构建可公开验证的 NIZK。传统上，可以通过使用 Fiat-Shamir 变换为 NP 编译诚实验证者 ZK (HVZK) $\\Sigma$ 协议，从而在随机预言模型（有时在标准模型中）中构建 NP 的 NIZK。 Broadbent 和 Grilo 引入了 $\\Sigma$ 协议的量子模拟（他们称之为 $\\Xi$ 协议），其中证明者的第一个消息是量子的，并表明 QMA 存在 HVZK $\\Xi$ 协议。然而，目前尚不清楚如何将此类协议编译成 (Q)ROM 中的 NIZK，因为 Fiat-Shamir 变换似乎与量子消息不兼容。在这项工作中，我们给出了正式的证据证明情况确实如此：我们证明，如果 QROM 中存在用于量子协议的通用“Fiat-Shamir-like”编译器（具有较小的完整性和稳健性误差），那么 QMA = BQP。", "authors": [{"name": "Nicholas Spooner"}, {"name": "Max Tromanhauser"}], "featured_authors": [{"name": "Nicholas Spooner"}, {"name": "Max Tromanhauser"}], "author_count": 2}, {"id": "2609.38403", "category": "quant-ph", "title": "Advantage of Sample Complexity in Quantum PAC Learning Requires Inverse Access to State-Preparation Unitaries", "abstract": "Whether quantum computation can reduce the amount of data sampled from an unknown probability distribution required to learn a prediction rule is a fundamental question in quantum machine learning. Quantum PAC learning studies this question using quantum data as a quantum state whose squared amplitudes encode the unknown distribution from which classical learning data are sampled. With only copies of such quantum data, the optimal worst-case sample complexity asymptotically matches that of classical PAC learning. In contrast, access to both a state-preparation unitary for this state and its inverse can improve the query-complexity dependence on the accuracy parameter in realizable learning. However, it has remained unclear whether forward-only access allows such an improvement. In this work, taking the worst case over compatible state-preparation unitaries and their finite ambient dimensions, we show that the optimal forward-only query complexities of realizable and agnostic learning are, respectively, $\\Theta((d+\\log(1/\\delta))/\\varepsilon)$ and $\\Theta((d+\\log(1/\\delta))/\\varepsilon^2)$, where $d$ is the VC dimension of the concept class, $\\varepsilon$ the accuracy parameter, and $\\delta$ the failure probability. These bounds match the optimal sample complexities with classical data or quantum data copies. To prove them, we establish a reduction using $q$ copies of the prepared state to approximate the Haar-averaged output of any $q$-query forward-only algorithm. These results show that forward-only access cannot provide an asymptotic query-complexity advantage over learning from classical data or quantum data copies in this worst-case setting, and establish the essential role of inverse access in the known realizable-setting improvement. Our reduction also provides a new framework for analyzing limitations of forward state-preparation access via state-copy lower bounds.", "url": "https://arxiv.org/abs/2609.38403", "type": "理论+数值", "summary": "量子计算是否可以减少学习预测规则所需的从未知概率分布中采样的数据量是量子机器学习中的一个基本问题。量子 PAC 学习使用量子数据作为量子态来研究这个问题，量子态的平方幅度编码从经典学习数据中采样的未知分布。仅使用此类量子数据的副本，最佳最坏情况样本复杂性渐近与经典 PAC 学习的复杂性相匹配。相反，访问该状态及其逆的状态准备酉可以改善可实现学习中查询复杂性对精度参数的依赖。然而，目前尚不清楚仅前向访问是否允许这样的改进。\n\n在这项工作中，采用兼容状态准备酉及其有限环境维度的最坏情况，我们表明可实现和不可知学习的最佳仅前向查询复杂度分别为 $\\Theta((d+\\log(1/\\delta))/\\varepsilon)$ 和 $\\Theta((d+\\log(1/\\delta))/\\varepsilon^2)$，其中 $d$ 是概念类的 VC 维度， $\\varepsilon$ 为精度参数，$\\delta$ 为故障概率。这些界限将最佳样本复杂性与经典数据或量子数据副本相匹配。为了证明它们，我们使用准备状态的 $q$ 副本建立约简，以近似任何 $q$ 查询仅前向算法的 Haar 平均输出。这些结果表明，在这种最坏情况的设置中，与从经典数据或量子数据副本学习相比，仅前向访问无法提供渐近查询复杂性优势，并确立了反向访问在已知可实现设置改进中的重要作用。我们的简化还提供了一个新的框架，用于分析通过状态复制下界进行前向状态准备访问的限制。", "authors": [{"name": "Natsuto Isogai"}, {"name": "Satoshi Yoshida"}, {"name": "Mio Murao"}], "featured_authors": [{"name": "Natsuto Isogai"}, {"name": "Satoshi Yoshida"}, {"name": "Mio Murao"}], "author_count": 3}, {"id": "2609.38452", "category": "quant-ph", "title": "Quantum Secure Non-Interactive Reductions", "abstract": "Efficient models for secure computation often rely on offline preprocessed correlations, which subsequently enable private online computation from minimal assumptions. Within these models, the study of secure non-interactive reductions (SNIR) formalizes when one classical correlation can be non-interactively transformed into another, while guaranteeing information-theoretic simulation-based privacy. In this work, we introduce quantum secure non-interactive reductions (QSNIR), a natural extension of SNIR, in which the source and target resource are each a bipartite quantum state. Specifically, when the target resource is classical, our framework enables us to analyze the problem of disseminating private correlations from entanglement, in addition to classical resources. Our primary technical result is that QSNIR privacy in this context can be computed exactly via a semidefinite program (SDP) pair that quantifies an error operationally rooted in a simulation-based cheating advantage. We prove that QSNIR privacy is lower-bounded by a decision problem related to minimum-error state discrimination (MED), and use both definitions to compute exact one-shot privacy errors for universal two-party computation (2PC) preprocessing correlations.", "url": "https://arxiv.org/abs/2609.38452", "type": "理论+数值", "summary": "用于安全计算的有效模型通常依赖于离线预处理的相关性，这随后可以根据最小的假设实现私有在线计算。在这些模型中，安全非交互式还原（SNIR）的研究正式化了一种经典相关性何时可以非交互式地转换为另一种相关性，同时保证基于信息论模拟的隐私。在这项工作中，我们引入了量子安全非交互约简（QSNIR），这是 SNIR 的自然扩展，其中源资源和目标资源都是二分量子态。具体来说，当目标资源是经典资源时，除了经典资源之外，我们的框架使我们能够分析从纠缠中传播私人相关性的问题。我们的主要技术成果是，在这种情况下，QSNIR 隐私可以通过半定程序 (SDP) 对进行精确计算，该对可以量化源于基于模拟的作弊优势的操作错误。\n\n我们证明 QSNIR 隐私受到与最小错误状态辨别 (MED) 相关的决策问题的下界，并使用这两个定义来计算通用双方计算 (2PC) 预处理相关性的精确一次性隐私错误。", "authors": [{"name": "Maxwell Gold"}, {"name": "Sarah Hagen"}, {"name": "Daniel Alabi"}, {"name": "Eric Chitambar"}], "featured_authors": [{"name": "Maxwell Gold"}, {"name": "Sarah Hagen"}, {"name": "Daniel Alabi"}, {"name": "Eric Chitambar"}], "author_count": 4}, {"id": "2609.38513", "category": "quant-ph", "title": "Copy-scarce learning of ground states", "abstract": "Probing multiple properties of ground states is central to understanding quantum matter, yet conventional readout can be prohibitively costly because it consumes many independently prepared copies. Here, in copy-scarce regimes, we establish optimal trade-offs between the number of initial ground-state copies and elapsed Hamiltonian-evolution time required for estimating multiple observables or reconstructing a full classical description of a unique gapped ground state. We derive a unifying inequality that quantifies how well ground states can be distinguished using initial copies and controlled dynamics, even when all copies may be consumed. It yields worst-case lower bounds on elapsed Hamiltonian time that any protocol must incur to perform either task. We construct parallel catalytic readouts that return all initial copies nearly unchanged while attaining these bounds up to poly-logarithmic factors. Our protocols require no coherent preparation circuit or its inverse, and their elapsed Hamiltonian time depends only logarithmically on the inverse of the desired return error. Thus, optimal copy--dynamics trade-offs can be attained together with catalytic return. Numerical benchmarks further show substantial reductions in end-to-end elapsed Hamiltonian time relative to a task-specialized copy-consuming protocol, even under an optimistic preparation-cost model. Our results reveal a copy--dynamics resource landscape connecting copy-scarce learning to copy-only endpoints realized by known protocols for shadow tomography and pure-state tomography.", "url": "https://arxiv.org/abs/2609.38513", "type": "理论+数值", "summary": "探测基态的多种属性是理解量子物质的核心，但传统的读出成本可能过高，因为它消耗了许多独立准备的副本。在这里，在副本稀缺的情况下，我们在初始基态副本的数量和估计多个可观测值或重建唯一有间隙基态的完整经典描述所需的哈密顿演化时间之间建立了最佳权衡。我们推导出一个统一的不等式，它量化了使用初始副本和受控动力学区分基态的能力，即使所有副本都可能被消耗。它产生了任何协议执行任一任务所必须花费的哈密顿时间的最坏情况下限。我们构建了并行催化读数，它返回几乎不变的所有初始副本，同时达到多对数因子的这些界限。我们的协议不需要相干准备电路或其逆，并且它们经过的哈密顿时间仅以对数方式取决于所需返回误差的倒数。因此，可以实现最佳的复制-动力学权衡以及催化回报。\n\n数值基准进一步显示，即使在乐观的准备成本模型下，相对于任务专用的复制消耗协议，端到端经过的哈密顿时间也大幅减少。我们的结果揭示了一个复制-动态资源景观，将复制稀缺学习与已知的阴影断层扫描和纯状态断层扫描协议实现的仅复制端点连接起来。", "authors": [{"name": "Kaito Wada"}, {"name": "Nobuyuki Yoshioka"}], "featured_authors": [{"name": "Kaito Wada"}, {"name": "Nobuyuki Yoshioka"}], "author_count": 2}, {"id": "2609.38576", "category": "quant-ph", "title": "Normal-ordered perturbative expansion for matter systems interacting with continuous-mode quantum photon fields", "abstract": "We develop a normal-ordered perturbative expansion method to compute the reduced dynamics of a matter system interacting with a general continuous-mode photon field state. In this expansion, all field correlation functions are automatically normal-ordered, while the free evolution is modified by spontaneous emission. Our normal-ordered expansion elucidates the physical meaning of non-normal-ordered correlation terms in the conventional expansion. Furthermore, under intermediate coupling strengths, the normal-ordered expansion converges significantly faster than the conventional expansion, allowing one to extend the applicability of perturbative expansion to much larger matter-light coupling strengths. Interestingly, given an $m$-photon Fock state input, the normal-ordered expansion truncates exactly at the $2m$-th order. For special classes of input states, we show the normal-ordered expansion is consistent with the corresponding master equations. We demonstrate the normal-ordered expansion numerically for a two-level system interacting with coherent state, $m$-photon Fock state, and cat state inputs.", "url": "https://arxiv.org/abs/2609.38576", "type": "理论+数值", "summary": "我们开发了一种正序微扰展开方法来计算与一般连续模式光子场状态相互作用的物质系统的简化动力学。在此展开中，所有场相关函数均自动正常排序，而自由演化则通过自发发射进行修改。我们的正序展开式阐明了常规展开式中非正序相关项的物理意义。此外，在中等耦合强度下，正序展开式的收敛速度明显快于传统展开式，从而允许将微扰展开式的适用性扩展到更大的物质-光耦合强度。有趣的是，给定 $m$ 光子 Fock 状态输入，正序展开正好在第 $2m$ 阶处截断。对于特殊类别的输入状态，我们表明正常有序展开与相应的主方程一致。我们以数值方式演示了与相干态、$m$-光子 Fock 态和 cat 态输入相互作用的两级系统的正序展开。", "authors": [{"name": "Liwen Ko"}, {"name": "Robert L. Cook"}, {"name": "K. Birgitta Whaley"}], "featured_authors": [{"name": "Liwen Ko"}, {"name": "Robert L. Cook"}, {"name": "K. Birgitta Whaley"}], "author_count": 3}, {"id": "2609.38678", "category": "quant-ph", "title": "Exponential separation in sensing continuous signals via squeezing", "abstract": "Quantum sensing traditionally focuses on using quantum resources such as squeezing and entanglement to improve precision for sensing fixed signals. However, in many applications such as gravitational-wave detection and electromagnetic-field sensing, the signal evolves continuously and varies through time. Additionally, the learner is free to prepare, control, and measure the sensor at arbitrary times, possibly chosen adaptively. In this work, we establish exponential separation in sensing time for continuously evolving signals due to the available squeezing. The signals we study are characterized by a pattern size $T$, and we find that a sensor with squeezing at least $\\omega(\\sqrt{\\log T})$ offers a $\\mathrm{poly}(T)$ sensing time, whereas those with squeezing at most $o(\\sqrt{\\log T})$ must use an exponential sensing time in $T$.", "url": "https://arxiv.org/abs/2609.38678", "type": "理论", "summary": "量子传感传统上侧重于利用量子资源（例如挤压和纠缠）来提高固定信号传感的精度。然而，在引力波探测和电磁场传感等许多应用中，信号不断演变并随时间变化。此外，学习者可以在任意时间自由准备、控制和测量传感器，可能是自适应选择的。在这项工作中，由于可用的挤压，我们在传感时间中为不断变化的信号建立了指数分离。我们研究的信号以模式大小 $T$ 为特征，我们发现至少挤压 $\\omega(\\sqrt{\\log T})$ 的传感器提供 $\\mathrm{poly}(T)$ 传感时间，而那些挤压最多 $o(\\sqrt{\\log T})$ 的传感器必须使用 $T$ 中的指数传感时间。", "authors": [{"name": "Francesco Anna Mele"}, {"name": "Nadine Meister"}, {"name": "Haimeng Zhao"}, {"name": "Senrui Chen"}, {"name": "Hsin-Yuan Huang"}], "featured_authors": [{"name": "Francesco Anna Mele"}, {"name": "Nadine Meister"}, {"name": "Haimeng Zhao"}, {"name": "Senrui Chen"}, {"name": "Hsin-Yuan Huang"}], "author_count": 5}, {"id": "2609.38704", "category": "quant-ph", "title": "A Separation Between Types of Quantum Oracle Separations", "abstract": "Recent works have demonstrated that quantum oracles have subtle behavior, as access to inverse, conjugate or controlled queries can exponentially change the query complexity of certain tasks. Inspired by these works, we introduce the notion of meta-complexity of quantum relativization. We ask: for any two quantum complexity classes, under which \"types\" of quantum oracles are they equal or separated? Different pantheons of oracles (or quantum oracle types, e.g. unitary vs state, poly- vs superpoly-dimensional, closed under inverse or not) form a partially ordered set based on their power in separating complexity classes. Moreover, two oracle pantheons A and B are separated if there exists a pair of complexity classes that are separated under an oracle from pantheon A but yet the complexity classes are equivalent under all oracles from pantheon B. We show that this meta-complexity can be nontrivial by giving a complete classification, within the family of oracle pantheons defined in this paper, of which models can separate the complexity classes $\\mathsf{PostBQP}$ and $\\mathsf{PreciseBQP}$, the exponentially precise variant of $\\mathsf{BQP}$. Both classes equal $\\mathsf{PP}$ in the unrelativized setting. Within our taxonomy, they remain equal relative to real or polynomial-dimensional unitary oracles and whenever inverse or conjugate access is supplied. In contrast, we give a separation relative to forward-only complex diagonal unitaries of superpolynomial dimension, as well as a separation relative to single-qubit state-preparation oracles. We view this as a test case for the meta-complexity of oracles which underscores the subtlety inherent to the relativization of quantum complexity classes.", "url": "https://arxiv.org/abs/2609.38704", "type": "理论", "summary": "最近的研究表明，量子预言机具有微妙的行为，因为访问逆向、共轭或受控查询可以呈指数级改变某些任务的查询复杂性。受这些工作的启发，我们引入了量子相对化的元复杂性的概念。我们问：对于任何两个量子复杂性类别，在哪种量子预言“类型”下它们是相等或分离的？不同的预言机万神殿（或量子预言机类型，例如一元与状态、多维与超多维、逆向或非逆向封闭）根据其分离复杂性类别的能力形成部分有序集。此外，如果存在一对在万神殿 A 的预言下分离的复杂性类别，但复杂性类别在万神殿 B 的所有预言下是等效的，则两个预言万神殿 A 和 B 是分离的。我们通过在本文定义的预言万神殿家族中给出完整的分类来证明这种元复杂性可以是不平凡的，其中模型可以分离复杂性类别 $\\mathsf{PostBQP}$ 和$\\mathsf{PreciseBQP}$，$\\mathsf{BQP}$ 的指数精确变体。\n\n在非相对化设置中，这两个类都等于 $\\mathsf{PP}$。在我们的分类法中，无论何时提供逆或共轭访问，它们相对于实数或多项式维酉预言保持相等。相比之下，我们给出了相对于超多项式维数的仅前向复对角幺正的分离，以及相对于单量子位状态准备预言的分离。我们将其视为预言机元复杂性的测试用例，它强调了量子复杂性类别相对化固有的微妙性。", "authors": [{"name": "Scott Aaronson"}, {"name": "Adam Bouland"}, {"name": "Jordan Docter"}, {"name": "Barak Nehoran"}], "featured_authors": [{"name": "Scott Aaronson"}, {"name": "Adam Bouland"}, {"name": "Jordan Docter"}, {"name": "Barak Nehoran"}], "author_count": 4}, {"id": "2609.38720", "category": "quant-ph", "title": "Does the Readout Bypass Leak the Input? A Feature-Visibility Audit of Hybrid Quantum-Classical Models", "abstract": "Readout-side residual hybrids concatenate raw inputs with measured quantum features. Under single-example gradient sharing, a biased first linear layer admits standard analytic recovery of its input, so the bypass exposes raw coordinates without requiring inversion of the quantum circuit. We audit this mechanism using two tabular datasets, four architectures, and metrics conditioned on feature visibility. Iterative gradient matching gives median full-record PSNR of 73-96 dB for residual and input-only heads. Quantum-only heads score 8-11 dB on the full record but 54-96 dB on the six input coordinates they actually encode. These are reconstruction results for the tested six-input, six-observable circuits, not a general statement about quantum encodings. A loss-threshold membership attack remains near chance. The contribution is a visibility-conditioned privacy audit: omitted coordinates must not be credited as protection supplied by quantum processing, and near-exact PSNR differences must not be interpreted as meaningful privacy rankings. Our findings concern individual gradients and do not establish leakage under aggregation or multiple local training steps.", "url": "https://arxiv.org/abs/2609.38720", "type": "理论", "summary": "读出端残差混合将原始输入与测量的量子特征连接起来。在单示例梯度共享下，偏置的第一线性层允许对其输入进行标准分析恢复，因此旁路暴露原始坐标，而不需要量子电路的反转。我们使用两个表格数据集、四种架构和以功能可见性为条件的指标来审核此机制。迭代梯度匹配为剩余磁头和仅输入磁头提供了 73-96 dB 的中值全记录 PSNR。仅量子头在完整记录上得分为 8-11 dB，但在它们实际编码的六个输入坐标上得分为 54-96 dB。这些是经过测试的六输入、六可观察电路的重建结果，而不是关于量子编码的一般性陈述。损失阈值会员攻击仍然很可能发生。贡献是可见性条件的隐私审计：遗漏的坐标不得被视为量子处理提供的保护，并且近乎精确的 PSNR 差异不得被解释为有意义的隐私排名。我们的研究结果涉及个体梯度，并且没有在聚合或多个本地训练步骤下建立泄漏。", "authors": [{"name": "Guilin Zhang"}, {"name": "Kai Zhao"}, {"name": "Xiquan Cui"}, {"name": "Henry Heng"}, {"name": "Xu Chu"}, {"name": "Aletta Johanna Blanken"}], "featured_authors": [{"name": "Guilin Zhang"}, {"name": "Kai Zhao"}, {"name": "Xiquan Cui"}, {"name": "Henry Heng"}, {"name": "Xu Chu"}, {"name": "Aletta Johanna Blanken"}], "author_count": 6}, {"id": "2609.38724", "category": "quant-ph", "title": "Ergotropy from energetic coherence and the third law of thermodynamics", "abstract": "We study the ergotropy and the thermodynamic potentials of a qubit battery charged by repeated interactions with clusters of thermal ancillas, qubits or oscillators, through a composite system-bath coupling that generates steady-state coherence in the energy basis. A single parameter encoding the bath quantum statistics yields the coherence and ergotropy in closed form for any cluster size. For large clusters, the ergotropy becomes independent of the bath statistics and, at optimal couplings, reaches a universal fraction of the equilibrium internal energy of the qubit at the bath temperature. Since the charged state has no population inversion, all extractable work comes from coherence. The ergotropy is flat at low temperatures. We trace this plateau to the third law, and show that the ergotropy is proportional to the equilibrium enthalpy of the qubit, whose slope vanishes with the heat capacity. For a battery composed of multiple qubits, the coherence grows exponentially with the number of qubits while the ergotropy grows linearly, both remaining a nearly constant fraction of their respective maxima. The charged state is a non-equilibrium steady state with finite entropy at zero temperature, sustained by the work of switching the collisional interaction on and off. The cost is nonzero whenever the parallel coupling is nonzero, and, unlike the ergotropy, it depends on the bath statistics.", "url": "https://arxiv.org/abs/2609.38724", "type": "理论", "summary": "我们研究了量子位电池的各向异性和热力学势，该电池通过与热辅助装置、量子位或振荡器簇的重复相互作用进行充电，通过复合系统-浴耦合在能量基础上产生稳态相干性。编码浴量子统计的单个参数可以产生任何簇大小的闭合形式的相干性和各向异性。对于大型簇，各向异性变得与浴统计无关，并且在最佳耦合下，达到浴温度下量子位平衡内能的通用分数。由于带电态没有粒子数反转，所有可提取的工作都来自相干性。在低温下，各向异性是平坦的。我们将这个平台追溯到第三定律，并证明了各向异性与量子位的平衡焓成正比，其斜率随着热容量而消失。对于由多个量子位组成的电池，相干性随着量子位数量呈指数增长，而各向异性呈线性增长，两者都保持各自最大值的几乎恒定分数。\n\n带电状态是零温度下具有有限熵的非平衡稳态，通过打开和关闭碰撞相互作用的工作来维持。只要并联耦合非零，成本就非零，并且与各向异性不同，它取决于浴统计数据。", "authors": [{"name": "O. S. Yáñez-Soria"}, {"name": "G. Guarnieri"}, {"name": "B. Çakmak"}, {"name": "R. Román-Ancheyta"}], "featured_authors": [{"name": "O. S. Yáñez-Soria"}, {"name": "G. Guarnieri"}, {"name": "B. Çakmak"}, {"name": "R. Román-Ancheyta"}], "author_count": 4}, {"id": "2609.38734", "category": "quant-ph", "title": "Exact Diagonal Completion on Reachable Subspaces: Application to QAOA Placement", "abstract": "Unused encoding states offer opportunities to simplify quantum circuits. For algorithms restricted to reachable subspaces, unspecified diagonal-operator entries can be optimized without changing ideal computation. We investigate exact diagonal completion for the quantum approximate optimization algorithm (QAOA) applied to placement, using permutation-preserving register swaps. We construct exact Manhattan-distance operators through weighted-$\\ell_1$ optimization of Walsh coefficients and a sparse recurrence requiring $O(\\sqrt{m})$ terms on balanced rectangles, avoiding $O(m^4)$ dense constraint storage. Across 160 geometries, weighted-$\\ell_1$ completion reduces controlled-NOT (CX) counts relative to four alternative extensions in all 96 cases with unused binary codes under Gray-code synthesis. On an independently specified 60-case cohort, median reductions relative to virtual-coordinate extension are 28.0\\%, 53.9\\%, and 21.6\\% at six, nine, and twelve sites. Under generic diagonal synthesis, reductions decrease to 10.9\\%, 1.3\\%, and 0.7\\%, demonstrating compiler dependence. Additional ancillas reduce mixer serialization, but token circuits remain deeper than one-hot baselines. Ideal placement simulations show baseline-dependent solution quality, with classical search performing better. OpenROAD integration takes 72 QAOA and 216 classical placements across six RTL designs through clock-tree synthesis and global routing with zero overflow. Completion improves phase construction; no end-to-end advantage is established.", "url": "https://arxiv.org/abs/2609.38734", "type": "数值", "summary": "未使用的编码状态提供了简化量子电路的机会。对于仅限于可达子空间的算法，可以在不改变理想计算的情况下优化未指定的对角运算符条目。我们使用保留排列的寄存器交换来研究应用于布局的量子近似优化算法（QAOA）的精确对角完成。我们通过 Walsh 系数的加权 $\\ell_1$ 优化和平衡矩形上需要 $O(\\sqrt{m})$ 项的稀疏递归来构建精确的曼哈顿距离运算符，避免 $O(m^4)$ 密集约束存储。在 160 个几何结构中，加权 $\\ell_1$ 补全相对于格雷码合成下未使用的二进制代码的所有 96 种情况中的四种替代扩展减少了受控非 (CX) 计数。在一个独立指定的 60 个病例队列中，在 6 个、9 个和 12 个站点上，相对于虚拟坐标延伸的中位减少分别为 28.0%、53.9% 和 21.6%。在通用对角综合下，减少量减少至 10.9\\%、1.3\\% 和 0.7\\%，证明了编译器依赖性。额外的辅助设备减少了混频器序列化，但令牌电路仍然比单热基线更深。\n\n理想的布局模拟显示了依赖于基线的解决方案质量，经典搜索表现更好。 OpenROAD 集成通过时钟树综合和零溢出的全局布线，在六个 RTL 设计中采用 72 个 QAOA 和 216 个经典布局。竣工改善了阶段建设；没有建立端到端的优势。", "authors": [{"name": "Owen Friedewald"}, {"name": "Ali Shiri Sichani"}, {"name": "Chi-Ren Shyu"}], "featured_authors": [{"name": "Owen Friedewald"}, {"name": "Ali Shiri Sichani"}, {"name": "Chi-Ren Shyu"}], "author_count": 3}, {"id": "2609.38736", "category": "quant-ph", "title": "Quantum Query Complexity for List Search", "abstract": "Searching in a linked list is one of the most basic problems in classical algorithms. Although the nodes of the list come with memory addresses, classically those addresses play no role in the cost of search: one simply starts at the head and follows successor pointers to search for an element. In this paper, we show that the quantum setting is different. Here, the ambient address space from which the list vertices are drawn can itself affect the query complexity. We study the following problem analogous to search in a linked list in the query complexity model: the input consists of an address universe $[N]$, a public start symbol $s$, a successor oracle $f$ whose non-$\\perp$ values trace a hidden simple path $s \\to a_1 \\to a_2 \\to \\cdots \\to a_\\ell \\to \\perp$, and a marking oracle $g$ that marks at most one list vertex. The task is to decide whether the list contains a marked vertex. We prove that both the decision and search versions of this problem for all $N \\ge \\ell \\ge 1$ have quantum query complexity $\\Theta\\!\\bigl(\\min\\{\\ell,(N\\ell)^{1/4}\\}\\bigr)$. Thus, quite surprisingly, when $N < \\ell^3$ the optimal quantum complexity is $(N\\ell)^{1/4}$, which is strictly smaller than the $\\Theta(\\ell)$ cost of ordinary linked-list traversal. This gives a precise characterization of when the ambient address space yields a genuine quantum advantage for linked-list search. We extend our results and give the same tight asymptotic bounds for the natural double linked-list version as well.", "url": "https://arxiv.org/abs/2609.38736", "type": "理论+数值", "summary": "链表搜索是经典算法中最基本的问题之一。尽管列表的节点带有内存地址，但通常这些地址在搜索成本中不起任何作用：只需从头部开始并跟随后继指针来搜索元素。在本文中，我们证明了量子设置是不同的。这里，从中绘制列表顶点的环境地址空间本身可以影响查询复杂性。我们研究类似于查询复杂性模型中链表中的搜索的以下问题：输入由地址域 $[N]$、公共起始符号 $s$、其非 $\\perp$ 值跟踪隐藏简单路径 $s \\to a_1 \\to a_2 \\to \\cdots \\to a_\\ell \\to \\perp$ 的后继预言机 $f$ 以及最多标记一个列表顶点的标记预言机 $g$ 组成。任务是确定列表中是否包含标记的顶点。我们证明这个问题的决策和搜索版本对于所有 $N \\ge \\ell \\ge 1$ 都具有量子查询复杂度 $\\Theta\\!\\bigl(\\min\\{\\ell,(N\\ell)^{1/4}\\}\\bigr)$。\n\n因此，令人惊讶的是，当 $N < \\ell^3$ 时，最佳量子复杂度为 $(N\\ell)^{1/4}$，这严格小于普通链表遍历的 $\\Theta(\\ell)$ 成本。这给出了环境地址空间何时为链表搜索产生真正的量子优势的精确特征。我们扩展了我们的结果，并为自然双链表版本给出了相同的严格渐近界限。", "authors": [{"name": "Niranka Banerjee"}, {"name": "Akinori Kawachi"}], "featured_authors": [{"name": "Niranka Banerjee"}, {"name": "Akinori Kawachi"}], "author_count": 2}, {"id": "2609.38751", "category": "quant-ph", "title": "The Generalized Semi-Clifford Conjecture Holds at Level 4", "abstract": "The Clifford hierarchy $\\mathsf{C}_1 \\subset \\mathsf{C}_2 \\subset \\cdots$ was introduced by Gottesman and Chuang ( arXiv:quant-ph/9908010 ) to characterize gates that admit fault-tolerant implementation by gate teleportation. Yet, despite its rich mathematical structure and the attention it has received in recent years, little is known about $\\mathsf{C}_k$ for $k > 3$. Most progress has focused on identifying structural properties of restrictions of the hierarchy, such as diagonal gates and gates on systems of small dimension $d$ or with few qudits. The generalized semi-Clifford conjecture, proposed by Zeng et al. ( arXiv:0712.2084 ), states that every gate in $\\cup_k \\mathsf{C}_k$ is, up to multiplication by Cliffords, the product of a permutation and a diagonal matrix. Beigi and Shor proved the case $d=2$, $k=3$ ( arXiv:0810.5108 ) and Pllaha et al. found an alternative proof by exploiting fixed points of the conjugation map induced by (a Clifford correction of) $U \\in \\mathsf{C}_3$ on the span of maximal stabilizer subgroups ( arXiv:2006.14040 ). By extending their fixed-point arguments to the group $\\Gamma_1(U)$ generated by $U \\mathsf{P} U^\\dagger$ and beyond, we prove the conjecture for $k \\leq 4$ and any prime dimension $d$. Our proof centers on conjugation groups $\\Gamma_1(U), \\Gamma_2(U), \\ldots$ of $U \\in \\mathsf{C}_k$, which we expect to be a useful tool in the study of the Clifford hierarchy more generally. We also show a natural sufficient condition on such groups for gates in higher levels to be generalized semi-Clifford.", "url": "https://arxiv.org/abs/2609.38751", "type": "理论", "summary": "Clifford 层次结构 $\\mathsf{C}_1 \\subset \\mathsf{C}_2 \\subset \\cdots$ 由 Gottesman 和 Chuang ( arXiv:quant-ph/9908010 ) 引入，用于表征通过门隐形传态实现容错的门。然而，尽管 $\\mathsf{C}_k$ 具有丰富的数学结构并近年来受到了关注，但人们对 $\\mathsf{C}_k$ ($k > 3$) 知之甚少。大多数进展都集中在识别层次结构限制的结构属性，例如对角门和小维度 $d$ 或很少 qudits 系统上的门。 Zeng 等人提出的广义半克利福德猜想。 ( arXiv:0712.2084 )，指出 $\\cup_k \\mathsf{C}_k$ 中的每个门，直到与 Cliffords 相乘，都是置换和对角矩阵的乘积。 Beigi 和 Shor 证明了 $d=2$、$k=3$ ( arXiv:0810.5108 ) 和 Pllaha 等人的情况。通过利用最大稳定子组跨度上的 $U \\in \\mathsf{C}_3$ （克利福德校正）引起的共轭图的固定点找到了替代证明（ arXiv:2006.14040 ）。\n\n通过将它们的定点参数扩展到 $U \\mathsf{P} U^\\dagger$ 生成的群 $\\Gamma_1(U)$ 及以上，我们证明了 $k \\leq 4$ 和任何素数维度 $d$ 的猜想。我们的证明集中在 $U \\in \\mathsf{C}_k$ 的共轭群 $\\Gamma_1(U)、\\Gamma_2(U)、\\ldots$ 上，我们期望它成为更广泛地研究 Clifford 层次结构的有用工具。我们还展示了此类群体的自然充分条件，使更高级别的门成为广义的半 Clifford。", "authors": [{"name": "Maxwell Marcus"}, {"name": "Sathyawageeswar Subramanian"}, {"name": "Marcel Dall'Agnol"}], "featured_authors": [{"name": "Maxwell Marcus"}, {"name": "Sathyawageeswar Subramanian"}, {"name": "Marcel Dall'Agnol"}], "author_count": 3}, {"id": "2609.38770", "category": "quant-ph", "title": "Rayleigh-Wood Threshold Controls Nonlinear Photon Correlations in Atomic Arrays", "abstract": "Two-dimensional atomic arrays provide versatile free-space quantum optical interfaces by coupling photons to collective lattice modes. Here we show that the Rayleigh--Wood anomaly provides a sharp control mechanism for both linear and nonlinear photon scattering from a single atomic layer. As the lattice spacing crosses the diffraction threshold, newly opened radiative channels rapidly broaden the dominant collective modes, converting specular reflection into diffuse off-axis scattering. In transmission, momentum-space Fano interference between the incident and collectively scattered fields produces single-photon intensity zeros that strongly reshape the momentum-space correlation pattern. An integrated nonlinear contrast reveals a pronounced channel asymmetry: upon opening the Rayleigh channels, the connected two-photon contribution drops by several orders of magnitude relative to the factorized background in transmission, while remaining close to unity in reflection. These results establish radiative diffraction thresholds as a control principle for quantum nonlinear optics in single-layer atomic arrays.", "url": "https://arxiv.org/abs/2609.38770", "type": "理论", "summary": "二维原子阵列通过将光子耦合到集体晶格模式来提供通用的自由空间量子光学接口。在这里，我们证明瑞利-伍德异常为单原子层的线性和非线性光子散射提供了一种清晰的控制机制。当晶格间距超过衍射阈值时，新打开的辐射通道迅速展宽主要的集体模式，将镜面反射转换为漫射离轴散射。在传输过程中，入射场和集体散射场之间的动量空间法诺干涉会产生单光子强度零，从而强烈重塑动量空间相关模式。积分非线性对比度揭示了明显的通道不对称性：打开瑞利通道后，连接的双光子贡献相对于传输中的因式分解背景下降了几个数量级，而反射中保持接近一致。这些结果确立了辐射衍射阈值作为单层原子阵列中量子非线性光学的控制原理。", "authors": [{"name": "Zai-Cheng Xiao"}, {"name": "Li-Ping Yang"}], "featured_authors": [{"name": "Zai-Cheng Xiao"}, {"name": "Li-Ping Yang"}], "author_count": 2}, {"id": "2609.38835", "category": "quant-ph", "title": "Average-and Last-Iterate Lower Bounds for Optimistic Matrix Mirror-Prox in Quantum Zero-Sum Games", "abstract": "Optimistic matrix mirror-prox (OMMP) computes $\\epsilon$-approximate Nash equilibria in quantum zero-sum games with an $O(1/\\varepsilon)$ average-iterate guarantee [ arXiv:2311.10859 ]. We investigate whether this dependence on accuracy is tight and whether geometric last-iterate convergence can be guaranteed. We study these questions through explicit games with one qubit per player. First, we prove an $\\Omega(1/\\varepsilon)$ lower bound for the uniform-average output that includes the maximally mixed initial state, independently of the regularizer and step size. Second, we construct a fixed game on which optimistic gradient descent-ascent (OGDA), initialized at the maximally mixed state, has last-iterate Frobenius distance to equilibrium $\\Theta(1/t)$ and duality gap $\\Theta(1/t^3)$ for every sufficiently small fixed step size. A separate fixed game exhibits arbitrarily long delays in reducing the initial error by a constant factor across a family of initial states. Finally, we give a fixed game with a unique, strictly complementary equilibrium on which optimistic matrix multiplicative weights updates (OMMWU) converge only polynomially from the maximally mixed state for every fixed positive step size. The last-iterate Frobenius distance and quantum relative entropy from the equilibrium to the iterates decay as $\\Theta(1/t)$, while the duality gap decays as $\\Theta(1/t^2)$.", "url": "https://arxiv.org/abs/2609.38835", "type": "理论", "summary": "乐观矩阵镜像近似 (OMMP) 计算量子零和游戏中的 $\\epsilon$ 近似纳什均衡，具有 $O(1/\\varepsilon)$ 平均迭代保证 [ arXiv:2311.10859 ]。我们研究这种对精度的依赖是否紧密以及是否可以保证几何最后迭代收敛。我们通过每个玩家一个量子比特的显式游戏来研究这些问题。首先，我们证明均匀平均输出的 $\\Omega(1/\\varepsilon)$ 下界，其中包括最大混合初始状态，与正则化器和步长无关。其次，我们构造一个固定博弈，其中乐观梯度下降-上升（OGDA）在最大混合状态下初始化，对于每个足够小的固定步长，最后迭代的弗罗贝尼乌斯距离均衡 $\\Theta(1/t)$ 和对偶间隙 $\\Theta(1/t^3)$ 。一个单独的固定游戏在通过一系列初始状态中的常数因子减少初始误差时表现出任意长的延迟。\n\n最后，我们给出了一个具有独特的、严格互补的平衡的固定游戏，在该平衡上，对于每个固定的正步长，乐观矩阵乘法权重更新（OMMWU）仅从最大混合状态多项式收敛。最后迭代的弗罗贝尼乌斯距离和从平衡到迭代的量子相对熵衰减为 $\\Theta(1/t)$，而对偶间隙衰减为 $\\Theta(1/t^2)$。", "authors": [{"name": "Yiheng Su"}, {"name": "Emmanouil-Vasileios Vlatakis-Gkaragkounis"}, {"name": "Pucheng Xiong"}], "featured_authors": [{"name": "Yiheng Su"}, {"name": "Emmanouil-Vasileios Vlatakis-Gkaragkounis"}, {"name": "Pucheng Xiong"}], "author_count": 3}, {"id": "2609.38892", "category": "quant-ph", "title": "Optical studies of negative g-factor dopants in an antiferromagnet: Nd:GdVO$_4$", "abstract": "Neodymium-doped gadolinium vanadate (Nd:GdVO$_4$) is a popular laser material at room temperature. It has received limited attention for quantum technologies because of the linebroadening effects of disordered gadolinium spins in the host. Here we investigate the optical properties at temperatures below the 2.5 K Néel temperature, revealing narrow optical transitions. We demonstrate that rare earth ions in magnetic hosts give us a new way of observing the signs of magnetic g-factors. The interplay between the exchange and Zeeman interactions means that we see clear evidence of negative g-factors. These results provide a detailed spectroscopic foundation for Nd:GdVO$_4$ and expand the understanding of its candidacy as a material for hybrid quantum systems.", "url": "https://arxiv.org/abs/2609.38892", "type": "理论", "summary": "掺钕钒酸钆（Nd:GdVO$_4$）是一种流行的室温激光材料。由于主体中无序钆自旋的线展宽效应，它在量子技术方面受到的关注有限。在这里，我们研究了低于 2.5 K 尼尔温度的光学特性，揭示了窄光学跃迁。我们证明磁性主体中的稀土离子为我们提供了一种观察磁性 g 因子迹象的新方法。交换和塞曼相互作用之间的相互作用意味着我们看到了负 g 因子的明显证据。这些结果为 Nd:GdVO$_4$ 提供了详细的光谱基础，并扩大了对其作为混合量子系统材料候选资格的理解。", "authors": [{"name": "Lachlan W. Cronin"}, {"name": "Masaya Hiraishi"}, {"name": "Luke S. Trainor"}, {"name": "Jevon J. Longdell"}], "featured_authors": [{"name": "Lachlan W. Cronin"}, {"name": "Masaya Hiraishi"}, {"name": "Luke S. Trainor"}, {"name": "Jevon J. Longdell"}], "author_count": 4}, {"id": "2609.38894", "category": "quant-ph", "title": "Quantum Time-Lock Puzzles in the Quantum Random Oracle Model", "abstract": "A time-lock puzzle allows a sender to hide a message in a puzzle such that recovering the message requires substantially more sequential computation than the time required to generate the puzzle, even when parallel computation is allowed. Applications of time-lock puzzles include timed-release encryption, sealed-bid auctions, electronic voting, fair contract signing, coin flipping, and Byzantine consensus. However, time-lock puzzles are known to be impossible in the classical random oracle model. To overcome the classical barrier, in this work we consider quantum time-lock puzzles, in which the puzzle itself is a quantum state. Our construction in the quantum random oracle model achieves generation in one oracle round, solving in at most $T$ oracle rounds, and security against polynomial-width quantum adversaries of depth $o(T)$ for every polynomially bounded delay $T=T(\\lambda)$, resolving an open problem posed by Mahmoody, Moran, and Vadhan (2011).", "url": "https://arxiv.org/abs/2609.38894", "type": "理论", "summary": "时间锁定谜题允许发送者将消息隐藏在谜题中，使得恢复消息需要比生成谜题所需的时间多得多的顺序计算，即使允许并行计算也是如此。时间锁谜题的应用包括定时释放加密、密封投标拍卖、电子投票、公平合同签署、抛硬币和拜占庭共识。然而，已知时间锁定难题在经典随机预言模型中是不可能的。为了克服经典障碍，在这项工作中，我们考虑量子时间锁定谜题，其中谜题本身就是一个量子态。我们在量子随机预言模型中的构建实现了在一次预言轮中生成，最多解决 $T$ 预言轮，并且针对每个多项式有界延迟 $T=T(\\lambda)$ 对抗深度 $o(T)$ 的多项式宽度量子对手，解决了 Mahmoody、Moran 和 Vadhan (2011) 提出的开放问题。", "authors": [{"name": "Prabhanjan Ananth"}, {"name": "Yao-Ting Lin"}], "featured_authors": [{"name": "Prabhanjan Ananth"}, {"name": "Yao-Ting Lin"}], "author_count": 2}, {"id": "2609.38941", "category": "quant-ph", "title": "Tight Parallel Repetition for Private-Coin Arguments", "abstract": "We show that assuming the existence of homomorphic encryption, parallel repetition of all interactive arguments (after being run under homomorphic encryption) reduces the soundness error at a tight exponential rate even in the post-quantum setting. Moreover, we generalize this result to hold for threshold verifiers, where the parallel repeated verifier accepts if and only if at least $t$ of the executions are accepted (for some threshold $t$). Prior to this work, these results were known only when the cheating prover was assumed to be classical, and it was not known how to achieve tight bounds. As a corollary, we construct the first constant-round succinct argument for $\\mathsf{QMA}$ with negligible completeness and soundness errors assuming only the existence of quantum homomorphic encryption.", "url": "https://arxiv.org/abs/2609.38941", "type": "理论", "summary": "我们证明，假设存在同态加密，所有交互参数的并行重复（在同态加密下运行之后）即使在后量子环境中也能以严格的指数率减少稳健性误差。此外，我们将此结果推广到阈值验证器，其中并行重复验证器当且仅当至少接受 $t$ 的执行时才接受（对于某些阈值 $t$）。在这项工作之前，只有当作弊证明者被假设为经典时才知道这些结果，并且不知道如何实现紧界。作为推论，我们在假设仅存在量子同态加密的情况下，构造了 $\\mathsf{QMA}$ 的第一个常量轮简洁论证，其完整性和健全性误差可以忽略不计。", "authors": [{"name": "Zvika Brakerski"}, {"name": "Andrew Huang"}, {"name": "Yael Tauman Kalai"}, {"name": "Nicholas Spooner"}], "featured_authors": [{"name": "Zvika Brakerski"}, {"name": "Andrew Huang"}, {"name": "Yael Tauman Kalai"}, {"name": "Nicholas Spooner"}], "author_count": 4}, {"id": "2609.38943", "category": "quant-ph", "title": "Quantum-echo Markov process for combinatorial optimization", "abstract": "We introduce a quantum-echo Markov process for combinatorial optimization. Quantum dynamics based on quantum annealing (QA) or the quantum approximate optimization algorithm (QAOA) is used to engineer the transition kernel. Increasing the annealing time in QA or the number of layers in QAOA enables transitions to explore distant configurations while suppressing large energy changes. The Hamming-space delocalization originates from operator spreading, whereas the energy-space localization arises from a dynamically generated correlation. For optimization, we propose quantum-echo local optimization with and without greedy descent. We find that its performance is governed by the interplay between Hamming-space nonlocality and energy-space locality, and that excessive energy-space localization can degrade optimization performance. Incorporating greedy descent substantially improves the performance, highlighting the complementary roles of quantum dynamics for exploration and greedy descent for exploitation. These results establish quantum-echo dynamics as a framework for engineering structured transition kernels and provide a route to using finite-resource quantum many-body dynamics as a computational primitive for iterative optimization.", "url": "https://arxiv.org/abs/2609.38943", "type": "理论+数值", "summary": "我们引入了用于组合优化的量子回波马尔可夫过程。基于量子退火 (QA) 或量子近似优化算法 (QAOA) 的量子动力学用于设计转换内核。增加 QA 中的退火时间或 QAOA 中的层数可以使过渡探索遥远的配置，同时抑制大的能量变化。汉明空间离域源自算子扩展，而能量空间定位源自动态生成的相关性。对于优化，我们提出了具有和不具有贪婪下降的量子回波局部优化。我们发现它的性能受到汉明空间非局域性和能量空间局域性之间的相互作用的控制，并且过度的能量空间局域化会降低优化性能。结合贪婪下降大大提高了性能，突出了量子动力学对于探索和贪婪下降对于开发的互补作用。\n\n这些结果将量子回波动力学建立为工程结构化过渡内核的框架，并提供了使用有限资源量子多体动力学作为迭代优化的计算原语的途径。", "authors": [{"name": "Tatsuhiko Shirai"}], "featured_authors": [{"name": "Tatsuhiko Shirai"}], "author_count": 1}, {"id": "2609.38945", "category": "quant-ph", "title": "Certified Randomness with Optimal Rate", "abstract": "The generation of certified random bits is an emerging near-term application of quantum computers. Potential applications, such as randomness beacons and CRS generation, require nearly uniform randomness, whose rate (the ratio of min-entropy to bitlength) is ~ 1. However, existing protocols for certified randomness either produce weakly random strings with rate o(1), or they require a trusted random seed. We show how to certify randomness with the optimal rate ~ 1 without requiring any trusted randomness from the verifier. Our protocol is secure unconditionally in the quantum random oracle model (QROM). This improves the result of Coladangelo et al., who certified weakly random strings unconditionally in the QROM, and answers a question posed by Aaronson and Hung. We also define and construct a proof of conditional min-entropy, which certifies optimal min-entropy even conditioned on an adversarially chosen transcript. We show an application of this primitive to randomness beacons, where each pulse should have high min-entropy conditioned on all previous messages.", "url": "https://arxiv.org/abs/2609.38945", "type": "理论", "summary": "生成经过认证的随机位是量子计算机的一项新兴应用。潜在的应用，例如随机信标和 CRS 生成，需要几乎均匀的随机性，其速率（最小熵与位长的比率）约为 1。然而，现有的认证随机性协议要么产生速率为 o(1) 的弱随机字符串，要么需要可信的随机种子。我们展示了如何以最佳速率 ~ 1 来证明随机性，而不需要验证者提供任何可信随机性。我们的协议在量子随机预言模型（QROM）中是无条件安全的。这改进了 Coladangelo 等人的结果，他们在 QROM 中无条件地验证了弱随机字符串，并回答了 Aaronson 和 Hung 提出的问题。我们还定义并构建了条件最小熵的证明，即使以对抗性选择的转录本为条件，它也可以证明最佳的最小熵。我们展示了这种原语在随机信标中的应用，其中每个脉冲应该具有以所有先前消息为条件的高最小熵。", "authors": [{"name": "Siddhartha Jain"}, {"name": "Saachi Mutreja"}, {"name": "Bhaskar Roberts"}], "featured_authors": [{"name": "Siddhartha Jain"}, {"name": "Saachi Mutreja"}, {"name": "Bhaskar Roberts"}], "author_count": 3}, {"id": "2609.38957", "category": "quant-ph", "title": "The Commuting Local Hamiltonian Problem: Relativized Evidence Against BQP-Hardness", "abstract": "The commuting local-Hamiltonian (CLH) problem is a restriction of the local-Hamiltonian problem, in which the terms of the Hamiltonian are required to pairwise commute. A long line of work has shown that the problem lies in $\\mathsf{NP}$ for certain families of commuting local Hamiltonians. Nevertheless, there has been no formal evidence against the possibility that the general CLH problem is $\\mathsf{QMA}$-complete. CLH is complete for the complexity class $\\mathsf{QIMA}$, defined through quantum verifiers whose local gates commute. Therefore, CLH is $\\mathsf{QMA}$-complete if and only if $\\mathsf{QIMA}=\\mathsf{QMA}$. In this work, we introduce a classical-oracle analogue $\\mathsf{QIMA}^{\\mathcal{O}}$ and construct a classical oracle $\\mathcal{O}$ such that $\\mathsf{BQP}^{\\mathcal{O}}\\not\\subseteq\\mathsf{QIMA}^{\\mathcal{O}}$. Since $\\mathsf{BQP}^{\\mathcal{O}}\\subseteq\\mathsf{QMA}^{\\mathcal{O}}$ for any classical oracle $\\mathcal{O}$, this implies $\\mathsf{QIMA}^{\\mathcal{O}}\\neq\\mathsf{QMA}^{\\mathcal{O}}$ for our constructed oracle. Thus, our result provides relativized evidence against the possibility that the general commuting local-Hamiltonian problem is $\\mathsf{BQP}$-hard, and hence also against the possibility that it is $\\mathsf{QMA}$-complete.", "url": "https://arxiv.org/abs/2609.38957", "type": "理论", "summary": "交换局部哈密尔顿（CLH）问题是局部哈密尔顿问题的限制，其中哈密顿量的项需要成对交换。大量的工作表明，对于某些当地汉密尔顿通勤家庭来说，问题出在 $\\mathsf{NP}$ 上。尽管如此，还没有正式的证据表明一般 CLH 问题是 $\\mathsf{QMA}$ 完全的可能性。 CLH 对于复杂性类 $\\mathsf{QIMA}$ 来说是完整的，通过本地门交换的量子验证器定义。因此，当且仅当 $\\mathsf{QIMA}=\\mathsf{QMA}$ 时，CLH 是 $\\mathsf{QMA}$ 完备的。在这项工作中，我们引入了经典预言机$\\mathsf{QIMA}^{\\mathcal{O}}$并构造了经典预言机$\\mathcal{O}$，使得$\\mathsf{BQP}^{\\mathcal{O}}\\not\\subseteq\\mathsf{QIMA}^{\\mathcal{O}}$。由于 $\\mathsf{BQP}^{\\mathcal{O}}\\subseteq\\mathsf{QMA}^{\\mathcal{O}}$ 对于任何经典预言机 $\\mathcal{O}$，这意味着 $\\mathsf{QIMA}^{\\mathcal{O}}\\neq\\mathsf{QMA}^{\\mathcal{O}}$ 对于我们构建的预言机。\n\n因此，我们的结果提供了相对化的证据，反对一般通勤本地哈密尔顿问题是 $\\mathsf{BQP}$-hard 的可能性，因此也反对它是 $\\mathsf{QMA}$-complete 的可能性。", "authors": [{"name": "Itay Shalit"}, {"name": "Mark Zhandry"}], "featured_authors": [{"name": "Itay Shalit"}, {"name": "Mark Zhandry"}], "author_count": 2}, {"id": "2609.39042", "category": "quant-ph", "title": "Provable Classical and Quantum Local Algorithms for Max-$k$-Cut and Quantum Advantage at Moderate Girth", "abstract": "Broadening the study of quantum optimization algorithms from binary to $k$-element alphabets has been shown to open new avenues for potential quantum advantage. A quantum advantage claim for approximate optimization requires showing that, under the same assumptions, an efficient quantum algorithm provably achieves a better performance than can be proven for the best known efficient classical algorithms. We study local classical and quantum algorithms for Max-$k$-Cut on $d$-regular graphs of girth $g$. We advance classical algorithms for this problem by developing a local vector algorithm based on the explicit vector construction of Thompson, Parekh, and Marwaha (TPM). Our algorithm gives the best provable cut fraction guarantee among known efficient classical algorithms on regular graphs for $k\\geq3$. To evaluate the performance of QAOA under identical assumptions of girth and regularity, we develop tensor network techniques for general $d$ and $k \\geq 2$. In addition, using an equivalence to a coupled qudit--boson system, we compute the QAOA performance in the infinite-degree limit. Together, these techniques give provable guarantees on QAOA performance on large graphs. Despite the improvements we introduce to the classical algorithm, QAOA achieves a better cut fraction guarantee for depths $p\\geq 9$, corresponding to girth $g\\geq 20$, for both finite- and infinite-degree regimes. Thus, we obtain an apparent quantum advantage from applying QAOA to the Max-$k$-Cut problem.", "url": "https://arxiv.org/abs/2609.39042", "type": "数值", "summary": "将量子优化算法的研究范围从二进制扩展到 $k$ 元素字母表已被证明可以为潜在的量子优势开辟新途径。近似优化的量子优势要求表明，在相同的假设下，有效的量子算法可证明比最著名的有效经典算法能获得更好的性能。我们研究在周长 $g$ 的 $d$-正则图上进行 Max-$k$-Cut 的局部经典和量子算法。我们通过开发基于 Thompson、Parekh 和 Marwaha (TPM) 的显式向量构造的局部向量算法来改进该问题的经典算法。我们的算法在 $k\\geq3$ 的正则图上提供了已知有效经典算法中最好的可证明割分数保证。为了在相同的周长和规律性假设下评估 QAOA 的性能，我们开发了通用 $d$ 和 $k \\geq 2$ 的张量网络技术。此外，使用耦合量子玻色子系统的等价物，我们计算了无限度极限下的 QAOA 性能。这些技术共同为大图上的 QAOA 性能提供了可证明的保证。\n\n尽管我们对经典算法进行了改进，但 QAOA 对于有限度和无限度范围内的深度 $p\\geq 9$（对应于周长 $g\\geq 20$）实现了更好的切割分数保证。因此，我们通过将 QAOA 应用于 Max-$k$-Cut 问题获得了明显的量子优势。", "authors": [{"name": "Anuj Apte"}, {"name": "Abid Khan"}, {"name": "Edward Farhi"}, {"name": "Kunal Marwaha"}, {"name": "Sami Boulebnane"}, {"name": "Ruslan Shaydulin"}], "featured_authors": [{"name": "Anuj Apte"}, {"name": "Abid Khan"}, {"name": "Edward Farhi"}, {"name": "Kunal Marwaha"}, {"name": "Sami Boulebnane"}, {"name": "Ruslan Shaydulin"}], "author_count": 6}, {"id": "2609.39046", "category": "quant-ph", "title": "Fixed-Point Bifurcations and Path-Information Bounds in Nonlinear Exceptional-Point Sensing", "abstract": "Nonlinear exceptional points (NEPs) were proposed to circumvent the noise--responsivity cancellation that limits linear exceptional-point sensors. At an NEP, the stationary frequency response can be singular while the Hamiltonian Petermann factor remains finite, suggesting a genuine signal-to-noise ratio (SNR) enhancement. Yet recent model-specific analyses of nonlinear fluctuations have reached conflicting conclusions. We prove that any singular stationary frequency response requires a fixed-point bifurcation of the nonlinear dynamics. In local fluctuation regimes, the singularities in responsivity and long-time frequency uncertainty are both set by the critical relaxation rate, leading to exact cancellation in the SNR and precluding any divergent enhancement. Furthermore, we derive a path-information bound that applies across both local and nonlinear fluctuation regimes and places a finite ceiling on the long-time SNR enhancement. Notably, this upper bound is attainable in the local fluctuation regime, implying that frequency readout under such parameter settings is information-optimal.", "url": "https://arxiv.org/abs/2609.39046", "type": "理论", "summary": "提出非线性异常点（NEP）是为了规避限制线性异常点传感器的噪声响应度消除。在 NEP 下，稳态频率响应可能是奇异的，而哈密顿彼得曼因子仍然有限，这表明信噪比 (SNR) 得到了真正的增强。然而，最近对非线性波动的特定模型分析得出了相互矛盾的结论。我们证明任何奇异稳态频率响应都需要非线性动力学的定点分岔。在局部波动情况下，响应率的奇点和长时间频率不确定性均由临界弛豫率设定，从而导致 SNR 的精确抵消并防止任何发散性增强。此外，我们得出了适用于局部和非线性波动机制的路径信息界限，并对长期 SNR 增强设置了有限上限。值得注意的是，这个上限在局部波动范围内是可以达到的，这意味着在这种参数设置下的频率读数是信息最优的。", "authors": [{"name": "Xue-Hao Yu"}, {"name": "Cong-Feng Qiao"}], "featured_authors": [{"name": "Xue-Hao Yu"}, {"name": "Cong-Feng Qiao"}], "author_count": 2}, {"id": "2609.39084", "category": "quant-ph", "title": "Engineered Dissipation for Thermal-State Tracking Across Quantum Criticality", "abstract": "Engineering dissipation has emerged as a powerful strategy for controlling quantum many-body dynamics, complementing purely coherent control for state preparation. However, finite-time driving across a quantum critical point generates nonadiabatic excitations and coherences, and existing dissipation-engineering approaches have largely characterized how a fixed environment modifies critical dynamics rather than actively steering a system toward a prescribed thermal trajectory. Here we develop a Markovian dissipative framework for finite-time thermal-state tracking based on engineered population currents with non-negative transition rates, and apply it to the transverse-field Ising model driven across its quantum critical point. Compared with unitary dynamics and a natural thermal bath, the engineered dynamics strongly suppresses thermal excitation deviations and provides additional control over coherence damping through a free common current $Q_k$, while exhibiting a substantially steeper residual scaling, $\\delta n_{\\mathrm{ex}}^{\\mathrm{th}}\\sim(v/v_{\\mathrm{ch}})^2$, than the Kibble--Zurek behavior recovered for unitary evolution. These results point toward engineered dissipation as a route for controlling thermal-state preparation in driven quantum critical systems.", "url": "https://arxiv.org/abs/2609.39084", "type": "理论", "summary": "工程耗散已成为控制量子多体动力学的强大策略，补充了状态准备的纯相干控制。然而，跨越量子临界点的有限时间驱动会产生非绝热激发和相干性，而现有的耗散工程方法在很大程度上表征了固定环境如何改变临界动力学，而不是主动引导系统朝着规定的热轨迹发展。在这里，我们开发了一种基于具有非负转变率的工程布居电流的有限时间热态跟踪的马尔可夫耗散框架，并将其应用于跨越其量子临界点驱动的横向场伊辛模型。与酉动力学和天然热浴相比，工程动力学强烈抑制热激励偏差，并通过自由公共电流$Q_k$提供对相干阻尼的额外控制，同时表现出比酉进化恢复的Kibble-Zurek行为更陡峭的残余缩放$\\delta n_{\\mathrm{ex}}^{\\mathrm{th}}\\sim(v/v_{\\mathrm{ch}})^2$。\n\n这些结果表明工程耗散可以作为控制驱动量子临界系统中热态制备的一种途径。", "authors": [{"name": "Saikat Mistry"}, {"name": "Dibyajyoti Sahu"}, {"name": "Suhas Gangadharaiah"}], "featured_authors": [{"name": "Saikat Mistry"}, {"name": "Dibyajyoti Sahu"}, {"name": "Suhas Gangadharaiah"}], "author_count": 3}, {"id": "2609.39092", "category": "quant-ph", "title": "Quantum circuit compilation with constant overhead", "abstract": "Compiling a continuous gate set to a discrete universal gate set generally incurs an overhead. A circuit composed of $G$ arbitrary one- and two-qubit gates can be $\\epsilon$-approximated by a sequence of gates from $\\{H,T,\\mathrm{CNOT}\\}$ by replacing each original gate by a sequence of $O(\\log(G/\\epsilon))$ elementary gates. We show that this overhead can be avoided using adaptivity for polynomial-sized circuits with inverse-polynomial target error, which is optimal.", "url": "https://arxiv.org/abs/2609.39092", "type": "理论", "summary": "将连续门集编译为离散通用门集通常会产生开销。由 $G$ 任意一量子位门和二量子位门组成的电路可以通过 $\\{H,T,\\mathrm{CNOT}\\}$ 中的一系列门进行 $\\epsilon$ 近似，方法是将每个原始门替换为 $O(\\log(G/\\epsilon))$ 基本门序列。我们证明，可以使用具有逆多项式目标误差的多项式大小电路的自适应性来避免这种开销，这是最佳的。", "authors": [{"name": "Chenyi Zhang"}, {"name": "Xinyu Tan"}, {"name": "Robin Kothari"}, {"name": "David Gosset"}, {"name": "Craig Gidney"}], "featured_authors": [{"name": "Chenyi Zhang"}, {"name": "Xinyu Tan"}, {"name": "Robin Kothari"}, {"name": "David Gosset"}, {"name": "Craig Gidney"}], "author_count": 5}, {"id": "2609.39113", "category": "quant-ph", "title": "Optimal testing of fermionic and bosonic Gaussian states", "abstract": "We study the problem of property testing quantum states: given a pure state $|\\psi\\rangle$ that either (A) belongs to some class $C$ of pure states, or (B) is $\\varepsilon$-far in trace distance from all states in $C$, determine which is the case with high probability. It is known that there exists classes $C$ for which the sample complexity of property testing necessarily scales with the size of the system. In this work, we identify classes for which testing only requires a size-independent number of samples. We prove a tight sample complexity of $\\Theta(1/\\varepsilon^2)$ for the property testing of five important classes of Gaussian quantum states: 1) Fermionic Gaussian states, 2) Slater determinants, 3) bosonic Gaussian states, 4) zero-mean bosonic Gaussian states, and 5) bosonic coherent states. While property testers for some of these classes have been studied previously, those analyses only gave upper bounds scaling polynomially in the number of modes. In each case, our tester is the projection onto the ``top'' irrep of two or three copies. We get to constant sample complexity by lower bounding how quickly the rejection probability increases with distance from the class; the main technical component involves bounding the spectral gap of symmetric extension of the test projector. We then establish optimality by proving matching lower bounds based on binary state discrimination for each class. Our testers and optimality claims also extend to the tolerant setting, wherein $\\psi$ may be $O(\\varepsilon)$-close to $C$ in case (A), rather than lying exactly inside.", "url": "https://arxiv.org/abs/2609.39113", "type": "理论", "summary": "我们研究量子态的性质测试问题：给定一个纯态 $|\\psi\\rangle$，要么 (A) 属于纯态 $C$ 类，要么 (B) 与 $C$ 中所有状态的迹线距离 $\\varepsilon$-far，确定哪种情况的概率较高。众所周知，存在$C$类，其属性测试的样本复杂性必然随着系统的规模而变化。在这项工作中，我们确定了测试仅需要与大小无关的样本数量的类别。我们证明了 $\\Theta(1/\\varepsilon^2)$ 的严格样本复杂度，用于五类重要的高斯量子态的属性测试：1) 费米子高斯态，2) 斯莱特行列式，3) 玻色高斯态，4) 零均值玻色高斯态，以及 5) 玻色相干态。虽然之前已经研究了其中一些类别的属性测试器，但这些分析仅给出了模式数量的多项式缩放上限。在每种情况下，我们的测试器都是在“顶部”上的投影，而不是两个或三个副本。\n\n我们通过降低拒绝概率随着距类别的距离而增加的速度来获得恒定的样本复杂性；主要技术组成部分涉及限制测试投影仪对称扩展的光谱间隙。然后，我们通过证明基于每个类别的二元状态区分的匹配下界来建立最优性。我们的测试人员和最优性声明也扩展到容忍设置，其中 $\\psi$ 可能是 $O(\\varepsilon)$ - 接近情况 (A) 中的 $C$，而不是正好位于内部。", "authors": [{"name": "Vishnu Iyer"}, {"name": "Bryan O'Gorman"}, {"name": "Ojas Parekh"}, {"name": "Kevin Thompson"}, {"name": "Andrew Zhao"}], "featured_authors": [{"name": "Vishnu Iyer"}, {"name": "Bryan O'Gorman"}, {"name": "Ojas Parekh"}, {"name": "Kevin Thompson"}, {"name": "Andrew Zhao"}], "author_count": 5}, {"id": "2609.39119", "category": "quant-ph", "title": "Complete parameterization and parameter-space topology of discrete Wigner representations on $d \\times d$ phase space", "abstract": "Toroidal discrete Wigner functions (DWFs) for finite-dimensional systems are non-unique. We classify the labeled single-qudit ${d\\times d}$ representations whose phase-point operators are Hermitian, unit-trace, Hilbert-Schmidt orthogonal, and Weyl-Heisenberg covariant. Our previously established stencil theorem expresses this family as descents of a doubled ${2d\\times2d}$ parent. Here, we solve its projected-stencil admissibility conditions explicitly. In the symplectic-Fourier representation, admissibility fixes the modulus, leaving phase data on a ${d\\times d}$ base cell satisfying a parity-dependent twisted-oddness relation. This gives the parameter space ${(S^1)^{(d^2-1)/2}}$ for odd ${d}$ and ${(S^1)^{(d^2-4)/2}\\times\\mathbb{Z}_2^3}$ for even ${d}$. Canonical horizontal and vertical marginals reduce these spaces to ${(S^1)^{(d-1)^2/2}}$ and ${(S^1)^{d(d-2)/2}\\times\\mathbb{Z}_2}$, respectively. The same phase data parameterize validity-preserving rephasings of the doubled Weyl-Heisenberg displacement operators. Requiring these operators to have order dividing the Hilbert-space dimension ${d}$ replaces each ${S^1}$ factor by a discrete ${\\mathbb{Z}_d}$ factor. The associated symplectic-Fourier characteristic functions encode the same operator information, with pointwise magnitudes independent of the valid stencil convention. This classification separates the freedom intrinsic to DWF validity from that selected by marginal and displacement-algebra requirements and makes explicit the structural distinction between odd and even dimensions.", "url": "https://arxiv.org/abs/2609.39119", "type": "理论", "summary": "有限维系统的环形离散维格纳函数 (DWF) 不是唯一的。我们对标记的单量子点 ${d\\times d}$ 表示进行分类，其相点算子是 Hermitian、单位迹、Hilbert-Schmidt 正交和 Weyl-Heisenberg 协变。我们之前建立的模板定理将这个族表示为双重 ${2d\\times2d}$ 父代的后裔。在这里，我们明确地解决了其投影模板的可接受性条件。在辛傅立叶表示中，容许性固定模量，将相位数据留在满足奇偶相关的扭曲奇数关系的 ${d\\times d}$ 基本单元上。这给出了奇数 ${d}$ 的参数空间 ${(S^1)^{(d^2-1)/2}}$ 和偶数 ${d}$ 的参数空间 ${(S^1)^{(d^2-4)/2}\\times\\mathbb{Z}_2^3}$。规范的水平和垂直边缘将这些空间分别减少为 ${(S^1)^{(d-1)^2/2}}$ 和 ${(S^1)^{d(d-2)/2}\\times\\mathbb{Z}_2}$。相同的相位数据参数化双 Weyl-Heisenberg 位移算子的保持有效性的重新定相。要求这些运算符具有除希尔伯特空间维度 ${d}$ 的顺序，将每个 ${S^1}$ 因子替换为离散的 ${\\mathbb{Z}_d}$ 因子。\n\n相关的辛傅立叶特征函数对相同的算子信息进行编码，其逐点幅度独立于有效的模板约定。这种分类将 DWF 有效性固有的自由与边际和位移代数要求所选择的自由分开，并明确了奇数维和偶数维之间的结构区别。", "authors": [{"name": "Lucky K. Antonopoulos"}, {"name": "Nicolas C. Menicucci"}], "featured_authors": [{"name": "Lucky K. Antonopoulos"}, {"name": "Nicolas C. Menicucci"}], "author_count": 2}, {"id": "2609.39126", "category": "quant-ph", "title": "An uncertainty principle for entanglement", "abstract": "Consider two orthonormal bases of a bipartite Hilbert space such that states in one basis are weakly entangled and states in the other are strongly entangled. We establish a quantitative version of the following uncertainty principle: every state that is localized in one basis must be delocalized in the other. More specifically, we lower bound the sum of the Shannon entropies of any state's coefficient distributions in the two bases by the difference between the entanglement Rényi entropies of their basis states. The result follows from new lower and upper bounds on the entanglement of superpositions that may be of independent interest. As an application, our result limits the power of weakly-entangled states in representing ground states of Hamiltonians with strongly-entangled energy eigenstates. We illustrate this application numerically for the Sachdev-Ye-Kitaev model.", "url": "https://arxiv.org/abs/2609.39126", "type": "理论+数值", "summary": "考虑二分希尔伯特空间的两个正交基，其中一个基中的状态是弱纠缠的，而另一个基中的状态是强纠缠的。我们建立了以下不确定性原理的定量版本：在一个基础上定位的每个状态都必须在另一个基础上离域。更具体地说，我们通过基态的纠缠 Rényi 熵之间的差来下限两个基中任何态系数分布的香农熵之和。结果来自可能具有独立兴趣的叠加纠缠的新下限和上限。作为一种应用，我们的结果限制了弱纠缠态在表示具有强纠缠能量本征态的哈密顿量的基态方面的能力。我们通过 Sachdev-Ye-Kitaev 模型的数值说明了这一应用。", "authors": [{"name": "Mitali Nanda"}, {"name": "Daochen Wang"}], "featured_authors": [{"name": "Mitali Nanda"}, {"name": "Daochen Wang"}], "author_count": 2}, {"id": "2609.39141", "category": "quant-ph", "title": "Geometric Characterization and Feasible Region Analysis of Bipartite Qutrit Bound Entanglement", "abstract": "We characterize bound entanglement in bipartite qutrit systems by combining the Positive Partial Transpose (PPT) criterion with a structural, non-completely positive map. Focusing on a comprehensive three-parameter bipartite qutrit family $\\rho_{a,b,c}$, we present an exact analytical and geometric partitioning of the physical state space simplex. We derive the closed-form quadratic boundary governing the leaf-like PPT region $(a^2+ab+b^2-b \\leq 0)$ over the domain $0 < a \\leq \\frac{1}{3}$, and identify the exact linear threshold $(a > c)$ that characterizes the PPT bound entangled sub-region. This family strictly generalizes the well-known Horodecki bound entangled states, which appear as a single slice of the three-dimensional leaf. Applying the structural map to this decomposition, we show that it certifies bound entanglement throughout the entire threshold region, accounting for $14.76\\%$ of the total PPT leaf area.", "url": "https://arxiv.org/abs/2609.39141", "type": "理论", "summary": "我们通过将正部分转置 (PPT) 标准与结构性非完全正图相结合来描述二分 qutrit 系统中的束缚纠缠。着眼于全面的三参数二分 qutrit 族 $\\rho_{a,b,c}$，我们提出了物理状态空间单纯形的精确分析和几何划分。我们推导出在域 $0 < a \\leq \\frac{1}{3}$ 上控制叶状 PPT 区域 $(a^2+ab+b^2-b \\leq 0)$ 的封闭形式二次边界，并确定表征 PPT 边界纠缠子区域的精确线性阈值 $(a > c)$。该族严格概括了著名的 Horodecki 束缚纠缠态，它显示为三维叶子的单个切片。将结构图应用于此分解，我们表明它证明了整个阈值区域的束缚纠缠，占总 PPT 叶面积的 $14.76\\%$。", "authors": [{"name": "Mazhar Ali"}], "featured_authors": [{"name": "Mazhar Ali"}], "author_count": 1}, {"id": "2609.39226", "category": "quant-ph", "title": "Metrological Benchmarking of Random Quantum Circuits", "abstract": "Random circuit sampling is a leading approach to demonstrating quantum computational advantage, but benchmarking noisy implementations through linear cross-entropy requires costly calculations of ideal output probabilities. We propose a metrological benchmark based on the response to controlled perturbations, characterized by quantum Fisher information (QFI). A relation between QFI and out-of-time-order correlators enables protocols with local or global control. For Haar-random circuits, the average QFI approaches its maximal value in the local protocol and grows linearly with the number of qubits under collective control. In contrast, Clifford circuits yield zero QFI despite extensive operator spreading, showing that the response probes dynamical properties beyond spreading alone. A butterfly protocol further uses system size to enhance sensitivity, yielding a mean inverse sensitivity proportional to the number of qubits with single-qubit readout. Its fluctuations distinguish the Haar and Clifford ensembles despite their identical mean responses. For noisy implementations, we derive an exact relation between the noisy and ideal QFI within a global white-noise model, providing a quantitative reference for the degradation of the benchmark. These protocols enable metrological benchmarking of noisy random quantum circuits without computing ideal output probabilities.", "url": "https://arxiv.org/abs/2609.39226", "type": "理论+数值", "summary": "随机电路采样是展示量子计算优势的主要方法，但通过线性交叉熵对噪声实现进行基准测试需要对理想输出概率进行昂贵的计算。我们提出了一种基于对受控扰动的响应的计量基准，其特征是量子费希尔信息（QFI）。 QFI 和乱序相关器之间的关系使协议能够进行本地或全局控制。对于 Haar 随机电路，平均 QFI 接近本地协议中的最大值，并随着集体控制下的量子位数量线性增长。相比之下，尽管有大量算子扩散，Clifford 电路仍产生零 QFI，这表明响应探测的动态特性超出了单独扩散的范围。蝴蝶协议进一步利用系统尺寸来增强灵敏度，产生与单量子位读出的量子位数量成比例的平均逆灵敏度。尽管 Haar 和 Clifford 整体的平均响应相同，但其波动却有所不同。\n\n对于噪声实施，我们在全局白噪声模型中得出噪声和理想 QFI 之间的精确关系，为基准的退化提供定量参考。这些协议可以对噪声随机量子电路进行计量基准测试，而无需计算理想的输出概率。", "authors": [{"name": "Simone Cavazzoni"}, {"name": "Changhun Oh"}], "featured_authors": [{"name": "Simone Cavazzoni"}, {"name": "Changhun Oh"}], "author_count": 2}, {"id": "2609.39234", "category": "quant-ph", "title": "Breaking the Bounded Entanglement Barrier for Quantum Position Verification", "abstract": "Position verification, introduced by Chandran et al. (SIAM J. Computing 2014), allows verifiers to test a prover's claimed position by an interactive protocol. Classical position verification is impossible. Even for Quantum Position Verification (QPV), there always exists an LOCC (Local Operations and Classical Communication) attack if the adversary can hold an exponentially large amount of preshared entanglement. Somewhat surprisingly, we show that we can circumvent this barrier in the idealized continuous-time model, where time is represented by a real-valued parameter and challenge messages can be sent at a time sampled uniformly from a real interval. In this model, we give a BB84-based protocol that remains secure against any finite coalition of LOCC adversaries with arbitrary finite (possibly exponential) quantum storage and entanglement. Our construction can also be instantiated in the discrete-time model. Even though the previous impossibility results apply, we are able to obtain an information-theoretic QPV protocol in which the honest parties' total resources (communication and storage) can be significantly smaller than the adversarial resource bound. In fact, we can achieve any desired polynomial gap between honest parties and adversarial resources. To our knowledge, all previous protocols in the literature required resources of the honest parties to be at least as large as the adversarial entanglement. Interestingly, the resource gap between the honest and adversarial party resources in our protocol depends on how precisely time can be measured. As the precision of the best-known clock improves with further research, the resource gap in our protocol keeps increasing. In particular, the adversarial resource bound keeps increasing while the honest parties' resources remain largely the same. We call this the \"I sleep, you work\" paradigm.", "url": "https://arxiv.org/abs/2609.39234", "type": "理论", "summary": "位置验证，由 Chandran 等人提出。 (SIAM J.Computing 2014)，允许验证者通过交互式协议测试证明者声称的位置。经典的位置验证是不可能的。即使对于量子位置验证（QPV），如果对手能够持有指数级数量的预共享纠缠，则始终存在 LOCC（本地操作和经典通信）攻击。有点令人惊讶的是，我们表明我们可以在理想化的连续时间模型中绕过这个障碍，其中时间由实值参数表示，并且挑战消息可以在从真实间隔均匀采样的时间发送。在这个模型中，我们给出了一个基于 BB84 的协议，该协议对于具有任意有限（可能是指数）量子存储和纠缠的 LOCC 对手的任何有限联盟保持安全。我们的构造也可以在离散时间模型中实例化。即使前面的不可能结果适用，我们仍然能够获得信息论 QPV 协议，其中诚实方的总资源（通信和存储）可以显着小于对抗资源限制。\n\n事实上，我们可以在诚实方和敌方资源之间实现任何所需的多项式差距。据我们所知，文献中的所有先前协议都要求诚实方的资源至少与对抗性纠缠一样大。有趣的是，我们协议中诚实方和敌方资源之间的资源差距取决于时间测量的精确程度。随着最著名时钟的精度随着进一步的研究而提高，我们协议中的资源缺口不断扩大。特别是，对抗性资源限制不断增加，而诚实方的资源基本保持不变。我们称之为“我睡觉，你工作”范例。", "authors": [{"name": "Amit Behera"}, {"name": "Vipul Goyal"}], "featured_authors": [{"name": "Amit Behera"}, {"name": "Vipul Goyal"}], "author_count": 2}, {"id": "2609.39286", "category": "quant-ph", "title": "Bounds on adiabatic path geometry from the width class of the gap profile", "abstract": "In an adiabatic evolution, the wave function follows the path of ground states $|\\Phi_0(s)\\rangle$ of a Hamiltonian $H(s)$ as $s$ is tuned from $0$ to $1$. The geometry of this adiabatic path is described by quantities such as its length $L=\\int_0^1 \\|\\partial_s |\\Phi_0(s)\\rangle\\|\\,ds$ and its total curvature $K$. This geometry affects the evolution time $T$. For instance, $T$ is at least of order $L/\\Delta_*$, where $\\Delta_*$ is the minimum energy gap over $s\\in[0,1]$. The traditional approach gives $L=\\mathcal{O}(\\Delta_*^{-1/2})$ and $K=\\mathcal{O}(\\Delta_*^{-1})$, which are loose in many cases. We improve these bounds by using $\\mu_<(\\gamma)$, the width of the region in $s$ on which the gap is below $\\gamma$. The gap profile is in width class $p$ when $\\mu_<(\\gamma)$ falls at least as fast as $\\gamma^{1/p}$. A typical avoided crossing is in width class $p=1$, which gives $L=\\mathcal{O}(\\sqrt{\\log \\Delta_*^{-1}})$ and $K=\\mathcal{O}(\\log \\Delta_*^{-1})$. A profile in width class $p>1$ gives power laws with exponents $(p-1)/(2p)$ for $L$ and $(p-1)/p$ for $K$. The width class also bounds the evolution time. At $p=1$ we have $T=\\mathcal{O}(\\Delta_*^{-2})$ with a schedule that advances $s$ at a constant rate, and $T=\\mathcal{O}(\\Delta_*^{-1})$ up to a polylogarithmic correction with a schedule that traverses the path at a constant geometric speed. The bounds on $L$ hold for any twice continuously differentiable $H(s)$, and the bounds on $K$ for affine $H(s)$. We also prove the tightness of scaling of $L$ in $\\Delta_*$ for every integer $p\\ge1$, and the scaling of $K$ at $p=1$. We demonstrate the bounds on the adiabatic Grover search, the XXZ spin chain, and molecular electronic Hamiltonians.", "url": "https://arxiv.org/abs/2609.39286", "type": "理论", "summary": "在绝热演化中，当 $s$ 从 $0$ 调整到 $1$ 时，波函数遵循哈密顿量 $H(s)$ 的基态 $|\\Phi_0(s)\\rangle$ 路径。该绝热路径的几何形状由长度 $L=\\int_0^1 \\|\\partial_s |\\Phi_0(s)\\rangle\\|\\,ds$ 及其总曲率 $K$ 等量来描述。该几何形状影响演化时间$T$。例如，$T$ 至少为 $L/\\Delta_*$ 阶，其中 $\\Delta_*$ 是 $s\\in[0,1]$ 上的最小能隙。传统方法给出 $L=\\mathcal{O}(\\Delta_*^{-1/2})$ 和 $K=\\mathcal{O}(\\Delta_*^{-1})$，它们在许多情况下是松散的。我们通过使用 $\\mu_<(\\gamma)$（$s$ 中间隙低于 $\\gamma$ 的区域的宽度）来改进这些边界。当 $\\mu_<(\\gamma)$ 下降速度至少与 $\\gamma^{1/p}$ 一样快时，间隙轮廓处于宽度等级 $p$ 中。典型的避免交叉是宽度类别 $p=1$，它给出 $L=\\mathcal{O}(\\sqrt{\\log \\Delta_*^{-1}})$ 和 $K=\\mathcal{O}(\\log \\Delta_*^{-1})$。宽度类别 $p>1$ 中的轮廓给出幂律，其中 $L$ 的指数为 $(p-1)/(2p)$，$K$ 的指数为 $(p-1)/p$。宽度类别也限制了进化时间。\n\n在$p=1$处，我们有$T=\\mathcal{O}(\\Delta_*^{-2})$，其时间表以恒定速率推进$s$，并且$T=\\mathcal{O}(\\Delta_*^{-1})$达到多对数校正，其时间表以恒定的几何速度穿过路径。 $L$ 上的界限对于任何两次连续可微的 $H(s)$ 成立，$K$ 上的界限对于仿射 $H(s)$ 成立。我们还证明了对于每个整数$p\\ge1$，$L$在$\\Delta_*$中的缩放紧度，以及$K$在$p=1$处的缩放。我们证明了绝热 Grover 搜索、XXZ 自旋链和分子电子哈密顿量的界限。", "authors": [{"name": "Mancheon Han"}, {"name": "Sangkook Choi"}], "featured_authors": [{"name": "Mancheon Han"}, {"name": "Sangkook Choi"}], "author_count": 2}, {"id": "2609.39295", "category": "quant-ph", "title": "Resource-Tunable Quantum Circuit Implementation of Nonlinear Element-Wise Transformations", "abstract": "Nonlinear transformations are important in quantum machine learning and other quantum numerical application
