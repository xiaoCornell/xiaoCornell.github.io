  <style>

    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }

  <script>
    const papers = [{"id": "2609.38247", "category": "cond-mat", "title": "Accidental accuracy and formal consistency in $GW$+BSE: Exact benchmarks and regime-dependent error cancellation", "abstract": "Standard many-body perturbation theory for optical excitations combines the $GW$ approximation for quasiparticle energies with the Bethe-Salpeter equation (BSE) for the electron-hole response. Formally, the BSE kernel must equal the functional derivative of the self-energy, $K=\\delta\\Sigma/\\delta G$. In routine practice, however, the kernel is built from a statically screened direct interaction and a bare exchange interaction, which breaks this consistency. Using exact diagonalization of the extended Hubbard dimer, we construct a controlled benchmark that isolates the price of this inconsistency. We show that the internally inconsistent practical $GW$+BSE construction frequently yields accurate optical gaps through accidental cancellation between an underestimated $GW$ gap and an oversized bare-exchange kernel, and we map the regions of parameter space where this accidental accuracy occurs. Upon switching on the nearest-neighbor interaction and binding the exciton, the practical construction remains the accurate one throughout the weak-binding regime, with cancellation optima at parts in $10^{3}$, while the frozen-$W$ construction fails at every binding strength. Beyond a binding threshold both static constructions deteriorate, showing that deeply bound excitons require physics beyond any static kernel. Accidental accuracy is therefore a property of the weak-binding regime, and the systematic failure of the frozen-$W$ derivative kernel within the explored parameter space traces to its overscreening of the exchange channel. The accuracy of the practical kernel is an accidental cancellation of two independent errors, an underestimated quasiparticle gap and an oversized exchange term, not a hidden consistency. These results provide a controlled taxonomy of approximation failure in $GW$+BSE and a precise diagnostic for when standard workflows can be trusted.", "url": "https://arxiv.org/abs/2609.38247", "type": "理论+数值", "summary": "光激发的标准多体微扰理论将准粒子能量的 $GW$ 近似与电子空穴响应的 Bethe-Salpeter 方程 (BSE) 相结合。形式上，BSE 核必须等于自能的函数导数 $K=\\delta\\Sigma/\\delta G$。然而，在日常实践中，内核是由静态筛选的直接交互和裸交换交互构建的，这打破了这种一致性。使用扩展的哈伯德二聚体的精确对角化，我们构建了一个受控基准来隔离这种不一致的代价。我们表明，内部不一致的实际 $GW$+BSE 构造经常通过被低估的 $GW$ 间隙和过大的裸交换内核之间的意外抵消来产生准确的光学间隙，并且我们映射了出现这种意外精度的参数空间区域。当打开最近邻相互作用并结合激子时，实际结构在整个弱结合区域中仍然是准确的，在 $10^{3}$ 部分具有抵消最佳值，而冻结 $W$ 结构在每个结合强度下都失败。\n\n超过结合阈值，两种静态结构都会恶化，这表明深度结合的激子需要超出任何静态内核的物理学。因此，偶然的准确性是弱结合机制的一个属性，而所探索的参数空间中冻结 $W$ 导数内核的系统故障可追溯到其对交换通道的过度筛选。实用核的准确性是两个独立误差、被低估的准粒子间隙和过大的交换项的意外抵消，而不是隐藏的一致性。这些结果提供了 $GW$+BSE 中近似失败的受控分类法，以及何时可以信任标准工作流程的精确诊断。", "authors": [{"name": "Michael O. Atambo"}], "featured_authors": [{"name": "Michael O. Atambo"}], "author_count": 1}, {"id": "2609.38317", "category": "cond-mat", "title": "Hidden Angular Momentum Loop Currents in Symmetric Crystals", "abstract": "Loop-current order has been invoked to explain unconventional electronic phases, with the crystal lattice usually regarded as a passive host for the underlying collective dynamics. Here we show that circulating currents can originate in the lattice itself, sustained by quantum and thermal fluctuations. We develop a microscopic description of angular momentum exchange that separates transfer between sites from crystalline restoring torques and reveals how circulation can emerge in a symmetry-preserving equilibrium state. In a two-dimensional elastic lattice preserving time-reversal, inversion, and fourfold rotational symmetries, we uncover opposite current loops on neighboring plaquettes while the mean angular momentum vanishes at every site. These currents are sustained by zero-point fluctuations in the phonon vacuum and persist at finite temperature. We trace their origin to directional elastic interactions in locally symmetry-lowered environments, with the higher crystal symmetry organizing the resulting currents into a compensated pattern of circulation. Our results extend the physics of equilibrium loop currents to lattice dynamics, revealing that elastic geometry can organize fluctuations into persistent angular momentum circulation without electronic or magnetic order, external driving, or spontaneous symmetry breaking.", "url": "https://arxiv.org/abs/2609.38317", "type": "理论", "summary": "环流顺序已被用来解释非常规电子相，晶格通常被视为潜在集体动力学的被动主体。在这里，我们证明循环电流可以起源于晶格本身，由量子和热波动维持。我们开发了角动量交换的微观描述，将位点之间的传递与晶体恢复扭矩分开，并揭示了循环如何出现在保持对称的平衡状态。在保持时间反转、反转和四重旋转对称性的二维弹性晶格中，我们发现相邻斑块上存在相反的电流环，而平均角动量在每个位置都消失。这些电流由声子真空中的零点涨落维持，并在有限温度下持续存在。我们将其起源追溯到局部对称性降低的环境中的定向弹性相互作用，较高的晶体对称性将产生的电流组织成补偿的循环模式。\n\n我们的研究结果将平衡环电流的物理学扩展到晶格动力学，揭示了弹性几何结构可以将涨落组织成持续的角动量循环，而无需电子或磁序、外部驱动或自发对称性破缺。", "authors": [{"name": "Rule Yi"}, {"name": "Vincent P. Flynn"}, {"name": "Benedetta Flebus"}], "featured_authors": [{"name": "Rule Yi"}, {"name": "Vincent P. Flynn"}, {"name": "Benedetta Flebus"}], "author_count": 3}, {"id": "2609.38478", "category": "cond-mat", "title": "Stress-based structure optimization for a range-separated hybrid van der Waals density functional", "abstract": "Complex matter, often partly soft and pliable, is the generic form of material systems. We must therefore generally call on density functional theory (DFT) to first predict the atomic structure before we can use it to also characterize (expected) properties. A recent range-separated hybrid (RSH) van Waals density functional (vdW-DF), `vdW-DF2-ahbr' (abbreviated AHBR) [PRX 12, 041003 (2022)], shows promise as a high-accuracy predictor of both binding energies and structure, from molecules to solids. However, the present implementation in Quantum Espresso (QE) does not, in our experience, support robust stress-based unit-cell optimization of RSHs. Here we document and illustrate work enabling practical AHBR-based complex-matter discovery: We port the AHBR XC functional to the Vienna Ab Initio Simulation Package (VASP) where use of stress-based DFT optimization is already stable also for RSHs. We test the implementation by comparing high-accuracy AHBR-QE and AHBR-VASP predictions of non-covalent molecular interactions and for structure and cohesion of simple bulk structures. We also illustrate and test the use of the new AHBR-VASP implementation to predict and understand (atomic and anti-ferromagnetic) structure in distorted-rocksalt metal monoxides. Finally, we illustrate use for complex-soft-matter discovery by predicting motifs for layer stacking in the C2N covalent-organic framework (COF) system [Nat. Commun. 6, 6486 (2015)].", "url": "https://arxiv.org/abs/2609.38478", "type": "理论+数值", "summary": "复杂物质，通常部分柔软且柔韧，是材料系统的通用形式。因此，我们通常必须首先利用密度泛函理论（DFT）来预测原子结构，然后才能使用它来表征（预期）属性。最近的范围分离杂化 (RSH) 范瓦尔斯密度泛函 (vdW-DF)“vdW-DF2-ahbr”（缩写 AHBR）[PRX 12, 041003 (2022)] 显示出作为从分子到固体的结合能和结构的高精度预测器的前景。然而，根据我们的经验，目前 Quantum Espresso (QE) 中的实现并不支持 RSH 的稳健的基于应力的单位单元优化。在这里，我们记录并说明了实现基于 AHBR 的实用复杂物质发现的工作：我们将 AHBR XC 功能移植到维也纳从头算仿真包 (VASP)，其中基于应力的 DFT 优化的使用对于 RSH 来说也已经稳定。我们通过比较非共价分子相互作用以及简单本体结构的结构和内聚力的高精度 AHBR-QE 和 AHBR-VASP 预测来测试实施情况。\n\n我们还说明和测试了如何使用新的 AHBR-VASP 实现来预测和理解扭曲岩盐金属一氧化物中的（原子和反铁磁）结构。最后，我们通过预测 C2N 共价有机框架 (COF) 系统中的层堆叠图案来说明复杂软物质发现的用途 [Nat.交流。 6、6486（2015）]。", "authors": [{"name": "Per Hyldgaard"}, {"name": "Yunqi Shao"}, {"name": "Raul Quintero-Monsebaiz"}, {"name": "Lars Öhrström"}], "featured_authors": [{"name": "Per Hyldgaard"}, {"name": "Yunqi Shao"}, {"name": "Raul Quintero-Monsebaiz"}, {"name": "Lars Öhrström"}], "author_count": 4}, {"id": "2609.38481", "category": "cond-mat", "title": "Results of Classical and Nonclassical theories of nucleation for ordering transition in barium titanate", "abstract": "Results of classical and nonclassical approach to nucleation at the ordering phase transition in barium titanate are presented. A nonclassical nucleation model is applied to the first-order paraelectric cubic phase to ferroelectric tetragonal phase transition in barium titanate is considered.", "url": "https://arxiv.org/abs/2609.38481", "type": "理论", "summary": "介绍了钛酸钡有序相变成核的经典和非经典方法的结果。将非经典成核模型应用于钛酸钡中的一阶顺电立方相到铁电四方相变。", "authors": [{"name": "V. Sobolev"}, {"name": "T. Liebsch"}], "featured_authors": [{"name": "V. Sobolev"}, {"name": "T. Liebsch"}], "author_count": 2}, {"id": "2609.38531", "category": "cond-mat", "title": "Enabling Domain-Specific Atomistic Models: A Machine Learning Potential for the Solid Acid Family", "abstract": "Machine-learned interatomic potentials trained across the periodic table have made atomistic simulation broadly accessible, and specializing them to a single compound class is widely expected to improve accuracy. Yet examples remain scarce, and fewer still surpass universal models in speed or reach a higher level of electronic-structure theory. Here we present a potential that is universal within the class of water-free solid-state hydrogen-bond network mediated proton conductors rather than across chemistry and a database of 4.4 million first-principles configurations spanning 55 materials. It surpasses leading general-purpose potentials across this domain, recovering measured activation energies and the ordering of anion rotational dynamics that those models miss; agreement on static structure does not imply agreement on transport. Accuracy falls for compositions far from the training set but stays competitive for close structural relatives, and a higher level of electronic-structure theory is reached with a few hundred additional configurations per material. We further introduce a compact variant carrying a fifth of the parameters, faster still and yet more accurate than every general-purpose model tested. It sustains more than a quarter of a million atoms on a single graphics processor, placing grain boundaries and the transition into the highly conducting phase within reach, and making a quantum treatment of the protons affordable. Reference accuracy and accessible system size thus become largely independent, offering a template for other compound classes.", "url": "https://arxiv.org/abs/2609.38531", "type": "理论+数值", "summary": "在整个元素周期表中训练的机器学习原子间势使得原子模拟变得更加容易实现，并且人们普遍期望将它们专门针对单个化合物类别以提高准确性。然而例子仍然很少，而且在速度上超越通用模型或达到电子结构理论更高水平的例子仍然很少。在这里，我们提出了一种在无水固态氢键网络介导的质子导体类中普遍存在的潜力，而不是在化学领域中普遍存在的潜力，以及涵盖 55 种材料的 440 万个第一原理配置的数据库。它超越了该领域领先的通用潜力，恢复了这些模型遗漏的测量活化能和阴离子旋转动力学的顺序；对静态结构的一致并不意味着对传输的一致。远离训练集的成分的准确性会下降，但对于结构密切的亲戚来说仍然具有竞争力，并且通过每种材料的数百个附加配置可以达到更高水平的电子结构理论。\n\n我们进一步引入了一个紧凑的变体，它携带五分之一的参数，比测试的每个通用模型更快、更准确。它在单个图形处理器上支持超过 25 万个原子，使晶界和向高导电相的转变触手可及，并使质子的量子处理变得经济实惠。因此，参考精度和可访问的系统尺寸在很大程度上变得独立，为其他复合类别提供了模板。", "authors": [{"name": "Jonas Hänseroth"}, {"name": "Rose Asuka Baroness von Stackelberg"}, {"name": "Christian Dreßler"}], "featured_authors": [{"name": "Jonas Hänseroth"}, {"name": "Rose Asuka Baroness von Stackelberg"}, {"name": "Christian Dreßler"}], "author_count": 3}, {"id": "2609.38581", "category": "cond-mat", "title": "Theory of criticality-enabled $U(1)$ symmetry breaking in a class of 1+1D systems", "abstract": "We present an analytic theory of the recently proposed phenomenon of spontaneous $U(1)$ symmetry breaking at 1+1D Lifshitz quantum critical points. The low-energy field theory contains two periodic scalars $\\theta$ and $\\phi$, with a Berry phase coupling that makes $\\theta$ canonically conjugate to the $U(1)$ charge density $\\partial_x \\phi$. Within a controlled large-$N$ limit, we demonstrate that the $U(1)$-charged phase vertex $e^{i\\beta\\theta}$ develops long-range order, while the conjugate vertex $e^{i\\beta\\phi}$ decays as a stretched exponential, $\\log\\langle e^{i\\beta\\phi(x)} e^{-i\\beta\\phi(0)}\\rangle\\propto-|\\beta|^{4/3}|x|^{2/3}$. Going beyond the large-$N$ limit, we give an analytic argument that the Lifshitz field theory supports $U(1)$ long-range order provided its dynamical exponent satisfies $z\\neq1$, a condition strongly supported by existing calculations. We test these predictions using finite-size and infinite-system DMRG in an itinerant-fermion chain with $U(1) \\rtimes \\mathbb{Z}_2$ symmetry. At the $\\mathbb{Z}_2$ ferromagnetic transition, the spin sector of the chain maps to the Lifshitz field theory. Consistent with analytic predictions, the $U(1)$-charged spin-nematic bond operator $S_i^+S_{i+1}^+$ exhibits long-range order, while the electron Green's function shows stretched-exponential decay. Together, these results elucidate the mechanism and consequences of criticality-enabled $U(1)$ symmetry breaking in 1+1D.", "url": "https://arxiv.org/abs/2609.38581", "type": "理论+数值", "summary": "我们提出了最近提出的 1+1D Lifshitz 量子临界点自发 $U(1)$ 对称破缺现象的解析理论。低能场论包含两个周期标量 $\\theta$ 和 $\\phi$，以及贝里相耦合，使 $\\theta$ 与 $U(1)$ 电荷密度 $\\partial_x \\phi$ 正则共轭。在受控的大$N$限制内，我们证明$U(1)$带电相位顶点$e^{i\\beta\\theta}$发展出长程有序，而共轭顶点$e^{i\\beta\\phi}$以拉伸指数形式衰减，$\\log\\langle e^{i\\beta\\phi(x)} e^{-i\\beta\\phi(0)}\\rangle\\propto-|\\beta|^{4/3}|x|^{2/3}$。超越大$N$限制，我们给出了一个分析论证，即Lifshitz场论支持$U(1)$长程序，前提是其动态指数满足$z\\neq1$，这是现有计算强烈支持的条件。我们在具有 $U(1) \\rtimes \\mathbb{Z}_2$ 对称性的巡回费米子链中使用有限大小和无限系统 DMRG 来测试这些预测。在 $\\mathbb{Z}_2$ 铁磁转变处，链的自旋扇区映射到 Lifshitz 场论。\n\n与分析预测一致，$U(1)$带电自旋向列键算子$S_i^+S_{i+1}^+$表现出长程有序，而电子格林函数表现出拉伸指数衰减。这些结果共同阐明了 1+1D 中临界性 $U(1)$ 对称性破缺的机制和后果。", "authors": [{"name": "E. S. Andriyakhina"}, {"name": "A. S. Shankar"}, {"name": "T. Senthil"}, {"name": "Z. D. Shi"}], "featured_authors": [{"name": "E. S. Andriyakhina"}, {"name": "A. S. Shankar"}, {"name": "T. Senthil"}, {"name": "Z. D. Shi"}], "author_count": 4}, {"id": "2609.38624", "category": "cond-mat", "title": "Three-Dimensional Shankar Skyrmions in Frustrated Antiferromagnets", "abstract": "We formulate a continuum theory for three-dimensional (3D) Shankar skyrmions in frustrated chiral antiferromagnets (AFs) and derive the conditions for metastable finite-size $\\pi_3(SO(3))$ solitons. A Derrick--Hobart scaling analysis shows that exchange, Dzyaloshinskii--Moriya interaction (DMI), anisotropy, and frustration can balance to set a finite equilibrium size. We identify two microscopic routes to this common topological and stabilization framework: intrinsic rotation-frame order in noncollinear AFs and an $\\mathbb{S}^3$ extension of an amplitude-softened Néel field. In the latter, the smooth four-component texture projects onto a Néel field containing a spatially separated pair of oppositely charged Bloch points. Numerical minimization yields metastable monopole textures, while the effective dynamics identifies coherent breathing oscillations as their characteristic finite-frequency collective mode. Our results provide a microscopic framework for the statics and dynamics of Shankar skyrmions and identify frustrated chiral AFs as promising hosts of 3D non-Abelian topological textures.", "url": "https://arxiv.org/abs/2609.38624", "type": "理论+数值", "summary": "我们制定了受挫手性反铁磁体 (AF) 中三维 (3D) 香卡斯格明子的连续介质理论，并推导了亚稳态有限尺寸 $\\pi_3(SO(3))$ 孤子的条件。 Derrick-Hobart 尺度分析表明，交换、Dzyaloshinskii-Moriya 相互作用 (DMI)、各向异性和挫折可以平衡以设定有限的平衡大小。我们确定了通往这种常见拓扑和稳定框架的两条微观途径：非共线 AF 中的固有旋转框架顺序和振幅软化尼尔场的 $\\mathbb{S}^3$ 扩展。在后者中，平滑的四分量纹理投影到包含一对空间上分离的带相反电荷的布洛赫点的尼尔场上。数值最小化产生亚稳态单极纹理，而有效动力学将相干呼吸振荡识别为其特征有限频率集体模式。我们的结果为香卡斯格明子的静力学和动力学提供了微观框架，并将受挫的手性 AF 识别为 3D 非阿贝尔拓扑纹理的有希望的宿主。", "authors": [{"name": "Vladyslav M. Kuchkin"}, {"name": "Ricardo Rama-Eiroa"}, {"name": "Carlos Saji"}, {"name": "Alvaro S. Nunez"}, {"name": "Roberto E. Troncoso"}], "featured_authors": [{"name": "Vladyslav M. Kuchkin"}, {"name": "Ricardo Rama-Eiroa"}, {"name": "Carlos Saji"}, {"name": "Alvaro S. Nunez"}, {"name": "Roberto E. Troncoso"}], "author_count": 5}, {"id": "2609.38679", "category": "cond-mat", "title": "Dense and porous phase transition study of SEI formation using phase-field method", "abstract": "The solid electrolyte interphase (SEI) is essential for the long-term stability of batteries because it influences the reactions between the electrode and electrolyte. Despite previous studies, the SEI evolution from dense to porous phases remains incompletely understood. Here, we investigate the SoC-dependent evolution of the SEI using a phase-field framework under open-circuit conditions. Spatially correlated noise is introduced to describe stochastic transport perturbations, and the dense-to-porous transition time is evaluated from the evolution of interface roughness arising from the competition between noise-induced transport and surface relaxation. The simulations reveal three distinct roughness evolution regimes. The predicted transition time generally increases from approximately one month at 20% SoC to more than seven months at 80% SoC, with a pronounced change between 55% and 60%. This change corresponds to the graphite SoC-OCV relation, which controls the interfacial Li0 radical concentration through the Nernst condition. Under dynamic SoC conditions caused by irreversible capacity loss, the transition behavior changes as the SoC evolves during storage. These results show that the SoC-OCV relation is central to determining SEI phase stability and the dense-to-porous transition time under open-circuit storage.", "url": "https://arxiv.org/abs/2609.38679", "type": "理论+数值", "summary": "固体电解质界面（SEI）对于电池的长期稳定性至关重要，因为它影响电极和电解质之间的反应。尽管之前有研究，SEI 从致密相到多孔相的演变仍不完全清楚。在这里，我们使用相场框架在开路条件下研究 SEI 的 SoC 相关演化。引入空间相关噪声来描述随机传输扰动，并根据噪声引起的传输和表面弛豫之间的竞争引起的界面粗糙度的演变来评估致密到多孔的转变时间。模拟揭示了三种不同的粗糙度演化机制。预测的转换时间通常从 20% SoC 时的大约 1 个月增加到 80% SoC 时的 7 个月以上，变化在 55% 到 60% 之间。这种变化对应于石墨SoC-OCV关系，该关系通过能斯特条件控制界面Li0自由基浓度。在由不可逆容量损失引起的动态 SoC 条件下，转换行为会随着 SoC 在存储期间的演变而变化。\n\n这些结果表明，SoC-OCV 关系对于确定 SEI 相位稳定性和开路存储下的致密到多孔转变时间至关重要。", "authors": [{"name": "Joonyeob Jeon"}, {"name": "Lukas Kobbing"}, {"name": "Tejs Vegge"}, {"name": "Jin Hyun Chang"}, {"name": "Birger Horstmann"}, {"name": "Ivano Eligio Castelli"}], "featured_authors": [{"name": "Joonyeob Jeon"}, {"name": "Lukas Kobbing"}, {"name": "Tejs Vegge"}, {"name": "Jin Hyun Chang"}, {"name": "Birger Horstmann"}, {"name": "Ivano Eligio Castelli"}], "author_count": 6}, {"id": "2609.38790", "category": "cond-mat", "title": "Synchronous Monte Carlo method and its application to a mean-field spin glass model", "abstract": "Standard Markov chain Monte Carlo methods update variables one at a time to satisfy detailed balance, which prevents them from fully exploiting massively parallel hardware such as graphics processing units (GPUs). We study a Monte Carlo method for systems with pairwise interactions in which all variables are updated simultaneously, made possible by auxiliary Gaussian fields introduced through the Gaussian integral identity. The method satisfies detailed balance and is therefore guaranteed to converge to the canonical distribution. For mean-field spin glasses, its dynamics can be analyzed exactly by dynamical mean-field theory (DMFT). Applying the method and the DMFT to the random orthogonal model, which exhibits a random first-order transition, we find that the fluctuation-dissipation theorem (FDT) is clearly violated below the dynamical transition temperature, and that the relation between response and correlation takes the two-slope form of a generalized FDT, with simulations and theory in quantitative agreement.", "url": "https://arxiv.org/abs/2609.38790", "type": "理论+数值", "summary": "标准马尔可夫链蒙特卡罗方法一次更新一个变量以满足细节平衡，这阻止了它们充分利用大规模并行硬件，例如图形处理单元 (GPU)。我们研究了一种用于具有成对相互作用的系统的蒙特卡罗方法，其中所有变量同时更新，通过高斯积分恒等式引入的辅助高斯场使之成为可能。该方法满足详细平衡，因此保证收敛于正则分布。对于平均场自旋玻璃，可以通过动态平均场理论（DMFT）精确分析其动力学。将该方法和 DMFT 应用于呈现随机一阶转变的随机正交模型，我们发现在动态转变温度以下明显违反波动耗散定理（FDT），并且响应和相关性之间的关系采用广义 FDT 的双斜率形式，模拟和理论在定量上一致。", "authors": [{"name": "Yoshiyuki Kabashima"}], "featured_authors": [{"name": "Yoshiyuki Kabashima"}], "author_count": 1}, {"id": "2609.38843", "category": "cond-mat", "title": "Defect Dynamics and Isomer Quenching in $^{229}$Th:CaF$_2$ Crystals", "abstract": "Thorium-229 doped calcium fluoride ($^{229}$Th:CaF$_2$) is a leading candidate for a solid-state nuclear clock, owing to the unusually low energy of the $^{229}$Th isomer transition at 8.3557\\,eV and the very high banggap of CaF$_2$ around 12\\,eV. Here we report a temperature-dependent study of $^{229}$Th:CaF$_2$ luminescence, covering radioluminescence, photoluminescence, thermoluminescence, and afterglow. Using synchrotron x-ray excitation together with a cryo-vacuum system, we resolve the thermal quenching of the self-trapped exciton (STE) scintillation into its triplet and singlet components, identify eleven thermoluminescence glow peaks together with their associated emission bands, and separate the temperature-dependent components that make up the long-lived afterglow. The trap depths obtained in this way are closely correlated with the temperature dependence of x-ray-induced isomer quenching, including the enhanced isomer yield near \\SI{-60}{\\celsius} and the minimum near \\SI{-80}{\\celsius}, supporting the carrier-trapping picture in which trapped carriers are unavailable to quench the nucleus. Taken together, these results connect the optical and nuclear observables of $^{229}$Th:CaF$_2$ through a unified picture of electron defects and Th-related traps, while providing a comprehensive characterization of the material relevant to solid-state nuclear clock operation.", "url": "https://arxiv.org/abs/2609.38843", "type": "理论", "summary": "钍 229 掺杂氟化钙 ($^{229}$Th:CaF$_2$) 是固态核钟的主要候选者，因为 $^{229}$Th 异构体转变的能量异常低，为 8.3557\\,eV，而 CaF$_2$ 的带隙非常高，约为 12\\,eV。在这里，我们报告了 $^{229}$Th:CaF$_2$ 发光的温度依赖性研究，涵盖放射发光、光致发光、热致发光和余辉。利用同步加速器 X 射线激发和低温真空系统，我们将自俘获激子 (STE) 闪烁的热猝灭分解为三重态和单重态成分，识别了 11 个热释光辉光峰及其相关的发射带，并分离了构成长寿命余辉的温度相关成分。通过这种方式获得的陷阱深度与X射线诱导异构体猝灭的温度依赖性密切相关，包括\\SI{-60}{\\celsius}附近异构体产率的增强和\\SI{-80}{\\celsius}附近的最小值，支持载流子俘获图，其中被俘获的载流子无法猝灭核。\n\n总而言之，这些结果通过电子缺陷和 Th 相关陷阱的统一图像将 $^{229}$Th:CaF$_2$ 的光学和核可观测值联系起来，同时提供与固态核时钟操作相关的材料的全面表征。", "authors": [{"name": "Ming Guan"}, {"name": "Michael Bartokos"}, {"name": "Kjeld Beeks"}, {"name": "Takahiro Hiraki"}, {"name": "Shinji Kitao"}, {"name": "Takahiko Masuda"}, {"name": "Nobumoto Nagasawa"}, {"name": "Koichi Okai"}, {"name": "Ryoichiro Ogake"}, {"name": "Martin Pimon"}, {"name": "Noboru Sasao"}, {"name": "Fabian Schaden"}, {"name": "Thorsten Schumm"}, {"name": "Makoto Seto"}, {"name": "Kenji Tamasaku"}, {"name": "Sayuri Takatori"}, {"name": "Yoshitaka Yoda"}, {"name": "Akihiro Yoshimi"}, {"name": "Koji Yoshimura"}], "featured_authors": [{"name": "Ming Guan"}, {"name": "Michael Bartokos"}, {"name": "Kjeld Beeks"}, {"name": "Yoshitaka Yoda"}, {"name": "Akihiro Yoshimi"}, {"name": "Koji Yoshimura"}], "author_count": 19}, {"id": "2609.38848", "category": "cond-mat", "title": "Quantum quenches of scar states in the Affleck-Kennedy-Lieb-Tasaki model via Clifford augmented tensor network simulation", "abstract": "Clifford augmented methods have emerged as a powerful technique to simulate quantum circuits and many-body systems by exploiting the stabiliser structure found in said systems, whilst additionally enabling one to readily quantify the non-stabilizerness (i.e.\\ magic) present. In this work, we utilise a qudit Clifford augmented simulation method to probe the presence of magic in the Affleck-Kennedy-Lieb-Tasaki (AKLT) model, finding that its ground state and scar states are highly magical as quantified by their Stabiliser Rényi Entropy (SRE). Nevertheless, owing to its low entanglement structure, these states are still readily expressible as a Clifford augmented Matrix Product State with low bond-dimension and moreover may be time-evolved using the Clifford augmented time-dependent variational principle (TDVP) algorithm. We utilise Clifford augmented TDVP to study the string order dynamics in the scar states of the AKLT model after a quench within the Haldane phase to the anti-ferromagnetic Heisenberg Hamiltonian. We observe that there is a decay of string order following the quench, which is more pronounced with increasing bimagnon number. This finding highlights the sensitivity of string order in the AKLT scar states to symmetry-preserving quenches, even when the initial and final Hamiltonians belong to the same topological phase.", "url": "https://arxiv.org/abs/2609.38848", "type": "理论+数值", "summary": "Clifford 增强方法已成为一种强大的技术，通过利用系统中发现的稳定器结构来模拟量子电路和多体系统，同时还使人们能够轻松量化存在的非稳定器（即魔法）。在这项工作中，我们利用 Qudit Clifford 增强模拟方法来探测 Affleck-Kennedy-Lieb-Tasaki (AKLT) 模型中魔法的存在，发现其基态和疤痕状态非常神奇，正如其稳定器 Rényi 熵 (SRE) 所量化的那样。然而，由于其低纠缠结构，这些状态仍然很容易表示为具有低键维数的克利福德增广矩阵积状态，而且可以使用克利福德增广依赖时间变分原理（TDVP）算法进行时间演化。我们利用 Clifford 增强 TDVP 研究 AKLT 模型疤痕状态下的弦序动力学，该模型在 Haldane 相内淬灭至反铁磁海森堡哈密顿量后。我们观察到，淬灭后弦序发生衰减，随着双磁振子数量的增加，这种衰减更加明显。\n\n这一发现强调了 AKLT 疤痕态中的弦序对对称性保持猝灭的敏感性，即使初始和最终的哈密顿量属于相同的拓扑相。", "authors": [{"name": "Azar C. Nakhl"}, {"name": "Ben Harper"}, {"name": "Muhammad Usman"}, {"name": "Thomas Quella"}], "featured_authors": [{"name": "Azar C. Nakhl"}, {"name": "Ben Harper"}, {"name": "Muhammad Usman"}, {"name": "Thomas Quella"}], "author_count": 4}, {"id": "2609.38942", "category": "cond-mat", "title": "First-Principles Study of Two-Dimensional CeN: Interplay between Structural Stability, Electronic Structure, and Magnetism", "abstract": "In this work, the structural stability, and the electronic and magnetic properties of a novel CeN monolayer derived from the (111) surface of bulk rock salt CeN are investigated using first-principles calculations. Dimensional reduction produces substantial changes in the local atomic environment, decreasing the Ce-N coordination from sixfold in the bulk to threefold in the monolayer and shortening the Ce-N bond length, while preserving an essentially planar hexagonal structure. Moreover, the electronic and magnetic properties are significantly modified, which may be useful for practical applications. Both ferromagnetic (FM) and antiferromagnetic (AFM) configurations were investigated and found to be strongly bound, with the FM state slightly lower in energy. The magnetic moments are predominantly localized on the Ce atoms and mainly originated from the Ce 4f states. The electronic structure also exhibits a pronounced dependence on magnetic ordering, highlighting the connection between localized 4f states and the spin-dependent electronic properties of the system. In addition, the calculated elastic properties confirm the mechanical stability of the monolayer, while phonon calculations support its dynamical stability. Ab initio molecular dynamics simulations further indicate that the two-dimensional structure preserves its integrity under finite-temperature conditions. Overall, these results demonstrate that dimensional reduction significantly modifies the structural, electronic, and magnetic behavior of CeN without compromising the stability of the resulting two-dimensional lattice. The combination of structural robustness, localized Ce 4f magnetism, and spin-dependent electronic properties make the CeN monolayer an interesting system for further exploration in two-dimensional magnetism and spin-dependent applications.", "url": "https://arxiv.org/abs/2609.38942", "type": "理论+数值", "summary": "在这项工作中，利用第一性原理计算研究了源自块状岩盐 CeN（111）表面的新型 CeN 单层的结构稳定性以及电子和磁性。尺寸减小会导致局域原子环境发生显着变化，将 Ce-N 配位从块体中的六倍减少到单层中的三倍，并缩短 Ce-N 键长，同时保留基本平面的六方结构。此外，电子和磁性能得到显着改变，这可能对实际应用有用。研究了铁磁（FM）和反铁磁（AFM）构型，发现它们具有很强的束缚性，FM态的能量略低。磁矩主要集中在 Ce 原子上，并且主要源自 Ce 4f 态。电子结构还表现出对磁有序的明显依赖性，突出了局域 4f 态与系统自旋相关电子特性之间的联系。\n\n此外，计算的弹性特性证实了单层的机械稳定性，而声子计算则支持其动态稳定性。从头算分子动力学模拟进一步表明，二维结构在有限温度条件下保持其完整性。总的来说，这些结果表明，尺寸减小显着改变了 CeN 的结构、电子和磁性行为，而不会影响所得二维晶格的稳定性。结构鲁棒性、局域 Ce 4f 磁性和自旋相关电子特性的结合使 CeN 单层成为进一步探索二维磁性和自旋相关应用的有趣系统。", "authors": [{"name": "Jose Mario Galicia Hernandez"}, {"name": "Jose Jorge Rios Ramirez"}, {"name": "Gregorio Hernandez Cocoletzi"}, {"name": "Juan Francisco Rivas Silva"}], "featured_authors": [{"name": "Jose Mario Galicia Hernandez"}, {"name": "Jose Jorge Rios Ramirez"}, {"name": "Gregorio Hernandez Cocoletzi"}, {"name": "Juan Francisco Rivas Silva"}], "author_count": 4}, {"id": "2609.38973", "category": "cond-mat", "title": "Eigenstate thermalization at the edge of the many-body spectrum", "abstract": "It is well-known that thermalization breaks down in presence of an extensive number of symmetries or conservation laws that are mutually compatible or commuting with each other. We ask here how an extensive number of mutually incompatible local symmetries govern eigenstate thermalization (ETH). We will investigate this through models within the class of bond-dependent $\\mathbb{Z}_2$-symmetric quantum spin-$\\frac{1}{2}$ Hamiltonians that naturally admit this structure. This leads to exponentially large degeneracies in the spectrum governed by the incompatible symmetry structure. Here, using spectral diagnostics, we show that non-integrability can survive despite extensively many conserved quantities when they are incompatible. Furthermore, we show that ETH behavior persists deep into the many-body spectral edge due to this structure. In other words, incompatible local symmetries enable a mechanism to obtain enough thermodynamic entropy at low excitation energy densities to make ETH operational or predictive near the ground state.", "url": "https://arxiv.org/abs/2609.38973", "type": "理论", "summary": "众所周知，在存在大量相互兼容或相互交换的对称性或守恒定律的情况下，热化会崩溃。我们在这里询问大量相互不相容的局域对称性如何控制本征态热化（ETH）。我们将通过键相关 $\\mathbb{Z}_2$-对称量子自旋-$\\frac{1}{2}$ 哈密顿量类中的模型来研究这一点，这些哈密顿量自然承认这种结构。这导致由不相容对称结构控制的光谱呈指数级大的简并性。在这里，我们使用光谱诊断表明，尽管存在大量保守量，但当它们不相容时，不可积性仍然可以存在。此外，我们表明，由于这种结构，ETH 行为持续深入到多体谱边缘。换句话说，不相容的局域对称性使得一种机制能够在低激发能量密度下获得足够的热力学熵，从而使 ETH 在基态附近运行或预测。", "authors": [{"name": "Arnav Pushkar"}, {"name": "Pranay Patil"}, {"name": "Soumya Bera"}, {"name": "Masaki Tezuka"}, {"name": "Sumiran Pujari"}], "featured_authors": [{"name": "Arnav Pushkar"}, {"name": "Pranay Patil"}, {"name": "Soumya Bera"}, {"name": "Masaki Tezuka"}, {"name": "Sumiran Pujari"}], "author_count": 5}, {"id": "2609.38994", "category": "cond-mat", "title": "Reference-Measure Freedom of the Effective Hamiltonian: From Stochastic Thermodynamics to the Macroscopic Limit", "abstract": "The effective Hamiltonian (EH), also referred to as the potential of mean force or free-energy landscape, is widely used to describe equilibrium properties and slow dynamics in chemical and softmatter systems. However, the conventional EH has been argued to be ill-defined because it does not transform as a scalar under a change of coordinates. Here, we show that this apparent problem originates from an implicit change of the reference measure (gauge) with respect to which the equilibrium probability density is defined. We formulate the equilibrium measure and the Fokker--Planck equation (FPE) intrinsically on the manifold of slow variables and show that an EH is a scalar function defined with respect to a chosen gauge. Different EHs, including the conventional EH and the diffusion-dependent EH recently proposed in a Riemannian formulation, thus provide different gauge representations of the same intrinsic equilibrium measure and stochastic dynamics. We further show that the gauge choice has an operational meaning: different restraint protocols for the slow variables select different reference measures. Finally, when the equilibrium measure obeys a large-deviation principle in a macroscopic limit, differences among EHs associated with subleading gauges become subleading relative to the large-deviation speed. The leading part of the EH is then determined by the gauge-independent large-deviation rate function, and the corresponding deterministic dynamics is likewise gauge independent.", "url": "https://arxiv.org/abs/2609.38994", "type": "理论", "summary": "有效哈密顿量 (EH)，也称为平均力势或自由能景观，广泛用于描述化学和软物质系统中的平衡特性和慢动力学。然而，传统的 EH 被认为是不明确的，因为它在坐标变化下不会转换为标量。在这里，我们表明，这个明显的问题源于定义平衡概率密度的参考测量（量规）的隐式变化。我们在慢变量流形上本质上制定了平衡测度和福克-普朗克方程 (FPE)，并表明 EH 是相对于所选规范定义的标量函数。不同的 EH，包括传统的 EH 和最近在黎曼公式中提出的扩散相关 EH，因此提供了相同内在平衡测量和随机动力学的不同规范表示。我们进一步表明，规范的选择具有操作意义：慢变量的不同约束协议选择不同的参考措施。\n\n最后，当平衡测度在宏观极限下遵循大偏差原理时，与次领先轨距相关的EH之间的差异相对于大偏差速度而言变得次领先。然后，EH 的主导部分由与规范无关的大偏差率函数确定，并且相应的确定性动力学同样与规范无关。", "authors": [{"name": "Ryuichi Okamoto"}], "featured_authors": [{"name": "Ryuichi Okamoto"}], "author_count": 1}, {"id": "2609.39094", "category": "cond-mat", "title": "Three-Dimensional Topology from Stacking-Controlled Umklapp Scattering in Large-Angle Twisted Graphite", "abstract": "Large-angle twisted graphene lies beyond the local-stacking description of conventional moiré systems: inequivalent rotation centers define distinct commensurate interfaces whose low-energy interlayer hybridization is governed by intervalley Umklapp tunneling. For three-dimensional twisted graphite assembled from interfaces with different crystalline symmetries, a symmetry-constrained effective model reveals that competition between nonchiral and chiral tunneling produces one-ring and two-ring nodal-line phases and a $C_3$-protected higher-order topological insulator in the presence of sublattice (chiral) symmetry. The nodal rings carry integer winding numbers, allowing oppositely wound rings to annihilate into the gapped phase. We further examine how sublattice-symmetry breaking modifies these phases. Density functional theory (DFT) and atomistic calculations for $21.8^\\circ$ twisted graphite identify the equilibrium structure as a higher-order topological insulator, while compression drives it into a topological Weyl semimetal phase. These findings establish the stacking sequence of symmetry-inequivalent interfaces as a means of engineering band topology in three-dimensional twisted structures.", "url": "https://arxiv.org/abs/2609.39094", "type": "理论+数值", "summary": "大角度扭曲石墨烯超出了传统莫尔系统的局部堆叠描述：不等的旋转中心定义了不同的相称界面，其低能层间杂化由间隔 Umklapp 隧道效应控制。对于由不同晶体对称性界面组装而成的三维扭曲石墨，对称约束有效模型表明，非手性和手性隧道效应之间的竞争会在亚晶格（手性）对称性存在的情况下产生一环和二环节点线相以及$C_3$保护的高阶拓扑绝缘体。节环带有整数缠绕数，允许相反缠绕的环消失到有间隙的阶段。我们进一步研究亚晶格对称性破缺如何改变这些相。密度泛函理论 (DFT) 和 $21.8^\\circ$ 扭曲石墨的原子计算将平衡结构识别为高阶拓扑绝缘体，而压缩则将其驱动为拓扑外尔半金属相。\n\n这些发现确立了对称不等价界面的堆叠序列作为三维扭曲结构中能带拓扑工程的一种手段。", "authors": [{"name": "Juncheng Li"}, {"name": "Cong Chen"}, {"name": "Wang Yao"}], "featured_authors": [{"name": "Juncheng Li"}, {"name": "Cong Chen"}, {"name": "Wang Yao"}], "author_count": 3}, {"id": "2609.39231", "category": "cond-mat", "title": "Mixed bubbles in a binary mixture of spin-1 Bose-Einstein condensates", "abstract": "In mean-field theory, the ground state of a two-component Bose-Einstein condensate (BEC) in a uniform system is either uniformly mixed or totally separated. Beyond-mean-field effects introduce an additional phase, the mixed-bubble state, in which the two components remain mixed within one of the separated domains. Here we show that a mixed-bubble state can emerge in a binary mixture of spin-1 ${}^{7}{\\rm{Li}}$ and ${}^{23}{\\rm{Na}}$ BECs even within the mean-field framework. We further demonstrate the existence of a metastable uniformly-mixed state, which undergoes a transition to the mixed-bubble state triggered by a local perturbation.", "url": "https://arxiv.org/abs/2609.39231", "type": "理论", "summary": "在平均场理论中，均匀系统中的二元玻色-爱因斯坦凝聚体（BEC）的基态要么均匀混合，要么完全分离。超平均场效应引入了一个额外的阶段，即混合气泡状态，其中两种成分在一个分离的域内保持混合。在这里，我们证明即使在平均场框架内，混合气泡态也可以出现在自旋 1 ${}^{7}{\\rm{Li}}$ 和 ${}^{23}{\\rm{Na}}$ BEC 的二元混合物中。我们进一步证明了亚稳态均匀混合态的存在，该态经历了由局部扰动触发的向混合气泡态的转变。", "authors": [{"name": "Uyen Ngoc Le"}, {"name": "Ha Phuong Uyen Mai"}, {"name": "Hieu Binh Le"}, {"name": "Hiroki Saito"}], "featured_authors": [{"name": "Uyen Ngoc Le"}, {"name": "Ha Phuong Uyen Mai"}, {"name": "Hieu Binh Le"}, {"name": "Hiroki Saito"}], "author_count": 4}, {"id": "2609.39267", "category": "cond-mat", "title": "Logarithmic Quasi-Long-Range Order and Novel Continuous Phase Transition in the Two-Dimensional $XY$ Model with $1/r^4$ Interaction", "abstract": "We investigate the phase diagram and critical properties of the two-dimensional classical XY model with interactions decaying as $1/r^{2+\\sigma}$. At the marginal case $\\sigma=2$, we show that the low-temperature phase is characterized by logarithmic quasi-long-range order (log-QLRO), where spin correlations decay as a power of the logarithm of distance, $C(r)\\sim(\\ln r)^{-\\eta_\\ell}$ with $\\eta_\\ell\\propto T$, and that the transition into this phase is a continuous transition beyond both the Ginzburg-Landau-Wilson paradigm and the Berezinskii-Kosterlitz-Thouless mechanism. Our analysis combines a near-exact Gaussian spin-wave theory, an adiabatic renormalization-group analysis, and large-scale Monte Carlo simulations. We find that the $1/r^4$ interaction logarithmically modifies the spin-wave stiffness kernel as $\\gamma(k)\\simeq\\kappa k^2\\ln(1/k)$, which suppresses vortex proliferation and gives rise to a nonuniversal correlation-length exponent $\\nu\\propto1/\\sqrt{2\\pi\\kappa}$. Crucially, our simulations reveal that the short-range algebraic QLRO phase is unstable against a weak long-range perturbation for $\\sigma\\le2$. These results establish $\\sigma=2$ as the crossover boundary between the long-range and short-range universality classes and provide a critical evaluation of recent theoretical proposals.", "url": "https://arxiv.org/abs/2609.39267", "type": "理论+数值", "summary": "我们研究了相互作用衰减为 $1/r^{2+\\sigma}$ 的二维经典 XY 模型的相图和关键属性。在边缘情况 $\\sigma=2$ 下，我们表明低温阶段的特征是对数准长程有序 (log-QLRO)，其中自旋相关性随着距离的对数幂而衰减，$C(r)\\sim(\\ln r)^{-\\eta_\\ell}$ 和 $\\eta_\\ell\\propto T$，并且到该阶段的转变是超出Ginzburg-Landau-Wilson 范式和 Berezinskii-Kosterlitz-Thouless 机制。我们的分析结合了近乎精确的高斯自旋波理论、绝热重正化群分析和大规模蒙特卡罗模拟。我们发现$1/r^4$相互作用对自旋波刚度核进行对数修改为$\\gamma(k)\\simeq\\kappa k^2\\ln(1/k)$，这抑制了涡扩散并产生非通用相关长度指数$\\nu\\propto1/\\sqrt{2\\pi\\kappa}$。至关重要的是，我们的模拟表明，短程代数 QLRO 相位对于 $\\sigma\\le2$ 的弱长程扰动是不稳定的。\n\n这些结果将 $\\sigma=2$ 确立为远程和短期普遍性类别之间的交叉边界，并为最近的理论建议提供了批判性评估。", "authors": [{"name": "Xianzhi Pan"}, {"name": "Zhijie Fan"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Xianzhi Pan"}, {"name": "Zhijie Fan"}, {"name": "Youjin Deng"}], "author_count": 3}, {"id": "2609.39299", "category": "cond-mat", "title": "Phase Separation in Fractonic Fluids: Coarsening, Interfaces, Nucleation, and Hyperuniformity in and out of Equilibrium", "abstract": "We develop a theory of phase separation in fluids conserving higher-order multipole moments of a scalar density, and investigate the resulting coarsening dynamics, nucleation, and interfacial fluctuations. We find that higher-order conservation laws slow the relaxation of all phenomena investigated, whereas nonequilibrium violations of the fluctuation--dissipation theorem suppress density and interfacial fluctuations while hindering nucleation. Simulations support these predictions.", "url": "https://arxiv.org/abs/2609.39299", "type": "理论+数值", "summary": "我们发展了一种守恒标量密度高阶多极矩的流体相分离理论，并研究了由此产生的粗化动力学、成核和界面波动。我们发现高阶守恒定律减缓了所有研究现象的弛豫，而违反涨落耗散定理的非平衡破坏抑制了密度和界面涨落，同时阻碍了成核。模拟支持这些预测。", "authors": [{"name": "Raphael Maire"}], "featured_authors": [{"name": "Raphael Maire"}], "author_count": 1}, {"id": "2609.39401", "category": "cond-mat", "title": "Square-root growth of operator entanglement in an integrable brickwork circuit", "abstract": "It is widely expected that the von Neumann entanglement of a local operator grows at most logarithmically in integrable many-body systems in infinite volume. We give a counterexample in a four-state brickwork circuit whose gate is a permutation matrix solving the constant Yang--Baxter equation. The von Neumann operator entropy grows as $(\\log2)\\sqrt{t/\\pi}+O(\\log t)$, whereas fixed-index Rényi entropies grow linearly below index one and logarithmically above it. At fixed relative Hilbert--Schmidt error below one, matrix product operator simulations require a bond dimension growing at least as $\\exp(c\\sqrt t)$ for some $c>0$.", "url": "https://arxiv.org/abs/2609.39401", "type": "理论+数值", "summary": "人们普遍认为，局部算子的冯·诺依曼纠缠在无限体积的可积多体系统中最多呈对数增长。我们给出了一个四态砖砌电路的反例，其门是一个求解常量 Yang--Baxter 方程的置换矩阵。冯诺依曼算子熵随着 $(\\log2)\\sqrt{t/\\pi}+O(\\log t)$ 增长，而固定索引 Rényi 熵在索引 1 下方呈线性增长，在索引 1 上方呈对数增长。在低于 1 的固定相对希尔伯特-施密特误差下，矩阵乘积算子模拟需要键维数至少增长为 $\\exp(c\\sqrt t)$，对于某些 $c>0$。", "authors": [{"name": "Balázs Pozsgay"}], "featured_authors": [{"name": "Balázs Pozsgay"}], "author_count": 1}, {"id": "2609.39404", "category": "cond-mat", "title": "Chiral quantum chaos around exponentially many zero modes in the quantum breakdown model", "abstract": "The quantum breakdown model is a model of randomly interacting fermions, motivated by the physics of dielectric breakdown. Here, we establish classification of symmetry and quantum chaos in a zero-dimensional, all-to-all-interacting version of the quantum breakdown model. It exhibits the $\\mathbb{Z}_4$ periodicity with respect to the number of fermionic modes, reminiscent of the symmetry classification of the Sachdev-Ye-Kitaev model. A unique feature of the quantum breakdown model is that it realizes all the five classes with chiral symmetry and hosts an exponentially large number of many-body zero modes protected by the chiral index. We elucidate the separation and scaling of the spectral gap and demonstrate the symmetry-enriched hard-edge spectral statistics as signatures of quantum chaos in the chiral symmetry classes.", "url": "https://arxiv.org/abs/2609.39404", "type": "理论", "summary": "量子击穿模型是随机相互作用的费米子模型，由介电击穿物理学驱动。在这里，我们在量子击穿模型的零维、全相互作用版本中建立了对称性和量子混沌的分类。它表现出相对于费米子模式数量的 $\\mathbb{Z}_4$ 周期性，让人想起 Sachdev-Ye-Kitaev 模型的对称分类。量子击穿模型的一个独特之处在于，它实现了所有五类手性对称性，并拥有指数级数量的受手性指数保护的多体零模式。我们阐明了光谱间隙的分离和缩放，并证明了对称性丰富的硬边光谱统计作为手性对称类中量子混沌的特征。", "authors": [{"name": "Kohei Kawabata"}, {"name": "Kinya Guan"}, {"name": "Hosho Katsura"}], "featured_authors": [{"name": "Kohei Kawabata"}, {"name": "Kinya Guan"}, {"name": "Hosho Katsura"}], "author_count": 3}, {"id": "2609.39410", "category": "cond-mat", "title": "The hidden side of paintbrushes: a geometry shaped by power laws", "abstract": "Since prehistoric times, painters have used brush-like tools made from animal and plant materials to apply pigments to rock surfaces. Over time, techniques for creating brushes evolved, and converged towards optimized shapes. Our study performed over hundreds of brushes reveals universal scaling laws. In particular, we uncover a relation between bristle length and diameter linked to the shape of the bristle ends, which governs their mechanical response with and without paint. For round brushes, we found that the size of the paint stain scales with the compression distance, meaning it only depends on the force applied by the painter and not on the mechanical responses of the brushes. These results shed light on the underlying universal physical principles governing brush design and their impact on artistic techniques.", "url": "https://arxiv.org/abs/2609.39410", "type": "理论+数值", "summary": "自史前时代以来，画家就使用由动物和植物材料制成的刷子工具将颜料涂在岩石表面。随着时间的推移，创建画笔的技术不断发展，并趋向于优化形状。我们对数百个画笔进行的研究揭示了普遍的缩放定律。特别是，我们发现了刷毛长度和直径之间与刷毛末端形状相关的关系，这决定了它们在有油漆和没有油漆的情况下的机械响应。对于圆形画笔，我们发现油漆污点的大小随着压缩距离的变化而变化，这意味着它仅取决于画家施加的力，而不取决于画笔的机械响应。这些结果揭示了控制画笔设计的基本通用物理原理及其对艺术技巧的影响。", "authors": [{"name": "Raphaelle Taub"}, {"name": "Jérôme Crassous"}, {"name": "Thomas Salez"}, {"name": "Frédéric Restagno"}, {"name": "Christophe Poulard"}], "featured_authors": [{"name": "Raphaelle Taub"}, {"name": "Jérôme Crassous"}, {"name": "Thomas Salez"}, {"name": "Frédéric Restagno"}, {"name": "Christophe Poulard"}], "author_count": 5}, {"id": "2609.39435", "category": "cond-mat", "title": "Giant PhotoMagnetoDiode Effect", "abstract": "We report the observation of a photomagnetodiode effect with a giant rectification ratio of 10 at a magnetic field of 0.1 T. The effect consists of a diode-like dependence of the photocurrent on the applied voltage that emerges in an external magnetic field. Such a pronounced nonreciprocity is observed in high-quality VPE-grown GaAs samples at low temperatures at interband photoexcitation. The photoconductivity is invariant upon reversing the polarity of both electric and magnetic fields. Similar behavior with even higher asymmetry ratio is observed in photoluminescence. The findings are well described by the theory of ambipolar drift of carriers in electric and magnetic fields together with fast surface recombination.", "url": "https://arxiv.org/abs/2609.39435", "type": "理论", "summary": "我们报告了在 0.1 T 磁场下观察到的巨大整流比为 10 的光磁二极管效应。该效应包括光电流对外部磁场中出现的外加电压的类似二极管依赖性。这种明显的非互易性在低温下带间光激发的高质量 VPE 生长的 GaAs 样品中观察到。当电场和磁场的极性反转时，光电导率保持不变。在光致发光中观察到具有更高不对称率的类似行为。电场和磁场中载流子双极漂移以及快速表面复合的理论很好地描述了这些发现。", "authors": [{"name": "V. L. Korenev"}, {"name": "S. A. Tarasenko"}], "featured_authors": [{"name": "V. L. Korenev"}, {"name": "S. A. Tarasenko"}], "author_count": 2}, {"id": "2609.39461", "category": "cond-mat", "title": "The Hidden Topology of Network Entanglement", "abstract": "Topology and geometry are inseparable in physical networks. Here we show that, after factoring out the topology-dependent number of eligible edge pairs, exchangeability makes the mean crossing propensity of those pairs exactly graph independent while preserving topology in fluctuations. We derive a microscopic, parameter-free theory for the response when topology and geometry are coupled. Synthetic and real three-dimensional networks confirm that structure hidden from the normalized mean survives in correlations that determine response.", "url": "https://arxiv.org/abs/2609.39461", "type": "理论", "summary": "物理网络中的拓扑和几何是密不可分的。在这里，我们表明，在分解出与拓扑相关的合格边对数量之后，可交换性使这些边对的平均交叉倾向完全与图无关，同时在波动中保留拓扑。我们推导出拓扑和几何耦合时的响应的微观、无参数理论。合成和真实的三维网络证实，隐藏在归一化平均值之外的结构在决定响应的相关性中仍然存在。", "authors": [{"name": "Debasish Sarker"}], "featured_authors": [{"name": "Debasish Sarker"}], "author_count": 1}, {"id": "2609.39541", "category": "cond-mat", "title": "On the Relation Between the Boson Peak and the Vibrational Phases in Glasses", "abstract": "The boson peak is a vibrational feature commonly found in glassy and disordered systems described as the deviation from the scaling of the Debye model ($g({E}){\\propto}{E}^2$). Despite much interest, the microscopic nature of the vibrations is only anecdotally discussed. Here we report how the boson peak appears in conjunction with a crossover from localized to extended but non-wave-like and coincide with a maximum in phase coherence and spatial periodicity. Our analyses provide new insights into the microscopic origin of the boson peak across a wide range of glasses.", "url": "https://arxiv.org/abs/2609.39541", "type": "理论", "summary": "玻色子峰值是玻璃态和无序系统中常见的振动特征，描述为德拜模型尺度的偏差 ($g({E}){\\propto}{E}^2$)。尽管人们对此很感兴趣，但振动的微观本质仅被非正式地讨论过。在这里，我们报告了玻色子峰值如何与从局部到扩展但非波状的交叉一起出现，并与相位相干性和空间周期性的最大值相一致。我们的分析为各种玻璃中玻色子峰的微观起源提供了新的见解。", "authors": [{"name": "Philip Rasmussen"}, {"name": "Søren S. Sørensen"}], "featured_authors": [{"name": "Philip Rasmussen"}, {"name": "Søren S. Sørensen"}], "author_count": 2}, {"id": "2609.39671", "category": "cond-mat", "title": "An electromechanically coupled multiphase-field model with generalized kinetic relations for ferroelectrics", "abstract": "Classical phase-field models typically use the Allen--Cahn evolution law to model interface motion as a consequence of energy-gradient descent. This implies a linear kinetic relation between the velocity of an interface (e.g., a domain wall in a ferroelectric) and its driving force. When nonlinear kinetic relations are to be modeled, as commonly found in ferroelectric ceramics, an alternative evolution law and hence an alternative model is needed. Here, we propose an electromechanically (stress-driven) coupled multiphase-field framework with a general kinetic formulation, which integrates a prescribed kinetic relation directly into the evolution law. We show that this model correctly evolves domain walls with the assigned nonlinear kinetics, e.g., of mixed exponential-power law type, following the so-called Merz--Stadler law. The multiphase formulation further enables distinct kinetic relations and interfacial energies to be assigned to different order-parameter pairs, which reflects the distinguishable properties of the different types of ferroelectric domain walls. The proposed framework is broadly applicable for simulating kinetic relations in materials with applications beyond ferroelectrics.", "url": "https://arxiv.org/abs/2609.39671", "type": "理论", "summary": "经典相场模型通常使用艾伦-卡恩演化定律来模拟能量梯度下降导致的界面运动。这意味着界面（例如铁电体中的畴壁）的速度与其驱动力之间存在线性动力学关系。当要对非线性动力学关系进行建模时（如铁电陶瓷中常见的那样），需要替代的演化定律，因此需要替代的模型。在这里，我们提出了一种具有通用动力学公式的机电（应力驱动）耦合多相场框架，它将规定的动力学关系直接集成到演化定律中。我们证明，该模型可以按照指定的非线性动力学（例如混合指数幂律类型）正确地演化畴壁，遵循所谓的 Merz-Stadler 定律。多相公式进一步使得不同的动力学关系和界面能能够分配给不同的有序参数对，这反映了不同类型的铁电畴壁的可区分特性。\n\n所提出的框架广泛适用于模拟材料中的动力学关系，其应用超出铁电体。", "authors": [{"name": "Hsu-Cheng Cheng"}, {"name": "Dennis M. Kochmann"}], "featured_authors": [{"name": "Hsu-Cheng Cheng"}, {"name": "Dennis M. Kochmann"}], "author_count": 2}, {"id": "2609.39744", "category": "cond-mat", "title": "Second-order Real Nodal Lines in Nodal Surface Semimetals", "abstract": "Real nodal lines (RNLs) featuring real Chern numbers and second-order boundary modes have attracted widespread attention. In all previously reported realizations, an RNL is linked by another nodal line, and whether an RNL can be linked by other types of band degeneracies has remained open. Here, we propose a second-order real nodal-line semimetal in which a pair of RNLs is linked by a nodal surface. We show that this state can be realized in spinless systems with both $PT$ and nonsymmorphic $S_{2z}T$ symmetries, where the $S_{2z}T$-enforced nodal surface prevents the pair of RNLs from annihilation. Each nodal line carries a nontrivial real Chern number $\\nu_R=1$, giving rise to topological hinge Fermi arcs located at a pair of $PT$-related hinges. Guided by this construction, we identify the interpenetrated graphene network (IGN) as a promising material realization. First-principles calculations confirm that a pair of nodal lines traversing the Brillouin zone are linked by a nodal surface and each nodal line carries double nontrivial $Z_2$ charges. The bulk-boundary correspondence of IGN manifests as a pair of hinge Fermi arcs together with drumhead surface states. Our work establishes nodal surfaces as a new linking partner for real nodal lines and provides a roadmap for exploring higher-order real topology in carbon-based and other light-element systems.", "url": "https://arxiv.org/abs/2609.39744", "type": "理论+数值", "summary": "具有实陈数和二阶边界模式的实节线（RNL）引起了广泛的关注。在所有先前报道的实现中，RNL 是由另一条节线连接的，并且 RNL 是否可以由其他类型的能带简并性连接仍然悬而未决。在这里，我们提出了一种二阶实节点线半金属，其中一对 RNL 通过节点表面连接。我们证明，这种状态可以在具有 $PT$ 和非对称 $S_{2z}T$ 对称性的无自旋系统中实现，其中 $S_{2z}T$ 强制节点表面可防止一对 RNL 湮灭。每条节点线都带有一个非平凡的实数陈数 $\\nu_R=1$，从而产生位于一对 $PT$ 相关铰链处的拓扑铰链费米弧。在这种结构的指导下，我们将互穿石墨烯网络（IGN）确定为一种有前途的材料实现。第一原理计算证实，一对穿过布里渊区的节点线由节点表面连接，并且每条节点线都带有双非平凡的 $Z_2$ 电荷。 IGN 的体边界对应表现为一对铰链费米弧和鼓面表面状态。\n\n我们的工作将节点表面建立为真实节点线的新连接伙伴，并为探索碳基和其他轻元素系统中的高阶真实拓扑提供了路线图。", "authors": [{"name": "Yunye Wang"}, {"name": "Ruopu Zhao"}, {"name": "Tianqi Zhang"}, {"name": "Weikang Wu"}], "featured_authors": [{"name": "Yunye Wang"}, {"name": "Ruopu Zhao"}, {"name": "Tianqi Zhang"}, {"name": "Weikang Wu"}], "author_count": 4}, {"id": "2609.39772", "category": "cond-mat", "title": "Curvature-induced migration of small domains on lipid membranes", "abstract": "Membrane curvature has been shown to bias the location of lipid or protein domains, but the roles of bending rigidity, spontaneous curvature, Gaussian bending modulus, and line tension are difficult to separate in general. We develop a small-domain description for a membrane whose shape is held fixed, e.g. by strong adhesion to a curved substrate. Combining a local Helfrich energy with the small-area isoperimetric expansion gives a position-dependent energy determined by the local mean and Gaussian curvatures. We identify four generic regimes of curvature preference whose boundaries depend on only two dimensionless parameters. On specific membrane shapes with complex curvature, we show that this curvature preference determines the energy landscapes experienced by small domains, which are strongly dependent on the size of the domain through the line tension contribution. For example, on an oblate-shaped membrane, very small domains tend to localize at the poles, whereas larger domains prefer to localize at the equator. Whether this transition is continuous or discontinuous is found to strongly depend on the spontaneous curvature of the domain. This ordering suggests a mechanism by which small domains can collect and coalesce at one location before relocating as they grow.", "url": "https://arxiv.org/abs/2609.39772", "type": "理论", "summary": "膜曲率已被证明会偏置脂质或蛋白质结构域的位置，但弯曲刚度、自发曲率、高斯弯曲模量和线张力的作用通常很难分开。我们为形状固定的膜开发了一个小域描述，例如通过对弯曲基材的强力粘附。将局部赫尔弗里希能量与小面积等周展开相结合，给出由局部平均曲率和高斯曲率确定的位置相关能量。我们确定了曲率偏好的四种通用机制，其边界仅取决于两个无量纲参数。在具有复杂曲率的特定膜形状上，我们表明这种曲率偏好决定了小域所经历的能量景观，这通过线张力贡献强烈依赖于域的大小。例如，在扁圆形膜上，非常小的域倾向于定位在两极，而较大的域倾向于定位在赤道。人们发现这种转变是连续的还是不连续的，很大程度上取决于域的自发曲率。\n\n这种排序提出了一种机制，通过该机制，小域可以在一个位置收集和合并，然后随着它们的增长而重新定位。", "authors": [{"name": "Jaime Agudo-Canalejo"}], "featured_authors": [{"name": "Jaime Agudo-Canalejo"}], "author_count": 1}, {"id": "2609.39811", "category": "cond-mat", "title": "Magnetization relaxation of interacting chains of nanomagnets", "abstract": "We investigate the magnetization dynamics crossover from single-particle to collective behavior in a one-dimensional chain of dipolar-coupled nanomagnets with uniaxial anisotropy. Using both an intermediate-to-high damping (IHD) analytical approach based on Langer's theory and time-quantified Monte Carlo (TQMC) simulations, we derive and validate semi-analytical expressions for the relaxation rate and the magnetization relaxation curves. Our main results include: (i) a closed-form expression for the relaxation rate accounting for (weak) dipolar interactions, (ii) a two-exponential semi-analytical formula for the magnetization dynamics $m(t)$ of an interacting chain, and (iii) a systematic comparison with TQMC simulations, showing good agreement for a wide range of parameters. The analysis reveals a field-controlled crossover from uniform (macrospin-like) reversal to edge-nucleation propagation, driven by the spatial inhomogeneity of dipolar stabilization. The derived expressions provide a computationally efficient framework for predicting the relaxation behavior of dipolar-coupled nanomagnetic assemblies.", "url": "https://arxiv.org/abs/2609.39811", "type": "理论+数值", "summary": "我们研究了具有单轴各向异性的偶极耦合纳米磁体的一维链中从单粒子到集体行为的磁化动力学交叉。使用基于兰格理论的中高阻尼（IHD）分析方法和时间量化蒙特卡罗（TQMC）模拟，我们推导并验证了弛豫率和磁化弛豫曲线的半解析表达式。我们的主要结果包括：(i) 考虑（弱）偶极相互作用的弛豫率的封闭式表达式，(ii) 相互作用链的磁化动力学 $m(t)$ 的双指数半解析公式，以及 (iii) 与 TQMC 模拟的系统比较，显示了各种参数的良好一致性。分析揭示了由偶极稳定的空间不均匀性驱动的从均匀（类宏自旋）反转到边缘成核传播的场控制交叉。导出的表达式提供了一个计算有效的框架，用于预测偶极耦合纳米磁性组件的弛豫行为。", "authors": [{"name": "Denis Ledue"}, {"name": "Renaud Patte"}, {"name": "Francois Vernay"}, {"name": "Hamid Kachkachi"}], "featured_authors": [{"name": "Denis Ledue"}, {"name": "Renaud Patte"}, {"name": "Francois Vernay"}, {"name": "Hamid Kachkachi"}], "author_count": 4}, {"id": "2609.39947", "category": "cond-mat", "title": "Thermal magnon transport in FM/AFM bilayers", "abstract": "Progress in information processing relies on spintronics, where magnetic states serve as efficient carriers for data storage and transfer. In this work, we theoretically study magnon propagation in a bilayer composed of a ferro-magnet and an antiferromagnet. For this purpose, we probe the spin Seebeck effect by introducing a spatially varying temperature profile. This generates a local magnon excitation and a continuous magnon flux from hot to cold regions which we quantify through the resulting non-equilibrium magnon accumulation. Based on the chirality of these modes, we identify specific constraints for magnon modes traveling either from the ferromagnet into the antiferromagnet or vice versa. A key finding is the observation of a thermally triggered spin current in the antiferromagnet, a phenomenon typically absent in bulk antiferromagnets that obey time-reversal symmetry. These results provide important insights into the design of heterostructures for magnonic chirality-selective spin transport.", "url": "https://arxiv.org/abs/2609.39947", "type": "理论", "summary": "信息处理的进步依赖于自旋电子学，其中磁态充当数据存储和传输的有效载体。在这项工作中，我们从理论上研究了由铁磁体和反铁磁体组成的双层中的磁振子传播。为此，我们通过引入空间变化的温度分布来探测自旋塞贝克效应。这会产生局部磁振子激发和从热区域到冷区域的连续磁振子通量，我们通过由此产生的非平衡磁振子积累进行量化。根据这些模式的手性，我们确定了磁振子模式从铁磁体传播到反铁磁体或反之亦然的特定约束。一个关键发现是观察到反铁磁体中热触发的自旋电流，这种现象在遵循时间反转对称性的块状反铁磁体中通常不存在。这些结果为磁波手性选择性自旋输运的异质结构设计提供了重要的见解。", "authors": [{"name": "Moumita Kundu"}, {"name": "Ulrich Nowak"}], "featured_authors": [{"name": "Moumita Kundu"}, {"name": "Ulrich Nowak"}], "author_count": 2}, {"id": "2609.39966", "category": "cond-mat", "title": "Strong Dimerization and Field-Induced Reconstruction of the Low-Energy Spectrum in $\\mathrm{Cu}_3(\\mathrm{OH})_4(\\mathrm{HCO}_2)_2$", "abstract": "We investigate the field-dependent low-energy thermodynamics of the distorted triangular quantum antiferromagnet $\\mathrm{Cu}_3(\\mathrm{OH})_4(\\mathrm{HCO}_2)_2$ using a sector-resolved Superblock Diagonalization Method (SBDM) supplemented by a transfer-matrix treatment of weakly coupled layers. The strong exchange hierarchy, dominated by the Cu1--Cu1 intradimer coupling $J_2=150\\,\\mathrm{K}$, separates a high-energy dimer sector from a much softer magnetic manifold formed predominantly by the Cu2 moments. In the 24-site cluster, sixteen Cu1 spins form the strongly bound sector while eight Cu2 spins remain magnetically active; polarization of these eight spins gives $S^z=4$ compared with $S^z_{\\rm sat}=12$, providing a direct microscopic origin for the one-third magnetization scale. The finite-temperature thermodynamics reveals a non-monotonic field evolution of the low-energy scale: the dominant $C/T$ feature softens with increasing field, reaches a minimum near the field region around $2\\,\\mathrm{T}$, and subsequently hardens as the low-temperature magnetization approaches $M_{\\rm sat}/3$. Temperature and field sweeps thus expose a common field-induced spectral reconstruction, while the strongly reduced entropy reflects the restricted number of thermally active degrees of freedom below the dimer excitation scale. Our results identify strong-dimer-induced reduction of the active magnetic Hilbert space, followed by field-driven reorganization of the residual spin sector, as the common microscopic origin of the one-third magnetic response and the non-monotonic low-temperature thermodynamics.", "url": "https://arxiv.org/abs/2609.39966", "type": "理论+数值", "summary": "我们使用扇区解析的超级块对角化方法（SBDM）并辅以弱耦合层的转移矩阵处理，研究了扭曲三角量子反铁磁体 $\\mathrm{Cu}_3(\\mathrm{OH})_4(\\mathrm{HCO}_2)_2$ 的场相关低能热力学。由 Cu1--Cu1 内二聚体耦合 $J_2=150\\,\\mathrm{K}$ 主导的强交换层次结构将高能二聚体部分与主要由 Cu2 矩形成的更软的磁流形分开。在 24 个位点的簇中，16 个 Cu1 自旋形成强束缚扇区，而 8 个 Cu2 自旋保持磁性活性；与 $S^z_{\\rm sat}=12$ 相比，这八个自旋的极化给出 $S^z=4$，为三分之一磁化尺度提供了直接的微观起源。有限温度热力学揭示了低能尺度的非单调场演化：主要的$C/T$特征随着场的增加而软化，在$2\\,\\mathrm{T}$附近的场区域附近达到最小值，并随后随着低温磁化强度接近$M_{\\rm sat}/3$而变硬。\n\n因此，温度和场扫描揭示了常见的场诱导光谱重建，而强烈降低的熵反映了二聚体激发尺度以下热活性自由度的有限数量。我们的结果确定了强二聚体诱导的活性磁希尔伯特空间的减少，随后是剩余自旋扇区的场驱动重组，这是三分之一磁响应和非单调低温热力学的共同微观起源。", "authors": [{"name": "Sk Saniur Rahaman"}, {"name": "S. R. Hassan"}], "featured_authors": [{"name": "Sk Saniur Rahaman"}, {"name": "S. R. Hassan"}], "author_count": 2}, {"id": "2609.39984", "category": "cond-mat", "title": "Cluster-based Structural Similarity for Dataset Visualization and Data Selection for Machine Learning Interatomic Potentials", "abstract": "Machine learning interatomic potentials (MLIPs) are essential components for accelerating simulation-driven materials design. Data-efficient MLIP training relies on data-selection strategies that maximize structural diversity while limiting computationally expensive first-principles calculations. A key challenge in such strategies is evaluating structural similarity, which involves a trade-off between retaining information on individual atomic environments and reducing computational cost. Here, we propose similarity evaluation methods that achieve both representational fidelity and computational efficiency. Our method represents each structure using a small set of characteristic atomic environments identified by k-medoids clustering and computes pairwise similarity through optimal matching between these representatives or their distributions. Molecular benchmarks demonstrate that our method is approximately 50 times faster than the baseline method while also more clearly distinguishing structures with different chemical compositions. Similarity-based data-selection benchmarks demonstrate that our methods improve the data efficiency and stability of force prediction in MLIPs.", "url": "https://arxiv.org/abs/2609.39984", "type": "理论+数值", "summary": "机器学习原子间势 (MLIP) 是加速模拟驱动的材料设计的重要组成部分。数据高效的 MLIP 训练依赖于数据选择策略，该策略可最大限度地提高结构多样性，同时限制计算成本高昂的第一性原理计算。这种策略的一个关键挑战是评估结构相似性，这涉及保留单个原子环境的信息和降低计算成本之间的权衡。在这里，我们提出了同时实现表征保真度和计算效率的相似性评估方法。我们的方法使用由 k-medoids 聚类识别的一小组特征原子环境来表示每个结构，并通过这些代表或其分布之间的最佳匹配来计算成对相似性。分子基准测试表明，我们的方法比基线方法快约 50 倍，同时还可以更清晰地区分具有不同化学成分的结构。基于相似性的数据选择基准表明，我们的方法提高了 MLIP 中力预测的数据效率和稳定性。", "authors": [{"name": "Yuto Iwasaki"}, {"name": "Miguel A. Caro"}], "featured_authors": [{"name": "Yuto Iwasaki"}, {"name": "Miguel A. Caro"}], "author_count": 2}, {"id": "2609.39990", "category": "cond-mat", "title": "Minimizing capture time with many small traps in heterogeneous media", "abstract": "We study the problem of optimally placing a large number of small absorbing traps to minimize the mean first-passage time (MFPT) of particles diffusing in a heterogeneous medium with space-dependent diffusivity $D(x)$ and prescribed initial particle distribution $\\omega(x)$. In two and three dimensions we identify two distinct regimes, depending on how strongly the trap ensemble depletes the particles. In the weak trapping regime (fewer traps) the optimal trap density $\\rho$ is the arithmetic average $\\rho = \\frac12(\\mu+\\omega)$ of the normalized inverse diffusivity $\\mu \\propto 1/D$ and the initial particle distribution $\\omega$. In the strong trapping regime (more traps), it is proportional to their geometric average, $\\rho \\propto \\sqrt{\\mu \\omega}$. We revisit the classical Green's function approach and show that it applies to weak trapping only; in 2D this requires the trap size to be exponentially small in the number of traps, so that most applications of interest fall in the strong trapping regime instead. We therefore develop a homogenization approach that captures both regimes. A special choice of initial particle distribution is $\\omega \\propto 1/D$, which corresponds to the equilibrium particle distribution in the absence of traps according to the Itô interpretation. In this case we show that the optimal trap distribution is the stationary particle distribution itself, regardless of the trapping strength, and this makes the MFPT constant throughout the domain; the same trap distribution also minimizes the worst-case capture time. Finally, in one dimension we find instead $\\rho\\propto\\left(\\mu \\omega\\right) ^{1/3}$, and a similar analysis covers space-dependent drift and thin domains of variable cross-section. Direct numerical optimization confirms the analytical results.", "url": "https://arxiv.org/abs/2609.39990", "type": "数值", "summary": "我们研究了优化放置大量小型吸收陷阱的问题，以最小化在具有空间相关扩散率 $D(x)$ 和指定初始粒子分布 $\\omega(x)$ 的异质介质中扩散的粒子的平均首次通过时间 (MFPT)。在二维和三维中，我们确定了两种不同的状态，具体取决于陷阱集合消耗粒子的强度。在弱捕获状态（较少捕获）中，最佳捕获密度 $\\rho$ 是归一化逆扩散率 $\\mu \\propto 1/D$ 和初始粒子分布 $\\omega$ 的算术平均值 $\\rho = \\frac12(\\mu+\\omega)$ 。在强捕获机制（更多捕获）中，它与它们的几何平均值 $\\rho \\propto \\sqrt{\\mu \\omega}$ 成正比。我们重新审视经典的格林函数方法，并表明它仅适用于弱捕获；在二维中，这要求陷阱尺寸在陷阱数量中呈指数级小，因此大多数感兴趣的应用都落在强陷阱状态中。因此，我们开发了一种能够捕获这两种情况的同质化方法。\n\n初始粒子分布的一个特殊选择是 $\\omega \\propto 1/D$，它对应于根据 Itô 解释在没有陷阱的情况下的平衡粒子分布。在这种情况下，我们表明最佳捕获分布是静止粒子分布本身，无论捕获强度如何，这使得 MFPT 在整个域中保持恒定；相同的陷阱分布还可以最大限度地减少最坏情况的捕获时间。最后，在一维中我们发现 $\\rho\\propto\\left(\\mu \\omega\\right) ^{1/3}$，并且类似的分析涵盖了空间相关的漂移和可变横截面的薄域。直接数值优化证实了分析结果。", "authors": [{"name": "Denis S. Grebenkov"}, {"name": "Theodore Kolokolnikov"}], "featured_authors": [{"name": "Denis S. Grebenkov"}, {"name": "Theodore Kolokolnikov"}], "author_count": 2}, {"id": "2609.40002", "category": "cond-mat", "title": "Entropy-Driven Altermagnetism from Thermal Magnons", "abstract": "We identify a route to altermagnetism driven by entropy upon heating and demonstrate it in a minimal square-lattice antiferromagnet. An exchange modulation is entropically favored because the resulting momentum-dependent magnon splitting increases the magnon entropy, thereby lowering the free energy and favoring altermagnetism. We derive an instability criterion for this exchange-modulated state, predict its temperature-driven reentrant behavior, and show that its overlap with Néel order defines a finite-temperature altermagnetic phase. Variational spin-wave theory, spin--lattice Monte Carlo, and cluster diagonalization establish the entropy-driven instability and its coexistence with magnetic order. The resulting state supports a transverse spin conductivity. The mechanism provides a route to thermally induced altermagnetism in compensated magnets coupled to sufficiently soft physical modes.", "url": "https://arxiv.org/abs/2609.40002", "type": "理论+数值", "summary": "我们确定了一条由加热时的熵驱动的交变磁性途径，并在最小方格反铁磁体中进行了演示。交换调制在熵上是有利的，因为由此产生的动量相关磁振子分裂增加了磁振子熵，从而降低了自由能并有利于交变磁性。我们推导出这种交换调制态的不稳定准则，预测其温度驱动的重入行为，并表明其与尼尔阶的重叠定义了有限温度交变磁相。变分自旋波理论、自旋晶格蒙特卡罗和簇对角化建立了熵驱动的不稳定性及其与磁序的共存。所得状态支持横向自旋传导性。该机制提供了一种在耦合到足够软的物理模式的补偿磁体中产生热感应交变磁性的途径。", "authors": [{"name": "Tanaya Halder"}, {"name": "Ashis K. Nandy"}, {"name": "Anamitra Mukherjee"}], "featured_authors": [{"name": "Tanaya Halder"}, {"name": "Ashis K. Nandy"}, {"name": "Anamitra Mukherjee"}], "author_count": 3}, {"id": "2609.40004", "category": "cond-mat", "title": "Many-body topology in parity-preserving tensor networks", "abstract": "Planar parity-preserving tensor networks (ppTNs) admit a fermionic formulation in which the Gaussian, efficiently contractible limit is deformed by local interactions. We investigate how many-body methods can be used to analyze such contractions in a minimal two-parameter ppTN. Its contraction is simultaneously an interacting fermionic partition function, a loop gas, a deformed toric-code norm, and a quartic Ising model, allowing the same phase diagram to be approached with complementary tools. At its center lies a `topological island', characterized beyond the Gaussian limit by a boundary-twist $\\mathbb Z_2$ indicator that reduces to Chern-number parity and admits a loop-winding interpretation under duality. Fermionic perturbation theory predicts the interacting phase boundaries, tensor-network numerics establish their critical behavior, and the loop and spin descriptions reveal a self-dual line with a $c=1$ four-state-Potts multicritical fixed point.", "url": "https://arxiv.org/abs/2609.40004", "type": "理论+数值", "summary": "平面保偶性张量网络（ppTN）采用费米子公式，其中高斯有效收缩极限因局部相互作用而变形。我们研究了如何使用多体方法来分析最小二参数 ppTN 中的此类收缩。它的收缩同时是相互作用的费米子配分函数、循环气体、变形环面码范数和四次伊辛模型，允许使用补充工具来接近相同的相图。其中心是一个“拓扑岛”，其特征是超出高斯极限的边界扭曲 $\\mathbb Z_2$ 指标，可简化为陈数宇称并允许对偶下的循环解释。费米子微扰理论预测了相互作用的相边界，张量网络数值确定了它们的临界行为，循环和自旋描述揭示了一条具有 $c=1$ 四状态 Potts 多临界不动点的自对偶线。", "authors": [{"name": "Maksimilian Usoltcev"}, {"name": "Nguyen Hanh Dung"}, {"name": "Carolin Wille"}, {"name": "Matteo Rizzi"}, {"name": "Alexander Altland"}], "featured_authors": [{"name": "Maksimilian Usoltcev"}, {"name": "Nguyen Hanh Dung"}, {"name": "Carolin Wille"}, {"name": "Matteo Rizzi"}, {"name": "Alexander Altland"}], "author_count": 5}, {"id": "2609.40053", "category": "cond-mat", "title": "Impurity-induced Friedel oscillations and Wigner crystallization in Luttinger liquids via Unified Field Bosonization Technique", "abstract": "We present an analytical study of impurity-induced density correlations in interacting one-dimensional Luttinger liquids using the Unified Field Bosonization Technique (UFBT). Unlike conventional approaches that treat impurities perturbatively, UFBT incorporates localized impurities exactly at the free-fermion level while treating interactions non-perturbatively. Closed analytical expressions for fermionic Green functions and density-density correlation functions are obtained for strongly inhomogeneous systems, enabling a unified description of the impurity-induced $2k_F$ Friedel oscillations and the $4k_F$ Wigner-crystal like correlations. The corresponding scaling behaviour is derived analytically, revealing a crossover in the dominant long-distance correlations at $g=1/3$: Friedel correlations dominate for $g>1/3$, whereas Wigner-crystal like correlations become dominant for $g<1/3$, corresponding to the regime of sufficiently strong repulsive interactions. A reflection-coupled harmonic analysis is developed to account for the left-right mixing induced by impurity backscattering and to consistently reproduce the resulting density correlations. The spinless limit is also obtained as a direct reduction of the spinful formulation. These results provide an analytically controlled framework for describing impurity-induced and interaction-driven density correlations in strongly inhomogeneous one-dimensional quantum systems.", "url": "https://arxiv.org/abs/2609.40053", "type": "理论", "summary": "我们使用统一场玻色化技术（UFBT）对相互作用的一维卢廷格液体中杂质引起的密度相关性进行了分析研究。与以微扰方式处理杂质的传统方法不同，UFBT 精确地在自由费米子水平上合并局部杂质，同时以非微扰方式处理相互作用。对于强非均匀系统，获得了费米子格林函数和密度-密度相关函数的闭合解析表达式，从而能够统一描述杂质引起的 $2k_F$ 弗里德尔振荡和 $4k_F$ 维格纳晶体相关性。相应的标度行为是通过分析得出的，揭示了在 $g=1/3$ 处占主导地位的长距离相关性的交叉：弗里德尔相关性在 $g>1/3$ 时占主导地位，而维格纳晶体相关性在 $g<1/3$ 时占主导地位，对应于足够强的排斥相互作用的状态。开发了反射耦合谐波分析来解释杂质反向散射引起的左右混合，并一致地再现所得的密度相关性。\n\n无旋转极限也可以通过直接减少旋转公式来获得。这些结果提供了一个分析控制框架，用于描述强非均匀一维量子系统中杂质引起和相互作用驱动的密度相关性。", "authors": [{"name": "Soundarya P"}, {"name": "Venkata Suryanarayana M"}, {"name": "Joy Prakash Das"}], "featured_authors": [{"name": "Soundarya P"}, {"name": "Venkata Suryanarayana M"}, {"name": "Joy Prakash Das"}], "author_count": 3}, {"id": "2609.40060", "category": "cond-mat", "title": "A latent-space extrapolation grade built into graph atomic cluster expansion foundation potentials", "abstract": "Foundation machine-learning interatomic potentials cover broad configurational and chemical spaces, but their reliability can vary across the atomic environments encountered during a simulation. Here we introduce the calibrated Mahalanobis (CALM) extrapolation grade $\\gamma$, a piecewise differentiable per-atom quantity integrated into GRACE foundation models and evaluated alongside energies and forces in a single model pass. We define $\\gamma$ from nearest-cluster Mahalanobis distances in latent feature space, setting $\\gamma=1$ from the training-distance distribution separately for each element and cluster. Controlled tests show that a normalized random projection of the invariant many-body basis detects structural and chemical extrapolation. On different foundation datasets, OMat24 and SMAX, $\\gamma$ correlates with atomic force errors and separates structures with different error distributions. The CALM grade adds percent-level computational cost, and its spatial gradient guides uncertainty-biased data collection toward configurations with larger absolute force errors.", "url": "https://arxiv.org/abs/2609.40060", "type": "理论+数值", "summary": "基础机器学习原子间势涵盖广泛的构型和化学空间，但它们的可靠性可能因模拟过程中遇到的原子环境而异。在这里，我们介绍了校准的马哈拉诺比斯 (CALM) 外推等级 $\\gamma$，这是一个分段可微的每原子量，集成到 GRACE 基础模型中，并在单个模型传递中与能量和力一起进行评估。我们从潜在特征空间中的最近簇马哈拉诺比斯距离定义$\\gamma$，并从每个元素和簇的训练距离分布中分别设置$\\gamma=1$。受控测试表明，不变多体基础的归一化随机投影可以检测结构和化学外推。在不同的基础数据集 OMat24 和 SMAX 上，$\\gamma$ 与原子力误差相关，并分离具有不同误差分布的结构。 CALM 等级增加了百分比级计算成本，其空间梯度引导不确定性偏向的数据收集朝向具有较大绝对力误差的配置。", "authors": [{"name": "Yury Lysogorskiy"}, {"name": "Anton Bochkarev"}, {"name": "Ralf Drautz"}], "featured_authors": [{"name": "Yury Lysogorskiy"}, {"name": "Anton Bochkarev"}, {"name": "Ralf Drautz"}], "author_count": 3}, {"id": "2609.40065", "category": "cond-mat", "title": "Topological Transverse Transport without a Gap in Critical Topological Flat Bands", "abstract": "Quantized Hall transport is traditionally anchored to a bulk spectral gap, which isolates the occupied subspace and exponentially suppresses thermal deviations. Recently discovered critical topological flat bands (CTFBs) challenge this paradigm: an exactly flat band touches a dispersive continuum while retaining a well-defined integer Chern number. However, their finite-temperature transverse transport properties remain entirely unexplored. Here, we develop a low-temperature theory of the intrinsic electrical, thermoelectric, and thermal Hall responses in CTFBs. At fixed particle number, the macroscopic flat-band degeneracy forces a singular Lambert-$W$ drift of the chemical potential, generating an algebraic-logarithmic hierarchy of low-temperature corrections: $T\\ln(1/T)$ for electrical Hall, $T[\\ln(1/T)]^2$ for thermoelectric Hall, and $T[\\ln(1/T)]^3$ for thermal Hall conductivity, replacing the activated thermal protection of a gapped Chern insulator. By contrast, externally pinning the chemical potential to the flat-band energy locks the flat band to half occupation at any nonzero temperature, obstructing the recovery of the fully filled topological ground state as $T\\to0^+$. Our results establish that a bulk spectral gap is unnecessary for zero-temperature Hall quantization, but indispensable for its exponential thermal protection.", "url": "https://arxiv.org/abs/2609.40065", "type": "理论", "summary": "量子化霍尔传输传统上锚定在大块光谱间隙上，该间隙隔离所占据的子空间并以指数方式抑制热偏差。最近发现的临界拓扑平坦能带（CTFB）挑战了这一范式：完全平坦的能带接触色散连续体，同时保留明确定义的整数陈数。然而，它们的有限温度横向传输特性仍然完全未被探索。在这里，我们开发了 CTFB 中固有电、热电和热霍尔响应的低温理论。在固定粒子数下，宏观平带简并性迫使化学势发生奇异的 Lambert-$W$ 漂移，生成低温校正的代数对数层次结构：电霍尔 $T\\ln(1/T)$，热电霍尔 $T[\\ln(1/T)]^2$，热霍尔电导率 $T[\\ln(1/T)]^3$，取代了有间隙陈绝缘体的激活热保护。相比之下，从外部将化学势固定到平带能量会在任何非零温度下将平带锁定到一半占据，从而阻碍完全填充的拓扑基态恢复为 $T\\to0^+$。\n\n我们的结果表明，大光谱间隙对于零温霍尔量子化来说是不必要的，但对于其指数热保护是必不可少的。", "authors": [{"name": "Chang-geun Oh"}, {"name": "Tomoki Ozawa"}, {"name": "Jun-Won Rhim"}], "featured_authors": [{"name": "Chang-geun Oh"}, {"name": "Tomoki Ozawa"}, {"name": "Jun-Won Rhim"}], "author_count": 3}, {"id": "2609.40104", "category": "cond-mat", "title": "A Different Perspective on Superconductivity in Crystalline Graphene: Exploiting Energetics", "abstract": "A central mystery of crystalline graphene is why superconductivity is so widespread yet often confined to strange slivers near boundaries between distinct isospin-ordered metals. In this paper, we apply a ``two-parent'' energetic framework which we show can explain this unusual form of superconductivity \\textit{without} specifying the details of the necessarily present pairing attraction. First-order transitions are crucial here: when two normal isospin-ordered states are degenerate in free energy, even a small net superconducting energy gain may stabilize an equilibrium superconductor. We demonstrate how this is possible even though the small energy gain from pairing is reduced by the expense of reconstructing the normal metal, which is needed to achieve superconducting compatibility. The first order degeneracy also gives superconductivity a choice between two normal state parents, favoring the state with the largest net free energy gain.", "url": "https://arxiv.org/abs/2609.40104", "type": "理论", "summary": "结晶石墨烯的一个核心谜团是，为什么超导性如此广泛，但往往局限于不同同位旋有序金属之间边界附近的奇怪薄片。在本文中，我们应用了“双亲”能量框架，我们证明该框架可以解释这种不寻常的超导形式\\textit{而无需指定必然存在的配对吸引力的细节。一阶跃迁在这里至关重要：当两个正常的同位旋有序态在自由能中简并时，即使很小的净超导能量增益也可以稳定平衡超导体。我们证明了这是如何可能的，即使配对产生的小能量增益因重建普通金属的费用而减少，这是实现超导兼容性所必需的。一阶简并性还使超导性可以在两个正常状态母体之间进行选择，有利于净自由能增益最大的状态。", "authors": [{"name": "Ke Wang"}, {"name": "Shicong Song"}, {"name": "K. Levin"}], "featured_authors": [{"name": "Ke Wang"}, {"name": "Shicong Song"}, {"name": "K. Levin"}], "author_count": 3}, {"id": "2609.40109", "category": "cond-mat", "title": "Probing Collective and Individual Kondo Screening: Multi-Stage, Multi-Channel Kondo Effects in a $C_3$-Symmetric Four-Impurity Model", "abstract": "Collective screening has been proposed to underlie the basic physics of multi-impurity and lattice Kondo systems. But how to establish this picture and distinguish it from individual (local) Kondo screening remains a grand challenge. The recently developed auxiliary-bath numerical renormalization group (AUNRG) method provides a key step towards resolving this issue. Its application to the $C_3$-symmetric three-impurity Kondo (3IK) model with a shared electron bath reveals fully screened Fermi liquid ground states arising from collective screening of cluster spin degrees of freedom at small Kondo coupling $J_{\\rm K}$ and individual (local) screening of local impurities at large $J_{\\rm K}$. Here we design a four-impurity Kondo (4IK) model where the probe impurity couples only to the original three Kondo impurities to detect the nature of the screened states. We show that the collective and individual Kondo screenings give rise to emergent multi-stage, two-channel Kondo effect and unstable three-channel Kondo effect, respectively. This suggests a special helicity structure of the screened states and confirms the idea of collective screening in multi-impurity Kondo systems. Our work also demonstrates that the same auxiliary-bath construction can be readily extended to models with additional impurities to explore novel many-body quantum states with emergent cluster degrees of freedom.", "url": "https://arxiv.org/abs/2609.40109", "type": "理论+数值", "summary": "集体筛选已被提议作为多杂质和晶格近藤系统的基础物理基础。但如何建立这种形象并将其与个人（本地）近藤放映区分开来仍然是一个巨大的挑战。最近开发的辅助浴数值重正化群（AUNRG）方法为解决这一问题迈出了关键一步。其在具有共享电子浴的 $C_3$ 对称三杂质 Kondo (3IK) 模型中的应用揭示了完全筛选的费米液态基态，这是由于对小 Kondo 耦合 $J_{\\rm K}$ 处团簇自旋自由度的集体筛选和对大 $J_{\\rm K}$ 处局部杂质的单独（局部）筛选而产生的。在这里，我们设计了一个四杂质近藤（4IK）模型，其中探针杂质仅与原始的三种近藤杂质耦合以检测筛选状态的性质。我们表明，集体和个人近藤放映分别会产生紧急的多阶段、两通道近藤效应和不稳定的三通道近藤效应。这表明了筛选态的特殊螺旋结构，并证实了多杂质近藤系统中集体筛选的想法。\n\n我们的工作还表明，相同的辅助浴结构可以很容易地扩展到具有额外杂质的模型，以探索具有新兴簇自由度的新颖的多体量子态。", "authors": [{"name": "Danqing Hu"}, {"name": "Jiangfan Wang"}, {"name": "Zixiang Hu"}, {"name": "Yi-feng Yang"}], "featured_authors": [{"name": "Danqing Hu"}, {"name": "Jiangfan Wang"}, {"name": "Zixiang Hu"}, {"name": "Yi-feng Yang"}], "author_count": 4}, {"id": "2609.40113", "category": "cond-mat", "title": "Liquid crystalline order and its impact on shape evolution of fluid lipid membranes", "abstract": "Dynamic approaches to minimize the classical curvature-elasticity free energy for a fluid lipid membrane, are extended towards a Surface Beris--Edwards--Helfrich model. This extension explicitly treats the liquid crystal structure of the membrane, which results from the lipid molecules, that are, on average, oriented normal
