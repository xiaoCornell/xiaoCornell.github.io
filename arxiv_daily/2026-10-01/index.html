s, which can be reduced to the implementation of element-wise polynomials through polynomial approximation. Existing works establish the feasibility of transformations and improve query or auxiliary-space efficiency, but circuit depth remains linear in scale with degree. In this work, we develop a resource-tunable quantum framework that decomposes a $(2^d-1)$-degree polynomial into $m$ lower-degree factors, with $m$ controlling the degree of parallelism. By varying $m$ from $1$ to $2^d-1$, the framework provides a trade-off among query complexity, additional gate complexity, ancilla count, and normalization, ranging from a binary-tree implementation to a $\\mathcal{O}(n+d)$-depth construction with highly parallel oracle queries that match the query lower bound. The effects of polynomial approximation and implementation errors are further analyzed. We demonstrate the framework for nonlinear activation functions such as sigmoid and tanh, as well as pixel-wise image transformations.", "url": "https://arxiv.org/abs/2609.39295", "type": "理论+数值", "summary": "非线性变换在量子机器学习和其他量子数值应用中很重要，可以通过多项式近似简化为逐元素多项式的实现。现有的工作建立了转换的可行性并提高查询或辅助空间的效率，但电路深度与程度的比例保持线性。在这项工作中，我们开发了一个资源可调的量子框架，它将 $(2^d-1)$ 次多项式分解为 $m$ 个较低次因子，其中 $m$ 控制并行度。通过将 $m$ 从 $1$ 更改为 $2^d-1$，该框架提供了查询复杂性、附加门复杂性、辅助计数和规范化之间的权衡，范围从二叉树实现到 $\\mathcal{O}(n+d)$ 深度构造，以及与查询下限匹配的高度并行 Oracle 查询。进一步分析了多项式近似和实现误差的影响。我们演示了非线性激活函数（例如 sigmoid 和 tanh）以及像素级图像变换的框架。", "authors": [{"name": "Chunlin Yang"}, {"name": "Yuqi Li"}, {"name": "Hongmei Yao"}, {"name": "Zhaobing Fan"}], "featured_authors": [{"name": "Chunlin Yang"}, {"name": "Yuqi Li"}, {"name": "Hongmei Yao"}, {"name": "Zhaobing Fan"}], "author_count": 4}, {"id": "2609.39328", "category": "quant-ph", "title": "Information Potential: A Variational Approach to Quantum Information Complexity", "abstract": "Quantum information complexity (QIC), introduced by Touchette [Touchette, STOC 2015], has been shown to be one of the most powerful methods for proving quantum communication complexity and has also been shown to be equal to amortized quantum communication complexity. Unfortunately, QIC is generally hard to analyze because it is a sum of quantum conditional mutual information terms, which are difficult to estimate. In this work, we introduce a new variational approach, the information potential, for analyzing QIC and proving quantum communication lower bounds inspired by the resolvent representation for quantum relative entropy. This approach connects the QIC of individual messages to a quadratic form, making it more amenable and thus enables us to bound the cumulative positive increments of the potential throughout an interactive quantum protocol by its QIC. Lower bounds on the growth of the potential therefore translate into lower bounds on both QIC and quantum communication complexity. As an application, we give an optimal $\\Omega(1/r)$ lower bound on the QIC of the two-bit $\\mathsf{AND}$ function as well as an optimal $\\Omega(n/r)$ lower bound on the quantum communication complexity of $r$-round Set-Disjointness, answering an open problem in~[Braverman, Garg, Ko, Mao, Touchette FOCS 2015]. Moreover, we further prove a direct-sum theorem for bounded-round quantum communication complexity of Set Disjointness. With the tight bound on the QIC of $\\mathsf{AND}$ function, we further establish a nearly tight tradeoff for the asymmetric quantum communication complexity of $\\mathsf{Set} \\mathsf{Disjointness}$: $(q_A+1)(q_B+1)=\\Omega(n)$, where $q_A$ and $q_B$ denote the total numbers of qubits sent by Alice and Bob, respectively.", "url": "https://arxiv.org/abs/2609.39328", "type": "理论+数值", "summary": "Touchette [Touchette, STOC 2015] 提出的量子信息复杂性（QIC）已被证明是证明量子通信复杂性的最强大方法之一，并且也被证明等于摊销量子通信复杂性。不幸的是，QIC 通常很难分析，因为它是量子条件互信息项的总和，很难估计。在这项工作中，我们引入了一种新的变分方法，即信息势，用于分析 QIC 并证明受量子相对熵的解析表示启发的量子通信下界。这种方法将单个消息的 QIC 连接到二次形式，使其更易于使用，从而使我们能够通过其 QIC 来限制整个交互式量子协议中势能的累积正增量。因此，潜力增长的下限转化为 QIC 和量子通信复杂性的下限。\n\n作为一个应用，我们给出了两位 $\\mathsf{AND}$ 函数的 QIC 的最优 $\\Omega(1/r)$ 下界，以及 $r$ 轮集合不相交的量子通信复杂性的最优 $\\Omega(n/r)$ 下界，回答了~[Braverman, Garg, Ko, Mao, Touchette FOCS 2015]中的一个开放问题。此外，我们进一步证明了集合不相交的有界量子通信复杂度的直和定理。通过 $\\mathsf{AND}$ 函数 QIC 的紧界，我们进一步为 $\\mathsf{Set} \\mathsf{Disjointness}$ 的非对称量子通信复杂性建立近乎紧的权衡：$(q_A+1)(q_B+1)=\\Omega(n)$，其中 $q_A$ 和 $q_B$ 分别表示 Alice 和 Bob 发送的量子比特总数。", "authors": [{"name": "Penghui Yao"}, {"name": "Yifan Zhou"}], "featured_authors": [{"name": "Penghui Yao"}, {"name": "Yifan Zhou"}], "author_count": 2}, {"id": "2609.39332", "category": "quant-ph", "title": "Complete product-state contact set and optimality of the canonical three-qubit Shifts witness", "abstract": "For the three-qubit Shifts unextendible product basis (UPB), the minimum product-state expectation value $\\lambda_{\\mathrm{Shifts}}=1-3\\sqrt6/8$ of the UPB projector is known, and four attaining product states were exhibited previously. We determine the complete equality set over all complex product states and prove that it consists of exactly eight product rays: two rays invariant under cyclic permutation of the three qubits and two cyclic orbits of size three. The proof combines exact phase analysis, a Gröbner-basis classification of all 28 finite real stationary points, and a complete treatment of the projective boundaries. Crucially, the eight contact rays span the full three-qubit Hilbert space, whereas the four previously known rays do not. The complete equality classification therefore establishes that the associated projector witness satisfies the spanning criterion and is optimal in the sense that no nonzero positive semidefinite operator can be subtracted while preserving block positivity. As a corollary, for the white-noise family $\\rho(p)=(1-p)\\rho_{\\mathrm{Shifts}}+p\\mathbb I/8$, where $\\rho_{\\mathrm{Shifts}}$ is the complementary-projector Shifts state, the same witness detects entanglement for $p<2-3\\sqrt6/4\\approx16.29\\%$.", "url": "https://arxiv.org/abs/2609.39332", "type": "理论", "summary": "对于三量子位移位不可扩展乘积基础（UPB），UPB投影仪的最小乘积状态期望值 $\\lambda_{\\mathrm{Shifts}}=1-3\\sqrt6/8$ 是已知的，并且之前展示了四种达到的乘积状态。我们确定了所有复杂乘积状态的完整等式集，并证明它恰好由八条乘积射线组成：在三个量子位的循环排列下两条不变的射线和两个大小为三的循环轨道。该证明结合了精确的相位分析、所有 28 个有限实驻点的 Gröbner 基础分类以及射影边界的完整处理。至关重要的是，八条接触射线跨越了整个三量子位希尔伯特空间，而之前已知的四种射线则不然。因此，完整的等式分类确定相关的投影仪见证满足跨越标准，并且在保持块正性的同时不能减去非零正半定算子的意义上是最优的。\n\n作为推论，对于白噪声族 $\\rho(p)=(1-p)\\rho_{\\mathrm{Shifts}}+p\\mathbb I/8$，其中 $\\rho_{\\mathrm{Shifts}}$ 是互补投影仪 Shifts 状态，同一证人检测到 $p<2-3\\sqrt6/4\\approx16.29\\%$ 的纠缠。", "authors": [{"name": "Bing-Dong Wan"}, {"name": "Yu-Chen Guo"}], "featured_authors": [{"name": "Bing-Dong Wan"}, {"name": "Yu-Chen Guo"}], "author_count": 2}, {"id": "2609.39345", "category": "quant-ph", "title": "Constant-Overhead Injection into Quantum Codes", "abstract": "We construct the first known fault-tolerant scheme for injecting states into quantum error-correcting codes with constant space and time overhead. That is, we construct a family of constant-rate quantum error-correcting codes for which a set of bare physical qubits can be injected, i.e. fault-tolerantly encoded, into a code block. Similarly, a code state can be ejected, i.e. fault-tolerantly decoded, back into bare physical qubits. We show that these injection and ejection procedures succeed under circuit-level locally stochastic noise, while incurring just a small constant probability of corrupting each qubit, which is unavoidable for bare physical qubits. We also show how to perform fault-tolerant error correction and code-state preparation under locally stochastic noise. All of our gadgets can be implemented with constant quantum circuit depth (i.e. are single-shot), and with a number of physical qubits growing linearly with the number of logical qubits, assuming the ability to run polynomial-sized noiseless classical circuits on the side. We construct our quantum codes by taking a high-dimensional hypergraph product of classical LDPC codes, which in turn are a simplified version of Spielman's linear-time encodable codes (STOC'95). As our resulting product codes are only resilient to physical errors occurring with non-uniform probabilities across qubits, we then show how to concatenate with inner codes of various sizes to obtain fault-tolerance against uniform noise.", "url": "https://arxiv.org/abs/2609.39345", "type": "理论", "summary": "我们构建了第一个已知的容错方案，以恒定的空间和时间开销将状态注入量子纠错码。也就是说，我们构建了一系列恒定速率量子纠错码，可以将一组裸物理量子位注入（即容错编码）到代码块中。类似地，代码状态可以被弹出（即容错解码）回到裸物理量子位。我们表明，这些注入和喷射过程在电路级局部随机噪声下成功，同时只产生很小的恒定概率损坏每个量子位，这对于裸物理量子位来说是不可避免的。我们还展示了如何在局部随机噪声下执行容错纠错和代码状态准备。我们所有的小工具都可以通过恒定的量子电路深度（即单次）来实现，并且物理量子位的数量随着逻辑量子位的数量线性增长，假设能够同时运行多项式大小的无噪声经典电路。\n\n我们通过采用经典 LDPC 码的高维超图积来构造我们的量子码，而经典 LDPC 码又是 Spielman 线性时间可编码码 (STOC'95) 的简化版本。由于我们生成的乘积代码只能适应量子位之间以非均匀概率发生的物理错误，因此我们随后展示了如何与各种大小的内部代码连接以获得针对均匀噪声的容错能力。", "authors": [{"name": "Louis Golowich"}, {"name": "Venkatesan Guruswami"}], "featured_authors": [{"name": "Louis Golowich"}, {"name": "Venkatesan Guruswami"}], "author_count": 2}, {"id": "2609.39393", "category": "quant-ph", "title": "Spectrally Selective Charging of an Interacting Quantum Battery via an Anharmonic Mediator", "abstract": "We investigate a finite-time quantum-battery charging architecture in which a driven two-level working system transfers nonequilibrium resources to an interacting two-qubit battery through a weakly anharmonic three-level mediator. Finite-time driving generates coherence and ergotropy, while excitation-number conservation organizes the transfer into distinct dynamical sectors. The mediator then provides spectrally selective charging channels: its lower transition enables nearly complete single-excitation transfer with negligible residual mediator energy, whereas initial mediator loading activates a cross-resonant two-excitation cascade toward the doubly excited battery state. The latter exhibits a modest reduction in transfer efficiency due to the unequal collective matrix elements of the effective three-state chain. Detuning scans quantify the spectral tolerance, and the full mixed-state dynamics reveals distinct energy- and ergotropy-transfer profiles. Finite-time compression, thermal reset, and switching work close the cycle-level energy balance to numerical precision. The resulting scheme combines nonequilibrium resource generation, spectral selectivity, coherent multilevel charging, and thermodynamic cycle closure within a single architecture.", "url": "https://arxiv.org/abs/2609.39393", "type": "理论+数值", "summary": "我们研究了一种有限时间量子电池充电架构，其中驱动的两级工作系统通过弱非谐波三级中介将非平衡资源转移到相互作用的两量子位电池。有限时间驱动产生相干性和各向异性，而激励数守恒将转移组织到不同的动态部分。然后介体提供光谱选择性充电通道：其较低的跃迁能够实现几乎完全的单激发转移，残余介体能量可以忽略不计，而初始介体负载激活交叉谐振双激发级联，朝向双激发电池状态。由于有效三态链的集体矩阵元素不相等，后者表现出传输效率的适度降低。失谐扫描量化了光谱容差，完整的混合态动力学揭示了不同的能量和各向异性传递曲线。有限时间压缩、热复位和开关工作使循环级能量平衡接近于数值精度。\n\n由此产生的方案在单一架构中结合了非平衡资源生成、光谱选择性、相干多级充电和热力学循环闭合。", "authors": [{"name": "Sujay Mondal"}, {"name": "Anumita Mukhopadhyay"}, {"name": "Siddhartha Dutta"}, {"name": "Abhijit Bandyopadhyay"}], "featured_authors": [{"name": "Sujay Mondal"}, {"name": "Anumita Mukhopadhyay"}, {"name": "Siddhartha Dutta"}, {"name": "Abhijit Bandyopadhyay"}], "author_count": 4}, {"id": "2609.39395", "category": "quant-ph", "title": "Logical Operator Decomposition for Distance Analysis of Bivariate Bicycle Codes", "abstract": "Bivariate bicycle (BB) quantum codes are a prominent finite-length family of quantum low-density parity-check codes, but their minimum distance is usually established numerically rather than read from the defining polynomials. We study the $Z$-logical quotient $K/S$ over $\\mathbb F_2[x,y]/(x^\\ell-1,y^m-1)$ and show that it fits into a short exact sequence with an annihilator quotient as kernel and a colon quotient as cokernel. The sequence gives an explicit logical basis, a dimension formula, and a componentwise distance identity $d_Z=\\min(d_{\\mathcal A},d_{\\mathcal C})$. Using the Frobenius structure of the finite group algebra, we prove $r_{\\mathcal A}=r_{\\mathcal C}=k/2$ for every BB code, including repeated-root cases. The algebraic component of a logical class is distinct from the support shape of its lightest representatives: an annihilator class can have a lighter two-block representative, and a colon class can have a one-sided minimum. For lower bounds we show that every proper subset of a minimum-weight logical operator has nonzero syndrome, and that this property persists inside the colon component but not inside the annihilator component. A translation-anchored cluster search built on it proves the distances $4,6,10,10,12,18$ of the six standard BB codes of lengths $18$ to $288$ and enumerates every minimum-weight logical operator. The resulting census shows that $[[108,8,10]]$ is the only one of the six whose distance is attained in a single component, with $d_{\\mathcal C}=10$ and $d_{\\mathcal A}=12$.", "url": "https://arxiv.org/abs/2609.39395", "type": "理论+数值", "summary": "双变量自行车（BB）量子码是量子低密度奇偶校验码的一个著名的有限长度系列，但它们的最小距离通常是通过数字确定的，而不是从定义多项式中读取。我们研究了 $\\mathbb F_2[x,y]/(x^\\ell-1,y^m-1)$ 上的 $Z$-逻辑商 $K/S$ 并表明它适合一个短的精确序列，其中一个歼灭商作为内核，一个冒号商作为 cokernel。该序列给出了明确的逻辑基础、维度公式和分量距离恒等式 $d_Z=\\min(d_{\\mathcal A},d_{\\mathcal C})$。使用有限群代数的 Frobenius 结构，我们证明对于每个 BB 码，包括重复根的情况，$r_{\\mathcal A}=r_{\\mathcal C}=k/2$。逻辑类的代数部分与其最轻代表的支持形状不同：消灭器类可以具有较轻的两块代表，而冒号类可以具有单侧最小值。对于下界，我们表明最小权重逻辑运算符的每个真子集都具有非零综合症，并且该属性在冒号组件内持续存在，但在消除器组件内不存在。\n\n建立在其上的翻译锚定聚类搜索证明了长度为 $18$ 到 $288$ 的六个标准 BB 代码的距离 $4,6,10,10,12,18$，并枚举了每个最小权重逻辑运算符。结果普查显示，$[[108,8,10]]$ 是六个在单个组件中达到距离的唯一一个，其中 $d_{\\mathcal C}=10$ 和 $d_{\\mathcal A}=12$。", "authors": [{"name": "Mohammad Rowshan"}, {"name": "Simon Devitt"}], "featured_authors": [{"name": "Mohammad Rowshan"}, {"name": "Simon Devitt"}], "author_count": 2}, {"id": "2609.39411", "category": "quant-ph", "title": "Genuine Multipartite Nonlocality Is Fermionic Magic", "abstract": "A system of free fermions can be simulated on a classical computer, and a single non-Gaussian state makes it a universal quantum computer. We show that the same line bounds quantum nonlocality. Measured as fermionic qubits, free fermions carry the Bell nonlocality of one entangled pair, no more, however many parties share them, and are never genuinely multipartite nonlocal. Fermion parity is the reason. Genuine multipartite nonlocality is thus the resource of universal fermionic computation, cannot arise from any mean-field state, and we certify it on $48$ qubits of IBM processors.", "url": "https://arxiv.org/abs/2609.39411", "type": "理论", "summary": "自由费米子系统可以在经典计算机上模拟，单个非高斯态使其成为通用量子计算机。我们证明了同一条线限制了量子非定域性。以费米子量子位来衡量，自由费米子具有一对纠缠对的贝尔非定域性，无论多方共享它们，都不再是这样，并且永远不是真正的多方非定域性。费米子宇称就是原因。因此，真正的多部分非局域性是通用费米子计算的资源，不能由任何平均场状态产生，我们在 IBM 处理器的 48 美元量子位上验证了它。", "authors": [{"name": "Jamal Slim"}], "featured_authors": [{"name": "Jamal Slim"}], "author_count": 1}, {"id": "2609.39448", "category": "quant-ph", "title": "Parallel classical simulation of noisy shallow circuits: no quantum advantage in 1D", "abstract": "We consider quantum circuits consisting of $d$ layers of nearest-neighbor two-qubit gates acting on $n$ qubits arranged on a line, where every qubit is independently depolarized with a constant probability before each layer. We describe a randomized parallel algorithm which samples from the output distribution of any such circuit to within total variation error $\\delta$, with parallel runtime $2^{O(d)}\\log\\log(n/\\delta)$ and $n 2^{O(d)}$ elementary real-arithmetic operations. Without noise, the same approach gives an exact sampler with parallel runtime $O(\\log n)$. For constant depth, we further show that the input/output behavior of the noisy quantum circuit is reproduced up to a constant error by a randomized $\\mathsf{AC}^0$-circuit, that is, a Boolean circuit of polynomial size and constant depth with unbounded fan-in AND and OR gates and NOT gates. Consequently, every relation problem solved by a noisy constant-depth quantum circuit in one dimension is also solved, with essentially the same success probability, by a randomized $\\mathsf{AC}^0$-circuit. This rules out, for noisy circuits in one dimension, the unconditional quantum advantage established for noisy shallow circuits in two and three dimensions, where polynomial-size classical circuits over the same gate set require depth $\\Omega(\\log n/\\log\\log n)$. Our algorithm exploits the fact that depolarizing noise cuts a one-dimensional circuit into independent pieces of logarithmic width, each of which can be sampled exactly in parallel.", "url": "https://arxiv.org/abs/2609.39448", "type": "理论+数值", "summary": "我们考虑由 $d$ 层最近邻双量子位门组成的量子电路，作用于排列在一条线上的 $n$ 个量子位，其中每个量子位在每层之前以恒定概率独立去极化。我们描述了一种随机并行算法，该算法从任何此类电路的输出分布中进行采样，使其在总变化误差 $\\delta$ 之内，并具有并行运行时 $2^{O(d)}\\log\\log(n/\\delta)$ 和 $n 2^{O(d)}$ 基本实数算术运算。在没有噪声的情况下，相同的方法给出了具有并行运行时间 $O(\\log n)$ 的精确采样器。对于恒定深度，我们进一步表明，噪声量子电路的输入/输出行为通过随机 $\\mathsf{AC}^0$ 电路再现恒定误差，即多项式大小和恒定深度的布尔电路，具有无界扇入 AND 和 OR 门以及 NOT 门。因此，由一维噪声恒定深度量子电路解决的每个关系问题也可以通过随机 $\\mathsf{AC}^0$-电路以基本相同的成功概率解决。\n\n对于一维噪声电路，这排除了为二维和三维噪声浅层电路建立的无条件量子优势，其中同一门集上的多项式大小的经典电路需要深度 $\\Omega(\\log n/\\log\\log n)$。我们的算法利用了这样一个事实：去极化噪声将一维电路切割成对数宽度的独立部分，每个部分都可以精确地并行采样。", "authors": [{"name": "Robert Koenig"}, {"name": "Marco Tomamichel"}], "featured_authors": [{"name": "Robert Koenig"}, {"name": "Marco Tomamichel"}], "author_count": 2}, {"id": "2609.39452", "category": "quant-ph", "title": "From Wavefunction Regularity to Eigenvector Conditioning: Accuracy--Cost Trade-offs of Quantum Algorithms for Non-Hermitian Transcorrelated Hamiltonians", "abstract": "The electron--electron Coulomb singularity forces cusp structure in electronic wavefunctions. This cusp structure limits wavefunction regularity and slows the convergence of expansions in smooth bases, requiring large basis sets to reach a target accuracy. The transcorrelated (TC) method incorporates this short-range behavior into the Hamiltonian, thereby improving the regularity of the transformed wavefunction and accelerating convergence toward the complete-basis-set limit. The resulting Hamiltonian is non-Hermitian and non-normal, which limits the direct applicability of standard quantum algorithms. For such non-normal operators, the complexity of several recent quantum algorithms depends explicitly on quantities related to eigenvector conditioning and eigenvalue sensitivity. Understanding these quantities is essential for assessing both algorithmic complexity and quantum resource requirements. In this work, we address these issues in two stages. We first study a solvable model, which provides a controlled setting for isolating how transcorrelation affects basis convergence and eigenvector conditioning. Within this setting, we investigate two distinct one-parameter Jastrow correlators. We derive the asymptotic energy-error scaling: $N^{-1/2}$ for the bare projection and $N^{-3/2}$ for both TC correlators at generic fixed parameters, with $N$denoting the basis size. Furthermore, we show that this faster convergence can yield a polynomial improvement in the asymptotic query-complexity upper bound. We then extend the analysis to second-quantized electronic-structure Hamiltonians and use particle-number-sector diagnostics to distinguish target-sector from auxiliary-sector conditioning. Our work provides a framework for understanding the central accuracy--cost trade-off in TC Hamiltonians.", "url": "https://arxiv.org/abs/2609.39452", "type": "理论+数值", "summary": "电子-电子库仑奇点迫使电子波函数中的尖点结构。这种尖点结构限制了波函数的规律性并减慢了平滑基底中展开的收敛速度，需要大的基底集才能达到目标精度。互相关（TC）方法将这种短程行为纳入哈密顿量，从而改善变换波函数的正则性并加速向完全基集极限的收敛。由此产生的哈密顿量是非厄米式且非正规的，这限制了标准量子算法的直接适用性。对于此类非正规算子，最近几种量子算法的复杂性明确取决于与特征向量条件和特征值灵敏度相关的量。了解这些数量对于评估算法复杂性和量子资源需求至关重要。在这项工作中，我们分两个阶段解决这些问题。我们首先研究一个可解模型，它提供了一个受控设置，用于隔离互相关如何影响基础收敛和特征向量调节。\n\n在此设置中，我们研究了两个不同的单参数贾斯特罗相关器。我们推导出渐进能量误差标度：对于裸投影来说 $N^{-1/2}$，对于通用固定参数的两个 TC 相关器来说 $N^{-3/2}$，其中 $N$ 表示基础大小。此外，我们表明，这种更快的收敛可以在渐近查询复杂性上限上产生多项式改进。然后，我们将分析扩展到第二量子化电子结构哈密顿量，并使用粒子数扇区诊断来区分目标扇区和辅助扇区调节。我们的工作提供了一个框架来理解 TC 哈密顿量的核心准确性——成本权衡。", "authors": [{"name": "Cheng-Lin Hong"}, {"name": "Emiel Koridon"}, {"name": "Paul K. Faehrmann"}, {"name": "Thomas D. Kühne"}, {"name": "Stefano Polla"}, {"name": "Werner Dobrautz"}], "featured_authors": [{"name": "Cheng-Lin Hong"}, {"name": "Emiel Koridon"}, {"name": "Paul K. Faehrmann"}, {"name": "Thomas D. Kühne"}, {"name": "Stefano Polla"}, {"name": "Werner Dobrautz"}], "author_count": 6}, {"id": "2609.39458", "category": "quant-ph", "title": "Optimal Scaling of Unitary Design Formation in $U(1)$-Symmetric Random Circuits: A Bottleneck Slower than Charge Transport", "abstract": "Understanding randomness formation under conservation laws is important both for characterizing chaotic phenomena in isolated quantum systems and for symmetry-constrained quantum information processing. $U(1)$-symmetric random circuits on an $N$-qubit system provide a minimal tractable setting for this problem, in which the formation rate of unitary designs was conjectured to be governed by charge transport in the underlying circuit geometry. However, whether charge transport indeed sets the slowest relaxation mode has remained an open problem, due to the difficulty in deriving a tight lower bound on the symmetric design formation rate. In this work, we resolve this problem by determining the optimal scaling of the unitary $k$-design formation rate for $k\\leq O(\\sqrt{\\log N})$ across a wide range of circuit geometries, including lattices, expander graphs, and all-to-all interactions. In particular, for $k\\geq 2$, we find that the formation rate is governed by a two-particle encounter rate---the rate at which two random walkers encounter each other in a given circuit geometry. This encounter rate is parametrically smaller than the single-particle transport rate in many geometries, thereby disproving the previous conjecture. We further establish that this encounter mechanism indeed sets the design formation rate by deriving its matching lower bound with a novel proof technique based on an auxiliary subgroup ensemble. Although this encounter mode imposes a robust bottleneck on design formation in $U(1)$-symmetric random circuits, we also show that this bottleneck can be circumvented by using symmetry-breaking local gates and provide an explicit protocol that achieves faster design formation. These results establish a new picture of randomness formation under conservation laws and provide guiding principles for characterizing and efficiently generating symmetry-constrained randomness.", "url": "https://arxiv.org/abs/2609.39458", "type": "理论", "summary": "了解守恒定律下的随机性形成对于表征孤立量子系统中的混沌现象和对称约束的量子信息处理都很重要。 $N$ 量子位系统上的 $U(1)$ 对称随机电路为该问题提供了一个最小的易处理设置，其中单一设计的形成速率被推测由底层电路几何结构中的电荷传输控制。然而，由于很难得出对称设计形成速率的严格下限，因此电荷传输是否确实设置了最慢的弛豫模式仍然是一个悬而未决的问题。在这项工作中，我们通过确定在各种电路几何形状（包括晶格、扩展图和所有交互）中 $k\\leq O(\\sqrt{\\log N})$ 的单一 $k$ 设计形成率的最佳缩放来解决这个问题。特别是，对于 $k\\geq 2$，我们发现形成速率由双粒子相遇率控制——两个随机游走者在给定电路几何形状中彼此相遇的速率。\n\n在许多几何结构中，这种相遇率在参数上小于单粒子输运率，从而反驳了之前的猜想。我们进一步确定，这种遭遇机制确实通过基于辅助子群系综的新颖证明技术推导其匹配下界来设置设计形成率。尽管这种遭遇模式对 $U(1)$ 对称随机电路的设计形成带来了强大的瓶颈，但我们还表明，可以通过使用对称破缺局部门来规避该瓶颈，并提供一个显式协议来实现更快的设计形成。这些结果建立了守恒定律下随机性形成的新图景，并为表征和有效生成对称约束随机性提供了指导原则。", "authors": [{"name": "Toshihiro Yada"}], "featured_authors": [{"name": "Toshihiro Yada"}], "author_count": 1}, {"id": "2609.39495", "category": "quant-ph", "title": "On quantum interactive proofs with a laconic prover", "abstract": "Interactive proof systems with a laconic prover, studied by Goldreich, Vadhan, and Wigderson (CC, 2002), capture problems verifiable with logarithmic prover communication in the classical setting. For two-message quantum analogs, even a single-bit prover response contains quantum statistical zero-knowledge ($\\sf QSZK$), introduced by Watrous (FOCS 2002). However, restricting the verifier's question to classical public coins collapses the corresponding class to $\\sf BQP$, as shown by Beigi, Shor, and Watrous (ToC, 2011). We further study two-message quantum interactive proof systems with a laconic prover. To this end, we introduce the class ${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}(2)$, where $\\ell$ is the length of the prover's response, and establish: 1. A natural complete characterization of ${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}(2)$ by Multi-State Distinguishability. In particular, Quantum State Distinguishability (QSD) is ${\\sf QIP}_{\\rm bit}$-complete. Since QSD is $\\sf QSZK$-hard, our result places ${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}(2)$, for $\\ell\\geq 2$, in a landscape \"just above\" $\\sf QSZK$. 2. Easy regimes for ${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}(2)$ collapsing to $\\sf QSZK$. We prove that QSD$[a,b]$ (and thus ${\\sf QIP}_{\\rm bit}[a,b]$) is in $\\sf QSZK$ when $a(n)-b(n)\\geq 1/O(\\log n)$, and combine this with an answer compression from ${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}[2,c,s]$ to ${\\sf QIP}_{\\rm bit}$ to obtain another easy regime when $2c>(1+2^{\\ell/2})s$. Remarkably, our improved polarization applies to SD and $\\sf SZK$, resolving an open problem in Sahai and Vadhan (JACM, 2003). 3. Quantum public coins also make the interaction useless: ${\\sf qc}\\text{-}{\\sf QAM}[O(\\sqrt{\\log{n}})]$ with constant gap is in $\\sf BQP$, where ${\\sf qc}\\text{-}{\\sf QAM}[\\ell]$ is a subclass of ${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}(2)$ in which the verifier's question is exactly halves of EPR pairs.", "url": "https://arxiv.org/abs/2609.39495", "type": "理论", "summary": "Goldreich、Vadhan 和 Wigderson（CC，2002）研究的具有简洁证明者的交互式证明系统捕获了经典环境中可通过对数证明者通信验证的问题。对于两个消息的量子模拟，即使是单位证明者响应也包含由 Watrous 引入的量子统计零知识 ($\\sf QSZK$) (FOCS 2002)。然而，将验证者的问题限制为经典公共硬币会将相应的类别折叠为 $\\sf BQP$，如 Beigi、Shor 和 Watrous 所示（ToC，2011）。我们进一步研究带有简洁证明者的两条消息量子交互证明系统。为此，我们引入 ${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}(2)$ 类，其中 $\\ell$ 是证明者响应的长度，并建立： 1. 通过多状态可区分性对 ${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}(2)$ 进行自然完整的表征。特别是，量子态可区分性（QSD）是${\\sf QIP}_{\\rm bit}$-完整的。由于 QSD 是 $\\sf QSZK$-hard，我们的结果将 ${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}(2)$（对于 $\\ell\\geq 2$）放置在 $\\sf QSZK$“正上方”的景观中。 2. ${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}(2)$ 的简单制度崩溃为 $\\sf QSZK$。\n\n我们证明当$a(n)-b(n)\\geq 1/O(\\log n)$时QSD$[a,b]$（因此${\\sf QIP}_{\\rm bit}[a,b]$）在$\\sf QSZK$中，并将其与从${\\sf QIP}_{\\ell\\text{-}{\\rm bit}}[2,c,s]$到${\\sf的答案压缩相结合当 $2c>(1+2^{\\ell/2})s$ 时，QIP}_{\\rm bit}$ 获得另一个简单的状态。值得注意的是，我们改进的极化适用于 SD 和 $\\sf SZK$，解决了 Sahai 和 Vadhan 的未决问题（JACM，2003）。 3. 量子公币也让交互变得无用：${\\sf qc}\\text{-}{\\sf QAM}[O(\\sqrt{\\log{n}})]$，恒定间隙在$\\sf BQP$中，其中${\\sf qc}\\text{-}{\\sf QAM}[\\ell]$是${\\sf QIP}_{\\ell\\text{-}{\\rm的子类位}}(2)$，其中验证者的问题恰好是 EPR 对的一半。", "authors": [{"name": "Zihan Hu"}, {"name": "Yupan Liu"}], "featured_authors": [{"name": "Zihan Hu"}, {"name": "Yupan Liu"}], "author_count": 2}, {"id": "2609.39522", "category": "quant-ph", "title": "Layer codes as quantum memories: syndrome extraction, thresholds and idle robustness", "abstract": "Layer codes are three-dimensional local CSS codes of check weight at most six, obtained by quasi-concatenating a CSS input code with unrotated surface code patches. What is established about them describes the code, not the circuit that measures it. In this work, we evaluate them as active memories under circuit-level noise. Doing so first requires a syndrome extraction circuit, and the junction stabilizers that couple the patches rule out borrowing a surface code patch's CNOT schedule. We present a decoder-free scheduler that constrains hook propagation first and compresses depth afterwards, generate circuits for eighteen layer codes across four input codes, and compare them with surface codes of the same distance, simulated and decoded in the same way. The circuits lose no distance to hook errors on [[4,2,2]]-input codes wherever a circuit-distance proof is affordable, and reach a lower logical error rate than those of a general-purpose scheduler for CSS codes at roughly half its CNOT depth per round. Our primary family built from a [[4,2,2]] input code reaches a circuit-level threshold of $5.06(7)\\times 10^{-3}$. The layer code outperforms the surface code in terms of idle robustness: at the same distance it tolerates an interval between syndrome extraction rounds 1.7-3.0 times longer than the rotated surface code. This comes at the cost of 1.7-5.0 times more operations per unit time and approximately five times more physical qubits, both per logical qubit. Finally, we model the cost of the beyond-2D cross-plane CNOTs that the construction demands, and find that their speed matters far more than their fidelity.", "url": "https://arxiv.org/abs/2609.39522", "type": "理论+数值", "summary": "层代码是检查权重最多为六的三维局部CSS代码，通过将CSS输入代码与未旋转的表面代码补丁准串联而获得。关于它们的建立描述的是代码，而不是测量代码的电路。在这项工作中，我们将它们作为电路级噪声下的有源存储器进行评估。这样做首先需要一个校正子提取电路，并且耦合补丁的结稳定器排除了借用表面代码补丁的 CNOT 时间表。我们提出了一种无解码器调度器，它首先限制钩子传播，然后压缩深度，生成跨四个输入代码的十八层代码的电路，并将它们与相同距离的表面代码进行比较，以相同的方式进行模拟和解码。只要电路距离证明可以承受，电路就不会失去距离来钩住 [[4,2,2]] 输入代码上的错误，并且达到比 CSS 代码的通用调度程序更低的逻辑错误率，每轮大约是其 CNOT 深度的一半。我们从 [[4,2,2]] 输入代码构建的主要系列达到了 $5.06(7)\\times 10^{-3}$ 的电路级阈值。\n\n层代码在空闲鲁棒性方面优于表面代码：在相同的距离下，它所容忍的校正子提取轮之间的间隔比旋转表面代码长 1.7-3.0 倍。这是以每单位时间的操作数增加 1.7-5.0 倍以及物理量子位数增加大约五倍为代价的，两者都是每个逻辑量子位。最后，我们对施工所需的超二维跨平面 CNOT 的成本进行了建模，发现它们的速度远比保真度更重要。", "authors": [{"name": "Zhu Sun"}, {"name": "Zhenyu Cai"}], "featured_authors": [{"name": "Zhu Sun"}, {"name": "Zhenyu Cai"}], "author_count": 2}, {"id": "2609.39528", "category": "quant-ph", "title": "Optimal local recovery cannot alter critical orthogonality exponents in quantum spin environments", "abstract": "We prove a local amplitude-ratio bound for positive ground states and an explicit reverse comparison for fidelity under finite-region erasure. An exact lattice calculation for a connected critical Ising chain gives amplitude exponent $1/8$, preserved by arbitrary optimal control on any fixed spin set and, at the level of logarithmic exponents, on $o(\\log N)$ spins. We derive the finite Cauchy product and its uniform strip asymptotics, and document exact two-spin optimization and an interferometric protocol for measuring the recovery. A separate finite-mediator theorem quantifies local compression and a decoder while retaining the rest of the environment exactly. We also give a ground-preparation Ramsey bound, counterexamples to stronger projected-state inferences, and independent full-Hamiltonian calculations.", "url": "https://arxiv.org/abs/2609.39528", "type": "理论+数值", "summary": "我们证明了正基态的局部振幅比界限以及有限区域擦除下保真度的显式反向比较。连接的临界伊辛链的精确晶格计算给出了振幅指数 $1/8$，通过对任何固定自旋集以及对数指数水平上的 $o(\\log N)$ 自旋的任意最优控制来保存。我们推导了有限柯西积及其均匀带渐近，并记录了精确的双自旋优化和用于测量恢复的干涉协议。一个单独的有限中介定理量化了局部压缩和解码器，同时准确地保留了环境的其余部分。我们还给出了地面准备拉姆齐界限、更强的投影状态推论的反例以及独立的全哈密尔顿计算。", "authors": [{"name": "Zhixuan Zhao"}, {"name": "Jun Li"}], "featured_authors": [{"name": "Zhixuan Zhao"}, {"name": "Jun Li"}], "author_count": 2}, {"id": "2609.39589", "category": "quant-ph", "title": "Rate 1/5 Non-Malleable Codes against Entangled Split-State Tampering", "abstract": "We construct efficient information-theoretic non-malleable codes for classical messages that are secure against two noncommunicating local quantum tampering operations with arbitrary pre-shared entanglement. For every sufficiently small fixed $\\xi>0$ and all sufficiently large first-share lengths $n$, the codes have rate at least $1/5-\\xi$, perfect correctness, and error $2^{-n^{\\Omega(1)}}$. Security holds for every message, with a single message-independent simulator for each attack. This resolves the constant-rate question for worst-case classical messages in the entangled two-split-state model. Our construction builds on the permutation-based two-split construction of Batra, Boddu, and Jain, which achieves rate approaching $1/5$ for uniformly random messages. We retain their architecture but replace the uniform message input to the permutation with a prescribed message concatenated with fresh uniform padding. Our main contribution is a worst-case security reduction for this modification.", "url": "https://arxiv.org/abs/2609.39589", "type": "理论", "summary": "我们为经典消息构建了有效的信息论不可延展代码，该代码可以安全地抵御具有任意预共享纠缠的两个非通信局部量子篡改操作。对于每个足够小的固定 $\\xi>0$ 和所有足够大的第一部分长度 $n$，代码的速率至少为 $1/5-\\xi$，完全正确，错误为 $2^{-n^{\\Omega(1)}}$。每条消息都具有安全性，每次攻击都有一个独立于消息的模拟器。这解决了纠缠二分裂状态模型中最坏情况经典消息的恒定速率问题。我们的构造建立在 Batra、Boddu 和 Jain 的基于排列的二分割构造的基础上，它对于均匀随机消息实现了接近 1/5$ 的速率。我们保留了它们的架构，但用与新的统一填充连接的规定消息替换了排列的统一消息输入。我们的主要贡献是针对此修改降低了最坏情况下的安全性。", "authors": [{"name": "Naresh Goud Boddu"}], "featured_authors": [{"name": "Naresh Goud Boddu"}], "author_count": 1}, {"id": "2609.39592", "category": "quant-ph", "title": "The Complexity of Single-Interaction Hamiltonians", "abstract": "We study the complexity of Local Hamiltonian problems under the restriction that every local term is an unweighted occurrence of the same fixed interaction. In the resulting Single-Interaction Hamiltonian (SIH) model, once the interaction is fixed, the Hamiltonian is specified entirely by its ordered interaction hypergraph. Our main technical tool is an exact compiler that converts any fixed finite alphabet of local interactions into a single interaction. On a designated auxiliary subspace, the compiled Hamiltonian reproduces the source Hamiltonian exactly, while the complete spectrum below a chosen separation scale is preserved with multiplicity. Combined with a finite-alphabet normalization, this gives a universal polynomial-time reduction from $k$-Local Hamiltonian to SIH$_{3k+3}$ up to a known global energy scale and inverse-polynomial approximation. Sharper constructions give QMA-completeness of SIH$_3$ and of geometrically local SIH$_8$ with bounded degree and interaction range. In the stoquastic setting, we obtain StoqMA-completeness of Stoq-SIH$_3$ and QMA-completeness of 1-Pinned Stoq-SIH$_4$. We also establish hardness results for uniformly system-size-dependent interactions and derive single-interaction formulations of the Hamiltonian quantum PCP conjecture, frustration-free, exponentially precise, and guided Local Hamiltonian problems. These results show that independently chosen local matrices and independently tunable coupling strengths are not necessary for a broad range of Hamiltonian-complexity phenomena.", "url": "https://arxiv.org/abs/2609.39592", "type": "理论", "summary": "我们在每个局部项都是相同固定相互作用的未加权出现的限制下研究局部哈密顿问题的复杂性。在生成的单交互哈密顿量 (SIH) 模型中，一旦交互作用被固定，哈密顿量就完全由其有序交互超图指定。我们的主要技术工具是一个精确的编译器，它将任何固定的有限字母表的本地交互转换为单个交互。在指定的辅助子空间上，编译的哈密顿量精确地再现源哈密顿量，而低于所选分离尺度的完整谱则以多重性保留。与有限字母归一化相结合，这给出了从 $k$-局部哈密顿量到 SIH$_{3k+3}$ 的通用多项式时间减少，直至已知的全局能量规模和逆多项式近似。更清晰的结构给出了 SIH$_3$ 和几何局部 SIH$_8$ 的 QMA 完整性，具有有限度和交互范围。在stoquastic设置中，我们获得了Stoq-SIH$_3$的StoqMA完整性和1-Pinned Stoq-SIH$_4$的QMA完整性。\n\n我们还建立了均匀系统尺寸相关相互作用的硬度结果，并推导出哈密顿量子 PCP 猜想的单相互作用公式，无挫折、指数精确和引导局部哈密顿问题。这些结果表明，对于广泛的哈密顿复杂性现象来说，独立选择的局部矩阵和独立可调的耦合强度并不是必需的。", "authors": [{"name": "Elad Hecker"}], "featured_authors": [{"name": "Elad Hecker"}], "author_count": 1}, {"id": "2609.39602", "category": "quant-ph", "title": "Warm-Start Iterative QITE for Distribution Network Reconfiguration via Branch-Exchange Encoding", "abstract": "We present a hybrid quantum-classical algorithm for distribution network reconfiguration, a combinatorial optimization problem on power distribution networks, that combines a radiality preserving branch-exchange encoding with iterative warm-start quantum imaginary-time evolution to minimize active line losses. The encoding uses a fixed-width binary representation of sequential branch-exchange actions, ensuring that every register outcome decodes to a radial configuration. The quantum subroutine is informed by a surrogate model fit to classically-solved alternating current power flow (ACPF) labels. After a set budget of ACPF solves and circuit samples is exhausted, the algorithm returns the lowest-loss configuration seen. We employ our algorithm on ten test cases, including seven commonly-used benchmark cases and three cases we modified from these and similar standard systems. We include two methods to reduce problem size, which enable extensions of the algorithm to larger networks. We successfully reach minimal-loss configurations for six cases and find configurations with losses from 0.2 percent to 2.18 percent above the reported reference minimal loss for the other four.", "url": "https://arxiv.org/abs/2609.39602", "type": "理论+数值", "summary": "我们提出了一种用于配电网络重新配置的混合量子经典算法，这是配电网络上的组合优化问题，它将径向保持分支交换编码与迭代热启动量子虚时间演化相结合，以最大限度地减少有源线路损耗。该编码使用顺序分支交换操作的固定宽度二进制表示，确保每个寄存器结果解码为径向配置。量子子程序由适合经典求解的交流功率流 (ACPF) 标签的代理模型通知。在 ACPF 的设定预算求解并且电路样本耗尽后，算法返回所见的最低损耗配置。我们在十个测试用例上使用我们的算法，包括七个常用的基准用例和我们从这些和类似的标准系统修改的三个用例。我们提供了两种减少问题规模的方法，这使得算法能够扩展到更大的网络。我们成功地在六种情况下达到了最小损耗配置，并发现配置的损耗比其他四种情况报告的参考最小损耗高出 0.2% 到 2.18%。", "authors": [{"name": "Noah Crum"}, {"name": "Pete Pritchard"}, {"name": "Tanner Rase"}, {"name": "Phillip C. Lotshaw"}, {"name": "Shaked Regev"}, {"name": "Claudio Girotto"}, {"name": "Ananth Kaushik"}, {"name": "Paul Smith"}], "featured_authors": [{"name": "Noah Crum"}, {"name": "Pete Pritchard"}, {"name": "Tanner Rase"}, {"name": "Claudio Girotto"}, {"name": "Ananth Kaushik"}, {"name": "Paul Smith"}], "author_count": 8}, {"id": "2609.39668", "category": "quant-ph", "title": "QMA(2) with Limited Shared Entanglement", "abstract": "A $\\mathsf{QMA}(2)$ protocol involves two provers submitting unentangled witnesses to a polynomial-time quantum verifier. In The Power of Unentanglement (ToC, 2009), Aaronson et al. proposed $\\mathsf{QMA}(2;h)$, a variant of $\\mathsf{QMA}(2)$ in which the two provers may share $h$ EPR pairs. Our main result shows that the power of $\\mathsf{QMA}(2)$ remains unchanged for up to logarithmically many shared EPR pairs: $\\mathsf{QMA}(2;h)=\\mathsf{QMA}(2)$ for $h=O(\\log n)$, where $n$ is the input length. The result follows from a simulation using four unentangled witnesses, combined with the Harrow-Montanaro equality $\\mathsf{QMA}(4)=\\mathsf{QMA}(2)$ (FOCS, 2010). We also prove monotonicity in the EPR budget: $\\mathsf{QMA}(2;h)\\subseteq\\mathsf{QMA}(2;H)$ for $h\\le H$, preserving completeness and soundness. Combined with input padding, this shows that establishing $\\mathsf{QMA}(2;n^\\varepsilon)=\\mathsf{QMA}(2)$ for any fixed $\\varepsilon>0$ would imply equality for every polynomially bounded budget, resolving the open problem raised by Aaronson et al. Finally, we extend these results to a variant of the model in which the provers may use local operations and classical communication (LOCC) during witness preparation. For logarithmic-size witnesses and inverse-polynomial gaps, both models remain equivalent to their unentangled counterpart when $h=O(\\log n)$. We show that extending this equivalence to any superlogarithmic EPR budget in the LOCC model would imply $\\mathsf{NP}\\subseteq\\mathsf{BQP}$.", "url": "https://arxiv.org/abs/2609.39668", "type": "理论+数值", "summary": "$\\mathsf{QMA}(2)$ 协议涉及两个证明者向多项式时间量子验证者提交未纠缠的见证人。在《解开纠缠的力量》（ToC，2009）中，Aaronson 等人。提出$\\mathsf{QMA}(2;h)$，$\\mathsf{QMA}(2)$的变体，其中两个证明者可以共享$h$ EPR对。我们的主要结果表明，对于最多对数数量的共享 EPR 对，$\\mathsf{QMA}(2)$ 的幂保持不变：$\\mathsf{QMA}(2;h)=\\mathsf{QMA}(2)$ 对于 $h=O(\\log n)$，其中 $n$ 是输入长度。结果是使用四个非纠缠证人进行模拟，并结合哈罗-蒙塔纳罗等式 $\\mathsf{QMA}(4)=\\mathsf{QMA}(2)$ （FOCS，2010）得出的。我们还证明了 EPR 预算的单调性：$\\mathsf{QMA}(2;h)\\subseteq\\mathsf{QMA}(2;H)$ for $h\\le H$，保持完整性和健全性。结合输入填充，这表明对于任何固定的 $\\varepsilon>0$ 建立 $\\mathsf{QMA}(2;n^\\varepsilon)=\\mathsf{QMA}(2)$ 将意味着每个多项式有界预算相等，解决了 Aaronson 等人提出的开放问题。\n\n最后，我们将这些结果扩展到模型的变体，其中证明者可以在证人准备期间使用本地操作和经典通信（LOCC）。对于对数大小的见证和逆多项式间隙，当 $h=O(\\log n)$ 时，两个模型仍然等效于它们的未纠缠模型。我们证明，将这种等价性扩展到 LOCC 模型中的任何超对数 EPR 预算将意味着 $\\mathsf{NP}\\subseteq\\mathsf{BQP}$。", "authors": [{"name": "Alex Della Schiava"}, {"name": "Ranitha Mataraarachchi"}], "featured_authors": [{"name": "Alex Della Schiava"}, {"name": "Ranitha Mataraarachchi"}], "author_count": 2}, {"id": "2609.39669", "category": "quant-ph", "title": "Separable decompositions of 2xn states with operator Schmidt rank three", "abstract": "We prove that every bipartite state $\\rho$ of a qubit coupled to an $n$-level system whose operator Schmidt rank equals three can be written as a mixture of $\\text{rank}(\\rho)$ pure product states, and as a mixture of at most $n+1$ mixed product states in general. The second result is tight in the sense that there exist states that cannot be decomposed with a smaller number of terms. Our proof gives constructive methods to obtain the decompositions. It involves eigendecompositions of suitable unitary dilations of an operator explicitly determined by the state. Our framework recovers previously known results for the length of decompositions into pure product states and is also able to deal with decompositions into mixed states. For pure product states, our decomposition is different from existing ones.", "url": "https://arxiv.org/abs/2609.39669", "type": "理论", "summary": "我们证明，与运算符施密特等级等于 3 的 $n$ 级系统耦合的量子位的每个二分状态 $\\rho$ 都可以写成 $\\text{rank}(\\rho)$ 纯乘积状态的混合物，并且通常可以写成最多 $n+1$ 混合乘积状态的混合物。第二个结果是紧的，因为存在不能用较少项数分解的状态。我们的证明给出了获得分解的建设性方法。它涉及由状态明确确定的算子的适当酉扩张的特征分解。我们的框架将先前已知的分解长度结果恢复为纯乘积状态，并且还能够处理分解为混合状态。对于纯乘积状态，我们的分解与现有的分解不同。", "authors": [{"name": "Perrine Vantalon"}, {"name": "Nicolas Macris"}], "featured_authors": [{"name": "Perrine Vantalon"}, {"name": "Nicolas Macris"}], "author_count": 2}, {"id": "2609.39674", "category": "quant-ph", "title": "Polylog-depth Quantum Thermal Simulation via Local Recovery Channels", "abstract": "We establish sufficient conditions for preparing quantum thermal states of noncommuting local Hamiltonians with polylogarithmic circuit depth in arbitrary fixed spatial dimension. Our conditions combine locality and stability bounds on the effective interactions of reduced density matrices of a Gibbs state with a quantitative high-temperature condition and access to coarse classical reference Hamiltonians. When these references can be generated locally, the classical preprocessing cost is $N^{1+o(1)}$ for $N$ sites at inverse-polynomial global accuracy. We construct the preparation circuit from spatially localized Petz recovery maps. Quantum corrections derived from the microscopic Hamiltonian enable accurate recovery while the classical references remain coarse. After preprocessing, the resulting circuit prepares the canonical purification using $N\\operatorname{polylog}(N/\\varepsilon)$ gates and qubits, where $\\varepsilon$ is the preparation error. These results link two fundamental questions: how correlations are organized in thermal equilibrium, and how efficiently the corresponding states can be realized through operations allowed by quantum mechanics. By translating static equilibrium structure into explicit preparation circuits, they give equilibrium locality a constructive computational interpretation and a physically grounded role in quantum algorithm design.", "url": "https://arxiv.org/abs/2609.39674", "type": "理论+数值", "summary": "我们建立了在任意固定空间维度上制备具有多对数电路深度的非交换局部哈密顿量的量子热态的充分条件。我们的条件将吉布斯态约化密度矩阵与定量高温条件的有效相互作用的局部性和稳定性界限结合起来，并获得粗略的经典参考哈密顿量。当这些参考可以在本地生成时，对于 $N$ 个站点，经典的预处理成本为 $N^{1+o(1)}$，具有逆多项式全局精度。我们从空间局部 Petz 恢复图构建准备电路。从微观哈密顿量导出的量子校正可以实现准确的恢复，而经典参考仍然是粗糙的。预处理后，生成的电路使用 $N\\operatorname{polylog}(N/\\varepsilon)$ 门和量子位准备规范纯化，其中 $\\varepsilon$ 是准备错误。这些结果联系了两个基本问题：如何在热平衡中组织相关性，以及如何通过量子力学允许的操作有效地实现相应的状态。\n\n通过将静态平衡结构转化为显式准备电路，他们为平衡局域性提供了建设性的计算解释，并在量子算法设计中发挥了物理基础的作用。", "authors": [{"name": "Hideaki Hakoshima"}, {"name": "Atsushi Iwaki"}, {"name": "Nobuyuki Yoshioka"}], "featured_authors": [{"name": "Hideaki Hakoshima"}, {"name": "Atsushi Iwaki"}, {"name": "Nobuyuki Yoshioka"}], "author_count": 3}, {"id": "2609.39690", "category": "quant-ph", "title": "Scaling Laws of Quantum Networks: An Entanglement Transport Framework", "abstract": "As quantum networks move toward multi-user architectures, a central question is how the performance of entanglement distribution scales with the numbers of network nodes $N$ and active users $M$, yet existing studies use different objectives, resource assumptions, and normalizations. To account for delivery distance under multi-user demand, we define entanglement transport, which weights each delivered Bell pair meeting a fixed fidelity threshold by its endpoint separation. In a two-layer framework, (i) a resource layer measures capacity per activation slot under different aggregation regimes, and (ii) a physical layer measures service per second under implementation constraints. For matched implementations with a bounded number of activation slots per second, asymptotic-aggregation capacity sets a service ceiling, whereas achievable service must be established separately. On expanding honeycomb lattices with one random session, fixed-window entanglement-percolation constructions achieve $\\Theta(N^{-1})$ entanglement transport per activation slot below their thresholds and $\\Theta(\\sqrt N)$ above them. For homogeneous chains, asymptotic aggregation exceeds fixed-window capacity by a factor $\\Theta(N^2/M)$, and in spatial expansion a noisy physical implementation achieves $\\Theta(M/N)$ service per second. These examples show that entanglement-transport scaling depends not only on connectivity but also on resource aggregation and physical implementation. The framework provides a common basis on which quantum-network scaling laws can be established.", "url": "https://arxiv.org/abs/2609.39690", "type": "理论", "summary": "随着量子网络向多用户架构发展，一个核心问题是纠缠分布的性能如何随着网络节点数 $N$ 和活跃用户 $M$ 的数量而变化，但现有研究使用不同的目标、资源假设和归一化。为了考虑多用户需求下的传输距离，我们定义了纠缠传输，它通过端点间隔对每个传输的贝尔对进行加权，以满足固定的保真度阈值。在两层框架中，（i）资源层测量不同聚合机制下每个激活时隙的容量，以及（ii）物理层测量实现约束下的每秒服务。对于每秒激活时隙数量有限的匹配实现，渐近聚合容量设置了服务上限，而可实现的服务必须单独建立。在用一个随机会话扩展蜂窝晶格时，固定窗口纠缠渗流结构在每个激活槽中实现 $\\Theta(N^{-1})$ 纠缠传输低于其阈值和 $\\Theta(\\sqrt N)$ 高于阈值。\n\n对于同构链，渐近聚合超过固定窗口容量$\\Theta(N^2/M)$，而在空间扩展中，噪声物理实现每秒实现$\\Theta(M/N)$服务。这些例子表明，纠缠传输扩展不仅取决于连接性，还取决于资源聚合和物理实现。该框架提供了建立量子网络缩放定律的共同基础。", "authors": [{"name": "Jaemin Kim"}, {"name": "Petar Popovski"}], "featured_authors": [{"name": "Jaemin Kim"}, {"name": "Petar Popovski"}], "author_count": 2}, {"id": "2609.39693", "category": "quant-ph", "title": "Quantum--classical break-even in electronic dynamics of macrocyclic molecules", "abstract": "Here we demonstrate quantum--classical break-even for chemical dynamics applications, reaching useful accuracy with a quantum-hardware wall-clock time comparable to that estimated for practical classical computing resources. Specifically, we construct a quantum workflow for electronic dynamics based on tensor-network circuit compression leveraging spatial locality, extending circuit compression beyond one-dimensional open-boundary systems. This enables application of the workflow to problems that are hardware-native but classically hard. The workflow targets one-dimensional periodic Hamiltonians: circuits classically optimized only for short-time evolution within a small spatial region can be replicated in both space and time to construct long-time dynamics of the full system without classically simulating the corresponding large-scale evolution. We apply the workflow to cyclic conjugated macrocycles with rotational periodicity, 12-qubit benzene and 120-qubit [60]annulene, by embedding their electronic structure onto loops of IBM quantum processors. For the annulene, the quantum-processing-unit (QPU) wall-clock times for hole-doped nonequilibrium dynamics became comparable to the estimated wall-clock time of two classical methods, Majorana propagation and matrix-product-state time evolution based on the time-dependent variational principle; this corresponds to tens to hundreds of compute nodes depending on the task (36 CPU cores per node), assuming near-ideal parallel scaling, bringing the quantum calculation into a wall-clock-time regime comparable to conventional parallel high-performance-computing resources. We also show a situation in which a hybrid quantum--classical calculation is a reasonable choice in terms of both accuracy and computational time. These results show that quantum hardware can become a realistic computational option for chemically relevant electronic dynamics.", "url": "https://arxiv.org/abs/2609.39693", "type": "理论+数值", "summary": "在这里，我们演示了化学动力学应用的量子经典盈亏平衡，通过量子硬件挂钟时间达到了有用的精度，与实际经典计算资源的估计时间相当。具体来说，我们基于利用空间局部性的张量网络电路压缩构建了电子动力学的量子工作流程，将电路压缩扩展到一维开放边界系统之外。这使得工作流程能够应用于硬件本机但通常很难的问题。该工作流程以一维周期性哈密顿量为目标：经典仅针对小空间区域内的短时演化进行优化的电路可以在空间和时间上复制，以构建整个系统的长期动态，而无需经典地模拟相应的大规模演化。我们将工作流程应用于具有旋转周期的循环共轭大环、12 量子位苯和 120 量子位 [60] 轮烯，将其电子结构嵌入到 IBM 量子处理器的环路中。\n\n对于轮烯，空穴掺杂非平衡动力学的量子处理单元（QPU）挂钟时间与两种经典方法（基于时间相关变分原理的马约拉纳传播和矩阵乘积状态时间演化）估计的挂钟时间相当。这对应于数十到数百个计算节点，具体取决于任务（每个节点 36 个 CPU 核心），假设接近理想的并行扩展，将量子计算带入与传统并行高性能计算资源相当的挂钟时间状态。我们还展示了一种情况，其中混合量子经典计算在精度和计算时间方面都是合理的选择。这些结果表明，量子硬件可以成为化学相关电子动力学的现实计算选择。", "authors": [{"name": "Shu Kanno"}, {"name": "Kenji Sugisaki"}, {"name": "Takashi Imamichi"}, {"name": "Toshinari Itoko"}, {"name": "Rei Sakuma"}, {"name": "Hajime Nakamura"}, {"name": "Qi Gao"}, {"name": "Naoki Yamamoto"}], "featured_authors": [{"name": "Shu Kanno"}, {"name": "Kenji Sugisaki"}, {"name": "Takashi Imamichi"}, {"name": "Hajime Nakamura"}, {"name": "Qi Gao"}, {"name": "Naoki Yamamoto"}], "author_count": 8}, {"id": "2609.39735", "category": "quant-ph", "title": "What makes a causal loop consistent?", "abstract": "Causal loops escape paradoxes if they generate valid probabilities under arbitrary independent local interventions. We show that a deterministic classical process is logically consistent if and only if it contains no signaling loops: cyclic signaling is forbidden but cyclic causation is not, allowing indefinite causal order. Logical consistency is then found to hold exactly when the list of events of a process is pairwise exclusive and complete, providing the first event-based, intervention-free, non-recursive characterization of consistent causal loops. Our results repair a previously introduced intervention-free criterion that misses global loops and reveal that what makes deterministic classical communications without causal order consistent is a multipartite form of Specker's principle: if any two of several questions can be answered jointly, so can all of them.", "url": "https://arxiv.org/abs/2609.39735", "type": "理论", "summary": "如果因果循环在任意独立的局部干预下产生有效的概率，那么它们就可以避免悖论。我们证明，确定性经典过程在逻辑上是一致的，当且仅当它不包含信号循环时：循环信号被禁止，但循环因果关系则不然，允许不确定的因果顺序。然后发现当过程的事件列表是成对排他且完整时，逻辑一致性准确地保持，从而提供一致因果循环的第一个基于事件的、无干预的、非递归的特征。我们的结果修复了之前引入的忽略全局循环的无干预标准，并揭示了使没有因果顺序的确定性经典通信保持一致的是斯佩克原理的多部分形式：如果几个问题中的任何两个可以共同回答，那么所有这些问题也可以共同回答。", "authors": [{"name": "Hippolyte Dourdent"}, {"name": "Andreas Leitherer"}, {"name": "Emanuel-Cristian Boghiu"}, {"name": "Kyrylo Simonov"}, {"name": "Ravi Kunjwal"}, {"name": "Antonio Acín"}], "featured_authors": [{"name": "Hippolyte Dourdent"}, {"name": "Andreas Leitherer"}, {"name": "Emanuel-Cristian Boghiu"}, {"name": "Kyrylo Simonov"}, {"name": "Ravi Kunjwal"}, {"name": "Antonio Acín"}], "author_count": 6}, {"id": "2609.39747", "category": "quant-ph", "title": "A depolarizing choir sings in Gaussian harmony", "abstract": "We study the noise threshold for positive quantum capacity for the qubit depolarizing channel. We explore analytically the action of the qubit depolarizing channel on the symmetric subspaces of the input qubits, in the limit of asymptotically many uses of the channel. We observe the emergence of a bosonic Gaussian channel. Furthermore, the codes previously developed for the depolarizing channel can be translated to codes for the emergent Gaussian channel, and it is easier to further optimize these codes for the simpler emergent Gaussian channel. Translating these codes back to the depolarizing channel leads to extremely good input states for the coherent information of the depolarizing channel producing new lower bounds on the noise threshold for positive capacity. In addition to improved lower bounds on the threshold, this newly found link between depolarizing noise and Gaussian channels offers a novel perspective contributing to our understanding of these symmetric codes.", "url": "https://arxiv.org/abs/2609.39747", "type": "理论+数值", "summary": "我们研究了量子位去极化通道的正量子容量的噪声阈值。我们分析地探索了量子位去极化通道在输入量子位的对称子空间上的作用，在通道的渐近许多用途的限制下。我们观察到玻色高斯通道的出现。此外，先前为去偏振信道开发的代码可以转换为用于突现高斯信道的代码，并且更容易针对更简单的突现高斯信道进一步优化这些代码。将这些代码转换回去偏振通道会导致去偏振通道的相干信息得到极其良好的输入状态，从而产生正容量噪声阈值的新下限。除了改进阈值下限之外，新发现的去极化噪声和高斯通道之间的联系还提供了一个新颖的视角，有助于我们理解这些对称码。", "authors": [{"name": "Rabsan Galib Ahmed"}, {"name": "Sujeet Bhalerao"}, {"name": "Sungjai Lee"}, {"name": "Felix Leditzky"}, {"name": "Debbie Leung"}, {"name": "Luke Schaeffer"}, {"name": "Graeme Smith"}], "featured_authors": [{"name": "Rabsan Galib Ahmed"}, {"name": "Sujeet Bhalerao"}, {"name": "Sungjai Lee"}, {"name": "Debbie Leung"}, {"name": "Luke Schaeffer"}, {"name": "Graeme Smith"}], "author_count": 7}, {"id": "2609.39758", "category": "quant-ph", "title": "Theory of spacetime quantum fault tolerance", "abstract": "We present a unified algebraic theory of Clifford spacetime quantum fault tolerance, which underpins universal fault-tolerant quantum computation. We construct a spacetime chain complex from a tensor network representation of a circuit that encodes fault propagation, detector syndromes, and logical actions through the associated gauge and stabilizer structure. We show that this theory (1) unifies various formulations of quantum fault tolerance including spacetime codes, Gottesman's gadget framework, fault complexes, and ZX calculus; (2) connects spacetime distances to the gadget-level correctness properties in Gottesman's formalism; (3) naturally accommodates a range of fault models, in particular phenomenological and circuit-level models, bringing these often separately formulated descriptions into a common algebraic framework through different tensor decompositions and fault assignments; and (4) recovers many known fault tolerance constructions and results as special cases, including repeated syndrome extraction, correlated detectors for transversal and fold-transversal gates, Steane- and Knill-type syndrome extraction gadgets, and single-shot error correction.", "url": "https://arxiv.org/abs/2609.39758", "type": "理论+数值", "summary": "我们提出了克利福德时空量子容错的统一代数理论，该理论支撑着通用容错量子计算。我们从电路的张量网络表示构建了一个时空链复合体，该电路通过相关的规范和稳定器结构对故障传播、探测器综合症和逻辑动作进行编码。我们证明该理论 (1) 统一了量子容错的各种表述，包括时空码、Gottesman 的小工具框架、故障复合体和 ZX 演算； (2) 将时空距离与 Gottesman 形式主义中的小工具级正确性属性联系起来； （3）自然地容纳一系列故障模型，特别是现象学和电路级模型，通过不同的张量分解和故障分配将这些通常单独制定的描述带入公共代数框架中； (4) 将许多已知的容错结构和结果恢复为特殊情况，包括重复校正子提取、横向和折叠横向门的相关检测器、Steane 和 Knill 型校正子提取小工具以及单次错误校正。", "authors": [{"name": "Yijia Xu"}, {"name": "Yixu Wang"}, {"name": "Zi-Wen Liu"}], "featured_authors": [{"name": "Yijia Xu"}, {"name": "Yixu Wang"}, {"name": "Zi-Wen Liu"}], "author_count": 3}, {"id": "2609.39802", "category": "quant-ph", "title": "Double Localization for Quantum Gibbs Sampler Gaps: From an Abstract Framework to Finite-Group Models", "abstract": "We introduce double localization, a framework for proving spectral gaps of quantum Gibbs samplers through two complementary operations: geometric localization, which selects updates supported in small spatial regions, and interface localization, which focuses on a model-defined subspace of observables while remaining geometrically global. Our abstract gap theorem combines a global bound on this subspace, called the interface, with local quantum gap estimates under quantitative coupling and geometric assembly conditions. The resulting explicit lower bound controls the gap of the full dynamics without requiring the interface to be invariant under the generator. This separation allows global estimates, including classical comparison, to be combined with local control of the remaining quantum directions. We apply the framework to Hamiltonians built from the vertex terms of Kitaev's finite-group quantum double construction, without plaquette terms, on finite simple three-regular graphs of girth at least six. For the specified local Davies dynamics, we prove an unconditional spectral-gap lower bound by a positive constant independent of graph size for every fixed nontrivial finite group and each fixed inverse temperature $\\beta$ with $0\\le\\beta J<\\log(5/3)$, where $J>0$ is the coupling strength. For the smallest non-Abelian group $S_3$, double localization yields a positive lower bound uniform in both graph size and the entire interval $0\\le\\beta J\\le\\log 3$, providing a guarantee that does not follow directly from existing results. This demonstrates how model-specific finite calculations can extend spectral-gap guarantees for the full quantum dynamics.", "url": "https://arxiv.org/abs/2609.39802", "type": "理论+数值", "summary": "我们引入了双重定位，这是一个通过两个互补操作证明量子吉布斯采样器光谱间隙的框架：几何定位，选择小空间区域中支持的更新，以及界面定位，重点关注模型定义的可观测子空间，同时保持几何全局。我们的抽象间隙定理将这个子空间（称为界面）的全局界限与定量耦合和几何组装条件下的局部量子间隙估计结合起来。由此产生的显式下界控制整个动态的间隙，而不要求接口在生成器下保持不变。这种分离允许全局估计（包括经典比较）与剩余量子方向的局部控制相结合。我们将该框架应用于从基塔耶夫有限群量子双构​​造的顶点项构建的哈密顿量，没有板状项，在周长至少为六的有限简单三正则图上。\n\n对于指定的局部戴维斯动力学，我们通过与图大小无关的正常数来证明每个固定非平凡有限群和每个固定反温度 $\\beta$ 的无条件谱间隙下界，其中 $0\\le\\beta J<\\log(5/3)$，其中 $J>0$ 是耦合强度。对于最小的非阿贝尔群 $S_3$，双重定位在图大小和整个区间 $0\\le\\beta J\\le\\log 3$ 上产生正下界均匀，提供了不直接从现有结果得出的保证。这演示了特定于模型的有限计算如何扩展整个量子动力学的谱隙保证。", "authors": [{"name": "Ryu Hayakawa"}, {"name": "Angus Southwell"}, {"name": "Caesnan M. G. Leditto"}, {"name": "Kuo-Chin Chen"}, {"name": "Min-Hsiu Hsieh"}], "featured_authors": [{"name": "Ryu Hayakawa"}, {"name": "Angus Southwell"}, {"name": "Caesnan M. G. Leditto"}, {"name": "Kuo-Chin Chen"}, {"name": "Min-Hsiu Hsieh"}], "author_count": 5}, {"id": "2609.39814", "category": "quant-ph", "title": "Sharp Quantum Entropy Mixing Rates and the Operator Layer Cake Theorem", "abstract": "At what rate does the von Neumann entropy of an ensemble of quantum states change under Hamiltonian evolution of its constituents? Bravyi proposed the small incremental mixing conjecture controlling the mixing rate of a binary ensemble $\\{(1\\!-\\!p,\\rho_1),(p,\\rho_2)\\}$ by $c\\,\\|{H}\\|h_{2}(p)$ (with the binary entropy $h_{2}$). The proof of Bravyi's conjecture was subsequently reduced to the matrix inequality $\\|[A,\\log B]\\|_{1}\\!\\leq\\! c\\,h_{2}(p)$ for positive trace-class operators $A\\!\\leq\\! B$ with $\\text{Tr} A\\!=\\!p$ and $\\text{Tr} B\\!=\\!1$ on separable Hilbert spaces by Mariën, Audenaert, Van Acoleyen, and Verstraete, and they conjectured the optimal constant to be $c\\!=\\!1$. Here, I prove the latter conjecture using an exact integral representation of the commutator $[A,\\log B]$ obtained from the operator layer cake theorem, due to Cheng and Liu. The result gives a sharp dimension-independent limit on how rapidly unitary evolution of one component can change the entropy of a binary quantum ensemble. It follows that mixing rates satisfy small incremental mixing with the optimal constant, and entangling rates of bipartite Hamiltonians are bounded by $(2\\log d\\!+\\!1)\\|H\\|$. Moreover, the result corrects a conjecture by Lieb and Vershynina for mixing rates of general ensembles.", "url": "https://arxiv.org/abs/2609.39814", "type": "理论", "summary": "在其成分的哈密顿演化下，量子态集合的冯诺依曼熵以什么速率变化？ Bravyi 提出了小增量混合猜想，通过 $c\\,\\|{H}\\|h_{2}(p)$（二进制熵 $h_{2}$）控制二元系综 $\\{(1\\!-\\!p,\\rho_1),(p,\\rho_2)\\}$ 的混合率。 Bravyi猜想的证明随后被简化为矩阵不等式$\\|[A,\\log B]\\|_{1}\\!\\leq\\! c\\,h_{2}(p)$ 对于正迹类运算符 $A\\!\\leq\\! Mariën、Audenaert、Van Acoleyen 和 Verstraete 在可分离希尔伯特空间上的 B$ 和 $\\text{Tr} A\\!=\\!p$ 和 $\\text{Tr} B\\!=\\!1$，他们推测最优常数为 $c\\!=\\!1$。在这里，我使用由 Cheng 和 Liu 的算子层蛋糕定理获得的换向器 $[A,\\log B]$ 的精确积分表示来证明后一个猜想。结果给出了一个与维度无关的尖锐限制，限制了一个组件的幺正演化改变二元量子系综熵的速度。由此可见，混合速率满足具有最佳常数的小增量混合，二分哈密顿量的纠缠速率以 $(2\\log d\\!+\\!1)\\|H\\|$ 为界。\n\n此外，结果纠正了 Lieb 和 Vershynina 对一般系综混合率的猜想。", "authors": [{"name": "Alexander Stottmeister"}], "featured_authors": [{"name": "Alexander Stottmeister"}], "author_count": 1}, {"id": "2609.39821", "category": "quant-ph", "title": "Learning Random Quantum Circuits and the Emergence of Pseudorandomness", "abstract": "We give an efficient algorithm for learning $k$-dimensional brickwork random quantum circuits using only copies of the output state obtained by applying $U$ to the all-zero input. For a depth-$d$ circuit on $n$ sites with random $2\\ell$-qubit gates, the algorithm learns the original circuit $U$ with high probability in $\\text{poly}(n,2^{\\ell d})$ time for every constant dimensional lattice. In particular, the algorithm is polynomial time as long as $\\ell d = O(\\log n)$. In one dimension, this reaches the natural boundary suggested by pseudorandomness: pseudorandom states require $\\ell d=\\omega(\\log n)$, and structured cryptographic constructions suggest that this scale may be achievable from above. In higher dimensions, it remains plausible that the same $\\ell d=\\omega(\\log n)$ scale remains the threshold for ancilla-free pseudorandomness, and our results help clarify the conditions under which pseudorandomness can arise in this setting. The main idea behind our algorithm is a local correlation criterion that identifies gates in the final layer without learning their entire backward light cones, avoiding a bottleneck in the previous approaches. A key technical ingredient is a Carbery-Wright type anticoncentration inequality for low-degree polynomials of Haar random unitaries whose small-ball exponent is independent of the matrix dimension. The dimension-independent exponent is crucial for handling gates of growing locality. This anticoncentration result may also be of independent interest.", "url": "https://arxiv.org/abs/2609.39821", "type": "理论+数值", "summary": "我们给出了一种有效的算法，用于仅使用通过将 $U$ 应用于全零输入而获得的输出状态的副本来学习 $k$ 维砖砌随机量子电路。对于具有随机 $2\\ell$ 量子位门的 $n$ 个站点上的深度 $d$ 电路，该算法对于每个常量维晶格，在 $\\text{poly}(n,2^{\\ell d})$ 时间内以高概率学习原始电路 $U$。特别是，只要 $\\ell d = O(\\log n)$，该算法就是多项式时间。在一个维度上，这达到了伪随机性所暗示的自然边界：伪随机状态需要 $\\ell d=\\omega(\\log n)$，而结构化密码结构表明这个规模可以从上面实现。在更高的维度中，相同的 $\\ell d=\\omega(\\log n)$ 尺度仍然是无辅助伪随机性的阈值，我们的结果有助于阐明在这种情况下出现伪随机性的条件。我们算法背后的主要思想是局部相关性标准，它可以识别最后一层中的门，而无需学习其整个后向光锥，从而避免了先前方法中的瓶颈。\n\n一个关键的技术要素是 Haar 随机酉低次多项式的 Carbery-Wright 型反集中不等式，其小球指数与矩阵维数无关。与维度无关的指数对于处理增长局部性的门至关重要。该反集中结果也可能具有独立意义。", "authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Qizhao Huang"}, {"name": "Makrand Sinha"}], "featured_authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Qizhao Huang"}, {"name": "Makrand Sinha"}], "author_count": 3}, {"id": "2609.39823", "category": "quant-ph", "title": "Improved Quantum Random Self-Reduction for Linear Problems", "abstract": "We study quantum random self-reductions for linear problems over finite fields. Let $M\\in\\mathbb{F}^{n\\times n}$ be an arbitrary matrix, and let $\\mathcal{O}$ be an oracle that agrees with the linear map $x\\mapsto Mx$ on an $\\varepsilon$-fraction of inputs $x\\sim\\mathbb{F}^n$. Given coherent access to $\\mathcal{O}$ and coherent entry access to $M$, we give a uniform quantum reduction that computes $Mx$ on any prescribed input $x$ with probability at least $2/3$ in time $\\widetilde{O}(nT^{1/3})$, for $n\\le T\\le n^{3/2}$ and constant field size and $\\varepsilon$, where $T$ is the cost of one coherent query to $\\mathcal{O}$. In particular, when $T=\\widetilde{O}(n)$, the reduction runs in time $\\widetilde{O}(n^{4/3})$, improving the $\\widetilde{O}(n^{3/2}+T)$ reduction of Asadi, Golovnev, Gur, Shinkar, and Subramanian (SODA 2024). Our reduction uses the Bogolyubov--Ruzsa subspace guaranteed by additive combinatorics, but it avoids learning this subspace explicitly, which was computationally expensive for the previous reduction; in particular, it does not recover a basis for its orthogonal complement. The main technical step is to decompose the inputs into sparse pieces and find a vector that lies outside the Bogolyubov--Ruzsa subspace via a quantum search based on amplitude amplification. This yields a tunable tradeoff between the cost of querying the average-case oracle and the cost of verifying matrix-vector products.", "url": "https://arxiv.org/abs/2609.39823", "type": "理论", "summary": "我们研究有限域上线性问题的量子随机自约简。令 $M\\in\\mathbb{F}^{n\\times n}$ 为任意矩阵，并令 $\\mathcal{O}$ 为与输入 $x\\sim\\mathbb{F}^n$ 的 $\\varepsilon$ 分数上的线性映射 $x\\mapsto Mx$ 一致的预言。给定对 $\\mathcal{O}$ 的连贯访问和对 $M$ 的连贯条目访问，我们给出了一种统一的量子缩减，可以在任何规定的输入 $x$ 上计算 $Mx$，时间 $\\widetilde{O}(nT^{1/3})$ 的概率至少为 $2/3$，对于 $n\\le T\\le n^{3/2}$ 和恒定的字段大小和 $\\varepsilon$，其中 $T$ 是一个连贯查询的成本$\\mathcal{O}$。特别是，当 $T=\\widetilde{O}(n)$ 时，缩减会及时运行 $\\widetilde{O}(n^{4/3})$，从而改善 Asadi、Golovnev、Gur、Shinkar 和 Subramanian 的 $\\widetilde{O}(n^{3/2}+T)$ 缩减 (SODA 2024)。我们的归约使用了由加性组合学保证的 Bogolyubov-Ruzsa 子空间，但它避免了显式学习这个子空间，这对于之前的归约来说计算量很大；特别是，它没有恢复其正交补集的基础。\n\n主要技术步骤是将输入分解为稀疏片段，并通过基于幅度放大的量子搜索找到位于 Bogolyubov-Ruzsa 子空间之外的向量。这在查询平均情况预言机的成本和验证矩阵向量乘积的成本之间产生了可调整的权衡。", "authors": [{"name": "Vahid R. Asadi"}, {"name": "Shuichi Hirahara"}, {"name": "Nobutaka Shimizu"}], "featured_authors": [{"name": "Vahid R. Asadi"}, {"name": "Shuichi Hirahara"}, {"name": "Nobutaka Shimizu"}], "author_count": 3}, {"id": "2609.39835", "category": "quant-ph", "title": "A self-tallying quantum anonymous voting protocol for multiple-selection elections", "abstract": "Self-tallying quantum anonymous voting (SQAV) has drawn considerable attention since it was proposed. However, constrained by design challenges, all existing protocols only accommodate single-selection voting and cannot support multi-selection voting. In this paper, we propose a SQAV protocol with multi-selection voting functionality. In our protocol, $nm$ $n$-particle entangled states are equally divided into $n$ groups, and the $n$ particles in each entangled state are delivered to $n$ voters, one particle per voter. Each voter obtains $n$ voting vectors by sequentially measuring all his (or her) particles that belong to $n$ different group, and then encodes his or her voting information into the vector corresponding to the secret index. Due to entanglement correlation, each voter can verify whether his or her ballot is correct through computation, while any participant can obtain the vote count for each candidate through computation. Our protocol satisfies self-tallying, nonreusability, verifiability, and fairness.", "url": "https://arxiv.org/abs/2609.39835", "type": "理论", "summary": "自计数量子匿名投票（SQAV）自提出以来就引起了广泛关注。然而，受设计挑战的限制，现有协议仅支持单选投票，无法支持多选投票。在本文中，我们提出了一种具有多选投票功能的 SQAV 协议。在我们的协议中，$nm$$n$粒子纠缠态被平均分为$n$组，每个纠缠态中的$n$个粒子被传递给$n$个投票者，每个投票者一个粒子。每个投票者通过顺序测量属于$n$个不同组的所有粒子来获得$n$个投票向量，然后将他或她的投票信息编码到秘密索引对应的向量中。由于纠缠相关性，每个投票者都可以通过计算验证自己的选票是否正确，而任何参与者都可以通过计算获得每个候选人的得票数。我们的协议满足自计数、不可重用性、可验证性和公平性。", "authors": [{"name": "Guang-Bao Xu"}, {"name": "Meng-Na Li"}, {"name": "Yu-Guang Yang"}, {"name": "Dong-Huan Jiang"}], "featured_authors": [{"name": "Guang-Bao Xu"}, {"name": "Meng-Na Li"}, {"name": "Yu-Guang Yang"}, {"name": "Dong-Huan Jiang"}], "author_count": 4}, {"id": "2609.39844", "category": "quant-ph", "title": "Natural Barriers to Quantum Extraction: On the Post-Quantum (In)security of (O)EKE and Masny-Rindal OT", "abstract": "Encrypted key exchange (EKE), introduced by Bellovin and Merritt (IEEE S\\&P 1992), and Masny-Rindal OT, introduced by Masny and Rindal (ACM CCS 2019), are highly-efficient methods for compiling essentially any KEM into advanced cryptographic protocols, namely password-authenticated key exchange (PAKE) and oblivious transfer (OT), by relying only on idealized symmetric-key primitives. They have become leading candidates for practically-implementable PAKE and OT due to (1) their simplicity, (2) their plug-and-play nature, allowing for flexibility in the choice of KEM, and (3) existing proofs of UC-security (in the classical adversarial model). Due to point (2) above, these compilers yield attractive candidates for efficient \\emph{post-quantum} PAKE and OT, especially given the recent post-quantum KEM standardization efforts. This motivates the question of whether the (UC-)security of these compilers translates to the quantum adversarial model. In this work, we show that it does not. In particular, we prove that a general family of (O)EKE protocols, as well as Masny-Rindal OT, are \\emph{not} UC-secure against quantum polynomial-time adversaries, even when instantiated with a post-quantum KEM. To establish UC-insecurity, we devise an adversarial strategy that provably thwarts any attempt by the simulator to extract its input (the password in the case of PAKE, and the receiver's choice bit in the case of OT). To complement these negative results, we establish that both compilers yield certain notions of \\emph{game-based} security. Along the way, we establish a novel ``advantage-tight'' one-way to hiding lemma that may be of independent interest.", "url": "https://arxiv.org/abs/2609.39844", "type": "理论", "summary": "Bellovin 和 Merritt (IEEE S\\&P 1992) 引入的加密密钥交换 (EKE) 以及 Masny 和 Rindal (ACM CCS 2019) 引入的 Masny-Rindal OT 是仅依赖理想化对称密钥原语将基本上任何 KEM 编译为高级加密协议的高效方法，即密码验证密钥交换 (PAKE) 和不经意传输 (OT)。它们已成为实际可实现的 PAKE 和 OT 的主要候选者，因为 (1) 它们的简单性，(2) 它们的即插即用性质，允许灵活地选择 KEM，以及 (3) 现有的 UC 安全性证明（在经典的对抗模型中）。由于上述第 (2) 点，这些编译器为高效的 \\emph{post-quantum} PAKE 和 OT 提供了有吸引力的候选者，特别是考虑到最近的后量子 KEM 标准化工作。这就引发了这样一个问题：这些编译器的（UC-）安全性是否可以转化为量子对抗模型。在这项工作中，我们证明事实并非如此。\n\n特别是，我们证明了 (O)EKE 协议的一般族以及 Masny-Rindal OT 对于量子多项式时间对手来说是 \\emph{not} UC 安全的，即使是用后量子 KEM 实例化时也是如此。为了建立 UC 不安全性，我们设计了一种对抗策略，可以证明可以阻止模拟器提取其输入的任何尝试（PAKE 情况下为密码，OT 情况下为接收者选择位）。为了补充这些负面结果，我们确定两个编译器都会产生某些 \\emph{基于游戏} 安全性的概念。在此过程中，我们建立了一种新颖的“优势紧密”单向隐藏引理，该引理可能具有独立兴趣。", "authors": [{"name": "James Bartusek"}, {"name": "Jake Januzelli"}], "featured_authors": [{"name": "James Bartusek"}, {"name": "Jake Januzelli"}], "author_count": 2}, {"id": "2609.39861", "category": "quant-ph", "title": "Reverse quantum state diffusion from differential geometry", "abstract": "Quantum state diffusion unravels a Lindblad master equation into stochastic trajectories of pure states. The ensemble of trajectories is described by a probability density on the manifold of pure states, which contains much more information than the density matrix, its first moment. We derive the time reversal of this diffusion. Writing the reversal of a general diffusion on a manifold in Stratonovich form, and passing through the manifold of pure states, we obtain a backward stochastic differential equation for the state vector, valid for any Hilbert space dimension and any Lindbladian. The backward stochastic equation provides a physical, nonlinear unravelling of the inverse Lindbladian that holds only for the ensemble from which it was constructed. Following score-based generative models, we then use the backward equation to generate a new ensemble close to the original. For the depolarizing channel the unravelling is a Brownian motion on complex projective space, so the uniform distribution of pure states is its stationary law in any dimension. Starting the backward equation from that prior, we bound the error of the resulting distribution compared to the original one in different settings: exact and learned scores, continuous and discrete time.", "url": "https://arxiv.org/abs/2609.39861", "type": "理论", "summary": "量子态扩散将 Lindblad 主方程分解为纯态的随机轨迹。轨迹的集合是由纯态流形上的概率密度来描述的，它包含比密度矩阵（其一阶矩）更多的信息。我们推导出这种扩散的时间反转。将一般扩散的反转写在斯特拉托诺维奇形式的流形上，并通过纯状态流形，我们获得状态向量的向后随机微分方程，对于任何希尔伯特空间维度和任何林布拉德都有效。后向随机方程提供了逆 Lindbladian 的物理非线性解析，该解仅适用于构建它的系综。遵循基于分数的生成模型，然后我们使用后向方程生成接近原始的新集合。对于去极化通道来说，其解开是复射影空间上的布朗运动，因此纯态的均匀分布是其在任何维度上的平稳律。\n\n从先验开始向后方程，我们在不同设置下限制了所得分布与原始分布的误差：精确分数和学习分数、连续时间和离散时间。", "authors": [{"name": "Dinh-Long Vu"}, {"name": "Patrick Rebentrost"}], "featured_authors": [{"name": "Dinh-Long Vu"}, {"name": "Patrick Rebentrost"}], "author_count": 2}, {"id": "2609.39865", "category": "quant-ph", "title": "Reducing the Entanglement Cost of Distributed Bipartite Quantum Computation with Constant Qubit Overhead", "abstract": "Distributed quantum computation connects multiple quantum processing units (QPUs) through quantum communication to jointly perform large-scale quantum computations. Since the number of qubits available at each QPU is limited, it is important to reduce quantum communication while keeping the qubit overhead small. To this end, we study an entanglement-assisted model, in which entanglement consumption serves as a measure of quantum communication cost. For exact deterministic implementations in this model, the operator Schmidt rank of the target bipartite unitary provides a general lower bound on entanglement cost when qubit overhead is unrestricted. However, it has remained unclear how closely this bound can be approached with constant qubit overhead. In this work, we show that this lower bound is attainable for every bipartite Clifford unitary using at most two auxiliary qubits per QPU. In addition, for non-Clifford unitaries specified by exact Clifford+$T$ decompositions with $T$-count $t$, we construct implementations with the same qubit overhead whose entanglement cost is at most $2t$ Bell pairs above this lower bound.", "url": "https://arxiv.org/abs/2609.39865", "type": "理论", "summary": "Distributed quantum computation connects multiple quantum processing units (QPUs) through quantum communication to jointly perform large-scale quantum computations. Since the number of qubits available at each QPU is limited, it is important to reduce quantum communication while keeping the qubit overhead small.为此，我们研究了一种纠缠辅助模型，其中纠缠消耗作为量子通信成本的衡量标准。 For exact deterministic implementations in this model, the operator Schmidt rank of the target bipartite unitary provides a general lower bound on entanglement cost when qubit overhead is unrestricted.然而，目前尚不清楚在恒定的量子位开销下可以多么接近这个界限。在这项工作中，我们证明对于每个 QPU 最多使用两个辅助量子位的每个二分 Clifford 酉都可以实现这个下界。 In addition, for non-Clifford unitaries specified by exact Clifford+$T$ decompositions with $T$-count $t$, we construct implementations with the same qubit overhead whose entanglement cost is at most $2t$ Bell pairs above this lower bound.", "authors": [{"name": "Kosuke Matsui"}, {"name": "Jun-Yi Wu"}, {"name": "Min-Hsiu Hsieh"}, {"name": "Mio Murao"}], "featured_authors": [{"name": "Kosuke Matsui"}, {"name": "Jun-Yi Wu"}, {"name": "Min-Hsiu Hsieh"}, {"name": "Mio Murao"}], "author_count": 4}, {"id": "2609.39908", "category": "quant-ph", "title": "Quantum Sensing and Hamiltonian Learning under Stochastic Parameter Evolution", "abstract": "We introduce the notion of stochastically evolving Hamiltonians (SEHs), which are local Hamiltonians whose coefficients are governed by stochastic differential equations (SDEs). After developing some theoretical aspects of these objects, we consider the task of Hamiltonian learning for SEHs. We reanalyse and make necessary extensions to the Huang-Tong-Fang-Su protocol, which first achieved the Heisenberg limit for Hamiltonian coefficient learning, under these circumstances. We delineate theoretically the regimes where the Heisenberg limit can and cannot be retained. Along the way we develop a few tools in quantum sensing and Hamiltonian simulation that may be of independent interest under similar settings in quantum information processing. The broad aim is to encourage the exploration of various settings in quantum information processing in which the control parameters are governed by SDEs.", "url": "https://arxiv.org/abs/2609.39908", "type": "理论+数值", "summary": "我们引入了随机演化哈密顿量（SEH）的概念，它们是局部哈密顿量，其系数由随机微分方程（SDE）控制。在开发了这些对象的一些理论方面之后，我们考虑了 SEH 的哈密顿学习任务。在这种情况下，我们对黄桐方苏协议进行了重新分析和必要的扩展，该协议首先实现了哈密顿系数学习的海森堡极限。 We delineate theoretically the regimes where the Heisenberg limit can and cannot be retained.在此过程中，我们开发了一些量子传感和哈密顿模拟工具，这些工具在量子信息处理的类似环境下可能具有独立的兴趣。其总体目标是鼓励探索量子信息处理中的各种设置，其中控制参数由 SDE 控制。", "authors": [{"name": "Kelvin Koor"}, {"name": "Patrick Rebentrost"}], "featured_authors": [{"name": "Kelvin Koor"}, {"name": "Patrick Rebentrost"}], "author_count": 2}, {"id": "2609.39918", "category": "quant-ph", "title": "Verifiable quantum advantage based on polynomials with planted structures", "abstract": "A central question in the theory of quantum advantage is whether there are quantum advantage protocols with similar resource requirements as random circuit sampling that are also verifiable just from the classical outputs of the quantum computation. Here, we develop the idea of simulation secrets for verifiable advantage. A verifier can use a simulation secret to evaluate a cross-entropy test faster than it would take a classical adversary to pass the test. We instantiate this idea using IQP circuits described by cubic polynomials with planted independent spaces. These correspond to the largest independent set in the orbit of a polynomial under the general linear group and yield a low-rank stabilizer decomposition of the corresponding state. We conjecture that large independent spaces are invisible to a computationally bounded adversary, and therefore they cannot exploit them to pass the protocol. A second conjecture regards the fine-grained complexity of producing samples that pass the cross-entropy test for uniformly random polynomials. Under these conjectures, our scheme results in a polynomial gap between the verification time and the time a classical adversary would need to pass the protocol---both are exponential. It has a potential application to generating classically certifiable randomness, since the output distributions have high min-entropy. We estimate that the planted polynomial scheme is implementable using 100 logical qubits at logical error rates around $10^{-6}$.", "url": "https://arxiv.org/abs/2609.39918", "type": "理论+数值", "summary": "量子优势理论的一个核心问题是，是否存在具有与随机电路采样类似的资源需求的量子优势协议，并且也可以仅根据量子计算的经典输出进行验证。在这里，我们提出了模拟秘密的想法，以获得可验证的优势。验证者可以使用模拟秘密来评估交叉熵测试，其速度比经典对手通过测试的速度更快。我们使用由具有植入独立空间的三次多项式描述的 IQP 电路来实例化这个想法。这些对应于一般线性群下多项式轨道中的最大独立集，并产生相应状态的低秩稳定器分解。我们推测，巨大的独立空间对于计算有限的对手来说是不可见的，因此他们无法利用它们来通过协议。第二个猜想涉及生成通过均匀随机多项式交叉熵测试的样本的细粒度复杂性。\n\n在这些猜想下，我们的方案导致验证时间和经典对手通过协议所需的时间之间存在多项式差距——两者都是指数级的。它具有生成经典可证明随机性的潜在应用，因为输出分布具有高最小熵。我们估计，植入多项式方案可以使用 100 个逻辑量子位以大约 10^{-6}$ 的逻辑错误率来实现。", "authors": [{"name": "Markus Bläser"}, {"name": "Michael Gullans"}, {"name": "Dominik Hangleiter"}, {"name": "Yuxuan Liu"}, {"name": "Youming Qiao"}], "featured_authors": [{"name": "Markus Bläser"}, {"name": "Michael Gullans"}, {"name": "Dominik Hangleiter"}, {"name": "Yuxuan Liu"}, {"name": "Youming Qiao"}], "author_count": 5}, {"id": "2609.39922", "category": "quant-ph", "title": "Fault-tolerant cost of shallow QAOA on near-symmetric optimization problems", "abstract": "Montanaro and Zhou proved that depth-one Quantum Approximate Optimization Algorithm (QAOA) finds the planted solution of certain near-symmetric constraint satisfaction problems with probability $\\Omega(1)$, and observed exponential runtimes for general-purpose classical solvers on explicit realizations, providing strong evidence of an empirical exponential speedup of low-depth QAOA. We ask what such a circuit costs fault-tolerantly. Although the cost Hamiltonian carries $\\Theta(n^\\ell)$ clauses, the rotation angle at which QAOA succeeds shrinks as $n^{1-\\ell}$, and we show that small-angle Clifford$+T$ rotation synthesis reduces the non-Clifford cost per circuit to $\\widetilde O(n^2)$ for every clause locality $\\ell$. Compiling the circuit, however, requires the explicit clause list. We find that the mechanism underlying constant QAOA success fixes the degree-one Fourier coefficients of the cost, whose signs reveal the planted solution. However, this leakage need not reveal the solution: we design families in which the quadratic non-Clifford scaling and hard exact optimization coexist.", "url": "https://arxiv.org/abs/2609.39922", "type": "理论+数值", "summary": "Montanaro 和 Zhou 证明了深度一量子近似优化算法 (QAOA) 以 $\\Omega(1)$ 的概率找到了某些近对称约束满足问题的植入解，并观察到了通用经典求解器在显式实现上的指数运行时间，为低深度 QAOA 的经验指数加速提供了有力的证据。我们问这样一个电路的容错成本是多少。尽管成本哈密顿量带有 $\\Theta(n^\\ell)$ 子句，但 QAOA 成功的旋转角度缩小为 $n^{1-\\ell}$，并且我们表明，对于每个子句局部性 $\\ell$，小角度 Clifford$+T$ 旋转综合将每个电路的非 Clifford 成本降低到 $\\widetilde O(n^2)$。然而，编译电路需要显式子句列表。我们发现，QAOA 持续成功的潜在机制固定了成本的一阶傅里叶系数，其符号揭示了所设定的解决方案。然而，这种泄漏不需要揭示解决方案：我们设计了二次非克利福德缩放和硬精确优化共存的系列。", "authors": [{"name": "Jernej Rudi Finžgar"}, {"name": "Martin Leib"}, {"name": "Elisabeth Wybo"}], "featured_authors": [{"name": "Jernej Rudi Finžgar"}, {"name": "Martin Leib"}, {"name": "Elisabeth Wybo"}], "author_count": 3}, {"id": "2609.39941", "category": "quant-ph", "title": "Fast and Sure-ious Quantum Process Tomography", "abstract": "Quantum process tomography (QPT) protocols are often designed by lifting quantum state tomography (QST) protocols through the Choi-Jamiolkowski isomorphism, at the cost of an extra step enforcing the trace-preserving (TP) constraint. Existing approaches fall into two classes. The folklore partial normalization, which sandwiches the density e
