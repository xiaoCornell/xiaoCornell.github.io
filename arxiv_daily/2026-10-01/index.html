to the surface. Locally varying liquid crystal order leads to local variations in bending rigidities and surface viscosity and thus influences the shape evolution. This provides a multiscale coupling between the local membrane mechanics on the level of the lipids and the mesoscopic length and time scales of biological functions. The model is derived using the Lagrange--d'Alembert principle. We provide a numerical algorithm to solve the equations in the one-constant approximation and demonstrate the impact on the emerging equilibrium shapes, which not only depend on the specified conserved surface area and enclosed volume, as for the classical curvature-elasticity free energy, but also the elastic parameter. Exploring the dynamic evolution shows a tight coupling of tangential flow, shape evolution and liquid crystalline order. We further point to extensions towards lipid phase separation and asymmetric lipid bilayers.", "url": "https://arxiv.org/abs/2609.40113", "type": "理论+数值", "summary": "最小化流体脂质膜的经典曲率弹性自由能的动态方法被扩展到表面 Beris-Edwards-Helfrich 模型。这种扩展明确地处理了膜的液晶结构，该结构由脂质分子产生，平均而言，垂直于表面取向。局部变化的液晶顺序导致弯曲刚度和表面粘度的局部变化，从而影响形状演变。这提供了脂质水平上的局部膜力学与生物功能的介观长度和时间尺度之间的多尺度耦合。该模型是利用拉格朗日-达朗贝尔原理推导出来的。我们提供了一种数值算法来求解一常数近似中的方程，并证明了对新兴平衡形状的影响，对于经典曲率弹性自由能而言，这不仅取决于指定的守恒表面积和封闭体积，还取决于弹性参数。探索动态演化表明切向流、形状演化和液晶有序之间的紧密耦合。\n\n我们进一步指出了脂质相分离和不对称脂质双层的扩展。", "authors": [{"name": "Ingo Nitschke"}, {"name": "Maik Porrmann"}, {"name": "Axel Voigt"}], "featured_authors": [{"name": "Ingo Nitschke"}, {"name": "Maik Porrmann"}, {"name": "Axel Voigt"}], "author_count": 3}, {"id": "2609.40150", "category": "cond-mat", "title": "adapol: Adaptive pole-fitting for quantum many-body physics", "abstract": "We describe adapol, a Python package for fitting Matsubara Green's functions, self-energies, and hybridization functions by a compact sum of simple poles with real pole locations and matrix-valued residues. This pole-fitting step arises in many contexts, including hybridization fitting for quantum impurity solvers based on exact diagonalization, perturbation theory, and tensor networks, the compression of existing pole expansions such as the discrete Lehmann representation, diagrammatic methods based on discrete pole representations, and the analytic continuation of Matsubara Green's functions. adapol uses a modified version of the AAA rational approximation algorithm to estimate pole locations, and non-convex optimization to refine them. This procedure yields accurate and compact fits in a black-box and noise-robust manner. adapol provides a simple, self-contained interface with extensive documentation and examples, as well as an interface to the TRIQS package.", "url": "https://arxiv.org/abs/2609.40150", "type": "理论+数值", "summary": "我们描述了 adapol，一个 Python 包，用于通过具有真实极点位置和矩阵值留数的简单极点的紧凑和来拟合松原格林函数、自能和杂交函数。这种极点拟合步骤出现在许多情况下，包括基于精确对角化、微扰理论和张量网络的量子杂质求解器的杂交拟合、现有极点展开式的压缩（例如离散莱曼表示）、基于离散极点表示的图解方法以及松原格林函数的解析延拓。 adapol 使用 AAA 有理逼近算法的修改版本来估计极点位置，并使用非凸优化来改进它们。该过程以黑盒和抗噪声的方式产生精确且紧凑的配合。 adapol 提供了一个简单、独立的界面，其中包含大量文档和示例，以及 TRIQS 包的界面。", "authors": [{"name": "Zhen Huang"}, {"name": "Chia-Nan Yeh"}, {"name": "Lin Lin"}, {"name": "Nils Wentzell"}, {"name": "Jason Kaye"}, {"name": "Hugo U. R. Strand"}], "featured_authors": [{"name": "Zhen Huang"}, {"name": "Chia-Nan Yeh"}, {"name": "Lin Lin"}, {"name": "Nils Wentzell"}, {"name": "Jason Kaye"}, {"name": "Hugo U. R. Strand"}], "author_count": 6}, {"id": "2609.40209", "category": "cond-mat", "title": "Designing Strongly Correlated Quantum Phases of Matter with Foundation Neural-Network Quantum States", "abstract": "Designing a material with a desired property amounts to solving an inverse problem: finding the couplings of a microscopic Hamiltonian whose ground state exhibits that property. For strongly correlated quantum systems, solving this problem efficiently remains largely out of reach. To address this challenge, we present a general framework for ab initio inverse design based on Foundation Neural-Network Quantum States, a recent approach in which the ground states of a family of Hamiltonians are encoded in a single variational wave function. Because the ansatz depends explicitly on the couplings, any target property is a differentiable function of them, and the search for the right Hamiltonian reduces to gradient-based optimization in coupling space. We apply this approach to search for nonmagnetic phases of frustrated Heisenberg models on the square lattice with an increasing number of free next-nearest-neighbor couplings, aiming to identify new quantum spin liquid candidates. With a single coupling, the method recovers the known nonmagnetic window of the square $J_1$-$J_2$ Heisenberg model, whereas letting the two diagonal couplings vary independently reveals an extended nonmagnetic region connecting the square-lattice and anisotropic-triangular-lattice regimes. In a search space of eight independent couplings within a $2\\times2$ unit cell, which contains several paradigmatic frustrated spin models, the optimization spontaneously converges to the $J_1$-$J_2$-$\\delta$ Heisenberg model, in which the diagonal couplings alternate between two values on neighboring plaquettes, a model recently proposed in the context of altermagnetism. Finite-size scaling up to $16\\times16$ clusters in this optimal model shows that the ground state has no magnetic, dimer, or plaquette order, establishing it as a new quantum spin liquid candidate, distinct from those previously proposed on the square lattice.", "url": "https://arxiv.org/abs/2609.40209", "type": "理论+数值", "summary": "设计具有所需特性的材料相当于解决一个逆问题：找到其基态表现出该特性的微观哈密顿量的耦合。对于强相关量子系统来说，有效地解决这个问题在很大程度上仍然遥不可及。为了应对这一挑战，我们提出了一个基于基础神经网络量子态的从头算逆设计的通用框架，这是一种最新的方法，其中哈密顿量族的基态被编码在单个变分波函数中。因为 ansatz 明确依赖于耦合，所以任何目标属性都是它们的可微函数，并且对正确哈密顿量的搜索简化为耦合空间中基于梯度的优化。我们应用这种方法来搜索方形晶格上受挫海森堡模型的非磁性相，并具有越来越多的自由次近邻耦合，旨在识别新的量子自旋液体候选者。\n\n通过单次耦合，该方法恢复了方形$J_1$-$J_2$海森堡模型的已知非磁性窗口，而让两个对角线耦合独立变化揭示了连接方形晶格和各向异性三角形晶格区域的扩展非磁性区域。在 $2\\times2$ 晶胞内的八个独立耦合的搜索空间中，其中包含几个典型的受挫自旋模型，优化自发地收敛到 $J_1$-$J_2$-$\\delta$ 海森堡模型，其中对角耦合在相邻斑块上的两个值之间交替，这是最近在交变磁学背景下提出的一个模型。在这个最佳模型中，有限尺寸放大到$16\\times16$簇表明基态没有磁性、二聚体或斑片序，将其确立为新的量子自旋液体候选者，与之前在方形晶格上提出的那些不同。", "authors": [{"name": "Alessandro Sinibaldi"}, {"name": "Luciano Loris Viteritti"}, {"name": "Riccardo Rende"}, {"name": "Federico Becca"}, {"name": "Giuseppe Carleo"}], "featured_authors": [{"name": "Alessandro Sinibaldi"}, {"name": "Luciano Loris Viteritti"}, {"name": "Riccardo Rende"}, {"name": "Federico Becca"}, {"name": "Giuseppe Carleo"}], "author_count": 5}, {"id": "2609.40308", "category": "cond-mat", "title": "Phase-Field Modeling of Liquid Phases with Ordering", "abstract": "A strong negative enthalpy of mixing can lead to ordering in liquid solutions. To describe ordering in liquids, different thermodynamic descriptions of liquid phases have been developed in the CALPHAD approach, including the associate model and the modified quasichemical model. In this study, we show that the key to directly incorporate these liquid phase models and their corresponding CALPHAD-type free energy formulations in phase-field simulations, is to identify the internal processes and to properly define the internal thermodynamic variables. The free energy of the liquid phase can then be converted to a function of component compositions and internal variables, and the evolution of the internal variables will be determined via Allen-Cahn-type relaxation equations. We demonstrate this modeling strategy using the formation of stoichiometric phases from liquid phases in Na-Sb and Na-Sn systems. This study will pave the way for predicting microstructure evolution in liquids with ordering using phase-field simulations.", "url": "https://arxiv.org/abs/2609.40308", "type": "理论+数值", "summary": "强烈的负混合焓可导致液体溶液有序化。为了描述液体中的有序性，在 CALPHAD 方法中开发了不同的液相热力学描述，包括关联模型和改进的准化学模型。在这项研究中，我们表明，在相场模拟中直接结合这些液相模型及其相应的 CALPHAD 型自由能公式的关键是识别内部过程并正确定义内部热力学变量。然后，液相的自由能可以转换为组分组成和内部变量的函数，并且内部变量的演化将通过 Allen-Cahn 型松弛方程确定。我们利用 Na-Sb 和 Na-Sn 系统中的液相形成化学计量相来演示这种建模策略。这项研究将为使用相场模拟预测液体中的微观结构演化铺平道路。", "authors": [{"name": "Yanzhou Ji"}, {"name": "Chengyin Wu"}], "featured_authors": [{"name": "Yanzhou Ji"}, {"name": "Chengyin Wu"}], "author_count": 2}, {"id": "2609.40329", "category": "cond-mat", "title": "Spectral theory for dynamical large deviations in non-Markov self-interacting processes", "abstract": "We develop a spectral theory for dynamical large deviations in non-Markov jump processes and non-Markov chains, whose dynamics depends on the past through state- and jump-dependent empirical observables. We demonstrate that a multiscale Wentzel-Kramers-Brillouin-Jeffreys (WKBJ) Ansatz separates fast configurational relaxation from slow memory evolution, reducing the Feynman--Kac equation for occupation and flux statistics to an eigenvalue problem for a new tilted operator coupled to Hamilton--Jacobi characteristics. This provides a computationally efficient framework for quantifying fluctuations in a broad class of non-Markovian systems. We illustrate our general results with a bistable self-induced East model.", "url": "https://arxiv.org/abs/2609.40329", "type": "理论", "summary": "我们开发了一种用于非马尔可夫跳跃过程和非马尔可夫链中动态大偏差的谱理论，其动力学通过依赖于状态和跳跃的经验可观测量来依赖于过去。我们证明了多尺度 Wentzel-Kramers-Brillouin-Jeffreys (WKBJ) Ansatz 将快速构型松弛与缓慢的记忆演化分开，将占位和通量统计的 Feynman-Kac 方程简化为与 Hamilton-Jacobi 特性耦合的新倾斜算子的特征值问题。这提供了一个计算有效的框架，用于量化广泛的非马尔可夫系统中的波动。我们用双稳态自感东模型来说明我们的一般结果。", "authors": [{"name": "Francesco Coghi"}, {"name": "Juan P. Garrahan"}], "featured_authors": [{"name": "Francesco Coghi"}, {"name": "Juan P. Garrahan"}], "author_count": 2}, {"id": "2609.38209", "category": "hep-th", "title": "Dear Quantizers, Stochastic $\\approx$ Brane", "abstract": "Stochastic quantization formulates $d$-dimensional Euclidean QFT as the equilibrium limit of a $(d+1)$-dimensional Langevin system. Using the supersymmetric formulation of stochastic systems, we apply techniques from Morse theory to study Langevin dynamics. We interpret stochastic quantization as the absolutization of a relative QFT by a bulk cohomological topological Equilibrium TFT (\"EqmTFT\"), and relate its enriched Neumann boundary data to the $d$-dimensional BV/BRST complex. Analytic continuation reveals connections to the A-model and non-relativistic and Carrollian limits.", "url": "https://arxiv.org/abs/2609.38209", "type": "理论", "summary": "随机量化将 $d$ 维欧几里德 QFT 表述为 $(d+1)$ 维 Langevin 系统的平衡极限。使用随机系统的超对称公式，我们应用莫尔斯理论的技术来研究朗之万动力学。我们将随机量化解释为体上同调拓扑平衡 TFT（“EqmTFT”）对相对 QFT 的绝对化，并将其丰富的诺伊曼边界数据与 $d$ 维 BV/BRST 复合体联系起来。解析延拓揭示了与 A 模型以及非相对论和卡罗尔极限的联系。", "authors": [{"name": "Justin Kulp"}], "featured_authors": [{"name": "Justin Kulp"}], "author_count": 1}, {"id": "2609.38273", "category": "hep-th", "title": "Construction of mirror pairs of Berglund-Hubsch Calabi-Yau orbifolds of loop-type polynomials", "abstract": "In this paper, an algorithm for constructing orbifolds of Calabi-Yau manifolds of the Berglund-Hubsch-Krawitz (BHK) type and their mirror pairs for loop-type polynomials is proposed and applied. A complete enumeration of loop polynomials satisfying the Calabi-Yau condition was carried out, yielding 216 unique polynomials. For each polynomial, the Euler characteristics, the numbers of generations and singlets were computed, and the twisted sector states were analyzed using Roan's generalized combinatorial construction. It was established that Roan pairs are absent for all studied configurations, indicating a zero contribution of the twisted sectors to the difference in Hodge numbers upon resolving the orbifold singularities. The primary physical result of this work is the discovery of two configurations with diagonal exponents $\\{74, 3, 3, 5, 3\\}$ and $\\{74, 3, 5, 3, 3\\}$, for which the number of quark and lepton generations is precisely three ($N_{\\text{gen}} = 3$), which is of key interest for constructing phenomenologically realistic models of particle physics.", "url": "https://arxiv.org/abs/2609.38273", "type": "理论", "summary": "本文提出并应用了一种构造 Berglund-Hubsch-Krawitz (BHK) 型 Calabi-Yau 流形及其镜像对的环型多项式的轨道折叠算法。对满足 Calabi-Yau 条件的循环多项式进行了完整枚举，产生了 216 个独特的多项式。对于每个多项式，计算欧拉特征、代数和单态数，并使用 Roan 广义组合结构分析扭曲扇区状态。已经确定，所有研究的配置中都不存在罗恩对，这表明在解决轨道奇点时，扭曲扇区对霍奇数差异的贡献为零。这项工作的主要物理结果是发现了对角指数为 $\\{74, 3, 3, 5, 3\\}$ 和 $\\{74, 3, 5, 3, 3\\}$ 的两种配置，其中夸克和轻子的生成数量恰好为三 ($N_{\\text{gen}} = 3$)，这对于构建唯象现实的粒子物理模型具有重要意义。", "authors": [{"name": "Maxim Malyutin"}], "featured_authors": [{"name": "Maxim Malyutin"}], "author_count": 1}, {"id": "2609.38301", "category": "hep-th", "title": "Detectors in Nonrelativistic Conformal Field Theories", "abstract": "Correlations in asymptotic fluxes provide one of the primary experimental means of studying physical systems. In the context of relativistic QFT, the formalization of such experiments in terms of detector operators has led to significant progress. Motivated by these successes, in this paper we initiate a study of detector operators in nonrelativistic conformal field theories (NRCFTs). In NRCFTs, fluxes are distributed in both angle and velocity, making the natural detector operator the energy flux differential in velocity, $\\mathcal{E}_v(\\hat{n})$. We provide non-perturbative definitions of these operators in NRCFTs, and study their symmetries and algebra. We calculate one-point functions of these detector observables in a variety of few and many body states of representative NRCFTs, including free fermions, as well as fermions at unitarity. In interacting three-body states, they exhibit a remarkably rich behavior reflective of the Efimov three-body wave-function, including the formation of an enhanced \"jet\" structure due to the presence of resonant interactions. We use these detectors to derive a nonrelativistic generalization of the Hofman-Maldacena conformal collider bounds by arguing for positivity of $\\mathcal{E}_v(\\hat{n})$, and imposing this in spin 1 states. We outline a number of future directions for the study of detectors in NRCFTs, and discuss how they can be measured in a variety of experimental platforms from cold atoms to low energy neutron experiments.", "url": "https://arxiv.org/abs/2609.38301", "type": "理论", "summary": "渐近通量的相关性提供了研究物理系统的主要实验手段之一。在相对论 QFT 的背景下，此类实验在探测器算子方面的形式化已经取得了重大进展。受这些成功的激励，在本文中，我们发起了对非相对论共形场论（NRCFT）中探测器算子的研究。在 NRCFT 中，通量分布在角度和速度上，使自然探测器算子成为速度上的能量通量差 $\\mathcal{E}_v(\\hat{n})$。我们在 NRCFT 中提供了这些算子的非微扰定义，并研究了它们的对称性和代数。我们计算这些探测器可观测量在代表性 NRCFT 的各种少体和多体状态下的单点函数，包括自由费米子以及酉费米子。在相互作用的三体态中，它们表现出反映叶菲莫夫三体波函数的非常丰富的行为，包括由于共振相互作用的存在而形成增强的“射流”结构。\n\n我们使用这些探测器通过论证 $\\mathcal{E}_v(\\hat{n})$ 的正性并将其强加于自旋 1 状态，来导出 Hofman-Maldacena 共形对撞机边界的非相对论推广。我们概述了 NRCFT 探测器研究的一些未来方向，并讨论了如何在从冷原子到低能中子实验的各种实验平台中测量它们。", "authors": [{"name": "Cyuan-Han Chang"}, {"name": "Subham Dutta Chowdhury"}, {"name": "Ian Moult"}, {"name": "Dam Thanh Son"}], "featured_authors": [{"name": "Cyuan-Han Chang"}, {"name": "Subham Dutta Chowdhury"}, {"name": "Ian Moult"}, {"name": "Dam Thanh Son"}], "author_count": 4}, {"id": "2609.38302", "category": "hep-th", "title": "Scale-Covariant Holography", "abstract": "We explore a vast landscape of scale-covariant string backgrounds that arise from the backreaction of D$p$-branes. In a convenient Weyl frame the metric has an AdS factor and the dilaton has a non-trivial profile. This structure provides a notion of scale covariance that facilitates a holographic analysis and provides a window into the dynamics of the dual strongly coupled non-conformal gauge theory. We present different classes of supergravity solutions of this kind and discuss their dual field theory interpretation. We find several new supersymmetric backgrounds arising from D2-branes by utilizing four-dimensional gauged supergravity, D$p$-branes wrapped on compact manifolds, and infinite families constructed directly in ten dimensions. We construct holographic RG flows between some of the new supersymmetric backgrounds and compute the spectrum of low-lying local operators. Holography determines the form of observables such as the thermal free energy and scalar two-point functions, predictions which could be tested on the lattice.", "url": "https://arxiv.org/abs/2609.38302", "type": "理论", "summary": "我们探索了由 D$p$-膜的反反应产生的尺度协变弦背景的广阔景观。在方便的 Weyl 框架中，度量具有 AdS 因子，膨胀子具有重要的轮廓。这种结构提供了尺度协方差的概念，有利于全息分析，并提供了了解双强耦合非共形规范理论动力学的窗口。我们提出了此类不同类型的超重力解，并讨论了它们的对偶场理论解释。我们通过利用四维测量超重力、包裹在紧流形上的 D$p$-膜以及直接在十维中构建的无限族，发现了由 D2-膜产生的几个新的超对称背景。我们在一些新的超对称背景之间构建全息 RG 流，并计算低洼局部算子的频谱。全息术确定了可观察量的形式，例如热自由能和标量两点函数，这些预测可以在晶格上进行测试。", "authors": [{"name": "Nikolay Bobev"}, {"name": "Pieter Bomans"}, {"name": "Fridrik Freyr Gautason"}], "featured_authors": [{"name": "Nikolay Bobev"}, {"name": "Pieter Bomans"}, {"name": "Fridrik Freyr Gautason"}], "author_count": 3}, {"id": "2609.38307", "category": "hep-th", "title": "Quantum Gravity Principles for 4d $\\mathcal{N}=2$ Supergravity Theories and Asymptotic Hodge Theory", "abstract": "We study the behaviour of general four-dimensional N=2 supergravity theories near boundaries at infinity of the vector multiplet moduli space, with a focus on a clear distinction between properties that follow from supergravity alone rather than from a consistent UV completion in quantum gravity. The basis for our analysis is the appearance of a real variation of polarised Hodge structure governing the vector multiplet moduli space of N=2 supergravity, combined with very recent advances in the mathematics literature. The resulting classification of infinite distance degenerations exactly agrees, at the level of gauge couplings, with a possible interpretation of the limits as decompactification limits to five or six dimensions or as weakly coupled string limits, as expected from a quantum gravity perspective. This observation extends previous results found in the context of string compactifications on Calabi--Yau varieties and, remarkably, holds for general four-dimensional N=2 supergravity theories regardless of a UV completion. We furthermore show the existence of a Kähler basis in which the triple couplings of the prepotential are non-negative, irrespective of a geometric origin of the supergravity theory. Finally we propose two non-trivial constraints for a four-dimensional N=2 supergravity to be compatible with quantum gravity: Integrality of the Hodge structure as a necessary condition for the completeness hypothesis and the existence of a simple normal crossing compactification of the moduli space to ensure compatibility of the weakly coupled asymptotic gravitational duality frames.", "url": "https://arxiv.org/abs/2609.38307", "type": "理论", "summary": "我们研究了一般四维 N=2 超引力理论在向量多重模空间无穷远边界附近的行为，重点是仅从超引力得出的性质之间的明显区别，而不是从量子引力中一致的 UV 完成得出的性质。我们分析的基础是控制 N=2 超引力向量多重模空间的极化霍奇结构的真实变体的出现，并结合数学文献的最新进展。由此产生的无限距离简并分类在规范耦合水平上完全符合对极限的可能解释，即五维或六维的解紧极限或弱耦合弦极限，正如从量子引力角度所预期的那样。这一观察扩展了先前在 Calabi-Yau 变体弦紧化背景下发现的结果，并且值得注意的是，无论 UV 完成如何，它都适用于一般四维 N=2 超重力理论。\n\n我们还证明了凯勒基的存在，其中预势的三重耦合是非负的，与超引力理论的几何起源无关。最后，我们提出了四维 N=2 超引力与量子引力兼容的两个重要约束：Hodge 结构的完整性作为完整性假设的必要条件，以及模空间的简单法线交叉紧致化的存在，以确保弱耦合渐近引力对偶框架的兼容性。", "authors": [{"name": "Lukas Kaufmann"}, {"name": "Timo Weigand"}], "featured_authors": [{"name": "Lukas Kaufmann"}, {"name": "Timo Weigand"}], "author_count": 2}, {"id": "2609.38308", "category": "hep-th", "title": "Bootstrapping Weakly Broken Gauge Theories in (A)dS", "abstract": "We develop a bootstrap approach for weakly broken gauge theories in (anti-)de Sitter space, focusing on cases in which the conservation of the dual boundary current is broken by a double-trace operator. Integrating the corresponding Ward identity, we derive pseudo-charge conservation identities that contain fixed nonlocal contributions as integrals of three-point functions. These identities impose consistency conditions on the space of allowed theories. As an illustrative example, we study Yang-Mills theory in AdS with symmetry-breaking boundary conditions for charged matter and show that the pseudo-charge conservation identities constrain the mixing between the two quantization sectors. We then apply the framework to the Higgs mechanism for gravity in two AdS spaces with a common boundary, coupled so that the corresponding stress tensors are not separately conserved. In this setting, the ordinary charge conservation identities recover the factorization into two independent CFTs, whereas the pseudo-charge conservation identities hold for arbitrary values of the symmetry-breaking parameter. Finally, for conformal gravity in de Sitter space, we constrain the interactions between the graviton and the partially massless spin-2 field, both in the minimal theory and in the presence of additional scalar or vector matter, finding agreement with the predictions of the corresponding bulk theories.", "url": "https://arxiv.org/abs/2609.38308", "type": "理论", "summary": "我们为（反）德西特空间中的弱破坏规范理论开发了一种自举方法，重点关注双迹算子破坏双边界电流守恒的情况。积分相应的沃德恒等式，我们推导出赝电荷守恒恒等式，其中包含固定的非局部贡献作为三点函数的积分。这些恒等式对允许的理论空间施加了一致性条件。作为一个说明性的例子，我们在带电物质的对称破缺边界条件下研究了 AdS 中的 Yang-Mills 理论，并表明赝电荷守恒恒等式限制了两个量化扇区之间的混合。然后，我们将该框架应用于具有公共边界的两个 AdS 空间中的希格斯引力机制，两个 AdS 空间相互耦合，使得相应的应力张量不会单独守恒。在此设置中，普通电荷守恒恒等式将因式分解恢复为两个独立的 CFT，而伪电荷守恒恒等式则适用于对称破缺参数的任意值。\n\n最后，对于德西特空间中的共形引力，我们在极小理论和存在额外标量或矢量物质的情况下约束引力子和部分无质量自旋 2 场之间的相互作用，与相应的体理论的预测一致。", "authors": [{"name": "Daniel Baumann"}, {"name": "Kurt Hinterbichler"}, {"name": "Callum R. T. Jones"}, {"name": "Nathan Meurrens"}], "featured_authors": [{"name": "Daniel Baumann"}, {"name": "Kurt Hinterbichler"}, {"name": "Callum R. T. Jones"}, {"name": "Nathan Meurrens"}], "author_count": 4}, {"id": "2609.38311", "category": "hep-th", "title": "A New Approach to Black Hole Thermodynamics in General EMD-like Theories", "abstract": "We consider general EMD-like theories involving arbitrary numbers of both Maxwell fields and dilatonic scalars. We study charged black holes and derive several algebraic and differential relations among the thermodynamic quantities, scalar charges and the non-extremal parameter. These allow us to obtain two sets of master equations of thermodynamic quantities, depending on the choice of basic variables parameterizing the system. Solutions to either set of the master equations give rise to all the thermodynamic quantities, without constructing black hole solutions. We obtain all the thermodynamic quantities perturbatively in the power series expansions of charges, which we then verify using perturbative black hole solutions up to and including the quartic order in charges.", "url": "https://arxiv.org/abs/2609.38311", "type": "理论", "summary": "我们考虑涉及任意数量的麦克斯韦场和膨胀标量的一般类 EMD 理论。我们研究带电黑洞并推导了热力学量、标量电荷和非极值参数之间的几种代数和微分关系。这些使我们能够获得两组热力学量的主方程，具体取决于参数化系统的基本变量的选择。任意一组主方程的解都会产生所有热力学量，而无需构造黑洞解。我们以微扰方式获得了电荷幂级数展开中的所有热力学量，然后使用微扰黑洞解进行验证，直至并包括电荷的四次阶。", "authors": [{"name": "Peng-Yu Wu"}, {"name": "H. Lu"}], "featured_authors": [{"name": "Peng-Yu Wu"}, {"name": "H. Lu"}], "author_count": 2}, {"id": "2609.38313", "category": "hep-th", "title": "Holographic Krylov spread complexity for a confining multi-charge AdS soliton", "abstract": "We study holographic spread complexity for a Type IIB solution dual to a deformation of $\\mathcal{N} = 4$ SYM that flows to a confining (2+1)-dimensional supersymmetric theory in the IR. We use the proposal that relates the rate of change of spread complexity of local operators with the proper momentum of an infalling probe particle in the bulk. We analyse two cases: a probe particle falling radially and a probe falling radially while rotating with conserved angular momentum. We elaborate on how to define the proper coordinate in the presence of a conserved Noether charge using the Routhian. The trajectories for the probes were studied numerically, revealing an oscillatory behaviour of the complexity.", "url": "https://arxiv.org/abs/2609.38313", "type": "理论", "summary": "我们研究了 IIB 型解决方案的全息扩展复杂性，该解决方案与 $\\mathcal{N} = 4$ SYM 的变形双重存在，该变形流向 IR 中的限制 (2+1) 维超对称理论。我们使用的建议将局部算子的扩展复杂度的变化率与整体中落入的探针粒子的适当动量联系起来。我们分析两种情况：探针粒子径向下落和探针在角动量守恒旋转时径向下落。我们详细阐述了如何在存在守恒诺特电荷的情况下使用 Routhian 定义适当的坐标。对探针的轨迹进行了数值研究，揭示了复杂性的振荡行为。", "authors": [{"name": "Dimitrios Chatzis"}, {"name": "Madison Hammond"}, {"name": "Ricardo T. Santamaria"}, {"name": "Jonathan Whittle"}], "featured_authors": [{"name": "Dimitrios Chatzis"}, {"name": "Madison Hammond"}, {"name": "Ricardo T. Santamaria"}, {"name": "Jonathan Whittle"}], "author_count": 4}, {"id": "2609.38318", "category": "hep-th", "title": "Energy Transmission Across Holographic Conformal Interfaces in General Dimensions", "abstract": "Energy transport across conformal interfaces is universal in two spacetime dimensions, but its higher-dimensional counterpart has remained largely unexplored. In higher dimensions, scattering can depend on additional kinematic data, such as the angle of incidence, and conformal symmetry is far less restrictive. We use gravitational holography to study this problem. For a broad class of AdS$_d$-sliced domain-wall geometries, we derive a closed-form expression for the energy transmission coefficient in terms of the bulk warp factor. Our formula reproduces known two-dimensional holographic results and extends them to arbitrary dimension. Within this class, we establish different aspects of higher-dimensional universality. In particular, we show that the transmission is independent of the incidence angle and of the profile of the incident perturbation. We also derive bounds on transmission controlled by central-charge-like quantities characterizing the number of degrees of freedom of the theories on the two sides of the interface. This provides the first explicit result for reflection and transmission across conformal interfaces in higher dimensions, where no CFT-based results are currently available.", "url": "https://arxiv.org/abs/2609.38318", "type": "理论", "summary": "跨共形界面的能量传输在两个时空维度中是普遍存在的，但其更高维度的对应物在很大程度上仍未被探索。在更高维度中，散射可能取决于额外的运动学数据，例如入射角，并且共形对称性的限制要小得多。我们利用引力全息术来研究这个问题。对于一大类 AdS$_d$ 切片畴壁几何形状，我们根据体积扭曲因子推导了能量传输系数的封闭式表达式。我们的公式再现了已知的二维全息结果并将其扩展到任意维度。在这个班级中，我们建立了高维普遍性的不同方面。特别是，我们表明传输与入射角和入射扰动的轮廓无关。我们还推导了由类中心电荷量控制的传输界限，这些类中心电荷量表征了界面两侧理论的自由度数。\n\n这为更高维度的共形界面上的反射和传输提供了第一个明确的结果，目前还没有基于 CFT 的结果。", "authors": [{"name": "Igal Arav"}, {"name": "Theodore Bertrand"}, {"name": "Shira Chapman"}, {"name": "Giuseppe Policastro"}, {"name": "Sebastian Waeber"}], "featured_authors": [{"name": "Igal Arav"}, {"name": "Theodore Bertrand"}, {"name": "Shira Chapman"}, {"name": "Giuseppe Policastro"}, {"name": "Sebastian Waeber"}], "author_count": 5}, {"id": "2609.38336", "category": "hep-th", "title": "Scaling similarity and generalised conformal symmetry in D2-brane holography", "abstract": "We study D2-brane holography within the purely dilatonic sector of four-dimensional maximal ISO(7)-gauged supergravity, obtained as a consistent truncation of type IIA supergravity on S$^6$. In the dual frame, the four-dimensional Lagrangian resulting from the reduction of the massless IIA theory exhibits scaling similarity, thus reflecting the generalised conformal symmetry of the dual three-dimensional maximally supersymmetric Yang-Mills theory. Using an auxiliary spacetime construction, we show that the holographic CFT$_3$ fixed points and RG-flows known in the massive IIA theory have natural counterparts in the massless IIA theory: QFT$_3$s with generalised conformal symmetry connected by generalised RG-flows, which we construct numerically. We also revisit the Coulomb branch solutions and propose an extension of Gubser's singularity criterion to supergravity theories exhibiting scaling similarity.", "url": "https://arxiv.org/abs/2609.38336", "type": "理论", "summary": "我们研究了四维最大 ISO(7) 测量超重力的纯膨胀扇区内的 D2 膜全息术，该扇区是通过 S$^6$ 上 IIA 型超重力的一致截断获得的。在对偶框架中，无质量IIA理论约简得到的四维拉格朗日表现出尺度相似性，从而反映了对偶三维最大超对称Yang-Mills理论的广义共形对称性。使用辅助时空构造，我们证明了大质量 IIA 理论中已知的全息 CFT$_3$ 不动点和 RG 流在无质量 IIA 理论中具有天然的对应物：具有广义共形对称性的 QFT$_3$s，由我们通过数值构造的广义 RG 流连接。我们还重新审视了库仑分支解，并提出将古布瑟奇点准则扩展到表现出尺度相似性的超引力理论。", "authors": [{"name": "Andrea Conti"}, {"name": "Adolfo Guarino"}, {"name": "Ricardo Stuardo"}], "featured_authors": [{"name": "Andrea Conti"}, {"name": "Adolfo Guarino"}, {"name": "Ricardo Stuardo"}], "author_count": 3}, {"id": "2609.38496", "category": "hep-th", "title": "Leading Logarithms in the Effective Theory of Gravity: corrections to the scalar mass", "abstract": "In a low-energy effective field theory (EFT), scaling logarithmic terms arise from the renormalization of higher-dimensional couplings that absorb divergences generated by loop integrals with lower-order vertices. Consequently, leading logarithms (LLs) are generated entirely by the leading-order Lagrangian, rendering them universal low-energy predictions. Adapting techniques developed for chiral perturbation theory, we analyze the series of LLs in the EFT of general relativity. As a concrete application, we compute LL corrections to the scalar pole mass up to three-loop order and demonstrate that they can be determined recursively to arbitrary loop order. To confirm the physical validity of our results, we carry out the calculation using a general gauge-fixing parameter and explicitly verify its complete cancellation in the physical observable.", "url": "https://arxiv.org/abs/2609.38496", "type": "理论", "summary": "在低能有效场论 (EFT) 中，标度对数项源自高维耦合的重整化，该耦合吸收由低阶顶点的循环积分产生的散度。因此，前导对数 (LL) 完全由前导拉格朗日函数生成，使其成为通用的低能量预测。采用为手征微扰理论开发的技术，我们分析了广义相对论 EFT 中的一系列 LL。作为一个具体应用，我们计算了标量极质量的 LL 校正直至三循环阶数，并证明它们可以递归地确定为任意循环阶数。为了确认我们结果的物理有效性，我们使用通用规范固定参数进行计算，并明确验证其在物理可观测值中的完全抵消。", "authors": [{"name": "Diana V. Mysliaeva"}, {"name": "Kirill M. Semenov-Tian-Shansky"}, {"name": "Dmitrii V. Vasilev"}, {"name": "Alexey Vladimirov"}], "featured_authors": [{"name": "Diana V. Mysliaeva"}, {"name": "Kirill M. Semenov-Tian-Shansky"}, {"name": "Dmitrii V. Vasilev"}, {"name": "Alexey Vladimirov"}], "author_count": 4}, {"id": "2609.38557", "category": "hep-th", "title": "Symmetry-Restoring Counter-terms in Massive Gauge Theories with Non-Anticommuting $γ_5$ via Gauge-Invariant Sector Decomposition", "abstract": "We compute the one-loop breaking of the Slavnov-Taylor (ST) identities in a massive Abelian chiral gauge theory with spontaneous symmetry breaking, regularized in the Breitenlohner-Maison-`t Hooft-Veltman (BMHV) scheme. We also provide the one-loop finite counter-terms required to restore the one-loop ST identities. The recent formulation of spontaneously broken models based on the Fröhlich-Morchio-Strocchi (FMS) gauge-invariant and dynamical (i.e. propagating inside loops) fields is used. The proposed algebraic approach holds true to all orders in the loop expansion and allows for a consistent decomposition of the ST breaking into independent sectors. By using cohomological techniques we eventually constrain the dependence of the ST breaking on the vacuum expectation value of the Higgs field. This yields a set of differential equations that provide a useful check of the mass-dependent terms in the ST breaking terms in the broken phase. They can be generalized to the non-Abelian case, both in the gauge-invariant formalism and in the conventional one. In the massless limit we find agreement with previous calculations present in the literature.", "url": "https://arxiv.org/abs/2609.38557", "type": "理论", "summary": "我们计算了具有自发对称破缺的大规模阿贝尔手征规范理论中斯拉夫诺夫-泰勒 (ST) 恒等式的单环破缺，并在 Breitenlohner-Maison-`t Hooft-Veltman (BMHV) 方案中进行了正则化。我们还提供恢复单循环 ST 恒等式所需的单循环有限反项。使用基于 Fröhlich-Morchio-Strocchi (FMS) 规范不变场和动态场（即在循环内传播）的最新自发破坏模型公式。所提出的代数方法适用于循环展开中的所有阶，并允许将 ST 一致分解为独立的扇区。通过使用上同调技术，我们最终限制了 ST 破断对希格斯场真空期望值的依赖性。这产生了一组微分方程，可以对破碎相中 ST 破碎项中的质量相关项进行有用的检查。它们可以推广到非阿贝尔情况，无论是规范不变形式主义还是传统形式主义。在无质量极限下，我们发现与文献中先前的计算一致。", "authors": [{"name": "Andrea Quadri"}], "featured_authors": [{"name": "Andrea Quadri"}], "author_count": 1}, {"id": "2609.38700", "category": "hep-th", "title": "Non-Semisimple Integrability and Dynamical Limits", "abstract": "We investigate Jordan structure and dynamical limits in six families of integrable spin-$\\frac{1}{2}$ chains obtained from the boost automorphism method. Local operator algebras connect nilpotent evolution on finite periodic chains to central defects in spectral additivity, polynomial unipotent $R$-matrices and constant braid limits. For conservative endpoint erosion, we determine the characteristic and minimal polynomials and show that the Jordan partition can change while both polynomials remain unchanged. We also identify the deletion limits that distinguish the parity obstruction to removing signs by diagonal similarity in Class 5 from the parity nilpotent dependence in Class 6. Matching expansions and fragmentation recursions yield exact amplitudes and survival probabilities for processes with killing. In addition, we establish criteria excluding conservative Markov realizations and determine which conservative completions of specified reaction densities admit regular $R$-matrices of difference form.", "url": "https://arxiv.org/abs/2609.38700", "type": "理论", "summary": "我们研究了从 boost 自同构方法获得的六族可积自旋 $\\frac{1}{2}$ 链中的 Jordan 结构和动力学极限。局部算子代数将有限周期链上的幂零演化与谱可加性、多项式单能 $R$ 矩阵和常数编织极限中的中心缺陷联系起来。对于保守端点侵蚀，我们确定特征多项式和最小多项式，并表明乔丹分区可以改变，而两个多项式保持不变。我们还确定了删除限制，该限制将第 5 类中通过对角线相似性消除符号的奇偶校验障碍与第 6 类中的奇偶校验幂零依赖区分开来。匹配扩展和碎片递归为具有终止的进程产生精确的幅度和生存概率。此外，我们建立了排除保守马尔可夫实现的标准，并确定指定反应密度的哪些保守完成承认差分形式的常规 $R$ 矩阵。", "authors": [{"name": "Anton Pribytok"}], "featured_authors": [{"name": "Anton Pribytok"}], "author_count": 1}, {"id": "2609.38815", "category": "hep-th", "title": "Relative entropy of entanglement and tripartite minimal surface", "abstract": "We propose a holographic dual of the relative entropy of entanglement for a boundary tripartition $A:B:C$. Our proposal is that, at the leading order, \\begin{align} E_R(\\rho_{AB}) = \\frac{1}{4G_N}\\Big[\\mathrm{Area}(\\Gamma_{\\min}) - \\mathrm{Area}(\\gamma_{AB})\\Big] \\notag \\end{align} where $\\Gamma_{\\min}$ is the minimal bulk tripartition surface and $\\gamma_{AB}$ is the minimal surface homologous to $AB$. For a general random tensor network, we prove the corresponding upper bound by constructing a separable state associated with $\\Gamma_{\\min}$ and evaluating its relative entropy. We also establish the matching lower bound rigorously for networks of one, two, and three Haar random tensors by bounding the maximal tripartite product-state overlap. In appropriate geometries, the minimal tripartition surface can form a nontrivial tri-junction resembling the Mercedes logo. The proof proceeds by sequential optimization over candidate product states, which has a natural geometric interpretation as a local search for the minimal tripartition surface.", "url": "https://arxiv.org/abs/2609.38815", "type": "理论", "summary": "我们提出了边界三分 $A:B:C$ 的纠缠相对熵的全息对偶。我们的建议是，在前导顺序上， \\begin{align} E_R(\\rho_{AB}) = \\frac{1}{4G_N}\\Big[\\mathrm{Area}(\\Gamma_{\\min}) - \\mathrm{Area}(\\gamma_{AB})\\Big] \\notag \\end{align} 其中 $\\Gamma_{\\min}$ 是最小体三部分面， $\\gamma_{AB}$ 是与 $AB$ 同源的最小曲面。对于一般的随机张量网络，我们通过构造与 $\\Gamma_{\\min}$ 相关的可分离状态并评估其相对熵来证明相应的上限。我们还通过限制最大三方产品状态重叠来严格为一个、两个和三个 Haar 随机张量的网络建立匹配下界。在适当的几何形状中，最小三分表面可以形成类似于梅赛德斯标志的重要三联结。该证明通过对候选产品状态进行顺序优化来进行，其具有自然的几何解释作为最小三分表面的局部搜索。", "authors": [{"name": "Takato Mori"}, {"name": "Beni Yoshida"}], "featured_authors": [{"name": "Takato Mori"}, {"name": "Beni Yoshida"}], "author_count": 2}, {"id": "2609.39085", "category": "hep-th", "title": "Complex Phase Structure of Kerr-AdS$_5$ Black Holes: Critical Saddles and Fisher Zeros", "abstract": "We study the complex saddle structure of singly rotating Kerr--AdS$_5$ black holes using a two-variable reduced model in the grand canonical ensemble at fixed angular velocity, $\\Omega$. The small and large black hole saddles merge at a critical point where one Takagi singular value of the complex Hessian vanishes, identifying the soft mode associated with the merger. This merger remains distinct from the Hawking--Page transition throughout the physical domain $|\\Omega| < 1$. For the reduced integral with the standard measure, we show that thermal AdS dominates uniformly in a complex neighborhood of each real merger point when Newton's constant $G$ is sufficiently small. Consequently, this neighborhood contains no zeros of the partition function, even though the local saddle merger is described by Airy-type behavior. The Fisher zeros instead accumulate near the Hawking--Page coexistence line, with spacing of order $G$, through interference between thermal AdS and the large black hole saddle. We also show that the real quasi-Euclidean Kerr--AdS$_5$ family satisfies a strict asymptotic Kontsevich--Segal--Witten (KSW) phase bound for $|\\Omega| < 1$, with the merger point lying inside the allowed domain. In the fixed angular momentum extended ensemble, two such merger points combine into a cusp with a contour-dependent Pearcey approximation. These results distinguish local saddle degeneracies from global phase coexistence and clarify the different roles of Takagi modes, phase transitions, and zeros of the partition function in the complex black hole saddle structure.", "url": "https://arxiv.org/abs/2609.39085", "type": "理论", "summary": "我们在固定角速度 $\\Omega$ 下使用大正则系综中的二变量简化模型研究了单旋转 Kerr--AdS$_5$ 黑洞的复杂鞍结构。小黑洞和大黑洞鞍在一个临界点合并，在该临界点，复杂的 Hessian 矩阵的一个 Takagi 奇异值消失，从而识别与合并相关的软模式。这种合并仍然与整个物理领域的霍金-佩奇转变不同 $|\\Omega| < 1 美元。对于标准测量的简化积分，我们表明，当牛顿常数 $G$ 足够小时，热 AdS 在每个实际合并点的复杂邻域中均匀占主导地位。因此，该邻域不包含配分函数的零点，即使局部鞍形合并是由艾里型行为描述的。相反，费舍尔零点通过热 AdS 和大黑洞鞍之间的干扰而聚集在霍金-佩奇共存线附近，间隔为 $G$ 级。\n\n我们还表明，真正的准欧几里得 Kerr--AdS$_5$ 族满足 $|\\Omega| 的严格渐近 Kontsevich--Segal--Witten (KSW) 相界。 < 1$，合并点位于允许的域内。在固定角动量扩展系综中，两个这样的合并点结合成具有依赖于轮廓的皮尔西近似的尖点。这些结果区分了局部鞍简并与全局相位共存，并阐明了复杂黑洞鞍结构中高木模式、相变和配分函数零点的不同作用。", "authors": [{"name": "Bum-Hoon Lee"}, {"name": "Hocheol Lee"}, {"name": "Somyadip Thakur"}], "featured_authors": [{"name": "Bum-Hoon Lee"}, {"name": "Hocheol Lee"}, {"name": "Somyadip Thakur"}], "author_count": 3}, {"id": "2609.39253", "category": "hep-th", "title": "Gravitational multipoles, antipodal matching relations, and the logarithmic soft graviton theorem", "abstract": "We derive the classical logarithmic soft graviton theorem for the scattering of massive particles in four-dimensional asymptotically flat spacetime using a position-space analysis of the Weyl tensor. Starting from the Iyer-Damour multipole solution in harmonic gauge, we obtain an infinite tower of antipodal matching relations across spatial infinity for all five Newman-Penrose Weyl scalars, at linear order in $G$ and for the leading matter-induced logarithms at order $G^2$. We connect the relation relevant to the logarithmic soft theorem to the radiative-gauge formulation of Boschetti-Campiglia and Compère-Robert. We then compute the required asymptotic fields directly from scattering data, including matter contributions and nonlinear effects responsible for graviton drag. Combining these results with the Newman-Penrose evolution equations yields position-space proofs of the classical leading and logarithmic soft graviton theorems, independently confirming the frequency-space derivation of the latter originally performed by Laddha and Sen.", "url": "https://arxiv.org/abs/2609.39253", "type": "理论", "summary": "我们使用 Weyl 张量的位置空间分析导出了四维渐近平坦时空中大质量粒子散射的经典对数软引力子定理。从调和规范中的 Iyer-Damour 多极解开始，我们获得了所有五个 Newman-Penrose Weyl 标量在空间无穷大上的对映匹配关系的无限塔，其线性阶数为 $G$，主要物质引起的对数阶数为 $G^2$。我们将与对数软定理相关的关系与 Boschetti-Campiglia 和 Compère-Robert 的辐射规范公式联系起来。然后，我们直接根据散射数据计算所需的渐近场，包括物质贡献和导致引力子阻力的非线性效应。将这些结果与纽曼-彭罗斯演化方程相结合，产生了经典领先和对数软引力子定理的位置空间证明，独立地证实了后者最初由 Laddha 和 Sen 进行的频率空间推导。", "authors": [{"name": "Geoffrey Compère"}, {"name": "Dima Fontaine"}, {"name": "Wen-Bin Liu"}, {"name": "Kevin Nguyen"}], "featured_authors": [{"name": "Geoffrey Compère"}, {"name": "Dima Fontaine"}, {"name": "Wen-Bin Liu"}, {"name": "Kevin Nguyen"}], "author_count": 4}, {"id": "2609.39288", "category": "hep-th", "title": "Near-horizon soft theorems from local Ward identities", "abstract": "We develop a unified formulation of leading soft photon theorems for nondegenerate static spherical horizons. By fixing the photon mode normalization from the horizon symplectic form, we obtain a common angular soft factor whose sign follows from the boundary orientation. We determine the geometric coefficients in the local angular and momentum representations for a chosen radial normalization. The charge balance includes horizon endpoint data and contributions from other boundaries. This formulation brings black hole and cosmological horizons into a common description. Applying the same construction to Yang-Mills fields yields the corresponding tree-level soft gluon theorem. These results identify the common soft structure underlying different horizon geometries.", "url": "https://arxiv.org/abs/2609.39288", "type": "理论", "summary": "我们为非简并静态球形视界开发了领先的软光子定理的统一表述。通过固定水平辛形式的光子模式归一化，我们获得了一个公共角度软因子，其符号遵循边界方向。我们确定所选径向归一化的局部角和动量表示中的几何系数。电荷平衡包括地平线端点数据和来自其他边界的贡献。这种表述将黑洞和宇宙视界纳入了共同的描述中。将相同的构造应用于 Yang-Mills 场可得出相应的树级软胶子定理。这些结果确定了不同地平线几何形状下的共同软结构。", "authors": [{"name": "Jin-Peng Zhuge"}, {"name": "Peng Cheng"}], "featured_authors": [{"name": "Jin-Peng Zhuge"}, {"name": "Peng Cheng"}], "author_count": 2}, {"id": "2609.39459", "category": "hep-th", "title": "Soliton like solutions of $λϕ^4$ theory in de Sitter space", "abstract": "We study classical solutions of a scalar field with quartic potential in de Sitter space-time. Using the ansatz $\\phi=F(X\\cdot\\xi)$, via embeding coordinate $X_\\alpha$ of the ambiend space we find several families of analytic solutions classified by the causal character of the constant vector $\\xi$. For time-like $\\xi$, the solutions are globally regular and describe either global oscillations around a minimum or global vacuum transition; for space-like $\\xi$, they are singular in the global patch but regular in the open slicing. In the Poincaré patch they correspond to contracting bubbles. We compute the classical actions of these solition which are finite only in spacetime dimensions $D \\le 5$. We show that the $D=4$ global vacuum transition solution has the radiation equation of state $w=1/3$. In $D=4$ global vacuum transition solution, the retarded Green's function acquires a growing tail as compared to the Green's function on top of vacuum, implying that the transition amplifies the signal at late times.", "url": "https://arxiv.org/abs/2609.39459", "type": "理论", "summary": "我们研究德西特时空中具有四次势的标量场的经典解。使用 ansatz $\\phi=F(X\\cdot\\xi)$，通过嵌入周围空间的坐标 $X_\\alpha$，我们找到了几个按常数向量 $\\xi$ 的因果特征分类的解析解族。对于类似时间的 $\\xi$，解是全局正则的，并且描述围绕最小或全局真空转变的全局振荡；对于类似空间的$\\xi$，它们在全局补丁中是奇异的，但在开放切片中是规则的。在庞加莱补丁中，它们对应于收缩的气泡。我们计算这些孤子的经典作用，它们仅在时空维度 $D \\le 5$ 中是有限的。我们证明 $D=4$ 全局真空跃迁解具有状态 $w=1/3$ 的辐射方程。在 $D=4$ 全局真空跃迁解决方案中，与真空顶部的格林函数相比，延迟的格林函数获得了不断增长的尾部，这意味着跃迁在后期放大了信号。", "authors": [{"name": "D. V. Diakonov"}], "featured_authors": [{"name": "D. V. Diakonov"}], "author_count": 1}, {"id": "2609.39470", "category": "hep-th", "title": "Dispersion relation, propagation features and canonical gauge structure of GNLED", "abstract": "We investigate the propagation properties and canonical gauge structure of Generalised Non-Linear Electrodynamics (GNLED) in the presence of a non-dynamical background field. Starting from the quadratic photon sector of the theory, we perform a field redefinition that converts the background-induced derivative coupling into a mass-like contribution characterized by the vector \\(V_\\mu=\\partial_\\mu\\alpha/\\alpha\\) where $\\alpha= \\sqrt{\\left.\\frac{\\partial\\mathcal{L}}{\\partial \\mathcal{F}}\\right|_B}$. For a constant background, we derive the corresponding dispersion relation and show that, for a purely space-like \\(V_\\mu\\), the propagating mode obeys \\(\\omega^2=\\|\\vec k\\|^2+\\|\\vec V\\|^2\\), defining an effective mass scale \\(m_{\\rm eff}=|\\vec{V}|\\) and a finite rest frequency. The resulting phase and group velocities exhibit the characteristic dispersive behaviour of a gapped mode, with subluminal group velocity and superluminal phase velocity. We then construct the propagator and show that the massive pole resides in the transverse sector, while the longitudinal singularity is associated with gauge fixing. A complete Hamiltonian analysis yields two first-class constraints and only two physical degrees of freedom, demonstrating that the effective mass does not introduce an additional polarisation. The associated gauge transformation is a deformed Abelian \\(U(1)\\) symmetry. Finally, we show that the Hamiltonian is positive definite for purely space-like backgrounds.", "url": "https://arxiv.org/abs/2609.39470", "type": "理论", "summary": "我们研究了存在非动态背景场时广义非线性电动力学 (GNLED) 的传播特性和规范规范结构。从理论的二次光子扇区开始，我们进行场重新定义，将背景引起的导数耦合转换为以向量 \\(V_\\mu=\\partial_\\mu\\alpha/\\alpha\\) 为特征的类质量贡献，其中 $\\alpha= \\sqrt{\\left.\\frac{\\partial\\mathcal{L}}{\\partial \\mathcal{F}}\\right|_B}$。对于恒定背景，我们推导了相应的色散关系，并表明，对于纯类空间 \\(V_\\mu\\)，传播模式遵循 \\(\\omega^2=\\|\\vec k\\|^2+\\|\\vec V\\|^2\\)，定义有效质量尺度 \\(m_{\\rm eff}=|\\vec{V}|\\) 和有限静止频率。由此产生的相速度和群速度表现出带隙模式的特征色散行为，具有亚光速群速度和超光速相速度。然后，我们构建传播器并表明大质量杆位于横向扇区，而纵向奇点与规范固定相关。\n\n完整的哈密顿分析产生两个一流约束和仅两个物理自由度，表明有效质量不会引入额外的极化。相关的规范变换是变形的阿贝尔\\(U(1)\\)对称性。最后，我们证明哈密顿量对于纯类空间背景是正定的。", "authors": [{"name": "Abedennour Dib"}, {"name": "José A. Helayël-Neto"}, {"name": "Tomislav Prokopec"}, {"name": "Alessandro D.A.M. Spallicci"}, {"name": "Youssef Temmam"}], "featured_authors": [{"name": "Abedennour Dib"}, {"name": "José A. Helayël-Neto"}, {"name": "Tomislav Prokopec"}, {"name": "Alessandro D.A.M. Spallicci"}, {"name": "Youssef Temmam"}], "author_count": 5}, {"id": "2609.39506", "category": "hep-th", "title": "Nonperturbative Dyson--Schwinger equations in QCD: a first approximation", "abstract": "We consider a procedure for nonperturbative quantization based on an infinite system of nonperturbative Dyson--Schwinger equations. We propose a first approximation for truncating this infinite system of equations in the static case. The main ideas underlying this approximation are as follows: (a) the two-point Green's functions of vacuum gauge fields are factorized by introducing scalar fields; (b) in the non-vacuum case, the degrees of freedom of the $SU(3)$ gauge field can be divided into ``almost classical'' and ``almost quantum'' degrees of freedom; (c) the four-point Green's functions of the gauge fields are represented as bilinear combinations of two-point Green's functions; (d) an approximation for the three-point Green's function describing the interaction between quarks and gauge fields is proposed, which leads to the splitting of the original Dirac equation for the quark-field operators into two equations, one describing the expectation value of the fermion field and the other acquiring a nonlinear term and serving to describe a condensate composed of sea quarks bound by the vacuum gauge field. We consider the choice of gauge appropriate for this approximation to nonperturbative quantization. We point out that the emergence of a nonlinear Dirac equation within this approximation may lead to a mass gap in the energy spectrum of solutions of the corresponding systems of equations. The issue of the emergence of ``dimensional transmutation'' within this approximation is also discussed. We provide arguments in favor of the statement that the ``closure constants'' appearing in the finite truncation and giving rise to ``dimensional transmutation'' should survive in the transition to the infinite system of Dyson--Schwinger equations. An analogy between nonperturbative quantization and the stochastic theory of turbulence is also discussed.", "url": "https://arxiv.org/abs/2609.39506", "type": "理论", "summary": "我们考虑基于非微扰戴森-施温格方程的无限系统的非微扰量化过程。我们提出了在静态情况下截断这个无限方程组的第一个近似。该近似的主要思想如下： (a) 通过引入标量场对真空规场的两点格林函数进行因式分解； (b) 在非真空情况下，$SU(3)$规范场的自由度可分为“几乎经典”和“几乎量子”自由度； (c) 规范场的四点格林函数表示为两点格林函数的双线性组合； (d) 提出了描述夸克和规范场之间相互作用的三点格林函数的近似，这导致夸克场算子的原始狄拉克方程分裂为两个方程，一个描述费米子场的期望值，另一个获得非线性项并用于描述由真空规范场束缚的海夸克组成的凝聚体。\n\n我们认为规范的选择适合这种非微扰量化的近似。我们指出，该近似中非线性狄拉克方程的出现可能会导致相应方程组解的能谱中出现质量间隙。还讨论了在这种近似中出现“维度嬗变”的问题。我们提供了支持这样一种说法的论据，即出现在有限截断中并引起“维度嬗变”的“闭合常数”应该在向戴森-施温格方程的无限系统的过渡中继续存在。还讨论了非微扰量子化和湍流随机理论之间的类比。", "authors": [{"name": "Vladimir Dzhunushaliev"}, {"name": "Vladimir Folomeev"}], "featured_authors": [{"name": "Vladimir Dzhunushaliev"}, {"name": "Vladimir Folomeev"}], "author_count": 2}, {"id": "2609.39691", "category": "hep-th", "title": "Light-Ray Supersymmetry, BMS Algebras and the Averaged Null Energy Condition", "abstract": "We show that the light-ray algebra of unitary supersymmetric Lorentzian conformal field theories contains a universal supersymmetric generalized $\\mathfrak{bms}$ algebra. We construct parallel light-ray operators using the supersymmetry current, $R-$symmetry current and the stress tensor supported on a co-dimension one null hypersurface and determine their graded commutators in $d=3,4$ to verify this claim. Our construction only relies on global supersymmetry and fundamental physical principles such as microcausality, unitarity and Lorentz invariance and thus applies to strongly coupled theories. As a corollary, we show that the averaged null energy operator is a positive operator using the local supersymmetry algebra on the null sheet, providing a supersymmetric derivation of the averaged null energy condition (ANEC). Finally, we verify our results in free massless supersymmetric theories and present arguments to support that the local supersymmetry continues to ensure the ANEC is satisfied even in general supersymmetric quantum field theories.", "url": "https://arxiv.org/abs/2609.39691", "type": "理论", "summary": "我们证明酉超对称洛伦兹共形场论的光线代数包含通用超对称广义 $\\mathfrak{bms}$ 代数。我们使用超对称电流、$R-$对称电流和同维一零超曲面上支持的应力张量构造并行光线算子，并确定其在 $d=3,4$ 中的分级换向器以验证这一说法。我们的构造仅依赖于全局超对称性和基本物理原理，例如微观因果性、幺正性和洛伦兹不变性，因此适用于强耦合理论。作为推论，我们证明平均零能量算子是使用零片上的局部超对称代数的正算子，提供了平均零能量条件（ANEC）的超对称推导。最后，我们在自由无质量超对称理论中验证了我们的结果，并提出了论据来支持局部超对称性即使在一般的超对称量子场论中也能继续确保 ANEC 得到满足。", "authors": [{"name": "Dhruva K.S"}], "featured_authors": [{"name": "Dhruva K.S"}], "author_count": 1}, {"id": "2609.39760", "category": "hep-th", "title": "Fractional Superfluid Vortices and Worldsheet Wess--Zumino--Witten Models in Two-Color QCD and $Sp(2N)$ Gauge Theories", "abstract": "We study superfluid vortices in two-color QCD and more general pseudoreal gauge theories with even flavor number $N_f=2m$ at finite baryon density. The antisymmetric diquark condensate admits fractional minimal vortices with baryon-phase winding $\\nu=1/m$, corresponding to $1/m$ of the conventional circulation quantum, each localizing an $Sp(2)\\simeq SU(2)$ core sector. For vortices embedded in mutually orthogonal flavor planes, the leading-order chiral action factorizes exactly. Off-diagonal flavor zero modes are non-normalizable at finite separation but become localized at coincidence, enhancing the normalizable sector from $[Sp(2)]^m$ to $Sp(2m)$. For fundamental fermions of an $Sp(2N)$ gauge theory, the bulk Wess--Zumino--Witten (WZW) term descends compatibly: a cluster of $n$ coincident minimal vortices carries an $Sp(2n)_N$ WZW theory, while a flavor-symmetric vortex with positive integer baryon-phase winding $\\nu$ carries $Sp(2m)_{N\\nu}$. At unit winding this yields the vortex map to $Sp(2m)_N$, with central charge $c=Nm(2m+1)/(N+m+1)$ at the WZW fixed point, and suggests a broader nonsupersymmetric four-dimensional/two-dimensional correspondence.", "url": "https://arxiv.org/abs/2609.39760", "type": "理论", "summary": "我们研究了双色 QCD 中的超流体涡流和更一般的伪真实规范理论，在有限重子密度下具有偶数 $N_f=2m$。反对称双夸克凝聚态允许具有重子相绕组 $\\nu=1/m$ 的分数最小涡旋，对应于常规循环量子的 $1/m$，每个涡旋局部化一个 $Sp(2)\\simeq SU(2)$ 核心扇区。对于嵌入相互正交的风味平面中的涡流，前导手性作用可以精确分解。非对角风味零模式在有限分离时是不可归一化的，但在重合时会局部化，从而将可归一化扇区从 $[Sp(2)]^m$ 增强到 $Sp(2m)$。对于 $Sp(2N)$ 规范理论的基本费米子，块体 Wess--Zumino--Witten (WZW) 项兼容下降：一组 $n$ 重合最小涡流承载 $Sp(2n)_N$ WZW 理论，而具有正整数重子相绕组 $\\nu$ 的味道对称涡流承载 $Sp(2m)_{N\\nu}$。在单位缠绕时，这会产生 $Sp(2m)_N$ 的涡旋图，中心电荷 $c=Nm(2m+1)/(N+m+1)$ 在 WZW 固定点，并提出更广泛的非超对称四维/二维对应关系。", "authors": [{"name": "Muneto Nitta"}], "featured_authors": [{"name": "Muneto Nitta"}], "author_count": 1}, {"id": "2609.39769", "category": "hep-th", "title": "AI for BMN Strings", "abstract": "With the assistance of AI (Artificial Intelligence) tools, we revisit some mathematically well-formulated problems from our previous studies of BMN (Berenstein-Maldacena-Nastase) strings on type IIB string theory pp-wave background. These mathematical problems have important physical implications, relating to the computations of higher-genus critical superstring amplitudes, possible estimate of the cosmological constant. We make significant progress on some problems, while others remain unresolved.", "url": "https://arxiv.org/abs/2609.39769", "type": "理论", "summary": "在 AI（人工智能）工具的帮助下，我们重新审视了之前在 IIB 型弦理论 pp 波背景下对 BMN（Berenstein-Maldacena-Nastase）弦的研究中的一些数学上明确的问题。这些数学问题具有重要的物理意义，涉及更高属临界超弦振幅的计算、宇宙学常数的可能估计。我们在一些问题上取得了重大进展，而另一些问题仍未得到解决。", "authors": [{"name": "Min-xin Huang"}], "featured_authors": [{"name": "Min-xin Huang"}], "author_count": 1}, {"id": "2609.39893", "category": "hep-th", "title": "Light non-vacuum BMS$_3$ blocks at order $1/c_{M}$", "abstract": "We derive a closed expression for the $1/c_{M}$ correction to highest-weight BMS$_3$ blocks with four light external primaries of generic weights and non-vacuum exchange. With $c_L$ and all operator weights held fixed, we prove that the global sector and descendants containing exactly one non-global generator $L_{-n}$ or $M_{-n}$ with $n\\geq2$ suffice through this order. This truncation reduces the intrinsic calculation to global blocks and their derivatives, whose contributions we resum for nonzero exchanged boost weight $\\xi_{p}$. For pairwise identical external operators, we independently reproduce the correction through the introduction of boundary gravitons in the normalized three-point functions in the shadow representation, while keeping the exchanged two-point function fixed. The analogous prescription also reproduces the known non-vacuum Virasoro correction at order $1/c$. For the same external configuration, a formal ultra-relativistic contraction of Virasoro blocks with one flipped chiral representation provides a further check: it yields the same correction, and we prove that contraction commutes with extraction of the $1/c_{M}$ coefficient at each fixed descendant level. The degenerate exchange with $\\xi_{p}=0$ requires a separate quotient construction and is not obtained as a smooth limit of the generic block, which we discuss in the appendix.", "url": "https://arxiv.org/abs/2609.39893", "type": "理论", "summary": "我们推导出一个封闭表达式，用于对最高权重 BMS$_3$ 块进行 $1/c_{M}$ 校正，其中具有四个通用权重和非真空交换的轻型外部原色。在 $c_L$ 和所有运算符权重保持固定的情况下，我们证明全局扇区和后代恰好包含一个非全局生成器 $L_{-n}$ 或 $M_{-n}$ 以及 $n\\geq2$ 通过这一顺序就足够了。这种截断减少了对全局块及其导数的内在计算，我们对非零交换增强权重 $\\xi_{p}$ 恢复其贡献。对于成对相同的外部算子，我们通过在阴影表示中的归一化三点函数中引入边界引力子来独立地再现校正，同时保持交换的两点函数固定。类似的处方还以 $1/c$ 的阶数重现了已知的非真空 Virasoro 校正。\n\n对于相同的外部配置，具有翻转手征表示的 Virasoro 块的形式超相对论收缩提供了进一步的检查：它产生相同的校正，并且我们证明收缩与在每个固定后代级别提取 $1/c_{M}$ 系数进行交换。 $\\xi_{p}=0$ 的简并交换需要单独的商构造，并且不能作为通用块的平滑极限获得，我们将在附录中讨论。", "authors": [{"name": "Boyang Yu"}], "featured_authors": [{"name": "Boyang Yu"}], "author_count": 1}, {"id": "2609.39930", "category": "hep-th", "title": "Large gaps and BTZ entropy in modular spectra with positive integer degeneracies", "abstract": "We construct modular-invariant torus partition functions with a unique vacuum, discrete energy levels and positive integer degeneracies by recursively repairing the Maloney--Witten--Keller modular completion of the Virasoro vacuum. Exact modular repairs and finite moment matching discretize successive spectral bands while preserving earlier levels and controlling convergence. For $c_L=c_R=c$ and $a=(c-1)/12$, the construction realizes primary dimension gaps $\\Delta_1=(1+\\kappa)a$ for sufficiently small fixed $\\kappa>0$, and $\\Delta_1=a+\\delta$ for any fixed $\\delta\\ge0$, at every sufficiently large real $c$. Every nonvacuum primary satisfies $h,\\bar h\\ge(c-1)/24$. In the fixed-$\\delta$ family, spectra can be chosen whose densities of states, smoothed with a fixed nonnegative normalized smooth kernel of compact support, match the correspondingly smoothed prediction of a single perturbative BTZ saddle through every fixed finite order in $1/c$. The count includes all spins and Virasoro descendants. Its logarithm reproduces the Bekenstein--Hawking entropy and its corrections at every fixed positive $E/c$, where $E=\\Delta-c/12$. This includes $0<E<c/12$, where thermal AdS dominates the canonical ensemble.", "url": "https://arxiv.org/abs/2609.39930", "type": "理论", "summary": "我们通过递归修复 Virasoro 真空的 Maloney-Witten-Keller 模完成，构建了具有独特真空、离散能级和正整数简并性的模不变环面配分函数。精确的模块化修复和有限矩匹配离散连续的光谱带，同时保留早期的水平并控制收敛。对于 $c_L=c_R=c$ 和 $a=(c-1)/12$，对于足够小的固定 $\\kappa>0$，构造实现主维度间隙 $\\Delta_1=(1+\\kappa)a$，对于任何固定 $\\delta\\ge0$，在每个足够大的实 $c$ 处，实现主维度间隙 $\\Delta_1=a+\\delta$。每个非真空初级满足 $h,\\bar h\\ge(c-1)/24$。在固定 $\\delta$ 系列中，可以选择其状态密度的谱，并使用紧凑支持的固定非负归一化平滑核进行平滑，通过 $1/c$ 中的每个固定有限阶匹配单个扰动 BTZ 鞍的相应平滑预测。该计数包括所有旋转和 Virasoro 后代。它的对数再现了贝肯斯坦-霍金熵及其在每个固定正 $E/c$ 处的修正，其中 $E=\\Delta-c/12$。\n\n这包括 $0<E<c/12$，其中热 AdS 在规范系综中占主导地位。", "authors": [{"name": "Chi-Ming Chang"}, {"name": "Reiko Liu"}, {"name": "Wen-Jie Ma"}], "featured_authors": [{"name": "Chi-Ming Chang"}, {"name": "Reiko Liu"}, {"name": "Wen-Jie Ma"}], "author_count": 3}, {"id": "2609.39944", "category": "hep-th", "title": "Greybody factors of large Gauss-Bonnet d-dimensional black holes", "abstract": "We compute analytically greybody factors for d-dimensional large spherically symmetric black holes with Gauss-Bonnet corrections in the high frequency limit. Our calculations include both the eikonal limit, where the real part of the frequency of the scattered wave is much larger than the imaginary part, and the highly damped case,where the imaginary part of the frequency is much larger than the real part, addressing the emission of gravitons and test scalar fields, and yielding full transmission and reflection scattering coefficients. We consider tensorial, vectorial and scalar gravitational perturbations, obtaining the same result for the three cases in the highly damped limit, but not in the eikonal limit.", "url": "https://arxiv.org/abs/2609.39944", "type": "理论", "summary": "我们通过高频极限下的高斯-邦内校正来分析计算 d 维大型球对称黑洞的灰体因子。我们的计算既包括随函极限（其中散射波频率的实部远大于虚部），也包括高阻尼情况（其中频率的虚部远大于实部），解决了引力子的发射和测试标量场，并产生完全透射和反射散射系数。我们考虑张量、矢量和标量引力扰动，在高阻尼极限下的三种情况下获得相同的结果，但在 eikonal 极限下则不然。", "authors": [{"name": "Filipe Moura"}, {"name": "João Rodrigues"}], "featured_authors": [{"name": "Filipe Moura"}, {"name": "João Rodrigues"}], "author_count": 2}, {"id": "2609.40025", "category": "hep-th", "title": "Nilpotent Symmetries and Conserved Charges: BRST-Quantized Version of the 4D Abelian 2-Form Gauge Theory", "abstract": "We focus on the Becchi-Rouet-Stora-Tyutin (BRST) quantized version of the four (3 + 1)-dimensional (4D) free Abelian 2-form gauge theory and (i) discuss its infinitesimal, continuous and off-shell nilpotent (anti-)BRST and (anti-)co-BRST symmetry transformations, and (ii) derive the corresponding Noether conserved (anti-)BRST and (anti-)co-BRST charges. We demonstrate that these charges are not invariant under the above nilpotent symmetry transformations. We systematically derive the modified versions of the above Noether charges which are found to be invariant under the above symmetry transformations. As a consequence, both types of the above charges anticommute with each-other which proves their linear independence. We also derive the (anti-)BRST and (anti-)co-BRST invariant Curci-Ferrari (CF) type restrictions from the algebraic structures of the Noether conserved charges. In all the above proofs and derivations, we take into account the deep mathematical relationship that exists between the infinitesimal and continuous symmetry transformations and their generators as the Noether conserved charges.", "url": "https://arxiv.org/abs/2609.40025", "type": "理论", "summary": "我们重点关注四（3 + 1）维（4D）自由阿贝尔2型规范理论的Becchi-Rouet-Stora-Tyutin（BRST）量化版本，并（i）讨论其无穷小，连续和离壳幂零（反）BRST和（反）co-BRST对称变换，以及（ii）推导相应的Noether守恒（反）BRST和（反）co-BRST收费。我们证明这些电荷在上述幂零对称变换下不是不变的。我们系统地推导了上述诺特电荷的修改版本，发现它们在上述对称变换下是不变的。因此，上述两种类型的费用彼此反交换，这证明了它们的线性独立性。我们还从诺特守恒电荷的代数结构中推导出（反）BRST 和（反）共 BRST 不变 Curci-Ferrari (CF) 类型限制。在所有上述证明和推导中，我们考虑了无穷小和连续对称变换及其生成元（诺特守恒电荷）之间存在的深层数学关系。", "authors": [{"name": "R. P. Malik"}], "featured_authors": [{"name": "R. P. Malik"}], "author_count": 1}, {"id": "2609.40081", "category": "hep-th", "title": "Quantum corrections to the Casimir effect in a scalar Hořava-Lifshitz theory with rough plates at low temperature", "abstract": "We investigate the Casimir effect of a massive, self-interacting real scalar field with quartic coupling in a $(3+1)$-dimensional Hořava-Lifshitz-type theory, subject to rough boundaries obeying Dirichlet boundary conditions. Using the effective action and generalized $\\zeta$-function approach, we derive the renormalized effective potential, incorporating anisotropic scaling, boundary roughness, and temperature in the low-temperature regime. We determine the topological mass at one-loop order and the Casimir energy up to two loops. In the massless limit, the topological mass and the two-loop Casimir contribution exhibit infrared divergences for odd values $z>1$, associated with the absence of an intrinsic mass scale, while the one-loop Casimir energy remains finite. For $z=1$, the standard relativistic Dirichlet result is recovered in the zero-temperature and vanishing-roughness limits.", "url": "https://arxiv.org/abs/2609.40081", "type": "理论", "summary": "我们研究了 $(3+1)$ 维 Hořava-Lifshitz 型理论中具有四次耦合的大规模自相互作用实标量场的卡西米尔效应，其粗糙边界服从狄利克雷边界条件。使用有效作用和广义 $\\zeta$ 函数方法，我们推导了重正化有效势，其中结合了各向异性缩放、边界粗糙度和低温状态下的温度。我们确定一环阶的拓扑质量和最多两环的卡西米尔能量。在无质量极限下，拓扑质量和二环卡西米尔贡献对于奇数值 $z>1$ 表现出红外发散，这与内在质量标度的缺失有关，而单环卡西米尔能量仍然是有限的。对于 $z=1$，在零温度和消失粗糙度极限下恢复了标准相对论狄利克雷结果。", "authors": [{"name": "Claudio Bórquez"}, {"name": "Byron Droguett"}], "featured_authors": [{"name": "Claudio Bórquez"}, {"name": "Byron Droguett"}], "author_count": 2}, {"id": "2609.40183", "category": "hep-th", "title": "Lie Algebra Saddles in the IKKT Matrix Model and Criteria for the Emergence of Time", "abstract": "In the IKKT matrix model, the dimension, geometry, and metric signature of spacetime must emerge from the matrix dynamics. We classify the Lie-algebraic saddles of the model: classical solutions in which the ten Hermitian matrices realize a finite-dimensional real Lie algebra in a unitary representation. For this class the equations of motion collapse to a single algebraic equation for a symmetric bilinear form $h$ on the algebra, and the signature of the emergent spacetime can be read off from $h$. Two facts control the outcome. First, when the complexified algebra is simple, a Casimir obstruction allows only $h=0$; this explains why fuzzy spheres and the expanding-universe solutions need mass terms or infrared regulators. Second, semisimple algebras admit saddles only through couplings between distinct simple ideals; such saddles first appear in six dimensions and reach every signature only from twelve. These facts yield criteria for the emergence of time. Every nondegenerate Lorentzian saddle in at most eleven dimensions---hence every Lorentzian background of the ten-dimensional model---has a nonzero solvable radical. The only nontrivial possibility of the semisimple part is the Lorentz algebra $\\mathfrak{so}(1,3)$, which is purely spacelike, and every timelike direction has a component in the radical. When the semisimple part is nontrivial, it acts on the radical only from ten dimensions on; at ten dimensions, the radical must be abelian and must carry the Weyl-spinor representation, which solves the Lorentzian equations of motion; a nonabelian radical first appears in eleven dimensions. As a result, space can be semisimple; time must be solvable.", "url": "https://arxiv.org/abs/2609.40183", "type": "理论", "summary": "在 IKKT 矩阵模型中，时空的维度、几何形状和度量特征必须从矩阵动力学中产生。我们对模型的李代数鞍进行分类：经典解，其中十个埃尔米特矩阵以酉表示形式实现有限维实李代数。对于此类，运动方程塌缩为代数上对称双线性形式 $h$ 的单个代数方程，并且可以从 $h$ 中读出涌现时空的签名。有两个事实控制着结果。首先，当复杂代数很简单时，卡西米尔阻塞只允许$h=0$；这解释了为什么模糊球体和膨胀宇宙的解决方案需要质量项或红外调节器。其次，半简单代数仅通过不同简单理想之间的耦合来承认鞍点；这样的马鞍首先出现在六个维度中，并且只能从十二个维度到达每个特征。这些事实产生了时间出现的标准。最多十一个维度中的每个非简并洛伦兹鞍——因此十维模型的每个洛伦兹背景——都有一个非零可解根式。\n\n半简单部分的唯一非平凡的可能性是洛伦兹代数 $\\mathfrak{so}(1,3)$，它是纯粹类空的，并且每个类时方向都有一个根式分量。当半单部分不平凡时，它仅从十维以上作用于根式；在十维上，根式必须是阿贝尔式的，并且必须带有外尔旋量表示，该表示可以求解洛伦兹运动方程；非阿贝尔根式首先出现在十一维中。因此，空间可以是半简单的；时间一定是可以解决的。", "authors": [{"name": "Henry Liao"}], "featured_authors": [{"name": "Henry Liao"}], "author_count": 1}, {"id": "2609.40291", "category": "hep-th", "title": "The classical limit of the Magnus expansion", "abstract": "We uncover a connection between the classical limit of the Magnus expansion in quantum field theory and the Malvenuto-Reutenauer Hopf algebra of permutations. We study a cubic scalar theory describing a massive particle coupled to massless scalar quanta, which captures the propagator structure relevant to classical scattering in gravity and scalar QED. Using a Schwinger parametrisation of the massive propagators, we compute the classical limit of Magnus amplitudes at tree level in this theory. First, we prove that all hyperclassical contributions cancel at the level of the Schwinger proper-time integrand, before integration. Then, we show that the classical Magnus amplitude precisely matches expectations from worldline quantum field theory. Both results rely on cancellations of disconnected diagrams which we relate to the Hopf algebra, specifically to the action of the adjoint first Eulerian projector, which annihilates the shuffle products associated with disconnected contributions. Moreover, the worldline diagrams include generic directed-tree topologies, whereas the field-theory diagrams only include directed chains. The correspondence we establish between the two therefore leads to a new formula for generic Murua coefficients in terms of simpler directed chain coefficients. Finally, we observe a suggestive connection between Magnus amplitudes and the web-mixing matrices governing the exponentiation of multiple Wilson lines.", "url": "https://arxiv.org/abs/2609.40291", "type": "理论", "summary": "我们揭示了量子场论中马格努斯展开式的经典极限与排列的 Malvenuto-Reutenauer Hopf 代数之间的联系。我们研究了描述与无质量标量量子耦合的大质量粒子的三次标量理论，该理论捕获了与重力和标量 QED 中的经典散射相关的传播器结构。使用大规模传播器的施温格参数化，我们计算了该理论中树级别马格努斯振幅的经典极限。首先，我们证明在积分之前，所有超经典贡献都在施温格原时被积函数的水平上抵消。然后，我们证明经典马格努斯振幅精确地符合世界量子场论的期望。这两个结果都依赖于与 Hopf 代数相关的断开图的取消，特别是与伴随第一欧拉投影仪的操作有关，它消除了与断开贡献相关的洗牌乘积。此外，世界线图包括通用有向树拓扑，而场论图仅包括有向链。\n\n因此，我们在两者之间建立的对应关系得出了一个用更简单的有向链系数表示的通用 Murua 系数的新公式。最后，我们观察到马格努斯振幅和控制多条威尔逊线求幂的网络混合矩阵之间的暗示性联系。", "authors": [{"name": "Andreas Brandhuber"}, {"name": "Graham R. Brown"}, {"name": "Sebastien MacDonald"}, {"name": "Paolo Pichini"}, {"name": "Gabriele Travaglini"}, {"name": "Pablo Vives Matasan"}], "featured_authors": [{"name": "Andreas Brandhuber"}, {"name": "Graham R. Brown"}, {"name": "Sebastien MacDonald"}, {"name": "Paolo Pichini"}, {"name": "Gabriele Travaglini"}, {"name": "Pablo Vives Matasan"}], "author_count": 6}, {"id": "2609.40326", "category": "hep-th", "title": "Four-loop beta function in N=2 supersymmetric Yang-Mills theory, dimensional reduction, and treatment of $γ_5$", "abstract": "Adopting the dimensional-reduction scheme, we diagrammatically compute, at four loops, the beta function of N=2 supersymmetric Yang-Mills theory, which is well known to vanish beyond one loop. This provides a formidable testbed for both the treatment of the problematic $\\gamma_5$ Dirac matrix in D dimensions and the implementation of the dimensional-reduction scheme. In the use of the reading-point method of $\\gamma_5$, being preferable for convenience, specific details of implementation start to matter at four loops. We thus rigorously validate these implementation issues, which have previously been advocated for the calculation of the gauge-coupling beta functions at four loops in the Standard Model.", "url": "https://arxiv.org/abs/2609.40326", "type": "理论", "summary": "采用降维方案，我们在四个循环处图解地计算了 N=2 超对称杨-米尔斯理论的 beta 函数，众所周知，该函数在一个循环之后就会消失。这为 D 维中有问题的 $\\gamma_5$ 狄拉克矩阵的处理和降维方案的实现提供了一个强大的测试平台。在使用 $\\gamma_5$ 的读取点方法时，为了方便起见，具体的实现细节从四个循环开始就很重要。因此，我们严格验证了这些实现问题，这些问题之前已被提倡用于计算标准模型中四个循环的规范耦合 beta 函数。", "authors": [{"name": "M.A. Bezuglov"}, {"name": "B.A. Kniehl"}, {"name": "V.N. Velizhanin"}], "featured_authors": [{"name": "M.A. Bezuglov"}, {"name": "B.A. Kniehl"}, {"name": "V.N. Velizhanin"}], "author_count": 3}, {"id": "2609.38192", "category": "math-ph", "title": "Quasi-exponentials and semi-classical limits for the chordal BPZ system", "abstract": "We study the nonlinear Hamilton--Jacobi system arising as the formal semi-classical limit of the chordal Belavin--Polyakov--Zamolodchikov equations with a common eigenvalue parameter $\\lambda$. We determine the number of global real-valued solutions modulo additive constants. When $\\lambda=0$, the number of solutions can be derived using the connection between the solutions and rational functions, due to Eremenko. We focus on the case when $\\lambda\\neq 0$ in this article. For $\\lambda>0$, a Schwarzian correspondence relates the algebraic equations for the gradients to quasi-exponentials with prescribed critical points. Enumeration and transversality results of Mukhin, Tarasov, and Varchenko yield smooth real branches, and a Poisson bracket identity establishes their exactness. An energy bound rules out global real-valued solutions for $\\lambda<0$.", "url": "https://arxiv.org/abs/2609.38192", "type": "理论", "summary": "我们研究了非线性 Hamilton-Jacobi 系统，它是具有共同特征值参数 $\\lambda$ 的弦 Belavin--Polyakov--Zamolodchikov 方程的形式半经典极限。我们确定全局实值解的模加性常数的数量。当 $\\lambda=0$ 时，根据 Eremenko，可以利用解与有理函数之间的联系导出解的数量。本文我们重点讨论 $\\lambda\\neq 0$ 的情况。对于 $\\lambda>0$，施瓦茨对应关系将梯度的代数方程与具有指定临界点的拟指数联系起来。 Mukhin、Tarasov 和 Varchenko 的枚举和横向结果产生平滑的实分支，并且泊松括号恒等式确定了它们的准确性。能量界限排除了 $\\lambda<0$ 的全局实值解。", "authors": [{"name": "Mo Chen"}, {"name": "Hao Wu"}], "featured_authors": [{"name": "Mo Chen"}, {"name": "Hao Wu"}], "author_count": 2}, {"id": "2609.38211", "category": "math-ph", "title": "Para families of orthogonal polynomials", "abstract": "The para-Krawtchouk polynomials arose in the search for spin chains with perfect state transfer; the para-Racah, $q$-para-Racah and para-Bannai--Ito polynomials followed, obtained through singular truncations of families of the Askey scheme and used in turn to design spin chains. All are orthogonal on bi-lattices; the prefix goes back to the para-Krawtchouk case, whose spectrum is that of the parabose oscillator. The representations that these polynomials provide of the corresponding algebras --- Hahn, Racah, $q$-Racah, Bannai--Ito and complementary Bannai--Ito --- are shown to be reducible. Each decomposes into a direct sum of two irreducible modules of the same algebra, one attached to each of the two interlaced sub-lattices, and the parameters of the submodules are given. The para polynomials are thereby expressed in terms of the classical polynomials that the submodules carry, and the pairing $\\lambda_n=\\lambda_{N-n}$ of their eigenvalues is accounted for; the three features of the bi-lattice setting on which the reduction rests are identified. The properties of the para families are then presented in a unified way in the light of this decomposition, together with the constructions through which these families arise and the settings in which they have been put to use.", "url": "https://arxiv.org/abs/2609.38211", "type": "理论", "summary": "准 Krawtchouk 多项式是在寻找具有完美状态转移的自旋链时出现的；接下来是 para-Racah、$q$-para-Racah 和 para-Bannai-Ito 多项式，它们是通过 Askey 方案族的奇异截断获得的，并依次用于设计自旋链。所有在双晶格上都是正交的；前缀可以追溯到para-Krawtchouk 情况，其频谱是抛物线振荡器的频谱。这些多项式提供的相应代数 --- Hahn、Racah、$q$-Racah、Bannai--Ito 和互补 Bannai--Ito --- 的表示形式被证明是可约的。每个分解为同一代数的两个不可约模块的直和，每个模块附加到两个交错子格中的每一个，并且给出了子模块的参数。因此，对多项式用子模块携带的经典多项式来表示，并且考虑了其特征值的配对 $\\lambda_n=\\lambda_{N-n}$ ；确定了减少所依赖的双格设置的三个特征。\n\n然后根据这种分解，以统一的方式呈现准族的属性，以及这些族产生的结构和它们被使用的环境。", "authors": [{"name": "Stéphane Z. Beaulac"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Rafael I. Nepomechie"}, {"name": "Luc Vinet"}], "featured_authors": [{"name": "Stéphane Z. Beaulac"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Rafael I. Nepomechie"}, {"name": "Luc Vinet"}], "author_count": 6}, {"id": "2609.38234", "category": "math-ph", "title": "Integer Sampling and the Identifiability of Mellin Residues", "abstract": "I prove that all Mellin residues are determined exactly by integer samples known up to errors smaller than every algebraic order, for an explicit class of functions consisting of a slow component with a complete inverse-power expansion and countably many carriers $\\exp(2\\pi i\\sigma 2^k a^x)$ with admissible envelopes. A single exceptional null set of parameters $a>1$ works for the entire function class. The key estimate is an eventual uniform lower bound for a polynomially weighted sampling Gram matrix on windows of length $N^{1/2}$, with $O(N^{1/4})$ active modes. I derive this bound from parameter-averaged oscillatory integrals and a finite trace-moment comparison with product Haar measure, retaining the exact resonances among dyadic frequencies. Summed Taylor estimates then identify every coefficient of the slow asymptotic expansion, and a Mellin continuation argument identifies these coefficients with the actual residues. I also give an alternative derivation from existing higher-correlation estimates, an infinite-mode example, and exact counterexamples at integer parameters. The result supplies an interpolation-invariance statement for a model class motivated by Mellin averaging in quantum gravity.", "url": "https://arxiv.org/abs/2609.38234", "type": "理论", "summary": "我证明所有梅林留数都是由已知误差小于每个代数阶的整数样本精确确定的，对于由具有完全逆幂展开的慢速分量和可数个带有可接受包络的载波 $\\exp(2\\pi i\\sigma 2^k a^x)$ 组成的显式函数类。单个异常空参数集 $a>1$ 适用于整个函数类。关键估计是长度为 $N^{1/2}$ 的窗口上多项式加权采样 Gram 矩阵的最终统一下界，其中活动模式为 $O(N^{1/4})$。我从参数平均振荡积分以及与乘积哈尔测量的有限迹矩比较中得出了这个界限，保留了二元频率之间的精确共振。然后，求和泰勒估计确定缓慢渐近展开的每个系数，并且梅林连续论证将这些系数与实际残差确定。我还给出了现有的较高相关性估计的替代推导、无限模式示例以及整数参数的精确反例。\n\n结果为由梅林量子引力平均驱动的模型类提供了插值不变性声明。", "authors": [{"name": "Yifan He"}], "featured_authors": [{"name": "Yifan He"}], "author_count": 1}, {"id": "2609.38382", "category": "math-ph", "title": "Reachable sets under Kolmogorov dynamics in the probability simplex", "abstract": "The finite-time reachability problem - whether two probability vectors can be transformed in a time t through a generator from a given set - is a key question in Markovian dynamics. We address this problem for normalized Kolmogorov generators with tools from differential geometry. The shortest time T connecting an ordered pair of states defines an (asymmetric) quasi-distance in the probability simplex, which distinguishes between outgoing and incoming reachable sets, and captures the inherent irreversibility of Markov dynamics. The Finsler metric corresponding to normalized generators with bounded diagonal entries is characterized, and time-independent evolutions that saturate speed limits are presented. Analytical boundaries of both reachable sets are derived and the ratio of their corresponding volumes assess the bounds obtained. The asymmetry with respect to the uniform probability vector is shown to be related to the Kullback-Leibler relative entropy.", "url": "https://arxiv.org/abs/2609.38382", "type": "理论", "summary": "有限时间可达性问题——两个概率向量是否可以在时间 t 内通过给定集合的生成器进行变换——是马尔可夫动力学中的一个关键问题。我们使用微分几何工具解决归一化柯尔莫哥洛夫生成器的这个问题。连接有序状态对的最短时间 T 定义了概率单纯形中的（不对称）准距离，它区分传出和传入可达集，并捕获马尔可夫动力学固有的不可逆性。对应于具有有界对角线条目的归一化生成器的芬斯勒度量被表征，并且提出了使速度限制饱和的与时间无关的演化。推导出两个可达集的分析边界，并用其相应体积的比率评估所获得的边界。相对于均匀概率向量的不对称性被证明与 Kullback-Leibler 相对熵有关。", "authors": [{"name": "Alfonso Fernández de Bobadilla"}, {"name": "Mykhailo Hontarenko"}, {"name": "Guillem Müller-Rigat"}, {"name": "Karol Życzkowski"}], "featured_authors": [{"name": "Alfonso Fernández de Bobadilla"}, {"name": "Mykhailo Hontarenko"}, {"name": "Guillem Müller-Rigat"}, {"name": "Karol Życzkowski"}], "author_count": 4}, {"id": "2609.39262", "category": "math-ph", "title": "Exact Chained-Word Threshold and Monotone-Path Structure in the Even Root-of-Unity Kaleidoscope Yang-Baxter Algebra", "abstract": "The Kaleidoscope Yang-Baxter equation of Qiu, Guan, and Yu (2026) is the consistency condition of multiple scattering in Gaudin's kaleidoscope models. At an even order $N$ it involves two matrices: a shift, and a square-zero matrix with one complex parameter. They conjectured that every chained word, the square-zero matrix alternating with integer powers of the shift, vanishes once the number of powers reaches $N/2$, verified through order ten. We prove it for every even order and every parameter where the matrices exist. The bound is sharp. One step below it, a word is nonzero exactly when no factor's power times its position is divisible by half the order, and then has rank two. The proof rests on one flag that every factor lowers by a step. The algebra the two matrices generate is a monotone-path algebra: its basis paths multiply only while their level keeps direction. It is independent of the parameter and has dimension $N^2-N+2$. Its radical, generated by the square-zero matrix, is nilpotent of index one more than half the order, and its representation type is infinite. Four conditions over an arbitrary field reproduce the threshold and the radical. None can be dropped, and the root-of-unity model is one instance.", "url": "https://arxiv.org/abs/2609.39262", "type": "理论", "summary": "Qiu、Guan 和 Yu (2026) 的万花筒 Yang-Baxter 方程是 Gaudin 万花筒模型中多重散射的一致性条件。在偶数阶 $N$ 下，它涉及两个矩阵：一个移位矩阵和一个具有一个复数参数的零方矩阵。他们推测，一旦幂数达到 $N/2$，每个链接的单词（即与移位的整数幂交替的平方零矩阵）就会消失，这已通过十阶验证。我们对矩阵存在的每个偶数阶和每个参数都证明了这一点。界限很尖锐。再低一级，当没有一个因子的幂乘以它的位置可以被阶数的一半整除时，一个单词就非零，然后有第二个等级。证据基于一个标志，即每个因素都会降低一步。两个矩阵生成的代数是单调路径代数：其基本路径仅在其级别保持方向时相乘。它与参数无关，维度为 $N^2-N+2$。它的根式由零平方矩阵生成，索引一多于一半阶的幂幂，并且其表示类型是无限的。任意场上的四个条件再现阈值和根式。\n\n没有一个可以被删除，统一根模型就是一个实例。", "authors": [{"name": "Qihang Wang"}, {"name": "Zhiyuan Yao"}], "featured_authors": [{"name": "Qihang Wang"}, {"name": "Zhiyuan Yao"}], "author_count": 2}, {"id": "2609.39462", "category": "math-ph", "title": "Many-body localization: an introduction for mathematicians", "abstract": "These notes are based on a mini-course delivered at the Les Houches Summer School, Quantum Theory on All Scales, in August 2026. They introduce many-body localization to mathematicians, emphasizing the physical mechanisms that support or destabilize it. The mathematical discussion deals with how perturbative rotations, renormalization, and probabilistic estimates are used in a rigorous approach to many-body localization.", "url": "https://arxiv.org/abs/2609.39462", "type": "理论", "summary": "这些笔记基于 2026 年 8 月在 Les Houches 暑期学校讲授的迷你课程《所有尺度的量子理论》。它们向数学家介绍了多体定位，强调了支持或破坏它稳定的物理机制。数学讨论涉及如何在严格的多体定位方法中使用扰动旋转、重整化和概率估计。", "authors": [{"name": "Francois Huveneers"}], "featured_authors": [{"name": "Francois Huveneers"}], "author_count": 1}, {"id": "2609.39540", "category": "math-ph", "title": "Reconsidering the Vacuum Energy of a Massive Scalar Field in a Spherical Cavity", "abstract": "We reconsider the vacuum (Casimir) energy of a massive scalar field obeying Dirichlet boundary conditions inside a spherical cavity. Using zeta-function regularization, we carefully recalculate the analytic part of the zeta function via the uniform asymptotic expansion of the modified Bessel functions. We correct a sign error present in an earlier calculation (PR D56 (1997) 4896) that affected the large-mass behavior. The renormalized vacuum energy is shown to vanish for large mass, as required on physical grounds. Numerical results reveal that the energy changes sign several times as a function of the cavity radius.", "url": "https://arxiv.org/abs/2609.39540", "type": "理论", "summary": "我们重新考虑球腔内服从狄利克雷边界条件的大标量场的真空（卡西米尔）能量。使用 zeta 函数正则化，我们通过修正贝塞尔函数的一致渐近展开仔细地重新计算 zeta 函数的解析部分。我们纠正了早期计算 (PR D56 (1997) 4896) 中存在的影响大质量行为的符号错误。根据物理基础的要求，重整化的真空能量对于大质量会消失。数值结果表明，能量作为腔半径的函数多次改变符号。", "authors": [{"name": "M. Bordag"}, {"name": "I.G. Pirozhenko"}], "featured_authors": [{"name": "M. Bordag"}, {"name": "I.G. Pirozhenko"}], "author_count": 2}, {"id": "2609.39914", "category": "math-ph", "title": "Cluster Attention Neural Operators for Solving Parametric Partial Differential Equations", "abstract": "Traditional simulations of parametric partial differential equations (PDEs) rely on repetitive computations for each param
