, with explicit dependence on how the input is queried, the required accuracy, and the spectral gaps. Exact spectra for balanced multipartite clique complexes provide favorable gaps, and a related construction gives an explicit torsion-bearing benchmark. With compact query access, the algorithm need not construct the exponentially large boundary matrices explicitly. For a restricted torsion-bearing family, a tailored amplitude-estimation routine uses quadratically fewer queries than any randomized classical algorithm given comparable access when estimating the log pseudodeterminant. Estimating the full, unnormalized quantity to fixed additive error still costs in proportion to the candidate-space dimension $D$.", "url": "https://arxiv.org/abs/2609.40216", "type": "理论+数值", "summary": "贝蒂数是拓扑数据分析的核心，但无法捕获积分同调中的挠率。扭转可以区分具有相同贝蒂数的拓扑结构，经典拓扑数据分析的例子表明，它可以影响从数据推断的拓扑。众所周知，相关的扭转敏感量在基于图的机器学习中具有实际应用，包括生物医学应用。我们研究量子光谱方法如何获取这些附加信息。对数伪行列式是通过对非零边界拉普拉斯特征值的对数求和而获得的，概括了单纯复形的谱信息。在明确的拓扑假设下，这些量的交替组合给出了更高临界组的大小，即图沙堆组的更高维类似物。通过更强的认证，相关的构造可以恢复同调性本身的挠率子群的大小。据我们所知，这是第一个可证明正确的积分同调挠阶量子估计器。\n\n我们给出了一种新的量子算法来估计这些量，该算法明确依赖于输入的查询方式、所需的精度和光谱间隙。平衡的多部分团复合体的精确谱提供了有利的间隙，相关的结构给出了明确的扭转轴承基准。通过紧凑的查询访问，该算法不需要显式地构造指数大的边界矩阵。对于受限扭转轴承族，在估计对数伪行列式时，定制的幅度估计例程使用的查询数量比任何随机经典算法少两倍，而这些随机经典算法在估计对数伪行列式时具有可比较的访问权限。估计固定加性误差的完整非标准化数量仍然与候选空间维度 $D$ 成比例。", "authors": [{"name": "Dimitrios Thanos"}, {"name": "Caesnan Leditto"}, {"name": "Adam Wesolowski"}, {"name": "Andreea-Iulia Lefterovici"}, {"name": "Mahtab Yaghubi Rad"}], "featured_authors": [{"name": "Dimitrios Thanos"}, {"name": "Caesnan Leditto"}, {"name": "Adam Wesolowski"}, {"name": "Andreea-Iulia Lefterovici"}, {"name": "Mahtab Yaghubi Rad"}], "author_count": 5}, {"id": "2609.40217", "category": "quant-ph", "title": "Improved quantum volume estimation with transducers and amortized quantum walks", "abstract": "The volume estimation problem is a classic task in computational geometry. The development of randomized algorithms for this problem spurred the development of many influential algorithmic techniques related to Markov Chain Monte Carlo and simulated annealing, and the problem connects to several important geometrical results, like the recently-resolved KLS conjecture. In this work, we quantize the state-of-the-art $\\widetilde{O}(d^{3.5}+d^3/\\varepsilon^2)$-query randomized algorithm developed by Cousins and Vempala, and obtain a $\\widetilde{O}(d^{3.5} + d^{1.75}/\\varepsilon)$-query quantum algorithm, improving over the $\\widetilde{O}(d^{3.5} + d^{2.25}/\\varepsilon)$ state-of-the-art bound. Our key technical contribution is a framework for amortizing the cost of a quantum walk. The framework is based on the recent transducer toolkit introduced by Belovs, Jeffery and Yolcu. It is this amortized quantum walk framework that allows us to exploit the amortized analysis of the ball walk by Cousins and Vempala, thus overcoming the key barrier that previously barred its quantum implementation.", "url": "https://arxiv.org/abs/2609.40217", "type": "理论+数值", "summary": "体积估计问题是计算几何中的一个经典任务。针对该问题的随机算法的发展促进了许多与马尔可夫链蒙特卡罗和模拟退火相关的有影响力的算法技术的发展，并且该问题与几个重要的几何结果相关，例如最近解决的 KLS 猜想。在这项工作中，我们量化了 Cousins 和 Vempala 开发的最先进的 $\\widetilde{O}(d^{3.5}+d^3/\\varepsilon^2)$-query 随机算法，并获得 $\\widetilde{O}(d^{3.5} + d^{1.75}/\\varepsilon)$-query 量子算法，改进了$\\widetilde{O}(d^{3.5} + d^{2.25}/\\varepsilon)$ 最先进的边界。我们的关键技术贡献是一个分摊量子行走成本的框架。该框架基于 Belovs、Jeffery 和 Yolcu 最近推出的传感器工具包。正是这种摊销量子游走框架使我们能够利用 Cousins 和 Vempala 对球游走的摊销分析，从而克服了之前阻碍其量子实现的关键障碍。", "authors": [{"name": "Arjan Cornelissen"}, {"name": "Simon Apers"}, {"name": "Sander Gribling"}], "featured_authors": [{"name": "Arjan Cornelissen"}, {"name": "Simon Apers"}, {"name": "Sander Gribling"}], "author_count": 3}, {"id": "2609.40218", "category": "quant-ph", "title": "Purification brings advantages in sequential quantum channel discrimination", "abstract": "Purifications are often used as a convenient mathematical representation of quantum states and channels when constructing protocols for quantum information processing tasks. Although powerful, this perspective can suggest that the purifying degrees of freedom and its correlations with an environment are just a useful change of representation. Here we show how they can instead be exploited as an operational resource in sequential quantum channel discrimination, even when the environmental reference frame is unknown or averaged. In contrast to state discrimination and parallel channel discrimination, for which bare and averaged-purification access are equivalent, sequential access to purified resources exhibits a strict advantage in probability of success. We prove this strict separation via two main results. In the first, we construct a pair of families of qubit-qubit channels with a strict separation in the two-query case, and in the second, we show an example of a pair of qubit-qubit channels whose purifications are perfectly distinguishable with three queries while no finite number of bare (non-purified) queries suffices for perfect discrimination. These separations imply an advantage of sequential over parallel strategies for channel discrimination and establish the impossibility of converting bare channel queries into averaged-purification queries via transformations that allow arbitrary interventions between queries, strengthening previous results.", "url": "https://arxiv.org/abs/2609.40218", "type": "理论", "summary": "在构建量子信息处理任务的协议时，纯化通常被用作量子态和通道的便捷数学表示。尽管这种观点很强大，但它可以表明净化自由度及其与环境的相关性只是表征的一种有用的改变。在这里，我们展示了如何将它们用作顺序量子通道辨别中的操作资源，即使环境参考系未知或平均也是如此。与状态歧视和并行通道歧视相比，裸露和平均纯化访问是等效的，对纯化资源的顺序访问在成功概率方面表现出严格的优势。我们通过两个主要结果证明了这种严格的分离。在第一个中，我们构建了一对在双查询情况下严格分离的量子位-量子位通道族，在第二个中，我们展示了一对量子位-量子位通道的示例，其纯化可以通过三个查询完全区分，而没有有限数量的裸（未纯化）查询足以完美区分。\n\n这些分离意味着用于通道区分的顺序策略相对于并行策略的优势，并且不可能通过允许查询之间任意干预的转换将裸通道查询转换为平均纯化查询，从而加强先前的结果。", "authors": [{"name": "Zoe G. del Toro"}, {"name": "Marco Túlio Quintino"}, {"name": "Jessica Bavaresco"}], "featured_authors": [{"name": "Zoe G. del Toro"}, {"name": "Marco Túlio Quintino"}, {"name": "Jessica Bavaresco"}], "author_count": 3}, {"id": "2609.40220", "category": "quant-ph", "title": "NLTM Hamiltonians from gauged sheaf quantum locally testable codes", "abstract": "Understanding the complexity of low-energy quantum states is a central problem in quantum complexity theory and many-body physics. Here we prove the no low-energy trivial magic (NLTM) conjecture, constructing a family of local Hamiltonians for which every state within a positive energy density window requires circuit depth $\\Omega(\\log n)$ to prepare from arbitrary stabilizer state that may themselves be highly entangled. Notably, our result is intrinsic in the sense that the same Hamiltonian family and energy density threshold apply to arbitrary qudit stabilizer inputs with any bounded local dimensions. Our construction builds on non-Abelian gauged sheaf codes obtained using the cup product structure on good quantum locally testable codes. We establish constant operator soundness for the associated Hamiltonians, enabling their protected logical structure to constrain all states at sufficiently low energy density. By excluding shallow stabilizer-based classical witnesses, Our result substantially strengthens NLTS and advances our understanding of low-energy complexity relevant to quantum PCP.", "url": "https://arxiv.org/abs/2609.40220", "type": "理论", "summary": "理解低能量子态的复杂性是量子复杂性理论和多体物理学的中心问题。在这里，我们证明了非低能平凡魔法（NLTM）猜想，构造了一个局部哈密顿量族，其中正能量密度窗口内的每个状态都需要电路深度 $\\Omega(\\log n)$ 来从本身可能高度纠缠的任意稳定器状态进行准备。值得注意的是，我们的结果是内在的，因为相同的哈密顿族和能量密度阈值适用于具有任何有界局部维度的任意量子稳定器输入。我们的构造建立在使用良好的量子局部可测试代码上的杯积结构获得的非阿贝尔规范束代码的基础上。我们为相关的哈密顿量建立了恒定的算子稳健性，使其受保护的逻辑结构能够将所有状态限制在足够低的能量密度下。通过排除基于浅稳定剂的经典见证，我们的结果大大加强了 NLTS 并增进了我们对与量子 PCP 相关的低能量复杂性的理解。", "authors": [{"name": "Fuchuan Wei"}, {"name": "Zhengyi Han"}, {"name": "Zimu Li"}, {"name": "Zi-Wen Liu"}], "featured_authors": [{"name": "Fuchuan Wei"}, {"name": "Zhengyi Han"}, {"name": "Zimu Li"}, {"name": "Zi-Wen Liu"}], "author_count": 4}, {"id": "2609.40223", "category": "quant-ph", "title": "Causal inequalities witness non-stabilizerness", "abstract": "Stabilizer operations describe a fragment of quantum theory that is known to be efficiently classically simulable, thanks to the Gottesman-Knill theorem. For this reason, nonstabilizer resources such as magic states are necessary for universal quantum computation. Interestingly, the operational and axiomatic approaches to the resource theory of magic differ: the set of free operations in the former, namely, stabilizer operations (SO), is strictly smaller than that in the latter, namely, completely stabilizer preserving operations (CSPO). A simple example showing the separation is given by a three-qubit stabilizer product basis whose states cannot be perfectly discriminated using SO, but which do admit perfect discrimination using CSPO. Such an ensemble of states is said to exhibit nonstabilizerness without magic (NSWM). Here we obtain a principled understanding of this phenomenon, proving necessary and sufficient conditions for its existence. We first derive a simple criterion to decide whether, given a stabilizer basis, its states can be perfectly discriminated using stabilizer operations alone. We then consider the case where the stabilizer basis contains only product states and use its link with process functions---classical models of paradox-free causal loops---to prove the following: the states in a stabilizer product basis require nonstabilizerness for perfect discrimination if and only if the corresponding process function violates a causal inequality. This provides a new operational meaning to causal inequality violations as witnesses of nonstabilizerness, a form of computational nonclassicality.", "url": "https://arxiv.org/abs/2609.40223", "type": "理论", "summary": "稳定器操作描述了量子理论的一个片段，由于戈特斯曼-尼尔定理，该理论可以有效地进行经典模拟。因此，诸如幻态之类的非稳定资源对于通用量子计算来说是必要的。有趣的是，魔法资源理论的操作方法和公理方法是不同的：前者的自由操作集合，即稳定器操作（SO），严格小于后者的自由操作集合，即完全稳定器保留操作（CSPO）。一个显示分离的简单例子是由三量子位稳定器乘积基础给出的，其状态不能使用 SO 完全区分，但可以使用 CSPO 进行完美区分。据说这样的国家集合表现出无魔法的不稳定（NSWM）。在这里，我们对这一现象有了原则性的认识，证明了其存在的充分必要条件。我们首先推导出一个简单的标准来决定，在给定稳定器基础的情况下，是否可以仅使用稳定器操作来完美地区分其状态。\n\n然后，我们考虑稳定器基础仅包含乘积状态的情况，并使用其与过程函数（无悖论因果循环的经典模型）的联系来证明以下内容：当且仅当相应的过程函数违反因果不等式时，稳定器乘积基础中的状态需要非稳定器才能完全区分。这为因果不平等的违反提供了新的操作意义，作为非稳定性的见证，这是一种计算非经典性的形式。", "authors": [{"name": "Leonardo Vaglini"}, {"name": "Nasra Daher Ahmed"}, {"name": "Ravi Kunjwal"}], "featured_authors": [{"name": "Leonardo Vaglini"}, {"name": "Nasra Daher Ahmed"}, {"name": "Ravi Kunjwal"}], "author_count": 3}, {"id": "2609.40226", "category": "quant-ph", "title": "A physical and universal model of bosonic computations with Solovay-Kitaev theorem", "abstract": "Bosonic quantum systems are among the leading architectures for quantum information processing, offering continuous-variable degrees of freedom with strong error-correction capabilities. However, standard bosonic quantum computation models such as the Lloyd-Braunstein [Lloyd and Braunstein, 1999] and hybrid oscillator-qubit models [Brenner, Dias, and Koenig, 2025; Liu et al., 2026] permit dramatic energy growth, leading to unphysical computational power and the breakdown of fundamental algorithmic tools such as universal and efficient compilation [Brenner et al., 2026; Rudolph et al., 2025]. To address this, we introduce a new model of bosonic quantum computation, Bosonic Energy-Preserving Quantum Computation (BEQC), in which energy is treated as a computational resource. Namely, energy is supplied solely through input coherent states, and all gates are generated by energy-preserving Hamiltonians. Thus, by construction, dramatic energy growth is impossible, making the model physically grounded. We next show that BEQC is a computationally robust and universal model in many respects, including: (1. Computational power) BEQC efficiently simulates all polynomial-energy computations in existing models, and exactly recovers BQP in the polynomial energy setting. It further admits several complexity-theoretic upper bounds when varying the energy, precision, and space parameters of the model. (2. Universal gate sets and state synthesis) BEQC has natural universal gate sets based on linear optics and Kerr interactions. In particular, we obtain a Solovay-Kitaev theorem which circumvents previous no-go results. We give various applications, including (a) a protocol for engineering GKP states with rigorous preparation guarantees, (b) Fock state preparation to exponential precision, and (c) native Fock space simulation of any qubit-based unitary.", "url": "https://arxiv.org/abs/2609.40226", "type": "理论+数值", "summary": "玻色子量子系统是量子信息处理的领先架构之一，提供连续可变的自由度和强大的纠错能力。然而，标准玻色子量子计算模型，例如 Lloyd-Braunstein [Lloyd 和 Braunstein，1999] 和混合振荡器量子位模型 [Brenner、Dias 和 Koenig，2025； Liu et al., 2026]允许能量急剧增长，导致非物理计算能力和基本算法工具的崩溃，例如通用和高效的编译[Brenner et al., 2026;鲁道夫等人，2025]。为了解决这个问题，我们引入了一种新的玻色子量子计算模型，即玻色子守能量子计算（BEQC），其中能量被视为一种计算资源。也就是说，能量仅通过输入相干态提供，并且所有门均由能量守恒哈密顿量生成。因此，通过构建，能量的急剧增长是不可能的，从而使模型在物理上接地。接下来我们证明 BEQC 在许多方面都是一个计算稳健且通用的模型，包括：（1.\n\n计算能力）BEQC 有效模拟现有模型中的所有多项式能量计算，并在多项式能量设置下精确恢复 BQP。当改变模型的能量、精度和空间参数时，它进一步承认几个复杂性理论的上限。 （2.通用门集和状态综合）BEQC具有基于线性光学和克尔相互作用的天然通用门集。特别是，我们获得了 Solovay-Kitaev 定理，该定理规避了之前的不可行结果。我们提供了各种应用，包括（a）具有严格准备保证的工程 GKP 状态的协议，（b）指数精度的 Fock 状态准备，以及（c）任何基于量子位的酉的本机 Fock 空间模拟。", "authors": [{"name": "Dorian Rudolph"}, {"name": "Arsalan Motamedi"}, {"name": "Dhruva Sambrani"}, {"name": "Hamid Reza Naeij"}, {"name": "Ulysse Chabaud"}, {"name": "Sevag Gharibian"}, {"name": "Saeed Mehraban"}], "featured_authors": [{"name": "Dorian Rudolph"}, {"name": "Arsalan Motamedi"}, {"name": "Dhruva Sambrani"}, {"name": "Ulysse Chabaud"}, {"name": "Sevag Gharibian"}, {"name": "Saeed Mehraban"}], "author_count": 7}, {"id": "2609.40227", "category": "quant-ph", "title": "Randomness of exact unitary designs under symmetry", "abstract": "We define the unitary design strength of a finite unitary ensemble to be the maximal integer $t$ for which its $t$-th statistical moment is identical to that of the unitary group. In the presence of physical symmetry, not all operators of an ensemble are symmetry-compatible. This motivates us to define the symmetric design strength of a finite unitary ensemble to be the maximal integer $t$ for which the $t$-th moments of its symmetry-compatible sub-ensemble match those of the group of symmetry-compatible unitaries. We show that in sufficiently high dimension and for a broad family of symmetries, which includes the global on-site $\\mathrm{U}(1)$ and $\\mathrm{SU}(d)$ symmetries, there exist finite unitary ensembles of arbitrarily high design strength whose symmetric design strength is strictly higher. Ensembles with this property may be more versatile under symmetry constraints for protocols that rely on unitary randomization than they are without symmetry. Our results extend the previous work [Mitsuhashi and Yoshioka, PRX Quantum 4.4 (Nov. 2023)] showing that the symmetric design strength of the Clifford group is strictly upper bounded by its unitary design strength for symmetries that do not trivialize the symmetry-compatible unitaries. Due to the special significance of unitary designs with a group structure, we also derive a variety of bounds on the unitary and symmetric design strengths of finite unitary ensembles whose operators form a group. In particular, we provide a simple proof that an arbitrary ensemble of operators forming a finite group must have a symmetric design strength of at most two under the global on-site $\\mathrm{U}(1)$ and $\\mathrm{SU}(d)$ symmetries. Along the way, we show that there exist uniformly weighted groups of arbitrarily high symmetric design strength in arbitrary dimension and analyze their structure.", "url": "https://arxiv.org/abs/2609.40227", "type": "理论", "summary": "我们将有限酉系综的酉设计强度定义为最大整数$t$，其第$t$个统计矩与酉群的统计矩相同。在存在物理对称性的情况下，并非系综的所有算子都是对称兼容的。这促使我们将有限酉系综的对称设计强度定义为最大整数$t$，其中其对称性兼容子系综的第$t$个矩与对称性兼容酉系群的矩相匹配。我们证明，在足够高的维度和广泛的对称族中，包括全局现场 $\\mathrm{U}(1)$ 和 $\\mathrm{SU}(d)$ 对称性，存在任意高设计强度的有限酉系综，其对称设计强度严格更高。对于依赖单一随机化的协议，具有此属性的集成在对称约束下可能比没有对称性的协议更通用。我们的结果扩展了之前的工作 [Mitsuhashi 和 Yoshioka，PRX Quantum 4.4（11 月 12 日）\n\n2023)]表明 Clifford 群的对称设计强度严格受其对称酉设计强度的上限限制，不会使对称兼容酉微不足道。由于具有群结构的酉设计的特殊意义，我们还推导了算子形成群的有限酉系综的酉和对称设计强度的各种界限。特别是，我们提供了一个简单的证明，证明形成有限群的任意算子集合在全局现场 $\\mathrm{U}(1)$ 和 $\\mathrm{SU}(d)$ 对称性下必须具有最多为 2 的对称设计强度。在此过程中，我们证明了在任意维度上存在任意高对称设计强度的均匀加权组，并分析了它们的结构。", "authors": [{"name": "Christopher Vairogs"}, {"name": "Felix Leditzky"}], "featured_authors": [{"name": "Christopher Vairogs"}, {"name": "Felix Leditzky"}], "author_count": 2}, {"id": "2609.40231", "category": "quant-ph", "title": "A Quantum Algorithm for $st$-Transport on Flat Connection Graphs", "abstract": "We study a generalization of undirected $st$-connectivity to graphs whose edges carry quantum operations. Let $G=(V,E)$ be an undirected graph on $n$ vertices in which each edge $\\{u,v\\}$ is labeled by a unitary $U_{uv}\\in\\mathbb{C}^{k\\times k}$, with $U_{vu}=U_{uv}^\\dagger$. We assume the labels form a \\emph{flat} connection: the ordered product of labels along any path between a pair of vertices $u$ and $v$ is independent of the path. Equivalently, the connection is pure gauge, i.e., gauge-equivalent to the trivial connection; such graphs are exactly the consistent connection graphs of spectral graph theory and the noiseless instances of group synchronization. Consequently, whenever $s$ and $t$ are connected, transporting a state from $s$ to $t$ defines a unique unitary $U_s(t)$. Given states $|\\psi_s\\rangle,|\\psi_t\\rangle\\in\\mathbb{C}^k$ and an oracle that returns the neighbours of a vertex while coherently applying the corresponding edge unitaries, the \\emph{$st$-transport problem} is to decide whether $s$ and $t$ are connected and, if so, to estimate the squared overlap between $U_s(t)|\\psi_s\\rangle$ and $|\\psi_t\\rangle$ to additive error $\\varepsilon$. When $k=1$ and all labels are trivial, this is exactly undirected $st$-connectivity. We give a bounded-error quantum algorithm for $st$-transport that runs in time $\\widetilde{O}(n/\\varepsilon)$ and uses $O(\\log n+\\log k+\\log(1/\\varepsilon))$ space. We do this by designing a transducer and applying a Metropolis-Hastings reweighting to the input graph. We also prove an $\\Omega(n)$ quantum query lower bound that holds even when $s$ and $t$ are promised to be connected, so for constant $\\varepsilon$ our algorithm is optimal up to polylogarithmic factors.", "url": "https://arxiv.org/abs/2609.40231", "type": "理论+数值", "summary": "我们研究将无向 $st$ 连接推广到其边带有量子操作的图。令$G=(V,E)$为$n$个顶点上的无向图，其中每条边$\\{u,v\\}$由酉$U_{uv}\\in\\mathbb{C}^{k\\times k}$标记，其中$U_{vu}=U_{uv}^\\dagger$。我们假设标签形成 \\emph{flat} 连接：沿着一对顶点 $u$ 和 $v$ 之间的任何路径的标签的有序积与该路径无关。等效地，该连接是纯规范连接，即规范等效于平凡连接；这样的图正是谱图论的一致连接图和群同步的无噪声实例。因此，每当 $s$ 和 $t$ 连接时，将状态从 $s$ 传输到 $t$ 定义了唯一的统一 $U_s(t)$。给定状态 $|\\psi_s\\rangle,|\\psi_t\\rangle\\in\\mathbb{C}^k$ 和一个在连贯地应用相应的边酉时返回顶点邻居的预言，\\emph{$st$-传输问题} 是确定 $s$ 和 $t$ 是否连接，如果是，则估计 $U_s(t)|\\psi_s\\rangle$ 和 $U_s(t)|\\psi_s\\rangle$ 之间的平方重叠$|\\psi_t\\rangle$ 到附加误差 $\\varepsilon$。\n\n当 $k=1$ 并且所有标签都是平凡的时，这正是无向 $st$-连通性。我们给出了 $st$-传输的有界误差量子算法，该算法在 $\\widetilde{O}(n/\\varepsilon)$ 时间内运行并使用 $O(\\log n+\\log k+\\log(1/\\varepsilon))$ 空间。我们通过设计一个传感器并对输入图应用 Metropolis-Hastings 重新加权来实现这一点。我们还证明了 $\\Omega(n)$ 量子查询下界，即使在 $s$ 和 $t$ 被承诺连接时也成立，因此对于常数 $\\varepsilon$，我们的算法在多对数因子下是最优的。", "authors": [{"name": "Stacey Jeffery"}, {"name": "Tobias J. Osborne"}, {"name": "Galina Pass"}], "featured_authors": [{"name": "Stacey Jeffery"}, {"name": "Tobias J. Osborne"}, {"name": "Galina Pass"}], "author_count": 3}, {"id": "2609.40250", "category": "quant-ph", "title": "An (almost) efficient classical algorithm for sampling from typical Gibbs states", "abstract": "Gibbs state preparation has emerged as a potential avenue for quantum advantage in the study of physical systems. Although there is known advantage for computing local properties of worst-case Gibbs states, recent results suggest a different picture for average-case local systems: at temperatures where their Gibbs states can be efficiently prepared quantumly, quasi-polynomial time classical algorithms can also compute local expectation values. Yet this leaves open the possibility of an advantage under a stronger notion of simulation: sampling. Gibbs sampling underlies Boltzmann machine-based quantum learning algorithms and quantum supremacy proposals, but its classical average-case complexity for physically relevant models remains unresolved. Here, we give strong evidence against an exponential quantum advantage in Gibbs sampling for an ensemble of local systems known as the quantum $p$-spin model. We describe a classical algorithm for sampling from the Gibbs state to any polynomially small error in total variation distance. Our algorithm is based on a meta-algorithm known as algorithmic stochastic localization (ASL). Our main technical result is a generalized convergence theorem for ASL which reduces approximate sampling from any distribution on the hypercube to estimating the mean of a related \"tilted distribution\" to sufficiently low additive error. We then extend known quasi-polynomial time algorithms for computing local expectation values of a related disordered model to compute these \"tilted means\" for the quantum $p$-spin model. Finally, we give a non-rigorous physics argument that this mean-estimation algorithm works down to the spin glass transition temperature. As efficient quantum algorithms also fail at this transition, this suggests they cannot Gibbs sample the quantum $p$-spin model at temperatures below that for which classical algorithms are also (almost) efficient.", "url": "https://arxiv.org/abs/2609.40250", "type": "理论+数值", "summary": "吉布斯态准备已成为物理系统研究中量子优势的潜在途径。尽管计算最坏情况吉布斯状态的局部属性具有已知的优势，但最近的结果表明平均情况局部系统的情况不同：在可以有效量子准备吉布斯状态的温度下，准多项式时间经典算法也可以计算局部期望值。然而，这留下了在更强大的模拟概念下获得优势的可能性：采样。吉布斯采样是基于玻尔兹曼机器的量子学习算法和量子霸权建议的基础，但其物理相关模型的经典平均情况复杂性仍未得到解决。在这里，我们提供了强有力的证据，证明在称为量子 $p$-自旋模型的局部系统集合的吉布斯采样中存在指数量子优势。我们描述了一种经典算法，用于从吉布斯状态采样到总变异距离中的任何多项式小误差。我们的算法基于称为算法随机定位 (ASL) 的元算法。\n\n我们的主要技术成果是 ASL 的广义收敛定理，它将超立方体上任何分布的近似采样减少到估计相关“倾斜分布”的平均值，以达到足够低的加性误差。然后，我们扩展已知的准多项式时间算法，用于计算相关无序模型的局部期望值，以计算量子 $p$-自旋模型的这些“倾斜平均值”。最后，我们给出了一个非严格的物理论证，即该平均估计算法适用于自旋玻璃化转变温度。由于高效的量子算法在这种转变中也会失败，这表明它们无法在低于经典算法（几乎）有效的温度下对量子 $p$-自旋模型进行吉布斯采样。", "authors": [{"name": "Saleh Naghdi"}, {"name": "Eric R. Anschuetz"}], "featured_authors": [{"name": "Saleh Naghdi"}, {"name": "Eric R. Anschuetz"}], "author_count": 2}, {"id": "2609.40254", "category": "quant-ph", "title": "Quantum oblique eigenprojection", "abstract": "Every square matrix decomposes its underlying Hilbert space into generalized, nonorthogonal eigensubspaces. We show that a quantum computer can perform such an oblique eigenprojection $\\Pi$ given block encoding access to the input matrix. Our approach has a query complexity nearly linear in the inverse gap and a normalization factor close to $\\lVert\\Pi\\rVert$ under a spectral-set condition on the input. This covers common assumptions on the numerical range or diagonalizability and matches known results for orthogonal eigenprojections. We achieve this with a two-sided block preconditioning that uses a discrete Fourier transform of the matrix resolvent. We describe applications to: (i) preparing eigenstates of matrices with complex eigenvalues, extending the quantum eigenvalue transformation algorithm of Low and Su beyond real spectra; (ii) solving continuous-time algebraic Riccati equations, cubically speeding up a prior solver of Rodenas-Ruiz, Zhao, and Lee; and (iii) solving ordinary Sylvester equations, quadratically improving a direct augmented method of Wang and Liu. Our result suggests a promising route to applying nonanalytic matrix functions on quantum computers.", "url": "https://arxiv.org/abs/2609.40254", "type": "理论+数值", "summary": "每个方阵将其底层希尔伯特空间分解为广义的非正交特征子空间。我们证明，在给定对输入矩阵的块编码访问的情况下，量子计算机可以执行这样的倾斜本征投影 $\\Pi$。我们的方法的查询复杂度在逆间隙中几乎呈线性，并且在输入的频谱集条件下标准化因子接近 $\\lVert\\Pi\\rVert$。这涵盖了关于数值范围或对角化性的常见假设，并与正交特征投影的已知结果相匹配。我们通过使用矩阵解析的离散傅立叶变换的两侧块预处理来实现这一点。我们描述了以下应用：(i) 准备具有复特征值的矩阵的本征态，将 Low 和 Su 的量子特征值变换算法扩展到真实光谱之外； (ii) 求解连续时间代数 Riccati 方程，三次加速 Rodenas-Ruiz、Zhao 和 Lee 的先前求解器； (iii) 求解普通西尔维斯特方程，二次改进 Wang 和 Liu 的直接增广法。我们的结果提出了在量子计算机上应用非解析矩阵函数的一条有前途的途径。", "authors": [{"name": "Alexander M. Dalzell"}, {"name": "Yuan Su"}], "featured_authors": [{"name": "Alexander M. Dalzell"}, {"name": "Yuan Su"}], "author_count": 2}, {"id": "2609.40260", "category": "quant-ph", "title": "Quantum Algorithms for Minimum Generating Set", "abstract": "In this paper, we present a polynomial-time quantum algorithm for computing a minimum-sized generating set of solvable black-box groups. Next, we consider the class $\\Gamma_d$ of black-box groups, where every non-abelian composition factor is isomorphic to a subgroup of the symmetric group $S_d$ for a fixed $d$. We design polynomial-time quantum algorithms to compute the direct product decomposition of abelian factor groups and solve the constructive membership problem for factor groups of groups from $\\Gamma_d$. With the help of these algorithms, we design a quantum algorithm for computing a chief series of black-box groups from $\\Gamma_d$. Using the chief series, we construct a polynomial-time quantum algorithm for computing minimum generating sets of black-box groups from $\\Gamma_d$. Finally, we show that the minimum generating set problem for general black-box groups is in $\\textrm{NP} \\cap \\textrm{coAM}$.", "url": "https://arxiv.org/abs/2609.40260", "type": "数值", "summary": "在本文中，我们提出了一种多项式时间量子算法，用于计算可解黑盒群的最小生成集。接下来，我们考虑黑盒群的 $\\Gamma_d$ 类，其中对于固定的 $d$，每个非阿贝尔组合因子都同构于对称群 $S_d$ 的子群。我们设计多项式时间量子算法来计算阿贝尔因子群的直接乘积分解，并解决 $\\Gamma_d$ 中群的因子群的构造隶属度问题。在这些算法的帮助下，我们设计了一种量子算法，用于计算 $\\Gamma_d$ 中的主要一系列黑盒群。使用主级数，我们构造了一个多项式时间量子算法，用于从 $\\Gamma_d$ 计算黑盒群的最小生成集。最后，我们证明一般黑盒群的最小生成集问题在 $\\textrm{NP} \\cap \\textrm{coAM}$ 中。", "authors": [{"name": "Bireswar Das"}, {"name": "Udit Kumar"}, {"name": "Kavita Samant"}, {"name": "Dhara Thakkar"}], "featured_authors": [{"name": "Bireswar Das"}, {"name": "Udit Kumar"}, {"name": "Kavita Samant"}, {"name": "Dhara Thakkar"}], "author_count": 4}, {"id": "2609.40262", "category": "quant-ph", "title": "Quantum List Recovery and Decoding: Achievability and Limitations", "abstract": "Quantum list recovery (QLR) and quantum list decoding (QLD) seek short lists of logically distinct Pauli corrections consistent with a syndrome and prescribed error constraints. For CSS codes, two issues arise: treating the \\(X\\)- and \\(Z\\)-sectors separately can multiply their output list sizes, while distinct classical candidates can collapse after stabilizer quotienting. We study combinatorial upper and lower bounds for balanced folded quantum Reed--Solomon (FQRS) codes and balanced random CSS codes, both studied by Bergamaschi, Golowich, and Gunn (STOC 24). Let \\(R\\in(0,1)\\) be the quantum rate and \\(R_1=(1+R)/2\\) the common component rate. As the radius \\(\\rho=(1-R)/2-\\gamma\\) approaches the quantum Singleton bound, we have, deterministically for FQRS codes and w.h.p. for balanced random CSS codes, \\[ L^\\star_{\\rm QLR} = \\ell^{\\Theta(R_1/\\gamma)}, \\qquad L^\\star_{\\rm QLD} = \\Theta\\!\\left(\\frac{1-R}{\\gamma}\\right) \\qquad (\\gamma\\downarrow0). \\] The asymptotically exact QLD radius tradeoff is \\[ \\rho_L^\\star = \\frac{L}{L+1}\\frac{1-R}{2}. \\] These conclusions extend to the average-radius setting. For achievability, building on the work of Brakensiek, Chen, Dhar, and Zhang (STOC 2026), we establish a pairing lemma for joint \\(X/Z\\) candidate lists that preserves the one-sector coefficient and avoids a product loss in list size. For the QLD converse, we prove a quantum generalized Singleton bound based on the classical projection-and-patching argument with stabilizer distinctness. For the QLR lower bounds, we adapt the folded Reed--Solomon construction of Chen and Zhang (STOC 2025) so that the candidates remain stabilizer distinct. For random CSS codes, we show classical bad lists survive the stabilizer quotient with high probability.", "url": "https://arxiv.org/abs/2609.40262", "type": "理论", "summary": "量子列表恢复（QLR）和量子列表解码（QLD）寻求与综合症和规定的错误约束一致的逻辑上不同的泡利校正的短列表。对于 CSS 代码，会出现两个问题：分别处理 \\(X\\)- 和 \\(Z\\)- 扇区可能会使它们的输出列表大小成倍增加，而不同的经典候选可能会在稳定商商后崩溃。我们研究平衡折叠量子里德-所罗门 (FQRS) 码和平衡随机 CSS 码的组合上限和下限，这两者均由 Bergamaschi、Golowich 和 Gunn (STOC 24) 研究。令\\(R\\in(0,1)\\)为量子速率，\\(R_1=(1+R)/2\\)为公共分量速率。当半径 \\(\\rho=(1-R)/2-\\gamma\\) 接近量子单例边界时，对于 FQRS 代码和 w.h.p，我们有确定性。对于平衡随机 CSS 代码， \\[ L^\\star_{\\rm QLR} = \\ell^{\\Theta(R_1/\\gamma)}, \\qquad L^\\star_{\\rm QLD} = \\Theta\\!\\left(\\frac{1-R}{\\gamma}\\right) \\qquad (\\gamma\\downarrow0)。 \\] 渐进精确的 QLD 半径权衡为 \\[ \\rho_L^\\star = \\frac{L}{L+1}\\frac{1-R}{2}。 \\] 这些结论扩展到平均半径设置。\n\n为了可实现性，在 Brakensiek、Chen、Dhar 和 Zhu (STOC 2026) 的工作的基础上，我们为联合 \\(X/Z\\) 候选列表建立了一个配对引理，该引理保留了单扇区系数并避免了列表大小的乘积损失。对于 QLD 逆流，我们基于具有稳定器独特性的经典投影和修补论证证明了量子广义单例界限。对于 QLR 下界，我们采用 Chen 和 Zhang 的折叠 Reed-Solomon 结构 (STOC 2025)，以便候选者保持稳定器的独特性。对于随机 CSS 代码，我们展示了经典的坏列表在稳定商中幸存下来的概率很高。", "authors": [{"name": "Fernando Granha Jeronimo"}, {"name": "Xiaojuan Ma"}], "featured_authors": [{"name": "Fernando Granha Jeronimo"}, {"name": "Xiaojuan Ma"}], "author_count": 2}, {"id": "2609.40263", "category": "quant-ph", "title": "Superlinear Quantum Query Lower Bounds for Subgraph Detection", "abstract": "Subgraph detection asks whether an $n$-vertex graph, accessed through queries to its adjacency matrix, contains a copy of a fixed graph $H$. We prove the first unconditional superlinear lower bounds on the bounded-error quantum query complexity of this problem, answering a longstanding open question. A copy of $H$ is a certificate of constant size, so the adversary method with nonnegative weights cannot prove superlinear lower bounds. For every fixed $r\\ge 4$, detecting the clique $K_r$ requires $n^{\\lambda_r-o(1)}$ queries, where $\\lambda_4=19/18$, the exponents $\\lambda_r$ increase strictly with $r$, and $\\lambda_r\\ge 2-4\\sqrt{2/r}+O(1/r)$. More generally, we prove superlinear lower bounds for detecting every fixed connected graph $H$ with chromatic number $c\\ge 4$. These bounds approach quadratic as $c$ grows: for sufficiently large $c$, detection requires $n^{2-O(\\sqrt{\\log\\log c/c})-o(1)}$ queries. Chromatic number alone does not characterize the quantum query complexity of subgraph detection: we show that detecting the complete bipartite graph $K_{r,r}$ requires $n^{\\beta_r-o(1)}$ queries, where $\\beta_{10}=181/180$ and $\\beta_r\\ge 2-O(1/\\sqrt{r})$. Our main technical result is a lower bound for finding an all-ones certificate from a known family when the input bits are sampled independently. Its proof combines Zhandry's compressed oracle (CRYPTO 2019) with conditioning on a randomly planted certificate, adapting an argument of Belovs (FOCS 2026). Our hard instances are built from graphs containing many copies of the desired subgraph with limited overlap. For cliques, we use a construction of Gowers and Janzer (CPC 2021); for complete bipartite graphs, we use a random construction.", "url": "https://arxiv.org/abs/2609.40263", "type": "理论", "summary": "子图检测询问通过查询其邻接矩阵访问的 $n$ 顶点图是否包含固定图 $H$ 的副本。我们证明了该问题的有界误差量子查询复杂性的第一个无条件超线性下界，回答了一个长期悬而未决的问题。 $H$ 的副本是恒定大小的证书，因此具有非负权重的对抗方法无法证明超线性下界。对于每个固定的$r\\ge 4$，检测团$K_r$需要$n^{\\lambda_r-o(1)}$查询，其中$\\lambda_4=19/18$，指数$\\lambda_r$严格随$r$增加，$\\lambda_r\\ge 2-4\\sqrt{2/r}+O(1/r)$。更一般地说，我们证明了检测每个色数为 $c\\ge 4$ 的固定连通图 $H$ 的超线性下界。随着 $c$ 的增长，这些界限接近二次：对于足够大的 $c$，检测需要 $n^{2-O(\\sqrt{\\log\\log c/c})-o(1)}$ 查询。单独的色数并不能表征子图检测的量子查询复杂性：我们表明检测完整的二分图 $K_{r,r}$ 需要 $n^{\\beta_r-o(1)}$ 查询，其中 $\\beta_{10}=181/180$ 和 $\\beta_r\\ge 2-O(1/\\sqrt{r})$。\n\n我们的主要技术成果是当输入位独立采样时从已知系列中查找全一证书的下限。它的证明结合了 Zhandry 的压缩预言（CRYPTO 2019）和随机植入证书的条件，改编了 Belovs 的论点（FOCS 2026）。我们的硬实例是由包含所需子图的许多副本且重叠有限的图构建的。对于派系，我们使用 Gowers 和 Janzer (CPC 2021) 的构造；对于完整的二部图，我们使用随机构造。", "authors": [{"name": "Amin Shiraz Gilani"}, {"name": "Xingyu Zhou"}], "featured_authors": [{"name": "Amin Shiraz Gilani"}, {"name": "Xingyu Zhou"}], "author_count": 2}, {"id": "2609.40264", "category": "quant-ph", "title": "Two-Stage Quantum-Classical Distribution Network Reconfiguration via Cycle-Edge Encoding", "abstract": "Distribution network reconfiguration (DNR) is a combinatorial optimization problem that seeks a low-loss network topology subject to topological and electrical operating constraints. In this work, we propose a two-stage quantum-classical method for DNR. First, an iterative linear-ramp Quantum Alternating Operator Ansatz (LR-QAOA) searches topologically feasible subspaces constructed using a novel cycle-edge encoding. The encoding guarantees that every represented configuration is a spanning tree while allowing the size and coverage of each subspace to be adjusted to the available qubit budget. Second, the resulting sample distribution is used to guide a mixed-integer second-order-cone programming (MISOCP) solver. The method is evaluated on six distribution networks ranging from 33 to 417 buses through simulation and execution on trapped-ion quantum hardware. Across all six test systems, the MISOCP solver guided by hardware-derived distributions reaches an incumbent within 1\\% of the best-known solution in less median solver time than the corresponding unguided solver.", "url": "https://arxiv.org/abs/2609.40264", "type": "理论+数值", "summary": "配电网重构（DNR）是一个组合优化问题，寻求受拓扑和电气运行约束的低损耗网络拓扑。在这项工作中，我们提出了一种用于 DNR 的两阶段量子经典方法。首先，迭代线性斜坡量子交替算子 Ansatz (LR-QAOA) 搜索使用新颖的循环边缘编码构造的拓扑上可行的子空间。编码保证每个表示的配置都是生成树，同时允许将每个子空间的大小和覆盖范围调整为可用的量子位预算。其次，生成的样本分布用于指导混合整数二阶锥规划 (MISOCP) 求解器。通过在捕获离子量子硬件上进行模拟和执行，该方法在 33 至 417 条总线的 6 个配电网络上进行了评估。在所有六个测试系统中，由硬件派生分布引导的 MISOCP 求解器在比相应的非引导求解器更短的中值求解器时间内达到了现有最佳解决方案的 1% 以内。", "authors": [{"name": "Nowar Alashkar"}, {"name": "Cade Kennedy"}, {"name": "Phillip C. Lotshaw"}, {"name": "Shaked Regev"}, {"name": "Miguel Angel Lopez-Ruiz"}, {"name": "Ananth Kaushik"}, {"name": "Paul Smith"}, {"name": "Claudio Girotto"}, {"name": "Martin Roetteler"}], "featured_authors": [{"name": "Nowar Alashkar"}, {"name": "Cade Kennedy"}, {"name": "Phillip C. Lotshaw"}, {"name": "Paul Smith"}, {"name": "Claudio Girotto"}, {"name": "Martin Roetteler"}], "author_count": 9}, {"id": "2609.40271", "category": "quant-ph", "title": "Refined sample complexities from the tomographic rate function", "abstract": "Protocols for quantum state tomography can be characterized either by their sample complexity or by the tomographic rate function that governs the large deviation behaviour of error estimates. We establish a framework for the analysis of covariant protocols which allows us to compare these measures. First, we derive the rate functions for several protocols, including random purification-based protocols and the sample-optimal protocol of Haah et al. These rate functions are expressed in terms of a new family of divergences which includes the reverse sandwiched Rényi divergence and Keyl's annealed quantum relative entropy as special cases. We show that these rate functions obey a strict ordering, even though the sample complexity of each protocol is order optimal. We consider a different version of sample complexity based on Wasserstein distance rather than trace distance, and show that the ordering of the rate functions implies analogous strict inequalities for the Wasserstein-type sample complexity. Thus the tomographic rate function is a more fine-grained indicator of the performance of a tomography protocol than the usual sample complexity.", "url": "https://arxiv.org/abs/2609.40271", "type": "理论", "summary": "量子态层析成像协议可以通过样本复杂性或控制误差估计的大偏差行为的层析成像速率函数来表征。我们建立了一个协变协议分析框架，使我们能够比较这些措施。首先，我们推导了几种方案的速率函数，包括基于随机纯化的方案和 Haah 等人的样本最佳方案。这些速率函数用一系列新的散度来表示，其中包括作为特例的反向夹层 Rényi 散度和 Keyl 退火量子相对熵。我们证明，即使每个协议的样本复杂性是顺序最优的，这些速率函数也遵循严格的顺序。我们考虑基于 Wasserstein 距离而不是迹距离的样本复杂度的不同版本，并表明速率函数的排序意味着 Wasserstein 型样本复杂度的类似严格不等式。因此，与通常的样本复杂性相比，断层扫描速率函数是断层扫描协议性能的更细粒度的指标。", "authors": [{"name": "Arick Grootveld"}, {"name": "Alexander Maloney"}, {"name": "Jason Pollack"}, {"name": "Peixue Wu"}], "featured_authors": [{"name": "Arick Grootveld"}, {"name": "Alexander Maloney"}, {"name": "Jason Pollack"}, {"name": "Peixue Wu"}], "author_count": 4}, {"id": "2609.40277", "category": "quant-ph", "title": "Conditioning-Free Non-Uniform Quantum Fourier and Chebyshev Transforms", "abstract": "We present an efficient quantum algorithm for the non-uniform Chebyshev transform. It is defined as the projection of a function onto Chebyshev polynomials sampled at given nodes that are uniform in $x\\in[-1,1]$, and hence non-uniform in the angle $\\theta=\\arccos x$, a setting that QFT-based quantum Chebyshev transforms cannot handle. Our construction is based on an improvement of an existing Non-uniform Quantum Fourier Transform (NUQFT) whereby we remove the conditioning from non-uniform node sampling. Hence, error bounds are independent of the geometry-dependent parameter $\\kappa$ of prior work. We use the fact that Chebyshev transform matrix is the average of two Type-II non-uniform DFTs, which we implement with a single controlled NUQFT circuit. We provide explicit oracle constructions, including the row-access oracle previously left as an assumption. The resulting $\\varepsilon$-accurate block encoding has $O(1)$ normalization and uses $O(L)$ qubits and $\\widetilde O(L^2)$ gates, where $L=\\log N+\\log(1/\\varepsilon)$. We give an end-to-end implementation with complexity analysis, including the success probability and output-state error.", "url": "https://arxiv.org/abs/2609.40277", "type": "理论+数值", "summary": "我们提出了一种用于非均匀切比雪夫变换的有效量子算法。它被定义为函数到在给定节点采样的切比雪夫多项式上的投影，这些节点在 $x\\in[-1,1]$ 中均匀，因此角度 $\\theta=\\arccos x$ 不均匀，这是基于 QFT 的量子切比雪夫变换无法处理的设置。我们的构建基于现有非均匀量子傅里叶变换（NUQFT）的改进，从而消除了非均匀节点采样的条件。因此，误差范围与先前工作的几何相关参数 $\\kappa$ 无关。我们利用切比雪夫变换矩阵是两个 II 类非均匀 DFT 的平均值这一事实，我们用单个受控 NUQFT 电路实现它。我们提供显式的预言机构造，包括之前作为假设留下的行访问预言机。生成的 $\\varepsilon$ 精确块编码具有 $O(1)$ 标准化，并使用 $O(L)$ 量子位和 $\\widetilde O(L^2)$ 门，其中 $L=\\log N+\\log(1/\\varepsilon)$。我们给出了端到端的实现和复杂性分析，包括成功概率和输出状态误差。", "authors": [{"name": "Chaowen Guan"}, {"name": "Akshit Katiyar"}], "featured_authors": [{"name": "Chaowen Guan"}, {"name": "Akshit Katiyar"}], "author_count": 2}, {"id": "2609.40278", "category": "quant-ph", "title": "Computational Bounds for $f$-Routing", "abstract": "The $f$-routing protocol is a leading candidate for quantum position verification (Kent, Munro, and Spiller, 2011), but security guarantees for explicit functions remain limited. We prove unconditional resource lower bounds for uniform attackers; our new techniques bypass communication-complexity bounds central to previous works, which are inherently at most linear in the input length. We show that, for input length $n$ and sufficiently small constant $\\epsilon>0$, a uniformly generated strategy using $q$ qubits and having description length $\\mathrm{poly}(q)$, with success probability at least $1-\\epsilon$ on every input, implies the following computational bounds on $f$: 1. If the strategies are arbitrary quantum channels, then $f\\in\\mathrm{QSZK}(\\mathrm{poly}(nq))$, where $\\mathrm{QSZK}(T)$ is the class of languages having quantum statistical zero knowledge proofs in which the verifier runs in time $T$ (and the simulator in time $\\mathrm{poly}(T)$). 2. If the strategies are explicit Pauli-sparse unitaries on $q$ qubits that have at most $s$ nonzero Pauli coefficients, then $f\\in\\mathrm{DTIME}(\\mathrm{poly}(nqs))$. 3. If the strategies are Clifford+T circuits using at most $t$ magic gates, then $f\\in\\mathrm{DTIME}(\\mathrm{poly}(nq2^t))$. Time and space hierarchies then yield explicit functions secure against polynomial and even quasipolynomial qubits $q$ under our computational restrictions. These bounds exceed the $q\\le\\log n$ bound of Bluhm, Christandl, and Speelman (2022) for inner product function $f=\\mathrm{IP}$, at the cost of restricting adversarial computation and increasing honest evaluation complexity.", "url": "https://arxiv.org/abs/2609.40278", "type": "理论", "summary": "$f$ 路由协议是量子位置验证的主要候选协议（Kent、Munro 和 Spiller，2011），但显式函数的安全保证仍然有限。我们证明了统一攻击者的无条件资源下限；我们的新技术绕过了先前工作的核心通信复杂性界限，这些工作本质上在输入长度上最多是线性的。我们证明，对于输入长度 $n$ 和足够小的常数 $\\epsilon>0$，使用 $q$ 量子位并具有描述长度 $\\mathrm{poly}(q)$ 的均匀生成策略，每个输入的成功概率至少为 $1-\\epsilon$，意味着 $f$ 上的计算范围如下： 1. 如果策略是任意量子通道，则$f\\in\\mathrm{QSZK}(\\mathrm{poly}(nq))$，其中 $\\mathrm{QSZK}(T)$ 是具有量子统计零知识证明的语言类别，其中验证器在时间 $T$ 中运行（模拟器在时间 $\\mathrm{poly}(T)$ 中运行）。 2. 如果策略是 $q$ 量子位上的显式泡利稀疏幺正，且最多具有 $s$ 个非零泡利系数，则 $f\\in\\mathrm{DTIME}(\\mathrm{poly}(nqs))$。 3.\n\n如果策略是 Clifford+T 电路，最多使用 $t$ 魔法门，则 $f\\in\\mathrm{DTIME}(\\mathrm{poly}(nq2^t))$。然后，在我们的计算限制下，时间和空间层次结构会产生针对多项式甚至拟多项式量子位 $q$ 安全的显式函数。这些界限超出了 Bluhm、Christandl 和 Speelman (2022) 的内积函数 $f=\\mathrm{IP}$ 的 $q\\le\\log n$ 界限，但代价是限制对抗性计算并增加诚实评估的复杂性。", "authors": [{"name": "Oren Renard"}, {"name": "Nicholas Spooner"}], "featured_authors": [{"name": "Oren Renard"}, {"name": "Nicholas Spooner"}], "author_count": 2}, {"id": "2609.40279", "category": "quant-ph", "title": "Classical simulation of coherent crosstalk in surface codes", "abstract": "We give a polynomial-time classical algorithm which samples from the syndrome distribution of a surface code state corrupted by coherent nearest-neighbor $ZZ$ crosstalk. Our algorithm complements the known efficient simulation algorithms for coherent single-qubit errors in the surface code. When both single-qubit coherent noise and coherent crosstalk are present, we find a complexity-theoretic obstruction to efficient simulation: unless the polynomial hierarchy collapses, there is no efficient classical algorithm for sampling from the syndrome distribution, even up to a constant multiplicative error. This is obtained by connecting the syndrome distribution under coherent noise to the output distribution of certain IQP circuits associated with a non-planar graph.", "url": "https://arxiv.org/abs/2609.40279", "type": "数值", "summary": "我们给出了一种多项式时间经典算法，该算法从被相干最近邻 $ZZ$ 串扰破坏的表面代码状态的校正子分布中进行采样。我们的算法补充了表面代码中相干单量子位错误的已知有效模拟算法。当单量子位相干噪声和相干串扰同时存在时，我们发现了有效模拟的复杂性理论障碍：除非多项式层次结构崩溃，否则没有有效的经典算法来从校正子分布中采样，甚至达到恒定的乘法误差。这是通过将相干噪声下的校正子分布连接到与非平面图相关的某些 IQP 电路的输出分布来获得的。", "authors": [{"name": "Andrew S. Darmawan"}, {"name": "Yelyzaveta Kolesnyk"}, {"name": "Robert Koenig"}], "featured_authors": [{"name": "Andrew S. Darmawan"}, {"name": "Yelyzaveta Kolesnyk"}, {"name": "Robert Koenig"}], "author_count": 3}, {"id": "2609.40289", "category": "quant-ph", "title": "Verifiable Quantum Advantage and Computation via Quantum Circuit Obfuscation", "abstract": "We construct protocols for classically verifiable quantum advantage and classical verification of $\\mathsf{BQP}$ computations using \\emph{quantum indistinguishability obfuscation} (qiO). Specifically, given qiO and assuming a slightly stronger version of $\\mathsf{BQP}\\neq\\mathsf{BPP}$, we construct a two-message quantum-advantage protocol that is efficiently and publicly verifiable. Our result can be viewed as a rigorous cryptographic foundation for the heuristic quantum advantage proposals based on \\emph{peaked random circuit sampling} of Aaronson and Zhang ( arXiv:2404.14493 ). We also construct two simple protocols for classically verifying arbitrary $\\mathsf{BQP}$ computations. The first protocol is privately verifiable and assumes only the existence of qiO. This gives a rare example of a nontrivial cryptographic application of (quantum) iO that does not make additional computational hardness assumptions. The second protocol additionally assumes post-quantum one-way functions and is \\emph{publicly verifiable}. To our knowledge, this is the first publicly verifiable protocol for classical verification of $\\mathsf{BQP}$ computations under computational assumptions in the standard model. We show that all our results hold when qiO is assumed only for ancilla-free unitary circuits. As evidence supporting this assumption, we prove a worst-to-average-case reduction for obfuscating such circuits. This reduction extends the local-mixing framework of Canetti, Chamon, Mucciolo and Ruckenstein (TCC 2024) under quantum analogues of their assumptions.", "url": "https://arxiv.org/abs/2609.40289", "type": "理论", "summary": "我们使用 \\emph{量子不可区分性混淆} (qiO) 构建了可经典验证的量子优势和 $\\mathsf{BQP}$ 计算的经典验证协议。具体来说，给定 qiO 并假设 $\\mathsf{BQP}\\neq\\mathsf{BPP}$ 的稍强版本，我们构建了一个可有效且可公开验证的双消息量子优势协议。我们的结果可以被视为基于 Aaronson 和 Zhang 的 emph{峰值随机电路采样} ( arXiv:2404.14493 ) 的启发式量子优势建议的严格密码学基础。我们还构建了两个简单的协议来经典地验证任意 $\\mathsf{BQP}$ 计算。第一个协议是可私下验证的，并且仅假设 qiO 存在。这给出了（量子）iO 的重要加密应用的罕见示例，该应用没有做出额外的计算难度假设。第二个协议另外假设后量子单向功能并且是\\emph{可公开验证的}。\n\n据我们所知，这是第一个可公开验证的协议，用于在标准模型的计算假设下对 $\\mathsf{BQP}$ 计算进行经典验证。我们证明，当假设 qiO 仅适用于无辅助酉电路时，我们所有的结果都成立。作为支持这一假设的证据，我们证明了混淆此类电路的最坏到平均情况的减少。这种简化扩展了 Canetti、Chamon、Mucciolo 和 Ruckenstein (TCC 2024) 在其假设的量子模拟下的局部混合框架。", "authors": [{"name": "Alexandru Gheorghiu"}, {"name": "Aparna Gupte"}, {"name": "Vojtěch Havlíček"}, {"name": "Yunchao Liu"}], "featured_authors": [{"name": "Alexandru Gheorghiu"}, {"name": "Aparna Gupte"}, {"name": "Vojtěch Havlíček"}, {"name": "Yunchao Liu"}], "author_count": 4}, {"id": "2609.40301", "category": "quant-ph", "title": "Need for Coherent Access in Constructing Quantum Cryptography", "abstract": "We construct quantum oracles relative to which quantum-secure one-way functions (OWFs) exist but pseudorandom states (PRSs) with superlogarithmic output length do not. At first glance, this appears to contradict the known black-box constructions of PRS generators from quantum-secure OWFs. The distinction lies in the access model to the oracles; our oracle separation uses \\emph{classical-accessible} random oracles that can be accessed only classically even by quantum algorithms. In fact, our impossibility of PRSs applies to \\emph{any} classically accessible classical oracle in place of the random oracle, while keeping the other oracle component unchanged, showing the need for coherent access in constructing PRSs. We further show that logarithmic output length pseudorandom function-like states (PRFSs) exist relative to our oracles, giving an oracle separation between classically accessible logarithmic length PRFSs and superlogarithmic length PRSs. This shows that fully black-box PRS length extension from logarithmic to superlogarithmic output length must use coherent access to the underlying short PRS.", "url": "https://arxiv.org/abs/2609.40301", "type": "理论+数值", "summary": "我们构建了量子预言机，相对于此，量子安全单向函数（OWF）存在，但具有超对数输出长度的伪随机态（PRS）不存在。乍一看，这似乎与量子安全 OWF 的 PRS 生成器的已知黑盒结构相矛盾。区别在于预言机的访问模型；我们的预言机分离使用 \\emph{classical-accessible} 随机预言机，即使通过量子算法也只能通过经典方式访问。事实上，我们的 PRS 的不可能性适用于 \\emph{any} 经典可访问的经典预言来代替随机预言，同时保持其他预言组件不变，这表明在构建 PRS 时需要一致访问。我们进一步表明，对数输出长度类伪随机函数状态（PRFS）相对于我们的预言机而存在，从而在经典可访问的对数长度 PRFS 和超对数长度 PRS 之间给出了预言机分离。这表明从对数到超对数输出长度的完全黑盒 PRS 长度扩展必须使用对底层短 PRS 的相干访问。", "authors": [{"name": "Minki Hhan"}, {"name": "Changhun Oh"}, {"name": "Vaughn Sohn"}], "featured_authors": [{"name": "Minki Hhan"}, {"name": "Changhun Oh"}, {"name": "Vaughn Sohn"}], "author_count": 3}, {"id": "2609.40302", "category": "quant-ph", "title": "Solving Sparse SDPs in Sublinear Time: A Classical Algorithm Inspired by the Quantum OR Lemma", "abstract": "We give the first sublinear-time classical solvers for sparse semidefinite programs in the bounded-radius regime, without low-rank assumptions or Frobenius norm dependence on the constraint matrices. For constant precision and bounded primal and dual radii, prior quantum algorithms of Brandão et al. (2019) and van Apeldoorn and Gilyén (2019) achieved $\\widetilde{O}(\\sqrt{n}+\\sqrt{m})$ dependence on matrix dimension $n$ and constraint number $m$. Compared with the $\\widetilde{O}(mn)$ runtime of existing classical methods, this suggests a quartic quantum speedup when $m \\approx n$. Beyond a usual Grover speedup, this separation relies on the Quantum OR lemma, whose sample-reuse mechanism decouples the cost of Gibbs-state preparation from constraint search. We show that this reuse mechanism is classically realizable for sparse SDPs. Our main technical contribution is a classical procedure for simultaneously estimating many expectation values with respect to a sparse Hamiltonian's Gibbs state. This combines randomized Lánczos filtering with an efficient sampling-based estimator. We also introduce a stochastic online-learning framework for SDP solving, substantially improving accuracy-dependence over standard oracle-based MMWU approaches. Let $s$ denote the the input matrix sparsity and $\\gamma:=Rr/\\varepsilon$ capture dependence on the primal $(R)$ and dual $(r)$ radii as well as target accuracy $(\\varepsilon)$. When $\\gamma^2\\leq\\min\\{m,n/s\\}$, our solver runs in time $\\widetilde{O}\\left(ns\\gamma^{4.5}+ms\\gamma^2\\right)$. For $\\gamma=O(1)$, this is $\\widetilde{O}\\left((n+m)s\\right)$ and sublinear in the $O(mns)$ input size. Similar to the quantum algorithms, this matches known lower bounds with respect to $m$ and $n$, up to logarithmic factors. This implies that, with respect to dimensions $m$ and $n$, there is no super-quadratic quantum advantage for generic sparse SDP solving.", "url": "https://arxiv.org/abs/2609.40302", "type": "理论+数值", "summary": "我们给出了有界半径范围内稀疏半定规划的第一个亚线性时间经典求解器，没有低秩假设或对约束矩阵的 Frobenius 范数依赖性。对于恒定精度和有界原始半径和双半径，Brandão 等人的先前量子算法。 (2019) 以及 van Apeldoorn 和 Gilyén (2019) 实现了 $\\widetilde{O}(\\sqrt{n}+\\sqrt{m})$ 对矩阵维度 $n$ 和约束数 $m$ 的依赖。与现有经典方法的 $\\widetilde{O}(mn)$ 运行时相比，这表明当 $m \\approx n$ 时有四次量子加速。除了通常的 Grover 加速之外，这种分离还依赖于量子 OR 引理，其样本重用机制将吉布斯状态准备的成本与约束搜索分离。我们证明这种重用机制对于稀疏 SDP 来说通常是可以实现的。我们的主要技术贡献是一种经典程序，用于同时估计稀疏哈密顿量吉布斯状态的许多期望值。这将随机 Lánczos 过滤与基于采样的高效估计器相结合。\n\n我们还引入了用于 SDP 求解的随机在线学习框架，与基于标准预言机的 MMWU 方法相比，大大提高了准确性依赖性。令 $s$ 表示输入矩阵稀疏性，$\\gamma:=Rr/\\varepsilon$ 捕获对原始 $(R)$ 和对偶 $(r)$ 半径以及目标精度 $(\\varepsilon)$ 的依赖性。当$\\gamma^2\\leq\\min\\{m,n/s\\}$时，我们的求解器运行时间为$\\widetilde{O}\\left(ns\\gamma^{4.5}+ms\\gamma^2\\right)$。对于 $\\gamma=O(1)$，这是 $\\widetilde{O}\\left((n+m)s\\right)$ 并且在 $O(mns)$ 输入大小中是次线性的。与量子算法类似，这与 $m$ 和 $n$ 的已知下限匹配，最高可达对数因子。这意味着，对于维度 $m$ 和 $n$，通用稀疏 SDP 求解不存在超二次量子优势。", "authors": [{"name": "Fernando G.S.L. Brandão"}, {"name": "Alexander M. Dalzell"}, {"name": "András Gilyén"}, {"name": "Francisca Vasconcelos"}], "featured_authors": [{"name": "Fernando G.S.L. Brandão"}, {"name": "Alexander M. Dalzell"}, {"name": "András Gilyén"}, {"name": "Francisca Vasconcelos"}], "author_count": 4}, {"id": "2609.40309", "category": "quant-ph", "title": "Decoupling of the QAOA into independent spin-boson systems and high-depth performance on pure and mixed spin glasses", "abstract": "The Quantum Approximate Optimization Algorithm (QAOA) is regarded as a promising candidate for near-term quantum advantage in combinatorial optimization, yet our ability to study it at scale is limited. Exact recursive formulas have been introduced for predicting QAOA performance on large spin glasses, but the computational cost of evaluating them grows exponentially with the number of QAOA layers, preventing the study of QAOA in the promising high-depth regime. In this work, we show that for the task of computing QAOA energy on any mixed dense spin glass problem, spins approximately decouple into independent spin-boson systems. In the infinite-size limit, the decoupling becomes exact, establishing the spin-boson mapping as a natural framework for the many-body physics of QAOA. This generalized spin-boson mapping gives a recursive procedure for computing QAOA energies that can be executed at modest cost using tensor networks. As a numerical application, we optimize QAOA on pure and mixed spin glasses at depths intractable for prior techniques, observing that higher-degree problems require more layers for a comparable approximation ratio while angle optimization becomes more challenging. While decoupling enables the evaluations of QAOA energies at large size and depth, it does not enable strong simulation of QAOA; a quantum computer is required to sample the bitstring corresponding to the predicted energy.", "url": "https://arxiv.org/abs/2609.40309", "type": "理论+数值", "summary": "量子近似优化算法（QAOA）被认为是组合优化中近期量子优势的有希望的候选者，但我们大规模研究它的能力是有限的。精确的递归公式已经被引入来预测大型自旋玻璃上的 QAOA 性能，但是评估它们的计算成本随着 QAOA 层数呈指数增长，从而阻碍了在有前途的高深度体系中对 QAOA 的研究。在这项工作中，我们表明，对于在任何混合致密自旋玻璃问题上计算 QAOA 能量的任务，自旋近似解耦为独立的自旋玻色子系统。在无限尺寸限制下，解耦变得精确，将自旋玻色子映射建立为 QAOA 多体物理的自然框架。这种广义的自旋玻色子映射提供了计算 QAOA 能量的递归过程，可以使用张量网络以适度的成本执行。\n\n作为数值应用，我们在纯自旋玻璃和混合自旋玻璃上以现有技术难以处理的深度优化 QAOA，观察到更高阶的问题需要更多层才能实现可比的近似比，而角度优化变得更具挑战性。虽然解耦可以在大尺寸和深度上评估 QAOA 能量，但它无法对 QAOA 进行强模拟；需要量子计算机对与预测能量相对应的比特串进行采样。", "authors": [{"name": "Sami Boulebnane"}, {"name": "Abid Khan"}, {"name": "Pragna Subrahmanya"}, {"name": "Dylan Herman"}, {"name": "Edward Farhi"}, {"name": "Benjamin Villalonga"}, {"name": "Ruslan Shaydulin"}], "featured_authors": [{"name": "Sami Boulebnane"}, {"name": "Abid Khan"}, {"name": "Pragna Subrahmanya"}, {"name": "Edward Farhi"}, {"name": "Benjamin Villalonga"}, {"name": "Ruslan Shaydulin"}], "author_count": 7}, {"id": "2609.40313", "category": "quant-ph", "title": "Explicit Capacity-Achieving Quantum LDPC Codes List Decodable in Near-linear Time", "abstract": "In classical coding theory, the quest for explicit codes achieving list decoding capacity has been an important driving force. While random codes are easily shown to achieve capacity, an explicit construction was only discovered decades later in the seminal work [Guruswami and Rudra, STOC 2006]. In quantum coding theory, it is highly desirable that a code family be LDPC. While good quantum codes were known for decades, obtaining the additional LDPC property was elusive. In fact, only very recently that good quantum LDPC codes were discovered in a breakthrough work [Panteleev and Kalachev, STOC 2022]. In this context, a natural question is to ask for an explicit family of quantum codes achieving list decoding capacity while also possessing the important LDPC property. In this work, we provide (to the best of our knowledge) the first explicit constructions of quantum LDPC codes achieving list decoding capacity, namely, with a list decoding radius approaching the quantum Singleton bound with constant list sizes. Furthermore, we provide near-linear time (in the block-length) list decoding algorithms approaching capacity. Our explicit code construction are based on expander graphs via the quantum analogue of Alon-Edmonds-Luby (AEL) amplification [Bergamaschi, Golowich and Gunn, STOC 2024], and this enables the important LDPC property. Our efficient list decoding algorithms are obtained by generalizing the classical expander-based weak-regularity list decoding algorithms [Srivastava and Tulsiani, FOCS 2025] [Jeronimo and Singh, 2025] to suitable instantiations of quantum AEL.", "url": "https://arxiv.org/abs/2609.40313", "type": "理论+数值", "summary": "在经典编码理论中，寻求实现列表解码能力的显式编码一直是一个重要的驱动力。虽然随机代码很容易被证明可以实现容量，但直到几十年后才在开创性的工作中发现了明确的构造[Guruswami 和 Rudra，STOC 2006]。在量子编码理论中，非常希望码族是LDPC。虽然良好的量子码已为人所知数十年，但获得额外的 LDPC 属性却难以实现。事实上，直到最近，在一项突破性工作中才发现了良好的量子 LDPC 码 [Panteleev 和 Kalachev，STOC 2022]。在这种情况下，一个自然的问题是要求一个显式的量子码族实现列表解码能力，同时还拥有重要的 LDPC 属性。在这项工作中，我们（据我们所知）提供了第一个实现列表解码能力的量子 LDPC 码的显式构造，即列表解码半径接近具有恒定列表大小的量子单例边界。此外，我们提供接近容量的近线性时间（在块长度中）列表解码算法。\n\n我们的显式代码构造基于通过 Alon-Edmonds-Luby (AEL) 放大的量子模拟的扩展图 [Bergamaschi, Golowich 和 Gunn, STOC 2024]，这实现了重要的 LDPC 属性。我们的高效列表解码算法是通过将经典的基于扩展器的弱正则性列表解码算法 [Srivastava 和 Tulsiani, FOCS 2025] [Jeronimo 和 Singh, 2025] 推广到合适的量子 AEL 实例来获得的。", "authors": [{"name": "William Gay"}, {"name": "Fernando Granha Jeronimo"}, {"name": "Abhi Shukul"}], "featured_authors": [{"name": "William Gay"}, {"name": "Fernando Granha Jeronimo"}, {"name": "Abhi Shukul"}], "author_count": 3}, {"id": "2609.40314", "category": "quant-ph", "title": "Quantum Sampling of Random Spanning Trees via Amortized Data Structures", "abstract": "We present a quantum algorithm that generates a uniform superposition over the spanning trees of a graph -- also known as a q-sample -- using only a sub-linear number of queries to the graph. This goes beyond previous work that focuses on generating classical samples, including a recent quantum algorithm by Apers, Gao, Ji, and Liu [ICALP 2025]. For an $n$-vertex, $m$-edge graph, our algorithm admits a pre-processing step of $\\tilde{O}(\\sqrt{mn} + m^{1-\\delta})$, after which each q-sample can be generated in $\\tilde{O}(n^{1+2\\delta})$ for any $\\delta$. Alternatively, $k$ independent q-samples can be generated at a total cost of $\\tilde{O}(\\sqrt{kmn})$. We also prove a matching lower bound up to logarithmic factors, showing that our algorithm is essentially optimal. Further tradeoffs are given in the paper. In comparison, the optimal classical algorithms (Anari, Liu and Vuong [FOCS 2022]) need an $\\tilde{O}(m)$ pre-processing step, after which each sample costs $\\tilde{O}(n)$ operations. These results yield faster quantum walk-based algorithms for counting spanning trees or finding a marked one. Our result is obtained via quantum walk sampling over a sequence of slowly-changing Markov chains. Each chain is an isotropized up-down walk that mixes rapidly to the spanning tree distribution of the input graph. A key ingredient is an amortized data structure supporting fast implementation of the associated quantum walk operators throughout the sequence. This data structure maintains access to a spectral sparsifier and a leverage score sampler that evolve with the underlying graph.", "url": "https://arxiv.org/abs/2609.40314", "type": "理论+数值", "summary": "我们提出了一种量子算法，它仅使用对图的次线性数量的查询，在图的生成树上生成均匀的叠加（也称为 q 样本）。这超出了之前专注于生成经典样本的工作，包括 Apers、Gao、Ji 和 Liu 最近提出的量子算法 [ICALP 2025]。对于 $n$ 个顶点、$m$ 个边的图，我们的算法允许 $\\tilde{O}(\\sqrt{mn} + m^{1-\\delta})$ 的预处理步骤，之后可以在 $\\tilde{O}(n^{1+2\\delta})$ 中为任何 $\\delta$ 生成每个 q 样本。或者，可以以 $\\tilde{O}(\\sqrt{kmn})$ 的总成本生成 $k$ 个独立 q 样本。我们还证明了对数因子的匹配下限，表明我们的算法本质上是最优的。论文中给出了进一步的权衡。相比之下，最佳经典算法（Anari、Liu 和 Vuong [FOCS 2022]）需要 $\\tilde{O}(m)$ 预处理步骤，之后每个样本都需要 $\\tilde{O}(n)$ 操作。这些结果产生了更快的基于量子行走的算法，用于计算生成树或找到标记的树。\n\n我们的结果是通过对一系列缓慢变化的马尔可夫链进行量子行走采样而获得的。每条链都是各向同性的上下行走，快速混合到输入图的生成树分布。一个关键要素是支持在整个序列中快速实现相关量子行走算子的摊销数据结构。该数据结构维护对随底层图一起演化的谱稀疏器和杠杆分数采样器的访问。", "authors": [{"name": "Yassine Hamoudi"}, {"name": "Adrian Tanasa"}, {"name": "Shrinidhi Teganahally Sridhara"}], "featured_authors": [{"name": "Yassine Hamoudi"}, {"name": "Adrian Tanasa"}, {"name": "Shrinidhi Teganahally Sridhara"}], "author_count": 3}, {"id": "2609.40321", "category": "quant-ph", "title": "Exponential quantum speedup for $\\mathbb{F}_3^n$-Subset-Sum? Or, rigorous classical algorithms for Binary-Error LWE", "abstract": "We study vector subset sum over $\\mathbb{F}_3^n$: given $m$ random vectors from $\\mathbb{F}_3^n$, find a nonempty subset that sums to zero; the smaller $m$, the more difficult it is to find such a subset. Chen, Liu, and Zhandry (EUROCRYPT'22) introduced an efficient quantum algorithm that solves this problem when $m\\approx n^2/2$, where a naive classical algorithm would require exponential time. Subsequently, Kothari, O'Donnell, and Wu (STOC'2026) gave an efficient classical algorithm that only requires $m \\approx n^2/3$ vectors, thus removing the hope for an exponential quantum advantage in this parameter regime. Using the framework of Chen, Liu, and Zhandry, we give quantum algorithms that require much fewer input vectors, renewing the possibility of an exponential quantum speedup: for any fixed $\\epsilon>0$, our quantum algorithm solves $\\mathbb{F}_3$-subset sum in polynomial time with $m=\\epsilon\\cdot n^2$ vectors. More generally, we establish a full sample--time tradeoff that interpolates between exponential and polynomial runtime. The main ingredient is a deterministic classical algorithm for the binary-error Learning-with-Errors problem, which is of independent cryptographic interest. For this, we rigorously establish a sample--time tradeoff that was predicted by earlier algebraic heuristics. For vector subset sums over larger fields, we also significantly improve classical algorithms in Kothari, O'Donnell, and Wu (STOC'2026).", "url": "https://arxiv.org/abs/2609.40321", "type": "数值", "summary": "我们研究 $\\mathbb{F}_3^n$ 上的向量子集和：给定 $\\mathbb{F}_3^n$ 中的 $m$ 个随机向量，找到一个总和为零的非空子集； $m$越小，找到这样的子集就越困难。 Chen、Liu 和 Zhandry (EUROCRYPT'22) 引入了一种高效的量子算法，可以在 $m\\approx n^2/2$ 时解决这个问题，而简单的经典算法需要指数时间。随后，Kothari、O'Donnell 和 Wu (STOC'2026) 给出了一种高效的经典算法，仅需要 $m \\approx n^2/3$ 向量，从而消除了在此参数范围内获得指数量子优势的希望。使用 Chen、Liu 和 Zhandry 的框架，我们给出了需要更少输入向量的量子算法，更新了指数量子加速的可能性：对于任何固定的 $\\epsilon>0$，我们的量子算法使用 $m=\\epsilon\\cdot n^2$ 向量在多项式时间内求解 $\\mathbb{F}_3$-子集和。更一般地说，我们建立了一个完整的样本时间权衡，在指数运行时间和多项式运行时间之间进行插值。\n\n主要成分是用于二元错误学习问题的确定性经典算法，该算法具有独立的密码学兴趣。为此，我们严格建立了早期代数启发法所预测的样本时间权衡。对于较大域上的向量子集和，我们还显着改进了 Kothari、O'Donnell 和 Wu 的经典算法 (STOC'2026)。", "authors": [{"name": "Robin Kothari"}, {"name": "Tony Metger"}, {"name": "Ryan O'Donnell"}, {"name": "Noah Shutty"}, {"name": "Kewen Wu"}], "featured_authors": [{"name": "Robin Kothari"}, {"name": "Tony Metger"}, {"name": "Ryan O'Donnell"}, {"name": "Noah Shutty"}, {"name": "Kewen Wu"}], "author_count": 5}, {"id": "2609.40323", "category": "quant-ph", "title": "Computational Work Extraction: The Complexity of Catalysts", "abstract": "We prove maximal separations: $n$-qubit systems can have $\\Theta(n)$ ergotropy, while every efficient process extracts negligible work, even for Hamiltonians consisting of single-qubit terms. We establish an unconditional existential separation and give an explicit construction in the random oracle model. Assuming the existence of quantum-secure pseudorandom functions, this separation extends to the plain model. This work uncovers an important connection between ergotropy and the complexity of catalytic computation---computation where auxiliary qubits must be finally restored to their initial state. Relative to a random oracle, we establish relational and decision problems that: (i) can be solved efficiently with $\\lambda$ catalysts; but (ii) cannot be solved by any algorithm with $c\\lambda$ catalysts, for any $c<1$. We show this by proving query lower bounds for quantum-space bounded algorithms. As a consequence, for computational ergotropy, catalysts prove to be surprisingly powerful---there is a family of Hamiltonians and states for which catalysts enable efficient extraction of the full $\\Theta(n)$ ergotropy, while every efficient non-catalytic process extracts negligible work. Furthermore, catalysts also allow us to introduce and instantiate the notion of pseudoergotropy---analogous to pseudorandomness. On the other hand, we show catalysts do not change (information-theoretic) ergotropy. Finally, our work also sheds light on the classical aspect of the problem. First, most of our constructions rely on classical states and Hamiltonians and therefore imply analogous results for classical ergotropy. Second, we show that certain proof of quantumness protocols can be used to generically separate classical and quantum catalytic ergotropy.", "url": "https://arxiv.org/abs/2609.40323", "type": "理论+数值", "summary": "我们证明了最大分离：$n$-量子位系统可以具有 $\\Theta(n)$ 各向异性，而每个有效过程提取的工作可以忽略不计，即使对于由单量子位项组成的哈密顿量也是如此。我们建立了无条件存在分离并在随机预言模型中给出了显式构造。假设存在量子安全伪随机函数，这种分离扩展到简单模型。这项工作揭示了各向异性与催化计算的复杂性之间的重要联系——辅助量子位必须最终恢复到其初始状态的计算。相对于随机预言，我们建立了关系和决策问题：（i）可以使用 $\\lambda$ 催化剂有效解决；但 (ii) 对于任何 $c<1$ 来说，任何具有 $c\\lambda$ 催化剂的算法都无法求解。我们通过证明量子空间有界算法的查询下界来证明这一点。因此，对于计算的各向异性，催化剂被证明具有惊人的强大作用——存在一系列哈密顿量和状态，催化剂能够有效地提取完整的 $\\Theta(n)$ 各向异性，而每个有效的非催化过程提取的功可以忽略不计。\n\n此外，催化剂还允许我们引入并实例化伪顺向性的概念——类似于伪随机性。另一方面，我们证明催化剂不会改变（信息论）历向性。最后，我们的工作还阐明了该问题的经典方面。首先，我们的大多数构造都依赖于经典态和哈密顿量，因此意味着经典各向异性的类似结果。其次，我们证明了某些量子性证明协议可用于一般性地分离经典和量子催化各向异性。", "authors": [{"name": "Atul Singh Arora"}, {"name": "Shantanav Chakraborty"}, {"name": "Alexandru Cojocaru"}, {"name": "Sreyas Saminathan"}, {"name": "Uttam Singh"}], "featured_authors": [{"name": "Atul Singh Arora"}, {"name": "Shantanav Chakraborty"}, {"name": "Alexandru Cojocaru"}, {"name": "Sreyas Saminathan"}, {"name": "Uttam Singh"}], "author_count": 5}, {"id": "2609.40327", "category": "quant-ph", "title": "Quantum Enhanced Deep Reinforcement Learning for Distribution Network Reconfiguration", "abstract": "Modern smart grids generate increasingly rich operational data and deploy greater numbers of remotely controlled switching assets than ever before, creating new opportunities for data-driven distribution network reconfiguration (DNR). DNR optimizes grid topology to improve efficiency, reduce power losses, and maintain operational constraints, but finding optimal switch configurations remains a computationally demanding combinatorial problem. In this paper, we propose a deep reinforcement learning (DRL) framework for static DNR to systematically investigate how the Q-network architecture affects both solution quality and learning performance. We evaluate multiple architectures within a controlled DRL framework, varying only the Q-network to isolate the contribution of each architectural choice. Our results show that quantum-enhanced Q-networks can achieve higher rewards with fewer parameters than their classical counterpart, suggesting that such architectures are a promising direction for combinatorial power systems optimization.", "url": "https://arxiv.org/abs/2609.40327", "type": "数值", "summary": "现代智能电网产生越来越丰富的运营数据，并部署比以往更多的远程控制开关资产，为数据驱动的配电网重新配置（DNR）创造了新的机会。 DNR 优化电网拓扑以提高效率、减少功率损耗并保持运行约束，但寻找最佳开关配置仍然是一个计算要求较高的组合问题。在本文中，我们提出了一种用于静态 DNR 的深度强化学习 (DRL) 框架，以系统地研究 Q 网络架构如何影响解决方案质量和学习性能。我们在受控 DRL 框架内评估多个架构，仅改变 Q 网络以隔离每个架构选择的贡献。我们的结果表明，与经典网络相比，量子增强 Q 网络可以用更少的参数获得更高的回报，这表明这种架构是组合电力系统优化的一个有前途的方向。", "authors": [{"name": "Daniel Germain"}, {"name": "Mason Blanchard"}, {"name": "Audrey Versteegen"}, {"name": "Nora Bauer"}, {"name": "Jonathan Mei"}, {"name": "Claudio Girotto"}, {"name": "Paul Smith"}, {"name": "Martin Roetteler"}], "featured_authors": [{"name": "Daniel Germain"}, {"name": "Mason Blanchard"}, {"name": "Audrey Versteegen"}, {"name": "Claudio Girotto"}, {"name": "Paul Smith"}, {"name": "Martin Roetteler"}], "author_count": 8}, {"id": "2609.40328", "category": "quant-ph", "title": "Bath-assisted cooling without resets", "abstract": "Cooling an arbitrary mixed state to a pure ground state requires transferring its entropy to an environment. Can a single coherent bath contact accomplish this without repeated bath resets? We develop a new cooling mechanism that transfers the input information into bath degrees of freedom that subsequently decouple, while the system and the remaining bath follow a ground-state path. The bath is discarded only at the end, and the system Hamiltonian remains on and unmodified throughout. We rigorously realize this mechanism for a class of weakly interacting, gapped fermionic systems with local interactions. Starting from any mixed state, our protocol prepares the interacting ground state in total physical time polylogarithmic in the system size and inverse global trace-norm error. It uses two initially empty bath modes per system mode and a single pulse shared across all onsite system--bath couplings. The same pulse prepares each admissible system's own ground state without knowledge of its microscopic parameters. The guarantees follow directly from a non-Markovian system--bath dynamics without an effective Lindbladian description.", "url": "https://arxiv.org/abs/2609.40328", "type": "理论", "summary": "将任意混合态冷却到纯基态需要将其熵转移到环境中。单一连贯的浴槽接触能否在不重复浴槽重置的情况下实现这一目标？我们开发了一种新的冷却机制，将输入信息传递到随后解耦的浴自由度，而系统和剩余浴遵循基态路径。浴液仅在最后被丢弃，并且系统哈密顿量始终保持开启且未修改。我们针对一类具有局域相互作用的弱相互作用、有隙费米子系统严格地实现了这种机制。从任何混合状态开始，我们的协议以系统大小的总物理时间多对数和逆全局迹范数误差准备相互作用的基态。它为每个系统模式使用两个最初为空的浴槽模式，并在所有现场系统（浴槽耦合）之间共享一个脉冲。相同的脉冲准备每个允许系统自己的基态，而无需了解其微观参数。这些保证直接来自非马尔可夫系统——没有有效的林布拉德描述的浴动力学。", "authors": [{"name": "Xie-Hang Yu"}, {"name": "Zherui Chen"}, {"name": "Lin Lin"}], "featured_authors": [{"name": "Xie-Hang Yu"}, {"name": "Zherui Chen"}, {"name": "Lin Lin"}], "author_count": 3}, {"id": "2609.40331", "category": "quant-ph", "title": "Fast Quantum Algorithms for Learning Linear Threshold Functions", "abstract": "Linear threshold functions are $f_{w,\\theta}(x)=\\text{sign}(\\langle x,w \\rangle -\\theta)$, where the weight vector $w\\in\\mathbb{R}^n$ is a unit vector, $\\theta\\in\\mathbb R$ is a threshold, and typically $x\\in\\mathbb{R}^n$ or $x\\in\\{-1,1\\}^n$. When $\\theta=0$, the LTF is called homogeneous, and we write $f_w:=f_{w,0}$. Such functions are among the most important objects in machine learning, since they serve to linearly discriminate positive and negative examples. We give three positive results about learning LTFs: 1. Suppose we can make real-domain queries, meaning we can compute $f_{w,\\theta}(x)$ at any $x\\in\\mathbb{R}^n$ of our choice. We give a quantum algorithm that learns $f_{w,\\theta}$ up to Euclidean error~$\\epsilon$ using $O(\\log(n/\\epsilon))$ membership queries and $\\widetilde{O}(n)$ other gates. Then we have also learned $f_{w,\\theta}$ up to error $O(\\epsilon)$ when $x$ is Gaussian. Classical algorithms need $\\Omega(n\\log(1/\\epsilon))$ queries. 2. A homogeneous LTF $f_w$ on domain $\\{-1,1\\}^n$ where $w$ has only $k$ nonzero entries of the same value, is the Majority function on the support of $w$. Belovs gave a bounded-error quantum algorithm that identifies the hidden support exactly (and hence learns $f_w$) using $O(k^{1/4})$ queries. We give an exponential improvement, using $O(\\log k)$ queries. 3. Suppose we have a unitary $U$ that can produce (discretized) \\emph{quantum examples} under Gaussian measure, corresponding to $\\int_x \\sqrt{\\gamma_n(x)}|x\\rangle |f_w(x)\\rangle dx$. This is a weaker access model than membership queries. We give a quantum algorithm based on the efficient \\emph{Hermite transform} of Jain et al.\\ to learn homogeneous LTFs~$f_w$ with error~$\\epsilon$ under the Gaussian distribution, using $O(n^{1/4}/\\sqrt{\\epsilon})$ applications of $U$ and $U^\\dagger$ and $\\widetilde{O}(n^2/\\epsilon^4)$ other gates.", "url": "https://arxiv.org/abs/2609.40331", "type": "理论+数值", "summary": "线性阈值函数为 $f_{w,\\theta}(x)=\\text{sign}(\\langle x,w \\rangle -\\theta)$，其中权重向量 $w\\in\\mathbb{R}^n$ 是单位向量，$\\theta\\in\\mathbb R$ 是阈值，通常为 $x\\in\\mathbb{R}^n$ 或 $x\\in\\{-1,1\\}^n$。当$\\theta=0$时，LTF称为齐次，我们写为$f_w:=f_{w,0}$。这些函数是机器学习中最重要的对象之一，因为它们用于线性区分正例和负例。我们给出了关于学习 LTF 的三个积极结果： 1. 假设我们可以进行实域查询，这意味着我们可以在我们选择的任何 $x\\in\\mathbb{R}^n$ 处计算 $f_{w,\\theta}(x)$。我们给出了一种量子算法，它使用 $O(\\log(n/\\epsilon))$ 成员资格查询和 $\\widetilde{O}(n)$ 其他门来学习 $f_{w,\\theta}$ 直至欧几里德误差~$\\epsilon$。然后，当 $x$ 为高斯分布时，我们还学习了 $f_{w,\\theta}$ 直到错误 $O(\\epsilon)$。经典算法需要 $\\Omega(n\\log(1/\\epsilon))$ 查询。 2. 域 $\\{-1,1\\}^n$ 上的同质 LTF $f_w$，其中 $w$ 仅具有相同值的 $k$ 个非零条目，是 $w$ 支持上的众数函数。\n\nBelovs 给出了一种有界误差量子算法，该算法使用 $O(k^{1/4})$ 查询准确识别隐藏支持（从而学习 $f_w$）。我们使用 $O(\\log k)$ 查询提供了指数级的改进。 3. 假设我们有一个酉$U$，可以在高斯测度下产生（离散化）\\emph{量子实例}，对应于$\\int_x \\sqrt{\\gamma_n(x)}|x\\rangle |f_w(x)\\rangle dx$。这是比成员资格查询更弱的访问模型。我们给出了一种基于Jain等人的高效\\emph{Hermite变换}的量子算法，使用$O(n^{1/4}/\\sqrt{\\epsilon})$应用$U$和$U^\\dagger$和$\\widetilde{O}(n^2/\\epsilon^4)$其他门来学习高斯分布下具有误差~$\\epsilon$的同质LTF~$f_w$。", "authors": [{"name": "Aleksandrs Krivcenko"}, {"name": "Tuyen Nguyen"}, {"name": "Ronald de Wolf"}], "featured_authors": [{"name": "Aleksandrs Krivcenko"}, {"name": "Tuyen Nguyen"}, {"name": "Ronald de Wolf"}], "author_count": 3}, {"id": "2609.40343", "category": "quant-ph", "title": "Quantum de Finetti theorems for states and channels in any distance measure", "abstract": "Standard finite quantum de Finetti theorems approximate the $k$-system marginals of permutation-invariant states of $n$-systems by mixtures of independent and identically distributed (iid) states, usually in trace distance. We prove both standard and Renner's exponential de Finetti theorems in the stronger form of operator inequalities, implying bounds in every Schatten norm and for every quantum Rényi divergence satisfying data processing. In the standard case, for fixed local dimension, our $k/n$ error bound in max-relative entropy improves on the previously best known $k^2/n$ scaling, even in the classical setting. The operator-inequality approach is particularly suited to study channel de Finetti representations because operator order between Choi states is equivalent to completely positive (CP) order between the underlying channels. For permutation-covariant channels $N^{(n)}:A^{\\otimes n}\\to B^{\\otimes n}$, where $d_A=\\dim A$, we prove that the $k$-system reduced channel is CP-dominated by a mixture of tensor-power channels with error $O(k/\\sqrt{n})$ and polynomial dependence on the local dimensions, addressing a question raised by Berta et al. [Math. Program. 194, 781-829 (2022)]. Under the no-signalling condition, we also prove an exponential channel de Finetti theorem where the approximating mixture consists of Choi-almost-iid channels, whose normalized Choi states are almost-iid in the sense of Mazzola-Sutter-Renner. In the case of $r$ defects, the representation error is at most $\\mathrm{poly}(n)\\bigl(2d_A^4k^3/(nr^2)\\bigr)^{(r+1)/2}$ and decays exponentially in $n$ for a suitable choice of parameters $r$ and $k$.", "url": "https://arxiv.org/abs/2609.40343", "type": "理论", "summary": "标准有限量子 de Finetti 定理通过独立同分布 (iid) 状态的混合来近似 $n$ 系统的排列不变状态的 $k$ 系统边缘，通常以迹距离为单位。我们以更强形式的算子不等式证明了标准定理和 Renner 指数 de Finetti 定理，这意味着每个 Schatten 范数和每个满足数据处理的量子 Rényi 散度都有界限。在标准情况下，对于固定的局部维度，即使在经典设置中，我们的最大相对熵中的 $k/n$ 误差范围也比之前最知名的 $k^2/n$ 缩放得到了改进。算子不等式方法特别适合研究通道 de Finetti 表示，因为 Choi 状态之间的算子阶数相当于基础通道之间的完全正 (CP) 阶数。对于排列协变通道 $N^{(n)}:A^{\\otimes n}\\to B^{\\otimes n}$，其中 $d_A=\\dim A$，我们证明 $k$ 系统缩减通道是由具有误差 $O(k/\\sqrt{n})$ 的张量幂通道混合和多项式依赖于局部维度的 CP 主导，解决了 Berta 等人提出的问题。 [数学。程序。\n\n194, 781-829 (2022)]。在无信号条件下，我们还证明了指数通道 de Finetti 定理，其中近似混合物由 Choi 几乎独立同分布通道组成，其归一化 Choi 状态在 Mazzola-Sutter-Renner 意义上几乎是独立同分布。在存在 $r$ 缺陷的情况下，表示误差至多为 $\\mathrm{poly}(n)\\bigl(2d_A^4k^3/(nr^2)\\bigr)^{(r+1)/2}$，并且对于参数 $r$ 和 $k$ 的适当选择，在 $n$ 中呈指数衰减。", "authors": [{"name": "Liuhang Ye"}, {"name": "Bjarne Bergh"}, {"name": "Nilanjana Datta"}], "featured_authors": [{"name": "Liuhang Ye"}, {"name": "Bjarne Bergh"}, {"name": "Nilanjana Datta"}], "author_count": 3}, {"id": "2609.40345", "category": "quant-ph", "title": "Gibbs Sampling in the Shattered Phase by Decoded Quantum Interferometry", "abstract": "We apply Decoded Quantum Interferometry (DQI) to sample from the Gibbs measures of classical Ising spin Hamiltonians. We show that this Gibbs sampling problem reduces to a quantum decoding problem, and the temperature achievable by DQI is determined by the performance of decoding algorithms. We then focus on the task of Gibbs sampling for classical Ising $k$-spin glasses (or Max-$k$-XORSAT) on random Erdős-Rényi hypergraphs with average degree $D\\ge k$. In a temperature range beginning asymptotically at the predicted dynamical phase transition, $\\beta_{\\rm dyn}(k,D) = \\sqrt{(2\\ln k)/D}\\times [1+o_{k\\to\\infty}(1)]$, we show that shattering and disorder chaos form a topological barrier that obstructs many algorithms, including Glauber dynamics and any algorithm whose output distribution is \"stable\" under perturbations of the input. In contrast, we prove that this barrier can be broken both by a classical algorithm based on Prange's method, and by DQI equipped with a quantum decoder. For example, when $D=\\alpha k$ with fixed $\\alpha>1$, both Prange's algorithm and DQI can sample at any inverse temperature $\\beta < \\tanh^{-1}(1/\\alpha)$ for sufficiently large $k$, well beyond the dynamical threshold $\\beta_{\\rm dyn} \\sim \\sqrt{2\\ln k / (\\alpha k)}$. Therefore, our results show that DQI can overcome topological barriers that obstruct stable algorithms.", "url": "https://arxiv.org/abs/2609.40345", "type": "理论+数值", "summary": "我们应用解码量子干涉测量法 (DQI) 从经典伊辛自旋哈密顿量的吉布斯测度中进行采样。我们证明吉布斯采样问题可以简化为量子解码问题，并且 DQI 可实现的温度由解码算法的性能决定。然后，我们重点关注在平均度为 $D\\ge k$ 的随机 Erdős-Rényi 超图上对经典 Ising $k$-自旋眼镜（或 Max-$k$-XORSAT）进行吉布斯采样的任务。在从预测的动态相变开始渐进的温度范围 $\\beta_{\\rm dyn}(k,D) = \\sqrt{(2\\ln k)/D}\\times [1+o_{k\\to\\infty}(1)]$ 中，我们发现破碎和无序混沌形成了拓扑障碍，阻碍了许多算法，包括格劳伯动力学和任何在输入扰动下输出分布“稳定”的算法。相比之下，我们证明了这个障碍可以通过基于 Prange 方法的经典算法和配备量子解码器的 DQI 来打破。\n\n例如，当 $D=\\alpha k$ 固定 $\\alpha>1$ 时，Prange 算法和 DQI 都可以在任何逆温度 $\\beta < \\tanh^{-1}(1/\\alpha)$ 下采样，以获得足够大的 $k$，远远超出动态阈值 $\\beta_{\\rm dyn} \\sim \\sqrt{2\\ln k / (\\alpha k)}$。因此，我们的结果表明 DQI 可以克服阻碍稳定算法的拓扑障碍。", "authors": [{"name": "Leo Zhou"}, {"name": "Noah Shutty"}, {"name": "Mark Sellke"}, {"name": "Stephen P. Jordan"}], "featured_authors": [{"name": "Leo Zhou"}, {"name": "Noah Shutty"}, {"name": "Mark Sellke"}, {"name": "Stephen P. Jordan"}], "author_count": 4}, {"id": "2609.40349", "category": "quant-ph", "title": "Efficient Calculation of Equilibrium Correlation Functions", "abstract": "A majority of measurable dynamic quantities of a physical system is described as an equilibrium correlation function of the form $G_{AB}(t-t') = \\left<A(t)B(t')\\right>$, where $t'$ represents the impact time and $t$ represents the response time. Conventional quantum algorithms to compute such quantities via Hamiltonian simulation such as the Hadamard test, variational methods, or linear-response-based algorithms share one feature in common: each time point $t-t'$ is calculated by a different quantum circuit, leading to at least $O(N_t)$ total shots, and at least $O(N_t^2)$ total quantum gates. Here, we provide a different approach: utilizing $O(\\log N_t)$ ancilla qubits to store time as a quantum variable, and effectively parallelize the computation of an equilibrium correlation function by requiring only a single quantum circuit for all time points. We show that this circuit needs to be run only $O(\\log N_t)$ times, which in total requires $O(N_t \\log N_t)$ quantum resources in the large system size limits. We prove that this scaling is optimal, and demonstrate our algorithm calculating the Green's function of a one-dimensional spinless Hubbard model.", "url": "https://arxiv.org/abs/2609.40349", "type": "理论+数值", "summary": "物理系统的大多数可测量动态量被描述为形式为 $G_{AB}(t-t') = \\left<A(t)B(t')\\right>$ 的平衡相关函数，其中 $t'$ 表示影响时间，$t$ 表示响应时间。通过哈达玛测试、变分方法或基于线性响应的算法等通过哈达玛模拟计算此类量的传统量子算法有一个共同点：每个时间点 $t-t'$ 由不同的量子电路计算，从而导致至少 $O(N_t)$ 总发射，以及至少 $O(N_t^2)$ 总量子门。在这里，我们提供了一种不同的方法：利用 $O(\\log N_t)$ 辅助量子位将时间存储为量子变量，并通过对所有时间点仅需要单个量子电路来有效地并行化平衡相关函数的计算。我们证明该电路只需要运行 $O(\\log N_t)$ 次，在大系统规模限制下总共需要 $O(N_t \\log N_t)$ 量子资源。我们证明这种缩放是最优的，并演示了我们计算一维无自旋哈伯德模型的格林函数的算法。", "authors": [{"name": "Yizhi Shen"}, {"name": "Roel Van Beeumen"}, {"name": "Wibe A. de Jong"}, {"name": "Efekan Kökcü"}], "featured_authors": [{"name": "Yizhi Shen"}, {"name": "Roel Van Beeumen"}, {"name": "Wibe A. de Jong"}, {"name": "Efekan Kökcü"}], "author_count": 4}, {"id": "2609.40351", "category": "quant-ph", "title": "All Unitaries Have Constant Depth Quantum Circuits", "abstract": "It is well-known that every $n$-qubit unitary can be implemented by a $2^{O(n)}$-depth quantum circuit using single- and two-qubit gates. It has been open whether exponential depth is \\emph{necessary} for general unitaries, even when allowing for unlimited number of ancilla qubits. We show, perhaps surprisingly, that all unitaries can be approximated to operator norm $\\epsilon$ by a circuit of one- and two-qubit gates of depth $\\poly(n,\\log 1/\\epsilon)$ with $2^{O(n)}$ ancilla qubits. In other words, every $n$-qubit unitary can be parallelized to polynomial depth. Moreover, if we allow unbounded fan-out gates, these circuits can be reduced further to \\emph{constant} depth. Our construction takes advantage of a novel relationship connecting the unitary synthesis problem of Aaronson and Kuperberg to locally-decodable codes and private information retrieval from complexity theory and cryptography.", "url": "https://arxiv.org/abs/2609.40351", "type": "理论", "summary": "众所周知，每个 $n$ 个量子位酉都可以通过使用单量子位门和两个量子位门的 $2^{O(n)}$ 深度量子电路来实现。即使允许无限数量的辅助量子位，指数深度对于一般幺正是否是必需的仍然存在。我们证明，也许令人惊讶的是，所有幺正都可以通过深度为 $\\poly(n,\\log 1/\\epsilon)$ 的一量子位和两个量子位门电路以及 $2^{O(n)}$ 辅助量子位来近似算子范数 $\\epsilon$。换句话说，每个 $n$ 个量子位酉都可以并行化为多项式深度。此外，如果我们允许无界扇出门，这些电路可以进一步减少到 \\emph{constant} 深度。我们的构建利用了一种新颖的关系，将 Aaronson 和 Kuperberg 的单一综合问题与本地可解码代码以及来自复杂性理论和密码学的私人信息检索联系起来。", "authors": [{"name": "Barak Nehoran"}, {"name": "Henry Yuen"}], "featured_authors": [{"name": "Barak Nehoran"}, {"name": "Henry Yuen"}], "author_count": 2}, {"id": "2609.40355", "category": "quant-ph", "title": "Quantum hypothesis t
