  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2610.23865", "category": "cond-mat", "title": "Universal electrical resistivity in iron-based high-temperature superconductors", "abstract": "Temperature-dependent electrical resistivity $\\rho(T)$ in cuprate, iron-based, and nickelate superconductors represents one of unresolved problems in modern solid-state physics, because of the high absolute value of $\\rho(T)$, which, in many cases, exceeds the Ioffe-Rigel criterion, and a large difference in the $\\rho(T)$ shape for samples with different doping. Here I show that the nearest neighbors parallel resistivity model (arXiv: 2607.23484 ) can well describe the in-plane resistivity $\\rho_{ab}(T)$ in iron-based superconductors (IBS) of type 11, 111, 122, 1111, 1144 and 42214 in which the spin density wave phase or nematic order is suppressed by doping. The model is based on the postulate that $\\rho_{ab}(T)$ is a sum of two parallel conduction channels, where one channel is described by the Bloch-Grüneisen equation and the other by the Arrhenius hopping equation. Consequently, the variety of $\\rho_{ab}(T)$ in the IBS is explained as a variation of the Debye temperature $\\Theta_D$ and the hopping activation energy $E_a$. The derived Debye temperatures were used to estimate the electron-phonon coupling constant $\\lambda_{e-ph}$in the studied IBS.", "url": "https://arxiv.org/abs/2610.23865", "type": "理论+数值", "summary": "铜酸盐、铁基和镍酸盐超导体中与温度相关的电阻率$\\rho(T)$是现代固态物理学中尚未解决的问题之一，因为$\\rho(T)$的绝对值很高，在许多情况下超过了Ioffe-Rigel准则，并且不同掺杂样品的$\\rho(T)$形状存在很大差异。在这里，我证明了最近邻并联电阻率模型（arXiv：2607.23484）可以很好地描述11、111、122、1111、1144和42214型铁基超导体（IBS）中的面内电阻率$\\rho_{ab}(T)$，其中自旋密度波相位或向列序通过掺杂被抑制。该模型基于以下假设：$\\rho_{ab}(T)$ 是两个平行传导通道的总和，其中一个通道由 Bloch-Grüneisen 方程描述，另一个通道由阿伦尼乌斯跳跃方程描述。因此，IBS中$\\rho_{ab}(T)$的变化被解释为德拜温度$\\Theta_D$和跳跃激活能$E_a$的变化。导出的德拜温度用于估计所研究的 IBS 中的电子声子耦合常数 $\\lambda_{e-ph}$。", "authors": [{"name": "E.F. Talantsev"}], "featured_authors": [{"name": "E.F. Talantsev"}], "author_count": 1}, {"id": "2610.23875", "category": "cond-mat", "title": "Resonant suppression of the $π$-type Josephson component in a Kitaev-ladder junction", "abstract": "We investigate Josephson transport through a finite normal segment connecting two Kitaev-ladder superconductors and show that discrete-level detuning controls the sign of the equilibrium Josephson coupling through a branch-selection mechanism. Away from resonance, detuning separates two competing low-energy branches, allowing inter-leg hybridization to clamp the $0$-phase-favoring branch while leaving the $\\pi$-favoring branch dispersive. The resulting negative first harmonic evolves from a branch-switching response at weak coupling into a smooth $\\pi$-junction regime. At resonance the two clamping thresholds coincide, so the finite interval in which only one branch remains dispersive disappears. Once the inter-leg coupling exceeds the resonant clamping threshold, both low-energy branches become independent of the Josephson phase. The remaining finite-energy states then generate a $0$-type Josephson coupling. At $\\phi=\\pi$, the helicity decomposition yields an exact clamping identity for arbitrary finite normal-segment length. Within the controlled sweet-point finite-segment theory, serial propagation fixes the off-resonant fourth-order harmonic to be negative, whereas an isolated resonance leaves a positive residual harmonic within the resonant clamping regime. Numerical calculations demonstrate that the resonance-induced suppression persists away from the solvable phase choice. Thus normal-level resonance does not merely enhance Josephson transmission; it changes which low-energy branches contribute to the Josephson coupling.", "url": "https://arxiv.org/abs/2610.23875", "type": "理论+数值", "summary": "我们研究了通过连接两个基塔耶夫梯超导体的有限法线段的约瑟夫森输运，并表明离散级失谐通过分支选择机制控制平衡约瑟夫森耦合的符号。远离共振，失谐将两个竞争的低能分支分开，允许腿间杂交钳住有利于 $0$ 相的分支，同时使有利于 $\\pi$ 的分支分散。由此产生的负一次谐波从弱耦合时的分支切换响应演变为平滑的 $\\pi$ 结状态。在共振时，两个钳位阈值重合，因此只有一个分支保持色散的有限区间消失了。一旦腿间耦合超过谐振钳位阈值，两个低能量分支就变得独立于约瑟夫森相位。然后剩余的有限能量态生成 $0$ 型约瑟夫森耦合。在 $\\phi=\\pi$ 处，螺旋度分解对于任意有限的法线段长度产生精确的钳位恒等式。\n\n在受控甜蜜点有限段理论中，串行传播将非谐振四阶谐波固定为负值，而孤立谐振则在谐振钳位范围内留下正残余谐波。数值计算表明，共振引起的抑制在远离可解相选择的情况下持续存在。因此，正常水平的共振不仅增强了约瑟夫森传输，而且还增强了约瑟夫森传输。它改变了哪些低能分支对约瑟夫森耦合有贡献。", "authors": [{"name": "Cheng-Rong Xie"}, {"name": "Hiroki Tsuchiura"}, {"name": "Yukio Tanaka"}], "featured_authors": [{"name": "Cheng-Rong Xie"}, {"name": "Hiroki Tsuchiura"}, {"name": "Yukio Tanaka"}], "author_count": 3}, {"id": "2610.24047", "category": "cond-mat", "title": "Multiple propagating modes in random polycrystals", "abstract": "Multiple-scattering theory predicts that the coherent elastic wave in a statistically isotropic polycrystal is not a single wave. Its dispersion equation admits multiple roots of a given polarization, but these extra modes have never been observed. Here, using grain-scale finite-element simulations of three-dimensional polycrystals, we resolve the coherent field in the frequency--wavenumber plane and directly observe the predicted multiplicity for both transverse and longitudinal excitations: a single mode at low frequencies gives way to two in the geometric regime as the wavelength approaches the grain correlation length. The measured modes follow the roots of the dispersion equation, which always carries a third root whose attenuation exceeds that of the others. It is this attenuation hierarchy, not the root count, that dictates how many modes propagate and can be observed. Coherent wave propagation in random media is thus inherently multimodal in the geometric regime, which we reach here for the first time in polycrystals.", "url": "https://arxiv.org/abs/2610.24047", "type": "理论+数值", "summary": "多重散射理论预测统计各向同性多晶中的相干弹性波不是单一波。其色散方程承认给定偏振的多个根，但这些额外的模式从未被观察到。在这里，利用三维多晶的晶粒尺度有限元模拟，我们解析了频率-波数平面中的相干场，并直接观察横向和纵向激发的预测多重性：当波长接近晶粒相关长度时，低频下的单模让位于几何状态下的双模。测量的模式遵循色散方程的根，该方程总是带有第三个根，其衰减超过其他根。正是这种衰减层次结构，而不是根数，决定了传播和可以观察到的模式数量。因此，随机介质中的相干波传播在几何形态上本质上是多模态的，这是我们在多晶中首次达到的。", "authors": [{"name": "Ming Huang"}, {"name": "Stanislav I. Rokhlin"}, {"name": "Michael J. S. Lowe"}], "featured_authors": [{"name": "Ming Huang"}, {"name": "Stanislav I. Rokhlin"}, {"name": "Michael J. S. Lowe"}], "author_count": 3}, {"id": "2610.24065", "category": "cond-mat", "title": "Two quantum spin liquid states coexisting in the kagome antiferromagnet herbertsmithite", "abstract": "Herbertsmithite (ZnCu$_3$(OH)$_6$Cl$_2$) is one of the most extensively studied quantum spin liquid (QSL) candidates, yet the precise nature of its ground state remains unresolved. Here, we compare the results of high-resolution inelastic neutron scattering on single crystals of herbertsmithite (Zn$_\\mathrm{x}$Cu$_\\mathrm{4-x}$(OD)$_6$Cl$_2$, $x\\simeq 0.85$) with large-scale density-matrix renormalization group (DMRG) and dynamical DMRG simulations to benchmark the spin Hamiltonian and uncover fundamental properties of the ground state. The measured spin correlations determine an energy density for the Heisenberg model that closely matches simulations, an essential verification of the Hamiltonian. In parallel, DMRG simulations reveal two nearly degenerate QSL states. Both preserve translational symmetry, but one retains the lattice point-group symmetries whereas the other develops anisotropic spin correlations that break point-group symmetry. These two QSLs have distinct spin structure factors, and, remarkably, close agreement with the neutron spectra is achieved with an admixture of the two states. Our results establish a quantitative correspondence between neutron scattering and simulations, and suggest that herbertsmithite realizes a regime in which two proximate gapped QSL states coexist.", "url": "https://arxiv.org/abs/2610.24065", "type": "理论+数值", "summary": "赫伯特铁矿 (ZnCu$_3$(OH)$_6$Cl$_2$) 是研究最广泛的量子自旋液体 (QSL) 候选者之一，但其基态的精确性质仍未解决。在这里，我们将赫伯特铁矿单晶 (Zn$_\\mathrm{x}$Cu$_\\mathrm{4-x}$(OD)$_6$Cl$_2$, $x\\simeq 0.85$) 上的高分辨率非弹性中子散射结果与大规模密度矩阵重正化群 (DMRG) 和动态 DMRG 模拟进行比较，以对自旋哈密顿量进行基准测试并揭示基态的基本性质。测量的自旋相关性确定了海森堡模型的能量密度，该能量密度与模拟非常匹配，这是哈密顿量的重要验证。与此同时，DMRG 模拟揭示了两种近简并的 QSL 状态。两者都保留平移对称性，但一种保留晶格点群对称性，而另一种则发展打破点群对称性的各向异性自旋相关性。这两个 QSL 具有不同的自旋结构因子，并且值得注意的是，通过两种状态的混合实现了与中子谱的密切一致。\n\n我们的结果建立了中子散射和模拟之间的定量对应关系，并表明赫伯特铁矿实现了两个邻近的带隙 QSL 态共存的状态。", "authors": [{"name": "Arthur C. Campello"}, {"name": "Shengtao Jiang"}, {"name": "Wei He"}, {"name": "Jiajia Wen"}, {"name": "Daniel M. Pajerowski"}, {"name": "Steven A. Kivelson"}, {"name": "Hong-Chen Jiang"}, {"name": "Young S. Lee"}], "featured_authors": [{"name": "Arthur C. Campello"}, {"name": "Shengtao Jiang"}, {"name": "Wei He"}, {"name": "Steven A. Kivelson"}, {"name": "Hong-Chen Jiang"}, {"name": "Young S. Lee"}], "author_count": 8}, {"id": "2610.24101", "category": "cond-mat", "title": "Quantifying the Kinetic and Thermodynamic Origins of the Glass-Forming Ability in Metals", "abstract": "The glass-forming ability (GFA) of a metallic liquid can be quantified by the critical cooling rate $R_c$, below which it crystallizes upon cooling. $R_c$ is determined by the competition between $R$ and the crystallization rate $\\mathcal{K}_{\\rm X}$. Here, we calculate $R_c$ and $\\mathcal{K}_{\\rm X}$ in model pure metals and alloys with BCC/B2 and FCC equilibrium crystal structures. Using classical nucleation theory and independently calculated crystal growth rates, we evaluate $\\mathcal{K}_{\\rm X}=(IU^3)^{1/4}$ at $T=0.8T_m$, where $I$ and $U$ are the nucleation and growth rates and $T_m$ is the melting temperature. We find a strong positive correlation between $\\mathcal{K}_{\\rm X}$ and $R_c$ over eleven orders of magnitude. We decompose $\\mathcal{K}_{\\rm X}$ into a product of a kinetic contribution, involving atomic cluster attachment and diffusion, and a thermodynamic contribution. We show that the thermodynamic contribution to $\\mathcal{K}_{\\rm X}$ dominates the kinetic contribution over the range of cooling rates that we consider. The nucleation barrier $\\Delta G_c \\sim \\tilde\\gamma^3/\\Delta\\tilde\\mu^2$, where $\\tilde\\gamma$ is the reduced effective liquid--crystal interfacial free energy and $\\Delta\\tilde\\mu$ is the reduced bulk driving force, determines the magnitude of the thermodynamic contribution. The relative importance of $\\tilde\\gamma$ and $\\Delta\\tilde\\mu$ depends on the material: a large interfacial free energy can suppress nucleation in some systems, whereas a weak bulk driving force can inhibit crystallization in others. Analyses of the structural and chemical order show that better glass formers have enhanced structural frustration, more icosahedral-like and less crystal-like local environments, and a larger chemical-order mismatch between the supercooled liquid and crystal phases.", "url": "https://arxiv.org/abs/2610.24101", "type": "理论+数值", "summary": "金属液体的玻璃形成能力 (GFA) 可以通过临界冷却速率 $R_c$ 来量化，低于该速率时，金属液体会在冷却时结晶。 $R_c$是由$R$和结晶速率$\\mathcal{K}_{\\rm X}$之间的竞争决定的。在这里，我们计算具有 BCC/B2 和 FCC 平衡晶体结构的纯金属和合金模型中的 $R_c$ 和 $\\mathcal{K}_{\\rm X}$。使用经典成核理论和独立计算的晶体生长速率，我们在$T=0.8T_m$处评估$\\mathcal{K}_{\\rm X}=(IU^3)^{1/4}$，其中$I$和$U$是成核和生长速率，$T_m$是熔化温度。我们发现 $\\mathcal{K}_{\\rm X}$ 和 $R_c$ 之间存在超过 11 个数量级的强正相关性。我们将 $\\mathcal{K}_{\\rm X}$ 分解为动力学贡献（涉及原子团簇附着和扩散）和热力学贡献的乘积。我们表明，在我们考虑的冷却速率范围内，热力学对 $\\mathcal{K}_{\\rm X}$ 的贡献主导了动力学贡献。\n\n成核势垒 $\\Delta G_c \\sim \\tilde\\gamma^3/\\Delta\\tilde\\mu^2$ 决定了热力学贡献的大小，其中 $\\tilde\\gamma$ 是减少的有效液晶界面自由能，$\\Delta\\tilde\\mu$ 是减少的体积驱动力。 $\\tilde\\gamma$ 和 $\\Delta\\tilde\\mu$ 的相对重要性取决于材料：较大的界面自由能可以抑制某些系统中的成核，而较弱的体驱动力可以抑制其他系统中的结晶。对结构和化学顺序的分析表明，更好的玻璃形成体具有增强的结构挫败性、更多的类似二十面体和更少的类似晶体的局部环境，以及过冷液相和晶相之间更大的化学顺序不匹配。", "authors": [{"name": "Weiwei Jin"}, {"name": "Jinpeng Fan"}, {"name": "Mark D. Shattuck"}, {"name": "Corey S. O'Hern"}], "featured_authors": [{"name": "Weiwei Jin"}, {"name": "Jinpeng Fan"}, {"name": "Mark D. Shattuck"}, {"name": "Corey S. O'Hern"}], "author_count": 4}, {"id": "2610.24208", "category": "cond-mat", "title": "Kohler's Rule Holds in the Strange Metallic Hubbard Model", "abstract": "Unconventional magnetotransport violating Kohler's rule has been reported in many strongly correlated strange metals, but the exact origin of these violations is yet unknown. To investigate this question, we use determinant quantum Monte Carlo to compute the magnetoresistance of the hole-doped Hubbard-Hofstadter model. Despite $T$-linear resistivity exceeding the Mott-Ioffe-Regel limit and the nominal absence of well-defined quasiparticles, we find Kohler's rule unexpectedly holds across a wide range of on-site interaction strengths and hole dopings. In particular, Kohler emerges below a crossover temperature $T^\\star\\approx t$ identified from the double occupancy and specific heat, coinciding with the onset of local singlet correlations between lattice sites. We thus propose that Kohler scaling in this regime reflects a more general form of many-body quantum coherence. Our results show that strong correlations and strange metallicity do not themselves generically produce anomalous magnetoresistance.", "url": "https://arxiv.org/abs/2610.24208", "type": "理论+数值", "summary": "在许多强相关的奇怪金属中都报道了违反科勒规则的非常规磁输运，但这些违规行为的确切起源尚不清楚。为了研究这个问题，我们使用行列式量子蒙特卡罗来计算空穴掺杂 Hubbard-Hofstadter 模型的磁阻。尽管 $T$ 线性电阻率超过了 Mott-Ioffe-Regel 极限，并且名义上不存在明确定义的准粒子，但我们发现科勒规则出乎意料地适用于各种现场相互作用强度和空穴掺杂。特别是，科勒出现在从双占据和比热确定的交叉温度 $T^\\star\\approx t$ 以下，与晶格位点之间局部单线态相关性的开始一致。因此，我们提出该体系中的科勒标度反映了多体量子相干性的更一般形式。我们的结果表明，强相关性和奇怪的金属丰度本身通常不会产生异常磁阻。", "authors": [{"name": "Rebekah M. Jin"}, {"name": "Emily Z. Zhang"}, {"name": "Jixun K. Ding"}, {"name": "Brian Moritz"}, {"name": "Thomas P. Devereaux"}], "featured_authors": [{"name": "Rebekah M. Jin"}, {"name": "Emily Z. Zhang"}, {"name": "Jixun K. Ding"}, {"name": "Brian Moritz"}, {"name": "Thomas P. Devereaux"}], "author_count": 5}, {"id": "2610.24317", "category": "cond-mat", "title": "Encoding Hyperuniformity in Geometric Networks: Structural Signatures and Diffusion Dynamics", "abstract": "Disordered hyperuniformity is a recently discovered exotic state exhibiting anomalously suppressed density fluctuations at long wavelengths, and its generalization to network systems remains an important open question. Here, we show that, across a wide range of systems, geometric networks retain substantially more long-wavelength density information from the underlying point configurations than Delaunay triangulations. Within geometric networks, hyperuniformity manifests as suppressed vertex-to-vertex fluctuations in a range of network structural observables, including closeness centrality, vertex strength, and eigenvector centrality. These measures not only distinguish hyperuniform networks from non-hyperuniform ones, but also separate near-hyperuniform configurations from hyperuniform systems with strong local disorder, solving a central challenge in network hyperuniformity. We connect these structural signatures to network dynamics by introducing a relaxation-time centrality based on diffusion and demonstrate that hyperuniform geometric networks exhibit more homogeneous relaxation behavior than non-hyperuniform geometric networks. These results reveal how the suppression of large-scale density fluctuations manifests in both network structure and diffusion dynamics.", "url": "https://arxiv.org/abs/2610.24317", "type": "理论", "summary": "无序超均匀性是最近发现的一种奇异状态，在长波长下表现出异常抑制的密度波动，其对网络系统的推广仍然是一个重要的悬而未决的问题。在这里，我们表明，在广泛的系统中，几何网络比 Delaunay 三角测量保留了更多来自底层点配置的长波长密度信息。在几何网络中，超均匀性表现为一系列网络结构可观测值中顶点到顶点波动的抑制，包括接近中心性、顶点强度和特征向量中心性。这些措施不仅区分超均匀网络和非超均匀网络，而且将近超均匀构型与具有强烈局部无序的超均匀系统分开，解决了网络超均匀性的核心挑战。我们通过引入基于扩散的松弛时间中心性将这些结构特征与网络动力学联系起来，并证明超均匀几何网络比非超均匀几何网络表现出更均匀的松弛行为。\n\n这些结果揭示了大规模密度波动的抑制如何在网络结构和扩散动力学中体现。", "authors": [{"name": "Yongyi Wang"}, {"name": "Eli Newby"}, {"name": "Yang Jiao"}, {"name": "Salvatore Torquato"}, {"name": "Réka Albert"}], "featured_authors": [{"name": "Yongyi Wang"}, {"name": "Eli Newby"}, {"name": "Yang Jiao"}, {"name": "Salvatore Torquato"}, {"name": "Réka Albert"}], "author_count": 5}, {"id": "2610.24401", "category": "cond-mat", "title": "Second Chern Number Protected Gapless Vortex Modes in Superconducting Weyl Semimetals", "abstract": "We have studied the vortex bound states of superconducting linear and quadratic Weyl semimetals with time reversal symmetry. For vortex with vorticity $n$ (vortex line along $z$ direction) and Weyl semimetals with Weyl point chirality $\\chi$, there are $\\vert n\\chi \\vert$ gapless vortex modes around the location of each Weyl point in superconducting Weyl semimetals. We show that the appearance of $\\vert n\\chi \\vert$ gapless vortex modes originates from the imbalanced pumping of flux bound states between Chern insulators obtained at $k_{z}$ and $-k_{z}$ in Weyl semimetals. Such a physical picture is verified by numerical calculations on lattice models. Moreover, the gapless modes around each Weyl point can be characterized by the second Chern number defined in a synthetic four-dimensional space based on the effective BdG Hamiltonian. Finally, these gapless vortex modes are found to be robust against rotational symmetry-breaking terms.", "url": "https://arxiv.org/abs/2610.24401", "type": "理论+数值", "summary": "我们研究了具有时间反演对称性的超导线性和二次韦尔半金属的涡旋束缚态。对于涡度为$n$（沿$z$方向的涡线）的涡流和具有Weyl点手性$\\chi$的Weyl半金属，超导Weyl半金属中每个Weyl点位置周围存在$\\vert n\\chi \\vert$无间隙涡旋模式。我们证明 $\\vert n\\chi \\vert$ 无间隙涡旋模式的出现源于在 Weyl 半金属中 $k_{z}$ 和 $-k_{z}$ 处获得的 Chern 绝缘体之间通量束缚态的不平衡泵浦。这样的物理图景通过晶格模型的数值计算得到了验证。此外，每个 Weyl 点周围的无间隙模式可以通过基于有效 BdG 哈密顿量在合成四维空间中定义的第二陈数来表征。最后，这些无间隙涡旋模式被发现对于旋转对称破缺项具有鲁棒性。", "authors": [{"name": "Zhicheng Zhang"}, {"name": "Jiangping Hu"}], "featured_authors": [{"name": "Zhicheng Zhang"}, {"name": "Jiangping Hu"}], "author_count": 2}, {"id": "2610.24407", "category": "cond-mat", "title": "Atomistic prediction of magnetic behaviour across chemistry, structure and temperature", "abstract": "Controlling magnetic phases and properties through composition and external conditions is central to the development of magnetic materials. Atomistic foundation models offer a route to predicting such behaviour across diverse materials, but magnetic materials remain challenging because their atomic structure and local moments are strongly coupled, while temperature and disorder drive magnetic moments into non-collinear states with evolving orientations and magnitudes. Broadly pretrained atomistic models still sample only limited magnetic diversity, while finite-temperature descriptions of coupled lattice and magnetic fluctuations remain largely material-specific. Here we introduce MagPT, pretrained across 48 elements on 912,492 spin-lattice configurations spanning structural, orientational and longitudinal magnetic fluctuations over 0 $\\sim$ 1,000 K and 0 $\\sim$ 10 GPa. By treating species, atomic positions and vector moments together, MagPT distinguishes magnetic states that share the same atomic structure but differ in spin configuration and energy. It captures magnetic behaviour across composition, temperature and length scales, from Slater-Pauling-type composition-magnetism relations in transition-metal alloys and finite-temperature phase evolution in elemental ferromagnets and magnetic shape-memory Heusler alloys, to emergent long-wavelength non-collinear spin textures in chiral magnets and local chemistry-magnetism coupling in high-entropy alloys. MagPT moves atomistic studies of magnetic materials beyond material-specific approaches, establishing a general framework for exploring and designing magnetic matter across diverse chemistries and conditions.", "url": "https://arxiv.org/abs/2610.24407", "type": "理论", "summary": "通过成分和外部条件控制磁性相和性质是磁性材料开发的核心。原子基础模型提供了一种预测不同材料的此类行为的途径，但磁性材料仍然具有挑战性，因为它们的原子结构和局部矩是强耦合的，而温度和无序将磁矩驱动到具有不断变化的方向和大小的非共线状态。广泛预训练的原子模型仍然只采样有限的磁多样性，而耦合晶格和磁涨落的有限温度描述仍然很大程度上是材料特定的。在这里，我们介绍了 MagPT，它在 912,492 个自旋晶格配置上的 48 个元素上进行了预训练，涵盖了 0 $\\sim$ 1,000 K 和 0 $\\sim$ 10 GPa 的结构、方向和纵向磁涨落。通过同时处理物种、原子位置和矢量矩，MagPT 可以区分具有相同原子结构但自旋构型和能量不同的磁态。\n\n它捕获跨成分、温度和长度尺度的磁性行为，从过渡金属合金中的斯莱特-鲍林型成分磁性关系和元素铁磁体和磁性形状记忆赫斯勒合金中的有限温度相演化，到手性磁体中出现的长波长非共线自旋纹理和高熵合金中的局域化学磁性耦合。 MagPT 使磁性材料的原子研究超越了特定材料的方法，建立了一个通用框架，用于跨不同化学和条件探索和设计磁性物质。", "authors": [{"name": "Ruosong Shi"}, {"name": "Chengbing Chen"}, {"name": "Bicheng Liu"}, {"name": "Daye Zheng"}, {"name": "Duo Zhang"}, {"name": "Zhengtao Huang"}, {"name": "Teng Yang"}, {"name": "Zefeng Cai"}, {"name": "Xingliang Peng"}, {"name": "Xinzijian Liu"}, {"name": "Shenshen Yan"}, {"name": "Xueqing Zhao"}, {"name": "Jianbo Wang"}, {"name": "Bin Liu"}, {"name": "Han Wang"}, {"name": "Ke Wang"}, {"name": "Liuliu Han"}, {"name": "Ben Xu"}], "featured_authors": [{"name": "Ruosong Shi"}, {"name": "Chengbing Chen"}, {"name": "Bicheng Liu"}, {"name": "Ke Wang"}, {"name": "Liuliu Han"}, {"name": "Ben Xu"}], "author_count": 18}, {"id": "2610.24410", "category": "cond-mat", "title": "Calibrated shape-only recovery of membrane viscosities", "abstract": "Nearby relaxation rates make two membrane viscosities difficult to distinguish from a shape transient. We show how calibrated preparation removes this loss of local sensitivity in a linear Kelvin-Voigt sphere with finite area elasticity and intrinsic membrane dissipation. Two independent releases, with a known signed amplitude ratio and calibrated relative gain and timing, yield normal-displacement records whose fixed linear combination separates the shear and dilatational rates. Their common amplitude remains unknown. For fixed sampling, positive-definite weights, bounded positive rates and nonzero excitation, the amplitude-projected sensitivity has a positive lower bound even at rate coincidence. Without relative calibration, the paired sensitivity decreases linearly with the rate gap; the single tangential-release record decreases quadratically. The calibrated bound is compatible with fixed finite initial energy. A positive local bound also persists with independent ratio calibration of fixed positive precision under a Gaussian error model. Supplied elastic coefficients convert the recovered rates into the two surface viscosities. An unbounded spherical Stokes extension quantifies how bulk dissipation changes the modal patterns and provides a sufficient full-Jacobian criterion for retaining local material sensitivity.", "url": "https://arxiv.org/abs/2610.24410", "type": "理论", "summary": "接近的松弛率使得两种膜粘度难以与形状瞬变区分开来。我们展示了校准准备如何消除具有有限面积弹性和固有膜耗散的线性开尔文-沃伊特球体中的局部灵敏度损失。两个独立的释放，具有已知的带符号振幅比和校准的相对增益和定时，产生正常位移记录，其固定的线性组合将剪切率和膨胀率分开。它们的共同振幅仍然未知。对于固定采样、正定权重、有界正速率和非零激励，即使在速率重合的情况下，幅度投影灵敏度也具有正下限。没有相对校准，配对灵敏度随速率差距线性下降；单次切向释放记录呈二次方下降。校准界限与固定的有限初始能量兼容。在高斯误差模型下，通过固定正精度的独立比率校准，正局部界限也持续存在。提供的弹性系数将恢复率转换为两个表面粘度。\n\n无界球形斯托克斯扩展量化了体耗散如何改变模态模式，并为保留局部材料敏感性提供了足够的全雅可比准则。", "authors": [{"name": "Julian Olszewski"}, {"name": "Zijian Liu"}, {"name": "Jie Xu"}], "featured_authors": [{"name": "Julian Olszewski"}, {"name": "Zijian Liu"}, {"name": "Jie Xu"}], "author_count": 3}, {"id": "2610.24418", "category": "cond-mat", "title": "Reticulating Local Dynamics in Three-Dimensional Covalent Organic Frameworks", "abstract": "In covalent organic frameworks (COFs), the geometry of the building units predetermines the structure of the framework, yet comparable design principles relating the COF linkers to the local motions that govern guest adsorption and diffusion as well as mechanical response have remained beyond reach. Here, we combine synchrotron X-ray pair distribution function (PDF) analysis with molecular dynamics (MD) simulations accelerated by machine learning interatomic potentials to resolve and compare the local dynamics of two three-dimensional imine-linked COFs, chosen to differ in the geometry and rigidity of one of their two building units. Both are constructed from the same 4-connected square planar linker, $4,4',4'',4'''$-(pyrene-1,3,6,8-tetrayl)tetraaniline (PyTTA), reticulated with the 12-connected nanographene hexakis{[3,5-bis($p$-formylphenyl)-4,6-dimethoxyphenyl]}hexabenzocoronene to give COF-412, {[(HBC-LA$_{12}$)(PyTTA)$_3$]}$_{\\mathit{imine}}$, and with the 6-connected triptycene 2,3,6,7,14,15-hexakis(4-formylphenyl)triptycene to give COF-564, {[(Trip-CHO)$_2$(PyTTA)$_3$]}$_{\\mathit{imine}}$. The PDF-MD approach resolves the amplitude, the time scale, and the spatial extent of the motion of all COF linkers, separating the limited libration of the fused aromatic cores from the larger reorientational tilts of the pendant aryl rings they carry and from the translation of whole linkers within the net. The simulations further reveal that exchanging the nanographene- for the triptycene-based linker tunes the equilibrium tilt and the positional probability density of PyTTA, raising the tilt amplitude of its linker partner, and, notably, strengthens the coupling between the translations of neighbouring linkers. This approach provides a blueprint for understanding local dynamical properties in COFs, and shows them to be selectable through the choice of building unit and amenable to design.", "url": "https://arxiv.org/abs/2610.24418", "type": "理论+数值", "summary": "在共价有机框架（COF）中，构建单元的几何形状预先决定了框架的结构，但将COF连接体与控制客体吸附和扩散以及机械响应的局部运动相关的可比较的设计原理仍然遥不可及。在这里，我们将同步加速器 X 射线对分布函数 (PDF) 分析与机器学习原子间势加速的分子动力学 (MD) 模拟相结合，以解析和比较两个三维亚胺连接 COF 的局部动力学，这两个结构单元的几何形状和刚性不同。两者均由相同的 4 连接的方形平面连接体 $4,4',4'',4'''$-(pyrene-1,3,6,8-tetrayl)tetraaniline (PyTTA) 构成，并与 12 连接的纳米石墨烯六基{[3,5-双($p$-甲酰基苯基)-4,6-二甲氧基苯基]}六苯并晕形成网状COF-412，{[(HBC-LA$_{12}$)(PyTTA)$_3$]}$_{\\mathit{imine}}$，并与6-连接的三蝶烯2,3,6,7,14,15-六(4-甲酰基苯基)三蝶烯得到COF-564， {[(Trip-CHO)$_2$(PyTTA)$_3$]}$_{\\mathit{亚胺}}$。\n\nPDF-MD方法解析了所有COF连接体运动的幅度、时间尺度和空间范围，将稠合芳族核的有限解放与它们携带的悬垂芳环的较大重新取向倾斜以及网络内整个连接体的平移分开。模拟进一步表明，将纳米石墨烯替换为基于三蝶烯的连接体可以调节 PyTTA 的平衡倾斜和位置概率密度，提高其连接体配对的倾斜幅度，并且值得注意的是，增强了相邻连接体翻译之间的耦合。这种方法为理解 COF 的局部动态特性提供了蓝图，并表明它们可以通过选择构建单元来选择并易于设计。", "authors": [{"name": "Francesco Tavani"}, {"name": "Saber Mirzaei"}, {"name": "M. Saeed Mirzaei"}, {"name": "Jian Yin"}, {"name": "Yen-hsu Lin"}, {"name": "Caden Myers"}, {"name": "Cheng-Hung Lin"}, {"name": "AM Milinda Abeykoon"}, {"name": "Simon J. L. Billinge"}, {"name": "Omar M. Yaghi"}], "featured_authors": [{"name": "Francesco Tavani"}, {"name": "Saber Mirzaei"}, {"name": "M. Saeed Mirzaei"}, {"name": "AM Milinda Abeykoon"}, {"name": "Simon J. L. Billinge"}, {"name": "Omar M. Yaghi"}], "author_count": 10}, {"id": "2610.24432", "category": "cond-mat", "title": "A GRACE Interatomic Potential for W--Ta Systems: Application to Ta Segregation and Pinning of Shear-Coupled Grain-Boundary Migration", "abstract": "Tungsten-tantalum alloys are promising plasma-facing materials for fusion reactors, but simulations of their coupled defect, mechanical, and microstructural evolution require an interatomic potential that remains accurate across diverse atomic environments. We develop a transferable W-Ta potential within the GRaph Atomic Cluster Expansion (GRACE) framework. The primary training dataset was generated automatically by maximizing information entropy in an atomically relevant feature space, avoiding manual enumeration of the structures and processes required for specific downstream applications. Extensive validation demonstrates a consistent description of unary and binary phase stability, elasticity, phonons, high-pressure response, surfaces, point defects, dislocation energetics, transformation pathways, alloy thermodynamics, and melting behavior. As a demonstration, the potential is applied to Ta segregation and shear-coupled migration of a $\\Sigma5(120)$ W GB. Simulations reveal strongly site-selective segregation: Ta preferentially occupies a small subset of crystallographically distinct atomic rows. Under shear, segregated Ta impedes disconnection-mediated grain boundary migration. The de-pinning stress initially increases with Ta concentration but plateaus as the dominant pinning environment becomes saturated, while increasing temperature weakens both segregation and pinning. These results establish a broadly validated W-Ta potential and demonstrate how automated entropy-maximized data generation can produce transferable atomistic models capable of resolving mechanisms not explicitly targeted during training.", "url": "https://arxiv.org/abs/2610.24432", "type": "理论+数值", "summary": "钨钽合金是用于聚变反应堆的有前景的面向等离子体材料，但对其耦合缺陷、机械和微观结构演化的模拟需要在不同原子环境中保持准确的原子间势。我们在 GRaph 原子团簇扩展 (GRACE) 框架内开发了可转移的 W-Ta 势。主要训练数据集是通过最大化原子相关特征空间中的信息熵自动生成的，避免了手动枚举特定下游应用程序所需的结构和过程。广泛的验证证明了对一元和二元相稳定性、弹性、声子、高压响应、表面、点缺陷、位错能量、转变路径、合金热力学和熔化行为的一致描述。作为演示，该电势应用于 $\\Sigma5(120)$ W GB 的 Ta 偏析和剪切耦合迁移。模拟揭示了强烈的位点选择性偏析：Ta优先占据晶体学上不同的原子行的一小部分。\n\n在剪切作用下，偏析的 Ta 阻碍了断开介导的晶界迁移。脱钉应力最初随着 Ta 浓度的增加而增加，但随着主要钉扎环境变得饱和而趋于稳定，而温度的升高会削弱偏析和钉扎。这些结果建立了广泛验证的 W-Ta 势，并证明了自动熵最大化数据生成如何生成可转移的原子模型，该模型能够解决训练期间未明确针对的机制。", "authors": [{"name": "Omar Hussein"}, {"name": "Laurent Capolungo"}, {"name": "Danny Perez"}], "featured_authors": [{"name": "Omar Hussein"}, {"name": "Laurent Capolungo"}, {"name": "Danny Perez"}], "author_count": 3}, {"id": "2610.24434", "category": "cond-mat", "title": "Beyond low-dissipation regime: general condition for Curzon-Ahlborn efficiency", "abstract": "In recent years, physicists have extensively investigated the universality of Curzon-Ahlborn (CA) efficiency as the efficiency at maximum power of heat engines, which, like Carnot efficiency, is determined only by heat-bath temperatures. While the universality of the CA efficiency to the first order in the temperature difference is established within linear response theory in the inverse operation time, it is generally lost at quadratic order. In the low-dissipation Carnot heat engine model known as the standard framework, the symmetric dissipation condition is necessary. Yet, it is not a necessary condition as the original CA model that adopts endoreversibility does not require such symmetry. In this study, we extend the low-dissipation model to include nonlinear response in the inverse operation time and derive a general condition under which the CA efficiency is recovered in the quadratic order. The generalized symmetric dissipation condition and the CA model with Newton's law of cooling are shown to be special cases of this condition. By applying the obtained condition, we also clarify the condition under which an endoreversible model with a general heat-transfer law exhibits the CA efficiency.", "url": "https://arxiv.org/abs/2610.24434", "type": "理论", "summary": "近年来，物理学家广泛研究了寇松-阿尔伯恩（CA）效率的普遍性，即热机最大功率下的效率，与卡诺效率一样，它仅由热浴温度决定。虽然在逆操作时间的线性响应理论中建立了温度差一阶的 CA 效率的普遍性，但在二次阶时通常会丢失。在被称为标准框架的低耗散卡诺热机模型中，对称耗散条件是必要的。然而，这不是必要条件，因为采用内可逆性的原始CA模型不需要这种对称性。在本研究中，我们扩展了低耗散模型，将非线性响应包含在逆操作时间中，并推导了 CA 效率以二次顺序恢复的一般条件。广义对称耗散条件和具有牛顿冷却定律的 CA 模型被证明是该条件的特例。\n\n通过应用所获得的条件，我们还阐明了具有一般传热定律的内可逆模型表现出 CA 效率的条件。", "authors": [{"name": "Yuki Izumida"}], "featured_authors": [{"name": "Yuki Izumida"}], "author_count": 1}, {"id": "2610.24450", "category": "cond-mat", "title": "Accurate Atomic Correlation Energies and Virial Trends for Correlation-Consistent Effective Core Potentials III: Quantitative Separation of Fixed-Node Biases and Localization Errors in Cs-Rn", "abstract": "Atomic benchmarks for sixth-period elements (Cs-Rn) are established to sub-millihartree precision under correlation-consistent effective core potentials (ccECPs) using coupled-cluster [up to CCSDT(Q)] and full configuration interaction methods. These references systematically characterize electron correlation, potential-to-kinetic energy partitioning, and combined fixed-node and locality biases ($\\eta$) in fixed-node diffusion Monte Carlo (FNDMC). The valence kinetic-to-total energy ratio ($\\xi$) departs from the non-relativistic all-electron Coulombic virial limit ($\\xi=100\\%$), remaining confined between 25.8$\\%$ and 37.6$\\%$. The Un-pseudizing of semi-core shells decreases $\\xi$ as the attractive potential energy deepens faster than the accompanying kinetic energy escalates. Periodic trends in $\\xi$ reveal a $5d$ plateau near 34$\\%$, with a lanthanide-contraction-driven maximum in Hf, followed by a sharp decline across the $6p$ block. In FNDMC, $\\eta$ escalates rapidly at the onset of group-1/2 and toward the $6p$ closed-shell limit, peaking at 5.42$\\%$ in Rn. Although fixed-node errors dominate $\\eta$ in most sixth-period elements, a locality error inversion occurs in Bi, with Pb exhibiting comparable error magnitudes. Furthermore, core-valence partitioning alters trial wavefunction nodal topology: in Tl, three-dimensional nodal cross-sections reveal isolated toroidal domains that confine walkers. This work completes the periodic-table-wide ccECP database from H to Rn, revealing how pseudopotential choices govern energy partitioning, nodal topology, and the balance between fixed-node and localization errors.", "url": "https://arxiv.org/abs/2610.24450", "type": "数值", "summary": "使用耦合簇[高达CCSDT(Q)]和全配置交互方法，在相关一致的有效核心势(ccECP)下建立了亚毫哈特精度的第六周期元素(Cs-Rn)的原子基准。这些参考文献系统地描述了固定节点扩散蒙特卡罗 (FNDMC) 中的电子相关性、势能到动能分配以及固定节点和局域性偏差 ($\\eta$) 的组合。价动能与总能量之比 ($\\xi$) 偏离非相对论全电子库仑维里极限 ($\\xi=100\\%$)，仍然限制在 25.8$\\%$ 和 37.6$\\%$ 之间。由于吸引势能加深的速度快于伴随动能增加的速度，半核壳的反伪化会降低$\\xi$。 $\\xi$ 的周期性趋势显示，$5d$ 处于 34$\\%$ 附近的稳定状态，Hf 出现由镧系元素收缩驱动的最大值，随后在 $6p$ 区域急剧下跌。在 FNDMC 中，$\\eta$ 在第 1/2 组开始时迅速上升，并接近 $6p$ 闭壳极限，在 Rn 中达到峰值 5.42$\\%$。\n\n尽管固定节点误差在大多数第六周期元素中占主导地位，但 Bi 中出现局部误差反转，Pb 表现出可比的误差幅度。此外，核价划分改变了试验波函数节点拓扑：在 T1 中，三维节点横截面揭示了限制步行者的孤立环形域。这项工作完成了从 H 到 Rn 的周期表范围内的 ccECP 数据库，揭示了赝势选择如何控制能量分配、节点拓扑以及固定节点和定位误差之间的平衡。", "authors": [{"name": "Omar Madany"}, {"name": "Lubos Mitas"}], "featured_authors": [{"name": "Omar Madany"}, {"name": "Lubos Mitas"}], "author_count": 2}, {"id": "2610.24565", "category": "cond-mat", "title": "Surface corrections and vortex energetics in the Thomas--Fermi limit of a self-bound unitary Fermi superfluid", "abstract": "We study a spin-balanced unitary Fermi superfluid bound by an attractive $1/r$ interaction within an extended Thomas--Fermi density functional. Its large-particle-number limit is the Lane--Emden polytrope of index $3/2$. We prove the leading gradient correction to the ground-state energy and strong convergence of the density amplitude. A rescaled surface problem predicts the next energy correction and the leading integrated density error. Matching a vortex core to the polytropic bulk gives the energetic threshold of a singly quantized central vortex, including the constant beyond the leading logarithm. Linearizing the same surface problem predicts a local energetic threshold for collective surface excitations that, in the natural TF frequency units, decreases more slowly with particle number than the central-vortex threshold. Radial stationary, spherical Bogoliubov--Poisson, and axisymmetric real-time calculations test the predicted energy corrections and vortex matching, and resolve finite-size surface-mode minima whose approach to the continuum surface coefficient is followed to $N\\simeq4\\times10^6$. For the reference gradient coefficient the vortex constant is $c_1=-0.535$, and the surface Landau scale is $1.417\\,\\omega_K(\\hbar_{\\rm eff}^2/2R_{\\rm TF})^{1/6}\\propto N^{-1/9}$; sector energies at $N\\simeq4.6\\times10^5$, computed after the fit, agree with the extrapolated vortex threshold to $10^{-4}$. These results distinguish the accuracy of the Thomas--Fermi bulk from the gradient physics that controls the surface and vortex core, and separate vortex energetics from the open problem of nonlinear vortex entry.", "url": "https://arxiv.org/abs/2610.24565", "type": "理论+数值", "summary": "我们研究了自旋平衡的酉费米超流体，其在扩展的托马斯-费米密度泛函中受到有吸引力的 $1/r$ 相互作用的约束。其大粒子数极限是指数为 $3/2$ 的 Lane--Emden 多变体。我们证明了基态能量的领先梯度修正和密度振幅的强收敛性。重新缩放的表面问题可以预测下一个能量校正和主要的积分密度误差。将涡核与多变体相匹配给出了单量子化中心涡的能量阈值，包括超出领先对数的常数。线性化相同的表面问题可以预测集体表面激励的局部能量阈值，在自然 TF 频率单位中，与中心涡阈值相比，该阈值随着粒子数量的增加而降低得更慢。径向静止、球面 Bogoliubov--Poisson 和轴对称实时计算测试了预测的能量校正和涡旋匹配，并解决了有限尺寸表面模式最小值，其连续表面系数的方法遵循 $N\\simeq4\\times10^6$。\n\n对于参考梯度系数，涡旋常数为$c_1=-0.535$，表面朗道尺度为$1.417\\,\\omega_K(\\hbar_{\\rm eff}^2/2R_{\\rm TF})^{1/6}\\propto N^{-1/9}$；拟合后计算的 $N\\simeq4.6\\times10^5$ 处的扇区能量与外推的涡旋阈值 $10^{-4}$ 一致。这些结果将托马斯-费米体的精度与控制表面和涡核的梯度物理学区分开来，并将涡流能量学与非线性涡流进入的开放问题分开。", "authors": [{"name": "Bao-Duy Le"}], "featured_authors": [{"name": "Bao-Duy Le"}], "author_count": 1}, {"id": "2610.24629", "category": "cond-mat", "title": "Signed FK percolation in Ising spin glasses", "abstract": "We introduce signed Fortuin-Kasteleyn (FK) percolation for the +/-J random-interaction Ising model to characterize nonzero uniform magnetization density and two-replica overlap within the class of Gibbs distributions whose infinite-volume Edwards-Sokal (ES)/FK representation has at most one infinite FK cluster almost surely. The construction refines ordinary FK connectivity by retaining the parity of coupling products along open paths. Using the infinite-volume ES representation and its DLR equations, we study pairs of companion objects and the compatible spin assignments on them. In one replica, companions are defined by positive-parity FK connections. For extremal states satisfying the infinite-cluster assumption and almost-sure existence of companion densities along the chosen van Hove sequence, nonzero limiting expected magnetization density is equivalent to density distinguishability of the companions of the infinite FK cluster. For two independent replicas, companions are defined by FK connections coherent in parity. For products of extremal one-replica states satisfying the infinite-cluster assumption and almost-sure existence of the companion densities along the chosen sequence, density distinguishability of the companions is equivalent to nonzero limiting expected mutual overlap. For two independent replicas drawn from the same extremal state, this specializes to the Edwards-Anderson self-overlap.", "url": "https://arxiv.org/abs/2610.24629", "type": "理论", "summary": "我们为 +/-J 随机相互作用 Ising 模型引入了有符号 Fortuin-Kasteleyn (FK) 渗流，以表征吉布斯分布类中的非零均匀磁化密度和两副本重叠，其无限体积 Edwards-Sokal (ES)/FK 表示几乎肯定最多有一个无限 FK 簇。该结构通过保留开放路径上耦合产品的奇偶性来改进普通的 FK 连接。使用无限体积 ES 表示及其 DLR 方程，我们研究了伴生对象对及其兼容的自旋分配。在一个副本中，同伴由正奇偶校验 FK 连接定义。对于满足无限簇假设和几乎肯定存在沿所选范霍夫序列的伴星密度的极值状态，非零限制期望磁化密度相当于无限 FK 簇的伴星的密度可区分性。对于两个独立的副本，同伴由奇偶校验一致的 FK 连接定义。\n\n对于满足无限簇假设和沿所选序列几乎肯定存在伴星密度的极值单副本状态的乘积，伴星的密度可区分性相当于非零限制预期相互重叠。对于来自同一极值状态的两个独立复制品，这专门针对爱德华兹-安德森自我重叠。", "authors": [{"name": "Alberto Gandolfi"}, {"name": "Charles Newman"}, {"name": "Danile Stein"}], "featured_authors": [{"name": "Alberto Gandolfi"}, {"name": "Charles Newman"}, {"name": "Danile Stein"}], "author_count": 3}, {"id": "2610.24637", "category": "cond-mat", "title": "Turning Number and the Geometry of Disorder-Induced Topology", "abstract": "The geometry of momentum-space Hamiltonian maps derived from the zero-frequency single-particle Green's function provides a route to a refined topological characterization of quantum systems beyond the noninteracting clean limit. The central idea is to complement standard topological invariants by invariants that characterize the geometry of the map itself. As a paradigmatic example, we study the one-dimensional chiral Su-Schrieffer-Heeger model with disorder, where the topological Hamiltonian defines a planar Bloch loop. In addition to its conventional winding number, this loop possesses an integer turning number that characterizes the winding of its tangent vector. We identify turning-number transitions that occur while the topological Hamiltonian remains finite and spectrally gapped, driven solely by a vanishing tangent vector of the Bloch loop, and obtain an extended phase diagram with additional topological structure beyond the winding-number classification. Asymptotic analysis predicts the emergence and disorder dependence of the corresponding transition regime, in agreement with the numerical results. Our findings establish the geometry of momentum-space Hamiltonian maps as an additional source of topological structure beyond conventional classifications.", "url": "https://arxiv.org/abs/2610.24637", "type": "理论+数值", "summary": "从零频率单粒子格林函数导出的动量空间哈密顿图的几何形状为超越非相互作用清洁极限的量子系统的精细拓扑表征提供了一条途径。中心思想是通过表征地图本身几何形状的不变量来补充标准拓扑不变量。作为一个范例，我们研究了无序的一维手性 Su-Schrieffer-Heeger 模型，其中拓扑哈密顿量定义了平面布洛赫环。除了传统的绕数之外，该环路还拥有一个整数匝数，用于表征其切向量的绕数。我们识别了拓扑哈密顿量保持有限和谱间隙时发生的转数转变，仅由布洛赫环的消失切向量驱动，并获得了具有超出绕数分类的附加拓扑结构的扩展相图。渐近分析预测了相应过渡状态的出现和无序依赖性，与数值结果一致。\n\n我们的研究结果将动量空间哈密顿图的几何结构确立为传统​​分类之外的拓扑结构的额外来源。", "authors": [{"name": "Lars Emmrich"}, {"name": "Michael Potthoff"}], "featured_authors": [{"name": "Lars Emmrich"}, {"name": "Michael Potthoff"}], "author_count": 2}, {"id": "2610.24799", "category": "cond-mat", "title": "Strain-Tunable High-$T_c$ Superconductivity in Layered R3m B$_2$CN", "abstract": "Using DFPT and Wannier-interpolated matrix elements in EPW, we find that isotropic tensile strain of 0--6\\% narrows the B:2$p$/C:2$p$ bands at the Fermi level while softening the phonon branches most strongly coupled to them, driving the coupling constant $\\lambda$ from 0.967 to 2.620. All four strained configurations remain mechanically and dynamically stable, satisfying the Born--Huang criteria with no imaginary phonon modes at any strain level. The fully anisotropic Migdal--Eliashberg equations give a $T_c$ that rises monotonically from 53.5~K to 84.5~K across the strain series, crossing the liquid-nitrogen boiling point at 6\\% strain. The SISSO-based machine-learning model in EPW agrees with the anisotropic Migdal--Eliashberg $T_c$ values to within 10~K across the strain series.", "url": "https://arxiv.org/abs/2610.24799", "type": "理论+数值", "summary": "使用 EPW 中的 DFPT 和 Wannier 插值矩阵元素，我们发现 0--6\\% 的各向同性拉伸应变使费米能级的 B:2$p$/C:2$p$ 能带变窄，同时软化与其最强耦合的声子分支，将耦合常数 $\\lambda$ 从 0.967 驱动到 2.620。所有四种应变配置都保持机械和动态稳定，满足 Born-Huang 标准，在任何应变水平下都没有虚声子模式。完全各向异性的 Migdal--Eliashberg 方程给出了 $T_c$，它在整个应变系列中从 53.5~K 单调上升到 84.5~K，在 6\\% 应变下穿过液氮沸点。 EPW 中基于 SISSO 的机器学习模型与各向异性 Migdal-Eliashberg $T_c$ 值在整个应变系列的 10~K 范围内一致。", "authors": [{"name": "Durjay Dhali"}, {"name": "Arafat Rahman"}, {"name": "Tareq Mahmud"}, {"name": "Alamgir Kabir"}], "featured_authors": [{"name": "Durjay Dhali"}, {"name": "Arafat Rahman"}, {"name": "Tareq Mahmud"}, {"name": "Alamgir Kabir"}], "author_count": 4}, {"id": "2610.24828", "category": "cond-mat", "title": "Multi-property Feynman-Kac Steering of Crystal Diffusion Models", "abstract": "Pretrained diffusion models provide powerful priors for generating new materials, including inorganic crystals, but generating useful materials requires satisfying specific chemical and physical properties, from mechanical stiffness to bandgaps. Existing approaches either retrain models for new target properties or steer only the atom coordinates and lattice during generation, leaving composition unchanged despite its fundamental role in determining physical properties. We present FK-ReMask, an inference-time, gradient-free method that steers both the continuous and discrete channels of a pretrained crystal diffusion model. During generation, FK-ReMask maintains multiple denoising trajectories and replicates promising candidates using Feynman-Kac particle selection. However, selection alone is insufficient: in the atom-type channel, committed elements cannot be revised, so cloning propagates existing compositions and limits the population's ability to explore new ones. We address this with an atom re-masking mechanism, which reopens committed sites during the generation process and allows alternative compositions to emerge. Across four electronic, photovoltaic, and mechanical objectives, our method improves the yield of SUN (stable, unique, novel) and property-on-target materials. We further demonstrate joint steering of three photovoltaic properties, showing that multiple physical objectives can be specified entirely at inference time without retraining.", "url": "https://arxiv.org/abs/2610.24828", "type": "理论", "summary": "预训练的扩散模型为生成新材料（包括无机晶体）提供了强大的先验，但生成有用的材料需要满足从机械刚度到带隙的特定化学和物理特性。现有的方法要么重新训练新目标特性的模型，要么在生成过程中仅控制原子坐标和晶格，尽管其在确定物理特性方面发挥着基本作用，但成分保持不变。我们提出了 FK-ReMask，这是一种推理时间、无梯度方法，可控制预训练晶体扩散模型的连续和离散通道。在生成过程中，FK-ReMask 保持多个去噪轨迹，并使用 Feynman-Kac 粒子选择复制有前途的候选者。然而，仅靠选择是不够的：在原子型通道中，承诺的元素无法被修改，因此克隆会传播现有的成分并限制群体探索新成分的能力。我们通过原子重新屏蔽机制来解决这个问题，该机制在生成过程中重新打开承诺的站点并允许替代组合的出现。\n\n我们的方法针对四个电子、光伏和机械目标，提高了 SUN（稳定、独特、新颖）和目标材料性能的产量。我们进一步演示了三种光伏特性的联合控制，表明可以在推理时完全指定多个物理目标，而无需重新训练。", "authors": [{"name": "Oded Mousai"}, {"name": "Sapir Esther Yiflach"}, {"name": "Barak Itzchak Davidovitch"}, {"name": "Yuval Mualem"}, {"name": "Sarit Kraus"}, {"name": "Hannah-Noa Barad"}, {"name": "Karsten Kreis"}, {"name": "Gal Chechik"}], "featured_authors": [{"name": "Oded Mousai"}, {"name": "Sapir Esther Yiflach"}, {"name": "Barak Itzchak Davidovitch"}, {"name": "Hannah-Noa Barad"}, {"name": "Karsten Kreis"}, {"name": "Gal Chechik"}], "author_count": 8}, {"id": "2610.24877", "category": "cond-mat", "title": "Vortexable Chern Bands Sit Exactly on the Topological Floor of Flat-Band Superfluid Stiffness", "abstract": "Vortexable Chern bands host ideal fractional Chern insulators. Paired with time-reversed partners by orbital-diagonal on-site attraction, they are the least stiff flat-band superconductors at fixed Chern number $C$, filling, and pairing amplitude. For uniform pairing and a nondegenerate paired state, the exact $T=0$ stiffness determinant is the topological floor times $1+(\\Torb/2\\pi|C|)^2\\le1+(\\TLVP/2\\pi|C|)^2$, where $\\Torb$ and $\\TLVP$ measure departures from vortexability. Enhancement costs vortexability, and the inequality is strict only if internal components share a site, as in heterostrained bilayers.", "url": "https://arxiv.org/abs/2610.24877", "type": "理论", "summary": "可涡旋陈氏带具有理想的分数陈氏绝缘体。通过轨道对角现场吸引力与时间反转伙伴配对，它们是在固定陈数 $C$、填充和配对振幅下刚性最小的平带超导体。对于均匀配对和非简并配对状态，确切的 $T=0$ 刚度行列式是拓扑地板时间 $1+(\\Torb/2\\pi|C|)^2\\le1+(\\TLVP/2\\pi|C|)^2$，其中 $\\Torb$ 和 $\\TLVP$ 测量与可涡性的偏离。增强会降低涡旋能力，并且只有当内部组件共享一个位点（如在异质双层中）时，不等式才是严格的。", "authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "featured_authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "author_count": 2}, {"id": "2610.24923", "category": "cond-mat", "title": "Frustration and topology in the phase behavior of solute-frustrated $q$-clock models", "abstract": "Frustration can enhance fluctuations and create new and interesting phase behavior. When combined with the ability to host topological defects, frustration can increase the complexity of a system's phase diagram through topological and frustrated topological transitions. To understand the interplay of frustration and topology on phase behavior, we introduce and study solute-frustrated $q$-clock (SF$q$C) models, in which solute sites are added to the $q$-clock model, a lattice model where each spin can take one of $q$ orientations. The $q$-clock model can exhibit spontaneous symmetry breaking and topological transitions, and the interaction between the spins and a solute frustrates the system, in essence by creating a fixed lower bound on the concentration of positive topological defects or vortices. We perform Monte Carlo simulations and develop theoretical descriptions of SF$q$C models with $q=4$ and $q=6$ to understand their phase behavior. We find that these systems exhibit rich phase diagrams that depend on the choice of parameters. In particular, SF$q$C models have a wide range of interesting low-temperature phases, including the presence of strongly frustrated domains and the absence of long-range order. We also find topological effects even at low temperatures; for instance, we find that topological defects can drive crystallization. We anticipate these results to guide the development of materials that take advantage of frustration and topology to tune phase behavior and fluctuations.", "url": "https://arxiv.org/abs/2610.24923", "type": "理论+数值", "summary": "挫败感会增强波动并创造新的、有趣的相位行为。当与容纳拓扑缺陷的能力相结合时，挫败可以通过拓扑和挫败拓扑转变增加系统相图的复杂性。为了理解挫败和拓扑对相行为的相互作用，我们引入并研究了溶质挫败$q$-时钟（SF$q$C）模型，其中溶质位点被添加到$q$-时钟模型中，这是一个晶格模型，其中每个自旋可以采取$q$方向之一。 $q$-时钟模型可以表现出自发对称破缺和拓扑转变，并且自旋和溶质之间的相互作用实质上是通过在正拓扑缺陷或涡旋的浓度上创建固定的下限来抑制系统。我们执行蒙特卡罗模拟并开发 $q=4$ 和 $q=6$ 的 SF$q$C 模型的理论描述，以了解它们的相行为。我们发现这些系统表现出丰富的相图，这取决于参数的选择。\n\n特别是，SF$q$C 模型具有广泛的有趣的低温相，包括存在强烈受挫域和缺乏长程有序。我们还发现即使在低温下也存在拓扑效应；例如，我们发现拓扑缺陷可以驱动结晶。我们预计这些结果将指导材料的开发，利用挫折和拓扑来调整相行为和波动。", "authors": [{"name": "Hari Rajesh"}, {"name": "Richard C. Remsing"}], "featured_authors": [{"name": "Hari Rajesh"}, {"name": "Richard C. Remsing"}], "author_count": 2}, {"id": "2610.24942", "category": "cond-mat", "title": "Synchronous and asynchronous Monte Carlo dynamics of mean-field spin glasses with rotationally invariant couplings: what they share and where they differ", "abstract": "We compare two Markov chain Monte Carlo dynamics for Ising spin glasses with rotationally invariant couplings: the synchronous Monte Carlo method (SyncMC), which updates all spins in parallel with the help of Gaussian auxiliary fields, and asynchronous Metropolis-Hastings dynamics, which updates one spin at a time. Using the Guionnet-Maïda formula, we derive the dynamical mean-field theory of both dynamics in terms of the R-transform of the coupling spectrum. The two effective single-spin processes share a retarded self-interaction and a Gaussian noise; SyncMC has, in addition, an instantaneous self-coupling and a noise that depends only on the response function. These additional terms act only on the fastest time scale, so that the equations for slow time scales, including the fluctuation-dissipation ratio and, for the Sherrington-Kirkpatrick model, the Parisi equation, are the same for the two dynamics. Simulations of the random orthogonal and Sherrington-Kirkpatrick models confirm that both dynamics approach the same fluctuation-dissipation relations, differing only in how many updates they need to do so.", "url": "https://arxiv.org/abs/2610.24942", "type": "理论+数值", "summary": "我们比较了具有旋转不变耦合的伊辛自旋玻璃的两种马尔可夫链蒙特卡罗动力学：同步蒙特卡罗方法（SyncMC），它在高斯辅助场的帮助下并行更新所有自旋，以及异步 Metropolis-Hastings 动力学，它一次更新一个自旋。使用 Guionnet-Maïda 公式，我们根据耦合谱的 R 变换推导了两种动力学的动力学平均场理论。两个有效的单自旋过程共享延迟的自相互作用和高斯噪声；此外，SyncMC 还具有瞬时自耦合和仅取决于响应函数的噪声。这些附加项仅作用于最快的时间尺度，因此慢时间尺度的方程（包括波动耗散比）以及 Sherrington-Kirkpatrick 模型的 Parisi 方程对于两种动力学来说是相同的。随机正交模型和谢林顿-柯克帕特里克模型的模拟证实，两种动力学都接近相同的涨落耗散关系，区别仅在于它们需要多少次更新。", "authors": [{"name": "Yoshiyuki Kabashima"}], "featured_authors": [{"name": "Yoshiyuki Kabashima"}], "author_count": 1}, {"id": "2610.24948", "category": "cond-mat", "title": "Three-body corrections to Brownian hard-sphere viscosity", "abstract": "For Brownian hard spheres without hydrodynamic interactions, we obtain a conditional enclosure between 1.8266948 and 1.8267157 for the third-order zero-shear Brownian viscosity coefficient. It applies when the physical three-body correction coincides with the finite-energy weak solution and the remote remainder in the pair adjoint identity vanishes. Kirkwood superposition gives zero because three nonzero pair contributions cancel exactly. An elementary radial identity exposes this cancellation, and a common contact-stress convention allows direct comparison of closure predictions. Although superposition solves the bulk equation, it leaves a shared-contact flux error. Correcting this error defines a unique weak response with positive Dirichlet energy. Explicit symmetric trials yield a variational lower bound and a residual upper bound using the rotational structure of shear and three-sphere geometry. Exact integration and outward interval evaluation enclose the fixed-trial functionals. Under the stated physical conditions, the resulting interval excludes all closure coefficients compared here and supplies a quantitative benchmark for dilute three-body Brownian stress.", "url": "https://arxiv.org/abs/2610.24948", "type": "理论+数值", "summary": "对于没有流体动力相互作用的布朗硬球，我们获得了三阶零剪切布朗粘度系数的条件包围在 1.8266948 和 1.8267157 之间。当物理三体校正与有限能量弱解一致并且配对伴随恒等式中的远程余数消失时，它适用。柯克伍德叠加给出零，因为三个非零对贡献完全抵消。基本的径向恒等式揭示了这种抵消，并且常见的接触应力约定允许直接比较闭合预测。尽管叠加解决了体积方程，但它留下了共享接触通量误差。纠正此错误定义了具有正狄利克雷能量的独特弱响应。显式对称试验使用剪切和三球几何的旋转结构产生变分下界和剩余上限。精确积分和外向区间评估包含固定试验泛函。在规定的物理条件下，所得区间排除了此处比较的所有闭合系数，并为稀释三体布朗应力提供了定量基准。", "authors": [{"name": "Julian Olszewski"}, {"name": "Zijian Liu"}, {"name": "Jie Xu"}], "featured_authors": [{"name": "Julian Olszewski"}, {"name": "Zijian Liu"}, {"name": "Jie Xu"}], "author_count": 3}, {"id": "2610.24959", "category": "cond-mat", "title": "Active rheology shapes collective flows in uniaxially compressed 3D spheroids", "abstract": "How compression changes both the magnitude and organization of cell motion remains unclear. Using a three-dimensional active vertex model, we examine how tissue state and active dynamics shape the response of confined spheroids to uniaxial compression. With polarity alignment switched off, compression enhances transverse motion in solid-like spheroids throughout the tested activity range, whereas the fluid-like response reverses from acceleration at low activity to slowing at high activity. Changes in contact persistence organize these responses along a common empirical trend. Passive five-cell calculations reveal how compression reshapes local rearrangement barriers: the response depends on geometry and loading direction, and a high-strain increase in the fluid-like mean coexists with many low-barrier paths. In a separate high-alignment regime, strong compression induces coherent rotation in solid-like spheroids, while fluid-like spheroids show no comparable collective rotation. The rotating solids have a higher contact-persistence index than the fluids and exhibit tangential peripheral cell organization. Controlled perturbations reveal compression-induced softening of a differential-twist mode and slower relaxation with activity. Together, these results identify an activity-dependent reversal of the motility response and compression-induced coherent rotation as two distinct outcomes of loading, linking them to contact persistence, local rearrangement costs, and active coordination.", "url": "https://arxiv.org/abs/2610.24959", "type": "理论+数值", "summary": "压缩如何改变细胞运动的幅度和组织仍不清楚。使用三维活动顶点模型，我们研究了组织状态和活动动力学如何塑造受限球体对单轴压缩的响应。关闭极性对齐后，压缩会增强整个测试活动范围内类固体球体的横向运动，而类流体响应会从低活动时的加速反转到高活动时的减慢。接触持续性的变化沿着共同的经验趋势组织这些反应。被动五单元计算揭示了压缩如何重塑局部重排势垒：响应取决于几何形状和加载方向，并且类流体均值的高应变增加与许多低势垒路径共存。在单独的高对准状态下，强压缩会引起类固体球体的相干旋转，而类流体球体则没有表现出可比的集体旋转。旋转固体具有比流体更高的接触持久性指数，并且表现出切向外围细胞组织。\n\n受控扰动揭示了压缩引起的差动扭转模式的软化和活动引起的较慢的松弛。总之，这些结果将运动响应的活动依赖性逆转和压缩引起的相干旋转确定为加载的两个不同结果，将它们与接触持久性、局部重排成本和主动协调联系起来。", "authors": [{"name": "Liyang Wang"}, {"name": "Shabeeb Ameen"}, {"name": "J. M. Schwarz"}, {"name": "Tao Zhang"}], "featured_authors": [{"name": "Liyang Wang"}, {"name": "Shabeeb Ameen"}, {"name": "J. M. Schwarz"}, {"name": "Tao Zhang"}], "author_count": 4}, {"id": "2610.24961", "category": "cond-mat", "title": "Run-and-tumble particles in a harmonic external field: constructing the solution of the Fokker-Planck equation from the equations of motion", "abstract": "A method for integrating the Langevin equations of motion for run-and-tumble particles is introduced to compute the joint distribution of their position and active velocity, with and without a harmonic external force field. The key step is the construction of the moments of the distribution and the correlation functions, conditional on the particles being in a specific state at the final time. For one-dimensional run-and-tumble particles in a harmonic external potential, the exact steady-state distributions for the tumble state, as well as for the run state conditional on a specified velocity direction, are obtained. This enables us to demonstrate their equivalence to the exact solutions of the corresponding Fokker-Planck equations.", "url": "https://arxiv.org/abs/2610.24961", "type": "理论", "summary": "引入了一种对运行翻滚粒子的朗之万运动方程进行积分的方法，以计算有或没有谐波外力场时它们的位置和主动速度的联合分布。关键步骤是构建分布矩和相关函数，条件是粒子在最终时间处于特定状态。对于谐波外势中的一维运行翻滚粒子，可以获得翻滚状态以及以指定速度方向为条件的运行状态的精确稳态分布。这使我们能够证明它们与相应福克-普朗克方程的精确解的等价性。", "authors": [{"name": "Aoran Sun"}, {"name": "Fangfu Ye"}, {"name": "Jeff Z. Y. Chen"}], "featured_authors": [{"name": "Aoran Sun"}, {"name": "Fangfu Ye"}, {"name": "Jeff Z. Y. Chen"}], "author_count": 3}, {"id": "2610.24967", "category": "cond-mat", "title": "Topological Splitting of Sondheimer Oscillations in Thin-Film Weyl Semimetals", "abstract": "We discuss topological effects on Sondheimer oscillations in the magnetoresistance of thin-film Weyl semimetals. The Sondheimer oscillations are periodic in magnetic field and originate from the commensurability between the film thickness and the cyclotron-orbit pitch. Using Boltzmann transport theory, we investigate the effects of Berry curvature and orbital magnetic moment on the oscillations. We find that the Sondheimer oscillations split into two branches with different frequencies and that each branch becomes chirped because its frequency depends on magnetic field. These features originate from the orbital-Zeeman-induced deformation of the Fermi surface. The same mechanism also applies to Dirac semimetals.", "url": "https://arxiv.org/abs/2610.24967", "type": "理论", "summary": "我们讨论了薄膜外尔半金属磁阻中桑德海默振荡的拓扑效应。桑德海默振荡在磁场中是周期性的，源于薄膜厚度和回旋加速器轨道节距之间的可通约性。利用玻尔兹曼输运理论，我们研究了贝里曲率和轨道磁矩对振荡的影响。我们发现桑德海默振荡分裂成两个频率不同的分支，并且每个分支都会发出啁啾声，因为其频率取决于磁场。这些特征源于轨道塞曼引起的费米表面变形。同样的机制也适用于狄拉克半金属。", "authors": [{"name": "Toshihito Osada"}], "featured_authors": [{"name": "Toshihito Osada"}], "author_count": 1}, {"id": "2610.24988", "category": "cond-mat", "title": "Strong Thermal Conductivity Suppression in Isotope Purified Single Crystal Diamond with Phonon Scatterings of Color Centers", "abstract": "The thermal conductivity of natural diamond can be further improved by ~50% by eliminating isotope impurity to obtain pure 12C diamond. However, unlike isolated point defects, how color centers scatter phonons and correspondingly limit the thermal conductivity remain poorly understood. Here, we report the thermal conductivities of two isotope-purified diamond with different Nitrogen-vacancy (NV) color center concentrations, confirmed by photoluminescence (PL) and secondary-ion mass spectrometry (SIMS). Results show ~ 3200 W m-1 K-1 and ~ 2100 W m-1 K-1 for two samples of low and high NV concentrations, respectively. Modified Callaway model analyses show that first-principles-derived scattering parameters can reproduce room-temperature thermal conductivity of the high NV concentration sample under a vacancy concentration assumption (~30% of the total Nitrogen concentration), but fail to reproduce its temperature dependence. Compared to PL and SIMS results, which show ~7.1-fold NV concentration and ~92-fold difference in total Nitrogen concentration between two samples, suggesting the assumed 30% vacancy fraction may be greatly overestimated. Taken together, these results suggest that NV-color-center defects may scatter phonons more strongly than models treating Nitrogen and vacancy as independent point defects, providing new insights into color-center-induced phonon-scattering mechanisms.", "url": "https://arxiv.org/abs/2610.24988", "type": "理论", "summary": "通过消除同位素杂质，可以将天然金刚石的热导率进一步提高~50%，得到纯12C金刚石。然而，与孤立的点缺陷不同，色心如何散射声子并相应地限制热导率仍然知之甚少。在这里，我们报告了两种具有不同氮空位 (NV) 色心浓度的同位素纯化钻石的热导率，并通过光致发光 (PL) 和二次离子质谱 (SIMS) 证实。结果显示，低 NV 浓度和高 NV 浓度的两个样品分别为约 3200 W m-1 K-1 和约 2100 W m-1 K-1。改进的 Callaway 模型分析表明，第一性原理推导的散射参数可以在空位浓度假设（约总氮浓度的 30%）下重现高 NV 浓度样品的室温热导率，但无法重现其温度依赖性。与 PL 和 SIMS 结果相比，两个样品之间的 NV 浓度相差约 7.1 倍，总氮浓度差异约 92 倍，这表明假设的 30% 空位率可能被大大高估。\n\n总而言之，这些结果表明，NV 色心缺陷可能比将氮和空位视为独立点缺陷的模型更强烈地散射声子，这为色心诱导的声子散射机制提供了新的见解。", "authors": [{"name": "Jinwen Liu"}, {"name": "Junliang Fan"}, {"name": "Zimu Jiang"}, {"name": "Zifeng Huang"}, {"name": "Zhe Cheng"}], "featured_authors": [{"name": "Jinwen Liu"}, {"name": "Junliang Fan"}, {"name": "Zimu Jiang"}, {"name": "Zifeng Huang"}, {"name": "Zhe Cheng"}], "author_count": 5}, {"id": "2610.24994", "category": "cond-mat", "title": "Random spin-3/2 antiferromagnetic Heisenberg chains revisited", "abstract": "We revisit the spin-reduction transition in the random spin-$3/2$ antiferromagnetic Heisenberg chain using the tensor-network strong-disorder renormalization group (tSDRG). The predicted transition separates two random-singlet (RS) phases: one formed by effective spin-$1/2$ moments at weaker disorder and the other by full spin-$3/2$ moments at stronger disorder. Within the Damle--Huse classification, this transition corresponds to an emergent permutation-symmetric $\\mathcal{P}_4$ multicritical point on a $\\mathcal{P}_2$ critical line associated with the RS phases. We first derive the critical exponents governing the disorder-averaged bulk and end-to-end correlation functions in the $\\mathcal{P}_n$ universality classes within the Damle--Huse framework. Using these theoretical predictions, together with a diagnostic constructed from the mean and variance of the energy-gap distribution, we identify the $\\mathcal{P}_4$ transition point and the reentrant behavior of the RS phase.", "url": "https://arxiv.org/abs/2610.24994", "type": "理论+数值", "summary": "我们使用张量网络强无序重正化群 (tSDRG) 重新审视随机自旋 $3/2$ 反铁磁海森堡链中的自旋还原转变。预测的转变将两个随机单态 (RS) 相分开：一个由较弱无序的有效自旋 $1/2$ 时刻形成，另一个由较强无序的全自旋 $3/2$ 时刻形成。在 Damle--Huse 分类中，此转变对应于与 RS 相位相关的 $\\mathcal{P}_2$ 临界线上的紧急排列对称 $\\mathcal{P}_4$ 多临界点。我们首先推导 Damle--Huse 框架内 $\\mathcal{P}_n$ 通用类中控制无序平均批量和端到端相关函数的关键指数。利用这些理论预测，以及根据能隙分布的均值和方差构建的诊断，我们确定了 $\\mathcal{P}_4$ 转变点和 RS 相的重入行为。", "authors": [{"name": "Yen-Tung Lin"}, {"name": "Pochung Chen"}, {"name": "Yu-Cheng Lin"}], "featured_authors": [{"name": "Yen-Tung Lin"}, {"name": "Pochung Chen"}, {"name": "Yu-Cheng Lin"}], "author_count": 3}, {"id": "2610.25029", "category": "cond-mat", "title": "Extrinsic Bulk Photovoltaic Effect from Asymmetric Defect Scattering", "abstract": "The extrinsic bulk photovoltaic effect from asymmetric electron-defect scattering can make an important contribution to the total photocurrent and is highly diagnostic of defect type. We present an ab initio Boltzmann framework combining optical excitation with electron-phonon and symmetric and skew electron-defect scattering, and we apply it to monolayer GeS. Because the defects that generate the current also relax the anisotropy that sustains it, the response peaks at a finite defect fraction. Within the scattering-limited model, cooling to $0$~K shifts the peak position toward lower defect fractions and yields a maximum enhancement of more than six orders of magnitude at fixed defect fraction. At selected low-temperature defect fractions, the total extrinsic current can exceed the intrinsic shift current by more than an order of magnitude, so that the defect fraction itself becomes a tunable parameter.", "url": "https://arxiv.org/abs/2610.25029", "type": "理论+数值", "summary": "来自不对称电子缺陷散射的外在体光伏效应可以对总光电流做出重要贡献，并且可以高度诊断缺陷类型。我们提出了一种从头算起的玻尔兹曼框架，将光学激发与电子声子以及对称和偏斜电子缺陷散射相结合，并将其应用于单层 GeS。由于产生电流的缺陷也会松弛维持电流的各向异性，因此响应在有限缺陷分数处达到峰值。在散射限制模型中，冷却到 $0$~K 会将峰值位置移向较低的缺陷分数，并在固定缺陷分数下产生超过六个数量级的最大增强。在选定的低温缺陷分数下，总外在电流可以超过本征漂移电流一个数量级以上，因此缺陷分数本身成为一个可调参数。", "authors": [{"name": "Zixun Wang"}, {"name": "Andrew M. Rappe"}], "featured_authors": [{"name": "Zixun Wang"}, {"name": "Andrew M. Rappe"}], "author_count": 2}, {"id": "2610.25072", "category": "cond-mat", "title": "Large Deviations in Switching Diffusion: Dynamical Condensation and Diffusivity BBP Transition", "abstract": "We consider a Brownian particle with position $x(t)$ whose diffusivity changes at Poissonian switching times, with each new value drawn independently from a bounded distribution $W(D)$. Assuming $W(D)\\sim C(D_{\\max}-D)^\\nu$ near its upper edge, we study the large-deviation regime $x(t)\\simeq yt$ with $y = O(1)$ at large times, far beyond the typical diffusive scale. In a recent work Guéneau et al., Phys. Rev. Lett. 135, 067102 (2025), the rate function of the displacement was obtained through a renewal approach and it was shown to display several singularities. In this paper, we carry out a detailed study of the corresponding dynamical phase transitions and trajectory condensation. For moderate $y$, the imposed displacement is shared among $O(t)$ displacement increments accumulated during successive intervals between switches. Beyond a first threshold $y_-$, one interval produces an increment of order $t$ carrying a finite fraction of the total displacement, signaling dynamical condensation. For $\\nu>1$, a second threshold $y_+>y_-$ is reached when this macroscopic increment carries asymptotically the entire imposed displacement, whereas for $0<\\nu\\leq1$ the two thresholds merge, $y_-=y_+$. In turn, the moment-generating function of $x(t)$ displays a complementary transition from collective contributions of many diffusivities to selection of states near $D_{\\max}$. We show that this transition is governed by the same edge mechanism as the Baik-Ben Arous-Péché (BBP) transition, indicating that diffusivity selection and trajectory condensation are two manifestations of the same phenomenon. We validate our predictions for the dynamical condensation against numerical results from rare event sampling.", "url": "https://arxiv.org/abs/2610.25072", "type": "理论+数值", "summary": "我们考虑位置为 $x(t)$ 的布朗粒子，其扩散率在泊松切换时间发生变化，每个新值独立于有界分布 $W(D)$ 绘制。假设$W(D)\\sim C(D_{\\max}-D)^\\nu$靠近其上边缘，我们研究大偏差区域$x(t)\\simeq yt$，其中$y = O(1)$，远远超出了典型的扩散尺度。在 Guéneau 等人最近的一项工作中，Phys。莱特牧师。 135, 067102 (2025)，位移的速率函数是通过更新方法获得的，并且显示出几个奇点。在本文中，我们对相应的动态相变和轨迹凝聚进行了详细的研究。对于中等 $y$，施加的位移由在连续切换间隔期间累积的 $O(t)$ 位移增量共享。超过第一个阈值 $y_-$，一个间隔会产生 $t$ 阶的增量，其携带总位移的有限部分，表示动态凝结。\n\n对于 $\\nu>1$，当这个宏观增量渐近地承载整个施加的位移时，达到第二个阈值 $y_+>y_-$，而对于 $0<\\nu\\leq1$，两个阈值合并，$y_-=y_+$。反过来，$x(t)$ 的矩生成函数显示了从许多扩散系数的集体贡献到选择 $D_{\\max}$ 附近状态的互补过渡。我们表明，这种转变受与 Baik-Ben Arous-Péché (BBP) 转变相同的边缘机制控制，表明扩散率选择和轨迹凝聚是同一现象的两种表现。我们根据罕见事件采样的数值结果验证了我们对动态凝结的预测。", "authors": [{"name": "Mathis Guéneau"}, {"name": "Timo Schorlepp"}, {"name": "Satya N. Majumdar"}, {"name": "Gregory Schehr"}], "featured_authors": [{"name": "Mathis Guéneau"}, {"name": "Timo Schorlepp"}, {"name": "Satya N. Majumdar"}, {"name": "Gregory Schehr"}], "author_count": 4}, {"id": "2610.25082", "category": "cond-mat", "title": "Dzyaloshinskii-Moriya interactions in the SU(2) gauge theory of the Shastry-Sutherland Dirac spin liquids", "abstract": "We classify the fermion bilinears of the SU(2) gauge theory of the Shastry-Sutherland Dirac spin liquids under the spin-orbit-locked space group and treat the Dzyaloshinskii-Moriya (DM) interactions of SrCu$_2$(BO$_3$)$_2$ at leading order in $1/N$ and at one loop. At linear order DM can neither gap the spinons nor destabilize the SO(5) point above a scale $T^*$. Symmetry forbids every local gauge-singlet fermion mass at any order. Among the singlet bilinears, the in-plane couplings induce only a conserved spin current of dimension exactly 2, which sets $T^*=4\\lambda\\simeq0.03$-$0.17$ K, and the out-of-plane coupling only a flavored spin-2 current, irrelevant at a unitary critical point. DM-induced Yukawa couplings start below $2\\%$ of the one that bounds the pseudocritical window. In zero field, measured samples order above $1$ K, at or above $T^*$. Below $T^*$, in a two-dimensional sample at the critical pressure, the Dirac cones reconstruct into a chirally protected $d$-wave quadratic band touching whose only gauge-singlet gap channels are the two valence-bond components and the scalar chirality. A one-loop flow, with the gauge field screened by the band touching, ends at $T^{**}\\sim(0.03$-$0.1)\\lambda$ on a ray containing valence-bond order for the material's exchange and for most random couplings, and otherwise on a gapped chiral $\\mathbb{Z}_2$ spin liquid. The DM bias between the two plaquette patterns is at most of order $10^{-4}$, with a direction not fixed at $O(1/N)$, whereas non-magnetic quenched disorder couples a relevant random field to the plaquette doublet and none to the chirality. A field along $[100]$ induces a $(\\pi,\\pi)$ Néel moment linear in the field; a field along $[001]$ does not. This selection rule also holds in the dimer phase and is testable by $^{11}$B NMR under pressure.", "url": "https://arxiv.org/abs/2610.25082", "type": "理论", "summary": "我们对自旋轨道锁定空间群下的 Shastry-Sutherland Dirac 自旋液体的 SU(2) 规范理论的费米子双线性进行分类，并在一个循环中以 $1/N$ 的前导顺序处理 SrCu$_2$(BO$_3$)$_2$ 的 Dzyaloshinskii-Moriya (DM) 相互作用。在线性阶上，DM 既不能间隙自旋子，也不能破坏 $T^*$ 尺度之上的 SO(5) 点的稳定性。对称性禁止任何阶的局部规范单线费米子质量。在单重态双线性中，面内耦合仅引起维度恰好为 2 的守恒自旋电流，这设置 $T^*=4\\lambda\\simeq0.03$-$0.17$ K，而面外耦合仅引起风味自旋 2 电流，在酉临界点不相关。 DM 引起的汤川耦合开始于伪临界窗口边界的 $2\\%$ 以下。在零场中，测量的样品顺序高于 $1$ K，等于或高于 $T^*$。在 $T^*$ 以下，在临界压力下的二维样本中，狄拉克锥重建为手性保护的 $d$ 波二次带接触，其唯一的规范单重态间隙通道是两个价键分量和标量手性。\n\n单环流，其规范场被能带接触屏蔽，在包含材料交换和大多数随机耦合的价键顺序的射线上结束于 $T^{**}\\sim(0.03$-$0.1)\\lambda$ ，否则在带隙手性 $\\mathbb{Z}_2$ 自旋液体上结束。两个斑块图案之间的 DM 偏差最多为 $10^{-4}$ 量级，方向不固定为 $O(1/N)$，而非磁性猝灭无序将相关随机场耦合到斑块双峰，而不耦合到手性。沿 $[100]$ 的场会在场中产生线性的 $(\\pi,\\pi)$ 尼尔矩； $[001]$ 上的字段则不然。该选择规则在二聚体相中也成立，并且可以在压力下通过 $^{11}$B NMR 进行测试。", "authors": [{"name": "Yasir Iqbal"}], "featured_authors": [{"name": "Yasir Iqbal"}], "author_count": 1}, {"id": "2610.25109", "category": "cond-mat", "title": "Annealing Dynamics of the Two-Dimensional Fully Frustrated Ising Model", "abstract": "We study the dynamical scaling properties of the two-dimensional fully frustrated Ising model by simulated annealing. The model has a highly degenerate, critical ground state with well known equilibrium properties. To study its out-of-equilibrium behavior, we develop an annealing protocol that is convenient for extending the Kibble-Zurek mechanism to the case of an exponentially divergent correlation length in the limit of the temperature $T \\to T_c = 0$. We find excellent agreement with the scaling forms derived, including a dependence on the initial temperature that is not present in the conventional Kibble-Zurek mechanism. The dynamic exponent $z$ is consistent among all quantities studied; fits of its dependence on the initial temperature give $z = 1.99(2)$ (susceptibility), $z = 2.072(8)$ (excess energy), and $z = 2.09(3)$ (Edwards-Anderson order parameter). These values are close to $z=2$, which is consistent with previous studies of relaxation after instantaneous quenches and of time dependent correlations in equilibrium, including the estimate $z = 2.004(9)$ from equilibrium autocorrelation functions.", "url": "https://arxiv.org/abs/2610.25109", "type": "理论", "summary": "我们通过模拟退火研究了二维完全受抑伊辛模型的动态标度特性。该模型具有高度简并的临界基态，具有众所周知的平衡特性。为了研究其非平衡行为，我们开发了一种退火协议，可以方便地将 Kibble-Zurek 机制扩展到温度 $T \\to T_c = 0$ 限制下指数发散相关长度的情况。我们发现与导出的标度形式非常一致，包括传统 Kibble-Zurek 机制中不存在的对初始温度的依赖性。动态指数 $z$ 在所有研究的量中是一致的；拟合其对初始温度的依赖性给出 $z = 1.99(2)$（磁化率）、$z = 2.072(8)$（过剩能量）和 $z = 2.09(3)$（Edwards-Anderson 阶次参数）。这些值接近 $z=2$，这与先前对瞬时猝灭后弛豫和平衡状态下时间相关相关性的研究一致，包括来自平衡自相关函数的估计 $z = 2.004(9)$。", "authors": [{"name": "Kai-Hsin Wu"}, {"name": "Anders W. Sandvik"}, {"name": "Ying-Jer Kao"}], "featured_authors": [{"name": "Kai-Hsin Wu"}, {"name": "Anders W. Sandvik"}, {"name": "Ying-Jer Kao"}], "author_count": 3}, {"id": "2610.25153", "category": "cond-mat", "title": "Higher-order disorder correlations control reflected phonon counting statistics", "abstract": "We investigate how structural correlations beyond the power spectrum affect phonon counting in a one-dimensional acoustic stack. An integer-thickness construction cancels the extensive leading backscattering term and leaves a finite-chain reflection amplitude determined by endpoint innovations. For symmetric independent innovations with unit variance and fourth moment $\\mu_4$, the normalized reflected-power second moment tends to $(\\mu_4+5)/4$. With vacuum environmental inputs, a two-phonon Fock input therefore gives an ensemble-averaged reflected factorial correlation $g^{(2)}=(\\mu_4+5)/8$. Two explicitly constructed ensembles with identical mean and complete two-point correlation function yield $g^{(2)}=3/4$ and $9/8$, placing their counting variances on opposite sides of the Poisson value. Conditional tensor averaging also gives a general fourth-order resistance-growth coefficient for arbitrary impedance contrast, including a positive higher-scattering contribution not recovered by shifting the lowest-order spectrum. Exact enumeration confirms the fixed-$N$, small-detuning limit and shows that increasing $N$ at fixed detuning produces a crossover governed by accumulated higher-order bulk scattering rather than convergence to the endpoint formula. Further calculations test bandwidth, thickness error, propagation loss and thermal background. The result concerns disorder-averaged pulse statistics; it neither creates nonclassicality from coherent input nor changes the conditional factorial correlation of an individually
