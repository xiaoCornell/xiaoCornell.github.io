 resolved passive sample.", "url": "https://arxiv.org/abs/2610.25153", "type": "理论+数值", "summary": "我们研究了功率谱之外的结构相关性如何影响一维声学堆栈中的声子计数。整数厚度结构消除了广泛的前向散射项，并留下由端点创新确定的有限链反射幅度。对于具有单位方差和四阶矩 $\\mu_4$ 的对称独立创新，归一化反射功率二阶矩趋于 $(\\mu_4+5)/4$。因此，对于真空环境输入，双声子 Fock 输入给出了整体平均反射阶乘相关性 $g^{(2)}=(\\mu_4+5)/8$。两个具有相同均值和完整两点相关函数的显式构造的系综产生 $g^{(2)}=3/4$ 和 $9/8$，将它们的计数方差放在泊松值的两侧。条件张量平均还给出了任意阻抗对比度的通用四阶电阻增长系数，包括通过移动最低阶频谱无法恢复的正高散射贡献。\n\n精确枚举证实了固定$N$、小失谐极限，并表明在固定失谐处增加$N$会产生由累积的高阶体散射控制的交叉，而不是收敛到端点公式。进一步计算测试带宽、厚度误差、传播损耗和热背景。结果涉及无序平均脉冲统计；它既不会从相干输入中产生非经典性，也不会改变单独解析的被动样本的条件因子相关性。", "authors": [{"name": "Ara Sedrakyan"}], "featured_authors": [{"name": "Ara Sedrakyan"}], "author_count": 1}, {"id": "2610.25190", "category": "cond-mat", "title": "Unconventional spin momentum locking and topological domains in twisted slabs of topological insulator Bi$_2$Te$_3$", "abstract": "The three-dimensional topological insulator Bi$_2$Te$_3$ hosts topological Dirac states on its two-dimensional surfaces. These Dirac states show spin-momentum locking, which usually implies a tangential Rashba-like spin texture. One can alter the properties of the Dirac states by dividing a slab of such a material into two thinner halves, modifying the interface by twisting, shifting, and changing the interlayer distance. Using first-principles calculations, we investigate such modified slabs of Bi$_2$Te$_3$. The twisting degree of freedom deserves special attention. To this end, we follow two approaches. On the one hand, we probe different stacking configurations in order to extract parameters relevant for small twist angle Moiré structures. We find non-trivial topology only for some stackings, leading to topological domains on the Moiré scale. On the other hand, we calculate the properties of commensurate twisted supercells. The latter reveals not only flat bands, which are tunable by external pressure, but also radial spin textures with unconventional spin-momentum locking.", "url": "https://arxiv.org/abs/2610.25190", "type": "理论+数值", "summary": "三维拓扑绝缘体 Bi$_2$Te$_3$ 在其二维表面上具有拓扑狄拉克态。这些狄拉克态显示出自旋动量锁定，这通常意味着切向的拉什巴式自旋纹理。人们可以通过将这种材料的一块板分成两个更薄的两半，通过扭曲、移动和改变层间距离来修改界面，从而改变狄拉克态的性质。使用第一性原理计算，我们研究了这种改性的 Bi$_2$Te$_3$ 板。扭转的自由度值得特别关注。为此，我们遵循两种方法。一方面，我们探测不同的堆叠配置，以提取与小扭转角莫尔结构相关的参数。我们发现仅对于某些堆叠而言不平凡的拓扑，从而导致莫尔尺度上的拓扑域。另一方面，我们计算了相应扭曲超晶胞的属性。后者不仅揭示了可通过外部压力调节的平带，而且还揭示了具有非常规自旋动量锁定的径向自旋纹理。", "authors": [{"name": "Thomas Naimer"}, {"name": "Jaroslav Fabian"}], "featured_authors": [{"name": "Thomas Naimer"}, {"name": "Jaroslav Fabian"}], "author_count": 2}, {"id": "2610.25222", "category": "cond-mat", "title": "Self-Trapping and Liouvillian Spectral Transitions in a Dissipative Bose-Hubbard Dimer", "abstract": "We study the self-trapping transition in dissipative double wells using mean-field theory and exact diagonalization. We find that, similar to the conventional interaction-driven transition from oscillatory dynamics to self-trapping, dissipation alone can also induce self-trapping-like localization in one well. The resulting state, although transient and decaying, persists for a substantial time. At the mean-field level, the interaction- and dissipation-driven transitions are discontinuous and continuous, respectively. When interaction and dissipation both are present, their interplay produces three dynamical regimes: (i) at weak interaction, increasing dissipation drives a transition from oscillations to self-trapping; (ii) at moderate interaction, self-trapping at weak dissipation, oscillatory dynamics at intermediate dissipation, and re-entrant self-trapping at strong dissipation; and (iii) at strong interaction, self-trapping persists but is weakened by dissipation. We connect the transition with the Liouvillian spectrum. It is observed that purely dissipation-driven transition coincides with an exceptional point in the spectra, and a peak in the Liouvillian gap, marking the onset of the quantum-Zeno regime. In the presence of interactions, however, the onset of the Zeno regime is shifted to dissipation strengths larger than that required for the self-trapping transition.", "url": "https://arxiv.org/abs/2610.25222", "type": "理论+数值", "summary": "我们利用平均场理论和精确对角化研究了耗散双阱中的自捕获转变。我们发现，与传统的相互作用驱动的从振荡动力学到自捕获的转变类似，单独的耗散也可以在一口井中引起类似自捕获的定位。由此产生的状态虽然短暂且正在衰退，但会持续相当长的时间。在平均场水平上，相互作用驱动的转变和耗散驱动的转变分别是不连续的和连续的。当相互作用和耗散同时存在时，它们的相互作用产生三种动态状态：（i）在弱相互作用下，增加耗散驱动从振荡到自陷的转变； (ii) 在中等相互作用下，在弱耗散下自陷，在中间耗散下振荡动力学，在强耗散下重入自陷； (iii) 在强相互作用下，自陷仍然存在，但因耗散而减弱。我们将跃迁与刘维尔谱联系起来。\n\n据观察，纯粹耗散驱动的跃迁与光谱中的异常点和刘维尔能隙中的峰值一致，标志着量子芝诺体系的开始。然而，在存在相互作用的情况下，芝诺状态的开始转变为比自捕获转变所需的耗散强度更大的耗散强度。", "authors": [{"name": "Subhendu Saha"}, {"name": "Raka Dasgupta"}], "featured_authors": [{"name": "Subhendu Saha"}, {"name": "Raka Dasgupta"}], "author_count": 2}, {"id": "2610.25236", "category": "cond-mat", "title": "Long-lived nonequilibrium spin configuration induced by dual optical excitation", "abstract": "The ability to create and control nonequilibrium spin states is central to understanding ultrafast magnetism and to developing optical routes for manipulating magnetic materials beyond conventional thermal this http URL metallic systems, photoexcited electronic distributions rapidly evolve toward quasi-thermal states through efficient electron-electron and electron-phonon scattering, making long-lived modification of spin-dependent interactions difficult to achieve. Here, we investigate coherent magnetization precession in an amorphous GdFeCo thin film driven by simultaneous excitation with two femtosecond laser this http URL a symmetric dual-pump geometry that continuously evolves from single-pulse to spatially periodic excitation, we separate effects associated with the excitation pattern from those arising from simultaneous dual-pump excitation. We identify a narrow excitation window in which the lifetime of the ferromagnetic-resonance-like mode increases strongly while its frequency exhibits a small but reproducible this http URL -window analysis shows that the enhanced lifetime persists for several hundred picoseconds, substantially longer than transient magnetostatic effects associated with the periodic excitation this http URL combined frequency and decay time changes cannot be explained by spatially structured heating alone and instead point to a long-lived nonequilibrium spin-dependent electronic configuration. Within a phenomenological Elliott-Yafet framework, the simultaneous increase in FMR decay time and frequency is consistent with a transient reduction of the effective spin-mixing parameter governing spin-flip scattering. Our results demonstrate that the excitation pathway, rather than excitation energy alone, can serve as a control parameter for spin relaxation and provide access to nonequilibrium spin states that are not readily reached by conventional single-pulse excitation.", "url": "https://arxiv.org/abs/2610.25236", "type": "理论", "summary": "创建和控制非平衡自旋态的能力对于理解超快磁性以及开发用于超越传统热金属系统操纵磁性材料的光学路线至关重要，光激发电子分布通过有效的电子-电子和电子-声子散射迅速向准热态演化，使得自旋相关相互作用的长期修改难以实现。在这里，我们研究了由两个飞秒激光器同时激励驱动的非晶 GdFeCo 薄膜中的相干磁化进动，这是一个对称双泵几何结构，从单脉冲不断演变为空间周期性激励，我们将与激励模式相关的效应与同时双泵激励产生的效应分开。\n\n我们确定了一个狭窄的激励窗口，其中类铁磁谐振模式的寿命大幅增加，而其频率表现出较小但可重复的http URL窗口分析表明，增强的寿命持续数百皮秒，远长于与周期性激励相关的瞬态静磁效应。http URL组合频率和衰减时间的变化不能单独用空间结构加热来解释，而是指向长寿命的非平衡自旋相关电子配置。在现象学 Elliott-Yafet 框架内，FMR 衰减时间和频率的同时增加与控制自旋翻转散射的有效自旋混合参数的瞬时减少一致。我们的结果表明，激发途径（而不是单独的激发能量）可以作为自旋弛豫的控制参数，并提供传统单脉冲激发不易达到的非平衡自旋态。", "authors": [{"name": "Sergii Parchenko"}, {"name": "Arata Tsukamoto"}, {"name": "Andreas Scherz"}], "featured_authors": [{"name": "Sergii Parchenko"}, {"name": "Arata Tsukamoto"}, {"name": "Andreas Scherz"}], "author_count": 3}, {"id": "2610.25243", "category": "cond-mat", "title": "Enhancement of liquid-liquid phase transition under shear flow", "abstract": "In a liquid--liquid transition (LLT), a single-component liquid transforms into another liquid with different density and viscosity. Flow therefore couples to the transition, but the effect of shear flow is not understood. Here we investigate the LLT under shear with a two-order-parameter hydrodynamic model in which the viscosity depends on the non-conserved structural order parameter. Under shear, a fluctuation of the order parameter drives a compressional flow through the viscosity, and the resulting density change enhances the order parameter fluctuation. In a linear analysis, this feedback destabilizes the metastable liquid above a critical shear rate $\\dot{\\gamma}_{\\rm c}$ for wavevectors in particular directions. Because the flow rotates the wavevector, a fluctuation grows only for a finite time duration, and its amplification is determined by the dimensionless shear rate $\\dot{\\gamma}/\\dot{\\gamma}_{\\rm c}$ and the second dimensionless number $\\Lambda$, the ratio of the thermodynamic relaxation rate of the order parameter to $\\dot{\\gamma}_{\\rm c}$. In hydrodynamic simulations, shear above about $\\dot{\\gamma}_{\\rm c}$ induces the transition in the metastable region when $\\Lambda\\gtrsim1$. The transition proceeds by nucleation of domains whose morphology becomes anisotropic. The incubation time decreases and the onset of the viscosity increase is accelerated as $\\dot{\\gamma}$ and $\\Lambda$ increase. These results imply that the shear rate is a control variable of LLT in addition to temperature and pressure, selecting whether and how a metastable liquid transforms.", "url": "https://arxiv.org/abs/2610.25243", "type": "理论+数值", "summary": "在液-液转变 (LLT) 中，单组分液体转变为具有不同密度和粘度的另一种液体。因此，流动与过渡耦合，但剪切流的影响尚不清楚。在这里，我们使用二阶参数流体动力学模型研究剪切下的 LLT，其中粘度取决于非保守结构有序参数。在剪切作用下，有序参数的波动驱动通过粘度的压缩流，由此产生的密度变化增强了有序参数的波动。在线性分析中，对于特定方向的波矢，这种反馈会使亚稳态液体的稳定性超过临界剪切率 $\\dot{\\gamma}_{\\rm c}$。由于流动使波矢旋转，波动仅在有限的持续时间内增长，其放大程度由无量纲剪切速率 $\\dot{\\gamma}/\\dot{\\gamma}_{\\rm c}$ 和第二个无量纲数 $\\Lambda$ 决定，即序参数的热力学弛豫率与 $\\dot{\\gamma}_{\\rm c}$ 的比率。\n\n在流体动力学模拟中，当 $\\Lambda\\gtrsim1$ 时，高于 $\\dot{\\gamma}_{\\rm c}$ 的剪切会引起亚稳态区域的转变。该转变通过其形态变得各向异性的域的成核来进行。随着 $\\dot{\\gamma}$ 和 $\\Lambda$ 的增加，孵育时间减少，粘度增加的速度加快。这些结果表明，除了温度和压力之外，剪切速率也是 LLT 的一个控制变量，用于选择亚稳态液体是否以及如何转变。", "authors": [{"name": "Kyohei Takae"}], "featured_authors": [{"name": "Kyohei Takae"}], "author_count": 1}, {"id": "2610.25270", "category": "cond-mat", "title": "Tensor network Monte Carlo study of the J1-J2 Ising model on the square lattice", "abstract": "The frustrated square-lattice J1-J2 Ising model exhibits rich magnetic phases, yet its phase transitions remain difficult to characterize due to critical slowing down in conventional Monte Carlo and truncation errors inherent to tensor renormalization group this http URL develop a tensor-network Monte Carlo (TNMC) algorithm for this frustrated model, which supports both open and periodic boundary conditions. For periodic lattices, we use a sweeping block-update strategy that updates spin blocks while fixing surrounding this http URL boost efficiency, we couple our sampler with histogram reweighting, and test each technique standalone to validate these independent this http URL perform extensive finite-size scaling analyses at g=0.55 and g=1.0, extracting apparent critical temperatures and effective thermal exponents from Binder-cumulant this http URL method offers an efficient, nearly bias-free path for large-scale simulations of J1-J2-type frustrated magnets under periodic boundaries and generalizes readily to other frustrated spin lattices.", "url": "https://arxiv.org/abs/2610.25270", "type": "理论+数值", "summary": "受抑方晶格 J1-J2 Ising 模型表现出丰富的磁相，但由于传统蒙特卡罗中的严重减慢和张量重正化群固有的截断误差，其相变仍然难以表征。该 http URL 为该受抑模型开发了张量网络蒙特卡罗 (TNMC) 算法，该算法支持开放边界条件和周期性边界条件。对于周期性晶格，我们使用一种全面的块更新策略，更新自旋块，同时修复此 http URL 提高效率，我们将采样器与直方图重新加权相结合，并独立测试每种技术以验证这些独立的此 http URL 在 g=0.55 和 g=1.0 处执行广泛的有限尺寸缩放分析，从 Binder 累积中提取表观临界温度和有效热指数此 http URL 方法为大规模模拟提供了一条高效、几乎无偏差的路径J1-J2 型受挫磁体位于周期性边界下，很容易推广到其他受挫自旋晶格。", "authors": [{"name": "Wanying Zheng"}, {"name": "Tao Chen"}, {"name": "Youjin Deng"}, {"name": "Wanzhou Zhang"}], "featured_authors": [{"name": "Wanying Zheng"}, {"name": "Tao Chen"}, {"name": "Youjin Deng"}, {"name": "Wanzhou Zhang"}], "author_count": 4}, {"id": "2610.25295", "category": "cond-mat", "title": "Instability-driven segregation of V group transition metals on HEB$_2$ grain boundaries influencing enhanced mechanical properties", "abstract": "Five metals share a common sublattice in the (Hf,Ta,Ti,Nb,Zr)B$_2$ (HEB$_2$). Most high-entropy materials are produced as polycrystalline materials in the form of sintered ceramics. The question of which metal species are located at grain boundaries is still unknown. Here, we calculated the grain-boundary energy $\\gamma_{GB}$ of four types of boundaries in five binary diborides and HEB$_2$ using density functional theory (DFT). We analyzed the bonding at these boundaries using COHP and sampled cation segregation at six boundaries of HEB$_2$, ordered and general, using Monte Carlo / molecular dynamics with a MACE potential that was fine-tuned for this system. According to our results $\\gamma_{GB}$ splits by group: the group V diborides NbB$_2$ and TaB$_2$ form boundaries with about half the energy of the group IV at three of the four types of GBs, ranging from 0.8 to 2.7 compared to 2.5--4.8~J/m$^2$. COHP shows a significant difference at the Fermi level, namely the Me--B bonds of NbB$_2$ and TaB$_2$ are antibonding at Fermi energy ($E_F$) in the bulk but bonding at the GB, while their integrated strength hardly changes. In HEB$_2$ the segregation follows a similar pattern: Nb and Ta are enriched at five of the six grain boundaries, including general boundaries, up to 23--35~at.\\% at 2000~K, although the size of the atoms would favor Zr and Hf in the expanded sites. A segregated $\\Sigma 193$ grain boundary can withstand 26 against 20~GPa for a random boundary in tension at 300~K. The grain boundaries of HEB$_2$ are composed of group V metals, as suggested by the boundary energies of binaries compounds and their bonding at the Fermi level. Grain boundaries of the (Hf,Ta,Ti,Nb,Zr)B$_2$ preferentially include Nb and Ta. This lowers the grain boundary energy and strengthens the boundaries. This consists of the lower boundary energy and changes Fermi level bonding in NbB$_2$ and TaB$_2$.", "url": "https://arxiv.org/abs/2610.25295", "type": "理论+数值", "summary": "五种金属在 (Hf,Ta,Ti,Nb,Zr)B$_2$ (HEB$_2$) 中共享一个公共子晶格。大多数高熵材料都是以烧结陶瓷形式的多晶材料生产的。哪些金属种类位于晶界的问题仍然未知。在这里，我们使用密度泛函理论（DFT）计算了五种二硼化物和HEB$_2$中四种晶界的晶界能量$\\gamma_{GB}$。我们使用 COHP 分析了这些边界处的键合，并使用蒙特卡罗/分子动力学和针对该系统进行微调的 MACE 势，对 HEB$_2$ 的六个边界处的阳离子分离进行了采样（有序和一般）。根据我们的结果$\\gamma_{GB}$按族划分：V族二硼化物NbB$_2$和TaB$_2$在四种GB中的三种中形成边界，其能量约为IV族的一半，范围从0.8到2.7，而2.5--4.8~J/m$^2$。 COHP在费米能级上表现出显着差异，即NbB$_2$和TaB$_2$的Me--B键在费米能级($E_F$)处呈反键合，而在GB处成键，而它们的综合强度几乎没有变化。\n\n在 HEB$_2$ 中，偏析遵循类似的模式：Nb 和 Ta 在 6 个晶界中的 5 个处富集，包括一般晶界，在 2000~K 时高达 23--35~at.\\%，尽管原子的尺寸有利于扩展位点中的 Zr 和 Hf。偏析的 $\\Sigma 193$ 晶界可以承受 26 对 20~GPa 的压力，随机晶界在 300~K 的张力下。 HEB$_2$ 的晶界由 V 族金属组成，如二元化合物的边界能及其在费米能级的键合所表明的那样。 (Hf,Ta,Ti,Nb,Zr)B$_2$的晶界优先包括Nb和Ta。这降低了晶界能并强化了晶界。这包括较低的边界能量并改变 NbB$_2$ 和 TaB$_2$ 中的费米能级键合。", "authors": [{"name": "Daniil Alekseev"}, {"name": "Viktor S. Baidyshev"}, {"name": "Alexander G. Kvashnin"}], "featured_authors": [{"name": "Daniil Alekseev"}, {"name": "Viktor S. Baidyshev"}, {"name": "Alexander G. Kvashnin"}], "author_count": 3}, {"id": "2610.25383", "category": "cond-mat", "title": "Dependence of the acoustic propulsion of nano- and microcones on their orientation and aspect ratio", "abstract": "Recent research revealed the orientation-dependent propulsion of a cone-shaped colloidal particle that is exposed to a planar traveling ultrasound wave. Here, we extend the previous research by considering nano- and microcones with different aspect ratios and studying how the propulsion of a particle depends on its orientation and aspect ratio. We also study how the orientation-averaged propulsion of a cone-shaped particle, which corresponds to an isotropic ultrasound field, depends on its aspect ratio and identify an aspect ratio of 1/2 where the orientation-averaged propulsion is particularly strong. To make our simulation results easier reusable for follow-up research, we provide a corresponding simple analytic representation.", "url": "https://arxiv.org/abs/2610.25383", "type": "数值", "summary": "最近的研究揭示了暴露于平面行进超声波的锥形胶体颗粒的方向依赖性推进。在这里，我们通过考虑具有不同纵横比的纳米锥体和微米锥体并研究粒子的推进如何取决于其方向和纵横比来扩展之前的研究。我们还研究了对应于各向同性超声场的锥形粒子的方向平均推进力如何取决于其纵横比，并确定了纵横比为 1/2 时方向平均推进力特别强。为了使我们的模拟结果更容易重复用于后续研究，我们提供了相应的简单分析表示。", "authors": [{"name": "Johannes Voß"}, {"name": "Raphael Wittkowski"}], "featured_authors": [{"name": "Johannes Voß"}, {"name": "Raphael Wittkowski"}], "author_count": 2}, {"id": "2610.25412", "category": "cond-mat", "title": "Near self-duality and spatial reorganization of anyon vortex lattices", "abstract": "Contact attraction drives the self-generated vortex lattice of a trapped anyon gas towards self-duality, but integrated energies do not reveal where the remaining departure from it is located. We address this question in the almost-bosonic Chern--Simons--Schrödinger average-field model using a positive, gauge-invariant local defect that measures the covariant kinetic energy in excess of the magnetic bound. Numerically computed low-energy states at three statistical fluxes show that, as the stability line is approached, the integrated defect falls by about two orders of magnitude while the density modulation grows, so that magnetic saturation and density uniformity separate. The residual defect concentrates in a vortex-free outer shell that carries unscreened statistical flux. There it reduces to a smooth radial mismatch between the statistical flow and the density decay, which the interior lattice cannot cancel, whereas the covariant kinetic and amplitude-gradient energies show no comparable enrichment. The effect is robust to grid and box refinement, while its magnitude depends on flux and on the low-energy branch. Exact dilation and contact-response identities relate the squared energy to the density shape and provide consistency checks. Repulsion produces the opposite trend: a smoother density with a larger defect.", "url": "https://arxiv.org/abs/2610.25412", "type": "理论+数值", "summary": "接触吸引力驱动被捕获的任意子气体的自生涡晶格走向自对偶性，但积分能量并不能揭示剩余的偏离位置。我们在近玻色子陈-西蒙斯-薛定谔平均场模型中解决了这个问题，使用正的、规范不变的局部缺陷来测量超过磁界的协变动能。对三个统计通量的低能态进行数值计算表明，随着接近稳定线，积分缺陷下降约两个数量级，而密度调制则增长，从而磁饱和和密度均匀性分离。残余缺陷集中在无涡流外壳中，该外壳携带未经筛选的统计通量。在那里，它减少到统计流和密度衰减之间的平滑径向失配，内部晶格无法消除这种失配，而协变动能和振幅梯度能则没有表现出可比的富集。该效应对于网格和盒子细化来说是稳健的，而其大小取决于通量和低能量分支。\n\n精确的膨胀和接触响应恒等式将平方能量与密度形状联系起来并提供一致性检查。排斥产生相反的趋势：密度更平滑，缺陷更大。", "authors": [{"name": "Bao-Duy Le"}], "featured_authors": [{"name": "Bao-Duy Le"}], "author_count": 1}, {"id": "2610.25477", "category": "cond-mat", "title": "NEP-kappa 2.0: A unified framework for phonon transport and nonequilibrium thermalization with machine-learning interatomic potentials", "abstract": "We present NEP-kappa 2.0, a unified framework that integrates density-functional theory, material-specific machine-learning interatomic potentials, and pretrained force models for advanced phonon calculations. A common workflow enables harmonic lattice dynamics, quasi-harmonic and stochastic self-consistent phonon treatments, three- and four-phonon transport, Wigner population--coherence transport, and time-dependent phonon dynamics. Applications to 3C-SiC, BAs, and Cs$_2$AgInCl$_6$ demonstrate consistent force-model comparisons, finite-temperature renormalization, higher-order scattering, and intermode coherence. Beyond steady-state transport, mode-resolved simulations of selectively excited 3C-SiC reveal that half of the injected optical-phonon energy reaches acoustic modes within approximately 3.75 ps, primarily through one-optical--two-acoustic scattering. Acoustic branches exhibit response times differing by a factor of five, with competing scattering channels producing a transient energy overshoot. Channel-resolved entropy production and persistent nonthermal occupations distinguish interbranch energy redistribution from intrabranch thermalization. The framework connects equilibrium phonon transport with microscopic nonequilibrium energy dynamics.", "url": "https://arxiv.org/abs/2610.25477", "type": "理论+数值", "summary": "我们提出了 NEP-kappa 2.0，这是一个统一的框架，集成了密度泛函理论、特定材料的机器学习原子间势以及用于高级声子计算的预训练力模型。通用工作流程可实现谐波晶格动力学、准谐波和随机自洽声子处理、三声子和四声子输运、维格纳布居相干输运以及时间相关声子动力学。 3C-SiC、BA 和 Cs$_2$AgInCl$_6$ 的应用展示了一致的力模型比较、有限温度重正化、高阶散射和模间相干性。除了稳态传输之外，选择性激发 3C-SiC 的模式解析模拟表明，注入的光学声子能量的一半在大约 3.75 ps 内达到声学模式，主要是通过一光学 - 二声学散射。声学分支的响应时间相差五倍，竞争性散射通道会产生瞬态能量超调。通道分辨的熵产生和持续的非热占据将分支间能量重新分配与分支内热化区分开来。\n\n该框架将平衡声子输运与微观非平衡能量动力学联系起来。", "authors": [{"name": "Shixian Liu"}, {"name": "Bin Liu"}, {"name": "Fei Yin"}, {"name": "Gang Wang"}, {"name": "Yiming Dong"}, {"name": "Yangjun Qin"}, {"name": "Alexandra V. Kosyakova"}, {"name": "Qiang Xian"}, {"name": "Alexander A. Barinov"}, {"name": "Ke Xu"}, {"name": "Gang Zhang"}], "featured_authors": [{"name": "Shixian Liu"}, {"name": "Bin Liu"}, {"name": "Fei Yin"}, {"name": "Alexander A. Barinov"}, {"name": "Ke Xu"}, {"name": "Gang Zhang"}], "author_count": 11}, {"id": "2610.25487", "category": "cond-mat", "title": "Generation of $N$-particle kappa-distributed velocities via superstatistical Gibbs sampling", "abstract": "The \\emph{kappa} distribution is widely used to model heavy-tailed, non-equilibrium velocity distributions in space and laboratory plasmas. Its correct use in particle-in-cell (PIC) simulations requires more than sampling the single-particle marginal: the $N$-particle \\emph{kappa} distribution predicts non-trivial correlations between the kinetic energies of particles. Building on the superstatistical structure, we implement a Gibbs sampler whose stationary distribution is the joint distribution of the velocities and $\\beta$, so that the sampled velocities follow the $N$-particle \\emph{kappa} distribution and reproduce these correlations by construction.", "url": "https://arxiv.org/abs/2610.25487", "type": "理论+数值", "summary": "\\emph{kappa} 分布广泛用于模拟空间和实验室等离子体中的重尾非平衡速度分布。它在细胞内粒子 (PIC) 模拟中的正确使用需要的不仅仅是对单粒子边缘进行采样：$N$-粒子 \\emph{kappa} 分布预测粒子动能之间的非平凡相关性。在超统计结构的基础上，我们实现了一个吉布斯采样器，其平稳分布是速度和 $\\beta$ 的联合分布，以便采样的速度遵循 $N$-粒子 \\emph{kappa} 分布，并通过构造重现这些相关性。", "authors": [{"name": "Leonardo Herrera_Fuenzalida"}, {"name": "Sergio Davis"}], "featured_authors": [{"name": "Leonardo Herrera_Fuenzalida"}, {"name": "Sergio Davis"}], "author_count": 2}, {"id": "2610.25489", "category": "cond-mat", "title": "Microscopic Compensation of Circular Optical Response in Altermagnets", "abstract": "A weak or vanishing circular optical signal need not imply weak helicity-sensitive transitions: it can be the residual of much larger opposing microscopic contributions. We resolve the finite-frequency interband Kubo response before summing over transitions and momentum, separating cancellation among transitions at fixed momentum from cancellation across the Brillouin zone. An exactly compensated $d$-wave model establishes the symmetry benchmark. In MnTe, first-principles Wannier calculations reveal a symmetry-dark Néel orientation with an extended sign-changing circular kernel whose bulk integral vanishes. Reorienting the Néel vector removes this extinction, yet the allowed response remains a small imbalance between large positive- and negative-momentum sectors; the imbalance reverses with photon energy and flips the macroscopic sign. Thus magnetic symmetry decides whether circular response is allowed, whereas microscopic compensation determines how much survives and with what sign. This distinction provides a general framework for interpreting weak, vanishing, and sign-changing magneto-optical signals in compensated magnets.", "url": "https://arxiv.org/abs/2610.25489", "type": "理论+数值", "summary": "弱或消失的圆形光信号不一定意味着弱的螺旋性敏感跃迁：它可以是更大的相反微观贡献的残余物。我们在对跃迁和动量求和之前求解有限频率带间 Kubo 响应，将固定动量跃迁之间的抵消与布里渊区的抵消分开。精确补偿的 $d$ 波模型建立了对称性基准。在 MnTe 中，第一原理 Wannier 计算揭示了对称暗尼尔取向，具有扩展的变号圆形核，其体积积分消失。重新定向尼尔矢量消除了这种灭绝，但允许的反应仍然是大的正动量和负动量部分之间的小不平衡；这种不平衡随着光子能量的增加而逆转，并翻转宏观符号。因此，磁对称性决定了是否允许循环响应，而微观补偿则决定了有多少幸存以及带有什么符号。这种区别为解释补偿磁体中微弱的、消失的和符号变化的磁光信号提供了一个通用框架。", "authors": [{"name": "Meysam Bagheri Tagani"}, {"name": "Carmine Autieri"}, {"name": "Sahar Izadi Vishkayi"}], "featured_authors": [{"name": "Meysam Bagheri Tagani"}, {"name": "Carmine Autieri"}, {"name": "Sahar Izadi Vishkayi"}], "author_count": 3}, {"id": "2610.25537", "category": "cond-mat", "title": "Emergent Chirality Reversal in Magnetically Driven Rotor Clusters", "abstract": "Does a collection of magnetically driven rotors necessarily rotate in the same direction as its individual members? We show that rotors driven by a rotating magnetic field self-assemble into clusters whose collective rotation can oppose the self-rotation of every rotor within them. The reversal arises from competition between rotation-translation coupling and dipolar interactions, which favor opposite directions of collective rotation. Their balance varies with system size and driving frequency, producing a transition between the two handed states, while hydrodynamic interactions shift the transition boundary. Collective handedness can thus emerge opposite to the field-imposed single-rotor rotation without reversing the external field, and can be tuned through system size and driving frequency.", "url": "https://arxiv.org/abs/2610.25537", "type": "理论", "summary": "磁力驱动转子的集合是否必须与其各个部件以相同的方向旋转？我们证明，由旋转磁场驱动的转子会自组装成簇，其集体旋转可以对抗其中每个转子的自旋转。这种逆转是由旋转-平移耦合和偶极相互作用之间的竞争引起的，有利于集体旋转的相反方向。它们的平衡随着系统尺寸和驱动频率的变化而变化，从而在两个手态之间产生过渡，而流体动力学相互作用则改变过渡边界。因此，集体旋向可以与场强加的单转子旋转相反，而无需反转外部场，并且可以通过系统尺寸和驱动频率进行调整。", "authors": [{"name": "Xinzhi Li"}, {"name": "Ke Zhong"}, {"name": "Mohammad F. Islam"}, {"name": "Shiladitya Banerjee"}], "featured_authors": [{"name": "Xinzhi Li"}, {"name": "Ke Zhong"}, {"name": "Mohammad F. Islam"}, {"name": "Shiladitya Banerjee"}], "author_count": 4}, {"id": "2610.25555", "category": "cond-mat", "title": "Chiral symmetry and the orbital susceptibility of disordered honeycomb flakes", "abstract": "The orbital susceptibility of a small disordered grain is dominated by rare samples in which an occupied and an empty level nearly touch. In a chaotic grain such near-degeneracies are suppressed by level repulsion and must also coincide with the chemical potential, so the mean susceptibility stays finite. In a neutral honeycomb flake, chiral (sublattice) symmetry removes the second condition: It places the chemical potential in the middle of the smallest gap, in every disorder realization. Here we show that the mean orbital susceptibility then grows as $\\ln(1/T)$ at low temperature $T$ if disorder can close this gap while a magnetic field still mixes the two levels, and that the hopping geometry decides whether it can: Positive nearest-neighbor hopping on a compact hexagonal flake keeps the gap open, third-neighbor hopping allows it to close. In a chiral random-matrix model with $n$ level pairs the coefficient of the logarithm is $C_n=\\sqrt{2/n}\\,\\Gamma[(n+1)/2]/\\Gamma(n/2)$, close to unity, and a detuned chemical potential cuts the logarithm off.", "url": "https://arxiv.org/abs/2610.25555", "type": "理论", "summary": "小无序颗粒的轨道磁化率由稀有样本主导，其中占据的能级和空能级几乎接触。在混沌颗粒中，这种近简并性受到能级排斥的抑制，并且也必须与化学势一致，因此平均磁化率保持有限。在中性蜂窝状薄片中，手性（亚晶格）对称性消除了第二个条件：它将化学势放置在每个无序实现中的最小间隙的中间。在这里，我们表明，如果无序可以关闭这个间隙，同时磁场仍然混合两个能级，那么平均轨道磁化率在低温 $T$ 下会以 $\\ln(1/T)$ 的形式增长，并且跳跃几何形状决定它是否可以：紧凑六边形薄片上的正最近邻跳跃使间隙保持打开，第三邻跳允许其关闭。在具有 $n$ 级对的手性随机矩阵模型中，对数系数为 $C_n=\\sqrt{2/n}\\,\\Gamma[(n+1)/2]/\\Gamma(n/2)$，接近于 1，失谐的化学势会切断对数。", "authors": [{"name": "B. Murzaliev"}], "featured_authors": [{"name": "B. Murzaliev"}], "author_count": 1}, {"id": "2610.25557", "category": "cond-mat", "title": "Signatures of slow particle transport in the interacting Aubry-André chain", "abstract": "Slow delocalization in strongly disordered many-body quantum chains can originate from two distinct mechanisms: rare resonances and avalanches, rooted in the energy statistics, or an energy-independent combinatorial path-entropy obstruction in operator space. Quasiperiodic potentials eliminate rare regions with similar potentials that are thought to be responsible for avalanche instabilities and modify the statistics of resonances, thus allowing us to delineate the two mechanisms. To do so, we numerically study the entanglement entropy $S(t)$, number entropy $S_N(t)$, and Hartley number entropy $S_H(t)$ following a quantum quench in the interacting Aubry-André chain with disorder strength $D$. We find $S(t)\\sim\\mu\\ln t$, $S_N(t)\\sim\\nu\\ln\\ln t$ with growth rates $\\mu\\sim\\nu\\sim D^{-\\gamma}$ and $\\gamma\\approx 3$, the same behavior that was previously found in the case of quenched disorder. Furthermore, the saturation values $S_H(t\\to\\infty)$ continue to grow with system size $L$ as $\\ln L$, a growth that persists for $D\\gtrsim 8$ where MBL was argued to be stable. The similarity of the quasi-periodic and quenched disorder cases points to a common origin of the slow particle transport that does not rely on rare-region avalanches and persists despite strongly modified resonance statistics.", "url": "https://arxiv.org/abs/2610.25557", "type": "理论+数值", "summary": "严重无序的多体量子链中的缓慢离域可能源于两种不同的机制：根植于能量统计的罕见共振和雪崩，或算子空间中与能量无关的组合路径熵障碍。准周期势消除了具有相似势的稀有区域，这些区域被认为是造成雪崩不稳定性的原因，并修改了共振的统计数据，从而使我们能够描述这两种机制。为此，我们对无序强度为 $D$ 的相互作用的奥布里-安德烈链中量子淬灭后的纠缠熵 $S(t)$、数熵 $S_N(t)$ 和哈特利数熵 $S_H(t)$ 进行数值研究。我们发现 $S(t)\\sim\\mu\\ln t$、$S_N(t)\\sim\\nu\\ln\\ln t$ 的增长率为 $\\mu\\sim\\nu\\sim D^{-\\gamma}$ 和 $\\gamma\\approx 3$，与之前在猝灭无序情况下发现的行为相同。此外，饱和度值 $S_H(t\\to\\infty)$ 随着系统大小 $L$ 继续增长为 $\\ln L$，这种增长持续到 $D\\gtrsim 8$，其中 MBL 被认为是稳定的。\n\n准周期和猝灭无序情况的相似性表明慢粒子输运的共同起源，它不依赖于稀有区域雪崩，并且尽管共振统计数据经过强烈修改，但仍然持续存在。", "authors": [{"name": "S. Sharifan"}, {"name": "M. Kiefer-Emmanouilidis"}, {"name": "J. Sirker"}], "featured_authors": [{"name": "S. Sharifan"}, {"name": "M. Kiefer-Emmanouilidis"}, {"name": "J. Sirker"}], "author_count": 3}, {"id": "2610.25713", "category": "cond-mat", "title": "Categorical classification of non-Fermi liquids in 2+1 dimensions", "abstract": "A defining feature of non-Fermi liquids is a lack of the quasiparticle peak on the Fermi surface in the spectral function, which is usually realized by coupling a finite density of fermions with critical collective fluctuations. However, these features of the two- and three-point vertex functions are qualitatively the same across many non-Fermi liquids, which has made it difficult to classify them beyond the definition by negation. We point out that the four-point function in the pairing channel contains rich information that positively differentiates distinct types of non-Fermi liquids. Using the generalized notion of fixed points that captures scale-dependent universal pairing interaction, we provide a non-perturbative classification of 2+1-dimensional non-Fermi liquids. In the large Fermi momentum limit with fixed dimensionless couplings, metals coupled with long-wavelength critical fluctuations are classified into seven superuniversality classes. Each of them exhibits a unique phase diagram in the space of temperature and bare four-fermion coupling. The present work generalizes the earlier perturbative classification to strongly interacting non-Fermi liquids by leveraging kinematic constraints.", "url": "https://arxiv.org/abs/2610.25713", "type": "理论+数值", "summary": "非费米液体的一个决定性特征是谱函数中费米表面上缺乏准粒子峰，这通常是通过将有限密度的费米子与临界集体涨落耦合来实现的。然而，两点和三点顶点函数的这些特征在许多非费米液体中在性质上是相同的，这使得很难通过否定对它们进行超出定义的分类。我们指出，配对通道中的四点函数包含丰富的信息，可以积极地区分不同类型的非费米液体。使用捕捉尺度相关的通用配对相互作用的固定点的广义概念，我们提供了 2+1 维非费米液体的非微扰分类。在具有固定无量纲耦合的大费米动量极限中，与长波长临界涨落耦合的金属被分为七个超普遍性类别。它们中的每一个都在温度空间和裸四费米子耦合中表现出独特的相图。\n\n目前的工作通过利用运动学约束将早期的微扰分类推广到强相互作用的非费米液体。", "authors": [{"name": "Shubham Kukreja"}, {"name": "Dawson M. Willerton"}, {"name": "Sung-Sik Lee"}], "featured_authors": [{"name": "Shubham Kukreja"}, {"name": "Dawson M. Willerton"}, {"name": "Sung-Sik Lee"}], "author_count": 3}, {"id": "2610.25775", "category": "cond-mat", "title": "Crystal Structure Based Graph Neural Network And LLM Multi-Modal Approach for Material Magnetic Ordering Prediction", "abstract": "AI/ML models are useful for the prediction of materials' properties. Recently, there has been great progress in developing Neural Network models to predict the properties of solids, molecules, and crystals, avoiding expensive and time-consuming laboratory testing. This study presents a novel AI/ML-based multi-modal approach to predict material magnetic ordering using material crystal structure information as input to a Graph Neural Network model (GNN) and semantic text descriptions of the material's properties and structure as input to a Large Language Model (LLM), before performing information fusion of the GNN and LLM outputs to predict material magnetic ordering in four classes (Non-magnetic, Ferromagnetic, Antiferromagnetic, Ferrimagnetic). The model is trained, validated, and tested on a dataset which is a combination of Materials Project dataset, Magndata dataset, and a set of uranium compounds with magnetic ordering determined in laboratory testing, with an 80/10/10 (training/validation/testing) data split. The proposed GNN and LLM multi-modal approach achieves better overall accuracy than both the standalone GNN and LLM approaches with three fusion strategies.", "url": "https://arxiv.org/abs/2610.25775", "type": "理论", "summary": "AI/ML 模型对于预测材料特性非常有用。最近，在开发神经网络模型来预测固体、分子和晶体的特性方面取得了巨大进展，避免了昂贵且耗时的实验室测试。本研究提出了一种基于 AI/ML 的新型多模态方法，使用材料晶体结构信息作为图神经网络模型 (GNN) 的输入，将材料属性和结构的语义文本描述作为大语言模型 (LLM) 的输入，然后对 GNN 和 LLM 输出进行信息融合，以预测四类（非磁性、铁磁性、反铁磁性、亚铁磁性）的材料磁排序。该模型在数据集上进行训练、验证和测试，该数据集是材料项目数据集、Magndata 数据集和一组在实验室测试中确定磁序的铀化合物的组合，数据分割为 80/10/10（训练/验证/测试）。所提出的 GNN 和 LLM 多模态方法比具有三种融合策略的独立 GNN 和 LLM 方法实现了更好的整体精度。", "authors": [{"name": "Adam Zheng"}, {"name": "April Zheng"}, {"name": "Sheng Ran"}], "featured_authors": [{"name": "Adam Zheng"}, {"name": "April Zheng"}, {"name": "Sheng Ran"}], "author_count": 3}, {"id": "2610.25859", "category": "cond-mat", "title": "Effects of Nonmagnetic Impurities on Nonequilibrium Phase Transitions in Microwave-Driven Superconductors", "abstract": "We investigate the nonequilibrium steady states of a microwave-driven BCS superconductor in the presence of nonmagnetic impurity scattering and energy relaxation. Using the Floquet-Nambu-Keldysh Green's function method together with the self-consistent Born approximation, we self-consistently determine the superconducting order parameter in the microwave-driven steady state. We find that the nonequilibrium phase diagram depends strongly on the impurity-scattering strength. When impurity scattering is absent or weak, the steady-state order parameter is single-valued at each temperature and drive frequency. At intermediate scattering strengths, we find bistability between microwave-enhanced and microwave-suppressed superconducting states. As the impurity-scattering strength increases further, we instead find bistability between the superconducting and normal states. This evolution reflects competition between two effects of microwave driving: Eliashberg-type enhancement through the redistribution of thermally excited quasiparticles and suppression through pair-breaking-induced quasiparticle generation. In contrast to the robustness of equilibrium $s$-wave superconductivity against nonmagnetic impurity scattering, our results demonstrate that nonmagnetic impurity scattering plays a central role in determining the character of nonequilibrium superconducting phase transitions under microwave driving.", "url": "https://arxiv.org/abs/2610.25859", "type": "理论+数值", "summary": "我们研究了存在非磁性杂质散射和能量弛豫的情况下微波驱动的 BCS 超导体的非平衡稳态。使用 Floquet-Nambu-Keldysh Green 函数方法和自洽 Born 近似，我们自洽地确定了微波驱动稳态下的超导有序参数。我们发现非平衡相图很大程度上取决于杂质散射强度。当杂质散射不存在或很弱时，稳态有序参数在每个温度和驱动频率下都是单值。在中等散射强度下，我们发现微波增强超导态和微波抑制超导态之间存在双稳态。随着杂质散射强度进一步增加，我们反而发现超导态和正常态之间的双稳态。这种演变反映了微波驱动的两种效应之间的竞争：通过热激发准粒子重新分布的 Eliashberg 型增强和通过破偶诱导准粒子生成的抑制。\n\n与平衡$s$波超导对非磁性杂质散射的鲁棒性相反，我们的结果表明非磁性杂质散射在确定微波驱动下非平衡超导相变的特征中起着核心作用。", "authors": [{"name": "Taira Kawamura"}], "featured_authors": [{"name": "Taira Kawamura"}], "author_count": 1}, {"id": "2610.25884", "category": "cond-mat", "title": "Phase transitions of the antiferromagnetic $J_1$-$J_2$-$J_3$ Ising model on the cubic lattice", "abstract": "Motivated by the conflicting findings in prior studies regarding the nature of the phase transition for the three-dimensional antiferromagnetic $J_1$-$J_2$-$J_3$ Ising model on the cubic lattice with $J_1 = J_2 = J_3 = 1.0$, in this study we conduct a detailed investigation of this model using both Monte Carlo simulations and neural networks (NN). Here $J_1$ and $J_2$ are the intralayer nearest-neighbor and next-nearest-neighbor couplings, respectively, and $J_3$ is the nearest-neighbor interlayer interaction. By investigating the data obtained from much larger lattices than those used in previous studies, we find that the phase transition for $J_1 = J_2 = J_3 = 1.0$ is second order without any ambiguity. Hence we bring a resolution to this debate. Apart from $J_1 = J_2 = J_3 = 1.0$, we study the critical phenomenon associated with $J_2/J_1 = 4/7$ and $J_3 = J_1 = 1.0$ as well. In addition, by employing a dedicated training and testing strategy, our NN computation not only is much more efficient than those utilizing the standard procedures commonly used in the literature, but also requires only a per-mille fraction of the storage capacity needed by a conventional NN calculation when a large linear system size $L$ is considered. The method employed here provides an extremely resource-efficient route for applying NN techniques to study the critical behaviors of higher-dimensional systems.", "url": "https://arxiv.org/abs/2610.25884", "type": "理论+数值", "summary": "受先前研究中关于立方晶格上三维反铁磁 $J_1$-$J_2$-$J_3$ Ising 模型（$J_1 = J_2 = J_3 = 1.0$）相变性质的相互矛盾的结果的启发，在本研究中，我们使用蒙特卡罗模拟和神经网络 (NN) 对该模型进行了详细研究。这里$J_1$和$J_2$分别是层内最近邻和次近邻耦合，$J_3$是最近邻层间相互作用。通过研究从比之前研究中使用的大得多的晶格获得的数据，我们发现 $J_1 = J_2 = J_3 = 1.0$ 的相变是二阶的，没有任何歧义。因此，我们对这场辩论提出了解决方案。除了$J_1 = J_2 = J_3 = 1.0$之外，我们还研究了与$J_2/J_1 = 4/7$和$J_3 = J_1 = 1.0$相关的临界现象。\n\n此外，通过采用专门的训练和测试策略，我们的神经网络计算不仅比利用文献中常用的标准程序的计算效率更高，而且在考虑大型线性系统大小 $L$ 时，仅需要传统神经网络计算所需存储容量的千分之一。这里采用的方法为应用神经网络技术来研究高维系统的关键行为提供了一种极其资源有效的途径。", "authors": [{"name": "Kai-Wei Huang"}, {"name": "Chien-Ting Chen"}, {"name": "Shang-Wei Li"}, {"name": "Fu-Jiun Jiang"}], "featured_authors": [{"name": "Kai-Wei Huang"}, {"name": "Chien-Ting Chen"}, {"name": "Shang-Wei Li"}, {"name": "Fu-Jiun Jiang"}], "author_count": 4}, {"id": "2610.25913", "category": "cond-mat", "title": "A Stress-Induced Tetragonal Distortion in K2OsCl6 under Pressure", "abstract": "The structural behaviour of cubic (Fm-3m) K2OsCl6 under compression was investigated to 35.4 GPa using angle-dispersive synchrotron powder X-ray diffraction. Upon increasing pressure, K2OsCl6 undergoes a sequence of structural transformations from the ambient-pressure cubic phase to a tetragonal (P4/mnc) phase above 9.5(3) GPa, followed by a transition to a monoclinic (P21/n) phase beginning at approximately 14.2 GPa. The tetragonal and monoclinic phases coexist over the pressure range 14.2-17.2 GPa, while the monoclinic phase is observed as the sole phase at 17.9 GPa and remains stable up to the maximum pressure investigated. Analysis of the diffraction profiles and unit-cell parameters indicates that the intermediate tetragonal structure is likely associated with stress-induced symmetry lowering rather than a distinct thermodynamic phase. This distortion, which is adequately described by the tetragonal P4/mnc space group, is attributed to non-hydrostatic deviatoric stresses arising from the pressure-transmitting medium. Equation-of-state analysis reveals a pronounced reduction in compressibility across the structural transitions, with the bulk modulus increasing from 26(2) GPa for the cubic phase to 71(3) GPa for the monoclinic phase. The pressure-induced structural sequence is analogous to that reported for related compounds such as K2IrCl6, although the transitions in K2OsCl6 occur at lower pressures. All structural transformations are reversible upon decompression.", "url": "https://arxiv.org/abs/2610.25913", "type": "理论", "summary": "使用角色散同步加速器粉末 X 射线衍射研究了立方 (Fm-3m) K2OsCl6 在压缩至 35.4 GPa 下的结构行为。随着压力的增加，K2OsCl6 在 9.5(3) GPa 以上经历一系列从常压立方相到四方 (P4/mnc) 相的结构转变，然后从大约 14.2 GPa 开始转变到单斜 (P21/n) 相。四方相和单斜相在 14.2-17.2 GPa 的压力范围内共存，而单斜相在 17.9 GPa 下观察到为唯一相，并且在所研究的最大压力下保持稳定。衍射曲线和晶胞参数的分析表明，中间四方结构可能与应力引起的对称性降低有关，而不是与独特的热力学相有关。这种变形由四方 P4/mnc 空间群充分描述，归因于压力传输介质产生的非静水偏应力。\n\n状态方程分析揭示了结构转变过程中压缩性的显着降低，体积模量从立方相的 26(2) GPa 增加到单斜相的 71(3) GPa。尽管 K2OsCl6 中的转变发生在较低的压力下，但压力诱导的结构序列与报道的相关化合物（例如 K2IrCl6）的结构序列类似。所有结构转变在减压时都是可逆的。", "authors": [{"name": "Neha Bura"}, {"name": "Peije Zhang"}, {"name": "Ganesh Bera"}, {"name": "Catalin Popescu"}, {"name": "Caleb J. Bennett"}, {"name": "Brendan J. Kennedy"}, {"name": "Daniel Errandonea"}], "featured_authors": [{"name": "Neha Bura"}, {"name": "Peije Zhang"}, {"name": "Ganesh Bera"}, {"name": "Caleb J. Bennett"}, {"name": "Brendan J. Kennedy"}, {"name": "Daniel Errandonea"}], "author_count": 7}, {"id": "2610.25945", "category": "cond-mat", "title": "Effect of chirality on active elastomers and solids in three dimensions", "abstract": "We examine the effect of chiral activity on nematic and polar uniaxial elastomers and solids by constructing the general hydrodynamic equations for these phases. We start with the elastomer, which is not only invariant under rigid rotations but also under an independent rotation of the uniaxial direction, and show that this higher symmetry strongly constrains the effects of chiral activity. We then break the elastomeric symmetry by adding a symmetry-breaking term to the free energy but still retain invariance under rigid rotations. The resulting state has the symmetry of a uniaxial solid, and we show that in a fixed background medium chiral activity generically destabilises it. The force density responsible for this {instability} vanishes as the field that breaks the elastomeric symmetry goes to zero. Further, the presence of the symmetry-breaking field also allows for an additional odd elastic force density that generically destabilises momentum-conserved chiral and uniaxial solids in the inertial regime.", "url": "https://arxiv.org/abs/2610.25945", "type": "理论", "summary": "我们通过构建这些相的一般流体动力学方程来研究手性活性对向列相和极性单轴弹性体和固体的影响。我们从弹性体开始，它不仅在刚性旋转下不变，而且在单轴方向的独立旋转下不变，并表明这种更高的对称性强烈限制了手性活性的影响。然后，我们通过向自由能添加对称破缺项来打破弹性对称性，但在刚性旋转下仍然保持不变性。所得状态具有单轴固体的对称性，我们表明在固定背景介质中手性活动通常会使其不稳定。当破坏弹性体对称性的场变为零时，导致这种{不稳定性}的力密度消失。此外，对称破缺场的存在还允许额外的奇数弹力密度，这通常会破坏惯性区域中动量守恒的手性和单轴固体的稳定性。", "authors": [{"name": "S. J. Kole"}, {"name": "Gareth P. Alexander"}, {"name": "Ananyo Maitra"}, {"name": "Sriram Ramaswamy"}], "featured_authors": [{"name": "S. J. Kole"}, {"name": "Gareth P. Alexander"}, {"name": "Ananyo Maitra"}, {"name": "Sriram Ramaswamy"}], "author_count": 4}, {"id": "2610.25953", "category": "cond-mat", "title": "Chirality destroys oriented active solids", "abstract": "We construct a hydrodynamic theory of the effect of chiral and active force densities on three-dimensional uniaxial solids. We show that in a fixed background medium active chiral force densities---that arise at lower order in gradients than odd elasticity---generically destabilise the solid state. We further show this active instability also affects isotropic chiral solids in an anisotropic medium, a situation that is relevant for cell clusters moving through the extracellular matrix. Interestingly, the instability is eliminated in a higher-symmetry solid, known as the polar elastomer; indeed, we show that chirality does not affect the leading-order mechanics of such materials. We further demonstrate that momentum-conserving polar active solids have two chiral odd elasticities in contrast to the one discussed for two-dimensional solids. However, we again find that the higher symmetry of polar elastomers eliminates one of these with the remaining one being equivalent to the two-dimensional odd elastic force density. Our results should apply to numerous biological and condensed matter systems.", "url": "https://arxiv.org/abs/2610.25953", "type": "理论", "summary": "我们构建了手性力和主动力密度对三维单轴固体影响的流体动力学理论。我们表明，在固定背景介质中，主动手性力密度（其梯度比奇弹性低阶出现）通常会破坏固态的稳定性。我们进一步表明，这种主动不稳定性也会影响各向异性介质中的各向同性手性固体，这种情况与穿过细胞外基质的细胞簇相关。有趣的是，在更高对称性的固体（称为极性弹性体）中，不稳定性被消除了。事实上，我们表明手性不会影响此类材料的主序力学。我们进一步证明，动量守恒极性活性固体具有两种手性奇弹性，与二维固体的讨论相反。然而，我们再次发现，极性弹性体的较高对称性消除了其中之一，剩下的一个相当于二维奇弹力密度。我们的结果应该适用于许多生物和凝聚态物质系统。", "authors": [{"name": "S. J. Kole"}, {"name": "Gareth P. Alexander"}, {"name": "Ananyo Maitra"}, {"name": "Sriram Ramaswamy"}], "featured_authors": [{"name": "S. J. Kole"}, {"name": "Gareth P. Alexander"}, {"name": "Ananyo Maitra"}, {"name": "Sriram Ramaswamy"}], "author_count": 4}, {"id": "2610.26012", "category": "cond-mat", "title": "Methods of density functional theory in one dimension", "abstract": "Density functional theory is formally justified by an existence proof. As such, the need for computational methods to study the theory is a useful route to understanding the full theory. In this paper, we discuss the numerical strategies to efficiently evaluate computations for Kohn-Sham systems in one dimension and also methods for determining exact properties, including time-dependence. An accompanying library is also available for computing one-dimensional density functional theory and publicly available. The expressions used to implement the density functional in one-dimension are surveyed. An alternative justification for a gradient-based technique is also shown that can be applied to time-dependent evolution of the exact Kohn-Sham potential.", "url": "https://arxiv.org/abs/2610.26012", "type": "理论+数值", "summary": "密度泛函理论通过存在性证明得到形式上的证明。因此，需要使用计算方法来研究理论，这是理解完整理论的有用途径。在本文中，我们讨论了有效评估一维 Kohn-Sham 系统计算的数值策略，以及确定精确属性（包括时间依赖性）的方法。附带的库也可用于计算一维密度泛函理论并公开可用。研究了用于实现一维密度泛函的表达式。还显示了基于梯度的技术的另一种理由，该技术可以应用于精确 Kohn-Sham 势的时间相关演化。", "authors": [{"name": "Thomas E. Baker"}, {"name": "Kasey Chen"}], "featured_authors": [{"name": "Thomas E. Baker"}, {"name": "Kasey Chen"}], "author_count": 2}, {"id": "2610.26053", "category": "cond-mat", "title": "Gini coefficient of scientists and universities", "abstract": "Using the public database of Google Scholar article citations of scientists and universities we apply the algorithm for constructing Lorenz curves to the resulting citation distributions. Using Lorenz and Pareto curves, broadly used for economic analyses of wealth inequality across countries, we show that this approach gives a useful insight of citation distributions of world-leading scientists characterized by the Gini coefficient $G$ obtained from the Lorenz curves. For articles of 15 Nobel laureates (including A. Einstein and R. Feynman) we find the average $G=0.81$ with 50% of articles capturing only 2.7% of all citations and the top 10% (1%) of articles capturing 71% (30%) of all citations. Furthmore, we determine for world-leading universities the Gini coefficient via the citations of affiliated scientists. We show that about 65 percent of all citations belonging to a university (e.g. Princeton, Cambridge) are generated only by 10 percent of their university scientists while 50% of scientists produce only 3% of all university citations. The citation distributions are well described by the concept of Rayleigh-Jeans thermalization and condensation with similarities traced to the world wealth inequality.", "url": "https://arxiv.org/abs/2610.26053", "type": "数值", "summary": "使用科学家和大学的 Google Scholar 文章引用的公共数据库，我们将构建洛伦兹曲线的算法应用于所得的引用分布。使用广泛用于各国财富不平等经济分析的洛伦兹和帕累托曲线，我们表明，这种方法提供了对世界领先科学家的引用分布的有用见解，其特征是从洛伦兹曲线获得的基尼系数 $G$。对于 15 位诺贝尔奖获得者（包括 A. Einstein 和 R. Feynman）的文章，我们发现平均 $G=0.81$，其中 50% 的文章仅获得所有引用的 2.7%，而前 10% (1%) 的文章则获得所有引用的 71% (30%)。此外，我们通过附属科学家的引用确定世界领先大学的基尼系数。我们发现，一所大学（例如普林斯顿大学、剑桥大学）的所有引用中，约 65% 仅由其大学科学家的 10% 产生，而 50% 的科学家仅产生所有大学引用的 3%。\n\n瑞利-吉恩斯热化和凝结的概念很好地描述了引文分布，并与世界财富不平等有相似之处。", "authors": [{"name": "Klaus M. Frahm"}, {"name": "Dima L. Shepelyansky"}], "featured_authors": [{"name": "Klaus M. Frahm"}, {"name": "Dima L. Shepelyansky"}], "author_count": 2}, {"id": "2610.26057", "category": "cond-mat", "title": "Magnetoelectric Bulk Photovoltaic Effect in Centrosymmetric Solids", "abstract": "It is commonly believed that a bulk photovoltaic current requires broken spatial inversion symmetry. However, in this work, we demonstrate that dc photocurrents can arise in centrosymmetric solids from the bilinear coupling between the electric and magnetic components of light. This magnetoelectric bulk photovoltaic effect (MBPE) has a quantum-geometric origin in the dipole moments of the Zeeman quantum metric and Zeeman Berry curvature. We identify four distinct MBPE mechanisms, including time-reversal-even and time-reversal-odd injection-like and shift-like photocurrents driven by linearly or circularly polarized light. Our symmetry analysis shows that the MBPE is allowed in broad classes of two-dimensional centrosymmetric nonmagnetic and magnetic materials under normally incident light. As representative examples, we predict sizable MBPEs in centrosymmetric monolayer Pt$_2$HgSe$_3$ and altermagnetic RuF$_4$, with current densities on the order of $1~\\mathrm{mA/m}$. Notably, the injection-like photocurrent in RuF$_4$ reverses sign upon switching either the light helicity or the Néel vector. Our results extend the bulk photovoltaic effect to centrosymmetric solids and open new opportunities for electrical readout of altermagnetic order.", "url": "https://arxiv.org/abs/2610.26057", "type": "理论", "summary": "人们普遍认为，大容量光伏电流需要打破空间反演对称性。然而，在这项工作中，我们证明了中心对称固体中可以因光的电分量和磁分量之间的双线性耦合而产生直流光电流。这种磁电体光伏效应 (MBPE) 在塞曼量子度量和塞曼贝里曲率的偶极矩中具有量子几何起源。我们确定了四种不同的 MBPE 机制，包括由线性或圆偏振光驱动的时间反转偶数和时间反转奇数注入和移位光电流。我们的对称性分析表明，在法向入射光下，MBPE 可以用于多种二维中心对称非磁性和磁性材料。作为代表性例子，我们预测中心对称单层 Pt$_2$HgSe$_3$ 和交变磁 RuF$_4$ 中存在相当大的 MBPE，电流密度约为 $1~\\mathrm{mA/m}$。值得注意的是，RuF$_4$ 中的类注入光电流在切换光螺旋性或尼尔矢量时会反转符号。\n\n我们的研究结果将体光伏效应扩展到中心对称固体，并为交变磁序的电读出开辟了新的机会。", "authors": [{"name": "Longjun Xiang"}, {"name": "Fuming Xu"}, {"name": "Lei Zhang"}, {"name": "Jian Wang"}], "featured_authors": [{"name": "Longjun Xiang"}, {"name": "Fuming Xu"}, {"name": "Lei Zhang"}, {"name": "Jian Wang"}], "author_count": 4}, {"id": "2610.26076", "category": "cond-mat", "title": "A project of the thermal triple axis spectrometer at the PIK reactor", "abstract": "A project of the novel thermal triple axis spectrometer IN1 at the PIK reactor is presented. Monte Carlo simulations were used for optimization its main parameters. The optimization of the instrument gives an estimated neutron flux as high as 109 n/cm2/s at the sample position at neutron energy about 36 meV at the designed 100 MW power. The modelling of neutron stages like monochromators, analyzers, virtual source, as well as instrument shielding was fulfilled to obtain the best performance of the spectrometer.", "url": "https://arxiv.org/abs/2610.26076", "type": "理论+数值", "summary": "介绍了 PIK 反应堆上新型热三轴光谱仪 IN1 的项目。采用蒙特卡罗模拟对其主要参数进行优化。仪器的优化给出了样品位置处的估计中子通量高达 109 n/cm2/s，中子能量约为 36 meV，设计功率为 100 MW。完成了单色仪、分析仪、虚拟源以及仪器屏蔽等中子级的建模，以获得谱仪的最佳性能。", "authors": [{"name": "Maria Iuzviuk"}, {"name": "Nikita Kovalenko"}, {"name": "Vladislav Tolichev"}, {"name": "Aleksandr Ovsianikov"}, {"name": "Oleg Usmanov"}, {"name": "Anna Matveeva"}, {"name": "Igor Zobkalo"}, {"name": "Vladislav Tarnavich"}], "featured_authors": [{"name": "Maria Iuzviuk"}, {"name": "Nikita Kovalenko"}, {"name": "Vladislav Tolichev"}, {"name": "Anna Matveeva"}, {"name": "Igor Zobkalo"}, {"name": "Vladislav Tarnavich"}], "author_count": 8}, {"id": "2610.26129", "category": "cond-mat", "title": "Generalised Fluctuating Dynamic Density-Functional Theory: Derivation and Applications", "abstract": "Classical density-functional theory is a powerful theoretical framework for studying the equilibrium density distribution of complex many-body systems. The core of the framework is to bridge microscopic and macroscopic descriptions of fluids through a variational principle that minimises the system's free energy. For dynamical settings, dynamic DFT (DDFT) extends the equilibrium framework to capture the time evolution of an order parameter, typically density. However, DDFT is often insufficient for mesoscopic systems far from equilibrium where fluctuations become significant, necessitating a stochastic extension: fluctuating DDFT. Here we derive a generalised FDDFT from first principles starting from the microscopic Hamiltonian dynamics using coarse-graining techniques, including Zwanzig's projection operator method. The resulting FDDFT applies to arbitrary observable fields, where the dynamics are driven by a thermodynamic force expressed in terms of an entropy functional. The dynamics consist of reversible, dissipative, and stochastic contributions, each directly linked to the underlying microscopic dynamics via the Liouville operator, Green-Kubo relations, and the fluctuation-dissipation theorem. To highlight the difference in the level of description between DDFT and FDDFT, we demonstrate how further coarse-graining via averaging leads to a generalised DDFT, valid at the macroscale. To showcase the effectiveness and utility of the generalised FDDFT, we apply it to two prototypical fluid systems: colloidal and simple viscous fluids. In the former case, we utilise the new formalism to re-derive the recently found colloidal FDDFT. In the latter case, we rigorously recover the non-isothermal extension of the Landau-Lifshitz fluctuating Navier-Stokes equations, providing fundamental derivation of this well-known phenomenological model, enabling to clarify its underlying principles.", "url": "https://arxiv.org/abs/2610.26129", "type": "理论+数值", "summary": "经典密度泛函理论是研究复杂多体系统平衡密度分布的强大理论框架。该框架的核心是通过最小化系统自由能的变分原理来连接流体的微观和宏观描述。对于动态设置，动态 DFT (DDFT) 扩展了平衡框架以捕获有序参数（通常是密度）的时间演化。然而，对于远离平衡状态且波动变得显着的介观系统，DDFT 通常是不够的，需要随机扩展：波动 DDFT。在这里，我们使用粗粒度技术（包括 Zwanzig 的投影算子方法）从微观哈密顿动力学出发，根据第一原理推导了广义 FDDFT。由此产生的 FDDFT 适用于任意可观测场，其中动力学由以熵泛函表示的热力学驱动。\n\n动力学由可逆、耗散和随机贡献组成，每个贡献都通过刘维尔算子、Green-Kubo 关系和波动耗散定理与潜在的微观动力学直接相关。为了强调 DDFT 和 FDDFT 之间描述水平的差异，我们演示了如何通过平均进一步粗粒度导致在宏观尺度上有效的广义 DDFT。为了展示广义 FDDFT 的有效性和实用性，我们将其应用于两种典型的流体系统：胶体和简单粘性流体。在前一种情况下，我们利用新的形式主义重新推导了最近发现的胶体FDDFT。在后一种情况下，我们严格地恢复了朗道-利夫希茨涨落纳维-斯托克斯方程的非等温扩张，提供了这个著名的唯象模型的基本推导，从而能够阐明其基本原理。", "authors": [{"name": "Toby Kay"}, {"name": "Serafim Kalliadasis"}], "featured_authors": [{"name": "Toby Kay"}, {"name": "Serafim Kalliadasis"}], "author_count": 2}, {"id": "2610.26135", "category": "cond-mat", "title": "Evidence of valence bond solid and quantum paramagnetism in the $J_1$--$J_2$--$J_3$ Heisenberg model from pseudofermion functional renormalization group", "abstract": "Motivated by recent tensor network studies reporting a quantum spin liquid (QSL) within the quantum paramagnetic (QP) regime, we investigate numerically the zero-temperature phase diagram of the $J_1$--$J_2$--$J_3$ Heisenberg model on the square lattice using the pseudofermion functional renormalization group (pf-fRG). Thanks to improved frequency resolution and larger lattice truncations, we are able to explore a significantly larger parameter space than previous pf-fRG work to map out the phase boundary of an extended QP region. We further resolve possible bond order within the QP regime by measuring the dimer response to small deformations in $J_1$, i.e. bond anisotropy that breaks the point-group symmetry of the Hamiltonian. The functional renormalization group flow of the dimer susceptibility suggests that the QP window splits into two: a region where it grows continuously down to the lowest energy scale to signal valence bond solid (VBS) order, and another region where it reaches a peak at a finite scale and is subsequently suppressed to indicate a QSL.", "url": "https://arxiv.org/abs/2610.26135", "type": "理论+数值", "summary": "受最近报告量子顺磁 (QP) 范围内的量子自旋液体 (QSL) 的张量网络研究的启发，我们使用赝费米子泛函重正化群 (pf-fRG) 对方晶格上 $J_1$--$J_2$--$J_3$ 海森堡模型的零温度相图进行了数值研究。由于频率分辨率的提高和更大的晶格截断，我们能够探索比之前的 pf-fRG 工作大得多的参数空间，以绘制扩展 QP 区域的相边界。我们通过测量 $J_1$ 中小变形的二聚体响应，即打破哈密顿量的点群对称性的键各向异性，进一步解决 QP 体系内可能的键序。二聚体敏感性的功能重整化群流表明，QP 窗口分裂为两个：一个区域连续生长到最低能量尺度以发出价键固体 (VBS) 顺序的信号，另一个区域在有限尺度上达到峰值并随后被抑制以指示 QSL。", "authors": [{"name": "Gün Günal"}, {"name": "Erhai Zhao"}, {"name": "Ahmet Keleş"}], "featured_authors": [{"name": "Gün Günal"}, {"name": "Erhai Zhao"}, {"name": "Ahmet Keleş"}], "author_count": 3}, {"id": "2610.26149", "category": "cond-mat", "title": "Motility-Induced Phase Separation of Run-and-Tumble Particles under Local Stochastic Resetting", "abstract": "We investigate the non-equilibrium stationary states of a one-dimensional active gas composed of run-and-tumble particles (RTPs) undergoing motility-induced phase separation (MIPS) and subjected to local stochastic resetting at the origin. Unlike global resetting, local resetting maintains a mass-injection flux at the origin while preserving large-scale spatial self-organization. We demonstrate that above a critical resetting rate $r_c$, the active system undergoes a transition toward a stationary two-phase state featuring a dense liquid droplet centered at the origin coexisting with a surrounding gas phase. Using kinetic evolution equations, we derive the exact steady-state density profile expressed in terms of the Lambert function. The size of the droplet has a non-monotonic dependence on the resetting rate $r$, and attains its maximum. Furthermore, we analyze the dynamical stability of the supersaturated gas phase and show that a nucleated droplet relaxes exponentially toward its steady-state size with a relaxation timescale of $1/r$. We extend our framework to model a finite resetting velocity, proving that the stationary droplet size is invariant with respect to the resetting velocity.", "url": "https://arxiv.org/abs/2610.26149", "type": "理论", "summary": "我们研究了由运行和翻滚粒子（RTP）组成的一维活性气体的非平衡静止态，该气体经历了运动诱导相分离（MIPS）并在原点进行了局部随机重置。与全局重置不同，局部重置在原点保持质量注入通量，同时保留大规模空间自组织。我们证明，在临界重置速率 $r_c$ 之上，主动系统会经历向静止两相状态的转变，该状态具有以原点为中心的致密液滴与周围气相共存。使用动力学演化方程，我们推导出以兰伯特函数表示的精确稳态密度分布。液滴的尺寸对复位速率$r$具有非单调依赖性，并达到最大值。此外，我们分析了过饱和气相的动态稳定性，并表明有核液滴以指数方式弛豫到其稳态尺寸，弛豫时间尺度为 $1/r$。\n\n我们扩展了我们的框架来模拟有限的重置速度，证明静止液滴尺寸相对于重置速度是不变的。", "authors": [{"name": "Pascal Grange"}], "featured_authors": [{"name": "Pascal Grange"}], "author_count": 1}, {"id": "2610.26277", "category": "cond-mat", "title": "Finite-size scaling of spin-wave scattering and enhancement in magnonic Fabry-Pérot nanoresonators", "abstract": "Magnonic neural networks require compact resonant nodes that scatter spin waves efficiently, concentrate spin-wave energy and can be reconfigured. Hybrid magnonic Fabry-Pérot resonators, formed by a ferromagnetic-metal stripe dipolar-coupled to a yttrium iron garnet (YIG) film, provide low-loss and programmable control of spin-wave transmission, but have so far been studied only for stripes that are long compared with the spin-wave wavelength. Here we use micromagnetic simulations to determine how the response of a 200-nm-wide CoFeB stripe on a 55-nm-thick YIG film evolves as the stripe length is reduced from infinity to 640 nm. An infinitely long stripe acts as a one-dimensional cavity that opens a transmission gap at the first-order resonance (1.70 GHz and 1.47 GHz for the parallel and antiparallel magnetic configuration) and enhances the out-of-plane precession amplitude in the YIG film by factors of about 5 and 12, without distorting the transmitted wavefront. For lengths of a few micrometers, backward-volume spin waves emitted from the stripe ends modulate the precession along the stripe and fragment the reflected and transmitted wavefronts. Below about 1.2 micrometer, the resonator scatters incident spin waves over the entire isofrequency contour of the film, with caustic beams that are most pronounced in the antiparallel configuration. In this regime the parallel configuration supports weakly enhanced quantized modes, whereas the antiparallel configuration supports a single mode with an out-of-plane enhancement of about 15. The width, thickness and shape of the stripe tune this mode by 50-100 MHz, and its strong enhancement lowers the onset of nonlinear frequency shift and fold-over to incident amplitudes of a few percent of the saturation magnetization. Sub-micrometer magnonic resonators are therefore promising reconfigurable nonlinear nodes for magnonic networks.", "url": "https://arxiv.org/abs/2610.26277", "type": "数值", "summary": "磁神经网络需要紧凑的谐振节点，能够有效地散射自旋波、集中自旋波能量并且可以重新配置。混合磁波法布里-珀罗谐振器由偶极耦合到钇铁石榴石 (YIG) 薄膜的铁磁金属条形成，可提供自旋波传输的低损耗和可编程控制，但迄今为止仅针对与自旋波波长相比较长的条进行研究。在这里，我们使用微磁模拟来确定 55 nm 厚的 YIG 薄膜上 200 nm 宽的 CoFeB 条带的响应如何随着条带长度从无穷大减小到 640 nm 而变化。无限长的条带充当一维腔，在一阶谐振（平行和反平行磁配置为 1.70 GHz 和 1.47 GHz）处打开传输间隙，并将 YIG 薄膜中的面外进动幅度增强约 5 和 12 倍，而不会扭曲传输波前。对于几微米的长度，从条纹末端发射的后向体积自旋波调制沿条纹的进动并使反射和透射波前破碎。\n\n在约 1.2 微米以下，谐振器将入射自旋波散射到薄膜的整个等频轮廓上，焦散光束在反平行配置中最为明显。在这种情况下，并行配置支持弱增强的量化模式，而反并行配置支持面外增强约为 15 的单一模式。条带的宽度、厚度和形状将该模式调整 50-100 MHz，其强增强降低了非线性频移和折叠到饱和磁化强度百分之几的入射幅度的开始。因此，亚微米磁波谐振器是用于磁波网络的有前途的可重构非线性节点。", "authors": [{"name": "Anton Lutsenko"}, {"name": "Sebastiaan van Dijken"}], "featured_authors": [{"name": "Anton Lutsenko"}, {"name": "Sebastiaan van Dijken"}], "author_count": 2}, {"id": "2610.26301", "category": "cond-mat", "title": "Machine Learning-Assisted Discovery of Carbon-Related Defect Formation Mechanisms in Diamond", "abstract": "Diamond is an important host material for functional defects such as solid-state spin qubits. During the defect creation by irradiation and subsequent thermal annealing, carbon-related defects, including vacancies and interstitials, are generated and can migrate to form new defect complexes. To investigate this kinetically driven process and reveal the formation mechanisms of the di-interstitials and di-vacancies in the neutral charge state, we fine-tuned a universal machine learning interatomic potential using a small dataset generated from density functional theory calculations. We obtained a barrier of 1.84 eV for mono-interstitial migration and found that two initially separated mono-interstitials only need to overcome a lower barrier to form di-interstitial configurations. Beyond the training data, the MLIP also identified the formation pathway for an additional di-interstitial configuration and a stepwise divacancy dissociation mechanism. These results reveal migration-assisted defect complex formation mechanisms and demonstrate how targeted MLIP training can identify reaction pathways.", "url": "https://arxiv.org/abs/2610.26301", "type": "理论+数值", "summary": "金刚石是固态自旋量子位等功能缺陷的重要主体材料。在通过辐射和随后的热退火产生缺陷的过程中，会产生与碳相关的缺陷，包括空位和填隙，并且可以迁移形成新的缺陷复合体。为了研究这种动力学驱动的过程并揭示中性电荷态双填隙和双空位的形成机制，我们使用密度泛函理论计算生成的小数据集对通用机器学习原子间势进行了微调。我们获得了单填隙迁移的势垒为 1.84 eV，并发现两个最初分离的单填隙只需克服较低的势垒即可形成双填隙构型。除了训练数据之外，MLIP 还确定了额外的双间隙构型和逐步双空位解离机制的形成途径。这些结果揭示了迁移辅助缺陷复合体形成机制，并证明了有针对性的 MLIP 训练如何识别反应途径。", "authors": [{"name": "Grace Huang"}, {"name": "Christopher Fivecoat"}, {"name": "Xun Xu"}, {"name": "Mengen Wang"}], "featured_authors": [{"name": "Grace Huang"}, {"name": "Christopher Fivecoat"}, {"name": "Xun Xu"}, {"name": "Mengen Wang"}], "author_count": 4}, {"id": "2610.26316", "category": "cond-mat", "title": "Poisson-shot-noise induced escape dynamics of a passive particle and a dimer", "abstract": "Mean First Passage Time (MFPT) is a crucial quantity that characterizes stochastic processes in various stochastic dynamical systems across different disciplines. The inverse of the MFPT, known as the escape rate, is helpful in the context of Brownian motion and chemical processes. The MFPT dynamics of a passive particle in the presence of active noises presents a fascinating avenue. In this work, we study the dynamics of two different systems: first, a single Brownian particle and second, a dimer (two Brownian particles connected by a spring). In both cases, the systems are kept in contact with a thermal bath and an active bath, and are trapped in a bistable potential. The active bath produces kicks that follow the Poisson distribution. The MFPT of the particle and the dimer is investigated in various scenarios. Analytical results are presented for the small kick variance approximation only. In this approximation, we formulate the MFPT in two scaling regimes: a weak-noise regime characterized by classical Arrhenius scaling for escape rate and a strong-noise regime in which the MFPT scales as a power law in the effective noise strength. For the general case, the problem is solved numerically. Next, under the same approximation, the MFPT of a dimer in the small-bond-strength regime is studied using a sequential-hopping mechanism, and in the large-bond-strength regime, the MFPT is formulated using the adiabatic elimination approach. Motivated by recent studies on speeding up the escape mechanism, the MFPT of the particle and the dimer in the presence of an intermediate barrier is also examined. We deduced from the numerical results that the MFPT can be enhanced and further optimized by selecting a suitable intermediate potential profile.", "url": "https://arxiv.org/abs/2610.26316", "type": "数值", "summary": "平均首次通过时间 (MFPT) 是表征不同学科的各种随机动力系统中随机过程的关键量。 MFPT 的倒数（称为逃逸率）在布朗运动和化学过程中很有帮助。存在主动噪声时被动粒子的 MFPT 动力学提供了一条令人着迷的途径。在这项工作中，我们研究了两个不同系统的动力学：第一个是单个布朗粒子，第二个是二聚体（通过弹簧连接的两个布朗粒子）。在这两种情况下，系统都保持与热浴和活性浴接触，并陷入双稳态电位。主动浴产生遵循泊松分布的踢动。在各种情况下研究了颗粒和二聚体的 MFPT。仅针对小冲击方差近似提供分析结果。在这个近似中，我们在两个标度范围内制定了 MFPT：弱噪声范围，以逃逸率的经典阿伦尼乌斯标度为特征；强噪声范围，其中 MFPT 按照有效噪声强度的幂律进行标度。\n\n对于一般情况，问题是通过数值求解的。接下来，在相同的近似下，使用顺序跳跃机制研究了小键强度区域中二聚体的MFPT，并且在大键强度区域中，使用绝热消除方法制定了MFPT。受最近关于加速逃逸机制的研究的启发，还检查了存在中间屏障的情况下粒子和二聚体的 MFPT。我们从数值结果中推断出，通过选择合适的中间电势分布可以增强并进一步优化 MFPT。", "authors": [{"name": "Gemeit Goel"}, {"name": "Rahul Marathe"}], "featured_authors": [{"name": "Gemeit Goel"}, {"name": "Rahul Marathe"}], "author_count": 2}, {"id": "2610.26328", "category": "cond-mat", "title": "High-order resonances and emergent coherent dynamics in interacting Stark chains", "abstract": "A linear potential gradient can strongly suppress quantum dynamics, while interactions can activate resonant many-body processes whose higher-order structure remains largely unexplored. Here we uncover a systematic hierarchy of high-order interaction--tilt resonances in an interacting Stark chain, where the resonance order counts the minimal number of elementary exchange steps involved. These resonances manifest as long-lived coherent oscillations with order-dependent timescales. By isolating individual resonant channels and developing a microscopic effective description, we connect these dynamical timescales to the underlying many-body exchange processes and reveal a pronounced dependence on the initial-state structure. Our results provide crucial insights into high-order many-body resonances and show how commensurate interaction-to-tilt ratios generate a hierarchy of parametrically slow coherent many-body dynamics.", "url": "https://arxiv.org/abs/2610.26328", "type": "理论", "summary": "线性势梯度可以强烈抑制量子动力学，而相互作用可以激活共振多体过程，其高阶结构在很大程度上仍未被探索。在这里，我们揭示了高阶相互作用的系统层次结构——相互作用的斯塔克链中的倾斜共振，其中共振阶数计算所涉及的基本交换步骤的最小数量。这些共振表现为具有阶数相关时间尺度的长寿命相干振荡。通过隔离各个共振通道并开发微观有效描述，我们将这些动态时间尺度与潜在的多体交换过程联系起来，并揭示了对初始状态结构的明显依赖性。我们的结果提供了对高阶多体共振的重要见解，并展示了相应的相互作用与倾斜比如何产生参数化缓慢相干多体动力学的层次结构。", "authors": [{"name": "Jiahe Chang"}, {"name": "Hongzheng Zhao"}], "featured_authors": [{"name": "Jiahe Chang"}, {"name": "Hongzheng Zhao"}], "author_count": 2}, {"id": "2610.26356", "category": "cond-mat", "title": "Origins of Faceted Anomalous Scaling", "abstract": "Fluctuating interfaces are typically characterized by their global, spectral, and local roughness exponents. Faceted anomalous scaling, characterized by $\\alpha_s>1$, $\\alpha_s\\neq\\alpha$, and $\\alpha_{\\mathrm{loc}}=1$, owes its name to the tendency of such interfaces to develop long, nearly linear segments called facets. Its statistical origin, and whether facets are required, have remained unclear. We show that this exponent structure is determined by the spatial statistics of the slope field. Slope increments split into typical fluctuations and rare, larger jumps. This anomalous scaling arises either when the typical slope increment displays genuine system-size-dependent anomalous scaling or when the rare jumps dominate the second moment. The two contributions can coexist, and their competition leads to bifractal scaling of the slopes. We establish this framework analytically in the generalized anharmonic Larkin model and the columnar Kardar--Parisi--Zhang equation, and we derive exactly the global, spectral, and local roughness exponents in both cases. The Larkin model realizes both mechanisms and produces anomalous interfaces with or without facets, whereas columnar KPZ belongs to the jump-dominated case and yields $\\alpha_s=3/2$.", "url": "https://arxiv.org/abs/2610.26356", "type": "理论", "summary": "波动界面通常由其全局、光谱和局部粗糙度指数来表征。分面异常缩放，其特征为 $\\alpha_s>1$、$\\alpha_s\\neq\\alpha$ 和 $\\alpha_{\\mathrm{loc}}=1$，其名称源于此类界面倾向于发展称为分面的长的、接近线性的段。其统计起源以及是否需要方面仍不清楚。我们证明这种指数结构是由斜率场的空间统计决定的。斜率增量分为典型的波动和罕见的较大跳跃。当典型的斜率增量显示真正的依赖于系统尺寸的异常缩放时，或者当罕见的跳跃占主导地位的第二时刻时，就会出现这种异常缩放。这两种贡献可以共存，它们的竞争导致斜率的双分形缩放。我们在广义非调和拉金模型和柱状 Kardar-Parisi--Zhang 方程中分析性地建立了这个框架，并且我们准确地推导出两种情况下的全局、谱和局部粗糙度指数。\n\nLarkin 模型实现了这两种机制并产生带或不带面的异常界面，而柱状 KPZ 属于跳跃主导的情况并产生 $\\alpha_s=3/2$。", "authors": [{"name": "Maximilien Bernard"}, {"name": "José Luis Iguain"}, {"name": "Alejandro Kolton"}, {"name": "Alberto Rosso"}], "featured_authors": [{"name": "Maximilien Bernard"}, {"name": "José Luis Iguain"}, {"name": "Alejandro Kolton"}, {"name": "Alberto Rosso"}], "author_count": 4}, {"id": "2610.26371", "category": "cond-mat", "title": "An infinite sequence of higher order Ehrenfest transitions in a one-dimensional crystal", "abstract": "Higher-order Ehrenfest phase transitions are exceptionally rare and poorly understood. We present an exactly solvable one-dimensional model exhibiting a sequence of Ehrenfest transitions of arbitrary $n\\geq2$ order. These transitions occur without symmetry breaking and even the second-order transition lacks conventional critical behavior, although the density derivative of the correlation length diverges. Our results reveal a distinct class of noncritical phase transitions and help clarify the scope of the Ehrenfest classification.", "url": "https://arxiv.org/abs/2610.26371", "type": "理论", "summary": "高阶埃伦菲斯特相变非常罕见，而且人们对其知之甚少。我们提出了一个完全可解的一维模型，该模型展示了任意 $n\\geq2$ 阶的 Ehrenfest 转换序列。这些转变的发生没有对称性破缺，甚至二阶转变也缺乏传统的临界行为，尽管相关长度的密度导数有所不同。我们的结果揭示了一类独特的非临界相变，并有助于阐明埃伦菲斯特分类的范围。", "authors": [{"name": "Sakineh Mizani"}, {"name": "Szabolcs Varga"}, {"name": "Martin Oettel"}, {"name": "Péter Gurin"}], "featured_authors": [{"name": "Sakineh Mizani"}, {"name": "Szabolcs Varga"}, {"name": "Martin Oettel"}, {"name": "Péter Gurin"}], "author_count": 4}, {"id": "2610.26502", "category": "cond-mat", "title": "Atomic-level study of dose-dependent lattice thermal conductivity degradation in irradiated tungsten", "abstract": "Plasma-facing components (PFCs) in future fusion reactors must withstand extreme environments, making tungsten (W) a prime candidate material due to its high thermal conductivity, high melting temperature, low sputtering yield, low tritium absorption. However, neutron irradiation introduces complex nanostructural defects that severely degrade these critical properties. In this work, we use Non-Equilibrium Molecular Dynamics (NEMD) simulations coupled with the Creation Relaxation Algorithm (CRA) to investigate the lattice thermal conductivity (kappa) of W across a wide range of irradiation doses. Systems treated with different doses up to 1.8 canonical displacements per atom (cdpa) were simulated to generate and study diverse defect structures, including vacancies and self-interstitial atom (SIA) clusters. By correlating spatially-resolved temperature gradients with local defect concentrations, we show that even small changes in defect type and distribution significantly affect thermal transport. We employ Machine Learning (ML) models to develop a quantitative relationship between the defect features and the resulting thermal conductivity degradation. The ML analysis identifies vacancy density as the dominant structural factor controlling thermal transport. We found a significant, nonlinear suppression of kappa with increasing defect density. Predictive multi-defect mapping built upon our ML model resolved a step-like degradation transition at a critical vacancy threshold of 0.05 at.%, beyond which phonon scattering completely saturated and capped the maximum relative lattice thermal conductivity degradation at approximately 30 at.%. This integrated simulation and ML approach provides a powerful, predictive framework for quantifying the complex relationship between structure and thermal conductivity in irradiated fusion materials.", "url": "https://arxiv.org/abs/2610.26502", "type": "理论+数值", "summary": "未来聚变反应堆中的面向等离子体组件（PFC）必须能够承受极端环境，因此钨（W）因其高导热性、高熔化温度、低溅射率、低氚吸收率而成为主要候选材料。然而，中子辐照引入了复杂的纳米结构缺陷，严重降低了这些关键性能。在这项工作中，我们使用非平衡分子动力学 (NEMD) 模拟与创造弛豫算法 (CRA) 相结合来研究 W 在各种辐照剂量下的晶格热导率 (kappa)。模拟用不同剂量处理的系统，最高可达每原子 1.8 规范位移 (cdpa)，以生成和研究不同的缺陷结构，包括空位和自填隙原子 (SIA) 簇。通过将空间分辨温度梯度与局部缺陷浓度相关联，我们发现即使缺陷类型和分布的微小变化也会显着影响热传输。我们采用机器学习 (ML) 模型来开发缺陷特征与由此产生的热导率下降之间的定量关系。\n\nML 分析将空位密度确定为控制热传输的主要结构因素。我们发现随着缺陷密度的增加，kappa 受到显着的非线性抑制。基于我们的 ML 模型构建的预测多缺陷映射在 0.05 at.% 的临界空位阈值处解决了阶梯式退化转变，超过该阈值声子散射完全饱和，并将最大相对晶格热导率退化限制在大约 30 at.%。这种集成的模拟和机器学习方法提供了一个强大的预测框架，用于量化辐照聚变材料中的结构和热导率之间的复杂关系。", "authors": [{"name": "Mary K Chessey"}, {"name": "José Julio Gutiérrez Moreno"}, {"name": "Sajjan Singh Mehta"}, {"name": "Paolo Settembri"}, {"name": "Arda Erbasan"}, {"name": "Dominik Freinberger"}, {"name": "Marina García Romero"}, {"name": "Mervi J Mantsinen"}], "featured_authors": [{"name": "Mary K Chessey"}, {"name": "José Julio Gutiérrez Moreno"}, {"name": "Sajjan Singh Mehta"}, {"name": "Dominik Freinberger"}, {"name": "Marina García Romero"}, {"name": "Mervi J Mantsinen"}], "author_count": 8}, {"id": "2610.26536", "category": "cond-mat", "title": "Exact cost of the Euclidean Maximum Traveling Salesman Problem in one dimension", "abstract": "We study the random Euclidean Maximum Traveling Salesman Problem: finding a Hamiltonian cycle of maximal total cost through any set of $N$ cities on a line, where each edge cost is a function of its Euclidean length. We characterize the maximizing cycles for convex increasing, concave increasing, and convex decreasing cost functions. For points sampled independently and uniformly from the unit interval, we derive explicit expressions for the average maximal cost for arbitrary $N$ and asymptotic expansions with power-law edge costs.", "url": "https://arxiv.org/abs/2610.26536", "type": "理论", "summary": "我们研究随机欧几里德最大旅行商问题：找到一条线上任意一组 $N$ 城市的最大总成本的哈密顿循环，其中每个边成本是其欧几里德长度的函数。我们描述了凸增加、凹增加和凸减少成本函数的最大化循环。对于从单位间隔独立且均匀地采样的点，我们推导出任意 $N$ 的平均最大成本的显式表达式以及具有幂律边缘成本的渐近展开。", "authors": [{"name": "Sergio Caracciolo"}, {"name": "Carlo Vanoni"}], "featured_authors": [{"name": "Sergio Caracciolo"}, {"name": "Carlo Vanoni"}], "author_count": 2}, {"id": "2610.26561", "category": "cond-mat", "title": "Coexistence phase of the two-dimensional Vicsek model", "abstract": "The Vicsek model continues to be central in statistical physics studies of active matter, with major recent surprises such as the partial metastability of the famous Toner-Tu flocking phase. Here we report on the diversity of band patterns observed in its coexistence phase --some of them never observed before--, but we also argue that most disappear in the infinite-size limit, leaving nevertheless a different picture than anticipated previously. We finally show that these rather regular, globally ordered band configurations can be destroyed by a localized perturbation: the coexistence phase is also at least partially metastable, and thus must be, asymptotically, a disordered phase made of a variety of chaotically interacting traveling bands.", "url": "https://arxiv.org/abs/2610.26561", "type": "理论", "summary": "Vicsek 模型仍然是活性物质统计物理研究的核心，最近出现了重大惊喜，例如著名的 Toner-Tu 植绒相的部分亚稳态。在这里，我们报告了在其共存阶段观察到的能带模式的多样性——其中一些以前从未观察到——但我们也认为大多数在无限大小限制中消失，留下了与之前预期不同的画面。我们最终表明，这些相当规则的、全局有序的能带配置可以被局部扰动所破坏：共存相也至少部分是亚稳态的，因此一定是渐近地由各种混沌相互作用的行进带组成的无序相。", "authors": [{"name": "Yu Duan"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Xia-qing Shi"}], "featured_authors": [{"name": "Yu Duan"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Xia-qing Shi"}], "author_count": 4}, {"id": "2610.26569", "category": "cond-mat", "title": "Phase Diagram of the Two-Dimensional Vicsek Model", "abstract": "Motivated by gaps in our current knowledge of the Vicsek model, we present a major update of its phase diagram in two space dimensions, summarizing comprehensive numerical simulations at length- and timescales never explored before. Our main conclusions are that multiple phase separation scenarios are at play, not just the simple microphase separation put forward in [Phys. Rev. Lett. 114, 068101 (2015)], and that the coexistence phase is subdivided in two. We also map out the region of metastability of the homogeneous Toner-Tu liquid phase.", "url": "https://arxiv.org/abs/2610.26569", "type": "理论+数值", "summary": "由于我们目前对 Vicsek 模型的了解存在空白，我们对其二维空间相图进行了重大更新，总结了以前从未探索过的长度和时间尺度的全面数值模拟。我们的主要结论是，多种相分离场景正在发挥作用，而不仅仅是[Phys.莱特牧师。 114, 068101 (2015)]，并且共存阶段被细分为两个。我们还绘制了均质 Toner-Tu 液相的亚稳态区域。", "authors": [{"name": "Yu Duan"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Xia-qing Shi"}], "featured_authors": [{"name": "Yu Duan"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Xia-qing Shi"}], "author_count": 4}, {"id": "2610.26573", "category": "cond-mat", "title": "Avalanches and Aging Driven by Parametric Amplification in Kerr Oscillator Networks", "abstract": "Gain, loss, and nonlinearity shape the phase-space landscape of driven-dissipative systems, such as Kerr parametric oscillator (KPO) networks realized in superconducting, nanomechanical, and photonic arrays. Networks of KPOs exploit the stationary states of this landscape for Ising machines, bosonic error-correcting codes, and sensing. Yet how transients reach these states from a given initial condition remains largely unexplored. Here we show that KPO networks with nonlinear couplings can develop avalanches in their transient dynamics: rapid cascades of amplification between modes reminiscent of the relaxation avalanches of glassy systems. The mechanism is that parametric gain first activates the modes whose detuning it can overcome, and their nonlinear frequency shifts then pull dormant modes into the gain window one at a time. Dormant modes keep decaying while they wait for their turn, so every activation starts from a smaller seed and the intervals between activations grow geometrically. The network thus ages: the longer it has evolved, the slower it changes, and activations accumulate only logarithmically in time. In a 20-mode network, each dwell lasts about twice as long as the previous one. While aging delays the approach to the stationary state, additive noise sets a floor on the seeds and unsticks the network, shortening the longest dwells first while the activation sequence survives to noise several orders of magnitude stronger.", "url": "https://arxiv.org/abs/2610.26573", "type": "理论", "summary": "增益、损耗和非线性塑造了驱动耗散系统的相空间景观，例如在超导、纳米机械和光子阵列中实现的克尔参量振荡器 (KPO) 网络。 KPO 网络利用这种景观的静止状态来实现伊辛机、玻色纠错码和传感。然而，瞬态如何从给定的初始条件达到这些状态在很大程度上仍未得到探索。在这里，我们证明具有非线性耦合的 KPO 网络可以在瞬态动力学中产生雪崩：模式之间的快速级联放大，让人想起玻璃系统的弛豫雪崩。其机制是，参数增益首先激活它可以克服失谐的模式，然后它们的非线性频移然后一次将一个休眠模式拉入增益窗口。休眠模式在等待轮到的过程中会不断衰减，因此每次激活都从较小的种子开始，并且激活之间的间隔呈几何级数增长。因此，网络会老化：它进化的时间越长，变化的速度就越慢，并且激活仅随时间以对数方式累积。\n\n在 20 模式网络中，每次驻留的持续时间大约是前一次驻留的两倍。虽然老化延迟了接近静止状态的时间，但加性噪声在种子上设置了底线并解除了网络的粘连，首先缩短了最长的驻留时间，而激活序列则幸存下来，使噪声强了几个数量级。", "authors": [{"name": "Alejandro S. Gómez"}, {"name": "Javier del Pino"}], "featured_authors": [{"name": "Alejandro S. Gómez"}, {"name": "Javier del Pino"}], "author_count": 2}, {"id": "2610.26593", "category": "cond-mat", "title": "From particles to continuum theories in effective models of self-propelled rods", "abstract": "Models of colliding self-propelled rods are abstractions of many real systems such as gliding bacteria and biofilaments displaced by molecular motors. They have been studied mostly in two space dimensions and shown to display a wealth of different collective regimes with many parameters involved in the ensuing phase dia
