uminate how these arise: the linear memory contributes through so-called static correlators, while the nonlinear memory vanishes at this order due to symmetry considerations. The computation of the remaining, dynamical part resembles that of the $\\mathcal{O}(G^4)$ impulse. We generate its integrand using a reformulation of the WQFT Feynman rules that conserves four-momentum at every vertex and plainly exhibits the classical loops. The three-loop integrals are reduced to master integrals, whose differential equations and boundary matching in the post-Newtonian limit we describe in some detail. In contrast to conservative effects at this order, only polylogarithms appear. While individual contributions to the dynamical part are divergent, these cancel in $L^{\\mu}_{\\rm loss}$. The quadratic-in-radiation part of our result reproduces earlier results, while the complete result agrees with existing post-Newtonian results.", "url": "https://arxiv.org/abs/2610.26822", "type": "理论", "summary": "我们使用世界线量子场论 (WQFT) 确定 $\\mathcal{O}(G^4)$ 处两个引力散射体的机械角动量损失 $L^{\\mu}_{\\rm loss}$。引力记忆效应是引力场早期和晚期行为的一种现象，它会导致 $L^{\\mu}_{\\rm loss}$ 的静态贡献。我们阐明了它们是如何产生的：线性存储器通过所谓的静态相关器起作用，而非线性存储器由于对称性考虑而在此顺序中消失。其余动态部分的计算类似于 $\\mathcal{O}(G^4)$ 脉冲的计算。我们使用 WQFT 费曼规则的重新表述来生成其被积函数，该规则在每个顶点处保持四动量守恒，并清楚地展示了经典循环。三环积分被简化为主积分，我们详细描述了后牛顿极限下的微分方程和边界匹配。与此顺序的保守效应相反，仅出现多对数。虽然个体对动力部分的贡献不同，但这些贡献在 $L^{\\mu}_{\\rm loss}$ 中抵消。\n\n我们结果的二次辐射部分再现了早期的结果，而完整的结果与现有的后牛顿结果一致。", "authors": [{"name": "Lara Bohnenblust"}, {"name": "Carl Jordan Eriksen"}, {"name": "Gustav Uhre Jakobsen"}, {"name": "Kathrin Stoldt"}, {"name": "Andrii Yanovets"}], "featured_authors": [{"name": "Lara Bohnenblust"}, {"name": "Carl Jordan Eriksen"}, {"name": "Gustav Uhre Jakobsen"}, {"name": "Kathrin Stoldt"}, {"name": "Andrii Yanovets"}], "author_count": 5}, {"id": "2610.26838", "category": "hep-th", "title": "Field theory guides Monte Carlo in the one-dimensional long-range Ising model", "abstract": "The statistical long-range Ising (LRI) model in one dimension provides a family of some of the simplest non-exactly solvable critical points. These critical points are described by long-range conformal field theories (CFTs) that are well understood analytically with perturbative expansions and some exact results. Guided by this, we revisit the Monte Carlo (MC) approach to the corresponding lattice model which has many favorable features compared to other systems studied with MC methods. In particular, with very modest computational cost, we are able to estimate scaling dimensions of leading and subleading operators as well as the associated three-point functions, and even certain four-point functions. These results help highlight the fact that 1d LRI CFTs are a phenomenal playground to more generally test non-perturbative methods and ideas for strongly coupled CFTs.", "url": "https://arxiv.org/abs/2610.26838", "type": "理论", "summary": "一维统计长程 Ising (LRI) 模型提供了一系列最简单的非精确可解的临界点。这些临界点由长程共形场论 (CFT) 描述，这些理论通过微扰展开和一些精确结果可以很好地进行分析理解。以此为指导，我们重新审视相应晶格模型的蒙特卡罗（MC）方法，与使用 MC 方法研究的其他系统相比，该方法具有许多有利的特征。特别是，通过非常适度的计算成本，我们能够估计前导和次前导运算符的缩放尺寸以及相关的三点函数，甚至某些四点函数。这些结果有助于强调这样一个事实：1d LRI CFT 是一个非凡的游乐场，可以更广泛地测试强耦合 CFT 的非微扰方法和想法。", "authors": [{"name": "António Antunes"}, {"name": "José Matos"}], "featured_authors": [{"name": "António Antunes"}, {"name": "José Matos"}], "author_count": 2}, {"id": "2610.24180", "category": "math-ph", "title": "T-embeddings as stationary measures on T-graphs", "abstract": "In this paper, we investigate the relation between t-embeddings and T-graphs associated with the same weighted planar bipartite graph. We prove that, given such a T-graph, the corresponding t-embeddings are classified by positive stationary measures on this T-graph and describe a reconstruction procedure of the t-embedding given such a measure. As an application, we develop an approach for constructing t-embeddings of arbitrary sufficiently non-degenerate planar bipartite graphs.", "url": "https://arxiv.org/abs/2610.24180", "type": "理论", "summary": "在本文中，我们研究了与相同加权平面二分图相关的 t 嵌入和 T 图之间的关系。我们证明，给定这样一个 T 图，相应的 t 嵌入可以通过该 T 图上的正平稳度量进行分类，并描述给定这种度量的 t 嵌入的重建过程。作为一种应用，我们开发了一种构建任意充分非退化平面二部图的 t 嵌入的方法。", "authors": [{"name": "Mikhail Basok"}, {"name": "Benoit Laslier"}, {"name": "Marianna Russkikh"}], "featured_authors": [{"name": "Mikhail Basok"}, {"name": "Benoit Laslier"}, {"name": "Marianna Russkikh"}], "author_count": 3}, {"id": "2610.24805", "category": "math-ph", "title": "An Accurate Zeroth-Order Perturbation Theory for Solving Power-Law Potentials within the Framework of the Asymptotic Iteration Method", "abstract": "Spherically symmetric singular potentials have a wide range of applications, such as molecular and atomic physics. In this work, we present a zeroth-order perturbation theory for solving the Schrödinger equation within the framework of the asymptotic iteration method (AIM). We rely on exponential and hyperbolic potential ansatz substitutions, where the difference between the original and new potential is treated as a small perturbation. Each potential ansatz has a free parameter chosen small enough to give an accurate zeroth-order perturbative wave equation solution. This method avoids the oscillatory behavior observed in the asymptotic iteration solutions when applying the AIM to such problems. Finally, we illustrate our approach by solving a few problems, particularly potentials with quartic and sextic singularities. We compare our results with those obtained via other methods and find good agreement.", "url": "https://arxiv.org/abs/2610.24805", "type": "理论", "summary": "球对称奇异势具有广泛的应用，例如分子和原子物理学。在这项工作中，我们提出了一种零阶微扰理论，用于在渐近迭代法（AIM）的框架内求解薛定谔方程。我们依靠指数和双曲势 ansatz 替代，其中原始势和新势之间的差异被视为一个小扰动。每个潜在的 ansatz 都有一个选择足够小的自由参数，以给出精确的零阶微扰波动方程解。当将 AIM 应用于此类问题时，该方法避免了在渐近迭代解中观察到的振荡行为。最后，我们通过解决一些问题来说明我们的方法，特别是具有四次和六次奇点的势。我们将我们的结果与通过其他方法获得的结果进行比较，发现非常一致。", "authors": [{"name": "A. J. Sous"}, {"name": "Ibsal Assi"}, {"name": "Nasser Saad"}], "featured_authors": [{"name": "A. J. Sous"}, {"name": "Ibsal Assi"}, {"name": "Nasser Saad"}], "author_count": 3}, {"id": "2610.24980", "category": "math-ph", "title": "Eynard-Orantin Topological Recursion, Moduli-Space Virasoro Constraints, and Semisimple CohFTs", "abstract": "We use Virasoro constraints to prove Eynard's intersection-number formula for Eynard-Orantin topological recursion with several simple ramification points. The key construction couples the higher Weil-Petersson partition functions associated with the individual ramification points through a quadratic differential operator determined by the Bergman kernel. We identify this operator with the quadratic part of Givental's quantized $R$-matrix, thereby obtaining a Virasoro-theoretic proof of the DOSS identification of topological recursion with Givental's formula for semisimple cohomological field theories. Furthermore, while the DOSS identification fixes the distinguished $y$-function, we keep the Bergman kernel/$R$-matrix fixed and allow $y$ to vary, showing that this amounts to shifting the evaluation point of the corresponding ancestor potential.", "url": "https://arxiv.org/abs/2610.24980", "type": "理论", "summary": "我们使用 Virasoro 约束来证明具有几个简单分支点的 Eynard-Orantin 拓扑递归的 Eynard 交数公式。关键结构通过由 Bergman 核确定的二次微分算子将与各个分支点相关的更高 Weil-Petersson 配分函数耦合起来。我们用Givental的量化$R$矩阵的二次部分来识别该算子，从而利用Givental的半简单上同调场论公式获得了拓扑递归的DOSS识别的Virasoro理论证明。此外，虽然 DOSS 识别修复了显着的 $y$ 函数，但我们保持 Bergman 核/$R$ 矩阵固定并允许 $y$ 变化，表明这相当于移动相应祖先势的评估点。", "authors": [{"name": "Dingkang Xiong"}, {"name": "Jian Zhou"}], "featured_authors": [{"name": "Dingkang Xiong"}, {"name": "Jian Zhou"}], "author_count": 2}, {"id": "2610.24985", "category": "math-ph", "title": "Spectral Curves for Semisimple Conformal Frobenius Manifolds", "abstract": "We construct connected spectral curves for semisimple conformal Frobenius manifolds with flat unit, using the periods of the second structure equation. Eynard-Orantin topological recursion on these curves reproduces the stable ancestor correlators of Givental-Teleman reconstruction. The spectral curves are defined on simply connected domains in the complex plane. We apply the construction to the quantum cohomology of $\\mathbb P^n$ for $n\\ge2$ at a point, obtaining explicit spectral curve data in terms of Hecke triangle groups and hypergeometric functions. Finally, for $\\mathbb P^2$ and $\\mathbb P^3$, we express the complete spectral curve data, including the bidifferentials, in classical modular and quasimodular forms.", "url": "https://arxiv.org/abs/2610.24985", "type": "理论", "summary": "我们使用第二结构方程的周期构造具有平坦单位的半单共形弗罗贝尼乌斯流形的连通谱曲线。这些曲线上的 Eynard-Orantin 拓扑递归再现了 Givental-Teleman 重建的稳定祖先相关器。谱曲线在复平面中的简单连通域上定义。我们将该构造应用于 $n\\ge2$ 在一点处的 $\\mathbb P^n$ 的量子上同调，获得了赫克三角形群和超几何函数的显式谱曲线数据。最后，对于 $\\mathbb P^2$ 和 $\\mathbb P^3$，我们以经典模和拟模形式表达完整的谱曲线数据，包括双微分。", "authors": [{"name": "Dingkang Xiong"}, {"name": "Jian Zhou"}], "featured_authors": [{"name": "Dingkang Xiong"}, {"name": "Jian Zhou"}], "author_count": 2}, {"id": "2610.25010", "category": "math-ph", "title": "Thoughts on Quantum Events, Quantizing Gravity and von Neumann Algebras", "abstract": "This short document presents no new results. It is a collection of related ideas that may lead to a way of quantizing gravity. To achieve this it may be relevant to use my recent new approach to quantum theory, which is based on quantum events. Given that most standard quantum texts do not define a mathematical object which corresponds to a physical event, the definition of a quantum event is motivated and discussed in detail. This in turn leads to the idea that the mathematical object that contains enough quantum events for describing a quantum system is a von Neumann algebra. The next idea is that the kinematics of special relativity (as embodied in flat Minkowski space) should be quantized as a first step in the program of the quantization of general relativity, that is, quantizing Einstein's equation. It must be emphasized that the events of special relativity are viewed as part of the kinematics, rather than of the dynamics of that theory. The same holds for general relativity. Similarly, I am viewing quantum events as part of the kinematics of quantum theory, even though some find this to be counterintuitive. An Appendix shows how ``collapse'' is easily understood in this new approach to quantum theory.", "url": "https://arxiv.org/abs/2610.25010", "type": "理论", "summary": "这份简短的文件没有提出新的结果。它是相关想法的集合，可能会导致一种量子化引力的方法。为了实现这一目标，可能需要使用我最近基于量子事件的量子理论新方法。鉴于大多数标准量子文本没有定义与物理事件相对应的数学对象，因此对量子事件的定义进行了详细的激发和讨论。这反过来又导致了这样的想法：包含足够的量子事件来描述量子系统的数学对象是冯·诺依曼代数。下一个想法是，狭义相对论的运动学（体现在平坦的闵可夫斯基空间中）应该被量子化，作为广义相对论量子化计划的第一步，即量子化爱因斯坦方程。必须强调的是，狭义相对论的事件被视为运动学的一部分，而不是该理论的动力学的一部分。广义相对论也是如此。同样，我将量子事件视为量子理论运动学的一部分，尽管有些人认为这是违反直觉的。\n\n附录显示了在这种新的量子理论方法中如何容易地理解“崩溃”。", "authors": [{"name": "Stephen Bruce Sontz"}], "featured_authors": [{"name": "Stephen Bruce Sontz"}], "author_count": 1}, {"id": "2610.25218", "category": "math-ph", "title": "Complementary Cauchy Elasticity", "abstract": "We develop a nonlinear theory of complementary Cauchy elasticity in which the right Cauchy-Green strain is prescribed as a function of the second Piola-Kirchhoff stress, without assuming constitutive invertibility or the existence of a complementary strain-energy function. We introduce the complementary stress-work 1-form and characterize the obstruction to complementary hyperelasticity through the failure of major symmetry of the tangent compliance tensor. For general implicit elasticity, we show that the simultaneous closure of the stress-work and complementary stress-work 1-forms is characterized by the Lagrangian structure of the constitutive manifold. Using the Darboux classification, we obtain local canonical representations of anisotropic and isotropic complementary Cauchy elastic solids, including explicit non-hyperelastic examples. We investigate kinematic and stress constraints, including applications to pentamode solids, and show that internally constrained constitutive relations are naturally formulated on equivalence classes of stresses modulo reactive stresses. We formulate the balance laws and thermodynamics covariantly and establish that covariance of the energy balance directly yields the balance of angular momentum in complementary Cauchy elasticity, unlike in conventional Cauchy elasticity. Finally, we linearize implicit, Cauchy, and complementary Cauchy elasticity about finitely deformed and prestressed configurations and show that nonlinear non-hyperelastic solids may possess hyperelastic linearized responses.", "url": "https://arxiv.org/abs/2610.25218", "type": "理论", "summary": "我们发展了一种互补柯西弹性的非线性理论，其中正确的柯西-格林应变被规定为第二个皮奥拉-基尔霍夫应力的函数，而不假设本构可逆性或互补应变能量函数的存在。我们引入了互补应力功 1 形式，并通过切线柔量张量的主对称性失效来表征对互补超弹性的阻碍。对于一般隐弹性，我们证明了应力功和互补应力功 1-形式的同时闭合以本构流形的拉格朗日结构为特征。使用达布分类，我们获得了各向异性和各向同性互补柯西弹性固体的局部规范表示，包括显式的非超弹性示例。我们研究了运动学和应力约束，包括五模固体的应用，并表明内部约束的本构关系自然地在应力模反应应力的等价类上表述。\n\n我们协变地制定了平衡定律和热力学，并确定能量平衡的协变直接产生互补柯西弹性中的角动量平衡，这与传统的柯西弹性不同。最后，我们对有限变形和预应力构型的隐式弹性、柯西弹性和互补柯西弹性进行线性化，并表明非线性非超弹性固体可能具有超弹性线性化响应。", "authors": [{"name": "Arash Yavari"}], "featured_authors": [{"name": "Arash Yavari"}], "author_count": 1}, {"id": "2610.25249", "category": "math-ph", "title": "Response theory at low temperature for weakly interacting quantum spin systems", "abstract": "Recent work by Greenblatt, Lange, Marcelli, and Porta (Commun. Math. Phys. 2024) provides the first rigorous justification of adiabatic theory for interacting quantum systems at positive temperature. Their analysis treats weakly interacting lattice fermions and combines a rigorous Wick rotation with fermionic cluster expansion techniques. Here, we study a class of weakly interacting quantum spin systems and derive response theory at positive temperature, thereby covering non-Fermi systems for the first time. Our proof identifies and exploits the locality property of local indistinguishability as a key ingredient in carrying out low-temperature adiabatic expansions. The fact that these systems satisfy local indistinguishability was recently established jointly with Adhikari ( arXiv:2508.15907 ) using cluster expansion methods together with a probabilistic swapping trick.", "url": "https://arxiv.org/abs/2610.25249", "type": "理论", "summary": "Greenblatt、Lange、Marcelli 和 Porta 最近的工作（Commun. Math. Phys. 2024）首次严格证明了正温度下相互作用的量子系统的绝热理论。他们的分析处理弱相互作用的晶格费米子，并将严格的威克旋转与费米子簇扩展技术相结合。在这里，我们研究了一类弱相互作用的量子自旋系统，并推导了正温度下的响应理论，从而首次涵盖非费米系统。我们的证明识别并利用了局部不可区分性的局部性作为进行低温绝热膨胀的关键因素。最近与 Adhikari ( arXiv:2508.15907 ) 联合使用集群扩展方法和概率交换技巧，确定了这些系统满足局部不可区分性的事实。", "authors": [{"name": "Joscha Henheik"}, {"name": "Marius Lemm"}, {"name": "Tom Wessel"}], "featured_authors": [{"name": "Joscha Henheik"}, {"name": "Marius Lemm"}, {"name": "Tom Wessel"}], "author_count": 3}, {"id": "2610.25262", "category": "math-ph", "title": "Upper Bound on the Correlation Energy of a Dense Fermi Gas in the Thermodynamic Limit", "abstract": "We prove that the random phase approximation provides an upper bound on the correlation energy of a three-dimensional, weakly interacting, Fermi gas in the thermodynamic limit at high density. More precisely, we consider a mean-field scaling regime where the kinetic and interaction Hamiltonian are scaled by $\\rho^{-2/3}$ and $\\rho^{-1}$, respectively. We use a correlated trial state constructed through a quasi-bosonic Bogoliubov transformation of collective particle--hole excitations associated to patches on the Fermi surface. Key of the proof is to control the position-space localization of the collective excitations. Combined with an iterated Duhamel expansion of the expectation values of (localized) particle number operators we obtain extensive estimates, which justify the reduction to an effective quadratic Hamiltonian and its approximate diagonalization.", "url": "https://arxiv.org/abs/2610.25262", "type": "理论", "summary": "我们证明，随机相近似为三维弱相互作用费米气体在高密度热力学极限下的相关能提供了上限。更准确地说，我们考虑平均场缩放机制，其中动力学和相互作用哈密顿量分别按 $\\rho^{-2/3}$ 和 $\\rho^{-1}$ 缩放。我们使用通过与费米表面上的斑块相关的集体粒子空穴激发的准玻色子博戈留波夫变换构建的相关试验状态。证明的关键是控制集体激励的位置空间局部化。结合（局部）粒子数算子的期望值的迭代杜哈梅尔展开，我们获得了广泛的估计，这证明了有效二次哈密顿量及其近似对角化的简化。", "authors": [{"name": "Niels Benedikter"}, {"name": "Sascha Lill"}, {"name": "Marcello Porta"}, {"name": "Benjamin Schlein"}], "featured_authors": [{"name": "Niels Benedikter"}, {"name": "Sascha Lill"}, {"name": "Marcello Porta"}, {"name": "Benjamin Schlein"}], "author_count": 4}, {"id": "2610.25280", "category": "math-ph", "title": "De Finetti Structures in Networks of Quantum Systems", "abstract": "Consider $N$ identical quantum systems at the vertices of a graph, interacting via pairwise edge couplings. We designate $K$ vertices as a system of interest $\\mathrm S$ and the remaining $N-K$ as a reservoir $\\mathrm R$. Under generic connectivity assumptions between $\\mathrm S$ and $\\mathrm R$, we show that for $N\\to\\infty$, the reduced state of $\\mathrm S$ converges to a convex combination of symmetric product states of $K$ single-vertex density matrices -- called a de Finetti representation. Unlike in standard derivations for symmetric (exchangeable) systems, we establish de Finetti representations for quantum networks, which are inherently non-exchangeable. We construct the representations explicitly and quantify the convergence rate. We show that Erdős--Rényi random graphs exhibit the de Finetti structure: as the reservoir grows, the reduced state of any fixed finite subgraph converges almost surely to an explicit deterministic product state. As applications, we establish a general area law for the entanglement entropy of $\\mathrm S$, analyze mean-field and fluctuation scalings of the $\\mathrm S$-$\\mathrm R$ interaction, and illustrate our results on qubit networks. We also derive quantitative convergence estimates for information-theoretic quantities, including von Neumann entropy, mutual information, and entanglement within $\\mathrm S$ and between $\\mathrm S$ and $\\mathrm R$.", "url": "https://arxiv.org/abs/2610.25280", "type": "理论", "summary": "考虑图的顶点有 $N$ 个相同的量子系统，通过成对边缘耦合进行交互。我们将 $K$ 顶点指定为感兴趣的系统 $\\mathrm S$，并将剩余的 $N-K$ 指定为水库 $\\mathrm R$。在 $\\mathrm S$ 和 $\\mathrm R$ 之间的通用连通性假设下，我们表明，对于 $N\\to\\infty$，$\\mathrm S$ 的简化状态收敛到 $K$ 单顶点密度矩阵的对称乘积状态的凸组合——称为 de Finetti 表示。与对称（可交换）系统的标准推导不同，我们为量子网络建立 de Finetti 表示，它本质上是不可交换的。我们明确地构建表示并量化收敛速度。我们证明了 Erdős-Rényi 随机图表现出 de Finetti 结构：随着储层的增长，任何固定有限子图的约简状态几乎肯定会收敛到显式的确定性乘积状态。作为应用，我们建立了 $\\mathrm S$ 纠缠熵的一般面积定律，分析 $\\mathrm S$-$\\mathrm R$ 相互作用的平均场和波动尺度，并说明了我们在量子比特网络上的结果。\n\n我们还推导了信息论量的定量收敛估计，包括冯·诺依曼熵、互信息以及 $\\mathrm S$ 内以及 $\\mathrm S$ 和 $\\mathrm R$ 之间的纠缠。", "authors": [{"name": "Gavin Hull"}, {"name": "Marco Merkli"}], "featured_authors": [{"name": "Gavin Hull"}, {"name": "Marco Merkli"}], "author_count": 2}, {"id": "2610.25408", "category": "math-ph", "title": "Symmetry algebra of a charged harmonic oscillator in the field of the Dirac magnetic monopole", "abstract": "A charged particle bound by an isotropic harmonic potential to a Dirac magnetic monopole, with the centrifugal term that makes the orbits close, has degeneracies beyond rotational invariance: for integer $q$, the product of the electric and magnetic charges, the levels are those of the oscillator with the states of angular momentum $l<|q|$ removed. The conserved rank-2 tensor $T$ built from the ladder operators that accounts for them was identified thirty-five years ago, but the algebra it generates with the angular momentum $\\mathbf{J}$ was not obtained. We obtain its relations in covariant form and identify it. It is polynomial but not quadratic, and the shift $T'=T+2(H-1)J^{(2)}$ by the quadrupole of $\\mathbf{J}$, and only this one, makes all commutators polynomials in $\\mathbf{J}$. In each sector of fixed energy and $J_z$, $(\\mathbf{J}^2,T'_{zz})$ generates a cubic algebra of Heun--Racah type whose parameters are symmetric, up to a scalar shift, in the magnetic charge and the magnetic quantum number. At $q=0$, $T$ is the algebraic Heun operator of the pair (Casimir of $\\mathfrak{so}(3)$, quadrupole of $\\mathfrak{su}(3)$): the symmetry algebra is the $\\mathfrak{so}(3)$-covariant extension of a Heun--Racah algebra. We define it abstractly and classify its multiplicity-free finite-dimensional representations at the energies of the system: besides the levels, they include, for nonzero integer $q$, a second family carried by the states the monopole removes, the kernel of the Newman--Penrose operator. All relations are derived from the dynamical algebra of the ladder operators and hold for integer and half-integer charges alike.", "url": "https://arxiv.org/abs/2610.25408", "type": "理论", "summary": "受各向同性谐波势束缚到狄拉克磁单极子的带电粒子，具有使轨道闭合的离心项，具有超出旋转不变性的简并性：对于整数 $q$（电荷和磁荷的乘积），其能级是去除角动量状态 $l<|q|$ 的振荡器的能级。由梯子算子构建的守恒二阶张量 $T$ 在三十五年前就被确定了，但它用角动量 $\\mathbf{J}$ 生成的代数尚未获得。我们以协变形式获得它的关系并识别它。它是多项式但不是二次项，并且通过 $\\mathbf{J}$ 的四极子进行移位 $T'=T+2(H-1)J^{(2)}$，并且只有这一项，使得 $\\mathbf{J}$ 中的所有换向器多项式都成立。在固定能量和 $J_z$ 的每个扇区中，$(\\mathbf{J}^2,T'_{zz})$ 生成 Heun--Racah 类型的三次代数，其参数在磁荷和磁量子数中是对称的，直到标量偏移。\n\n在$q=0$处，$T$是该对的代数Heun算子（$\\mathfrak{so}(3)$的卡西米尔，$\\mathfrak{su}(3)$的四极子）：对称代数是Heun-Racah代数的$\\mathfrak{so}(3)$协变扩展。我们抽象地定义它，并在系统的能量上对其无多重性有限维表示进行分类：除了能级之外，对于非零整数 $q$，它们还包括由单极子移除的状态所承载的第二个族，即纽曼-彭罗斯算子的内核。所有关系均源自梯子算子的动态代数，并且同样适用于整数和半整数电荷。", "authors": [{"name": "Ian Marquette"}, {"name": "Luc Vinet"}], "featured_authors": [{"name": "Ian Marquette"}, {"name": "Luc Vinet"}], "author_count": 2}, {"id": "2610.25594", "category": "math-ph", "title": "Upper bounds on the number of images produced by point-mass lenses at different distances", "abstract": "If a light source is sequentially lensed by $n$ intervening point-mass lenses at distinct distances, the number of isolated images for a generic source position cannot be greater than $2\\cdot 3^{n-1}$. If lensing shear is present in each lens plane, the image counts could be as large as $4^n$, however. For a general multi-plane point-mass lens system, we also devise the recurrence for the BKK bound on the image counts, which is strictly less than Perry's bound due to the resultant degree for $n\\ge 2$. None the less, this bound is still quadratic in the number of lenses on each plane, so is likely to overestimate the true sharp bound, which is expected to grow linearly with the number of lenses.", "url": "https://arxiv.org/abs/2610.25594", "type": "理论", "summary": "如果光源在不同距离处由 $n$ 介入点质量透镜顺序透镜化，则通用源位置的孤立图像数量不能大于 $2\\cdot 3^{n-1}$。然而，如果每个透镜平面中都存在透镜切变，则图像计数可能高达 $4^n$。对于一般的多平面点质量透镜系统，我们还设计了图像计数上 BKK 界限的递推，由于 $n\\ge 2$ 的合成度数，该界限严格小于 Perry 界限。尽管如此，这个界限仍然是每个平面上透镜数量的二次方，因此可能高估了真正的锐界，预计该界限会随着透镜数量线性增长。", "authors": [{"name": "J. An"}], "featured_authors": [{"name": "J. An"}], "author_count": 1}, {"id": "2610.26204", "category": "math-ph", "title": "Wave-Particle Complementarity in Quantum Walk from a Quantum Mechanical Perspective", "abstract": "A quantum walk is a mathematical model and a quantum version of a random walk. For the past two decades, it has been studied from mathematical and physical viewpoints. It has many desirable properties. This paper reevaluates quantum walk from a quantum mechanical perspective, as Feynman essentially proposed it as a toy model in his path integral method. Then we demonstrate that the quantum walk model exhibits both particle-like and wave-like properties by showing reflection and partial reflection as a particle and interference as a wave. In particular, for an initial state supported at two sites $\\pm\\ell$, we explicitly derive the weak limit distribution of the Hadamard walk and show that the Konno distribution is modulated by the interference factor $2\\cos^2(\\ell k(x))$. The resulting interference profile is reminiscent of far-field (Fraunhofer-type) diffraction.", "url": "https://arxiv.org/abs/2610.26204", "type": "理论", "summary": "量子游走是一种数学模型，也是随机游走的量子版本。在过去的二十年里，人们从数学和物理的角度对其进行了研究。它具有许多理想的特性。本文从量子力学的角度重新评估了量子行走，因为费曼本质上是在他的路径积分方法中将其作为玩具模型提出的。然后，我们通过将反射和部分反射显示为粒子并将干涉显示为波来证明量子行走模型同时具有类粒子和类波特性。特别是，对于两个站点 $\\pm\\ell$ 支持的初始状态，我们明确推导了 Hadamard 游走的弱极限分布，并表明 Konno 分布受到干扰因子 $2\\cos^2(\\ell k(x))$ 的调制。由此产生的干涉轮廓让人想起远场（夫琅和费型）衍射。", "authors": [{"name": "Norio Konno"}, {"name": "Shigeki Matsutani"}, {"name": "Etsuo Segawa"}, {"name": "Tomoyuki Terada"}], "featured_authors": [{"name": "Norio Konno"}, {"name": "Shigeki Matsutani"}, {"name": "Etsuo Segawa"}, {"name": "Tomoyuki Terada"}], "author_count": 4}, {"id": "2610.26329", "category": "math-ph", "title": "Two-Dimensional Euclidean Free Fermi Fields from Grassmannian Stochastic Analysis", "abstract": "Motivated by Nelson's Euclidean Markov-field construction, we develop a counterpart for the massive two-dimensional free Dirac field. Starting from a Gaussian white noise with values in a Grassmann algebra on a non-commutative probability space, we construct the associated Brownian motion and a stationary Ornstein--Uhlenbeck field. The resulting Euclidean Fermi field is realized as a tempered distribution on spacetime test functions, with values in the underlying algebra. Its mixed two-point functions reproduce the Euclidean Dirac fundamental solution. Time-zero fields are obtained by conditional expectation onto the past filtration generated by the noise, while their covariance is the reflected Euclidean Dirac kernel. We show that conditional expectation is compatible with Wick ordering and maps Euclidean Wick polynomials to the corresponding time-zero Wick polynomials. The Euclidean time-translation semigroup is then constructed on time-zero fields and Wick sectors, with generators given by the one-particle Hamiltonian and by its second quantization.", "url": "https://arxiv.org/abs/2610.26329", "type": "理论", "summary": "受纳尔逊欧几里得马尔可夫场构造的启发，我们开发了大规模二维自由狄拉克场的对应场。从非交换概率空间上的格拉斯曼代数中的高斯白噪声开始，我们构造了相关的布朗运动和静止的奥恩斯坦-乌伦贝克场。由此产生的欧几里得费米场被实现为时空测试函数的缓和分布，其值在基础代数中。其混合两点函数再现了欧几里得狄拉克基本解。零时间场是通过对噪声产生的过去过滤的条件期望获得的，而它们的协方差是反映的欧几里德狄拉克核。我们证明了条件期望与 Wick 排序兼容，并将欧几里德 Wick 多项式映射到相应的零时间 Wick 多项式。然后在零时间场和威克扇区上构造欧几里得时间平移半群，生成器由单粒子哈密顿量及其第二量化给出。", "authors": [{"name": "Claudio Dappiaggi"}, {"name": "Francesco Carlo De Vecchi"}, {"name": "Pietro Tullio Falzoni"}, {"name": "Paolo Rinaldi"}], "featured_authors": [{"name": "Claudio Dappiaggi"}, {"name": "Francesco Carlo De Vecchi"}, {"name": "Pietro Tullio Falzoni"}, {"name": "Paolo Rinaldi"}], "author_count": 4}, {"id": "2610.26637", "category": "math-ph", "title": "Average lower bound on magnetic double-well tunneling with asymptotically large well separation", "abstract": "We study tunneling between two identical, smooth, compactly supported potential wells in a constant perpendicular magnetic field, with the coupling and magnetic field fixed and the well separation tending to infinity. For a sufficiently small positive magnetic field, we prove lower bounds on the hopping coefficient and on the splitting of the two lowest eigenvalues outside a set of separations of density zero. If the well centers are separated by $2d_1$ and the magnetic field strength is $b\\lambda$, the lower bounds have the form $e^{-b\\lambda d_1^2-Cd_1^{1+\\delta}}$ for every fixed $\\delta\\in(0,1)$. No radial or reflection symmetry of the single-well potential is assumed. The proof combines the explicit Landau resolvent kernel with a complex analytic estimate for logarithmic averages of the hopping coefficient.", "url": "https://arxiv.org/abs/2610.26637", "type": "理论", "summary": "我们研究了恒定垂直磁场中两个相同、光滑、紧密支撑的势阱之间的隧道效应，耦合和磁场固定，势阱间距趋于无穷大。对于足够小的正磁场，我们证明了跳跃系数的下界以及在一组密度零分离之外的两个最低特征值的分裂的下界。如果井中心间隔 $2d_1$ 并且磁场强度为 $b\\lambda$，则对于每个固定的 $\\delta\\in(0,1)$，下界的形式为 $e^{-b\\lambda d_1^2-Cd_1^{1+\\delta}}$。不假设单阱势的径向或反射对称性。该证明将显式 Landau 解析核与跳跃系数对数平均值的复杂分析估计相结合。", "authors": [{"name": "Charles L. Fefferman"}, {"name": "Say-Yeon Kwon"}, {"name": "Jacob Shapiro"}, {"name": "Michael I. Weinstein"}], "featured_authors": [{"name": "Charles L. Fefferman"}, {"name": "Say-Yeon Kwon"}, {"name": "Jacob Shapiro"}, {"name": "Michael I. Weinstein"}], "author_count": 4}, {"id": "2610.23889", "category": "quant-ph", "title": "Asymmetric Entanglement-Assisted Quantum Locally Recoverable Codes", "abstract": "Locally recoverable codes (LRCs) permit reconstruction of a lost coordinate from a small subset of the remaining coordinates, a property that is a fundamental coding technique for distributed storage and, more recently, for fault-tolerant quantum memories and distributed storage systems. Existing constructions of quantum locally recoverable codes (qLRCs) and their entanglement-assisted generalizations (EA-qLRCs) impose a single locality parameter $r$ governing recovery from both bit-flip ($X$-type) and phase-flip ($Z$-type) errors, even though physical noise is rarely symmetric between the two. We introduce entanglement-assisted quantum locally recoverable codes (EA-qLRC) with \\emph{asymmetric locality} $\\{r_X,r_Z\\}$, in which $X$-type and $Z$-type errors are corrected from recovery sets of size at most $r_X+1$ and $r_Z+1$, respectively. We extend a stabilizer sufficient condition for this property and, in particular, the CSS framework, where asymmetric locality corresponds to separate locality conditions on the two classical codes $\\mathcal C_1$ and $\\mathcal C_2$ underlying the construction. From this characterization we derive Singleton-, Griesmer-, Plotkin-, sphere-packing-, and Cadambe\\textendash Mazumdar-like bounds for CSS-type asymmetric EA-qLRCs (AEA-qLRCs) built from Proposition~\\ref{CSS-EA-qLRC-Asym}, and we characterize exactly when a pure CSS-type AEA-qLRC built from a pair of classical LRCs attains the Singleton-like bound with equality.", "url": "https://arxiv.org/abs/2610.23889", "type": "理论", "summary": "本地可恢复码（LRC）允许从剩余坐标的一小部分重建丢失的坐标，这是分布式存储以及最近容错量子存储器和分布式存储系统的基本编码技术的属性。量子局部可恢复码 (qLRC) 的现有结构及其纠缠辅助泛化 (EA-qLRC) 强加了一个局部参数 $r$，用于控制位翻转（$X$ 类型）和相位翻转（$Z$ 类型）错误的恢复，即使物理噪声在两者之间很少是对称的。我们引入了具有 \\emph{非对称局部性} $\\{r_X,r_Z\\}$ 的纠缠辅助量子局部可恢复码（EA-qLRC），其中 $X$ 型和 $Z$ 型错误分别从大小最多为 $r_X+1$ 和 $r_Z+1$ 的恢复集进行纠正。我们为这个属性扩展了一个稳定器充分条件，特别是 CSS 框架，其中不对称局部性对应于构建底层的两个经典代码 $\\mathcal C_1$ 和 $\\mathcal C_2$ 上的单独局部性条件。\n\n从这个表征中，我们导出了从命题~\\ref{CSS-EA-qLRC-Asym}构建的 CSS 类型不对称 EA-qLRC (AEA-qLRC) 的 Singleton-、Griesmer-、Plotkin-、sphere-packing- 和 Cadambe\\textendash Mazumdar 式边界，并且我们准确地表征了从一对经典 LRC 构建的纯 CSS 类型 AEA-qLRC 何时达到具有平等性的单例约束。", "authors": [{"name": "Vijay Kumar"}, {"name": "Ramakrishna Bandi"}], "featured_authors": [{"name": "Vijay Kumar"}, {"name": "Ramakrishna Bandi"}], "author_count": 2}, {"id": "2610.24077", "category": "quant-ph", "title": "Quantum error correction well below the color code threshold", "abstract": "Quantum error correction enables scalable fault-tolerant quantum computation by suppressing logical errors exponentially with code distance once physical error rates fall below a critical threshold. Here we demonstrate below-threshold operation of triangular color codes with distances $d=3,5,$ and $7$ on Quantinuum's Helios trapped-ion quantum processor. Leveraging both circuit- and hardware- level leakage reduction schemes, we achieve logical error rates as low as $5_{-2}^{+4}\\times 10^{-6}$, and demonstrate error suppression by over an order of magnitude, $\\Lambda=12_{-2}^{+3}$, with each successive increase in code distance. Moreover, we demonstrate below threshold scaling of error rates for Clifford two-qubit randomized benchmarking circuits when encoded in $d=3,5$ color codes, achieving logical error rate of $7^{+3}_{-3}\\times 10^{-5}$ per logical two-qubit Clifford at distance $5$ with a suppression factor of $\\Lambda=9_{-3}^{+8}$. We compare logical performance for existing near-optimal algorithmic decoders, and both convolutional neural network and transformer-based neural network decoders capable of real-time decoding an order of magnitude faster than the syndrome extraction rate. These results approach the logical error rates required for megaquop-scale quantum computation and indicate that scaled trapped-ion processors could reach application-relevant performance with substantially smaller code blocks than indicated by previous results in other qubit modalities.", "url": "https://arxiv.org/abs/2610.24077", "type": "理论+数值", "summary": "一旦物理错误率低于临界阈值，量子纠错就会通过代码距离以指数方式抑制逻辑错误，从而实现可扩展的容错量子计算。在这里，我们演示了在 Quantinuum 的 Helios 俘获离子量子处理器上距离 $d=3,5,$ 和 $7$ 的三角形颜色代码的阈值以下操作。利用电路级和硬件级泄漏减少方案，我们实现了低至 $5_{-2}^{+4}\\times 10^{-6}$ 的逻辑错误率，并展示了随着代码距离的每次连续增加，错误抑制超过一个数量级 $\\Lambda=12_{-2}^{+3}$。此外，我们证明了当以 $d=3,5$ 颜色代码编码时，Clifford 两量子位随机基准测试电路的错误率低于阈值缩放，在距离 $5$ 处，每个逻辑两量子位 Clifford 的逻辑错误率达到 $7^{+3}_{-3}\\times 10^{-5}$，抑制因子为 $\\Lambda=9_{-3}^{+8}$。\n\n我们比较了现有接近最优算法解码器的逻辑性能，以及卷积神经网络和基于变压器的神经网络解码器能够实时解码比校正子提取率快一个数量级。这些结果接近兆级量子计算所需的逻辑错误率，并表明规模化俘获离子处理器可以使用比其他量子位模态中先前结果所指示的小得多的代码块来达到应用相关的性能。", "authors": [{"name": "Ali Lavasani"}, {"name": "Adam P. Reed"}, {"name": "Joan M. Dreiling"}, {"name": "Annie J. Park"}, {"name": "Michael Mills"}, {"name": "Matteo Puviani"}, {"name": "Gabriel Matos"}, {"name": "M.S. Allman"}, {"name": "Noah Berthusen"}, {"name": "Natalie C. Brown"}, {"name": "Victor E. Colussi"}, {"name": "Brian Estey"}, {"name": "Cameron Foltz"}, {"name": "Daniel Gresh"}, {"name": "Reza Haghshenas"}, {"name": "Akhil Isanaka"}, {"name": "Nikhil Kotibhaskar"}, {"name": "Anthony Ransford"}, {"name": "Ciarán Ryan-Anderson"}, {"name": "Brian Neyenhuis"}, {"name": "David Hayes"}, {"name": "Tzvetan S. Metodi"}, {"name": "Andrew C. Potter"}], "featured_authors": [{"name": "Ali Lavasani"}, {"name": "Adam P. Reed"}, {"name": "Joan M. Dreiling"}, {"name": "David Hayes"}, {"name": "Tzvetan S. Metodi"}, {"name": "Andrew C. Potter"}], "author_count": 23}, {"id": "2610.24154", "category": "quant-ph", "title": "Translation-Invariant Pure States with Exotic Half-Chain Factors", "abstract": "We construct translation-invariant pure quasifree fermionic states on the one-dimensional lattice whose half-chain von Neumann algebras are hyperfinite factors of type $\\mathrm{II}_\\infty$ or $\\mathrm{III}_\\lambda$ for any $0<\\lambda\\leq 1$. Via the Jordan-Wigner-Araki transformation, these yield translation-invariant pure spin-chain states with the same half-chain factors, demonstrating that such factors need not be of type I or III. Each state is the unique ground state of a gapless, translation-invariant parent Hamiltonian with superpolynomially decaying interactions. For any fixed factor type, the interval entanglement entropy can exhibit widely varying growth rates, from arbitrarily slow divergence to nearly power-law growth, showing that entropy scaling does not determine the factor type. In contrast, we prove that gauge-invariant quadratic Hamiltonians with finitely many flavours and exponentially decaying hopping exhibit a dichotomy: their ground states either satisfy an area law with a type I half-chain factor, or have logarithmic entropy growth with a type $\\mathrm{III}_1$ factor. The counterexample was discovered with AI assistance.", "url": "https://arxiv.org/abs/2610.24154", "type": "理论", "summary": "我们在一维晶格上构造平移不变的纯准自由费米子态，其半链冯诺依曼代数是 $\\mathrm{II}_\\infty$ 或 $\\mathrm{III}_\\lambda$ 类型的超有限因子，对于任何 $0<\\lambda\\leq 1$。通过 Jordan-Wigner-Araki 变换，这些产生具有相同半链因子的平移不变的纯自旋链状态，证明这些因子不必是 I 型或 III 型。每个状态都是具有超多项式衰减相互作用的无间隙、平移不变父哈密顿量的唯一基态。对于任何固定的因子类型，区间纠缠熵可以表现出广泛变化的增长率，从任意缓慢的发散到接近幂律的增长，这表明熵缩放并不能确定因子类型。相比之下，我们证明具有有限多种风味和指数衰减跳跃的规范不变二次哈密顿量表现出二分性：它们的基态要么满足具有 I 型半链因子的面积定律，要么具有具有 $\\mathrm{III}_1$ 类型因子的对数熵增长。反例是在人工智能的帮助下发现的。", "authors": [{"name": "Ruizhi Liu"}, {"name": "Jinmin Yi"}], "featured_authors": [{"name": "Ruizhi Liu"}, {"name": "Jinmin Yi"}], "author_count": 2}, {"id": "2610.24403", "category": "quant-ph", "title": "Prototype-Guided Optimization of Quantum Data Embeddings with Linear Cost", "abstract": "In supervised quantum machine learning with classical data, classification performance critically depends on the geometry induced by quantum data embedding. Existing data-adaptive approaches rely on pairwise fidelity evaluations between samples, which scale as $O(B^2)$ for $B$ samples and create a computational bottleneck in iterative embedding optimization. To address this issue, we propose a prototype-guided framework for efficient data-adaptive quantum embedding. Using class-prototype separation and sample-to-prototype compactness, we derive a measurable lower certificate for class-ensemble distinguishability and construct a prototype-based objective requiring only $O(B)$ fidelity evaluations. We integrate this objective into an end-to-end pipeline that combines task-specific quantum circuit architecture optimization with continuous refinement of the data-embedding parameters. Across five benchmark datasets with up to 20 qubits, our method retains competitive quantum kernel support vector machine (SVM) performance while reducing fidelity-evaluation cost, with particularly strong gains over budget-matched pairwise optimization on T-MNIST. Geometric analyses examine how the learned embeddings relate to kernel alignment and classification margins, revealing dataset-dependent benefits and limitations. We further derive a prototype-based classifier in the reproducing kernel Hilbert space that provides an explicit witness for the SVM objective and a low-cost proxy for model selection, and extend the framework to multiple prototypes for multimodal class structures.", "url": "https://arxiv.org/abs/2610.24403", "type": "理论+数值", "summary": "在使用经典数据的监督量子机器学习中，分类性能关键取决于量子数据嵌入引起的几何形状。现有的数据自适应方法依赖于样本之间的成对保真度评估，对于 $B$ 样本而言，其规模为 $O(B^2)$，并在迭代嵌入优化中造成计算瓶颈。为了解决这个问题，我们提出了一个原型引导的框架，用于高效的数据自适应量子嵌入。使用类原型分离和样本到原型紧凑性，我们得出了类集合区分性的可测量的较低证书，并构建了一个仅需要 $O(B)$ 保真度评估的基于原型的目标。我们将此目标集成到端到端管道中，该管道将特定于任务的量子电路架构优化与数据嵌入参数的持续细化相结合。在具有多达 20 个量子位的五个基准数据集上，我们的方法保留了具有竞争力的量子内核支持向量机 (SVM) 性能，同时降低了保真度评估成本，与 T-MNIST 上的预算匹配的成对优化相比，收益特别大。\n\n几何分析检查学习的嵌入如何与内核对齐和分类边际相关，揭示数据集相关的优点和局限性。我们进一步在再生内核希尔伯特空间中推导了一个基于原型的分类器，它为 SVM 目标提供了明确的见证，并为模型选择提供了低成本代理，并将框架扩展到多模式类结构的多个原型。", "authors": [{"name": "Seokhoon Jeong"}, {"name": "Daniel K. Park"}], "featured_authors": [{"name": "Seokhoon Jeong"}, {"name": "Daniel K. Park"}], "author_count": 2}, {"id": "2610.24426", "category": "quant-ph", "title": "Margin-Based Generalization for Quantum Machine Learning with Classical Data Encoding", "abstract": "Understanding generalization is essential for assessing the practical viability of quantum machine learning. In many applications, quantum models operate on classical data that must first be encoded into quantum states, making the encoding part of the effective hypothesis class. We develop a margin-based generalization framework for this setting, covering both fixed and trainable quantum data encodings. For fixed encodings, the existing margin bound transfers unchanged. For trainable encodings, we derive a bound using a two-scale covering argument that combines the original margin-dependent term with an additive encoding-capacity term of order $\\tilde O(\\sqrt{L/m})$, where $L$ is the number of trainable encoding parameters and $m$ is the training-sample size. Across 19,440 simulated training runs spanning various image datasets, circuit architectures, and optimization settings, the inverse margin performs best among five baseline and two bound-derived complexity measures under conditional-independence and 90th-percentile sign-error criteria, within bootstrap uncertainty. These results provide a unified margin-based view of generalization in quantum machine learning with classical data.", "url": "https://arxiv.org/abs/2610.24426", "type": "理论+数值", "summary": "理解泛化对于评估量子机器学习的实际可行性至关重要。在许多应用中，量子模型对必须首先编码为量子态的经典数据进行操作，使编码成为有效假设类的一部分。我们为此设置开发了一个基于边际的泛化框架，涵盖固定和可训练的量子数据编码。对于固定编码，现有边距边界传输不变。对于可训练编码，我们使用两个尺度的覆盖参数得出一个界限，该参数将原始的边距相关项与阶 $\\tilde O(\\sqrt{L/m})$ 的加性编码容量项相结合，其中 $L$ 是可训练编码参数的数量，$m$ 是训练样本大小。在跨越各种图像数据集、电路架构和优化设置的 19,440 次模拟训练运行中，在条件独立和 90% 符号误差标准下，在引导不确定性范围内，逆余量在五个基线和两个有界派生复杂性度量中表现最佳。\n\n这些结果提供了基于经典数据的量子机器学习泛化的统一的基于边际的视图。", "authors": [{"name": "Ju-Young Ryu"}, {"name": "Tak Hur"}, {"name": "Daniel K. Park"}], "featured_authors": [{"name": "Ju-Young Ryu"}, {"name": "Tak Hur"}, {"name": "Daniel K. Park"}], "author_count": 3}, {"id": "2610.24482", "category": "quant-ph", "title": "Local response theory of multiparameter sudden-quench quantum Otto engines", "abstract": "Multiparameter quantum Otto engines raise an optimization problem absent in single-parameter cycles: which small quench vector maximizes the quadratic approximation to the exact output work in a multidimensional control space? We develop a local response theory for sudden-quench Otto engines with quantum working media described by linearly controlled Hamiltonians. We show that the local quadratic work decomposes into a thermal-bias gain and a quadratic response cost, whose competition determines the quench vector that maximizes the local quadratic work at a prescribed quench amplitude. We illustrate the theory in a minimal two-level working medium, where radial and transverse quenches play distinct roles, and in a finite interacting XYZ spin chain, where the resulting quench vector is determined by the balance between thermal-bias and response cost. Our results provide a practical local criterion for designing small multiparameter quenches in sudden-quench quantum Otto engines.", "url": "https://arxiv.org/abs/2610.24482", "type": "理论+数值", "summary": "多参数量子奥托发动机提出了单参数循环中不存在的优化问题：哪个小失超矢量可以最大化多维控制空间中精确输出功的二次近似？我们开发了一种用于突然淬火奥托发动机的局部响应理论，其量子工作介质由线性控制哈密顿量描述。我们表明，局部二次功分解为热偏置增益和二次响应成本，其竞争决定了在规定淬火幅度下最大化局部二次功的淬火矢量。我们在最小的两级工作介质中说明了该理论，其中径向和横向淬火发挥着不同的作用，并且在有限相互作用的 XYZ 自旋链中说明了该理论，其中产生的淬火矢量由热偏压和响应成本之间的平衡决定。我们的结果为设计突然淬火量子奥托发动机中的小型多参数淬火提供了实用的局部标准。", "authors": [{"name": "Dehua Liu"}, {"name": "Yihang Cai"}, {"name": "Biao Xiong"}, {"name": "Jibing Liu"}, {"name": "Chuanjia Shan"}, {"name": "Jianhui Wang"}], "featured_authors": [{"name": "Dehua Liu"}, {"name": "Yihang Cai"}, {"name": "Biao Xiong"}, {"name": "Jibing Liu"}, {"name": "Chuanjia Shan"}, {"name": "Jianhui Wang"}], "author_count": 6}, {"id": "2610.24503", "category": "quant-ph", "title": "Logical-Space Theory of Ordered-Statistics Decoding for Quantum LDPC Codes", "abstract": "Quantum decoding succeeds when a correction matches the logical class of the error, whereas ordered-statistics decoding (OSD) searches a finite list of physical corrections. We connect these spaces through a rank-$k$ logical-signature map $M_{\\rm log}:\\mathbb F_2^q\\to\\mathbb F_2^k$. For fixed, error-independent orderings it yields the exact logical-signature distribution, the OSD-0 logical error rate, and the logical-class coverage of any fixed list. For minimum-cost list decoding we prove $P_L=P_{\\rm miss}+P_{\\rm sel}$, separating absent-class from wrong-selection failures. Hypergraph-product and bivariate-bicycle codes are consistent with the coverage predictions. On the $[\\![144,12,12]\\!]$ gross code, 672 coverage-aware candidates outperform 899 combination-sweep candidates (paired McNemar $p=0.013$), while two lists with identical logical coverage give $P_L=11.30\\%$ and $3.78\\%$; the signature-based coverage compression persists across 30 random column orderings. Logical coverage and within-class representative selection are therefore complementary resources that candidate count alone does not capture. The framework guides OSD list construction and compression by identifying coverage requirements and distinguishing coverage losses from failures of representative selection.", "url": "https://arxiv.org/abs/2610.24503", "type": "理论", "summary": "当校正与错误的逻辑类别匹配时，量子解码就会成功，而有序统计解码 (OSD) 会搜索物理校正的有限列表。我们通过等级 $k$ 逻辑签名映射 $M_{\\rm log}:\\mathbb F_2^q\\to\\mathbb F_2^k$ 连接这些空间。对于固定的、与错误无关的排序，它会产生精确的逻辑签名分布、OSD-0 逻辑错误率以及任何固定列表的逻辑类覆盖率。对于最小成本列表解码，我们证明 $P_L=P_{\\rm miss}+P_{\\rm sel}$，将缺席类与错误选择失败分开。超图积和双变量自行车代码与覆盖率预测一致。在 $[\\![144,12,12]\\!]$ 总代码上，672 个覆盖感知候选者优于 899 个组合扫描候选者（配对 McNemar $p=0.013$），而具有相同逻辑覆盖率的两个列表给出 $P_L=11.30\\%$ 和 $3.78\\%$；基于签名的覆盖压缩在 30 个随机列排序中持续存在。因此，逻辑覆盖和班内代表选择是补充资源，仅靠候选人计数无法捕获。\n\n该框架通过识别覆盖要求并区分覆盖损失和代表性选择失败来指导 OSD 列表构建和压缩。", "authors": [{"name": "Yun Shang"}], "featured_authors": [{"name": "Yun Shang"}], "author_count": 1}, {"id": "2610.24518", "category": "quant-ph", "title": "Exact Quantum Query Complexity of the Five-Bit Symmetric Boolean Function $\\Exact^5_{3,4}$", "abstract": "Let \\(f = \\text{EXACT}^5_{3,4}\\) be the Boolean function that equals 1 exactly on inputs of Hamming weight 3 or 4. Earlier numerical studies reported success probabilities close to one using three queries, but the existence of an exact three-query algorithm had remained unresolved. This paper settles this problem by proving that the exact quantum query complexity of \\(f\\) is \\(4\\). For the lower bound, we express every three-query algorithm through layer-by-layer Gram matrices of low-degree Fourier coefficients. We then construct a fixed rational dual certificate whose slack matrices are all positive definite. This certificate separates the necessary Gram-matrix region from the exact-output condition and therefore rules out every exact algorithm using at most three queries in the stated model. The positivity verification reduces to five small rational matrices and Sylvester's criterion. For the upper bound, we invoke the previously known four-query algorithm for the seven-bit function \\(\\text{EXACT}^7_{3,4}\\) and apply the standard padding reduction. To quantify the near-exact behavior, we use the same certificate to derive a valid, though not claimed tight, lower bound \\(\\frac{25600}{43779488192449}>0\\) on the worst-case error of every algorithm using at most three queries. This positive error gap is compatible with the near-unit success probabilities reported in earlier numerical studies, which do not establish exact computation.", "url": "https://arxiv.org/abs/2610.24518", "type": "理论+数值", "summary": "令 \\(f = \\text{EXACT}^5_{3,4}\\) 为布尔函数，在汉明权重为 3 或 4 的输入上精确等于 1。早期的数值研究报告使用三个查询的成功概率接近于 1，但精确的三查询算法的存在仍然悬而未决。本文通过证明 \\(f\\) 的精确量子查询复杂度为 \\(4\\) 来解决这个问题。对于下界，我们通过低阶傅里叶系数的逐层 Gram 矩阵来表达每个三查询算法。然后，我们构造一个固定有理对偶证书，其松弛矩阵都是正定的。该证书将必要的革兰氏矩阵区域与精确输出条件分开，因此排除了在所述模型中最多使用三个查询的每个精确算法。正性验证减少到五个小的有理矩阵和西尔维斯特准则。对于上限，我们为七位函数 \\(\\text{EXACT}^7_{3,4}\\) 调用先前已知的四查询算法，并应用标准填充减少。\n\n为了量化近乎精确的行为，我们使用相同的证书来派生一个有效的（尽管没有声称严格的）下限 \\(\\frac{25600}{43779488192449}>0\\) ，该下限针对最多使用三个查询的每个算法的最坏情况错误。这种正误差间隙与早期数值研究中报告的近单位成功概率兼容，这些研究没有建立精确的计算。", "authors": [{"name": "Guoliang Xu"}, {"name": "Haoran Zhang"}, {"name": "Mengfan Wu"}, {"name": "Songyao Xue"}, {"name": "Mingke Liu"}], "featured_authors": [{"name": "Guoliang Xu"}, {"name": "Haoran Zhang"}, {"name": "Mengfan Wu"}, {"name": "Songyao Xue"}, {"name": "Mingke Liu"}], "author_count": 5}, {"id": "2610.24561", "category": "quant-ph", "title": "Ergotropy of nonequilibrium steady states beyond the full secular approximation", "abstract": "Understanding the generation and activation of ergotropy, the maximum work extractable by cyclic unitary operations, is central to quantum battery research. Positive-temperature thermal states are passive, whereas nonequilibrium environments can sustain nonpassive steady states with nonzero ergotropy. However, the full secular approximation commonly used in Lindblad descriptions can suppress steady-state coherence and obscure its contribution to ergotropy. Using a Bloch-Redfield master equation beyond the full secular approximation, we investigate the ergotropy of the nonequilibrium steady state (NESS) of two exchange-coupled qubits connected to independent thermal reservoirs. The NESS ergotropy of two qubits with the same frequency is entirely coherent and grows quadratically with temperature bias near equilibrium. In contrast, detuned qubits can exhibit incoherent ergotropy. We derive an exact analytical criterion for its activation and show that activation requires the hotter reservoir to be coupled to the qubit with the higher bare frequency. Comparing NESSs obtained with and without full secularization reveals quantitative and qualitative differences in ergotropy that reflect changes in both its coherent and incoherent contributions. The results clarify the mechanisms of NESS ergotropy activation and demonstrate the importance of retaining steady-state coherence beyond the full secular approximation when characterizing stationary work resources.", "url": "https://arxiv.org/abs/2610.24561", "type": "理论", "summary": "了解各向异性（循环酉运算可提取的最大功）的产生和激活是量子电池研究的核心。正温度热状态是被动的，而非平衡环境可以维持具有非零各向异性​​的非被动稳态。然而，林德布拉德描述中常用的完全长期近似会抑制稳态相干性并掩盖其对各向异性的贡献。使用超越完全长期近似的 Bloch-Redfield 主方程，我们研究了连接到独立热库的两个交换耦合量子位的非平衡稳态 (NESS) 的各向异性。具有相同频率的两个量子位的 NESS 各向异性是完全相干的，并且随着接近平衡的温度偏差呈二次方增长。相反，失谐的量子位可能表现出不相干的各向异性。我们推导了其激活的精确分析标准，并表明激活需要将较热的储层耦合到具有较高裸频率的量子位。\n\n比较在完全世俗化和没有完全世俗化的情况下获得的 NESS，揭示了各向异性的定量和定性差异，反映了其相干和非相干贡献的变化。结果阐明了 NESS 各向异性激活的机制，并证明了在表征固定工作资源时保持超出完全长期近似的稳态相干性的重要性。", "authors": [{"name": "Xing-Xing Hu"}, {"name": "Hui-Yu Yang"}, {"name": "Kun Zhang"}, {"name": "Xiao-Hui Wang"}], "featured_authors": [{"name": "Xing-Xing Hu"}, {"name": "Hui-Yu Yang"}, {"name": "Kun Zhang"}, {"name": "Xiao-Hui Wang"}], "author_count": 4}, {"id": "2610.24582", "category": "quant-ph", "title": "Concatenated continuous-drive protection of exchange-based spin-qubit gates", "abstract": "Exchange-based two-qubit gates in semiconductor spin qubits are sensitive to low-frequency detuning noise and control errors. Here, we extend concatenated continuous driving (CCD), implemented by phase modulation of a global microwave drive, to exchange-based SWAP and $\\sqrt{\\mathrm{SWAP}}$ operations between double-dressed spin qubits and investigate its effectiveness for protecting two-qubit gates. We find that CCD retains strong protection against quasistatic common-mode detuning errors while substantially improving robustness against Rabi-frequency errors and qubit-to-qubit Rabi-frequency mismatch compared with conventional continuous dressing. By contrast, the gate fidelity is impacted by differential detuning errors. By modeling partially correlated quasistatic detuning noise, we further show that the noise-averaged gate fidelity depends strongly on the spatial correlation of the qubit-frequency fluctuations, with positive correlations enhancing CCD protection by suppressing the differential-noise component. These results identify the symmetry and spatial correlation of qubit-frequency noise as key factors governing continuous-drive protection in coupled spin-qubit systems.", "url": "https://arxiv.org/abs/2610.24582", "type": "理论", "summary": "半导体自旋量子位中基于交换的双量子位门对低频失谐噪声和控制误差敏感。在这里，我们将通过全局微波驱动的相位调制实现的级联连续驱动（CCD）扩展到双修饰自旋量子位之间基于交换的 SWAP 和 $\\sqrt{\\mathrm{SWAP}}$ 操作，并研究其保护双量子位门的有效性。我们发现，与传统的连续修整相比，CCD 保留了针对准静态共模失谐误差的强大保护，同时显着提高了针对拉比频率误差和量子位到量子位拉比频率失配的鲁棒性。相比之下，门保真度受到差分失谐误差的影响。通过对部分相关准静态失谐噪声进行建模，我们进一步表明，噪声平均门保真度很大程度上取决于量子位频率波动的空间相关性，正相关性通过抑制差分噪声分量来增强 CCD 保护。这些结果将量子位频率噪声的对称性和空间相关性确定为耦合自旋量子位系统中控制连续驱动保护的关键因素。", "authors": [{"name": "Takuma Kuno"}, {"name": "Takeru Utsugi"}, {"name": "Andrew J. Ramsay"}, {"name": "Hideo Arimoto"}, {"name": "Tetsuo Kodera"}, {"name": "Hiroyuki Mizuno"}], "featured_authors": [{"name": "Takuma Kuno"}, {"name": "Takeru Utsugi"}, {"name": "Andrew J. Ramsay"}, {"name": "Hideo Arimoto"}, {"name": "Tetsuo Kodera"}, {"name": "Hiroyuki Mizuno"}], "author_count": 6}, {"id": "2610.24658", "category": "quant-ph", "title": "Collective Strong Quantum Mpemba Effect in Accelerated Quantum Detectors", "abstract": "Collective coupling to the Minkowski vacuum allows uniformly accelerated quantum detectors to exhibit a strong quantum Mpemba effect, in which a state initially farther from equilibrium relaxes faster than a closer one. We establish the existence of this effect for every fixed finite number of detectors $N\\geq 2$ at sufficiently small transverse separation within the pointlike secular master equation. The mechanism originates from two reflection sectors whose populations are conserved by the leading collective dynamics. Weak intersector transfer at finite separation generates an isolated, parametrically slow relaxation mode. A simple family of initial states permits its leading-order cancellation by matching the equilibrium sector populations, while a corrected preparation eliminates the slow-mode amplitude exactly. We construct a reference state that establishes a genuine reversal of trace-distance ordering. Numerical calculations and local-rate-preserving controls identify the collective origin of the effect, while spatially smeared detector calculations support its persistence within the second-order secular framework. The same mechanism extends to detectors coupled to a common thermal field, with analytically distinct slow relaxation rates. Thus, strong Mpemba relaxation is not exclusive to acceleration but emerges from a more general interplay between collective dissipation, reflection-sector conservation, and weak symmetry-breaking transfer.", "url": "https://arxiv.org/abs/2610.24658", "type": "理论+数值", "summary": "与闵可夫斯基真空的集体耦合允许均匀加速的量子探测器表现出强烈的量子姆彭巴效应，其中最初远离平衡的状态比接近平衡的状态松弛得更快。我们在点状长期主方程内以足够小的横向间隔确定每个固定有限数量的探测器 $N\\geq 2$ 都存在这种效应。该机制源于两个反射部门，其人口受到领先集体动力的保护。有限间隔下的弱相间传递会产生孤立的、参数化的慢弛豫模式。一个简单的初始状态族允许通过匹配平衡扇区群体来消除其前导阶，而校正的准备则精确地消除了慢模振幅。我们构建了一个参考状态，建立了轨迹距离排序的真正逆转。数值计算和局部速率保持控制确定了效应的集体起源，而空间模糊探测器计算支持其在二阶长期框架内的持久性。\n\n相同的机制延伸到与公共热场耦合的探测器，具有分析上不同的慢弛豫率。因此，强 Mpemba 弛豫并不只限于加速，而是来自集体耗散、反射扇区守恒和弱对称破缺传递之间更普遍的相互作用。", "authors": [{"name": "G. D. de Moraes Neto"}, {"name": "Richard Q. Matos"}, {"name": "Norton G. de Almeida"}], "featured_authors": [{"name": "G. D. de Moraes Neto"}, {"name": "Richard Q. Matos"}, {"name": "Norton G. de Almeida"}], "author_count": 3}, {"id": "2610.24686", "category": "quant-ph", "title": "Efficient Quantum Algorithm for Mixed-State Quantum Geometry", "abstract": "Mixed-state quantum geometry plays a fundamental role in quantum metrology, multiparameter estimation, and the characterization of quantum many-body systems. Yet, unlike its pure-state counterpart, accessing mixed-state geometry requires solving an ill-conditioned Lyapunov equation for the symmetric logarithmic derivative (SLD), posing a major challenge for resource-efficient quantum computation. Here we address the challenge and develop a novel quantum algorithmic framework for efficiently accessing the quantum Fisher information matrix (QFIM) and quantum geometric tensor (QGT) of mixed states. Our key insight is to uncover a previously unexplored connection between the positive semidefinite structure of density matrices and exponentially convergent Gauss-Laguerre quadrature, enabling an efficient integral-based construction of the SLD. A rigorous complexity analysis further establishes the resource efficiency of our algorithm, demonstrating logarithmic precision dependence and double-logarithmic ancillary-qubit overhead at fixed conditioning. Building on this construction, we achieve near-Heisenberg precision scaling for diagonal QFI estimation without quantum phase estimation and construct unified block encodings of the full QFIM and QGT under a bounded spectral-gap assumption. A complementary regularized algorithm extends efficient diagonal estimation to exponentially small spectral gaps under a bounded-response condition. Our results establish a resource-efficient route to coherent mixed-state quantum geometry, enabling its direct integration into quantum linear-algebra algorithms without classical reconstruction and opening new possibilities for quantum-enhanced multiparameter metrology.", "url": "https://arxiv.org/abs/2610.24686", "type": "理论+数值", "summary": "混合态量子几何在量子计量、多参数估计和量子多体系统的表征中发挥着基础作用。然而，与纯态对应物不同，访问混合态几何需要求解对称对数导数 (SLD) 的病态李雅普诺夫方程，这对资源高效型量子计算提出了重大挑战。在这里，我们应对这一挑战并开发一种新颖的量子算法框架，用于有效访问混合态的量子费希尔信息矩阵（QFIM）和量子几何张量（QGT）。我们的主要见解是揭示密度矩阵的正半定结构与指数收敛高斯-拉盖尔求积之间以前未探索过的联系，从而实现 SLD 的高效基于积分的构造。严格的复杂性分析进一步确定了我们算法的资源效率，证明了固定条件下的对数精度依赖性和双对数辅助量子位开销。\n\n在此结构的基础上，我们在没有量子相位估计的情况下实现了对角 QFI 估计的近海森堡精度缩放，并在有界谱间隙假设下构建了完整 QFIM 和 QGT 的统一块编码。互补正则化算法将有效的对角线估计扩展到有界响应条件下的指数小光谱间隙。我们的研究结果建立了一条实现相干混合态量子几何的资源有效途径，使其能够直接集成到量子线性代数算法中，而无需经典重构，并为量子增强多参数计量学开辟了新的可能性。", "authors": [{"name": "Chenyang Wang"}, {"name": "Qi Zhao"}, {"name": "Xiao Yuan"}, {"name": "Xiaoxia Cai"}], "featured_authors": [{"name": "Chenyang Wang"}, {"name": "Qi Zhao"}, {"name": "Xiao Yuan"}, {"name": "Xiaoxia Cai"}], "author_count": 4}, {"id": "2610.24840", "category": "quant-ph", "title": "Characterizing Local and Correlated Pauli Noise in Quantum Teleportation Circuits", "abstract": "We analytically characterize how the location and the local or correlated structure of stochastic Pauli errors affect a three-qubit coherent quantum-teleportation circuit. Independent local channels and a fully correlated two-qubit channel are inserted separately in six configurations. Propagating each Pauli-error realization through the Clifford circuit yields the effective channel on Bob's qubit and analytical expressions for the average and state-resolved fidelities. Under a common ordered-pair probability convention, the six configurations form three pairs that induce equivalent reduced channels on Bob. Within each pair, corresponding Pauli-error realizations have the same probabilities and produce the same effective Pauli operator on Bob's output state. The equivalence therefore holds for every input state within the stochastic Pauli models considered here, rather than only for the average fidelity. Correlated Z errors do not affect the output for the first pair; local X and Z errors exhibit complementary qubit sensitivity for the second; and correlated same-axis Pauli errors cancel for the third. These results classify the error response of the selected circuit configurations and show that it depends jointly on the error statistics, Pauli axis, and position within the protocol.", "url": "https://arxiv.org/abs/2610.24840", "type": "理论+数值", "summary": "我们分析地描述了随机泡利误差的位置和局部或相关结构如何影响三量子位相干量子隐形传态电路。独立的本地通道和完全相关的两个量子位通道分别插入六种配置中。通过 Clifford 电路传播每个泡利误差实现会产生 Bob 量子位上的有效通道以及平均和状态解析保真度的解析表达式。根据常见的有序对概率约定，这六种配置形成三对，在 Bob 上产生等效的缩减通道。在每一对中，相应的泡利误差实现具有相同的概率，并在 Bob 的输出状态上产生相同的有效泡利算子。因此，该等价性适用于此处考虑的随机泡利模型内的每个输入状态，而不仅仅是平均保真度。相关 Z 误差不会影响第一对的输出；局部 X 和 Z 误差表现出第二个互补的量子位敏感性；第三个相关同轴泡利误差抵消。\n\n这些结果对所选电路配置的误差响应进行分类，并表明它共同取决于误差统计、泡利轴和协议内的位置。", "authors": [{"name": "L. Anjos"}, {"name": "Jose Alfredo de Leon"}, {"name": "R. S. Sarthour"}, {"name": "Alejandro Fonseca"}], "featured_authors": [{"name": "L. Anjos"}, {"name": "Jose Alfredo de Leon"}, {"name": "R. S. Sarthour"}, {"name": "Alejandro Fonseca"}], "author_count": 4}, {"id": "2610.24925", "category": "quant-ph", "title": "Symmetry-breaking chelation enables room-temperature all-optical spin coherence readout of aqueous Cu(II) for chemoselective discrimination", "abstract": "Optical initialization and readout of molecular electron spins in water remains challenging for 3d transition-metal complexes. Their Laporte-forbidden d-d transitions yield weak transition dipole moments, so optical spin detection in aqueous Cu(II) previously required ~1 M concentrations. Here we overcome this constraint through symmetry-breaking chelation. Coordinating Cu(II) with EDTA imposes a non-centrosymmetric ligand field with enhanced metal-ligand covalency, relaxing Laporte restrictions and amplifying d-d transition dipole moments. This design enhances absorption and magnetic circular dichroism by 7.3- and 5.6-fold, enabling ultrafast spin readout down to 100 {\\mu}M with an apparent dephasing time T2^*~0.54 ns. As a proof-of-concept for selective molecular-spin sensing, histidine addition extends T_2^* to ~0.8 ns in a concentration-dependent manner, whereas glycine produces no measurable effect. These results show that symmetry breaking provides a strategy to create molecular spin-photon interfaces, opening avenues toward all-optical, analyte-responsive quantum sensing in water.", "url": "https://arxiv.org/abs/2610.24925", "type": "理论", "summary": "对于 3d 过渡金属配合物来说，水中分子电子自旋的光学初始化和读出仍然具有挑战性。它们的拉波尔特禁止的 d-d 跃迁产生较弱的跃迁偶极矩，因此以前在 Cu(II) 水溶液中进行光学自旋检测需要约 1 M 的浓度。在这里，我们通过对称性破坏的螯合克服了这一限制。 Cu(II) 与 EDTA 配位可形成非中心对称配体场，增强金属-配体共价性，放宽拉波特限制并放大 d-d 跃迁偶极矩。该设计将吸收和磁圆二色性增强了 7.3 倍和 5.6 倍，实现了低至 100 {μ}M 的超快自旋读数，表观相移时间 T2^*~0.54 ns。作为选择性分子自旋传感的概念验证，组氨酸的添加以浓度依赖性方式将 T_2^* 延长至约 0.8 ns，而甘氨酸则没有产生可测量的效果。这些结果表明，对称性破缺提供了一种创建分子自旋光子界面的策略，为水中的全光学、分析物响应量子传感开辟了途径。", "authors": [{"name": "Jinlei Li"}, {"name": "Qiaoyun Wu"}, {"name": "Qiaoqiao Shao"}, {"name": "Zhubin Hu"}, {"name": "Haitao Sun"}, {"name": "Zhenrong Sun"}, {"name": "Donghai Feng"}], "featured_authors": [{"name": "Jinlei Li"}, {"name": "Qiaoyun Wu"}, {"name": "Qiaoqiao Shao"}, {"name": "Haitao Sun"}, {"name": "Zhenrong Sun"}, {"name": "Donghai Feng"}], "author_count": 7}, {"id": "2610.24956", "category": "quant-ph", "title": "Chiral Floquet Selection of an Algebraic Rydberg Bound State in the Continuum", "abstract": "Bound states in the continuum (BICs) remain localized despite the presence of extended modes at the same energy. In driven systems with long-range couplings, the absence of radiation does not by itself determine how a bound state decays in space. We study a Hermitian Rydberg spin waveguide coupled to a four-site plaquette, where a winding drive phase combines rotation with time translation to forbid propagating guide channels in one symmetry sector. The resulting eigenstate remains embedded in the continuum of other sectors and carries an inverse-cube waveguide amplitude, with coherent contributions from direct plaquette--guide coupling and long-range guide propagation. Pair-state calculations determine the microscopic couplings in the axial geometry, while coherent Floquet mixing sets the weight of the dominant circulating plaquette mode. The bound state thus retains the spatial signature of the long-range coupling even when radiation is forbidden.", "url": "https://arxiv.org/abs/2610.24956", "type": "理论+数值", "summary": "尽管在相同能量下存在扩展模式，连续体中的束缚态 (BIC) 仍保持局域化。在具有长程耦合的驱动系统中，辐射的缺失本身并不能决定束缚态在空间中如何衰减。我们研究了一种与四点小板耦合的厄米里德伯自旋波导，其中缠绕驱动相将旋转与时间平移相结合，以禁止在一个对称扇区中传播引导通道。由此产生的本征态仍然嵌入在其他扇区的连续体中，并带有反立方波导振幅，并具有直接斑块波导耦合和远程波导传播的相干贡献。对态计算确定了轴向几何结构中的微观耦合，而相干 Floquet 混合则确定了主要循环斑块模式的权重。因此，即使辐射被禁止，束缚态也保留了长程耦合的空间特征。", "authors": [{"name": "X. Z. Zhang"}, {"name": "X. F. ZHang"}, {"name": "M.W. Liu"}], "featured_authors": [{"name": "X. Z. Zhang"}, {"name": "X. F. ZHang"}, {"name": "M.W. Liu"}], "author_count": 3}, {"id": "2610.25057", "category": "quant-ph", "title": "Super Howe duality and rigidity of hybrid Fourier transforms", "abstract": "We characterize the hybrid Fourier transform on the Schwartz--Grassmann space $\\caS(\\bbR^m)\\otimes\\Lambda_{2n}$ by operator intertwining relations. Using the bosonic oscillator Howe decomposition and the fermionic Lefschetz decomposition, we describe the action of the hybrid Fourier transform on both tensor factors. We show that first-order covariance with respect to coordinate multiplication and differentiation determines the transform up to a scalar. For $m,n\\ge1$, we prove that covariance under all even quadratic operators, together with any one nonzero mixed quadratic operator, determines the linear span of the hybrid Fourier transform and its inverse. This rigidity result is obtained by computing the ordinary commutants of the even and full quadratic oscillator actions of $\\fosp(4n|2m)$. After a degree-scaling change of normalization, we make the hybrid Fourier transform unitary with respect to the occupation number inner product, and factor it into a bosonic oscillator rotation and (up to a scalar phase) an $SU(2)$ rotation in the fermionic Lefschetz representation. For $m=1$ and $n\\ge2$, we show that full even quadratic covariance together with the parity-preserving cubic relation for $qQ_f$ determines the unitary transform up to a global phase and a fermion-parity phase. Finally we calculate the unitary conjugation formulas for Hubbard--Holstein Hamiltonian for a hybrid continuous-variable and discrete-variable quantum system.", "url": "https://arxiv.org/abs/2610.25057", "type": "理论", "summary": "我们通过算子交织关系来表征 Schwartz-Grassmann 空间 $\\caS(\\bbR^m)\\otimes\\Lambda_{2n}$ 上的混合傅立叶变换。使用玻色子振荡器 Howe 分解和费米子 Lefschetz 分解，我们描述了混合傅立叶变换对两个张量因子的作用。我们证明，关于坐标乘法和微分的一阶协方差决定了标量的变换。对于 $m,n\\ge1$，我们证明所有偶二次算子下的协方差以及任何一个非零混合二次算子决定了混合傅里叶变换及其逆的线性跨度。该刚性结果是通过计算 $\\fosp(4n|2m)$ 的偶次和全二次振荡作用的普通交换子获得的。在归一化的度尺度变化之后，我们使混合傅里叶变换相对于占用数内积为酉，并将其分解为玻色子振荡器旋转和（直到标量相位）费米子 Lefschetz 表示中的 $SU(2)$ 旋转。\n\n对于 $m=1$ 和 $n\\ge2$，我们证明完全偶二次协方差与 $qQ_f$ 的奇偶性保持立方关系一起决定了全局相位和费米子宇称相位的酉变换。最后我们计算了混合连续变量和离散变量量子系统的哈伯德-荷尔斯泰因哈密顿量的酉共轭公式。", "authors": [{"name": "Jing-Song Huang"}, {"name": "Yongzhi Luan"}, {"name": "Yinuo Xue"}], "featured_authors": [{"name": "Jing-Song Huang"}, {"name": "Yongzhi Luan"}, {"name": "Yinuo Xue"}], "author_count": 3}, {"id": "2610.25138", "category": "quant-ph", "title": "On the Complexity of Level-Synchronized Tree Automata for Quantum Circuit Verification", "abstract": "Reliable quantum computation requires methods for verifying quantum circuits. Level-synchronized tree automata (LSTAs) were recently introduced to represent sets of quantum states for this purpose. We study LSTAs along two axes relevant to verification: the complexity of their decision problems and the size of their representations under circuit operations. We prove that acyclic LSTAs have NP-complete nonemptiness and $\\Pi_2^P$-complete language inclusion, and that general language inclusion is EXPSPACE-complete. We further prove inherent quadratic representation growth under individual quantum gates in a fixed qubit order, and give an adjacent-qubit reordering construction that preserves level synchronization. These results clarify the scope of applicability of the automata-theoretic toolbox for quantum circuit verification.", "url": "https://arxiv.org/abs/2610.25138", "type": "理论", "summary": "可靠的量子计算需要验证量子电路的方法。为此，最近引入了级别同步树自动机（LSTA）来表示量子态集。我们沿着与验证相关的两个轴研究 LSTA：决策问题的复杂性和电路操作下表示的大小。我们证明非循环 LSTA 具有 NP 完全非空性和 $\\Pi_2^P$ 完全语言包含，并且一般语言包含是 EXPSPACE 完全的。我们进一步证明了固定量子位顺序下各个量子门下固有的二次表示增长，并给出了保持水平同步的相邻量子位重新排序结构。这些结果阐明了用于量子电路验证的自动机理论工具箱的适用范围。", "authors": [{"name": "Michael Blondin"}, {"name": "Samy Chady Khoumsi-Kasmi"}, {"name": "Guillermo A. Pérez"}, {"name": "Marnix Suilen"}], "featured_authors": [{"name": "Michael Blondin"}, {"name": "Samy Chady Khoumsi-Kasmi"}, {"name": "Guillermo A. Pérez"}, {"name": "Marnix Suilen"}], "author_count": 4}, {"id": "2610.25196", "category": "quant-ph", "title": "Exact probability laws of random inner products: Dirichlet splines, overlaps, uncertainty, and Bargmann invariants", "abstract": "Inner products of random matrices and random quantum states---such as orbital inner products, expectation values, overlaps, and cyclic Bargmann invariants---are shown to follow from two underlying mechanisms: the diagonal of an induced random state is Dirichlet distributed, and the expectation value of a random pure state in a rank-one or two-by-two operator is a numerical shadow on an elliptical disk. For states induced by an environment of dimension $K$, the expectation value of any observable is a Curry--Schoenberg spline with each eigenvalue repeated $K$ times, and the vector of moments has an explicit density on a simplex; for a qutrit, the variance law is obtained in finite form. The overlap of two random qubit states attains its mode at its mean for every rotation-invariant ensemble, but for Hilbert--Schmidt qutrits the density at the mean has a strictly negative derivative, so mode and mean separate; for large environments, the centred overlap converges to a variance-gamma law rather than a Gaussian. For two noncommuting qubit observables, the joint law of the two standard deviations is derived for all $K$, and the probability of coming within a small distance of the optimal sum of variances scales as a power of that distance, with a different exponent when the Bloch axes are orthogonal. For three Haar-random qubit states, the exact density of the Bargmann invariant is given in terms of a complete elliptic integral, together with its local behaviour and elementary marginals. In every dimension, the probability that its real part is negative---certifying basis-independent coherence---is computed, along with all mixed moments. For cycles of arbitrary length, the invariant is shown to be driven by an exact three-parameter Markov chain, and the logarithm of its modulus obeys a law of large numbers and a central limit theorem.", "url": "https://arxiv.org/abs/2610.25196", "type": "理论+数值", "summary": "随机矩阵和随机量子态的内积（例如轨道内积、期望值、重叠和循环巴格曼不变量）被证明遵循两个基本机制：诱导随机状态的对角线是狄利克雷分布，并且秩一或二乘二算子中的随机纯状态的期望值是椭圆盘上的数值阴影。对于由 $K$ 维环境引发的状态，任何可观测量的期望值都是 Curry-Schoenberg 样条，每个特征值重复 $K$ 次，并且矩向量在单纯形上具有显式密度；对于 qutrit，方差定律以有限形式获得。对于每个旋转不变系综，两个随机量子位状态的重叠在其均值处获得其众数，但对于希尔伯特-施密特量子而言，均值处的密度具有严格的负导数，因此众数和均值是分开的；对于大型环境，中心重叠收敛于方差伽玛定律而不是高斯定律。\n\n对于两个不可交换的量子位可观测量，对所有 $K$ 导出两个标准差的联合定律，并且在最佳方差和的小距离范围内的概率作为该距离的幂，当布洛赫轴正交时具有不同的指数。对于三个哈尔随机量子位态，巴格曼不变量的精确密度以完全椭圆积分及其局部行为和基本边际的形式给出。在每个维度中，计算其实部为负的概率（证明与基础无关的相干性）以及所有混合矩。对于任意长度的循环，不变量被证明是由精确的三参数马尔可夫链驱动的，并且其模数的对数服从大数定律和中心极限定理。", "authors": [{"name": "Lin Zhang"}], "featured_authors": [{"name": "Lin Zhang"}], "author_count": 1}, {"id": "2610.25203", "category": "quant-ph", "title": "Simulation-Based Quantum Forensics for QKD: Machine Learning Attack Detection and Signature Extraction", "abstract": "Quantum Key Distribution (QKD) supports secure key establishment under ideal protocol assumptions, but practical systems remain exposed to implementation-level attacks against optical channels, detectors, and controller behavior. This study presents Quantum Forensic Log (QF-LOG), a simulation-based forensic framework for analyzing aggregated QKD operational logs rather than raw quantum states. QF-LOG uses four observable features: quantum bit error rate (QBER), photon count, latency in milliseconds, and abort flag. The framework classifies normal operation and three simulated attack-related conditions: partial intercept-resend, detector-blind, and fiber-tap. A physics-inspired Generator-A dataset with 5 million balanced records was constructed using explicit mathematical generation models for all four features. A transparent threshold baseline, logistic regression, random forest, and XGBoost were evaluated on Generator-A. The full-feature learning models achieved macro F1-scores from 0.8211 to 0.8243 and outperformed the transparent two-feature comparator. Feature diagnostics showed that QBER contributed most, followed by latency in milliseconds and photon count, while no single feature reproduced the full feature set performance. Robustness was assessed on a separately generated Generator-B dataset of 5 million records that uses the same governing equations under shifted simulated operating parameters. Without retraining or tuning, their macro F1-scores decreased to values from 0.5645 to 0.5669. These findings show that QF-LOG can support interpretable forensic classification in a controlled synthetic setting, but stable internal evaluation does not establish reliability under changed simulated QKD operating conditions. The framework provides a documented basis for future evaluation across broader simulated settings and hardware-generated QKD logs.", "url": "https://arxiv.org/abs/2610.25203", "type": "理论+数值", "summary": "量子密钥分发 (QKD) 支持理想协议假设下的安全密钥建立，但实际系统仍然面临针对光通道、检测器和控制器行为的实施级攻击。这项研究提出了量子取证日志（QF-LOG），这是一种基于模拟的取证框架，用于分析聚合的 QKD 操作日志而不是原始量子态。 QF-LOG 使用四个可观察的特征：量子误码率 (QBER)、光子计数、延迟（以毫秒为单位）和中止标志。该框架对正常操作和三种模拟攻击相关条件进行分类：部分拦截重发、检测器盲和光纤窃听。使用所有四个特征的显式数学生成模型构建了一个具有 500 万条平衡记录的受物理启发的 Generator-A 数据集。在 Generator-A 上评估透明阈值基线、逻辑回归、随机森林和 XGBoost。全特征学习模型的宏观 F1 分数从 0.8211 到 0.8243，并且优于透明的双特征比较器。\n\n功能诊断显示，QBER 贡献最大，其次是延迟（以毫秒为单位）和光子计数，而没有任何单个功能能够再现完整的功能集性能。鲁棒性是在单独生成的包含 500 万条记录的 Generator-B 数据集上进行评估的，该数据集在变化的模拟操作参数下使用相同的控制方程。如果没有重新训练或调整，他们的宏观 F1 分数会从 0.5645 降至 0.5669。这些发现表明，QF-LOG 可以在受控合成环境中支持可解释的法医分类，但稳定的内部评估并不能在改变的模拟 QKD 操作条件下建立可靠性。该框架为未来跨更广泛的模拟设置和硬件生成的 QKD 日志进行评估提供了记录的基础。", "authors": [{"name": "Madhab Chandra Das"}, {"name": "Sajid Ahmed"}, {"name": "Uzair Hussain"}, {"name": "Van Vung Pham"}], "featured_authors": [{"name": "Madhab Chandra Das"}, {"name": "Sajid Ahmed"}, {"name": "Uzair Hussain"}, {"name": "Van Vung Pham"}], "author_count": 4}, {"id": "2610.25213", "category": "quant-ph", "title": "LiftDiff: Guided Discrete Diffusion for Quantum Code Construction", "abstract": "The realization of fault-tolerant quantum computation relies on Quantum Error-Correcting Codes (QECC). Of particular interest are codes that combine a high encoding rate with sufficient distance. Existing algebraic constructions, such as lifted product (LP) codes, build a large quantum low-density parity-check (qLDPC) code from a classical base matrix. In this work we introduce LiftDiff, a generative approach to the discovery of QECC. A discrete denoising diffusion model is trained to generate base matrices over the group algebra $\\mathbb{F}_2[\\mathbb{Z}_\\ell]$, which are then expanded into LP codes. The reverse diffusion process is guided by an energy function that evaluates quantum code properties, including girth, degree, sparsity and decoding performance, steering the sampler toward matrices that yield LP codes with favorable parameters. Our method discovers codes with parameters such as $[[169,13,11]]$, $[[143,15,9]]$, and $[[260,24,10]]$, including a $[[247,19,14]]$ code that achieves the highest ${kd^2}/{n}$ among the baselines. Moreover, several discovered codes outperform the Gross code across a broad range of the tested physical error rates under both code-capacity and circuit-level noise.", "url": "https://arxiv.org/abs/2610.25213", "type": "理论+数值", "summary": "容错量子计算的实现依赖于量子纠错码（QECC）。特别令人感兴趣的是结合了高编码率和足够距离的代码。现有的代数结构，例如提升积 (LP) 码，可以从经典基础矩阵构建大型量子低密度奇偶校验 (qLDPC) 码。在这项工作中，我们介绍了 LiftDiff，一种发现 QECC 的生成方法。训练离散去噪扩散模型以生成群代数 $\\mathbb{F}_2[\\mathbb{Z}_\\ell]$ 上的基矩阵，然后将其扩展为 LP 代码。反向扩散过程由能量函数引导，该能量函数评估量子代码属性，包括周长、度数、稀疏性和解码性能，引导采样器生成具有有利参数的 LP 代码的矩阵。我们的方法发现具有 $[[169,13,11]]$、$[[143,15,9]]$ 和 $[[260,24,10]]$ 等参数的代码，包括在基线中实现最高 ${kd^2}/{n}$ 的 $[[247,19,14]]$ 代码。\n\n此外，在代码容量和电路级噪声下，一些已发现的代码在广泛的测试物理错误率范围内都优于 Gross 代码。", "authors": [{"name": "Yotam Peled"}, {"name": "Eliya Nachmani"}], "featured_authors": [{"name": "Yotam Peled"}, {"name": "Eliya Nachmani"}], "author_count": 2}, {"id": "2610.25260", "category": "quant-ph", "title": "Spatial Discretization Error for Quantum Chemistry Simulation", "abstract": "Nonrelativistic quantum chemistry is based on the Schrödinger equation in continuous, unbounded space. Computational approaches on classical and quantum computers often truncate the spatial domain and introduce a finite-dimensional basis, reducing the continuum problem to a finite-dimensional one. There is therefore a fundamental question: to what extent does this approximation capture the original continuum problem? In this work, we develop a general Sobolev-Galerkin framework for estimating spatial discretization errors in quantum simulation with unbounded Hamiltonians. We apply this framework to many-body Coulomb systems and establish both periodization and Galerkin error estimates for wave-function dynamics and ground-state energies. For dynamics, the finite-basis projection error of the exact wave function does not capture the full basis-discretization error: an additional dynamical projection error enters our bound at a different rate, and we introduce an inner-product argument to control this contribution. Interestingly, the spatial convergence rates for wave-function dynamics and ground-state energies differ quantitatively. For ground-state energies, we establish a sharp $M^{-1}$ convergence rate at fixed cell size, where $M$ is the number of one-particle basis functions. We also show that a uniform $M^{-1}$ convergence rate is impossible for the corresponding real-time wave-function error with general $H^2$ initial data. The analysis relies on many-body Sobolev estimates with explicit polynomial dependence on system size. Combining these estimates with state-of-the-art quantum algorithms, we obtain, to our knowledge, the first rigorous end-to-end complexity bounds for quantum simulation of molecular and electronic dynamics with all spatial errors explicitly controlled. The number of basis functions is determined directly from the continuum problem, without regularization.", "url": "https://arxiv.org/abs/2610.25260", "type": "理论+数值", "summary": "非相对论量子化学基于连续、无界空间中的薛定谔方程。经典和量子计算机上的计算方法通常会截断空间域并引入有限维基础，将连续统问题简化为有限维问题。因此，存在一个基本问题：这种近似在多大程度上捕获了原始连续统问题？在这项工作中，我们开发了一个通用的 Sobolev-Galerkin 框架，用于估计具有无界哈密顿量的量子模拟中的空间离散化误差。我们将该框架应用于多体库仑系统，并建立波函数动力学和基态能量的周期化和伽辽金误差估计。对于动力学，精确波函数的有限基投影误差不能捕获完整的基离散化误差：额外的动态投影误差以不同的速率进入我们的界限，并且我们引入内积参数来控制这种贡献。有趣的是，波函数动力学和基态能量的空间收敛率在数量上有所不同。\n\n对于基态能量，我们在固定单元尺寸下建立了急剧的 $M^{-1}$ 收敛速率，其中 $M$ 是单粒子基函数的数量。我们还表明，对于一般 $H^2$ 初始数据的相应实时波函数误差来说，统一的 $M^{-1}$ 收敛速度是不可能的。该分析依赖于多体 Sobolev 估计，且多项式显式依赖于系统规模。将这些估计与最先进的量子算法相结合，据我们所知，我们获得了第一个严格的端到端复杂性界限，用于分子和电子动力学的量子模拟，并且所有空间误差均得到明确控制。基函数的数量直接由连续统问题确定，无需正则化。", "authors": [{"name": "Di Fang"}, {"name": "Jiaqi Zhang"}], "featured_authors": [{"name": "Di Fang"}, {"name": "Jiaqi Zhang"}], "author_count": 2}, {"id": "2610.25299", "category": "quant-ph", "title": "Fully quantum fidelity-based entropic continuity bounds", "abstract": "We present a continuity bound for quantum conditional entropies in terms of fidelity, with no dependence on the dimension of the conditioning system. Our results encompass both the von Neumann entropy and one version of sandwiched Rényi entropy, which is particularly relevant for applications in quantum key distribution (QKD). In such applications, this bound should provide improved results as compared to previous continuity bounds based on trace distance. We also show that the bounds can be sharpened as expected for classical-quantum states, and verify that they hold when the conditioning system has countably infinite dimension. Finally, we present several variants tailored for exponential functions of the Rényi entropies instead, which should be relevant for QKD applications.", "url": "https://arxiv.org/abs/2610.25299", "type": "理论", "summary": "我们在保真度方面提出了量子条件熵的连续性界限，而不依赖于条件系统的维度。我们的结果包括冯·诺依曼熵和夹层 Rényi 熵的一种版本，这与量子密钥分配 (QKD) 中的应用特别相关。在此类应用中，与之前基于迹线距离的连续性界限相比，该界限应提供改进的结果。我们还表明，对于经典量子态，边界可以像预期的那样锐化，并验证当调节系统具有可数无限维时它们是否成立。最后，我们提出了几种针对 Rényi 熵指数函数定制的变体，这应该与 QKD 应用相关。", "authors": [{"name": "Matthew Simon Tan"}, {"name": "Ernest Y.-Z. Tan"}], "featured_authors": [{"name": "Matthew Simon Tan"}, {"name": "Ernest Y.-Z. Tan"}], "author_count": 2}, {"id": "2610.25310", "category": "quant-ph", "title": "Anomalously fast heating of ground states in dephased $SU(N)$ spin systems", "abstract": "We identify a strong quantum Mpemba effect in which a many-body ground state heats faster than every Gibbs state at finite positive temperature under the same dissipative dynamics within a fixed-color sector. In ferromagnetic $SU(N)$ exchange systems with local dephasing, exact coherence shells confine the ground-state evolution and exclude all slower Liouvillian modes. Its relaxation rate is fixed by the bath, independently of system size, exchange graph, and integrability. We derive an energy-resolved sign criterion that guarantees a slower thermal contribution throughout the positive-temperature range. An exact finite-chain solution proves this rate inversion, and symmetry-resolved calculations confirm the criterion in larger spin-one chains, including nonintegrable exchange. The zero-temperature endpoint of a continuous Gibbs family can therefore be dynamically isolated by its exact exclusion from slow relaxation channels.", "url": "https://arxiv.org/abs/2610.25310", "type": "理论+数值", "summary": "我们发现了一种强量子 Mpemba 效应，其中在固定颜色扇区内相同的耗散动力学下，多体基态在有限正温度下比每个吉布斯态加热得更快。在具有局部相移的铁磁 $SU(N)$ 交换系统中，精确的相干壳限制了基态演化并排除了所有较慢的刘维尔模式。其弛豫率由浴固定，与系统尺寸、交换图和可积分性无关。我们推导出一个能量分辨的符号标准，保证在整个正温度范围内较慢的热贡献。精确的有限链解决方案证明了这种速率反转，对称解析计算证实了更大的自旋链中的标准，包括不可积的交换。因此，连续吉布斯族的零温度端点可以通过精确排除慢弛豫通道来动态隔离。", "authors": [{"name": "Tairan Lou"}, {"name": "Junxiao Chen"}, {"name": "Xiang-Ping Jiang"}, {"name": "Mingdi Xu"}, {"name": "Lei Pan"}], "featured_authors": [{"name": "Tairan Lou"}, {"name": "Junxiao Chen"}, {"name": "Xiang-Ping Jiang"}, {"name": "Mingdi Xu"}, {"name": "Lei Pan"}], "author_count": 5}, {"id": "2610.25334", "category": "quant-ph", "title": "Can Quantum Entanglement Increase the Capacity of a Classical Relay Channel?", "abstract": "We show positive and negative results on classical relay channels with entanglement assistance, revealing a sharp contrast between strictly causal and causal relay encoding. First, we consider van
