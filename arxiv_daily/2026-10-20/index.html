 der Meulen's setting of a unit-delay relay, with strictly causal encoding. We show that the standard cutset upper bound continues to hold with entanglement assistance, and deduce that entanglement does not increase the capacity for several classes of relay channels. Second, we consider a zero-delay relay, where the encoding is causal. We present an example in which entanglement enables rates that exceed the cutset upper bound by at least 12.5%. Namely, entanglement shared between the source and relay significantly increases the capacity of a classical zero-delay relay channel.", "url": "https://arxiv.org/abs/2610.25334", "type": "理论", "summary": "我们在纠缠辅助的经典中继通道上显示了积极和消极的结果，揭示了严格因果和因果中继编码之间的鲜明对比。首先，我们考虑 van der Meulen 对单位延迟中继的设置，并采用严格的因果编码。我们证明，在纠缠辅助下，标准割集上限继续成立，并推断出纠缠不会增加几类中继信道的容量。其次，我们考虑零延迟中继，其中编码是因果的。我们举了一个例子，其中纠缠使得速率超过割集上限至少 12.5%。即，源和中继之间共享的纠缠显着增加了经典零延迟中继信道的容量。", "authors": [{"name": "Elsa Mizrahi"}, {"name": "Uzi Pereg"}], "featured_authors": [{"name": "Elsa Mizrahi"}, {"name": "Uzi Pereg"}], "author_count": 2}, {"id": "2610.25466", "category": "quant-ph", "title": "Squeezing and Decoherence of Axion Dark Matter", "abstract": "Bosonic particles beyond the Standard Model, such as axions, are among the leading candidates for dark matter. If such particles have a small mass, they are usually described as a purely classical field. However, it was recently shown that this description is incomplete: their inherent gravitational self-interactions can squeeze the field, producing a quantum feature beyond the classical description. Here we analyze squeezing of light dark matter in the presence of decoherence. We show that squeezing is continuously generated, and rapidly enough to survive dissipation, and may also remain present under thermal fluctuations and dephasing. Our results demonstrate that dark matter might possess persistent quantum features and motivate further investigation of their implications for dark matter detection.", "url": "https://arxiv.org/abs/2610.25466", "type": "理论", "summary": "标准模型之外的玻色子粒子，例如轴子，是暗物质的主要候选者之一。如果这些粒子的质量很小，它们通常被描述为纯经典场。然而，最近的研究表明，这种描述是不完整的：它们固有的引力自相互作用可以挤压场，产生超出经典描述的量子特征。在这里，我们分析了退相干情况下光暗物质的挤压。我们表明，挤压是连续产生的，并且速度足够快，足以承受耗散，并且在热波动和失相的情况下也可能仍然存在。我们的结果表明，暗物质可能具有持久的量子特征，并激发了对其对暗物质检测的影响的进一步研究。", "authors": [{"name": "Vasileios Fragkos"}, {"name": "Igor Pikovski"}], "featured_authors": [{"name": "Vasileios Fragkos"}, {"name": "Igor Pikovski"}], "author_count": 2}, {"id": "2610.25520", "category": "quant-ph", "title": "Multiplicative Noise in Nanolaser Amplification: From Discrete Emission Events to the Additive-Noise Limit", "abstract": "Laser amplification kicks off with just a few photons in the cavity, a regime where standard additive Langevin noise cannot capture the real fluctuations. To understand how this amplification begins, we map out a single-mode photon-carrier model that links macroscopic lasers directly into nanolasers. Stationary rate equations reveal that stimulated emission takes over across a tight pump window. In nanolasers, however, spontaneous processes coexist across a much broader range. Because steady-state averages miss the individual events that lead to the macroscopic photon number, we frame the stochastic dynamics around the actual discrete transitions, deriving a state-dependent diffusion approximation. The destruction of an excited carrier concurrent with the generation of a photon creates a negative photon-carrier cross-correlation. This unavoidably leads to a correlated, multiplicative Gaussian-noise framework. We track the resulting discrete dynamics with an established, event-based Laser Markov Chain (LMC) which stochastically samples pump, relaxation, emission, and cavity-loss events keeping all physical quantities as non-negative integers. Comparing its predictions to those of our multiplicative model proves that the latter reproduces excellently well the statistical behavior of photons and carrier, as long as a continuous diffusion description holds. Once the emission drops into the few-photon regime, however, the discrete model becomes indispensable. On the other hand, at large photon counts relative fluctuations shrink to a level where the state-dependence of the diffusion matrix can be ignored, to leading order, thus returning to the classic Langevin description of the system's stochastic dynamics.", "url": "https://arxiv.org/abs/2610.25520", "type": "理论", "summary": "激光放大在腔内只有几个光子时开始，在这种情况下，标准加性朗之万噪声无法捕获真正的波动。为了了解这种放大是如何开始的，我们绘制了一个单模光子载流子模型，将宏观激光器直接连接到纳米激光器。稳态速率方程表明，受激发射接管了狭窄的泵浦窗口。然而，在纳米激光器中，自发过程在更广泛的范围内共存。由于稳态平均值错过了导致宏观光子数的各个事件，因此我们围绕实际离散跃迁构建随机动力学，从而得出与状态相关的扩散近似。受激载流子的破坏与光子的产生同时发生，产生负的光子-载流子互相关。这不可避免地导致相关的乘性高斯噪声框架。我们使用已建立的基于事件的激光马尔可夫链（LMC）来跟踪由此产生的离散动力学，该链对泵浦、弛豫、发射和腔损失事件进行随机采样，将所有物理量保持为非负整数。\n\n将其预测与我们的乘法模型的预测进行比较证明，只要连续扩散描述成立，后者就可以很好地再现光子和载流子的统计行为。然而，一旦发射落入少光子状态，离散模型就变得不可或缺。另一方面，在大光子计数时，相对波动缩小到可以忽略扩散矩阵的状态依赖性的水平，达到领先顺序，从而返回到系统随机动力学的经典朗之万描述。", "authors": [{"name": "G. Sonnino"}, {"name": "Ph. Peeters"}, {"name": "P. Nardone"}, {"name": "G.L. Lippi"}], "featured_authors": [{"name": "G. Sonnino"}, {"name": "Ph. Peeters"}, {"name": "P. Nardone"}, {"name": "G.L. Lippi"}], "author_count": 4}, {"id": "2610.25657", "category": "quant-ph", "title": "Quantum State Search with Classical Interactive Advice", "abstract": "We study whether a quantum verifier can find a hidden quantum state by exchanging classical messages with an unbounded prover who knows the state. The verifier has access to a reflection oracle about the target. For a Haar-random $n$-qubit target, we prove that achieving constant average fidelity with the target requires $(q+1)^2(B+1)=\\Omega(2^n)$, where $q$ is the number of verifier queries and $B$ is the total prover-to-verifier communication. The bound allows arbitrary classical interaction and unrestricted computation between queries. Our proof extends the lower bound of Aaronson and Kuperberg from a single classical proof to an arbitrary classical interaction. As a result, we obtain a quantum-oracle separation of UniqueQMA from QCIP with polynomially many classical messages. In particular, we give a unitary oracle $\\mathcal{U}$ such that there exists a language $L\\in\\mathrm{UniqueQMA}^{\\mathcal{U}}$ but $L\\notin\\mathrm{QCIP}^{\\mathcal{U}}$. We further give an oracle construction for a notion known as QMA-QCIP[2] gap problem. This gives average case hardness for a QMA language under classical access to a QCIP[2] decision oracle and is used in establishing negative results on witness encryption and quantum indistinguishability obfuscation.", "url": "https://arxiv.org/abs/2610.25657", "type": "理论", "summary": "我们研究量子验证者是否可以通过与知道状态的无界证明者交换经典消息来找到隐藏的量子状态。验证者可以访问有关目标的反射预言。对于 Haar 随机 $n$-qubit 目标，我们证明实现目标的恒定平均保真度需要 $(q+1)^2(B+1)=\\Omega(2^n)$，其中 $q$ 是验证者查询的数量，$B$ 是证明者与验证者之间的总通信量。该界限允许查询之间的任意经典交互和不受限制的计算。我们的证明将 Aaronson 和 Kuperberg 的下限从单一经典证明扩展到任意经典交互。结果，我们获得了 UniqueQMA 与 QCIP 的量子预言分离，其中包含多项式许多经典消息。特别地，我们给出一个统一的预言$\\mathcal{U}$，使得存在一种语言$L\\in\\mathrm{UniqueQMA}^{\\mathcal{U}}$，但$L\\notin\\mathrm{QCIP}^{\\mathcal{U}}$。我们进一步给出了一个被称为 QMA-QCIP[2] 差距问题的概念的预言机构建。\n\n这给出了 QMA 语言在 QCIP[2] 决策预言机的经典访问下的平均情况硬度，并用于建立见证加密和量子不可区分性混淆的负面结果。", "authors": [{"name": "Mohammed Barhoush"}], "featured_authors": [{"name": "Mohammed Barhoush"}], "author_count": 1}, {"id": "2610.25792", "category": "quant-ph", "title": "Perturbation theory for quantum information quantities of Gaussian states", "abstract": "Many quantum-information tasks can benefit from Gaussian quantum resources, while their fundamental performance limits are characterized by quantum information quantities. However, a unified perturbation theory for these quantities directly within the Gaussian-state formalism has been lacking. We develop such a theory for the von Neumann entropy, quantum relative entropy, quantum Chernoff quantity, and quantum fidelity, using perturbations of the moments of a reference Gaussian state. Using general Fréchet-derivative identities, we derive compact second-order expressions for reference-state covariance matrices whose symplectic eigenvalues are all greater than $1/2$. We also show that the perturbative quantum Chernoff quantity is maximized at its symmetric point, yielding the quantum Chernoff exponent (QCE). We further show that symplectic eigenvalues equal to 1/2 can lead to slower asymptotic vanishing, potentially improving the corresponding fundamental performance limits. For reference-state covariance matrices containing symplectic eigenvalues both equal to and greater than 1/2, we identify sufficient conditions under which the former determine the leading covariance-matrix contributions, allowing the remaining modes to be traced out without changing the leading-order asymptotic scaling or the coefficient. Applying the framework to quantum illumination and incoherent-light sub-Rayleigh object discrimination, we recover known asymptotic QCEs directly within the Gaussian-state formalism. In the latter problem, the slower asymptotic vanishing explains the known quadratic scaling of the QCE with the source separation.", "url": "https://arxiv.org/abs/2610.25792", "type": "理论", "summary": "许多量子信息任务可以受益于高斯量子资源，而它们的基本性能限制是由量子信息量来表征的。然而，直接在高斯状态形式主义中缺乏针对这些量的统一微扰理论。我们利用参考高斯态矩的扰动，发展了冯诺依曼熵、量子相对熵、量子切尔诺夫量和量子保真度的理论。使用一般的 Fréchet 导数恒等式，我们推导出辛特征值都大于 $1/2$ 的参考状态协方差矩阵的紧凑二阶表达式。我们还表明，微扰量子切尔诺夫量在其对称点处最大化，从而产生量子切尔诺夫指数（QCE）。我们进一步表明，等于 1/2 的辛特征值可以导致更慢的渐近消失，从而有可能改善相应的基本性能限制。\n\n对于包含等于或大于 1/2 的辛特征值的参考状态协方差矩阵，我们确定了前者确定前导协方差矩阵贡献的充分条件，从而允许在不更改前阶渐近标度或系数的情况下追踪剩余模式。将该框架应用于量子照明和非相干光亚瑞利物体辨别，我们直接在高斯态形式主义中恢复已知的渐近 QCE。在后一个问题中，较慢的渐近消失解释了 QCE 与源分离的已知二次缩放。", "authors": [{"name": "Zihao Gong"}, {"name": "Saikat Guha"}], "featured_authors": [{"name": "Zihao Gong"}, {"name": "Saikat Guha"}], "author_count": 2}, {"id": "2610.25968", "category": "quant-ph", "title": "Efficient Block Encodings for Ensembles of Molecular Hamiltonians", "abstract": "Accurately characterizing molecular properties and reactivity often requires electronic-structure calculations across an ensemble of molecular geometries. Quantum algorithms that process such ensembles coherently could address this challenge, but they require Hamiltonian block encoding circuits that combine advanced factorization techniques with sublinear scaling in ensemble size. Here, we introduce SVD-THC, which extends tensor hypercontraction to sets of Hamiltonians defined at different nuclear geometries through a singular value decomposition of the ensemble. We use SVD-THC to construct a single multiplexed block encoding circuit for all geometries in an ensemble. We then evaluate the approach on ensembles generated by varying internal rotational coordinates in 1-bromo-2-chloroethane as well as in glycine and alanine dipeptides, corresponding to established model systems for peptide conformational landscapes, with up to 5,184 geometries. Across several resolutions of the internal-coordinate grids, the Toffoli complexity of the resulting circuits grows only weakly with the number of geometries, changing by at most 12\\% over grids that differ in size by up to 576$\\times$. In an energy-thresholding circuit, this yields 35--200$\\times$ fewer Toffoli gates than slicing together single-geometry block encodings. This approach could help make coherent processing of molecular geometry ensembles a useful primitive for fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2610.25968", "type": "理论+数值", "summary": "准确表征分子性质和反应性通常需要跨整个分子几何形状进行电子结构计算。连贯地处理此类集合的量子算法可以解决这一挑战，但它们需要将先进的分解技术与集合大小的亚线性缩放相结合的哈密顿块编码电路。在这里，我们引入了 SVD-THC，它通过系综的奇异值分解将张量超收缩扩展到在不同核几何形状下定义的哈密顿量集。我们使用 SVD-THC 为整体中的所有几何结构构建单个多路复用块编码电路。然后，我们评估了通过改变 1-溴-2-氯乙烷以及甘氨酸和丙氨酸二肽中的内部旋转坐标生成的整体的方法，对应于已建立的肽构象景观模型系统，具有多达 5,184 个几何形状。在内坐标网格的多种分辨率中，所得电路的 Toffoli 复杂度仅随着几何图形数量的增加而微弱增长，在尺寸差异高达 576$\\times$ 的网格上最多变化 12\\%。\n\n在能量阈值电路中，与将单几何块编码切片在一起相比，这会减少 35--200$\\times$ 的 Toffoli 门。这种方法可以帮助使分子几何系综的相干处理成为容错量子计算的有用原语。", "authors": [{"name": "Cristian L. Cortes"}, {"name": "Andrew J. Jenkins"}, {"name": "William Pol"}, {"name": "Dario Rocca"}, {"name": "Mark Steudtner"}, {"name": "Gian-Luca R. Anselmetti"}, {"name": "Matthias Degroote"}, {"name": "Nikolaj Moll"}, {"name": "Raffaele Santagati"}, {"name": "Michael Streif"}, {"name": "Markus R. Hermann"}], "featured_authors": [{"name": "Cristian L. Cortes"}, {"name": "Andrew J. Jenkins"}, {"name": "William Pol"}, {"name": "Raffaele Santagati"}, {"name": "Michael Streif"}, {"name": "Markus R. Hermann"}], "author_count": 11}, {"id": "2610.26052", "category": "quant-ph", "title": "HyQ-LC: Improving Light-Curve Classification with Hybrid Quantum--Classical Learning", "abstract": "Light curves reveal stellar variability and support studies of stellar evolution and cosmic distances. Reliable classification is therefore important for large time-domain surveys. We present HyQ-LC for ten-class stellar light-curve classification using 359 handcrafted features and 633,034 training objects. The main model combines a window multilayer perceptron (MLP) backbone with a nine-qubit readout using amplitude encoding and angle re-uploading. Both this hybrid and its pure-MLP control have 44,238 parameters. On a shared 20,000-object test set, the hybrid has macro-averaged F1 (Macro-F1) point gains of 0.8276 and 1.2393 percentage points over the pure MLP on two fine-tuning seeds. A separate fixed-fusion configuration achieves slightly higher Macro-F1 but lower accuracy than approximately budget-matched LightGBM. Its positive class-level differences are concentrated in CEP, RRC, and ROT, while the full-budget LightGBM reference scores higher on both metrics. All circuits are simulated classically. The comparisons retain existing validation-selected checkpoints and use the same test objects, with features, predictions, and recomputation code publicly available. The results identify point-estimate improvements over the tested controls while leaving the specific contribution of the quantum branch unresolved.", "url": "https://arxiv.org/abs/2610.26052", "type": "理论+数值", "summary": "光变曲线揭示了恒星的变化并支持恒星演化和宇宙距离的研究。因此，可靠的分类对于大型时域调查非常重要。我们使用 359 个手工制作的特征和 633,034 个训练对象，提出了用于十类恒星光曲线分类的 HyQ-LC。主模型将窗口多层感知器 (MLP) 主干与使用幅度编码和角度重新上传的九量子位读出相结合。这种混合及其纯 MLP 控制都有 44,238 个参数。在共享 20,000 个对象的测试集上，混合模型在两个微调种子上的宏观平均 F1 (Macro-F1) 点增益比纯 MLP 提高了 0.8276 和 1.2393 个百分点。单独的固定融合配置实现的 Macro-F1 略高，但精度低于预算匹配的 LightGBM。其积极的类别级别差异集中在 CEP、RRC 和 ROT 上，而全预算 LightGBM 参考在这两个指标上得分较高。所有电路均经过经典模拟。这些比较保留了现有的验证选择的检查点，并使用相同的测试对象，以及公开可用的功能、预测和重新计算代码。\n\n结果确定了对测试控制的点估计改进，同时未解决量子分支的具体贡献。", "authors": [{"name": "Xinghang Yu"}, {"name": "Bin Yang"}], "featured_authors": [{"name": "Xinghang Yu"}, {"name": "Bin Yang"}], "author_count": 2}, {"id": "2610.26120", "category": "quant-ph", "title": "Multi-path Security in Quantum Networks with Trusted Nodes", "abstract": "Quantum communication networks promise information-theoretic security but this security collapses if intermediate relay nodes are compromised, a risk that grows sharply when compromised nodes cannot be identified. We address this twofold: first, we show that multi-path routing provides quantifiable protection against unidentified compromised nodes. Second, we provide a comprehensive statistical and graph-theoretic analysis of network and node security under compromise, covering full and partial node compromise, optimal placement of additional edges via an iterative method, and comparative hacking-probability analysis across network topologies. Together, these results identify the topology and multi-path routing strategy that most improves security for a given network. We apply this framework to quantum key distribution across multiple network topologies, demonstrating a scalable route to secure, reliable quantum communication under realistic, unidentified adversarial threats, without relying on quantum memory.", "url": "https://arxiv.org/abs/2610.26120", "type": "理论", "summary": "量子通信网络承诺信息论安全，但如果中间中继节点受到损害，这种安全性就会崩溃，而当无法识别受损害的节点时，这种风险就会急剧增加。我们从两个方面解决这个问题：首先，我们证明多路径路由可以针对未识别的受损节点提供可量化的保护。其次，我们提供了对受到损害的网络和节点安全性的全面统计和图论分析，涵盖全部和部分节点损害、通过迭代方法优化附加边缘的位置，以及跨网络拓扑的比较黑客概率分析。这些结果共同确定了最能提高给定网络安全性的拓扑和多路径路由策略。我们将该框架应用于跨多个网络拓扑的量子密钥分发，展示了在现实的、未知的对抗性威胁下实现安全、可靠的量子通信的可扩展路线，而无需依赖量子存储器。", "authors": [{"name": "Muhammad Kumail Haider"}, {"name": "Aeysha Khalique"}], "featured_authors": [{"name": "Muhammad Kumail Haider"}, {"name": "Aeysha Khalique"}], "author_count": 2}, {"id": "2610.26126", "category": "quant-ph", "title": "Enhanced charging in open Rabi and Dicke quantum batteries", "abstract": "We investigate open-system charging protocols for Rabi and Dicke quantum batteries under direct incoherent pumping. The charging dynamics follows a Lindblad master equation, while effective non-Hermitian generators describe the conditioned no-jump mechanism. For a single Rabi battery, this pumping suppresses coherent energy backflow, broadens the high-energy charging window, and improves robustness against both timing errors and detuning. At the selected Rabi operating points, pumping also increases ergotropy and the extractable fraction of the stored energy. For finite Dicke batteries, direct incoherent pumping likewise stabilizes the charging dynamics. Across the finite-size scan, the strongest pump considered improves the peak stored energy and ergotropy per cell and near-peak timing robustness relative to the Hermitian reference. The maximum average charging power also increases, although this metric includes pump-assisted jump contributions. Equal-input comparisons show that the relative performance of common-cavity Dicke and independent Rabi batteries varies with the pump-input bound. Taken together, these results show that direct incoherent pumping provides a route to stabilized charging in Rabi and finite Dicke quantum batteries.", "url": "https://arxiv.org/abs/2610.26126", "type": "理论", "summary": "我们研究了直接非相干泵浦下拉比和迪克量子电池的开放系统充电协议。充电动力学遵循 Lindblad 主方程，而有效的非厄米发电机描述了条件无跳跃机制。对于单个 Rabi 电池，这种泵浦抑制了相干能量回流，拓宽了高能充电窗口，并提高了针对定时误差和失谐的鲁棒性。在选定的拉比工作点，泵送还增加了各向异性和所存储能量的可提取部分。对于有限的迪克电池，直接非相干泵浦同样可以稳定充电动态。在有限尺寸扫描中，考虑的最强泵浦提高了每个单元的峰值存储能量和各向异性以及相对于埃尔米特参考的近峰值定时鲁棒性。最大平均充电功率也增加了，尽管该指标包括泵浦辅助跳跃的贡献。等输入比较表明，共腔 Dicke 电池和独立 Rabi 电池的相对性能随泵浦输入范围的变化而变化。\n\n综上所述，这些结果表明直接非相干泵浦为拉比和有限迪克量子电池的稳定充电提供了一条途径。", "authors": [{"name": "A-Long Zhou"}, {"name": "Nuo Xu"}, {"name": "Ya-Wen Xiao"}, {"name": "Li-Li Gao"}, {"name": "Long-Jie Li"}, {"name": "Zi-Min Li"}, {"name": "Chuan-Cun Shu"}], "featured_authors": [{"name": "A-Long Zhou"}, {"name": "Nuo Xu"}, {"name": "Ya-Wen Xiao"}, {"name": "Long-Jie Li"}, {"name": "Zi-Min Li"}, {"name": "Chuan-Cun Shu"}], "author_count": 7}, {"id": "2610.26222", "category": "quant-ph", "title": "A Readout-Aware Theory of Approximate Heisenberg Propagation", "abstract": "Classical methods for computing quantum expectation values often propagate observables in the Heisenberg picture. To remain tractable, these methods rely on approximations that discard operator components during evolution. Yet the magnitude of these components alone does not determine the resulting expectation-value error, which also depends on their subsequent evolution and the input state. We develop \\emph{generalized Pauli propagation}, a common algebraic framework encompassing Pauli propagation, Lie-algebraic simulation, and Krylov subspace methods. Using weighted commutator graphs, we derive exact identities that relate approximation errors to the signed contributions of omitted and discarded operator components. Our central result establishes \\emph{delayed observability}, identifying conditions under which these contributions vanish at low orders in propagation time. We use this structure to develop finite-order error estimates and state-dependent selection rules. We further prove that retaining the symmetry-preserving part of a weak perturbation eliminates first-order expectation-value errors under suitable symmetry conditions. By revealing how approximation errors affect the desired expectation value, our framework provides a basis for more informative error analysis and the development of readout-aware simulation strategies.", "url": "https://arxiv.org/abs/2610.26222", "type": "理论+数值", "summary": "计算量子期望值的经典方法通常会在海森堡图中传播可观测量。为了保持易于处理，这些方法依赖于在进化过程中丢弃算子组件的近似值。然而，这些分量的大小本身并不能决定所产生的期望值误差，这还取决于它们随后的演化和输入状态。我们开发了 \\emph{广义泡利传播}，一个包含泡利传播、李代数模拟和 Krylov 子空间方法的通用代数框架。使用加权换向图，我们得出精确的恒等式，将近似误差与省略和丢弃的运算符组件的有符号贡献联系起来。我们的中心结果建立了 \\emph{延迟可观测性}，确定了这些贡献在传播时间的低阶下消失的条件。我们使用这种结构来开发有限阶误差估计和状态相关的选择规则。我们进一步证明，在适当的对称条件下，保留弱扰动的对称性保持部分可以消除一阶期望值误差。\n\n通过揭示近似误差如何影响所需的期望值，我们的框架为更信息丰富的误差分析和读出感知模拟策略的开发提供了基础。", "authors": [{"name": "Yubraj Bhandari"}, {"name": "Jakob S. Kottmann"}, {"name": "Adelina Bärligea"}], "featured_authors": [{"name": "Yubraj Bhandari"}, {"name": "Jakob S. Kottmann"}, {"name": "Adelina Bärligea"}], "author_count": 3}, {"id": "2610.26246", "category": "quant-ph", "title": "Universal Quantum Criticality from a Gaussian Variational Manifold", "abstract": "Universal behavior at continuous phase transitions is encoded in long-wavelength fixed-point theories controlled by dimensionality and symmetries. It is a central question for which systems this universal behavior and the underlying long-wavelength description can be captured by a noninteracting theory allowing for analytical and accurate predictions. In this work we provide a systematic procedure for obtaining the best noninteracting fermionic description of a quantum phase transition through fermionic Gaussian states. We demonstrate the performance of our procedure for the interacting long-range transverse-field Ising chain. This formulation reduces the problem to a self-consistent Euler equation that yields a critical line in close agreement with independent numerical benchmarks, while its singular momentum structure provides analytic predictions for continuously varying critical properties. Yet exact diagonalization shows that Gaussian-state fidelity to the exact ground state is poorest, and non-Gaussianity strongest, near the transition. Thus, accurate predictions for critical properties can emerge from the Gaussian variational description even where its microscopic wave-function approximation is weakest.", "url": "https://arxiv.org/abs/2610.26246", "type": "理论+数值", "summary": "连续相变的普遍行为被编码在由维度和对称性控制的长波长定点理论中。一个核心问题是，对于哪些系统来说，这种普遍行为和潜在的长波长描述可以通过非相互作用理论来捕获，从而进行分析和准确的预测。在这项工作中，我们提供了一个系统程序，用于通过费米高斯态获得量子相变的最佳非相互作用费米描述。我们展示了我们的程序在相互作用的远程横向场伊辛链上的性能。该公式将问题简化为自洽欧拉方程，该方程产生与独立数值基准非常一致的临界线，而其奇异动量结构为连续变化的临界属性提供了分析预测。然而，精确对角化表明，在过渡附近，对精确基态的高斯态保真度最差，非高斯态保真度最强。\n\n因此，即使其微观波函数近似最弱，高斯变分描述也可以准确预测关键特性。", "authors": [{"name": "Reyhaneh Khasseh"}, {"name": "Fabian Ballar Trigueros"}, {"name": "Markus Heyl"}, {"name": "M. A. Rajabpour"}], "featured_authors": [{"name": "Reyhaneh Khasseh"}, {"name": "Fabian Ballar Trigueros"}, {"name": "Markus Heyl"}, {"name": "M. A. Rajabpour"}], "author_count": 4}, {"id": "2610.26279", "category": "quant-ph", "title": "Physics-anchored residual quantum neural networks for cloud-cover parameterization", "abstract": "Compact quantum neural networks have been explored for cloud-cover parameterization, but their predictive value depends on how physical knowledge is incorporated and which classical models provide the reference. We investigate an offline residual formulation that retains a fitted \\XR\\ cloud-cover estimate and learns a correction to its logit in transformed target space. Using released ICON/DYAMOND-derived data, we compare ten model variants in six- and eight-input settings, with three matched replicates and 10,000 training samples per replicate. All quantum circuits use local Z readout and noiseless exact expectation values. Under a common 30-epoch protocol, residual prediction reduced physical-space test mean squared error relative to direct QNN prediction by 54.3\\% and 38.8\\% for six-input XYZ and ZZXY circuits, and by 49.2\\% and 38.9\\% for their eight-input versions. Residual QNNs also outperformed the selected compact residual multilayer perceptron in every paired replicate. A larger, longer-trained Grundner-Q1 adaptation nevertheless achieved lower error: residual Q1 reached mean MSEs of 0.00778 and 0.00791, compared with 0.01124 and 0.01082 for residual XYZ. The results support residual prediction for compact simulated QNNs within the tested budget and establish a clear boundary set by stronger classical references. They do not establish computational quantum advantage or online climate-model skill.", "url": "https://arxiv.org/abs/2610.26279", "type": "理论", "summary": "紧凑量子神经网络已被探索用于云层参数化，但其预测价值取决于如何整合物理知识以及哪些经典模型提供参考。我们研究了一种离线残差公式，该公式保留了拟合的 \\XR\\ 云覆盖估计，并学习了对其在变换后的目标空间中的 logit 的校正。使用发布的 ICON/DYAMOND 派生数据，我们比较了 6 个和 8 个输入设置中的 10 个模型变体，其中三个匹配的重复项和每个重复项 10,000 个训练样本。所有量子电路都使用本地 Z 读数和无噪声精确期望值。在常见的 30 epoch 协议下，相对于直接 QNN 预测，残差预测将六输入 XYZ 和 ZZXY 电路的物理空间测试均方误差降低了 54.3% 和 38.8%，将八输入版本的物理空间测试均方误差降低了 49.2% 和 38.9%。在每对重复中，残差 QNN 的性能也优于所选的紧凑残差多层感知器。然而，规模更大、训练时间更长的 Grundner-Q1 适应实现了更低的误差：残差 Q1 达到了 0.00778 和 0.00791 的平均 MSE，而残差 XYZ 的平均 MSE 为 0.01124 和 0.01082。\n\n结果支持在测试预算内对紧凑模拟 QNN 进行残差预测，并通过更强的经典参考建立清晰的边界集。他们没有建立计算量子优势或在线气候模型技能。", "authors": [{"name": "Zhuo Wang"}, {"name": "Ce Yu"}, {"name": "Bin Yang"}], "featured_authors": [{"name": "Zhuo Wang"}, {"name": "Ce Yu"}, {"name": "Bin Yang"}], "author_count": 3}, {"id": "2610.26435", "category": "quant-ph", "title": "Giant Rydberg Excitons Delineated as Relativistic Bound States", "abstract": "We examined the energy-momentum relationship of the valence band of Cu$_2$O, which has gained interest as an emerging solid host for giant Rydberg states. Our findings reveal a nonparabolic dispersion, described using the rest mass (0.570 times the free electron mass) and rescaled light speed ($1.6\\times 10^5$ m/s), which draws parallels with relativistic theory for high-energy particles. We propose a straightforward expression for the bound-state energies of Rydberg excitons with finite quantum defects, whose energy scheme deviates from the hydrogenic series. This formulation identifies relativistic kinematics as the physical origin of quantum defects, offering a streamlined basis for future studies on complex many-body correlations.", "url": "https://arxiv.org/abs/2610.26435", "type": "理论", "summary": "我们研究了 Cu$_2$O 价带的能量-动量关系，它作为巨型里德堡态的新兴固体主体而引起了人们的兴趣。我们的发现揭示了非抛物线色散，使用静止质量（自由电子质量的 0.570 倍）和重新调整的光速（1.6×10^5$ m/s）来描述，这与高能粒子的相对论理论相似。我们提出了具有有限量子缺陷的里德伯激子束缚态能量的直接表达式，其能量方案偏离了氢级数。该公式将相对论运动学确定为量子缺陷的物理起源，为未来复杂多体相关性的研究提供了简化的基础。", "authors": [{"name": "Mitsuyoshi Takahata"}, {"name": "Ikuko Akimoto"}, {"name": "Nobuko Naka"}], "featured_authors": [{"name": "Mitsuyoshi Takahata"}, {"name": "Ikuko Akimoto"}, {"name": "Nobuko Naka"}], "author_count": 3}, {"id": "2610.26465", "category": "quant-ph", "title": "The Four-Qubit Hyperbolic Quadric Has Contextuality Degree 315", "abstract": "The contextuality degree of a set of Pauli contexts is the least number of contexts that every noncontextual $\\pm1$ assignment violates. For the four-qubit hyperbolic quadric $\\mathcal{Q}^{+}(7,2)$, with $135$ points and $1575$ lines as contexts, Muller et al. conjectured from heuristic searches that the degree is $315$ and that the violated contexts of every optimal assignment form a dual polar space $DW(5,2)$. We prove both conjectures. The lower bound has a short proof by hand: every doily ($GQ(2,2)$) of the quadric contains ten Peres-Mermin grids covering each of its lines four times, so every assignment violates at least three of its fifteen lines, and averaging over the doilies gives $1575/5=315$. The equality case is local: an assignment is optimal exactly when it violates one ruling of one grid in every doily. Using this as a SAT encoding, we show that there are exactly $240$ optimal violated sets, one orbit of $\\mathrm{O}^+(8,2)$, each isomorphic to $DW(5,2)$. The same argument gives the first lower bounds $\\lceil L/5\\rceil$ for all quadrics with $L$ lines in $N\\ge4$ qubits. The degree theorem is kernel-checked in Lean 4, and the completeness of the enumeration is certified by a DRAT proof checked by the verified checker cake_lpr.", "url": "https://arxiv.org/abs/2610.26465", "type": "理论", "summary": "一组 Pauli 上下文的上下文关联度是每个非上下文 $\\pm1$ 赋值所违反的最少上下文数量。对于四量子位双曲二次曲面 $\\mathcal{Q}^{+}(7,2)$，以 $135$ 点和 $1575$ 线作为上下文，Muller 等人。根据启发式搜索推测，度数为 $315$，并且每个最优分配的违反上下文形成双极空间 $DW(5,2)$。我们证明了这两个猜想。下界有一个简短的手工证明：二次曲线的每个桌布 ($GQ(2,2)$) 包含 10 个 Peres-Mermin 网格，覆盖其每条线四次，因此每次分配至少违反其 15 条线中的 3 条，对桌布进行平均得到 $1575/5=315$。平等情况是局部的：当一项分配违反了每个桌巾中一个网格的一项规则时，它就是最佳的。使用它作为 SAT 编码，我们表明正好有 $240$ 最优违反集，一个 $\\mathrm{O}^+(8,2)$ 轨道，每个轨道都与 $DW(5,2)$ 同构。同样的参数给出了 $N\\ge4$ 量子位中具有 $L$ 线的所有二次曲面的第一个下界 $\\lceil L/5\\rceil$。\n\n度定理在 Lean 4 中进行了内核检查，枚举的完整性由经过验证的检查器 cake_lpr 检查的 DRAT 证明进行了证明。", "authors": [{"name": "Zhengyu Li"}, {"name": "Amandeep Gupta"}, {"name": "Vijay Ganesh"}], "featured_authors": [{"name": "Zhengyu Li"}, {"name": "Amandeep Gupta"}, {"name": "Vijay Ganesh"}], "author_count": 3}, {"id": "2610.26483", "category": "quant-ph", "title": "Majorization for superpositions of nonorthogonal states and the existence of golden states", "abstract": "In the resource theory of superposition relative to linearly independent, nonorthogonal reference states, golden states are known for two reference states and for special overlap matrices, and all of them are maximally coherent in the Löwdin basis. We clarify what decides their existence and their Löwdin structure. The robustness and the geometric measure of superposition are maximized by the same states, which overlap equally with every reference state; their maximal values are set by the ground-state energy of a classical $XY$ model on the overlaps of the dual basis. For every overlap matrix, these states, and only these, are golden under the maximal superposition-free operations, but they need not be maximally coherent in the Löwdin basis. For the Kraus-type free operations, we prove a necessary and sufficient criterion, Gram majorization, for converting pure states into targets with nonzero coefficients; it reduces to majorization for orthonormal reference states. It shows that golden states of these operations must be maximally coherent in the Löwdin basis, but that this does not ensure their existence: three reference states that are not orthonormal admit a golden state if and only if their overlaps have a common modulus $s$ and their Bargmann phase $\\Phi$ obeys $s\\geq2\\cos[(\\pi+|\\Phi|)/3]$. Equal-overlap states also yield a complete family of superposition witnesses in the Löwdin basis, which show that white noise on the span of the reference states is a resource unless these states are orthonormal.", "url": "https://arxiv.org/abs/2610.26483", "type": "理论", "summary": "在相对于线性无关、非正交参考态的叠加资源理论中，黄金态以两个参考态和特殊重叠矩阵而闻名，并且所有这些在 Löwdin 基中都是最大相干的。我们澄清是什么决定了它们的存在和 Löwdin 结构。鲁棒性和叠加的几何测度通过相同的状态最大化，这些状态与每个参考状态均等地重叠；它们的最大值由经典 $XY$ 模型在对偶基础重叠上的基态能量设置。对于每个重叠矩阵，这些状态（并且只有这些状态）在最大无叠加运算下是黄金状态，但它们不需要在 Löwdin 基中最大程度地相干。对于克劳斯型自由运算，我们证明了将纯态转换为具有非零系数的目标的必要且充分的准则，即格拉姆大化；它减少到正交参考状态的主要化。\n\n它表明这些运算的黄金态在 Löwdin 基础上必须是最大相干的，但这并不能确保它们的存在：三个非正交参考态当且仅当它们的重叠具有公共模数 $s$ 并且它们的巴格曼相位 $\\Phi$ 服从 $s\\geq2\\cos[(\\pi+|\\Phi|)/3]$ 时才承认黄金态。等重叠状态还在 Löwdin 基础上产生了完整的叠加见证族，这表明参考状态跨度上的白噪声是一种资源，除非这些状态是正交的。", "authors": [{"name": "Gökhan Torun"}], "featured_authors": [{"name": "Gökhan Torun"}], "author_count": 1}, {"id": "2610.26603", "category": "quant-ph", "title": "Beyond Fidelity: Resolving Errors in Photonic Seed State Generation", "abstract": "An important aspect of many linear optical quantum computing architectures is probabilistically generating small dual-rail qubit entangled states, or seed states. While many schemes to achieve this have been discovered, attention has been primarily focused on minimizing input resources and maximizing success probability rather than establishing a detailed understanding of linear-optical error performance. In this work, we develop a framework for resolving sensitivities to physically distinct errors in linear optical state generation, allowing us to identify precise ways in which these errors affect the properties of the output state. We use this framework to identify seed state generators in which destructive many-photon interference prevents detector loss and detector noise from causing a falsely successful heralding event. We show that this effect suppresses errors, for example cutting the effective loss on the output of particular Bell state generators in half relative to a standard scheme. We also present a new Bell state generator in which both detector loss and detector noise do not affect the quality of the output Bell state to first order, and a 4GHZ generator with >75% higher success probability than a standard circuit. In addition we provide some useful identities, bounds and invariants for studying linear optical seed state generation.", "url": "https://arxiv.org/abs/2610.26603", "type": "理论", "summary": "许多线性光学量子计算架构的一个重要方面是概率地生成小型双轨量子位纠缠态或种子态。虽然已经发现了许多实现这一目标的方案，但人们的注意力主要集中在最小化输入资源和最大化成功概率上，而不是建立对线性光学误差性能的详细理解。在这项工作中，我们开发了一个框架，用于解决线性光学状态生成中物理上不同错误的敏感性，使我们能够确定这些错误影响输出状态属性的精确方式。我们使用这个框架来识别种子状态发生器，其中破坏性的多光子干涉可以防止探测器丢失和探测器噪声导致错误成功的预示事件。我们证明这种效应可以抑制误差，例如，相对于标准方案，将特定贝尔状态发生器输出的有效损耗减少一半。\n\n我们还提出了一种新的贝尔状态发生器，其中探测器损耗和探测器噪声都不会影响一阶输出贝尔状态的质量，并且 4GHZ 发生器的成功概率比标准电路高 75% 以上。此外，我们还提供了一些有用的恒等式、界限和不变量来研究线性光学种子状态的生成。", "authors": [{"name": "Sara Bartolucci"}, {"name": "Patrick Birchall"}, {"name": "Jacob Bulmer"}, {"name": "Sam Gartenstein"}, {"name": "Mihir Pant"}, {"name": "Terry Rudolph"}, {"name": "Chris Sparrow"}, {"name": "Andrzej Veitia"}], "featured_authors": [{"name": "Sara Bartolucci"}, {"name": "Patrick Birchall"}, {"name": "Jacob Bulmer"}, {"name": "Terry Rudolph"}, {"name": "Chris Sparrow"}, {"name": "Andrzej Veitia"}], "author_count": 8}, {"id": "2610.26620", "category": "quant-ph", "title": "Non-Markovian exceptional points and information backflow: a Heisenberg reaction-coordinate approach", "abstract": "The primary pathway to the investigation of exceptional points (EPs) in open quantum systems has been the use of Markovian master equations. However, recently it has been realised that they can arise in settings that show non-Markovian behaviour. The main approach in this direction has been the use of pseudomodes, which allow the influence of a structured environment to be replaced by new damped auxiliary modes. In this work, we use a Heisenberg-equation approach which relies on the reaction-coordinate formalism to obtain exact analytical dynamics. First, we show how our method considerably simplifies the analysis compared to the use of master equations. Second, we utilise it to discuss non-Markovian revivals in systems with second and higher-order EPs, showing that the notion that EPs demarcate the onset of revivals is not generally true. We then utilise our results to discuss the dynamical effects of higher-order non-Markovian EPs, deriving bounds on the number of revivals and investigating enhanced asymptotic relaxation near higher-order EPs. Finally, we investigate non-Markovian EPs with engineered reservoirs and show how they can be utilised to control the rate of irreversible information loss.", "url": "https://arxiv.org/abs/2610.26620", "type": "理论", "summary": "研究开放量子系统中的异常点 (EP) 的主要途径是使用马尔可夫主方程。然而，最近人们意识到它们可能出现在表现出非马尔可夫行为的环境中。这个方向的主要方法是使用伪模态，它允许用新的阻尼辅助模态代替结构化环境的影响。在这项工作中，我们使用海森堡方程方法，该方法依赖于反应坐标形式来获得精确的分析动力学。首先，我们展示了与使用主方程相比，我们的方法如何显着简化分析。其次，我们利用它来讨论具有二阶和高阶 EP 的系统中的非马尔可夫复兴，表明 EP 划分复兴开始的概念通常并不正确。然后，我们利用我们的结果来讨论高阶非马尔可夫 EP 的动力学效应，导出复兴次数的界限并研究高阶 EP 附近的增强渐近松弛。\n\n最后，我们研究了带有工程储存库的非马尔可夫 EP，并展示了如何利用它们来控制不可逆信息丢失的速度。", "authors": [{"name": "Daniel Holst"}, {"name": "Gianmichele Blasi"}, {"name": "Shishir Khandelwal"}], "featured_authors": [{"name": "Daniel Holst"}, {"name": "Gianmichele Blasi"}, {"name": "Shishir Khandelwal"}], "author_count": 3}, {"id": "2610.26687", "category": "quant-ph", "title": "Ground-State Sampling Correspondence between Penalty-Based and Constrained Quantum Annealing", "abstract": "Quantum annealing generally samples degenerate ground states with nonuniform probabilities. This unfair sampling depends on how the driver Hamiltonian couples these states near the end of annealing. For combinatorial optimization problems with a cardinality constraint, the penalty method and constrained quantum annealing (CQA) differ in these couplings. The transverse-field driver of the penalty method does not directly couple feasible ground states, whereas the fully connected XY driver of CQA couples pairs of them related by a single spin exchange. We investigate how this difference affects ground-state sampling, using closed-system simulations of random graph bipartitioning instances together with degenerate perturbation theory. For the instances studied, the conditional ground-state distribution of penalty-based quantum annealing approaches that of CQA at sufficiently large penalties and long annealing times. This convergence can be explained by the effective Hamiltonian of penalty-based quantum annealing, in which virtual single-spin flips to infeasible states generate a second-order interaction proportional to the CQA driver projected onto the feasible ground-state manifold, which is the leading term of the effective Hamiltonian of CQA. In the numerical simulations, the Jensen--Shannon divergence between the conditional ground-state distributions of penalty-based quantum annealing and CQA decreases approximately as the inverse square of the penalty-to-objective energy ratio, consistent with the perturbative analysis. This correspondence between the effective Hamiltonians extends to equal-weight fixed-magnetization constraints under the same perturbative conditions, providing a common mechanism for sampling bias in the two implementations.", "url": "https://arxiv.org/abs/2610.26687", "type": "理论+数值", "summary": "量子退火通常以非均匀概率对简并基态进行采样。这种不公平的采样取决于驱动器哈密顿量在退火即将结束时如何耦合这些状态。对于具有基数约束的组合优化问题，惩罚方法和约束量子退火 (CQA) 在这些耦合方面有所不同。惩罚方法的横向场驱动器不直接耦合可行的基态，而 CQA 的全连接 XY 驱动器通过单个自旋交换耦合它们。我们使用随机图二分实例的封闭系统模拟以及简并扰动理论来研究这种差异如何影响基态采样。对于所研究的实例，基于罚分的量子退火的条件基态分布在足够大的罚分和长退火时间下接近 CQA 的条件基态分布。\n\n这种收敛可以通过基于惩罚的量子退火的有效哈密顿量来解释，其中虚拟单自旋翻转到不可行状态生成与投影到可行基态流形上的 CQA 驱动器成比例的二阶相互作用，这是 CQA 有效哈密顿量的首项。在数值模拟中，基于罚分的量子退火和 CQA 的条件基态分布之间的 Jensen-Shannon 散度大约随着罚分与目标能量比的平方反比而减小，这与微扰分析一致。有效哈密顿量之间的这种对应关系扩展到相同扰动条件下的等权固定磁化约束，为两种实现中的采样偏差提供了通用机制。", "authors": [{"name": "Shunta Ide"}, {"name": "Shu Tanaka"}], "featured_authors": [{"name": "Shunta Ide"}, {"name": "Shu Tanaka"}], "author_count": 2}, {"id": "2610.26725", "category": "quant-ph", "title": "Quantum Optimal Control Primer", "abstract": "This is a set of detailed notes that are part of a Ph.D. Course on Quantum Control delivered at the Department of Chemistry of Seoul National University in 2014. Part of this course was also taught in the Department of Chemistry of the Friedrich Schiller University Jena. It focuses on quantum optimal control and quantum optimal control algorithms based on the gradient and extended gradient methods.", "url": "https://arxiv.org/abs/2610.26725", "type": "数值", "summary": "这是一组详细的笔记，是博士学位的一部分。 2014年在首尔国立大学化学系教授量子控制课程。该课程的部分内容也在耶拿大学化学系教授。主要研究量子最优控制以及基于梯度和扩展梯度方法的量子最优控制算法。", "authors": [{"name": "Ignacio R. Sola"}], "featured_authors": [{"name": "Ignacio R. Sola"}], "author_count": 1}, {"id": "2610.26753", "category": "quant-ph", "title": "A General Master Equation for Two Accelerated Detectors: Stationary States and Entanglement", "abstract": "We derive a general Gorini-Kossakowski-Lindblad-Sudarshan master equation for two co-located, uniformly accelerated two-level detectors weakly coupled to scalar fields in the Minkowski vacuum, retaining coherent and dissipative contributions for arbitrary orientations, field masses, and spacetime dimensions. For equal orientations, we determine stationary states and their entanglement for two couplings to massless fields in four dimensions: symmetric coupling yields acceleration-dependent concurrence, whereas rotating-wave coupling gives acceleration-independent concurrence.", "url": "https://arxiv.org/abs/2610.26753", "type": "理论", "summary": "我们推导了两个同位、均匀加速的两级探测器的通用 Gorini-Kossakowski-Lindblad-Sudarshan 主方程，它们与 Minkowski 真空中的标量场弱耦合，保留了对任意方向、场质量和时空维度的相干和耗散贡献。对于相同的方向，我们确定四个维度中与无质量场的两个耦合的静止状态及其纠缠：对称耦合产生与加速度相关的并发，而旋转波耦合产生与加速度无关的并发。", "authors": [{"name": "Riccardo Acquaviva"}, {"name": "Paolo Facchi"}], "featured_authors": [{"name": "Riccardo Acquaviva"}, {"name": "Paolo Facchi"}], "author_count": 2}, {"id": "2610.26783", "category": "quant-ph", "title": "PPT-assisted capacities of bosonic Gaussian channels", "abstract": "We determine the exact quantum communication and entanglement-distribution capacities of three fundamental bosonic channels, namely thermal loss, thermal amplification and additive Gaussian noise, assisted by operations that completely preserve positive partial transpose (PPT). These operations are more powerful than local operations and classical communication (LOCC), but cannot generate distillable entanglement on their own. For thermal loss, the unconstrained capacity coincides with the Pirandola-Laurenza-Ottaviani-Banchi (PLOB) bound throughout the non-entanglement-breaking regime. The corresponding upper bounds are also attained for thermal amplification and additive noise. We extend these results to energy-constrained communication, establishing exact capacities for all three channels at every prescribed mean input energy. Our results solve a class of bosonic capacity problems under PPT assistance and establish exact benchmarks for determining whether the same communication rates can be achieved via LOCC alone.", "url": "https://arxiv.org/abs/2610.26783", "type": "理论", "summary": "我们在完全保留正部分转置（PPT）的操作的辅助下，确定了三个基本玻色子通道（即热损耗、热放大和加性高斯噪声）的精确量子通信和纠缠分布能力。这些操作比本地操作和经典通信（LOCC）更强大，但不能自行生成可蒸馏的纠缠。对于热损失，无约束容量与整个非纠缠破坏区域中的 Pirandola-Laurenza-Ottaviani-Banchi (PLOB) 边界一致。热放大和附加噪声也达到了相应的上限。我们将这些结果扩展到能量受限的通信，在每个规定的平均输入能量下建立所有三个通道的精确容量。我们的结果解决了 PPT 辅助下的一类玻色子容量问题，并建立了精确的基准来确定是否可以单独通过 LOCC 实现相同的通信速率。", "authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "featured_authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "author_count": 2}, {"id": "2610.26784", "category": "quant-ph", "title": "High-Accuracy Propagation-Assisted Local Decoding for Fast Transversal Clifford Circuits", "abstract": "We benchmark the Iterative Redecode Scheme (IRS) on fast transversal Clifford circuits, achieving high-accuracy correlated decoding using local memory-style detectors and decoders. On a deep random Clifford benchmark, IRS yields approximately $4\\times$ lower logical failure rates than the ghost protocol at $d=11$ with matched buffers, and $15\\times$ lower rates than logical observable matching (LOM). In three-block GHZ preparation, IRS achieves $2\\times$ lower logical error rates than reliable logical Pauli-product decoding with matched initialisation, improving to $25\\times$ at $d=19$ with $\\lceil d/2\\rceil$ full initialisation rounds. We place IRS, which builds on Wan et al.'s scheme, within a broader propagation-assisted local (PAL) framework, where local decoders exchange messages rather than decoding a global hypergraph. IRS alternates local minimum-weight perfect matching (MWPM) on memory-equivalent detector error models (DEMs) with Pauli-frame propagation and detector updates across transversal CNOT layers, seeking local error estimates consistent with the global detector record. Prior-informed DEMs account for probabilities of propagated errors missing from the memory-equivalent model, improving initial decoding and reducing logical error rates. Zero-weight physical Pauli mechanisms enable inference and propagation of initially indeterminate stabilizer outcomes. Error rates saturate after a few iterations even for deep, adversarial alternating-tCNOT circuits, allowing iteration caps with negligible loss of accuracy. We find syndrome-extraction buffers of order $\\lfloor d/4\\rfloor$ sufficient for distance-dependent error suppression in the demanding regimes studied. The approach extends to other local decoders and CSS codes; for repeated logical $S$ gates, IRS achieves approximately $4$ to $10\\times$ lower logical error rates than LOM, depending on initialisation.", "url": "https://arxiv.org/abs/2610.26784", "type": "理论", "summary": "我们在快速横向 Clifford 电路上对迭代重解码方案 (IRS) 进行基准测试，使用本地内存式检测器和解码器实现高精度相关解码。在深度随机 Clifford 基准上，IRS 产生的逻辑故障率比在 $d=11$ 且匹配缓冲区的 Ghost 协议低大约 4\\times$，并且比逻辑可观察匹配 (LOM) 低 15\\times$。在三块 GHZ 准备中，IRS 实现了比具有匹配初始化的可靠逻辑泡利积解码低 2\\times$ 的逻辑错误率，在 $d=19$ 时通过 $\\lceil d/2\\rceil$ 完整初始化轮数提高到 $25\\times$。我们将基于 Wan 等人的方案构建的 IRS 置于更广泛的传播辅助本地 (PAL) 框架内，其中本地解码器交换消息而不是解码全局超图。 IRS 将内存等效检测器误差模型 (DEM) 上的局部最小权重完美匹配 (MWPM) 与跨横向 CNOT 层的泡利帧传播和检测器更新交替使用，寻求与全局检测器记录一致的局部误差估计。\n\n先验 DEM 考虑了内存等效模型中丢失的传播错误的概率，从而改进了初始解码并降低了逻辑错误率。零重量物理泡利机制能够推断和传播最初不确定的稳定器结果。即使对于深度的、对抗性的交替 tCNOT 电路，错误率在几次迭代后也会饱和，从而允许迭代上限且精度损失可以忽略不计。我们发现 $\\lfloor d/4\\rfloor$ 阶的校正子提取缓冲区足以在所研究的要求严格的情况下抑制距离相关的误差。该方法扩展到其他本地解码器和 CSS 代码；对于重复的逻辑 $S$ 门，IRS 的逻辑错误率比 LOM 低约 $4$ 到 $10\\times$，具体取决于初始化。", "authors": [{"name": "Mark Webber"}, {"name": "Simanraj Sadana"}, {"name": "Matthew A. Lane"}, {"name": "Lucy Jade Robson"}, {"name": "Anthony O'Rourke"}], "featured_authors": [{"name": "Mark Webber"}, {"name": "Simanraj Sadana"}, {"name": "Matthew A. Lane"}, {"name": "Lucy Jade Robson"}, {"name": "Anthony O'Rourke"}], "author_count": 5}, {"id": "2610.26785", "category": "quant-ph", "title": "Correlated decoding loses the surface code's effective distance below threshold", "abstract": "Correlated decoding improves matching and clustering surface-code decoders by reweighting one decoding subgraph conditioned on the other's correction. We show that standard reweighting can cause correlated decoders to fail on size-$(d-1)/2$ fault configurations that a distance-$d$ code should correct, reducing error suppression deep below threshold. Under circuit-level noise, a single first-pass edge can discount several correlated edges, even though their joint occurrence requires additional independent faults, so the decoder favors an over-discounted correction. Regularizing the reweighting rule restores the nominal distance scaling and a clear correlated-decoding advantage.", "url": "https://arxiv.org/abs/2610.26785", "type": "理论", "summary": "相关解码通过根据另一个解码子图的校正重新加权一个解码子图来改进匹配和聚类表面代码解码器。我们表明，标准重新加权可能会导致相关解码器在距离 $d$ 代码应该纠正的大小 $(d-1)/2$ 错误配置上失败，从而减少深度低于阈值的错误抑制。在电路级噪声下，单个首轮边缘可以折扣多个相关边缘，即使它们的联合出现需要额外的独立故障，因此解码器倾向于过度折扣校正。调整重新加权规则可以恢复标称距离缩放和明显的相关解码优势。", "authors": [{"name": "César Hernando de la Fuente"}, {"name": "Joonas Majaniemi"}, {"name": "Evert van Nieuwenburg"}, {"name": "Felix Frohnert"}], "featured_authors": [{"name": "César Hernando de la Fuente"}, {"name": "Joonas Majaniemi"}, {"name": "Evert van Nieuwenburg"}, {"name": "Felix Frohnert"}], "author_count": 4}, {"id": "2610.26786", "category": "quant-ph", "title": "Fast Hubbard-Thouless Pumping with Local Counterdiabatic Driving", "abstract": "Counterdiabatic (CD) driving suppresses the excitations of fast protocols by adding an auxiliary Hamiltonian, but in many-body and topological systems the exact CD term is generally non-local and multi-body. We study this obstruction for Thouless pumping in the Rice-Mele model, first without and then with interactions. For noninteracting fermions, the exact CD term of the pump is non-local, but the variational framework of Sels and Polkovnikov yields accurate nearest-neighbor approximations. For the spinful Rice-Mele chain with onsite and nearest-neighbor repulsion, in the regime where the competition of the two interactions stabilizes quantized pumping, this approach fails: the infinite-temperature variational action only penalizes the CD amplitudes, and the resulting two-parameter nearest-neighbor term does not prevent the pump from breaking down when the cycle time is reduced from $50/t$ to $2/t$. We trace the failure to the structure of the exact many-body gauge potential, whose amplitude for each hop depends on the interaction energy that the hop costs. Resolving the nearest-neighbor currents by this energy, and fixing the coefficients with a ground-state-weighted action, gives a local ansatz with 14 coefficients that keeps the interacting pump quantized for cycle times $T=2/t$ and $T=1/t$, with an accuracy per site that does not degrade between rings of 8 and 12 sites.", "url": "https://arxiv.org/abs/2610.26786", "type": "理论+数值", "summary": "反非绝热 (CD) 驱动通过添加辅助哈密顿量来抑制快速协议的激励，但在多体和拓扑系统中，确切的 CD 项通常是非局部的和多体的。我们研究了 Rice-Mele 模型中 Thouless 泵浦的这种阻碍，首先是没有相互作用，然后是有相互作用。对于非相互作用费米子，泵浦的精确 CD 项是非局部的，但 Sels 和 Polkovnikov 的变分框架产生准确的最近邻近似。对于具有就地排斥和最近邻排斥的旋转 Rice-Mele 链，在两种相互作用的竞争稳定量子化泵浦的情况下，这种方法失败了：无限温度变分作用只会惩罚 CD 振幅，并且当循环时间从 $50/t$ 减少到 $2/t$ 时，所得的两参数最近邻项不会阻止泵发生故障。我们将故障追溯到精确的多体规范势的结构，其每次跳跃的幅度取决于跳跃所消耗的相互作用能量。\n\n通过该能量解析最近邻电流，并通过基态加权作用固定系数，给出具有 14 个系数的局部 ansatz，使相互作用的泵在循环时间 $T=2/t$ 和 $T=1/t$ 内保持量化，每个站点的精度在 8 到 12 个站点的环之间不会降低。", "authors": [{"name": "Alexander Chansky"}], "featured_authors": [{"name": "Alexander Chansky"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
