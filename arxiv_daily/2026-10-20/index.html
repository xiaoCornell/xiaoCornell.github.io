grams. Continuum-level theories faithful to this phenomenology are largely lacking since coarse-graining models of explicit rods is notoriously difficult. Here we study collections of particles in which the rods geometry is taken into account effectively, by implementing the nematic alignment of their velocities and two types of repulsion. These Vicsek-style models are simple enough to be starting points for systematic coarse-graining. We thus derive hydrodynamic equations that we show to have solutions qualitatively faithful to their particle-level origin.", "url": "https://arxiv.org/abs/2610.26593", "type": "理论+数值", "summary": "碰撞自驱动棒的模型是许多真实系统的抽象，例如滑动细菌和由分子马达取代的生物丝。它们主要在两个空间维度上进行研究，并显示出丰富的不同集体状态，以及随后的相图中涉及的许多参数。由于显式杆的粗粒度模型非常困难，因此很大程度上缺乏忠实于这种现象学的连续体水平理论。在这里，我们研究粒子集合，通过实现粒子速度的向列排列和两种类型的斥力，有效地考虑了棒的几何形状。这些 Vicsek 风格的模型足够简单，可以作为系统粗粒度的起点。因此，我们推导出了流体动力学方程，并证明该方程的解在质量上忠实于其粒子级起源。", "authors": [{"name": "Elia Bronzo"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Alexandre Solon"}], "featured_authors": [{"name": "Elia Bronzo"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Alexandre Solon"}], "author_count": 4}, {"id": "2610.26617", "category": "cond-mat", "title": "Statistical decision theory in thermodynamics", "abstract": "We introduce statistical decision theory in stochastic thermodynamic systems. Statistical decision theory integrates several statistical tasks, such as estimation, hypothesis testing, and classification. In this study, we consider statistical decision theory in stochastic thermodynamics, which unifies sensing, classification, and uncertainty relations. In particular, we focus on the minimax risk, the smallest achievable expected loss under the worst-case parameter choice, even with an optimal estimator. We derive lower bounds on the minimax risk using Le Cam's two-point method. The derived relationships can be used across a broader range of thermodynamic scenarios. To illustrate these relations, we study classification and distribution estimation problems in a Markov process. We demonstrate that the minimax risk provides lower bounds given by the dynamical activity in these problems. Furthermore, by examining particular dynamics, we establish that the resulting bounds simplify to uncertainty relations involving dynamical activity or entropy production.", "url": "https://arxiv.org/abs/2610.26617", "type": "理论", "summary": "我们在随机热力学系统中引入统计决策理论。统计决策理论集成了多种统计任务，例如估计、假设检验和分类。在这项研究中，我们考虑随机热力学中的统计决策理论，它统一了传感、分类和不确定性关系。特别是，我们关注最小最大风险，即在最坏情况参数选择下可实现的最小预期损失，即使使用最优估计器也是如此。我们使用勒卡姆的两点法得出极小极大风险的下界。导出的关系可以用于更广泛的热力学场景。为了说明这些关系，我们研究马尔可夫过程中的分类和分布估计问题。我们证明，极小极大风险提供了这些问题中动态活动给出的下限。此外，通过检查特定的动力学，我们确定所得到的边界简化为涉及动力学活动或熵产生的不确定性关系。", "authors": [{"name": "Yoshihiko Hasegawa"}], "featured_authors": [{"name": "Yoshihiko Hasegawa"}], "author_count": 1}, {"id": "2610.26638", "category": "cond-mat", "title": "Nucleation-type criticality with infinite number of free-energy minima beyond mean-field theory", "abstract": "We study the phase diagram of a three-dimensional Heisenberg model with Dzyaloshinski--Moriya interaction under the presence of Potts-like anisotropy. The phase transition between the winding phase and the ferromagnetically ordered phase exhibits a critical phase transition with anomalous features such as critical exponents consistent with that of a first-order transition while maintaining continuity of physical quantities. Furthermore, at the critical point, we see a growing number of free energy local minima, supporting the picture of infinitely many discontinuous transitions forming criticality. Our numerical result unify de Gennes' theory of nucleation-type transitions and Dzyaloshinskii's calculation of chiral magnets by demonstrating that such anomalous criticality can be realized in microscopic models beyond mean-field.", "url": "https://arxiv.org/abs/2610.26638", "type": "理论+数值", "summary": "我们研究了类 Potts 各向异性存在下具有 Dzyaloshinski-Moriya 相互作用的三维海森堡模型的相图。绕组相和铁磁有序相之间的相变表现出具有异常特征的临界相变，例如与一阶相变一致的临界指数，同时保持物理量的连续性。此外，在临界点，我们看到越来越多的自由能局部最小值，支持无限多个不连续转变形成临界点的图景。我们的数值结果通过证明这种反常临界性可以在平均场之外的微观模型中实现，统一了 de Gennes 的成核型跃迁理论和 Dzyaloshinskii 的手性磁体计算。", "authors": [{"name": "Jun Takahashi"}, {"name": "Yoshihiko Nishikawa"}], "featured_authors": [{"name": "Jun Takahashi"}, {"name": "Yoshihiko Nishikawa"}], "author_count": 2}, {"id": "2610.26646", "category": "cond-mat", "title": "Variational Block Correlated Coupled Cluster Monte Carlo", "abstract": "Motivated by the recent success of quantum neural states, we present a variational implementation of the coupled cluster method suitable for quantum Monte Carlo simulations. We introduce a Young tableaux representation of the wave-function coefficients and their derivatives that substantially reduces the computational complexity of the variational optimization. While the algorithm is generic, we illustrate its implementation with an application to the Heisenberg model in one and two dimensions, using the block correlated coupled cluster ansatz (BCCC) with doubles and triples. Convergence is greatly improved by means of importance sampling based on a fictitious temperature. The resulting approach achieves competitive accuracy while providing a scalable framework for variational coupled-cluster calculations.", "url": "https://arxiv.org/abs/2610.26646", "type": "理论+数值", "summary": "受量子神经态最近成功的启发，我们提出了一种适用于量子蒙特卡罗模拟的耦合聚类方法的变分实现。我们引入了波函数系数及其导数的杨氏表格表示，它大大降低了变分优化的计算复杂性。虽然该算法是通用的，但我们通过一维和二维海森堡模型的应用来说明其实现，使用具有双精度和三精度的块相关耦合簇 ansatz (BCCC)。通过基于虚拟温度的重要性采样，收敛性大大提高。由此产生的方法实现了具有竞争力的准确性，同时为变分耦合簇计算提供了可扩展的框架。", "authors": [{"name": "Hunter Brodie"}, {"name": "Alexander Shilcusky"}, {"name": "Adrian E. Feiguin"}], "featured_authors": [{"name": "Hunter Brodie"}, {"name": "Alexander Shilcusky"}, {"name": "Adrian E. Feiguin"}], "author_count": 3}, {"id": "2610.26667", "category": "cond-mat", "title": "Vacancy and Helium-Cluster Thermomigration in Tungsten", "abstract": "Strong thermal gradients in tungsten plasma-facing components can bias the migration of irradiation-induced defects and thereby alter their redistribution, interaction, and retention. Here, we extend an atomistic jump-statistics framework previously developed for hydrogen to quantify the thermomigration of a single vacancy and interstitial He$_1$--He$_4$ clusters in body-centered-cubic tungsten. Non-equilibrium molecular-dynamics simulations performed over several thermal gradients are used to determine the directional jump ratio, while geometrically derived projected jump lengths convert the fitted directional-bias coefficient into the heat-of-transport coefficient $Q^*=\\alpha kT^2$, where $k$ is the Boltzmann constant, $T$ the temperature, and $\\alpha$ a constant. All investigated defects exhibit negative values of $\\alpha$, corresponding to net migration toward the hot region. He$_4$ has the largest response, $\\alpha=-2.2457\\times10^{-2}$ K$^{-1}$, followed closely by the vacancy, whereas He$_3$ exhibits the weakest response despite its intermediate cluster size. Independent constant-temperature simulations over 1000--1600 K show that He$_3$ is also the least mobile cluster and has the largest effective migration energy, $E_m^{\\mathrm{eff}}=0.271$ eV. In contrast, He$_4$ is more mobile than He$_3$ and has the smallest effective migration energy, 0.087 eV. Agreement between the He$_3$ concentration profile predicted from the jump statistics and that obtained from a long molecular-dynamics trajectory provides an independent validation of the method. These results show that thermomigration cannot be inferred from cluster size, diffusivity, or migration energy alone and provide defect-specific heat-of-transport parameters for higher-length-scale models of tungsten under fusion-relevant thermal gradients.", "url": "https://arxiv.org/abs/2610.26667", "type": "理论+数值", "summary": "面向钨等离子体的组件中的强热梯度可能会偏置辐照引起的缺陷的迁移，从而改变它们的重新分布、相互作用和保留。在这里，我们扩展了先前为氢开发的原子跳跃统计框架，以量化体心立方钨中单个空位和间隙 He$_1$-He$_4$ 簇的热迁移。在几个热梯度上进行的非平衡分子动力学模拟用于确定方向跳跃比，而几何推导的投影跳跃长度将拟合的方向偏差系数转换为传输热系数 $Q^*=\\alpha kT^2$，其中 $k$ 是玻尔兹曼常数，$T$ 是温度，$\\alpha$ 是常数。所有研究的缺陷都表现出负值 $\\alpha$，对应于向热区域的净迁移。 He$_4$ 的响应最大，$\\alpha=-2.2457\\times10^{-2}$ K$^{-1}$，紧随其后的是空位，而 He$_3$ 尽管其簇大小处于中等水平，但表现出最弱的响应。\n\n1000--1600 K 范围内的独立恒温模拟表明，He$_3$ 也是移动性最小的团簇，并且具有最大的有效迁移能，$E_m^{\\mathrm{eff}}=0.271$ eV。相比之下，He$_4$ 比 He$_3$ 更具移动性，并且具有最小的有效迁移能量，0.087 eV。从跳跃统计预测的 He$_3$ 浓度分布与从长分子动力学轨迹获得的浓度分布之间的一致性提供了该方法的独立验证。这些结果表明，热迁移不能单独从团簇尺寸、扩散率或迁移能量推断出来，并为聚变相关热梯度下的更高长度尺度的钨模型提供特定于缺陷的传输热参数。", "authors": [{"name": "Sanad Alturk"}, {"name": "Enrique Martinez"}], "featured_authors": [{"name": "Sanad Alturk"}, {"name": "Enrique Martinez"}], "author_count": 2}, {"id": "2610.26721", "category": "cond-mat", "title": "Collective diffusion of anisotropic hard-particle mixtures", "abstract": "Predicting the dynamics of anisotropic mixtures of different species is a challenging theoretical task. We show that Dynamical Density Functional Theory (DDFT), a theory predicting time evolution of the one-particle-density through a free energy functional, can be simplified to a diffusion equation. To quantify the dynamical relaxation behavior, we deduce corrections to the regular long-time collective diffusion coefficients from the direct correlations between the interacting particles and determine these effective diffusion coefficients analytically for a number of hard-particle systems, including mixtures of hard spheres, as well as isotropic and nematic phases of uniaxial spherocylinders and biaxial spherotriangles. Finally, we discuss how to generalize our approach to systems with positional order and suggest a possible application to predicting relaxation times of orientational order parameters.", "url": "https://arxiv.org/abs/2610.26721", "type": "理论+数值", "summary": "预测不同物种的各向异性混合物的动力学是一项具有挑战性的理论任务。我们证明了动态密度泛函理论（DDFT）是一种通过自由能泛函预测单粒子密度时间演化的理论，可以简化为扩散方程。为了量化动态弛豫行为，我们从相互作用粒子之间的直接相关性推导了对常规长期集体扩散系数的修正，并通过分析确定了许多硬粒子系统的有效扩散系数，包括硬球的混合物，以及单轴球柱和双轴球三角形的各向同性和向列相。最后，我们讨论如何将我们的方法推广到具有位置顺序的系统，并提出一种可能的应用来预测方向顺序参数的弛豫时间。", "authors": [{"name": "Anouar El Moumane"}, {"name": "G. H. Philipp Nguyen"}, {"name": "Klaus Mecke"}, {"name": "Hartmut Löwen"}, {"name": "René Wittmann"}], "featured_authors": [{"name": "Anouar El Moumane"}, {"name": "G. H. Philipp Nguyen"}, {"name": "Klaus Mecke"}, {"name": "Hartmut Löwen"}, {"name": "René Wittmann"}], "author_count": 5}, {"id": "2610.26736", "category": "cond-mat", "title": "Phase-sensitive quantum-state texture during thermalization of a Dzyaloshinskii-Moriya Heisenberg dimer", "abstract": "We investigate quantum-state texture during the thermal relaxation of an anisotropic spin-$1/2$ Heisenberg dimer subject to a longitudinal magnetic field and a Dzyaloshinskii-Moriya (DM) interaction. Starting from local transverse and longitudinal couplings to a bosonic bath, we construct a global weak-coupling Lindblad equation, identify its transition channels, and discuss the applicability and limitations of the secular approximation. The Gibbs state is obtained explicitly in the local spin basis, revealing that the DM coupling controls both the modulus and phase of the single-excitation coherence by modifying the energy splitting and rotating the chiral phase. For heating and cooling protocols, we compare rugosity, fidelity-based texture, and trace-distance texture with coherence, vector spin chirality, and purity. The relaxation dynamics separates population thermalization from the decay and precession of deliberately prepared energy-basis coherence. Their combined contribution to local coherence produces DM-dependent texture overshoots and, during cooling, damped oscillations and sign changes of the coherence quadratures. These transients differ from the evolution of coherence magnitude and purity, while trace-distance texture weights them differently from the overlap-based quantifiers. Calculations at reduced dissipation preserve the texture maxima within the secular model. The results identify a phase-sensitive diagnostic of relaxation.", "url": "https://arxiv.org/abs/2610.26736", "type": "理论+数值", "summary": "我们研究了各向异性自旋 $1/2$ 海森堡二聚体在纵向磁场和 Dzyaloshinskii-Moriya (DM) 相互作用下热弛豫过程中的量子态织构。从玻色浴的局部横向和纵向耦合出发，我们构造了全局弱耦合 Lindblad 方程，识别了其过渡通道，并讨论了长期近似的适用性和局限性。吉布斯态是在局部自旋基础上明确获得的，揭示了DM耦合通过修改能量分裂和旋转手性相位来控制单激发相干性的模量和相位。对于加热和冷却协议，我们将粗糙度、基于保真度的纹理和轨迹距离纹理与相干性、矢量自旋手性和纯度进行比较。弛豫动力学将群体热化与精心准备的能量基础相干性的衰变和进动分开。它们对局部相干性的综合贡献会产生与 DM 相关的纹理过冲，并且在冷却过程中会产生相干正交的阻尼振荡和符号变化。\n\n这些瞬态与相干幅度和纯度的演变不同，而轨迹距离纹理对它们的权重与基于重叠的量词不同。减少耗散的计算保留了长期模型内的纹理最大值。结果确定了松弛的相敏诊断。", "authors": [{"name": "Onofre Rojas"}, {"name": "Zhirayr Adamyan"}, {"name": "Fadwa Benabdallah"}, {"name": "Vadim Ohanyan"}], "featured_authors": [{"name": "Onofre Rojas"}, {"name": "Zhirayr Adamyan"}, {"name": "Fadwa Benabdallah"}, {"name": "Vadim Ohanyan"}], "author_count": 4}, {"id": "2610.26806", "category": "cond-mat", "title": "Capillary forces between two identical spherical particles", "abstract": "The properties of colloidal suspensions and granular matter change drastically upon adding a small amount of liquid capable of forming capillary bridges between the solid particles. The attractive forces exerted by these liquid bridges induce the formation of particle aggregates and networks, which radically changes the macroscopic mechanical and rheological behaviour. Predicting these forces across bridge sizes, particle separations and wettability is therefore central to particle-scale modelling of capillary suspensions and wet granular matter. While the Young-Laplace equation governing the properties of the liquid bridges is well known, it lacks a convenient analytical solution. Current simulations therefore employ approximate analytic expressions, typically developed for contact angles below ~40° and bridge volumes below ~2.5% of the solid particle's volume. We compare several frequently used expressions from the literature with numerical solutions of the theoretical capillary forces. An overall good agreement is observed in the aforementioned parameter ranges, while the approximate expressions start to deviate outside their intended domains. We propose accurate and computationally efficient expressions for the capillary force that model this behaviour, for contact angles from 5° to 80° and bridge volumes from $10^{-6}$ to 0.15. We also explore mesoscopic 'fluid-scale' simulations of bridges by Multi-body Dissipative Particle Dynamics (MDPD), to ascertain whether this coarse-grained fluid model faithfully captures the continuum capillary forces. Remarkably, a good agreement is observed even for liquid bridges described by a mere few dozen fluid particles. Together, these results offer two approaches, at different resolution scales, for simulating bridges over a wide range of bridge volumes and contact angles.", "url": "https://arxiv.org/abs/2610.26806", "type": "理论+数值", "summary": "添加少量能够在固体颗粒之间形成毛细管桥的液体后，胶体悬浮液和颗粒物质的性质会发生巨大变化。这些液桥施加的吸引力导致颗粒聚集体和网络的形成，这从根本上改变了宏观机械和流变行为。因此，预测这些跨桥尺寸、颗粒分离和润湿性的力对于毛细管悬浮液和湿颗粒物质的颗粒尺度建模至关重要。虽然控制液桥特性的杨-拉普拉斯方程众所周知，但它缺乏方便的解析解。因此，当前的模拟采用近似解析表达式，通常针对接触角低于约 40° 和桥体积低于固体颗粒体积的约 2.5% 开发。我们将文献中的几种常用表达式与理论毛细管力的数值解进行比较。在上述参数范围内观察到总体良好的一致性，而近似表达式开始偏离其预期范围。\n\n我们提出了精确且计算高效的毛细管力表达式来模拟这种行为，接触角从 5° 到 80°，桥体积从 $10^{-6}$ 到 0.15。我们还探索了通过多体耗散粒子动力学（MDPD）对桥梁进行介观“流体尺度”模拟，以确定这种粗粒度流体模型是否忠实地捕捉了连续毛细管力。值得注意的是，即使对于仅由几十个流体颗粒描述的液桥，也观察到了良好的一致性。总之，这些结果提供了两种不同分辨率尺度的方法，用于模拟各种桥梁体积和接触角的桥梁。", "authors": [{"name": "Stefano Onofri"}, {"name": "Thejas Hulikal Chakrapani"}, {"name": "Stefan Luding"}, {"name": "Elke Scholten"}, {"name": "Ahmed Jarray"}, {"name": "Wouter K. den Otter"}], "featured_authors": [{"name": "Stefano Onofri"}, {"name": "Thejas Hulikal Chakrapani"}, {"name": "Stefan Luding"}, {"name": "Elke Scholten"}, {"name": "Ahmed Jarray"}, {"name": "Wouter K. den Otter"}], "author_count": 6}, {"id": "2610.26858", "category": "cond-mat", "title": "Kondo Lattice model for field induced triplet pairing in CeRh$_2$As$_2$", "abstract": "Spin triplet superconductors are of interest because of their topological properties, and their robustness to high magnetic fields. CeRh$_2$As$_2$ is a unique heavy fermion superconductor with both even-parity and candidate odd-parity superconducting phases with a special feature enabling a field induced phase transition between the two. The field induced transition which switches the parity of the Cooper pairs is enabled by a staggered antisymmetric spin orbit coupling (ASOC) interaction. However, the heavy fermion origins of the superconductivity in CeRh$_2$As$_2$ and the origin of the antisymmetric spin-orbit coupling are currently unexplored. Here, we develop a Kondo lattice model for CeRh$_2$As$_2$ and demonstrate how local hybridization between Cerium $d$- and $f$-orbitals, driven by the locally broken inversion symmetry, at the Cerium sites generates the ASOC. The resulting Kondo lattice model leads to nearly degenerate even and odd parity superconducting states that display a field induced parity transition between an even-parity state and an odd-parity pseudospin triplet state. We discuss the wider implications of our results extended to other heavy fermion systems like CeSiI.", "url": "https://arxiv.org/abs/2610.26858", "type": "理论", "summary": "自旋三重态超导体因其拓扑特性及其对高磁场的鲁棒性而备受关注。 CeRh$_2$As$_2$ 是一种独特的重费米子超导体，具有偶宇称超导相和候选奇宇称超导相，并具有能够在两者之间实现场诱导相变的特殊功能。切换库珀对奇偶性的场诱导跃迁是通过交错反对称自旋轨道耦合（ASOC）相互作用实现的。然而，CeRh$_2$As$_2$ 中超导性的重费米子起源和反对称自旋轨道耦合的起源目前尚未探索。在这里，我们为 CeRh$_2$As$_2$ 开发了一个 Kondo 晶格模型，并演示了 CeRh$_2$As$_2$ 处的 CeRh$d$- 和 $f$-轨道之间的局部杂化如何在 CeRah 位点处由局部破缺的反演对称性驱动来生成 ASOC。由此产生的近藤晶格模型导致近简并的偶宇称超导态和奇宇称超导态，显示偶宇称态和奇宇称赝自旋三重态之间的场诱导宇称跃迁。\n\n我们讨论了我们的结果扩展到其他重费米子系统（如 CeSiI）的更广泛的影响。", "authors": [{"name": "Indra Gankhuyag"}, {"name": "Piers Coleman"}], "featured_authors": [{"name": "Indra Gankhuyag"}, {"name": "Piers Coleman"}], "author_count": 2}, {"id": "2610.26859", "category": "cond-mat", "title": "Boundary-Sensitive Quantum Order on Non-Amenable Lattices", "abstract": "We show that quantum systems on non-amenable lattices, whose boundaries constitute an extensive fraction of the system, host novel forms of bulk ordering with no Euclidean counterpart. Combining boundary-retaining iDMRG with an exact symmetry-fixing duality, we investigate $p<5$ state clock models on the coordination-3 infinite Cayley tree. We find that between the ordered and disordered phases lies an emergent intermediate phase with bulk order induced by an arbitrarily weak boundary field rather than by conventional spontaneous symmetry-breaking. This establishes boundary-sensitive order as a distinct quantum ordering mechanism defying Landau's spontaneous symmetry-breaking paradigm. The intermediate phase realizes a bulk-boundary correspondence in which the unpolarized boundary selects a specific ordered bulk state.", "url": "https://arxiv.org/abs/2610.26859", "type": "理论", "summary": "我们证明，不顺从的晶格上的量子系统（其边界构成了系统的很大一部分）具有新颖的体有序形式，没有欧几里得对应物。将边界保留 iDMRG 与精确的对称固定对偶性相结合，我们研究了协调 3 无限凯莱树上的 $p<5$ 状态时钟模型。我们发现，在有序相和无序相之间存在一个新兴的中间相，其体序是由任意弱边界场引起的，而不是由传统的自发对称性破缺引起的。这将边界敏感有序建立为一种独特的量子有序机制，违背了朗道的自发对称破缺范式。中间相实现体边界对应，其中非极化边界选择特定的有序体状态。", "authors": [{"name": "Xingzhi Wang"}, {"name": "Zohar Nussinov"}, {"name": "Gerardo Ortiz"}], "featured_authors": [{"name": "Xingzhi Wang"}, {"name": "Zohar Nussinov"}, {"name": "Gerardo Ortiz"}], "author_count": 3}, {"id": "2610.26862", "category": "cond-mat", "title": "On Higher-Form Fracton Hydrodynamics with Momentum Conservation", "abstract": "Momentum conservation is common in fluids, yet it may be incompatible with the hydrodynamics of theories with exotic conservation laws (such as fracton hydrodynamics) unless symmetries are spontaneously broken. Using the Martin-Siggia-Rose (MSR) effective field theory formalism, we develop a representation-theoretic framework for the hydrodynamics of translationally invariant systems with exotic conservation laws without spontaneous symmetry breaking. Under mild assumptions on the form of hydrodynamics, we show that such theories must satisfy two representation theoretic consistency conditions and a generalized Gauss's law constraint. Higher-form symmetries satisfy these conditions and we derive their ideal hydrodynamics; in three dimensions, the one-form case produces ideal non-relativistic magnetohydrodynamics. Finally, we prove that no other theories are compatible with momentum conservation in SO(3) nor SO($d$), for sufficiently large odd $d$.", "url": "https://arxiv.org/abs/2610.26862", "type": "理论", "summary": "动量守恒在流体中很常见，但它可能与具有奇异守恒定律的理论的流体动力学（例如分形流体动力学）不相容，除非对称性自发破缺。使用 Martin-Siggia-Rose (MSR) 有效场论形式，我们开发了一个表示理论框架，用于具有奇异守恒定律且不会自发对称破缺的平移不变系统的流体动力学。在对流体动力学形式的温和假设下，我们表明此类理论必须满足两个表示理论一致性条件和广义高斯定律约束。更高形式的对称性满足这些条件，我们推导出它们的理想流体动力学；在三个维度中，单一形式的情况产生理想的非相对论磁流体动力学。最后，我们证明，对于足够大的奇 $d$，没有其他理论与 SO(3) 或 SO($d$) 中的动量守恒兼容。", "authors": [{"name": "Ben Bobell"}, {"name": "Rahul Nandkishore"}, {"name": "Andrew Lucas"}], "featured_authors": [{"name": "Ben Bobell"}, {"name": "Rahul Nandkishore"}, {"name": "Andrew Lucas"}], "author_count": 3}, {"id": "2610.24062", "category": "hep-th", "title": "Light EFT Strings and Asymptotic Accelerated Expansion", "abstract": "We study the interplay among towers of particles, EFT strings, and EFT membranes near perturbative infinite-distance limits of four-dimensional $\\mathcal{N}=1$ theories. We show that the scaling vectors of EFT membranes lie in the lattice generated by those of the EFT strings, as previously found for particle towers, and determine their specific relative scaling in F-theory and Type IIA Calabi-Yau compactifications. We then leverage these objects to assess the viability of asymptotic accelerated expansion in flux compactifications. While our bottom-up analysis does not yield a general obstruction, we rule out two candidate accelerating trajectories in F-theory because an EFT string becomes lighter than the Hubble scale, invalidating the four-dimensional EFT. This closes the loophole found in arXiv:2209.11821 . We also study how recent results on quantum obstructions to $\\mathcal{N}=1$ infinite-distance limits may provide a concrete resolution by changing the asymptotic form of the Kähler potential.", "url": "https://arxiv.org/abs/2610.24062", "type": "理论", "summary": "我们研究了四维 $\\mathcal{N}=1$ 理论的微扰无限距离极限附近的粒子塔、EFT 弦和 EFT 膜之间的相互作用。我们证明，EFT 膜的标度向量位于由 EFT 弦生成的晶格中，正如之前在粒子塔中发现的那样，并确定了它们在 F 理论和 IIA 型 Calabi-Yau 紧致化中的特定相对标度。然后，我们利用这些对象来评估通量紧化中渐近加速膨胀的可行性。虽然我们的自下而上的分析不会产生一般性的障碍，但我们排除了 F 理论中的两个候选加速轨迹，因为 EFT 弦变得比哈勃尺度更轻，从而使四维 EFT 无效。这弥补了 arXiv:2209.11821 中发现的漏洞。我们还研究了最近对 $\\mathcal{N}=1$ 无限距离限制的量子阻碍的结果如何通过改变凯勒势的渐近形式提供具体的解决方案。", "authors": [{"name": "Veronica Collazuol"}, {"name": "Alessandra Grieco"}, {"name": "Irene Valenzuela"}], "featured_authors": [{"name": "Veronica Collazuol"}, {"name": "Alessandra Grieco"}, {"name": "Irene Valenzuela"}], "author_count": 3}, {"id": "2610.24072", "category": "hep-th", "title": "Angular Momentum Loss at Fourth Post-Minkowskian Order", "abstract": "We calculate the total loss of angular momentum for a gravitational scattering of two non-spinning point-like objects at $\\mathcal{O}(G^4)$. Our methodology combines use of both amplitudes and worldline-based methods. We derive the integrand from two copies of the gravitational waveform with cuts on massive lines arising naturally from the worldline. We then glue these two copies and evaluate the resulting phase-space integrals using reverse unitarity, in the amplitudes spirit. We obtain separately the radiated angular momentum and the static contribution that, at this order, is entirely determined by the initial shear and the linear memory. Combining these two terms, we derive relativistic expressions for the angular momentum loss and for the infrared-finite component of the mass dipole loss, which in the low-velocity limit match results available in the literature. We also use this result to derive the conservative deflection angle at $\\mathcal{O}(G^5)$ and first self-force order.", "url": "https://arxiv.org/abs/2610.24072", "type": "理论", "summary": "我们计算两个非旋转点状物体在$\\mathcal{O}(G^4)$处的引力散射的总角动量损失。我们的方法结合了幅度和基于世界线的方法的使用。我们从引力波形的两个副本中导出被积函数，并在从世界线自然产生的大量线上进行切割。然后，我们将这两个副本粘合在一起，并按照振幅的精神，使用反幺正性来评估所得的相空间积分。我们分别获得辐射角动量和静态贡献，按此顺序，它们完全由初始剪切和线性记忆决定。结合这两项，我们推导出角动量损失和质量偶极子损失的红外有限分量的相对论表达式，这在低速极限下与文献中提供的结果相匹配。我们还使用这个结果来推导 $\\mathcal{O}(G^5)$ 处的保守偏转角和第一自力阶。", "authors": [{"name": "Alessandro Georgoudis"}, {"name": "Carlo Heissenberg"}, {"name": "Gustav Mogull"}, {"name": "Rodolfo Russo"}], "featured_authors": [{"name": "Alessandro Georgoudis"}, {"name": "Carlo Heissenberg"}, {"name": "Gustav Mogull"}, {"name": "Rodolfo Russo"}], "author_count": 4}, {"id": "2610.24073", "category": "hep-th", "title": "On the Positivity of de Sitter Group Averaging", "abstract": "Perturbative quantum gravity about a global de Sitter (dS$_d$) background involves constraints that restrict the state of the linearized theory but which appear only at higher orders in perturbation theory. In particular, for familiar gravitational theories with $d>2$ these constraints require all charges defined by continuous de Sitter isometries to vanish in the linearized state. While standard Fock spaces have the property that the only normalizable state satisfying these constraints is the vacuum, Higuchi suggested that this lack of allowed states should be remedied by instead using the so-called group-averaging inner product. This inner product satisfies important uniqueness conditions, but its positivity has to date remained an open question. For $d > 2$, we establish this positivity here for all such states with $N$ particles (including particles of arbitrary spin) in standard global dS${}_d$ modes where the particle-weights $\\Delta_i$ satisfy the condition ${\\rm Re} \\, \\sum_{i=1}^N \\Delta_i > d-1$, which is the criterion for group averaging to converge absolutely for arbitrary finite linear combinations of such states. We also treat the case of bosonic and fermionic (integer and half-integer spin) particles in dS$_2$ as a toy model for the more general case. However, we can identify certain classes of states for which group averaging continues to converge absolutely for smaller weights. Interestingly, in some cases these smaller-weight states turn out to have {\\it negative} group-averaging norms. We thus also discuss the implications of this observation for perturbative de Sitter quantum gravity.", "url": "https://arxiv.org/abs/2610.24073", "type": "理论", "summary": "关于全局德西特 (dS$_d$) 背景的微扰量子引力涉及限制线性化理论状态的约束，但这些约束仅出现在微扰理论中的更高阶。特别是，对于 $d>2$ 的熟悉引力理论，这些约束要求由连续德西特等距定义的所有电荷在线性化状态下消失。虽然标准福克空间具有满足这些约束的唯一可归一化状态是真空的属性，但 Higuchi 建议应该通过使用所谓的组平均内积来弥补允许状态的缺乏。该内积满足重要的唯一性条件，但其积极性迄今为止仍然是一个悬而未决的问题。对于 $d > 2$，我们在标准全局 dS${}_d$ 模式中为所有具有 $N$ 粒子（包括任意自旋的粒子）的状态建立这种正性，其中粒子权重 $\\Delta_i$ 满足条件 ${\\rm Re} \\, \\sum_{i=1}^N \\Delta_i > d-1$，这是对于此类状态的任意有限线性组合群平均绝对收敛的标准。\n\n我们还将 dS$_2$ 中的玻色子和费米子（整数和半整数自旋）粒子的情况视为更一般情况的玩具模型。然而，我们可以识别某些状态类别，对于较小的权重，组平均继续绝对收敛。有趣的是，在某些情况下，这些较小权重的状态的群体平均范数是负的。因此，我们还讨论了这一观察结果对微扰德西特量子引力的影响。", "authors": [{"name": "Donald Marolf"}, {"name": "Xuyang Yu"}], "featured_authors": [{"name": "Donald Marolf"}, {"name": "Xuyang Yu"}], "author_count": 2}, {"id": "2610.24084", "category": "hep-th", "title": "Wrapping M5-branes on a non-spin manifold: Spin$^h$ structures and AdS$_7$ black holes", "abstract": "We construct a solution of seven-dimensional maximal gauged supergravity of the form AdS$_2\\times M_5$, where $M_5$ is the five-dimensional Wu manifold $SU(3)/SO(3)$. The solution is supersymmetric, despite the fact that the Wu manifold admits neither a spin structure nor a spin$^c$ structure. Rather, it admits a spin$^h$ structure, wherein the ill-definedness of ordinary spinors due to a minus sign in their holonomy is compensated by a further minus sign arising through the spinors carrying $SO(3)$ Yang-Mills charge, in a half-integer isospin representation of the $SU(2)$ double cover of the $SO(3)$. We show how the configuration can be lifted to a solution of $D=11$ supergravity of the form AdS$_2\\times M_9$, where $M_9$ is the unit tangent bundle of the Wu manifold. We discuss the geometry and topology of $M_9$, and study the supersymmetry from the eleven-dimensional standpoint. We extend the seven-dimensional solution to a black hole, and discuss some aspects of its holographic interpretation and the UV to IR flow. We revisit a previously-known AdS$_2\\times H^3\\times H^2$ solution, and its UV to IR flow, showing that the flow equations in fact admit of an exact solution. Additionally, we give a detailed discussion of the lift of the AdS$_2\\times S^5$ solution to $D=11$, exhibiting similarities and differences between the properties of its internal space $M_9$ (the unit tangent bundle of $S^5$) and the Wu manifold example of our main discussion. We also construct the non-compact dual of the Wu manifold solution, where $M_5$ is taken to be $SL(3,\\mathbb R)/SO(3)$.", "url": "https://arxiv.org/abs/2610.24084", "type": "理论", "summary": "我们构建了 AdS$_2\\times M_5$ 形式的七维最大规范超引力解，其中 $M_5$ 是五维 Wu 流形 $SU(3)/SO(3)$。尽管 Wu 流形既不承认自旋结构也不承认自旋 $^c$ 结构，但该解是超对称的。相反，它承认自旋$^h$结构，其中由于完整性中的负号而导致的普通旋量的不确定性被通过带有$SO(3)$杨-米尔斯电荷的旋量产生的进一步负号所补偿，以$SO(3)$的$SU(2)$双覆盖的半整数同位旋表示。我们展示了如何将配置提升为 AdS$_2\\times M_9$ 形式的 $D=11$ 超重力解，其中 $M_9$ 是 Wu 流形的单位切丛。我们讨论$M_9$的几何和拓扑，并从十一维的角度研究超对称性。我们将七维解扩展到黑洞，并讨论其全息解释和紫外到红外流的某些方面。我们重新审视之前已知的 AdS$_2\\times H^3\\times H^2$ 解及其 UV 到 IR 流，表明流方程实际上承认精确解。\n\n此外，我们还详细讨论了 AdS$_2\\times S^5$ 解对 $D=11$ 的升力，展示了其内部空间 $M_9$（$S^5$ 的单位切丛）和我们主要讨论的 Wu 流形示例的属性之间的异同。我们还构造了 Wu 流形解的非紧对偶，其中 $M_5$ 被取为 $SL(3,\\mathbb R)/SO(3)$。", "authors": [{"name": "Okan Günel"}, {"name": "Cameron Gibson"}, {"name": "C.N. Pope"}], "featured_authors": [{"name": "Okan Günel"}, {"name": "Cameron Gibson"}, {"name": "C.N. Pope"}], "author_count": 3}, {"id": "2610.24111", "category": "hep-th", "title": "Topological deformations of local gauge theories: a presymplectic BV-AKSZ approach", "abstract": "The same local degrees of freedom can be described by systems with different gauge structure and field content. Standard examples are the duality between the scalar field and the 2-form gauge field in four dimensions, and unimodular gravity, where the cosmological constant becomes a global degree of freedom. In a precise sense, the spaces of gauge-inequivalent formal solutions of such systems differ by a finite-dimensional sector. Moreover, because their gauge sectors are different, their consistent interactions and their sensitivity to the global structure of spacetime may differ substantially. We show that such systems are naturally related by what we call topological deformations: gauging a symmetry of generic degree couples the system to a BF-type sector without introducing new local degrees of freedom. The construction is carried out systematically within the presymplectic BV-AKSZ approach, where it amounts to a modification of the underlying presymplectic gauge PDE. Gauging degree-0 symmetries identifies solutions related by global symmetries, which reproduces the scalar--2-form and principal chiral model--Freedman--Townsend dualities. Gauging degree-1 symmetries, i.e. deformations, gives rise to new global degrees of freedom, such as the cosmological constant in unimodular gravity.", "url": "https://arxiv.org/abs/2610.24111", "type": "理论", "summary": "相同的局部自由度可以通过具有不同规范结构和场内容的系统来描述。标准的例子是四维标量场和二元规范场之间的对偶性，以及单模引力，其中宇宙学常数成为全局自由度。从精确意义上讲，此类系统的规范不等式解的空间因有限维扇区而异。此外，由于它们的规范扇区不同，它们的一致相互作用以及它们对时空全局结构的敏感性可能有很大不同。我们表明，此类系统通过所谓的拓扑变形自然相关：测量通用度的对称性将系统耦合到 BF 型扇区，而无需引入新的局部自由度。该构建是在辛前 BV-AKSZ 方法内系统地进行的，相当于对基础辛前规范偏微分方程的修改。测量 0 度对称性可识别与全局对称性相关的解，从而再现标量 -2 形式和主手性模型 - Freedman - Townsend 对偶性。测量 1 度对称性，即\n\n变形，产生新的全局自由度，例如单模引力的宇宙学常数。", "authors": [{"name": "Ivan Dneprov"}, {"name": "Alexey Donchenko"}, {"name": "Maxim Grigoriev"}], "featured_authors": [{"name": "Ivan Dneprov"}, {"name": "Alexey Donchenko"}, {"name": "Maxim Grigoriev"}], "author_count": 3}, {"id": "2610.24127", "category": "hep-th", "title": "Gravitational Cheshire effect from Yang-Mills instantons", "abstract": "We show that the dimensional reduction of four-dimensional Yang-Mills instantons naturally gives rise to nontrivial matter configurations in three dimensions exhibiting an unusual mechanism of gravitational screening. Starting from Euclidean Yang-Mills theory, we reduce (anti-)self-dual gauge configurations along a compact direction generated by a $U(1)$ isometry of the instanton background. Under this reduction, the gauge connection decomposes into a three-dimensional Yang-Mills field and an adjoint Higgs field, while the metric gives rise, as usual, to a dilaton and an Abelian gauge connection. For instantons on the Taub-NUT background, the reduced fields organize themselves into two mutually screening pairs: the backreaction of the Abelian sector cancels internally, and the same occurs independently in the non-Abelian sector. As a result, the full matter content supports a composite stealth configuration on flat three-dimensional space. By contrast, the dimensional reduction of instantons on the Eguchi-Hanson background yields a non-Abelian matter sector whose gravitational backreaction cancels, while the Abelian sector remains gravitationally active and therefore deforms the three-dimensional background geometry. These examples reveal a direct connection between four-dimensional (anti-)self-duality and three-dimensional BPS-type relations, and illustrate how instantonic sectors that are gravitationally invisible in four dimensions can descend into either fully composite stealth configurations or partially stealth matter configurations after dimensional reduction.", "url": "https://arxiv.org/abs/2610.24127", "type": "理论", "summary": "我们证明，四维杨-米尔斯瞬子的维数减少自然会产生三维的非平凡物质构型，表现出一种不寻常的引力屏蔽机制。从欧几里得杨-米尔斯理论出发，我们沿着由瞬子背景的 $U(1)$ 等距生成的紧凑方向减少（反）自对偶规范配置。在这种简化下，规范连接分解为三维杨-米尔斯场和伴随希格斯场，而度量则像往常一样产生膨胀和阿贝尔规范连接。对于 Taub-NUT 背景上的瞬子，约简场将自身组织成两个相互屏蔽对：阿贝尔扇区的反作用在内部抵消，并且在非阿贝尔扇区中独立发生同样的情况。因此，完整的物质内容支持平面三维空间上的复合隐形配置。\n\n相比之下，江口汉森背景上瞬时子的维数减少产生了一个非阿贝尔物质扇区，其引力反作用被抵消，而阿贝尔扇区仍然具有引力作用，因此使三维背景几何形状变形。这些例子揭示了四维（反）自对偶性和三维 BPS 型关系之间的直接联系，并说明了在四个维度中引力不可见的瞬时扇区如何在降维后下降到完全复合隐形构型或部分隐形物质构型。", "authors": [{"name": "Borja Diez"}], "featured_authors": [{"name": "Borja Diez"}], "author_count": 1}, {"id": "2610.24176", "category": "hep-th", "title": "Landscape of Higgs vacua in 5d $\\mathcal{N}=1$", "abstract": "Strongly coupled 5d $\\mathcal{N}=1$ gauge theories have a Higgs branch of their moduli space of vacua, identified by 1/2-BPS operators and their algebraic relations. For $SU(N_c)_k$ theories, we map the moduli space across different phases and we establish how the Chern-Simons level $k$ deforms the chiral ring relations among mesons, baryons, and instantons, while determining specific patterns of symmetry enhancement. For $SO(N_c)$ theories, we construct the corresponding chiral ring constraints at infinite coupling. Finally, we identify the Higgs branch as a classical integrable system, through the expansion of the chiral ring in terms of action variables.", "url": "https://arxiv.org/abs/2610.24176", "type": "理论", "summary": "强耦合 5d $\\mathcal{N}=1$ 规范理论的真空模空间有一个希格斯分支，由 1/2-BPS 算子及其代数关系确定。对于 $SU(N_c)_k$ 理论，我们映射不同相的模空间，并建立 Chern-Simons 能级 $k$ 如何使介子、重子和瞬时子之间的手性环关系变形，同时确定对称性增强的特定模式。对于 $SO(N_c)$ 理论，我们在无限耦合下构造相应的手性环约束。最后，我们通过作用变量的手性环展开，将希格斯分支识别为经典的可积系统。", "authors": [{"name": "Amihay Hanany"}, {"name": "Elias Van den Driessche"}], "featured_authors": [{"name": "Amihay Hanany"}, {"name": "Elias Van den Driessche"}], "author_count": 2}, {"id": "2610.24227", "category": "hep-th", "title": "Covariant One-Loop Corrections from a Non-Covariant Expansion: The Scalar Field Case", "abstract": "We compute the one-loop correction to the non-minimal coupling of a scalar field theory to gravity, induced by a quartic self-interaction. We adopt the non-covariant framework of linearized gravity and explicitly compute the corresponding Feynman diagram, including both the divergent and the finite parts. The corresponding contribution to the one-loop effective action is obtained by the requirement of covariance and compared with the known results obtained by the heat kernel technique. We study the running of the non-minimal coupling, its UV and IR limit and verify the validity of the decoupling theorem in the momentum subtraction scheme of renormalization. The linearized gravity approach is also used for deriving the effective potential for the scalar field and its covariant version is stated. The agreement with results derived using strictly covariant methods is verified and highlights the versatility of the linearized gravity approach.", "url": "https://arxiv.org/abs/2610.24227", "type": "理论", "summary": "我们计算由四次自相互作用引起的标量场理论与重力的非最小耦合的单环校正。我们采用线性化引力的非协变框架并显式计算相应的费曼图，包括发散部分和有限部分。通过协方差的要求得到了对单环有效作用的相应贡献，并与热核技术得到的已知结果进行了比较。我们研究了非最小耦合的运行及其紫外和红外极限，并验证了重整化动量减法方案中解耦定理的有效性。线性化重力方法也用于推导标量场的有效势，并给出了其协变版本。验证了与使用严格协变方法得出的结果的一致性，并强调了线性重力方法的多功能性。", "authors": [{"name": "Lucas Ducastelo de C. C. Lima"}, {"name": "Riccardo Fecchio"}], "featured_authors": [{"name": "Lucas Ducastelo de C. C. Lima"}, {"name": "Riccardo Fecchio"}], "author_count": 2}, {"id": "2610.24272", "category": "hep-th", "title": "Bosonization for the Schwinger effect at small fermion mass: analytic formula for the 1+1D current in an arbitrary time-dependent, inhomogeneous electric field", "abstract": "We derive an analytic formula for the expectation value of the current due to Schwinger pair-production in an arbitrary time-dependent, spatially inhomogeneous external electric field in 1+1 dimensions, as a perturbative expansion in the fermion mass $m$. We work to order $m^2$, finding contributions at order $m^0$, $m^2 \\log m$ and $m^2$; there is no contribution at $O(m)$. The calculation is enabled by a new ``hybrid method'' using bosonization, where part of the calculation is performed on the fermion side and part is performed on the boson side. The fermion side allows us to define the vacuum using the free theory in the infinite past, while the boson side allows us to compute the current without regularization, since the current operator is linear in the boson field. In the special case of a spatially homogeneous background field, we also perform the calculation purely on the fermion side using adiabatic regularization. The detailed agreement of the results provides a highly non-trivial check of the duality.", "url": "https://arxiv.org/abs/2610.24272", "type": "理论", "summary": "我们推导出一个解析公式，用于计算在 1+1 维任意时间相关、空间不均匀的外部电场中由于施温格对产生而产生的电流期望值，作为费米子质量 $m$ 的微扰膨胀。我们努力订购 $m^2$，按订单 $m^0$、$m^2 \\log m$ 和 $m^2$ 查找贡献； $O(m)$ 没有贡献。该计算是通过使用玻色子化的新“混合方法”实现的，其中部分计算在费米子侧执行，部分计算在玻色子侧执行。费米子方面允许我们使用无限过去的自由理论来定义真空，而玻色子方面允许我们在不进行正则化的情况下计算电流，因为电流算子在玻色子场中是线性的。在空间均匀背景场的特殊情况下，我们还使用绝热正则化纯粹在费米子侧执行计算。结果的详细一致性提供了对二元性的高度重要的检查。", "authors": [{"name": "Samuel E. Gralla"}, {"name": "Morifumi Mizuno"}], "featured_authors": [{"name": "Samuel E. Gralla"}, {"name": "Morifumi Mizuno"}], "author_count": 2}, {"id": "2610.24496", "category": "hep-th", "title": "Gravity as Large Scale Structure: Families of CFTs and the Higher-Spin Gap", "abstract": "We observe an apparently universal behavior in large $N$ conformal field theory (CFT) in $d\\geq 2$ dimensions: the single-trace, higher-spin gap obeys the parametric bound $\\Delta_{\\rm gap} \\lesssim (\\delta c)^{1/d}$, where $\\delta c$ is the central charge increment between successive theories. The origin of this bound is explained heuristically, using a generalized notion of branes that interpolate between conformal points in theory space. Seeking a more precise framework for this picture leads to the central concept of families of CFTs, which tacitly underlies various features and puzzles of AdS/CFT. We develop a working definition of families, with inspiration from families of $L$-functions in number theory, and formulate a family-level version of the gap bound. Interpreted holographically for families of AdS$_{d+1}$ vacua, this bound, when applicable, rules out Planckian scale separation, constrains the size and number of extra dimensions, and explains simple scaling patterns in string/M-theory. It also accounts for why all known large $N$ vector models have a bounded gap.", "url": "https://arxiv.org/abs/2610.24496", "type": "理论", "summary": "我们在 $d\\geq 2$ 维度中观察到大 $N$ 共形场论 (CFT) 中明显普遍的行为：单迹、高自旋能隙服从参数界限 $\\Delta_{\\rm gap} \\lesssim (\\delta c)^{1/d}$，其中 $\\delta c$ 是连续理论之间的中心电荷增量。使用在理论空间中的共形点之间插值的膜的广义概念，启发式地解释了该界限的起源。为这幅图景寻找更精确的框架引出了 CFT 系列的中心概念，它默认地是 AdS/CFT 的各种特征和难题的基础。受到数论中$L$函数族的启发，我们制定了族的工作定义，并制定了族级版本的间隙界限。对于 AdS$_{d+1}$ vacua 系列进行全息解释，此界限在适用时排除了普朗克尺度分离，限制了额外维度的大小和数量，并解释了弦/M 理论中的简单缩放模式。它还解释了为什么所有已知的大型 $N$ 向量模型都有一个有限的间隙。", "authors": [{"name": "Eric Perlmutter"}], "featured_authors": [{"name": "Eric Perlmutter"}], "author_count": 1}, {"id": "2610.24594", "category": "hep-th", "title": "Strong generation of the chiral algebra of $\\mathcal N=4$~$SU(N)$ super Yang--Mills theory", "abstract": "The Schur sector of four-dimensional $\\mathcal N=4$ super Yang--Mills theory contains infinitely many protected operators, while the invariant polynomials of a single adjoint scalar are organized by finitely many Casimir degrees. I prove that the small $\\mathcal N=4$ short multiplets built from these invariants strongly generate the associated chiral algebra, thereby establishing the $SU(N)$ case of the strong-generation conjecture of Beem et al. For every $N\\ge2$, all field components associated with degrees $2,\\ldots,N$ suffice, in every conformal weight and every degree of the standard relative quantum BRST cohomology. The proof brings together cyclic trace cohomology, quantum lifting, and an arbitrary-degree quartic--odd transport identity. Exact field relations and a finite-rank Newton obstruction exclude every additional lowest space, including non-scalar flavor representations; the required normal-ordering corrections and BRST primitives are derived explicitly. The resulting completeness theorem explains how a finite family of supersymmetric multiplets organizes an unbounded quantum spectrum. Every Schur class is a normal polynomial in their components and derivatives, even when its gauge-theory representative involves fermions and arbitrarily many derivatives. This supplies a uniform set of local inputs for meromorphic operator products, bounds protected state multiplicities before cancellations in an index, and gives an algebraic account of the finite-rank reorganization of protected trace operators.", "url": "https://arxiv.org/abs/2610.24594", "type": "理论", "summary": "四维 $\\mathcal N=4$ super Yang--Mills 理论的 Schur 扇区包含无限多个受保护算子，而单个伴随标量的不变多项式则由有限多个卡西米尔度组织。我证明了由这些不变量构建的小 $\\mathcal N=4$ 短多重态强烈地生成相关的手性代数，从而建立了 Beem 等人的强生成猜想的 $SU(N)$ 情况。对于每个 $N\\ge2$，在标准相对量子 BRST 上同调的每个共形权重和每个度数中，与度数 $2,\\ldots,N$ 相关的所有场分量就足够了。该证明汇集了循环迹上同调、量子提升和任意阶四次（奇传输恒等式）。精确的场关系和有限秩牛顿障碍排除了每一个额外的最低空间，包括非标量风味表示；所需的正常排序校正和 BRST 原语是明确导出的。由此产生的完整性定理解释了超对称多重态的有限族如何组织无界量子谱。\n\n每个 Schur 类的分量和导数都是正规多项式，即使其规范理论代表涉及费米子和任意多个导数。这为亚态算子乘积提供了一组统一的本地输入，在索引中取消之前限制了受保护状态的多重性，并给出了受保护跟踪算子的有限秩重组的代数说明。", "authors": [{"name": "Yifan He"}], "featured_authors": [{"name": "Yifan He"}], "author_count": 1}, {"id": "2610.24698", "category": "hep-th", "title": "Holomorphic extremal surfaces for pseudoentropy in dS/CFT", "abstract": "We formulate the extremization problem for codimension-two hypersurfaces in de Sitter space in holomorphic coordinates, with real anchoring conditions at future infinity. The resulting equation ($K^I=0$) describes complex bulk realizations extending the usual piecewise Hartle--Hawking construction. We compute holographic pseudoentropy for harmonic deformations of spherical regions of arbitrary size and dimension, confirming its universal expansion through second order in the deformation parameter. The result is independent of the integration contour within each homology class on the complexified extremal surface. Inequivalent classes, labeled by an integer associated with a discrete global-coordinate isometry, differ by a sign of the universal term in odd boundary dimensions and by real finite shifts in even dimensions. For conical defects in dS$_3$ parametrized by a Schwarzschild-dS mass, we also verify the first law of pseudoentropy and the persistence of contour degeneracy within each homology class.", "url": "https://arxiv.org/abs/2610.24698", "type": "理论", "summary": "我们在全纯坐标下制定了德西特空间中余维二超曲面的极值化问题，并在未来无穷大处具有真实的锚定条件。由此产生的方程 ($K^I=0$) 描述了扩展通常的分段哈特尔-霍金构造的复杂体实现。我们计算任意大小和维度的球形区域的谐波变形的全息赝熵，通过变形参数的二阶确认其普遍展开。结果与复数极值表面上每个同源类内的积分轮廓无关。不等价类由与离散全局坐标等距关联的整数标记，其不同之处在于奇数边界维度中的通用项的符号和偶数维度中的实数有限平移。对于由 Schwarzschild-dS 质量参数化的 dS$_3$ 中的圆锥形缺陷，我们还验证了伪熵第一定律以及每个同源类内轮廓简并性的持续性。", "authors": [{"name": "Giorgos Anastasiou"}, {"name": "Ignacio J. Araya"}, {"name": "Avijit Das"}, {"name": "Javier Moreno"}], "featured_authors": [{"name": "Giorgos Anastasiou"}, {"name": "Ignacio J. Araya"}, {"name": "Avijit Das"}, {"name": "Javier Moreno"}], "author_count": 4}, {"id": "2610.24754", "category": "hep-th", "title": "Bootstrapping Fermionic Veneziano Amplitudes from Regge Zeros", "abstract": "We extend the Regge-zero bootstrap of the Veneziano amplitude to tree-level scattering with external fermions. We consider the colour-ordered four-point amplitude of a massless scalar and a massless spin-$\\frac12$ fermion, in which fermionic resonances appear in the $s$-channel and bosonic resonances in the $t$-channel. Factoring out a spinor structure that carries the little-group weight of the amplitude, we bootstrap the resulting reduced amplitude, whose residues in each channel vanish at Regge zeros controlled by the trajectory of the opposite channel. Assuming ultrasoft Regge behaviour and that the residues have no zeros other than Regge zeros, we show that both Regge trajectories are linear and that the maximal spins grow with the level as $J_F=n+\\frac12$ and $J_B=m+1$. Duality between the fermionic- and bosonic-pole expansions then fixes the reduced amplitude to a Beta function, up to its normalisation and the ratio of the two Regge slopes. Requiring the fermionic and bosonic spectra to be degenerate equates the slopes, and the resulting amplitude coincides with the open superstring amplitude.", "url": "https://arxiv.org/abs/2610.24754", "type": "理论", "summary": "我们将 Veneziano 振幅的 Regge-zero bootstrap 扩展到具有外部费米子的树级散射。我们考虑无质量标量和无质量自旋$\\frac12$费米子的按颜色排序的四点振幅，其中费米子共振出现在$s$通道中，玻色子共振出现在$t$通道中。分解出带有振幅小群权重的旋量结构，我们自举所得到的减小的振幅，其在每个通道中的残差在由相反通道的轨迹控制的Regge零点处消失。假设超软 Regge 行为，并且除了 Regge 零点之外，留数没有零点，我们表明两个 Regge 轨迹都是线性的，并且最大自旋随着 $J_F=n+\\frac12$ 和 $J_B=m+1$ 的水平而增长。然后，费米子极展开式和玻色子极展开式之间的对偶性将减小的幅度固定为 Beta 函数，直至其归一化和两个 Regge 斜率之比。要求费米子和玻色子谱简并等于斜率，并且所得振幅与开超弦振幅一致。", "authors": [{"name": "Pongwit Srisangyingcharoen"}], "featured_authors": [{"name": "Pongwit Srisangyingcharoen"}], "author_count": 1}, {"id": "2610.24978", "category": "hep-th", "title": "Complex spinodals and supercritical crossovers in Kerr-Newman-AdS$_4$ black holes", "abstract": "We study supercritical crossovers in four-dimensional Kerr-Newman-AdS black holes at fixed angular momentum and charge. From the exact enthalpy, we prove uniqueness of the physical critical point and positivity of the quartic Landau coefficient throughout the charge-rotation family, treating the uncharged Kerr-AdS endpoint in separate scaling variables. An exact quartic reduction determines the coexistence entropies and latent heat throughout the subcritical regime. Above criticality, the two physical spinodals continue as a complex conjugate pair. Their real temperature projection defines a Widom-type line, and varying the charge-rotation ratio assembles these lines into a crossover surface. The Landau cusp fixes the imaginary entropy and temperature to scale with the square root and three-halves powers of the pressure displacement from criticality. The projected fold and the local heat capacity ridge share a critical tangent. We derive their leading quadratic temperature separation and prove that the ridge lies at a higher temperature near criticality. Exact endpoint solutions and numerical continuation check these predictions. The cusp exponents are common to the family, while the crossover temperature depends on the thermodynamic criterion used to define it.", "url": "https://arxiv.org/abs/2610.24978", "type": "理论", "summary": "我们研究了四维 Kerr-Newman-AdS 黑洞中固定角动量和电荷的超临界交叉。根据精确的焓，我们证明了整个电荷旋转族中四次朗道系数的物理临界点和正性的唯一性，并在单独的缩放变量中处理不带电的 Kerr-AdS 端点。精确的四次约简决定了整个亚临界状态下的共存熵和潜热。在临界点之上，两个物理旋节线继续作为复共轭对。它们的真实温度投影定义了 Widom 型线，并且改变电荷旋转比将这些线组装成交叉表面。朗道尖点将虚熵和温度固定为与临界压力位移的平方根和三分之二幂成比例。投影折叠和局部热容脊共享临界切线。我们推导出其领先的二次温度分离，并证明脊处于接近临界点的较高温度。精确的终点解和数值连续性检查这些预测。\n\n尖点指数对于该族来说是常见的，而交叉温度取决于用于定义它的热力学标准。", "authors": [{"name": "Bum-Hoon Lee"}, {"name": "Hocheol Lee"}, {"name": "Somyadip Thakur"}], "featured_authors": [{"name": "Bum-Hoon Lee"}, {"name": "Hocheol Lee"}, {"name": "Somyadip Thakur"}], "author_count": 3}, {"id": "2610.25439", "category": "hep-th", "title": "The Anyon Atlas", "abstract": "We classify possible topological quantum field theories in 2+1 dimensions with up to 22 anyons in the bosonic case and up to 26 in the fermionic case, through the modular data of modular and supermodular tensor categories. We construct such data via congruence representations of $\\mathrm{SL}(2,\\mathbb{Z})$ using a numerical optimization algorithm that scales to high rank. We chart the relations between the resulting theories, including anyon condensations and Chern-Simons realizations. We find examples of modular data that do not appear to arise from any Chern-Simons theory by any sequence of condensations of anyons or gaugings of ordinary global symmetries. These examples give qualitatively new topological quantum field theories, which go beyond any notion of gauge theory. For examples in this class with 11 and 12 anyon types, we solve the pentagon and hexagon equations explicitly, showing that these modular data are realized by full unitary topological quantum field theories. We also introduce this https URL , an online resource for exploring the data.", "url": "https://arxiv.org/abs/2610.25439", "type": "理论", "summary": "通过模和超模张量类别的模数据，我们将可能的拓扑量子场论分类为 2+1 维度，在玻色子情况下最多有 22 个任意子，在费米子情况下最多有 26 个任意子。我们使用可扩展到高阶的数值优化算法，通过 $\\mathrm{SL}(2,\\mathbb{Z})$ 的同余表示来构造此类数据。我们绘制了由此产生的理论之间的关系，包括任意子凝聚和陈-西蒙斯实现。我们发现了模块化数据的例子，这些数据似乎不是通过任何任意子的凝聚序列或普通全局对称性的测量而从任何陈-西蒙斯理论中产生的。这些例子给出了全新的拓扑量子场论，超越了规范理论的任何概念。对于此类中具有 11 和 12 任意子类型的示例，我们显式求解五边形和六边形方程，表明这些模块化数据是通过全酉拓扑量子场论实现的。我们还介绍了这个 https URL，这是一个用于探索数据的在线资源。", "authors": [{"name": "Jonah Berean-Dutcher"}, {"name": "Clay Cordova"}, {"name": "Julio Parra-Martinez"}, {"name": "Richard Tuddenham"}], "featured_authors": [{"name": "Jonah Berean-Dutcher"}, {"name": "Clay Cordova"}, {"name": "Julio Parra-Martinez"}, {"name": "Richard Tuddenham"}], "author_count": 4}, {"id": "2610.25567", "category": "hep-th", "title": "Remarks on the Parameter Dependence of QCD$_{2A}$", "abstract": "Recently it was shown that there are only a few operators that contribute to the (very weak) $N_c$ dependence of the spectrum of two-dimensional adjoint QCD. We provide numerical evidence that none of these operators is dominant. In other words, all operators are necessary to guarantee the faithful representation of the Hamiltonian, resulting in, for instance, exact degeneracies of certain multi-particle state masses. We provide a complete list of interactions between single- and multi-trace states, which differ by trace-number block, as expected from the Kutasov-Schwimmer universality. The completed list allows for a targeted deformation of the theory to render some masses $N_c$-invariant. Nonetheless, we argue that a small amount of $N_c$ dependence of the theory is unavoidable. We also investigate the large constituent mass regime $m^2/g^2_{\\rm YM}N_c\\gg 1$ of the theory at large $N_c$ in the eLCQ approach. We find, among other things, that as the constituent mass grows, eigenstates get purer in parton number, in line with expectations.", "url": "https://arxiv.org/abs/2610.25567", "type": "理论", "summary": "最近的研究表明，只有少数算子对二维伴随 QCD 谱的（非常弱的）$N_c$ 依赖性有贡献。我们提供的数字证据表明，这些运营商中没有一个占主导地位。换句话说，所有算子都必须保证哈密顿量的忠实表示，从而导致某些多粒子状态质量的精确简并。我们提供了单迹和多迹状态之间相互作用的完整列表，这些状态因迹数块而异，正如 Kutasov-Schwimmer 普遍性所预期的那样。完整的列表允许对理论进行有针对性的变形，以使某些质量保持 $N_c$ 不变。尽管如此，我们认为该理论的少量 $N_c$ 依赖性是不可避免的。我们还研究了 eLCQ 方法中大 $N_c$ 理论的大组成质量体系 $m^2/g^2_{\\rm YM}N_c\\gg 1$。我们发现，除其他外，随着组成质量的增加，本征态的部分子数变得更加纯净，这与预期一致。", "authors": [{"name": "Uwe Trittmann"}], "featured_authors": [{"name": "Uwe Trittmann"}], "author_count": 1}, {"id": "2610.25669", "category": "hep-th", "title": "Non-Riemannian Holography: Long Strings and Soft Hair", "abstract": "We propose an $\\mathbf{O}(D,D)$-covariant holographic dictionary for two bulk completions of the Gomis--Ooguri boundary data: Riemannian $AdS_3$ supported by pure NS--NS flux and an everywhere non-Riemannian string Newton--Cartan geometry. An $\\mathbf{O}(D,D)$-covariant Codazzi identity yields the boundary conservation law. Both branches share diagonal generalized-metric one-point functions, but only the non-Riemannian branch carries independent normalizable soft hair that couples to long strings without contributing to surface charges or the renormalized on-shell action. Supersymmetric non-Riemannian saddles admit arbitrary chiral Killing-spinor profiles, realizing \"supersupersymmetry.\"", "url": "https://arxiv.org/abs/2610.25669", "type": "理论", "summary": "我们提出了一个 $\\mathbf{O}(D,D)$ 协变全息字典，用于 Gomis--Ooguri 边界数据的两个批量完成：由纯 NS--NS 通量支持的黎曼 $AdS_3$ 和无处不在的非黎曼弦牛顿-嘉当几何。 $\\mathbf{O}(D,D)$ 协变 Codazzi 恒等式产生边界守恒定律。两个分支共享对角广义度量单点函数，但只有非黎曼分支具有独立的可归一化软毛，该软毛耦合到长弦，而不有助于表面电荷或重整化的壳上作用。超对称非黎曼鞍座允许任意手性杀伤旋量轮廓，实现“超超对称”。", "authors": [{"name": "Shaun D. Hampton"}, {"name": "Hyun-Cheol Kim"}, {"name": "Jae-Hyuk Oh"}, {"name": "Jeong-Hyuck Park"}], "featured_authors": [{"name": "Shaun D. Hampton"}, {"name": "Hyun-Cheol Kim"}, {"name": "Jae-Hyuk Oh"}, {"name": "Jeong-Hyuck Park"}], "author_count": 4}, {"id": "2610.25685", "category": "hep-th", "title": "Subsystem quantum Rényi-Bhattacharyya distance in 2D CFTs and its holographic applications", "abstract": "We develop a systematic method to compute the subsystem fidelity and Rényi fidelity in two-dimensional conformal field theories (CFTs) from the operator product expansion of twist operators, and apply it to the subsystem quantum Bhattacharyya distance (BD) and Rényi-Bhattacharyya distance (RBD). We validate the method against exact results in the free massless fermion and boson theories, and then use it to compute the BD and RBD in holographic CFTs between two heavy primary states, between two thermal states, and between a heavy primary state and a thermal state. When the two states differ in their classical, order-$c$ data, the distances are of order $c$, and the states are distinguishable already at the level of classical gravity; when the leading data coincide, the distances are of order $1/c$ at every order of the short interval expansion, so that the distinguishability becomes a perturbative quantum gravity effect. For a heavy primary state and its thermal counterpart, the leading contribution to the BD appears at order $\\ell^8$ and is of order $c^0$, whereas the RBD is generically of order $c$, in line with the earlier finding that a heavy primary state and a thermal state share the same order-$c$ entanglement entropy but have different order-$c$ Rényi entropies in the short interval expansion.", "url": "https://arxiv.org/abs/2610.25685", "type": "理论", "summary": "我们开发了一种系统方法，从扭曲算子的算子乘积展开计算二维共形场论（CFT）中的子系统保真度和 Rényi 保真度，并将其应用于子系统量子 Bhattacharyya 距离（BD）和 Rényi-Bhattacharyya 距离（RBD）。我们根据自由无质量费米子和玻色子理论中的精确结果验证了该方法，然后用它来计算两个重主态之间、两个热态之间以及重主态和热态之间的全息 CFT 中的 BD 和 RBD。当两个状态的经典 $c$ 级数据不同时，距离为 $c$ 级，并且状态在经典引力水平上已经可以区分；当主导数据重合时，在短区间展开的每个阶上，距离都是$1/c$的量级，因此可区分性变成了微扰量子引力效应。\n\n对于重主态及其热对应物，对 BD 的主要贡献出现在 $\\ell^8$ 阶，并且为 $c^0$ 阶，而 RBD 通常为 $c$ 阶，这与之前的发现一致，即重主态和热态共享相同的 $c$ 阶纠缠熵，但在短区间展开中具有不同的 $c$ 阶 Rényi 熵。", "authors": [{"name": "Yihao Wang"}, {"name": "Jiaju Zhang"}], "featured_authors": [{"name": "Yihao Wang"}, {"name": "Jiaju Zhang"}], "author_count": 2}, {"id": "2610.25940", "category": "hep-th", "title": "The long-range Ising CFT: perturbative and nonperturbative approaches", "abstract": "The long-range Ising model is the prototype of criticality with power-law interactions. In each dimension its interacting critical points form a one-parameter family of nonlocal conformal field theories, weakly coupled at both ends but not in between. We study this family in one, two and three dimensions from several independent directions. We extend the expansion about the generalized free field from three to eight loops and expand about the short-range end. We show that Hamiltonian truncation applies to this nonlocal theory once a truncation artifact is corrected. Where they can be compared, the resummed expansions, Hamiltonian truncation, the numerical renormalization group and Monte Carlo simulations agree on the dimension of the leading $\\mathbb{Z}_2$-even scalar at the sub-percent level, as universality requires.", "url": "https://arxiv.org/abs/2610.25940", "type": "理论", "summary": "长程伊辛模型是幂律相互作用临界性的原型。在每个维度中，其相互作用的临界点形成非局部共形场论的单参数族，两端弱耦合，但中间不弱耦合。我们从几个独立的方向对这个家族进行一维、二维和三维的研究。我们将广义自由场的展开从三圈扩展到八圈，并在短程端展开。我们证明，一旦截断伪影被纠正，哈密顿截断就适用于这种非局部理论。在可以比较的地方，恢复展开、哈密顿截断、数值重正化群和蒙特卡罗模拟在前导 $\\mathbb{Z}_2$ 的维数上一致，甚至是亚百分比水平的标量，正如普遍性所要求的那样。", "authors": [{"name": "Zechuan Zheng"}], "featured_authors": [{"name": "Zechuan Zheng"}], "author_count": 1}, {"id": "2610.25969", "category": "hep-th", "title": "Higher-Dimensional Test of the Holographic Dual of Entanglement Cohomology", "abstract": "We extend the holographic test of entanglement cohomology from $d=2$ to higher-dimensional conformal field theories. For a $d$-dimensional CFT with a spherical entangling region $A$, the vacuum modular Hamiltonian is known explicitly, and the boundary relative entropy of a primary-operator perturbation can be computed via conformal Ward identities. On the bulk side, the perturbation is dual to a scalar field in AdS$_{d+1}$, and the bulk canonical energy is computed using the JLMS relation. We carry out the computation explicitly for $d=3$ and $d=4$ and find that the boundary and bulk results agree at first order in the perturbation, with identical coefficients $\\kappa_d \\Delta^2 / C_T$, where $\\kappa_3 = \\pi^2/12$ and $\\kappa_4 = 3\\pi^3/16$. The result extends the quantitative verification of the holographic dual of entanglement cohomology beyond the $d=2$ case treated in the companion paper and confirms that the modular Hamiltonian perturbation is the correct holographic image of the first entanglement cohomology class. We discuss the role of the conformal anomaly, the shape of the entanglement wedge, and an outlook on TsT-deformed backgrounds. \\keywords{Entanglement entropy \\and Cyclic cohomology \\and von Neumann algebras \\and Holography \\and Modular Hamiltonian}", "url": "https://arxiv.org/abs/2610.25969", "type": "理论", "summary": "我们将纠缠上同调的全息测试从 $d=2$ 扩展到更高维的共形场论。对于具有球形纠缠区域 $A$ 的 $d$ 维 CFT，真空模哈密顿量是明确已知的，并且主算子扰动的边界相对熵可以通过共形 Ward 恒等式计算。在体侧，扰动与 AdS$_{d+1}$ 中的标量场对偶，并且使用 JLMS 关系计算体正则能量。我们对 $d=3$ 和 $d=4$ 进行显式计算，发现边界和体结果在扰动的一阶上一致，具有相同的系数 $\\kappa_d \\Delta^2 / C_T$，其中 $\\kappa_3 = \\pi^2/12$ 和 $\\kappa_4 = 3\\pi^3/16$。该结果将纠缠上同调全息对偶的定量验证扩展到了配套论文中处理的 $d=2$ 情况之外，并证实了模哈密顿摄动是第一纠缠上同调类的正确全息图像。我们讨论了共形异常的作用、纠缠楔的形状以及对 TsT 变形背景的展望。\n\n\\keywords{纠缠熵\\和循环上同调\\和冯诺依曼代数\\和全息术\\和模哈密顿}", "authors": [{"name": "R.C.Rashkov"}], "featured_authors": [{"name": "R.C.Rashkov"}], "author_count": 1}, {"id": "2610.25972", "category": "hep-th", "title": "One-loop unifying relations between Yang-Mills theory and the nonlinear sigma model from Berends-Giele currents", "abstract": "We study unifying relations between Yang-Mills theory and the nonlinear sigma model. We extend tree-level amplitude relations expressed through differential operators to off-shell multiparticle currents and obtain one-loop integrand relations by sewing two off-shell legs. This off-shell approach may also apply to higher-loop integrands.", "url": "https://arxiv.org/abs/2610.25972", "type": "理论", "summary": "我们研究了 Yang-Mills 理论和非线性 sigma 模型之间的统一关系。我们将通过微分算子表达的树级振幅关系扩展到离壳多粒子流，并通过缝合两个离壳腿获得单环被积函数关系。这种离壳方法也适用于更高循环的被积函数。", "authors": [{"name": "Zhenhua Guo"}, {"name": "Xin Yan"}], "featured_authors": [{"name": "Zhenhua Guo"}, {"name": "Xin Yan"}], "author_count": 2}, {"id": "2610.26014", "category": "hep-th", "title": "Hubble Susceptibility: Beyond Effective-Mass Spectroscopy in the Cosmological Collider", "abstract": "In this note, we introduce the Hubble susceptibility of cosmological-collider masses, encoded in the scale dependence of the squeezed-limit oscillation. Heavy fields generically receive Hubble-induced mass corrections during inflation, and we show that the local oscillation frequency and its drift can disentangle such corrections from an intrinsic mass contribution at leading slow-roll and adiabatic order.", "url": "https://arxiv.org/abs/2610.26014", "type": "理论", "summary": "在这篇文章中，我们介绍了宇宙对撞机质量的哈勃敏感性，编码为压缩极限振荡的尺度依赖性。重场在暴胀过程中通常会受到哈勃引起的质量修正，我们表明，本地振荡频率及其漂移可以将这种修正与领先的慢滚和绝热级的内在质量贡献分开。", "authors": [{"name": "Shuntaro Aoki"}, {"name": "Masahide Yamaguchi"}], "featured_authors": [{"name": "Shuntaro Aoki"}, {"name": "Masahide Yamaguchi"}], "author_count": 2}, {"id": "2610.26092", "category": "hep-th", "title": "Millicharged particles and the degree-3 Prouhet-Tarry-Escott problem", "abstract": "We use geometry to solve a problem in arithmetic relevant for physics. Namely, for any $m$ we find all integer solutions to the equations $\\sum_{i=1}^m x_i^k = \\sum_{i=1}^m y_i^k$, where $k \\in \\{1,2,3\\}$; this seems to be new for $m \\geq 5$. In physics, these are the anomaly cancellation conditions for models with $m$ fermions which can be naturally light and carry small electric charges (a.k.a. millicharged or minicharged particles). The small charges arise by kinetic mixing of the Standard Model $U(1)$ gauge symmetry with an unbroken non-chiral (a.k.a. vector-like) $U(1)$ and the masses are suppressed by a spontaneously-broken chiral $U(1)$.", "url": "https://arxiv.org/abs/2610.26092", "type": "理论", "summary": "我们使用几何来解决与物理相关的算术问题。也就是说，对于任何 $m$，我们找到方程 $\\sum_{i=1}^m x_i^k = \\sum_{i=1}^m y_i^k$ 的所有整数解，其中 $k \\in \\{1,2,3\\}$;这对于 $m \\geq 5$ 来说似乎是新的。在物理学中，这些是具有 $m$ 费米子模型的异常消除条件，这些费米子可以自然发光并携带小电荷（又称毫带电或微带电粒子）。小电荷是由标准模型 $U(1)$ 规范对称性与未破缺的非手性（又名矢量类）$U(1)$ 的动力学混合产生的，质量被自发破缺的手性 $U(1)$ 抑制。", "authors": [{"name": "Ben Gripaios"}], "featured_authors": [{"name": "Ben Gripaios"}], "author_count": 1}, {"id": "2610.26177", "category": "hep-th", "title": "Quantum Noise from Massive Lorentz--Violating Gravitons: Interferometer Signatures in Very Special Linear Gravity", "abstract": "In this work we analyse under the Very Special Linear Gravity framework, which introduces a gauge invariant massive graviton with two polarizations, possible signatures of gravitons in a classical gravitational detector. Following the Vernon approach we found dissipative terms consistent with other works and extra terms of order of the graviton mass squared. The model also presents a characteristic feature when a squeezed state is considered. In such case, a contribution that distinguishes the sign of the squeezing phase is present.", "url": "https://arxiv.org/abs/2610.26177", "type": "理论", "summary": "在这项工作中，我们在非常特殊的线性重力框架下进行分析，该框架引入了具有两个偏振的规范不变的大质量引力子，这是经典引力探测器中引力子的可能特征。遵循弗农方法，我们发现了与其他作品一致的耗散项以及引力子质量平方的额外阶项。当考虑挤压状态时，该模型还呈现出一个特征。在这种情况下，存在区分挤压阶段的符号的贡献。", "authors": [{"name": "Jorge Alfaro"}, {"name": "Alex Soto"}, {"name": "Alessandro Santoni"}], "featured_authors": [{"name": "Jorge Alfaro"}, {"name": "Alex Soto"}, {"name": "Alessandro Santoni"}], "author_count": 3}, {"id": "2610.26197", "category": "hep-th", "title": "Quantum Relaxation Dynamics of Vacuum Energy from Pre-Geometric Gravity", "abstract": "We investigate a quantum relaxation mechanism for the vacuum energy density arising from the spontaneous symmetry breaking (SSB) $SO(1,4)\\to SO(1,3)$, driven by a Higgs field $\\Phi$ in a MacDowell--Mansouri pre-geometric gravity framework. The theory predicts a countably infinite set of vacua, corresponding to distinct topological sectors, for a periodic Higgs potential with intervening barriers. This structure gives rise to a series of dualities and see-saw relations connecting fundamental scales---the Planck mass and the Cosmological Constant---to topological parameters such as the Gauss-Bonnet coupling and the $\\theta$-term, all of which emerge only after SSB. A striking consequence is the quantization of the vacuum energy into discrete levels. Starting from a vacuum expectation value $\\langle \\Phi\\rangle = v_1$ associated with a large vacuum energy, the system evolves via quantum tunneling through the infinite landscape of minima. Crucially, we demonstrate that the transition probability is maximized for the ordered sequence $ \\Lambda_1 > \\cdots > \\Lambda_k > \\cdots$, where the Cosmological Constant decreases monotonically toward the asymptotic attractor $\\Lambda_\\infty = 0$.", "url": "https://arxiv.org/abs/2610.26197", "type": "理论", "summary": "我们研究了由自发对称破缺 (SSB) $SO(1,4)\\to SO(1,3)$ 引起的真空能量密度的量子弛豫机制，该机制由 MacDowell-Mansouri 前几何引力框架中的希格斯场 $\\Phi$ 驱动。该理论预测了一组可数无限的真空，对应于不同的拓扑扇区，对于具有干扰势垒的周期性希格斯势。这种结构产生了一系列对偶性和拉锯关系，将基本尺度——普朗克质量和宇宙常数——与高斯-邦内耦合和 $\\theta$ 项等拓扑参数连接起来，所有这些都只在 SSB 之后出现。一个惊人的结果是将真空能量量子化为离散能级。从与大真空能量相关的真空期望值 $\\langle \\Phi\\rangle = v_1$ 开始，系统通过量子隧道穿过无限的极小值演化。至关重要的是，我们证明了有序序列 $ \\Lambda_1 > \\cdots > \\Lambda_k > \\cdots$ 的转移概率最大化，其中宇宙常数朝着渐近吸引子 $\\Lambda_\\infty = 0$ 单调递减。", "authors": [{"name": "Andrea Addazi"}], "featured_authors": [{"name": "Andrea Addazi"}], "author_count": 1}, {"id": "2610.26218", "category": "hep-th", "title": "Boundary preparation of strong Mpemba states in holography", "abstract": "Finite boundary drives ending at the same charge density can select different relaxation channels. We demonstrate this in a probe Abelian--Higgs model on a fixed AdS black brane with a stable normal endpoint. Charge exchange during preparation modifies scalar propagation and source coupling. Density history and radial Maxwell feedback during and after the drive leave a cubic slow amplitude even after linear slow-mode cancellation. For the tested protocols at $\\rho_f=3$, the density-history term interferes constructively with the net radial feedback; its modulus is 85--89\\% of that of the total cubic coefficient. Calculated from the low-order equations alone, this total coefficient predicts the compensating pulse. Full nonlinear evolution confirms the reduction from $O(\\epsilon^3)$ to $O(\\epsilon^5)$ in the source amplitude $\\epsilon$, with approximately 600-fold suppression for the representative protocol at $\\epsilon=0.05$. Compensation extends the window of fast-channel relaxation without changing the final quasinormal-mode spectrum; early distance crossing already arises from linear interference. Fully tuned two- and three-pulse preparations suppress one and two slow modes, respectively, within numerical resolution. Local analysis establishes finite-pulse reachability of strong Mpemba states with vanishing selected asymptotic slow-mode coefficients. Charge-neutral controls retain a total-time advantage from a common input when the full subsequent control duration is included.", "url": "https://arxiv.org/abs/2610.26218", "type": "理论", "summary": "以相同电荷密度结束的有限边界驱动可以选择不同的弛豫通道。我们在具有稳定法向端点的固定 AdS 黑膜上的探针阿贝尔-希格斯模型中证明了这一点。制备过程中的电荷交换会改变标量传播和源耦合。即使在线性慢模式消除之后，驱动期间和之后的密度历史和径向麦克斯韦反馈也会留下立方慢振幅。对于 $\\rho_f=3$ 处的测试协议，密度历史项对净径向反馈产生建设性干扰；其模量为总立方系数的85--89%。仅根据低阶方程计算，该总系数可预测补偿脉冲。完全非线性演化证实了源幅度 $\\epsilon$ 从 $O(\\epsilon^3)$ 减少到 $O(\\epsilon^5)$，在 $\\epsilon=0.05$ 时对代表性协议进行了约 600 倍的抑制。补偿扩展了快速通道弛豫的窗口，而不改变最终的准简正模频谱；早期的距离交叉已经由线性干扰引起。\n\n完全调谐的两脉冲和三脉冲准备在数值分辨率内分别抑制一种和两种慢模式。局部分析建立了强 Mpemba 态的有限脉冲可达性，且所选渐近慢模系数消失。当包括完整的后续控制持续时间时，电荷中性控制保留了公共输入的总时间优势。", "authors": [{"name": "Yu Shi"}, {"name": "Xinwu Liu"}, {"name": "Liping Li"}, {"name": "Chikun Ding"}, {"name": "Yuebing Zhou"}, {"name": "Changqing Liu"}, {"name": "Sheng Long"}], "featured_authors": [{"name": "Yu Shi"}, {"name": "Xinwu Liu"}, {"name": "Liping Li"}, {"name": "Yuebing Zhou"}, {"name": "Changqing Liu"}, {"name": "Sheng Long"}], "author_count": 7}, {"id": "2610.26281", "category": "hep-th", "title": "Dispersion of three-dimensional oscillons: a standing-wave perspective", "abstract": "A spherically symmetric standing wave confined within a finite-radius ball, with weak radiative exchange between its core and boundary, provides a model for an intermediate stage in the adiabatic evolution of the $\\phi^4$ oscillon. We employ a multiscale variational framework to derive an approximate description of these standing waves and their energy-frequency relation. The resulting dispersion curve is compared with that obtained from numerical solutions of the boundary value problem for the $\\phi^4$ equation on a two dimensional (time and radius) domain. The agreement between the numerical and variational results is excellent near the endpoint of the continuous spectrum but deteriorates as $\\omega$ is reduced below $0.85 \\omega_0$. We attribute this discrepancy to the growth of the radiation wing, which is neglected in the variational ansatz.", "url": "https://arxiv.org/abs/2610.26281", "type": "理论", "summary": "限制在有限半径球内的球对称驻波，其核心和边界之间的辐射交换较弱，为 $\\phi^4$ 振荡绝热演化的中间阶段提供了模型。我们采用多尺度变分框架来推导出这些驻波及其能量频率关系的近似描述。将所得频散曲线与二维（时间和半径）域上 $\\phi^4$ 方程的边值问题的数值解所获得的频散曲线进行比较。数值结果和变分结果之间的一致性在连续谱端点附近非常好，但随着 $\\omega$ 降至 $0.85 \\omega_0$ 以下而恶化。我们将这种差异归因于辐射翼的生长，这在变分拟似中被忽略了。", "authors": [{"name": "I. V. Barashenkov"}, {"name": "R. De Sousa"}, {"name": "N. V. Alexeeva"}, {"name": "A. Dika"}, {"name": "E. V. Zemlyanaya"}], "featured_authors": [{"name": "I. V. Barashenkov"}, {"name": "R. De Sousa"}, {"name": "N. V. Alexeeva"}, {"name": "A. Dika"}, {"name": "E. V. Zemlyanaya"}], "author_count": 5}, {"id": "2610.26515", "category": "hep-th", "title": "U(1) Current Diffusion in Gauss-Bonnet Holography", "abstract": "We study holographic $U(1)$ charge transport using a probe Maxwell field in a five-dimensional Gauss-Bonnet-AdS black-brane background. Within the all-order linearised fluid/gravity framework, we derive the off-shell constitutive relation and determine the diffusion function and electric and magnetic conductivities analytically in the hydrodynamic regime and numerically at generic frequency and momentum. To first order in the Gauss-Bonnet coupling, the leading diffusion constant remains unchanged in our normalization, while its frequency dependence and the electric conductivity receive nontrivial corrections. The deformation also generates a nonvanishing leading magnetic conductivity. Beyond the hydrodynamic regime, it modifies the transport profiles while preserving the damped behaviour of the diffusion function. The corresponding memory kernel vanishes at negative times, supporting a retarded constitutive response.", "url": "https://arxiv.org/abs/2610.26515", "type": "理论", "summary": "我们使用探针麦克斯韦场在五维 Gauss-Bonnet-AdS 黑膜背景中研究全息 $U(1)$ 电荷传输。在全阶线性化流体/重力框架内，我们推导了离壳本构关系，并在流体动力学状态下分析地确定了扩散函数以及电导率和磁导率，并在通用频率和动量下以数值方式确定了扩散函数和电导率和磁导率。对于高斯-博内特耦合中的一阶，主导扩散常数在我们的归一化中保持不变，而其频率依赖性和电导率接受了重要的校正。变形还产生不为零的超前磁导率。除了流体动力学状态之外，它还可以修改传输曲线，同时保留扩散函数的阻尼行为。相应的记忆内核在负时间消失，支持延迟的本构反应。", "authors": [{"name": "A. Naveena Kumara"}, {"name": "Shreyas Punacha"}, {"name": "Kartheek Hegde"}], "featured_authors": [{"name": "A. Naveena Kumara"}, {"name": "Shreyas Punacha"}, {"name": "Kartheek Hegde"}], "author_count": 3}, {"id": "2610.26610", "category": "hep-th", "title": "The $A_3$ Narain family over $\\mathbb{Z}_4$", "abstract": "The code $\\{000,220,202,022\\}\\subset\\mathbb{Z}_4^3$ realizes the split $A_3$ root-weight gluing construction as ordinary Construction A, preserving the Lorentzian pairing and the positive energy form. For two hyperbolic pairs of $A_3$ blocks, the twenty-two even self-dual gluing codes form seven block-monomial classes. Explicit metric and $B$-field representatives and theta series distinguish exactly seven T-duality classes in this family at central charge six; the one-pair family has two classes at central charge three. For arbitrary $d$, the chiral root system on either side is $A_1^{3m}$, where $m$ counts the words $(2e_i,2e_i)$ in the gluing code. Exactly one two-pair class has no zero-$B$ T-duality frame. Intersections of gluing codes determine finite shift orbifolds between the backgrounds, with the target code specifying the twisted-sector projections.", "url": "https://arxiv.org/abs/2610.26610", "type": "理论", "summary": "代码 $\\{000,220,202,022\\}\\subset\\mathbb{Z}_4^3$ 实现了与普通构造 A 一样的分割 $A_3$ 根权重粘合构造，保留了洛伦兹配对和正能量形式。对于 $A_3$ 块的两个双曲对，二十二个偶数自对偶粘合代码形成七个块单项式类。显式度量和 $B$ 场代表和 theta 序列区分了该系列中的七个 T 对偶类，中心电荷为 6；一对家庭有两个班级，中央收费三。对于任意 $d$，两侧的手性根系为 $A_1​​^{3m}$，其中 $m$ 计算粘合代码中的单词 $(2e_i,2e_i)$。恰好有一个两对类没有零 $B$ T 对偶框架。粘合代码的交叉点确定背景之间的有限平移轨道，目标代码指定扭曲扇形投影。", "authors": [{"name": "Rajae Sammani"}, {"name": "Abdellah Sebbar"}], "featured_authors": [{"name": "Rajae Sammani"}, {"name": "Abdellah Sebbar"}], "author_count": 2}, {"id": "2610.26672", "category": "hep-th", "title": "On Integrable Deformations of CFTs and Integrable Two-Dimensional Sigma Models", "abstract": "In this paper, we analyze the systems of screening charges corresponding to $\\eta$-deformed $O(N)$ and $OSp(N|2m)$ sigma models. These sigma models can be represented as integrable deformations of certain conformal field theories. Based on the case of $O(N)$ sigma models, which were conjectured in previous works by A.V. Litvinov and co-authors to be an integrable deformation of the conformal field theory corresponding to the algebras $W(D(n+1|n))$ and $W(D(n|n))$ for the cases $N=2n+2$ and $N=2n+1$ at $n \\geq 1$, respectively, we formulate a hypothesis on how to write down the system of screening charges for the conformal field theory whose integrable deformation defines the $\\eta$-deformed $OSp(N|2m)$ sigma model for the case of odd $N=2n+1$, asymptotically free models with $N-2m-2>0$ and $n \\geq 2$, $m \\geq 1$. This hypothesis is explicitly verified for the cases of $OSp(5|2)$, $OSp(7|2)$, and $OSp(7|4)$, which were separately investigated in the work of M.N. Alfimov and co-authors.", "url": "https://arxiv.org/abs/2610.26672", "type": "理论", "summary": "在本文中，我们分析了对应于 $\\eta$ 变形 $O(N)$ 和 $OSp(N|2m)$ sigma 模型的筛选费用系统。这些西格玛模型可以表示为某些共形场论的可积变形。基于 $O(N)$ sigma 模型的案例，该模型是 A.V. 在之前的作品中推测的。 Litvinov 和合著者将共形场论的可积变形对应于代数 $W(D(n+1|n))$ 和 $W(D(n|n))$，分别针对 $N=2n+2$ 和 $N=2n+1$ 在 $n \\geq 1$ 的情况，我们提出了一个假设，关于如何写下共形场论的筛选电荷系统，其可积变形定义了$\\eta$ 变形的 $OSp(N|2m)$ sigma 模型适用于奇数 $N=2n+1$ 的情况，$N-2m-2>0$ 和 $n \\geq 2$、$m \\geq 1$ 的渐近自由模型。该假设在 $OSp(5|2)$、$OSp(7|2)$ 和 $OSp(7|4)$ 的情况下得到了明确验证，这些案例在 M.N. 的工作中分别进行了研究。阿尔菲莫夫和合著者。", "authors": [{"name": "Mikhail Alfimov"}], "featured_authors": [{"name": "Mikhail Alfimov"}], "author_count": 1}, {"id": "2610.26704", "category": "hep-th", "title": "An explicit product for the on-shell higher-spin algebra in $AdS_d$-space", "abstract": "For $d>3$ we construct the product of the bosonic on-shell higher-spin algebra directly on the AdS-traceless representatives. We find the traceless projector in closed form, determine all linear relations among the trace-producing operators, and prove that every class modulo the $\\mathfrak{sp}(2)$ ideal has a unique traceless representative. The resulting product is an explicit differential operator, which we test on the $\\mathfrak{so}(d-1,2)$ generators. A toy model shows how the factorisation lifts from bilinear products to trilinear ones in minimal $A_\\infty$-algebras.", "url": "https://arxiv.org/abs/2610.26704", "type": "理论", "summary": "对于 $d>3$，我们直接在 AdS-traceless 代表上构造玻色子壳上高自旋代数的乘积。我们找到封闭形式的无迹投影仪，确定迹产生算子之间的所有线性关系，并证明以 $\\mathfrak{sp}(2)$ 理想为模的每个类都具有唯一的无迹代表。得到的结果是一个显式微分运算符，我们在 $\\mathfrak{so}(d-1,2)$ 生成器上进行测试。玩具模型展示了如何在最小 $A_\\infty$ 代数中将双线性乘积分解为三线性乘积。", "authors": [{"name": "M. A. Povarnin"}], "featured_authors": [{"name": "M. A. Povarnin"}], "author_count": 1}, {"id": "2610.26735", "category": "hep-th", "title": "Large-Level Limit of Doubled Chern-Simons Theory Part I: Regular Sector, Boundaries and Interfaces", "abstract": "We study three-dimensional $BF$ theory as the large-level limit of the doubled Chern--Simons theory $G_k\\times G_{-k}$ for simply connected, compact, simple $G$, a limit that connects the symmetry topological field theories of finite and continuous symmetries. Lines whose two highest weights grow linearly with $k$ at fixed difference become $BF$ lines, with magnetic flux set by their average and electric charge equal to their difference. Representing level-$k$ torus states as normalized flux--charge wave packets, we prove that every fixed modular transformation of any fixed normalizable state with regular flux converges in the strong-$*$ topology to its $BF$ counterpart. The Dehn twist gives each line exactly its Aharonov--Bohm phase at every level, while $S$ converges to a Fourier transform exchanging flux and charge, without escaping to singular holonomies or large charges. States that approach singular fluxes at large $k$ are not covered. The natural boundary 2d theory is speculated to be a decompactified boson in the abelian case $G=U(1)$, and $\\dim G$ non-compact free scalars for general $G$. For $SU(2)$, we discuss the gapped interfaces between adjacent levels, which must shift some flux or charge by a finite amount. In the $k\\rightarrow\\infty$ limit the interface is conjectured to be the $c=1$ Runkel--Watts theory.", "url": "https://arxiv.org/abs/2610.26735", "type": "理论", "summary": "我们研究三维$BF$理论作为简单连通、紧致、简单$G$的双陈-西蒙斯理论$G_k\\times G_{-k}$的大能级极限，这是连接有限对称和连续对称的对称拓扑场论的极限。两个最高权重以固定差值与 $k$ 线性增长的线成为 $BF$ 线，磁通量由它们的平均值决定，电荷等于它们的差值。将级别 $k$ 环面状态表示为归一化通量电荷波包，我们证明具有规则通量的任何固定归一化状态的每个固定模变换都会在强 $*$ 拓扑中收敛到其 $BF$ 对应项。 Dehn 扭曲在每个级别上为每条线提供了准确的阿哈罗诺夫-玻姆相位，而 $S$ 收敛到交换通量和电荷的傅里叶变换，而不会逃逸到奇异完整或大电荷。不包括在大 $k$ 处接近奇异通量的状态。自然边界二维理论被推测为阿贝尔情况下的解紧玻色子 $G=U(1)$，以及一般 $G$ 的 $\\dim G$ 非紧自由标量。\n\n对于 $SU(2)$，我们讨论相邻能级之间的间隙界面，它必须将一些通量或电荷移动有限的量。在 $k\\rightarrow\\infty$ 极限下，界面被推测为 $c=1$ Runkel--Watts 理论。", "authors": [{"name": "Shengyi Guan"}, {"name": "Qiang Jia"}, {"name": "Jiahua Tian"}, {"name": "Yi-Nan Wang"}], "featured_authors": [{"name": "Shengyi Guan"}, {"name": "Qiang Jia"}, {"name": "Jiahua Tian"}, {"name": "Yi-Nan Wang"}], "author_count": 4}, {"id": "2610.26814", "category": "hep-th", "title": "Rényi Multi-entropy for Stabilizer States: A Finite Field Gauss Sum Problem", "abstract": "Rényi multi-entropy probes multi-partite structure beyond bipartite spectra, but its behavior in general quantum states and the entanglement structure it captures remain poorly understood. We develop a finite field Gauss sum framework for calculating it in stabilizer states. Within this framework, the replica contraction reduces to a quadratic Gauss sum if and only if the state is locally unitarily equivalent to a stabilizer state. We obtain analytic expressions for the Rényi multi-entropy of all tree graph states and large families of loop graph states. In contrast to their flat bipartite Rényi spectra, stabilizer states generically have nonflat Rényi multi-entropy spectra.", "url": "https://arxiv.org/abs/2610.26814", "type": "理论", "summary": "Rényi 多熵探测​​二分光谱之外的多分结构，但其在一般量子态下的行为及其捕获的纠缠结构仍然知之甚少。我们开发了一个有限场高斯和框架来计算稳定器状态。在此框架内，当且仅当状态局部酉等价于稳定器状态时，副本收缩减少为二次高斯和。我们获得了所有树图状态和循环图状态大族的 Rényi 多熵的解析表达式。与平坦的二部 Rényi 谱相反，稳定态通常具有非平坦的 Rényi 多熵谱。", "authors": [{"name": "Bartlomiej Czech"}, {"name": "Yichen Feng"}, {"name": "Jonathan Harper"}, {"name": "Xin-Xiang Ju"}, {"name": "Yang Zhao"}], "featured_authors": [{"name": "Bartlomiej Czech"}, {"name": "Yichen Feng"}, {"name": "Jonathan Harper"}, {"name": "Xin-Xiang Ju"}, {"name": "Yang Zhao"}], "author_count": 5}, {"id": "2610.26822", "category": "hep-th", "title": "Mechanical angular momentum loss at $\\mathcal{O}(G^4)$ from static and radiative gravitons", "abstract": "We determine the loss of mechanical angular momentum $L^{\\mu}_{\\rm loss}$ of two gravitationally scattering bodies at $\\mathcal{O}(G^4)$ using worldline quantum field theory (WQFT). The gravitational memory effect, a phenomenon of the early- and late-time behaviour of the gravitational field, leads to static contributions to $L^{\\mu}_{\\rm loss}$. We ill
