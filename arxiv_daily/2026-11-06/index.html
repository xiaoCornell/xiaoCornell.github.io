ic interactions on bulk rheological properties.", "url": "https://arxiv.org/abs/2611.08205", "type": "理论", "summary": "我们通过结合流体动力相互作用（HI）效应来扩展聚合物哑铃的 BGK 型动力学模型及其晶格玻尔兹曼实现，以准确地恢复由 Smoluchowski 方程控制的慢变量动力学。与布朗动力学方法不同，布朗动力学方法需要在每个时间步对依赖于构型的扩散张量的平方根进行计算上昂贵的评估，这种动力学方法实现起来很简单，并且完全避免了这种开销。因此，它显着降低了计算成本。我们在稳定和瞬态剪切流中验证了该模型，证明了其捕获流体动力学相互作用对整体流变特性的独特特征的能力。", "authors": [{"name": "Shiwani Singh"}, {"name": "Santosh Ansumali"}], "featured_authors": [{"name": "Shiwani Singh"}, {"name": "Santosh Ansumali"}], "author_count": 2}, {"id": "2611.08258", "category": "cond-mat", "title": "Thermodynamics of Forgetting in a Bounded Hopfield Network", "abstract": "A memory that keeps learning must also forget. The Hopfield network does not: beyond a critical number of stored patterns it falls into a state of total confusion and retrieves none of them. Parisi showed in 1986 that bounding the synaptic strength cures this pathology, since the clipping of the couplings gradually erases the oldest memories and leaves room for the new ones. In this paper we provide a thermodynamic description of the resulting network, known as the Hopfield-Parisi model. Starting from the learning rule, we show that the network is equivalent to a Hopfield model whose patterns are weighted according to their age, superimposed on a Sherrington-Kirkpatrick spin glass, both governed by the synaptic bound: a larger bound makes the memory longer, but also noisier. The theory of nonlinear networks developed in the eighties already provides, through the heuristic replica method, the equations that govern this model at any temperature, but to the best of our knowledge they have been solved only at zero temperature. We rederive them at the replica symmetric level through Guerra's interpolation and solve them at finite temperature, obtaining the phase diagram of the model together with its memory horizon, namely the largest age at which a pattern can still be retrieved. The solution shows that forgetting acts on the signal alone, the noise being the same for patterns of every age, and that the horizon is maximal at an intermediate bound which is essentially insensitive to temperature. Monte Carlo simulations of networks trained with the original learning rule support these predictions.", "url": "https://arxiv.org/abs/2611.08258", "type": "理论+数值", "summary": "不断学习的记忆也必须忘记。 Hopfield 网络则不然：超过了存储模式的临界数量，它就会陷入完全混乱的状态，并且无法检索到任何模式。帕里西 (Parisi) 在 1986 年表明，限制突触强度可以治愈这种病症，因为耦合的剪切会逐渐消除最旧的记忆，并为新的记忆留下空间。在本文中，我们提供了所得网络的热力学描述，称为 Hopfield-Parisi 模型。从学习规则开始，我们证明该网络相当于一个 Hopfield 模型，其模式根据年龄进行加权，叠加在 Sherrington-Kirkpatrick 自旋玻璃上，两者都受突触界限控制：界限越大，记忆越长，但噪音也越大。八十年代发展起来的非线性网络理论已经通过启发式复制方法提供了在任何温度下控制该模型的方程，但据我们所知，它们只能在零温度下求解。\n\n我们通过 Guerra 插值在复制对称级别上重新推导它们，并在有限温度下求解它们，获得模型的相图及其记忆范围，即仍然可以检索模式的最大年龄。该解决方案表明，遗忘仅作用于信号，每个年龄的模式的噪声都是相同的，并且地平线在中间界限处最大，该中间界限基本上对温度不敏感。使用原始学习规则训练的网络的蒙特卡罗模拟支持这些预测。", "authors": [{"name": "Andrea Lepre"}], "featured_authors": [{"name": "Andrea Lepre"}], "author_count": 1}, {"id": "2611.08280", "category": "cond-mat", "title": "Dynamical Keldysh model for colored noise and finite relaxation rate", "abstract": "The Keldysh model describes quantum dots subjected to Gaussian noise with infinite correlation time. For multi-component noise coupled through non-commuting matrices, the spectrum exhibits a pseudogap. We solve the model for coloured noise with any correlation time, $1/ \\gamma$. Finite memory leads to the pseudogap being filled, its peaks merging and the line narrowing.", "url": "https://arxiv.org/abs/2611.08280", "type": "理论", "summary": "凯尔迪什模型描述了受到具有无限相关时间的高斯噪声影响的量子点。对于通过非交换矩阵耦合的多分量噪声，频谱表现出赝能隙。我们求解具有任意相关时间 $1/ \\gamma$ 的有色噪声模型。有限的记忆导致赝能隙被填充，其峰值合并，谱线变窄。", "authors": [{"name": "F. Z. Bendjeddou"}, {"name": "D. V. Efremov"}, {"name": "M. N. Kiselev"}], "featured_authors": [{"name": "F. Z. Bendjeddou"}, {"name": "D. V. Efremov"}, {"name": "M. N. Kiselev"}], "author_count": 3}, {"id": "2611.08296", "category": "cond-mat", "title": "Active model B+ from run-and-tumble particles on a triangular lattice", "abstract": "Active model B+ (AMB+) explains how motility-induced phase separation can be arrested by reverse Ostwald ripening, but its coefficients have not been derived from a microscopic lattice model that shows it. We provide an exact hydrodynamic description of a six-polarity lattice gas on a hexagonal geometry and employ a full gradient expansion with angular-harmonic elimination to rigorously derive AMB+ with every coefficient fixed by the Péclet number Pe. Near the critical point (3/4, 4), coarsening is ordinary; further away, field theory predicts reverse Ostwald ripening of vapor bubbles above Pe $> 4 \\sqrt{3}$, and simulations show long-lived bubbly states.", "url": "https://arxiv.org/abs/2611.08296", "type": "理论+数值", "summary": "主动模型 B+ (AMB+) 解释了如何通过逆奥斯特瓦尔德熟化来阻止运动引起的相分离，但其系数尚未从显示这一点的微观晶格模型中推导出来。我们提供了六角形几何上六极性晶格气体的精确流体动力学描述，并采用具有角谐波消除的全梯度展开来严格推导 AMB+，其中每个系数均由佩克莱特数 Pe 固定。接近临界点（3/4，4）时，粗化一般；更远的地方，场论预测在 Pe $> 4 \\sqrt{3}$ 以上蒸汽泡会发生逆奥斯特瓦尔德成熟，并且模拟显示出长期存在的气泡状态。", "authors": [{"name": "Abir Bhowmick"}, {"name": "P. K. Mohanty"}], "featured_authors": [{"name": "Abir Bhowmick"}, {"name": "P. K. Mohanty"}], "author_count": 2}, {"id": "2611.08324", "category": "cond-mat", "title": "Typical number and stability of equilibria in large non-reciprocal complex systems", "abstract": "We consider a prototypical class of dynamics of $N\\gg 1$ degrees of freedom subject to two competing terms, one favoring relaxation to a trivial equilibrium and one taking the form of a Gaussian force field promoting the emergence of many local equilibria. The latter is a non-gradient field, i.e. it includes a non-reciprocal component with a tunable strength. For this model, we compute the quenched complexity, i.e. the exponential growth rate of the typical number of equilibria, resolved by stability index. We compare it with the annealed complexity, i.e. the exponential growth rate of the average number of equilibria. We show that the two coincide only in the fully non-reciprocal limit: for any finite degree of reciprocity, typical realizations contain exponentially fewer equilibria than predicted by the average count. Increasing reciprocity enhances the discrepancy between the two. The quenched complexity depends explicitly on the covariance of the random force field and on the degree of non-reciprocity: the universality observed at the annealed level breaks down. The average counting of equilibria correctly identifies the location of the topology trivialization transition, but it does not capture the typical organization of equilibria near this transition, nor the stability index of the dominant equilibria.", "url": "https://arxiv.org/abs/2611.08324", "type": "理论+数值", "summary": "我们考虑一类典型的$N\\gg 1$ 自由度动力学，它受两个竞争项的约束，一个有利于松弛到微不足道的平衡，另一个采用高斯力场的形式促进许多局部平衡的出现。后者是非梯度场，即它包括具有可调强度的非互易分量。对于该模型，我们计算淬灭的复杂性，即典型平衡数的指数增长率，由稳定性指数解决。我们将其与退火复杂度（即平均平衡数的指数增长率）进行比较。我们证明两者仅在完全非互易极限下重合：对于任何有限程度的互易性，典型的实现所包含的平衡点比平均计数预测的要少得多。互惠性的增加会加剧两者之间的差异。淬灭的复杂性明确取决于随机力场的协方差和非互易性的程度：在退火水平观察到的普遍性被打破。\n\n平衡的平均计数正确地识别了拓扑平凡化转变的位置，但它没有捕获该转变附近平衡的典型组织，也没有捕获主导平衡的稳定性指数。", "authors": [{"name": "Bertrand Lacroix-A-Chez-Toine"}, {"name": "Pierre Le Doussal"}, {"name": "Valentina Ros"}], "featured_authors": [{"name": "Bertrand Lacroix-A-Chez-Toine"}, {"name": "Pierre Le Doussal"}, {"name": "Valentina Ros"}], "author_count": 3}, {"id": "2611.08385", "category": "cond-mat", "title": "Anisotropy lifts topological protection of transport in pumped spin chains", "abstract": "We investigate the prospect of topological spin pumping and transport in a dimerized spin-$\\frac{1}{2}$ anisotropic XY chain with tunable in-plane anisotropy. Through a Jordan-Wigner transformation, the system maps onto an extended Rice-Mele-type fermionic model whose momentum-space band structure exhibits gapped regions characterized by nonzero Chern numbers ($\\pm 1$) as well as trivial and gapless regimes. Conventional momentum-space analysis therefore predicts quantized Thouless-type spin pumping in parts of the Chern number diagram. However, real-space time evolution under open boundary conditions reveals that the spin transport is generally not quantized away from the isotropic limit. In the anisotropic regime, eigen-energy states within the transporting subspace hybridize during the driving cycle, leading to a transport that depends on details of the driving protocol. Quantized pumping and transport survive only in the isotropic limit, where the Hamiltonian reduces to decoupled Rice-Mele sectors and the transported spin component is conserved. Our results demonstrate that momentum-space topological invariants alone do not guarantee quantized spin transport in anisotropic spin chains. More broadly, they show that the conventional Thouless-pumping framework does not straightforwardly extend to situations where the transported quantity is not conserved, highlighting the importance of real-space diagnostics in topological transport phenomena.", "url": "https://arxiv.org/abs/2611.08385", "type": "理论", "summary": "我们研究了具有可调面内各向异性的二聚化自旋-$\\frac{1}{2}$ 各向异性 XY 链中拓扑自旋泵浦和传输的前景。通过 Jordan-Wigner 变换，该系统映射到扩展的 Rice-Mele 型费米子模型，其动量空间能带结构表现出以非零陈数 ($\\pm 1$) 为特征的有隙区域以及平凡且无间隙的区域。因此，传统的动量空间分析预测了陈数图部分中的量子化 Thouless 型自旋泵浦。然而，开放边界条件下的真实时空演化表明，自旋输运通常不会被量子化远离各向同性极限。在各向异性状态下，传输子空间内的本征能量状态在驾驶循环期间混合，导致取决于驾驶协议细节的传输。量子化的泵浦和传输仅在各向同性极限中存在，其中哈密顿量减少为解耦的莱斯-梅勒扇区，并且传输的自旋分量是守恒的。\n\n我们的结果表明，动量空间拓扑不变量本身并不能保证各向异性自旋链中的量子化自旋输运。更广泛地说，他们表明传统的无意识泵浦框架不能直接扩展到传输量不守恒的情况，这凸显了拓扑传输现象中实空间诊断的重要性。", "authors": [{"name": "Mainak Pal"}], "featured_authors": [{"name": "Mainak Pal"}], "author_count": 1}, {"id": "2611.08435", "category": "cond-mat", "title": "Trapping and Fracture of Particles in Three-Sphere Ball-Milling Collisions", "abstract": "We numerically investigate the collision and fracture processes of ball milling based on a minimal model of a three-sphere geometry using discrete element method (DEM) simulations combined with Christensen-type and Weibull-type normalized fracture criteria. The outcome of the brittle target particle (ejected versus trapped, fractured versus intact) depends on the impact geometry and velocity. We develop a reduced three-sphere collision description in which trapping is governed by impact geometry and friction, while fracture inside the trapping regime is evaluated from DEM output using stress-based and contact-force-based normalized criteria. The trapping regime follows a closed-form geometric condition, while the critical conditions for fracture vary with impact angle, obliquity angle, impact velocity, and particle size ratio. Head-on collisions with larger size ratios require lower critical impact velocities for fracture.", "url": "https://arxiv.org/abs/2611.08435", "type": "理论+数值", "summary": "我们使用离散元法（DEM）模拟结合克里斯滕森型和威布尔型归一化断裂准则，基于三球几何的最小模型，对球磨的碰撞和断裂过程进行了数值研究。脆性目标颗粒的结果（弹出与捕获、破裂与完整）取决于撞击的几何形状和速度。我们开发了一种简化的三球体碰撞描述，其中捕获由冲击几何形状和摩擦力控制，而捕获区域内的断裂则使用基于应力和基于接触力的归一化标准根据 DEM 输出进行评估。捕获机制遵循封闭式几何条件，而断裂的临界条件随冲击角、倾斜角、冲击速度和粒度比而变化。尺寸比较大的正面碰撞需要较低的断裂临界冲击速度。", "authors": [{"name": "Ziyi Cui"}, {"name": "Qiong Zhang"}, {"name": "Suwei Liu"}, {"name": "Richard M. Lueptow"}], "featured_authors": [{"name": "Ziyi Cui"}, {"name": "Qiong Zhang"}, {"name": "Suwei Liu"}, {"name": "Richard M. Lueptow"}], "author_count": 4}, {"id": "2611.08475", "category": "cond-mat", "title": "Direct transition from a fractional Chern insulator to a topological superconductor", "abstract": "We find numerical evidence for a direct continuous transition from a Laughlin fractional Chern insulator (FCI) to a $c_-=3/2$ topological superconductor (TSC), driven by increasing bandwidth at filling $\\nu=1/3$ in a repulsively interacting Chern band. At the critical point, the electron correlation length diverges at momentum away from the reference Fermi surface. We develop a generalized theory of superconducting-vortex proliferation for this transition. Magnetic translation organizes the vortices into six valleys, so translation-preserving proliferation requires additional gauge fields. The resulting theory reproduces the momentum structure of the critical spectrum and captures the divergent electron correlation. Upon doping away from commensurate filling, the theory gives rise to a superconducting dome. These results are consistent with an anyonic origin of the topological superconductivity in the absence of a weak-coupling Fermi-surface instability.", "url": "https://arxiv.org/abs/2611.08475", "type": "理论+数值", "summary": "我们发现了从劳克林分数陈绝缘体 (FCI) 到 $c_-=3/2$ 拓扑超导体 (TSC) 的直接连续转变的数值证据，这是由在排斥相互作用的陈氏带中填充 $\\nu=1/3$ 时增加的带宽驱动的。在临界点，电子相关长度在动量上发散远离参考费米面。我们为这种转变发展了超导涡扩散的广义理论。磁平移将漩涡组织成六个谷，因此保持平移的扩散需要额外的规范场。由此产生的理论再现了临界光谱的动量结构并捕获了发散电子相关性。当掺杂远离相应的填充时，该理论产生了超导圆顶。这些结果与在不存在弱耦合费米表面不稳定性的情况下拓扑超导性的任意子起源一致。", "authors": [{"name": "Taige Wang"}], "featured_authors": [{"name": "Taige Wang"}], "author_count": 1}, {"id": "2611.06999", "category": "hep-th", "title": "Matrix Theory from Holography II: Beyond Counting", "abstract": "Extending our earlier realization of Matrix Theory for M-theory within AdS/CFT, we propose and test a new triality among a large-charge sector of three-dimensional $\\mathcal N=4$ ADHM theory, the BMN matrix model, and lightlike-compactified M-theory on the maximally supersymmetric pp-wave. In an appropriate triple-scaling limit, the superconformal index of ADHM theory becomes the grand-canonical index of the BMN model, with magnetic-flux sectors corresponding to fuzzy-sphere vacua. But the real interest of this new setup is that we can go beyond counting states. Using supersymmetric localization, we show that correlation functions in topological subsectors agree as well, including their nontrivial dependence on the BMN coupling. In each magnetic-flux sector, both the localization measure and the operator insertions can be matched precisely with those of the corresponding BMN vacuum. Our results also point to a deeper connection between monopole bubbling in ADHM theory and instantons in the BMN model. For minuscule monopole charges, ADHM correlators map directly to topological correlators in the trivial BMN vacuum. For non-minuscule charges, monopole bubbling produces additional screened sectors, whose relative weights reproduce the classical actions of BMN instantons. Mirror symmetry offers another perspective on this structure, mapping the monopole operators to Higgs-branch ``winding\" operators in the mirror necklace theory. Finally, we discuss a type IIB counterpart, connecting a large-charge sector of four-dimensional $\\mathbb Z_K$-orbifold quiver theories, the DLCQ of type IIB string theory on the pp-wave, and level-one mass-deformed ABJM theory on $\\mathbb R_t\\times T^2$. As a first test, we show that the superconformal index of the orbifold theory reproduces the vacuum degeneracy of the mass-deformed ABJM theory.", "url": "https://arxiv.org/abs/2611.06999", "type": "理论", "summary": "扩展我们早期对 AdS/CFT 中 M 理论的矩阵理论的实现，我们提出并测试了三维 $\\mathcal N=4$ ADHM 理论、BMN 矩阵模型和最大超对称 pp 波上的光紧致 M 理论的大电荷扇区之间的新试验。在适当的三倍尺度限制下，ADHM理论的超共形指数成为BMN模型的大正则指数，磁通扇区对应于模糊球真空。但这个新设置的真正有趣之处在于我们可以超越计算状态。使用超对称定位，我们表明拓扑子扇区中的相关函数也一致，包括它们对 BMN 耦合的非平凡依赖。在每个磁通量扇区中，定位测量和操作员插入都可以与相应的 BMN 真空精确匹配。我们的结果还指出 ADHM 理论中的单极子冒泡与 BMN 模型中的瞬子之间存在更深层的联系。对于微小的单极子电荷，ADHM 相关器直接映射到平凡 BMN 真空中的拓扑相关器。\n\n对于非微小电荷，单极子冒泡会产生额外的屏蔽扇区，其相对权重再现了 BMN 瞬子的经典行为。镜像对称性为这种结构提供了另一种视角，将单极子算子映射到镜像项链理论中的希格斯分支“缠绕”算子。最后，我们讨论了 IIB 型对应物，连接了四维 $\\mathbb Z_K$ 轨道颤动理论的大电荷扇区、pp 波上的 IIB 型弦理论的 DLCQ 以及 $\\mathbb 上的一级质量变形 ABJM 理论R_t\\times T^2$ 作为第一个测试，我们证明轨道折叠理论的超共形指数再现了质量变形 ABJM 理论的真空简并性。", "authors": [{"name": "Shota Komatsu"}, {"name": "Eunwoo Lee"}, {"name": "Chintan Patel"}], "featured_authors": [{"name": "Shota Komatsu"}, {"name": "Eunwoo Lee"}, {"name": "Chintan Patel"}], "author_count": 3}, {"id": "2611.07000", "category": "hep-th", "title": "Multipartite Entanglement, TQFT Partition Functions and PL Bordism", "abstract": "In a previous work we conjectured that the multi-invariants of the ground state of a gapped $(d-1)+1$-dimensional system, labeled by bipartite $(d+1)$-edge-colored graphs encoding closed oriented $d$-manifolds $M$, compute the partition functions $Z(M)$ of the low energy topological quantum field theory (TQFT), up to non-universal factors determined by the local structure of the triangulation. In this paper we determine which combinations of partition functions can be isolated from the non-universal factors. The answer is governed by oriented bordism. If $M$ is null-bordant, $Z(M)$ is obtained from an explicit, state-independent finite family of multi-invariants, up to a power of $Z(S^d)$ which is fixed to be $Z(S^d)^{\\chi(M)/2}$ for even $d$ and can be removed for odd $d$. Conversely, the obstruction is measured by a quotient of the group of \"residues\" of colored graphs which receives a surjective map from the oriented bordism group, with kernel precisely the torsion subgroup as far as smooth manifolds are concerned. In $d=4$ the obstruction is the signature: $Z(M)/Z(S^4)^{\\chi(M)/2}$ can be extracted if and only if $\\sigma(M)=0$. This is due to the fact that the first Pontryagin class $p_1$ has a local expression and thus $e^{i\\theta\\sigma(M)}=e^{\\frac{i}{3}\\theta\\int_M p_1}$ cannot be separated from the non-universal factors. Torsion invariants, in contrast, are not obstructed: for the ground state of the $4+1$-dimensional invertible phase with partition function $(-1)^{\\int w_2w_3}$ we compute the multi-invariants exactly, and two graphs with identical local data, encoding the Dold manifold and $\\mathbb{CP}^2\\times S^1$, give opposite signs.", "url": "https://arxiv.org/abs/2611.07000", "type": "理论", "summary": "在之前的工作中，我们推测带隙 $(d-1)+1$ 维系统的基态多重不变量，由编码封闭导向 $d$-流形 $M$ 的二部 $(d+1)$-边缘彩色图标记，计算低能拓扑量子场论 (TQFT) 的配分函数 $Z(M)$，直至由三角剖分的局部结构确定的非通用因子。在本文中，我们确定哪些配分函数组合可以从非通用因素中分离出来。答案是受定向边界主义支配的。如果 $M$ 是零相关的，则 $Z(M)$ 是从显式的、与状态无关的有限多不变量族获得的，最高可达 $Z(S^d)$ 的幂，对于偶数 $d$ 固定为 $Z(S^d)^{\\chi(M)/2}$，对于奇数 $d$ 可以删除。相反，障碍物是通过彩色图的“残差”组的商来测量的，该组接收来自定向波函数群的满射映射，就光滑流形而言，核精确地是挠率子群。在$d=4$中，障碍是签名：$Z(M)/Z(S^4)^{\\chi(M)/2}$当且仅当$\\sigma(M)=0$时才能被提取。\n\n这是因为第一个 Pontryagin 类 $p_1$ 具有局部表达式，因此 $e^{i\\theta\\sigma(M)}=e^{\\frac{i}{3}\\theta\\int_M p_1}$ 无法与非通用因子分开。相比之下，扭转不变量则不受阻碍：对于具有配分函数 $(-1)^{\\int w_2w_3}$ 的 $4+1$ 维可逆相的基态，我们精确计算多重不变量，并且具有相同局部数据的两个图（编码 Dold 流形和 $\\mathbb{CP}^2\\times S^1$）给出相反的符号。", "authors": [{"name": "Michele Del Zotto"}, {"name": "Abhijit Gadde"}, {"name": "Pavel Putrov"}], "featured_authors": [{"name": "Michele Del Zotto"}, {"name": "Abhijit Gadde"}, {"name": "Pavel Putrov"}], "author_count": 3}, {"id": "2611.07001", "category": "hep-th", "title": "Fermion$\\text{-}$Monopole Scattering: A Unified Perspective", "abstract": "We revisit the scattering of massless chiral fermions by a minimally charged BPS 't Hooft-Polyakov monopole. Existing proposals emphasize different aspects of this process and their connections are often unclear, giving rise to apparent conflicts concerning the outgoing states, energy conservation, and anomalous scattering amplitudes. We clarify the connection between different proposals within a common low-energy fermion-rotor description. Starting from the monopole background, we derive the rotor coupling and retain explicit fermion operators throughout the analysis. By adjoining a decoupled auxiliary scalar, we construct a dual theory that permits exact quantization. We show that the rotor vertex has a continuous spectral support down to zero energy and that its infrared exchange relations identify it as the twist dressing of the outgoing fermion. We also compute anomalous fermion correlators directly from fermion zero modes generated by winding configurations of the compact rotor. These results connect rotor dynamics, twisted outgoing states, and the zero-mode origin of anomalous correlators, resolving apparent conflicts and showing how the existing proposals fit into a mutually consistent picture within their common regime of applicability.", "url": "https://arxiv.org/abs/2611.07001", "type": "理论", "summary": "我们重新审视了带最小电荷 BPS 't Hooft-Polyakov 单极子对无质量手性费米子的散射。现有的提案强调了这一过程的不同方面，而它们之间的联系往往不清楚，从而引起了有关传出态、能量守恒和异常散射幅度的明显冲突。我们在共同的低能费米子转子描述中阐明了不同提议之间的联系。从单极子背景开始，我们推导出转子耦合并在整个分析过程中保留显式费米子算子。通过连接一个解耦的辅助标量，我们构建了一个允许精确量化的对偶理论。我们证明转子顶点具有低至零能量的连续光谱支持，并且其红外交换关系将其识别为传出费米子的扭曲敷料。我们还直接从紧凑转子的绕组配置生成的费米子零模式计算反常费米子相关器。\n\n这些结果将转子动力学、扭曲的传出状态和反常相关器的零模式起源联系起来，解决了明显的冲突，并展示了现有的建议如何在其共同的适用范围内适应相互一致的情况。", "authors": [{"name": "Hao Geng"}, {"name": "Zekai Wang"}], "featured_authors": [{"name": "Hao Geng"}, {"name": "Zekai Wang"}], "author_count": 2}, {"id": "2611.07002", "category": "hep-th", "title": "Asymptotic safety is not generic", "abstract": "Asymptotically safe quantum gravity proposes a non-perturbative ultraviolet completion of gravity in which the high-energy behavior is controlled by an ultraviolet fixed point---the Reuter fixed point---for which there is robust evidence from a wide range of settings and truncations. The existence of asymptotic safety requires non-trivial zeros of beta functions, raising the question of how generic such fixed-point solutions are. In this work, we tackle this issue by investigating chiral perturbation theories. We focus on SU(2) and SU(3) chiral models, which share key features with gravity such as perturbative non-renormalizability or nonlinear interactions, but which are known to admit a different ultraviolet completion via new degrees of freedom. Using the functional renormalization group, we study these theories within a quartic-derivative truncation and find no evidence for an interacting fixed point. This result suggests that asymptotic safety is not generic, but rather a feature pertaining to certain special systems.", "url": "https://arxiv.org/abs/2611.07002", "type": "理论", "summary": "渐近安全量子引力提出了一种非微扰的紫外线完成引力，其中高能行为由紫外线固定点（路透固定点）控制，这方面有来自各种设置和截断的有力证据。渐近安全性的存在需要 beta 函数的非平凡零点，这就提出了这样的定点解的通用性如何的问题。在这项工作中，我们通过研究手性微扰理论来解决这个问题。我们重点关注 SU(2) 和 SU(3) 手性模型，它们与重力具有相同的关键特征，例如微扰不可重整性或非线性相互作用，但已知它们可以通过新的自由度实现不同的紫外完成。使用函数重整化群，我们在四次导数截断内研究这些理论，但没有发现相互作用不动点的证据。这一结果表明渐近安全性不是通用的，而是与某些特殊系统有关的特征。", "authors": [{"name": "Francesco Del Porro"}, {"name": "Francesco Ferrarin"}, {"name": "Alessia Platania"}], "featured_authors": [{"name": "Francesco Del Porro"}, {"name": "Francesco Ferrarin"}, {"name": "Alessia Platania"}], "author_count": 3}, {"id": "2611.07004", "category": "hep-th", "title": "Conformal Bootstrap Unblocked", "abstract": "We develop a novel conformal bootstrap formulated directly in terms of conformal symmetry, reflection positivity, and crossing symmetry, without explicitly relying on the operator product expansion or conformal blocks. By constructing Gram matrices from states created by pairs of local operators and imposing spectral constraints through conformal generators, we obtain a hierarchy of semidefinite programs that directly constrain correlation functions. We demonstrate the method in one to three dimensions, obtaining correlator and spectral bounds that capture generalized free field behavior and reproduce the characteristic Ising kinks in two and three dimensions. We further show that joint positivity of states at different insertion configurations naturally constrains correlators away from self-dual kinematics.", "url": "https://arxiv.org/abs/2611.07004", "type": "理论", "summary": "我们开发了一种新颖的共形引导程序，直接根据共形对称性、反射正性和交叉对称性制定，无需明确依赖算子乘积展开或共形块。通过根据局部算子对创建的状态构造 Gram 矩阵，并通过共形生成器施加谱约束，我们获得了直接约束相关函数的半定程序层次结构。我们在一维到三维中演示了该方法，获得了捕获广义自由场行为的相关器和谱界，并在二维和三维中再现了特征伊辛扭结。我们进一步表明，不同插入配置下状态的联合积极性自然会限制相关器远离自对偶运动学。", "authors": [{"name": "Li-Yuan Chiang"}, {"name": "David Poland"}], "featured_authors": [{"name": "Li-Yuan Chiang"}, {"name": "David Poland"}], "author_count": 2}, {"id": "2611.07010", "category": "hep-th", "title": "On Entanglement Dynamics in Holographic Theories", "abstract": "Entanglement entropy (EE) is central to modern theoretical physics, yet its calculation in interacting theories with nontrivial time dependence remains challenging. In this thesis, we investigate the real-time dynamics of EE in strongly coupled quantum field theories (QFTs) using the Anti-de Sitter/Conformal Field Theory (AdS/CFT) correspondence. We first examine EE evolution in an exactly solvable two-dimensional conformal field theory (CFT) with an inhomogeneous sine-square deformation (SSD). We argue that the unconventional time evolution driven by the SSD Hamiltonian can be viewed as a change in spacetime foliation, producing new horizons in the dual three-dimensional bulk. Holographic EE calculations agree with CFT results in all comparable cases. We then study entanglement dynamics in generic chaotic quantum many-body systems. In the limit of late time and large regions, these dynamics are believed to admit an effective entanglement membrane description. In 2d CFTs, a degenerate membrane tension reproduces several entropy dynamics results, unlike the non-degenerate tension in higher dimensions. Using holography, we show that capturing reflected entropy in 2d CFT requires an additional degree of freedom in the membrane description. We further show that a conventional non-degenerate tension emerges when the CFT undergoes a relevant deformation, holographically dual to a planar Banados-Teitelboim-Zanelli (BTZ) black hole with scalar hair and an interior Kasner universe. We then develop a membrane effective theory for reflected entropy dynamics in higher dimensions. Finally, we apply the membrane theories for reflected entropy to study the time evolution of multipartite entanglement signals. We found that scrambling dynamics generate multipartite entanglement with rich structures.", "url": "https://arxiv.org/abs/2611.07010", "type": "理论", "summary": "纠缠熵 (EE) 是现代理论物理学的核心，但其在具有非平凡时间依赖性的相互作用理论中的计算仍然具有挑战性。在本论文中，我们使用反德西特/共形场论 (AdS/CFT) 对应研究强耦合量子场论 (QFT) 中 EE 的实时动力学。我们首先在具有不均匀正弦平方变形 (SSD) 的精确可解二维共形场论 (CFT) 中研究 EE 演化。我们认为，SSD 哈密顿量驱动的非常规时间演化可以被视为时空叶状结构的变化，在双三维体中产生新的视野。在所有可比较的情况下，全息 EE 计算与 CFT 结果一致。然后我们研究通用混沌量子多体系统中的纠缠动力学。在晚期时间和大区域的限制下，这些动力学被认为允许有效的缠结膜描述。在 2d CFT 中，简并膜张力再现了多个熵动力学结果，这与更高维度中的非简并张力不同。\n\n使用全息术，我们表明在 2d CFT 中捕获反射熵需要膜描述中的额外自由度。我们进一步表明，当 CFT 经历相关变形时，会出现传统的非简并张力，该变形与具有标量毛发和内部 Kasner 宇宙的平面 Banados-Teitelboim-Zanelli (BTZ) 黑洞全息对偶。然后，我们开发了一种用于更高维度反射熵动力学的膜有效理论。最后，我们应用反射熵的膜理论来研究多部分纠缠信号的时间演化。我们发现置乱动力学会产生具有丰富结构的多部分纠缠。", "authors": [{"name": "Hanzhi Jiang"}], "featured_authors": [{"name": "Hanzhi Jiang"}], "author_count": 1}, {"id": "2611.07011", "category": "hep-th", "title": "Constraining the spectral gap of 2d CFTs just above c=1", "abstract": "We numerically study the space of compact unitary two-dimensional conformal field theories (2d CFTs) with central charge $c>1$ using the modular bootstrap. We focus on bounding the spectral gap $\\Delta_{\\rm gap}$ of such theories, namely the smallest scaling dimension among the non-vacuum primary operators. We use both a primal method that directly searches for consistent spectra and a dual method that yields rigorous exclusions. A key feature of our analysis is requiring the degeneracies of primary operators to be positive integers. At $c$ very near $1$, the integrality constraint greatly reduces the allowed spectral gap in both methods. For example, at $c-1 = 3\\times 10^{-3}$ integrality strengthens the rigorous bound from $\\Delta_{\\rm gap} \\lesssim 0.5$ to $\\Delta_{\\rm gap} < 0.041$. Our results suggest that the spectral gap might vanish as $c$ approaches $1$ from above.", "url": "https://arxiv.org/abs/2611.07011", "type": "理论", "summary": "我们使用模块化引导程序对中心电荷 $c>1$ 的紧凑酉二维共形场论 (2d CFT) 的空间进行数值研究。我们专注于限制此类理论的谱间隙$\\Delta_{\\rm间隙}$，即非真空主算子中的最小缩放维数。我们使用直接搜索一致光谱的原始方法和产生严格排除的双重方法。我们分析的一个关键特征是要求主算子的简并性为正整数。在 $c$ 非常接近 $1$ 时，完整性约束大大减少了两种方法中允许的谱间隙。例如，在 $c-1 = 3\\times 10^{-3}$ 时，完整性加强了从 $\\Delta_{\\rm gap} \\lesssim 0.5$ 到 $\\Delta_{\\rm gap} < 0.041$ 的严格界限。我们的结果表明，当 $c$ 从上方接近 $1$ 时，光谱间隙可能会消失。", "authors": [{"name": "Nathan Benjamin"}, {"name": "Kevin Langhoff"}, {"name": "Wei Li"}, {"name": "Jesse Thaler"}], "featured_authors": [{"name": "Nathan Benjamin"}, {"name": "Kevin Langhoff"}, {"name": "Wei Li"}, {"name": "Jesse Thaler"}], "author_count": 4}, {"id": "2611.07012", "category": "hep-th", "title": "Chern-Simons Interfaces and Minimal Models from Quantum Groups", "abstract": "Coupling two-dimensional fundamental Dirac fermions to $SU(N)_k$ Chern-Simons theory produces non-chiral interfaces that in the infrared flow to a compact boson and a $W_N$ minimal model. We propose a description of these interfaces as continuum limits of $q$-deformed fermion chains. The $q$-deformation is achieved by coupling a chain of one-dimensional fundamental complex fermions to $SU(N)_k$ Chern-Simons theory, keeping the underlying topological gauge field continuous. The operator algebra is controlled by quantum groups, which provide an algebraic perspective on the usual categorical formulation of anyon chains. As an application, we derive a Lieb-Schultz-Mattis constraint involving baryon-number and lattice translation, obstructing a unique symmetric gapped ground state. At unit filling, we gap out the compact boson sector with a Mott term and obtain standard anyon chain Hamiltonians previously studied in the literature. This provides an anomaly argument for the existence of $N$ copies of minimal model sectors permuted by lattice translation in the infrared.", "url": "https://arxiv.org/abs/2611.07012", "type": "理论", "summary": "将二维基本狄拉克费米子与 $SU(N)_k$ Chern-Simons 理论耦合产生非手性界面，该界面在红外流中流向紧致玻色子和 $W_N$ 最小模型。我们建议将这些界面描述为 $q$ 变形费米子链的连续极限。 $q$ 变形是通过将一维基本复费米子链耦合到 $SU(N)_k$ Chern-Simons 理论来实现的，从而保持基础拓扑规范场连续。算子代数由量子群控制，量子群为任意子链的通常分类公式提供了代数视角。作为一个应用，我们推导了一个涉及重子数和晶格平移的 Lieb-Schultz-Mattis 约束，阻碍了独特的对称带隙基态。在单位填充时，我们用莫特项间隙出紧致玻色子扇区，并获得先前在文献中研究的标准任意子链哈密顿量。这为存在由红外晶格平移排列的最小模型扇区的 $N$ 副本提供了一个异常论证。", "authors": [{"name": "Suriyah Rajalingam Kannagi"}, {"name": "Sergio Sanjurjo"}], "featured_authors": [{"name": "Suriyah Rajalingam Kannagi"}, {"name": "Sergio Sanjurjo"}], "author_count": 2}, {"id": "2611.07015", "category": "hep-th", "title": "Constraint Variance Identity and the Matter-Geometry Fluctuation Relation", "abstract": "The quantum Hamiltonian constraint vanishes for physical states. For separable Hamiltonians in minisuperspace, its vanishing variance yields a fundamental identity. Under the Born-Oppenheimer approximation, we derive the Matter-Geometry Fluctuation Relation, dynamically linking spacetime clock fluctuations to matter fluctuations. This establishes a quantitative stability condition for the clock against total quantum noise. Finally, we obtain an uncertainty relation between matter energy and relational time. The stable existence of spacetime thus demands quantum fluctuations in matter.", "url": "https://arxiv.org/abs/2611.07015", "type": "理论", "summary": "对于物理状态，量子哈密顿约束消失。对于微型超空间中的可分离哈密顿量，其方差消失产生了一个基本恒等式。在玻恩-奥本海默近似下，我们推导出物质-几何涨落关系，动态地将时空时钟涨落与物质涨落联系起来。这为时钟建立了针对总量子噪声的定量稳定性条件。最后，我们得到了物质能量与关系时间之间的不确定性关系。因此，时空的稳定存在需要物质的量子涨落。", "authors": [{"name": "Yuki Yokokura"}], "featured_authors": [{"name": "Yuki Yokokura"}], "author_count": 1}, {"id": "2611.07016", "category": "hep-th", "title": "Running Couplings in CP Violating Abelian Theories", "abstract": "We calculate the one- and two-loop running couplings for a massless photon coupled to dyons, including CP violating couplings. The electric and magnetic source vertices in the most general theory form a real coupling matrix $C$, while a current-current interaction depends on $C^T C$ and the quantized determinant $\\det C$. These determine, respectively, the continuously running Coulombic interactions and the fixed antisymmetric Dirac--Schwinger--Zwanziger charge quantization condition which also determines pairwise helicity. The running preserves $\\det C$, showing that the electric and magnetic couplings run inversely while every pairwise helicity remains constant. We comment on how the running of the CP-odd coupling $\\theta$ relates to physical CP violation, which also depends on the spectrum, mass phases, and threshold corrections. We also show that an invertible field redefinition moves the CP-odd coupling between the current source terms and the photon kinetic terms; these are two descriptions of the same local interaction. Finally, we show that the result agrees with the Argyres--Douglas $\\beta$ function ansatz.", "url": "https://arxiv.org/abs/2611.07016", "type": "理论", "summary": "我们计算了无质量光子与动力子耦合的一环和二环运行耦合，包括 CP 破坏耦合。最一般理论中的电源和磁源顶点形成实耦合矩阵$C$，而电流-电流相互作用取决于$C^T C$ 和量化行列式$\\det C$。它们分别决定了连续运行的库仑相互作用和固定的反对称狄拉克-施温格-兹万齐格电荷量子化条件，该条件也决定了成对螺旋性。运行保持 $\\det C$，表明电耦合和磁耦合相反，而每对螺旋度保持不变。我们评论了 CP 奇耦合 $\\theta$ 的运行如何与物理 CP 破坏相关，这也取决于谱、质量相位和阈值校正。我们还表明，可逆场的重新定义移动了电流源项和光子动力学项之间的 CP 奇耦合；这是对同一本地交互的两种描述。最后，我们证明结果与 Argyres--Douglas $\\beta$ 函数 ansatz 一致。", "authors": [{"name": "Joshua Newey"}, {"name": "John Terning"}, {"name": "Christopher B. Verhaaren"}], "featured_authors": [{"name": "Joshua Newey"}, {"name": "John Terning"}, {"name": "Christopher B. Verhaaren"}], "author_count": 3}, {"id": "2611.07019", "category": "hep-th", "title": "Charged AdS$_{3}$ black branes as marginally deformed two-dimensional CFTs", "abstract": "We study how boundary correlation functions encode the charge dependence of the renormalised Euclidean action of an AdS$_3$ black brane. In three-dimensional Einstein-Maxwell theory, the Maxwell field has logarithmic asymptotics and is locally dual to a massless pseudoscalar. In the canonical ensemble, the charge density fixes the slope of a spatially linear source for the dual marginal operator. At fixed temperature, the classical action is even in the charge density due to reflection symmetry $\\Phi\\to-\\Phi$, and its charge expansion coefficients are governed by Catalan numbers. We compute the quadratic and quartic terms from connected correlation functions around the neutral brane. The scalar two-point function and the shift symmetry of its source determine the matter Weyl anomaly, which fixes the logarithmic temperature dependence of the quadratic term in the charge expansion. At quartic order, the connected four-point function comes from tree-level graviton exchange. Integrating it against the linear source, with an infrared cutoff on the overall scale of the integral, reproduces the quartic coefficient of the action per unit length. At each higher order, the corresponding Catalan coefficient predicts the integrated sum of all connected tree-level Witten diagrams.", "url": "https://arxiv.org/abs/2611.07019", "type": "理论", "summary": "我们研究边界相关函数如何编码 AdS$_3$ 黑膜重整化欧几里得作用的电荷依赖性。在三维爱因斯坦-麦克斯韦理论中，麦克斯韦场具有对数渐近性，并且与无质量赝标量局部对偶。在规范系综中，电荷密度固定了对偶边缘算子的空间线性源的斜率。在固定温度下，由于反射对称性 $\\Phi\\to-\\Phi$，经典作用在电荷密度上是均匀的，并且其电荷膨胀系数由 Catalan 数控制。我们根据中性膜周围的连接相关函数计算二次项和四次项。标量两点函数及其源的位移对称性决定了物质Weyl异常，它固定了电荷膨胀中二次项的对数温度依赖性。在四次阶上，连接的四点函数来自树级引力子交换。将其与线性源积分，并在积分的整体尺度上进行红外截止，再现每单位长度作用的四次系数。\n\n在每个更高阶，相应的加泰罗尼亚系数预测所有连接的树级维滕图的积分和。", "authors": [{"name": "Suting Zhao"}, {"name": "Gabriel Arenas-Henriquez"}, {"name": "Yizhou Lu"}, {"name": "Hamed Adami"}, {"name": "René Meyer"}], "featured_authors": [{"name": "Suting Zhao"}, {"name": "Gabriel Arenas-Henriquez"}, {"name": "Yizhou Lu"}, {"name": "Hamed Adami"}, {"name": "René Meyer"}], "author_count": 5}, {"id": "2611.07026", "category": "hep-th", "title": "Finite is not enough: Triviality bounds in nonlocal field theories", "abstract": "An ultraviolet-finite theory need not be ultraviolet complete. This observation weakens the case for spacetime discreteness in quantum gravity if that case rests on removing ultraviolet divergences alone. We arrive at this observation by deriving the one-loop momentum-subtraction flow in four-dimensional $\\phi^4$ theories with ultraviolet-suppressing form factors. The suppression freezes the running above the nonlocality scale, but the theory can hit a Landau pole before suppression sets in. We obtain a bound on the infrared coupling by requiring perturbative control at all scales. This bound varies only at the percent level across the examples we consider. We expect similar bounds in models of discrete spacetime. Thus, requiring ultraviolet completeness improves the predictivity of nonlocal theories.", "url": "https://arxiv.org/abs/2611.07026", "type": "理论", "summary": "紫外有限理论不一定是紫外完备的。如果量子引力中的时空离散性仅依赖于消除紫外线发散，那么这一观察结果就削弱了这种情况。我们通过推导具有紫外线抑制形状因子的四维 $\\phi^4$ 理论中的单环动量减流来得出这一观察结果。抑制冻结了非定域尺度以上的运行，但该理论可以在抑制开始之前达到朗道极点。我们通过在所有尺度上要求微扰控制来获得红外耦合的界限。在我们考虑的示例中，这个界限仅在百分比水平上有所变化。我们期望离散时空模型中存在类似的界限。因此，要求紫外线完整性可以提高非局域理论的预测能力。", "authors": [{"name": "Fabian Wagner"}], "featured_authors": [{"name": "Fabian Wagner"}], "author_count": 1}, {"id": "2611.07057", "category": "hep-th", "title": "Minimal massive completions of partially broken higher-spin models", "abstract": "The partially broken Fronsdal (PBF) model describes massless particles of arbitrary integer spin $s$ with a gauge symmetry smaller than Fronsdal's, and differs from it only by the coefficient $c$ of the term $(\\p\\cdot h')^2$. We ask whether it admits a genuinely new massive completion. Adding a mass term and the most general local auxiliary sector with at most two derivatives, and demanding that all lower-spin sectors be non-dynamical, we show that for $s=3$ a single auxiliary scalar is never enough, while two scalars give a solution unique up to field redefinitions: one scalar is algebraic and its elimination exactly undoes the deformation, while the other is the auxiliary scalar of the Aragone--Deser--Yang (ADY) model. The same mechanism, with an algebraic vector, appears for $s=4$ and extends to arbitrary spin, and we conjecture that the resulting auxiliary content is minimal. In this minimal completion $c$ does not survive the mass: the correlation functions of $h$ coincide with those of the ADY model. For the Skvortsov--Vasiliev (SV) model, which belongs to the same family, we construct a massive version in which the Weyl-like symmetry survives the mass, and show that its auxiliary sector is fixed by the absence of lower-spin modes, within a general ansatz for $s=3$ and within a restricted one for $s=4$. For the partially broken SV model we obtain instead a massive completion which requires no auxiliary field beyond those of the massive SV model, and in which $c$ survives the mass through the same contact term as in the massless theory.", "url": "https://arxiv.org/abs/2611.07057", "type": "理论", "summary": "部分破碎的 Fronsdal (PBF) 模型描述了任意整数自旋 $s$ 的无质量粒子，其规范对称性小于 Fronsdal 的模型，与它的区别仅在于项 $(\\p\\cdot h')^2$ 的系数 $c$。我们询问它是否承认一个真正新的大规模竣工。添加一个质量项和最多具有两个导数的最一般的局部辅助扇区，并要求所有低自旋扇区都是非动态的，我们表明，对于 $s=3$，单个辅助标量是远远不够的，而两个标量给出了直到场重新定义为止唯一的解：一个标量是代数的，它的消除完全消除了变形，而另一个是 Aragone-Deser-Yang (ADY) 模型的辅助标量。具有代数向量的相同机制出现在 $s=4$ 并扩展到任意旋转，我们推测所得的辅助内容是最小的。在这个最小完成中，$c$ 无法幸存：$h$ 的相关函数与 ADY 模型的相关函数一致。\n\n对于属于同一家族的 Skvortsov-Vasiliev (SV) 模型，我们构建了一个大规模版本，其中类 Weyl 对称性在质量中幸存下来，并表明其辅助扇区由于缺乏低自旋模式而被固定，在 $s=3$ 的一般拟像中和 $s=4$ 的受限拟像中。对于部分破碎的 SV 模型，我们获得了一个大规模完成，除了大规模 SV 模型之外，不需要任何辅助场，并且其中 $c$ 通过与无质量理论中相同的接触项而在质量中幸存下来。", "authors": [{"name": "E. L. Mendonça"}, {"name": "M. I. C. Maués"}], "featured_authors": [{"name": "E. L. Mendonça"}, {"name": "M. I. C. Maués"}], "author_count": 2}, {"id": "2611.07178", "category": "hep-th", "title": "On a Dual Heterotic Kodaira-Spencer Theory", "abstract": "We consider a dual version of heterotic Kodaira-Spencer theory on a Calabi-Yau three-fold $X$ with background fluxes, related to the type I BCOV theory of Costello-Li. We implement the Green-Schwarz mechanism of Costello-Li, where the Beltrami differential plays the role of the Green-Schwarz field. On a compact Calabi-Yau three-fold with background gauge fluxes $F$, where $\\mathrm{tr}(F^2)$ is trivial in cohomology, retaining gauge anomalies only and leaving gravitational anomalies to future work, we incorporate the Costello-Li Green-Schwarz mechanism into the classical deformation complex. This gives a theory governed by a nilpotent operator $\\bar D$ on $Q=T^{1,0}X\\oplus\\operatorname{End}(V)\\oplus T^{*1,0}X$, whose extension maps carry holomorphic derivatives, so that $(Q,\\bar D)$ is not a holomorphic bundle. Using diagonal $\\bar\\partial^\\dagger$-gauge, the one-loop gauge anomaly cancels, assuming that the extension maps of $\\bar D$ do not modify it, which we argue is plausible. Introducing an auxiliary $(0,2)$-form, we construct a cubic interacting theory whose gauge symmetries are governed by an $L_3$ algebra. On compact Calabi-Yau three-folds, and for sufficiently small fields, we show that the equation of motion is equivalent to the Maurer-Cartan equation, together with a divergence-free constraint on the Beltrami differential. Finally we trivialise $\\bar D$ locally to the Dolbeault operator. The (non-tensorial) transition maps glue into a quasi-holomorphic extension sheaf $\\widetilde{\\mathscr{Q}}$, for which we prove a Dolbeault theorem, $H^{0,q}_{\\bar D}(Q)\\cong\\check H^q(\\widetilde{\\mathscr{Q}})$.", "url": "https://arxiv.org/abs/2611.07178", "type": "理论", "summary": "我们考虑具有背景通量的 Calabi-Yau 三倍 $X$ 上杂种 Kodaira-Spencer 理论的双重版本，与 Costello-Li 的 I 型 BCOV 理论相关。我们实现了 Costello-Li 的格林-施瓦茨机制，其中贝尔特拉米微分扮演了格林-施瓦茨场的角色。在具有背景规范通量 $F$ 的紧凑 Calabi-Yau 三重模型上，其中 $\\mathrm{tr}(F^2)$ 在上同调中是微不足道的，仅保留规范异常并将引力异常留给未来的工作，我们将 Costello-Li Green-Schwarz 机制合并到经典变形复合体中。这给出了由 $Q=T^{1,0}X\\oplus\\operatorname{End}(V)\\oplus T^{*1,0}X$ 上的幂零算子 $\\bar D$ 控制的理论，其扩展映射带有全纯导数，因此 $(Q,\\bar D)$ 不是全纯丛。使用对角 $\\bar\\partial^\\dagger$-gauge，单环规范异常被取消，假设 $\\bar D$ 的扩展映射不会修改它，我们认为这是合理的。引入辅助 $(0,2)$ 形式，我们构建了一个三次相互作用理论，其规范对称性由 $L_3$ 代数控制。\n\n在紧凑的 Calabi-Yau 三重方程上，对于足够小的场，我们证明运动方程等​​效于 Maurer-Cartan 方程，以及贝尔特拉米微分上的无散度约束。最后，我们将 $\\bar D$ 本地化为 Dolbeault 运算符。 （非张量）过渡映射粘合到准全纯扩展束 $\\widetilde{\\mathscr{Q}}$ 中，为此我们证明了 Dolbeault 定理 $H^{0,q}_{\\bar D}(Q)\\cong\\check H^q(\\widetilde{\\mathscr{Q}})$。", "authors": [{"name": "Siddhartha Mangamuri"}, {"name": "Eirik Eik Svanes"}, {"name": "Anuthi Tiwary"}], "featured_authors": [{"name": "Siddhartha Mangamuri"}, {"name": "Eirik Eik Svanes"}, {"name": "Anuthi Tiwary"}], "author_count": 3}, {"id": "2611.07180", "category": "hep-th", "title": "In light of the Henneaux-Teitelboim action", "abstract": "We construct an action similar to the Henneaux-Teitelboim action on a six dimensional Lorentzian manifold where the time direction is chosen to be lightlike and generated by a conformal lightlike Killing vector $U$. We show that such an action exists only if there is another commuting light-like conformal Killing vector $V$ with properties that can be realized by the Dirac currents of two conformal Killing spinors. We extend the action to the $(1,0)$ supersymmetric tensor multiplet.", "url": "https://arxiv.org/abs/2611.07180", "type": "理论", "summary": "我们在六维洛伦兹流形上构建了一个类似于 Henneaux-Teitelboim 作用的作用，其中时间方向选择为类光方向，并由共形类光 Killing 向量 $U$ 生成。我们证明，只有当存在另一个类似通勤光的共形杀伤矢量 $V$ 时，这种作用才存在，并且其属性可以通过两个共形杀伤旋量的狄拉克电流来实现。我们将作用扩展到 $(1,0)$ 超对称张量多重态。", "authors": [{"name": "Andreas Gustavsson"}], "featured_authors": [{"name": "Andreas Gustavsson"}], "author_count": 1}, {"id": "2611.07186", "category": "hep-th", "title": "Instantons from geometry in M2-brane sphere partition functions", "abstract": "Can the geometry transverse to M2-branes capture effects that are exponentially small in their three-sphere ($S^3$) partition function? We investigate this question by extending beyond constant maps the proposal that M2-brane observables are encoded by equivariant topological strings on the transverse Calabi-Yau fourfold (CY$_4$). Our central object is the disk partition function of the CY$_4$ gauged linear sigma model, a quantum generalization of the equivariant volume. After a Gamma-function normalization and a Mellin transform, it reproduces the complete leading WKB grand potential in the examples admitting a suitable Fermi-gas description, including the R-charge and mass deformations compatible with that description. In particular, the transform recovers membrane-instanton series even for $\\mathbb{C}^4$, which has no compact curves. For resolved CY$_4$ cones with compact curves, the match requires a quantum refinement of the classical mesonic constraint. We establish the exact equalities of the corresponding dressed disk partition functions with the classical spectral traces for ABJM, ADHM and a representative set of flavored M2-brane quiver theories. Away from the deformation loci where this match can be established, the same construction yields geometric predictions for the membrane-instanton sector that remain to be tested.", "url": "https://arxiv.org/abs/2611.07186", "type": "理论", "summary": "横向于 M2 膜的几何结构能否捕捉到其三球 ($S^3$) 配分函数中呈指数级减小的效应？我们通过超越常量映射来研究这个问题，提出 M2 膜可观测量由横向 Calabi-Yau 四重 (CY$_4$) 上的等变拓扑弦编码。我们的中心对象是 CY$_4$ 测量线性西格玛模型的磁盘分区函数，这是等变体积的量子推广。经过伽马函数归一化和梅林变换后，它在接受合适的费米气体描述的示例中再现了完整的领先 WKB 大势，包括与该描述兼容的 R 电荷和质量变形。特别是，即使对于没有紧凑曲线的 $\\mathbb{C}^4$，该变换也能恢复膜瞬时级数。对于具有紧凑曲线的解析 CY$_4$ 锥体，匹配需要对经典介子约束进行量子细化。我们利用 ABJM、ADHM 的经典谱迹和一组代表性的 M2 膜颤动理论建立了相应的修饰盘配分函数的精确等式。\n\n远离可以建立这种匹配的变形轨迹，相同的结构产生了膜瞬时扇区的几何预测，该预测仍有待测试。", "authors": [{"name": "Kiril Hristov"}, {"name": "Ali Mert Yetkin"}], "featured_authors": [{"name": "Kiril Hristov"}, {"name": "Ali Mert Yetkin"}], "author_count": 2}, {"id": "2611.07312", "category": "hep-th", "title": "Background Effects on Thermal Free Energy in Conformal Field Theories", "abstract": "We compute background corrections to the thermal free energy of free conformal field theories (CFTs) with a global abelian symmetry defined on a box with all sides infinitely long by turning on a flat gauge field in general dimensions. This result is applied to the U(N) maximally supersymmetric Yang-Mills theory, the ABJ(M) theory, and the free U(N) vector model in four, three, and two spacetime dimensions, respectively. In these examples, the thermal free energies monotonically increase as the background field does, and cross a zero within the valid range. We argue that the systems undergo a phase transition at the zero, where the effective degrees of freedom fall off similarly to the color-confinement one, and that it always occurs if the number of matter fields is greater than a critical value. We comment for this phase transition to circumvent the Mermin-Wagner-Coleman theorem in two spacetime dimensions.", "url": "https://arxiv.org/abs/2611.07312", "type": "理论", "summary": "我们通过打开一般尺寸的平坦规范场，计算自由共形场论（CFT）的热自由能的背景校正，该理论具有在所有边无限长的盒子上定义的全局阿贝尔对称性。该结果分别应用于四维、三维和二时空维度的 U(N) 最大超对称 Yang-Mills 理论、ABJ(M) 理论和自由 U(N) 矢量模型。在这些示例中，热自由能随着背景场单调增加，并在有效范围内过零。我们认为，系统在零处经历相变，其中有效自由度的下降与颜色限制类似，并且如果物质场的数量大于临界值，这种情况总是会发生。我们对这一相变进行评论是为了在两个时空维度上规避 Mermin-Wagner-Coleman 定理。", "authors": [{"name": "Shuichi Yokoyama"}, {"name": "Ibuki Yoshida"}, {"name": "Hiroki Yunoto"}], "featured_authors": [{"name": "Shuichi Yokoyama"}, {"name": "Ibuki Yoshida"}, {"name": "Hiroki Yunoto"}], "author_count": 3}, {"id": "2611.07376", "category": "hep-th", "title": "Non-symmetric integral geometry: alternative reconstruction procedure with dual Radon transform", "abstract": "In the note, we use the principles of non-symmetric integral geometry (non-integral geometry), related to the non-symmetric restricted integration measure, to extend the well-known relations traced from the Fourier slice theorem and the dual Radon transform. The proposed generalization is a very useful for the alternative restoration of the outset function. The latter impacts entirely on the image reconstruction process. The derived relations confirm the complexity of the inversion operator thanks for the symmetry breaking of integration measure.", "url": "https://arxiv.org/abs/2611.07376", "type": "理论", "summary": "在笔记中，我们使用与非对称限制积分测度相关的非对称积分几何（non-integral Geometry）的原理，来扩展从傅里叶切片定理和对偶Radon变换追溯到的众所周知的关系。所提出的泛化对于初始函数的替代恢复非常有用。后者完全影响图像重建过程。由于积分测度的对称性破缺，导出的关系证实了反演算子的复杂性。", "authors": [{"name": "I.V. Anikin"}], "featured_authors": [{"name": "I.V. Anikin"}], "author_count": 1}, {"id": "2611.07389", "category": "hep-th", "title": "Improved method for extracting low-energy expansion from OPE in mass-gapped theories", "abstract": "Recently, Takaura proposed a new method for extracting the first nonzero coefficient of the low-energy expansion of an observable from its operator product expansion (OPE) in asymptotically free theories with a mass gap and a single threshold. The method uses a weight function to suppress the contribution of the ``duality-violation'' (DV) term that arises when relating the OPE to the low-energy expansion. We extend this method to low-energy expansion coefficients at arbitrary orders. We present two approaches: Method I uses weight functions that isolate the coefficients of low-energy expansion from the OPE. Method II subtracts the DV contribution from the OPE before the extraction. Applying these methods to the two-dimensional large-$N$ $O(N)$ nonlinear sigma model, we find that both methods successfully reconstruct higher-order low-energy expansion coefficients.", "url": "https://arxiv.org/abs/2611.07389", "type": "理论", "summary": "最近，Takaura 提出了一种新方法，用于从具有质量间隙和单一阈值的渐近自由理论中的算子乘积展开（OPE）中提取可观测量低能展开的第一个非零系数。该方法使用权重函数来抑制将 OPE 与低能膨胀相关时出现的“对偶性破坏”(DV) 项的贡献。我们将此方法扩展到任意阶的低能膨胀系数。我们提出两种方法： 方法 I 使用权重函数将低能膨胀系数与 OPE 隔离。方法 II 在提取之前从 OPE 中减去 DV 贡献。将这些方法应用于二维大$N$$O(N)$非线性西格玛模型，我们发现这两种方法都成功地重建了高阶低能量展开系数。", "authors": [{"name": "Hajime Furuta"}, {"name": "Yukinari Sumino"}], "featured_authors": [{"name": "Hajime Furuta"}, {"name": "Yukinari Sumino"}], "author_count": 2}, {"id": "2611.07394", "category": "hep-th", "title": "$1/N$ corrections to $\\langle TJJ\\rangle$ and $\\langle TTT\\rangle$ in the critical $O(N)$ vector and Gross--Neveu--Yukawa models", "abstract": "We compute the subleading corrections in the $1/N$ expansion of the three-point functions $\\langle TJJ\\rangle$ and $\\langle TTT\\rangle$ in the three-dimensional critical $O(N)$ vector and Gross--Neveu--Yukawa models. We determine the coefficients of the two parity-even conformal structures and the corresponding conformal collider parameters. The calculation uses an expansion of momentum-space Feynman diagrams in a soft external momentum, together with the contact terms required by background gauge and metric sources. The sums of the structure coefficients reproduce the known current and stress-tensor two-point normalizations. We also compute these coefficients independently using the metric and mixed metric--gauge derivatives of the sphere free energy. Extrapolating the large $N$ results to the $O(2)$ vector model yields reasonably good agreement with recent numerical bootstrap bounds. At $N=2$, our $\\gamma$ and $t_4$ predictions lie within the joint bootstrap region under weaker spectral assumptions; their deviations from the more restrictive interval midpoints are only $3.28\\%$ and $4.44\\%$, respectively. We discuss the implications for energy flux, high-frequency conductivity, and shear response near quantum criticality.", "url": "https://arxiv.org/abs/2611.07394", "type": "理论", "summary": "我们计算了三维临界 $O(N)$ 向量和 Gross--Neveu--Yukawa 模型中三点函数 $\\langle TJJ\\rangle$ 和 $\\langle TTT\\rangle$ 的 $1/N$ 展开中的次领先修正。我们确定了两个奇偶偶共形结构的系数和相应的共形对撞机参数。该计算使用软外部动量中动量空间费曼图的扩展，以及背景规范和度量源所需的接触项。结构系数的总和再现了已知的电流和应力张量两点归一化。我们还使用球体自由能的度量和混合度量规范导数独立计算这些系数。将较大的 $N$ 结果外推到 $O(2)$ 向量模型与最近的数值引导边界相当吻合。在 $N=2$ 时，我们的 $\\gamma$ 和 $t_4$ 预测位于较弱谱假设下的联合引导区域内；它们与更严格的区间中点的偏差分别仅为 $3.28\\%$ 和 $4.44\\%$。\n\n我们讨论了量子临界点附近的能量通量、高频电导率和剪切响应的影响。", "authors": [{"name": "Yongwei Guo"}, {"name": "Zhijin Li"}], "featured_authors": [{"name": "Yongwei Guo"}, {"name": "Zhijin Li"}], "author_count": 2}, {"id": "2611.07455", "category": "hep-th", "title": "Worldsheet skeins and block decomposition of quivers", "abstract": "Following the knot-quiver correspondence, we investigate quiver counterparts of the HOMFLYPT skein relations by interpreting link invariants in terms of holomorphic worldsheets and their multicover contributions. Extending this framework to more general worldsheet geometries, we conjecture that, up to quiver equivalence, the adjacency matrix of the quiver associated with any link in a skein triple admits a block decomposition whose diagonal blocks are quiver adjacency matrices associated with the other two links. We verify this conjecture in numerous examples.", "url": "https://arxiv.org/abs/2611.07455", "type": "理论", "summary": "遵循结-箭袋对应关系，我们通过解释全纯世界表及其多重覆盖贡献的链接不变量来研究 HOMFLYPT 绞丝关系的箭袋对应物。将这个框架扩展到更一般的世界表几何形状，我们推测，直到箭袋等价，与绞纱三元组中的任何链接相关联的箭袋的邻接矩阵都允许块分解，其对角块是与其他两个链接相关联的箭袋邻接矩阵。我们通过大量例子验证了这个猜想。", "authors": [{"name": "Sachin Chauhan"}, {"name": "Piotr Kucharski"}, {"name": "Lukas Nakamura"}, {"name": "Dmitry Noshchenko"}, {"name": "Ramadevi Pichai"}, {"name": "Vivek Kumar Singh"}, {"name": "Marko Stošić"}], "featured_authors": [{"name": "Sachin Chauhan"}, {"name": "Piotr Kucharski"}, {"name": "Lukas Nakamura"}, {"name": "Ramadevi Pichai"}, {"name": "Vivek Kumar Singh"}, {"name": "Marko Stošić"}], "author_count": 7}, {"id": "2611.07547", "category": "hep-th", "title": "The logarithm construction and (super) Weyl anomalies", "abstract": "We apply the logarithm construction of higher-derivative conformal primary (super) fields proposed by Butter et al. to derive simple Wess-Zumino actions for: (i) Weyl anomalies in arbitrary even dimensions; (ii) $\\mathcal{N} =1$ and $\\mathcal{N}=2$ super-Weyl anomalies in four dimensions; and (iii) $(p,q)$ super-Weyl anomalies in two dimensions, with $p,q \\leq 2$.", "url": "https://arxiv.org/abs/2611.07547", "type": "理论", "summary": "我们应用 Butter 等人提出的高导数共形主（超）场的对数构造。导出简单的 Wess-Zumino 动作： (i) 任意偶数维度中的 Weyl 异常； (ii) $\\mathcal{N} =1$ 和 $\\mathcal{N}=2$ 四个维度的超外尔异常； (iii) $(p,q)$ 二维超 Weyl 异常，其中 $p,q \\leq 2$。", "authors": [{"name": "Sergei M. Kuzenko"}], "featured_authors": [{"name": "Sergei M. Kuzenko"}], "author_count": 1}, {"id": "2611.07557", "category": "hep-th", "title": "ADE Quiver Duality Proposals: Graph Classification and Nodewise Realizations", "abstract": "We use the large-$N$ index strategy to find new quiver dualities in four-dimensional $\\mathcal N=1$ quiver gauge theories. We study gauge quivers with or without an adjoint field at each gauge node, and bifundamental matter between selected nodes with fixed $R$-charges. Imposing the finite-meson condition restricts the allowed gauge graphs to finite ADE diagrams and leads to a new simultaneous duality for ADE quivers. We present an explicit superpotential that produces a uniform classical meson spectrum consistent with the large-$N$ index approach's prediction. We then relate the simultaneous rank transformation to the longest element of the ADE Weyl group, whose reduced expressions organize nodewise duality sequences realizing the simultaneous ADE duality. Realizing the simultaneous ADE duality through such nodewise sequences offers a finite-$N$ consistency check beyond the large-$N$ index construction. Moreover, we realize the simultaneous ADE duality as a sequence of subquiver simultaneous dualities.", "url": "https://arxiv.org/abs/2611.07557", "type": "理论", "summary": "我们使用大$N$索引策略在四维$\\mathcal N=1$箭袋规范理论中寻找新的箭袋对偶性。我们研究每个规范节点处有或没有伴随场的规范颤动，以及具有固定 $R$ 费用的选定节点之间的双基本问题。施加有限介子条件将允许的规范图限制为有限 ADE 图，并导致 ADE 箭袋产生新的同时对偶性。我们提出了一个显式超势，它产生与大 $N$ 指数方法的预测一致的均匀经典介子谱。然后，我们将联立秩变换与 ADE Weyl 群的最长元素联系起来，其简化表达式组织节点对偶序列，实现联立 ADE 对偶性。通过这种节点序列实现同时 ADE 对偶性，提供了超出大 $N$ 索引构造的有限 $N$ 一致性检查。此外，我们将同时 ADE 对偶性实现为一系列 subquiver 同时对偶性。", "authors": [{"name": "Yuanyuan Fang"}], "featured_authors": [{"name": "Yuanyuan Fang"}], "author_count": 1}, {"id": "2611.07635", "category": "hep-th", "title": "Quantum action for heterotic string field theory with quantum L-infinity structure", "abstract": "We construct a quantum action for heterotic string field theory that satisfies the quantum Batalin-Vilkovisky equation. Assuming a triangulation of the bosonic moduli space, the prescription for inserting picture-changing operators is determined based on a quantum L-infinity structure. After concretely constructing some of the lower-order interactions, we propose a general prescription, which generalizes that for constructing the classical interactions governed by a classical L-infinity structure. Assuming it does not suffer from spurious poles, all quantum interactions are determined by iteratively solving differential equations and transforming the solutions via IBL-infinity-transfer. To demonstrate the consistency of our prescription, we compute the one-loop two-point functions (modulo the spurious pole issue) and show that they agree with those in the first-quantized formulation.", "url": "https://arxiv.org/abs/2611.07635", "type": "理论", "summary": "我们构建了满足量子 Batalin-Vilkovisky 方程的异质弦场论的量子作用。假设玻色子模空间的三角测量，插入图像改变算子的规定是基于量子L-无穷大结构确定的。在具体构造一些低阶相互作用之后，我们提出了一个通用的规定，它概括了构造由经典 L-无穷大结构控制的经典相互作用。假设它不存在杂散极点，则所有量子相互作用都是通过迭代求解微分方程并通过 IBL 无穷传递变换解来确定的。为了证明我们的规定的一致性，我们计算单环两点函数（以杂散极点问题为模）并表明它们与第一量化公式中的一致。", "authors": [{"name": "Yasu Gen"}, {"name": "Hiroshi Kunitomo"}, {"name": "Jojiro Totsuka"}], "featured_authors": [{"name": "Yasu Gen"}, {"name": "Hiroshi Kunitomo"}, {"name": "Jojiro Totsuka"}], "author_count": 3}, {"id": "2611.07637", "category": "hep-th", "title": "Topological Characterization of Adinkra Heights", "abstract": "Adinkras are highly structured bipartite graphs that encapsulate 1D supersymmetry representations. We classify hypercube Adinkra heights with one, two, three or four edge colors using a graph-theoretic notion of equivalence. For the 990 distinct height functions in the case of four edge colors, we show that these classes match modified twisted character classes bijectively and provide a finer classification than spectral Height Yielding Matrix Numbers (HYMNs). We also relate our classification to the physics of the two-dimensional chiral and twisted chiral supermultiplets.", "url": "https://arxiv.org/abs/2611.07637", "type": "理论", "summary": "Adinkras 是高度结构化的二部图，封装了一维超对称表示。我们使用图论等价概念对超立方体 Adinkra 高度进行一种、两种、三种或四种边缘颜色的分类。对于四种边缘颜色情况下的 990 个不同高度函数，我们表明这些类双射匹配修改的扭曲字符类，并提供比光谱高度生成矩阵数 (HYMN) 更精细的分类。我们还将我们的分类与二维手性和扭曲手性超多重态的物理联系起来。", "authors": [{"name": "Amanda E. Francis"}, {"name": "S. James Gates Jr."}, {"name": "Digvijay Roy Varier"}, {"name": "Ursula A. Whitcher"}], "featured_authors": [{"name": "Amanda E. Francis"}, {"name": "S. James Gates Jr."}, {"name": "Digvijay Roy Varier"}, {"name": "Ursula A. Whitcher"}], "author_count": 4}, {"id": "2611.07897", "category": "hep-th", "title": "The Mass Gap Approach to QCD. III. Solution of the gluon confinement problem", "abstract": "We present reports on progress in the solution of the gluon confinement problem and in the explanation of the scale breaking in the asymptotic freedom regime in QCD. It is based on the previously formulated the mass gap approach to QCD, which sheds the light on a mass origin in its ground state. We have established the exact expression for the full gluon propagator. One of its solution allows to sum up all the severe (more singular than $1/q^2$) infrared singularities which can be accommodated by a single full gluon propagator. In order to correctly treat them, we have developed a formalism of the joint use of the theory of functions of complex variable, and the dimensional regularization method correctly implemented into the theory of distributions. Despite the presence of the mass gap, gluons remain massless. Our solution satisfies the two boundary conditions: it dominates over all other possible solutions at large distances but itself prevents gluons to appear in the physical spectrum. It possesses the asymptotic freedom behaviour at short distances. We discuss the connection of our results to the Elitzur's theorem.", "url": "https://arxiv.org/abs/2611.07897", "type": "理论", "summary": "我们报告了解决胶子禁闭问题的进展以及解释 QCD 渐近自由体系中的尺度破缺的进展。它基于先前制定的 QCD 质量间隙方法，该方法揭示了基态的质量起源。我们已经建立了完整胶子传播子的精确表达式。它的解决方案之一可以总结所有严重的（比 $1/q^2$ 更奇异的）红外奇点，这些奇点可以由单个全胶子传播器容纳。为了正确地对待它们，我们发展了一种联合使用复变函数理论的形式体系，并将维数正则化方法正确地应用到分布理论中。尽管存在质量间隙，胶子仍然没有质量。我们的解决方案满足两个边界条件：它在远距离上优于所有其他可能的解决方案，但它本身阻止胶子出现在物理光谱中。它具有短距离渐近自由行为。我们讨论我们的结果与埃利祖尔定理的联系。", "authors": [{"name": "Vakhtang Gogokhia"}, {"name": "Gergely Gábor Barnaföldi"}], "featured_authors": [{"name": "Vakhtang Gogokhia"}, {"name": "Gergely Gábor Barnaföldi"}], "author_count": 2}, {"id": "2611.08102", "category": "hep-th", "title": "Accessing Fractional Wilson Lines from U(1) Monodromy Defects on the Fuzzy Sphere", "abstract": "Wilson lines are gauge-invariant probes of charge screening and deconfinement, which can detect the response of quantum critical matter to an external charge, but their universal information at strongly-coupled critical points remains hard to access. Here we investigate a continuous family of $U(1)$ monodromy defects of the three-dimensional $O(2)$ Wilson--Fisher conformal field theory, which is dual to fractional Wilson lines in the critical noncompact Abelian Higgs model with one unit-charged scalar. We realize this continuous family of defects within the fuzzy-sphere framework by threading a fractional Aharonov--Bohm flux through the two poles of the sphere. We observe the emergence of charged operators carrying fractional transverse spins, as a characteristic signature of the imposed monodromy. The appearance of displacement operator at its protected dimension supports the conformal nature of this defect line. Crucially, we resolve no relevant symmetry-preserving defect scalar, and identify charge-one monopole operators as relevant symmetry-breaking deformations. Assuming the duality, these results provide non-perturbative evidence that fractional Wilson lines of the critical Abelian Higgs model are stable conformal lines.", "url": "https://arxiv.org/abs/2611.08102", "type": "理论", "summary": "威尔逊线是电荷筛选和解禁的规范不变探针，可以检测量子临界物质对外部电荷的响应，但它们在强耦合临界点的通用信息仍然难以获取。在这里，我们研究了三维 $O(2)$ Wilson-Fisher 共形场理论的一系列 $U(1)$ 单峰缺陷，该理论与具有一个单位电荷标量的临界非紧阿贝尔希格斯模型中的分数 Wilson 线对偶。我们通过将分数阿哈罗诺夫-玻姆通量穿过球体的两个极点，在模糊球体框架内实现了这种连续的缺陷族。我们观察到携带分数横向自旋的带电算子的出现，作为强加单性的特征签名。位移算子在其受保护维度上的出现支持了该缺陷线的共形性质。至关重要的是，我们解决了不相关的保对称缺陷标量，并将电荷一单极子算子识别为相关的对称破缺变形。\n\n假设对偶性，这些结果提供了非微扰证据，证明临界阿贝尔希格斯模型的分数威尔逊线是稳定的共形线。", "authors": [{"name": "Yin Tang"}, {"name": "W. Zhu"}], "featured_authors": [{"name": "Yin Tang"}, {"name": "W. Zhu"}], "author_count": 2}, {"id": "2611.08164", "category": "hep-th", "title": "Pohlmeyer reduction of Newton-Cartan strings", "abstract": "We develop a Pohlmeyer-type reduction for classical non-relativistic strings on string Newton-Cartan backgrounds. For strings on a two-sphere, we identify the invariant reduced field, show that its dynamics is integrable, and construct a Lax representation. We relate this intrinsic formulation to the non-relativistic expansion of relativistic strings and obtain a dictionary between non-relativistic string solutions and their reduced counterparts. The construction explicitly determines which relativistic solitonic configurations survive the non-relativistic limit and which decouple. Moreover, it provides a framework for applying integrability methods to Newton-Cartan string dynamics.", "url": "https://arxiv.org/abs/2611.08164", "type": "理论", "summary": "我们为弦牛顿-嘉当背景上的经典非相对论弦开发了 Pohlmeyer 型约简。对于两球体上的弦，我们识别不变的约简场，证明其动力学是可积的，并构造一个 Lax 表示。我们将这种内在公式与相对论弦的非相对论展开联系起来，并获得非相对论弦解及其简化对应项之间的字典。该构造明确地确定了哪些相对论孤子配置能够克服非相对论极限以及哪些解耦。此外，它还提供了将可积方法应用于牛顿-嘉当弦动力学的框架。", "authors": [{"name": "Aritra Banerjee"}], "featured_authors": [{"name": "Aritra Banerjee"}], "author_count": 1}, {"id": "2611.08471", "category": "hep-th", "title": "The three-dimensional Galilean black hole", "abstract": "We report a novel solution of three-dimensional Galilean Anti-de Sitter gravity. The theory can be formulated as a topological gauge theory invariant under the doubly extended Newton-Hooke group in three dimensions. The solution possesses four conserved charges: energy, angular momentum, spin and rest mass. Interestingly, the magnitude of the spin turns out to bounded from above by the rest mass. The solution exhibits the thermal properties that define a black hole configuration in terms of its gauge theoretical description. Temperature, angular velocity and other chemical potentials are obtained from suitable regularity conditions associated with the topology of the Euclidean continuation of the solution. At zero temperature, an extreme configuration is shown to emerge provided the bound between the spin and the rest mass saturates.", "url": "https://arxiv.org/abs/2611.08471", "type": "理论", "summary": "我们报告了三维伽利略反德西特引力的新颖解决方案。该理论可以表述为三维双扩展牛顿-胡克群下的拓扑规范理论不变量。该溶液具有四种守恒电荷：能量、角动量、自旋和静止质量。有趣的是，自旋的大小被证明从上方受到静止质量的限制。该解决方案展示了根据规范理论描述定义黑洞配置的热特性。温度、角速度和其他化学势是从与解的欧几里德连续拓扑相关的适当规律性条件获得的。在零温度下，如果自旋和其余质量之间的界限饱和，就会出现极端构型。", "authors": [{"name": "Luis Avilés"}, {"name": "Oscar Fuentealba"}, {"name": "Diego Hidalgo"}, {"name": "Pablo Rodríguez"}], "featured_authors": [{"name": "Luis Avilés"}, {"name": "Oscar Fuentealba"}, {"name": "Diego Hidalgo"}, {"name": "Pablo Rodríguez"}], "author_count": 4}, {"id": "2611.08476", "category": "hep-th", "title": "Defect Anomalies at a Distance", "abstract": "Surface defects carry Weyl and gravitational anomalies that generalize the central charges of two-dimensional conformal field theories (CFTs) and characterize the anomalous response of gapless surface modes to background geometry. These anomalies usually appear as contact terms on the defect. We explain how they are encoded at a distance, in scheme-independent integrated bulk stress-tensor correlators. We derive sum rules for them in terms of defect operator data, establish a lower bound on the boundary Weyl anomaly in three-dimensional CFTs, and illustrate our results with explicit examples.", "url": "https://arxiv.org/abs/2611.08476", "type": "理论", "summary": "表面缺陷带有 Weyl 和引力异常，概括了二维共形场论 (CFT) 的中心电荷，并表征了无间隙表面模式对背景几何形状的异常响应。这些异常通常作为缺陷上的接触项出现。我们解释了它们如何在独立于方案的集成体应力张量相关器中进行远距离编码。我们根据缺陷算子数据推导出它们的求和规则，在三维 CFT 中的边界 Weyl 异常上建立下界，并用明确的例子说明我们的结果。", "authors": [{"name": "Oleksandr Diatlyk"}, {"name": "Zimo Sun"}, {"name": "Yifan Wang"}], "featured_authors": [{"name": "Oleksandr Diatlyk"}, {"name": "Zimo Sun"}, {"name": "Yifan Wang"}], "author_count": 3}, {"id": "2611.07608", "category": "math-ph", "title": "A Wigner-Lindblad phase space model for open quantum dynamics", "abstract": "We investigate the collisional quantum dynamics of an open system in contact with a thermal bath. We propose a particle-bath interaction model based on the Weyl quantization principle and the Wigner phase space description of quantum evolution. By factorizing the reduced Hamiltonian of the open system via supersymmetric quantum mechanics techniques, we construct system-dependent creation and annihilation operators for arbitrary potential landscapes. This allows us to extend the classical Fokker--Planck relaxation mechanism to incorporate Lindblad quantum stochastic jumps within the Wigner phase-space formalism. Through a semiclassical expansion of the Moyal star product to second order, we obtain a generalized Wigner--Lindblad kinetic model featuring position-dependent friction and diffusion terms. We establish the mathematical well-posedness of the Lindblad problem and we validate our approach through numerical simulations. Our model resolves unphysical long-time artifacts of standard quantum Fokker--Planck models in quartic double-well traps, accurately captures dissipative quantum state localization in 2D molecular potentials (4D phase space), and effectively evaluates electron transport and trapping times in InAs/InP resonant tunneling diodes.", "url": "https://arxiv.org/abs/2611.07608", "type": "理论", "summary": "我们研究与热浴接触的开放系统的碰撞量子动力学。我们提出了一种基于外尔量子化原理和量子演化的维格纳相空间描述的粒子浴相互作用模型。通过超对称量子力学技术分解开放系统的简化哈密顿量，我们为任意潜在景观构造了系统相关的创建和湮灭算子。这使我们能够扩展经典的福克-普朗克弛豫机制，将林德布拉德量子随机跳跃纳入维格纳相空间形式主义中。通过将 Moyal 星积半经典展开到二阶，我们获得了一个广义的 Wigner-Lindblad 动力学模型，该模型具有位置相关的摩擦和扩散项。我们建立了 Lindblad 问题的数学适定性，并通过数值模拟验证了我们的方法。\n\n我们的模型解决了四次双阱陷阱中标准量子福克-普朗克模型的非物理长期伪影，准确捕获了 2D 分子势（4D 相空间）中的耗散量子态局域化，并有效评估了 InAs/InP 谐振隧道二极管中的电子传输和捕获时间。", "authors": [{"name": "O. Morandi"}], "featured_authors": [{"name": "O. Morandi"}], "author_count": 1}, {"id": "2611.07789", "category": "math-ph", "title": "The Zhukovskiy-Volterra gyroscope: geometry and reduction", "abstract": "We describe a symplectic reduction of the Zhukovskiy integrable case of motion of a rigid body about a fixed point with a gyroscope in $\\mathbb R^n$ to an integrable magnetic flow on a sphere $S^{n-1}$. We also present Zhukovskiy's geometric interpretation of motion of the Euler top with a gyroscope, aka the Zhukovskiy--Volterra gyroscope, and perform a symplectic reduction of this system to an integrable magnetic flow on a $2$-dimensional sphere.", "url": "https://arxiv.org/abs/2611.07789", "type": "理论", "summary": "我们描述了 $\\mathbb R^n$ 中刚体绕固定点运动的 Zhukovskiy 可积情况辛简化为球体 $S^{n-1}$ 上的可积磁流。我们还用陀螺仪（又名 Zhukovskiy-Volterra 陀螺仪）展示了 Zhukovskiy 对欧拉陀螺运动的几何解释，并将该系统辛简化为 $2$ 维球体上的可积磁流。", "authors": [{"name": "Vladimir Dragović"}, {"name": "Borislav Gajić"}, {"name": "Božidar Jovanović"}], "featured_authors": [{"name": "Vladimir Dragović"}, {"name": "Borislav Gajić"}, {"name": "Božidar Jovanović"}], "author_count": 3}, {"id": "2611.07885", "category": "math-ph", "title": "Topology-Inspired Interfaces in Non-Local Mass-Spring Lattices", "abstract": "Non-local couplings offer a means of engineering the dynamics and topology of discrete lattices beyond the constraints of nearest-neighbour (NN) interactions. Here, we extend the mass-spring Su-Schrieffer-Heeger (SSH) model to incorporate beyond-nearest-neighbour (BNN) connections that preserve the chiral symmetry of the diatomic unit cell, investigating how their range and strength shape the bulk response. We show that the accessible winding numbers are bounded by the lattice connectivity, while the spring stiffnesses select the specific topological phase. We further investigate the challenges posed by non-local interfaces, where the extended connectivity inherently introduces local boundary perturbations. The dynamic freedom afforded by BNN couplings is exploited by examining interfaces between dynamically and topologically dissimilar bulk media, revealing a band-gap-induced asymmetry in the localisation of interface states. We show that the interfacial configuration provides a means of controlling the existence and character of localised interface modes, with changes to the interface enabling the tuning of mode frequencies, localisation and hybridisation with the bulk bands.", "url": "https://arxiv.org/abs/2611.07885", "type": "理论", "summary": "非局部耦合提供了一种超越最近邻 (NN) 相互作用的约束来设计离散晶格动力学和拓扑的方法。在这里，我们扩展了质量弹簧 Su-Schrieffer-Heeger (SSH) 模型，以纳入超最近邻 (BNN) 连接，以保持双原子晶胞的手性对称性，研究它们的范围和强度如何影响体响应。我们表明，可访问的缠绕数受晶格连通性的限制，而弹簧刚度选择特定的拓扑相。我们进一步研究非局部接口带来的挑战，其中扩展的连接本质上引入了局部边界扰动。通过检查动态和拓扑不同的体介质之间的界面，利用 BNN 耦合提供的动态自由度，揭示了界面态局部化中由带隙引起的不对称性。我们表明，界面配置提供了一种控制局部界面模式的存在和特征的方法，通过改变界面，可以调整模式频率、局部化以及与体带的混合。", "authors": [{"name": "Robyn G. Edge"}, {"name": "Timothy A. Starkey"}, {"name": "Gregory J. Chaplain"}], "featured_authors": [{"name": "Robyn G. Edge"}, {"name": "Timothy A. Starkey"}, {"name": "Gregory J. Chaplain"}], "author_count": 3}, {"id": "2611.08018", "category": "math-ph", "title": "Universal $x$-$y$ duality in equivariant topological recursion and quartic Kontsevich model", "abstract": "Topological recursion is a universal procedure that generates an infinite family of multi-differentials with different interpretations in various areas of mathematics. Recently, a new understanding of topological recursion has emerged from $x$-$y$ duality, which relates two such families through explicit formulae. We study $x$-$y$ duality, its parametrised version, and symplectic duality in the setting of equivariant topological recursion. We explicitly analyse the pole structure of the resulting dual families and provide recursive formulae for the different types of polar parts. In contrast to classical topological recursion, the dual family has additional poles at fixed points of the group action, and at anti-diagonals determined by the group action. We show that the partition function $Z_P(E)=\\int_{H_N} e^{-N\\,\\mathrm{Tr}(E\\Phi^2+P(\\Phi))}d\\Phi$ of the Kontsevich matrix model with arbitrary potential $P$, where $d\\Phi$ is the Lebesgue measure on Hermitian $N\\times N$ matrices and $E$ a positive matrix, admits a Fock space realisation related to the character expansion of the IZHC integral. The Fock space framework provides two mutually $X$-$Y$ dual families of multi-differentials relative to an implicitly defined spectral curve $(X,Y)$. The solution $Y(X)$ succeeds for the quartic Kontsevich model with potential $P(\\Phi)=\\frac{\\lambda}{4}\\Phi^4$. We identify a network of duality transformations and symplectic shifts which relate the quartic Kontsevich model with the $\\mathbb{Z}/2\\mathbb{Z}$-equivariant spectral curve. The proposed construction yields a conjectural all-genus solution to the quartic Kontsevich model, which reproduces recursive structures previously established for genus $g\\leq 1$.", "url": "https://arxiv.org/abs/2611.08018", "type": "理论", "summary": "拓扑递归是一种通用过程，它生成无限的多重微分族，在数学的各个领域具有不同的解释。最近，从 $x$-$y$ 对偶性中出现了对拓扑递归的新理解，它通过显式公式将两个这样的族联系起来。我们研究等变拓扑递归设置中的 $x$-$y$ 对偶性、其参数化版本以及辛对偶性。我们明确分析了所得对偶族的极结构，并为不同类型的极部分提供了递归公式。与经典的拓扑递归相反，对偶族在群作用的固定点以及由群作用确定的反对角线上有额外的极点。我们证明具有任意势 $P$ 的 Kontsevich 矩阵模型的配分函数 $Z_P(E)=\\int_{H_N} e^{-N\\,\\mathrm{Tr}(E\\Phi^2+P(\\Phi))}d\\Phi$ ，其中 $d\\Phi$ 是埃尔米特 $N\\times N$ 矩阵上的勒贝格测度，$E$ 是一个正矩阵，承认与 Fock 空间实现相关IZHC 积分的字符展开。\n\nFock 空间框架提供了相对于隐式定义的谱曲线 $(X,Y)$ 的两个相互 $X$-$Y$ 多重微分对偶族。对于具有潜在 $P(\\Phi)=\\frac{\\lambda}{4}\\Phi^4$ 的四次 Kontsevich 模型，解 $Y(X)$ 成功。我们确定了一个对偶变换和辛位移网络，将四次 Kontsevich 模型与 $\\mathbb{Z}/2\\mathbb{Z}$ 等变谱曲线联系起来。所提出的构造产生了四次 Kontsevich 模型的猜想全属解，该模型再现了先前为属 $g\\leq 1$ 建立的递归结构。", "authors": [{"name": "Alexander Hock"}, {"name": "Jakob Lindner"}, {"name": "Raimar Wulkenhaar"}], "featured_authors": [{"name": "Alexander Hock"}, {"name": "Jakob Lindner"}, {"name": "Raimar Wulkenhaar"}], "author_count": 3}, {"id": "2611.08059", "category": "math-ph", "title": "Fitness advantages, prediction of resistances and protocol design: exploiting the synergy between mathematical modelling and statistics", "abstract": "Tumour evolution and treatment resistance are driven by the interplay between clonal heterogeneity, selective pressures, and therapeutic interventions. In this work, we propose an integrated mathematical and statistical framework to investigate clonal selection, predict radioresistance, and optimize radiotherapy protocols. We develop a multi-clonal dynamical model incorporating proliferation, resource competition, epigenetic instability, and clone-specific radiosensitivity. Through the statistical analysis of 255,150 in silico simulations, we identify key biological determinants of treatment response and characterize the effects of evolutionary competition and radiotherapy on clonal composition. Our results show that evolutionary dynamics favour highly proliferative clones, whereas radiotherapy selects radioresistant populations and reduces tumour heterogeneity. We further investigate how tumour characteristics influence resistance trajectories and identify trade-offs between tumour control, toxicity, and resistance selection across different treatment schedules. Optimal protocols are determined for distinct patient profiles, accounting for dose, fractionation, and timing. Finally, we demonstrate how treatment history affects the efficacy of second-line therapies. Overall, our findings highlight the potential of combining mechanistic modelling and statistical inference to understand cancer evolution and support personalized radiotherapy design.", "url": "https://arxiv.org/abs/2611.08059", "type": "理论", "summary": "肿瘤进化和治疗耐药性是由克隆异质性、选择压力和治疗干预之间的相互作用驱动的。在这项工作中，我们提出了一个综合的数学和统计框架来研究克隆选择、预测放射抗性和优化放射治疗方案。我们开发了一个包含增殖、资源竞争、表观遗传不稳定性和克隆特异性放射敏感性的多克隆动力学模型。通过对 255,150 个计算机模拟进行统计分析，我们确定了治疗反应的关键生物决定因素，并描述了进化竞争和放射治疗对克隆组成的影响。我们的结果表明，进化动力学有利于高度增殖的克隆，而放疗则选择抗辐射群体并降低肿瘤异质性。我们进一步研究肿瘤特征如何影响耐药轨迹，并确定不同治疗方案中肿瘤控制、毒性和耐药性选择之间的权衡。根据不同的患者情况，考虑剂量、分次和时间，确定最佳方案。\n\n最后，我们展示了治疗史如何影响二线疗法的疗效。总体而言，我们的研究结果强调了结合机械建模和统计推断来了解癌症演变和支持个性化放射治疗设计的潜力。", "authors": [{"name": "Giulia Chiari"}], "featured_authors": [{"name": "Giulia Chiari"}], "author_count": 1}, {"id": "2611.08087", "category": "math-ph", "title": "Multifractal scaling of quantum eigenfunctions in the thermodynamic limit", "abstract": "We prove multifractal scaling of measures related to the eigenfunctions of Schrödinger operators with point-like bump potentials, in the thermodynamic limit, in dimension $d\\geq 5$. This is consistent with a longstanding expectation in the physics literature in these dimensions. The fractal exponents are computed explicitly as a function of the parameter defining the moments. Our result requires a weak disorder condition on the location of the scatterers and a strong coupling condition on the sequence of eigenvalues.", "url": "https://arxiv.org/abs/2611.08087", "type": "理论", "summary": "我们证明了在热力学极限、维度 $d\\geq 5$ 下，与具有点状凹凸势的薛定谔算子本征函数相关的测度的多重分形标度。这与物理学文献在这些维度上的长期期望是一致的。分形指数被明确计算为定义矩的参数的函数。我们的结果需要散射体位置的弱无序条件和特征值序列的强耦合条件。", "authors": [{"name": "Jonathan P. Keating"}, {"name": "Henrik Ueberschaer"}], "featured_authors": [{"name": "Jonathan P. Keating"}, {"name": "Henrik Ueberschaer"}], "author_count": 2}, {"id": "2611.08292", "category": "math-ph", "title": "Overcompressive shocks in a $2\\times2$ hyperbolic system of conservation laws", "abstract": "Overcompressive shocks in a $2\\times2$ hyperbolic system of conservation laws describing small-amplitude longitudinal-torsional waves in an elastic rod are investigated. A viscous regularization method with an anisotropic dissipative matrix is applied to the system. A qualitative analysis of phase portraits has revealed that a two-parameter family of heteroclinic trajectories, representing the structure of an overcompressive shock, exists in one of six domains in the parameter plane. It is established that the model admits overcompressive shocks, which belong to the first type according to the classification of Liu.", "url": "https://arxiv.org/abs/2611.08292", "type": "理论", "summary": "研究了描述弹性杆中小振幅纵扭波的 $2\\times2$ 双曲守恒定律系统中的过压冲击。该系统采用了具有各向异性耗散矩阵的粘性正则化方法。相图的定性分析表明，代表过压激波结构的异宿轨迹的二参数族存在于参数平面的六个域之一中。确定模型允许过压冲击，根据Liu的分类属于第一类。", "authors": [{"name": "A. P. Chugainova"}, {"name": "R. R. Polekhina"}, {"name": "D. V. Treschev"}], "featured_authors": [{"name": "A. P. Chugainova"}, {"name": "R. R. Polekhina"}, {"name": "D. V. Treschev"}], "author_count": 3}, {"id": "2611.08326", "category": "math-ph", "title": "Oriented V-systems", "abstract": "We introduce the notion of an oriented $\\vee$-system which gives a class of solutions of the oriented associativity equations generalising Veselov's $\\vee$-system solutions of WDVV equations. An oriented $\\vee$-system is a special configuration of pairs of a vector and a covector in a linear space. We show that the class of oriented $\\vee$-systems is closed under taking subsystems and restrictions. We provide examples which include a multiparameter family related to imprimitive complex reflection groups.", "url": "https://arxiv.org/abs/2611.08326", "type": "理论", "summary": "我们引入了定向 $\\vee$ 系统的概念，它给出了一类定向结合性方程的解，概括了 WDVV 方程的 Veselov 的 $\\vee$ 系统解。定向$\\vee$系统是线性空间中向量和协向量对的特殊配置。我们证明了面向 $\\vee$ 系统类在子系统和限制下是封闭的。我们提供的示例包括与原始复反射群相关的多参数族。", "authors": [{"name": "Maali Alkadhem"}, {"name": "Misha Feigin"}], "featured_authors": [{"name": "Maali Alkadhem"}, {"name": "Misha Feigin"}], "author_count": 2}, {"id": "2611.06975", "category": "quant-ph", "title": "Physical regimes of quartic quantum advantage in elastic media simulation", "abstract": "Quantum algorithms for elastic media simulation have been conjectured to offer up to a quartic quantum advantage over classical methods; however, the devil is always in the details. Here, we determine key physical conditions under which this quartic separation could be achieved in the relevant parameters. For continuum elastic dynamics at fixed volume with spatial convergence order $m$, we find that the end-to-end speedup is of order $(m+4)/(m+1)$ in the simulation time, and $4/(m+1)$ in the accuracy, with exponential memory advantage. For elastic lattice systems, we define microscopically resolved bulk observables (MRBOs) as those that can be efficiently extracted from a quantum state, but cannot be resolved by a known continuum model with fewer degrees of freedom than the lattice. We then argue that the estimation of MRBOs is a candidate problem for quartic quantum advantage in pr
