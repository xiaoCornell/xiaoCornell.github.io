oblem size. We propose MRBOs for pseudorandom heterogeneous materials as an explicit end-to-end application where this occurs, while admitting efficient `quantum cheese' encodings of the material properties. We thus demonstrate how the interplay between regularity, physical scale, observable sensitivity and quantum encodability constrains the relation between classical and quantum complexity.", "url": "https://arxiv.org/abs/2611.06975", "type": "理论+数值", "summary": "据推测，用于弹性介质模拟的量子算法比经典方法具有四次量子优势；然而，细节决定成败。在这里，我们确定了在相关参数中可以实现这种四次分离的关键物理条件。对于空间收敛阶数为 $m$ 的固定体积连续弹性动力学，我们发现仿真时间的端到端加速为 $(m+4)/(m+1)$ 量级，精度为 $4/(m+1)$ 量级，并具有指数记忆优势。对于弹性晶格系统，我们将微观分辨体可观测量（MRBO）定义为可以从量子态中有效提取的那些，但无法通过自由度比晶格更少的已知连续体模型来解析。然后我们认为 MRBO 的估计是问题规模四次量子优势的候选问题。我们建议将用于伪随机异质材料的 MRBO 作为发生这种情况的显式端到端应用，同时允许对材料属性进行有效的“量子奶酪”编码。\n\n因此，我们证明了规律性、物理尺度、可观测灵敏度和量子可编码性之间的相互作用如何限制经典复杂性和量子复杂性之间的关系。", "authors": [{"name": "David Jennings"}, {"name": "Kamil Korzekwa"}, {"name": "Matteo Lostaglio"}, {"name": "Tamás Vaszary"}], "featured_authors": [{"name": "David Jennings"}, {"name": "Kamil Korzekwa"}, {"name": "Matteo Lostaglio"}, {"name": "Tamás Vaszary"}], "author_count": 4}, {"id": "2611.06997", "category": "quant-ph", "title": "All Bell inequalities with a quantum advantage in the minimal scenario are self-testing", "abstract": "In the minimal Bell scenario, all extremal quantum correlations are known, but the Tsirelson inequalities that delimit the quantum set remain poorly understood. We study which correlations can maximize a given Tsirelson inequality, and conversely, which inequalities are maximized by a given correlation. We show that every Tsirelson inequality with quantum advantage is maximized by a single, extremal correlation, and thus self-tests the corresponding realization. This characterizes all self-tests based on linear Bell inequalities in this scenario. We also show that at most a two-dimensional family of inequalities can be maximized by a nonlocal extremal correlation. We identify these as polygons for a family of correlations realized by qubit states of arbitrary entanglement. This allows us to deduce that the quantum set is not self-dual.", "url": "https://arxiv.org/abs/2611.06997", "type": "理论", "summary": "在最小贝尔情景中，所有极值量子相关性都是已知的，但界定量子集的 Tsirelson 不等式仍然知之甚少。我们研究哪些相关性可以最大化给定的 Tsirelson 不等式，反之，哪些不等式可以通过给定的相关性最大化。我们证明，每个具有量子优势的 Tsirelson 不等式都可以通过单个极值相关性来最大化，从而自我测试相应的实现。这是这种情况下基于线性贝尔不等式的所有自测试的特征。我们还表明，最多可以通过非局部极值相关性来最大化二维不等式族。我们将它们识别为由任意纠缠的量子位状态实现的一系列相关性的多边形。这使我们能够推断出量子集不是自对偶的。", "authors": [{"name": "Mu-En Liu"}, {"name": "Andrea Zingarofalo"}, {"name": "Victor Barizien"}, {"name": "Jean-Daniel Bancal"}], "featured_authors": [{"name": "Mu-En Liu"}, {"name": "Andrea Zingarofalo"}, {"name": "Victor Barizien"}, {"name": "Jean-Daniel Bancal"}], "author_count": 4}, {"id": "2611.07003", "category": "quant-ph", "title": "Nonlocal magic of fermions is bounded by entanglement fluctuations and is logarithmic for free fermions", "abstract": "Free-fermion states are classically simulable, yet, written as qubits, they typically carry extensive magic, the quantum resource that stabilizer circuits lack. Part of this magic is nonlocal: local unitaries acting separately on two parts of the system cannot remove it. If these local unitaries are restricted to Gaussian ones, the nonlocal magic grows linearly with the number $m$ of partially entangled fermion pairs. We show that this growth is an artifact of the Gaussian restriction: local Gaussian unitaries minimize the nonlocal stabilizer Rényi entropy for up to three pairs, but not from four pairs on. General local non-Gaussian unitaries that respect fermion parity take $m$ free-fermion pairs to fermionic Bell pairs with a fidelity that decays at most as $1/\\sqrt m$ compared to exponential decay with Gaussian unitaries, so the nonlocal magic drops from linear to logarithmic in $m$. The reason is statistical --- Bell pairs have equal Schmidt weights, that is, a fully degenerate entanglement spectrum, and a state can stay far from them only if its Schmidt weights are spread over many orders of magnitude. This spread is measured by the capacity of entanglement $C_E$, the variance of the entanglement Hamiltonian, and the nonlocal magic of any fermionic state grows at most logarithmically with $C_E$. Free-fermion pairs add to $C_E$ independently, so $C_E$ grows only linearly in $m$, and this leads to the stabilizer fidelity decreasing at most as $1/\\sqrt m$. Almost all the magic of free fermions, including Hartree--Fock and BCS mean-field states, is therefore local.", "url": "https://arxiv.org/abs/2611.07003", "type": "理论", "summary": "自由费米子态在经典上是可模拟的，然而，以量子位的形式编写，它们通常具有广泛的魔力，这是稳定器电路所缺乏的量子资源。这种魔力的一部分是非局域的：分别作用于系统的两个部分的局域酉无法消除它。如果这些局域幺正仅限于高斯，则非局域魔力随着部分纠缠费米子对的数量 $m$ 线性增长。我们证明这种增长是高斯限制的产物：局部高斯幺正最小化最多三对的非局部稳定器 Rényi 熵，但不会从四对开始。尊重费米子宇称的一般局域非高斯酉将 $m$ 自由费米子对转换为费米子贝尔对，与高斯酉指数衰减相比，其保真度最多衰减 $1/\\sqrt m$，因此非局域魔力从 $m$ 的线性下降到对数。原因是统计上的——贝尔对具有相等的施密特权重，即完全简并的纠缠谱，并且只有当其施密特权重分布在多个数量级时，状态才能远离它们。\n\n该扩展通过纠缠能力 $C_E$、纠缠哈密顿量的方差以及任何费米子态的非定域魔力最多以对数方式与 $C_E$ 增长来衡量。自由费米子对独立地添加到 $C_E$，因此 $C_E$ 仅在 $m$ 中线性增长，这导致稳定器保真度最多降低为 $1/\\sqrt m$。因此，自由费米子的几乎所有魔力，包括 Hartree-Fock 和 BCS 平均场态，都是局域的。", "authors": [{"name": "Raghav G. Jha"}, {"name": "Dengyao Luo"}, {"name": "Alexander F. Kemper"}, {"name": "Bojko N. Bakalov"}], "featured_authors": [{"name": "Raghav G. Jha"}, {"name": "Dengyao Luo"}, {"name": "Alexander F. Kemper"}, {"name": "Bojko N. Bakalov"}], "author_count": 4}, {"id": "2611.07017", "category": "quant-ph", "title": "Threshold-Free Symmetry-Enriched Topological Quantum Memory", "abstract": "We show that non-Abelian symmetry enrichment can protect a toric code memory against incoherent electric noise at any bond error probability $p\\in[0,1]$. For a toric code on the honeycomb lattice coupled to $Sp(N)$ rotors, with electric anyons carrying the fundamental representation, we construct an efficient minimum-weight decoder whose logical error probability decays exponentially with system size for $N\\ge40$, a conservative sufficient bound. The same decoder also rules out strong-to-weak spontaneous symmetry breaking in the fundamental channel of $Sp(N)$ under the corresponding local decoherence in two dimensions. The construction extends to other symmetries, including $SU(N)$.", "url": "https://arxiv.org/abs/2611.07017", "type": "理论", "summary": "我们证明，非阿贝尔对称丰富可以保护环面代码存储器在任何键错误概率 $p\\in[0,1]$ 下免受不相干电噪声的影响。对于耦合到 $Sp(N)$ 转子的蜂窝晶格上的复曲面码，以及带有基本表示的电任意子，我们构建了一个高效的最小权重解码器，其逻辑错误概率随着系统大小呈指数衰减，$N\\ge40$ 是一个保守的足够界限。同一解码器还排除了在相应的二维局部退相干下 $Sp(N)$ 基本通道中的强到弱自发对称性破缺。该结构扩展到其他对称性，包括 $SU(N)$。", "authors": [{"name": "Abhijat Sarma"}, {"name": "Ruochen Ma"}, {"name": "Cenke Xu"}], "featured_authors": [{"name": "Abhijat Sarma"}, {"name": "Ruochen Ma"}, {"name": "Cenke Xu"}], "author_count": 3}, {"id": "2611.07021", "category": "quant-ph", "title": "Single-shot ground-state preparation via strongly coupled baths", "abstract": "Preparing ground and thermal states of quantum many-body systems is a central task in quantum simulation. Dissipative protocols have emerged as a promising solution for both near-term and fault-tolerant hardware, but most constructions rely on weak system-bath coupling, leading to slow cooling. Here, we construct cooling protocols at strong system-bath coupling, and demonstrate accurate state preparation within even a single cooling cycle. Our protocols combine dynamically ramped ancilla energy levels with time-dependent couplings to optimize the trade-off between cooling error and physical time. For a general class of free-fermion systems, we reduce the dynamics exactly to a two-level scattering problem: ground-state cooling becomes a control problem of maximizing resonant excitation transfer while suppressing non-adiabatic heating. We then construct a family of ``Möbius-Ingham'' protocols, which reach optimal error scaling for gapless spectra and almost-exponential suppression of the leading heating error for gapped spectra, as a function of the cycle period. In our free-fermion benchmarks, Möbius-Ingham cooling lies on the Pareto frontier between steady-state error and cooling time among the controls tested. We further demonstrate its effectiveness in interacting Ising and $t$-$V$ chains and the two-dimensional Fermi-Hubbard model. Finally, we extend our construction to Gibbs state preparation, showing how free-fermion thermal states can be prepared in a single cycle.", "url": "https://arxiv.org/abs/2611.07021", "type": "理论+数值", "summary": "准备量子多体系统的基态和热态是量子模拟的核心任务。耗散协议已成为近期和容错硬件的一种有前途的解决方案，但大多数结构依赖于弱系统浴耦合，导致冷却缓慢。在这里，我们在强系统-浴耦合下构建冷却协议，并在单个冷却循环内演示准确的状态准备。我们的协议将动态倾斜的辅助能量水平与时间相关的耦合相结合，以优化冷却误差和物理时间之间的权衡。对于一般类型的自由费米子系统，我们将动力学精确地简化为两级散射问题：基态冷却成为最大化谐振激发传递同时抑制非绝热加热的控制问题。然后，我们构建了一系列“Möbius-Ingham”协议，该协议作为循环周期的函数，实现了无间隙光谱的最佳误差缩放和有间隙光谱的主要加热误差的近指数抑制。\n\n在我们的自由费米子基准测试中，莫比乌斯-英厄姆冷却位于测试控制中稳态误差和冷却时间之间的帕累托边界。我们进一步证明了它在 Ising 和 $t$-$V$ 链以及二维费米-哈伯德模型相互作用方面的有效性。最后，我们将我们的构建扩展到吉布斯态制备，展示了如何在单个循环中制备自由费米子热态。", "authors": [{"name": "Liang-Hong Mo"}, {"name": "Jerome Lloyd"}, {"name": "Yuxuan Zhang"}, {"name": "Dmitry A. Abanin"}, {"name": "Biao Lian"}], "featured_authors": [{"name": "Liang-Hong Mo"}, {"name": "Jerome Lloyd"}, {"name": "Yuxuan Zhang"}, {"name": "Dmitry A. Abanin"}, {"name": "Biao Lian"}], "author_count": 5}, {"id": "2611.07036", "category": "quant-ph", "title": "Ground-State Dressing and Delayed Feedback of a Chiral Giant Atom in Ultrastrong Waveguide QED", "abstract": "We study a chiral giant atom ultrastrongly coupled to a one-dimensional waveguide at two spatially separated points. At a relative coupling phase \\pi/2, the total spectral density is independent of the distance between the coupling points, whereas its directional components are not. Using a variational polaron transformation, we show that the renormalized transition frequency and the total ground-state dressing inherit this independence, while the virtual-photon cloud remains chiral. A sudden switch-off of the coupling releases this cloud as directional radiation. We also derive the spontaneous-emission dynamics in the polaron frame, showing that, after neglecting the local photonic potential, the memory kernel becomes distance independent at the same phase.", "url": "https://arxiv.org/abs/2611.07036", "type": "理论+数值", "summary": "我们研究了在两个空间分离点处与一维波导超强耦合的手性巨原子。在相对耦合相位 π/2 处，总谱密度与耦合点之间的距离无关，而其方向分量则不然。使用变分极化子变换，我们表明重整化跃迁频率和总基态修饰继承了这种独立性，而虚拟光子云仍然是手性的。耦合的突然关闭会以定向辐射的形式释放该云。我们还推导了极化子框架中的自发发射动力学，表明在忽略局部光子势之后，存储内核在同一相位下变得与距离无关。", "authors": [{"name": "Giuseppe Musolino"}, {"name": "Daniele Lamberto"}, {"name": "Salvatore Savasta"}, {"name": "Federico Roccati"}], "featured_authors": [{"name": "Giuseppe Musolino"}, {"name": "Daniele Lamberto"}, {"name": "Salvatore Savasta"}, {"name": "Federico Roccati"}], "author_count": 4}, {"id": "2611.07144", "category": "quant-ph", "title": "Dithered Belief Propagation for Real-Time Quantum Memory Decoding", "abstract": "We introduce dithered belief-propagation decoding for circuit-level quantum memory to mitigate the oscillations and trapping behavior that limit standard belief-propagation (BP) decoders for qLDPC codes. Our approach combines a quantum-adapted sign-flip mechanism with chained randomized prior perturbation. Evaluated under circuit-level noise on the distance-11 rotated surface code and the distance-12 bivariate-bicycle code, the proposed dithered decoder significantly outperforms BP and BP+OSD+CS-10. The proposed decoder achieves accuracy comparable to or better than state-of-the-art Relay-BP, especially at higher physical error rates, while trading a moderate increase in additions for about 98% fewer multiplications on average and eliminating node-level RNGs. These results suggest that dithering is a promising approach toward real-time decoding of quantum memories.", "url": "https://arxiv.org/abs/2611.07144", "type": "数值", "summary": "我们为电路级量子存储器引入了抖动置信传播解码，以减轻限制 qLDPC 码的标准置信传播 (BP) 解码器的振荡和捕获行为。我们的方法将量子适应的符号翻转机制与链式随机先验扰动相结合。在电路级噪声下对距离 11 旋转表面码和距离 12 双变量自行车码进行评估，所提出的抖动解码器显着优于 BP 和 BP+OSD+CS-10。所提出的解码器实现了与最先进的 Relay-BP 相当或更好的精度，特别是在物理错误率较高的情况下，同时以适度增加的加法换取平均减少约 98% 的乘法，并消除了节点级 RNG。这些结果表明，抖动是量子存储器实时解码的一种有前途的方法。", "authors": [{"name": "Zhengyu Cai"}, {"name": "Mohamad Ali Jarkas"}, {"name": "Bokun Zhao"}, {"name": "Warren J. Gross"}], "featured_authors": [{"name": "Zhengyu Cai"}, {"name": "Mohamad Ali Jarkas"}, {"name": "Bokun Zhao"}, {"name": "Warren J. Gross"}], "author_count": 4}, {"id": "2611.07175", "category": "quant-ph", "title": "Scalable Transpilation for Overcoming Restricted Connectivity in Distributed Superconducting Quantum Architectures", "abstract": "Distributed Quantum Computing (DQC) offers a promising pathway to scale superconducting quantum hardware, but restricted inter- and intra-module connectivity creates a major transpilation bottleneck. Current DQC transpilation methods often assume idealized hardware connectivity, ignore subsequent intra-module routing, or suffer from substantial computational overheads that limit their applicability at scale. To address this, we introduce a scalable transpilation method tailored for the restricted connectivity of distributed superconducting quantum architectures. Specifically, our quantum interaction graph (QIG) approach couples a graph-partitioning mapping step with a fast SABRE-inspired routing heuristic. On a 48-qubit (3 QPUs $\\times$ 16 qubits) architecture with all-to-all inter-core connectivity, our method reduces average aggregated costs by up to 24.72% (unstructured) and 24.01% (structured), while delivering >250$\\times$ speed-ups for structured workloads compared to the state-of-the-art DMapS algorithm. On the 399-qubit (3$\\times$133) IBM Flamingo, where DMapS times out on dense circuits, our approach maintains practical runtimes. Against a DQC-adapted SABRE baseline, it reduces structured circuit routing costs by up to 51.94% (all-to-all inter-core topology) and 51.96% (restricted line topology). Ultimately, this work delivers a practical transpilation method for DQC at scale.", "url": "https://arxiv.org/abs/2611.07175", "type": "理论+数值", "summary": "分布式量子计算（DQC）为扩展超导量子硬件提供了一条有前途的途径，但受限的模块间和模块内连接造成了主要的转译瓶颈。当前的 DQC 转译方法通常假设理想化的硬件连接，忽略后续的模块内路由，或者遭受大量的计算开销，限制了其大规模适用性。为了解决这个问题，我们引入了一种针对分布式超导量子架构的受限连接性而定制的可扩展转译方法。具体来说，我们的量子交互图 (QIG) 方法将图分区映射步骤与受 SABRE 启发的快速路由启发式相结合。在具有全对所有核间连接的 48 量子位（3 个 QPU $\\times$ 16 量子位）架构上，我们的方法将平均总成本降低了 24.72%（非结构化）和 24.01%（结构化），同时与最先进的 DMapS 算法相比，为结构化工作负载提供了超过 250$\\times$ 的加速。在 399 量子位（3$\\times$133）IBM Flamingo 上，DMapS 在密集电路上超时，我们的方法保持了实际的运行时间。\n\n与采用 DQC 的 SABRE 基准相比，它可将结构化电路布线成本降低高达 51.94%（全对全核间拓扑）和 51.96%（受限线拓扑）。最终，这项工作为大规模 DQC 提供了一种实用的转译方法。", "authors": [{"name": "Afonso Azenha"}, {"name": "Ilia Polian"}, {"name": "Sebastian Brandhofer"}], "featured_authors": [{"name": "Afonso Azenha"}, {"name": "Ilia Polian"}, {"name": "Sebastian Brandhofer"}], "author_count": 3}, {"id": "2611.07300", "category": "quant-ph", "title": "Quantum simulation of classical RCL circuits via complexification and Schrödingerization", "abstract": "The decomplexification procedure establishes a mathematical equivalence between finite dimensional quantum dynamics and classical dynamics by mapping the complex quantum domain onto the real classical one. Its inverse process, complexification --- which lifts a classical dynamics to an equivalent quantum formulation --- is of great interest, particularly because it enables the quantum simulation of equations that are of classical relevance. In this way, one can prepare the solution of classical differential equations to be implemented using quantum computation tools. In the present work, we recall the decomplexification procedure and also discuss several distinct strategies for performing the complexification of classical equations, so as to obtain the corresponding quantum-equivalent dynamics.", "url": "https://arxiv.org/abs/2611.07300", "type": "理论+数值", "summary": "解复过程通过将复量子域映射到真实的经典域上，在有限维量子动力学和经典动力学之间建立了数学等价关系。它的逆过程、复杂化——将经典动力学提升为等效的量子公式——引起了人们极大的兴趣，特别是因为它能够对具有经典相关性的方程进行量子模拟。通过这种方式，我们可以准备经典微分方程的解，并使用量子计算工具来实现。在目前的工作中，我们回顾了解复过程，并讨论了执行经典方程复化的几种不同策略，以获得相应的量子等效动力学。", "authors": [{"name": "Huner Fanchiotti"}, {"name": "Carlos A. García Canal"}, {"name": "Miguel A. Mayosky"}, {"name": "Alejandro L. Veiga"}, {"name": "Armando Pérez"}, {"name": "Rafael Gómez-Lurbe"}, {"name": "Vicente Vento"}], "featured_authors": [{"name": "Huner Fanchiotti"}, {"name": "Carlos A. García Canal"}, {"name": "Miguel A. Mayosky"}, {"name": "Armando Pérez"}, {"name": "Rafael Gómez-Lurbe"}, {"name": "Vicente Vento"}], "author_count": 7}, {"id": "2611.07337", "category": "quant-ph", "title": "Frustration-freeness is decidable but unprovable", "abstract": "The frustration-free property is valuable in quantum many-body systems, which states that its ground states simultaneously minimize all local interaction terms, even when these terms act on overlapping degrees of freedom. Prominent examples include the AKLT model and Kitaev's toric code model, which serve as paradigmatic models of symmetry-protected topological phases and topological order, respectively. A fundamental question is whether a given Hamiltonian is frustration-free for all system sizes. Here we establish two seemingly contradictory results concerning this decision problem. First, we prove that frustration-freeness is decidable for any fixed local Hilbert space dimension. Specifically, there exists a finite, Hamiltonian-independent system-size cutoff such that frustration-freeness at this cutoff size guarantees frustration-freeness at all system sizes. Second, on the other hand, we also show that there exists a frustration-free Hamiltonian whose frustration-freeness cannot be proved within the standard axioms of mathematics (ZFC). We reconcile these seemingly contradictory results by showing that the cutoff, although finite for each local Hilbert space dimension, is uncomputable as a function of that dimension. Our findings reveal an unexpected fundamental distinction between decidability and provability arising in quantum many-body physics.", "url": "https://arxiv.org/abs/2611.07337", "type": "理论", "summary": "无挫折特性在量子多体系统中很有价值，它表明其基态同时最小化所有局部相互作用项，即使这些项作用于重叠的自由度。突出的例子包括 AKLT 模型和 Kitaev 的环面码模型，它们分别作为对称保护拓扑相和拓扑序的范例模型。一个基本问题是给定的哈密顿量是否对于所有系统规模都是无挫败感的。在这里，我们针对这个决策问题建立了两个看似矛盾的结果。首先，我们证明对于任何固定的局部希尔伯特空间维度，无挫败性是可判定的。具体来说，存在一个有限的、与哈密顿量无关的系统尺寸截止，使得该截止尺寸的无挫败性保证了所有系统尺寸的无挫败性。其次，另一方面，我们还证明存在一个无挫败哈密顿量，其无挫败性无法在数学标准公理（ZFC）内得到证明。\n\n我们通过证明截止虽然对于每个局部希尔伯特空间维度是有限的，但作为该维度的函数是不可计算的，从而调和了这些看似矛盾的结果。我们的研究结果揭示了量子多体物理学中可判定性和可证明性之间出现的意想不到的根本区别。", "authors": [{"name": "Naoto Shiraishi"}], "featured_authors": [{"name": "Naoto Shiraishi"}], "author_count": 1}, {"id": "2611.07388", "category": "quant-ph", "title": "Certifying the Rydberg-exposure limit of a globally driven controlled-Z gate", "abstract": "Rydberg excitation enables entangling gates in neutral-atom quantum processors but also exposes them to spontaneous decay. Whether this exposure can be made arbitrarily small through pulse shaping and longer gate times has remained unresolved. We show that an exact controlled-$Z$ gate driven by a single global laser has an irreducible Rydberg-exposure cost in the perfect-blockade regime. The product of the maximum Rabi frequency $\\Omega_{\\max}$ and the average time $T_R$ spent in the Rydberg state is bounded below by $2.9312$, independent of pulse shape and duration. We derive this bound using a sum-of-squares certificate, strengthened by constraints imposed by the shared drive. Using interval arithmetic, we also certify the existence of an exact gate pulse with $\\Omega_{max} T_R<2.9359$. The unrounded bounds differ by less than $0.16\\%$. The bound identifies a fundamental cost of shared-drive entangling dynamics and establishes a benchmark against which future gate-control strategies can be assessed.", "url": "https://arxiv.org/abs/2611.07388", "type": "理论+数值", "summary": "里德伯激发使得中性原子量子处理器中的纠缠门成为可能，但也使它们暴露于自发衰变。是否可以通过脉冲整形和更长的选通时间使这种暴露变得任意小仍然悬而未决。我们证明，由单个全局激光器驱动的精确控制的 $Z$ 门在完美封锁制度下具有不可减少的里德伯曝光成本。最大拉比频率 $\\Omega_{\\max}$ 和在里德堡态中花费的平均时间 $T_R$ 的乘积的下限为 $2.9312$，与脉冲形状和持续时间无关。我们使用平方和证书得出这个界限，并通过共享驱动器施加的约束来加强。使用区间算术，我们还证明存在 $\\Omega_{max} T_R<2.9359$ 的精确门脉冲。未四舍五入的范围相差小于 $0.16\\%$。该界限确定了共享驱动纠缠动态的基本成本，并建立了一个可以评估未来门控策略的基准。", "authors": [{"name": "Yusheng Zhao"}, {"name": "Han Wang"}, {"name": "Mingrui Jing"}, {"name": "Zhongyi Ni"}, {"name": "Xin Wang"}, {"name": "Jie Wang"}, {"name": "Jinguo Liu"}], "featured_authors": [{"name": "Yusheng Zhao"}, {"name": "Han Wang"}, {"name": "Mingrui Jing"}, {"name": "Xin Wang"}, {"name": "Jie Wang"}, {"name": "Jinguo Liu"}], "author_count": 7}, {"id": "2611.07413", "category": "quant-ph", "title": "Structured Quantum Hardness from Unstructured Assumptions", "abstract": "Whether useful structured hardness can arise from unstructured assumptions is a fundamental question in complexity and cryptography. The longstanding Bennett-Gill question asks whether $\\mathsf{NP}\\cap\\mathsf{coNP}$ remains hard relative to a random oracle; [GIKKLS, STOC 2023] recently gave a conditional affirmative answer in the classical setting. We establish the quantum analogue: if $\\mathsf{UP}\\not\\subseteq\\mathsf{BQP}$, then $\\mathsf{NP}^{O}\\cap\\mathsf{coNP}^{O}\\not\\subseteq\\mathsf{BQP}^{O}$ with probability $1$ over a random oracle $O$. Beyond extending the classical result, this separation has a distinctly quantum significance: Shor's algorithms defeat canonical number-theoretic hardness candidates, while lattice assumptions and other leading post-quantum cryptographic assumptions do not directly supply hard languages with two-sided classical certification on every input. Our conditional oracle separation provides evidence that such structured quantum hardness can nevertheless arise from unstructured sources. Complementing this result, we rule out fully black-box quantum reductions of worst-case quantum hardness in $\\mathsf{NP}\\cap\\mathsf{coNP}$ to post-quantum injective one-way functions and indistinguishability obfuscation. This barrier excludes a broad class of black-box approaches to deriving structured quantum hardness from generic cryptographic primitives, providing partial evidence that the non-black-box techniques in our first result are essential.", "url": "https://arxiv.org/abs/2611.07413", "type": "数值", "summary": "有用的结构化硬度是否可以从非结构化假设中产生是复杂性和密码学中的一个基本问题。长期存在的 Bennett-Gill 问题询问 $\\mathsf{NP}\\cap\\mathsf{coNP}$ 相对于随机预言是否仍然困难？ [GIKKLS, STOC 2023] 最近在经典环境中给出了有条件的肯定答案。我们建立量子模拟：如果 $\\mathsf{UP}\\not\\subseteq\\mathsf{BQP}$，则 $\\mathsf{NP}^{O}\\cap\\mathsf{coNP}^{O}\\not\\subseteq\\mathsf{BQP}^{O}$ 在随机预言机 $O$ 上的概率为 $1$。除了扩展经典结果之外，这种分离具有明显的量子意义：肖尔的算法击败了规范数论硬度候选者，而晶格假设和其他领先的后量子密码学假设并不直接为硬语言提供每个输入的双面经典证明。我们的条件预言分离提供了证据，表明这种结构化量子硬度仍然可以来自非结构化来源。\n\n补充这一结果，我们排除了将 $\\mathsf{NP}\\cap\\mathsf{coNP}$ 中最坏情况量子硬度完全黑盒量子约简为后量子单射单向函数和不可区分性混淆。这一障碍排除了从通用密码原语导出结构化量子硬度的一类黑盒方法，这提供了部分证据表明我们第一个结果中的非黑盒技术是必不可少的。", "authors": [{"name": "Xiao Liang"}, {"name": "Takashi Yamakawa"}, {"name": "Chak Fai Yung"}], "featured_authors": [{"name": "Xiao Liang"}, {"name": "Takashi Yamakawa"}, {"name": "Chak Fai Yung"}], "author_count": 3}, {"id": "2611.07440", "category": "quant-ph", "title": "Information flow control in hybrid quantum networks", "abstract": "Quantum resources can change the dynamical features and operational behaviors of conventional networks. Long-distance entanglement supports information transfer between nodes lacking a direct connection. This entanglement link not only modifies the stationary effective connectivity of the network but can also be used to suppress undesirable classical dynamics. By examining information flow control mechanism, we demonstrate that classical collective behavior can be well-balanced by altering the initially distributed entanglement. We show the entanglement thresholds for two distinct control approaches: linear response control and Lyapunov functional controllability.", "url": "https://arxiv.org/abs/2611.07440", "type": "理论", "summary": "量子资源可以改变传统网络的动态特征和运行行为。长距离纠缠支持缺乏直接连接的节点之间的信息传输。这种纠缠链接不仅改变了网络的静态有效连接性，而且还可以用于抑制不需要的经典动力学。通过检查信息流控制机制，我们证明经典的集体行为可以通过改变最初分布的纠缠来很好地平衡。我们展示了两种不同控制方法的纠缠阈值：线性响应控制和李亚普诺夫函数可控性。", "authors": [{"name": "Michael Siomau"}], "featured_authors": [{"name": "Michael Siomau"}], "author_count": 1}, {"id": "2611.07450", "category": "quant-ph", "title": "Bell Test and Quantum State-Space Geometry", "abstract": "We explore a minimal phenomenological model of coupling between the geometry of the classical spacetime and the quantum state space. Assuming a simple structure of the combined manifold, bilinear interaction between the corresponding geometric scalars and the simplest case of the two-qubit entanglement dynamics, we derive an illustrative upper bound on the geometric coupling constant from the requirement of the Clauser-Horne-Shimony-Holt (CHSH) inequality violation over a finite time interval.", "url": "https://arxiv.org/abs/2611.07450", "type": "理论", "summary": "我们探索经典时空几何与量子态空间之间耦合的最小唯象模型。假设组合流形的简单结构、相应几何标量之间的双线性相互作用以及两个量子位纠缠动力学的最简单情况，我们根据有限时间间隔内克劳瑟-霍恩-希莫尼-霍尔特（CHSH）不等式违反的要求推导出几何耦合常数的说明性上限。", "authors": [{"name": "Michael Siomau"}], "featured_authors": [{"name": "Michael Siomau"}], "author_count": 1}, {"id": "2611.07545", "category": "quant-ph", "title": "Efficient Pauli Truncation from Operator Stabilizer Rényi Entropy", "abstract": "Operator stabilizer Rényi entropy (OSE) quantifies the magic of Heisenberg operators and serves as a diagnostic of their compressibility in the Pauli basis. We establish rigorous bounds showing when an operator can be efficiently approximated by Pauli truncation in terms of the scaling of its OSE. Specifically, we prove that volume-law scaling of OSE for $\\alpha\\geq1$ prevents efficient Pauli truncation from reproducing expectation values for all states at sufficiently small fixed error. On the other hand, logarithmic growth of OSE for $0<\\alpha<1/2$ guarantees efficient Pauli truncation approximability uniformly over all states. A counterexample shows that this sufficient range cannot be extended on the basis of OSE scaling alone. If we restrict to correlations over suitable low-average state ensembles, then the sufficient range extends to $0<\\alpha<1$. We further derive cumulative error bounds for iterative Pauli propagation and approximation guarantees for fixed-order out-of-time-ordered correlators. Moreover, under an independent-sign assumption, we show that logarithmic OSE for $0<\\alpha<1$ guarantees efficient Pauli truncation with the prescribed accuracy for all input states with high probability. Our results provide a theoretical framework for understanding when operator magic constrains or enables efficient Pauli truncation and for guiding the development of classical simulation methods.", "url": "https://arxiv.org/abs/2611.07545", "type": "理论+数值", "summary": "算子稳定器 Rényi 熵 (OSE) 量化了海森堡算子的魔力，并作为其在泡利基中的可压缩性的诊断。我们建立严格的界限，显示算子何时可以通过泡利截断在其 OSE 的缩放方面有效地近似。具体来说，我们证明 $\\alpha\\geq1$ 的 OSE 的体积定律缩放可防止有效的泡利截断以足够小的固定误差再现所有状态的期望值。另一方面，$0<\\alpha<1/2$ 的 OSE 的对数增长保证了所有状态下一致的高效泡利截断近似性。反例表明，仅基于 OSE 缩放无法扩展这个足够的范围。如果我们限制合适的低平均状态集合上的相关性，那么足够的范围扩展到 $0<\\alpha<1$。我们进一步推导出迭代泡利传播的累积误差界和固定阶乱序相关器的近似保证。\n\n此外，在独立符号假设下，我们表明 $0<\\alpha<1$ 的对数 OSE 保证了所有输入状态的有效泡利截断具有高概率的规定精度。我们的结果提供了一个理论框架，用于理解算子魔术何时限制或实现有效的泡利截断，并指导经典模拟方法的开发。", "authors": [{"name": "Haihui Wang"}, {"name": "Yongming Li"}], "featured_authors": [{"name": "Haihui Wang"}, {"name": "Yongming Li"}], "author_count": 2}, {"id": "2611.07766", "category": "quant-ph", "title": "Efficient preparation of spin-squeezed states with Grover's algorithm", "abstract": "We propose a scheme for preparing spin-squeezed states in an ensemble of $N$ spin-$1/2$ particles based on Grover's algorithm. With only a few oracles, the scheme can exactly prepare superpositions of a few neighboring Dicke states with the Wineland squeezing parameter scaling as $N^{-1}$. The scheme requires only global rotations and Dicke-selective phase shifts, thus avoiding the need to engineer a dedicated many-body Hamiltonian for the squeezing dynamics. We further discuss the feasibility of realizing the scheme in cavity QED systems, with the phase-matched Grover iterations realized by single-photon reflection from a dispersively coupled cavity. Full-sequence scattering calculations accounting for finite photon bandwidth and loss show that appreciable spin squeezing can be achieved with high fidelity for suitable system parameters.", "url": "https://arxiv.org/abs/2611.07766", "type": "理论+数值", "summary": "我们提出了一种基于 Grover 算法在 $N$ 自旋 $1/2$ 粒子集合中准备自旋压缩态的方案。只需几个预言机，该方案就可以精确地准备几个相邻迪克状态的叠加，其中 Wineland 压缩参数缩放为 $N^{-1}$。该方案仅需要全局旋转和迪克选择性相移，因此无需为挤压动力学设计专用的多体哈密顿量。我们进一步讨论了在腔 QED 系统中实现该方案的可行性，通过色散耦合腔的单光子反射实现相位匹配 Grover 迭代。考虑到有限光子带宽和损耗的全序列散射计算表明，对于合适的系统参数，可以以高保真度实现可观的自旋压缩。", "authors": [{"name": "Zhi-Yuan Zeng"}, {"name": "Wen-Long Ma"}], "featured_authors": [{"name": "Zhi-Yuan Zeng"}, {"name": "Wen-Long Ma"}], "author_count": 2}, {"id": "2611.07800", "category": "quant-ph", "title": "Constrained Quantum Imaginary Time in Krylov Space", "abstract": "We introduce constrained quantum imaginary time evolution (CQITE), extending quantum imaginary time evolution (QITE) to constrained-search dynamics for ground-state preparation with prescribed expectation-value constraints. A central challenge in practical QITE is constructing a compact unitary representation of the imaginary-time evolution while maintaining accuracy and controlling the approximation error. We resolve this challenge by deriving an exact characterization of the imaginary-time evolution from the Krylov space generated by repeated applications of the Hamiltonian to the initial state. This characterization induces a hierarchy of operator directions expressed through nested anti-commutators. Truncating the hierarchy produces a systematic static operator pool, with polynomial size in the system size at any fixed truncation order. The resulting construction provides a principled route to compact unitary approximations of imaginary-time dynamics. Numerical tests on spin models show close agreement with exact constrained imaginary-time evolution and small constraint deviations, while a fermionic example yields energies close to the analytic constrained-search reference.", "url": "https://arxiv.org/abs/2611.07800", "type": "理论+数值", "summary": "我们引入了约束量子虚时间演化（CQITE），将量子虚时间演化（QITE）扩展到约束搜索动力学，以在规定的期望值约束下进行基态准备。实际 QITE 的一个核心挑战是构建虚时间演化的紧凑酉表示，同时保持精度并控制逼近误差。我们通过将哈密顿量重复应用于初始状态而生成的克雷洛夫空间导出虚时间演化的精确表征来解决这一挑战。这种特征导致了通过嵌套反换向器表达的运算符方向的层次结构。截断层次结构会产生一个系统的静态算子池，其多项式大小在任何固定截断阶数的系统大小中。由此产生的构造为虚数时间动力学的紧凑酉近似提供了一条原则性途径。自旋模型的数值测试显示与精确的约束虚时间演化和小约束偏差非常一致，而费米子示例产生的能量接近解析约束搜索参考。", "authors": [{"name": "Daniele Cuomo"}, {"name": "Luis Cort Barrada"}, {"name": "Michał Studziński"}, {"name": "Robert van Leeuwen"}], "featured_authors": [{"name": "Daniele Cuomo"}, {"name": "Luis Cort Barrada"}, {"name": "Michał Studziński"}, {"name": "Robert van Leeuwen"}], "author_count": 4}, {"id": "2611.07802", "category": "quant-ph", "title": "Multirobust Control Pulses Designed by Iterative Quantum Kolmogorov-Arnold-Moser Algorithm", "abstract": "We introduce a multi-robust quantum control strategy designed to suppress multilevel leakage outside the computational qubit space while simultaneously ensuring robustness against unknown inhomogeneities in control parameters. It is based on a reformulation of the Derivative Removal by Adiabatic Gate (DRAG) technique which allows for the full incorporation of control pulses originally designed for two-level models by using the iterative quantum Kolmogorov-Arnold-Moser (KAM) algorithm. We apply it for optimal robust control designed by inverse optimization (RIO), referred to as RDK pulses. We analyze the performance of RDK pulses on various durations, iterations, and robustness types. We show that the two-level robustness is restored after only a few iterations with an asymptotic exponential approximation (i.e. as a superasymptotic series), even for relatively short pulse durations and that the resulting pulses are near optimal in terms of energy compared to the optimal RIO pulses defined in the qubit subspace. Such pulses are well suited for superconducting transmons as well as other forms of qubits embedded in a multi-level structure. By effectively reproducing a two-level dynamics within a multi-level system, this approach is versatile thanks to its compatibility with two-level control strategies under conditions (smoothness, duration) that are analyzed.", "url": "https://arxiv.org/abs/2611.07802", "type": "理论+数值", "summary": "我们引入了一种多鲁棒量子控制策略，旨在抑制计算量子位空间之外的多级泄漏，同时确保针对控制参数中未知不均匀性的鲁棒性。它基于绝热门导数去除 (DRAG) 技术的重新表述，该技术允许通过使用迭代量子 Kolmogorov-Arnold-Moser (KAM) 算法完全结合最初为两级模型设计的控制脉冲。我们将其应用于通过逆优化（RIO）设计的最佳鲁棒控制，称为RDK脉冲。我们分析了 RDK 脉冲在不同持续时间、迭代和鲁棒性类型上的性能。我们证明，即使对于相对较短的脉冲持续时间，仅使用渐近指数近似（即作为超渐近级数）进行几次迭代后，两级鲁棒性就可以恢复，并且与量子位子空间中定义的最佳 RIO 脉冲相比，所得脉冲在能量方面接近最佳。这种脉冲非常适合超导传输以及嵌入多层结构中的其他形式的量子位。\n\n通过在多级系统中有效地再现两级动态，该方法具有多种用途，因为它在分析的条件（平滑度、持续时间）下与两级控制策略兼容。", "authors": [{"name": "Meri Harutyunyan"}, {"name": "Stéphane Guérin"}], "featured_authors": [{"name": "Meri Harutyunyan"}, {"name": "Stéphane Guérin"}], "author_count": 2}, {"id": "2611.07861", "category": "quant-ph", "title": "Continuous variable payload transmitter for the SPOQC mission", "abstract": "The continuous variable (CV) quantum key distribution (QKD) scheme enables two parties to share a secret key separated by a certain distance. Here we propose, design, build, test and show results of a CV payload transmitter, intended to demonstrate downlink based QKD from a CubeSat in low earth orbit. This is part of the SPOQC mission by Quantum Communications Hub, UK which was successfully launched on March 2026.", "url": "https://arxiv.org/abs/2611.07861", "type": "理论", "summary": "连续变量（CV）量子密钥分发（QKD）方案使相隔一定距离的两方共享密钥。在这里，我们提出、设计、建造、测试并展示了 CV 有效载荷发射机的结果，旨在演示近地轨道立方体卫星的基于下行链路的 QKD。这是英国量子通信中心于 2026 年 3 月成功启动的 SPOQC 任务的一部分。", "authors": [{"name": "Vinod N. Rao"}, {"name": "Killian Murphy"}, {"name": "Timothy Ayers"}, {"name": "Fadi Ahwal"}, {"name": "Timothy P. Spiller"}, {"name": "Rupesh Kumar"}], "featured_authors": [{"name": "Vinod N. Rao"}, {"name": "Killian Murphy"}, {"name": "Timothy Ayers"}, {"name": "Fadi Ahwal"}, {"name": "Timothy P. Spiller"}, {"name": "Rupesh Kumar"}], "author_count": 6}, {"id": "2611.08025", "category": "quant-ph", "title": "From maximum work to maximum power in an optimally controlled quantum Ising Otto engine", "abstract": "In finite-time quantum Otto engines, maximizing power requires balancing the duration of the unitary strokes against the losses from nonadiabatic excitations. We address this trade-off in an Otto engine with a free-fermion working medium, using quantum optimal control. Having determined the single-particle energy scales that maximize ideal work at fixed reservoir temperatures, we realize them as the two endpoint Hamiltonians of a transverse-field Ising chain, connected by a path that crosses the quantum critical point. Optimal control of the unitary strokes yields near-ideal work on a time scale growing linearly with system size, instead of quadratically as for linear driving. We derive a time-rescaling relation that maps protocols with different energy scales onto a single reference problem and, for complete thermalization strokes of fixed duration, use it to build an analytical model of the cycle power. The model predicts two competing maximum-power regimes: a slow branch that approaches the ideal work, and a fast, size-independent branch that trades work for a shorter cycle and dominates above a crossover size, in quantitative agreement with numerical optimal-control results. It also identifies power-optimal energy scales that differ from the work-optimal ones and further increase the power. Our results provide a predictive approach to jointly optimizing the operating conditions and finite-time dynamics of quantum heat engines.", "url": "https://arxiv.org/abs/2611.08025", "type": "理论+数值", "summary": "在有限时间量子奥托发动机中，最大化功率需要平衡单一冲程的持续时间与非绝热激励的损失。我们使用量子最优控制在具有自由费米子工作介质的奥托发动机中解决了这种权衡问题。在确定了在固定储层温度下最大化理想功的单粒子能量尺度后，我们将它们实现为横向场伊辛链的两个端点哈密顿量，通过穿过量子临界点的路径连接。单一冲程的最佳控制在随系统尺寸线性增长的时间尺度上产生近乎理想的工作，而不是像线性驱动那样以二次方增长。我们推导出时间重新缩放关系，将具有不同能量尺度的协议映射到单个参考问题上，并且对于固定持续时间的完整热化冲程，使用它来构建循环功率的分析模型。该模型预测了两种相互竞争的最大功率状态：一个接近理想功的慢速分支，以及一个快速、与尺寸无关的分支，该分支以更短的周期交换功，并在交叉尺寸之上占据主导地位，与数值最优控制结果在数量上一致。\n\n它还可以识别与工作最佳能量等级不同的功率最佳能量等级，并进一步增加功率。我们的结果提供了一种联合优化量子热机的操作条件和有限时间动力学的预测方法。", "authors": [{"name": "Vincenzo Roberto Arezzo"}, {"name": "Davide Rossini"}, {"name": "Giuseppe E. Santoro"}, {"name": "Giulia Piccitto"}], "featured_authors": [{"name": "Vincenzo Roberto Arezzo"}, {"name": "Davide Rossini"}, {"name": "Giuseppe E. Santoro"}, {"name": "Giulia Piccitto"}], "author_count": 4}, {"id": "2611.08040", "category": "quant-ph", "title": "Effective Thermodynamics of a Volume-Dependent Qubit", "abstract": "We develop an effective thermodynamics for a qubit whose energy gap depends inversely on a volume-like control parameter, $\\Delta(V)=\\Delta_0/V$, where $V$ is a spectral-control coordinate rather than a literal mechanical volume. Starting from the canonical Gibbs state, we derive a complete thermodynamic structure from the Helmholtz potential and its Legendre and stability properties, including the fundamental relation $S(U,V)$, a generalized pressure conjugate to $V$, the equation of state $U=PV$, the first law, and the associated Maxwell relations. Reversible adiabats preserve the Gibbs populations and satisfy $TV=\\mathrm{const.}$ and $PV^2=\\mathrm{const.}$, corresponding to an effective exponent $\\gamma=2$. The resulting effective Carnot cycle attains the Carnot efficiency, $\\eta_{\\mathrm{Carnot}}=1-T_C/T_H$, whereas the Otto cycle yields $\\eta_{\\mathrm{Otto}}=1-V_{\\min}/V_{\\max}$ and remains strictly sub-Carnot at finite work output. We identify the source of Otto irreversibility exactly: entropy is produced entirely during the isochoric thermalizations, and the cycle entropy production quantifies the informational mismatch between the adiabatically transported states and the reservoir-selected Gibbs states through the sum of the corresponding quantum relative entropies. Finally, we show that unitary-generated nonpassivity can act as a nonequilibrium battery, producing an apparent efficiency above Carnot when its preparation cost is omitted. At the same time, complete work accounting restores the thermodynamic bound.", "url": "https://arxiv.org/abs/2611.08040", "type": "理论", "summary": "我们为量子位开发了一种有效的热力学，其能隙与体积控制参数 $\\Delta(V)=\\Delta_0/V$ 成反比，其中 $V$ 是光谱控制坐标而不是字面机械体积。从正则吉布斯态开始，我们从亥姆霍兹势及其勒让德和稳定性特性推导出完整的热力学结构，包括基本关系 $S(U,V)$、广义压力共轭 $V$、状态方程 $U=PV$、第一定律以及相关的麦克斯韦关系。可逆绝热保留吉布斯种群并满足 $TV=\\mathrm{const.}$ 和 $PV^2=\\mathrm{const.}$，对应于有效指数 $\\gamma=2$。由此产生的有效卡诺循环达到卡诺效率$\\eta_{\\mathrm{Carnot}}=1-T_C/T_H$，而奥托循环产生$\\eta_{\\mathrm{Otto}}=1-V_{\\min}/V_{\\max}$，并在有限功输出下严格保持亚卡诺效率。\n\n我们准确地识别了奥托不可逆性的根源：熵完全在等容热化过程中产生，循环熵产生通过相应量子相对熵的总和来量化绝热传输态与储层选择吉布斯态之间的信息不匹配。最后，我们证明单一生成的非被动性可以充当非平衡电池，在忽略其制备成本时产生高于卡诺的明显效率。同时，完整的工作核算恢复了热力学界限。", "authors": [{"name": "André T. Cesário"}, {"name": "Marcela Herrera"}], "featured_authors": [{"name": "André T. Cesário"}, {"name": "Marcela Herrera"}], "author_count": 2}, {"id": "2611.08058", "category": "quant-ph", "title": "Coupling between molecular exchange qubits", "abstract": "Spin triangles are promising systems for defining and manipulating scalar degrees of freedom, such as chirality, partial spin sums, or combinations between the two. Here we extend this analysis to dimers formed by pairs of spin triangles, coupled by exchange or dipolar interactions. We show that the weak-coupling limit warrants the introduction of an effective two-qubit picture, and derive the expressions of the related Hamiltonians as a function of the underlying physical interaction between the triangles. We benchmark this two-qubit Hamiltonian against the microscopic one, and discuss the observable effects of the inter-triangle coupling on the spin-electric transitions between states with different chiralities or partial-spin sums.", "url": "https://arxiv.org/abs/2611.08058", "type": "理论", "summary": "自旋三角形是用于定义和操纵标量自由度（例如手性、部分自旋和或两者之间的组合）的有前途的系统。在这里，我们将此分析扩展到由自旋三角形对形成的二聚体，通过交换或偶极相互作用耦合。我们证明了弱耦合极限需要引入有效的双量子位图，并推导出相关哈密顿量的表达式作为三角形之间潜在物理相互作用的函数。我们将这个双量子位哈密顿量与微观哈密顿量进行基准比较，并讨论三角形间耦合对具有不同手性或部分自旋和的状态之间的自旋电跃迁的可观察影响。", "authors": [{"name": "Filippo Troiani"}, {"name": "Jason S. R. McCoombs"}, {"name": "Athanassios K. Boudalis"}], "featured_authors": [{"name": "Filippo Troiani"}, {"name": "Jason S. R. McCoombs"}, {"name": "Athanassios K. Boudalis"}], "author_count": 3}, {"id": "2611.08064", "category": "quant-ph", "title": "Exponential mixing time for the Davies dynamics of the quantum random energy model", "abstract": "We prove exponentially slow thermalization for the quantum random energy model (QREM) under Davies dynamics. The QREM is the $n$-qubit Hamiltonian $H=\\Gamma T+U$, where $U$ assigns independent Gaussian energies with variance equal to the system size to computational-basis configurations and $T$ is the transverse field generated by single-qubit Pauli $X$ operators. Let $\\beta_c=\\sqrt{2\\log 2}$ be the freezing inverse temperature of the classical random energy model. For every inverse temperature $\\beta>\\beta_c$ and every transverse-field strength $0\\leq\\Gamma<\\Gamma_c(\\beta)$, where $e^{\\beta\\beta_c}=2\\cosh(\\beta\\Gamma_c(\\beta))$, we show that the mixing time of the dissipative Davies dynamics associated with single-qubit Pauli system--bath couplings grows exponentially with the system size, almost surely; the bound is unchanged if the standard zero-Bohr-frequency dephasing terms are included. The result is uniform over all Davies rates satisfying detailed balance and a polynomial upper bound and does not assume primitivity. In the spin-glass phase, the Gibbs weight is carried by a sparse family of deep classical configurations that are separated by an extensive Hamming distance. A localization theorem for the QREM [Manai, Warzel, Comm. Math. Phys. 402, 1259 (2023)] transfers this geometry to the corresponding low-energy quantum eigenstates. Consequently, the Gibbs weight of the intermediate spectral sector is exponentially small, while single-qubit bath operators have exponentially small matrix elements between the two macroscopic sides of the bottleneck. A Davies-specific flux estimate then converts these two facts into an exponential lower bound on the mixing time. This gives a rigorous open-system dynamical manifestation of the frozen, localized low-energy structure of the QREM throughout its equilibrium spin-glass phase below the quantum transition line.", "url": "https://arxiv.org/abs/2611.08064", "type": "理论", "summary": "We prove exponentially slow thermalization for the quantum random energy model (QREM) under Davies dynamics. QREM 是 $n$ 量子位哈密顿量 $H=\\Gamma T+U$，其中 $U$ 将方差等于系统大小的独立高斯能量分配给计算基础配置，$T$ 是由单量子位保利 $X$ 运算符生成的横向场。 Let $\\beta_c=\\sqrt{2\\log 2}$ be the freezing inverse temperature of the classical random energy model.对于每个逆温度 $\\beta>\\beta_c$ 和每个横向场强度 $0\\leq\\Gamma<\\Gamma_c(\\beta)$，其中 $e^{\\beta\\beta_c}=2\\cosh(\\beta\\Gamma_c(\\beta))$，我们表明与单量子位泡利系统相关的耗散戴维斯动力学的混合时间随系统尺寸呈指数增长，几乎可以肯定；如果包括标准零玻尔频率相移项，则界限不变。 The result is uniform over all Davies rates satisfying detailed balance and a polynomial upper bound and does not assume primitivity.在自旋玻璃相中，吉布斯权重由稀疏的深层经典构型家族承载，这些经典构型之间有很大的汉明距离。\n\nQREM 的定位定理 [Manai, Warzel, Comm.数学。物理。 402, 1259 (2023)]将此几何形状转移到相应的低能量子本征态。因此，中间光谱部分的吉布斯权重呈指数小，而单量子位浴算子在瓶颈的两个宏观侧之间具有指数小矩阵元素。然后，戴维斯特定通量估计将这两个事实转换为混合时间的指数下限。这给出了量子跃迁线以下整个平衡自旋玻璃相中 QREM 的冻结、局域低能结构的严格开放系统动力学表现。", "authors": [{"name": "Giacomo De Palma"}, {"name": "Emanuele Mingione"}], "featured_authors": [{"name": "Giacomo De Palma"}, {"name": "Emanuele Mingione"}], "author_count": 2}, {"id": "2611.08107", "category": "quant-ph", "title": "Semi-Analytical Geometric Synthesis of Robust Quantum Controls", "abstract": "High-fidelity quantum gates are a central requirement for fault-tolerant quantum computation, yet their implementation is limited by the sensitivity of qubits to environmental noise and by control non-idealities. To mitigate these effects, quantum gates can be designed as dynamically corrected gates (DCGs), where control sequences are engineered to suppress the impact of errors on the resulting operation. Many methods in the literature are able to synthesize DCGs, but they typically rely on numerical optimization, with synthesis times on the order of minutes per gate. Here, we propose an automated semi-analytical method that reduces this cost by orders of magnitude, synthesizing smooth, robust control pulses in tens of milliseconds rather than minutes, with comparable fidelity and robustness. Our approach is based on the Space Curve Quantum Control (SCQC) formalism, where quantum evolution is mapped onto a geometric space curve whose geometric properties determine the target gate and its robustness. We parameterize the curve in the Frenet-Serret frame and employ the Pontryagin Maximum Principle (PMP) to design controls that are robust against both amplitude and dephasing errors. The PMP is formulated as a boundary-value problem and solved using a shooting method. The Frenet-Serret frame is integrated using Rodrigues' formula. Starting from a reference solution, we gradually vary the target rotation angle to construct a library of solutions, whose interpolation provides initial guesses for the shooting parameters of new target gates. We evaluated the method on 2,000 single-qubit rotations, obtaining a mean local optimization time of 39.945 ms per gate after preparation of the interpolation base. Quantum propagation yielded nominal gate infidelities below 10^-9 after virtual phase correction, with verified robustness against quasistatic amplitude and dephasing errors.", "url": "https://arxiv.org/abs/2611.08107", "type": "理论+数值", "summary": "高保真量子门是容错量子计算的核心要求，但其实现受到量子位对环境噪声的敏感性和控制非理想性的限制。为了减轻这些影响，量子门可以设计为动态校正门（DCG），其中控制序列被设计为抑制错误对结果操作的影响。文献中的许多方法都能够合成 DCG，但它们通常依赖于数值优化，每个门的合成时间约为分钟。在这里，我们提出了一种自动化的半分析方法，可以将成本降低几个数量级，在数十毫秒而不是几分钟内合成平滑、鲁棒的控制脉冲，并具有相当的保真度和鲁棒性。我们的方法基于空间曲线量子控制（SCQC）形式，其中量子演化被映射到几何空间曲线上，其几何特性决定了目标门及其鲁棒性。我们对 Frenet-Serret 框架中的曲线进行参数化，并采用庞特里亚金极大值原理 (PMP) 来设计对幅度和相移误差都具有鲁棒性的控制。\n\nPMP 被表述为边值问题并使用射击法求解。 Frenet-Serret 框架采用 Rodrigues 公式集成。从参考解开始，我们逐渐改变目标旋转角度以构建解库，其插值为新目标门的射击参数提供初始猜测。我们在 2,000 个单量子位旋转上评估了该方法，在准备插值基础后获得了每个门 39.945 毫秒的平均局部优化时间。虚拟相位校正后，量子传播产生低于 10^-9 的标称门不保真度，并验证了针对准静态幅度和移相误差的鲁棒性。", "authors": [{"name": "Eduardo Willwock Lussi"}, {"name": "Rafael de Santiago"}, {"name": "Eduardo Inacio Duzzioni"}, {"name": "Hector Bessa Silveira"}], "featured_authors": [{"name": "Eduardo Willwock Lussi"}, {"name": "Rafael de Santiago"}, {"name": "Eduardo Inacio Duzzioni"}, {"name": "Hector Bessa Silveira"}], "author_count": 4}, {"id": "2611.08129", "category": "quant-ph", "title": "Accelerating Quantum-Classical Auxiliary-Field Quantum Monte Carlo with Shadow-Trained Neural Quantum States", "abstract": "Quantum-classical auxiliary-field quantum Monte Carlo (QC-AFQMC) uses a trial state prepared on a quantum computer to improve the accuracy of the classical AFQMC algorithm. State-of-the-art QC-AFQMC represents this state with matchgate shadows, so every trial-walker overlap and local energy must be averaged over many snapshots, making this classical computation a bottleneck. Here we distill the matchgate shadow data into a symmetry-constrained, noise-aware, autoregressive transformer neural quantum state (NQS). Used as the AFQMC trial state, the NQS evaluates overlaps, force biases, and local energies without repeatedly summing over the matchgate shadows. For a nickel-catalyzed oxidative-addition reaction, the noise-awareness of our NQS design successfully recovers the ideal-upCCD AFQMC barrier and reaction energy within statistical uncertainty, while standard QC-AFQMC execution with the same shadow data yields qualitatively inaccurate results as a result of hardware noise. Since the shadow data are needed only for training, the estimated classical cost for the nickel system falls by approximately 99% relative to our previous QC-AFQMC implementation.", "url": "https://arxiv.org/abs/2611.08129", "type": "理论+数值", "summary": "量子经典辅助场量子蒙特卡罗（QC-AFQMC）利用量子计算机上准备的试验状态来提高经典AFQMC算法的精度。最先进的 QC-AFQMC 用匹配门阴影表示这种状态，因此每个试验步行器重叠和局部能量必须在许多快照上进行平均，从而使这种经典计算成为瓶颈。在这里，我们将匹配门阴影数据提炼为对称约束、噪声感知、自回归变压器神经量子态 (NQS)。用作 AFQMC 试验状态时，NQS 评估重叠、力偏差和局部能量，而无需对匹配门阴影进行重复求和。对于镍催化氧化加成反应，我们的 NQS 设计的噪声感知功能成功地在统计不确定性内恢复了理想的 upCCD AFQMC 势垒和反应能量，而使用相同阴影数据执行标准 QC-AFQMC 会因硬件噪声而产生定性不准确的结果。由于影子数据仅用于训练，因此镍系统的估计经典成本相对于我们之前的 QC-AFQMC 实施降低了约 99%。", "authors": [{"name": "Justin Provazza"}, {"name": "Oliver Knitter"}, {"name": "Joshua Goings"}, {"name": "Evgeny Epifanovsky"}, {"name": "Chi Chen"}, {"name": "Martin Roetteler"}, {"name": "Luning Zhao"}], "featured_authors": [{"name": "Justin Provazza"}, {"name": "Oliver Knitter"}, {"name": "Joshua Goings"}, {"name": "Chi Chen"}, {"name": "Martin Roetteler"}, {"name": "Luning Zhao"}], "author_count": 7}, {"id": "2611.08235", "category": "quant-ph", "title": "Persistent level-resolved transmon population after dispersive readout, and the limits of its open-system description", "abstract": "We calculate the level-resolved transmon population remaining after dispersive readout with a converged open-system model. The drive and qubit-cavity coupling use the rotating-wave approximation, while the cavity is a quantized mode in a frame displaced by its classical trajectory. At a readout occupation of 80, the model leaves a persistent distribution across the first transmon levels, with p2 = 1.02 x 10^-3 and p3 = 4.10 x 10^-5 at the end of readout. These populations survive an additional drive-off wait: over 73 ns each level decays by less than 3 percent and follows its own relaxation rate, not the near-factor-of-two drop in residual cavity photons. This identifies the population as bare-level occupation rather than coherent dressing. Channel-removal and bath-model controls attribute p2 mainly to dephasing and p3 and above mainly to relaxation, unchanged across bath models though absolute values vary by up to 15 percent. We also test the coherent drive truncation. In dissipation-free transmon-only benchmarks driven by the classical cavity trajectory, the nearest-neighbour RWA drive underestimates the full charge-operator result while the drive is on. At switch-off for occupation 80, where coherent populations are hundreds of times larger than the residual values, p2(RWA)/p2(full) = 0.905 and p3(RWA)/p3(full) = 0.759, with larger discrepancies at deeper levels. One source is a parity-allowed non-nearest-neighbour charge matrix element omitted by the drive operator. A naive beyond-RWA extension with bare-basis Lindblad dissipators fails a zero-drive ground-state test and serves only as a diagnostic. A dressed-basis (secular) construction instead leaves the dressed ground state stationary at zero drive. The result is a converged RWA prediction of readout-induced population plus direct tests of where the approximation loses quantitative reliability.", "url": "https://arxiv.org/abs/2611.08235", "type": "理论+数值", "summary": "我们使用融合的开放系统模型计算分散读出后剩余的水平分辨跨mon群体。驱动和量子位-腔耦合使用旋转波近似，而腔是由其经典轨迹位移的框架中的量子化模式。在读出占用为 80 时，模型在第一个传输级上留下持久分布，读出结束时 p2 = 1.02 x 10^-3 和 p3 = 4.10 x 10^-5。这些群体在额外的驱动等待中幸存下来：超过 73 ns，每个能级衰减不到 3%，并遵循其自己的弛豫率，而不是残余腔光子的近两倍下降。这表明人们的职业是赤裸裸的，而不是连贯的穿着。通道移除和浴模型控制将 p2 主要归因于相移，而 p3 及以上主要归因于松弛，尽管绝对值变化高达 15%，但在浴模型中没有变化。我们还测试了相干驱动截断。在由经典腔轨迹驱动的无耗散传输仅基准测试中，最近邻 RWA 驱动器在驱动器开启时低估了完全充电算子结果。\n\n在职业 80 关闭时，相干总体比残差值大数百倍，p2(RWA)/p2(full) = 0.905 和 p3(RWA)/p3(full) = 0.759，更深层次的差异更大。一种来源是驱动操作员省略的奇偶校验允许的非最近邻电荷矩阵元素。使用裸基础 Lindblad 耗散器的幼稚超越 RWA 扩展未能通过零驱动基态测试，并且仅用作诊断。相反，修饰基础（世俗）结构使修饰基态在零驱动下保持静止。结果是对读出引起的总体进行收敛的 RWA 预测，加上对近似值失去定量可靠性的直接测试。", "authors": [{"name": "Sinan Bugu"}], "featured_authors": [{"name": "Sinan Bugu"}], "author_count": 1}, {"id": "2611.08242", "category": "quant-ph", "title": "Finite-Time Thermodynamic Routing in an Anharmonic Collective Quantum Otto Engine", "abstract": "The Gibbs state determined by a thermal reservoir does not determine how a working medium approaches it or how fluctuations accumulate over repeated cycles. We exploit this kinetic freedom in an anharmonic collective quantum Otto engine. A longitudinal interaction separates neighboring Dicke transition frequencies without changing their collective matrix elements, allowing passive spectral shaping to route finite-time transport among edges with different heat costs while preserving the contact Gibbs states. Exact edge-current identities and repeated-cycle counting statistics link this routing to mean work, hot heat, and intercycle work correlations. At fixed thermal-contact exposure, structured reservoirs can increase both mean work and long-time squared precision; equal-work controls distinguish these gains from uniform relaxation-rate changes. The useful regime is mesoscopic, bounded by spectral resolution and physical contact time. An equal-cooling example and a full-spin local-noise study test the mechanism beyond ideal engine operation, the latter retaining a one-cycle precision gain despite spin-sector mixing. In a six-transmon dressed-spectrum model, passive microwave filters at fixed integrated coupling achieve equal mean work with shorter thermal contacts, corresponding to higher contact-time-normalized output, and with long-time squared precision comparable to that of the fastest sampled flat reference. The transition pathways selected by a passive reservoir thus provide a control variable for finite-time performance and accumulated work fluctuations that is independent of thermal equilibrium.", "url": "https://arxiv.org/abs/2611.08242", "type": "理论", "summary": "由热储层确定的吉布斯状态并不能确定工作介质如何接近它或波动如何在重复循环中累积。我们在非谐集体量子奥托发动机中利用了这种动力学自由度。纵向相互作用将相邻的迪克跃迁频率分开，而不改变它们的集体矩阵元素，从而允许无源光谱整形在具有不同热成本的边缘之间路由有限时间传输，同时保留接触吉布斯状态。精确的边缘电流标识和重复周期计数统计将该路由与平均功、热热量和周期间功相关性联系起来。在固定热接触暴露下，结构化储层可以提高平均功和长期平方精度；等功控制将这些增益与均匀弛豫率变化区分开来。有用的状态是介观的，受光谱分辨率和物理接触时间的限制。等冷却示例和全旋转局部噪声研究测试了超出理想发动机运行的机制，后者尽管存在自旋扇区混合，但仍保留单周期精度增益。\n\n在六传输器修饰频谱模型中，固定集成耦合的无源微波滤波器以更短的热接触实现相同的平均功，对应于更高的接触时间归一化输出，并且具有与最快采样平坦参考相当的长时平方精度。因此，被动储层选择的过渡路径为有限时间性能和与热平衡无关的累积功波动提供了控制变量。", "authors": [{"name": "Gabriella G. Damas"}, {"name": "G. D. de Moraes Neto"}], "featured_authors": [{"name": "Gabriella G. Damas"}, {"name": "G. D. de Moraes Neto"}], "author_count": 2}, {"id": "2611.08247", "category": "quant-ph", "title": "Certifying quantum code and circuit distances at scale", "abstract": "Code and circuit distances characterize how strongly quantum error correction suppresses logical errors and guide code comparisons, schedule choices and resource estimates. Yet many published distances are only upper bounds from heuristic searches. Here, we express both distances as tropical partition functions and evaluate them with rank-based dynamic programming and weight-bounded search. Circuit reductions and relaxations shrink the problems, and proved lower bounds with explicit logical errors of matching weight certify exact values. On two benchmarks, our method certifies more instances than all other tested exact solvers combined. We certify distances for codes with up to 31,200 qubits, such as Google's modular hyperbolic codes, and for memory circuits with up to $8\\times10^5$ fault mechanisms, such as those of high-rate Cornucopia codes. Our audit of 26 recent papers identifies overestimated distances and non-tight upper bounds in 10 papers, with a maximum discrepancy of at least eight. Certified distances also guide circuit design and show which defective chips remain usable. In particular, we certify circuit distance 16 for IBM's two-gross memory circuits with the standard schedule, not the assumed 18, whereas redesigned schedules reach 18 at one noisy cycle, at the cost of one more timestep per cycle. At 99.98% junction yield, keeping gross-code memory blocks with dead checks that are certified at distance 10 or more raises the estimated usable share from 53% for perfect blocks alone to 94% with an improved schedule.", "url": "https://arxiv.org/abs/2611.08247", "type": "理论+数值", "summary": "代码和电路距离表征了量子纠错抑制逻辑错误的强度，并指导代码比较、时间表选择和资源估计。然而，许多公布的距离只是启发式搜索的上限。在这里，我们将这两个距离表示为热带分区函数，并使用基于排名的动态规划和权重限制搜索来评估它们。电路的减少和松弛缩小了问题，并证明了具有匹配权重的明确逻辑错误的下界，证明了精确值。在两个基准测试中，我们的方法认证的实例比所有其他经过测试的精确求解器的总和还要多。我们验证了最多 31,200 个量子位的代码（例如 Google 的模块化双曲线代码）以及最多 $8\\times10^5$ 故障机制的内存电路（例如高速 Cornucopia 代码的距离）的距离。我们对最近 26 篇论文的审计发现，其中 10 篇论文存在高估的距离和不严格的上限，最大差异至少为 8。经过认证的距离还可以指导电路设计并显示哪些有缺陷的芯片仍然可用。\n\n特别是，我们使用标准调度来验证 IBM 的两总内存电路的电路距离为 16，而不是假设的 18，而重新设计的调度在一个噪声周期达到 18，代价是每个周期多一个时间步长。在 99.98% 的结点良率下，通过在距离 10 或以上进行认证的死检查来保留总代码内存块，可以将估计的可用份额从单独完美块的 53% 提高到经过改进的时间表的 94%。", "authors": [{"name": "Bin Cheng"}, {"name": "Naixu Guo"}, {"name": "Feng Pan"}], "featured_authors": [{"name": "Bin Cheng"}, {"name": "Naixu Guo"}, {"name": "Feng Pan"}], "author_count": 3}, {"id": "2611.08293", "category": "quant-ph", "title": "Dualities in one-dimensional quantum lattice models: Lie groups, Schur-Weyl duality and symmetry breaking", "abstract": "We present a systematic framework for gauging continuous symmetries, and show that the Schur-Weyl duality arises naturally as a realization of this construction with open boundary conditions. Restricting to compact Lie group symmetries, we construct dual models for one-dimensional quantum lattice models exhibiting those symmetries. We demonstrate that matrix product operators enable the explicit construction of intertwiners between the dual theories and their (non-invertible) symmetries. With closed boundary conditions, we can relate the full spectrum of these dual theories by considering all possible twisted boundary this http URL illustrate how the Peter-Weyl transform appears when the duality acts on the boundary Hilbert space of a $G$-symmetric model. The presented framework generalizes previous work on dualities for unitary fusion category symmetric models. It exemplifies how dualities for both finite and continuous symmetries rely on the relation between a bond algebra and a representation of the symmetry in the lattice as double centralizers. We argue that dual non-invertible spontaneous symmetry breaking is the mechanism that underlies symmetric tensor network algorithms. We illustrate these results for $U(1)$- and $SU(2)$-symmetric quantum lattice models.", "url": "https://arxiv.org/abs/2611.08293", "type": "理论+数值", "summary": "我们提出了一个用于测量连续对称性的系统框架，并表明 Schur-Weyl 对偶性作为这种具有开放边界条件的构造的实现而自然出现。限制于紧致李群对称性，我们为表现出这些对称性的一维量子晶格模型构建了对偶模型。我们证明矩阵乘积算子能够显式构造对偶理论及其（不可逆）对称性之间的交织体。在封闭边界条件下，我们可以通过考虑所有可能的扭曲边界来关联这些对偶理论的全谱。此 http URL 说明了当对偶性作用于 $G$ 对称模型的边界希尔伯特空间时，Peter-Weyl 变换如何出现。所提出的框架概括了先前关于单一融合类别对称模型的对偶性的工作。它举例说明了有限对称性和连续对称性的对偶性如何依赖于键代数和晶格中作为双中心化子的对称性表示之间的关系。我们认为对偶不可逆自发对称性破缺是对称张量网络算法的基础机制。\n\n我们说明了 $U(1)$- 和 $SU(2)$-对称量子晶格模型的这些结果。", "authors": [{"name": "Dante Bosgoed"}, {"name": "Frank Verstraete"}, {"name": "Laurens Lootens"}], "featured_authors": [{"name": "Dante Bosgoed"}, {"name": "Frank Verstraete"}, {"name": "Laurens Lootens"}], "author_count": 3}, {"id": "2611.08298", "category": "quant-ph", "title": "Beyond Quantum Messages: Toward Quantum-Native Network Functioning", "abstract": "The Quantum Internet is commonly envisioned as a network that transports quantum states and distributes entanglement as the key resource underpinning distributed quantum applications. This view is necessary but incomplete if quantum phenomena are confined to what the network carries or manages, while network functionalities remain grounded predominantly in classical abstractions. This Perspective advances a broader thesis: quantum phenomena can also participate directly in the realization of network functionalities. We first establish the architectural baseline by introducing entanglement as a stateful network resource whose operational condition is non-locally distributed across remote nodes, evolves through manipulation or consumption, and degrades over time through decoherence. Its evolving state must therefore remain visible to the functionalities acting on it. We then move beyond resource visibility and use two mechanisms as proof points of a broader quantum-native functional design space: entanglement generation during propagation through coherent spatial-path superposition, and operational connectivity induced by shared entanglement that can depart from the physical graph. These examples show that paths, neighbors, or participating nodes may become operationally relevant in ways determined by quantum coherence and shared entanglement, rather than by physical connectivity alone. We identify Quantum Addressing as a transversal abstraction capable of representing such relations while complementing, rather than replacing, classical addressing and signaling. The resulting perspective broadens the Quantum Internet from transporting quantum information and distributing entanglement to exploiting quantum phenomena in network functioning, opening a coupled frontier spanning routing, forwarding, control, and functionality placement.", "url": "https://arxiv.org/abs/2611.08298", "type": "理论", "summary": "量子互联网通常被设想为一种传输量子态并分配纠缠的网络，作为支撑分布式量子应用的关键资源。如果量子现象仅限于网络承载或管理的内容，而网络功能仍然主要基于经典抽象，那么这种观点是必要的，但不完整。这一观点提出了一个更广泛的论点：量子现象也可以直接参与网络功能的实现。我们首先通过引入纠缠作为一种有状态的网络资源来建立架构基线，其运行条件非本地分布在远程节点上，通过操纵或消耗而演变，并通过退相干随着时间的推移而退化。因此，其不断发展的状态必须对作用于其上的功能保持可见。然后，我们超越资源可见性，并使用两种机制作为更广泛的量子原生功能设计空间的证明点：通过相干空间路径叠加传播过程中的纠缠生成，以及由可能偏离物理图的共享纠缠引起的操作连接性。\n\n这些例子表明，路径、邻居或参与节点可能会以由量子相干性和共享纠缠确定的方式变得在操作上相关，而不是仅仅通过物理连接来确定。我们将量子寻址视为一种横向抽象，能够表示这种关系，同时补充而不是取代经典寻址和信号发送。由此产生的观点将量子互联网从传输量子信息和分配纠缠扩展到利用网络功能中的量子现象，打开跨越路由、转发、控制和功能放置的耦合前沿。", "authors": [{"name": "Angela Sara Cacciapuoti"}, {"name": "Jessica Illiano"}, {"name": "Caterina De Risi"}, {"name": "Marcello Caleffi"}], "featured_authors": [{"name": "Angela Sara Cacciapuoti"}, {"name": "Jessica Illiano"}, {"name": "Caterina De Risi"}, {"name": "Marcello Caleffi"}], "author_count": 4}, {"id": "2611.08396", "category": "quant-ph", "title": "Recalibration-Aware Optimization of ZEFOZ Operating Points in $^{167}\\mathrm{Er}^{3+}:\\mathrm{Y}_2\\mathrm{SiO}_5$ for Quantum Memories", "abstract": "Erbium-doped solids like $^{167}\\mathrm{Er}^{3+}:\\mathrm{Y}_2\\mathrm{SiO}_5$ have properties that make them suitable for quantum-network memories, however, their unquenched effective electronic spin causes rapid magnetic decoherence. Operating at Zero First-Order Zeeman (ZEFOZ) points allows us to mitigate this, where we evaluate the ZEFOZ landscape for Site-2 $^{167}\\mathrm{Er}^{3+}$ by incorporating a full-Hessian spin-Hamiltonian treatment with the anisotropic magnetic-field covariance derived from the native $^{89}\\mathrm{Y}$ crystal lattice directly. Operating-point screening criteria were adopted to devise a Pareto-optimal frontier of four transition pairs to balance modeled Y-only magnetic pure-dephasing lifetimes ($T_{\\phi,Y}^{(2)}$) against microwave control authority. The $\\epsilon_{14}\\leftrightarrow\\epsilon_{15}$ transition exhibits the longest modeled Y-bath-induced quadratic pure-dephasing time, $T_{\\phi,Y}^{(2)}>2.2\\times10^5~\\mathrm{s}$, while the $\\epsilon_{12}\\leftrightarrow\\epsilon_{13}$ transition stood out, achieving a Rabi frequency coefficient of $1.248 \\times 10^5~\\mathrm{Hz/mT}$. An assumption-based Hamiltonian-uncertainty analysis demonstrates that while uncompensated deviations shift the ZEFOZ condition away from its nominal magnetic-field coordinate, the shifted operating points can be recovered via numerical vector-field recalibration. The Pareto-optimal coordinates were mathematically recovered for all sampled Hamiltonian perturbations, and the $84.1^{\\mathrm{st}}$-percentile field relocations ranged from $10.95$ to $27.97~\\mathrm{mT}$. The intended operation near $10~\\mathrm{mK}$ must be taken into account for the suppression of Er-induced spectral diffusion through electronic-spin polarization, while the extended Y-bath pure-dephasing timescales also remain conditional on the adopted temporal-correlation model.", "url": "https://arxiv.org/abs/2611.08396", "type": "理论+数值", "summary": "像$^{167}\\mathrm{Er}^{3+}:\\mathrm{Y}_2\\mathrm{SiO}_5$这样的掺铒固体具有使其适合量子网络存储器的特性，然而，它们未淬灭的有效电子自旋会导致快速的磁退相干。在零一阶塞曼 (ZEFOZ) 点上操作使我们能够缓解这一问题，我们通过将全 Hessian 自旋哈密尔顿处理与直接源自原生 $^{89}\\mathrm{Y}$ 晶格的各向异性磁场协方差结合起来，评估 Site-2 $^{167}\\mathrm{Er}^{3+}$ 的 ZEFOZ 景观。采用工作点筛选标准来设计四个过渡对的帕累托最优前沿，以平衡建模的仅 Y 磁纯相移相寿命 ($T_{\\phi,Y}^{(2)}$) 与微波控制权威。 $\\epsilon_{14}\\leftrightarrow\\epsilon_{15}$ 过渡表现出最长的建模 Y 浴引起的二次纯相移时间，$T_{\\phi,Y}^{(2)}>2.2\\times10^5~\\mathrm{s}$，而 $\\epsilon_{12}\\leftrightarrow\\epsilon_{13}$ 过渡脱颖而出，实现了 Rabi frequency coefficient of $1.248 \\times 10^5~\\mathrm{Hz/mT}$.\n\n基于假设的哈密顿不确定性分析表明，虽然未补偿的偏差使 ZEFOZ 条件偏离其标称磁场坐标，但可以通过数值矢量场重新校准来恢复移动的工作点。对于所有采样的哈密顿扰动，都以数学方式恢复了帕累托最优坐标，并且 $84.1^{\\mathrm{st}}$ 百分位字段重定位范围为 $10.95$ 到 $27.97~\\mathrm{mT}$。为了通过电子自旋极化抑制铒引起的光谱扩散，必须考虑$10~\\mathrm{mK}$附近的预期操作，而扩展的Y浴纯相移时间尺度也仍然以所采用的时间相关模型为条件。", "authors": [{"name": "Shashank Srivastava"}], "featured_authors": [{"name": "Shashank Srivastava"}], "author_count": 1}, {"id": "2611.08424", "category": "quant-ph", "title": "Disorder-blind Mpemba acceleration of quantum state preparation", "abstract": "Using the strong Mpemba effect to accelerate relaxation by initial-state design requires suppressing the slowest mode, which typically needs prior knowledge of the system. However, in disordered systems, this mode is sample-dependent, so a fixed preparation generally retains a slow-mode overlap. We show that a ``blind'' preparation, designed from the clean chain without knowledge of the disorder realisation or its distribution, can start farther from stationarity yet overtake a reference in typical samples of a dephased disordered XX chain. It requires only the chain geometry and the particle number. At strong dephasing, the density dynamics maps to a resistor chain, and an exact inverse-generator identity links the residual overlap to the spatial resistance profile. We find two distinct thresholds: a finite mean resistance suffices for diffusion, but the residual overlap decays as $L^{-1/2}$ with chain length $L$ only when the resistance variance is finite; rare weak links slow this decay. We predict the fraction of samples in which the blind preparation wins, which is an ensemble-level measure of its reliability. Finite-size calculations support both scaling regimes with interactions at strong dephasing. We give preparation circuits and a density readout for the residual overlap.", "url": "https://arxiv.org/abs/2611.08424", "type": "理论+数值", "summary": "通过初始状态设计使用强 Mpemba 效应来加速弛豫需要抑制最慢的模式，这通常需要系统的先验知识。 However, in disordered systems, this mode is sample-dependent, so a fixed preparation generally retains a slow-mode overlap.我们证明，在不了解无序实现或其分布的情况下从干净链设计的“盲”准备可以从平稳性开始更远，但在失相无序 XX 链的典型样本中超过参考。 It requires only the chain geometry and the particle number.在强相移时，密度动态映射到电阻链，并且精确的逆发生器恒等式将残余重叠与空间电阻分布联系起来。我们发现两个不同的阈值：有限的平均电阻足以进行扩散，但仅当电阻方差有限时，剩余重叠随着链长度 $L$ 衰减为 $L^{-1/2}$；罕见的薄弱环节会减缓这种衰退。 We predict the fraction of samples in which the blind preparation wins, which is an ensemble-level measure of its reliability.\n\n有限尺寸计算支持两种具有强相移相互作用的缩放机制。我们提供了准备电路和剩余重叠的密度读数。", "authors": [{"name": "M Nishanth"}, {"name": "Shreyas Sadugol"}, {"name": "Payman Mahmoudi"}, {"name": "Alexander Yosifov"}, {"name": "Aditya Iyer"}, {"name": "Roopayan Ghosh"}, {"name": "Jinzhao Sun"}], "featured_authors": [{"name": "M Nishanth"}, {"name": "Shreyas Sadugol"}, {"name": "Payman Mahmoudi"}, {"name": "Aditya Iyer"}, {"name": "Roopayan Ghosh"}, {"name": "Jinzhao Sun"}], "author_count": 7}, {"id": "2611.08488", "category": "quant-ph", "title": "Provable circuit-level thresholds for non-abelian topological phases", "abstract": "We provide an explicit scheme to realize a quantum memory in any 2D non-chiral topological order. For this, we construct syndrome extraction circuits based on the Turaev-Viro path integral as well as a classical algorithm for decoding on the fly. We prove that our scheme has a threshold under a local stochastic circuit-level noise model and discuss how to generalize it to implement topological logical gates.", "url": "https://arxiv.org/abs/2611.08488", "type": "理论+数值", "summary": "我们提供了一个显式方案来实现任何二维非手性拓扑顺序的量子存储器。 For this, we construct syndrome extraction circuits based on the Turaev-Viro path integral as well as a classical algorithm for decoding on the fly. We prove that our scheme has a threshold under a local stochastic circuit-level noise model and discuss how to generalize it to implement topological logical gates.", "authors": [{"name": "Yuanjie Ren"}, {"name": "Margarita Davydova"}, {"name": "Shankar Balasubramanian"}, {"name": "Andreas Bauer"}], "featured_authors": [{"name": "Yuanjie Ren"}, {"name": "Margarita Davydova"}, {"name": "Shankar Balasubramanian"}, {"name": "Andreas Bauer"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
