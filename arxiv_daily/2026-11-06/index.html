  <style>

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }

  <script>
    const papers = [{"id": "2611.06958", "category": "cond-mat", "title": "Where heat flows and where to change it: gauge-free sensitivity maps of thermal conductivity in disordered solids", "abstract": "Designing materials for thermal management requires knowing where heat flows, not only how much. Within harmonic (Allen$--$Feldman) theory we develop two local descriptions and test them on amorphous silicon. The first, a projection of the conductivity $\\kappa$ onto atoms, depends on how the potential energy is divided among atoms (a \"gauge\"); we find the dependence moderate, 23% of the map's spatial standard deviation at single sites and 9.5% over regions of radius 0.4 nm, apart from a uniform offset of 0.8% of $\\kappa$. The second avoids the division altogether. It is the exact response of $\\kappa$ to the mass of each atom and the stiffness of each bond, it obeys an Euler sum rule, and it contains the heat-flow map as one of three exact terms. In amorphous and paracrystalline silicon, with ACE, GAP-18 and Keating force constants, the two maps are anti-correlated: where little heat flows a heavier atom lowers $\\kappa$, and where much heat flows it tends to raise it. The explanation is local softness. The harmonic vibrational amplitude of each atom predicts both maps, and at room temperature the anti-correlation largely disappears at fixed amplitude, in a 32,768-atom replica as well; below about 100 K a component remains that softness does not capture. Thus soft regions, which carry little heat, act through the mixing of vibrational modes about 1$--$2 meV apart. In paracrystalline silicon the grains conduct more heat per atom, while the disordered matrix controls the response. Exact recalculations show that the response map guides the placement of dispersed substituents and locates the region that limits transport across an amorphous/crystalline interface.", "url": "https://arxiv.org/abs/2611.06958", "type": "理论+数值", "summary": "设计热管理材料需要了解热量流向何处，而不仅仅是热量流过多少。在调和（Allen$-$Feldman）理论中，我们开发了两个局部描述并在非晶硅上测试它们。第一个，电导率 $\\kappa$ 在原子上的投影，取决于势能如何在原子之间分配（“量规”）；我们发现依赖性中等，除了 $\\kappa$ 的 0.8% 的统一偏移量之外，单个地点的地图空间标准偏差为 23%，半径 0.4 nm 的区域为 9.5%。第二个完全避免了分裂。它是 $\\kappa$ 对每个原子的质量和每个键的刚度的精确响应，它遵循欧拉和规则，并且包含热流图作为三个精确项之一。在非晶硅和准晶硅中，对于 ACE、GAP-18 和基廷力常数，这两个图是反相关的：在热量流动较少的地方，较重的原子会降低 $\\kappa$，而在热量流动较多的地方，它往往会升高 $\\kappa$。解释是局部软化。\n\n每个原子的谐波振动幅度预测了这两个图，并且在室温下，反相关性在固定幅度处很大程度上消失，在 32,768 个原子的复制品中也是如此；低于约 100 K 时，仍存在柔软度无法捕获的成分。因此，携带很少热量的软区域通过相隔约 1--2 meV 的振动模式混合来发挥作用。在准晶硅中，晶粒每个原子传导更多的热量，而无序矩阵控制响应。精确的重新计算表明，响应图引导分散取代基的放置，并定位限制跨非晶/晶界面传输的区域。", "authors": [{"name": "D. A. Drabold"}, {"name": "C. Ugwumadu"}], "featured_authors": [{"name": "D. A. Drabold"}, {"name": "C. Ugwumadu"}], "author_count": 2}, {"id": "2611.07014", "category": "cond-mat", "title": "Stability and Relaxation of Electron-Phonon Systems at Strong Coupling", "abstract": "We study the kinetic properties of Migdal-Eliashberg theory (MET) for electron-phonon interactions at strong coupling. Previously, the system was found to be dynamically unstable at large couplings within a Markovian quantum Boltzmann approximation. Using the quasiclassical Kadanoff-Baym equation, we show that this instability is absent when non-Markovian effects are taken into account. We also analyze the long-time relaxation dynamics at strong-couplin, and find a clear imprint of the non-Markovian nature of the dynamics: in an intermediate temperature range between the Debye frequency and the coupling strength, the relaxation rate becomes linear in temperature with Planckian slope, while the leading relaxation mode acquires a large imaginary component, producing strongly oscillatory decay. Our results imply that any instability which preempts superconductivity must arise from effects beyond MET, such as phonon softening or polaronic effects at finite electronic bandwidth. This shows that the characteristic phonon frequency is not a fundamental bound on $T_c$, and leaves open a route to higher $T_c$ in multi-orbital electron-phonon systems.", "url": "https://arxiv.org/abs/2611.07014", "type": "理论", "summary": "我们研究了强耦合下电子-声子相互作用的 Migdal-Eliashberg 理论 (MET) 的动力学特性。此前，人们发现该系统在马尔可夫量子玻尔兹曼近似内的大耦合下动态不稳定。使用准经典卡达诺夫-贝姆方程，我们表明，当考虑非马尔可夫效应时，不存在这种不稳定性。我们还分析了强耦合处的长期弛豫动力学，并发现了动力学非马尔可夫性质的明显印记：在德拜频率和耦合强度之间的中间温度范围内，弛豫率与普朗克斜率随温度呈线性关系，而主导弛豫模式获得较大的虚部，产生强烈的振荡衰减。我们的结果表明，任何抢占超导性的不稳定性必定是由 MET 之外的效应引起的，例如有限电子带宽下的声子软化或极化效应。这表明特征声子频率不是 $T_c$ 的基本界限，并且为多轨道电子声子系统中更高的 $T_c$ 留下了一条途径。", "authors": [{"name": "Noga Bashan"}, {"name": "Erez Berg"}], "featured_authors": [{"name": "Noga Bashan"}, {"name": "Erez Berg"}], "author_count": 2}, {"id": "2611.07030", "category": "cond-mat", "title": "Agnostic and efficient detection of $\\mathbb{Z}_2$ symmetry-protected topological phases in projected entangled-pair states", "abstract": "Symmetry-protected topological (SPT) phases are the simplest example of quantum phases that cannot be detected by local order parameters. Their classification is by now well-established from multiple perspectives, a prominent one being via tensor network states. The practical question, however, is not mere classification, but detection: given the ground state of an interacting Hamiltonian and a symmetry group $G$ along with its representation, is there an efficient way to tell if the state is in a SPT phase with respect to $G$? While there exist such practical tests in one spatial dimension (1D), methods in 2D have so far been restricted to finite-size systems or require an explicit form of virtual symmetries of the tensor networks representing the ground state. Here, we develop an agnostic and efficient method to detect interacting $\\mathbb{Z}_2$ 2D SPT phases, using an infinite projected entangled-pair (PEPS) representation of the ground state. The method is agnostic to the symmetry representation in the virtual space of the PEPS tensor and applicable independent of the bond dimension of the tensors. Moreover, it is efficient as it does not require finite-size scalings: it works directly in the thermodynamic limit. We numerically demonstrate the procedure by mapping out phase boundaries away from fixed-point wavefunctions. We extract the SPT label cocycle data explicitly from the PEPS tensor.", "url": "https://arxiv.org/abs/2611.07030", "type": "理论+数值", "summary": "对称保护拓扑（SPT）相是无法通过局域序参数检测的量子相的最简单示例。到目前为止，他们的分类已经从多个角度得到了完善，其中一个突出的分类是通过张量网络状态。然而，实际问题不仅仅是分类，而是检测：给定相互作用的哈密顿量和对称群 $G$ 的基态及其表示，是否有一种有效的方法来判断该状态是否处于相对于 $G$ 的 SPT 阶段？虽然在一个空间维度（1D）中存在这样的实际测试，但迄今为止，2D 中的方法仅限于有限大小的系统，或者需要表示基态的张量网络的虚拟对称性的显式形式。在这里，我们开发了一种不可知且有效的方法来检测相互作用的 $\\mathbb{Z}_2$ 2D SPT 相，使用基态的无限投影纠缠对（PEPS）表示。该方法与 PEPS 张量虚拟空间中的对称表示无关，并且独立于张量的键维数而适用。\n\n此外，它是高效的，因为它不需要有限尺寸的缩放：它直接在热力学极限下工作。我们通过绘制远离定点波函数的相边界来数值演示该过程。我们从 PEPS 张量中明确提取 SPT 标签 cocycle 数据。", "authors": [{"name": "Alexandre Chaduteau"}, {"name": "Hao Chen"}, {"name": "Juraj Hasik"}, {"name": "Titus Neupert"}], "featured_authors": [{"name": "Alexandre Chaduteau"}, {"name": "Hao Chen"}, {"name": "Juraj Hasik"}, {"name": "Titus Neupert"}], "author_count": 4}, {"id": "2611.07038", "category": "cond-mat", "title": "Topological Transitions of Evanescent Waves", "abstract": "We study the band structure of evanescent waves, that is, the decaying or growing solutions that live within the gaps of tight-binding Hamiltonians. Although the underlying Hamiltonian is Hermitian, these modes carry complex wavevectors and therefore exhibit a non-Hermitian dispersion. Using the transfer matrix formalism in one dimension, we show that, in addition to the standard exceptional points that appear at the band edges, a different type of exceptional point can arise inside the gap, protected by spinless time-reversal symmetry. Tuning model parameters drives a topological transition where such in-gap exceptional points are nucleated in pairs, mediated by a crossing between purely imaginary momentum branches. We show that this spectral structure is diagnosed by a $\\mathbb{Z}_2$ index assigned to every energy inside the gap, with the in-gap exceptional points arising as its domain walls. A generic bound state in the system has a tail that is purely exponential when its energy lies between a band edge and the nearest exceptional point, but becomes oscillatory - with a wavevector differing from the band-edge momentum - when its energy lies between the pair of in-gap exceptional points. We illustrate these results using continuum and tight-binding models, as well as an anisotropic photonic crystal.", "url": "https://arxiv.org/abs/2611.07038", "type": "理论", "summary": "我们研究倏逝波的能带结构，即存在于紧束缚哈密顿量间隙内的衰减或增长的解。尽管底层的哈密顿量是厄米式的，但这些模式携带复杂的波矢，因此表现出非厄米式色散。使用一维转移矩阵形式，我们表明，除了出现在带边缘的标准异常点之外，在间隙内部还可能出现不同类型的异常点，并受到无自旋时间反转对称性的保护。调整模型参数可驱动拓扑转变，其中此类带隙异常点成对成核，由纯虚动量分支之间的交叉介导。我们表明，这种光谱结构是通过分配给间隙内每个能量的 $\\mathbb{Z}_2$ 索引来诊断的，间隙内的异常点作为其畴壁出现。\n\n当系统中的通用束缚态的能量位于带边缘和最近的异常点之间时，其尾部是纯指数的，但当其能量位于带内异常点对之间时，其尾部会变得振荡（波矢与带边缘动量不同）。我们使用连续介质和紧束缚模型以及各向异性光子晶体来说明这些结果。", "authors": [{"name": "Ignacio Pavez"}, {"name": "Tom Sheppard"}, {"name": "Yoonseok Hwang"}, {"name": "Hannah M. Price"}, {"name": "Frank Schindler"}], "featured_authors": [{"name": "Ignacio Pavez"}, {"name": "Tom Sheppard"}, {"name": "Yoonseok Hwang"}, {"name": "Hannah M. Price"}, {"name": "Frank Schindler"}], "author_count": 5}, {"id": "2611.07053", "category": "cond-mat", "title": "Langmuir kinetics and totally asymmetric volume exclusion in linear chains via Fock space formalism", "abstract": "Driven-diffusive systems combining spatial exclusion and bulk exchange, such as the totally asymmetric simple exclusion process coupled with Langmuir kinetics (TASEP-LK), serve as foundational models for particle transport in vehicular traffic, conveyor networks, and mesoscopic flow channels. In this work, we employ an exact Doi-Peliti field-theoretic operator formulation in Fock space to evaluate steady-state observables, continuous phase landscapes, and spatial correlations in finite linear chains up to $k = 16$. By introducing a decomposition in terms of biorthonormal eigenvectors for asymmetric non-Hermitian matrices, the stationary state is calculated directly from the kernel of the quasi-Hamiltonian, completely bypassing the computationally prohibitive complexity of full matrix diagonalization and time-dependent matrix exponentiation. Across distinct rate regimes and global parametric scans, our exact discrete calculations demonstrate that finite-size stochastic fluctuations naturally smear out singular domain walls, producing smooth density profiles and continuous phase crossovers. Finite-size scaling illustrates how local profiles systematically steepen toward the sharp domain wall predicted by continuum field theory as $k \\to \\infty$. Furthermore, two-point correlation analysis reveals that in slow-kinetics regimes, spatial fluctuations generate strong inter-site cumulants, causing standard mean-field approximations to systematically underestimate joint occupancy probabilities by 50\\%. These findings emphasize the necessity of analytical methods for modeling mesoscopic transport systems and short traffic corridors where local stochastic fluctuations and spatial correlations dominate the stationary dynamics.", "url": "https://arxiv.org/abs/2611.07053", "type": "理论+数值", "summary": "结合空间排斥和体积交换的驱动扩散系统，例如与朗缪尔动力学相结合的完全不对称简单排斥过程（TASEP-LK），可作为车辆交通、输送网络和介观流动通道中颗粒传输的基础模型。在这项工作中，我们在 Fock 空间中采用精确的 Doi-Peliti 场论算子公式来评估高达 $k = 16$ 的有限线性链中的稳态可观测量、连续相景观和空间相关性。通过引入非对称非厄米特矩阵的双正交特征向量的分解，直接从准哈密顿矩阵的核计算稳态，完全绕过全矩阵对角化和时间相关矩阵求幂的计算复杂性。在不同的速率机制和全局参数扫描中，我们精确的离散计算表明，有限大小的随机波动自然地消除了奇异的畴壁，产生平滑的密度分布和连续相交叉。\n\n有限尺寸缩放说明了局部轮廓如何系统地朝着连续介质场理论预测为 $k \\to \\infty$ 的尖锐畴壁倾斜。此外，两点相关分析表明，在慢动力学状态下，空间涨落会产生强烈的位点间累积量，导致标准平均场近似系统性地低估联合占据概率 50%。这些发现强调了对介观运输系统和短交通走廊进行建模的分析方法的必要性，其中局部随机波动和空间相关性主导了稳态动态。", "authors": [{"name": "Luis D. S. Silva"}, {"name": "Arthur M. S. Carvalho"}, {"name": "Francisco A. G. Almeida"}, {"name": "Gerson C. Duarte-Filho"}], "featured_authors": [{"name": "Luis D. S. Silva"}, {"name": "Arthur M. S. Carvalho"}, {"name": "Francisco A. G. Almeida"}, {"name": "Gerson C. Duarte-Filho"}], "author_count": 4}, {"id": "2611.07115", "category": "cond-mat", "title": "Nonequilibrium Spin-Glass Order in a Long-Range Quantum Ising Glass and Its Sensitivity to Noise", "abstract": "We study spin-glass order after a transverse-field quench in a long-range quantum Ising glass. The diagonal-ensemble Edwards-Anderson order coincides at the no-quench and zero-field endpoints, yet in between cold shells overshoot it and hot shells undershoot it. This stems from a competition in correlation space between the rigidity of populated eigenstates and the spread of their pair patterns. Under weak longitudinal dephasing the zero-field endpoint is exactly pinned while the characteristic finite-quench response fades, giving a self-referenced noise probe for quantum spin simulators.", "url": "https://arxiv.org/abs/2611.07115", "type": "理论", "summary": "我们研究了长程量子伊辛玻璃中横向场淬火后的自旋玻璃有序度。对角系综爱德华兹-安德森阶数在无淬火和零场端点处重合，但在冷壳超过它和热壳低于它之间。这源于填充本征态的刚性与其配对模式的扩展之间相关空间的竞争。在弱纵向相移下，零场端点被精确固定，而特征有限淬灭响应消失，为量子自旋模拟器提供了自参考噪声探针。", "authors": [{"name": "Giuseppe D'Auria"}, {"name": "Alessandro Silva"}], "featured_authors": [{"name": "Giuseppe D'Auria"}, {"name": "Alessandro Silva"}], "author_count": 2}, {"id": "2611.07119", "category": "cond-mat", "title": "Flexoelectric Switching of Lock-and-Key Topological Bits", "abstract": "Topological defects in nematic liquid crystals are high-energy sites of reduced order. We show that a point defect can be stabilized in pillbox-shaped pores. The pore shape promotes lock-and-key docking similar to that observed for colloidal particles. The defect docks in one lobe or the other, displaying bistability. Furthermore, the defect moves like a charged object in an external electric field. An in-plane field drives the defect from one lobe to the opposite lobe, where it remains once the field is removed. The velocity is linear in field strength and reverses with polarity, consistent with flexoelectric coupling. Within the pore, the nematic around the defect carries a positive bulk bound charge density, compensated by negative space charge in the rest of the fluid and on the bounding surfaces. The external field breaks the mirror symmetry of the pore and drives the defect motion. Defect displacement increases the component of the net dipole in the domain along the field. Antagonistic curvature in peanut-shaped pores repels the defect, allowing pore geometry to set distinct switching thresholds. The defects, while not topologically required, are long lived, so information can be stored in their position, allowing them to serve as topological bits. Arrays of topological bits store and rewrite binary information in defect positions, offering a route to reconfigurable, field-addressable soft materials.", "url": "https://arxiv.org/abs/2611.07119", "type": "理论", "summary": "向列液晶中的拓扑缺陷是低阶的高能位点。我们证明点缺陷可以稳定在药盒形孔隙中。孔形状促进了锁与钥匙的对接，类似于在胶体颗粒中观察到的情况。该缺陷停靠在一个波瓣或另一波瓣中，表现出双稳态。此外，缺陷在外部电场中像带电物体一样移动。面内场将缺陷从一个波瓣驱动到另一波瓣，一旦场被移除，缺陷仍保留在那里。速度与场强呈线性关系，并随极性而反转，这与挠电耦合一致。在孔隙内，缺陷周围的向列相带有正的体积束缚电荷密度，由流体其余部分和边界表面上的负空间电荷补偿。外场打破了孔隙的镜像对称性并驱动缺陷运动。缺陷位移增加了域中沿场的净偶极子分量。花生形孔中的拮抗曲率可以排斥缺陷，从而使孔几何形状能够设置不同的切换阈值。\n\n这些缺陷虽然不是拓扑所必需的，但却是长期存在的，因此信息可以存储在它们的位置，从而允许它们充当拓扑位。拓扑位阵列在缺陷位置存储和重写二进制信息，为可重构、可现场寻址的软材料提供了一条途径。", "authors": [{"name": "Zhijian Zhou"}, {"name": "Claire Doré"}, {"name": "Yusheng Cai"}, {"name": "Jed-Joan S. Edziah"}, {"name": "Brian Edwards"}, {"name": "Nader Engheta"}, {"name": "Amish J. Patel"}, {"name": "Kathleen J. Stebe"}], "featured_authors": [{"name": "Zhijian Zhou"}, {"name": "Claire Doré"}, {"name": "Yusheng Cai"}, {"name": "Nader Engheta"}, {"name": "Amish J. Patel"}, {"name": "Kathleen J. Stebe"}], "author_count": 8}, {"id": "2611.07131", "category": "cond-mat", "title": "Exact magnetic ground states and competing interlayer exchanges in layered kagome magnets", "abstract": "Magnetic ground states in layered kagome magnets are investigated using a Heisenberg model with six interlayer exchange interactions. For isotropic two-sublattice models with identical diagonal Fourier exchange functions, a coplanar single-wave-vector ground state is shown to exist for arbitrary exchange ranges. Extending the three-exchange model of Rosenfeld and Mushnikov reveals that longer-range interactions can change the preferred magnetic order from spiral to ferromagnetic and back to spiral, rather than merely modifying the spiral period. The analysis includes ground-state phase diagrams, harmonic stability, magnetic-field response, and sensitivity to individual exchange interactions. The propagation vector, internal layer angle, saturation field, and planar susceptibility are also found to be insufficient to determine all six exchange constants uniquely. These results provide a basis for predicting noncollinear magnetic order from first-principles exchange interactions.", "url": "https://arxiv.org/abs/2611.07131", "type": "理论+数值", "summary": "使用具有六个层间交换相互作用的海森堡模型研究了层状戈薇磁体中的磁基态。对于具有相同对角傅立叶交换函数的各向同性双子晶格模型，表明在任意交换范围内都存在共面单波矢量基态。扩展罗森菲尔德和穆什尼科夫的三交换模型表明，长程相互作用可以将首选磁序从螺旋变为铁磁，然后返回螺旋，而不仅仅是修改螺旋周期。分析包括基态相图、谐波稳定性、磁场响应以及对各个交换相互作用的敏感性。还发现传播矢量、内层角、饱和场和平面磁化率不足以唯一地确定所有六个交换常数。这些结果为根据第一原理交换相互作用预测非共线磁序提供了基础。", "authors": [{"name": "Vladimir Antropov"}], "featured_authors": [{"name": "Vladimir Antropov"}], "author_count": 1}, {"id": "2611.07196", "category": "cond-mat", "title": "On the critical value of void percolation in high dimensions", "abstract": "In the random Lorentz gas, a point tracer moves through spherical obstacles of (reduced) density $\\Phi$ centered on a Poisson point process in $d$-dimensional space, $\\mathbb{R}^d$, and becomes localized once the vacant space stops percolating, at $\\Phi_{\\rm p}(d)$. The dimensional scaling of this void percolation threshold has remained elusive. Prior bounds, conjectural ones included, ranged from $\\Omega(1)$ to $O(d\\ln d)$, leaving even the scaling undetermined. We here prove that $\\Phi_{\\rm p}(d)=\\Theta(d)$, and in particular that $\\tfrac12\\,d \\le \\Phi_{\\rm p}(d) \\le 5\\,d$ for all sufficiently large $d$. The upper bound counts hierarchical families of escape waypoints called tree embeddings; the lower bound is via a weighted second-moment estimate on an explicit ensemble of ballistic escape routes. A linear scaling of $\\Phi_{\\rm p}(d)$ excludes the $d\\ln d$ growth suggested by analogy with other systems in the random first-order transition universality class and is consistent with the numerical estimate $\\Phi_{\\rm p}/d \\to 3.40(5)$. Because the mean-field dynamical transition is likewise linear, $\\Phi_{\\rm d}\\simeq 2.40\\,d$, our result fixes the activated window $[\\Phi_{\\rm d},\\Phi_{\\rm p}]$ as a bounded---rather than diverging---correction to mean-field dynamical arrest in sufficiently high $d$.", "url": "https://arxiv.org/abs/2611.07196", "type": "理论+数值", "summary": "在随机洛伦兹气体中，点示踪剂穿过以 $d$ 维空间 $\\mathbb{R}^d$ 中的泊松点过程为中心的（降低的）密度 $\\Phi$ 的球形障碍物，并且一旦空置空间停止渗透，就会在 $\\Phi_{\\rm p}(d)$ 处定位。这个空隙渗透阈值的尺寸尺度仍然难以捉摸。先前的边界（包括推测的边界）范围从​​ $\\Omega(1)$ 到 $O(d\\ln d)$，甚至留下了未确定的缩放比例。我们在这里证明$\\Phi_{\\rm p}(d)=\\Theta(d)$，特别是对于所有足够大的$d$，$\\tfrac12\\,d \\le \\Phi_{\\rm p}(d) \\le 5\\,d$。上限计算逃生路径点的分层族，称为树嵌入；下界是通过对弹道逃生路线的显式集合进行加权二阶矩估计。 $\\Phi_{\\rm p}(d)$ 的线性缩放排除了通过与随机一阶跃迁普遍性类中的其他系统类比而建议的 $d\\ln d$ 增长，并且与数值估计 $\\Phi_{\\rm p}/d \\to 3.40(5)$ 一致。\n\n因为平均场动态转变同样是线性的，$\\Phi_{\\rm d}\\simeq 2.40\\,d$，我们的结果将激活窗口 $[\\Phi_{\\rm d},\\Phi_{\\rm p}]$ 修复为有界的——而不是发散——对足够高的 $d$ 中的平均场动态停止的校正。", "authors": [{"name": "Patrick Charbonneau"}, {"name": "Marcus Michelen"}], "featured_authors": [{"name": "Patrick Charbonneau"}, {"name": "Marcus Michelen"}], "author_count": 2}, {"id": "2611.07197", "category": "cond-mat", "title": "Barlow Packings All Have Maximum Packing Fraction: Why it is so Hard to Find Barlow Structures Other than fcc or hcp?", "abstract": "We apply lattice theory to periodic Barlow packings $(X_{1}X_{2}\\dots X_{N})_{\\infty}$ where $X_{i}\\in\\{A,B,C\\}$ and $X_{i}\\neq X_{i+1}$, formed by stacking two-dimensional hexagonal close-packed layers, interacting via generalized $(n,m)$-Lennard-Jones potentials. The cohesive energies of all packings lie between those of hexagonal close-packed (hcp, $(AB)$) and face-centered cubic (fcc, $(ABC)$) structure and vary almost linearly with the fcc stacking fraction. The equilibrium lattice constant, bulk modulus, Einstein frequency, and vibrational entropy show similarly near-linear trends. For the standard $(12,6)$ potential, fcc has the highest vibrational entropy and hcp the lowest, with other Barlow packings falling between them, consistent with previous sticky-hard-sphere Monte Carlo simulations and supported by phonon dispersion calculations. These trends imply an approximately linear dependence of free energy on fcc stacking fraction, with hcp and fcc as endpoints. This provides a simple thermodynamic explanation for why intermediate Barlow stackings are rare in nature: near-linearity offers little driving force to favor them. Exceptions may arise when hcp and fcc are nearly degenerate in energy or when many-body interactions, absent from the present model, favor another stacking. Density-functional calculations including dispersion forces for argon Barlow packings with periods $N=2,3,4$, and $12$ corroborate the predicted near-linear cohesive energy dependence.", "url": "https://arxiv.org/abs/2611.07197", "type": "理论+数值", "summary": "我们将晶格理论应用于周期性巴洛堆积$(X_{1}X_{2}\\dots X_{N})_{\\infty}$，其中$X_{i}\\in\\{A,B,C\\}$和$X_{i}\\neq X_{i+1}$，通过堆叠二维六角密堆积层形成，通过广义$(n,m)$-Lennard-Jones势相互作用。所有填料的内聚能介于六方密堆积 (hcp, $(AB)$) 和面心立方 (fcc, $(ABC)$) 结构之间，并且与 fcc 堆积分数几乎呈线性变化。平衡晶格常数、体积模量、爱因斯坦频率和振动熵显示出类似的近线性趋势。对于标准 $(12,6)$ 势，fcc 具有最高的振动熵，hcp 最低，其他 Barlow 填料位于它们之间，这与之前的粘硬球蒙特卡罗模拟一致，并得到声子色散计算的支持。这些趋势意味着自由能对 fcc 堆积分数的近似线性依赖性，以 hcp 和 fcc 作为端点。这为为什么中间巴洛堆叠在自然界中很少见提供了一个简单的热力学解释：近线性几乎没有提供有利于它们的驱动力。\n\n当 hcp 和 fcc 的能量几乎简并时，或者当前模型中不存在的多体相互作用有利于另一种堆叠时，可能会出现例外。包括周期 $N=2,3,4$ 和 $12$ 的氩巴洛填料的色散力在内的密度泛函计算证实了预测的近线性内聚能依赖性。", "authors": [{"name": "Andres Robles-Navarro"}, {"name": "Shaun Cooper"}, {"name": "Alex Travesset"}, {"name": "Peter Schwerdtfeger"}], "featured_authors": [{"name": "Andres Robles-Navarro"}, {"name": "Shaun Cooper"}, {"name": "Alex Travesset"}, {"name": "Peter Schwerdtfeger"}], "author_count": 4}, {"id": "2611.07200", "category": "cond-mat", "title": "A High-Dimensional Lab-Frame Model of Markovian Dynamics in Alanine Dipeptide", "abstract": "We present a high-dimensional coarse-grained model of alanine dipeptide that explicitly incorporates global translation and rotation alongside internal conformational dynamics. Using atomistic molecular dynamics trajectories, we construct a 10-bead Markovian Langevin model with a 24-dimensional internal potential of mean force and a full matrix of site-specific friction coefficients. The equilibrium landscape is represented by a Gaussian mixture model, while a rotational-entropy correction accounts for the coupling between internal conformation and global molecular motion. Friction coefficients are obtained using a generalized Einstein relation based on time-correlation functions. We show that the rotational-entropy correction is essential for obtaining a physically admissible friction matrix and significantly affects the inferred dynamics. Without fitting to coarse-grained dynamical observables, the resulting model reproduces a broad range of atomistic auto- and cross-correlation functions. The result is a compact and interpretable dynamical representation of the entire peptide at the chosen CG resolution, which explicitly preserves distinctions between energetic and dissipative coupling over a wide range of motions, including those between conformational fluctuations and global translational and rotational diffusion.", "url": "https://arxiv.org/abs/2611.07200", "type": "理论+数值", "summary": "我们提出了丙氨酸二肽的高维粗粒度模型，该模型明确地将全局平移和旋转以及内部构象动力学结合起来。使用原子分子动力学轨迹，我们构建了一个 10 珠马尔可夫朗之万模型，具有 24 维平均力内势和特定位点摩擦系数的完整矩阵。平衡景观由高斯混合模型表示，而旋转熵校正则解释了内部构象和全局分子运动之间的耦合。摩擦系数是使用基于时间相关函数的广义爱因斯坦关系获得的。我们表明，旋转熵校正对于获得物理上允许的摩擦矩阵至关重要，并且会显着影响推断的动力学。在不拟合粗粒度动态可观测量的情况下，所得模型再现了广泛的原子自相关函数和互相关函数。\n\n其结果是在选定的 CG 分辨率下对整个肽进行紧凑且可解释的动态表示，它明确保留了各种运动中能量耦合和耗散耦合之间的区别，包括构象波动与全局平移和旋转扩散之间的区别。", "authors": [{"name": "Jesse M. Hall"}, {"name": "Marina G. Guenza"}], "featured_authors": [{"name": "Jesse M. Hall"}, {"name": "Marina G. Guenza"}], "author_count": 2}, {"id": "2611.07230", "category": "cond-mat", "title": "Confinement-induced bound state and effective potential for microwave-shielded ultracold molecules", "abstract": "We investigate the bound state and effective potential of microwave-shielded ultracold molecules under longitudinal confinement, which effectively creates a quasi-two-dimensional (q2D) geometry. We find that the longitudinal confinement facilitates bound-state formation in both bosonic and fermionic molecules, leading to confinement-induced bound states that are absent in free space. To describe these bound states, we establish an effective 2D potential by incorporating the full interaction effect along the longitudinal direction. Compared with other simplified 2D potentials, the effective potential accurately predicts the binding energies of ultracold molecules over a much broader parameter regime of microwave coupling and confinement strength. Remarkably, it can even predict deep bound states with binding energies well exceeding the confinement frequency. By establishing this effective potential, our work paves the way for efficiently exploring the rich low-dimensional physics of microwave-shielded ultracold molecules.", "url": "https://arxiv.org/abs/2611.07230", "type": "理论", "summary": "我们研究了微波屏蔽超冷分子在纵向约束下的束缚态和有效势，这有效地创建了准二维（q2D）几何形状。我们发现纵向限制促进了玻色子和费米子分子中束缚态的形成，从而导致自由空间中不存在的限制诱导的束缚态。为了描述这些束缚态，我们通过结合沿纵向的完整相互作用效应来建立有效的二维势。与其他简化的二维势相比，有效势可以在更广泛的微波耦合和限制强度参数范围内准确预测超冷分子的结合能。值得注意的是，它甚至可以预测结合能远远超过限制频率的深度束缚态。通过建立这种有效的潜力，我们的工作为有效探索微波屏蔽超冷分子丰富的低维物理铺平了道路。", "authors": [{"name": "Linyi Zhang"}, {"name": "Xiaoling Cui"}], "featured_authors": [{"name": "Linyi Zhang"}, {"name": "Xiaoling Cui"}], "author_count": 2}, {"id": "2611.07260", "category": "cond-mat", "title": "Nanoscale Inclined Four-electrode Ion Traps: Finite-Element Modelling, Floquet Stability, and Surface-Potential Response", "abstract": "Developing miniaturised trapped-ion systems requires electrode architectures that provide controlled radio-frequency (RF) confinement while accounting for nanoscale features and surface-induced perturbations. Here, we present a finite-element investigation of an inclined four-blade RF ion-trap architecture for 171Yb+, combining pseudopotential characterisation, matrix Mathieu analysis, Floquet stability assessment, and localised surface-potential modelling. The architecture incorporates exposed electrode-face features of approximately 99-150 nm within an opposing-electrode separation of 20 um. At an electrode inclination of 6 degrees, an RF amplitude of 150 V, and a drive frequency of 15 MHz, the calculated pseudopotential exhibits directional in-plane barriers of 3.430 and 3.389 meV along the principal diagonal paths. The full RF-potential Hessian, including off-diagonal coupling terms, is used to construct the matrix Mathieu equation. Numerical propagation over one RF period identifies two dominant motional branches with secular-frequency estimates of 1.8137 and 1.8181 MHz. A third, predominantly axial branch exhibits a nominal frequency near 7.90 kHz, although its quantitative resolution is limited by the residual Hessian trace and phase-return drift. Additionally, a four-source electrostatic model is developed to investigate the effects of localised surface potentials on modal electric-field responses. Parametric analysis reveals correlation-dependent suppression and enhancement of normalised response coefficients, with multipliers ranging from approximately 0.5 to 1.5. This study establishes a computational framework for investigating nanoscale inclined blade-electrode architectures, their motional characteristics, and surface-potential responses, while highlighting numerical convergence requirements for reliable three-dimensional trap characterisation.", "url": "https://arxiv.org/abs/2611.07260", "type": "理论+数值", "summary": "开发小型化捕获离子系统需要电极架构能够提供受控射频 (RF) 限制，同时考虑纳米级特征和表面引起的扰动。在这里，我们结合了赝电势表征、矩阵 Mathieu 分析、Floquet 稳定性评估和局部表面电势建模，对 171Yb+ 的倾斜四叶片射频离子阱架构进行了有限元研究。该架构在 20 微米的相对电极间距内结合了大约 99-150 纳米的暴露电极面特征。在电极倾角为 6 度、射频幅度为 150 V、驱动频率为 15 MHz 时，计算出的赝电势沿主对角线路径呈现出 3.430 和 3.389 meV 的定向面内势垒。完整的 RF 势 Hessian 矩阵（包括非对角线耦合项）用于构造矩阵 Mathieu 方程。一个 RF 周期内的数值传播确定了两个主要运动分支，其长期频率估计值为 1.8137 和 1.8181 MHz。\n\n第三个主要是轴向分支，其标称频率接近 7.90 kHz，尽管其定量分辨率受到残余 Hessian 迹线和相返回漂移的限制。此外，还开发了四源静电模型来研究局部表面电势对模态电场响应的影响。参数分析揭示了归一化响应系数的相关性抑制和增强，乘数范围约为 0.5 至 1.5。这项研究建立了一个计算框架，用于研究纳米级倾斜刀片电极结构、其运动特性和表面电位响应，同时强调可靠的三维陷阱表征的数值收敛要求。", "authors": [{"name": "Nahiyan Archa"}, {"name": "Abhinand P."}, {"name": "Ahammed Shabeeb"}, {"name": "Nikhil Kumar"}], "featured_authors": [{"name": "Nahiyan Archa"}, {"name": "Abhinand P."}, {"name": "Ahammed Shabeeb"}, {"name": "Nikhil Kumar"}], "author_count": 4}, {"id": "2611.07353", "category": "cond-mat", "title": "Observable-Based Learning of Effective Entanglement Hamiltonians", "abstract": "Determining the entanglement Hamiltonian (EH) of an interacting quantum many-body system remains a fundamental challenge beyond special analytically tractable cases. Here we develop an observable-matching framework for learning effective EHs, which we demonstrate using response estimates from quantum Monte Carlo. As applications of this framework, we first calibrate the overall prefactor of the lattice Bisognano--Wichmann (LBW) construction using equal-time correlations and then learn spatially resolved couplings beyond its prescribed profile, without assuming a specific functional form for their spatial dependence. Trained solely on local correlations, the learned EHs reproduce benchmarked von Neumann and second Rényi entropies in $1$D and second Rényi entropies in $2$D. For a strong-bond cut associated with special surface criticality at the $(2+1)$D $O(3)$ Wilson--Fisher critical point, free-form learning outperforms the calibrated LBW ansatz in predicting the second Rényi entropy and reveals spatially nonuniform coupling renormalizations. Importantly, the learned EH also provides access to the von Neumann entropy in this setting, revealing a negative subleading correction and extending previous Rényi entropy findings to the von Neumann case. Directly evaluating the von Neumann entropy in such $(2+1)$D interacting quantum many-body systems remains challenging for conventional numerical methods. These results establish observable-based learning as a route to constructing effective entanglement Hamiltonians beyond prescribed spatial profiles in higher-dimensional interacting systems.", "url": "https://arxiv.org/abs/2611.07353", "type": "理论+数值", "summary": "除了特殊的分析易处理情况之外，确定相互作用的量子多体系统的纠缠哈密顿量（EH）仍然是一个基本挑战。在这里，我们开发了一个用于学习有效 EH 的可观察匹配框架，我们使用量子蒙特卡罗的响应估计来演示该框架。作为该框架的应用，我们首先使用等时间相关性校准晶格 Bisognano-Wichmann (LBW) 结构的整体前因子，然后学习超出其规定轮廓的空间解析耦合，而不假设其空间依赖性的特定函数形式。仅根据局部相关性进行训练，学习到的 EH 在 $1$D 中重现基准冯诺依曼和第二 Rényi 熵，在 $2$D 中重现第二 Rényi 熵。对于与 $(2+1)$D $O(3)$ Wilson-Fisher 临界点处的特殊表面临界性相关的强键切割，自由形式学习在预测第二个 Rényi 熵方面优于校准的 LBW ansatz，并揭示了空间非均匀耦合重正化。\n\n重要的是，学习到的 EH 还提供了在这种情况下访问冯·诺依曼熵的方法，揭示了负的次领先修正并将之前的 Rényi 熵发现扩展到冯·诺依曼的情况。对于传统的数值方法来说，直接评估这种 $(2+1)$D 相互作用的量子多体系统中的冯诺依曼熵仍然具有挑战性。这些结果建立了基于可观察的学习作为在高维交互系统中构建超出规定空间轮廓的有效纠缠哈密顿量的途径。", "authors": [{"name": "Siyi Yang"}, {"name": "Yuzhi Liu"}, {"name": "Yi-Ming Ding"}, {"name": "Zheng Yan"}], "featured_authors": [{"name": "Siyi Yang"}, {"name": "Yuzhi Liu"}, {"name": "Yi-Ming Ding"}, {"name": "Zheng Yan"}], "author_count": 4}, {"id": "2611.07400", "category": "cond-mat", "title": "Extensions of the Haldane gap proof: higher dimensions, near degeneracy, fermions and tensor-network states", "abstract": "A recent remarkable paper by OpenAI showed that the spin-one Heisenberg chain with periodic boundary conditions has a spectral gap in the thermodynamic limit. The proof elegantly deduces this gap from the Hamiltonian's spectrum on a finite system. This basic idea is an inequality involving the purity of the original Gibbs state and a dual Gibbs state that is defined via space-time rotation. Here we consider a few generalizations of this purity bootstrap argument. We first extend it to arbitrary spatial dimensions. Our main result uses the space-time duality between symmetry generators and symmetry twists to obtain upper bounds on the splitting of nearly degenerate low-energy states, together with a nonzero gap above them, from finite-system information. As applications, we show that finite-system calculations for the 2+1-D toric code in a field and the 2+1-D transverse-field Ising model establish parameter regimes with four and two low-lying states whose splittings are bounded from above by $e^{-cL}$ and $e^{-cL^2}$ respectively for arbitrarily large system size $L$, while the gap above these states remains nonzero in the thermodynamic limit. Next, we extend it to fermionic systems and use a finite calculation to establish a symmetric mass generation phase in a $2+1$-D fermionic model. Finally, we apply the bootstrap to tensor-network states and establish exponential decay of connected correlations of all local operators in the symmetric square-lattice spin-one state introduced by Jian and Zaletel.", "url": "https://arxiv.org/abs/2611.07400", "type": "理论+数值", "summary": "OpenAI 最近发表的一篇引人注目的论文表明，具有周期性边界条件的自旋一海森堡链在热力学极限上存在光谱间隙。该证明从有限系统上的哈密顿量谱优雅地推导出了这个差距。这个基本思想是涉及原始吉布斯状态的纯度和通过时空旋转定义的对偶吉布斯状态的不等式。在这里，我们考虑这个纯度引导论证的一些概括。我们首先将其扩展到任意空间维度。我们的主要结果利用对称生成器和对称扭曲之间的时空对偶性，从有限系统信息中获得近简并低能态分裂的上限，以及它们上方的非零间隙。作为应用，我们证明了场中 2+1-D 环面码和 2+1-D 横向场 Ising 模型的有限系统计算建立了具有四个和两个低位态的参数范围，对于任意大的系统尺寸 $L$，其分裂从上方分别以 $e^{-cL}$ 和 $e^{-cL^2}$ 为界，而这些状态之上的间隙在热力学极限中保持非零。\n\n接下来，我们将其扩展到费米子系统，并使用有限计算在 $2+1$-D 费米子模型中建立对称质量生成相。最后，我们将自举法应用于张量网络状态，并在Jian和Zaletel引入的对称方格自旋一状态下建立所有局部算子的连通相关性的指数衰减。", "authors": [{"name": "Tarun Grover"}], "featured_authors": [{"name": "Tarun Grover"}], "author_count": 1}, {"id": "2611.07434", "category": "cond-mat", "title": "Prediction of antimagnon-polarons with intrinsic momentum-space level attraction", "abstract": "Propagating hybrid quasiparticles formed by magnons and phonons (magnon-polarons) or photons (magnon-polaritons) typically exhibit level repulsion in momentum space. Level attraction, by contrast, requires an anti-phase channel and has so far been restricted to zero-dimensional systems mediated by dissipative baths. Here we predict the antimagnon-polaron in a continuous magnetoelastic medium, which inherently exhibits momentum-space level attraction. The spin-orbit-torque (SOT)-stabilized antimagnon precesses with opposite handedness, directly reversing the magnetoelastic coupling without requiring an external environment. This intrinsic attraction yields a distinctive 0/{\\pi} phase-locked simultaneous growth. Micromagnetic simulations confirm this picture, revealing that the SOT-controlled balance between gain and damping drives a collective instability. This ultimately enables a continuously tunable, dc-pumped, single-frequency phonon laser, establishing a novel route for coherent acoustic emission.", "url": "https://arxiv.org/abs/2611.07434", "type": "理论+数值", "summary": "由磁振子和声子（磁振子极化子）或光子（磁振子极化子）形成的传播混合准粒子通常在动量空间中表现出水平排斥。相比之下，能级吸引力需要反相通道，并且迄今为止仅限于由耗散浴介导的零维系统。在这里，我们预测连续磁弹性介质中的反磁振子极化子，它本质上表现出动量空间水平吸引力。自旋轨道扭矩（SOT）稳定的反磁子进动具有相反的旋向，无需外部环境即可直接反转磁弹性耦合。这种内在的吸引力产生了独特的 0/{\\pi} 锁相同步生长。微磁模拟证实了这一点，揭示了 SOT 控制的增益和阻尼之间的平衡导致了集体不稳定。这最终实现了连续可调、直流泵浦、单频声子激光器，为相干声发射建立了一条新途径。", "authors": [{"name": "Chongzhou Wang"}, {"name": "Zhengda Jing"}, {"name": "Weichao Yu"}], "featured_authors": [{"name": "Chongzhou Wang"}, {"name": "Zhengda Jing"}, {"name": "Weichao Yu"}], "author_count": 3}, {"id": "2611.07438", "category": "cond-mat", "title": "PolyGPT: A Decoder-Only Transformer for Polymer Electrolyte Design", "abstract": "Designing polymer electrolytes requires control over both material properties and chemical structure. Here, we present PolyGPT, a Transformer with 38.3 million parameters that generates polymer repeat units from optional property targets, requests to include or exclude a specified chemical feature, and an electrolyte-domain condition. Using the model selected by validation loss, we compared unconditional generation with requests for electrolyte-associated structures, a low glass-transition temperature (Tg), or both. Unconditional and electrolyte-only generation achieved structural validity of 99.46% and 99.59%, respectively. However, electrolyte conditioning increased repetition: uniqueness among valid outputs fell from 99.99% to 51.74%. At a Tg target of 246.11 K, we compared generation with and without electrolyte conditioning, and adding the electrolyte condition slightly reduced the predictor-estimated mean absolute error from 26.97 to 26.07 K, but the fraction of all attempts yielding distinct valid polymers within 50 K of the target fell from 82.35% to 32.31%. When we also required absence from the training catalog, these yields were 59.90% and 19.71%, respectively. The lower yield persisted with a tighter 25 K tolerance. Domain conditioning also weakened control of inclusion requests: the mean fraction of attempts producing valid polymers containing the requested chemical feature fell from 94.27% to 31.27%. Across nine checkpoints, earlier models sometimes produced more distinct, catalog-unseen polymers meeting the Tg target: 10,000 checkpoint model with electrolyte conditioning and 30,000 checkpoint model without it. Together, these results show why property error alone is insufficient for evaluating conditional polymer generation. It must be considered alongside repetition, training-catalog novelty, and whether combined design requests are satisfied.", "url": "https://arxiv.org/abs/2611.07438", "type": "理论", "summary": "设计聚合物电解质需要控制材料特性和化学结构。在这里，我们展示了 PolyGPT，这是一个具有 3830 万个参数的 Transformer，它可以根据可选的属性目标、包含或排除特定化学特征的请求以及电解质域条件生成聚合物重复单元。使用通过验证损失选择的模型，我们将无条件生成与电解质相关结构、低玻璃化转变温度 (Tg) 或两者的要求进行了比较。无条件发电和仅电解质发电的结构有效性分别为 99.46% 和 99.59%。然而，电解质调节增加了重复性：有效输出的唯一性从 99.99% 下降到 51.74%。在 Tg 目标为 246.11 K 时，我们比较了有和没有电解质调节的发电情况，添加电解质条件将预测器估计的平均绝对误差从 26.97 K 略微降低到 26.07 K，但在目标 50 K 范围内产生不同有效聚合物的所有尝试的比例从 82.35% 下降到 32.31%。当我们还要求缺席培训目录时，这些收益率分别为 59.90% 和 19.71%。\n\n由于 25 K 耐受性更严格，产量仍然较低。域调节还削弱了对包含请求的控制：尝试生产含有所需化学特征的有效聚合物的平均比例从 94.27% 下降到 31.27%。在九个检查点中，早期模型有时会产生更独特的、目录中未见的聚合物，以满足 Tg 目标：10,000 个检查点模型进行电解质调节，30,000 个检查点模型不进行电解质调节。总之，这些结果表明了为什么单独的性能误差不足以评估条件聚合物的生成。必须将其与重复性、培训目录新颖性以及是否满足组合设计要求一起考虑。", "authors": [{"name": "Tanmay Sarkar Akash"}, {"name": "Siddhartha Das"}], "featured_authors": [{"name": "Tanmay Sarkar Akash"}, {"name": "Siddhartha Das"}], "author_count": 2}, {"id": "2611.07456", "category": "cond-mat", "title": "Probing Non-Abelian Topology through Quench Dynamics", "abstract": "Quench dynamics offer valuable insights to topological matter, wherein the emergent topological phenomena serve as a dynamic probe to the topology of static Hamiltonians. While such a practice has been widely applied to detect the Abelian band topology or the Euler-class topology of band nodes, little is known regarding the quench dynamics of non-Abelian topological insulators in multiband systems, where the intertwining geometry of all eigenstates necessitates the description of noncommutative topological charges. Here we propose a quench protocol for non-Abelian topological insulators, so that the underlying topology can be systematically probed using dynamic signatures. Specifically, we develop a band-projection scheme to extract the gap-resolved topology from dynamic skyrmions in the emergent quasimomentum--time manifolds of the quench processes. These skyrmions are characterized by a series of gap-resolved dynamic Chern numbers, which enable us to reconstruct the full non-Abelian topology of the post-quench Hamiltonian, including the global non-Abelian topological charge and edge-state patterns under the open-boundary condition. Our proposal offers dynamical access to non-Abelian topology in multiband systems, and can be readily implemented using photons or cold atoms.", "url": "https://arxiv.org/abs/2611.07456", "type": "理论+数值", "summary": "淬火动力学为拓扑物质提供了有价值的见解，其中出现的拓扑现象可以作为静态哈密顿量拓扑的动态探针。虽然这种做法已广泛应用于检测阿贝尔带拓扑或带节点的欧拉级拓扑，但对于多带系统中非阿贝尔拓扑绝缘体的失超动力学知之甚少，其中所有本征态的交织几何结构需要描述非交换拓扑电荷。在这里，我们提出了一种用于非阿贝尔拓扑绝缘体的淬灭协议，以便可以使用动态签名系统地探测底层拓扑。具体来说，我们开发了一种能带投影方案，从淬灭过程中出现的拟动量时间流形中的动态斯格明子中提取间隙解析拓扑。这些斯格明子的特征是一系列能隙解析的动态陈数，这使我们能够重建淬火后哈密顿量的完整非阿贝尔拓扑，包括开放边界条件下的全局非阿贝尔拓扑电荷和边缘态模式。\n\n我们的建议提供了对多带系统中非阿贝尔拓扑的动态访问，并且可以使用光子或冷原子轻松实现。", "authors": [{"name": "Zhenming Zhang"}, {"name": "Tianyu Li"}, {"name": "Wei Yi"}], "featured_authors": [{"name": "Zhenming Zhang"}, {"name": "Tianyu Li"}, {"name": "Wei Yi"}], "author_count": 3}, {"id": "2611.07484", "category": "cond-mat", "title": "Percolation of discorectangles oriented predominantly along two mutually perpendicular directions", "abstract": "The percolation of finite-thickness elongated objects---discorectangles (stadiums)---oriented predominantly along two mutually perpendicular directions is studied, extending recent results for zero-thickness sticks. The angular distribution is the ``Maltese cross'' parametrized by $\\alpha$. Based on the known analytic expression for the excluded area of a discorectangle pair, the percolation threshold is estimated by the eigenvalue method. The discorectangle connectivity matrix is represented as the stick matrix plus a rank-1 term determined by the constant part of the excluded area, $C=4lw+\\pi w^{2}$, which gives the approximate relations $\\lambda_{\\max}^{\\mathrm{DR}}\\approx\\lambda_{\\max}^{\\mathrm{stick}}+C$ and $n_c^{\\mathrm{DR}}\\approx n_c^{\\mathrm{stick}}/(1+C n_c^{\\mathrm{stick}})$. Finite thickness shifts the absolute thresholds and affects the first normalization, whereas the second normalization, written through maximum eigenvalues, cancels the additive geometric contribution and preserves only the orientational dependence, explaining the universality of the normalized curves. Monte Carlo simulations of unit-length discorectangles with aspect ratios 8, 16, and 32, various domain sizes, periodic boundary conditions, and union--find scaling analysis confirm the theoretical predictions.", "url": "https://arxiv.org/abs/2611.07484", "type": "理论+数值", "summary": "研究了主要沿着两个相互垂直的方向定向的有限厚度细长物体——不连续矩形（体育场）——的渗透，扩展了零厚度棒的最新结果。角度分布是由 $\\alpha$ 参数化的“马耳他十字”。基于已知的不连续矩形对排除区域的解析表达式，通过特征值方法估计逾渗阈值。不连续矩形连接矩阵表示为棒矩阵加上由排除区域的常数部分确定的rank-1项，$C=4lw+\\pi w^{2}$，它给出了近似关系$\\lambda_{\\max}^{\\mathrm{DR}}\\approx\\lambda_{\\max}^{\\mathrm{stick}}+C$和$n_c^{\\mathrm{DR}}\\approx n_c^{\\mathrm{stick}}/(1+C n_c^{\\mathrm{stick}})$。有限厚度会改变绝对阈值并影响第一次归一化，而通过最大特征值编写的第二次归一化消除了加性几何贡献并仅保留方向依赖性，从而解释了归一化曲线的普遍性。\n\n对长宽比为 8、16 和 32 的单位长度不连续矩形、各种域大小、周期性边界条件和并集缩放分析的蒙特卡洛模拟证实了理论预测。", "authors": [{"name": "Yuri Yu. Tarasevich"}], "featured_authors": [{"name": "Yuri Yu. Tarasevich"}], "author_count": 1}, {"id": "2611.07491", "category": "cond-mat", "title": "Electrical conductivity of a two-dimensional two-component medium: discretization and effective medium approximation", "abstract": "The effective conductivity of a two-dimensional two-component medium is studied within a discretization scheme and the effective-medium approximation (EMA). A square lattice is superimposed on a random isotropic medium; each cell is assigned the conductivity of its majority component, and the cell is replaced by a star of four resistors. Neighboring cells are connected by an equivalent resistor whose conductivity is $\\sigma_1$, $\\sigma_2$, or the harmonic mean $\\sigma_{12}=2\\sigma_1\\sigma_2/(\\sigma_1+\\sigma_2)$, with probabilities $(1-p)^2$, $p^2$, and $2p(1-p)$, respectively. Applying Foster's theorem and the EMA yields a closed equation for the dimensionless effective conductivity $x$ and, after transformation, a cubic equation whose coefficients depend on $p$ and the conductivity ratio $r$. The EMA predictions are compared with direct calculations on a $200\\times200$ resistor network with periodic lateral boundary conditions and Dirichlet conditions on the top and bottom. For uncorrelated disorder, good agreement is found. For correlated disorder, when resistor conductivities are assigned according to the discretization rule from the colors of adjacent nodes, significant deviations appear and the percolation-like inflection point shifts to the right of $1/2$. The results question the validity of the correlated-disorder EMA approach and help explain discrepancies previously reported for random nanowire networks.", "url": "https://arxiv.org/abs/2611.07491", "type": "理论+数值", "summary": "在离散化方案和有效介质近似 (EMA) 内研究二维双组分介质的有效电导率。方形晶格叠加在随机各向同性介质上；每个单元都被分配了其主要成分的电导率，并且该单元被四个星形电阻器所取代。相邻单元通过等效电阻连接，其电导率为 $\\sigma_1$、$\\sigma_2$ 或调和平均值 $\\sigma_{12}=2\\sigma_1\\sigma_2/(\\sigma_1+\\sigma_2)$，概率分别为 $(1-p)^2$、$p^2$ 和 $2p(1-p)$。应用福斯特定理和 EMA 生成无量纲有效电导率 $x$ 的闭合方程，并在变换后生成系数取决于 $p$ 和电导率比率 $r$ 的三次方程。将 EMA 预测与在 200\\times200$ 电阻网络上的直接计算进行比较，该电阻网络具有周期性横向边界条件以及顶部和底部的狄利克雷条件。对于不相关的无序，发现了良好的一致性。\n\n对于相关无序，当根据相邻节点颜色的离散化规则分配电阻器电导率时，会出现显着偏差，并且渗流状拐点移动到$1/2$右侧。结果质疑相关无序 EMA 方法的有效性，并有助于解释先前报道的随机纳米线网络的差异。", "authors": [{"name": "Yuri Yu. Tarasevich"}], "featured_authors": [{"name": "Yuri Yu. Tarasevich"}], "author_count": 1}, {"id": "2611.07601", "category": "cond-mat", "title": "Fermi-volume anomaly in quartet condensates", "abstract": "We investigate the relation between density and Fermi volume in a four-component Fermi system with quartet order. For a regular zero-temperature branch without pair order, we express the correction to the Fermi-volume count in terms of the response of the Luttinger-Ward functional to a phase winding of the quartet source. Its leading term is a weighted difference between four-particle and four-hole states. For a Gaussian vertex and parabolic dispersion, we find that the correction expands the Fermi volume in one dimension and contracts it in three dimensions in the parameter range studied. The sign in two dimensions depends on the momentum cutoff. We solve the one-dimensional Dyson equation at fixed density and compare the counting correction obtained from the Fermi points with that evaluated from the dressed spectra at low temperature. At fixed quartet amplitude and peak normalization of the vertex, the correction depends strongly on the vertex width, whereas the fermionic entropy changes little. We also examine the linear pairing response, which can limit the continuation of the unpaired branch to zero temperature.", "url": "https://arxiv.org/abs/2611.07601", "type": "理论+数值", "summary": "我们研究了四重阶四分量费米系统中密度与费米体积之间的关系。对于没有对序的常规零温度分支，我们根据 Luttinger-Ward 泛函对四重源相绕组的响应来表达对费米体积计数的校正。它的首项是四粒子态和四孔态之间的加权差。对于高斯顶点和抛物线色散，我们发现修正在一维上扩展了费米体积，在所研究的参数范围内在三个维度上收缩了费米体积。二维的符号取决于动量截止。我们在固定密度下求解一维戴森方程，并将从费米点获得的计数校正与根据低温修饰光谱评估的计数校正进行比较。在固定的四重振幅和顶点归一化峰值下，校正强烈依赖于顶点宽度，而费米子熵变化很小。我们还检查了线性配对响应，这可以将未配对分支的延续限制到零温度。", "authors": [{"name": "Yixin Guo"}], "featured_authors": [{"name": "Yixin Guo"}], "author_count": 1}, {"id": "2611.07615", "category": "cond-mat", "title": "Initial heat-current decay versus thermal transport at a three-body resonance in a one-dimensional Fermi gas", "abstract": "We theoretically study kinetic relaxation and heat transport in a dilute one-dimensional spinless Fermi gas near a three-body resonance. The full vacuum amplitude of a finite-range interaction enters the linearized Boltzmann collision operator. The resonance position that maximizes the initial heat-current decay rate lies above the one that minimizes the integrated relaxation time. At higher resonance energies, coupling among momentum moments transfers heat-current weight to a slow mode. A faster initial decay can therefore coexist with slower subsequent relaxation and a larger low-frequency heat response. The dissipative responses at two resonance positions reverse their ordering at least twice as frequency increases. Bounds on the full collision operator confirm both reversals. A fourth-moment distortion exhibits the same separation of relaxation scales and provides a probe through the momentum distribution.", "url": "https://arxiv.org/abs/2611.07615", "type": "理论", "summary": "我们从理论上研究了三体共振附近稀一维无自旋费米气体中的动力学弛豫和热传递。有限范围相互作用的全真空振幅进入线性化玻尔兹曼碰撞算子。使初始热流衰减率最大化的共振位置位于使积分弛豫时间最小化的共振位置上方。在较高的共振能量下，动量矩之间的耦合将热流重量转移到慢模式。因此，较快的初始衰减可以与较慢的后续弛豫和较大的低频热响应共存。随着频率的增加，两个共振位置处的耗散响应的顺序至少反转两次。完整碰撞算子的界限确认了这两种逆转。四阶矩畸变表现出相同的松弛尺度分离，并提供动量分布的探测。", "authors": [{"name": "Yixin Guo"}], "featured_authors": [{"name": "Yixin Guo"}], "author_count": 1}, {"id": "2611.07681", "category": "cond-mat", "title": "Photoinduced switching of orbital-selective Mott states", "abstract": "We investigate light-driven inversion of orbital selectivity in a two-orbital Hubbard-Kanamori model initially in an orbital-selective Mott phase. Using the matrix-product-state we show that tailored pulse excitations drive interorbital charge transfer that nearly reverses the orbital occupations. Single-particle spectral snapshots exhibit changes consistent with an interchange of the localized and itinerant characters of the orbitals. We analyze the relevant one- and two-photon excitation channels and show that chirping around the lower-frequency resonance enhances the transfer. These results establish a microscopic route to reversing orbital selectivity and accessing long-lived nonequilibrium states in multiorbital systems.", "url": "https://arxiv.org/abs/2611.07681", "type": "理论", "summary": "我们研究了双轨道 Hubbard-Kanamori 模型中最初处于轨道选择性莫特相的光驱动轨道选择性反转。使用矩阵乘积状态，我们表明定制的脉冲激发驱动轨道间电荷转移，几乎逆转了轨道占据。单粒子光谱快照表现出与轨道的局域特征和流动特征的互换一致的变化。我们分析了相关的一光子和双光子激发通道，并表明围绕低频谐振的啁啾可以增强传输。这些结果建立了一条在多轨道系统中逆转轨道选择性和访问长期非平衡态的微观途径。", "authors": [{"name": "M. Lisiecki"}, {"name": "P. Werner"}, {"name": "J. Herbrych"}], "featured_authors": [{"name": "M. Lisiecki"}, {"name": "P. Werner"}, {"name": "J. Herbrych"}], "author_count": 3}, {"id": "2611.07714", "category": "cond-mat", "title": "Solvable macroscopic models for populations of type I excitability neurons with Gaussian noise", "abstract": "The dynamics of type I excitability neurons near the bifurcation point are governed by the model of quadratic integrate-and-fire neuron (QIF). The model of QIF subject to white Gaussian noise is abundant in statistical physics, since it not only reasonably reproduces the dynamics of some biological systems but also emerges in the problems of stochastic stability and in quantum mechanics of one-dimensional systems with quenched disorder. We derive the solution for the mean interspike interval of a QIF subject to additive Gaussian noise in terms of analytic functions, from the first passage time problem. On the basis of this solution, we construct analytical expressions for the firing rate and population-mean membrane potential in terms of the real and imaginary parts of a certain universal analytic function. With this function, we generalize theoretical results to heterogeneous populations with Lorentzian-distributed parameters. Implementation of theoretical results is demonstrated and examined for two problems: the interplay between chemical and electrical synapses, and the emergence of effective endogenous noise in sparse inhibitory networks. For the latter case, it is possible to cover the scenarios where the effective noise intensity depends on Lorentzian-distributed parameters, which is not feasible directly with the diffusion approximation.", "url": "https://arxiv.org/abs/2611.07714", "type": "理论", "summary": "分叉点附近的 I 型兴奋性神经元的动力学由二次积分激发神经元 (QIF) 模型控制。受高斯白噪声影响的QIF模型在统计物理学中非常丰富，因为它不仅合理地再现了一些生物系统的动力学，而且还出现在随机稳定性问题和具有猝灭无序的一维系统的量子力学问题中。我们根据第一个通过时间问题，以解析函数的形式推导出受加性高斯噪声影响的 QIF 的平均峰间间隔的解。在此解决方案的基础上，我们根据某个通用解析函数的实部和虚部构建了放电率和群体平均膜电位的解析表达式。通过这个函数，我们将理论结果推广到具有洛伦兹分布参数的异质总体。理论结果的实现针对两个问题进行了论证和检验：化学突触和电突触之间的相互作用，以及稀疏抑制网络中有效内源噪声的出现。\n\n对于后一种情况，可以覆盖有效噪声强度取决于洛伦兹分布参数的场景，而直接使用扩散近似是不可行的。", "authors": [{"name": "Maria V. Ageeva"}, {"name": "Denis S. Goldobin"}], "featured_authors": [{"name": "Maria V. Ageeva"}, {"name": "Denis S. Goldobin"}], "author_count": 2}, {"id": "2611.07771", "category": "cond-mat", "title": "Emergent Symmetry in Constant-Density Flocks", "abstract": "In two dimensions, the ordered phase of constant-density flocks is described by a single angle field, which makes them arguably the simplest systems with a scale-free ordered phase of collective motion. We show that the equation governing the corresponding Nambu-Goldstone mode, completed with terms previously discarded, possesses on large scales an invariance combining a shear and a Galilean boost. Broken at the bare level, this symmetry is restored at the unique attractive fixed point, and the associated Ward identities fix the scaling exponents exactly, as confirmed numerically.", "url": "https://arxiv.org/abs/2611.07771", "type": "理论+数值", "summary": "在二维中，恒定密度群的有序相由单个角场描述，这使得它们可以说是具有无标度集体运动有序相的最简单系统。我们表明，控制相应南部-戈德斯通模式的方程（用先前丢弃的项完成）在大尺度上具有结合剪切和伽利略升压的不变性。这种对称性在裸露水平上被打破，在独特的吸引固定点处恢复，并且相关的沃德恒等式精确地固定了缩放指数，正如数字所证实的那样。", "authors": [{"name": "Hugues Chaté"}, {"name": "Alexandre Solon"}], "featured_authors": [{"name": "Hugues Chaté"}, {"name": "Alexandre Solon"}], "author_count": 2}, {"id": "2611.07807", "category": "cond-mat", "title": "Nonlinear Interaction and Topological Selection Rules in two Skyrmion Merging: Emergence of Skyrmionium Textures", "abstract": "The nonlinear interaction of closely spaced magnetic skyrmions remains poorly understood, particularly the conditions governing their merger into a single skyrmion or a stable skyrmionium. Here, we investigate the merging dynamics of two Néel skyrmions using analytical modelling and micromagnetic simulations based on Landau-Lifshitz-Gilbert dynamics. We examine the effects of exchange, Dzyaloshinskii-Moriya interaction, anisotropy, and magnetostatic energies by varying the initial separation, polarity, winding number, and skyrmion size. Our results reveal a topological selection rule: skyrmions with identical polarity and opposite winding numbers form a stable skyrmionium at intermediate overlap, while all other configurations relax into a single skyrmion. We also identify a critical radius below which the skyrmionium collapses, showing that its formation requires both the appropriate topology and a minimum size. Energy analysis reveals that the transition involves cooperative relaxation of exchange frustration and redistribution of Dzyaloshinskii-Moriya and magnetostatic energies, leading to a double-domain-wall structure. The resulting skyrmionium exhibits persistent breathing oscillations around an equilibrium radius, confirming its dynamical stability as a metastable state. These findings establish a predictive framework for controlling skyrmion merging and provide design guidelines for engineering skyrmionium textures in chiral magnetic nanostructures.", "url": "https://arxiv.org/abs/2611.07807", "type": "理论+数值", "summary": "紧密间隔的磁性斯格明子的非线性相互作用仍然知之甚少，特别是控制它们合并成单个斯格明子或稳定的斯格明子的条件。在这里，我们使用基于朗道-利夫希茨-吉尔伯特动力学的分析模型和微磁模拟来研究两个尼尔斯格明子的合并动力学。我们通过改变初始分离、极性、缠绕数和斯格明子尺寸来研究交换、Dzyaloshinskii-Moriya 相互作用、各向异性和静磁能的影响。我们的结果揭示了拓扑选择规则：具有相同极性和相反缠绕数的斯格明子在中间重叠处形成稳定的斯格明子，而所有其他配置松弛成单个斯格明子。我们还确定了一个临界半径，低于该半径，斯格明离子就会塌陷，这表明它的形成需要适当的拓扑结构和最小尺寸。能量分析表明，该转变涉及交换挫败的协同松弛以及 Dzyaloshinskii-Moriya 和静磁能的重新分配，从而形成双畴壁结构。\n\n由此产生的斯格米离子在平衡半径周围表现出持续的呼吸振荡，证实了其作为亚稳态的动态稳定性。这些发现建立了控制斯格明子合并的预测框架，并为手性磁性纳米结构中的斯格明子纹理工程提供了设计指南。", "authors": [{"name": "M. Al Busaidi"}, {"name": "T. Hakioglu"}, {"name": "R. Sbiaa"}], "featured_authors": [{"name": "M. Al Busaidi"}, {"name": "T. Hakioglu"}, {"name": "R. Sbiaa"}], "author_count": 3}, {"id": "2611.07844", "category": "cond-mat", "title": "Half-integer quantum anomalous Hall effect in MnBi$_2$Te$_4$ via non-magnetic extension", "abstract": "Within an ab-initio approach, we study the electronic structure and Hall response of the antiferromagnetic topological insulator film of MnBi$_2$Te$_4$ in contact with non-magnetic GeBi$_2$Te$_4$ (Bi$_2$Te$_3$) overlayer. The proposed junction design eliminates the exchange splitting one of the Dirac cones of the MnBi$_2$Te$_4$ (0001) thus manifesting a half-integer quantum anomalous Hall phase. The described recipe allows to enlarge temperature of the effect observation, enriches the diversity of topological properties of the MnBi$_2$Te$_4$ compound and is appropriate for other layered antiferromagnetic topological insulators. Applying the proposed heterostructure design, the half-quantized Hall phase can be established with employing other overlayer and magnetic topological insulator films.", "url": "https://arxiv.org/abs/2611.07844", "type": "理论", "summary": "在从头开始的方法中，我们研究了与非磁性 GeBi$_2$Te$_4$ (Bi$_2$Te$_3$) 覆盖层接触的 MnBi$_2$Te$_4$ 反铁磁拓扑绝缘体薄膜的电子结构和霍尔响应。所提出的结设计消除了 MnBi$_2$Te$_4$ (0001) 的狄拉克锥体之一的交换分裂，从而表现出半整数量子反常霍尔相。所描述的配方可以扩大效应观察的温度，丰富了MnBi$_2$Te$_4$化合物拓扑性质的多样性，并且适用于其他层状反铁磁拓扑绝缘体。应用所提出的异质结构设计，可以通过采用其他覆盖层和磁性拓扑绝缘体薄膜来建立半量子化霍尔相。", "authors": [{"name": "Igor P. Rusinov"}, {"name": "Tatiana V. Menshchikova"}, {"name": "Evgueni V. Chulkov"}], "featured_authors": [{"name": "Igor P. Rusinov"}, {"name": "Tatiana V. Menshchikova"}, {"name": "Evgueni V. Chulkov"}], "author_count": 3}, {"id": "2611.07845", "category": "cond-mat", "title": "Masked diffusion as random sequential adsorption: an exactly solvable model for parallel decoding", "abstract": "Masked diffusion models generate text by reversing a stochastic masking process. Unlike autoregressive LLMs, which generate text one token at a time, they can reveal many tokens in parallel, at the price of an error, since tokens revealed together are drawn independently. We show that this trade-off maps onto the statistical physics of driven many-particle systems. (i) For any data, the error of parallel generation is the entropy production of the generation process relative to the reversed masking process. (ii) For Markov data, generation is a random sequential adsorption process with labelled gaps, which we solve exactly for any number of steps. (iii) For many steps, the error becomes the dissipation of a slowly driven system: the unmasking schedule plays the role of the driving protocol, the number of steps that of its duration, and the error is set by a thermodynamic metric that we obtain in closed form from the mutual information between tokens. Optimal schedules are geodesics of this metric. The exact solution shows how correlations in the text shape both the error and the quality of the output. The longer the correlations, the more the error concentrates at the start of generation. Schedules that start with small steps then gain more, both in path error and in perplexity, and need fewer steps to reach their asymptotic behaviour.", "url": "https://arxiv.org/abs/2611.07845", "type": "理论", "summary": "掩蔽扩散模型通过反转随机掩蔽过程来生成文本。与每次生成一个标记的文本的自回归 LLM 不同，它们可以并行显示许多标记，但会出现错误，因为一起显示的标记是独立绘制的。我们证明这种权衡映射到驱动多粒子系统的统计物理上。 (i) 对于任何数据，并行生成的误差是生成过程相对于反向掩蔽过程的熵产生。 (ii) 对于马尔可夫数据，生成是带有标记间隙的随机顺序吸附过程，我们可以精确地求解任意数量的步骤。 (iii) 对于许多步骤，误差变成了缓慢驱动系统的耗散：揭开时间表扮演了驱动协议的角色，其持续时间的步骤数，并且误差由我们从代币之间的相互信息以封闭形式获得的热力学度量来设置。最佳调度是该指标的测地线。精确的解决方案显示了文本中的相关性如何影响输出的错误和质量。\n\n相关性越长，误差就越集中在生成之初。以小步骤开始的调度会在路径错误和困惑度方面获得更多，并且需要更少的步骤来达到其渐近行为。", "authors": [{"name": "Adrian Baule"}], "featured_authors": [{"name": "Adrian Baule"}], "author_count": 1}, {"id": "2611.07933", "category": "cond-mat", "title": "Non-Perturbative Resolution of Luttinger's Theorem Violations in Strongly Correlated Systems", "abstract": "Many-body physics faces an apparent paradox concerning violations of Luttinger's theorem in strongly correlated systems. The theorem relates the electron number to the Luttinger count -- the monodromy of the logarithm of the imaginary-frequency Green's function $G(i\\epsilon)$ -- and, at finite magnetic field, connects the Hall conductivity to the magnetic-field derivative of the Luttinger count via the Streda formula. Here, we provide a non-perturbative solution to this paradox. We demonstrate that the reported violations of Luttinger's theorem do not require a breakdown of the skeleton diagram representation of physical quantities, thereby resolving a long-standing point of contention in many-body theory. Furthermore, we show that the Luttinger integral, which accounts for the mismatch between the particle number and the Luttinger count, is itself a genuine topological invariant directly tied to the Luttinger-Ward functional $\\Phi[G]$ rather than to the Green's function alone. We demonstrate that this invariant, like the monodromy of $\\ln G(i\\epsilon)$ itself, stems exclusively from the zero-frequency discontinuity of the Matsubara trajectory.", "url": "https://arxiv.org/abs/2611.07933", "type": "理论", "summary": "多体物理学面临着一个明显的悖论，即在强相关系统中违反鲁廷格定理。该定理将电子数与路廷格计数（虚数格林函数 $G(i\\epsilon)$ 对数的单调性）联系起来，并且在有限磁场下，通过 Streda 公式将霍尔电导率与路廷格计数的磁场导数联系起来。在这里，我们为这个悖论提供了一个非扰动的解决方案。我们证明了所报告的对卢廷格定理的违反不需要对物理量的骨架图表示进行分解，从而解决了多体理论中长期存在的争论点。此外，我们表明，解释粒子数和路廷格计数之间不匹配的路廷格积分本身就是一个真正的拓扑不变量，直接与路廷格-沃德函数$\\Phi[G]$相关，而不是单独与格林函数相关。我们证明这个不变量，就像 $\\ln G(i\\epsilon)$ 本身的单调一样，完全源于松原轨迹的零频率不连续性。", "authors": [{"name": "Nazzareno Africani"}, {"name": "Herbert Eßl"}, {"name": "Alessandro Toschi"}, {"name": "Michele Fabrizio"}], "featured_authors": [{"name": "Nazzareno Africani"}, {"name": "Herbert Eßl"}, {"name": "Alessandro Toschi"}, {"name": "Michele Fabrizio"}], "author_count": 4}, {"id": "2611.07989", "category": "cond-mat", "title": "Pressure-Induced Phase Transition and Superconducting Properties of LiPdH$_2$: A First-Principles Study", "abstract": "We present a detailed first-principles investigation of the superconducting hydride LiPdH$_2$, focusing on the competition between its tetragonal $P4/mmm$ and rhombohedral $R\\bar{3}m$ phases. Our results reveal a pressure-induced phase transition near 220 GPa, where $R\\bar{3}m$ overtakes $P4/mmm$ in thermodynamic stability. The $R\\bar{3}m$ phase is predicted to be superconducting, with $T_{\\rm c}$ values of up to 46 K in the harmonic approximation and 28 K at the anharmonic level. In contrast, although the $P4/mmm$ phase is stable up to 200 GPa, it maintains a more rigid electronic character with weaker hydrogen involvement, resulting in lower superconducting performance. Ionic quantum and anharmonic effects play a decisive role in stabilizing $P4/mmm$ and shaping its superconducting properties, whereas these effects diminish rapidly with pressure. These findings highlight the interplay between structural stability, hydrogen orbital activity, and quantum effect in optimizing the superconductivity of hydrogen-based superconductors.", "url": "https://arxiv.org/abs/2611.07989", "type": "理论+数值", "summary": "我们对超导氢化物 LiPdH$_2$ 进行了详细的第一性原理研究，重点关注其四方 $P4/mmm$ 和菱形 $R\\bar{3}m$ 相之间的竞争。我们的结果揭示了接近 220 GPa 时压力引起的相变，其中 $R\\bar{3}m$ 的热力学稳定性超过 $P4/mmm$。 $R\\bar{3}m$ 相预计是超导的，$T_{\\rm c}$ 值在谐波近似下高达 46 K，在非谐波水平下高达 28 K。相比之下，尽管$P4/mmm$相在高达200 GPa的压力下仍保持稳定，但它保持了更刚性的电子特性，且氢参与较弱，导致超导性能较低。离子量子和非谐效应在稳定 $P4/mmm$ 和塑造其超导性能方面发挥着决定性作用，而这些效应会随着压力而迅速减弱。这些发现强调了结构稳定性、氢轨道活性和量子效应在优化氢基超导体超导性方面的相互作用。", "authors": [{"name": "Zahra Alizadeh"}, {"name": "Yue-Wen Fang"}, {"name": "M.R. Mohammadizadeh"}], "featured_authors": [{"name": "Zahra Alizadeh"}, {"name": "Yue-Wen Fang"}, {"name": "M.R. Mohammadizadeh"}], "author_count": 3}, {"id": "2611.08024", "category": "cond-mat", "title": "Heat Transport Mechanisms in MOF-5", "abstract": "We find that MOF-5 supports both long-lived phonons and linker vibrations whose split spectra signal a breakdown of the phonon quasiparticle approximation. Combining mode-projected molecular dynamics spectra with spectral Wigner heat transport, we resolve two contrasting transport channels: low-frequency particle-like phonon propagation decreases strongly from 200 to 500 K, whereas wave-like phonon coherence remains nearly constant and supplies about half the intrinsic conductivity at 500 K. A phenomenological extrinsic scattering model provides a plausible explanation for the discrepancy between calculated and measured conductivities in terms of both its magnitude and temperature dependence. We also identify signatures of phonon quasiparticle breakdown in the linker vibrations of ZIF-8 and HKUST-1, indicating that this feature extends to other metal-organic frameworks.", "url": "https://arxiv.org/abs/2611.08024", "type": "理论+数值", "summary": "我们发现 MOF-5 支持长寿命声子和连接器振动，其分裂光谱表明声子准粒子近似的崩溃。将模式投影分子动力学谱与光谱维格纳热传输相结合，我们解决了两个截然不同的传输通道：低频粒子状声子传播从 200 K 到 500 K 急剧下降，而波状声子相干性几乎保持恒定，并在 500 K 时提供约一半的本征电导率。唯象外在散射模型为计算电导率和测量电导率在幅度和温度方面的差异提供了合理的解释。依赖性。我们还确定了 ZIF-8 和 HKUST-1 连接振动中声子准粒子分解的特征，表明该特征扩展到其他金属有机框架。", "authors": [{"name": "Zezhu Zeng"}, {"name": "Xia Liang"}, {"name": "Hengtai Zheng"}, {"name": "Aron Walsh"}, {"name": "David E. Manolopoulos"}], "featured_authors": [{"name": "Zezhu Zeng"}, {"name": "Xia Liang"}, {"name": "Hengtai Zheng"}, {"name": "Aron Walsh"}, {"name": "David E. Manolopoulos"}], "author_count": 5}, {"id": "2611.08027", "category": "cond-mat", "title": "Splay ostracism on ferroelectric nematic shells", "abstract": "Ostracism was the practice in use in Athens and other ancient Greek cities to send into exile citizens whose influence was deemed to be dangerous. Quite similarly, splay ostracism is here the approximation that bans splay distortion from thin films of ferroelectric nematic liquid crystals on a curved shell in space. This reduces to a mere geometric problem the quest for equilibria of director vortexes and the walls isolating them, as splay ostracism requires the director field lines to be everywhere orthogonal to systems of geodesics on the shell. Consequences of this theorem are explored for shells with Gaussian curvature of either sign. The resulting quasi static dynamics reveals both cases where walls escape from the shell and cases where they are trapped on it, with possibly different reflections on the vortex dynamics.", "url": "https://arxiv.org/abs/2611.08027", "type": "理论", "summary": "放逐是雅典和其他古希腊城市用来流放影响被认为是危险的公民的做法。非常相似，这里的张开排斥是禁止空间弯曲壳上的铁电向列液晶薄膜张开变形的近似。这将对导向涡旋和隔离它们的壁的平衡的追求简化为纯粹的几何问题，因为张开排斥要求导向场线在任何地方都与壳上的测地线系统正交。对于具有任一符号的高斯曲率的壳，探索了该定理的结果。由此产生的准静态动力学揭示了壁从壳逸出的情况和它们被困在壳上的情况，对涡动力学可能有不同的反映。", "authors": [{"name": "Epifanio G. Virga"}], "featured_authors": [{"name": "Epifanio G. Virga"}], "author_count": 1}, {"id": "2611.08033", "category": "cond-mat", "title": "Galois conjugation, droplet growth, and the differential transcendence of the Ising model in nonzero field", "abstract": "The square-lattice Ising model is exactly solvable in zero magnetic field, but the scope of exact solutions at nonzero field remains unresolved. We show that, at every fixed dimensionless field $H=h/(k_BT)\\ne 0$, its free energy and magnetization obey no algebraic differential equation in the coupling $K=J/(k_BT)$. This excludes Onsager-type formulas and broad classes of special-function expressions. Previous work left open a countable set of fields with algebraic-integer fugacities. We eliminate these exceptions using Galois conjugation and the large-order growth of droplets of reversed spins. At conjugate fugacities outside the unit circle, nearly square droplets produce coefficient growth incompatible with an algebraic differential equation. We prove that cancellations cannot remove this growth in the full pressure series. The free-energy result also holds for the Lieb lattice and square lattices with equal-length chain decorations and uniform coupling and field. In every dimension $d\\ge2$, we additionally resolve fields for which $e^{-2|H|}$ has a real algebraic conjugate greater than one.", "url": "https://arxiv.org/abs/2611.08033", "type": "理论+数值", "summary": "方晶格伊辛模型在零磁场下精确可解，但在非零磁场下精确解的范围仍未解决。我们证明，在每个固定的无量纲场 $H=h/(k_BT)\\ne 0$ 处，其自由能和磁化强度在耦合 $K=J/(k_BT)$ 中不服从代数微分方程。这不包括 Onsager 类型的公式和广泛的特殊函数表达式。之前的工作留下了一组具有代数整数逸度的可数域。我们使用伽罗瓦共轭和反向自旋液滴的大阶生长消除了这些例外。在单位圆外的共轭逸度处，接近方形的液滴产生与代数微分方程不相容的系数增长。我们证明取消不能消除全压力系列的增长。自由能结果也适用于具有等长链装饰和均匀耦合和场的利布晶格和方晶格。在每个维度 $d\\ge2$ 中，我们还解析了 $e^{-2|H|}$ 具有大于 1 的实代数共轭的字段。", "authors": [{"name": "Ran Luo"}, {"name": "Jiahua Tian"}], "featured_authors": [{"name": "Ran Luo"}, {"name": "Jiahua Tian"}], "author_count": 2}, {"id": "2611.08050", "category": "cond-mat", "title": "Closed-form solution for semi-symmetric folding of waterbomb tessellations", "abstract": "Rigid-origami folding has versatile applications in the fields of architecture, engineering, medicine and aerospace. Given the design parameters of a single waterbomb cell, the global geometry of the origami tessellated shell at an intermediate state of folding is directly determined. Even though existing numerical methods of rigid-origami can be used to describe geometric forms, algebraic solutions of the waterbomb folding kinematics and tessellations reduce the algorithmic complexity and determine the range of admissible configurations exactly. The existing analytical solution for a symmetrically folded waterbomb cell and tessellation is extended to the case of a cell folded semi-symmetrically, i.e. a cell with a 180° rotation symmetry. The algebraic derivation provides the solution for the entire folding process. The resulting functional relationship between the design parameters and the 3D cell geometry of the folded waterbomb cell enables efficient studies of achievable shell geometries. This development facilitates a deeper understanding of the correspondence between the geometric parameters of a single waterbomb cell and the statically relevant geometric properties, i.e. the shell curvature and the effective cross-sectional height. The systematic description of this correspondence provides the basis for innovative design concepts using modern cementitious composites, e.g. textile-reinforced concrete, to produce thin-walled, high-performance, lightweight shells.", "url": "https://arxiv.org/abs/2611.08050", "type": "理论+数值", "summary": "刚性折纸折叠在建筑、工程、医学和航空航天领域具有广泛的应用。给定单个水弹单元的设计参数，可以直接确定折纸棋盘格壳在折叠中间状态下的整体几何形状。尽管现有的刚性折纸数值方法可用于描述几何形式，但水炸弹折叠运动学和镶嵌的代数解降低了算法复杂性并准确确定了可接受配置的范围。对称折叠水弹单元和镶嵌的现有解析解扩展到半对称折叠单元的情况，即具有 180° 旋转对称性的单元。代数推导为整个折叠过程提供了解决方案。由此产生的设计参数与折叠水弹单元的 3D 单元几何形状之间的函数关系使得能够有效地研究可实现的壳体几何形状。这一发展有助于更深入地理解单个水弹单元的几何参数与静态相关几何特性之间的对应关系，即\n\n壳曲率和有效横截面高度。这种对应关系的系统描述为使用现代水泥复合材料的创新设计概念提供了基础，例如纺织增强混凝土，用于生产薄壁、高性能、轻质外壳。", "authors": [{"name": "Sascha Stüttgen"}, {"name": "Homam Spartali"}, {"name": "Alice C. Niemeyer"}, {"name": "Rostislav Chudoba"}, {"name": "Daniel Robertz"}], "featured_authors": [{"name": "Sascha Stüttgen"}, {"name": "Homam Spartali"}, {"name": "Alice C. Niemeyer"}, {"name": "Rostislav Chudoba"}, {"name": "Daniel Robertz"}], "author_count": 5}, {"id": "2611.08051", "category": "cond-mat", "title": "First-order condensation and meniscus pinning in finite open wedges", "abstract": "We study first-order condensation in finite open wedges using classical density functional theory (DFT) and compare the resulting microscopic phase behaviour with recent macroscopic predictions. Two geometries are considered: a symmetric wedge formed by two identical inclined walls and an asymmetric wedge formed by a vertical and an inclined wall. The DFT calculations confirm the two condensed morphologies predicted for the symmetric wedge and the three morphologies predicted for the asymmetric wedge and their emergence depending on the wedge size, opening angle, and wall contact angle. Under partial-wetting conditions, the microscopic phase boundaries are in nearly perfect quantitative agreement with the macroscopic predictions, including reentrant changes between pinned and depinned meniscus configurations and the appearance of the semi-double-pinned state in the asymmetric wedge. Under complete-wetting conditions, the DFT phase diagrams retain the topology predicted by the macroscopic theory, but the single-pinned region is systematically enlarged. This shift is attributed to adsorbed liquid films, which reduce the effective width available to the gas and thereby increase the effective aspect ratio of the confinement.", "url": "https://arxiv.org/abs/2611.08051", "type": "理论+数值", "summary": "我们使用经典密度泛函理论（DFT）研究有限开放楔中的一阶凝聚，并将所得的微观相行为与最近的宏观预测进行比较。考虑两种几何形状：由两个相同的倾斜壁形成的对称楔形和由垂直壁和倾斜壁形成的不对称楔形。 DFT 计算证实了对称楔形预测的两种凝聚形态和非对称楔形预测的三种形态，以及它们的出现取决于楔形尺寸、张角和壁接触角。在部分润湿条件下，微观相界与宏观预测几乎完全一致，包括钉扎和脱钉弯月面结构之间的重入变化以及不对称楔形中半双钉扎状态的出现。在完全润湿条件下，DFT相图保留了宏观理论预测的拓扑结构，但单钉扎区域被系统地放大。\n\n这种变化归因于吸附液膜，它减少了气体可用的有效宽度，从而增加了限制的有效纵横比。", "authors": [{"name": "Jiří Janek"}, {"name": "Miriam Magočiová"}, {"name": "Alexandr Malijevský"}], "featured_authors": [{"name": "Jiří Janek"}, {"name": "Miriam Magočiová"}, {"name": "Alexandr Malijevský"}], "author_count": 3}, {"id": "2611.08055", "category": "cond-mat", "title": "Ferroelectric control of magnetic coupling in a Cr dimer adsorbed on $α$-In$_2$Se$_3$", "abstract": "Ferroelectric substrates offer a route to controlling magnetic interactions in low-dimensional systems through polarization-dependent changes in local bonding and electronic structure. Here, using first-principles calculations, we investigate the adsorption of 3$d$ transition-metal atoms and dimers on monolayer $\\alpha$-In$_2$Se$_3$ and identify Cr as a stable dimer configuration on both polar surfaces. Reversing the ferroelectric polarization drives a pronounced change in its magnetic coupling: the AFM state is favored for one polarization, whereas the FM and AFM configurations become nearly degenerate for the opposite one. Analysis of the spin density, projected electronic states, and Wannier Hamiltonians reveals concomitant changes in the direct Cr-Cr hopping and in the interaction with the bridging Se atom. In particular, enhanced Cr-Se hybridization and Se spin polarization, together with a strong reduction of the direct two-center Cr-Cr hopping, point to a polarization-dependent balance between direct and substrate-mediated exchange contributions. These results show how ferroelectric polarization can tune magnetic interactions in an atomically defined 2D hybrid system.", "url": "https://arxiv.org/abs/2611.08055", "type": "理论+数值", "summary": "铁电基板提供了一种通过局部键合和电子结构中极化相关的变化来控制低维系统中磁相互作用的途径。在这里，利用第一性原理计算，我们研究了 3$d$ 过渡金属原子和二聚体在单层 $\\alpha$-In$_2$Se$_3$ 上的吸附，并将 Cr 识别为两个极性表面上的稳定二聚体配置。反转铁电极化会导致其磁耦合发生显着变化：一种极化有利于 AFM 状态，而相反的极化则使 FM 和 AFM 配置几乎退化。对自旋密度、投影电子态和万尼尔哈密顿量的分析揭示了直接 Cr-Cr 跳跃以及与桥接 Se 原子相互作用的伴随变化。特别是，增强的 Cr-Se 杂化和 Se 自旋极化，以及直接两中心 Cr-Cr 跳跃的强烈减少，表明直接和底物介导的交换贡献之间存在极化依赖的平衡。这些结果表明铁电极化如何调节原子定义的二维混合系统中的磁相互作用。", "authors": [{"name": "J.F. Ospina"}, {"name": "S. Di Napoli"}, {"name": "M.A. Barral"}], "featured_authors": [{"name": "J.F. Ospina"}, {"name": "S. Di Napoli"}, {"name": "M.A. Barral"}], "author_count": 3}, {"id": "2611.08072", "category": "cond-mat", "title": "Thermodynamic geometry of three coupled Ising spins: exact curvature, frustration and bond anisotropy", "abstract": "Thermodynamic curvature is widely used as a diagnostic of interactions and phase transitions, yet its interpretation is usually tested only in the thermodynamic limit. Small spin clusters are physically relevant in their own right, since a macroscopic sample of independent molecular trimers or a few-qubit quantum simulator is governed exactly by the few-spin partition function. They also provide the only setting in which the geometry can be obtained in closed form together with its full dependence on the interaction topology. We study the Fisher-Rao (Ruppeiner) geometry of three Ising spins with arbitrary pairwise couplings in a longitudinal field. This cluster interpolates continuously between an open chain and a geometrically frustrated triangle. For the symmetric triangle we obtain the scalar curvature in closed form. It vanishes on the noninteracting line and on a line of fixed field-to-temperature ratio that does not depend on the coupling, which coincides with the inflection point of the single-spin susceptibility. The near-zero behaviour is therefore exactly linear and reflects analyticity rather than critical scaling. In the frustrated antiferromagnetic regime the curvature remains finite and negative down to zero temperature. A general low-temperature formula relates this plateau to the change in magnetization content between the degenerate ground manifold and its first excitation. Any bond anisotropy destroys the plateau below a crossover temperature that depends only logarithmically on the anisotropy, so the curvature is an extremely sensitive detector of exact ground-state degeneracy. On the ferromagnetic side the zero-temperature curvature is universal for all couplings, whereas additional zero lines in anisotropic clusters track field-induced crossings of excited levels.", "url": "https://arxiv.org/abs/2611.08072", "type": "理论", "summary": "热力学曲率被广泛用作相互作用和相变的诊断，但其解释通常仅在热力学极限下进行测试。小自旋簇本身具有物理相关性，因为独立分子三聚体的宏观样本或少量子位量子模拟器完全由少自旋配分函数控制。它们还提供了唯一可以以封闭形式获得几何形状及其完全依赖于交互拓扑的设置。我们研究了纵向场中具有任意成对耦合的三个伊辛自旋的 Fisher-Rao (Ruppeiner) 几何。该簇在开链和几何挫败三角形之间连续插值。对于对称三角形，我们获得闭合形式的标量曲率。它在非相互作用线和不依赖于耦合的固定场温比线上消失，这与单自旋磁化率的拐点一致。因此，接近零的行为完全是线性的，反映的是分析性而不是临界缩放。\n\n在受挫反铁磁状态下，曲率在低至零温度时仍保持有限且为负值。一般的低温公式将该平台与简并接地流形与其第一次激励之间的磁化强度变化联系起来。任何键各向异性都会破坏交叉温度以下的平台，而交叉温度仅与各向异性成对数关系，因此曲率是精确基态简并性的极其灵敏的检测器。在铁磁侧，零温度曲率对于所有耦合都是通用的，而各向异性簇中的附加零线则跟踪场感应的激发能级交叉。", "authors": [{"name": "Zahra Ebadi"}, {"name": "Nayyere Einali Saghavaz"}, {"name": "Omid Yahyayi Monem"}, {"name": "Hosein Mohammadzadeh"}], "featured_authors": [{"name": "Zahra Ebadi"}, {"name": "Nayyere Einali Saghavaz"}, {"name": "Omid Yahyayi Monem"}, {"name": "Hosein Mohammadzadeh"}], "author_count": 4}, {"id": "2611.08205", "category": "cond-mat", "title": "Hydrodynamic interaction in Lattice Fokker Planck for dilute polymer dynamics", "abstract": "We extend the BGK-type kinetic model for polymer dumbbells and its lattice Boltzmann implementation by incorporating hydrodynamic interaction (HI) effects to accurately recover the slow-variable dynamics governed by the Smoluchowski equation. Unlike Brownian dynamics approaches, which demand the computationally expensive evaluation of the square root of the configuration-dependent diffusion tensor at every time step, this kinetic method is straightforward to implement and avoids such overhead entirely. Consequently, it achieves a significant reduction in computational cost. We validate the model in steady and transient shear flows, demonstrating its ability to capture the distinct signatures of hydrodynam
