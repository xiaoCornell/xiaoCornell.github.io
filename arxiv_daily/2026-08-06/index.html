值", "summary": "快速准备量子纠错码对于可扩展的量子存储器至关重要，但几何局部性和 $U(1)$ 电荷守恒带来了不可避免的传输约束。我们结合精确的互补通道几何结构、电荷扇区哈尔分析和门分辨连接矩扩展来研究标记擦除下的一维协变编码器。 Charge-Haar 码达到了通用的相邻电荷下限，直至指数小校正，从而产生精确的 $n^{-1/2}$ 广泛擦除定律和急剧的半擦除过渡。对于局部守数砖砌电路，逻辑电荷的扩散强制执行 $\\Omega(n^2)$ 编码时间下限；我们还证明了经典组件的 $O(n^3)$ 混合界限，并将剩余的全通道上限减少为源限制的低支持算子扩展问题。这些结果将扩散确定为对称约束量子编码的操作限制，并建立了其确切形成时间的路线。", "authors": [{"name": "Jianqi Sheng"}], "featured_authors": [{"name": "Jianqi Sheng"}], "author_count": 1}, {"id": "2608.04973", "category": "quant-ph", "title": "Quantum Bayes Correlated Equilibrium and the Comparison of Quantum Information Structures in Games", "abstract": "Bergemann and Morris (2016) show that one information structure is more informative than another exactly when it induces a smaller set of Bayes correlated equilibrium outcomes in every game. We build the quantum analogue. An information structure becomes a family of density operators indexed by the payoff state, which the mediator observes. We show that obedience is equivalent to a Loewner domination between operators on one player's subsystem. The equilibrium set is then a nonempty compact spectrahedron computable by semidefinite programming, classical structures embed exactly, and under quantum individual sufficiency more information shrinks the equilibrium set in every game.", "url": "https://arxiv.org/abs/2608.04973", "type": "理论", "summary": "Bergemann 和 Morris (2016) 表明，当一种信息结构在每个博弈中产生一组较小的贝叶斯相关均衡结果时，它比另一种信息结构提供的信息更多。我们构建了量子类似物。信息结构变成由调解者观察到的支付状态索引的一系列密度算子。我们证明，服从相当于一个玩家子系统的操作员之间的 Loewner 统治。然后，平衡集是一个可通过半定编程计算的非空紧致谱面体，经典结构精确嵌入，并且在量子个体充足性下，更多信息会缩小每个博弈中的平衡集。", "authors": [{"name": "Furkan Sezer"}], "featured_authors": [{"name": "Furkan Sezer"}], "author_count": 1}, {"id": "2608.05038", "category": "quant-ph", "title": "Symbol-Oriented Quantum Communication via Temporal-Mode Multiplexing", "abstract": "We introduce and analyze a quantum-assisted classical communication protocol that encodes symbols from a finite alphabet onto temporal modes using the LM05 operation as a building block. The protocol applies a bit-flip gate independently to temporal slots corresponding to message symbols, yielding a tensor product of LM05 operations on parallel channels. This tensor product structure enables collective attacks not covered by standard LM05 security proofs. We derive a theoretical upper bound on the success probability for complete recovery under random guessing, accounting for the receiver's 50\\% guessing ability on lost photons, and emphasize that this bound assumes perfect loss identification. We characterize the intended transmission, derive an asymptotic collective-attack bound for the symbol-set mode, and identify open challenges for composable security. The protocol is not a standalone Quantum Secure Direct Communication scheme, as the classical ordering information requires encryption. For a 53-symbol alphabet, the optimistic 1\\% success bound occurs at about 0.8 kilometers under zero QBER and reduces to about 0.6 kilometers for QBER equals 0.01; practical constraints severely limit performance.", "url": "https://arxiv.org/abs/2608.05038", "type": "理论", "summary": "我们介绍并分析了一种量子辅助经典通信协议，该协议使用 LM05 操作作为构建块将有限字母表中的符号编码到时间模式上。该协议将位翻转门独立地应用于与消息符号相对应的时间槽，从而在并行通道上产生 LM05 运算的张量积。这种张量积结构可以实现标准 LM05 安全证明未涵盖的集体攻击。我们推导出随机猜测下完全恢复成功概率的理论上限，考虑到接收器对丢失光子的 50% 猜测能力，并强调该界限假设完美的丢失识别。我们描述了预期的传输，推导出符号集模式的渐近集体攻击界限，并确定可组合安全性的开放挑战。该协议不是独立的量子安全直接通信方案，因为经典的订购信息需要加密。\n\n对于 53 个符号的字母表，乐观的 1\\% 成功界限发生在零 QBER 下的约 0.8 公里处，并且当 QBER 等于 0.01 时减少到约 0.6 公里；实际限制严重限制了性能。", "authors": [{"name": "Ali Vahedi"}, {"name": "Parsa Mahdavifar"}], "featured_authors": [{"name": "Ali Vahedi"}, {"name": "Parsa Mahdavifar"}], "author_count": 2}, {"id": "2608.05046", "category": "quant-ph", "title": "Preparation geometry and slow-sector routing in driven Kerr resonators: an operational spectral theory of Liouvillians", "abstract": "Liouvillian eigenvalues determine decay rates and oscillation frequencies, but not how the corresponding modes are excited, propagated, and detected in a chosen protocol. We develop an operational spectral theory based on matched left and right eigenoperators. Left eigenoperators determine excitation by an input or source; right eigenoperators determine the propagated density deformation and readout overlap; their product is a gauge-invariant modal weight. For bosonic systems, coherent preparations turn left eigenoperators into phase-space excitation maps whose zeros identify mode-selective suppression, while right eigenoperators yield the corresponding Wigner deformations. Resolved slow subspaces define operational coordinates and, when positivity and Markov-admissibility hold, a projected routing generator. In driven Kerr resonators, the framework identifies preparations that suppress a switching mode, separates symmetry-resolved relaxation channels, and reveals bias-induced crossovers in projected multichannel routing while the coherent-preparation partition continues to deform. Preparation geometry and slow-sector propagation thus provide complementary operational information beyond Liouvillian eigenvalues alone.", "url": "https://arxiv.org/abs/2608.05046", "type": "理论+数值", "summary": "刘维尔特征值决定衰减率和振荡频率，但不决定相应模式在所选协议中如何激发、传播和检测。我们开发了一种基于匹配的左右特征算子的运算谱理论。左特征算子通过输入或源确定激励；右特征算子确定传播密度变形和读出重叠；他们的产品是规格不变的模态重量。对于玻色子系统，相干准备将左本征算子转化为相空间激励图，其零点标识模式选择性抑制，而右本征算子产生相应的维格纳变形。解析的慢速子空间定义了操作坐标，并且当正性和马尔可夫可接受性成立时，定义了投影路由生成器。在驱动克尔谐振器中，该框架识别了抑制切换模式的准备工作，分离了对称解析的弛豫通道，并在相干准备分区继续变形的同时揭示了投影多通道路由中偏置引起的交叉。\n\n因此，准备几何和慢扇区传播提供了超越刘维尔特征值的补充操作信息。", "authors": [{"name": "Kilian Seibold"}], "featured_authors": [{"name": "Kilian Seibold"}], "author_count": 1}, {"id": "2608.05052", "category": "quant-ph", "title": "Constructing Non-Hermitian Theories with Tunable Exceptional Points and Controlled State Purification", "abstract": "Exceptional points (EP's) are a hallmark of non-Hermitian quantum systems. We show that momentum-space deformation provides a general design principle for creating and controlling EP's in quadratic many-body Hamiltonians. We identify universal criteria for the momentum sectors to host EP's and the corresponding critical deformation strengths, while revealing that a single momentum-sector EP induces quite remarkably an exponential proliferation of many-body eigenvector coalescences. We further establish EP's as a universal mechanism for purifying arbitrary mixed quantum states, uncovering distinct purification regimes and a fundamental odd-even system-size dichotomy in the thermodynamic limit. Our framework also provides a systematic reverse-engineering protocol for generating short- and long-range, reciprocal and nonreciprocal non-Hermitian quantum matter, together with an explicit Lindblad embedding. These results thus establish momentum-space deformation as a unified route to exceptional-point engineering and controlled design of many-body non-Hermitian quantum systems.", "url": "https://arxiv.org/abs/2608.05052", "type": "理论", "summary": "例外点（EP）是非厄米量子系统的标志。我们证明动量空间变形为在二次多体哈密顿量中创建和控制 EP 提供了通用设计原理。我们确定了容纳 EP 的动量扇区的通用标准以及相应的临界变形强度，同时揭示了单个动量扇区 EP 引起多体特征向量合并的指数级增殖。我们进一步将 EP 建立为纯化任意混合量子态的通用机制，揭示了不同的纯化机制和热力学极限中基本的奇偶系统尺寸二分法。我们的框架还提供了一个系统的逆向工程协议，用于生成短程和远程、互易和非互易的非厄米量子物质，以及显式的 Lindblad 嵌入。因此，这些结果将动量空间变形确立为多体非厄米量子系统的异常点工程和受控设计的统一途径。", "authors": [{"name": "Soumya Kanti Pal"}, {"name": "Rupak Majumder"}, {"name": "Shamik Gupta"}], "featured_authors": [{"name": "Soumya Kanti Pal"}, {"name": "Rupak Majumder"}, {"name": "Shamik Gupta"}], "author_count": 3}, {"id": "2608.05092", "category": "quant-ph", "title": "Perfect Games in Dimension-Bounded Communication", "abstract": "Perfect prepare-and-measure games exhibit an all-or-nothing quantum advantage: a quantum system of dimension $d$ satisfies every prescribed winning constraint, whereas a classical $d$-level message cannot. We establish two structural results for such forbidden-output support constraints. First, every binary-output support game reduces exactly to a conflict graph: perfect classical realization with a $d$-level message is equivalent to $d$-colorability, perfect $d$-dimensional quantum realization is equivalent to a $d$-dimensional orthogonal representation, and the minimum number of Bob inputs realizing a fixed conflict graph is its edge biclique-cover number. Second, for an arbitrary finite output alphabet, every perfect qubit strategy admits a perfect classical-bit realization. As a flagship application, the $13$-ray qutrit graph yields a compressed game $(X,Y,B)=(13,8,2)$ with $C_3=39<Q_3=S=40$, and eight Bob inputs are minimal among all binary-output realizations of that graph. Graph extensions demonstrate the mechanism in every dimension, while Torpedo and antidistinguishability games illustrate the genuinely nonbinary regime. These results connect exact communication, graph coloring, contextuality, state exclusion, and zero-error information theory.", "url": "https://arxiv.org/abs/2608.05092", "type": "理论", "summary": "完美的准备和测量游戏表现出全有或全无的量子优势：$d$ 维度的量子系统满足每个规定的获胜约束，而经典的 $d$ 级消息则不能。我们为这种禁止输出支持约束建立了两个结构结果。首先，每个二进制输出支持游戏都精确地简化为冲突图：具有$d$级消息的完美经典实现相当于$d$可着色性，完美的$d$维量子实现相当于$d$维正交表示，并且实现固定冲突图的Bob输入的最小数量是其边缘biclique覆盖数。其次，对于任意有限输出字母表，每个完美的量子位策略都承认完美的经典位实现。作为旗舰应用程序，$13$ 射线 qutrit 图生成一个压缩游戏 $(X,Y,B)=(13,8,2)$，其中 $C_3=39<Q_3=S=40$，并且八个 Bob 输入在该图的所有二进制输出实现中是最少的。图扩展展示了各个维度的机制，而鱼雷和反可区分性游戏则说明了真正的非二元机制。\n\n这些结果将精确通信、图形着色、上下文、状态排除和零错误信息理论联系起来。", "authors": [{"name": "E. Zambrini Cruzeiro"}], "featured_authors": [{"name": "E. Zambrini Cruzeiro"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
