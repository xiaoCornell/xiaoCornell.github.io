  <script>
    const papers = [{"id": "2608.04083", "category": "cond-mat", "title": "Breakdown of Monotonic Impurity Entropy Flow in $\\mathscr{PT}$-Symmetric Multichannel Kondo Systems", "abstract": "We study a $\\mathscr{PT}$-symmetric non-Hermitian multichannel Kondo model consisting of a pair of spin-$\\frac12$ impurities coupled to $n$ conduction-electron channels through complex-conjugate Kondo couplings. The impurity renormalization-group (RG) flow is characterized by the Kondo scale $T_K$ and a dimensionless non-Hermiticity parameter $\\alpha$. As $\\alpha$ increases, the exact Bethe Ansatz solution exhibits four impurity phases: overscreened Kondo, zero mode, Yu--Shiba--Rusinov (YSR), and local moment. The Kondo, zero-mode, and local-moment phases are $\\mathscr{PT}$-unbroken, whereas the YSR phase spontaneously breaks $\\mathscr{PT}$ symmetry. Using a generalized thermodynamic Bethe Ansatz, we determine the impurity free energy and Affleck--Ludwig $g$-function throughout the $\\mathscr{PT}$-unbroken phases. In the Kondo phase, the defect RG flow connects the ultraviolet and infrared conformal fixed points, with the impurity entropy flowing from $2\\ln2$ to $2\\ln\\left[2\\cos\\left(\\frac{\\pi}{n+2}\\right)\\right]$, in agreement with defect conformal field theory. In the zero-mode phase, zero-energy impurity strings reorganize the spectrum into multiple excitation towers, while in the local-moment phase, the RG flow becomes cyclic, returning to the unscreened local-moment fixed point. We conjecture that RG irreversibility, and hence a generalized Affleck--Ludwig $g$-theorem, survives throughout the Kondo phase. Our exact solution nevertheless shows that a real spectrum and defect entropies consistent with defect CFT do not guarantee RG irreversibility: the impurity entropy is non-monotonic in both the zero-mode and local-moment phases.", "url": "https://arxiv.org/abs/2608.04083", "type": "理论", "summary": "我们研究了 $\\mathscr{PT}$ 对称非厄米多通道 Kondo 模型，该模型由一对自旋 $\\frac12$ 杂质组成，通过复共轭 Kondo 耦合耦合到 $n$ 传导电子通道。杂质重正化群 (RG) 流的特征是近藤标度 $T_K$ 和无量纲非厄米参数 $\\alpha$。随着 $\\alpha$ 的增加，精确的 Bethe Ansatz 解呈现出四个杂质相：过筛近藤相、零模式、Yu-Shiba-Rusinov (YSR) 和局部矩。 Kondo、零模式和局部矩相位是 $\\mathscr{PT}$ 未破缺的，而 YSR 相位自发破坏 $\\mathscr{PT}$ 对称性。使用广义热力学 Bethe Ansatz，我们确定了整个 $\\mathscr{PT}$ 不间断相的杂质自由能和 Affleck--Ludwig $g$-函数。在近藤相中，缺陷RG流连接紫外和红外共形不动点，杂质熵从$2\\ln2$流向$2\\ln\\left[2\\cos\\left(\\frac{\\pi}{n+2}\\right)\\right]$，与缺陷共形场理论一致。\n\n在零模阶段，零能量杂质串将频谱重新组织成多个激励塔，而在局部矩阶段，RG流变成循环，返回到未屏蔽的局部矩固定点。我们推测 RG 不可逆性，以及广义的阿弗莱克-路德维希$g$定理，在整个近藤阶段中都存在。然而，我们的精确解表明，与缺陷 CFT 一致的真实谱和缺陷熵并不能保证 RG 不可逆性：杂质熵在零模和局部矩阶段都是非单调的。", "authors": [{"name": "Pradip Kattel"}, {"name": "Abay Zhakenov"}, {"name": "Natan Andrei"}], "featured_authors": [{"name": "Pradip Kattel"}, {"name": "Abay Zhakenov"}, {"name": "Natan Andrei"}], "author_count": 3}, {"id": "2608.04096", "category": "cond-mat", "title": "Magnetic-Field-Driven Dimensional Reduction in a Quantum Antiferromagnet", "abstract": "Low dimensionality enhances quantum fluctuations, triggering novel states of quantum matter to emerge. In real materials, low dimensionality usually arises from spatially strongly anisotropic couplings. Here, we demonstrate a different mechanism: in two-dimensional systems with coupled alternating ferromagnetic (FM) and antiferromagnetic (AFM) spin-$1/2$ chains, an applied magnetic field may drive a dimensional reduction. Under magnetic field, the FM chains polarize and stiffen, suppressing the propagation of transverse AFM fluctuations from one chain to another, and effectively induce one-dimensional behavior at low energies. For a model describing botallackite, Cu$_2$(OH)$_3$Br, quantum Monte Carlo dynamics show that beyond a critical magnetic field, the low-energy spectrum reduces to that of a one-dimensional AFM Heisenberg spin-$1/2$ chain with field-dependent incommensurate two-spinon fluctuations, providing clear signatures for inelastic neutron scattering.", "url": "https://arxiv.org/abs/2608.04096", "type": "理论+数值", "summary": "低维度增强了量子涨落，引发量子物质新态的出现。在实际材料中，低维通常由空间强各向异性耦合产生。在这里，我们演示了一种不同的机制：在具有耦合交替铁磁（FM）和反铁磁（AFM）自旋$1/2$链的二维系统中，施加的磁场可能会驱动尺寸减小。在磁场下，FM 链极化并变硬，抑制横向 AFM 波动从一条链传播到另一条链，并有效地诱导低能量下的一维行为。对于描述斜钾矿 Cu$_2$(OH)$_3$Br 的模型，量子蒙特卡罗动力学表明，在临界磁场之外，低能谱减少到一维 AFM 海森堡自旋 $1/2$ 链，具有场相关的不相称的双自旋涨落，为非弹性中子散射提供了清晰的特征。", "authors": [{"name": "Subhankar Khatua"}, {"name": "Marcin Raczkowski"}, {"name": "Jeroen van den Brink"}, {"name": "Fakher F. Assaad"}], "featured_authors": [{"name": "Subhankar Khatua"}, {"name": "Marcin Raczkowski"}, {"name": "Jeroen van den Brink"}, {"name": "Fakher F. Assaad"}], "author_count": 4}, {"id": "2608.04098", "category": "cond-mat", "title": "Entanglement entropy of fermions in a strange metal", "abstract": "The subsystem-size dependence of ground-state entanglement entropy and its crossover to thermal entropy as a function of temperature are well understood for one-dimensional (1D) gapless systems described by conformal field theory (CFT), and for free fermions with a Fermi surface in any dimension. However, little is known about the entanglement entropy for gapless fermionic systems without quasi-particles, such as a strange metal. Here we study the entanglement entropy of fermions in a solvable large-$N$ 1D lattice model akin to the Yukawa-Sachdev-Ye-Kitaev (Yukawa SYK) model. In this model, two Fermi points are coupled to scalar bosons via spatially random Yukawa interactions, providing a solvable model of a strange metal when the bosons become critical at a quantum critical point. We exactly compute the second Rényi entropy of fermions in a spatial subregion in this model. Our results unravel crucial role of intra-subregion entanglement between fermionic and bosonic degrees of freedom along with the inter-subregion entanglement in understanding the ground states of such strongly coupled fermion-boson systems. We show that the crossover from thermal entropy to entanglement entropy, is captured by a single scaling ansatz, that collapses the second Rényi entropy of fermions for different subregion sizes and temperatures into a single universal curve. We further show that the universal scaling curve for the critical strange metal is well described by the standard CFT formula, albeit with an effective central charge substantially larger than the non-interacting value.", "url": "https://arxiv.org/abs/2608.04098", "type": "理论", "summary": "对于共形场论 (CFT) 描述的一维 (1D) 无间隙系统以及具有任何维度费米表面的自由费米子，基态纠缠熵的子系统尺寸依赖性及其与热熵的交叉作为温度的函数是很好理解的。然而，人们对没有准粒子（例如奇怪金属）的无带隙费米子系统的纠缠熵知之甚少。在这里，我们研究类似于 Yukawa-Sachdev-Ye-Kitaev (Yukawa SYK) 模型的可解大 $N$ 一维晶格模型中费米子的纠缠熵。在该模型中，两个费米点通过空间随机汤川相互作用与标量玻色子耦合，当玻色子在量子临界点变得临界时，提供了奇怪金属的可解模型。我们精确地计算了该模型中空间子区域中费米子的第二 Rényi 熵。我们的结果揭示了费米子和玻色子自由度之间的子区域内纠缠以及子区域间纠缠在理解这种强耦合费米子-玻色子系统的基态方面的关键作用。\n\n我们表明，从热熵到纠缠熵的交叉是由单个缩放 ansatz 捕获的，它将不同子区域大小和温度的费米子的第二个 Rényi 熵折叠成一条通用曲线。我们进一步表明，标准 CFT 公式可以很好地描述关键奇异金属的通用标度曲线，尽管有效中心电荷远大于非相互作用值。", "authors": [{"name": "Santanu Singh"}, {"name": "Surajit Bera"}, {"name": "Chenyuan Li"}, {"name": "Subir Sachdev"}, {"name": "Sumilan Banerjee"}], "featured_authors": [{"name": "Santanu Singh"}, {"name": "Surajit Bera"}, {"name": "Chenyuan Li"}, {"name": "Subir Sachdev"}, {"name": "Sumilan Banerjee"}], "author_count": 5}, {"id": "2608.04168", "category": "cond-mat", "title": "Role of Particle Shape in Strain-Controlled Resuspension of Dense Suspensions", "abstract": "> Dense non-Brownian suspensions exhibit complex resuspension dynamics governed by hydrodynamic interactions, particle microstructure, and gravity. While viscous resuspension in spherical suspensions is known to be strain-controlled, its applicability to anisotropic particles remains unclear. Here, we investigate dense suspensions of spherical and rod-shaped particles under steady and oscillatory shear. The results reveal two strain-controlled transitions: particle detachment from the sediment bed and the transition to a fully suspended state. Both particle shapes exhibit the same critical strain for detachment, approximately 6, indicating that resuspension onset is largely independent of particle morphology. In contrast, complete resuspension requires a critical strain of approximately 120 for spheres and 180 for rods, demonstrating a strong effect of particle anisotropy. A fluid-strain scaling collapses the onset of resuspension across particle concentrations and shapes while highlighting the distinct influence of particle shape on complete suspension. These findings establish a unified strain-based framework for viscous resuspension and clarify the role of particle anisotropy in dense suspension dynamics.", "url": "https://arxiv.org/abs/2608.04168", "type": "理论", "summary": "> 致密非布朗悬浮液表现出复杂的再悬浮动力学，受流体动力学相互作用、颗粒微观结构和重力控制。虽然已知球形悬浮液中的粘性重悬浮是应变控制的，但其对各向异性颗粒的适用性仍不清楚。在这里，我们研究了稳定和振荡剪切下球形和棒状颗粒的致密悬浮液。结果揭示了两个应变控制的转变：颗粒从沉积物床上脱离以及转变为完全悬浮状态。两种颗粒形状表现出相同的分离临界应变，约为 6，表明再悬浮的开始很大程度上与颗粒形态无关。相比之下，完全重悬浮需要球体大约 120 的临界应变和棒体大约 180 的临界应变，这证明了颗粒各向异性的强烈影响。流体应变缩放破坏了颗粒浓度和形状之间的重新悬浮的开始，同时强调了颗粒形状对完全悬浮的明显影响。\n\n这些发现为粘性再悬浮建立了一个统一的基于应变的框架，并阐明了颗粒各向异性在稠密悬浮动力学中的作用。", "authors": [{"name": "Mohammadreza Mahmoudian"}, {"name": "Mahdi Vaezi"}, {"name": "Parisa Mirbod"}], "featured_authors": [{"name": "Mohammadreza Mahmoudian"}, {"name": "Mahdi Vaezi"}, {"name": "Parisa Mirbod"}], "author_count": 3}, {"id": "2608.04184", "category": "cond-mat", "title": "Pressure-Tunable Electronic and Magnonic Transport in Altermagnet La$_2$O$_3$Mn$_2$Se$_2$", "abstract": "Hydrostatic pressure provides a symmetry-preserving route to engineer electronic and magnonic transport in the correlated insulating altermagnet La$_2$O$_3$Mn$_2$Se$_2$. Using first-principles calculations combined with spin-Hamiltonian modeling, we show that compression from 0 to 40 GPa markedly enhances the inequivalence between the competing second-neighbor exchange interactions, increasing $|J_{2a}-J_{2b}|$ from 1.97 to 9.38 meV while preserving the compensated antiferromagnetic ground state. The resulting exchange anisotropy amplifies the momentum-dependent splitting between the two chiral magnon branches, yielding a nearly fourfold enhancement of the longitudinal magnon-driven spin Seebeck response at 100 K, from $3.68\\times10^{-1}$ to $1.36$ meV/K. In contrast, hydrostatic pressure preserves the magnetic-symmetry selection rules governing the anomalous Hall effect while redistributing the electronic Berry curvature, producing pronounced energy-dependent sign reversals in the anomalous Hall conductivity. These results identify exchange anisotropy as the microscopic mechanism underlying the pressure-enhanced magnon response and establish hydrostatic pressure as an effective means of simultaneously controlling electronic and magnonic transport in insulating altermagnets.", "url": "https://arxiv.org/abs/2608.04184", "type": "理论+数值", "summary": "静水压力为设计相关绝缘交变磁体 La$_2$O$_3$Mn$_2$Se$_2$ 中的电子和磁子传输提供了一条保持对称性的途径。使用第一性原理计算与自旋哈密尔顿模型相结合，我们发现从 0 到 40 GPa 的压缩显着增强了竞争性第二邻域交换相互作用之间的不等价性，将 $|J_{2a}-J_{2b}|$ 从 1.97 meV 增加到 9.38 meV，同时保留补偿的反铁磁基态。由此产生的交换各向异性放大了两个手性磁振子分支之间的动量依赖性分裂，使 100 K 时纵向磁振子驱动的自旋塞贝克响应增强了近四倍，从 3.68\\times10^{-1}$ 到 1.36$ meV/K。相比之下，静水压力保留了控制反常霍尔效应的磁对称选择规则，同时重新分布电子贝里曲率，在反常霍尔电导率中产生明显的能量相关符号反转。\n\n这些结果将交换各向异性确定为压力增强磁振子响应的微观机制，并将静水压力确定为同时控制绝缘交变磁体中电子和磁子传输的有效手段。", "authors": [{"name": "Nafise Rezaei"}, {"name": "Alireza Qaiumzadeh"}, {"name": "Artem R. Oganov"}, {"name": "Mojtaba Alaei"}], "featured_authors": [{"name": "Nafise Rezaei"}, {"name": "Alireza Qaiumzadeh"}, {"name": "Artem R. Oganov"}, {"name": "Mojtaba Alaei"}], "author_count": 4}, {"id": "2608.04209", "category": "cond-mat", "title": "Green's function theory of magnetism in Bi$_2$CuO$_4$: anisotropic Heisenberg XYZ model", "abstract": "The Green's function theory of Lymar' and Rudoi [Theor. Math. Phys. vol. 21, 990 (1974)] is generalized to the case of multiple intra- and inter-sublattice magnetic interactions in a collinear spin-half antiferromagnet and applied to magnetic excitations in Bi$_2$CuO$_4$. The spin Hamiltonian includes both the out-of-plane and in-plane symmetric anisotropy terms and the Zeeman term, which describes the interaction with an external magnetic field $B$ applied along the Néel vector. Within the spin-wave approximation we calculate spin excitation dispersion, antiferromagnetic resonance frequencies and the critical field $B_c$ of the spin-flop metamagnetic transition. A weak in-plane anisotropy is shown to result in a gap in the acoustic-like branch of the excitations. The gap nonlinearly depends on the external field and closes at $B=B_c$. An expression for the Neel temperature in the Tyablikov random phase approximation at zero field is derived. For the parameters derived from the recent inelastic neutron scattering study by Yuan et al. [Phys. Rev. B vol. 103, 134436 (2021)] it gives $T_{\\rm N}\\approx 52$~K.", "url": "https://arxiv.org/abs/2608.04209", "type": "理论", "summary": "Lymar' 和 Rudoi 的格林函数理论 [理论。数学。物理。卷。 21, 990 (1974)]被推广到共线自旋半反铁磁体中多个子晶格内和子晶格间磁相互作用的情况，并应用于 Bi$_2$CuO$_4$ 中的磁激励。自旋哈密顿量包括面外和面内对称各向异性项以及塞曼项，塞曼项描述与沿尼尔矢量施加的外部磁场 $B$ 的相互作用。在自旋波近似中，我们计算自旋激发色散、反铁磁共振频率和自旋翻转变磁跃迁的临界场 $B_c$。弱的面内各向异性被证明会导致激励的类声分支中出现间隙。间隙非线性地取决于外部场并且在$B=B_c$处闭合。推导了零场下 Tyablikov 随机相位近似中尼尔温度的表达式。对于来自 Yuan 等人最近的非弹性中子散射研究的参数。 [物理。修订版 B 卷。 103, 134436 (2021)] 它给出 $T_{\\rm N}\\approx 52$~K。", "authors": [{"name": "R.O. Kuzian"}, {"name": "E.E. Krasovskii"}], "featured_authors": [{"name": "R.O. Kuzian"}, {"name": "E.E. Krasovskii"}], "author_count": 2}, {"id": "2608.04219", "category": "cond-mat", "title": "First-principles predictions of carrier mobility with record accuracy using GW perturbation theory", "abstract": "Accurate prediction of carrier mobility is critical for the discovery and design of next-generation electronic materials. Despite sustained progress, state-of-the-art ab initio methods remain limited by the approximate treatment of electron-phonon interactions at the density functional theory level. Here, we demonstrate that incorporating many-body GW corrections to both the electronic band structure and electron--phonon couplings when solving the ab initio Boltzmann transport equation yields a mean absolute relative error of just 11% for electron mobilities across benchmark semiconductors, including Si, GaAs, GaP, diamond, and SiC. The common practice of neglecting GW corrections to the electron--phonon interaction can lead to mobility errors exceeding 50%. The present findings highlight the importance of many-body GW self-energy effects in carrier transport simulations, and provides fundamental insights into how many-body electron--phonon interactions govern charge transport in crystalline solids.", "url": "https://arxiv.org/abs/2608.04219", "type": "理论+数值", "summary": "准确预测载流子迁移率对于下一代电子材料的发现和设计至关重要。尽管取得了持续的进步，最先进的从头计算方法仍然受到密度泛函理论水平上电子-声子相互作用的近似处理的限制。在这里，我们证明，在求解从头算玻尔兹曼输运方程时，将多体引力波校正结合到电子能带结构和电子-声子耦合中，可以使基准半导体（包括 Si、GaAs、GaP、金刚石和 SiC）的电子迁移率平均绝对相对误差仅为 11%。忽略电子-声子相互作用的引力波校正的常见做法可能会导致迁移率误差超过 50%。目前的研究结果强调了多体引力波自能效应在载流子传输模拟中的重要性，并提供了关于多体电子-声子相互作用如何控制晶体固体中的电荷传输的基本见解。", "authors": [{"name": "Nick Pant"}, {"name": "Sabyasachi Tiwari"}, {"name": "Steven G. Louie"}, {"name": "Zhenglu Li"}, {"name": "Feliciano Giustino"}], "featured_authors": [{"name": "Nick Pant"}, {"name": "Sabyasachi Tiwari"}, {"name": "Steven G. Louie"}, {"name": "Zhenglu Li"}, {"name": "Feliciano Giustino"}], "author_count": 5}, {"id": "2608.04269", "category": "cond-mat", "title": "Magnetic Field Reorganization of Electronic States in Moiré Bilayer Graphene", "abstract": "Magnetic fields are widely used to diagnose quantum phases in two-dimensional systems through quantum oscillations or by tuning spin and valley polarizations, but magnetic fields can also reshape the underlying electronic structure. Here, using a bilayer graphene/hBN moiré system, we reveal a rich magnetic field induced evolution of the semiclassical orbit network, encompassing Lifshitz transitions, magnetic breakdown, and scattering between coexisting electron and hole pockets. At magnetic fields of 1 T to 2 T, quantum oscillation frequencies and the Hall density change markedly over a broad carrier density range, signaling magnetic breakdown and magnetic Lifshitz transitions. This evolution is valley contrasting: Berry curvature hot spots near the breakdown junctions enhance magnetic breakdown in the K valley while suppressing it in the K$^\\prime$ valley, whereas valley-antisymmetric orbital magnetic moments split the corresponding Lifshitz transitions. The resulting valley-selective trajectories manifest at higher fields as valley-symmetry-breaking Hofstadter gaps. At elevated temperatures and low magnetic fields, scattering between coexisting electron and hole pockets produces nearly density-independent resistance oscillations whose frequency tracks the sum of their Fermi surface areas, persisting after conventional Onsager oscillations are thermally washed out. Our results provide a unified picture of how modest magnetic fields reorganize moiré electronic states as the system evolves from semiclassical transport toward the Hofstadter regime.", "url": "https://arxiv.org/abs/2608.04269", "type": "理论", "summary": "磁场广泛用于通过量子振荡或通过调整自旋和谷极化来诊断二维系统中的量子相，但磁场也可以重塑底层的电子结构。在这里，我们使用双层石墨烯/六方氮化硼莫尔系统，揭示了半经典轨道网络的丰富磁场诱导演化，包括利夫希茨跃迁、磁击穿以及共存电子和空穴之间的散射。在 1 T 至 2 T 的磁场下，量子振荡频率和霍尔密度在较宽的载流子密度范围内显着变化，发出磁击穿和磁 Lifshitz 跃迁信号。这种演变是谷对比：击穿结附近的贝里曲率热点增强了 K 谷中的磁击穿，同时抑制了 K$^\\prime$ 谷中的磁击穿，而谷反对称轨道磁矩则分裂了相应的 Lifshitz 跃迁。由此产生的谷选择性轨迹在较高场表现为谷对称破缺的霍夫施塔特间隙。\n\n在高温和低磁场下，共存的电子和空穴之间的散射产生几乎与密度无关的电阻振荡，其频率跟踪其费米表面积的总和，在传统的昂萨格振荡被热冲掉后仍然持续存在。我们的结果提供了一个统一的图景，说明当系统从半经典输运向霍夫施塔特体系演化时，适度的磁场如何重组莫尔电子态。", "authors": [{"name": "Milan Sharma Mandigo-Stoba"}, {"name": "William Wang"}, {"name": "Jackson Kuklin"}, {"name": "Jack Lichterman"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Qianhui Shi"}], "featured_authors": [{"name": "Milan Sharma Mandigo-Stoba"}, {"name": "William Wang"}, {"name": "Jackson Kuklin"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Qianhui Shi"}], "author_count": 7}, {"id": "2608.04291", "category": "cond-mat", "title": "Electron correlation in semiconductors and insulators via symbolic regression", "abstract": "Predicting quasiparticle energies in materials requires expensive numerical evaluations of the electron self-energy. This limits calculations to ordered systems with small unit cells. Here, using symbolic regression, we show that the GW self-energy can be accurately approximated with compact analytical functions of physically motivated Kohn-Sham descriptors. These expressions can be learned from a single GW calculation in the ordered phase and remain accurate under symmetry breaking induced by quantum and thermal fluctuations, elastic deformations, and amorphous disorder. This development enables routine GW calculations of complex materials with thousands of atoms at a computational cost comparable to semi-local density functional theory. We demonstrate the accuracy of this approach for covalent semiconductors, ionic insulators, and two-dimensional materials. These results establish symbolic regression as a viable route to predictive, interpretable, and transferable many-body electronic structure models.", "url": "https://arxiv.org/abs/2608.04291", "type": "理论+数值", "summary": "预测材料中的准粒子能量需要对电子自能进行昂贵的数值评估。这限制了对具有小晶胞的有序系统的计算。在这里，我们使用符号回归表明，引力波自能可以通过物理驱动的 Kohn-Sham 描述符的紧凑分析函数精确地近似。这些表达式可以从有序相中的单个引力场计算中获知，并且在量子和热涨落、弹性变形和非晶无序引起的对称性破缺下保持准确。这一进展使得能够以与半局域密度泛函理论相当的计算成本对具有数千个原子的复杂材料进行常规引力场计算。我们证明了这种方法对于共价半导体、离子绝缘体和二维材料的准确性。这些结果将符号回归确立为预测、可解释和可转移的多体电子结构模型的可行途径。", "authors": [{"name": "Nick Pant"}, {"name": "Viet-Anh Ha"}, {"name": "Donghwan Kim"}, {"name": "Feliciano Giustino"}], "featured_authors": [{"name": "Nick Pant"}, {"name": "Viet-Anh Ha"}, {"name": "Donghwan Kim"}, {"name": "Feliciano Giustino"}], "author_count": 4}, {"id": "2608.04350", "category": "cond-mat", "title": "Quantized topological invariant of symmetry-projected Gibbs states", "abstract": "We study Gibbs states projected onto the symmetric sector of contractible one-form symmetries. In a three-dimensional cluster-model interpolation, this projection stabilizes symmetry-protected topological and projected-paramagnetic phases, both sharply distinct from thermal disorder. A flux-twisted membrane invariant distinguishes these three phases by the values $-1,+1,0$, respectively. These values are exact on the endpoint, self-dual, zero-temperature, and infinite-temperature lines; elsewhere their quantization requires positive spatial-sheet, winding-line, and interface tensions. Quantum Monte Carlo supports the quantization through tension diagnostics and direct finite-size estimates.", "url": "https://arxiv.org/abs/2608.04350", "type": "理论+数值", "summary": "我们研究投射到可收缩一式对称对称扇形上的吉布斯态。在三维簇模型插值中，该投影稳定了对称保护的拓扑相和投影顺磁相，这两者都与热无序截然不同。通量扭曲膜不变量分别通过值 $-1,+1,0$ 来区分这三个阶段。这些值在端点、自对偶、零温度和无限温度线上是精确的；在其他地方，它们的量子化需要正的空间片、缠绕线和界面张力。量子蒙特卡罗支持通过张力诊断和直接有限大小估计进行量化。", "authors": [{"name": "Weiguang Cao"}, {"name": "Haruki Watanabe"}], "featured_authors": [{"name": "Weiguang Cao"}, {"name": "Haruki Watanabe"}], "author_count": 2}, {"id": "2608.04359", "category": "cond-mat", "title": "Unveiling the Role of Friction in Coarse-Grained Clay: A Hybrid Framework Integrating Long-Range Interactions and Granular Contact Mechanics", "abstract": "Given the predominant role of inter-particle physicochemical forces in governing clay behavior, researchers have increasingly utilized coarse-grained molecular dynamics (CGMD) simulations. However, inter-particle friction has been historically overlooked due to methodological limitations, and the extent to which this omission influences simulation accuracy remains an unresolved question. This study proposes a novel hybrid CGMD framework explicitly coupling long-range Buckingham potential with Hertzian granular contact mechanics. A baseline model was validated via isotropic compression, where the resulting compressibility and derived compression index (Cc) aligned with macroscopic geotechnical observations. Parametric analyses revealed that viscoelastic damping of particle contacts governs structural evolution. Elevated damping suppresses densification, trapping platelets in disorganized, high-void-ratio configurations. Furthermore, evaluating the interplay with thermal fluctuations underscores the necessity of precise temperature control to prevent such unphysical kinetic trapping. Finally, uniaxial compression tests demonstrate the critical importance of inter-particle friction. Explicit friction locks sliding interfaces and sustains significantly higher loads compared to frictionless models; the latter rely solely on geometric interlocking and ultimately exhibit unphysical fluid-like yielding. By bridging atomistic potentials with contact mechanics, this framework highlights the fundamental role of the inter-particle friction and offers essential guidelines for future multi-scale simulations of clay assemblies.", "url": "https://arxiv.org/abs/2608.04359", "type": "理论+数值", "summary": "鉴于颗粒间物理化学力在控制粘土行为中的主导作用，研究人员越来越多地利用粗粒度分子动力学（CGMD）模拟。然而，由于方法上的限制，颗粒间摩擦历来被忽视，这种忽略对模拟精度的影响程度仍然是一个悬而未决的问题。本研究提出了一种新颖的混合 CGMD 框架，将长程白金汉势与赫兹颗粒接触力学明确耦合。通过各向同性压缩验证基线模型，所得压缩率和导出的压缩指数 (Cc) 与宏观岩土观测结果一致。参数分析表明，颗粒接触的粘弹性阻尼控制着结构演化。提高阻尼会抑制致密化，将血小板捕获在无序的高空隙率结构中。此外，评估与热波动的相互作用强调了精确温度控制的必要性，以防止这种非物理动力学捕获。最后，单轴压缩试验证明了颗粒间摩擦的至关重要性。\n\n与无摩擦模型相比，显式摩擦锁定滑动界面并承受明显更高的负载；后者仅依赖于几何联锁，并最终表现出非物理的流体状屈服。通过将原子势与接触力学联系起来，该框架强调了颗粒间摩擦的基本作用，并为未来粘土组件的多尺度模拟提供了重要指导。", "authors": [{"name": "Wang-Qi Xu"}, {"name": "Yijie Wang"}, {"name": "Zhen-Yu Yin"}], "featured_authors": [{"name": "Wang-Qi Xu"}, {"name": "Yijie Wang"}, {"name": "Zhen-Yu Yin"}], "author_count": 3}, {"id": "2608.04395", "category": "cond-mat", "title": "Zero-Clustering Geometry in Realistic Fractional Quantum Hall Wave Functions", "abstract": "The clustering pattern of zeros in the ground state of a fractional quantum Hall system is a defining feature of its topological properties. We analyze the geometrical fluctuations of the zeros around individual electrons and propose to use the displacement ratio of the zeros to visualize and measure the distance of a realistic state to a model wave function. The distribution of the zero displacement ratio behaves like an order parameter in the transition from a Laughlin phase to a topologically trivial one. The statistical comparison between quantum Hall states belonging to different Jain sequences leads to a composite fermion fluid description of the $\\nu = 1/5$ ground state with long-range Coulomb interaction that agrees almost perfectly for as few as $3$-$5$ electrons, overcoming the long-standing difficulties of accommodating the competing liquid and crystal orders at short distances.", "url": "https://arxiv.org/abs/2608.04395", "type": "理论", "summary": "分数量子霍尔系统基态中零点的聚集模式是其拓扑性质的一个决定性特征。我们分析了单个电子周围零点的几何涨落，并建议使用零点的位移比来可视化和测量实际状态与模型波函数的距离。零位移比的分布表现为从劳克林相到拓扑平凡相转变中的阶次参数。属于不同 Jain 序列的量子霍尔态之间的统计比较导致了对 $\\nu = 1/5$ 基态的复合费米子流体描述，其具有长程库仑相互作用，对于少至 $3$-$5$ 的电子几乎完全一致，克服了在短距离适应竞争性液体和晶体秩序的长期困难。", "authors": [{"name": "Xin Wan"}, {"name": "Ziang Wang"}, {"name": "Zi-Xiang Hu"}, {"name": "Zhao Liu"}], "featured_authors": [{"name": "Xin Wan"}, {"name": "Ziang Wang"}, {"name": "Zi-Xiang Hu"}, {"name": "Zhao Liu"}], "author_count": 4}, {"id": "2608.04508", "category": "cond-mat", "title": "Microscopic theory of the field-induced instability of the vortex-free state in superconducting thin-film strips", "abstract": "In the Pearl--London theory, the edge-barrier-disappearance field of a superconducting thin-film strip depends on an arbitrary short-distance core cutoff because the vortex is treated as a point object. The theory does not determine the cutoff or how it depends on temperature $T$, and therefore cannot determine the $T$ dependence of the instability field. Here we formulate the microscopic stability problem directly for the vortex-free superconducting state. This removes the core-cutoff ambiguity and determines the instability field $B_s$ over the full temperature range and across all width regimes considered here. For a homogeneous dirty strip with negligible self-field, three width regimes occur. For $W<W_1(T)$, superconductivity disappears continuously into the normal state through a one-dimensional (1D) instability. For $W_1(T)<W<W_2(T)$, an edge-selective two-dimensional (2D) long-wavelength mode becomes unstable. For $W>W_2(T)$, the critical wave number is finite and the unstable mode is localized near an edge. In the wide-strip limit, $B_s\\propto1/W$, recovering the Pearl--London scaling. In sufficiently narrow strips, however, the Pearl--London edge-barrier picture fails qualitatively.", "url": "https://arxiv.org/abs/2608.04508", "type": "理论", "summary": "在 Pearl-London 理论中，超导薄膜带的边缘势垒消失场取决于任意短距离核心截止，因为涡流被视为点对象。该理论未确定截止值或它如何依赖于温度 $T$，因此无法确定不稳定场的 $T$ 依赖性。在这里，我们直接制定无涡超导态的微观稳定性问题。这消除了核心截止模糊性，并确定了在整个温度范围和此处考虑的所有宽度范围内的不稳定场 $B_s$。对于自场可忽略不计的均匀脏带，会出现三种宽度状态。对于 $W<W_1(T)$，超导性通过一维 (1D) 不稳定性不断消失进入正常状态。对于 $W_1(T)<W<W_2(T)$，边缘选择性二维 (2D) 长波长模式变得不稳定。对于 $W>W_2(T)$，临界波数是有限的，不稳定模式位于边缘附近。在宽带限制中，$B_s\\propto1/W$，恢复珍珠-伦敦缩放。\n\n然而，在足够窄的地带，珍珠-伦敦边缘屏障图片在质量上是失败的。", "authors": [{"name": "Takayuki Kubo"}], "featured_authors": [{"name": "Takayuki Kubo"}], "author_count": 1}, {"id": "2608.04534", "category": "cond-mat", "title": "Wavepacket Approach for Spin Transport in Zigzag Spin Chain", "abstract": "We study the spin transport property of a spin nematic liquid in a frustrated zigzag spin chain in a magnetic field from the perspective of the time evolution of wavepackets by a time-dependent density-matrix renormalization group method. We use the periodic boundary condition to avoid an edge-induced magnetization structure in the open boundary condition. We find that at the saturation, a magnon-pair wavepacket of momentum k=pi stays localized, since the gapless dispersion due to the antiferro-quadrupole quasi-long-range order has a rather flat structure, indicating zero propagation velocity.", "url": "https://arxiv.org/abs/2608.04534", "type": "理论+数值", "summary": "我们通过依赖时间的密度矩阵重正化群方法，从波包时间演化的角度研究了磁场中受挫之字形自旋链中自旋向列液体的自旋输运特性。我们使用周期性边界条件来避免开放边界条件中的边缘感应磁化结构。我们发现，在饱和时，动量 k=pi 的磁振子对波包保持局域化，因为反铁四极准长程有序导致的无间隙色散具有相当平坦的结构，表明传播速度为零。", "authors": [{"name": "Hiroaki Onishi"}], "featured_authors": [{"name": "Hiroaki Onishi"}], "author_count": 1}, {"id": "2608.04558", "category": "cond-mat", "title": "Analytical Floquet Quantum Statistics from Nonequilibrium Green's Functions", "abstract": "We derive an analytical expression for the steady-state quantum statistics of periodically driven quantum systems coupled to a bath using the nonequilibrium Green's function (NEGF) formalism. By embedding Floquet theory into NEGF, we obtain closed expressions for the retarded, advanced, and lesser Green's functions in the Floquet representation, yielding the Floquet Fermi distribution in which the steady-state occupation is expressed as a weighted sum of Fermi functions shifted by integer multiples of the driving frequency. The weights are determined solely by the Fourier components of the micromotion operator, providing a transparent interpretation of Floquet sideband occupations. Our analysis extends beyond the diagonal commuting Hamiltonians treated in earlier work, and further shows that the robust Floquet distribution remains valid for a broad class of weakly coupled bath spectral functions beyond the ideal featureless-bath approximation. Finally, we establish a Floquet version of the Landauer formula for the DC part of the current, in which the equilibrium Fermi functions are replaced by their Floquet-modified counterparts. Together, these results provide a coherent description of Floquet quantum statistics and transport in periodically driven open quantum systems.", "url": "https://arxiv.org/abs/2608.04558", "type": "理论", "summary": "我们使用非平衡格林函数 (NEGF) 形式导出了与浴耦合的周期性驱动量子系统的稳态量子统计的解析表达式。通过将 Floquet 理论嵌入到 NEGF 中，我们获得了 Floquet 表示中的延迟格林函数、超前格林函数和较小格林函数的闭合表达式，从而产生了 Floquet 费米分布，其中稳态占据被表示为移动驱动频率整数倍的费米函数的加权和。权重仅由微动算子的傅里叶分量决定，提供了对 Floquet 边带占用的透明解释。我们的分析超出了早期工作中处理的对角交换哈密顿量，并进一步表明，除了理想的无特征浴近似之外，稳健的 Floquet 分布对于一大类弱耦合浴谱函数仍然有效。最后，我们针对电流的直流部分建立了兰道尔公式的 Floquet 版本，其中平衡费米函数被 Floquet 修改的对应函数所取代。\n\n总之，这些结果为周期性驱动的开放量子系统中的 Floquet 量子统计和传输提供了连贯的描述。", "authors": [{"name": "Yuhua Ren"}, {"name": "Gaomin Tang"}, {"name": "Hui Pan"}, {"name": "Jian-Sheng Wang"}], "featured_authors": [{"name": "Yuhua Ren"}, {"name": "Gaomin Tang"}, {"name": "Hui Pan"}, {"name": "Jian-Sheng Wang"}], "author_count": 4}, {"id": "2608.04637", "category": "cond-mat", "title": "Structural and dynamical behavior of methane-water systems under nanoconfinement", "abstract": "We investigate the structural and dynamical behavior of methane water systems under nanoconfinement using molecular dynamics simulations across pore widths from 1 to 5 nm. Structural analysis reveals a strong and nonmonotonic dependence on confinement: while tetrahedral ordering partially recovers as confinement is reduced, cubic like order associated with clathrate precursors is maximized at intermediate pore sizes. Radial distribution functions show that three dimensional correlations are suppressed under strong confinement, whereas lateral ordering persists, indicating a reduction in the effective dimensionality of structural organization. Transport properties reflect the same structural competition. Parallel diffusion is nonmonotonic with pore size, while perpendicular motion is subdiffusive due to confinement induced trapping and heterogeneity. Methane exhibits stronger subdiffusion and remains dynamically coupled to the water matrix. A characteristic confinement length scale emerges at which structural ordering, dynamical heterogeneity, and solvent solute decoupling are simultaneously maximized. At strong confinement, three dimensional correlations are suppressed, leading to dimensional reduction, frustrated ordering, and inhibited nucleation.", "url": "https://arxiv.org/abs/2608.04637", "type": "数值", "summary": "我们使用孔径从 1 到 5 nm 的分子动力学模拟来研究纳米约束下甲烷水系统的结构和动力学行为。结构分析揭示了对限制的强烈且非单调的依赖性：虽然随着限制的减少，四面体有序性部分恢复，但与笼形前体相关的立方类有序性在中等孔径处最大化。径向分布函数表明，三维相关性在强约束下受到抑制，而横向排序仍然存在，表明结构组织的有效维度降低。交通属性也反映了同样的结构性竞争。平行扩散与孔径大小是非单调的，而垂直运动由于限制引起的捕获和异质性而呈次扩散。甲烷表现出更强的次扩散并保持与水基质的动态耦合。出现了一种特征限制长度尺度，在该尺度上结构有序性、动力学异质性和溶剂溶质解耦同时最大化。\n\n在强限制下，三维相关性被抑制，导致尺寸减小、有序性受挫和成核受到抑制。", "authors": [{"name": "José Torres-Arenas"}, {"name": "Ángel M. Fernández-Fernández"}, {"name": "Martín Pérez-Rodríguez"}, {"name": "Manuel M. Piñeiro"}], "featured_authors": [{"name": "José Torres-Arenas"}, {"name": "Ángel M. Fernández-Fernández"}, {"name": "Martín Pérez-Rodríguez"}, {"name": "Manuel M. Piñeiro"}], "author_count": 4}, {"id": "2608.04649", "category": "cond-mat", "title": "Nanosecond timescale plasticity in shock-compressed polycrystalline MgO: evidence for transition in mechanism above 100 GPa", "abstract": "The mechanical properties of ceramics under extreme conditions directly impact applications ranging from shielding spacecrafts, designing plasma facing materials in nuclear fusion to understanding the rheology of deep planetary interiors. Here, we use polycrystalline MgO as a model ceramic to understand the high-pressure-temperature mechanical behaviour of such materials under extreme strain rates. We use laser-driven shock compression up to 175(15) GPa on the principal Hugoniot along with ultrafast diagnostics at the European X-ray Free Electron Laser to probe the dominant deformation mechanisms with changing P -T conditions. These near-instantaneous time-resolved snapshots, coupled with elasto-viscoplastic self-consistent (EVPSC) simulations, strongly suggest that MgO attains plastic regime in the nanoseconds scale accompanied by a pressure-mediated change in dominant slip system between 95 and 175 GPa. This work provides a new direct window into the deformation dynamics of polycrystalline ceramics under high-velocity impacts.", "url": "https://arxiv.org/abs/2608.04649", "type": "理论+数值", "summary": "陶瓷在极端条件下的机械性能直接影响各种应用，从屏蔽航天器、设计核聚变中的等离子体表面材料到了解深行星内部的流变学。在这里，我们使用多晶 MgO 作为模型陶瓷来了解此类材料在极端应变率下的高压高温机械行为。我们在主要 Hugoniot 上使用高达 175(15) GPa 的激光驱动冲击压缩，并在欧洲 X 射线自由电子激光器上进行超快诊断，以探测随 P -T 条件变化的主要变形机制。这些近乎瞬时的时间分辨快照，加上弹粘塑性自洽 (EVPSC) 模拟，强烈表明 MgO 达到纳秒级的塑性状态，同时主导滑移系统在 95 至 175 GPa 之间发生压力介导的变化。这项工作为了解高速冲击下多晶陶瓷的变形动力学提供了一个新的直接窗口。", "authors": [{"name": "A. Chakraborti"}, {"name": "H. Ginestet"}, {"name": "F. Bertrand"}, {"name": "J. Chantel"}, {"name": "S. Merkel"}, {"name": "M. Harmand"}, {"name": "S. Pandolfi"}, {"name": "A. Amouretti"}, {"name": "M. Andrzejewski"}, {"name": "K. Appel"}, {"name": "E. Barraud"}, {"name": "A.B. Belonoshko"}, {"name": "E. Brambrink"}, {"name": "K. Buakor"}, {"name": "C. Camarda"}, {"name": "O. Castelnau"}, {"name": "D.M. Cheshire"}, {"name": "G. Collins"}, {"name": "T.E. Cowan"}, {"name": "C. Crépisson"}, {"name": "J. Deng"}, {"name": "X. Fang"}, {"name": "M. Fitzgerald"}, {"name": "A. Gleason"}, {"name": "F. Hanby"}, {"name": "N.J. Hartley"}, {"name": "P.G. Heighway"}, {"name": "H. Höppner"}, {"name": "N. Jaisle"}, {"name": "J. Kim"}, {"name": "Z. Konopkova"}, {"name": "D. Kraus"}, {"name": "A. Krygier"}, {"name": "L. Libon"}, {"name": "C.M. Lonsdale"}, {"name": "S-N. Luo"}, {"name": "W. Lynn"}, {"name": "M. Masruri"}, {"name": "E.E. McBride"}, {"name": "D. McGonegle"}, {"name": "J.D. McHardy"}, {"name": "M.I. McMahon"}, {"name": "R.S. McWilliams"}, {"name": "T. Michelat"}, {"name": "B. Nagler"}, {"name": "M. Nakatsutsumi"}, {"name": "A-M. Norton"}, {"name": "I. Ocampo"}, {"name": "I.I. Oleynik"}, {"name": "C. Otzen"}, {"name": "S.E. Parsons"}, {"name": "D.J. Peake"}, {"name": "A. Pelka"}, {"name": "A. Phelipeau"}, {"name": "C. Prescher"}, {"name": "T.R. Preston"}, {"name": "N. Pulver"}, {"name": "L. Rogal"}, {"name": "J-P. Schwinkendorf"}, {"name": "G. Shoulga"}, {"name": "R.F. Smith"}, {"name": "S. Singh"}, {"name": "C.N. Somarathna"}, {"name": "T. Stevens"}, {"name": "C.V. Storm"}, {"name": "C. Strohm"}, {"name": "T-A. Suer"}, {"name": "M. Tang"}, {"name": "A. Tipeev"}, {"name": "M. Toncian"}, {"name": "T. Toncian"}, {"name": "U. Trdan"}, {"name": "T. Tschentscher"}, {"name": "J.D. Umpleby-Thorp"}, {"name": "L. Wang"}, {"name": "J.S. Wark"}, {"name": "A. Descamps"}, {"name": "A. Higginbotham"}, {"name": "T.M. Hutchinson"}, {"name": "C. McGuire"}, {"name": "A. Sollier"}, {"name": "G. Morard"}, {"name": "J.H. Eggert"}], "featured_authors": [{"name": "A. Chakraborti"}, {"name": "H. Ginestet"}, {"name": "F. Bertrand"}, {"name": "A. Sollier"}, {"name": "G. Morard"}, {"name": "J.H. Eggert"}], "author_count": 83}, {"id": "2608.04731", "category": "cond-mat", "title": "An improved car-oriented mean-field theory for stochastic traffic flow models", "abstract": "We propose an improved mean-field analysis of cellular automata models of single-lane vehicular traffic. By combining aspects of the Car-Oriented-Mean-Field (COMF) theory and the 2-site cluster method, which have been previously successfully applied to similar models, we aim to capture both short- and long-range correlations more accurately. In contrast to classical mean-field theories, the improved method is well suited for models with inhomogeneous stationary states and able to capture the essential properties of phase separation, e.g. in models with slow-to-start rules. The improved accuracy and new physical insights are illustrated through an application to the VDR model with $v_{\\text{max}}=1$.", "url": "https://arxiv.org/abs/2608.04731", "type": "理论", "summary": "我们提出了一种改进的单车道车辆交通元胞自动机模型的平均场分析。通过结合之前已成功应用于类似模型的面向汽车的平均场 (COMF) 理论和 2 站点聚类方法的各个方面，我们的目标是更准确地捕获短期和长期相关性。与经典平均场理论相比，改进的方法非常适合具有非均匀稳态的模型，并且能够捕获相分离的基本属性，例如在具有慢启动规则的模型中。通过 $v_{\\text{max}}=1$ 的 VDR 模型的应用说明了改进的准确性和新的物理见解。", "authors": [{"name": "Yasar Efe Dai"}, {"name": "Andreas Schadschneider"}, {"name": "Michael Schreckenberg"}], "featured_authors": [{"name": "Yasar Efe Dai"}, {"name": "Andreas Schadschneider"}, {"name": "Michael Schreckenberg"}], "author_count": 3}, {"id": "2608.04748", "category": "cond-mat", "title": "Residual Saturation under Pressure-Controlled Drainage", "abstract": "Here, pressure-controlled drainage is formulated as bond percolation with trapping on the pore-network graph, establishing a direct connection between percolation theory and pressure--saturation relations. In two dimensions, the deviation of the residual saturation from its non-vanishing thermodynamic limit obeys a finite-size scaling law with exponent $\\delta \\approx 0.25$, independent of microscopic details of the lattice. In three dimensions, finite-size corrections decay more rapidly ($\\delta \\approx 0.75$), while the asymptotic residual saturation remains finite and depends on coordination number. This extends the standard invasion-percolation picture beyond the breakthrough state, where the invading cluster is fractal and the invaded-phase saturation vanishes in the infinite-size limit.", "url": "https://arxiv.org/abs/2608.04748", "type": "理论+数值", "summary": "这里，压力控制排水被表述为在孔隙网络图上具有捕获的键渗流，在渗流理论和压力-饱和度关系之间建立了直接联系。在二维中，残余饱和度与其非消失热力学极限的偏差服从有限尺寸缩放定律，指数为 $\\delta \\approx 0.25$，与晶格的微观细节无关。在三个维度中，有限大小的修正衰减得更快（$\\delta \\大约 0.75$），而渐近残差饱和度仍然是有限的并且取决于配位数。这将标准的入侵渗透图扩展到突破状态之外，其中入侵簇是分形的，并且入侵相饱和度在无限大小限制中消失。", "authors": [{"name": "Fernando Alonso-Marroquin"}, {"name": "Hans J. Herrmann"}], "featured_authors": [{"name": "Fernando Alonso-Marroquin"}, {"name": "Hans J. Herrmann"}], "author_count": 2}, {"id": "2608.04754", "category": "cond-mat", "title": "Unifying microscopic theories for the phono-magnetic effect", "abstract": "Phonon angular momentum induces an effective magnetic field, a phenomenon called phono-magnetic effect, which has been measured to vary significantly in size. Here, we compare three approaches for deriving the effective magnetic field of a phonon, using electron-phonon coupling and orbital magnetism. The adiabatic approach assumes a slow ionic motion, keeping electrons in the ground state. The perturbative approach treats the electron-phonon interaction as a perturbation to the electronic ground state, and the Floquet approach is based on the time-periodicity of the circular ionic motion. We show that all three approaches lead to the same effective Hamiltonian in the low-frequency limit, which moves us closer towards a unified theory of the phono-magnetic effect. Furthermore, we identify two phononic contributions to the sample magnetization, spontaneous and induced. Thus, we clarify the role of the effective magnetic field in the phonon-induced magnetization. We conclude by providing a numerical estimate for the effective magnetic field in SrTiO$_3$.", "url": "https://arxiv.org/abs/2608.04754", "type": "理论+数值", "summary": "声子角动量会产生有效磁场，这种现象称为声磁效应，经测量其大小变化很大。在这里，我们比较了使用电子声子耦合和轨道磁性导出声子有效磁场的三种方法。绝热方法假设离子运动缓慢，使电子保持在基态。微扰方法将电子-声子相互作用视为对电子基态的微扰，而 Floquet 方法则基于圆形离子运动的时间周期性。我们证明，所有三种方法都会在低频极限下产生相同的有效哈密顿量，这使我们更接近声磁效应的统一理论。此外，我们还确定了对样品磁化强度的两种声子贡献：自发磁化和感应磁化。因此，我们阐明了有效磁场在声子感生磁化中的作用。最后，我们对 SrTiO$_3$ 中的有效磁场进行了数值估计。", "authors": [{"name": "Natalia Shabala"}, {"name": "Finja Tietjen"}, {"name": "Ylva Liljegren"}, {"name": "R. Matthias Geilhufe"}], "featured_authors": [{"name": "Natalia Shabala"}, {"name": "Finja Tietjen"}, {"name": "Ylva Liljegren"}, {"name": "R. Matthias Geilhufe"}], "author_count": 4}, {"id": "2608.04762", "category": "cond-mat", "title": "Emergent Replica Clock Unifies Many-Body Localization and Thermalization", "abstract": "Many-body localization (MBL) and eigenstate thermalization (ETH) are traditionally distinguished by a collection of separate diagnostics, not by a single order parameter. We show that replication and folding of isolated unitary dynamics generate a complex statistical mechanics of forward--backward history pairings and, in a closed cyclic infrared sector, an emergent clock $r_x\\in\\mathbb Z_t$. Its correlator has three distinct asymptotics: exponential decay in MBL, scale-free decay at criticality, and long-range locking in the thermal phase. A controlled $l$-bit reduction makes the clock action quasi-local, while its inverse correlation length obeys $\\xi_{\\rm pair}^{-1}=\\kappa_{\\rm el}=\\ln|\\rho_0/\\rho_q|$, unifying history coherence, the defect line tension, and the transfer spectrum. Replica order supplies a second, discrete coordinate---the first order at which a hidden dynamical invariant becomes visible---and can distinguish localized dynamics that share the same spatial correlation length.", "url": "https://arxiv.org/abs/2608.04762", "type": "理论", "summary": "多体定位 (MBL) 和本征态热化 (ETH) 传统上是通过一组单独的诊断来区分的，而不是通过单个阶次参数来区分。我们表明，孤立的单一动力学的复制和折叠产生了前向-后向历史配对的复杂统计力学，并且在闭合循环红外扇区中，产生了一个新兴时钟 $r_x\\in\\mathbb Z_t$。其相关器具有三种不同的渐进性：MBL 中的指数衰减、临界时的无标度衰减以及热相中的长程锁定。受控的 $l$ 位减少使时钟动作准局部，而其逆相关长度服从 $\\xi_{\\rmpair}^{-1}=\\kappa_{\\rm el}=\\ln|\\rho_0/\\rho_q|$，统一历史相干性、缺陷线张力和传输谱。复制阶提供了第二个离散坐标——隐藏的动力学不变量变得可见的第一个阶——并且可以区分共享相同空间相关长度的局部动力学。", "authors": [{"name": "Tong Liu"}], "featured_authors": [{"name": "Tong Liu"}], "author_count": 1}, {"id": "2608.04781", "category": "cond-mat", "title": "A phase field model of coupled crack and dislocations: emission, blunting, and the necessity of dissipative toughening", "abstract": "We propose a phase field model of a macrocracked single crystal in which the crack and the geometrically necessary dislocations descend from a single energy functional. Energy minimization alone then decides dislocation nucleation, through an integral criterion evaluated in closed form along slip chords. The criterion yields a size effect inaccessible to point-wise strength conditions: a grain-size-dependent yield stress. With slip suppressed the model reproduces Griffith fracture; with fracture suppressed, the nucleation load measured by the full non-smooth solver agrees with the closed-form nucleation criterion to four percent. The coupled computations produce a two-stage response: at loads an order of magnitude below cleavage, dislocation bands emitted from the notch tip blunt and shield it, raising the initiation load; once the crack grows, the bands heal; a compact cluster of like-signed dislocations travels with the tip, its canceling partner walls pinned at the grain boundary, and the dissipated fracture resistance equals the elastic one. In the purely energetic, dissipationless limit, emission shields the crack but does not toughen it; toughening requires dissipation, incorporated in the sequel through the threshold resistance to dislocation motion.", "url": "https://arxiv.org/abs/2608.04781", "type": "理论+数值", "summary": "我们提出了宏观裂纹单晶的相场模型，其中裂纹和几何上必要的位错从单个能量泛函下降。然后，通过沿滑移弦以闭合形式评估的积分标准，仅能量最小化就决定位错成核。该标准产生点强度条件无法达到的尺寸效应：晶粒尺寸相关的屈服应力。抑制滑移后，模型再现了 Griffith 断裂；在抑制断裂的情况下，由全非光滑求解器测量的成核载荷与封闭形式成核标准一致达百分之四。耦合计算产生两阶段响应：在载荷低于解理一个数量级时，从缺口尖端发出的位错带变钝并屏蔽它，从而提高初始载荷；一旦裂纹扩大，带子就会愈合；一组紧密的同号位错随尖端移动，其抵消伙伴壁被固定在晶界处，并且耗散断裂阻力等于弹性断裂阻力。\n\n在纯能量、无耗散极限下，发射会屏蔽裂纹，但不会使其变硬；增韧需要耗散，通过对位错运动的阈值阻力纳入后续过程。", "authors": [{"name": "Khanh Chau Le"}, {"name": "Thi My Kieu Tran"}], "featured_authors": [{"name": "Khanh Chau Le"}, {"name": "Thi My Kieu Tran"}], "author_count": 2}, {"id": "2608.04816", "category": "cond-mat", "title": "Ghost-RISB for Correlated Electron-Phonon Systems: Application to the Hubbard-Holstein Model", "abstract": "We develop a generalization of the ghost-rotationally-invariant slave-boson (ghost-RISB) method that incorporates local phonon modes coupled to arbitrary on-site electronic degrees of freedom, enabling a nonperturbative treatment of electron-electron and electron-phonon interactions within an efficient variational framework. The method extends the ghost-orbital construction to capture dynamical self-energy effects and phonon-induced renormalizations beyond static slave-boson approaches. Benchmarking against dynamical mean-field theory (DMFT) results for the Hubbard-Holstein model, we find excellent quantitative agreement for electron quasiparticle weights and phonon properties across a wide range of coupling strengths, and it captures accurately the competition between electron-electron and electron-phonon interactions. We show that the inclusion of the ghost orbitals is crucial to accurately describe the regime of low-frequency, strongly dynamical, phonons. The extended ghost-RISB achieves this accuracy at a fraction of the computational cost of DMFT, due to its self-consistency rooted in static observables instead of dynamical ones, enabling rapid exploration of correlated electron-phonon phase diagrams. We exploit this advantage to characterize the most demanding regime of strong coupling and adiabatic phonons. Our analysis shows a suppression of the superconducting order parameter, which is interpreted as a Franck-Condon-like reduction of the overlap between the phonon wavefunctions associated with empty and doubly-occupied sites in the bipolaronic regime.", "url": "https://arxiv.org/abs/2608.04816", "type": "理论+数值", "summary": "我们开发了幽灵旋转不变从属玻色子（ghost-RISB）方法的推广，该方法将局部声子模式与任意现场电子自由度耦合，从而能够在有效的变分框架内对电子-电子和电子-声子相互作用进行非微扰处理。该方法扩展了鬼轨道结构，以捕获动态自能效应和声子引起的重整化，超越静态从玻色子方法。通过对 Hubbard-Holstein 模型的动态平均场理论 (DMFT) 结果进行基准测试，我们发现在各种耦合强度下，电子准粒子重量和声子属性具有极好的定量一致性，并且它准确地捕获了电子-电子和电子-声子相互作用之间的竞争。我们证明，鬼轨道的包含对于准确描述低频、强动态声子的状态至关重要。\n\n扩展的 Ghost-RISB 以 DMFT 计算成本的一小部分实现了这种精度，因为它的自一致性植根于静态可观测量而不是动态可观测量，从而能够快速探索相关的电子声子相图。我们利用这一优势来表征最苛刻的强耦合和绝热声子体系。我们的分析显示了超导序参数的抑制，这被解释为与双极子状态中的空位和双占据位相关的声子波函数之间的重叠的弗兰克-康登式减少。", "authors": [{"name": "Samuele Giuli"}, {"name": "Ricardo J. Campos-Lopes"}, {"name": "Emin Moghadas"}, {"name": "Massimo Capone"}], "featured_authors": [{"name": "Samuele Giuli"}, {"name": "Ricardo J. Campos-Lopes"}, {"name": "Emin Moghadas"}, {"name": "Massimo Capone"}], "author_count": 4}, {"id": "2608.04841", "category": "cond-mat", "title": "Structural Chirality from Short-Range Order in Heteroanionic Materials", "abstract": "Established routes to structural chirality in inorganic crystals depend on symmetry-lowering atomic displacements of an achiral parent structure. We show that chirality can instead be forced by the ordering of two anion species over the sites of an achiral parent, independent of atomic displacements. ReO$_3$-type oxyfluorides with a 2:1 anion stoichiometry, such as NbO$_2$F, exhibit two ordering patterns: cis octahedral coordination and period-three anion-chain ordering, both rooted in the off-centring of $d^0$ cations. By direct enumeration, we prove that every configuration combining both orderings on the smallest commensurate cell is chiral, belonging to a Sohncke space group. For the specific case of NbO$_2$F, density-functional theory calculations predict that the ground state is the maximally symmetric chiral configuration. Wang-Landau Monte Carlo simulations of a DFT-trained cluster-expansion model predict an equilibrium chiral phase up to a first-order transition at 494 K. These results establish configurational ordering as a chemically realisable route to structural chirality, and mark heteroanionic materials with analogous ordering chemistry as candidates for a new class of chiral functional materials.", "url": "https://arxiv.org/abs/2608.04841", "type": "理论+数值", "summary": "无机晶体结构手性的既定途径取决于非手性母体结构的对称性降低原子位移。我们表明，手性可以通过两个阴离子物种在非手性母体位置上的排序来强制，而与原子位移无关。阴离子化学计量比为 2:1 的 ReO$_3$ 型氟氧化物（例如 NbO$_2$F）表现出两种有序模式：顺式八面体配位和三周期阴离子链有序，两者都源于 $d^0$ 阳离子的偏心。通过直接枚举，我们证明了在最小相称单元上结合两种排序的每种配置都是手性的，属于 Sohncke 空间群。对于 NbO$_2$F 的具体情况，密度泛函理论计算预测基态是最大对称手性构型。经过 DFT 训练的簇扩展模型的 Wang-Landau 蒙特卡罗模拟预测了 494 K 时达到一阶转变的平衡手性相。\n\n这些结果将构型排序确立为结构手性的化学可实现途径，并将具有类似排序化学的杂阴离子材料标记为新型手性功能材料的候选者。", "authors": [{"name": "Benjamin J. Morgan"}], "featured_authors": [{"name": "Benjamin J. Morgan"}], "author_count": 1}, {"id": "2608.04875", "category": "cond-mat", "title": "Large nonlinear Hall effect in strained moiré structures hosting high-pseudospin fermions", "abstract": "We investigate the linear and nonlinear Hall response of a moiré \\emph{watermill lattice}, in which stacking and twisting generate a four-band manifold near the Fermi level with suppressed group velocities at discrete magic angles. Including an inversion symmetry breaking onsite mass breaks the interlayer symmetry, opening a gap in this manifold and driving the system into a non-trivial bulk topological phase. We map the resulting phase diagram as a function of the strength of the mass and twist angle $\\theta$, revealing several sectors with high Chern numbers. We then introduce strain to break the residual $C_3$ symmetry of the lattice which activates a finite Berry curvature dipole and correspondingly, a nonlinear Hall response. The dipole reverses sign sharply across topological phase boundaries, producing butterfly like features when plotted against the relevant system parameters. Its magnitude substantially exceeds that reported for symmetry-broken transition metal dichalcogenides, consistent with the elevated Wilson-loop winding and enhanced quantum geometry associated with the lattice's pseudospin-$3/2$ character. We conclude by incorporating thermal effects on the Berry curvature dipole, asserting that it is an important tool for discerning topology at low temperatures.", "url": "https://arxiv.org/abs/2608.04875", "type": "理论+数值", "summary": "我们研究了莫尔\\emph{水磨晶格}的线性和非线性霍尔响应，其中堆叠和扭曲在费米能级附近生成四能带流形，并在离散魔角处抑制群速度。包括破坏现场质量的反演对称性会破坏层间对称性，在流形中打开一个间隙，并将系统驱动到一个非平凡的体拓扑相。我们将所得相图绘制为质量强度和扭转角 $\\theta$ 的函数，揭示了几个具有高陈数的扇区。然后，我们引入应变来打破晶格的剩余 $C_3$ 对称性，从而激活有限贝里曲率偶极子以及相应的非线性霍尔响应。偶极子在拓扑相边界上急剧反转符号，根据相关系统参数绘制时产生蝴蝶状特征。其幅度大大超过了对称破缺的过渡金属二硫属化物的报道幅度，与升高的威尔逊环缠绕和与晶格的赝自旋-$3/2$特征相关的增强的量子几何结构一致。\n\n我们通过结合贝里曲率偶极子的热效应得出结论，断言它是识别低温拓扑的重要工具。", "authors": [{"name": "Srijata Lahiri"}, {"name": "Gourab Paul"}, {"name": "Bilal Tanatar"}, {"name": "Saurabh Basu"}], "featured_authors": [{"name": "Srijata Lahiri"}, {"name": "Gourab Paul"}, {"name": "Bilal Tanatar"}, {"name": "Saurabh Basu"}], "author_count": 4}, {"id": "2608.04888", "category": "cond-mat", "title": "Effects of Interfacial States and Strain on Tunnel Magnetoresistance in van der Waals Magnetic Tunnel Junctions", "abstract": "All-two-dimensional magnetic tunnel junctions promise atomically sharp interfaces, yet the role of interface-induced states in their spin transport is not fully understood. Here, we theoretically investigate spin-dependent transport in van der Waals magnetic tunnel junctions of the structure Cr$_2$C/$MY_2$/Cr$_2$C ($M$ = Mo, W; $Y$ = S, Se) with barrier thicknesses of 3, 5, 7, and 9 layers. The broad features of the $\\mathbf{k}_{\\parallel}$-resolved conductances, namely suppression near the $\\Gamma$ point and enhancement at six off-$\\Gamma$ hot spots, are consistent with the decay of evanescent states in the barrier. However, trilayer WS$_2$, MoSe$_2$, and WSe$_2$ barriers exhibit conductances of the order of $e^2/h$ at $\\mathbf{k}_{\\parallel}$ points within the hot spots. We attribute these near-unity transmission channels to resonant coupling between the interfacial states at the two electrode--barrier interfaces, as evidenced by their weak but finite residual weight at the barrier center. For thicker barriers, this coupling weakens, which suppresses the residual weight, thereby reducing the tunnel magnetoresistance (TMR) ratio of the MoS$_2$ junction while enhancing those of the other junctions. To exploit the interfacial states for spin-selective tunneling, we further examine biaxial tensile strain applied to the trilayer junctions. At 4\\% strain, the TMR ratio increases from 176\\% to 540\\% for MoS$_2$ and from 98\\% to 496\\% for WS$_2$, whereas MoSe$_2$ and WSe$_2$ exhibit comparatively weaker enhancement. Our results establish interfacial-state engineering via strain and barrier thickness as effective routes for enhancing the TMR effect in all-two-dimensional magnetic tunnel junctions.", "url": "https://arxiv.org/abs/2608.04888", "type": "理论+数值", "summary": "全二维磁隧道结有望实现原子级锐利界面，但界面诱导态在自旋输运中的作用尚未完全了解。在这里，我们从理论上研究了势垒厚度为 3、5、7 和 9 层的 Cr$_2$C/$MY_2$/Cr$_2$C ($M$ = Mo, W; $Y$ = S, Se) 结构的范德华磁隧道结中的自旋相关输运。 $\\mathbf{k}_{\\parallel}$ 解析电导的广泛特征，即 $\\Gamma$ 点附近的抑制和六个 $\\Gamma$ 热点附近的增强，与势垒中倏逝态的衰减一致。然而，三层 WS$_2$、MoSe$_2$ 和 WSe$_2$ 势垒在热点内的 $\\mathbf{k}_{\\parallel}$ 点处表现出 $e^2/h$ 量级的电导。我们将这些接近统一的传输通道归因于两个电极-势垒界面处的界面状态之间的共振耦合，正如势垒中心处的弱但有限的残余权重所证明的那样。\n\n对于较厚的势垒，这种耦合会减弱，从而抑制残余重量，从而降低 MoS$_2$ 结的隧道磁阻 (TMR) 比，同时增强其他结的隧道磁阻 (TMR) 比。为了利用自旋选择性隧道的界面态，我们进一步检查了施加到三层结的双轴拉伸应变。在 4\\% 应变下，MoS$_2$ 的 TMR 比率从 176\\% 增加到 540\\%，WS$_2$ 的 TMR 比率从 98\\% 增加到 496\\%，而 MoSe$_2$ 和 WSe$_2$ 表现出相对较弱的增强。我们的研究结果通过应变和势垒厚度建立了界面态工程，作为增强全二维磁隧道结中 TMR 效应的有效途径。", "authors": [{"name": "Sakshi Goel"}, {"name": "Arti Kashyap"}, {"name": "Keisuke Masuda"}, {"name": "Terumasa Tadano"}], "featured_authors": [{"name": "Sakshi Goel"}, {"name": "Arti Kashyap"}, {"name": "Keisuke Masuda"}, {"name": "Terumasa Tadano"}], "author_count": 4}, {"id": "2608.04911", "category": "cond-mat", "title": "Predicting Plasticity in Two-Dimensional Foam Channel Flow Around an Obstacle", "abstract": "We study the prediction of plastic activity in the confined channel flow of two-dimensional amor- phous soft particles around a circular obstacle. Using datasets generated with a particle-based bubble model, we formulate the prediction problem within two supervised-learning frameworks: re- gression of the non-affine displacement and binary classification of neighbor change events. A key technical challenge is that the obstacle and the confining walls explicitly break translational and rotational symmetries. We address this issue by introducing additional structural descriptors that encode the positions of particles relative to these boundaries. Starting from simple linear models, we systematically increase the complexity of the learning framework by considering a logarithmic transformation of the target variable, the incorporation of particle-size information, the addition of symmetry-breaking obstacle and wall descriptors, the coarse-graining of local structural descrip- tors, and nonlinear neural-network models. We find that the obstacle and wall descriptors provide the largest improvement in predictive performance. Nevertheless, the models considered here cap- ture mainly the overall localization of plastic activity near the obstacle and do not fully reproduce its detailed heterogeneous pattern in individual configurations. A perturbation analysis indicates that this heterogeneity is robustly encoded in the initial structure, suggesting that further progress requires more expressive structural representations and machine-learning architectures.", "url": "https://arxiv.org/abs/2608.04911", "type": "理论+数值", "summary": "我们研究了圆形障碍物周围二维无定形软颗粒受限通道流中塑性活动的预测。使用基于粒子的气泡模型生成的数据集，我们在两个监督学习框架内制定了预测问题：非仿射位移的回归和邻居变化事件的二元分类。一个关键的技术挑战是障碍物和围墙明显打破了平移和旋转对称性。我们通过引入额外的结构描述符来解决这个问题，这些结构描述符对粒子相对于这些边界的位置进行编码。从简单的线性模型开始，我们通过考虑目标变量的对数变换、颗粒尺寸信息的结合、对称性破缺障碍物和墙壁描述符的添加、局部结构描述符的粗粒度和非线性神经网络模型来系统地增加学习框架的复杂性。我们发现障碍物和墙壁描述符在预测性能方面提供了最大的改进。\n\n然而，这里考虑的模型主要捕获了障碍物附近塑性活动的整体定位，并且没有完全重现其在各个配置中的详细异质模式。扰动分析表明，这种异质性在初始结构中被稳健地编码，这表明进一步的进展需要更具表现力的结构表示和机器学习架构。", "authors": [{"name": "Alexandre Stepanetz"}, {"name": "Bahaa Mazloum"}, {"name": "Benjamin Dollet"}, {"name": "Misaki Ozawa"}], "featured_authors": [{"name": "Alexandre Stepanetz"}, {"name": "Bahaa Mazloum"}, {"name": "Benjamin Dollet"}, {"name": "Misaki Ozawa"}], "author_count": 4}, {"id": "2608.04920", "category": "cond-mat", "title": "Resolving coupled transport in space and time from molecular fluctuations in confined fluids", "abstract": "Transport in fluids is generally reduced to continuum laws parametrized by bulk coefficients and effective interfacial parameters, such as viscosities, diffusivities, slip lengths, and interfacial resistances. This description becomes incomplete at the nanoscale, where spatial heterogeneity, molecular structure, and finite relaxation times are inseparable from the transport process. Here we formulate coupled transport in nanoconfined fluids as a space--time-resolved Onsager response matrix and extract it from equilibrium molecular dynamics simulations. Applied to a confined charged fluid, the framework resolves the nonlocal and transient pathways coupling particle, solute, heat, and charge transport. Momentum transport appears as a long-lived, nonlocal hydrodynamic mode, whereas charge transport relaxes rapidly through localized ionic friction. Off-diagonal responses reveal distinct projected dynamics, providing a microscopic basis for nonlocal, history-dependent transport laws.", "url": "https://arxiv.org/abs/2608.04920", "type": "数值", "summary": "流体中的传输通常简化为由体积系数和有效界面参数（例如粘度、扩散率、滑移长度和界面阻力）参数化的连续定律。这种描述在纳米尺度上变得不完整，其中空间异质性、分子结构和有限弛豫时间与传输过程密不可分。在这里，我们将纳米限制流体中的耦合传输公式化为时空分辨的 Onsager 响应矩阵，并从平衡分子动力学模拟中提取它。该框架应用于受限带电流体，解决了粒子、溶质、热和电荷传输耦合的非局部和瞬态路径。动量传输表现为一种长寿命的非局部流体动力学模式，而电荷传输通过局部离子摩擦迅速松弛。非对角线响应揭示了不同的预测动态，为非局域的、依赖于历史的传输定律提供了微观基础。", "authors": [{"name": "Thê Hoang Ngoc Minh"}, {"name": "Ian C. Bourg"}], "featured_authors": [{"name": "Thê Hoang Ngoc Minh"}, {"name": "Ian C. Bourg"}], "author_count": 2}, {"id": "2608.04979", "category": "cond-mat", "title": "Delocalized Coupled-Cluster Theory for Polaron Structure and Dynamics", "abstract": "Polaron ground states and finite-temperature dynamics remain challenging to simulate because existing methods struggle to combine nonperturbative accuracy, systematic improvability, and scalability from models to materials-specific Hamiltonians. We introduce a translationally invariant variational coupled-cluster (CC) theory for polarons, termed delocalized CC (dCC), with closed-form energies at cost as low as $\\mathcal{O}(N^3)$ and no phonon-number cutoff. dCC accurately describes the ground states of the one- and two-dimensional Holstein and Su--Schrieffer--Heeger (optical and bond) models and the Fr{ö}hlich model, in close agreement with density matrix renormalization group (DMRG) and diagrammatic Monte Carlo benchmarks. A projected tangent-space response formalism built on the same ansatz yields electron-addition spectral functions and optical conductivities at zero and finite temperature. The resulting spectra agree well with DMRG, Lanczos, and neural-network quantum-state benchmarks while retaining a physically interpretable excitation hierarchy, and extend to two-dimensional lattices at finite temperature beyond the practical reach of these methods. The same framework applies directly to \\textit{ab initio} electron--phonon matrix elements, yielding LiF electron- and hole-polaron binding energies that match state-of-the-art many-body calculations. These results establish dCC as a unified variational framework for polaron ground states and dynamics, from model systems to real materials.", "url": "https://arxiv.org/abs/2608.04979", "type": "理论+数值", "summary": "极化子基态和有限温度动力学的模拟仍然具有挑战性，因为现有方法很难将非微扰精度、系统可改进性以及从模型到特定材料哈密顿量的可扩展性结合起来。我们引入了一种平移不变的极化子变分耦合簇 (CC) 理论，称为离域 CC (dCC)，其封闭形式的能量成本低至 $\\mathcal{O}(N^3)$，并且没有声子数截止。 dCC 准确地描述了一维和二维 Holstein 和 Su--Schrieffer--Heeger（光学和键合）模型以及 Fr{ö}hlich 模型的基态，与密度矩阵重整化群 (DMRG) 和图解蒙特卡罗基准密切一致。基于相同拟像的投影切线空间响应形式产生了零温度和有限温度下的电子加法谱函数和光导率。所得光谱与 DMRG、Lanczos 和神经网络量子态基准非常吻合，同时保留了物理上可解释的激发层次结构，并扩展到有限温度下的二维晶格，超出了这些方法的实际范围。\n\n相同的框架直接适用于 \\textit{ab initio} 电子声子矩阵元素，产生与最先进的多体计算相匹配的 LiF 电子和空穴极化子结合能。这些结果将 dCC 确立为极化子基态和动力学的统一变分框架，从模型系统到真实材料。", "authors": [{"name": "Hamlin Wu"}, {"name": "Moritz K.A. Baumgarten"}, {"name": "Tong Jiang"}, {"name": "Joonho Lee"}], "featured_authors": [{"name": "Hamlin Wu"}, {"name": "Moritz K.A. Baumgarten"}, {"name": "Tong Jiang"}, {"name": "Joonho Lee"}], "author_count": 4}, {"id": "2608.04986", "category": "cond-mat", "title": "Magnetic catalysis and Hall conductivity of excitonic insulators in a planar four-Fermi model", "abstract": "We study the effects of a perpendicular magnetic field on the excitonic insulator (EI) phase in the semiconductor regime using an extended planar four-Fermi model. Within the large-$N$ approximation, we determine the coupled scalar and excitonic condensates at finite temperature, chemical potential, and magnetic field. The field enhances the EI condensate and raises its critical temperature, providing an excitonic realization of magnetic catalysis, while the scalar condensate remains constant throughout the EI phase. By contrast, the critical chemical potential depends nonmonotonically on the field because of the successive occupation of Landau levels. The magnetic field also shifts the mean-field tricritical point and enlarges the first-order region of the temperature--chemical-potential phase diagram. We further analyze the Hall conductivity and find that increasing the field reduces the number of plateaus and modifies the threshold for a finite Hall response. For the parameters considered, the emergence of the EI condensate is accompanied by a characteristic change in the Hall conductivity, including a field-dependent change of slope near a continuous transition. These results show that the combined phase structure and Hall response can provide complementary signatures of excitonic ordering in planar fermionic systems.", "url": "https://arxiv.org/abs/2608.04986", "type": "理论+数值", "summary": "我们使用扩展平面四费米模型研究垂直磁场对半导体状态中激子绝缘体 (EI) 相的影响。在大$N$近似内，我们确定了有限温度、化学势和磁场下的耦合标量和激子凝聚体。该场增强了 EI 凝聚态并提高了其临界温度，提供了磁催化的激子实现，而标量凝聚态在整个 EI 阶段保持恒定。相比之下，由于连续占据朗道能级，临界化学势非单调地依赖于场。磁场还会移动平均场三临界点并扩大温度-化学势相图的一级区域。我们进一步分析霍尔电导率，发现增加磁场会减少平台数量并修改有限霍尔响应的阈值。对于所考虑的参数，EI 凝聚体的出现伴随着霍尔电导率的特征变化，包括连续过渡附近斜率的场相关变化。\n\n这些结果表明，组合的相结构和霍尔响应可以提供平面费米子系统中激子排序的互补特征。", "authors": [{"name": "William R. Tavares"}, {"name": "Rudnei O. Ramos"}, {"name": "Nei Lopes"}], "featured_authors": [{"name": "William R. Tavares"}, {"name": "Rudnei O. Ramos"}, {"name": "Nei Lopes"}], "author_count": 3}, {"id": "2608.05027", "category": "cond-mat", "title": "Scaling behavior in non-reciprocal and odd conserved dynamics near criticality", "abstract": "In recent years, non-reciprocity has been explored as a ubiquitous manifestation of non-equilibrium activity at the microscopic scales for various active matter systems, from mixtures of chemically active enzymes, colloids, and droplets, to engineered light-controlled active colloids and robotic meta-materials. A commonly used minimal model to describe the dynamics of a binary mixture of conserved species with non-reciprocal interactions is the non-reciprocal Cahn-Hilliard (NRCH) model. The model is characterized by a temperature-like tuning parameter, which can trigger phase separation, and a non-reciprocal coupling, which can lead to the formation of spatio-temporal patterns, as it represents an intrinsic source of non-equilibrium activity and breaks parity and time-reversal symmetries. Here, we study the scaling behavior of the NRCH model near the critical point using perturbative dynamical renormalization group techniques. We find that structural and dynamical correlations are controlled by different correlation lengths, both of which diverge at the critical point, but governed by different scaling laws. In particular, while the structural correlations are always controlled by temperature and the classical Wilson-Fisher critical exponent, the dynamical correlation length exhibits multiple scaling regimes in which either temperature or non-reciprocal coupling can dominate as the key tuning parameter, with a new critical exponent characterizing the divergence. The critical point corresponds to a conserved equilibrium-like dynamics with odd mobility, which we denote as the odd Cahn-Hilliard (OCH) model. Our findings may have important implications on how living systems can control phase separation and spatio-temporal pattern formation using the rates of catalytic reactions, and in general metabolism, as control parameters.", "url": "https://arxiv.org/abs/2608.05027", "type": "理论", "summary": "近年来，非互易性已被探索为各种活性物质系统在微观尺度上非平衡活动的普遍表现，从化学活性酶、胶体和液滴的混合物，到工程光控活性胶体和机器人超材料。描述具有非互易相互作用的保守物种二元混合物动力学的常用最小模型是非互易 Cahn-Hilliard (NRCH) 模型。该模型的特点是具有类似温度的调谐参数，可以触发相分离，以及非互易耦合，可以导致时空模式的形成，因为它代表了非平衡活动的内在来源，并打破了宇称和时间反转对称性。在这里，我们使用微扰动态重正化群技术研究 NRCH 模型在临界点附近的标度行为。我们发现结构相关性和动态相关性由不同的相关长度控制，两者在临界点处发散，但受不同的标度定律支配。\n\n特别是，虽然结构相关性始终由温度和经典的威尔逊-费舍尔临界指数控制，但动态相关性长度表现出多种缩放机制，其中温度或非互易耦合可以作为关键调整参数占主导地位，并具有表征散度的新临界指数。临界点对应于具有奇迁移率的守恒类平衡动力学，我们将其表示为奇 Cahn-Hilliard (OCH) 模型。我们的发现可能对生命系统如何使用催化反应速率和一般代谢作为控制参数来控制相分离和时空模式形成产生重要影响。", "authors": [{"name": "Martin Kjøllesdal Johnsrud"}, {"name": "Giulia Pisegna"}, {"name": "Ramin Golestanian"}], "featured_authors": [{"name": "Martin Kjøllesdal Johnsrud"}, {"name": "Giulia Pisegna"}, {"name": "Ramin Golestanian"}], "author_count": 3}, {"id": "2608.05068", "category": "cond-mat", "title": "Effective single particle picture for anharmonic lattice dynamics: a Rosetta stone for electronic and ionic response", "abstract": "We establish a theoretical framework for the dynamics of a lattice of ions in a mean-field approach, where anharmonicity is included via self-consistency. In this picture, the many-body dynamics of a system of $N$ atoms in three dimensions is mapped onto two kinds of $6N$-dimensional vectors: the phonon condensate, describing the evolution of the average atomic positions, and the phonon spinors, describing the evolution of the atomic elastic constants. The phonon spinors are classified by a quantum number that behaves as a spin: the phonon pseudospin. The many-body Liouville equation is replaced by two wave equations equivalent to the time-dependent Schrödinger equation for the electronic wave function in density functional theory. Exploiting this parallelism, we formulate the response of the anharmonic lattice in one-to-one correspondence with time-dependent density functional theory for electrons. In complete analogy with the electronic case, we express the ionic response in terms of matrix elements of operators representing external fields and forces. We show how anharmonicity screens external perturbations through a phonon analogue of the Hartree-exchange-correlation kernel. We provide expressions for the lattice optical and thermal conductivity, showing how thermal conductivity depends on the phonon pseudospin. By approximating the density matrix as a Gaussian, we recover the equations of the time-dependent self-consistent harmonic approximation. In this case, the linear-response equations are formulated in terms of an anharmonic kernel including three- and four-phonon scattering. By translating anharmonic lattice dynamics into the language of density functional theory, this work shows how theoretical and computational advances in modeling the dynamical response of interacting electrons can be directly applied to interacting ions.", "url": "https://arxiv.org/abs/2608.05068", "type": "理论+数值", "summary": "我们建立了平均场方法中离子晶格动力学的理论框架，其中通过自洽性包含了非调和性。在这张图中，三维 $N$ 原子系统的多体动力学映射到两种 $6N$ 维向量：声子凝聚，描述平均原子位置的演化，以及声子旋量，描述原子弹性常数的演化。声子旋量按表现为自旋的量子数分类：声子赝自旋。多体刘维尔方程被两个波动方程所取代，这两个波动方程相当于密度泛函理论中电子波函数的瞬态薛定谔方程。利用这种并行性，我们将非谐晶格的响应与电子的时间相关密度泛函理论一一对应。与电子情况完全类似，我们用代表外部场和力的算子的矩阵元素来表达离子响应。我们展示了非谐性如何通过 Hartree 交换相关核的声子类似物来筛选外部扰动。\n\n我们提供了晶格光学和热导率的表达式，显示了热导率如何取决于声子赝自旋。通过将密度矩阵近似为高斯矩阵，我们恢复了与时间相关的自洽调和近似方程。在这种情况下，线性响应方程根据包括三声子和四声子散射的非谐核来制定。通过将非谐晶格动力学转化为密度泛函理论的语言，这项工作展示了如何将相互作用电子的动态响应建模的理论和计算进展直接应用于相互作用的离子。", "authors": [{"name": "Giovanni Caldarelli"}, {"name": "Francesco Mauri"}], "featured_authors": [{"name": "Giovanni Caldarelli"}, {"name": "Francesco Mauri"}], "author_count": 2}, {"id": "2608.05083", "category": "cond-mat", "title": "It Takes Two to Tribo: Stochastic Charge Evolution in Repeated Binary Collisions of Acoustically Levitated Particles", "abstract": "The mechanisms governing triboelectric charging between insulating particles of the same material remain an open question in nonequilibrium physics, with several competing models proposed to explain observed charging behaviour. Here, we investigate charge evolution in a minimal system consisting of two acoustically levitated particles undergoing repeated binary collisions. To quantify particle charge transfer, purpose-built Faraday cage picoammeters were developed and calibrated. The MultiLev acoustic levitation system was used alongside Ultraino simulations to generate transducer control signals, enabling controlled collision and separation of polystyrene (PS) particles. Although individual collision events exhibit stochastic charge transfer, described by skew-normal distributions, we demonstrate for the first time that the cumulative charge evolution of an individual acoustically levitated particle pair follows the saturation behaviour predicted by the condenser model of triboelectric charging, with fits achieving $R^2 > 0.99$. Under identical conditions, conductive graphite-coated PS particles also undergo charge transfer, but accumulate substantially less charge, consistent with the distinct charging behaviour expected for conductive materials.", "url": "https://arxiv.org/abs/2608.05083", "type": "理论+数值", "summary": "控制相同材料的绝缘颗粒之间摩擦起电的机制仍然是非平衡物理学中的一个悬而未决的问题，提出了几种相互竞争的模型来解释观察到的充电行为。在这里，我们研究了一个最小系统中的电荷演化，该系统由两个经历重复二元碰撞的声悬浮粒子组成。为了量化粒子电荷转移，开发并校准了专用的法拉第笼皮安计。 MultiLev 声悬浮系统与 Ultraino 模拟一起使用来生成传感器控制信号，从而实现聚苯乙烯 (PS) 颗粒的受控碰撞和分离。尽管单个碰撞事件表现出由偏正态分布描述的随机电荷转移，但我们首次证明单个声悬浮粒子对的累积电荷演化遵循摩擦起电电容器模型预测的饱和行为，拟合达到 $R^2 > 0.99$。\n\n在相同条件下，导电石墨涂覆的 PS 颗粒也会发生电荷转移，但积累的电荷要少得多，这与导电材料预期的独特充电行为一致。", "authors": [{"name": "Tom F. O'Hara"}, {"name": "Adrian C. Barnes"}, {"name": "Nathan Croll Dawes"}, {"name": "Karen L. Aplin"}], "featured_authors": [{"name": "Tom F. O'Hara"}, {"name": "Adrian C. Barnes"}, {"name": "Nathan Croll Dawes"}, {"name": "Karen L. Aplin"}], "author_count": 4}, {"id": "2608.05130", "category": "cond-mat", "title": "Tetrahedral linkage as an intrinsic measure of glycan antifreeze behavior", "abstract": "Antifreeze materials prevent ice-formation by disrupting the ice-formation by binding to certain ice-planes. Cellulose, the most abundant biopolymer, has shown the ability to bind to ice-planes but the exact mechanism of this binding is far from being understood. Molecular dynamics simulations are used to investigate the hydration water of chains of cellulose-type glycans and its significance in the expression of the antifreeze behavior of sugar-derivatives found in some antifreeze materials. We find that glycans are able to prevent water from freezing near its surface by preventing their rearrangement to achieve a highly tetrahedral structure at temperatures well-below the freezing point of water. This validates our hypothesis on the role of tetrahedral coordination based on previous $\\textit{ab initio}$ calculations that demonstrated cellulose prefers to bind to ice basal and prismatic planes using a tetrahedral geometry. Our findings suggest that the tetrahedral ordering of water around glycans is the key to understanding and designing cellulose-based antifreeze materials.", "url": "https://arxiv.org/abs/2608.05130", "type": "理论+数值", "summary": "防冻材料通过与某些冰平面结合来破坏冰的形成，从而防止冰的形成。纤维素是最丰富的生物聚合物，已显示出与冰面结合的能力，但这种结合的确切机制尚不清楚。分子动力学模拟用于研究纤维素型聚糖链的水合水及其在某些防冻材料中发现的糖衍生物的防冻行为表达中的意义。我们发现，聚糖能够通过防止水在远低于水的冰点的温度下重排来实现高度四面体结构，从而防止水在其表面附近结冰。这验证了我们关于四面体配位作用的假设，该假设基于之前的 $\\textit{ab initio}$ 计算，该计算证明纤维素更喜欢使用四面体几何结构与冰基底和棱柱平面结合。我们的研究结果表明，聚糖周围水的四面体排序是理解和设计纤维素基防冻材料的关键。", "authors": [{"name": "Aakash Kumar"}, {"name": "Shoumik Saha"}, {"name": "Dilip Gersappe"}], "featured_authors": [{"name": "Aakash Kumar"}, {"name": "Shoumik Saha"}, {"name": "Dilip Gersappe"}], "author_count": 3}, {"id": "2608.04067", "category": "hep-th", "title": "Comment on \"Multi-black holes in Bertotti-Robinson spacetime\"", "abstract": "We point out that the asymptotically Bertotti-Robinson multi-black hole solutions of Einstein-Maxwell theory can be constructed using only three-dimensional sigma-model techniques, without resorting to the monodromy-matrix approach.", "url": "https://arxiv.org/abs/2608.04067", "type": "理论", "summary": "我们指出，爱因斯坦-麦克斯韦理论的渐近 Bertotti-Robinson 多黑洞解可以仅使用三维 sigma 模型技术来构造，而不需要求助于单向矩阵方法。", "authors": [{"name": "Gérard Clément"}], "featured_authors": [{"name": "Gérard Clément"}], "author_count": 1}, {"id": "2608.04080", "category": "hep-th", "title": "Supersymmetry, Supergravity and the Consistency of On-Shell Massive Superamplitudes", "abstract": "I study constraints from consistent complex factorisation of $2\\rightarrow 2$ scattering amplitudes in $4d$ and their relationship with supersymmetry. I complete the argument demonstrating that a massless helicity-$3/2$ particle must be a gravitino in a theory of supergravity and derive the structure and couplings of massive supermultiplets from first principles. For massive BPS particles in theories with extended supersymmetry, further constraints on the couplings are derived from consistent factorisation of massive superamplitudes. Among these is the requirement that BPS vector bosons must have couplings conforming to Lie algebra structure constants or generalised Chern-Simons terms. The gravitational coupling is shown to participate and draws the graviphotons into the Lie algebra. All $2\\rightarrow 2$ tree-level amplitudes of massive particles with spin $s\\leq 1$ are calculated in (super)gravity using on-shell methods and the double copy. These are assembled and decomposed into (super)amplitudes with varying amounts of supersymmetry. Finally, I study scattering of BPS gravitinos with unbroken $\\mathcal{N}\\geq 4$ supergravity and show that consistent factorisation leads to the full reconstruction of the super-Higgs mechanism. This argument completely determines the perturbative structure of all $\\mathcal{N}=4$ Minkowski vacua of gauged maximal supergravity. Gravitinos in theories not admitting a super-Higgs mechanism are ruled-out.", "url": "https://arxiv.org/abs/2608.04080", "type": "理论", "summary": "我研究了 $4d$ 中 $2\\rightarrow 2$ 散射振幅的一致复分解的约束及其与超对称性的关系。我完成了论证，证明无质量螺旋度 $3/2$ 粒子必须是超引力理论中的引力子，并从第一原理推导出大质量超多重态的结构和耦合。对于具有扩展超对称性的理论中的大质量 BPS 粒子，对耦合的进一步约束来自于大超振幅的一致因式分解。其中要求BPS矢量玻色子必须具有符合李代数结构常数或广义陈-西蒙斯项的耦合。引力耦合被证明参与并将引力光子引入李代数中。自旋 $s\\leq 1$ 的大质量粒子的所有 $2\\rightarrow 2$ 树级振幅都是使用壳上方法和双副本在（超）重力下计算的。它们被组装并分解为具有不同程度的超对称性的（超）振幅。\n\n最后，我研究了具有不间断 $\\mathcal{N}\\geq 4$ 超引力的 BPS 引力子的散射，并表明一致的分解导致了超希格斯机制的完全重建。这个论证完全决定了所有$\\mathcal{N}=4$ 测量最大超引力的明可夫斯基真空的微扰结构。理论上不承认超希格斯机制的重力场被排除。", "authors": [{"name": "Timothy Trott"}], "featured_authors": [{"name": "Timothy Trott"}], "author_count": 1}, {"id": "2608.04097", "category": "hep-th", "title": "A new perspective on non-commutative deformations of field and gauge theories", "abstract": "We construct non-commutative deformations of field and gauge theories based on star-products implemented by Drinfel'd twists. We are able to encompass a large family of twists, including those built out of conformal symmetries and supersymmetries. The main idea behind our construction is to work with twists constructed from symmetries of the undeformed theory, that are realised as active symmetry transformations. We argue that our construction amounts to a reformulation of known deformations of gauge theories, and that it significantly extends the range of applicable examples. To ensure consistency with gauge invariance, we also identify a unimodularity condition that is weaker than the one that is normally employed in the literature, so that we can apply twists that would otherwise be left out. Finally, we also prove a planar equivalence theorem stating that the Feynman diagrams of the deformed theories retain an undeformed internal structure, with the twist acting only on their external legs. All these results are important to identify and work with deformations of $\\mathcal N=4$ super Yang-Mills that are proposed to be dual to homogeneous Yang-Baxter deformations of the $AdS_5\\times S^5$ superstring, but the applicability of our construction and results goes beyond that.", "url": "https://arxiv.org/abs/2608.04097", "type": "理论", "summary": "我们基于由 Drinfel'd 扭曲实现的明星产品构建了场和规范理论的非交换变形。我们能够包含一大堆扭曲，包括那些由共形对称和超对称构建的扭曲。我们构建背后的主要思想是利用未变形理论的对称性构建的扭曲，这些扭曲被实现为主动对称变换。我们认为，我们的构建相当于对规范理论已知变形的重新表述，并且它显着扩展了适用示例的范围。为了确保与规范不变性的一致性，我们还确定了一种比文献中通常采用的条件更弱的单模条件，以便我们可以应用否则会被忽略的扭曲。最后，我们还证明了平面等价定理，指出变形理论的费曼图保留了未变形的内部结构，扭曲仅作用在其外腿上。\n\n所有这些结果对于识别和处理 $\\mathcal N=4$ super Yang-Mills 的变形非常重要，这些变形被认为是 $AdS_5\\times S^5$ 超弦的齐次 Yang-Baxter 变形的对偶，但我们的构造和结果的适用性超出了这一范围。", "authors": [{"name": "Riccardo Borsato"}, {"name": "Tim Meier"}], "featured_authors": [{"name": "Riccardo Borsato"}, {"name": "Tim Meier"}], "author_count": 2}, {"id": "2608.04107", "category": "hep-th", "title": "Exact Modular Completion of the ABJM Effective Twisted Superpotential", "
