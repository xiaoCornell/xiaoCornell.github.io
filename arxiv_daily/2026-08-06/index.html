abstract": "The effective twisted superpotential governs the supersymmetric partition functions of three-dimensional $\\mathcal{N}=2$ theories in the Cardy limit and, at large $N$, the gravitational blocks that are glued into the entropy function of supersymmetric $\\mathrm{AdS}_4$ black holes. We determine its on-shell structure for $\\mathrm{U}(N)_k\\times\\mathrm{U}(N)_{-k}$ ABJM theory at the universal twist, using a machine-learning discovery pipeline---physics-informed symbolic regression with integer-relation detection---applied to Bethe-vacuum data of up to $800$ digits. Its perturbative part terminates after two terms, a shifted-rank $3/2$-power and an $N$-independent constant map, which we obtain in closed form for every integer level. Its type-IIA genus expansion admits a closed coefficient formula at arbitrary genus, involving binomial and Bernoulli-number terms, and is asymptotic. For $k=1,2,4$ the entire finite-$N$ remainder is a single absolutely convergent divisor-sum $q$-series, obtained by applying a first-order differential operator to the Eichler integral of a weight-four Eisenstein series on $\\Gamma_0(2)$ or $\\Gamma_0(4)$. This closed form reproduces the data to $\\sim\\!10^{-797}$.", "url": "https://arxiv.org/abs/2608.04107", "type": "理论", "summary": "有效扭曲超势控制着卡迪极限下三维 $\\mathcal{N}=2$ 理论的超对称配分函数，以及在大 $N$ 下粘在超对称 $\\mathrm{AdS}_4$ 黑洞熵函数中的引力块。我们使用机器学习发现管道——具有整数关系检测的物理信息符号回归——应用于高达 $800$ 位的 Bethe 真空数据，确定了 $\\mathrm{U}(N)_k\\times\\mathrm{U}(N)_{-k}$ ABJM 理论在普遍扭曲下的壳上结构。它的扰动部分在两项后终止，即移位秩 $3/2$ 幂和 $N$ 独立常量映射，我们为每个整数级别以封闭形式获得该映射。其 IIA 型属展开式允许任意属处有一个封闭系数公式，涉及二项式和伯努利数项，并且是渐近的。对于 $k=1,2,4$，整个有限 $N$ 余数是单个绝对收敛除数和 $q$ 系列，通过将一阶微分算子应用于 $\\Gamma_0(2)$ 或 $\\Gamma_0(4)$ 上的权重四艾森斯坦级数的艾希勒积分而获得。\n\n此封闭形式将数据再现为 $\\sim\\!10^{-797}$。", "authors": [{"name": "Seyed Morteza Hosseini"}], "featured_authors": [{"name": "Seyed Morteza Hosseini"}], "author_count": 1}, {"id": "2608.04204", "category": "hep-th", "title": "Constants in Sequences of M2-brane Partition Functions", "abstract": "We determine in closed form the $N$-independent constant terms in the all-order $1/N$ expansions of the topologically twisted index and of the associated Bethe potential for the ABJM theory, as well as the Bethe potential constant of the ADHM theory. We reconstruct these constants analytically from high-precision Bethe-Ansatz numerics, verify them down to the level of non-perturbative corrections, and find them to be closely related to the constant map function $A$ governing the round three-sphere partition function. The resulting expressions for the ADHM and ABJM constants pass the non-trivial test dictated by 3d mirror symmetry. Via recently established factorization relations, they also determine in closed form the $N$-independent constant contribution to the squashed three-sphere partition function, through the first two leading orders in its large-squashing expansion. These constants supply precisely the piece left undetermined in the recent exact results for 3d supersymmetric partition functions to all orders in the $1/N$ expansion, and thereby mark an important step toward completing them, both in field theory and in the dual quantum gravity description.", "url": "https://arxiv.org/abs/2608.04204", "type": "理论", "summary": "我们以封闭形式确定了拓扑扭曲指数的全阶 $1/N$ 展开中与 $N$ 无关的常数项以及 ABJM 理论的相关 Bethe 势，以及 ADHM 理论的 Bethe 势常数。我们根据高精度 Bethe-Ansatz 数值分析重建这些常数，将它们验证到非微扰校正的水平，并发现它们与控制圆形三球配分函数的常数映射函数 $A$ 密切相关。 ADHM 和 ABJM 常数的结果表达式通过了 3d 镜像对称规定的重要测试。通过最近建立的因式分解关系，它们还通过大压缩展开中的前两个前导阶，以封闭形式确定对压缩三球配分函数的与 $N$ 无关的常数贡献。这些常数精确地提供了最近 3d 超对称配分函数的精确结果中未确定的部分到 $1/N$ 展开中的所有阶，从而标志着在场论和双量子引力描述中朝着完成它们迈出了重要的一步。", "authors": [{"name": "Junho Hong"}], "featured_authors": [{"name": "Junho Hong"}], "author_count": 1}, {"id": "2608.04229", "category": "hep-th", "title": "Boundary Conditions and Entanglement in Anti-de Sitter Space", "abstract": "We study the entanglement entropy of a conformally coupled scalar field at its ground state in $(3+1)$-dimensional AdS space in global coordinates. We consider spherical entangling surfaces centered at the origin of AdS and allow for general boundary conditions at the conformal boundary. Through numerical and analytical means, we show that the UV-divergent part of the entropy has a universal form, while the UV-finite part is sensitive to the boundary conditions. We determine the dependence of the latter part on mixed boundary conditions that interpolate between Dirichlet and Neumann.", "url": "https://arxiv.org/abs/2608.04229", "type": "理论", "summary": "我们研究全局坐标中 $(3+1)$ 维 AdS 空间中共形耦合标量场在基态的纠缠熵。我们考虑以 AdS 原点为中心的球形纠缠表面，并考虑共形边界处的一般边界条件。通过数值和解析手段，我们表明熵的UV发散部分具有普适形式，而UV有限部分对边界条件敏感。我们确定后一部分对在狄利克雷和诺伊曼之间插值的混合边界条件的依赖性。", "authors": [{"name": "Konstantinos Boutivas"}, {"name": "Dimitrios Katsinis"}, {"name": "Georgios Pastras"}, {"name": "Nathan Smeyers"}, {"name": "Nikolaos Tetradis"}], "featured_authors": [{"name": "Konstantinos Boutivas"}, {"name": "Dimitrios Katsinis"}, {"name": "Georgios Pastras"}, {"name": "Nathan Smeyers"}, {"name": "Nikolaos Tetradis"}], "author_count": 5}, {"id": "2608.04248", "category": "hep-th", "title": "Tilts from 2-Groups", "abstract": "2-group global symmetries intertwine 0-form and 1-form symmetries in an interesting way. We analyze universal constraints on lines which are charged under the 1-form subgroup of a 2-group, and show that they generically break the 0-form symmetry explicitly. This gives rise to a family of line defects parameterized by the broken symmetry generators, whose existence is invariant under the renormalization group flow of the bulk-defect system. The symmetry breaking is enforced by a `family anomaly,' which is a topological obstruction to a symmetric defect. Our main tools are the Wess-Zumino consistency condition and a generalized anomaly inflow formalism for defects and boundaries. For nonabelian continuous 2-groups the family anomaly stems from a higher Berry connection on the moduli space of defects, and constrains response functions that probe the local action of the broken symmetry. In the continuous abelian case we apply differential cohomology to the 2-group background fields to uncover a subtle generalization of the Wess-Zumino condition, while in the discrete case we recast it in terms of the associativity of symmetry defects. We give numerous illustrative examples, computing when possible explicit forms of the tilt operator (which probes the linear response of the defect to the broken symmetry) and its higher analogs, which are crucial for matching the family anomaly. We also discuss universal features such as how symmetry violation by charged line defects is related to symmetry breaking hierarchies in the bulk, and highlight a number of subtle points including the distinction between simple and non-simple lines, and Postnikov class resolution.", "url": "https://arxiv.org/abs/2608.04248", "type": "理论", "summary": "2 群全局对称性以一种有趣的方式将 0 型和 1 型对称性交织在一起。我们分析了在 2 群的 1 形式子群下充电的线的通用约束，并表明它们通常显式地破坏 0 形式对称性。这就产生了一系列由破缺对称生成器参数化的线缺陷，它们的存在在体缺陷系统的重正化群流下是不变的。对称性破缺是由“族异常”造成的，它是对称缺陷的拓扑障碍。我们的主要工具是 Wess-Zumino 一致性条件和缺陷和边界的广义异常流入形式。对于非阿贝尔连续 2 群，族异常源于缺陷模空间上的更高 Berry 连接，并约束探测对称性破缺局部作用的响应函数。在连续阿贝尔情况下，我们将微分上同调应用于 2 组背景场，以揭示 Wess-Zumino 条件的微妙概括，而在离散情况下，我们根据对称缺陷的结合性对其进行重新改造。\n\n我们给出了许多说明性的例子，在可能的情况下计算倾斜算子的显式形式（它探测缺陷对对称性破缺的线性响应）及其更高的类似物，这对于匹配族异常至关重要。我们还讨论了普遍特征，例如带电线缺陷的对称性破坏如何与大量对称性破缺层次结构相关，并强调了一些微妙的点，包括简单线和非简单线之间的区别，以及波斯特尼科夫类解析。", "authors": [{"name": "Sven Harder"}, {"name": "Theodore Jacobson"}, {"name": "Zhengdi Sun"}], "featured_authors": [{"name": "Sven Harder"}, {"name": "Theodore Jacobson"}, {"name": "Zhengdi Sun"}], "author_count": 3}, {"id": "2608.04356", "category": "hep-th", "title": "Wilson surface correlator in AdS/CFT", "abstract": "We use the AdS/CFT correspondence to show that for two spherical Wilson surfaces, both in the fundamental representation of $SU(N)$ gauge group, in the six-dimensional $(2,0)$ theory, in the large $N$ limit there is a first order Gross-Ooguri phase transition at a certain critical separation distance that we obtain numerically.", "url": "https://arxiv.org/abs/2608.04356", "type": "理论", "summary": "我们使用 AdS/CFT 对应关系来表明，对于两个球形威尔逊曲面，两者都在 $SU(N)$ 规范组的基本表示中，在六维 $(2,0)$ 理论中，在大 $N$ 极限中，在我们数值上获得的某个临界分离距离处存在一阶 Gross-Ooguri 相变。", "authors": [{"name": "Andreas Gustavsson"}], "featured_authors": [{"name": "Andreas Gustavsson"}], "author_count": 1}, {"id": "2608.04387", "category": "hep-th", "title": "Tensor Network Formulation of $\\mathcal{PT}$-Symmetric Quantum Field Theory", "abstract": "We develop a non-perturbative analytic tensor network formulation of $\\mathcal{PT}$-symmetric scalar field theories defined on complex integration contours. Applying this formulation to the two-dimensional $\\mathcal{PT}$-symmetric $\\phi^4$ theory at negative quartic coupling, we derive an explicit analytic expression for the initial tensor and show that its components separate into even and odd sectors according to the parity of the sum of the tensor indices. We further formulate the theory on an alternative complex contour and analytically establish, in arbitrary dimensions, an exact finite-volume relation between the lattice partition function defined on this contour and the real part of the analytic continuation of the Hermitian lattice $\\phi^4$ partition function to negative quartic coupling.", "url": "https://arxiv.org/abs/2608.04387", "type": "理论", "summary": "我们开发了在复杂积分轮廓上定义的 $\\mathcal{PT}$-对称标量场理论的非微扰解析张量网络公式。将此公式应用于负四次耦合的二维 $\\mathcal{PT}$ 对称 $\\phi^4$ 理论，我们推导出初始张量的显式解析表达式，并表明其分量根据张量索引之和的奇偶性分为偶数和奇数扇区。我们进一步阐述了关于替代复数轮廓的理论，并在任意维度上解析地建立了在此轮廓上定义的晶格配分函数与厄米特晶格 $\\phi^4$ 负四次耦合配分函数解析延拓实部之间的精确有限体积关系。", "authors": [{"name": "Yasuyuki Hatsuda"}, {"name": "Kengo Kikuchi"}], "featured_authors": [{"name": "Yasuyuki Hatsuda"}, {"name": "Kengo Kikuchi"}], "author_count": 2}, {"id": "2608.04522", "category": "hep-th", "title": "Critical and multicritical Kasner scaling in holographic phase transitions", "abstract": "We study how holographic phase transitions imprint their scaling laws on the local Kasner geometry inside Einstein-scalar black holes. At fixed double-trace coupling, we derive the near-critical scaling of the deviation of the first-epoch Kasner exponent from the Schwarzschild value: $p_t^{(1)}+\\frac{1}{3} \\propto O^2 \\propto (T_c-T)^{1/r}$, where $O$ denotes the boundary condensate and $r$ labels ordinary criticality ($r=1$), tricriticality ($r=2$), and higher multicriticality ($r\\geq3$). A super-exponential scalar potential generates a sequence of Kasner epochs separated by scalar-field bounces. We further find that any later epoch that can be tracked continuously across the transition inherits the same temperature exponent, while its coefficient depends on the epoch. Numerical solutions confirm these predictions for the ordinary and tricritical cases. Finally, we show analytically that the leading irrelevant exponent of the infrared fixed point governs the low-temperature Kasner scaling, and verify the resulting scaling numerically for the first Kasner exponent.", "url": "https://arxiv.org/abs/2608.04522", "type": "理论", "summary": "我们研究全息相变如何将其标度定律印记在爱因斯坦标量黑洞内的局部卡斯纳几何上。在固定双迹耦合下，我们推导出第一纪元 Kasner 指数与 Schwarzschild 值的偏差的近临界标度： $p_t^{(1)}+\\frac{1}{3} \\propto O^2 \\propto (T_c-T)^{1/r}$，其中 $O$ 表示边界凝聚，$r$ 标记普通临界性 ($r=1$)、三临界性($r=2$) 和更高的多临界性 ($r\\geq3$)。超指数标量势产生一系列由标量场反弹分隔的 Kasner 历元。我们进一步发现，任何可以在整个转变过程中连续跟踪的后期历元都会继承相同的温度指数，而其系数取决于历元。数值解证实了对普通和三临界情况的这些预测。最后，我们分析表明红外固定点的主导不相关指数控制低温 Kasner 标度，并以数值方式验证第一个 Kasner 指数的结果标度。", "authors": [{"name": "Ling-Long Gao"}, {"name": "Yan Liu"}, {"name": "Hong-Da Lyu"}], "featured_authors": [{"name": "Ling-Long Gao"}, {"name": "Yan Liu"}, {"name": "Hong-Da Lyu"}], "author_count": 3}, {"id": "2608.04595", "category": "hep-th", "title": "On the Fermion Level Crossing in the Electroweak Instanton Background", "abstract": "We investigate fermion level crossing in the electroweak instanton background, taking into account the Euclidean-time dependence of the fermion energy throughout our analysis, from the field equations to the spectral flow of fermion energy levels. Modifying the standard fermion ansatzes, we show that, irrespective of the model parameters, the duration over which the fermion energy spectrum flows from one continuum to another corresponds to exactly one unit change in the Chern--Simons number of the instanton. We further demonstrate that incorporating this time dependence is essential for establishing a one-to-one correspondence between the number of fermion zero modes and the instanton winding number, providing a numerical confirmation of the index theorem in the context of instanton backgrounds.", "url": "https://arxiv.org/abs/2608.04595", "type": "理论", "summary": "我们研究了电弱瞬子背景中的费米子能级交叉，在整个分析过程中考虑了费米子能量的欧几里德时间依赖性，从场方程到费米子能级的谱流。修改标准费米子模拟，我们表明，无论模型参数如何，费米子能谱从一个连续体流到另一个连续体的持续时间恰好对应于瞬子陈-西蒙斯数的一个单位变化。我们进一步证明，结合这种时间依赖性对于在费米子零模式的数量和瞬子绕数之间建立一对一的对应关系至关重要，从而在瞬子背景的背景下提供指数定理的数值确认。", "authors": [{"name": "P. E. Mogaddam"}, {"name": "S. S. Gousheh"}], "featured_authors": [{"name": "P. E. Mogaddam"}, {"name": "S. S. Gousheh"}], "author_count": 2}, {"id": "2608.04599", "category": "hep-th", "title": "Probe Dependence of the Imaginary Part of HTEE", "abstract": "We investigate the holographic timelike entanglement entropy (HTEE) in a five-dimensional anisotropic background, dual to a strongly coupled anisotropic plasma. Using the complex extremal surface method, we compute the HTEE analytically in the high-temperature, small-anisotropy limit $aT \\ll 1$. We consider two different orientations of the boundary timelike interval: one perpendicular to the anisotropy direction and one parallel to it. We find that the imaginary part of the HTEE is not a universal property of the geometry but depends sensitively on the orientation of the extremal surface relative to the anisotropy. This demonstrates that the imaginary part arising from the UV logarithmic divergence is a probe-dependent quantity. Our results suggest that the imaginary part of HTEE can serve as a diagnostic of the coupling between the extremal surface and the anisotropic degrees of freedom of the dual field theory.", "url": "https://arxiv.org/abs/2608.04599", "type": "理论", "summary": "我们研究了五维各向异性背景中的全息类时纠缠熵（HTEE），与强耦合各向异性等离子体对偶。使用复极值面法，我们在高温、小各向异性极限$aT \\ll 1$下解析计算了HTEE。我们考虑边界类时间隔的两种不同方向：一种垂直于各向异性方向，一种平行于各向异性方向。我们发现 HTEE 的虚部不是几何的通用属性，而是敏感地依赖于极值表面相对于各向异性的方向。这表明 UV 对数发散产生的虚部是与探针相关的量。我们的结果表明，HTEE 的虚部可以作为极值表面和双场理论各向异性自由度之间耦合的诊断。", "authors": [{"name": "Mohammad Ali-Akbari"}], "featured_authors": [{"name": "Mohammad Ali-Akbari"}], "author_count": 1}, {"id": "2608.04665", "category": "hep-th", "title": "Wavefunctions of AdS$_3$ Universes and $T\\bar{T}$-deformed Torus Partition Functions", "abstract": "We study wavefunctions of quantum gravity in asymptotically AdS$_3$ spacetimes and their relation to $T\\bar T$-deformed torus partition functions. We show that the deformed partition function is given by an invertible integral transform of bulk wavefunctions, with a kernel encoding the relation between the $T\\bar T$ coupling and the radial or temporal coordinate in the bulk. The invertibility of the transform allows the bulk wavefunction to be reconstructed from the family of $T\\bar T$-deformed partition functions. In the CFT limit, the kernel effectively localizes at the asymptotic boundary, recovering the standard holographic relation in which the partition function on the torus is determined by the boundary value of the bulk wavefunction. For finite deformation, the kernel shifts the effective holographic screen away from the asymptotic boundary and broadens it into a finite bulk region. A $T\\bar{T}$-deformed partition function at fixed coupling corresponds to a finite-width bulk wavepacket centered around a radial or temporal location set by the deformation scale. In Euclidean signature, the construction arises naturally from wavefunctions of Rindler AdS$_3$, while after a double Wick rotation it admits a Lorentzian interpretation in terms of closed AdS$_3$ torus universes without asymptotic boundaries. Finally, we discuss the extension of the present construction to de Sitter torus universes and its implications for de Sitter holography, and comment on possible generalizations to more general spatial topologies and higher-dimensional spacetimes.", "url": "https://arxiv.org/abs/2608.04665", "type": "理论", "summary": "我们研究渐进 AdS$_3$ 时空中量子引力的波函数及其与 $T\\bar T$ 变形环面配分函数的关系。我们证明，变形配分函数是由体波函数的可逆积分变换给出的，其中内核编码 $T\\bar T$ 耦合与体中径向或时间坐标之间的关系。变换的可逆性允许从 $T\\bar T$ 变形配分函数族重建体波函数。在 CFT 极限下，核有效地定位在渐近边界处，恢复了标准全息关系，其中环面上的配分函数由体波函数的边界值确定。对于有限变形，内核将有效全息屏幕从渐近边界移开，并将其扩展为有限的体区域。固定耦合处的 $T\\bar{T}$ 变形配分函数对应于以变形尺度设置的径向或时间位置为中心的有限宽度体波包。\n\n在欧几里得签名中，该构造自然地由 Rindler AdS$_3$ 的波函数产生，而在双威克旋转之后，它承认在没有渐近边界的封闭 AdS$_3$ 环面宇宙方面的洛伦兹解释。最后，我们讨论了当前构造对德西特环面宇宙的扩展及其对德西特全息术的影响，并评论了对更一般的空间拓扑和更高维时空的可能推广。", "authors": [{"name": "Shinji Hirano"}], "featured_authors": [{"name": "Shinji Hirano"}], "author_count": 1}, {"id": "2608.04705", "category": "hep-th", "title": "Corrections to the Unruh Effect from Robin Boundary Conditions in Punctured Minkowski Spacetime", "abstract": "We consider a real massless scalar field in punctured Minkowski spacetime, endowed at the removed origin with the stable one-parameter family of Robin boundary conditions $G(0)-\\beta G'(0)=0$, $\\beta\\geq0$. We obtain the boundary-induced part of the static ground-state Wightman function in closed form and study the response of a uniformly accelerated Unruh-DeWitt detector. The puncture breaks the boost symmetry underlying the stationary Unruh response, so the boundary-induced pullback is nonstationary in proper time. The corresponding subtracted detector contribution can either enhance or suppress the ordinary Minkowski response and depends on the Robin parameter, the detector gap, and the portion of the trajectory sampled. For the unshifted, radially aligned trajectory studied in detail, we prove that the boundary-induced pullback is absolutely integrable in the two proper-time variables. Consequently, as the smooth interaction is extended over the full detector history, this contribution approaches a finite limit and remains $O(1)$, producing no additional term linear in the interaction duration. The formal Neumann limit is singular: the boundary-induced two-point function grows logarithmically because of an infrared singularity in the $s$-wave sector, and the numerical response exhibits growth consistent with this asymptotic behavior.", "url": "https://arxiv.org/abs/2608.04705", "type": "理论", "summary": "我们考虑刺穿的闵可夫斯基时空中的真实无质量标量场，在移除的原点处赋予罗宾边界条件 $G(0)-\\beta G'(0)=0$, $\\beta\\geq0$ 的稳定单参数族。我们获得了封闭形式的静态基态 Wightman 函数的边界诱导部分，并研究了均匀加速的 Unruh-DeWitt 探测器的响应。击穿破坏了稳态昂鲁响应下的增强对称性，因此边界引起的回调在适当的时间是非平稳的。相应的减去的探测器贡献可以增强或抑制普通的 Minkowski 响应，并且取决于 Robin 参数、探测器间隙和采样轨迹的部分。对于详细研究的未移动的径向对齐轨迹，我们证明边界引起的回调在两个原时变量中绝对可积。因此，随着平滑交互扩展到整个探测器历史，这种贡献接近有限极限并保持 $O(1)$，在交互持续时间内不会产生额外的线性项。\n\n形式上的诺依曼极限是奇异的：由于 $s$ 波扇区中的红外奇点，边界引起的两点函数呈对数增长，并且数值响应表现出与这种渐近行为一致的增长。", "authors": [{"name": "Nickolas P. Botta"}, {"name": "João Paulo M. Pitelli"}, {"name": "Ricardo A. Mosna"}], "featured_authors": [{"name": "Nickolas P. Botta"}, {"name": "João Paulo M. Pitelli"}, {"name": "Ricardo A. Mosna"}], "author_count": 3}, {"id": "2608.04717", "category": "hep-th", "title": "Quantization of Algebraic Varieties Defined by Casimir Polynomials via Matrix Regularization: Fuzzy $S^7$ and Beyond", "abstract": "We study the quantization of algebraic varieties defined by equations involving Casimir polynomials of compact semisimple Lie algebras. The Casimir polynomials belong to the Poisson center of the corresponding Lie-Poisson algebra. For this purpose, we employ a recently developed matrix regularization of Lie-Poisson algebras. In particular, using its formulation based on reducible representations, we construct quantizations of these algebraic varieties through their decomposition into coadjoint orbits, including singular orbits. As a concrete example, we present the construction of fuzzy $S^7$ in detail.", "url": "https://arxiv.org/abs/2608.04717", "type": "理论", "summary": "我们研究由涉及紧半单李代数的卡西米尔多项式的方程定义的代数簇的量化。卡西米尔多项式属于相应的李泊松代数的泊松中心。为此，我们采用了最近开发的李泊松代数矩阵正则化。特别是，使用基于可约表示的公式，我们通过将这些代数簇分解为共伴轨道（包括奇异轨道）来构造这些代数簇的量化。作为一个具体的例子，我们详细介绍了模糊$S^7$的构造。", "authors": [{"name": "Akifumi Sako"}], "featured_authors": [{"name": "Akifumi Sako"}], "author_count": 1}, {"id": "2608.04745", "category": "hep-th", "title": "Quantum gravity around ultracold black holes from DSSYK", "abstract": "We propose a quantum description of the ultracold Reissner-Nordström de Sitter black hole via a specific flat space limit of the double-scaled SYK model. Fluctuations in this regime reduce to flat JT gravity, which is ill-behaved as a quantum system. We show that including the first subleading correction to the dilaton potential breaks the leading order Hagedorn degeneracy but does not resolve the structural problem. Finally, we leverage the gauged description of the sine dilaton gravity model to propose a novel quantization of the near-horizon dynamics of ultracold black holes. This leads to a new proposal for the partition function where states in the asymptotics of the spectrum are suppressed dynamically, and features of a discretized spacetime arise. We obtain a non-perturbative low temperature behavior of the partition function, which is quite different than the cold and Nariai physics. Our result can be interpreted as a dynamical way to enforce cosmic censorship on the quantum system.", "url": "https://arxiv.org/abs/2608.04745", "type": "理论", "summary": "我们提出通过双尺度 SYK 模型的特定平坦空间极限对超冷 Reissner-Nordström de Sitter 黑洞进行量子描述。这种状态下的涨落会减少到平坦的 JT 引力，这作为量子系统是不正常的。我们表明，包括对膨胀势的第一次次领先校正打破了领先顺序哈格多恩简并性，但并没有解决结构问题。最后，我们利用正弦膨胀引力模型的计量描述提出了一种超冷黑洞近地平线动力学的新颖量化方法。这导致了配分函数的新提议，其中频谱渐进状态被动态抑制，并且出现了离散时空的特征。我们获得了配分函数的非微扰低温行为，这与冷物理和 Nariai 物理有很大不同。我们的结果可以解释为对量子系统实施宇宙审查的动态方式。", "authors": [{"name": "Francesca Mariani"}, {"name": "Thomas G. Mertens"}, {"name": "Jacopo Papalini"}, {"name": "Thomas Tappeiner"}], "featured_authors": [{"name": "Francesca Mariani"}, {"name": "Thomas G. Mertens"}, {"name": "Jacopo Papalini"}, {"name": "Thomas Tappeiner"}], "author_count": 4}, {"id": "2608.05071", "category": "hep-th", "title": "Generalized comodule tube algebras for boundary and domain wall defects of (2+1)D topological order", "abstract": "The tube algebra, which carries the structure of a $C^*$ weak Hopf algebra, is a fundamental tool for characterizing topological excitations in topological phases. In this work, we generalize the tube algebra framework to codimension-2 defects in $(2+1)$D gapped phases described by Turaev--Viro--Barrett--Westbury TQFTs, with particular emphasis on Levin--Wen string-net models. We show that such codimension-2 defects are described by a \\emph{defect tube algebra}, which naturally carries the structure of a comodule algebra over the weak Hopf tube algebra associated with the topological excitations. Boundary and domain wall defects are then characterized by the representations of the corresponding boundary and domain wall defect tube algebras. In particular, a domain wall defect tube algebra can be regarded as a generalized Drinfeld double of the tube algebras associated with the two adjacent boundary defects. More generally, for a domain wall joining $N$ bulk phases, the associated domain wall defect tube algebra can be viewed as an $N$-tuple algebra. This perspective extends naturally to general $k$-defects, namely codimension-2 defects joining $k$ codimension-1 defects, for which the resulting generalized tube algebra carries the structure of a multicomodule algebra.", "url": "https://arxiv.org/abs/2608.05071", "type": "理论", "summary": "管代数具有 $C^*$ 弱 Hopf 代数的结构，是表征拓扑相中拓扑激励的基本工具。在这项工作中，我们将管代数框架推广到由 Turaev--Viro--Barrett--Westbury TQFT 描述的 $(2+1)$D 有隙相中的余维 2 缺陷，特别强调 Levin--Wen 弦网模型。我们证明这种余维 2 缺陷由 \\emph{缺陷管代数} 描述，它自然地在与拓扑激励相关的弱 Hopf 管代数上携带余模代数的结构。然后通过相应的边界和畴壁缺陷管代数的表示来表征边界和畴壁缺陷。特别地，畴壁缺陷管代数可以被视为与两个相邻边界缺陷相关的管代数的广义德林菲尔德双倍。更一般地，对于连接$N$体相的畴壁，相关的畴壁缺陷管代数可以被视为$N$元组代数。\n\n这种观点自然延伸到一般的 $k$ 缺陷，即 codimension-2 缺陷加入 $k$ codimension-1 缺陷，由此产生的广义管代数具有多模代数的结构。", "authors": [{"name": "Zhian Jia"}, {"name": "Sheng Tan"}], "featured_authors": [{"name": "Zhian Jia"}, {"name": "Sheng Tan"}], "author_count": 2}, {"id": "2608.05146", "category": "hep-th", "title": "Machine-Learning Search for Lax Connections", "abstract": "We apply a machine learning framework to search for Lax connections in two-dimensional non-linear sigma models using local current data. For the $SU(2)$ principal chiral model and the symmetric coset $S^2 = SU(2)/U(1)$, the method successfully recovers the full spectral-parameter families without using the known spectral curves as training targets. For the non-symmetric coset $T^{1,1}$, the optimization converges to reproducible low-loss maps that distill into a compact block-diagonal ansatz. However, analytic verification shows that this candidate is a ``fake Lax'' connection which satisfies on-shell flatness but fails to encode the two-dimensional equations of motion, whereas its point-particle reduction yields a genuine mechanical Lax pair. These results demonstrate that machine learning can effectively propose candidate ansätze and identify spectral structures, but low flatness loss alone does not certify genuine integrability, underscoring the necessity of analytic validation.", "url": "https://arxiv.org/abs/2608.05146", "type": "理论", "summary": "我们应用机器学习框架来使用局部当前数据搜索二维非线性 sigma 模型中的 Lax 连接。对于 $SU(2)$ 主手性模型和对称陪集 $S^2 = SU(2)/U(1)$，该方法成功地恢复了完整的光谱参数族，而无需使用已知的光谱曲线作为训练目标。对于非对称陪集 $T^{1,1}$，优化收敛到可再现的低损耗映射，该映射提炼成紧凑的块对角线 ansatz。然而，分析验证表明，该候选连接是一个“假 Lax”连接，它满足壳上平坦度，但无法对二维运动方程进行编码，而其点粒子简化产生了真正的机械 Lax 对。这些结果表明，机器学习可以有效地提出候选 ansätze 并识别光谱结构，但仅低平坦度损失并不能证明真正的可积性，这强调了分析验证的必要性。", "authors": [{"name": "Osamu Fukushima"}, {"name": "Tomohiro Shigemura"}, {"name": "Ryosuke Suda"}, {"name": "Norihiro Tanahashi"}, {"name": "Kentaroh Yoshida"}], "featured_authors": [{"name": "Osamu Fukushima"}, {"name": "Tomohiro Shigemura"}, {"name": "Ryosuke Suda"}, {"name": "Norihiro Tanahashi"}, {"name": "Kentaroh Yoshida"}], "author_count": 5}, {"id": "2608.04503", "category": "math-ph", "title": "Hidden Supersymmetry in Wigner-Yang Quantum Mechanics", "abstract": "We consider a quantum system on the real line obeying a deformed Heisenberg algebra originally proposed by Wigner in 1950. Its explicit coordinate representation was provided by Yang in 1951 and in essence is identical in form with Dunkl's difference-differential operator introduced in 1989 in connection with roots systems of refection groups. Under certain conditions such quantum systems exhibit a supersymmetric (SUSY) structure where the reflection operator acts as the grading operator. We present a generalisation of Yang's representation by first considering only of one the two equations of motion in phase space. The corresponding non-interacting system is found to represent Witten's model of SUSY quantum mechanics. Imposing also the second equation of motion the original result of Wigner and Yang is reconsidered by extending their discussion to general symmetric potentials on the real line. As explicit example we discuss the harmonic oscillator and an attractive Coulomb-like potential $V(x)=-\\gamma/|x|$. We also establish a Hooke-Newton duality between this Coulomb-like system and the original Wigner-Yang harmonic oscillator system.", "url": "https://arxiv.org/abs/2608.04503", "type": "理论", "summary": "我们考虑实线上的量子系统，它服从最初由 Wigner 在 1950 年提出的变形海森堡代数。它的显式坐标表示是由 Yang 在 1951 年提供的，本质上与 Dunkl 在 1989 年引入的与反射群根系统相关的差分-微分算子在形式上相同。在某些条件下，此类量子系统表现出超对称（SUSY）结构，其中反射算子充当分级算子。我们首先仅考虑相空间中的两个运动方程之一，从而对杨的表示进行推广。相应的非相互作用系统被发现代表了 SUSY 量子力学的 Witten 模型。将第二个运动方程强加到维格纳和杨的原始结果上，通过将他们的讨论扩展到实线上的一般对称势来重新考虑。作为明确的例子，我们讨论谐振子和有吸引力的类库仑势 $V(x)=-\\gamma/|x|$。我们还在这个类库仑系统和原始的维格纳-杨谐振子系统之间建立了胡克-牛顿对偶性。", "authors": [{"name": "Georg Junker"}], "featured_authors": [{"name": "Georg Junker"}], "author_count": 1}, {"id": "2608.04829", "category": "math-ph", "title": "Multi-frequency far-field data enrichment for electromagnetic source reconstruction", "abstract": "Reconstructing unknown electromagnetic sources from far-field radiation patterns is a fundamental inverse problem with broad applications in biomedical imaging, non-destructive testing, and telecommunications. In practical settings, however, collecting dense multi-frequency far-field measurements at the Nyquist sampling rate is often infeasible. Under-sampled or sparse data introduce non-radiating source components that sever the uniqueness of the solution, creating severe artifacts when standard inversion techniques are applied. To overcome this limitation, we present a two-stage reconstruction strategy exploiting the physical property that compactly supported, geometrically sparse sources exhibit a finite rate of innovations (FRI). In the first stage, we construct an associated wrap-around structured Hankel matrix. By leveraging the low-rank property of the matrix due to FRI of the unknown sources, we enrich the sub-sampled data. To that end, we convert missing multi-frequency far-field data recovery into a constrained matrix completion task solved via Annihilating Filter-based Low-rank Hankel Matrix Completion Approach (ALOHA). In the second stage, a Fourier inversion scheme reconstructs the current source density from the enriched dataset. Extensive numerical evaluations on electromagnetic source models show that our enrichment framework effectively eliminates under-sampling artifacts and resolves non-uniqueness challenges. The method delivers accurate and stable reconstructions under high sub-sampling rates (e.g., with $30$\\% to $50$\\% available samples) and strong noise conditions ($10$ dB SNR), outperforming standard $\\ell_1$-compressed sensing baselines.", "url": "https://arxiv.org/abs/2608.04829", "type": "理论", "summary": "从远场辐射模式重建未知电磁源是一个基本的反问题，在生物医学成像、无损检测和电信领域有着广泛的应用。然而，在实际设置中，以奈奎斯特采样率收集密集的多频远场测量通常是不可行的。欠采样或稀疏数据会引入非辐射源分量，从而破坏解的唯一性，在应用标准反演技术时会产生严重的伪影。为了克服这一限制，我们提出了一种两阶段重建策略，利用紧凑支撑、几何稀疏源表现出有限创新率（FRI）的物理特性。在第一阶段，我们构建一个相关的环绕式结构化汉克尔矩阵。通过利用未知源的 FRI 导致的矩阵低秩特性，我们丰富了子采样数据。为此，我们将丢失的多频远场数据恢复转换为通过基于湮灭滤波器的低秩汉克尔矩阵完成方法（ALOHA）解决的约束矩阵完成任务。\n\n在第二阶段，傅立叶反演方案从丰富的数据集中重建当前源密度。对电磁源模型的广泛数值评估表明，我们的丰富框架有效地消除了欠采样伪影并解决了非唯一性挑战。该方法在高子采样率（例如，$30$\\% 至 $50$\\% 可用样本）和强噪声条件（$10$ dB SNR）下提供准确且稳定的重建，优于标准 $\\ell_1$ 压缩传感基线。", "authors": [{"name": "Atyab Khalifa Al-Shaqsi"}, {"name": "Heba Mohammed Al-Subhi"}, {"name": "Xianchao Wang"}, {"name": "Shujaat Khan"}, {"name": "Abdul Wahab"}], "featured_authors": [{"name": "Atyab Khalifa Al-Shaqsi"}, {"name": "Heba Mohammed Al-Subhi"}, {"name": "Xianchao Wang"}, {"name": "Shujaat Khan"}, {"name": "Abdul Wahab"}], "author_count": 5}, {"id": "2608.04972", "category": "math-ph", "title": "Phase transitions in generalized XY models", "abstract": "We associate height function models to a range of generalized two-dimensional XY models and prove that delocalisation of the height function model rules out exponential decay of the nematic order parameter in the primal spin model. The argument is based on a generalized loop representation which relates the variance of a height difference between two faces to the nematic order parameter. This generalizes the results by van Engelenburg and Lis (2023). The range of models also includes the much-studied generalized XY model as proposed by Korshunov and independently by Lee and Grinstein, where neighbouring spins interact ferromagnetically favouring parallel alignment and nematically favouring parallel or antiparallel alignment. Moreover, we recover the existence of a nematic region by a classical comparison argument of Pfister (1982).", "url": "https://arxiv.org/abs/2608.04972", "type": "理论", "summary": "我们将高度函数模型与一系列广义二维 XY 模型相关联，并证明高度函数模型的离域化排除了原始自旋模型中向列序参数的指数衰减。该论证基于广义循环表示，该广义循环表示将两个面之间的高度差的方差与向列序参数相关联。这概括了 van Engelenburg 和 Lis (2023) 的结果。模型范围还包括由 Korshunov 提出并由 Lee 和 Grinstein 独立提出的经过大量研究的广义 XY 模型，其中相邻自旋以铁磁方式相互作用，有利于平行排列，向列有利于平行或反平行排列。此外，我们通过 Pfister (1982) 的经典比较论证恢复了向列区的存在。", "authors": [{"name": "Fabio Plaga"}], "featured_authors": [{"name": "Fabio Plaga"}], "author_count": 1}, {"id": "2608.04082", "category": "quant-ph", "title": "Quantum Many-Body Metrology of Rotation Sensing with Strong Interactions", "abstract": "We study the ultimate quantum limit of rotation sensing with a few strongly interacting bosons confined in a quasi-one-dimensional ring trap with two weak links. It is demonstrated that a self-consistent many-body solution of the problem is required to correctly predict the ultimate sensitivity of this strongly correlated many-body gyroscope to rotation. For both small rotation velocities and small particle numbers, the many-body quantum Fisher information becomes maximal for large interaction couplings, showing the potential of strongly interacting miniaturized many-body sensors to precisely estimate slow rotations with high spatial resolution.", "url": "https://arxiv.org/abs/2608.04082", "type": "理论", "summary": "我们研究了旋转传感的最终量子极限，其中一些强相互作用的玻色子被限制在具有两个弱连接的准一维环陷阱中。事实证明，需要一个自洽的多体解决方案来正确预测这种强相关多体陀螺仪对旋转的最终灵敏度。对于小旋转速度和小粒子数，多体量子费希尔信息在大相互作用耦合下变得最大，显示出强相互作用的小型化多体传感器以高空间分辨率精确估计慢速旋转的潜力。", "authors": [{"name": "Yong-Jun Baak"}, {"name": "Uwe R. Fischer"}], "featured_authors": [{"name": "Yong-Jun Baak"}, {"name": "Uwe R. Fischer"}], "author_count": 2}, {"id": "2608.04134", "category": "quant-ph", "title": "Photon localization: a comparative study", "abstract": "We compare different measures for photon localization in terms of two-dimensional Gaussian wave packets. We find that all measures start to coalesce if the wave packet has evolved for times which are larger than a few times the inverse momentum-space width of the package. However, the Landau-Peierls wave function yields the largest positive offset <r>-ct>0 while the scalar Fourier transform of the wave packet yields the smallest offset and converges towards <r>-ct=0 fastest. We also discuss local detection of photons through a model detector consisting of ions in ion traps. The position-dependent detection probabilities are inferred from the scattering matrix. We find that the local detection probability for photons can be expressed in terms of three of the proposed localization measures, viz. the Landau-Peierls wave function, the energy wave function, and the Hawton density. Those three porposals also remain close throughout the time evolution of the single-photon wave packet.", "url": "https://arxiv.org/abs/2608.04134", "type": "理论", "summary": "我们根据二维高斯波包比较了光子定位的不同方法。我们发现，如果波包演化的时间大于包的反动量空间宽度的几倍，则所有测量开始合并。然而，Landau-Peiierls 波函数产生最大的正偏移<r>-ct>0，而波包的标量傅里叶变换产生最小的偏移并且最快收敛到<r>-ct=0。我们还讨论了通过由离子陷阱中的离子组成的模型探测器对光子进行局部检测。位置相关的检测概率是从散射矩阵推断出来的。我们发现光子的局部检测概率可以用所提出的三种定位措施来表示，即。朗道-佩尔斯波函数、能量波函数和霍顿密度。这三个模型在单光子波包的整个时间演化过程中也保持接近。", "authors": [{"name": "Laura M. Ferguson"}, {"name": "Ricardo Rojas Castellano"}, {"name": "Kayla Oltman"}, {"name": "Joshua G. Fenwick"}, {"name": "Rainer Dick"}], "featured_authors": [{"name": "Laura M. Ferguson"}, {"name": "Ricardo Rojas Castellano"}, {"name": "Kayla Oltman"}, {"name": "Joshua G. Fenwick"}, {"name": "Rainer Dick"}], "author_count": 5}, {"id": "2608.04252", "category": "quant-ph", "title": "Dynamical Lie Algebras Cannot Describe Shallow QAOA: Cragged Terrains, Barren Plateaus, and Empirical Hardness Models", "abstract": "The dynamical Lie algebraic (DLA) theory of variational quantum algorithms (VQAs) predicts commonplace exponentially vanishing loss and gradient variances for sufficiently deep parametrized circuits. In this work, we show that these predictions fail dramatically in the shallow-circuit (and particularly constant-depth) regime for the Quantum Approximate Optimization Algorithm (QAOA) applied to the maximum independent set (MIS) problem. In a large-scale numerical study across $\\sim$23,000 problem instances, we find that barren plateaus are rare, while landscapes whose variances polynomially increase with system size---which we term \"cragged terrains\"---are common across graph families. This aggregate polynomial growth persists both for generic, low-symmetry random graphs and for highly symmetric vertex-transitive graphs, indicating that DLA-based variance predictions do not describe landscape scaling in this regime. As a stopgap alternative to the theory, we train empirical hardness models to predict instance-wise hardness metrics for QAOA-MIS. While these models generalize poorly, they nonetheless recover the correct landscape scaling class (barren plateau vs. cragged terrain) with high fidelity. Taken together, our results identify shallow QAOA for MIS as a prototypical setting in which asymptotic, unitary-design-centric predictions may be fundamentally insufficient to describe shallow variational quantum algorithms more broadly, emphasizing the need for more empirically-informed models of VQA loss landscapes.", "url": "https://arxiv.org/abs/2608.04252", "type": "理论+数值", "summary": "变分量子算法 (VQA) 的动态李代数 (DLA) 理论可以预测足够深的参数化电路中常见的指数消失损失和梯度方差。在这项工作中，我们表明，在应用于最大独立集（MIS）问题的量子近似优化算法（QAOA）的浅电路（尤其是恒定深度）状态下，这些预测会显着失败。在针对 $\\sim$23,000 个问题实例的大规模数值研究中，我们发现贫瘠的高原很少见，而方差随系统大小呈多项式增加的景观（我们称之为“崎岖地形”）在图族中很常见。对于通用的低对称性随机图和高度对称的顶点传递图，这种聚合多项式增长都持续存在，表明基于 DLA 的方差预测不能描述这种情况下的景观缩放。作为该理论的权宜之计，我们训练经验硬度模型来预测 QAOA-MIS 的实例硬度指标。虽然这些模型的泛化能力很差，但它们仍然恢复了正确的景观缩放类别（贫瘠高原与高原）。\n\n崎岖的地形）具有高保真度。总而言之，我们的结果将 MIS 的浅层 QAOA 确定为一种典型设置，其中渐近的、以单一设计为中心的预测可能从根本上不足以更广泛地描述浅层变分量子算法，强调需要更多基于经验的 VQA 损失景观模型。", "authors": [{"name": "Harrison Copp"}, {"name": "Charlton Li"}, {"name": "Anžej Margeta-Cacace"}, {"name": "Amy Qiao"}], "featured_authors": [{"name": "Harrison Copp"}, {"name": "Charlton Li"}, {"name": "Anžej Margeta-Cacace"}, {"name": "Amy Qiao"}], "author_count": 4}, {"id": "2608.04263", "category": "quant-ph", "title": "Poisson-Compiled Quantum Singular Value Transformation for Power-Exponential Dissipation", "abstract": "We study quantum implementations of the contraction $\\exp(-T H^\\alpha)$ for $H=H^\\dagger\\succeq0$ and $\\alpha>0$. Poisson summation provides an exact target--alias--tail decomposition whose Fourier samples are compiled classically into a single Chebyshev polynomial, so the quantum circuit uses polynomial eigenvalue transformation rather than a frequency linear combination of unitaries. We compare block encodings of $H/\\norm{H}$ and of the shifted signal $2H/\\norm{H}-I$. Under ordinary single-sequence QSVT, parity forces the former to use an even extension, which is entire only for even positive integers. An exact quadratic lift for the shifted signal makes every positive integer entire and improves the fixed-scale approximation error for noninteger powers from $\\Theta(d^{-\\alpha})$ to $\\Theta(d^{-2\\alpha})$ within the stated access and parity classes. We derive matching degree bounds in the large-scale fixed-error and fixed-scale high-precision limits, including the output-normalization overhead $u_r$. Nearest-neighbor Laplacians give a unit-normalized shifted signal. We further establish a noncommutative Weyl--Poisson identity compatible with LCHS quadrature, and use the same polynomial construction to implement controlled dissipative families in amplitude--phase separation.", "url": "https://arxiv.org/abs/2608.04263", "type": "理论", "summary": "我们研究 $H=H^\\dagger\\succeq0$ 和 $\\alpha>0$ 的收缩 $\\exp(-T H^\\alpha)$ 的量子实现。泊松求和提供了精确的目标（别名）尾部分解，其傅里叶样本被经典地编译为单个切比雪夫多项式，因此量子电路使用多项式特征值变换而不是酉的频率线性组合。我们比较 $H/\\norm{H}$ 和移位信号 $2H/\\norm{H}-I$ 的块编码。在普通的单序列 QSVT 下，奇偶校验迫使前者使用偶数扩展，该扩展仅对于偶数正整数而言是完整的。移位信号的精确二次提升使每个正整数完整，并在规定的访问和奇偶校验类别中改善非整数幂的固定比例近似误差，从 $\\Theta(d^{-\\alpha})$ 到 $\\Theta(d^{-2\\alpha})$。我们推导出大规模固定误差和固定规模高精度限制中的匹配度范围，包括输出归一化开销 $u_r$。最近邻拉普拉斯算子给出单位归一化的移位信号。\n\n我们进一步建立了与 LCHS 求积兼容的非交换 Weyl--Poisson 恒等式，并使用相同的多项式结构来实现幅相分离中的受控耗散族。", "authors": [{"name": "Chao Wang"}, {"name": "Xi-Ning Zhuang"}, {"name": "Menghan Dou"}, {"name": "Zhao-Yun Chen"}, {"name": "Guo-Ping Guo"}], "featured_authors": [{"name": "Chao Wang"}, {"name": "Xi-Ning Zhuang"}, {"name": "Menghan Dou"}, {"name": "Zhao-Yun Chen"}, {"name": "Guo-Ping Guo"}], "author_count": 5}, {"id": "2608.04354", "category": "quant-ph", "title": "The Born Representation Theorem and the Unistochastic Theorem", "abstract": "This paper presents self-contained, constructive proofs of two new theorems about stochastic matrices, with direct relevance to quantum theory. The first theorem, herein called the Born Representation Theorem, shows that each entry of any stochastic matrix can be expressed as the trace of a pairwise product of matrices, where the first factor in the pairwise product belongs to a positive-operator-valued measure (POVM) and the second factor belongs to a projection-valued measure (PVM). As its name suggests, this theorem entails that the entries of any stochastic matrix can be expressed in terms of a generalized version of the quantum-theoretic Born rule. It follows as a corollary that if the POVM in this first theorem is a PVM, then the stochastic matrix is unistochastic, meaning that its entries are each the modulus square of the corresponding entry of a unitary matrix of the same size. The second theorem proved in this paper, called the Unistochastic Theorem, then shows that by dilating the underlying vector space by a bounded number of additional dimensions if necessary, each entry of any stochastic matrix can be expressed in terms of the trace of a pairwise product for which both factors belong to PVMs, and can thus be derived via marginalization from a larger unistochastic matrix. This second theorem therefore establishes a kind of primacy of unistochastic matrices over stochastic matrices, and hints at a close connection with unitary time evolution in quantum theory. The paper concludes with a brief discussion of potential applications to discrete-time deterministic processes and Markov chains.", "url": "https://arxiv.org/abs/2608.04354", "type": "理论", "summary": "本文提出了关于随机矩阵的两个新定理的独立的、建设性的证明，与量子理论直接相关。第一个定理，本文称为玻恩表示定理，表明任何随机矩阵的每个条目都可以表示为矩阵的成对乘积的迹，其中成对乘积中的第一个因子属于正算子值测度（POVM），第二个因子属于投影值测度（PVM）。顾名思义，该定理意味着任何随机矩阵的条目都可以用量子理论玻恩规则的广义版本来表示。由此推论，如果第一个定理中的 POVM 是 PVM，则随机矩阵是单随机的，这意味着它的每个条目都是相同大小的酉矩阵的相应条目的模平方。\n\n本文证明的第二个定理称为单随机定理，它表明，如果需要，通过将基础向量空间扩大有限数量的附加维度，任何随机矩阵的每个条目都可以用两个因子都属于 PVM 的成对乘积的迹来表示，因此可以通过从更大的单随机矩阵中进行边缘化来导出。因此，第二个定理建立了单随机矩阵相对于随机矩阵的首要性，并暗示与量子理论中的酉时间演化的密切联系。本文最后简要讨论了离散时间确定性过程和马尔可夫链的潜在应用。", "authors": [{"name": "Jacob A. Barandes"}], "featured_authors": [{"name": "Jacob A. Barandes"}], "author_count": 1}, {"id": "2608.04369", "category": "quant-ph", "title": "Equilibrium Thermodynamics of Non-Hermitian Dirac Fermions: Caloric and Magnetic Responses", "abstract": "We establish scaling relations governing the equilibrium thermodynamics of real-spectrum non-Hermitian Dirac fermions in a magnetic field. Assuming thermalization with respect to the quasi-Hermitian Hamiltonian, a similarity transformation maps the system at the same applied field onto a Hermitian Dirac model with reduced velocity, while the Landau-level spectrum also admits a representation in terms of a reduced effective magnetic field. This structure yields scaling relations for the chemical potential, entropy, heat capacities, and orbital magnetic response in different thermodynamic ensembles. At fixed projected filling factor (PFF), the self-consistent chemical potential follows the compressed ladder of Landau levels, and the canonical thermodynamic functions are rescaled Hermitian responses. At fixed chemical potential, Landau-level crossings generate oscillatory caloric and magnetic responses governed by the same spectral compression. Quasistatic non-Hermitian deformation at fixed PFF further yields adiabatic temperature scaling. More broadly, these results establish a thermodynamic framework for real-spectrum non-Hermitian quantum matter and provide a starting point for incorporating the effects of interactions and disorder within the same formalism.", "url": "https://arxiv.org/abs/2608.04369", "type": "理论", "summary": "我们建立了控制磁场中实谱非厄米狄拉克费米子平衡热力学的标度关系。假设关于准厄米哈密顿量的热化，相似变换将相同应用场下的系统映射到速度减小的厄米狄拉克模型上，而朗道能级谱也允许以减小的有效磁场表示。这种结构产生不同热力学系综中化学势、熵、热容和轨道磁响应的标度关系。在固定的投影填充因子 (PFF) 下，自洽化学势遵循朗道能级的压缩阶梯，并且规范热力学函数是重新调整的埃尔米特响应。在固定化学势下，朗道能级交叉产生由相同光谱压缩控制的振荡热量和磁响应。固定 PFF 下的准静态非厄米变形进一步产生绝热温标。\n\n更广泛地说，这些结果为实谱非厄米量子物质建立了热力学框架，并为将相互作用和无序的影响纳入同一形式提供了一个起点。", "authors": [{"name": "Francisco J. Peña"}, {"name": "Bastian Castorene"}, {"name": "Juan Pablo Esparza"}, {"name": "Vladimir Juričić"}, {"name": "Patricio Vargas"}], "featured_authors": [{"name": "Francisco J. Peña"}, {"name": "Bastian Castorene"}, {"name": "Juan Pablo Esparza"}, {"name": "Vladimir Juričić"}, {"name": "Patricio Vargas"}], "author_count": 5}, {"id": "2608.04403", "category": "quant-ph", "title": "Information locality of a quantum locally recoverable code", "abstract": "A classical linear code $C$ of length $n$ is said to have symbol locality $(r, \\delta)$ if for any index $j$ there exists a repair group $J_j \\subseteq \\{1, \\ldots, n\\}$ with $j\\in J_j$ and $|J_j| \\leq r+\\delta-1$ such that any $\\delta-1$ or fewer erasures in $J_j$ can be corrected by using codeword symbols only in $J_j$. Later it turned out that this way of defining $r$ overestimates the number of necessary codeword symbols for multiple-erasure correction, and information locality was proposed to define $r$ as the dimension of the punctured code of $C$ onto $J_j$. Recently locality $(r,\\delta)$ was proposed for quantum error-correcting codes by following the original definition of symbol locality $(r, \\delta)$. We propose a quantum counterpart of the information locality for quantum stabilizer codes constructed by Hermitian orthogonality, and a linear algebraic procedure computing a smaller repair group predicted by the proposed information locality and simultaneously reducing the number of measured observables in decoding to its minimum possible value. Then we demonstrate that the previously proposed definition of quantum locality $(r,\\delta)$ has the same drawback of overestimating the number of necessary codeword symbols for erasure correction by providing an explicit example of a quantum stabilizer code. Finally, we will give another example of a quantum stabilizer code constructed by Euclidean orthogonality and two different linear codes, with which a natural translation of the classical information locality into the quantum setting underestimates the number of necessary codeword symbols for erasure correction.", "url": "https://arxiv.org/abs/2608.04403", "type": "理论", "summary": "如果对于任何索引 $j$ 存在一个修复组 $J_j \\subseteq \\{1, \\ldots, n\\}$ 且 $j\\in J_j$ 和 $|J_j| ，则长度 $n$ 的经典线性码 $C$ 被认为具有符号局部性 $(r, \\delta)$ \\leq r+\\delta-1$ 使得 $J_j$ 中的任何 $\\delta-1$ 或更少的擦除都可以通过仅在 $J_j$ 中使用码字符号来纠正。后来发现，这种定义$r$的方式高估了多纠删码所需的码字符号的数量，于是提出信息局部性将$r$定义为$C$在$J_j$上的打孔码的维度。最近，根据符号局部性$(r,\\delta)$的原始定义，提出了用于量子纠错码的局部性$(r,\\delta)$。我们提出了由厄米正交性构造的量子稳定器码的信息局域性的量子对应物，以及计算由所提出的信息局域性预测的较小修复群的线性代数过程，并同时将解码中测量的可观测量的数量减少到其最小可能值。\n\n然后，我们通过提供量子稳定器代码的明确示例来证明之前提出的量子局域性 $(r,\\delta)$ 的定义具有同样的缺点，即高估了擦除校正所需的码字符号的数量。最后，我们将给出由欧几里得正交性和两个不同线性码构造的量子稳定器码的另一个示例，利用该示例将经典信息局域性自然转换为量子设置会低估用于擦除校正所需的码字符号的数量。", "authors": [{"name": "Ryutaroh Matsumoto"}], "featured_authors": [{"name": "Ryutaroh Matsumoto"}], "author_count": 1}, {"id": "2608.04481", "category": "quant-ph", "title": "Impact of molecular orbital localization on quantum computational resources for Hamiltonian simulation: A benchmark study of hydrogen chain systems", "abstract": "We investigate how molecular orbitals used as the basis of wave function expansion and how operator coefficient-based and locality-based Hamiltonian truncation affects the computational cost of Trotter decomposition-based Hamiltonian simulation in one-dimensional hydrogen chain systems. The analysis is performed using both Hartree--Fock canonical molecular orbitals (CMOs) and Pipek--Mezey-based localized molecular orbitals (LMOs). For short hydrogen chains, we evaluate the ground-state energy and fidelity and find that, in the CMO-based wave function expansion, introducing a threshold on Hamiltonian coefficients is effective in reducing the gate cost while maintaining computational accuracy. In contrast, in the LMO-based wave function expansion, operator locality-based Hamiltonian truncation is found to be more effective. By fitting the relationship between the truncation threshold and the ground-state energies and fidelities with empirical formulas, we estimate the threshold values required to achieve high fidelity ($F \\ge 0.99$) in the ground-state wave function. Using the estimated thresholds, we then perform quantum gate resource estimation for longer hydrogen chains up to H$_{100}$. The results suggest an exponential advantage of the LMO-based wave function expansion with Hamiltonian truncation: the number of quantum gates required for Hamiltonian simulation grows polynomially when the CMO-based wave function expansion with operator coefficient-based Hamiltonian truncation is adopted, whereas it grows polylogarithmically when the LMO-based wave function expansion is combined with operator locality-based Hamiltonian truncation. These results provide useful guidelines for choosing orbital representations and Hamiltonian truncation strategies in large-scale quantum chemical simulations.", "url": "https://arxiv.org/abs/2608.04481", "type": "理论+数值", "summary": "我们研究了分子轨道如何用作波函数展开的基础，以及基于算子系数和基于局域性的哈密顿截断如何影响一维氢链系统中基于 Trotter 分解的哈密顿模拟的计算成本。使用 Hartree--Fock 规范分子轨道 (CMO) 和基于 Pipek--Mezey 的局域分子轨道 (LMO) 进行分析。对于短氢链，我们评估了基态能量和保真度，发现在基于 CMO 的波函数展开中，引入哈密顿系数阈值可以有效降低门成本，同时保持计算精度。相比之下，在基于 LMO 的波函数展开中，基于算子局部性的哈密顿截断被发现更有效。通过用经验公式拟合截断阈值与基态能量和保真度之间的关系，我们估计了基态波函数实现高保真度（$F \\ge 0.99$）所需的阈值。\n\n然后，我们使用估计的阈值对长达 H$_{100}$ 的较长氢链进行量子门资源估计。结果表明，基于 LMO 的波函数展开与哈密顿截断具有指数优势：当采用基于 CMO 的波函数展开与基于算子系数的哈密顿截断时，哈密顿模拟所需的量子门数量呈多项式增长，而当基于 LMO 的波函数展开与基于算子局域性的哈密顿截断相结合时，其数量呈多对数增长。这些结果为在大规模量子化学模拟中选择轨道表示和哈密顿截断策略提供了有用的指导。", "authors": [{"name": "Kenji Sugisaki"}, {"name": "Yuhei Tachi"}, {"name": "Masayoshi Terabe"}, {"name": "Hiroyuki Tezuka"}], "featured_authors": [{"name": "Kenji Sugisaki"}, {"name": "Yuhei Tachi"}, {"name": "Masayoshi Terabe"}, {"name": "Hiroyuki Tezuka"}], "author_count": 4}, {"id": "2608.04489", "category": "quant-ph", "title": "Engineering Nanodiamonds for Quantum Sensing: Material Constraints at the Nanoscale", "abstract": "Optically addressable solid-state spin defects have emerged as powerful multimodal quantum sensors, with nitrogen-vacancy (NV) centers in bulk diamond providing benchmark quantum control and sensitivity under ambient conditions. Embedding such defects in nanodiamonds (NDs) extends these capabilities to mobile probes capable of accessing complex biological and nanoscale environments. Reduced dimensions, however, introduce constraints beyond volumetric spin impurities, notably enhanced lattice strain and surface-induced noise sources, which shorten NV spin relaxation times (T1 and T2) and destabilize the NV charge state, as well as resulting in pronounced particle-to-particle variability in NDs typically produced by top-down approaches. These effects complicate both sensing performance and the quantitative interpretation of multimodal signals in realistic environments. This article provides a structured perspective on the physical mechanisms by which material properties constrain NV behavior in NDs, together with mitigation strategies that shape the robust use of these mobile quantum sensors for biosensing and nanoscale science.", "url": "https://arxiv.org/abs/2608.04489", "type": "理论", "summary": "光学可寻址固态自旋缺陷已成为强大的多模态量子传感器，块状金刚石中的氮空位（NV）中心可在环境条件下提供基准量子控制和灵敏度。将此类缺陷嵌入纳米金刚石 (ND) 中，可将这些功能扩展到能够访问复杂生物和纳米级环境的移动探针。然而，尺寸的减小引入了超出体积自旋杂质的限制，特别是增强的晶格应变和表面感应噪声源，这缩短了 NV 自旋弛豫时间（T1 和 T2）并破坏了 NV 电荷状态的稳定性，并导致通常由自上而下方法产生的 ND 中明显的粒子间变异性。这些效应使传感性能和现实环境中多模态信号的定量解释变得复杂。本文提供了关于材料特性限制 ND 中 NV 行为的物理机制的结构化视角，以及塑造这些移动量子传感器在生物传感和纳米级科学中的稳健使用的缓解策略。", "authors": [{"name": "Ashutosh Rathi"}, {"name": "Keisuke Oshimi"}, {"name": "Kento Sasaki"}, {"name": "Kensuke Kobayashi"}, {"name": "Yutaka Shikano"}, {"name": "Oliver Benson"}, {"name": "Tim Schröder"}, {"name": "Shery L. Y. Chang"}, {"name": "Masazumi Fujiwara"}], "featured_authors": [{"name": "Ashutosh Rathi"}, {"name": "Keisuke Oshimi"}, {"name": "Kento Sasaki"}, {"name": "Tim Schröder"}, {"name": "Shery L. Y. Chang"}, {"name": "Masazumi Fujiwara"}], "author_count": 9}, {"id": "2608.04539", "category": "quant-ph", "title": "Coupling Does Not Reduce the Auxiliary-Mode Count for $1/|ω|$ Spectra in Passive Lindblad Networks", "abstract": "Representing continuous environments by finitely many Markovian auxiliary modes is fundamental in non-Markovian open quantum systems, yet a critical question remains: at a fixed mode budget, can coherent intermode coupling reduce the spectral approximation error? We prove that intermode coupling offers no advantage when passive, number-conserving Gaussian Lindblad auxiliary networks approximate a $1/|\\omega|$ spectrum over a finite two-sided frequency band. For any mode budget $N$, the general coupled class and its uncoupled diagonal subclass share the same optimal error, which is exactly the degree-$2N$ Zolotarev error for sign approximation. This optimum is attainable by $N$ independent damped auxiliary modes at zero detuning. The result holds when the auxiliary network is in a stationary vacuum state, the system couples to it via a single Hermitian bath operator, and no white-noise feedthrough term is present. Consequently, although a general coupled network has $O(N^{2})$ real parameters, coherent intermode coupling, collective dissipation, and nonnormal structure cannot reduce the number of auxiliary modes required to reach a prescribed tolerance. This exact relation yields both the minimum mode count for a prescribed positive-frequency dynamic range and tolerance, and the maximum dynamic range attainable for a prescribed mode budget and tolerance.", "url": "https://arxiv.org/abs/2608.04539", "type": "理论", "summary": "用有限多个马尔可夫辅助模式表示连续环境是非马尔可夫开放量子系统的基础，但仍然存在一个关键问题：在固定模式预算下，相干模间耦合能否减少光谱近似误差？我们证明，当无源、数守恒高斯 Lindblad 辅助网络在有限两侧频带上近似 $1/|\\omega|$ 频谱时，模间耦合没有任何优势。对于任何模式预算 $N$，一般耦合类及其非耦合对角子类共享相同的最优误差，这正是符号逼近的度 $2N$ Zolotarev 误差。这种最佳效果可以通过零失谐时的 $N$ 独立阻尼辅助模式来实现。当辅助网络处于静止真空状态时，该结果成立，系统通过单个厄米浴算子与其耦合，并且不存在白噪声馈通项。因此，尽管一般耦合网络具有 $O(N^{2})$ 实参数，但相干模间耦合、集体耗散和非正态结构无法减少达到规定容差所需的辅助模式数量。\n\n这种精确的关系产生了规定的正频率动态范围和容差的最小模式计数，以及规定的模式预算和容差可达到的最大动态范围。", "authors": [{"name": "Qing-Ao Xiang"}, {"name": "Yan Liu"}, {"name": "Xin-Yuan Yang"}, {"name": "Ya-Ju Song"}], "featured_authors": [{"name": "Qing-Ao Xiang"}, {"name": "Yan Liu"}, {"name": "Xin-Yuan Yang"}, {"name": "Ya-Ju Song"}], "author_count": 4}, {"id": "2608.04564", "category": "quant-ph", "title": "Quantum annealers as programmable thermal machines", "abstract": "Programmable quantum annealers are used for optimization, probabilistic sampling, and simulation, but their performance is commonly reported without the energy exchanged during computation. Here we characterize the D-Wave quantum annealer as a closed thermodynamic cycle. From initial and final Ising energies and an effective temperature fitted to the output distribution, we obtain lower bounds on entropy production, environment energy exchange, work, and power. By varying the prepared distribution and the reverse annealing turning point, we map heater-, accelerator-, refrigerator-, and engine-compatible regimes in one dimensional chains and higher connectivity instances, and apply the same analysis to Advantage and Advantage2 hardware. For an encoded optimization problem, the measured processor energy change states whether final candidates improve or worsen the programmed objective on average. For sampling, the fitted temperature provides an operational measure of how strongly probability is concentrated among low energy configurations. The thermodynamic mode therefore adds information absent from solution quality or runtime alone: it distinguishes driven refinement, net heating, and heat pumping while quantifying their energetic consequences. This framework connects quantum optimization, probabilistic computing, statistical physics simulation, hardware diagnostics, and energy-aware assessment without assuming that a thermodynamic label alone determines computational performance.", "url": "https://arxiv.org/abs/2608.04564", "type": "理论+数值", "summary": "可编程量子退火器用于优化、概率采样和模拟，但它们的性能通常在计算过程中没有交换能量的情况下报告。在这里，我们将 D-Wave 量子退火器描述为一个封闭的热力学循环。根据初始和最终伊辛能量以及适合输出分布的有效温度，我们获得了熵产生、环境能量交换、功和功率的下界。通过改变准备好的分布和反向退火转折点，我们在一维链和更高连接实例中映射加热器、加速器、冰箱和发动机兼容机制，并将相同的分析应用于 Advantage 和 Advantage2 硬件。对于编码优化问题，测量的处理器能量变化表明最终候选者平均而言是改善还是恶化了编程目标。对于采样，拟合温度提供了一种可操作的测量方法，用于衡量低能量配置中概率集中的程度。\n\n因此，热力学模式添加了仅解决方案质量或运行时间所缺少的信息：它区分驱动细化、净加热和热泵，同时量化它们的能量结果。该框架将量子优化、概率计算、统计物理模拟、硬件诊断和能量感知评估连接起来，而不假设热力学标签单独决定计算性能。", "authors": [{"name": "Jakub Pawłowski"}, {"name": "Tomasz Śmierzchalski"}, {"name": "Fengping Jin"}, {"name": "Bartłomiej Gardas"}, {"name": "Sebastian Deffner"}, {"name": "Zakaria Mzaouali"}], "featured_authors": [{"name": "Jakub Pawłowski"}, {"name": "Tomasz Śmierzchalski"}, {"name": "Fengping Jin"}, {"name": "Bartłomiej Gardas"}, {"name": "Sebastian Deffner"}, {"name": "Zakaria Mzaouali"}], "author_count": 6}, {"id": "2608.04573", "category": "quant-ph", "title": "Resource Estimation for Fault-Tolerant Quantum Programs", "abstract": "Fault-tolerant quantum computation enables the deployment of practical quantum algorithms but incurs substantial overhead from error correction, making resource estimation a central concern. Beyond case-by-case analyses, existing quantum programming languages either require programmers to manipulate low-level hardware details, rendering fault-tolerant implementations cumbersome, or abstract away the underlying error-correction schemes, reducing the effectiveness of resource utilization and estimation. To address these limitations while preserving programmability, we present a quantum programming language that enables efficient resource utilization, together with a resource-estimation framework for comprehensive resource analysis. Our framework features programmer-visible abstractions of error-correction schemes and cross-layer program-hardware analysis, allowing systematic exploration of resource trade-offs. We evaluate our approach on detailed fault-tolerant implementations of practical large-scale quantum algorithms, including components typically treated as black boxes in existing frameworks. The results demonstrate that our framework enables substantial resource savings while delivering detailed, fine-grained, and accurate resource estimates for fault-tolerant quantum programs.", "url": "https://arxiv.org/abs/2608.04573", "type": "数值", "summary": "容错量子计算可以部署实用的量子算法，但会因纠错而产生大量开销，从而使资源估计成为核心问题。除了具体情况分析之外，现有的量子编程语言要么要求程序员操纵低级硬件细节，使容错实现变得繁琐，要么抽象出底层的纠错方案，降低资源利用和估计的有效性。为了在保持可编程性的同时解决这些限制，我们提出了一种能够实现高效资源利用的量子编程语言，以及用于全面资源分析的资源估计框架。我们的框架具有程序员可见的纠错方案抽象和跨层程序硬件分析，允许系统地探索资源权衡。我们评估了我们对实际大规模量子算法的详细容错实现的方法，包括在现有框架中通常被视为黑匣子的组件。\n\n结果表明，我们的框架可以节省大量资源，同时为容错量子程序提供详细、细粒度和准确的资源估计。", "authors": [{"name": "Bonan Su"}, {"name": "Yuan Feng"}, {"name": "Li Zhou"}, {"name": "Mingsheng Ying"}], "featured_authors": [{"name": "Bonan Su"}, {"name": "Yuan Feng"}, {"name": "Li Zhou"}, {"name": "Mingsheng Ying"}], "author_count": 4}, {"id": "2608.04601", "category": "quant-ph", "title": "Solving Differential Equations Using Continuous-Variable Quantum Annealing", "abstract": "Most existing quantum annealing approaches are formulated for qubit-based architectures. Consequently, applying them to continuous-variable optimization problems requires discretizing the variables, which can incur substantial qubit overhead. Continuous-variable quantum annealing based on bosonic systems has recently been proposed as an alternative framework, in which each optimization variable is directly encoded in a bosonic mode, such as a cavity mode. In this work, we develop a continuous-variable quantum annealing formulation for solving linear differential equations. By recasting the determination of the solution as a continuous-variable optimization problem, the differential equation can be mapped onto an objective function compatible with bosonic quantum annealing. Numerical simulations of second-order linear differential equations demonstrate that, under the conditions considered, the proposed formulation reproduces the corresponding analytical solutions. These results establish a potential route toward solving differential equations without the discretization overhead inherent in qubit-based implementations.", "url": "https://arxiv.org/abs/2608.04601", "type": "理论+数值", "summary": "大多数现有的量子退火方法都是针对基于量子位的架构制定的。因此，将它们应用于连续变量优化问题需要离散化变量，这可能会产生大量的量子位开销。最近提出了基于玻色子系统的连续变量量子退火作为替代框架，其中每个优化变量直接以玻色子模式（例如腔模式）编码。在这项工作中，我们开发了一种连续变量量子退火公式来求解线性微分方程。通过将解的确定重新定义为连续变量优化问题，可以将微分方程映射到与玻色子量子退火兼容的目标函数。二阶线性微分方程的数值模拟表明，在所考虑的条件下，所提出的公式再现了相应的解析解。这些结果建立了解决微分方程的潜在途径，而无需基于量子位的实现中固有的离散化开销。", "authors": [{"name": "Kazuki Miyanishi"}, {"name": "Soshun Naito"}, {"name": "Asuka Koura"}, {"name": "Kazue Kudo"}, {"name": "Toshiki Yamaji"}, {"name": "Yuichiro Matsuzaki"}], "featured_authors": [{"name": "Kazuki Miyanishi"}, {"name": "Soshun Naito"}, {"name": "Asuka Koura"}, {"name": "Kazue Kudo"}, {"name": "Toshiki Yamaji"}, {"name": "Yuichiro Matsuzaki"}], "author_count": 6}, {"id": "2608.04627", "category": "quant-ph", "title": "Efficient Depth--Ancilla Tradeoffs for Hamming Weight Computation and Symmetric Boolean Functions", "abstract": "Hamming weight computation maps an $n$-bit input to the number of ones it contains. It is a basic subroutine in quantum computing, and the core building block for symmetric Boolean functions, whose value depends only on the Hamming weight of the input. Moreover, symmetric Boolean functions are among the most common primitives in quantum computing. Efficient circuits for both problems are therefore important for the efficiency of many quantum algorithms. We study the depth-ancilla tradeoffs of Hamming weight computation under two qubit connectivity models, all-to-all and two-dimensional nearest-neighbor square grid (2D), in both the standard and dynamic circuit models. In the standard all-to-all model, we obtain depth $O(\\log n)$ with a sublinear number of ancillas. In the standard 2D model, we give a circuit of depth $O(\\sqrt n)$ with $O(\\log^2 n)$ ancillas, and a matching lower bound showing that $\\Theta(\\sqrt n)$ is optimal. In both dynamic models, we obtain constant-depth circuits with $O(n^{1+\\varepsilon}\\operatorname{polylog}\\,n)$ ancillary qubits for every fixed $\\varepsilon>0$. All constructions give a smooth depth-ancilla tradeoff, and they also extend to arbitrary symmetric Boolean functions.", "url": "https://arxiv.org/abs/2608.04627", "type": "理论+数值", "summary": "汉明权重计算将 $n$ 位输入映射到它包含的位数。它是量子计算中的基本子程序，也是对称布尔函数的核心构建块，其值仅取决于输入的汉明权重。此外，对称布尔函数是量子计算中最常见的原语之一。因此，解决这两个问题的高效电路对于许多量子算法的效率非常重要。我们研究了标准电路模型和动态电路模型中两种量子位连接模型（全对全和二维最近邻方形网格（2D））下汉明权重计算的深度与辅助权衡。在标准的 all-to-all 模型中，我们获得具有次线性数量的辅助的深度 $O(\\log n)$。在标准 2D 模型中，我们给出了一个深度为 $O(\\sqrt n)$ 的电路以及 $O(\\log^2 n)$ 辅助电路，以及一个匹配的下界，表明 $\\Theta(\\sqrt n)$ 是最佳的。在这两种动态模型中，对于每个固定的 $\\varepsilon>0$，我们都获得了具有 $O(n^{1+\\varepsilon}\\operatorname{polylog}\\,n)$ 辅助量子位的恒定深度电路。\n\n所有结构都提供了平滑的深度辅助权衡，并且它们还扩展到任意对称布尔函数。", "authors": [{"name": "Wei Zi"}, {"name": "Pei Yuan"}, {"name": "Junhong Nie"}, {"name": "Shengyu Zhang"}], "featured_authors": [{"name": "Wei Zi"}, {"name": "Pei Yuan"}, {"name": "Junhong Nie"}, {"name": "Shengyu Zhang"}], "author_count": 4}, {"id": "2608.04672", "category": "quant-ph", "title": "Effect of Cross-Spectral Correlations on Qubit Dynamics: Coherence Revival and Relaxation Modulation", "abstract": "We investigate the reduced dynamics of a qubit subject to correlated longitudinal and transverse noise arising from its coupling to a shared bosonic bath. The environmental fluctuations are characterized by a positive-semidefinite matrix-valued spectral density, whose complex off-diagonal elements encode correlations between dephasing and relaxation channels in the frequency domain. Within the second-order time-convolutionless framework, we derive closed time-local equations for the Bloch-vector components of the reduced density matrix. The numerical implementation is validated against the exact pure-dephasing solution and the established behavior of the transverse-coupling spin-boson model. When both noise channels are present, the cross-spectral terms couple the otherwise distinct dephasing and relaxation sectors, producing dynamics that cannot be reproduced by adding independent noise contributions. In particular, the correlations generate non-monotonic population relaxation and a transient revival of coherence following its initial decay. The strength, bandwidth, delay, and phase of the cross spectrum provide control parameters for the magnitude and temporal structure of these effects. Our results demonstrate that correlated multi-axis noise can redistribute coherence loss and energy relaxation in time, thereby providing finite temporal windows of enhanced coherence or suppressed relaxation within the weak-coupling regime.", "url": "https://arxiv.org/abs/2608.04672", "type": "理论+数值", "summary": "我们研究了量子位因与共享玻色浴耦合而产生的相关纵向和横向噪声的动力学降低。环境波动的特征是正半定矩阵值谱密度，其复杂的非对角元素编码频域中移相和弛豫通道之间的相关性。在二阶时间无卷积框架内，我们推导了降密度矩阵的布洛赫向量分量的闭合时间局部方程。针对精确的纯相移解和横向耦合自旋玻色子模型的既定行为验证了数值实现。当两个噪声通道都存在时，交叉频谱项会耦合不同的移相和弛豫部分，产生无法通过添加独立噪声贡献来再现的动态。特别是，相关性产生非单调总体松弛以及相干性在最初衰减后的短暂恢复。\n\n交叉频谱的强度、带宽、延迟和相位为这些效应的幅度和时间结构提供了控制参数。我们的结果表明，相关多轴噪声可以及时重新分配相干性损失和能量弛豫，从而在弱耦合范围内提供增强相干性或抑制弛豫的有限时间窗口。", "authors": [{"name": "Siddhartha Dutta"}, {"name": "Sujay Mondal"}, {"name": "Abhijit Bandyopadhyay"}], "featured_authors": [{"name": "Siddhartha Dutta"}, {"name": "Sujay Mondal"}, {"name": "Abhijit Bandyopadhyay"}], "author_count": 3}, {"id": "2608.04685", "category": "quant-ph", "title": "Quantum SWITCH-induced non-Markovianity is not entirely quantum", "abstract": "Indefinite causal order extends quantum information processing beyond fixed causal structures, with the quantum SWITCH serving as its canonical realization. By coherently superposing different orders of quantum channels, the quantum SWITCH has been shown to provide operational advantages in communication, computation, metrology, and related tasks. Despite these advances, the physical resources responsible for these advantages remains unclear. Recent studies have further revealed that the quantum SWITCH can generate memory effects, manifested as non-Markovian information backflow. In this work, we examine the origin of such memory and determine whether they reflect genuine (quantum) non-Markovianity or instead arises from classical origin. To this end, we analyze two representative scenarios: one based on discrete-time evolution and another formulated through dynamical maps in open quantum systems. We show that the memory effects generated by the quantum SWITCH are not genuinely quantum non-Markovian, thereby prompting a re-examination of the source of quantum advantage in indefinite causal order frameworks.", "url": "https://arxiv.org/abs/2608.04685", "type": "理论", "summary": "不确定的因果顺序将量子信息处理扩展到固定因果结构之外，量子开关作为其规范实现。通过相干地叠加不同阶的量子通道，量子开关已被证明可以在通信、计算、计量和相关任务中提供操作优势。尽管取得了这些进步，但带来这些优势的物理资源仍不清楚。最近的研究进一步揭示，量子SWITCH可以产生记忆效应，表现为非马尔可夫信息回流。在这项工作中，我们研究了这种记忆的起源，并确定它们是否反映了真正的（量子）非马尔可夫性，还是源于经典起源。为此，我们分析了两种代表性场景：一种基于离散时间演化，另一种通过开放量子系统中的动态映射制定。我们表明，量子开关产生的记忆效应并不是真正的量子非马尔可夫，从而促使人们重新审视无限因果顺序框架中量子优势的来源。", "authors": [{"name": "Rajeev Gangwar"}, {"name": "Ananda G. Maity"}], "featured_authors": [{"name": "Rajeev Gangwar"}, {"name": "Ananda G. Maity"}], "author_count": 2}, {"id": "2608.04775", "category": "quant-ph", "title": "From normal Lindbladians to non-normal quantum trajectories", "abstract": "Efficient simulation of Markovian open quantum systems remains a central challenge because the density-matrix description grows exponentially with system size. Quantum trajectory methods provide an alternative by replacing mixed-state evolution with stochastic pure-state realizations. Here we investigate this framework for normal Lindblad generators, whose orthogonal eigenoperator decomposition precludes transient amplification. By decomposing the Lindbladian into deterministic smooth and stochastic jump contributions, we derive an exact steady-state balance relation that identifies the interplay between these processes as the mechanism underlying Liouvillian normality. We further show that normal Lindbladians exclude exceptional points and that, although individual quantum trajectories generally exhibit stochastic coupling between Liouvillian eigenmodes, these couplings cancel upon ensemble averaging, recovering independent orthogonal relaxation modes. These results provide a trajectory-level interpretation of Liouvillian normality and clarify how a global property of the Lindblad generator is realized through stochastic quantum dynamics.", "url": "https://arxiv.org/abs/2608.04775", "type": "理论+数值", "summary": "马尔可夫开放量子系统的有效模拟仍然是一个核心挑战，因为密度矩阵描述随着系统尺寸呈指数增长。量子轨迹方法提供了一种替代方案，用随机纯态实现代替混合态演化。在这里，我们研究了正常 Lindblad 生成器的框架，其正交本征算子分解排除了瞬态放大。通过将 Lindbladian 分解为确定性平滑和随机跳跃贡献，我们得出了精确的稳态平衡关系，该关系将这些过程之间的相互作用识别为刘维尔正态性的潜在机制。我们进一步证明，正常的 Lindbladian 方程排除了异常点，并且尽管单个量子轨迹通常表现出刘维尔本征模之间的随机耦合，但这些耦合在系综平均时取消，恢复独立的正交弛豫模式。这些结果提供了刘维尔正态性的轨迹级解释，并阐明了如何通过随机量子动力学实现 Lindblad 发生器的全局属性。", "authors": [{"name": "Shakib Daryanoosh"}], "featured_authors": [{"name": "Shakib Daryanoosh"}], "author_count": 1}, {"id": "2608.04822", "category": "quant-ph", "title": "Quantum States Protection under Environmental Noise", "abstract": "All realistic quantum systems are inevitably in contact with the environment. Suppressing theimpact of environmental noise is a critical challenge in cutting-edge quantum technologies. In thiswork, we introduce and systematically analyze a scheme for the protection of quantum states againstamplitude-damping (AD) noise based on the circuit structure called the quantum filter. Filtrationcircuits employing single- and multi-control qubits are examined, and their capability to enhance stateprotection fidelity while preserving a high success probability is discussed. Moreover, for many-bodyqubit states, those with a fixed quantum Hamming weight can be perfectly protected against ADnoise, whereas states with the largest Hamming weight difference set a lower bound on the achievableprotection fidelity. Our work provides a resource-efficient route for quantum state protection withoutrequiring full quantum error correction.", "url": "https://arxiv.org/abs/2608.04822", "type": "理论", "summary": "所有现实的量子系统都不可避免地与环境接触。抑制环境噪声的影响是尖端量子技术的一个关键挑战。在这项工作中，我们介绍并系统地分析了一种基于称为量子滤波器的电路结构来保护量子态免受振幅阻尼（AD）噪声影响的方案。研究了采用单控制和多控制量子位的滤波电路，并讨论了它们在保持高成功概率的同时增强状态保护保真度的能力。此外，对于多体量子位状态，具有固定量子汉明权重的状态可以完美地免受 AD 噪声的影响，而汉明权重差异最大的状态则为可实现的保护保真度设置了下限。我们的工作为量子态保护提供了一条资源有效的途径，而不需要完全的量子纠错。", "authors": [{"name": "Kai Wang"}, {"name": "Zhen-Yang Peng"}], "featured_authors": [{"name": "Kai Wang"}, {"name": "Zhen-Yang Peng"}], "author_count": 2}, {"id": "2608.04844", "category": "quant-ph", "title": "Quantum walker trapped by self-similarity of the Sierpiński carpet", "abstract": "We study the dynamics of a single quantum particle on a finite-size square lattice with a fractal structure resembling the Sierpiński carpet, and compare it to the dynamics on a uniform lattice of the same size. For a particle initially localized at a corner of the lattice, we monitor the probability of finding it near the initial and opposite corners using zone-integrated probabilities, allowing a consistent comparison across fractal orders. While on the uniform lattice the particle reaches the opposite corner ballistically, in a time proportional to the lattice size, on the Sierpiński lattice it becomes increasingly confined to the vicinity of its initial position. We show that this trapping builds up self-similarly across the whole hierarchy of corner zones of the lattice.", "url": "https://arxiv.org/abs/2608.04844", "type": "理论", "summary": "我们研究了具有类似于谢尔宾斯基地毯的分形结构的有限尺寸方形晶格上的单个量子粒子的动力学，并将其与相同尺寸的均匀晶格上的动力学进行了比较。对于最初位于晶格角落的粒子，我们使用区域积分概率来监控在初始角和对角附近找到它的概率，从而允许跨分形阶进行一致的比较。在均匀晶格上，粒子在与晶格尺寸成正比的时间内以弹道方式到达对角，而在谢尔宾斯基晶格上，粒子变得越来越局限于其初始位置附近。我们表明，这种捕获在晶格角区的整个层次结构中自相似地建立起来。", "authors": [{"name": "Tomasz Sowiński"}], "featured_authors": [{"name": "Tomasz Sowiński"}], "author_count": 1}, {"id": "2608.04850", "category": "quant-ph", "title": "Two-dimensional Toda--Arnoldi correspondence: Holomorphic Krylov geometry and counterdiabatic transport", "abstract": "Although Arnoldi reduction of a generally non-Hermitian Hamiltonian yields an upper Hessenberg matrix rather than the tridiagonal form of Hermitian Lanczos theory, we show that a closed Toda sector survives in its diagonal and subdiagonal coefficients. For a fixed finite-dimensional Hamiltonian and a cyclic state vector deformed holomorphically, the Krylov Gram determinants are $\\tau$ functions of the finite two-dimensional Toda lattice, whose Flaschka variables coincide exactly with these Arnoldi coefficients. The Toda dynamics therefore closes on this sector without determining the remaining upper Hessenberg entries. The subdiagonal part of the same sector also has a direct geometric meaning: the squared subdiagonal coefficients determine both the Fubini--Study metric and the Berry curvature of holomorphic Krylov subspaces, whereas the geometric quantities associated with subspaces lost at Arnoldi breakdown cease to be defined. Along a smooth real path in the cyclic region, the Arnoldi-frame connection further provides a Hermitian tridiagonal generator of exact isospectral transport. When added to the Arnoldi matrix, this generator cancels transitions between instantaneous eigenspaces and realizes counterdiabatic driving whenever the matrix is diagonalizable with a nondegenerate spectrum.", "url": "https://arxiv.org/abs/2608.04850", "type": "理论", "summary": "尽管阿诺尔迪对一般非厄米哈密顿量的约简产生了上赫森伯格矩阵，而不是厄米兰佐斯理论的三对角形式，但我们表明，封闭的 Toda 扇区在其对角线和次对角线系数中仍然存在。对于固定的有限维哈密顿量和全纯变形的循环状态向量，Krylov Gram 行列式是有限二维 Toda 格的 $\\tau$ 函数，其 Flaschka 变量与这些 Arnoldi 系数完全一致。因此，Toda 动态关闭了该区域，但没有确定剩余的上 Hessenberg 条目。同一扇区的次对角线部分也具有直接的几何意义：平方次对角线系数决定了全纯 Krylov 子空间的 Fubini-Study 度量和贝里曲率，而与 Arnoldi 分解时丢失的子空间相关的几何量不再被定义。沿着循环区域中的平滑实数路径，阿诺尔迪框架连接进一步提供了精确等谱传输的埃尔米特三对角生成器。\n\n当添加到阿诺尔迪矩阵时，该生成器会取消瞬时特征空间之间的转换，并在矩阵可通过非简并谱对角化时实现反非绝热驱动。", "authors": [{"name": "Urei Miura"}], "featured_authors": [{"name": "Urei Miura"}], "author_count": 1}, {"id": "2608.04936", "category": "quant-ph", "title": "From Promise to Practice: Closing the Application Gap in Quantum Computing", "abstract": "Quantum computing is a deep technology whose progress cannot be driven effectively from one direction alone. While the field has developed a growing catalogue of mathematically grounded algorithmic speedups, industrial impact will depend just as much on starting from real industrial decision contexts and working downward to what must be computed, validated and integrated. In this Perspective, I argue that sustained progress requires treating these two directions: bottom-up development from physics, hardware and algorithms, and top-down development from industrial needs and constraints. Equally primary and continuously coupled. This dual-viewpoint is not a matter of balance for its own sake. Quantum computers cannot solve arbitrary problems, so engagement with industry must remain anchored in algorithmic tractability. Yet tractable computations are rarely valuable unless they connect to decision points in established workflows such as candidate selection in drug discovery or the design of a new aircraft shape with improved aerodynamics. I analyse how historical narratives and structural separations of expertise slowed the formation of this coupling and outline what it takes to build it: explicit interfaces between technical teams and domain context and intermediate layers that translate quantum outputs into decision-relevant observables without suffocating foundational innovation. Framed this way, quantum computing's opportunity is clearest where deep physical modelling meets high-value decisions. Provided the field co-designs both sides from the outset.", "url": "https://arxiv.org/abs/2608.04936", "type": "理论+数值", "summary": "量子计算是一项深层技术，仅从一个方向无法有效推动其进步。虽然该领域已经开发了越来越多的基于数学的算法加速目录，但工业影响将同样取决于从真实的工业决策环境开始，并向下延伸到必须计算、验证和集成的内容。在这个观点中，我认为持续的进步需要处理这两个方向：从物理、硬件和算法出发的自下而上的发展，以及从工业需求和约束出发的自上而下的发展。同等主要且持续耦合。这种双重观点本身并不是一个平衡问题。量子计算机无法解决任意问题，因此与行业的合作必须立足于算法的可处理性。然而，易于处理的计算很少有价值，除非它们连接到既定工作流程中的决策点，例如药物发现中的候选者选择或具有改进空气动力学的新飞机形状的设计。\n\n我分析了历史叙述和专业知识的结构分离如何减缓这种耦合的形成，并概述了构建这种耦合所需的条件：技术团队和领域上下文之间的显式接口以及中间层，这些接口将量子输出转换为与决策相关的可观察值，而不会扼杀基础创新。以这种方式构建，当深度物理建模满足高价值决策时，量子计算的机会是最明显的。前提是双方从一开始就进行现场共同设计。", "authors": [{"name": "Nicole Holzmann"}], "featured_authors": [{"name": "Nicole Holzmann"}], "author_count": 1}, {"id": "2608.04947", "category": "quant-ph", "title": "Sharp Continuity of Petz and Sandwiched Rényi Conditional Entropies", "abstract": "We determine the sharp modulus of continuity, in trace distance, of the optimized Petz and sandwiched Rényi conditional entropies for every order $\\alpha\\in[\\frac12,1)$. If two bipartite states are within trace distance $\\delta$, then both conditional entropies differ by at most $\\frac{1}{1-\\alpha} \\log[(1-\\varepsilon)^{\\alpha} +(D-1)^{1-\\alpha}\\varepsilon^{\\alpha}]$, where $\\varepsilon := \\min\\{\\delta,1-1/D\\}$ and $D$ is the effective dimension, given by the dimension of the first subsystem times the largest possible Schmidt rank. For every distance constraint $\\delta\\in[0,1]$, the bound is attained by an isotropic pair with a maximally entangled anchor. Taking $\\alpha\\uparrow1$ recovers the recent sharp continuity bound of quantum conditional entropy by Berta et al. [ arXiv:2607.24687 ]. The proof linearizes the relevant concave Rényi functional at a comparison point dictated by the isotropic equality family. Schmidt-rank domination extends the equality geometry to an arbitrary anchor state, after which trace-distance duality and a noncommutative calibration estimate control the perturbation and anchor term without weakening the sharp constant. The latter estimate requires matrix analysis and is assisted by ChatGPT 5.6 Sol.", "url": "https://arxiv.org/abs/2608.04947", "type": "理论+数值", "summary": "我们确定每个阶 $\\alpha\\in[\\frac12,1)$ 的优化 Petz 和夹层 Rényi 条件熵的连续锐模量（以迹线距离表示）。如果两个二分态在迹距离 $\\delta$ 内，则两个条件熵最多相差 $\\frac{1}{1-\\alpha} \\log[(1-\\varepsilon)^{\\alpha} +(D-1)^{1-\\alpha}\\varepsilon^{\\alpha}]$，其中 $\\varepsilon := \\min\\{\\delta,1-1/D\\}$ 和 $D$ 是有效维度，由下式给出第一个子系统的维度乘以最大可能的施密特等级。对于每个距离约束 $\\delta\\in[0,1]$，边界是通过具有最大纠缠锚的各向同性对来实现的。 Berta 等人采用 $\\alpha\\uparrow1$ 恢复了最近的量子条件熵的尖锐连续性界限。 [arXiv:2607.24687]。该证明在各向同性等式族规定的比较点处线性化相关凹 Rényi 泛函。施密特秩支配将等式几何扩展到任意锚定状态，之后轨迹距离对偶性和非交换校准估计控制扰动和锚定项而不削弱锐常数。\n\n后者的估计需要矩阵分析并由 ChatGPT 5.6 Sol 辅助。", "authors": [{"name": "Hao-Chung Cheng"}, {"name": "Po-Chieh Liu"}], "featured_authors": [{"name": "Hao-Chung Cheng"}, {"name": "Po-Chieh Liu"}], "author_count": 2}, {"id": "2608.04953", "category": "quant-ph", "title": "Diffusive Speed Limits for U(1)-Covariant Quantum Error Correction", "abstract": "Fast preparation of quantum error-correcting codes is essential for scalable quantum memories, but geometric locality and $U(1)$ charge conservation impose an unavoidable transport constraint. We combine exact complementary-channel geometry, charge-sector Haar analysis, and a gate-resolved connected-moment expansion to study one-dimensional covariant encoders under flagged erasure. Charge-Haar codes attain the universal adjacent-charge lower bound up to exponentially small corrections, yielding an exact $n^{-1/2}$ extensive-erasure law and a sharp half-erasure transition. For local number-conserving brickwork circuits, diffusion of the logical charge enforces an $\\Omega(n^2)$ encoding-time lower bound; we also prove an $O(n^3)$ mixing bound for the classical component and reduce the remaining full-channel upper bound to a source-restricted low-support operator-spreading problem. These results identify diffusion as an operational limit on symmetry-constrained quantum coding and establish a route to its exact formation time.", "url": "https://arxiv.org/abs/2608.04953", "type": "理论+数
