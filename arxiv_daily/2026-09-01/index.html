  <script>
    const papers = [{"id": "2608.28719", "category": "cond-mat", "title": "Emergent hydrodynamic response and dynamical backreaction: Magnon bound-state propagation in a Bose-Hubbard fluid", "abstract": "We study the nonequilibrium response of a one-dimensional Bose-Hubbard medium to a two-magnon bound state propagating along an attractive XXZ chain. A Holstein-type displacement coupling makes the magnon density act both as a local chemical-potential perturbation and as a source of bosons. We derive a long-wavelength hydrodynamic description of the density and phase fluctuations and test it against matrix-product-state simulations of the full coupled dynamics. The theory predicts a comoving near-field deformation together with retarded density waves confined to a sound cone. In the Mott regime, the deformation remains localized around the moving pair. In the compressible regime, two counterpropagating fronts detach and approach the semiclassical sound velocity, recovered from the equilibrium density with no fitted parameters. The coupling also induces a dynamical backreaction that slows the bound state and broadens its magnon-density profile. The comparison delimits where hydrodynamics stays quantitative once the probe reacts back on the medium.", "url": "https://arxiv.org/abs/2608.28719", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrés N. Cáliz"}, {"name": "Arnau Riera"}, {"name": "Enrique Rico"}, {"name": "João Barata"}, {"name": "Marcin Płodzień"}], "featured_authors": [{"name": "Andrés N. Cáliz"}, {"name": "Arnau Riera"}, {"name": "Enrique Rico"}, {"name": "João Barata"}, {"name": "Marcin Płodzień"}], "author_count": 5}, {"id": "2608.28731", "category": "cond-mat", "title": "Statistical Properties of a Fluctuation-Driven Nanomechanical Duffing Resonator", "abstract": "We investigate the fluctuating nonlinear dynamics of multiple modes of a nanomechanical doubly clamped beam resonator. Each mode is driven by Gaussian force noise centered around the resonance; the mode response is monitored while the force magnitude is increased, inducing a transition from harmonic to the nonlinear Duffing regime. To characterize the dynamics, we introduce an effective temperature based on the mode fluctuation amplitude. As the nonlinearity becomes prominent at large amplitudes, we observe a reduction in the effective thermal energy and a crossover in response statistics from Gaussian to platykurtic, consistent with the dynamics expected in a Duffing potential.", "url": "https://arxiv.org/abs/2608.28731", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Monan Ma"}, {"name": "Nathan Welles"}, {"name": "Johnathon Barbish"}, {"name": "Ismet I. Kaya"}, {"name": "M. Selim Hanay"}, {"name": "Oleksiy Svitelskiy"}, {"name": "Mark R. Paul"}, {"name": "Kamil L. Ekinci"}], "featured_authors": [{"name": "Monan Ma"}, {"name": "Nathan Welles"}, {"name": "Johnathon Barbish"}, {"name": "Oleksiy Svitelskiy"}, {"name": "Mark R. Paul"}, {"name": "Kamil L. Ekinci"}], "author_count": 8}, {"id": "2608.28739", "category": "cond-mat", "title": "Fractal Confinement and Magnetic Self-sabotage of Current Flow: Electrons Near the Metal-insulator Crossover in a 2D $δ$-layer", "abstract": "We study low-$T$ transport and itinerant magnetism in 2D $\\delta$-doped semiconductors. Large-scale Hartree-Fock calculations with random hoppings and repulsion $U_0$ reveal two transport regimes near a critical density. The conductivity $\\sigma(T)$ initially increases as $T$ drops below $U_0 / 10$. However, at $T \\sim U_0/100$, a tiny density of magnetic moments forms, driving an insulating downturn. Fractal wavefunctions locally amplify magnetic interactions, initially concentrating currents into branched filaments, but ultimately choking them off via dynamic SU(2) symmetry breaking.", "url": "https://arxiv.org/abs/2608.28739", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xinghai Zhang"}, {"name": "Matthew S. Foster"}, {"name": "Markus Mueller"}], "featured_authors": [{"name": "Xinghai Zhang"}, {"name": "Matthew S. Foster"}, {"name": "Markus Mueller"}], "author_count": 3}, {"id": "2608.28742", "category": "cond-mat", "title": "Determinant Quantum-Quantum Monte Carlo: Coherent Auxiliary-Field Sampling", "abstract": "We introduce determinant quantum-quantum Monte Carlo (DQ$^2$MC), a quantum algorithm that lifts the auxiliary-field sampling and averaging at the operational core of determinant quantum Monte Carlo onto a quantum computer. A determinant oracle synthesizes the DQMC amplitudes directly from a block encoding of the single-particle action matrix via quantum singular value transformations, so that the exponentially many Hubbard-Stratonovich weights are never enumerated, precomputed, or stored. Since the fermions are free for fixed auxiliary fields, the construction operates entirely at the single-particle level, requiring $O(\\log N_{\\mathrm{st}})$ system qubits and no Jordan-Wigner or Bravyi-Kitaev encoding, where $N_{\\mathrm{st}}$ is the space-time volume. A full-quantum protocol makes observables interference amplitudes, eliminating the Markov chain and its autocorrelation time altogether; a hybrid quantum-classical protocol retains a constant-size active block of qubits and replaces the Metropolis-Hastings acceptance step with an exact heat-bath draw, so that cluster updates of any size are rejection-free, and passes only classical information between updates, admitting parallel tempering and distributed execution across quantum processors. The circuit-depth scales more favorably with spatial volume than classical DQMC, at the price of a post-selection overhead determined exactly by the largest target probability --- polynomial for smooth distributions, exponential for sharply peaked ones. Finally, the reweighting estimator underlying the fermion sign problem maps exactly onto a quantum weak value, placing the exponential cost of sign-problematic DQMC in precise correspondence with the post-selection overhead of weak-value extraction.", "url": "https://arxiv.org/abs/2608.28742", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xuepeng Wang"}, {"name": "Sagnik Banerjee"}, {"name": "Debanjan Chowdhury"}], "featured_authors": [{"name": "Xuepeng Wang"}, {"name": "Sagnik Banerjee"}, {"name": "Debanjan Chowdhury"}], "author_count": 3}, {"id": "2608.28750", "category": "cond-mat", "title": "Floquet engineering of competing antiferromagnetism and $d$-wave superconductivity on the square lattice", "abstract": "We propose a driven Lieb--Hubbard quantum simulator whose prethermal dynamics realize a square-lattice spin-1/2 fermion model with independently tunable repulsive on-site and attractive bond interactions. Periodically modulating the charge-transfer offset between the site ($d$) and bond ($p$) orbitals of the Lieb lattice brings a $p$-orbital doublon energetically close to a pair in the $d$ manifold while keeping all $p$-orbital singlons off resonance, thereby creating a synthetic ``negative-$U$'' center on a Lieb-lattice bond site. Two controlled eliminations then generate a compact bond attraction in the reduced $d$-only model on the square lattice, despite the microscopic repulsion in the $p$ orbital. The resulting interaction $J$ is tunable independently of the Hubbard repulsion $U_d$ on the $d$ orbitals, while interference between photon-assisted paths provides access to an intermediate-coupling regime in which $J$ and $U_d$ are both comparable to the effective hopping. At half filling, a mean-field calculation in this regime finds adjacent antiferromagnetic and $d$-wave superconducting phases, as well as narrow coexistence regions, suggesting close competition between these orders. We discuss the branch-preparation, prethermal, and higher-band conditions required to translate the formal construction into an optical-lattice protocol. More broadly, our work identifies a structural similarity between Floquet systems and electron-phonon problems that may guide the design of novel quantum-simulation protocols.", "url": "https://arxiv.org/abs/2608.28750", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhaoyu Han"}, {"name": "Subir Sachdev"}], "featured_authors": [{"name": "Zhaoyu Han"}, {"name": "Subir Sachdev"}], "author_count": 2}, {"id": "2608.28831", "category": "cond-mat", "title": "Domain walls with alternating magnetic order in a model with dipolar coupling", "abstract": "A model for a one-dimensional chain of elongated nano-scale magnetic islands with dipole interactions is analyzed here for the properties of its static domain walls with site-by-site alternating order. The anisotropic magnetic islands on a nonmagnetic substrate have their longer axes oriented transverse ($y$-direction) to the chain direction ($x$-direction), in a transverse applied magnetic field. The islands' magnetic dipoles $\\vec{\\mu}_n$ are represented as macrospins of fixed length $\\mu$. The nearest-neighbor (NN) dipole interactions drive transverse alternating order, allowing for doubly-degenerate, uniform, static, $y$-alternating states, where the dipoles alternately point transverse to the chain direction, as in $\\vec{\\mu}_n = \\pm(-1)^n \\mu \\hat{y}$. Assuming only NN interactions, the domain walls connecting these two alternating states are found with numerical relaxation simulations and analyzed in a two-sublattice continuum theory. As the uniaxial anisotropy constant $K_1$ descends from larger values until it closely approaches the NN dipolar coupling constant $D$, the domain wall width grows indefinitely, and the large-$x$ continuum solutions closely approach the lattice numerical solutions. The applied field produces a very slight canting of the dipoles towards the field, maximum in the center of the domain wall. The dipoles on the two sublattices are found to rotate in {\\em opposite senses} as one scans along the lattice, resulting in a large longitudinal magnetic moment of the domain wall. A much smaller transverse magnetic moment has a topological contribution that depends on whether the chain length is odd or even.", "url": "https://arxiv.org/abs/2608.28831", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "G. M. Wysin"}], "featured_authors": [{"name": "G. M. Wysin"}], "author_count": 1}, {"id": "2608.28861", "category": "cond-mat", "title": "Engineering Excitons through Polymorphism and Dimensional Confinement in Low-Dimensional Tellurium", "abstract": "The interplay between dimensionality, band-edge electronic structure, and electron-hole interactions governs the optical response of low-dimensional tellurium, yet the microscopic origin of its excitonic behavior remains largely unexplored. Here, we investigate the quasiparticle, excitonic, and optical properties of two-dimensional tellurium polymorphs and one-dimensional helical nanowires using many-body GW and the Bethe--Salpeter equation. Our results reveal a strong dependence of the excitonic response on band-edge dispersion, crystal symmetry, and dimensional confinement. $\\alpha$-tellurene exhibits comparatively weak and spatially extended electron-hole correlations, whereas the SOC-induced quasi-flat band-edge states of $\\beta$-tellurene give rise to a strongly bound and anisotropic near-infrared exciton. Momentum-resolved BSE eigenvectors and real-space exciton wave functions directly reveal the contrasting localization and anisotropy of these excitonic states. Remarkably, hydrogen-passivated hexagonal tellurene, previously identified as a quantum spin Hall phase with $Z_2=1$, supports an even larger direct exciton binding energy of 0.51 eV together with a compact and nearly isotropic in-plane excitonic distribution. This demonstrates that strong electron-hole correlations are fully compatible with nontrivial band topology, while the binding strength and spatial character of the exciton remain strongly dependent on the underlying band-edge electronic structure and crystal symmetry. The one-dimensional helical nanowire represents the strong-confinement limit, exhibiting a direct high exciton binding energy and a pronounced shift of the optical response toward the ultraviolet.", "url": "https://arxiv.org/abs/2608.28861", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gabriel Elyas Gama Araujo"}, {"name": "Alexandre Cavalheiro Dias"}, {"name": "Andreia Luisa da Rosa"}], "featured_authors": [{"name": "Gabriel Elyas Gama Araujo"}, {"name": "Alexandre Cavalheiro Dias"}, {"name": "Andreia Luisa da Rosa"}], "author_count": 3}, {"id": "2608.28898", "category": "cond-mat", "title": "Phase stability, charge ordering, and charge-liquid formation in the Falicov-Kimball model on triangular and kagome lattices", "abstract": "We present a systematic investigation of the stability of the phase diagram of the spinless Falicov-Kimball model on two-dimensional non-bipartite lattices, the triangular and kagome lattices, using Markov-chain Monte Carlo simulations. Three filling or chemical potential conditions are examined: fixed chemical potentials ($\\mu_f = \\mu_c = U/2$), \"generalized\" half-filling ($\\bar{n}_f = 1/3$, $\\bar{n}_c = 2/3$), and conventional half-filling ($\\bar{n}_f = \\bar{n}_c = 1/2$). For each condition, the effects of a perturbatively small next-nearest-neighbor hopping are studied. On the triangular lattice, Anderson insulator, Mott insulator, and charge-density wave (CDW) phases are found in all cases, with the CDW driven by Coulomb-interaction-mediated nesting. Evidence for a charge-liquid regime is found in the region between the weakly correlated regime and the CDW, characterized by competing charge-ordering wavevectors and the absence of universal scaling behavior, whose extent shrinks progressively from the grand-canonical to the conventional half-filling condition. On the kagome lattice, the CDW phase is completely absent; instead, an insulating ground state, plausibly of the Mott type, is found, with signatures of a possible quantum phase transition at zero temperature. Our results establish the crucial role of lattice geometry and particle-hole symmetry breaking in shaping the phase diagram of correlated electron systems.", "url": "https://arxiv.org/abs/2608.28898", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ammar Nejati"}, {"name": "Marvin Lenk"}], "featured_authors": [{"name": "Ammar Nejati"}, {"name": "Marvin Lenk"}], "author_count": 2}, {"id": "2608.28903", "category": "cond-mat", "title": "Revealing low-energy surfaces of multinary compounds by controlling surface coordination environments", "abstract": "When modeling surfaces of multinary compounds, conventional cleavage planes often cut through strongly bonded polyhedra, resulting in unphysical surface energies. Here, we introduce SALAMI (Symmetric Atomic Layers for Arbitrary Multinary Interfaces), a Python package that generates symmetric, charge-neutral, dipole-free, and low-energy slab models for multinary compounds. SALAMI performs combinatorial searches to selectively remove surface atoms and generate corrugated terminations that preserve optimal coordination environments. We applied this workflow to all symmetrically inequivalent crystallographic orientations with Miller indices up to 2 for two prototypical structures: the solid-state electrolyte Li3PS4 and the transparent conducting oxide ZnSb2O6. Density functional theory calculations reveal that Li3PS4 must preserve all PS4 units to achieve the minimum surface energy. For ZnSb2O6, low-energy surfaces are achieved by partial undercoordination of surface Sb atoms to SbO5 or SbO4 from the bulk SbO6, depending on the surface orientations. Compared to surface models generated with unconstrained coordination, applying constraints to achieve optimal local coordination environments significantly lowers surface energies, shrinking the volume of the predicted Wulff shape by approximately 20%. Our results demonstrate that meticulous control of local coordination environments is necessary for accurately predicting the surface energetics of multinary compounds.", "url": "https://arxiv.org/abs/2608.28903", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Weihang Xie"}, {"name": "Harshan Reddy Gopidi"}, {"name": "Zhengyu Liu"}, {"name": "Romain Claes"}, {"name": "Alexander G. Squires"}, {"name": "Keith T. Butler"}, {"name": "David O. Scanlon"}, {"name": "Pieremanuele Canepa"}], "featured_authors": [{"name": "Weihang Xie"}, {"name": "Harshan Reddy Gopidi"}, {"name": "Zhengyu Liu"}, {"name": "Keith T. Butler"}, {"name": "David O. Scanlon"}, {"name": "Pieremanuele Canepa"}], "author_count": 8}, {"id": "2608.28915", "category": "cond-mat", "title": "Energy landscape and dissipation of sliding magnetic rotor arrays", "abstract": "Magnetically coupled damped rotational degrees of freedom can give rise to tribological loss when excited by a relative sliding motion, linking friction to the dynamics of magnetic moments. We analytically investigate such magnetic friction by studying a recently introduced simplified model for a rigid magnetic rotor array sliding over a commensurate magnetic substrate. Here, the array rotors can rotate about an axis perpendicular to the sliding direction and are damped by microscopic shaft friction, while the substrate magnets have a fixed in-plane orientation. The simplified model reduces the collective rotor dynamics of this setup to a set of coupled nonlinear differential equations, which can be studied by the corresponding energy landscape in the quasi-static regime. We find that the parameter plane spanned by layer separation and time can be divided into distinct chambers, in which the structure of the energy landscape remains invariant. Using these chambers, we identify the layer separation intervals corresponding to different dynamical states and recover the emergence of a regime where the moment alignment alternates globally while exhibiting peak dissipation. Additionally, we derive the leading nontrivial orders of the collective magnetic friction in the regimes of small and large gaps between the array and the substrate. For the alternating regime, we find that friction can be computed by tracking energy jumps from unstable to stable critical points at the chamber boundaries. These results provide an analytical foundation for the observed dynamics and dissipation in sliding rotor arrays. Because the simplified model is scale-free, our conclusions transfer across a broad range of microscopic and macroscopic length scales.", "url": "https://arxiv.org/abs/2608.28915", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Johannes Krotz"}, {"name": "Anton Lüders"}], "featured_authors": [{"name": "Johannes Krotz"}, {"name": "Anton Lüders"}], "author_count": 2}, {"id": "2608.28928", "category": "cond-mat", "title": "Chiral Tubular Magnonic Crystals with Periodic Dzyaloshinskii--Moriya Interaction", "abstract": "We introduce a chiral tubular magnonic crystal formed by a ferromagnetic nanotube with a periodically modulated interfacial Dzyaloshinskii--Moriya interaction (DMI). Using a plane-wave formalism adapted to the cylindrical geometry, we calculate the spin-wave band structure including exchange, nonlocal dipolar coupling, and interfacial DMI. We show that the tubular geometry qualitatively modifies the role of periodic DMI compared with planar chiral magnonic crystals. Besides producing the usual nonreciprocal frequency shift, curvature converts part of the interfacial DMI into an effective anisotropy-like internal field. This creates a sign-dependent frequency landscape along the tube, so that DMI-covered regions can act either as potential wells or barriers for the lowest-frequency modes. As a result, flat and weakly dispersive bands appear in both Damon--Eshbach-like and backward-volume-like configurations, with the latter having no direct counterpart in planar systems. Our results identify periodically engineered DMI in nanotubes as a route for controlling nonreciprocal spin waves, localized modes, and flat magnonic bands in curved architectures.", "url": "https://arxiv.org/abs/2608.28928", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "P. Contreras-Gallardo"}, {"name": "J. Flores-Farias"}, {"name": "B. Mimica-Figari"}, {"name": "V. Puliafito"}, {"name": "P. Landeros"}, {"name": "R. A. Gallardo"}], "featured_authors": [{"name": "P. Contreras-Gallardo"}, {"name": "J. Flores-Farias"}, {"name": "B. Mimica-Figari"}, {"name": "V. Puliafito"}, {"name": "P. Landeros"}, {"name": "R. A. Gallardo"}], "author_count": 6}, {"id": "2608.28953", "category": "cond-mat", "title": "Giant staggered Dzyaloshinskii-Moriya vectors emerged in synthetic antiferromagnets with spatially alternating stress", "abstract": "Dzyaloshinskii-Moriya (DM) interaction is a source of chiral magnetic physics, and it manifests microstructural symmetry which could link to exotic magnetic and electronic properties such as altermagnetism. For a new paradigm in magnetism and spintronics, it is crucial to have control on the DM interaction as well as ordering of the DM vectors which characterize the DM interaction. Here, we report on a strong interlayer DM interaction emerged in Co/Ru magnetic superlattices whose structural symmetry is unambiguously broken by alternating mechanical strains developed using the peculiar technique of our stress mechanism. Moreover, theoretical analyses reveal that our magnetic superlattices host a staggered order of the DM vectors. Our results indicate that the spatially varying strains with our breakthrough technique are quite effective in breaking the symmetry of the system and prove that it can control the DM interaction strength as well as the DM vector order.", "url": "https://arxiv.org/abs/2608.28953", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuuga Iwata"}, {"name": "Kensuke Hayashi"}, {"name": "Reiju Furumaki"}, {"name": "Satoshi Iihama"}, {"name": "Masahiro Sato"}, {"name": "Takahiro Moriyama"}], "featured_authors": [{"name": "Yuuga Iwata"}, {"name": "Kensuke Hayashi"}, {"name": "Reiju Furumaki"}, {"name": "Satoshi Iihama"}, {"name": "Masahiro Sato"}, {"name": "Takahiro Moriyama"}], "author_count": 6}, {"id": "2608.28996", "category": "cond-mat", "title": "Orbital occupation selects structural dimensionality in binary transition-metal oxides", "abstract": "Orbital-lattice coupling in transition-metal oxides is usually discussed within a given bonding framework, where orbital occupation is intertwined with local coordination, strain, or symmetry breaking. Here, we show that orbital occupation can also select the bonding framework itself, thereby determining structural dimensionality. Using first-principles calculations, we identify CrO as a prototype in which the single active $3d\\,e_g$ electron of high-spin Cr$^{2+}$ gives rise to two competing orbital-structure states. The $d_{x^2-y^2}$ occupation favors a three-dimensionally connected covalent phase, whereas the $d_{z^2}$ occupation stabilizes a weakly coupled layered phase. Constrained-occupation calculations show that increasing the $d_{z^2}$ filling continuously contracts the in-plane lattice while expanding the structure along the layer normal. The two phases exhibit distinct magnetic ground states and ferroelastic responses. Moreover, the layered phase is robust against exchange-correlation functional and on-site ($U$) variations, remains dynamically stable down to the monolayer limit, and has a low exfoliation energy of 46 meV/Angstrom^2. Extending the analysis across related $3d$ binary oxides reveals a filling-dependence relation between accessible orbital filling and the preference for 2D or 3D connected bonding motifs, providing a microscopic basis for exploring low-dimensional oxide materials.", "url": "https://arxiv.org/abs/2608.28996", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Deping Guo"}, {"name": "Renhong Wang"}, {"name": "Cong Wang"}, {"name": "Meng Gao"}, {"name": "Wu Zhou"}, {"name": "Yanning Zhang"}, {"name": "Fei Pang"}, {"name": "Zhihai Cheng"}, {"name": "Wei Ji"}], "featured_authors": [{"name": "Deping Guo"}, {"name": "Renhong Wang"}, {"name": "Cong Wang"}, {"name": "Fei Pang"}, {"name": "Zhihai Cheng"}, {"name": "Wei Ji"}], "author_count": 9}, {"id": "2608.29007", "category": "cond-mat", "title": "Fractional Impurity Entropy from Potential Scattering in a Free Electron Gas", "abstract": "Fractional changes in entropy are often associated with strong electron correlations or non-Abelian anyons in topological systems. We show that neither condition is necessary -- a system of free electrons on a ring scattering off a repulsive point-like impurity undergoes a $k_B\\ln\\sqrt 2$ entropy change as the impurity strength is increased. This effect arises from a shift of allowed single-particle momenta from integer quantization to half-integer quantization, induced by the impurity. We show that this fractional entropy change is universal across a broad class of single-particle dispersions, demonstrating that such signatures can arise without strong correlations or topological order.", "url": "https://arxiv.org/abs/2608.29007", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Syeda Neha Zaidi"}, {"name": "Jukka I. Väyrynen"}], "featured_authors": [{"name": "Syeda Neha Zaidi"}, {"name": "Jukka I. Väyrynen"}], "author_count": 2}, {"id": "2608.29062", "category": "cond-mat", "title": "Enhanced Diffusion from Twist-Angle Disorder", "abstract": "We consider the effect of twist-angle disorder on the single-particle properties of twisted bilayer systems. These materials are a natural playground for studying how tiny, uncontrolled spatial variations may become unusually consequential; a local change in the twist geometry can give rise to spatially-correlated alterations of the parent Hamiltonian, which in turn affect the coarse-grained properties of the substrate such as transport and ordering tendencies. In analogy to electrodynamics, where the magnetic field is given by the curl of the vector potential, we model the twist angle as the curl of the relative displacement between the two bilayers. We find that geometric scattering constraints imposed here by the twist structure substantially suppress momentum relaxation relative to mean-rate-matched white noise. We quantify these effects and show that the problem can be mapped onto a non-linear sigma model (NLSM).", "url": "https://arxiv.org/abs/2608.29062", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nicole S Ticea"}, {"name": "Yi-Ming Wu"}], "featured_authors": [{"name": "Nicole S Ticea"}, {"name": "Yi-Ming Wu"}], "author_count": 2}, {"id": "2608.29064", "category": "cond-mat", "title": "Duality Between Twist-Angle Disorder and Non-Hermitian Disorder", "abstract": "We propose and study a model of moire heterobilayer systems where the twist angle remains uniform and well defined only within a finite range, but deforms randomly at larger distances. The local twist angle is then subject to a certain probability distribution that penalizes large fluctuations around its mean value. Within the framework of the replica trick, we show that disorder averaging produces a nontrivial correlation with alternating sign between replicas, maximized only close the boundary of each local domain and along certain directions. We show that for the low-energy moire bands, exactly the same correlation can be generated in a dual model where fermions are coupled to non-Hermitian disorder, which can evade Anderson localization dynamically. This duality provides a new perspective to investigate twist-angle disorder in moire systems, and unveils some of the essential differences between twist-angle disorder and conventional disorder.", "url": "https://arxiv.org/abs/2608.29064", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yi-Ming Wu"}, {"name": "Nicole S. Ticea"}], "featured_authors": [{"name": "Yi-Ming Wu"}, {"name": "Nicole S. Ticea"}], "author_count": 2}, {"id": "2608.29089", "category": "cond-mat", "title": "Real-space manifestation of ferroic multipoles in altermagnetic MnF$_2$", "abstract": "Altermagnets are unconventional spin split magnets arising from the zero spin-orbit coupled limit. They host a magnetic multipolar order parameter yet direct real-space observation of these multipoles has remained elusive. Here we use polarized-neutron diffraction to reconstruct the three-dimensional magnetization density of the prototypical altermagnet MnF$_2$. By exploiting symmetry-selective magnetic reflections, we separate the dominant spherical Mn$^{2+}$ contribution from the much weaker anisotropic Mn magnetization and the covalent spin polarization of the fluorine ligands. The reconstructed spin density reveals a finite fluorine ion moment together with an anisotropic Mn magnetization consistent with the symmetry-allowed altermagnetic rank-5 magnetic multipole $O_{52}$(magnetic triacontadipole). These results provide direct real-space evidence of ferroic multipolar order in an altermagnet and establish polarized-neutron diffraction as a powerful probe of hidden magnetic multipoles in quantum materials.", "url": "https://arxiv.org/abs/2608.29089", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Iurii Kibalin"}, {"name": "Dalila Bounoua"}, {"name": "José A. Rodriguez Velamazán"}, {"name": "Oscar Fabelo"}, {"name": "Navid Qureshi"}, {"name": "Quentin Faure"}, {"name": "Philippe Bourges"}, {"name": "Victor Balédent"}, {"name": "Jian-Rui Soh"}, {"name": "Jeffrey Rau"}, {"name": "Paul McClarty"}, {"name": "Arsen Gukasov"}], "featured_authors": [{"name": "Iurii Kibalin"}, {"name": "Dalila Bounoua"}, {"name": "José A. Rodriguez Velamazán"}, {"name": "Jeffrey Rau"}, {"name": "Paul McClarty"}, {"name": "Arsen Gukasov"}], "author_count": 12}, {"id": "2608.29091", "category": "cond-mat", "title": "Doping-driven evolution of pairing symmetry in pressurized La$_3$Ni$_2$O$_7$", "abstract": "We investigate the superconducting pairing symmetry and its doping evolution in pressurized La$_3$Ni$_2$O$_7$. For the undoped compound, the most favorable pairing state is found to be $s_{\\pm}$-wave, characterized by sign reversal of the gap functions between the Fermi pockets. A detailed analysis of the pairing interactions reveals that this unconventional state originates from repulsive interactions mediated by the magnetic odd modes of the bilayer nickelate. Upon hole doping, the $\\gamma$ Fermi pocket expands, which amplifies the intrapocket repulsions on this pocket. These repulsions, driven by the magnetic even modes, gradually dominates the pairing interactions and ultimately drive a transition in pairing symmetry from $s_{\\pm}$-wave to $d_{xy}$-wave in the heavily hole-doped regime. In stark contrast, the $s_{\\pm}$-wave pairing persists under electron doping, even deep into the heavily electron-doped regime where a Lifshitz transition occurs. This finding suggests that the $\\gamma$ Fermi pocket is not essential for the emergence of superconductivity in bilayer nickelates. In fact, the $s_{\\pm}$-wave pairing becomes more robust in the absence of the $\\gamma$ pocket, as spin fluctuations are strongly enhanced by the favorable nesting between the $\\alpha$ and $\\beta$ pockets --- a condition guaranteed by Luttinger's theorem and the Fermi surface topology. We believe that exploring the doping evolution of superconducting pairing will open a new realm for testing the pairing mechanism in pressurized La$_3$Ni$_2$O$_7$.", "url": "https://arxiv.org/abs/2608.29091", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hai-Yang Zhang"}, {"name": "Yu-Jie Bai"}, {"name": "Fan-Jie Kong"}], "featured_authors": [{"name": "Hai-Yang Zhang"}, {"name": "Yu-Jie Bai"}, {"name": "Fan-Jie Kong"}], "author_count": 3}, {"id": "2608.29122", "category": "cond-mat", "title": "Light-induced nonconservative static forces in many-body systems", "abstract": "In a quantum many-body system, a periodic drive can often generate effective static forces on the slow collective degrees of freedom. We study the static forces generated by light on electronic order parameters in solid-state systems. We show that the forces can have nonconservative components that originate from dissipation, i.e., optical absorption. This effect is demonstrated in two nontrivial examples. In excitonic insulators, via interband excitations, the light field generates a nonconservative force on the phase of the excitonic order parameter. This force leads to an acceleration of the phase, which manifests as a shift of the photon emission peak from an exciton condensate. In materials with an incommensurate charge density wave, a propagating light field generates a nonconservative force on the phase of its order parameter. It drives the charge density wave into sliding motion, leading to a DC electric current via topological Thouless pumping.", "url": "https://arxiv.org/abs/2608.29122", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jinze Li"}, {"name": "Xuemei Yang"}, {"name": "Zhiyuan Sun"}], "featured_authors": [{"name": "Jinze Li"}, {"name": "Xuemei Yang"}, {"name": "Zhiyuan Sun"}], "author_count": 3}, {"id": "2608.29141", "category": "cond-mat", "title": "Directional commensurability stabilizes structural superlubricity in patterned mesoscale interfaces", "abstract": "Structural superlubricity, arising from lattice incommensurability, offers a promising route to eliminate friction and associated energy losses in mechanical systems. In real-world systems, roughness and wear currently pose severe limitations on its robustness and especially the contact size. Here, we consider patterned surfaces as a possible route to overcome some of these limitations. We show that the simplest choice of patterning, contacts made up of two incommensurate triangular-triangular patterns, fails at elevated loads because of the small number of load-bearing contacts, causing the maximum local contact pressure to exceed the strength of the superlubric coating. We introduce a square-triangular patterned interface that increases the number of load-bearing contacts and organizes them into continuous contact lines. When sliding along specific directions relative to these lines, superlubricity is maintained at significantly higher loads by reducing pressure-induced coating failure while also remaining somewhat tolerant to surface imperfections. These findings establish a mechanism for stabilizing structural superlubricity against coating failure and a design principle for engineering low-friction interfaces with enhanced load-bearing capacity and defect tolerance.", "url": "https://arxiv.org/abs/2608.29141", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Viet Hung Ho"}, {"name": "Ge Li"}, {"name": "Melisa M. Gianetti"}, {"name": "Bjørn Haugen"}, {"name": "Graham L. W. Cross"}, {"name": "Astrid S. de Wijn"}], "featured_authors": [{"name": "Viet Hung Ho"}, {"name": "Ge Li"}, {"name": "Melisa M. Gianetti"}, {"name": "Bjørn Haugen"}, {"name": "Graham L. W. Cross"}, {"name": "Astrid S. de Wijn"}], "author_count": 6}, {"id": "2608.29226", "category": "cond-mat", "title": "Ornstein-Uhlenbeck Process Driven by Multiple Dichotomous Noises", "abstract": "We study a generalized Ornstein-Uhlenbeck process driven by a superposition of $K$ independent dichotomous noises with arbitrary fixed amplitudes and switching rates. Unlike the classical Ornstein-Uhlenbeck process driven by equilibrium Gaussian white noise, the present system is governed by bounded nonequilibrium fluctuations with finite correlation times. We obtain exact expressions for the stationary position distribution and all cumulants, and show that the stationary state possesses an unexpectedly rich structure, including compact support, algebraic branch-point singularities, edge divergences, and multiple extrema. We establish a mapping onto a heterogeneous random-flight process with bounded jumps, yielding a transparent probabilistic interpretation of the stationary measure. We further analyze several limiting regimes, including the crossover to Gaussian statistics for large numbers of noise sources. For ensembles with exponentially-distributed quenched amplitudes, we derive exact disorder-averaged stationary distributions and show that disorder fundamentally alters the stationary state, producing exponential tails decorated by algebraic prefactors with non-trivial exponents.", "url": "https://arxiv.org/abs/2608.29226", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Silvio Kalaj"}, {"name": "Dongho Lee"}, {"name": "Enzo Marinari"}, {"name": "Jae-Hyung Jeon"}, {"name": "Pascal Viot"}, {"name": "Gleb Oshanin"}], "featured_authors": [{"name": "Silvio Kalaj"}, {"name": "Dongho Lee"}, {"name": "Enzo Marinari"}, {"name": "Jae-Hyung Jeon"}, {"name": "Pascal Viot"}, {"name": "Gleb Oshanin"}], "author_count": 6}, {"id": "2608.29325", "category": "cond-mat", "title": "Heavy-Hole--Light-Hole Mixing and Spin--Photon Coupling in Germanium Flopping-Mode Qubits", "abstract": "Intrinsic spin--orbit interaction in germanium provides electrically active flopping-mode qubits without requiring magnetic-field gradients to generate spin--charge hybridization. We study double quantum dots (DQDs) with a multiband Luttinger--Kohn framework that retains heavy-hole (HH) and light-hole (LH) states on equal footing. Modeling vertical confinement with a finite confinement potential along the growth direction brings selected subbands into a regime of appreciable HH--LH mixing. This admixture activates electric-dipole spin-coupling through LH--LH and LH--HH transitions, complementing the conventional HH--HH pseudospin-flip resonance. For the parameter sets considered, these additional channels can produce larger spin--photon figures of merit than the HH--HH transition. HH--LH mixing thus supplies a tunable ingredient for qubit--cavity coupling in germanium hole-spin qubits and extends the operating regimes available to circuit-QED architectures.", "url": "https://arxiv.org/abs/2608.29325", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jose Reina-Gálvez"}, {"name": "Guido Burkard"}], "featured_authors": [{"name": "Jose Reina-Gálvez"}, {"name": "Guido Burkard"}], "author_count": 2}, {"id": "2608.29340", "category": "cond-mat", "title": "Strain-Driven Electronic and Catalytic Modulation of g-C3N4/GeS van der Waals heterostructure for Photocatalytic Water Splitting", "abstract": "Photocatalytic water splitting offers a viable pathway for sustainable hydrogen production. In this study, first-principles density functional theory calculations were performed to explore the strain-dependent photocatalytic behaviour of a two-dimensional g-C3N4/GeS heterostructure. The heterostructure shows type-II band alignment with an indirect band gap of 2.17 eV, smaller than those of the individual g-C3N4 (2.81 eV) and GeS (3.31 eV) monolayers. Biaxial tensile strain up to 3% effectively modulates the band gap and band edge positions, allowing suitable alignment with water redox potentials. The calculated Gibbs free energy for the hydrogen evolution reaction ({\\Delta}GHER) is 0.2 eV for the pristine heterostructure and approaches near-thermoneutral values (-/+ 0.1 eV) under +1% and +2% strain. Meanwhile, the OER overpotential decreases from 2.17 V to 0.97 V with increasing strain. AIMD simulations and optical absorption in the visible region confirm the thermodynamic stability and promising photocatalytic potential of the heterostructure for hydrogen generation.", "url": "https://arxiv.org/abs/2608.29340", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Soumendra Kumar Das"}, {"name": "Smruti Ranjan Parida"}, {"name": "Tapas Kumbhakar"}, {"name": "Prasanjit Samal"}, {"name": "Sridhar Sahu"}], "featured_authors": [{"name": "Soumendra Kumar Das"}, {"name": "Smruti Ranjan Parida"}, {"name": "Tapas Kumbhakar"}, {"name": "Prasanjit Samal"}, {"name": "Sridhar Sahu"}], "author_count": 5}, {"id": "2608.29343", "category": "cond-mat", "title": "\"Ultra-weak\" First-Order Phase Transition in Biaxial Liquid Crystals", "abstract": "We report high-resolution Monte Carlo evidence characterizing the hierarchy of transition strengths in biaxial nematogens. By employing multiple histogram reweighting on large lattices, we demonstrate that while the isotropic-to-uniaxial ($I \\to N_U$) transition is symmetry-enforced first-order, the uniaxial-to-biaxial ($N_U \\to N_B$) transition in the region between the tricritical point and the triple point ($\\lambda = 0.26$) is proximity-driven and more than an order of magnitude smaller for large system sizes. Such a class of ultra-weak first-order transitions could be a new pathway for future investigations.", "url": "https://arxiv.org/abs/2608.29343", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Soumyajit Pramanick"}, {"name": "Mrinal Kanti Debnath"}, {"name": "Nababrata Ghoshal"}, {"name": "Soumen Kumar Roy"}, {"name": "Sudeshna Dasgupta"}], "featured_authors": [{"name": "Soumyajit Pramanick"}, {"name": "Mrinal Kanti Debnath"}, {"name": "Nababrata Ghoshal"}, {"name": "Soumen Kumar Roy"}, {"name": "Sudeshna Dasgupta"}], "author_count": 5}, {"id": "2608.29405", "category": "cond-mat", "title": "Dynamical backaction in nanoscale superfluid electromechanics", "abstract": "Nanofluidic acoustic resonators employing superfluid $^4$He can be used to study quantized vortices from collective behavior in two-dimensional superfluid turbulence down to few individual vortices created by rotation. In order to improve sensitivity to the level needed for probing individual quantized vortices, readout mechanisms employing optomechanical or optomechanics-inspired approaches seem to be promising in this regard. In this work, we develop an electromechanical system, which couples a 4$^\\mathrm{th}$ sound acoustic resonance to a superconducting LC tank circuit in a sideband-resolved regime. Using this system, we demonstrate electromechanically induced transparency (EMIT), optical spring effect and optomechanical sideband damping and amplification. Furthermore, by rotating the cryostat, we demonstrate sensitivity to quantized vortices, which can become trapped and released in avalanche-like process inside the nanofluidic volume.", "url": "https://arxiv.org/abs/2608.29405", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Marek Talíř"}, {"name": "Filip Novotný"}, {"name": "Balázs Szalai"}, {"name": "Nasiruddin Mondal"}, {"name": "Emil Varga"}], "featured_authors": [{"name": "Marek Talíř"}, {"name": "Filip Novotný"}, {"name": "Balázs Szalai"}, {"name": "Nasiruddin Mondal"}, {"name": "Emil Varga"}], "author_count": 5}, {"id": "2608.29413", "category": "cond-mat", "title": "PINN-Phase: A physics-informed neural network for curvature-driven multiphase-field evolution", "abstract": "Phase-field simulation of polycrystalline microstructures becomes costly when many related cases must be evolved over long times. We introduce PINN-Phase, a physics-informed neural time integrator that advances the full multiphase field from its initial condition and enforces phase bounds and unit sum at every step; on the reported explicit multiphase-field benchmarks, post-initial-condition reference states serve only for evaluation. Without case-specific tuning, a single trained 25-grain model meets all predefined criteria in seven of eight unseen microstructures fixed before evaluation and in both stress cases, with 0.94-3.71% terminal grain-label disagreement across the ten cases. Each 12,000-step rollout takes about 5.2 min on a single GPU and reaches nearly three times the temporal horizon represented during training. A pre-registered 64-grain model reaches 6.09% disagreement, retaining all 21 reference survivors plus one additional grain; a post-evaluation continuation with a doubled training horizon and 25 additional epochs reaches 3.97% and the exact survivor set. In three dimensions, one trained 16-grain 96^3 model recovers the exact terminal active set and all three extinction identities in six of six unseen microstructures, five of which meet the complete predefined qualification. These results demonstrate structurally admissible long-horizon prediction and prospective initial-condition transfer within fixed benchmark families.", "url": "https://arxiv.org/abs/2608.29413", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Seifallah Elfetni"}, {"name": "Peter H. Seeberger"}, {"name": "Theodore Tyrikos-Ergas"}], "featured_authors": [{"name": "Seifallah Elfetni"}, {"name": "Peter H. Seeberger"}, {"name": "Theodore Tyrikos-Ergas"}], "author_count": 3}, {"id": "2608.29586", "category": "cond-mat", "title": "Solid and Quasi-Solid Electrolytes for Zinc Batteries: Balancing Water Activity, Ion Transport, and Interfaces", "abstract": "Zinc batteries offer a compelling route to safe and low-cost energy storage, yet their reliance on aqueous electrolytes promotes hydrogen evolution, corrosion, cathode dissolution, and non-uniform zinc deposition. Replacing the liquid with a solid or quasi-solid electrolyte can suppress these processes, but it also removes the medium that enables rapid Zn2+ transport and conformal electrode contact. This tension, the price of removing water, has been obscured by inconsistent use of the term solid state and by comparisons based largely on bulk ionic conductivity. Here we critically examine zinc electrolytes across a continuum from water-rich hydrogels to dry polymers, solvated crystals, and inorganic conductors. We distinguish water content from thermodynamic water activity and classify these materials according to phase state, mobile-solvent fraction, and dominant transport mechanism. We show that neither high conductivity nor nominally water-free composition reliably predicts cell performance: electrolyte thickness, Zn2+ transference, interfacial resistance, and evolving contact often determine the practical outcome. Controlled-solvation and hybrid electrolytes therefore provide the most credible near-term path, whereas genuinely solvent-free Zn2+ conductors remain a longer-term scientific target. Progress will require transparent reporting of solvent state and validation using thin electrolytes, realistic electrode loadings, limited zinc excess, and calendar-life testing.", "url": "https://arxiv.org/abs/2608.29586", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Souvik Naskar"}, {"name": "Jiaqian Qin"}, {"name": "Eric Jianfeng Cheng"}], "featured_authors": [{"name": "Souvik Naskar"}, {"name": "Jiaqian Qin"}, {"name": "Eric Jianfeng Cheng"}], "author_count": 3}, {"id": "2608.29676", "category": "cond-mat", "title": "From Freezing to Terminal Packing: A Puzzle and a Paradox", "abstract": "A density-functional theory developed for equilibrium freezing also produces a high-density endpoint close to terminal packing. We revisit the nonlinear Ramakrishnan--Yussouff bifurcation framework and distinguish the first crystalline fold, thermodynamic coexistence, and terminal marginality. At the terminal point, the grand-potential curvature vanishes along the principal finite-wavevector density mode, exactly when the nonlinear self-consistency equation loses stiffness. The construction gives exact close packing for one-dimensional hard rods, a terminal hard-disk packing fraction near 0.8407, and a hard-sphere value near 0.629, close to random close packing. These results identify a finite-wavevector thermodynamic marginality of a metastable liquid continuation, rather than equilibrium freezing or mechanical jamming, and expose a persistent puzzle: why should liquid-state correlations encode the approach to terminal disordered packing across different physical dimensions and systems?", "url": "https://arxiv.org/abs/2608.29676", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Biman Bagchi"}], "featured_authors": [{"name": "Biman Bagchi"}], "author_count": 1}, {"id": "2608.29691", "category": "cond-mat", "title": "Competition between on-site and off-site pairing phases and surface spectra in superconducting wallpaper fermion systems", "abstract": "We theoretically investigate the competition between on-site and off-site pairings in superconducting topological crystalline insulators hosting wallpaper fermions, a class of surface states protected by nonsymmorphic symmetries. In-plane nearest-neighbor pair hopping stabilizes the $\\mathrm{A_{1u}}$ phase, while off-site pairing channels yield additional dominant phases with $\\mathrm{B_{2u}}$ and $\\mathrm{E_u}$ representations. We further show that the $\\mathrm{B_{2u}}$ pairing state supports the hybridization between wallpaper-fermion spectra themselves, whereas a representative time-reversal-invariant nematic $\\mathrm{E_u}$ state exhibits spectral hybridization between wallpaper fermion and double Majorana Kramers pairs, yielding twisted surface energy spectra. These results demonstrate that the twisted dispersions arising from hybridization phenomena persist in the presence of off-site pairing interactions.", "url": "https://arxiv.org/abs/2608.29691", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kaito Yoda"}, {"name": "Ai Yamakage"}], "featured_authors": [{"name": "Kaito Yoda"}, {"name": "Ai Yamakage"}], "author_count": 2}, {"id": "2608.29710", "category": "cond-mat", "title": "Phase Diagram and Critical Behaviour of the Two-Dimensional Potts Model with Long-Range Quenched Disorder", "abstract": "We study the phase diagram and critical properties of the $q = 3$ and $q = 8$ Potts models with spatially correlated disorder governed by a power-law decay with exponent $a$. Building on the phase diagram proposed by Chippari et al. [3], where a transition from finite-disorder to infinite-disorder fixed points was identified as a function of a, we refine this picture by using wrapping probabilities of Fortuin-Kasteleyn clusters. Furthermore, using magnetic observables, we clarify the physical origin of the double-peak structure in the magnetic susceptibility and establish the validity of the hyper-scaling relation across all investigated regimes.", "url": "https://arxiv.org/abs/2608.29710", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rodolfo Rocha"}, {"name": "Leticia F. Cugliandolo"}, {"name": "Marco Picco"}], "featured_authors": [{"name": "Rodolfo Rocha"}, {"name": "Leticia F. Cugliandolo"}, {"name": "Marco Picco"}], "author_count": 3}, {"id": "2608.29724", "category": "cond-mat", "title": "Harnessing the skyrmion Hall effect for low-power skyrmion transport in a tubular synthetic antiferromagnet", "abstract": "We show that optimal control can turn the skyrmion Hall effect from a source of typically unwanted transverse motion into a mechanism for reducing Ohmic losses in skyrmion transport. We consider a pair of antiferromagnetically coupled skyrmions confined to a tubular geometry, where their relative transverse displacement becomes a periodic internal coordinate. The skyrmion Hall effect drives this coordinate, while finite interlayer coupling makes the resulting relation between applied current and longitudinal velocity nonlinear, allowing different current protocols to produce the same prescribed average velocity. We determine which of these protocols minimizes Joule heating. Depending on the interlayer coupling and spin-transfer-torque parameters, the optimal current is either constant, with the skyrmion pair maintaining a fixed relative position, or time dependent, with the pair undergoing periodic relative motion around the tube. In either case, the additional internal degree of freedom created by the skyrmion Hall effect and interlayer coupling enables skyrmion transport at a lower power than in the uncoupled limit.", "url": "https://arxiv.org/abs/2608.29724", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ivan P. Miranda"}, {"name": "Grzegorz J. Kwiatkowski"}, {"name": "Jacob J. Mankenberg"}, {"name": "Cecilia M. Holmqvist"}, {"name": "Igor S. Lobanov"}, {"name": "Valery M. Uzdin"}, {"name": "Pavel F. Bessarab"}], "featured_authors": [{"name": "Ivan P. Miranda"}, {"name": "Grzegorz J. Kwiatkowski"}, {"name": "Jacob J. Mankenberg"}, {"name": "Igor S. Lobanov"}, {"name": "Valery M. Uzdin"}, {"name": "Pavel F. Bessarab"}], "author_count": 7}, {"id": "2608.29742", "category": "cond-mat", "title": "Emergent Pair Density Wave and Incoherent Metallic State in a Strongly Correlated Doped System", "abstract": "We investigate the dynamical emergence of a state driven by the interplay between antiferromagnetism (AFM) and singlet $d$-wave superconductivity (SC) within a slave-rotor mean-field framework. By decomposing the electron into charge and spin degrees of freedom, the formalism captures strong-correlation effects beyond conventional mean-field approaches. A PDW order is found to emerge dynamically in the coexistence region of AFM and SC. The AFM-SC coexistence region is significantly modified with correlation, leading to a systematic shift of the tetra-critical point. The doping and temperature evolution of the AFM, SC, and PDW order parameters, together with the rotor condensate amplitude $\\phi$, which characterizes charge coherence, shows a crossover from a coherent to an incoherent metal with the suppression of coherent quasi-particle spectral weight. Moreover, in the AFM + $(\\phi \\neq 0)$ region, coherent quasi-particle bands coexist with incoherent Hubbard-like excitations, whereas only incoherent spectral features survive in the AFM + $(\\phi = 0)$ regime. The SC phase exhibits nodal quasi-particles consistent with $d$-wave pairing.", "url": "https://arxiv.org/abs/2608.29742", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Soham Maiti"}, {"name": "Nandan Pakhira"}, {"name": "A. Taraphder"}], "featured_authors": [{"name": "Soham Maiti"}, {"name": "Nandan Pakhira"}, {"name": "A. Taraphder"}], "author_count": 3}, {"id": "2608.29778", "category": "cond-mat", "title": "Phonon-Localization-Driven Decoupling of Dual-Channel Transport for Record-Low Intrinsic Lattice Thermal Conductivity", "abstract": "A fundamental bottleneck in pushing the intrinsic lattice thermal conductivity of inorganic crystalline solids to its lowest limit arises from the inherent competition between the particle-like propagation (\\(\\kappa_{\\mathrm{L}}^{\\mathrm{P}}\\)) and wave-like tunneling (\\(\\kappa_{\\mathrm{L}}^{\\mathrm{C}}\\)) channels. Herein, we demonstrate that phonon localization provides a robust pathway to decouple the dual-channel transport, achieving record-low \\(\\kappa_{\\mathrm{L}}\\) in quasi-1D ternary helical crystals. Despite the structural complexity leading to densely populated phonon branches and thus inducing abundant coherent phonons, the weak interchain interactions and heavy elements compress numerous branches into highly localized, nearly dispersionless flat bands. Such strong localization simultaneously suppresses both the diagonal and off-diagonal components of the group velocity, thereby synergistically suppressing \\(\\kappa_{\\mathrm{L}}^{\\mathrm{P}}\\) and \\(\\kappa_{\\mathrm{L}}^{\\mathrm{C}}\\). Taking InSeI as an example, the interchain room-temperature \\(\\kappa_{\\mathrm{L}}^{\\mathrm{P}}\\) and \\(\\kappa_{\\mathrm{L}}^{\\mathrm{C}}\\) are 0.145 and 0.053 W/mK, respectively, yielding an ultralow total \\(\\kappa_{\\mathrm{L}}\\) of 0.198 W/mK. Weaker interchain interactions further drive the room-temperature \\(\\kappa_{\\mathrm{L}}\\) of GaSeI and AlSeI to record lows of 0.086 and 0.089 W/mK, respectively; these values even drop to 0.058 and 0.059 W/mK at 900 K. These findings provide useful insights into exploring the thermal conductivity limit in crystals.", "url": "https://arxiv.org/abs/2608.29778", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhunyun Tang"}, {"name": "Xiaoxia Wang"}, {"name": "Jin Li"}, {"name": "Chaoyu He"}, {"name": "Chao Tang"}, {"name": "Mingxing Chen"}, {"name": "Tao Ouyang"}], "featured_authors": [{"name": "Zhunyun Tang"}, {"name": "Xiaoxia Wang"}, {"name": "Jin Li"}, {"name": "Chao Tang"}, {"name": "Mingxing Chen"}, {"name": "Tao Ouyang"}], "author_count": 7}, {"id": "2608.29792", "category": "cond-mat", "title": "Thermal Hall Signatures of Distinct Schwinger-Boson Flux Sectors on the Honeycomb Lattice", "abstract": "Thermal transport offers a bulk probe of charge-neutral excitations in frustrated magnets. It remains challenging, however, to determine whether such transport can distinguish different parton mean-field structures of the same spin system. This question is particularly relevant on the honeycomb lattice, where distinct $0$-flux, $\\pi$-flux, and chiral $\\pi/2$-flux sectors have been proposed. In this paper, we compare self-consistent saddle-point solutions in these three sectors for a frustrated $J_1-J_2$ Heisenberg model with a next-nearest-neighbor Dzyaloshinskii-Moriya interaction and a perpendicular magnetic field. Using finite-temperature Schwinger-boson mean-field theory and the Kubo formula for bosonic Bogoliubov-de Gennes systems, we evaluate the intrinsic spinon thermal Hall conductivity. At a common parameter point where all three branches remain gapped, the $0$-flux response is positive and the $\\pi$-flux response is negative for $D>0$ and $h>0$ under the sign conventions used in this paper, whereas the $\\pi/2$-flux response changes sign with increasing temperature. We further show that a projective symmetry combining a sixfold rotation with time reversal forces the zero-field response of a fixed chiral $\\pi/2$-flux domain to vanish. Within the mean-field regime examined in this paper, the sign and temperature dependence of $\\kappa_{xy}/T$ therefore provide a flux-sensitive transport signature.", "url": "https://arxiv.org/abs/2608.29792", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daiki Sasamoto"}], "featured_authors": [{"name": "Daiki Sasamoto"}], "author_count": 1}, {"id": "2608.29807", "category": "cond-mat", "title": "Branching stochastic mechanics. I. Clustering and connected correlations within a branching-process representation of the Schrödinger equation", "abstract": "Can finite-range correlations hide in the statistics of an extended quantum state? The Schrödinger-Nagasawa transform represents the wave function by positive forward and backward diffusion fields whose product is the Born density. We promote them to branching superprocesses, \\(\\Phi_F\\) and \\(\\Phi_B\\): diffusion samples stochastic paths, whereas Bohm/Fisher-controlled branching generates genealogies of alternative continuations. With rates evaluated on the prescribed Born density, their means reproduce Schrödinger dynamics exactly. The connected sector exhibits supercritical, critical, and subcritical clustering in confinement and has critical dimension \\(d_c=2\\) in free space. Stationary eigenmodes remain extended; subcritical clusters acquire the reduced de~Broglie scale. We then let the branching rate respond to the fluctuating product \\(\\Phi_F\\Phi_B\\). In the reciprocal basis, the fields equal a smooth reference \\(R\\) plus centered fluctuations \\(\\psi_F,\\psi_B\\), defining the signed kernel \\(C_{\\rm FB}(x,y)=\\mathbb E_\\omega[\\psi_F(x)\\psi_B(y)]\\). On the anticorrelated branch, \\(\\rho_{\\rm BSM}(x)=-C_{\\rm FB}(x,x)\\) is the positive paired density. Stationary recovery requires its diagonal to match the Born profile, while off-diagonal decay defines the correlation range. The pair equation splits into collective and relative sectors: spectral cancellation selects the Born collective mode, while suppression of the leading density fluctuation selects the anticorrelated source channel. With relative diffusivity \\(D_{\\rm eff}\\) and positive relaxation rate \\(\\mu_{\\rm FB}\\), correlations have screening length \\(\\xi_{\\rm FB}=\\sqrt{D_{\\rm eff}/\\mu_{\\rm FB}}\\). Thus an extended Born density and a finite correlation range can coexist in one stochastic kernel, suggesting particle-like organization.", "url": "https://arxiv.org/abs/2608.29807", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Eric Dumonteil"}, {"name": "Benoît Bischoff"}, {"name": "Alain Letourneau"}, {"name": "Loïc Thulliez"}, {"name": "Corentin Doutre"}], "featured_authors": [{"name": "Eric Dumonteil"}, {"name": "Benoît Bischoff"}, {"name": "Alain Letourneau"}, {"name": "Loïc Thulliez"}, {"name": "Corentin Doutre"}], "author_count": 5}, {"id": "2608.29810", "category": "cond-mat", "title": "Pseudo Entropy in Quantum Spin Chains: from Integrability to Chaos", "abstract": "In this work, we study pseudo entropy and spectral dynamics in quantum spin chains (Heisenberg XXZ model and the mixed-field Ising model) to investigate whether they can serve as diagnostics of quantum chaos. First, we derive an exact relation between the real part of the thermal pseudo entropy and the spectral form factor. This provided evidence that pseudo entropy could exhibit the characteristic dip, logarithmic ramp, and plateau, implying the precise manner in which pseudo entropy probes chaos. We found that the imaginary part, while it does not diagnose chaos, can still provide crucial information about Fisher zeros that is not available in the real counterpart. For spatial pseudo entropy in the XXZ chain, we find that the logarithmic critical scaling persists in both integrable and chaotic regimes, and that the non-positivity conjecture holds. Finally, we derive an exact connection between pseudo entropy, relative pseudo entropy, and spectral complexity with a potential connection to holography.", "url": "https://arxiv.org/abs/2608.29810", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tara Bahadur Rana"}, {"name": "Yadav Raj Dahal"}, {"name": "Kiran Adhikari"}], "featured_authors": [{"name": "Tara Bahadur Rana"}, {"name": "Yadav Raj Dahal"}, {"name": "Kiran Adhikari"}], "author_count": 3}, {"id": "2608.29830", "category": "cond-mat", "title": "Ballistic-to-Localized Dynamics as Signature of Quantum Phase Transition in Josephson Junction", "abstract": "Using state-of-the-art numerical techniques, we investigate how quantum phase fluctuations and quasiparticle tunneling shape the behavior of a small-capacitance Josephson junction across Ohmic, sub-Ohmic, and super-Ohmic dissipation regimes. We show that increasing the Ohmic dissipation strength drives a Berezinskii-Kosterlitz-Thouless quantum phase transition at thermodynamic equilibrium. Deviations from Ohmic behavior profoundly alter this scenario: the super-Ohmic regime exhibits no phase transition, whereas the sub-Ohmic regime displays a continuous second-order transition, consistent with the universality classes of the spin-boson model. Within the Ohmic regime, real-frequency linear-response calculations reveal that the phase particle does not undergo the commonly assumed diffusive-to-localized crossover. Instead, finite resistance progressively suppresses the singular zero-frequency response, producing a ballistic-to-localized change in the dynamics. At finite frequencies, coupling to the environment generates a long-lived excitation in the charge response, which evolves into a resonance as the subgap and shunt resistances are reduced.", "url": "https://arxiv.org/abs/2608.29830", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "F. G. Capone"}, {"name": "A. de Candia"}, {"name": "G. Di Bello"}, {"name": "V. Cataudella"}, {"name": "R. Fazio"}, {"name": "N. Nagaosa"}, {"name": "C. A. Perroni"}, {"name": "G. De Filippis"}], "featured_authors": [{"name": "F. G. Capone"}, {"name": "A. de Candia"}, {"name": "G. Di Bello"}, {"name": "N. Nagaosa"}, {"name": "C. A. Perroni"}, {"name": "G. De Filippis"}], "author_count": 8}, {"id": "2608.29915", "category": "cond-mat", "title": "Symmetry-Enforced Topological Structures in Quantum Phase Diagrams", "abstract": "We study the topological structure of the quantum phase diagram of gapped systems by identifying the noncontractibility of loops, so-called $S^1$-families, within the gapped phase diagram in which many-body Hamiltonians can have nontrivial ground-state degeneracy. We manifest the role of symmetries in such $S^1$-family classifications by the exotic symmetry interplay: (i) nontrivial mixed anomalies, (ii) semi-direct product relation between the spontaneously broken and the unbroken symmetries, and (iii) symmetry with noninvertible operators. We find that such structures lead to the novel $S^1$-family classifications inaccessible by earlier classifications based on ``independent'' symmetries. Furthermore, we construct lattice realizations of these $S^1$-families and explicitly demonstrate their novel algebraic structures.", "url": "https://arxiv.org/abs/2608.29915", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Linhao Li"}, {"name": "Yuan Yao"}], "featured_authors": [{"name": "Linhao Li"}, {"name": "Yuan Yao"}], "author_count": 2}, {"id": "2608.29991", "category": "cond-mat", "title": "Asymmetry-controlled resonant transport in a Brownian flashing ratchet", "abstract": "We investigate directed transport in a one-dimensional Brownian flashing ratchet with a piecewise-linear asymmetric periodic potential. Numerical solutions of the Fokker--Planck equation and Brownian dynamics simulations reveal a nonmonotonic dependence of the stationary current on the switching frequency, with a resonant maximum whose position depends on the potential asymmetry $\\delta$ and barrier height $\\Delta$. For moderate asymmetry, $|\\delta|<0.5$, the current obeys a scaling form that separates the dependence on the potential parameters from a common frequency dependence, resulting in a data collapse upon appropriate scaling of the current and frequency. The current amplitude varies linearly with $\\delta$, while the resonance frequency follows $\\nu(\\delta,\\Delta)=\\nu_0(\\Delta)/ [1-b_0\\, \\delta^2]$. We interpret the resulting $(1-\\delta^2)^{-1}$ scaling in terms of coupled relaxation along the two branches of the asymmetric potential, which provides a physical basis for the observed dependence of the resonant frequency on the potential asymmetry.", "url": "https://arxiv.org/abs/2608.29991", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sudipta Mandal"}, {"name": "Dipanjan Chakraborty"}, {"name": "Debasish Chaudhuri"}], "featured_authors": [{"name": "Sudipta Mandal"}, {"name": "Dipanjan Chakraborty"}, {"name": "Debasish Chaudhuri"}], "author_count": 3}, {"id": "2608.29994", "category": "cond-mat", "title": "Van Hove singularities at the $L$-face of the lutetium nitride phonon dispersion", "abstract": "We report the structural and vibrational properties of the prototypical 4$f$-filled nonmagnetic member LuN of the lanthanide nitrides, \\textit{Ln}N, with elastic and inelastic neutron scattering data at $4$~K. We find a peak in the generalized density of states which, through input from a DFT+$U$ computation, we ascribe to a van Hove singularity on the fourfold-degenerate $L$-face of the Brillouin zone. This work advances the understanding of phonon dynamics in \\textit{Ln}N beyond the $\\Gamma$-point.", "url": "https://arxiv.org/abs/2608.29994", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "M. Markwitz"}, {"name": "K. Kneisel"}, {"name": "R. G. Buckley"}, {"name": "K. C. Rule"}, {"name": "M. Chegeni"}, {"name": "H. J. Trodahl"}, {"name": "W. F. Holmes-Hewett"}, {"name": "J. D. Miller"}, {"name": "F. Natali"}, {"name": "M. Maddah"}, {"name": "B. J. Ruck"}, {"name": "S. Granville"}], "featured_authors": [{"name": "M. Markwitz"}, {"name": "K. Kneisel"}, {"name": "R. G. Buckley"}, {"name": "M. Maddah"}, {"name": "B. J. Ruck"}, {"name": "S. Granville"}], "author_count": 12}, {"id": "2608.30001", "category": "cond-mat", "title": "Chemical Perspectives on Cuprate Superconductivity: Hole-Protected Spin Dimers as d Wave Cooper Pairs", "abstract": "The observation that the coherence lengths in cuprate superconductors are extremely small motivated us to search for its real-space structure by examining the consequence of hole-doping in CuO4 units in cuprates. We analyzed aggregates of hole-doped CuO4 units that phase-separate from hole-doped CuO2 layers in terms of their segregation-pressure indices defined in this work. Our search suggests that each d-wave Cooper pair is an antiferromagnetically coupled spin dimer protected in an antiferromagnetic hole dimer (AHD), and that the antiferromagnetic chains of AHDs provide channels through which such spin dimers can move collectively without perturbation. Based on these suggestions and their implications, we examined the causes for several seemingly puzzling observations on cuprate superconductors to find that they are naturally explained by the suggestions.", "url": "https://arxiv.org/abs/2608.30001", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Myung-Hwan Whangbo"}, {"name": "Reinhard K. Kremer"}], "featured_authors": [{"name": "Myung-Hwan Whangbo"}, {"name": "Reinhard K. Kremer"}], "author_count": 2}, {"id": "2608.30060", "category": "cond-mat", "title": "Chemical potentials from structure factors: II. Charged multi-component mixtures", "abstract": "The chemical potentials of charged multi-component mixtures are central to electrolyte thermo- dynamics, but remain difficult to compute from atomistic simulations. The S0 method enables computing chemical potentials of mixtures from equilibrium molecular dynamics simulations. Here we extend the S0 method to charged mixtures by combining the composition-space framework developed in Part I: Neutral Multi-component Mixtures with a Coulombic treatment of the small- wavenumber limits of static structure factors. This approach separates thermodynamically relevant neutral composition fluctuations from forbidden macroscopic charge fluctuations, and further ac- counts for charge-neutrality constraints. We use the method to compute the chemical potentials of multiple-halide aqueous salt solutions, elucidating the ion-specific thermodynamic effects. We also calculate the mixing free energies of molten salt mixtures, demonstrating the importance of correctly describing long-wavelength electrostatic correlations.", "url": "https://arxiv.org/abs/2608.30060", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xiaoyu Wang"}, {"name": "Roya Savoj"}, {"name": "Musahid Ahmed"}, {"name": "Bingqing Cheng"}], "featured_authors": [{"name": "Xiaoyu Wang"}, {"name": "Roya Savoj"}, {"name": "Musahid Ahmed"}, {"name": "Bingqing Cheng"}], "author_count": 4}, {"id": "2608.30095", "category": "cond-mat", "title": "Tunable Pathway Selection in Coupled Multistable Snap-Through Systems", "abstract": "Multistable mechanical systems can store and release elastic energy through snap-through instabilities, but controlling transition pathways between stable states remains challenging when multiple routes are accessible. Here, we introduce a two-mass von Mises truss as a general model for studying pathway selection governed by coupled saddle-node bifurcations. The system consists of two coupled snap-through units with geometric imperfections, giving rise to four stable configurations: a fully inverted state, a fully natural state, and two intermediate mixed states. We show that the coupling stiffness reorganizes the quasi-static bifurcation structure and selects among three transition pathways under release: sequential snapping through one mixed state, direct cooperative snapping, or sequential snapping through the other mixed state. Using pseudo-arclength continuation, we track the relevant saddle-node bifurcations and identify the parameter regimes associated with each quasi-static pathway. We then demonstrate that dynamic bifurcation delay provides an additional rate-dependent mechanism for pathway selection. Even when the quasi-static bifurcation structure favours a unique sequential pathway, finite-rate loading delays snap-through beyond the corresponding static saddle-node points and can reorder the snapping sequence of the two units. A local reduction of the coupled dynamics near each saddle-node yields normal forms with coupling-dependent critical points and coefficients. The resulting theory identifies distinct rate-dependent delay laws in the inertia-dominated and overdamped regimes and predicts the critical rate at which the snapping order reverses. These results establish a general mechanics framework for tuning transition pathways in multistable systems through elastic coupling and loading-rate control.", "url": "https://arxiv.org/abs/2608.30095", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Weicheng Huang"}, {"name": "Ke Huang"}, {"name": "Jiaying Zhang"}, {"name": "Mingchao Liu"}], "featured_authors": [{"name": "Weicheng Huang"}, {"name": "Ke Huang"}, {"name": "Jiaying Zhang"}, {"name": "Mingchao Liu"}], "author_count": 4}, {"id": "2608.30117", "category": "cond-mat", "title": "Two-step transient liquid phase bonding of NiTi to Ti-6Al-4V through a NbZrW barrier", "abstract": "Dissimilar joining of NiTi to Ti-6Al-4V (Ti-64) is limited by brittle Ti2Ni formation and degradation of NiTi functionality. A two-step transient liquid phase (TLP) route was developed in which a refractory NbZrW diffusion barrier converts the incompatible couple into two independently bondable interfaces. The barrier plays a different role for each alloy: a reactive substrate for NiTi, dissolving to form a Ti-rich Ni-Ti-Nb liquid that infiltrates its own grain boundaries and is terminated by selective Ti absorption into the barrier; and an inert substrate for Ti-64, joined through contact melting of a sacrificial Cu foil. Both interfaces are fully dense and free of continuous intermetallic layers. In tension, joints spanning both interfaces began transforming at 350 MPa, exhibited a stress plateau to 2.5 global strain (consistent with stress-induced transformation of the NiTi half of the gauge) and failed beyond the plateau at 380-410 MPa. Five load-unload cycles to 460 MPa showed stable superelastic loops with minor ratcheting. These results demonstrate that a diffusion barrier enables dissimilar TLP joining of otherwise incompatible alloys.", "url": "https://arxiv.org/abs/2608.30117", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhaoxi Cao"}, {"name": "Samuel Price"}, {"name": "John P. Reidy"}, {"name": "Ian McCue"}], "featured_authors": [{"name": "Zhaoxi Cao"}, {"name": "Samuel Price"}, {"name": "John P. Reidy"}, {"name": "Ian McCue"}], "author_count": 4}, {"id": "2608.30151", "category": "cond-mat", "title": "Linear stability and viscoelastic response in weakly jammed frictional granular systems", "abstract": "Granular particles typically feature contact friction, which gives rise to various nontrivial properties of granular materials. In this work, we investigate the linear stability of static packings composed of frictional spheres, whose interactions are modeled using the discrete element method. We discuss a key difficulty in properly modeling static friction and address the problem of identifying rattlers. We also explore the spectrum of the energy matrix, which governs the linear viscoelastic response of the system. The intermediate- and high-frequency regimes of the spectrum remain qualitatively independent of both the friction coefficient and the packing fraction.", "url": "https://arxiv.org/abs/2608.30151", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masanari Shimada"}, {"name": "Yusuke Hara"}, {"name": "Shihori Koyama"}, {"name": "Ryohei Seto"}, {"name": "Maria Yokota"}], "featured_authors": [{"name": "Masanari Shimada"}, {"name": "Yusuke Hara"}, {"name": "Shihori Koyama"}, {"name": "Ryohei Seto"}, {"name": "Maria Yokota"}], "author_count": 5}, {"id": "2608.30296", "category": "cond-mat", "title": "Covariant formula for the driving force for interface migration", "abstract": "Interfaces of crystalline materials are strongly affected by the anisotropy of interface energy. A key quantity in this context is the interface stiffness tensor, which characterizes the response of the interface energy to changes in interface orientation and plays a role in determining the driving force for interface migration. The latter is expressible via contraction of the stiffness tensor and interface curvature tensor. Practical computations involving tensors necessarily rely on their individual components. In this work, an explicit component-wise expression is derived for the contraction of the stiffness and curvature tensors, valid in arbitrary coordinate systems. Within this formulation, to get the driving force, the curvature tensor is contracted with the pullback of a stiffness-related tensor - originally defined in three-dimensional Euclidean space - onto the interface manifold. This covariant treatment establishes a physically consistent foundation for three-dimensional computational models involving interface stiffness.", "url": "https://arxiv.org/abs/2608.30296", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Adam Morawiec"}], "featured_authors": [{"name": "Adam Morawiec"}], "author_count": 1}, {"id": "2608.30306", "category": "cond-mat", "title": "Singlet-doub
