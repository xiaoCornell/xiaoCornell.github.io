let transitions and Josephson currents in a superconducting ring with a quantum dot", "abstract": "We investigate the ground state properties of a superconducting ring embedded with a quantum dot (QD) by using a variational wave-function approach. A theoretical formulation for the treatment of the finite-U Anderson impurity coupled with a superconducting ring are presented. We demonstrate singlet-doublet transitions of the ground state for this system with the QD in the mixed valence regime. It is shown that the supercurrent in the superconductor ring shows oscillations with the external enclosed magnetic flux and exhibits abrupt jumps at the singlet-doublet phase transition points.", "url": "https://arxiv.org/abs/2608.30306", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Guo-Hui Ding"}, {"name": "Fei Ye"}, {"name": "Bing Dong"}], "featured_authors": [{"name": "Guo-Hui Ding"}, {"name": "Fei Ye"}, {"name": "Bing Dong"}], "author_count": 3}, {"id": "2608.30324", "category": "cond-mat", "title": "Scalar Spin Chirality from Dissipative Pumping and Lamb Shift Precession", "abstract": "Circulating currents in triangular triple quantum dots reverse repeatedly with bias even at zero magnetic flux and for a real Hamiltonian, a phenomenon whose origin has remained unclear. We show that dissipative tunneling prepares an orbital pseudospin, while virtual charge fluctuations generate a noncollinear Lamb field that rotates it toward the chiral direction. Bias changes their relative orientation and thereby reverses the current. This reservoir-induced orbital Hanle effect converts a nonchiral orbital polarization into scalar spin chirality, which an exact ground-multiplet identity links to the circulating current. Hierarchical-equations-of-motion calculations show that the low-bias reversal survives beyond the second-order weak-coupling description, while the quadratic growth of chirality after a sudden voltage switch identifies precession. More broadly, time-reversal-odd responses can emerge in open quantum systems from the interplay between dissipative state preparation and coherent precession.", "url": "https://arxiv.org/abs/2608.30324", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "YuanDong Wang"}, {"name": "JianHua Wei"}], "featured_authors": [{"name": "YuanDong Wang"}, {"name": "JianHua Wei"}], "author_count": 2}, {"id": "2608.30335", "category": "cond-mat", "title": "Holographic Representations of Topological Quantum Criticality: Emergent Symmetry Approach around the Bott Clock", "abstract": "In this article, we apply the idea of emergent symmetries to construct holographic representations of a broad class of topological quantum critical points (tQCPs) that appear in fermionic classes in the Bott clock. We show explicitly that around the Bott clock, an emergent symmetry $U_{EM}$ exists at a tQCP between different symmetry protected gapped phases with protecting symmetry $G_p$ in $d$ spatial dimensions. This emergent symmetry can be used to construct a $(d+1)$ spatial dimensional lattice model with a properly upgraded symmetry such as $U_{EM}\\times G_p$ or $U_{EM} \\rtimes G_p$, etc. By doubling the degrees of freedom of the adjacent topological class in $d$-dimensions, we successfully show that the $(d+1)$-dimensional lattice models constructed in this way have the desired enlarged symmetry groups that precisely belong to the adjacent topological classes, counterclockwise around the Bott clock. Furthermore, $d$-dimensional boundaries of these $(d+1)$ dimensional lattice models of gapped topological classes are shown to exhibit identical infrared dynamics as the corresponding tQCPs in the $d$-dimensional adjacent topological phases in the Bott clock, with lower symmetries.", "url": "https://arxiv.org/abs/2608.30335", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fan Yang"}, {"name": "Fei Zhou"}], "featured_authors": [{"name": "Fan Yang"}, {"name": "Fei Zhou"}], "author_count": 2}, {"id": "2608.30377", "category": "cond-mat", "title": "Optimal Transport of an Anisotropic Tracer in Dense Active Suspensions", "abstract": "The transport of anisotropic tracers in active fluids exhibits rich dynamical behavior arising from the interplay between particle shape, activity, and steric interactions. We employ Brownian dynamics simulations to investigate the motion of an elliptical tracer immersed in a suspension of active dumbbells. We find that both translational and rotational transport, characterized by the mean-square speed and diffusivity, are enhanced by more than an order of magnitude with increasing area fraction, $\\phi$, of active dumbbells. Notably, tracer motion is enhanced along the major axis relative to the minor axis, with $\\mathrm{v}_{\\parallel}>\\mathrm{v}_{\\perp}$ and $D_{\\parallel}>D_{\\perp}$. Remarkably, both translational and rotational transport exhibit an optimum at an intermediate packing fraction of active dumbbells, with the corresponding transport coefficients decreasing at higher densities. We show that this non-monotonic transport arises from the anisotropic accumulation and aggregation of active dumbbells around the tracer, which control the non-equilibrium force and torque fluctuations. Thus, establish a direct connection between the collective organization of active dumbbells at the tracer surface and its emergent translational and rotational transport.", "url": "https://arxiv.org/abs/2608.30377", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chandranshu Tiwari"}, {"name": "Sunil P. Singh"}], "featured_authors": [{"name": "Chandranshu Tiwari"}, {"name": "Sunil P. Singh"}], "author_count": 2}, {"id": "2608.30402", "category": "cond-mat", "title": "Extending the Pnictide Chemical Space for Photovoltaics", "abstract": "Developing novel and efficient materials that are beyond silicon for photovoltaic (PV) applications is required to meet the upcoming energy needs of our societies. To identify novel candidate materials that can act as PVs, we use first principles calculations to perform a systematic screening of the pnictide chemical space (i.e., nitrides and phosphides). Specifically, we explore three different ternary and quaternary pnictide classes, namely, ABCX$_2$, BB'B\"X$_2$, and A$_4$BX$_2$ (A = Li, Na, or K; B, B', B\" = Ca, Sr, Mg, or Zn; C = Al, Ga, or In; X = N or P), leading to a set of 104 possible pnictide compositions. Based on our evaluations of ground state structures, 0 K thermodynamic stabilities, electronic structures, carrier effective masses, dynamic stabilities, and intrinsic point defect formation energies, we arrive at three promising candidates, namely, NaCaInN$_2$, NaSrInN$_2$, and K$_4$ZnP$_2$. Notably, all the identified candidates are thermodynamically (meta)stable, exhibit direct (or nearest direct) band gaps that are optimal for PV applications, and are resistant to forming several types of point defects. We hope that our first principles driven workflow and the identified candidates will advance the development of novel PV materials and reinvigorate interest in the exploration of pnictides.", "url": "https://arxiv.org/abs/2608.30402", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Avaneesh Balasubramanian"}, {"name": "Gopalakrishnan Sai Gautam"}], "featured_authors": [{"name": "Avaneesh Balasubramanian"}, {"name": "Gopalakrishnan Sai Gautam"}], "author_count": 2}, {"id": "2608.30421", "category": "cond-mat", "title": "d'Q = TdS for Infinitesimal Irreversible Processes: On the Differential Form of the Clausius Inequality", "abstract": "Conventionally, the differential form of the Clausius inequality is adopted for infinitesimal irreversible processes. We show that the correct first-order form for infinitesimal quasi-static irreversible processes is the equality d'Q=TdS rather than d'Q < TdS. This provides a purely thermodynamic proof that internal entropy production is second-order or higher and confirms that entropy remains a well-defined state quantity even when quasi-static irreversible processes are included, without resorting to the Boltzmann relation.", "url": "https://arxiv.org/abs/2608.30421", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hiroshi Shimahara"}], "featured_authors": [{"name": "Hiroshi Shimahara"}], "author_count": 1}, {"id": "2608.30438", "category": "cond-mat", "title": "Evanescent-mode Casimir-Josephson force and gate-controlled resonances in ballistic graphene Josephson junctions", "abstract": "We develop a microscopic scattering theory of the phase-dependent equilibrium mechanical response of a ballistic superconductor-graphene-superconductor Josephson junction. The calculation is based on an energy-dependent Dirac scattering matrix embedded in a normalized Matsubara determinant, so the reported force correction contains the complete Bogoliubov-de Gennes spectrum of the stated ideal model. At charge neutrality the full determinant approaches a closed-form evanescent-mode result proportional to $\\Delta W/L^2$, reaching $2\\ln 2\\,\\Delta W/(\\pi L^2)$ at phase difference $\\pi$ in the zero-temperature short-junction limit. Gate doping produces propagating channels and Fabry-Pérot structure, causing large oscillations and sign reversals of the phase-dependent force correction $\\delta F=F(\\phi)-F(0)$. We distinguish the interband-to-intraband Andreev crossover, controlled by $|\\mu|/\\Delta$, from the evanescent-to-propagating crossover, controlled by $|\\mu|L/(\\hbar v_F)$. Exact real-energy subgap poles obtained from the same energy-dependent scattering matrix are used to diagnose specular/interband and retro/intraband character; these labels are not treated as separately measurable thermodynamic forces in the mixed regime. We also quantify the difference between the complete determinant result and the frozen-scattering short-junction approximation without identifying that difference with a pure continuum force. The resulting gate- and phase-dependent mechanical signal provides a Dirac-material extension of earlier superconductivity-induced mechanical-force proposals.", "url": "https://arxiv.org/abs/2608.30438", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shahrukh Salim"}], "featured_authors": [{"name": "Shahrukh Salim"}], "author_count": 1}, {"id": "2608.30501", "category": "cond-mat", "title": "Polymer Membrane Tensegrity: Inverse Design of Polymer Films Morphing into Freeform 3D Surfaces with Digital Photopatterning Technique", "abstract": "In Metamorphosis of Plants (1790), Goethe traced diverse plant organs to transformations of a common leaf-like structure -- a principle modern mechanics attributes to two material ingredients: non-uniform in-plane strain from differential growth or shrinkage, and spatially patterned stiffness. Here we translate this principle into a synthetic fabrication framework called Polymer Membrane Tensegrity (PMT). A flat elastomeric film swollen with a second monomer is selectively UV-cured through a liquid-crystal display (LCD) photomask in a single-side digital photopatterning step, producing rigid rods embedded in a soft, shrinkable membrane. After the unreacted monomer is extracted with a solvent and the film is dried, the membrane shrinks far more than the rods, generating a ~50% in-plane strain differential and a ~2,000-fold modulus contrast -- conditions under which the contracting membrane is held in tension by mutually unconnected rods, a tensegrity-inspired arrangement within a single film. An origami-based inverse design algorithm computes the rod layout that morphs the film into a prescribed 3D surface. We demonstrate PMT on a dome, a hyperbolic surface, and a gyroid unit cell -- positively and negatively curved targets -- reproducing all three with mean deviations of 1.0-2.1% of the target size; perimeter curve optimization halves the mean deviation of the gyroid. Because patterning occurs on one side only, PMT eliminates the front-to-back alignment demanded by bilayer methods, offering a scalable route from flat polymer films to freeform 3D surfaces.", "url": "https://arxiv.org/abs/2608.30501", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shuto Ito"}, {"name": "Yuta Shimoda"}, {"name": "Haruka Fukunishi"}, {"name": "Mikihiro Hayashi"}], "featured_authors": [{"name": "Shuto Ito"}, {"name": "Yuta Shimoda"}, {"name": "Haruka Fukunishi"}, {"name": "Mikihiro Hayashi"}], "author_count": 4}, {"id": "2608.30511", "category": "cond-mat", "title": "Dynamics of a nanoscale ferromagnetic vortex", "abstract": "We propose a ferromagnetic vortex stabilized by the interfacial Dzyaloshinskii--Moriya interaction (iDMI) and investigate its properties through theoretical analysis and micromagnetic simulations. Our results demonstrate that this vortex can remain stable even in nanoscale ferromagnetic disks with radii below $5\\,\\text{nm}$---far smaller than those of conventional nanodot vortices having about $1\\,\\mu\\text{m}$ radius. We analytically solve the nonlinear equation of motion describing the anharmonic vortex oscillation, and identify the critical frequency that determines the stability of the driven oscillation of the vortex. This nanoscale vortex exhibits conventional properties of microscale vortices, including gyrotropic oscillation and resonance frequency shift under an out-of-plane magnetic field. It also exhibits unconventional behaviors, such as a strongly anharmonic potential, nonlinear oscillations, and a Duffing-oscillator-like response under the external AC bias.", "url": "https://arxiv.org/abs/2608.30511", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jun Seok Seo"}, {"name": "Se Kwon Kim"}], "featured_authors": [{"name": "Jun Seok Seo"}, {"name": "Se Kwon Kim"}], "author_count": 2}, {"id": "2608.30523", "category": "cond-mat", "title": "Chemically Resolved Topological Coordinates Link Structural Dynamics and Configurational Thermodynamics", "abstract": "Atomic coordinates specify a structure, but they do not reveal how chemical connectivity across several length scales relates to atomic motion and configurational energy ordering. We formulate chemically directed persistent homology at four resolutions---complete networks, individual sites, spatial fields, and substitutional arrangements---while retaining the chemical identity and length scale of each connectivity feature. In \\textit{ab initio} molecular dynamics (AIMD) trajectories of $\\delta$- and $\\gamma$-CsPbI$_3$ at five temperatures spanning 500--700 K, the corner-sharing $\\gamma$ network has a lower Pb--I restoring stiffness and permits larger iodide excursions, yet iodide positional correlations decay 2.27 times more slowly and Pb-network topology retains memory 1.63 times longer than in the edge-sharing $\\delta$ phase. Local softness and loss of network memory are therefore distinct. At individual sites, rare $\\gamma$-phase Pb environments with a $\\delta$-like Cs-cage connectivity precede 0.17 $\\mathring{\\mathrm{A}}$ greater Pb displacement over the subsequent 0.5 ps. The same Pb-network coordinate resolves disruption of corner-sharing connectivity across a 2560-atom $\\delta|\\gamma$ boundary. In substituted CsPbI$_3$, compact dopant arrangements undergo greater cooperative host relaxation and lie lower in density-functional-theory (DFT) energy than dispersed arrangements of the same composition. SchNet and Allegro model families with comparable energy errors encode opposite ordering along this coordinate, and 61 of 247 supplied models with errors below 1 meV atom$^{-1}$ on separate test structures reverse the DFT relation. Because relative configurational energies set Boltzmann populations, chemical network topology links structure to physical response and tests whether learned energy models preserve DFT configurational ordering even when their average errors are small.", "url": "https://arxiv.org/abs/2608.30523", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ayush Kumar Pandey"}, {"name": "Abhishek Tewari"}], "featured_authors": [{"name": "Ayush Kumar Pandey"}, {"name": "Abhishek Tewari"}], "author_count": 2}, {"id": "2608.30531", "category": "cond-mat", "title": "Moiré-induced lattice reconstruction at buried atomic interfaces", "abstract": "Atomic reconstruction at twisted two-dimensional interfaces governs many of their emergent optical, electronic, and mechanical properties, including sliding ferroelectricity. Despite recent progress in understanding lattice reconstruction in suspended twisted bilayers, structural changes at van der Waals heterointerfaces between multilayer crystals remain largely unexplored. Here we use multi-slice electron ptychography to non-invasively recover the three-dimensional atomic structure at marginally twisted rhombohedral interfaces between thick transition-metal dichalcogenide crystals. With a position precision of ~3 pm and a depth resolution ~1 nm, we resolve the twist-induced lattice reconstruction field per layer, and the resulting dislocation network at the buried interface. Despite the bulk nature, we observe markedly strong in-plane interfacial reconstruction due to suppression of the out-of-plane bending by outer layers, exceeding predictions from our three-dimensional modelling. Furthermore, we extract the strain tensor evolution during the decay of the reconstruction into the bulk, providing a structural foundation for understanding multi-layer moiré systems.", "url": "https://arxiv.org/abs/2608.30531", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nicholas Clark"}, {"name": "Frederick Allars"}, {"name": "Isaac Soltero"}, {"name": "Wendong Wang"}, {"name": "David Hopkinson"}, {"name": "Hugo de Latour"}, {"name": "James G. McHugh"}, {"name": "William Talbott"}, {"name": "Sam Sullivan-Allsop"}, {"name": "Rongsheng Cai"}, {"name": "Astrid Weston"}, {"name": "Xiao Li"}, {"name": "Gareth Tainton"}, {"name": "Casey K. Cheung"}, {"name": "Francisco Selles"}, {"name": "Alex Summerfield"}, {"name": "Andrey Kretinin"}, {"name": "Christopher S. Allen"}, {"name": "Vladimir Falko"}, {"name": "Sarah J. Haigh"}, {"name": "Roman Gorbachev"}], "featured_authors": [{"name": "Nicholas Clark"}, {"name": "Frederick Allars"}, {"name": "Isaac Soltero"}, {"name": "Vladimir Falko"}, {"name": "Sarah J. Haigh"}, {"name": "Roman Gorbachev"}], "author_count": 21}, {"id": "2608.30539", "category": "cond-mat", "title": "Mass-gap functional determinant approach for mobile Fermi polarons", "abstract": "We extend the functional determinant approach (FDA), previously restricted to static impurities, to the case of finite-mass impurities by using the mass-gap description of Fermi polarons [Phys. Rev. Lett. 135, 193401 (2025)]. The quadratic structure of the mass-gap model enables the exact evaluation of many-body spectra and Ramsey dynamics for mobile impurities. We show that this mass-gap FDA smoothly interpolates between the Fermi-edge singularity for infinitely heavy impurities and the emergence of quasiparticle weight for finite impurity mass. Our results demonstrate that the mass-gap FDA provides a transparent and computationally efficient framework to describe the quantum dynamics of mobile impurities.", "url": "https://arxiv.org/abs/2608.30539", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Emilio Ramos Rodríguez"}, {"name": "Eugen Dizer"}, {"name": "Xin Chen"}, {"name": "Richard Schmidt"}], "featured_authors": [{"name": "Emilio Ramos Rodríguez"}, {"name": "Eugen Dizer"}, {"name": "Xin Chen"}, {"name": "Richard Schmidt"}], "author_count": 4}, {"id": "2608.30566", "category": "cond-mat", "title": "A closed-form theory of charge-regulated electrostatic interactions between anisotropically charged spheres", "abstract": "Proteins and many other colloids carry ionizable surface groups that are both spatially inhomogeneous (patchy) and pH-responsive (charge-regulating). In the description of the electrostatic interactions between such particles, these two aspects are often treated separately, especially from a theoretical perspective. We present a unified, closed-form theory that unites charge regulation and patchiness within the linearized Poisson--Boltzmann approximation. For spherical particles with anisotropic distributions of titratable sites, we derive both the leading-order mean-field interaction energy as well as the Kirkwood--Shumaker fluctuation interaction. The theory exposes a qualitatively new effect between two electroneutral anisotropic particles: proximity-induced charge regulation generates a net monopole, and splits orientational branches that are degenerate in any linear fixed-charge model. The accompanying correction to the interaction energy has no fixed sign---it softens like-charge repulsion but can deepen or create attraction away from the isoelectric point. We benchmark three ingredients of the theory against published results; no existing simulation probes their combination, which would capture the central prediction of the theory. Lastly, we apply the theory to two proteins---lysozyme and $\\alpha$-chymotrypsinogen A---and show that it not only reproduces the measured second virial coefficients reasonably well but also predicts how charge regulation expands the range of pH and screening strength where the protein--protein interaction is attractive.", "url": "https://arxiv.org/abs/2608.30566", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anže Božič"}], "featured_authors": [{"name": "Anže Božič"}], "author_count": 1}, {"id": "2608.30630", "category": "cond-mat", "title": "Effective Hardcore Exclusion Without Exclusion: Two-Species Pair Annihilation Revisited", "abstract": "Reaction-diffusion systems with two species that mutually annihilate through $A+B\\to\\emptyset$ reactions display a slow decay of the total density $\\rho$ which follows an anomalous power law in low dimensions. For hardcore particles in one dimension, this decay follows $\\rho \\sim t^{-1/4}$ under symmetric diffusion and $\\rho \\sim t^{-1/3}$ under asymmetric diffusion without relative bias between the two species. The $t^{-1/3}$ behavior, in particular, has so far been observed exclusively in systems with hardcore exclusion. Here we construct a model of particles without hardcore exclusion that reproduces this same $t^{-1/3}$ scaling. In our model, both species undergo asymmetric diffusion with a rate that depends nonlinearly on the local density, a form of transport that, in the absence of the other species, is superdiffusive and falls into the Kardar-Parisi-Zhang universality class. The scaling behavior of $t^{-1/3}$ occurs when at least one of the two species undergoes asymmetric diffusion induced by microscopic processes involving pairs of particles, while asymmetric processes involving groups of three particles lead to $t^{-1/4}$ scaling associated with symmetric diffusion. This demonstrates that the pair annihilation density decay exponent is not determined exclusively by the transport properties of the isolated particle species.", "url": "https://arxiv.org/abs/2608.30630", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Su-Chan Park"}, {"name": "Foster Thompson"}], "featured_authors": [{"name": "Su-Chan Park"}, {"name": "Foster Thompson"}], "author_count": 2}, {"id": "2608.30645", "category": "cond-mat", "title": "Emergence and suppression of phonon vortices in two-dimensional crystals: Interplay of lattice symmetry, heavy impurities, and shear", "abstract": "Phonon vortices are vortex-like displacement fields that appear in the vibrational modes of two- dimensional materials. Here, we demonstrate that these vortices arise as symmetry-adapted linear combinations of degenerate planar phonon modes, with the superposition coefficients uniquely de- termined by the lattice point group. This symmetry principle establishes that vortices are intrinsic standing-wave solutions in perfect crystals, requiring neither impurities nor disorder. A heavy mass impurity favors vortex modes over planar modes through stronger resonance-induced frequency soft- ening, whereas shear deformation suppresses vortex modes by breaking rotational symmetry. The competition between these two effects gives rise to a precisely predictable strain threshold. The proposed framework, grounded in symmetry and energy-minimization, provides a useful basis for understanding vibrational topological defects induced by other types of impurities or defects. This study further suggests that defect and shear engineering constitutes an effective tuning strategy for controlling vibrational modes and the associated thermal and mechanical properties of crystals.", "url": "https://arxiv.org/abs/2608.30645", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yu-Tian Zhang"}, {"name": "Deng Pan"}, {"name": "Yuliang Jin"}], "featured_authors": [{"name": "Yu-Tian Zhang"}, {"name": "Deng Pan"}, {"name": "Yuliang Jin"}], "author_count": 3}, {"id": "2608.30665", "category": "cond-mat", "title": "Terahertz Control of Optical Second-Harmonic Generation in Displacive Ferroelectrics: Electronic Bloch-State Reconstruction", "abstract": "Optical second-harmonic generation (SHG) is a powerful probe of ferroelectric order, yet its microscopic origin and dynamical control are often understood primarily from symmetry considerations rather than from the underlying electronic processes. Here, we develop a microscopic theory of terahertz-controlled optical SHG in displacive ferroelectrics, establishing a direct connection between THz-driven polar lattice distortions and the resulting electronic nonlinear optical response. Starting from a complete Bloch-band representation, we show that an inversion-breaking lattice distortion reconstructs electronic Bloch wave functions, modifies optical dipole matrix elements, and activates nonlinear optical pathways that are forbidden in the centrosymmetric structure. We derive the second-order susceptibility in terms of the distortion-induced reconstruction of electronic states and optical transition matrix elements, and demonstrate that the electronic SHG susceptibility is linear in the polar distortion, $\\chi^{(2)}({\\bf Q})\\propto{\\bf Q}$, leading to an SHG intensity quadratic in the inversion-breaking order parameter. When the polar mode is coherently driven by a terahertz electric field, the resulting time-dependent lattice distortion dynamically reconstructs the electronic states and thereby modulates the optical SHG response, with $I_{2\\omega}(t)\\propto|{\\bf Q}(t)|^2$ to leading order. This framework distinguishes the THz-driven lattice dynamics from the electronic interband processes responsible for optical SHG, which is particularly important in insulating ferroelectrics where low-energy carrier dynamics are absent. Our theory thus provides a microscopic bridge between nonequilibrium polar lattice dynamics and ultrafast electronic nonlinear optics.", "url": "https://arxiv.org/abs/2608.30665", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hong-Kui Liu"}, {"name": "Zi-Chen Qin"}, {"name": "Jun-Song Wu"}, {"name": "Yue Yuan"}], "featured_authors": [{"name": "Hong-Kui Liu"}, {"name": "Zi-Chen Qin"}, {"name": "Jun-Song Wu"}, {"name": "Yue Yuan"}], "author_count": 4}, {"id": "2608.30670", "category": "cond-mat", "title": "Active Brownian Dynamics from a Hamiltonian Model: Transitioning from Equilibrium to Activity", "abstract": "We introduce a Hamiltonian Active Brownian Particle (HABP) model that connects equilibrium dynamics with the non-equilibrium, two-dimensional overdamped behavior of standard Active Brownian Particles (ABPs). In equilibrium, the system follows overdamped Langevin equations that strictly satisfy the fluctuation-dissipation theorem. Coupling translational and rotational degrees of freedom to separate heat baths ($T_{\\theta} > T_{\\textrm{tr}}$), drives the system out of equilibrium. In free space, matching the diffusion coefficients yields quantitative agreement with the ABP model in the limit $T_\\theta/T_{\\textrm{tr}}\\to \\infty$, whereas in a harmonic potential, this matching is recovered even at finite temperature ratios. Entropy production analysis demonstrates that in the ABP limit, all energy injected by the swim force dissipates into the translational bath, leaving the rotational bath as a zero-cost entropy source. These insights provide the first steps toward equilibrium-inspired descriptions of active matter, facilitating the development of new theoretical frameworks to study activity-induced fluctuations, transport, and phase behavior in living and non-living soft matter systems far from equilibrium.", "url": "https://arxiv.org/abs/2608.30670", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Antik Bhattacharya"}, {"name": "Smarajit Karmakar"}, {"name": "Jürgen Horbach"}], "featured_authors": [{"name": "Antik Bhattacharya"}, {"name": "Smarajit Karmakar"}, {"name": "Jürgen Horbach"}], "author_count": 3}, {"id": "2608.30746", "category": "cond-mat", "title": "Hartree Fragmentation and Long-Range Pair Networks in Aperiodic Chains", "abstract": "For fermions in a slowly varying aperiodic potential with random interactions $V_{ij}/|i-j|^{\\alpha}$, the potential fixes the resonance supply $N_0 \\propto L^{2-n}/h$. On crossing ${\\alpha}-2n$, wherever Hartree fragmentation is operative, the resonant-object ensemble reconstructs: turning-point runs fragment into clusters whose intrinsic matching law resolves no logarithmic singularity, while isolated wing bonds survive at finite density and restore a reduced logarithm. The scaling $x^{4-2n-{\\alpha}}_{pair} ln{x_{pair}} \\propto h^2/(V t0)$ is unchanged. Random coefficient fluctuations sustain the $R^{-{\\alpha}}$ coupling; uniform ones cancel to $R^{-{\\alpha}-2}$.", "url": "https://arxiv.org/abs/2608.30746", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yogeshwar Prasad"}], "featured_authors": [{"name": "Yogeshwar Prasad"}], "author_count": 1}, {"id": "2608.30761", "category": "cond-mat", "title": "Resonance statistics, Fock-space branching, and long-range pair networks in slowly varying interacting chains", "abstract": "In a slowly varying aperiodic potential $h_i=h\\cos(2\\pi\\beta i^n+\\phi)$ with random power-law density interactions $V_{ij}/|i-j|^\\alpha$, the resonant-object ensemble changes across $\\alpha=2n$, wherever Hartree fragmentation is operative, from isolated two-level bonds to a mixture of fragmented multi-site clusters and isolated wing bonds that survive at finite density, while the pair-resonance scaling $x_{\\rm pair}^{4-2n-\\alpha}\\ln x_{\\rm pair}\\propto h^2/(Vt_0)$ is unchanged~\\cite{letter}. Here we develop the microscopic resonance theory underlying these results, together with its domain of validity. We derive the exact phase-averaged resonance statistics --- the supply $N_0\\propto L^{2-n}/h$, the correlated common-phase comb, and the closed-form Hartree variance --- proving that the interaction leaves the leading supply law unchanged. Exact construction of the resonant Fock-space graph at $L\\le18$ shows that the order-one forward-branching scale $h_{\\rm FB}\\propto L^{2-n}$ carries no giant component: one-step branching and connectivity are inequivalent. We separate the fixed-pair matching law from the shell-averaged $q\\ln(1/q)$ law of the bond ensemble and develop the comb into a mesoscopic shell theory; we map the fragmentation domain, with its support threshold $V_*(\\alpha)$ and the boundary-healing recursion; and we treat the marginal case $\\alpha=2$, where shell and matching marginalities compound into a double logarithm. Three long-range thresholds emerge with distinct meanings --- $\\alpha=1/2$ (the exact variance threshold of the random Fock-space energy and the square-summability boundary of the leading LIOM-dressing estimate), $\\alpha=2n$ (change of the local resonant objects), and $\\alpha=2$ (marginality of the long-range shell sum) --- none of which is, by itself, a localization transition.", "url": "https://arxiv.org/abs/2608.30761", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yogeshwar Prasad"}], "featured_authors": [{"name": "Yogeshwar Prasad"}], "author_count": 1}, {"id": "2608.30802", "category": "cond-mat", "title": "Chiral Color Ice: Exact Local Handedness Constraints and Möbius Zero Modes in Frustrated Magnets", "abstract": "Local constraints govern the low-energy physics of frustrated matter, but familiar ice-type rules constrain flux-like quantities and are insensitive to handedness. Here we show that handedness itself can be imposed as an exact local quantum constraint without selecting an axis in spin space. We construct positive-semidefinite, SU(2)-invariant parent Hamiltonians whose complete zero-energy space on a tetrahedron has a prescribed chirality sign, rather than selecting a particular chiral wave function. For spin-1/2 the local term is a rank-one projector onto a chiral tetrahedral singlet, while for arbitrary spin it factorizes as $B^\\dagger B$ through a singlet-annihilation operator, with a completely characterized kernel given by the span of the globally rotated chiral color-ice states. For coherent states, the same zero-energy condition becomes an $S$-independent nonlinear constraint in which three spin directions determine the fourth through a Möbius transformation; compositions of these maps define constraint holonomies on extended lattices. Connecting the same local constraint in different ways produces qualitatively different collective regimes: corner-sharing lattices retain exponentially large quantum ground-state kernels, with rigorous lower bounds exceeding conventional ice benchmarks; edge-sharing lattices support subdimensional plane or line zero modes; while triangular constructions suppress nonuniform coherent deformations and contain the complete Anderson tower of tetrahedral magnetic order at exactly zero energy. Two inequivalent triangular coverings further show that harmonic zero-mode counting does not determine the size of the quantum kernel. These results establish a tractable setting in which local handedness, nonlinear constraint geometry, and quantum degeneracy can be disentangled and related directly to the connectivity of the constraint network.", "url": "https://arxiv.org/abs/2608.30802", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Péter Kránitz"}, {"name": "Yasir Iqbal"}, {"name": "Karlo Penc"}], "featured_authors": [{"name": "Péter Kránitz"}, {"name": "Yasir Iqbal"}, {"name": "Karlo Penc"}], "author_count": 3}, {"id": "2608.30809", "category": "cond-mat", "title": "Kinetic temperatures and inertial effects in a nonequilibrium bead-spring model", "abstract": "We investigate a nonequilibrium steady-state model consisting of two coupled beads with arbitrary masses in contact with two thermal baths at different temperatures. Using a covariance-matrix approach together with numerical simulations of the underdamped Langevin dynamics, we characterize steady-state probability distributions, heat transport, and entropy production. We show that irreversibility measures such as entropy production and heat current are invariant under an exchange of the bead masses, whereas energy-storage observables depend explicitly on the mass arrangement in a symmetrical set up. This reveals a fundamental distinction: energy observables exhibit path dependence in singular mass limits, while transport and irreversibility remain well defined. We show that kinetic temperatures provide the natural variables governing the thermodynamics of the system: their difference controls transport and entropy production, while their sum determines the mean energy via a model specific generalized equipartition relation. In the infinite-mass limit, only constitutive relations expressed in terms of kinetic temperatures remain meaningful. Thus, energy, transport, and irreversibility are unified through kinetic temperatures as the organizing variables. We also derive an effective temperature that defines an equilibrium-like canonical distribution. Finally, we analyze the notion of ergodicity and show that the time-averaged observables converge significantly faster than the ensemble averages.", "url": "https://arxiv.org/abs/2608.30809", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jetin E Thomas"}, {"name": "Ramandeep S. Johal"}], "featured_authors": [{"name": "Jetin E Thomas"}, {"name": "Ramandeep S. Johal"}], "author_count": 2}, {"id": "2608.30849", "category": "cond-mat", "title": "Inertia-Driven Information Flow and Symmetry Breaking in a Nonequilibrium Two-Bead System", "abstract": "We investigate information-flow generation in a nonequilibrium two-bead system coupled to two heat baths. We show that the system acts as an information-flow generator in both overdamped and underdamped regimes, with the underdamped dynamics revealing a divergence of the scaled information flow along specific paths in the thermal asymmetry--inertia parameter space that is hidden in the overdamped limit. This information generation suggests a possible route toward information engines and demon-like mechanisms in nanomachines. A symmetry-perturbation analysis of the response landscape of information flow reveals a geometric structure reminiscent of a Ginzburg--Landau framework: the symmetric reference state can correspond to a minimum or maximum depending on the perturbation direction, while the flat overdamped landscape develops a finite curvature under inertia. Mass asymmetry shifts the resulting maxima, and Hessian eigenvalue and eigenvector analysis reveals level touching of principal modes and bimodality along a constant-diffusion path. These results establish a minimal framework for understanding how inertia and microscopic heterogeneity shape information landscapes in nonequilibrium systems, with potential extensions to more complex heterogeneous networks.", "url": "https://arxiv.org/abs/2608.30849", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jetin E. Thomas"}, {"name": "Ramandeep S. Johal"}], "featured_authors": [{"name": "Jetin E. Thomas"}, {"name": "Ramandeep S. Johal"}], "author_count": 2}, {"id": "2608.30863", "category": "cond-mat", "title": "Self-Diffusion of Water through Thermally Activated Membranes", "abstract": "Diffusion processes involving membranes are of fundamental importance in both science and technology, since membranes serve as selective interfaces that regulate the transport of mass, charge, and information across multiple length and time scales. In this study, we employ molecular dynamics (MD) simulations to calculate the self-diffusion coefficient, tetrahedral order parameter and hydrogen-bond (HB) lifetime of SPC/E water over a wide high-temperature range in the presence of thermally activated membranes (TAMs). These membranes exhibit thermally controlled stochastic behavior that locally influences particle dynamics by probabilistically inducing elastic scattering events as particles traverse the membrane. The stochastic behavior of the membranes is governed by a sigmoidal profile, which depend on the reduced temperature of the system. The effective activation energy for diffusion is estimated for several membrane configurations. It is found that the diffusion coefficients generally decrease with an increase in the number of membranes and are in reasonable agreement with the Arrhenius approximation at high temperatures. Additionally, both the tetrahedral order parameter and the HB lifetime are only locally sensitive to the action of the membranes.", "url": "https://arxiv.org/abs/2608.30863", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Carlos Handrey A. Ferraz"}], "featured_authors": [{"name": "Carlos Handrey A. Ferraz"}], "author_count": 1}, {"id": "2608.30886", "category": "cond-mat", "title": "Signatures of inter-sideband coherence in the resonance fluorescence spectrum of an acoustically-modulated quantum dot", "abstract": "We theoretically investigate the inter-sideband phase coherence within the resonance fluorescence spectrum of an acoustically modulated quantum dot using a filtered-field formalism for a Mach-Zehnder configuration. We demonstrate that geometric slant of the interferograms provides an indicator of phase coherence that is resilient to environmental white noise. Specifically, noise-induced spectral diffusion reduces the global fringe intensity, while leaving the characteristic inclination strictly invariant. Our findings establish a framework for verifying single-photon coherence between spectral sidebands, essential for frequency-bin encoding and scalable quantum networking in realistic, noisy solid-state architectures.", "url": "https://arxiv.org/abs/2608.30886", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rafał A. Bogaczewicz"}, {"name": "Hubert J. Krenner"}, {"name": "Paweł Machnikowski"}], "featured_authors": [{"name": "Rafał A. Bogaczewicz"}, {"name": "Hubert J. Krenner"}, {"name": "Paweł Machnikowski"}], "author_count": 3}, {"id": "2608.30918", "category": "cond-mat", "title": "Anomalous temperature dependence in phase transitions via ballistic coalescence", "abstract": "We study kinetics of phase transitions within a single component Lennard-Jones model. For low enough particle densities disconnected clusters form that can move ballistically in an inviscid vapor background. The clusters undergo sticky collisions, thereby forming larger aggregates, which can be of fractal nature at ultra cold temperatures. As the temperature is varied, the exponent of the algebraic growth of average cluster mass changes, exhibiting pronounced nonmonotonic character. We capture this anomalous behavior, in two and three space dimensions, within a ballistic aggregation theory. We show that the scope of the theory is much broader than the typically considered case where cluster motions are uncorrelated. An analysis of the theory shows that ballistic aggregation can even occur exponentially fast. This is in sharp contrast with the conventional algebraic picture, regarding passive matter phase transitions. We discuss scenario where such explosive growth can be realized. In addition, our results are widely relevant in understanding structure and growth in aerosols, cosmic dust and other aggregation processes.", "url": "https://arxiv.org/abs/2608.30918", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nalina Vadakkayil"}, {"name": "Sutapa Roy"}, {"name": "Jiarul Midya"}, {"name": "Subir K. Das"}], "featured_authors": [{"name": "Nalina Vadakkayil"}, {"name": "Sutapa Roy"}, {"name": "Jiarul Midya"}, {"name": "Subir K. Das"}], "author_count": 4}, {"id": "2608.30921", "category": "cond-mat", "title": "Breakdown of Charge-Conjugation Symmetry of Disclinations in 2D Crystals", "abstract": "Disclinations are elementary topological defects in two-dimensional (2D) crystalline membranes, yet their elastic properties remain largely unexplored. Using atomistic simulations, we address the energetics, morphology, and interactions of disclinations in free-standing graphene, a prototypical 2D crystal. We find that while disclinations with positive topological charges follow an expected behavior, negative disclinations exhibit sublinear energy scaling with charge as well as equilibrium shape that deviates sharply from the conventional saddle ansatz. This breakdown of charge-conjugation symmetry leads to qualitatively distinct interactions: positive disclinations repel, whereas negative disclinations display a robust long-range attraction. These trends are shown to be further amplified by self-adhesion in folded membranes. Our results uncover a fundamentally different energetic landscape for negative curvature defects and provide a basis for understanding the stability, self-folding behavior, and defect-driven morphology of graphene and other 2D membranes.", "url": "https://arxiv.org/abs/2608.30921", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ruslan Yamaletdinov"}, {"name": "Mikhail I. Katsnelson"}, {"name": "Oleg V. Yazyev"}], "featured_authors": [{"name": "Ruslan Yamaletdinov"}, {"name": "Mikhail I. Katsnelson"}, {"name": "Oleg V. Yazyev"}], "author_count": 3}, {"id": "2608.30931", "category": "cond-mat", "title": "Stoner contributions to the magnon equation of motion", "abstract": "From linear response theory, we derive the equation of motion for Landau-damped magnon quasi-particles in absence of spin-orbit coupling. The derivation is based on a minimal set of assumptions, namely that the transverse magnetic susceptibility is diagonalized by one collective eigenmode per magnetic atom in the unit cell, and that the spectrum of each collective eigenmode is dominated by a single magnon resonance. The resulting equation of motion leads to a natural definition of the exchange interaction as the restoring force acting on the collective mode magnetization near equilibrium. In addition to magnetic exchange, the magnon equation of motion also contains a damping term and a dispersive quasi-particle mass, both originating from the electron-magnon coupling. The effect of these terms is illustrated for a prototypical itinerant ferromagnet, where they redshift the magnon dispersion and reduce the magnon lifetime as the magnon enters the Stoner continuum. By further assuming wave vector independence of the collective magnon subspace, the magnon equation of motion becomes atomistic with well defined magnetic sites. For real materials, one can approximate the magnon coupling constants using an arbitrary level of band theory for the dynamic transverse magnetic susceptibility.", "url": "https://arxiv.org/abs/2608.30931", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Thorbjørn Skovhus"}, {"name": "Patrik Thunström"}], "featured_authors": [{"name": "Thorbjørn Skovhus"}, {"name": "Patrik Thunström"}], "author_count": 2}, {"id": "2608.30941", "category": "cond-mat", "title": "Compensation in continuous symmetric trilayered planar ferrimagnet", "abstract": "The trilayered (A-B-A type) anisotropic (single site) XY magnetic model is considered with the intra-plane ferromagnetic and the inter-plane antiferromagnetic interactions. The equilibrium properties of such trilayered anisotropic XY system has been studied by Monte Carlo simulation with Metropolis single spin (randomly chosen) update algorithm. In a given range of interaction parameters, the system has been found to exhibit the high temperature {\\it critical} (vanishing sublattice magnetisations and total magnetisation) and low temperature {\\it compensation} (vanishing total magnetisation even for non-vanishing sublattice magnetisations) behaviours. The compensation temperature and the critical temperature both are found to increase with the increase of single site anisotropy. The comprehensive phase diagram is drawn. The finite size study reveals the growth of correlations near the critical temperature.", "url": "https://arxiv.org/abs/2608.30941", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Olivia Mallick"}, {"name": "Muktish Acharyya"}], "featured_authors": [{"name": "Olivia Mallick"}, {"name": "Muktish Acharyya"}], "author_count": 2}, {"id": "2608.30981", "category": "cond-mat", "title": "Particle-Mediated Tuning of Defect Stability in Lamellar Block Copolymer Systems", "abstract": "We study how colloidal inclusions modify the formation energy of dislocation pairs in lamellar block copolymer systems. Using a hybrid particle/Ginzburg--Landau model, we calculate defect formation energies by comparing defect-free and defect-containing states with and without embedded colloids. Finite-size scaling is used to obtain formation energies in the thermodynamic limit. The effect of colloid insertion depends strongly on particle sizes and surface patterning. Homogeneous particles increasingly stabilize dislocation pairs with increasing particle sizes. Particles larger than one lamellar domain preferentially occupy the dislocation cores, where they replace strained polymer rather than deforming defect-free lamellae. The magnitude of this stabilization depends on surface affinity. Balanced Janus particles instead increase the formation energy, because their competing surface preferences cannot be satisfied simultaneously near the curved core. Varying the patch ratio interpolates between these limits. Surface patterning has little effect for particles smaller than one lamellar domain but changes the formation energy by several tens of $k_BT$ for larger particles. These results provide quantitative guidelines for controlling topological defect stability in lamellar block copolymer systems.", "url": "https://arxiv.org/abs/2608.30981", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Le Qiao"}, {"name": "Daniel A. Vega"}, {"name": "Friederike Schmid"}], "featured_authors": [{"name": "Le Qiao"}, {"name": "Daniel A. Vega"}, {"name": "Friederike Schmid"}], "author_count": 3}, {"id": "2608.30994", "category": "cond-mat", "title": "Intercoupling of Segregation and Rheology in Spatially Developing Granular Chute Flows", "abstract": "We investigate the flow and segregation of binary granular mixtures with density differences down a long chute using a continuum framework that couples a particle-force-based segregation model with an inertial-number-based local rheology. The steady-state momentum and convection-diffusion-segregation equations are solved simultaneously, explicitly accounting for the two-way coupling between segregation and flow. Predicted concentration and velocity fields at different streamwise locations are validated against representative DEM simulations. The validated model is then used to examine the influence of density ratio, mixture composition, and chute inclination on segregation over a wide range of conditions. The chute length required to achieve fully developed segregation is quantified and compared with the development length for monodisperse granular flow. At low density ratios and/or low inclinations, segregation develops over much longer distances than the velocity field. In contrast, at higher inclinations and larger density contrasts, the two length scales become comparable, demonstrating that neglecting flow development can significantly underestimate segregation evolution.", "url": "https://arxiv.org/abs/2608.30994", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Soniya Kumawat"}, {"name": "Sayeedul Islam Sheikh"}, {"name": "Satyabrata Patro"}, {"name": "Vishal Singh"}, {"name": "Anurag Tripathi"}], "featured_authors": [{"name": "Soniya Kumawat"}, {"name": "Sayeedul Islam Sheikh"}, {"name": "Satyabrata Patro"}, {"name": "Vishal Singh"}, {"name": "Anurag Tripathi"}], "author_count": 5}, {"id": "2608.31019", "category": "cond-mat", "title": "A MOF-reinforced self-foaming sponge for mechanically robust triboelectric membranes with improved resistance to humidity", "abstract": "Porous triboelectric materials offer significant potential for enhancing the performance of triboelectric nanogenerators, yet their practical application is limited by structural instability and humidity-induced performance degradation. In this work, a bio-derived, sustainable polyamide containing disulfide linkages was developed to enable spontaneous formation of a porous dielectric without external templating. Hydrophilic MOF fillers comprising HKUST-1 crystals are incorporated within the porous matrix to reinforce the membrane structure and regulate moisture effects. Mechanical characterization demonstrates that HKUST-1 suppresses pore collapse and improves structural robustness under repeated deformation, while analysis of stress-strain behaviour reveals the critical role of pore stability in achieving stable triboelectric output. In addition, HKUST-1 mitigates humidity-induced charge dissipation by confining water molecules within its framework, giving enhanced triboelectric output stability and reduced performance degradation under increasing relative humidity compared to the neat porous system. This work demonstrates a strategy that integrates self-foamed porous structures, sustainable polymer design, and functional filler reinforcement to engineer mechanically robust and environmentally stable triboelectric systems.", "url": "https://arxiv.org/abs/2608.31019", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tianhuai Xu"}, {"name": "Pavel Kulyabin"}, {"name": "Fatih Uzun"}, {"name": "Alejandra Sophia Lozano-Pérez"}, {"name": "Ketan Pancholi"}, {"name": "Amit Kumar"}, {"name": "Jin-Chong Tan"}], "featured_authors": [{"name": "Tianhuai Xu"}, {"name": "Pavel Kulyabin"}, {"name": "Fatih Uzun"}, {"name": "Ketan Pancholi"}, {"name": "Amit Kumar"}, {"name": "Jin-Chong Tan"}], "author_count": 7}, {"id": "2608.31114", "category": "cond-mat", "title": "Overcoming critical slowing down in frustrated spin systems by learned multiscale sampling", "abstract": "Cluster algorithms, such as the Swendsen--Wang and Wolff methods, are among the most successful MCMC methods for mitigating critical slowing down in statistical systems. These constructive cluster algorithms, however, fail in the presence of even extremely weak frustration. Here, we sidestep this fundamental limitation by learning rather than constructing the relevant clusters. Specifically, we use the wavelet conditional renormalization group (WCRG) sampling method to learn the probability distribution of collective fluctuations of a frustrated two-dimensional soft-spin model. Configurations are then generated recursively from coarse to fine scales by sampling conditional wavelet distributions. The WCRG method reproduces the main statistical properties of the system across different phases, including the local-field distribution and the structure factor. At an Ising-like critical point, the conditional dynamics remains decorrelated within $\\mathcal{O}(1)$ sweeps at each scale, yielding an overall sampling complexity of $\\mathcal{O}(\\log_2 L)$, thus making WCRG much more efficient than standard local MCMC methods. These results show that learned multiscale sampling can overcome critical slowing down in frustrated systems for which conventional cluster algorithms fail. By assessing the sampling accuracy of different observables, we also clarify the main tradeoff of the WCRG method: the accuracy of the fast sampling scheme depends on the expressiveness of the energy-based model used to estimate the wavelet conditional distributions.", "url": "https://arxiv.org/abs/2608.31114", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gabriele Bandini"}, {"name": "Giulio Biroli"}, {"name": "Patrick Charbonneau"}, {"name": "Andrea Gambassi"}], "featured_authors": [{"name": "Gabriele Bandini"}, {"name": "Giulio Biroli"}, {"name": "Patrick Charbonneau"}, {"name": "Andrea Gambassi"}], "author_count": 4}, {"id": "2608.28736", "category": "hep-th", "title": "Reimagining Gravity: Generalized Symmetries, Double Copy, and Spinning Black Holes", "abstract": "General relativity is a century-old subject. Yet modern explorations through generalized symmetries, scattering amplitudes, and effective field theory have raised open problems, motivating a reassessment of conventional views on gravitation, spacetime, and spin. First, do generalized symmetries exist in dynamical gravity as a low-energy EFT? Second, is there a field-theoretic explanation for the tree-level double copy relationship between general relativity and Yang-Mills theory? Third, what are the exact equations of motion or Lagrangians of four-dimensional spinning black holes in external fields, in point-particle effective theory? In this dissertation, three different perspectives on gravity are developed to shed light on each of these puzzles. In Part I, we view gravity as a gauge theory of Lorentz group to establish a one-form symmetry of dynamical gravity. In Part II, we investigate how far gravity can be viewed as a gauge theory of diffeomorphisms, in connection with color-kinematics duality and double copy. In Part III, we view four-dimensional gravity as a nonlinear interaction between self-dual and anti-self-dual parts. We apply this view to the derivation of four-dimensional spinning black hole solutions as well as their dynamics in point-particle effective theory. First, we derive a new self-dual black hole metric from classical double copy and show that the Kerr metric represents a pair of self-dual and anti-self-dual Taub-NUT solutions, elevating the Newman-Janis algorithm to a rigorous derivation. Second, we propose a dynamical probe counterpart of Newman-Janis algorithm. We give a Lagrangian derivation of spinning black hole Compton amplitudes that exhibit correct factorizations and are free of spurious poles for all helicity configurations while developing a chiral formalism that manifests and maximally utilizes the simplicity of the self-dual sector.", "url": "https://arxiv.org/abs/2608.28736", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Joon-Hwi Kim"}], "featured_authors": [{"name": "Joon-Hwi Kim"}], "author_count": 1}, {"id": "2608.28741", "category": "hep-th", "title": "Carroll-Cotton Tensors and Gravitational Radiation at Null Infinity", "abstract": "We provide a first-principles definition of Cotton tensors on conformal Carroll geometries by gauging the conformal Carroll algebra. On the mathematical side, this analysis yields a conformally covariant object designed to quantify deviations from conformal flatness in Carrollian geometries. On the physical side, it offers a powerful geometric tool to describe gravitational radiative degrees of freedom at the conformal boundary of four-dimensional asymptotically flat spacetimes. Unlike the Bondi news, whose fully-covariant definition requires amendment by supplementary data that we identify with the Geroch tensor, the Carroll-Cotton tensors offer the natural geometric objects to quantify deviations from stationarity due to the emission of gravitational waves.", "url": "https://arxiv.org/abs/2608.28741", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Adrien Fiorucci"}, {"name": "Simon Pekar"}, {"name": "P. Marios Petropoulos"}, {"name": "Matthieu Vilatte"}], "featured_authors": [{"name": "Adrien Fiorucci"}, {"name": "Simon Pekar"}, {"name": "P. Marios Petropoulos"}, {"name": "Matthieu Vilatte"}], "author_count": 4}, {"id": "2608.28743", "category": "hep-th", "title": "OPE and correlation functions in a generally covariant form", "abstract": "In this paper we consider some general aspects of Euclidean conformal field theories on curved spaces of dimension $D\\ge 3$. We first look at the OPE of scalar primary fields on conformally flat spaces. Extending the results of \\cite{Konechny:2026bqg}, we give a general construction of the descendants' contributions to the OPE in the scalar channel. We then discuss CFTs on non-conformally flat spaces in the ambient space formalism. We investigate the short-distance behaviour of three-point functions on such spaces using the general ansatz proposed by Parisini, Skenderis, and Withers \\cite{Parisini:2022wkb, Parisini:2023nbd}. We find that some additional corrections need to be added to the ansatz to ensure the existence of a local covariant OPE.", "url": "https://arxiv.org/abs/2608.28743", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arpit Das"}, {"name": "Anatoly Konechny"}, {"name": "Naveen Balaji Umasankar"}], "featured_authors": [{"name": "Arpit Das"}, {"name": "Anatoly Konechny"}, {"name": "Naveen Balaji Umasankar"}], "author_count": 3}, {"id": "2608.28751", "category": "hep-th", "title": "Holographic warped CFTs from General Relativity on AdS$_3$", "abstract": "We introduce a new set of boundary conditions for three-dimensional Einstein gravity with negative cosmological constant. The canonical generators plainly realize the semidirect sum of Virasoro and $u(1)$ Kac-Moody algebras in its standard form, without the need of additional redefinitions of the global charges. We show that requiring Euclidean BTZ and thermal AdS$_3$ to be diffeomorphic precisely induces the warped modular $S$-transformation of the chemical potentials. The corresponding warped Cardy formula then exactly reproduces the Bekenstein-Hawking entropy, where the ground state is identified as Euclidean AdS$_3$. An explicit comparison with the boundary conditions of Brown-Henneaux and Compere-Song-Strominger is also addressed.", "url": "https://arxiv.org/abs/2608.28751", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kristiansen Lara"}, {"name": "Ricardo Troncoso"}], "featured_authors": [{"name": "Kristiansen Lara"}, {"name": "Ricardo Troncoso"}], "author_count": 2}, {"id": "2608.28942", "category": "hep-th", "title": "Action-angle variables and phase space formulation of Hermitian matrix models", "abstract": "We develop a phase space description of large $N$ Hermitian one matrix models directly from the recursions satisfied by the orthogonal polynomials. In the one-cut phase, the recursion lattice naturally gives rise to a semiclassical action-angle pair, which can be mapped canonically to eigenvalue and momentum variables. We show that the resulting momentum profile is determined by the density of zeros of the orthogonal polynomials, and that the same phase space structure is reproduced from the Wigner transform of the Christoffel-Darboux projector and from the planar spectral curve. The Gaussian model provides a simple consistency check of the proposal. We then extend the construction to the symmetric quartic two-cut phase, where a period-two Jacobi recursion produces two Bloch bands and two disconnected phase space components with actions given by the partial 't Hooft couplings. Finally, we outline the finite-gap generalization appropriate to multicut phases.", "url": "https://arxiv.org/abs/2608.28942", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arghya Chattopadhyay"}], "featured_authors": [{"name": "Arghya Chattopadhyay"}], "author_count": 1}, {"id": "2608.29169", "category": "hep-th", "title": "Flat connections on moduli spaces I: Local (1,0)-extension of the DHS connection", "abstract": "The flat DHS connection $\\mathcal J_{\\mathrm{DHS}}$ constructed in arXiv:2602.01461 is smooth on the configuration space of $n$ points on a fixed compact Riemann surface $\\Sigma$ of arbitrary genus $h$, takes values in an infinite-dimensional Lie algebra $\\hat{\\mathfrak t}_{h,n}$ and is invariant under the modular group $\\mathrm{Sp}(2h,\\mathbb Z)$. This paper is the first in a series for a program whose goal is to extend the connection $\\mathcal J_{\\mathrm{DHS}}$ to a global flat connection on the Teichmüller space $\\mathcal T_{h,n}$ valued in the Lie algebra of derivations of $\\hat{\\mathfrak t}_{h,n}$. Upon the choice of local coordinates adapted to the map $\\mathcal T_{h,n}\\to \\mathcal T_h$, such a connection splits into three pieces: $\\mathcal J_{\\mathrm{DHS}}$, a piece $\\mathcal L$ corresponding to holomorphic directions of $\\mathcal T_h$ and a third piece corresponding to anti-holomorphic directions in $\\mathcal T_h$. In this paper, we isolate the system of equations satisfied by $\\mathcal L$ and obtain its solution locally and explicitly. The construction of a global extension of $\\mathcal J_{\\mathrm{DHS}}$ to $\\mathcal T_{h,n}$ and the extension of the meromorphic connection of arXiv:1112.0864 to $\\mathcal T_{h,n}$, are relegated to future publications in this series.", "url": "https://arxiv.org/abs/2608.29169", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Eric D'Hoker"}, {"name": "Benjamin Enriquez"}, {"name": "Oliver Schlotterer"}, {"name": "Federico Zerbini"}], "featured_authors": [{"name": "Eric D'Hoker"}, {"name": "Benjamin Enriquez"}, {"name": "Oliver Schlotterer"}, {"name": "Federico Zerbini"}], "author_count": 4}, {"id": "2608.29213", "category": "hep-th", "title": "One-loop renormalization group flow of the translation-invariant noncommutative Yukawa theory", "abstract": "We study the one-loop renormalization group flow of the translation-invariant noncommutative pseudoscalar Yukawa theory on four-dimensional Euclidean Moyal space. The two inequivalent orderings of the Moyal-star Yukawa vertex give rise to two independent couplings $g_{1}$ and $g_{2}$, whose beta functions form a coupled nonlinear system; every one-loop divergence is absorbed by a counterterm already present in the action, establishing one-loop renormalizability of the theory. We solve the one-loop system analytically: it decouples in the variables $u=g_{1}^{2}+g_{2}^{2}$ and $v=g_{1}^{2}-g_{2}^{2}$, the quartic coupling is obtained by a Riccati reduction on the symmetric surface $g_{1}=g_{2}$, and the generic asymmetric flow is reduced to a single quadrature by the exact invariant $\\mathcal{I}=(g_{1}g_{2})^{3}/(g_{1}^{2}-g_{2}^{2})^{4}$. Two dynamical consequences follow. The ratio $r=v/u$ has a UV-attractive symmetric surface $r=0$ and IR-attractive asymmetric directions $r=\\pm1$, so that the flow restores the symmetry between the two Moyal orderings towards the ultraviolet and amplifies any initial ordering asymmetry towards the infrared, as a fractional power of the logarithm. In consequence the Yukawa-induced coefficient of the non-planar $1/(\\theta^{2}p^{2})$ structure is dynamically suppressed towards $p\\rightarrow 0$; the singularity itself is not removed, and remains the task of the IR-improving term. We also solve the dimensionful sector ($M^{2}$, $m$, $a^{2}$) in closed form on the symmetric critical trajectory, and compare throughout with the commutative theory.", "url": "https://arxiv.org/abs/2608.29213", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Karim Bouchachia"}, {"name": "Smain Kouadik"}], "featured_authors": [{"name": "Karim Bouchachia"}, {"name": "Smain Kouadik"}], "author_count": 2}, {"id": "2608.29329", "category": "hep-th", "title": "Inequalities and Positivity in Modular Flowed Entanglement Entropy", "abstract": "The modular Hamiltonian plays an important role in quantum information theory, quantum field theory, and the AdS/CFT correspondence. In this paper, we study a specific dynamical setup: starting from the tensor product of the reduced density matrices of a reference state, we evolve this product state under the modular flow generated by the reference state itself. We then investigate the resulting change in the entanglement entropy of a given region, which we call the modular entanglement shift (MES). Unlike evolution under a fixed quantum channel, this modular evolution obeys no general principle requiring the MES to have a definite sign. For a bipartition into subsystems A and B, we establish an exact entropy balance: the sum of the MESs for A and B equals the mutual information generated along the orbit. Consequently, their sum is nonnegative, even though either individual shift may be negative. For two disjoint intervals in the vacuum of a two-dimensional conformal field theory, however, we prove that a global conformal involution exchanging the intervals forces the two MESs to be equal. It follows that each MES is nonnegative along the modular flow. We establish this result both using a conformally transported regulator and intrinsically in terms of Araki relative entropy. Finally, we identify the modular-flow orbit with a Connes cocycle orbit and discuss possible applications to the AdS/CFT correspondence.", "url": "https://arxiv.org/abs/2608.29329", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Liangyu Chen"}], "featured_authors": [{"name": "Liangyu Chen"}], "author_count": 1}, {"id": "2608.29402", "category": "hep-th", "title": "Bound States in Perturbative Quantum Gravity with Hydrogen-like Degeneracy", "abstract": "Recent results in the study of gravitational scattering amplitudes indicate that some highly-symmetric relativistic systems may exactly conserve a version of the Laplace-Runge-Lenz (LRL) vector in two-body bound states. We make a systematic study, in the context of a generic EFT of long-range interactions due to the exchange of massless mediator particles of spins 0, $\\frac{1}{2}$, 1, $\\frac{3}{2}$, 2, of the conditions for the conservation of a hidden LRL vector; both classically (no orbital precession) and quantum mechanically (hydrogen-like degeneracy of bound states). The calculations require several new technical developments including the extension of relativistic post-Minkowskian potential matching to quantum corrections and the incorporation of long-range forces due to the exchange of pairs of massless fermions. We find that while classically the absence of precession is a generic property of a large class of models, including Kaluza-Klein theories, with vector and scalar exchanges, maintaining the degeneracy quantum mechanically requires a surprising cancellation between gravitons and 6 Majorana gravitinos, hinting at a special role for $\\mathcal{N}=6$ supergravity.", "url": "https://arxiv.org/abs/2608.29402", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Callum R. T. Jones"}, {"name": "Shruti Paranjape"}, {"name": "Marcos Skowronek"}], "featured_authors": [{"name": "Callum R. T. Jones"}, {"name": "Shruti Paranjape"}, {"name": "Marcos Skowronek"}], "author_count": 3}, {"id": "2608.29541", "category": "hep-th", "title": "Teleparallel formulation of $E_{8(8)}$ Exceptional Field Theory", "abstract": "The potential of $E_{8(8)} \\times \\mathbb{R}^+$ exceptional field theory, suited for studying three-dimensional maximally supersymmetric compactifications of higher-dimensional supergravities, is derived in teleparallel formulation. This means that, starting from an ansatz of the most general combination of the quadratic scalar contractions of the intrinsic torsion, which is manifestly invariant under generalised diffeomorphisms, one selects the potential by imposing the invariance under infinitesimal rotation of the maximal compact subgroup of the duality group. The teleparallel formulation makes manifest at geometric level the preeminent role of the intrinsic torsion in studying compactifications of higher-dimensional supergravities, where the intrinsic torsion is identified with the embedding tensor of the resulting gauged supergravity.", "url": "https://arxiv.org/abs/2608.29541", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Davide Rovere"}], "featured_authors": [{"name": "Davide Rovere"}], "author_count": 1}, {"id": "2608.29594", "category": "hep-th", "title": "Higher-Spin dS/CFT beyond minimal type-A, and the doubled nature of de Sitter space", "abstract": "We study the holographic duality between free vector models and Higher-Spin Gravity in 4-dimensional de Sitter space. On both the bulk and boundary sides, we introduce new reality conditions, which allow us to include odd spins in the bulk, and to extend the duality from type-A to type-B (i.e. from boundary scalars to spinors). The new reality conditions are closely related to a higher-spin-symmetric Hilbert-space norm for the single-particle (super)multiplet in de Sitter space. We construct two alternative viewpoints on the type-A and type-B theories. In one view, the two co-exist in \"parallel universes\", specifically in even vs. odd antipodal identifications of de Sitter space. In the other view, type-A and type-B are Legendre-transformed descriptions of the same twistor-space theory in Euclidean AdS (this involves the observation that the higher-spin partition function is Legendre-dual to itself). In this way, higher-spin holography reconciles the two-boundary nature of de Sitter space with the one-boundary nature of Euclidean AdS. The supersymmetric theory that unifies type-A and type-B with bulk fermions fails to be consistent under the appropriate reality conditions.", "url": "https://arxiv.org/abs/2608.29594", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Julian Lang"}, {"name": "Yasha Neiman"}], "featured_authors": [{"name": "Julian Lang"}, {"name": "Yasha Neiman"}], "author_count": 2}, {"id": "2608.29627", "category": "hep-th", "title": "Genuine Multi-Entropy in Abelian Chern--Simons Theory: Exact Key-Ring Collapse and Its Breakdown for Generic Link States", "abstract": "We study genuine multi-entropy in Abelian $U(1)_k$ Chern-Simons theory. For key-ring link states, where only the linking numbers between one distinguished component $K$ and the remaining $\\mathtt{q}-1$ components are nonzero, we derive an exact closed-form expression for the $\\mathtt{q}$-partite Rényi multi-entropy for general $\\mathtt{q}$, level $k$, and Rényi index $n$. For $\\mathtt{q}=4$, this shows that the genuine multi-entropy $\\mathrm{GM}^{(4)}_n$ collapses exactly onto the tripartite information $I_{3,n}$ for all $n$, while for $\\mathtt{q}=5$ it is likewise completely determined, for all $n$, by a linear combination of tripartite and bipartite Rényi multi-entropies. We then go beyond the key-ring class and study general four-component link states with arbitrary pairwise linking numbers. A numerical scan over Chern--Simons levels $2\\leq k\\leq24$ shows that the all-$n$ collapse found analytically for key-ring states does not survive for generic link states. Remarkably, the collapse remains exact at $n=2$ for every level examined. At $n=3$, violations occur, within the scanned range, only when $3\\mid k$, with a further dependence on the $3$-adic valuation of $k$. At $n=4$ and $n=5$, violations occur for every level examined, with rates that vary strongly with $k$. These results show that the breakdown is not controlled simply by the zero-divisor structure of composite $\\mathbb Z_k$, but instead exhibits a nontrivial joint dependence on the Rényi index and the arithmetic structure of the Chern--Simons level.", "url": "https://arxiv.org/abs/2608.29627", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yen-Cheng Chang"}, {"name": "Kaberi Goswami"}, {"name": "Norihiro Iizuka"}, {"name": "Akihiro Miyata"}], "featured_authors": [{"name": "Yen-Cheng Chang"}, {"name": "Kaberi Goswami"}, {"name": "Norihiro Iizuka"}, {"name": "Akihiro Miyata"}], "author_count": 4}, {"id": "2608.29686", "category": "hep-th", "title": "Latent Geometry and the Emergence of Lorentzian Time in Matrix Quantum Mechanics", "abstract": "We introduce \\emph{latent geometry} in BFSS/BMN models. Before an emergent geometry evaporates at the geometric transition, large-$d$ Gaussianization encodes its information in the exceptional $N=2$ sector selected by the baby fuzzy sphere, a single active spin-$1/2$ Pauli block. Dimensional reduction, finite-$N$ Gaussianization and exact Molien--Weyl projection transport this encoding to mass-deformed BFSS$_2$. At $N=2$, the same stable BFSS$_2$ oscillator admits inequivalent unitary $\\mathbf{H}^2_\\theta=\\mathbf{EAdS}^2_\\theta$ and $\\mathbf{dS}^2_\\theta$ decodings, realizing spacetime transmutation and the emergence of Lorentzian time.", "url": "https://arxiv.org/abs/2608.29686", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Badis Ydri"}], "featured_authors": [{"name": "Badis Ydri"}], "author_count": 1}, {"id": "2608.29688", "category": "hep-th", "title": "One-Loop Fluctuation Response Along a Constrained Noncommutative Modulus in the Lorentzian IIB Matrix Model", "abstract": "We study a local constrained problem at matrix size $N=5$ in the Lorentzian IIB (IKKT) matrix model and numerically continue a one-dimensional physical modulus. For an exact fixed-$Q_\\rho$ constrained solution family, the stationary identity implies constant classical action; the 23 accepted backgrounds realize this relation to the quoted precision. Across the sampled branch, the spectrum of the Lorentzian extent operator remains common to numerical precision while microscopic noncommutative invariants vary. We evaluate finite-dimensional one-loop fluctuations along this branch. At fixed bosonic background, the fermionic Grassmann integral is exact and gives $\\operatorname{Pf}\\mathcal M_F$; its magnitude is invariant under color-gauge and connected proper-Lorentz transformations and varies along the modulus. The complete boson--ghost--fermion quotient measure defines a Lorentz-representative-independent density one-form rather than a scalar potential. Thus quantum fluctuation data distinguish backgrounds unresolved by the coarse quadratic spectrum. We also apply a framed higher-$L$ SO(5) structural probe. At the reference background, the ordered $3+6$ spectral separation is larger at $L=2,3$ than at $L=1$, and larger still in the canonical large-$L$ limit. This is a frame-defined diagnostic, not an intrinsic observable or a higher-$N$ solution. The Pfaffian and higher-$L$ responses are closely correlated along the sampled branch, which we treat only as descriptive. These results suggest that microscopic noncommutative structure and quantum fluctuations may contain information relevant to dimensional dynamics, without establishing dimensional selection.", "url": "https://arxiv.org/abs/2608.29688", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tetsuyuki Muramatsu"}], "featured_authors": [{"name": "Tetsuyuki Muramatsu"}], "author_count": 1}, {"id": "2608.29816", "category": "hep-th", "title": "BMN Spread Complexity Across Phase Transitions", "abstract": "We investigate the dynamical behavior and spread complexity of quantum states within the mass-deformed BMN matrix model equipped with an emergent $U(1)$ global charge at finite temperature $\\beta^{-1}$ and chemical potential $\\nu$. Focusing on the strong-coupling regime ($\\mu \\gg 1$), we model the dynamics via a charged Thermofield Double (cTFD) state and trace the evolution of spread complexity across three distinct thermodynamic regimes. In the low-temperature gapped phase ($\\beta \\mu \\gg 1$), discrete mass-gap bound states dominate, trapping wavepacket dispersion and producing non-chaotic, oscillatory early-time growth. Conversely, in the high-temperature continuum phase ($\\beta \\mu \\ll 1$), thermal excitations overwhelm the mass gap, driving a transition to a continuous advection field that exhibits maximal chaotic scrambling with a Krylov Lyapunov exponent $\\lambda_K = \\pi / \\beta$ that saturates the universal bound. In the intermediate temperature regime ($\\beta \\mu \\sim 1, \\beta \\nu \\sim 1$), the interplay between mass-gap bound states and the continuous thermal background induces a sub-leading correction to the Lanczos coefficients $b_n \\sim \\frac{\\pi}{\\beta} n + \\gamma \\sqrt{n}$, governing a continuous sub-exponential crossover before full chaotic thermalization. Technical derivations regarding KMS boundary conditions, grand canonical spectral moments, residue analysis, and time-reversal symmetry breaking in Krylov space are detailed in four dedicated appendices.", "url": "https://arxiv.org/abs/2608.29816", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dibakar Roychowdhury"}], "featured_authors": [{"name": "Dibakar Roychowdhury"}], "author_count": 1}, {"id": "2608.29879", "category": "hep-th", "title": "The warp factor of supersymmetric $D=11$ near-horizon geometries: single-point rigidity, the $Spin(7)$ perfect square, and globa
