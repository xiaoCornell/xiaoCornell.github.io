l constraints", "abstract": "On a compact connected section ${\\cal S}$ of a supersymmetric $M$-horizon the Killing-spinor bilinears give a pointwise identity relating the warp factor $\\Delta$, the rotation one-form $h$ and the two spinor norms, with nothing assumed about the norm of the Killing spinor. We derive three consequences of that unreduced identity. First, a single-point rigidity theorem: if $\\Delta$ and $h$ vanish at one point of the section, then the flux vanishes identically, ${\\cal S}$ is Ricci-flat and the horizon is $\\mathbb{R}^{1,1}\\times{\\cal S}$. A single point replaces the usual global spinorial hypothesis. Second, the ${\\rm Spin}(7)$ decomposition of the flux fixes $h$ algebraically and exhibits the invariant flux content of the scalar square $\\Delta=4\\Phi^2$ known in an adapted gauge, $\\Delta=\\frac{1}{108}\\|w_{\\bf 7}\\pm\\sigma({\\cal Y}_{\\bf 7})\\|^2$. Only the two ${\\bf 7}$-summands $w_{\\bf 7}$, ${\\cal Y}_{\\bf 7}$ reach the warp factor, and the square is degenerate rather than definite: it vanishes on the linear subspace $w_{\\bf 7}=\\mp\\sigma({\\cal Y}_{\\bf 7})$ rather than at the origin, so positivity of $\\Delta$ yields no case list. Third, the two combine into a pointwise budget: the single constant of supersymmetry is shared between the deviation from staticity and the ${\\rm Spin}(7)$ mismatch of the flux, each bounded by that constant. The same identities characterise the constancy hypothesis, equivalent to $V=-fh$ for the bilinear one-form $V$, which fails on the static branch of known warped $AdS_2$ solutions; they fix a weighted integral of the warp factor; and they reduce the Komar angular momentum of the horizon to a positive bilinear integral. Two no-go statements, for hidden symmetries built from the Killing spinor and for a second isometry from its bilinears, are stated with their hypotheses.", "url": "https://arxiv.org/abs/2608.29879", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Usman Kayani"}], "featured_authors": [{"name": "Usman Kayani"}], "author_count": 1}, {"id": "2608.29931", "category": "hep-th", "title": "Carrollian Wave Equations for Arbitrary Spin: Anyons and the Exotic Particle on the Noncommutative Plane", "abstract": "We construct the Carrollian limit of the Cortés--Plyushchay wave equations for planar anyons, grading the spin-tower components by powers of $c$ and taking the limit at fixed rest energy. The result is a linear system describing Carrollian particles of any real spin --- \\emph{Carrollian anyons} --- and, at (half-)integer spin, Carrollian bosons, fermions and higher-spin fields. The system is a first-order square root of the standard Carroll wave equation $(\\partial_t^2+E^2)\\Phi=0$, whose spectrum consists of two flat branches at plus and minus the rest energy. Scaling the spin along with $c$, in the Carrollian analogue of the Jackiw--Nair limit, yields instead the exotic Carroll algebra, with a second central charge, non-commuting boosts, and observable coordinates spanning a noncommutative plane. We show how the Galilean and Carrollian theories branch from one common similarity transformation: the Galilean limit expels the negative-energy modes, whereas the Carroll limit retains both relativistic branches.", "url": "https://arxiv.org/abs/2608.29931", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mauricio Valenzuela"}], "featured_authors": [{"name": "Mauricio Valenzuela"}], "author_count": 1}, {"id": "2608.30039", "category": "hep-th", "title": "Admissible higher-spin algebras in flat space", "abstract": "We study admissible higher-spin algebras in four-dimensional Minkowski space, namely algebras that admit the tower of massless higher-spin fields as a representation. Under several simplifying assumptions, we show that these can be of two types, which we refer to as collinear and half-collinear. The chiral higher-spin algebra provides an example of the latter. For the collinear ansatz considered here, direct solution of the Jacobi identity yields two families of Lie algebras. We also find an associative collinear algebra, which is commutative unless internal degrees of freedom are added.", "url": "https://arxiv.org/abs/2608.30039", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dmitry Ponomarev"}], "featured_authors": [{"name": "Dmitry Ponomarev"}], "author_count": 1}, {"id": "2608.30160", "category": "hep-th", "title": "From Self-Dual to Physical $\\mathbb{C}P^{N-1}$: Anomalies, Boundary Stokes Phenomenon, and Global Structure of $θ$-vacua", "abstract": "We introduce a two-coupling generalization of $\\mathbb{C}P^{N-1}$ model that continuously interpolates between the self-dual ($\\epsilon=0$) and the physical ($\\epsilon=g$) theories as a useful nonperturbative tool. At $\\epsilon \\neq g$, this model possesses a chiral imbalance, which may be viewed as a real topological deformation (imaginary-$\\theta$). We demonstrate that exact quantum equivalence between first- and second-order formulations strictly requires a topological counterterm sourced by a bosonic chiral anomaly. Solving this deformed theory at large $N$ yields two primary results. First, we analytically determine the nonperturbative vacuum structure of the self-dual theory, a self-dual vacuum with a dynamically generated field-strength condensate. Second, we resolve a fundamental paradox where saddles with $(\\theta + 2\\pi n) \\sim O(N)$ ($n$ is branch number) spuriously yield lower energy densities than the physical ground state. Because the effective action possesses an essential singularity at $F=0$, we show that the Lefschetz thimble analysis must be generalized to include boundary thimbles. A boundary Stokes phenomenon renders the problematic saddles topologically inactive, fully restoring the validity of the large-$N$ expansion for strongly coupled theories.", "url": "https://arxiv.org/abs/2608.30160", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yui Hayashi"}, {"name": "Mithat Ünsal"}], "featured_authors": [{"name": "Yui Hayashi"}, {"name": "Mithat Ünsal"}], "author_count": 2}, {"id": "2608.30349", "category": "hep-th", "title": "Generalised Symmetries, Anomalies, and Maximal Branches of 3d Chern-Simons Matter Theories", "abstract": "The generalised symmetries, 't Hooft anomalies, and their interplay with maximal branches are analysed for linear unitary three-dimensional $\\mathcal{N}\\geq 3$ Chern-Simons Matter quiver theories realised in Type IIB brane configurations. The 1-form symmetry, its self-anomaly and its maximal anomaly-free subgroup are determined independently from Wilson-line screening and from the string lattice. Fractional monopole endpoints of the generating Gukov-Witten defect are used to extract the anomaly data, while centre charges of integer monopoles determine the faithful 0-form symmetry group, its connected cover and possible 2-group structures. Mixed anomalies with non-abelian 0-form factors are found to cancel in the linear unitary theories considered. The effect of 1-form gauging on maximal branches is related to frozen D3-brane sectors, which flow to Chern-Simons TQFTs whose anyonic lines obstruct the required defect endpoint. This yields a criterion for affected branches and implies that at most two can be affected simultaneously. In such a case, a magnetic-quiver extension by non-simply laced edges is proposed, wherein the 1-form symmetry and its mixed anomaly with the branch isometry are reproduced.", "url": "https://arxiv.org/abs/2608.30349", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fabio Marino"}, {"name": "Francesca Pretto"}, {"name": "Marcus Sperling"}], "featured_authors": [{"name": "Fabio Marino"}, {"name": "Francesca Pretto"}, {"name": "Marcus Sperling"}], "author_count": 3}, {"id": "2608.30447", "category": "hep-th", "title": "Examples of Gribov copies in the presence of planar boundaries, and an emergent boundary gauge invariance in Yang-Mills theory", "abstract": "First, we explicitly construct zero-modes of the Yang-Mills Faddeev-Popov operator in the presence of two parallel plates, with either perfect electric (PEC) or perfect magnetic (PMC) boundary conditions imposed. This establishes the existence of Gribov copies with finite action, and even finite L_2-norm, in Yang-Mills theory with non-trivial interfaces. We adapt Henyey's construction, although the boundary configuration imposes extra restrictions on the ansatz for the gauge field. Second, we discuss the phenomenon of an emergent boundary gauge invariance for PEC and PMC plates in Yang-Mills theory. This shall be important when applying the Gribov-Zwanziger procedure to parallel plate setups, of relevance for non-perturbatively studying the non-Abelian Casimir effect in the future.", "url": "https://arxiv.org/abs/2608.30447", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "David Dudal"}, {"name": "Luigi Rosa"}, {"name": "Sebbe Stouten"}], "featured_authors": [{"name": "David Dudal"}, {"name": "Luigi Rosa"}, {"name": "Sebbe Stouten"}], "author_count": 3}, {"id": "2608.30533", "category": "hep-th", "title": "Brane effective actions and their island rule from $T\\overline T$ flows", "abstract": "We derive a $2d$ effective action for semi-classical AdS$_3$ gravity with an EOW brane of arbitrary tension by solving the radial Hamiltonian flow in a derivative expansion. Interpreting the radial flow as an RG flow, the effective theory is identified with a $T\\bar T$-like deformed CFT. This leads us to propose that the holographic dual for semi-classical AdS$_3$ gravity with Neumann or conformal boundary conditions is obtained by setting the $T\\bar T$-like deformed CFT free. We verify our proposal explicitly for saddles corresponding to $(A)dS_2$ branes in empty AdS$_3$. We discuss three useful ways to decompose the effective brane theory into a matter sector ($T\\bar T$-deformed, $T\\bar T$-like deformed, and undeformed CFT, respectively) and a corresponding braneworld gravity sector. In particular, the split into $T\\bar T$-deformed CFT coupled to $T\\bar T$-like deformed Liouville gravity directly extends the Liouville description of the integrated Weyl anomaly into the bulk. The effective action is then used to perform an island-rule calculation for a non-asymptotic brane in an AdS/bCFT set-up, finding exact agreement with the Ryu-Takayanagi result. This extends previous holographic checks on the island rule to non-asymptotic regimes of application, as well as provides a Wald entropy interpretation for $T\\bar T$ entanglement. Finally, we relate our effective theory and its higher derivative corrections to AdS$_3$ gravity with a fluctuating radial cutoff by explicit calculation of the on-shell action.", "url": "https://arxiv.org/abs/2608.30533", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nele Callebaut"}, {"name": "Matteo Selle"}], "featured_authors": [{"name": "Nele Callebaut"}, {"name": "Matteo Selle"}], "author_count": 2}, {"id": "2608.30723", "category": "hep-th", "title": "A Truncated Majorana", "abstract": "We investigate the quantum field dynamics of truncating a Majorana wave packet via a time-dependent channel shutter. Modeling truncation as a controlled modification of chiral propagation rather than a literal spatial cut, we analyze a $1+1$D massless Majorana field subjected to a time-dependent rotation between its chiral components. We demonstrate that this protocol manifests two complementary physical limits. Globally, a mismatch between early- and late-time channel identifications induces a fermionic Bogoliubov transformation. We prove this asymptotic change universally generates an infrared soft-mode memory, $\\beta(\\omega, \\nu) \\propto (\\omega+\\nu)^{-1}$, leading to a logarithmic divergence in the Hilbert--Schmidt norm. This orthogonality-catastrophe-like obstruction persists even under infinitely smooth switching in the massless limit. Conversely, in the number-conserving regime where pair production vanishes, the shutter acts as a purely causal filter. We establish exact local field identities showing that, restricted to the even local observable algebra, the retained sector is exactly equivalent to a single-particle state while the discarded sector reduces to the vacuum. Ultimately, we show that global infrared memory and local causal truncation are complementary diagnostics of the same dynamical operation. These results provide a rigorous field-theoretic foundation for time-dependent control in topological platforms, cleanly separating effective operational benchmarks from microscopic boundary dynamics.", "url": "https://arxiv.org/abs/2608.30723", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ali Vahedi"}], "featured_authors": [{"name": "Ali Vahedi"}], "author_count": 1}, {"id": "2608.30774", "category": "hep-th", "title": "Anomalies and discrete torsion in Type II and Type I worldsheet theories", "abstract": "We provide a comprehensive study of anomalies and discrete torsion in the worldsheet theories of Type II and Type I string theories on a general ten-dimensional target space. In the modern understanding, the anomaly of a worldsheet theory is characterized by an invertible field theory in three dimensions, and invertible field theories are classified by the Anderson dual of a suitable bordism theory. To study the anomaly cancellation condition, we employ the explicit model of the Anderson dual constructed by Yamashita and Yonekura. We find that, for both Type II and Type I string theories, the anomaly of the worldsheet theory is cancelled if and only if the target space is orientable and admits a spin structure. We also determine the discrete torsion and clarify its physical meaning. It includes the distinctions between Type IIA and Type IIB string theories and between ordinary Type I and Sugimoto string theories.", "url": "https://arxiv.org/abs/2608.30774", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masashi Kawahira"}, {"name": "Shotaro Kawanago"}, {"name": "Shota Saito"}, {"name": "Hiroki Wada"}], "featured_authors": [{"name": "Masashi Kawahira"}, {"name": "Shotaro Kawanago"}, {"name": "Shota Saito"}, {"name": "Hiroki Wada"}], "author_count": 4}, {"id": "2608.30852", "category": "hep-th", "title": "Holographic subregion complexity in insulator/superconductor transition", "abstract": "We study holographic subregion complexity (HSC) across a fully backreacted insulator/superconductor transition in an AdS-soliton background and compare it with holographic entanglement entropy (HEE) and holographic complexity based on the complexity=volume (CV) proposal. Both HSC and HEE signal the second-order transition. For a strip subsystem, competing connected and disconnected Ryu-Takayanagi surfaces give rise to a confinement/deconfinement transition. At fixed chemical potential in the superconducting phase, HSC exhibits a finite jump at the critical width, whereas HEE remains continuous. Beyond this width, HSC grows linearly with the strip width, while HEE is constant. At fixed strip width, HSC first decreases and then increases with chemical potential for $\\ell<\\ell_c$, opposite to HEE, but increases monotonically for $\\ell>\\ell_c$. After consistent normalization and subtraction of the respective insulating references, the half-space HSC and CV complexity densities are analytically identical. These results show that HSC can diagnose the insulator/superconductor transition, but its qualitative response remains sensitive to the subsystem scale and entanglement-wedge topology.", "url": "https://arxiv.org/abs/2608.30852", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yu Shi"}, {"name": "Chikun Ding"}, {"name": "Yuebing Zhou"}, {"name": "Weike Deng"}, {"name": "Sheng Long"}], "featured_authors": [{"name": "Yu Shi"}, {"name": "Chikun Ding"}, {"name": "Yuebing Zhou"}, {"name": "Weike Deng"}, {"name": "Sheng Long"}], "author_count": 5}, {"id": "2608.31151", "category": "hep-th", "title": "The large $N$ vector model with angular velocity", "abstract": "We study the free energy of the critical $O(N)$ vector model at large $N$ on $S^{1}\\times S^{2}$ with an angular velocity $\\hat\\mu$ without the singlet constraint. The leading high-temperature behaviour is determined analytically both as an expansion about $\\hat\\mu r=0$ and $\\hat\\mu^{2}r^{2}=1$ where $r$ is the radius of the sphere. We supplement the analytic results with a numerical analysis that agrees with both the analytical expansions in their respective regimes and smoothly interpolates between them. The leading high-temperature contribution to the free energy develops a pole at $\\hat\\mu^{2}r^{2}=1$, in agreement with expectations from the thermal effective field theory. Its residue coincides with that of the massless free theory. Sub-leading terms, however, exhibit non-analytic dependence on the angular velocity and distinguish the critical fixed-point result from the free theory answer. The residue at the pole can also be obtained by placing the $O(N)$ model on the pp-wave geometry. We show that the residue agrees with that obtained from the direct computation.", "url": "https://arxiv.org/abs/2608.31151", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Justin R. David"}, {"name": "Srijan Kumar"}], "featured_authors": [{"name": "Justin R. David"}, {"name": "Srijan Kumar"}], "author_count": 2}, {"id": "2608.31152", "category": "hep-th", "title": "Coarse-grained models for loop quantum gravity and their renormalization", "abstract": "We introduce a family of effective theories and use them to define a specific type of coarse-grained models for canonical loop quantum gravity. Each effective theory is characterized by two parameters and it consists mainly of a Hilbert space of coarse states and an effective Hamiltonian operator. The construction of the coarse Hilbert spaces relies on a systematic coarse-graining procedure for spin network states. The effective Hamiltonians are then obtained from an analysis of the interplay between this coarse-graining procedure and the action of various Hamiltonian operators defined in loop quantum gravity. Finally, we provide a prescription for implementing the Hamiltonian non-perturbative renormalization framework for the coarse-grained models, and we explicitly write down the renormalization flow equations. The aim of this work is to build an arena for studying the emergence of the continuum limit and the derivation of phenomenological models in the context of canonical loop quantum gravity.", "url": "https://arxiv.org/abs/2608.31152", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mehdi Assanioussi"}, {"name": "Martin Zeiß"}], "featured_authors": [{"name": "Mehdi Assanioussi"}, {"name": "Martin Zeiß"}], "author_count": 2}, {"id": "2608.31172", "category": "hep-th", "title": "Superfluid memory effect", "abstract": "We identify a memory effect produced by phonon scattering in a superfluid: a localized scattering event generates a far-field pressure pulse with vanishing time integral but a nonzero first temporal moment, corresponding to a permanent shift in a prepotential for the far-field velocity. The effect is controlled by the soft factor for phonon emission, including corrections from nonlinear dispersion. In superfluid $^4$He, scattering macroscopic phonon wave packets produces a signal whose estimated magnitude may lie within experimental reach, thereby providing a laboratory analogue of electromagnetic and gravitational memory.", "url": "https://arxiv.org/abs/2608.31172", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kristan Jensen"}, {"name": "Alfredo Pérez"}, {"name": "Stefan Prohazka"}], "featured_authors": [{"name": "Kristan Jensen"}, {"name": "Alfredo Pérez"}, {"name": "Stefan Prohazka"}], "author_count": 3}, {"id": "2608.28796", "category": "math-ph", "title": "The $\\mathbb{Z}_2$-Index of a Pair of Pure States and the Topology of Interacting 1D Superconductors", "abstract": "We define a relative $\\mathbb{Z}_2$-index $\\mathcal{N}(\\omega_1,\\omega_2)$ for locally-comparable, parity-invariant pure states on a unital $C^*$-algebra. We prove that the index is well-defined, multiplicative, invariant under parity-preserving automorphisms, and locally constant in the norm topology. For the one-dimensional self-dual CAR algebra, we apply this construction to the half-chain automorphism $\\sigma$ and define the many-body Majorana number $\\mathcal{N}\\sigma(\\omega):=\\mathcal{N}(\\omega,\\omega\\circ\\sigma)$ for parity-invariant $\\sigma$-local pure states. In the quasi-free Hilbert--Schmidt regime, this index agrees with the usual single-body Majorana number. We then introduce symmetric local automorphism paths and prove that $\\mathcal{N}_\\sigma$ completely classifies the resulting automorphic-path-components. This automorphic-path equivalence retains the bulk Majorana number but may forget a relative zero-dimensional parity obstruction.", "url": "https://arxiv.org/abs/2608.28796", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anna Mazhar"}, {"name": "Jacob Shapiro"}], "featured_authors": [{"name": "Anna Mazhar"}, {"name": "Jacob Shapiro"}], "author_count": 2}, {"id": "2608.28917", "category": "math-ph", "title": "Pseudorandomness and Diffraction", "abstract": "Pseudorandom structures are structures that behave like random ones, without necessarily being random themselves. It is a prominent, and evidently very difficult, conjecture that $$ V(n) = \\lambda \\cos \\Big( 2 \\pi \\Big( x_1 + n x_2 + \\frac{n(n-1)}{2} \\alpha \\Big) \\Big) $$ is pseudorandom from a Schrödinger operator perspective in that the Schrödinger operator in $\\ell^2(\\mathbb{Z})$ with potential $V$ displays Anderson localization, that is, pure point spectrum with exponentially decaying eigenfunctions for almost all parameter values --- the same spectral features as those produced by random potentials. We show that $V$ is pseudorandom in terms of its diffraction properties, that is, the associated diffraction measure is purely absolutely continuous for all $\\lambda \\not= 0$, all irrational $\\alpha$, and all $x_1,x_2$ --- which is the case as well for the random case. Our result gives further evidence for the conjecture in the Schrödinger case and it elucidates the apparent dual behavior of Schrödinger spectral measures and diffraction measures.", "url": "https://arxiv.org/abs/2608.28917", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "David Damanik"}, {"name": "Nicolae Strungaru"}], "featured_authors": [{"name": "David Damanik"}, {"name": "Nicolae Strungaru"}], "author_count": 2}, {"id": "2608.29321", "category": "math-ph", "title": "Simulating passive scalar advection in rough Kraichnan flows", "abstract": "We present a systematic Eulerian study of passive scalar advection in rough two-dimensional Kraichnan flows, covering the full range of velocity roughness exponent $h\\in(0,1)$. The advection--diffusion equation is integrated directly using a pseudo-spectral method at resolutions up to $2048^2$ grid points, with a frozen-noise Runge--Kutta scheme consistent with the white-in-time construction of the carrier flow. The simulations recover the duality between advected scalar and advecting flow---the smoother the carrier, the rougher the scalar---together with the predicted scaling laws for the second-order statistics. Once the scaling range is properly identified, the fourth-order flatness anomaly is measured across the whole range of $h$, in agreement with the Lagrangian estimates of Frisch \\textit{et al.} (1999) and with the perturbative predictions of Bernard \\textit{et al.} (1998) and Pumir \\textit{et al.} (1997). Benefiting from the fact that our Eulerian simulations give direct access to the full scalar field, we also examine the probability density functions of scalar increments and the corresponding higher-order statistics, which show systematic departures from Gaussianity and from log-normality, with the strongest deviations manifesting for intermediate values of $h$. A central outcome of this work is a systematic account of how the simulation parameters, in particular the molecular diffusivity, must be adjusted with $h$, providing practical guidelines for reliable simulations; we further show that the residual deviations from the theoretical scaling laws are quantitatively accounted for by the finite spectral representation of the carrier flow. Our analysis also serve as a numerical baseline for simulating more realistic extensions of the Kraichnan model, where the carrier flow is coupled with a Gaussian multiplicative chaos and theoretical developments are limited.", "url": "https://arxiv.org/abs/2608.29321", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Long Li"}, {"name": "André L.P. Considera"}, {"name": "Simon Thalabard"}], "featured_authors": [{"name": "Long Li"}, {"name": "André L.P. Considera"}, {"name": "Simon Thalabard"}], "author_count": 3}, {"id": "2608.29339", "category": "math-ph", "title": "Sharp Logarithmic Quantum Dynamics for Quasiperiodic Schrödinger Operators", "abstract": "Dynamical localization requires all position moments of a quantum wavepacket to remain bounded in time, but for quasiperiodic Schrödinger operators such bounds are generally not uniform in phase. In the positive Lyapunov exponent regime, the best known phase-uniform estimates instead grow on a logarithmic scale. We prove that both the logarithmic scale and the dependence on the moment order are sharp for a class of one-frequency quasiperiodic Schrödinger operators with even potentials. Our main ingredient is a reflective version of semi-uniformly localized eigenfunctions, adapted to the two localization centers forced by a completely resonant phase, from which we obtain matching logarithmic lower bounds along sequences of times.", "url": "https://arxiv.org/abs/2608.29339", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wencai Liu"}, {"name": "Xueyin Wang"}], "featured_authors": [{"name": "Wencai Liu"}, {"name": "Xueyin Wang"}], "author_count": 2}, {"id": "2608.29377", "category": "math-ph", "title": "Simultaneous Reconstructions of (x,t) -Dependent Coefficients and Initial Conditions of Parabolic Equations", "abstract": "This is the first publication, in which an inverse problem of the simultaneous reconstruction of an unknown (x,t) - dependent coefficient and an unknown initial condition in a general linear parabolic equation of the second order is considered. The input data depend on (n+1) variables and are, therefore, formally determined ones. Stability estimates and uniqueness theorem are obtained for this inverse problem. As a by-product, logarithmic stability estimates for initial conditions of parabolic equations and inequalities with time reversed data are obtained for the first time. All known publications about inverse problems for parabolic equations with formally determined input data and unknown coefficients assume that those coefficients depend either only on x or only on t. In addition, the initial condition is assumed to be known, except of two publications cited in the text. The inverse problem of this paper has two potential applications. The first one is in forecasting of public opinions in the framework of the Mean Field Games theory. The second one is in tracking spatiotemporal outbreaks of epidemics.", "url": "https://arxiv.org/abs/2608.29377", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Michael V. Klibanov"}], "featured_authors": [{"name": "Michael V. Klibanov"}], "author_count": 1}, {"id": "2608.29524", "category": "math-ph", "title": "Kubo Formulas and Bulk-Edge Correspondence for Curved Boundaries", "abstract": "Strong topological insulators are classified by integer invariants which admit different real-space expressions. Inspired by recent work studying these invariants for spaces with curved boundaries, we revisit the problem of equivalence of the various expressions, including Fredholm index pairings and Kubo formulas involving half-space projections. Using Roe algebras and a variant of KK-theory suitable for non-separable $C^*$-algebras, we prove a general form of bulk-edge correspondence for the index pairing with a general position-space Dirac operator in the presence of arbitrary boundaries. For spaces coarsely equivalent to $\\mathbb{R}^d$, we show that up to multiplicity, these pairings are equal to those obtained with the standard dual Dirac operator, with the multiplicity explicitly given as the topological degree of the symbol function. In addition, we prove a generalized Kubo formula which computes the general index pairing by a real-space formula.", "url": "https://arxiv.org/abs/2608.29524", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Aren Martinian"}, {"name": "Tom Stoiber"}], "featured_authors": [{"name": "Aren Martinian"}, {"name": "Tom Stoiber"}], "author_count": 2}, {"id": "2608.29645", "category": "math-ph", "title": "A Morse-Family Integrator for Hamilton--Jacobi Dynamics Across Caustics", "abstract": "We develop a geometric framework for implicit discrete Hamiltonian systems based on discrete Morse families, Lagrangian relations, and discrete analogues of Tulczyjew's triple. The main idea is to regard the Lagrangian submanifold defining the discrete dynamics, rather than an explicit symplectic evolution map, as the fundamental geometric object. This viewpoint naturally accommodates implicit, constrained, and degenerate discrete systems. Within this framework, we formulate a Type--II discrete Hamilton--Jacobi theory in terms of the propagation of Lagrangian submanifolds between consecutive discrete steps. When these submanifolds are locally represented by exact one-forms $dW_k$ and $dW_{k+1}$, the resulting equations provide a discrete Hamilton--Jacobi relation between consecutive generating functions. More generally, when the projection onto configuration space becomes singular and a single-valued generating function ceases to exist, we show that the evolution can be described by the composition of Type--II discrete dynamics with Morse families. This yields a generating family for the propagated Lagrangian submanifold without requiring the dynamics to be represented as a graph. As an application, we consider the propagation of optical wavefronts through fold caustics. A Type--II discrete Hamiltonian yields a symplectic ray integrator, while a Morse family represents the multivalued wavefront near the caustic. Their composition provides a discrete propagation rule for the complete Lagrangian manifold across the singularity. In this way, the same geometric construction simultaneously provides a discrete Hamiltonian integrator and a regular representation of multivalued Hamilton--Jacobi solutions.", "url": "https://arxiv.org/abs/2608.29645", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "F. Jiménez Alburquerque"}, {"name": "M. Leok"}, {"name": "C. Sardón"}, {"name": "X. Zhao"}], "featured_authors": [{"name": "F. Jiménez Alburquerque"}, {"name": "M. Leok"}, {"name": "C. Sardón"}, {"name": "X. Zhao"}], "author_count": 4}, {"id": "2608.29874", "category": "math-ph", "title": "Homogeneous attractive Bose-Einstein condensates with repulsive three-body interactions: the one-dimensional case", "abstract": "We investigate the behavior of a homogeneous one-dimensional Bose gas composed of $N$ identical bosons experiencing attractive two-body and repulsive three-body interactions. Utilizing intermediate Hartree theory, we rigorously derive the homogeneous cubic-quintic nonlinear Schrödinger functional as the mean-field limit of the many-body Hamiltonian. Particular attention is given to the impact of the repulsive three-body term on ground state energy estimates and mass concentration properties", "url": "https://arxiv.org/abs/2608.29874", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dinh-Thi Nguyen"}], "featured_authors": [{"name": "Dinh-Thi Nguyen"}], "author_count": 1}, {"id": "2608.29875", "category": "math-ph", "title": "Homogeneous attractive Bose-Einstein condensates with repulsive three-body interactions: the two-dimensional case", "abstract": "We consider a homogeneous Bose gas composed of $N$ identical bosons occupying an infinite two-dimensional space. This gas exhibits both an attractive two-body interaction and a repulsive three-body interaction. Via the intermediate Hartree theory, we rigorously derive the homogeneous cubic-quintic nonlinear Schroedinger functional as the mean-field limit of the model. Our investigation focuses on the system's behavior in relation to the two-body interaction.", "url": "https://arxiv.org/abs/2608.29875", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dinh-Thi Nguyen"}], "featured_authors": [{"name": "Dinh-Thi Nguyen"}], "author_count": 1}, {"id": "2608.29876", "category": "math-ph", "title": "Local Density Approximation and Other Limit Regimes for a Homogeneous Bose Gas with Repulsive Three-Body Interactions in Low-Dimensional Space", "abstract": "In the whole space of low spatial dimensions, namely $d \\leq 2$, we study the minimizers of an energy functional with an attractive cubic nonlinearity and a repulsive quintic nonlinearity, which describes a quantum Bose gas with a two-body attraction and a three-body repulsion. We prove the existence of minimizers at fixed effective statistics parameter. In the limit of a large effective statistics parameter of the mass-critical nonlinearity (with respect to the kinetic energy), we derive an effective Thomas-Fermi-like model for the homogeneous Bose gas. We also consider other limit regimes depending on the mass-critical nonlinearity.", "url": "https://arxiv.org/abs/2608.29876", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Thi Anh Thu Doan"}, {"name": "Dinh-Thi Nguyen"}], "featured_authors": [{"name": "Thi Anh Thu Doan"}, {"name": "Dinh-Thi Nguyen"}], "author_count": 2}, {"id": "2608.29894", "category": "math-ph", "title": "Multiple Nonlinear Waves by (Quantum) Neural Networks: Checking the AI supremacy", "abstract": "To test the potential of so-called quantum physics-informed neural network (QPINN) technology for solving evolutionary partial differential equations, we consider the problem of multiple wave propagation in a weakly nonlinear medium described by the Korteweg-de Vries equation with periodic boundary conditions. Although this problem is solvable analytically, high-genus solutions could represent a rather challenging testbed for numerical methods. Therefore, our idea is to test whether a QPINN is sufficiently mature for application in this context by providing a set of indicators of merit and performing several numerical experiments.", "url": "https://arxiv.org/abs/2608.29894", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Luigi Martina"}, {"name": "Riccardo Caricato"}, {"name": "Riccardo Della Torre"}], "featured_authors": [{"name": "Luigi Martina"}, {"name": "Riccardo Caricato"}, {"name": "Riccardo Della Torre"}], "author_count": 3}, {"id": "2608.30012", "category": "math-ph", "title": "Uniqueness of universal quantum dimensions", "abstract": "We prove, under some assumptions, the uniqueness of universal quantum dimension formulae. We first show that the quantum dimensions of classical algebras have a specific form that can be represented universally, in Vogel's sense, as the product/ratio of q-dimension factors with arguments $a\\alpha+b\\beta+c\\gamma$ where $c=0, 1, 2$ and $a, b$ are integers. On this basis, we derive simple uniqueness criteria, according to which all known universal quantum dimensions are unique.", "url": "https://arxiv.org/abs/2608.30012", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "M. Y. Avetisyan"}, {"name": "R. L. Mkrtchyan"}], "featured_authors": [{"name": "M. Y. Avetisyan"}, {"name": "R. L. Mkrtchyan"}], "author_count": 2}, {"id": "2608.31049", "category": "math-ph", "title": "On the equivalence between the Polchinski flow and the Connes-Kreimer approaches to perturbative renormalisation", "abstract": "We prove a correspondence between the Polchinski flow and the Connes-Kreimer approaches to perturbative renormalisation, in the sense that the first yields the same renormalisation as the latter. More precisely, we show that an ansatz based on decorated graphs (Feynman diagrams),with a combinatorial renormalisation procedure solves the Polchinski equation. This result holds for very general Euclidean quantum field theories. We are able to derive from this the form of the renormalised potential which is, to the best of our knowledge, the most general one in the literature. The main ingredients of the proof are multiple morphism properties with respect to the renormalisation, as well as a novel duality formula for forests of decorated graphs.", "url": "https://arxiv.org/abs/2608.31049", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yvain Bruned"}, {"name": "Paul Laubie"}, {"name": "Aurélien Minguella"}], "featured_authors": [{"name": "Yvain Bruned"}, {"name": "Paul Laubie"}, {"name": "Aurélien Minguella"}], "author_count": 3}, {"id": "2608.31080", "category": "math-ph", "title": "Boundary Quantum Knizhnik-Zamolodchikov Equations and Integrability of Quantum Field Theories with Time-Dependent Bulk and Boundary Coupling Strengths", "abstract": "The generalized Bethe ansatz framework formulated in [P. R. Pasnoori, Phys. Rev. B 112, L060409 (2025)] provides a unified framework to find exact solutions to quantum many-body systems with time-dependent coupling strengths with periodic boundary conditions. In this work we extend this framework to the case of open boundary conditions where in addition to the time-dependent interactions in the bulk, the boundary conditions are explicitly time-dependent. We show that for integrable time-dependent bulk coupling strengths, the generalized Bethe ansatz framework provides the time-dependent boundary conditions compatible with integrability and reduces the time-dependent Schrodinger equation to a set of matrix difference equations called the boundary quantum Knizhnik-Zamolodchikov (BqKZ) equations. The solution to the BqKZ equations provides the explicit form of the exact wavefunction. We further show that the RG invariants of the corresponding static model identify with the dynamical invariants in the time-dependent model.", "url": "https://arxiv.org/abs/2608.31080", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Parameshwar R. Pasnoori"}], "featured_authors": [{"name": "Parameshwar R. Pasnoori"}], "author_count": 1}, {"id": "2608.31090", "category": "math-ph", "title": "Rotating-wave approximation for spin-boson models with structured fields", "abstract": "We derive state-dependent bounds on the difference between two quantum evolutions generated by unbounded Hamiltonians sharing a common form domain. The main technical tool is a second integration by parts, performed at the level of sesquilinear forms rather than at the operator level, which removes the need for a common invariant operator domain. The resulting estimate involves the norm of the time-integrated difference of the two generators, rather than the integral of its norm, and is therefore sensitive to the averaging effects produced by fast-oscillating terms. As an application we prove a quantitative bound on the rotating-wave approximation for spin-boson models with a structured boson field, described by an arbitrary massive dispersion relation on a general measure space and by a suitable class of form factors. The proof involves a careful analysis of the high-frequency scaling. The bound holds on a dense subspace of states, is fully explicit, and all the constants entering it depend only on the parameters of the model and not on the frequency scale, so that the approximation becomes exact in the limit of large frequency.", "url": "https://arxiv.org/abs/2608.31090", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Aitor Balmaseda"}, {"name": "Davide Lonigro"}, {"name": "Juan Manuel Pérez-Pardo"}], "featured_authors": [{"name": "Aitor Balmaseda"}, {"name": "Davide Lonigro"}, {"name": "Juan Manuel Pérez-Pardo"}], "author_count": 3}, {"id": "2608.31104", "category": "math-ph", "title": "The Dunkl two-photon/Schrödinger algebras and their applications", "abstract": "The work introduces the novel Dunkl two-photon and Dunkl-Schrödinger algebras as reflection-extended counterparts of the standard six-dimensional two-photon and Schrödinger algebras. These extensions are realized through the presence of an involutive generator representing a reflection, and they reduce to the undeformed two-photon and Schrödinger algebras in the absence of this additional generator in an appropriate limit. For both algebraic structures, which are shown to be isomorphic, we derive the associated cubic polynomial Casimir invariant. Furthermore, we identify several structurally significant subalgebras and compute their corresponding quadratic Casimir invariants. Representations of the Dunkl two-photon algebra are constructed on the Fock space of the one-dimensional Dunkl harmonic oscillator and subsequently translated into holomorphic realizations within the associated Dunkl-Fock-Bargmann representation. Finally, for the Dunkl-Schrödinger algebra, we present an explicit vector field realization in terms of the Dunkl spatial derivative, while keeping time continuous. When applied to the Casimir invariants of the aforementioned subalgebras, this realization yields a family of six nontrivial Dunkl differential-difference equations in $1+1$ dimensions, including, in particular, a Dunkl version of the well-known heat-Schrödinger equation.", "url": "https://arxiv.org/abs/2608.31104", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Francisco J. Herranz"}, {"name": "Danilo Latini"}], "featured_authors": [{"name": "Francisco J. Herranz"}, {"name": "Danilo Latini"}], "author_count": 2}, {"id": "2608.31147", "category": "math-ph", "title": "Exactly flat bands beyond the chiral limit in Bistritzer--MacDonald Hamiltonians", "abstract": "The chiral limit of the Bistritzer--MacDonald model for twisted bilayer graphene has exactly flat bands at magic angles. We show that exact flatness can persist beyond the chiral limit with nonchiral tunnelling potentials in the usual symmetry class. We construct a family of nonchiral tunnelling potentials for which the Hamiltonian has at least two zero-energy states at every Bloch momentum and for every real value of the nonchiral coupling. This gives a family of counterexamples to Open Problem~3 of Zworski's survey \\cite{ZworskiSurvey}. Conversely, we prove that every admissible potential with this property belongs to this family, thereby obtaining a complete characterization. By contrast, we show that the standard BM model, namely, BM Hamiltonians with first harmonic tunnelling potentials, does not admit exactly flat bands at the magic angle except possibly at a discrete set of nonchiral coupling strengths, with no finite accumulation point. To prove this, we introduce an explicit invertibility criterion. The criterion requires the projected perturbation to have a nonzero scalar coefficient at some Bloch momentum, obstructing exact flatness for general nonchiral tunnelling. A local Taylor expansion argument verifies the criterion for the standard BM potentials. For the family constructed above, however, the projected perturbation vanishes at every Bloch momentum, so the invertibility criterion fails.", "url": "https://arxiv.org/abs/2608.31147", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhen Huang"}, {"name": "Kevin D. Stubbs"}], "featured_authors": [{"name": "Zhen Huang"}, {"name": "Kevin D. Stubbs"}], "author_count": 2}, {"id": "2608.28650", "category": "quant-ph", "title": "Alphabet-Dependent Bounds for Pure Quantum $(r,ρ)$-Locally Recoverable Codes", "abstract": "A quantum $(r,\\rho)$-locally recoverable code ($(r,\\rho)$-qLRC) is a quantum code in which every qudit can be recovered from at most $r+\\rho-1$ other qudits, even after $\\rho-1$ additional erasures inside the recovery set. The bounds currently known for this class, namely the Singleton-like and the GG Singleton-like bounds, are alphabet independent and are therefore loose for small-to-moderate qudit dimensions. In this letter, we derive three alphabet-dependent upper bounds for pure $(r,\\rho)$-qLRCs obtained through the Hermitian CSS construction: a Griesmer-like, a Plotkin-like, and a sphere-packing-like bound. We further establish the asymptotic hierarchy among these bounds and identify the relative-distance regions in which each of them yields the tightest rate constraint.", "url": "https://arxiv.org/abs/2608.28650", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vijay Kumar"}, {"name": "Ramakrishna Bandi"}], "featured_authors": [{"name": "Vijay Kumar"}, {"name": "Ramakrishna Bandi"}], "author_count": 2}, {"id": "2608.28828", "category": "quant-ph", "title": "Representation Learning with Quantum Signal Processing", "abstract": "Representation learning begins when training changes the features that define similarity between data. A frozen-kernel model only reweights a fixed geometry. We establish quantum signal processing (QSP) as a solvable quantum model of the representation-learning regime. At arbitrary depth, we compute the exact mean and variance of its quantum neural tangent kernel, revealing an input-dependent angular geometry whose diagonal remains non-self-averaging even when the underlying unitary approaches Haar randomness. We also prove a sparse-data guarantee for the full nonlinear gradient flow without freezing or ensemble-averaging the kernel: the realized dynamics converges to an integrable scalar flow with a time-dependent kernel closure and explicit convergence times. A finite-depth speed limit holds for every data set and trajectory. At higher data density, numerical results show coupled evolution beyond both the scalar and frozen-kernel descriptions. These results give a controlled theory of learned quantum data geometry with provable training dynamics beyond the frozen limit.", "url": "https://arxiv.org/abs/2608.28828", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Junqi Wang"}, {"name": "Junyu Liu"}], "featured_authors": [{"name": "Junqi Wang"}, {"name": "Junyu Liu"}], "author_count": 2}, {"id": "2608.28897", "category": "quant-ph", "title": "Rényi Entanglement of Purification Is Non-additive", "abstract": "Entanglement of purification is a fundamental measure of total correlations whose additivity remains unresolved. We study its additivity for classical states on two qubits at different Rényi orders. For every $\\alpha\\in[0,1)$, we prove nonadditivity within this family, witnessed by two copies of a single state. We first solve the one-copy optimization exactly for the entire family at every Rényi order. We then restrict the two-copy optimization to a natural finite set of purifications and exhibit one whose entropy is strictly below the product value. In contrast, for $\\alpha\\in[2,\\infty]$ we prove additivity under tensor products within this family. The interval $\\alpha\\in[1,2)$, including the von Neumann case $\\alpha=1$, remains open, and we conjecture additivity there throughout the same family.", "url": "https://arxiv.org/abs/2608.28897", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Amir-Reza Negari"}, {"name": "Zahra Baghali Khanian"}], "featured_authors": [{"name": "Amir-Reza Negari"}, {"name": "Zahra Baghali Khanian"}], "author_count": 2}, {"id": "2608.28914", "category": "quant-ph", "title": "Exact Haar Statistics of Planar $k$-Purity in Multipartite Quantum Systems", "abstract": "Planar $k$-uniform states have maximally mixed reductions on every $k$-site interval of a ring. We introduce planar $k$-purity---the mean purity of those intervals---as a faithful cost function for this simultaneous constraint. For a Haar-random pure state of $n$ parties with local dimension $p$, the joint purity of two intervals depends only on their overlap. An exhaustive four-replica calculation therefore yields the complete cyclic covariance kernel and a closed variance for every $1\\le k\\le\\lfloor n/2\\rfloor$. In the balanced qubit case, $k=\\lfloor n/2\\rfloor$ and $N=2^n$, the variance is asymptotic to $20/(3nN^2)$ for even $n$ and $6/(nN^2)$ for odd $n$. A site-factorized permutation representation gives all raw moments and permits exact finite-sum evaluation of the skewness. Fixed-seed simulations validate nonbalanced qubit and qutrit cases, while balanced-qubit simulations through $n=10$ validate the parity formulas and finite-size skewness. Balanced planar and absolute balanced purity have the same Haar mean but different fluctuations; the planar variance is approximately $2.83$ times larger at $n=10$. Thus subsystem incidence, although invisible to every one-cut marginal distribution, controls the collective fluctuations of geometrically related cuts. Together with universal attainability and a linear number of interval constraints at balance, this provides a geometry-aware benchmark for multipartite entanglement beyond AME existence regimes.", "url": "https://arxiv.org/abs/2608.28914", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kourosh Mirsohi"}], "featured_authors": [{"name": "Kourosh Mirsohi"}], "author_count": 1}, {"id": "2608.28946", "category": "quant-ph", "title": "On the entropy of a pseudo-density matrix", "abstract": "The pseudo-density matrix (PDM) formalism naturally extends the notion of density operator to the spatiotemporal domain. While PDMs are Hermitian and of unit trace, they admit negative eigenvalues when encoding temporal correlations unattainable for spacelike separated systems. Consequently, there have been various approaches to extending the von~Neumann entropy---which is only defined for positive operators---to PDMs. Here, we prove that there exists a unique extension of the von~Neumann entropy functional to Hermitian matrices of unit trace satisfying two simple assumptions: unitary invariance and strong additivity with respect to affine combinations within the interval $[-1,1]$, which we prove contains the eigenvalues of a PDM. We also prove that this unique extension of von~Neumann entropy to PDMs is subadditive for single qubit dynamics, and we analyze its behavior in a number of examples.", "url": "https://arxiv.org/abs/2608.28946", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "James Fullwood"}, {"name": "Boyu Yang"}], "featured_authors": [{"name": "James Fullwood"}, {"name": "Boyu Yang"}], "author_count": 2}, {"id": "2608.28962", "category": "quant-ph", "title": "Universal recovery in approximate quantum error correction", "abstract": "Universal recovery -- the existence of a single recovery map that corrects an entire family of error channels -- is a central feature of quantum error correction (QEC). In exact QEC, linearity guarantees that a code correcting a given error set also corrects every channel whose Kraus operators lie in its linear span, and that a single recovery map suffices for all such channels. Approximate quantum error correction (AQEC), which relaxes perfect recovery to recovery with controlled error, has traditionally lacked this structure. In a recent paper ( arXiv:2607.22995 ), we developed a theory of approximate quantum error correction showing that a restricted form of linearity persists in the approximate setting, yielding uniform AQEC guarantees for the family of channels controlled by a given error set. In this work, we complete the picture by establishing the second half of universal recovery in the approximate setting: a single recovery map can simultaneously correct every channel controlled by a given error set. The error-set theory we proposed quantifies approximate correctability through two parameters: the environment-leakage distance, governing worst-case performance, and the Knill--Laflamme Hellinger distance, governing average-case performance. We show here that both quantities also control universal decoding. We further study the Petz map naturally associated with an error set as an explicit universal recovery, and obtain uniform average- and worst-case guarantees across the entire family of channels.", "url": "https://arxiv.org/abs/2608.28962", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dor Elimelech"}, {"name": "Victor V. Albert"}, {"name": "Alexander Barg"}], "featured_authors": [{"name": "Dor Elimelech"}, {"name": "Victor V. Albert"}, {"name": "Alexander Barg"}], "author_count": 3}, {"id": "2608.28985", "category": "quant-ph", "title": "Measure of set imaginarity", "abstract": "Recent studies have shown that Bargmann invariants provide effective detectors of set imaginarity. In this paper, we investigate set imaginarity as a quantum resource in qubit systems. By exploiting the structure of Bargmann invariants, we show that the free operations for qubit set imaginarity consist precisely of common unital operations and common planarized operations. Based on this characterization, we introduce an axiomatic framework for set-imaginarity measures (SIMs). In particular, we propose two refined notions, namely unified SIMs and complete SIMs, which allow a more fine-grained quantification of set imaginarity. To make these notions concrete, we construct two qubit SIMs from the Bargmann invariants of three-state subsets. We prove that one of them is a unified SIM, while the other satisfies the stronger requirements of a complete SIM. Furthermore, we revisit the robustness of set imaginarity previously introduced in the literature. We show that, although this robustness is a valid SIM for qubit systems, it is neither a unified SIM nor a complete SIM. To overcome this limitation, we propose an improved robustness-type measure and rigorously prove that it defines a complete qubit SIM.", "url": "https://arxiv.org/abs/2608.28985", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yu Guo"}, {"name": "Jiabo Pan"}, {"name": "Yuqin Wang"}, {"name": "Shuanping Du"}], "featured_authors": [{"name": "Yu Guo"}, {"name": "Jiabo Pan"}, {"name": "Yuqin Wang"}, {"name": "Shuanping Du"}], "author_count": 4}, {"id": "2608.29049", "category": "quant-ph", "title": "Eigenvalues of multipartite entanglement witnesses", "abstract": "We investigate various properties of multipartite block-positive operators, decomposable EWs (DEWs), and non-decomposable EWs. We provide a necessary and sufficient condition to construct a special DEW using the multipartite GHZ state. For multipartite DEW, we explicitly characterize the supremum and infimum of maximum and minimum eigenvalues, as well as the trace of its square. We also derive other results concerning NDEW, eigenvalues of $2 \\times n$ EWs and the corresponding physical implications. Furthermore, we investigate the tightness of inequalities of these eigenvalues with examples.", "url": "https://arxiv.org/abs/2608.29049", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nalan Wang"}, {"name": "Lin Chen"}], "featured_authors": [{"name": "Nalan Wang"}, {"name": "Lin Chen"}], "author_count": 2}, {"id": "2608.29079", "category": "quant-ph", "title": "Quantum discord of Gaussian states in non-inertial frames", "abstract": "We investigate the redistribution of continuous-variable Gaussian quantum discord under the Unruh effect for both one and two uniformly accelerated observers. The discord shared between the inertial mode and the accessible accelerated mode, as well as that between the two accessible accelerated modes, decays monotonically with acceleration and vanishes in the limit $a\\to\\infty$, while the Unruh effect generates discord in all causally disconnected Rindler mode pairs. The initial quantum correlation is therefore redistributed across Rindler partitions rather than destroyed. We further characterize how the squeezing parameter $s$ and field frequency $\\omega$ control the discord in different mode-pair classes. For causally connected pairs, $s$ and $\\omega$ exert comparable, interchangeable effects; for cross-region pairs, the squeezing parameter dominates; and for intra-observer cross-region pairs, the field frequency is more influential. In the two-observer case, the $A_{II}$-$B_{II}$ pair exhibits non-monotonic behavior with a peak whose position shifts to larger $a$ as $\\omega$ increases, and both parameters contribute only weakly except near an optimal $\\frac{\\omega}{s}$ ratio.", "url": "https://arxiv.org/abs/2608.29079", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Siwei Li"}, {"name": "Xiaofen Huang"}], "featured_authors": [{"name": "Siwei Li"}, {"name": "Xiaofen Huang"}], "author_count": 2}, {"id": "2608.29333", "category": "quant-ph", "title": "Zero-Energy Problems for Supersymmetric Hamiltonians on a Chain Are $\\mathrm{QMA}_1$-Complete", "abstract": "We study exact zero modes of supersymmetric quantum systems whose interactions are arranged on a one-dimensional chain. For Hermitian supercharges, deciding whether a zero mode exists is $\\mathrm{QMA}_1$-complete, and the hard instances are geometrically local on a chain. We also classify an explicitly encoded nilpotent $\\mathcal{N}=2$ formulation: its exact-zero problem is $\\mathrm{QMA}_1$-complete, including the restriction in which the associated Hamiltonian is local on a chain. Both classifications use a verification theorem for simultaneous sparse linear constraints and the same one-dimensional frustration-free Hamiltonian construction. The construction gives an explicit inverse-polynomial lower bound on the ground energy of every reduced NO instance, separating it from zero.", "url": "https://arxiv.org/abs/2608.29333", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yibin Wang"}], "featured_authors": [{"name": "Yibin Wang"}], "author_count": 1}, {"id": "2608.29350", "category": "quant-ph", "title": "Quantum Natural Gradient on Quotient Spaces", "abstract": "Parametrized quantum circuits often contain state-preserving redundancies that make the quantum Fisher information matrix (QFIM) singular even when the physical state manifold is regular. We formulate quantum natural gradient (QNG) on the resulting parameter quotient and prove that, when the prescribed redundancy exhausts the Fisher kernel, the Moore--Penrose update is the minimum-norm horizontal lift of the quotient Riemannian gradient. A circuit-to-orbit transfer principle separates intrinsic state distinguishability from circuit-coordinate distortion and gives the exact condition under which a circuit realizes an intrinsic orbit-QNG direction. Representation theory then yields root-resolved Fisher scales on highest-weight flag orbits and isotropic intrinsic metrics for Slater and fermionic-Gaussian manifolds. On cominuscule embeddings, intrinsic fidelity QNG conserves principal-defect ratios and reduces to one scalar equation; Lie-retracted steps are locally cubic at $\\eta=2$, with stability boundary $\\eta=4$. For finite-shot implementations, we separate exact gauge removal from regularization of physical soft modes, obtain zero cumulative gauge drift under structural projection, and derive confidence-controlled soft-mode rules. Under depolarization, inverse-Fisher scaling restores deterministic scale only by amplifying fluctuations and therefore cannot recover a lost update signal-to-noise ratio. A redundant Slater/Givens circuit verifies the transfer law and the predicted finite-shot tradeoffs.", "url": "https://arxiv.org/abs/2608.29350", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zeyu Chen"}], "featured_authors": [{"name": "Zeyu Chen"}], "author_count": 1}, {"id": "2608.29353", "category": "quant-ph", "title": "Spinor Structure from Relativistic Mass-Shell Factorisation in Phase Space", "abstract": "Spin is usually regarded as one of the most intrinsically quantum phenomena, while its lack of a natural analogue in classical physics presents an obstacle to phase-space deformation-quantisation accounts of its origin. We show that this difficulty may arise from imposing an overly restrictive scalar Hamiltonian structure on relativistic phase space. Requiring the complete massive mass-shell constraint to be represented by a single finite-dimensional expression that is linear in all four components of momentum forces its coefficient matrices to satisfy a Clifford algebra. The minimal complex representation of this algebra is four-dimensional. Requiring statistical completeness within the rank-two subspace selected by the mass-shell factor then leads to a four-by-four matrix-valued ensemble distribution. At each on-shell momentum, the linear mass-shell operator selects a two-dimensional subspace, so a general classical ensemble is described by a $2 \\times 2$ matrix before quantisation. Projecting the Weyl-ordered Liouville equation into this subspace gives relativistic transport while preserving arbitrary populations and coherences and the remaining projector components determine the first deformation correction. Expansion of the matrix Moyal star commutator yields the symmetrised classical matrix Liouvillian at leading order. If the stronger two-sided star constraints are imposed, they reproduce the left and right Dirac-Wigner equations and introduce $\\hbar$ as the scale converting the dimensionless internal algebra into physical angular momentum. These results suggest a non-quantum origin for spinor structure and a route to reconciling relativistic covariance, classical phase-space transport, and quantum spin.", "url": "https://arxiv.org/abs/2608.29353", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mark Everitt"}], "featured_authors": [{"name": "Mark Everitt"}], "author_count": 1}, {"id": "2608.29373", "category": "quant-ph", "title": "Convex conservation of von Neumann entropy implies unitarity or antiunitarity", "abstract": "On the space of density matrices $D(H)$, Kadison's theorem establishes that all invertible convex transformations $K:D(H)\\to D(H)$ are unitarity or antiunitary. For a finite Hilbert space, we propose a similar theorem which replaces the invertibility requirement with that of entropy conservation. Thus, we argue, the supposition of reversibility in quantum mechanics may be replaced with a principle of entropy conservation.", "url": "https://arxiv.org/abs/2608.29373", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nicolas G. Underwood"}, {"name": "Jonte R. Hance"}], "featured_authors": [{"name": "Nicolas G. Underwood"}, {"name": "Jonte R. Hance"}], "author_count": 2}, {"id": "2608.29422", "category": "quant-ph", "title": "The ZZ feature map induces a signless Laplacian metric: a closed-form classical surrogate for quantum kernel regression", "abstract": "Quantum kernel methods lose their advantage over classical kernels once the encoding bandwidth is tuned, and bandwidth-tuned quantum kernels have been shown to resemble radial basis function kernels closely. The analytical support for that observation rests on separable encoding circuits and captures entangling circuits only qualitatively. We close this gap for the ZZ feature map. We prove that in the small-bandwidth regime the induced kernel is, to leading order, an anisotropic Gaussian kernel with metric M = I + pi^2 Q, where Q is the signless Laplacian of the entanglement graph, and that the quadratic structure persists at every circuit depth as a pullback of the Fubini-Study metric. The anisotropy depends entirely on a phase convention: under the unshifted convention the metric is the identity irrespective of entanglement, which explains the isotropic resemblance previously reported. The derivation is verified against direct simulation for path, cycle and complete entanglement graphs, with relative error below 10^-3. The corresponding classical kernel requires no fitted parameters and no quantum simulation. Compared with the quantum kernel across two near-infrared spectroscopic benchmarks, four targets, five preprocessing pipelines and 100 resampled splits per cell, the paired 95% bootstrap interval contains zero in 18 of 20 cells, the typical relative difference in test error is 2.7%, and the two families select the same preprocessing pipeline in 96% of splits. The regime in which the reduction fails begins at the same bandwidth on both datasets and adds no robust predictive value: restricting the grid to the classical regime improves mean test error by 3.8%, a gain that an equally large random restriction does not reproduce. The quantum circuit can thus be removed without detectable predictive loss, and we can state precisely which classical kernel it was computing.", "url": "https://arxiv.org/abs/2608.29422", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Erkut Tekeli"}], "featured_authors": [{"name": "Erkut Tekeli"}], "author_count": 1}, {"id": "2608.29493", "category": "quant-ph", "title": "Quantum Pessiland", "abstract": "Pessiland is a world where NP is hard on average but one-way functions (OWFs) do not exist [Impagliazzo 1995]. Because almost all classical cryptographic primitives imply OWFs [Impagliazzo and Luby 1989], there is almost no classical cryptography in Pessiland. On the other hand, quantum cryptography can exist even when OWFs do not [Kretschmer 2021; Morimae and Yamakawa 2022; Ananth, Qian and Yuen 2022]. Is there a quantum analogue of Pessiland where NP is hard on average but even quantum cryptography does not exist? In this paper, we show that such a miserable world, Quantum Pessiland, exists: there is a quantum oracle relative to which $UP\\cap coUP$ is hard on average against quantum polynomial-time algorithms with quantum advice, yet auxiliary-input EFI pairs do not exist. We also show that there is a classical oracle relative to which $UP\\cap coUP$ is hard on average against quantum polynomial-time algorithms with quantum advice, yet classically-secure auxiliary-input one-way puzzles (OWPuzzs) do not exist. Almost all quantum cryptographic primitives imply EFI pairs or OWPuzzs, and therefore these results mean that there is almost no quantum cryptography relative to these oracles. We further show that relative to the classical oracle, SampBQP = SampBPP, and therefore there is no sampling-based quantum advantage in Quantum Pessiland. Finally, because our average-case hardness of $UP\\cap coUP$ implies $P^{\\#P}\\not\\subseteq this http URL , our result also implies that a non-relativizing proof technique is necessary to construct OWPuzzs solely from $P^{\\#P}\\not\\subseteq this http URL , which gives a partial negative answer to the open problem of [Khurana and Tomer 2025].", "url": "https://arxiv.org/abs/2608.29493", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Boyang Chen"}, {"name": "Tomoyuki Morimae"}, {"name": "Takashi Yamakawa"}], "featured_authors": [{"name": "Boyang Chen"}, {"name": "Tomoyuki Morimae"}, {"name": "Takashi Yamakawa"}], "author_count": 3}, {"id": "2608.29602", "category": "quant-ph", "title": "Evolution Generators for Complex Parameters", "abstract": "Theoretical studies on how quantum systems are affected by external factors are often formulated through parameter changes in the system's Hamiltonian. Beyond Berry connections and phases, which focus on specific Hamiltonian eigenstates, recent studies inspired by non-Hermitian quantum formalisms provide a framework for obtaining general state evolution generators for real-valued parameters. This study extends the applicability of the evolution generator formalism to complex-valued parameters via Wirtinger derivatives. By treating a complex parameter and its conjugate as independent variables, the evolution equations are derived for both quantum states and the metric of the Hilbert space bundle. The analysis demonstrates that while state evolution with respect to a complex parameter is naturally governed by its corresponding evolution generator, metric evolution requires a coupled contribution from both the generator and its conjugate counterpart to preserve state normalization. Explicit examples are worked out to illustrate the implementation and physical consistency of the formalism.", "url": "https://arxiv.org/abs/2608.29602", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jen-Yin Yeh"}, {"name": "Chia-Yi Ju"}], "featured_authors": [{"name": "Jen-Yin Yeh"}, {"name": "Chia-Yi Ju"}], "author_count": 2}, {"id": "2608.29672", "category": "quant-ph", "title": "Asymptotic Entanglement across Dynamical Regimes of a Dissipative Bosonic Dimer", "abstract": "Dynamical instability in parametrically driven bosonic systems is generally associated with diverging occupations and the absence of a stationary state, but its implications for long-time entanglement remain unclear. We investigate this question in a dissipative bosonic dimer with beam-splitter and two-mode-squeezing interactions, local loss, and a tunable common bath. The non-Hermitian dynamical spectrum governing the Gaussian moments partitions the parameter space into distinct regimes and provides a unified description of population and entanglement dynamics across both stable and unstable regions. We find that dynamical instability does not imply unbounded entanglement growth: although the bosonic population diverges, the logarithmic negativity remains bounded and approaches a finite asymptotic value. We further characterize the finite asymptotic entanglement and show that asymmetric local dissipation shifts both the stability boundary and the threshold for nonzero asymptotic entanglement. For identical local dissipation, the presence of a common bath leaves the dynamical-region boundaries unchanged while qualitatively reshaping the long-time entanglement landscape, producing broad enhancement regions within the stable regimes and a narrow enhancement region within the unstable regime. In the common-bath-only limit, this enhancement is attributed to an exact dark-mode (bound-state-in-the-continuum, BIC) protection mechanism, which reduces to a quasi-BIC remnant under independent dissipation. Our results establish the non-Hermitian dynamical spectrum as a framework for connecting stability, nonequilibrium dynamics, and asymptotic entanglement in open quadratic bosonic systems.", "url": "https://arxiv.org/abs/2608.29672", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chenghe Yu"}, {"name": "Mingsheng Tian"}, {"name": "Feng-Xiao Sun"}, {"name": "Qiongyi He"}], "featured_authors": [{"name": "Chenghe Yu"}, {"name": "Mingsheng Tian"}, {"name": "Feng-Xiao Sun"}, {"name": "Qiongyi He"}], "author_count": 4}, {"id": "2608.29684", "category": "quant-ph", "title": "Analytical diagonalization of the open-boundary bosonic Kitaev chain: An asymmetric plane-wave ansatz approach", "abstract": "The bosonic Kitaev chain under open boundary conditions has attracted recent attention due to its realization in driven-dissipative systems and its intriguing non-Hermitian boundary physics. The model is known to be solvable via local squeezing transformations in the position-momentum representation. In this paper, we present an alternative, purely algebraic solution that relies entirely on the standard bosonic Bogoliubov transformation. For an $N$-site chain, we propose an asymmetric plane-wave ansatz with unequal left- and right-moving momenta to analytically solve the associated $2N\\times 2N$ non-Hermitian ``associated matrix\". The left eigenvalue problem yields $N$ distinct eigenvalues, each of which is twofold degenerate. By carefully resolving these degeneracies using the bosonic commutation relations, we construct the $N$ physical Bogoliubov quasiparticle operators. The construction reveals non-uniquenesses that in special cases exactly mirror the freedom in the local squeezing transformations of the original approach. The diagonal form of the Hamiltonian is obtained explicitly and is shown to be equivalent to the original Hamiltonian. The proposed asymmetric plane-wave ansatz and degeneracy-resolution technique are not limited to the present model and can be generalized to other bosonic pairing systems, including those with inhomogeneous pairing or hopping terms.", "url": "https://arxiv.org/abs/2608.29684", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ning Wu"}, {"name": "Wen-Long You"}], "featured_authors": [{"name": "Ning Wu"}, {"name": "Wen-Long You"}], "author_count": 2}, {"id": "2608.29707", "category": "quant-ph", "title": "Tight Global Bound on Pairwise Entanglement of Formation in Three-Qubit Systems", "abstract": "We derive a global bound on the sum of pairwise squared entanglement of formation in three-qubit systems. The bound is tight and can be saturated by states containing a maximally entangled bipartite pair with an uncorrelated third qubit. Moreover, using this relation, we can map the three bipartite entanglements to three coordinates, such that any three-qubit state corresponds to a point in three-dimensional space, thereby endowing this global inequality with a very natural geometric picture. Accordingly, the dynamical evolution can be interpreted as trajectories in this geometric space; we select representative initial states and investigate the dynamical behavior of the three pairwise entanglements under various Markovian noise models.", "url": "https://arxiv.org/abs/2608.29707", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}, {"name": "Ming Yang"}], "featured_authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}, {"name": "Ming Yang"}], "author_count": 3}, {"id": "2608.29734", "category": "quant-ph", "title": "The quantum supremum of the $I_{3322}$ Bell inequality is not attained in finite dimension", "abstract": "In 2010, Pál and Vértesi found a family of finite-dimensional strategies for the $I_{3322}$ Bell inequality whose optimized values appeared to converge as the local Hilbert-space dimension grew. They conjectured that this limit is the supremum over all finite-dimensional quantum strategies, but that no finite-dimensional strategy attains it. We prove both claims. The proof uses the symmetry of the Bell functional to associate every strategy with a finite matrix of probabilities, one for each pair of spectral subspaces of Alice and Bob. This matrix gives an upper bound on the Bell value, and finite-dimensional strategies built from the repeating structure found by Pál and Vértesi approach it as the dimension grows. If the bound were attained exactly in finite dimension, the optimality conditions would then require a state that cannot be normalized. Consequently, the set of finite-dimensional quantum correlations is not closed in the $(3,3,2,2)$ scenario, the smallest Bell scenario where this can happen. Moreover, approaching the supremum requires unbounded local dimension. The core of the proof was formalized in Lean~4.", "url": "https://arxiv.org/abs/2608.29734", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jef Pauwels"}], "featured_authors": [{"name": "Jef Pauwels"}], "author_count": 1}, {"id": "2608.29756", "category": "quant-ph", "title": "Pathwise Random Hamiltonian Simulation", "abstract": "Randomized product formulas such as qDrift offer a resource-efficient alternative to deterministic Trotter--Suzuki decompositions for Hamiltonian simulation, removing their polynomial dependence on the number of Hamiltonian terms. qDrift, however, is intrinsically limited to first order in the evolution time, so its query complexity remains linear in the inverse of the target accuracy, $1/\\epsilon$. We introduce Pathwise Random Hamiltonian Simulation (PRHS), which extends qDrift to arbitrary order by subdividing each time step into $M$ correlated slices, each evolving under a term sampled from a quasi-probability distribution that we construct in closed form and prove unique, with a bias decaying factorially in $M$. Optimizing jointly over the number of slices $M$ and the number of independent blocks $N$ interpolates between the standard qDrift protocol at long times and a high-precision regime where the query cost grows slower than any power of $1/\\epsilon$, without requiring ancillary qubits. Numerical simulations of five molecular Hamiltonians confirm this advantage, with PRHS achieving accuracies two to four orders of magnitude beyond qDrift at equal query cost.", "url": "https://arxiv.org/abs/2608.29756", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Davide Cugini"}], "featured_authors": [{"name": "Davide Cugini"}], "author_count": 1}, {"id": "2608.29811", "category": "quant-ph", "title": "Dark state as a measurable state by a dispersive readout without a Purcell limit", "abstract": "It is believed that the enhancement in qubit-resonator coupling allows a better dispersive readout but introduces greater Purcell loss. In this work, we propose that a dark mode in a coupled quantum system may violate this rule by introducing the ZZ interaction between the dark and a bright mode. The dark mode may exhibit an effective zero coupling strength, and zero Purcell loss with the resonator photons. Nevertheless, the dispersive shift is almost the same as the bright state, due to the higher order perturbation introduced by the higher excited states. Such a state demonstrates the measurability without a Purcell limit in circuit quantum electrodynamics.", "url": "https://arxiv.org/abs/2608.29811", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wei-Chen Chien"}, {"name": "Jyh-Yang Wang"}, {"name": "Yen-Yu Chiang"}, {"name": "Cheng-Chengh Huang"}, {"name": "Lih-Chieh Hsaio"}, {"name": "Yen-Chun Chen"}, {"name": "Cen-Shawn Wu"}, {"name": "Chiidong Chen"}, {"name": "Watson Kuo"}], "featured_authors": [{"name": "Wei-Chen Chien"}, {"name": "Jyh-Yang Wang"}, {"name": "Yen-Yu Chiang"}, {"name": "Cen-Shawn Wu"}, {"name": "Chiidong Chen"}, {"name": "Watson Kuo"}], "author_count": 9}, {"id": "2608.29839", "category": "quant-ph", "title": "Ancilla-mediated fixed-point quantum search using Grover iterations", "abstract": "Grover's quantum search algorithm provides a fundamental quadratic speedup for unstructured datasets, reducing query complexity from $\\mathcal{O}(N)$ to $\\mathcal{O}(\\sqrt{N})$. However, the algorithm's reliance on precise iteration counts leads to the ``soufflé problem,'' where over-rotation results in a sharp decline in success probability. This limitation is particularly restrictive when the number of solution states, $M$, is unknown. In this work, we present an ancilla-mediated fixed-point quantum search algorithm that achieves robust convergence by mapping the solution amplitude to a dedicated ancilla qubit. Unlike existing phase-matching fixed-point methods, our approach utilizes Grover's real-plane reflections, thereby maintaining the intuitive geometric architecture of the original algorithm. We demonstrate that this method achieves a success probability of at least $92.6\\%$ with a query complexity of approximately $\\mathcal{O}(\\sqrt{N/M})$, effectively bridging the gap
