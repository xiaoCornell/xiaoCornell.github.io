between standard amplitude amplification and robust fixed-point convergence.", "url": "https://arxiv.org/abs/2608.29839", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yash Prabhat"}, {"name": "Snigdha Thakur"}, {"name": "Ankur Raina"}], "featured_authors": [{"name": "Yash Prabhat"}, {"name": "Snigdha Thakur"}, {"name": "Ankur Raina"}], "author_count": 3}, {"id": "2608.29926", "category": "quant-ph", "title": "Emergence of Strategic Equilibria from Transverse Field Ising Hamiltonian Dynamics", "abstract": "Game theory studies strategic decision-making among rational agents, and many classical games can be mapped onto interaction models such as the Ising model. Quantum game theory extends this framework by allowing players to exploit quantum superposition and entanglement. In this work, we study quantum games using an operator-based formulation derived from the transverse-field quantum Ising model. We show that the Hamiltonian-driven dynamics naturally generate entangling operator which resolve the dilemma in the game settings. This leads to a clear quantum advantage over classical outcomes. Unlike standard quantization schemes based on fixed entangling gates, the present approach enables tunable entanglement, controlled directly by physical Hamiltonian parameters, providing a hardware-relevant perspective on quantum game design.", "url": "https://arxiv.org/abs/2608.29926", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Teena Thomas"}, {"name": "S. Balakrishnan"}], "featured_authors": [{"name": "Teena Thomas"}, {"name": "S. Balakrishnan"}], "author_count": 2}, {"id": "2608.29969", "category": "quant-ph", "title": "The MS Unidirectional Current as a Generalization of the ABC Absorption Current", "abstract": "For a free scalar particle in one spatial dimension, in a single-pass half-line geometry, we compare the absorbing Robin boundary condition with the generalized Marchewka--Schuss (MS) unidirectional-current family. Robin absorption is characterized by a single parameter $\\kappa>0$: once $\\kappa$ is specified, its momentum-dependent absorption profile is fixed. In the generalized MS construction, by contrast, the detector response is described by a spectral function $\\lambda(k)$, subject to the positivity and subnormalization conditions of the detection law. We show that every Robin choice of $\\kappa$ corresponds to the particular MS calibration $\\lambda_\\kappa(k)=\\pi\\kappa/(k+\\kappa)^2$, which reproduces the complete Robin absorption current for every admissible one-sided spectral amplitude and at every time. Thus the entire one-parameter Robin absorption family is contained within the generalized MS family. The MS construction is more general: the choice $\\lambda_{\\rm full}(k)=\\pi/(4k)$ gives unit absorption efficiency for every wave number, which cannot be achieved by any fixed Robin parameter. In this precise sense, the generalized MS detector process extends the Robin absorbing-boundary family. We also compare their asymptotic behavior in the ballistic fixed-ray regime and in the fixed-distance late-time limit.", "url": "https://arxiv.org/abs/2608.29969", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Avi Marchewka"}], "featured_authors": [{"name": "Avi Marchewka"}], "author_count": 1}, {"id": "2608.30272", "category": "quant-ph", "title": "Modular-Annihilator Parent Hamiltonians for Purified Gibbs States: Spectral Design and Controlled Approximation", "abstract": "Purified Gibbs states provide a bridge between finite-temperature physics, dissipative dynamics, and ground-state methods. In this work, we study the exact finite sum-of-squares (SoS) construction of their parent Hamiltonians and the associated Lindbladian based on modular annihilators. Given a finite set of Hermitian generators, the corresponding modular annihilators yield a frustration-free SoS representation without continuous time integrals or an explicit decomposition into Bohr-frequency sectors. The purified Gibbs state remains a common zero mode while the freedom to choose and combine the generators can be used to optimize the spectral properties of the parent Hamiltonian. For free-fermion Hamiltonians, modular transformations act linearly on Majorana operators, leading to an analytically solvable family of parent Hamiltonians parameterized by a real symmetric coefficient matrix \\(S\\). For the scalar-functional subclass $S=f(h)$, we show that, at fixed operator norm, the choice $S_{\\mathrm{opt}}\\propto 1/\\sqrt{\\cosh(2\\beta h)}$ has mixing time upper bound $2\\log(2N/\\epsilon)$ for any $\\beta$, which exhibits rapid mixing and is irrelevant to the inverse temperature $\\beta$. For interacting systems, where the modularly dressed generators are not available in closed form, we introduce a Krylov--Lanczos approximation scheme and bound the resulting ground-state error in terms of the modular-approximation error and the parent-Hamiltonian gap. Numerical results illustrate the free-fermion spectral advantage and show how the accuracy of the interacting construction depends on temperature, interaction strength, and Krylov dimension.", "url": "https://arxiv.org/abs/2608.30272", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Changhao Yi"}, {"name": "Jun Takahashi"}, {"name": "Cunlu Zhou"}], "featured_authors": [{"name": "Changhao Yi"}, {"name": "Jun Takahashi"}, {"name": "Cunlu Zhou"}], "author_count": 3}, {"id": "2608.30282", "category": "quant-ph", "title": "Best Annealing Path of Quantum Annealing via Efficient Adiabatic Phase Transition", "abstract": "Quantum Annealing (QA) has already put into practical use and considered useful for solving many social issues, such as reduction of traffic congestion and delivery optimization. But in QA, when the energy difference between the ground state and the first excited state is small, the transition probability between them increases. Therefore, in order to decrease the transition, QA has to be performed at extremely low temperatures. To simulate the situation, it has the problem in that it takes much time. Many studies are underway to accelerate QA theoretically, one of which is to incorporate non-stoquastic Hamiltonian. On the other hand, I proposed Nested Simulated Annealing (NSA) inspired by Quantum Monte Carlo (QMC). I showed the computational speedup could be achieved dramatically, by considering the idea that the effect of flipping a spin preferentially influenced the spins directly interacting with it. Although NSA was based on such classical concept of causality, the hybrid computation both quantum and classical approach worked well. In this paper, in order to discuss the relationship between NSA and non-stoquastic Hamiltonian like XX-interaction, the spins are treated as continuous variables. I derive the formula to calculate the total energy in both with a problem Hamiltonian and the perturbation Hamiltonian induced by a transverse electromagnetic field. And I will show a clear relationship between local-maxima and the convergence speed when calculating it with the binary spin. More precisely, the annealing path with the smallest local-maxima converges fast, even though it consumes fewer computational resources. Therefore, it is possible to induce an optimal adiabatic phase transition by selecting NSA parameters appropriately. This paper shows an effective method to choose the parameters when simulating QMC on a classical computer.", "url": "https://arxiv.org/abs/2608.30282", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kiyotaka Murashima"}], "featured_authors": [{"name": "Kiyotaka Murashima"}], "author_count": 1}, {"id": "2608.30308", "category": "quant-ph", "title": "Indirect stabilization of N -level quantum systems", "abstract": "We study the stabilizability of a N -level quantum systems using an indirect control ar- chitecture mediated by a noisy ancilla. After outlining the general theoretical framework for arbitrary N , we focus on the two-level case (N = 2), for which we derive a complete set of necessary and sufficient conditions for asymptotic stability. Finally, we illustrate the analyti- cal results with a simple numerical example on a two-spin system, showing convergence to a Bell state for a set of random initial conditions.", "url": "https://arxiv.org/abs/2608.30308", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Francesca Carlotta Chittaro"}], "featured_authors": [{"name": "Francesca Carlotta Chittaro"}], "author_count": 1}, {"id": "2608.30340", "category": "quant-ph", "title": "Exact quantum splitting and the structure of finite algebras", "abstract": "Berlekamp's algorithm factors a squarefree polynomial $f\\in\\mathbb{F}_q[x]$ by deterministic linear algebra, reducing the problem to splitting an explicit commutative algebra $B\\cong\\mathbb{F}_q^r$ into its $r$ simple factors. For large odd $q$, the standard efficient splitting step is randomized, while known derandomizations are conditional on the Extended Riemann Hypothesis. We give an unconditional exact quantum implementation in a circuit model permitting single-qubit rotations through efficiently computable angles. The construction uses an unconditional counting argument. For a block containing $s\\ge2$ irreducible factors, a quadratic-character test in odd characteristic and an absolute-trace test in characteristic $2$ yield a nonconstant test element with probability $p_{q,s}\\ge\\tfrac12$, known exactly in advance and depending only on $q$ and $s$, not on the unknown factorization. Exact amplitude amplification therefore converts each randomized test into a procedure succeeding with certainty after one amplification iteration. The resulting algorithm uses exactly $r-1$ quantum splitting rounds and $O(n^3\\log q)$ quantum $\\mathbb{F}_q$-operations and $O(n^3)$ classical operations, requiring no primitive root, quadratic non-residue, or distinct-degree preprocessing. The method also splits arbitrary finite-dimensional separable commutative $\\\\mathbb{F}_q$-algebras given by structure constants. Combined with R'onyai's classical structure theory, which computes the radical deterministically and reduces the remaining tasks deterministically to polynomial factorization, it yields the radical and the Wedderburn decomposition of $A/\\mathrm{Rad}(A)$ into minimal two-sided ideals, with certainty, for any $n$-dimensional associative $\\mathbb{F}_q$-algebra given by structure constants, using $O(n^4\\log q)$ quantum $\\mathbb{F}_q$-operations.", "url": "https://arxiv.org/abs/2608.30340", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Muhammad Imran"}], "featured_authors": [{"name": "Muhammad Imran"}], "author_count": 1}, {"id": "2608.30370", "category": "quant-ph", "title": "Marginal spectral distributions on regular bipartite unitary orbits", "abstract": "Fix the spectrum of a bipartite density matrix and randomize its eigenbasis according to Haar measure. We study the probability distributions induced on the spectra of the two marginal states. For arbitrary subsystem dimensions $m$ and $n$, the joint characteristic function of the reduced density matrices is expressed as a Harish-Chandra-Itzykson-Zuber integral whose external eigenvalues are the pairwise sums $x_i + y_j$. Repeated external eigenvalues are handled by confluent determinant limits. In the two-qubit case, we derive an explicit alternating-spline formula for the joint density of the two marginal Bloch radii. Its support is the Bravyi-Klyachko compatibility region. We also obtain a compact truncated-power formula for the Bloch-radius density of either individual qubit marginal. In the qubit-qutrit case, we derive a truncated-power formula for the qubit Bloch-radius density and a bivariate spline formula for the joint density of the largest and smallest eigenvalues of the qutrit marginal. The latter two variables determine the full qutrit spectrum because the trace is fixed. The derivations combine confluent HCIZ integrals, distributional Fourier inversion, orbital measures, and the SU(2) and SU(3) derivative principles. The resulting densities are piece-wise polynomial on chambers determined by subset sums of the fixed global eigenvalues, in agreement with the Duistermaat-Heckman description of projected coadjoint-orbit measures.", "url": "https://arxiv.org/abs/2608.30370", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lin Zhang"}], "featured_authors": [{"name": "Lin Zhang"}], "author_count": 1}, {"id": "2608.30629", "category": "quant-ph", "title": "Gate-Efficient Implementation of the Query-Optimal Time-Dependent Hamiltonian Simulation", "abstract": "The query-optimal algorithm of [CGWZ26] for general time-dependent Hamiltonian simulation uses $$ q = O\\left( \\alpha T + \\frac{\\log(1/\\varepsilon)}{\\log\\left(e + \\log(1/\\varepsilon)/(\\alpha T) \\right)} \\right) $$ queries to $\\mathrm{HAM\\mbox{-}T}$ within $\\varepsilon$ error for a Lipschitz-continuous time-dependent Hamiltonian $H(t)$ on $[0,T]$ satisfying $\\left\\lVert H(t)\\right\\rVert\\leq\\alpha$. However, its direct circuit implementation incurs a substantially larger gate overhead. In this note, we give an implementation of the same algorithm that retains its optimal query complexity and uses $$ O\\left[ q \\left( a + \\log\\left(1 + \\frac{T(\\alpha + \\beta T)}{\\varepsilon} \\right) \\right) \\right] $$ one- and two-qubit gates, where $a$ is the number of block-encoding ancilla qubits and $\\beta$ is the Lipschitz constant of $H$. The main ingredient is an exact dyadic factorization of the ordered update product in the underlying one-query transducer.", "url": "https://arxiv.org/abs/2608.30629", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Boyang Chen"}, {"name": "Minbo Gao"}, {"name": "Zhengfeng Ji"}, {"name": "Tongyang Li"}, {"name": "Xinzhao Wang"}, {"name": "Shuo Zhou"}], "featured_authors": [{"name": "Boyang Chen"}, {"name": "Minbo Gao"}, {"name": "Zhengfeng Ji"}, {"name": "Tongyang Li"}, {"name": "Xinzhao Wang"}, {"name": "Shuo Zhou"}], "author_count": 6}, {"id": "2608.30660", "category": "quant-ph", "title": "Trade-off between Cooling-Step Count and Geometric Implementation Cost in Non-Markovian Algorithmic Cooling", "abstract": "Quantum cooling is important for reliable quantum computation but involves a trade-off between cooling performance and implementation resources. Although reservoir memory can improve particular aspects of cooling performance, the associated resource cost, particularly for circuit implementation, remains insufficiently understood. Here, we investigate how reservoir memory affects the trade-off between cooling performance quantified by the cooling-step count and geometric implementation cost in single-qubit heat-bath algorithmic cooling. Using a pseudomode mapping, we represent the non-Markovian damped Jaynes--Cummings dynamics by a repeated collision circuit and evaluate its geometric implementation cost. Using matrix-based simulations and an implementation on the ibm_kawasaki Heron r2 processor, we identify a trade-off: suppressing reservoir memory reduces the cooling-step count but generally increases the geometric protocol cost. Our work provides a resource-based perspective on reservoir engineering for algorithmic cooling.", "url": "https://arxiv.org/abs/2608.30660", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yohei Azumai"}, {"name": "Yoshihiko Hasegawa"}], "featured_authors": [{"name": "Yohei Azumai"}, {"name": "Yoshihiko Hasegawa"}], "author_count": 2}, {"id": "2608.30681", "category": "quant-ph", "title": "Entanglement-enabled Criticality in One-dimensional Quantum Contact Process", "abstract": "The contact process is a paradigmatic example of nonequilibrium dynamics, with broad applications ranging from chemistry to sociology. Its quantum counterpart, the quantum contact process (QCP), extends the classical model to include coherent processes. Despite sustained interest, the nature of the transition in the one-dimensional (1D) QCP remains debatable. Here, combining Liouvillian spectral analysis, the tensor jump method, exact quantum jump Monte Carlo, and truncated Wigner simulations, we show that 1D QCP undergoes a continuous absorbing-state phase transition, with critical exponents distinct from the classical case. We further find Liouvillian gap closes well below the critical point, highlighting that spectral gap analysis alone cannot distinguish a phase transition from metastability in the QCP. Crucially, the 1D QCP is weakly entangled, yet even this weak entanglement is indispensable for capturing the correct critical behavior, whereas semiclassical methods artificially stabilize the active state and predict a spurious first-order transition. Our work establishes the quantum origin of the phase transition in the 1D QCP and underscores the essential role of entanglement in dissipative quantum many-body systems.", "url": "https://arxiv.org/abs/2608.30681", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ya-Xin Xiang"}, {"name": "Tianyi Yan"}, {"name": "Weibin Li"}, {"name": "Yu-Qiang Ma"}], "featured_authors": [{"name": "Ya-Xin Xiang"}, {"name": "Tianyi Yan"}, {"name": "Weibin Li"}, {"name": "Yu-Qiang Ma"}], "author_count": 4}, {"id": "2608.30697", "category": "quant-ph", "title": "Flatness-Preserving Operations", "abstract": "A quantum state is called flat if it is proportional to a projector. There has been recent interest in studying antiflatness, the property of diverging from flat states, and establishing a resource theory for it. Identifying the free operations (the Flatness-Preserving Operations (FPOs)) remained an open problem. For this purpose, we first discuss Orthogonality-Preserving Operations (OPOs), of which trivial examples are unitary operations in an isolated system. More generally, we give a simple proof that all OPOs are isometric embeddings consisting of combinations of unitaries/isometries and appending a fixed state. We then show that all FPOs are either constant maps to some fixed flat state or a special case of an OPO, where the appended fixed state must be a flat state. We also show that the only possible flat convex combinations of flat states are those of orthogonal flat states with weights given by their purities.", "url": "https://arxiv.org/abs/2608.30697", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Otto Veltheim"}, {"name": "Esko Keski-Vakkuri"}], "featured_authors": [{"name": "Otto Veltheim"}, {"name": "Esko Keski-Vakkuri"}], "author_count": 2}, {"id": "2608.30771", "category": "quant-ph", "title": "PauLie: Fast Classification of Pauli Dynamical Lie Algebras", "abstract": "The dynamical Lie algebra (DLA) governs the controllability, expressibility, and simulation complexity of a quantum system. Explicitly computing it has been a major computational bottleneck: brute-force Lie closure scales exponentially in the number of qubits $n$. Many applications, however, consult only the isomorphism type of the DLA. We introduce PauLie, an open-source framework that decides this isomorphism type for DLAs generated by arbitrary Pauli strings, building on the anticommutation-graph reduction of Aguilar et al. PauLie runs in $O(n|\\mathcal{G}|\\max(n,|\\mathcal{G}|))$ time, where $|\\mathcal{G}|$ is the number of generators, turning DLA classification into a routine preprocessing step. We demonstrate its use as a structural oracle for routing Lie-algebraic simulation and Cartan decomposition, diagnosing barren plateaus in variational quantum algorithms, and engineering universal Pauli string generator sets with optimal generation rate.", "url": "https://arxiv.org/abs/2608.30771", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Oxana Shaya"}, {"name": "Konstantin Golovkin"}, {"name": "Mainak Roy"}, {"name": "Vincent Russo"}], "featured_authors": [{"name": "Oxana Shaya"}, {"name": "Konstantin Golovkin"}, {"name": "Mainak Roy"}, {"name": "Vincent Russo"}], "author_count": 4}, {"id": "2608.30775", "category": "quant-ph", "title": "Quantum Block Turbo Codes", "abstract": "In the early nineties, the introduction of turbo codes revolutionized classical error correction. The idea was mainly applied on two types of codes: convolutional turbo codes and turbo product codes. The first type of codes was adapted to quantum error correction which initiated the theory of quantum serial turbo codes. In this paper, we present a theory for quantum block turbo codes, the quantum analog of the second type of turbo codes. We describe their iterative decoding algorithm and simulate their performances on a depolarizing channel for different constituent codes.", "url": "https://arxiv.org/abs/2608.30775", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Khaled Jebari"}, {"name": "Luiz Anet Neto"}, {"name": "Ramesh Pyndiah"}, {"name": "Jean-Louis de Bougrenet de la Tocnaye"}], "featured_authors": [{"name": "Khaled Jebari"}, {"name": "Luiz Anet Neto"}, {"name": "Ramesh Pyndiah"}, {"name": "Jean-Louis de Bougrenet de la Tocnaye"}], "author_count": 4}, {"id": "2608.30860", "category": "quant-ph", "title": "Well-conditioned iterative methods for large open quantum systems", "abstract": "Markovian open quantum systems are well modeled by the Lindblad Master Equation (ME) $\\frac{\\mathrm{d}}{\\mathrm{d} t} \\rho_t = \\mathcal{L} \\rho_t$, where $\\mathcal{L}$ is a linear (super-)operator and $\\rho_t$ is the system state, a positive matrix. When designing or characterizing a quantum system, one is usually interested in the steady state $\\rho_\\infty$ (such that $\\mathcal{L} \\rho_\\infty = 0$), the first few excited states, and trajectories $t\\mapsto \\rho_t$. In finite dimension, $\\rho_t$ is an $n\\times n$ matrix, $\\mathcal{L}$ thus typically costs $n^4$ to store explicitly as a dense matrix, and $O(n^6)$ to diagonalize or invert exactly, making standard linear algebraic techniques expensive for large systems. However, $\\mathcal{L}$ usually costs only $O(n^3)$ to apply. This makes iterative methods appealing, but they do not work without a good preconditioner. In this article, our main observation is that a part of the Lindblad equation, corresponding to the so-called no-jump evolution $\\mathcal{S}$, can be inverted efficiently. Using this inverse map, we introduce an auxiliary completely positive trace-preserving (CPTP) map $\\Phi$ whose fixed point is directly related to $\\rho_\\infty$, all the other eigenvalues having smaller magnitude. The map $\\Phi$ is thus well suited to iterative methods, and $\\rho_\\infty$ can be found in a few Arnoldi iterations. Using the same inverse map $\\mathcal{S}^{-1}$ as preconditioner, we compute the low-lying spectrum efficiently via shift-invert Arnoldi, and, as a proof of concept, build an implicit time integrator that is competitive on stiff systems in the low-precision regime. For the steady-state and low excited states problems, our methods scale like $O(n^3)$ per iteration and offer state-of-the-art performance on CPU and GPU.", "url": "https://arxiv.org/abs/2608.30860", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gaspard Beugnot"}, {"name": "Paul Gregory"}, {"name": "Rémi Robin"}, {"name": "Antoine Tilloy"}], "featured_authors": [{"name": "Gaspard Beugnot"}, {"name": "Paul Gregory"}, {"name": "Rémi Robin"}, {"name": "Antoine Tilloy"}], "author_count": 4}, {"id": "2608.30937", "category": "quant-ph", "title": "Constrained minimax approximation for quantum signal processing", "abstract": "Quantum signal processing (QSP) provides a simple and efficient framework for implementing polynomial transformations using quantum circuits. Its classical design stage leads to a constrained minimax approximation problem: find a polynomial of prescribed parity that approximates a target function uniformly on a fitting set while remaining bounded in magnitude by one on the domain $[0,1]$, which can be viewed as a semi-infinite constraint. Discretization converts the problem into a linear program, but feasibility at a set of finitely many sampled points does not ensure feasibility on the whole domain, especially when an optimal approximant reaches the boundary of the feasible set. We investigate two approaches to address this difficulty. A Remez exchange method combined with active-set constraint enforcement is efficient on many tested instances, but its stability depends on the target and problem geometry. We then introduce nonlinear Fourier retraction, which uses QSP completion and phase synthesis to turn a nearly feasible polynomial into phase factors for a feasible QSP polynomial without increasing the degree. Across representative problems, retraction largely preserves approximation accuracy and remains effective on instances where the Remez heuristic is unstable. The resulting workflow connects classical minimax approximation and semi-infinite optimization with nonlinear Fourier analysis, and is implemented in the qsppack software package.", "url": "https://arxiv.org/abs/2608.30937", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yulong Dong"}, {"name": "James B. Larsen"}, {"name": "Lin Lin"}, {"name": "Rahul Sarkar"}], "featured_authors": [{"name": "Yulong Dong"}, {"name": "James B. Larsen"}, {"name": "Lin Lin"}, {"name": "Rahul Sarkar"}], "author_count": 4}, {"id": "2608.31011", "category": "quant-ph", "title": "Protected Logical Qudits in Kitaev Quantum Double Models via Stable Representations", "abstract": "Fault-tolerant quantum computation requires robust protection of encoded quantum information. In this work, we develop a representation-theoretic framework for constructing protected logical qudits in finite-group Kitaev quantum double models. By introducing $\\varepsilon$-stable irreducible representations, we establish a necessary and sufficient existence criterion and derive ribbon--projector commutation relations that yield a $d$-dimensional protected logical subspace. We apply this construction to symmetric and alternating groups, obtaining logical qubits for $S_n$ ($n\\ge 3$) and a logical qutrit for $A_4$. Moreover, the family $(\\mathbb Z_2)^d\\rtimes\\mathbb Z_d$ realizes protected logical qudits of arbitrary dimension $d\\ge 2$. Finally, for $D(A_4)$, we describe a scheme for universal logical qutrit computation using ribbon-based logical operations.", "url": "https://arxiv.org/abs/2608.31011", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Naihong Hu"}, {"name": "Futao Wang"}], "featured_authors": [{"name": "Naihong Hu"}, {"name": "Futao Wang"}], "author_count": 2}, {"id": "2608.31081", "category": "quant-ph", "title": "Deterministic Minimum-Output-Entropy Nonadditivity via Haagerup's Inequality and Near-Free Permutation Representations", "abstract": "We give a deterministic realization of the finite-dimensional quadratic certificate underlying Collins's mixed-unitary proof of minimum-output-entropy nonadditivity. For every fixed integer $K\\ge 2$ and rational $\\eta>0$ satisfying $\\log K>2(3+\\eta)^2$, a deterministic polynomial-time algorithm, for every sufficiently large target size $N$, outputs $K$ permutations on $N'=N+o_{K,\\eta}(N)$ points. Restricting their permutation matrices to the nontrivial standard representation yields real orthogonal Stinespring blocks and a channel $\\Phi_{N'}:M_{N'-1}(\\mathbb{C})\\to M_K(\\mathbb{C})$ such that \\[ 2H_{\\min}(\\Phi_{N'}) -H_{\\min}(\\Phi_{N'}^{\\otimes 2}) \\ge \\frac{\\log K}{K} -2\\log\\left(1+\\frac{(3+\\eta)^2}{K}\\right) >0. \\] The construction combines Haagerup's length-two inequality with the simultaneous deterministic spectral approximation of O'Donnell and Wu. We further show that the constant $3$ is asymptotically sharp on the relevant Hermitian zero-diagonal coefficient class and that the finite spectral transfer is nearly saturated, thereby isolating the finer geometry of the full output body as the natural next level of refinement beyond the scalar-radius method. Finally, a standard covariant extension converts the same deterministic entropy gap exactly into self-tensor superadditivity of the one-shot Holevo quantity.", "url": "https://arxiv.org/abs/2608.31081", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Guocheng Zhen"}, {"name": "Chengkai Zhu"}, {"name": "Ranyiliu Chen"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Guocheng Zhen"}, {"name": "Chengkai Zhu"}, {"name": "Ranyiliu Chen"}, {"name": "Xin Wang"}], "author_count": 4}, {"id": "2608.31112", "category": "quant-ph", "title": "Unconditional Certified Randomness without Structure", "abstract": "We obtain a certified randomness protocol in the quantum random oracle model. The protocol is non-interactive and publicly verifiable with a classical verifier, and is based on Yamakawa and Zhandry's proof of quantumness [JACM'24]. We prove unconditional security of this protocol against adversaries making subexponentially-many adaptive quantum queries to the random oracle. Prior work on certified randomness relative to a random oracle additionally assumed the Aaronson--Ambainis conjecture or proved security only against low query-depth adversaries.", "url": "https://arxiv.org/abs/2608.31112", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrea Coladangelo"}, {"name": "Dakshita Khurana"}, {"name": "Saachi Mutreja"}, {"name": "Bhaskar Roberts"}, {"name": "Joseph Slote"}, {"name": "Avishay Tal"}], "featured_authors": [{"name": "Andrea Coladangelo"}, {"name": "Dakshita Khurana"}, {"name": "Saachi Mutreja"}, {"name": "Bhaskar Roberts"}, {"name": "Joseph Slote"}, {"name": "Avishay Tal"}], "author_count": 6}, {"id": "2608.31156", "category": "quant-ph", "title": "Bosonic codes from compact phase spaces", "abstract": "We present the algebraic structure of bosonic quantum error-correcting codes on genus-two Riemann surfaces. We explicitly construct the code words as automorphic forms and analytically generate the full tower of code spaces at all weights. We prove a fundamental no-go theorem: for any genus greater than one, the stabilizer group is non-amenable, forcing a strictly positive spectral gap in the stabilizer Hamiltonian. Consequently, no normalizable quantum state can satisfy all stabilizer conditions. This sharply contrasts with standard Gottesman-Kitaev-Preskill (GKP) codes, where the amenability of the stabilizer group $\\mathbb{Z}^2$ permits approximate code words with arbitrary precision.", "url": "https://arxiv.org/abs/2608.31156", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "David Roberts"}, {"name": "Aaron Slipper"}, {"name": "Alireza Parhizkar"}, {"name": "Victor V. Albert"}, {"name": "Mohammad Hafezi"}], "featured_authors": [{"name": "David Roberts"}, {"name": "Aaron Slipper"}, {"name": "Alireza Parhizkar"}, {"name": "Victor V. Albert"}, {"name": "Mohammad Hafezi"}], "author_count": 5}, {"id": "2608.31165", "category": "quant-ph", "title": "Efficient search for excitable zero-modes in constrained systems", "abstract": "Kinetically constrained systems, such as those representing Rydberg atom arrays in the blockade regime, have gathered considerable attention due to the presence of atypical eigenstates in their spectrum. The latter manifests itself through the presence of quantum many-body scars as well as unusually large zero-mode (ZM) subspaces which contain analytically tractable eigenstates with various entanglement scalings. In particular, some of the latter are excitable zero-modes (EZMs), meaning that they can be promoted to a non-zero energy for open boundary conditions. In this work, I present an efficient protocol for finding analytical expressions for translation-invariant EZMs in constrained systems, based on the eigendecomposition of the local unconstrained Hamiltonian. I demonstrate the power of this method on a decorated Rydberg chain. In that model, my protocol directly produces a continuous matrix-product-state manifold located entirely in the zero-energy eigenspace for periodic boundary conditions. The span of that manifold grows exponentially with the system, and for odd system sizes it covers the entire zero-momentum eigenspace with zero energy. I then show how the physical structure of the manifold, which is tied to the local eigenbasis, also allows one to derive analytical expressions for ZMs at non-zero momentum and for a polynomial number of exact scars at $E=\\pm\\sqrt{3}$.", "url": "https://arxiv.org/abs/2608.31165", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jean-Yves Desaules"}], "featured_authors": [{"name": "Jean-Yves Desaules"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
