tum information-theoretic techniques when restricting the input states to Gaussian states of light.", "url": "https://arxiv.org/abs/2608.03549", "type": "理论", "summary": "光的引力频移在经典电磁学理论中得到了很好的理解。然而，它在量子理论中的描述尚未完全成熟。最近的工作指出了先前开发的模型中的不一致之处，这些模型旨在将引力红移描述为作用于光模式的有效多模混合器（MMM），但是尚未获得问题的完整解决方案。在这里，我们确定了 MMM 模型不一致的根本原因，并提供了两种互补的方法来纠正它：一种是从场论角度来看的“自然”方法，另一种是适应有限维系统量子力学语言的方法。我们表明，第二种方法允许将多模传输设置中的红移建模为量子通道，当将输入状态限制为光的高斯态时，可以使用标准量子信息论技术来表征该通道。", "authors": [{"name": "Thomas Mieling"}, {"name": "Andreas Wolfgang Schell"}, {"name": "David Edward Bruschi"}], "featured_authors": [{"name": "Thomas Mieling"}, {"name": "Andreas Wolfgang Schell"}, {"name": "David Edward Bruschi"}], "author_count": 3}, {"id": "2608.03634", "category": "quant-ph", "title": "Entangling Topological Invariants", "abstract": "An isolated occupied multiplet may admit local tensor-product descriptions without a globally consistent subsystem structure. We characterize the obstruction by comparing the transition functions of the occupied multiplet with those generated by independent basis changes in the two candidate subsystems. When a decomposition into rank-one sectors over a closed surface is specified, the resulting quotient removes row- and column-additive Chern data and yields mixed Chern classes. Momentum-dependent mixing of the sector labels adds the Gauss--Codazzi curvature of the moving lines, while in the label-conserving limit the mixed class is measured by a crossed Thouless pump. When only the factor dimensions $p$ and $q$ are specified, the comparison is made at the level of the clutching map of a rank-$pq$ bundle over $S^4$. Product frames generate winding numbers in $q\\mathbb Z+p\\mathbb Z$, so global factorization is possible exactly when $C_2$ is divisible by $\\gcd(p,q)$; in particular, odd $C_2$ obstructs a $2\\times2$ factorization. We illustrate the two settings with finite eight-level Hamiltonians and give pumping and occupied-projector tomography protocols for their readout.", "url": "https://arxiv.org/abs/2608.03634", "type": "理论", "summary": "孤立的占据多重态可以允许局部张量积描述，而无需全局一致的子系统结构。我们通过将占用多重态的转换函数与两个候选子系统中独立基变化生成的转换函数进行比较来表征阻塞。当指定在封闭表面上分解为一阶扇区时，所得的商将删除行和列相加的 Chern 数据并产生混合 Chern 类。扇区标签的动量相关混合增加了移动线的高斯-科达齐曲率，而在标签守恒极限中，混合类通过交叉 Thouless 泵来测量。当仅指定因子维度 $p$ 和 $q$ 时，将在 $S^4$ 上的排名 $pq$ 束的抓图级别进行比较。乘积框架在 $q\\mathbb Z+​​p\\mathbb Z$ 中生成绕数，因此当 $C_2$ 能被 $\\gcd(p,q)$ 整除时，全局因式分解是可能的；特别是，奇数 $C_2$ 会阻碍 $2\\times2$ 分解。我们用有限八级哈密顿量说明了这两种设置，并给出了泵浦和占用投影仪断层扫描协议以供其读出。", "authors": [{"name": "Kazuki Ikeda"}, {"name": "Yaron Oz"}], "featured_authors": [{"name": "Kazuki Ikeda"}, {"name": "Yaron Oz"}], "author_count": 2}, {"id": "2608.03656", "category": "quant-ph", "title": "Iterative linear quadratic regulator on SU(N) for multi-qubit gate synthesis", "abstract": "In quantum optimal control theory, gradient-based trajectory optimization techniques have proven versatile in designing multi-qubit quantum gates. Furthermore, incorporating the underlying Lie-group structure can accelerate the optimization process. In this work, we adapt the Lie-group formulation of the iterative linear quadratic regulator (iLQR) to the special unitary group SU(N) and apply it to quantum gate synthesis, systematically comparing it against the standard Euclidean iLQR formulation across multiple two- to five-qubit gates. We find that in the idealized, unconstrained setting, where all Lie-algebra basis elements are available as drive Hamiltonian terms, the Lie-group formulation converges faster than the Euclidean iLQR formulation. If drive terms are constrained to 2-local Hamiltonian terms, the Lie-group variant converges faster in early optimization iterations, but exhibits greater sensitivity to initialization and a stronger tendency towards local minima. These results demonstrate that incorporating Lie-group geometry into iLQR substantially improves convergence and highlight important next steps for improvements in constrained control settings.", "url": "https://arxiv.org/abs/2608.03656", "type": "理论+数值", "summary": "在量子最优控制理论中，基于梯度的轨迹优化技术已被证明在设计多量子位量子门方面具有通用性。此外，结合底层李群结构可以加速优化过程。在这项工作中，我们将迭代线性二次调节器 (iLQR) 的李群公式应用于特殊酉群 SU(N) 并将其应用于量子门合成，系统地将其与跨多个 2 至 5 量子位门的标准欧几里得 iLQR 公式进行比较。我们发现，在理想化、无约束的环境中，所有李代数基本元素都可用作驱动哈密顿项，李群公式比欧几里得 iLQR 公式收敛得更快。如果驱动项被限制为 2 局部哈密顿项，则李群变体在早期优化迭代中收敛得更快，但对初始化表现出更大的敏感性，并且更倾向于局部最小值。这些结果表明，将李群几何合并到 iLQR 中可以显着提高收敛性，并强调了改进约束控制设置的重要后续步骤。", "authors": [{"name": "Dirk Heimann"}, {"name": "Felix Wiebe"}, {"name": "Elie Mounzer"}, {"name": "Shivesh Kumar"}], "featured_authors": [{"name": "Dirk Heimann"}, {"name": "Felix Wiebe"}, {"name": "Elie Mounzer"}, {"name": "Shivesh Kumar"}], "author_count": 4}, {"id": "2608.03698", "category": "quant-ph", "title": "Fidelity-Based Robustness Margins for Finite-Time Quantum Control", "abstract": "We develop a structure-specific fidelity-threshold robustness margin for finite-dimensional closed quantum systems under piecewise-constant coherent control. A scalar physical parameter may perturb the drift, a control Hamiltonian, or another declared Hamiltonian component across the control horizon. A differential sensitivity bound for trace-amplitude gate fidelity yields a threshold-dependent Lipschitz constant on the connected safe parameter component and hence a certified finite perturbation radius. Recentering this certificate produces an iterative one-dimensional method that takes certified safe steps toward the first fidelity-threshold boundary in either parameter direction. A three-qubit gate-control example shows that these finite margins vary by up to a factor of three across controllers of comparable nominal fidelity and contain structure-dependent information not captured by nominal differential sensitivity alone.", "url": "https://arxiv.org/abs/2608.03698", "type": "理论", "summary": "我们为分段常数相干控制下的有限维封闭量子系统开发了一种结构特定的保真度阈值鲁棒性裕度。标量物理参数可能会扰乱控制范围内的漂移、控制哈密顿量或另一个声明的哈密顿量。迹线幅度门保真度的差分灵敏度界限在连接的安全参数分量上产生阈值相关的 Lipschitz 常数，从而产生经过认证的有限扰动半径。重新定位此证书会产生迭代一维方法，该方法在任一参数方向上采取经过认证的安全步骤朝向第一个保真度阈值边界。三量子位门控制示例表明，这些有限裕度在具有可比标称保真度的控制器之间变化高达三倍，并且包含仅由标称微分灵敏度无法捕获的结构相关信息。", "authors": [{"name": "S. P. O'Neil"}, {"name": "F. C. Langbein"}, {"name": "C. A. Weidner"}, {"name": "E. A. Jonckheere"}, {"name": "S. Schirmer"}], "featured_authors": [{"name": "S. P. O'Neil"}, {"name": "F. C. Langbein"}, {"name": "C. A. Weidner"}, {"name": "E. A. Jonckheere"}, {"name": "S. Schirmer"}], "author_count": 5}, {"id": "2608.03710", "category": "quant-ph", "title": "Entanglement Distillation of some Rank-Five Symmetric NPT States in Two-Qutrit Systems", "abstract": "Entanglement distillation is a fundamental task in quantum information processing. In this work, we investigate the distillability properties of a class of two-qutrit symmetric NPT states of rank five. We resolve the 1-distillability problem for this class by proving that the previously open interval of the eigenvalue parameter is 1-undistillable. For the 2-distillability, we uncover a structural obstruction showing that no Schmidt-rank-two vector has a negative expectation in the relevant subspace. We also perform numerical investigations to explore the 2-distillability beyond this obstruction.", "url": "https://arxiv.org/abs/2608.03710", "type": "理论+数值", "summary": "纠缠蒸馏是量子信息处理中的一项基本任务。在这项工作中，我们研究了一类五阶二元对称 NPT 态的可蒸馏性。我们通过证明特征值参数的先前开区间是 1-不可蒸馏来解决此类的 1-可蒸馏问题。对于 2-可蒸馏性，我们发现了一个结构障碍，表明没有施密特二阶向量在相关子空间中具有负期望。我们还进行了数值研究，以探索超出此障碍的二次蒸馏性。", "authors": [{"name": "Yuwei Lei"}, {"name": "Zihua Song"}, {"name": "Lin Chen"}, {"name": "Mingju Liu"}], "featured_authors": [{"name": "Yuwei Lei"}, {"name": "Zihua Song"}, {"name": "Lin Chen"}, {"name": "Mingju Liu"}], "author_count": 4}, {"id": "2608.03777", "category": "quant-ph", "title": "Optimal and Deterministic Quantum Search on the Simplex of Complete Graphs", "abstract": "The simplex of complete graphs, also known as the first-order truncated simplex lattice, is a network of $M+1$ identical complete graphs, each with $M$ vertices, such that each clique contains an edge or bridge to every other clique. It contains $N = M(M+1)$ vertices, and previous asymptotic results using a continuous-time quantum walk to search this graph for a single marked vertex have either numerically demonstrated an optimal runtime of $O(\\sqrt{N})$, or analytically proved a deterministic success probability of 1, but not both, even when the bridges are weighted. In this paper, we give the first analytical proof of optimal quantum search on this graph, proving that it occurs when the weight of the bridges equals $M$. In addition, we numerically show that the optimal runtime is achieved more broadly whenever the weight is at least $\\sqrt{M}$. Furthermore, the algorithm is also deterministic when the weight scales between $\\sqrt{M}$ and $M$, and this is the first example of quantum search on the simplex of complete graphs that is both asymptotically optimal and deterministic. In addition, for weights where the algorithm is nondeterministic, we give a way to find the marked vertex by inspecting neighboring vertices. Finally, while it is known that connectivity is not a reliable indicator of fast quantum search when comparing different graph families, we show that it is also unreliable within the graph family of weighted simplex of complete graphs.", "url": "https://arxiv.org/abs/2608.03777", "type": "理论+数值", "summary": "完全图单纯形，也称为一阶截断单纯形格，是 $M+1$ 个相同完全图的网络，每个图都有 $M$ 个顶点，这样每个派都包含一条边或连接到其他每个派的桥。它包含 $N = M(M+1)$ 个顶点，并且之前使用连续时间量子行走在该图中搜索单个标记顶点的渐近结果要么在数值上证明了 $O(\\sqrt{N})$ 的最佳运行时间，要么在分析上证明了确定性成功概率为 1，但不能同时证明两者，即使桥被加权也是如此。在本文中，我们在该图上给出了最优量子搜索的第一个分析证明，证明当桥的重量等于 $M$ 时就会发生这种情况。此外，我们通过数值表明，只要权重至少为 $\\sqrt{M}$，就能更广泛地实现最佳运行时间。此外，当权重在 $\\sqrt{M}$ 和 $M$ 之间缩放时，该算法也是确定性的，这是在完全图单纯形上进行量子搜索的第一个例子，它既是渐近最优的又是确定性的。\n\n此外，对于算法不确定的权重，我们提供了一种通过检查相邻顶点来查找标记顶点的方法。最后，虽然众所周知，在比较不同图族时连通性并不是快速量子搜索的可靠指标，但我们表明它在完全图的加权单纯形图族中也是不可靠的。", "authors": [{"name": "Kiyoji Huang Fujiwara"}, {"name": "Yujia Shi"}, {"name": "Thomas G. Wong"}], "featured_authors": [{"name": "Kiyoji Huang Fujiwara"}, {"name": "Yujia Shi"}, {"name": "Thomas G. Wong"}], "author_count": 3}, {"id": "2608.03824", "category": "quant-ph", "title": "Impossibility of Perfectly Complete Many-Round Key Agreement in the QROM", "abstract": "This paper proves that it is impossible to construct perfectly complete quantum key agreement protocols (QKA) from quantumly secure one-way functions (OWFs) in a black-box manner. Specifically, consider any protocol in which Alice and Bob exchange only classical messages, make at most $q_{\\mathsf{A}}$ and $q_{\\mathsf{B}}$ quantum queries, respectively, to a Boolean-valued random oracle, and agree on a shared key with certainty. This paper shows that there exists an eavesdropper, given the classical messages, that can recover the shared key with certainty using $O((q_{\\mathsf{A}}+q_{\\mathsf{B}})^5)$ classical oracle queries. The bound is independent of the number of rounds, transcript length, key length, and oracle-domain size. Previous results only applies to two-round key agreement (Li et al. CRYPTO 26) or relies on unproven conjectures (Austrin et al. CRYPTO 22). GPT-5.6 Sol Ultra found this proof in a one-shot conversation and drafted a preliminary version of this paper. The authors are fully responsible for the correctness, writing and discussions of this paper.", "url": "https://arxiv.org/abs/2608.03824", "type": "理论", "summary": "本文证明不可能以黑盒方式从量子安全单向函数（OWF）构建完美完整的量子密钥协商协议（QKA）。具体来说，考虑任何协议，其中 Alice 和 Bob 仅交换经典消息，分别对布尔值随机预言机进行最多 $q_{\\mathsf{A}}$ 和 $q_{\\mathsf{B}}$ 量子查询，并确定地就共享密钥达成一致。本文表明，存在一个窃听者，在给定经典消息的情况下，可以使用 $O((q_{\\mathsf{A}}+q_{\\mathsf{B}})^5)$ 经典预言机查询确定地恢复共享密钥。该界限与轮数、转录本长度、密钥长度和预言域大小无关。之前的结果仅适用于两轮密钥协商（Li et al. CRYPTO 26）或依赖于未经证实的猜想（Austrin et al. CRYPTO 22）。 GPT-5.6 Sol Ultra 在一次对话中找到了这个证明，并起草了本文的初步版本。作者对本文的正确性、写作和讨论负全部责任。", "authors": [{"name": "Longcheng Li"}, {"name": "Qian Li"}, {"name": "Xingjian Li"}, {"name": "Qipeng Liu"}], "featured_authors": [{"name": "Longcheng Li"}, {"name": "Qian Li"}, {"name": "Xingjian Li"}, {"name": "Qipeng Liu"}], "author_count": 4}, {"id": "2608.03825", "category": "quant-ph", "title": "CNOT-Distance is NP-complete under all-to-all connectivity", "abstract": "Given $A\\in\\operatorname{GL}(N,2)$ and an integer $K$, we ask whether $A$ can be implemented by at most $K$ CNOT gates on fixed labelled wires with all-to-all connectivity. We prove that this problem is NP-complete. From a finite simple graph $G=(V,E)$, we construct an upper-unitriangular matrix $A_G\\in\\operatorname{GL}(2|V|+|E|+1,2)$ satisfying $\\ell_{\\mathrm{CNOT}}(A_G)=2|V|+2|E|+\\tau(G)$, where $\\tau(G)$ is the minimum vertex-cover size. Each target matrix has $O(N)$ nonzero entries and row Hamming weight at most four. The lower bound unfolds an arbitrary CNOT circuit into an XOR directed acyclic graph and applies projection--contraction operations, allowing cancellation and unrestricted reuse of intermediate parities. For this family, the optimum is unchanged by any finite number of clean or borrowed ancillary wires that must be restored. A polynomial-time decoder further yields NP-hardness of approximation within every fixed additive constant and, through an L-reduction from Minimum Vertex Cover on cubic graphs, APX-hardness of the associated CNOT-circuit optimisation problem.", "url": "https://arxiv.org/abs/2608.03825", "type": "理论", "summary": "给定 $A\\in\\operatorname{GL}(N,2)$ 和整数 $K$，我们询问 $A$ 是否可以通过具有全对全连接的固定标记线上至多 $K$ CNOT 门来实现。我们证明这个问题是NP完全问题。从有限简单图$G=(V,E)$，我们构造一个上单位三角矩阵$A_G\\in\\operatorname{GL}(2|V|+|E|+1,2)$，满足$\\ell_{\\mathrm{CNOT}}(A_G)=2|V|+2|E|+\\tau(G)$，其中$\\tau(G)$是最小顶点覆盖大小。每个目标矩阵都有 $O(N)$ 非零条目和最多四个行汉明权重。下界将任意 CNOT 电路展开为 XOR 有向无环图，并应用投影-收缩操作，允许取消和无限制地重用中间奇偶校验。对于这个系列，最佳值不会因必须恢复的任何有限数量的干净或借用的辅助电线而改变。多项式时间解码器进一步在每个固定加性常数内产生近似的 NP 硬度，并通过三次图上最小顶点覆盖的 L 约简，产生相关 CNOT 电路优化问题的 APX 硬度。", "authors": [{"name": "Antonio Acuaviva"}, {"name": "Arturo Acuaviva"}, {"name": "Pablo Acuaviva"}], "featured_authors": [{"name": "Antonio Acuaviva"}, {"name": "Arturo Acuaviva"}, {"name": "Pablo Acuaviva"}], "author_count": 3}, {"id": "2608.03865", "category": "quant-ph", "title": "Interplay between teleportation fidelity and basis-independent coherence in maximally sliced states under decoherence", "abstract": "The influence of environmental decoherence on quantum teleportation is investigated by considering the three-qubit Maximally Sliced (MS) state as the shared entangled resource. Using the Kraus operator formalism, analytical expressions are derived for the teleportation fidelity under amplitude damping and phase damping channels. The corresponding basis-independent coherence is obtained, establishing explicit analytical relations between coherence and teleportation fidelity under both decoherence mechanisms. The results are further expressed in terms of the Coffman-Kundu-Wootters (CKW) three-tangle, thereby connecting genuine tripartite entanglement with teleportation performance. The analysis reveals distinct effects of the two noise channels: amplitude damping introduces a state-dependent threshold for achieving quantum teleportation, whereas phase damping preserves the quantum advantage until complete dephasing. These results provide a unified analytical framework for understanding the interplay among multipartite entanglement, quantum coherence and teleportation in noisy three-qubit MS states.", "url": "https://arxiv.org/abs/2608.03865", "type": "理论", "summary": "通过将三量子位最大切片（MS）状态视为共享纠缠资源，研究了环境退相干对量子隐形传态的影响。使用 Kraus 算子形式，导出了幅度阻尼和相位阻尼通道下隐形传态保真度的解析表达式。获得了相应的基无关相干性，在两种退相干机制下建立了相干性和隐形传输保真度之间的明确分析关系。结果进一步用 Coffman-Kundu-Wootters (CKW) 三纠缠表示，从而将真正的三方纠缠与隐形传态性能联系起来。分析揭示了两个噪声通道的不同影响：振幅阻尼引入了用于实现量子隐形传态的状态相关阈值，而相位阻尼则保留了量子优势，直到完全移相。这些结果提供了一个统一的分析框架，用于理解多部分纠缠、量子相干性和噪声三量子位 MS 态中的隐形传态之间的相互作用。", "authors": [{"name": "Anushree Pandey"}, {"name": "Sovik Roy"}], "featured_authors": [{"name": "Anushree Pandey"}, {"name": "Sovik Roy"}], "author_count": 2}, {"id": "2608.03873", "category": "quant-ph", "title": "High-level quantum structured programs as quantum registers compositions", "abstract": "Current quantum programs are mainly designed at the level of quantum gates acting on individual qubits; on a large scale and for complex problems this may involve a high cognitive load on the programmer, making the program specification nontrivial and error-prone. In this context, providing quantum programming with higher abstraction mechanisms will assist in making this task more manageable and robust against design errors. In this work, a conceptual framework is addressed following the notion of the whole quantum computation as a structure composed of quantum registers representing each an undivided entity. Thus, computation progresses through semantically well-defined transformations that act on, or entangle, quantum registers, thereby modifying the global state. Ultimately, the program reaches the desired state by following a specific composition strategy. With this in mind, high-level syntax is presented through an algebraic formalism that bridges them with their low-level semantics. Proposed syntax is based on certain well-know operations used on quantum algorithms that apply phase shifts upon logical condition satisfaction or leverage on parallel evaluation. Based solely on the formalized operations, a quantum satisfiability modulo theories (SMT) solver can be designed. At its core, this work contributes to establishing some methodological principles towards realizing a high-level quantum structured programming.", "url": "https://arxiv.org/abs/2608.03873", "type": "理论+数值", "summary": "目前的量子程序主要是在作用于单个量子位的量子门层面进行设计；对于大规模和复杂的问题，这可能会给程序员带来很高的认知负担，从而使程序规范变得不平凡且容易出错。在这种情况下，为量子编程提供更高的抽象机制将有助于使该任务更易于管理，并且针对设计错误更稳健。在这项工作中，按照整个量子计算作为由代表每个不可分割实体的量子寄存器组成的结构的概念来解决概念框架。因此，计算通过语义上明确定义的转换进行，这些转换作用于或纠缠量子寄存器，从而修改全局状态。最终，程序通过遵循特定的组合策略达到所需的状态。考虑到这一点，高级语法是通过代数形式主义来呈现的，将它们与低级语义联系起来。所提出的语法基于量子算法中使用的某些众所周知的操作，这些操作在逻辑条件满足时应用相移或利用并行评估。\n\n仅基于形式化运算，可以设计量子可满足性模理论（SMT）求解器。从本质上讲，这项工作有助于建立一些实现高级量子结构化编程的方法原则。", "authors": [{"name": "David Chamizo"}, {"name": "Jose Garcia-Alonso"}, {"name": "Juan M. Murillo"}], "featured_authors": [{"name": "David Chamizo"}, {"name": "Jose Garcia-Alonso"}, {"name": "Juan M. Murillo"}], "author_count": 3}, {"id": "2608.03944", "category": "quant-ph", "title": "Exact Tradeoff Between Quantum Error Correction and Quantum Darwinism: An Information-Theoretic No-Go Theorem", "abstract": "Quantum error correction (QEC) and Quantum Darwinism describe opposing consequences of system-environment interactions: QEC seeks to preserve logical quantum information, whereas Quantum Darwinism explains the emergence of objective classical information through its proliferation into the environment. Despite their common physical origin, no direct quantitative connection between these paradigms has previously been established. We introduce an exactly solvable block-environment model based on the logical GHZ block of the Shor [[9,1,3]] quantum error-correcting code, collectively coupled to N environment qubits. The logical fidelity, Holevo information, and Darwinistic redundancy are obtained systematically for arbitrary environment size and imperfect recovery efficiency. Eliminating the common decoherence parameter yields an exact tradeoff relating Darwinistic redundancy directly to the post-recovery logical fidelity, demonstrating that the emergence of redundant classical records occurs at the expense of logical quantum information. We further prove a model-independent no-go theorem showing that the logical fidelity exceeds a critical threshold precludes the emergence of Darwinistic redundancy, irrespective of the microscopic Hamiltonian or environment structure. The solvable model saturates this general bound, establishing the first quantitative information-theoretic connection between logical quantum information protection and the emergence of redundant classical records.", "url": "https://arxiv.org/abs/2608.03944", "type": "理论", "summary": "量子纠错（QEC）和量子达尔文主义描述了系统与环境相互作用的相反后果：QEC寻求保留逻辑量子信息，而量子达尔文主义解释了客观经典信息通过扩散到环境中的出现。尽管它们具有共同的物理起源，但之前尚未建立这些范式之间的直接定量联系。我们引入了一种基于 Shor [[9,1,3]] 量子纠错码的逻辑 GHZ 块的精确可解块环境模型，共同耦合到 N 个环境量子位。对于任意环境大小和不完美的恢复效率，系统地获得了逻辑保真度、Holevo 信息和达尔文冗余。消除常见的退相干参数会产生将达尔文冗余直接与恢复后逻辑保真度相关联的精确权衡，证明冗余经典记录的出现是以牺牲逻辑量子信息为代价的。\n\n我们进一步证明了一个与模型无关的不可行定理，该定理表明，无论微观哈密顿量或环境结构如何，逻辑保真度超过临界阈值都会阻止达尔文冗余的出现。可解模型饱和了这个一般界限，在逻辑量子信息保护和冗余经典记录的出现之间建立了第一个定量信息理论联系。", "authors": [{"name": "Arghya Maity"}, {"name": "Kelvin Onggadinata"}, {"name": "Teck Seng Koh"}], "featured_authors": [{"name": "Arghya Maity"}, {"name": "Kelvin Onggadinata"}, {"name": "Teck Seng Koh"}], "author_count": 3}, {"id": "2608.03962", "category": "quant-ph", "title": "Separating quantum circuits from classical LLMs", "abstract": "Modern large language models - transformers and diffusion language models - are built around two canonical algorithmic tasks: prediction and generation. We prove unconditional separations between low-depth quantum computation and the corresponding bounded-resource classical language-model architectures in both regimes. Concretely, we exhibit the following: 1. Distributional separation. We give a distribution that is sampleable by $\\textsf{QNC}^0$ circuits (i.e., a family of constant-depth quantum circuits consisting of bounded fan-in gates) that no constant-round diffusion language model ($\\textsf{DLM}$) with shallow scheduling and denoising can sample within constant distance, even when allowed sublinear chain-of-thought and output-token revision/remasking events, the very features modern $\\textsf{DLM}$s rely on. 2. Functional separation. We exhibit a function computable in $\\land \\circ \\textsf{QNC}^0[\\log\\log n]$ (i.e., a family of O$(\\log\\log n)$-depth $\\textsf{QNC}^0$ circuits, where $n$ is the input length, followed by a single classical $\\mathsf{AND}$ gate) such that any constant-depth decoder-only transformer computing the function must be large: it would have to have width $n^{\\Omega(1)}$. Together, our work initiates the study of quantum advantage in the era of large language models.", "url": "https://arxiv.org/abs/2608.03962", "type": "理论+数值", "summary": "现代大型语言模型（变压器和扩散语言模型）是围绕两个规范的算法任务构建的：预测和生成。我们证明了两种体系中低深度量子计算和相应的有限资源经典语言模型架构之间的无条件分离。具体来说，我们表现出以下几点： 1.分布分离。我们给出了一个可通过 $\\textsf{QNC}^0$ 电路（即由有界扇入门组成的恒定深度量子电路系列）采样的分布，即使具有浅层调度和去噪的恒定轮扩散语言模型（$\\textsf{DLM}$）也无法在恒定距离内采样，即使允许亚线性思想链和输出令牌修改/重新屏蔽事件，现代 $\\textsf{DLM}$s 的特征依靠。 2.功能分离。\n\n我们展示了一个可在 $\\land \\circ \\textsf{QNC}^0[\\log\\log n]$ 中计算的函数（即一系列 O$(\\log\\log n)$ 深度 $\\textsf{QNC}^0$ 电路，其中 $n$ 是输入长度，后跟一个经典的 $\\mathsf{AND}$ 门），这样计算该函数的任何恒定深度仅解码器变压器必须很大：它必须具有宽度$n^{\\欧米茄(1)}$。我们的工作共同启动了大型语言模型时代量子优势的研究。", "authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Arkopal Dutt"}, {"name": "Hari Krovi"}, {"name": "Rik Sengupta"}], "featured_authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Arkopal Dutt"}, {"name": "Hari Krovi"}, {"name": "Rik Sengupta"}], "author_count": 4}, {"id": "2608.03987", "category": "quant-ph", "title": "Realified tensor networks: quantum circuit simulation on real-valued matrix accelerators", "abstract": "Tensor-network contraction simulates quantum circuits, but modern matrix accelerators (NPUs, TPUs) expose only real GEMM pipelines, so the complex networks of quantum simulation must be reconstructed in software. We resolve the mismatch by a realification rewrite that maps any complex tensor network to a real one. At each merge of two complex tensors, a rank-3 structure tensor realizes Gauss's three-multiplication (3M) formula; contractions with one or no complex operand need only two or one real products. We prove a tight cost law: overhead $1 + 2m + r$ in real multiplications, where $m$ and $r$ are the volume fractions of two- and one-complex-operand contractions, never exceeding $3\\times$ relative to real contraction, with every intermediate at most doubled in size. On 67 circuits (random, Clifford+$T$, QAOA, VQE), the law holds across the real-to-complex range and complex-gate placement, not count, governs cost. Contraction orders transfer from the complex network with a relative arithmetic-cost gap below $5\\times 10^{-4}$ on 66 of 67 circuits; the exception closes under a few steps of low-temperature simulated annealing. On an Ascend 910 NPU the rewrite beat both the four-real-GEMM baseline and a per-GEMM Gauss lowering on all twelve random circuits and on 52 of 55 structured cells (three cells slower by at most 12\\%); the four-GEMM baseline was slower by a median $1.7\\times$ (random) and $1.4\\times$ (structured). Realification makes complex tensor-network contraction native to real-only matrix engines.", "url": "https://arxiv.org/abs/2608.03987", "type": "数值", "summary": "张量网络收缩模拟量子电路，但现代矩阵加速器（NPU、TPU）仅暴露真实的 GEMM 管道，因此必须在软件中重建量子模拟的复杂网络。我们通过实现重写来解决不匹配问题，将任何复杂的张量网络映射到真实的张量网络。在两个复数张量的每次合并时，一个三阶结构张量实现高斯的三乘（3M）公式；具有一个或没有复杂操作数的收缩仅需要两个或一个实数乘积。我们证明了一个严格的成本定律：实数乘法中的开销为 $1 + 2m + r$，其中 $m$ 和 $r$ 是两个和一个复数操作数收缩的体积分数，相对于实际收缩永远不会超过 $3\\times$，每个中间值的大小最多增加一倍。在 67 个电路（随机、Clifford+$T$、QAOA、VQE）上，该定律适用于实数到复数范围，并且复数门的布局（而不是计数）控制着成本。收缩订单从复杂网络传输，在 67 个电路中的 66 个电路上，相对算术成本差距低于 $5\\times 10^{-4}$；经过几个步骤的低温模拟退火后，异常现象就结束了。\n\n在 Ascend 910 NPU 上，重写在所有 12 个随机电路和 55 个结构化单元中的 52 个上都击败了四实 GEMM 基线和每 GEMM 高斯降低（三个单元最多慢 12%）；四 GEMM 基线的速度中位数较慢 $1.7\\times$（随机）和 $1.4\\times$（结构化）。实现使复杂的张量网络收缩成为纯实数矩阵引擎的本机。", "authors": [{"name": "Yusheng Zhao"}, {"name": "Xiwei Pan"}, {"name": "Enji Xiong"}, {"name": "Chengkai Zhu"}, {"name": "Jinguo Liu"}], "featured_authors": [{"name": "Yusheng Zhao"}, {"name": "Xiwei Pan"}, {"name": "Enji Xiong"}, {"name": "Chengkai Zhu"}, {"name": "Jinguo Liu"}], "author_count": 5}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
