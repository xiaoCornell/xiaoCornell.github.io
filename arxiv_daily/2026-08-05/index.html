  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);

      --muted: #6d5d50;

      --accent: #8f3d2e;
      --accent-2: #1d5f6b;

    }
    * { box-sizing: border-box; }
    body {

      font-family: var(--ui-font);

      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }

    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }

    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }

    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }

    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2608.02722", "category": "cond-mat", "title": "1+1d Lattice Dirac Fermions from Non-Onsite Vector and Axial Symmetries", "abstract": "We construct an exactly solvable Hamiltonian lattice model realizing a 1+1d Dirac fermion, with exact microscopic vector and axial vector $U(1)$ symmetries. The mixed anomaly between these is accommodated by the not-on-site action of the symmetries. Our Hilbert space is a $Z_2$-graded tensor product of local $Z_2$-graded Hilbert spaces which include infinite dimensional rotor degrees of freedom. The Hamiltonian becomes manifestly exactly solvable after a locality-preserving unitary mapping to an equivalent fermionic Villain Hilbert space. Our construction also allows an exactly solvable realization of interacting fermionic Luttinger liquids. At the free Dirac fixed point, our Hamiltonian contains irrelevant interactions, which we compute to leading order.", "url": "https://arxiv.org/abs/2608.02722", "type": "理论", "summary": "我们构建了一个精确可解的哈密顿晶格模型，实现了 1+1d 狄拉克费米子，具有精确的微观矢量和轴矢量 $U(1)$ 对称性。这些之间的混合异常是通过对称性的非现场作用来调节的。我们的希尔伯特空间是局部 $Z_2$ 分级希尔伯特空间的 $Z_2$ 分级张量积，其中包括无限维转子自由度。在将保局性酉映射到等效的费米子 Villain Hilbert 空间之后，哈密顿量显然变得完全可解。我们的结构还允许精确求解相互作用的费米子卢廷格液体。在自由狄拉克不动点，我们的哈密顿量包含不相关的相互作用，我们将其计算为前序。", "authors": [{"name": "Tabin Dharanikota"}, {"name": "Lukasz Fidkowski"}], "featured_authors": [{"name": "Tabin Dharanikota"}, {"name": "Lukasz Fidkowski"}], "author_count": 2}, {"id": "2608.02732", "category": "cond-mat", "title": "Particle-Vortex Duality of Hydrodynamics", "abstract": "Equipped with the recently recognized symmetry structure of mixed states of matter and \"strong-weak spontaneous symmetry breaking\" (SW-SSB), we develop a quantum particle-vortex duality of emergent model-F and model-A hydrodynamics of 2d boson/rotor systems. This duality relation demonstrates that classical hydrodynamics of 2d bosons can be described in terms of the charge symmetry $U(1)_c$, but also equivalently in terms of the dual (emergent) 1-form symmetry $U(1)^{(1)}_e$, as well as $U(1)_v$ associated with the conservation of vortices. This duality provides a bridge between the hydrodynamics of matter and magnetohydrodynamics.", "url": "https://arxiv.org/abs/2608.02732", "type": "理论", "summary": "配备了最近公认的物质混合态的对称结构和“强弱自发对称破缺”（SW-SSB），我们开发了二维玻色子/转子系统的涌现模型F和模型A流体动力学的量子粒子涡对偶性。这种对偶关系表明，二维玻色子的经典流体动力学可以用电荷对称性 $U(1)_c$ 来描述，但也可以等效地用对偶（涌现）1-形式对称性 $U(1)^{(1)}_e$ 以及与涡流守恒相关的 $U(1)_v$ 来描述。这种二元性在物质流体动力学和磁流体动力学之间架起了一座桥梁。", "authors": [{"name": "Cenke Xu"}, {"name": "Matthew P. A. Fisher"}], "featured_authors": [{"name": "Cenke Xu"}, {"name": "Matthew P. A. Fisher"}], "author_count": 2}, {"id": "2608.02744", "category": "cond-mat", "title": "Two-Parameter Ansatz for the Violation of Eigenstate Thermalization", "abstract": "The eigenstate thermalization hypothesis (ETH) provides the prevailing framework for understanding quantum thermalization and ergodicity in isolated many-body systems. Yet, no general theory describes the continuous onset of ETH violation between the conventional ETH and its complete breakdown. Here, we introduce a two-parameter ansatz for the ETH violation that unifies and distinguishes two mechanisms: fading ergodicity and trapped ergodicity. While fading ergodicity captures the established route to ergodicity breaking, trapped ergodicity describes a distinct scenario in which ETH is violated in finite systems but restored in the thermodynamic limit. We test this framework in the spin-1/2 $J_1$-$J_2$ chains with on-site disorder and linear potential. In both cases, we find that the observed ETH violation is consistent with trapped ergodicity.", "url": "https://arxiv.org/abs/2608.02744", "type": "理论", "summary": "本征态热化假说 (ETH) 为理解孤立多体系统中的量子热化和遍历性提供了流行的框架。然而，没有任何通用理论能够描述传统 ETH 与彻底崩溃之间的 ETH 违规行为的持续发生。在这里，我们引入了针对 ETH 违规的双参数 ansatz，它统一并区分了两种机制：衰落遍历性和陷阱遍历性。虽然衰落遍历性捕获了遍历性破坏的既定路线，但陷入遍历性描述了一种独特的场景，其中 ETH 在有限系统中被破坏，但在热力学极限中恢复。我们在具有现场无序和线性势的 spin-1/2 $J_1$-$J_2$ 链中测试该框架。在这两种情况下，我们发现观察到的 ETH 违规行为与陷入遍历性一致。", "authors": [{"name": "Kohei Ohgane"}, {"name": "Lev Vidmar"}], "featured_authors": [{"name": "Kohei Ohgane"}, {"name": "Lev Vidmar"}], "author_count": 2}, {"id": "2608.02753", "category": "cond-mat", "title": "Large scale neural quantum states reveal the interplay between superconductivity and quantum criticality in the Hofstadter-Hubbard model", "abstract": "Understanding how a parent insulating state shapes the superconductivity that emerges upon doping is a long-standing problem dating back to Anderson's resonating-valence-bond proposal. The triangular-lattice Hofstadter-Hubbard model with $\\pi/2$ flux per plaquette offers an ideal setting for this question: at half filling it hosts two distinct parent states---an integer quantum Hall insulator at weak coupling and a chiral spin liquid at intermediate coupling---separated by a topological phase transition. Using neural quantum states on tori of up to $432$ sites, we present strong evidence that the transition is continuous, with a vanishing $2e$ charge gap and critical charge fluctuations. Upon doping, we find a topological superconductor with off-diagonal long-range order consistent with $d+id$ pairing on either side of the transition. The two ingredients of superconductivity, pair formation and phase coherence, respond to the parent state in sharply different ways: while the pairing order parameter remains nearly unchanged across the transition, the superfluid stiffness is strongly enhanced near the critical point. The energy scale of the superconductor is therefore set not by which parent state is doped, but by proximity to the transition between them. Our results establish neural quantum states as a powerful tool for understanding the delicate interplay between long-ranged electronic correlations and superconductivity.", "url": "https://arxiv.org/abs/2608.02753", "type": "理论", "summary": "了解母体绝缘态如何塑造掺杂后出现的超导性是一个长期存在的问题，可以追溯到安德森的共振价键提议。每个小板通量为 $\\pi/2$ 的三角晶格 Hofstadter-Hubbard 模型为这个问题提供了一个理想的设置：在半填充时，它拥有两个不同的母态——弱耦合时的整数量子霍尔绝缘体和中间耦合时的手性自旋液体——通过拓扑相变分开。在高达 432$ 的环面上使用神经量子态，我们提供了强有力的证据，证明过渡是连续的，$2e$ 电荷间隙和临界电荷波动消失。掺杂后，我们发现了一种具有非对角长程有序的拓扑超导体，与过渡两侧的 $d+id$ 配对一致。超导性的两个组成部分，对形成和相位相干性，以截然不同的方式响应母态：虽然配对顺序参数在整个转变过程中几乎保持不变，但超流体刚度在临界点附近强烈增强。\n\n因此，超导体的能级不是由掺杂的母态决定的，而是由它们之间的过渡的接近程度决定的。我们的研究结果将神经量子态确立为理解长程电子相关性和超导性之间微妙相互作用的强大工具。", "authors": [{"name": "Christopher Roth"}, {"name": "Andrew Millis"}, {"name": "Tomohiro Soejima"}], "featured_authors": [{"name": "Christopher Roth"}, {"name": "Andrew Millis"}, {"name": "Tomohiro Soejima"}], "author_count": 3}, {"id": "2608.02832", "category": "cond-mat", "title": "Tunable Skyrmions in a Topological Wigner Crystal", "abstract": "In low density systems with strong interactions electrons are expected to crystallize into a Wigner solid. Recently, advances in two-dimensional systems where electrons carry Berry curvature have added a topological dimension to Wigner crystallization. Using a model for pseudospin interactions in a topological Wigner crystal, here we show that the competition between ferromagnetic Heisenberg exchange $J$ and the chiral interaction $\\gamma$ on the triangular lattice stabilizes a zero-field skyrmion crystal whose density is continuously tunable through the ratio $\\gamma/J$. The chiral interaction originates from finite Berry curvature in an underlying time-reversal broken Wigner crystal. In the continuum limit, the chiral interaction acts as a chemical potential for skyrmions, while higher-order gradient terms beyond the nonlinear sigma model select the skyrmion density. At large chiral coupling, we uncover a 24-site tetra-skyrmion crystal carrying four units of topological charge per magnetic unit cell, which becomes degenerate with four-sublattice tetrahedral order as $J \\to 0$. We characterize the magnon structure for these phases and discuss the transition between the tunable skyrmion crystal to these states at large $\\gamma/J$. Our results establish the phase diagram of ferromagnetic topological Wigner crystals.", "url": "https://arxiv.org/abs/2608.02832", "type": "理论+数值", "summary": "在具有强相互作用的低密度系统中，电子预计会结晶成维格纳固体。最近，电子携带贝里曲率的二维系统的进展为维格纳结晶增加了拓扑维度。使用拓扑维格纳晶体中的赝自旋相互作用模型，我们证明铁磁海森堡交换 $J$ 和三角晶格上的手性相互作用 $\\gamma$ 之间的竞争稳定了零场斯格明子晶体，其密度可通过比率 $\\gamma/J$ 连续可调。手性相互作用源自底层时间反转破碎维格纳晶体中的有限贝里曲率。在连续极限中，手性相互作用充当斯格明子的化学势，而非线性西格玛模型之外的高阶梯度项选择斯格明子密度。在大手性耦合中，我们发现了一个24位点的四斯格明子晶体，每个磁性晶胞携带四个单位的拓扑电荷，该晶体以$J \\to 0$的四子晶格四面体顺序简并。\n\n我们表征了这些相的磁振子结构，并讨论了可调谐斯格明子晶体到大 $\\gamma/J$ 下这些状态之间的转变。我们的结果建立了铁磁拓扑维格纳晶体的相图。", "authors": [{"name": "David A. Dahlbom"}, {"name": "Daniel Kaplan"}, {"name": "Premala Chandra"}, {"name": "Cristian D. Batista"}], "featured_authors": [{"name": "David A. Dahlbom"}, {"name": "Daniel Kaplan"}, {"name": "Premala Chandra"}, {"name": "Cristian D. Batista"}], "author_count": 4}, {"id": "2608.02899", "category": "cond-mat", "title": "Lifshitz transitions and isospin polarization in twist-decoupled monolayer-bilayer graphene", "abstract": "Bernal-stacked bilayer graphene (BLG) hosts correlated electronic phases tied to low-energy Lifshitz transitions at saddle points in its valence band. To access this regime, ultralow charge disorder and control over a vertical electric field are simultaneously required. Here, we employ a twist-decoupled monolayer (MLG) to bias a proximal BLG in the absence of an external displacement field (D). We thereby reveal three-fold degenerate quantum Hall states at D = 0, with multiple transitions driven by doping, magnetic and electric field. Spontaneous broken symmetry in the vicinity of the valence band edge is signaled by the emergence of quantum oscillations with anomalous frequencies and large quasiparticle mass. These results indicate that electronic interactions in BLG are preserved in presence of an atomically close MLG, while showcasing the potential of CVD-grown graphene multilayers for the exploration of correlated phases of matter.", "url": "https://arxiv.org/abs/2608.02899", "type": "理论", "summary": "伯纳尔堆叠双层石墨烯 (BLG) 具有与其价带鞍点处的低能 Lifshitz 跃迁相关的相关电子相。为了达到这种状态，同时需要超低电荷无序和对垂直电场的控制。在这里，我们采用扭转解耦单层 (MLG) 在没有外部位移场 (D) 的情况下偏置近端 BLG。由此，我们揭示了 D = 0 时的三重简并量子霍尔态，并具有由掺杂、磁场和电场驱动的多个跃迁。价带边缘附近的自发破缺对称性通过具有反常频率和大准粒子质量的量子振荡的出现来表示。这些结果表明，BLG 中的电子相互作用在原子上接近的 MLG 存在下得以保留，同时展示了 CVD 生长的石墨烯多层在探索物质相关相方面的潜力。", "authors": [{"name": "Alex Boschi"}, {"name": "Leonardo Sabattini"}, {"name": "Sergey Slizovskiy"}, {"name": "Vaidotas Mišeikis"}, {"name": "Zewdu M. Gebeyehu"}, {"name": "Stiven Forti"}, {"name": "Antonio Rossi"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Fabio Beltram"}, {"name": "Vladimir I. Fal'ko"}, {"name": "Camilla Coletti"}, {"name": "Sergio Pezzini"}], "featured_authors": [{"name": "Alex Boschi"}, {"name": "Leonardo Sabattini"}, {"name": "Sergey Slizovskiy"}, {"name": "Vladimir I. Fal'ko"}, {"name": "Camilla Coletti"}, {"name": "Sergio Pezzini"}], "author_count": 13}, {"id": "2608.02903", "category": "cond-mat", "title": "Two dimensional inhomogeneous classical systems at criticality", "abstract": "We study simple inhomogeneous deformations of known two-dimensional classical lattice models described by conformal field theory (CFT) at large distances. The deformations are chosen to vary slowly at lattice scales, while preserving critical behavior. Globally, we find that such systems are described by a CFT in curved space, and identify the underlying space metric. Our two examples are the Ising model and the six vertex model with domain wall boundary conditions. In the latter boundaries are also inhomogeneous, which complicates the analysis. We nevertheless solve the free case using hydrodynamics. In the presence of interactions we determine the arctic curve which separates a critical fluctuating region from an ordered (frozen) phase.", "url": "https://arxiv.org/abs/2608.02903", "type": "理论", "summary": "我们研究了由共形场论（CFT）在远距离描述的已知二维经典晶格模型的简单不均匀变形。选择变形在晶格尺度上缓慢变化，同时保留关键行为。在全球范围内，我们发现此类系统由弯曲空间中的 CFT 进行描述，并确定了底层的空间度量。我们的两个例子是伊辛模型和具有畴壁边界条件的六顶点模型。在后者中，边界也是不均匀的，这使得分析变得复杂。尽管如此，我们还是使用流体动力学解决了自由情况。在存在相互作用的情况下，我们确定将临界波动区域与有序（冻结）相分开的北极曲线。", "authors": [{"name": "Jean-Marie Stéphan"}], "featured_authors": [{"name": "Jean-Marie Stéphan"}], "author_count": 1}, {"id": "2608.02981", "category": "cond-mat", "title": "Electrostatic Superlattices beyond 1:1 Stoichiometry", "abstract": "Exotic nanoparticle superstructures can be accessed by harnessing nanoparticle softness and charge regulation, features often viewed as obstacles to structural control. Here, we show that regulated charge mismatch in polymer-grafted nanoparticles enables the assembly of high-stoichiometry cubic superlattices. By co-tuning grafting density, particle size, and bulk composition, we realize ionic-lattice analogues such as CaF2 and Th3P4, as well as single-component A3 and A7 superlattices without atomic counterparts. The A3 lattice has recently been identified theoretically as a photonic band-gap lattice. These phases emerge from a 1:1 \"parent\" lattice when local charge neutrality cannot be satisfied, driving either progressive interstitial filling or reorganization into a larger basis. For instance, the systematic occupation of ZnS tetrahedral sites yields CaF2, while ligand-swapping symmetry breaking converts CsCl into Th3P4. Upon heating, the assemblies exhibit reversible lattice contraction and pronounced negative thermal expansion. Furthermore, the energetic penalty for defects increases with nanoparticle size, facilitating the scalable production of high-quality, open superlattices for photonic applications.", "url": "https://arxiv.org/abs/2608.02981", "type": "理论", "summary": "奇异的纳米粒子超结构可以通过利用纳米粒子的柔软性和电荷调节来实现，这些特征通常被视为结构控制的障碍。在这里，我们证明聚合物接枝纳米粒子中受调节的电荷失配能够组装高化学计量立方超晶格。通过共同调整接枝密度、粒径和块体组成，我们实现了离子晶格类似物，例如 CaF2 和 Th3P4，以及没有原子对应物的单组分 A3 和 A7 超晶格。 A3晶格最近在理论上被认为是光子带隙晶格。当无法满足局部电荷中性时，这些相会从 1:1“母体”晶格中出现，从而驱动渐进的间隙填充或重组为更大的基础。例如，系统占据 ZnS 四面体位点会产生 CaF2，而配体交换对称性破坏会将 CsCl 转化为 Th3P4。加热后，组件表现出可逆的晶格收缩和明显的负热膨胀。\n\n此外，缺陷的能量损失随着纳米颗粒尺寸的增加而增加，从而促进了用于光子应用的高质量开放超晶格的可扩展生产。", "authors": [{"name": "Binay P. Nayak"}, {"name": "Prapti Kakkar"}, {"name": "Wesley P. Korba"}, {"name": "Honghu Zhang"}, {"name": "Wenjie Wang"}, {"name": "Surya K. Mallapragada"}, {"name": "Alex Travesset"}, {"name": "David Vaknin"}], "featured_authors": [{"name": "Binay P. Nayak"}, {"name": "Prapti Kakkar"}, {"name": "Wesley P. Korba"}, {"name": "Surya K. Mallapragada"}, {"name": "Alex Travesset"}, {"name": "David Vaknin"}], "author_count": 8}, {"id": "2608.03128", "category": "cond-mat", "title": "Apparent Dresselhaus coefficient in (001) GaAs quantum wells: Correlation-time renormalization in D'yakonov-Perel' spin relaxation", "abstract": "We study the Dresselhaus coefficient inferred from D'yakonov-Perel' spin relaxation in bulk GaAs and (001) GaAs quantum wells using nonballistic Monte Carlo simulations. In bulk GaAs, inelastic LO-phonon simulations reproduce the spin relaxation with a cubic Dresselhaus coefficient \\gamma_{3D}\\simeq12.4 eVÅ^3 and a cubic-field correlation time \\tau_3^{3D}\\simeq150 fs. In a projected two-dimensional quantum-well model, however, k_z^2 is replaced by the static expectation value \\langle k_z^2 \\rangle, converting the dominant Dresselhaus field into a term linear in the in-plane wave vector. We show that this projection changes the D'yakonov-Perel' correlation kernel from K_3^{2D} to a first- and third-order hybridized kernel K_{1+3}^{2D}, for which the correlation time \\tau_{1+3}^{2D} approaches 235 fs in the strict two-dimensional limit, in contrast to the third-order correlation time \\tau_3^{2D} of 130 fs. Consequently, the coefficient entering the projected two-dimensional model is not the intrinsic cubic coefficient itself but an apparent coefficient, \\gamma_{2D}^{app}=\\gamma_{3D} \\sqrt{\\tau_3^{2D}/\\tau_{1+3}^{2D}}. Since \\tau_{1+3}^{2D}\\simeq1.8\\tau_3^{2D} under LO-phonon-dominated scattering, \\gamma_{2D}^{app}\\simeq9.2 eVÅ^3, consistent with spin relaxation in (001) GaAs quantum wells. This correlation-time renormalization clarifies why Dresselhaus coefficients extracted from two-dimensional spin relaxation can differ from the cubic bulk coefficient and provides a useful framework for interpreting linear and cubic Dresselhaus parameters in quantum wells.", "url": "https://arxiv.org/abs/2608.03128", "type": "理论+数值", "summary": "我们使用非弹道蒙特卡罗模拟研究了从块状 GaAs 和 (001) GaAs 量子阱中的 D'yakonov-Perel' 自旋弛豫推断出的 Dresselhaus 系数。在块状 GaAs 中，非弹性 LO 声子模拟通过立方 Dresselhaus 系数 \\gamma_{3D}\\simeq12.4 eVÅ^3 和立方场相关时间 \\tau_3^{3D}\\simeq150 fs 重现自旋弛豫。然而，在投影二维量子阱模型中，k_z^2 被静态期望值 \\langle k_z^2 \\rangle 取代，将主要的 Dresselhaus 场转换为面内波矢量中的线性项。我们表明，该投影将 D'yakonov-Perel' 相关核从 K_3^{2D} 更改为一阶和三阶混合核 K_{1+3}^{2D}，其中相关时间 tau_{1+3}^{2D} 在严格的二维限制下接近 235 fs，而三阶相关时间 tau_3^{2D} 为 130 fs。因此，进入投影二维模型的系数不是固有三次系数本身，而是表观系数，\\gamma_{2D}^{app}=\\gamma_{3D} \\sqrt{\\tau_3^{2D}/\\tau_{1+3}^{2D}}。\n\n由于 tau_{1+3}^{2D}\\simeq1.8\\tau_3^{2D} 在 LO 声子主导的散射下，\\gamma_{2D}^{app}\\simeq9.2 eVÅ^3 与 (001) GaAs 量子阱中的自旋弛豫一致。这种相关时间重整化阐明了为什么从二维自旋弛豫中提取的 Dresselhaus 系数可能不同于立方体积系数，并为解释量子阱中的线性和立方 Dresselhaus 参数提供了有用的框架。", "authors": [{"name": "Yuzo Ohno"}, {"name": "Jun Ishihara"}, {"name": "Satoshi Iba"}], "featured_authors": [{"name": "Yuzo Ohno"}, {"name": "Jun Ishihara"}, {"name": "Satoshi Iba"}], "author_count": 3}, {"id": "2608.03178", "category": "cond-mat", "title": "Quaternion-Kahler geometry of time reversal symmetric crystals", "abstract": "Quantum geometry reveals how the shape of Bloch wave functions governs correlated quantum phenomena. Its standard formulation describes isolated complex bands, where Berry curvature is Abelian and ideal geometry is Kahler. However, time reversal symmetric crystals with spin require a different language since Kramers degeneracy pairs Bloch states and turns Berry curvature into a non-Abelian SU(2) field. Here we show that Kramers pair band geometry is quaternionic. A minimal Kramers pair defines a map into quaternion projective space, and its quaternionic quantum geometric tensor unifies the quantum metric with the three SU(2) Berry curvature components. The non-negativity of this tensor imposes local metric-curvature inequalities, whose saturation defines the non-Abelian counterpart of ideal Chern bands. In four dimensions, the ideal limit further yields an algebraic structure related to the four-dimensional quantum Hall effect. Our results promote ideal quantum geometry from the Abelian geometry of Chern bands to the quaternionic, non-Abelian geometry of time reversal symmetric quantum matter.", "url": "https://arxiv.org/abs/2608.03178", "type": "理论", "summary": "量子几何揭示了布洛赫波函数的形状如何控制相关的量子现象。其标准公式描述了孤立的复杂带，其中贝里曲率是阿贝尔曲率，理想几何是卡勒曲率。然而，具有自旋的时间反转对称晶体需要不同的语言，因为克莱默简并性对布洛赫态进行配对并将贝里曲率转变为非阿贝尔 SU(2) 场。在这里我们证明克莱默对能带几何形状是四元数的。最小克莱默对定义了四元数射影空间的映射，其四元数量子几何张量将量子度量与三个 SU(2) 贝里曲率分量统一起来。该张量的非负性强加了局部度量曲率不等式，其饱和度定义了理想陈氏带的非阿贝尔对应物。在四个维度中，理想极限进一步产生与四维量子霍尔效应相关的代数结构。我们的结果将理想的量子几何从陈能带的阿贝尔几何推广到时间反转对称量子物质的四元数、非阿贝尔几何。", "authors": [{"name": "Hyeongmuk Lim"}, {"name": "Junseo Jung"}, {"name": "Yuting Qian"}, {"name": "Bohm-Jung Yang"}], "featured_authors": [{"name": "Hyeongmuk Lim"}, {"name": "Junseo Jung"}, {"name": "Yuting Qian"}, {"name": "Bohm-Jung Yang"}], "author_count": 4}, {"id": "2608.03180", "category": "cond-mat", "title": "Exact Resonances Are Not Sufficient for Phonon Energy Diffusion", "abstract": "Multi-phonon resonance conditions underpin kinetic theories of phonon transport and lattice thermalization. We show that exact resonance matching, nonzero interaction coefficients, and network connectivity do not guarantee persistent energy diffusion. Symmetry-enforced balance relations drive exact-resonant collision currents to nonthermal zero-flux states, producing kinetic arrest from individual resonant sets to connected networks. Complete energy spreading is sustained by quasi-resonances. The thermodynamic and weak-nonlinearity limits do not commute: the leading kinetic behavior is recovered in the former, whereas at fixed finite size the thermalization time diverges through higher-order crossovers as the nonlinearity vanishes. Exact-resonance existence and connectivity are therefore kinematic, not sufficient dynamical, criteria for phonon energy diffusion.", "url": "https://arxiv.org/abs/2608.03180", "type": "理论", "summary": "多声子共振条件支撑着声子输运和晶格热化的动力学理论。我们表明，精确的共振匹配、非零相互作用系数和网络连接并不能保证持续的能量扩散。对称强制平衡关系将精确谐振碰撞电流驱动到非热零通量状态，从而产生从单个谐振组到连接网络的动力学停止。完全的能量传播由准共振维持。热力学和弱非线性极限不会互换：前者恢复了主要的动力学行为，而在固定的有限尺寸下，随着非线性消失，热化时间通过高阶交叉发散。因此，精确共振的存在和连通性是声子能量扩散的运动学标准，而不是充分的动力学标准。", "authors": [{"name": "Wei Lin"}, {"name": "Yong Zhang"}, {"name": "Hong Zhao"}], "featured_authors": [{"name": "Wei Lin"}, {"name": "Yong Zhang"}, {"name": "Hong Zhao"}], "author_count": 3}, {"id": "2608.03195", "category": "cond-mat", "title": "Fluctuations of topological charges in two-dimensional classical Heisenberg model through high-temperature and low-temperature expansions", "abstract": "It is well known that KT transition in 2d XY model is driven by the binding and unbinding of topological defects, which can be characterized by the fluctuation of topological charges inside a region. We extend the idea into the 2d Heisenberg model and calculate the fluctuation through high-temperature and low-temperature expansion respectively. It is found that the fluctuation of topological charges is proportional to the area of the region at high temperatures while obeys the perimeter law at low temperatures.", "url": "https://arxiv.org/abs/2608.03195", "type": "理论", "summary": "众所周知，2d XY模型中的KT转变是由拓扑缺陷的结合和解除结合驱动的，可以通过区域内拓扑电荷的涨落来表征。我们将这个想法扩展到二维海森堡模型中，并分别通过高温和低温膨胀来计算波动。发现拓扑电荷的涨落在高温下与区域面积成正比，而在低温下则服从周长定律。", "authors": [{"name": "Shan-Chang Tang"}], "featured_authors": [{"name": "Shan-Chang Tang"}], "author_count": 1}, {"id": "2608.03308", "category": "cond-mat", "title": "Bias Tunable Transport Modulation and Gas Selectivity in Layered BiOI: A DFT NEGF Study", "abstract": "Understanding the interplay between adsorption energetics and charge-transport modulation is essential for the rational design of low-power and bias-tunable gas sensors. Here, we present a comprehensive first-principles study of gas selectivity in layered bismuth oxyiodide (BiOI) by integrating density functional theory with nonequilibrium Green's function transport calculations. The adsorption and bias-dependent transport responses toward NO2, NH3, CO2, and representative volatile organic compounds are systematically examined. While NH3 and NO2 exhibit strong chemisorption and localized electronic perturbations, CO2 interacts through weak physisorption, demonstrating that adsorption strength alone does not determine sensing performance. Instead, the evolution of transmission channels near the Fermi level governs the sensing response. Bias-dependent calculations reveal an electrically tunable sensitivity hierarchy, in which weakly adsorbed CO2 preserves conductive pathways and exhibits pronounced low-bias sensitivity despite minimal charge transfer. Recovery-time analysis further highlights the trade-off between transport modulation and reversibility for strongly adsorbed species. These results establish a transport-centered selectivity framework for layered BiOI and provide mechanistic insight into electric-field-controlled gas sensing under ambient conditions.", "url": "https://arxiv.org/abs/2608.03308", "type": "理论+数值", "summary": "了解吸附能量学和电荷传输调制之间的相互作用对于低功耗和偏置可调气体传感器的合理设计至关重要。在这里，我们通过将密度泛函理论与非平衡格林函数输运计算相结合，对层状碘氧化铋（BiOI）中的气体选择性进行了全面的第一性原理研究。系统地研究了对 NO2、NH3、CO2 和代表性挥发性有机化合物的吸附和偏压依赖性传输响应。虽然 NH3 和 NO2 表现出强化学吸附和局部电子扰动，但 CO2 通过弱物理吸附相互作用，这表明吸附强度本身并不能决定传感性能。相反，费米能级附近传输通道的演化控制着传感响应。依赖于偏压的计算揭示了电可调灵敏度层次结构，其中弱吸附的二氧化碳保留了导电通路，并且尽管电荷转移极少，但仍表现出明显的低偏压灵敏度。恢复时间分析进一步强调了强吸附物质的传输调节和可逆性之间的权衡。\n\n这些结果为分层 BiOI 建立了一个以传输为中心的选择性框架，并为环境条件下电场控制的气体传感提供了机制见解。", "authors": [{"name": "Jemal Yimer Damte"}, {"name": "Jiří Houška"}, {"name": "Pavel Baroch"}, {"name": "Xue Yong"}], "featured_authors": [{"name": "Jemal Yimer Damte"}, {"name": "Jiří Houška"}, {"name": "Pavel Baroch"}, {"name": "Xue Yong"}], "author_count": 4}, {"id": "2608.03317", "category": "cond-mat", "title": "Hydrodynamic description of proliferating active matter", "abstract": "We develop a continuum theory for proliferating active matter starting from a microscopic stochastic model of self-propelled particles undergoing birth, death, and nonlocal competition. Beginning from the master equation, we derive mean-field evolution equations for the particle density and polarization fields and close the resulting hierarchy through a von Mises ansatz, providing a coupled hydrodynamic description applicable to a broad class of proliferating active systems. As an application, we study the recently introduced Active Brownian Bug model, in which the form of flocking emerges despite the absence of explicit alignment interactions. Linear stability analysis predicts both Turing and Hopf instabilities, whose analytical thresholds agree with numerical simulations. The continuum model reproduces the principal dynamical regimes of the underlying particle system, including homogeneous states, stationary periodic clusters, and coherently propagating flocking states. These results establish a general continuum framework for proliferating active matter and provide a physical interpretation of collective motion driven by the interplay between activity and population dynamics.", "url": "https://arxiv.org/abs/2608.03317", "type": "理论+数值", "summary": "我们从经历诞生、死亡和非局域竞争的自驱动粒子的微观随机模型出发，发展了一种用于增殖活性物质的连续介质理论。从主方程开始，我们推导了粒子密度和极化场的平均场演化方程，并通过 von Mises ansatz 封闭了所得的层次结构，提供了适用于广泛的增殖活性系统的耦合流体动力学描述。作为一个应用，我们研究了最近引入的主动布朗虫模型，其中尽管没有明确的对齐相互作用，但仍出现了聚集的形式。线性稳定性分析预测图灵和霍普夫不稳定性，其分析阈值与数值模拟一致。连续介质模型再现了底层粒子系统的主要动力学状态，包括均匀状态、静止周期簇和相干传播的聚集状态。这些结果建立了活性物质增殖的通用连续体框架，并为活动和种群动态之间的相互作用驱动的集体运动提供了物理解释。", "authors": [{"name": "Nathan Silvano"}, {"name": "Emilio Hernandez-Garcia"}, {"name": "Cristóbal López"}], "featured_authors": [{"name": "Nathan Silvano"}, {"name": "Emilio Hernandez-Garcia"}, {"name": "Cristóbal López"}], "author_count": 3}, {"id": "2608.03355", "category": "cond-mat", "title": "Discrepancy between the H-Function and Entropy: Insights into the rigorously established Boltzmann equation for hard-sphere gases", "abstract": "By investigating the origin of the evolutionary discrepancy between the H-function and entropy, we elucidate that the H-function fails to serve as a valid arrow-of-time criterion in the rigorously derived Boltzmann equation for the hard-sphere gas model under the Boltzmann-Grad limit.", "url": "https://arxiv.org/abs/2608.03355", "type": "理论", "summary": "通过研究 H 函数和熵之间进化差异的根源，我们阐明了在玻尔兹曼-梯度极限下严格导出的硬球气体模型玻尔兹曼方程中，H 函数无法作为有效的时间箭头准则。", "authors": [{"name": "Li-Xiang Cen"}], "featured_authors": [{"name": "Li-Xiang Cen"}], "author_count": 1}, {"id": "2608.03389", "category": "cond-mat", "title": "Helicity in monoaxial chiral magnets", "abstract": "The equilibrium state of a monoaxial chiral magnet surrounded by a non-magnetic medium (such as air or vacuum) is a helical texture characterized by a single, well-defined wave vector. No metastable states have ever been observed in such systems. Recently, however, it was demonstrated that when a chiral magnet is in close contact with two uniaxial ferromagnets, a large number of metastable helical states emerge in addition to the equilibrium state [Phys. Rev. B 109, 214424]. These helical states are distinguished by their wave number (helicity). In the present work, we elucidate the topological origin of the stabilization of these states --a mechanism we term dynamical topological protection-- and investigate their static and dynamic properties. We find that, as a consequence of this dynamical topological protection, the winding number of the helical states remains constant under the application of sufficiently weak magnetic fields and polarized electric currents. Furthermore, when a polarized current is applied to a metastable helical state, a static configuration is reached. This state retains the original winding number, but its winding number density becomes non-homogeneously distributed, concentrating near the interface with one of the ferromagnets. The dynamic response to sufficiently large magnetic fields and currents provides mechanisms to switch between different helical states. Since the magnetic properties depend on helicity, these metastable helical states are highly promising for applications in spintronics and magnonics.", "url": "https://arxiv.org/abs/2608.03389", "type": "理论", "summary": "被非磁性介质（例如空气或真空）包围的单轴手性磁体的平衡状态是螺旋结构，其特征在于单个、明确的波矢量。在此类系统中尚未观察到亚稳态。然而，最近的研究表明，当手性磁体与两个单轴铁磁体紧密接触时，除了平衡态之外，还会出现大量亚稳态螺旋态[Phys.修订版 B 109, 214424]。这些螺旋态通过它们的波数（螺旋度）来区分。在目前的工作中，我们阐明了这些状态稳定的拓扑起源——我们称之为动态拓扑保护的机制——并研究了它们的静态和动态特性。我们发现，由于这种动态拓扑保护，螺旋态的缠绕数在足够弱的磁场和极化电流的施加下保持恒定。此外，当极化电流施加到亚稳态螺旋状态时，达到静态配置。\n\n这种状态保留了原始的绕数，但其绕数密度变得不均匀分布，集中在与其中一个铁磁体的界面附近。对足够大的磁场和电流的动态响应提供了在不同螺旋状态之间切换的机制。由于磁性取决于螺旋度，这些亚稳态螺旋态在自旋电子学和磁振子学中的应用非常有前景。", "authors": [{"name": "Victor Laliena"}, {"name": "Diego Gironés-Magaña"}, {"name": "Javier Campo"}], "featured_authors": [{"name": "Victor Laliena"}, {"name": "Diego Gironés-Magaña"}, {"name": "Javier Campo"}], "author_count": 3}, {"id": "2608.03398", "category": "cond-mat", "title": "The intermediate scattering function of an interacting adlayer as a characteristic function: a closed-form theory of Ising lattice-gas surface diffusion", "abstract": "The intermediate scattering function (ISF) measured by helium spin-echo is a characteristic function (CF): the Fourier transform of the distribution of adsorbate displacements, whose value at zero time is the static structure factor. We use this double role to bring lateral interactions of Ising lattice-gas type into surface diffusion. The ISF then follows in closed form in momentum transfer, time, coverage and temperature, and with it the whole linear-response hierarchy. A single correlation parameter fixes both the equilibrium structure and the interaction-renormalized hop rate; it is exact along a one-dimensional channel, and is carried onto the surface as the nearest-neighbour correlation of a pair approximation, the momentum dependence of the structure factor then coming from a collective (random-phase) treatment. The closed form is not postulated. Projecting the master equation onto the density gives an exact equation of motion whose amplitude is an identity and whose initial rate obeys a sum rule, so that the quasi-elastic weight is the layer's own structure factor and de Gennes narrowing becomes a theorem rather than an analogy; the closed form is what remains when the memory kernel of that equation is dropped. Kinetic Monte Carlo (KMC) on the same Hamiltonian reproduces the dressed hop rate to better than about one per cent and the initial collective rate to $1$--$2\\%$. Four correlated, non-critical fingerprints of the interaction follow --- in the quasi-elastic amplitude, its linewidth, the Arrhenius slope, and the dependence of the fitted linewidth on the range of times over which the decay is fitted. They invert in closed form for the attempt frequency, the static barrier and the interaction. Applications to Na/Cu(111) and H/Pt(111) are analysed and discussed.", "url": "https://arxiv.org/abs/2608.03398", "type": "理论+数值", "summary": "氦自旋回波测量的中间散射函数（ISF）是特征函数（CF）：吸附质位移分布的傅立叶变换，其零时值是静态结构因子。我们利用这种双重作用将伊辛晶格-气体类型的横向相互作用引入表面扩散。然后，ISF 以封闭形式遵循动量传递、时间、覆盖范围和温度，以及整个线性响应层次结构。单个相关参数固定了平衡结构和交互重整化跳跃率；它沿着一维通道是精确的，并且作为一对近似的最近邻相关性被带到表面上，结构因子的动量依赖性来自集体（随机相位）处理。不假定封闭形式。\n\n将主方程投影到密度上给出一个精确的运动方程，其幅度是恒等式，其初始速率服从求和规则，因此准弹性重量是层自身的结构因子，德热内斯窄化成为定理而不是类比；当该方程的内存内核被删除时，剩下的就是封闭形式。同一哈密顿量上的动能蒙特卡罗 (KMC) 将整理后的啤酒花率再现为优于约 1%，并将初始集体率再现为 $1$--$2\\%$。接下来是相互作用的四个相关的非关键指纹——准弹性振幅、线宽、阿累尼乌斯斜率以及拟合线宽对衰减拟合时间范围的依赖性。它们以封闭形式反转尝试频率、静态障碍和相互作用。分析和讨论了Na/Cu(111)和H/Pt(111)的应用。", "authors": [{"name": "S. Miret-Artés"}], "featured_authors": [{"name": "S. Miret-Artés"}], "author_count": 1}, {"id": "2608.03414", "category": "cond-mat", "title": "Magnetoresistance in Magnetic Weyl semimetal Mn$_{3}$ZnC", "abstract": "The magnetoresistance (MR) in magnetic materials reveal an intriguing spin-dependent electron scattering, highlighting the role of spin polarization on the electronic transport properties. This becomes even more interesting for the topological magnetic materials where a finite Berry curvature leads to an intrinsic scattering channel also. In this report, we investigate MR of Mn$_{3}$ZnC, an antiperovskite magnetic nodal line semimetal. Mn$_{3}$ZnC shows a ferromagnetic (FM) transition at $\\sim$ 420 K, followed by an ferrimagnetic (FIM) transition at $\\sim$ 195 K. We focus on the interpretation of MR data and highlight the relation between MR and its magnetization. The signature of magnetization induced MR shows correlation at low magnetic fields and displays distinct behaviors in the FIM and FM states. Similar to the isothermal magnetization M(H) curve of FM and FIM state, the MR curves exhibit a sharp increase, followed by a linear behavior at higher fields. As the magnetic field varies, the cusp-like anomaly becomes more pronounced, and vanishes at the magnetic phase transition, which then reappears as the temperature increases. The sign change in the MR curves in the FIM state is attributed to a drastic change in the carrier mobility. Interestingly, this system shows a positive MR in FM state at very low field, which is quite unusual.", "url": "https://arxiv.org/abs/2608.03414", "type": "理论", "summary": "磁性材料中的磁阻（MR）揭示了一种有趣的自旋相关电子散射，突出了自旋极化对电子传输特性的作用。对于拓扑磁性材料来说，这变得更加有趣，其中有限的贝里曲率也导致了固有的散射通道。在本报告中，我们研究了 Mn$_{3}$ZnC（一种反钙钛矿磁节线半金属）的磁阻。 Mn$_{3}$ZnC 显示在 $\\sim$ 420 K 处发生铁磁 (FM) 转变，随后在 $\\sim$ 195 K 处发生亚铁磁 (FIM) 转变。我们重点关注 MR 数据的解释，并强调 MR 与其磁化强度之间的关系。磁化感应 MR 的特征显示出低磁场下的相关性，并在 FIM 和 FM 状态下显示出不同的行为。与 FM 和 FIM 状态的等温磁化强度 M(H) 曲线类似，MR 曲线表现出急剧增加，然后在较高磁场下呈现线性行为。随着磁场的变化，尖点状异常变得更加明显，并在磁相变时消失，然后随着温度升高而重新出现。\n\nFIM状态下MR曲线的符号变化归因于载流子迁移率的急剧变化。有趣的是，该系统在极低场的 FM 状态下显示出正的 MR，这是非常不寻常的。", "authors": [{"name": "Sunil Gangwar"}, {"name": "C. S. Yadav"}], "featured_authors": [{"name": "Sunil Gangwar"}, {"name": "C. S. Yadav"}], "author_count": 2}, {"id": "2608.03458", "category": "cond-mat", "title": "Fibonacci number systems and the localization criterion in the many-body Aubry-André model", "abstract": "We introduce an extension of the Fibonacci number system, we call the fractional Fibonacci number system, which interpolates between the Fibonacci number system (used for natural numbers) and the irrational base-$\\phi$ number system, which can be used to represent real numbers. The number system finds its use in interpreting the localization phase diagram of the many-body non-interacting Aubry-André model. For finite system sizes a localization criterion can be obtained if the particle density is written in the fractional Fibonacci number system. In the thermodynamic limit, the criterion remains, but in this case the particle density is expressed in base-$\\phi$. The nature of the thermodynamic limit is also discussed.", "url": "https://arxiv.org/abs/2608.03458", "type": "理论+数值", "summary": "我们引入斐波那契数系的扩展，称为分数斐波那契数系，它插值于斐波那契数系（用于自然数）和无理数基 $\\phi$ 数系（可用于表示实数）之间。数字系统可用于解释多体非相互作用 Aubry-André 模型的定位相图。对于有限的系统尺寸，如果将粒子密度写成分数斐波那契数系，则可以获得定位标准。在热力学极限中，该标准仍然存在，但在这种情况下，颗粒密度以 base-$\\phi$ 表示。还讨论了热力学极限的性质。", "authors": [{"name": "Balázs Hetényi"}], "featured_authors": [{"name": "Balázs Hetényi"}], "author_count": 1}, {"id": "2608.03478", "category": "cond-mat", "title": "Anisotropic Phonon Heat Flow and Thermoelectric Response in Tetragonal GeS$_2$ and GeSe$_2$", "abstract": "The electronic structure, lattice dynamics, bonding, elastic response, and anisotropic thermoelectric transport properties of tetragonal GeS$_2$ and GeSe$_2$ were investigated using density functional theory, density functional perturbation theory, Wannier interpolation, and scattering-aware Boltzmann transport. The relaxed structures are mechanically and dynamically stable within the calculated harmonic description. The HSE03/Wannier band gaps are 2.48 eV for GeS$_2$ and 1.23 eV for GeSe$_2$, while substitution of S by Se lowers the upper phonon frequency from approximately 13.6 to 10.3 THz. The phonon Boltzmann transport calculations reveal pronounced lattice-transport anisotropy. Within the relaxation-time approximation, the 300 K in-plane and cross-plane lattice thermal conductivities are 26.86 and 1.19 W m$^{-1}$ K$^{-1}$ for GeS$_2$, and 18.74 and 1.52 W m$^{-1}$ K$^{-1}$ for GeSe$_2$, respectively. At 800 K, these values decrease to 10.22 and 0.46 W m$^{-1}$ K$^{-1}$ for GeS$_2$, and 7.25 and 0.58 W m$^{-1}$ K$^{-1}$ for GeSe$_2$. Frequency-resolved analysis shows that low-frequency phonons carry most of the heat, whereas the small cross-plane values reflect restricted out-of-plane phonon transport. Combining the ShengBTE RTA lattice tensors with AMSET electronic coefficients gives $zT=0.257$ for n-type cross-plane GeS$_2$ at 800 K and $10^{19}$ cm$^{-3}$. The corresponding PBE-AMSET estimate for GeSe$_2$ is $zT=0.066$ for p-type cross-plane transport at 800 K and $3\\times10^{20}$ cm$^{-3}$. LOBSTER analysis identifies mixed covalent--ionic Ge--X bonding, with Ge--S bonds having a larger stabilizing ICOHP magnitude than Ge--Se bonds ($-5.27$ versus $-4.74$ eV per bond). These results identify tetragonal GeX$_2$ compounds as strongly anisotropic thermoelectrics with moderate calculated $zT$ values whose cross-plane response benefits from suppressed lattice heat transport.", "url": "https://arxiv.org/abs/2608.03478", "type": "理论+数值", "summary": "利用密度泛函理论、密度泛函摄动理论、Wannier插值和散射感知玻尔兹曼输运研究了四方GeS$_2$和GeSe$_2$的电子结构、晶格动力学、键合、弹性响应和各向异性热电输运性质。松弛结构在计算的谐波描述内是机械和动态稳定的。 GeS$_2$ 的 HSE03/Wannier 带隙为 2.48 eV，GeSe$_2$ 的 HSE03/Wannier 带隙为 1.23 eV，而用 Se 替代 S 会将上声子频率从大约 13.6 THz 降低到 10.3 THz。声子玻尔兹曼输运计算揭示了明显的晶格输运各向异性。在弛豫时间近似内，GeS$_2$ 的 300 K 面内和跨面晶格热导率分别为 26.86 和 1.19 W m$^{-1}$ K$^{-1}$，GeSe$_2$ 的 300 K 面内和跨面晶格热导率分别为 18.74 和 1.52 W m$^{-1}$ K$^{-1}$。在 800 K 时，GeS$_2$ 的这些值降至 10.22 和 0.46 W m$^{-1}$ K$^{-1}$，GeSe$_2$ 的这些值降至 7.25 和 0.58 W m$^{-1}$ K$^{-1}$。\n\n频率解析分析表明，低频声子携带大部分热量，而较小的跨平面值反映了平面外声子传输受限。将 ShenBTE RTA 晶格张量与 AMSET 电子系数相结合，得出 n 型跨平面 GeS$_2$ 在 800 K 和 $10^{19}$ cm$^{-3}$ 下的 $zT=0.257$。对于 800 K 和 $3\\times10^{20}$ cm$^{-3}$ 的 p 型跨平面输运，GeSe$_2$ 相应的 PBE-AMSET 估计为 $zT=0.066$。 LOBSTER 分析确定了混合共价离子 Ge-X 键合，其中 Ge-S 键比 Ge-Se 键具有更大的稳定 ICOHP 量级（每键 $-5.27$ 与 $-4.74$ eV）。这些结果将四方 GeX$_2$ 化合物确定为具有中等计算 $zT$ 值的强各向异性热电材料，其跨平面响应受益于抑制晶格热传输。", "authors": [{"name": "Neeraj Kulhari"}, {"name": "Krishna Swaroop Sharma"}, {"name": "K. C. Bhamu"}], "featured_authors": [{"name": "Neeraj Kulhari"}, {"name": "Krishna Swaroop Sharma"}, {"name": "K. C. Bhamu"}], "author_count": 3}, {"id": "2608.03523", "category": "cond-mat", "title": "The New High-entropy Compound RhMnFeCoGe4 with Cubic Non-centrosymmetric B20 Structure", "abstract": "A novel high-entropy compound, RhMnFeCoGe$_4$, with a cubic non-centrosymmetric B20 struc- ture, has been synthesized under conditions of high pressure and temperature. The electrical transport and magnetic properties of the obtained compound at both ambient and elevated pres- sures have been investigated. In addition, nuclear magnetic resonance (NMR) spectra were obtained at 4.2 K and ab initio calculations were performed. The new material exhibits ferromag- netic behavior with a critical temperature of $T_C$ = 146 K and a spontaneous moment of 2.5 $\\mu_B$ per formula unit. The magnetization data obtained at the critical region yielded the critical temperature and exponents, which were found to be $T_C$ = 146(1) K, $\\beta$ = 0.337(1), $\\gamma$ = 1.121(1), and $\\delta$ = 4.326(1). The magnetic moments of Mn and Co were determined from NMR spectra to be 2.2 $\\mu_B$ and 0.5 $\\mu_B$, respectively. Ab initio calculations yielded reasonable values for the lattice parameter and the magnetic moments of all constituents. The density of states and band structure are determined for both paramagnetic and ferromagnetic states. Lattice compression results in the increase in the $T_C$.", "url": "https://arxiv.org/abs/2608.03523", "type": "理论+数值", "summary": "在高压高温条件下合成了一种具有立方非中心对称B20结构的新型高熵化合物RhMnFeCoGe$_4$。所获得的化合物在常压和高压下的电传输和磁性能均已得到研究。此外，在 4.2 K 下获得核磁共振 (NMR) 谱并进行从头计算。新材料表现出铁磁行为，临界温度为 $T_C$ = 146 K，自发矩为每公式单位 2.5 $\\mu_B$。在临界区获得的磁化数据产生了临界温度和指数，分别为$T_C$ = 146(1) K、$\\beta$ = 0.337(1)、$\\gamma$ = 1.121(1)和$\\delta$ = 4.326(1)。根据NMR谱确定Mn和Co的磁矩分别为2.2 $\\mu_B$和0.5 $\\mu_B$。从头计算得出所有成分的晶格参数和磁矩的合理值。顺磁态和铁磁态的态密度和能带结构都是确定的。晶格压缩导致 $T_C$ 增加。", "authors": [{"name": "V. A. Sidorov"}, {"name": "V. N. Krasnorussky"}, {"name": "A. V. Bokov"}, {"name": "Z. N. Volkova"}, {"name": "A. P. Gerashchenko"}, {"name": "N. M. Chtchelkatchev"}, {"name": "M. V. Magnitskaya"}, {"name": "D. A. Salamatin"}, {"name": "A. V. Semeno"}, {"name": "V. V. Brazhkin"}, {"name": "A. V. Tsvyashchenko"}], "featured_authors": [{"name": "V. A. Sidorov"}, {"name": "V. N. Krasnorussky"}, {"name": "A. V. Bokov"}, {"name": "A. V. Semeno"}, {"name": "V. V. Brazhkin"}, {"name": "A. V. Tsvyashchenko"}], "author_count": 11}, {"id": "2608.03553", "category": "cond-mat", "title": "Faraday pattern formation in dipolar superfluid and supersolid quantum gases", "abstract": "We investigate Faraday instabilities in three-dimensional parametrically driven trapped dipolar quantum gases within the framework of the extended Gross-Pitaevskii equation. In the superfluid regime, periodic modulation of the short-range interactions induces the resonant excitation of discrete polygonal surface modes displaying sub-harmonic response. The resonance frequencies and the parametric windows of instability are accurately captured by an appropriate Mathieu equation, further corroborating our simulations. It is also shown that dipolar interactions in superfluids shift the resonance frequencies to lower values compared to their non-dipolar counterparts. Near the superfluid-to-supersolid transition, intrinsic density undulations associated with the softened roton mode accelerate pattern formation, yielding hybrid surface and bulk excitations. The bulk patterns prevail deeper in the supersolid regime, emerging from droplet collisions with the superfluid background. Our results reveal a crossover from surface collective modes to hybrid surface-bulk excitations and demonstrate how parametric driving dictates pattern formation in long-range interacting quantum fluids.", "url": "https://arxiv.org/abs/2608.03553", "type": "理论+数值", "summary": "我们在扩展 Gross-Pitaevskii 方程的框架内研究了三维参数驱动的俘获偶极量子气体中的法拉第不稳定性。在超流体状态中，短程相互作用的周期性调制引起显示次谐波响应的离散多边形表面模式的共振激发。适当的马蒂厄方程可以准确捕获共振频率和不稳定参数窗口，进一步证实了我们的模拟。研究还表明，与非偶极相互作用相比，超流体中的偶极相互作用将共振频率移至更低的值。在超流体到超固体的转变附近，与软化旋转模式相关的固有密度波动加速了图案的形成，产生混合表面和体激发。整体图案在超固体区域更深处占主导地位，是由液滴与超流体背景的碰撞而出现的。我们的结果揭示了从表面集体模式到混合表面体激发的交叉，并证明了参数驱动如何决定长程相互作用量子流体中的图案形成。", "authors": [{"name": "Sumit Semwal"}, {"name": "Shawan K. Jha"}, {"name": "G. A. Bougas"}, {"name": "S. I. Mistakidis"}, {"name": "Pankaj Kumar Mishra"}], "featured_authors": [{"name": "Sumit Semwal"}, {"name": "Shawan K. Jha"}, {"name": "G. A. Bougas"}, {"name": "S. I. Mistakidis"}, {"name": "Pankaj Kumar Mishra"}], "author_count": 5}, {"id": "2608.03586", "category": "cond-mat", "title": "Theory of Handedness Selection in Helices of Chiral Polymers and Biopolymers", "abstract": "Helices are among the most common ordered structures in biological and synthetic polymers, but their formation involves more than local conformational preference. A finite helix must nucleate, grow, resist breaking, and maintain a selected handedness against thermal fluctuations. We develop a three-state Ising-like transfer-matrix theory in which each segment is coil-like, right-handed helical, or left-handed helical. This formulation separates ordinary helix--coil cooperativity from the persistence of handedness. The right--left symmetric problem decomposes into symmetric and antisymmetric sectors, giving two characteristic lengths: the helical correlation length $\\xi_H$ and the chiral persistence length $\\xi_\\chi$. In the strongly helical rare-wall limit, $\\xi_\\chi\\simeq (1/2)\\exp[\\beta(K+J)]$. A local chiral bias, motivated by the Ramachandran landscape, is then amplified over finite helical domains.", "url": "https://arxiv.org/abs/2608.03586", "type": "理论", "summary": "螺旋是生物和合成聚合物中最常见的有序结构之一，但它们的形成不仅仅涉及局部构象偏好。有限螺旋必须成核、生长、抵抗断裂，并保持选定的旋向性以抵抗热波动。我们开发了一种三态类伊辛传递矩阵理论，其中每个段都是线圈状、右手螺旋或左手螺旋。这个公式将普通的螺旋线圈协同性与惯用手的持续性分开。左右对称问题分解为对称扇区和反对称扇区，给出两个特征长度：螺旋相关长度 $\\xi_H$ 和手性持久长度 $\\xi_\\chi$。在强螺旋稀壁极限下，$\\xi_\\chi\\simeq (1/2)\\exp[\\beta(K+J)]$。然后，由拉马钱德兰景观驱动的局部手性偏差在有限的螺旋域上被放大。", "authors": [{"name": "Biman Bagchi"}], "featured_authors": [{"name": "Biman Bagchi"}], "author_count": 1}, {"id": "2608.03665", "category": "cond-mat", "title": "Quantum Impurities as Probes of Finite-Temperature Fluctuations in Two-Dimensional Bose Gases", "abstract": "Two-dimensional quantum gases provide a distinctive setting in which enhanced thermal fluctuations, finite-size effects, and two-body bound-state formation are intrinsically intertwined. In this work, we study a single attractive impurity immersed in a finite, weakly interacting two-dimensional Bose gas, where finite size stabilizes a nonzero condensate fraction by introducing an infrared momentum scale, thereby enabling a Bogoliubov description of the bath. Using a hybrid approach that combines finite-temperature many-body scattering theory with input from path-integral Monte Carlo, we analyze the impurity quasiparticle energy across the condensate and normal regimes. The infrared scale generates a phonon-activation temperature below which the impurity energy remains nearly temperature independent. Once the resolved phonon modes become thermally populated, their contribution competes with condensate depletion, producing a nonmonotonic temperature dependence of the polaron energy. These results suggest that attractive Bose polarons may serve as sensitive probes of finite-size thermal fluctuations, phonon dressing, and bound-state physics in low-dimensional Bose gases.", "url": "https://arxiv.org/abs/2608.03665", "type": "理论+数值", "summary": "二维量子气体提供了一种独特的环境，其中增强的热波动、有限尺寸效应和二体束缚态形成本质上相互交织。在这项工作中，我们研究了浸入有限、弱相互作用的二维玻色气体中的单一有吸引力的杂质，其中有限的尺寸通过引入红外动量尺度来稳定非零冷凝物分数，从而实现浴的博戈柳波夫描述。使用将有限温度多体散射理论与路径积分蒙特卡罗输入相结合的混合方法，我们分析了凝聚态和正常态的杂质准粒子能量。红外标度产生声子激活温度，低于该温度杂质能量几乎保持与温度无关。一旦解析的声子模式变得热填充，它们的贡献就会与凝聚态耗尽竞争，产生极化子能量的非单调温度依赖性。这些结果表明，有吸引力的玻色极化子可以作为低维玻色气体中有限尺寸热波动、声子修整和束缚态物理的敏感探针。", "authors": [{"name": "Victor Velasco"}, {"name": "Gabriele Spada"}, {"name": "Giovanni Midei"}, {"name": "Andrea Perali"}, {"name": "Luis A. Peña Ardila"}], "featured_authors": [{"name": "Victor Velasco"}, {"name": "Gabriele Spada"}, {"name": "Giovanni Midei"}, {"name": "Andrea Perali"}, {"name": "Luis A. Peña Ardila"}], "author_count": 5}, {"id": "2608.03680", "category": "cond-mat", "title": "Machine Learning Bandgap Prediction of Nanoporous Graphenes with Water", "abstract": "The structure and dynamical behavior of water confined at or within nanostructures is a topic central to many fields, from biology to emerging electronics such as carbon nanostructures. Nanoporous graphene (NPG) containing periodic nanoscale pores with specific topologies has emerged as a promising material in carbon-based nanoelectronics; however, its interaction with ambient water remains poorly understood. Here, we combine density functional theory (DFT), ab initio molecular dynamics (AIMD), and interpretable machine learning (ML) to reveal how water controls quantum transport in NPGs. Depending on the local hydration structure, the bandgap varies by more than a factor of two across NPG and nitrogen-doped hybrid (h-NPG) systems. To uncover the underlying mechanism, we develop Smooth Overlap of Atomic Positions (SOAP)-based black-box and physics-informed grey-box ML models. The Gaussian process regression model achieves near-DFT accuracy while enabling physical interpretation. Analysis identifies water dipole orientation, water-substrate distance, water center-of-geometry, and ribbon-resolved dipole moments as the dominant factors controlling bandgap modulation across NPG and h-NPG systems.", "url": "https://arxiv.org/abs/2608.03680", "type": "理论+数值", "summary": "限制在纳米结构处或内部的水的结构和动力学行为是许多领域的核心主题，从生物学到碳纳米结构等新兴电子学。含有具有特定拓扑结构的周期性纳米级孔的纳米多孔石墨烯（NPG）已成为碳基纳米电子学中有前途的材料；然而，它与环境水的相互作用仍然知之甚少。在这里，我们结合密度泛函理论（DFT）、从头算分子动力学（AIMD）和可解释机器学习（ML）来揭示水如何控制 NPG 中的量子传输。根据局部水合结构，NPG 和氮掺杂混合 (h-NPG) 系统的带隙变化超过两倍。为了揭示底层机制，我们开发了基于原子位置平滑重叠 (SOAP) 的黑盒和基于物理的灰盒 ML 模型。高斯过程回归模型在实现物理解释的同时实现了接近 DFT 的精度。\n\n分析确定水偶极子方向、水基距离、水几何中心和带状分辨偶极矩是控制 NPG 和 h-NPG 系统带隙调制的主要因素。", "authors": [{"name": "Sneha Mittal"}, {"name": "Alan E. Anaya Morales"}, {"name": "Victor Rosendal"}, {"name": "Mads Brandbyge"}], "featured_authors": [{"name": "Sneha Mittal"}, {"name": "Alan E. Anaya Morales"}, {"name": "Victor Rosendal"}, {"name": "Mads Brandbyge"}], "author_count": 4}, {"id": "2608.03730", "category": "cond-mat", "title": "A Spectral Route to Directed-Polymer Glasses", "abstract": "A finite density of mutually avoiding directed polymers in a quenched random medium is a minimal model of glassy line matter. The dilute theory, solved by replica Bethe ansatz, predicts an interaction free energy proportional to $\\rho^2$ and disorder cumulants with distinct power-law dependences on the density $\\rho$, but direct numerical tests have been hindered by the combinatorially large many-polymer transfer matrix. We recast the problem as filling logarithmic eigenvalues of a single-polymer transfer-matrix product, obtaining the quenched free energy, its cumulants, and a disorder-induced linear spectral edge consistent with the replica prediction.", "url": "https://arxiv.org/abs/2608.03730", "type": "理论+数值", "summary": "淬火随机介质中相互避免定向聚合物的有限密度是玻璃线物质的最小模型。由复制品 Bethe ansatz 解决的稀释理论预测，相互作用自由能与 $\\rho^2$ 成正比，无序累积量与密度 $\\rho$ 具有明显的幂律依赖性，但直接数值测试受到组合大的多聚合物转移矩阵的阻碍。我们将问题重新定义为填充单聚合物转移矩阵乘积的对数特征值，获得淬灭自由能、其累积量以及与复制品预测一致的无序引起的线性光谱边缘。", "authors": [{"name": "Sen Mu"}, {"name": "Abbas Ali Saberi"}, {"name": "Mehran Kardar"}], "featured_authors": [{"name": "Sen Mu"}, {"name": "Abbas Ali Saberi"}, {"name": "Mehran Kardar"}], "author_count": 3}, {"id": "2608.03770", "category": "cond-mat", "title": "Analytical results of Typical Medium Theory for the Bethe lattice with Cauchy disorder", "abstract": "We present a combined numerical and analytically tractable realization of the typical medium theory (TMT) for Anderson localization on the infinite-connectivity Bethe lattice with Cauchy-distributed on-site disorder. Exploiting the special properties of the Cauchy distribution and the Bethe lattice, we derive an analytical expression for the typical density of states (TDOS) and obtain a simplified TMT self-consistency scheme. We show that the TDOS at the band center decreases linearly with disorder strength and vanishes at the critical disorder $W_c=D/2$. The resulting $\\omega$--$W$ phase diagram reveals the continuous collapse of the mobility edge and the disappearance of extended states.", "url": "https://arxiv.org/abs/2608.03770", "type": "理论+数值", "summary": "我们提出了典型介质理论 (TMT) 的组合数值和分析易处理实现，用于在具有柯西分布现场无序的无限连通性 Bethe 晶格上进行安德森定位。利用柯西分布和贝特晶格的特殊性质，我们推导了典型态密度（TDOS）的解析表达式，并获得了简化的TMT自洽方案。我们表明，带中心的 TDOS 随无序强度线性下降，并在临界无序 $W_c=D/2$ 处消失。由此产生的 $\\omega$--$W$ 相图揭示了迁移率边缘的连续崩溃和扩展态的消失。", "authors": [{"name": "A. Östlin"}, {"name": "I. Titvinidze"}, {"name": "M. Kollar"}, {"name": "D. Jones"}, {"name": "L. Chioncel"}], "featured_authors": [{"name": "A. Östlin"}, {"name": "I. Titvinidze"}, {"name": "M. Kollar"}, {"name": "D. Jones"}, {"name": "L. Chioncel"}], "author_count": 5}, {"id": "2608.03786", "category": "cond-mat", "title": "Antisymmetric Dynamical Spin Correlations: Spin-Space-Group Constraints and Frequency-Moment Sum Rules", "abstract": "Polarized inelastic neutron scattering probes the handedness of magnetic excitations through the spin-component-antisymmetric part of the dynamical spin-structure-factor tensor. We derive its symmetry constraints under unitary and antiunitary residual operations of magnetic space groups and spin-space groups. These constraints determine the allowed tensor components, their parity under momentum reversal, and symmetry-enforced nodes. We then introduce the corresponding antisymmetric commutator spectral function and derive exact zero-temperature sum rules for its frequency moments. The zeroth moment is fixed by the uniform magnetization. For Heisenberg or XXZ exchange Hamiltonians, the first moment of the $xy$ component is fixed by a momentum-weighted static vector chirality. For compensated collinear antiferromagnets, the antisymmetric dynamical structure factor is forbidden when inversion or a translation relates the opposite-spin sublattices. In rotation-related altermagnets, however, an $xy$ component that is even under momentum reversal is allowed at generic wave vectors. Finite antisymmetric spectral weight can therefore coexist with vanishing zeroth and first moments of the commutator spectral function. In a planar helix, by contrast, a residual antiunitary spin-space-group symmetry makes the allowed $xy$ component odd under momentum reversal. Its first moment is generally nonzero and is fixed by a momentum-weighted static vector chirality through the first-moment sum rule. Linear spin-wave calculations for representative altermagnetic and helical models explicitly realize these symmetry and sum-rule constraints.", "url": "https://arxiv.org/abs/2608.03786", "type": "理论+数值", "summary": "偏振非弹性中子散射通过动态自旋结构因子张量的自旋分量反对称部分探测磁激发的旋向性。我们推导了磁空间群和自旋空间群的酉和反酉剩余运算下的对称约束。这些约束决定了允许的张量分量、它们在动量反转下的奇偶性以及强制对称的节点。然后，我们引入相应的反对称换向器谱函数，并推导出其频率矩的精确零温和规则。零阶矩由均匀磁化固定。对于海森堡或 XXZ 交换哈密顿量，$xy$ 分量的一阶矩由动量加权静态矢量手性固定。对于补偿共线反铁磁体，当反演或平移涉及相反自旋子晶格时，反对称动态结构因子被禁止。然而，在与旋转相关的交流磁体中，即使在动量反转的情况下，通用波矢量也允许存在 $xy$ 分量。\n\n因此，有限反对称谱权可以与换向器谱函数的零阶矩和一阶矩消失共存。相比之下，在平面螺旋中，残余反酉自旋空间群对称性使得动量反转下允许的 $xy$ 分量为奇数。它的一阶矩通常不为零，并且通过一阶矩和规则由动量加权静态矢量手性固定。代表性交变磁模型和螺旋模型的线性自旋波计算明确地实现了这些对称性和求和规则约束。", "authors": [{"name": "Tsutomu Momoi"}], "featured_authors": [{"name": "Tsutomu Momoi"}], "author_count": 1}, {"id": "2608.03798", "category": "cond-mat", "title": "From phase transformation to amorphization: damage accumulation in Yb-implanted \\b{eta}-Ga2O3", "abstract": "This study provides a comprehensive analysis of the radiation response and structural evolution of differently oriented $\\beta$-Ga$_{2}$O$_{3}$ single crystals subjected to Yb ion implantation over a wide fluence range from $5 \\times 10^{12}$ to $1 \\times 10^{16}$~cm$^{-2}$ ($0.04$--$74$~dpa). A multi-technique approach (RBS/c, PAS, HRTEM, and HRXRD) was employed to investigate the mechanisms of damage accumulation. The results reveal a multi-stage process of defect evolution. At a critical threshold of around $0.4$~dpa, the accumulation of lattice strain triggers a phase transformation from monoclinic $\\beta$-Ga$_{2}$O$_{3}$ to a defective spinel structure of $\\gamma$-Ga$_{2}$O$_{3}$. Notably, the formation of this new phase is accompanied by strain relaxation. With further irradiation, defects develop within the crystal structure of $\\gamma$-Ga$_{2}$O$_{3}$. The associated atomic reorganization at this stage is reflected by a distinct dip in the damage accumulation curve and the appearance of stacking faults in the subsurface region of the implanted layer. In contrast to previous reports suggesting high radiation stability of this phase, the present study clearly demonstrates that continuous defect accumulation results in a significant increase in both displaced atoms and vacancy-type defects, with a strong depth dependence in their type and density. Ultimately, at an irradiation level of approximately $7$~dpa, the surface layer amorphizes. With further irradiation, the amorphous layer expands, gradually replacing the transient $\\gamma$-Ga$_{2}$O$_{3}$ phase. These findings reveal that the radiation tolerance of gallium oxide is highly sensitive to ion-specific interactions and strain-induced instabilities, thereby challenging the previously assumed robustness of this material under high-fluence ion irradiation.", "url": "https://arxiv.org/abs/2608.03798", "type": "理论", "summary": "本研究对不同取向的 $\\beta$-Ga$_{2}$O$_{3}$ 单晶在 $5 \\times 10^{12}$ 到 $1 \\times 10^{16}$~cm$^{-2}$ ($0.04$--$74$~dpa) 的宽注量范围内进行 Yb 离子注入的辐射响应和结构演化进行了全面分析。采用多种技术方法（RBS/c、PAS、HRTEM 和 HRXRD）来研究损伤累积的机制。结果揭示了缺陷演变的多阶段过程。在 $0.4$~dpa 左右的临界阈值下，晶格应变的积累会触发从单斜晶系 $\\beta$-Ga$_{2}$O$_{3}$ 到缺陷尖晶石结构 $\\gamma$-Ga$_{2}$O$_{3}$ 的相变。值得注意的是，这种新相的形成伴随着应变弛豫。随着进一步的照射，$\\gamma$-Ga$_{2}$O$_{3}$ 晶体结构内出现缺陷。此阶段相关的原子重组通过损伤累积曲线的明显下降和注入层的地下区域中堆垛层错的出现来反映。\n\n与之前表明该相具有高辐射稳定性的报道相反，本研究清楚地表明，连续的缺陷积累导致移位原子和空位型缺陷的显着增加，并且其类型和密度具有很强的深度依赖性。最终，在大约 $7$~dpa 的照射水平下，表面层发生非晶化。随着进一步的照射，非晶层膨胀，逐渐取代瞬态的 $\\gamma$-Ga$_{2}$O$_{3}$ 相。这些发现表明，氧化镓的辐射耐受性对离子特异性相互作用和应变引起的不稳定性高度敏感，从而挑战了先前假设的这种材料在高通量离子辐照下的鲁棒性。", "authors": [{"name": "Joanna Matulewicz"}, {"name": "Renata Ratajczak"}, {"name": "Ewa Grzanka"}, {"name": "Maciej Oskar Liedke"}, {"name": "Damian Kalita"}, {"name": "Eric Hirschmann"}, {"name": "Andreas Wagner"}, {"name": "Mikolaj Grabowski"}, {"name": "Michal A. Stróżyk"}, {"name": "Cyprian Mieszczyński"}, {"name": "Przemyslaw Jóźwik"}, {"name": "Ulrich Kentsch"}, {"name": "Rene Heller"}, {"name": "Frederico Garrido"}], "featured_authors": [{"name": "Joanna Matulewicz"}, {"name": "Renata Ratajczak"}, {"name": "Ewa Grzanka"}, {"name": "Ulrich Kentsch"}, {"name": "Rene Heller"}, {"name": "Frederico Garrido"}], "author_count": 14}, {"id": "2608.03808", "category": "cond-mat", "title": "Generalized Space Groups from Internal Configuration Spaces", "abstract": "We develop a unified construction of generalized space groups for crystals with unconventional internal degrees of freedom. Starting from the full group $G_P$ of allowed internal transformations and the stabilizer $P$ of a reference object, we determine the pointwise and setwise symmetries, $J$ and $K$, of the allowed configuration set. Goursat's lemma then couples the internal quotient $K/J$ to a spatial quotient. The framework includes ordinary, magnetic, spin, and color space groups as special cases. As an example, we consider a dodecahedral object with $P=I\\simeq A_5$, for which we obtain the nontrivial pair $T\\triangleleft O$ with $O/T\\simeq\\mathbb Z_2$. The resulting generalized space group hosts a point node with topological charge $|C|=12$.", "url": "https://arxiv.org/abs/2608.03808", "type": "理论", "summary": "我们为具有非常规内部自由度的晶体开发了广义空间群的统一构造。从允许的内部变换的完整组 $G_P$ 和参考对象的稳定器 $P$ 开始，我们确定允许的配置集的点对称和集合对称 $J$ 和 $K$。然后，Goursat 引理将内商 $K/J$ 与空间商耦合起来。该框架包括普通空间组、磁性空间组、自旋空间组和颜色空间组作为特殊情况。作为一个例子，我们考虑一个具有 $P=I\\simeq A_5$ 的十二面体对象，为此我们获得了非平凡对 $T\\triangleleft O$ 和 $O/T\\simeq\\mathbb Z_2$。由此产生的广义空间群托管一个具有拓扑电荷 $|C|=12$ 的点节点。", "authors": [{"name": "Zeying Zhang"}, {"name": "Zhenye Li"}, {"name": "Zhi-Ming Yu"}, {"name": "Gui-Bin Liu"}, {"name": "Yugui Yao"}], "featured_authors": [{"name": "Zeying Zhang"}, {"name": "Zhenye Li"}, {"name": "Zhi-Ming Yu"}, {"name": "Gui-Bin Liu"}, {"name": "Yugui Yao"}], "author_count": 5}, {"id": "2608.03853", "category": "cond-mat", "title": "Magnetic-field control of Fermi polaron fine structure and polarization in strained monolayer semiconductors", "abstract": "The theory of attractive Fermi polaron energy spectrum fine structure and polarization in doped two-dimensional semiconductors in external magnetic field is developed. Fermi polaron $g$ factor renormalization due to correlations with the valley-polarized Fermi sea of resident charge carriers is calculated. We study the competition between Zeeman and strain-induced splittings in monolayers under uniaxial strain. The control of strain, magnetic field and electron density allows continuous tuning of energy splitting and eigenstate polarization. Linearly polarized strain-induced split doublet exhibits quadratic Zeeman shift changing to linear Zeeman splitting with elliptical polarization with the increase of magnetic field. We identify a critical magnetic field above which resident charge carriers become fully valley polarized and only one circularly polarized Fermi polaron state remains. Within the Green's function approach we calculate energy levels and Stokes parameters of attractive Fermi polaron states and introduce a simplified effective two-level model allowing us to study analytically the interplay of Zeeman and pseudo-Zeeman splitting. We calculate absorption and reflection spectra, including circular and linear dichroism in the trion spectral range. These results show that real and strain-induced pseudomagnetic fields provide complementary tools for controlling the optical response of many-body excitonic quasiparticles in two-dimensional semiconductors.", "url": "https://arxiv.org/abs/2608.03853", "type": "理论", "summary": "发展了外磁场下掺杂二维半导体的吸引费米极化子能谱精细结构和极化理论。计算由于与驻留电荷载流子的谷极化费米海的相关性而导致的费米极化子 $g$ 因子重整化。我们研究了单轴应变下单层塞曼和应变诱导分裂之间的竞争。应变、磁场和电子密度的控制允许连续调节能量分裂和本征态极化。随着磁场的增加，线性偏振应变诱导分裂双峰表现出二次塞曼位移，变为椭圆偏振的线性塞曼分裂。我们确定了一个临界磁场，高于该磁场，驻留电荷载流子将完全谷极化，并且仅保留一个圆极化的费米极化子态。在格林函数方法中，我们计算了吸引费米极化子态的能级和斯托克斯参数，并引入了一个简化的有效两能级模型，使我们能够分析研究塞曼和伪塞曼分裂的相互作用。\n\n我们计算吸收和反射光谱，包括三重粒子光谱范围内的圆二色性和线性二色性。这些结果表明，真实的赝磁场和应变引起的赝磁场为控制二维半导体中多体激子准粒子的光学响应提供了补充工具。", "authors": [{"name": "Zakhar A. Iakovlev"}], "featured_authors": [{"name": "Zakhar A. Iakovlev"}], "author_count": 1}, {"id": "2608.03870", "category": "cond-mat", "title": "Surface-Selective Probe of Spin-Triplet Superconductivity in Rhombohedral Graphene", "abstract": "Superconductivity in rhombohedral graphene has been observed across many layer numbers, with mounting evidence pointing toward spin-triplet pairing, yet complementary probes of the superconducting spin structure remain needed. Here we use one-sided WS$_2$ proximity in rhombohedral pentalayer graphene (R5G) as a surface-selective spin-orbit probe. The induced Ising spin-orbit coupling is strongest for carriers localized near the WS$_2$ interface, allowing the displacement field to tune the overlap between superconducting carriers and the spin-orbit perturbation. We observe a strongly asymmetric superconducting landscape: two robust pockets, SC1 and SC2, survive only on mutually opposite signs of displacement field, while a third pocket, SC3, is substantially weaker. Gate-tracking features, quantum oscillations, and self-consistent band-structure calculations identify the layer polarization and Fermi-surface character of the relevant carriers. The robust superconducting states are absent or strongly weakened when the active high-DOS carriers are polarized toward the WS$_2$ interface. Since Ising spin-orbit coupling is compatible with time-reversed spin-singlet pairing but competes with same-spin intervalley triplet pairing by canting or pinning the parent spin texture, this surface-selective suppression provides additional evidence for spin-triplet superconductivity involving both hole-like and electron-like carriers. Our results establish one-sided TMD proximity as a displacement-field-tunable probe of superconducting spin structure in rhombohedral graphene.", "url": "https://arxiv.org/abs/2608.03870", "type": "数值", "summary": "菱面体石墨烯中的超导性已经在许多层数上被观察到，越来越多的证据表明自旋三重态配对，但仍然需要超导自旋结构的互补探针。在这里，我们使用菱面体五层石墨烯（R5G）中的单侧 WS$_2$ 邻近度作为表面选择性自旋轨道探针。对于位于 WS$_2$ 界面附近的载流子，感应的伊辛自旋轨道耦合最强，允许位移场调整超导载流子和自旋轨道扰动之间的重叠。我们观察到一个强烈不对称的超导景观：两个强大的口袋，SC1和SC2，仅在位移场的相反符号上生存，而第三个口袋，SC3，则要弱得多。栅极跟踪特征、量子振荡和自洽能带结构计算可识别相关载流子的层偏振和费米表面特征。当活跃的高 DOS 载流子向 WS$_2$ 界面极化时，鲁棒的超导态不存在或被严重削弱。\n\n由于伊辛自旋轨道耦合与时间反转的自旋单重态配对兼容，但通过倾斜或钉扎母体自旋纹理与同自旋间三重态配对竞争，这种表面选择性抑制为涉及类空穴和类电子载流子的自旋三重态超导性提供了额外的证据。我们的结果建立了单侧 TMD 邻近作为菱面体石墨烯中超导自旋结构的位移场可调探针。", "authors": [{"name": "Kilian Krötzsch"}, {"name": "Zekang Zhou"}, {"name": "Kryštof Kolář"}, {"name": "Yonggen Li"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Moty Heiblum"}, {"name": "Cyprian Lewandowski"}, {"name": "Mitali Banerjee"}], "featured_authors": [{"name": "Kilian Krötzsch"}, {"name": "Zekang Zhou"}, {"name": "Kryštof Kolář"}, {"name": "Moty Heiblum"}, {"name": "Cyprian Lewandowski"}, {"name": "Mitali Banerjee"}], "author_count": 9}, {"id": "2608.03960", "category": "cond-mat", "title": "Kappa distributions as asymptotic marginals of exponential family ensembles", "abstract": "Recently (Physica A 660 130370, 2025), emergence of superstatistical behavior in driven classical systems has been shown for systems with constant microcanonical heat capacity. As an application of this result, in this work we show that a system of $N$ particles with inverse gamma distribution of total kinetic energies must have kappa-distributed single-particle velocities in the limit $N \\rightarrow \\infty$. Our results provide insight into the nature of kappa distributions outside the theory of nonextensive statistical mechanics, while also bringing forward a practical method for the generation of kappa velocities via Monte Carlo Metropolis simulation in the inverse gamma ensemble.", "url": "https://arxiv.org/abs/2608.03960", "type": "理论+数值", "summary": "最近（Physica A 660 130370, 2025），对于具有恒定微正则热容的系统，驱动经典系统中出现了超统计行为。作为这一结果的应用，在这项工作中，我们表明，具有总动能逆伽马分布的 $N$ 粒子系统必须在极限 $N \\rightarrow \\infty$ 内具有 kappa 分布的单粒子速度。我们的结果提供了对非广延统计力学理论之外的 kappa 分布本质的深入了解，同时还提出了一种通过逆伽马系综中的 Monte Carlo Metropolis 模拟生成 kappa 速度的实用方法。", "authors": [{"name": "Sergio Davis"}], "featured_authors": [{"name": "Sergio Davis"}], "author_count": 1}, {"id": "2608.04004", "category": "cond-mat", "title": "Localizing polymers promotes the centre-mode elastic instability", "abstract": "The centre-mode elastic instability, prevalent in rectilinear flows of dilute polymer solutions, allows dynamic states to emerge even in the absence of inertia. Here, we show that this instability can be significantly enhanced when the base flow has a nonuniform spatial-distribution of polymers. Specifically, we consider a polymer-laden stream sandwiched between streams of pure solvent. In such a flow, the polymeric stress not only depends on the conformation tensor (determined here by the Oldroyd-B equation) but also varies proportionally with the polymer concentration field, which satisfies a scalar transport equation. We consider the Stokes limit and first focus on the simple setting of periodic Kolmogorov flow. A linear stability analysis shows that the centre-mode instability is strongly promoted when the base flow has polymers localized near the maximum of the base-velocity profile; concentrating polymers near the maximum shear suppresses the instability. As the polymer loading is increased, the neutral stability curve of the nonuniform system develops a double-lobe form, which results in a sudden decrease in the critical Weissenberg number (product of the elastic relaxation time and the typical strain-rate). An energy analysis attributes this destabilization to elastic feedback forces arising from gradients in the polymer concentration. We end by demonstrating the relevance of these findings to channel flow, where localizing polymers about the centreline is shown to strongly promote the centre-mode instability.", "url": "https://arxiv.org/abs/2608.04004", "type": "理论", "summary": "稀聚合物溶液的直线流动中普遍存在中心模式弹性不稳定性，即使在没有惯性的情况下也能出现动态状态。在这里，我们表明，当基流具有不均匀的聚合物空间分布时，这种不稳定性会显着增强。具体来说，我们考虑夹在纯溶剂流之间的充满聚合物的流。在这种流动中，聚合物应力不仅取决于构象张量（此处由 Oldroyd-B 方程确定），而且与聚合物浓度场成比例变化，满足标量输运方程。我们考虑斯托克斯极限，首先关注周期性柯尔莫哥洛夫流的简单设置。线性稳定性分析表明，当基流具有位于基速曲线最大值附近的聚合物时，中心模式不稳定性会受到强烈促进；将聚合物集中在最大剪切附近可以抑制不稳定性。\n\n随着聚合物负载量的增加，非均匀系统的中性稳定性曲线形成双瓣形式，导致临界魏森伯格数（弹性松弛时间和典型应变率的乘积）突然下降。能量分析将这种不稳定归因于聚合物浓度梯度产生的弹性反馈力。最后，我们证明了这些发现与通道流动的相关性，其中中心线附近的聚合物局部化会强烈促进中心模式的不稳定性。", "authors": [{"name": "Shailendra Kumar Yadav"}, {"name": "Jason R. Picardo"}], "featured_authors": [{"name": "Shailendra Kumar Yadav"}, {"name": "Jason R. Picardo"}], "author_count": 2}, {"id": "2608.02696", "category": "hep-th", "title": "Size Operator and Spectral Clustering in the Two Coupled SYK Model", "abstract": "At large $N$, two coupled Sachdev-Ye-Kitaev models realize an eternal traversable wormhole with a discrete spectrum. We show that at finite $N$ the spectrum organizes into clusters labeled by operator size. Low-size clusters evolve into the conformal towers and define a weak-ergodicity-breaking subspace responsible for the long-lived wormhole revival dynamics. Moreover, the competition between size energy and size entropy provides a microscopic interpretation of the wormhole-black hole transition. These results reveal operator size as the bridge between the finite-$N$ spectrum and the emergent gravitational physics at large $N$.", "url": "https://arxiv.org/abs/2608.02696", "type": "理论", "summary": "At large $N$, two coupled Sachdev-Ye-Kitaev models realize an eternal traversable wormhole with a discrete spectrum. We show that at finite $N$ the spectrum organizes into clusters labeled by operator size.小尺寸的簇演化成共形塔，并定义了一个弱遍历性破坏的子空间，负责长期的虫洞复兴动力学。 Moreover, the competition between size energy and size entropy provides a microscopic interpretation of the wormhole-black hole transition. These results reveal operator size as the bridge between the finite-$N$ spectrum and the emergent gravitational physics at large $N$.", "authors": [{"name": "Juan Santos-Suárez"}, {"name": "Martí Berenguer"}, {"name": "Javier Mas"}, {"name": "Alfonso V. Ramallo"}], "featured_authors": [{"name": "Juan Santos-Suárez"}, {"name": "Martí Berenguer"}, {"name": "Javier Mas"}, {"name": "Alfonso V. Ramallo"}], "author_count": 4}, {"id": "2608.02715", "category": "hep-th", "title": "Krylov Complexity and $c$-function along RG Flows", "abstract": "We investigate Krylov spread complexity along holographic renormalisation-group flows using the proposal that its growth rate is captured by the proper radial momentum of an in-falling massive probe. We focus on the second time derivative of the complexity ${U}$, which is determined locally by the redshift and radial metric functions of the dual geometry. For Lorentz-invariant domain-wall flows preserving the spacetime dimension, we derive a new relation between ${U}$ and the covariant central charge $c_{\\text{cov}}$. The decrease of the covariant central function towards the infrared is accompanied by a monotonic increase of the complexity acceleration. For the top-down Dp-brane family, we obtain a universal relation. We then examine flows across dimensions, including a twisted compactification from four to two dimensions and from six to four dimensions. In these examples $c_{\\rm cov}$ and ${U }$ are co-monotonic, in sharp contrast with the inverse correlation characteristic of fixed-dimensional flows. We argue that this reversal reflects the reorganisation, rather than simple depletion, of degrees of freedom into lower-dimensional sectors under compactification. Our results identify complexity acceleration as a sensitive geometric diagnostic connecting information spreading, holographic central functions and RG evolution.", "url": "https://arxiv.org/abs/2608.02715", "type": "理论", "summary": "我们研究了克雷洛夫沿着全息重正化群流传播的复杂性，使用的建议是其增长率是由下落的巨型探测器的适当径向动量捕获的。我们关注复杂度 ${U}$ 的二阶时间导数，它是由对偶几何的红移和径向度量函数局部确定的。对于保留时空维度的洛伦兹不变域壁流，我们推导出 ${U}$ 和协变中心电荷 $c_{\\text{cov}}$ 之间的新关系。 The decrease of the covariant central function towards the infrared is accompanied by a monotonic increase of the complexity acceleration. For the top-down Dp-brane family, we obtain a universal relation. We then examine flows across dimensions, including a twisted compactification from four to two dimensions and from six to four dimensions.在这些例子中，$c_{\\rm cov}$ 和 ${U }$ 是共单调的，与固定维流的逆相关特性形成鲜明对比。我们认为，这种逆转反映了紧致化下低维区域自由度的重组，而不是简单的消耗。\n\n我们的结果将复杂性加速确定为连接信息传播、全息中心函数和 RG 演化的敏感几何诊断。", "authors": [{"name": "Carlos Nunez"}, {"name": "Dibakar Roychowdhury"}], "featured_authors": [{"name": "Carlos Nunez"}, {"name": "Dibakar Roychowdhury"}], "author_count": 2}, {"id": "2608.02717", "category": "hep-th", "title": "$\\mathcal{N}=2$ RG flows, Non-Invertible Symmetries and Matrix Factorisations", "abstract": "We study the behaviour of the topological defect lines of the $k^{\\rm th}$ ${\\cal N}=2$ minimal models that are preserved by the least relevant perturbation to first order. It is usually believed that these defects should then also define symmetries of the IR theory, which for the usual \"massless'' flow should be the $(k-2)^{\\rm nd}$ ${\\cal N}=2$ minimal model. Using CFT arguments we show that this is not possible. We also reproduce this result using matrix factorisation techniques: while the corresponding B-type defects can be adjusted to first order in the deformation, there is an obstruction at second order, which is associated with a supersymmetry anomaly. By contrast, for the associated massive integrable flow, which corresponds to a Chebyshev deformation of the superpotential, all of these defects can be consistently deformed, and they indeed define symmetries of the massive IR theory.", "url": "https://arxiv.org/abs/2608.02717", "type": "理论", "summary": "我们研究了 $k^{\\rm th}$ ${\\cal N}=2$ 最小模型的拓扑缺陷线的行为，这些模型通过对一阶的最小相关扰动而得以保留。通常认为，这些缺陷也应该定义红外理论的对称性，对于通常的“无质量”流来说，应该是 $(k-2)^{\\rm nd}$ ${\\cal N}=2$ 最小模型。使用 CFT 参数，我们表明这是不可能的。我们还使用矩阵分解技术重现此结果：虽然相应的 B 型缺陷可以在变形中调整为一阶，但在二阶存在障碍，这与超对称性相关相比之下，对于对应于超势的切比雪夫变形的相关大质量可积流，所有这些缺陷都可以一致变形，并且它们确实定义了大质量红外理论的对称性。", "authors": [{"name": "Federico Ambrosino"}, {"name": "Matthias R. Gaberdiel"}, {"name": "Yu Nakayama"}], "featured_authors": [{"name": "Federico Ambrosino"}, {"name": "Matthias R. Gaberdiel"}, {"name": "Yu Nakayama"}], "author_count": 3}, {"id": "2608.02719", "category": "hep-th", "title": "Partial Waves for Multipositivity", "abstract": "We develop a partial-wave formalism providing the missing spin-resolved framework for multipositivity among massless planar amplitudes. We present a systematic procedure for constructing kinematic charts realizing the complex-forward limit. Applying it to obtain the four-, five-, and six-point charts, we show how to derive the one-to-two and one-to-three wavefunctions and construct the associated partial waves. The resulting formalism places higher-point multipositivity on the same footing as conventional partial-wave analyses of two-to-two scattering.", "url": "https://arxiv.org/abs/2608.02719", "type": "理论", "summary": "我们开发了一种部分波形式主义，为无质量平面振幅之间的多重正性提供了缺失的自旋解析框架。我们提出了构建运动图以实现复数前向极限的系统程序。应用它来获得四点图、五点图和六点图，我们展示了如何导出一对二和一对三波函数并构造相关的分波。由此产生的形式主义将更高点的多重正性置于与二到二散射的传统部分波分析相同的基础上。", "authors": [{"name": "Jaehoon Jeong"}], "fea
