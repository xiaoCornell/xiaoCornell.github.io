tured_authors": [{"name": "Jaehoon Jeong"}], "author_count": 1}, {"id": "2608.02720", "category": "hep-th", "title": "Thermal Order in the Biconical Model", "abstract": "Thermal fluctuations are generally expected to destroy order and restore symmetries at sufficiently high temperatures. Recently, however, a family of scalar theories in $2+1$ dimensions was shown to exhibit $\\mathbb Z_2$ symmetry breaking that persists to arbitrarily high temperatures using a variety of approaches, including the $\\epsilon$-expansion, the FRG, and large-$N$ techniques. Although the similarities among these theories suggest that they belong to the same universality class, this connection has not been established explicitly. In this work, we fill this gap. Using large-$N$ methods, we analytically study the biconical vector model in a range of spacetime dimensions, including $2+1$, at leading and next-to-leading order in the $1/N$ expansion. We determine the RG flow, fixed-point structure, and the CFT data of the infrared theory, reproducing and extending previous results and thereby unifying the apparently distinct constructions within a common analytic framework. We derive the effective potential, establish its stable minima at zero and finite temperature, and demonstrate spontaneous $\\mathbb{Z}_2$ symmetry breaking at arbitrarily high temperatures for large finite $N$.", "url": "https://arxiv.org/abs/2608.02720", "type": "理论", "summary": "通常预计热波动会在足够高的温度下破坏秩序并恢复对称性。然而，最近，一系列 $2+1$ 维度的标量理论被证明表现出 $\\mathbb Z_2$ 对称性破缺，该对称性破缺在任意高温下仍然存在，使用各种方法，包括 $\\epsilon$ 展开、FRG 和大 $N$ 技术。尽管这些理论之间的相似性表明它们属于同一普遍性类别，但这种联系尚未明确建立。在这项工作中，我们填补了这一空白。使用大$N$方法，我们分析研究了一系列时空维度（包括$2+1$）的双锥向量模型，在$1/N$展开中处于领先和次领先的顺序。我们确定了红外理论的 RG 流、定点结构和 CFT 数据，再现和扩展了先前的结果，从而将明显不同的结构统一在一个共同的分析框架内。\n\n我们导出有效势，在零和有限温度下建立其稳定最小值，并证明对于大的有限 $N$ 在任意高温下自发 $\\mathbb{Z}_2$ 对称性破缺。", "authors": [{"name": "Michael Smolkin"}, {"name": "Lev Yung"}], "featured_authors": [{"name": "Michael Smolkin"}, {"name": "Lev Yung"}], "author_count": 2}, {"id": "2608.02728", "category": "hep-th", "title": "Fermionic Villain model with exact lattice chiral symmetries", "abstract": "We present a fermionic lattice Hamiltonian that exactly realizes the $\\mathrm{U(1)}_\\mathrm{L}\\times \\mathrm{U(1)}_\\mathrm{R}$ global symmetry and the associated chiral anomalies of a massless Dirac fermion in 1+1 dimensions. The construction couples Villain bosons to a Kitaev chain of Majorana fermions, where the bosonic fields are essential for evading Nielsen-Ninomiya-type no-go theorems. For two copies of our model, we realize the anomaly-free $\\mathrm{U(1)}_{3450}$ global symmetry and construct symmetric boundary conditions. We analytically demonstrate symmetric mass generation by mapping the symmetry-preserving six-fermion interactions to fermion bilinear terms using fermionic T-duality. Finally, by gauging general anomaly-free global symmetries, we obtain a broad class of lattice chiral gauge theories. As nontrivial applications, we compute the mass spectra of the lattice Schwinger model and the 3450 gauge theory, finding agreement with the corresponding continuum results.", "url": "https://arxiv.org/abs/2608.02728", "type": "理论", "summary": "我们提出了一种费米子晶格哈密顿量，它精确地实现了 1+1 维无质量狄拉克费米子的 $\\mathrm{U(1)}_\\mathrm{L}\\times \\mathrm{U(1)}_\\mathrm{R}$ 全局对称性和相关的手性反常。该结构将恶棍玻色子与马约拉纳费米子的基塔耶夫链耦合起来，其中玻色子场对于逃避尼尔森-二宫型不可行定理至关重要。对于模型的两个副本，我们实现了无异常 $\\mathrm{U(1)}_{3450}$ 全局对称性并构造了对称边界条件。我们通过使用费米子 T 对偶性将保对称六费米子相互作用映射到费米子双线性项来分析证明对称质量的生成。最后，通过测量一般无异常全局对称性，我们获得了广泛的晶格手性规范理论。作为重要的应用，我们计算了晶格 Schwinger 模型和 3450 规范理论的质谱，发现与相应的连续谱结果一致。", "authors": [{"name": "Zhiyao Lu"}, {"name": "Shu-Heng Shao"}], "featured_authors": [{"name": "Zhiyao Lu"}, {"name": "Shu-Heng Shao"}], "author_count": 2}, {"id": "2608.02731", "category": "hep-th", "title": "BRST quantization of Carroll-Weyl gauged null strings", "abstract": "We study the BRST quantization of the null string after completing its local gauge symmetry by Carroll-Weyl transformations. The resulting worldsheet theory possesses three first-class constraints, $C_1 = P^2$, $C_2 = P \\cdot X'$, and $C_3 = P \\cdot X$, whose modes realize a Weyl-BMS algebra. The additional Carroll-Weyl constraint qualitatively changes the quantum gauge complex: its scalar $s$-ghost is intrinsically coupled to the BMS $bc$-ghost sector, and the anomaly analysis involves three independent cocycles rather than a single Virasoro-type central charge. Starting from the gauge-fixed action, we derive the complete Faddeev-Popov complex, construct the matter and ghost currents and the BRST charge, and evaluate their equal-time operator products in the flipped, equivalently highest-weight, representation. The matter and ghost anomaly coefficients are $(c_{LL},c_{LS},c_{SS})_{\\mathrm{matter}}=(2D,-D,-D)$ and $(c_{LL},c_{LS},c_{SS})_{\\mathrm{ghost}}=(-54,6,4)$. Because the corresponding central terms multiply linearly independent ghost bilinears in $Q_B^2$, BRST nilpotency requires the three conditions $D=27$, $D=6$, and $D=4$, respectively. These conditions are mutually incompatible. Consequently, there is no target-space dimension in which the minimal flat Carroll-Weyl matter-plus-ghost complex is anomaly-free in the highest-weight representation. The familiar $D=26$ condition of the ILST null string is recovered only after truncation to the two-constraint BMS subsector, which defines a different quantum gauge complex.", "url": "https://arxiv.org/abs/2608.02731", "type": "理论", "summary": "我们研究了通过 Carroll-Weyl 变换完成局部规范对称性后空弦的 BRST 量化。由此产生的世界表理论拥有三个一流的约束，$C_1 = P^2$、$C_2 = P \\cdot X'$ 和 $C_3 = P \\cdot X$，其模式实现了 Weyl-BMS 代数。附加的卡罗尔-韦尔约束定性地改变了量子规范复合体：其标量 $s$-ghost 本质上耦合到 BMS $bc$-ghost 扇区，并且异常分析涉及三个独立的共循环，而不是单个 Virasoro 型中心电荷。从规范固定动作开始，我们推导了完整的 Faddeev-Popov 复合体，构造了物质电流和幽灵电流以及 BRST 电荷，并在翻转的、等效最高权重的表示中评估它们的等时算子乘积。物质和幽灵异常系数为 $(c_{LL},c_{LS},c_{SS})_{\\mathrm{matter}}=(2D,-D,-D)$ 和 $(c_{LL},c_{LS},c_{SS})_{\\mathrm{ghost}}=(-54,6,4)$。因为相应的中心项与 $Q_B^2$ 中的线性独立鬼双线性相乘，所以 BRST 幂零性分别需要三个条件 $D=27$、$D=6$ 和 $D=4$。\n\n这些条件是互不相容的。因此，不存在其中最小平面卡罗尔-韦尔物质加幽灵复合体在最高权重表示中无异常的目标空间维度。 ILST 空字符串的熟悉的 $D=26$ 条件仅在截断到两个约束 BMS 子扇区后才能恢复，该子扇区定义了不同的量子规范复合体。", "authors": [{"name": "Sarthak Duary"}, {"name": "Sourav Maji"}], "featured_authors": [{"name": "Sarthak Duary"}, {"name": "Sourav Maji"}], "author_count": 2}, {"id": "2608.02743", "category": "hep-th", "title": "Ramp, Plateau, and Wormholes without Averaging, and Hyper-non-perturbative Structures in Gravity", "abstract": "Universal hallmarks of quantum chaos---such as the ramp and plateau in the spectral form factor---and the ramp's gravitational duals involving wormholes are widely interpreted as consequences of spectral or ensemble averaging. In this paper, following an earlier proposal of~\\cite{Liu25c}, we develop an alternative approach: these phenomena arise as macroscopic smooth structures hidden within erratic microscopic data, which can be isolated through a smooth filter projection. Using the semiclassical Gutzwiller trace formula as a paradigmatic example, we illustrate how many features characteristic of random matrix models---including the ramp, the plateau, the spectral curve, and single-eigenvalue instantons---can be derived in the semiclassical limit without invoking ensemble or explicit spectral averages. We postulate the existence of a minimal Gutzwiller-like structure in the large-$N$ limit of holographic systems and explore its consequences. Beyond deriving the ramp and the plateau, this Gutzwiller-like structure predicts universal rapid macroscopic oscillations in the density of states and the possible existence of hyper-instantons, both of which involve double exponentials in $1/N^2$. On the gravity side, we demonstrate how spacetime wormholes enable the construction of emergent hyper-non-perturbative objects---such as baby-universe and wormhole condensates---which yield double exponential effects in $G_N$. This mirrors the postulated boundary Gutzwiller-like structure and provides a dual gravitational derivation of the universal rapid macroscopic oscillations in the density of states and the spectral plateau.", "url": "https://arxiv.org/abs/2608.02743", "type": "理论", "summary": "量子混沌的普遍特征——例如光谱形状因子中的斜坡和平台——以及涉及虫洞的斜坡引力对偶被广泛解释为光谱或系综平均的结果。在本文中，遵循~\\cite{Liu25c}的早期提议，我们开发了一种替代方法：这些现象作为隐藏在不稳定的微观数据中的宏观平滑结构而出现，可以通过平滑滤波器投影来隔离。使用半经典 Gutzwiller 迹公式作为范例，我们说明了在不调用系综或显式谱平均值的情况下，可以在半经典极限内导出随机矩阵模型的许多特征特征（包括斜坡、平台、谱曲线和单特征值瞬子）。我们假设在全息系统的大$N$极限中存在最小的类Gutzwiller结构，并探讨其后果。\n\n除了推导出斜坡和平台之外，这种类似 Gutzwiller 的结构还预测了态密度中普遍存在的快速宏观振荡以及超瞬时子的可能存在，这两者都涉及 $1/N^2$ 的双指数。在重力方面，我们演示了时空虫洞如何能够构建新兴的超非微扰物体（例如婴儿宇宙和虫洞凝聚体），从而在 $G_N$ 中产生双指数效应。这反映了假定的边界类古兹威勒结构，并提供了态密度和光谱平台中普遍快速宏观振荡的双重引力推导。", "authors": [{"name": "Hong Liu"}], "featured_authors": [{"name": "Hong Liu"}], "author_count": 1}, {"id": "2608.02754", "category": "hep-th", "title": "A field-inspired derivation of open string amplitudes", "abstract": "We propose a new method for computing $N$-point tree-level open string amplitudes, inspired by the field-theoretical perturbiner framework and bypassing world-sheet moduli integration. The construction rests on a weak associativity condition for a point-split, on-shell product of string vertices, introducing a binary-tree prescription with all physical channels manifest. The output is a multi-parametric series representation of the partial amplitude that is amenable to mass-level truncation and, therefore, numerical implementation. Besides the Veneziano amplitude, automatically represented by a dual-channel series with one free parameter, we present its five-point generalization, involving two free parameters and matched against known results in the literature. Higher multiplicities are obtained via the same systematic branching, with no separate input.", "url": "https://arxiv.org/abs/2608.02754", "type": "理论", "summary": "我们提出了一种计算 $N$ 点树级开弦振幅的新方法，其灵感来自于场论扰动器框架并绕过了世界表模积分。该构造基于点分裂、弦顶点的壳乘积的弱关联性条件，引入了所有物理通道都显示的二叉树规定。输出是部分振幅的多参数级数表示，适合质量级截断，因此适合数值实现。除了由具有一个自由参数的双通道系列自动表示的 Veneziano 幅度之外，我们还提出了其五点概括，涉及两个自由参数并与文献中的已知结果进行匹配。通过相同的系统分支获得更高的多重性，无需单独的输入。", "authors": [{"name": "Humberto Gomez"}, {"name": "Renann Lipinski Jusinskas"}, {"name": "Sitender Pratap Kashyap"}], "featured_authors": [{"name": "Humberto Gomez"}, {"name": "Renann Lipinski Jusinskas"}, {"name": "Sitender Pratap Kashyap"}], "author_count": 3}, {"id": "2608.02890", "category": "hep-th", "title": "Supersymmetric Twisted Carroll Theories", "abstract": "We study the recently discussed $2+1$-dimensional Hull-type twisted $\\mathcal{N}=2$ Carroll superalgebra. This structure admits both electric- and magnetic-type realizations at the level of the supersymmetry transformations. At the Lagrangian level, magnetic Carroll theories describe fields that propagate in space while remaining constrained in time, and vice versa for electric theories. We first realize this symmetry algebra through the dimensional reduction of a $2+2$-dimensional $\\mathcal{N}=(1,1)$ parent algebra, originally discussed in the context of self-dual supergravity. We further find that a consistent reduction of this higher-dimensional algebra admits infinite-dimensional lifts to left- and right-chiral super-$\\mathrm{BMS}_4$-type algebras, which can be combined by restoring the $R$-symmetry, leading to the type I-I magnetic super-$\\mathrm{BMS}_4$ algebra. We then consistently construct magnetic off-shell scalar and Abelian Yang--Mills theories and comment on on-shell theories. Finally, in the appendix, we explain how an ordinary supersymmetric theory can be analytically continued to its twisted counterpart.", "url": "https://arxiv.org/abs/2608.02890", "type": "理论", "summary": "我们研究最近讨论的$2+1$维赫尔型扭曲$\\mathcal{N}=2$卡罗尔超代数。这种结构允许在超​​对称变换层面上实现电型和磁型的实现。在拉格朗日水平上，磁卡罗尔理论描述了在空间中传播但在时间上保持约束的场，电理论反之亦然。我们首先通过 $2+2$ 维 $\\mathcal{N}=(1,1)$ 父代数的降维来实现这个对称代数，最初是在自对偶超引力的背景下讨论的。我们进一步发现，这种高维代数的一致约简允许左手性和右手性超$\\mathrm{BMS}_4$类型代数的无限维提升，可以通过恢复$R$对称性将其组合，从而产生I-I型磁超$\\mathrm{BMS}_4$代数。然后我们一致地构造了磁离壳标量和阿贝尔杨-米尔斯理论并对壳内理论进行了评论。最后，在附录中，我们解释了如何将普通的超对称理论分析延续到其扭曲的对应理论。", "authors": [{"name": "Osman Ergeç"}], "featured_authors": [{"name": "Osman Ergeç"}], "author_count": 1}, {"id": "2608.02987", "category": "hep-th", "title": "Quantum Anomalies of Tensionless Bosonic Strings", "abstract": "We systematically investigate and compare the worldsheet actions, BRST structures and the quantum anomalies of four different formulations of tensionless ($T = 0$) bosonic string theory: the $(D+2)$-dimensional conformal string \\cite{Gustafsson:1994kr}, the $D$-dimensional ILST null string \\cite{Isberg:1993av}, the $D$-dimensional Carroll-Weyl gauged string \\cite{Sheikh-Jabbari:2026vqh, Sheikh-Jabbari:2026tpf}, and the $D$-dimensional hybrid null string \\cite{Chen:2026klv}. By expressing all fields and constraint generators strictly in terms of mode expansions and adopting a unified algebraic framework, we analyze their quantum anomalies under two distinct worldsheet vacua: the induced vacuum and the flipped vacuum. With the BRST-compatible vacuum definition and the symmetric $\\alpha=0$ zeta prescription, we show that no critical dimension is inferred from the vanishing of the quantum anomaly in the induced vacuum. In contrast, the flipped highest-weight vacuum leads to non-trivial constraints, reproducing the critical dimension $D=26$ for the ILST null strings, a $\\lambda$-dependent critical dimension $D(\\lambda)$ for the hybrid null string whose range covers every positive integer $D\\geq 4$ (reproduces $D=26$ at $\\lambda=1$), and more importantly showing that the conformal string and the Carroll-Weyl gauged string are structurally anomalous with no consistent critical dimension due to the discrepancy of their central charge parameters $\\tilde d_i$. Furthermore, the ILST null string model has target-space conformal symmetry $SO(D,2)$, the ghost-completed $SO(D,2)$ charges are closed on the induced-vacuum BRST cohomology in the $\\alpha=0$ prescription, whereas the symmetry is quantum mechanically broken in the flipped vacuum.", "url": "https://arxiv.org/abs/2608.02987", "type": "理论", "summary": "我们系统地研究和比较了四种不同形式的无张力（$T = 0$）玻色弦理论的世界表行为、BRST结构和量子异常：$(D+2)$维共形弦\\cite{Gustafsson:1994kr}、$D$维ILST空弦\\cite{Isberg:1993av}、$D$维Carroll-Weyl规范弦\\cite{Sheikh-Jabbari:2026vqh, Sheikh-Jabbari:2026tpf}，以及 $D$ 维混合空字符串 \\cite{Chen:2026klv}。通过严格用模式展开来表达所有场和约束生成器并采用统一的代数框架，我们分析了它们在两种不同的世界表真空下的量子异常：诱导真空和翻转真空。通过与 BRST 兼容的真空定义和对称 $\\alpha=0$ zeta 处方，我们表明，没有从诱导真空中量子异常的消失推断出临界尺寸。\n\n相比之下，翻转的最高权重真空会导致非平凡的约束，为 ILST 空串再现关键尺寸 $D=26$，为混合空串再现 $\\lambda$ 相关的关键尺寸 $D(\\lambda)$，其范围覆盖每个正整数 $D\\geq 4$（在 $\\lambda=1$ 处再现 $D=26$），更重要的是表明共形弦和 Carroll-Weyl 规范弦在结构上是异常的由于中心电荷参数 $\\tilde d_i$ 的差异，没有一致的临界尺寸。此外，ILST空串模型具有目标空间共形对称性$SO(D,2)$，鬼完成的$SO(D,2)$电荷在$\\alpha=0$处方中的感应真空BRST上同调上闭合，而对称性在翻转真空中被量子力学破缺。", "authors": [{"name": "Bin Chen"}, {"name": "Zezhou Hu"}], "featured_authors": [{"name": "Bin Chen"}, {"name": "Zezhou Hu"}], "author_count": 2}, {"id": "2608.03366", "category": "hep-th", "title": "Notes on phase structure and non-vanishing $β$ functions of one-unitary matrix model", "abstract": "Unitary matrix models, among other things, play an important role in representing the irregular conformal block and hence LEEA of some asymptotically free susy gauge theories. Here, we develop a method of how to determine the qualitative structure of phase diagram by the deformation of classical potential, and illustrate this by the examples that contain term up to $\\cos n\\alpha$, $n \\leq 3$. We point out that a set of $\\beta$ functions on critical ``lines\" is nowhere a vanishing vector. This generalizes the $n =1$ GWW case and tells us the third order (rather than second order) phase transition in conformity with the range of values for the susceptibility exponent.", "url": "https://arxiv.org/abs/2608.03366", "type": "理论", "summary": "除其他外，酉矩阵模型在表示不规则共角块以及一些渐近自由 Susy 规范理论的 LEEA 方面发挥着重要作用。在这里，我们开发了一种如何通过经典势的变形来确定相图定性结构的方法，并通过包含项高达 $\\cos n\\alpha$, $n \\leq 3$ 的示例来说明这一点。我们指出，关键“线”上的一组 $\\beta$ 函数绝不是消失向量。这概括了 $n =1$ GWW 情况，并告诉我们与磁化率指数值范围一致的三阶（而不是二阶）相变。", "authors": [{"name": "Hiroshi Itoyama"}, {"name": "Reiji Yoshioka"}], "featured_authors": [{"name": "Hiroshi Itoyama"}, {"name": "Reiji Yoshioka"}], "author_count": 2}, {"id": "2608.03399", "category": "hep-th", "title": "Moduli Spaces of Connections and B-fields from T-duality with H-flux", "abstract": "We study the geometry of mixed fields, consisting of a connection and a $B$-field on a principal circle bundle over a Riemann surface, from the perspective of gauge theory and T-duality. Motivated by the foundational work of Atiyah--Bott and Segal, we introduce a twisted Yang--Mills functional whose critical locus, in the flat case, is governed by the simultaneous vanishing of the curvature and the $H$-flux. We show that the gauge group is a semi-direct product of abelian groups parametrised by an integer $\\lambda$. The moduli spaces are constructed by presymplectic reduction and shown to be Heisenberg contact manifolds for $\\lambda \\neq 0$, whose topology we characterise completely. We show that T-duality preserves the twisted Yang--Mills functional and acts on the configuration space of flat mixed fields. We identify the subgroups of gauge transformations that are compatible with the T-duality map and describe the induced action on the singular quotient of T-dualizable flat mixed fields. Precisely at $\\lambda =1$ does T-duality descend to an involutive contactomorphism of the moduli space.", "url": "https://arxiv.org/abs/2608.03399", "type": "理论", "summary": "我们从规范理论和 T 对偶性的角度研究了混合场的几何结构，该混合场由黎曼曲面上主圆束上的连接和 $B$ 场组成。受 Atiyah-Bott 和 Segal 基础工作的启发，我们引入了扭曲的 Yang-Mills 泛函，在平坦情况下，其临界轨迹由曲率和 $H$-通量的同时消失控制。我们证明规范群是由整数 $\\lambda$ 参数化的阿贝尔群的半直积。模空间是通过预辛约简构造的，并显示为 $\\lambda \\neq 0$ 的海森堡接触流形，我们完全表征了其拓扑。我们证明 T 对偶性保留了扭曲的 Yang-Mills 泛函并作用于平坦混合场的配置空间。我们确定了与 T-对偶图兼容的规范变换子群，并描述了对 T-可对偶平坦混合场的奇异商的诱导作用。恰好在 $\\lambda =1$ 处，T 对偶性下降为模空间的对合接触同胚。", "authors": [{"name": "Fei Han"}, {"name": "Pedram Hekmati"}, {"name": "Tsuyoshi Kato"}, {"name": "Varghese Mathai"}], "featured_authors": [{"name": "Fei Han"}, {"name": "Pedram Hekmati"}, {"name": "Tsuyoshi Kato"}, {"name": "Varghese Mathai"}], "author_count": 4}, {"id": "2608.03459", "category": "hep-th", "title": "3D Gravity Does Not Average Like Narain at Genus One: Rigidity of Virasoro Topological Boundaries", "abstract": "Motivated by the proposed relation between 3D gravity and the doubled Virasoro TQFT, and by the associated program of ensemble holography, we ask whether ensemble holography in AdS$_3$/CFT$_2$ can be understood as an average over absolute 2D CFTs obtained by varying the topological boundary condition of the doubled Virasoro TQFT. We show that, at genus one and in the ordinary nondegenerate sector, every vacuum-normalized, modular-invariant genus-one pairing that acts boundedly on the auxiliary $L^2$ label space is diagonal. Under the ordinary block-diagonal vacuum--continuum ansatz, the same conclusion holds for entrywise-positive, modular-invariant Borel-measure pairings satisfying the two vacuum marginals, even if they are initially singular or unbounded. Consequently, within these analytic classes, the Virasoro TQFT does not admit a Narain-like ensemble mechanism based on averaging distinct nontrivial torus pairings from ordinary topological boundaries. Any nontrivial ensemble interpretation must instead involve information invisible at genus one, additional sectors, or genuinely generalized boundary conditions. Technically, the proof identifies the Virasoro $S$ and $T$ transformations with the even Weil representation of the metaplectic group and applies the Cowling--Steger lattice-restriction theorem. We also give elementary proofs for several explicit classes of candidate boundary conditions and perform numerical checks of the general result.", "url": "https://arxiv.org/abs/2608.03459", "type": "理论", "summary": "受 3D 引力和双重 Virasoro TQFT 之间提出的关系以及相关的系综全息程序的启发，我们询问 AdS$_3$/CFT$_2$ 中的系综全息是否可以理解为通过改变双重 Virasoro TQFT 的拓扑边界条件获得的绝对 2D CFT 的平均值。我们证明，在属一和普通非简并扇区中，每个有界作用于辅助 $L^2$ 标签空间的真空归一化、模不变的属一对都是对角的。在普通的块对角真空连续统 ansatz 下，相同的结论适用于满足两个真空边缘的输入正、模不变的 Borel 测度对，即使它们最初是奇异的或无界的。因此，在这些分析类中，Virasoro TQFT 不承认基于对普通拓扑边界的不同非平凡环面配对进行平均的类似 Narain 的系综机制。任何非平凡的系综解释都必须涉及属一、附加扇区或真正广义的边界条件中不可见的信息。\n\n从技术上讲，该证明将 Virasoro $S$ 和 $T$ 变换与元波群的偶 Weil 表示相结合，并应用了 Cowling--Steger 晶格限制定理。我们还给出了候选边界条件的几个显式类别的基本证明，并对一般结果进行数值检查。", "authors": [{"name": "Xingyang Yu"}], "featured_authors": [{"name": "Xingyang Yu"}], "author_count": 1}, {"id": "2608.03646", "category": "hep-th", "title": "Intersection matrices associated to geometric-ordered bases of Feynman integrals", "abstract": "In integration-by-parts reduction of Feynman integrals, the order relation in the Laporta algorithm determines a set of master integrals. In this paper we investigate the intersection matrices of the integrands of the master integrals that are obtained from a geometric order relation. With an appropriate definition of integrands and their duals, we find that the intersection matrices are simpler than expected: For a filtration-compatible basis, the entries of the intersection matrix are Laurent polynomials in the dimensional regularisation parameter $\\varepsilon$. For an $\\varepsilon$-factorised basis, the entries are instead integers, up to an overall power of $\\varepsilon$, if the boundary values for the auxiliary functions of the rotation are chosen appropriately. This has practical consequences: We can systematically eliminate certain auxiliary transcendental functions, introduced in going from a filtration-compatible basis to an $\\varepsilon$-factorised basis. We provide an algorithm that performs this elimination while minimising the number of required calculations.", "url": "https://arxiv.org/abs/2608.03646", "type": "理论", "summary": "在费曼积分的分部积分简化中，Laporta 算法中的阶关系决定了一组主积分。在本文中，我们研究从几何阶关系获得的主积分的被积函数的交集矩阵。通过对被积函数及其对偶的适当定义，我们发现交集矩阵比预期更简单：对于过滤兼容基础，交集矩阵的条目是维度正则化参数 $\\varepsilon$ 中的洛朗多项式。对于 $\\varepsilon$ 因式分解的基础，如果适当选择旋转辅助函数的边界值，则条目是整数，最高可达 $\\varepsilon$ 的总幂。这具有实际的后果：我们可以系统地消除某些辅助超越函数，这些函数是在从过滤兼容基础到 $\\varepsilon$ 因式分解基础的过程中引入的。我们提供了一种算法，可以执行这种消除，同时最大限度地减少所需计算的数量。", "authors": [{"name": "Iris Bree"}, {"name": "Federico Gasparotto"}, {"name": "Sebastian Pögel"}, {"name": "Xing Wang"}, {"name": "Stefan Weinzierl"}, {"name": "Xiaofeng Xu"}], "featured_authors": [{"name": "Iris Bree"}, {"name": "Federico Gasparotto"}, {"name": "Sebastian Pögel"}, {"name": "Xing Wang"}, {"name": "Stefan Weinzierl"}, {"name": "Xiaofeng Xu"}], "author_count": 6}, {"id": "2608.03704", "category": "hep-th", "title": "Impurities Near the Light Cone", "abstract": "The lightlike Wilson line cusp underlies the Sudakov double logarithm and is a central ingredient in gauge-theory factorization. We ask what replaces this behavior for general conformal line defects in Lorentzian signature. We argue that, when the defects admit local endpoint operators, the cusp anomalous dimension has a finite large-boost limit fixed by the scaling dimensions of the corresponding defect-creation operators. We further analyze the distinct analytic continuations of the cusp, elucidate their physical interpretations, and propose a positivity bound on the Lorentzian cusp anomalous dimension. We test these predictions in several perturbative examples, including pinning-field defects and spin impurities, and discuss their possible implications for gauge theories.", "url": "https://arxiv.org/abs/2608.03704", "type": "理论", "summary": "类似光的威尔逊线尖点是苏达科夫双对数的基础，是规范理论因式分解的核心成分。我们询问什么可以替代洛伦兹签名中一般共形线缺陷的这种行为。我们认为，当缺陷允许局部端点算子时，尖点异常维度具有由相应缺陷创建算子的缩放维度固定的有限大提升限制。我们进一步分析了尖点的独特解析延续，阐明了它们的物理解释，并提出了洛伦兹尖点异常维度的正界。我们在几个扰动例子中测试了这些预测，包括钉扎场缺陷和自旋杂质，并讨论它们对规范理论的可能影响。", "authors": [{"name": "Gabriel Cuomo"}, {"name": "Simone Giombi"}, {"name": "Luigi Tizzano"}], "featured_authors": [{"name": "Gabriel Cuomo"}, {"name": "Simone Giombi"}, {"name": "Luigi Tizzano"}], "author_count": 3}, {"id": "2608.03717", "category": "hep-th", "title": "Cluster Algebras, Cube Roots, and Energy Correlators in $\\mathcal{N}=4$ SYM", "abstract": "We provide a cluster algebraic construction of the cube root symbol letters that appear at leading order in the near-collinear expansion of the four-point energy correlator in $\\mathcal{N}=4$ SYM theory.", "url": "https://arxiv.org/abs/2608.03717", "type": "理论", "summary": "我们提供了立方根符号字母的簇代数构造，这些符号字母出现在 $\\mathcal{N}=4$ SYM 理论中四点能量相关器的近共线展开中。", "authors": [{"name": "Dani Kaufman"}, {"name": "Marcus Spradlin"}, {"name": "Anastasia Volovich"}, {"name": "Kai Yan"}], "featured_authors": [{"name": "Dani Kaufman"}, {"name": "Marcus Spradlin"}, {"name": "Anastasia Volovich"}, {"name": "Kai Yan"}], "author_count": 4}, {"id": "2608.03747", "category": "hep-th", "title": "Logarithmic Soft Photon Theorem and Waveform Tails in Higher Dimensions", "abstract": "We derive the leading logarithmic soft-photon theorem in $d>4$ spacetime dimensions and its classical radiative counterpart. A direct one-loop analysis in massive scalar quantum electrodynamics (QED) yields a factorizing soft term of order $\\omega^{d-4}\\ln\\omega$, although the charged-particle S-matrix is infrared finite. The logarithm is generated by the scale-invariant loop-momentum region $\\omega\\ll|\\ell|\\ll\\Lambda$, where $\\Lambda$ denotes a characteristic hard-particle energy scale. At leading radiative order, the corresponding logarithmic contribution to the classical electromagnetic waveform arises from the long-range acceleration of the asymptotic charged particles. In even $d\\geq6$, the straight-line waveform at this radiative order is distributionally supported in retarded time within an interval whose width is set by the characteristic size of the hard-scattering region, whereas the logarithmic acceleration term produces universal early- and late-time radiative tails proportional to $|u|^{-(3d-10)/2}$. In odd $d\\geq5$, straight-line motion already gives a late-time tail at the same radiative order proportional to $u^{-(d-4)/2}$. The acceleration correction adds universal late- and early-time terms proportional, respectively, to $\\ln u/u^{(3d-10)/2}$ and $|u|^{-(3d-10)/2}$. A comparison of Feynman and retarded boundary conditions separates the classically radiative contribution from the intrinsically quantum part of the logarithmic soft factor.", "url": "https://arxiv.org/abs/2608.03747", "type": "理论", "summary": "我们推导出 $d>4$ 时空维度中领先的对数软光子定理及其经典辐射对应定理。尽管带电粒子 S 矩阵是红外有限矩阵，但大规模标量量子电动力学 (QED) 中的直接单循环分析会产生 $\\omega^{d-4}\\ln\\omega$ 阶的因式分解软项。对数由尺度不变环动量区域 $\\omega\\ll|\\ell|\\ll\\Lambda$ 生成，其中 $\\Lambda$ 表示特征硬粒子能量尺度。在领先辐射级，对经典电磁波形的相应对数贡献来自渐近带电粒子的长程加速。甚至在 $d\\geq6$ 中，该辐射级的直线波形在一个间隔内的延迟时间内得到分布支持，该间隔的宽度由硬散射区域的特征尺寸设置，而对数加速度项产生与 $|u|^{-(3d-10)/2}$ 成比例的通用早期和晚期辐射尾部。在奇数 $d\\geq5$ 中，直线运动已经给出了与 $u^{-(d-4)/2}$ 成比例的相同辐射阶的后期尾部。\n\n加速度校正分别将通用后期和早期项按比例添加到 $\\ln u/u^{(3d-10)/2}$ 和 $|u|^{-(3d-10)/2}$。费曼和延迟边界条件的比较将经典辐射贡献与对数软因子的本质量子部分分开。", "authors": [{"name": "Biswajit Sahoo"}], "featured_authors": [{"name": "Biswajit Sahoo"}], "author_count": 1}, {"id": "2608.03761", "category": "hep-th", "title": "The Hitchin and Sutcliffe metrics for hyperbolic 2-monopoles", "abstract": "We compare two currently known examples of hyperbolic SU(2) two-monopole metrics and their candidacy as models of hyperbolic monopole dynamics. The first is Sutcliffe's boundary metric and the other is a well-known self-dual Einstein metric found by Hitchin. We show that these metrics are conformally inequivalent and make significantly different predictions for monopole dynamics. We compare each metric to the Franchetti-Ross point particle approximation of hyperbolic monopole dynamics. We show Sutcliffe's metric does not converge to the point particle approximation in the large separation limit. We also check Sen's conjecture for each metric by computing their $L^2$ harmonic two-forms. By a symmetry argument we are able to show that Hitchin's metric has a single $L^2$ harmonic two-form consistent with the conjecture.", "url": "https://arxiv.org/abs/2608.03761", "type": "理论", "summary": "我们比较了两个当前已知的双曲 SU(2) 双单极子度量的例子及其作为双曲单极子动力学模型的候选资格。第一个是萨克利夫边界度量，另一个是希钦发现的著名的自对偶爱因斯坦度量。我们证明这些指标是共形不等价的，并且对单极子动力学做出显着不同的预测。我们将每个度量与双曲单极子动力学的 Franchetti-Ross 点粒子近似进行比较。我们表明，在大分离极限下，萨克利夫度量不会收敛到点粒子近似。我们还通过计算每个度量的 $L^2$ 谐波两种形式来检查森的猜想。通过对称性论证，我们能够证明希钦度量具有与猜想一致的单个 $L^2$ 调和二元形式。", "authors": [{"name": "Thomas Galvin"}], "featured_authors": [{"name": "Thomas Galvin"}], "author_count": 1}, {"id": "2608.03864", "category": "hep-th", "title": "Vacuum Polarization Energy of a Nonzero Radius Cosmic String", "abstract": "We calculate the vacuum polarization energy (VPE) of a scalar field in the background of a nonsingular cosmic string in $2+1$ spacetime dimensions. Our calculation expresses the VPE as a renormalized sum and integral over scattering data, which can be expressed in terms of Legendre and Bessel functions for the \"ballpoint pen\" model, analogous to a square well in curvature, and which can be obtained numerically for a generic string profile. We show how relationships between the local density of states, expressed in terms of the Green's function, and the global density of states, expressed in terms of the Jost function, extend to this curved spacetime background and allow for precise implementation of perturbative renormalization conditions.", "url": "https://arxiv.org/abs/2608.03864", "type": "理论", "summary": "我们计算 $2+1$ 时空维度中非奇异宇宙弦背景中标量场的真空极化能 (VPE)。我们的计算将 VPE 表示为散射数据的重整化和和积分，可以用“圆珠笔”模型的勒让德函数和贝塞尔函数来表示，类似于曲率中的方井，并且可以针对通用弦线轮廓以数值方式获得。我们展示了以格林函数表示的局部态密度与以约斯特函数表示的全局态密度之间的关系如何扩展到这种弯曲的时空背景，并允许精确实现微扰重正化条件。", "authors": [{"name": "Noah Graham"}, {"name": "Herbert Weigel"}], "featured_authors": [{"name": "Noah Graham"}, {"name": "Herbert Weigel"}], "author_count": 2}, {"id": "2608.02702", "category": "math-ph", "title": "The $q$-extension of iterated integrals and nested sums in quantum field theory", "abstract": "Analytic calculations of zero- and single-scale quantities in perturbative quantum field theory result into special numbers and functions, the first of which have been revealed during the last decades. These are generalizations of the polylogarithm in form of Kummer-Poincaré iterative integrals over special alphabets and extensions this http URL growing order in the coupling constant, the polylogarithms, Nielsen integrals, the iterated integrals over linear denominator terms, cyclotomic letters, letters induced by quadratic forms, square-root valued letters, and more general functions contribute. For the nested sums we consider nested harmonic sums, generalized harmonic sums, nested sums implied by quadratic forms, cyclotomic harmonic sums, and nested sums containing central binomials. We construct the $q$-extensions of these special functions and of the nested sums, which are associated to them by the series expansion at $x=0$, and their Mellin transform in the $q$-free case. These functions are expected to play a role in perturbative calculations in the case of $q$-deformed commutation relations. For the simpler function spaces closed form solutions are presented. For more involved alphabets we present the algorithmic steps leading to the $q$-extension for the individual cases. We also derive the determining differential and difference equations of these higher transcendental functions. The $q$-extended special functions are quite different form the corresponding $\\mu$-extended functions.", "url": "https://arxiv.org/abs/2608.02702", "type": "理论", "summary": "微扰量子场论中零尺度和单尺度量的解析计算产生了特殊的数字和函数，其中第一个在过去几十年中已经被揭示。这些是以特殊字母表上的 Kummer-Poincaré 迭代积分形式对多对数的推广，并扩展了耦合常数中的 http URL 增长顺序、多对数、尼尔森积分、线性分母项上的迭代积分、分圆字母、由二次形式导出的字母、平方根值字母和更一般的函数。对于嵌套和，我们考虑嵌套调和和、广义调和和、二次形式隐含的嵌套和、分圆调和和以及包含中心二项式的嵌套和。我们构造这些特殊函数和嵌套和的 $q$ 扩展，它们通过 $x=0$ 处的级数扩展以及它们在无 $q$ 情况下的梅林变换关联起来。这些函数预计将在 $q$ 变形交换关系的情况下在微扰计算中发挥作用。对于更简单的功能空间，提出了封闭形式的解决方案。\n\n对于更多涉及的字母表，我们提出了针对个别情况导致 $q$ 扩展的算法步骤。我们还推导了这些高级超越函数的决定微分方程和差分方程。 $q$ 扩展特殊函数与相应的 $\\mu$ 扩展函数有很大不同。", "authors": [{"name": "J. Blümlein"}, {"name": "A.M. Gavrilik"}, {"name": "O. Mykhailiv"}, {"name": "C. Schneider"}], "featured_authors": [{"name": "J. Blümlein"}, {"name": "A.M. Gavrilik"}, {"name": "O. Mykhailiv"}, {"name": "C. Schneider"}], "author_count": 4}, {"id": "2608.02707", "category": "math-ph", "title": "Discrete Unique Continuation on Simplex", "abstract": "For integers $N\\ge0$ and $n\\ge2$, let \\[ \\Delta_N^{(n)} =\\left\\{\\alpha\\in\\mathbb Z_{\\ge 0}^n: \\alpha_1+\\cdots+\\alpha_n=N\\right\\}. \\] We formulate a discrete unique-continuation problem on this lattice simplex. Given an integer $R\\ge1$, consider a function $g:\\Delta_{nR}^{(n)}\\to\\mathbb R$ satisfying the complete oriented-simplex relations \\[ \\sum_{i=1}^n g(\\beta+e_i)=0, \\qquad \\beta\\in\\Delta_{nR-1}^{(n)}, \\] where $e_i$ is the $i$th standard basis vector. We prove that a nonzero value at the balanced point forces the support-cardinality estimate with optimal growth exponent: if $g(R,\\ldots,R)\\neq 0$, then $|\\operatorname{supp}(g)|\\ge c_n R^{\\lceil n/2\\rceil}$. Here $c_n>0$ depends only on $n$. The key input is a \\emph{Pascal uncertainty principle}. After factorial normalization, the simplex relations become a single directional differential equation. A nonzero balanced coefficient then produces a monomial whose relevant facet-chart exponents are all large, while the tensorized Pascal uncertainty principle prevents the coefficient supports in all partially shifted affine charts from being simultaneously sparse. Comparing those charts with two coordinate facets and summing over disjoint derivative shells gives the lower bound. Explicit constructions show that the exponent $\\lceil n/2\\rceil$ is optimal. The proof was obtained through human-guided discovery and exploration with the assistance of GPT-5.6 Sol.", "url": "https://arxiv.org/abs/2608.02707", "type": "理论", "summary": "对于整数 $N\\ge0$ 和 $n\\ge2$，设 \\[ \\Delta_N^{(n)} =\\left\\{\\alpha\\in\\mathbb Z_{\\ge 0}^n: \\alpha_1+\\cdots+\\alpha_n=N\\right\\}。 \\] 我们在这个格单纯形上制定了一个离散唯一连续问题。给定一个整数 $R\\ge1$，考虑函数 $g:\\Delta_{nR}^{(n)}\\to\\mathbb R$ 满足完全定向单纯形关系 \\[ \\sum_{i=1}^n g(\\beta+e_i)=0, \\qquad \\beta\\in\\Delta_{nR-1}^{(n)}, \\] 其中 $e_i$ 是第 $i$ 个标准基向量。我们证明平衡点处的非零值会强制支持基数估计具有最佳增长指数：如果 $g(R,\\ldots,R)\\neq 0$，则 $|\\operatorname{supp}(g)|\\ge c_n R^{\\lceil n/2\\rceil}$。这里$c_n>0$仅取决于$n$。关键输入是\\emph{帕斯卡不确定性原理}。阶乘归一化后，单纯形关系变成单向微分方程。然后，非零平衡系数会生成一个单项式，其相关分面图指数都很大，而张量化帕斯卡不确定性原理可防止所有部分移位仿射图中的系数支持同时稀疏。\n\n将这些图表与两个坐标面进行比较并对不相交的导数壳求和得出下界。显式构造表明指数 $\\lceil n/2\\rceil$ 是最优的。该证明是在 GPT-5.6 Sol 的协助下，通过人类引导的发现和探索获得的。", "authors": [{"name": "Linjun Li"}], "featured_authors": [{"name": "Linjun Li"}], "author_count": 1}, {"id": "2608.02777", "category": "math-ph", "title": "Odd elasticity in a three-link microswimmer: feedback equivalence, global controllability, and the cost of non-reciprocity", "abstract": "We study a Purcell three-link microswimmer whose joints are \\emph{odd-elastic}: the torsional stiffness is non-Hermitian, its antisymmetric part $k_o$ injecting mechanical work so that the internal elastic drift is non-conservative. Our main finding is a sharp separation between geometry and cost --- odd elasticity is invisible to the control geometry of the swimmer and visible only in the energy of a manoeuvre. The mechanism is a single algebraic fact: the drift lies in the span of the two control vector fields, so the system is feedback-equivalent to a driftless one and the odd modulus enters the bracket structure only through the scalar $\\det\\textbf{K}=k^2+k_o^2$. From this we deduce that the abnormal extremals of the energy problem are unchanged by $k_o$, that the swimmer is globally controllable for every non-reciprocity with no threshold, and that its nilpotent model is the Cartan $(2,3,5)$ sub-Riemannian structure, deformed only by the metric scaling $g_\\chi=(1+\\chi^2)g_0$. The odd modulus acts solely on the cost: casting the optimal-steering problem in sub-Finsler (Randers) form, we prove that a prescribed reorientation is strictly cheaper for either sign of $k_o$. Full Resistive-Force-Theory simulations confirm the analysis and reveal that at isotropic drag the swimmer becomes a pure rotator, turning without translating.", "url": "https://arxiv.org/abs/2608.02777", "type": "理论", "summary": "我们研究了一个 Purcell 三连杆微型游泳器，其关节为 \\emph{奇弹性}：扭转刚度是非厄米特的，其反对称部分 $k_o$ 注入机械功，因此内部弹性漂移是非保守的。我们的主要发现是几何形状和成本之间的明显区别——奇怪的弹性对于游泳者的控制几何形状是不可见的，并且仅在机动能量中可见。该机制是一个单一的代数事实：漂移位于两个控制矢量场的跨度内，因此系统反馈相当于无漂移系统，奇数模数仅通过标量 $\\det\\textbf{K}=k^2+k_o^2$ 进入括号结构。由此我们推断，能量问题的异常极值不会因$k_o$而​​改变，游泳者对于每个无阈值的非互易性都是全局可控的，并且其幂零模型是Cartan $(2,3,5)$亚黎曼结构，仅通过度量缩放$g_\\chi=(1+\\chi^2)g_0$变形。奇模数仅作用于成本：将最优转向问题转换为子 Finsler (Randers) 形式，我们证明，对于 $k_o$ 的任一符号，规定的重新定向都是严格更便宜的。\n\n完整的阻力理论模拟证实了分析结果，并揭示了在各向同性阻力下，游泳者变成了纯粹的旋转体，只转动而不平移。", "authors": [{"name": "Rossella Attanasi"}, {"name": "Gaetano Napoli"}, {"name": "Marta Zoppello"}], "featured_authors": [{"name": "Rossella Attanasi"}, {"name": "Gaetano Napoli"}, {"name": "Marta Zoppello"}], "author_count": 3}, {"id": "2608.02861", "category": "math-ph", "title": "Topological Recursion and Quantum Path Signatures", "abstract": "We introduce a non-commutative Laplace transform between functionals on path space and formal series in a tensor algebra, under which a natural convolution of path functionals becomes an algebraic product of series. Applying it to a random unitary matrix-valued path development - the quantum path signature - we show that the governing planar loop equations take a non-commutative spectral form. We then extend the loop equations to a $1/N$ genus expansion, organised by topological recursion, and obtain a hierarchy of integral equations on path space for the corrections.", "url": "https://arxiv.org/abs/2608.02861", "type": "理论", "summary": "我们在路径空间上的泛函和张量代数中的形式级数之间引入了非交换拉普拉斯变换，在该变换下，路径泛函的自然卷积成为级数的代数积。将其应用于随机酉矩阵值路径展开（量子路径签名），我们表明控制平面环方程采用非交换谱形式。然后，我们将循环方程扩展到 $1/N$ 属展开，通过拓扑递归进行组织，并获得用于校正的路径空间上的积分方程层次结构。", "authors": [{"name": "Inês Aniceto"}, {"name": "Thomas Cass"}, {"name": "Samuel Crew"}], "featured_authors": [{"name": "Inês Aniceto"}, {"name": "Thomas Cass"}, {"name": "Samuel Crew"}], "author_count": 3}, {"id": "2608.02862", "category": "math-ph", "title": "Selection criteria for the compressible Euler equations: numerical study", "abstract": "We numerically investigate selection criteria for dissipative weak solutions of the compressible Euler equations. Using the Kelvin-Helmholtz problem as a benchmark, we compare four standard numerical schemes - the viscous finite volume (VFV) method, the discrete velocity Boltzmann finite volume (DVBFV) method, the Runge-Kutta discontinuous Galerkin (RKDG) method, and the discontinuous Galerkin spectral element method (DGSEM), and demonstrate that each may converge to a different dissipative weak solution. We evaluate these solutions with respect to several selection criteria based on entropy production, total energy, and energy defect, and examine the sensitivity of selection functionals to the numerical diffusion inherent in each scheme.", "url": "https://arxiv.org/abs/2608.02862", "type": "理论", "summary": "我们数值研究了可压缩欧拉方程耗散弱解的选择标准。以开尔文-亥姆霍兹问题为基准，我们比较了四种标准数值方案——粘性有限体积（VFV）方法、离散速度玻尔兹曼有限体积（DVBFV）方法、龙格-库塔不连续伽辽金（RKDG）方法和不连续伽辽金谱元方法（DGSEM），并证明每种方法都可以收敛到不同的耗散弱解。我们根据基于熵产生、总能量和能量缺陷的几个选择标准来评估这些解决方案，并检查选择泛函对每个方案中固有的数值扩散的敏感性。", "authors": [{"name": "Megala Anandan"}, {"name": "Bahulayan Chalil Aravind"}, {"name": "Mária Lukáčová-Medvid'ová"}, {"name": "S. V. Raghurama Rao"}, {"name": "Kedar Shridhar Wagh"}, {"name": "Changsheng Yu"}, {"name": "Jiahui Zhang"}], "featured_authors": [{"name": "Megala Anandan"}, {"name": "Bahulayan Chalil Aravind"}, {"name": "Mária Lukáčová-Medvid'ová"}, {"name": "Kedar Shridhar Wagh"}, {"name": "Changsheng Yu"}, {"name": "Jiahui Zhang"}], "author_count": 7}, {"id": "2608.03121", "category": "math-ph", "title": "From Convex to Non-convex: Evolution of Rarefaction-dispersive shock interactions and the Influence of Non-convexity", "abstract": "In this paper, we focus on the analytical description of the interaction between a rarefaction and dispersive shock wave across both convex and non-convex cases, with particular attention to the effect of the non-convexity, within the framework of the Gardner equation. For convex structures, internal oscillations degenerate into small amplitude harmonic waves or a modulated soliton train as t tends to infinity, accompanied by either a retained rarefaction part, or a new dispersive shock wave emanating from it. Taking into account the non-convexity, when alpha>0, we find that kinks either remain non-participating in the interaction at all, or only act to switch polarities of convex structures. As for alpha<0, we solve the Gardner-Whitham equations with three varying Riemann invariants, to analyze the rarefaction-contact dispersive shock interaction where the only possible configuration is that the rarefaction wave is on the left. It is demonstrated that the rarefaction wave will be completely drawn into the interaction region, with a changed contact dispersive shock wave escaping from the left. And internal oscillations eventually degenerate into an asymptotic algebraic soliton train as t tends to infinity. In addition, we study the interaction between a rarefaction wave and composite structure consisting of the contact and classical dispersive shock parts under two distinct situations: (i) For the composite structure-rarefaction interaction, the contact part remains inactive in the interaction, and internal oscillations ultimately degenerate into a contact dispersive shock wave. (ii) For the rarefaction-composite structure case, the entire composite structure participates in the interaction, during", "url": "https://arxiv.org/abs/2608.03121", "type": "理论", "summary": "在本文中，我们在加德纳方程的框架内重点分析凸面和非凸面情况下稀疏和色散冲击波之间相互作用的分析，特别关注非凸面的影响。对于凸结构，当 t 趋于无穷大时，内部振荡退化为小振幅谐波或调制孤子列，并伴随着保留的稀疏部分或从中发出的新的色散冲击波。考虑到非凸性，当 alpha>0 时，我们发现扭结要么根本不参与相互作用，要么只起到切换凸结构极性的作用。对于 alpha<0，我们用三个不同的黎曼不变量求解 Gardner-Whitham 方程，以分析稀疏接触色散激波相互作用，其中唯一可能的配置是稀疏波位于左侧。结果表明，稀疏波将完全被吸入相互作用区域，而变化的接触色散激波从左侧逸出。\n\n当 t 趋于无穷大时，内部振荡最终退化为渐近代数孤子列。此外，我们研究了两种不同情况下稀疏波与由接触部分和经典色散激波部分组成的复合结构之间的相互作用：（i）对于复合结构-稀疏相互作用，接触部分在相互作用中保持不活跃状态，内部振荡最终退化为接触色散激波。 (ii) 对于稀疏复合结构情况，整个复合结构参与相互作用，在", "authors": [{"name": "Jia-Xue Niu"}, {"name": "Rui Guo"}, {"name": "Hua-Ying Ren"}, {"name": "Ya-Hui Huang"}], "featured_authors": [{"name": "Jia-Xue Niu"}, {"name": "Rui Guo"}, {"name": "Hua-Ying Ren"}, {"name": "Ya-Hui Huang"}], "author_count": 4}, {"id": "2608.03139", "category": "math-ph", "title": "The co-directional overtaking collision problem between a dispersive shock wave and a rarefaction wave for the Hirota equation", "abstract": "In this paper, we mainly investigate the overtaking collision problem between a dispersive shock wave (DSW) and a rarefaction wave (RW) propagating in the same direction in the defocusing Hirota equation framework. Based on the Whitham theory, the zero-phase and single-phase modulation systems corresponding to the defocusing Hirota equation are given, along with explicit expressions of Riemann invariants. For step-type initial conditions with left-side DSW and right-side RW propagating identically, the global initial configuration is constructed.~The modulation solution within the nonlinear collision domain is obtained via the generalized hodograph transformation and solutions of the Euler-Poisson-Darboux equation. Thus, by matching the Riemann invariants at the boundaries of DSW and RW, we can provide a detailed analytical description for the dynamical behaviors of the collision across all evolutionary stages. The accuracy of theoretical predictions is verified by comparison with direct numerical simulations.", "url": "https://arxiv.org/abs/2608.03139", "type": "理论", "summary": "在本文中，我们主要研究散焦Hirota方程框架中沿同一方向传播的色散冲击波（DSW）和稀疏波（RW）之间的超车碰撞问题。基于Whitham理论，给出了与散焦Hirota方程相对应的零相位和单相调制系统，以及黎曼不变量的显式表达式。对于左侧DSW和右侧RW传播相同的阶跃型初始条件，构造全局初始配置。〜通过广义实线变换和Euler-Poisson-Darboux方程的解获得非线性碰撞域内的调制解。因此，通过匹配 DSW 和 RW 边界处的黎曼不变量，我们可以为所有进化阶段的碰撞动力学行为提供详细的分析描述。通过与直接数值模拟的比较验证了理论预测的准确性。", "authors": [{"name": "Yuan Xiang"}, {"name": "Rui Guo"}], "featured_authors": [{"name": "Yuan Xiang"}, {"name": "Rui Guo"}], "author_count": 2}, {"id": "2608.03345", "category": "math-ph", "title": "A Tau function for $q$-Painlevé VI as a Fredholm determinant", "abstract": "We give an analytic construction of a tau function for the $q$-difference sixth Painlevé equation ($q$PVI) as a Fredholm determinant through the general Riemann-Hilbert problem associated with it. We show that the tau function is an analytic function on its domain of definition that vanishes at a particular point if and only if the corresponding Riemann-Hilbert problem is point-wise not solvable there. We express the corresponding $q$PVI transcendents in terms of the tau function as well as three copies of it with some of the parameters shifted. Then the vanishing of any of these four tau functions corresponds to the transcendents taking value in a specific corresponding exceptional line on the initial value space of $q$PVI. Finally, we derive an asymptotic expansion of the tau function for small times $t$.", "url": "https://arxiv.org/abs/2608.03345", "type": "理论", "summary": "我们通过与之相关的一般黎曼-希尔伯特问题，对 $q$-difference Sixth Painlevé 方程 ($q$PVI) 的 tau 函数进行了解析构造，作为 Fredholm 行列式。我们证明，tau 函数是其定义域上的解析函数，当且仅当相应的黎曼-希尔伯特问题在该点不可解时，它在特定点处消失。我们用 tau 函数及其三个副本（其中一些参数发生了偏移）来表达相应的 $q$PVI 超越项。那么这四个 tau 函数中任何一个的消失都对应于在 $q$PVI 的初始值空间上的特定对应异常行中取值的超越值。最后，我们推导出 tau 函数在小时间 $t$ 上的渐近展开式。", "authors": [{"name": "Harini Desiraju"}, {"name": "Pieter Roffelsen"}], "featured_authors": [{"name": "Harini Desiraju"}, {"name": "Pieter Roffelsen"}], "author_count": 2}, {"id": "2608.03687", "category": "math-ph", "title": "On the dependence of the zero-free region of a partition function on the external field", "abstract": "Let $\\{0, 1\\}^n$ be the Boolean cube, endowed with the probability product measure, where ${\\Bbb P}(1)=p$ and ${\\Bbb P}(0)=q$ with $0 < p \\leq q=1-p$. Let $\\phi_i: \\{0, 1\\}^n \\longrightarrow {\\Bbb C}$ be $1$-Lipschitz functions in the Hamming metric, such that each $\\phi_i$ depends on at most $r$ coordinates of $x \\in \\{0, 1\\}^n$, where $rp \\geq 12$. For $j=1, \\ldots, n$, let $I_j $ be the set of indices $i$ such that $\\phi_i$ depends on the $j$-th coordinate. We prove that $E\\thinspace \\exp\\left\\{ \\sum_{i=1}^m \\lambda_i \\phi_i \\right\\} \\ne 0$ provided $\\lambda_i \\in {\\Bbb C}$ satisfy $\\sum_{i \\in I_j} |\\lambda_i| \\leq {1 \\over 10 \\sqrt{rp}}$ for all $j$. This translates into a regime for $\\pm 1$ spin systems, where a linear increase in the energy of multi-spin interactions requires only a logarithmic increase of the external field to keep the partition function zero-free and the system away from the phase transition.", "url": "https://arxiv.org/abs/2608.03687", "type": "理论", "summary": "令 $\\{0, 1\\}^n$ 为布尔立方体，赋予概率乘积测度，其中 ${\\Bbb P}(1)=p$ 和 ${\\Bbb P}(0)=q$ 且 $0 < p \\leq q=1-p$。令 $\\phi_i: \\{0, 1\\}^n \\longrightarrow {\\Bbb C}$ 为汉明度量中的 $1$-Lipschitz 函数，使得每个 $\\phi_i$ 最多依赖于 \\{0, 1\\}^n$ 中 $x \\in 的 $r$ 坐标，其中 $rp \\geq 12$。对于 $j=1, \\ldots, n$，令 $I_j $ 为索引 $i$ 的集合，使得 $\\phi_i$ 取决于第 $j$ 坐标。我们证明 $E\\thinspace \\exp\\left\\{ \\sum_{i=1}^m \\lambda_i \\phi_i \\right\\} \\ne 0$ 提供 $\\lambda_i \\in {\\Bbb C}$ 满足 $\\sum_{i \\in I_j} |\\lambda_i|对于所有 $j$，\\leq {1 \\over 10 \\sqrt{rp}}$。这转化为 $\\pm 1$ 自旋系统的状态，其中多自旋相互作用的能量线性增加只需要外场的对数增加即可保持配分函数为零并且系统远离相变。", "authors": [{"name": "Alexander Barvinok"}], "featured_authors": [{"name": "Alexander Barvinok"}], "author_count": 1}, {"id": "2608.02647", "category": "quant-ph", "title": "Sharp Plucker Geometry for Three-Copy Werner Distillation", "abstract": "Whether negative-partial-transpose entanglement can remain undistillable is a longstanding problem in quantum information theory. We analyze the first unresolved three-copy Werner endpoint using a sharp dimension-free inequality for complementary partial traces and an optimal exterior-square inequality for orthonormal tripartite vectors. The latter identifies local SWAP- parity statistics with metric data of a decomposable Plucker bivector. Together these inequalities prove endpoint nonnegativity for every positive semidefinite rank-two coefficient operator and for the complete normal rank-two sector in arbitrary finite local dimensions. For genuinely nonnormal operators, an exact crossed-Gram criterion proves nonnegativity when one local outpu-input support overlap is at most two, including every system with a qubit-sized factor, and when either support plane contains a product ray. Explicit anti-state and rank-boundary families establish optimality of the constants and the rank restriction.", "url": "https://arxiv.org/abs/2608.02647", "type": "理论+数值", "summary": "负部分转置纠缠是否能够保持不可蒸馏是量子信息理论中一个长期存在的问题。我们使用互补部分迹的尖锐无维不等式和正交三方向量的最佳外平方不等式来分析第一个未解决的三副本 Werner 端点。后者使用可分解的 Plucker 双向量的度量数据来识别本地 SWAP 奇偶校验统计数据。这些不等式共同证明了每个正半定二阶系数算子和任意有限局部维度中完整正态二阶扇区的端点非负性。对于真正的非正规算子，当一个本地输出输入支持重叠最多为两个（包括具有量子位大小因子的每个系统）并且任一支持平面包含乘积射线时，​​精确的交叉克准则证明非负性。明确的反国家和等级边界族建立了常数和等级限制的最优性。", "authors": [{"name": "Tianhao Wu"}, {"name": "Qiran Zou"}], "featured_authors": [{"name": "Tianhao Wu"}, {"name": "Qiran Zou"}], "author_count": 2}, {"id": "2608.02724", "category": "quant-ph", "title": "Structure of matrix product locally purifiable density operators", "abstract": "Tensor network methods provide powerful analytical and numerical tools for characterizing quantum phases of matter. While the mathematical structure of matrix product states (MPS) is well understood through the MPS fundamental theorem, an analogous understanding for mixed-state tensor networks remains largely absent: if two purification tensors generate the same density matrix, how are they related? In this work, we initiate the study of a fundamental theorem for matrix product locally purifiable density operators (LPDOs) and focus on sequentially generated LPDOs (sLPDOs), a broad subclass admitting an interpretation in terms of successive applications of quantum channels on an initial state. We prove that, under suitable invertibility or cyclic conditions, two sLPDO representations generate the same density matrix for arbitrary system sizes if and only if they are related by a matrix product isometry acting on the purification bonds. Beyond the sLPDO setting, we provide a counterexample that suggests an obstruction to a general fundamental theorem for LPDOs with periodic boundary conditions. Finally, we discuss implications for mixed-state symmetry-protected topological phases, including the possibility of nontrivial phases protected only by weak symmetry conditions.", "url": "https://arxiv.org/abs/2608.02724", "type": "理论+数值", "summary": "张量网络方法为表征物质的量子相提供了强大的分析和数值工具。虽然通过 MPS 基本定理可以很好地理解矩阵乘积状态 (MPS) 的数学结构，但对混合状态张量网络的类似理解仍然基本上不存在：如果两个净化张量生成相同的密度矩阵，它们如何相关？在这项工作中，我们开始研究矩阵乘积局部可纯化密度算子（LPDO）的基本定理，并重点关注顺序生成的 LPDO（sLPDO），这是一个广泛的子类，承认在初始状态上量子通道的连续应用的解释。我们证明，在适当的可逆性或循环条件下，两个 sLPDO 表示对于任意系统大小都会生成相同的密度矩阵，当且仅当它们通过作用于纯化键的矩阵乘积等距相关时。除了 sLPDO 设置之外，我们还提供了一个反例，表明具有周期性边界条件的 LPDO 的一般基本定理受到阻碍。\n\n最后，我们讨论了混合态对称保护拓扑相的含义，包括仅受弱对称条件保护的非平凡相的可能性。", "authors": [{"name": "Yale Yauk"}, {"name": "Yuhan Liu"}, {"name": "Ignacio Cirac"}], "featured_authors": [{"name": "Yale Yauk"}, {"name": "Yuhan Liu"}, {"name": "Ignacio Cirac"}], "author_count": 3}, {"id": "2608.02726", "category": "quant-ph", "title": "Unweighted Gapped Clique Homology is $\\mathsf{QMA}_1$-complete", "abstract": "Deciding whether the clique complex of a given graph has nontrivial homology in a given dimension, under vertex-product weighting and an inverse-polynomial spectral gap promise on the combinatorial Hodge Laplacian, is known to be $\\mathsf{QMA}_1$-hard and contained in $\\mathsf{QMA}$ by King and Kohler (FOCS 2024). The vertex weights are essential in the known proof, where they provide the scale separation needed for the spectral gap analysis. We prove that, when every vertex has weight one, the problem remains $\\mathsf{QMA}_1^{g_2}$-hard and is contained in $\\mathsf{QMA}_1^{g_2}$, where $\\mathsf{QMA}_1^{g_2}$ is $\\mathsf{QMA}_1$ with the universal gate set $g_2=\\{\\mathsf{X},\\mathsf{CX},\\mathsf{CCX},H\\otimes H\\}$. The construction replaces weight by expansion: each vertex of the weighted complex is blown up into a clique whose size encodes its weight. The block sizes are chosen so that symmetric averages reproduce the weighted Hodge metric. The symmetric sector therefore carries the weighted Laplacian up to a common scalar factor, while a local averaging argument gives a uniform lower bound on the orthogonal complement to the symmetric sector. Hence the weighted gap analysis transfers to an unweighted clique complex without introducing either additional low-energy states or spurious homology. Containment in $\\mathsf{QMA}_1^{g_2}$ follows from Rudolph's exact linear combination of unitaries simulation of sparse integer clique Laplacians. The result shows that the gap promise, rather than vertex weighting, is the source of the complexity of gapped clique homology.", "url": "https://arxiv.org/abs/2608.02726", "type": "理论+数值", "summary": "在顶点乘积加权和组合霍奇拉普拉斯算子上的逆多项式谱间隙承诺下，确定给定图的团复形在给定维度上是否具有非平凡同源性，已知是 $\\mathsf{QMA}_1$-hard 并包含在 $\\mathsf{QMA}$ 中，King 和 Kohler (FOCS 2024)。顶点权重在已知证明中至关重要，它们提供了光谱间隙分析所需的尺度分离。我们证明，当每个顶点的权重为1时，问题仍然是$\\mathsf{QMA}_1^{g_2}$-hard，并且包含在$\\mathsf{QMA}_1^{g_2}$中，其中$\\mathsf{QMA}_1^{g_2}$是带有通用门集的$\\mathsf{QMA}_1$ $g_2=\\{\\mathsf{X},\\mathsf{CX},\\mathsf{CCX},H\\otimes H\\}$。该结构通过扩展代替重量：加权复合体的每个顶点都被放大成一个团，其大小编码其重量。选择块大小以便对称平均值再现加权霍奇度量。因此，对称扇区将加权拉普拉斯算子带到公共标量因子，而局部平均参数给出了对称扇区的正交补的统一下界。\n\n因此，加权间隙分析转移到未加权的集团复合体，而不引入额外的低能态或虚假同源性。 $\\mathsf{QMA}_1^{g_2}$ 中的包含遵循鲁道夫对稀疏整数团拉普拉斯算子的酉模拟的精确线性组合。结果表明，间隙承诺，而不是顶点权重，是间隙团同源性复杂性的根源。", "authors": [{"name": "Ryu Hayakawa"}], "featured_authors": [{"name": "Ryu Hayakawa"}], "author_count": 1}, {"id": "2608.02734", "category": "quant-ph", "title": "Improved constant factors for qubitized Hamiltonian simulation", "abstract": "Quantum signal processing (QSP) serves as the asymptotically optimal technique for Hamiltonian simulation on a quantum computer. By approximating the time evolution operator via the Jacobi-Anger expansion, the Hamiltonian simulation problem reduces to a problem in polynomial approximation theory: find a sufficient degree-$d$ polynomial series to approximate $e^{-i\\tau x}$ on $[-1,1]$ within error $\\epsilon$. While $d\\in\\tilde{\\mathcal{O}}(\\tau)$ is known to be asymptotically optimal, there exists a gap between state-of-the-art bounds and the optimal constant multiplicative factor, which is approximately equal to 1. Here, we close this gap almost entirely, to the point where possible future improvements will not be of practical significance. Our improvement resides in a careful treatment of the Bessel tail in the Jacobi-Anger series using Kapteyn's and Watson's inequalities, thereby reducing the overhead estimates for all Hamiltonian simulation tasks on quantum computers by a factor of $\\approx e/2$.", "url": "https://arxiv.org/abs/2608.02734", "type": "理论+数值", "summary": "量子信号处理 (QSP) 是量子计算机上哈密顿模拟的渐近最优技术。通过 Jacobi-Anger 展开式逼近时间演化算子，哈密顿模拟问题简化为多项式逼近理论中的问题：找到足够的 $d$ 次多项式级数，在误差 $\\epsilon$ 内逼近 $[-1,1]$ 上的 $e^{-i\\tau x}$。虽然 $d\\in\\tilde{\\mathcal{O}}(\\tau)$ 已知是渐近最优的，但最先进的边界和最优常数乘法因子之间存在差距，该差距大约等于 1。在这里，我们几乎完全缩小了这个差距，以至于未来可能的改进将不具有实际意义。我们的改进在于使用 Kapteyn 和 Watson 不等式仔细处理 Jacobi-Anger 级数中的贝塞尔尾部，从而将量子计算机上所有哈密顿模拟任务的开销估计减少 $\\approx e/2$。", "authors": [{"name": "Matthew Pocrnic"}, {"name": "Danial Motlagh"}], "featured_authors": [{"name": "Matthew Pocrnic"}, {"name": "Danial Motlagh"}], "author_count": 2}, {"id": "2608.02745", "category": "quant-ph", "title": "Schmidt-Gauge Non-Local Magic: Representation, Optimality, and Mathematical Properties", "abstract": "While the full non-stabilizerness (magic) of a quantum state contains local, basis-dependent contributions, a non-local formulation based on a minimization over local unitaries isolates the component associated with genuinely non-local correlations. Within such a framework, the Schmidt-gauge formulation of non-local magic provides a direct connection between genuinely non-local non-stabilizer correlations and the entanglement spectrum of quantum many-body states. Building on the exact Walsh--Hadamard representation introduced in our accompanying Letter, we develop the mathematical theory associated with this formulation. We extend the formalism to arbitrary bipartitions, prove the exactness of the Schmidt gauge for arbitrary $1\\times N$ bipartitions, and derive general analytical properties of Schmidt-gauge non-local magic, including entanglement bounds, selection rules, and exact relations with the moments of the normalized Walsh spectrum. This representation also allows to interpret non-local magic as the inverse participation ratio of the Walsh entanglement spectrum, thus relating it to a concentration measure in Walsh space. These results demonstrate that the Walsh--Hadamard representation reveals an underlying discrete harmonic structure that is hidden in the original spectral formulation and provides considerably more than an equivalent expression for Schmidt-gauge non-local magic. Rather, it furnishes the natural mathematical framework for its analytical investigation, placing the theory within the broader context of discrete harmonic analysis.", "url": "https://arxiv.org/abs/2608.02745", "type": "理论", "summary": "虽然量子态的完全非稳定性（魔力）包含局部的、依赖于基的贡献，但基于局部酉最小化的非局部公式隔离了与真正的非局部相关性相关的分量。在这样的框架内，非局域魔力的施密特规范公式提供了真正的非局域非稳定相关性与量子多体态的纠缠谱之间的直接联系。基于我们随附的信件中介绍的精确的 Walsh-Hadamard 表示，我们开发了与该公式相关的数学理论。我们将形式主义扩展到任意二分，证明施密特规范对于任意 $1\\times N$ 二分的准确性，并推导施密特规范非局部魔术的一般分析属性，包括纠缠界限、选择规则以及与归一化沃尔什谱矩的精确关系。这种表示还允许将非局部魔力解释为沃尔什纠缠谱的逆参与比，从而将其与沃尔什空间中的集中度量相关联。\n\n这些结果表明，Walsh-Hadamard 表示揭示了隐藏在原始谱公式中的潜在离散谐波结构，并且为施密特规范非局部魔力提供了比等效表达式更多的内容。相反，它为其分析研究提供了自然的数学框架，将理论置于更广泛的离散调和分析背景中。", "authors": [{"name": "Fabio Franchini"}, {"name": "Salvatore Marco Giampaolo"}], "featured_authors": [{"name": "Fabio Franchini"}, {"name": "Salvatore Marco Giampaolo"}], "author_count": 2}, {"id": "2608.02826", "category": "quant-ph", "title": "Improved Quantum Algorithms for Reinforcement Learning Under a Generative Model", "abstract": "Reinforcement learning is a subfield of machine learning that studies how an agent interacts with an environment in order to extract as large a reward as possible. A standard approach to study such interaction is through Markov Decision Processes (MDPs) and the task of choosing an optimal policy --- a function that tells the agent which action to take. In this work, we study two types of MDPs --- finite-horizon and infinite-horizon discounted --- and propose new quantum algorithms for computing approximate optimal policies. Our quantum algorithms are based on a new combination of standard value iteration and quantum subroutines like quantum mean estimation and quantum maximum finding, overall enhanced with techniques from sample-optimal classical algorithms. Our resulting query complexities improve upon previous works, thus approaching already established quantum lower bounds.", "url": "https://arxiv.org/abs/2608.02826", "type": "理论+数值", "summary": "强化学习是机器学习的一个子领域，它研究代理如何与环境交互，以获取尽可能大的奖励。研究这种交互的标准方法是通过马尔可夫决策过程（MDP）和选择最优策略的任务——一个告诉智能体采取哪种行动的函数。在这项工作中，我们研究了两种类型的 MDP——有限范围和无限范围折扣——并提出了用于计算近似最优策略的新量子算法。我们的量子算法基于标准值迭代和量子子例程（例如量子均值估计和量子最大值查找）的新组合，并通过样本最优经典算法的技术进行了整体增强。我们产生的查询复杂性在之前的工作的基础上有所提高，从而接近已经建立的量子下限。", "authors": [{"name": "Joao F. Doriguello"}], "featured_authors": [{"name": "Joao F. Doriguello"}], "author_count": 1}, {"id": "2608.02848", "category": "quant-ph", "title": "Heisenberg scaling under collective non-parallel directional noise via geometric state design", "abstract": "Spin-squeezed states enable entanglement-enhanced frequency estimation; however, the achievable performance is limited in practice by decoherence. We study the problem of parameter estimation under \\emph{classical collective noise} that acts along a \\emph{fixed} direction during signal encoding. While we restrict our analysis to Gaussian noise statistics, no assumption is made on the nature of the noise temporal correlations. Our approach captures both parallel (dephasing) and single-axis transverse noise as special cases, and covers both Markovian and non-Markovian metrological regimes. In the properly squeezed limit, where a Holstein-Primakoff description is accurate, we identify a geometric noise-immunity mechanism: for \\emph{known} non-parallel signal and noise axes, an appropriate one-axis-twisted input encodes the signal in a quadrature that is metric-orthogonal to the direction of noise-induced diffusion. Irrespective of the noise temporal correlations, the resulting estimation precision exhibits Heisenberg scaling in the probe number. Optimal performance is achievable by measuring a single collective spin component. Imperfect knowledge of the noise axis produces a crossover from Heisenberg scaling at moderate probe number back to the known collective-dephasing bounds asymptotically.", "url": "https://arxiv.org/abs/2608.02848", "type": "理论", "summary": "自旋压缩态可以实现纠缠增强的频率估计；然而，在实践中可实现的性能受到退相干的限制。我们研究了在信号编码期间沿着 emph{固定} 方向作用的 emph{经典集体噪声} 下的参数估计问题。虽然我们将分析限制在高斯噪声统计上，但没有对噪声时间相关性的性质做出任何假设。我们的方法捕获平行（移相）和单轴横向噪声作为特殊情况，并涵盖马尔可夫和非马尔可夫计量制度。在适当压缩的极限下，Holstein-Primakoff 描述是准确的，我们确定了一种几何噪声免疫机制：对于 \\emph{known} 非平行信号和噪声轴，适当的单轴扭曲输入以与噪声引起的扩散方向度量正交的正交方式对信号进行编码。不考虑噪声时间相关性，所得的估计精度在探测数量中表现出海森堡缩放。通过测量单个集体自旋分量可以实现最佳性能。\n\n对噪声轴的不完美了解会产生从海森堡缩放以中等探针数量渐进回到已知集体相移边界的交叉。", "authors": [{"name": "Francisco Riberi"}, {"name": "Milad Marvian"}, {"name": "Lorenza Viola"}], "featured_authors": [{"name": "Francisco Riberi"}, {"name": "Milad Marvian"}, {"name": "Lorenza Viola"}], "author_count": 3}, {"id": "2608.03029", "category": "quant-ph", "title": "Physics-Informed Quantum Machine Learning with Hard Constraint Embedding for Nonlinear Differential Equations of the First Order", "abstract": "Quantum algorithms based on linear-system approaches for solving differential equations demand qubit and precision resources beyond near-term capabilities. To address these challenges, this work proposes a physics-informed quantum machine learning (PIQML) framework with hard constraint embedding, specifically designed for NISQ era. Within this framework, parameterized quantum circuits serve as machine learning models, where the input variable is encoded into a high-dimensional feature space via a Fourier feature map. Subsequently, to eliminate approximation errors in critical physical conditions, the solution is constructed through a rigorously designed function mapper that analytically enforces initial conditions as hard constraints. Crucially, we compute derivatives with respect to the input variable using the parameter-shift rule---a quantum native gradient evaluation technique that avoids classical discretization. Unlike generic loss functions that target abstract data patterns, our loss function focuses on the differential equation residual and reference data. This design ensures that the trained model not only approximates the data but also intrinsically satisfies the physical constraint expressed by the DE itself. Our method is validated on several differential equations, including highly oscillatory ones, demonstrating its capability to tackle challenging nonlinear dynamics. Results demonstrate that our quantum model successfully learns the solution, showing close agreement with a high-precision classical numerical benchmark.", "url": "https://arxiv.org/abs/2608.03029", "type": "理论+数值", "summary": "基于线性系统方法求解微分方程的量子算法需要超出近期能力的量子位和精度资源。为了应对这些挑战，这项工作提出了一种具有硬约束嵌入的物理信息量子机器学习（PIQML）框架，专为 NISQ 时代设计。在此框架内，参数化量子电路充当机器学习模型，其中输入变量通过傅里叶特征图编码到高维特征空间中。随后，为了消除关键物理条件下的近似误差，通过严格设计的函数映射器构建解决方案，该函数映射器通过分析将初始条件强制作为硬约束。至关重要的是，我们使用参数转移规则计算输入变量的导数——一种避免经典离散化的量子原生梯度评估技术。与针对抽象数据模式的通用损失函数不同，我们的损失函数侧重于微分方程残差和参考数据。\n\n这种设计确保训练后的模型不仅逼近数据，而且本质上满足DE本身表达的物理约束。我们的方法在多个微分方程（包括高振荡方程）上进行了验证，证明了其解决具有挑战性的非线性动力学的能力。结果表明，我们的量子模型成功地学习了解决方案，与高精度经典数值基准非常一致。", "authors": [{"name": "Mengke Xu"}, {"name": "Xi Li"}, {"name": "Xiao Chen"}, {"name": "Xunan Wang"}, {"name": "Wanli Huo"}, {"name": "Long Ma"}, {"name": "Weiqi Yan"}], "featured_authors": [{"name": "Mengke Xu"}, {"name": "Xi Li"}, {"name": "Xiao Chen"}, {"name": "Wanli Huo"}, {"name": "Long Ma"}, {"name": "Weiqi Yan"}], "author_count": 7}, {"id": "2608.03090", "category": "quant-ph", "title": "Correlating spin and optical properties of quantum emitters in hBN", "abstract": "Optically addressable spin defects in hexagonal boron nitride (hBN) are well suited for near-surface quantum sensing. They offer bright, wavelength-tunable single-photon emission with high optically detected magnetic resonance (ODMR) contrast at room temperature. Here we controllably synthesise a high density of spin-complex defects in carbon-doped hBN flakes. We find that the zero-field splitting parameter D is directly correlated with the zero-phonon line of an emitter, while the ODMR contrast shows no such correlation. We further analyse an individual narrowband defect showing 68% ODMR contrast and enhance its photon collection by ~40% using a solid immersion lens. By advancing both the practical synthesis of the spin complexes and the understanding of their microscopic origin, our results move us toward the deterministic creation of ODMR-active quantum emitters", "url": "https://arxiv.org/abs/2608.03090", "type": "理论", "summary": "六方氮化硼 (hBN) 中的光学可寻址自旋缺陷非常适合近表面量子传感。它们可提供明亮、波长可调的单光子发射，并在室温下具有高光学检测磁共振 (ODMR) 对比度。在这里，我们在碳掺杂六方氮化硼薄片中可控地合成了高密度的自旋络合物缺陷。我们发现零场分裂参数 D 与发射器的零声子线直接相关，而 ODMR 对比度则没有显示这种相关性。我们进一步分析了显示 68% ODMR 对比度的单个窄带缺陷，并使用固体浸没透镜将其光子收集增强了约 40%。通过推进自旋配合物的实际合成和对其微观起源的理解，我们的结果使我们朝着 ODMR 活性量子发射器的确定性创造迈进", "authors": [{"name": "Nika Teran"}, {"name": "Benjamin Whitefield"}, {"name": "Nicholas Sloane"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Igor Aharonovichand Mehran Kianinia"}], "featured_authors": [{"name": "Nika Teran"}, {"name": "Benjamin Whitefield"}, {"name": "Nicholas Sloane"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Igor Aharonovichand Mehran Kianinia"}], "author_count": 6}, {"id": "2608.03184", "category": "quant-ph", "title": "Characterizing pairwise swapping capabilities of dense coding channels", "abstract": "We introduce a novel multipartite entanglement-assisted classical communication task, referred to as dense coding swapping, in which legitimate parties collaboratively swap the dense codeability from one communication channel to another through suitable joint unitary operations. Due to the dense coding (DC) exclusion principle, the scheme enhances the dense codeability of a target pair while simultaneously reducing it for a non-target branch in the network. This swapping capability has broader implications, as it may be viewed as a form of process swapping, distinct from resource swapping, while also providing a prevention measure when one of the receivers is compromised. We derive necessary and sufficient conditions, expressed in terms of the Schmidt coefficients, for three-qubit pure states to support DC swapping, while we obtain a sufficient criterion for mixed states using their Bloch correlation parameters. Furthermore, we identify the optimal two-qubit unitary operators capable of realizing the swapping of dense codeability between communication channels. We further examine the tolerance of these eligible states against both colored and white noise, demonstrating the resilience of the proposed task under environmental perturbations. We also show that multipartite states supporting DC swapping require only a small amount of genuine multipartite entanglement and that this requirement decreases with increasing system size.", "url": "https://arxiv.org/abs/2608.03184", "type": "理论", "summary": "我们引入了一种新颖的多方纠缠辅助经典通信任务，称为密集编码交换，其中合法各方通过适当的联合酉操作协作将密集可编码性从一个通信通道交换到另一个通信通道。由于密集编码（DC）排除原理，该方案增强了目标对的密集可编码性，同时减少了网络中非目标分支的密集可编码性。这种交换能力具有更广泛的含义，因为它可以被视为一种进程交换形式，与资源交换不同，同时还可以在一个接收器受到损害时提供预防措施。我们导出了以施密特系数表示的三量子位纯态支持 DC 交换的必要和充分条件，同时我们使用其布洛赫相关参数获得了混合态的充分标准。此外，我们确定了能够实现通信通道之间密集可编码性交换的最佳双量子位酉算子。\n\n我们进一步检查了这些符合条件的州对有色噪声和白噪声的容忍度，证明了所提出的任务在环境扰动下的弹性。我们还表明，支持 DC 交换的多方状态仅需要少量真正的多方纠缠，并且这种要求随着系统规模的增加而降低。", "authors": [{"name": "Abhishek Muhuri"}, {"name": "Nirman Ganguly"}, {"name": "Aditi Sen De"}, {"name": "Indranil Chakrabarty"}], "featured_authors": [{"name": "Abhishek Muhuri"}, {"name": "Nirman Ganguly"}, {"name": "Aditi Sen De"}, {"name": "Indranil Chakrabarty"}], "author_count": 4}, {"id": "2608.03188", "category": "quant-ph", "title": "Factorization of Exclusive-Sum-Of-Products Expressions with Rectangle Covering to Reduce Quantum Circuit Cost", "abstract": "The implementation of quantum circuits is currently very expensive, especially due to the usage of large Toffoli gates. Therefore, it is critical to optimize circuit costs by factoring expressions as they become more complex. In the proposed algorithms to factor ESOP expressions, each product term is converted into a cell in a 2D matrix, and optimal factored AND/EXOR solutions are determined using Disjoint and Even-Odd Rectangle covering methods. Two Python programs implementing these algorithms were tested and evaluated using well-known benchmarks. The results showed that both the literal counts used in classical logic circuits as well as the Maslov cost used in quantum circuits was reduced by 20%-95% depending on expression size.", "url": "https://arxiv.org/abs/2608.03188", "type": "理论+数值", "summary": "目前量子电路的实施非常昂贵，特别是由于使用大型托弗里门。因此，当表达式变得更加复杂时，通过因式分解来优化电路成本至关重要。在所提出的分解 ESOP 表达式的算法中，每个乘积项都被转换为 2D 矩阵中的一个单元，并使用不相交和偶奇矩形覆盖方法确定最佳分解 AND/EXOR 解决方案。使用众所周知的基准测试和评估了实现这些算法的两个 Python 程序。结果表明，经典逻辑电路中使用的文字计数以及量子电路中使用的 Maslov 成本都减少了 20%-95%，具体取决于表达式大小。", "authors": [{"name": "Audrey Hou"}, {"name": "Lucia Zhang"}, {"name": "Ali Al-Bayaty"}, {"name": "Marek Perkowski"}], "featured_authors": [{"name": "Audrey Hou"}, {"name": "Lucia Zhang"}, {"name": "Ali Al-Bayaty"}, {"name": "Marek Perkowski"}], "author_count": 4}, {"id": "2608.03315", "category": "quant-ph", "title": "Harvest: Resource-Aware Quantum Compilation for Magic State Protocols", "abstract": "Fault-tolerant quantum processors based on topological codes execute programs through lattice surgery, where operations must be mapped, routed, and supplied with magic states across a 2D grid of physical patches. Non-Clifford operations require these magic states, produced either by distillation factories or by cultivation, each trading footprint against preparation latency, and delivering a magic state to the data patches that consume it requires routing through the same shared layout as every other operation. Yet placement, routing, scheduling, and magic-state supply cannot be optimized in isolation: two operations with no circuit-level dependency can still contend for the same ports, routes, or magic-state terminals once placed, so a compiler that decouples instruction scheduling from magic-state generation, or hard-codes a single generation protocol, is forced to trade execution time against layout footprint instead of co-optimizing both across protocols. We present Harvest, a resource-aware compilation approach for lattice-surgery that co-optimizes magic-state consumption with circuit-aware placement and congestion-aware routing under a protocol-agnostic resource model, then reclaims unused layout footprint after scheduling. Across standard benchmark suites (QAOA, QFT, QASMBench), Harvest achieves an average speedup of $4.83\\times$ (up to $17.8\\times$) over sequential execution, improves schedule length by up to $1.35\\times$ through circuit-aware placement, and reclaims up to $72.0\\%$ of unused magic-state patches and $33.9\\%$ of unused routing patches.", "url": "https://arxiv.org/abs/2608.03315", "type": "理论+数值", "summary": "基于拓扑代码的容错量子处理器通过晶格手术执行程序，其中操作必须在物理补丁的二维网格上进行映射、路由和提供魔法状态。非 Clifford 操作需要这些由蒸馏工厂或培养产生的神奇状态，每个交易足迹都针对准备延迟，并将神奇状态传递给使用它的数据补丁需要通过与其他操作相同的共享布局进行路由。然而，布局、路由、调度和魔法状态供应无法单独优化：两个没有电路级依赖关系的操作在放置后仍然可以竞争相同的端口、路由或魔法状态终端，因此将指令调度与魔法状态生成解耦或硬编码单个生成协议的编译器被迫在执行时间和布局占用空间之间进行权衡，而不是跨协议共同优化两者。\n\n我们提出了 Harvest，一种用于晶格手术的资源感知编译方法，它在与协议无关的资源模型下共同优化魔法状态消耗与电路感知布局和拥塞感知路由，然后在调度后回收未使用的布局占用空间。在标准基准测试套件（QAOA、QFT、QASMBench）中，Harvest 比顺序执行平均加速了 $4.83\\times$（高达 $17.8\\times$），通过电路感知布局将调度长度提高了 $1.35\\times$，并回收了高达 $72.0\\%$ 的未使用的 magic-state 补丁和 $33.9\\%$ 的未使用的路由补丁。", "authors": [{"name": "Jannik Pflieger"}, {"name": "Aleksandra Świerkowska"}, {"name": "Emmanouil Giortamis"}, {"name": "Pramod Bhatotia"}], "featured_authors": [{"name": "Jannik Pflieger"}, {"name": "Aleksandra Świerkowska"}, {"name": "Emmanouil Giortamis"}, {"name": "Pramod Bhatotia"}], "author_count": 4}, {"id": "2608.03325", "category": "quant-ph", "title": "Protected measurements for protected superconducting qubits", "abstract": "Protected superconducting qubits such as the $0$-$\\pi$ qubit promise to substantially suppress error rates, facilitating fault-tolerant quantum computing with fewer qubits. Measuring these qubits is challenging due to their protected nature, and thus far no concrete proposal exists for how to measure them without breaking their protection. Here we show how to perform protected measurements of the $0$-$\\pi$ qubit in two orthogonal bases. The protection of these measurements is facilitated by their quantum non-demolition nature, allowing faults on ancillary measurement qubits to be tolerated. As experimental progress pushes protected qubits further into the low error-rate regime, our techniques will be crucial for fault-tolerant universal control.", "url": "https://arxiv.org/abs/2608.03325", "type": "实验", "summary": "受保护的超导量子位（例如 $0$-$\\pi$ 量子位）有望大幅抑制错误率，从而以更少的量子位促进容错量子计算。由于其受保护的性质，测量这些量子位具有挑战性，到目前为止，还没有关于如何在不破坏其保护的情况下测量它们的具体建议。在这里，我们展示如何在两个正交基中对 $0$-$\\pi$ 量子位执行受保护的测量。这些测量的保护得益于它们的量子非破坏性质，允许辅助测量量子位上的故障。随着实验进展将受保护的量子位进一步推向低错误率状态，我们的技术对于容错通用控制至关重要。", "authors": [{"name": "Xanda C Kolesnikow"}, {"name": "Thomas B Smith"}, {"name": "Andrew C Doherty"}], "featured_authors": [{"name": "Xanda C Kolesnikow"}, {"name": "Thomas B Smith"}, {"name": "Andrew C Doherty"}], "author_count": 3}, {"id": "2608.03390", "category": "quant-ph", "title": "The geometry of absolute separability and other convex matrix properties from spectrum", "abstract": "We investigate the geometric structure of the set of spectra of bipartite absolute separable states ($\\mathrm{ASEP}_{m,n}$) and absolute positive partial transpose states ($\\mathrm{APPT}_{m,n}$), i.e., bipartite quantum states that remain separable or PPT respectively, under all global unitary transformations. First, we establish general geometric properties of absolute convex sets of matrices, their spectra and extreme points. Regarding absolute separability, we present a permutation-symmetric reformulation of the absolute PPT criterion and use it to demonstrate that $\\mathrm{APPT}_{m,n}$ is a spectrahedron for all $m\\leq n$: in particular, all its faces are exposed. In contrast, while $\\mathrm{ASEP}_{2,n}$ is also a spectrahedron, we prove that in general $\\mathrm{ASEP}_{m,n}$ is a semialgebraic set for all $m\\leq n$. Furthermore, we provide a complete characterization of the faces and extreme points of $\\mathrm{APPT}_{m,n}$ and demonstrate that the dimension of a face is determined by the rank of a certain matrix, with maximal proper faces having dimension $(mn-m-1)$. In the quantitative setting, we provide a rigorous lower bound on the maximal attainable purity of $\\mathrm{APPT}_{m,n}$ via an inscribed polytope $\\mathcal{P}_{m,n}$ and conjecture that the maximal purity of $\\mathrm{APPT}_{m,n}$ (along with its spectra) coincides with the polytope for arbitrary dimensions except when $m=n=2$. Additionally, we also provide a rigorous upper bound on the minimal von Neumann entropy of $\\mathrm{APPT}_{m,n}$ and demonstrate numerically that the minimum entropy eventually coincides with the polytope $\\mathcal{P}_{m,n}$ as the local system dimension $n$ increases. Finally, we show that the relative spectral volume of $\\mathrm{APPT}_{m,n}$ decays exponentially in $n$ by a constant multiplicative factor of the relative volume of the inscribed polytope $\\mathcal{P}_{m,n}$.", "url": "https://arxiv.org/abs/2608.03390", "type": "理论+数值", "summary": "我们研究了二部绝对可分离态 ($\\mathrm{ASEP}_{m,n}$) 和绝对正部分转置态 ($\\mathrm{APPT}_{m,n}$) 谱集的几何结构，即在所有全局酉变换下分别保持可分离或 PPT 的二部量子态。首先，我们建立绝对凸矩阵集的一般几何性质、它们的谱和极值点。关于绝对可分离性，我们提出了绝对 PPT 准则的排列对称重构，并用它来证明 $\\mathrm{APPT}_{m,n}$ 是所有 $m\\leq n$ 的谱面体：特别是，它的所有面都暴露了。相反，虽然 $\\mathrm{ASEP}_{2,n}$ 也是谱面体，但我们证明一般来说 $\\mathrm{ASEP}_{m,n}$ 是所有 $m\\leq n$ 的半代数集。此外，我们提供了 $\\mathrm{APPT}_{m,n}$ 的面和极值点的完整表征，并证明面的维度由某个矩阵的秩决定，最大真面的维度为 $(mn-m-1)$。\n\n在定量设置中，我们通过内切多面体 $\\mathcal{P}_{m,n}$ 为 $\\mathrm{APPT}_{m,n}$ 的最大可达到纯度提供严格的下界，并推测 $\\mathrm{APPT}_{m,n}$ 的最大纯度（及其光谱）与任意维度的多面体一致，除非 $m=n=2$ 时除外。此外，我们还提供了 $\\mathrm{APPT}_{m,n}$ 最小冯诺依曼熵的严格上限，并以数值方式证明，随着局部系统维度 $n$ 的增加，最小熵最终与多胞形 $\\mathcal{P}_{m,n}$ 一致。最后，我们证明 $\\mathrm{APPT}_{m,n}$ 的相对谱体积在 $n$ 中按内接多面体 $\\mathcal{P}_{m,n}$ 相对体积的常数乘法因子呈指数衰减。", "authors": [{"name": "Jennifer Ahiable"}, {"name": "Naga Bhavya Teja Kothakonda"}, {"name": "Andreas Winter"}], "featured_authors": [{"name": "Jennifer Ahiable"}, {"name": "Naga Bhavya Teja Kothakonda"}, {"name": "Andreas Winter"}], "author_count": 3}, {"id": "2608.03472", "category": "quant-ph", "title": "Matrix Product Evolution: A Method for Simulating Quantum Circuits Using Tensor Networks", "abstract": "Classical simulation of quantum circuits is an essential tool in quantum information science, but its applicability is constrained by the exponential growth of the Hilbert space and the entanglement structure of quantum states. In this work, we introduce Matrix Product Evolution (MPE), a tensor-train representation of quantum circuits constructed along the circuit depth rather than along the qubit index. Within this formulation, the simulation of a quantum circuit is modeled as the contraction of multiple MPE tensors. We develop an efficient contraction strategy based on a zip-up procedure to carry out this contraction in practice. We investigate the numerical behavior of this MPE-based contraction framework through simulations of random quantum circuits and the time evolution of a quantum many-body state. Our results characterize the growth of temporal bond dimensions, clarify how post-selection modifies the contraction cost and approximation accuracy, and identify regimes in which depth-oriented tensor-network contractions provide a useful complement to standard MPS-based simulation approaches.", "url": "https://arxiv.org/abs/2608.03472", "type": "理论+数值", "summary": "量子电路的经典模拟是量子信息科学的重要工具，但其适用性受到希尔伯特空间的指数增长和量子态的纠缠结构的限制。在这项工作中，我们引入了矩阵乘积演化（MPE），这是一种沿着电路深度而不是沿着量子位索引构造的量子电路的张量序列表示。在这个公式中，量子电路的模拟被建模为多个 MPE 张量的收缩。我们开发了一种基于拉链程序的有效收缩策略，以在实践中执行这种收缩。我们通过模拟随机量子电路和量子多体态的时间演化来研究这种基于 MPE 的收缩框架的数值行为。我们的结果描述了时间键维度的增长，阐明了选择后如何修改收缩成本和近似精度，并确定了深度导向张量网络收缩为基于 MPS 的标准模拟方法提供有用补充的机制。", "authors": [{"name": "Haruyuki Kawabe"}, {"name": "Minoru Nagai"}, {"name": "Tsuyoshi Okubo"}, {"name": "Synge Todo"}], "featured_authors": [{"name": "Haruyuki Kawabe"}, {"name": "Minoru Nagai"}, {"name": "Tsuyoshi Okubo"}, {"name": "Synge Todo"}], "author_count": 4}, {"id": "2608.03549", "category": "quant-ph", "title": "Gravitational redshift as a quantum channel: modeling the effects of gravitational redshift in quantum optics", "abstract": "The gravitational frequency shift of light is well understood in the theory of classical electromagnetism. Nevertheless, its description in quantum theory is not yet fully developed. Recent work pointed out inconsistencies in previously developed models aimed at describing gravitational redshift as an effective multi-mode mixer (MMM) acting on modes of light, however, a complete solution of the issues was not obtained. Here, we identify the root cause of the MMM model's inconsistency and provide two complementary approaches to correct it: a \"natural\" one from a field-theoretic perspective, and another adapted to the language of quantum mechanics of finite-dimensional systems. We show that the second approach allows for modeling of the redshift in a multi-mode transmission setup as a quantum channel that can be characterized using standard quan
