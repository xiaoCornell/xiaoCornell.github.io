va"}, {"name": "Fr{é}d{é}ric Chevy"}], "author_count": 2}, {"id": "2608.02042", "category": "cond-mat", "title": "Enhanced and robust superconductivity in La0.8Sr0.2NiO2 membranes compressed up to 210 GPa", "abstract": "The discovery of superconductivity in infinite-layer nickelate thin films has opened a new frontier for exploring unconventional oxide superconductors beyond the copper oxide family. However, the presence of substrate hampers investigations under very high pressure. Recently, this problem was circumvented by a study of freestanding Nd0.85Sr0.15NiO2 membranes, which revealed that superconducting transition temperature kept increasing as the pressure was ramped up to 91 GPa, without showing signs of saturation. Naturally, one wonders what would happen at even higher pressures. Here, we report that superconductivity in a freestanding La0.8Sr0.2NiO2 membrane persists under applied ultrahigh pressures up to 210 GPa. The superconducting transition onset temperature exhibits a continuous dome-like evolution, increasing from 16 K at ambient pressure to a peak of 74.5 K at 146 GPa, and then gradually decreasing to 57.4 K at 210 GPa. Such robustness of superconductivity against ultrahigh pressure has not been observed in high-Tc oxide superconductors before.", "url": "https://arxiv.org/abs/2608.02042", "type": "理论", "summary": "无限层镍酸盐薄膜超导性的发现为探索氧化铜家族以外的非常规氧化物超导体开辟了新的前沿。然而，底物的存在阻碍了高压下的研究。最近，一项对独立式 Nd0.85Sr0.15NiO2 膜的研究解决了这个问题，该研究表明，随着压力升至 91 GPa，超导转变温度不断升高，而没有表现出饱和迹象。人们自然想知道在更高的压力下会发生什么。在这里，我们报告说，独立式 La0.8Sr0.2NiO2 膜在高达 210 GPa 的超高压下仍能保持超导性。超导转变起始温度表现出连续的圆顶状演化，从环境压力下的16 K增加到146 GPa下的峰值74.5 K，然后逐渐降低到210 GPa下的57.4 K。以前在高 Tc 氧化物超导体中从未观察到超导对超高压的鲁棒性。", "authors": [{"name": "Shu Cai"}, {"name": "Yuqing Tian"}, {"name": "Shengjun Yan"}, {"name": "Jinyu Zhao"}, {"name": "Bo Hao"}, {"name": "Jianfeng Zhang"}, {"name": "Shuaihang Sun"}, {"name": "Yang Ding"}, {"name": "Qi Wu"}, {"name": "Ho-kwang Mao"}, {"name": "I. Bozovic"}, {"name": "Yuefeng Nie"}, {"name": "Liling Sun"}], "featured_authors": [{"name": "Shu Cai"}, {"name": "Yuqing Tian"}, {"name": "Shengjun Yan"}, {"name": "I. Bozovic"}, {"name": "Yuefeng Nie"}, {"name": "Liling Sun"}], "author_count": 13}, {"id": "2608.02131", "category": "cond-mat", "title": "Coherent migration of the single excitation injected into finite-length segment of the biomolecular chain", "abstract": "We study the migration of a single excitation excited at a structural element of a finite molecular segment, which is a part of a long biomolecular chain. The excitation cannot leave the segment and is locally coupled to thermal vibrations of the lattice, forming a self-trapped state corresponding to a nonadiabatic polaron. The time-dependent probability distribution of finding the excitation at the nodes of the segment is calculated, with particular emphasis on the role of the initial excitation position. A formal analogy is observed between the present model and continuous-time quantum walk models on finite chains with reflecting boundaries. The results reveal an asymmetry in the probability distribution for nodes symmetrically positioned with respect to the initially excited site, which arises solely from the asymmetric placement of the initial excitation within the finite segment. The only exception occurs when the initially excited node is located at the center of the segment, where the probability distribution becomes symmetric. The complex interference pattern and the absence of well-defined revivals stem from the non-equidistant spectrum of mode frequencies, leading to progressive dephasing of the constituent modes. As a result, the initially well-localized probability maximum fragments into one dominant maximum accompanied by several secondary maxima of lower intensity. These findings highlight the importance of boundary conditions and initial-state geometry in controlling quantum transport in finite molecular systems.", "url": "https://arxiv.org/abs/2608.02131", "type": "理论+数值", "summary": "我们研究在有限分子片段的结构元素处激发的单次激发的迁移，该有限分子片段是长生物分子链的一部分。激发不能离开该段，并且局部耦合到晶格的热振动，形成与非绝热极化子相对应的自陷态。计算在段的节点处找到激励的时间相关概率分布，特别强调初始激励位置的作用。在本模型和具有反射边界的有限链上的连续时间量子行走模型之间观察到了形式类比。结果表明，相对于初始激励位置对称定位的节点的概率分布存在不对称性，这完全是由于有限段内初始激励的不对称放置而引起的。唯一的例外是当最初激发的节点位于段的中心时，概率分布变得对称。\n\n复杂的干涉图案和缺乏明确定义的复兴源于模式频率的非等距频谱，导致组成模式的渐进相移。结果，最初定位良好的概率最大值分裂成一个主要最大值，并伴随着几个较低强度的次要最大值。这些发现强调了边界条件和初始态几何在控制有限分子系统中的量子输运中的重要性。", "authors": [{"name": "D. Chevizovich"}, {"name": "V. Matic"}, {"name": "Z. Przulj"}, {"name": "S. Galovic"}], "featured_authors": [{"name": "D. Chevizovich"}, {"name": "V. Matic"}, {"name": "Z. Przulj"}, {"name": "S. Galovic"}], "author_count": 4}, {"id": "2608.02155", "category": "cond-mat", "title": "Band topology and symmetry-driven magneto-optical response in two-dimensional d-wave altermagnets with staggered spin-orbit coupling", "abstract": "Altermagnets combine compensated collinear magnetic order with momentum-dependent spin splitting, providing a route to transverse electronic and optical responses without a net ferromagnetic moment. We develop a strictly periodic four-band tight-binding model for a two-dimensional d-wave altermagnet and distinguish the roles of three spin orbit coupling (SOC) channels: uniform Rashba SOC, a sublattice-staggered Rashba interaction, and bond-staggered SOC. In the absence of SOC, the d-wave kinetic anisotropy produces spin-polarized Dirac points on orthogonal Brillouin-zone boundaries, related by the altermagnetic fourfold spin-group symmetry. Uniform Rashba SOC mixes the spin sectors and shifts these nodes but preserves the antiunitary symmetry that forbids an integrated Hall response. The sublattice-staggered Rashba term breaks this symmetry and activates transverse optical response, whereas the bond-staggered SOC provides the mass that gaps the boundary nodes. Their combined action generates strong Berry-curvature hot spots and, within a narrow parameter window, an isolated lower two-band manifold with Chern number C=-2. For the representative parameters considered here it is possible to stabilize a Chern insulator phase. Using covariant-velocity Kubo calculations, we show that large optical Hall conductivity and circular dichroism extend well beyond the nonzero-Chern region and are controlled by SOC-induced avoided crossings and symmetry breaking. We further find that carrier doping strongly modifies the resonant and dc Hall responses through Pauli blocking and the occupation of Berry-curvature hot spots, enabling gate-controlled sign reversals. These results identify the complementary roles of distinct interfacial SOC mechanisms in producing topology and tunable magneto-optical activity in compensated two-dimensional magnets.", "url": "https://arxiv.org/abs/2608.02155", "type": "理论+数值", "summary": "交变磁体将补偿共线磁序与动量相关的自旋分裂相结合，提供了一种在没有净铁磁矩的情况下横向电子和光学响应的​​途径。我们为二维 d 波交替磁体开发了严格周期性的四能带紧束缚模型，并区分了三个自旋轨道耦合 (SOC) 通道的作用：均匀 Rashba SOC、亚晶格交错 Rashba 相互作用和键交错 SOC。在没有 SOC 的情况下，d 波动力学各向异性在正交布里渊区边界上产生自旋极化狄拉克点，与交磁四重自旋群对称性相关。均匀 Rashba SOC 混合自旋扇区并移动这些节点，但保留了禁止集成霍尔响应的反酉对称性。亚晶格交错的 Rashba 项打破了这种对称性并激活横向光学响应，而键交错的 SOC 提供了使边界节点间隙的质量。它们的组合作用会产生强烈的贝里曲率热点，并在狭窄的参数窗口内产生陈数 C=-2 的孤立的下两带流形。\n\n对于这里考虑的代表性参数，可以稳定陈绝缘体相。使用协变速度 Kubo 计算，我们表明大光学霍尔电导率和圆二色性远远超出非零陈区域，并受到 SOC 引起的避免交叉和对称性破缺的控制。我们进一步发现，载流子掺杂通过泡利阻塞和贝里曲率热点的占据强烈改变了谐振和直流霍尔响应，从而实现了栅极控制的符号反转。这些结果确定了不同界面 SOC 机制在补偿二维磁体中产生拓扑和可调谐磁光活动方面的互补作用。", "authors": [{"name": "Meysam Bagheri Tagani Carmine Autieri"}, {"name": "Wojciech Brzezicki"}], "featured_authors": [{"name": "Meysam Bagheri Tagani Carmine Autieri"}, {"name": "Wojciech Brzezicki"}], "author_count": 2}, {"id": "2608.02156", "category": "cond-mat", "title": "Inhomogeneous Ising Model on 2D kagomé Lattice: Fermionic field approach", "abstract": "We investigate the two-dimensional inhomogeneous Ising model (2DIM) on the kagom'e lattice by mapping it onto a particular non-symmetric eight-vertex model and constructing the corresponding $R$-matrix. Using a fermionic representation, we evaluate the partition function and derive explicit expressions for the main thermodynamic quantities. In the thermodynamic limit, we obtain an exact equation for the critical surface determining the phase transition of the model. We also calculate the free energy, specific heat, and spontaneous magnetization in the ferromagnetic case. Furthermore, we show that when one or two coupling constants vanish, the model reduces, respectively, to the square-lattice and one-dimensional Ising models. In both limits, our results reproduce the corresponding exact critical couplings and free energies.", "url": "https://arxiv.org/abs/2608.02156", "type": "理论+数值", "summary": "我们通过将 Kagom'e 晶格上的二维非齐次伊辛模型 (2DIM) 映射到特定的非对称八顶点模型并构造相应的 $R$ 矩阵来研究它。使用费米子表示，我们评估配分函数并导出主要热力学量的显式表达式。在热力学极限下，我们获得了确定模型相变的临界表面的精确方程。我们还计算了铁磁情况下的自由能、比热和自发磁化强度。此外，我们表明，当一个或两个耦合常数消失时，模型分别简化为方晶格模型和一维伊辛模型。在这两个限制下，我们的结果再现了相应的精确临界耦合和自由能。", "authors": [{"name": "Shahane A. Khachatryan"}, {"name": "Zhidong Zhang"}, {"name": "Ara G. Sedrakyan"}], "featured_authors": [{"name": "Shahane A. Khachatryan"}, {"name": "Zhidong Zhang"}, {"name": "Ara G. Sedrakyan"}], "author_count": 3}, {"id": "2608.02211", "category": "cond-mat", "title": "Front Selection Is Not Determined by Renormalization-Group Stability", "abstract": "The Fisher--Kolmogorov--Petrovsky--Piskunov equation provides a paradigmatic example of front propagation and asymptotic-state selection. Using a unified renormalization-group (RG) framework, we show that its traveling-wave solutions form a continuous family of RG fixed points and that all fronts with $v \\ge 2$ are RG-stable. Nevertheless, the asymptotically selected front is not determined by RG stability. The FKPP equation therefore provides an explicit example in which RG fixed-point stability and asymptotic-state selection are distinct concepts.", "url": "https://arxiv.org/abs/2608.02211", "type": "理论", "summary": "Fisher--Kolmogorov--Petrovsky--Piskunov 方程提供了前沿传播和渐近状态选择的典型示例。使用统一的重正化群（RG）框架，我们证明其行波解形成了一个连续的 RG 不动点族，并且所有具有 $v \\ge 2$ 的前沿都是 RG 稳定的。然而，渐近选择的前沿并不由 RG 稳定性决定。因此，FKPP 方程提供了一个明确的示例，其中 RG 定点稳定性和渐近状态选择是不同的概念。", "authors": [{"name": "Ko Okumura"}], "featured_authors": [{"name": "Ko Okumura"}], "author_count": 1}, {"id": "2608.02241", "category": "cond-mat", "title": "Proximity effects of chiral magnetization on transition metal dichalcogenides monolayers", "abstract": "We consider the proximity effects of a commensurate chiral $120^{\\circ}$ Néel magnetic structure on the transport and optical properties of a transition metal dichalcogenide monolayer (TMD ML). The enlarged magnetic unit cell leads to the folding of the Brillouin zone and enables efficient intervalley spin-flip scattering. Starting from a six band tight binding model, we develop an effective $k\\cdot p$ model, which describes the coupling between charge carriers in the TMD ML and the chiral magnetization. We predict the anomalous antiferromagnetic Hall effect (AHE) for conduction electrons and describe it accounting for the interplay between anomalous velocity, side jump, and skew scattering contributions. The proximity of the chiral magnetization also leads to the mixing and splitting of the exciton resonances in the two valleys which are related by the time reversal symmetry despite zero net magnetization. Finally, we demonstrate the possibility to measure the distribution of in-plane orientation of the chiral magnetization through Faraday rotation and the ellipticity of incident linearly polarized light.", "url": "https://arxiv.org/abs/2608.02241", "type": "理论", "summary": "我们考虑相应的手性 $120^{\\circ}$ Néel 磁结构对过渡金属二硫族化物单层 (TMD ML) 的传输和光学性质的邻近效应。扩大的磁性晶胞导致布里渊区折叠，并实现有效的层间自旋翻转散射。从六能带紧密结合模型开始，我们开发了一个有效的 $k\\cdot p$ 模型，该模型描述了 TMD ML 中的电荷载流子与手性磁化强度之间的耦合。我们预测了传导电子的异常反铁磁霍尔效应（AHE），并描述了它解释了异常速度、侧跳和偏斜散射贡献之间的相互作用。手性磁化强度的接近还导致两个谷中激子共振的混合和分裂，尽管净磁化强度为零，但它们通过时间反转对称性相关。最后，我们证明了通过法拉第旋转和入射线偏振光的椭圆率测量手性磁化强度面内方向分布的可能性。", "authors": [{"name": "Vladimir N. Mantsevich"}, {"name": "Igor S. Krivenko"}, {"name": "Dmitry S. Smirnov"}], "featured_authors": [{"name": "Vladimir N. Mantsevich"}, {"name": "Igor S. Krivenko"}, {"name": "Dmitry S. Smirnov"}], "author_count": 3}, {"id": "2608.02260", "category": "cond-mat", "title": "Valley-controlled chiral magnetism in transition metal dichalcogenide monolayers", "abstract": "We put forward the Ruderman-Kittel-Kasuya-Yosida (RKKY) interaction in transition metal dichalcogenide monolayers as a tool to create and control a chiral magnetic texture. We show that in the spin-valley locking regime, the RKKY interaction acts as a Dzyaloshinskii-Moriya coupling with an effective spin rotation period exactly equal to the tripled lattice constant. Using mean field theory and classical Monte Carlo simulations, we demonstrate that this interaction qualitatively reshapes the phase diagram of atomically thin antiferromagnets. It destroys the chirality-related phase transition by selecting a single chirality value even when the RKKY interaction is small. At the same time, it shifts the Berezinskii-Kosterlitz-Thouless transition associated with spins orientation to higher temperatures. We argue that the valley degree of freedom of electrons mediating the RKKY interaction provides a powerful control knob for exploring non-universal phase transitions and quantum spin liquid states in two-dimensional van der Waals heterostructures.", "url": "https://arxiv.org/abs/2608.02260", "type": "理论+数值", "summary": "We put forward the Ruderman-Kittel-Kasuya-Yosida (RKKY) interaction in transition metal dichalcogenide monolayers as a tool to create and control a chiral magnetic texture.我们证明，在自旋谷锁定状态下，RKKY 相互作用充当 Dzyaloshinskii-Moriya 耦合，其有效自旋旋转周期恰好等于三倍晶格常数。使用平均场理论和经典蒙特卡罗模拟，我们证明这种相互作用定性地重塑了原子薄反铁磁体的相图。即使 RKKY 相互作用很小，它也会通过选择单个手性值​​来破坏与手性相关的相变。同时，它将与自旋方向相关的别列津斯基-科斯特利茨-托利斯转变转移到更高的温度。我们认为介导 RKKY 相互作用的电子谷自由度为探索二维范德华异质结构中的非通用相变和量子自旋液态提供了强大的控制旋钮。", "authors": [{"name": "Igor S. Krivenko"}, {"name": "Vladimir N. Mantsevich"}, {"name": "Dmitry S. Smirnov"}], "featured_authors": [{"name": "Igor S. Krivenko"}, {"name": "Vladimir N. Mantsevich"}, {"name": "Dmitry S. Smirnov"}], "author_count": 3}, {"id": "2608.02261", "category": "cond-mat", "title": "Pressure-Driven Evolution of Electronic and Magnetic Correlations in Bilayer Nickelate La3Ni2O7", "abstract": "The recent discovery of high-temperature superconductivity in pressurized bilayer La3Ni2O7 has sparked intense research interest, yet the microscopic mechanism governing its pressure-dependent superconducting transition temperature (Tc) remains elusive. In this work, we investigate the electronic and magnetic correlations of La3Ni2O7 under high pressure using a combination of density-functional theory (DFT), constrained random phase approximation (cRPA), and dynamical mean-field theory (DMFT). We find that while hydrostatic pressure enhances the interlayer hopping and the bare superexchange energy scale (4t2/U), it simultaneously drives the system toward a more itinerant regime by reducing the relative correlation strength (U/W). Crucially, our results reveal a distinct orbital-selective evolution: the Ni dx2-y2 states become increasingly itinerant, whereas the Ni dz2 orbitals retain a more localized character. This pressure-induced itinerancy significantly enhances the hybridization between the two, leading to a dramatic amplification of the Kondo-like screening of the local dz2 moments by the itinerant dx2-y2 electrons. Consequently, the effective magnetic exchange coupling (Jeff), which serves as the pairing glue, is suppressed in the high-pressure regime. Our findings suggest that the monotonic decrease of Tc at high pressures is driven by the dominance of Kondo screening over superexchange interactions, providing a coherent microscopic explanation for the dome-shaped superconducting phase diagram in La3Ni2O7.", "url": "https://arxiv.org/abs/2608.02261", "type": "理论+数值", "summary": "最近在加压双层 La3Ni2O7 中发现高温超导性引起了人们强烈的研究兴趣，但控制其压力依赖性超导转变温度 (Tc) 的微观机制仍然难以捉摸。在这项工作中，我们结合密度泛函理论 (DFT)、约束随机相位近似 (cRPA) 和动态平均场理论 (DMFT) 研究高压下 La3Ni2O7 的电子和磁相关性。我们发现，虽然静水压力增强了层间跳跃和裸超交换能量规模（4t2/U），但它同时通过降低相对相关强度（U/W）来驱动系统走向更流动的状态。至关重要的是，我们的结果揭示了一种独特的轨道选择性演化：Ni dx2-y2 态变得越来越流动，而 Ni dz2 轨道保留了更局域化的特征。这种压力引起的巡回显着增强了两者之间的杂交，从而导致巡回 dx2-y2 电子对局部 dz2 矩的类似近藤屏蔽的显着放大。\n\n因此，作为配对粘合剂的有效磁交换耦合（Jeff）在高压状态下受到抑制。我们的研究结果表明，高压下 Tc 的单调下降是由近藤屏蔽对超交换相互作用的主导地位驱动的，这为 La3Ni2O7 中的圆顶形超导相图提供了连贯的微观解释。", "authors": [{"name": "Jian Zhou"}, {"name": "Rui Song"}, {"name": "Haiyan Lu"}], "featured_authors": [{"name": "Jian Zhou"}, {"name": "Rui Song"}, {"name": "Haiyan Lu"}], "author_count": 3}, {"id": "2608.02297", "category": "cond-mat", "title": "Quantum resetting with memory", "abstract": "We introduce a quantum stochastic resetting protocol with uniform memory, in which each resetting event returns the system to a state visited at a time chosen uniformly from its entire history. The resulting dynamics is nonunitary, non-Markovian and a direct quantum generalization of the classical preferential relocation model. Working in the energy eigenbasis, we derive the exact evolution of every density-matrix element for an arbitrary time-independent Hamiltonian and show that the Hamiltonian enters the dynamics only through the corresponding Bohr frequencies. This leads to a natural distinction between two classes of quantum systems: gapped and gapless. In \\emph{gapped systems} (systems with a discrete energy spectrum), while the diagonal elements remain unchanged, the off-diagonal elements of the density matrix in the energy eigenbasis decay algebraically with a continuously varying exponent and with an amplitude that oscillates periodically in $\\log t$. The system therefore approaches a stationary state that is independent of the resetting rate and retains a strong memory of the initial state. In \\emph{gapless systems} (systems with a continuous energy spectrum), arbitrarily small Bohr frequencies prevent stationarity. Instead, the position distribution spreads on the universal (ultra-slow) scale $\\log(rt)/r$, independently of the initial state and of the details of the Hamiltonian. We illustrate these results with a two-level system, a harmonic oscillator, and a free quantum particle, and contrast them with their classical counterparts.", "url": "https://arxiv.org/abs/2608.02297", "type": "理论", "summary": "我们引入了一种具有统一内存的量子随机重置协议，其中每个重置事件都将系统返回到从其整个历史中统一选择的时间访问的状态。由此产生的动力学是非酉的、非马尔可夫的，并且是经典优先重定位模型的直接量子推广。在能量本征基下，我们推导了任意时间无关的哈密顿量的每个密度矩阵元素的精确演化，并表明哈密顿量仅通过相应的玻尔频率进入动力学。这导致了两类量子系统之间的自然区别：有隙和无隙。在\\emph{间隙系统}（具有离散能谱的系统）中，虽然对角线元素保持不变，但能量本征基中密度矩阵的非对角线元素以连续变化的指数和以$\\log t$周期性振荡的幅度进行代数衰减。因此，系统接近与重置速率无关的静止状态，并保留对初始状态的强大记忆。\n\n在 \\emph{无间隙系统}（具有连续能谱的系统）中，任意小的玻尔频率会妨碍平稳性。相反，位置分布在通用（超慢）尺度 $\\log(rt)/r$ 上传播，与初始状态和哈密顿量的细节无关。我们用两能级系统、谐振子和自由量子粒子来说明这些结果，并将它们与经典对应物进行对比。", "authors": [{"name": "Gabriele de Mauro"}, {"name": "Manas Kulkarni"}, {"name": "Satya N. Majumdar"}], "featured_authors": [{"name": "Gabriele de Mauro"}, {"name": "Manas Kulkarni"}, {"name": "Satya N. Majumdar"}], "author_count": 3}, {"id": "2608.02298", "category": "cond-mat", "title": "Long and short time linear response of metals: a geometric approach", "abstract": "The time-dependent quantum geometric tensor, which captures dipole fluctuations of bound electrons, is essential for understanding the electronic properties of insulators, superconductors, and flat bands. It is often considered subleading for low-energy descriptions of metals that are dominated by intra-band processes. Here, we revisit this perspective and highlight scenarios where the quantum geometry of the wavefunctions close to the Fermi surface plays a significant role. We compute the time-dependent quantum geometric tensor for metals, explain its divergence, and contrast it against singular geometric tensors of Dirac and Weyl semi-metals. We identify the ratio of Drude to total spectral weight, $D/\\mathcal{S}_1$, as a lattice-scale probe of bound versus itinerant charge, and quantify it in the kagome metal, where the two van Hove fillings respond differently despite identical Fermi surfaces.", "url": "https://arxiv.org/abs/2608.02298", "type": "理论+数值", "summary": "与时间相关的量子几何张量可以捕获束缚电子的偶极子涨落，对于理解绝缘体、超导体和平带的电子特性至关重要。它通常被认为是对以带内过程为主的金属的低能量描述的辅助。在这里，我们重新审视这个观点，并重点介绍靠近费米表面的波函数的量子几何发挥重要作用的场景。我们计算金属的时间相关量子几何张量，解释其散度，并将其与狄拉克和韦尔半金属的奇异几何张量进行对比。我们将 Drude 与总光谱权重的比率 $D/\\mathcal{S}_1$ 确定为束缚电荷与流动电荷的晶格尺度探针，并在 kagome 金属中对其进行量化，其中尽管费米表面相同，但两种范霍夫填充物的响应不同。", "authors": [{"name": "Nishchhal Verma"}, {"name": "Raquel Queiroz"}], "featured_authors": [{"name": "Nishchhal Verma"}, {"name": "Raquel Queiroz"}], "author_count": 2}, {"id": "2608.02301", "category": "cond-mat", "title": "Equilibrium gigahertz acoustics reveals long-range confinement in liquids", "abstract": "Understanding how the mechanical properties of liquids confined within nanometer-scale gaps differ from bulk behavior is central to biophysics, lubrication, catalysis, electrochemistry, and surface science. Yet the characterization of ultrathin confined liquids remains challenging, as many existing approaches rely on destructive or intrusive contact-based techniques, mostly measuring the liquid flow in the low frequency regime. Here, we present a non-invasive, all-optical technique based on ultrafast laser ultrasonics that probes confined liquids at equilibrium in the gigahertz frequency range. The method measures the phase and amplitude of time-domain Brillouin scattering signals transmitted through liquid layers whose thickness is varied step by step with subnanometer effective sampling. Supported by numerical modeling of acoustic propagation and optical detection, these signals allow us to extract the thickness-dependent acoustic velocity and attenuation of confined liquids. We show that nanometric confinement modifies the GHz acoustic response of glycerol, the liquid crystal 8CB, and a butyl-based ionic liquid over unexpectedly long spatial scales. These effects extend from a few nanometers to several tens of nanometers and reveal bound interfacial layers, acoustic stiffening, and enhanced solid-like behavior under confinement. Our results open a route to probing liquid confinement in a scarcely explored regime: dynamically measured at gigahertz frequencies, yet sufficiently weakly perturbative to preserve the equilibrium confined state.", "url": "https://arxiv.org/abs/2608.02301", "type": "理论+数值", "summary": "了解限制在纳米级间隙内的液体的机械特性与整体行为有何不同，是生物物理学、润滑、催化、电化学和表面科学的核心。然而，超薄受限液体的表征仍然具有挑战性，因为许多现有方法依赖于破坏性或侵入性接触技术，主要测量低频状态下的液体流动。在这里，我们提出了一种基于超快激光超声波的非侵入性全光学技术，可在千兆赫频率范围内探测处于平衡状态的受限液体。该方法采用亚纳米级有效采样，测量通过厚度逐步变化的液层传输的时域布里渊散射信号的相位和幅度。在声学传播和光学检测数值模型的支持下，这些信号使我们能够提取与厚度相关的声速和受限液体的衰减。我们表明，纳米约束在意想不到的长空间尺度上改变了甘油、液晶 8CB 和丁基离子液体的 GHz 声响应。\n\n这些效应从几纳米延伸到几十纳米，并揭示了约束界面层、声学硬化和约束下增强的类固体行为。我们的结果开辟了一条在几乎没有探索过的范围内探测液体限制的途径：在千兆赫频率下动态测量，但扰动足够弱以保持平衡限制状态。", "authors": [{"name": "Ievgeniia Chaban"}, {"name": "Thomas Pezeril"}], "featured_authors": [{"name": "Ievgeniia Chaban"}, {"name": "Thomas Pezeril"}], "author_count": 2}, {"id": "2608.02313", "category": "cond-mat", "title": "Colloidal Systems", "abstract": "This book has one primary goal: To get you moving quickly from learning basic principles of colloid science, to designing colloidal systems for function or motion in the lab. It is not intended to provide encyclopedic knowledge about all aspects of colloid and surface science; rather, I have chosen not to include many topics of genuine importance. In reaching the intended goal, I use two parallel strategies. First, I give practical results that can be used immediately. If there is a cumbersome calculation, I have worked to reframe it into a table or figure. This is the case for Hamaker constants and hydrodynamics of spheroids, for instance. Second, I describe the physics of various colloidal phenomena, so that you as a researcher can think about alternative strategies. In balancing algorithms with explanations, I provide plug-and-chug example problems to familiarize you with units, constants, and typical values. The practice problems provide extensions to the most basic theory that open new possibilities, while also giving results that are useful in practical and research studies. Throughout the book, I provide data we commonly use for viscosities, zeta potentials, ionic phenomena, and other parameters. Rather than providing every reference and every technique, I have provided those references and techniques that we most often use in our lab. In the end, this book aims not to be an exhaustive study of colloids, but rather to be a doorway to producing desired colloidal systems as quickly as possible.", "url": "https://arxiv.org/abs/2608.02313", "type": "理论+数值", "summary": "本书有一个主要目标：让您快速从学习胶体科学的基本原理过渡到在实验室中设计用于功能或运动的胶体系统。它并非旨在提供有关胶体和表面科学各个方面的百科全书式知识；相反，我选择不包含许多真正重要的主题。为了达到预期目标，我使用了两种并行策略。首先，我给出可以立即使用的实际结果。如果有繁琐的计算，我会努力将其重新组织成表格或图表。例如，哈梅克常数和球体流体动力学就是这种情况。其次，我描述了各种胶体现象的物理原理，以便您作为研究人员可以思考替代策略。在平衡算法与解释时，我提供了即插即用的示例问题，以帮助您熟悉单位、常数和典型值。实践问题为最基本的理论提供了扩展，开辟了新的可能性，同时也给出了在实践和研究中有用的结果。\n\n在整本书中，我提供了我们常用的粘度、zeta 电位、离子现象和其他参数的数据。我没有提供所有参考资料和每种技术，而是提供了我们实验室中最常使用的那些参考资料和技术。最后，本书的目的不是对胶体进行详尽的研究，而是为尽快生产所需的胶体系统提供途径。", "authors": [{"name": "Darrell Velegol"}], "featured_authors": [{"name": "Darrell Velegol"}], "author_count": 1}, {"id": "2608.02342", "category": "cond-mat", "title": "Pressure-induced concurrent amorphization and superconductivity in topological material NbNiTe5", "abstract": "We have systematically studied the structural and electronic properties of a topological material NbNiTe5 under high pressure. The evolution of the normal state resistance shows a non-monotonic trend from 0.7 GPa to 5.1 GPa, in accordance with the second-order transition along the inter-layer direction observed in X-ray diffraction and Raman spectra. At around 10 GPa, the sample starts amorphization, which is concurrent with the emergence of superconductivity. Upon further compression, the structural disorder enhances and the superconducting transition becomes clearer, suggesting that the superconductivity is modulated by the degree of disorder in NbNiTe5 under high pressure. Within 45.7 GPa, the superconducting transition temperature (Tc) slowly rises from 0.6 K at 9.5 GPa to 1.4 K at 45.7 GPa. Our findings extend the family of transition metal chalcogenide superconductors and shed new light on understanding superconductivity in disordered systems.", "url": "https://arxiv.org/abs/2608.02342", "type": "理论", "summary": "我们系统地研究了拓扑材料 NbNiTe5 在高压下的结构和电子特性。根据 X 射线衍射和拉曼光谱中观察到的沿层间方向的二阶跃迁，正常状态电阻的演变呈现出从 0.7 GPa 到 5.1 GPa 的非单调趋势。在 10 GPa 左右，样品开始非晶化，同时出现超导性。进一步压缩后，结构无序性增强，超导转变变得更加清晰，表明超导性是由高压下 NbNiTe5 的无序程度调节的。在45.7 GPa内，超导转变温度（Tc）从9.5 GPa时的0.6 K缓慢上升至45.7 GPa时的1.4 K。我们的研究结果扩展了过渡金属硫族化物超导体家族，并为理解无序系统中的超导性提供了新的线索。", "authors": [{"name": "Lingxiao Zhao"}, {"name": "Yi Zhao"}, {"name": "Bangshuai Zhu"}, {"name": "Qi Wang"}, {"name": "Cuiying Pei"}, {"name": "Juefei Wu"}, {"name": "Jin-Ke Bao"}, {"name": "Wen-He Jiao"}, {"name": "Yanpeng Qi"}], "featured_authors": [{"name": "Lingxiao Zhao"}, {"name": "Yi Zhao"}, {"name": "Bangshuai Zhu"}, {"name": "Jin-Ke Bao"}, {"name": "Wen-He Jiao"}, {"name": "Yanpeng Qi"}], "author_count": 9}, {"id": "2608.02362", "category": "cond-mat", "title": "Superconducting ternary compounds Li-X-B (X=Mo, W) within the mild pressure range: First-principles predictions", "abstract": "Among the superconducting hydrides under high pressure, a number of studies concentrate on the ternary compounds to explore unique superconductors, which are capable of reducing the stable pressure and maintain superconductivity. In this work, to verify our proposed strategy of ternary composition lines (TCLs) to explore ternary compounds, we combined the first-principles calculations and crystal structure predictions to study the ternary compounds Li-X-B (X=Mo, W) under high pressure. After calculations along five and four TCLs in Li-W-B and Li-Mo-B, respectively, five Li-W-B compounds and four Li-Mo-B compounds were predicted. The compositions of LiWB4, Li4MoB2 and LiMo2B2 could be thermodynamically stable under high pressure, and Li2WB6 is around 0.02 eV/atom above the convex hull at 0 GPa, which has potential for synthesizing. Both of the predicted Li2WB6 P6/mmm and Li2WB4 R-3m are superconducting and their Tc are around 11 K, which are similar to the Tc of WB2 P6/mmm around 100 GPa. An anomalous increase of Tc was found in Li4MoB2 C2/m upon compression. We carried out full ternary search (FTS) to evaluate the validity of the TCLs strategy in Li-W-B system at 0 GPa. Our results are helpful for understanding the phase diagram of Li-X-B (X=Mo, W) under high pressure and the introducing of Li atoms provide candidate structures to reduce the measured stable pressure from ~100 GPa in WB2 P6/mmm to 0 GPa. Meanwhile, we preliminary validate the strategy of TCLs in structure predictions and we expect to improve this strategy in the future, shedding light on the studies of ternary compounds.", "url": "https://arxiv.org/abs/2608.02362", "type": "数值", "summary": "在高压超导氢化物中，许多研究集中在三元化合物上，以探索独特的超导体，能够降低稳定压力并保持超导性。在这项工作中，为了验证我们提出的三元成分线（TCL）探索三元化合物的策略，我们结合第一性原理计算和晶体结构预测来研究高压下的三元化合物Li-X-B（X=Mo，W）。分别沿 Li-W-B 和 Li-Mo-B 中的 5 个和 4 个 TCL 进行计算后，预测了 5 种 Li-W-B 化合物和 4 种 Li-Mo-B 化合物。 LiWB4、Li4MoB2和LiMo2B2的组成在高压下具有热力学稳定性，而Li2WB6在0 GPa下比凸包高约0.02 eV/atom，具有合成潜力。预测的Li2WB6 P6/mmm和Li2WB4 R-3m均具有超导性，其Tc约为11 K，与WB2 P6/mmm的Tc约为100 GPa相似。压缩后 Li4MoB2 C2/m 中发现 Tc 异常增加。我们进行了全三元搜索（FTS）来评估 TCL 策略在 0 GPa 的 Li-W-B 系统中的有效性。\n\n我们的结果有助于理解高压下 Li-X-B (X=Mo, W) 的相图，并且 Li 原子的引入提供了候选结构，可将 WB2 P6/mmm 中测得的稳定压力从约 100 GPa 降低到 0 GPa。同时，我们初步验证了TCL在结构预测方面的策略，并期望在未来改进该策略，为三元化合物的研究提供线索。", "authors": [{"name": "Bangshuai Zhu"}, {"name": "Juefei Wu"}, {"name": "Dexi Shao"}, {"name": "Junjie Wang"}, {"name": "Yu Han"}, {"name": "Cuiying Pei"}, {"name": "Qi Wang"}, {"name": "Jian Sun"}, {"name": "Yanpeng Qi"}], "featured_authors": [{"name": "Bangshuai Zhu"}, {"name": "Juefei Wu"}, {"name": "Dexi Shao"}, {"name": "Qi Wang"}, {"name": "Jian Sun"}, {"name": "Yanpeng Qi"}], "author_count": 9}, {"id": "2608.02373", "category": "cond-mat", "title": "Bayesian Inference with Structured Signal: Static Replica Symmetry Breaking on the Nishimori Line in the Planted Spin Glass", "abstract": "A common assumption in theoretical models of Bayesian inference is that the signal has i.i.d. components. To study the effect of correlations in the signal prior, we consider a minimal model: the planted spin glass on random regular graphs, where the signal is sampled from an Ising model with coupling $\\kappa$. Depending on the phase of the prior, we find that adding structure in the signal can either help or hinder inference. In the paramagnetic regime, correlations in the signal lower the reconstruction threshold, so that weaker signal strength is sufficient for recovery. In the ferromagnetic regime, the prior alone already enables partial recovery, and we identify the threshold above which the observations provide additional information. When the prior itself is in a replica symmetry breaking (RSB) phase, we detect a static RSB transition in the posterior under Nishimori conditions. This provides an example where a non-separable, correlated prior leads to static RSB in a Bayes-optimal inference problem. We discuss the consequences of this glassy phase for algorithmic performance, in particular for Belief Propagation.", "url": "https://arxiv.org/abs/2608.02373", "type": "理论+数值", "summary": "贝叶斯推理理论模型中的一个常见假设是信号具有独立同分布。成分。为了研究先验信号中相关性的影响，我们考虑一个最小模型：随机规则图上的种植自旋玻璃，其中信号是从具有耦合 $\\kappa$ 的 Ising 模型中采样的。根据先验的阶段，我们发现在信号中添加结构可以帮助或阻碍推理。在顺磁状态下，信号中的相关性降低了重建阈值，因此较弱的信号强度足以进行恢复。在铁磁状态下，仅先验就已经能够部分恢复，并且我们确定了阈值，高于该阈值的观测结果提供了额外的信息。当先验本身处于复制对称破缺 (RSB) 阶段时，我们在 Nishimori 条件下检测到后验的静态 RSB 转变。这提供了一个示例，其中不可分离的相关先验导致贝叶斯最优推理问题中的静态 RSB。我们讨论这个玻璃阶段对算法性能的影响，特别是对置信传播的影响。", "authors": [{"name": "Andrea Vincenzo Dell'Abate"}, {"name": "Louise Budzynski"}], "featured_authors": [{"name": "Andrea Vincenzo Dell'Abate"}, {"name": "Louise Budzynski"}], "author_count": 2}, {"id": "2608.02384", "category": "cond-mat", "title": "Second-harmonic generation in twisted double bilayer graphene: Double-resonant enhancement from moiré flat bands", "abstract": "We theoretically investigate second-harmonic generation (SHG) in twisted double bilayer graphene (TDBG) with AB--AB and AB--BA stacking configurations using a perturbative approach based on an effective continuum Hamiltonian. We present a systematic analysis of the SHG response as a function of twist angle, vertical bias voltage, Fermi energy, and stacking configuration. We find that the SHG signal is strongly enhanced at small twist angles due to the emergence of moiré flat bands and the associated increase in the joint density of states. Beyond this conventional enhancement mechanism, we demonstrate that the reduced bandwidth enables a pronounced double-resonant process, in which optical transitions at both $\\omega$ and $2\\omega$ are simultaneously satisfied over extended regions of the moiré Brillouin zone. This mechanism leads to a substantial amplification of the SHG response, analogous to the enhancement observed in systems with discrete energy levels, but realised here in a tuneable moiré band structure. Furthermore, we show that the AB--AB and AB--BA configurations exhibit a systematic $\\pi$ phase shift in the SHG response at large bias voltages, reflecting their distinct symmetry and electronic structure. Our results identify double-resonance effects as a generic mechanism for enhancing SHG in moiré systems and provide a unified framework for understanding and controlling nonlinear optical responses in tuneable flat-band materials.", "url": "https://arxiv.org/abs/2608.02384", "type": "理论", "summary": "我们使用基于有效连续哈密顿量的微扰方法从理论上研究了具有 AB--AB 和 AB--BA 堆叠结构的扭曲双双层石墨烯 (TDBG) 中的二次谐波产生 (SHG)。我们对倍频响应作为扭转角、垂直偏压、费米能量和堆叠结构的函数进行了系统分析。我们发现，由于莫尔平带的出现以及相关的联合态密度的增加，SHG 信号在小扭转角处得到强烈增强。除了这种传统的增强机制之外，我们证明了减少的带宽可以实现明显的双谐振过程，其中 $\\omega$ 和 $2\\omega$ 的光学跃迁在莫尔布里渊区的扩展区域上同时得到满足。这种机制导致 SHG 响应大幅放大，类似于在具有离散能级的系统中观察到的增强，但在这里以可调谐莫尔带结构实现。\n\n此外，我们还发现，AB--AB 和 AB--BA 配置在大偏置电压下的 SHG 响应中表现出系统的 $\\pi$ 相移，反映了它们独特的对称性和电子结构。我们的研究结果将双共振效应确定为增强莫尔系统中二次谐波的通用机制，并为理解和控制可调谐平带材料中的非线性光学响应提供了统一的框架。", "authors": [{"name": "Takaaki V. Joya"}, {"name": "Takuto Kawakami"}, {"name": "Mikito Koshino"}], "featured_authors": [{"name": "Takaaki V. Joya"}, {"name": "Takuto Kawakami"}, {"name": "Mikito Koshino"}], "author_count": 3}, {"id": "2608.02393", "category": "cond-mat", "title": "Floquet spin-group framework and its application to light-tailored spin splitting in collinear magnets", "abstract": "Altermagnets combine momentum-dependent spin splitting with vanishing net magnetization, opening new opportunities for spintronics. Recent studies have shown that periodic driving by linearly or circularly polarized light, as well as by multicolor light fields, can control spin splitting in altermagnets and conventional antiferromagnets, and can even generate spin splitting patterns absent in equilibrium. Despite this progress, a unified principle connecting the dynamical symmetry of light to the symmetry of spin-split bands remains lacking, limiting the systematic design of light-induced spin structures. Here, by combining the spin group of crystals with the dynamical group of light, we establish a unified Floquet spin group framework for the study of periodically driven collinear magnets with negligible spin-orbit coupling. This framework systematically determines the allowed parity, momentum dependence, and nodal structure of spin splitting under different driving protocols. Guided by this symmetry classification, we show that odd-parity, even-parity, and mixed-parity spin splittings can be switched within the same material by tailoring the driving field. We further uncover higher-order $h$-wave and $k$-wave spin splittings in three-dimensional systems. Our work establishes a unified symmetry framework for light-controlled spin splitting and provides general principles for engineering nonequilibrium spin-band structures in altermagnets and related magnetic materials.", "url": "https://arxiv.org/abs/2608.02393", "type": "理论", "summary": "交变磁体将动量相关的自旋分裂与消失的净磁化强度结合起来，为自旋电子学带来了新的机遇。最近的研究表明，线性或圆偏振光以及多色光场的周期性驱动可以控制交替磁体和传统反铁磁体中的自旋分裂，甚至可以产生平衡状态下不存在的自旋分裂图案。尽管取得了这些进展，但仍然缺乏将光的动力学对称性与自旋分裂带的对称性联系起来的统一原理，限制了光诱导自旋结构的系统设计。在这里，通过将晶体自旋群与光的动力学群相结合，我们建立了统一的Floquet自旋群框架，用于研究自旋轨道耦合可忽略不计的周期性驱动共线磁体。该框架系统地确定了不同驱动协议下允许的宇称、动量依赖性和自旋分裂的节点结构。在这种对称性分类的指导下，我们证明奇宇称、偶宇称和混合宇称自旋分裂可以通过定制驱动场在同一材料内切换。\n\n我们进一步揭示了三维系统中的高阶 $h$ 波和 $k$ 波自旋分裂。我们的工作为光控自旋分裂建立了统一的对称框架，并为交流磁体和相关磁性材料中的非平衡自旋带结构的工程提供了一般原理。", "authors": [{"name": "Tongshuai Zhu"}, {"name": "Zixuan Li"}, {"name": "Huaiqiang Wang"}, {"name": "Su-Huai Wei"}, {"name": "Jiawei Ruan"}], "featured_authors": [{"name": "Tongshuai Zhu"}, {"name": "Zixuan Li"}, {"name": "Huaiqiang Wang"}, {"name": "Su-Huai Wei"}, {"name": "Jiawei Ruan"}], "author_count": 5}, {"id": "2608.02426", "category": "cond-mat", "title": "Screening phonon-mediated superconductors from static orbital Hamiltonians", "abstract": "The first-principles search for superconductors is severely limited by the high cost of electron-phonon coupling (EPC) calculations. Here we develop a low-cost, physically transparent framework that identifies strong-EPC materials directly from static orbital-based Hamiltonians without explicit phonon perturbation calculations. Verification using density functional perturbation theory (DFPT) for representative superconductors shows that the framework captures semi-quantitatively the EPC scale at substantially lower computational cost. Applied to more than 36,000 compounds in the MattKeyBond database, it identifies 34 dynamically stable superconducting candidates with calculated $T_c > 10$ K after DFPT verification. These candidates reveal two distinct routes to relatively high-$T_c$ superconductivity: a metallized covalent $\\sigma$-bond route that is more favorable for achieving high-$T_c$ superconductors, and a Fermi-level density-of-states accumulation route that can enhance $T_c$ but usually to a more limited extent.", "url": "https://arxiv.org/abs/2608.02426", "type": "理论+数值", "summary": "电子声子耦合（EPC）计算的高成本严重限制了超导体的第一性原理研究。在这里，我们开发了一种低成本、物理透明的框架，可以直接从基于静态轨道的哈密顿量识别强 EPC 材料，而无需明确的声子扰动计算。使用密度泛函微扰理论 (DFPT) 对代表性超导体进行验证表明，该框架以低得多的计算成本半定量地捕获了 EPC 尺度。应用于 MattKeyBond 数据库中的 36,000 多种化合物，它识别出 34 种动态稳定的超导候选化合物，在 DFPT 验证后计算出 $T_c > 10$ K。这些候选者揭示了实现相对高$T_c$超导性的两种不同途径：金属化共价$\\sigma$键途径更有利于实现高$T_c$超导体，以及费米能级态密度积累途径，可以增强$T_c$，但通常程度更有限。", "authors": [{"name": "Jian-Feng Zhang"}, {"name": "Ze-Feng Gao"}, {"name": "Xiao-Qi Han"}, {"name": "Dingshun Lv"}, {"name": "Miao Gao"}, {"name": "Kai Liu"}, {"name": "Xinguo Ren"}, {"name": "Zhong-Yi Lu"}, {"name": "Tao Xiang"}], "featured_authors": [{"name": "Jian-Feng Zhang"}, {"name": "Ze-Feng Gao"}, {"name": "Xiao-Qi Han"}, {"name": "Xinguo Ren"}, {"name": "Zhong-Yi Lu"}, {"name": "Tao Xiang"}], "author_count": 9}, {"id": "2608.02456", "category": "cond-mat", "title": "Real-time dynamics of the two-step charge-density-wave transition in bulk 1T-TaS$_2$", "abstract": "The charge-density wave (CDW) of bulk 1T-TaS2 is built from Star-of-David (SoD) clusters tiling a sqrt{13} x sqrt{13} superlattice, and it melts through a two-step sequence accompanied by order-of-magnitude changes in resistivity. Whether these steps proceed by collapse of the SoD amplitude or by rearrangement of the SoD lattice has remained unresolved, because the relevant dynamics occur on length and time scales beyond the reach of ab initio molecular dynamics. Here we follow the CDW transitions in real time using a machine-learning force field trained on first-principles data, giving access to 1404-atom supercells over 5 ns. The two steps are mechanistically distinct. Above 200 K, SoD clusters translate coherently by transiently dissolving and re-forming about shifted centers, a deformation-formation process that preserves the local SoD amplitude while randomizing the interlayer stacking order and nucleating domain walls. Only near 350 K does the SoD distortion itself collapse. These results provide microscopic support for the recently proposed two-step model of the CDW transition and offer a framework for interpreting light-induced hidden phases and cavity-modified transition temperatures in 1T-TaS2.", "url": "https://arxiv.org/abs/2608.02456", "type": "理论+数值", "summary": "大块 1T-TaS2 的电荷密度波 (CDW) 由大卫星 (SoD) 簇构成 sqrt{13} x sqrt{13} 超晶格，并通过两步序列熔化，并伴随着电阻率的数量级变化。这些步骤是通过 SoD 振幅的崩溃还是通过 SoD 晶格的重排进行仍然悬而未决，因为相关动力学发生的长度和时间尺度超出了从头算分子动力学的范围。在这里，我们使用根据第一原理数据训练的机器学习力场实时跟踪 CDW 转变，从而可以在 5 ns 内访问 1404 个原子的超级单元。这两个步骤在机制上是不同的。在 200 K 以上，SoD 簇通过瞬态溶解和围绕移位中心重新形成而一致平移，这是一种变形形成过程，可保留局部 SoD 振幅，同时随机化层间堆叠顺序和成核畴壁。只有在接近 350 K 时，SoD 畸变本身才会崩溃。\n\n这些结果为最近提出的 CDW 转变的两步模型提供了微观支持，并提供了解释 1T-TaS2 中光诱导隐藏相和腔修改转变温度的框架。", "authors": [{"name": "Daeheon Kim"}, {"name": "Jinseok Oh"}, {"name": "Kahyeon Koh"}, {"name": "Yejun Cho"}, {"name": "Angel Rubio"}, {"name": "Noejung Park"}, {"name": "Dongbin Shin"}], "featured_authors": [{"name": "Daeheon Kim"}, {"name": "Jinseok Oh"}, {"name": "Kahyeon Koh"}, {"name": "Angel Rubio"}, {"name": "Noejung Park"}, {"name": "Dongbin Shin"}], "author_count": 7}, {"id": "2608.02511", "category": "cond-mat", "title": "Comparison of Lindblad and circuit approaches for quantum heat transport", "abstract": "We compare two popular models applicable to analyzing heat transport by thermal microwave photons in quantum circuits. The first model is derived from a weak-coupling Lindblad master equation, with transition rates determined by Fermi's golden rule induced by thermal dissipation sources. The second approach employs a circuit model, where thermal Johnson-Nyquist noise generated by dissipative elements introduces currents, and consequently Joule power, in other parts of the circuit. This leads to a Landauer type expression of heat transport where the transmission coefficient is proportional to the transconductance in the circuit. We find that the two models yield identical results in a linear circuit in the weak coupling limit with an analytic expression of power in an archetypal circuit of a cavity mediating heat between two baths. Our analysis yields a quantitative assessment of the range of validity of the weak coupling assumption in a circuit. Due to the correspondence of the two results, we feel confident in applying the weak coupling Lindblad model also for analyzing heat transport in quantum circuits consisting, e.g. of qubits and/or non-linear resonators.", "url": "https://arxiv.org/abs/2608.02511", "type": "理论", "summary": "我们比较了两种适用于分析量子电路中热微波光子热传输的流行模型。第一个模型源自弱耦合 Lindblad 主方程，其转变率由热耗散源引起的费米黄金法则确定。第二种方法采用电路模型，其中耗散元件产生的热约翰逊-奈奎斯特噪声会在电路的其他部分引入电流，从而引入焦耳功率。这导致热传输的兰道尔型表达式，其中传输系数与电路中的跨导成正比。我们发现，这两个模型在弱耦合极限下的线性电路中产生相同的结果，并在两个浴之间调节热量的空腔原型电路中使用功率解析表达式。我们的分析对电路中弱耦合假设的有效性范围进行了定量评估。由于这两个结果的对应性，我们有信心应用弱耦合 Lindblad 模型来分析量子电路中的热传输，例如量子位和/或非线性谐振器。", "authors": [{"name": "Bayan Karimi"}], "featured_authors": [{"name": "Bayan Karimi"}], "author_count": 1}, {"id": "2608.02513", "category": "cond-mat", "title": "Strain engineering of transient exciton diffusion in WSe2 monolayers at cryogenic temperatures", "abstract": "Tungsten-based transition metal dichalcogenides exhibit dark excitons as the energetically lowest states. These are crucial for exciton thermalization and propagation and they dominate low-temperature photoluminescence via the emergence of pronounced phonon sidebands. After a resonant excitation, highly mobile hot dark excitons are formed, which quickly thermalize into an equilibrium distribution. The application of strain modifies the exciton energy landscape and, in particular, the relative energy separation between bright and dark exciton states. The impact of strain on the transient photoluminescence and diffusion of non-equilibrium excitons has remained largely unexplored so far. In this work, we investigate the spatiotemporal exciton dynamics in strained hBN-encapsulated WSe2 monolayers at cryogenic temperatures. We demonstrate that tensile strain abruptly increases the excess energy of hot excitons, thereby accelerating their transient diffusion. We trace this back to suppressed phonon-mediated scattering from bright to dark excitons. Furthermore, we predict a periodic modulation of the transient exciton diffusion in the presence of a compressive strain resulting from strain-driven emission of M phonons. The gained microscopic insights illustrate how strain can be used to engineer transient photoluminescence and exciton diffusion in technologically promising 2D semiconductors.", "url": "https://arxiv.org/abs/2608.02513", "type": "理论", "summary": "钨基过渡金属二硫属化物表现出暗激子作为能量最低状态。这些对于激子热化和传播至关重要，并且它们通过明显声子边带的出现主导低温光致发光。共振激发后，形成高度移动的热暗激子，其快速热化至平衡分布。应变的应用改变了激子能量景观，特别是亮激子态和暗激子态之间的相对能量分离。迄今为止，应变对瞬态光致发光和非平衡激子扩散的影响在很大程度上仍未得到探索。在这项工作中，我们研究了低温下应变 hBN 封装的 WSe2 单层的时空激子动力学。我们证明，拉伸应变突然增加了热激子的过剩能量，从而加速了它们的瞬态扩散。我们将其追溯到从亮激子到暗激子的受抑制的声子介导的散射。\n\n此外，我们预测在存在由应变驱动的 M 声子发射引起的压缩应变的情况下瞬态激子扩散的周期性调制。获得的微观见解说明了如何利用应变来设计技术上有前途的二维半导体中的瞬态光致发光和激子扩散。", "authors": [{"name": "Roberto Rosati"}, {"name": "Mohammed Adel Aly Nouh"}, {"name": "Robert Schmidt"}, {"name": "Rudolf Bratschitsch"}, {"name": "Ermin Malic"}], "featured_authors": [{"name": "Roberto Rosati"}, {"name": "Mohammed Adel Aly Nouh"}, {"name": "Robert Schmidt"}, {"name": "Rudolf Bratschitsch"}, {"name": "Ermin Malic"}], "author_count": 5}, {"id": "2608.02524", "category": "cond-mat", "title": "Gradient expansion approximation of the inhomogeneous electron-gas revisited: Higher-order corrections", "abstract": "In our recently published work (our Ref. 1) we revisited the gradient expansion approximation (GEA) of the interacting electron gas, and recalculated the leading-order contribution$-$with respect to the Wigner-Seitz radius $r_s$$-$to the coefficient $B_{xc}[n]$ of the square of the gradient of the electron density in the high-density and slowly varying limits. That work resolved historical controversies regarding these coefficients and demonstrated that serious misconceptions have led to incorrect constraints being imposed on popular functionals within the generalized gradient approximation (GGA). In the present paper, we extend this calculation to obtain the coefficient of the next-to-leading term, which scales as $r_s \\ln(r_s)$ relative to the leading order. First, we establish a systematic framework to evaluate the integral expressions for the $b_{xc}$ coefficient of the leading term ($\\sim q^2$) of the density-density response function in the long-wavelength limit ($q \\to 0$)$-$a prerequisite for computing $B_{xc}[n]$. The significance of the calculation stems from the proof that the coefficient of this $r_s \\ln(r_s)$ term receives no corrections from higher-order diagrammatic expressions. Consequently, our derived value serves as an exact, definitive constraint for future GGA functional development; in the high-density slowly-varying limit, any valid functional must reproduce the exact constraints established in both our previous work and the present paper.", "url": "https://arxiv.org/abs/2608.02524", "type": "理论+数值", "summary": "在我们最近发表的工作（参考文献 1）中，我们重新审视了相互作用电子气的梯度展开近似（GEA），并重新计算了相对于维格纳-塞茨半径 $r_s$$-$ 到高密度和缓慢变化极限下电子密度梯度平方的系数 $B_{xc}[n]$ 的前导贡献$-$。这项工作解决了有关这些系数的历史争议，并证明了严重的误解导致对广义梯度近似 (GGA) 中的流行泛函施加了不正确的约束。在本文中，我们扩展此计算以获得下一个前导项的系数，该系数相对于前导项按 $r_s \\ln(r_s)$ 缩放。首先，我们建立了一个系统框架来评估长波长极限（$q \\to 0$）下密度-密度响应函数首项（$\\sim q^2$）的$b_{xc}$系数的积分表达式（$q \\to 0$）$-$计算$B_{xc}[n]$的先决条件。\n\n计算的重要性源于证明 $r_s \\ln(r_s)$ 项的系数没有接受高阶图表表达式的修正。因此，我们的导出值可以作为未来 GGA 功能开发的精确、明确的约束；在高密度缓慢变化的极限中，任何有效的泛函都必须重现我们之前的工作和本文中建立的精确约束。", "authors": [{"name": "Mario Benites"}, {"name": "Angel Rosado"}, {"name": "Efstratios Manousakis"}], "featured_authors": [{"name": "Mario Benites"}, {"name": "Angel Rosado"}, {"name": "Efstratios Manousakis"}], "author_count": 3}, {"id": "2608.02544", "category": "cond-mat", "title": "Thermal Stability of Two-Dimensional Crystals with Extended OH Hydrogen-Bonded Chains", "abstract": "Numerical simulations of the dynamics of monolayer structures of molecules deposited on a sheet of hexagonal boron nitride (h-BN) have been performed. It is shown that molecules containing benzene rings and hydroxyl groups in their structure can form stable two-dimensional crystals with linear chains of hydrogen bonds OH$\\cdots$OH$\\cdots$OH$\\cdots$ Such structures are formed by the following molecules: phenol (C$_6$H$_5$OH), hydroquinone (C$_6$H$_4$(OH)$_2$), 4-phenylphenol (C$_6$H$_5$--C$_6$H$_4$OH), 4-(4-phenylphenyl)phenol (C$_6$H$_5$--C$_6$H$_4$--C$_6$H$_4$OH), paracetamol (CH$_3$C(O)NHC$_6$H$_4$OH), 4-hydroxybenzanilide (C$_6$H$_5$C(O)NHC$_6$H$_4$OH) and 4,4-dihydroxybenzanilide (C$_6$H$_4$OHC(O)NHC$_6$H$_4$OH). On the one hand, the benzene rings in these molecules ensure their strong interaction with the flat substrate; on the other hand, they do not hinder the formation of extended hydrogen-bonded chains. The monolayer structures of these molecules exhibit high thermal stability: the onset melting temperatures of their 2D crystals are 47, 187, 127, 247, 167, 307, and 377 $^\\circ$C, respectively. The simulations allow us to conclude that multilayer structures composed of h-BN sheets and molecules of hydroquinone, paracetamol, and 4-hydroxybenzanilide can be used for the development of novel proton-exchange membranes capable of operating at elevated temperatures.", "url": "https://arxiv.org/abs/2608.02544", "type": "数值", "summary": "对沉积在六方氮化硼（h-BN）片上的分子单层结构的动力学进行了数值模拟。结果表明，结构中含有苯环和羟基的分子可以形成稳定的具有氢键直链的二维晶体 OH$\\cdots$OH$\\cdots$OH$\\cdots$ 此类结构由下列分子形成：苯酚 (C$_6$H$_5$OH)、氢醌 (C$_6$H$_4$(OH)$_2$)、4-苯基苯酚(C$_6$H$_5$--C$_6$H$_4$OH)、4-(4-苯基苯基)苯酚 (C$_6$H$_5$-C$_6$H$_4$--C$_6$H$_4$OH)、扑热息痛 (CH$_3$C(O)NHC$_6$H$_4$OH)、4-羟基苯甲酰苯胺(C$_6$H$_5$C(O)NHC$_6$H$_4$OH) 和 4,4-二羟基苯甲酰苯胺 (C$_6$H$_4$OHC(O)NHC$_6$H$_4$OH)。一方面，这些分子中的苯环确保它们与平坦基底的强相互作用；另一方面，它们不会阻碍延长的氢键链的形成。这些分子的单层结构表现出高热稳定性：其二维晶体的起始熔化温度分别为 47、187、127、247、167、307 和 377℃。\n\n模拟使我们得出结论，由 h-BN 片和对苯二酚、扑热息痛和 4-羟基苯甲酰苯胺分子组成的多层结构可用于开发能够在高温下运行的新型质子交换膜。", "authors": [{"name": "Alexander V. Savin"}], "featured_authors": [{"name": "Alexander V. Savin"}], "author_count": 1}, {"id": "2608.02552", "category": "cond-mat", "title": "Magnetic Skyrmion Interacting with Optical Skyrmion", "abstract": "Magnetic skyrmions (MSks) and optical skyrmions (OSks) embody topology in matter and in light, respectively. Here we investigate the interaction between a single MSk and an OSk beam. Three distinct nonlinear dynamical modes are identified: rotation, skipping, and trochoidal motion. By decomposing the optical driving force into gradient, orbital-angular-momentum, and spin-angular-momentum contributions, we clarify their respective roles of radial confinement, azimuthal drift, and precessional modulation. The skipping motion arises from the azimuthal asymmetry of the OSk beam and exhibits spatial selectivity originating from the magnetization-polarization coupling between the MSk and OSk. In three dimensions, the coupling acquires a propagation-dependent phase dominated by the differential Gouy phase, which yields $z$-asymmetric skipping trajectories. These results bridge topological particles and topological fields within a unified framework, offering helicity-selective and phase-programmable routes to optomagnonic control.", "url": "https://arxiv.org/abs/2608.02552", "type": "理论", "summary": "磁性斯格明子（MSks）和光学斯格明子（OSks）分别体现了物质和光中的拓扑结构。在这里，我们研究单个 MSk 和 OSk 光束之间的相互作用。确定了三种不同的非线性动力学模式：旋转、跳跃和余摆线运动。通过将光学驱动力分解为梯度、轨道角动量和自旋角动量贡献，我们阐明了它们各自在径向限制、方位角漂移和进动调制中的作用。跳跃运动由 OSk 光束的方位不对称性引起，并且表现出源自 MSk 和 OSk 之间的磁化-极化耦合的空间选择性。在三个维度中，耦合获得了由微分古伊相位主导的传播相关相位，从而产生 $z$-不对称跳跃轨迹。这些结果在统一的框架内将拓扑粒子和拓扑场联系起来，为光磁控制提供了螺旋选择性和相位可编程的途径。", "authors": [{"name": "Lan Bo"}, {"name": "Jian Chen"}, {"name": "Xichao Zhang"}, {"name": "Yan Zhou"}, {"name": "Chengwei Qiu"}, {"name": "Masahito Mochizuki"}], "featured_authors": [{"name": "Lan Bo"}, {"name": "Jian Chen"}, {"name": "Xichao Zhang"}, {"name": "Yan Zhou"}, {"name": "Chengwei Qiu"}, {"name": "Masahito Mochizuki"}], "author_count": 6}, {"id": "2608.00159", "category": "hep-th", "title": "The Lorentzian Geometry of Tunneling in Global de Sitter at Late Time", "abstract": "It is widely believed that Coleman--De Luccia (CDL) instantons characterize tunneling transitions in a de Sitter multiverse. Their most naive interpretation uses analytic continuation to Lorentzian de Sitter at the minimal size of the spatial three-sphere. However, what one really wants is a geometry where a small bubble of new vacuum forms within the huge spatial sphere of an old parent de Sitter. Even by applying de Sitter isometries to the original CDL solutions, this cannot in general be achieved. In particular, it fails in the gravity-dominated regime, i.e. for up-tunneling and for transitions with heavy domain walls. These cases remain pathological in that the whole multiverse is in the causal future of every single up-tunneling event. To solve this problem, we develop a Hamiltonian description of how a small off-shell bubble grows and eventually goes on shell within the large spatial sphere of late-time de Sitter. We provide the corresponding WKB analysis, recovering the CDL rate. We explain that our tunneling process and that of CDL are described by two different analytic continuations of a unique on-shell trajectory in the Hamiltonian treatment. Our analysis has crucial implications for the Larfors--Johnson problem, which questions the standard mechanism for populating the string-theoretic flux landscape on the basis of an instability of the relevant domain walls.", "url": "https://arxiv.org/abs/2608.00159", "type": "理论", "summary": "人们普遍认为，科尔曼-德卢西亚 (CDL) 瞬子表征了德西特多重宇宙中的隧道跃迁。他们最天真的解释是在空间三球体的最小尺寸上使用洛伦兹德西特的解析延拓。然而，人们真正想要的是一种几何结构，其中一个新的真空小气泡在老父德西特的巨大空间球内形成。即使将德西特等距应用到原始 CDL 解决方案中，这通常也无法实现。特别是，它在重力主导的情况下失败，即对于上隧道和具有重畴壁的过渡。这些案例仍然是病态的，因为整个多元宇宙都处于每一个向上隧道事件的因果未来中。为了解决这个问题，我们开发了一个哈密顿量描述，描述一个小的离壳气泡如何生长并最终在晚期德西特的大空间球内进入壳层。我们提供相应的WKB分析，恢复CDL率。我们解释说，我们的隧道过程和 CDL 的隧道过程是通过哈密顿处理中独特的壳上轨迹的两个不同的分析延续来描述的。\n\n我们的分析对拉福斯-约翰逊问题具有至关重要的意义，该问题对基于相关磁畴壁不稳定性的弦理论通量景观的标准机制提出了质疑。", "authors": [{"name": "Thibaut Coudarchet"}, {"name": "Ben Freivogel"}, {"name": "Bjoern Hassfeld"}, {"name": "Arthur Hebecker"}], "featured_authors": [{"name": "Thibaut Coudarchet"}, {"name": "Ben Freivogel"}, {"name": "Bjoern Hassfeld"}, {"name": "Arthur Hebecker"}], "author_count": 4}, {"id": "2608.00169", "category": "hep-th", "title": "Dynamics of nucleation in thermal phase transitions", "abstract": "We study dynamical effects during nucleation in thermal first-order phase transitions in field theory. Focusing on the classical regime of the decay of a metastable state, we present the general formula for the thermal decay rate including the dynamical prefactor and give a recipe for its systematic evaluation. We describe the physical mechanism which reduces the actual thermal decay rate with respect to the statistical rate obtained in equilibrium theory. We also discuss the thermality conditions ensuring the existence of a steady-state thermal rate, in which case our formula is exact up to exponentially small corrections. We show that it reproduces the known results for the nucleation rate in stochastic mechanics and field theory, and allows us to unify and go beyond them. We illustrate this in real-time numerical simulations of simple field theory models. We observe significant non-perturbative contributions which can dominate the dynamical prefactor in weakly-coupled field theories at moderate exponential suppression of the decay rate. We explore the connection of these non-perturbative effects to oscillons. Notably, our numerical method requires exponentially less computing time than direct simulations of decays and is thus applicable to systems with arbitrarily strong exponential suppression. Finally, we discuss small or poorly thermalized systems when the thermality conditions are violated and the steady-state rate does not exist.", "url": "https://arxiv.org/abs/2608.00169", "type": "理论", "summary": "我们研究场论中热一级相变成核过程中的动力学效应。着眼于亚稳态衰变的经典机制，我们提出了包括动力学前因子的热衰变率的一般公式，并给出了系统评估的方法。我们描述了相对于平衡理论中获得的统计速率降低实际热衰减速率的物理机制。我们还讨论了确保稳态热速率存在的热度条件，在这种情况下，我们的公式在指数小修正范围内是精确的。我们证明它再现了随机力学和场论中成核率的已知结果，并使我们能够统一并超越它们。我们通过简单场论模型的实时数值模拟来说明这一点。我们观察到显着的非微扰贡献，它可以在弱耦合场论中以中等指数抑制衰减率的方式主导动力学前因子。我们探索这些非微扰效应与振荡的联系。\n\n值得注意的是，我们的数值方法比直接模拟衰减所需的计算时间要少得多，因此适用于具有任意强指数抑制的系统。最后，我们讨论当违反热度条件且不存在稳态速率时的小型或热化不良系统。", "authors": [{"name": "Oliver Gould"}, {"name": "Joonas Hirvonen"}, {"name": "Andrey Shkerin"}, {"name": "Sergey Sibiryakov"}], "featured_authors": [{"name": "Oliver Gould"}, {"name": "Joonas Hirvonen"}, {"name": "Andrey Shkerin"}, {"name": "Sergey Sibiryakov"}], "author_count": 4}, {"id": "2608.00185", "category": "hep-th", "title": "Minimal Massive Gravity Coupled to Higher Spins", "abstract": "Among three-dimensional massive gravities, Minimal Massive Gravity (MMG) is distinguished by a parameter regime in which the AdS bulk theory and the dual conformal field theory can be simultaneously unitary. We couple MMG to a finite tower of higher-spins by promoting the fields of its first-order formulation to $\\mathfrak{sl}(N)$-valued ones. We also present an extended formulation involving a group-valued Stückelberg scalar, which realizes the higher-spin translations broken by the massive deformation. We then construct AdS$_2\\times$S$^1$ solutions carrying higher-spin hair specific to the massive theory. Finally, we analyse the mass spectrum of the higher-spin modes around AdS$_3$.", "url": "https://arxiv.org/abs/2608.00185", "type": "理论", "summary": "在三维大质量引力中，最小质量引力（MMG）的特点是其参数体系中 AdS 体理论和对偶共形场论可以同时酉。我们通过将 MMG 的一阶公式的域提升为 $\\mathfrak{sl}(N)$ 值的域，将 MMG 耦合到一个有限的高自旋塔。我们还提出了一个涉及群值 Stückelberg 标量的扩展公式，它实现了因大规模变形而破坏的高自旋平移。然后，我们构建 AdS$_2\\times$S$^1$ 解决方案，携带特定于大规模理论的更高旋转头发。最后，我们分析了 AdS$_3$ 周围高自旋模式的质谱。", "authors": [{"name": "Franz Ciceri"}, {"name": "Nihat Sadik Deger"}, {"name": "Bastien Duboeuf"}, {"name": "Henning Samtleben"}], "featured_authors": [{"name": "Franz Ciceri"}, {"name": "Nihat Sadik Deger"}, {"name": "Bastien Duboeuf"}, {"name": "Henning Samtleben"}], "author_count": 4}, {"id": "2608.00204", "category": "hep-th", "title": "Infrared Problem in Quantum Electrodynamics", "abstract": "It is well known that the inclusive cross section in QED is infrared finite. In the standard diagram techniques this result follows from cancellation of infrared divergences. We construct a new diagram technique where the diagrams for inclusive cross sections (and, more generally, for inclusive scattering matrix) do not contain infrared divergences.", "url": "https://arxiv.org/abs/2608.00204", "type": "理论", "summary": "众所周知，QED 中的包容截面是红外有限的。在标准图表技术中，该结果是由红外发散的消除得出的。我们构建了一种新的图表技术，其中包含横截面的图表（更一般地说，包含散射矩阵）不包含红外发散。", "authors": [{"name": "Igor Frolov"}, {"name": "Albert Schwarz"}], "featured_authors": [{"name": "Igor Frolov"}, {"name": "Albert Schwarz"}], "author_count": 2}, {"id": "2608.00363", "category": "hep-th", "title": "Projecting Gravitational Fluctuations onto Near-Horizon Throats", "abstract": "We show that, for stationary geometries whose linearized fluctuation equations separate into radial and angular Heun equations, a pair of diffeomorphisms projects the full problem onto two coupled, isospectral Gauss hypergeometric problems in complementary spacetime regions. This projection requires Robin boundary conditions to be imposed at the intersection between the complementary regions, which are uniquely fixed by requiring the two diffeomorphisms to match there. The method provides an independent derivation of recent results obtained from the correspondence between Heun connection coefficients and instanton partition functions in the Nekrasov-Shatashvili limit. As an application, we identify a subset of modes in Kerr-de Sitter and Kerr-anti-de Sitter black holes that, in the near-extremal limit, continuously reduce to a basis of the Schwarzian/Jackiw-Teitelboim functional space of gravitational fluctuations.", "url": "https://arxiv.org/abs/2608.00363", "type": "理论", "summary": "我们证明，对于线性涨落方程分为径向和角 Heun 方程的静止几何，一对微分同胚将整个问题投影到互补时空区域中两个耦合的等谱高斯超几何问题上。该投影需要在互补区域之间的交叉点处施加 Robin 边界条件，通过要求两个微分同胚在此处匹配来唯一固定。该方法提供了从 Nekrasov-Shatashvili 极限中的 Heun 连接系数和瞬子配分函数之间的对应关系获得的最新结果的独立推导。作为一种应用，我们识别了克尔-德西特黑洞和克尔反德西特黑洞中的模式子集，这些模式在接近极值极限时，不断减少到引力涨落的 Schwarzian/Jackiw-Teitelboim 函数空间的基础。", "authors": [{"name": "Alejandro Cabo-Bizet"}, {"name": "Vasil Dimitrov"}, {"name": "Dario Martelli"}, {"name": "Lorenzo Ruggeri"}], "featured_authors": [{"name": "Alejandro Cabo-Bizet"}, {"name": "Vasil Dimitrov"}, {"name": "Dario Martelli"}, {"name": "Lorenzo Ruggeri"}], "author_count": 4}, {"id": "2608.00376", "category": "hep-th", "title": "Fibre Inflation Beyond BHP: Constraints and a BHP-Free Regime", "abstract": "We study a restricted fibre-dependent $\\alpha'$-loop sector in Type IIB Large Volume Scenario fibre inflation beyond the conventional Berg-Haack-Pajer (BHP) parametrisation. Motivated by effective-field-theory corrections in K3-fibred Calabi--Yau orientifolds, we analyse BHP-complete, partially BHP-driven and BHP-free configurations. For BHP-driven cases, the additional corrections act as effective deformations of the standard fibre potential and are bounded at the percent level relative to the corresponding BHP structures, with logarithmic terms typically more restricted due to their effects on the slope and curvature. At the effective-field-theory level, we identify a BHP-free fibre-inflation regime, referred to as $\\alpha'$-loop inflation, in which the conventional KK- and winding-type BHP channels vanish while the generalized loop sector stabilises the fibre modulus and supports slow-roll inflation. This regime exhibits a characteristic hierarchy between fibre-dependent loop structures controlled by the large-volume suppression and satisfies CMB, Kähler-cone, large-volume and heavy-modulus constraints. Our results show that fibre inflation is sensitive to the orientifold and brane configurations, and that corrections beyond the BHP ansatz can generate new controlled inflationary regimes.", "url": "https://arxiv.org/abs/2608.00376", "type": "理论", "summary": "我们研究了超出传统 Berg-Haack-Pajer (BHP) 参数化的 IIB 型大容量场景光纤膨胀中受限制的光纤相关 $\\alpha'$ 环扇区。受 K3 纤维 Calabi-Yau 东方褶皱有效场理论修正的启发，我们分析了 BHP 完全、部分 BHP 驱动和无 BHP 配置。对于 BHP 驱动的情况，附加修正充当标准纤维势的有效变形，并限制在相对于相应 BHP 结构的百分比水平，对数项通常由于对斜率和曲率的影响而受到更多限制。在有效场理论层面，我们确定了一种无 BHP 的纤维膨胀体系，称为 $\\alpha'$-循环膨胀，其中传统的 KK 型和缠绕型 BHP 通道消失，而广义循环扇区稳定了纤维模量并支持慢滚动膨胀。该机制表现出受大体积抑制控制的依赖于纤维的环结构之间的特征层次结构，并满足 CMB、Kähler 锥、大体积和重模量约束。\n\n我们的结果表明，纤维膨胀对东方褶皱和膜结构敏感，并且超出 BHP ansatz 的修正可以产生新的受控膨胀机制。", "authors": [{"name": "Xin Gao"}, {"name": "Zhiwei Li"}, {"name": "Chuying Wang"}], "featured_authors": [{"name": "Xin Gao"}, {"name": "Zhiwei Li"}, {"name": "Chuying Wang"}], "author_count": 3}, {"id": "2608.00590", "category": "hep-th", "title": "IR Black Hole Instabilities Trigger Species-Scale Particle Production", "abstract": "We propose a novel UV-IR mechanism in quantum gravity in which black hole instabilities act as a bridge to the most ultraviolet sector of the theory. Specifically, we argue that when black holes reach a critical temperature associated with a light tower of states, they undergo a phase transition that sources particles near the species scale, a threshold beyond which any effective field theory of gravity fails. Using the existing numerical results, we show that production of such particles through Hawking radiation is always subdominant. We also extend our investigation to a large family of dyonic and dilatonic black holes and show how the conclusion depends on the origin of the gauge symmetry, its dilatonic coupling, and the charge under that gauge symmetry.", "url": "https://arxiv.org/abs/2608.00590", "type": "理论", "summary": "我们提出了量子引力中的一种新颖的紫外-红外机制，其中黑洞不稳定性充当了通往理论中最紫外部分的桥梁。具体来说，我们认为，当黑洞达到与光塔状态相关的临界温度时，它们会经历相变，产生接近物种尺度的粒子，超过这个阈值，任何有效的引力场理论都会失效。利用现有的数值结果，我们表明通过霍金辐射产生此类粒子始终占主导地位。我们还将我们的研究扩展到一大群双子和膨胀黑洞，并展示了结论如何取决于规范对称性的起源、其膨胀耦合以及规范对称性下的电荷。", "authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Alek Bedroya"}, {"name": "Dieter Lüst"}, {"name": "Houri-Christina Tarazi"}], "featured_authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Alek Bedroya"}, {"name": "Dieter Lüst"}, {"name": "Houri-Christina Tarazi"}], "author_count": 4}, {"id": "2608.00665", "category": "hep-th", "title": "Spectral Functions of $J/ψ$ Meson in Rotating Thermal Background from Holography", "abstract": "We investigate the spectral functions of the $J/\\psi$ meson in a rotating thermal background within the soft-wall holographic model. The global rotation is implemented through a rotating AdS-like metric, while a local inertial frame is introduced in which the vector field can be decomposed into different spin states. We solve the equations of motion of the vector field in the bulk with incoming wave condition near the horizon and compute the retarded Green function, from which we extract the invariant-mass spectral functions for $J/\\psi$. When the momentum is parallel to the rotation axis, the peak energies shift by $-\\Omega J_z$, as expected by a coupling between rotation and angular momentum, while the widths are nearly independent to $\\Omega$. When the momentum is in perpendicular direction, the spectral functions for spin-$\\pm1$ states deviate significantly from the single-peak behavior and the energy shifts depart from $-\\Omega J_z$. The resulting triplet splittings of the spectral functions provides a holographic perspective on spin-dependent vector meson properties in rotating systems.", "url": "https://arxiv.org/abs/2608.00665", "type": "理论", "summary": "我们研究了软壁全息模型内旋转热背景中 $J/\\psi$ 介子的光谱函数。全局旋转是通过类似AdS的旋转度量来实现的，同时引入了局部惯性系，其中矢量场可以分解为不同的自旋状态。我们求解地平线附近入射波条件下的矢量场运动方程，并计算延迟格林函数，从中提取 $J/\\psi$ 的不变质谱函数。当动量平行于旋转轴时，峰值能量移动 $-\\Omega J_z$，正如旋转和角动量之间的耦合所预期的那样，而宽度几乎与 $\\Omega$ 无关。当动量处于垂直方向时，自旋$\\pm1$态的谱函数显着偏离单峰行为，并且能量转移偏离$-\\Omega J_z$。由此产生的光谱函数的三重态分裂为旋转系统中自旋相关的矢量介子特性提供了全息视角。", "authors": [{"name": "Xin-Li Sheng"}, {"name": "Jun-Xia Chen"}, {"name": "Defu Hou"}, {"name": "Hai-Cang Ren"}], "featured_authors": [{"name": "Xin-Li Sheng"}, {"name": "Jun-Xia Chen"}, {"name": "Defu Hou"}, {"name": "Hai-Cang Ren"}], "author_count": 4}, {"id": "2608.00758", "category": "hep-th", "title": "Aspects of the quantization of non-linear electrodynamics in an uniform magnetic background", "abstract": "The canonical and path integral quantization for non-linear electrodynamics in the presence of an external electromagnetic (EM) field are proposed in this work. The EM background field is introduced expanding a general lagrangian of a generic non-linear electrodynamics around the background for small fluctuations of the propagating fields, where we consider up to the quadratic terms in the propagating fields. As consequence, we obtain an electrodynamics linearized by the presence of the external EM field. Thereby, we study the canonical quantization calculating the energy for the ground state of the linearized EM field in terms of an external magnetic field. The microcausality of the model also is discussed through the Pauli-Jordan function. We also define a generating functional for the linearized EM field, in which, in the Coulomb gauge, the Green function of the model is obtained, and we can construct the perturbative formalism like in standard quantum field theory (QFT). As application of the perturbation theory, the effective potential at one loop is calculated for the linearized EM field coupled to a complex scalar field. We apply the results in the case of the Modified Maxwell ED.", "url": "https://arxiv.org/abs/2608.00758", "type": "理论", "summary": "这项工作提出了存在外部电磁 (EM) 场时非线性电动力学的规范和路径积分量化。引入了电磁背景场，扩展了背景周围通用非线性电动力学的一般拉格朗日函数，以应对传播场的小波动，其中我们考虑传播场中的二次项。因此，我们获得了因外部电磁场的存在而线性化的电动力学。因此，我们研究了规范量子化，根据外部磁场计算线性化电磁场基态的能量。模型的微观因果关系也通过泡利-乔丹函数进行了讨论。我们还定义了线性化电磁场的生成函数，其中在库仑规范中获得了模型的格林函数，并且我们可以像标准量子场论（QFT）一样构造微扰形式。作为微扰理论的应用，计算耦合到复标量场的线性化电磁场的一个回路的有效电势。\n\n我们将结果应用于修正麦克斯韦 ED 的情况。", "authors": [{"name": "M. J. Neves"}], "featured_authors": [{"name": "M. J. Neves"}], "author_count": 1}, {"id": "2608.00784", "category": "hep-th", "title": "Classical Black Hole Scattering to Celestial Amplitudes in Effective Theories of Gravity", "abstract": "This thesis investigates quantum field theoretic approaches to classical gravity beyond General Relativity. Using worldline effective field theory, worldline quantum field theory, and on shell scattering amplitudes, it investigates compact-object dynamics in dark-sector models, scalar tensor gravity, dynamical Chern Simons gravity, and Einstein Maxwell dilaton theory. The thesis derives a range of conservative and radiative observables, including impulses, waveforms, eikonal phases, two-body potentials, and scattering angles, while incorporating effects associated with spin, parity violation, infrared structure, and multi-loop integrals. It also constructs celestial eikonal amplitudes and analyzes their conformal data in gravitational theories beyond General Relativity. Collectively, these results broaden the application of modern quantum field theoretic techniques to gravitational dynamics and contribute to a more detailed understanding of gravity beyond the Einsteinian framework. (Detailed abstract in the thesis.)", "url": "https://arxiv.org/abs/2608.00784", "type": "理论", "summary": "本论文研究了超越广义相对论的经典引力的量子场论方法。利用世界线有效场论、世界线量子场论和壳散射振幅，它研究了暗区模型中的致密物体动力学、标量张量引力、动力学陈·西蒙斯引力和爱因斯坦麦克斯韦膨胀理论。该论文推导了一系列保守和辐射可观测量，包括脉冲、波形、电子波相位、二体势和散射角，同时结合了与自旋、宇称破坏、红外结构和多环积分相关的效应。它还构建了天体 eikonal 振幅并在广义相对论之外的引力理论中分析了它们的共形数据。总的来说，这些结果拓宽了现代量子场论技术在引力动力学中的应用，并有助于在爱因斯坦框架之外更详细地理解引力。 （详细摘要见论文。）", "authors": [{"name": "Saptaswa Ghosh"}], "featured_authors": [{"name": "Saptaswa Ghosh"}], "author_count": 1}, {"id": "2608.01125", "category": "hep-th", "title": "Symmetric formulation for higher spin correlators, quantum effective action and anomaly", "abstract": "We develop a constructive framework for the three-point higher spin conformal correlation function, originally introduced in our previous work, and apply it as the foundation for constructing the quantum effective action of the corresponding higher spin conformal gauge theory. Employing a symmetric refinement of the earlier construction, we analyze the principal singularity of the three-point function and the associated effective action. This leads to a general method for extracting the dominant singularity and investigating the anomalous local contributions to the effective action.", "url": "https://arxiv.org/abs/2608.01125", "type": "理论", "summary": "我们为三点高自旋共形相关函数开发了一个构造性框架，最初是在我们之前的工作中引入的，并将其用作构造相应的高自旋共形规范理论的量子有效作用的基础。采用早期构造的对称改进，我们分析了三点函数的主奇异性和相关的有效作用。这导致了提取主导奇点并研究异常局部对有效行动的贡献的通用方法。", "authors": [{"name": "Melik Karapetyan"}, {"name": "Ruben Manvelyan"}], "featured_authors": [{"name": "Melik Karapetyan"}, {"name": "Ruben Manvelyan"}], "author_count": 2}, {"id": "2608.01154", "category": "hep-th", "title": "Testing bare open-string-metric areas against flavour entanglement in finite-density D3-D7", "abstract": "We test whether bare codimension-two areas in the D7-brane open string metric (OSM) reproduce the leading probe-brane contribution to boundary entanglement entropy in the massless finite-density D3-D7 system at zero temperature. The established Chang-Karch-Uhlemann benchmark contains shape-dependent volume terms in a controlled probe regime. By contrast, the connected strip family terminates at a maximal width and the selected strip finite part saturates at the disconnected-reference value, while the lower-area spherical branch is area-like rather than volume-like at large radius. The OSM construction nevertheless detects the density-induced crossover scale, and its geometric landmarks occur at order-one multiples of a pole-defined longitudinal response length. A low-temperature regulator shows that no density-controlled horizon-volume term survives the zero-temperature limit. Bare OSM areas therefore diagnose open-sector crossover physics but do not, in general, compute flavour entanglement entropy.", "url": "https://arxiv.org/abs/2608.01154", "type": "理论", "summary": "我们测试了 D7 膜开弦度量 (OSM) 中的裸余维二区域是否再现了零温度下无质量有限密度 D3-D7 系统中边界纠缠熵的主要探针膜贡献。已建立的 Chang-Karch-Uhlemann 基准包含受控探针状态中与形状相关的体积项。相比之下，连接的条带族在最大宽度处终止，并且选定的条带有限部分在断开参考值处饱和，而较低面积的球形分支在大半径处是面积状的而不是体积状的。然而，OSM 结构检测到密度引起的交叉尺度，并且其几何地标出现在极点定义的纵向响应长度的一阶倍数处。低温调节器表明，没有密度控制的层位体积项能够在零温度限制下生存。因此，裸 OSM 区域诊断开放扇区交叉物理，但通常不计算风味纠缠熵。", "authors": [{"name": "Fuminori Okabayashi"}], "featured_authors": [{"name": "Fuminori Okabayashi"}], "author_count": 1}, {"id": "2608.01349", "category": "hep-th", "title": "Exact Finite-$N$ eRS Surface-Defect Indices and Giant-Graviton Corrections in $\\mathcal N=4$ SYM", "abstract": "We study the finite-$N$ superconformal index of four-dimensional $\\mathcal N=4$ $U(N)$ Yang--Mills theory with antisymmetric elliptic Ruijsenaars--Schneider (eRS) insertions. The eRS insertions turn the uninserted index, which is an unweighted spectral sum, into a family of protected observables weighted by eRS eigenvalues and therefore retain finite-$N$ information not determined by the ordinary index alone On the codimension-one locus $t=q$, $p=uv$, the eRS operators become conjugate to free shifts, allowing us to rewrite the self-glued index as a bilateral free-fermion determinant. This gives exact finite-$N$ formulas for all antisymmetric ranks and makes the $u\\leftrightarrow v$ structure manifest. On the boundary $v=0$, we determine the complete stable tower of pure $u^{kN}$ defect-resolved corrections, while the bilateral two-charge formula captures the reflected $v^{kN}$ sectors and mixed $u$--$v$ contributions, including the first mixed giant-graviton sector. We also develop the expansion away from the solvable locus through second order. Finally, we reproduce the ordinary one-giant coefficient from a maximal-D3 determinant and identify the additional microscopic input required to complete the bulk derivation of the defect correction.", "url": "https://arxiv.org/abs/2608.01349", "type": "理论", "summary": "我们研究了带有反对称椭圆 Ruijsenaars-Schneider (eRS) 插入的四维 $\\mathcal N=4$ $U(N)$ Yang--Mills 理论的有限 $N$ 超共形指数。 eRS 插入将未插入的指数（未加权的谱和）转换为由 eRS 特征值加权的受保护可观测量族，因此保留了仅由普通指数决定的有限 $N$ 信息。在余维单轨迹 $t=q$、$p=uv$ 上，eRS 算子与自由位移共轭，允许我们将自粘指数重写为双边自由费米子行列式。这给出了所有反对称秩的精确有限-$N$ 公式，并使 $u\\leftrightarrow v$ 结构明显。在边界 $v=0$ 上，我们确定纯 $u^{kN}$ 缺陷解决校正的完整稳定塔，而双边双电荷公式捕获反射的 $v^{kN}$ 扇区和混合 $u$--$v$ 贡献，包括第一个混合巨引力子扇区。我们还通过二阶开发远离可解轨迹的展开式。\n\n最后，我们从最大 D3 行列式重现普通的巨系数，并确定完成缺陷校正的批量推导所需的额外微观输入。", "authors": [{"name": "Ji-Seong Chae"}], "featured_authors": [{"name": "Ji-Seong Chae"}], "author_count": 1}, {"id": "2608.01372", "category": "hep-th", "title": "Quantization of Galilean Electrodynamics: a non-trivially trivial theory", "abstract": "We consider the quantization of the non-relativistic limit of electrodynamics called Galilean electrodynamics. To that end, we apply the Dirac bracket formalism to understand the constraints and dynamics of the theory and analyze its gauge structure. We show that the theory is fully constrained, which eliminates all the degrees of freedom from the path integral.", "url": "https://arxiv.org/abs/2608.01372", "type": "理论", "summary": "我们考虑电动力学非相对论极限的量子化，称为伽利略电动力学。为此，我们应用狄拉克括号形式主义来理解理论的约束和动态，并分析其规范结构。我们证明该理论是完全约束的，这消除了路径积分的所有自由度。", "authors": [{"name": "Rafael Hernandez"}, {"name": "Juan Miguel Nieto Garcia"}, {"name": "Ander Urtiaga"}], "featured_authors": [{"name": "Rafael Hernandez"}, {"name": "Juan Miguel Nieto Garcia"}, {"name": "Ander Urtiaga"}], "author_count": 3}, {"id": "2608.01729", "category": "hep-th", "title": "de Sitter holography from a Lorentzian torus", "abstract": "We show that the quantum entanglement between the conformal field theories (CFTs) living on the future and past boundaries in the de Sitter/conformal field theory (dS/CFT) correspondence can be described by Wick rotating to a geometry with two timelike directions. We propose a new realization of the dS/CFT correspondence in which quantum gravity on this two-time geometry is holographically dual to a CFT defined on a Lorentzian torus. We show that this duality reproduces key features of dS holography, including the dS entropy, correlation functions, and pseudoentropy. Finally, by extending the framework of path-integral optimization, we explain how dS spacetime emerges from the CFT on the Lorentzian torus.", "url": "https://arxiv.org/abs/2608.01729", "type": "理论", "summary": "我们证明，德西特/共形场论（dS/CFT）对应中未来和过去边界上的共形场论（CFT）之间的量子纠缠可以通过威克旋转到具有两个类时方向的几何来描述。我们提出了 dS/CFT 对应关系的新实现，其中二次几何上的量子引力与洛伦兹环面上定义的 CFT 是全息对偶的。我们证明这种对偶性再现了 dS 全息术的关键特征，包括 dS 熵、相关函数和伪熵。最后，通过扩展路径积分优化的框架，我们解释了 dS 时空如何从洛伦兹环面上的 CFT 中出现。", "authors": [{"name": "Kosei Fujiki"}, {"name": "Michitaka Kohara"}, {"name": "Javier Moreno"}, {"name": "Kotaro Shinmyo"}, {"name": "Tadashi Takayanagi"}], "featured_authors": [{"name": "Kosei Fujiki"}, {"name": "Michitaka Kohara"}, {"name": "Javier Moreno"}, {"name": "Kotaro Shinmyo"}, {"name": "Tadashi Takayanagi"}], "author_count": 5}, {"id": "2608.01762", "category": "hep-th", "title": "Primordial Correlators from a Kaluza-Klein Graviton Continuum", "abstract": "Cosmological collider signals are usually discussed for isolated massive particles, whose exchange produces characteristic logarithmic oscillations in primordial correlators. In this work, we study how this signal is modified when the exchanged states form a continuous mass spectrum. We first develop a spectral representation for inflationary correlators mediated by a continuum field. In the soft limit, the non-analytic part of the seed function is expressed as a Fourier--Laplace transform of the spectral weight with respect to logarithmic momentum variables. This representation shows that a continuum superposes clock signals with different frequencies and can dephase the sharp oscillation associated with a single massive particle. We then realize this mechanism in an RS2-like inflationary braneworld, where the inflaton is localized on a de Sitter brane in a five-dimensional AdS bulk. The tensor sector contains a localized massless graviton and a continuum of Kaluza-Klein gravitons starting at \\(m=3H/2\\). We derive the KK wavefunctions and identify the brane spectral weight fixed by the continuum wavefunction on the brane. Applying this weight to the inflaton four-point function, we find a smooth seed function rather than a persistent logarithmic clock oscillation. This behavior follows from the fact that the continuum starts at zero clock frequency, while the KK spectral weight vanishes near threshold. Our results provide a concrete higher-dimensional example in which deviations from the standard cosmological collider signal encode the structure of a continuum high-energy spectrum.", "url": "https://arxiv.org/abs/2608.01762", "type": "理论", "summary": "宇宙学对撞信号通常针对孤立的大质量粒子进行讨论，这些粒子的交换会在原初相关器中产生特征对数振荡。在这项工作中，我们研究了当交换的状态形成连续质谱时如何修改该信号。我们首先开发由连续场介导的暴胀相关器的谱表示。在软极限中，种子函数的非解析部分表示为谱权重相对于对数动量变量的傅立叶-拉普拉斯变换。这种表示表明，连续体叠加了不同频率的时钟信号，并且可以使与单个大质量粒子相关的急剧振荡失相。然后，我们在类似 RS2 的暴胀膜世界中实现了这种机制，其中暴胀子位于五维 AdS 体中的德西特膜上。张量扇区包含一个局域无质量引力子和一个从 \\(m=3H/2\\) 开始的 Kaluza-Klein 引力子连续体。我们推导了 KK 波函数并确定了由膜上的连续波函数固定的膜谱权重。\n\n将此权重应用于暴胀四点函数，我们发现平滑的种子函数而不是持续的对数时钟振荡。这种行为源于以下事实：连续体从零时钟频率开始，而 KK 谱权重在阈值附近消失。我们的结果提供了一个具体的高维示例，其中与标准宇宙对撞机信号的偏差编码了连续高能谱的结构。", "authors": [{"name": "Shuntaro Aoki"}], "featured_authors": [{"name": "Shuntaro Aoki"}], "author_count": 1}, {"id": "2608.01818", "category": "hep-th", "title": "Holographic Thermodynamics of Dyonic Dilaton AdS Black Holes", "abstract": "We investigate the holographic dual of the extended bulk thermodynamics of dyonic dilaton AdS black holes by allowing both the cosmological constant and Newton's gravitational constant to vary. In the dual CFT thermodynamics, the central charge $C$ and chemical potential $\\mu$ as its conjugate enter the thermodynamic relations, in addition to $(\\tilde{T},\\tilde{S})$, $(\\tilde{Q},\\tilde{\\Phi})$, $(\\tilde{P},\\tilde{\\Psi})$, $(\\tilde{\\mathcal{P}},\\tilde{V})$. We consider sixteen different ensembles related to those five pairs of thermodynamic variables which we separate into fixed volume and pressure ensembles. Due to the symmetry on ($\\tilde{Q},\\tilde{P}$), we only need to analyze five ensembles each in fixed volume and pressure ensembles. In the fixed volume ensembles, it is foun
