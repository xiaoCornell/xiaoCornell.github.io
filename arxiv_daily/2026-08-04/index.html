d that the fixed ($\\tilde{Q},\\tilde{P},\\tilde{V},\\mu$) and ($\\tilde{\\Phi},\\tilde{P},\\tilde{V},\\mu$) exhibit a zeroth-order phase transition. Interestingly, the fixed ($\\tilde{\\Phi},\\tilde{\\Psi},\\tilde{V},C$) ensemble shows the zeroth- and first-order phase transitions at above and below critical potential $\\tilde{\\Upsilon}_c$, respectively. In the fixed pressure ensembles, it is found that richer structures appear where the sign of $\\mu$ heavily influences phase space for several ensembles. For fixed ($\\tilde{Q},\\tilde{P},\\tilde{\\mathcal{P}},\\mu$) and ($\\tilde{\\Phi},\\tilde{P},\\tilde{\\mathcal{P}},\\mu$), they show the zeroth-, first-, and second-order phase transitions. For the fixed ($\\tilde{\\Phi},\\tilde{\\Psi},\\tilde{\\mathcal{P}},\\mu$) ensemble, there is only a zeroth-order phase transition occurs. The other ensembles which we do not mention eventually do not show any phase transition. These findings provide deeper insight into how bulk gravitational variations, particularly regarding the cosmological and gravitational constants, translate to exact critical phenomena and richer phase structures within CFT.", "url": "https://arxiv.org/abs/2608.01818", "type": "理论", "summary": "我们通过允许宇宙学常数和牛顿引力常数变化来研究双子膨胀 AdS 黑洞的扩展体热力学的全息对偶。在对偶CFT热力学中，中心电荷$C$和化学势$\\mu$作为其共轭进入热力学关系式，此外还有$(\\tilde{T},\\tilde{S})$、$(\\tilde{Q},\\tilde{\\Phi})$、$(\\tilde{P},\\tilde{\\Psi})$、$(\\tilde{\\mathcal{P}},\\tilde{V})$。我们考虑与这五对热力学变量相关的十六种不同系综，我们将它们分成固定体积和压力系综。由于 ($\\tilde{Q},\\tilde{P}$) 上的对称性，我们只需要分析固定体积和压力系综中的五个系综。在固定体积系综中，发现固定的 ($\\tilde{Q},\\tilde{P},\\tilde{V},\\mu$) 和 ($\\tilde{\\Phi},\\tilde{P},\\tilde{V},\\mu$) 表现出零阶相变。有趣的是，固定的 ($\\tilde{\\Phi},\\tilde{\\Psi},\\tilde{V},C$) 系综分别显示了高于和低于临界电势 $\\tilde{\\Upsilon}_c$ 时的零阶和一阶相变。\n\n在固定压力系综中，我们发现，$\\mu$ 的符号严重影响多个系综的相空间，从而出现更丰富的结构。对于固定 ($\\tilde{Q},\\tilde{P},\\tilde{\\mathcal{P}},\\mu$) 和 ($\\tilde{\\Phi},\\tilde{P},\\tilde{\\mathcal{P}},\\mu$)，它们显示零阶、一阶和二阶相变。对于固定的 ($\\tilde{\\Phi},\\tilde{\\Psi},\\tilde{\\mathcal{P}},\\mu$) 系综，仅发生零阶相变。我们最终没有提到的其他系综没有表现出任何相变。这些发现提供了对体积引力变化（尤其是宇宙学和引力常数）如何转化为 CFT 中精确的临界现象和更丰富的相结构的更深入的了解。", "authors": [{"name": "Muhammad Fitrah Alfian Rangga Sakti"}, {"name": "Robert Mann"}, {"name": "Piyabut Burikham"}], "featured_authors": [{"name": "Muhammad Fitrah Alfian Rangga Sakti"}, {"name": "Robert Mann"}, {"name": "Piyabut Burikham"}], "author_count": 3}, {"id": "2608.01989", "category": "hep-th", "title": "Coarse-Graining and the Classification of Long-Range Correlations in Quantum Field Theory", "abstract": "A conservation-law-guided classification framework is developed for the execution of coarse-graining operations in quantum field theory. Coarse-graining produces a selection at the level of Feynman diagrams. Diagrams with nonzero momentum transfer are suppressed by oscillatory factors, zero-momentum-transfer ladder diagrams can accumulate through geometric series resummation to produce a spectral pole, and single-bubble topologies contribute only to the continuum. Conservation laws govern this classification. For operators protected by a Ward identity, the matrix element at zero momentum is guaranteed to be nonvanishing. For operators protected by BRST symmetry, the Slavnov-Taylor identities provide no mandatory suppression. The two cases differ in the strength of the algebraic guarantee. For unprotected operators the injection term vanishes and the spectral function remains continuous. The sign of the single-bubble contribution is determined by spin statistics. A positive sign leads to amplificative feedback in the ladder resummation, a negative sign leads to suppressive feedback. These two attributes, the nonvanishing of the injection term and the sign of the single-bubble contribution, are the defining criteria of the classification. As a direct application, a general classification of local operators is established within the emergence framework and verified on eight physical channels and three known solvable systems. The framework indicates which emergence paths are possible for each operator; whether the critical condition is reached is left for independent nonperturbative computation. The logical structure of this classification is parallel to the strategy used in deriving fluid equations from molecular kinetic theory in classical statistical physics.", "url": "https://arxiv.org/abs/2608.01989", "type": "理论", "summary": "开发了守恒定律引导的分类框架，用于执行量子场论中的粗粒度运算。粗粒度产生费曼图级别的选择。具有非零动量传递的图会受到振荡因素的抑制，零动量传递梯形图可以通过几何级数求和来累积以产生谱极点，而单气泡拓扑仅对连续体做出贡献。保护法管辖此分类。对于受 Ward 恒等式保护的算子，零动量下的矩阵元素保证不为零。对于受 BRST 对称性保护的算子，斯拉夫诺夫-泰勒恒等式不提供强制抑制。这两种情况的不同之处在于代数保证的强度。对于未受保护的算子，注入项消失并且谱函数保持连续。单气泡贡献的符号由自旋统计确定。正号导致阶梯恢复中的放大反馈，负号导致抑制反馈。\n\n这两个属性，即注入项的不为零和单气泡贡献的符号，是分类的定义标准。作为直接应用，在涌现框架内建立本地运营商的一般分类，并在八个物理通道和三个已知可解系统上进行验证。该框架指出了每个操作员可能的出现路径；是否达到临界条件留给独立的非微扰计算。这种分类的逻辑结构与经典统计物理学中从分子动力学理论推导流体方程所使用的策略是平行的。", "authors": [{"name": "Jinku Guo"}], "featured_authors": [{"name": "Jinku Guo"}], "author_count": 1}, {"id": "2608.02262", "category": "hep-th", "title": "Superloop Equations and Minimal Surfaces I: Confining minimal surface in $4D, N=1$ SYM", "abstract": "We formulate the loop equations of pure $4d, N=1$ super Yang--Mills (SYM) theory in a finite geometric form. The usual equal-point loop derivatives are singular because the order of gauge-field insertions is lost when contour points coincide. Our path-ordered operator calculus (POOC) keeps the insertions in distinct ordered slots, forms the graded commutators and Jacobi combinations, and only then takes the coincidence limit. This removes the spurious kinematical singularities without introducing a cutoff; the genuine ultraviolet contact remains a separate physical distribution. We apply POOC to the exact Itoyama--Takashino superloop hierarchy and construct a Lorentzian supersymmetric Hodge-dual (SHD) surface functional. Its Hodge-resolved area derivative is annihilated by the local chiral and anti-chiral loop operators. Exact additivity under surface-geodesic sewing shows that the exponential of this zero mode multiplies any solution of the complete finite-$N$ hierarchy without changing the equations. For planar contours the SHD functional is the geometric area. In particular, for a long rectangular Wilson loop, $W[C_{T,L}]\\sim\\exp[-i\\sigma_kLT]$ and $E_k(L)=\\sigma_kL>0$. Thus the construction gives an exact nonperturbative confining area-law factor in $ N=1$ SYM. After Euclidean continuation, the same SHD factor is an exact fixed point of the deterministic zero-noise SYM gradient flow. Its interpretation as a dynamically selected equilibrium still requires stability in the long-flow-time, large-volume, and zero-noise limits, but this does not affect the exact zero-mode and finite-$N$ dressing theorems. The complete planar Wilson-loop solution, including the undressed fluctuation factor and excitation spectrum, will be developed in the next papers of this series.", "url": "https://arxiv.org/abs/2608.02262", "type": "理论", "summary": "我们将纯$4d, N=1$超杨--米尔斯(SYM)理论的循环方程表述为有限几何形式。通常的等点环导数是奇异的，因为当轮廓点重合时，规范场插入的顺序会丢失。我们的路径有序算子演算（POOC）将插入保持在不同的有序槽中，形成分级换向器和雅可比组合，然后才取重合极限。这消除了虚假运动奇点而不引入截止；真正的紫外线接触仍然是一个单独的物理分布。我们将 POOC 应用于精确的 Itoyama--Takashino 超级环层次结构，并构造洛伦兹超对称 Hodge 对偶 (SHD) 表面泛函。其霍奇解析面积导数被局部手性和反手性环算子消灭。表面测地缝合下的精确可加性表明，该零模式的指数可以乘以完整有限 $N$ 层次结构的任何解，而无需更改方程。对于平面轮廓，SHD 函数是几何面积。特别是，对于长矩形 Wilson 环，$W[C_{T,L}]\\sim\\exp[-i\\sigma_kLT]$ 和 $E_k(L)=\\sigma_kL>0$。\n\n因此，该构造给出了精确的非扰动限制面积法则因子 $ N=1$ SYM。经过欧几里德延拓后，相同的 SHD 因子是确定性零噪声 SYM 梯度流的精确不动点。其作为动态选择平衡的解释仍然需要在长流动时间、大体积和零噪声极限下的稳定性，但这并不影响精确的零模式和有限$N$修整定理。完整的平面威尔逊环解决方案，包括未修饰的波动因子和激励频谱，将在本系列的下一篇文章中开发。", "authors": [{"name": "Alexander Migdal"}], "featured_authors": [{"name": "Alexander Migdal"}], "author_count": 1}, {"id": "2608.02368", "category": "hep-th", "title": "Subleading Asymptotic Charges in Massless Scalar QED", "abstract": "We study subleading asymptotic charges of a U(1) gauge field coupled to a charged massless scalar field in Minkowski spacetime. We consider a phase space for which the scalar-field initial data on null infinity have compact support, while the gauge-field initial data admit an asymptotic expansion with inverse-power tails in retarded (advanced) time, which we refer to as initial-data tails. We identify three finite charges at the null infinities which are conserved under scattering. One is a renormalized version of the standard subleading soft charge. The second is a logarithmic charge which is the difference of the coefficients of the leading order tails at the future and past ends of null infinity. The third is a new charge that probes the average of the tail coefficients. We conjecture that the third charge is associated with a new class of large gauge transformations which diverge linearly in retarded time.", "url": "https://arxiv.org/abs/2608.02368", "type": "理论", "summary": "我们研究了闵可夫斯基时空中与带电无质量标量场耦合的 U(1) 规范场的次超前渐近电荷。我们考虑一个相空间，其中零无穷大上的标量场初始数据具有紧支持，而规范场初始数据允许在延迟（超前）时间内具有逆幂尾部的渐近展开，我们将其称为初始数据尾部。我们确定了零无穷大处的三个有限电荷，它们在散射下守恒。一种是标准次领先软收费的重新规范化版本。第二个是对数电荷，它是零无穷大的未来端和过去端的前导尾部的系数之差。第三个是探测尾部系数平均值的新费用。我们推测第三种电荷与一类新的大规范变换相关，这些变换在延迟时间内线性发散。", "authors": [{"name": "Éanna É. Flanagan"}, {"name": "Zhihan Liu"}], "featured_authors": [{"name": "Éanna É. Flanagan"}, {"name": "Zhihan Liu"}], "author_count": 2}, {"id": "2608.02447", "category": "hep-th", "title": "Rank matching in renormalization-group irreversibility: Exact defect and entropic tests", "abstract": "Why do local subtractions produce renormalization-group monotones in some settings but fail in others? We propose rank matching. Local counterterms fix how many scale derivatives scheme independence requires. Every derivative adds one connected insertion, while the available positivity inputs are bilinear forms or positive second variations and therefore control only quadratic data. Degree one is the last subtraction whose scale derivative stays within their direct reach. First-order subtractions can close when a Ward or entropic identity supplies a signed quadratic form. Higher orders need extra dynamics. Three exactly solvable tests exhibit both outcomes and show that the endpoint inequality can hold while running monotonicity fails. Massive scalars yield nonmonotone filtered free energies on every odd dimensional $p$-sphere with $p\\geq3$. A generalized-free surface-defect $b$-function is strictly monotone when the defect-primary dimension $\\widehat\\Delta$ satisfies $1/2\\leq\\widehat\\Delta<1$, and necessarily nonmonotone for $0<\\widehat\\Delta<1/2$. At the threshold, its flow coefficient is completely monotone in the canonical spectral coordinate, with derivatives of every order alternating in sign. A local four-dimensional monodromy defect realizes the full transition. Under a stated assumption on the large-component entropy limit, disk entropy and sphere free energy share endpoints and total $F$ loss but distribute it differently over scale. Rank matching separates endpoint ordering, running monotonicity, and the distribution of loss over scale.", "url": "https://arxiv.org/abs/2608.02447", "type": "理论", "summary": "为什么局部减法在某些设置中会产生重整化群单调，而在其他设置中会失败？我们建议排名匹配。本地反术语确定了衍生品计划独立性需要多少规模。每个导数都会添加一个连通插入，而可用的正输入是双线性形式或正二阶变体，因此仅控制二次数据。一阶是最后一个减法，其尺度导数保持在其直接范围内。当 Ward 或熵恒等式提供有符号二次形式时，一阶减法可以结束。更高的订单需要额外的动力。三个完全可解的测试显示了这两种结果，并表明在运行单调性失败时端点不等式可以成立。大量标量在具有 $p\\geq3$ 的每个奇数维 $p$ 球面上产生非单调过滤自由能。当缺陷主维 $\\widehat\\Delta$ 满足 $1/2\\leq\\widehat\\Delta<1$ 时，广义自由表面缺陷 $b$ 函数是严格单调的，并且对于 $0<\\widehat\\Delta<1/2$ 必然是非单调的。\n\n在阈值处，其流量系数在规范谱坐标中完全单调，每个阶导数的符号交替。局部四维单色缺陷实现了完全转变。在大成分熵极限的既定假设下，盘熵和球体自由能共享端点和总 $F$ 损失，但在规模上分布不同。排名匹配将端点排序、运行单调性以及损失随规模的分布分开。", "authors": [{"name": "Francesco Scardino"}], "featured_authors": [{"name": "Francesco Scardino"}], "author_count": 1}, {"id": "2608.02452", "category": "hep-th", "title": "Confinement as Decoding: Higher Form Codes and Lattice Yang-Mills Theory", "abstract": "We study the relationship between quantum error correction, confinement, and lattice Yang-Mills theory. We first formulate decoding for finite Abelian homological codes in terms of higher form gauge fields. For positive local noise, the logical classes are topological sectors of a Nishimori ensemble, and the optimal decoding error is determined by the relative weights of the nontrivial sectors. We derive Fourier relations between logical probabilities, disorder operators, and information in the channel environment, and we give contour and fractional moment criteria for a threshold. We then study a four dimensional $\\Z_N$ memory and its possible relation to confining $\\PSU(N)$ vacua. Finally, we define a finite curvature center sheet model coupled to Wilson $\\SU(N)$ link variables. In this model the conditional logical probabilities are center twisted Yang-Mills partition functions. A strong coupling expansion gives the leading effective interaction for the syndrome and shows that local syndrome correlations can decay even when the global sheet sectors are mixed. We also show that the likelihood for a separated pair of syndrome worldlines is the center monopole correlator. Its decay determines a transfer matrix mass. This distinguishes the suppression of global flux sectors from the local spectral information needed to discuss a mass gap.", "url": "https://arxiv.org/abs/2608.02452", "type": "理论", "summary": "我们研究量子纠错、限制和晶格杨-米尔斯理论之间的关系。我们首先根据更高形式的规范场制定有限阿贝尔同调码的解码。对于正局部噪声，逻辑类是西森系综的拓扑扇区，并且最佳解码误差由非平凡扇区的相对权重确定。我们推导出逻辑概率、无序算子和信道环境中的信息之间的傅立叶关系，并给出阈值的轮廓和分数矩标准。然后我们研究四维 $\\Z_N$ 存储器及其与限制 $\\PSU(N)$ 真空的可能关系。最后，我们定义了一个与 Wilson $\\SU(N)$ 连接变量耦合的有限曲率中心片模型。在此模型中，条件逻辑概率是中心扭曲的 Yang-Mills 配分函数。强耦合扩展为综合症提供了领先的有效相互作用，并表明即使全局片扇区混合时，局部综合症相关性也会衰减。我们还表明，一对分离的综合症世界线的可能性是中心单极相关器。\n\n它的衰变决定了传输矩阵质量。这将全局通量扇区的抑制与讨论质量间隙所需的局部光谱信息区分开来。", "authors": [{"name": "Ning Bao"}], "featured_authors": [{"name": "Ning Bao"}], "author_count": 1}, {"id": "2608.00546", "category": "math-ph", "title": "Renormalizations in holomorphic field theories on Kähler manifolds", "abstract": "The divergence of Feynman graph integrals is one of the central issues in the study of perturbative quantum field theories. A rigorous formulation of these integrals usually requires renormalization. In this paper, we prove that the Feynman graph integrals arising from holomorphic field theories on closed real-analytic Kähler manifolds are convergent with respect to heat-kernel renormalization, Cauchy principal value renormalization, and zeta-function renormalization. Moreover, these three renormalization procedures produce the same value. Our proof is based on the theory of wonderful compactifications in algebraic geometry, which provides a geometric understanding of these integrals. As a consequence, we establish a gauge anomaly formula for these graph integrals.", "url": "https://arxiv.org/abs/2608.00546", "type": "理论", "summary": "费曼图积分的散度是微扰量子场论研究的中心问题之一。这些积分的严格公式通常需要重整化。在本文中，我们证明了闭实解析凯勒流形上的全纯场论产生的费曼图积分相对于热核重整化、柯西主值重整化和 zeta 函数重整化是收敛的。此外，这三个重整化过程产生相同的值。我们的证明基于代数几何中奇妙的紧化理论，它提供了对这些积分的几何理解。因此，我们为这些图积分建立了规范异常公式。", "authors": [{"name": "Minghao Wang"}, {"name": "Junrong Yan"}], "featured_authors": [{"name": "Minghao Wang"}, {"name": "Junrong Yan"}], "author_count": 2}, {"id": "2608.00637", "category": "math-ph", "title": "Remarks on Regular Approximations to the Robin Aharonov-Bohm Hamiltonian", "abstract": "In the space $\\mathbb R^3$, for Robin parameter $L>0$, it is shown that there is a family of Schrödinger operators with penetrable toroidal solenoid and variable conductivity that approximates the magnetic Aharonov-Bohm operator with a Robin boundary condition at the solenoid (border). It is also shown that approximations via smooth potentials and then a barrier in the solenoid interior give Dirichlet boundary conditions. The approximations are in the strong resolvent sense and obtained through the $\\Gamma$-convergence technique, and they hold for the more general setting of smooth, closed and compact surfaces and continuous and bounded magnetic potentials.", "url": "https://arxiv.org/abs/2608.00637", "type": "理论", "summary": "在空间 $\\mathbb R^3$ 中，对于 Robin 参数 $L>0$，表明存在一系列具有可穿透环形螺线管和可变电导率的薛定谔算子，其在螺线管（边界）处具有 Robin 边界条件，近似于磁性 Aharonov-Bohm 算子。还表明，通过平滑电势和螺线管内部势垒的近似给出了狄利克雷边界条件。这些近似值具有强解析意义，通过 $\\Gamma$ 收敛技术获得，并且它们适用于光滑、封闭和紧凑表面以及连续和有界磁势的更一般设置。", "authors": [{"name": "Cesar R. de Oliveira"}], "featured_authors": [{"name": "Cesar R. de Oliveira"}], "author_count": 1}, {"id": "2608.00751", "category": "math-ph", "title": "Generalized Marginals of tie -Wigner Distribution nand Lagrangian Tomography", "abstract": "We develop a symplectic formulation of the Lagrangian Radon transform based on the transitive action of the symplectic group on the Lagrangian Grassmannian. This geometric framework naturally extends the classical notion of the marginals of the Wigner transform, viewed as elementary tomograms, to arbitrary Lagrangian subspaces. The resulting generalized tomography provides a unified treatment of position and momentum measurements related by symplectic rotations. As applications, we revisit the Pauli reconstruction problem and establish reconstruction formulas for density operators from generalized Lagrangian tomograms.", "url": "https://arxiv.org/abs/2608.00751", "type": "理论", "summary": "我们基于辛群对拉格朗日格拉斯曼函数的传递作用，开发了拉格朗日 Radon 变换的辛公式。这种几何框架自然地将维格纳变换边缘的经典概念（被视为基本断层图）扩展到任意拉格朗日子空间。由此产生的广义断层扫描提供了对辛旋转相关的位置和动量测量的统一处理。作为应用，我们重新审视泡利重建问题，并根据广义拉格朗日断层图建立密度算子的重建公式。", "authors": [{"name": "Maurice de Gosson"}], "featured_authors": [{"name": "Maurice de Gosson"}], "author_count": 1}, {"id": "2608.00920", "category": "math-ph", "title": "Analysis of Conjectural Improvements to Minkowski's Lower Bound on the Sphere Packing Density", "abstract": "Torquato and Stillinger conjectured an exponential improvement of Minkowski's classical lower bound on the maximal density of sphere packings in high-dimensional Euclidean space $\\mathbb{R}^d$ using a pair-correlation-function optimization framework. Conditional on their realizability conjecture, we show that a simple family of hyperuniform pair correlation functions yields polynomial improvements over Minkowski's lower bound of the form $\\phi_{\\mathrm{max}} \\gtrsim d^\\beta 2^{-d}$ for every fixed $\\beta >1$ in sufficiently high dimensions. As the polynomial exponent is allowed to increase with dimension, this family continuously approaches the previously conjectured exponential improvement. We further derive the same exponential asymptotic rate independently from the Cohn--Elkies dual linear programming upper bound formulation, demonstrating that its radial objective test functions cannot asymptotically exclude packings with the Torquato--Stillinger density scalings. The agreement between these alternative approaches provides new evidence that exceptionally dense disordered sphere packings may exist in high dimensions and strengthens the case for the Torquato--Stillinger conjectural lower bound.", "url": "https://arxiv.org/abs/2608.00920", "type": "理论", "summary": "Torquato 和 Stillinger 使用配对相关函数优化框架推测高维欧几里德空间 $\\mathbb{R}^d$ 中球体堆积最大密度的 Minkowski 经典下界呈指数改进。以他们的可实现性猜想为条件，我们表明，对于每个固定的 $\\beta >1$ 在足够高的维度上，一个简单的超均匀对相关函数族可以对 $\\phi_{\\mathrm{max}} \\gtrsim d^\\beta 2^{-d}$ 形式的 Minkowski 下界产生多项式改进。由于允许多项式指数随维数增加，该族不断接近先前推测的指数改进。我们进一步独立于 Cohn--Elkies 双线性规划上限公式推导出相同的指数渐近率，证明其径向目标测试函数不能渐近排除具有 Torquato--Stillinger 密度标度的堆积。\n\n这些替代方法之间的一致提供了新的证据，表明异常密集的无序球堆积可能存在于高维中，并加强了托卡托-斯蒂林格猜想下界的情况。", "authors": [{"name": "Carlo Vanoni"}, {"name": "Alan Guo"}, {"name": "Salvatore Torquato"}], "featured_authors": [{"name": "Carlo Vanoni"}, {"name": "Alan Guo"}, {"name": "Salvatore Torquato"}], "author_count": 3}, {"id": "2608.01110", "category": "math-ph", "title": "Connes spectral distance on twisted fuzzy torus", "abstract": "In this paper, we study the Connes spectral distance between states on the fuzzy torus. We construct a Dirac operator by commutators and anticommutators. Based on this Dirac operator, we construct a spectral triple of the fuzzy torus. We study some properties of the spectral distance on the fuzzy torus. We find that there is a reciprocal Pythagorean theorem between the spectral distances. We construct a conditional expectation function of the optimal element which can lead to a contraction of the corresponding Lipschitz seminorm. We find that for any diagonal states, the corresponding optimal elements of spectral distances are also diagonal. We explicitly calculate the spectral distances of some simple states, including basic states and some simple mixed states. We find that there are some kinds of cyclic symmetry in both the optimal elements and the spectral distances between the diagonal states. Furthermore, we also construct a fuzzy torus with some type of conformal twist, and study the relation between conformal parameters and spectral distances.", "url": "https://arxiv.org/abs/2608.01110", "type": "理论", "summary": "在本文中，我们研究了模糊环面上状态之间的Connes谱距离。我们通过交换子和反交换子构造一个狄拉克算子。基于这个狄拉克算子，我们构造了模糊环面的谱三元组。我们研究了模糊环上光谱距离的一些性质。我们发现谱距离之间存在倒数毕达哥拉斯定理。我们构造了最优元素的条件期望函数，它可以导致相应的 Lipschitz 半范数的收缩。我们发现对于任何对角态，谱距离对应的最优元素也是对角的。我们明确计算了一些简单态的谱距离，包括基本态和一些简单的混合态。我们发现最优元素和对角态之间的谱距离都存在某种循环对称性。此外，我们还构造了具有某种类型的共形扭曲的模糊环，并​​研究了共形参数与光谱距离之间的关系。", "authors": [{"name": "Zhi-Kang You"}, {"name": "Bing-Sheng Lin"}], "featured_authors": [{"name": "Zhi-Kang You"}, {"name": "Bing-Sheng Lin"}], "author_count": 2}, {"id": "2608.01219", "category": "math-ph", "title": "Dual Variational Principles for Curl Forces", "abstract": "Curl forces are position-dependent, non-conservative, and non-dissipative forces that, in general, cannot be derived from an ordinary potential energy. Consequently, their equations of motion do not, in general, follow from a standard variational principle. In this paper, we present a dual variational formulation for particle dynamics under curl forces. By introducing variables dual to position and velocity and an auxiliary function, we construct a pre-dual action in which the equations of motion act as constraints. Stationarity with respect to the primal variables defines a dual-to-primal mapping, whose substitution into the pre-dual action gives an action expressed entirely in terms of the dual variables. The Euler--Lagrange equations of the dual action recover both the original equations of motion and their prescribed initial conditions. We also introduce an auxiliary dual Hamiltonian that is conserved along stationary dual trajectories, although it does not represent the physical energy. The formulation is illustrated using two nonlinear curl force fields in two and three dimensions and the classical Ziegler column. These examples demonstrate that non-conservative curl-force dynamics can admit variational descriptions even in the absence of an ordinary potential energy or a conventional Lagrangian.", "url": "https://arxiv.org/abs/2608.01219", "type": "理论", "summary": "卷曲力是位置相关的、非保守的、非耗散的力，通常不能从普通势能中导出。因此，它们的运动方程一般不遵循标准变分原理。在本文中，我们提出了旋度力下粒子动力学的双变分公式。通过引入位置和速度对偶变量以及辅助函数，我们构造了一个预对偶动作，其中运动方程充当约束。相对于原始变量的平稳性定义了对偶到原始的映射，其替换到预对偶动作中给出了完全用对偶变量表达的动作。对偶作用的欧拉-拉格朗日方程恢复了原始运动方程及其规定的初始条件。我们还引入了一个辅助对偶哈密顿量，它沿着稳态对偶轨迹守恒，尽管它不代表物理能量。该公式使用二维和三维的两个非线性旋度力场以及经典齐格勒柱进行说明。\n\n这些例子表明，即使在没有普通势能或传统拉格朗日量的情况下，非保守旋度力动力学也可以进行变分描述。", "authors": [{"name": "Arash Yavari"}, {"name": "Amit Acharya"}], "featured_authors": [{"name": "Arash Yavari"}, {"name": "Amit Acharya"}], "author_count": 2}, {"id": "2608.01596", "category": "math-ph", "title": "Beyond $K$-Theory: Geometry and Holomorphy in Hyperbolic Band Theory", "abstract": "Topological $K$-theory supplies the decisive stable classification principle for gapped free-fermion phases in Euclidean crystals once symmetry and stabilization are fixed. In hyperbolic band theory, by contrast, it is less decisive for the full band problem: generalized momentum sectors vary through moduli spaces, but passing to ordinary $K$-classes collapses their geometric and holomorphic variation. We distinguish kinematical holomorphy, in which complex geometry organizes the sector spaces, from dynamical holomorphy, in which that geometry informs a Hamiltonian or projector, and formulate the resulting loss as an observable-factorization problem. For a compact hyperbolic surface $X$, we prove nonfactorization in three settings: fibrewise $K^0(X)$, occupied-state $K^0(B)$, and operator-algebraic $K$-theory. The affected quantities include spectra and Higgs spectral curves, the Berry holonomy and the quantum metric, the partially filled Hall response, and the Fermi surface and nodal geometries. We also identify the quantized pairings and local charges retained by topology. Up to an explicit area factor, the Kotani--Sunada bottom-band Hessian is the Hodge inner product on $H^1(X;\\mathbb R)$. Together with the integral intersection form, it recovers the homology-marked principally polarized Jacobian and hence, by Torelli and uniformization, the underlying complex and hyperbolic surface, though not a full Teichmüller marking. We also separate finite-rank sectors from the thermodynamic bulk. Locally faithful covers reproduce polynomial traces exactly and control continuous spectral observables. In arithmetic congruence towers, analytic observables converge as $O(|G_n|^{-\\eta})$ for some $\\eta>0$, and $C^s$ observables as $O((\\log |G_n|)^{-s})$, while established coherent large-rank limits recover bulk density-of-states moments.", "url": "https://arxiv.org/abs/2608.01596", "type": "理论", "summary": "一旦对称性和稳定性被固定，拓扑 $K$ 理论就为欧几里得晶体中的带隙自由费米子相提供了决定性的稳定分类原理。相比之下，在双曲带理论中，它对于全带问题的决定性较小：广义动量扇区在模空间中变化，但传递到普通的 $K$ 类会破坏它们的几何和全纯变化。我们将运动学全纯与动态全纯区分开来，其中复杂的几何学组织扇形空间，而动态全纯学的几何学为哈密顿量或投影仪提供信息，并将由此产生的损失表述为可观察因式分解问题。对于紧致双曲曲面 $X$，我们在三种设置中证明非因式分解：纤维 $K^0(X)$、占用状态 $K^0(B)$ 和算子代数 $K$ 理论。受影响的量包括光谱和希格斯光谱曲线、贝里完整性和量子度量、部分填充的霍尔响应以及费米表面和节点几何形状。我们还确定了拓扑保留的量化配对和局部电荷。\n\n对于显式面积因子，Kotani-Sunada 底带 Hessian 矩阵是 $H^1(X;\\mathbb R)$ 上的 Hodge 内积。与积分相交形式一起，它恢复了同源标记的主要偏振雅可比行列式，因此通过 Torelli 和均匀化，恢复了底层的复数和双曲表面，尽管不是完整的 Teichmüller 标记。我们还将有限阶扇区与热力学块分开。局部忠实覆盖准确地再现多项式轨迹并控制连续光谱可观测量。在算术同余塔中，对于某些 $\\eta>0$，分析可观测量收敛为 $O(|G_n|^{-\\eta})$，$C^s$ 可观测量收敛为 $O((\\log |G_n|)^{-s})$，同时建立的相干大秩极限恢复体态密度矩。", "authors": [{"name": "Steven Rayan"}], "featured_authors": [{"name": "Steven Rayan"}], "author_count": 1}, {"id": "2608.01878", "category": "math-ph", "title": "Collective superintegrable systems from the Guillemin--Sternberg torus action", "abstract": "We present a novel approach to the superintegrability of collective Hamiltonians invariant under a Hamiltonian action of a connected semisimple compact Lie group, $G$, on a symplectic manifold, $M$. By exploiting a Hamiltonian torus action that goes back to Guillemin and Sternberg [GS,1983], we demonstrate that the functional dimensions of $\\mathfrak{H} := \\mathcal{J}^*(C^\\infty(\\mathfrak{g}^*)^G)$, where $\\mathcal{J}: M \\to \\mathfrak{g}^*$ is the momentum map of the $G$ action, and its centralizer $\\mathfrak{F}$ in $C^\\infty(M)$ satisfy the equality $\\mathrm{ddim}(\\mathfrak{H}) + \\mathrm{ddim}(\\mathfrak{F}) = \\mathrm{dim}(M)$. Together with a non-triviality condition, this ensures that the Abelian Poisson algebra $\\mathfrak{H}\\subset C^\\infty(M)$ represents a superintegrable system, and it also follows that the momentum map of the GS torus action yields action variables for the system. Our work provides a new insight into collective superintegrability complementing earlier results of Bolsinov and Jovanović.", "url": "https://arxiv.org/abs/2608.01878", "type": "理论", "summary": "我们提出了一种新颖的方法，用于在辛流形 $M$ 上的连通半简单紧致李群 $G$ 的哈密顿作用下实现集体哈密顿量不变量的超可积性。通过利用可追溯到 Guillemin 和 Sternberg [GS,1983] 的哈密顿环面作用，我们证明了 $\\mathfrak{H} := \\mathcal{J}^*(C^\\infty(\\mathfrak{g}^*)^G)$ 的函数维度，其中 $\\mathcal{J}: M \\to \\mathfrak{g}^*$ 是 $G$ 作用的动量图，并且$C^\\infty(M)$ 中的集中器 $\\mathfrak{F}$ 满足等式 $\\mathrm{ddim}(\\mathfrak{H}) + \\mathrm{ddim}(\\mathfrak{F}) = \\mathrm{dim}(M)$。与非平凡条件一起，这确保了阿贝尔泊松代数 $\\mathfrak{H}\\subset C^\\infty(M)$ 表示一个超可积系统，并且还可以得出 GS 环面作用的动量图产生系统的作用变量。我们的工作为集体超可积性提供了新的见解，补充了 Bolsinov 和 Jovanović 的早期结果。", "authors": [{"name": "L. Feher"}], "featured_authors": [{"name": "L. Feher"}], "author_count": 1}, {"id": "2608.01996", "category": "math-ph", "title": "Geometric theory of generalised continua using moving frames", "abstract": "Generalised continuum theories couple the macroscopic deformation and the micro-/meso-scopic deformation of an underlying micro-structure. They can account for internal length-scale effects and higher-order mechanical loadings absent from classical Cauchy elasticity and has shown its efficiency in modelling metamaterials. This has led to a proliferation of higher-grade and higher-order models (e.g. strain-gradient, micromorphic, micro-polar) whose underlying kinematic reduction strategies, in particular to reduce the number of material parameters, are rarely identifiable from the free energy alone. It leaves two open issues: the lack of a systematic criterion for selecting an appropriate model, and a persistent ambiguity regarding the physical status of the local frames (''directors of matter'') used in their kinematic description. Are they physical quantities describing the change of state of the given micro-structure or arbitrary kinematic descriptors of its deformation\\,? This work addresses both questions through a gauge-theoretic formulation of generalised continua in finite strains. While relying on tools and modelling choices consistent with the existing geometric literature on continuum mechanics, the present approach departs from it in its objectives, aiming at a unifying classification of available mechanical models rather than the description of a specific microstructural phenomenon such as defects. In this work, generalised configurations are defined as moving frames over classical configurations, and invariance with respect to the reference generalised configuration is shown to be a necessary and sufficient condition for a gauge invariance, recovering the micromorphic theory as the general-purpose theory of the deformation of arbitrary directors of matter. A systematic classification of first-order generalised media follows from structural group reduction, while strain-gradient continua are recovered through convected frames, and finally constrained media (e.g. couple-stress) are addressed.", "url": "https://arxiv.org/abs/2608.01996", "type": "理论", "summary": "广义连续体理论将宏观变形和底层微观结构的微观/介观变形耦合起来。它们可以解释经典柯西弹性中不存在的内部长度尺度效应和高阶机械载荷，并显示出其在超材料建模中的效率。这导致了高级和高阶模型（例如应变梯度、微形态、微极性）的激增，其基本运动学减少策略，特别是减少材料参数的数量，很少仅从自由能中识别出来。它留下了两个悬而未决的问题：缺乏选择适当模型的系统标准，以及关于运动学描述中使用的局部框架（“物质指导者”）的物理状态的持续模糊性。它们是描述给定微观结构状态变化的物理量还是其变形的任意运动学描述符？这项工作通过有限应变中广义连续体的规范理论公式解决了这两个问题。\n\n虽然依赖于与现有连续介质力学几何文献一致的工具和建模选择，但目前的方法在其目标上背离了它，旨在对可用的力学模型进行统一分类，而不是描述缺陷等特定的微观结构现象。在这项工作中，广义构型被定义为经典构型上的移动框架，并且相对于参考广义构型的不变性被证明是规范不变性的充分必要条件，将微态理论恢复为物质任意方向变形的通用理论。一阶广义介质的系统分类源于结构群约简，同时通过对流框架恢复应变梯度连续体，最后解决约束介质（例如应力偶）。", "authors": [{"name": "Boris Kolev"}, {"name": "Cl{é}ment Ecker"}], "featured_authors": [{"name": "Boris Kolev"}, {"name": "Cl{é}ment Ecker"}], "author_count": 2}, {"id": "2608.02028", "category": "math-ph", "title": "A Hamiltonian approach to the CH-KP equation", "abstract": "A model governing quasi-unidirectional wave propagation at the surface of a shallow layer of water is derived from Euler equations by long wave asymptotics together with Hamiltonian reduction techniques. The balance between nonlinearity, dispersion and weak dependence on the second planar coordinate is examined and results in the so-called CH-KP equation, a mildly nonlinear version of the well known Kadomtsev-Petviashvili equation. The Hamiltonian structure of the model is obtained by Dirac reduction from the intermediate step of a fully-nonlinear, long-wave system for stratified fluids. A particular scaling is considered that reduces such system to the one-dimensional CH equation in a limiting case. Examples of weak peakon-type solutions are provided, chosen to illustrate the collision behavior supported by the limiting equation.", "url": "https://arxiv.org/abs/2608.02028", "type": "理论", "summary": "控制浅水层表面准单向波传播的模型是通过长波渐进和哈密顿量约简技术从欧拉方程导出的。检查非线性、色散和对第二平面坐标的弱依赖性之间的平衡，并得出所谓的 CH-KP 方程，这是众所周知的 Kadomtsev-Petviashvili 方程的轻度非线性版本。该模型的哈密顿结构是通过分层流体的完全非线性长波系统的中间步骤的狄拉克简化获得的。考虑在极限情况下将此类系统简化为一维 CH 方程的特定缩放。提供了弱 Peakon 型解的示例，选择这些示例来说明限制方程支持的碰撞行为。", "authors": [{"name": "R. Camassa"}, {"name": "G. Falqui"}, {"name": "E. Sforza"}], "featured_authors": [{"name": "R. Camassa"}, {"name": "G. Falqui"}, {"name": "E. Sforza"}], "author_count": 3}, {"id": "2608.02057", "category": "math-ph", "title": "Quantum Vortices in a Boundary Layer: New Results and Perspectives", "abstract": "Here, we investigate the motion of a thin circular quantum vortex filament near the infinite planar surface. The fluid surrounding this surface moves with a non-zero velocity $\\bf{v}$, which is parallel to the surface. We study the specific features of this quantum system and show that they are quite suitable for the boundary layer theory. The developed model allows us to calculate the vortex energy spectrum, $E = E({\\bf p})$, where ${\\bf p}$ is the total momentum of a vortex ring. We have demonstrated that this function has complex non-trivial dependence on the velocity $\\bf{v}$. It is stated that the inverse effective mass of a vortex under consideration is of a tensorial nature. In certain quantum states, the system shows the possibility of both negative and positive effective mass existing. This study employs a novel quantization method for classical closed vortex filaments, developed by the author earlier.", "url": "https://arxiv.org/abs/2608.02057", "type": "理论", "summary": "在这里，我们研究了无限平面附近细圆形量子涡旋丝的运动。该表面周围的流体以非零速度 $\\bf{v}$ 移动，该速度与表面平行。我们研究了这个量子系统的具体特征，并表明它们非常适合边界层理论。开发的模型使我们能够计算涡旋能谱，$E = E({\\bf p})$，其中${\\bf p}$是涡环的总动量。我们已经证明该函数对速度 $\\bf{v}$ 具有复杂的非平凡依赖性。据称，所考虑的涡流的逆有效质量具有张量性质。在某些量子态下，系统显示出负有效质量和正有效质量同时存在的可能性。本研究采用了作者之前开发的一种新颖的经典闭合涡旋细丝量化方法。", "authors": [{"name": "Sergei V. Talalov"}], "featured_authors": [{"name": "Sergei V. Talalov"}], "author_count": 1}, {"id": "2608.02179", "category": "math-ph", "title": "$q$-Deformed Topological Recursion: Quantum Curves and Non-perturbative Analysis", "abstract": "This work investigates the $q$-deformation of $(r,s)$-Airy structures and their realization via $q$-difference operators, providing a bridge between quantum spectral curves and integrable systems. We construct an all-order $q$-WKB solution for the matrix systems associated with the $q$-quantized curve $E_q(x,y)=0$. We demonstrate that the resulting non-perturbative connected $q$-amplitudes satisfy a set of shifted $q$-loop equations, which can be interpreted as the Ward identities of a $q$-deformed $\\mathcal{W}(\\mathfrak{gl}_r)$ algebra. Our main result provides a rigorous classification of admissible $(r,s,q)$ pairs and $q$-Casimir configurations that satisfy the $q$-topological type property. This ensures that the semi-classical expansion is uniquely governed by the $q$-topological recursion, offering new insights into the $q$-quantization of mirror curves and their underlying algebraic structures.", "url": "https://arxiv.org/abs/2608.02179", "type": "理论", "summary": "这项工作研究了 $(r,s)$-艾里结构的 $q$-变形及其通过 $q$-差分算子的实现，在量子谱曲线和可积系统之间架起了一座桥梁。我们为与 $q$ 量化曲线 $E_q(x,y)=0$ 相关的矩阵系统构造一个全阶 $q$-WKB 解。我们证明了所得的非微扰连通 $q$-振幅满足一组移位的 $q$-循环方程，它可以解释为 $q$-变形的 $\\mathcal{W}(\\mathfrak{gl}_r)$ 代数的 Ward 恒等式。我们的主要结果提供了可接受的 $(r,s,q)$ 对和满足 $q$-拓扑类型属性的 $q$-Casimir 配置的严格分类。这确保了半经典展开式由 $q$-拓扑递归唯一控制，为镜像曲线的 $q$-量化及其底层代数结构提供了新的见解。", "authors": [{"name": "Fridolin Melong"}, {"name": "Raimar Wulkenhaar"}], "featured_authors": [{"name": "Fridolin Melong"}, {"name": "Raimar Wulkenhaar"}], "author_count": 2}, {"id": "2608.02543", "category": "math-ph", "title": "On the local conformal structure of Imaginary Liouville theory", "abstract": "Imaginary Liouville theory was recently proposed as a path integral construction of a non-rational conformal field theory (CFT) with central charge less than one (Usciati et al. 2026). In the present work, we establish Ward identities and Belavin-Polyakov-Zamolodchikov differential equations in this framework, assuming a precise conjecture on the decay of the Laplace transform of Imaginary Gaussian multiplicative chaos. These results provide a first step towards a rigorous implementation of the conformal bootstrap program for conformal field theories with central charge lower than one. This work is the first to investigate the intrinsic properties of Imaginary Liouville theory beyond exact computations.", "url": "https://arxiv.org/abs/2608.02543", "type": "理论", "summary": "虚部刘维尔理论最近被提出作为中心电荷小于 1 的非有理共形场理论 (CFT) 的路径积分构造 (Usciati et al. 2026)。在本工作中，我们在此框架中建立了 Ward 恒等式和 Belavin-Polyakov-Zamolodchikov 微分方程，假设对虚高斯乘法混沌的拉普拉斯变换的衰变进行了精确猜想。这些结果为严格实施中心电荷低于 1 的共形场论的共形自举程序提供了第一步。这项工作是第一个研究虚数刘维尔理论超越精确计算的内在属性的工作。", "authors": [{"name": "Baptiste Cerclé"}, {"name": "Romain Usciati"}], "featured_authors": [{"name": "Baptiste Cerclé"}, {"name": "Romain Usciati"}], "author_count": 2}, {"id": "2608.00055", "category": "quant-ph", "title": "Symmetry-initialized quantum Gibbs sampling: a non-Abelian asymmetry cascade", "abstract": "For a quantum Gibbs sampler whose mixing bottleneck is a weakly broken symmetry, I show that the correct initialization is determined by representation theory. I first prove a general speedup-versus-prefactor dichotomy: by exactly eliminating slow-mode overlap, I convert a nominal prefactor reduction into a fundamental, asymptotic acceleration of the system's mixing time. I then show that when the bottleneck is a weakly broken symmetry, the otherwise exponentially expensive bottleneck eigenvector is the symmetry this http URL a non-Abelian group $G$, I prove that the correct initialization target is the group-averaging asymmetry. Projecting this asymmetry out requires a $G$-invariant input. Partial, subgroup-invariant inputs produce a cascade of mixing-time speedups indexed by the subgroup lattice. Conversely, matching first moments alone is provably this http URL asymmetry is a directly measurable initialization target. I verify these results analytically and numerically in an $SU(2)$ Davies sampler where total-spin multiplets constitute the slow modes. The predicted speedup cascade emerges with relaxation rates scaling linearly with the symmetry-breaking parameter. Finally, the model maps the boundaries of the asymmetry target, illustrating where the separate matching of conserved logical data becomes necessary.", "url": "https://arxiv.org/abs/2608.00055", "type": "理论+数值", "summary": "对于混合瓶颈是弱破缺对称性的量子吉布斯采样器，我证明了正确的初始化是由表示论确定的。我首先证明了一般加速与前因子二分法：通过精确消除慢模式重叠，我将名义前因子减少转换为系统混合时间的基本渐近加速。然后，我证明，当瓶颈是弱对称性破缺时，否则指数昂贵的瓶颈特征向量是该 http URL 的对称性，非阿贝尔群 $G$，我证明正确的初始化目标是组平均不对称性。投影这种不对称性需要 $G$ 不变的输入。部分、子组不变的输入产生由子组格索引的级联混合时间加速。相反，仅匹配第一时刻即可证明此 http URL 不对称性是可直接测量的初始化目标。我在 $SU(2)$ Davies 采样器中通过分析和数值验证了这些结果，其中总自旋多重态构成了慢模式。预测的加速级联随着弛豫率与对称破缺参数线性缩放而出现。\n\n最后，该模型映射了不对称目标的边界，说明了哪些地方需要单独匹配保守的逻辑数据。", "authors": [{"name": "Soo-Jong Rey"}], "featured_authors": [{"name": "Soo-Jong Rey"}], "author_count": 1}, {"id": "2608.00108", "category": "quant-ph", "title": "Canonical quantization of the Pais-Uhlenbeck oscillator with a higher-derivative perturbation: a covariant phase space approach", "abstract": "In this paper, we apply the covariant phase space formalism to the perturbative canonical quantization of the Pais-Uhlenbeck oscillator, with the acceleration-squared term treated as a perturbation. We quantize this model by constructing the symplectic form on the low-energy solution space. We then compute the energy spectrum and the unequal-time commutator in a perturbative way, and obtain the results that agree with the expansion of the exact low-energy theory. The perturbation method bypasses the standard Ostrogradsky construction and naturally decouples the Ostrogradsky ghost. This work extends our previous perturbative quantization scheme to genuine higher-derivative theories.", "url": "https://arxiv.org/abs/2608.00108", "type": "理论", "summary": "在本文中，我们将协变相空间形式应用于 Pais-Uhlenbeck 振荡器的微扰正则量化，并将加速度平方项视为微扰。我们通过在低能解空间上构造辛形式来量化该模型。然后我们以微扰的方式计算了能谱和不等时换向器，得到了与精确低能理论的展开一致的结果。该扰动方法绕过了标准的奥斯特罗格拉茨基构造并自然地解耦了奥斯特罗格拉茨基幽灵。这项工作将我们之前的微扰量化方案扩展到真正的高导数理论。", "authors": [{"name": "Jie-qiang Wu"}, {"name": "Jinan Zhao"}], "featured_authors": [{"name": "Jie-qiang Wu"}, {"name": "Jinan Zhao"}], "author_count": 2}, {"id": "2608.00189", "category": "quant-ph", "title": "Phase transitions in quantum-circuit compilation", "abstract": "Quantum-circuit compilation aims at finding an optimized realization of a target circuit under given constraints, e.g., the minimization of hardware-induced errors and the unitary-equivalence of the circuit. We connect the compilation process with the thermodynamics of a many-body spin system: circuit infidelity plays the role of the energy function and low-temperature states correspond to compiled circuits. In the paradigmatic case where crosstalk between parallel gates is present, we find a phase transition between a disordered phase and an antiferromagnetic brick-wall phase, compatible with the Ising universality class. At larger crosstalk, we observe a $\\mathbb{Z}_3$-ordered regime, suggesting that increasingly serial compiled circuits are associated with emergent $\\mathbb{Z}_n$-ordered phases. When the unitary-equivalence constraint is removed, these phases disappear, showing that the equivalence between circuits underlies the emergent criticality and constitutes a source of complexity in quantum-circuit compilation and, more generally, in equivalence-constrained optimization. Finally, we observe that the Kolmogorov complexity of the circuit enhances the emergence of ordered phases.", "url": "https://arxiv.org/abs/2608.00189", "type": "理论+数值", "summary": "量子电路编译的目的是在给定的约束下找到目标电路的优化实现，例如硬件引起的错误的最小化和电路的酉等价。我们将编译过程与多体自旋系统的热力学联系起来：电路不忠实起到能量函数的作用，低温状态对应于编译电路。在平行门之间存在串扰的典型情况下，我们发现无序相和反铁磁砖墙相之间的相变，与伊辛普适性等级兼容。在较大的串扰下，我们观察到 $\\mathbb{Z}_3$ 有序状态，这表明越来越多的串行编译电路与新兴的 $\\mathbb{Z}_n$ 有序阶段相关。当酉等价约束被移除时，这些阶段就消失了，这表明电路之间的等价性是新兴关键性的基础，并构成了量子电路编译以及更一般地等价约束优化中复杂性的来源。\n\n最后，我们观察到电路的柯尔莫哥洛夫复杂性增强了有序相的出现。", "authors": [{"name": "Andrea De Girolamo"}, {"name": "Davide Rattacaso"}, {"name": "Simone Notarnicola"}, {"name": "Ilaria Siloi"}, {"name": "Simone Montangero"}], "featured_authors": [{"name": "Andrea De Girolamo"}, {"name": "Davide Rattacaso"}, {"name": "Simone Notarnicola"}, {"name": "Ilaria Siloi"}, {"name": "Simone Montangero"}], "author_count": 5}, {"id": "2608.00224", "category": "quant-ph", "title": "Marked vertex search on disordered graphs with Rosenzweig-Porter phases", "abstract": "Quantum marked vertex search algorithms are known to outperform their classical counterparts, yet their behavior in the presence of disorder remains largely unexplored. Here, we address this gap by studying marked vertex search on disordered random graphs. To introduce disorder, we implement the Rosenzweig-Porter (RP) model, a random matrix ensemble with tunable ergodic, non-ergodic extended, and localized phases, on Erdős-Rényi (ER) graphs. This produces a doubly random system where ER graph connectivity randomizes which interactions exist, while RP disorder controls their strength and `on-site' potentials, providing a two-parameter framework to study quantum dynamics on disordered networks. First, we show that the characteristic Wigner-Dyson-to-Poisson spectral crossover of the RP ensemble survives under graph constraints across the sparse-to-dense range, and we derive an analytical estimate for the finite-size localization boundary that shifts systematically with the graph edge probability $p$, consistent with a resonant-hybridization argument. Thereafter, using this disordered graph ensemble, we study the marked vertex search problem and find that search performance tracks the underlying quantum phase directly. Counterintuitively, the ergodic phase, despite supporting fast transport, yields lower success probability than the localized phase, which achieves high success probability at the cost of significantly longer search times. These results establish a direct and quantitative link between random matrix disorder on graphs and the performance of continuous-time quantum walk search, and suggest that disorder, rather than being merely an obstacle, can be exploited as a tunable parameter in quantum search protocols.", "url": "https://arxiv.org/abs/2608.00224", "type": "理论+数值", "summary": "众所周知，量子标记顶点搜索算法的性能优于经典算法，但它们在无序情况下的行为在很大程度上仍未得到探索。在这里，我们通过研究无序随机图上的标记顶点搜索来解决这个差距。为了引入无序性，我们在 Erdős-Rényi (ER) 图上实现了 Rosenzweig-Porter (RP) 模型，这是一个具有可调遍历、非遍历扩展和局部相位的随机矩阵系综。这产生了一个双重随机系统，其中 ER 图连通性随机化存在的相互作用，而 RP 无序控制它们的强度和“现场”电位，提供了一个双参数框架来研究无序网络上的量子动力学。首先，我们证明了 RP 系综的特征维格纳-戴森到泊松谱交叉在稀疏到密集范围内的图约束下仍然存在，并且我们得出了有限尺寸局部化边界的分析估计，该边界随着图边缘概率 $p$ 系统地移动，与共振杂交论证一致。\n\n此后，使用这种无序图系综，我们研究了标记顶点搜索问题，发现搜索性能直接跟踪底层量子相位。与直觉相反，尽管遍历阶段支持快速传输，但其成功概率低于局部阶段，而局部阶段以显着更长的搜索时间为代价实现了高成功概率。这些结果在图上的随机矩阵无序与连续时间量子游走搜索的性能之间建立了直接和定量的联系，并表明无序不仅仅是一个障碍，可以被用作量子搜索协议中的可调参数。", "authors": [{"name": "Sabyasachi Chakraborty"}, {"name": "Tilen Cadez"}, {"name": "Sonjoy Majumder"}, {"name": "Rohit Kishan Ray"}], "featured_authors": [{"name": "Sabyasachi Chakraborty"}, {"name": "Tilen Cadez"}, {"name": "Sonjoy Majumder"}, {"name": "Rohit Kishan Ray"}], "author_count": 4}, {"id": "2608.00225", "category": "quant-ph", "title": "Dissipation in Periodically Driven Quantum Systems: Partial Secularization and Thermodynamic Consistency", "abstract": "Periodically driven open quantum systems are central to quantum thermodynamics and quantum control. These systems are typically described using Floquet-Born-Markov master equations, derived with the use of a full secular approximation, and whose thermodynamic implications are often overlooked. In this context, we show that such a strong secular approximation may lead to unphysical predictions for steady state energy currents. We then demonstrate that a coarse-grained formulation of the master equation can regularize these issues while yielding completely positive dynamics and consistent energy currents. The coarse-graining time has a clear physical interpretation, as it defines the temporal resolution at which a Markovian master equation can describe the evolution of the periodically driven system. We show the consistency and validity of our approach by comparing to an exact non-Markovian simulation in paradigmatic examples: a driven two-level system and a three-level maser coupled to hot and cold thermal reservoirs. Our work provides a practical framework for correctly applying the secular approximation in periodically driven-dissipative systems and for assessing the accuracy of master equations of the GKSL form.", "url": "https://arxiv.org/abs/2608.00225", "type": "理论+数值", "summary": "周期性驱动的开放量子系统是量子热力学和量子控制的核心。这些系统通常使用 Floquet-Born-Markov 主方程来描述，该方程是使用完全长期近似导出的，其热力学含义常常被忽视。在这种情况下，我们表明，如此强的长期近似可能会导致对稳态能量流的非物理预测。然后，我们证明主方程的粗粒度公式可以规范这些问题，同时产生完全正的动力学和一致的能量流。粗粒度时间具有明确的物理解释，因为它定义了马尔可夫主方程可以描述周期性驱动系统的演化的时间分辨率。我们通过与典型示例中的精确非马尔可夫模拟进行比较来展示我们方法的一致性和有效性：驱动的两级系统和耦合到冷热热储层的三级微波激射器。\n\n我们的工作为在周期性驱动耗散系统中正确应用长期近似以及评估 GKSL 形式主方程的准确性提供了一个实用的框架。", "authors": [{"name": "Luísa T. Tude"}, {"name": "Carlos Ortega-Taberner"}, {"name": "Roberta Zambrini"}, {"name": "Gonzalo Manzano"}], "featured_authors": [{"name": "Luísa T. Tude"}, {"name": "Carlos Ortega-Taberner"}, {"name": "Roberta Zambrini"}, {"name": "Gonzalo Manzano"}], "author_count": 4}, {"id": "2608.00265", "category": "quant-ph", "title": "No low-degree tests for quantum states", "abstract": "We study the problem of testing low-degree phase states, namely m-qudit quantum states of the form $q^{-m/2} \\sum_{x \\in \\mathbb{F}_q^m} \\omega^{f(x)} |x>$, where $f$ is a degree-$d$ polynomial. In contrast to the classical setting, where low-degree polynomials admit highly efficient classical testers, it is not known whether analogous quantum tests exist. We show that no such quantum low-degree test exists: any tester requires $\\Omega(\\binom{\\lfloor m/2\\rfloor}{\\lfloor (d-1)/2 \\rfloor})$ copies to determine whether a given state is a degree-$d$ phase state or is far from every such state. Our results follow from a general framework that relates quantum testing of codeword phase states to classical decoding properties of the dual code, which allows us to leverage known bounds on the tolerance of high-rate Reed--Muller codes to random errors.", "url": "https://arxiv.org/abs/2608.00265", "type": "理论", "summary": "我们研究测试低次相态的问题，即 $q^{-m/2} \\sum_{x \\in \\mathbb{F}_q^m} \\omega^{f(x)} |x>$ 形式的 m-qudit 量子态，其中 $f$ 是 $d$ 次多项式。与低次多项式允许高效经典测试仪的经典设置相反，尚不清楚是否存在类似的量子测试。我们表明，不存在这样的量子低度测试：任何测试人员都需要 $\\Omega(\\binom{\\lfloor m/2\\rfloor}{\\lfloor (d-1)/2 \\rfloor})$ 副本来确定给定状态是否是度 $d$ 相状态或远离每个这样的状态。我们的结果遵循一个通用框架，该框架将码字相态的量子测试与双码的经典解码属性联系起来，这使我们能够利用高速率里德-穆勒码对随机错误的容忍度的已知界限。", "authors": [{"name": "Omar Alrabiah"}, {"name": "Srinivasan Arunachalam"}, {"name": "Sabee Grewal"}, {"name": "John Wright"}], "featured_authors": [{"name": "Omar Alrabiah"}, {"name": "Srinivasan Arunachalam"}, {"name": "Sabee Grewal"}, {"name": "John Wright"}], "author_count": 4}, {"id": "2608.00365", "category": "quant-ph", "title": "Hamiltonian Thresholds for Objective Records", "abstract": "Classical objectivity requires an environment to witness a pointer value, not merely to decohere it. We derive microscopic Hamiltonian laws for this distinction. Exact QND product monitoring yields a certified two-edge strong-Darwinism window: sufficient witnesses cross the optimal record-discrimination edge while retaining an unobserved complement that crosses the residual-coherence edge. Under additional regularity assumptions, the supplement gives converse bounds at the same logarithmic scale. For controlled-phase monitors, environmental asymmetry gives a single-fragment information bound, a redundancy converse, and, in efficient i.i.d. streams, an achievable block-capacity law for redundant witnesses. A finite-temperature spin-phase bath shows the physical separation: hot probes can decohere efficiently while losing the local asymmetry needed for objective witnesses.", "url": "https://arxiv.org/abs/2608.00365", "type": "理论", "summary": "经典客观性需要一个环境来见证指针值，而不仅仅是去相干它。我们推导出这种区别的微观哈密顿定律。精确的 QND 产品监控产生了经过认证的双边缘强达尔文主义窗口：足够的见证人跨越最佳记录歧视边缘，同时保留跨越剩余相干边缘的未观察到的补充。在额外的规律性假设下，补充给出了相同对数尺度的相反界限。对于受控相位监视器，环境不对称给出了单片段信息界限、冗余逆，并且在有效的 i.i.d. 中。 Streams，针对冗余证人的可实现的块容量法。有限温度自旋相浴显示了物理分离：热探针可以有效地退相干，同时失去客观见证所需的局部不对称性。", "authors": [{"name": "Jie Gu"}], "featured_authors": [{"name": "Jie Gu"}], "author_count": 1}, {"id": "2608.00414", "category": "quant-ph", "title": "Sparse Quantum State Preparation with Sublinear T-Count", "abstract": "We study the fault-tolerant cost of preparing sparse quantum states, measured by $T$-count in the Clifford+$T$ model. Here an $n$-qubit state is called $s$-sparse if it is supported on at most $s$ computational-basis states. For arbitrary $n$-qubit states, the optimal $T$-count is $\\Theta(\\sqrt{2^n\\log(1/\\epsilon)}+\\log(1/\\epsilon))$, but for $s$-sparse states the best previous upper bounds remained linear in $s$. We show that any $n$-qubit $s$-sparse state can be prepared up to error $\\epsilon$ using $\\widetilde{O}(\\min\\{s,\\ n^{3/4}\\sqrt{s}\\}+\\sqrt{s\\log(1/\\epsilon)}+\\log(1/\\epsilon))$ $T$ gates, giving the first sublinear dependence on $s$ once the support is sufficiently large. Our approach is based on a support-aware synthesis theorem for sparse Boolean functions, which may be of independent interest. We also prove that, for every $0<\\epsilon\\le 1/6$ and $2\\le s\\le 2^{n/2}$, sparse-state preparation requires $\\Omega(\\min\\{s,\\sqrt{ns}\\})$ $T$ gates, showing that linear dependence on $s$ is unavoidable in the small-support regime and substantially narrowing the gap between the known upper and lower bounds within this parameter range.", "url": "https://arxiv.org/abs/2608.00414", "type": "理论", "summary": "我们研究了准备稀疏量子态的容错成本，通过 Clifford+$T$ 模型中的 $T$ 计数来衡量。这里，如果最多 $s$ 计算基础状态支持 $n$ 量子位状态，则称为 $s$-稀疏状态。对于任意 $n$-qubit 状态，最佳 $T$-count 是 $\\Theta(\\sqrt{2^n\\log(1/\\epsilon)}+\\log(1/\\epsilon))$，但对于 $s$-稀疏状态，之前的最佳上限在 $s$ 中保持线性。我们证明，任何 $n$-qubit $s$ 稀疏状态都可以使用 $\\widetilde{O}(\\min\\{s,\\ n^{3/4}\\sqrt{s}\\}+\\sqrt{s\\log(1/\\epsilon)}+\\log(1/\\epsilon))$ $T$ 门准备到错误 $\\epsilon$，一旦支持足够大，就会给出对 $s$ 的第一个亚线性依赖。我们的方法基于稀疏布尔函数的支持感知综合定理，这可能是独立的兴趣。我们还证明，对于每个 $0<\\epsilon\\le 1/6$ 和 $2\\le s\\le 2^{n/2}$，稀疏状态准备需要 $\\Omega(\\min\\{s,\\sqrt{ns}\\})$ $T$ 个门，这表明在小支持状态下对 $s$ 的线性依赖是不可避免的，并且大大缩小了该参数范围内已知上限和下限之间的差距。", "authors": [{"name": "Jingquan Luo"}, {"name": "Lvzhou Li"}], "featured_authors": [{"name": "Jingquan Luo"}, {"name": "Lvzhou Li"}], "author_count": 2}, {"id": "2608.00443", "category": "quant-ph", "title": "Trading Imaginary Time for Randomness in Ground State Preparation", "abstract": "Imaginary-time evolution (ITE) is a foundational method for ground state preparation on quantum computers. However, because ITE is non-unitary, existing implementations incur a sample complexity and/or classical cost that scales exponentially with the target imaginary time $\\beta$. Moreover, the state itself converges slower than the energy, making accurate estimation of arbitrary ground state observables even more expensive. In this work, we improve upon standard ITE by introducing twirled imaginary-time evolution (TITE), which pairs ITE with real-time evolution applied for a random duration drawn from a carefully designed distribution. We prove that this randomization quadratically suppresses the trace distance to the ground state, and thus also the error of arbitrary observables, which allows roughly half of the imaginary time to be replaced with real-time evolution ($\\beta \\mapsto \\beta/2$) while maintaining the same level of accuracy. Because real-time evolution is unitary and does not incur an overhead in sample complexity or classical computation, this affords a quadratic reduction in the cost of any black-box ITE implementation, including Trotterization and quantum imaginary-time evolution. We demonstrate the efficiency of our algorithm in noisy circuit-level simulations of a non-integrable Ising chain, showing substantial improvements over standard ITE.", "url": "https://arxiv.org/abs/2608.00443", "type": "数值", "summary": "虚时演化（ITE）是量子计算机基态准备的基本方法。然而，由于 ITE 是非单一的，现有的实现会产生样本复杂性和/或经典成本，其随目标虚数时间 $\\beta$ 呈指数级增长。此外，态本身的收敛速度比能量慢，使得任意基态可观测量的精确估计更加昂贵。在这项工作中，我们通过引入旋转虚时演化 (TITE) 来改进标准 ITE，它将 ITE 与应用于从精心设计的分布中抽取的随机持续时间的实时演化配对。我们证明这种随机化二次方抑制了到基态的迹线距离，从而抑制了任意可观测值的误差，这使得大约一半的虚时间被实时演化（$\\beta \\mapsto \\beta/2$）取代，同时保持相同水平的精度。\n\n由于实时演化是单一的，不会产生样本复杂性或经典计算的开销，因此任何黑盒 ITE 实现（包括 Trotterization 和量子虚数时间演化）的成本都会成倍降低。我们在不可积 Ising 链的噪声电路级模拟中展示了我们的算法的效率，显示出相对于标准 ITE 的显着改进。", "authors": [{"name": "Alvan Arulandu"}, {"name": "John M. Martyn"}, {"name": "Isaac L. Chuang"}], "featured_authors": [{"name": "Alvan Arulandu"}, {"name": "John M. Martyn"}, {"name": "Isaac L. Chuang"}], "author_count": 3}, {"id": "2608.00550", "category": "quant-ph", "title": "Multiparameter quantum estimation in a photon system induced by gravitational redshift", "abstract": "As photons propagate through curved spacetime, gravitational effects become unavoidable. In particular, gravitational redshift can induce significant distortion in photon wave packets, making it es?sential to investigate parameter estimation within this context. While previous research has focused on single-parameter estimation using the quantum Cramer-Rao bound, the multiparameter scenario remains largely unexplored. In this work, we investigate multiparameter quantum estimation for a photon system subject to gravitational redshift under both amplitude-damping and Ohmic-like dephasing channels. Our analysis reveals that the quantum Cramer-Rao bound fails to provide a tight error bound for the two-parameter estimation involving the initial phase and weight parameters inboth types of noisy channels. To overcome this limitation, we numerically compute two tighter error bounds, i.e., the Holevo Cramer-Rao bound and the Nagaoka bound, when utilizing a semidefinite program. We demonstrate that the Nagaoka bound yields the tightest error bound among all considered bounds, consistent with the general hierarchy of multiparameter quantum estimation. Furthermore, for the three-parameter estimation, including the initial weight parameter, the phase parameter, and the strength of gravitational redshift, we observe significantly enhanced estimation precision in the strong-coupling regime compared to the weak-coupling regime under the amplitude-damping channel. Similarly, in the Ohmic-like dephasing channel, the sub-Ohmic regime consistently affords higher precision than the Ohmic and super-Ohmic regimes.", "url": "https://arxiv.org/abs/2608.00550", "type": "理论+数值", "summary": "当光子穿过弯曲时空传播时，引力效应变得不可避免。特别是，引力红移会引起光子波包的显着畸变，因此有必要研究这种情况下的参数估计。虽然之前的研究主要集中在使用量子 Cramer-Rao 界进行单参数估计，但多参数场景在很大程度上仍未得到探索。在这项工作中，我们研究了在振幅阻尼和类欧姆相移通道下受到引力红移影响的光子系统的多参数量子估计。我们的分析表明，量子 Cramer-Rao 界无法为涉及两种类型噪声通道中的初始相位和权重参数的双参数估计提供严格的误差界。为了克服这一限制，我们在使用半定程序时以数值方式计算两个更严格的误差界，即 Holevo Cramer-Rao 界和 Nagaoka 界。我们证明，Nagaoka 界限在所有考虑的界限中产生最严格的误差界限，与多参数量子估计的一般层次结构一致。\n\n此外，对于三参数估计，包括初始权重参数、相位参数和引力红移强度，我们观察到与振幅阻尼通道下的弱耦合机制相比，强耦合机制的估计精度显着提高。类似地，在类欧姆相移通道中，亚欧姆状态始终提供比欧姆和超欧姆状态更高的精度。", "authors": [{"name": "Wei Ye"}, {"name": "Hui Cao"}, {"name": "Songtao Zhang"}, {"name": "Xiang Zhu"}, {"name": "Huan Zhang"}, {"name": "Ying Xia"}, {"name": "Shixun You"}, {"name": "Daisheng Zhang"}, {"name": "Shoukang Chang"}], "featured_authors": [{"name": "Wei Ye"}, {"name": "Hui Cao"}, {"name": "Songtao Zhang"}, {"name": "Shixun You"}, {"name": "Daisheng Zhang"}, {"name": "Shoukang Chang"}], "author_count": 9}, {"id": "2608.00560", "category": "quant-ph", "title": "Adaptive operator-generated subspaces for effective many-body Hamiltonians", "abstract": "Electronic-structure and embedding workflows terminate in effective many-body Hamiltonians, whereas quantum eigensolver studies often start from hand-built qubit models. We present the Adaptive Clifford-Algebra Subspace Eigensolver (A-CASE), a single-reference, operator-generated Rayleigh--Ritz method. Overlap, Hamiltonian, observable, and response matrices are reconstructed from one shared Pauli-expectation bank, while adaptive growth scores overlap-aware local pencils and rejects symmetry leakage or near-linear dependence. A strict FCIDUMP adapter supplies the active-space boundary. For linear H$_4$ in STO-3G with CAS(4e,4o), the mapped sector agrees with independent determinant FCI to $3.1\\times10^{-15}$ Ha. At a nine-vector budget A-CASE has a $3.019$ mHa error; replacing the determinant reference by a two-operator ADAPT-VQE state reduces it to $0.342$ mHa, without implying a matched total-cost advantage. Under a matched contract, the fixed-reference route uses one state preparation versus ADAPT-VQE's ninety but measures roughly an order of magnitude more Pauli words. Exact fixed-angle ADAPT-GCIM gives $13.364$ mHa at the nearest size match and $10.674$ mHa at the iteration match, with its transition-pair burden reported separately. Across a broader benchmark ladder, fixed Krylov bases are generally more accurate and often narrower but substantially less well conditioned. A grouped bootstrap propagates finite-shot variability through thresholding, diagonalization, root matching, spectral weights, susceptibility, and broadening; its bands are explicitly heuristic and conditional, not finite-sample confidence certificates. The work establishes an executable path from an interchange Hamiltonian to energies, correlations, and response, without claiming materials accuracy, favorable scaling, or quantum advantage.", "url": "https://arxiv.org/abs/2608.00560", "type": "理论+数值", "summary": "电子结构和嵌入工作流程以有效的多体哈密顿量结束，而量子本征求解器研究通常从手工构建的量子位模型开始。我们提出了自适应克利福德代数子空间特征求解器 (A-CASE)，这是一种单参考、算子生成的 Rayleigh-Ritz 方法。重叠矩阵、哈密顿矩阵、可观测矩阵和响应矩阵是从一个共享的泡利期望库重建的，而自适应增长分数重叠感知局部铅笔并拒绝对称泄漏或近线性依赖性。严格的 FCIDUMP 适配器提供活动空间边界。对于具有 CAS(4e,4o) 的 STO-3G 中的线性 H$_4$，映射扇区与独立行列式 FCI 一致为 $3.1\\times10^{-15}$ Ha。在九矢量预算下，A-CASE 的误差为 $3.019$ mHa；用两个算子 ADAPT-VQE 状态替换行列式参考可将其降低至 $0.342$ mHa，但并不意味着具有匹配的总成本优势。根据匹配的合同，固定参考路线使用一个状态准备，而 ADAPT-VQE 使用 90 个状态准备，但测量的泡利词大约多一个数量级。\n\n精确的固定角度 ADAPT-GCIM 在最接近的尺寸匹配处给出 $13.364$ mHa，在迭代匹配处给出 $10.674$ mHa，其过渡对负担单独报告。在更广泛的基准阶梯上，固定的克雷洛夫基地通常更准确，而且通常更窄，但条件明显较差。分组引导通过阈值化、对角化、根匹配、谱权重、敏感性和展宽来传播有限样本的可变性；它的范围是明确的启发式和条件性的，而不是有限样本的置信度证书。这项工作建立了一条从交换哈密顿量到能量、相关性和响应的可执行路径，而不要求材料准确性、有利的尺度或量子优势。", "authors": [{"name": "Ginanjar Utama"}, {"name": "Hermawan Kresno Dipojono"}], "featured_authors": [{"name": "Ginanjar Utama"}, {"name": "Hermawan Kresno Dipojono"}], "author_count": 2}, {"id": "2608.00596", "category": "quant-ph", "title": "Breakdown of the optical saturation regime in molecular single-photon emitters", "abstract": "Solid-state single organic molecules, such as dibenzoterrylene (DBT) in organic matrices, are prominent deterministic single-photon sources, usually modeled as effective two-level systems (TLS). We show that single DBT molecules in anthracene nanocrystals, under strong continuous-wave driving, depart from this picture: instead of the expected saturation, fluorescence is strongly suppressed at high resonant pump power, while the linewidth broadens beyond the TLS prediction -- an \\emph{anomalous saturation} regime. Comparing coherent and incoherent excitation and independently calibrating temperature via phonon-induced dephasing rules out laser-induced heating and intersystem crossing. Instead, a model of intensity-dependent excited-state absorption (ESA) toward a short-lived dark state quantitatively reproduces both the fluorescence suppression and the linewidth broadening. We further show that matrix quality mitigates this quenching, and that pulsed excitation schemes are strategic toward full population inversion, with direct implications for quantum nanophotonics and molecular optomechanics.", "url": "https://arxiv.org/abs/2608.00596", "type": "理论", "summary": "固态单一有机分子，例如有机基质中的二苯并三萘 (DBT)，是重要的确定性单光子源，通常建模为有效的双能级系统 (TLS)。我们表明，在强连续波驱动下，蒽纳米晶体中的单个 DBT 分子偏离了这一情况：荧光在高共振泵浦功率下受到强烈抑制，而不是预期的饱和度，而线宽超出了 TLS 预测——这是一种 \\emph{异常饱和} 状态。比较相干和非相干激发，并通过声子引起的移相独立校准温度，排除了激光引起的加热和系间交叉。相反，针对短寿命暗态的强度依赖性激发态吸收（ESA）模型定量地再现了荧光抑制和线宽展宽。我们进一步表明，基质质量​​减轻了这种猝灭，并且脉冲激发方案对于完全粒子数反转具有战略意义，对量子纳米光子学和分子光力学具有直接影响。", "authors": [{"name": "Hugo Levy-Falk"}, {"name": "Daniele De Bernardis"}, {"name": "Elena Fanella"}, {"name": "Louise Morlaës"}, {"name": "Costanza Toninelli"}], "featured_authors": [{"name": "Hugo Levy-Falk"}, {"name": "Daniele De Bernardis"}, {"name": "Elena Fanella"}, {"name": "Louise Morlaës"}, {"name": "Costanza Toninelli"}], "author_count": 5}, {"id": "2608.00670", "category": "quant-ph", "title": "Coordinate space representation for quantum simulation of scalar field theory", "abstract": "Quantum computing provides a promising framework for the simulation of quantum field theories, where the computational cost depends both on the quantum algorithm employed and on the representation of the Hamiltonian. We investigate a formulation of the $\\phi^4$ model based on the harmonic-oscillator basis in coordinate space. We derive the lattice $\\phi^4$ Hamiltonian in this representation and analyze the structure of the resulting one-body matrix and interaction tensor. We show that both exhibit an effective band-diagonal structure, allowing controlled truncations of the Hamiltonian while preserving the low-energy spectrum. We validate this formulation by comparing low-energy observables obtained from numerical diagonalization with those computed in the standard harmonic-oscillator momentum-space representation. Finally, we estimate the resources required to encode the Hamiltonian on a quantum computer using both binary and unary boson-to-qubit mappings. By exploiting effective locality, the coordinate-space representation reduces the resources required for quantum simulation over a broad range of parameters.", "url": "https://arxiv.org/abs/2608.00670", "type": "理论+数值", "summary": "量子计算为量子场论的模拟提供了一个有前景的框架，其中计算成本既取决于所使用的量子算法，也取决于哈密顿量的表示。我们研究了基于坐标空间中的谐波振荡器基础的 $\\phi^4$ 模型的公式。我们推导出这种表示形式中的格子 $\\phi^4$ 哈密顿量，并分析所得的单体矩阵和相互作用张量的结构。我们证明两者都表现出有效的带对角结构，允许哈密顿量的受控截断，同时保留低能谱。我们通过比较从数值对角化获得的低能可观测量与在标准谐波振荡器动量空间表示中计算的低能可观测量来验证这个公式。最后，我们使用二进制和一元玻色子到量子位映射来估计在量子计算机上编码哈密顿量所需的资源。通过利用有效的局部性，坐标空间表示减少了在广泛的参数范围内进行量子模拟所需的资源。", "authors": [{"name": "Gaetan Bardy"}, {"name": "Matthieu Saubanere"}, {"name": "Adrian Tanasa"}], "featured_authors": [{"name": "Gaetan Bardy"}, {"name": "Matthieu Saubanere"}, {"name": "Adrian Tanasa"}], "author_count": 3}, {"id": "2608.00741", "category": "quant-ph", "title": "Quantum Speedups for Testing Similar Means", "abstract": "Property testing of distributions is a central topic in information theory, learning theory, and statistics. While quantum algorithms are known to offer significant speedups for property testing of a single distribution or a pair of distributions, it is unclear whether quantum algorithms provide speedups for property testing of $m$ ($m\\geq 3$) distributions. This work focuses on quantum algorithms for testing whether $m$ distributions have similar means or are $\\epsilon$-far from mean similarity under two models. In the query model, the algorithm can choose which distribution to sample from, whereas in the sampling model, the distributions are selected uniformly. We design quantum algorithms with complexities $\\tilde{O}(1/\\epsilon)$ (the $\\tilde{O}$ notation hides poly-logarithmic factors) and $\\tilde{O}(\\sqrt{m}/\\epsilon)$ in the query and sampling models, respectively, achieving quadratic speedups over the classical counterparts. We further establish quantum lower bounds of $\\Omega\\left(1/\\epsilon\\right)$ and $\\Omega\\rbra{m^{1/3}+\\frac{m^{1/4}}{\\epsilon}}$ for the query model and the sampling model, demonstrating the optimality of our quantum algorithms in terms of the dependence on $\\epsilon$ up to logarithmic factors.", "url": "https://arxiv.org/abs/2608.00741", "type": "理论+数值", "summary": "分布的属性测试是信息论、学习理论和统计学的中心主题。虽然众所周知，量子算法可以为单个分布或一对分布的属性测试提供显着的加速，但尚不清楚量子算法是否为 $m$ ($m\\geq 3$) 分布的属性测试提供加速。这项工作的重点是量子算法，用于测试两个模型下 $m$ 分布是否具有相似的均值或 $\\epsilon$ 与均值相似度相差甚远。在查询模型中，算法可以选择从哪个分布中采样，而在采样模型中，则统一选择分布。我们在查询和采样模型中分别设计了复杂度 $\\tilde{O}(1/\\epsilon)$ （$\\tilde{O}$ 符号隐藏了多对数因子）和 $\\tilde{O}(\\sqrt{m}/\\epsilon)$ 的量子算法，与经典算法相比实现了二次加速。\n\n我们进一步为查询模型和采样模型建立了 $\\Omega\\left(1/\\epsilon\\right)$ 和 $\\Omega\\rbra{m^{1/3}+\\frac{m^{1/4}}{\\epsilon}}$ 的量子下界，证明了我们的量子算法在对数因子对 $\\epsilon$ 的依赖方面的最优性。", "authors": [{"name": "Chengshen Gao"}, {"name": "Yongzhen Xu"}, {"name": "Shenggen Zheng"}, {"name": "Lvzhou Li"}], "featured_authors": [{"name": "Chengshen Gao"}, {"name": "Yongzhen Xu"}, {"name": "Shenggen Zheng"}, {"name": "Lvzhou Li"}], "author_count": 4}, {"id": "2608.00930", "category": "quant-ph", "title": "Parallel Repetition in the Two-Player Quantum Cloning Game", "abstract": "We study parallel repetition in the two-player quantum cloning game, a monogamy-of-entanglement game motivated by quantum position verification. Colisson Palais, Escolà-Farràs, and Speelman bounded the value of $n$ copies between $(3/4)^n$ and $\\cos^{2n}(\\pi/8)$. For two copies, we prove that neither bound is tight. An explicit challenge-dependent strategy achieves value $(5+\\sqrt{17})/16>9/16$, so strong parallel repetition fails for the unrestricted game. A block Gram matrix argument gives the upper bound $(11+\\sqrt{65})/32<\\cos^4(\\pi/8)$ and strictly improves the previous parallel-repetition upper bound for every $n$. For every $n$, challenge-independent strategies have optimal value $(3/4)^n$.", "url": "https://arxiv.org/abs/2608.00930", "type": "理论", "summary": "我们研究了两人量子克隆游戏中的并行重复，这是一种由量子位置验证驱动的一夫一妻制纠缠游戏。 Colisson Palais、Escolà-Farràs 和 Speelman 将 $n$ 副本的值限制在 $(3/4)^n$ 和 $\\cos^{2n}(\\pi/8)$ 之间。对于两个副本，我们证明这两个边界都不紧。明确的依赖于挑战的策略实现价值 $(5+\\sqrt{17})/16>9/16$，因此强并行重复对于不受限制的游戏失败。块 Gram 矩阵参数给出上限 $(11+\\sqrt{65})/32<\\cos^4(\\pi/8)$ 并严格改进每个 $n$ 的先前并行重复上限。对于每 $n$，与挑战无关的策略具有最优值 $(3/4)^n$。", "authors": [{"name": "Eli Coe Naig"}, {"name": "Stephen A. Fenner"}], "featured_authors": [{"name": "Eli Coe Naig"}, {"name": "Stephen A. Fenner"}], "author_count": 2}, {"id": "2608.01011", "category": "quant-ph", "title": "Complete Existence Classification of Seven-Partite Absolutely Maximally Entangled States", "abstract": "We prove that an absolutely maximally entangled state of seven qudits exists if and only if the local dimension satisfies $d\\geq 3$. Prior to this work, to the best of our knowledge, $\\text{AME}(7,d)$ states were known to exist only when $d$ is a prime power other than $2$, or when $d$ can be expressed as a product of dimensions for which existence was already known. Since it has been proved that no $\\text{AME}(7,2)$ state exists, it remains to establish existence for all $d\\geq 3$. We construct cyclic quadratic-phase states for every odd local dimension and develop a coupled binary--odd-dimensional construction for every dimension congruent to $2$ modulo $4$. Together with the known power-of-two cases and the product property of AME states, these constructions cover every local dimension $d\\geq 3$.", "url": "https://arxiv.org/abs/2608.01011", "type": "理论", "summary": "我们证明当且仅当局部维度满足 $d\\geq 3$ 时，七个量子点的绝对最大纠缠态才存在。在这项工作之前，据我们所知，只有当 $d$ 是除 $2$ 之外的素数幂时，或者当 $d$ 可以表示为已知存在的维度的乘积时， $\\text{AME}(7,d)$ 状态才存在。由于已经证明不存在 $\\text{AME}(7,2)$ 状态，因此仍然需要建立所有 $d\\geq 3$ 的存在性。我们为每个奇数局部维度构造循环二次相状态，并为与 $2$ 模 $4$ 全等的每个维度开发耦合的二进制奇数维结构。连同已知的二次幂情况和 AME 状态的乘积属性，这些结构涵盖了每个局部维度 $d\\geq 3$。", "authors": [{"name": "Fei Shi"}, {"name": "Xiande Zhang"}, {"name": "Qi Zhao"}, {"name": "Lvzhou Li"}], "featured_authors": [{"name": "Fei Shi"}, {"name": "Xiande Zhang"}, {"name": "Qi Zhao"}, {"name": "Lvzhou Li"}], "author_count": 4}, {"id": "2608.01088", "category": "quant-ph", "title": "Twenty-one characterizations of reversible quantum channels", "abstract": "Reversible quantum channels play a fundamental role in quantum dynamics and quantum information processing. A quantum channel is reversible if there exists another quantum channel acting as its left inverse. Due to their intrinsic significance and wide applications, it is desirable to characterize reversible quantum channels from diverse perspectives. In this work, we study reversible quantum channels on finite-dimensional Hilbert spaces, with particular emphasis on the case of different input and output dimensions. We systematically present twenty-one equivalent characterizations of reversible quantum channels from algebraic, geometrical, and information-theoretical perspectives. Among these characterizations, some are well known, while others, implicit in the literature or formulated in other contexts, are clarified here; the Choi-state characterization is derived in this work. Specifically, we prove that the Choi states of reversible quantum channels admit three equivalent forms: the spectral, direct-sum, and tensor-product representations. These twenty-one equivalent characterizations establish a comprehensive framework for reversible quantum channels, provide diverse insights into the structural and information-theoretic properties of quantum channels, and facilitate applications of reversibility in quantum information processing such as quantum error correction, quantum teleportation, and quantum thermodynamics.", "url": "https://arxiv.org/abs/2608.01088", "type": "理论", "summary": "可逆量子通道在量子动力学和量子信息处理中发挥着基础作用。如果存在另一个量子通道充当其左逆，则量子通道是可逆的。由于其内在的重要性和广泛的应用，需要从不同的角度来表征可逆量子通道。在这项工作中，我们研究有限维希尔伯特空间上的可逆量子通道，特别强调不同输入和输出维度的情况。我们从代数、几何和信息论的角度系统地提出了可逆量子通道的二十一个等效表征。在这些特征中，有些是众所周知的，而另一些则隐含在文献中或在其他上下文中阐述，在此予以澄清； Choi 态表征是在这项工作中得出的。具体来说，我们证明可逆量子通道的 Choi 态允许三种等效形式：谱表示、直和表示和张量积表示。\n\n这二十一个等效表征建立了可逆量子通道的综合框架，为量子通道的结构和信息论特性提供了不同的见解，并促进了可逆性在量子信息处理中的应用，例如量子纠错、量子隐形传态和量子热力学。", "authors": [{"name": "Nan Li"}, {"name": "Yuan Li"}, {"name": "Hanyu Yang"}, {"name": "Shunlong Luo"}], "featured_authors": [{"name": "Nan Li"}, {"name": "Yuan Li"}, {"name": "Hanyu Yang"}, {"name": "Shunlong Luo"}], "author_count": 4}, {"id": "2608.01124", "category": "quant-ph", "title": "Maximal Rényi Relative Entropy for $α>2$", "abstract": "Quantum relative entropies play a fundamental role in quantum information theory. In the classical setting, Rényi relative entropies constitute, up to linear combinations, the most general class of relative entropies, naturally motivating the search for their minimal and maximal quantum extensions. The minimal extension is known to be the reverse sandwiched Rényi relative entropy for $\\alpha\\in[0,1/2)$ and the sandwiched Rényi relative entropy for $\\alpha\\geq 1/2$. In contrast, the maximal extension had previously been identified only for $\\alpha\\in[0,2]$, where it is given by the geometric Rényi relative entropy. In this work, we complete this characterization by proving that for $\\alpha>2$, the maximal extension is given by the $\\alpha$-$z$ Rényi relative entropy with $z=\\alpha-1$. As an application, we determine when an energy-incoherent state can be transformed into an energy-coherent state by a Gibbs-preserving operation assisted by an uncorrelated catalyst, thereby fully characterizing the coherence-generating power of this class of operations in the catalytic setting.", "url": "https://arxiv.org/abs/2608.01124", "type": "理论", "summary": "量子相对熵在量子信息论中发挥着基础作用。在经典设置中，Rényi 相对熵构成了最一般的相对熵类别（直到线性组合），自然地激发了对其最小和最大量子扩展的搜索。已知最小扩展是 $\\alpha\\in[0,1/2)$ 的反向夹层 Rényi 相对熵和 $\\alpha\\geq 1/2$ 的夹层 Rényi 相对熵。相比之下，之前仅确定了 $\\alpha\\in[0,2]$ 的最大扩展，其中它由几何 Rényi 相对熵给出。在这项工作中，我们通过证明对于 $\\alpha>2$，最大扩展由 $\\alpha$-$z$ Rényi 相对熵（$z=\\alpha-1$）给出来完成这个表征。作为一种应用，我们确定何时可以通过不相关催化剂辅助的吉布斯守恒操作将能量非相干状态转变为能量相干状态，从而充分表征催化环境中此类操作的相干生成能力。", "authors": [{"name": "Roberto Rubboli"}], "featured_authors": [{"name": "Roberto Rubboli"}], "author_count": 1}, {"id": "2608.01308", "category": "quant-ph", "title": "Sharp Quantum Capacity Thresholds: Exponential Strong Converses for Degradable and Antidegradable Channels", "abstract": "The quantum capacity of a noisy channel quantifies the maximum rate at which quantum information can be transmitted reliably. For general channels, its evaluation requires an optimization over arbitrarily many channel uses. Degradable channels form a central exception: their capacity is given by the single-letter coherent information, while antidegradable channels have zero capacity. Nevertheless, even for these fundamental classes, it has remained open whether communication above capacity becomes possible when a fixed non-maximal error is tolerated. Here we resolve this problem by proving an exponential strong converse for every finite-dimensional degradable and antidegradable channel: at any rate above capacity, the fidelity of every coding scheme decays exponentially with the number of channel uses. As an immediate consequence, we establish the first all-code exponential strong converse for the quantum erasure channel throughout its full parameter range, strengthening previous results that applied only to almost all codes. We also show that exponential strong-converse bounds are preserved under receiver post-processing. This yields efficiently computable semidefinite-programming bounds for arbitrary finite-dimensional channels, improved bounds for Pauli channels, and an exact exponential strong converse for a nondegradable multilevel amplitude-damping family.", "url": "https://arxiv.org/abs/2608.01308", "type": "理论+数值", "summary": "噪声信道的量子容量量化了量子信息可以可靠传输的最大速率。对于一般通道，其评估需要对任意多个通道使用进行优化。可降解通道形成了一个主要例外：它们的容量由单字母相干信息给出，而抗降解通道的容量为零。然而，即使对于这些基本类别，当容忍固定的非最大误差时，超出容量的通信是否成为可能仍然是一个悬而未决的问题。在这里，我们通过证明每个有限维可降级和不可降级通道的指数强逆来解决这个问题：在任何高于容量的速率下，每个编码方案的保真度随着通道使用的数量呈指数衰减。直接的结果是，我们在整个参数范围内为量子擦除通道建立了第一个全代码指数强逆，强化了之前仅适用于几乎所有代码的结果。我们还表明，指数强逆界在接收器后处理下得以保留。\n\n这产生了任意有限维通道的有效可计算半定编程界限、泡利通道的改进界限以及不可退化的多级振幅阻尼族的精确指数强逆。", "authors": [{"name": "Tulja Varun Kondra"}, {"name": "Raphael Brinster"}, {"name": "Hermann Kampermann"}, {"name": "Dagmar Bruß"}, {"name": "Nikolai Wyderka"}], "featured_authors": [{"name": "Tulja Varun Kondra"}, {"name": "Raphael Brinster"}, {"name": "Hermann Kampermann"}, {"name": "Dagmar Bruß"}, {"name": "Nikolai Wyderka"}], "author_count": 5}, {"id": "2608.01316", "category": "quant-ph", "title": "Compiler Framework for 3D Neutral-Atom Quantum Computers", "abstract": "Neutral-atom quantum computers can now arrange atoms in three-dimensional tweezer arrays, yet every existing compiler assumes a flat geometry. We present Piqasso, a compiler that exploits the vertical axis by stacking storage, entanglement, and readout into distinct layers. Its pipeline pairs an analytical placement respecting axial-clearance optics with a router that brings gate partners together via short vertical hops---bypassing in-plane crossing conflicts through out-of-plane detours---and a multi-AOD scheduler that parallelizes transport across focal planes. On 34 circuits, Piqasso reduces atom transport distance by 2.1$\\times$ over a state-of-the-art planar compiler, yielding up to 7.3$\\times$ faster execution, 2.2$\\times$ higher movement fidelity, and 1.8$\\times$ fewer serialized transport rounds, with all gains widening at scale.", "url": "https://arxiv.org/abs/2608.01316", "type": "理论", "summary": "中性原子量子计算机现在可以将原子排列在三维镊子阵列中，但每个现有的编译器都假设平面几何形状。我们提出了 Piqasso，一个编译器，它通过将存储、纠缠和读出堆叠到不同的层来利用垂直轴。其管道将尊重轴向间隙光学的分析布局与路由器相结合，该路由器通过短垂直跳跃将门合作伙伴聚集在一起（通过平面外绕道绕过平面内交叉冲突）以及多 AOD 调度程序，该调度程序可并行跨焦平面的传输。在 34 个电路上，Piqasso 比最先进的平面编译器将原子传输距离缩短了 2.1$\\times，执行速度提高了 7.3$\\time$，运动保真度提高了 2.2$\\time$，序列化传输轮次减少了 1.8$\\time$，所有增益都在规模上扩大。", "authors": [{"name": "Chen Huang"}, {"name": "Zhemin Zhang"}, {"name": "Zhao Zhang"}, {"name": "Xudong Lv"}, {"name": "Zhiding Liang"}], "featured_authors": [{"name": "Chen Huang"}, {"name": "Zhemin Zhang"}, {"name": "Zhao Zhang"}, {"name": "Xudong Lv"}, {"name": "Zhiding Liang"}], "author_count": 5}, {"id": "2608.01365", "category": "quant-ph", "title": "Expressive Power and Limitations of Multi-photon Quantum Neural Networks", "abstract": "Quantum neural networks (QNNs) have shown promise in leveraging quantum computation for machine learning tasks. Utilizing multiple identical photons as input, multi-photon quantum neural networks (MPQNNs) have the potential to enhance the expressivity through increasing the photon number. However, how precisely the expressivity of an MPQNN is affected by an increase in photon number, and whether it can be infinitely enhanced by increasing the photon number, remains unexplored. In this work, we quantitatively estimate the expressivity of this model by deriving upper bounds on approximation error in two cases. In the case of a fixed observable, there exists a threshold that scales linearly with the mode number. Below the threshold, the expressivity of an MPQNN can be enhanced polynomially by increasing the photon number. Above the threshold, however, increasing the photon number does not affect the expressivity. In the case of a trainable observable, the expressivity can always be enhanced polynomially by increasing the photon number. These findings are then validated by numerical simulations. Our work elucidates the performance enhancement of multi-photon quantum feature in QNNs, as well as its limitations, offering guidance for leveraging multi-photon advantages in quantum machine learning.", "url": "https://arxiv.org/abs/2608.01365", "type": "理论+数值", "summary": "量子神经网络 (QNN) 在利用量子计算执行机器学习任务方面表现出了良好的前景。利用多个相同的光子作为输入，多光子量子神经网络（MPQNN）有可能通过增加光子数来增强表达能力。然而，光子数的增加如何精确地影响 MPQNN 的表达性，以及是否可以通过增加光子数来无限增强它，仍有待探索。在这项工作中，我们通过推导两种情况下近似误差的上限来定量估计该模型的表达能力。在固定可观测值的情况下，存在与众数线性缩放的阈值。低于阈值时，可以通过增加光子数来多项式地增强 MPQNN 的表达能力。然而，高于阈值，增加光子数不会影响表现力。在可训练可观测量的情况下，总是可以通过增加光子数来多项式地增强表达性。然后通过数值模拟验证这些发现。\n\n我们的工作阐明了 QNN 中多光子量子特征的性能增强及其局限性，为在量子机器学习中利用多光子优势提供了指导。", "authors": [{"name": "Zeyu Xiao"}, {"name": "Weixu Shi"}, {"name": "Yizhi Wang"}, {"name": "Lingling Lao"}, {"name": "Junjie Wu"}], "featured_authors": [{"name": "Zeyu Xiao"}, {"name": "Weixu Shi"}, {"name": "Yizhi Wang"}, {"name": "Lingling Lao"}, {"name": "Junjie Wu"}], "author_count": 5}, {"id": "2608.01438", "category": "quant-ph", "title": "Automated Construction and Verification of Unextendible Product Bases", "abstract": "Unextendible product bases (UPBs) are important structures in quantum information theory, with applications to completely entangled subspaces, boun
