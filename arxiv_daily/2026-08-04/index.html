d entanglement, and local indistinguishability. Since many properties and applications of UPBs are closely related to their cardinalities, one of the central problems in the study of UPBs is to determine whether UPBs of prescribed sizes exist in a given multipartite system. In this paper, we introduce a SAT-assisted framework based on decompositions of the \\(N\\)-dimensional hypercube. We define \\(O_N\\)-tile decompositions and prove a tile-to-UPB theorem: every \\(O_N\\)-tile decomposition induces a UPB through a construction based on tile-wise Fourier product bases and a global stopper state. We then encode the search for such decompositions as a Boolean satisfiability (SAT) problem and use SAT solvers to generate explicit instances. In terms of verification, we also implement a UPB verification algorithm based on local orthogonality graphs and unsaturated subspaces. The algorithm can be used to determine whether an arbitrary finite set of product states forms a UPB. Using this framework, we obtain UPBs of several sizes in some tripartite and quadripartite systems, including sizes \\(13,14,\\ldots,23\\) in \\(\\mathbb C^3\\otimes\\mathbb C^3\\otimes\\mathbb C^3\\). Moreover, the small-dimensional instances obtained here can serve as seed UPBs for recursive constructions, leading to further examples in larger multipartite systems.", "url": "https://arxiv.org/abs/2608.01438", "type": "理论+数值", "summary": "不可扩展乘积基（UPB）是量子信息论中的重要结构，可应用于完全纠缠子空间、束缚纠缠和局部不可区分性。由于UPB的许多性质和应用与其基数密切相关，因此UPB研究的核心问题之一是确定给定多部分系统中是否存在规定大小的UPB。在本文中，我们介绍了一种基于 N 维超立方体分解的 SAT 辅助框架。我们定义了\\(O_N\\)-tile分解并证明了tile-to-UPB定理：每个\\(O_N\\)-tile分解通过基于tile-wise傅立叶积基和全局停止状态的构造来诱导UPB。然后，我们将此类分解的搜索编码为布尔可满足性 (SAT) 问题，并使用 SAT 求解器生成显式实例。在验证方面，我们还实现了基于局部正交图和不饱和子空间的UPB验证算法。该算法可用于确定任意有限的乘积状态集是否形成 UPB。\n\n使用这个框架，我们在一些三方和四方系统中获得了多种大小的UPB，包括\\(\\mathbb C^3\\otimes\\mathbb C^3\\otimes\\mathbb C^3\\)中的大小\\(13,14,\\ldots,23\\)。此外，这里获得的小维实例可以作为递归构造的种子 UPB，从而在更大的多部分系统中产生更多示例。", "authors": [{"name": "Zicheng Han"}, {"name": "Wanchen Zhang"}, {"name": "Fei Shi"}, {"name": "Xiande Zhang"}], "featured_authors": [{"name": "Zicheng Han"}, {"name": "Wanchen Zhang"}, {"name": "Fei Shi"}, {"name": "Xiande Zhang"}], "author_count": 4}, {"id": "2608.01483", "category": "quant-ph", "title": "Spatial-Order Hierarchy of Time-Dependent Exchange-Correlation Potential", "abstract": "Exact time-dependent density-functional theory separates the exchange-correlation potential into interaction and kinetic-correlation components, but the structural relation between them remains unknown. We establish a representability constraint based on the off-diagonal expansion of the one-electron reduced density matrix relative to a time-dependent Hartree-Fock (TDHF) reference. A non-zero linear term generates a non-HF current density while the kinetic-correlation component remains HF representable; higher-order off-diagonal structure activates the kinetic component. In a one-dimensional two-electron correlation quench, retaining the exact interaction component while setting the kinetic component to zero suppresses the density broadening of the exact evolution. These results establish a hierarchy of density equations of motion and provide an exact constraint for non-adiabatic functional construction.", "url": "https://arxiv.org/abs/2608.01483", "type": "理论+数值", "summary": "精确的时间相关密度泛函理论将交换相关势分解为相互作用和动力学相关分量，但它们之间的结构关系仍然未知。我们基于单电子约简密度矩阵相对于时间相关的 Hartree-Fock (TDHF) 参考的非对角展开建立了可表示性约束。非零线性项生成非 HF 电流密度，同时动力学相关分量保持 HF 可表示；高阶非对角结构激活动力学成分。在一维二电子相关淬灭中，保留精确的相互作用分量，同时将动力学分量设置为零，可以抑制精确演化的密度展宽。这些结果建立了运动密度方程的层次结构，并为非绝热函数构造提供了精确的约束。", "authors": [{"name": "Naoki Negishi"}], "featured_authors": [{"name": "Naoki Negishi"}], "author_count": 1}, {"id": "2608.01723", "category": "quant-ph", "title": "Ring Optimized M-APSK Modulation for Discrete Modulated CV-QKD", "abstract": "This paper proposes a multi ring M-APSK constellation optimization method for discrete-modulated continuous variable quantum key distribution. Unlike conventional APSK structures with fixed ring spacing and predefined ring probabilities, the proposed method optimizes the ring radius ratio and ring probability to improve the finite-size secret key rate. A method based on the Gram matrix is used to calculate the nonzero spectrum of the average state $\\tau$, and fidelity is used to compare the optimized discrete average state with the Gaussian average state. The results show that the proposed structure extends the maximum transmission distance of 16-APSK by approximately 15% compared with the conventional binomial APSK structure. The optimization gain is larger for small size APSK constellations, where the average state has a larger structural gap from Gaussian modulation.", "url": "https://arxiv.org/abs/2608.01723", "type": "数值", "summary": "本文提出了一种用于离散调制连续可变量子密钥分发的多环M-APSK星座优化方法。与具有固定环间距和预定义环概率的传统APSK结构不同，该方法优化环半径比和环概率以提高有限大小密钥率。采用基于Gram矩阵的方法计算平均状态$\\tau$的非零谱，并利用保真度将优化后的离散平均状态与高斯平均状态进行比较。结果表明，与传统的二项式APSK结构相比，所提出的结构将16-APSK的最大传输距离延长了约15%。对于小尺寸 APSK 星座，优化增益更大，其中平均状态与高斯调制具有更大的结构差距。", "authors": [{"name": "Seonguk Kim"}, {"name": "Jun Heo"}], "featured_authors": [{"name": "Seonguk Kim"}, {"name": "Jun Heo"}], "author_count": 2}, {"id": "2608.01770", "category": "quant-ph", "title": "The Sample Complexity of Fidelity Estimation to a Known Rank-$r$ Reference State Is $\\widetildeΘ(r^2/\\varepsilon^2)$", "abstract": "We settle the sample complexity of estimating the root Uhlmann fidelity $F(\\rho,\\sigma)=\\operatorname{tr}\\sqrt{\\sqrt{\\sigma}\\rho\\sqrt{\\sigma}}$ between an unknown state $\\rho$ and a known rank-$r$ reference state $\\sigma$. Writing $S(r,\\varepsilon)$ for the sample complexity at additive error $\\varepsilon$, we resolve the open problem posed by Wang by closing, up to logarithmic factors, the gap between the previously known bounds $\\Omega(r/\\varepsilon^2)$ and $O(r^2/\\varepsilon^2)$. We prove $S(r,\\varepsilon)=\\widetilde{\\Theta}(r^2/\\varepsilon^2)$ for all $0<\\varepsilon\\le\\varepsilon_0$, where $\\varepsilon_0>0$ is a universal constant. The lower bound already holds on a $2r$-dimensional system when $\\sigma$ is maximally mixed on a fixed $r$-dimensional subspace, and for a hard family of states that do not commute with $\\sigma$. The proof combines exact spectral moment matching, a radially size-biased doubly correlated Wishart model, and the Cauchy identity, reducing state indistinguishability to a long-cycle estimate for a weighted random permutation. A direct-sum embedding and binomial thinning yield the optimal $1/\\varepsilon^2$ dependence. We also prove a near-quadratic lower bound $\\widetilde{\\Omega}(r^2)$ for quantum spectrum estimation at constant accuracy. Combined with the recent $O(r^2(\\log\\log r/\\log r)^2)$ upper bound, this determines the polynomial order of the sample complexity in this regime and establishes a near-quadratic barrier.", "url": "https://arxiv.org/abs/2608.01770", "type": "理论", "summary": "我们解决了估计未知状态$\\rho$和已知的rank-$r$参考状态$\\sigma$之间的根Uhlmann保真度$F(\\rho,\\sigma)=\\operatorname{tr}\\sqrt{\\sqrt{\\sigma}\\rho\\sqrt{\\sigma}}$的样本复杂度。将 $S(r,\\varepsilon)$ 写入加性误差 $\\varepsilon$ 下的样本复杂度，我们通过将先前已知边界 $\\Omega(r/\\varepsilon^2)$ 和 $O(r^2/\\varepsilon^2)$ 之间的差距缩小到对数因子来解决 Wang 提出的开放问题。我们证明 $S(r,\\varepsilon)=\\widetilde{\\Theta}(r^2/\\varepsilon^2)$ 对于所有 $0<\\varepsilon\\le\\varepsilon_0$，其中 $\\varepsilon_0>0$ 是通用常数。当 $\\sigma$ 在固定的 $r$ 维子空间上最大程度混合时，以及对于不与 $\\sigma$ 交换的硬状态族时，下界已经在 $2r$ 维系统上成立。该证明结合了精确的谱矩匹配、径向大小偏置双相关 Wishart 模型和柯西恒等式，将状态不可区分性降低到加权随机排列的长周期估计。直接求和嵌入和二项式细化产生最佳的 $1/\\varepsilon^2$ 依赖性。\n\n我们还证明了恒定精度下量子谱估计的近二次下界 $\\widetilde{\\Omega}(r^2)$。结合最近的 $O(r^2(\\log\\log r/\\log r)^2)$ 上限，这确定了该状态下样本复杂性的多项式阶数并建立了近二次障碍。", "authors": [{"name": "Gye Jin Lee"}, {"name": "Sunghyeon Jo"}], "featured_authors": [{"name": "Gye Jin Lee"}, {"name": "Sunghyeon Jo"}], "author_count": 2}, {"id": "2608.01831", "category": "quant-ph", "title": "Symmetry-Projected Compatible Multiparameter Quantum Sensing", "abstract": "We establish a general symmetry-projection framework for multiparameter quantum sensing. Decomposing encoding generators into subspace-preserving and subspace-changing components relative to a symmetry sector identically eliminates all cross-sector elements of the quantum Fisher information matrix (QFIM) and the mean symmetric logarithmic derivative (SLD) commutator matrix. When projected subspace-changing generators act as a scalar within the occupied subspace, the corresponding QFIM block reduces to four times the symmetrized covariance matrix, regardless of probe state purity. For parity-protected collective $\\mathrm{SU}(2)$ spin systems, this renders the transverse QFIM directly certifiable via spin fluctuations, with the optimal axis aligned with the anti-squeezed quadrature. Applied to a dissipative one-axis-twisting system, our framework reveals that highly mixed transient states can exhibit nearly balanced, Heisenberg-scaled QFIM components for transverse--longitudinal parameter pairs $(\\theta_y,\\theta_z)$ over a broad time window. Furthermore, while the steady state retains an isotropic transverse QFIM scaling as $N^2/3$, weak compatibility for transverse parameter pairs $(\\theta_x,\\theta_y)$ exhibits a sharp parity dependence---failing for odd $N$ but restored for even $N$. The resulting symmetry protection eliminates the Uhlmann curvature for transverse--longitudinal pairs, enabling simultaneous saturation of the multi-parameter quantum Cramér-Rao bound in the asymptotic limit.", "url": "https://arxiv.org/abs/2608.01831", "type": "理论", "summary": "我们建立了用于多参数量子传感的通用对称投影框架。将编码生成器分解为相对于对称扇区的子空间保留分量和子空间改变分量，同样消除了量子费希尔信息矩阵（QFIM）和平均对称对数导数（SLD）交换器矩阵的所有跨扇区元素。当投影子空间变化生成器充当占用子空间内的标量时，相应的 QFIM 块会减少到对称协方差矩阵的四倍，而不管探测状态纯度如何。对于受奇偶校验保护的集体 $\\mathrm{SU}(2)$ 自旋系统，这使得横向 QFIM 可通过自旋波动直接证明，且最佳轴与反挤压正交对齐。应用于耗散单轴扭转系统时，我们的框架揭示了高度混合的瞬态可以在很宽的时间窗口内表现出近乎平衡的、海森堡尺度的 QFIM 分量，用于横纵向参数对 $(\\theta_y,\\theta_z)$​​。\n\n此外，虽然稳态保持各向同性横向 QFIM 缩放为 $N^2/3$，但横向参数对 $(\\theta_x,\\theta_y)$ 的弱兼容性表现出强烈的奇偶校验依赖性——奇数 $N$ 失败，但偶数 $N$ 恢复。由此产生的对称性保护消除了横向-纵向对的乌尔曼曲率，从而使多参数量子 Cramér-Rao 在渐近极限内同时饱和。", "authors": [{"name": "G. R. Jin"}, {"name": "Z. Y. Zhou"}, {"name": "W. Yang"}], "featured_authors": [{"name": "G. R. Jin"}, {"name": "Z. Y. Zhou"}, {"name": "W. Yang"}], "author_count": 3}, {"id": "2608.01909", "category": "quant-ph", "title": "Optimality of Gaussian Entanglement of Formation", "abstract": "We prove that the entanglement of formation of every two-mode Gaussian state coincides with its Gaussian restriction, solving a longstanding open problem in continuous variable quantum information theory. The key result is a sharp affine relation between entanglement and a generalized Einstein-Podolsky-Rosen observable, valid for arbitrary pure two-mode states, including non-Gaussian ones. Our result extends to bisymmetric multimode Gaussian states, and also provides a measurable lower bound on the entanglement of formation of arbitrary non-Gaussian states.", "url": "https://arxiv.org/abs/2608.01909", "type": "理论", "summary": "我们证明了每个二模高斯态的纠缠形成与其高斯限制相一致，解决了连续变量量子信息论中长期存在的悬而未决的问题。关键结果是纠缠和广义爱因斯坦-波多尔斯基-罗森可观测量之间存在尖锐的仿射关系，对于任意纯二模态（包括非高斯态）有效。我们的结果扩展到双对称多模高斯态，并且还提供了任意非高斯态形成的纠缠的可测量下界。", "authors": [{"name": "Gerardo Adesso"}], "featured_authors": [{"name": "Gerardo Adesso"}], "author_count": 1}, {"id": "2608.02041", "category": "quant-ph", "title": "Towards Tensor-Network SAT-Solvers for Quantum-Classical Workflows", "abstract": "Integrated HPC/QC systems aim to combine classical high-performance computing with quantum processors, but cannot be reduced to mechanisms for dispatching quantum kernels. An integrated architecture must support aspects such as observability, which cannot be implemented using QPUs alone, as well as fallback execution and cost-aware decisions on whether to replace quantum tasks with classical surrogates. Such mechanisms must be approximate or benefit from problem structure to soften the inescapable exponential classical worst-case complexity. In this work, we study tensor-network ground-state search, as such a surrogate, for optimisation problems. This combines key quantum primitives with advanced classical simulation. It provides initial empirical indicators for surrogate selection criteria, and exposes end-to-end toolchain effects that may be missed when transformation steps are studied in isolation. We compare a native polynomial unconstrained optimisation to-higher-order-Ising and a quadratised quadratic unconstrained binary optimization to-quadratic-Ising formulation for Max-3-SAT. Both are encoded as matrix product operator and optimised using density matrix renormalisation group approaches, with simulated annealing (SA) as classical performance baseline. Our results show that quadratisation is not a neutral transformation step: auxiliary variables and pairwise couplings substantially degrade solution quality relative to the native higher-order representation, while SA matches or outperforms DMRG across all tested instances. Since the optima of Boolean satisfiability (SAT)-derived problems are classical product states, DMRGs advantages dont materialise here. These findings suggest that surrogate selection in HPC/QC runtimes must be encoding- and instance-aware and provide empirical groundwork for informed decisions on fallback strategies and architecture co-design.", "url": "https://arxiv.org/abs/2608.02041", "type": "理论+数值", "summary": "集成 HPC/QC 系统旨在将经典高性能计算与量子处理器相结合，但不能简化为调度量子内核的机制。集成架构必须支持可观测性等方面（这些方面无法单独使用 QPU 来实现），以及后备执行和关于是否用经典替代品替换量子任务的成本感知决策。这种机制必须是近似的或受益于问题结构，以减轻不可避免的指数经典最坏情况的复杂性。在这项工作中，我们研究张量网络基态搜索，作为优化问题的替代方案。这将关键的量子基元与先进的经典模拟结合起来。它为替代选择标准提供了初始经验指标，并揭示了单独研究转换步骤时可能会忽略的端到端工具链效应。我们比较了 Max-3-SAT 的原生多项式无约束优化与高阶 Ising 和二次无约束二元优化与二次 Ising 公式。\n\n两者都被编码为矩阵乘积算子，并使用密度矩阵重整化组方法进行优化，并以模拟退火 (SA) 作为经典性能基线。我们的结果表明，二次化不是一个中性转换步骤：相对于原生高阶表示，辅助变量和成对耦合大大降低了解的质量，而 SA 在所有测试实例中都匹配或优于 DMRG。由于布尔可满足性 (SAT) 衍生问题的最优是经典的乘积状态，因此 DMRG 的优势在此并未体现。这些发现表明，HPC/QC 运行时中的代理选择必须具有编码和实例感知能力，并为后备策略和架构协同设计的明智决策提供经验基础。", "authors": [{"name": "Benjamin Zec"}, {"name": "Lukas Schmidbauer"}, {"name": "Maja Franz"}, {"name": "Wolfgang Mauerer"}], "featured_authors": [{"name": "Benjamin Zec"}, {"name": "Lukas Schmidbauer"}, {"name": "Maja Franz"}, {"name": "Wolfgang Mauerer"}], "author_count": 4}, {"id": "2608.02054", "category": "quant-ph", "title": "Scaled Caldeira-Leggett Dynamics: Deterministic Trajectories and the Classical Limit", "abstract": "The dynamics of an open quantum system in the high-temperature regime of the Caldeira-Leggett model using a Bohmian language is investigated. By expressing the density matrix in polar form, generalized continuity and Hamilton-Jacobi equations are obtained. Thermal effects appear explicitly in the former, while they influence the latter only indirectly through an effective potential. Remarkably, the effective potential does not vanish in the classical limit and cannot, in general, be decomposed into simple additive quantum and thermal contributions. Instead, it retains a nontrivial structure leading to a residual temperature dependence in the resulting dynamics. As a consequence, the resulting temperature-dependent-classical trajectories remain deterministic even in the presence of a thermal environment. This behavior contrasts with the stochastic dynamics observed in the Langevin description and reflects the ensemble-based nature of the present approach. To further explore the quantum-to-classical transition, a scaled version of the Caldeira-Leggett equation is introduced by scaling both the density matrix and Planck constant through a quantumness parameter. This parameter takes the value one in the fully quantum regime and smoothly approaches zero in the classical limit. Applications to Gaussian states demonstrate a gradual suppression of coherence and interference, governed jointly by thermal effects and the transition parameter.", "url": "https://arxiv.org/abs/2608.02054", "type": "理论", "summary": "使用波姆语言研究了 Caldeira-Leggett 模型高温状态下开放量子系统的动力学。通过用极坐标形式表达密度矩阵，得到广义连续性和哈密顿-雅可比方程。热效应明确地出现在前者中，而它们仅通过有效势间接影响后者。值得注意的是，有效势不会在经典极限中消失，并且通常不能分解为简单的加性量子和热贡献。相反，它保留了一个重要的结构，导致最终的动力学存在残余温度依赖性。因此，即使在存在热环境的情况下，所得到的与温度相关的经典轨迹仍然是确定性的。这种行为与朗之万描述中观察到的随机动力学形成对比，反映了本方法基于集合的性质。为了进一步探索量子到经典的转变，通过量子参数缩放密度矩阵和普朗克常数，引入了 Caldeira-Leggett 方程的缩放版本。\n\n该参数在完全量子态中取值 1，并在经典极限中平滑地接近零。高斯态的应用证明了相干性和干扰的逐渐抑制，由热效应和过渡参数共同控制。", "authors": [{"name": "S. V. Mousavi"}, {"name": "S. Miret-Artés"}], "featured_authors": [{"name": "S. V. Mousavi"}, {"name": "S. Miret-Artés"}], "author_count": 2}, {"id": "2608.02090", "category": "quant-ph", "title": "Field-Free Transverse Aharonov--Bohm Phase Gate for an Orbital $l$-Qubit", "abstract": "Free-space Aharonov--Bohm (AB) Bessel modes are known to carry a flux-dependent azimuthal Schrödinger probability current and kinetic orbital angular momentum. We extend this response to the spin-resolved conserved Dirac current of a core-excluded finite-wall annular guide and show that confinement converts its surviving orbital component into a transverse Aharonov--Bohm (TAB) propagation phase for a straight traveling mode whose centroid path has zero projection onto $\\mathbf A$. The radial-gradient current reverses under spin reversal; retaining the complete evanescent tail closes it as a boundary contribution, leaving a spin-independent orbital phase $\\Delta\\phi_{ln}\\propto l\\Phi L_{\\rm int}\\langle\\rho^{-2}\\rangle_{ln}/v_z$. Opposite-winding modes $|\\pm l\\rangle$ form a same-path qubit implementing $R_z(2\\delta_l)$ with differential readout and common-mode phase rejection, while direct first-order crosstalk requires the angular harmonic $m=\\pm2l$. For a $100\\,\\mu\\mathrm{m}$ section with $a=20\\,\\mathrm{nm}$, $R=30\\,\\mathrm{nm}$, $E_z=10\\,\\mathrm{meV}$, and $|l|=10$, the sensitivity is $0.1885\\,\\mathrm{mrad/mG}$ and $R_z(\\pi)$ occurs at $16.67\\,\\mathrm{G}$. Finite-wall confinement thus turns intrinsic azimuthal Dirac current into a guided field-free phase operation.", "url": "https://arxiv.org/abs/2608.02090", "type": "理论+数值", "summary": "已知自由空间阿哈罗诺夫-玻姆 (AB) 贝塞尔模式携带依赖于通量的方位薛定谔概率电流和动轨道角动量。我们将此响应扩展到核心排除的有限壁环形导引器的自旋解析守恒狄拉克电流，并表明约束将其幸存轨道分量转换为直线行进模式的横向阿哈罗诺夫-博姆（TAB）传播相，其质心路径在 $\\mathbf A$ 上的投影为零。径向梯度电流在自旋反转下反转；保留完整的渐逝尾将其作为边界贡献封闭，留下与自旋无关的轨道相位 $\\Delta\\phi_{ln}\\propto l\\Phi L_{\\rm int}\\langle\\rho^{-2}\\rangle_{ln}/v_z$。相反绕组模式 $|\\pm l\\rangle$ 形成同路径量子位，实现具有差分读出和共模相位抑制的 $R_z(2\\delta_l)$，而直接一阶串扰需要角谐波 $m=\\pm2l$。对于 $100\\,\\mu\\mathrm{m}$ 部分，其中 $a=20\\,\\mathrm{nm}$、$R=30\\,\\mathrm{nm}$、$E_z=10\\,\\mathrm{meV}$ 和 $|l|=10$，灵敏度为 $0.1885\\,\\mathrm{mrad/mG}$ 和 $R_z(\\pi)$ 出现在$16.67\\,\\mathrm{G}$。\n\n因此，有限壁限制将本征方位角狄拉克电流转变为引导的无场相位操作。", "authors": [{"name": "Ju Gao"}, {"name": "Fang Shen"}], "featured_authors": [{"name": "Ju Gao"}, {"name": "Fang Shen"}], "author_count": 2}, {"id": "2608.02119", "category": "quant-ph", "title": "Better accuracy with fewer qubits: Single-particle basis set optimization for quantum chemistry on quantum computers", "abstract": "In spite of recent advances, quantum computers are expected to be sufficiently noisy in the coming few years to the extent of limiting quantum chemical calculations to relatively small number of orbitals. However, even with reasonable quality single particle basis sets, small active spaces with limited orbitals can result in a significant fraction of correlation energy being lost, motivating the design of moderate quality qubit-efficient basis sets for quantum algorithms. We begin by reoptimizing the existing minimal basis sets using a genetic algorithm-inspired approach in conjunction with aggressive refinement strategies, and generate modified minimal basis sets (MSTO-kG basis; k = 2-11) for atoms from H through F. The ground state energies of H through F using our MSTO bases at FCI level of theory yield ground state energies that are comparable or sometimes even lower than those obtained using 6-31G basis sets. In the case of Li, the MSTO bases surpass the performance of cc-pVQZ bases. Thus, we obtain better atomic energies with same number of qubits relative to STO bases, and better/comparable energies with fewer qubits relative to higher quality bases. In the case of molecules, H2 performs poorly; a finding that is consistent with an earlier work in literature. For other molecules, Li2, C2, LiH, BeH and BeH2, the FCI results (except C2 for which we employ CISD) from our bases are comparable to/outperform those from 6-31G basis. Finally, we compare the resources required between different bases and find that MSTO bases yield better energies than the competing basis sets while incurring fewer qubits and two-qubit gates with VQE, QPE, and HHL. The logical T-gate counts are also found to be considerably lower for QPE and HHL respectively. Overall, our work paves way for more accurate yet less qubit-hungry quantum chemical calculations using near-term quantum computers.", "url": "https://arxiv.org/abs/2608.02119", "type": "理论+数值", "summary": "尽管最近取得了进展，但预计量子计算机在未来几年内将产生足够的噪声，以至于将量子化学计算限制在相对较少的轨道上。然而，即使具有合理质量的单粒子基组，轨道有限的小活动空间也会导致很大一部分相关能量丢失，从而激发了量子算法的中等质量量子位高效基组的设计。我们首先使用遗传算法启发的方法结合积极的细化策略重新优化现有的最小基组，并为从 H 到 F 的原子生成修改后的最小基组（MSTO-kG 基；k = 2-11）。在 FCI 理论水平上使用我们的 MSTO 基的 H 到 F 的基态能量产生的基态能量与使用 6-31G 基组获得的基态能量相当，有时甚至更低。就 Li 而言，MSTO 碱基的性能超过了 cc-pVQZ 碱基。因此，相对于 STO 基础，我们可以使用相同数量的量子位获得更好的原子能量，并且相对于更高质量的基础，使用更少的量子位获得更好/可比的能量。\n\n就分子而言，H2 的表现较差；这一发现与早期的文学作品一致。对于其他分子，Li2、C2、LiH、BeH 和 BeH2，我们的碱基的 FCI 结果（我们采用 CISD 的 C2 除外）与 6-31G 碱基的 FCI 结果相当/优于/优于 6-31G 碱基的 FCI 结果。最后，我们比较了不同基之间所需的资源，发现 MSTO 基比竞争基组产生更好的能量，同时使用 VQE、QPE 和 HHL 产生更少的量子位和两量子位门。还发现 QPE 和 HHL 的逻辑 T 门计数分别要低得多。总的来说，我们的工作为使用近期量子计算机进行更准确但对量子位的需求更少的量子化学计算铺平了道路。", "authors": [{"name": "Subimal Deb"}, {"name": "V. S. Prasannaa"}], "featured_authors": [{"name": "Subimal Deb"}, {"name": "V. S. Prasannaa"}], "author_count": 2}, {"id": "2608.02245", "category": "quant-ph", "title": "Quantum computer-based simulation of Stark many-body localization in a 1D Fermi-Hubbard model", "abstract": "Many-body localization (MBL) is a dynamical phenomenon that describes the non-ergodicity of isolated quantum many-body systems. In contrast to thermalization, this phenomenon leads to a long-lived memory of initial states of local systems and slow growth of entanglement. In this work, we study Stark MBL in a 12-qubit correlated fermionic system described by the one-dimensional Fermi-Hubbard model using Hamiltonian simulation on an IBM superconducting qubit quantum computer. To enable such a computation on current-day noisy hardware, we combine a series of compilation steps, including the use of the spin-resolved Jordan-Wigner transformation, employing SWAP networks, and integrating a tensor-network-based quantum circuit optimization routine on top of a standard circuit optimization pipeline. As a result, there is approximately an 88$\\%$ and 87$\\%$ reduction in two-qubit gate count and circuit depth, respectively. Through such simulations of the real-time dynamics using Trotterized quantum circuits, we exhibit a crossover from thermalizing dynamics of the system at a weak tilt of the field to a strongly localized behavior at large tilt with short evolution times. We also benchmark our obtained results with respect to those from exact simulations.", "url": "https://arxiv.org/abs/2608.02245", "type": "理论+数值", "summary": "多体局域化（MBL）是一种动力学现象，描述孤立量子多体系统的非遍历性。与热化相反，这种现象会导致局部系统初始状态的长期记忆和纠缠的缓慢增长。在这项工作中，我们在 IBM 超导量子位量子计算机上使用哈密顿模拟，研究由一维 Fermi-Hubbard 模型描述的 12 量子位相关费米子系统中的 Stark MBL。为了在当今的嘈杂硬件上实现此类计算，我们结合了一系列编译步骤，包括使用自旋解析 Jordan-Wigner 变换、采用 SWAP 网络以及在标准电路优化管道之上集成基于张量网络的量子电路优化例程。结果，二量子位门数和电路深度分别减少了大约 88$\\%$ 和 87$\\%$。通过使用 Trotterized 量子电路对实时动力学进行此类模拟，我们展示了从场弱倾斜时系统的热化动力学到大倾斜时的强局域化行为的交叉，且演化时间短。\n\n我们还根据精确模拟的结果对我们获得的结果进行基准测试。", "authors": [{"name": "Abdul Kalam"}, {"name": "Prasenjit Deb"}, {"name": "Akitada Sakurai"}, {"name": "Tapan Mishra"}, {"name": "V.S. Prasannaa"}, {"name": "B. P. Das"}], "featured_authors": [{"name": "Abdul Kalam"}, {"name": "Prasenjit Deb"}, {"name": "Akitada Sakurai"}, {"name": "Tapan Mishra"}, {"name": "V.S. Prasannaa"}, {"name": "B. P. Das"}], "author_count": 6}, {"id": "2608.02333", "category": "quant-ph", "title": "Finite-Syndrome Compression of Quantum Fisher Information", "abstract": "Readable error records can protect quantum sensing because they prevent physically distinct noise trajectories from being irreversibly mixed. A finite detector or ancilla, however, can retain only finitely many syndrome values, and a general criterion for deciding which records may be merged without losing metrological information is absent. We formulate the problem for a fixed fine-grained classical-quantum record and parameter-independent compression into at most $M$ flags. We prove an exact identity expressing the lost symmetric-logarithmic-derivative quantum Fisher information (SLD QFI) as a sum of state-weighted squared distances between fine and coarse SLD scores. Consequently, optimal finite-syndrome design is exactly an operator-valued clustering problem, and zero loss is characterized by a support-resolved common-SLD condition. We extend the identity to the full multiparameter SLD QFI matrix and distinguish local QFI preservation from recovery of an entire statistical model. For exact recovery of a quantum code, we separately show that, when each fine error is individually correctable, the minimum number of readable syndromes is the chromatic number of a Knill-Laflamme incompatibility graph. For qubit random-unitary noise we obtain a finite partition formula. A planar random-Pauli model admits a conditional-variance representation and, for a uniform error axis, the exact optimum $F_M^{\\star}=[M\\sin(\\pi/M)/\\pi]^2$, with deficit $\\pi^2/(3M^2)+O(M^{-4})$. These results identify the information-theoretic cost of finite syndrome resolution while making explicit the side-information assumptions required for any passive noise-to-erasure interpretation.", "url": "https://arxiv.org/abs/2608.02333", "type": "理论+数值", "summary": "可读错误记录可以保护量子传感，因为它们可以防止物理上不同的噪声轨迹不可逆地混合。然而，有限的检测器或辅助装置只能保留有限多个校正子值，并且不存在用于决定可以合并哪些记录而不丢失计量信息的一般标准。我们将固定的细粒度经典量子记录和参数无关的压缩问题表述为最多 $M$ 标志。我们证明了一个精确的恒等式，将丢失的对称对数导数量子费希尔信息 (SLD QFI) 表示为精细和粗略 SLD 分数之间的状态加权平方距离之和。因此，最优有限综合症设计实际上是一个算子值聚类问题，零损失的特征是支持解决的通用 SLD 条件。我们将恒等式扩展到完整的多参数 SLD QFI 矩阵，并将局部 QFI 保留与整个统计模型的恢复区分开来。\n\n为了精确恢复量子代码，我们分别表明，当每个精细错误都可以单独纠正时，可读校正子的最小数量是 Knill-Laflamme 不相容图的色数。对于量子位随机酉噪声，我们获得有限划分公式。平面随机泡利模型允许条件方差表示，并且对于均匀误差轴，精确的最优 $F_M^{\\star}=[M\\sin(\\pi/M)/\\pi]^2$，赤字 $\\pi^2/(3M^2)+O(M^{-4})$。这些结果确定了有限综合症解决的信息论成本，同时明确了任何被动噪声擦除解释所需的辅助信息假设。", "authors": [{"name": "Jianqi Sheng"}], "featured_authors": [{"name": "Jianqi Sheng"}], "author_count": 1}, {"id": "2608.02403", "category": "quant-ph", "title": "Entanglement Generation Beyond Quantum Theory: From Product States to Popescu-Rohrlich Boxes", "abstract": "Entanglement generation is a fundamental dynamical capability in quantum information science and underpins many quantum advantages. While quantum theory enables it through unitary dynamics, boxworld, a generalized probabilistic theory admitting Popescu--Rohrlich boxes with supraquantum correlations, has no reversible transformation capable of generating entanglement. We show that this no-go picture changes fundamentally once reversibility is relaxed to pure-state preservation. We construct a pure-state-preserving transformation that maps every uncorrelated pure state to a Popescu--Rohrlich box and completely classify all pure-state-preserving entangling transformations in the simplest bipartite boxworld. Our results provide the first explicit mechanism for generating beyond-quantum entanglement without introducing mixing and demonstrate a physical distinction between reversibility and pure-state preservation that is obscured by the structure of quantum theory.", "url": "https://arxiv.org/abs/2608.02403", "type": "理论", "summary": "纠缠生成是量子信息科学中的一种基本动力学能力，是许多量子优势的基础。虽然量子理论通过酉动力学实现了这一点，但盒子世界（boxworld）是一种广义概率理论，承认波佩斯库（具有超量子相关性的罗尔利希盒子）不具有能够产生纠缠的可逆变换。我们表明，一旦可逆性放宽到纯状态保存，这种不可行的情况就会发生根本性的变化。我们构建了一个纯状态保留变换，将每个不相关的纯状态映射到 Popescu-Rohrlich 盒，并在最简单的二分盒世界中对所有纯状态保留纠缠变换进行完全分类。我们的结果提供了第一个在不引入混合的情况下产生超量子纠缠的明确机制，并证明了可逆性和纯态保存之间的物理区别，而这种区别被量子理论的结构所掩盖。", "authors": [{"name": "Shun Umekawa"}, {"name": "Akihiro Hokkyo"}, {"name": "Hayato Arai"}, {"name": "Kazuaki Takasan"}], "featured_authors": [{"name": "Shun Umekawa"}, {"name": "Akihiro Hokkyo"}, {"name": "Hayato Arai"}, {"name": "Kazuaki Takasan"}], "author_count": 4}, {"id": "2608.02427", "category": "quant-ph", "title": "Caustics and Superenergy in the Quantum Bouncer", "abstract": "We investigate the quantum interference and energetic phenomena associated with classical caustics in the quantum bouncing ball problem, we refer to as quantum caustics. By considering an initial Gaussian wavepacket, we show that caustics associated with the underlying classical trajectory families are exhibited. We connect the associated phase singularity chains in the vicinity of the caustic with the semiclassical Pearcey function built on the cusp catastrophe lines. We also quantify the amount of superenergy exhibited in these solutions - regions of space where the local energy exceeds the largest constituent energy eigenvalue. We give a complimentary description of the caustic and superenergy behavior using the Madelung/Bohm trajectories, which gives additional insight about the energy of the trajectories and how they traverse the phase singularity chains.", "url": "https://arxiv.org/abs/2608.02427", "type": "理论", "summary": "我们研究了量子弹球问题中与经典焦散相关的量子干涉和能量现象，我们称之为量子焦散。通过考虑初始高斯波包，我们证明了与基础经典轨迹族相关的焦散。我们将焦散附近的相关相奇点链与建立在尖点突变线上的半经典皮尔西函数连接起来。我们还量化了这些解决方案中表现出的超能量的量 - 局部能量超过最大组成能量特征值的空间区域。我们使用马德隆/玻姆轨迹对苛性和超能行为进行了补充描述，这提供了关于轨迹能量以及它们如何穿越相奇点链的额外见解。", "authors": [{"name": "Marko. M. Ćosić"}, {"name": "Andrew N. Jordan"}], "featured_authors": [{"name": "Marko. M. Ćosić"}, {"name": "Andrew N. Jordan"}], "author_count": 2}, {"id": "2608.02451", "category": "quant-ph", "title": "Spread complexity as a probe in generalized and long-range Aubry-Andre-Harper models", "abstract": "We investigate the spread complexity of quantum quenches in generalized and long-range Aubry-Andre-Harper (AAH) models, encompassing regimes with and without mobility edges. In particular, in the generalized AAH models supporting energy-dependent mobility edges, we demonstrate that the long-time averaged spread complexity exhibits nonanalytic behavior when the post-quench quasiperiodic potential crosses the mobility edge associated with the energy of the initial eigenstate, thereby accurately identifying the mobility-edge transition. Such a behavior is supported by the spreading of local density of states. We further derive analytical expressions for the moments and the corresponding Lanczos coefficients for quenches between the limits of vanishing and strong quasiperiodic potentials. The Lanczos coefficients display qualitatively distinct behavior depending on the presence of mobility edges - they exhibit an initial plateau followed by a decay with the Krylov basis index, in contrast to the nearly constant behavior of the conventional AAH model without mobility edges. For LR hopping, the coefficients decay with the Krylov basis index for quenches from the localized to the extended phase, while they coincide with the AAH results for quenches in the opposite direction.", "url": "https://arxiv.org/abs/2608.02451", "type": "理论", "summary": "我们研究了广义和长程 Aubry-Andre-Harper (AAH) 模型中量子淬灭的扩散复杂性，涵盖有和没有迁移率边缘的情况。特别是，在支持能量相关迁移率边缘的广义 AAH 模型中，我们证明，当淬火后准周期势穿过与初始本征态能量相关的迁移率边缘时，长期平均扩展复杂度表现出非解析行为，从而准确识别迁移率边缘转变。这种行为得到了局部状态密度的扩展的支持。我们进一步推导了矩的解析表达式以及消失极限和强准周期势之间猝灭的相应 Lanczos 系数。根据迁移率边缘的存在，Lanczos 系数显示出性质不同的行为 - 它们表现出一个初始平台，然后随 Krylov 基指数衰减，这与没有迁移率边缘的传统 AAH 模型几乎恒定的行为形成鲜明对比。\n\n对于 LR 跳变，从局部相到扩展相的猝灭系数随 Krylov 基指数衰减，而与相反方向猝灭的 AAH 结果一致。", "authors": [{"name": "Triyas Sapui"}, {"name": "Tanoy Kanti Konar"}, {"name": "Subinay Dasgupta"}, {"name": "Aditi Sen De"}], "featured_authors": [{"name": "Triyas Sapui"}, {"name": "Tanoy Kanti Konar"}, {"name": "Subinay Dasgupta"}, {"name": "Aditi Sen De"}], "author_count": 4}, {"id": "2608.02517", "category": "quant-ph", "title": "Thermalization of open quantum systems with pseudomodes", "abstract": "Pseudomode approaches allow for an exact and unapproximated description of a quantum system interacting arbitrarily strongly with a bath. In general, a system coupled to pseudomodes will not thermalize to the system's Gibbs state: This is to be expected when the system-bath coupling is non-perturbative, but conflicts with common thermodynamic intuition when the system-bath coupling is asymptotically weak. We explore under which circumstances pseudomode models satisfy detailed balance (and subsequently thermalize to the system Gibbs state) and how specific choices of parameters can force \"weak\" detailed balance that is restricted to a limited frequency range. A combination of Hermitian and non-Hermitian pseudomodes that yields a flat effective-temperature profile is also considered. The results and criteria established here are relevant for the construction of pseudomode models in contexts where thermodynamic consistency is required.", "url": "https://arxiv.org/abs/2608.02517", "type": "理论", "summary": "伪模方法允许对与浴任意强烈相互作用的量子系统进行精确且非近似的描述。一般来说，耦合到赝模的系统不会热化到系统的吉布斯状态：当系统-浴耦合是非微扰时，这是可以预料到的，但当系统-浴耦合渐近弱时，这与常见的热力学直觉相冲突。我们探讨了在哪些情况下赝模模型满足详细平衡（并随后热化到系统吉布斯状态），以及参数的特定选择如何强制限制在有限频率范围内的“弱”详细平衡。还考虑了产生平坦有效温度分布的埃尔米特和非埃尔米特赝模的组合。这里建立的结果和标准与需要热力学一致性的情况下伪模式模型的构建相关。", "authors": [{"name": "R. Kevin Kessing"}, {"name": "Thibaut Lacroix"}, {"name": "Susana F. Huelga"}, {"name": "Martin B. Plenio"}], "featured_authors": [{"name": "R. Kevin Kessing"}, {"name": "Thibaut Lacroix"}, {"name": "Susana F. Huelga"}, {"name": "Martin B. Plenio"}], "author_count": 4}, {"id": "2608.02587", "category": "quant-ph", "title": "Entanglement of flower states", "abstract": "The mysterious nature of entanglement, one of the most prominent exquisitely quantum phenomena, is reflected in its intricate operational structure, with a hierarchy of classes of free operations that enable its manipulation at different levels of effectiveness. Here we use the class of 'flower states', parametrised by their (even) local dimension $2k$, to shine light on some aspects of this varied landscape. We compute all the main entanglement measures for flower states, uncovering a large gap between all forms of distillable entanglement, equal to 1 ebit independently of the local dimension, and the entanglement cost under local operations and classical communication (LOCC), known to be equal to $\\log\\big(2\\sqrt{k}\\big)$. Even under the strictly more powerful class of non-entangling (NE) operations, we show that their cost is still equal to $\\log\\big(1+\\sqrt{k}\\big)$, only about an ebit less than for LOCCs. This result, which we prove by calculating the recently introduced tempered entanglement negativity for these states, demonstrates the largest known 'irreversibility gap', i.e. the difference between distillable entanglement and entanglement cost, under NE operations, equal to $\\Theta\\big(\\frac12 \\log d\\big)$, with $d$ being the local dimension. A notable consequence is that the celebrated squashed entanglement is not a monotone under NE operations. Finally, we compute the exact cost under LOCC operations for flower states; this is given by the Schmidt number, which turns out to be additive over multiple copies and equal to $\\min_{r|k} \\log\\left( r + \\frac{k}{r} \\right)$; for prime $k$ this reduces to $\\log(k+1)$, about twice the standard LOCC cost. These last results leverage the uncertainty relations over cyclic groups proved by Tao and Meshulam.", "url": "https://arxiv.org/abs/2608.02587", "type": "理论", "summary": "纠缠是最突出的精致量子现象之一，它的神秘本质反映在其复杂的运算结构中，具有自由运算类别的层次结构，使其能够在不同的有效性级别上进行操作。在这里，我们使用“花状态”类，通过其（偶数）局部维度 $2k$ 进行参数化，以阐明这种不同景观的某些方面。我们计算了花状态的所有主要纠缠度量，揭示了所有形式的可蒸馏纠缠之间的巨大差距，等于 1 ebit，与局部维度无关，以及局部操作和经典通信 (LOCC) 下的纠缠成本，已知等于 $\\log\\big(2\\sqrt{k}\\big)$。即使在严格更强大的非纠缠（NE）操作类别下，我们表明它们的成本仍然等于 $\\log\\big(1+\\sqrt{k}\\big)$，仅比 LOCC 少大约一个 ebit。我们通过计算最近引入的这些状态的缓和纠缠负性来证明这一结果，证明了已知的最大“不可逆间隙”，即\n\n在NE操作下，可蒸馏纠缠和纠缠成本之间的差异等于$\\Theta\\big(\\frac12\\log d\\big)$，其中$d$是局部维度。一个值得注意的结果是，著名的压缩纠缠在 NE 操作下并不是单调的。最后，我们计算花状态在 LOCC 操作下的确切成本；这是由施密特数给出的，它是多个副本的累加，等于 $\\min_{r|k} \\log\\left( r + \\frac{k}{r} \\right)$;对于素数 $k$，这会减少到 $\\log(k+1)$，大约是标准 LOCC 成本的两倍。最后的结果利用了由 Tai 和 Meshulam 证明的循环群的不确定性关系。", "authors": [{"name": "Samrat Sen"}, {"name": "Ludovico Lami"}], "featured_authors": [{"name": "Samrat Sen"}, {"name": "Ludovico Lami"}], "author_count": 2}, {"id": "2608.02590", "category": "quant-ph", "title": "Optimal Quantum de Finetti Theorems via Argmax Rounding", "abstract": "We prove optimal finite quantum de Finetti upper bounds. Given a bosonic state $\\rho_N\\in D(\\mathrm{Sym}^N(\\mathbb C^d))$, there is a probability measure $\\nu$ on the unit sphere such that \\[ \\left\\| \\rho_N^{(2)}-\\int |u\\rangle\\langle u|^{\\otimes 2}\\,d\\nu(u) \\right\\|_1 \\le \\frac{\\sqrt{d-1}}{N-1}. \\] By purification, the bosonic theorem also gives the optimal $O(d/N)$ upper bound for arbitrary exchangeable states. These results settle the dimension dependence left open by Christandl, König, Mitchison, and Renner (CMP 2007). The proof casts de Finetti approximation as sum-of-squares rounding and applies the argmax method of Jeronimo, Wu, and Xu (manuscript 2026). More generally, $t$-site marginals satisfy $O(t\\sqrt d/N)$ bosonic and $O(td/N)$ permutation-invariant bounds. Our proof formulates de Finetti approximation as the integrality gap of a symmetric-extension semidefinite program and rounds an optimum by the argmax principle. The sharp bounds have several consequences. For every fixed $\\varepsilon\\in(0,1)$, we construct a channel with input dimension $D=\\exp(O_\\varepsilon(\\sqrt d\\log d))=\\exp(o(d))$ whose outputs are $\\varepsilon$-close to separable states of local dimension $d$ and whose image contains every such separable state, thereby refuting Watrous's disentangler conjecture. We also obtain deterministic $\\exp(\\widetilde O(\\sqrt d/\\varepsilon))$-time algorithms for explicit Best Separable State without perfect completeness and for trace-distance separability testing. Finally, spectral truncation gives the first dimension-free bosonic de Finetti theorem in Hilbert--Schmidt distance, with the optimal rate $\\Theta(N^{-1/2})$ when the dimension may grow.", "url": "https://arxiv.org/abs/2608.02590", "type": "理论+数值", "summary": "我们证明了最优有限量子 de Finetti 上限。给定一个玻色子态 $\\rho_N\\in D(\\mathrm{Sym}^N(\\mathbb C^d))$，单位球上有一个概率测度 $\\nu$ 使得 \\[ \\left\\| \\rho_N^{(2)}-\\int |u\\rangle\\langle u|^{\\otimes 2}\\,d\\nu(u) \\right\\|_1 \\le \\frac{\\sqrt{d-1}}{N-1}。 \\] 通过纯化，玻色子定理还给出了任意可交换态的最优 $O(d/N)$ 上限。这些结果解决了 Christandl、König、Mitchison 和 Renner 留下的尺寸依赖性问题（CMP 2007）。该证明将 de Finetti 近似转化为平方和舍入，并应用 Jeronimo、Wu 和 Xu 的 argmax 方法（手稿 2026）。更一般地，$t$位点边缘满足$O(t\\sqrt d/N)$玻色子和$O(td/N)$排列不变边界。我们的证明将 de Finetti 近似公式化为对称扩展半定规划的完整性间隙，并通过 argmax 原理舍入最优值。尖锐的界限有几个后果。\n\n对于每个固定的$\\varepsilon\\in(0,1)$，我们构造一个输入维度为$D=\\exp(O_\\varepsilon(\\sqrt d\\log d))=\\exp(o(d))$的通道，其输出为$\\varepsilon$-接近局部维度$d$的可分离状态，并且其图像包含每个这样的可分离状态，从而反驳了Watrous的解缠结猜想。我们还获得了确定性 $\\exp(\\widetilde O(\\sqrt d/\\varepsilon))$ 时间算法，用于没有完美完整性的显式最佳可分离状态以及迹线距离可分离性测试。最后，谱截断给出了希尔伯特-施密特距离中的第一个无维玻色子de Finetti定理，当维度可能增长时，最优速率$\\Theta(N^{-1/2})$。", "authors": [{"name": "Fernando Granha Jeronimo"}, {"name": "Pei Wu"}, {"name": "Haochen Xu"}], "featured_authors": [{"name": "Fernando Granha Jeronimo"}, {"name": "Pei Wu"}, {"name": "Haochen Xu"}], "author_count": 3}, {"id": "2608.02600", "category": "quant-ph", "title": "Nearly tight lower bounds for estimating quantum functionals: Uhlmann fidelity, trace distance, and von Neumann entropy", "abstract": "In this paper, we present a unified framework for proving lower bounds for estimating functionals of quantum states. We therefore resolve several open problems by establishing lower bounds that match known upper bounds: we show that it requires $\\widetilde{\\Omega}(N^2)$ samples to estimate the Uhlmann fidelity, trace distance, and von Neumann entropy. Moreover, they immediately imply matching query lower bounds of $\\widetilde{\\Omega}(N)$ by quantum sample-to-query lifting. These lower bounds imply the near-optimality of a dozen quantum algorithms since 2016.", "url": "https://arxiv.org/abs/2608.02600", "type": "理论+数值", "summary": "在本文中，我们提出了一个统一的框架来证明估计量子态泛函的下界。因此，我们通过建立与已知上限相匹配的下限来解决几个开放问题：我们证明需要 $\\widetilde{\\Omega}(N^2)$ 样本来估计乌尔曼保真度、迹距离和冯诺依曼熵。此外，它们立即意味着通过量子样本到查询提升来匹配 $\\widetilde{\\Omega}(N)$ 的查询下界。这些下限意味着自 2016 年以来十几种量子算法接近最优。", "authors": [{"name": "Qisheng Wang"}], "featured_authors": [{"name": "Qisheng Wang"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");

    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
