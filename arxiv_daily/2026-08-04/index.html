  <style>
    :root {

    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }

    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }

  <script>
    const papers = [{"id": "2608.00002", "category": "cond-mat", "title": "Prismatic Soft Cubes", "abstract": "Soft cells are shapes without sharp corners that can fill the space without gaps and overlaps [2]. A sharp corner is a point on the surface of the solid through which no smooth curve passes. In the paper introducing the concept of soft cells [2], the authors proved that there exists an algorithm that can soften tilings consisting of convex polyhedra, preserving the lattice points and combinatorial structure of the original tiling. Although the algorithm guarantees (with a few restrictions) that there exists a soft tiling that is combinatorially equivalent to the convex polyhedral tiling, the proof does not address how to find all such tilings. For a polyhedral tiling based on a truncated octahedral cell, paper [3] shows how to find all soft tilings for a fixed symmetry group. In this paper, we extend this method and apply it to the cubic lattice, imposing only natural conditions, rather than symmetry constraints. The natural conditions being, the directions of edge half-tangents of the tiling are restricted to lattice directions, and the edges of the tiling are planar. This results in 26 soft cubic cells with different geometries. A total of 68 fundamental domains can be created from the cells, which can be classified into 8 groups based on their lattice symmetry. The paper also presents an algorithmic process (with a corresponding program in language Python) for classifying the 26 non-equivalent geometric cell types.", "url": "https://arxiv.org/abs/2608.00002", "type": "理论+数值", "summary": "软单元是没有尖角的形状，可以无间隙和重叠地填充空间[2]。尖角是实体表面上没有平滑曲线通过的点。在引入软单元概念的论文[2]中，作者证明了存在一种算法可以软化由凸多面体组成的平铺，同时保留原始平铺的格点和组合结构。尽管该算法保证（有一些限制）存在组合上与凸多面体平铺等效的软平铺，但证明并未解决如何找到所有此类平铺。对于基于截断八面体单元的多面体平铺，论文 [3] 展示了如何找到固定对称群的所有软平铺。在本文中，我们扩展了这种方法并将其应用于立方晶格，仅施加自然条件，而不是对称约束。自然条件是，平铺的边缘半切线方向被限制为格子方向，并且平铺的边缘是平面的。这会产生 26 个具有不同几何形状的软立方单元。\n\n细胞总共可以创建 68 个基本域，根据晶格对称性可以将其分为 8 组。该论文还提出了一种对 26 种非等价几何单元类型进行分类的算法过程（带有相应的 Python 语言程序）。", "authors": [{"name": "Kinga Kocsis"}], "featured_authors": [{"name": "Kinga Kocsis"}], "author_count": 1}, {"id": "2608.00032", "category": "cond-mat", "title": "Static compliance and directional instability in indefinite conformation states", "abstract": "A conformation tensor is positive definite for every physically realizable polymer microstructural state. Numerical discretization can move the conformation tensor outside the positive-definite domain. This raises a question: can the least eigenvalue alone identify the first unstable direction? We answer it by linearizing Oldroyd-B, equilibrium-normalized FENE-P and Giesekus models about uniform frozen states. All include solvent viscosity and stress diffusion. We examine every non-zero planar Fourier mode, assuming each model's uncoupled constitutive tangent is strictly stable. The margin $1+r\\chi$ measures the balance between solvent damping and the zero-frequency polymer response. The complete velocity--conformation system is stable if and only if this margin is positive. At zero margin, a simple stationary root appears; finite inertia changes growth rates but not the neutral boundary. At fixed wavenumber and other parameters, decreasing $\\lambda_1$ identifies the first neutral direction. Oldroyd-B and equilibrium-normalized FENE-P first become neutral along principal directions; Giesekus mobility can instead make an oblique direction neutral first. For the reference case, onset is $\\lambda_{1,c}=-1.933$ at $\\theta_c=23.94^\\circ$, before the principal-axis prediction. Along this family, the all-direction threshold approaches $-2.319$ as the other principal stretch grows, whereas the formal principal-axis extrapolation tends to negative infinity. A rational-parameter counterexample, matrix spectra and uniform forced-base calculations test the neutral boundary and both sides. These results concern one linear, uniform, planar Fourier mode, not nonlinear or inhomogeneous-flow stability. Within this scope, onset depends not on indefiniteness alone but also on constitutive-tangent geometry and wavevector direction.", "url": "https://arxiv.org/abs/2608.00032", "type": "理论+数值", "summary": "对于每个物理上可实现的聚合物微观结构状态，构象张量都是正定的。数值离散化可以将构象张量移到正定域之外。这就提出了一个问题：仅用最小特征值就能确定第一个不稳定方向吗？我们通过线性化 Oldroyd-B、平衡归一化 FENE-P 和关于均匀冻结态的 Giesekus 模型来回答这个问题。所有这些都包括溶剂粘度和应力扩散。我们检查每个非零平面傅里叶模式，假设每个模型的非耦合本构切线严格稳定。裕度 $1+r\\chi$ 衡量溶剂阻尼和零频率聚合物响应之间的平衡。当且仅当该裕度为正时，完整的速度构象系统才是稳定的。在零边际处，出现简单平稳根；有限惯性会改变增长率，但不会改变中性边界。在固定波数和其他参数下，减小 $\\lambda_1$ 确定第一个中性方向。 Oldroyd-B 和平衡归一化 FENE-P 首先沿主方向变为中性；吉塞库斯的机动性可以首先使倾斜方向成为中立。\n\n对于参考案例，在主轴预测之前，起始点为 $\\lambda_{1,c}=-1.933$，位于 $\\theta_c=23.94^\\circ$。沿着这个家族，随着其他主要延伸的增长，全方位阈值接近 $-2.319$，而正式的主轴外推法趋向于负无穷大。有理参数反例、矩阵谱和均匀力基计算测试了中性边界和两侧。这些结果涉及一种线性、均匀、平面傅里叶模式，而不是非线性或非均匀流动稳定性。在此范围内，起始不仅取决于不定性，还取决于本构切线几何形状和波矢方向。", "authors": [{"name": "Yuan Yu"}], "featured_authors": [{"name": "Yuan Yu"}], "author_count": 1}, {"id": "2608.00116", "category": "cond-mat", "title": "AC Field-driven orientational crossover and energy dissipation in suspended magnetic nanoparticles", "abstract": "By combining the Landau--Lifshitz--Gilbert equation with Brownian rotational dynamics of magnetic nanoparticles (MNPs), we theoretically investigate the role of particle rotation through easy-axis reorientation in magnetic fluid hyperthermia (MFH). Our results reveal a field-driven crossover in the stationary orientation of the easy axes, from predominantly perpendicular to predominantly parallel or antiparallel to the applied field as the field amplitude increases. Although the precise crossover field depends on particle size and excitation frequency, it occurs at approximately $0.5H_k$, where $H_k$ is the uniaxial anisotropy field. These orientational regimes are directly linked to the underlying microscopic dynamics and the associated MFH performance through the occurrence of switching and non-switching hysteresis cycles, predominantly associated with Néel magnetization reversal and Brownian particle rotation, respectively. The relative importance of these dissipation mechanisms also depends on frequency: at $f=1$ MHz, Brownian heating dominates at low field amplitudes, whereas Néel heating dominates at high fields. By contrast, at $f=100$ kHz, both contributions remain comparable over most of the investigated field range.", "url": "https://arxiv.org/abs/2608.00116", "type": "理论", "summary": "通过将 Landau--Lifshitz--Gilbert 方程与磁性纳米颗粒 (MNP) 的布朗旋转动力学相结合，我们从理论上研究了磁流体热疗 (MFH) 中通过易轴重新定向实现的颗粒旋转的作用。我们的结果揭示了易轴静止方向上的场驱动交叉，随着场振幅的增加，从主要垂直到主要平行或反平行于施加的场。尽管精确的交叉场取决于颗粒尺寸和激发频率，但它发生在大约 $0.5H_k$ 处，其中 $H_k$ 是单轴各向异性场。这些取向状态通过切换和非切换磁滞循环的发生与潜在的微观动力学和相关的 MFH 性能直接相关，主要分别与尼尔磁化反转和布朗粒子旋转相关。这些耗散机制的相对重要性还取决于频率：在 $f=1$ MHz 时，布朗加热在低场幅值下占主导地位，而尼尔加热在高场幅值下占主导地位。\n\n相比之下，在 $f=100$kHz 时，两种贡献在大多数研究领域范围内仍然具有可比性。", "authors": [{"name": "Iago López-Vázquez"}, {"name": "Siraj Ul Haq"}, {"name": "Kazuya Okada"}, {"name": "Sergiu Ruta"}, {"name": "Roy W. Chantrell"}, {"name": "Òscar Iglesias"}, {"name": "David Serantes"}], "featured_authors": [{"name": "Iago López-Vázquez"}, {"name": "Siraj Ul Haq"}, {"name": "Kazuya Okada"}, {"name": "Roy W. Chantrell"}, {"name": "Òscar Iglesias"}, {"name": "David Serantes"}], "author_count": 7}, {"id": "2608.00131", "category": "cond-mat", "title": "Wrinkling of Randomly Heterogeneous Film-Substrate Systems", "abstract": "Wrinkling instabilities in stiff films on compliant substrates are strongly affected by spatial fluctuations in film stiffness. We develop a homogenized instability theory for one-dimensional film--substrate systems with random bending stiffness. The heterogeneous stability equation is reformulated as a Lippmann--Schwinger equation for the curvature field, and a strong-contrast expansion is derived using a local--nonlocal kernel decomposition and a cavity-field formulation. Truncation at third order yields an effective polarizability and a Dyson-type dispersion relation for predicting the critical load and wavenumber. The stiffness is modeled as an exponentially mapped Gaussian random field, allowing the required two- and three-point connected statistics to be obtained analytically. The theory is validated against generalized eigenvalue calculations and Fourier spectral simulations. Increasing stiffness contrast lowers the critical load and shifts the instability toward higher wavenumbers, producing shorter wrinkles. At weak contrast, the threshold follows the universal scaling $N_c^{(0)}-N_c\\sim\\varepsilon^2$, whereas at moderate and strong contrast the third-order approximation is more accurate than the second-order theory. Wavelength selection is controlled by the ratio of the dominant material wavelength $\\lambda^\\ast$ to the harmonic-mean reference wavelength $\\lambda_H$. For $\\lambda^\\ast/\\lambda_H<1$, the harmonic-mean model accurately predicts the wrinkle wavelength. The framework provides a mechanics-based tool for reliability assessment and design of statistically heterogeneous film--substrate systems.", "url": "https://arxiv.org/abs/2608.00131", "type": "理论+数值", "summary": "柔顺基材上硬薄膜的起皱不稳定性受到薄膜刚度空间波动的强烈影响。我们为具有随机弯曲刚度的一维薄膜-基底系统开发了均质不稳定性理论。将异质稳定性方程重新表述为曲率场的 Lippmann-Schwinger 方程，并使用局部-非局部核分解和空腔场公式导出强对比度展开。三阶截断产生有效的极化率和戴森型色散关系，用于预测临界载荷和波数。刚度被建模为指数映射的高斯随机场，允许通过分析获得所需的两点和三点连接的统计数据。该理论通过广义特征值计算和傅里叶谱模拟进行了验证。增加刚度对比度会降低临界载荷并将不稳定性转向更高的波数，从而产生更短的皱纹。\n\n在弱对比度下，阈值遵循通用缩放 $N_c^{(0)}-N_c\\sim\\varepsilon^2$，而在中等和强对比度下，三阶近似比二阶理论更准确。波长选择由主材料波长 $\\lambda^\\ast$ 与调和平均参考波长 $\\lambda_H$ 的比率控制。对于 $\\lambda^\\ast/\\lambda_H<1$，调和平均模型可以准确预测皱纹波长。该框架提供了一种基于力学的工具，用于统计异质薄膜-基底系统的可靠性评估和设计。", "authors": [{"name": "Xinyu Xing"}, {"name": "Liyu Zhong"}, {"name": "Feng Deng"}, {"name": "Sheng Mao"}], "featured_authors": [{"name": "Xinyu Xing"}, {"name": "Liyu Zhong"}, {"name": "Feng Deng"}, {"name": "Sheng Mao"}], "author_count": 4}, {"id": "2608.00157", "category": "cond-mat", "title": "An asymptotically solvable model of many-body critical phases: mobility edges, scars, and inverted scars", "abstract": "While the prethermal regime of random many-body localized (MBL) systems is dominated by accidental many-body resonances, another class of resonances, originating from the underlying potential structure, is expected in large-size deterministic systems. It is known that this class of resonances can lead to single-particle critical phases that are neither localized nor extended, but the consequences in interacting systems remain unclear. In this work, we construct an asymptotically solvable model of a one-dimensional nearest-neighbor interacting spin chain, whose spatial structure induces a hierarchy of mirror-like many-body resonances. We derive two phases in the thermodynamic limit, characterized by the satisfaction and violation of a version of the weak eigenstate thermalization hypothesis (ETH). While these two phases are similar to the usual MBL and ETH phases, there exist rare eigenstates that behave like the opposite phase, interpreted as many-body scars and inverted scars. Surprisingly, the two phases can be separated by a finite-temperature phase transition, corresponding to a thermodynamic many-body mobility edge, which was often believed to be impossible. Our results also suggest the existence of delocalized rare regions in an otherwise-localized interacting Aubry-André model, even if there are no low-disorder regions like those in random systems. This challenges the common belief that there is no avalanche instability in quasiperiodic MBL.", "url": "https://arxiv.org/abs/2608.00157", "type": "理论", "summary": "虽然随机多体局域 (MBL) 系统的预热态主要由偶然多体共振主导，但在大型确定性系统中预计会出现另一类源自潜在势结构的共振。众所周知，这类共振可以导致既不局部也不扩展的单粒子临界相，但相互作用系统中的后果仍不清楚。在这项工作中，我们构建了一个一维最近邻相互作用自旋链的渐近可解模型，其空间结构引起了类似镜子的多体共振的层次结构。我们推导出热力学极限的两个阶段，其特征是满足和违反弱本征态热化假说（ETH）的一个版本。虽然这两个相与通常的 MBL 和 ETH 相类似，但存在罕见的本征态，其行为类似于相反的相，被解释为多体疤痕和倒置疤痕。令人惊讶的是，这两个相可以通过有限温度相变来分离，这对应于热力学多体迁移边缘，这通常被认为是不可能的。\n\n我们的结果还表明，即使不存在像随机系统中那样的低无序区域，在其他局部相互作用的 Aubry-André 模型中也存在离域稀有区域。这挑战了人们普遍认为准周期 MBL 不存在雪崩不稳定性的观点。", "authors": [{"name": "Yi-Ting Tu"}, {"name": "Zi-Jian Li"}, {"name": "Sankar Das Sarma"}], "featured_authors": [{"name": "Yi-Ting Tu"}, {"name": "Zi-Jian Li"}, {"name": "Sankar Das Sarma"}], "author_count": 3}, {"id": "2608.00210", "category": "cond-mat", "title": "Chiral Magnon Mixing by Symmetry-Breaking in Collinear Ferrimagnets", "abstract": "Magnons in ferromagnets possess spin angular momentum defined by right-handed precession of the moment around the magnetization direction. In antiferromagnets with no net magnetization, left-and right-handed magnons are degenerate in the absence of an applied field. Ferrimagnets possess uncompensated magnetic sublattices, which should natively possess right-and left-handed magnons where their energy is split by the internal molecular field. Here, we show that RMn6Sn6 (R = Tb, Er) ferrimagnets possess right and left-handed magnon bands that cross at finite momentum (k) within the basal plane, defining modes with opposite dynamical chirality. Depending on the symmetry of the ferrimagnetic order, which may be manipulated by varying the rare-earth magnetic anisotropy or with applied field, the band crossing may remain a nodal line or may be gapped. The gapped modes contain hybridized chiral excitations whose chirality becomes k-dependent.", "url": "https://arxiv.org/abs/2608.00210", "type": "理论", "summary": "铁磁体中的磁振子具有由围绕磁化方向的力矩的右手进动定义的自旋角动量。在没有净磁化强度的反铁磁体中，左手和右手磁振子在没有外加磁场的情况下会简并。亚铁磁体具有未补偿的磁性亚晶格，其本身应该具有右旋和左旋磁振子，其能量被内部分子场分裂。在这里，我们证明 RMn6Sn6 (R = Tb, Er) 亚铁磁体具有右旋和左旋磁振子带，它们在基面内以有限动量 (k) 交叉，定义具有相反动态手性的模式。根据亚铁磁序的对称性（可以通过改变稀土磁各向异性或通过施加场来操纵），带交叉可以保持节点线或可以有间隙。带隙模式包含杂化手性激发，其手性变得依赖于 k。", "authors": [{"name": "Dhurba R. Jaishi"}, {"name": "Tyler J. Slade"}, {"name": "S. X. M. Riberolles"}, {"name": "Bing Li"}, {"name": "Tianxiong Han"}, {"name": "D. M. Pajerowski"}, {"name": "D. L. Abernathy"}, {"name": "Barry Winn"}, {"name": "Melissa Graves-Brook"}, {"name": "B. G. Ueland"}, {"name": "R. J. McQueeney"}], "featured_authors": [{"name": "Dhurba R. Jaishi"}, {"name": "Tyler J. Slade"}, {"name": "S. X. M. Riberolles"}, {"name": "Melissa Graves-Brook"}, {"name": "B. G. Ueland"}, {"name": "R. J. McQueeney"}], "author_count": 11}, {"id": "2608.00226", "category": "cond-mat", "title": "Analytical Charge Density Profile of Vortex Core in Weak-Coupling Superconductor", "abstract": "Self-consistent Bogoliubov-de Gennes calculations have long shown that solving the Poisson equation inside a superconducting vortex turns a one-signed charge depletion into a modulation that alternates in sign with period $\\pi/k_F$. We give an elementary account of that result. Taking the Caroli-de Gennes-Matricon bound states in a step-like gap, we show that the normalization of the bound-state spinor is nearly independent of angular momentum, which collapses the mode sum into closed form. Inside the core the vortex winding removes one Bessel channel from a completeness sum, so the density vanishes on the vortex line and carries Friedel-like oscillations of wavevector $2k_F$; outside it the sum gives a $1/r$ envelope decaying over a coherence length, with a residual ripple. The bound-state charge does not integrate to zero, so neutrality obliges the extended states to compensate it exactly. That compensation is complete at long wavelength but fails at the diameter of the Fermi circle, and what survives is a sign-alternating $2k_F$ modulation reduced only by $4k_F^2/(4k_F^2+k_{TF}^2)$, a factor lying between one-half and three-quarters for any metal. The oscillation is therefore not a delicate effect but a consequence of neutrality and the inefficiency of screening at large momentum transfer: in the screened total the smooth terms cancel and only the ripple is left.", "url": "https://arxiv.org/abs/2608.00226", "type": "理论+数值", "summary": "自洽的 Bogoliubov-de Gennes 计算早已表明，求解超导涡旋内的泊松方程会将单符号电荷耗尽转变为符号随周期 $\\pi/k_F$ 交替的调制。我们对这个结果给出一个基本的说明。以阶梯状间隙中的 Caroli-de Gennes-Matricon 束缚态为例，我们表明束缚态旋量的归一化几乎与角动量无关，这将模式和压缩为闭合形式。在核心内部，涡旋绕组从完整性和中移除了一个贝塞尔通道，因此密度在涡旋线上消失并携带波矢 $2k_F$ 的弗里德尔式振荡；在它之外，总和给出了在相干长度上衰减的 $1/r$ 包络，并带有残余纹波。束缚态电荷不会积分为零，因此中性迫使扩展态对其进行精确补偿。这种补偿在长波长处完成，但在费米圆直径处失败，幸存下来的是符号交替 $2k_F$ 调制，仅减少 $4k_F^2/(4k_F^2+k_{TF}^2)$，对于任何金属来说，该系数介于二分之一到四分之三之间。\n\n因此，振荡不是一种微妙的效应，而是中性和大动量传递时筛选效率低下的结果：在筛选的总数中，平滑项取消，只留下波纹。", "authors": [{"name": "Chi-Ken Lu"}], "featured_authors": [{"name": "Chi-Ken Lu"}], "author_count": 1}, {"id": "2608.00390", "category": "cond-mat", "title": "Skyrmion Excitations in the $ν=-1$ Quantum Hall state in Monolayer Graphene", "abstract": "We investigate the skyrmion excited states atop the $SU(4)$ quantum Hall ferromagnetic ground state at filling factor $\\nu=-1$ in monolayer graphene. The competition among short-range anisotropic interactions, the Zeeman coupling, and sublattice symmetry-breaking potential gives rise to four distinct spin-valley-ordered ground-state phases. Combining effective field theory with the Hartree--Fock approximation, we develop a variational framework that incorporates both the long-range Coulomb interaction and the symmetry-breaking terms on an equal footing. Variational minimization determines the optimal skyrmion texture, including both its spatial radial profile and internal $SU(4)$ spinor structure. We establish the phase diagram of skyrmion excitations, identify thirteen distinct skyrmion phases under different external-field conditions, and determine their spin-valley textures, energies, and characteristic sizes. The robustness of the results against different radial ansätze demonstrates the reliability of our variational approach. Our work provides a systematic framework for studying skyrmion excitations in multicomponent quantum Hall ferromagnets and can be naturally extended to more general $SU(4)$ quantum Hall systems.", "url": "https://arxiv.org/abs/2608.00390", "type": "理论+数值", "summary": "我们研究了单层石墨烯中填充因子 $\\nu=-1$ 的 $SU(4)$ 量子霍尔铁磁基态顶部的斯格明子激发态。短程各向异性相互作用、塞曼耦合和亚晶格对称破缺势之间的竞争产生了四个不同的自旋谷有序基态相。将有效场理论与 Hartree--Fock 近似相结合，我们开发了一个变分框架，该框架在平等的基础上结合了长程库仑相互作用和对称破缺项。变分最小化确定最佳斯格明子纹理，包括其空间径向轮廓和内部 $SU(4)$ 旋量结构。我们建立了斯格明子激发的相图，识别了不同外场条件下的十三个不同的斯格明子相，并确定了它们的自旋谷纹理、能量和特征尺寸。针对不同径向 ansätze 的结果的稳健性证明了我们变分方法的可靠性。\n\n我们的工作为研究多组分量子霍尔铁磁体中的斯格明子激发提供了一个系统框架，并且可以自然地扩展到更通用的 $SU(4)$ 量子霍尔系统。", "authors": [{"name": "Jincheng An"}, {"name": "Ajit C. Balram"}, {"name": "Ganpathy Murthy"}], "featured_authors": [{"name": "Jincheng An"}, {"name": "Ajit C. Balram"}, {"name": "Ganpathy Murthy"}], "author_count": 3}, {"id": "2608.00593", "category": "cond-mat", "title": "Uncertainty-guided active learning for surrogate prediction of stream-finishing wear fields", "abstract": "In stream finishing, the wear experienced by a workpiece depends strongly on its orientation within the rotating abrasive media. Determining suitable orientations to achieve uniform wear requires evaluating the wear-rate field over all feasible orientations. Although the discrete element method (DEM) accurately resolves particle interactions, simulating hundreds of feasible orientations for a new geometry is computationally expensive. We present an uncertainty-guided surrogate framework that predicts, directly from geometry, the three fields governing erosion: per-triangle normal impact velocity, tangential impact velocity, and particle impact flux. These fields are combined through the Finnie wear model to reconstruct the wear-rate distribution. The surrogate employs a deep ensemble whose disagreement estimates epistemic uncertainty, enabling an active-learning strategy that selectively performs DEM simulations for the most uncertain orientations. Trained using only $13\\%$ of the $696$ feasible orientations, the surrogate achieves Spearman rank correlations of $0.93$, $0.89$, and $0.93$ for the normal impact velocity, tangential impact velocity, and particle impact flux, respectively. Moreover, the predicted uncertainty is well calibrated, reliably anticipating prediction error and the fidelity of the reconstructed wear field, which matches DEM with a Spearman rank correlation of up to $0.97$ for low-uncertainty orientations and degrades in a controlled manner as uncertainty increases.", "url": "https://arxiv.org/abs/2608.00593", "type": "理论+数值", "summary": "在流精加工中，工件所经历的磨损很大程度上取决于其在旋转研磨介质中的方向。确定合适的方向以实现均匀磨损需要评估所有可行方向的磨损率场。尽管离散元法 (DEM) 可以准确地解析粒子相互作用，但模拟新几何形状的数百个可行方向的计算成本很高。我们提出了一个不确定性引导的替代框架，该框架直接从几何形状预测控制侵蚀的三个场：每三角形法向冲击速度、切向冲击速度和颗粒冲击通量。这些场通过 Finnie 磨损模型组合起来，重建磨损率分布。代理采用深度集成，其分歧估计认知不确定性，从而实现主动学习策略，有选择地对最不确定的方向执行 DEM 模拟。\n\n仅使用 $696$ 可行方向中的 $13\\%$ 进行训练，代理的法向冲击速度、切向冲击速度和粒子冲击通量的 Spearman 等级相关性分别为 $0.93$、$0.89$ 和 $0.93$。此外，预测的不确定性得到了很好的校准，可靠地预测了预测误差和重建磨损场的保真度，这与 DEM 相匹配，对于低不确定性方向，斯皮尔曼等级相关性高达 0.97 美元，并且随着不确定性的增加以受控方式降低。", "authors": [{"name": "Anand Kumar"}, {"name": "Puli Saikiran"}, {"name": "Vineet Dawara"}, {"name": "Koushik Viswanathan"}], "featured_authors": [{"name": "Anand Kumar"}, {"name": "Puli Saikiran"}, {"name": "Vineet Dawara"}, {"name": "Koushik Viswanathan"}], "author_count": 4}, {"id": "2608.00597", "category": "cond-mat", "title": "Confinement-Induced Optimization of Fluctuation-Induced Forces in Active Fluids", "abstract": "Active matter generates nonequilibrium fluctuations that mediate effective interactions between immersed objects. While fluctuation-induced (FI) forces in active fluids depend on activity, density, and geometry, their dependence on confinement remains poorly understood. We study FI forces between fixed intruders in two-dimensional active fluids composed of self-propelled circular or rodlike particles using Langevin dynamics simulations. We find that the FI force exhibits a pronounced nonmonotonic dependence on intruder separation, reaching a maximum at an optimal gap size well beyond the depletion regime, in contrast to the commonly assumed monotonic decay. This optimal confinement is robust across parameters and is more pronounced for elongated particles. The effect arises from a confinement-controlled balance between particle transport and crowding: narrow gaps hinder exchange between inner and outer regions, whereas large separations effectively decouple the intruders. At intermediate distances, enhanced crowding around the intruders generates maximal collision-rate asymmetries, leading to the strongest effective interactions. These results identify confinement geometry as a key control parameter for FI forces in active matter.", "url": "https://arxiv.org/abs/2608.00597", "type": "理论+数值", "summary": "活性物质产生非平衡波动，介导浸入物体之间的有效相互作用。虽然活性流体中的波动引起的 (FI) 力取决于活动、密度和几何形状，但它们对约束的依赖性仍然知之甚少。我们使用朗之万动力学模拟研究由自驱动圆形或棒状颗粒组成的二维活动流体中固定入侵者之间的 FI 力。我们发现，FI 力对入侵者分离表现出明显的非单调依赖性，在远远超出耗尽状态的最佳间隙尺寸处达到最大值，这与通常假设的单调衰减相反。这种最佳限制在各个参数上都很稳健，并且对于细长颗粒来说更为明显。这种效应源于粒子传输和拥挤之间的限制控制平衡：狭窄的间隙阻碍内部和外部区域之间的交换，而大的间隔有效地使入侵者解耦。在中等距离处，入侵者周围的拥挤程度增加，会产生最大的碰撞率不对称性，从而导致最强的有效相互作用。\n\n这些结果将约束几何形状确定为活性物质中 FI 力的关键控制参数。", "authors": [{"name": "Reza Shaebani"}, {"name": "Hashem Fatemi"}, {"name": "Hamidreza Khalilian"}, {"name": "Jalal Sarabadani"}], "featured_authors": [{"name": "Reza Shaebani"}, {"name": "Hashem Fatemi"}, {"name": "Hamidreza Khalilian"}, {"name": "Jalal Sarabadani"}], "author_count": 4}, {"id": "2608.00707", "category": "cond-mat", "title": "Conditional grain-graph diffusion for property-guided inverse design of polycrystalline microstructures", "abstract": "Graph representations compactly encode polycrystalline microstructures while retaining grain topology and grain boundary information. We present a conditional graph diffusion framework for property-guided inverse design of dual-phase Ti-6Al-4V microstructures. An enhanced grain graph neural network (GNN) with grain boundary edge features, learnable node and edge embeddings, and multi-statistic pooling serves as a forward surrogate for stress prediction and candidate evaluation. The conditional diffusion model generates candidates through reverse diffusion under prescribed {\\alpha}-phase volume fraction, elastic modulus, and yield-stress proxy targets. Across four target regimes and independently seeded starting sets, generated candidates consistently approach the prescribed properties, including a target outside the property envelope of the existing microstructures. Local crystallographic consistency is evaluated post-generation from deviations from the Burgers orientation relationship (BOR). BOR-aware ranking increases mean BOR consistency by up to 44.9% and 56.4% for the in- and out-of-envelope targets, respectively, while maintaining property alignment. Finite element validation of the five best candidates in each primary design case yields a maximum absolute relative error of 1.0% in their mean properties. In a representative benchmark, diffusion requires 32 candidate evaluations per input graph, compared with approximately 40,000 for random search and evolutionary optimization, and reduces runtime by approximately two orders of magnitude in the tested implementations. These results establish conditional grain-graph diffusion as an efficient framework for property-guided polycrystalline microstructure design.", "url": "https://arxiv.org/abs/2608.00707", "type": "理论+数值", "summary": "图形表示紧凑地编码多晶微观结构，同时保留晶粒拓扑和晶界信息。我们提出了一个条件图扩散框架，用于双相 Ti-6Al-4V 微结构的属性引导逆向设计。具有晶界边缘特征、可学习节点和边缘嵌入以及多统计池的增强型晶粒图神经网络（GNN）可作为应力预测和候选评估的前向代理。条件扩散模型通过在规定的 {α} 相体积分数、弹性模量和屈服应力代理目标下的反向扩散生成候选对象。在四个目标体系和独立种子起始组中，生成的候选者一致地接近规定的属性，包括现有微结构的属性范围之外的目标。生成后根据伯格取向关系 (BOR) 的偏差评估局部晶体学一致性。 BOR 感知排名将包络内和包络外目标的平均 BOR 一致性分别提高了 44.9% 和 56.4%，同时保持属性一致性。\n\n对每个主要设计案例中的五个最佳候选者进行有限元验证，其平均属性的最大绝对相对误差为 1.0%。在代表性基准中，扩散需要对每个输入图进行 32 次候选评估，而随机搜索和进化优化则需要大约 40,000 次评估，并且在测试的实现中将运行时间减少了大约两个数量级。这些结果将条件晶粒图扩散确立为属性引导的多晶微观结构设计的有效框架。", "authors": [{"name": "Yuheng Zhou"}, {"name": "Xiao Shang"}, {"name": "Huicong Chen"}, {"name": "Yu Zou"}], "featured_authors": [{"name": "Yuheng Zhou"}, {"name": "Xiao Shang"}, {"name": "Huicong Chen"}, {"name": "Yu Zou"}], "author_count": 4}, {"id": "2608.00773", "category": "cond-mat", "title": "A Large-scale Parallel Implementation of Quasi-Four-Component Relativistic Density Functional Theory with Numeric Atom-centered Orbitals", "abstract": "We present a large-scale parallel implementation of fully relativistic density functional theory (DFT) for both molecules and periodic solids, using the quasi-four-component (Q4C) method and numeric atom-centered orbital basis sets. Our approach employs a domain decomposition method on nonuniform real-space integration grids, which enables order-N integration of the Q4C Hamiltonian matrix elements using efficient, distributed-memory and compute-parallel real-space operations. Next, we build the Hamiltonian and overlap matrices in a two-dimensional block-cyclic distribution layout. The resulting generalized eigenvalue problems are solved with the massively parallel ELPA eigenvalue solver library. We benchmark memory usage, parallel efficiency, and scalability across multiple MPI tasks and compute nodes. This algorithm extends the reach of fully relativistic DFT simulations for periodic solids, tested up to 3,383 atoms per unit cell (216,628 basis functions) and likely still well below the true reach of the implementation. As a demonstration, we calculate the fully relativistic band structure for a 3,383 atom-per-unit-cell doped hybrid organic-inorganic perovskite, (PEA)2(Pb1-xBix)I4 (PEA=phenethylammonium), showing nearly ideal scalability between 336 and 672 physical CPU cores.", "url": "https://arxiv.org/abs/2608.00773", "type": "理论+数值", "summary": "我们使用准四分量 (Q4C) 方法和数值原子中心轨道基组，提出了针对分子和周期固体的完全相对论密度泛函理论 (DFT) 的大规模并行实现。我们的方法在非均匀实空间积分网格上采用域分解方法，该方法能够使用高效、分布式内存和计算并行实空间操作对 Q4C 哈密顿矩阵元素进行 N 阶积分。接下来，我们在二维块循环分布布局中构建哈密顿矩阵和重叠矩阵。由此产生的广义特征值问题可通过大规模并行 ELPA 特征值求解器库进行求解。我们对多个 MPI 任务和计算节点的内存使用情况、并行效率和可扩展性进行了基准测试。该算法扩展了周期固体的完全相对论 DFT 模拟的范围，测试了每个晶胞多达 3,383 个原子（216,628 个基函数），但可能仍远低于实现的真实范围。\n\n作为演示，我们计算了每晶胞 3,383 个原子掺杂的杂化有机-无机钙钛矿 (PEA)2(Pb1-xBix)I4 (PEA=苯乙基铵) 的完全相对论能带结构，显示出 336 到 672 个物理 CPU 内核之间近乎理想的可扩展性。", "authors": [{"name": "Wentao Zhang"}, {"name": "Rundong Zhao"}, {"name": "Volker Blum"}], "featured_authors": [{"name": "Wentao Zhang"}, {"name": "Rundong Zhao"}, {"name": "Volker Blum"}], "author_count": 3}, {"id": "2608.00777", "category": "cond-mat", "title": "Magnetoelastic control of quantum correlations and field sensitivity in a spin-1/2 Heisenberg dimer", "abstract": "We investigate the thermodynamic and quantum properties of a magnetoelastic spin-1/2 Heisenberg dimer, where the exchange interaction depends on the dimer displacement. By combining an exact treatment of the spin sector with a harmonic description of the vibrational degree of freedom, we obtain an effective model in which each spin configuration is associated with a distinct vibrational mode, leading to a non-factorizable partition function. We analyze the thermal behavior and identify regimes corresponding to entangled and fully polarized states. Quantum correlations are analyzed through concurrence and local quantum uncertainty, showing that while entanglement is rapidly suppressed by temperature, nonclassical correlations persist over a broader range due to the competition between spin sectors. We further examine the magnetic Fisher information, which provides a measure of the sensitivity of the system to the external magnetic field. Its behavior reveals enhanced response in crossover regions where magnetoelastic effects induce strong redistribution of the level populations. Our results demonstrate that magnetoelastic coupling plays a central role in controlling both quantum correlations and magnetic response, establishing a direct link between entanglement, nonclassical correlations, and thermodynamic sensitivity in coupled spin-dimer systems.", "url": "https://arxiv.org/abs/2608.00777", "type": "理论", "summary": "我们研究了磁弹性自旋 1/2 海森堡二聚体的热力学和量子特性，其中交换相互作用取决于二聚体位移。通过将自旋扇区的精确处理与振动自由度的谐波描述相结合，我们获得了一个有效的模型，其中每个自旋构型都与不同的振动模式相关联，从而产生了不可因式分解的配分函数。我们分析热行为并识别与纠缠态和完全极化态相对应的状态。通过并发和局域量子不确定性对量子相关性进行了分析，结果表明，虽然纠缠被温度迅速抑制，但由于自旋扇区之间的竞争，非经典相关性在更广泛的范围内持续存在。我们进一步检查磁费希尔信息，它提供了系统对外部磁场敏感性的测量。其行为揭示了交叉区域的响应增强，其中磁弹性效应引起水平群体的强烈重新分布。\n\n我们的结果表明，磁弹性耦合在控制量子相关性和磁响应方面发挥着核心作用，在耦合自旋二聚体系统中的纠缠、非经典相关性和热力学敏感性之间建立了直接联系。", "authors": [{"name": "E. W. B. de Souza"}, {"name": "Moises Rojas"}, {"name": "Onofre Rojas"}], "featured_authors": [{"name": "E. W. B. de Souza"}, {"name": "Moises Rojas"}, {"name": "Onofre Rojas"}], "author_count": 3}, {"id": "2608.00849", "category": "cond-mat", "title": "Spin Quantum Hall Effect: the Critical Exponents", "abstract": "The spin quantum Hall effect (SQHE) provides one of the few examples of an Anderson localization transition for which exact critical exponents are known, making it an important testing ground for theories of disordered topological systems and conformal field theory. The corresponding network model, obtained by replacing the random $U(1)$ phases of the Chalker--Coddington model with random $SU(2)$ matrices, belongs to symmetry class C of the Altland--Zirnbauer classification and is believed to describe quasiparticle transport in two-dimensional disordered superconductors with broken time-reversal symmetry. In this work, we perform high-precision numerical calculations of the localization-length exponent ($\\nu$) and the boundary critical exponent ($\\mu$) for the SQHE network model using the recently developed $S$-matrix approach to random networks.", "url": "https://arxiv.org/abs/2608.00849", "type": "理论+数值", "summary": "自旋量子霍尔效应（SQHE）提供了已知精确临界指数的少数几个安德森局域化转变的例子之一，使其成为无序拓扑系统和共形场论理论的重要试验场。相应的网络模型是通过用随机 $SU(2)$ 矩阵替换 Chalker--Coddington 模型的随机 $U(1)$ 相而获得的，属于 Altland--Zirnbauer 分类的 C 类对称性，被认为描述了时间反转对称性破缺的二维无序超导体中的准粒子输运。在这项工作中，我们使用最近开发的随机网络 $S$ 矩阵方法对 SQHE 网络模型的定位长度指数 ($\\nu$) 和边界临界指数 ($\\mu$) 进行高精度数值计算。", "authors": [{"name": "Hrant Topchyan"}, {"name": "Win Nuding"}, {"name": "Andreas Klümper"}, {"name": "Ara Sedrakyan"}], "featured_authors": [{"name": "Hrant Topchyan"}, {"name": "Win Nuding"}, {"name": "Andreas Klümper"}, {"name": "Ara Sedrakyan"}], "author_count": 4}, {"id": "2608.00942", "category": "cond-mat", "title": "Evidence for superconductivity at 190 K in a pressure-overdoped cuprate", "abstract": "It is well established that the critical temperature ($T_c$) of cuprate superconductors can be tuned by pressure. For example, compression decouples the hole doping from chemical doping allowing for overdoped samples far beyond what is possible at ambient pressure. In this work, multiple techniques are used to probe the onset of the Meissner effect at $T_c$ as a function of pressure in $\\mathrm{Pb_{0.4}Bi_{1.6}Sr_2Ca_2Cu_3O_{10+\\delta}}$ (Bi-2223) to 60 GPa in different compression environments. Samples compressed under quasihydrostatic conditions exhibit a distinctive non-monotonic pressure dependence of $T_c$ below 25 GPa, in agreement with previous reports. With further increase in pressure $T_c$ climbs continuously to 190 K at 60 GPa. Evidence for critical temperatures exceeding those reported to date for cuprates at ambient and high pressures, the results may be understood in terms of the proposed second superconducting regime at high hole doping.", "url": "https://arxiv.org/abs/2608.00942", "type": "理论", "summary": "众所周知，铜酸盐超导体的临界温度（$T_c$）可以通过压力调节。例如，压缩将空穴掺杂与化学掺杂解耦，从而允许过度掺杂的样品远远超出环境压力下可能的范围。在这项工作中，使用多种技术来探测迈斯纳效应在 $T_c$ 的开始，作为不同压缩环境中 $\\mathrm{Pb_{0.4}Bi_{1.6}Sr_2Ca_2Cu_3O_{10+\\delta}}$ (Bi-2223) 至 60 GPa 压力的函数。在准静水压条件下压缩的样品表现出独特的非单调压力依赖性，$T_c$ 低于 25 GPa，与之前的报告一致。随着压力进一步增加，$T_c$ 在 60 GPa 下持续攀升至 190 K。有证据表明铜酸盐在环境压力和高压下的临界温度超过了迄今为止报道的临界温度，结果可以根据所提出的高空穴掺杂的第二超导状态来理解。", "authors": [{"name": "Alexander C. Mark"}, {"name": "Huu T. Do"}, {"name": "David Rodriguez"}, {"name": "D. Gonzalez Arevalo"}, {"name": "Adam Denchfield"}, {"name": "Eduardo H.T. Poldi"}, {"name": "Daniel P. Phelan"}, {"name": "N. K. Man"}, {"name": "Rssell J. Hemley"}], "featured_authors": [{"name": "Alexander C. Mark"}, {"name": "Huu T. Do"}, {"name": "David Rodriguez"}, {"name": "Daniel P. Phelan"}, {"name": "N. K. Man"}, {"name": "Rssell J. Hemley"}], "author_count": 9}, {"id": "2608.00948", "category": "cond-mat", "title": "Spin-chirality-driven nonrelativistic Edelstein effects in two-dimensional antiferromagnets", "abstract": "Charge current-induced magnetic moment accumulation-Edelstein effect has been extensively attracting attention for its promising applications in spintronics. While most prior works focus on the spin-orbit coupling (SOC) induced Edelstein responses that rely on the presence of heavy elements, the nonrelativistic Edelstein effect (in the absence of SOC) that could be applied in a broader material family has been largely unexplored. Here, we perform a combined group-theoretical and ab initio numerical simulation study to show that vector spin chirality could serve as an effective control parameter of nonrelativistic Edelstein responses in antiferromagnetic system. In addition to spin degree of freedom, we also explore the orbital angular momentum contributions to current-induced magnetic moments (dubbed orbital Edelstein effect), which obey distinct symmetry constraints from the spin counterpart. Microscopically, vector spin chirality k gives rise to electronic and Zeeman-like band-geometric quantities, such as the anomalous spin/orbital polarizability and the Berry connection polarizability, which govern the nonrelativistic Edelstein responses. Our work identifies vector spin chirality as a key magnetic order parameter to enable and tune nonrelativistic Edelstein effects, and uncovers a new route toward electrically controlling magnetization without relying on SOC effect.", "url": "https://arxiv.org/abs/2608.00948", "type": "理论+数值", "summary": "充电电流引起的磁矩积累-埃德尔斯坦效应因其在自旋电子学中的广阔应用而受到广泛关注。虽然大多数先前的工作都集中在依赖于重元素存在的自旋轨道耦合 (SOC) 引起的埃德尔斯坦响应，但可应用于更广泛材料系列的非相对论性埃德尔斯坦效应（在没有 SOC 的情况下）在很大程度上尚未得到探索。在这里，我们进行了群论和从头算数值模拟相结合的研究，以表明矢量自旋手性可以作为反铁磁系统中非相对论埃德尔斯坦响应的有效控制参数。除了自旋自由度之外，我们还探索了轨道角动量对电流感应磁矩的贡献（称为轨道埃德尔斯坦效应），它遵循与自旋对应物不同的对称约束。微观上，矢量自旋手性 k 产生电子和类塞曼能带几何量，例如反常自旋/轨道极化率和贝里连接极化率，它们控制着非相对论性埃德尔斯坦响应。\n\n我们的工作将矢量自旋手性确定为启用和调整非相对论埃德尔斯坦效应的关键磁序参数，并揭示了一种不依赖 SOC 效应的电控制磁化的新途径。", "authors": [{"name": "Hao Zuo"}, {"name": "Xiaoyin Li"}, {"name": "Jian Zhou"}], "featured_authors": [{"name": "Hao Zuo"}, {"name": "Xiaoyin Li"}, {"name": "Jian Zhou"}], "author_count": 3}, {"id": "2608.01016", "category": "cond-mat", "title": "Predictive Formulas for Scattering Mean Free Path for General Disordered Dielectric Media Beyond the Long-Wavelength Regime", "abstract": "We derive predictive formulas for the scattering mean free path $\\ell_s$ of statistically homogeneous two-phase dielectric media in dimensions $d=1,2,3$. Unlike Mie-based estimates limited to identical circular or spherical scatterers, the formulas apply to arbitrarily shaped and polydisperse particulate media as well as nonparticulate media, with microstructure entering through the spectral density. The formulas are based on the exact strong-contrast expansion for the effective dynamic dielectric constant. We apply them to five nonhyperuniform and hyperuniform models and validate selected cases using finite-difference time-domain simulations. For $k_1/s \\lesssim 1$, where $k_1$ is the incident wavenumber and $s$ is the specific surface, the predictions agree well with simulations and are consistent with Mie theory where applicable, while improving accuracy for two-dimensional transverse-magnetic polarization. Mie estimates become more accurate for $k_1/s \\gtrsim 1$. For hyperuniform media with $\\widetilde{\\chi}_V(k)\\sim k^\\alpha$ at small $k$, the theory predicts $\\ell_s\\sim k_1^{-(d+1+\\alpha)}$; stealthy hyperuniform media are transparent over a finite wavenumber interval. These results provide a microstructure-based route to predict and design wave transport in general disordered dielectric materials.", "url": "https://arxiv.org/abs/2608.01016", "type": "理论+数值", "summary": "我们推导出维度为 $d=1,2,3$ 的统计均匀两相介电介质的散射平均自由程 $\\ell_s$ 的预测公式。与仅限于相同圆形或球形散射体的基于 Mie 的估计不同，该公式适用于任意形状和多分散颗粒介质以及非颗粒介质，其微观结构通过光谱密度进入。这些公式基于有效动态介电常数的精确强对比度展开。我们将它们应用于五个非超均匀和超均匀模型，并使用有限差分时域模拟验证选定的情况。对于 $k_1/s \\lesssim 1$，其中 $k_1$ 是入射波数，$s$ 是比表面，预测与模拟非常吻合，并且在适用的情况下与米氏理论一致，同时提高了二维横向磁极化的精度。 Mie 估计对于 $k_1/s \\gtrsim 1$ 变得更加准确。对于 $\\widetilde{\\chi}_V(k)\\sim k^\\alpha$ 且 $k$ 较小的超均匀介质，理论预测 $\\ell_s\\sim k_1^{-(d+1+\\alpha)}$；隐形超均匀介质在有限波数间隔内是透明的。\n\n这些结果提供了一种基于微观结构的途径来预测和设计一般无序介电材料中的波传输。", "authors": [{"name": "Jaeuk Kim"}, {"name": "Salvatore Torquato"}], "featured_authors": [{"name": "Jaeuk Kim"}, {"name": "Salvatore Torquato"}], "author_count": 2}, {"id": "2608.01162", "category": "cond-mat", "title": "From oligomers to entangled polymers: How to train a transferable machine learning interatomic potential", "abstract": "Over the past decade, Machine Learning Interatomic Potentials (MLIPs) have emerged as a powerful technique for performing molecular dynamics (MD) simulations with nearly ab initio accuracy. Alongside the development of new descriptors and advanced machine learning architectures, sophisticated procedures for the generation of diverse and accurate reference datasets have been established. To date, research has focused primarily on MLIPs for crystalline or amorphous inorganic and small molecular systems; however, large macromolecules such as polymers remain underrepresented in the literature, despite beeing an important class of materials. In this work, we investigate several aspects of developing MLIPs for polymers, utilizing polyethylene as a representative, yet simple model system. First, we compare various local atomic descriptors, identifying the Atomic Cluster Expansion (ACE) as the most effective for this application. Second, we implement and automatized active learning scheme to efficiently generate diverse training data and demonstrate that ACE potentials fitted on small oligomers are transferable to larger polymers. Given that the accurate reproduction of the density depends critically on a correct description of intermolecular interactions, which are far more complex to learn than intramolecular interactions, we carefully evaluate the performance of the ACE potentials with respect to non-bonded interactions. By utilizing the computationally efficient OPLS-AA force field as a ground truth reference, we are able to perform a direct comparison of nanosecond-scale MD trajectories resulting from the ACE and reference potential. We find that the ACE potential accurately reproduces key thermodynamic, structural and dynamical properties.", "url": "https://arxiv.org/abs/2608.01162", "type": "理论+数值", "summary": "在过去的十年中，机器学习原子间势 (MLIP) 已成为一种强大的技术，可以以近乎从头算的精度执行分子动力学 (MD) 模拟。除了新描述符和先进机器学习架构的开发之外，还建立了用于生成多样化且准确的参考数据集的复杂程序。 To date, research has focused primarily on MLIPs for crystalline or amorphous inorganic and small molecular systems; however, large macromolecules such as polymers remain underrepresented in the literature, despite beeing an important class of materials.在这项工作中，我们利用聚乙烯作为代表性但简单的模型系统，研究了开发聚合物 MLIP 的几个方面。 First, we compare various local atomic descriptors, identifying the Atomic Cluster Expansion (ACE) as the most effective for this application.其次，我们实施并自动化主动学习方案，以有效生成不同的训练数据，并证明安装在小型低聚物上的 ACE 电位可以转移到较大的聚合物上。\n\n鉴于密度的准确再现关键取决于对分子间相互作用的正确描述，而分子间相互作用比分子内相互作用更复杂，因此我们仔细评估了 ACE 势在非键相互作用方面的性能。通过利用计算效率高的 OPLS-AA 力场作为地面实况参考，我们能够对 ACE 和参考电位产生的纳秒级 MD 轨迹进行直接比较。 We find that the ACE potential accurately reproduces key thermodynamic, structural and dynamical properties.", "authors": [{"name": "Mirko Fischer"}, {"name": "Andreas Heuer"}], "featured_authors": [{"name": "Mirko Fischer"}, {"name": "Andreas Heuer"}], "author_count": 2}, {"id": "2608.01235", "category": "cond-mat", "title": "Twist-induced magnetic topological phase transition in stacked altermagnetic CrO", "abstract": "Interlayer twisting offers a geometric route to controlling electronic states, but whether it can simultaneously reconstruct magnetic symmetry and band topology remains unclear. Here, based on symmetry analysis and first-principles calculations, we show that commensurate twisting drives magnetic topological phase transitions in stacked bilayer CrO. In particular, it transforms an antiferromagnetic Dirac semimetal into either a $d$-wave altermagnetic bipolarized Weyl semimetal or an unconventional compensated magnetic Weyl semimetal. A key result is that the Weyl points in the $d$-wave altermagnetic phase lie at generic $k$ points in the Brillouin zone and are protected by the spin symmetry $\\left\\{ C_2 T||C_{2z} T\\right\\}$. This sharply contrasts with conventional two-dimensional Weyl semimetals, where Weyl points are typically protected by mirror or rotational symmetries and thus pinned to high-symmetry lines. We further show that commensurate twisting preserves the spin symmetry $\\left\\{ C_2 T||C_{2z} T\\right\\}$, making the Weyl phase a robust consequence of twisting rather than a fine-tuned feature of a specific angle. Our work establishes a symmetry-based route to engineering magnetic topological phases in twisted two-dimensional materials.", "url": "https://arxiv.org/abs/2608.01235", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zi-Hao Ding"}, {"name": "Ze-Feng Gao"}, {"name": "Xiang-Hua Kong"}, {"name": "Peng-Jie Guo"}, {"name": "Zhong-Yi Lu"}], "featured_authors": [{"name": "Zi-Hao Ding"}, {"name": "Ze-Feng Gao"}, {"name": "Xiang-Hua Kong"}, {"name": "Peng-Jie Guo"}, {"name": "Zhong-Yi Lu"}], "author_count": 5}, {"id": "2608.01280", "category": "cond-mat", "title": "Algorithmic overlaps in the Baxter-Wu model: cluster dynamics under Novotny-Evertz updates", "abstract": "We study the spatial overlap of successive spin configurations generated by Markov chain Monte Carlo simulations of the Baxter-Wu model. Using the Novotny-Evertz sublattice-freezing single-cluster update, we track the mean and variance of the algorithmic overlap across the critical region. We show that, even in this three-spin model, the overlap acts as an algorithmic observable that follows the thermodynamics of the transition: the single-cluster overlap mean behaves like an order parameter, dropping from a finite ordered-phase plateau toward zero across $T_c$. The overlap does not diverge at criticality, instead it remains finite and its finite-size value decays as a clean power law, $U_2(T_c)\\sim L^{-\\psi}$, over eleven sizes with an exponent $\\psi{=}0.378(4)$ smaller than the value $\\approx0.42$ found for the Ising and Potts models under standard Fortuin-Kasteleyn cluster dynamics, indicating that it reflects the Novotny-Evertz sublattice-freezing dynamics rather than any static property of the model.", "url": "https://arxiv.org/abs/2608.01280", "type": "理论+数值", "summary": "我们研究了 Baxter-Wu 模型的马尔可夫链蒙特卡罗模拟生成的连续自旋构型的空间重叠。使用 Novotny-Evertz 亚晶格冻结单簇更新，我们跟踪关键区域内算法重叠的均值和方差。我们表明，即使在这个三自旋模型中，重叠也充当了遵循转变热力学的算法可观测值：单簇重叠平均值的行为就像一个有序参数，从有限的有序相平台下降到 $T_c$ 上的零。重叠在临界点不会发散，相反，它仍然是有限的，并且其有限大小值按照干净的幂律 $U_2(T_c)\\sim L^{-\\psi}$ 衰减，超过 11 个大小，指数 $\\psi{=}0.378(4)$ 小于标准 Fortuin-Kasteleyn 簇动力学下为 Ising 和 Potts 模型找到的值 $\\approx0.42$，表明它反映了Novotny-Evertz 亚晶格冻结动力学而不是模型的任何静态属性。", "authors": [{"name": "Ian Pilé"}, {"name": "Lev Shchur"}], "featured_authors": [{"name": "Ian Pilé"}, {"name": "Lev Shchur"}], "author_count": 2}, {"id": "2608.01363", "category": "cond-mat", "title": "Quantum geometry and RKKY in flat bands", "abstract": "Flat conduction bands quench the group velocity and thus challenge conventional, dispersion-driven pictures of the Ruderman-Kittel-Kasuya-Yosida (RKKY) interaction, where localized moments are coupled via an effective exchange mediated by conduction electrons. Here we show that RKKY interactions in the flat-band limit are not extinguished by the vanishing group velocity but are instead mediated by the quantum geometry of Bloch states. Starting from a microscopic RKKY derivation, we demonstrate that the Brillouin-zone-averaged quantum metric controls the long-wavelength structure of the static susceptibility, thereby determining the magnetic correlation length and the spin stiffness. As a result, the finite spatial spread of Wannier functions provides an effective long-range coupling channel even when single-particle dispersion is absent. Furthermore, we establish the general principle that the ordering temperature is governed by the quantum metric in finite and low-dimensional samples, effectively circumventing the thermodynamic-limit constraint of the Mermin-Wagner theorem. Specifically, our theoretical investigation reveals that increasing the quantum metric enhances magnetic rigidity and leads to a corresponding rise in the critical temperature within finite-sized systems.", "url": "https://arxiv.org/abs/2608.01363", "type": "理论", "summary": "平坦导带淬灭了群速度，从而挑战了传统的、色散驱动的鲁德曼-基特尔-Kasuya-Yosida（RKKY）相互作用的图像，其中局域矩通过传导电子介导的有效交换进行耦合。在这里，我们证明平带极限中的 RKKY 相互作用不会被消失的群速度所消除，而是由布洛赫态的量子几何介导。从微观 RKKY 推导开始，我们证明了布里渊区平均量子度量控制静态磁化率的长波长结构，从而确定磁相关长度和自旋刚度。因此，即使不存在单粒子色散，Wannier 函数的有限空间扩展也提供了有效的长程耦合通道。此外，我们建立了一般原理，即有序温度由有限和低维样本中的量子度量控制，有效地规避了 Mermin-Wagner 定理的热力学极限约束。\n\n具体来说，我们的理论研究表明，增加量子度量可以增强磁刚度，并导致有限尺寸系统内的临界温度相应上升。", "authors": [{"name": "Chang-geun Oh"}, {"name": "Makoto Shimizu"}, {"name": "Youichi Yanase"}, {"name": "Shuichi Murakami"}], "featured_authors": [{"name": "Chang-geun Oh"}, {"name": "Makoto Shimizu"}, {"name": "Youichi Yanase"}, {"name": "Shuichi Murakami"}], "author_count": 4}, {"id": "2608.01368", "category": "cond-mat", "title": "Bulk-Boundary Correspondence in Semi-Infinite Chains from Sublattice Zeros", "abstract": "We provide an alternative derivation of the bulk-boundary correspondence for semi-infinite chains. To describe edge states, we analytically continue the usual Bloch Hamiltonian to complex wave vectors $k$. To start, we note that the zeros of a Bloch wavefunction are related to edge states, at least in systems with nearest-neighbour hoppings. We show that an analytically continued Bloch Hamiltonian with chiral symmetry has exceptional points, where two different states coalesce. These special points are related to the adiabatic protection of edge states. We derive a winding number that counts the number of topological edge states protected by chiral symmetry.", "url": "https://arxiv.org/abs/2608.01368", "type": "理论", "summary": "我们提供了半无限链体边界对应的另一种推导。为了描述边缘状态，我们分析地将通常的布洛赫哈密顿量延续到复数波向量$k$。首先，我们注意到布洛赫波函数的零点与边缘态相关，至少在具有最近邻跳跃的系统中是这样。我们证明，具有手性对称性的分析连续布洛赫哈密顿量具有两个不同状态合并的例外点。这些特殊点与边缘态的绝热保护有关。我们推导出一个绕数，该数计算受手性对称性保护的拓扑边缘态的数量。", "authors": [{"name": "Ilya Iakoub"}, {"name": "Nicolas Levasseur"}, {"name": "Kylian Lionnet"}, {"name": "Richard MacKenzie"}], "featured_authors": [{"name": "Ilya Iakoub"}, {"name": "Nicolas Levasseur"}, {"name": "Kylian Lionnet"}, {"name": "Richard MacKenzie"}], "author_count": 4}, {"id": "2608.01487", "category": "cond-mat", "title": "Griffiths phase in clique percolation in random geometric graphs", "abstract": "In this study, we discuss the clique percolation in the ensembles of random geometric graphs with different kernels that quantify the geometrical constraints. For the sharp cut-off we find the wide Griffiths phase of extended criticality with the power-law behavior. One boundary of the Griffiths phase is the generalization of a percolation critical point for the ER ensemble when the percolation within the large but finite cluster emerges. The second boundary corresponds to the point in the parameter space when the percolation in the entire clustered system becomes available. For the power-law kernel, richer behavior with a clique-size-dependent boundary between the effective ER and geometric regimes has been identified. The Griffiths phase in this case exists as well. Finally, the pattern with the exponential kernel has been analyzed. We briefly discuss the possible applications of our findings.", "url": "https://arxiv.org/abs/2608.01487", "type": "理论", "summary": "在本研究中，我们讨论了具有不同内核的随机几何图集合中的派渗透，这些内核量化了几何约束。对于急剧截止，我们发现具有幂律行为的扩展临界性的宽格里菲斯阶段。格里菲斯阶段的一个边界是当大但有限的簇内出现渗流时 ER 系综的渗流临界点的概括。第二个边界对应于整个集群系统中的渗透变得可用时参数空间中的点。对于幂律核，已经确定了更丰富的行为，以及有效 ER 和几何状态之间依赖于派系大小的边界。这种情况下的格里菲斯阶段也存在。最后，分析了具有指数核的模式。我们简要讨论我们的研究结果的可能应用。", "authors": [{"name": "Vasilii Tiselko"}, {"name": "Olga Valba"}, {"name": "Alexander Gorsky"}], "featured_authors": [{"name": "Vasilii Tiselko"}, {"name": "Olga Valba"}, {"name": "Alexander Gorsky"}], "author_count": 3}, {"id": "2608.01520", "category": "cond-mat", "title": "Reciprocal Skin Effect from Internal Rotation", "abstract": "We present a class of lattices in which an internal rotation---a conserved compact angular momentum in each unit cell---turns reciprocal couplings into a non-Hermitian skin effect. In each conserved channel, the rotation character makes the left- and right-going amplitudes unequal, so the channel localizes directionally while the full Hamiltonian remains reciprocal, with conjugate channels pinned to opposite boundaries. Every channel is exactly solvable and carries an integer point-gap winding: under exact channel conservation, the phases form $\\Z^{q}$, with one integer per conjugate channel pair, $q$ unbounded across multiplets, and $q=j+\\tfrac{1}{2}$ for half-integer spin $j$ in the symplectic class AII$^{\\dagger}$. Mixing conjugate channels collapses the grading to a critical, scale-free skin effect, with only the odd AII$^{\\dagger}$ $\\Z_{2}$ parity surviving. A cyclic three-site lattice and a passive lossy resonator array realize the effect.", "url": "https://arxiv.org/abs/2608.01520", "type": "理论", "summary": "我们提出了一类晶格，其中内旋转（每个晶胞中守恒的紧致角动量）将相互耦合转变为非厄米集肤效应。在每个守恒通道中，旋转特性使得向左和向右的幅度不相等，因此通道定向定位，而完整的哈密顿量保持倒数，共轭通道固定到相对的边界。每个通道都是精确可解的，并且带有整数点间隙缠绕：在精确通道守恒下，相位形成 $\\Z^{q}$，每个共轭通道对有一个整数，$q$ 在多重态上无界，$q=j+\\tfrac{1}{2}$ 表示辛类 AII$^{\\dagger}$ 中的半整数自旋 $j$。混合共轭通道将分级压缩为临界的、无标度趋肤效应，仅奇数 AII$^{\\dagger}$ $\\Z_{2}$ 奇偶校验幸存。循环三点晶格和无源有损谐振器阵列实现了这种效果。", "authors": [{"name": "Kin Hung Fung"}, {"name": "C. T. Chan"}], "featured_authors": [{"name": "Kin Hung Fung"}, {"name": "C. T. Chan"}], "author_count": 2}, {"id": "2608.01582", "category": "cond-mat", "title": "LieStoNet: Learning Lie Symmetries from Spatiotemporal Data for Stochastic Dynamical Systems", "abstract": "Symmetry is central to modern machine learning and physics: invariances and equivariances improve sample efficiency, robustness, and out-of-distribution generalization, while symmetry principles guide scientific modeling. Yet for stochastic dynamical systems the relevant continuous symmetries are rarely known, and symmetry discovery for SDEs has remained essentially unexplored. We introduce \\textit{LieStoNet}, an end-to-end, \\emph{template-free} framework for discovering Lie-point symmetries of SDEs directly from spatiotemporal trajectories, without prespecifying symmetry groups, templates, or canonical coordinates. Building on the seminal SDE Lie-symmetry theory of Gaeta and Quintero (1999), which formalizes Lie-point SDE symmetries and their relation to Fokker-Planck symmetries, LieStoNet learns neural surrogates for drift and diffusion from increments, then learns projectable generators by enforcing the SDE determining equations, separately regularizing for closure under Lie brackets, adherence to the Lie algebra axioms (bilinearity, antisymmetry, Jacobi), and a non-redundant independent basis. The surrogate also defines an associated Fokker-Planck equation, enabling optional discovery of its Lie-point symmetries in parallel. Across multiple canonical SDEs with known analytic symmetries, LieStoNet recovers generators consistent with the ground-truth symmetry algebra, providing interpretable symmetry discovery for noisy dynamics. Code is available at \\href{ this https URL }{this link}.", "url": "https://arxiv.org/abs/2608.01582", "type": "理论+数值", "summary": "对称性是现代机器学习和物理学的核心：不变性和等变性提高了样本效率、鲁棒性和分布外泛化能力，而对称性原则则指导科学建模。然而，对于随机动力系统，相关的连续对称性很少为人所知，并且 SDE 的对称性发现基本上仍未被探索。我们引入了 \\textit{LieStoNet}，一个端到端的 \\emph{template-free} 框架，用于直接从时空轨迹发现 SDE 的谎言点对称性，无需预先指定对称群、模板或规范坐标。基于 Gaeta 和 Quintero (1999) 的开创性 SDE 李对称理论，该理论形式化了 Lie 点 SDE 对称性及其与 Fokker-Planck 对称性的关系，LieStoNet 从增量中学习漂移和扩散的神经代理，然后通过执行 SDE 确定方程、单独正则化李括号下的闭包、遵守李代数来学习可投影生成器公理（双线性、反对称、雅可比）和非冗余独立基础。\n\n代理还定义了一个相关的福克-普朗克方程，可以选择性地并行发现其谎言点对称性。在具有已知解析对称性的多个规范 SDE 中，LieStoNet 恢复了与真实对称代数一致的生成器，为噪声动力学提供了可解释的对称性发现。代码可在 \\href{ 此 https URL }{此链接} 中找到。", "authors": [{"name": "Shida Liu"}, {"name": "Abhishek Gupta"}, {"name": "Sumit Sinha"}, {"name": "L. Mahadevan"}], "featured_authors": [{"name": "Shida Liu"}, {"name": "Abhishek Gupta"}, {"name": "Sumit Sinha"}, {"name": "L. Mahadevan"}], "author_count": 4}, {"id": "2608.01799", "category": "cond-mat", "title": "Impedance of an electric double layer capacitor with a multi-component electrolyte", "abstract": "I derive the impedance response of an ideal electrolyte containing an arbitrary number of mobile ionic species between blocking planar electrodes, described by the Poisson--Nernst--Planck equations. By transforming the linearized equations to a charge--salt basis, the response is written in terms of a multi-component diffusion--migration matrix and its eigenvalues/eigenvectors. When all diffusivities are equal, the charge mode decouples from the neutral concentration subspace and the classical binary-electrolyte result is recovered. In contrast, unequal diffusivities couple charge relaxation to one or more neutral composition modes. For a ternary electrolyte with two cations and one anion, this coupling produces additional diffusive features and broadens the crossover between resistive and capacitive regimes. The results found in this paper provide a minimal continuum explanation for why mixed electrolytes can display impedance spectra that cannot be interpreted as a simple binary electrolyte with an averaged diffusion coefficient.", "url": "https://arxiv.org/abs/2608.01799", "type": "理论", "summary": "我导出了在阻挡平面电极之间包含任意数量的移动离子物质的理想电解质的阻抗响应，由泊松-能斯特-普朗克方程描述。通过将线性化方程转换为电荷-盐基础，响应被写成多分量扩散-迁移矩阵及其特征值/特征向量。当所有扩散率相等时，电荷模式与中性浓度子空间解耦，并恢复经典的二元电解质结果。相反，不相等的扩散率将电荷弛豫耦合到一种或多种中性组成模式。对于具有两种阳离子和一种阴离子的三元电解质，这种耦合产生额外的扩散特征并扩大电阻和电容状态之间的交叉。本文发现的结果为为什么混合电解质可以显示阻抗谱而不能解释为具有平均扩散系数的简单二元电解质提供了最小连续统解释。", "authors": [{"name": "David Fertig"}], "featured_authors": [{"name": "David Fertig"}], "author_count": 1}, {"id": "2608.01803", "category": "cond-mat", "title": "Fluid-structure coupling governs a dynamic transition in foam scraping", "abstract": "Foam scraping exhibits a dynamic transition between a slip state, in which the foam moves beneath a plate, and a scraping state, in which the foam is expelled from the confined region. Although this transition has been associated with the propagation of local T1 rearrangements, the physical parameter controlling their propagation remains unclear. Here, we investigate the dependence of the critical scraping velocity on the liquid fraction, bulk viscosity, and surfactant system. For all examined conditions, the critical capillary number follows $\\mathrm{Ca}_c\\propto\\phi^{-1}$, apart from a solution-dependent prefactor. We propose a local fluid--structure-coupling model in which viscous work transmitted through the Plateau-border network competes with the effective energetic cost required for one T1 event to trigger the next. The observed scaling implies an effective energetic cost governed by the Laplace pressure and is consistent with a small local compressive component of the bubble deformation. These results identify local coupling between interstitial flow and bubble deformation as a mechanism controlling the macroscopic slip--scraping transition.", "url": "https://arxiv.org/abs/2608.01803", "type": "理论", "summary": "泡沫刮擦表现出滑移状态（泡沫在板下方移动）和刮擦状态（泡沫从受限区域排出）之间的动态转变。尽管这种转变与局部 T1 重排的传播有关，但控制其传播的物理参数仍不清楚。在这里，我们研究了临界刮擦速度对液体分数、体积粘度和表面活性剂体系的依赖性。对于所有检查的条件，除了依赖于解决方案的预因子之外，临界毛细管数遵循 $\\mathrm{Ca}_c\\propto\\phi^{-1}$。我们提出了一种局部流体-结构耦合模型，其中通过高原边界网络传输的粘性功与一个 T1 事件触发下一个 T1 事件所需的有效能量成本相竞争。观察到的缩放意味着由拉普拉斯压力控制的有效能量成本，并且与气泡变形的小局部压缩分量一致。这些结果将间隙流和气泡变形之间的局部耦合确定为控制宏观滑移-刮削转变的机制。", "authors": [{"name": "Rei Kurita"}, {"name": "Masaya Endo"}], "featured_authors": [{"name": "Rei Kurita"}, {"name": "Masaya Endo"}], "author_count": 2}, {"id": "2608.01811", "category": "cond-mat", "title": "Universal Scaling of the Magnetocaloric Effect in 2D Ising Monolayers and Bilayer", "abstract": "We report a Monte Carlo study of the magnetocaloric effect (MCE) in two-dimensional ferromagnetic Ising models on square, honeycomb, and triangular lattices with monolayer and bilayer configurations. Using Binder cumulant analysis, we determine the critical temperature ($T_c$) of each structure and find that $T_c$ increases with coordination number, from the honeycomb ($r=3$) to the triangular ($r=6$) lattice. In contrast, the magnetic entropy change ($-\\Delta S_M$) decreases with coordination number, reaching its maximum for the honeycomb lattice. After normalization by their peak values and appropriate temperature scaling, both $-\\Delta S_M$ and the field exponent $n$ collapse onto universal master curves for different magnetic fields and across all six lattice structures at a fixed low field. This demonstrates universal MCE scaling independent of coordination number and layer count. Critical scaling analysis further supports the observed universality and power-law behavior. Unlike $-\\Delta S_M$, the adiabatic temperature change ($\\Delta T_{ad}$) increases with coordination number, whereas the magnetic Grüneisen parameter ($\\Gamma_M$) follows the same trend as $-\\Delta S_M$. Although the peak value of $-\\Delta S_M$ decreases with coordination number, the relative cooling power and cooling capacity remain nearly unchanged due to compensating broadening of the $-\\Delta S_M$ curves. The field dependence of $-\\Delta S_M$, relative cooling power, and cooling capacity follows power laws up to $\\sim2.6$ T (assuming $J\\approx1$ meV). Hysteresis analysis shows that lattices with lower coordination numbers exhibit a faster reduction in loop width with increasing temperature. These results establish the universal scaling behavior of the magnetocaloric effect in two-dimensional monolayer and bilayer magnetic lattices and provide guidelines for designing magnetic refrigerants.", "url": "https://arxiv.org/abs/2608.01811", "type": "理论+数值", "summary": "我们报告了对具有单层和双层结构的方形、蜂窝和三角形晶格的二维铁磁 Ising 模型中的磁热效应 (MCE) 的蒙特卡罗研究。使用Binder累积量分析，我们确定了每个结构的临界温度（$T_c$），并发现$T_c$随着配位数的增加而增加，从蜂窝状（$r=3$）到三角形（$r=6$）晶格。相反，磁熵变（$-\\Delta S_M$）随着配位数的增加而减小，在蜂窝晶格中达到最大值。通过峰值和适当的温度缩放进行归一化后，$-\\Delta S_M$ 和场指数 $n$ 都崩溃到不同磁场的通用主曲线上，并且在固定的低场下跨越所有六种晶格结构。这证明了通用 MCE 扩展与协调数和层数无关。临界尺度分析进一步支持了观察到的普遍性和幂律行为。与$-\\Delta S_M$不同，绝热温度变化($\\Delta T_{ad}$)随着配位数的增加而增加，而磁Grüneisen参数($\\Gamma_M$)遵循与$-\\Delta S_M$相同的趋势。\n\n虽然$-\\Delta S_M$的峰值随着配位数的增加而减小，但由于$-\\Delta S_M$曲线的补偿加宽，相对冷却功率和冷却​​能力几乎保持不变。 $-\\Delta S_M$ 的场依赖性、相对冷却功率和冷却​​能力遵循高达 $\\sim2.6$ T 的幂定律（假设 $J\\approx1$ meV）。磁滞分析表明，配位数较低的晶格随着温度的升高，环路宽度会更快减小。这些结果建立了二维单层和双层磁晶格中磁热效应的普遍标度行为，并为设计磁性制冷剂提供了指导。", "authors": [{"name": "Basit Iqbal"}, {"name": "Kingshuk Sarkar"}], "featured_authors": [{"name": "Basit Iqbal"}, {"name": "Kingshuk Sarkar"}], "author_count": 2}, {"id": "2608.01817", "category": "cond-mat", "title": "Emergent modular Luttinger liquid from spin-partitioned entanglement in the one-dimensional Hubbard model", "abstract": "We study the spin-partitioned entanglement Hamiltonian of the one-dimensional repulsive Hubbard model. By combining bosonization with exact diagonalization, we show that tracing out one spin species produces a modular Luttinger liquid, whose properties fundamentally differ from those of the physical system. While the modular spectrum is fully dispersionless and possesses a momentum-independent entanglement gap, its eigenstates exhibit algebraic correlations governed by a single effective Luttinger parameter equal to the geometric mean of the charge and spin Luttinger parameters. The resulting entanglement spectrum displays a universal branching hierarchy in excellent agreement with exact diagonalization. We further demonstrate that the modular ground state is nearly identical to that of the spinless Luttinger liquid. These results uncover a universal modular structure in interacting one-dimensional fermionic systems.", "url": "https://arxiv.org/abs/2608.01817", "type": "理论+数值", "summary": "我们研究一维排斥哈伯德模型的自旋分配纠缠哈密顿量。通过将玻色子化与精确对角化相结合，我们证明追踪一个自旋物种会产生一种模块化的卢廷格液体，其性质与物理系统的性质根本不同。虽然模谱是完全无色散的并且具有与动量无关的纠缠间隙，但其本征态表现出由单个有效卢廷格参数控制的代数相关性，该有效卢廷格参数等于电荷和自旋卢廷格参数的几何平均值。由此产生的纠缠谱显示出通用的分支层次结构，与精确的对角化非常一致。我们进一步证明，模块化基态与无旋转的卢廷格液体几乎相同。这些结果揭示了相互作用的一维费米子系统中的通用模块化结构。", "authors": [{"name": "Ádám Bácsi"}, {"name": "Catalin Pascu Moca"}, {"name": "Balázs Dóra"}], "featured_authors": [{"name": "Ádám Bácsi"}, {"name": "Catalin Pascu Moca"}, {"name": "Balázs Dóra"}], "author_count": 3}, {"id": "2608.01838", "category": "cond-mat", "title": "Topological Defects in Triple-$Q$ Magnetic Orders: A Fixed-Lattice Homotopy Classification", "abstract": "Multiple-$Q$ magnetic orders combine continuous spin rotations with discrete crystalline sectors associated with translations and point-group transformations, producing a richer defect structure than conventional single-$Q$ magnets. We classify the bulk defects of all seven stable phases for $N=2$ and $3$ in the $M$-point triple-$Q$ Ginzburg--Landau theory with $(\\Vfour\\rtimes\\Dthree)\\times\\OO(N)$ symmetry, where $\\Vfour$ is the translation-generated Klein four-group. The atomic lattice is treated as a prescribed background, with lattice dislocations and disclinations excluded and the three Fourier fields retaining their physical $M$-point labels. The parent-group transformations continuously connected to the identity form $G_0=\\{e\\}\\times\\SO(N)$. For a reference-state stabilizer $H$, the connected component containing the reference state is $G_0/(H\\cap G_0)$, not the quotient obtained by projecting $H$ onto spin space. This distinction gives the orthogonal triple-$Q$ phase the full manifold $\\OO(3)$, with chirality walls and Abelian $\\ZZ_2$ frame vortices rather than non-Abelian binary-polyhedral vortices. Every connected component of the $\\OO(2)$ phases supports an integer $2\\pi$ vortex, whereas fractional windings close only when attached to a discrete-domain wall and are linearly confined at nonzero wall tension. Translation symmetry further forbids cross-gradient bilinears, reducing the quadratic elastic sector to an isotropic and an $M$-point-locked anisotropic stiffness. The classification separates free internal defects, crystalline domain walls, and wall-bound composites in triple-$Q$ magnets.", "url": "https://arxiv.org/abs/2608.01838", "type": "理论", "summary": "多$Q$磁序将连续自旋旋转与与平移和点群变换相关的离散晶体扇区相结合，产生比传统单$Q$磁体更丰富的缺陷结构。我们对 $M$ 点三重 $Q$ Ginzburg-Landau 理论中 $N=2$ 和 $3$ 的所有七个稳定相的体缺陷进行分类，具有 $(\\Vfour\\rtimes\\D Three)\\times\\OO(N)$ 对称性，其中 $\\Vfour$ 是平移生成的克莱因四群。原子晶格被视为规定的背景，排除晶格位错和向错，三个傅立叶场保留其物理 $M$ 点标签。父群变换连续地连接到恒等形式$G_0=\\{e\\}\\times\\SO(N)$。对于参考状态稳定器 $H$，包含参考状态的连通分量是 $G_0/(H\\cap G_0)$，而不是通过将 $H$ 投影到自旋空间获得的商。这种区别赋予正交三 $Q$ 相完整的流形 $\\OO(3)$，具有手性墙和阿贝尔 $\\ZZ_2$ 框架涡流，而不是非阿贝尔二元多面体涡流。\n\n$\\OO(2)$ 相的每个连接组件都支持整数 $2\\pi$ 涡流，而分数绕组仅在连接到离散畴壁时才会闭合，并且在非零壁张力下线性限制。平移对称性进一步禁止交叉梯度双线性，将二次弹性扇区降低为各向同性和 $M$ 点锁定各向异性刚度。该分类将三 $Q$ 磁体中的自由内部缺陷、晶畴壁和壁结合复合材料分开。", "authors": [{"name": "Jin-Tao Jin"}, {"name": "Yi Zhou"}], "featured_authors": [{"name": "Jin-Tao Jin"}, {"name": "Yi Zhou"}], "author_count": 2}, {"id": "2608.01882", "category": "cond-mat", "title": "Gap distributions between successive personal bests in cricket: Data and Models", "abstract": "Successive personal best performances provide a natural measure of progression in an athlete's career. Classical record theory predicts a universal gap distribution, $P(g)\\sim 1/g$, for independent and identically distributed (i.i.d.) sequences. However, sporting careers are shaped by learning, aging, changes in ability, and external influences that violate these assumptions. We investigate the statistics of inter-record gaps, defined as the number of innings between successive personal best scores, in cricket. Using career records of leading Test, ODI, and T20 players obtained from ESPN Cricinfo. We find that the empirical distributions are well described by truncated power law $P(g) \\propto g^{-\\alpha} e^{-\\lambda g}$ with exponents in the range (0.799 $\\leq \\alpha \\leq$ 0.843). Much of this deviation disappears when the temporal ordering of innings is destroyed, indicating that career evolution plays a key role in shaping record occurrence. Bootstrap-shuffled careers, which preserve individual score distributions and career lengths while removing temporal ordering, yield significantly larger exponents ($\\alpha \\approx 0.939\\text{--}0.979$). These findings show that the progression of personal best performances retains information about the temporal organization of a player's career and cannot be fully explained by simple stochastic record processes. More generally, they illustrate how record statistics are altered in nonstationary and path-dependent systems.", "url": "https://arxiv.org/abs/2608.01882", "type": "理论", "summary": "Successive personal best performances provide a natural measure of progression in an athlete's career.经典记录理论预测独立同分布 (i.i.d.) 序列的通用间隙分布 $P(g)\\sim 1/g$。 However, sporting careers are shaped by learning, aging, changes in ability, and external influences that violate these assumptions.我们调查了板球比赛中记录差距的统计数据，定义为连续个人最好成绩之间的局数。使用从 ESPN Cricinfo 获得的领先 Test、ODI 和 T20 球员的职业记录。我们发现经验分布可以通过截断幂律 $P(g) \\propto g^{-\\alpha} e^{-\\lambda g}$ 很好地描述，其指数范围为 (0.799 $\\leq \\alpha \\leq$ 0.843)。当局数的时间顺序被破坏时，这种偏差大部分就会消失，这表明职业发展在塑造记录发生方面发挥着关键作用。 Bootstrap-shuffled 职业保留了个人分数分布和职业长度，同时消除了时间顺序，产生了更大的指数（$\\alpha \\approx 0.939\\text{--}0.979$）。\n\n这些发现表明，个人最佳表现的进展保留了有关球员职业生涯时间组织的信息，并且不能通过简单的随机记录过程来完全解释。更一般地说，它们说明了记录统计数据在非平稳和路径依赖系统中是如何改变的。", "authors": [{"name": "Priyanka D. Bhoyar"}, {"name": "Prashant M. Gade"}], "featured_authors": [{"name": "Priyanka D. Bhoyar"}, {"name": "Prashant M. Gade"}], "author_count": 2}, {"id": "2608.01892", "category": "cond-mat", "title": "Microscopic magnetic phase evolution in the Weyl semimetal Mn$_3$Sn revealed by $μ^+$SR", "abstract": "We report a comprehensive muon spin relaxation ($\\mu^+$SR) and bulk magnetization study of the antiferromagnetic (AFM) Weyl semimetal Mn$_3$Sn (composition Mn$_{2.99}$Sn). Mn$_3$Sn is reported to exhibit a commensurate inverse triangular (IT) AFM phase, an incommensurate (IC) helical AFM phase, and a proposed low-temperature spin-glass-like state. In our sample, we establish the respective transition temperatures for these phases to be $T_\\mathrm{N} = 418$ K, $T_\\mathrm{t} \\approx 275$ K, and $T_\\mathrm{f} = 21$ K. Investigating the low-temperature regime below $T_\\mathrm{f}$, we find no evidence of a static spin-glass state. Instead, the sample exhibits an increasing ferromagnetic (FM) component accompanied by a localized slowing of spin fluctuations, indicating that these phenomena may be decoupled. In the IC helical AFM phase, fitting the zero-field (ZF) spectra reveals an asymmetric internal magnetic-field distribution, indicating that the magnetic structure is heavily modified by anharmonicity. Upon warming above 150 K, a continuous redistribution of muon spectral weight reveals a broad regime of coexisting local magnetic environments associated with the IC helical and IT-AFM phases. In the commensurate IT-AFM phase above $T_\\mathrm{t}$, a persistent missing fraction in the initial asymmetry indicates that a subset of implanted muons, corresponding to roughly 20% of the sample-related asymmetry, undergoes unresolved ultrafast depolarization. Finally, we observe temperature-driven shifts in muon site populations above 325 K. Ultimately, our results show a highly dynamic magnetic landscape in Mn$_3$Sn, demonstrating how its complex magnetic orders often coexist and evolve continuously with temperature.", "url": "https://arxiv.org/abs/2608.01892", "type": "理论+数值", "summary": "我们报告了反铁磁（AFM）Weyl半金属Mn$_3$Sn（成分Mn$_{2.99}$Sn）的全面μ子自旋弛豫（$\\mu^+$SR）和体磁化研究。据报道，Mn$_3$Sn 表现出相称的反三角 (IT) AFM 相、不相称的 (IC) 螺旋 AFM 相以及拟议的低温自旋玻璃态。在我们的样本中，我们确定这些相各自的转变温度为 $T_\\mathrm{N} = 418$ K、$T_\\mathrm{t} \\approx 275$ K 和 $T_\\mathrm{f} = 21$ K。在研究 $T_\\mathrm{f}$ 以下的低温状态时，我们没有发现静态自旋玻璃态的证据。相反，样品表现出不断增加的铁磁（FM）成分，并伴随着自旋波动的局部减慢，表明这些现象可能是解耦的。在 IC 螺旋 AFM 阶段，拟合零场 (ZF) 谱揭示了不对称的内部磁场分布，表明磁结构因非谐性而严重改变。\n\n当温度升高到 150 K 以上时，μ 子谱权重的连续重新分布揭示了与 IC 螺旋相和 IT-AFM 相相关的共存局部磁环境的广泛范围。在 $T_\\mathrm{t}$ 上方相应的 IT-AFM 阶段中，初始不对称性中持续缺失的部分表明，植入的 μ 子子集（相当于大约 20% 的样本相关不对称性）经历了未解决的超快去极化。最后，我们观察到 325 K 以上的 μ 子位点群中温度驱动的变化。最终，我们的结果显示了 Mn$_3$Sn 中高度动态的磁景观，展示了其复杂的磁序如何经常与温度共存并不断演化。", "authors": [{"name": "U. Miniotaite"}, {"name": "O. K. Forslund"}, {"name": "H. Luetkens"}, {"name": "V. Rai"}, {"name": "J. Persson"}, {"name": "G. D. Morris"}, {"name": "D. Zuhair"}, {"name": "D. W. Tam"}, {"name": "S. Nandi"}, {"name": "Y. Sassa"}, {"name": "M. Månsson"}], "featured_authors": [{"name": "U. Miniotaite"}, {"name": "O. K. Forslund"}, {"name": "H. Luetkens"}, {"name": "S. Nandi"}, {"name": "Y. Sassa"}, {"name": "M. Månsson"}], "author_count": 11}, {"id": "2608.01902", "category": "cond-mat", "title": "Wannier-Stark localization, confinement and edge states", "abstract": "The boundary between a system's bulk and the vacuum can be modeled by a potential which confines the electrons to the bulk. Here we present the example of the Wannier-Stark linear potential, generated by an electric field along one axis of a two-dimensional lattice. Along that axis, the potential generates electronic states which are localized around each lattice site, with eigenenergies which form the Wannier-Stark ladder. In the transverse direction, the states are governed by a tight binding model with free Bloch states. In the ground state, filling these states under the Pauli principle generates an insulating bulk and an edge which can be metallic in the transverse direction. This paper explains the concepts of localization, localization length, filling and confinement. The paper also acquaints the readers with the use of Bessel functions in the solution of a simple physical model. These topics can be easily included in courses on solid state physics, and only require prior knowledge of quantum mechanics.", "url": "https://arxiv.org/abs/2608.01902", "type": "理论", "summary": "The boundary between a system's bulk and the vacuum can be modeled by a potential which confines the electrons to the bulk. Here we present the example of the Wannier-Stark linear potential, generated by an electric field along one axis of a two-dimensional lattice.沿着该轴，电势产生位于每个晶格位点周围的电子态，其特征能形成了万尼尔-斯塔克阶梯。 In the transverse direction, the states are governed by a tight binding model with free Bloch states.在基态下，根据泡利原理填充这些状态会产生绝缘体和横向上可以是金属的边缘。本文解释了定位、定位长度、填充和限制的概念。本文还让读者熟悉贝塞尔函数在简单物理模型求解中的使用。这些主题可以很容易地包含在固体物理课程中，并且只需要量子力学的先验知识。", "authors": [{"name": "N. Aucar Boidi"}, {"name": "A. Aharony"}, {"name": "O. Entin-Wohlman"}, {"name": "C.Proetto"}], "featured_authors": [{"name": "N. Aucar Boidi"}, {"name": "A. Aharony"}, {"name": "O. Entin-Wohlman"}, {"name": "C.Proetto"}], "author_count": 4}, {"id": "2608.01925", "category": "cond-mat", "title": "A numerical study to analyze the interplay of Weissenberg number and viscosity ratio in a log-strain tensorial model for viscoelastic fluids", "abstract": "We present a computational study aimed at exploring the different and independent roles of the Weissenberg number and of the ratio between the polymeric and solvent viscosity contributions in a viscoelastic fluid model. The tensorial model under investigation, recently proposed, is based on a logarithmic relation between the elastic (or recoverable) strain and the elastic stress. In this model, the elastic strain plays the role of a conformation tensor and its evolution equation inherently preserves its determinant and positive definiteness. These properties are also enforced in the computational method employed in the study. A finite-difference discretization in time is combined with a stabilized mixed finite element formulation based on the Variational Multiscale method for the spatial discretization and with a generalized Lie derivative approach for the advection terms. The behavior of the model is analyzed in paradigmatic pressure-driven flows and we find that the value of the viscosity ratio is crucial in determining to which extent non-Newtonian flow profiles are observed upon increasing the Weissenberg number. By comparing the solutions of the log-strain tensorial model with those of a suitable Generalized Newtonian Fluid model, we show that flow-type dependence plays a significant role even in the simple planar flow past a cylinder.", "url": "https://arxiv.org/abs/2608.01925", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nehal Dash"}, {"name": "Ramon Codina"}, {"name": "Giulio G. Giusteri"}], "featured_authors": [{"name": "Nehal Dash"}, {"name": "Ramon Codina"}, {"name": "Giulio G. Giusteri"}], "author_count": 3}, {"id": "2608.01991", "category": "cond-mat", "title": "Spin Josephson diode effect induced by higher-harmonic spin Josephson currents in a diffusive Josephson junction", "abstract": "We theoretically investigate the spin Josephson diode effect (SJDE) in a diffusive Josephson junction with a Rashba metal layer under a ferromagnetic exchange field. Within the quasiclassical Green's function framework, we derive analytical expressions for the first- and second-harmonic spin Josephson currents. The interplay between Rashba spin-orbit interaction and the exchange field breaks inversion and time-reversal symmetries, generating additional cosine terms in the spin current-phase relations and a finite phi0 phase shift. This phase shift induces an intrinsic asymmetry between forward and backward spin currents, leading to the SJDE without an external magnetic field. Numerical results show that the efficiency decreases with increasing metal thickness due to suppression of the second-harmonic component, while its dependence on spin-orbit interaction strength reflects competing effects between phase shift enhancement and harmonic suppression. These findings demonstrate that the interplay between harmonic components provides a mechanism for nonreciprocal spin transport without requiring suppression of spin-singlet correlations.", "url": "https://arxiv.org/abs/2608.01991", "type": "理论+数值", "summary": "我们从理论上研究了铁磁交换场下具有 Rashba 金属层的扩散约瑟夫森结中的自旋约瑟夫森二极管效应 (SJDE)。在准经典格林函数框架内，我们推导了一次和二次自旋约瑟夫森电流的解析表达式。 Rashba 自旋轨道相互作用与交换场之间的相互作用打破了反演和时间反转对称性，在自旋电流-相位关系中产生了额外的余弦项和有限的 phi0 相移。这种相移会引起正向和反向自旋电流之间的固有不对称性，从而导致 SJDE 无需外部磁场。数值结果表明，由于二次谐波分量的抑制，效率随着金属厚度的增加而降低，而其对自旋轨道相互作用强度的依赖性反映了相移增强和谐波抑制之间的竞争效应。这些发现表明，谐波分量之间的相互作用提供了一种非互易自旋输运机制，而不需要抑制自旋单线相关性。", "authors": [{"name": "Shin-ichi Hikino"}], "featured_authors": [{"name": "Shin-ichi Hikino"}], "author_count": 1}, {"id": "2608.02007", "category": "cond-mat", "title": "Benchmarking the fermionic quasi-1D many-body problem", "abstract": "We investigate the validity of effective one-dimensional models for quasi-1D fermionic systems by benchmarking a coupled-channel approach against the exact low-energy theory derived from the underlying three-dimensional problem in the weakly and strongly attractive limits. We show that reproducing the exact two-body scattering amplitude is insufficient to construct the correct effective low-energy theory of quasi-1D fermions. In the weakly attractive regime, it does not capture the emergent three-body interaction induced by transverse excitations. In the strongly attractive regime, it yields an atom-dimer scattering length with an incorrect dependence on the three-dimensional scattering length. These results demonstrate the limitations of effective one-dimensional descriptions based solely on two-body physics and highlight the need to explicitly include few-body correlations in quasi-1D systems.", "url": "https://arxiv.org/abs/2608.02007", "type": "理论", "summary": "我们通过将耦合通道方法与从弱吸引力极限和强吸引力极限中的潜在三维问题导出的精确低能量理论进行基准测试，研究准一维费米子系统的有效一维模型的有效性。我们证明，再现精确的二体散射幅度不足以构建正确有效的准一维费米子低能理论。 In the weakly attractive regime, it does not capture the emergent three-body interaction induced by transverse excitations.在强吸引状态下，它产生原子二聚体散射长度，并且对三维散射长度有不正确的依赖性。这些结果证明了仅基于二体物理的有效一维描述的局限性，并强调了在准一维系统中明确包含少体相关性的必要性。", "authors": [{"name": "Ekaterina Gradova"}, {"name": "Fr{é}d{é}ric Chevy"}], "featured_authors": [{"name": "Ekaterina Grado
