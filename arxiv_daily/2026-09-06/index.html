ns.", "url": "https://arxiv.org/abs/2609.03226", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Antonio Palamara"}, {"name": "Nicola Lo Gullo"}, {"name": "Antonello Sindona"}, {"name": "Francesco Plastina"}], "featured_authors": [{"name": "Antonio Palamara"}, {"name": "Nicola Lo Gullo"}, {"name": "Antonello Sindona"}, {"name": "Francesco Plastina"}], "author_count": 4}, {"id": "2609.03240", "category": "quant-ph", "title": "Quantum Complexity in Nuclear Scattering and Fission Dynamics", "abstract": "Quantum computers promise advantages for simulating strongly correlated quantum many-body systems, like atomic nuclei, that are beyond the reach of classical computers. Realizing this potential requires understanding the quantum complexity structure of the target problem. We investigate the time-evolution of two key indicators of quantum complexity, bipartite entanglement entropy and non-local magic (non-stabilizerness), in nuclear reaction dynamics. We analyze two representative dynamical processes: scattering in a one-dimensional model of strongly interacting fermions governed by the Negele potential, and a realistic simulation of $^{240}$Pu fission within time-dependent Hartree-Fock-Bogoliubov (TDHFB) theory. In the former case, we find that interactions dynamically generate both entanglement and non-local magic, leaving persistent signatures of quantum complexity in the outgoing states. In the latter, we observe that substantial quantum complexity survives in the spatial bipartition of daughter fragments well beyond scission. The presence of significant non-local magic and entanglement in both cases strongly indicate that quantum computers would provide substantial advantages for accurately simulating nuclear reaction dynamics.", "url": "https://arxiv.org/abs/2609.03240", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Saurabh V. Kadam"}, {"name": "Antonio Bjelčić"}, {"name": "Nicolas Schunck"}, {"name": "Kyle Wendt"}], "featured_authors": [{"name": "Saurabh V. Kadam"}, {"name": "Antonio Bjelčić"}, {"name": "Nicolas Schunck"}, {"name": "Kyle Wendt"}], "author_count": 4}, {"id": "2609.03272", "category": "quant-ph", "title": "Discrete-time quantum walks with energy-dependent coins", "abstract": "In this work, we extend the scattering quantum walk (SQW) framework to a lattice of energy-dependent point interactions. This yields, within the coined quantum walk (CQW) formalism, a coin operator that is directly related to the scattering matrix of zero-range potentials. The model thus provides a discrete-time quantum-walk (DTQW) analog of a periodic array of point interactions of the Kronig-Penney type, where the walker's wavenumber serves as a continuous, physically transparent control parameter for the coin operation. We analyze the spectra and the dynamics of position probability and entanglement, yielding distinct results for specific energies and point interactions. We relate the spectral structure to the spatial probability distribution and explicitly characterize the long-time entanglement behavior for each point interaction. The transmission modulus determines the quasienergy gap, bandwidth, and maximum group velocity, while also controlling the long-time coin-position entanglement for the initial state considered. The four families of one-dimensional point interactions ($\\delta$, $\\delta'$, crossed and asymmetric) realize qualitatively distinct transmission profiles and span the full range of behavior, including enhanced or strongly suppressed spreading and oscillatory entanglement.", "url": "https://arxiv.org/abs/2609.03272", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alana Spak dos Santos"}, {"name": "Thiago T. Tsutsui"}, {"name": "Fabiano M. Andrade"}], "featured_authors": [{"name": "Alana Spak dos Santos"}, {"name": "Thiago T. Tsutsui"}, {"name": "Fabiano M. Andrade"}], "author_count": 3}, {"id": "2609.03323", "category": "quant-ph", "title": "Variable-Cliff Nielsen Geometry and an Exponent -4/3 Lower Bound for the Infinite-Cliff Diameter", "abstract": "Let $D=2^n$ and $M=3n+9\\binom n2$. We study the right-invariant one-step-cliff metric $d_Q$ on $\\operatorname{PU}(D)$, with unit penalty on Pauli weights one and two and penalty $Q$ on all higher weights. If $M/Q_D\\to0$ and $MQ_D^{3/4}/D^2\\to0$, then, for every fixed $0<x<\\pi/\\sqrt3$, \\[ \\mu_D\\bigl(B_{Q_D}([I],x\\sqrt{Q_D})\\bigr)\\le e^{-c_xD^2}. \\] Here $\\mu_D$ is normalized Haar measure. Thus the Haar-typical distance from the identity and the diameter are both asymptotic to $(\\pi/\\sqrt3)\\sqrt{Q_D}$ throughout the window $M\\ll Q_D\\ll D^{8/3}M^{-4/3}$. Choosing $Q_D=\\kappa D^{8/3}M^{-4/3}$ with sufficiently small fixed $\\kappa>0$ yields a Haar-typical lower bound of order $D^{4/3}M^{-2/3}$ for the corresponding infinite-cliff Carnot--Carathéodory distance, outside an $e^{-\\Omega(D^2)}$ exceptional set. The infinite-cliff diameter therefore has exponential lower rate at least $4/3$, disproving Brown's exponent-one conjecture. The same estimate gives a fixed-error no-ancilla two-qubit circuit lower bound of the same order.", "url": "https://arxiv.org/abs/2609.03323", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Honghuai Fang"}], "featured_authors": [{"name": "Honghuai Fang"}], "author_count": 1}, {"id": "2609.03360", "category": "quant-ph", "title": "Nonlinear Dissipation and Hopf Criticality in Driven Dissipative Collective Spins", "abstract": "Self-sustained oscillations in open many-body systems can be organized by two distinct dynamical ingredients: the selection of a finite-amplitude background attractor and the subsequent control of its neutral phase. We develop this bifurcation-based picture for driven-dissipative collective spins and show how the microscopic dissipative structure determines the available background and its response to explicit U(1) breaking. In the thermodynamic-limit mean-field dynamics, a single linear U(1)-covariant jump produces only polar fixed-point backgrounds, whereas nonlinear covariant dissipation provides amplitude-dependent saturation and stabilizes a finite-latitude self-sustained-oscillator manifold through a supercritical Hopf bifurcation. Under coherent U(1) breaking, exact resonance leads to a reversible double-zero degeneracy with vanishing critical frequency rather than a standard Hopf onset. Finite detuning unfolds this singularity into a genuine finite-frequency Hopf boundary, which exists only on the self- sustained-oscillator side and can be either supercritical or subcritical. By contrast, a single linear dissipative U(1)-breaking jump cannot generate a standard Hopf instability: when its phase-pinning invariant vanishes the azimuthal direction remains neutral, whereas otherwise the phase-locked fixed points have a purely real Jacobian spectrum. These results establish a general design principle: nonlinear covariant dissipation selects the self-sustained background, while the structure of the symmetry-breaking channel determines whether the resulting local response is double-zero, genuinely Hopf, or non-Hopf.", "url": "https://arxiv.org/abs/2609.03360", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shu Yang"}, {"name": "Jun Wang"}, {"name": "Weidong Li"}, {"name": "Cangtao Zhou"}, {"name": "Jian-Song Pan"}, {"name": "Jianwen Jie"}], "featured_authors": [{"name": "Shu Yang"}, {"name": "Jun Wang"}, {"name": "Weidong Li"}, {"name": "Cangtao Zhou"}, {"name": "Jian-Song Pan"}, {"name": "Jianwen Jie"}], "author_count": 6}, {"id": "2609.03419", "category": "quant-ph", "title": "In defence of the Ehrenfest mean-field molecular dynamics", "abstract": "Re-visiting the problem of the coupled electronic--nuclear motion, we prove that the so called `mean-field' Ehrenfest picture is an exact theory, rather than an approximation, in the classical limit for nuclei. By establishing its full equivalence to the much more involved Exact Factorization approach to the problem (Abedi {\\it et al.}, Europhys. Lett. {\\bf 106}, 33001 (2014)), our conclusion rehabilitates the mean-field Ehrenfest molecular dynamics as a simple, effective, while formally exact scheme, amenable to the use within the framework of the time-dependent density functional theory.", "url": "https://arxiv.org/abs/2609.03419", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vladimir U. Nazarov"}], "featured_authors": [{"name": "Vladimir U. Nazarov"}], "author_count": 1}, {"id": "2609.03440", "category": "quant-ph", "title": "Convolution absorbing boundaries for explicit-circuit quantum simulation of the wave equation", "abstract": "Explicit quantum circuits for the wave equation, built by Hamiltonian simulation, are restricted to closed domains, in which outgoing waves reflect off the edge of the computational region and return. We lift that restriction with absorbing boundaries of the convolution type - a complex-frequency-shifted perfectly matched layer realised through exponential-kernel memory variables - and make the resulting non-unitary dynamics quantum-implementable by Schrodingerisation. We obtain three results. First, explicit gate-level circuits for the absorbing evolution, obtained by extending a Bell- basis term-evolution circuit to projector-valued operator strings and Trotterising to second order; these run end to end on seventeen to twenty-one qubits and agree with exact references to within a tenth of a percent to a percent. Second, a structural obstruction: the memory form of the absorbing generator carries an irreducibly indefinite Hermitian part, whose largest eigenvalue grows as the square root of the absorption strength divided by the grid spacing and survives any diagonal rescaling of the memory fields. The known recovery threshold for Schrodingerisation then makes the post-selection cost grow exponentially in the simulated time. Third, a remedy: a Lyapunov symmetrizer, precomputed classically, renders the transformed generator dissipative and replaces that time-dependent penalty with a time-independent conditioning factor of several hundred, measured on grids of up to four thousand unknowns and saturating under mesh refinement. The crossover is early: past it the symmetrized recovery is cheaper by four to twenty-six orders of magnitude in post-selection cost, and at the longest horizons tested it is the only recovery that works.", "url": "https://arxiv.org/abs/2609.03440", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hoang Anh Nguyen"}, {"name": "Ali Tura"}], "featured_authors": [{"name": "Hoang Anh Nguyen"}, {"name": "Ali Tura"}], "author_count": 2}, {"id": "2609.03491", "category": "quant-ph", "title": "Weakly Driven and Finite Detuning Boundary Time Crystals Enabled by Low-Dissipation Dynamical Channels", "abstract": "Spontaneous breaking of continuous time-translation symmetry in driven-dissipative systems gives rise to boundary time crystals (BTCs), characterized by persistent oscillations sustained by coherent driving and collective dissipation. Conventional BTCs, however, typically require strong driving and exact atom-drive resonance, imposing stringent constraints on their realization. Here we consider two atomic ensembles coupled to a common Markovian reservoir and show that shared dissipation organizes dissipation-free and low-dissipation modes into dynamically accessible low-dissipation channels, enabling BTCs under weak driving and finite detuning. Finite detuning further selects a unique stable limit cycle from an initial-state-dependent family of oscillatory trajectories. Our results establish low-dissipation dynamical channels as a route to robust BTCs under relaxed driving and resonance conditions.", "url": "https://arxiv.org/abs/2609.03491", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xiang Guo"}, {"name": "Xiaojun Zhang"}, {"name": "Zhihai Wang"}], "featured_authors": [{"name": "Xiang Guo"}, {"name": "Xiaojun Zhang"}, {"name": "Zhihai Wang"}], "author_count": 3}, {"id": "2609.03625", "category": "quant-ph", "title": "Quantum Quasi-Monte Carlo: a window for pre-asymptotic quantum advantage", "abstract": "Numerical integration with Monte Carlo methods is a central computational task in many scientific and industrial applications, including financial derivative pricing and risk management. Classical Monte Carlo algorithms are computationally demanding: achieving an accuracy $\\epsilon$ typically requires a number of function evaluations scaling as $O(1/\\epsilon^2)$. Quantum-accelerated Monte Carlo methods based on quantum amplitude estimation can in principle quadratically improve this dependence. However, \\textit{quasi}-Monte Carlo methods have not been explored in the quantum context. In this work, we introduce a quantum quasi-Monte Carlo algorithm that combines low-discrepancy nets with quantum amplitude estimation. The proposed method prepares the quasi-random point set coherently in superposition. The method does not yield an asymptotic improvement over classical quasi-Monte Carlo, since the total error separates into a discretization error, determined by the finite net, and a quantum estimation error. Instead, we explore a pre-asymptotic advantage window: for a target accuracy that would classically require $2^q$ low discrepancy points, one can prepare a higher-resolution net of size $2^Q$, with $Q>q$, in superposition and reach the same accuracy using significantly fewer function queries. This window can be controlled by tuning the circuit resolution and amplitude-estimation parameters, making the approach relevant for practical regimes where the number of queries is finite rather than asymptotically large.", "url": "https://arxiv.org/abs/2609.03625", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Paolo Recchia"}, {"name": "Zhan Yu"}, {"name": "Kelvin Koor"}, {"name": "Patrick Rebentrost"}], "featured_authors": [{"name": "Paolo Recchia"}, {"name": "Zhan Yu"}, {"name": "Kelvin Koor"}, {"name": "Patrick Rebentrost"}], "author_count": 4}, {"id": "2609.03638", "category": "quant-ph", "title": "Entanglement dynamics of accelerated atoms with environment-induced interactions", "abstract": "We investigate the influence of environment-induced interactions on the entanglement dynamics of two uniformly accelerated atoms coupled to a fluctuating massless scalar field with a reflecting boundary. The two atoms are aligned vertically to the boundary. The entanglement behaviors are influenced by the competition between the environment-induced interatomic and the environment-induced atom-plate interactions, which can be characterized by certain critical values. The maximum of concurrence generated during evolution decreases non-monotonically with the acceleration, which implies the anti-Unruh phenomenon can exist for some situations even when both environment-induced interatomic and the environment-induced atom-plate interactions are considered.", "url": "https://arxiv.org/abs/2609.03638", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xuerui Zhou"}, {"name": "Chenhao Ma"}, {"name": "Zixu Zhao"}], "featured_authors": [{"name": "Xuerui Zhou"}, {"name": "Chenhao Ma"}, {"name": "Zixu Zhao"}], "author_count": 3}, {"id": "2609.03703", "category": "quant-ph", "title": "Fractalizing spacetime: Floquet codes with fractonic excitations that are immobile in space and time", "abstract": "We generalize fractalization, a procedure for the construction of fracton models, from space to spacetime. We apply spacetime fractalization to construct fracton floquet codes with syndrome excitations that have limited mobility in space and time. This extends the notion of fracton order to intrinsically dynamical quantum phases of matter that are inequivalent to static fracton phases. We find spacetime type-II fracton floquet codes which have no topological excitations that are mobile in space or time. These codes exhibit an extreme form of quantum discrete time crystal order with response periods that scale exponentially in their linear system sizes. In this context, the no-strings rule that characterizes type-II fractons leads to a superlinear scaling of the floquet code fault-distance with time, potentially lowering the time overhead required for quantum error correction.", "url": "https://arxiv.org/abs/2609.03703", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Juliette Soule"}, {"name": "Dominic J. Williamson"}], "featured_authors": [{"name": "Juliette Soule"}, {"name": "Dominic J. Williamson"}], "author_count": 2}, {"id": "2609.03706", "category": "quant-ph", "title": "Q-Edge: Symmetry-Reduced Quantum Simulation of Structured Extreme Dependence", "abstract": "High-dimensional simulation of multivariate extremes is fundamentally limited by the combinatorial complexity of dependence, often more than by the scarcity of extreme observations. We show that symmetry admits a lossless orbit-space representation that preserves structured extreme dependence while replacing an exponentially large dependence space with a compact set of symmetry classes. Based on this principle, we develop Q-Edge (Quantum Extreme Dependence Engine), a symmetry-reduced quantum framework that operates directly in orbit space, enabling scalable simulation and digital twins of structured extreme systems. By transferring symmetry into the data representation rather than the quantum circuit, Q-Edge allows unconstrained quantum generative models to exploit dramatically reduced state spaces. For a 30-dimensional problem, approximately 1.6 million angular states collapse to 256 orbit states, reducing the required quantum representation from about 21 qubits to 8. Our results establish a general computational principle for scalable quantum simulation of structured extreme dependence.", "url": "https://arxiv.org/abs/2609.03706", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hongrui Zhang"}, {"name": "Paolo Recchia"}, {"name": "Ying Chen"}], "featured_authors": [{"name": "Hongrui Zhang"}, {"name": "Paolo Recchia"}, {"name": "Ying Chen"}], "author_count": 3}, {"id": "2609.03748", "category": "quant-ph", "title": "Thermodynamic Irreversibility from Inaccessible Endogenous Quantum Histories", "abstract": "Microscopic unitary dynamics preserves all fine information, yet an isolated finite system can show a robust thermodynamic window in which the entropy associated with a restricted record rises. We ask why information hidden from the current record usually fails to rebuild a low-entropy macrostate. For a fixed projective record, every finite step separates exactly into the evolution predicted from the record alone and an exact correction carried by unresolved microscopic structure. The record-only contribution starts only at second order in time, so all instantaneous change of the record comes from hidden currents between macrostates. We derive the exact entropy rate, separate entropy-spreading from return-oriented currents, and resolve those currents into energy-gap amplitudes. Transitions with the same gap add coherently, revealing how the Hamiltonian and the microscopic state organize hidden information for return. In interacting mixing dynamics the current power is spread over many frequencies; free and deliberately commensurate controls progressively concentrate it, and the engineered dynamics reconstructs a low-entropy macrostate. An independent distribution-level test separates hidden dynamical activity from finite-step return, and an exact classical measure-preserving counterpart shows which parts of the construction are not uniquely quantum. Within the specified record and observation window, irreversibility is therefore not loss of microscopic information, but the failure of that information to organize currents that restore macroscopic order.", "url": "https://arxiv.org/abs/2609.03748", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Borhan Ahmadi"}], "featured_authors": [{"name": "Borhan Ahmadi"}], "author_count": 1}, {"id": "2609.03769", "category": "quant-ph", "title": "Metricity of separable quantum optimal transport with the Hilbert-Schmidt cost", "abstract": "We prove that the square root of the separable quantum optimal transport cost associated with the orthogonal projection onto the antisymmetric subspace defines a genuine distance between density matrices. Equivalently, this establishes the triangle inequality for the order-two Beatty-França quantum optimal transport construction induced by the Hilbert-Schmidt distance between pure states. The result also proves metricity of the corresponding distance derived from separable SWAP fidelity. The proof replaces the unavailable gluing argument by convex-roof duality and a dimension-independent interpolation result for Hermitian operators.", "url": "https://arxiv.org/abs/2609.03769", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tomasz Miller"}], "featured_authors": [{"name": "Tomasz Miller"}], "author_count": 1}, {"id": "2609.03778", "category": "quant-ph", "title": "Quantisation of Abstract Data Types", "abstract": "In this paper, we introduce a notion of abstract quantum data type within the framework of universal algebra. This notion provides an algebraic foundation for describing data abstraction in quantum programming. We formally define a quantisation of classical data types and show that their equational specifications can be soundly lifted to the quantum setting. Two standard quantisation methods for classical functions, namely the bit oracle and the phase oracle, arise as special cases of this general construction. We illustrate the framework with applications to quantum arrays and quantum error-correcting codes, showing how they can be understood through the lens of data-type quantisation. We further establish conditions under which quantisation preserves structural relationships and constructions of classical data types, including embeddings, isomorphisms, and products.", "url": "https://arxiv.org/abs/2609.03778", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mingsheng Ying"}, {"name": "Zhicheng Zhang"}, {"name": "Kean Chen"}], "featured_authors": [{"name": "Mingsheng Ying"}, {"name": "Zhicheng Zhang"}, {"name": "Kean Chen"}], "author_count": 3}, {"id": "2609.03802", "category": "quant-ph", "title": "Quantum Query Complexity of Finding a Tarski Fixed Point on a High-Dimensional Grid", "abstract": "The Knaster-Tarski fixed-point theorem states that every monotone function over a complete lattice has a fixed point. Beyond its fundamental role in order theory, the theorem and its algorithmic variants have found broad applications in areas such as economics, game theory, and programming languages. While the query complexity of finding a Tarski fixed point has been extensively studied in classical models, comparatively little is known in the quantum setting. We prove an $\\Omega(k\\log n)$ quantum query lower bound for finding a fixed point of a monotone function on $[n]^k$, using the nonnegative spectral adversary method. In the two extremal regimes $n = 2$ and $k = 1$, our quantum lower bound matches the previous classical lower bounds $\\Omega(k)$ and $\\Omega(\\log n)$, respectively. For $n, k\\geq 2$, our bound improves the best previous classical lower bound when $n < k$ and is within a factor of $\\log n / \\log k$ compared to the known classical lower bound when $n \\geq k$. To construct the adversary matrix, we develop the Tree--Filtration Adversary Method. Besides yielding our lower bound, the method offers a more transparent combinatorial interpretation of the nonnegative spectral adversary method. When the hard instances of a problem admit a tree-like organization and suggest an intuition analogous to classical decision-tree lower bounds, our method provide a promising approach to establishing quantum complexity lower bounds.", "url": "https://arxiv.org/abs/2609.03802", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tongyang Li"}, {"name": "Weiran Ma"}, {"name": "Ziyi Yang"}, {"name": "Xingyu Zhao"}], "featured_authors": [{"name": "Tongyang Li"}, {"name": "Weiran Ma"}, {"name": "Ziyi Yang"}, {"name": "Xingyu Zhao"}], "author_count": 4}, {"id": "2609.03864", "category": "quant-ph", "title": "Exact Compatibility Geometry of Three-Qubit Entanglement", "abstract": "We present a permutation-symmetric supporting relation between the pairwise concurrences and the three-tangle in three-qubit system, whose extrema are attained only by the symmetric $W$ and GHZ local-unitary classes. Furthermore, by introducing the concept of a four-dimensional compatibility body, we show that our proposed global relation and the previous CKW relation can be uniformly viewed as different supporting directions of the same achievable set. Subsequently, we provide a necessary-and-sufficient semi-algebraic characterization of the complete four-dimensional compatibility of a three-qubit pure state. Based on this, we can conversely describe the compatibility between entangled components: given the remaining entangled components, the missing two-body entangled component can only take values within a precise parameter-free interval. We demonstrate that the above construction also applies to arbitrary concurrence-generated entanglement measures.", "url": "https://arxiv.org/abs/2609.03864", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}, {"name": "Ming Yang"}], "featured_authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}, {"name": "Ming Yang"}], "author_count": 3}, {"id": "2609.03925", "category": "quant-ph", "title": "Ultra-Precise Quantum Projective Designs in Constant Depth", "abstract": "Random quantum objects are powerful resources for quantum information processing, yet exact Haar randomness is costly and typically unnecessary. We introduce an explicit sparse commuting circuit ensemble on $n$ qubits that reproduces low-order Haar moments in the stringent relative-error sense. The circuit consists of a sparse Clifford phase layer followed by independent single-qubit Clifford gates. Acting on a simple product state, the resulting ensemble forms $\\epsilon$-approximate projective $2$- and $3$-designs in relative error, with the required logarithmic interaction degree being asymptotically optimal within this circuit family. It admits an ancilla-free implementation of quantum depth $O(\\log(n/\\epsilon))$ on an all-to-all architecture, as well as an adaptive constant-depth implementation---in fact, depth seven---using $O(n\\log(n/\\epsilon))$ ancilla qubits. Departing from existing shallow-design paradigms, our analysis exploits the intrinsic moment structure of commuting phase circuits; at third order, this requires a new block decomposition and combinatorial analysis that also suggests a route toward higher-order shallow designs. Our results show that precise Haar-like statistics can emerge from sparse commuting dynamics with remarkably low quantum resources, with applications to randomized characterization, quantum metrology, quantum algorithms, and many-body physics.", "url": "https://arxiv.org/abs/2609.03925", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Qingyue Zhang"}, {"name": "Junjie Chen"}, {"name": "Zhou You"}, {"name": "You Zhou"}], "featured_authors": [{"name": "Qingyue Zhang"}, {"name": "Junjie Chen"}, {"name": "Zhou You"}, {"name": "You Zhou"}], "author_count": 4}, {"id": "2609.03928", "category": "quant-ph", "title": "Approximate maximum-likelihood decoding via truncated free energies", "abstract": "Maximum-likelihood decoding (MLD) achieves the minimum logical error rate of stabilizer codes under known i.i.d. Pauli noise, but its exact evaluation is \\#P-hard. Practical pipelines therefore approximate MLD by minimum-weight decoding (MWD), retaining only the lowest-weight recovery per syndrome and discarding the coset degeneracy. The minimum-weight search is in turn implemented by stochastic solvers. We introduce approximate maximum-likelihood decoding (AMLD), a black-box framework that recycles the candidate samples discarded by stochastic inner decoders into a per-class truncated free-energy estimator. For every logical class represented in the candidate pool, the estimator is provably bounded below by the exact free energy and above by the empirical minimum weight. AMLD returns the logical class minimizing the estimated free energy with linear classical overhead. In SA-based Ising-decoder benchmarks, AMLD closes up to $83\\%$ of the MWD--MLD threshold gap across the toric and color codes under bit-flip and depolarizing noise. The largest threshold improvement, from $17.28\\%$ to $18.62\\%$, occurs on the $6.6.6$ color code under depolarizing noise. We further demonstrate AMLD on the $[[144,12,12]]$ bivariate-bicycle code, whose bit-flip decoding problem has a hypergraph structure. This application requires neither matching-based enumeration nor code-specific tensor-network contraction. At $p=0.05$, AMLD reduces the logical error rate by $13\\%$ relative to MWD evaluated on the same BP-OSD candidate pool.", "url": "https://arxiv.org/abs/2609.03928", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuanqi Liu"}, {"name": "Weilei Zeng"}, {"name": "Junjie Wu"}, {"name": "Lingling Lao"}], "featured_authors": [{"name": "Yuanqi Liu"}, {"name": "Weilei Zeng"}, {"name": "Junjie Wu"}, {"name": "Lingling Lao"}], "author_count": 4}, {"id": "2609.03944", "category": "quant-ph", "title": "On the geometry and typicality of quantum magic", "abstract": "We prove that, for an $n$-qubit system of dimension $d=2^n$, every state satisfying $\\operatorname{Tr}(\\rho^2)\\le 1/(d-a_\\ast)$, with $a_\\ast=0.458327\\cdots$, lies inside the stabilizer polytope and is therefore magic-free. Combining this result with general geometric properties of high-dimensional polytopes, we establish quantitative estimates for the Hilbert--Schmidt inradius and volume radius of the stabilizer polytope, and use them to characterize the typicality of magic in random induced states obtained by tracing out a $k$-dimensional subsystem from a $d\\times k$-dimensional Haar-random pure state. We prove a sharp phase transition in the probability of such states having magic, whose transition dimension $k_\\star$ is bounded between $\\Omega(d^2/\\log^2d)$ and $\\mathcal{O}(d^2)$. We further prove that the number of facets of the stabilizer polytope lies between $\\exp[\\Omega(d^2/\\log^2 d)]$ and $\\exp[\\mathcal{O}(d^2\\log^2 d)]$, substantially improving upon the previous quasipolynomial lower bound and implying that any exact description of the magic-free region requires a doubly exponential number of linear inequalities in the number of qubits. Overall, our results show that the stabilizer polytope exhibits near-maximal geometric complexity allowed for a high-dimensional polytope with a certain number of vertices.", "url": "https://arxiv.org/abs/2609.03944", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhenhuan Liu"}, {"name": "Z-Wen Liu"}], "featured_authors": [{"name": "Zhenhuan Liu"}, {"name": "Z-Wen Liu"}], "author_count": 2}, {"id": "2609.04037", "category": "quant-ph", "title": "Discrete time crystals in disordered anisotropic Heisenberg chains", "abstract": "A discrete time crystal is an out-of-equilibrium phase of matter characterized by the spontaneous breaking of discrete time-translation symmetry. Using extensive numerical simulations based on matrix-product-state methods, we provide evidence for discrete time-crystalline behavior in strongly disordered spin chains with Heisenberg interactions, including the isotropic point, subject to periodic driving. Starting from a many-body localized regime, we observe that rotations induced by delta kicks produce a pronounced subharmonic response at half the drive frequency in spin observables. We investigate the stability of this response against rotation-angle errors through entanglement entropy, quantum Fisher information, short-range spin correlations, and restricted-control ergotropy. Increasing the rotation error reveals an intermediate dynamical regime separating the time-crystalline and Floquet-localized responses. In this regime, most observables exhibit signatures of weakly correlated dynamics reminiscent of Anderson localization.", "url": "https://arxiv.org/abs/2609.04037", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Francesco Formicola"}, {"name": "Grazia Di Bello"}, {"name": "Antonio De Candia"}, {"name": "Giulio De Filippis"}, {"name": "Carmine Antonio Perroni"}], "featured_authors": [{"name": "Francesco Formicola"}, {"name": "Grazia Di Bello"}, {"name": "Antonio De Candia"}, {"name": "Giulio De Filippis"}, {"name": "Carmine Antonio Perroni"}], "author_count": 5}, {"id": "2609.04064", "category": "quant-ph", "title": "Quantum-Enhanced Phase Estimation with Photon-Added Even and Odd Coherent States in an SU(1,1) Interferometer", "abstract": "We investigate phase estimation in an SU(1,1) interferometer employing $m$-photon-added even and odd coherent states as nonclassical input resources. The phase sensitivity is evaluated through intensity detection and the error propagation method, while the ultimate precision limit is determined from the quantum Cramér-Rao bound with the quantum Fisher information serving as the relevant metrological quantity. Our results demonstrate that photon addition significantly enhances the phase sensitivity, increases the quantum Fisher information, and reduces the quantum Cramér-Rao bound, leading to a clear improvement over the corresponding even and odd coherent states. Furthermore, the achievable sensitivity exceeds the standard quantum limit and gradually approaches the Heisenberg scaling with increasing photon-addition number. We also find that the $m$-photon-added even coherent states exhibit a modest advantage over their odd counterparts. As $m$ increases, however, this distinction becomes progressively weaker, suggesting that photon addition diminishes the role of the initial parity of the coherent state in determining the interferometric performance.", "url": "https://arxiv.org/abs/2609.04064", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Abdelmajid El Maaroufi"}, {"name": "Mouad Ait Maskour"}, {"name": "Bouchra Maroufi"}, {"name": "Mohammed Daoud"}, {"name": "Saeed Haddadi"}], "featured_authors": [{"name": "Abdelmajid El Maaroufi"}, {"name": "Mouad Ait Maskour"}, {"name": "Bouchra Maroufi"}, {"name": "Mohammed Daoud"}, {"name": "Saeed Haddadi"}], "author_count": 5}, {"id": "2609.04065", "category": "quant-ph", "title": "Small-quench Loschmidt dynamics near quantum critical points", "abstract": "We study the short-time Loschmidt dynamics after a small sudden quench near a quantum critical point. We show that the initial quadratic growth of the Loschmidt rate function is governed by the variance of the quench operator per system size. For a local quench operator, this variance density is exactly equal to the spatial sum of the equal-time connected two-point correlation function in the initial ground state. This relation connects the early-time Loschmidt response to static critical correlations. Assuming power-law correlations at criticality, we classify the finite-size scaling of the short-time coefficient by the scaling dimension of the quench operator. In one dimension, the coefficient is finite, logarithmically enhanced, or algebraically enhanced with system size. We illustrate this operator dependence in the transverse-field Ising chain, where transverse-field and longitudinal-field quenches couple to different critical operators. We also discuss the first correction beyond the quadratic regime using the fourth cumulant of the post-quench Hamiltonian.", "url": "https://arxiv.org/abs/2609.04065", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kohei Kobayashi"}], "featured_authors": [{"name": "Kohei Kobayashi"}], "author_count": 1}, {"id": "2609.04076", "category": "quant-ph", "title": "Algebraic Operator Decomposition: A Partitioned Architecture for Noise-Resilient Quantum Computing", "abstract": "We present an operator-decomposition architecture that mathematically maps a global operator into independently executable local operators, reducing the maximum quantum circuit depth at the cost of classical reconstruction and sampling overhead. By framing complex Quantum Circuits around an operator in a vector space that can be algebraically pre-decomposed, AOD complements quantum error correction and error-mitigation approaches by performing algebraic decomposition before quantum execution. Our approach leans in the computer science definition of a Monoid: a design pattern and mathematical concept consisting of a data type, a combining function that is associative, and a safe identity (neutral) element that does not change other values when combined. Simulation wise we define a MapReduce programming model where the addition (+) is the reducer, thus leveraging a naturally stable commutative monoid which carries zero \"negative-probability tax\" or phase conflicts. Furthermore, we define a Vector Space of Linear Operators over Additive Abelian Groups that benefit from this paradigm, including: Inner Products, Series expansions, Traces and Convolutions. Finally, we present the mathematical foundations and simulation results for this paradigm.", "url": "https://arxiv.org/abs/2609.04076", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wladimir Silva"}], "featured_authors": [{"name": "Wladimir Silva"}], "author_count": 1}, {"id": "2609.04104", "category": "quant-ph", "title": "Gravitationally Induced Entanglement Across an Event Horizon", "abstract": "It has long been assumed that a particle---having crossed a black hole event horizon unentangled with another particle in the exterior universe---can no longer dynamically entangle with that particle. Here, we demonstrate within a gravitational retarded-potential model that entanglement can in fact be created from scratch between freely falling spatial superpositions across an event horizon. Yet, extracting this state radially requires non-inertial deceleration, triggering soft-graviton bremsstrahlung, and establishing a strict dephasing bound in terms of entangling phase, $\\Gamma\\ge\\frac{729}{160\\pi}\\Phi$. This decoheres the entangled state. By contrast, equivalent macroscopic optical masses allow local tangential harvesting of entanglement via quantum erasure, thus revealing a remarkable geometric duality: Spacetime irreversibly degrades entanglement the moment the localized mass is dragged away from the horizon, while allowing the transverse teleportation of its entangled state to infinity.", "url": "https://arxiv.org/abs/2609.04104", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hatim Salih"}], "featured_authors": [{"name": "Hatim Salih"}], "author_count": 1}, {"id": "2609.04119", "category": "quant-ph", "title": "Non-local Magic: closed-form solution and equivalence with magic of purification", "abstract": "Non-local magic quantifies the non-stabilizerness of a bipartite quantum state that cannot be removed by local unitary transformations. Despite its natural definition, its evaluation generally requires a difficult optimization over local unitaries. Here, we show that for the log-stabilizer fidelity this optimization admits an exact closed-form analytic solution depending only on the Schmidt spectrum. We then introduce the magic of purification, defined as the minimum pure-state magic over all purifications of a mixed state, and show that it naturally induces a resource theory whose free states are normalized stabilizer-code projectors. For the log-stabilizer fidelity, the magic of purification admits a distance-based formulation in terms of the Uhlmann fidelity. Remarkably, we prove that non-local magic coincides with the minimum magic of purification along the unitary orbit of the reduced density operator. Our results provide both an efficient analytical characterization and a mixed-state resource-theoretic interpretation of non-local magic.", "url": "https://arxiv.org/abs/2609.04119", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Michele Viscardi"}, {"name": "Lorenzo Leone"}, {"name": "Alioscia Hamma"}], "featured_authors": [{"name": "Michele Viscardi"}, {"name": "Lorenzo Leone"}, {"name": "Alioscia Hamma"}], "author_count": 3}, {"id": "2609.04160", "category": "quant-ph", "title": "Vanilla Exact Synthesis of CNOT Circuits is NP-hard", "abstract": "Exact CNOT synthesis asks for a minimum-size CNOT circuit implementing an invertible linear transformation. Although several related synthesis models have been shown to be computationally hard, their hardness proofs rely on additional structure such as restricted qubit connectivity, encoded inputs, or unrestricted intermediate variables. The complexity of the most basic setting---identity input, a fixed number of labelled qubits, no ancillas, and all-to-all CNOT connectivity---had remained unresolved. In this work, we prove that the decision version of this vanilla exact CNOT synthesis problem is NP-complete, and consequently that its optimization version is NP-hard. Our proof gives a polynomial-time reduction from the Hamiltonian-path problem on grid graphs in two steps. First, we isometrically embed the grid graph into a hypercube via a unary encoding map. We then encode this hypercube Hamiltonian path problem into vanilla exact CNOT synthesis. The main challenge is that CNOT synthesis specifies only the final parity matrix and cannot directly enforce the intermediate vertex visits required by a Hamiltonian path. To overcome this difficulty, we introduce extra recorder qubits that encode the required intermediate vertex visits into the final transformation, forcing any CNOT circuit implementation to realize the intended path structure. Beyond CNOT synthesis, our result directly implies hardness for several related problems, including the shortest word problem over $\\mathrm{GL}(n,2)$, distance computation on Cayley graphs over $\\mathrm{GL}(n,2)$, minimization of sequential XOR programs, and exact synthesis of phase polynomial circuits.", "url": "https://arxiv.org/abs/2609.04160", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chenjian Li"}, {"name": "Ji Guan"}], "featured_authors": [{"name": "Chenjian Li"}, {"name": "Ji Guan"}], "author_count": 2}, {"id": "2609.04165", "category": "quant-ph", "title": "Parameterised graph theory for tensor networks: entanglement rerouting, structural simplification, and agnostic tomography", "abstract": "Parameterised graph theory studies how the complexity of graph-theoretic problems depends on structural parameters of the input graph. This perspective has proved useful in analysing tensor-network simulation (Markov and Shi, 2008). Its implications for tensor-network representations and tomography are less well understood. In particular, which graph parameters determine whether a tensor-network state (TNS) admits a tractable matrix product state (MPS) or tree tensor network (TTN) representation, and which control the complexity of learning the state? We address these questions using parameterised graph theory. First, we show that cutwidth and tree-cutwidth bound the bond dimension overhead required to represent a TNS as an MPS or TTN. In the TTN case, tree-cutwidth also bounds the local dimension of the grouped subsystems. The proofs are based on entanglement rerouting, a tensor-network analogue of rerouting information in a classical network. Second, we derive graph-dependent upper bounds on the sample and computational complexity of realisable TNS tomography, with exponents that depend on cutwidth, tree-cutwidth, and a new graph parameter, learning complexity, which we bound in terms of degree and treewidth. We obtain these results by extending the disentangling MPS learner of (Cramer et al., 2010), as analysed further in (Bakshi et al., 2025; Lin et al., 2025), to TTNs and to tensor networks on arbitrary known graphs. Finally, we extend the framework beyond the realisable setting. For an arbitrary input state, our agnostic learner outputs a pure state whose fidelity is within additive error $\\epsilon$ of the optimum over tensor-network states on the given graph with a given bond dimension, with explicit graph-dependent bounds on sample and computational complexity.", "url": "https://arxiv.org/abs/2609.04165", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthias C. Caro"}, {"name": "Natalie McHugh"}, {"name": "Sergii Strelchuk"}], "featured_authors": [{"name": "Matthias C. Caro"}, {"name": "Natalie McHugh"}, {"name": "Sergii Strelchuk"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
