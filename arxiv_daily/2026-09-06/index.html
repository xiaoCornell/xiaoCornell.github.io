  <script>
    const papers = [{"id": "2609.02934", "category": "cond-mat", "title": "Classical dipolar Heisenberg models on the Archimedean and Laves lattices", "abstract": "We study classical Heisenberg spins interacting through the dipole--dipole interaction on the eleven Archimedean and eight Laves planar lattices at canonical geometry, which reduce to fifteen distinct vertex sets. For each lattice we compute the Fourier-space interaction matrix $\\Am(\\bk)$, extract the Luttinger--Tisza ordering wave vector $\\bk_{0}$, determine the classical ground state by unconstrained minimization on the commensurate magnetic cell, and evaluate the linearized spin-wave dispersion $\\varepsilon_{i}(\\bk)$ along the high-symmetry path of the (magnetic) Brillouin zone together with the Holstein--Primakoff moment reduction. The ground states fall into three classes: five are collinear, two are non-collinear at angles commensurate with the lattice symmetry, and eight cant at transcendental angles, which we determine to thirty digits. Across the family, failure of the Luttinger--Tisza strong condition coincides exactly with the appearance of incommensurate canting, with no exceptions in either direction. Truncating the interaction range shows that whether a lattice cants is fixed by the local coordination geometry, whereas the value of the canting angle is set by the long-range tail. The quantum corrections are governed by the magnon spectrum through the size of the magnetic basis and are uncorrelated with frustration, so that the frustration and fluctuation classifications are independent; the corner-sharing lattices host the narrowest low-energy branches. The results constitute a spectral atlas of dipolar Heisenberg systems on the full family of $1$-uniform planar tilings and their duals, and provide predictions for inelastic neutron scattering in materials whose magnetic ions occupy Archimedean or Laves lattices, and for artificial arrays of dipolar-coupled nanomagnets.", "url": "https://arxiv.org/abs/2609.02934", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Josep Batle"}], "featured_authors": [{"name": "Josep Batle"}], "author_count": 1}, {"id": "2609.02936", "category": "cond-mat", "title": "Dipolar order across Bravais lattice space: classification, spin waves, and a four-attractor phase diagram", "abstract": "Every crystal is a Bravais lattice decorated by a basis, so the dipolar ordering of the fourteen Bravais lattices is the natural starting point for any systematic theory of dipolar magnetism in three dimensions. We determine it here in a single common framework: the interaction tensor is Ewald-summed, the classical ground state is obtained by minimising the lowest Luttinger--Tisza band over the entire Brillouin zone, and the linear spin-wave spectrum with its zero-point corrections is computed for every lattice whose order is collinear. Three results emerge that are not properties of individual lattices but of the landscape. First, two structural principles --- the exact tracelessness of the dipolar tensor in three dimensions, and its identical vanishing at $\\mathbf k=0$ for every cubic-symmetric lattice --- explain the ordering type, the absence of first-order cubic anisotropy, and the systematics of the zero-point moment reduction. Second, exactly one lattice defeats the Luttinger--Tisza construction: for face-centred orthorhombic the optimal eigenvector is not circular, the single-$\\mathbf k$ state is a spin-density wave of non-constant length, and the tabulated energy is a strict lower bound; direct supercell minimisation gives the true ground state. Third, optimising each family over its free metric parameters collapses the whole of Bravais space onto only \\emph{four} attractors, with body-centred tetragonal the global optimum and a single interior optimum at rhombohedral $\\alpha=62.42^\\circ$ lying below face-centred cubic. Three independent published benchmarks are reproduced.", "url": "https://arxiv.org/abs/2609.02936", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Josep Batle"}], "featured_authors": [{"name": "Josep Batle"}], "author_count": 1}, {"id": "2609.02946", "category": "cond-mat", "title": "A Unified Description of Dirac-Cone Anisotropies in Two Dimensions", "abstract": "Anisotropies in two-dimensional materials are responsible for a variety of effects that significantly modify their physical properties. In this paper, we present a covariant modification of the Dirac equation that incorporates anisotropies into the effective low-energy description around the Dirac point. The model is constructed by analogy with a Lorentz-violating extension of the Standard Model of elementary particles and yields a (2+1)-dimensional framework describing physical effects such as shifted, tilted, and distorted Dirac cones through its free parameters. The proposed model thus provides a general and unified framework in which distinct anisotropy-induced modifications of the Dirac spectrum and their combinations can be systematically characterized. We further apply the model to strained graphene and show that its effective parameters can be quantitatively extracted from first-principles electronic band structures while retaining a direct geometrical interpretation. These results establish a connection between the microscopic electronic structure and a material-independent effective description of anisotropic two-dimensional Dirac systems.", "url": "https://arxiv.org/abs/2609.02946", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "L. C. T. Brito"}, {"name": "Cleverson Filgueiras"}, {"name": "D. M. Lopes"}, {"name": "A. G. Martins"}, {"name": "Igor S. S. de Oliveira"}], "featured_authors": [{"name": "L. C. T. Brito"}, {"name": "Cleverson Filgueiras"}, {"name": "D. M. Lopes"}, {"name": "A. G. Martins"}, {"name": "Igor S. S. de Oliveira"}], "author_count": 5}, {"id": "2609.02948", "category": "cond-mat", "title": "FrOGS: Discrete Neural Sampler for Independent Alloy Configurations Across Chemical Conditions", "abstract": "Predicting the thermodynamic properties of an alloy requires sampling its configurations across many chemical conditions and recovering free energies on a common absolute scale. Markov chain Monte Carlo (MCMC) is the standard tool, but it requires separate simulations at different conditions, and auxiliary free-energy methods such as thermodynamic integration are used to place results on a common absolute scale. Modern discrete neural samplers typically use reverse KL divergence as the objective and can be mode-seeking or biased. We present Free energy Offering Generative Sampler (FrOGS), a hybrid discrete neural sampler that couples an autoregressive model to a continuous-time Markov chain (CTMC) to be trained jointly under a single shared loss. FrOGS draws i.i.d. configurations, returns an unbiased estimate of the partition function, and gives consistent estimates of thermodynamic observables. We train a single model across a wide range of chemical conditions to produce estimates on a common absolute free-energy scale. FrOGS matches exact finite-size results on the 2D Ising model and reference phase diagrams for AgPd and CuAu, without mode collapse. We additionally compare to SEGAL, a published autoregressive baseline, and find that only FrOGS recovers the stability range of the CuAu$_3$ phase.", "url": "https://arxiv.org/abs/2609.02948", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kyucheol Min"}, {"name": "Elyssa Hofgard"}, {"name": "Tess Smidt"}], "featured_authors": [{"name": "Kyucheol Min"}, {"name": "Elyssa Hofgard"}, {"name": "Tess Smidt"}], "author_count": 3}, {"id": "2609.02957", "category": "cond-mat", "title": "Decoherence-controlled collective criticality in a two-dimensional quantum Stag Hunt", "abstract": "Physical decoherence can preserve the microscopic strategic neutrality condition of a quantum game while changing the thermodynamic regime of the corresponding interacting population. We demonstrate this for an Eisert--Wilkens--Lewenstein (\\textit{EWL}) Stag Hunt embedded as independent nearest neighbor encounters on a square lattice. For the restricted strategies $\\mathsf{Q}=i\\mathbb{Z}$ and $\\mathsf{D}=i\\mathbb{Y}$, noisy two-player payoff matrices are determined for phase damping, depolarization, and amplitude damping and mapped exactly to channel dependent Ising parameters $\\mathfrak{J}(\\Gamma,p)$ and $\\mathfrak{H}(\\Gamma,p)$. Phase damping and depolarization show the clearest contrast: they share the same microscopic neutrality branch $\\mathfrak{H}=0$, while only depolarization suppresses the interaction as $(1-p)^2$. At $\\beta=1$, this produces an exact depolarization-driven square-lattice critical point at $p_{*}\\approx 0.233460\\ldots$, whereas phase damping remains in the ordered coexistence regime along the same neutrality branch. Monte Carlo finite size scaling is consistent with two-dimensional Ising criticality and distinguishes field driven coexistence below $p_{*}$ from a smooth crossover above it. Amplitude damping additionally reveals a strong dependence on channel placement: the post-strategy neutrality branch reaches $\\Gamma=0$ at $p=1/3$ and then disappears. Resource negativity further shows that microscopic two-qubit entanglement and collective interaction strength are distinct quantities. The resulting extended lattice remains an ordinary classical Ising system.", "url": "https://arxiv.org/abs/2609.02957", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rajdeep Tah"}], "featured_authors": [{"name": "Rajdeep Tah"}], "author_count": 1}, {"id": "2609.02968", "category": "cond-mat", "title": "Battery open-circuit voltage is not purely chemical", "abstract": "Open-circuit-voltage (OCV) curves are commonly treated as intrinsic chemical properties of electrode materials. However, this view is incomplete. In ion-insertion batteries, OCV also depends on mechanical state and microstructure. Using finite-element simulations and asymptotic analysis, we show that particle swelling and external loads promote particle--particle contact that generates compressive stresses, shifting the inserted-ion chemical potential. The OCV correction is nonlinear, follows Hertzian contact scaling, and depends on particle arrangement. Identical materials can therefore exhibit different OCV curves in different electrode microstructures. Furthermore, in full cells, electrodes are mechanically coupled through the common stack stress. Thus, cell OCV is a chemo-mechanical property of the entire battery architecture, not chemistry alone.", "url": "https://arxiv.org/abs/2609.02968", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrea Giudici"}, {"name": "Christoph Pohl"}, {"name": "Alberto Salvadori"}, {"name": "Colin Please"}, {"name": "Manuel Landstorfer"}, {"name": "Jon Chapman"}], "featured_authors": [{"name": "Andrea Giudici"}, {"name": "Christoph Pohl"}, {"name": "Alberto Salvadori"}, {"name": "Colin Please"}, {"name": "Manuel Landstorfer"}, {"name": "Jon Chapman"}], "author_count": 6}, {"id": "2609.02979", "category": "cond-mat", "title": "IDMate: Window-resolved self-consistent-field proposal screening with finite-temperature response bounds", "abstract": "We introduce IDMate, a Kohn--Sham framework for screening approximate self-consistent-field (SCF) states with a finite-temperature response bound and deterministic reference-map recovery. A charge-neutral factorization separates electronic conditioning from mixer amplification, while fixed-point-preserving rank-one interventions test their roles in the linearized dynamics. For a fixed Hamiltonian, exact electron number, and temperature, strong convexity of the Mermin free-energy functional yields an a posteriori density-matrix bound in a selected spectral window. Across $3{,}586$ stress trials, $1{,}942$ proposals were accepted and none exceeded the window criterion. Under trial independence, the one-sided $95\\%$ zero-event upper bound is $8.4\\times10^{-4}$; treating the 70 correlated ladders as independent units gives $4.2\\times10^{-2}$ per ladder. In three reference configurations, the integrated screening rule replaced ten reference-map evaluations, reproduced the reference-scoring trajectories, and satisfied every terminal comparison criterion. Window and full-space deviations differ by six to eleven orders of magnitude; full-space distance classifies the window decisions with a descriptive pooled AUC of $0.694$ (row-bootstrap $95\\%$ interval $[0.544,\\,0.831]$). A predefined cross-lineage work model does not meet its acceptance criterion, and serial proposal construction makes the production implementation $7.87$ times as costly under the predefined charged-cost accounting as its all-reference counterfactual. IDMate establishes a rigorous exact-trace window bound, a tested accept-or-recover rule, and explicit full-space and implementation targets for net acceleration.", "url": "https://arxiv.org/abs/2609.02979", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Peng Kang"}, {"name": "Da Wan"}, {"name": "Shulin Bai"}, {"name": "Zhen Li"}, {"name": "Yu Liu"}, {"name": "Lei Zheng"}, {"name": "Li-Dong Zhao"}, {"name": "Huibin Xu"}], "featured_authors": [{"name": "Peng Kang"}, {"name": "Da Wan"}, {"name": "Shulin Bai"}, {"name": "Lei Zheng"}, {"name": "Li-Dong Zhao"}, {"name": "Huibin Xu"}], "author_count": 8}, {"id": "2609.03018", "category": "cond-mat", "title": "Microscopically exact transport equation for the quantum Calogero model", "abstract": "We derive an exact transport equation for the quantum Calogero model, i.e. inverse-square interacting bosons on a line, from microscopic first principles.", "url": "https://arxiv.org/abs/2609.03018", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vir B. Bulchandani"}, {"name": "Fabian H. L. Essler"}], "featured_authors": [{"name": "Vir B. Bulchandani"}, {"name": "Fabian H. L. Essler"}], "author_count": 2}, {"id": "2609.03075", "category": "cond-mat", "title": "Orbital current rectifier and linear magnon Edelstein effect in $p$-wave antialtermagnets", "abstract": "We show that $p$-wave magnets efficiently generate magnetization via a linear thermal Edelstein effect arising from the orbital magnetic moments of their magnons. Furthermore, they can generate perfectly nonreciprocal orbital currents through a purely even-order nonlinear response. This makes them promising candidates for orbital-current rectification. Because these transport phenomena originate from the orbital magnetic moment of magnons, they connect magnonics and orbitronics. More generally, we find that odd-parity-wave magnets with coplanar ground states host magnons with zero spin magnetic moment. Instead the magnons carry a collinear, out-of-plane orbital magnetic moment, realizing an orbital version of antialtermagnetism. We establish these general results using symmetry arguments and demonstrate them explicitly for a coplanar ground state with the minimal number of sublattices, inspired by the ground state of CeNiAsO. Our conclusions hold both in absence and presence of spin-orbit coupling.", "url": "https://arxiv.org/abs/2609.03075", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kristian Mæland"}, {"name": "Björn Trauzettel"}], "featured_authors": [{"name": "Kristian Mæland"}, {"name": "Björn Trauzettel"}], "author_count": 2}, {"id": "2609.03110", "category": "cond-mat", "title": "Critical scaling and soft granular rheology of frictionless non-Brownian suspensions across jamming", "abstract": "We carry out 3D computer simulations to study suspension rheology across the jamming transition for deformable non-Brownian frictionless particles. The simulations are carried out at constant shear rates and suspension densities ($\\dot{\\gamma} , \\phi$), for polydisperse spherical particles. The suspension is probed at densities in the neighbourhood of the jamming point $\\phi_c$ , as well as across much wider density ranges. We carry out critical scaling analysis of our close-to-jamming data and confirm that shear-driven jamming is a second-order critical phenomenon requiring strong corrections on shear. We build maps of the local strain rate exponent to classify flow regimes and examine the effect of the corrections on the suspension rheology. Further, using the critical scaling jamming density, we carry out soft granular rheological scaling over the wider density range, demonstrating an excellent data collapse. The soft granular rheology relations are able to predict our data over almost the entire dynamical and density range.", "url": "https://arxiv.org/abs/2609.03110", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rohan Vernekar"}, {"name": "Romain Mari"}, {"name": "Bruno Chareyre"}, {"name": "Hugues Bodiguel"}], "featured_authors": [{"name": "Rohan Vernekar"}, {"name": "Romain Mari"}, {"name": "Bruno Chareyre"}, {"name": "Hugues Bodiguel"}], "author_count": 4}, {"id": "2609.03111", "category": "cond-mat", "title": "Large deviations for linear regressions", "abstract": "Linear regression is one of the simplest and most widely used tools to learn patterns from data: it fits a set of coefficients so that a linear combination of predictors best matches observed responses. The quality of the fit is measured by the residual sum of squares, the total squared mismatch between predictions and data, whose minimum defines the training loss. We consider Gaussian design and noise, with teacher coefficients independently drawn from a general distribution $p(\\beta)$, and a general class of separable regularizers, including Ridge and Lasso. Using the zero-temperature replica method, we compute analytically the large-deviation statistics of the minimum training loss for large numbers $P$ of predictors and $N$ of observations, with $r=P/N$ fixed. The rate function we compute governs rare sample-to-sample fluctuations of the optimal loss. Extensive numerical simulations are in excellent agreement with our theory and clearly show a pronounced deviation from the Gaussian regime of typical fluctuations in the tails.", "url": "https://arxiv.org/abs/2609.03111", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Silvia Bartolucci"}, {"name": "Fabio Caccioli"}, {"name": "Francesco Caravelli"}, {"name": "Pierpaolo Vivo"}], "featured_authors": [{"name": "Silvia Bartolucci"}, {"name": "Fabio Caccioli"}, {"name": "Francesco Caravelli"}, {"name": "Pierpaolo Vivo"}], "author_count": 4}, {"id": "2609.03123", "category": "cond-mat", "title": "Death by mutants: unusual multicritical dynamics in a two-species model for absorbing state transitions", "abstract": "We explore the phases and active-to-absorbing state phase transitions (AAPT) in a two-species model, where the species A and its mutant B are {\\em asymmetrically} or {\\em nonreciprocally} coupled. We identify a multicritical point that connects the global absorbing state of both the species and its mutant, with a uniform active state. The critical dynamics at this multicritical point is studied within the lowest order perturbation theory. This asymmetric coupling between species A and mutant B leads to unequal and distinct upper critical dimensions $d_c^A$ and $d_c^B$ respectively for A and B dynamics. We show that the multicritical point in this model is characterised by an unusual breakdown of scale-invariance by fluctuation-induced logarithmic modulations with power law behaviour of the order parameter and correlation lengths of the species A at all dimensions $d<d_c^A$. Above $d_c^A$, conventional scale-invariance is restored. The dynamics of the mutant species B belongs to the DP universality class with an upper critical dimension of $d_c^B=4$", "url": "https://arxiv.org/abs/2609.03123", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Astik Haldar"}, {"name": "Abhik Basu"}], "featured_authors": [{"name": "Astik Haldar"}, {"name": "Abhik Basu"}], "author_count": 2}, {"id": "2609.03173", "category": "cond-mat", "title": "Topological Boundary States and the Edge Chain in Semi-Infinite Two-Dimensional Insulators", "abstract": "We show that it is possible to compute the adiabatically protected edge and corner states of semi-infinite, two-dimensional, topological insulators by considering the first layer of lattice sites, what we call the \"edge chain,\" independently from the bulk. We start by accepting this claim as an ansatz, then, using the Shemesh theorem, we show that the edge states one finds using our procedure are adiabatically protected, provided we restrict ourselves to adiabatic evolutions that do not break chiral symmetry. We show explicit examples of our method in a 2D extension of the SSH model, the SSH3 model, the Haldane model and the Breathing Kagome Lattice.", "url": "https://arxiv.org/abs/2609.03173", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ilya Iakoub"}, {"name": "Nicolas Levasseur"}, {"name": "Richard MacKenzie"}], "featured_authors": [{"name": "Ilya Iakoub"}, {"name": "Nicolas Levasseur"}, {"name": "Richard MacKenzie"}], "author_count": 3}, {"id": "2609.03179", "category": "cond-mat", "title": "Accelerating stochastic processes through nonequilibrium driving: Thermodynamic constraints on the maximum speed-up", "abstract": "We derive a new set of bounds controlling the speed-up of the survival rate of trajectory-dependent observables induced by the application of a perturbation. Via the study of survival probabilities in two different contexts, continuous-time Markov jump processes and overdamped diffusions, we obtain different fashions of the bound on the achievable boost. These bounds, obtained by a nonlinear response theory of constrained path probabilities, are explicitly linked to thermodynamics. For arbitrary time-dependent survival rates, we find a linear bound that depends on both the perturbation strength and the entropy production rate prior to the perturbation. For rare processes characterized by a constant survival rate, the bound is exponential and is determined by the excess heat generated by the perturbation. We exemplify the inequalities on two prototypical model systems, namely, a unicyclic network and forced diffusion in a bistable potential.", "url": "https://arxiv.org/abs/2609.03179", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Davide Santolin"}, {"name": "Gianmaria Falasco"}], "featured_authors": [{"name": "Davide Santolin"}, {"name": "Gianmaria Falasco"}], "author_count": 2}, {"id": "2609.03193", "category": "cond-mat", "title": "Generative Nested Sampling of Atomistic Thermodynamic Landscapes", "abstract": "Nested sampling (NS) resolves the thermodynamics of an atomistic system from a single simulation, but its practical reach is limited by the Markov-chain updates needed to decorrelate walkers within each likelihood-constrained ensemble. Flow-based NS has removed this bottleneck for gravitational-wave (GW) inference, yet its transfer to atomistic systems is not merely a change of application. Comparing a GW150914-like binary-black-hole likelihood with an eight-particle two-dimensional Lennard-Jones (LJ) system of comparable dimensionality, we show that the two landscapes differ fundamentally: atomistic multimodality is discrete and combinatorial, generated by particle permutations separated by hard collision walls, and its coordinate coupling is dense and collective, whereas the GW posterior exhibits smooth degeneracies and localized parameter coupling. Guided by this diagnosis, we introduce NS-Flows: a single conditional normalizing flow, conditioned on the NS energy bound and trained on a sliding window of recent live sets, that replaces MCMC by direct parallel draws corrected by importance-weighted rejection resampling. Live sets supply data self-consistently, allowing flow training without structured priors or a pre-existing dataset. For LJ disks in PBC, the algorithm reduces energy evaluations by over two orders of magnitude and wall-clock time by roughly one third, an advantage that becomes increasingly favorable as the cost of the potential grows. The flow's generation efficiency further acts as a physical diagnostic: it varies non-monotonically along the annealing trajectory, is lowest in the dense disordered regime, and is quantitatively captured by the constrained ensemble's internal mode complexity together with target drift across the training window, identifying liquid-like ensembles, rather than prior-target separation, as the hard case for current flow architectures.", "url": "https://arxiv.org/abs/2609.03193", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alessandro Coretti"}, {"name": "Nico Unglert"}, {"name": "Sebastian Falkner"}, {"name": "Georg K. H. Madsen"}, {"name": "Christoph Dellago"}], "featured_authors": [{"name": "Alessandro Coretti"}, {"name": "Nico Unglert"}, {"name": "Sebastian Falkner"}, {"name": "Georg K. H. Madsen"}, {"name": "Christoph Dellago"}], "author_count": 5}, {"id": "2609.03217", "category": "cond-mat", "title": "Optimal Control of Periodic Nonequilibrium Mechanochemical Systems via Automatic Differentiation", "abstract": "Biological molecular machines are mesoscopic systems that act repeatedly and periodically to perform important cellular tasks while contending with strong fluctuations and operating in an overdamped regime. Optimal control theory is a tool that can be used to understand the design principles behind efficient operation of these machines; however, most studies on optimal control of classical mesoscopic systems have focused on control problems that do not repeat periodically. Here, we automatically differentiate Fokker-Planck simulations to design efficient nonequilibrium control strategies for simple models of periodic molecular machines with and without explicit changes in the machine's chemical state. The designed protocols and theoretical analysis provide insight into the design principles governing efficient driving in these nonequilibrium systems. Designed control protocols should seek to reduce mechanical heat by rotating the entire angular probability distribution at a constant speed without changing its shape, and should reduce chemical heat by reducing the proportion of chemical transitions with large heat.", "url": "https://arxiv.org/abs/2609.03217", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "W. Callum Wareham"}, {"name": "David A. Sivak"}], "featured_authors": [{"name": "W. Callum Wareham"}, {"name": "David A. Sivak"}], "author_count": 2}, {"id": "2609.03223", "category": "cond-mat", "title": "A Strategy Toward Room Temperature Topological Hall Effect via Local Moment Magnetism", "abstract": "Topological spin textures in local moment systems hold great promise for technological applications due to their large magnetic moments, strong spin-orbit coupling (SOC), and high tunability. Finding new spin textures that are stable near room temperature is paramount to maximizing their potential for applications. Here, we provide a strategy for realizing topological spin textures at high temperatures by identifying rare earth ($R$) magnets ordering at or near room temperature. We demonstrate the feasibility of this strategy in one of these magnets, hexagonal Gd$_5$Pb$_3$, which orders at $T_C$ = 285 K. The indication for topological spin textures comes from topological Hall effect (THE), which, in Gd$_5$Pb$_3$, occurs between $T$ = 100 - 200 K, an order of magnitude higher temperature than in other reported $R$-based systems. Our results present an opportunity to explore the role of SOC, anisotropic exchange, geometric frustration, and magnetic interactions in stabilizing topological spin textures, and provide a pathway toward realizing them near room temperature in $R$-based magnets.", "url": "https://arxiv.org/abs/2609.03223", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Karthik Rao"}, {"name": "Kevin Allen"}, {"name": "Yuxiang Gao"}, {"name": "Arushi"}, {"name": "Sanu Mishra"}, {"name": "Birender Singh"}, {"name": "Kenneth S. Burch"}, {"name": "Liangzi Deng"}, {"name": "Shanta R. Saha"}, {"name": "Johnpierre Paglione"}, {"name": "Minseong Lee"}, {"name": "Vivien Zapf"}, {"name": "Emilia Morosan"}], "featured_authors": [{"name": "Karthik Rao"}, {"name": "Kevin Allen"}, {"name": "Yuxiang Gao"}, {"name": "Minseong Lee"}, {"name": "Vivien Zapf"}, {"name": "Emilia Morosan"}], "author_count": 13}, {"id": "2609.03289", "category": "cond-mat", "title": "Symmetry-breaking line defects embedded to a 3D $O(N)$ critical bulk", "abstract": "While spontaneous breaking of a discrete symmetry in one-dimensional classical systems with short-range interactions is absent, it is expected that a line defect embedded in a bulk criticality exhibits a stable discrete symmetry spontaneous breaking. Here, we investigate the behavior of a pinning-field line defect immersed in a 3D bulk that remains tuned to the $O(N)$ Wilson-Fisher critical point. Employing the fuzzy sphere technique, we provide convincing evidence of the existence of stable defect conformal fixed points, and we demonstrate their renormalization group stability by showing no relevant operator and less effective degrees of freedom than that at bulk fixed point via $g$-function. Moreover, we investigate the defect domain wall operator for various $N$, and we identify that it becomes irrelevance for $N\\gtrsim 3$ but it is relevant for $N<3$.These evidence indicate that a one-dimensional defect coupled to a critical bulk cannot support a stable symmetry spontaneously broken defect fixed point due to domain wall proliferation for $N<3$ Wilson-Fisher universality, while in the case of $N \\gtrsim 3$ a symmetry broken defect is possible.", "url": "https://arxiv.org/abs/2609.03289", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shuai Yang"}, {"name": "Liang-dong Hu"}, {"name": "Yan Chen"}, {"name": "W. Zhu"}], "featured_authors": [{"name": "Shuai Yang"}, {"name": "Liang-dong Hu"}, {"name": "Yan Chen"}, {"name": "W. Zhu"}], "author_count": 4}, {"id": "2609.03307", "category": "cond-mat", "title": "Grain boundary evolution in nanoparticles", "abstract": "Grain boundary evolution is a key dynamical process that enables structural rearrangements in nanoparticles and drives them towards low energy configurations. Grain boundaries can also enhance catalytic properties, making it important to understand the elementary processes underlying their evolution for grain boundary engineering in nanoparticles. Compared with bulk materials, nanoparticles have additional rotational and translational degrees of freedom, can accommodate structural changes through shape relaxation, and grain boundaries terminate at free surfaces. However, the atomic-scale mechanisms of GB evolution under these less constrained conditions remain comparatively less understood than in bulk materials. Here, using atomistic simulations, we focus on low energy $\\Sigma3$ (coherent twin boundary) and $\\Sigma11$ grain boundaries, which are among the persistent compact GB structures that emerge during nanoparticle structural evolution. We identify two fundamental atomic displacements, column shift (C) and screw shift (S), that recur during the evolution of these grain boundaries and their junctions. These displacements occur through different atomic pathways and combine in different ways to generate grain boundary migration, structural transformations, and junction evolution. In particular, the same initial and final grain boundary configurations can be connected through different atomic pathways, and a column shift can occur either as a full shift or through disconnection kinks. C and S remain identifiable even when the grain boundary character changes, for example during a $\\Sigma11$ to $\\Sigma3$ transformation. An understanding of these elementary GB processes can help identify strategies to control grain boundary evolution and thereby engineer GB structures in nanoparticles.", "url": "https://arxiv.org/abs/2609.03307", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Manoj Settem"}, {"name": "Pranav Kumar"}, {"name": "Ajeet K. Srivastav"}], "featured_authors": [{"name": "Manoj Settem"}, {"name": "Pranav Kumar"}, {"name": "Ajeet K. Srivastav"}], "author_count": 3}, {"id": "2609.03388", "category": "cond-mat", "title": "Doping dependence of local moments in infinite layer nickelates", "abstract": "The infinite layer nickelates are notable for their lack of long-range antiferromagnetic ordering, in contrast to the parent compounds of the superconducting cuprates. Instead, the nickelates show evidence of short-range glassy behavior in both the undoped and optimally-doped regimes, implying that local electronic moments exist independent of superconductivity. However, the systematic doping-dependent magnetic behavior is not yet fully resolved, and characterizing it could uncover the relationship between local moments and the superconducting dome. In this work, we use muon spin rotation ($\\mu$SR) on a (La,Sr)NiO$_2$ doping series from the undoped parent compound, through the superconducting dome, to the over-doped normal state (Sr substitution 0% $\\leq$ x $\\leq$ 25%) to probe the magnetic ground state and the temperature-dependent static and dynamic behavior. We find that local moments experience spin freezing into a glassy state at temperatures on the order of a few tens of kelvin regardless of the doping level. We also observe a subtle destabilization of the glassy state with increased hole doping. These observations suggest that magnetism and superconductivity are largely decoupled phenomena with indirect interactions described in a multi-orbital framework.", "url": "https://arxiv.org/abs/2609.03388", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Martin Gonzalez"}, {"name": "Andreas Suter"}, {"name": "Michal Kiaba"}, {"name": "Thomas Prokscha"}, {"name": "Zaher Salman"}, {"name": "Marc Gabay"}, {"name": "Harold Y. Hwang"}, {"name": "Jennifer Fowlie"}], "featured_authors": [{"name": "Martin Gonzalez"}, {"name": "Andreas Suter"}, {"name": "Michal Kiaba"}, {"name": "Marc Gabay"}, {"name": "Harold Y. Hwang"}, {"name": "Jennifer Fowlie"}], "author_count": 8}, {"id": "2609.03465", "category": "cond-mat", "title": "Studying line defect at Deconfined Quantum Criticality via fuzzy sphere regularization", "abstract": "The interplay between bulk critical fluctuations and nontrivial topology can enrich defect physics and give rise to novel defect universality classes. Understanding the fate of such defects therefore constitutes an important open problem. In this work, we studied a particularly simple setting: a (0+1)-dimensional pinning-field defect coupled to a (2+1)-dimensional deconfined quantum critical bulk. Using the fuzzy-sphere regularization, we numerically investigated the defect operator spectrum and extracted several universal quantities characterizing the defect conformal fixed point, including the scaling dimensions of defect-changing(creating) operators and the defect \\(g\\)-function. These results establish the first numerical characterization of line-defect conformal data at deconfined quantum criticality and may stimulate further investigations of defect critical phenomena in topological quantum critical matter.", "url": "https://arxiv.org/abs/2609.03465", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shutao Liu"}, {"name": "Shuai Yang"}, {"name": "Jie Lou"}, {"name": "Yan Chen"}], "featured_authors": [{"name": "Shutao Liu"}, {"name": "Shuai Yang"}, {"name": "Jie Lou"}, {"name": "Yan Chen"}], "author_count": 4}, {"id": "2609.03473", "category": "cond-mat", "title": "Granular Rods Fall Faster in Denser Obstacle Fields", "abstract": "How particle shape affects transport through obstacle fields under external driving is a fundamental question in nonequilibrium physics. We simulate a dissipative rod falling under gravity through randomly placed fixed obstacles. As the obstacle density increases, the mean descent speed decreases, increases, and then decreases again before trapping. The rod can therefore fall faster in a denser obstacle field. Scaling arguments based on collision rates and rod geometry explain all three regimes, their crossovers, and the mean fall distance before trapping. These results reveal nonmonotonic driven transport arising from particle anisotropy.", "url": "https://arxiv.org/abs/2609.03473", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fumiaki Nakai"}, {"name": "Hiroaki Katsuragi"}], "featured_authors": [{"name": "Fumiaki Nakai"}, {"name": "Hiroaki Katsuragi"}], "author_count": 2}, {"id": "2609.03485", "category": "cond-mat", "title": "Such stuff as magic is made on: compact operator algebra, stabilizer polytope and the structure of reduced density matrices in a Kitaev spin liquid", "abstract": "Quantum many-body systems exhibit rich and complex behaviour. Magic has recently emerged as a powerful new diagnostic for probing such systems, complementing other key features such as many-body entanglement. Here, starting from an investigation of the onset of magic within subsystems of a larger many-body quantum system, we show that intricate structures emerge which shed important light on the underlying many-body physics. Focusing on the Kitaev honeycomb model, we first identify the temperature below which local subsystems acquire magic. Remarkably, we find that the optimal magic witnesses active at the onset of magic reveal compact operator spaces that continue to capture the local thermal states throughout their subsequent evolution. For the six-site hexagonal marginal, this connection can be made stronger: the same operator space emerges independently from the symmetries of the local marginal and forms the symmetry-resolved plaquette algebra. When these symmetries are realized exactly, the local state lies entirely within this algebra and the reduced robustness of magic is equal to the full robustness of magic. The same reduced description can also be applied to other local quantum resources, which we illustrate using genuine multipartite entanglement. Furthermore, the operator spaces possess a rich algebraic structure in the form of finite-dimensional Euclidean Jordan algebras, with a natural interpretation in terms of bond and bond-cycle operators. Our general methodology therefore show how the onset of local magic can reveal a compact, physically meaningful operator structure underlying the finite-temperature Kitaev spin liquid, and opens up a new avenue towards reduced descriptions of quantum resources in many-body systems.", "url": "https://arxiv.org/abs/2609.03485", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Snigdh Sabharwal"}, {"name": "Nic Shannon"}, {"name": "Paul Skrzypczyk"}], "featured_authors": [{"name": "Snigdh Sabharwal"}, {"name": "Nic Shannon"}, {"name": "Paul Skrzypczyk"}], "author_count": 3}, {"id": "2609.03500", "category": "cond-mat", "title": "Exact Scaling Laws and Non-Hermitian Topological Phase Transitions of Active Continuum on Hyperbolic Manifolds", "abstract": "The macroscopic collective motion of active continuum on curved manifolds is conventionally addressed through perturbative dynamic renormalization or finite-element simulations, often obscuring the underlying geometric mechanisms. Here, an exact algebraic framework is established to reformulate the active phase transition on hyperbolic spaces $\\mathbb{H}^2$. By rigorously expanding the covariant Navier-Stokes-like equations and applying the Weitzenböck identity, we derive the exact critical threshold $\\alpha_c = \\frac{5}{4}D\\kappa^2$ for macroscopic polarization, which is dictated by the geometric mass gap of the Hodge-de Rham Laplacian. We strictly define the parameter subspace $\\alpha = 2D\\kappa^2$ where the topological free energy reaches the Bogomolny-Prasad-Sommerfield (BPS) limit. This enables the reduction of the complex velocity field to Blaschke products via Möbius gauge symmetry. The flat-space limit ($\\kappa \\to 0$) exactly degenerates to the topological phase of the classical O(2) model, demonstrating that the constant negative curvature acts as an un-perturbative infrared regularization for non-linear amplitude saturation. Furthermore, mapping the non-variational active convective modes onto the defect translational zero-modes yields an intrinsically non-reciprocal interaction matrix. By analytically extending the singular integral operator of the dynamically condensed defect ring, we identify a macroscopic second-order exceptional point (EP2) characterized by a strictly algebraic dynamic scaling law $\\tau \\sim |\\Delta \\nu|^{-1/2}$. This closed-form theoretical paradigm provides exact solutions for geometric frustration and non-Hermitian topology in soft mechanics.", "url": "https://arxiv.org/abs/2609.03500", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yu-Xin Xie"}], "featured_authors": [{"name": "Yu-Xin Xie"}], "author_count": 1}, {"id": "2609.03510", "category": "cond-mat", "title": "Interplay of B-Site Off-Centering and Molecular Orientations in the Mixed Hybrid Perovskite MAGe1xSnxI3", "abstract": "B-site mixing is a common strategy for tuning properties of halide perovskites. In the lead-free system MAGe1-xSn_xI3, it brings tilting and off-centering into competition. Using large-scale molecular dynamics driven by a machine-learned interatomic potential, we map the structural behavior across the full composition range. MAGeI3 exhibits strong polar B-site off-centering that remains nearly constant up to the cubic transition, together with methylammonium (MA) orientational order that weakens progressively on heating. By contrast, MASnI3 combines octahedral tilting with weaker, predominantly antipolar off-centering. Ge-like behavior persists upon alloying and gives way to Sn-like behavior only beyond roughly 65 % Sn. In the high-temperature phases, the B-site cations remain locally off-centered but directionally disordered. On the Ge-rich side, the distorted inorganic framework biases the soft MA orientational landscape toward a restricted set of preferred directions. This coupling shows how the composition of the inorganic sublattice can tune molecular ordering in lead-free hybrid perovskites.", "url": "https://arxiv.org/abs/2609.03510", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Erik Fransson"}, {"name": "Apinya Ngoipala"}, {"name": "Oskar Öjstedt"}, {"name": "Maths Karlsson"}, {"name": "Paul Erhart"}, {"name": "Julia Wiktor"}], "featured_authors": [{"name": "Erik Fransson"}, {"name": "Apinya Ngoipala"}, {"name": "Oskar Öjstedt"}, {"name": "Maths Karlsson"}, {"name": "Paul Erhart"}, {"name": "Julia Wiktor"}], "author_count": 6}, {"id": "2609.03518", "category": "cond-mat", "title": "Orbital-Free DFT-Assisted Machine-Learned Molecular Dynamics for Electric-Field-Driven Ionic Transport", "abstract": "We propose an orbital-free density functional theory (OFDFT)-assisted machine-learned molecular dynamics method in which field-independent interatomic forces are evaluated using a machine-learned potential and atomic charges that depend on the local environment are obtained from OFDFT calculations. The atomic charges obtained by Bader partitioning of the OFDFT electron density are multiplied by the electric-field vector and added to the forces from the machine-learned potential. This approach enables molecular dynamics simulations under an electric field at a lower computational cost than Kohn-Sham DFT (KSDFT)-based molecular dynamics. As a proof of concept, the method was applied to beta-Li3PS4 bulk and an S8/Li3PS4 heterostructure under periodic boundary conditions. For Li3PS4 bulk, OFDFT yielded Li charges and a total charge of the PS4 unit consistent with those obtained using KSDFT. In the heterostructure, Li ions migrated from the Li3PS4 region into the S-rich region within a simulation time of approximately 170 ps. Accompanying this migration, the mean Bader charge of the S atoms that initially formed S8 rings changed from nearly neutral to negative. A comparison with KSDFT for a representative interfacial structure also confirmed that the negative charging of the S atoms upon the arrival of Li and the magnitude of the Li charges were qualitatively reproduced. These results demonstrate the possibility of treating field-driven ionic transport and changes in interfacial charge states using a universal machine-learned potential without training an additional material-specific charge-prediction model.", "url": "https://arxiv.org/abs/2609.03518", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yusuke Nishiya"}, {"name": "Hiroya Nakata"}, {"name": "Yosuke Harada"}, {"name": "Yu-ichiro Matsushita"}], "featured_authors": [{"name": "Yusuke Nishiya"}, {"name": "Hiroya Nakata"}, {"name": "Yosuke Harada"}, {"name": "Yu-ichiro Matsushita"}], "author_count": 4}, {"id": "2609.03555", "category": "cond-mat", "title": "Spectral Function Method and Janus Quantum Numbers in Quasiperiodic Systems", "abstract": "The absence of translational symmetry in quasiperiodic systems invalidates conventional band theory, posing the central challenge in the field. Building upon the incommensurate energy band (IEB) concept, we establish a unified spectral theory for quasiperiodic systems by introducing two key advances. First, we develop an efficient spectral function method that calculates $A(k,\\omega)$ using a small truncated Hamiltonian matrix, bypassing full diagonalization. It converges via a distinctive successive locking of energy moments, yielding exact thermodynamic-limit results without finite-size scaling. Second, we introduce that quasiperiodic eigenstates possess Janus quantum numbers: a single eigenstate, continuously tracked across localization transitions, carries dual labels in momentum and real space, which naturally reduce to the familiar Bloch momentum and band index in the commensurate limit. Together with IEB, these advances constitute a ``band theory'' for quasiperiodic systems, enabling us to define, compute, and label states with the same facility as in periodic ones.", "url": "https://arxiv.org/abs/2609.03555", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tian-Le Wu"}, {"name": "Shi-Ping Ding"}, {"name": "Miao Liang"}, {"name": "Jing-Tao Lü"}, {"name": "Jin-Hua Gao"}], "featured_authors": [{"name": "Tian-Le Wu"}, {"name": "Shi-Ping Ding"}, {"name": "Miao Liang"}, {"name": "Jing-Tao Lü"}, {"name": "Jin-Hua Gao"}], "author_count": 5}, {"id": "2609.03560", "category": "cond-mat", "title": "Sample-specific rectification-like response in a boundary-driven exclusion process", "abstract": "We investigate the current response of a boundary-driven symmetric exclusion process with quenched site disorder. Hard-core particles hop symmetrically on a one-dimensional lattice with site-dependent rates and are injected and removed at the boundaries by two reservoirs of different densities. We approximate the steady-state density profile using a Galerkin projection at linear order and a mean-field closure at higher orders, and thereby obtain the current as a nonlinear function of the reservoir density difference. At linear order in the reservoir density difference, the current-response coefficient depends on the mean reservoir density $\\rho$, in contrast to the homogeneous case. Through the linear-response relation, this dependence leads to an equilibrium current-fluctuation coefficient that is asymmetric under $\\rho\\rightarrow 1-\\rho$. Beyond linear response, nonzero even-order current contributions break the antisymmetry of the current under reversal of the reservoir density difference, producing rectification-like behavior in individual disorder realizations. We further show that spatial-reflection symmetry of the equilibrium density profile rules out such behavior, so broken spatial-reflection symmetry of the profile is a necessary condition for rectification-like behavior. Within the present approximation, we further find that, for continuously distributed site disorder, rectification-like behavior occurs arbitrarily close to equilibrium for almost every disorder realization. At the ensemble level, however, the disorder-averaged current remains antisymmetric because the disorder ensemble is invariant under spatial reflection. These results provide a mechanism for rectification-like transport arising from sample-specific spatial heterogeneity rather than from an explicitly imposed directional asymmetry.", "url": "https://arxiv.org/abs/2609.03560", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Issei Sakai"}, {"name": "Takuma Akimoto"}], "featured_authors": [{"name": "Issei Sakai"}, {"name": "Takuma Akimoto"}], "author_count": 2}, {"id": "2609.03571", "category": "cond-mat", "title": "Heterogeneous collapse in thermoresponsive copolymer microgels varying molar composition", "abstract": "Understanding the internal architecture of copolymer microgels is crucial for establishing how nanoscale polymer organization controls their stimuli-responsive behavior. Here we focus on thermoresponsive P(N-isopropylacrylamide-co-N-isopropyl-methacrylamide), P(NIPAM-co-NIPMAM), microgels with varying mole fraction of the components, synthesized via radical precipitation polymerization, and we demonstrate that changes in their volume phase transition and equilibrium swelling are governed by composition-dependent internal heterogeneity. Comparison between small-angle neutron scattering (SANS) with isotopic labeling and monomer-resolved simulations show a block-like monomer distribution of the two components. SANS analysis reveals a universal maximum in the polymer mesh correlation length near the transition, evidencing coexistence of collapsed NIPAM-rich and swollen domains. The correlation length increases with increasing NIPMAM content, with a maximum for 75 mol \\% NIPMAM, implying sparse collapsed regions within the network and thus a large degree of heterogeneity induced by the presence of an increasingly large fraction of intercalated, non-collapsing PNIPMAM. The maximum heterogeneity correlates with the equilibrium swelling ratio, indicating that collapsed microgels retain a structural memory of the transition and present a less-compliant structure in response to temperature variations. Overall, these insights highlight a complex effect of the block-like monomer distribution on the responsive properties of copolymer microgels with different compositions, thus providing a design rule for tailoring responsive colloids for functional soft materials.", "url": "https://arxiv.org/abs/2609.03571", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jacopo Vialetto"}, {"name": "Francesco Brasili"}, {"name": "Letizia Tavagnacco"}, {"name": "Gavino Bassu"}, {"name": "Elena Buratti"}, {"name": "Stephen King"}, {"name": "Emanuela Zaccarelli"}, {"name": "Marco Laurati"}], "featured_authors": [{"name": "Jacopo Vialetto"}, {"name": "Francesco Brasili"}, {"name": "Letizia Tavagnacco"}, {"name": "Stephen King"}, {"name": "Emanuela Zaccarelli"}, {"name": "Marco Laurati"}], "author_count": 8}, {"id": "2609.03576", "category": "cond-mat", "title": "SALTED: a symmetry-adapted machine-learning program for predicting electron-densities in molecules and materials", "abstract": "SALTED provides an open-source Python package for machine learning the quantum-mechanical electron density, $n(\\mathbf{r})$, in molecular and condensed-phase systems based on input atomic coordinates and species. The program adopts a linear atom-centered decomposition of the electron density, which makes it highly transferable across diverse atomistic configurations sharing similar chemical environments. Because of this representation choice, SALTED is naturally interfaced with state-of-the-art electronic-structure programs based on atomic orbitals, namely CP2K, FHI-aims, and PySCF, from which reference electron-density data can be generated and used to train a model. The learning algorithm is based on a symmetry-adapted extension of Gaussian process regression, making SALTED especially efficient in small-data regimes. Thanks to the implementation of vector-field kernel functions, SALTED can also learn the first-order response of the electron density to applied electric fields, $\\partial n(\\mathbf{r})/\\partial \\mathbf{E}$. The application of SALTED within computational workflows has already shown its utility in a wide variety of contexts, including the calculation of polarization vectors and polarizability tensors, the accurate evaluation of Coulomb forces in QM/MM molecular-dynamics simulations, and electronic-structure studies of large-scale 2D materials.", "url": "https://arxiv.org/abs/2609.03576", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zekun Lou"}, {"name": "Alan M. Lewis"}, {"name": "Théophane Bernhard"}, {"name": "Lukas Seifert"}, {"name": "Agustin Salcedo"}, {"name": "Florian Kleemiss"}, {"name": "Mariana Rossi"}, {"name": "Andrea Grisafi"}], "featured_authors": [{"name": "Zekun Lou"}, {"name": "Alan M. Lewis"}, {"name": "Théophane Bernhard"}, {"name": "Florian Kleemiss"}, {"name": "Mariana Rossi"}, {"name": "Andrea Grisafi"}], "author_count": 8}, {"id": "2609.03587", "category": "cond-mat", "title": "Charge Regulated conformational properties of polyelectrolyte near an oppositely charged nanoparticle", "abstract": "Customizing the surface characteristics and stimuli-responsive behavior of nanoparticles with polyelectrolytes ushers in a new era across many aspects of our lives, ranging from advanced diagnostics to practical applications. Here, using hybrid CR Monte Carlo/ molecular dynamics simulations, we investigate how charge regulation can play a crucial role in shaping the adsorption dynamics of polyelectrolyte (PE) on oppositely charged nanoparticle (NP). We systematically investigate the influence of salt density, and polymer chain length on the PE-NP interaction. To complement CR results, we also perform molecular simulations under constant charge conditions. At high salt concentrations, CR enhances the adsorption of PE onto the NP surface, leading to a rapid decrease in the radius of gyration of PE; conversely, CC promotes the extended conformation of PE. No clear effect of PE length is observed at either low or high salt concentrations, whereas in CC simulations, the PE relaxes faster on the NP in the case of short chains. Furthermore, By comparing these results, we demonstrate that the MSD of PE follows a more direct path during adsorption implying a ballistic motion, whereas in the CC case, it exhibits subdiffusive behavior and delayed adsorption in both low and high salt density. Our findings indicates that 'tunable CR' is a robust strategy for controlling nanoparticle stability and interaction within a complex biochemical cues.", "url": "https://arxiv.org/abs/2609.03587", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kawaljeet Kaur"}, {"name": "Rashmi Kandari"}, {"name": "Sunita Kumari"}, {"name": "Subhajit Paul"}], "featured_authors": [{"name": "Kawaljeet Kaur"}, {"name": "Rashmi Kandari"}, {"name": "Sunita Kumari"}, {"name": "Subhajit Paul"}], "author_count": 4}, {"id": "2609.03606", "category": "cond-mat", "title": "Frenkel line of Yukawa fluids within the self-consistent relaxation theory", "abstract": "For a simple model fluid, the Yukawa fluid, the condition for dynamic crossover, known as the Frenkel line, is defined. The condition is related to the fact that the roton minimum in the dispersion relation of longitudinal acoustic-like excitations exists only when the collective vibrational dynamics of particles dominates in the liquid. Based on the self-consistent relaxation theory for the Yukawa fluid, thermodynamic states are determined in which the roton minimum disappears. The obtained values of the state parameters for the Frenkel line are consistent with the results of studies in which the position of this line on the phase diagram of the Yukawa fluid was determined using molecular dynamics simulations. It is shown that the Frenkel line in this system can be determined directly from the structural characteristic -- the static structure factor. A physical interpretation of the roton minimum frequency for the simple liquids near the Frenkel line is proposed.", "url": "https://arxiv.org/abs/2609.03606", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ilnaz I. Fairushin"}, {"name": "Anatolii V. Mokshin"}], "featured_authors": [{"name": "Ilnaz I. Fairushin"}, {"name": "Anatolii V. Mokshin"}], "author_count": 2}, {"id": "2609.03618", "category": "cond-mat", "title": "Spectral properties of deterministic matrices multiplied by rotationally invariant random non-Hermitian ensembles", "abstract": "In this paper, we study spectral properties of multiplicative deformations of non-Hermitian random matrices. We consider matrices of the form $\\mathbf{A}\\mathbf{B}$, where $\\mathbf{A}$ is a deterministic $N\\times N$ matrix (not necessarily Hermitian) and $\\mathbf{B}$ is a rotationally invariant random matrix. We show that, as $N\\to\\infty$, the boundary of the complex eigenvalue distribution of $\\mathbf{A}\\mathbf{B}$ is governed by simple equations involving the $\\mathcal{R}_1$ and $\\mathcal{R}_2$ transforms of $\\mathbf{B}$.", "url": "https://arxiv.org/abs/2609.03618", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pierre Bousseyroux"}, {"name": "Marc Potters"}], "featured_authors": [{"name": "Pierre Bousseyroux"}, {"name": "Marc Potters"}], "author_count": 2}, {"id": "2609.03627", "category": "cond-mat", "title": "Pseudospectral Methods and Critical Phenomena", "abstract": "We employ pseudospectral methods to solve the homogeneous Ornstein-Zernike (OZ) equation for a model fluid in the vicinity of the critical point. Focusing on the Mean-Spherical Approximation (MSA) as a closure to the OZ equation, we obtain numerical estimates for the critical exponents $\\eta$, $\\delta$ and $\\gamma$ for a system of hard-core Yukawa particles both in two and three dimensions. The three-dimensional MSA exponents are already well-known from an analytic solution and are recovered by our numerical methods. The two-dimensional exponents are a new output of this work. The pseudospectral method allows for rapid and highly accurate solution of liquid-state integral equation theories, and enables calculations on truely infinite domains, as needed for highly correlated states. In addition, we analyse the standard Picard iteration scheme and propose a variation of it which provides increased stability and speed of convergence.", "url": "https://arxiv.org/abs/2609.03627", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jake Skelton"}, {"name": "Joseph Brader"}, {"name": "Salomée Tschopp"}, {"name": "Benjamin Goddard"}], "featured_authors": [{"name": "Jake Skelton"}, {"name": "Joseph Brader"}, {"name": "Salomée Tschopp"}, {"name": "Benjamin Goddard"}], "author_count": 4}, {"id": "2609.03656", "category": "cond-mat", "title": "Finite-temperature mass gap and quench dynamics of mobile impurities in a Fermi gas", "abstract": "Recently, a mass-gap description of mobile impurities in a Fermi gas was introduced, which connects Anderson's orthogonality catastrophe for static impurities to the quasiparticle picture of Fermi polarons through a recoil-induced energy gap in the fermionic dispersion. That description, however, was restricted to zero temperature and did not address dynamics. Here we generalize the mass-gap model to finite temperature by combining the Lee--Low--Pines transformation with a self-consistent Hartree--Fock decoupling of the recoil-induced interaction, and we study the quench dynamics within this framework using the functional-determinant approach. At finite temperature the effective mass gap obeys the self-consistency equation $\\Delta(T)=2U_F\\tanh[\\Delta(T)/4k_B T]$, with $U_F=k_F^2/2M$ and $M$ the impurity mass. This equation admits a nonzero solution below the characteristic temperature $T^*=U_F/(2k_B)$ and closes as $(T^*-T)^{1/2}$. We identify this closing as the mean-field signature of the thermal melting of the polaron and molecule quasiparticles. Computing the Ramsey response $S(t)$ after a sudden quench of the impurity--fermion interaction, we find that its long-time oscillations---quantum beats between the bound and in-gap states---disappear precisely above $T^*$. Our work ties the thermodynamic and dynamical fingerprints of polaron formation to a single temperature-dependent mean-field parameter.", "url": "https://arxiv.org/abs/2609.03656", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Baihua Gong"}], "featured_authors": [{"name": "Baihua Gong"}], "author_count": 1}, {"id": "2609.03684", "category": "cond-mat", "title": "Hidden Magnetic Octupolar Order driven by Spin-Orbit coupling in KFeF$_3$", "abstract": "Phase transitions are typically driven by symmetry-breaking structural distortions that lift electronic degeneracies, yet in some cases, these transitions may be driven by a hidden order without conventional structural signatures. Here, we demonstrate that the 3$d$ perovskite, KFeF$_3$, hosts such a hidden instability. Using a combination of high-resolution powder diffraction, magnetometry, symmetry-based analysis and first principles calculations, we reveal that while the 90 K cubic to rhombohedral transition arises from conventional magnetostriction accompanying antiferromagnetic order, a second transition at 40 K lowers the symmetry to monoclinic without any detectable Jahn-Teller distortion or translational symmetry-breaking. Symmetry-based Landau analysis supports a hidden zone centered magnetic octupole order parameter, whose improper coupling accounts for the weak ferromagnetism and pronounced symmetry-breaking strain. Density functional calculations show that spin-orbit coupling suppresses the competing Jahn-Teller instability, and thereby favors higher rank magnetic multipolar degrees of freedom. These findings establish KFeF$_3$ as a model system in which the competing energy scales between spin-orbit coupling and orbital degeneracy result in the emergence of hidden, multipolar order. We show that the control of such magnetic, multipolar order could, in principle, provide a route to induce altermagnetism.", "url": "https://arxiv.org/abs/2609.03684", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "C. A. Crawford"}, {"name": "C. I. Hiley"}, {"name": "N. C. Bristowe"}, {"name": "C. Stock"}, {"name": "J. Gainza"}, {"name": "C. Ritter"}, {"name": "M. R. Lees"}, {"name": "R. I. Walton"}, {"name": "M. S. Senn"}], "featured_authors": [{"name": "C. A. Crawford"}, {"name": "C. I. Hiley"}, {"name": "N. C. Bristowe"}, {"name": "M. R. Lees"}, {"name": "R. I. Walton"}, {"name": "M. S. Senn"}], "author_count": 9}, {"id": "2609.03708", "category": "cond-mat", "title": "Fermi-Point Topology Determines Emergent Conformal Criticality in Extended Quantum Spin Chains", "abstract": "Quantum criticality in one-dimensional quantum systems is characterized by emergent conformal field theories (CFTs), whose central charge counts independent gapless degrees of freedom. Establishing a microscopic connection between this universal conformal structure and the momentum-space topology of the underlying quasiparticle spectrum remains challenging. Here, we uncover a direct correspondence between Fermi-point topology, conformal criticality, and quantum entanglement in an extended quantum spin chain with competing cluster interactions, exchange anisotropy, and a transverse magnetic field. We show that interaction- and field-driven Lifshitz transitions generate conformal critical phases with effective central charges $c_{\\rm eff}=1/2$, $1$, $3/2$, $2$, and $3$, including a multicritical point where Ising and Luttinger-liquid sectors coexist. Importantly, the central charge is not determined simply by the number of lattice gap closings or Fermi points, but by the number and conformal content of independent low-energy continuum sectors after accounting for lattice symmetries, reciprocal-lattice identifications, and mode equivalences. Thus, Lifshitz transitions may leave the conformal anomaly unchanged or modify the central charge depending on whether spectral reconstruction generates new independent continuum sectors. Real- and momentum-space entanglement spectra provide complementary microscopic signatures, revealing both the conformal content and momentum-space organization of critical modes. Our results establish a microscopic framework linking Fermi-point topology to emergent CFTs and show how interaction-driven spectral reconstruction can generate higher-central-charge criticality and unconventional multicritical behavior.", "url": "https://arxiv.org/abs/2609.03708", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mohammad Abbasi"}, {"name": "Saeed Mahdavifar"}], "featured_authors": [{"name": "Mohammad Abbasi"}, {"name": "Saeed Mahdavifar"}], "author_count": 2}, {"id": "2609.03752", "category": "cond-mat", "title": "Real-space Floquet topology written by the orbital angular momentum of light", "abstract": "Floquet engineering usually treats light as a uniform control field that changes the topology of an entire driven material. Here we show that structured light carrying orbital angular momentum (OAM) enables a different regime, in which topology is written directly in real space. For ultrathin topological insulator films, circularly polarized Laguerre--Gaussian beams generate a radial Floquet mass whose sign changes define a topological annulus bounded by two concentric chiral ring modes. The transition is helicity selective: below a thickness-dependent critical frequency, left-circularly polarized light drives mass inversion, whereas right-circularly polarized light increases the gap and leaves the film trivial. Independently, the OAM quantum number shifts and reshapes the annulus without changing the frequency, intensity, or helicity. In the decoupled-surfaces limit, the same mechanism produces a purely Floquet-induced topological mass and a vortex-core zero mode. These results identify photon OAM as a control parameter for nonequilibrium topology and provide a route to programmable topological landscapes in quantum materials.", "url": "https://arxiv.org/abs/2609.03752", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mohammad Shafiei"}, {"name": "Milorad V. Milošević"}], "featured_authors": [{"name": "Mohammad Shafiei"}, {"name": "Milorad V. Milošević"}], "author_count": 2}, {"id": "2609.03766", "category": "cond-mat", "title": "Ground-State Phase Diagram, Higher-Winding Topology, and Lifshitz Criticality in an Anisotropic Four-Spin XX Chain", "abstract": "We investigate the quantum critical and topological properties of a spin-$1/2$ XX chain with anisotropic four-spin cluster interactions in a transverse magnetic field. The interplay of exchange anisotropy, cluster interactions, and the external field produces a rich phase diagram with multiple gapped topological phases and distinct quantum critical boundaries. We identify several Lifshitz-type transitions arising from reconstructions of the low-energy Fermi-point structure, including an unconventional multicritical point where distinct critical branches intersect and the momentum-space topology undergoes a singular reorganization. In the isotropic limit, a conventional Lifshitz transition emerges through the merging and annihilation of Fermi points, revealing distinct mechanisms of Fermi-point reconstruction within the same model. The gapped phases are characterized by quantized winding numbers $\\nu=0,\\pm1,-2,$ and $\\pm3$, with the higher-winding phases induced by the extended cluster interactions. The $\\nu=\\pm3$ phases exhibit a richer topological structure than conventional short-range Kitaev-type chains and are separated from other sectors by field- and interaction-driven gap closings. These topological distinctions are further reflected in characteristic degeneracy patterns of the lowest levels of the bulk entanglement spectrum. Our results demonstrate that anisotropic multispin interactions provide a versatile route to realizing higher-winding topological phases and unconventional multicriticality in one-dimensional quantum systems.", "url": "https://arxiv.org/abs/2609.03766", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mohammad Abbasi"}, {"name": "Faraz Valeh"}, {"name": "Saeed Mahdavifar"}], "featured_authors": [{"name": "Mohammad Abbasi"}, {"name": "Faraz Valeh"}, {"name": "Saeed Mahdavifar"}], "author_count": 3}, {"id": "2609.03772", "category": "cond-mat", "title": "Heesch Nodal Lines in Inadmissible Achiral Antiferromagnets", "abstract": "Recently, a new class of Weyl semimetals in antiferromagnets named Heesch Weyl semimetals was discovered, which have inadmissible chiral magnetic point group symmetries (inadmissible magnetic point groups are incompatible with ferromagnetic order) and distinctive surface Fermi arcs. In Heesch Weyl semimetals, the Weyl points are pinned at high symmetry momenta with two-dimensional irreducible corepresentations in the Brillouin zone. As the Weyl points are pinned, the Weyl points with opposite topological charges cannot emerge or be brought together for creation and annihilation as in conventional Weyl semimetals. In this work, we show that when mirror or rotoinversion symmetries are restored so that the point group becomes achiral, long doubly degenerate lines connecting Weyl points with opposite topological charges emerge. We call these lines the Heesch nodal lines (HNLs) and their host materials the Heesch nodal line antiferromagnets. HNLs result in a large number of two-dimensional massless Dirac cones for planes intercepting the HNLs in the Brillouin zone. Moreover, a large subset of the HNL antiferromagnets has the special property that the lowest nonvanishing order of the nonlinear anomalous Hall effect starts with the third order. First-principles calculations on representative collinear and noncollinear antiferromagnets, such as MnTe, CrSb, and Mn$_3$GaN, confirm our predictions on the presence of HNLs. When the inadmissible symmetry is broken by strain, the double degeneracy of the HNLs is lifted and the associated massless Dirac cones are gapped out, providing a route to realizing sizable anomalous Hall effects in antiferromagnetic crystals. We conclude that all inadmissible antiferromagnets without parity-time symmetry are topological. They are either Heesch Weyl antiferromagnets or Heesch nodal line antiferromagnets.", "url": "https://arxiv.org/abs/2609.03772", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xing-Yao Guo"}, {"name": "Chung-Yuen Chan"}, {"name": "Zi-Ting Sun"}, {"name": "Kam Tuen Law"}], "featured_authors": [{"name": "Xing-Yao Guo"}, {"name": "Chung-Yuen Chan"}, {"name": "Zi-Ting Sun"}, {"name": "Kam Tuen Law"}], "author_count": 4}, {"id": "2609.03841", "category": "cond-mat", "title": "The Casimir free energy of peptide films on a silicon substrate: Impact of dielectric-to-metal transition in silicon and nanoparticles in peptide", "abstract": "Using the Lifshitz theory of the van der Waals and Casimir forces, we calculate the Casimir free energy of thin peptide films deposited on silicon substrates. The Casimir free energy is found as a function of film thickness for different fractions of water in the film, in the presence of either nonmagnetic or magnetic nanoparticles, and under the impact of irradiation of a silicon substrate with laser pulses or dopants resulting in the dielectric-to-metal phase transition. It is shown that for a dielectric silicon there is the borderline value of the film thickness, such that the Casimir free energy is negative and contributes to the film stability for thicker films, but is positive and makes the film less stable for thinner ones. According to our results, the borderline value of peptide film thickness decreases with increasing volume fractions of water and in the film. This decrease is more pronounced for the magnetic nanoparticles and becomes stronger with increasing their radius. The borderline value of peptide film thickness is found as a function of the fraction of water in the film. If the silicon substrate is in metallic state, the Casimir free energy of peptide coating is always positive, which makes it less stable. Possible applications of the obtained results in organic electronics and biomedicine are discussed.", "url": "https://arxiv.org/abs/2609.03841", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "G. L. Klimchitskaya"}, {"name": "V. M. Mostepanenko"}], "featured_authors": [{"name": "G. L. Klimchitskaya"}, {"name": "V. M. Mostepanenko"}], "author_count": 2}, {"id": "2609.03854", "category": "cond-mat", "title": "Universal Driven Critical Dynamics of Entanglement Entropy", "abstract": "The Kibble-Zurek mechanism (KZM) and finite-time scaling (FTS) provide a foundational framework for driven critical dynamics, yet their predictive power has been largely confined to local observables. Here, we establish a universal finite-time scaling theory for the nonequilibrium dynamics of quantum entanglement. Using unbiased quantum Monte Carlo simulations, we investigate the corner entanglement entropy of (2+1)-dimensional interacting Dirac fermions driven from ordered phases toward a quantum critical point. We find that the corner entanglement accurately obeys a universal driven scaling governed by the driving rate and system size, persisting whether the initial ordered state is fully gapped or hosts gapless Goldstone modes. Crucially, this dynamical entanglement exhibits a logarithmic dependence on the driving rate, from which the universal corner coefficient of the underlying conformal field theory can be robustly extracted far from equilibrium. These results generalize the KZM from local observables to the intrinsic nonlocal quantum information measures, offering a practical blueprint for characterizing quantum criticality and entanglement on programmable quantum simulators.", "url": "https://arxiv.org/abs/2609.03854", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chang-Yu Shen"}, {"name": "Shuai Yin"}, {"name": "Zi-Xiang Li"}], "featured_authors": [{"name": "Chang-Yu Shen"}, {"name": "Shuai Yin"}, {"name": "Zi-Xiang Li"}], "author_count": 3}, {"id": "2609.03907", "category": "cond-mat", "title": "Hierarchy of topological superconductivity generated via heterostructures of unconventional $p$-wave magnets", "abstract": "A theoretical framework is proposed to engineer both first and second-order topological superconducting phases in a two-dimensional (2D) heterostructure, consisting of a quantum spin Hall insulator (QSHI) and an unconventional $p$-wave magnet in presence of proximity-induced $s$-wave superconducting pairing. Our analysis establishes that the transitions between the trivial and topological superconducting (TSC) phases can be regulated though the parameters of $p$-wave magnet. Presence of chiral symmetry leads to the characterization of both types of TSC phases by the respective invariants, one-dimensional winding number and quadrupolar winding number. These results are supplemented by an analytical effective low-energy edge theory that yields a deeper insight into the emergence of the different topological phases of the system. Bulk pairing analysis reveals the competition between the effective $(p_x+p_y)$ and $(p_x+ip_y)$ type pairings that are governed by the intrinsic spin-orbit coupling inherited to the QSHI and spin-split bands of the $p$-wave magnet, respectively.", "url": "https://arxiv.org/abs/2609.03907", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Koushik R. Das"}, {"name": "Arijit Saha"}], "featured_authors": [{"name": "Koushik R. Das"}, {"name": "Arijit Saha"}], "author_count": 2}, {"id": "2609.03913", "category": "cond-mat", "title": "Electromechanical Domain Wall Propagation in Dielectric Elastomers: An Exact Geometric Resolution via Conformal Mapping", "abstract": "The localized electromechanical phase transition in dielectric elastomers involves complex moving boundaries and severe electrostatic fringe fields driven by high-curvature interfaces. Traditional phenomenological models fundamentally underestimate the configurational forces by completely ignoring the in-plane electric field components and geometric singularities. Here, we present a asymptotically exact geometric framework to resolve the domain wall propagation. By mapping the highly deformed current configuration to a regular parametric strip via conformal mapping, the field singularities are algebraically eliminated. An exact integration by parts directly translates the higher-order geometric metric into a rigorous topological mass term, projecting the global conformal electrostatics into a non-linear $\\sigma$-model Lagrangian density. Incorporating the Gent strain-stiffening model, the continuous translation symmetry yields a Hamiltonian first integral. Eigenvalue analysis and Bogomol'nyi-Prasad-Sommerfield (BPS) bound calculations prove that the domai
