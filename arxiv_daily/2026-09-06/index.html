n wall emerges strictly as an asymmetric heteroclinic orbit connecting two saddle points. This geometric resolution provides exact analytical scalings for the localized interface energy, domain wall thickness, and asymptotic decay lengths, eliminating all phenomenological parameters and offering a deterministic paradigm for geometric instabilities in active soft matter.", "url": "https://arxiv.org/abs/2609.03913", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yu-Xin Xie"}], "featured_authors": [{"name": "Yu-Xin Xie"}], "author_count": 1}, {"id": "2609.03991", "category": "cond-mat", "title": "Boundary- and Screening-Induced Bubbly Phases in Autophoretic Active Matter", "abstract": "Spatial confinement and chemical screening fundamentally reshape the non-equilibrium phase behavior of autophoretic active particles. Here, we present a systematic study mapping the collective dynamics of self-propelled particles governed by chemo-attractive translational forces ($\\mu_t < 0$) and chemo-repulsive rotational torques ($\\mu_r > 0$) across varying screening parameters $\\kappa$, torque magnitudes $\\mu_r$, and boundary condition coefficients $\\Lambda^c$. Beyond standard chemotactic macro-phase separation and dynamic clustering, we report the emergence of novel boundary- and screening-induced bubbly phases, classified into boiling and bursting bubbles. Using a metric triad of steady-state cluster fraction $\\langle S \\rangle$, temporal fluctuation magnitude $\\sigma_S$, and coordination number $\\langle Q \\rangle$, we draw phase diagrams to demarcate phases for no-flux boundaries ($\\Lambda^c = 1$) and chemically permeable interfaces ($\\Lambda^c = 0$) . Increasing chemical screening ($\\kappa$) systematically suppresses long-range attraction, driving sequential phase transitions from macro-scale collapse toward bubbly states, dynamic micro-clusters, and homogeneous gas phases, while simultaneously inducing aggregate shape anisotropy. These findings provide predictive design rules for controlling active assembly and transport in microfluidic environments.", "url": "https://arxiv.org/abs/2609.03991", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kingshuk Panja"}, {"name": "Günther Turk"}, {"name": "Rajesh Singh"}], "featured_authors": [{"name": "Kingshuk Panja"}, {"name": "Günther Turk"}, {"name": "Rajesh Singh"}], "author_count": 3}, {"id": "2609.04006", "category": "cond-mat", "title": "Quenched complexity of marginal states in the Sherrington--Kirkpatrick spin glass", "abstract": "In the Sherrington-Kirkpatrick model the exponentially many metastable states are marginal, so counting them requires breaking the BRST supersymmetry or a two-group replica Ansatz. For four decades this complexity was known only in the annealed approximation, which is unstable at low free energy and predicts states below the Parisi equilibrium free energy. We compute it quenched, with one step of replica symmetry breaking. It leaves the annealed curve where it becomes unstable and vanishes next to the full-RSB equilibrium free energy: the lowest marginal states are thus plausibly the equilibrium states themselves.", "url": "https://arxiv.org/abs/2609.04006", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tiziana De Chirico"}, {"name": "Luca Leuzzi"}], "featured_authors": [{"name": "Tiziana De Chirico"}, {"name": "Luca Leuzzi"}], "author_count": 2}, {"id": "2609.04029", "category": "cond-mat", "title": "Mechanistic Framework for Multicomponent Nanoparticle Assembly: Predicting RNA-lipid and PEI-DNA nanoparticle assembly", "abstract": "The assembly of multicomponent nanoparticles is often kinetically controlled and exhibits strong pathway dependence. Transport, solvent exchange, nucleation/growth, and collision-driven coalescence together determine not only ensemble-averaged properties but also particle-to-particle compositional heterogeneity. Here, we present a computational modeling framework for predicting nanoparticle property distributions by coupling processing conditions, early-stage self-assembly physics, and molecular chemical details with kinetic Monte Carlo (kMC) simulations. The framework combines (i) mixing conditions with solvent-exchange-mediated particle initialization and growth, and (ii) kMC simulations that resolve stochastic collision histories, electrostatics-controlled coalescence, and composition at the level of individual particles. Applied to mRNA lipid nanoparticles, the model predicts size-loading correlations and provides insight into how processing-dependent assembly pathways lead to heterogeneous payload distributions. The kMC simulations further provide merging lineage histories, which explain the emergence of log-normal volume and payload distributions through multiplicative particle-growth pathways. The same framework is also applied to PEI-DNA polyelectrolytic complexation, yielding single-particle-resolved DNA-PEI stoichiometry distributions. The framework and its open-source implementation, FormLNP, provide a process-aware route to predicting and controlling single-particle property distributions across a broad range of multicomponent nanoparticle systems.", "url": "https://arxiv.org/abs/2609.04029", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Turash Haque Pial"}, {"name": "Tine Curk"}], "featured_authors": [{"name": "Turash Haque Pial"}, {"name": "Tine Curk"}], "author_count": 2}, {"id": "2609.04091", "category": "cond-mat", "title": "Effective Hamiltonian description on monitored Majorana chains: correlated power-law hoppings and unconventional entanglement scaling", "abstract": "We investigate the structures of effective Hamiltonians governing monitored dynamics of a one-dimensional Majorana chain through the Lyapunov spectral analysis. We focus on a gapless phase characterized by finite-size scalings different from those in conventional critical and/or frustration-free systems; the spectral gap closing faster than $1/L$ but slower than $1/L^2$ and the entanglement entropy growing as $[\\ln(L)]^2$ with $L$ being the system size. We find that the corresponding effective Hamiltonians have random long-range power-law hoppings with nontrivial magnitude correlations, rather than being independently and identically distributed. To elucidate the role of these non-Gaussian correlations, we construct random power-law hopping models that capture the essential features of the effective Hamiltonians. The spectral gaps of the constructed models decay faster than $1/L$ but slower than $1/L^2$. We find that, in the absence of hopping correlations, the ground-state entanglement exhibits $\\ln(L)$ scaling. In the presence of correlations, by contrast, the entanglement entropy is enhanced and its system-size dependence is consistent with $[\\ln(L)]^2$ scaling over the system sizes studied. These results suggest that correlations among long-range hopping magnitudes are responsible for the entanglement scaling that seldom appears in ground states of conventional isolated quantum systems.", "url": "https://arxiv.org/abs/2609.04091", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ken Mochizuki"}, {"name": "Hisanori Oshima"}, {"name": "Ryusuke Hamazaki"}, {"name": "Yohei Fuji"}], "featured_authors": [{"name": "Ken Mochizuki"}, {"name": "Hisanori Oshima"}, {"name": "Ryusuke Hamazaki"}, {"name": "Yohei Fuji"}], "author_count": 4}, {"id": "2609.04093", "category": "cond-mat", "title": "Extrinsic orbital Edelstein effect from asymmetric scattering", "abstract": "The generation and manipulation of orbital angular momentum (OAM) by an external electric field constitute one of the central themes of orbitronics. In particular, the electrically induced nonequilibrium OAM polarization, known as the orbital Edelstein effect (OEE), has attracted considerable attention in recent years. While the intrinsic band-geometric mechanism and the role of conventional symmetric impurity scattering in the OEE are well understood, the contribution from disorder-induced asymmetric scattering remains unclear. Here, we develop a semiclassical theory that separates the OEE into intrinsic, Drude, side-jump, and third- and fourth-order skew-scattering channels. Unlike the Drude channel, the intrinsic, side-jump, and skew-scattering responses survive only in systems with broken time-reversal symmetry. We find that in a magnetized Rashba two-dimensional electron gas (2DEG), these disorder-induced mechanisms can substantially exceed the intrinsic contribution. Remarkably, we find that for a system with Rashba coupling of $1$ $eV Å$, the orbital magnetization is about one order of magnitude larger than the spin magnetization for the chosen parameters, highlighting the crucial role of orbital degrees of freedom in the Edelstein effect.", "url": "https://arxiv.org/abs/2609.04093", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sankar Sarkar"}, {"name": "Koushik Ghorai"}, {"name": "Amit Agarwal"}], "featured_authors": [{"name": "Sankar Sarkar"}, {"name": "Koushik Ghorai"}, {"name": "Amit Agarwal"}], "author_count": 3}, {"id": "2609.04097", "category": "cond-mat", "title": "Hydrodynamics of two-dimensional electrons due to scattering by disorder", "abstract": "The hydrodynamic regime of electron transport, induced by fast inter-electron collisions, was discovered in high-quality nanostructures in recent ten years. However, signs of hydrodynamic transport, primarily, the giant negative magnetoresistance, were observed even at very low temperatures, when electron-electron scattering is too weak to affect the transport. To address this puzzle, here we develop a theory of mixed, hydrodynamic and non-Markovian, magnetotransport of two-dimensional electrons at zero temperature in samples with weak but still important disorder. Namely, we account for both the memory effects at electron scattering by localized defects in magnetic field and an unconventional viscosity effect due to electron scattering by defects in bulk and by rough sample edges. Solution of the model yields a strong negative magnetoresistance, which exhibits at zero magnetic field a sharp maximum in narrower samples or a blunt maximum in wider samples. This and other our results explain various properties of the giant negative magnetoresistance observed on ultra-high-quality GaAs quantum wells, thereby we apparently reveal the nature of low-temperature magnetotransport in these systems.", "url": "https://arxiv.org/abs/2609.04097", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "D. R. Raskulov"}, {"name": "K. A. Baryshnikov"}, {"name": "P. S. Alekseev"}], "featured_authors": [{"name": "D. R. Raskulov"}, {"name": "K. A. Baryshnikov"}, {"name": "P. S. Alekseev"}], "author_count": 3}, {"id": "2609.04109", "category": "cond-mat", "title": "Strengthened Silicate Glasses by Residual Stress: Depth of Compression and Surface Flaws Stability Conditions", "abstract": "The application of silicate glasses in severe service environments requires a precise evaluation of structural strength under mechanical loads and surface tribological conditions. Because glass strength is governed by surface flaws and microcracks rather than being an intrinsic material property, residual surface compression fields, balanced by interior tensile zones, are widely implemented to inhibit flaw opening. Rather than relying on conventional allowable stress criteria to establish product acceptance, this study adopts a fracture mechanics framework based on the stress intensity factor KI and fundamental material limits: the critical stress intensity factor KIC for rapid fracture and the threshold stress intensity factor KIth for time-delayed static fatigue failure. Using the Weight Function Method (WFM), KI is evaluated across generic surface flaw depths for two-dimensional continuous (2D-Continuous) surface cracks subjected to non-uniform internal residual stress fields and external loads. Flaw stability criteria are established for both zero-risk and moderate-risk design methodologies. Finally, the interaction and superposition of externally applied mechanical and thermal stresses with internal residual stress fields are evaluated.", "url": "https://arxiv.org/abs/2609.04109", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Guglielmo Macrelli"}], "featured_authors": [{"name": "Guglielmo Macrelli"}], "author_count": 1}, {"id": "2609.04149", "category": "cond-mat", "title": "Non-uniform quantum geometry stabilizes generalized Wigner crystals", "abstract": "Moiré materials host fractional Chern insulators and electron crystals in close proximity, but the mechanism selecting between them remains an open question. We address this competition in Chern bands with ideal but momentum-dependent quantum geometry -- Aharonov-Casher bands. We present an ansatz wave function for generalized Wigner crystals and, by comparing its energy to that of the competing Laughlin-like state, map out the phase diagram at filling fraction $\\nu=1/m$ as a function of the degree of geometric non-uniformity. Our work identifies quantum geometry-controlled zero point fluctuations of the charge density of the generalized Wigner crystal as the mechanism controlling its relative stability, implying a kind of quantum Lindemann criterion for the crystal-liquid phase boundary.", "url": "https://arxiv.org/abs/2609.04149", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nicolás Morales-Durán"}, {"name": "Tobias M. R. Wolf"}, {"name": "Jingtian Shi"}, {"name": "Tomohiro Soejima"}, {"name": "Andrew J. Millis"}, {"name": "Jennifer Cano"}], "featured_authors": [{"name": "Nicolás Morales-Durán"}, {"name": "Tobias M. R. Wolf"}, {"name": "Jingtian Shi"}, {"name": "Tomohiro Soejima"}, {"name": "Andrew J. Millis"}, {"name": "Jennifer Cano"}], "author_count": 6}, {"id": "2609.04162", "category": "cond-mat", "title": "Thermodynamic Concentration Inequalities: Controlling Uncertainty in Finite-Time and Small-Sample Thermodynamic Inference", "abstract": "We derive nonasymptotic upper bounds on the probability that a generalized current of a geometrically ergodic diffusion observed for any amount of time, or its sample mean over any arbitrary sample size, deviates from the stationary mean by more than any given amount. The concentration-of-measure behavior of generalized currents is universally governed by the relaxation time of the underlying dynamics, the locally observed dissipation rate, and the intrinsic local fluctuations of the observable. We uncover stark qualitative and quantitative differences in fluctuations in and out of thermodynamic equilibrium. We further obtain refined inverse thermodynamic uncertainty relations, bounding the variance of generalized currents from above. We construct nonasymptotic confidence intervals for controlling uncertainty in thermodynamic inference from small data, i.e., from short trajectories and small samples, and provide the first quantitative answer to when a trajectory is sufficiently long and a sample is sufficiently large. As an illustration, we apply our results to currents observed on a two-dimensional Ornstein-Uhlenbeck process in and out of equilibrium and show how they can be used to rigorously detect broken detailed balance.", "url": "https://arxiv.org/abs/2609.04162", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rick Bebon"}, {"name": "Aljaž Godec"}], "featured_authors": [{"name": "Rick Bebon"}, {"name": "Aljaž Godec"}], "author_count": 2}, {"id": "2609.04164", "category": "cond-mat", "title": "A Superconducting Peierls Instability", "abstract": "The Peierls instability is a foundational mechanism in condensed matter physics, showing how the electron--phonon interaction can transform a simple metal into an insulating state with a new lattice periodicity. In a one-dimensional (1D) metal the Peierls instability follows from the enhanced electronic response at wavevector $Q=2k_F$ (connecting the Fermi points) producing a Kohn anomaly: a softening of the phonon mode at the same wavevector. Condensation of this mode then generates the tell-tale Peierls periodic lattice distortion and charge-density wave (CDW) that gaps the electronic spectrum. Here we show an analogous instability at the edge of a two-dimensional (2D) superconductor, where a dispersing Andreev bound state (ABS) hosts Bogoliubov Fermi points at $\\pm k_c$. The enhanced quasiparticle response at the connecting wavevector $Q=2k_c$ couples directly to pairing-fluctuations and produces a superconducting Kohn anomaly: a softening of a pairing mode at the same wavevector. Condensation of this mode then generates an edge pair-density wave (PDW) that gaps the ABS. We refer to this as a superconducting Peierls instability and identify the boundary quasiparticle structure that enables it. As a concrete realization, we consider a square-lattice extended Hubbard model whose mixed-symmetry $s+d+ip$ state hosts a dispersing ABS with zero-energy crossings at finite edge momenta. Using self-consistent Bogoliubov--de Gennes (BdG) calculations we show that the order parameter develops an edge PDW, with the wavevector set by the superconducting Kohn anomaly, that gaps the ABS crossings. Our results identify a novel mechanism for spontaneous translation-symmetry breaking in a superconductor. As this superconducting Peierls mechanism does not require an extensive zero-energy flat band or topologically protected edge states, it may apply broadly to unconventional superconductors.", "url": "https://arxiv.org/abs/2609.04164", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pramodh Senarath Yapa"}, {"name": "Joseph Maciejko"}, {"name": "Frank Marsiglio"}, {"name": "Annica M. Black-Schaffer"}], "featured_authors": [{"name": "Pramodh Senarath Yapa"}, {"name": "Joseph Maciejko"}, {"name": "Frank Marsiglio"}, {"name": "Annica M. Black-Schaffer"}], "author_count": 4}, {"id": "2609.04169", "category": "cond-mat", "title": "Reciprocity can halve what a mechanical network can learn", "abstract": "Tunable mechanical networks are being developed as materials that learn in place. Capacity is estimated by counting tunable parameters against target constraints, ignoring Maxwell-Betti reciprocity, the symmetry every passive, linear elastic network obeys by construction. When p degrees of freedom are both driven and read out, every reachable response block lies in a subspace of codimension p(p-1)/2, whatever the size, topology and stiffnesses; at full overlap nearly half the target space is unreachable. The consequence for training is a number: any learning rule leaves an error at least the norm of the target's antisymmetric part on the shared degrees of freedom, computable before training, and positive definiteness adds an orthogonal second term. A second-order optimiser with the exact Jacobian reaches that floor within 1% in 143 of 144 runs, a bond-local contrastive rule within 0.1% in 22 of 24, and odd couplings restore the lost directions at the price of an external torque source: the network becomes active. Prescribed-displacement drives obey a companion law we prove. The symmetry is classical; its consequence on a fixed graph with finitely many tunable stiffnesses at partial overlap is new. For a published robotic metamaterial it shows that no symmetric positive-definite stiffness matrix meets both targets in the linear model their deposited data integrate.", "url": "https://arxiv.org/abs/2609.04169", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Thai-Son Vu"}, {"name": "Hoang-Giang Nguyen"}, {"name": "Quoc-Bao Nguyen"}, {"name": "Sengaloun Keoalounxay"}, {"name": "Bao-Viet Tran"}], "featured_authors": [{"name": "Thai-Son Vu"}, {"name": "Hoang-Giang Nguyen"}, {"name": "Quoc-Bao Nguyen"}, {"name": "Sengaloun Keoalounxay"}, {"name": "Bao-Viet Tran"}], "author_count": 5}, {"id": "2609.04187", "category": "cond-mat", "title": "Wavefunctions for Anyon Superconductors", "abstract": "Anyon superconductivity arises from the condensation of mobile anyons rather than from a conventional Cooper instability, yet a systematic wavefunction description remains lacking. We develop a hierarchy-wavefunction construction for superconducting states derived from parent topological orders and identify their off-diagonal long-range order, condensate charge, chiral central charge, and residual topological order through the plasma analogy and topological field theories. We construct Abelian and non-Abelian examples descending from the semion state, a $\\nu=2/3$ hierarchy state, the $\\nu=1/3$ Laughlin state, $\\nu=1$ integer quantum Hall state, and Pfaffian state. Remarkably, for the semion case, the superconducting many-semion wavefunction is equivalent to a state of fermionized anyons filling two effective Landau levels, recovering Laughlin's original construction of semion superconductor. Finally, we show that hierarchy wavefunctions emerge naturally in the dilute, long-distance limit of the anyon-Hilbert-space formulation, which applies to ideal Chern bands and moiré bands of twisted bilayer MoTe$_2$. Our results establish a unified wavefunction-level framework linking anyon condensation, superconducting order, and topological field theory.", "url": "https://arxiv.org/abs/2609.04187", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Donghae Seo"}, {"name": "Taegon Lee"}, {"name": "Gil Young Cho"}], "featured_authors": [{"name": "Donghae Seo"}, {"name": "Taegon Lee"}, {"name": "Gil Young Cho"}], "author_count": 3}, {"id": "2609.03001", "category": "hep-th", "title": "Taxonomy of Potentials in Asymptotic Limits", "abstract": "In infinite-distance limits of scalar field moduli spaces in quantum gravity, particle masses, brane tensions, and scalar field potentials scale exponentially with geodesic distance. Previous work has shown that the exponential decay rates of particle masses and brane tensions admit a discrete classification. In this work, we extend this classification to the case of scalar field potentials. We find that leading contributions to the potential typically scale with tensions of codimension-1 branes as $V \\sim T_{d-1}^2$ or codimension-0 branes as $V \\sim T_d$, and these relations hold formally even when the associated branes are absent from the spectrum. As a result, the taxonomy rules for potentials are intimately connected to the brane taxonomy rules. More generally, potential contributions can be labeled by a collection of integers, which correspond physically to their transformation properties under Weyl rescalings and their order in the string loop expansion. This implies that the vector $\\vec v = - \\vec \\nabla \\log V$ is lattice-valued, and indeed it lies in precisely the same lattice as the analogous vectors $\\vec \\alpha = - \\vec \\nabla \\log T_d$ for codimension-0 branes of tension $T_d$. We verify our taxonomy rules in various examples in string theory. We show that these rules imply that sums of positive potential terms satisfy the Strong Asymptotic de Sitter Conjecture, which requires $|\\vec \\nabla \\log V| \\geq 2/\\sqrt{d-2}$ in asymptotic regimes of scalar field moduli space, and they imply that higher-derivative gravitational corrections are suppressed by powers of the species scale.", "url": "https://arxiv.org/abs/2609.03001", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Muldrow Etheredge"}, {"name": "Dieter Lüst"}, {"name": "Tom Rudelius"}], "featured_authors": [{"name": "Muldrow Etheredge"}, {"name": "Dieter Lüst"}, {"name": "Tom Rudelius"}], "author_count": 3}, {"id": "2609.03008", "category": "hep-th", "title": "Gravitational Backreaction in de Sitter: A Canonical ADM Approach", "abstract": "We develop a canonical ADM framework for gravitational backreaction during inflation. Our approach extends the formalism used to compute cosmological correlators by applying it to the evolution of the quantum background, which we identify with the metric one-point function. The aim is to assess the quantum stability of inflationary geometries under gravitational backreaction. Within this framework, the backreaction is determined by the expectation values of the Hamiltonian constraint and the equations of motion for the spatial metric. Working in the exact de Sitter limit, we apply the framework to a massless minimally coupled spectator scalar field and the physical graviton polarizations. At one loop, their backreaction renormalizes the relation between the cosmological constant and the Hubble parameter without inducing any secular departure from de Sitter evolution, in agreement with previous results. We perform the calculation using a hard momentum cutoff and show that a fixed physical cutoff allows the homogeneous background equations to be renormalized with time- and background-independent coefficients, in contrast to a fixed comoving cutoff. Finally, we demonstrate that the explicit representation of the backreaction depends on the gauge condition imposed on the metric fluctuations, as well as on the background-fluctuation split. Nevertheless, these different representations are related by a gauge transformation and are therefore physically equivalent.", "url": "https://arxiv.org/abs/2609.03008", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Giordano Cintia"}], "featured_authors": [{"name": "Giordano Cintia"}], "author_count": 1}, {"id": "2609.03013", "category": "hep-th", "title": "From $Z$ to $a$: High-temperature relations, subleading semi-universality, and conformal anomalies", "abstract": "The free energy of any CFT, $ \\ln Z(\\beta; \\omega_i)$, admits two expansions: high temperature ($\\beta \\rightarrow 0$) and fast rotation ($\\omega_i \\rightarrow 1$). We demonstrate that locality of the thermal effective action forces $\\ln Z$ to take a simple analytic form at all orders in the high temperature expansion, and further imposes an infinite number of sharp relations on the coefficients in this expansion. All are homogeneous, except at order $\\beta^1$ due to the Weyl anomaly. From this, the $a$-anomaly can be extracted from the partition function. The relations resum in the fast-spinning expansion into differential equations in $\\beta$ obeyed by the semi-universal limit and its corrections. We verify the relations in a variety of CFTs. We generalize to any even $d$, but find no similar relations at odd $d$.", "url": "https://arxiv.org/abs/2609.03013", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arnav Advant"}, {"name": "Harsh Anand"}, {"name": "Nathan Benjamin"}, {"name": "Vipul Kumar"}, {"name": "Shiraz Minwalla"}, {"name": "Jyotirmoy Mukherjee"}, {"name": "Sridip Pal"}, {"name": "Asikur Rahaman"}, {"name": "Pabitra Ray"}], "featured_authors": [{"name": "Arnav Advant"}, {"name": "Harsh Anand"}, {"name": "Nathan Benjamin"}, {"name": "Sridip Pal"}, {"name": "Asikur Rahaman"}, {"name": "Pabitra Ray"}], "author_count": 9}, {"id": "2609.03023", "category": "hep-th", "title": "Holographic zeros and poles from apparent singularities", "abstract": "We study general holographic fluctuation equations with apparent singularities, and the associated spectral functions. We consider the regime where an apparent singularity approaches the boundary, for which the near-boundary behavior of solutions can be determined via an inner/outer matching type of calculation. Depending on properties of the equation, we find that the merging of an apparent singularity with the boundary may generate either a zero or a pole for the corresponding spectral function. Our results also indicate that the recently introduced holographic product formula still applies in the presence of apparent singularities.", "url": "https://arxiv.org/abs/2609.03023", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Edwan Préau"}], "featured_authors": [{"name": "Edwan Préau"}], "author_count": 1}, {"id": "2609.03043", "category": "hep-th", "title": "Monstrous parafermionic defects and other non-invertible symmetries in chiral CFTs", "abstract": "The structure of non-invertible symmetries in 2D CFT is closely tied to the algebra of preserved holomorphic fields, its representation theory, and its embedding in the full chiral algebra of the CFT. Unfortunately, finding new embeddings of a chiral algebra into another is a difficult mathematical problem, and one of the major obstacles in the pursue of new and exotic categories of non-invertible symmetries. In this work, we describe a simple general technique that leads to a number of new non-trivial results in this direction: (1) For the holomorphic Monster CFT $V^\\natural$, we show that for every `Fricke' non-anomalous Monster element of order $N$, there is an embedding of the parafermion algebra $\\frac{su(2)_N}{u(1)}$ in $V^\\natural$, we compute the characters of its commutant, and describe the topological defects preserving these subalgebras. (2) We provide an easy-to-check sufficient condition for a holomorphic VOA $V$ to be self-orbifold under a cyclic group of (invertible) symmetries, and determine the associated duality defect. (3) We find several new topological defects in CFTs arising from heterotic strings on $T^4$. (4) We prove a number of VOA embeddings and topological defects in the Leech lattice CFT, in Schellekens theories, and other CFTs of various central charges, and suggest several generalizations of our methods.", "url": "https://arxiv.org/abs/2609.03043", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Roberto Volpato"}], "featured_authors": [{"name": "Roberto Volpato"}], "author_count": 1}, {"id": "2609.03071", "category": "hep-th", "title": "The trans-Planckian problem and gravitational interactions", "abstract": "The strong gravitational interaction of counter-propagating quantum field modes is of foundational importance to the trans-Planckian problem of black hole horizons. This article, in memory of Renaud Parentani, is primarily an exposition of Renaud's attempt, using perturbation theory, a large $N$ approximation, and spherical reduction, to capture a mechanism by which those interactions might quench the trans-Planckian near-horizon quantum field correlations. Before giving a detailed account of Renaud's calculation, the trans-Planckian problem is briefly introduced, and the paper concludes with a discussion of related issues and questions.", "url": "https://arxiv.org/abs/2609.03071", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ted Jacobson"}], "featured_authors": [{"name": "Ted Jacobson"}], "author_count": 1}, {"id": "2609.03126", "category": "hep-th", "title": "Boundary-Value Problem in Type IIB Supergravity and Holography", "abstract": "In precision holography, the Euclidean on-shell action of type IIB supergravity often fails to reproduce the leading large-$N$ free energy of the dual field theory: the type IIB pseudo action, for instance, vanishes identically on the $\\mathrm{EAdS}_5\\times S^5$ background. We address this issue by revisiting the boundary-value problem of the Euclidean type IIB pseudo action from first principles. Classifying the admissible boundary conditions through the variational principle, we construct a generalized pseudo action whose boundary terms implement the choice of ensemble --- fixed potentials versus fixed quantized Page charges --- in which the holographic comparison is performed. For the fixed five-form-charge ensemble, the resulting boundary term reproduces the recently proposed topological correction to the Pasti--Sorokin--Tonin formulation of type IIB supergravity for holographic backgrounds of interest. We then test the generalized pseudo action on two complementary backgrounds: the $\\mathrm{EAdS}_3\\times S^3\\times M_4$ near-horizon geometry of the D1-D5 system and the warped $\\mathrm{EAdS}_6\\times S^2\\times\\Sigma$ solutions dual to five-dimensional SCFTs. In both cases the ten-dimensional on-shell action agrees exactly with that of the corresponding lower-dimensional supergravity, and thereby with the leading large-$N$ free energy of the dual SCFT. Our results establish the choice of boundary conditions --- and hence of ensemble --- as an essential ingredient of precision holography directly in type IIB supergravity, extending recent analyses in eleven-dimensional supergravity.", "url": "https://arxiv.org/abs/2609.03126", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Soumya Adhikari"}, {"name": "Junho Hong"}, {"name": "Chanyoung Joung"}, {"name": "Geum Lee"}, {"name": "Sourav Roychowdhury"}], "featured_authors": [{"name": "Soumya Adhikari"}, {"name": "Junho Hong"}, {"name": "Chanyoung Joung"}, {"name": "Geum Lee"}, {"name": "Sourav Roychowdhury"}], "author_count": 5}, {"id": "2609.03347", "category": "hep-th", "title": "Conical Defects in JT Gravity from BF Theory: Quantization, Fusion, and Weighted Moduli Spaces", "abstract": "We construct a gauge-invariant BF representative of a conical defect in Jackiw--Teitelboim gravity, with its elliptic direction fixed by the reconstruction of the gravitational variables. In the gravitational sector, the BF observable reproduces the metric defect insertion and its distributional curvature source, and fixes the holonomy around the defect to an elliptic conjugacy class. For a single defect on the disk, the position integral combines with the residual \\(\\mathrm{PSL}(2,\\mathbb R)\\) quotient, leaving a fixed elliptic sector. The exact boundary quantization of this sector gives the elementary kernel and one-defect disk amplitude directly, without using a matrix model. The same local BF operator describes both sharp and blunt defects. Their difference appears only when several defect positions are integrated. BF source composition makes the fractional deficits additive. Requiring a fused source to remain in the gravitational cone sector gives the admissibility condition for defect collisions, while positivity of the hyperbolic area on each component gives the corresponding stability condition. These conditions coincide with those for Hassett weighted curves. Combining these BF results with the known Hassett compactification and conical Weil--Petersson geometry yields the fixed-order genus-zero contact terms and recovers the cluster expansion of deformed JT gravity. Thus sharp and blunt defects differ through the compactified geometry of their relative positions, rather than through the elementary BF operator.", "url": "https://arxiv.org/abs/2609.03347", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wei Gu"}], "featured_authors": [{"name": "Wei Gu"}], "author_count": 1}, {"id": "2609.03525", "category": "hep-th", "title": "Center-twisted Gribov spectra and the finite-volume Gaussian response in the refined Gribov--Zwanziger framework", "abstract": "We develop a continuum framework for comparing the Gribov--Zwanziger and center-vortex descriptions of confinement through the gauge-invariant twisted partition function of the electric $\\mathbb{Z}_N^{[1]}$ 1-form symmetry. A background 2-form field $B$, equivalently an 't~Hooft twist on a torus, labels a global sector and is not itself a dynamical center vortex. For a minimal irreducible twist on $T^4$, we derive the complete adjoint momentum lattice of $SU(N)$. The twisted spectrum is exactly the scalar spectrum on an enlarged torus with periods $(L_1,L_2,NL_3,NL_4)$ with the ordinary-torus sublattice removed. This yields a finite Faddeev--Popov gap at the flat representative and reduces twisted-minus-untwisted spectral traces to ordinary torus traces. For the refined Gribov--Zwanziger (RGZ) kernel, Poisson resummation gives an exact finite-volume Bessel-function winding sum with a universal center-twist projector. We evaluate the Gaussian one-loop integral at fixed RGZ parameters up to the finite-dimensional global zero-mode/stabilizer normalization. The Zwanziger determinants cancel, while the gauge-fixing/ghost sector leaves a universal massless primed determinant on $T^4$; the untwisted sector also contains constant gluon modes. The only normalization not fixed by the local quadratic Hessian is the relative zero-mode/stabilizer measure of the reducible untwisted and irreducibly twisted flat connections. We also derive closed finite-volume sources for the RGZ stationary equations. The massive response is exponentially suppressed at large volume, whereas the massless factor depends on the global zero-mode normalization. Thus the Gaussian calculation does not by itself establish the strong center-vortex-condensation criterion for $Z[B]/Z[0]$, but it isolates the remaining global normalization problem and separates a global twist from an actual dynamical vortex.", "url": "https://arxiv.org/abs/2609.03525", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Okuto Morikawa"}], "featured_authors": [{"name": "Okuto Morikawa"}], "author_count": 1}, {"id": "2609.03530", "category": "hep-th", "title": "Topics in Kadyshevsky Field Theory", "abstract": "In these notes we deal with several field theoretical topics in the framework of the Quantum Field Theory as developed by Kadyshevsky. The main motivation for studying the Kadyshevsky formalism is that in the kadyshevsky graphs, in contrast with the Feynman graphs, the particles remain on the mass shell. This facilitates the use of phenomenological form factors, {\\it e.g.} Gaussian ones. In the first part we construct the second quantised quasi-particle formalism, which is employed to develop the functional integral formalism. In the latter we develop the path-integral, the Schwinger-Symanzik equations, generalised Wightman functions, and the Kadyshevsky reduction formulas. In the second part we cover the topics: (i) the relation between the Feynman and Kadyshevsky perturbation theory, and (ii) the Gross-Jackiw method in the Kadyshevsky formalism. The latter method is applied to the kadyshevsky formalism for interaction Lagrangians with derivatives, in particular for pion-nucleon interactions: (i) pseudo-vector $NN\\pi$-, (ii) vector $NN\\rho$-, and (iii) gauge-invariant $\\Delta_{33}N\\pi$ coupling.", "url": "https://arxiv.org/abs/2609.03530", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Th.A. Rijken"}, {"name": "J.W. Wagenarr"}], "featured_authors": [{"name": "Th.A. Rijken"}, {"name": "J.W. Wagenarr"}], "author_count": 2}, {"id": "2609.04016", "category": "hep-th", "title": "Quasi-local form for $α$--$z$ Rényi QNEC from fixed-ray escorts", "abstract": "The fixed-ray escort integral representation expresses $\\alpha$--$z$ Rényi divergence as an average over ordinary relative entropy of a family of escort states. Working in the standard UV-regulated density-matrix description of QFT subregions, we use this representation to derive an escort-averaged entanglement first law, an escort-averaged representation of the $\\alpha$--$z$ information kernel, and an escort-averaged Bekenstein-type bound for ball-shaped regions in conformal field theories. For the conjectural $\\alpha$--$z$ quantum null energy condition (QNEC), we obtain a quasi-local form in which the null energy is evaluated in an escort-averaged state and is corrected by an escort-transport term encoding the failure of escort formation to commute with restriction to a null-deformed region. The $z=\\alpha$ specialization gives a similar quasi-local form of the Rényi QNEC for sandwiched Rényi divergence. We explicitly compute the Rényi QNEC, including the explicit escort transport term, for coherent-state excitations in a free scalar field theory. For the same coherent family, we obtain a positive $\\alpha$--$z$ null Hessian, verifying the conjectured diagonal $\\alpha$--$z$ QNEC for this family.", "url": "https://arxiv.org/abs/2609.04016", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tanay Kibe"}, {"name": "Pratik Roy"}], "featured_authors": [{"name": "Tanay Kibe"}, {"name": "Pratik Roy"}], "author_count": 2}, {"id": "2609.04035", "category": "hep-th", "title": "Cusped Defects: Cusp Operator Expansion, Conformal Properties and Bootstrap Applications", "abstract": "We analyze general properties of cusped defect lines embedded in generic conformal field theories (CFTs). We prove that suitably defined cusp scaling operators transform like primary operators under general conformal transformations. We show that, via the cusp operator expansion (COE), defects of general shape can be expanded in a basis of cusped defects. These findings are checked and exemplified in the case of the localized magnetic field defect. Finally, we derive analytic constraints on dynamical cusp data by making use of a crossing equation, and discuss possible numerical bootstrap applications of our results.", "url": "https://arxiv.org/abs/2609.04035", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lorenzo Bianchi"}, {"name": "Andrea Cavaglià"}, {"name": "A. David Gutiérrez"}, {"name": "Stefanos R. Kousvos"}, {"name": "Marco Meineri"}], "featured_authors": [{"name": "Lorenzo Bianchi"}, {"name": "Andrea Cavaglià"}, {"name": "A. David Gutiérrez"}, {"name": "Stefanos R. Kousvos"}, {"name": "Marco Meineri"}], "author_count": 5}, {"id": "2609.04041", "category": "hep-th", "title": "Cutting corners: exciting and magical bounds from the cusp bootstrap", "abstract": "An illuminating probe of the dynamics of a line defect is the global geometry of its worldline. For a conformal line defect in a conformal field theory, sharp corners in the worldline, i.e. cusps, host dynamical degrees of freedom characterized in part by a spectrum of scaling dimensions, called cusp anomalous dimensions. We present various general bounds on cusp anomalous dimensions following from unitarity and cutting-and-gluing consistency of different defect geometries. We first establish, for cusps involving conjugate defects, that level crossings upon varying the cusp angle are forbidden between the lightest singlet cusp and any non-singlet cusp, proving that singlet cusps are the lightest. Then, we study line defects arranged in a rectangular geometry, which are subject to bootstrap constraints reminiscent of the spinless modular bootstrap. We find an analytic ``magic\" functional that produces an optimal and universal lower bound on the dimension of a right angle bare cusp in terms of the universal defect Casimir energy between the corresponding defect and its conjugate in flat space.", "url": "https://arxiv.org/abs/2609.04041", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ryan A. Lanzetta"}, {"name": "Ian Moult"}, {"name": "Yifan Wang"}], "featured_authors": [{"name": "Ryan A. Lanzetta"}, {"name": "Ian Moult"}, {"name": "Yifan Wang"}], "author_count": 3}, {"id": "2609.04099", "category": "hep-th", "title": "SCFT/VOA correspondence and R-twisted reductions of $(A_2,D_{3n-2})$ Argyres--Douglas theories", "abstract": "We study the SCFT/VOA correspondence for the $(A_2,D_{3n-2})$ Argyres--Douglas theories with $n\\geq2$. From the matching of the central charges and the equality of the Schur index with the vacuum supercharacter to all orders, we propose that the associated VOA is the logarithmic doublet algebra $\\mathcal A(4n-2)$ of Feigin, Feigin, and Tipunin. For $n=2$, this correspondence was studied in detail by Buican and Nishinaka, and our proposal extends it to $n\\geq3$. Using the Nahm sum expression for the vacuum supercharacter, we further propose a family of 3d $\\mathcal N=2$ abelian Chern--Simons matter theories that flow to the 3d $\\mathcal N=4$ SCFTs obtained by the R-twisted circle reduction, generalizing the $n=2$ construction. We determine the monopole superpotential and show that the Coulomb branch is $\\mathbb C^2/\\mathbb Z_2$ for every $n$. The superconformal index provides quantitative evidence for the proposed infrared fixed points, including the expected enhancement to $\\mathcal N=4$ supersymmetry and the Higgs and Coulomb branch structure.", "url": "https://arxiv.org/abs/2609.04099", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yutaka Yoshida"}], "featured_authors": [{"name": "Yutaka Yoshida"}], "author_count": 1}, {"id": "2609.04107", "category": "hep-th", "title": "The growth of $SO(9)$ super-representations in Type II string theory", "abstract": "We study the growth of massive $SO(9)$ super-representations in type II and type I string theories. We do this first directly by finding an empirical formula that specifies which representations appear at any level, and then compute the multiplicities from a refined partition function evaluated over finite fields up to level 501 for individual representations, and level 226 for all representations. We then derive asymptotic formulae for the growth of any representation, which are constructed by integrating about the peaks of the refined partition function. Using a Rademacher sum we can find very accurate approximations for the multiplicities of the representations. Unlike the superstring partition function, which only receives contributions from the odd Rademacher terms, the multiplicities for any representation have contributions from both even and odd terms. Finally, we apply the same techniques to the ordinary representations, where a simplified refined partition function allows for better computational speed and simpler expressions for the asymptotic approximations.", "url": "https://arxiv.org/abs/2609.04107", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alessandro Georgoudis"}, {"name": "Joseph A. Minahan"}, {"name": "Gustav Ström"}, {"name": "Athanasios Zoumis"}], "featured_authors": [{"name": "Alessandro Georgoudis"}, {"name": "Joseph A. Minahan"}, {"name": "Gustav Ström"}, {"name": "Athanasios Zoumis"}], "author_count": 4}, {"id": "2609.04137", "category": "hep-th", "title": "Boundary conditions for axionic wormholes, imaginary distance bound and KSW allowability", "abstract": "We study four-dimensional axion wormholes in the Lorentzian mini-superspace path integral using dual scalar and three-form flux formulations. We analyze this duality for generic metric boundary conditions and real lapse integration contour, and show that it holds on any background, including complex ones. With the Dirichlet condition on the metric, the fixed-flux path integral is evaluated exactly. In the Euclidean regime, saddle geometries organize into same-side and cross-throat segments of the Giddings-Strominger (GS) wormhole, depending on whether the two boundaries lie on the same or opposite sides of the throat. A Picard-Lefschetz analysis in the covering plane of lapse reveals that the cross-throat saddle has vanishing intersection number, and therefore does not contribute. In the asymptotically flat limit, it corresponds to the imaginary wormhole that saturates the imaginary distance bound (IDB). The same conclusion follows independently on the scalar side of the duality, and is confirmed by the exact amplitude. Replacing the Dirichlet condition with a one-parameter Neumann condition, the cross-throat saddle that leads to the imaginary wormholes remains irrelevant for the physical lift of the contour. This purely imaginary parameter characterizing the Neumann condition interpolates continuously between the half- and complete-wormhole geometries. Convergence of the sum over fixed-charge sectors imposes a corresponding interpolating bound not only on the imaginary part of the boundary axion but also on the parameter characterizing the Neumann boundary condition. An independent analysis based on the KSW criterion reproduces exactly the same bound, emphasizing its compatibility with the IDB.", "url": "https://arxiv.org/abs/2609.04137", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shubhashis Mallik"}, {"name": "Neha"}, {"name": "Gaurav Narain"}], "featured_authors": [{"name": "Shubhashis Mallik"}, {"name": "Neha"}, {"name": "Gaurav Narain"}], "author_count": 3}, {"id": "2609.04191", "category": "hep-th", "title": "Baby-universe state dependence of the wormhole-induced gravi-axion mass gap", "abstract": "Euclidean wormholes can break the axion shift symmetry, and when this symmetry is broken, a periodic potential is created for the axion, and the curvature of this potential at a minimum point can give the axion mass. In this work, we take seriously the assumption that the mere existence of a wormhole does not mean that the axion mass is uniquely determined, and that more information is needed to determine it. We first show that since for a Giddings--Strominger wormhole with symmetry \\(O(4)\\), the gravitational Pontryagin density is zero, the dynamical Chern--Simons interaction can affect quantum effects, including the determinant phase and fermionic selection rules, without changing the classical wormhole action. We also conclude that in a fixed \\(\\alpha\\) sector, the axion can have a specific mass, but this mass depends on the baby-universe state and is not a universal value. Then, for the mixed case of \\(\\alpha\\) sectors that give a distribution of conditional masses, we show that the lower edge of the averaged spectral measure is determined by the essential infimum of the conditional mass squared over the $\\alpha$ distribution. Finally, we conclude that even if almost all individual sectors are massive and the mean mass squared is also non-zero, if the support of the measure accumulates at the symmetric point \\(\\alpha=0\\), the averaged spectral measure will be gapless. To clarify the discussion, we consider a clear example of this situation, which can be a Gaussian baby-universe state, and show that in it the spectral threshold starts at zero and there is no isolated massive pole. Therefore, predicting the mass and cosmology of a gravi-axion from a wormhole without specifying the baby-universe state is not a unique, state-independent prediction.", "url": "https://arxiv.org/abs/2609.04191", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Amin Rezaei Akbarieh"}], "featured_authors": [{"name": "Amin Rezaei Akbarieh"}], "author_count": 1}, {"id": "2609.03034", "category": "math-ph", "title": "Estimating the asymptotics of integer partitions in intermediate dimensions ($d = 3,4,5,6$)", "abstract": "It was recently shown by Yeliussizov \\cite{Yeliussizov} that integer partitions in dimensions $d \\geq 7$ asymptotically grow strictly faster than MacMahon numbers. As MacMahon numbers match with integer partitions in dimensions $d = 1,2$, the comparison of asymptotics of integer partitions with MacMahon numbers in intermediate dimensions ($d = 3,4,5,6$) is an open question. In this work, we perform Markov chain Monte Carlo (MCMC) simulations till $N=15000$ by using adaptive weight learning followed by conventional MCMC steps to numerically estimate the asymptotics of integer partitions in these intermediate dimensions. We numerically establish that in these intermediate dimensions, partitions asymptotically grow faster than MacMahon numbers. More specifically, assuming that the limits exist, we show: $\\lim_{n\\to\\infty}n^{-3/4}\\log p_3(n) = 1.8196 \\pm 0.0019$, $\\lim_{n\\to\\infty}n^{-4/5}\\log p_4(n) = 1.7215 \\pm 0.0045$, $\\lim_{n\\to\\infty}n^{-5/6}\\log p_5(n) = 1.6521 \\pm 0.0059$, and $\\lim_{n\\to\\infty}\\log n^{-6/7}p_6(n) = 1.652 \\pm 0.021$ for partitions in dimensions $d=3,4,5,$ and $6$ respectively. These numbers are all larger than MacMahon leading order asymptotic coefficients of $1.7898, 1.6614, 1.5737,$ and $1.509$ respectively. Additionally, we also find estimates for some of the sub-leading asymptotic terms in $\\log p_d(n)$ in each of the dimensions.", "url": "https://arxiv.org/abs/2609.03034", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Avinandan Mondal"}], "featured_authors": [{"name": "Avinandan Mondal"}], "author_count": 1}, {"id": "2609.03197", "category": "math-ph", "title": "Computational Algorithms for Invariant Reduction of Variational Forms", "abstract": "Symmetry reductions of partial differential equations (PDEs) inherit more geometric structures than other types of reductions: invariant conservation laws, variational structures, and, under suitable conditions, Hamiltonian-type structures of the original model descend to the reduced model through the mechanism of invariant reduction. This paper develops computational algorithms that carry out such reductions explicitly. We use the interpretation of variational $p$-forms as conservation laws of an enlarged system --- the (degree-shifted) tangent system --- consisting of the original equations together with their linearizations, in which the perturbation variables are treated as anticommuting. This allows us to formulate the algorithms using well-known concepts from the theory of conservation laws, naturally adapted to the graded-commutative setting. The reduction of conservation laws, variational $1$-forms, and presymplectic structures thereby becomes a single algorithmic procedure. We present (i) a homotopy-based reduction algorithm for systems of evolution equations, implemented in Maple; (ii) a descent reduction algorithm applicable to general $\\ell$-normal systems for $p>0$; and (iii) a simple reduction algorithm available for point symmetries under suitable conditions, including the description of reductions in terms of systems involving fewer independent variables. Examples include nonlinear evolution equations in one and two spatial dimensions, the Laplace equation, the incompressible Euler equations, and the cotangent system of Pavlov's equation.", "url": "https://arxiv.org/abs/2609.03197", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kostya Druzhkov"}, {"name": "Alexey Shevyakov"}], "featured_authors": [{"name": "Kostya Druzhkov"}, {"name": "Alexey Shevyakov"}], "author_count": 2}, {"id": "2609.03224", "category": "math-ph", "title": "Optimal bounds for embedded eigenvalues of one-dimensional discrete Schrödinger operators with decaying potentials", "abstract": "In this paper, we consider one-dimensional discrete Schrödinger operators \\begin{align} Hu(n)=(\\Delta+V)u(n)\\nonumber \\end{align} on $\\ell^2(\\mathbb{N})$ with a self-adjoint boundary condition at $n=0$, where $\\Delta$ denotes the discrete Laplacian and $V(n)$ is a real-valued perturbation satisfying $$V(n)=\\frac{O(1)}{1+n}.$$ We determine the sharp transition for the asymptotic coefficient of \\(V\\) governing the existence and nonexistence of embedded eigenvalues.", "url": "https://arxiv.org/abs/2609.03224", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jifeng Chu"}, {"name": "Wencai Liu"}, {"name": "Kang Lyu"}], "featured_authors": [{"name": "Jifeng Chu"}, {"name": "Wencai Liu"}, {"name": "Kang Lyu"}], "author_count": 3}, {"id": "2609.03536", "category": "math-ph", "title": "Controllability, returning waves and scattering without reverberation in 3D acoustic dynamic system", "abstract": "The dynamic acoustic scattering system is governed by the wave equation $u_{tt}-\\Delta u+qu=0$ in $\\Bbb R^3,\\,\\,\\,-\\infty<t<\\infty$, with a compactly supported potential $q$ and infinitely distant sources (controls) $f$, which initiate incoming spherical waves $u=u^f(x,t)$ provided $u^f\\big|_{|x|<-t,\\,\\,\\,t<0}=0$. These waves are focused at $x=0$ and fill up the whole space at the moment $t=0$. The system is {\\it controllable} if the set of waves $u^f(\\cdot,0)$ produced by all finite energy controls $f$, covers the space $L_2(\\Bbb R^3)$. As we show, if the Hamiltonian $H=-\\Delta+q$ has the bound states, then in the space the points $a$ appear such that the system, being refocused at $x=a$, loses controllability. The latter leads to a physical effect: the waves $u^f$ of finite energy appear, which vanish simultaneously in the past and future cones $|x|<\\pm\\, t$ and leave the region of inhomogeneity of $q$ without reverberation. This effect has some similarities with the wavefront reversal (Time Reversing Mirror), but is more meaningful from a mathematical point of view.", "url": "https://arxiv.org/abs/2609.03536", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mikhail I. Belishev"}, {"name": "Aleksei F. Vakulenko"}], "featured_authors": [{"name": "Mikhail I. Belishev"}, {"name": "Aleksei F. Vakulenko"}], "author_count": 2}, {"id": "2609.03832", "category": "math-ph", "title": "The conductivity matrix at the topological phase transition", "abstract": "For a general class of two-dimensional non-interacting semi-metallic electron systems on a lattice, we derive an explicit formula for the whole conductivity matrix, by using Euclidean many-body formalism. The semi-metallic phase takes place whenever two Bloch bands touch at the Fermi energy with conical intersections and generally occurs at the transition between distinct integer quantum Hall phases. Unlike the longitudinal conductivity (which depends solely on the shape of the cones at the Fermi level), the transverse conductivity is remarkably determined both by the conical structures of the bands and by the nature of the two nearby topological phases. Generically, in the semi-metallic state, neither the longitudinal nor the transverse conductivities are quantized in integer multiples of a universal conductivity quantum; however, universality of the conductivity matrix is restored under the assumption of emergent rotational symmetry of the linearized Hamiltonian at the Fermi points. Using our formula, we compute the conductivity matrix for several physically relevant models of quantum Hall fluids at the topological phase transition, exhibiting cases where the transverse conductivity is quantized in half-integer multiples of $e^2/h$ and cases where it depends continuously on an external strain parameter, thus shedding light on its universality or non-universality features.", "url": "https://arxiv.org/abs/2609.03832", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Simone Fabbri"}, {"name": "Giovanna Marcelli"}, {"name": "Alessandro Giuliani"}], "featured_authors": [{"name": "Simone Fabbri"}, {"name": "Giovanna Marcelli"}, {"name": "Alessandro Giuliani"}], "author_count": 3}, {"id": "2609.03863", "category": "math-ph", "title": "Classification of abstract Bose field models", "abstract": "We classify a class of abstract Bose field models in quantum field theory up to unitary equivalence. The class includes abstract free Bose field models, abstract van Hove--Miyatake models, and infrared-renormalized van Hove--Miyatake models. Moreover, as an application of our classification, we classify quadratic interaction models. In particular, our results answer a question of A. Arai concerning the classification of infrared-renormalized van Hove--Miyatake models.", "url": "https://arxiv.org/abs/2609.03863", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yasumichi Matsuzawa"}], "featured_authors": [{"name": "Yasumichi Matsuzawa"}], "author_count": 1}, {"id": "2609.04057", "category": "math-ph", "title": "Limits of Stochastic Semigroups and Block-Triangular Majorisation", "abstract": "We investigate limits of semigroups of stochastic matrices defined by their invariant distribution. Given probability vectors $\\gamma(\\beta)$ depending on a parameter $\\beta$, we introduce a notion of convergence as $\\beta\\to\\infty$ for the corresponding semigroups of $\\gamma(\\beta)$-preserving stochastic matrices and investigate the structure of the resulting limit. In general, the limiting semigroup differs from the semigroup preserving the limiting distribution, showing that these two operations do not commute. We develop a general framework for such limiting semigroups and study in detail the case in which the invariant distributions are Gibbs vectors at the inverse temperature $\\beta$. We show that the limiting semigroup consists of block-upper-triangular stochastic matrices subject to additional substochasticity constraints. We characterise and enumerate their extremal elements and determine the preorder on probability vectors induced by the action of the semigroup. The resulting notion of Block-Triangular majorisation interpolates between ordinary majorisation and upper triangular (aka unordered) majorisation. We show that it is completely characterised by a finite family of monotones and analyse the corresponding behaviour of Rényi $\\alpha$-entropies as $\\beta\\to\\infty$.", "url": "https://arxiv.org/abs/2609.04057", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fabio Deelan Cunden"}, {"name": "Jakub Czartowski"}, {"name": "Giovanni Gramegna"}, {"name": "Marilena Ligabò"}], "featured_authors": [{"name": "Fabio Deelan Cunden"}, {"name": "Jakub Czartowski"}, {"name": "Giovanni Gramegna"}, {"name": "Marilena Ligabò"}], "author_count": 4}, {"id": "2609.04060", "category": "math-ph", "title": "A simple derivation of the zero-temperature BCS functional from the reduced BCS Hamiltonian", "abstract": "We consider a grand-canonical reduced BCS Hamiltonian on the full fermionic Fock space with an attractive pairing interaction supported in an energy shell around the Fermi surface. For fixed chemical potential, we prove that the exact finite-volume ground-state energy differs from the minimum of the corresponding finite-volume BCS functional by a volume-independent error. As a consequence, the BCS variational principle is exact for the ground-state energy density in the thermodynamic limit.", "url": "https://arxiv.org/abs/2609.04060", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Christian Hainzl"}, {"name": "Riccardo Panza"}], "featured_authors": [{"name": "Christian Hainzl"}, {"name": "Riccardo Panza"}], "author_count": 2}, {"id": "2609.02999", "category": "quant-ph", "title": "Computing with qLDPC Codes by Climbing the Chain Map Hierarchy", "abstract": "We develop a framework for logical computation with qLDPC codes that places logical Pauli, Clifford, and non-Clifford operations on the same footing. This brings the simple homological description of Pauli logicals to the patchwork landscape of logical Clifford and non-Clifford operations, providing a tool for the discovery of new logical gates. In particular, we define the chain map hierarchy: a family of chain complexes whose homology classes encode logical unitary and code surgery operations at any level of the Clifford hierarchy, precisely analogous to the chain complex description of Pauli logicals. Consequently, intuition for Pauli logicals can be leveraged to discover new logical operations on qLDPC codes. For instance, the familiar ability to deform Pauli logicals with stabilizers---i.e. boundaries of the chain complex---becomes a way to search for constant-depth unitary implementations of (non-)Clifford logical gates. Using this strategy, we discover constant-depth unitary implementations of the full logical Clifford group on any number of blocks of the 2D toric code, including within a single block, and addressable logical CCZ gates on any triple of logical qubits on any number of blocks of the 3D toric code. Beyond manifold codes, we find addressable non-Clifford gates on codes with many encoded qubits. The chain map hierarchy naturally encompasses and extends other constructions of logical gadgets, for instance providing a universal parameterization of cup products. As such, our work provides a unified, useful, and intuitive language for computing with qLDPC codes.", "url": "https://arxiv.org/abs/2609.02999", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rahul Sahay"}, {"name": "David M. Long"}, {"name": "Vedika Khemani"}], "featured_authors": [{"name": "Rahul Sahay"}, {"name": "David M. Long"}, {"name": "Vedika Khemani"}], "author_count": 3}, {"id": "2609.03021", "category": "quant-ph", "title": "Quantum low-density lattice codes", "abstract": "Gottesman-Kitaev-Preskill (GKP) codes provide a family of promising schemes for encoding discrete quantum information (qudits) into infinite-dimensional bosonic modes based on mathematical lattices. While such codes, when concatenated with discrete-variable codes, are relatively well studied, the construction and decoding of native GKP codes has largely remained open due to the computationally hard problems encountered. To address this challenge, we advocate a strategy of co-designing the decoder and the quantum error-correcting code itself by constructing lattices for which decoding is feasible: The requirement of efficient decoding effectively determines the quantum error-correcting code. This construction is built on classical low-density lattice codes (LDLCs), a lattice analogue of low-density parity-check codes, here lifted to families of GKP codes. Concretely, we introduce quantum versions of classical, randomly constructed LDLCs. We show that after suitable dimensionality reduction these codes have code properties comparable to or better than concatenated GKP-surface codes of equal number of modes. However, the GKP-LDLCs constructed here do not have a strictly sparse parity check matrix, which motivates our study of the performance of natively analog message-passing decoders originally developed for LDLCs when applied to concatenated GKP-LDPC codes. We show that the fully analog, linear-time decoder achieves performances close to state-of-the-art hybrid qubit-analog decoders. To facilitate future research on the structure and performance of general GKP codes, the relevant source code will be released in open-source Julia packages this http URL and this http URL .", "url": "https://arxiv.org/abs/2609.03021", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Timo Hillmann"}, {"name": "Jens Eisert"}, {"name": "Francesco Arzani"}], "featured_authors": [{"name": "Timo Hillmann"}, {"name": "Jens Eisert"}, {"name": "Francesco Arzani"}], "author_count": 3}, {"id": "2609.03032", "category": "quant-ph", "title": "Approximate cubic phase states in a trapped ion", "abstract": "Universal quantum computation with continuous variables cannot be attained solely with a set of Gaussian operations, it requires the addition of a non-Gaussian element, at least of third order in the quadrature operators, such as the cubic phase state. In this work, we present a method to generate a quantum state in the vibrational mode of a trapped ion that exhibits characteristics compatible with the cubic phase state, such as the distinctive oscillating pattern in its Wigner function. This state emerges from the nonlinear Jaynes-Cummings interaction native to the trapped-ion model, and under the assumption of an initial coherent vibrational state with a large occupation number. Consequently, the evolved vibrational state approximates the cubic phase state with high fidelity, and we use the variance of a nonlinear combination of the quadratures to characterize it. Finally, we provide an analytical expression for its cubicity that shows the high performance of the approximate vibrational cubic phase state.", "url": "https://arxiv.org/abs/2609.03032", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "C. Ventura-Velázquez"}, {"name": "Juan Mauricio Torres"}], "featured_authors": [{"name": "C. Ventura-Velázquez"}, {"name": "Juan Mauricio Torres"}], "author_count": 2}, {"id": "2609.03053", "category": "quant-ph", "title": "Multi-Boundary Many-Body Quantum Teleportation", "abstract": "Unlike standard quantum teleportation, many-body teleportation uses scrambling to transmit quantum information. In this protocol, initially localized information spreads over many degrees of freedom and is later refocused at the receiver by a simple coupling between the systems, followed by further many-body evolution. The protocol was developed from models of traversable wormholes in holography and has become a useful probe of scrambling. In particular, it can distinguish genuine scrambling from decoherence or noise when out-of-time-order correlators fail, and can reveal signatures of different scrambling mechanisms, including the distinctive behavior expected in holographic systems. Holography predicts that related protocols can transmit information between selected boundaries of multi-boundary wormhole geometries. Motivated by this setting, we study single-qubit many-body teleportation among three systems of qubits. The initial state consists of EPR pairs distributed among them, providing a simple analogue of an infinite-temperature three-boundary holographic state. We analyze the protocol with one-dimensional and all-to-all dynamics, both analytically and numerically using random circuits. We find that the third system suppresses teleportation once the spreading message reaches the region of qubits that are entangled with it. In one dimension, both the minimum coupling required for successful teleportation and the fidelity depend on the distance from the injection site to this region, a feature reminiscent of holographic causal shadows. For all-to-all dynamics, successful teleportation is instead restricted to early times and to sufficiently few qubits entangled with the third system. A third system therefore provides spatial, or subsystem, resolution of information spreading that is absent from the two-sided protocol. Our results offer a step toward many-body teleportation networks.", "url": "https://arxiv.org/abs/2609.03053", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tal Schwartzman"}, {"name": "Antonio F. Rotundo"}, {"name": "Raz Monsonego"}, {"name": "Shira Chapman"}], "featured_authors": [{"name": "Tal Schwartzman"}, {"name": "Antonio F. Rotundo"}, {"name": "Raz Monsonego"}, {"name": "Shira Chapman"}], "author_count": 4}, {"id": "2609.03065", "category": "quant-ph", "title": "Distinctness threshold for pseudorandom unitaries", "abstract": "Pseudorandomness is increasingly recognized as a key property of ensembles in quantum information theory, statistical mechanics, and quantum many-body physics. Yet it appears in two conceptually different forms: statistical pseudorandomness, embodied by unitary designs, and computational pseudorandomness captured by pseudorandom unitaries (PRUs). The relationship between these two forms of pseudorandomness remains surprisingly poorly understood. Existing PRU constructions reveal this interplay where a statistically randomizing ingredient, a unitary design, is combined with classical cryptographic primitives to produce computational pseudorandomness. We show that statistical pseudorandomness is not necessary for computationally pseudorandom unitaries. We do this by replacing the unitary $2$-design layer in the existing constructions with ensembles that are not even state $1$-designs, yet are sufficiently {\\em distinct}, a property we identify to be necessary for any PRU. This yields new non-adaptively secure PRU ensembles whose computational pseudorandomness is obtained without an underlying statistically pseudorandom quantum ensemble, such as a $2$-design. We characterize distinctness via an entangled analogue of anticoncentration and use it to show that distinctness already captures constraints on coherence and imaginarity of PRUs, while identifying broad classes of inputs for which the latter obstruction disappears, enabling real-valued PRUs even for certain (maximally) entangled states. As an application, we use lack of distinctness to constrain the conjectured pseudorandomness of the random phase-Hadamard ensemble to form a PRU.", "url": "https://arxiv.org/abs/2609.03065", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Asad Raza"}, {"name": "Jens Eisert"}, {"name": "Bill Fefferman"}], "featured_authors": [{"name": "Asad Raza"}, {"name": "Jens Eisert"}, {"name": "Bill Fefferman"}], "author_count": 3}, {"id": "2609.03073", "category": "quant-ph", "title": "Optimized Matrix-Product State Simulations of Quantum Error Correction Circuits", "abstract": "Simulating quantum error correction (QEC) circuits including non-Clifford gates at scale is important to accelerate progress toward fault-tolerant quantum computing. Here we demonstrate that matrix product state (MPS) techniques can handle many QEC circuits exactly and without restriction on gate types. Crucially, we find that MPS efficiency depends sensitively on implementation choices, and we introduce a series of targeted optimizations that reduce bond dimensions and simulation time by several orders of magnitude compared to naive approaches. We illustrate this with examples including: (a) a rotated surface code quantum memory up to distance 11, (b) logical Bell-state preparation up to distance 9, (c) a 15-to-1 magic-state distillation circuit including hundreds of QEC rounds that we optimize to be simulated with only 11 logical qubits (187 physical qubits) and a maximal bond dimension of 64 in under 40 seconds, and (d) a narrow, deep random circuit that scales linearly with the number of T gates. These results demonstrate the importance of circuit-level optimizations and position MPS as a valuable complement to near-Clifford simulators for QEC circuits.", "url": "https://arxiv.org/abs/2609.03073", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Asier Piñeiro Orioli"}, {"name": "Chen Zhao"}, {"name": "Guido Masella"}, {"name": "Tommaso Macrì"}, {"name": "Hengyun Zhou"}, {"name": "Shannon Whitlock"}], "featured_authors": [{"name": "Asier Piñeiro Orioli"}, {"name": "Chen Zhao"}, {"name": "Guido Masella"}, {"name": "Tommaso Macrì"}, {"name": "Hengyun Zhou"}, {"name": "Shannon Whitlock"}], "author_count": 6}, {"id": "2609.03092", "category": "quant-ph", "title": "Non-Kolmogorov-Arnold-Moser Quantum Sensors for Quantum Parameter Estimation", "abstract": "Non-KAM (Kolmogorov-Arnold-Moser) systems, when subjected to weak time-dependent perturbations, exhibit an abrupt transition to classical chaos through the breakdown of invariant phase-space tori. We showcase the utilization of non-KAM systems in the quantum regime as quantum sensors, leveraging their sensitivity at \\textit{resonances}. Quantum Fisher information (QFI) is a central quantity in quantum parameter estimation theory that measures how much information a quantum state contains about an unknown parameter that is encoded into it. In other words, it quantifies the sensitivity of a quantum state to small changes in that parameter. In this work, through numerical analysis in conjunction with analytical results, we study the performance of the non-KAM systems for quantum sensing applications by computing the QFI. We find that the growth of the QFI is remarkably enhanced when the resonance condition is satisfied. For frequency estimation under Floquet unitary encodings, we derive a transport bound: if the mean excitation number grows as $\\langle\\hat n(t)\\rangle\\sim t^{\\alpha}$, the QFI obeys $I(t)\\lesssim t^{2\\alpha+2}$. The quantum kicked harmonic oscillator, a paradigmatic non-KAM system, realizes the full hierarchy: localized dynamics ($\\alpha=0$) yield quadratic growth, delocalized diffusion along stochastic webs ($\\alpha=1$) yields quartic growth, and translationally invariant resonances ($\\alpha=2$) saturate the bound with anomalous hexic growth, $I(t)\\sim t^{6}$, established analytically at resonance $R=2$ and numerically at $R=4$. The enhancement stems from resonance-induced translational symmetry rather than exponential instability, identifying non-KAM resonances as a metrological resource distinct from chaos-assisted and criticality-based sensing.", "url": "https://arxiv.org/abs/2609.03092", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Naga Dileep Varikuti"}, {"name": "Sourav Manna"}, {"name": "Athreya Shankar"}, {"name": "Arul Lakshminarayan"}, {"name": "Vaibhav Madhok"}], "featured_authors": [{"name": "Naga Dileep Varikuti"}, {"name": "Sourav Manna"}, {"name": "Athreya Shankar"}, {"name": "Arul Lakshminarayan"}, {"name": "Vaibhav Madhok"}], "author_count": 5}, {"id": "2609.03194", "category": "quant-ph", "title": "Experimental validation of a compact fault-tolerant architecture for trapped ions", "abstract": "Quantum error correction (QEC) is beginning to enable logical operations that outperform their unencoded physical counterparts, but useful fault-tolerant computation will require more than low-error quantum memory. An effective architecture must orchestrate efficient logical encoding, low-overhead logical operations, and access to the non-Clifford resources required for universal computation. Here, we introduce and experimentally validate such an architecture based on the $[[20,2,6]]$ $C_4$-Helix code, designed for the early fault-tolerant regime. Using Quantinuum Helios, a 98-qubit trapped-ion quantum processor, we experimentally demonstrate the principal components of this architecture: we perform repeated quantum error correction with an error of $4.6^{+6.2}_{-2.6}\\times10^{-5}$ per logical qubit per QEC cycle. We benchmark the complete Clifford group on the two logical qubits of a single codeblock under active error correction, obtaining an error of $2.8^{+1.0}_{-1.6}\\times 10^{-4}$ per two-qubit logical Clifford. We further demonstrate a fault-tolerant chain-map interface between $C_4$-Helix and a distance-5 surface code, preparing a heterogeneous three-logical-qubit GHZ state with a fidelity lower bound of $99.925^{+0.068}_{-0.245}\\%$. In each case, the encoded implementation outperforms its corresponding unencoded physical baseline without relying on postselection. Circuit-level simulations indicate that improvements in physical fidelity bring the same architecture into the $10^{-6}$-$10^{-8}$ logical-error regime targeted for early fault-tolerant computation. Together, these results establish $C_4$-Helix as a hardware-validated fault-tolerant architecture rather than a bare quantum memory.", "url": "https://arxiv.org/abs/2609.03194", "type": "实验", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Noah Berthusen"}, {"name": "Ali Lavasani"}, {"name": "Asmae Benhemou"}, {"name": "M.S. Allman"}, {"name": "Joan Dreiling"}, {"name": "Brian Estey"}, {"name": "Cameron Foltz"}, {"name": "Trent Jacobs"}, {"name": "Michael Mills"}, {"name": "Annie Jihyun Park"}, {"name": "Adam P. Reed"}, {"name": "David Hayes"}, {"name": "Tzvetan S. Metodi"}, {"name": "Andrew C. Potter"}], "featured_authors": [{"name": "Noah Berthusen"}, {"name": "Ali Lavasani"}, {"name": "Asmae Benhemou"}, {"name": "David Hayes"}, {"name": "Tzvetan S. Metodi"}, {"name": "Andrew C. Potter"}], "author_count": 14}, {"id": "2609.03226", "category": "quant-ph", "title": "Revealing Many-Body Phases at finite temperatures through Quantum Coherence Distribution", "abstract": "We introduce a diagnostic framework based on the full probability distribution of quantum coherence to probe single-particle and many-body phases at finite temperature. We first apply this approach to the localization transition in the non-interacting Aubry-André model and then extend the analysis to its interacting counterpart, whose phase diagram is substantially richer. We show that the moments of the coherence distribution provide clear signatures of quantum phase transitions and capture the emergence of many-body phases. More importantly, we find that the entropy of the coherence distribution emerges as an even more powerful indicator, retaining clear signatures of the underlying quantum phases while remaining remarkably robust against increasing thermal fluctuatio
