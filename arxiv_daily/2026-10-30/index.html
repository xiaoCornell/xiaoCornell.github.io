 system of equations consisting of an equilibrium equation, infinitesimal strain, and both scalar- and tensor-type stress-gradient Eringen three-dimensional models. Since the system of equations is linear, for each model the solution is obtained in the form of a superposition of the local-type displacement field, common to each model, and the non-local-type displacement field, specific to the non-locality operator of the model. Among the three scalar-type and five tensor-type considered models, six distinct analytical displacement field expressions are obtained for an arbitrary body force: one expression specific to a scalar-type model, three specific to individual tensor-type models, while each of the remaining two expressions are common to one scalar- and one tensor-type model. The displacement vector fields are graphically represented in the case of gravitational body force, yielding five different models, since two tensor-type models become the same when the force is conservative.", "url": "https://arxiv.org/abs/2610.39888", "type": "理论", "summary": "为了获得位移场，无论是在任意体积力的情况下，还是在保守体积力的情况下，通过考虑由平衡方程、无穷小应变和标量型和张量型应力梯度 Eringen 三维模型组成的方程组，在无界域上解析求解三维应力梯度非局部介质的静力学问题。由于方程组是线性的，因此对于每个模型，解都是以每个模型共有的局部型位移场和特定于模型的非局部性算子的非局部型位移场叠加的形式获得的。在所考虑的三个标量型和五个张量型模型中，对于任意体力获得了六个不同的解析位移场表达式：一个特定于标量型模型的表达式，三个特定于单个张量型模型的表达式，而其余两个表达式中的每一个表达式对于一个标量型和一个张量型模型是通用的。\n\n在重力体力的情况下，位移矢量场以图形方式表示，产生五个不同的模型，因为当力保守时两个张量型模型变得相同。", "authors": [{"name": "Slađan Jelić"}, {"name": "Dušan Zorica"}], "featured_authors": [{"name": "Slađan Jelić"}, {"name": "Dušan Zorica"}], "author_count": 2}, {"id": "2610.40231", "category": "math-ph", "title": "Optimization Inverse Spectral Problems for Sturm--Liouville Operators with Potentials in $L^p(0,1)$", "abstract": "We study an optimization inverse spectral problem (OISP) for a one-dimensional Sturm--Liouville operator on a finite interval. The problem is to find a potential $V \\in L^p(0,1)$ that realizes a prescribed finite set $\\lambda_1^* < \\lambda_2^* < \\dots < \\lambda_m^*$ and has the smallest $L^p(0,1)$-distance from an a priori given potential $V_0 \\in L^p(0,1)$. We formulate and prove results on the regularity of the isospectral manifold, the existence of an OISP solution, and an explicit analytic representation of the optimal potential by means of a power map applied to a linear combination of squared eigenfunctions. Using a unified differential-algebraic approach to squared eigenfunctions, we show that whenever these squares are linearly dependent, the corresponding potential can be expressed in terms of them and is an analytic function. For $p=2$, we prove that nondegenerate stationary points are isolated and that the number of global minima is finite provided that each of them is nondegenerate. For every $1<p<\\infty$, we establish uniqueness for the first eigenvalue when $\\lambda_1^*\\ge\\lambda_1(V_0)$ and generic global uniqueness in the sense of Baire category in $L^p(0,1)$. A separate section provides examples with at least two global minima for $m=1,2$ in the presence of a sufficiently high finite symmetric barrier. We describe an iteration with frozen eigenfunctions and a local Newton--KKT method with continuation in the spectral data, and state explicitly the limits of their guarantees. The final part discusses applications of OISP theory to nonlinear boundary value problems and to applied problems of diagnostics and optimal spectral design of acoustic and electromagnetic resonators.", "url": "https://arxiv.org/abs/2610.40231", "type": "理论", "summary": "我们研究有限区间上一维 Sturm--Liouville 算子的优化逆谱问题 (OISP)。问题是找到一个潜在的 $V \\in L^p(0,1)$，它实现指定的有限集 $\\lambda_1^* < \\lambda_2^* < \\dots < \\lambda_m^*$，并且与先验给定的潜在 $V_0 \\in L^p(0,1)$ 具有最小的 $L^p(0,1)$ 距离。我们制定并证明了等谱流形的规律性、OISP 解的存在性以及通过应用于平方本征函数的线性组合的功率图来显式分析表示最佳势的结果。使用统一的微分代数方法来处理平方本征函数，我们表明只要这些平方是线性相关的，相应的势就可以用它们来表示，并且是一个解析函数。对于 $p=2$，我们证明非简并驻点是孤立的，并且全局最小值的数量是有限的，前提是它们每个都是非简并的。对于每个 $1<p<\\infty$，我们在 $\\lambda_1^*\\ge\\lambda_1(V_0)$ 时建立第一个特征值的唯一性，并在 $L^p(0,1)$ 中建立贝尔范畴意义上的通用全局唯一性。\n\n单独的部分提供了在存在足够高的有限对称势垒的情况下至少有两个全局最小值（$m=1,2$）的示例。我们描述了具有冻结特征函数的迭代和具有谱数据连续性的局部牛顿-KKT 方法，并明确说明了它们保证的限制。最后一部分讨论 OISP 理论在非线性边值问题以及声学和电磁谐振器的诊断和优化频谱设计的应用问题中的应用。", "authors": [{"name": "Nur Valeev"}], "featured_authors": [{"name": "Nur Valeev"}], "author_count": 1}, {"id": "2610.40235", "category": "math-ph", "title": "Three-dimensional QCA that are not stably circuits", "abstract": "We prove that the three-dimensional chiral $\\Z_p$ Clifford quantum cellular automata of Haah and of Sun--Yang--Wang--Tantivasadakarn--Chen are, for every odd prime $p$, not finite-depth quantum circuits, even after tensoring with arbitrary ancillary degrees of freedom and composing with translations. Previously such statements were known only inside the Clifford category. As a consequence, the group of three-dimensional QCA modulo stabilized circuits and translations is not finitely generated. The key ingredient is a new invariant of invertible subalgebras, which we conjecture to be the square of the total quantum dimension of the hosted anyon theory, modulo rational squares.", "url": "https://arxiv.org/abs/2610.40235", "type": "理论", "summary": "我们证明，对于每个奇素数 $p$，Haah 和 Sun--Yang--Wang--Tantivasadakarn--Chen 的三维手性 $\\Z_p$ Clifford 量子细胞自动机都不是有限深度的量子电路，即使在使用任意辅助自由度进行张量并与平移组合之后也是如此。此前，此类言论仅在 Clifford 类别内为人所知。因此，三维 QCA 模稳定电路和平移组不是有限生成的。关键成分是可逆子代数的一个新不变量，我们推测它是托管任意子理论的总量子维度的平方，即模有理数平方。", "authors": [{"name": "Bowen Yang"}], "featured_authors": [{"name": "Bowen Yang"}], "author_count": 1}, {"id": "2610.40299", "category": "math-ph", "title": "Bulk gap stability and spectral flow for fermions with weak long-range interactions", "abstract": "We prove that weak long-range many-body interactions preserve the bulk gap of a free fermion system and that a quasi-local spectral flow transports the free ground state to ground states of the interacting system. Let $\\Phi_h$ be a free fermionic interaction, possibly including pairing terms, whose infinite-volume Majorana coefficient operator $h$ has no spectrum in $(-g,g)$, and let $\\mathcal V$ be an even self-adjoint many-body interaction. For sufficiently small $|\\lambda|$, we construct pure ground states $\\omega_{\\lambda}$ of the interacting bulk system $\\Phi_{\\lambda}=\\Phi_h+\\lambda\\mathcal V$ and quasi-local automorphisms $\\beta_{0,\\lambda}$ such that $\\omega_{\\lambda}=\\omega_0\\circ\\beta_{0,\\lambda}$, where $\\omega_0$ is the free ground state of $\\Phi_h$. Each $\\omega_\\lambda$ has a GNS Hamiltonian with gap at least $g-C_*|\\lambda| \\|\\mathcal V\\|_*$, where $\\|\\cdot\\|_*$ is the relevant interaction norm. Our result allows polynomial decay of both the free coefficients and the many-body interaction. For two-site interactions on a uniformly discrete point set $\\Gamma\\subset\\mathbb{R}^d$, a sufficient condition is decay as $(1+|x-y|)^{-\\varpi}$ with $\\varpi>2d$, for both the hopping and pairing coefficients and the interaction terms. The spectral-flow generator preserves the spatial exponent of the polynomial interaction norm, and its automorphisms satisfy locality bounds at that exponent. If $h$ and $\\mathcal V$ have stretched-exponential decay, so does the spectral-flow generator. The proof constructs the spectral flow and establishes the gap through an excitation-number comparison, using polynomial propagation bounds for evolved interactions proved in a companion paper.", "url": "https://arxiv.org/abs/2610.40299", "type": "理论", "summary": "我们证明，弱长程多体相互作用保留了自由费米子系统的体能隙，并且准局域谱流将自由基态传输到相互作用系统的基态。令 $\\Phi_h$ 为自由费米子相互作用，可能包括配对项，其无限体积马约拉纳系数算子 $h$ 在 $(-g,g)$ 中没有谱，并令 $\\mathcal V$ 为偶自伴多体相互作用。对于足够小的$|\\lambda|$，我们构造相互作用体系统$\\Phi_{\\lambda}=\\Phi_h+\\lambda\\mathcal V$的纯基态$\\omega_{\\lambda}$和准局域自同构$\\beta_{0,\\lambda}$，使得$\\omega_{\\lambda}=\\omega_0\\circ\\beta_{0,\\lambda}$，其中$\\omega_0$是自由基态$\\Phi_h$。每个 $\\omega_\\lambda$ 都有一个 GNS 哈密顿量，间隙至少为 $g-C_*|\\lambda| \\|\\mathcal V\\|_*$，其中 $\\|\\cdot\\|_*$ 是相关的交互范数。我们的结果允许自由系数和多体相互作用的多项式衰减。\n\n对于均匀离散点集 $\\Gamma\\subset\\mathbb{R}^d$ 上的两点相互作用，对于跳跃系数和配对系数以及相互作用项，充分条件是衰减为 $(1+|x-y|)^{-\\varpi}$ 且 $\\varpi>2d$。谱流生成器保留多项式相互作用范数的空间指数，并且其自同构满足该指数处的局部性界限。如果 $h$ 和 $\\mathcal V$ 具有拉伸指数衰减，那么谱流生成器也具有拉伸指数衰减。该证明构建了谱流，并通过激励数比较确定了间隙，使用配套论文中证明的演化相互作用的多项式传播界。", "authors": [{"name": "Stefan Teufel"}], "featured_authors": [{"name": "Stefan Teufel"}], "author_count": 1}, {"id": "2610.40316", "category": "math-ph", "title": "Symmetries and exact solutions of stochastic differential equations: the CIR model", "abstract": "It is well known that in the celebrated Cox-Ingersoll-Ross process for interest rates there exists a critical relation among the model parameters. In the present work, we explain this critical relation by studying the symmetries of the stochastic differential equation and compute the solution of the model using this symmetry. In this way we also recover results of a recent paper where this property has been studied within a broader context by analyzing the relationships among the symmetries of stochastic differential equations and their corresponding forward Kolmogorov equations.", "url": "https://arxiv.org/abs/2610.40316", "type": "理论", "summary": "众所周知，在著名的 Cox-Ingersoll-Ross 利率过程中，模型参数之间存在关键关系。在目前的工作中，我们通过研究随机微分方程的对称性来解释这种关键关系，并使用这种对称性计算模型的解。通过这种方式，我们还恢复了最近一篇论文的结果，其中通过分析随机微分方程及其相应的前向柯尔莫哥洛夫方程的对称性之间的关系，在更广泛的背景下研究了该性质。", "authors": [{"name": "Miguel A. Rodríguez"}], "featured_authors": [{"name": "Miguel A. Rodríguez"}], "author_count": 1}, {"id": "2610.40337", "category": "math-ph", "title": "Local determination of low-energy states in gapped fermion systems with weak long-range interactions", "abstract": "We consider bulk-gapped fermion systems whose infinite-volume bulk is obtained by adding sufficiently weak even many-body interactions to a free Hamiltonian with spectral gap $g>0$, allowing polynomial spatial decay of both parts. We prove quantitative local determination of low-energy states: whenever another interaction agrees with the bulk interaction inside a finite or infinite region $U$, with bulk terms crossing its boundary unchanged or removed, all its states with excitation energies in $[0,3g/4]$ have local expectations close to those of the bulk ground state deep inside $U$. The error decays with the distance to the complement of $U$, independently of the interaction terms supported outside $U$ and of the chosen low-energy state. Quantitative local determination has strong consequences. (i) The bulk interaction has a unique algebraic ground state. (ii) A strong \"local perturbations perturb locally\" (LPPL) principle holds: arbitrary distant defects change local ground-state expectations only by a spatially decaying error. (iii) Low-energy excitations in finite samples remain localized near the boundary for all times, up to spatially decaying tails, uniformly over arbitrary even boundary terms. (iv) Correlations from deep inside $U$ to outside $U$ are small, with quantitative bounds in terms of spatial separation and distance to $U^c$. To prove local determination of low-energy states, we combine quasi-adiabatic transport of the free ground state to the interacting bulk ground state with a new condition, local excitation detectability (LED). A companion paper establishes gap stability and constructs the transport for weak interactions, while we prove LED at sufficiently weak coupling. The abstract theorem is nonperturbative and applies whenever the transport and LED hypotheses hold.", "url": "https://arxiv.org/abs/2610.40337", "type": "理论", "summary": "我们考虑体间隙费米子系统，其无限体积体是通过将足够弱的多体相互作用添加到谱间隙 $g>0$ 的自由哈密顿量来获得的，允许两个部分进行多项式空间衰减。我们证明了低能态的定量局部确定：每当另一个相互作用与有限或无限区域 $U$ 内的体相互作用一致时，跨越其边界的体项保持不变或被删除，其激发能在 $[0,3g/4]$ 中的所有状态都具有接近于 $U$ 深处的体基态的局部期望。误差随着到 $U$ 的补数的距离而衰减，与 $U$ 外部支持的相互作用项和所选的低能态无关。定量的本地确定具有很强的后果。 (i) 体相互作用具有独特的代数基态。 （ii）强大的“局部扰动局部扰动”（LPPL）原理成立：任意远距离缺陷仅通过空间衰减误差改变局部基态期望。\n\n(iii) 有限样本中的低能激发始终保持在边界附近，直到空间衰减尾部，在任意偶数边界项上均匀分布。 (iv) 从 $U$ 内部深处到 $U$ 外部的相关性很小，在空间分离和到 $U^c$ 的距离方面存在定量界限。为了证明低能态的局部确定，我们将自由基态到相互作用的体基态的准绝热输运与新条件局部激发可检测性（LED）相结合。另一篇论文建立了能隙稳定性并构建了弱相互作用的传输，同时我们证明了 LED 在足够弱的耦合下。抽象定理是非微扰的，并且只要输运和 LED 假设成立就适用。", "authors": [{"name": "Stefan Teufel"}], "featured_authors": [{"name": "Stefan Teufel"}], "author_count": 1}, {"id": "2610.40435", "category": "math-ph", "title": "Twinor Theory: Field Equations from $(A)dS_4^{\\mathbb C}$ Spin-Tractors: A Twin to Twistor Theory Modelled on $(A)dS_4^{\\mathbb C}$", "abstract": "Twinor theory is formulated as a spacetime-based counterpart to twistor theory using holomorphic reductive Cartan geometry modelled on complexified $(A)dS_4$. The fundamental spin-tractor bundle defines Dirac twinors, its symmetric powers define ladder twinors, and their extremal Lorentz components define chiral twinors. The general \\textit{twinor field equation} is $D\\mathbf Y=\\mathbf J$. Its adjacent contractions and mixed divergence are constrained by source relations; no additional equation is imposed on its completely symmetric projection. On a flat torsion-free Lorentzian background, the adjacent equations with the mass-normalization source and vanishing additional contracted sources, together with vanishing mixed divergence, reproduce the massive \\textit{Dirac--Fierz--Pauli system}; the massless chiral realization gives the zero-rest-mass equations. Within the fixed mass normalization, the reality condition yielding a positive real mass squared is the \\textit{anti-de Sitter reality condition} on the particle scale, independently of the cosmological scale and background curvature. The mass-coupling phase is therefore present in the classical connection before quantization. Nonlinear gravity is formulated through the full adjoint curvature, with energy--momentum and spin currents specifying Einstein--Cartan dynamics without requiring an action. The adjoint Bianchi identity constrains source compatibility, while a BGG-type sequence organizes torsion-free infinitesimal deformations. Matter interactions enter through the coupled connection and contracted source relations, with curvature compatibility recorded by $D\\mathbf J=\\mathcal F_D\\mathbf Y$. Both chiralities are retained, and the additional consistency requirements for interacting higher-spin fields are distinguished from the underlying bundle construction.", "url": "https://arxiv.org/abs/2610.40435", "type": "理论", "summary": "Twinor 理论被表述为扭量理论的基于时空的对应物，使用基于复数 $(A)dS_4$ 建模的全纯还原嘉当几何。基本的自旋牵引束定义了狄拉克孪生，其对称幂定义了梯形孪生，其极值洛伦兹分量定义了手性孪生。一般的\\textit{孪生场方程}为$D\\mathbf Y=\\mathbf J$。它的相邻收缩和混合发散受到源关系的约束；其完全对称的投影没有附加任何方程。在平坦的无扭转洛伦兹背景下，具有质量归一化源和消失的附加收缩源的相邻方程，以及消失的混合散度，再现了巨大的 \\textit{Dirac--Fierz--Pauli 系统}；无质量手性实现给出了零静止质量方程。在固定质量归一化内，产生正实质量平方的现实条件是粒子尺度上的 \\textit{反德西特现实条件}，与宇宙尺度和背景曲率无关。因此，质量耦合阶段出现在量子化之前的经典连接中。\n\n非线性引力是通过完整的伴随曲率来表述的，能量——动量和自旋流指定了爱因斯坦——嘉当动力学，而不需要任何动作。伴随的 Bianchi 恒等式限制了源兼容性，而 BGG 型序列组织了无扭转的无限小变形。物质相互作用通过耦合连接和收缩源关系进入，曲率兼容性由 $D\\mathbf J=\\mathcal F_D\\mathbf Y$ 记录。两种手性都被保留，并且相互作用的高自旋场的额外一致性要求与底层的束结构不同。", "authors": [{"name": "Chen-Hsu Chien"}], "featured_authors": [{"name": "Chen-Hsu Chien"}], "author_count": 1}, {"id": "2610.40463", "category": "math-ph", "title": "Entropic Fluctuations in Quantum Statistical Mechanics: A Review", "abstract": "The celebrated Evans--Searles, respectively Gallavotti--Cohen, fluctuation theorem concerns certain universal statistical features of the entropy production rate of a classical system in a transient, respectively steady, state. In this paper, we review and compare several possible extensions of these fluctuation theorems to quantum systems. We present, in an introductory way, the approach proposed in a recent series of works [Lett. Math. Phys. 114, 32 (2024): doi: https://doi.org/10.1007/s11005-024-01777-0 ], [Rev. Math. Phys 38, 2461006 (2026): doi: https://doi.org/10.1142/S0129055X24610063 ], [Commun. Math. Phys. 406, 201 (2025): https://doi.org/10.1007/s00220-025-05360-z ] and [J. Math. Phys. 67, 022101 (2026): doi: https://doi.org/10.1063/5.0311182 ] including a previously missing extension of the Gallavotti--Cohen (steady state) version of the FT to two-time measurement entropy production in the algebraic setting of quantum dynamical systems. We focus on the open quantum systems, where a small system interacts with several (infinitely extended) reservoirs, and discuss the following approaches: naive, two-time measurement, phase space contraction and ancilla state tomography. We review the connection with modular theory. The latter provides a way to extend the classical notions to the quantum domain. We discuss the quantum version of the principle of regular entropic fluctuations, introduced in the classical context in [Nonlinearity 24, 699 (2011): doi: https://doi.org/10.1088/0951-7715/24/3/003 ]. Finally, we relate the statistical properties of these various notions of entropy production to spectral resonances of quantum transfer operators and apply this approach to a paradigmatic model of non-equilibrium statistical mechanics: the spin-fermion model. The results presented here shed a new light on the nature of entropic fluctuations in quantum statistical mechanics.", "url": "https://arxiv.org/abs/2610.40463", "type": "理论", "summary": "著名的埃文斯-塞尔斯和加拉沃蒂-科恩涨落定理涉及瞬态和稳定状态下经典系统熵产率的某些普遍统计特征。在本文中，我们回顾并比较了这些涨落定理对量子系统的几种可能的扩展。我们以介绍性的方式介绍了最近一系列作品中提出的方法[Lett。数学。物理。 114, 32 (2024)：doi：https://doi.org/10.1007/s11005-024-01777-0 ]，[修订版。数学。 Phys 38, 2461006 (2026): doi: https://doi.org/10.1142/S0129055X24610063 ], [Commun.数学。物理。 406, 201 (2025)：https://doi.org/10.1007/s00220-025-05360-z] 和 [J。数学。物理。 67, 022101 (2026): doi: https://doi.org/10.1063/5.0311182 ] 包括以前缺失的 FT 的 Gallavotti-Cohen（稳态）版本的扩展，以在量子动力系统的代数设置中产生两次测量熵。我们关注开放量子系统，其中一个小系统与多个（无限扩展）储层相互作用，并讨论以下方法：朴素、两次测量、相空间收缩和辅助态断层扫描。\n\n我们回顾一下与模块化理论的联系。后者提供了一种将经典概念扩展到量子领域的方法。我们讨论了规则熵涨落原理的量子版本，该原理在 [Nonlinearity 24, 699 (2011): doi: https://doi.org/10.1088/0951-7715/24/3/003 ] 的经典上下文中引入。最后，我们将熵产生的这些不同概念的统计特性与量子转移算子的谱共振联系起来，并将这种方法应用于非平衡统计力学的范例模型：自旋费米子模型。这里提出的结果为量子统计力学中熵涨落的本质提供了新的视角。", "authors": [{"name": "Tristan Benoist"}, {"name": "Laurent Bruneau"}, {"name": "Vojkan Jakšić"}, {"name": "Aannalisa Panati"}, {"name": "Claude-Alain Pillet"}], "featured_authors": [{"name": "Tristan Benoist"}, {"name": "Laurent Bruneau"}, {"name": "Vojkan Jakšić"}, {"name": "Aannalisa Panati"}, {"name": "Claude-Alain Pillet"}], "author_count": 5}, {"id": "2610.37745", "category": "quant-ph", "title": "Defining 2-group symmetries on lattices and extracting their anomalies", "abstract": "Ordinary $0$-form symmetries $G$ can mix with $1$-form symmetries $\\Pi_2$ to form a $2$-group $\\mathcal{G}$. We give a concrete lattice definition for a class of finite $2$-group symmetries in terms of local relations among symmetry operators. These relations identify the Postnikov class $[\\rho]\\in H^3(BG,\\Pi_2)$ that characterizes the mixing. We develop a method to extract anomalies of these symmetries in one spatial dimension by restricting symmetry operations to an interval and comparing their composition near its endpoints. We also construct explicit qubit symmetry actions in $d=1,2,3$ spatial dimensions for a $2$-group with $G=\\Pi_2=\\mathbb{Z}_2$. These actions share the same nontrivial Postnikov class but include both anomaly-free and anomalous realizations. Their cohomological anomalies are classified by $H^{d+2}(B\\mathcal G,U(1))$, which is $\\mathbb{Z}_2$ for $d=1,2$ and $\\mathbb{Z}_2\\times\\mathbb{Z}_2$ for $d=3$, and our constructions realize every class in these dimensions. Our results connect higher-group symmetry and its anomalies to concrete lattice operations, providing a microscopic framework for studying anomalous symmetries.", "url": "https://arxiv.org/abs/2610.37745", "type": "理论", "summary": "普通$0$形式的对称性$G$可以与$1$形式的对称性$\\Pi_2$混合形成$2$形式的对称性$\\mathcal{G}$。我们根据对称算子之间的局部关系给出一类有限 $2$ 群对称性的具体格定义。这些关系标识了表征混合的 Postnikov 类 $[\\rho]\\in H^3(BG,\\Pi_2)$。我们开发了一种方法，通过将对称操作限制在一个区间内并比较其端点附近的组成，来提取一个空间维度中这些对称性的异常。我们还为 $G=\\Pi_2=\\mathbb{Z}_2$ 的 $2$ 组在 $d=1,2,3$ 空间维度上构造显式量子位对称操作。这些动作共享相同的重要 Postnikov 类，但包括无异常和异常实现。它们的上同调异常按 $H^{d+2}(B\\mathcal G,U(1))$ 分类，对于 $d=1,2$ 为 $\\mathbb{Z}_2$ ，对于 $d=3$ 为 $\\mathbb{Z}_2\\times\\mathbb{Z}_2$ ，我们的构造实现了这些维度中的每个类。我们的结果将高群对称性及其异常与具体的晶格运算联系起来，为研究反常对称性提供了微观框架。", "authors": [{"name": "Yitao Feng"}, {"name": "Yu-An Chen"}], "featured_authors": [{"name": "Yitao Feng"}, {"name": "Yu-An Chen"}], "author_count": 2}, {"id": "2610.37772", "category": "quant-ph", "title": "Magic in Grover's Algorithm and the Role of Oracle Synthesis", "abstract": "Grover's algorithm is a textbook example of quantum advantage, providing a quadratic query speedup over classical methods for unstructured search. In this Letter, we characterize the non-stabilizerness, or magic, developed throughout Grover's protocol, quantifying quantum complexity with respect to the efficiently simulable stabilizer states. First, we compute the compilation-independent magic at the end of each Grover iteration, deriving an analytic prediction for the stabilizer Rényi entropy and proving that it remains intensive as the system size grows. We then investigate the magic overhead due to decomposing the circuit into elementary gates. When the solution to the search problem is known, we show that an efficient decomposition exists that keeps magic bounded despite using an extensive number of Toffoli gates. In contrast, agnostic implementations are expected to generate volume-law non-stabilizerness, as we confirm for the 3-SAT problem, which rules out efficient simulation by stabilizer-based methods in practically relevant cases. Our findings clarify the growth of magic in Grover's algorithm and the role of solution-awareness in its circuit compilation.", "url": "https://arxiv.org/abs/2610.37772", "type": "理论+数值", "summary": "Grover 的算法是量子优势的教科书示例，与非结构化搜索的经典方法相比，提供了二次查询加速。在这封信中，我们描述了在整个 Grover 协议中开发的非稳定器或魔法，量化了与有效可模拟稳定器状态相关的量子复杂性。首先，我们在每次 Grover 迭代结束时计算与编译无关的魔力，得出稳定器 Rényi 熵的分析预测，并证明它随着系统规模的增长而保持密集。然后我们研究由于将电路分解为基本门而产生的魔法开销。当搜索问题的解决方案已知时，我们表明存在有效的分解，尽管使用了大量的 Toffoli 门，但仍能保持魔力有限。相反，正如我们对 3-SAT 问题所确认的那样，不可知的实现预计会产生体积定律非稳定器，这排除了在实际相关情况下通过基于稳定器的方法进行有效模拟的可能性。我们的研究结果阐明了 Grover 算法的魔力增长以及解决方案意识在其电路编译中的作用。", "authors": [{"name": "Alessio Paviglianiti"}, {"name": "Vincenzo Savona"}], "featured_authors": [{"name": "Alessio Paviglianiti"}, {"name": "Vincenzo Savona"}], "author_count": 2}, {"id": "2610.37791", "category": "quant-ph", "title": "Topological Quantum Error-Correcting Thresholds of a Symmetry-Enriched Toric Code", "abstract": "We study the error thresholds of a new topological quantum error-correcting code under the independent bit-flip and phase-flip noisy channel. By mapping to classical spin-glass models, we find that if Pauli X and Z errors are equally probable, the threshold of vertex syndromes is improved by 30% compared to that of the toric code, while the threshold of plaquette syndromes is lowered. Both thresholds increase when the Z component is less likely than the X component, reaching 0.5 if the Z component is absent. An analytical proof justifies this special case of perfect correctability, and a disordered version of Peierls's argument establishes a lower bound for the vertex-syndrome threshold.", "url": "https://arxiv.org/abs/2610.37791", "type": "理论", "summary": "我们研究了一种新型拓扑量子纠错码在独立位翻转和相位翻转噪声信道下的错误阈值。通过映射到经典的自旋玻璃模型，我们发现，如果泡利X和Z错误的概率相同，则与环面代码相比，顶点综合症的阈值提高了30％，而斑块综合症的阈值降低了。当 Z 分量的可能性小于 X 分量时，两个阈值都会增加，如果 Z 分量不存在则达到 0.5。分析证明证明了这种完美可纠正性的特殊情况，而 Peierls 论证的无序版本则建立了顶点综合症阈值的下限。", "authors": [{"name": "Jiasheng He"}, {"name": "Ryan Thorngren"}], "featured_authors": [{"name": "Jiasheng He"}, {"name": "Ryan Thorngren"}], "author_count": 2}, {"id": "2610.37807", "category": "quant-ph", "title": "Lower Bound for Region of Non-Distillable Magic States", "abstract": "Magic states are a leading proposal for realizing fault-tolerant and universal quantum computation. At the present moment, much of the theory of magic states is not understood. Even simple questions such as what single qubit states have magic remain open. In Campbell and Browne's seminal paper on bound magic states, they prove the existence of states outside of the stabilizer octahedron which cannot be used to achieve universal computation. In this paper we expand upon their proof and determine a lower-bound on this region.", "url": "https://arxiv.org/abs/2610.37807", "type": "理论", "summary": "魔态是实现容错和通用量子计算的领先提议。目前，魔法状态的大部分理论尚不为人们所理解。即使是简单的问题，例如什么单量子位状态具有魔力，仍然悬而未决。在坎贝尔和布朗关于束缚魔态的开创性论文中，他们证明了稳定八面体之外的状态的存在，这些状态不能用于实现通用计算。在本文中，我们扩展了他们的证明并确定了该区域的下界。", "authors": [{"name": "Akul Sethi"}], "featured_authors": [{"name": "Akul Sethi"}], "author_count": 1}, {"id": "2610.37831", "category": "quant-ph", "title": "Stellar Representation of Gottesman Kitaev Preskill States on the Double Discrete Cylinder", "abstract": "Covariant integral quantization is developed on the double discrete cylinder phase space, with the torus as configuration space, and yields the Wigner distribution and the stellar representation. This phase space is particularly well suited to translationally invariant states, such as the Gottesman Kitaev Preskill (GKP) states. These states are central to fault-tolerant quantum computing architectures, yet their quantum resources are still under investigation. The stellar representations of ideal GKP logical states, which behave as phase eigenstates of the double discrete cylinder, have no zeros on this phase space, whereas those of their superpositions have infinitely many. The vacuum, although Gaussian, has zeros on this phase space, and the zeros of finitely squeezed GKP states move with the widths of the peaks and of the envelope, and reach this phase space for fine-tuned widths. These features echo the role of the vacuum as the resource that makes GKP-based architectures hard to simulate.", "url": "https://arxiv.org/abs/2610.37831", "type": "理论", "summary": "协变积分量化是在双离散柱相空间上发展起来的，以环面为配置空间，并产生维格纳分布和恒星表示。该相空间特别适合平移不变状态，例如 Gottesman Kitaev Preskill (GKP) 状态。这些状态是容错量子计算架构的核心，但它们的量子资源仍在研究中。理想 GKP 逻辑态的恒星表示（表现为双离散柱面的相本征态）在该相空间上没有零点，而它们的叠加态则有无穷多个零点。真空虽然是高斯分布，但在该相空间上有零点，有限压缩 GKP 态的零点随着峰和包络的宽度移动，并到达该相空间以进行微调宽度。这些功能呼应了真空作为资源的作用，使得基于 GKP 的架构难以模拟。", "authors": [{"name": "Aidan Zlotak"}, {"name": "Nicolas Fabre"}, {"name": "Romain Murenzi"}], "featured_authors": [{"name": "Aidan Zlotak"}, {"name": "Nicolas Fabre"}, {"name": "Romain Murenzi"}], "author_count": 3}, {"id": "2610.37840", "category": "quant-ph", "title": "Ground-state energy estimation compiled on cat qubits: 7 164 qubits for FeMoco-54 in 23.5 hours", "abstract": "We provide a detailed resource estimate of the state-of-the-art sum-of-squares block encoding algorithm for electronic structure Hamiltonians of Low et al. on superconducting cat qubits. To achieve this, we present compilations with closed-form costs of the dominant subroutines such as skew-tree Qrom, a Swap network and a Phaseup for both a repetition-cat and an LDPC-cat architecture. Our compilation represents algorithmic qubits in the $X$ basis, taking advantage of the asymmetric cost of $X$ and $Z$ access that the concatenation of cat qubits with phase-flip classical code brings. Additionally, we provide a protocol for $\\vert i \\rangle$-state distillation and a two-level Toffoli-like $\\vert \\text{C}_X\\text{C}_X X \\rangle$ magic state distillation protocol, including three factory layouts. To minimize the cost of Clifford corrections induced by magic state injections we tailor injection gadgets to each subroutine. Combining our compilation work with the adder compilation from the companion work Pappalardo et al., we provide global layouts for the block encoding in both architectures which we use to obtain resource estimates for ground-state energy estimation for the benchmarks of FeMoco-54 and FeMoco-76. Assuming a cycle time of 1$\\mu$s, a reaction time of 10$\\mathrm{\\mu}$s, a phase estimation precision of 1 mHa and circuit-level phase-flip noise with probability $p_Z = 5 \\times 10^{-4}$ with negligible bit-flip error, FeMoco-54 requires fewer than $7\\,500$ cat qubits with an expected runtime of under one day for a single phase estimation run using an LDPC-cat architecture. Relaxing the bit-flip requirement to $p_X = 10^{-11}$ with an additional layer of elevator codes raises this to an estimated $13\\,000$ cat qubits.", "url": "https://arxiv.org/abs/2610.37840", "type": "理论+数值", "summary": "我们为 Low 等人的电子结构哈密顿量提供了最先进的平方和块编码算法的详细资源估计。关于超导猫量子位。为了实现这一目标，我们提供了主要子例程的封闭形式成本的编译，例如用于重复猫和 LDPC-cat 架构的斜树 Qrom、交换网络和 Phaseup。我们的编译代表了基于 $X$ 的算法量子位，利用了 cat 量子位与相翻转经典代码的串联带来的 $X$ 和 $Z$ 访问的不对称成本。此外，我们还提供了 $\\vert i \\rangle$ 状态蒸馏协议和类似两级 Toffoli 的 $\\vert \\text{C}_X\\text{C}_X X \\rangle$ 魔法状态蒸馏协议，包括三个工厂布局。为了最大限度地减少由魔法状态注入引起的 Clifford 校正的成本，我们为每个子例程定制了注入小工具。\n\n将我们的编译工作与 Pappalardo 等人的配套工作的加法器编译相结合，我们为两种架构中的块编码提供了全局布局，我们用它来获取 FeMoco-54 和 FeMoco-76 基准的基态能量估计的资源估计。假设循环时间为 1$\\mu$s，反应时间为 10$\\mathrm{\\mu}$s，相位估计精度为 1 mHa，电路级相位翻转噪声的概率为 $p_Z = 5 \\times 10^{-4}$，位翻转误差可忽略不计，FeMoco-54 需要少于 $7\\,500$ 的猫量子位，单个量子位的预期运行时间不到一天。使用 LDPC-cat 架构运行相位估计。通过附加一层电梯代码将位翻转要求放宽至 $p_X = 10^{-11}$，将其提高到估计 $13\\,000$ 猫量子位。", "authors": [{"name": "Larissa Kroell"}, {"name": "Hugo Jacinto"}, {"name": "Victor Hertz"}, {"name": "Axel Pappalardo"}, {"name": "Adel Ben Moussa"}, {"name": "Manuel Rispler"}, {"name": "Peter Shanahan"}, {"name": "Élie Gouzien"}, {"name": "Christophe Vuillot"}, {"name": "Vivien Londe"}], "featured_authors": [{"name": "Larissa Kroell"}, {"name": "Hugo Jacinto"}, {"name": "Victor Hertz"}, {"name": "Élie Gouzien"}, {"name": "Christophe Vuillot"}, {"name": "Vivien Londe"}], "author_count": 10}, {"id": "2610.37894", "category": "quant-ph", "title": "Twisted Fourier Analysis of Quantum Weight Enumerators", "abstract": "A unified Fourier framework for quantum weight enumerators of prime-power-dimensional qudits is developed in this paper. We introduce the notions of Weyl power spectrum and Weyl-conjugation autocorrelation for the Weyl-operator quantities nderlying the Shor--Laflamme weight enumerators. Representing these quantities as formal vectors, we show that they form a symplectic Fourier transform pair, from which the quantum MacWilliams identity follows by applying the Hamming-weight functional. This framework extends to a family of twisted Fourier transforms, including the Rains shadow transform. We show that identical-copy Bell sampling corresponds to a twisted autocorrelation related to the shadow enumerator through Weyl translation and Hamming projection. We further prove that all twisted Fourier transforms are Weyl translations of either the ordinary MacWilliams transform or the Rains shadow transform. This two-class reduction implies that the twists yield no additional independent coefficientwise positivity constraints under compatible projections. Nevertheless, the framework leads to refined MacWilliams and shadow identities that retain more Fourier information than ordinary Hamming weight enumerators. We employ these refined identities in linear programming, together with simplex mapping and shadow-coset counting, to exclude surviving candidate weight distributions. These techniques yield tighter bounds for binary and qutrit quantum codes, including nonexistence results for specific code parameters.", "url": "https://arxiv.org/abs/2610.37894", "type": "理论", "summary": "本文开发了一个用于素数幂维量子的量子权枚举器的统一傅里叶框架。我们介绍了 Shor-Laflamme 权重枚举器下的 Weyl 算子量的 Weyl 功率谱和 Weyl 共轭自相关的概念。将这些量表示为形式向量，我们证明它们形成了一个辛傅里叶变换对，通过应用汉明权泛函可以得出量子麦克威廉斯恒等式。该框架扩展到一系列扭曲傅里叶变换，包括雷恩斯阴影变换。我们通过 Weyl 平移和 Hamming 投影证明，相同副本贝尔采样对应于与影子枚举器相关的扭曲自相关。我们进一步证明所有扭曲傅里叶变换都是普通 MacWilliams 变换或 Rains 阴影变换的 Weyl 翻译。这种两类约简意味着在兼容的投影下，扭曲不会产生额外的独立系数正性约束。\n\n尽管如此，该框架导致了精致的麦克威廉姆斯和影子恒等式，它们比普通的汉明权重枚举器保留了更多的傅立叶信息。我们在线性规划中使用这些精炼的恒等式，以及单纯形映射和影子陪集计数，来排除幸存的候选权重分布。这些技术为二进制和四元量子代码提供了更严格的界限，包括特定代码参数的不存在结果。", "authors": [{"name": "Ching-Yi Lai"}], "featured_authors": [{"name": "Ching-Yi Lai"}], "author_count": 1}, {"id": "2610.37948", "category": "quant-ph", "title": "Ontology without states: PBR as an argument for dynamics-first realism", "abstract": "The Pusey--Barrett--Rudolph (PBR) theorem is commonly taken to establish that a pure quantum state represents a physical property of the system to which it is assigned, rather than merely encoding knowledge. In this work, I distinguish between state-first and dynamics-first physical theories, and argue that this reading presupposes the former. These two types of theories support different approaches to causal explanation, and one of PBR's stated assumptions depends on the state-first approach. Using a recent interpretation of quantum theory as a concrete example, I show how a dynamics-first theory can explain the PBR correlations while maintaining a broadly epistemic reading of quantum states. I conclude that the PBR theorem supports a dilemma: either the quantum state is part of reality, or reality is not fundamentally built out of states.", "url": "https://arxiv.org/abs/2610.37948", "type": "理论", "summary": "普西-巴雷特-鲁道夫 (PBR) 定理通常用于建立纯量子态代表其所属系统的物理属性，而不仅仅是编码知识。在这项工作中，我区分了状态优先和动力学优先的物理理论，并认为这种解读以前者为前提。这两类理论支持不同的因果解释方法，并且 PBR 的一个既定假设取决于状态优先方法。以最近对量子理论的解释作为具体例子，我展示了动力学优先理论如何解释 PBR 相关性，同时保持对量子态的广泛认知解读。我的结论是，PBR 定理支持一个困境：要么量子态是现实的一部分，要么现实根本上不是由状态构建的。", "authors": [{"name": "Nick Ormrod"}], "featured_authors": [{"name": "Nick Ormrod"}], "author_count": 1}, {"id": "2610.37991", "category": "quant-ph", "title": "Reducing the cost of ancilla purification for Majorana quantum computation", "abstract": "Braiding Majorana zero modes does not by itself provide a universal set of quantum gates. Additional operations can be supplied through ancillary states, whose preparation need not have the same protection as braiding. Here, we consider purification of the non-Gaussian ancilla used for an entangling gate in Bravyi's scheme. We keep his elementary braid-and-fusion comparison and change how its outputs are combined. An additional layer compares the product of the three stabilizer signs. The first accepted errors giving an incorrect output then require three faulty input blocks rather than two. As a result, the preparation error decreases cubically instead of quadratically, and the asymptotic raw-copy overhead is reduced. We also construct a preliminary sequence in which a processed block is paired with a fresh copy from the same noisy source. For independent inputs supported in the even-parity sector and ideal purification operations, this sequence establishes a sufficient distillability fidelity of 59.95 percent after free Gaussian twirling. At a common source fidelity, it reduces the expected cost of preparing an input for the recurrence by more than seven orders of magnitude relative to the balanced construction studied here. Finally, we examine imperfect purification operations in an effective syndrome-noise model. The additional layer leaves the leading operation-error coefficient unchanged, although a nonzero error floor remains.", "url": "https://arxiv.org/abs/2610.37991", "type": "理论", "summary": "编织马约拉纳零模式本身并不提供一组通用的量子门。可以通过辅助状态提供附加操作，其准备不需要与编织相同的保护。在这里，我们考虑对 Bravyi 方案中用于纠缠门的非高斯辅助进行净化。我们保留他的基本编织和融合比较，并改变其输出的组合方式。附加层比较三个稳定剂符号的乘积。第一个接受的错误给出不正确的输出，然后需要三个错误的输入块而不是两个。结果，准备误差以三次方而不是二次方的方式减少，并且渐近原始复制开销也减少了。我们还构建了一个初步序列，其中已处理的块与来自同一噪声源的新副本配对。对于偶校验区域和理想纯化操作中支持的独立输入，该序列在自由高斯旋转后建立了 59.95% 的足够蒸馏度保真度。\n\n在公共源保真度下，相对于此处研究的平衡结构，它可以将准备重复输入的预期成本降低七个数量级以上。最后，我们在有效的综合症噪声模型中检查不完美的净化操作。尽管保留了非零误差基底，但附加层使主要操作误差系数保持不变。", "authors": [{"name": "Piotr {Ć}wikli{ń}ski"}, {"name": "Łukasz Fojcik"}, {"name": "Michał Studzi{ń}ski"}], "featured_authors": [{"name": "Piotr {Ć}wikli{ń}ski"}, {"name": "Łukasz Fojcik"}, {"name": "Michał Studzi{ń}ski"}], "author_count": 3}, {"id": "2610.38048", "category": "quant-ph", "title": "Continuous variable quantum key distribution through a fading channel with minimal information leakage", "abstract": "Continuous variable quantum key distribution enables two parties to extract provably secure keys for cryptography by exploiting aspects of quantum mechanics. A central challenge in achieving QKD over long distances is overcoming optical loss, which limits the secret key rates and achievable transmission distances. Recent work has illustrated how to perform continuous variable quantum key distribution while eliminating information leakage to an eavesdropper in a pure-loss channel and minimizing information leakage in a noisy channel. In this work, we analyse this protocol under conditions where the quantum channel linking the sender and receiver is a fading channel, which can be used to model free-space links. We find that the protocol maintains strong performance over fading channels and outperforms comparable protocols.", "url": "https://arxiv.org/abs/2610.38048", "type": "理论", "summary": "连续可变量子密钥分发使两方能够利用量子力学的各个方面提取可证明安全的密码学密钥。长距离实现 QKD 的一个核心挑战是克服光损耗，它限制了密钥速率和可实现的传输距离。最近的工作说明了如何执行连续可变量子密钥分发，同时消除纯丢失信道中窃听者的信息泄漏，并最大限度地减少噪声信道中的信息泄漏。在这项工作中，我们在连接发送器和接收器的量子通道是衰落通道的条件下分析该协议，该通道可用于模拟自由空间链路。我们发现该协议在衰落信道上保持了强大的性能，并且优于同类协议。", "authors": [{"name": "Josephine Dias"}, {"name": "Timothy C. Ralph"}], "featured_authors": [{"name": "Josephine Dias"}, {"name": "Timothy C. Ralph"}], "author_count": 2}, {"id": "2610.38059", "category": "quant-ph", "title": "Exact Positive-P Simulation of Open Quantum Spin Systems with Generalized Density Matrix Formalism", "abstract": "The positive-P representation for bosons allows scalable exact simulations of many-body open quantum systems, provided dissipation is strong enough to stabilise stochastic trajectories. Designing analogous methods for spin systems, relevant to quantum technologies, remains challenging, as previous spin positive-P formulations can exhibit systematic errors even when simulations are numerically stable. Here, we develop a phase-space representation that maps spin-$\\frac{1}{2}$ degrees of freedom onto parameters of a local generalized density matrix (GDM), rather than SU(2) coherent states. In all stable regimes, we observe no deviations from exact solutions, restoring the positive-P property: stable solutions are exact up to stochastic sampling noise. The GDM representation combines seamlessly with bosonic positive-P, enabling highly scalable treatment of coupled spin-boson systems. We map simulation stability versus spin and boson dissipation in the Jaynes-Cummings model and apply the method to a Jaynes-Cummings-Hubbard quasi-Lieb lattice, showing how spin dissipation and driving can destroy or restore excitation incompressibility.", "url": "https://arxiv.org/abs/2610.38059", "type": "理论+数值", "summary": "玻色子的正 P 表示允许对多体开放量子系统进行可扩展的精确模拟，前提是耗散足够强以稳定随机轨迹。设计与量子技术相关的自旋系统的类似方法仍然具有挑战性，因为即使模拟在数值上稳定，以前的自旋正 P 公式也可能会出现系统误差。在这里，我们开发了一种相空间表示，将自旋 $\\frac{1}{2}$ 自由度映射到局部广义密度矩阵 (GDM) 的参数上，而不是 SU(2) 相干态。在所有稳定状态下，我们观察到与精确解没有偏差，恢复了正 P 属性：稳定解对于随机采样噪声来说是精确的。 GDM 表示与玻色子正 P 无缝结合，实现耦合自旋玻色子系统的高度可扩展处理。我们在 Jaynes-Cummings 模型中绘制了模拟稳定性与自旋和玻色子耗散的关系，并将该方法应用于 Jaynes-Cummings-Hubbard 准 Lieb 晶格，展示了自旋耗散和驱动如何破坏或恢复激发不可压缩性。", "authors": [{"name": "Alex Ferrier"}, {"name": "Yi Shi"}, {"name": "Marzena H. Szymańska"}, {"name": "Piotr Deuar"}], "featured_authors": [{"name": "Alex Ferrier"}, {"name": "Yi Shi"}, {"name": "Marzena H. Szymańska"}, {"name": "Piotr Deuar"}], "author_count": 4}, {"id": "2610.38183", "category": "quant-ph", "title": "Quantum advantage by designing beneficial dissipation from lossless dynamics", "abstract": "Passive loss removes probability from a system and therefore seems unable to improve an unconditional target. This intuition is exact for classical population dynamics under sink-only removal: passive killing obeys a finite-strength monotonicity principle even after optimization over the remaining controls. Here we show that coherent quantum dynamics can violate this classical monotonicity because coherent contributions to the final target can interfere destructively. We derive a trajectory-level criterion that determines when such a detrimental contribution is physically accessible to passive loss and accumulates into a net unconditional benefit. The criterion is encoded in a response operator constructed entirely from the lossless dynamics: its spectrum determines whether weak passive loss can help, while its principal eigenvector identifies the optimal environmental mode. Applying this criterion to vibronically assisted transfer, we identify a beneficial mode formed by coherently combining two individually detrimental local loss directions. The predicted mode remains near-optimal at finite loss, producing an \\(8.73\\%\\) enhancement over the independently optimized lossless benchmark, compared with \\(9.52\\%\\) under full finite-loss optimization. Our results establish how coherent quantum dynamics can evade classical passive-loss monotonicity and provide a general task-dependent principle for designing beneficial passive environments from lossless dynamics.", "url": "https://arxiv.org/abs/2610.38183", "type": "理论+数值", "summary": "被动损失消除了系统的概率，因此似乎无法改善无条件目标。这种直觉对于仅接收去除下的经典种群动态是准确的：即使在对剩余控制进行优化之后，被动杀伤也遵循有限强度单调性原理。在这里，我们证明相干量子动力学可以违反这种经典单调性，因为对最终目标的相干贡献可能会产生破坏性干扰。我们得出了一个轨迹水平标准，该标准确定这种有害贡献何时可以在物理上造成被动损失并累积成净无条件收益。该标准被编码在完全由无损动态构建的响应算子中：它的频谱决定了弱被动损失​​是否有帮助，而其主特征向量则确定了最佳环境模式。将此标准应用于振动辅助转移，我们确定了通过连贯地组合两个单独有害的局部损失方向而形成的有益模式。\n\n预测模式在有限损失下保持接近最佳状态，与完全有限损失优化下的 \\(9.52\\%\\) 相比，在独立优化的无损基准上产生了 \\(8.73\\%\\) 增强。我们的结果确立了相干量子动力学如何避免经典的被动损耗单调性，并为从无损动力学设计有益的被动环境提供了通用的任务相关原则。", "authors": [{"name": "Zeng-Zhao Li"}, {"name": "Xiao Xue"}], "featured_authors": [{"name": "Zeng-Zhao Li"}, {"name": "Xiao Xue"}], "author_count": 2}, {"id": "2610.38240", "category": "quant-ph", "title": "Noise Propagation and Effective Channels in Encrypted Quantum Cloning", "abstract": "We investigate noise propagation in encrypted quantum cloning by formulating the protocol in terms of effective recovery channels. For local single-qubit completely positive trace-preserving noise, a Pauli-basis expansion of the Kraus operators reveals a strong dependence on the location of the physical channel. Noise on an auxiliary signal qubit leaves the reduced recovered state unchanged, whereas noise on an auxiliary key qubit induces a Pauli-diagonal effective channel on the recovered qubit. For the core qubits, the error propagation additionally depends on the parity of the number of entangled pairs. In particular, for noise on the core key qubit with odd parity, distinct physical Pauli sectors merge into the same effective sector, converting isotropic depolarizing noise into an anisotropic recovery channel. We also relate Werner-type resource imperfections to local depolarizing noise and distinguish distributed product depolarization from genuine global depolarization. The results demonstrate that the effective recovery noise is governed not only by noise strength, but also by its physical location and by the structure of the encryption-decryption protocol.", "url": "https://arxiv.org/abs/2610.38240", "type": "理论", "summary": "我们通过根据有效恢复通道制定协议来研究加密量子克隆中的噪声传播。对于局部单量子位完全正迹保留噪声，克劳斯算子的泡利基展开揭示了对物理通道位置的强烈依赖性。辅助信号量子位上的噪声使还原的恢复状态保持不变，而辅助密钥量子位上的噪声在恢复的量子位上引起泡利对角有效通道。对于核心量子位，误差传播还取决于纠缠对数量的奇偶性。特别是，对于具有奇校验的核心关键量子位上的噪声，不同的物理泡利扇区合并到同一有效扇区中，将各向同性去极化噪声转换为各向异性恢复通道。我们还将维尔纳型资源缺陷与局部去极化噪声联系起来，并将分布式产品去极化与真正的全局去极化区分开来。结果表明，有效恢复噪声不仅取决于噪声强度，还取决于其物理位置和加密解密协议的结构。", "authors": [{"name": "Yun-Fei Li"}, {"name": "Fei-Hao Yang"}, {"name": "Qing Chen"}, {"name": "Liu-Jun Wang"}], "featured_authors": [{"name": "Yun-Fei Li"}, {"name": "Fei-Hao Yang"}, {"name": "Qing Chen"}, {"name": "Liu-Jun Wang"}], "author_count": 4}, {"id": "2610.38261", "category": "quant-ph", "title": "Active Approach to Fast Quantum State Preparation and Reset in Atomic Arrays", "abstract": "Rapid preparation of a target quantum state and reset to the many-body ground state are essential for quantum information processing. Here, we investigate both processes in a waveguide-coupled emitter array in the low-excitation regime. By decomposing the effective non-Hermitian Hamiltonian into biorthogonal eigenmodes, we show that relaxation depends on the initial overlap with the more subradiant modes, providing a modal explanation of the Mpemba effect. Guided by this insight, we design a reset protocol in which a finite-duration local drive activelysuppresses the relatively slow-decaying components. For the parameters studied, this reduces the time to reach a fixed residual-excitation threshold by up to approximately 25% compared with free decay. To prepare a target Dicke state, we introduce a two-step protocol that initially leaves one emitter undriven before restoring the full drive that stabilizes the target. This local control redistributes spectral weight into the more subradiant modes, driving them closer to their target amplitudes, which reduces the preparation time by up to approximately 45% while consuming less driving energy than continuous driving. Finally, we show how directional waveguide coupling shifts collective modes toward a preferred boundary through the non-Hermitian skin effect, providing guidance for selecting the preferred site for local operations. We term this fundamental dependence of the relaxation dynamics on the system's chirality the ``non-Hermitian Skin-Mpemba effect.'' These results demonstrate how selective local control can accelerate state preparation and reset in open quantum systems.", "url": "https://arxiv.org/abs/2610.38261", "type": "理论", "summary": "快速准备目标量子态并重置为多体基态对于量子信息处理至关重要。在这里，我们研究了低激励状态下波导耦合发射器阵列中的两个过程。通过将有效的非厄米哈密顿量分解为双正交本征模态，我们证明弛豫取决于与次辐射模态的初始重叠，从而提供了 Mpemba 效应的模态解释。在这种见解的指导下，我们设计了一种重置协议，其中有限持续时间的本地驱动器主动抑制相对缓慢衰减的组件。对于所研究的参数，与自由衰减相比，这可将达到固定残余激励阈值的时间缩短约 25%。为了准备目标迪克状态，我们引入了一个两步协议，该协议最初使一个发射器处于未驱动状态，然后恢复稳定目标的完整驱动。这种本地控制将光谱权重重新分配到更多的次辐射模式中，使它们更接近目标振幅，从而将准备时​​间减少约 45%，同时比连续驱动消耗更少的驱动能量。\n\n最后，我们展示了定向波导耦合如何通过非厄米趋肤效应将集体模式移向首选边界，为选择本地操作的首选地点提供指导。我们将弛豫动力学对系统手性的这种基本依赖性称为“非厄米斯皮-姆潘巴效应”。这些结果证明了选择性局部控制如何加速开放量子系统中的状态准备和重置。", "authors": [{"name": "Ya-Tang Yu"}, {"name": "Wei-Hsuan Chung"}, {"name": "Tian-Shu Gou"}, {"name": "Kuan-Ting Lin"}, {"name": "H. H. Jen"}], "featured_authors": [{"name": "Ya-Tang Yu"}, {"name": "Wei-Hsuan Chung"}, {"name": "Tian-Shu Gou"}, {"name": "Kuan-Ting Lin"}, {"name": "H. H. Jen"}], "author_count": 5}, {"id": "2610.38322", "category": "quant-ph", "title": "Strict Frequency Bandwidths from Causal Light Cones Enable Scalable Exact Gradient Evaluation in Quantum Optimization", "abstract": "Dynamical locality is often regarded as a limitation of shallow quantum circuits, yet we show that it can reduce the number of circuit settings required for exact evaluation of gradients with respect to shared parameters. For layered ansatze generated by commuting local terms, strict Heisenberg light cones confine energy slices obtained by varying one shared layer parameter to finite Fourier bandwidths dictated by local causal geometry. This bandlimit recasts exact gradient evaluation as a local signal recovery problem and, when the relevant frequencies lie on a known frequency lattice, yields an exact multipoint parameter-shift rule based on the discrete sine transform. The quantum approximate optimization algorithm (QAOA) provides a canonical realization in which this mechanism is governed by the local structure of the graph. Specifically, when a cost angle is varied, the relevant geometry is encoded by the contact region in the interaction line graph. At fixed circuit depth on graphs of bounded degree, the number of distinct circuit settings required for the corresponding derivative collapses from $O(m)$ to $O(1)$. This shows that dynamical locality is not merely a constraint on correlation propagation, but also a computational resource that enables exact gradient evaluation with fewer circuit settings in quantum optimization.", "url": "https://arxiv.org/abs/2610.38322", "type": "理论+数值", "summary": "动态局部性通常被认为是浅量子电路的限制，但我们证明它可以减少精确评估共享参数梯度所需的电路设置数量。对于通过交换局部项生成的分层模拟，严格的海森堡光锥将通过将一个共享层参数变化到由局部因果几何决定的有限傅立叶带宽而获得的能量切片限制。该带限将精确的梯度评估重新定义为局部信号恢复问题，并且当相关频率位于已知的频率格上时，产生基于离散正弦变换的精确的多点参数移位规则。量子近似优化算法（QAOA）提供了一种规范的实现，其中该机制由图的局部结构控制。具体地，当成本角度改变时，相关几何形状由交互线图中的接触区域编码。在有界度图上的固定电路深度下，相应导数所需的不同电路设置的数量从 $O(m)$ 崩溃到 $O(1)$。\n\n这表明动态局部性不仅是相关传播的约束，而且还是一种计算资源，可以在量子优化中用更少的电路设置实现精确的梯度评估。", "authors": [{"name": "Zhaoyang Song"}, {"name": "Wei Zhang"}, {"name": "Ji Cao"}, {"name": "Xuexi Yi"}, {"name": "Hong-Fu Wang"}], "featured_authors": [{"name": "Zhaoyang Song"}, {"name": "Wei Zhang"}, {"name": "Ji Cao"}, {"name": "Xuexi Yi"}, {"name": "Hong-Fu Wang"}], "author_count": 5}, {"id": "2610.38340", "category": "quant-ph", "title": "Einstein Metrics and Quantum Control on Symmetric Tensor Product Quotients", "abstract": "Let $M_n=(\\mathrm{PU}(2)^n\\rtimes S_n)\\backslash\\mathrm{PU}(2^n)$ be the space of projective $n$-qubit unitaries modulo local unitaries and permutations of the qubits. We prove that for all sufficiently large $n$ the manifold $M_n$ carries exactly two $\\mathrm{PU}(2^n)$-invariant Einstein metrics up to scaling. Both Einstein metrics have uniformly bounded diameter after normalizing two-qubit costs, although approximating a Haar-random unitary requires exponentially many two-qubit gates. In contrast, we construct non-Einstein metrics with nonnegative Ricci curvature and exponentially growing typical control distances, and determine the sharp curvature threshold for this family.", "url": "https://arxiv.org/abs/2610.38340", "type": "理论", "summary": "设 $M_n=(\\mathrm{PU}(2)^n\\rtimes S_n)\\backslash\\mathrm{PU}(2^n)$ 为射影 $n$-qubit 酉模局部酉和量子位排列的空间。我们证明，对于所有足够大的 $n$，流形 $M_n$ 恰好携带两个 $\\mathrm{PU}(2^n)$ 不变的爱因斯坦度量直至缩放。尽管近似哈尔随机酉需要指数级数量的双量子位门，但在标准化双量子位成本后，两个爱因斯坦度量都具有一致的有界直径。相反，我们构造具有非负里奇曲率和指数增长的典型控制距离的非爱因斯坦度量，并确定该族的锐曲率阈值。", "authors": [{"name": "Honghuai Fang"}], "featured_authors": [{"name": "Honghuai Fang"}], "author_count": 1}, {"id": "2610.38379", "category": "quant-ph", "title": "Spectral Reduction Selects the Observable Imprint of Dirac Quantum Geometry", "abstract": "Spectral constraints can alter the observable manifestation of quantum geometry without changing the local eigenspace. Relativistic electron vortices provide a sharp example: the spin orbit interaction redistributes spin and orbital angular momentum, yet its magnetic contribution differs between localized three-dimensional wave packets and stationary monochromatic beams. We resolve this discrepancy by showing that fixing the energy replaces ambient momentum derivatives in position-weighted current moments by shell-tangent derivatives and derive a Hermitian selection rule for first-order observables in momentum-dependent internal subspaces. Its extension-independent form applies beyond Dirac systems, including a broad class of antisymmetric first moments of scalar-charge velocity currents. For the free positive-energy Dirac doublet, the magnetic correction is an exact non-Abelian Berry-curvature contraction with a pointwise saturable quantum-metric bound. Changing the relative phase between the two $\\sigma_z$ spinor components switches this correction from zero in a conserved transverse-helicity sector to a finite value in a radial coherent superposition. At fixed finite Lorentz factor, the radial response scales as $O(\\theta/\\gamma)$, compared with $O(\\theta^2)$ for longitudinal polarization. Spectral reduction and internal coherence thus provide distinct controls of the observable imprint of quantum geometry.", "url": "https://arxiv.org/abs/2610.38379", "type": "理论", "summary": "谱约束可以改变量子几何的可观察表现，而不改变局部本征空间。相对论电子涡旋提供了一个鲜明的例子：自旋轨道相互作用重新分配自旋和轨道角动量，但其磁贡献在局域三维波包和静止单色束之间有所不同。我们通过证明固定能量可以用壳切线导数代替位置加权当前矩中的环境动量导数来解决这一差异，并得出动量相关内部子空间中一阶可观测量的埃尔米特选择规则。其与扩张无关的形式适用于狄拉克系统之外的领域，包括一类广泛的标量电荷速度电流的反对称一阶矩。对于自由正能量狄拉克双峰，磁校正是具有点可饱和量子度量界限的精确非阿贝尔贝里曲率收缩。改变两个 $\\sigma_z$ 旋量分量之间的相对相位会将这种校正从守恒横向螺旋扇区中的零切换到径向相干叠加中的有限值。\n\n在固定的有限洛伦兹因子下，径向响应尺度为 $O(\\theta/\\gamma)$，而纵向偏振的响应尺度为 $O(\\theta^2)$。因此，光谱缩减和内部相干性提供了对量子几何可观察印记的独特控制。", "authors": [{"name": "Zhongze Guo"}, {"name": "Bei Xu"}, {"name": "Qiang Gu"}], "featured_authors": [{"name": "Zhongze Guo"}, {"name": "Bei Xu"}, {"name": "Qiang Gu"}], "author_count": 3}, {"id": "2610.38387", "category": "quant-ph", "title": "Fermionic Unruh effect revisited: Entanglement and correlation dynamics under symmetric transformations", "abstract": "A uniformly accelerated observer perceives the Minkowski vacuum as a thermal bath, so acceleration acts as a noise channel on correlations shared with an inertial partner. For a Dirac field in the standard treatment, the resulting map is a one-sided amplitude-damping channel, and entanglement and quantum discord survive at infinite acceleration. We introduce a symmetric Unruh-like map in which the vacuum and the one-particle state both exchange amplitude with the inaccessible Rindler region; for a Bell state it yields a bit-flip channel whose flip probability is the Fermi-Dirac occupation at the Unruh temperature. Using negativity, mutual information, and all six pairwise quantum discords, we find that the entanglement and discord between the inertial observer and the accessible mode vanish together at infinite acceleration, leaving only one bit of classical correlation. These results show that the fate of quantum correlations in noninertial frames depends on the structure of the Minkowski-Rindler map.", "url": "https://arxiv.org/abs/2610.38387", "type": "理论", "summary": "均匀加速的观察者将闵可夫斯基真空视为热浴，因此加速度充当与惯性伙伴共享的相关性的噪声通道。对于标准处理中的狄拉克场，所得到的图是单侧振幅阻尼通道，并且纠缠和量子不和谐在无限加速下仍然存在。我们引入了一种对称的 Unruh-like 映射，其中真空和单粒子态都与不可到达的 Rindler 区域交换振幅；对于贝尔态，它产生一个位翻转通道，其翻转概率是安鲁温度下的费米-狄拉克占据。利用负性、互信息和所有六对量子不和谐，我们发现惯性观察者和可接近模式之间的纠缠和不和谐在无限加速时一起消失，只留下一点经典相关性。这些结果表明，非惯性系中量子关联的命运取决于闵可夫斯基-林德勒图的结构。", "authors": [{"name": "Omid Yahyayi Monem"}, {"name": "Hosein Mohammadzadeh"}], "featured_authors": [{"name": "Omid Yahyayi Monem"}, {"name": "Hosein Mohammadzadeh"}], "author_count": 2}, {"id": "2610.38554", "category": "quant-ph", "title": "Coherent errors, syndrome extraction and the Robustness of Magic in stabiliser codes", "abstract": "Coherent errors leave stabiliser-code-encoded magic states in superpositions of syndrome sectors. We ask how much magic these coherent errors add, and whether syndrome extraction depletes logical magic. Using Robustness of Magic, we show that, for a unitary error U on a correctable region which supports no stabiliser, the encoded state has the same robustness as the logical state plus one copy of the Choi state of U , in every stabiliser code encoding. Syndrome extraction removes this copy, returning the logical robustness. The removed magic is positive for every non-Clifford error: adding a non-stabiliser state to any state multiplies one plus the robustness by a (tightly- bounded) factor above one. The magic capacity of two-qubit gates Clifford-equivalent to diagonal or single-qubit gates is equal to their Choi-state robustness. We give a linear-algebraic test for when a Clifford error makes syndrome extraction measure a logical operator, and give magic lifetimes of stored single-qubit magic states under Pauli noise. Choosing the plane of the stored state extends these lifetimes about 1.5x on rotated surface codes under low code-capacity depolarising noise. We identify states and channels in odd-prime dimension for which Wigner negativity and robustness show equal lifetimes.", "url": "https://arxiv.org/abs/2610.38554", "type": "理论", "summary": "相干错误将稳定器代码编码的魔法状态留在综合症扇区的叠加中。我们问这些连贯的错误增加了多少魔力，以及综合症提取是否会耗尽逻辑魔力。使用 Magic 的鲁棒性，我们表明，对于不支持稳定器的可校正区域上的酉错误 U ，在每个稳定器代码编码中，编码状态与逻辑状态加上 U 的 Choi 状态的一份副本具有相同的鲁棒性。综合症提取删除了这个副本，恢复了逻辑的稳健性。对于每个非 Clifford 错误，移除的魔力都是正的：将非稳定器状态添加到任何状态都会将鲁棒性乘以 1 加上高于 1 的（严格有界）因子。双量子位门 Clifford 等价于对角线或单量子位门的神奇容量等于其 Choi 态鲁棒性。我们给出了克利福德误差何时使校正子提取测量成为逻辑运算符的线性代数测试，并给出了泡利噪声下存储的单量子位魔术状态的魔术寿命。在低代码容量去极化噪声下，选择存储状态的平面可以将旋转表面代码的寿命延长约 1.5 倍。\n\n我们确定了奇素数维中的状态和通道，其中维格纳负性和鲁棒性显示出相同的寿命。", "authors": [{"name": "Enrico Bozzetto"}, {"name": "Jonte R. Hance"}], "featured_authors": [{"name": "Enrico Bozzetto"}, {"name": "Jonte R. Hance"}], "author_count": 2}, {"id": "2610.38572", "category": "quant-ph", "title": "Learning Grover mixers for constrained optimization", "abstract": "Grover-Mixer QAOA (GM-QAOA) is a promising quantum framework for constrained combinatorial optimization. However, its practical implementation requires the efficient preparation of a uniform superposition over feasible states. In this work, we propose a two-stage variational approach. First, a parameterized quantum circuit is trained to prepare this superposition, using an entropy-based cost function that favors a uniform distribution over feasible bitstrings. The trained circuit is then embedded in GM-QAOA, where it provides both the initial state and, together with its inverse, yields the Grover mixer. The resulting method is evaluated on two representative benchmark problems: the Maximum Weight Independent Set (MWIS) problem and the Multidimensional Knapsack Problem (MKP). While the results demonstrate consistent improvements over standard QAOA for MWIS, only marginal gains are observed for MKP, with the advantage diminishing as the problem size increases. The reduced performance on MKP reflects the growing difficulty of training the variational mixer, likely due to increasingly challenging optimization landscapes. Overall, these findings highlight both the potential of variational Grover mixers and the trade-off between their performance gains and the additional resources required for their training.", "url": "https://arxiv.org/abs/2610.38572", "type": "理论+数值", "summary": "Grover-Mixer QAOA (GM-QAOA) 是一种很有前景的约束组合优化量子框架。然而，它的实际实现需要有效地准备可行状态的统一叠加。在这项工作中，我们提出了一种两阶段变分方法。首先，使用基于熵的成本函数训练参数化量子电路来准备这种叠加，该函数有利于可行位串的均匀分布。然后将经过训练的电路嵌入到 GM-QAOA 中，在其中提供初始状态，并与其逆状态一起生成 Grover 混频器。所得方法在两个代表性基准问题上进行评估：最大权重独立集（MWIS）问题和多维背包问题（MKP）。虽然结果表明 MWIS 相对于标准 QAOA 具有一致的改进，但 MKP 仅观察到边际收益，并且随着问题规模的增加，优势逐渐减弱。 MKP 性能的下降反映出训练变分混合器的难度越来越大，这可能是由于优化环境越来越具有挑战性。\n\n总体而言，这些发现强调了变分 Grover 混合器的潜力以及其性能增益和培训所需的额外资源之间的权衡。", "authors": [{"name": "Matteo Vandelli"}, {"name": "Francesco Ferrari"}, {"name": "Daniele Dragoni"}], "featured_authors": [{"name": "Matteo Vandelli"}, {"name": "Francesco Ferrari"}, {"name": "Daniele Dragoni"}], "author_count": 3}, {"id": "2610.38604", "category": "quant-ph", "title": "Pulse-Informed Physical Placement for Parallel Two-Qubit Gates in Qubit Arrays", "abstract": "A parallel two-qubit layer can often be realized with several nonoverlapping sets of physical couplers, but isolated calibrations do not reveal how each realization performs after optimizing its own simultaneous control pulse. We formulate physical placement and pulse synthesis as a coupled decision problem for parallel controlled-$Z$ gates in heterogeneous frequency tunable transmon arrays. The proposed processor-aware structural quantum multi-domain matrix (QMDM) links static processor, edge, incidence, and task information to a dynamic candidate response block. For each candidate placement $P$, QMDM instantiates the active Hamiltonian $H_P$; quantum optimal control (QOCT) generates a placement-specific pulse, direct coupled propagation returns the projected computational subspace overlap $F_{\\rm proj}$ and computational survival; and these pulse-conditioned responses are fed back to QMDM to rank and progressively promote physical placements. This placement pulse response feedback defines pulse-informed physical placement. Here, to see the performance of the proposed method on 30 held-out synthetic $3\\times3$ processors, the median final $F_{\\rm proj}$ is $0.993826$ for pulse-informed placement and $0.984981$ for calibration-based placement. Also, when tested under different system conditions, the proposed pulse-informed approach uses $59.1\\%$ fewer candidate QOCT optimizer iterations than the exhaustive finite-budget reference. The QMDM representation and outer search are formulated for arbitrary $L$ simultaneous two-qubit gates. Here, the present global candidate ranking validation is used for $L=2$.", "url": "https://arxiv.org/abs/2610.38604", "type": "理论+数值", "summary": "并行的两个量子位层通常可以通过几组不重叠的物理耦合器来实现，但隔离校准并不能揭示每个实现在优化其自身的同步控制脉冲后的性能。我们将物理布局和脉冲合成公式化为异构频率可调传输阵列中并行控制 $Z$ 门的耦合决策问题。所提出的处理器感知结构量子多域矩阵（QMDM）将静态处理器、边缘、关联和任务信息链接到动态候选响应块。对于每个候选位置 $P$，QMDM 实例化活动哈密顿量 $H_P$；量子最优控制 (QOCT) 生成特定于位置的脉冲，直接耦合传播返回投影计算子空间重叠 $F_{\\rm proj}$ 和计算生存；这些脉冲调节响应会反馈到 QMDM 进行排名并逐步提升物理排名。该放置脉冲响应反馈定义了脉冲通知的物理放置。\n\n在这里，为了查看所提出的方法在 30 个保留的合成 $3\\times3$ 处理器上的性能，脉冲通知布局的最终​​ $F_{\\rm proj}$ 中位数为 $0.993826$，基于校准的布局为 $0.984981$。此外，当在不同的系统条件下进行测试时，所提出的脉冲通知方法比详尽的有限预算参考少使用了 $59.1\\%$ 的候选 QOCT 优化器迭代。 QMDM 表示和外部搜索是针对任意 $L$ 同时两个量子位门制定的。这里，当前的全局候选排名验证用于$L=2$。", "authors": [{"name": "Shahid Qamar"}, {"name": "Wei-Feng Zhuang"}, {"name": "Bilal Riaz"}, {"name": "Peng Qian"}], "featured_authors": [{"name": "Shahid Qamar"}, {"name": "Wei-Feng Zhuang"}, {"name": "Bilal Riaz"}, {"name": "Peng Qian"}], "author_count": 4}, {"id": "2610.38635", "category": "quant-ph", "title": "Quantum Gate Engineering in Superconducting NISQ Platforms: Experimental Methods and Emerging Directions", "abstract": "This review aims to provide researchers, experimentalists, and quantum engineers with an updated and technically grounded perspective on the implementation of quantum gates in superconducting NISQ devices. The goal is to establish a comprehensive bridge between theoretical quantum circuit synthesis and its practical, experimental implementation, focusing on superconducting quantum technologies. We systematically examine the diverse landscape of superconducting qubits and processor architectures, ranging from conventional transmons to alternative and unconventional designs, evaluating their unique design trade-offs, connectivity constraints, device physics, and materials impact. Moving from theory to actual implementation, we detail how single- and two-qubit operations are synthesized via microwave-driven and flux-activated pulses. We here present our pulse engineering, wave shaping, calibration workflows, demonstrating how to bridge the gap between abstract gate models and real-world hardware limitations in the direction of a hardware-software co-design framework. To validate these operations, we choose benchmarking methodologies with the purpose to get the more efficient metric for the specific evaluation aspect, including truth tables and quantum process tomography. Therefore, we both discuss the theoretical concepts behind the gate synthesis and show experimental implementation of most fundamental gates by proposing a practical workflow.", "url": "https://arxiv.org/abs/2610.38635", "type": "实验", "summary": "本综述旨在为研究人员、实验人员和量子工程师提供关于在超导 NISQ 器件中实现量子门的最新且技术上扎实的观点。目标是在理论量子电路合成与其实际实验实现之间建立一座综合桥梁，重点关注超导量子技术。我们系统地研究超导量子位和处理器架构的多样化前景，从传统的传输到替代和非常规设计，评估其独特的设计权衡、连接限制、设备物理和材料影响。从理论到实际实现，我们详细介绍了如何通过微波驱动和通量激活脉冲合成单量子位和两个量子位操作。我们在这里展示我们的脉冲工程、波形整形、校准工作流程，演示如何在硬件-软件协同设计框架的方向上弥合抽象门模型和现实世界硬件限制之间的差距。\n\n为了验证这些操作，我们选择基准测试方法，目的是为特定评估方面获得更有效的指标，包括真值表和量子过程断层扫描。因此，我们既讨论了门综合背后的理论概念，又通过提出实用的工作流程展示了最基本门的实验实现。", "authors": [{"name": "Alessandro Sarno"}, {"name": "Viviana Stasino"}, {"name": "Antonio Pio Italiano"}, {"name": "Alessandra Pizza"}, {"name": "Carlo Cosenza"}, {"name": "Wladislav Guarino"}, {"name": "Domenico Montemurro"}, {"name": "Francesco Tafuri"}, {"name": "Davide Massarotti"}, {"name": "Halima Giovanna Ahmad"}], "featured_authors": [{"name": "Alessandro Sarno"}, {"name": "Viviana Stasino"}, {"name": "Antonio Pio Italiano"}, {"name": "Francesco Tafuri"}, {"name": "Davide Massarotti"}, {"name": "Halima Giovanna Ahmad"}], "author_count": 10}, {"id": "2610.38701", "category": "quant-ph", "title": "Sample-Based Quantum Diagonalization for Variable Molecular Geometries", "abstract": "Quantum and hybrid quantum-classical algorithms have the potential to improve the accuracy and scale of quantum chemistry and impact a broad range of applications such as drug discovery and catalysis. In particular, subspace methods such as sample-based quantum diagonalization (SQD) can already tackle classically challenging systems. However, practical algorithms that go beyond the computation of electronic ground and excited states are still scarce. Here, we introduce the variable-geometry sample-based quantum diagonalization (VGSQD) algorithm, which extends SQD to variable molecular geometries by reusing quantum samples from a reference geometry at displaced ones, thus significantly reducing quantum computational cost. Using circuits of up to 124 qubits on ibm-quebec, an IBM Heron r2 quantum processor, we determine the equilibrium geometry and energy of the weakly bound, strongly correlated beryllium dimer, as well as the water molecule. Finally, we extend VGSQD to chemical reactions and compute the minimum energy path and energy barrier of a hydrogen exchange reaction. The results are comparable with state-of-the-art classical methods such as CCSD(T) and DMRG. This work broadens the scope of quantum algorithms for chemistry, from energies to geometry optimization and reaction pathways, both essential for practical applications.", "url": "https://arxiv.org/abs/2610.38701", "type": "理论+数值", "summary": "量子和混合量子经典算法有潜力提高量子化学的准确性和规模，并影响药物发现和催化等广泛的应用。特别是，基于样本的量子对角化（SQD）等子空间方法已经可以解决经典的挑战性系统。然而，超出电子基态和激发态计算范围的实用算法仍然很少。在这里，我们介绍了基于可变几何样本的量子对角化（VGSQD）算法，该算法通过在移位的位置重用参考几何中的量子样本，将 SQD 扩展到可变分子几何形状，从而显着降低量子计算成本。使用 IBM Heron r2 量子处理器 ibm-quebec 上多达 124 个量子位的电路，我们确定了弱束缚、强相关的铍二聚体以及水分子的平衡几何结构和能量。最后，我们将 VGSQD 扩展到化学反应，并计算氢交换反应的最小能量路径和能垒。结果与 CCSD(T) 和 DMRG 等最先进的经典方法相当。\n\n这项工作拓宽了化学量子算法的范围，从能量到几何优化和反应路径，这对于实际应用都是至关重要的。", "authors": [{"name": "Matthieu Fortin-Deschenes"}, {"name": "Ibrahim Shehzad"}], "featured_authors": [{"name": "Matthieu Fortin-Deschenes"}, {"name": "Ibrahim Shehzad"}], "author_count": 2}, {"id": "2610.38808", "category": "quant-ph", "title": "Key Evaluation of a Relativistic Quantum Key Distribution Over a Turbulent Free-space Optical Channel", "abstract": "We investigate the performance of relativistic quantum key distribution (RQKD) over turbulent free-space optical channels for both single-photon and coherent-state implementations. A theoretical model is developed to describe the effect of atmospheric turbulence on interferometric visibility and secret-key generation by incorporating turbulence-induced phase fluctuations into the key-rate analysis. Numerical simulations are performed under realistic channel conditions to evaluate the achievable communication distance and secret-key rate. The results show that atmospheric turbulence degrades the protocol performance by reducing interference visibility, with the severity of the degradation determined by the ratio between the interferometer-arm separation $r$ (or temporal separation of signal and reference states $\\Delta T$) and Fried's parameter. The single-photon protocol remains operational over all investigated turbulence regimes, whereas the coherent-state implementation exhibits a critical dependence on the interferometer geometry (especially on $\\Delta T$), leading to a threshold beyond which secure key generation is no longer possible. These findings quantify the impact of atmospheric turbulence on relativistic quantum key distribution and provide practical guidelines for the design and optimization of free-space RQKD systems.", "url": "https://arxiv.org/abs/2610.38808", "type": "理论+数值", "summary": "我们研究了单光子和相干态实现的湍流自由空间光通道上的相对论量子密钥分配（RQKD）的性能。通过将湍流引起的相位波动纳入密钥速率分析，开发了一个理论模型来描述大气湍流对干涉可见度和密钥生成的影响。在实际信道条件下进行数值模拟，以评估可实现的通信距离和密钥速率。结果表明，大气湍流通过降低干扰可见度来降低协议性能，降低的严重程度由干涉仪臂间隔 $r$（或信号和参考状态的时间间隔 $\\Delta T$）与 Fried 参数之间的比率决定。单光子协议在所有研究的湍流状态下仍然有效，而相干态实现表现出对干涉仪几何形状（特别是$\\Delta T$）的严重依赖，导致达到一个阈值，超过该阈值就不再可能生成安全密钥。\n\n这些发现量化了大气湍流对相对论量子密钥分布的影响，并为自由空间 RQKD 系统的设计和优化提供了实用指南。", "authors": [{"name": "G. Bebrov"}], "featured_authors": [{"name": "G. Bebrov"}], "author_count": 1}, {"id": "2610.38817", "category": "quant-ph", "title": "Memory-Induced Limits on Entanglement Distribution", "abstract": "We investigate the operational limits of entanglement distribution through quantum channels reused without reinitialization. Building on an effective repeated-use channel description, we show that residual excitations left in the channel from previous uses act as a memory source that progressively suppresses coherent quantum transmission. To quantify this limitation, we derive an analytical lower bound on the quantum capacity and combine it with the Holevo-Werner semidefinite-programming upper bound. We also provide an analytical criterion to identify entanglement-breaking channels, with thresholds that depend jointly on chain length and reuse. For perfect-state-transfer chains, the resulting capacity window yields tighter estimates than previous bounds, with the relative improvement becoming substantially more pronounced closer to the entanglement-breaking threshold. Moreover, on the second use, our lower bound certifies a maximal relative timing-error tolerance across all chains with internal memory that lies just below 22.63% and is attained by the three-site chain. We further derive a fundamental relative timing-error threshold of 36.41%, above which we analytically guarantee zero unassisted quantum capacity for every chain with internal memory, independent of the number of uses. These results establish a clear benchmark model for repeated entanglement distribution, and identify timing precision, chain length, and memory accumulation as fundamental constraints on scalable quantum-network architectures.", "url": "https://arxiv.org/abs/2610.38817", "type": "理论", "summary": "我们通过重复使用而不重新初始化的量子通道来研究纠缠分布的操作限制。基于有效的重复使用通道描述，我们证明了先前使用中留在通道中的残余激发充当了逐渐抑制相干量子传输的记忆源。为了量化这一限制，我们得出了量子容量的分析下界，并将其与 Holevo-Werner 半定规划上限相结合。我们还提供了一个分析标准来识别纠缠破坏通道，其阈值共同取决于链长度和重用。对于完美状态转移链，由此产生的容量窗口产生比之前的界限更严格的估计，并且相对改进在接近纠缠破坏阈值时变得更加明显。此外，在第二次使用时，我们的下限证明了所有具有内存的链的最大相对定时误差容限略低于 22.63%，并且是通过三站点链实现的。\n\n我们进一步推导出 36.41% 的基本相对计时误差阈值，高于该阈值，我们通过分析保证每个具有内部存储器的链的无辅助量子容量为零，与使用次数无关。这些结果为重复纠缠分布建立了清晰的基准模型，并将计时精度、链长度和内存积累确定为可扩展量子网络架构的基本约束。", "authors": [{"name": "Roberto Benjamin Salazar Vargas"}, {"name": "Hayden Zammit"}, {"name": "Trevor Spiteri"}, {"name": "Gianluca Valentino"}, {"name": "Tony J. G. Apollaro"}, {"name": "Johann A. Briffa"}], "featured_authors": [{"name": "Roberto Benjamin Salazar Vargas"}, {"name": "Hayden Zammit"}, {"name": "Trevor Spiteri"}, {"name": "Gianluca Valentino"}, {"name": "Tony J. G. Apollaro"}, {"name": "Johann A. Briffa"}], "author_count": 6}, {"id": "2610.38840", "category": "quant-ph", "title": "Gravitationally Mediated Entanglement in Interferometers with Repeated Splitting", "abstract": "Proposals to probe the quantum nature of gravity through entanglement between spatially separated masses have attracted considerable interest. In such schemes, spatial superpositions are prepared through controlled splitting operations that produce several interferometric branches. Here we propose and analyse protocols involving repeated splitting stages, each of which doubles the number of occupied paths. We show that the density matrix after $n$ splitting stages is related to that of the $(n-1)$-splitting protocol through local parity dephasing. Two of the resulting sectors reproduce the preceding state, while the other two acquire additional gravitational phases. Removing the locally generated parts gives an exact lower bound on the change in negativity, expressed in terms of the preceding state's negative partial-transpose eigenspace. For two splitting stages, this leads to an explicit condition on three gravitational phases under which the additional split cannot reduce negativity. We also show that further splitting cannot shorten the lifetime of the generated entanglement. If the local internal system preserves the full branch label, the positional entanglement is retained upon recombination. We describe an implementation using a reusable two-level system and local memories, and compare it with a readout without a memory register. For the latter, we derive an exact condition for when an additional splitting stage improves the readout, based on a $2\\times 2$ Schur complement. Numerical simulations show an advantage in positional negativity over the rates considered, with an improvement surviving the restricted readout at all decoherence rates considered at the final readout time.", "url": "https://arxiv.org/abs/2610.38840", "type": "理论+数值", "summary": "通过空间上分离的质量之间的纠缠来探测引力的量子本质的提议引起了相当大的兴趣。在此类方案中，通过产生多个干涉分支的受控分裂操作来准备空间叠加。在这里，我们提出并分析了涉及重复分裂阶段的协议，每个阶段都会使占用路径的数量加倍。我们通过局部奇偶相移证明，$n$ 分裂阶段后的密度矩阵与 $(n-1)$ 分裂协议的密度矩阵相关。由此产生的两个扇区再现了先前的状态，而另外两个则获得了额外的引力相位。删除本地生成的部分给出了负性变化的精确下限，以先前状态的负部分转置本征空间表示。对于两个分裂阶段，这导致了三个引力阶段的明确条件，在该条件下额外的分裂不能减少负性。我们还表明，进一步分裂不能缩短所生成纠缠的寿命。\n\n如果局部内部系统保留完整的分支标签，则在重组时位置纠缠将被保留。我们描述了使用可重用两级系统和本地存储器的实现，并将其与没有存储器寄存器的读出进行比较。对于后者，我们基于 $2\\times 2$ Schur 补码得出了额外的分裂阶段何时改善读数的精确条件。数值模拟显示位置负性相对于所考虑的速率具有优势，并且在最终读出时间考虑的所有退相干速率下，在受限读出中仍存在改进。", "authors": [{"name": "Riccardo Zampieri"}, {"name": "Sougato Bose"}], "featured_authors": [{"name": "Riccardo Zampieri"}, {"name": "Sougato Bose"}], "author_count": 2}, {"id": "2610.38844", "category": "quant-ph", "title": "Inferring the Number of Quantum State Transfers with Neural Networks", "abstract": "Repeated-use quantum state transfer (QST) goes beyond the single-use paradigm by accounting for the memory that accumulates inside the transmission channel when it is not reset between uses. Consequently, the map governing the $n^{\\mathrm{th}}$ use of the channel differs from use to use and carries a signature of each previous use. We ask whether this use number can be recovered from transmission data alone, and show that it can: a simple feed-forward neural network, given as input the Bloch vectors sent and received over a single use of an XX spin-chain channel, is able to identify the use number with an accuracy exceeding 90%. Exploiting the U(1) symmetry of the channel, we find that a reduced two-component representation of the transmitted states improves the accuracy further, to about 95%. We characterise the dependence of the classifier on the size and composition of the training data, finding that the number of sampled states and of sampled timings are equally important. We also identify the data set sizes required to reach a given accuracy. Finally, we quantify the severity of the residual misclassifications with an earth-mover distance on the confusion matrix.", "url": "https://arxiv.org/abs/2610.38844", "type": "理论", "summary": "重复使用量子状态转移 (QST) 超越了单次使用范式，它考虑了在使用之间未重置时在传输通道内累积的内存。因此，管理通道的 $n^{\\mathrm{th}}$ 使用的映射因使用而异，并且带有每个先前使用的签名。我们询问这个使用数量是否可以单独从传输数据中恢复，并证明它可以：一个简单的前馈神经网络，将通过 XX 自旋链通道的单次使用发送和接收的 Bloch 向量作为输入，能够以超过 90% 的准确度识别使用数量。利用通道的 U(1) 对称性，我们发现传输状态的简化二分量表示进一步提高了精度，达到约 95%。我们描述了分类器对训练数据的大小和组成的依赖性，发现采样状态的数量和采样时间同样重要。我们还确定了达到给定精度所需的数据集大小。最后，我们用混淆矩阵上的推土机距离来量化残留错误分类的严重性。", "authors": [{"name": "Hayden Zammit"}, {"name": "Tony J. G. Apollaro"}, {"name": "Gianluca Valentino"}, {"name": "Johann A. Briffa"}], "featured_authors": [{"name": "Hayden Zammit"}, {"name": "Tony J. G. Apollaro"}, {"name": "Gianluca Valentino"}, {"name": "Johann A. Briffa"}], "author_count": 4}, {"id": "2610.38847", "category": "quant-ph", "title": "Local Quantum Fault Tolerance Without Expansion", "abstract": "We study fault-tolerant quantum computation using a fixed, local error-correction rule and a geometrically simple code: the cubical $(d,d')$-Toric code with $d',d-d'\\geq 2$, including the 4D Toric code. Under sufficiently weak local-stochastic Pauli noise, our construction uses noiseless, bounded-depth classical processing per physical time step. Its correction cycle acts only on the current syndrome, has constant depth, and is repeated unchanged during idle logical computation; it requires neither multiscale decoder states nor scale-dependent communication delays. Our proof treats errors and syndromes as chains in a cubical complex, combining geometric shrinking under the sweep rule with a space--time explanation-tree argument inspired by Toom's theorem. It does not rely on expansion. We establish three results: this http URL higher-dimensional sweep rule. We give a local algorithm for choosing sweep corrections on cubical $(d,d')$-Toric complexes, resolving the local-existence question of Kubica and Preskill. 2. Fault-tolerant computation. We prove a circuit-level threshold theorem for noisy sweep cycles interleaved with logical gates. In particular, the 4D Toric code admits a fixed, constant-depth syndrome-based correction cycle without a multiscale decoder or expansion-based encoding. We do not claim constant total-depth overhead. 3. Ideal decoding under local-stochastic noise. For an initial local-stochastic Pauli error of rate $p$ below threshold, $n^{d+1}$ noiseless sweep cycles recover the encoded state on a side-length-$n$ $(d,d')$-Toric code with probability at least $1-O(\\operatorname{poly}(n))p^{\\Omega(n)}$, extending earlier guarantees for independent errors.", "url": "https://arxiv.org/abs/2610.38847", "type": "理论+数值", "summary": "我们使用固定的局部纠错规则和几何简单的代码来研究容错量子计算：具有 $d',d-d'\\geq 2$ 的立方 $(d,d')$-Toric 代码，包括 4D Toric 代码。在足够弱的局部随机泡利噪声下，我们的构造在每个物理时间步上使用无噪声、有界深度的经典处理。其校正周期仅作用于当前校正子，具有恒定的深度，并且在空闲逻辑计算期间不变地重复；它既不需要多尺度解码器状态，也不需要依赖于尺度的通信延迟。我们的证明将错误和综合症视为立方体中的链，将扫描规则下的几何收缩与受图姆定理启发的时空解释树论证相结合。它不依赖于扩展。我们建立三个结果：这个http URL高维扫描规则。我们给出了一种在立方$(d,d')$-Toric 复形上选择扫掠校正的局部算法，解决了 Kubica 和 Preskill 的局部存在问题。 2.容错计算。我们证明了与逻辑门交错的噪声扫描周期的电路级阈值定理。\n\n特别是，4D Toric 码允许固定、恒定深度的基于校正子的校正周期，而无需多尺度解码器或基于扩展的编码。我们不要求总深度开销恒定。 3.局部随机噪声下的理想解码。对于速率 $p$ 低于阈值的初始局部随机泡利误差，$n^{d+1}$ 无噪声扫描周期以至少 $1-O(\\operatorname{poly}(n))p^{\\Omega(n)}$ 的概率恢复边长 $n$ $(d,d')$-Toric 码上的编码状态，扩展了对独立误差的早期保证。", "authors": [{"name": "David Ponarovsky"}], "featured_authors": [{"name": "David Ponarovsky"}], "author_count": 1}, {"id": "2610.39067", "category": "quant-ph", "title": "Individually Addressed Logical Pauli Measurements by QLDPC Surgery on a Trapped Ion Quantum Computer", "abstract": "Quantum low-density parity check (QLDPC) codes may lead to order-of-magnitude reductions in the qubit overhead required for fault-tolerant quantum computation. Achieving this improved overhead requires logical operations that selectively address individual logical qubits encoded within multi-qubit code blocks. Recently proposed architectures achieve this through QLDPC surgery, in which non-destructive Pauli measurements are performed using ancillary ''gadget'' systems transiently entangled with the code block, generalising lattice surgery. Here we implement QLDPC surgery on a [[10,2,3]] generalised bicycle code using Quantinuum's H2-2 trapped ion processor. A single-round surgery measurement using seven gadget qubits measures the $\\bar{X}_1$ operator with a 0.72 [0.32, 1.41]% (95% credible interval) error rate and agrees with subsequent transversal measurement with 1.03 [0.60, 1.65]% error. Decoding across three rounds of syndrome extraction suppresses the gadget measurement error, reducing the error rate to below 0.26%. The syndrome after surgery confirms return to the code space and the unaddressed ''spectator'' qubit is preserved with error 0.21 [0.04, 0.67]% during the three-round measurement. We further demonstrate composition of conjugate basis gadgets by sequentially measuring $\\bar{X}_1$ then $\\bar{Z}_2$, reusing the gadget qubits, and obtain a 1.12 [0.60, 1.94]% error in the $\\bar{Z}_2$ measurement. These results constitute a hardware validation of the generalised surgery primitive underlying Pauli-based computing for QLDPC architectures.", "url": "https://arxiv.org/abs/2610.39067", "type": "实验", "summary": "量子低密度奇偶校验（QLDPC）代码可能会导致容错量子计算所需的量子位开销减少一个数量级。实现这种改进的开销需要选择性地寻址多量子位代码块内编码的各个逻辑量子位的逻辑操作。最近提出的架构通过 QLDPC 手术实现了这一点，其中使用与代码块短暂纠缠的辅助“小工具”系统执行非破坏性泡利测量，从而概括了晶格手术。在这里，我们使用 Quantinuum 的 H2-2 俘获离子处理器对 [[10,2,3]] 广义自行车代码实施 QLDPC 手术。使用七个小工具量子位的单轮手术测量以 0.72 [0.32, 1.41]%（95% 可信区间）的错误率测量 $\\bar{X}_1$ 运算符，并与随后的横向测量一致，错误率为 1.03 [0.60, 1.65]%。经过三轮综合症提取的解码抑制了设备测量误差，将错误率降低到 0.26% 以下。\n\n手术后的综合症确认返回到代码空间，并且在三轮测量期间未寻址的“旁观者”量子位被保留，误差为 0.21 [0.04, 0.67]%。我们通过顺序测量 $\\bar{X}_1$ 然后 $\\bar{Z}_2$ 进一步演示共轭基 gadget 的组成，重复使用 gadget 量子位，并在 $\\bar{Z}_2$ 测量中获得 1.12 [0.60, 1.94]% 的误差。这些结果构成了对 QLDPC 架构的基于泡利计算的广义手术原语的硬件验证。", "authors": [{"name": "Surabhi Luthra"}, {"name": "Alex Owens"}], "featured_authors": [{"name": "Surabhi Luthra"}, {"name": "Alex Owens"}], "author_count": 2}, {"id": "2610.39091", "category": "quant-ph", "title": "Time-Switching Energy-Harvesting Quantum Relay-Assisted FSO Communication with Displaced Squeezed Signaling",
