y description of SOC-induced phenomena and offers a systematic way for the identification of SOC-driven functional materials.", "url": "https://arxiv.org/abs/2610.40149", "type": "理论", "summary": "自旋轨道耦合（SOC）在凝聚态物理的广泛现象中发挥着关键作用。最近发展的自旋空间群理论为表征 SOC 相关现象的基本对称破缺特征提供了新的视角，但其全部潜力仍有待探索。在这里，我们提供了一个通用框架，将 SOC 引起的对称性破缺与物理属性的修改和新物理效应的出现联系起来。该方法结合了最近开发的定向自旋空间群（OSSG）形式主义，它可以明确地描述由 SOC 引起的对称性降低。通过使用连接实数空间和自旋空间的 SOC 张量对 SOC 哈密顿量进行参数化，可以为描述任何物理量的响应张量构造 SOC 分量的扩展。该框架不仅决定了 SOC 引起的响应是否允许对称，还决定了它出现的 SOC 最低阶及其对磁各向异性的依赖性。\n\n作为代表性应用，我们分析了 II 型多铁性材料中的磁电耦合，结果表明不同系统中的磁感应电极化可能是不同阶 SOC 效应的结果，并且可以表现出不同的磁各向异性特征。我们进一步将该理论应用于反铁磁体中的反常霍尔效应和自旋磁化，证明它们在 OSSG 下的独特变换特性允许大的反常霍尔响应与弱自旋磁化共存。对 MAGNDATA 数据库中材料的高通量分析确定了几种有利于这种共存的基于对称的材料类别。总体而言，所提出的框架提供了 SOC 引起的现象的统一对称性描述，并为识别 SOC 驱动的功能材料提供了系统的方法。", "authors": [{"name": "Yuntian Liu"}, {"name": "Xiaobing Chen"}, {"name": "Yutong Yu"}, {"name": "Jesús Etxebarria"}, {"name": "J. Manuel Perez-Mato"}, {"name": "Qihang Liu"}], "featured_authors": [{"name": "Yuntian Liu"}, {"name": "Xiaobing Chen"}, {"name": "Yutong Yu"}, {"name": "Jesús Etxebarria"}, {"name": "J. Manuel Perez-Mato"}, {"name": "Qihang Liu"}], "author_count": 6}, {"id": "2610.40251", "category": "cond-mat", "title": "Chiral superconductivity on a closed Klein bottle: a chirality wall and its Majorana seam spectrum", "abstract": "We study a spinless $\\pi$-flux lattice superconductor whose normal-state momentum-space fundamental domain is a Klein bottle. Within this model, a glide lift and a hidden antiunitary symmetry independently force the Bogoliubov--de Gennes (BdG) Chern number to vanish. A diagonal pairing breaks the antiunitary obstruction exactly when its real part is nonzero; this is necessary, not sufficient, for a chiral phase. We derive explicit Pfaffians determining Chern parity and identify three analytic families of gap closings in a real-pairing section. For a chiral state on a closed real-space Klein bottle, the prescribed pairing and gluing produce a $\\Delta C=2$ chirality wall. A translation-invariant unfolding resolves two co-propagating Majorana branches. Their finite-size levels depend on circumference and holonomy; the near-zero pair is lifted at first order by allowed local seam perturbations. A cut-cylinder control has the same low-energy channel count, so gluing reconnects existing gapless content. We also distinguish literal gluing from deck projection: particle--hole symmetry exchanges the deck eigenblocks, precluding their interpretation as independent BdG quotient Hamiltonians. The contribution is a model-specific account of pairing compatibility and closed-surface seam spectra. The energy cost is evaluated for a fixed pairing background; neither a protected zero mode nor a self-consistent wall solution is claimed.", "url": "https://arxiv.org/abs/2610.40251", "type": "理论+数值", "summary": "我们研究了一种无自旋 $\\pi$-通量晶格超导体，其正常态动量空间基本域是克莱因瓶。在该模型中，滑翔升力和隐藏的反酉对称性独立地迫使 Bogoliubov-de Gennes (BdG) 陈数消失。当对角配对的实部非零时，它恰好打破了反酉障碍；对于手性相来说，这是必要的，但还不够。我们推导了确定陈宇称的显式普法夫式，并确定了实配对部分中间隙闭合的三个分析族。对于封闭实空间克莱因瓶上的手性状态，规定的配对和粘合会产生 $\\Delta C=2$ 手性墙。平移不变展开解决了两个共同传播的马约拉纳分支。它们的有限大小水平取决于周长和完整性；近零对通过允许的局部接缝扰动在一阶提升。切割圆柱体控制具有相同的低能量通道数，因此粘合可以重新连接现有的无间隙内容。我们还区分了字面粘合和甲板投影：粒子-空穴对称性交换了甲板本征块，排除了它们作为独立 BdG 商哈密顿量的解释。\n\n其贡献是配对兼容性和闭合表面接缝光谱的模型特定说明。针对固定配对背景评估能量成本；既没有提出受保护的零模式，也没有提出自洽墙解决方案。", "authors": [{"name": "Junhao"}, {"name": "Wang"}], "featured_authors": [{"name": "Junhao"}, {"name": "Wang"}], "author_count": 2}, {"id": "2610.40297", "category": "cond-mat", "title": "Topological Quantum Spin Liquids in a Ladder with Majorana fermions and p-wave Superconductivity", "abstract": "In this article, we address the possibility of topological quantum spin liquids with only short-range (spin) correlations in the whole phase diagram in a ladder system, through an exactly solvable model which represents a generalization of the two-dimensional Kitaev honeycomb spin model to a ribbon geometry. This system gives rise to $\\mathbb{Z}_2$ gauge fields emerging in a static way in the ground state through Majorana fermions which then produce either $0$ or $\\pi$ flux. Through a quantum field theory perspective, mathematical and Density Matrix Renormalization Group results, we present our progress on the geometrical, topological and physical classification of this model through observables navigating on the whole phase diagram presenting three spin-liquid phases with a spin gap and a metallic phase in the sense of Majorana fermions. We propose a bulk-edge correspondence revealing the presence of protected zero-energy Majorana fermions at the edge in the phases with a gap and revealing also the presence of itinerant Majorana fermions in the bulk in the topological liquid phase. The proposed approach allows us to distinguish between properties of the brickwall ladder giving rise to a special line and those of the square ladder allowing for the gapless Majorana liquid phase. This model gives some hope on finding solutions for topological quantum spin models, e.g. with $\\pi$ flux, on a square lattice geometry. This approach also allows for a correspondence onto models of topological superconductivity.", "url": "https://arxiv.org/abs/2610.40297", "type": "理论+数值", "summary": "在本文中，我们通过一个精确可解的模型来解决梯形系统中整个相图中仅具有短程（自旋）相关性的拓扑量子自旋液体的可能性，该模型表示二维 Kitaev 蜂窝自旋模型到带状几何的推广。该系统通过马约拉纳费米子在基态中以静态方式产生 $\\mathbb{Z}_2$ 规范场，然后产生 $0$ 或 $\\pi$ 通量。通过量子场论的视角、数学和密度矩阵重整化群的结果，我们通过在整个相图上的可观测值导航来展示我们在该模型的几何、拓扑和物理分类方面的进展，该相图呈现出具有自旋间隙的三个自旋液相和马约拉纳费米子意义上的金属相。我们提出了一种整体边缘对应关系，揭示了在有间隙的相的边缘处存在受保护的零能量马约拉纳费米子，并且还揭示了在拓扑液相的主体中存在流动的马约拉纳费米子。\n\n所提出的方法使我们能够区分产生特殊线的砖墙梯子的特性和允许无间隙马约拉纳液相的方梯子的特性。该模型为寻找拓扑量子自旋模型的解决方案带来了一些希望，例如具有 $\\pi$ 通量，在方晶格几何上。这种方法还允许与拓扑超导模型相对应。", "authors": [{"name": "Magali Korolev"}, {"name": "Fan Yang"}, {"name": "Erik S. Sørensen"}, {"name": "Karyn Le Hur"}], "featured_authors": [{"name": "Magali Korolev"}, {"name": "Fan Yang"}, {"name": "Erik S. Sørensen"}, {"name": "Karyn Le Hur"}], "author_count": 4}, {"id": "2610.40353", "category": "cond-mat", "title": "Multidimensional revival dynamics in a bosonic many-body system", "abstract": "The collapse and revival of localized states in many-body systems is a quintessential example of a quantum interference phenomenon that cannot be explained purely within mean-field theories. Historically, the majority of previous work on quantum revivals has been in a Schrödinger mechanics context, typically for effectively 1D systems with a focus on the autocorrelation function as the key detection observable. The general revival subject acquires a far greater complexity in the bosonic many-body context that offers a larger variety of observables and intrinsically implies high dimensionality. Here, the focus is on the simplest nontrivial (i.e., not 1D) bosonic many-body system, namely a symmetric two-site Bose-Hubbard model. The non-equilibrium situation of a coherent initial state prepared on one of the two sites of this integrable 2D system in the strongly self-trapping regime is considered. The revival behaviors emerging from the resulting dynamics within expectation values, coherences, and the autocorrelation function are theoretically derived, and the entanglement behavior is illustrated. Several new features, unknown so far in the Schrödinger context and identified here in terms of five ``puzzles'', are encountered and discussed, among them, a synchronized resurgence behavior, differing revivals times depending on the specific observable, and a manifestation of a precession that appears in the underlying mean field dynamics. These new phenomena can be entirely understood through a comprehensive semiclassical theory, building upon the underlying classical (mean-field) phase-space structure. A quantitative comparison of the latter with semiclassical predictions and quantum perturbative calculations yields an overall excellent agreement and confirms that a full semiclassical theory is pivotal for the understanding of these genuinely quantum many-body interference phenomena.", "url": "https://arxiv.org/abs/2610.40353", "type": "理论+数值", "summary": "多体系统中局域态的崩溃和复兴是量子干涉现象的典型例子，这种现象不能纯粹用平均场理论来解释。从历史上看，之前关于量子复兴的大部分工作都是在薛定谔力学背景下进行的，通常针对有效的一维系统，重点关注自相关函数作为关键的检测可观测值。一般的复兴主题在玻色子多体环境中获得了更大的复杂性，提供了更多种类的可观测值，并且本质上意味着高维度。这里，重点是最简单的非平凡（即非一维）玻色多体系统，即对称两点 Bose-Hubbard 模型。考虑在强自俘获状态下该可积二维系统的两个位点之一上准备的相干初始态的非平衡情况。从理论上推导了期望值、相干性和自相关函数内的动态变化所出现的复兴行为，并说明了纠缠行为。\n\n遇到并讨论了迄今为止在薛定谔背景下未知的几个新特征，并在此根据五个“难题”进行了识别，其中包括同步复苏行为、取决于特定可观测值的不同复苏时间，以及出现在底层平均场动力学中的岁差表现。这些新现象可以通过建立在基础经典（平均场）相空间结构基础上的综合半经典理论来完全理解。后者与半经典预测和量子微扰计算的定量比较产生了总体上极好的一致性，并证实完整的半经典理论对于理解这些真正的量子多体干涉现象至关重要。", "authors": [{"name": "Denis Ullmo"}, {"name": "Steven Tomsovic"}, {"name": "Gabriel M. Lando"}, {"name": "Peter Schlagheck"}], "featured_authors": [{"name": "Denis Ullmo"}, {"name": "Steven Tomsovic"}, {"name": "Gabriel M. Lando"}, {"name": "Peter Schlagheck"}], "author_count": 4}, {"id": "2610.40410", "category": "cond-mat", "title": "Light-induced chiral altermagnets from conventional antiferromagnets", "abstract": "Altermagnets combine compensated collinear magnetic order with momentum-dependent nonrelativistic spin splitting, offering new opportunities for spintronic applications. Here, we propose a route to optically induce altermagnetism through coherent lattice control. Using symmetry analysis, we identify phonon distortions that lift the spin degeneracy of conventional antiferromagnets while preserving the rotational symmetries connecting opposite-spin sublattices. Among these, geometric chiral phonons provide a particularly appealing pathway, linking the emergence of altermagnetism to structural chirality. Taking Fe$_2$TeO$_6$ as a prototype, we demonstrate that a linearly polarized mid-infrared pulse can drive a structural instability through negative biquadratic coupling between an infrared-active phonon and an optically silent, symmetry-breaking mode. First-principles-based lattice dynamics reveal the emergence of a transient chiral distortion, while electronic-structure calculations establish that the light-induced structure exhibits nonrelativistic spin splitting characteristic of altermagnetism. Our results establish a symmetry-guided pathway toward the ultrafast optical control of altermagnetic states through nonlinear phononics.", "url": "https://arxiv.org/abs/2610.40410", "type": "理论+数值", "summary": "交变磁体将补偿共线磁序与动量相关的非相对论自旋分裂相结合，为自旋电子应用提供了新的机会。在这里，我们提出了一种通过相干晶格控制来光学诱导交变磁性的途径。通过对称分析，我们确定了声子畸变，该畸变可以提升传统反铁磁体的自旋简并性，同时保持连接相反自旋子晶格的旋转对称性。其中，几何手性声子提供了一条特别有吸引力的途径，将交变磁性的出现与结构手性联系起来。以 Fe$_2$TeO$_6$ 作为原型，我们证明了线性偏振中红外脉冲可以通过红外活性声子和光学静音、对称破缺模式之间的负双二次耦合来驱动结构不稳定性。基于第一原理的晶格动力学揭示了瞬态手性畸变的出现，而电子结构计算表明光诱导结构表现出交变磁性的非相对论自旋分裂特征。\n\n我们的结果建立了一条对称引导的途径，通过非线性声子学实现交变磁态的超快光学控制。", "authors": [{"name": "Jorge Cardenas-Gamboa"}, {"name": "Devika Jayadeep"}, {"name": "Aritz Leonardo"}, {"name": "Gregory A. Fiete"}, {"name": "Jeroen van den Brink"}, {"name": "Maia G. Vergniory"}], "featured_authors": [{"name": "Jorge Cardenas-Gamboa"}, {"name": "Devika Jayadeep"}, {"name": "Aritz Leonardo"}, {"name": "Gregory A. Fiete"}, {"name": "Jeroen van den Brink"}, {"name": "Maia G. Vergniory"}], "author_count": 6}, {"id": "2610.40416", "category": "cond-mat", "title": "Micromagnetic Lagrangian and Hamiltonian Normal-Mode Formulation of Cavity Magnon-Photon Interactions", "abstract": "We investigate magnon-photon interactions in a resonant cavity starting from the coupled Maxwell and Landau-Lifshitz equations linearized about an arbitrary micromagnetic ground state. By introducing an electric vector potential and a suitable interaction Lagrangian, the formulation avoids the cancellation of large magnetostatic contributions that arises in the conventional magnetic-vector-potential description and becomes inaccurate under modal truncation. The magnetization and cavity fields are expanded in the normal modes of the uncoupled magnetic and electromagnetic subsystems, with coupling coefficients given by overlap integrals of the corresponding eigenfunctions. The resulting multimode Lagrangian has a noncanonical structure due to the gyrotropic terms, and the corresponding Hamiltonian formulation is obtained using the Faddeev-Jackiw approach. The radiative magnon-photon interaction is encoded in the resulting Poisson-bracket structure, while the cavity-induced modification of the magnetostatic field enters explicitly in the Hamiltonian. The coupled system is diagonalized through a generalized Bogoliubov transformation, yielding canonical polariton variables that provide a natural basis for quantization. Application to a perpendicularly magnetized YIG disk in a rectangular microwave cavity shows hybridization between the cavity mode and several magnetostatic modes, together with appreciable cavity-wall-induced frequency shifts when the sample is placed close to the conducting walls.", "url": "https://arxiv.org/abs/2610.40416", "type": "理论", "summary": "我们从关于任意微磁基态线性化的耦合麦克斯韦和朗道-利夫什茨方程开始研究谐振腔中的磁子-光子相互作用。通过引入电矢量势和适当的相互作用拉格朗日，该公式避免了传统磁矢量势描述中出现的大静磁贡献的抵消，并且在模态截断下变得不准确。磁化场和空腔场以非耦合磁性和电磁子系统的正常模式展开，耦合系数由相应本征函数的重叠积分给出。由于陀螺项，所得多模拉格朗日具有非规范结构，并且使用 Faddeev-Jackiw 方法获得相应的哈密顿公式。辐射磁子-光子相互作用被编码在所得的泊松括号结构中，而空腔引起的静磁场修改则明确地进入哈密顿量。\n\n耦合系统通过广义的 Bogoliubov 变换进行对角化，产生为量化提供自然基础的规范极化子变量。在矩形微波腔中垂直磁化的 YIG 盘上的应用显示腔模式和几种静磁模式之间的混合，以及当样品靠近导电壁放置时明显的腔壁引起的频移。", "authors": [{"name": "Claudio Serpico"}, {"name": "Marco Lembo"}, {"name": "Giovanni Miano"}], "featured_authors": [{"name": "Claudio Serpico"}, {"name": "Marco Lembo"}, {"name": "Giovanni Miano"}], "author_count": 3}, {"id": "2610.40417", "category": "cond-mat", "title": "Seeding and Amplification of Chaos in Long-Range Interacting Spin Chains", "abstract": "Truncating weak interactions is a natural simplification of a many-body Hamiltonian, but the validity of this approximation need not be uniform in distance and time. In a chaotic system, a weak long-range coupling can seed a small disturbance far from its source, after which the local dynamics can amplify that disturbance exponentially. We study this mechanism in an infinite-temperature classical Heisenberg spin chain with a dominant nearest-neighbor exchange and a weak interaction tail. Using a classical decorrelator, we compare exponentially and power-law decaying tails over several decades in interaction strength. For exponentially decaying interactions, the long-distance front remains ballistic when the tail is sufficiently shallow, with a velocity controlled by the competition between the spatial decay of the seed and the local chaotic growth. For sufficiently rapid exponential decay, the nearest-neighbor front, which is defined by an intrinsic butterfly velocity $v_b$, is recovered within the accessible space-time window. For power-law interactions, the arrival time is logarithmic in distance for all exponents studied, corresponding to an exponentially expanding spatial front; the power-law exponent controls the coefficient of this logarithm. We interpret both behaviors using a seeding-and-amplification picture in which long-range couplings generate weak disturbances throughout the chain whose growth is governed primarily by the local nearest-neighbor dynamics. In this picture, the overall strength of the tail primarily controls when the long-range front becomes visible, while its spatial decay controls the propagation law. Thus a weak interaction tail can leave conventional spin-dynamical observables essentially unchanged while qualitatively altering the long-distance propagation of decorrelation.", "url": "https://arxiv.org/abs/2610.40417", "type": "理论", "summary": "截断弱相互作用是多体哈密顿量的自然简化，但这种近似的有效性不必在距离和时间上一致。在混沌系统中，弱长程耦合可以在远离其源的地方产生小扰动，之后局部动力学可以以指数方式放大该扰动。我们在无限温度经典海森堡自旋链中研究了这种机制，该自旋链具有主导的最近邻交换和弱相互作用尾部。使用经典的去相关器，我们比较了几十年来指数衰减尾部和幂律衰减尾部的相互作用强度。对于指数衰减相互作用，当尾部足够浅时，长距离前沿保持弹道，速度由种子的空间衰减和局部混沌生长之间的竞争控制。为了足够快的指数衰减，由固有蝴蝶速度 $v_b$ 定义的最近邻前沿在可访问的时空窗口内恢复。\n\n对于幂律相互作用，对于所有研究的指数来说，到达时间是距离的对数，对应于指数扩展的空间前沿；幂律指数控制该对数的系数。我们使用播种和放大图来解释这两种行为，其中长程耦合在整个链中产生微弱的干扰，其增长主要受局部最近邻动力学的控制。在这张图中，尾部的整体强度主要控制远距离锋何时变得可见，而其空间衰减则控制传播规律。因此，弱相互作用尾部可以使传统的自旋动力学可观测量本质上保持不变，同时定性地改变去相关的长距离传播。", "authors": [{"name": "Sareen Sabra"}, {"name": "Jeffrey G. Rau"}], "featured_authors": [{"name": "Sareen Sabra"}, {"name": "Jeffrey G. Rau"}], "author_count": 2}, {"id": "2610.40428", "category": "cond-mat", "title": "Teleported free energy simulations", "abstract": "Escorted free energy simulations reduce dissipation with a flow field that follows the equilibrium distribution. A continuous flow, however, cannot transfer probability between metastable basins. We show that any escort then faces a variance floor set by the change in basin weights, and lift it by adding teleportation: jumps at a rate proportional to the driving rate. We derive the corresponding nonequilibrium identity, the zero-dissipation condition, and the minimal number of jumps it requires, and illustrate the gain on an exactly solvable model and a tilted double well.", "url": "https://arxiv.org/abs/2610.40428", "type": "理论+数值", "summary": "护送自由能模拟通过遵循平衡分布的流场减少耗散。然而，连续流不能在亚稳盆地之间转移概率。我们表明，任何护送都会面临由盆地重量变化设定的方差下限，并通过添加隐形传态来提升它：以与驾驶速率成比例的速率跳跃。我们推导了相应的非平衡恒等式、零耗散条件及其所需的最小跳跃次数，并说明了精确可解模型和倾斜双阱上的增益。", "authors": [{"name": "Davide Carbone"}], "featured_authors": [{"name": "Davide Carbone"}], "author_count": 1}, {"id": "2610.40526", "category": "cond-mat", "title": "Quasi-Phases of Quantum Matter", "abstract": "Within quantum many-body phase diagrams, continuous transition lines can appear and then terminate. However, it has remained unclear whether the neighboring regimes can be meaningfully described as distinct phases, akin to water and vapour, since any sharp characterization would have to go beyond the usual notion of phases of matter. We answer this in the affirmative by introducing quasi-phases: gapped regimes near a critical point that are connected in the broader phase diagram, but not by any gapped path accessible from small perturbations of the critical theory. The physical consequences include interface modes between regimes in the same phase of matter. More striking still, describing both the extended critical line and the gapped path connecting the regimes requires a bigger multicritical parent theory. In spin-chain examples with continuous terminating lines with central charge $c=1$, we find multicritical $c=3/2$ and $c=9/5$ orbifolds describing so-called 'quotient symmetry protected' and 'representation symmetry protected' topological phenomena. While one-dimensional symmetry-protected topological phases are labeled by projective representation classes, these quasi-phases can have interface modes carrying higher-dimensional linear representations. We turn this into a constructive principle through a weakening of the Lieb-Schultz-Mattis anomaly. Supporting distinct quasi-phases makes an unnecessary critical point infrared-necessary, even if it is unnecessary at the ultraviolet scale. This condition is more restrictive than simply having a codimension-one critical line, revealing richer structure within phases of matter than their conventional classification suggests.", "url": "https://arxiv.org/abs/2610.40526", "type": "理论+数值", "summary": "在量子多体相图中，连续的过渡线可以出现然后终止。然而，目前尚不清楚是否可以将相邻状态有意义地描述为类似于水和蒸汽的不同相，因为任何明确的表征都必须超出物质相的通常概念。我们通过引入准相来回答这个问题：临界点附近的有隙状态在更广泛的相图中相连，但不是通过临界理论的小扰动可访问的任何有隙路径。物理后果包括同一物质相的状态之间的界面模式。更引人注目的是，描述延伸的临界线和连接政权的差距路径需要一个更大的多批判母体理论。在具有中心电荷 $c=1$ 的连续终止线的自旋链示例中，我们发现多临界 $c=3/2$ 和 $c=9/5$ 轨道折叠描述所谓的“商对称保护”和“表示对称保护”拓扑现象。\n\n虽然一维对称保护拓扑相由投影表示类标记，但这些准相可以具有携带更高维线性表示的界面模式。我们通过削弱利布-舒尔茨-马蒂斯异常将其转化为建设性原则。支持不同的准相使得红外临界点成为必要，即使在紫外尺度上它是不必要的。这种条件比简单地拥有一条余维一临界线更具限制性，它揭示了物质相内比传统分类所暗示的更丰富的结构。", "authors": [{"name": "Nick G. Jones"}, {"name": "Paul Fendley"}, {"name": "Nathanan Tantivasadakarn"}, {"name": "Ruben Verresen"}], "featured_authors": [{"name": "Nick G. Jones"}, {"name": "Paul Fendley"}, {"name": "Nathanan Tantivasadakarn"}, {"name": "Ruben Verresen"}], "author_count": 4}, {"id": "2610.40581", "category": "cond-mat", "title": "Odd Elasticity in Strain-Gradient Continua: Anisotropy Classification and Non-Hermitian Elastodynamics", "abstract": "Odd elasticity extends continuum mechanics to active nonconservative systems containing internal energy sources, such as robotic active metamaterials with nonreciprocal feedback. Modeling these systems as effective continua requires relaxing Maxwell-Betti reciprocity, which results in stiffness tensors lacking major symmetry. In this contribution, we extend this framework to 3D strain-gradient odd elasticity to incorporate the length scales inherent in these heterogeneous systems. By applying the full hierarchy of 3D point-group symmetries along chiral and achiral branches, we derive the exhaustive set of fourth-, fifth-, and sixth-order odd elastic stiffness tensors. Further, utilizing the dynamic principle of virtual work, we formulate the equilibrium equations, higher-order boundary conditions, and the generalized acoustic tensor for elastodynamic analysis. The results demonstrate that nonreciprocal moduli survive even under full isotropy in the sixth-order stiffness, under hemitropy in the fifth-order stiffness, and under cubic symmetry in fourth-order stiffness. In contrast, the elastodynamic analysis reveals that under isotropic and hemitropic limits, despite the underlying odd stiffness moduli, the acoustic tensor remains unconditionally Hermitian. Non-Hermitian elastodynamics is shown to require anisotropy. By numerically analyzing a transversely hemitropic odd elastic continuum, we demonstrate that this symmetry reduction results in non-Hermitian elastodynamic phenomena including exceptional points in the dispersion spectra and active energy exchange through simultaneous amplification and attenuation of the elastic wave components. These results provide the necessary theoretical foundation for future multiscale homogenization frameworks for anisotropic strain-gradient active microstructures, and for the design of nonreciprocal strain-gradient metamaterials.", "url": "https://arxiv.org/abs/2610.40581", "type": "理论+数值", "summary": "奇弹性将连续介质力学扩展到包含内部能源的主动非保守系统，例如具有非互易反馈的机器人主动超材料。将这些系统建模为有效连续体需要松弛麦克斯韦-贝蒂互易性，这会导致刚度张量缺乏主要对称性。在这篇文章中，我们将此框架扩展到 3D 应变梯度奇弹性，以纳入这些异质系统中固有的长度尺度。通过沿手性和非手性分支应用 3D 点群对称性的完整层次结构，我们导出了详尽的四阶、五阶和六阶奇弹性刚度张量集。此外，利用虚功的动力学原理，我们制定了用于弹动力分析的平衡方程、高阶边界条件和广义声学张量。结果表明，即使在六阶刚度的完全各向同性、五阶刚度的半向性和四阶刚度的立方对称下，不可逆模量仍然存在。\n\n相反，弹性动力学分析表明，在各向同性和半同性极限下，尽管存在潜在的奇刚度模量，声学张量仍然无条件厄米特。非厄米弹性动力学被证明需要各向异性。通过对横向半异性奇弹性连续体进行数值分析，我们证明这种对称性降低会导致非厄米弹性动力学现象，包括色散谱中的异常点以及通过同时放大和衰减弹性波分量进行主动能量交换。这些结果为未来各向异性应变梯度活性微结构的多尺度均质化框架以及非互易应变梯度超材料的设计提供了必要的理论基础。", "authors": [{"name": "Payam Poorsolhjouy"}], "featured_authors": [{"name": "Payam Poorsolhjouy"}], "author_count": 1}, {"id": "2610.40596", "category": "cond-mat", "title": "Algebraic theory of abelian fractons and beyond", "abstract": "We develop an algebraic theory of fusion, mobility, and statistics in abelian gapped fracton orders and topological phases. The framework generalizes the algebraic description of abelian anyons to systems with restricted-mobility and spatially extended excitations. We consider translation-invariant bosonic systems whose pointlike and extended excitations have finite fusion order. The basic objects are braided fusion complexes (BFCs): chain complexes encoding fusion and mobility, equipped with a braiding chain map encoding statistics. Their equivalence classes define braided fusion theories (BFTs). Our framework encompasses arbitrary translation-invariant Pauli codes, as well as all abelian anyon theories in two spatial dimensions, including chiral theories. We give evidence for the conjecture that every nondegenerate BFT can be realized as the excitation theory of a gapped phase and that the BFT describing such a phase is a phase invariant. We derive constraints on pointlike fusion and mobility, showing, for example, that neither the Pauli X nor Z sectors of the X-cube and anisotropic models can occur alone in a nondegenerate BFT. For nondegenerate theories with only pointlike excitations, we extract a simpler theory of mutual statistics, consisting of a fusion module and a map to its statistical dual. This theory of mutual statistics is an invariant of the BFT and, at odd fusion order, gives an equivalent description of the full braided fusion theory. We interpret remote detection as the generalization of mutual statistics to fracton orders. In the BFC setting, we give a precise formulation of the excitation-detector principle: every nontrivial excitation can be detected by an operator supported at spatial infinity, and every nontrivial detector detects some excitation. Assuming a unique infinite-space ground state, we prove that this principle is equivalent to nondegeneracy.", "url": "https://arxiv.org/abs/2610.40596", "type": "理论", "summary": "我们开发了阿贝尔有隙分形阶和拓扑相中的融合、迁移性和统计的代数理论。该框架将阿贝尔任意子的代数描述推广到具有受限迁移性和空间扩展激励的系统。我们考虑平移不变的玻色子系统，其点状和扩展激励具有有限的融合阶数。基本对象是编织融合复合体（BFC）：编码融合和移动性的链复合体，配备编织链图编码统计。它们的等价类定义了编织融合理论（BFT）。我们的框架涵盖任意平移不变泡利码，以及二维空间维度上的所有阿贝尔任意子理论，包括手性理论。我们为以下猜想提供了证据：每个非简并 BFT 都可以实现为带隙相的激励理论，并且描述这种相的 BFT 是相不变的。我们得出了对点状融合和移动性的约束，例如，X 立方体和各向异性模型的泡利 X 和 Z 扇区都不能单独出现在非简并 BFT 中。\n\n对于仅具有点状激励的非简并理论，我们提取了一种更简单的互统计理论，由融合模块和其统计对偶图组成。这种互统计理论是 BFT 的不变量，并且在奇融合阶上给出了全编织融合理论的等效描述。我们将远程检测解释为相互统计对分形阶数的概括。在 BFC 设置中，我们给出了激励检测器原理的精确表述：每个非平凡激励都可以由空间无穷大支持的算子检测到，并且每个非平凡检测器都会检测到一些激励。假设一个唯一的无限空间基态，我们证明这个原理等价于非简并性。", "authors": [{"name": "Wilbur Shirley"}, {"name": "Evan Wickenden"}, {"name": "Bowen Yang"}, {"name": "Agnès Beaudry"}, {"name": "Michael Hermele"}], "featured_authors": [{"name": "Wilbur Shirley"}, {"name": "Evan Wickenden"}, {"name": "Bowen Yang"}, {"name": "Agnès Beaudry"}, {"name": "Michael Hermele"}], "author_count": 5}, {"id": "2610.40657", "category": "cond-mat", "title": "Variational wavefunctions for ideal anyon gas: superfluid and skyrmion Hall crystal", "abstract": "The ground state of an ideal gas of anyons with statistical angle $\\theta\\in(0,\\pi)$ is a long-standing open problem, with renewed interest from the recent observations of fractional Chern insulators. In this work we construct variational wavefunctions that build in the exact anyon statistics and combine theory-guided composite-boson, composite-fermion and parton wavefunctions with neural-network correlations on the sphere. For spinless and SU(2) semions we confirm the paired anyon superfluid, well below the best crystal states. At $\\theta=\\pi/3$ liquids and crystals are closer in energy for the spinless case. For $\\theta=\\pi/3$ anyons with SU(3) flavor, we find two candidates. One is a skyrmion Hall crystal, in which the anyons form an integer quantum Hall state in the effective magnetic field from the spin texture. The other is a chiral color superconductor of six-anyon clusters, the color-flavor-locked pairing descendant of a holon metal with SU(3) color gauge symmetry and SU(3) flavor symmetry; its wavefunction is a hyperdeterminant rather than a product of parton determinants. Within our variational ansatz the color superconductor has better energy than both crystals and the color-flavor locked phases with U(1)$^2$ and Z$_3$ gauge groups. For twisted MoTe$_2$ this suggests that the reentrant integer quantum anomalous Hall phase is the skyrmion Hall crystal of the doped anyons, and that the observed superconductivity may be the color superconductor, which can undergo a transition to an $f+if$ BCS superconductor with a jump of the chiral central charge by 3.", "url": "https://arxiv.org/abs/2610.40657", "type": "理论+数值", "summary": "具有统计角 $\\theta\\in(0,\\pi)$ 的任意子理想气体的基态是一个长期存在的开放性问题，最近对分数陈绝缘体的观察重新引起了人们的兴趣。在这项工作中，我们构建了基于精确任意子统计的变分波函数，并将理论指导的复合玻色子、复合费米子和部分子波函数与球体上的神经网络相关性相结合。对于无自旋和 SU(2) 半子，我们确认了配对的任意子超流体，远低于最佳晶体状态。在 $\\theta=\\pi/3$ 下，无自旋情况下液体和晶体的能量更接近。对于具有 SU(3) 风格的 $\\theta=\\pi/3$ 任意子，我们找到了两个候选者。一种是斯格明子霍尔晶体，其中任意子在自旋织构的有效磁场中形成整数量子霍尔态。另一个是六任意子团簇的手性彩色超导体，是具有SU(3)色规对称性和SU(3)风味对称性的完整金属的色味锁定配对后代；它的波函数是超行列式而不是部分子行列式的乘积。\n\n在我们的变分拟构中，彩色超导体比晶体和带有 U(1)$^2$ 和 Z$_3$ 规范组的色味锁定相具有更好的能量。对于扭曲的MoTe$_2$，这表明重入整数量子反常霍尔相是掺杂任意子的斯格明子霍尔晶体，并且观察到的超导性可能是彩色超导体，其可以转变为$f+if$BCS超导体，手性中心电荷跳跃3。", "authors": [{"name": "Ya-Hui Zhang"}], "featured_authors": [{"name": "Ya-Hui Zhang"}], "author_count": 1}, {"id": "2610.37748", "category": "hep-th", "title": "Creation of the Universe in Lorentzian Classical Gravity", "abstract": "The singularity theorems and the past incompleteness of inflationary spacetimes suggest that the beginning of the Universe lies beyond the domain of semiclassical gravity. We show that the creation of the Universe can nevertheless be understood within Lorentzian gravity by allowing gravitational junctions, so that the full spacetime need not be a smooth manifold. We construct rotationally invariant cosmic creation gates joining any finite number $n\\geq2$ of locally de Sitter regions in $D\\geq3$ spacetime dimensions at a timelike perfect-fluid junction with $P=w\\rho$. For $w>-(D-3)/(D-2)$, they are geodesically complete in both temporal directions. The total spatial volume approaches finite, positive limits in the infinite past and future on the global-time foliation adapted to the junction fluid. We also construct exact deformed cosmic creation gates through nonlinear homogeneous backreaction that retain the initial volume while the future volume grows without bound. In these solutions, the junction fluid always expands, cooling for $w>0$ and heating for allowed $w<0$. Keeping the bulk regions locally de Sitter, we determine the linearized perturbations: in three dimensions, the generic inhomogeneous sector contains one hybrid sound mode and $n-1$ relative transverse modes; in four and higher dimensions, only the homogeneous hybrid sound mode survives. A finite-volume beginning requires fine-tuned homogeneous and inhomogeneous initial data, while causal response generically leads to unbounded future spatial volume. We also discuss a broader creation criterion allowing bounded past-volume oscillations. The gravitational equations determine conditioned admissible histories. We discuss implications for cosmology.", "url": "https://arxiv.org/abs/2610.37748", "type": "理论", "summary": "奇点定理和过去暴涨时空的不完整性表明，宇宙的起源超出了半经典引力的范围。我们表明，通过允许引力连接，宇宙的创造仍然可以在洛伦兹引力中被理解，因此整个时空不必是光滑的流形。我们构造旋转不变的宇宙创生门，将 $D\\geq3$ 时空维度中任意有限数量的 $n\\geq2$ 局部德西特区域连接到与 $P=w\\rho$ 类似时的完美流体连接处。对于 $w>-(D-3)/(D-2)$，它们在两个时间方向上都是测地完整的。总空间体积在无限的过去和未来中接近有限的正极限，以适应交界流体的全球时间叶状结构。我们还通过非线性同质反反应构造精确变形的宇宙创造门，保留初始体积，而未来体积无限增长。在这些解决方案中，结液总是膨胀，当 $w>0$ 时冷却，当 $w<0$ 时加热。\n\n保持大块区域局部德西特，我们确定线性化扰动：在三个维度中，通用非均匀扇区包含一种混合声模和 $n-1$ 相对横向模；在四个和更高的维度中，只有同质混合声音模式得以幸存。有限体积的开始需要微调均匀和非均匀的初始数据，而因果响应通常会导致无限的未来空间体积。我们还讨论了一个更广泛的创建标准，允许有限的过去成交量振荡。引力方程确定有条件的允许历史。我们讨论对宇宙学的影响。", "authors": [{"name": "Avipsa Chakrabarti"}, {"name": "Avik Chakraborty"}, {"name": "Martín Molina"}, {"name": "Ayan Mukhopadhyay"}, {"name": "Salomón Romero"}], "featured_authors": [{"name": "Avipsa Chakrabarti"}, {"name": "Avik Chakraborty"}, {"name": "Martín Molina"}, {"name": "Ayan Mukhopadhyay"}, {"name": "Salomón Romero"}], "author_count": 5}, {"id": "2610.37750", "category": "hep-th", "title": "Black Hole Entropy from Entangled Quantum Reference Frames", "abstract": "In the extended phase space of Donnelly and Freidel, the edge modes of a Schwarzschild black hole are dynamical reference frames whose phase space is the cotangent bundle of $\\mathrm{SL}(2,\\mathbb{R})$. Gluing the two exterior regions at the bifurcation point leaves a single canonical pair. Within the extended phase space, this pair can be described either by Kuchař's mass and difference of asymptotic times or by the area and the relative rapidity of the two frames, which are two gauge choices of the same system. The latter is the pair of Carlip and Teitelboim, and the relative rapidity is the time shift of the crossed product construction. We quantize the frames in this gauge and construct the gravitational entangling product of the two exteriors. Requiring the frames to be causal restricts them to the semigroup $\\mathrm{SL}^+(2,\\mathbb{R})$, whose Plancherel measure yields the Bekenstein--Hawking entropy as the entanglement entropy between the two exteriors, together with a logarithmic correction, both independent of the ultraviolet cutoff.", "url": "https://arxiv.org/abs/2610.37750", "type": "理论", "summary": "In the extended phase space of Donnelly and Freidel, the edge modes of a Schwarzschild black hole are dynamical reference frames whose phase space is the cotangent bundle of $\\mathrm{SL}(2,\\mathbb{R})$.在分叉点粘合两个外部区域会留下单个规范对。 Within the extended phase space, this pair can be described either by Kuchař's mass and difference of asymptotic times or by the area and the relative rapidity of the two frames, which are two gauge choices of the same system.后者是Carlip和Teitelboim对，相对速度是交叉乘积构造的时间平移。我们量化该规范中的框架并构造两个外部的引力纠缠积。 Requiring the frames to be causal restricts them to the semigroup $\\mathrm{SL}^+(2,\\mathbb{R})$, whose Plancherel measure yields the Bekenstein--Hawking entropy as the entanglement entropy between the two exteriors, together with a logarithmic correction, both independent of the ultraviolet cutoff.", "authors": [{"name": "Ludovic Varrin"}], "featured_authors": [{"name": "Ludovic Varrin"}], "author_count": 1}, {"id": "2610.37762", "category": "hep-th", "title": "Holomorphic fermions in $\\text{AdS}_{2}$", "abstract": "On two-dimensional Anti-de Sitter space, Majorana fermions with a discrete set of finely tuned, non-zero mass parameters possess conserved spinor--tensors that are symmetric and traceless. In complex coordinates, these correspond to pairs of holomorphic and anti-holomorphic half-integer spin currents and admit Laurent series mode expansions reminiscent of standard two-dimensional conformal field theories. We exploit this fact in order to fully parameterise the classical phase space associated with the equation of motion in terms of arbitrary (anti-)holomorphic functions. We further show that this parameterisation can be written covariantly in terms of a conformal Killing spinor--tensor, hinting at a hidden conformal symmetry. We also show they possess chiral algebras which are strict subalgebras of the one present in the corresponding theory on flat space.", "url": "https://arxiv.org/abs/2610.37762", "type": "理论", "summary": "在二维反德西特空间上，具有一组离散的精细调整的非零质量参数的马约拉纳费米子拥有守恒的旋量——对称且无迹的张量。在复坐标中，它们对应于全纯和反全纯半整数自旋流对，并允许洛朗级数模式展开，让人想起标准二维共形场论。我们利用这一事实，以便用任意（反）全纯函数来完全参数化与运动方程相关的经典相空间。我们进一步表明，这种参数化可以用共形 Killing 旋量（张量）来协变地编写，暗示隐藏的共形对称性。我们还证明它们具有手性代数，这是相应平坦空间理论中存在的严格子代数。", "authors": [{"name": "Calvin Y.-R. Chen"}, {"name": "Lukas W. Lindwasser"}], "featured_authors": [{"name": "Calvin Y.-R. Chen"}, {"name": "Lukas W. Lindwasser"}], "author_count": 2}, {"id": "2610.37766", "category": "hep-th", "title": "Quiver Lab -- A Computing Tool for Quiver Gauge Theories", "abstract": "Quiver Lab is a browser-based workspace for drawing quivers and exploring the moduli spaces of three-dimensional $\\mathcal{N} = 4$ theories. It computes Higgs and Coulomb branch Hilbert series, plethystic logarithms, supported refinements, and Decay and Fission Hasse diagrams. This note explains the Light and Expert workflows and the main computational methods", "url": "https://arxiv.org/abs/2610.37766", "type": "理论", "summary": "Quiver Lab 是一个基于浏览器的工作区，用于绘制箭袋并探索三维 $\\mathcal{N} = 4$ 理论的模空间。它计算希格斯和库仑分支希尔伯特级数、体积对数、支持的细化以及衰变和裂变哈斯图。本说明解释了 Light 和 Expert 工作流程以及主要计算方法", "authors": [{"name": "Zhenghao Zhong"}], "featured_authors": [{"name": "Zhenghao Zhong"}], "author_count": 1}, {"id": "2610.37776", "category": "hep-th", "title": "Go with the flow(s): radial de Sitter holography and $T^2 (+ Λ_2)$", "abstract": "What can we learn about a putative dual to de Sitter spacetime from the bulk? Conversely, what can a candidate dual theory teach us about the bulk? In this work, we construct midisuperspace Wheeler-DeWitt states that are localised on the Schwarzschild-de Sitter spacetime. Using these states, we construct a slice-independent worldtube holographic framework in the static patch. We then construct a dictionary between this worldtube proposal and both the $T^2$ and $T^2 + \\Lambda_2$ frameworks for cut-off holography. In doing so, we provide a bulk realisation of $T^2+ \\Lambda_2$ for dS$_4$ black holes. We identify the average Hamiltonian of our worldtube proposal as the seed energy of the $T^2 (+ \\Lambda_2)$ theories. To recover the $T^2 (+ \\Lambda_2)$ energy spectrum as the average Hamiltonian of a worldtube theory, one must make the bulk framework slice-dependent, and we discuss the consequences of this trade-off.", "url": "https://arxiv.org/abs/2610.37776", "type": "理论", "summary": "关于假定的对偶德西特时空，我们可以从整体中了解到什么？相反，候选对偶理论可以告诉我们关于整体的什么信息？在这项工作中，我们构建了位于史瓦西-德西特时空中的中超空间惠勒-德威特态。利用这些状态，我们在静态补丁中构建了一个独立于切片的 worldtube 全息框架。然后，我们在这个 worldtube 提案与 $T^2$ 和 $T^2 + \\Lambda_2$ 截止全息框架之间构建一个字典。在此过程中，我们为 dS$_4$ 黑洞提供了 $T^2+ \\Lambda_2$ 的批量实现。我们将 worldtube 提议的平均哈密顿量确定为 $T^2 (+ \\Lambda_2)$ 理论的种子能量。 To recover the $T^2 (+ \\Lambda_2)$ energy spectrum as the average Hamiltonian of a worldtube theory, one must make the bulk framework slice-dependent, and we discuss the consequences of this trade-off.", "authors": [{"name": "Matthew J. Blacker"}], "featured_authors": [{"name": "Matthew J. Blacker"}], "author_count": 1}, {"id": "2610.37856", "category": "hep-th", "title": "Differential Equations for Dressed \"in-in\" Correlators", "abstract": "We extend the formalism of differential equations and Integration-by-Parts identities, to cosmological in-in correlators of conformally coupled scalar fields, that can be formulated as dressed flat space amplitudes. These differential equations turn out to be quite powerful for extracting information about the class of functions which the corresponding amplitudes integrate to. Furthermore, they can be formulated algorithmically. Here we illustrate this for the cosmological bubble- triangle and exchange diagram.", "url": "https://arxiv.org/abs/2610.37856", "type": "理论", "summary": "我们将微分方程和分部积分恒等式的形式扩展到共形耦合标量场的宇宙学内内相关器，可以将其表示为修饰的平坦空间振幅。事实证明，这些微分方程对于提取有关相应振幅积分的函数类别的信息非常强大。此外，它们可以通过算法来制定。在这里，我们用宇宙学气泡三角形和交换图来说明这一点。", "authors": [{"name": "Ivo Sachs"}], "featured_authors": [{"name": "Ivo Sachs"}], "author_count": 1}, {"id": "2610.37908", "category": "hep-th", "title": "Near-horizon BF bounds for the $t^+$ KK tower on extremal AdS$_5$ black holes", "abstract": "We study the charged Breitenlohner--Freedman (BF) bound for all horizon harmonics of the type IIB $t^+$ Kaluza--Klein tower on extremal charged AdS$_5$ black holes with equal rotations. The scalar equation follows from maximal five-dimensional gauged supergravity at level zero and the linearized exceptional-field-theory equations at higher levels. For aligned charge and rotation, a quadratic form in charge and spin changes signature on the curve of supersymmetric (BPS) black holes, where every mode satisfies the bound. Above the curve, where $\\Omega_H>1$, every black hole has a violating mode, although no finite truncation in level or spin detects violation at every such black hole. Below the curve, where $\\Phi_H>1$, the BF-passing set is confined to a thin strip and controlled by charge and spin discreteness. At large radius and fixed rotation, a level-four mode with spin proportional to the radius violates the bound even where all U(2) singlets satisfy it. These results concern the near-horizon BF bound of one tower in two-derivative supergravity; full radial stability remains open.", "url": "https://arxiv.org/abs/2610.37908", "type": "理论", "summary": "我们研究了具有相等旋转的极值带电 AdS$_5$ 黑洞上 IIB $t^+$ Kaluza--Klein 塔的所有视界谐波的带电 Breitenlohner--Freedman (BF) 边界。标量方程源自零级的最大五维测量超重力和更高级的线性化异常场论方程。对于对齐的电荷和旋转，电荷和自旋的二次形式改变了超对称（BPS）黑洞曲线上的特征，其中每个模式都满足界限。在曲线上方，$\\Omega_H>1$，每个黑洞都有一个破坏模式，尽管水平或自旋的有限截断无法检测到每个此类黑洞的破坏。在曲线下方，$\\Phi_H>1$，BF 传递集被限制在一条薄带内，并由电荷和自旋离散性控制。在大半径和固定旋转时，即使所有 U(2) 单线态都满足边界，自旋与半径成比例的四级模式也会违反边界。这些结果涉及二导数超重力中一座塔的近地平线 BF 界；完全径向稳定性保持开放。", "authors": [{"name": "Xiao-Long Liu"}, {"name": "Zheng Miao"}, {"name": "Yuezhang Tang"}], "featured_authors": [{"name": "Xiao-Long Liu"}, {"name": "Zheng Miao"}, {"name": "Yuezhang Tang"}], "author_count": 3}, {"id": "2610.38052", "category": "hep-th", "title": "Quotient Quiver Subtraction -- Product Groups", "abstract": "Quotient quiver subtraction translates the gauging of Coulomb branch global symmetries into a combinatoric operation on 3d $\\mathcal{N}=4$ gauge theories. This work uses brane systems to introduce a systematic method to gauge $\\textrm{U}(n)\\times\\textrm{U}(n')$ and $\\textrm{SU}(n)\\times\\textrm{SU}(n')$ emergent Coulomb branch global symmetries. Similar to other recently-introduced techniques, the gauging operation is a two-step process; in this case, it involves the symplectisation of unitary gauge factors into symplectic groups. A host of explicit examples are used to verify the procedure, and connections are made to Class $\\mathcal{S}$ theories and three-dimensional theories realising maximal implosion spaces.", "url": "https://arxiv.org/abs/2610.38052", "type": "理论", "summary": "商颤减法将库仑支全局对称性的计量转化为 3d $\\mathcal{N}=4$ 规范理论的组合运算。这项工作使用膜系统引入了一种系统方法来测量 $\\textrm{U}(n)\\times\\textrm{U}(n')$ 和 $\\textrm{SU}(n)\\times\\textrm{SU}(n')$ 涌现库仑支全局对称性。与最近推出的其他技术类似，测量操作分为两步：在这种情况下，它涉及将酉规范因子辛化为辛群。使用大量明确的例子来验证该过程，并与 $\\mathcal{S}$ 类理论和实现最大内爆空间的三维理论建立联系。", "authors": [{"name": "Sam Bennett"}, {"name": "Amihay Hanany"}, {"name": "Guhesh Kumaran"}], "featured_authors": [{"name": "Sam Bennett"}, {"name": "Amihay Hanany"}, {"name": "Guhesh Kumaran"}], "author_count": 3}, {"id": "2610.38208", "category": "hep-th", "title": "Covering Surfaces, Conical-Defect Continuation, and Multi-Entropy at Arbitrary Genus", "abstract": "We derive normalized geometric factors for permutation-twist correlators at arbitrary genus. For three uniformly ramified branch values, hypergeometric uniformization shows that the real part of the continued conical-defect exponent equals the covering-space anomaly factor. Its imaginary part is an Euler-characteristic Weyl phase. We extend the normalization to additional branch values, derive higher replica-index corrections to the geometric multi-entropy, and state the extra condition required for a holographic limit. A reducible conformal/topological example demonstrates why large central charge alone does not fix the complete entanglement result.", "url": "https://arxiv.org/abs/2610.38208", "type": "理论", "summary": "我们推导出任意属处的排列扭转相关器的归一化几何因子。对于三个均匀分支值，超几何均匀化表明连续圆锥缺陷指数的实部等于覆盖空间异常因子。其虚部是具有欧拉特征的Weyl相。我们将归一化扩展到其他分支值，导出对几何多熵的更高复制索引校正，并说明全息极限所需的额外条件。一个可简化的共形/拓扑示例说明了为什么仅靠大的中心电荷并不能解决完整的纠缠结果。", "authors": [{"name": "Chen-Te Ma"}], "featured_authors": [{"name": "Chen-Te Ma"}], "author_count": 1}, {"id": "2610.38226", "category": "hep-th", "title": "Entropically favored scalar hair on AdS black branes", "abstract": "We construct neutral AdS$_5$ black branes with source-free scalar hair that is entropically favored over the symmetric phase. A quadratic scalar--Gauss--Bonnet coupling destabilizes the thermal state while leaving the ultraviolet operator dimension fixed at $\\Delta=3$. The fully backreacted solutions require only a quadratic scalar potential. We describe how a neural-network search led to this simple model.", "url": "https://arxiv.org/abs/2610.38226", "type": "理论", "summary": "我们构建了具有无源标量毛发的中性 AdS$_5$ 黑色膜，其熵优于对称相。二次标量--高斯--邦尼特耦合会破坏热状态的稳定性，同时使紫外算子尺寸固定为 $\\Delta=3$。完全反反应的解决方案仅需要二次标量势。我们描述了神经网络搜索如何产生这个简单的模型。", "authors": [{"name": "Alex Buchel"}], "featured_authors": [{"name": "Alex Buchel"}], "author_count": 1}, {"id": "2610.38254", "category": "hep-th", "title": "Circuit complexity of coupled four-mode squeezed states in two-field inflation", "abstract": "We study the circuit complexity of coupled curvature and entropy perturbations in two-field inflation. We start from the quadratic action and derive the full Hamiltonian. The Hamiltonian includes all diagonal and off-diagonal quadratic terms. We then obtain three coupled equations for the pair amplitudes of the four-mode squeezed state. From these amplitudes, we calculate the two principal squeezing strengths. We use them to determine the Nielsen circuit complexity. For an equal-weight Gaussian circuit, the complexity takes the form $\\mathcal{C}_{2,k}=\\sqrt{2(r_{1k}^{2}+r_{2k}^{2})}$. It depends on the squeezing strengths but not explicitly on the squeezing angles. Our numerical results show that the complexity grows after horizon crossing in both coupled and uncoupled models. Interfield coupling changes the pair amplitudes and the four-mode squeezed state. However, its effect on the circuit complexity is small for the parameters considered. This result shows that different four-mode pair-amplitude matrices can yield similar values of the chosen equal-weight circuit complexity. The present calculation provides a reference for studying Gaussian circuit complexity in more general two-field inflationary models.", "url": "https://arxiv.org/abs/2610.38254", "type": "理论", "summary": "我们研究了两场膨胀中曲率和熵扰动耦合的电路复杂性。我们从二次作用开始并导出完整的哈密顿量。哈密​​顿量包括所有对角线和非对角线二次项。然后，我们获得了四模压缩态对振幅的三个耦合方程。根据这些幅度，我们计算出两个主要的挤压强度。我们用它们来确定尼尔森电路的复杂性。对于等权高斯电路，复杂度的形式为 $\\mathcal{C}_{2,k}=\\sqrt{2(r_{1k}^{2}+r_{2k}^{2})}$。它取决于挤压强度，但不明确取决于挤压角度。我们的数值结果表明，在耦合和非耦合模型中，跨界后复杂性都会增加。场间耦合改变了对振幅和四模压缩状态。然而，对于所考虑的参数来说，它对电路复杂性的影响很小。该结果表明，不同的四模对幅度矩阵可以产生所选等权电路复杂度的相似值。\n\n本计算为研究更一般的两场膨胀模型中的高斯电路复杂性提供了参考。", "authors": [{"name": "Tao Li"}, {"name": "Hai-Bing Fu"}, {"name": "Lei-Hua Liu"}], "featured_authors": [{"name": "Tao Li"}, {"name": "Hai-Bing Fu"}, {"name": "Lei-Hua Liu"}], "author_count": 3}, {"id": "2610.38364", "category": "hep-th", "title": "Tachyon and massless sectors of the bosonic string effective action", "abstract": "Recently, it has been observed that in certain schemes of the bosonic string effective action, the non-derivative tachyon appears only in the tachyon potential, while all other couplings involve covariant derivatives of the tachyon and massless fields. Within these schemes, a minimal basis can be found whose coupling constants are constrained by T-duality upon circle reduction. Using this constraint, one obtains sets of couplings at each order of \\(\\alpha'\\) that are invariant under Buscher rules supplemented by higher-derivative corrections for all base-space fields except the tachyon. In this paper, we observe that consistency of these T-dual sets with S-matrix elements requires an appropriate field redefinition, such that each set becomes invariant under Buscher rules supplemented by higher-derivative corrections for all base-space fields except the metric, dilaton, and tachyon. This separates the couplings into a massless sector and a tachyon sector. We determine the six-derivative couplings in the massless sector, with all coupling constants fixed, and find two T-dual couplings in the tachyon sector with arbitrary coupling constants. We show that the leading-order action and the massless-sector couplings exactly reproduce the expansion of the sphere-level S-matrix element of two tachyons and two massless vertex operators at six-momentum order, and that the coupling constant of the four-tachyon coupling in the tachyon sector is fixed by the expansion of the four-tachyon S-matrix element at six-momentum order.", "url": "https://arxiv.org/abs/2610.38364", "type": "理论", "summary": "最近，人们观察到，在玻色弦有效作用的某些方案中，非导数快子仅出现在快子势中，而所有其他耦合都涉及快子和无质量场的协变导数。在这些方案中，可以找到一个最小基，其耦合常数在圆缩减时受到 T 对偶性的约束。使用这一约束，我们可以获得每阶 α 的耦合集，这些耦合集在 Buscher 规则下保持不变，并辅以除快子之外的所有基空间场的高导数校正。在本文中，我们观察到这些 T 对偶集合与 S 矩阵元素的一致性需要适当的场重新定义，以便每个集合在 Buscher 规则下变得不变，并辅以除度量、膨胀子和快子之外的所有基空间场的高导数校正。这将耦合器分为无质量部分和快子部分。我们确定了无质量扇区中所有耦合常数固定的六阶导数耦合，并在快子扇区中找到了两个具有任意耦合常数的 T-对偶耦合。\n\n我们证明了主阶作用和无质量扇区耦合精确地再现了两个快子和两个无质量顶点算子的球级 S 矩阵元素在六动量阶上的展开，并且快子扇区中四快子耦合的耦合常数由四快子 S 矩阵元素在六动量阶上的展开固定。", "authors": [{"name": "Mohammad R. Garousi"}], "featured_authors": [{"name": "Mohammad R. Garousi"}], "author_count": 1}, {"id": "2610.38473", "category": "hep-th", "title": "The Topological String on the Quintic to Genus 83 and the Rank-Two D4-D2-D0 Indices", "abstract": "We compute quintic Gopakumar-Vafa invariants for genera 2-83 and degrees up to 44 by integrating the holomorphic anomaly equations. Under rank-one modularity for the required Gieseker invariants and rank-two charge conjugation, a coupled system of boundary and surplus wall-crossing equations fixes the holomorphic ambiguities and 22 of the 36 polar rank-two D4-D2-D0 coefficients, without assuming any rank-two index. A computer-assisted extension of wall crossing supplies additional equations and the boundary datum needed to close the recursion through genus 83. With known low-genus input, the GV data are complete through degree 32 and yield PT and DT tables. Selected higher-genus wall-crossing invariants reach genus 216; 33 entries require additional hypotheses. Retrospectively selected extrapolations give conditional candidates at genera 84 and 85 and, with rank-two mock modularity, for the remaining polar coefficients.", "url": "https://arxiv.org/abs/2610.38473", "type": "理论", "summary": "我们通过积分全纯异常方程计算属 2-83 和度数高达 44 的五次 Gopakumar-Vafa 不变量。在所需 Gieseker 不变量和二级电荷共轭的一级模块化下，边界和剩余穿壁方程的耦合系统修复了全纯模糊度和 36 个极性二级 D4-D2-D0 系数中的 22 个，而不假设任何二级索引。计算机辅助的墙交叉扩展提供了通过 83 项完成递归所需的附加方程和边界数据。通过已知的低属输入，GV 数据在 32 度上是完整的，并产生 PT 和 DT 表。选定的更高属的穿墙不变量达到属 216； 33 个条目需要额外的假设。回顾性选择的外推法给出了属 84 和 85 的条件候选，并且对于剩余的极性系数，具有二级模拟模块性。", "authors": [{"name": "Michael Hecht"}], "featured_authors": [{"name": "Michael Hecht"}], "author_count": 1}, {"id": "2610.38584", "category": "hep-th", "title": "Resurgence and Modularity in the First Painlevé Equation", "abstract": "For the first Painlevé equation, we relate three nonlinear Stokes maps associated with a full turn around infinity to modular transformations of the two-parameter tau function through the identity $\\boldsymbol S_\\pi\\circ\\boldsymbol S_0\\circ \\boldsymbol S_{-\\pi}=\\mathsf S\\circ\\mathsf T$. Here the subscripts label Borel directions, while $\\mathsf S$ and $\\mathsf T$ denote the modular generators. Working under the analytic assumptions of the topological recursion and exact WKB constructions, we compare Stokes multipliers of the associated isomonodromy system while tracking the homology basis of its elliptic spectral curve under rotations of the independent variable. For the sectors considered, we identify the known parameter transformation induced by an $8\\pi/5$ rotation with the modular $T$-action and derive a new explicit parameter relation realizing the $S$-action for a $2\\pi/5$ rotation. We also determine the multiplicative factors in the corresponding tau-function relations, including their normalization constants. Together, these results give an explicit realization of single-valuedness after one full turn around infinity for both the Painlevé transcendent and its tau function, with the tau-function prefactors cancelling by Abel's five-term identity for the Rogers dilogarithm.", "url": "https://arxiv.org/abs/2610.38584", "type": "理论", "summary": "对于第一个 Painlevé 方程，我们通过恒等式 $\\boldsymbol S_\\pi\\circ\\boldsymbol S_0\\circ \\boldsymbol S_{-\\pi}=\\mathsf S\\circ\\mathsf T$ 将与无穷大整周相关的三个非线性 Stokes 映射与两参数 tau 函数的模变换相关联。这里下标标记 Borel 方向，而 $\\mathsf S$ 和 $\\mathsf T$ 表示模生成器。在拓扑递归和精确 WKB 构造的分析假设下，我们比较相关等单系统的斯托克斯乘子，同时跟踪自变量旋转下其椭圆谱曲线的同源基础。对于所考虑的扇区，我们通过模块化 $T$ 动作识别由 $8\\pi/5$ 旋转引起的已知参数变换，并导出一个新的显式参数关系，实现 $2\\pi/5$ 旋转的 $S$ 动作。我们还确定了相应 tau 函数关系中的乘法因子，包括它们的归一化常数。\n\n总之，这些结果给出了 Painlevé 超越函数及其 tau 函数在无穷大一圈后的单值性的明确实现，其中 tau 函数前因子被罗杰斯二对数的阿贝尔五项恒等式抵消。", "authors": [{"name": "Kohei Iwaki"}, {"name": "Noam Tamarin"}], "featured_authors": [{"name": "Kohei Iwaki"}, {"name": "Noam Tamarin"}], "author_count": 2}, {"id": "2610.38606", "category": "hep-th", "title": "The Non-Relativistic Limit of Five-Dimensional Boson Stars and Scale Invariance Violation", "abstract": "We investigate the non-relativistic limit of spherically symmetric boson stars in (4+1)-dimensional general relativity (GR). In this limit, the resulting Newtonian theory exhibits an exact scale invariance, leading to a critical boson star configuration with a fixed global U(1) charge and vanishing binding energy. We identify the origin of these properties in the restored scale symmetry and analyze how relativistic and gravitational corrections break this symmetry. By comparing the full (4+1)-dimensional Einstein-Klein-Gordon system with the Wick-Cutkosky model, we quantify the effects of these corrections on the energy-charge relation and the kinematic stability of the configurations. Our results demonstrate how weak violation of scale invariance lifts the degeneracy of the non-relativistic solutions and determines the behavior of boson stars away from the critical limit.", "url": "https://arxiv.org/abs/2610.38606", "type": "理论", "summary": "我们研究了 (4+1) 维广义相对论 (GR) 中球对称玻色子星的非相对论极限。在这个极限下，由此产生的牛顿理论表现出精确的尺度不变性，导致临界玻色子星构型具有固定的全局 U(1) 电荷和消失的结合能。我们在恢复的尺度对称性中确定了这些属性的起源，并分析了相对论和引力校正如何打破这种对称性。通过将全 (4+1) 维 Einstein-Klein-Gordon 系统与 Wick-Cutkosky 模型进行比较，我们量化了这些修正对能量-电荷关系和构型运动学稳定性的影响。我们的结果表明，对尺度不变性的弱违反如何提升非相对论解的简并性，并决定玻色子星的行为远离临界极限。", "authors": [{"name": "Eduard Kim"}, {"name": "Oleg Kondrashov"}, {"name": "Emin Nugaev"}, {"name": "Yakov Shnir"}], "featured_authors": [{"name": "Eduard Kim"}, {"name": "Oleg Kondrashov"}, {"name": "Emin Nugaev"}, {"name": "Yakov Shnir"}], "author_count": 4}, {"id": "2610.38614", "category": "hep-th", "title": "Conformal Spectrum of (Super) Chiral Ising and XY Models", "abstract": "We determine the spectrum of scaling dimensions of composite operators in the critical Gross-Neveu-Yukawa and Nambu-Jona-Lasinio-Yukawa models through a next-to-leading order semiclassical computation. Their infrared fixed points belong to the chiral Ising and chiral XY universality classes, respectively. At next-to-leading order, we resolve the Lorentz structure of the operator spectrum. For the parameter values at which supersymmetry is expected to emerge in the infrared, we obtain a closed-form expression encoding the full spectrum within the semiclassical methodology. The resulting organization of operators into superconformal multiplets provides further evidence for emergent superconformal dynamics.", "url": "https://arxiv.org/abs/2610.38614", "type": "理论", "summary": "我们通过次领先阶半经典计算确定了关键 Gross-Neveu-Yukawa 和 Nambu-Jona-Lasinio-Yukawa 模型中复合算子的标度维数谱。它们的红外固定点分别属于手性 Ising 和手性 XY 通用类。在次高阶上，我们解析了算子谱的洛伦兹结构。对于预计在红外中出现超对称性的参数值，我们获得了半经典方法中编码全光谱的封闭形式表达式。由此产生的将算子组织成超共形多重态的结果为超共形动力学的出现提供了进一步的证据。", "authors": [{"name": "Oleg Antipin"}, {"name": "Jahmall Bersini"}, {"name": "Jacob Hafjall"}, {"name": "Giulia Muco"}, {"name": "Francesco Sannino"}], "featured_authors": [{"name": "Oleg Antipin"}, {"name": "Jahmall Bersini"}, {"name": "Jacob Hafjall"}, {"name": "Giulia Muco"}, {"name": "Francesco Sannino"}], "author_count": 5}, {"id": "2610.38663", "category": "hep-th", "title": "Bootstrapping Wilson lines in Critical Bosonic QED$_3$ Part 1: Large-$N$ endpoint correlators and CFT data", "abstract": "We study the conformal Wilson line with general charge $q$ in critical bosonic QED$_3$ with $N$ complex scalar flavors by combining diagrammatic four-point calculations with endpoint crossing. We formulate the endpoint crossing equations with the full $\\mathrm{SU}(N)$ flavor structure, keeping positivity manifest. For arbitrary positive integer charge $q$ held fixed at large $N$, we obtain closed-form expressions for four-endpoint correlators and mixed correlators involving two bulk Hubbard--Stratonovich fields through first subleading order in $1/N$. These results determine the endpoint dimension, the defect $g$-function, and the dimensions and endpoint OPE coefficients of the lowest non-singlet Wilson-line primaries. Moreover, combining the diagrammatic correlator with endpoint crossing, somewhat surprisingly, we find agreement between the bulk and Wilson-line spectra in every non-singlet flavor channel through order $1/N$. At degenerate levels, this agreement concerns the OPE-weighted averages of anomalous dimensions probed by the endpoint correlator. For unit charge, we independently reproduce these averages from the known bulk higher-spin spectrum.", "url": "https://arxiv.org/abs/2610.38663", "type": "理论", "summary": "我们通过将图解四点计算与端点交叉相结合，研究具有 $N$ 复杂标量风味的临界玻色子 QED$_3$ 中一般电荷 $q$ 的共形威尔逊线。我们用完整的 $\\mathrm{SU}(N)$ 风味结构制定端点交叉方程，保持积极性。对于固定在大 $N$ 的任意正整数电荷 $q$，我们通过 $1/N$ 中的第一个子前导顺序获得涉及两个批量 Hubbard-Stratonovich 字段的四端点相关器和混合相关器的闭合形式表达式。这些结果确定了最低非单线 Wilson 线原色的端点尺寸、缺陷 $g$ 函数以及尺寸和端点 OPE 系数。此外，将图解相关器与端点交叉相结合，有些令人惊讶的是，我们发现每个非单峰风味通道中的本体谱和威尔逊线谱之间的一致性通过 $1/N$ 阶。在简并水平上，该协议涉及端点相关器探测到的异常维度的 OPE 加权平均值。对于单位电荷，我们从已知的高自旋能谱中独立地再现这些平均值。", "authors": [{"name": "Jun Maeda"}, {"name": "Toshiki Onagi"}, {"name": "Soichiro Shimamori"}], "featured_authors": [{"name": "Jun Maeda"}, {"name": "Toshiki Onagi"}, {"name": "Soichiro Shimamori"}], "author_count": 3}, {"id": "2610.38680", "category": "hep-th", "title": "Topological interfaces between universes and generalized families of 2d QFTs", "abstract": "Two-dimensional quantum field theories with topological point operators decompose into universes. Just as fusion categories have played an important role in understanding non-invertible symmetries, multi-fusion categories play an analogous role for the symmetries of such decomposing theories. We describe a finite symmetry as a multi-fusion category together with its action functor, which keeps track of trivially acting symmetries and of the topological interfaces between universes. Relative to a chosen symmetry, we classify pairs of universes by the topological interfaces it contains, which reflect the structure of the multi-fusion category: universes in different indecomposable summands are joined by no interface (Type~III), while within a summand they are related by invertible (Type~I) or only non-invertible (Type~II) interfaces. For orbifolds with a trivially acting abelian normal subgroup, we derive the full inherited symmetry, which characterizes the operators between universes found case by case by Robbins, Sharpe and Vandermeulen and yields pairs of Types~I and~II but never of Type~III. We construct Type~III pairs instead from extensions of $2$-group type and from renormalization group flows out of a common ultraviolet theory. Finally, we propose a correspondence with the generalized families of quantum field theories of Brennan and Intriligator, in which equivariant families correspond to Type~I pairs and categorical ones to Type~II pairs whose gauging preserves the symmetry, family anomalies appear as universes carrying different symmetry-protected topological phases, and Type~III pairs can realize families over a discrete parameter. An appendix by Xingyang Yu works out the higher-charge Schwinger model as a Lagrangian example.", "url": "https://arxiv.org/abs/2610.38680", "type": "理论", "summary": "具有拓扑点算子的二维量子场论分解为宇宙。正如融合范畴在理解不可逆对称性方面发挥了重要作用一样，多重融合范畴对于此类分解理论的对称性也发挥着类似的作用。我们将有限对称性描述为多重融合类别及其作用函子，该函子跟踪平凡的作用对称性和宇宙之间的拓扑界面。相对于选定的对称性，我们通过宇宙所包含的拓扑界面对宇宙对进行分类，这反映了多重融合类别的结构：不同不可分解被加数中的宇宙没有界面连接（Type~III），而在一个被加数内，它们通过可逆（Type~I）或仅不可逆（Type~II）界面相关。对于具有平凡作用的阿贝尔正规子群的轨道折叠，我们推导出完全继承的对称性，它描述了罗宾斯、夏普和范德莫伦逐个发现的宇宙之间的算子，并产生类型〜I和〜II对，但从未产生类型〜III。\n\n我们构造 Type~III 对，而不是从 $2$ 群类型的扩展和来自常见紫外线理论的重正化群流。最后，我们提出了与 Brennan 和 Intriligator 的量子场论广义族的对应关系，其中等变族对应于 Type~I 对，分类族对应于测量保持对称性的 Type~II 对，族异常表现为携带不同对称保护拓扑相的宇宙，而 Type~III 对可以在离散参数上实现族。 Xingyang Yu 的附录提出了更高电荷的 Schwinger 模型作为拉格朗日的例子。", "authors": [{"name": "Pinak Banerjee"}, {"name": "Yuhan Gai"}, {"name": "Alonso Perez-Lona"}, {"name": "Daniel Robbins"}, {"name": "Subham Roy"}, {"name": "Eric Sharpe"}, {"name": "with an appendix by Xingyang Yu"}], "featured_authors": [{"name": "Pinak Banerjee"}, {"name": "Yuhan Gai"}, {"name": "Alonso Perez-Lona"}, {"name": "Subham Roy"}, {"name": "Eric Sharpe"}, {"name": "with an appendix by Xingyang Yu"}], "author_count": 7}, {"id": "2610.38702", "category": "hep-th", "title": "The Effective Field Theory Origin of the Fuzzy Sphere Method", "abstract": "Fuzzy sphere Hamiltonians for (2+1)D conformal field theories are usually written directly on the lowest Landau level. We introduce a framework organizing them as descendants of local ``mother theories'' on $S^2\\times\\mathbb R$. We start with the example of Ising mother theory built from two charged Dirac fermions coupled to a real mediator $\\phi$. Integrating out $\\phi$ and the higher Landau levels produces the fuzzy Hamiltonian, while integrating out the fermions gives a conventional local $\\phi$ effective field theory flowing to the Ising point. Mild modifications of the same theory reach the Gaussian point (tricritical route) and the Lee-Yang continuation. Exploring the space of mother theories, we next promote $\\phi$ to a complex field $\\Phi$ and construct a new example, whose descendant is an easy-plane ferromagnet on the fuzzy sphere. Its spontaneous symmetry breaking phase gives a pseudo-Goldstone relativistic scalar, similar to the model introduced by Y.-C. He, while its critical point is non-relativistic, providing the first example of $z=2$ scaling on the fuzzy sphere. Remarkably, it admits exact one-magnon solutions, and the $z=2$ critical point can be found analytically. We then outline a rich landscape of further applications of our approach.", "url": "https://arxiv.org/abs/2610.38702", "type": "理论", "summary": "(2+1)D 共形场论的模糊球哈密顿量通常直接写在最低的朗道能级上。我们引入了一个框架，将它们组织为 $S^2\\times\\mathbb R$ 上本地“母理论”的后代。我们从伊辛母理论的例子开始，该理论由两个带电狄拉克费米子和一个真正的中介 $\\phi$ 组成。对 $\\phi$ 和更高的朗道能级进行积分会产生模糊哈密顿量，而对费米子进行积分则给出流向伊辛点的传统局部 $\\phi$ 有效场论。同一理论的轻微修改达到高斯点（三临界路线）和李-杨延续。探索母理论的空间，我们接下来将 $\\phi$ 提升为复数域 $\\Phi$ 并构造一个新的例子，其后代是模糊球上的易平面铁磁体。其自发对称破缺相给出了伪戈德斯通相对论标量，类似于 Y.-C 引入的模型。他虽然其临界点是非相对论的，但提供了模糊球体上 $z=2$ 缩放的第一个例子。\n\n值得注意的是，它承认精确的一磁振子解，并且可以通过分析找到 $z=2$ 临界点。然后，我们概述了我们的方法的进一步应用的丰富前景。", "authors": [{"name": "Mykola Dedushenko"}], "featured_authors": [{"name": "Mykola Dedushenko"}], "author_count": 1}, {"id": "2610.38713", "category": "hep-th", "title": "Unifying energy-entropy bounds in semiclassical gravity", "abstract": "We revisit bounds on energy and entropy in semiclassical gravity, aiming to strengthen and unify established bounds, in particular the quantum focussing conjecture (QFC) and the smeared null energy condition (SNEC). Both the QFC and SNEC have important applications and are the strongest in their respective hierarchies; however, neither implies the other, nor reduces to the null energy condition (NEC) in the classical limit. To that end, we define a new class of bounds dubbed gravitational energy-entropy conditions (GEECs) that imply both the QFC and SNEC, and reduce to the NEC classically. We construct an explicit family of GEECs by imposing the defining criteria on a broad set of stress tensor bounds, and constrain its remaining parameter space through test cases, in an effective field theory-inspired approach. Our GEECs are powerful candidate bounds on energy and entropy in semiclassical gravity.", "url": "https://arxiv.org/abs/2610.38713", "type": "理论", "summary": "我们重新审视半经典引力中的能量和熵的界限，旨在加强和统一已建立的界限，特别是量子聚焦猜想（QFC）和弥散零能量条件（SNEC）。 QFC和SNEC都有重要的应用，并且在各自的层级中都是最强的；然而，既不暗示对方，也不降低到经典极限中的零能量条件（NEC）。为此，我们定义了一类新的边界，称为引力能熵条件（GEEC），它意味着 QFC 和 SNEC，并经典地简化为 NEC。我们通过对一组广泛的应力张量边界施加定义标准来构建一个明确的 GEEC 系列，并通过测试用例以有效的场论启发方法约束其剩余参数空间。我们的 GEEC 是半经典引力中能量和熵的强大候选界限。", "authors": [{"name": "Jackson R. Fliss"}, {"name": "Andrew Rolph"}], "featured_authors": [{"name": "Jackson R. Fliss"}, {"name": "Andrew Rolph"}], "author_count": 2}, {"id": "2610.38716", "category": "hep-th", "title": "Collective Bootstrap for Matrix Quantum Mechanics", "abstract": "We develop a collective bootstrap framework for large $N$ matrix quantum mechanics formulated directly in the loop space of single trace coordinate moments. Loop joining and splitting operations organize the kinetic constraints systematically and avoid treating momentum containing moments as independent variables. Employing the virial theorem, a Schur complement, and a relaxation of quadratic products of loops, we recast the nonlinear constrained optimization of the collective energy into a semidefinite program, which yields a lower bound on the planar ground state energy at every truncation. A sequential semidefinite optimization heuristic then searches for configurations satisfying planar factorization and estimates the ground state energy and loop expectation values. Applications to one-, two-, and three-matrix models exhibit close agreement with analytic solutions and master field optimization. By working exclusively with coordinate moments, the framework permits truncations at higher word length and offers a promising approach to models with more matrices, including the bosonic sectors of the BFSS and BMN models.", "url": "https://arxiv.org/abs/2610.38716", "type": "理论", "summary": "我们为直接在单迹坐标矩的循环空间中表述的大型 $N$ 矩阵量子力学开发了一个集体引导框架。循环连接和分割操作系统地组织动力学约束，并避免将包含力矩的动量视为自变量。利用维里定理、舒尔补集和循环二次积的松弛，我们将集体能量的非线性约束优化重新改写为半定程序，该程序在每次截断时产生平面基态能量的下界。然后，顺序半定优化启发式搜索满足平面分解的配置并估计基态能量和环路期望值。一、二和三矩阵模型的应用与解析解和主场优化表现出密切的一致性。通过专门处理坐标矩，该框架允许更高字长的截断，并为具有更多矩阵的模型（包括 BFSS 和 BMN 模型的玻色子扇区）提供了一种有前景的方法。", "authors": [{"name": "Xianlong Liu"}], "featured_authors": [{"name": "Xianlong Liu"}], "author_count": 1}, {"id": "2610.38725", "category": "hep-th", "title": "Elliptic master integrals and the one-loop cosmological wavefunction", "abstract": "Loop corrections to the cosmological wavefunction involve similar integrals to those required for scattering amplitudes. For the one-loop triangle of a conformally coupled scalar, the master integrals are elliptic, and so the triangle wavefunction coefficient was expected to be elliptic as well. Using a bootstrap approach, we compute this triangle coefficient exactly and show that it is not: the elliptic periods cancel, and the flat-space wavefunction coefficient is a combination of dilogarithms. The cancellation occurs because the residue of the loop integrand on the elliptic sector is a flat-space amplitude, rational in the loop momentum. The one-loop box, by contrast, is not polylogarithmic, even with a single external leg at each site. Its threshold discontinuity involves elliptic integrals, which we also give in closed form. For regular-tetrahedron momenta the periods of a K3 surface enter its loop integrand.", "url": "https://arxiv.org/abs/2610.38725", "type": "理论", "summary": "宇宙波函数的环路校正涉及与散射幅度所需的积分类似的积分。对于共形耦合标量的单环三角形，主积分是椭圆形的，因此三角波函数系数预计也是椭圆形的。使用自举方法，我们精确地计算了这个三角形系数，并证明它不是：椭圆周期抵消，并且平坦空间波函数系数是双对数的组合。之所以会发生抵消，是因为椭圆扇区上的循环被积函数的余数是平坦空间振幅，在循环动量中是有理数。相比之下，单环盒不是多对数的，即使每个位置都有一条外腿。它的阈值不连续性涉及椭圆积分，我们也以封闭形式给出。对于正四面体动量，K3 表面的周期进入其循环被积函数。", "authors": [{"name": "Amara McCune"}, {"name": "Matthew D. Schwartz"}], "featured_authors": [{"name": "Amara McCune"}, {"name": "Matthew D. Schwartz"}], "author_count": 2}, {"id": "2610.38769", "category": "hep-th", "title": "From pq-webs to magnetic quivers and back I: dictionary and deformations", "abstract": "This is the first of two companion papers in which we study five-dimensional $\\mathcal{N}=1$ theories engineered by $(p,q)$ five-brane webs and their associated three-dimensional $\\mathcal{N}=4$ magnetic quivers. We focus on the $N+\\mathrm{SU}(N)_0^{k-1}+N$ box quiver theories. We propose an exact parameter dictionary relating the five-dimensional flavour masses and instanton couplings to the Fayet-Iliopoulos parameters of the corresponding strong-coupling magnetic quiver. We test this dictionary through a broad class of deformations, including mass deformations, weak-coupling limits, and vacuum expectation values. On the five-dimensional side, we implement these flows directly at the level of the superconformal index. The dictionary fixes the corresponding FI deformations and monopole VEVs. We analyse them in the magnetic-quiver squashed-sphere partition function using a new method that tracks Higgsing, decoupled sectors, and infrared theories. Our results promote magnetic quivers to tools for the quantitative study of how the five-dimensional superconformal index responds to deformations. Once the parameter dictionary is known, exact three-dimensional observables can be used to reconstruct the corresponding five-dimensional physics and to navigate the full deformation network in both directions.", "url": "https://arxiv.org/abs/2610.38769", "type": "理论", "summary": "这是两篇配套论文中的第一篇，其中我们研究了由 $(p,q)$ 五膜网及其相关的三维 $\\mathcal{N}=4$ 磁颤器设计的五维 $\\mathcal{N}=1$ 理论。我们关注 $N+\\mathrm{SU}(N)_0^{k-1}+N$ 盒颤理论。我们提出了一个精确的参数字典，将五维风味质量和瞬子耦合与相应强耦合磁颤器的 Fayet-Iliopoulos 参数相关联。我们通过广泛的变形来测试这个字典，包括质量变形、弱耦合极限和真空期望值。在五维方面，我们直接在超共形索引级别实现这些流程。该字典修复了相应的 FI 变形和单极 VEV。我们使用跟踪希格斯星、解耦扇区和红外理论的新方法在磁箭压缩球分配函数中对它们进行分析。我们的研究结果将磁箭袋推广为定量研究五维超共形指数如何响应变形的工具。\n\n一旦知道参数字典，就可以使用精确的三维可观测量来重建相应的五维物理场，并在两个方向上导航完整的变形网络。", "authors": [{"name": "Sebastiano Garavaglia"}, {"name": "Sara Pasquetti"}, {"name": "Palash Singh"}], "featured_authors": [{"name": "Sebastiano Garavaglia"}, {"name": "Sara Pasquetti"}, {"name": "Palash Singh"}], "author_count": 3}, {"id": "2610.38770", "category": "hep-th", "title": "From pq-webs to magnetic quivers and back II: distributional indices and 5d theories breaking bad", "abstract": "This is the second of two companion papers in which we study five-dimensional $\\mathcal{N}=1$ theories engineered by $(p,q)$ five-brane webs and their associated three-dimensional magnetic quivers. Leveraging the exact parameter dictionary between the $N+\\mathrm{SU}(N)_0^{k-1}+N$ theories and their magnetic quivers at infinite coupling, proposed in the first paper, we investigate nilpotent moment-map VEV deformations and their three-dimensional counterparts. We show that, when the Higgsing is excessive, the five-dimensional superconformal index becomes distributional, mirroring a characteristic feature of bad and broken theories in three dimensions. We also develop a five-brane web interpretation of these results, identifying the Hanany-Witten moves associated with the Higgsing cascade and relating inequivalent frames to distinct tessellations of the generalised toric diagram.", "url": "https://arxiv.org/abs/2610.38770", "type": "理论", "summary": "这是两篇配套论文中的第二篇，其中我们研究了由 $(p,q)$ 五膜网及其相关的三维磁颤器设计的五维 $\\mathcal{N}=1$ 理论。利用第一篇论文中提出的 $N+\\mathrm{SU}(N)_0^{k-1}+N$ 理论及其无限耦合磁颤之间的精确参数字典，我们研究了幂零矩图 VEV 变形及其三维对应物。我们表明，当希格斯星过多时，五维超共形指数变得分布，反映了三个维度中糟糕和破碎理论的特征。我们还开发了这些结果的五膜网解释，识别与 Higgsing 级联相关的 Hanany-Witten 移动，并将不等价框架与广义环面图的不同镶嵌相关联。", "authors": [{"name": "Sebastiano Garavaglia"}, {"name": "Sara Pasquetti"}, {"name": "Palash Singh"}], "featured_authors": [{"name": "Sebastiano Garavaglia"}, {"name": "Sara Pasquetti"}, {"name": "Palash Singh"}], "author_count": 3}, {"id": "2610.38806", "category": "hep-th", "title": "Holography and localization in fractional field theory", "abstract": "Fractional field theory is a promising framework wherein to quantize the gravitational interaction but the presence of nonlocal operators can make its handling difficult. With the purpose of easing this problem, we recast the theory as a local dual in two ways. First, we generalize the Caffarelli--Silvestre extension theorem to self-adjoint fractional field theories with multi-scale kinetic terms and nonlocal interactions, taking the example of a scalar field. The latter is reinterpreted as a nonlocal boundary degree of freedom holographically dual to a local theory of two scalars living in a higher-dimensional bulk. However, inclusion of a local non-linear potential is not straightforward. We therefore propose an alternative picture where the nonlocal theory is not extended to a higher-dimensional space but is localized at the price of introducing a continuum of masses. This \\emph{spectral localization} allows for a natural implementation of the fakeon prescription and the related classicization procedure, already employed in local theories with higher-derivative and complex ghosts. Applications to fractional quantum gravity and its comparison with quadratic quantum gravity are discussed.", "url": "https://arxiv.org/abs/2610.38806", "type": "理论", "summary": "分数场论是一个有前途的框架，可以量化引力相互作用，但非局域算子的存在可能使其处理变得困难。为了缓解这个问题，我们通过两种方式将该理论改写为局部对偶。首先，我们以标量场为例，将 Caffarelli--Silvestre 扩张定理推广到具有多尺度动力学项和非局域相互作用的自伴分数阶场论。后者被重新解释为非局部边界自由度，与存在于高维体积中的两个标量的局部理论全息对偶。然而，包含局部非线性势并不简单。因此，我们提出了另一种图景，其中非局域理论不扩展到更高维度的空间，而是以引入质量连续体为代价进行局域化。这种 \\emph{光谱定位} 允许自然地实现 fakeon 处方和相关的经典化程序，这些程序已经在具有更高导数和复杂鬼魂的局部理论中使用。\n\n讨论了分数量子引力的应用及其与二次量子引力的比较。", "authors": [{"name": "Gianluca Calcagni"}, {"name": "Iván Salvador-García"}], "featured_authors": [{"name": "Gianluca Calcagni"}, {"name": "Iván Salvador-García"}], "author_count": 2}, {"id": "2610.38887", "category": "hep-th", "title": "Gravitational Reconstruction in $AdS_{4}$", "abstract": "We reconstruct linearized gravitational perturbations in $AdS_{4}$ from a conserved, traceless stress tensor on a fixed conformally flat boundary metric, extending our earlier real Lorentzian construction. For admissible data with no spacelike Fourier support in a flat conformal frame, the physical response reduces to an integral over boundary light-cone cuts. Boundary improvements restore Fefferman--Graham (FG) gauge while preserving normalizability and the linearized Weyl tensor. We then reconstruct perturbations with general spacelike boundary momentum, including nonzero frequency and its zero-frequency limit, using explicit position-space generalized functions on real stress data. Boundary kernels are constructed for normalizable perturbations and sufficient conditions are derived for the reconstruction to converge. The results motivate controlled flat-space limits relevant to Bondi--Metzner--Sachs symmetries and celestial holography.", "url": "https://arxiv.org/abs/2610.38887", "type": "理论", "summary": "我们根据固定共形平坦边界度量上的守恒无迹应力张量重建了 $AdS_{4}$ 中的线性重力扰动，扩展了我们早期的真实洛伦兹构造。对于在平面共形框架中没有类空间傅里叶支持的可接受数据，物理响应简化为边界光锥切割上的积分。边界改进恢复了 Fefferman-Graham (FG) 规范，同时保留了归一化性和线性化 Weyl 张量。然后，我们使用真实应力数据上的显式位置空间广义函数，重建具有一般空间边界动量的扰动，包括非零频率及其零频率极限。为可归一化扰动构建边界核，并导出重建收敛的充分条件。这些结果激发了与 Bondi-Metzner-Sachs 对称性和天体全息术相关的受控平坦空间限制。", "authors": [{"name": "David A. Lowe"}, {"name": "Yiru Wang"}, {"name": "Juanyi Yang"}], "featured_authors": [{"name": "David A. Lowe"}, {"name": "Yiru Wang"}, {"name": "Juanyi Yang"}], "author_count": 3}, {"id": "2610.38907", "category": "hep-th", "title": "Generalized Symmetries of QED$_4$ on Non-Spin Manifolds", "abstract": "Generalized symmetries are sensitive to the tangential structure of spacetime. We study this interplay for massless QED on oriented non-spin four-manifolds, where the photon becomes a spin$^c$ connection and the path integral sums over spin$^c$ structures. The shifted flux quantization extends the magnetic 1-form symmetry into a $w_2$-twisted 1-form symmetry: its $2\\pi$ rotation acts as a gravitational sign, fixed by the normal bundle of the surface the operator wraps. The obstruction to treating it as an ordinary magnetic 1-form symmetry is an order-two mixed magnetic-gravitational anomaly, which is classified by reduced oriented bordism and detected on the Wu manifold. In a fixed spin$^c$ sector, this anomaly is removable by a counterterm, so it is a property of the sum over spin$^c$ structures. We discuss its consequences for gapped, Coulomb, and Higgs phases. The chiral anomaly is governed by the index of the spin$^c$ Dirac operator, so rational chiral defects carry gravitational as well as electromagnetic responses. A spin$^c$ Hall topological field theory cancels the electromagnetic part but leaves a framing anomaly. At the level of anomaly inflow, this is canceled for every rational angle by stacking a neutral, generally noninvertible Witten-Reshetikhin-Turaev layer. The same framing subtlety affects the chiral defects of QED on curved spin manifolds. The complex projective plane illustrates each of these features explicitly.", "url": "https://arxiv.org/abs/2610.38907", "type": "理论", "summary": "广义对称性对时空的切向结构很敏感。我们研究了定向非自旋四流形上无质量 QED 的相互作用，其中光子成为自旋 $^c$ 连接，并且自旋 $^c$ 结构上的路径积分和。移位通量量化将磁 1 型对称性扩展为 $w_2$ 扭曲 1 型对称性：其 $2\\pi$ 旋转充当引力符号，由算子包裹的表面法线束固定。将其视为普通磁 1 型对称性的障碍是二阶混合磁引力异常，它通过减少定向棱镜进行分类并在 Wu 流形上检测到。在固定的 spin$^c$ 扇区中，这种异常可以通过反项消除，因此它是 spin$^c$ 结构之和的属性。我们讨论它对有隙相、库仑相和希格斯相的影响。手性反常由自旋$^c$狄拉克算子的指数控制，因此有理手性缺陷带有引力和电磁响应。自旋$^c$霍尔拓扑场理论取消了电磁部分，但留下了框架异常。\n\n在异常流入的水平上，通过堆叠中性的、通常不可逆的 Witten-Reshetikhin-Turaev 层，可以针对每个有理角度取消这一点。同样的框架微妙性也会影响弯曲自旋流形上 QED 的手性缺陷。复投影平面明确地说明了这些特征中的每一个。", "authors": [{"name": "Michele Del Zotto"}, {"name": "Vivek Saxena"}], "featured_authors": [{"name": "Michele Del Zotto"}, {"name": "Vivek Saxena"}], "author_count": 2}, {"id": "2610.39048", "category": "hep-th", "title": "Are Black Hole and Cosmological Horizon Thermodynamics Necessarily Inequivalent?", "abstract": "It has recently been argued that cosmological horizon thermodynamics and black hole thermodynamics are generically inequivalent in any consistent, UV complete theory of quantum gravity, where it was suggested that this could be falsified by the identification of a counterexample. This conjecture was motivated in part by noting that cosmological horizons do not incorporate many of the convenient features found in the black holes described by string theory. In this work, we consider as a toy model a universe with a single non-rotating black hole and a positive cosmological constant. We work in the Nariai limit where the mass of the black hole is taken to its maximum possible value, and where we also assert that the quantum field theory living on this background is strictly parity invariant. In the semi-classical regime where we neglect instability of the exact Nariai equilibrium under quantum fluctuations, we find that the observer cannot readily distinguish the physics in the neighborhood of the black hole horizon from the physics in the neighborhood of the cosmological horizon. This does not prove that the two are generically equivalent in any universe, though it does suggest that they cannot be entirely unrelated in general. We propose that any consistent theory of quantum gravity that aims to describe black holes in a universe with a positive cosmological constant should provide a related microscopic origin for the leading semiclassical cosmological entropy and black hole entropy in the neighborhood of the particular limit considered here.", "url": "https://arxiv.org/abs/2610.39048", "type": "理论", "summary": "最近有人认为，宇宙视界热力学和黑洞热力学在任何一致的、紫外完整的量子引力理论中一般都是不等价的，有人认为这可以通过识别反例来证伪。这一猜想的部分动机是注意到宇宙视界没有包含弦理论描述的黑洞中发现的许多方便的特征。在这项工作中，我们将具有单个非旋转黑洞和正宇宙学常数的宇宙视为玩具模型。我们在 Nariai 极限下工作，在该极限下，黑洞的质量取其最大可能值，并且我们还断言，在此背景下存在的量子场论是严格宇称不变的。在半经典体系中，我们忽略了量子涨落下精确的 Nariai 平衡的不稳定性，我们发现观察者无法轻易区分黑洞视界附近的物理和宇宙视界附近的物理。\n\n这并不能证明两者在任何宇宙中一般都是等价的，尽管它确实表明它们通常不可能完全无关。我们提出，任何旨在描述具有正宇宙学常数的宇宙中的黑洞的一致量子引力理论都应该为这里考虑的特定极限附近的主要半经典宇宙学熵和黑洞熵提供相关的微观起源。", "authors": [{"name": "Zachary J. Hoelscher"}], "featured_authors": [{"name": "Zachary J. Hoelscher"}], "author_count": 1}, {"id": "2610.39052", "category": "hep-th", "title": "Deformed Amplituhedra and Interpolating Anomalous Dimensions on the Coulomb Branch", "abstract": "We study planar four-point scattering amplitudes on the Coulomb branch of $\\mathcal N=4$ super Yang--Mills theory, focusing on multi-parameter families of massive kinematics. We extend the deformed Amplituhedron construction of \\cite{Arkani-Hamed:2023epq,Flieger:2025ekn} to general external kinematics characterized by a six-parameter embedding-space Gram matrix. We show that copositivity constraints on the inverse Gram matrix control the real geometry and restrict the numerator of the two-loop canonical form to the span of the two planar double-box structures expected for the scattering amplitude. We then specialize to a three-parameter massive configuration and evaluate the relevant one- and two-loop integrals using differential equations directly in four dimensions, obtaining analytic expressions in terms of multiple polylogarithms. We investigate multiscale infrared limits of the proposed two-loop amplitude and find exponentiation through two loops. The kinematic family contains the limits governed by the cusp and octagon anomalous dimensions and interpolates between them through the walking anomalous dimension introduced in~\\cite{Alday:2026cpk}. Our result reproduces the one-loop interpolation and fixes the two-loop coefficients in their proposed all-loop ansatz. Interestingly, our results suggest that the walking anomalous dimension may be entirely determined through all loop orders by the cusp a
