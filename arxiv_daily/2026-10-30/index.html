nd octagon anomalous dimensions.", "url": "https://arxiv.org/abs/2610.39052", "type": "理论", "summary": "我们研究 $\\mathcal N=4$ 超杨-米尔斯理论库仑分支上的平面四点散射振幅，重点关注大规模运动学的多参数族。我们将 \\cite{Arkani-Hamed:2023epq,Flieger:2025ekn} 的变形幅面体构造扩展到以六参数嵌入空间 Gram 矩阵为特征的一般外部运动学。我们证明了逆格拉姆矩阵上的共性约束控制了真实的几何形状，并将二环规范形式的分子限制为散射幅度预期的两个平面双盒结构的跨度。然后，我们专注于三参数大规模配置，并直接在四维中使用微分方程评估相关的一环和二环积分，获得多个多对数的解析表达式。我们研究了所提出的双环振幅的多尺度红外极限，并通过两个环求幂。运动学族包含由尖点和八边形异常尺寸控制的限制，并通过~\\cite{Alday:2026cpk}中引入的行走异常尺寸在它们之间进行插值。\n\n我们的结果再现了单循环插值，并修复了他们提出的全循环 ansatz 中的两循环系数。有趣的是，我们的结果表明，行走异常尺寸可能完全由尖点和八边形异常尺寸通过所有循环顺序确定。", "authors": [{"name": "Francesco Calisto"}, {"name": "Subramanya Hegde"}, {"name": "Martín Lagares"}, {"name": "Elia Mazzucchelli"}], "featured_authors": [{"name": "Francesco Calisto"}, {"name": "Subramanya Hegde"}, {"name": "Martín Lagares"}, {"name": "Elia Mazzucchelli"}], "author_count": 4}, {"id": "2610.39101", "category": "hep-th", "title": "Regularized Master-Field Approximation for Mass-Deformed Supersymmetric Yang-Mills Matrix Models", "abstract": "The regularized master-field approximation (RMA) is an efficient computational method for large-$N$ reduced matrix models, including those with multiple matrices or complex integration weights. In this work, we apply the RMA to mass-deformed supersymmetric Yang--Mills-type matrix models with three, four, and ten matrices. All three models admit fuzzy-sphere configurations as classical solutions. We show that the RMA quantitatively reproduces these fuzzy-sphere solutions and their breakdown, and that zero modes of the Dirac operator can destabilize fuzzy-sphere configurations in certain cases.", "url": "https://arxiv.org/abs/2610.39101", "type": "理论", "summary": "正则化主场近似 (RMA) 是一种有效的计算方法，适用于大型 N$ 简化矩阵模型，包括具有多个矩阵或复杂积分权重的模型。在这项工作中，我们将 RMA 应用于具有三个、四个和十个矩阵的质量变形超对称 Yang-Mills 型矩阵模型。所有三个模型都承认模糊球配置作为经典解决方案。我们证明 RMA 定量地再现了这些模糊球解及其分解，并且狄拉克算子的零模式在某些情况下可能会破坏模糊球配置的稳定性。", "authors": [{"name": "Yue Lei"}, {"name": "Reishi Maeta"}], "featured_authors": [{"name": "Yue Lei"}, {"name": "Reishi Maeta"}], "author_count": 2}, {"id": "2610.39106", "category": "hep-th", "title": "virasoro_blocks: Software for the 2d bootstrap", "abstract": "We introduce virasoro_blocks, software that computes Virasoro conformal blocks at any central charge in a form suitable for the numerical bootstrap. At each finite order in the elliptic nome, Zamolodchikov's recursion gives the block as a positive prefactor times a rational function of the exchanged weight. However, its many Kac poles make it difficult to use in semidefinite programming approaches to the bootstrap. In this software we use optimal interpolation to reduce the number of poles while keeping high accuracy. The software works in arbitrary precision and handles singular central charges, including the minimal models and $c=1$. It also computes global blocks, $N=1$ superconformal blocks, torus characters, and torus one-point blocks. We illustrate it with two applications. Assuming only scalar Virasoro primaries, we compute bounds on the scalar gap that approach the window of Liouville solutions between $(c-1)/16$ and $(c-1)/12$. We also bound the average exchanged dimension in four-point functions of identical scalars at several central charges. These bounds have a rich structure, and many known 2d CFTs lie on or near their boundary.", "url": "https://arxiv.org/abs/2610.39106", "type": "理论", "summary": "我们介绍了 virasoro_blocks，该软件可以以适合数值引导的形式计算任何中心电荷处的 Virasoro 共形块。在椭圆诺姆的每个有限阶上，扎莫洛奇科夫的递归将块给出为正前因子乘以交换权重的有理函数。然而，它的许多 Kac 极点使其难以在引导程序的半定编程方法中使用。在该软件中，我们使用最佳插值来减少极点数量，同时保持高精度。该软件以任意精度工作并处理奇异的中心电荷，包括最小模型和 $c=1$。它还计算全局块、$N=1$超共形块、环面字符和环面单点块。我们用两个应用来说明它。假设只有标量 Virasoro 原色，我们计算接近 $(c-1)/16$ 和 $(c-1)/12$ 之间刘维尔解窗口的标量间隙的界限。我们还将平均交换维数限制在几个中心电荷相同标量的四点函数中。这些边界具有丰富的结构，许多已知的 2d CFT 位于其边界上或附近。", "authors": [{"name": "David Poland"}], "featured_authors": [{"name": "David Poland"}], "author_count": 1}, {"id": "2610.39207", "category": "hep-th", "title": "Ortho-symplectic interface line operators in $\\mathcal{N}=4$ SYM theories", "abstract": "We study the line operators at the half-BPS interfaces in 4d $\\mathcal{N}=4$ super Yang-Mills (SYM) theories of orthogonal and symplectic gauge groups. For the NS5-type interfaces, line operators are labeled by pairs of electric or magnetic charges under the gauge groups on either side of the interface, whereas for the D5-type interfaces they are labeled by electric or magnetic charges under the single gauge group preserved by the interface. We propose dualities between the Wilson lines and vortex lines at the interfaces under the action of S-duality. As highly non-trivial evidence of the dualities on the junctions of the line operators and the interfaces, we find matching of the line defect half-indices for the dual pairs.", "url": "https://arxiv.org/abs/2610.39207", "type": "理论", "summary": "我们研究了正交规范群和辛规范群的 4d $\\mathcal{N}=4$ super Yang-Mills (SYM) 理论中半 BPS 接口处的线算子。对于 NS5 型接口，线路操作员由接口两侧的规组下的电荷对或磁荷标记，而对于 D5 型接口，线路操作员由接口保留的单个规组下的电荷或磁荷标记。我们提出在 S 对偶性作用下界面处威尔逊线和涡旋线之间的对偶性。作为线路运营商和接口连接处对偶性的高度重要的证据，我们发现了对偶对的线路缺陷半指数的匹配。", "authors": [{"name": "Yasuyuki Hatsuda"}, {"name": "Tadashi Okazaki"}], "featured_authors": [{"name": "Yasuyuki Hatsuda"}, {"name": "Tadashi Okazaki"}], "author_count": 2}, {"id": "2610.39243", "category": "hep-th", "title": "Schwinger--Keldysh worldline effective field theory for quantum black holes: dissipation, noise and decoherence", "abstract": "We formulate a Schwinger--Keldysh worldline effective field theory for quantum black holes that treats dissipation, fluctuations, and decoherence within one real-time influence functional. The reduced dynamics is encoded in causal response and symmetric noise kernels. Their spectra obey positivity constraints, while thermal Kubo--Martin--Schwinger symmetry relates them through the fluctuation--dissipation relation. A Hubbard--Stratonovich representation turns the noise kernel into a Gaussian source driving the resolved metric and worldline. For a leading post-Newtonian Schwarzschild binary, direct and metric-mediated stochastic forces combine into the complete relative-acceleration noise at this order, preserve center-of-mass momentum balance, and remain Planck suppressed. The same noise kernel gives the quadrupolar decoherence functional for a supported spatial superposition and reproduces the Danielson--Satishchandran--Wald horizon-induced scaling after absorptive matching. Away from thermal equilibrium, response and noise remain independent matching data. We discuss extensions to microscopic quantum structure in the worldline kernels, matching to spatially extended coarse-grained descriptions, and gravitational splitting.", "url": "https://arxiv.org/abs/2610.39243", "type": "理论", "summary": "我们为量子黑洞制定了施温格-凯尔迪什世界线有效场理论，该理论在一个实时影响泛函中处理耗散、涨落和退相干。减少的动态被编码在因果响应和对称噪声内核中。它们的光谱服从正性约束，而热久保-马丁-施温格对称性通过涨落-耗散关系将它们联系起来。 Hubbard-Stratonovich 表示将噪声内核转换为驱动解析度量和世界线的高斯源。对于领先的后牛顿史瓦西二元，直接随机力和度量介导的随机力在此阶组合成完整的相对加速度噪声，保持质心动量平衡，并保持普朗克抑制。相同的噪声核给出了支持的空间叠加的四极退相干函数，并在吸收匹配后再现了 Danielson-Satishchandran--Wald 地平线引起的缩放。远离热平衡，响应和噪声保持独立的匹配数据。\n\n我们讨论世界线内核中微观量子结构的扩展、与空间扩展的粗粒度描述的匹配以及引力分裂。", "authors": [{"name": "Hajime Kobayashi"}], "featured_authors": [{"name": "Hajime Kobayashi"}], "author_count": 1}, {"id": "2610.39285", "category": "hep-th", "title": "Quantum field theory with scale-dependent weighted measures: nonlinear momentum representations, vacuum fluctuations, and causal structure", "abstract": "We reconsider the construction of free quantum fields through momentum-space weighted measures, introducing an independent energy scale that restores the conventional theory at low momenta. The resulting family is characterized by a dimensionless spectral function and includes, as a distinguished case, the spatial weight associated with the Euclidean Snyder algebra. We discuss its relation to modified dispersion relations and nonlinear momentum coordinates, and introduce an observer-covariant spectral weight defined using a timelike four-velocity. For the complex Klein-Gordon field we obtain the equal-time algebra, conserved weighted observables, vacuum fluctuations, and two-point functions in arbitrary spatial dimension. The ultraviolet conditions for their finiteness are established, and the nonlocal causal structure is analyzed in terms of a spatial convolution of the ordinary Pauli-Jordan distribution. An illustrative interacting extension and numerical profiles of the kernels and amplitudes are also presented.", "url": "https://arxiv.org/abs/2610.39285", "type": "理论", "summary": "我们重新考虑通过动量空间加权测量构建自由量子场，引入独立的能量尺度，恢复低动量下的传统理论。由此产生的族的特征是无量纲谱函数，并且作为一个突出的例子，包括与欧几里得斯奈德代数相关的空间权重。我们讨论了它与修正色散关系和非线性动量坐标的关系，并引入了使用类时四速度定义的观察者协变谱权重。对于复数克莱因-戈登场，我们获得了等时代数、守恒加权可观测量、真空涨落和任意空间维度的两点函数。建立了其有限性的紫外条件，并根据普通泡利-乔丹分布的空间卷积分析了非局部因果结构。还给出了核和振幅的说明性相互作用扩展和数值分布。", "authors": [{"name": "S. González-Salud"}, {"name": "R. Cartas-Fuentevilla"}], "featured_authors": [{"name": "S. González-Salud"}, {"name": "R. Cartas-Fuentevilla"}], "author_count": 2}, {"id": "2610.39400", "category": "hep-th", "title": "Does SO(2,2) symmetry lead to an additional U(1) symmetry in 5-dimensional Einstein-scalar theories?", "abstract": "Solving Einstein equations including the matter fields in dimensions higher than four is computationally challenging. However, the existence of symmetries facilitates these calculations. Among these symmetries, we can mention the SO(2,2) symmetry that arises in the near-horizon geometries of extremal black holes with vanishing horizon area in four dimensions \\cite{EVH/CFT} and higher dimensions \\cite{Sadeghian:2015}. Solutions of Einstein theories including scalar and Maxwell fields with SO(2,2) symmetry have been classified in four, five, and higher dimensions \\cite{Sadeghian:2014}. For the Einstein-Maxwell-Lambda theory, a theorem states that SO(2,2) symmetry leads to an additional U(1) symmetry and therefore unique axisymmetric solutions. Nevertheless, in the presence of a scalar field, this symmetry group is not large enough in five dimensions to guarantee solution uniqueness, and the additional U(1) symmetry remains a conjecture in \\cite{Sadeghian:2014}. Here, we study the Einstein equations of theories with a five-dimensional scalar field using the Lie symmetry method for solving partial differential equations. We challenge the conjecture in \\cite{Sadeghian:2014} and find a solution that depends on both $\\theta$ and $\\psi$ coordinates as a counterexample to that conjecture.", "url": "https://arxiv.org/abs/2610.39400", "type": "理论", "summary": "求解包括维度高于四的物质场的爱因斯坦方程在计算上具有挑战性。然而，对称性的存在促进了这些计算。在这些对称性中，我们可以提到在四维\\cite{EVH/CFT}和更高维度\\cite{Sadeghian:2015}中具有消失视界区域的极值黑洞的近地平线几何结构中出现的SO(2,2)对称性。爱因斯坦理论的解，包括具有 SO(2,2) 对称性的标量场和麦克斯韦场，已被分为四维、五维和更高维\\cite{Sadeghian:2014}。对于 Einstein-Maxwell-Lambda 理论，定理指出 SO(2,2) 对称性会导致额外的 U(1) 对称性，从而产生独特的轴对称解。然而，在存在标量场的情况下，这个对称群在五个维度上不够大，无法保证解的唯一性，并且额外的 U(1) 对称性仍然是 \\cite{Sadeghian:2014} 中的猜想。在这里，我们使用李对称方法求解偏微分方程，研究具有五维标量场的爱因斯坦理论方程。\n\n我们挑战 \\cite{Sadeghian:2014} 中的猜想，并找到一个依赖于 $\\theta$ 和 $\\psi$ 坐标的解决方案作为该猜想的反例。", "authors": [{"name": "Saeedeh Sadeghian"}], "featured_authors": [{"name": "Saeedeh Sadeghian"}], "author_count": 1}, {"id": "2610.39402", "category": "hep-th", "title": "Absorption of bound supernova axion-like particles by the neutron star weakens the heating limits on their photon coupling", "abstract": "Axion-like particles (ALPs) that couple to protons are produced in a core-collapse supernova, and the slow ones remain bound to the new neutron star. Bose, Ganguly, Kumar, and Raj [ arXiv:2610.30255 ] proposed that the photons from the decay of this bound cloud reheat old neutron stars, and they derived strong limits on the ALP-photon coupling. They neglected the absorption of the ALPs by the star, but a bound ALP on an orbit that enters the star and reaches 50 km crosses it about $6\\times 10^{18}$ times over the 333 Myr age of PSR J2144$-$3933. We show that inverse nucleon bremsstrahlung in the cold star absorbs every ALP whose orbit enters it within minutes, long before it decays, so only ALPs born outside the final star on nearly circular orbits survive; they carry $9\\times 10^{-9} - 6\\times 10^{-5}$ of the heating. We compute the protoneutron-star evolution, the production, the general-relativistic orbits and the absorption ourselves, for twelve protoneutron-star evolutions, three nucleon-bremsstrahlung rates normalized to the same supernova energy loss of light ALPs, and equations of state with and without $\\Delta(1232)$ isobars. PSR J2144$-$3933 still excludes a window at $m_a\\simeq 7.7-196$\\ MeV, with a lower edge in the photon coupling $280-700$ times higher than without absorption. Pion conversion and the $\\Delta(1232)$ resonance, which raise the production of surviving ALPs more than their absorption, widen this window to $m_a\\simeq$ $7.7-260$\\ MeV. The window depends at similar levels on the bremsstrahlung rate and on the radius of the final star. It requires a direct photon coupling that cancels the one induced by ALP-pion mixing, and existing supernova gamma-ray limits may already cover it.", "url": "https://arxiv.org/abs/2610.39402", "type": "理论", "summary": "与质子耦合的类轴子粒子（ALP）是在核心塌陷超新星中产生的，而慢速粒子仍然与新中子星结合。 Bose、Ganguly、Kumar 和 Raj [ arXiv:2610.30255 ] 提出，来自该束缚云衰变的光子重新加热了古老的中子星，并且他们得出了 ALP-光子耦合的严格限制。他们忽略了恒星对 ALP 的吸收，但进入恒星并到达 50 公里的轨道上的束缚 ALP 在 PSR J2144$-$3933 的 333 Myr 年龄内穿过恒星约 $6\\times 10^{18}$ 次。我们表明，冷恒星中的逆核子轫致辐射会在几分钟内吸收所有进入其轨道的 ALP，早在它衰变之前，因此只有在最终恒星之外、近圆形轨道上诞生的 ALP 才能幸存；它们携带 $9\\times 10^{-9} - 6\\times 10^{-5}$ 的暖气。我们自己计算了原中子星的演化、产生、广义相对论轨道和吸收，包括十二次原中子星演化、三个核子轫致辐射率归一化为相同的超新星光ALP能量损失，以及有和没有$\\Delta(1232)$等压线的状态方程。\n\nPSR J2144$-$3933 仍然排除 $m_a\\simeq 7.7-196$\\ MeV 处的窗口，光子耦合的下边缘比没有吸收时高 $280-700$ 倍。 π介子转换和 $\\Delta(1232)$ 共振使幸存 ALP 的产生量超过其吸收量，将这一窗口扩大到 $m_a\\simeq$ $7.7-260$\\ MeV。该窗口在类似水平上取决于轫致辐射率和最终恒星的半径。它需要一种直接的光子耦合来抵消 ALP-π 介子混合引起的光子耦合，而现有的超新星伽马射线限制可能已经覆盖了它。", "authors": [{"name": "Probit J Kalita"}, {"name": "Subha Mitra"}, {"name": "Bharat Kumar"}], "featured_authors": [{"name": "Probit J Kalita"}, {"name": "Subha Mitra"}, {"name": "Bharat Kumar"}], "author_count": 3}, {"id": "2610.39450", "category": "hep-th", "title": "Carrollian CFTs and the Light Front", "abstract": "Carrollian symmetries play an important role in building holographic duals to asymptotically flat spacetimes (AFS). This construction hinges on the isomorphism between the (asymptotic) isometries of AFS and the conformal Carroll algebra. Carroll symmetries also naturally arise on the lightfront, as co-dimension one subalgebras in the Poincare algebra written in lightcone coordinates. In this paper, building on the isomorphism between four dimensional (4d) Poincare and 3d conformal Carroll algebras, we make a connection between physics on the lightfront and Carrollian CFTs. Using insights from the lightfront literature, we construct new representations of Carroll CFTs that connect to massive bulk scattering. We compute two-point functions and build a map between 3d Carroll CFTs and 4d lightfront theories living in AFS.", "url": "https://arxiv.org/abs/2610.39450", "type": "理论", "summary": "卡罗尔对称性在构建全息对偶到渐近平坦时空（AFS）方面发挥着重要作用。这种构造取决于 AFS 的（渐近）等距与共形卡罗尔代数之间的同构。卡罗尔对称性也自然地出现在光前，作为以光锥坐标书写的庞加莱代数中的共维一子代数。在本文中，基于四维 (4d) 庞加莱和 3d 共形卡罗尔代数之间的同构，我们在光前物理和卡罗尔 CFT 之间建立了联系。利用光前文献中的见解，我们构建了与大量体散射相关的 Carroll CFT 的新表示。我们计算两点函数并在 3d Carroll CFT 和 AFS 中的 4d 光前理论之间构建映射。", "authors": [{"name": "Arjun Bagchi"}, {"name": "Kinjal Banerjee"}, {"name": "Sourish Banerjee"}, {"name": "Meghaa AK"}], "featured_authors": [{"name": "Arjun Bagchi"}, {"name": "Kinjal Banerjee"}, {"name": "Sourish Banerjee"}, {"name": "Meghaa AK"}], "author_count": 4}, {"id": "2610.39569", "category": "hep-th", "title": "Large-$N$ limit of chiral quiver theories: free energy, supersymmetric indices and operator counting", "abstract": "We find the first analytic solution to the large-$N$ saddle point equations for the $S^3$ free energy of a chiral $\\mathcal N=2$ Chern-Simons-matter theory with an M-theory dual. Focusing on the chiral quiver dual to AdS$_4\\times Q^{1,1,1}/\\mathbb Z_{\\rm k}$, we show how the long-range forces of the matrix model cancel at large $N$, resolving a long-standing tension with the expected $N^{3/2}$ scaling. The resulting free energy precisely matches the holographic prediction for all assignments of trial R-charges. Our results extend to the superconformal and topologically twisted indices on $S^2\\times S^1$, whose large-$N$ and Cardy limit is determined by the same saddle. The solution agrees with the predictions of the operator counting method, giving strong evidence for this conjecture beyond non-chiral quivers. We support the analytic solution with a finite-$N$ numerical analysis for multiple assignments of R-charges, extending recent numerical results obtained for this quiver.", "url": "https://arxiv.org/abs/2610.39569", "type": "理论", "summary": "我们找到了具有 M 理论对偶的手性 $\\mathcal N=2$ Chern-Simons 物质理论的 $S^3$ 自由能的大 $N$ 鞍点方程的第一个解析解。着眼于 AdS$_4\\times Q^{1,1,1}/\\mathbb Z_{\\rm k}$ 的手性颤动，我们展示了矩阵模型的远程力如何在大 $N$ 处抵消，从而通过预期的 $N^{3/2}$ 缩放解决了长期存在的紧张局势。由此产生的自由能与所有试验 R 电荷分配的全息预测精确匹配。我们的结果扩展到 $S^2\\times S^1$ 上的超共形和拓扑扭曲索引，其大 $N$ 和 Cardy 极限由相同的鞍点确定。该解与算子计数方法的预测一致，为这一猜想提供了超越非手性颤动的有力证据。我们支持对 R 电荷的多重分配进行有限 $N$ 数值分析的解析解，扩展了为此箭袋获得的最新数值结果。", "authors": [{"name": "Edoardo Colombo"}, {"name": "Hyojoong Kim"}, {"name": "Nakwoo Kim"}, {"name": "Hoseob Shin"}], "featured_authors": [{"name": "Edoardo Colombo"}, {"name": "Hyojoong Kim"}, {"name": "Nakwoo Kim"}, {"name": "Hoseob Shin"}], "author_count": 4}, {"id": "2610.39594", "category": "hep-th", "title": "Superstring Field Theory with Double Background Independence", "abstract": "A recently constructed superstring field theory has two decoupled sectors, the physical superstring and a shadow sector with a second copy of the superstring. These are both expanded around the same background conformal field theory and the theory is independent of marginal deformations of this common background. A form of the action is presented that is symmetric between the two sectors. A generalisation of this theory is given in which the two sectors can be expanded around two different backgrounds, and the theory is independent under separate marginal deformations of the two background conformal field theories.", "url": "https://arxiv.org/abs/2610.39594", "type": "理论", "summary": "最近构建的超弦场论有两个解耦的扇区，即物理超弦和带有超弦第二个副本的影子扇区。这些都是围绕相同背景共形场理论展开的，并且该理论独立于该共同背景的边缘变形。提出了一种在两个部门之间对称的行动形式。给出了该理论的推广，其中两个扇区可以围绕两个不同的背景展开，并且该理论在两个背景共形场论的单独边缘变形下是独立的。", "authors": [{"name": "Chris Hull"}], "featured_authors": [{"name": "Chris Hull"}], "author_count": 1}, {"id": "2610.39804", "category": "hep-th", "title": "Majorana Neutrino Physics and Matter-Antimatter Asymmetry in Type IIA String Theory", "abstract": "We study Majorana neutrino masses and the matter-antimatter asymmetry in Type IIA string theory on a $T^6/(\\mathbb{Z}_2 \\times \\mathbb{Z}_2)$ orientifold with intersecting D6-branes. Euclidean D2-instantons with $\\text{Sp}(2)$ Chan-Paton symmetry generate both the seesaw mechanism and the Weinberg operator. The flavour vectors are not computed from a compactification but fixed by matching, so our results are an existence proof. Matching the measured mass-squared differences selects the seesaw-dominated case with normal ordering. Swampland criteria constrain the instanton action and the reheating temperature. A benchmark example reproduces the neutrino parameters, gives $\\eta_B \\approx 8.6 \\times 10^{-11}$, within an order of magnitude of observation, and predicts $\\langle m_{\\beta \\beta} \\rangle =2.594 \\text{meV}$. A parameter scan shows the mass hierarchy is accommodated rather than predicted.", "url": "https://arxiv.org/abs/2610.39804", "type": "理论", "summary": "我们在与 D6 膜相交的 $T^6/(\\mathbb{Z}_2 \\times \\mathbb{Z}_2)$ 东方褶皱上研究马约拉纳中微子质量和 IIA 型弦理论中的物质-反物质不对称性。具有 $\\text{Sp}(2)$ Chan-Paton 对称性的欧几里得 D2 瞬时函数生成跷跷板机制和温伯格算子。风味向量不是通过压缩计算的，而是通过匹配固定的，因此我们的结果是存在性证明。匹配测量的质量平方差选择具有正常排序的跷跷板主导情况。沼泽标准限制了瞬时动作和再加热温度。基准示例再现了中微子参数，在观察的一个数量级内给出了 $\\eta_B \\approx 8.6 \\times 10^{-11}$，并预测 $\\langle m_{\\beta \\beta} \\rangle =2.594 \\text{meV}$。参数扫描显示质量层次结构是适应的而不是预测的。", "authors": [{"name": "Yang Liu"}], "featured_authors": [{"name": "Yang Liu"}], "author_count": 1}, {"id": "2610.39851", "category": "hep-th", "title": "On functional classes in higher-spin theory", "abstract": "The factorization over the ideal in the $d$-dimensional Vasiliev theory requires an accurate description of the higher-spin algebra $\\mathcal{A}$ and its twisted adjoint module $\\mathcal{A}^{tw}$ as certain functional spaces. It is shown that the conditions of $\\mathcal{A}$ to be closed under action of the Moyal star product, and of $\\mathcal{A}^{tw}$ to be a star-product $\\mathcal{A}$-module along with some auxiliary conditions lead to properly defined free-level factorization procedure. The conditions on admissible functions have simple algebraic form; in the case of $\\mathcal{A}$ the analogous functional space has been considered by Soloviev \\cite{Soloviev:2013iba}. The relation of the obtained functional classes to the locality problem in the Vasiliev theory is discussed. In particular it is observed that certain non-local expressions diverge due to properties of $\\mathcal{A}^{tw}$ while the spin-local expressions are well-defined.", "url": "https://arxiv.org/abs/2610.39851", "type": "理论", "summary": "$d$ 维 Vasiliev 理论中的理想分解需要将高自旋代数 $\\mathcal{A}$ 及其扭曲伴随模块 $\\mathcal{A}^{tw}$ 准确描述为某些函数空间。结果表明，$\\mathcal{A}$ 在 Moyal 星积的作用下闭合的条件以及 $\\mathcal{A}^{tw}$ 成为星积 $\\mathcal{A}$ 模块的条件以及一些辅助条件导致了正确定义的自由水平分解过程。容许函数的条件具有简单的代数形式；在 $\\mathcal{A}$ 的情况下，Soloviev \\cite{Soloviev:2013iba} 已经考虑了类似的函数空间。讨论了所获得的函数类与Vasiliev理论中局部性问题的关系。特别是，可以观察到某些非局部表达式由于 $\\mathcal{A}^{tw}$ 的属性而发散，而自旋局部表达式是明确定义的。", "authors": [{"name": "Yu. A. Tatarenko"}], "featured_authors": [{"name": "Yu. A. Tatarenko"}], "author_count": 1}, {"id": "2610.39965", "category": "hep-th", "title": "Initial conditions leave IR imprints in quantum cosmology", "abstract": "We investigate the gravitational path integral of $\\mathbb{R} \\times S^3$ geometries in Lorentzian signature along with the metric fluctuations which live on the $S^3$ hypersurfaces. Each metric configuration is characterised by lapse, scale factor and fluctuations, and is weighted by the exponential of the Einstein-Hilbert action. A particular boundary requirement for the scale-factor is achievable via an infinite family of covariant boundary actions, each restricting the boundary behaviour of the fluctuation field which cannot be arbitrarily chosen. The paper explores the effect of this infinite family of covariant boundary actions on the wavefunction of Universe to one-loop. These boundary actions are characterized by parameters $c$ and $\\omega$. Dominant contribution of initial momentum in the path-integral restricts $\\omega$ to be half-integer, leading to an infinite family of $c$-dependent conjugate momenta. In special case for fixed $\\omega$, four such $c$-dependent dominant branches of conjugate momenta emerge: two lead to deSitter, one leads to Hartle-Hawking and one to the tunnelling Universe. For all these $c$-dependent initial conjugate momenta, the lapse-saddles are relevant, however only, one of deSitter saddle and Hartle Hawking saddle have well-behaved perturbations. The one-loop wavefunction at these well-behaved saddles is computed systematically by isolating the UV-divergences, where the covariant boundary parameter $c$ acts as a UV-regulator and also helps in shifting the poles of one-loop determinant, away from the real $q_f$ axis for dS saddles, where $q_f$ is the final size of the Universe. UV-finite wavefunction for no-boundary and dS is obtained by adding suitable counterterms. The infrared behaviour of these wavefunctions show not only IR-divergences but also sensitivity toward the initial boundary choices.", "url": "https://arxiv.org/abs/2610.39965", "type": "理论", "summary": "我们研究洛伦兹签名中 $\\mathbb{R} \\times S^3$ 几何形状的引力路径积分以及 $S^3$ 超曲面上的度量涨落。每个度量配置的特点是失效、比例因子和波动，并通过爱因斯坦-希尔伯特作用的指数进行加权。比例因子的特定边界要求可以通过无限族的协变边界行为来实现，每个协变边界行为都限制不能任意选择的涨落场的边界行为。本文探讨了这个无限族的协变边界作用对单环宇宙波函数的影响。这些边界动作由参数 $c$ 和 $\\omega$ 来表征。路径积分中初始动量的主要贡献将 $\\omega$ 限制为半整数，从而导致 $c$ 依赖的共轭动量的无限族。在固定 $\\omega$ 的特殊情况下，出现了四个这样的依赖于 $c$ 的共轭动量主导分支：两个通向 deSitter，一个通向 Hartle-Hawking，一个通向隧道宇宙。\n\n对于所有这些依赖于 $c$ 的初始共轭动量，时差鞍点都是相关的，但是只有 deSitter 鞍点和 Hartle Hawking 鞍点之一具有良好的扰动。这些表现良好的鞍座处的单环波函数是通过隔离 UV 发散来系统计算的，其中协变边界参数 $c$ 充当 UV 调节器，并且还有助于将单环行列式的极点移动，远离 dS 鞍座的真实 $q_f$ 轴，其中 $q_f$ 是宇宙的最终大小。无边界和 dS 的 UV 有限波函数是通过添加适当的反项获得的。这些波函数的红外行为不仅显示了红外发散，而且显示了对初始边界选择的敏感性。", "authors": [{"name": "Manishankar Ailiga"}, {"name": "Akash Mondal"}, {"name": "Gaurav Narain"}], "featured_authors": [{"name": "Manishankar Ailiga"}, {"name": "Akash Mondal"}, {"name": "Gaurav Narain"}], "author_count": 3}, {"id": "2610.40101", "category": "hep-th", "title": "The Effective Kerr-Compton Tree Amplitude from Black Hole Perturbation Theory", "abstract": "We develop a new method to construct the tree-level Compton amplitude for gravitational-wave scattering off a Kerr black hole in post-Minkowskian effective field theory. Building on previous computations that required physical consistency of the amplitude, the method uses wave scattering functions from black hole perturbation theory to uniquely determine additional contact terms. We illustrate the iterative procedure by deriving explicit expressions up to sixth order in spin, including previously unknown sectors at the fifth and sixth orders in spin. The amplitude features complex transcendental structures and a leading dissipative contact term at sixth order in spin. We verify our result against known results in the literature and reproduce the one-loop tail result from black hole perturbation theory.", "url": "https://arxiv.org/abs/2610.40101", "type": "理论", "summary": "我们开发了一种新方法来构造后闵可夫斯基有效场理论中克尔黑洞引力波散射的树级康普顿振幅。该方法基于之前要求振幅物理一致性的计算，使用黑洞微扰理论中的波散射函数来唯一地确定附加接触项。我们通过导出自旋六阶的显式表达式来说明迭代过程，包括自旋五阶和六阶之前未知的扇区。振幅具有复杂的超越结构和自旋六阶的主导耗散接触项。我们根据文献中的已知结果验证了我们的结果，并重现了黑洞微扰理论的单环尾部结果。", "authors": [{"name": "N. Emil J. Bjerrum-Bohr"}, {"name": "Gang Chen"}, {"name": "Konstantinos Papadimos"}, {"name": "Nabha Shah"}, {"name": "Chenliang Su"}], "featured_authors": [{"name": "N. Emil J. Bjerrum-Bohr"}, {"name": "Gang Chen"}, {"name": "Konstantinos Papadimos"}, {"name": "Nabha Shah"}, {"name": "Chenliang Su"}], "author_count": 5}, {"id": "2610.40156", "category": "hep-th", "title": "$\\mathcal{N}=4$ Super Yang-Mills Flux Tube in AdS", "abstract": "We study a supersymmetric Wilson line on the boundary of $\\mathcal{N}=4$ super Yang-Mills theory in AdS$_4$, or equivalently on a half-space, as a model for exploring the connection between holographic strings and confining flux tubes. The boundary breaks four-dimensional conformal symmetry and is expected to remove integrability, bringing this system closer to a confining string while preserving enough supersymmetry to constrain its dynamics. Working in the planar limit, we analyze the defect spectrum at weak and strong coupling and compute the superconformal index, thereby relating the perturbative gauge-theory description to the worldsheet excitations of a long holographic string. These complementary perspectives allow us to propose a map between operators in the two regimes, under which the worldsheet axion, in particular, becomes a two-particle state at strong coupling. The resulting picture supports a smooth interpolation from an exponentially growing gauge-theory spectrum to the Cardy-like spectrum of a string worldsheet, providing a non-integrable supersymmetric model for investigating the spectral reorganization expected in confining gauge theories.", "url": "https://arxiv.org/abs/2610.40156", "type": "理论", "summary": "我们研究 AdS$_4$ 中 $\\mathcal{N}=4$ 超杨-米尔斯理论边界上的超对称威尔逊线，或者等效地在半空间上，作为探索全息弦和限制通量管之间联系的模型。该边界打破了四维共形对称性，预计会消除可积性，使该系统更接近于限制弦，同时保留足够的超对称性以约束其动力学。在平面极限下工作，我们分析弱耦合和强耦合下的缺陷谱并计算超共形指数，从而将微扰规范理论描述与长全息弦的世界面激励联系起来。这些互补的观点使我们能够提出两种状态下算子之间的映射，特别是在该映射下，世界表轴子在强耦合下变成双粒子状态。所得图像支持从指数增长的规范理论谱到弦世界表的卡迪式谱的平滑插值，为研究限制规范理论中预期的谱重组提供了不可积的超对称模型。", "authors": [{"name": "Victor Gorbenko"}, {"name": "Orr Sela"}, {"name": "Brian R. Zielazienski"}], "featured_authors": [{"name": "Victor Gorbenko"}, {"name": "Orr Sela"}, {"name": "Brian R. Zielazienski"}], "author_count": 3}, {"id": "2610.40174", "category": "hep-th", "title": "A density calculus for quantum field theory", "abstract": "These notes provide an introduction to Haagerup noncommutative $L^p$ spaces for quantum field theorists. The aim is to explain how the familiar calculus of density matrices, fractional powers, and Schatten norms extends to local observable algebras of type~III, where an intrinsic trace is unavailable. We develop the construction first for a matrix algebra, making the crossed product, its trace, and the dual action explicit, before passing to general von Neumann algebras. Particular attention is paid to the representation of normal states by Haagerup densities and to the distinction between the crossed-product trace and the canonical Haagerup functional used to compute expectation values. As a concrete application, we calculate the sandwiched Rényi divergence for a coherent excitation of a chiral current, verifying monotonicity under restriction and the Rényi quantum null energy condition at every real order $\\alpha>1$. The presentation assumes familiarity with quantum mechanics and elementary quantum field theory, while introducing the operator-algebraic concepts needed for the construction and calculation.", "url": "https://arxiv.org/abs/2610.40174", "type": "理论", "summary": "这些笔记为量子场论学家介绍了 Haagerup 非交换 $L^p$ 空间。目的是解释熟悉的密度矩阵、分数幂和 Schatten 范数的微积分如何扩展到无法获得内在迹的局部可观测代数 III 型。我们首先开发矩阵代数的构造，使叉积、其迹和对偶作用明确，然后再传递到一般冯诺依曼代数。特别关注 Haagerup 密度对正常状态的表示，以及叉积迹和用于计算期望值的规范 Haagerup 函数之间的区别。作为具体应用，我们计算了手性电流相干激发的夹层 Rényi 散度，验证了限制下的单调性以及每个实数阶 $\\alpha>1$ 下的 Rényi 量子零能量条件。本演示假定您熟悉量子力学和基本量子场论，同时介绍构造和计算所需的算子代数概念。", "authors": [{"name": "Tanay Kibe"}, {"name": "Pratik Roy"}], "featured_authors": [{"name": "Tanay Kibe"}, {"name": "Pratik Roy"}], "author_count": 2}, {"id": "2610.40203", "category": "hep-th", "title": "Quantum curves of 6d SCFTs on a -3 curve", "abstract": "We study half-BPS defects and quantum Seiberg-Witten curves in 6d $ \\mathcal{N}=(1,0) $ SCFTs on a $ -3 $ curve. We compute the partition functions in the presence of codimension-4 and codimension-2 defects on $ \\mathbb{R}^4 \\times T^2 $ using generalized blowup equations. We then propose quantum Seiberg-Witten curves as elliptic difference equations satisfied by the Nekrasov-Shatashvili limits of the defect partition functions. We apply this construction to the minimal $ \\mathfrak{su}(3) $ gauge theory, and to the $ \\mathfrak{g}_2 $ and $ \\mathfrak{so}(N) $ gauge theories on a Higgsing tree whose endpoint is the minimal $ \\mathfrak{su}(3) $ theory. We also investigate defects and the quantum curve of the $ \\mathfrak{su}(3) $ gauge theory compactified on a circle with a $ \\mathbb{Z}_2 $ twist.", "url": "https://arxiv.org/abs/2610.40203", "type": "理论", "summary": "我们研究了 $ -3 $ 曲线上 6d $ \\mathcal{N}=(1,0) $ SCFT 中的半 BPS 缺陷和量子 Seiberg-Witten 曲线。我们使用广义吹散方程计算 $ \\mathbb{R}^4 \\times T^2 $ 上存在 codimension-4 和 codimension-2 缺陷的配分函数。然后，我们提出量子 Seiberg-Witten 曲线作为由缺陷分配函数的 Nekrasov-Shatashvili 极限满足的椭圆差分方程。我们将此构造应用于最小 $ \\mathfrak{su}(3) $ 规范理论，以及端点为最小 $ \\mathfrak{su}(3) $ 理论的 Higgsing 树上的 $ \\mathfrak{g}_2 $ 和 $ \\mathfrak{so}(N) $ 规范理论。我们还研究了缺陷和在具有 $ \\mathbb{Z}_2 $ 扭曲的圆上压缩的 $ \\mathfrak{su}(3) $ 规范理论的量子曲线。", "authors": [{"name": "Minsung Kim"}, {"name": "Sung-Soo Kim"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Minsung Kim"}, {"name": "Sung-Soo Kim"}, {"name": "Xin Wang"}], "author_count": 3}, {"id": "2610.40244", "category": "hep-th", "title": "Competition and coexistence of baryonic condensates in AdS hardwall model", "abstract": "Cold dense QCD admits several order parameters for baryon-number breaking, among them diquark and dibaryon condensates. We ask whether they exclude one another or coexist, using a five-dimensional AdS hardwall model with full backreaction in which two charged scalars, dual to operators of charges $q_i$ and dimensions $\\Delta_i$, couple to a common $U(1)_B$ gauge field. With the diquark-like operator fixed at $q_1=2$, $\\Delta_1=3$, both operators condense only within a narrow window of $\\Delta_2$, which widens with $q_2$ and closes when the operators coincide. Outside the window, only a single condensate forms. The structure persists in both confined and deconfined phases. In the $\\mu_B$-$T$ plane, confined matter with both condensates is preferred at low temperature, below a narrow band of deconfined matter with one condensate.", "url": "https://arxiv.org/abs/2610.40244", "type": "理论", "summary": "冷致密 QCD 允许重子数破缺的几个有序参数，其中包括双夸克和双重子凝聚态。我们询问它们是相互排斥还是共存，使用具有完全反作用的五维 AdS 硬墙模型，其中两个带电标量，对偶于电荷 $q_i$ 和维度 $\\Delta_i$ 运算符，耦合到公共 $U(1)_B$ 规范场。将类双夸克算子固定为 $q_1=2$、$\\Delta_1=3$，两个算子仅在 $\\Delta_2$ 的狭窄窗口内凝聚，该窗口随 $q_2$ 变宽，并在算子重合时关闭。窗外，只有单一的凝结水形成。该结构在受限和非受限阶段均持续存在。在 $\\mu_B$-$T$ 平面中，在低温下优选具有两种凝结物的受限物质，低于具有一种凝结物的解约束物质的窄带。", "authors": [{"name": "Akash Singh"}], "featured_authors": [{"name": "Akash Singh"}], "author_count": 1}, {"id": "2610.40274", "category": "hep-th", "title": "$\\mathcal{N}=2$ conformal higher-spin actions in harmonic superspace", "abstract": "We construct linearized $4D, \\mathcal{N}=2$ Weyl-type off-shell actions in harmonic superspace for the superconformal higher-spin gauge multiplets introduced in arXiv:2404.19016 . This work is a followup of our arXiv:2511.16325 , where an analogous construction was carried out for conformal $\\mathcal{N}=2$ supergravity. We check the superconformal invariance of the new actions and their linearized gauge invariance. As the characteristic features of our formulation, the structure of the underlying prepotentials and their gauge and superconformal transformations are entirely determined by the fundamental \\textit{principle of Grassmann harmonic analyticity}, while the construction of the invariant actions and of the generalized $\\mathcal{N}=2$ super-Weyl tensors relies upon the \\textit{principle of Grassmann half-analyticity}. This provides not only a new geometric framework for the linearized $\\mathcal{N}=2$ superconformal gauge higher-spin theories, but also suggests possible ways of promoting them to the full nonlinear level. We consider a generalization to an arbitrary $\\mathcal{N}=2$ supergravity background and show that the linearized spin-$\\mathbf{s}$ gauge invariance, without radical modifications of the gauge transformation law and/or harmonic zero-curvature equations, is consistent only with $\\mathcal{N}=2$ Weyl-flat super-backgrounds.", "url": "https://arxiv.org/abs/2610.40274", "type": "理论", "summary": "我们为 arXiv:2404.19016 中引入的超共形高自旋规范多重态构造了调和超空间中的线性化 $4D, \\mathcal{N}=2$ Weyl 型离壳作用。这项工作是我们的 arXiv:2511.16325 的后续工作，其中对共形 $\\mathcal{N}=2$ 超重力进行了类似的构造。我们检查新动作的超共形不变性及其线性化规范不变性。作为我们公式的特征，底层预势的结构及其规范和超共形变换完全由基本的 \\textit{格拉斯曼调和解析性原理}决定，而不变作用和广义 $\\mathcal{N}=2$ 超外尔张量的构造依赖于 \\textit{格拉斯曼半解析性原理}。这不仅为线性化 $\\mathcal{N}=2$ 超共形规范高自旋理论提供了新的几何框架，而且还提出了将其提升到完全非线性水平的可能方法。\n\n我们考虑对任意 $\\mathcal{N}=2$ 超重力背景的推广，并表明线性自旋 $\\mathbf{s}$ 规范不变性，无需对规范变换定律和/或调和零曲率方程进行彻底修改，仅与 $\\mathcal{N}=2$ Weyl 平坦超背景一致。", "authors": [{"name": "Evgeny Ivanov"}, {"name": "Nikita Zaigraev"}], "featured_authors": [{"name": "Evgeny Ivanov"}, {"name": "Nikita Zaigraev"}], "author_count": 2}, {"id": "2610.40355", "category": "hep-th", "title": "Bounds on the Diagonal Degree of the Biadjoint Scalar Amplitude Matrix", "abstract": "Biadjoint scalar theory partial amplitudes, $m_n(\\alpha,\\beta)$, define an $(n-1)!/2\\times (n-1)!/2$ matrix, $M_n$, with rows and columns labeled by orderings. The CHY construction of $M_n$ implies that its rank is $(n-3)!$. Invertible submatrices of maximal rank enter in the KLT construction relating graviton amplitudes to gluon amplitudes. Motivated by finding the KLT formula with the smallest number of terms, one of the authors posed the question of whether there is a critical $n_c$ such that for all $n>n_c$ there exists a diagonal submatrix of $M_n$ of rank $(n-3)!$. In this work we obtain bounds on the size of the largest non-singular diagonal submatrix of $M_n$, which we call its diagonal degree $\\Delta_n$, and we answer the question in the negative. We prove that the diagonal degree is exponentially suppressed relative to the CHY rank: $\\Delta_n/(n-3)! = \\exp(-\\Theta (n))$ as $n\\to \\infty$. More explicitly, we establish the bounds $\\exp(-1.5n)\\leq\\Delta_n/(n-3)!\\leq \\exp \\left[ -0.01n+O(1)\\right]$.", "url": "https://arxiv.org/abs/2610.40355", "type": "理论", "summary": "双伴随标量理论部分振幅 $m_n(\\alpha,\\beta)$ 定义一个 $(n-1)!/2\\times (n-1)!/2$ 矩阵 $M_n$，行和列按顺序标记。 $M_n$ 的 CHY 结构意味着它的等级是 $(n-3)!$。最大秩的可逆子矩阵进入将引力子振幅与胶子振幅相关的 KLT 构造。出于寻找项数最少的 KLT 公式的动机，一位作者提出了是否存在临界 $n_c$ 的问题，使得对于所有 $n>n_c$ 都存在一个等级为 $(n-3)!$ 的 $M_n$ 对角子矩阵。在这项工作中，我们获得了 $M_n$ 的最大非奇异对角子矩阵的大小的界限，我们将其称为它的对角线度 $\\Delta_n$，并且我们对问题的回答是否定的。我们证明对角度相对于 CHY 等级呈指数抑制：$\\Delta_n/(n-3)！ = \\exp(-\\Theta (n))$ 为 $n\\to \\infty$。更明确地说，我们建立边界 $\\exp(-1.5n)\\leq\\Delta_n/(n-3)!\\leq \\exp \\left[ -0.01n+O(1)\\right]$。", "authors": [{"name": "Freddy Cachazo"}, {"name": "Rajbir Longia"}], "featured_authors": [{"name": "Freddy Cachazo"}, {"name": "Rajbir Longia"}], "author_count": 2}, {"id": "2610.40371", "category": "hep-th", "title": "Exact holographic superfluid at the Bogomolny point: transport, large charge, and Rényi entropies", "abstract": "The Abelian Higgs model in AdS$_5$, in the probe limit, is a standard holographic model of a strongly coupled superfluid, usually solved numerically. When the scalar mass saturates the Breitenlohner-Freedman bound and the quartic coupling takes the Bogomolny value, its condensed phase can be found in closed form on every static, uncharged AdS$_5$ background with maximally symmetric spatial sections. We prove that it is linearly stable, as is any nodeless probe-limit condensate in the standard quantization with a nonnegative quartic coupling and no superflow. On each slicing it answers a different question about the dual conformal field theory. On the planar black brane it is the superfluid at all temperatures below $T_c$: the superfluid fraction follows the Gorter-Casimir two-fluid law exactly, and the speed and the attenuation of sound are found in closed form. In global AdS$_5$ it describes a state of charge $Q$ on $\\mathbb{R}\\times S^3$, arguably the lowest-energy one, and gives its scaling dimension in closed form at all $Q$, classically in the bulk. Its excitations include towers that the superfluid effective theory does not describe; they come from an infrared fixed point of the probe sector. The hyperbolic slicing gives in closed form a homogeneous hairy phase of the black holes that compute the charged Rényi entropies of a ball. Its condensate does not vanish at the entangling surface. When sourced by operators inserted there, the phase sets in at Rényi index exactly one at zero chemical potential, as found for a neutral scalar.", "url": "https://arxiv.org/abs/2610.40371", "type": "理论", "summary": "AdS$_5$ 中的阿贝尔希格斯模型在探测极限下是强耦合超流体的标准全息模型，通常采用数值求解。当标量质量饱和 Breitenlohner-Freedman 界并且四次耦合取 Bogomolny 值时，可以在每个具有最大对称空间截面的静态、不带电 AdS$_5$ 背景上以闭合形式找到其凝聚相。我们证明它是线性稳定的，就像标准量化中具有非负四次耦合且无超流的任何无节点探针极限凝聚一样。在每次切片上，它都回答了有关双共形场论的不同问题。在平面黑膜上，它是低于 $T_c$ 的所有温度下的超流体：超流体部分完全遵循 Gorter-Casimir 二流体定律，并且声音的速度和衰减以封闭形式存在。在全局 AdS$_5$ 中，它描述了 $\\mathbb{R}\\times S^3$ 上的电荷状态 $Q$，可以说是能量最低的状态，并以封闭形式给出了其在 $Q$ 处的缩放维度，通常是批量的。\n\n它的激发包括超流体有效理论没有描述的塔；它们来自探测区的红外固定点。双曲切片以闭合形式给出了黑洞的均匀毛状相，用于计算球的带电 Rényi 熵。它的凝结物不会在纠缠表面消失。当由插入那里的操作员获取时，相在化学势为零时在 Rényi 指数处精确地设置为 1，正如中性标量所发现的那样。", "authors": [{"name": "Siqing Yu"}], "featured_authors": [{"name": "Siqing Yu"}], "author_count": 1}, {"id": "2610.40386", "category": "hep-th", "title": "Breaking of integrability in elliptic deformations of AdS3 strings with mixed flux", "abstract": "We construct elliptic deformations of the $AdS_3 \\times S^3 \\times T^4$ superstring supported by mixed NSNS and RR fluxes in type IIB supergravity and investigate their integrability. The NSNS sector includes a Wess-Zumino term, and imposing that the theory preserves 8 supersymmetries also requires the presence of a B-field coupling the deformed $AdS_3$ and $S^3$ factors. We explore integrability from two different perspectives: through the construction of a flat Lax connection and the computation of the tree-level worldsheet S-matrix. For generic elliptic parameters and NSNS flux, we find inelastic $2 \\rightarrow 2$ amplitudes, violating the elasticity required by integrability. In the integrable cases as identified by the Lax analysis, these inelastic amplitudes vanish and the tree-level S-matrix satisfies the classical Yang-Baxter equation. In particular, the addition of a Wess-Zumino term, which preserves integrability in the rational and trigonometric models, breaks integrability for elliptic deformations.", "url": "https://arxiv.org/abs/2610.40386", "type": "理论", "summary": "我们构造了 IIB 型超重力中由混合 NSNS 和 RR 通量支持的 $AdS_3 \\times S^3 \\times T^4$ 超弦的椭圆形变形，并研究了它们的可积性。 NSNS 扇区包括 Wess-Zumino 项，并且强加理论保留 8 个超对称性还需要存在耦合变形 $AdS_3$ 和 $S^3$ 因子的 B 场。我们从两个不同的角度探索可积性：通过构建平面 Lax 连接和计算树级世界表 S 矩阵。对于通用椭圆参数和 NSNS 通量，我们发现无弹性 $2 \\rightarrow 2$ 振幅，违反了可积性所需的弹性。在 Lax 分析确定的可积情况下，这些非弹性振幅消失，并且树级 S 矩阵满足经典的 Yang-Baxter 方程。特别是，添加了 Wess-Zumino 项，该项保留了有理模型和三角模型中的可积性，但却破坏了椭圆形变形的可积性。", "authors": [{"name": "Ian Le Meur"}, {"name": "Fiona K. Seibold"}], "featured_authors": [{"name": "Ian Le Meur"}, {"name": "Fiona K. Seibold"}], "author_count": 2}, {"id": "2610.40391", "category": "hep-th", "title": "Holographic duals of JT gravity at finite cutoff: the classical case", "abstract": "We formulate JT gravity with finite-cutoff boundaries and end-of-the-world branes in the first-order BF formulation. We dynamically reduce the BF model into a one-dimensional system living at the boundaries, generalizing earlier constructions. We obtain in particular a geometrical understanding of the phase space degrees of freedom associated to each of these boundaries. We leverage these results to probe bulk locality and the underlying structure of spacetime. Within our framework, we are able to derive a closed-form expression for the holographic Schwarzian description of JT gravity at finite-cutoff in phase space. The resulting degrees of freedom describe the embedding of the finite-cutoff curve in AdS$_2$. A quantization of these systems is presented in a companion paper.", "url": "https://arxiv.org/abs/2610.40391", "type": "理论", "summary": "我们在一阶 BF 公式中制定了具有有限截止边界和世界末日膜的 JT 引力。我们动态地将 BF 模型简化为位于边界的一维系统，概括了早期的构造。我们特别获得了与每个边界相关的相空间自由度的几何理解。我们利用这些结果来探测整体局域性和时空的底层结构。在我们的框架内，我们能够推导出相空间有限截止下 JT 引力的全息 Schwarzian 描述的封闭式表达式。由此产生的自由度描述了 AdS$_2$ 中有限截止曲线的嵌入。配套论文中介绍了这些系统的量化。", "authors": [{"name": "Andreas Belaey"}, {"name": "Thomas G. Mertens"}, {"name": "Lorenzo Russo"}, {"name": "Alex Tarana"}], "featured_authors": [{"name": "Andreas Belaey"}, {"name": "Thomas G. Mertens"}, {"name": "Lorenzo Russo"}, {"name": "Alex Tarana"}], "author_count": 4}, {"id": "2610.40412", "category": "hep-th", "title": "A Simplified Born Rule for Cosmological Correlators", "abstract": "Cosmological correlators are natural observables of the primordial universe and are related to wavefunction coefficients by the Born rule. For equal-time in-in correlators in flat spacetime, we prove that all double-boundary poles cancel for arbitrary graphs, including in theories with local derivative interactions. These cancellations occur before integration over spatial loop momenta and yield a $\\textit{simplified Born rule}$ in terms of what we call embedded wavefunction coefficients. The resulting expansion reveals which physical poles can occur together while keeping the interaction dependence explicit. For conformally coupled $\\operatorname{Tr}(\\phi^3)$ theory in flat spacetime, the simplified Born rule takes the form of a uniformly weighted forest-cut expansion. From its pole combinatorics, we construct what we call the $\\textit{Born polytope}$, whose canonical function reproduces the normalized correlator for arbitrary graphs after matching its facet supports to the physical energies. The same geometry also yields a stringy formula for correlators.", "url": "https://arxiv.org/abs/2610.40412", "type": "理论", "summary": "宇宙相关器是原始宇宙的自然可观测量，并通过玻恩法则与波函数系数相关。对于平坦时空中的等时内内相关器，我们证明了任意图的所有双边界极点都相互抵消，包括在具有局部导数相互作用的理论中。这些抵消发生在空间环动量积分之前，并根据我们所谓的嵌入波函数系数产生$\\textit{简化的玻恩规则}$。由此产生的扩展揭示了哪些物理极可以同时出现，同时保持交互依赖性明确。对于平坦时空中的共形耦合 $\\operatorname{Tr}(\\phi^3)$ 理论，简化的玻恩规则采用均匀加权森林砍伐展开的形式。根据其极点组合，我们构造了所谓的 $\\textit{Born polytope}$，其规范函数在将其面支持与物理能量匹配后再现任意图的归一化相关器。相同的几何形状还产生了相关器的字符串公式。", "authors": [{"name": "Fan Zhu"}], "featured_authors": [{"name": "Fan Zhu"}], "author_count": 1}, {"id": "2610.40462", "category": "hep-th", "title": "Gravity between two masses beyond Newton's law", "abstract": "Newton's law of universal gravitation describes the attraction between two masses through an inverse-distance potential. In Einstein's theory gravity gravitates: each mass reshapes the spacetime geometry through which the other acts. More than a century later, extracting the two-body interaction from this coupled geometry remains a fundamental analytical challenge. Even without motion or radiation, the static sector of the interaction harbours an infinite hierarchy of field couplings: the purest laboratory for gravitational non-linearity. Here we determine the static interaction from ninth to twelfth order in Newton's constant for arbitrary mass ratios, and derive a closed expression for the first backreaction beyond the Schwarzschild test-body limit to all orders in the gravitational coupling. We achieve both advances by formulating the problem around the stationary interaction energy. An exact one-body background resums one source's self-interaction, stationarity reduces the fields required from the other, and integrated response identities reveal cancellations across the coupled modes. Complementary expansions then resolve the complete mass dependence at finite order. Together, these results bridge the gap between an infinitesimal probe and comparable masses, exposing hidden analytical simplicity within Einstein's theory and providing essential building blocks for modelling orbital dynamics and gravitational-wave generation.", "url": "https://arxiv.org/abs/2610.40462", "type": "理论", "summary": "牛顿万有引力定律通过反距离势能描述了两个质量之间的吸引力。在爱因斯坦的引力理论中：每个质量都会重塑时空几何形状，而另一个质量则通过这个几何形状起作用。一个多世纪后，从耦合几何中提取二体相互作用仍然是一个基本的分析挑战。即使没有运动或辐射，相互作用的静态部分也包含无限层次的场耦合：最纯粹的引力非线性实验室。在这里，我们确定了任意质量比的牛顿常数中从第九到第十二阶的静态相互作用，并推导出超出史瓦西测试体极限的第一个反反应的封闭表达式，涉及引力耦合中的所有阶。我们通过围绕稳态相互作用能问题来实现这两项进展。精确的单体背景恢复了一个源的自交互作用，平稳性减少了另一个源所需的场，综合响应恒等式揭示了耦合模式之间的抵消。然后，互补展开式解决了有限阶的完整质量依赖性。\n\n总之，这些结果弥合了无穷小探测器和可比质量之间的差距，揭示了爱因斯坦理论中隐藏的分析简单性，并为轨道动力学和引力波生成建模提供了必要的构建模块。", "authors": [{"name": "Zhengwen Liu"}, {"name": "Xing-Bo Yuan"}], "featured_authors": [{"name": "Zhengwen Liu"}, {"name": "Xing-Bo Yuan"}], "author_count": 2}, {"id": "2610.40465", "category": "hep-th", "title": "Generalised $Ω$-backgrounds in twisted $N=4$ super Yang-Mills", "abstract": "We introduce rigid supergravity backgrounds for 4d $\\mathcal{N}=4$ super Yang-Mills which deform its topological twists and generalise the $\\Omega$-deformation of $\\mathcal{N}=2$ gauge theories. We derive the twisted supersymmetry variations of the $\\mathcal{N}=4$ Weyl multiplet, and the $\\mathcal{N}=4$ matter multiplet coupled to a rigid bosonic background, for each of the three inequivalent topological twists. Other, more exotic backgrounds are also discussed.", "url": "https://arxiv.org/abs/2610.40465", "type": "理论", "summary": "我们引入了 4d $\\mathcal{N}=4$ super Yang-Mills 的刚性超重力背景，使其拓扑扭曲变形并推广 $\\mathcal{N}=2$ 规范理论的 $\\Omega$ 变形。对于三个不等价的拓扑扭曲中的每一个，我们推导了 $\\mathcal{N}=4$ Weyl 多重态的扭曲超对称变体，以及 $\\mathcal{N}=4$ 物质多重态耦合到刚性玻色子背景。还讨论了其他更奇特的背景。", "authors": [{"name": "Elisa Iris Marieni"}, {"name": "Itamar Yaakov"}], "featured_authors": [{"name": "Elisa Iris Marieni"}, {"name": "Itamar Yaakov"}], "author_count": 2}, {"id": "2610.40514", "category": "hep-th", "title": "Localization in Seven-Dimensional Supergravity", "abstract": "Seven-dimensional supergravity provides holographic access to strongly coupled six-dimensional superconformal theories through its highest-dimensional supersymmetric AdS vacua. Its unique spinor-bilinear geometry and massive higher-form dynamics make systematic analysis and solution-finding distinctively challenging. Relative equivariant localization can obtain supersymmetric observables in odd dimensions from fixed-point data on an auxiliary even-dimensional filling, without an explicit solution. We extend this approach to seven dimensions in maximal Cartan-gauged supergravity with all gauge fields active. We formulate the Euclidean action and Killing-spinor equations in terms of field strengths, and construct a bilinear system adapted to the change in spinor reality conditions from symplectic-Majorana to Majorana. On the non-null gauged active spinor branch, independent, oppositely R-charged spinors are paired by Majorana conjugation on the same complex background. One algebraic gauging correction and two algebraic bilinear projections suffice to extend the equal-charge sector to independent Cartan charges, and the underlying efficient reorganization also applies in the Lorentzian theory. Massive 3-form self-duality fixes the quartic anomaly class and determines the higher-form fixed-point datum from Abelian moment maps. Localization at the single fixed point of the filling recovers the general supersymmetric AdS$_7$ black-hole action, without extending the solution. We prove gauge-covariant Killing-spinor invariance under the combined supersymmetric Killing flow and R-symmetry action, deriving the linear chemical-potential constraint. Extremizing the constrained entropy functional and requiring real positive stationary entropy yields the nonlinear charge relation within the Euclidean analysis, equivalent to Lorentzian horizon extremality for the known spherical black-hole family.", "url": "https://arxiv.org/abs/2610.40514", "type": "理论", "summary": "七维超引力通过其最高维超对称 AdS 真空提供对强耦合六维超共形理论的全息访问。其独特的旋量双线性几何结构和大规模的更高形式的动力学使得系统分析和解决方案寻找具有明显的挑战性。相对等变定位可以从辅助偶数维填充上的定点数据获得奇数维中的超对称可观测量，而无需显式解。我们将这种方法扩展到最大嘉当规范超重力下的七个维度，并且所有规范场都处于活动状态。我们根据场强制定了欧几里得作用方程和消旋旋量方程，并构建了适应从辛马约拉纳到马约拉纳的旋量现实条件变化的双线性系统。在非零规主动旋量分支上，独立的、带相反 R 电荷的旋量在相同的复杂背景上通过马约拉纳共轭配对。\n\n一个代数计量校正和两个代数双线性投影足以将等电荷扇区扩展到独立的嘉当电荷，并且潜在的有效重组也适用于洛伦兹理论。大规模三型自对偶性修复了四次异常类，并从阿贝尔矩映射中确定了更高形式的定点基准。填充的单个固定点的定位恢复了一般的超对称 AdS$_7$ 黑洞作用，而无需扩展解决方案。我们证明了超对称杀伤流和 R 对称作用组合下的规范协变杀伤旋量不变性，推导了线性化学势约束。极端化约束熵函数并需要实数正稳态熵，产生欧几里得分析中的非线性电荷关系，相当于已知球形黑洞族的洛伦兹视界极值。", "authors": [{"name": "Florian Gaar"}, {"name": "Michèle Levi"}], "featured_authors": [{"name": "Florian Gaar"}, {"name": "Michèle Levi"}], "author_count": 2}, {"id": "2610.40529", "category": "hep-th", "title": "Thermodynamics of Swirling Black Holes and Kerr-Taub-NUT", "abstract": "We establish the first law of black hole thermodynamics for the recently discovered Kerr swirling (KS) and accelerated Kerr swirling (AKS) black hole solutions. We also revisit the first law for the Kerr-Taub-NUT (KTN) spacetime. Guided by Noether's original insight that global symmetries give rise to conservation laws, we employ and adapt the surface charge method for computing the associated charges (mass and angular momentum) in the presence of spacetime string-like defects (conical singularities) along the axes of both KS and KTN black holes. We obtain finite integrated charges in a quasi-local manner, without relying on the non-flat asymptotic regions characteristic of these spacetimes. We then establish a first law without introducing independent stringy terms unrelated to symmetries. For both KS and KTN, the quantities that play the role of the black hole entropy differ from the simple geometrical rule of one-fourth of the horizon area. This mismatch arises because we keep first-law charges associated with conservation laws. It indicates that standard formulas may not be naively used for black holes with string-like defects; they have a different topology and suggest the need for a new geometrical framework. In stark contrast, for the AKS spacetime, which can be regularized outside the singularity and lacks string-like defects, we find that the charges are consistent with a first law having the usual one-fourth of the area entropy. We first determine the mass using the Christodoulou-Ruffini formula and then check its agreement with the result obtained from the surface charge method.", "url": "https://arxiv.org/abs/2610.40529", "type": "理论", "summary": "我们为最近发现的克尔旋动（KS）和加速克尔旋动（AKS）黑洞解建立了黑洞热力学第一定律。我们还重新审视了 Kerr-Taub-NUT (KTN) 时空第一定律。在诺特关于全局对称性产生守恒定律的原始见解的指导下，我们采用并调整了表面电荷方法，在 KS 和 KTN 黑洞轴上存在时空弦状缺陷（圆锥形奇点）的情况下计算相关电荷（质量和角动量）。我们以准局部方式获得有限积分电荷，而不依赖于这些时空的非平坦渐近区域特征。然后，我们建立第一定律，而不引入与对称性无关的独立弦项。对于KS和KTN来说，起到黑洞熵作用的量与四分之一视界面积的简单几何规则不同。出现这种不匹配的原因是我们保留了与守恒定律相关的第一定律指控。\n\n这表明标准公式可能不能天真地用于具有弦状缺陷的黑洞；它们具有不同的拓扑结构，表明需要新的几何框架。与此形成鲜明对比的是，对于可以在奇点之外进行正则化并且没有弦状缺陷的 AKS 时空，我们发现电荷与具有通常四分之一面积熵的第一定律一致。我们首先使用 Christodoulou-Ruffini 公式确定质量，然后检查其与表面电荷法获得的结果的一致性。", "authors": [{"name": "Ernesto Frodden"}, {"name": "Diego Hidalgo"}, {"name": "Francisco Manzano"}], "featured_authors": [{"name": "Ernesto Frodden"}, {"name": "Diego Hidalgo"}, {"name": "Francisco Manzano"}], "author_count": 3}, {"id": "2610.40615", "category": "hep-th", "title": "On Geometric Observables in Gravity", "abstract": "Measures of geometry like distance and time are staples of classical gravity. While geometric quantities arise broadly in quantum gravity, their graviton corrections are less explored. In this paper, we study geometric observables in perturbative quantum gravity. We form distance and time observables that model measurements, including in the presence of spacetime fluctuations. Gravitational dressing ensures these constructions are coordinate invariant. Then we show how these finite-distance observables become memory and Shapiro time delay operators upon taking asymptotic limits. We compute leading graviton effects in correlators of geometric observables throughout. Altogether, our results identify a class of geometric observables that link experiments and operations on the celestial sphere.", "url": "https://arxiv.org/abs/2610.40615", "type": "理论", "summary": "距离和时间等几何测量是经典引力的主要内容。虽然几何量在量子引力中广泛出现，但它们的引力子修正却很少被探索。在本文中，我们研究微扰量子引力中的几何可观测量。我们形成距离和时间可观测量来模拟测量，包括存在时空波动的情况下。重力修整确保这些结构具有坐标不变性。然后我们展示这些有限距离可观测量如何在采取渐近极限时成为记忆和夏皮罗时间延迟算子。我们自始至终计算几何可观测量相关器中的主要引力子效应。总而言之，我们的结果确定了一类将天球上的实验和操作联系起来的几何可观测值。", "authors": [{"name": "Manthos Karydas"}, {"name": "Murat Kologlu"}, {"name": "Allic Sivaramakrishnan"}], "featured_authors": [{"name": "Manthos Karydas"}, {"name": "Murat Kologlu"}, {"name": "Allic Sivaramakrishnan"}], "author_count": 3}, {"id": "2610.37820", "category": "math-ph", "title": "Exact Solution of the $(2+1)$-Dimensional Dunkl-Klein-Gordon Oscillator with a Uniform Magnetic Field in Non-Commutative Phase Space", "abstract": "We solve the Klein-Gordon oscillator in a non-commutative phase space, generalized using Dunkl derivatives, both with and without interaction with a uniform magnetic field. For each of these cases, we begin by introducing the Dunkl derivative into the standard commutative phase space to evaluate the reflection parity symmetries. Then, using the Seiberg-Witten map, we extend the generalized system to a non-commutative phase space. In both cases, we determine the eigenfunctions and the energy spectrum exactly (which correspond to generalized Landau levels when a magnetic field is present). Furthermore, we compute the non-relativistic limit of the system and graphically analyze the behavior of the energy spectra. Our results demonstrate that the combination of the Dunkl deformation parameters, the non-commutative phase space geometry, and the magnetic field produces a parity-dependent modification of the energy levels. Finally, we verify that when the external magnetic field or the non-commutative parameters vanish, our exact solutions correctly reduce to the commutative Dunkl models established in previous works.", "url": "https://arxiv.org/abs/2610.37820", "type": "理论", "summary": "我们在非交换相空间中求解 Klein-Gordon 振子，使用 Dunkl 导数进行推广，无论是否与均匀磁场相互作用。对于每种情况，我们首先将 Dunkl 导数引入标准交换相空间来评估反射宇称对称性。然后，使用 Seiberg-Witten 映射，我们将广义系统扩展到非交换相空间。在这两种情况下，我们都准确地确定了本征函数和能谱（对应于存在磁场时的广义朗道能级）。此外，我们计算系统的非相对论极限并以图形方式分析能谱的行为。我们的结果表明，Dunkl 变形参数、非交换相空间几何结构和磁场的组合会产生与奇偶校验相关的能级修改。最后，我们验证了当外部磁场或非交换参数消失时，我们的精确解可以正确地简化为先前工作中建立的交换 Dunkl 模型。", "authors": [{"name": "R. D. Mota"}, {"name": "D. Ojeda-Guillén"}], "featured_authors": [{"name": "R. D. Mota"}, {"name": "D. Ojeda-Guillén"}], "author_count": 2}, {"id": "2610.37904", "category": "math-ph", "title": "Algebraic Quantum Field Theory", "abstract": "Algebraic quantum field theory describes a quantum system through its observables, their localisation in spacetime, and the states that assign them expectation values. The separation of the specification of observables from the choice of a state makes it possible to compare vacuum, thermal and charged representations without assuming that they share a preferred Hilbert space. We develop the framework from familiar quantum mechanics, construct the free scalar field, and explain how causality and positive energy constrain local measurements. The Reeh--Schlieder theorem, the structure of local von Neumann algebras and the split property reveal key differences between quantum theory in the continuum (i.e. QFT) and ordinary quantum mechanics with finitely many degrees of freedom. Superselection theory relates observable charges to statistics and internal symmetries. Finally, local covariance and perturbative and homological methods extend the discussion to curved spacetime, interactions and gauge theories. We also discuss measurement theory and quantum information aspects of AQFT.", "url": "https://arxiv.org/abs/2610.37904", "type": "理论", "summary": "代数量子场论通过其可观测值、它们在时空中的定位以及赋予它们期望值的状态来描述量子系统。将可观测量的规范与状态的选择分开，使得可以比较真空、热和带电表示，而无需假设它们共享首选希尔伯特空间。我们从熟悉的量子力学开发框架，构造自由标量场，并解释因果关系和正能量如何限制局部测量。瑞-施利德定理、局部冯诺依曼代数的结构和分裂性质揭示了连续统量子理论（即 QFT）与具有有限多个自由度的普通量子力学之间的关键区别。超选择理论将可观察的电荷与统计和内部对称性联系起来。最后，局部协方差、微扰和同调方法将讨论扩展到弯曲时空、相互作用和规范理论。我们还讨论了 AQFT 的测量理论和量子信息方面。", "authors": [{"name": "Kasia Rejzner"}], "featured_authors": [{"name": "Kasia Rejzner"}], "author_count": 1}, {"id": "2610.38128", "category": "math-ph", "title": "From gauge-covariant Noether invariants to electromagnetic velocity-dependent mechanics", "abstract": "For a charged particle, a spacetime symmetry need preserve the electromagnetic potential only up to a gauge transformation. Starting from the standard Noether--Bessel-Hagen construction, we make explicit the reduction from the relativistic gauge-invariant worldline charge to the generalized constants of nonrelativistic velocity-dependent mechanics, retaining the quasi-invariance boundary term throughout. With the convention $S_p=-mc\\int ds+q\\int A$, the canonical worldline one-form is $P=-m u^\\flat+qA$, and a Killing vector satisfying $\\mathcal L_XA=d\\chi_X$ generates $C_X=P(X)-q\\chi_X$. Its low-velocity limit is the Noether--Bessel-Hagen charge of the coordinate-time Lagrangian, from which generalized linear momentum, angular momentum and energy follow generator by generator. A uniform magnetic field gives an elementary gauge-dependent representative but gauge-invariant translational charge. The Darwin interaction then supplies the conservative $O(c^{-2})$ many-particle realization after field elimination, while a closed particle--field system is governed by the total stress-energy Killing charge. The result is an explicit reduction map linking three established descriptions without identifying their distinct conserved quantities.", "url": "https://arxiv.org/abs/2610.38128", "type": "理论", "summary": "对于带电粒子，时空对称性只需要在规范变换之前保留电磁势。从标准的诺特-贝塞尔-哈根结构开始，我们明确地将相对论规范不变的世界线电荷还原为非相对论速度相关力学的广义常数，并始终保留准不变边界项。根据约定 $S_p=-mc\\int ds+q\\int A$，规范的世界线单一形式为 $P=-m u^\\flat+qA$，满足 $\\mathcal L_XA=d\\chi_X$ 的杀伤向量生成 $C_X=P(X)-q\\chi_X$。其低速极限是坐标时间拉格朗日的Noether--Bessel-Hagen电荷，广义线动量、角动量和能量逐个跟随发生器。均匀磁场给出了基本的依赖于规范但规范不变的平移电荷。然后，达尔文相互作用在场消除后提供保守的 $O(c^{-2})$ 多粒子实现，而封闭的粒子场系统则由总应力能量杀伤电荷控制。\n\n结果是一个明确的简化图，将三个已建立的描述联系起来，但没有识别它们不同的守恒量。", "authors": [{"name": "A. S. de Castro"}], "featured_authors": [{"name": "A. S. de Castro"}], "author_count": 1}, {"id": "2610.38150", "category": "math-ph", "title": "Homogenization theory of topological Anderson insulators: genuine gaps and pseudo-gaps", "abstract": "A topological Anderson insulator is an insulator whose non-trivial topological phase is induced by disorder. We develop a homogenization theory of this phenomenon for constant-coefficient elliptic systems perturbed by fluctuations oscillating at scale $\\varepsilon$. Periodic fluctuations of every order below that of the operator, with appropriate amplitudes, do not average out: they produce an order-one correction $M$ given by a second-order (Born) formula, and the operator converges in the norm-resolvent sense to its homogenized limit. In particular, electric potentials and magnetic fields of zero mean, usually regarded as topologically trivial perturbations, generate corrections $M$ that change the topological phase. Fluctuations confined to a half-plane create an interface that carries the bulk-difference invariant of the homogenized operator for all $\\varepsilon$ sufficiently small, a property that is stable under local defects. For random fluctuations, rare regions typically fill the homogenized gap, which becomes a pseudo-gap, and the standard interface index need no longer be defined. We define an index along cuts deformed so as to avoid the rare regions, and prove that it equals almost surely the bulk-difference invariant of the operator homogenized in the Born approximation, for first-order alloys with vanishing low moments and for a class of second-order systems with scalar disorder at criticality that includes the BHZ model.", "url": "https://arxiv.org/abs/2610.38150", "type": "理论", "summary": "拓扑安德森绝缘体是其非平凡拓扑相由无序引起的绝缘体。我们针对受 $\\varepsilon$ 尺度波动扰动的常系数椭圆系统开发了这种现象的均质化理论。低于算子的每个阶的周期性波动，具有适当的幅度，不会平均：它们产生由二阶（玻恩）公式给出的一阶修正 $M$，并且算子在范数分辨意义上收敛到其均质化极限。特别是，零均值的电势和磁场通常被视为拓扑微扰，会产生改变拓扑相位的校正 $M$。仅限于半平面的涨落创建了一个界面，该界面对于所有足够小的 $\\varepsilon$ 都具有均质算子的体积差异不变量，该属性在局部缺陷下是稳定的。对于随机波动，稀有区域通常会填充均质间隙，这成为伪间隙，并且不再需要定义标准界面索引。\n\n我们定义了沿切口变形的指数，以避免罕见区域，并证明对于具有消失低矩的一阶合金和一类在临界点具有标量无序的二阶系统（包括 BHZ 模型），它几乎肯定等于在 Born 近似中均匀化的算子的体积差异不变量。", "authors": [{"name": "Guillaume Bal"}], "featured_authors": [{"name": "Guillaume Bal"}], "author_count": 1}, {"id": "2610.38166", "category": "math-ph", "title": "Nonequilibrium Thermodynamics of Semilinear Stochastic Partial Differential Equations", "abstract": "We develop a rigorous mathematical framework for the nonequilibrium thermodynamics of semilinear stochastic partial differential equations. The invariant Gaussian measure of the associated Ornstein-Uhlenbeck process, which need not be time-reversible, serves as the reference measure. We define thermodynamic quantities in terms of probability densities and derive the entropy balance equation. We obtain explicit expressions for the entropy production rate and prove that its vanishing in the stationary state is equivalent to time reversibility. Sample-path entropy production is identified with the logarithm of the Radon-Nikodym derivative of the forward path measure with respect to the time-reversed path measure and is shown to satisfy fluctuation theorems. For nonstationary systems, sample-path entropy production decomposes into housekeeping heat and free-energy dissipation, each satisfying an integral fluctuation theorem. Both have nonnegative expectations, and the mean free-energy dissipation equals the decrease in relative entropy with respect to the stationary distribution. The theory is applied to semilinear stochastic heat equations with spatially correlated noise, a random polymer model, a nonlinear model with a divergence-free drift, and two coupled stochastic heat equations in contact with heat baths at different temperatures.", "url": "https://arxiv.org/abs/2610.38166", "type": "理论", "summary": "我们为半线性随机偏微分方程的非平衡热力学开发了严格的数学框架。相关 Ornstein-Uhlenbeck 过程的不变高斯测度不需要时间可逆，可用作参考测度。我们根据概率密度定义热力学量并推导熵平衡方程。我们得到了熵产生率的显式表达式，并证明了其在稳态下的消失等效于时间可逆性。样本路径熵产生由正向路径测量相对于时间反转路径测量的 Radon-Nikodym 导数的对数来确定，并且被证明满足波动定理。对于非平稳系统，样本路径熵产生分解为内务热和自由能耗散，每个都满足积分涨落定理。两者都有非负期望，平均自由能耗散等于相对于平稳分布的相对熵的减少。\n\n该理论应用于具有空间相关噪声的半线性随机热方程、随机聚合物模型、具有无散度漂移的非线性模型以及与不同温度下的热浴接触的两个耦合随机热方程。", "authors": [{"name": "Zelin Liu"}, {"name": "Hao Ge"}], "featured_authors": [{"name": "Zelin Liu"}, {"name": "Hao Ge"}], "author_count": 2}, {"id": "2610.38464", "category": "math-ph", "title": "Finite-volume and thermodynamic-limit lower bounds for the coherently driven Bose--Hubbard model via the Lieb--Yamazaki method", "abstract": "We derive rigorous lower bounds on the ground-state energy of the coherently driven Bose--Hubbard model using a Lieb--Yamazaki positive-operator decomposition. The resulting quadratic bounding Hamiltonian is diagonalized by displacement and Bogoliubov transformations, yielding explicit stability conditions and finite-volume bounds in arbitrary dimension. We establish the thermodynamic-limit energy density and characterize the excitation spectrum of the bounding Hamiltonian. We also derive its Gaussian-state observables, including filling, number fluctuations, and second-order correlations, and identify regimes of antibunching and sub-Poissonian statistics. Numerical calculations assess the tightness of the bounds across representative parameter regimes.", "url": "https://arxiv.org/abs/2610.38464", "type": "理论", "summary": "我们使用 Lieb-Yamazaki 正算子分解推导出相干驱动 Bose-Hubbard 模型的基态能量的严格下界。由此产生的二次边界哈密顿量通过位移和 Bogoliubov 变换进行对角化，产生任意维度的显式稳定性条件和有限体积边界。我们建立了热力学极限能量密度并表征了边界哈密顿量的激发谱。我们还推导了其高斯态可观测量，包括填充、数字波动和二阶相关性，并确定了反聚束和亚泊松统计的机制。数值计算评估代表性参数范围的界限的紧密程度。", "authors": [{"name": "Maciej Janowicz"}, {"name": "Joanna Kaleta"}, {"name": "Filip Krzyżewski"}, {"name": "Andrzej Zembrzuski"}], "featured_authors": [{"name": "Maciej Janowicz"}, {"name": "Joanna Kaleta"}, {"name": "Filip Krzyżewski"}, {"name": "Andrzej Zembrzuski"}], "author_count": 4}, {"id": "2610.38717", "category": "math-ph", "title": "A Primer on Instanton Physics - A Short Course", "abstract": "These six lectures, delivered at the University of New Brunswick 6-21 October 2026, are an introduction to instantons in quantum mechanics and quantum field theory for senior undergraduate and beginning graduate students. The first four lectures deal solely with particle mechanics, building the necessary background for the last two that cover applications in semi-classical field theory.", "url": "https://arxiv.org/abs/2610.38717", "type": "理论", "summary": "这六场讲座于 2026 年 10 月 6 日至 21 日在新不伦瑞克大学举行，为高年级本科生和研究生介绍量子力学和量子场论中的瞬子。前四场讲座仅涉及粒子力学，为后两场涵盖半经典场论的应用奠定了必要的背景。", "authors": [{"name": "Pervez Hoodbhoy"}], "featured_authors": [{"name": "Pervez Hoodbhoy"}], "author_count": 1}, {"id": "2610.38821", "category": "math-ph", "title": "From Entanglement Bootstrap to DHR Theory", "abstract": "We establish a direct connection between the entanglement bootstrap and the Doplicher--Haag--Roberts theory of superselection sectors for two-dimensional quantum spin systems. Under the entanglement-bootstrap assumptions, we prove Haag duality and establish a one-to-one correspondence between simple entanglement-bootstrap anyon types and irreducible superselection sectors. For each fusion channel, we further construct an affine bijection from density matrices on the entanglement-bootstrap fusion space to normalized positive intertwiners in the corresponding operator-algebraic fusion channel. These results connect the entropic and operator-algebraic descriptions of anyons directly, without passing through exactly solvable lattice models.", "url": "https://arxiv.org/abs/2610.38821", "type": "理论", "summary": "我们在二维量子自旋系统的纠缠引导和超选择扇区的多普利赫-哈格-罗伯茨理论之间建立了直接联系。在纠缠自举假设下，我们证明了哈格对偶性，并在简单纠缠自举任意子类型和不可约超选择扇区之间建立了一一对应关系。对于每个融合通道，我们进一步构造从纠缠自举融合空间上的密度矩阵到相应算子代数融合通道中的归一化正交织子的仿射双射。这些结果直接连接了任意子的熵和算子代数描述，而无需通过精确可解的晶格模型。", "authors": [{"name": "Kohtaro Kato"}, {"name": "Yoshiko Ogata"}], "featured_authors": [{"name": "Kohtaro Kato"}, {"name": "Yoshiko Ogata"}], "author_count": 2}, {"id": "2610.38845", "category": "math-ph", "title": "The geometry of Floquet states", "abstract": "This paper studies the moduli space of \"good\" periodic Hamiltonians, i.e., periodic Hamiltonians with nondegenerate Floquet spectrum. The corresponding Floquet states determine a geometric model for the moduli space of such Hamiltonians. The model is expressed in terms of configuration spaces, flag manifolds, and principal bundles. A corollary of the main result is the complete determination of the rational cohomology ring of the space of good periodic Hamiltonians. The paper also considers the adiabatic driving of a 1-parameter family of good periodic Hamiltonians. We formulate two conjectures describing the resulting asymptotic quantum evolution. These are Floquet analogues of the adiabatic theorem in quantum mechanics.", "url": "https://arxiv.org/abs/2610.38845", "type": "理论", "summary": "本文研究“好”周期哈密顿量的模空间，即具有非简并弗洛奎特谱的周期哈密顿量。相应的 Floquet 状态确定了此类哈密顿量的模空间的几何模型。该模型用配置空间、标志流形和主丛来表示。主要结果的推论是良好周期哈密顿量空间的有理上同调环的完全确定。该论文还考虑了良好周期性哈密顿量的 1 参数族的绝热驱动。我们提出两个猜想来描述由此产生的渐近量子演化。这些是量子力学中绝热定理的 Floquet 类似物。", "authors": [{"name": "Vladimir Y. Cherynak"}, {"name": "John R. Klein"}], "featured_authors": [{"name": "Vladimir Y. Cherynak"}, {"name": "John R. Klein"}], "author_count": 2}, {"id": "2610.38961", "category": "math-ph", "title": "A First-Order Phase Transition in Spin-Imbalanced BCS Theory of Superconductivity", "abstract": "We study a translation-invariant BCS functional of superconductivity for a system of spin-$1/2$ fermions with spin-dependent chemical potentials, $\\mu_+\\neq\\mu_-$. Numerical work of Caldas and Mota and analytical work of Freiji, Hainzl, and Seiringer has suggested an unusual first-order phase transition in spin-imbalanced BCS models, in which the normal state becomes globally unstable while remaining locally stable. Here, we prove that a first-order phase transition occurs in such spin-imbalanced BCS functionals. For each sufficiently small fixed spin imbalance and sufficiently low temperature, there is a coexistence coupling $\\lambda_{\\mathrm{fo}}$ strictly below the linear-stability threshold $\\lambda_{\\mathrm{lin}}$ of the normal state at which the Cooper pair density exhibits a nonzero jump and the minimized energy has a kink. The methodological insight is a coercivity estimate obtained by decomposing the BCS energy minimization into two parts, where the ``inner'' problem minimizes over the one-particle density matrices at fixed pairing and can be exactly solved by a Legendre--Fenchel transform.", "url": "https://arxiv.org/abs/2610.38961", "type": "理论", "summary": "我们研究了具有自旋相关化学势 $\\mu_+\\neq\\mu_-$ 的自旋 $1/2$ 费米子系统的超导平移不变 BCS 泛函。 Caldas 和 Mota 的数值工作以及 Freiji、Hainzl 和 Seiringer 的分析工作表明，自旋不平衡 BCS 模型中存在不寻常的一阶相变，其中正常状态变得全局不稳定，同时保持局部稳定。在这里，我们证明在这种自旋不平衡的 BCS 泛函中会发生一阶相变。对于每个足够小的固定自旋不平衡和足够低的温度，存在严格低于正常状态的线性稳定性阈值 $\\lambda_{\\mathrm{lin}}$ 的共存耦合 $\\lambda_{\\mathrm{fo}}$，在该阈值下库珀对密度表现出非零跳跃并且最小化能量具有扭结。方法论见解是通过将 BCS 能量最小化分解为两部分而获得的矫顽力估计，其中“内部”问题在固定配对的单粒子密度矩阵上最小化，并且可以通过勒让德-芬切尔变换精确解决。", "authors": [{"name": "Marius Lemm"}, {"name": "Barbara Roos"}], "featured_authors": [{"name": "Marius Lemm"}, {"name": "Barbara Roos"}], "author_count": 2}, {"id": "2610.39107", "category": "math-ph", "title": "Minimally-coupled Quasilinear Symmetric Hyperbolic Systems, Naturally", "abstract": "We consider symmetric hyperbolicity and well-posedness in the context of natural equations, which are closed subobjects of jet bundles over natural bundles. We show how non-natural equations can be \"naturalized\", and we discuss how a precise version of \"minimal coupling\" offers a (provably unique, up to isomorphism) method for constructing natural equations from certain equations defined on a single manifold. We discuss how to define symmetrizers, hyperbolizations, and constraints for minimally coupled natural equations, and we show how these can be used to recover standard existence and uniqueness results, relative to any choice of background structure (a metric, for minimally coupled systems). Additionally, we show that minimal coupling and naturality together imply that the causal cones associated with a (first order, quasilinear, minimally coupled) naturally symmetric hyperbolic natural equation must always coincide with the metric lightcones, and that a certain rank-2 tensor, associates with a natural hyperbolization, must always be divergence free relative to the associated Levi-Civita derivative operator.", "url": "https://arxiv.org/abs/2610.39107", "type": "理论", "summary": "我们在自然方程的背景下考虑对称双曲性和适定性，自然方程是射流束在自然束上的闭合子对象。我们展示了如何“自然化”非自然方程，并讨论了“最小耦合”的精确版本如何提供一种（可证明唯一的，直至同构）方法，用于从单个流形上定义的某些方程构造自然方程。我们讨论如何定义最小耦合自然方程的对称化器、双曲线化和约束，并展示如何使用这些来恢复相对于背景结构（最小耦合系统的度量）的任何选择的标准存在性和唯一性结果。此外，我们表明最小耦合和自然性一起意味着与（一阶、拟线性、最小耦合）自然对称双曲自然方程相关的因果锥必须始终与度量光锥一致，并且与自然双曲线化相关的某个 2 阶张量相对于相关联的 Levi-Civita 导数算子必须始终是无散度的。", "authors": [{"name": "Eleanor March"}, {"name": "James Owen Weatherall"}], "featured_authors": [{"name": "Eleanor March"}, {"name": "James Owen Weatherall"}], "author_count": 2}, {"id": "2610.39382", "category": "math-ph", "title": "Higher genus polylogarithms associated with the D'Hoker-Hidding-Schlotterer connection", "abstract": "We study higher genus polylogarithms associated with the D'Hoker-Hidding-Schlotterer (DHS) connection defined on families of Riemann surfaces of any genus with marked points. Under separating degenerations of Riemann surfaces, we show that the DHS connection can be constructed by gluing the Brown-Levin (BL) connections on elliptic curves and the Knizhnik-Zamolodchikov (KZ) connections on pointed Riemann spheres. Therefore, the associated higher genus polylogarithms can be described explicitly as power series in deformation parameters and their logarithms for the families of Riemann surfaces whose coefficients are expressed by multiple zeta values and elliptic multiple zeta values.", "url": "https://arxiv.org/abs/2610.39382", "type": "理论", "summary": "我们研究与在具有标记点的任何属的黎曼曲面族上定义的 D'Hoker-Hidding-Schlotterer (DHS) 连接相关的更高属多对数。在黎曼曲面的分离退化下，我们表明可以通过将椭圆曲线上的 Brown-Levin (BL) 连接和尖黎曼球上的 Knizhnik-Zamolodchikov (KZ) 连接粘合来构建 DHS 连接。因此，相关的高属多对数可以明确地描述为黎曼曲面族的变形参数及其对数的幂级数，其系数由多重zeta值和椭圆多重zeta值表示。", "authors": [{"name": "Takashi Ichikawa"}], "featured_authors": [{"name": "Takashi Ichikawa"}], "author_count": 1}, {"id": "2610.39411", "category": "math-ph", "title": "Generalized Frobenius Structures on Hurwitz Spaces, Their Open Extensions and Associated Principal Hierarchies", "abstract": "We construct generalized Frobenius structures on Hurwitz spaces of arbitrary genus using extended primary differentials. Through contour integrals involving the Cauchy kernel, we derive explicit dispersionless Lax representations for the principal hierarchies of these structures and their almost-dual counterparts. We also construct solutions to the open WDVV equations for both the original and almost-dual structures, and derive explicit principal hierarchies for the resulting rank-one extensions. Finally, we show that these constructions admit Shramchenko deformations.", "url": "https://arxiv.org/abs/2610.39411", "type": "理论", "summary": "我们使用扩展一阶微分在任意属的 Hurwitz 空间上构造广义 Frobenius 结构。通过涉及柯西核的轮廓积分，我们导出了这些结构及其几乎对偶对应物的主要层次结构的显式无色散 Lax 表示。我们还为原始结构和近对偶结构构造了开放式 WDVV 方程的解，并为所得的一级扩展推导出显式的主层次结构。最后，我们证明这些结构允许 Shramchenko 变形。", "authors": [{"name": "Shilin Ma"}], "featured_authors": [{"name": "Shilin Ma"}], "author_count": 1}, {"id": "2610.39448", "category": "math-ph", "title": "Arithmetic localization for quasiperiodic long-range operators with monotone potentials", "abstract": "We study one-dimensional quasiperiodic operators with $\\alpha$-Hölder monotone potentials and long-range hopping satisfying $|T(x,y)|\\leq \\varepsilon e^{-\\rho |x-y|}$. Under an explicit smallness condition on $\\varepsilon$, we establish uniform Anderson localization for such operators in the regime $\\rho>\\alpha\\beta $, where $\\beta$ is the exponential strength of frequency resonances. Our proof extends the arithmetic localization strategy for monotone quasiperiodic Schrödinger operators by Jitomirskaya and Kachkovskiy to the long-range setting, without relying on the Lyapunov exponent.", "url": "https://arxiv.org/abs/2610.39448", "type": "理论", "summary": "我们研究具有 $\\alpha$-Hölder 单调势和满足 $|T(x,y)|\\leq \\varepsilon e^{-\\rho |x-y|}$ 的长程跳跃的一维准周期算子。在 $\\varepsilon$ 上的显式小条件下，我们在 $\\rho>\\alpha\\beta $ 范围内为此类算子建立统一的安德森定位，其中 $\\beta$ 是频率共振的指数强度。我们的证明将 Jitomirskaya 和 Kachkovskiy 的单调准周期薛定谔算子的算术定位策略扩展到长程设置，而不依赖于 Lyapunov 指数。", "authors": [{"name": "Hongyi Cao"}], "featured_authors": [{"name": "Hongyi Cao"}], "author_count": 1}, {"id": "2610.39786", "category": "math-ph", "title": "A Combinatorial Formula and a Hilbert Scheme Realization of a Rank-One Virasoro Irregular Conformal Block", "abstract": "For general central charge, we give a combinatorial formula and a geometric realization of the formal expansion of the rank-one Virasoro irregular conformal block of type $(0,0,1)$ at its irregular singular point. We realize the normalized block as a coefficientwise matrix element on the localized equivariant Hilbert--Fock space associated with Hilbert schemes of points on $\\mathbb C^2$. At $c=1$, we prove the author's conjecture and express the parameter-independent coefficients in terms of skew-tableau numbers and Littlewood--Richardson coefficients, establishing their nonnegativity and integrality. The proof combines sectorial asymptotics of screening integrals with Laguerre--Jack evaluations. We express the screening kernel using the flow of a degree-raising differential operator and compute the Jack coefficients of its exponential from the one-box Pieri rule and the shifted Jack coefficient formula of Okounkov and Olshanski.", "url": "https://arxiv.org/abs/2610.39786", "type": "理论", "summary": "对于一般中心电荷，我们给出$(0,0,1)$类型的一阶Virasoro不规则共形块在其不规则奇点处的形式展开的组合公式和几何实现。我们将归一化块实现为局部等变 Hilbert--Fock 空间上的系数矩阵元素，该空间与 $\\mathbb C^2$ 上的点的希尔伯特方案相关联。在 $c=1$ 时，我们证明了作者的猜想，并用 skew-tableau 数和 Littlewood-Richardson 系数表达了参数无关系数，建立了它们的非负性和完整性。该证明将筛选积分的扇形渐近学与 Laguerre-Jack 评估相结合。我们使用升次微分算子流来表达筛选核，并根据一盒Pieri规则和Okounkov和Olshanski的移位Jack系数公式计算其指数的Jack系数。", "authors": [{"name": "Hajime Nagoya"}], "featured_authors": [{"name": "Hajime Nagoya"}], "author_count": 1}, {"id": "2610.39806", "category": "math-ph", "title": "An Egorov-type Theorem for Analytic Wick Observables in Quantum Field Theory", "abstract": "We provide an exact Egorov-type formula, given by a convergent expansion in the semi-classical parameter $\\varepsilon > 0$, for the propagation of a certain class of analytic Wick observables with super-exponentially decaying coefficients, under the action of a time-dependent quadratic Hamiltonian. This work generalizes a result established by S. Breteaux for polynomial symbols, and includes the spatially cutoff $P(\\varphi)_2$ model, as well as a variant of the Höegh-Krohn model.", "url": "https://arxiv.org/abs/2610.39806", "type": "理论", "summary": "我们提供了一个精确的 Egorov 型公式，由半经典参数 $\\varepsilon > 0$ 的收敛展开给出，用于在依赖时间的二次哈密顿量的作用下，具有超指数衰减系数的某类解析 Wick 可观测量的传播。这项工作概括了 S. Breteaux 为多项式符号建立的结果，并包括空间截止 $P(\\varphi)_2$ 模型以及 Höegh-Krohn 模型的变体。", "authors": [{"name": "Julien Malartre"}], "featured_authors": [{"name": "Julien Malartre"}], "author_count": 1}, {"id": "2610.39888", "category": "math-ph", "title": "Three-dimensional stress-gradient non-locality problem: Displacement field for an arbitrary and a conservative force", "abstract": "In order to obtain the displacement field, both generally in the case of an arbitrary body force and specifically in the case of a conservative body force, the mechanical problem of statics of three-dimensional stress-gradient non-local medium is analytically solved on unbounded domain by considering a
