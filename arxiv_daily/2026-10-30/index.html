\\mathrm{max}}$ provides such a dynamical signature. Using molecular dynamics simulations across diverse model glass-forming liquids in two and three dimensions, we show that $\\lambda_{\\mathrm{max}}$ follows an approximate scaling $\\lambda_{\\mathrm{max}} \\propto (T-T_{\\lambda})^{1/2}$ and extrapolates to zero at a temperature $T_{\\lambda}$ consistent with the Kauzmann temperature $T_{\\mathrm{K}}$. Furthermore, we establish the quantitative relation $\\lambda_{\\mathrm{max}}^2 \\propto T S_c$, directly linking chaotic dynamics to configurational entropy. By demonstrating that $\\lambda_{\\mathrm{max}}^2 \\propto \\sigma_K^2$, where $\\sigma_K^2$ is the variance of local potential energy landscape curvature fluctuations, we connect the suppression of chaos directly to landscape geometry. These results provide a unified thermodynamic, dynamical, and geometric framework for glass formation, identifying the ideal glass transition as the endpoint of chaotic exploration of the energy landscape.", "url": "https://arxiv.org/abs/2610.39098", "type": "理论+数值", "summary": "理想的玻璃化转变通常与构型熵 $S_c$ 的外推消失有关，但这种热力学标准如何反映在微观动力学中仍不清楚。在这里，我们证明由最大李雅普诺夫指数 $\\lambda_{\\mathrm{max}}$ 量化的确定性混沌的消失提供了这样的动态签名。使用二维和三维不同模型玻璃形成液体的分子动力学模拟，我们表明 $\\lambda_{\\mathrm{max}}$ 遵循近似缩放 $\\lambda_{\\mathrm{max}} \\propto (T-T_{\\lambda})^{1/2}$ 并在与考兹曼温度 $T_{\\mathrm{K}}$ 一致的温度 $T_{\\lambda}$ 下外推到零。此外，我们建立了定量关系 $\\lambda_{\\mathrm{max}}^2 \\propto T S_c$，直接将混沌动力学与构型熵联系起来。通过证明 $\\lambda_{\\mathrm{max}}^2 \\propto \\sigma_K^2$（其中 $\\sigma_K^2$ 是局部势能景观曲率波动的方差），我们将混沌的抑制直接与景观几何联系起来。\n\n这些结果为玻璃形成提供了统一的热力学、动力学和几何框架，将理想的玻璃化转变确定为能源景观混沌探索的终点。", "authors": [{"name": "Zi-Long Wang"}, {"name": "Jack F. Douglas"}, {"name": "Matteo Baggioli"}, {"name": "Zhao-Yan Sun"}, {"name": "Wen-Sheng Xu"}], "featured_authors": [{"name": "Zi-Long Wang"}, {"name": "Jack F. Douglas"}, {"name": "Matteo Baggioli"}, {"name": "Zhao-Yan Sun"}, {"name": "Wen-Sheng Xu"}], "author_count": 5}, {"id": "2610.39121", "category": "cond-mat", "title": "Two faces of symmetry match in gear-like coupled rotary motors", "abstract": "Rotary molecular motors commonly couple components with different rotational symmetries, but how this gearing controls energy transduction remains unclear. Here we show that symmetry can produce a fundamental tradeoff in coupled stochastic barrierless rotary motors: the gear ratio that maximizes output power under tight coupling is also the ratio that requires the strongest coupling to remain locked. Consequently, weakening the coupling can invert the effect of gearing, transforming a power maximum into a local minimum. At strong driving, both the power-optimal and most slip-susceptible ratios approach symmetry match. Numerical solutions of the Fokker-Planck dynamics for rotors with finite energy barriers reproduce these predictions and reveal how the behavior changes when driving strength is fixed per rotation or per subunit. Motivated by the bacterial flagellar motor, these results identify coupling strength as a key determinant of whether matched rotational symmetries enhance or suppress energy transduction, providing a general design principle for coupled molecular motors.", "url": "https://arxiv.org/abs/2610.39121", "type": "理论+数值", "summary": "旋转分子马达通常耦合具有不同旋转对称性的部件，但这种传动装置如何控制能量转换仍不清楚。在这里，我们证明对称性可以在耦合随机无障碍旋转电机中产生基本权衡：在紧密耦合下最大化输出功率的齿轮比也是需要最强耦合保持锁定的齿轮比。因此，削弱耦合可以反转齿轮的效果，将功率最大值转变为局部最小值。在强力驾驶时，功率最佳比率和最容易打滑的比率都接近对称匹配。具有有限能垒的转子的福克-普朗克动力学数值解再现了这些预测，并揭示了当每次旋转或每个子单元的驱动强度固定时行为如何变化。在细菌鞭毛马达的推动下，这些结果将耦合强度确定为匹配旋转对称性是否增强或抑制能量传导的关键决定因素，为耦合分子马达提供了通用设计原理。", "authors": [{"name": "Sara Iranbakhsh"}, {"name": "David A. Sivak"}], "featured_authors": [{"name": "Sara Iranbakhsh"}, {"name": "David A. Sivak"}], "author_count": 2}, {"id": "2610.39141", "category": "cond-mat", "title": "The Constructive Cavity Method for the Ising Perceptron", "abstract": "We apply the Constructive Cavity Method (CCM) to the Ising perceptron. The process starts from positive soft channels admitting an auxiliary representation $$ U(x)=\\int_{\\mathbb{R}} e^{tx}\\rho(\\mathrm{d}t),\\qquad \\rho\\ge0, $$ with an auxiliary measure having a finite exponential quadratic moment. This rewrites the perceptron as a dense, bipartite Gaussian model with an Ising layer and a continuous auxiliary layer. The CCM blanket geometry then gives two constructive variance profiles, $Q_\\ell$ on the Ising side and $\\Gamma_\\ell$ on the auxiliary side. The bipartite shell scale is $$ Q_{\\ell+1}\\Gamma_{\\ell+1}-Q_\\ell\\Gamma_\\ell, $$ and Gaussian core comparison removes the core contribution $\\Delta Q_\\ell\\Delta\\Gamma_\\ell$ under blanket refinement. The scalar cavity functional has three terms, $$ \\mathcal{A}_{\\mathrm{perc}}(\\nu)=\\mathbb{E}\\left[\\log\\langle2\\cosh x\\rangle_\\nu+\\alpha\\log\\langle U(s)\\rangle_\\nu-\\log\\langle e^y\\rangle_\\nu\\right], $$ where $x$ is the new-spin field, $s$ is the new-constraint field, and $y$ is the cavity correction. CCM identifies the constructive cavity variables with the Aizenman--Sims--Starr random overlap structure (ROSt) variables. Parisi's recursive averaging then gives $$ \\mathcal{G}_{\\mathrm{perc}}^{\\mathrm{CCM}}(\\zeta,Q,\\Gamma)=X_0(0)+\\alpha Y_0(0)-\\frac{1}{2}\\sum_{\\ell=0}^{R}\\zeta_\\ell\\left(Q_{\\ell+1}\\Gamma_{\\ell+1}-Q_\\ell\\Gamma_\\ell\\right). $$ The replica-symmetric specialization gives Gardner's formula for the generalized Ising perceptron. Specializing the constraint terminal to the hard channel gives the Krauth--Mézard functional for the binary perceptron.", "url": "https://arxiv.org/abs/2610.39141", "type": "理论", "summary": "我们将构造空腔法（CCM）应用于伊辛感知器。该过程从正软通道开始，接纳辅助表示 $$ U(x)=\\int_{\\mathbb{R}} e^{tx}\\rho(\\mathrm{d}t),\\qquad \\rho\\ge0, $$ 以及具有有限指数二次矩的辅助测度。这将感知器重写为具有 Ising 层和连续辅助层的密集二分高斯模型。然后，CCM 毯几何结构给出两个建设性方差分布，伊辛侧的 $Q_\\ell$ 和辅助侧的 $\\Gamma_\\ell$。二分壳尺度为$$ Q_{\\ell+1}\\Gamma_{\\ell+1}-Q_\\ell\\Gamma_\\ell，$$和高斯核心比较删除了毯子细化下的核心贡献$\\Delta Q_\\ell\\Delta\\Gamma_\\ell$。标量腔泛函有三项，$$ \\mathcal{A}_{\\mathrm{perc}}(\\nu)=\\mathbb{E}\\left[\\log\\langle2\\cosh x\\rangle_\\nu+\\alpha\\log\\langle U(s)\\rangle_\\nu-\\log\\langle e^y\\rangle_\\nu\\right]，$$，其中$x$是新的自旋场，$s$是new-constraint 字段，$y$ 是空腔校正。 CCM 使用 Aizenman--Sims--Starr 随机重叠结构 (ROSt) 变量识别构造性空腔变量。\n\nParisi 的递归平均得到 $$ \\mathcal{G}_{\\mathrm{perc}}^{\\mathrm{CCM}}(\\zeta,Q,\\Gamma)=X_0(0)+\\alpha Y_0(0)-\\frac{1}{2}\\sum_{\\ell=0}^{R}\\zeta_\\ell\\left(Q_{\\ell+1}\\Gamma_{\\ell+1}-Q_\\ell\\Gamma_\\ell\\right)。 $$ 复制对称特化给出了广义伊辛感知器的加德纳公式。将约束终端专门化为硬通道为二元感知器提供了 Krauth--Mézard 泛函。", "authors": [{"name": "Simone Franchini"}, {"name": "Francesco Concetti"}, {"name": "Giampiero Bardella"}], "featured_authors": [{"name": "Simone Franchini"}, {"name": "Francesco Concetti"}, {"name": "Giampiero Bardella"}], "author_count": 3}, {"id": "2610.39150", "category": "cond-mat", "title": "Atomic Charge Chirality from Electric Multipoles", "abstract": "We establish an electric-multipole ($Q_{lm}$) criterion for chirality of local atomic charge distributions. For the 11 crystallographic chiral point groups, we identify representative lowest-rank multipole contents required to distinguish the opposite handednesses. For the axial groups $C_n$ and $D_n$ with $n=2,3,4,6$, chirality arises from the relative orientation of two azimuthal anisotropies with $m=n$, belonging to consecutive ranks $l=n$ and $n+1$. Their coexistence produces a latitude-dependent twist of the $n$-fold charge distribution. The polar component, although allowed in $C_n$, is distinct from this chiral mechanism and is not required for handedness. The cubic groups $T$ and $O$ exhibit distinct realizations, with octahedral chirality first appearing at rank nine. We further show that, within a spinless $s$-$p$-$d$-$f$ atomic basis, the scalar charge density contains multipoles only up to rank six and therefore cannot encode the handedness of $C_6$, $D_6$, or $O$. These results connect electric-multipole content and atomic orbital degrees of freedom to the microscopic encoding of crystallographic handedness.", "url": "https://arxiv.org/abs/2610.39150", "type": "理论", "summary": "我们建立了局部原子电荷分布手性的电多极 ($Q_{lm}$) 准则。对于 11 个晶体手性点组，我们确定了区分相反旋向性所需的代表性最低阶多极内容。对于 $n=2,3,4,6$ 的轴组 $C_n$ 和 $D_n$，手性源自两个 $m=n$ 的方位各向异性的相对方向，属于连续的等级 $l=n$ 和 $n+1$。它们的共存产生了 $n$ 倍电荷分布的纬度依赖性扭曲。尽管 $C_n$ 中允许极性成分，但它与这种手性机制不同，并且对于旋向性来说不是必需的。立方群 $T$ 和 $O$ 表现出不同的认识，八面体手性首先出现在第九位。我们进一步表明，在无自旋 $s$-$p$-$d$-$f$ 原子基础内，标量电荷密度仅包含最多六级的多极子，因此无法编码 $C_6$、$D_6$ 或 $O$ 的旋向性。这些结果将电多极含量和原子轨道自由度与晶体旋向性的微观编码联系起来。", "authors": [{"name": "Satoru Hayami"}, {"name": "Rikuto Oiwa"}], "featured_authors": [{"name": "Satoru Hayami"}, {"name": "Rikuto Oiwa"}], "author_count": 2}, {"id": "2610.39192", "category": "cond-mat", "title": "Local Josephson response near nonmagnetic impurities and vortices in a two-orbital $s_{\\pm}$ superconductor", "abstract": "We study the local Josephson response near nonmagnetic impurities and vortices in a self-consistent two-orbital $s_{\\pm}$ superconductor. For a local $s$-wave tip that couples equally to the two orbitals, anomalous spectral contributions of opposite sign nearly cancel in the clean sample. Nonmagnetic impurities redistribute these contributions and can reverse the local coupling without a corresponding $\\pi$ phase shift of the bond pair fields. Negative coupling appears at off-center sites at weaker impurity potentials than at the impurity site. The impurity-induced change is concentrated at lower quasiparticle energies, while states over a broader energy range contribute to the total clean and impurity couplings. In zero field, the coupling also changes sign as the tip gap is varied, and increasing the tunneling strength can reverse the $m=1$ sine component of the current without changing the sample state. At the chosen coherence-peak energy, increasing impurity strength mainly changes the relative intensities of existing quasiparticle-interference features. In a self-consistent two-vortex state, the Josephson response develops a spatially varying phase relative to the condensate. The response and condensate share the winding close to each core, while larger loops enclose additional winding of the Josephson response. The local Josephson sign and phase reflect the anomalous spectrum and the tip--sample coupling.", "url": "https://arxiv.org/abs/2610.39192", "type": "理论", "summary": "我们研究了自洽双轨道 $s_{\\pm}$ 超导体中非磁性杂质和涡流附近的局部约瑟夫森响应。对于与两个轨道同等耦合的局部 $s$ 波尖端，相反符号的异常光谱贡献在干净的样本中几乎被抵消。非磁性杂质重新分配这些贡献，并且可以反转局部耦合，而无需键对场相应的 $\\pi$ 相移。负耦合出现在杂质电势弱于杂质位点的偏离中心位点。杂质引起的变化集中在较低的准粒子能量处，而更广泛的能量范围内的状态有助于总的清洁和杂质耦合。在零场中，耦合也会随着尖端间隙的变化而改变符号，并且增加隧道强度可以反转电流的 $m=1$ 正弦分量而不改变样本状态。在选定的相干峰值能量下，增加杂质强度主要改变现有准粒子干涉特征的相对强度。在自洽的双涡流状态下，约瑟夫森响应相对于冷凝物形成空间变化的相位。\n\n响应和冷凝共用靠近每个磁芯的绕组，而较大的环路则包围约瑟夫森响应的附加绕组。局部约瑟夫森符号和相位反映了反常光谱和尖端-样品耦合。", "authors": [{"name": "Yuanyuan Zhao"}], "featured_authors": [{"name": "Yuanyuan Zhao"}], "author_count": 1}, {"id": "2610.39206", "category": "cond-mat", "title": "Nodal magnon spin current at an antiferromagnet/altermagnet junction", "abstract": "We investigate the thermally driven magnon spin current across a junction between a $d$-wave altermagnet (AM) and a ferromagnet (FM) or an antiferromagnet (AFM). The current consists of a component independent of the interface angle and an angularly dependent component with the $d$-wave form. For a sublattice-symmetric interface, the two junctions behave oppositely under reversal of the altermagnetic domain: in the FM/AM junction the angularly dependent component is odd and cancels on averaging over the domains, whereas in the AFM/AM junction the angularly independent component vanishes by symmetry and the angularly dependent component survives the domain average at a fixed Néel vector of the AFM. Both follow from a selective tunneling: a pair of spins bonded across the interface transmits magnons when the spins are parallel and not when antiparallel, which makes the AFM/AM junction a magnon valve: the configuration in which the bonded spins are antiparallel blocks the current up to the sublattice admixture of the magnons. The anisotropic tunneling is detectable as the sign reversal of the current between the interfaces normal to $[310]$ and $[130]$, and the valve reads the Néel vector of the altermagnet relative to that of the antiferromagnet through the magnitude of the current at a fixed interface.", "url": "https://arxiv.org/abs/2610.39206", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Koki Mizuno"}], "featured_authors": [{"name": "Koki Mizuno"}], "author_count": 1}, {"id": "2610.39250", "category": "cond-mat", "title": "Polarization-locked chiral persistent spin textures in two-dimensional lead-halide perovskites", "abstract": "Chiral spacer cations crystallize two-dimensional hybrid perovskites in the polar Sohncke group $P2_1$, which places the polar axis in the inorganic layer. We analyze the spin-orbit field that this geometry allows and test it against first-principles spin textures of ten polar chiral lead-halide perovskites, their mirror enantiomers and four halide-substituted analogues. The point group $C_2$ with the twofold axis in the layer forbids the helical Rashba field and allows a linear term $\\gamma_1 k_x \\sigma_z$, the Rashba interaction of the in-plane polar axis, together with chirality-related Dresselhaus and radial terms. Thirty-four two-band $k \\cdot p$ models were fitted to each band pair and ranked by the agreement of their spin directions with the calculation rather than by the band energies, which cannot distinguish them. In all strongly polar compounds, the conduction band is described by the persistent term alone, with $\\gamma_1 = 1.09$-$1.98$ eV Å and a spin agreement of at least 0.98, whereas the best Rashba or Dresselhaus model reaches 0.20. The $R$ and $S$ enantiomers of each compound have opposite polarizations, and therefore opposite $\\gamma_1$ and opposite persistent spin textures of equal magnitude, as required by the mirror that relates them; this holds in all ten compounds, so the choice of the enantiomer selects the spin direction. The magnitude of $\\gamma_1$ correlates with the disparity of the in-plane Pb-X-Pb angles ($r = 0.95$). With electron masses of $0.26$-$0.43\\,m_e$ along the spin-splitting directions, the associated persistent spin helices have wavelengths of 3.4-8.2 nm.", "url": "https://arxiv.org/abs/2610.39250", "type": "理论+数值", "summary": "手性间隔阳离子在极性 Sohncke 基团 $P2_1$ 中结晶二维杂化钙钛矿，该基团将极轴置于无机层中。我们分析了这种几何结构允许的自旋轨道场，并根据十种极性手性卤化铅钙钛矿、它们的镜像对映体和四种卤化物取代类似物的第一原理自旋结构对其进行了测试。层中具有双轴的点群 $C_2$ 禁止螺旋 Rashba 场，并允许线性项 $\\gamma_1 k_x \\sigma_z$、面内极轴的 Rashba 相互作用，以及与手性相关的 Dresselhaus 和径向项。将 34 个二能带 $k \\cdot p$ 模型拟合到每个能带对，并根据其自旋方向与计算的一致性进行排序，而不是根据能带能量进行排序，因为能带能量无法区分它们。在所有强极性化合物中，导带仅由持久项描述，$\\gamma_1 = 1.09$-$1.98$ eV Å 且自旋一致性至少为 0.98，而最好的 Rashba 或 Dresselhaus 模型达到 0.20。\n\n每种化合物的 $R$ 和 $S$ 对映异构体具有相反的偏振，因此具有相反的 $\\gamma_1$ 和相同大小的相反的持久自旋结构，正如关联它们的镜子所要求的那样；这在所有十种化合物中都成立，因此对映体的选择决定了自旋方向。 $\\gamma_1$ 的大小与面内 Pb-X-Pb 角度的差异相关 ($r = 0.95$)。沿自旋分裂方向的电子质量为 $0.26$-$0.43\\,m_e$，相关的持久自旋螺旋的波长为 3.4-8.2 nm。", "authors": [{"name": "Palanichamy Gayathri"}, {"name": "Biplab Sanyal"}, {"name": "Jonas Fransson"}], "featured_authors": [{"name": "Palanichamy Gayathri"}, {"name": "Biplab Sanyal"}, {"name": "Jonas Fransson"}], "author_count": 3}, {"id": "2610.39307", "category": "cond-mat", "title": "Ten-loop fixed-dimension renormalization-group functions of the three-dimensional O(N) model from distributed GPU-accelerated parametric integration", "abstract": "The renormalization-group functions $\\beta$, $\\eta$ and $\\nu$ of the three-dimensional $O(N)$ model in fixed dimension (massive zero-momentum scheme) were known to eighth order in the coupling. We extend them to tenth order, and $\\beta$ to eleventh, for general $N$, which requires the two- and four-point functions to ten loops (1,593,254 graphs at the last order), and re-evaluate all lower orders. Through the Callan-Symanzik equation every coefficient follows from per-order sums that are linear in finite, zero-momentum $\\bar R$-subtracted parametric integrals, one per graph, which we sample on GPUs by tropical Monte Carlo with densities adapted to the forest terms. The computation reproduces the known sums from two to seven loops within three standard deviations and agrees at ninth and tenth order, at lower precision, with an independent route through an intermediate scheme. The new coefficients have relative uncertainties of a few $10^{-5}$ or better, and the eighth-order coefficients of $\\eta$ and $\\nu$ improve by factors of 120 and 4. The time needed to integrate an order to fixed relative precision grows by only 2.4-2.9 per loop from seven loops on, while the construction of the integrands still grows factorially and, at tenth order, costs more than the integration. Resummed, the tenth-order series give $\\nu=0.62997(51)$, $\\eta=0.0333(18)$ and $\\omega=0.803(14)$ for $N=1$, against $0.62997097(12)$, $0.036297612(48)$ and $0.82968(23)$ from the conformal bootstrap; at $N=3$ the deviations grow, so that the uncertainty is now dominated by the resummation rather than by the coefficients. Every result is generated automatically from, or checked against, a public ledger of independent, exactly pooled runs, hosted on GitHub, to which anyone is welcome to contribute computing time.", "url": "https://arxiv.org/abs/2610.39307", "type": "理论+数值", "summary": "固定维度（大规模零动量方案）三维 $O(N)$ 模型的重整化群函数 $\\beta$、$\\eta$ 和 $\\nu$ 在耦合中已知为八阶。对于一般的 $N$，我们将它们扩展到第十阶，将 $\\beta$ 扩展到第十一阶，这需要将两点和四点函数扩展到十个循环（最后一阶有 1,593,254 个图），并重新评估所有较低阶。通过 Callan-Symanzik 方程，每个系数都来自每阶总和，这些总和在有限、零动量 $\\bar R$ 减去参数积分中是线性的，每个图一个，我们通过热带蒙特卡罗在 GPU 上采样，密度适应森林条件。该计算在三个标准偏差内再现两到七个循环的已知和，并以较低的精度在九阶和十阶上与通过中间方案的独立路径一致。新系数的相对不确定性为$10^{-5}$或更好，$\\eta$和$\\nu$的八阶系数分别提高了120和4倍。\n\n从 7 个循环开始，将阶次积分到固定相对精度所需的时间仅增加 2.4-2.9 个循环，而被积函数的构造仍然按阶乘增长，并且在 10 阶时，成本高于积分。继续，十阶级数对于 $N=1$ 给出 $\\nu=0.62997(51)$、$\\eta=0.0333(18)$ 和 $\\omega=0.803(14)$，而 $0.62997097(12)$、$0.036297612(48)$ 和 $0.82968(23)$ 则来自共形自举；在 $N=3$ 时，偏差会增加，因此不确定性现在主要由恢复而不是系数决定。每个结果都是从托管在 GitHub 上的独立、精确池化运行的公共分类账自动生成或检查的，欢迎任何人向该分类账贡献计算时间。", "authors": [{"name": "Paolo Ribeca"}], "featured_authors": [{"name": "Paolo Ribeca"}], "author_count": 1}, {"id": "2610.39349", "category": "cond-mat", "title": "A Zoo of Fermionic Relative Rényi Negativities in the Sachdev-Ye-Kitaev Models", "abstract": "Quantum entanglement is a fundamental resource that gives rise to correlations with no classical counterpart in strongly correlated fermionic systems. However, its characterization in mixed quantum states remains challenging. Established entanglement diagnostics, such as logarithmic negativity, are computationally demanding in interacting systems, and their evaluation by exact diagonalization is restricted to small system sizes. Meanwhile, conventional Rényi proxies, including twisted and untwisted Rényi negativities, can be positive even for separable states. In this work, we introduce a family of \\textit{relative Rényi negativities} that serve as entanglement witnesses. By relating fermionic partial time reversal to the size superoperator, we establish a path-integral representation for these Rényi negativities, enabling their evaluation in thermal states of the Sachdev-Ye-Kitaev (SYK) model and its generalizations via a large-$N$ expansion. Applying this method, we investigate entanglement in both the original SYK model and the Maldacena-Qi coupled SYK model. We identify a special class of relative Rényi negativities which serve as plausible proxies for logarithmic negativity and uncover first-order entanglement transitions that are invisible to simple observables. These results highlight the utility of relative Rényi negativities as probes of mixed-state entanglement in strongly correlated fermionic systems and suggest the existence of a new class of transitions where these negativities serve as free energies.", "url": "https://arxiv.org/abs/2610.39349", "type": "理论+数值", "summary": "量子纠缠是一种基本资源，它在强相关费米子系统中产生与经典对应物不存在的相关性。然而，其在混合量子态下的表征仍然具有挑战性。已建立的纠缠诊断（例如对数负性）在交互系统中的计算要求很高，并且通过精确对角化进行的评估仅限于较小的系统尺寸。与此同时，传统的 Rényi 代理，包括扭曲和非扭曲的 Rényi 负面因素，即使对于可分离的国家也可能是积极的。在这项工作中，我们引入了一系列 \\textit{relative Rényi negativities} 作为纠缠见证。通过将费米子部分时间反转与尺寸超算子联系起来，我们为这些 Rényi 负性建立了路径积分表示，从而能够在 Sachdev-Ye-Kitaev (SYK) 模型的热态中对其进行评估，并通过大型 $N$ 展开进行推广。应用这种方法，我们研究了原始 SYK 模型和 Maldacena-Qi 耦合 SYK 模型中的纠缠。\n\n我们确定了一类特殊的相对 Rényi 负性，它们可以作为对数负性的合理代理，并揭示简单可观测值不可见的一阶纠缠跃迁。这些结果强调了相对 Rényi 负性作为强相关费米子系统中混合态纠缠探针的实用性，并表明存在一类新的跃迁，其中这些负性充当自由能。", "authors": [{"name": "Linjing Jiang"}, {"name": "Pengfei Zhang"}], "featured_authors": [{"name": "Linjing Jiang"}, {"name": "Pengfei Zhang"}], "author_count": 2}, {"id": "2610.39361", "category": "cond-mat", "title": "Metastability, collective excitations, and traveling states of one-dimensional spin-orbit-coupled quantum droplets", "abstract": "We study the static and traveling droplet phases of spin-orbit coupled, one-dimensional Bose-Bose mixtures with a Lee-Huang-Yang correction. For the static droplets, employing a variational analysis for an infinitely extended mixture, we show that the system can feature two ground-state droplet phases: a stripe droplet phase up to a critical Rabi coupling strength, at which it undergoes a first-order transition to a zero-momentum droplet phase. The variational results for the ground-state properties are shown to be in good agreement with numerical solutions for droplets in the thermodynamic limit as well as finite-size droplets in the \"flat-top regime\". For finite-size droplets, the stripe phase can feature multiple stationary states with different numbers of peaks in their stripe density patterns. The calculation of the excitation spectrum for these stationary states confirms their stability. To study the moving droplets, we investigate the ground-state phases of the system in the droplet's comoving frame. We show that in the comoving frame, droplets acquire a finite longitudinal magnetization. As a consequence, the phase diagram features two distinct phases: a traveling stripe droplet and a plane-wave droplet. The real-time evolution of these droplets in the space-fixed frame, complemented by the Bogoliubov analysis in the comoving frame, illustrates the stability of these traveling droplet phases.", "url": "https://arxiv.org/abs/2610.39361", "type": "理论+数值", "summary": "我们通过 Lee-Huang-Yang 校正研究了自旋轨道耦合的一维 Bose-Bose 混合物的静态和行进液滴相。对于静态液滴，采用对无限扩展混合物的变分分析，我们表明该系统可以具有两个基态液滴相：条纹液滴相达到临界拉比耦合强度，在该强度下它经历一阶过渡到零动量液滴相。基态性质的变分结果与热力学极限液滴以及“平顶状态”中有限尺寸液滴的数值解非常一致。对于有限尺寸的液滴，条纹相可以具有多个稳态，其条纹密度图案中具有不同数量的峰值。这些稳态的激发光谱的计算证实了它们的稳定性。为了研究移动的液滴，我们研究了液滴共移框架中系统的基态相。我们表明，在共动框架中，液滴获得有限的纵向磁化强度。\n\n因此，相图具有两个不同的相：行进的条纹液滴和平面波液滴。这些液滴在空间固定坐标系中的实时演化，辅以共动坐标系中的 Bogoliubov 分析，说明了这些行进液滴相的稳定性。", "authors": [{"name": "Harsimranjit Kaur"}, {"name": "Ritu"}, {"name": "Rajat"}, {"name": "Kuldeep Suthar"}, {"name": "Sandeep Gautam"}], "featured_authors": [{"name": "Harsimranjit Kaur"}, {"name": "Ritu"}, {"name": "Rajat"}, {"name": "Kuldeep Suthar"}, {"name": "Sandeep Gautam"}], "author_count": 5}, {"id": "2610.39405", "category": "cond-mat", "title": "Aging and protocol dependence of thermal activation events in structural glasses", "abstract": "In this study, we investigate the waiting time dependence and the protocol dependence of thermally activated events in structural glasses using molecular simulations and potential energy landscape analysis. We find a qualitative crossover in the nature of activation events; from avalanche-like events to local events. We also use the isoconfigurational ensemble analysis and reveal that the events become less diverse and more reversible. We discuss these crossovers from the perspective of the stability and the potential energy landscape of glasses. To investigate the protocol dependence, we compare the two types of glasses whose stability is controlled by waiting time and parent temperature, respectively. Surprisingly, at the same inherent structure energy level, the parent-temperature-controlled glasses are more unstable and maintain their avalanche-like nature. These results demonstrate that the activation properties of structural glasses are not determined solely by their energy levels, highlighting the essential role of state connectivity and the dynamical sampling in the complex energy landscape.", "url": "https://arxiv.org/abs/2610.39405", "type": "数值", "summary": "在这项研究中，我们利用分子模拟和势能景观分析研究了结构玻璃中热激活事件的等待时间依赖性和协议依赖性。我们发现激活事件的性质存在定性交叉；从类似雪崩的事件到当地的事件。我们还使用同构系综分析并揭示事件变得不那么多样化并且更加可逆。我们从玻璃的稳定性和势能景观的角度讨论这些交叉。为了研究协议依赖性，我们比较了两种类型的眼镜，其稳定性分别由等待时间和母体温度控制。令人惊讶的是，在相同的固有结构能级下，母体温控玻璃更加不稳定，并保持其雪崩般的性质。这些结果表明，结构玻璃的激活特性不仅仅由其能级决定，凸显了状态连通性和动态采样在复杂能量景观中的重要作用。", "authors": [{"name": "Yuki Takaha"}, {"name": "Atsushi Ikeda"}], "featured_authors": [{"name": "Yuki Takaha"}, {"name": "Atsushi Ikeda"}], "author_count": 2}, {"id": "2610.39436", "category": "cond-mat", "title": "Hop rates of H and D on Pt(111) at finite coverage: the memory equation and the collective friction", "abstract": "Helium scattering measures the coherent intermediate scattering function of an adlayer, the characteristic function of the separation between adparticles at two times. Published dephasing rates of H and D on Pt(111) are analysed with its memory equation and a nearest-neighbour Ising lattice gas. The measured rate belongs to the adlayer. The hop rate of a single adsorbate is extracted from it by dividing out an interaction factor, without a model of the barrier. This factor lies between $0.97$ and $1.17$ at $0.1$~ML, so that the published single-adsorbate analyses hold there. At $0.4$~ML and $80$~K it lies between $1.2$ and $4.7$, depending on how the occupied neighbours modify a tunnelling jump. The memory function is interpreted as a friction, the collective friction, which the adlayer exerts on its own density fluctuations. The lateral coupling, fixed by the coverage series, is the free energy of a neighbouring pair, with a vibrational pair entropy. The small deformation of the measured curves from the Chudley--Elliott form, the tilt, is proposed as an observable of the coupling. The tilts at $0.15$ and $0.2$~ML are consistent with it, although they are hard to extract from the published curves. The memory equation provides a transition-state theory for the adlayer, with the collective friction in the role of the friction of the substrate and without divergence at the crossover. Combined with the standard quantum transition-state theory of a single adsorbate, the extracted hop rates give the friction of the substrate, $124$ and $75$~ps$^{-1}$ for H and D, independent of the coverage.", "url": "https://arxiv.org/abs/2610.39436", "type": "理论", "summary": "氦散射测量吸附层的相干中间散射函数，即两次吸附颗粒之间间隔的特征函数。已发表的 H 和 D 在 Pt(111) 上的相移速率通过其记忆方程和最近邻伊辛晶格气体进行了分析。测量的速率属于adlayer。单个吸附物的跳跃率是通过除以相互作用因子而从中提取的，无需障碍模型。该因子位于 $0.97$ 和 $1.17$ 之间，$0.1$~ML，因此已发表的单吸附物分析保持不变。在 $0.4$~ML 和 $80$~K 处，它位于 $1.2$ 和 $4.7$ 之间，具体取决于占用的邻居如何修改隧道跳跃。记忆功能被解释为一种摩擦，即adlayer对其自身密度波动施加的集体摩擦。由覆盖级数固定的横向耦合是相邻对的自由能，具有振动对熵。 Chudley-Elliott 形式的测量曲线的小变形（倾斜）被提议作为耦合的可观测量。\n\n$0.15$ 和 $0.2$~ML 处的倾斜与其一致，尽管很难从已发布的曲线中提取它们。记忆方程为吸附层提供了过渡态理论，其中集体摩擦力起到基底摩擦力的作用，并且在交叉处没有发散。结合单个吸附物的标准量子过渡态理论，提取的跳跃率给出了 H 和 D 的基底摩擦力 $124$ 和 $75$~ps$^{-1}$，与覆盖范围无关。", "authors": [{"name": "S. Miret-Artés"}], "featured_authors": [{"name": "S. Miret-Artés"}], "author_count": 1}, {"id": "2610.39511", "category": "cond-mat", "title": "Itô versus Stratonovich for shot noise with state-dependent amplitude: why the answer is Marcus", "abstract": "For Gaussian white noise the Itô and Stratonovich prescriptions differ by $O(dt)$ per time step, which accumulates into the familiar spurious drift $\\tfrac12 D\\,II'$. We show that for renewal shot noise with state-dependent gain, $\\dot x=-C(x)-I(x)\\xi[t]$ with $\\xi[t]$ a train of Dirac spikes of finite random amplitude, the two prescriptions differ by a finite amount at every event, and that where $I$ vanishes the difference can become qualitative. The Marcus kick, the jump-process counterpart of the Stratonovich prescription, is the flow map of $dx/ds=I(x)$: no kick can cross a zero $x^\\ast$ of $I$, for any jump and waiting-time statistics. The Itô kick is only the tangent map of that flow. For $I(x)=1+\\beta x$ it crosses $x^\\ast=-1/\\beta$ if and only if $\\xi\\beta>1$ and collapses the whole line onto $x^\\ast$ at $\\xi\\beta=1$; below threshold it is itself a Marcus kick with a remapped jump law. Bounded jump laws thus have a threshold, while unbounded ones leak across the barrier for \\emph{any} parameters. The discrepancy cannot be absorbed into a renormalised drift beyond lowest order, and only the Marcus kick is generated by a single operator, which makes the master equation of Bianucci, Bologna and Mannella (2026) intrinsically Marcus. Numerically, the standard Heun kick is a second-order truncation of the Marcus map that preserves the barrier only because its order is even; it shortens every jump, biasing second moments in proportion to the squared jump amplitude and the jump kurtosis, and depleting the region near the barrier. We give the exact-flow integrator that replaces it.", "url": "https://arxiv.org/abs/2610.39511", "type": "理论+数值", "summary": "对于高斯白噪声，Itô 和 Stratonovich 处方每时间步的差异为 $O(dt)$，这会累积成熟悉的寄生漂移 $\\tfrac12 D\\​​,II'$。我们证明，对于具有状态相关增益的更新散粒噪声，$\\dot x=-C(x)-I(x)\\xi[t]$ 和 $\\xi[t]$ 一系列有限随机幅度的狄拉克尖峰，两个处方在每个事件上都有有限的差异，并且当 $I$ 消失时，差异可以变成定性的。马库斯踢球是斯特拉托诺维奇处方的跳跃过程对应物，是 $dx/ds=I(x)$ 的流程图：对于任何跳跃和等待时间统计，没有踢球可以跨越 $I$ 的零 $x^\\ast$。伊藤踢只是该流的切线图。对于 $I(x)=1+\\beta x$ 当且仅当 $\\xi\\beta>1$ 时，它与 $x^\\ast=-1/\\beta$ 相交，并将整条线折叠到 $\\xi\\beta=1$ 处的 $x^\\ast$ 上；低于阈值，它本身就是具有重新映射的跳跃规则的马库斯踢。因此，有界跳跃定律有一个阈值，而无界跳跃定律则跨越 \\emph{any} 参数的屏障。\n\n这种差异不能被吸收到最低阶以上的重正化漂移中，并且只有 Marcus kick 由单个算子生成，这使得 Bianucci、Bologna 和 Mannella (2026) 的主方程本质上是 Marcus。从数值上看，标准 Heun 踢是 Marcus 映射的二阶截断，它保留了障碍，只是因为它的阶数是偶数；它缩短了每次跳跃，与跳跃幅度和跳跃峰度的平方成比例地偏置第二矩，并耗尽势垒附近的区域。我们提供了精确流量积分器来替代它。", "authors": [{"name": "Marco Bianucci"}, {"name": "Riccardo Mannella"}], "featured_authors": [{"name": "Marco Bianucci"}, {"name": "Riccardo Mannella"}], "author_count": 2}, {"id": "2610.39529", "category": "cond-mat", "title": "Multiple Current Enhancement Regimes and Interaction Induced Re-entrant Transport in a Quasiperiodic Hubbard Ring with Antiferromagnetic Order", "abstract": "We investigate persistent charge and spin currents in a one-dimensional quantum ring threaded by an Aharonov-Bohm (AB) flux, considering generalized Aubry-André-Harper (AAH) modulation with staggered onsite energies and antiferromagnetic (AFM) ordering in both the noninteracting and interacting regimes, with the latter treated using a self-consistent Hartree-Fock mean field theory (MFT). At half filling, two distinct current-enhancement peaks emerge as the modulation strength increases, with quasiperiodic hopping modulation playing a crucial role in establishing the two-peak structure within a restricted parameter regime. Spin-resolved bond-current profiles reveal a switch in the dominant spin contribution between the two peaks, while the inverse participation ratio (IPR) and flux-dependent spin-resolved ground-state energies provide complementary insights into the spatial characteristics of the eigenstates and their spin-dependent flux sensitivity. At quarter filling, the spin current exhibits a single enhancement peak, in contrast to the two-peak response observed at half filling. The Hubbard interaction affects the two half-filled peaks differently: it suppresses the primary peak, whereas the secondary peak exhibits a nonmonotonic, re-entrant response, with the current recovering at finite interaction strength. The interacting results are further characterized through the Drude weight, and comparisons with exact diagonalization (ED) and density-matrix renormalization group (DMRG) calculations for a finite half-filled system support the reliability of the MFT description. Our findings elucidate how quasiperiodic modulation, AFM order, band filling, and electronic correlations collectively govern the magnitude and spin-resolved character of persistent currents, giving rise to multiple enhancement regimes and interaction-induced re-entrant behavior.", "url": "https://arxiv.org/abs/2610.39529", "type": "理论+数值", "summary": "我们研究了由阿哈罗诺夫-玻姆 (AB) 通量穿过的一维量子环中的持久电荷和自旋电流，考虑了非相互作用和相互作用状态下具有交错现场能量和反铁磁 (AFM) 排序的广义奥布里-安德烈-哈珀 (AAH) 调制，后者使用自洽 Hartree-Fock 平均场理论 (MFT) 进行处理。在半填充时，随着调制强度的增加，出现两个不同的电流增强峰，准周期跳跃调制在受限参数范围内建立双峰结构中发挥着至关重要的作用。自旋分辨键电流分布揭示了两个峰之间的主导自旋贡献的转变，而逆参与比（IPR）和通量相关的自旋分辨基态能量提供了对本征态的空间特征及其自旋相关通量敏感性的补充见解。在四分之一填充时，自旋电流表现出单个增强峰，与在半填充时观察到的双峰响应相反。\n\n哈伯德相互作用对两个半填充峰的影响不同：它抑制主峰，而次峰表现出非单调的重入响应，电流在有限的相互作用强度下恢复。交互结果通过 Drude 权重进一步表征，并且与有限半填充系统的精确对角化 (ED) 和密度矩阵重整化群 (DMRG) 计算的比较支持了 MFT 描述的可靠性。我们的研究结果阐明了准周期调制、AFM 阶数、能带填充和电子相关性如何共同控制持续电流的幅度和自旋分辨特征，从而产生多种增强机制和相互作用引起的重入行为。", "authors": [{"name": "Souvik Roy"}, {"name": "Ranjini Bhattacharya"}], "featured_authors": [{"name": "Souvik Roy"}, {"name": "Ranjini Bhattacharya"}], "author_count": 2}, {"id": "2610.39555", "category": "cond-mat", "title": "Edge-Plasmon-Induced Magnetization in Higher Chern Insulators", "abstract": "Higher Chern insulators host multiple dissipationless chiral edge states, one per unit of Chern number. We study the collective plasmon modes of these edge states at a domain wall between Chern numbers $\\mathcal{C}$ and $-\\mathcal{C}$, using a semiclassical model with Coulomb interactions. The plasmon dispersion is linear at long wavelengths, with a velocity that increases linearly with $\\mathcal{C}$. As in conventional two-dimensional metals, the edge plasmon generates an elliptically polarized electric field that decays into the bulk and drives electrons in circular orbits, producing a static orbital magnetization (inverse Faraday effect). For topological edge plasmons, the magnetization has a nontrivial spatial profile set by two competing length scales: the finite extent of the edge states and the plasmon wavelength. At fixed edge-charge amplitude, it grows strongly with $\\mathcal{C}$. At the domain wall, it approaches a finite plateau at low frequency and decays as $1/\\omega^2$ at high frequency. Its temperature dependence is nonmonotonic, with a maximum at an intermediate temperature. These results show how the Chern number controls plasmon-induced magnetization, in contrast to conventional edge plasmons.", "url": "https://arxiv.org/abs/2610.39555", "type": "理论", "summary": "较高的陈绝缘体具有多个无耗散手征边缘态，每单位陈数一个。我们使用具有库仑相互作用的半经典模型，研究了陈数 $\\mathcal{C}$ 和 $-\\mathcal{C}$ 之间域壁上这些边缘态的集体等离子体模式。等离激元色散在长波长下呈线性，速度随 $\\mathcal{C}$ 线性增加。与传统的二维金属一样，边缘等离子体激元产生椭圆极化电场，该电场衰变到块体中并驱动圆形轨道上的电子，产生静态轨道磁化（反法拉第效应）。对于拓扑边缘等离子体激元，磁化强度具有由两个相互竞争的长度尺度设置的重要空间轮廓：边缘态的有限范围和等离子体激元波长。在固定的边缘电荷幅度下，它随 $\\mathcal{C}$ 强烈增长。在畴壁处，它在低频处接近有限平台，并在高频处衰减为 $1/\\omega^2$。其温度依赖性是非单调的，在中间温度处具有最大值。\n\n这些结果表明，与传统的边缘等离子体激元相比，陈数如何控制等离子体激元引起的磁化。", "authors": [{"name": "Prathyush P. Poduval"}, {"name": "Rofii"}, {"name": "Muhammad S. Ukhtary"}, {"name": "Thomas L. Schmidt"}, {"name": "Eddwi H. Hasdeo"}], "featured_authors": [{"name": "Prathyush P. Poduval"}, {"name": "Rofii"}, {"name": "Muhammad S. Ukhtary"}, {"name": "Thomas L. Schmidt"}, {"name": "Eddwi H. Hasdeo"}], "author_count": 5}, {"id": "2610.39568", "category": "cond-mat", "title": "Diffusion models for the $O(3)$ nonlinear sigma model", "abstract": "A score-based diffusion model is trained on the two-dimensional classical Heisenberg model, the lattice representation of the $O(3)$ nonlinear sigma model. Neural networks are trained on three different coarse-grainings of the same training set to implement a multiscale sampling scheme that modestly improves both the accuracy and computational cost of direct sampling on the finest lattice. Stein (or Schwinger-Dyson) diagnostics for the two-point correlation function are introduced to assess the quality of the learned score without relying on reverse diffusion sampling. These diagnostics are also incorporated into an additional training loss. We discuss several technical considerations relevant to implementing diffusion models on $S^2$. These include a consideration of lifting the network input to $S^3$, as in the $CP^1$ representation, and developing a boundary-layer approximation to the short-time spherical heat kernel that extends its usefulness to larger diffusion times.", "url": "https://arxiv.org/abs/2610.39568", "type": "理论", "summary": "基于分数的扩散模型在二维经典海森堡模型（$O(3)$ 非线性 sigma 模型的晶格表示）上进行训练。神经网络在同一训练集的三种不同粗粒度上进行训练，以实现多尺度采样方案，该方案适度提高了最细晶格上直接采样的准确性和计算成本。引入两点相关函数的 Stein（或 Schwinger-Dyson）诊断来评估学习分数的质量，而不依赖于反向扩散采样。这些诊断也被纳入额外的训练损失中。我们讨论了与在 $S^2$ 上实施扩散模型相关的几个技术考虑因素。其中包括考虑将网络输入提升到 $S^3$（如 $CP^1$ 表示形式），以及开发短时球形热核的边界层近似，将其有用性扩展到更大的扩散时间。", "authors": [{"name": "Daniel Schubring"}], "featured_authors": [{"name": "Daniel Schubring"}], "author_count": 1}, {"id": "2610.39612", "category": "cond-mat", "title": "Fractal dimensions of paths on three-dimensional random-walk traces", "abstract": "We study four paths that join the starting site to the final position of a simple random walk of \\(N=L^2\\) steps on the infinite cubic lattice. The paths are selected on the walk trace---the graph of visited sites and traversed bonds---by different rules: the undirected shortest path \\(S_1\\), the directed shortest path \\(S_2\\), the time-respecting shortest path \\(S_3\\), and the depth \\(D_e\\) of the final site in a depth-first-search tree. Monte Carlo simulations for \\(L\\) up to 32768 give mean lengths scaling as \\(L^{d_O}\\), with \\(d_{S_1}=1.48005(9)\\), \\(d_{S_2}=1.49868(5)\\), \\(d_{S_3}=1.51205(5)\\), and \\(d_{D_e}=1.7099(7)\\), so that \\(d_{S_1}<d_{S_2}<d_{S_3}<d_{\\rm LE}<d_{D_e}\\), where $d_{\\rm LE}=1.62400(5)$ is the known loop-erased-random-walk exponent. Imposing traversal directions increases the shortest-path exponent, and imposing time order increases it further; these constraints therefore change the scaling exponent, not only the amplitude. For every path, the standard deviation scales with the same exponent as the mean, so it is scale-invariant, unlike the visited-site mass; the rescaled length distributions collapse onto a finite-width scaling function. No analytical theory currently predicts these exponents; our results provide precise numerical benchmarks for future studies of path geometry on random-walk traces.", "url": "https://arxiv.org/abs/2610.39612", "type": "理论+数值", "summary": "我们研究了将起始位置连接到无限立方晶格上 \\(N=L^2\\) 步的简单随机游走的最终位置的四个路径。行走轨迹（访问过的站点和遍历的键的图）上的路径是通过不同的规则选择的：无向最短路径 \\(S_1\\)、有向最短路径 \\(S_2\\)、时间相关最短路径 \\(S_3\\) 以及深度优先搜索树中最终站点的深度 \\(D_e\\)。 \\(L\\) 高达 32768 的蒙特卡罗模拟给出平均长度缩放为 \\(L^{d_O}\\)，其中 \\(d_{S_1}=1.48005(9)\\)、\\(d_{S_2}=1.49868(5)\\)、\\(d_{S_3}=1.51205(5)\\) 和\\(d_{D_e}=1.7099(7)\\)，因此 \\(d_{S_1}<d_{S_2}<d_{S_3}<d_{\\rm LE}<d_{D_e}\\)，其中 $d_{\\rm LE}=1.62400(5)$ 是已知的循环擦除随机游走指数。施加遍历方向会增加最短路径指数，而施加时间顺序会进一步增加它；因此，这些约束改变了缩放指数，而不仅仅是幅度。对于每条路径，标准差的指数与均值相同，因此它是尺度不变的，与访问站点质量不同；重新缩放的长度分布崩溃为有限宽度缩放函数。\n\n目前没有分析理论可以预测这些指数；我们的结果为未来随机游走轨迹上的路径几何研究提供了精确的数值基准。", "authors": [{"name": "Qiyuan Shi"}, {"name": "Xinyi Li"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Qiyuan Shi"}, {"name": "Xinyi Li"}, {"name": "Youjin Deng"}], "author_count": 3}, {"id": "2610.39713", "category": "cond-mat", "title": "I$_4$ complex acting as near-infrared emitter with a quantum memory in silicon", "abstract": "Silicon color centers emitting in the near infrared offer a route to spin--photon interfaces compatible with mature complementary metal--oxide--semiconductor fabrication. A key unresolved candidate is the X-line at 1039.7 meV in the photoluminescence (PL) spectrum, long attributed to a complex of four self-interstitials (I$_4$), yet whose microscopic structure and spin properties have remained controversial and uncharacterized at a predictive level. Using hybrid-functional (HSE06) density functional theory, we unambiguously establish the bare I$_4$ complex as the origin of the X-line: our calculations quantitatively reproduce the zero-phonon line, the complete phonon sideband structure---identifying the prominent secondary peaks as one- and two-phonon replicas of strongly coupled quasi-local modes---and the EPR hyperfine constants. The charge transition level is found at VBM$+$0.08~eV, conclusively ruling out the previously proposed association with the B3 EPR center and its correlated deep donor level. Most significantly, we identify a metastable spin-1 triplet excited state separated from the singlet by $\\sim$1.6~meV, consistent with the NL51 EPR signal. The $D_{2d}$ symmetry of the defect suppresses intersystem crossing and phosphorescence by first-order spin--orbit coupling, implying an exceptionally long spin--lattice relaxation time. Combined with a spectrally resolvable zero-field splitting and near-infrared emission, the triplet state of the I$_4$ complex constitutes a viable spin quantum memory intrinsic to silicon.", "url": "https://arxiv.org/abs/2610.39713", "type": "理论+数值", "summary": "发射近红外光的硅色心提供了一条与成熟的互补金属氧化物半导体制造兼容的自旋光子界面的途径。一个尚未解决的关键候选者是光致发光 (PL) 光谱中 1039.7 meV 的 X 线，长期以来归因于四个自填隙 (I$_4$) 的复合物，但其微观结构和自旋特性仍然存在争议，并且在预测水平上尚未表征。使用混合泛函 (HSE06) 密度泛函理论，我们明确地将裸 I$_4$ 复合体确立为 X 线的起源：我们的计算定量地再现了零声子线、完整的声子边带结构（将突出的次级峰识别为强耦合准局部模式的一和二声子复制品）以及 EPR 超精细常数。电荷跃迁能级位于 VBM$+$0.08~eV，最终排除了之前提出的与 B3 EPR 中心及其相关的深供体能级的关联。最重要的是，我们确定了一个亚稳态 spin-1 三重激发态，与单重态相隔 $\\sim$1.6~meV，与 NL51 EPR 信号一致。\n\n缺陷的$D_{2d}$对称性通过一阶自旋轨道耦合抑制系间窜越和磷光，这意味着极长的自旋晶格弛豫时间。结合光谱可分辨的零场分裂和近红外发射，I$_4$ 复合物的三重态构成了硅固有的可行的自旋量子存储器。", "authors": [{"name": "Miaomiao Han"}, {"name": "Song Li"}, {"name": "Gergő Thiering"}, {"name": "Thomas Frauenheim"}, {"name": "Peter Deák"}, {"name": "Bing Huang"}, {"name": "Adam Gali"}], "featured_authors": [{"name": "Miaomiao Han"}, {"name": "Song Li"}, {"name": "Gergő Thiering"}, {"name": "Peter Deák"}, {"name": "Bing Huang"}, {"name": "Adam Gali"}], "author_count": 7}, {"id": "2610.39736", "category": "cond-mat", "title": "Influence of hydrophobic polyelectrolyte composition on pH-dependent solubilization of lipid bilayer membranes", "abstract": "Lipid bilayer membranes can be solubilized in the form of disks of approximately 10 nm in diameter by several types of hydrophobic polyelectrolytes (HPE). The disks are stabilized by wrapped HPE along the rims of the disks. We compare the solubilization behavior of anionic HPE with chain lengths in between 20 - 100 monomers, and with varying molecular composition. We find that (1) HPE as short as 20 monomers can readily solubilize lipid bilayer membranes; (2) spatial intermolecular arrangement of ionic and hydrophobic groups in HPE determine if solubilization occurs; (3) anionic HPEs may exhibit two distinct pH-dependent solubilization transitions: the first is encountered in the lower-pH regime upon increasing the pH, whereas the second emerges at higher pH when the pH is decreased; (4) a binomial composition distribution of hydrophobic and ionizable groups over the chains, compared to a fixed composition, does not lead to a measurably wider pH range where solubilization occurs for the transition at low pH. We link the solubilization behavior of one of the HPE's to pH-dependent partitioning between macroscopic oil and water phases. Finally, (5) we find that linear composition superposition of the hydrophobic groups in HPE quantitatively accounts for the composition dependence of the pH's where solubilization occurs. This result holds within a range of compositions and breaks down below a critical fraction of hydrophobic residues in a HPE chain. Throughout, we compare the observations to a recently developed model for ligand-mediated cooperative transitions. Our findings have potential impact on anti-cancer medicine and drug delivery applications.", "url": "https://arxiv.org/abs/2610.39736", "type": "理论", "summary": "脂质双层膜可以通过几种类型的疏水性聚电解质 (HPE) 以直径约 10 nm 的圆盘形式溶解。通过沿磁盘边缘包裹的 HPE 来稳定磁盘。我们比较了链长在 20 - 100 个单体之间且具有不同分子组成的阴离子 HPE 的增溶行为。我们发现（1）只要20个单体的HPE就可以很容易地溶解脂质双层膜； (2) HPE中离子基团和疏水基团的空间分子间排列决定是否发生增溶； (3) 阴离子 HPE 可能表现出两种不同的 pH 依赖性增溶转变：第一种是在 pH 值升高时在较低 pH 状态下遇到的，而第二种是当 pH 值降低时在较高 pH 状态下出现的； (4)与固定组成相比，疏水性和可电离基团在链上的二项式组成分布不会导致可测量的更宽的pH范围，其中在低pH下的转变发生溶解。我们将其中一种 HPE 的增溶行为与宏观油相和水相之间的 pH 依赖性分配联系起来。\n\n最后，(5) 我们发现 HPE 中疏水基团的线性组成叠加定量地解释了发生溶解的 pH 值的组成依赖性。该结果在一定的组成范围内成立，并且在 HPE 链中疏水残基的临界分数以下分解。在整个过程中，我们将观察结果与最近开发的配体介导的合作转变模型进行了比较。我们的研究结果对抗癌医学和药物输送应用具有潜在影响。", "authors": [{"name": "Martijn Koorengevel"}, {"name": "Michelle N.M. de Dood"}, {"name": "Wouter T.E. Bosker"}, {"name": "James L. Martin Robinson"}, {"name": "Cornelis A. van Walree"}, {"name": "Bas G. P. van Ravensteijn"}, {"name": "Willem K. Kegel"}], "featured_authors": [{"name": "Martijn Koorengevel"}, {"name": "Michelle N.M. de Dood"}, {"name": "Wouter T.E. Bosker"}, {"name": "Cornelis A. van Walree"}, {"name": "Bas G. P. van Ravensteijn"}, {"name": "Willem K. Kegel"}], "author_count": 7}, {"id": "2610.39737", "category": "cond-mat", "title": "Moiré-enabled chiral plasmons in twisted bilayer graphene nanoislands", "abstract": "Twisting two stacked graphene layers superimposes a moiré superlattice that reshapes their electronic structure, yet how it shapes the collective optical response of finite, nanoscale bilayers remains largely unexplored. Using an atomistic tight-binding and self-consistent density-matrix approach, we compute the twist-dependent plasmonic response of twisted bilayer graphene nanoislands comprising thousands of atoms. The spectra are strongly tunable and split into two regimes at a critical angle where a single moiré wavelength spans the island; beyond it, an ordered ladder of resonances emerges whenever an integer number of moiré periods fits within the overlapping bilayer. In doped islands, the interlayer coupling also produces a moiré-enabled Born--Kuhn chiral plasmon: opposite transverse dipoles in the two layers form an electric quadrupole that hybridizes with the bright dipole, opening an anticrossing near the critical angle, with a handedness that reverses with the twist direction. Triangular islands confirm that the moiré lattice, not the flake boundary, governs both effects, establishing twist as a mechanical handle on chiral graphene plasmons.", "url": "https://arxiv.org/abs/2610.39737", "type": "理论", "summary": "扭转两个堆叠的石墨烯层会叠加莫尔超晶格，从而重塑其电子结构，但它如何塑造有限纳米级双层的集体光学响应仍然很大程度上未被探索。使用原子紧束缚和自洽密度矩阵方法，我们计算了由数千个原子组成的扭曲双层石墨烯纳米岛的扭曲相关等离子体响应。光谱具有很强的可调性，并在临界角处分成两个区域，其中单个莫尔波长跨越岛；除此之外，只要整数个莫尔周期适合重叠的双层，就会出现有序的共振阶梯。在掺杂岛中，层间耦合还会产生启用莫尔条纹的玻恩-库恩手性等离激元：两层中相对的横向偶极子形成电四极子，与亮偶极子杂交，在临界角附近打开反交叉，其旋向性与扭曲方向相反。三角形岛证实了莫尔晶格，而不是薄片边界，控制着这两种效应，将扭曲建立为手性石墨烯等离子体激元的机械手柄。", "authors": [{"name": "Magnus Husted"}, {"name": "Viktor Kanstrup"}, {"name": "Eduardo J. C. Dias"}, {"name": "Joel D. Cox"}], "featured_authors": [{"name": "Magnus Husted"}, {"name": "Viktor Kanstrup"}, {"name": "Eduardo J. C. Dias"}, {"name": "Joel D. Cox"}], "author_count": 4}, {"id": "2610.39793", "category": "cond-mat", "title": "Two-dimensional binary Lennard-Jones mixtures with ECMC", "abstract": "We discuss reversible and non-reversible local Monte Carlo algorithms for long-range two-dimensional binary Lennard-Jones mixtures. We illustrate how the factorized Metropolis filter efficiently handles long-range interactions even for binary mixtures, using an adapted cell-veto strategy. We then benchmark the non-reversible event-chain Monte Carlo (ECMC) algorithm against the factorized Metropolis algorithm. For simple test cases, we demonstrate speedups of several orders of magnitude in the equilibrium and the out-of-equilibrium dynamics. Using the ECMC algorithm, we provide an overview of the physics of binary Lennard-Jones mixtures, from the case without depletion (no interaction between solute and solvent) all the way to the depletion limit (with a diverging number of solvent particles). We analyze the algorithms in different thermodynamic phases and in the corresponding limits.", "url": "https://arxiv.org/abs/2610.39793", "type": "数值", "summary": "我们讨论长程二维二元 Lennard-Jones 混合的可逆和不可逆局部蒙特卡罗算法。我们说明了分解的 Metropolis 过滤器如何使用适应的单元否决策略有效地处理远程交互，即使对于二元混合物也是如此。然后，我们将不可逆事件链蒙特卡罗 (ECMC) 算法与因式分解 Metropolis 算法进行基准测试。对于简单的测试用例，我们证明了平衡和非平衡动力学中几个数量级的加速。使用 ECMC 算法，我们提供了二元 Lennard-Jones 混合物的物理原理概述，从无耗尽的情况（溶质和溶剂之间没有相互作用）一直到耗尽极限（溶剂颗粒数量不同）。我们分析了不同热力学阶段和相应限制下的算法。", "authors": [{"name": "Kush Patel"}, {"name": "Gabriele Tartero"}, {"name": "Werner Krauth"}], "featured_authors": [{"name": "Kush Patel"}, {"name": "Gabriele Tartero"}, {"name": "Werner Krauth"}], "author_count": 3}, {"id": "2610.39815", "category": "cond-mat", "title": "High-temperature expansion of the inverse-square Ising chain in a magnetic field: exact coefficients and finite-size reconstruction", "abstract": "The one-dimensional Ising chain with inverse-square interactions is a paradigmatic long-range system: it exhibits the unusual Thouless transition, with a discontinuity in the spontaneous magnetization, yet its full field-dependent thermodynamics remains unknown in closed form. We develop the high-temperature expansion of its free energy while retaining the dependence on a uniform magnetic field at every order. We prove that, after a natural rescaling of the coupling, each coefficient is a rational polynomial in the squared hyperbolic tangent of the reduced field. Remarkably, at each order $n$ the field-dependent free-energy coefficient of a finite, periodically repeated ring is an exact polynomial of degree at most $n$ in $L^{-2}$. The infinite-chain coefficient is its constant term and can therefore be reconstructed from $n+1$ finite rings without numerical extrapolation. Using this reconstruction, we determine the full field-dependent expansion through order 26: 26 polynomials containing 377 rational coefficient entries. We further derive exact formulas, valid at every order, for the coefficients of the two highest powers of the field variable using matching determinants and a cycle-Laplacian reduction. These results reveal an unexpected algebraic structure in the microscopic thermodynamics of the inverse-square chain and provide high-order information about its magnetic response.", "url": "https://arxiv.org/abs/2610.39815", "type": "数值", "summary": "具有平方反比相互作用的一维伊辛链是一个典型的长程系统：它表现出不寻常的 Thouless 转变，自发磁化强度不连续，但其完全依赖于场的热力学在封闭形式中仍然未知。我们开发了其自由能的高温膨胀，同时保留了每个阶对均匀磁场的依赖性。我们证明，在耦合的自然重新调整之后，每个系数都是简化场的平方双曲正切的有理多项式。值得注意的是，在每个阶 $n$ 上，有限周期性重复环的场相关自由能系数是 $L^{-2}$ 中至多 $n$ 次的精确多项式。无限链系数是其常数项，因此可以从 $n+1$ 有限环重建，无需数值外推。使用此重建，我们通过 26 阶确定完全场相关展开：包含 377 个有理系数项的 26 个多项式。\n\n我们进一步使用匹配行列式和循环拉普拉斯约简，针对场变量的两个最高幂的系数导出在每个阶都有效的精确公式。这些结果揭示了平方反比链的微观热力学中意想不到的代数结构，并提供了有关其磁响应的高阶信息。", "authors": [{"name": "M. A. Rajabpour"}], "featured_authors": [{"name": "M. A. Rajabpour"}], "author_count": 1}, {"id": "2610.39886", "category": "cond-mat", "title": "Quantum Hamiltonian time crystals from covariant quantum Landau--Lifshitz--Gilbert relaxation", "abstract": "Classical Hamiltonian time crystals are constrained energy minima that move along symmetry orbits at frequencies set by Lagrange multipliers. We construct quantum counterparts by minimizing the energy over density matrices with fixed spectrum and charge expectations. A symmetry-covariant quantum Landau--Lifshitz--Gilbert equation selects them as periodic attractors, preserving the spectrum and fixing the multipliers dynamically. A chiral spin trimer motivated by Cu$_3$ molecular magnets realizes this motion at a prepared magnetization, without a Zeeman term.", "url": "https://arxiv.org/abs/2610.39886", "type": "理论", "summary": "经典哈密顿时间晶体是受限能量最小值，以拉格朗日乘数设定的频率沿对称轨道移动。我们通过最小化具有固定光谱和电荷期望的密度矩阵的能量来构造量子对应物。对称协变量子朗道-利夫希茨-吉尔伯特方程选择它们作为周期性吸引子，保留频谱并动态固定乘数。由 Cu$_3$ 分子磁体驱动的手性自旋三聚体在准备好的磁化强度下实现了这种运动，无需塞曼项。", "authors": [{"name": "Antti J. Niemi"}], "featured_authors": [{"name": "Antti J. Niemi"}], "author_count": 1}, {"id": "2610.39894", "category": "cond-mat", "title": "Excitons in solid molecular hydrogen from quantum Monte Carlo", "abstract": "We use quantum Monte Carlo (QMC) methods to investigate the lowest neutral excitation of solid molecular hydrogen in phase-I under increasing compression, with emphasis on structural and response properties. We employ QMC wave functions for the excited state that feature only a single orbital substitution, or a multideterminant expansion including every single particle-hole transition, and compare the results with the Bethe-Salpeter equation (BSE) and time-dependent density-functional theory (TDDFT). We examine a number of nuclear configurations representing thermal and quantum fluctuations. The effect of the multideterminant expansion is marginal on the QMC excitation energies but crucial on the exciton localization and related quantities, irrespective of full optimization and imaginary time projection. In the strong insulating regime at low density, multideterminant QMC results match and in some cases surpass the degree of localization afforded by BSE. A similar trend is observed for transition dipole moments and excitation-induced forces, with generally good agreement between QMC and BSE but marked discrepancies for nuclear configurations where localization differs significantly. TDDFT generally gives a more extended exciton with correspondingly weaker transition dipole moments. These differences decrease upon compression, as the system approaches a semiconducting regime where multiple particle-hole transitions are less important.", "url": "https://arxiv.org/abs/2610.39894", "type": "理论+数值", "summary": "我们使用量子蒙特卡罗 (QMC) 方法来研究在增加压缩下第一相固体分子氢的最低中性激发，重点是结构和响应特性。我们对激发态采用 QMC 波函数，该波函数仅具有单个轨道替换或多行列式展开，包括每个单个粒子-空穴跃迁，并将结果与​​ Bethe-Salpeter 方程 (BSE) 和瞬态密度泛函理论 (TDDFT) 进行比较。我们研究了许多代表热涨落和量子涨落的核构型。多行列式展开式对 QMC 激发能的影响很小，但对激子局域化和相关量至关重要，无论完全优化和虚时间投影如何。在低密度的强绝缘状态下，多决定性 QMC 结果匹配甚至在某些情况下超过 BSE 提供的定位程度。\n\n对于跃迁偶极矩和激发诱导力也观察到类似的趋势，QMC 和 BSE 之间总体上具有良好的一致性，但对于定位显着不同的核构型存在明显差异。 TDDFT 通常会产生更扩展的激子，相应地具有更弱的跃迁偶极矩。当系统接近半导体状态时，这些差异在压缩时减小，其中多个粒子-空穴转变不太重要。", "authors": [{"name": "Edgar Josué Landinez Borda"}, {"name": "Ravindra Shinde"}, {"name": "Claudia Filippi"}, {"name": "Markus Holzmann"}, {"name": "Saverio Moroni"}], "featured_authors": [{"name": "Edgar Josué Landinez Borda"}, {"name": "Ravindra Shinde"}, {"name": "Claudia Filippi"}, {"name": "Markus Holzmann"}, {"name": "Saverio Moroni"}], "author_count": 5}, {"id": "2610.39909", "category": "cond-mat", "title": "Kelvin-Wave Multiplication by Sound Emission", "abstract": "A subsonic Kelvin quantum can emit a phonon and split into two softer quanta, increasing Kelvin population while losing energy. In the soft-phonon limit, rotational invariance relates the leading acoustic shear amplitude, odd under reversal of phonon axial momentum, to the energy released. Microscopic calculations support this dispersion dependence. In a reflecting cavity with coherent sound and Kelvin seeds, Gross--Pitaevskii evolution shows Kelvin gain, larger mean-square displacement and smaller mean-square slope; a $\\pi$ shift of the initial sound phase reverses these changes.", "url": "https://arxiv.org/abs/2610.39909", "type": "数值", "summary": "亚音速开尔文量子可以发射声子并分裂成两个较软的量子，在损失能量的同时增加开尔文布居数。在软声子极限中，旋转不变性将声子轴向动量反转下的奇数主导声剪切振幅与释放的能量相关联。微观计算支持这种色散依赖性。在具有相干声和开尔文种子的反射腔中，Gross-Pitaevskii演化表现出开尔文增益、较大的均方位移和较小的均方斜率；初始声音相位的 $\\pi$ 偏移会逆转这些变化。", "authors": [{"name": "Weican Yang"}], "featured_authors": [{"name": "Weican Yang"}], "author_count": 1}, {"id": "2610.39929", "category": "cond-mat", "title": "Ensemble-dependent effect of disorder on multicritical points in a system with long-range interactions", "abstract": "We introduce two variants of the Blume--Emery--Griffiths model with long-range, mean-field-like interactions and quenched disorder. Although the two variants are described by different Hamiltonians, they yield the same free energy. Moreover, both Hamiltonians lead to the same average energy and hence to the same microcanonical entropy. The canonical and microcanonical phase boundaries differ markedly, and so does the multicritical behaviour of the two ensembles. In the microcanonical ensemble, tricritical points appear for any fraction of active spins, whereas in the canonical ensemble they emerge only when this fraction is sufficiently large. At lower fractions, canonical critical endpoints arise instead. We also report the formation of gaps in the entropy as a function of magnetization, another manifestation of ensemble inequivalence.", "url": "https://arxiv.org/abs/2610.39929", "type": "理论", "summary": "我们引入了 Blume-Emery-Griffiths 模型的两种变体，具有长程、类平均场相互作用和猝灭无序。尽管这两种变体由不同的哈密顿量描述，但它们产生相同的自由能。此外，两个哈密顿量都导致相同的平均能量，因此导致相同的微正则熵。正则相界和微正则相界显着不同，两个系综的多临界行为也有显着差异。在微正则系综中，三临界点出现在活跃自旋的任何部分，而在正则系综中，只有当该部分足够大时，它们才会出现。在较低的分数下，会出现典型的关键终点。我们还报告了作为磁化强度函数的熵间隙的形成，这是系综不等价的另一种表现。", "authors": [{"name": "Nir Schreiber"}, {"name": "Reuven Cohen"}], "featured_authors": [{"name": "Nir Schreiber"}, {"name": "Reuven Cohen"}], "author_count": 2}, {"id": "2610.39943", "category": "cond-mat", "title": "Monte Carlo simulation of mixed spin-orbit ordering", "abstract": "The effect of a magnetic field on the thermodynamic properties of the Kugel-Khomskii model with maximal entanglement using the quasi-classical Monte Carlo method with the heat bath algorithm. The temperature dependencies of single-site correlators show that the application of a magnetic field results in non-zero magnetization and the simultaneous appearance of an orbital ordering at the same point in the Brillouin zone where a non-zero spin-orbit correlator exists.", "url": "https://arxiv.org/abs/2610.39943", "type": "理论+数值", "summary": "使用准经典蒙特卡罗方法和热浴算法，研究磁场对具有最大纠缠的 Kugel-Khomskii 模型热力学性质的影响。单点相关器的温度依赖性表明，磁场的应用会导致非零磁化，并且在布里渊区中存在非零自旋轨道相关器的同一点同时出现轨道排序。", "authors": [{"name": "Yu. D. Panov"}, {"name": "V.A. Ulitko"}], "featured_authors": [{"name": "Yu. D. Panov"}, {"name": "V.A. Ulitko"}], "author_count": 2}, {"id": "2610.39961", "category": "cond-mat", "title": "Microscopic Mechanism and Control of Reentrant Localization", "abstract": "Increasing quasiperiodic modulation can restore extended states after localization, raising the question of how the same modulation drives both localization and recovery. We identify a microscopic mechanism in quasiperiodic dimer chains by resolving scattering between Fourier channels. Specifically, scattering into neighboring channels and back shifts the spectral edge relative to a localization boundary determined by a neutral auxiliary resonance. Their successive crossings drive the same spectral packet with fixed integrated-density-of-states (IDS) labels into localization and back into an extended regime. This recovery persists across finite parameter ranges in both gap-opening families, including relative-phase detuning. Furthermore, an exact sublattice mapping enables compensated control of the recovery window and predicts recovery thresholds for individual IDS labels.", "url": "https://arxiv.org/abs/2610.39961", "type": "理论", "summary": "增加准周期调制可以在本地化后恢复扩展状态，这就提出了相同的调制如何驱动本地化和恢复的问题。我们通过解决傅立叶通道之间的散射来确定准周期二聚体链中的微观机制。具体而言，散射到相邻通道中并使频谱边缘相对于由中性辅助谐振确定的定位边界向后移动。它们的连续交叉将具有固定集成状态密度（IDS）标签的相同光谱包驱动到本地化并返回到扩展状态。这种恢复在两个带隙开放族的有限参数范围内持续存在，包括相对相位失谐。此外，精确的子晶格映射可以对恢复窗口进行补偿控制，并预测各个 IDS 标签的恢复阈值。", "authors": [{"name": "Pei-Jie Chang"}, {"name": "Quanfeng Lu"}, {"name": "Wentao Yang"}, {"name": "Dong Ruan"}, {"name": "Gui-Lu Long"}], "featured_authors": [{"name": "Pei-Jie Chang"}, {"name": "Quanfeng Lu"}, {"name": "Wentao Yang"}, {"name": "Dong Ruan"}, {"name": "Gui-Lu Long"}], "author_count": 5}, {"id": "2610.39969", "category": "cond-mat", "title": "Selective effects of selenium substitution on superconductivity and magnetic memory in 4Hb-TaS2", "abstract": "Disorder plays a central role in correlated quantum materials, but its effects can be highly selective when several electronic orders coexist. The van der Waals heterostructure 4Hb-TaS2 provides such a case, combining superconductivity, charge-order tendencies, strong scattering, and magnetic memory manifested through spontaneous vortices. Here we use Se substitution as a controlled local perturbation of the disorder landscape in 4Hb-TaS2. We find that superconductivity remains remarkably robust while the magnetic memory is strongly suppressed at higher Se concentrations. These results show that Se substitution does not create the hidden magnetic memory, but instead selectively weakens its macroscopic manifestation. More broadly, they reveal a sharp separation between robust superconducting and hidden-memory phases, and a highly disorder-sensitive spontaneous-vortex response in 4Hb-TaS2.", "url": "https://arxiv.org/abs/2610.39969", "type": "理论", "summary": "无序在相关量子材料中起着核心作用，但当多个电子序共存时，其影响可能具有高度选择性。范德华异质结构 4Hb-TaS2 提供了这样的情况，它结合了超导性、电荷有序倾向、强散射和通过自发涡旋表现的磁记忆。在这里，我们使用 Se 替代作为 4Hb-TaS2 中无序景观的受控局部扰动。我们发现超导性仍然非常稳健，而磁记忆在较高的 Se 浓度下受到强烈抑制。这些结果表明，Se替代并没有产生隐藏的磁记忆，而是选择性地削弱了其宏观表现。更广泛地说，它们揭示了鲁棒超导相和隐藏记忆相之间的明显分离，以及 4Hb-TaS2 中高度紊乱敏感的自发涡旋响应。", "authors": [{"name": "Shalev Gur"}, {"name": "Sajilesh K.P."}, {"name": "Shubam Purwar"}, {"name": "Irena Feldman"}, {"name": "Ilay Mangel"}, {"name": "Nitzan Ragoler"}, {"name": "Amit Kanigel"}, {"name": "Beena Kalisky"}], "featured_authors": [{"name": "Shalev Gur"}, {"name": "Sajilesh K.P."}, {"name": "Shubam Purwar"}, {"name": "Nitzan Ragoler"}, {"name": "Amit Kanigel"}, {"name": "Beena Kalisky"}], "author_count": 8}, {"id": "2610.39986", "category": "cond-mat", "title": "Thermodynamic Crossovers in Supercritical Matter: One, No One, and One Hundred Thousand", "abstract": "Beyond a critical point, two thermodynamic phases become continuously connected, without being separated by any thermodynamic singularity. The paradigmatic example is the liquid-gas transition, where several criteria have been proposed to distinguish liquid-like and gas-like regimes within the supercritical region. Recently, a pair of thermodynamic crossover lines, $L^\\pm$, was introduced to address a proposed incompatibility of previous definitions with the universal critical behavior of the Ising model. These lines divide the supercritical region into three regimes, meet only at the critical point, and obey the expected critical scaling laws. Here, we demonstrate that these requirements do not uniquely determine the crossover boundaries. Instead, infinitely many pairs of lines satisfy the same conditions, with different choices of thermodynamic paths selecting different crossover boundaries. We further show that the Lee-Yang formalism, despite providing an intrinsic characterization of critical singularities, does not resolve this ambiguity in defining real-axis crossover boundaries. Restricting to regular probing paths that respect the $Z_2$ symmetry of the critical point recovers the Widom and $L^\\pm$ prescriptions asymptotically. This restriction, however, is a choice of protocol rather than a property of the system, and even then two inequivalent prescriptions survive. Our results demonstrate that universal critical behavior alone does not select privileged supercritical thermodynamic crossover boundaries. While such lines may identify physically meaningful changes in thermodynamic, structural, or transport properties, their precise locations and the widths of the regions they delimit remain dependent on the operational criteria used to define them.", "url": "https://arxiv.org/abs/2610.39986", "type": "理论", "summary": "超过临界点，两个热力学相变得连续连接，不会被任何热力学奇点分开。典型的例子是液-气转变，其中提出了几个标准来区分超临界区域内的类液体和类气体状态。最近，引入了一对热力学交叉线 $L^\\pm$，以解决先前定义与伊辛模型的普遍临界行为的不兼容问题。这些线将超临界区域分为三个区域，仅在临界点相交，并遵守预期的临界缩放定律。在这里，我们证明这些要求并不能唯一地确定交叉边界。相反，无限多对线满足相同的条件，不同的热力学路径选择会选择不同的交叉边界。我们进一步表明，李杨形式主义尽管提供了关键奇点的内在特征，但并没有解决定义实轴交叉边界时的这种模糊性。\n\n限制为尊重临界点 $Z_2$ 对称性的常规探测路径可以渐近地恢复 Widom 和 $L^\\pm$ 规定。然而，这种限制是协议的选择，而不是系统的属性，即使这样，两个不等价的规定仍然存在。我们的结果表明，普遍的临界行为本身并不能选择特权的超临界热力学交叉边界。虽然这些线可以识别热力学、结构或传输特性的物理上有意义的变化，但它们的精确位置和它们所界定的区域的宽度仍然取决于用于定义它们的操作标准。", "authors": [{"name": "Yang Xu"}, {"name": "Matteo Baggioli"}], "featured_authors": [{"name": "Yang Xu"}, {"name": "Matteo Baggioli"}], "author_count": 2}, {"id": "2610.39994", "category": "cond-mat", "title": "Non-Bloch Dynamical Quantum Phase Transitions with Memory", "abstract": "Dynamical quantum phase transitions (DQPTs) of periodic chains are determined by real Bloch momenta. We identify non-Bloch DQPTs, which occur only in open chains and are determined by complex momenta instead. They arise in a Hermitian chain coupled to a simple substrate, whose memory is treated exactly, and originate from the point-gap winding number $W$ of the projected propagator: for $W\\neq0$, open boundaries change both the dynamical free energy and the critical times, even in the thermodynamic limit. We find that both follow from an analytic continuation to complex momenta, and show that $W$ can be measured by particle counting. This reveals a dynamical bulk-boundary correspondence, in which non-Hermitian topology emerges from Hermitian dynamics with memory.", "url": "https://arxiv.org/abs/2610.39994", "type": "理论", "summary": "周期链的动态量子相变 (DQPT) 由实数布洛赫动量决定。我们识别出非 Bloch DQPT，它们仅出现在开放链中，并且由复杂动量决定。它们出现在与简单基底耦合的埃尔米特链中，其记忆被精确处理，并源自投影传播器的点隙缠绕数 $W$：对于 $W\\neq0$，开放边界改变动态自由能和临界时间，即使在热力学极限下也是如此。我们发现两者都遵循复杂动量的解析延拓，并表明 $W$ 可以通过粒子计数来测量。这揭示了动态体边界对应关系，其中非厄米拓扑是从具有记忆的厄米动力学中产生的。", "authors": [{"name": "Zhesen Yang"}, {"name": "Wei-Wei Yang"}, {"name": "Henning Schomerus"}, {"name": "Jiangping Hu"}], "featured_authors": [{"name": "Zhesen Yang"}, {"name": "Wei-Wei Yang"}, {"name": "Henning Schomerus"}, {"name": "Jiangping Hu"}], "author_count": 4}, {"id": "2610.40059", "category": "cond-mat", "title": "Influence of pairing and correlations on transport properties in three-terminal superconducting nanostructure", "abstract": "We study the local and nonlocal charge transport properties of three-terminal nanostructure, consisting of the correlated quantum dot embedded between two metallic electrodes and superconductor. Using the linear response theory, we analyze interplay of the induced on-dot pairing with the correlation effects, inspecting their influence on the conductance and thermopower. Our calculations predict negative values of the nonlocal conductance and reversal of the Seebeck coefficient when the quantum dot ground state is represented by the BCS-type singlet configuration. These phenomena are realized when the subgap charge transport is predominantly contributed by the crossed Andreev scattering. In contrast, on the doublet side, we obtain signatures for the Kondo effect manifested by the low-temperature enhancement of the charge conductance and clearly evident in the thermopower. Such temperature-dependent local and nonlocal transport properties can unambiguously identify the specific configuration of the correlated quantum dot and reveal the rich physics emerging in the doublet-to-singlet crossover region.", "url": "https://arxiv.org/abs/2610.40059", "type": "理论+数值", "summary": "我们研究了三端纳米结构的局域和非局域电荷传输特性，该结构由嵌入两个金属电极和超导体之间的相关量子点组成。利用线性响应理论，我们分析了诱导的点上配对与相关效应的相互作用，检查它们对电导和热电势的影响。当量子点基态由 BCS 型单线态构型表示时，我们的计算预测非局部电导的负值和塞贝克系数的反转。当亚能隙电荷传输主要由交叉安德烈夫散射贡献时，这些现象就会实现。相比之下，在双峰侧，我们获得了近藤效应的特征，其表现为电荷电导的低温增强，并且在热电势中清晰可见。这种与温度相关的局域和非局域输运特性可以明确地识别相关量子点的具体构型，并揭示双线到单线交叉区域中出现的丰富物理现象。", "authors": [{"name": "G. Górski"}, {"name": "V. Pokorný"}, {"name": "T. Domański"}], "featured_authors": [{"name": "G. Górski"}, {"name": "V. Pokorný"}, {"name": "T. Domański"}], "author_count": 3}, {"id": "2610.40060", "category": "cond-mat", "title": "Dynamical mean-field theory for associative memory with block-correlated patterns", "abstract": "In associative memories storing correlated patterns, retrieval of individual memories can compete with symmetric mixed states. A dynamical description is needed to determine how the initial state selects between these outcomes. We extend the generating-functional dynamical mean-field theory (DMFT) for independent patterns to independent blocks of correlated binary patterns of fixed finite size. The resulting effective single-neuron process has a self-consistent cross-talk noise covariance and self-feedback coefficients that depend on the block-covariance eigenvalues. For hierarchically correlated patterns with nonmonotonic transfer, increasing the loading can permit retrieval from an imperfect initial state before further loading prevents it. DMFT reproduces the retrieval trajectories and basin geometry found in direct simulations. Near the lower boundary of this re-entrant region, direct networks reveal stationary saddles separating coexisting mixed and target-retrieval states. Parameter sensitivities of DMFT trajectories predict nearby shifts of this boundary. At the tested upper boundary, retrieval remains accessible from initial states with larger target overlap, indicating a change in basin access. Under fixed-point convergence assumptions, the theory recovers the equations of generalized self-consistent signal-to-noise analysis.", "url": "https://arxiv.org/abs/2610.40060", "type": "理论+数值", "summary": "在存储相关模式的联想记忆中，个体记忆的检索可以与对称混合状态竞争。需要动态描述来确定初始状态如何在这些结果之间进行选择。我们将独立模式的生成函数动态平均场理论（DMFT）扩展到固定有限大小的相关二进制模式的独立块。由此产生的有效单神经元过程具有自洽的串扰噪声协方差和取决于块协方差特征值的自反馈系数。对于具有非单调传递的分层相关模式，增加加载可以允许在进一步加载阻止之前从不完美的初始状态进行检索。 DMFT 再现了直接模拟中发现的检索轨迹和盆地几何形状。在该重入区域的下边界附近，直接网络揭示了分隔共存混合状态和目标检索状态的固定鞍座。 DMFT 轨迹的参数敏感性预测该边界的附近移动。\n\n在测试的上边界，检索仍然可以从具有较大目标重叠的初始状态进行访问，这表明盆地访问发生了变化。在定点收敛假设下，该理论恢复了广义自洽信噪分析方程。", "authors": [{"name": "Andrea Callegaris"}, {"name": "Yoshiyuki Kabashima"}], "featured_authors": [{"name": "Andrea Callegaris"}, {"name": "Yoshiyuki Kabashima"}], "author_count": 2}, {"id": "2610.40066", "category": "cond-mat", "title": "Quantum Metric Scaling and Its Exceptions in Classical Flat Bands", "abstract": "The quantum metric length has been proposed as the localization length scale in one-dimensional flat bands. Here, we study this quantum metric scaling and the exceptions to it in a classical flat band formed by a locally resonant mass--spring system. We find that the localization length follows the quantum metric length near the flat band but departs from this proportionality at the exact flat-band frequency. Selective mass disorder also produces divergent localization lengths or arbitrarily short tails near the flat-band frequency without changing the clean metric. These exceptions show that disorder can select localization scales beyond those predicted by the quantum metric alone.", "url": "https://arxiv.org/abs/2610.40066", "type": "理论", "summary": "量子度量长度已被提议作为一维平带中的局域化长度尺度。在这里，我们研究了这种量子度量标度及其在由局部谐振质量弹簧系统形成的经典平带中的例外情况。我们发现，局域长度遵循平带附近的量子度量长度，但在精确的平带频率处偏离了这种比例。选择性质量无序还会在平带频率附近产生发散的定位长度或任意短的尾部，而不改变干净的度量。这些例外表明，无序可以选择超出仅由量子度量预测的定位尺度。", "authors": [{"name": "Kin Hung Fung"}, {"name": "K. T. Law"}, {"name": "C. T. Chan"}], "featured_authors": [{"name": "Kin Hung Fung"}, {"name": "K. T. Law"}, {"name": "C. T. Chan"}], "author_count": 3}, {"id": "2610.40093", "category": "cond-mat", "title": "Static Response of the Strongly Coupled Electron Gas from Diffusion Monte Carlo", "abstract": "The local field factor $G(q)$ of the HEG describes how exchange and correlation modify the response to a static perturbation, and enters dielectric screening, effective electron--electron interactions, and the xc kernel of TDDFT. Accurate zero-temperature data for $G(q)$, however, remain limited to metallic densities, $r_s\\leq10$. In this work, we present diffusion Monte Carlo calculations of the static density response function $\\chi(q)$ and of $G(q)$ for $2\\leq r_s\\leq100$, and describe and discuss the methodological steps that enabled these calculations. We show how optimization of the perturbing potential in the trial wave function has an important effect, as a poor choice can reverse the sign of the response. A closed-form expression is provided for its optimal value, together with the density dependence of the linear-response window. We further show that backflow correlations leave $\\chi(q)$ unchanged and that $G(q)$ depends only weakly on system size even at very low density, so that Slater--Jastrow wave functions and modest system sizes suffice. Together, these results provide a practical guide for future QMC calculations of response properties of the electron gas and real materials. Our results agree with previous DMC data at metallic densities for $q>k_F$, and extend them below $k_F$. They also agree with diagrammatic QMC at $r_s=2$. At lower densities, our results show that $G(q)$ develops a nonmonotonic structure at intermediate-$q$, where the response approaches that of the noninteracting gas. Quantitative agreement is seen with finite-temperature path integral Monte Carlo, suggesting that the previously reported finite-temperature structure is inherited from the ground state. Using a parametrization of $G(q)$ that reproduces our data throughout the liquid phase, we relate this structure to short-range order in the pair correlation function and the static structure factor.", "url": "https://arxiv.org/abs/2610.40093", "type": "数值", "summary": "HEG 的局部场因子 $G(q)$ 描述了交换和相关如何修改对静态扰动的响应，并进入电介质屏蔽、有效电子-电子相互作用和 TDDFT 的 xc 内核。然而，$G(q)$ 的准确零温度数据仍然仅限于金属密度 $r_s\\leq10$。在这项工作中，我们提出了静态密度响应函数 $\\chi(q)$ 和 $2\\leq r_s\\leq100$ 的 $G(q)$ 的扩散蒙特卡罗计算，并描述和讨论了实现这些计算的方法步骤。我们展示了试验波函数中扰动势的优化如何产生重要影响，因为错误的选择可能会反转响应的符号。提供了其最佳值的封闭式表达式以及线性响应窗口的密度依赖性。我们进一步表明，回流相关性使 $\\chi(q)$ 保持不变，并且即使在密度非常低的情况下，$G(q)$ 对系统尺寸的依赖也很弱，因此 Slater-Jastrow 波函数和适度的系统尺寸就足够了。\n\n总之，这些结果为未来电子气和真实材料响应特性的 QMC 计算提供了实用指南。我们的结果与先前在 $q>k_F$ 金属密度下的 DMC 数据一致，并将其扩展到 $k_F$ 以下。他们还同意 $r_s=2$ 的图解 QMC。在较低密度下，我们的结果表明 $G(q)$ 在中间 $q$ 处形成非单调结构，其中响应接近非相互作用气体的响应。与有限温度路径积分蒙特卡洛定量一致，表明先前报道的有限温度结构是从基态继承的。使用 $G(q)$ 的参数化来重现整个液相中的数据，我们将此结构与配对相关函数和静态结构因子中的短程顺序相关联。", "authors": [{"name": "Muhammed H. Güneş"}, {"name": "Yubo Yang"}, {"name": "Vitaly Gorelov"}, {"name": "Miguel A. Morales"}, {"name": "Matteo Gatti"}, {"name": "Lucia Reining"}, {"name": "Shiwei Zhang"}], "featured_authors": [{"name": "Muhammed H. Güneş"}, {"name": "Yubo Yang"}, {"name": "Vitaly Gorelov"}, {"name": "Matteo Gatti"}, {"name": "Lucia Reining"}, {"name": "Shiwei Zhang"}], "author_count": 7}, {"id": "2610.40104", "category": "cond-mat", "title": "Continuous tuning of quantum critical behavior in hybrid Josephson junction arrays", "abstract": "We report finite-temperature scaling of voltage-driven quantum phase transitions in hybrid Josephson junction arrays. A dual-gate geometry separately tunes interisland coupling and proximity-induced superconductivity, providing access to superconducting, insulating, and metallic transport regimes. The critical resistivity and scaling exponent evolve continuously with electrostatic tuning. Where the three regimes converge, the critical resistivity approaches $h/4e^2$, consistent with the self-dual limit, while the scaling exponent approaches the quantum-percolation estimate. Tuning toward stronger insulating behavior raises the critical resistivity and shifts the scaling exponent toward the classical-percolation value, while both parameters decrease toward the metallic regime. These results connect scaling regimes previously reported in different two-dimensional superconducting systems through continuous electrostatic control.", "url": "https://arxiv.org/abs/2610.40104", "type": "理论", "summary": "我们报告了混合约瑟夫森结阵列中电压驱动的量子相变的有限温度缩放。双栅极几何结构分别调节岛间耦合和邻近感应超导性，提供超导、绝缘和金属输运机制。临界电阻率和标度指数随着静电调谐而不断变化。在三种状态收敛的情况下，临界电阻率接近 $h/4e^2$，与自对偶极限一致，而标度指数接近量子渗流估计。向更强的绝缘行为调整会提高临界电阻率，并将标度指数向经典渗流值移动，而这两个参数都向金属状态下降。这些结果通过连续静电控制将先前报道的不同二维超导系统中的缩放机制联系起来。", "authors": [{"name": "E. Fugl"}, {"name": "L. L. Olsen"}, {"name": "S. Sasmal"}, {"name": "M. Efthymiou-Tsironi"}, {"name": "G. Nagda"}, {"name": "F. Krizek"}, {"name": "L. Casparis"}, {"name": "S. Vaitiekėnas"}], "featured_authors": [{"name": "E. Fugl"}, {"name": "L. L. Olsen"}, {"name": "S. Sasmal"}, {"name": "F. Krizek"}, {"name": "L. Casparis"}, {"name": "S. Vaitiekėnas"}], "author_count": 8}, {"id": "2610.40117", "category": "cond-mat", "title": "Adiabatic Variational Principle: Born-Oppenheimer Theory for Emergent Electronic-Order Dynamics", "abstract": "Recent advances in microscopic many-body methods have enabled increasingly accurate descriptions of equilibrium quantum states, yet large-scale simulations of emergent-order dynamics typically rely on phenomenological equations with prescribed free-energy functionals. We introduce the Adiabatic Variational Principle (AVP), a framework for deriving order-parameter dynamics directly from an interacting many-body Hamiltonian. When microscopic relaxation is fast compared with order-parameter evolution, the many-body state follows the collective configuration adiabatically, in analogy with the Born--Oppenheimer separation of electronic and nuclear motion. This assumption makes explicit the adiabatic closure implicit in conventional phase-field descriptions. Each instantaneous order-parameter configuration then defines a constrained quasi-stationary many-body state, and the Lagrange multipliers enforcing these constraints directly provide the thermodynamic forces driving the collective evolution. Nonlinear Mori--Zwanzig projection theory further connects the reversible dynamics to the microscopic algebra of the collective variables and relates dissipation and fluctuations to the eliminated degrees of freedom. Applications to charge- and spin-density-wave dynamics recover Allen--Cahn domain growth, resolve evolving domain networks together with their microscopic electronic structure, and yield generalized Landau--Lifshitz dynamics for itinerant magnetism. The AVP thus provides a solver-independent microscopic foundation for phase-field-like simulations of the nonequilibrium dynamics of emergent electronic order.", "url": "https://arxiv.org/abs/2610.40117", "type": "理论+数值", "summary": "微观多体方法的最新进展使得对平衡量子态的描述变得越来越准确，但涌现阶动力学的大规模模拟通常依赖于具有规定自由能泛函的唯象方程。我们介绍了绝热变分原理（AVP），这是一个直接从相互作用的多体哈密顿量导出序参数动力学的框架。当微观弛豫比有序参数演化快时，多体态绝热地遵循集体构型，类似于电子和核运动的玻恩-奥本海默分离。这一假设明确了传统相场描述中隐含的绝热闭包。然后，每个瞬时序参数配置定义了一个受约束的准稳态多体状态，并且强制执行这些约束的拉格朗日乘子直接提供了驱动集体演化的热力学力。\n\n非线性Mori-Zwanzig投影理论进一步将可逆动力学与集体变量的微观代数联系起来，并将耗散和波动与消除的自由度联系起来。电荷和自旋密度波动力学的应用恢复了 Allen-Cahn 域的生长，解析了演化域网络及其微观电子结构，并产生了巡回磁性的广义 Landau-Lifshitz 动力学。因此，AVP 为新兴电子秩序的非平衡动力学的类相场模拟提供了独立于求解器的微观基础。", "authors": [{"name": "Yang Yang"}, {"name": "Ali Rayat"}, {"name": "Ho Jang"}, {"name": "Yunhao Fan"}, {"name": "Sankha Subhra Bakshi"}, {"name": "Gia-Wei Chern"}], "featured_authors": [{"name": "Yang Yang"}, {"name": "Ali Rayat"}, {"name": "Ho Jang"}, {"name": "Yunhao Fan"}, {"name": "Sankha Subhra Bakshi"}, {"name": "Gia-Wei Chern"}], "author_count": 6}, {"id": "2610.40149", "category": "cond-mat", "title": "Spin-Orbit Coupling Response Theory within the Oriented Spin Space Group Framework", "abstract": "Spin-orbit coupling (SOC) plays a pivotal role in a broad range of phenomena in condensed matter physics. The recently developed spin space group theory offers a new perspective for characterizing the fundamental symmetry-breaking features of SOC-related phenomena, yet its full potential remains to be explored. Here, we provide a general framework that relates the SOC-induced symmetry breaking to modifications of physical properties and emergence of new physical effects. This approach incorporates the recently developed oriented spin space group (OSSG) formalism, which can explicitly describe the symmetry reduction induced by SOC. By parameterizing the SOC Hamiltonian using a SOC tensor that connects real and spin spaces, an expansion in terms of the SOC components can be constructed for the response tensor describing any physical quantity. This framework determines not only whether a SOC-induced response is symmetry allowed, but also the lowest order in SOC at which it emerges and its dependence on magnetic anisotropy. As representative applications, we analyze the magnetoelectric coupling in Type-II multiferroics and show that magnetically induced electric polarization in different systems can be the result of SOC effects of different orders, and can exhibit varying characteristics of magnetic anisotropy. We further apply this theory to the anomalous Hall effect and spin magnetization in antiferromagnets, demonstrating that their distinct transformation properties under the OSSG allow a large anomalous Hall response to coexist with weak spin magnetization. A high-throughput analysis of materials in the MAGNDATA database identifies several symmetry-based material classes favorable for this coexistence. Overall, the proposed framework provides a unified symmetr
