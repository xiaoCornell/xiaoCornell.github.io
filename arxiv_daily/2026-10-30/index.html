 "abstract": "This paper investigates a quantum relay-assisted free-space optical (FSO) communication system in which a decode-and-forward relay is powered by time-switching optical energy harvesting and forwards the decoded information using displaced squeezed signaling (DSS). To obtain a physically con sistent description of turbulence-induced loss for non-classical signaling, each hop is modeled as a pure-loss bosonic chan nel whose random transmissivity follows a truncated Gamma Gamma law, i.e., the Gamma-Gamma irradiance conditioned on the physically admissible range of a transmittance. Under this channel, coherent states remain pure, whereas squeezed states are mapped to mixed Gaussian states. Under Helstrom-optimal detection, the average error of the coherent hop is derived in exact Laplace-series form. For the DSS hop, we derive the output states, a closed-form Gaussian fidelity with rigorous two sided bounds on the Helstrom error, and prove the existence of a loss-aware optimal photon partition. Furthermore, we prove that optimized squeezing preserves both the turbulence-induced diversity order and the leading asymptotic constant of coherent relaying, so that its benefit is a finite-photon-budget effect, and that an interior throughput-optimal harvesting fraction exists. A covariance-preserving benchmark with an exact series representation yields an analytical upper bound on the achievable throughput whose absolute gap vanishes as the relay photon budget grows. Numerical results based on the exact mixed-state Helstrom error quantify the benefit of squeezing and the regime in which it is useful.", "url": "https://arxiv.org/abs/2610.39091", "type": "理论+数值", "summary": "本文研究了一种量子中继辅助的自由空间光 (FSO) 通信系统，其中解码转发中继由时间切换光能量收集提供动力，并使用移位压缩信令 (DSS) 转发解码信息。为了获得非经典信令中湍流引起的损耗的物理一致的描述，每一跳都被建模为纯损耗玻色子通道，其随机透射率遵循截断的伽马伽马定律，即以物理允许的透射率范围为条件的伽马-伽马辐照度。在此通道下，相干态保持纯净，而压缩态则映射到混合高斯态。在赫尔斯特罗姆最优检测下，相干跳的平均误差以精确的拉普拉斯级数形式导出。对于 DSS 跳跃，我们推导了输出状态，即在 Helstrom 误差上具有严格两侧边界的封闭形式高斯保真度，并证明了损失感知最优光子分区的存在。\n\n此外，我们证明优化的压缩保留了湍流引起的分集顺序和相干中继的领先渐近常数，因此其好处是有限光子预算效应，并且存在内部吞吐量最佳收获分数。具有精确序列表示的协方差保持基准产生了可实现吞吐量的分析上限，其绝对差距随着中继光子预算的增长而消失。基于精确混合状态赫尔斯特罗姆误差的数值结果量化了挤压的好处及其有用的状态。", "authors": [{"name": "Nizar Khalfet"}, {"name": "Francisco A. Monteiro"}, {"name": "Ioannis Krikidis"}], "featured_authors": [{"name": "Nizar Khalfet"}, {"name": "Francisco A. Monteiro"}, {"name": "Ioannis Krikidis"}], "author_count": 3}, {"id": "2610.39129", "category": "quant-ph", "title": "Reverse Quantum Annealing for Ground-State Energy Calculation in Molecule", "abstract": "We present the results of our reverse quantum annealing computations of the ground-state energies of alkaline-earth monofluoride molecules. By partitioning the Dirac--Coulomb electronic Hamiltonian into sub-QUBOs and refining forward-annealing solutions through optimized reverse-annealing schedules, residual configuration errors are systematically minimized. The electronic ground-state wave functions and energies are obtained using the Quantum Annealing Eigensolver algorithm. This work provides a pathway for achieving sub-milliHartree chemical accuracy and advancing molecular electronic structure calculations in the quantum annealing paradigm.", "url": "https://arxiv.org/abs/2610.39129", "type": "理论+数值", "summary": "我们展示了碱土一氟化物分子基态能量的反向量子退火计算结果。通过将狄拉克-库仑电子哈密顿量划分为子 QUBO，并通过优化的反向退火方案改进正向退火解决方案，系统地最小化了残余配置误差。使用量子退火本征求解器算法获得电子基态波函数和能量。这项工作为实现亚毫哈特里化学精度和推进量子退火范式中的分子电子结构计算提供了一条途径。", "authors": [{"name": "Pradyot Pritam Sahoo"}], "featured_authors": [{"name": "Pradyot Pritam Sahoo"}], "author_count": 1}, {"id": "2610.39136", "category": "quant-ph", "title": "Beyond energy bounds: comparing Schrödinger eigenstates", "abstract": "We derive eigenstate comparisons from ordered Schrödinger operators, extending energy bounds to overlaps, spatial distributions and nodes. For three form-ordered operators with discrete comparison ground states, suppose the upper ground-state energy lies in the lower operator's ground-state gap. Three comparison spectral values then bound all three squared ground-state overlaps and guarantee a simple discrete intermediate ground state. Related gap estimates control low-energy subspaces and individual excited-state overlaps under additional gap conditions. In one dimension and radially, a single crossing of the potential difference relative to the energy shift orders ground-state likelihood ratios and monotone observables; a nondecreasing difference suffices. The results cover asymmetric wells and shortened right Dirichlet walls, with coordinatewise comparisons for submodular reference potentials and coordinatewise nondecreasing perturbations. A two-sided Sturm argument orders corresponding internal nodes for nondecreasing potential differences, even between orthogonal one-dimensional excited states. For Yukawa ground states, Hulthén comparisons bound overlaps, radial moments and the density at the nucleus; the latter two-sided bounds hold for screening $0<\\delta<2/\\sqrt6$. Optimizing scaled Hulthén majorants gives a lower bound of approximately $1.13611$ for $n^2\\delta_c(n,0)$, where $\\delta_c(n,0)$ is the critical screening for the $n$th $s$-wave bound state. This bound is optimal within that two-parameter comparison family.", "url": "https://arxiv.org/abs/2610.39136", "type": "理论+数值", "summary": "我们从有序薛定谔算子导出本征态比较，将能量界限扩展到重叠、空间分布和节点。对于具有离散比较基态的三个形式有序算子，假设上部基态能量位于下部算子的基态间隙中。然后三个比较光谱值限制所有三个平方基态重叠并保证简单的离散中间基态。相关间隙估计控制附加间隙条件下的低能子空间和个体激发态重叠。在一维和径向上，相对于能量转移的电势差的单次交叉对基态似然比和单调可观测量进行排序；不减的差异就足够了。结果涵盖不对称孔和缩短的右狄利克雷壁，并对子模参考势和坐标非递减扰动进行坐标比较。两侧 Sturm 论证对相应的内部节点进行排序，以实现非递减的势差，即使在正交一维激发态之间也是如此。\n\n对于 Yukawa 基态，Hulthén 比较了边界重叠、径向矩和核处的密度；后两侧边界适用于筛选 $0<\\delta<2/\\sqrt6$。优化缩放 Hulthén 主态给出了 $n^2\\delta_c(n,0)$ 的下限，约为 $1.13611$，其中 $\\delta_c(n,0)$ 是第 $n$th $s$ 波束缚态的关键筛选。该界限在该二参数比较系列中是最佳的。", "authors": [{"name": "Xiao-Ke Wang"}, {"name": "Han Jia"}, {"name": "Shengjun Wu"}, {"name": "Zeng-Bing Chen"}], "featured_authors": [{"name": "Xiao-Ke Wang"}, {"name": "Han Jia"}, {"name": "Shengjun Wu"}, {"name": "Zeng-Bing Chen"}], "author_count": 4}, {"id": "2610.39138", "category": "quant-ph", "title": "Signatures of Narrowband and Ultrashort-Pulse-Like Probing in Coherent Anti-Stokes Raman Scattering Using Twin Beams and Sum-Frequency Generation Readout", "abstract": "We theoretically investigate coherent anti-Stokes Raman scattering (CARS) driven by bright twin beams with sum-frequency generation (SFG) readout. Expressing the SFG output in terms of quantum-field correlation functions yields multiple correlation structures with distinct properties associated with different interaction pathways on the bra and ket sides. Among them, frequency correlations between the CARS probe and SFG gating fields enable the two fields to act collectively as an effective narrowband probe, avoiding probe-induced spectral convolution. When this behavior appears on either the bra or ket side, the other retains Raman relaxation information as if probed by an ultrashort pulse.", "url": "https://arxiv.org/abs/2610.39138", "type": "理论", "summary": "我们从理论上研究了由明亮双光束驱动的相干反斯托克斯拉曼散射（CARS）和和频生成（SFG）读出。用量子场相关函数表达 SFG 输出会产生多个相关结构，这些结构具有与 bra 和 ket 侧不同相互作用路径相关的不同属性。其中，CARS 探针和 SFG 门控场之间的频率相关性使这两个场能够共同充当有效的窄带探针，避免探针引起的频谱卷积。当这种行为出现在胸罩或 ket 一侧时，另一侧会保留拉曼弛豫信息，就像受到超短脉冲探测一样。", "authors": [{"name": "Yujiro Eto"}, {"name": "Hideaki Kano"}, {"name": "Masahiro Takeoka"}], "featured_authors": [{"name": "Yujiro Eto"}, {"name": "Hideaki Kano"}, {"name": "Masahiro Takeoka"}], "author_count": 3}, {"id": "2610.39208", "category": "quant-ph", "title": "Force Sensing in a Recoverable Bosonic Quantum Memory", "abstract": "In continuous-variable quantum information, sensing and quantum error correction in the same mode face an intrinsic trade-off: sensors must accumulate weak external displacements, whereas bosonic codes typically suppress such shifts as errors. Here, we establish compatibility by constructing finite-energy bosonic codes that enable a single oscillator to sense an external force while actively protecting an unknown logical qubit. By encoding logical amplitudes across discrete wave-packet sites and capturing the force signal in a shared internal coordinate, we achieve an endpoint probe readout that is independent of the logical state under continuous photon loss $\\gamma$. Crucially, binomial site recovery cancels packet-dependent probe distortions alongside logical errors: for a $(2r+2)$-packet code, memory infidelity is suppressed to $O(\\gamma^{r+1})$ while residual memory-probe correlations scale as $O(\\gamma^{r+2})$. Finally, superconducting quantum circuit benchmarks under competing photon-number dephasing and Kerr nonlinearity identify preferred encoding regimes for hardware implementation.", "url": "https://arxiv.org/abs/2610.39208", "type": "理论", "summary": "在连续可变的量子信息中，同一模式下的传感和量子纠错面临着内在的权衡：传感器必须积累微弱的外部位移，而玻色码通常会抑制这种位移作为误差。在这里，我们通过构建有限能量玻色码来建立兼容性，该代码使单个振荡器能够感知外力，同时主动保护未知的逻辑量子位。通过对离散波包位点上的逻辑幅度进行编码并在共享内部坐标中捕获力信号，我们实现了与连续光子损失 $\\gamma$ 下的逻辑状态无关的端点探针读数。至关重要的是，二项式站点恢复消除了与数据包相关的探测失真和逻辑错误：对于 $(2r+2)$ 数据包代码，内存不忠实性被抑制为 $O(\\gamma^{r+1})$，而残余内存-探测相关性则按 $O(\\gamma^{r+2})$ 缩放。最后，竞争光子数相移和克尔非线性下的超导量子电路基准确定了硬件实现的首选编码机制。", "authors": [{"name": "Tairong Bai"}, {"name": "Wen Zheng"}, {"name": "Haoyang Cai"}, {"name": "Xianke Li"}, {"name": "Yangyang Ge"}, {"name": "Kun Zhou"}, {"name": "Xiangmin Yu"}, {"name": "Yu Zhang"}, {"name": "Shaoxiong Li"}, {"name": "Xinsheng Tan"}, {"name": "Jie Zhao"}, {"name": "Yang Yu"}], "featured_authors": [{"name": "Tairong Bai"}, {"name": "Wen Zheng"}, {"name": "Haoyang Cai"}, {"name": "Xinsheng Tan"}, {"name": "Jie Zhao"}, {"name": "Yang Yu"}], "author_count": 12}, {"id": "2610.39263", "category": "quant-ph", "title": "A VLSI-Like Design and Verification Flow for Quantum Circuits: A Case Study in PI Estimation", "abstract": "This paper proposes a VLSI-like design and verification flow for quantum circuit implementation, covering four levels: behavioral modeling, register-transfer level (RTL), gate level, and full-circuit integration with quantum algorithms. Using quantum Monte Carlo methods for pi estimation as a case study, the proposed flow provides a systematic path from initial specifications to large-scale quantum circuit implementation. The paper highlights two key contributions. First, quantum digital design supports a broad range of applications beyond predefined circuit templates. This capability is particularly important for application-specific operations in algorithms such as Shor's, Grover's, and quantum amplitude estimation (QAE), and can significantly advance fault-tolerant quantum computing (FTQC). Second, classical simulation shows that replacing random sampling with grid sampling can achieve a quadratic improvement in this pi-estimation case without quantum computation. This suggests that the quadratic speedup may arise from the grid sampling strategy rather than from the QAE circuit itself. By adapting conventional VLSI digital design principles, this four-level flow addresses a key bottleneck in quantum circuit design and enables flexible design initiation from multiple entry points, including specifications, RTL, and gate-level descriptions, paving the way for the practical deployment of quantum computing.", "url": "https://arxiv.org/abs/2610.39263", "type": "理论+数值", "summary": "本文提出了一种类似 VLSI 的量子电路实现设计和验证流程，涵盖四个层面：行为建模、寄存器传输级（RTL）、门级以及量子算法的全电路集成。使用量子蒙特卡罗方法进行 pi 估计作为案例研究，所提出的流程提供了从初始规范到大规模量子电路实现的系统路径。该论文强调了两个关键贡献。首先，量子数字设计支持预定义电路模板之外的广泛应用。此功能对于 Shor、Grover 和量子幅度估计 (QAE) 等算法中的特定于应用的操作尤其重要，并且可以显着推进容错量子计算 (FTQC)。其次，经典模拟表明，在这种无需量子计算的情况下，用网格采样代替随机采样可以在这种 pi 估计情况下实现二次改进。这表明二次加速可能来自网格采样策略，而不是来自 QAE 电路本身。\n\n通过采用传统的VLSI数字设计原理，这种四级流程解决了量子电路设计的关键瓶颈，并能够从规范、RTL和门级描述等多个入口点灵活启动设计，为量子计算的实际部署铺平了道路。", "authors": [{"name": "Yu-Ting Kao"}, {"name": "Yeong-Jar Chang"}], "featured_authors": [{"name": "Yu-Ting Kao"}, {"name": "Yeong-Jar Chang"}], "author_count": 2}, {"id": "2610.39296", "category": "quant-ph", "title": "NAKO: A Benchmarking Framework for Evaluating and Diagnosing Neutral-Atom Quantum Compilers", "abstract": "Reconfigurable neutral-atom processors couple gate scheduling, atom placement, and parallel atom transport, so compiler decisions jointly determine physical execution costs. Evaluating these compilers requires attainable resource references and a way to trace excess costs to their causes. We present NAKO, a benchmarking framework that parameterizes circuits by qubit count, logical depth, and requested one- and two-qubit gate densities, and assigns attainable targets for Rydberg stages, routing intervals, and movement layers. Each benchmark is paired with an executable reference schedule; under the stated execution model, construction guarantees minimum Rydberg-stage and routing-interval counts, and minimum movement among schedules with the minimum Rydberg-stage count. Comparing compiler outputs with these references quantifies resource gaps, while reference mappings and intermediate physical states enable controlled interventions that trace excess costs to specific compiler decisions. In a 648-run evaluation of Enola and OLSQ-DPQA, NAKO identifies distinct bottlenecks. For Enola, placement scoring and cross-stage layout management contribute to excess movement; diagnosis-guided interventions reduce mean movement by 78.9% across five matched circuits. For OLSQ-DPQA, premature candidate selection and limited exploration of preparatory states produce avoidable entangling stages and routing intervals; four fixed-checkpoint continuations each eliminate one Rydberg stage and one routing interval without increasing movement. NAKO thus links resource targets backed by constructive optimality guarantees to controlled diagnosis and validation of compiler-specific resource savings.", "url": "https://arxiv.org/abs/2610.39296", "type": "理论", "summary": "可重新配置的中性原子处理器将门调度、原子放置和并行原子传输结合起来，因此编译器决策共同决定物理执行成本。评估这些编译器需要可获得的资源引用以及追踪超额成本的原因的方法。我们提出了 NAKO，这是一种基准测试框架，它通过量子位计数、逻辑深度以及请求的一量子位和二量子位门密度对电路进行参数化，并为里德堡级、路由间隔和移动层分配可实现的目标。每个基准测试都配有可执行的参考时间表；在规定的执行模型下，构造保证最小里德堡阶段和路由间隔计数，以及具有最小里德堡阶段计数的调度之间的最小移动。将编译器输出与这些引用进行比较可以量化资源差距，而引用映射和中间物理状态可以实现受控干预，从而跟踪特定编译器决策的额外成本。在对 Enola 和 OLSQ-DPQA 进行 648 次运行的评估中，NAKO 发现了不同的瓶颈。\n\n对于 Enola 来说，安置评分和跨阶段布局管理会导致过度移动；诊断引导干预措施将五个匹配回路的平均运动减少了 78.9%。对于 OLSQ-DPQA，过早的候选选择和对准备状态的有限探索会产生可避免的纠缠阶段和路由间隔；四个固定检查点延续每个都消除了一个里德堡阶段和一个路由间隔，而不增加移动。因此，NAKO 将由建设性最优性保证支持的资源目标与特定于编译器的资源节省的受控诊断和验证联系起来。", "authors": [{"name": "Wenjie Sun"}, {"name": "Zhigang Wang"}, {"name": "Xiaoyu Li"}, {"name": "Desheng Zheng"}, {"name": "Lianhui Yu"}, {"name": "Geng Chen"}, {"name": "Guowu Yang"}], "featured_authors": [{"name": "Wenjie Sun"}, {"name": "Zhigang Wang"}, {"name": "Xiaoyu Li"}, {"name": "Lianhui Yu"}, {"name": "Geng Chen"}, {"name": "Guowu Yang"}], "author_count": 7}, {"id": "2610.39401", "category": "quant-ph", "title": "Pöschl-Teller type of Jaynes-Cummings Hamiltonians: SUSY transformations", "abstract": "The aim of this work is to define and investigate the generalized Jaynes-Cummings (JC) Hamiltonian by means of supersymmetric (SUSY) quantum mechanics methods. We have considered trigonometric and hyperbolic Pöschl-Teller (PT) potentials as two natural ingredients to modify the standard JC model. We show that these generalized JC Hamiltonians have a list of characteristics in common with the JC Hamiltonian, for example: matrix intertwining, excitation number symmetry, Rabi frequency, formulas for atomic inversion and classical and revival times. Therefore, we conclude that JC Hamiltonians can be considered as one example of a wider a class of generalized Hamiltonians which can be useful in broader interaction problems.", "url": "https://arxiv.org/abs/2610.39401", "type": "理论", "summary": "这项工作的目的是通过超对称 (SUSY) 量子力学方法来定义和研究广义 Jaynes-Cummings (JC) 哈密顿量。我们将三角和双曲 Pöschl-Teller (PT) 势视为修改标准 JC 模型的两种天然成分。我们证明这些广义 JC 哈密顿量具有一系列与 JC 哈密顿量相同的特征，例如：矩阵交织、激发数对称性、拉比频率、原子反转公式以及经典和复兴时间。因此，我们得出结论，JC 哈密顿量可以被视为一类更广泛的广义哈密顿量的一个例子，它可以在更广泛的相互作用问题中发挥作用。", "authors": [{"name": "İsmail Burak Ateş"}, {"name": "Şengül Kuru"}, {"name": "Javier Negro"}, {"name": "Efe Serbest"}], "featured_authors": [{"name": "İsmail Burak Ateş"}, {"name": "Şengül Kuru"}, {"name": "Javier Negro"}, {"name": "Efe Serbest"}], "author_count": 4}, {"id": "2610.39541", "category": "quant-ph", "title": "Optimal Linear Combination of Hamiltonian Simulation for Dissipative Dynamics", "abstract": "Linear combination of Hamiltonian simulation (LCHS) is an efficient method for simulating dissipative dynamics on quantum computers. The choice of the LCHS kernel controls the cost of the algorithm. We prove that the kernel family proposed by Ni and Ying~\\cite{NY26} minimizes the LCHS query cost in the minimax sense. For target accuracy $\\epsilon$, the minimum cost is asymptotically $\\frac{2\\mathrm{e}}{\\pi}(\\ln\\frac1\\epsilon-\\ln\\ln\\frac1\\epsilon+o(1))$, with optimal leading constant $\\frac{2\\mathrm{e}}{\\pi}$. Our lower-bound proof combines weak duality with a realization lemma that approximates extremal dual functions by matrix elements of dissipative evolutions.", "url": "https://arxiv.org/abs/2610.39541", "type": "理论+数值", "summary": "哈密​​顿模拟的线性组合（LCHS）是在量子计算机上模拟耗散动力学的有效方法。 LCHS 内核的选择控制着算法的成本。我们证明 Ni 和 Ying~\\cite{NY26} 提出的内核系列在极小极大意义上最小化了 LCHS 查询成本。对于目标精度$\\epsilon$，最小成本渐近为$\\frac{2\\mathrm{e}}{\\pi}(\\ln\\frac1\\epsilon-\\ln\\ln\\frac1\\epsilon+o(1))$，最优前导常数$\\frac{2\\mathrm{e}}{\\pi}$。我们的下界证明将弱对偶性与实现引理结合起来，该实现引理通过耗散演化的矩阵元素来近似极值对偶函数。", "authors": [{"name": "Hongkang Ni"}, {"name": "Lexing Ying"}], "featured_authors": [{"name": "Hongkang Ni"}, {"name": "Lexing Ying"}], "author_count": 2}, {"id": "2610.39577", "category": "quant-ph", "title": "Adiabatic training of VQAs for entanglement detection", "abstract": "This paper introduces a hybrid quantum framework for training Variational Quantum Algorithms (VQAs) aimed at addressing the fundamental problem of entanglement detection using adiabatic quantum computing. This problem is of foundational significance in quantum information science and has been approached through both classical and quantum methodologies. We propose an adiabatic-inspired optimization strategy for training VQAs, which combines a discretization of the parameter space with a hierarchical segmentation scheme. The optimization problem is formulated as a Quadratic Unconstrained Binary Optimization (QUBO) model to leverage the capabilities of quantum annealing. Preliminary results are compared against classical neural networks and conventional VQA training techniques. The findings aim to stimulate further investigation and discussion within the scientific community regarding the efficacy and applicability of the proposed approach.", "url": "https://arxiv.org/abs/2610.39577", "type": "理论+数值", "summary": "本文介绍了一种用于训练变分量子算法（VQA）的混合量子框架，旨在利用绝热量子计算解决纠缠检测的基本问题。这个问题在量子信息科学中具有基础意义，并且可以通过经典方法和量子方法来解决。我们提出了一种用于训练 VQA 的绝热优化策略，它将参数空间的离散化与分层分割方案相结合。优化问题被表述为二次无约束二元优化 (QUBO) 模型，以利用量子退火的功能。初步结果与经典神经网络和传统 VQA 训练技术进行了比较。研究结果旨在激发科学界对所提出方法的有效性和适用性进行进一步的调查和讨论。", "authors": [{"name": "E. Acosta"}, {"name": "C. Cano"}, {"name": "D. Manzano"}, {"name": "G. Botella"}], "featured_authors": [{"name": "E. Acosta"}, {"name": "C. Cano"}, {"name": "D. Manzano"}, {"name": "G. Botella"}], "author_count": 4}, {"id": "2610.39600", "category": "quant-ph", "title": "Probabilistic imaginary-time evolution via compiled diagonal representations", "abstract": "We introduce a probabilistic imaginary-time evolution scheme based on a compiled approximate diagonal representation of the Hamiltonian. A basis transformation is optimized offline. For a fixed compiled representation, the online circuit structure and gate count per attempt are independent of the imaginary time, and the same representation can be reused across different input states and evolution times. We derive a condition for enhanced success probability. Numerical tests show reduced online cost relative to termwise Pauli-based methods at a common accuracy threshold. We also examine how approximation errors and offline preparation costs affect the overall benefit.", "url": "https://arxiv.org/abs/2610.39600", "type": "理论+数值", "summary": "我们引入了一种基于哈密顿量的编译近似对角表示的概率虚时间演​​化方案。基础变换是离线优化的。对于固定的编译表示，在线电路结构和每次尝试的门数与虚时间无关，并且相同的表示可以在不同的输入状态和演化时间上重复使用。我们得出了提高成功概率的条件。数值测试表明，在通用精度阈值下，相对于基于泡利的逐项方法，在线成本降低。我们还研究了近似误差和离线准备成本如何影响整体效益。", "authors": [{"name": "Hengyue Li"}, {"name": "Huazhe Lou"}, {"name": "Yang Li"}, {"name": "Mingyu Huang"}, {"name": "Yusheng Yang"}, {"name": "Jianyong Sheng"}, {"name": "Jian Sun"}, {"name": "Shenggang Ying"}], "featured_authors": [{"name": "Hengyue Li"}, {"name": "Huazhe Lou"}, {"name": "Yang Li"}, {"name": "Jianyong Sheng"}, {"name": "Jian Sun"}, {"name": "Shenggang Ying"}], "author_count": 8}, {"id": "2610.39657", "category": "quant-ph", "title": "Detection and Inhibition of Decoherence Through Collisions: A dynamical approach", "abstract": "Quantum systems are intrinsically fragile and highly vulnerable to environmental noise, making the preservation of quantum states one of the fundamental challenges in realizing practical quantum technologies. We propose two noise-agnostic quantum state protection protocols based on a collisional model. The first protocol preserves quantum states of qubits without requiring complete prior knowledge of the underlying noise dynamics, and the second even protects a logical qubit under similar circumstances. These protocols provide robust protection for arbitrary single-qubit and entangled states against general noise processes. Furthermore, their capability to safeguard quantum states with an arbitrary number of qubits enhances the reliability, robustness, and scalability of emerging quantum architectures. These results establish the proposed framework as a promising approach for practical quantum information processing.", "url": "https://arxiv.org/abs/2610.39657", "type": "理论", "summary": "量子系统本质上是脆弱的，并且极易受到环境噪声的影响，这使得量子态的保存成为实现实用量子技术的基本挑战之一。我们提出了两种基于碰撞模型的与噪声无关的量子态保护协议。第一个协议保留了量子位的量子态，而不需要完全了解底层噪声动态，第二个协议甚至在类似情况下保护逻辑量子位。这些协议为任意单量子位和纠缠态提供了针对一般噪声过程的强大保护。此外，它们用任意数量的量子位保护量子态的能力增强了新兴量子架构的可靠性、鲁棒性和可扩展性。这些结果使所提出的框架成为实际量子信息处理的一种有前途的方法。", "authors": [{"name": "Sagnik Chakraborty"}, {"name": "Srijon Ghosh"}, {"name": "Federico Amato"}, {"name": "Gniewomir Sarbicki"}, {"name": "Dariusz Chruściński"}, {"name": "Rosario Lo Franco"}], "featured_authors": [{"name": "Sagnik Chakraborty"}, {"name": "Srijon Ghosh"}, {"name": "Federico Amato"}, {"name": "Gniewomir Sarbicki"}, {"name": "Dariusz Chruściński"}, {"name": "Rosario Lo Franco"}], "author_count": 6}, {"id": "2610.39702", "category": "quant-ph", "title": "Quantum Query Complexity of Tournament Solutions", "abstract": "A tournament solution records a set of winners from a tournament, that is, from the outcomes of all pairwise comparisons among $N$ alternatives. We study the quantum query complexity of computing tournament solutions when the outcome of each comparison has to be learned by a query. Classically, the picture is uniform: the Copeland set, the uncovered set and the top cycle all require $\\Theta(N^2)$ queries, and so does finding a single vertex of maximum out-degree. We show that the quantum query complexity of the top cycle can be computed with $\\tilde\\Theta(N)$ queries, and a Condorcet winner can be found with $\\tilde \\Theta(\\sqrt N)$ queries. Finding a strong king requires $\\Theta(N^{3/2})$ queries, the same as finding a vertex of maximum out-degree. We also give a self-contained alternative proof of the known $\\Theta(N^{3/2})$ bound for finding a vertex of maximum degree, established by Gilani, Mande, Patro, and Raja. Our lower bounds reduce counting problems to tournament problems using Ambainis's adversary method. For the top cycle, we find a Hamiltonian path and locate the prefix forming the top cycle by divide and conquer.", "url": "https://arxiv.org/abs/2610.39702", "type": "理论+数值", "summary": "锦标赛解决方案记录锦标赛中的一组获胜者，即来自 $N$ 替代方案之间所有成对比较的结果。当必须通过查询了解每次比较的结果时，我们研究计算锦标赛解决方案的量子查询复杂性。经典上，图片是统一的：谷轮集、未覆盖集和顶环都需要 $\\Theta(N^2)$ 查询，找到最大出度的单个顶点也需要 $\\Theta(N^2)$ 查询。我们证明了顶循环的量子查询复杂度可以通过 $\\tilde\\Theta(N)$ 查询来计算，并且可以通过 $\\tilde \\Theta(\\sqrt N)$ 查询找到孔多塞获胜者。寻找强王需要$\\Theta(N^{3/2})$查询，与寻找最大出度的顶点相同。我们还给出了由 Gilani、Mande、Patro 和 Raja 建立的已知 $\\Theta(N^{3/2})$ 界寻找最大度顶点的独立替代证明。我们的下界使用 Ambainis 的对手方法将计数问题简化为锦标赛问题。对于顶环，我们找到一条哈密顿路径，并通过分治法找到形成顶环的前缀。", "authors": [{"name": "Pragya Arora"}, {"name": "Udit Kumar"}], "featured_authors": [{"name": "Pragya Arora"}, {"name": "Udit Kumar"}], "author_count": 2}, {"id": "2610.39784", "category": "quant-ph", "title": "Non-Asymptotic Bounds via the Nussbaum-Szkoła Mapping for Quantum Hypothesis Testing", "abstract": "Quantum hypothesis testing concerns the discrimination between quantum states. This paper introduces novel lower and upper bounds for asymmetric quantum hypothesis testing based on the Nussbaum-Szkoła mapping. Together, these bounds provide a unified recovery of both converse and achievability results across all major asymptotic regimes, including large-, moderate-, and small-deviations. Unlike existing bounds, which either rely on technically involved information-spectrum arguments or suffer from fixed prefactors and limited applicability in the non-asymptotic regime, the proposed bounds arise from a unified framework and enable, in some cases, the direct use of classical results. It is further demonstrated that these bounds provide accurate approximations to the optimal quantum error trade-off function at small blocklengths. Numerical comparisons with existing bounds, including those based on fidelity and information spectrum methods, highlight their improved tightness.", "url": "https://arxiv.org/abs/2610.39784", "type": "理论+数值", "summary": "量子假设检验涉及量子态之间的区分。本文介绍了基于 Nussbaum-Szkoła 映射的非对称量子假设检验的新颖下限和上限。总之，这些界限提供了所有主要渐进机制（包括大偏差、中偏差和小偏差）的逆向结果和可实现性结果的统一恢复。与现有的界限不同，现有的界限要么依赖于技术上涉及的信息谱论证，要么受到固定的先决因素和非渐进机制中有限的适用性的影响，所提出的界限来自一个统一的框架，并且在某些情况下能够直接使用经典结果。进一步证明，这些界限为小块长度下的最佳量子误差权衡函数提供了精确的近似。与现有界限（包括基于保真度和信息谱方法的界限）的数值比较，突显了它们改进的紧密性。", "authors": [{"name": "Jorge Lizarribar-Carrillo"}, {"name": "Gonzalo Vazquez-Vilar"}, {"name": "Tobias Koch"}], "featured_authors": [{"name": "Jorge Lizarribar-Carrillo"}, {"name": "Gonzalo Vazquez-Vilar"}, {"name": "Tobias Koch"}], "author_count": 3}, {"id": "2610.39970", "category": "quant-ph", "title": "Bath-state (In)dependence of Non-Markovianity Measures in Quadratic Open Systems", "abstract": "Open quantum system dynamics fail to fulfill the conditions of the Markov approximation when the environment and system timescales are close to each other. Such behavior of these systems can be characterized by several non-Markovianity measures, which are expected to vary with the environment parameters. In this work, we consider a fermionic quadratic open quantum system, establishing bath-state independence of the Breuer--Laine--Piilo and the Lorenzo--Plastina--Paternostro non-Markovianity measures. However, our analytical results reveal that the entanglement-based and divisibility-based Rivas--Huelga--Plenio measures, as well as the entropic Megier--Smirne--Vacchini measure, remain sensitive to the reservoir state, through both its temperature and its chemical potential. Modeling the reservoir as a free-fermionic chain, we derive an exact time-local master equation for a single fermionic site in contact with it. Our numerical results for this model confirm these findings and show that the BLP and LPP measures vanish identically only on the bound-state threshold, where the bath-sensitive measures nevertheless remain finite.", "url": "https://arxiv.org/abs/2610.39970", "type": "理论+数值", "summary": "当环境和系统时间尺度彼此接近时，开放量子系统动力学无法满足马尔可夫近似的条件。这些系统的这种行为可以通过几种非马尔可夫性度量来表征，这些度量预计会随着环境参数而变化。在这项工作中，我们考虑费米子二次开放量子系统，建立 Breuer-Laine-Piilo 和 Lorenzo-Plastina-Paternostro 非马尔可夫性度量的浴态独立性。然而，我们的分析结果表明，基于纠缠和基于可分性的 Rivas--Huelga--Plenio 测度，以及熵 Megier--Smirne--Vacchini 测度，通过其温度和化学势仍然对储层状态敏感。将储层建模为自由费米子链，我们推导出与其接触的单个费米子位点的精确时间局部主方程。我们对该模型的数值结果证实了这些发现，并表明 BLP 和 LPP 测量仅在束缚态阈值上相同地消失，其中浴敏感测量仍然是有限的。", "authors": [{"name": "Mirko Consiglio"}, {"name": "Ilia Khomchenko"}, {"name": "Tony J. G. Apollaro"}], "featured_authors": [{"name": "Mirko Consiglio"}, {"name": "Ilia Khomchenko"}, {"name": "Tony J. G. Apollaro"}], "author_count": 3}, {"id": "2610.40158", "category": "quant-ph", "title": "Inevitability of the Petz transpose map", "abstract": "Bayes' rule is central to classical statistical inference: given a prior and a stochastic model, it determines the corresponding retrodictive conditional probabilities. In quantum theory, however, the question of whether an equally general rule of retrodiction exists and, if so, whether it is uniquely determined remains nontrivial. Here we prove that a retrodiction assignment defined for all priors and channels, which takes each predicted output state back to its prior, must coincide with the Petz transpose map if it is involutive, respects sequential and parallel composition, and agrees with unitary inversion. The theorem holds for channels between finite-dimensional full matrix algebras, with the input and output spaces restricted to the supports of the corresponding reference states. In particular, affinity under probabilistic mixtures and the characteristic square-root dependence on the reference states follow from these requirements rather than being postulated. Without involutivity, the remaining requirements characterize a family of doubly rotated Petz maps. Our result thus explains why the Petz transpose map arises in seemingly different areas of quantum theory: it is the unique quantum analogue of Bayes' rule compatible with these consistency requirements.", "url": "https://arxiv.org/abs/2610.40158", "type": "理论", "summary": "贝叶斯规则是经典统计推断的核心：给定先验和随机模型，它确定相应的追溯条件概率。然而，在量子理论中，是否存在同样普遍的追溯规则以及如果存在，它是否唯一确定的问题仍然很重要。在这里，我们证明了为所有先验和通道定义的回溯分配，它将每个预测的输出状态带回其先验，如果它是对合的，尊重顺序和并行组合，并且与酉反演一致，则它必须与 Petz 转置图一致。该定理适用于有限维全矩阵代数之间的通道，其中输入和输出空间仅限于相应参考状态的支持。特别是，概率混合下的亲和力以及对参考状态的特征平方根依赖性是从这些要求得出的，而不是假设的。在没有对合性的情况下，其余要求描述了一系列双旋转 Petz 映射的特征。\n\n因此，我们的结果解释了为什么佩兹转置图出现在看似不同的量子理论领域：它是贝叶斯规则的独特量子模拟，与这些一致性要求兼容。", "authors": [{"name": "Jacopo Surace"}, {"name": "Chenxu Li"}, {"name": "Francesco Buscemi"}], "featured_authors": [{"name": "Jacopo Surace"}, {"name": "Chenxu Li"}, {"name": "Francesco Buscemi"}], "author_count": 3}, {"id": "2610.40273", "category": "quant-ph", "title": "Bounds for General $(r,δ)$-Quantum Locally Recoverable Codes", "abstract": "We study general $(r,\\delta)$-quantum locally recoverable codes (qLRCs) without assuming purity or a stabilizer structure, and with arbitrarily overlapping recovery blocks. Using a selection lemma for multiple-erasure recovery, we establish a Singleton-like upper bound for general quantum subspaces. When $\\delta=2$, this bound reduces to the general single-erasure bound of Golowich and Guruswami. An integer optimization yields an explicit remainder correction that tightens the bound by up to $\\delta-2$. For pure codes, local decoupling and entropy arguments extend the parameter bound of Galindo et al., originally obtained for pure stabilizer codes constructed from Euclidean or Hermitian dual-containing classical codes, to arbitrary pure quantum subspaces. We also remove the partition assumption from several existing pure-code bounds for disjoint recovery blocks and obtain a further remainder correction by optimizing the budget. Finally, we analyze three families attaining these bounds: pure codes with overlapping recovery blocks and $d=\\delta$, which exhibit both a strict improvement of the pure-code bound and simultaneous equality in the pure-code and general bounds; impure codes with disjoint recovery blocks attaining the general bound; and an existing family of pure codes with overlapping recovery blocks and $d>\\delta$, which simultaneously attains all these bounds.", "url": "https://arxiv.org/abs/2610.40273", "type": "理论+数值", "summary": "我们研究一般的$(r,\\delta)$-量子局部可恢复码（qLRC），不假设纯度或稳定器结构，并且具有任意重叠的恢复块。使用多重擦除恢复的选择引理，我们为一般量子子空间建立了一个类似单例的上限。当$\\delta=2$时，这个界限减少到Golowich和Guruswami的一般单擦除界限。整数优化产生显式余数校正，将边界收紧至 $\\delta-2$。对于纯代码，局部解耦和熵参数将 Galindo 等人的参数界限扩展为任意纯量子子空间，该参数界限最初是针对由欧几里得或埃尔米特对偶经典代码构造的纯稳定器代码获得的。我们还从不相交恢复块的几个现有纯代码边界中删除了分区假设，并通过优化预算获得进一步的余数校正。\n\n最后，我们分析了达到这些边界的三个系列：具有重叠恢复块和 $d=\\delta$ 的纯代码，它们表现出纯代码边界的严格改进以及纯代码和一般边界的同时相等；具有不相交恢复块的不纯代码达到一般界限；以及具有重叠恢复块和 $d>\\delta$ 的现有纯代码系列，它同时达到所有这些界限。", "authors": [{"name": "Shuowei Ma"}, {"name": "Fei Shi"}], "featured_authors": [{"name": "Shuowei Ma"}, {"name": "Fei Shi"}], "author_count": 2}, {"id": "2610.40320", "category": "quant-ph", "title": "QDMin: Coherent Quantum Minimum Finding for Nuclear Deformation Landscapes", "abstract": "Locating the minimum of a nuclear collective landscape can require many interacting many-body calculations. QDMin (Quantum Deformation Minimum Finding) searches a parameterized Hamiltonian family with a coherent collective-coordinate register and an on-demand ground-energy threshold oracle. The oracle supplies the predicate required for quantum minimum-finding without first constructing the energy landscape point by point. We implement it for a schematic pairing-plus-multipole model using circuit-generated energy estimates during the search. In a four-point calculation, one Grover round raises the probability of the true minimum from 0.25 to 0.921. A $4\\times4$ quadrupole--octupole-field calculation extends the complete circuit to two coordinates, although its minimum is first sampled in a round with zero Grover iterations. Its worst-case branch-preparation fidelity of 0.744 falls below the declared target, identifying coherent ground-state access as the current bottleneck. QDMin inherits expected $O(\\sqrt{N_q})$ candidate-query scaling in the unstructured model; total advantage depends on the many-body oracle cost and remains unestablished.", "url": "https://arxiv.org/abs/2610.40320", "type": "理论+数值", "summary": "定位核集体景观的最小值可能需要许多相互作用的多体计算。 QDMin（量子形变最小查找）通过一致的集体坐标寄存器和按需地面能量阈值预言机搜索参数化哈密顿族。预言机提供了寻找量子最小值所需的谓词，而无需首先逐点构建能源景观。我们在搜索过程中使用电路生成的能量估计将其实现为示意性配对加多极模型。在四点计算中，一轮 Grover 会将真实最小值的概率从 0.25 提高到 0.921。 $4\\times4$ 四极-八极场计算将整个电路扩展到两个坐标，尽管其最小值首先在零 Grover 迭代的一轮中采样。最坏情况下的分支准备保真度为 0.744，低于声明的目标，将相干基态访问确定为当前瓶颈。 QDMin 继承了非结构化模型中预期的 $O(\\sqrt{N_q})$ 候选查询缩放比例；总优势取决于多体预言机成本，目前尚未确定。", "authors": [{"name": "Abhishek"}, {"name": "P. Arumugam"}], "featured_authors": [{"name": "Abhishek"}, {"name": "P. Arumugam"}], "author_count": 2}, {"id": "2610.40357", "category": "quant-ph", "title": "Subsystem Spacetime Code", "abstract": "Quantum error-correcting codes provide a powerful framework for analyzing and designing fault-tolerant Clifford circuits. In this work, we construct the subsystem spacetime code and use it to characterize the distances of Clifford circuits. We show that its gauge group can be explicitly constructed and classified using the masking properties of the instantaneous stabilizer groups and consists precisely of faults that are harmless to the circuit. We use this framework to identify where a dynamical code loses distance and to analyze how the fault distance changes when circuits are composed from smaller components. Our results provide a versatile tool for analyzing and designing fault-tolerant circuits, with potential applications to the construction of new dynamical codes.", "url": "https://arxiv.org/abs/2610.40357", "type": "理论", "summary": "量子纠错码为分析和设计容错 Clifford 电路提供了强大的框架。在这项工作中，我们构建了子系统时空代码并用它来表征克利福德电路的距离。我们表明，它的仪表组可以使用瞬时稳定器组的掩蔽特性来明确构建和分类，并且精确地包含对电路无害的故障。我们使用这个框架来识别动态代码在哪里丢失距离，并分析当电路由较小的组件组​​成时故障距离如何变化。我们的结果为分析和设计容错电路提供了一种多功能工具，并具有构建新动态代码的潜在应用。", "authors": [{"name": "Esther Xiaozhen Fu"}, {"name": "Aranya Chakraborty"}, {"name": "Daniel Gottesman"}], "featured_authors": [{"name": "Esther Xiaozhen Fu"}, {"name": "Aranya Chakraborty"}, {"name": "Daniel Gottesman"}], "author_count": 3}, {"id": "2610.40358", "category": "quant-ph", "title": "Quantum communication: a discrimination approach", "abstract": "We develop a state discrimination approach to unassisted quantum communication through a noisy quantum channel. Starting from the operational duality between entanglement recovery and state discrimination, we construct entanglement-generation codes with explicit decoders constructed from Petz recovery maps. The resulting error bounds hold for every number of channel uses and are expressed in terms of Petz-Rényi coherent information. For product sources, they yield exponential error decay at rates below coherent information.", "url": "https://arxiv.org/abs/2610.40358", "type": "理论", "summary": "我们开发了一种状态辨别方法，通过嘈杂的量子通道进行无辅助量子通信。从纠缠恢复和状态辨别之间的操作对偶性出发，我们使用由 Petz 恢复图构造的显式解码器构造纠缠生成码。所得到的误差界限对于每个通道使用次数都成立，并以 Petz-Rényi 相干信息的形式表示。对于产品源，它们以低于相干信息的速率产生指数误差衰减。", "authors": [{"name": "Hao-Chung Cheng"}], "featured_authors": [{"name": "Hao-Chung Cheng"}], "author_count": 1}, {"id": "2610.40361", "category": "quant-ph", "title": "Rapid mixing for Gibbs samplers for quantum spin systems with all-to-all interactions", "abstract": "Understanding when quantum many-body systems rapidly converge to thermal equilibrium is a central problem in quantum statistical mechanics. While spatial locality provides powerful tools for systems with an underlying geometry, fully connected models require estimates that accommodate interactions between every pair of spins. We study Gibbs-state preparation for two-local quantum Hamiltonians on arbitrary interaction graphs, including fully connected systems, via Lindblad dynamics that satisfies Kubo--Martin--Schwinger (KMS) detailed balance. Our approach is based on a quantum analogue of the classical Dobrushin condition, which controls the influence of local perturbations on the rest of the system. Using the quantum Wasserstein distance of order $1$, we quantify how these perturbations propagate under the dynamics and derive contraction estimates in a high-temperature regime controlled by the maximum total interaction strength per site. These estimates require no assumptions on spatial geometry or graph growth and yield mixing times logarithmic in the system size and the inverse error tolerance, uniformly over all initial states.", "url": "https://arxiv.org/abs/2610.40361", "type": "理论", "summary": "了解量子多体系统何时快速收敛到热平衡是量子统计力学的一个中心问题。虽然空间局部性为具有底层几何结构的系统提供了强大的工具，但完全连接的模型需要估计来适应每对自旋之间的相互作用。我们通过满足 Kubo-Martin-Schwinger (KMS) 详细平衡的 Lindblad 动力学，研究任意交互图（包括全连接系统）上的两个局域量子哈密顿量的吉布斯态准备。我们的方法基于经典多布鲁辛条件的量子模拟，它控制局部扰动对系统其余部分的影响。使用 1$ 量级的量子 Wasserstein 距离，我们量化了这些扰动在动力学下的传播方式，并得出了由每个位点最大总相互作用强度控制的高温状态下的收缩估计。这些估计不需要对空间几何或图形增长做出假设，并且在所有初始状态上均匀地产生系统大小的对数混合时间和逆误差容限。", "authors": [{"name": "Nicola Bertoni"}, {"name": "Giacomo De Palma"}], "featured_authors": [{"name": "Nicola Bertoni"}, {"name": "Giacomo De Palma"}], "author_count": 2}, {"id": "2610.40424", "category": "quant-ph", "title": "Structural Bottlenecks in QAOA Mixer Design: Transport and Causal Reach", "abstract": "The choice of mixer is a central design decision in the Quantum Approximate Optimization Algorithm (QAOA), yet different structural limitations of a mixer need not be captured by a single metric. We identify two complementary structural bottlenecks for shallow QAOA: configuration-space transport, which limits how strongly probability can concentrate on high-quality solutions, and finite-depth causal reach, which limits which parts of a problem instance can influence a local objective term. In Part I, we derive first-order mixer-dependent objective bounds in complementary small-$\\beta$ and small-$\\gamma$ regimes. For connected regular mixer graphs, the two leading-order expressions are exactly equivalent through a graph-Laplacian identity and reduce to the same cost-weighted Dirichlet energy. We then derive a non-perturbative upper envelope from the layer-wise $\\ell_1$ spreading of the mixer unitary, yielding a cost-distribution-dependent necessary spreading condition for attaining a target approximation ratio. In Part II, we study the locality bottleneck for MaxCut by augmenting the transverse-field mixer with problem-graph-aligned two-local interactions. The resulting $k$-hop construction has causal radius at most $(k+1)p$ at depth $p$; for the $k=1$ architectures studied numerically, this gives radius $2p$. Across cycles, circular ladders, and high-girth regular bipartite graphs, $X{+}XX$ and $X{+}YY$ improve the best-found approximation ratios over the standard $X$ mixer at equal depth, while $X{+}YY$ at depth $p$ comes within about one approximation-ratio point of plain $X$ at depth $2p$ in the reach-matched cases examined. The unequal performance of the equal-reach $XX$ and $YY$ augmentations shows that satisfying a structural capability does not by itself guarantee performance. Together, the results provide complementary structural insights for mixer design.", "url": "https://arxiv.org/abs/2610.40424", "type": "理论+数值", "summary": "混频器的选择是量子近似优化算法 (QAOA) 中的核心设计决策，但混频器的不同结构限制不需要通过单一指标来捕获。我们确定了浅层 QAOA 的两个互补的结构瓶颈：配置空间传输（它限制了概率集中在高质量解决方案上的强度）和有限深度因果范围（它限制了问题实例的哪些部分可以影响局部目标项）。在第一部分中，我们在互补的small-$\\beta$ 和small-$\\gamma$ 机制中推导出依赖于一阶混频器的目标边界。对于连接的规则混合器图，两个前导表达式通过图拉普拉斯恒等式完全相同，并减少到相同的成本加权狄利克雷能量。然后，我们从混频器酉的逐层 $\\ell_1$ 扩展中导出非扰动上包络，从而产生与成本分布相关的必要扩展条件，以获得目标近似比。在第二部分中，我们通过使用问题图对齐的两个局部相互作用增强横向场混合器来研究 MaxCut 的局部性瓶颈。\n\n由此产生的 $k$-hop 结构在深度 $p$ 处的因果半径至多为 $(k+1)p$；对于数值研究的 $k=1$ 架构，这给出了半径 $2p$。在循环、圆形梯子和高周长规则二部图上，$X{+}XX$ 和 $X{+}YY$ 改进了相同深度处标准 $X$ 混合器的最佳近似比，而在所检查的范围匹配情况下，深度 $p$ 处的 $X{+}YY$ 与深度 $2p$ 处的普通 $X$ 的近似比点相差约一个近似比点。等距 $XX$ 和 $YY$ 增强的不平等性能表明，满足结构能力本身并不能保证性能。总之，这些结果为混合器设计提供了补充的结构见解。", "authors": [{"name": "Jasjyot Singh Gulati"}, {"name": "Tharrmashastha SAPV"}], "featured_authors": [{"name": "Jasjyot Singh Gulati"}, {"name": "Tharrmashastha SAPV"}], "author_count": 2}, {"id": "2610.40446", "category": "quant-ph", "title": "A universal gauge structure in the photon content of light-matter systems", "abstract": "After truncating the matter Hilbert space of a single-mode light-matter model, gauge transformations leave the spectrum invariant whereas the ground-state photon number is gauge dependent, hence, its meaning remains disputed. We show that this gauge dependence obeys an exact algebraic law whenever the gauge transformation acts as a displacement of the field coupled to a matter operator $G$. Namely, the ground-state photon number is a quadratic polynomial in the gauge parameter $\\lambda$, $\\langle a^{\\dagger} a\\rangle_{\\lambda}$ $=$ $\\langle a^{\\dagger} a\\rangle_{0}$ $+$ $C\\lambda$ $+$ $Q\\lambda^2$. Here the coefficients are the correlator $C=\\langle G\\,p\\rangle$ of $G$ and the field momentum $p$, and $Q=\\langle G^2\\rangle$. Its minimum over all gauges is naturally gauge-invariant, and for the quantum Rabi model it is determined by the ground-state energy alone. We show that it is strictly positive for the quantum Rabi and Dicke models with level splitting, so that a residual photon content survives in every gauge. At weak coupling the gauge of minimal photon number is the Jaynes-Cummings gauge, and for the Dicke model it remains so at all couplings in the thermodynamic limit.", "url": "https://arxiv.org/abs/2610.40446", "type": "理论", "summary": "在截断单模光物质模型的希尔伯特空间后，规范变换使光谱不变，而基态光子数与规范相关，因此，其含义仍然存在争议。我们证明，只要规范变换充当耦合到物质算子 $G$ 的场的位移，这种规范依赖性就遵循精确的代数定律。即基态光子数是规范参数$\\lambda$中的二次多项式，$\\langle a^{\\dagger} a\\rangle_{\\lambda}$ $=$ $\\langle a^{\\dagger} a\\rangle_{0}$ $+$ $C\\lambda$ $+$ $Q\\lambda^2$。这里的系数是$G$和场动量$p$的相关器$C=\\langle G\\,p\\rangle$，以及$Q=\\langle G^2\\rangle$。它在所有规范中的最小值自然是规范不变的，对于量子拉比模型来说，它仅由基态能量决定。我们证明，对于具有能级分裂的量子拉比和迪克模型来说，它是严格正的，因此残余光子含量在每个规范中都存在。在弱耦合时，最小光子数的规范是 Jaynes-Cummings 规范，对于迪克模型来说，它在热力学极限的所有耦合下仍然如此。", "authors": [{"name": "Arka Dutta"}, {"name": "Marcus Kollar"}], "featured_authors": [{"name": "Arka Dutta"}, {"name": "Marcus Kollar"}], "author_count": 2}, {"id": "2610.40448", "category": "quant-ph", "title": "Process matrices on generalised theories", "abstract": "We extend the process-matrix framework for defining indefinite causal orders to a broad class of generalised physical theories. We give a simple re-axiomatisation of spacetime contexts in terms of naturality over classical probes, which precisely captures non-contextual assignment together with compatibility with convexity and coarse-graining within local laboratories. Using this compositional perspective, we give a clean characterisation of theories in which abstract spacetime contexts admit a process-matrix representation, and we pin down the precise conditions (satisfied by classical theory, quantum theory, and a Boxworld-like theory) under which the supermap and process-matrix perspectives on higher-order processes coincide.", "url": "https://arxiv.org/abs/2610.40448", "type": "理论", "summary": "我们将用于定义不确定因果顺序的过程矩阵框架扩展到广泛的广义物理理论。我们根据经典探针的自然性对时空上下文进行了简单的重新公理化，它精确地捕获了非上下文分配以及与当地实验室内的凸性和粗粒度的兼容性。使用这种组合视角，我们给出了理论的清晰表征，其中抽象时空背景承认过程矩阵表示，并且我们确定了高阶过程的超图和过程矩阵视角重合的精确条件（由经典理论、量子理论和类似盒子世界的理论满足）。", "authors": [{"name": "Matt Wilson"}, {"name": "James Hefford"}, {"name": "Timothée Hoffreumon"}], "featured_authors": [{"name": "Matt Wilson"}, {"name": "James Hefford"}, {"name": "Timothée Hoffreumon"}], "author_count": 3}, {"id": "2610.40459", "category": "quant-ph", "title": "Quantum-Walk Inspired Spectral Metrics for Evaluating QAOA Mixers", "abstract": "QAOA mixers play an important role in enabling exploration of the exponentially large solution space of binary optimization problems. However, the choice of mixer Hamiltonian is typically guided by convention and implementation or circuit constraints, rather than by a graph-topology-aware criterion. In this work, inspired by quantum-walk mixing theory, we propose two complementary spectral heuristics for characterizing QAOA mixer topologies. The first is the normalized minimum eigenvalue separation of the mixer Hamiltonian $H_M$, while the second is the long-time averaged minimum eigenvalue separation of the mixer unitary $U_M(\\beta)=e^{-i\\beta H_M}$. Both quantities are invariant under any positive rescaling of the mixer Hamiltonian and provide Hamiltonian- and unitary-level characterizations of the mixer's spectral structure. We use them as heuristic indicators of the mixer dynamics relevant to amplitude redistribution during QAOA evolution. We derive exact expressions and asymptotic bounds for the complete graph, hypercube, cycle, and balanced 2-D torus, revealing a broad spectral separation between the studied topology classes. We then compare these separations with empirical QAOA performance. For random permutation-invariant cost Hamiltonians, the observed performance ordering is broadly consistent with the spectral characterization. In contrast, for structured 1-D and 2-D Ising QUBOs, this ordering breaks down, indicating that mixer-cost alignment can become important. These results illustrate both the usefulness and the limitations of topology-level, cost-agnostic spectral heuristics for QAOA mixer selection.", "url": "https://arxiv.org/abs/2610.40459", "type": "理论+数值", "summary": "QAOA 混合器在探索二元优化问题的指数级大解空间方面发挥着重要作用。然而，混合器哈密顿量的选择通常由惯例和实现或电路约束来指导，而不是由图形拓扑感知标准来指导。在这项工作中，受量子行走混合理论的启发，我们提出了两种互补的谱启发式来表征 QAOA 混合器拓扑。第一个是混合器哈密顿量$H_M$的归一化最小特征值分离，第二个是混合器酉$U_M(\\beta)=e^{-i\\beta H_M}$的长期平均最小特征值分离。这两个量在混频器哈密顿量的任何正缩放下都是不变的，并提供混频器谱结构的哈密顿级和酉级特征。我们将它们用作与 QAOA 演化过程中幅度重新分布相关的混频器动态的启发式指标。我们推导了完整图、超立方体、循环和平衡二维环面的精确表达式和渐近边界，揭示了所研究的拓扑类别之间的广泛谱分离。\n\n然后，我们将这些分离与经验 QAOA 性能进行比较。对于随机排列不变成本哈密顿量，观察到的性能排序与谱表征大致一致。相比之下，对于结构化 1-D 和 2-D Ising QUBO，这种排序会被打破，这表明混合器成本调整可能变得很重要。这些结果说明了拓扑级、与成本无关的频谱启发法对于 QAOA 混频器选择的有用性和局限性。", "authors": [{"name": "Jasjyot Singh Gulati"}, {"name": "Tharrmashastha SAPV"}], "featured_authors": [{"name": "Jasjyot Singh Gulati"}, {"name": "Tharrmashastha SAPV"}], "author_count": 2}, {"id": "2610.40481", "category": "quant-ph", "title": "Lattice moments and quantum designs", "abstract": "We show that the ensemble of unimodular Gottesman$-$Kitaev$-$Preskill distributions fails to form a rigged quantum $3$-design and quantify the replica defect that determines this failure. This is established by rederiving a second moment formula for symplectic lattices in a self-contained manner.", "url": "https://arxiv.org/abs/2610.40481", "type": "理论", "summary": "我们证明单模 Gottesman$-$Kitaev$-$Preskill 分布的集合无法形成操纵的量子 $3$ 设计，并量化决定这种失败的副本缺陷。这是通过以独立的方式重新推导辛格的二阶矩公式来建立的。", "authors": [{"name": "Jonathan Conrad"}, {"name": "Kristian Holm"}], "featured_authors": [{"name": "Jonathan Conrad"}, {"name": "Kristian Holm"}], "author_count": 2}, {"id": "2610.40490", "category": "quant-ph", "title": "Fast and accurate neural triage decoding of ultra-high-rate quantum LDPC codes", "abstract": "Quantum error correction is essential for fault-tolerant quantum computing. High-rate quantum low-density parity-check (qLDPC) codes have emerged as a promising approach to reducing the substantial physical qubit overhead of quantum error correction, enabling encoding rates exceeding $1/2$ in blocks of approximately one thousand physical data qubits. However, their practical implementation requires decoders that combine high accuracy with low latency to keep pace with quantum hardware. Existing decoders of high-rate qLDPC codes can achieve high accuracy but often incur substantial computational latency, whereas neural network decoders have yet to be demonstrated for high-rate qLDPC codes. Here, we introduce \\emph{neural triage decoding}, a framework that uses syndrome consistency to adaptively allocate neural computation. A local neural message-passing network rapidly predicts error corrections, additional iterations reduce residual syndrome violations, and a rarely invoked diversification stage searches for consistent corrections to the remaining shots. We demonstrate that the \\texttt{Triage} decoder can decode ultra-high-rate qLDPC codes encoding a few hundred logical qubits, including lifted-product and Kasai codes, achieving state-of-the-art accuracy comparable to the near optimal algorithmic decoders while reducing decoding latency by approximately one to two orders of magnitude. Our framework is inspired by a rigorous analysis of the exact bitwise marginal decoder, revealing a distance-independent syndrome-inconsistent error floor. In addition, we show the robustness of neural network decoders to mismatched error priors. Our results establish adaptive neural decoding as a promising route towards fast, accurate, and scalable quantum error correction in the near term.", "url": "https://arxiv.org/abs/2610.40490", "type": "理论+数值", "summary": "量子纠错对于容错量子计算至关重要。高速量子低密度奇偶校验 (qLDPC) 码已成为一种有前途的方法，可减少量子纠错的大量物理量子位开销，使大约 1000 个物理数据量子位块的编码率超过 1/2$。然而，它们的实际实现需要兼具高精度和低延迟的解码器，以跟上量子硬件的步伐。现有的高速率 qLDPC 码解码器可以实现高精度，但通常会产生大量计算延迟，而神经网络解码器尚未针对高速率 qLDPC 码进行验证。在这里，我们引入 \\emph{神经分类解码}，一个使用综合症一致性来自适应分配神经计算的框架。局部神经消息传递网络快速预测错误纠正，额外的迭代减少残余综合症违规，并且很少调用的多样化阶段搜索对剩余镜头的一致纠正。\n\n我们证明了 Triage 解码器可以解码编码数百个逻辑量子位的超高速率 qLDPC 代码，包括提升乘积和 Kasai 代码，实现与接近最优算法解码器相当的最先进的精度，同时将解码延迟减少大约一到两个数量级。我们的框架受到对精确按位边缘解码器的严格分析的启发，揭示了与距离无关的综合症不一致的错误底限。此外，我们还展示了神经网络解码器对不匹配错误先验的鲁棒性。我们的研究结果表明，自适应神经解码是近期实现快速、准确和可扩展的量子纠错的一条有前途的途径。", "authors": [{"name": "Hong-Ye Hu"}, {"name": "Zhenlai Wang"}, {"name": "Binzhao Luo"}, {"name": "Tao Xiang"}, {"name": "Chen Zhao"}], "featured_authors": [{"name": "Hong-Ye Hu"}, {"name": "Zhenlai Wang"}, {"name": "Binzhao Luo"}, {"name": "Tao Xiang"}, {"name": "Chen Zhao"}], "author_count": 5}, {"id": "2610.40573", "category": "quant-ph", "title": "What Can Be Computed with Indefinite Causal Structure?", "abstract": "Can quantum computation become more powerful when operations do not need to follow a definite causal order? We study this question in the process matrix formalism of Oreshkov et al. (Nature Communications, 2012), which allows quantum operations to be connected without a fixed global order. In the computational model, a quantum circuit succinctly describes a process matrix, and the algorithm is given access to its generated channel, with computational cost measured by the size of the generating circuit. We give polynomial-time algorithms in two settings. First, general process matrix computation suffices to solve every problem in $\\textbf{NP}$. The valid processes used by our algorithm satisfy the purification postulate of Araújo et al. (Quantum, 2017), and their generated channels are unitary, although their generating circuits are not. Second, requiring the process matrices themselves to be pure, we give a polynomial-time algorithm for unique-sink orientation, a general problem capturing several longstanding computational problems in optimization. Our unitary generators are constructed explicitly and efficiently. Assuming that unique-sink orientation has no quantum polynomial-time algorithm, our result shows that indefinite causal order can provide computational power beyond $\\textbf{BQP}$ within the process matrix formalism, even while preserving unitarity.", "url": "https://arxiv.org/abs/2610.40573", "type": "理论+数值", "summary": "当运算不需要遵循明确的因果顺序时，量子计算能否变得更强大？我们在 Oreshkov 等人的过程矩阵形式主义中研究这个问题。 （Nature Communications，2012），它允许量子操作在没有固定全局顺序的情况下进行连接。在计算模型中，量子电路简洁地描述了一个过程矩阵，算法可以访问其生成的通道，计算成本由生成电路的大小来衡量。我们给出了两种设置下的多项式时间算法。首先，一般过程矩阵计算足以解决$\\textbf{NP}$中的每个问题。我们的算法使用的有效过程满足 Araújo 等人的纯化假设。 （Quantum，2017），并且它们生成的通道是单一的，尽管它们的生成电路不是单一的。其次，要求过程矩阵本身是纯的，我们给出了用于唯一汇方向的多项式时间算法，这是一个捕获优化中几个长期存在的计算问题的一般问题。我们的单一生成器是明确且高效地构建的。\n\n假设唯一汇方向没有量子多项式时间算法，我们的结果表明，即使在保持幺正性的情况下，不定因果顺序也可以在过程矩阵形式中提供超出 $\\textbf{BQP}$ 的计算能力。", "authors": [{"name": "Omri Shmueli"}], "featured_authors": [{"name": "Omri Shmueli"}], "author_count": 1}, {"id": "2610.40585", "category": "quant-ph", "title": "Classical communication over quantum channels: does entanglement help in nature?", "abstract": "Can entangling codewords across independent uses of a quantum channel improve the rate of classical communication? An old conjecture states that there is no such entanglement advantage for all channels. Although Hastings's result and follow-up works disproved this conjecture, it turns out that enormous dimension is required to construct a channel where entanglement enhances classical communication. This indicates that there might be no entanglement advantage for many physical channels, or for all low dimensional channels. Motivated by recent progress on (generalized) amplitude damping channels, we propose a general Schur-weighted block entropy inequality, and show that there is no entanglement advantage for all phase-covariant channels including multi-level amplitude damping channels, generalized dephasing channels, and damping-dephasing channels. As a by-product, we also recover the recently established result that there is no entanglement advantage for all qubit channels.", "url": "https://arxiv.org/abs/2610.40585", "type": "理论", "summary": "量子信道的独立使用中的纠缠码字能否提高经典通信的速率？一个古老的猜想指出，并非所有渠道都具有这种纠缠优势。尽管黑斯廷斯的结果和后续工作反驳了这一猜想，但事实证明，需要巨大的维度来构建纠缠增强经典通信的通道。这表明许多物理信道或所有低维信道可能不存在纠缠优势。受（广义）幅度阻尼通道最新进展的启发，我们提出了一种通用的 Schur 加权块熵不等式，并表明所有相位协变通道（包括多级幅度阻尼通道、广义移相通道和阻尼移相通道）都不存在纠缠优势。作为副产品，我们还恢复了最近确定的结果，即所有量子比特通道都不存在纠缠优势。", "authors": [{"name": "Peixue Wu"}], "featured_authors": [{"name": "Peixue Wu"}], "author_count": 1}, {"id": "2610.40592", "category": "quant-ph", "title": "Toric codes all the way down: decoupling translation-invariant topological CSS codes in higher dimensions", "abstract": "Topological Calderbank-Shor-Steane (CSS) codes in more than two spatial dimensions offer features useful for fault-tolerant quantum computation, such as transversal non-Clifford gates and single-shot decoding, but a systematic understanding of them is still lacking. One approach is to decouple a code: map it to a stack of higher-form toric codes by a finite-depth local CSS-preserving Clifford circuit, possibly after adding ancillas. For translation-invariant $p$-ary CSS codes, where $p$ is prime ($p=2$ for qubits), we require the circuit to commute with the translations of a superlattice. In two dimensions, such a decoupling exists once these translations act trivially on every anyon type. In higher dimensions, excitations are sorted by their dimension into superselection layers, which can remain glued together even when translations act trivially on each layer. We show that this gluing is the only remaining obstruction: a code can be decoupled on a superlattice exactly when, after coarse-graining to it, translations act trivially on every layer and the gluing vanishes. Moreover, for a code with finitely many excitation types in each layer and $m$ nonzero layers, once translations act trivially on every layer, further coarse-graining by a factor of $p^{m-1}$ in every direction removes the aforementioned gluing. Physically, the same criterion determines when the code encodes the maximal number of logical qudits on a finite torus. Finally, we give an explicit algorithm that constructs the decoupling as a circuit of SUM (qudit CNOT) and SWAP gates.", "url": "https://arxiv.org/abs/2610.40592", "type": "理论+数值", "summary": "超过两个空间维度的拓扑 Calderbank-Shor-Steane (CSS) 代码提供了对容错量子计算有用的功能，例如横向非 Clifford 门和单次解码，但仍然缺乏对它们的系统理解。一种方法是解耦代码：通过有限深度的本地 CSS 保留 Clifford 电路将其映射到一堆更高形式的环面代码，可能是在添加辅助之后。对于平移不变的 $p$-ary CSS 代码，其中 $p$ 是素数（对于量子位，$p=2$），我们要求电路与超晶格的平移进行交换。在二维中，一旦这些平移对每个任意子类型发挥微不足道的作用，这种解耦就存在。在更高的维度中，激励按其维度分类到超选择层中，即使平移在每一层上的作用微不足道，这些层也可以保持粘合在一起。我们证明这种粘合是唯一剩下的障碍：在粗粒度化之后，代码可以在超晶格上解耦，而平移在每一层上都表现得微不足道，并且粘合消失了。\n\n此外，对于每层中具有有限多种激励类型和 $m$ 个非零层的代码，一旦平移在每个层上的作用微不足道，则在每个方向上进一步粗粒度化 $p^{m-1}$ 会消除上述粘合。从物理上讲，相同的标准决定了代码何时对有限环面上的最大逻辑量子数进行编码。最后，我们给出了一种显式算法，将解耦构造为 SUM (qudit CNOT) 和 SWAP 门的电路。", "authors": [{"name": "Mingxin He"}, {"name": "Yifei Wang"}, {"name": "Hao Song"}, {"name": "Yingfei Gu"}], "featured_authors": [{"name": "Mingxin He"}, {"name": "Yifei Wang"}, {"name": "Hao Song"}, {"name": "Yingfei Gu"}], "author_count": 4}, {"id": "2610.40595", "category": "quant-ph", "title": "Optimal detuning and gate time for strongly driven single-qubit gates beyond the rotating-wave approximation", "abstract": "Single-qubit quantum gates are implemented as the time-controlled unitary evolution of a two-level system under harmonic driving. The rotating-wave approximation (RWA) provides closed-form gate parameters for weak coupling. Larger amplitudes, desirable to speed up the dynamics, make the RWA-designed gates inaccurate because of the neglected counter-rotating term, which also shifts the resonance (Bloch-Siegert shift). Here we study theoretically the infidelity of gates beyond the RWA, using the effective Magnus-Taylor Hamiltonian through second order in the inverse of the driving frequency. By detuning the driving frequency by an amplitude-dependent shift of Bloch-Siegert type and rescaling the operation time, the RWA gate conditions are recovered with corrected parameters. Numerical solutions of the Schrodinger equation show that these corrections lower the gate infidelity by several orders of magnitude, extending the range of usable amplitudes", "url": "https://arxiv.org/abs/2610.40595", "type": "理论+数值", "summary": "单量子位量子门被实现为谐波驱动下两能级系统的时间控制酉演化。旋转波近似 (RWA) 为弱耦合提供闭合形式的门参数。较大的振幅（需要加快动力学速度）使得 RWA 设计的门变得不准确，因为忽略了反向旋转项，这也会改变共振（布洛赫-西格特位移）。在这里，我们使用驱动频率倒数的二阶有效马格努斯-泰勒哈密顿量，从理论上研究了超出 RWA 的门的不忠实性。通过 Bloch-Siegert 类型的振幅相关偏移来失谐驱动频率并重新调整操作时间，RWA 门条件可通过校正参数恢复。薛定谔方程的数值解表明，这些修正将门不保真度降低了几个数量级，扩大了可用幅度的范围", "authors": [{"name": "Alejandro D. Bendersky"}, {"name": "Sergio S. Gomez"}, {"name": "Rodolfo H. Romero"}], "featured_authors": [{"name": "Alejandro D. Bendersky"}, {"name": "Sergio S. Gomez"}, {"name": "Rodolfo H. Romero"}], "author_count": 3}, {"id": "2610.40623", "category": "quant-ph", "title": "Optimal Diamond Distance Estimation for Unitary Channels", "abstract": "The diamond distance between two quantum channels determines the optimal probability of distinguishing them from a single use. We give a quantum algorithm that estimates the diamond distance between two unknown $d$-dimensional unitary channels to within additive error $\\varepsilon$, using $O(\\sqrt{d}/\\varepsilon)$ queries to the unitary channels and their inverses. The query complexity is optimal, as it matches the lower bound due to Jeon and Oh (npj Quantum Inf. 2026).", "url": "https://arxiv.org/abs/2610.40623", "type": "理论+数值", "summary": "两个量子通道之间的菱形距离决定了将它们与单次使用区分开来的最佳概率。我们给出了一种量子算法，使用对酉通道及其逆的 $O(\\sqrt{d}/\\varepsilon)$ 查询来估计两个未知 $d$ 维酉通道之间的菱形距离，使其在加性误差 $\\varepsilon$ 范围内。查询复杂度是最优的，因为它符合 Jeon 和 Oh 规定的下限 (npj Quantum Inf. 2026)。", "authors": [{"name": "Jinge Bao"}, {"name": "Qisheng Wang"}], "featured_authors": [{"name": "Jinge Bao"}, {"name": "Qisheng Wang"}], "author_count": 2}, {"id": "2610.40624", "category": "quant-ph", "title": "Left-Handed Transmission Lines for the Dynamical Casimir Effect", "abstract": "Left-handed (LH) superconducting transmission lines, built with series capacitors and shunt inductors instead of the series inductors and shunt capacitors of a conventional right-handed (RH) line, have a spectrum with a nonzero lower band edge and modes that become sparse at high frequencies. We study the dynamical Casimir effect in a LH line terminated by a flux-modulated SQUID and compare it with an RH line built from the same elements and with a long coplanar waveguide terminated by the same SQUID. We derive the quantum Hamiltonian and show that the coupling between two modes factorizes into their amplitudes at the SQUID. Together, the LH spectrum and the mode dependence of this coupling determine which modes are populated and how fast. With equal elements, the LH coupling grows with frequency and exceeds the RH one above a crossover pump frequency set by the cell inductance and capacitance, and only the LH line has resonances above the RH band edge. Pumping two modes at once lets a weakly coupled mode borrow coupling from a strongly coupled one, while crossings of resonance lines populate three or four modes without increasing the growth rate. Compared with the coplanar waveguide, the LH line has a similar coupling but keeps the created particles in the target mode, whereas the nearly equidistant waveguide spreads them over many pairs and needs more pump energy.", "url": "https://arxiv.org/abs/2610.40624", "type": "理论", "summary": "左手（LH）超导传输线采用串联电容器和并联电感器而不是传统右手（RH）线的串联电感器和并联电容器，其频谱具有非零下带边缘和在高频下变得稀疏的模式。我们研究了由通量调制 SQUID 端接的 LH 线中的动态卡西米尔效应，并将其与由相同元件构建的 RH 线以及由相同 SQUID 端接的长共面波导进行比较。我们推导了量子哈密顿量，并表明两种模式之间的耦合在 SQUID 中分解为它们的振幅。 LH 谱和这种耦合的模式依赖性共同决定了填充哪些模式以及填充的速度。对于相同的元件，LH 耦合随频率而增长，并超过由单元电感和电容设置的交叉泵频率之上的 RH 耦合，并且只有 LH 线在 RH 频带边缘上方具有谐振。同时泵浦两种模式可以让弱耦合模式借用强耦合模式的耦合，而共振线的交叉会填充三种或四种模式，而不会增加增长率。\n\n与共面波导相比，LH 线具有类似的耦合，但将产生的粒子保持在目标模式，而近等距波导将它们分布在许多对上，并且需要更多的泵浦能量。", "authors": [{"name": "Valentin E. Salari"}, {"name": "Fernando C. Lombardo"}, {"name": "Paula I. Villar"}], "featured_authors": [{"name": "Valentin E. Salari"}, {"name": "Fernando C. Lombardo"}, {"name": "Paula I. Villar"}], "author_count": 3}, {"id": "2610.40628", "category": "quant-ph", "title": "Locality in Dissipative Ground-State Preparation", "abstract": "Can the ground state of a local Hamiltonian be prepared by local dissipation? We address this question for free-fermion Hamiltonians, using a quadratic Lindbladian with linear jump operators for the dissipative ground-state preparation. For translation-invariant targets, Fourier correspondence relates spatial locality to momentum-space analyticity, allowing us to derive a complete spectral criterion for the existence of exponentially local linear jump operators that prepare the ground state. This criterion leads to a no-go theorem that, sign-changing Fermi-level crossings exclude exponentially local linear jump operators for preparing the ground state. While these crossings are the complete obstruction in one dimension, additional obstructions generally arise in higher dimensions. We illustrate these additional obstructions using two quadratic-band-touching models with algebraically decaying ground-state correlations. We further show that short-range ground-state correlations, although not necessary, are sufficient for local dissipative preparation even without translation invariance. Our results establish how the spectral structure of the target Hamiltonian governs the locality of dissipative ground-state preparation.", "url": "https://arxiv.org/abs/2610.40628", "type": "理论", "summary": "局部哈密顿量的基态可以通过局部耗散来准备吗？我们针对自由费米子哈密顿量解决了这个问题，使用带有线性跳跃算子的二次 Lindbladian 来进行耗散基态准备。对于平移不变的目标，傅立叶对应将空间局部性与动量空间分析性联系起来，使我们能够导出用于准备基态的指数局部线性跳跃算子的存在的完整谱标准。这个标准导致了一个不可行的定理，即符号改变费米能级交叉排除了用于准备基态的指数局部线性跳跃算子。虽然这些交叉在一维中是完全的障碍物，但在更高的维度中通常会出现额外的障碍物。我们使用两个具有代数衰减基态相关性的二次能带接触模型来说明这些额外的障碍物。我们进一步表明，短程基态相关性虽然不是必需的，但即使没有平移不变性，也足以进行局部耗散准备。\n\n我们的结果确定了目标哈密顿量的谱结构如何控制耗散基态制备的局部性。", "authors": [{"name": "Qicheng Tang"}, {"name": "Ruhanshi Barad"}, {"name": "Xueda Wen"}], "featured_authors": [{"name": "Qicheng Tang"}, {"name": "Ruhanshi Barad"}, {"name": "Xueda Wen"}], "author_count": 3}, {"id": "2610.40638", "category": "quant-ph", "title": "Entanglement diagnostics of stochastic-resetting steady states: theory and measurement on superconducting qubits", "abstract": "Stochastic resetting drives quantum systems into nonequilibrium stationary states unreachable under uninterrupted unitary evolution, and their entanglement depends on whether the reset history is resolved or averaged over. We study this interplay in the transverse-field Ising chain, deriving closed-form results for two qubits and evaluating chains of up to 12 qubits exactly. In the two-qubit system, these closed-form results show that phase matching between energy eigenstates produces resonances, and their visibility in the stationary state is determined by the symmetry of the reset state. Measurements on an IBM superconducting processor show the entropies evaluated before and after the reset average closely following noiseless predictions with no fitted parameter, while concurrence lies below prediction across most of the hardware measurements. The two diagnostics respond differently because they read different components of the same reconstructed state, and a depolarizing model captures the concurrence suppression with one fitted parameter. The difference between the two entropies, i. e., the Jensen gap of entanglement entropy, equals the Holevo information that a subsystem retains about the time since the last reset. With a Bell-state reset, this information grows with chain length across a half-chain cut over the sizes studied, without visible saturation at the smaller reset probabilities. Since reset times are sampled and recorded classically, the trajectory-averaged entropy, and with it the Jensen gap, is obtained without postselection, in contrast to monitored circuits, where trajectory-resolved entanglement requires sampling exponentially rare measurement records.", "url": "https://arxiv.org/abs/2610.40638", "type": "实验", "summary": "随机重置将量子系统驱动到在不间断酉演化下无法达到的非平衡静止状态，它们的纠缠取决于重置历史是否被解决或平均。我们研究了横向场伊辛链中的这种相互作用，得出两个量子位的封闭形式结果，并精确评估多达 12 个量子位的链。在双量子位系统中，这些封闭形式的结果表明，能量本征态之间的相位匹配会产生共振，并且它们在静止状态下的可见性由重置状态的对称性决定。 IBM 超导处理器上的测量显示，重置之前和之后评估的熵平均值紧密遵循无拟合参数的无噪声预测，而大多数硬件测量的并发性低于预测。这两种诊断的响应不同，因为它们读取相同重建状态的不同组成部分，并且去极化模型通过一个拟合参数捕获并发抑制。两个熵之间的差，i。\n\n即纠缠熵的 Jensen 间隙，等于子系统自上次重置以来保留的 Holevo 信息。通过贝尔状态重置，该信息随着所研究大小的半链切割的链长度而增长，在较小的重置概率下没有明显的饱和。由于重置时间是经典采样和记录的，因此无需后选择即可获得轨迹平均熵以及詹森间隙，这与监控电路相反，在监控电路中，轨迹解析纠缠需要对指数稀有的测量记录进行采样。", "authors": [{"name": "Jakob Murauer"}, {"name": "Sabine Tornow"}, {"name": "Manas Kulkarni"}, {"name": "Eli Barkai"}, {"name": "Satya N. Majumdar"}, {"name": "Monalisa Singh Roy"}], "featured_authors": [{"name": "Jakob Murauer"}, {"name": "Sabine Tornow"}, {"name": "Manas Kulkarni"}, {"name": "Eli Barkai"}, {"name": "Satya N. Majumdar"}, {"name": "Monalisa Singh Roy"}], "author_count": 6}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
