  <style>
    :root {
      --bg: #f6f1e8;

      --muted: #6d5d50;

      --accent-2: #1d5f6b;

      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;

      box-shadow: var(--shadow);

    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }

    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }

    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }

    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }

    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }

    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }

    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }

    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2610.37746", "category": "cond-mat", "title": "A $B_{1g}$ phonon unlocks $d$-wave superconductivity in the repulsive Hubbard model", "abstract": "Using numerically exact finite-temperature quantum Monte Carlo, we demonstrate that a $B_{1g}$ phonon coupled to the doped $t$-$t'$ repulsive Hubbard model produces genuine $d$-wave superconductivity at a substantial transition temperature, in excess of either interaction alone. The observed trends suggest that stronger Hubbard repulsion may cooperate with the phonon to further raise the pairing scale. The enhancement persists at stronger repulsion within the accessible window, limited by the fermion sign problem, and follows a common trend across phonon frequencies $\\Omega$ when organized by a retardation scale $2\\pi T/\\Omega$. We also find a well-defined superconducting dome in doping, echoing a characteristic feature of correlated superconductors. Our results identify the $B_{1g}$ phonon as a plausible microscopic ingredient for robust $d$-wave superconductivity in the Hubbard model and suggest a concrete, physically motivated route toward materials with higher superconducting transition temperatures.", "url": "https://arxiv.org/abs/2610.37746", "type": "理论+数值", "summary": "使用数值精确的有限温度量子蒙特卡罗，我们证明了与掺杂的 $t$-$t'$ 排斥哈伯德模型耦合的 $B_{1g}$ 声子在相当大的转变温度下产生真正的 $d$ 波超导性，超过了单独的任何一种相互作用。观察到的趋势表明，更强的哈伯德斥力可能与声子配合，进一步提高配对规模。受费米子符号问题的限制，增强在可及窗口内持续存在更强的排斥力，并且当按延迟尺度 $2\\pi T/\\Omega$ 组织时，遵循声子频率 $\\Omega$ 的共同趋势。我们还在掺杂中发现了明确的超导圆顶，与相关超导体的特征相呼应。我们的结果将 $B_{1g}$ 声子确定为哈伯德模型中强大的 $d$ 波超导性的合理微观成分，并提出了一条获得具有更高超导转变温度的材料的具体的、物理驱动的途径。", "authors": [{"name": "Wen O. Wang"}, {"name": "Tianshu Li"}, {"name": "Xiaoyue Ma"}, {"name": "Rong Zhang"}, {"name": "Lei Zhang"}, {"name": "Shruti Agarwal"}, {"name": "Benjamin Cohen-Stead"}, {"name": "Emily Z. Zhang"}, {"name": "Brian Moritz"}, {"name": "Steven Johnston"}, {"name": "Zhi-Xun Shen"}, {"name": "Thomas P. Devereaux"}], "featured_authors": [{"name": "Wen O. Wang"}, {"name": "Tianshu Li"}, {"name": "Xiaoyue Ma"}, {"name": "Steven Johnston"}, {"name": "Zhi-Xun Shen"}, {"name": "Thomas P. Devereaux"}], "author_count": 12}, {"id": "2610.37754", "category": "cond-mat", "title": "Meta-Altermagnetism and Enhanced Spin-Splitting", "abstract": "Altermagnets are collinear magnets with zero net magnetization and spin-split electronic bands. Here, we explore whether altermagnetism can exhibit a discontinuous jump, a phenomenon we refer to as meta-altermagnetism. We show that meta-altermagnetism can emerge in 2D systems when magnetic-order-induced band reconstruction drives spin-split van Hove singularities (vHSs) across the Fermi level. Using mean-field theory for an extended $t$-$J$ model on a two-sublattice square lattice including anisotropic hopping integral, we find that a first-order meta-altermagnetic transition produces an intermediate altermagnetic regime with reduced staggered magnetization but strongly enhanced magnetic octupole and time-reversal-odd spin-splitter conductivity. We further show that the first-order transition line terminates at a quantum critical endpoint, giving rise to a rich phase diagram as the chemical potential and anisotropic hopping strength are varied. Our results identify the spin split vHSs as a route to enhancing spin-splitter effect for spintronic applications.", "url": "https://arxiv.org/abs/2610.37754", "type": "理论+数值", "summary": "交替磁体是具有零净磁化强度和自旋分裂电子​​带的共线磁体。在这里，我们探讨交变磁性是否可以表现出不连续的跳跃，我们将这种现象称为元交变磁性。我们证明，当磁序诱导能带重建驱动费米能级上的自旋分裂范霍夫奇点（vHS）时，二维系统中可能会出现元交变磁性。使用平均场理论对包含各向异性跳跃积分的二子晶格方格上的扩展 $t$-$J$ 模型进行分析，我们发现一阶元交变磁转变产生了交错磁化强度降低但磁八极子和时间反转奇数自旋分裂器电导率大大增强的中间交变磁态。我们进一步表明，一阶跃迁线终止于量子临界端点，随着化学势和各向异性跳跃强度的变化，产生丰富的相图。我们的结果表明，自旋分裂 vHS 是增强自旋电子应用中自旋分裂效应的一种途径。", "authors": [{"name": "Bogeng Wen"}, {"name": "Hae-Young Kee"}], "featured_authors": [{"name": "Bogeng Wen"}, {"name": "Hae-Young Kee"}], "author_count": 2}, {"id": "2610.37760", "category": "cond-mat", "title": "MoireKP: An Automated Workflow for Symmetry-Constrained Moiré Continuum Models", "abstract": "First-principles Hamiltonians contain the electronic information needed to study moiré materials, but their size makes subsequent calculations costly. We present MoireKP, an automated workflow for constructing compact continuum models from localized-orbital ab initio Hamiltonians. The workflow constructs a valley-resolved truncated atomic-plane-wave (TAPW) Hamiltonian, selects a low-energy basis, and projects the crystal-symmetry operations into this basis. These representations determine the symmetry-allowed Hamiltonian terms, whose coefficients are obtained by projecting the low-energy effective Hamiltonian onto the corresponding operator basis. The model dimension, localized reference states, and harmonic cutoff can be selected automatically or specified by the user. This Hamiltonian-based construction retains wave-function information within the selected low-energy subspace. We apply the workflow to AA-stacked twisted bilayer MoTe$_2$, AB-stacked twisted bilayer ZrS$_2$, and A--AB twisted trilayer MoTe$_2$, covering K, M, and $\\Gamma$ valleys. All models reproduce TAPW band energies within 3.0 meV in the target windows along high-symmetry $k$ paths.", "url": "https://arxiv.org/abs/2610.37760", "type": "理论+数值", "summary": "第一性原理哈密顿量包含研究莫尔材料所需的电子信息，但其尺寸使得后续计算成本高昂。我们提出了 MoireKP，这是一种自动化工作流程，用于从局域轨道从头算哈密顿量构建紧凑连续介质模型。该工作流程构建谷解析截断原子平面波 (TAPW) 哈密顿量，选择低能量基础，并将晶体对称运算投影到该基础中。这些表示确定了允许对称的哈密顿项，其系数是通过将低能有效哈密顿量投影到相应的算子基础上获得的。模型尺寸、局部参考状态和谐波截止可以自动选择或由用户指定。这种基于哈密顿量的构造保留了所选低能子空间内的波函数信息。我们将工作流程应用于 AA 堆叠扭曲双层 MoTe$_2$、AB 堆叠扭曲双层 ZrS$_2$ 和 A--AB 扭曲三层 MoTe$_2$，覆盖 K、M 和 $\\Gamma$ 谷。所有模型都沿着高对称性 $k$ 路径在目标窗口中重现 3.0 meV 以内的 TAPW 带能量。", "authors": [{"name": "Yan Zhang"}, {"name": "Hanqi Pi"}, {"name": "Wangqian Miao"}, {"name": "Zhong Fang"}, {"name": "Hongming Weng"}, {"name": "Xi Dai"}, {"name": "B. Andrei Bernevig"}, {"name": "Quansheng Wu"}], "featured_authors": [{"name": "Yan Zhang"}, {"name": "Hanqi Pi"}, {"name": "Wangqian Miao"}, {"name": "Xi Dai"}, {"name": "B. Andrei Bernevig"}, {"name": "Quansheng Wu"}], "author_count": 8}, {"id": "2610.37761", "category": "cond-mat", "title": "Field theory of competing phases in the interacting Kitaev chain", "abstract": "We study the interacting Kitaev chain with nearest-neighbor interactions and finite chemical potential using a combination of bosonization and density-matrix renormalization-group calculations. Focusing away from special exactly solvable lattice limits, we develop a continuum field-theoretic description of the generic finite-density interacting regime, where doping nonperturbatively modifies the competition between superconducting pairing and commensurate charge ordering. We show that the phase diagram consists of an intermediate incommensurate Luttinger liquid between the topological superconducting and commensurate charge-density-wave Mott phases, as well as a trivial band-insulating regime at large chemical potential. The commensurate--incommensurate and incommensurate--topological-superconducting phase boundaries are governed by Pokrovsky--Talapov and Berezinskii--Kosterlitz--Thouless criticality, respectively. We analyze the interacting topological superconducting regime and its boundary excitations. At the semiclassical level, and explicitly in the free-fermion boundary theory, the topological phase supports exponentially localized Majorana edge modes at interfaces between topological and trivial regions. We also construct a dual continuum fermionic representation in which this topological bulk sector is described instead by conventional symmetry breaking. This gives a continuum version of the SPT--SSB correspondence between different fermionic representations. Overall, our results provide an analytical description of one-dimensional interacting topological superconductors, from the competition between topology and commensurability and the resulting quantum criticality to the dual symmetry-breaking description of the topological phase.", "url": "https://arxiv.org/abs/2610.37761", "type": "理论+数值", "summary": "我们结合玻色子化和密度矩阵重整化群计算来研究具有最近邻相互作用和有限化学势的相互作用的基塔耶夫链。远离特殊的精确可解晶格极限，我们开发了通用有限密度相互作用机制的连续场论描述，其中掺杂非微扰地改变了超导配对和相应电荷排序之间的竞争。我们证明相图由拓扑超导相和相称电荷密度波莫特相之间的中间不相称卢廷格液体以及大化学势下的平凡带绝缘区域组成。相称——不相称和不相称——拓扑超导相边界分别由 Pokrovsky-Talapov 和 Berezinskii-Kosterlitz-Thouless 临界性控制。我们分析了相互作用的拓扑超导状态及其边界激励。\n\n在半经典水平上，并且明确地在自由费米子边界理论中，拓扑相支持拓扑区域和平凡区域之间的界面处的指数局域马约拉纳边缘模式。我们还构造了一个双连续谱费米子表示，其中该拓扑体扇区通过传统的对称破缺来描述。这给出了不同费米子表示之间的 SPT-SSB 对应的连续体版本。总的来说，我们的结果提供了对一维相互作用拓扑超导体的分析描述，从拓扑和可通约性之间的竞争以及由此产生的量子临界性到拓扑相的双对称破缺描述。", "authors": [{"name": "Pradip Kattel"}, {"name": "Thierry Giamarchi"}], "featured_authors": [{"name": "Pradip Kattel"}, {"name": "Thierry Giamarchi"}], "author_count": 2}, {"id": "2610.37765", "category": "cond-mat", "title": "Long-Range Toric Code: Finite-Temperature Topological Order in Two Dimensions", "abstract": "We introduce two-dimensional toric code models with additional long-range loop interactions. Our models preserve the topologically ordered ground states of the ordinary toric code, while confining anyons at zero temperature. For sufficiently long-ranged interactions, we argue that this confinement persists at finite temperatures, strongly constraining anyon mobility and giving rise to finite-temperature topological order. This topological phase acts as a self-correcting quantum memory and exhibits long-range entanglement. For shorter-ranged interactions, signatures of topological order survive only up to an exponentially large length scale at finite temperature, yielding a partially self-correcting quantum memory.", "url": "https://arxiv.org/abs/2610.37765", "type": "理论", "summary": "我们引入了具有附加远程循环交互的二维环面码模型。我们的模型保留了普通环面码的拓扑有序基态，同时将任意子限制在零温度。对于足够长程的相互作用，我们认为这种限制在有限温度下持续存在，强烈限制任意子的迁移性并产生有限温度拓扑序。这种拓扑相充当自校正量子存储器并表现出长程纠缠。对于较短程的相互作用，拓扑顺序的特征在有限温度下只能存活到指数级大的长度尺度，从而产生部分自校正的量子存储器。", "authors": [{"name": "Jacopo Gliozzi"}, {"name": "Taylor L. Hughes"}, {"name": "Kyung-Su Kim"}], "featured_authors": [{"name": "Jacopo Gliozzi"}, {"name": "Taylor L. Hughes"}, {"name": "Kyung-Su Kim"}], "author_count": 3}, {"id": "2610.37770", "category": "cond-mat", "title": "Spin Space Symmetry Without Spin Space Groups", "abstract": "Spin space groups provide a complete symmetry classification of magnetic structures in the non-relativistic limit and have become an increasingly useful language for organizing magnetic phases and their physical properties. Each spin space group with a given parent space group is specified, up to spin-only symmetries, by a real representation of that space group acting in spin space. We argue that working directly with this representation not only avoids the construction and identification of the group, but also organizes and simplifies the resulting symmetry constraints on allowed responses. Determining the presence or absence of magnetic compensation, piezomagnetism, spin and charge transport, the Edelstein effect, and momentum-space spin textures becomes an ordinary problem in the representation theory of space groups. The resulting conditions reduce to overlaps between the three exterior powers of the defining representation and multipole representations of the point group. Several physically distinct responses then reduce to the same condition on the defining representation. For example, a $p$-wave spin texture and the time-even Edelstein effect are allowed under the same condition, as are piezomagnetism and a $d$-wave spin texture in compensated order. The wave-vector content of the exterior powers gives a further hierarchy of selection rules: depending on the relevant power, a uniform response requires one, two, or three ordering wave vectors to sum to a reciprocal lattice vector. These rules can exclude many responses before point-group symmetry is considered. We illustrate the approach with examples drawn from a wide variety of materials hosting collinear, coplanar and non-coplanar magnetic order. Finally, we discuss extensions of these results to magnetic space groups, connections to Landau theories of collinear order, and the characterization of odd-parity magnets.", "url": "https://arxiv.org/abs/2610.37770", "type": "理论", "summary": "自旋空间群提供了非相对论极限下磁结构的完整对称分类，并且已成为组织磁相及其物理性质的越来越有用的语言。具有给定父空间群的每个自旋空间群都由作用于自旋空间的空间群的实数表示指定，直至仅自旋对称性。我们认为，直接使用这种表示不仅避免了群体的构建和识别，而且还组织和简化了对允许响应的对称约束。确定磁补偿、压磁性、自旋和电荷输运、埃德尔斯坦效应和动量空间自旋纹理是否存在成为空间群表示论中的一个常见问题。由此产生的条件减少为定义表示的三个外部幂与点群的多极表示之间的重叠。然后，几个物理上不同的响应会减少到定义表示上的相同条件。\n\n例如，在相同条件下允许$p$波自旋纹理和时间均匀埃德尔斯坦效应，压磁和补偿顺序的$d$波自旋纹理也是如此。外部功率的波矢量内容给出了选择规则的进一步层次：根据相关功率，统一响应需要一个、两个或三个有序波矢量求和为倒格矢量。在考虑点群对称性之前，这些规则可以排除许多响应。我们通过从具有共线、共面和非共面磁序的各种材料中提取的示例来说明该方法。最后，我们讨论这些结果对磁性空间群的扩展、与共线序朗道理论的联系以及奇宇称磁体的表征。", "authors": [{"name": "Jeffrey G. Rau"}], "featured_authors": [{"name": "Jeffrey G. Rau"}], "author_count": 1}, {"id": "2610.37812", "category": "cond-mat", "title": "Geometry-controlled active transport in smectic textures", "abstract": "Self-propelled particles moving through structured anisotropic media such as smectic liquid crystals exhibit transport properties that differ qualitatively from those in isotropic environments. Here we introduce a minimal model of an active Brownian particle whose propulsion axis is coupled to the layer-normal field of a smectic liquid crystal. Using numerical simulations complemented by approximate analytical calculations, we investigate the dynamics of an active particle in three representative two-dimensional smectic microstructures: a uniform planar texture, an isolated toroidal focal conic domain, and a periodic array of toroidal focal conic domains. For the planar and isolated focal-conic geometries, we characterize the crossover from short-time superdiffusion to long-time normal diffusion. In periodic focal-conic arrays, however, transport is controlled by two distinct persistence mechanisms whose relative importance depends on the Péclet number ($\\mathrm{Pe}$) and the coupling strength $\\varepsilon$ between the particle orientation and the smectic layer-normal field. At small $\\varepsilon$, long-time diffusion is governed by the intrinsic persistence time of the active Brownian dynamics. At large $\\varepsilon$, repeated scattering by smectic defects generates an emergent persistence time that dominates the transport. These results demonstrate that the competition between the intrinsic persistence of active motion and the mean free time between encounters with smectic defects provides a simple physical mechanism for the emergence of nontrivial diffusive behavior in structured anisotropic media.", "url": "https://arxiv.org/abs/2610.37812", "type": "理论+数值", "summary": "在结构化各向异性介质（例如近晶液晶）中移动的自驱动粒子表现出与各向同性环境中的输运特性有本质上的不同。在这里，我们引入了活性布朗粒子的最小模型，其推进轴与近晶液晶的层法向场耦合。使用数值模拟并辅以近似分析计算，我们研究了三种代表性二维近晶微观结构中活性粒子的动力学：均匀平面纹理、孤立的环形焦锥域和环形焦锥域的周期阵列。对于平面和孤立的焦锥几何形状，我们描述了从短时超扩散到长时间正常扩散的交叉。然而，在周期性焦锥阵列中，输运由两种不同的持久机制控制，其相对重要性取决于佩克莱特数 ($\\mathrm{Pe}$) 以及粒子方向和近晶层法向场之间的耦合强度 $\\varepsilon$。\n\n在较小的 $\\varepsilon$ 下，长时间扩散受活跃布朗动力学的固有持续时间控制。在大$\\varepsilon$下，近晶缺陷的重复散射会产生主导传输的新兴持久时间。这些结果表明，主动运动的内在持久性与遭遇近晶缺陷之间的平均自由时间之间的竞争为结构化各向异性介质中非平凡扩散行为的出现提供了一个简单的物理机制。", "authors": [{"name": "Yhony M. Arce"}, {"name": "William G. C. Oropesa"}, {"name": "Alef R. Siqueira"}, {"name": "Hartmut Löwen"}, {"name": "André P. Vieira"}, {"name": "Danilo B. Liarte"}], "featured_authors": [{"name": "Yhony M. Arce"}, {"name": "William G. C. Oropesa"}, {"name": "Alef R. Siqueira"}, {"name": "Hartmut Löwen"}, {"name": "André P. Vieira"}, {"name": "Danilo B. Liarte"}], "author_count": 6}, {"id": "2610.37889", "category": "cond-mat", "title": "GæniceN: a minimal model to relax magnetization states self-consistently in general artificial spin ices", "abstract": "Artificial spin ices are geometric arrangement of nanomagnets that exhibit reconfigurable magnetization states and GHz dynamics. Their investigation in the GHz regime is challenging because of the existence of multiple modes and the impact of magnetization deviations at the edges of the nanomagnets. A minimal model to capture such dynamics require three macrospins per nanomagnet, an approach that was implemented for generic artificial spin ices in the tool Gaenice. Here, we use the Gaenice framework to realize a relaxation method to stabilize magnetization states self-consistently, called GaeniceN. We implement the dissipative component of the Landau-Lifshitz equation in an iterative approach to efficiently converge to the relaxed state. As an example, we find our approach to correctly predict the transition between phases in a pyramid ASI subject to a low-magnitude external field by computing the system's average energy. Because they are rooted on the same framework, GaeniceN produces the initial condition needed for Gaenice to compute dynamics such as ferromagnetic resonance or band structures. Combined, these tools will be able to aid in the design of artificial spin ices with applications in magnonics.", "url": "https://arxiv.org/abs/2610.37889", "type": "理论", "summary": "人造自旋冰是纳米磁体的几何排列，表现出可重新配置的磁化状态和 GHz 动力学。由于存在多种模式以及纳米磁体边缘磁化偏差的影响，他们在 GHz 范围内的研究具有挑战性。捕获这种动力学的最小模型需要每个纳米磁体三个宏自旋，这种方法已在 Gaenice 工具中用于通用人造自旋冰。在这里，我们使用Gaenice框架实现了一种自洽稳定磁化态的弛豫方法，称为GaeniceN。我们以迭代方法实现 Landau-Lifshitz 方程的耗散分量，以有效地收敛到松弛状态。作为一个例子，我们发现我们的方法可以通过计算系统的平均能量来正确预测金字塔 ASI 中受低强度外场影响的阶段之间的转变。因为它们植根于相同的框架，GaeniceN 产生了 Gaenice 计算铁磁共振或能带结构等动力学所需的初始条件。\n\n结合起来，这些工具将能够帮助设计人造旋转冰及其在磁振子学中的应用。", "authors": [{"name": "H. Braun"}, {"name": "E. Freeman"}, {"name": "G. Alatteili"}, {"name": "E. Iacocca"}], "featured_authors": [{"name": "H. Braun"}, {"name": "E. Freeman"}, {"name": "G. Alatteili"}, {"name": "E. Iacocca"}], "author_count": 4}, {"id": "2610.37925", "category": "cond-mat", "title": "Planar energetics do not determine twin persistence in nanocrystalline aluminium", "abstract": "Planar energetics are the standard descriptors of twinnability in face-centred cubic metals and the usual validation targets for interatomic potentials. Here we show that they do not determine whether deformation twins persist in nanocrystalline aluminium. Two machine-learned potentials reproducing the same zero-load slip curves and closely spaced layered energy surfaces predict, from a common separated-fault precursor under identical loading, retained twin coverage of 64\\% and 14\\%. The divergence traces to forces within distorted partial cores acting along the trailing translation that would remove an outer fault. Planar energetics do set the margin: an outer fault more than halves the incremental barrier for middle-plane shear, yet twin completion and fault removal remain separated by only 10--21 mJ m\\textsuperscript{-2}. Whether an assembled twin persists is decided instead by the orientation of local traction relative to the full-slip bisector and by the arrival order of partial-slip fronts from the grain-boundary network.", "url": "https://arxiv.org/abs/2610.37925", "type": "理论", "summary": "平面能量学是面心立方金属孪生性的标准描述符，也是原子间势的常用验证目标。在这里，我们表明他们不能确定变形孪晶是否存在于纳米晶铝中。两个机器学习势再现相同的零负载滑移曲线和紧密间隔的层状能量表面，根据相同负载下的常见分离断层前兆，预测保留的孪晶覆盖率为 64% 和 14%。这种分歧归因于扭曲的部分核心内沿着尾部平移作用的力，这将消除外部断层。平面能量学确实设定了边界：外部断层超过中面剪切增量障碍的一半，但孪生完井和断层去除仍然仅相隔 10--21 mJ m\\textsuperscript{-2}。组合孪生体是否持续存在取决于局部牵引力相对于全滑移平分线的方向以及来自晶界网络的部分滑移前沿的到达顺序。", "authors": [{"name": "Yue Wu"}, {"name": "Yuan Tian"}, {"name": "Haoyu Wan"}, {"name": "Deng Pan"}, {"name": "Mingwei Chen"}], "featured_authors": [{"name": "Yue Wu"}, {"name": "Yuan Tian"}, {"name": "Haoyu Wan"}, {"name": "Deng Pan"}, {"name": "Mingwei Chen"}], "author_count": 5}, {"id": "2610.38012", "category": "cond-mat", "title": "Finite-step statistical mechanics of scale-invariant learning: spectral equations of state and curvature transport", "abstract": "Stationary learning admits an ideal-gas description under restrictive noise assumptions. In neural networks whose gradient noise departs from these assumptions, however, an entropy-scaling relation resembling a Maxwell relation remains approximately valid. We ask which thermodynamic-looking relations follow from scale symmetry rather than equilibrium, and how departures from the ideal-gas description can be quantified, for discrete stochastic gradient dynamics with memory. An exact rescaling of trajectories explains the entropy relation without assuming thermal equilibrium. Within a local harmonic approximation, self-adjusting weight norms yield a spectral equation of state whose virial coefficients are set by moments of the curvature spectrum, and coupled parameter groups can sustain stationary probability currents. Our central result beyond this approximation is an exact curvature-transport identity. Together with a finite-step loss balance, it decomposes corrections to the harmonic fluctuation relation into measurable curvature changes, finite-step remainders, gradient-memory correlations and finite-window drift terms. A related displacement-weighted curvature change provides a diagnostic of the arrow of time; its mean and second moment give a lower bound on the relative entropy between forward and reversed state pairs. We also calculate the activation-boundary contribution to curvature for rectified teacher-student networks with Gaussian inputs. Tests in sphere models, teacher-student networks and convolutional networks on CIFAR-10 and CIFAR-100 support the transport description and identify limits of the harmonic and cubic-remainder approximations. These results separate symmetry-based relations from equilibrium assumptions and provide quantitative diagnostics of nonideal fluctuations in learning dynamics.", "url": "https://arxiv.org/abs/2610.38012", "type": "理论", "summary": "稳态学习承认在限制性噪声假设下的理想气体描述。然而，在梯度噪声偏离这些假设的神经网络中，类似于麦克斯韦关系的熵缩放关系仍然近似有效。我们询问哪种热力学关系遵循尺度对称性而不是平衡性，以及对于具有记忆的离散随机梯度动力学，如何量化与理想气体描述的偏离。轨迹的精确重新调整可以在不假设热平衡的情况下解释熵关系。在局部谐波近似中，自调整权重范数产生一个谱状态方程，其维里系数由曲率谱的矩设置，并且耦合参数组可以维持稳态概率流。除了这个近似之外，我们的中心结果是精确的曲率传输恒等式。与有限步损耗平衡一起，它将谐波波动关系的修正分解为可测量的曲率变化、有限步余数、梯度记忆相关性和有限窗口漂移项。\n\n相关的位移加权曲率变化提供了时间箭头的诊断；它的均值和二阶矩给出了正向和反向状态对之间相对熵的下界。我们还计算了具有高斯输入的校正师生网络的激活边界对曲率的贡献。 CIFAR-10 和 CIFAR-100 上的球体模型、师生网络和卷积网络测试支持传输描述并确定调和和三次余数近似的限制。这些结果将基于对称的关系与均衡假设分开，并提供学习动态中非理想波动的定量诊断。", "authors": [{"name": "Alexander Itin"}], "featured_authors": [{"name": "Alexander Itin"}], "author_count": 1}, {"id": "2610.38070", "category": "cond-mat", "title": "Thermal laser evaporation of superconducting Nb films", "abstract": "Thermal laser evaporation (TLE) is an emerging physical vapor deposition (PVD) technique that uses continuous-wave lasers to evaporate even the most refractory elements. The deposition and characterization of superconducting refractory elements are of interest to assess the quality of films deposited by TLE. Here, we report the deposition of niobium (Nb) on c-plane sapphire using a home-built TLE system equipped with a 1070 nm continuous-wave fiber laser. A deposition rate of 0.19 Å/s was achieved with 533 W of laser power focused to a diameter of approximately 500 $\\mu$m on a Nb target. A film with a thickness of $22.47 \\pm 0.05$ nm and a root-mean-square (RMS) roughness of $0.23 \\pm 0.02$ nm exhibited a room-temperature resistivity of $21.60 \\pm 0.05$ $\\mu\\Omega\\mathrm{cm}$ and a residual-resistivity ratio (RRR) of 5.71. The superconducting transition temperature, $T_\\mathrm{c}$, of the film was measured as 9.24 K, only 10 mK below the bulk value, with a transition width of 29 mK. Among films deposited without substrate heating, the electrical and superconducting properties of the present films meet or exceed those deposited by other techniques. This work contributes to the emerging consensus regarding TLE as a versatile PVD method for refractory elements and compounds.", "url": "https://arxiv.org/abs/2610.38070", "type": "理论", "summary": "热激光蒸发 (TLE) 是一种新兴的物理气相沉积 (PVD) 技术，它使用连续波激光来蒸发最难熔的元素。超导耐火元件的沉积和表征对于评估 TLE 沉积薄膜的质量非常重要。在这里，我们报告了使用配备 1070 nm 连续波光纤激光器的自制 TLE 系统在 c 面蓝宝石上沉积铌 (Nb)。使用 533 W 激光功率聚焦到直径约 500 $\\mu$m 的 Nb 靶材上，可实现 0.19 Å/s 的沉积速率。厚度为 $22.47 \\pm 0.05$ nm 且均方根 (RMS) 粗糙度为 $0.23 \\pm 0.02$ nm 的薄膜表现出的室温电阻率为 $21.60 \\pm 0.05$ $\\mu\\Omega\\mathrm{cm}$ 和残余电阻率 (RRR) 为 5.71。测得薄膜的超导转变温度 $T_\\mathrm{c}$ 为 9.24 K，仅比体值低 10 mK，转变宽度为 29 mK。在不加热基底而沉积的薄膜中，本发明的薄膜的电学和超导性质达到或超过通过其他技术沉积的薄膜。\n\n这项工作有助于达成关于 TLE 作为难熔元素和化合物的通用 PVD ​​方法的共识。", "authors": [{"name": "Yifei Yan"}, {"name": "David S. Catherall"}, {"name": "Finley B. Donachie"}, {"name": "Dorsa Najafipanah"}, {"name": "Austin J. Minnich"}], "featured_authors": [{"name": "Yifei Yan"}, {"name": "David S. Catherall"}, {"name": "Finley B. Donachie"}, {"name": "Dorsa Najafipanah"}, {"name": "Austin J. Minnich"}], "author_count": 5}, {"id": "2610.38190", "category": "cond-mat", "title": "Level ordering in the linear $E \\otimes e$ dynamic Jahn-Teller model", "abstract": "The ground level of the linear $E\\otimes e$ dynamic Jahn-Teller model has long been believed to be the doublet with vibronic angular momentum $j = \\pm\\tfrac12$. We prove that, for arbitrary coupling strength, the $n$th level $E_{nj}$ in the subspace of fixed $j$ strictly increases with $|j|$ for every $n$, $E_{n,1/2} < E_{n,3/2} < E_{n,5/2} < \\cdots$; in particular, the ground level is always the $j = \\pm\\tfrac12$ doublet. The proof uses only a unitary transformation that lowers $j$ by one, combined with the variational principle. We also give an explicit lower bound on the gap $E_{0,j+1} - E_{0j}$.", "url": "https://arxiv.org/abs/2610.38190", "type": "理论+数值", "summary": "线性 $E\\otimes e$ 动态 Jahn-Teller 模型的地面长期以来一直被认为是具有振动角动量 $j = \\pm\\tfrac12$ 的双峰。我们证明，对于任意耦合强度，固定$j$子空间中的第$n$级$E_{nj}$对于每个$n$严格随着$|j|$增加，$E_{n,1/2} < E_{n,3/2} < E_{n,5/2} < \\cdots$；特别是，地面始终是 $j = \\pm\\tfrac12$ 双峰。该证明仅使用将 $j$ 降低 1 的酉变换，并结合变分原理。我们还给出了间隙 $E_{0,j+1} - E_{0j}$ 的明确下限。", "authors": [{"name": "Naoya Iwahara"}], "featured_authors": [{"name": "Naoya Iwahara"}], "author_count": 1}, {"id": "2610.38195", "category": "cond-mat", "title": "Crystoria: A Large-Scale Crystal Dataset Linking Thermodynamic and Dynamical Stability for Materials AI", "abstract": "Large-scale crystal databases have transformed materials discovery by making millions of structures and thermodynamic properties accessible to materials informatics. Yet dynamical stability remains sparsely characterized at a comparable scale because its evaluation is substantially more computationally demanding than conventional structure and energy calculations. This mismatch creates a critical gap between the rapidly expanding crystal-structure space and the physical information available for materials research and machine learning. Here we introduce Crystoria, a large-scale crystal dataset designed to bring dynamical stability to the scale of modern materials data. We construct Crystoria by systematically curating low-energy and metastable inorganic crystals, standardizing their structural identities, and combining machine-learning-accelerated structural relaxation with phonon-based dynamical screening. The resulting dataset contains 2,649,640 crystal structures, spanning 89 elements, 219 of the 230 space groups, and primitive cells containing 1-48 atoms. Among them, 1,793,353 structures (67.68%) are classified as dynamically stable, revealing substantial variation in dynamical stability across chemical and crystallographic space. By bringing dynamical stability to the scale of millions of crystal structures, Crystoria provides a physically grounded foundation for materials artificial intelligence (AI) and enables systematic exploration of the dynamical crystal landscape.", "url": "https://arxiv.org/abs/2610.38195", "type": "理论+数值", "summary": "大规模晶体数据库使材料信息学能够获取数以百万计的结构和热力学性质，从而改变了材料的发现。然而，动态稳定性在可比较的规模上仍然很少被表征，因为它的评估比传统的结构和能量计算对计算的要求更高。这种不匹配在快速膨胀的晶体结构空间与可用于材料研究和机器学习的物理信息之间造成了严重的差距。在这里，我们介绍 Crystoria，一个大型晶体数据集，旨在为现代材料数据规模带来动态稳定性。我们通过系统地构建低能和亚稳态无机晶体，标准化其结构特性，并将机器学习加速的结构弛豫与基于声子的动态筛选相结合来构建 Crystoria。生成的数据集包含 2,649,640 个晶体结构，涵盖 89 个元素、230 个空间群中的 219 个，以及包含 1-48 个原子的原始晶胞。\n\n其中，1,793,353 个结构（67.68%）被归类为动态稳定结构，揭示了化学和晶体空间动态稳定性的显着变化。通过为数百万个晶体结构带来动态稳定性，Crystoria 为材料人工智能 (AI) 提供了物理基础，并能够系统地探索动态晶体景观。", "authors": [{"name": "Ke-Xin Pang"}, {"name": "Ze-Feng Gao"}, {"name": "Yan Gao"}, {"name": "Zhong-Yi Lu"}], "featured_authors": [{"name": "Ke-Xin Pang"}, {"name": "Ze-Feng Gao"}, {"name": "Yan Gao"}, {"name": "Zhong-Yi Lu"}], "author_count": 4}, {"id": "2610.38321", "category": "cond-mat", "title": "First-Principles Identification of Higher-Order Configurational Energy Terms and Their Magnetic-State Dependence in Lithium-Rich Oxyfluorides: From QUBO to HUBO", "abstract": "In this work, we use spin-polarized density functional theory (DFT) to identify substantial third-order, nonadditive configurational energy contributions in lithium-rich oxyfluorides that quadratic unconstrained binary optimization (QUBO) models cannot represent. We test the extension from QUBO to higher-order unconstrained binary optimization (HUBO) in two disordered-rocksalt cathode materials, Li$_2$MnO$_2$F (LMOF) and Li$_2$Mn$_{0.5}$Ti$_{0.5}$O$_2$F (LMTiOF), using composition-preserving DFT energy maps. Using fixed-geometry energy maps, we show that cubic HUBO captures nonadditive contributions absent from QUBO models and substantially reduces fitting errors in both materials. Direct DFT energy differences confirm third-order nonadditivity, while comparisons of magnetic initializations reveal a strong dependence of the LMTiOF contribution on the converged electronic state. These results support the inclusion of higher-order terms when modeling configurational energetics and highlight the need to account for magnetic-state dependence in constructing DFT energy maps. The extracted terms describe effective couplings among composition-preserving exchange variables, rather than uniquely identified microscopic three-atom interactions.", "url": "https://arxiv.org/abs/2610.38321", "type": "理论+数值", "summary": "在这项工作中，我们使用自旋极化密度泛函理论（DFT）来识别富锂氟氧化物中大量的三阶非加性构型能量贡献，这是二次无约束二元优化（QUBO）模型无法表示的。我们使用成分保持 DFT 能量图，在两种无序岩盐阴极材料 Li$_2$MnO$_2$F (LMOF) 和 Li$_2$Mn$_{0.5}$Ti$_{0.5}$O$_2$F (LMTiOF) 中测试从 QUBO 到高阶无约束二元优化 (HUBO) 的扩展。使用固定几何能量图，我们表明立方 HUBO 捕获了 QUBO 模型中缺少的非加性贡献，并大大减少了两种材料的拟合误差。直接 DFT 能量差异证实了三阶非加和性，而磁性初始化的比较揭示了 LMTiOF 贡献对收敛电子态的强烈依赖性。这些结果支持在构型能量学建模时包含高阶项，并强调在构建 DFT 能量图时需要考虑磁态依赖性。\n\n提取的术语描述了保持组成的交换变量之间的有效耦合，而不是唯一确定的微观三原子相互作用。", "authors": [{"name": "Joonho Bae"}], "featured_authors": [{"name": "Joonho Bae"}], "author_count": 1}, {"id": "2610.38338", "category": "cond-mat", "title": "Time evolution in the multi-component dynamical Keldysh models", "abstract": "We construct a time evolution operator for a dynamical quantum models with a multi-component random Gaussian field characterized by a long correlation time. We analyze three paradigmatic cases: non-Abelian $SU(2)$ symmetry class for the three-component Gaussian noise and Abelian symmetry classes $U(1)$ and $Z_2$ for the two- and one-component noises correspondingly. Starting with a limiting case of the infinite correlation time (Keldysh model) we shown that statistics of the two-component random field with a non-zero mean is described by the Rice distribution. We derived and solved the system of coupled linear differential equations for the exact diagonal and off-diagonal single-particle Green's functions. We showed how the finite time correlation in Keldysh models are accounted by a continuous fractions method.", "url": "https://arxiv.org/abs/2610.38338", "type": "理论+数值", "summary": "我们为动态量子模型构造了一个时间演化算子，该模型具有以长相关时间为特征的多分量随机高斯场。我们分析了三种典型情况：三分量高斯噪声的非阿贝尔 $SU(2)$ 对称类以及相应的二分量和一分量噪声的阿贝尔对称类 $U(1)$ 和 $Z_2$。从无限相关时间（凯尔迪什模型）的极限情况开始，我们证明了具有非零均值的二分量随机场的统计量由莱斯分布描述。我们导出并求解了精确对角和非对角单粒子格林函数的耦合线性微分方程组。我们展示了如何通过连续分数法来解释 Keldysh 模型中的有限时间相关性。", "authors": [{"name": "M. N. Kiselev"}], "featured_authors": [{"name": "M. N. Kiselev"}], "author_count": 1}, {"id": "2610.38375", "category": "cond-mat", "title": "Structural Determination vs Stochastic Events: Relaxation Dynamics in a Supercooled Liquid", "abstract": "Structural relaxation in supercooled liquids is influenced by the initial configuration, yet its microscopic evolution exhibits substantial variability. Here, we investigate the interplay between structural constraints and dynamical stochasticity by examining fluctuations of relaxation dynamics across and within isoconfigurational ensembles. We show that fluctuations among trajectories originating from the same configuration constitute a substantial fraction of the total dynamical fluctuations over a broad range of temperatures. At the collective level, the distribution of relaxation times is well described by a stochastic model involving a sequence of effective relaxation events, whose number decreases upon cooling. At the microscopic level, dynamical fluctuations exhibit spatial correlations that grow upon cooling, revealing a spatial organization of relaxation even when the initial configuration is fixed. Remarkably, the characteristic length associated with these fluctuations closely follows the length scale inferred from the stochastic first-passage model, establishing a connection between the spatial organization of dynamical fluctuations and the temporal statistics of collective relaxation. Together, these results suggest that structural relaxation is governed by an interplay between configuration-dependent constraints and stochastic dynamical events: the initial structure influences when and where relaxation occurs, without uniquely determining its microscopic realization.", "url": "https://arxiv.org/abs/2610.38375", "type": "理论", "summary": "过冷液体中的结构弛豫受到初始构型的影响，但其微观演化表现出很大的可变性。在这里，我们通过检查同构系综之间和内部的弛豫动力学波动来研究结构约束和动态随机性之间的相互作用。我们表明，源自相同配置的轨迹之间的波动构成了较宽温度范围内总动态波动的很大一部分。在集体层面上，弛豫时间的分布可以通过随机模型很好地描述，该模型涉及一系列有效弛豫事件，其数量随着冷却而减少。在微观层面上，动态波动表现出在冷却时增长的空间相关性，即使初始构型固定，也揭示了松弛的空间组织。\n\n值得注意的是，与这些波动相关的特征长度紧密遵循从随机第一通道模型推断出的长度尺度，在动态波动的空间组织和集体松弛的时间统计之间建立了联系。总之，这些结果表明结构弛豫是由构型相关约束和随机动力学事件之间的相互作用控制的：初始结构影响弛豫发生的时间和地点，而不唯一确定其微观实现。", "authors": [{"name": "Shivam Mahajan"}, {"name": "Peter Harrowell"}, {"name": "Massimo Pica Ciamarra"}], "featured_authors": [{"name": "Shivam Mahajan"}, {"name": "Peter Harrowell"}, {"name": "Massimo Pica Ciamarra"}], "author_count": 3}, {"id": "2610.38449", "category": "cond-mat", "title": "Layer-Parity Control of the Superconducting Diode Effect in Monolayer NbSe$_2$", "abstract": "The superconducting diode effect is often associated with finite-momentum pairing, although model studies indicate that rectification reflects the asymmetry of the free energy about its minimum rather than the equilibrium pair momentum itself. Using a Wannier-based, self-consistent finite-$\\mathbf Q$ Bogoliubov-de Gennes approach with a Fermi-surface-adaptive quadrature that converges the critical currents, we show that the layer parity and orientation of magnetic proximity select the diode response of monolayer NbSe$_2$. For in-plane exchange, the equilibrium pair momentum $\\mathbf Q_{\\rm eq}$ and the diode efficiency are both linear in the layer-odd exchange contrast: parallel proximity on the two Se sublayers is reciprocal, and antiparallel proximity doubles the response. An out-of-plane component separates the two observables. It leaves $\\mathbf Q_{\\rm eq}$ nearly unchanged but, through pair breaking, suppresses the efficiency by more than an order of magnitude and, at low temperature, reverses it. Purely out-of-plane exchange, for which $C_3$ symmetry forbids a helical term, keeps $\\mathbf Q_{\\rm eq}=0$ yet produces a trigonal diode effect, controlled by the layer-even exchange and larger than the in-plane one above $0.65$~meV at low temperature. Magnetic layer parity thus selects between a helical and a trigonal diode channel. The trigonal channel is an intrinsic, symmetry-allowed contribution to the field-free rectification reported in NbSe$_2$/CrBr$_3$ and predicts that two-sided out-of-plane proximity cancels it when antiparallel and, at the same exchange per layer, enhances it about fourfold when parallel, in the computed range.", "url": "https://arxiv.org/abs/2610.38449", "type": "理论+数值", "summary": "超导二极管效应通常与有限动量配对相关，尽管模型研究表明整流反映了自由能关于其最小值的不对称性，而不是平衡对动量本身的不对称性。使用基于 Wannier 的自洽有限 $\\mathbf Q$ Bogoliubov-de Gennes 方法以及收敛临界电流的费米表面自适应求积法，我们表明层奇偶校验和磁接近方向选择了单层 NbSe$_2$ 的二极管响应。对于面内交换，平衡对动量 $\\mathbf Q_{\\rm eq}$ 和二极管效率在奇数层交换对比中都是线性的：两个 Se 子层上的平行接近是倒数的，反平行接近使响应加倍。平面外分量将两个可观察量分开。它使 $\\mathbf Q_{\\rm eq}$ 几乎保持不变，但通过对破坏，将效率抑制了一个数量级以上，并且在低温下将其逆转。\n\n纯粹的面外交换，$C_3$对称性禁止螺旋项，保持$\\mathbf Q_{\\rm eq}=0$，但产生三角二极管效应，由层偶交换控制，并且在低温下比面内交换大$0.65$~meV以上。因此，磁性层奇偶校验在螺旋二极管沟道和三角形二极管沟道之间进行选择。三角通道是一种内在的、对称性允许的对 NbSe$_2$/CrBr$_3$ 中报告的无场整流的贡献，并预测当反平行时两侧平面外接近会抵消它，并且在每层相同的交换下，在计算范围内平行时将其增强约四倍。", "authors": [{"name": "Yusuf Wicaksono"}, {"name": "Toshikaze Kariyado"}], "featured_authors": [{"name": "Yusuf Wicaksono"}, {"name": "Toshikaze Kariyado"}], "author_count": 2}, {"id": "2610.38492", "category": "cond-mat", "title": "Far Tails of the Positional Distribution in random walk: A Saddle-Point Approach", "abstract": "Rare events and large-deviation theory have attracted considerable interest in the study of random walks. Here, we investigate the rare events of the positional distribution of continuous-time random walks under ordinary and equilibrium initial conditions using the saddle point method. We show that the far-tail behavior is sensitive to the expansion of the waiting-time distribution near its minimum value. For a general power-series expansion near the minimum waiting time, the positional distribution exhibits an approximately exponential decay in its far tails. In contrast, when the waiting-time distribution has a cutoff at its minimum value, the positional distribution exhibits an unexpected Gaussian decay, in contrast to the far-tail behavior of the renewal-count distribution. We further find that the most likely number of renewals required to reach a given position, as well as the associated rate functions, is insensitive to the initial conditions, whereas the far tails of the positional distribution retain a dependence on the initial conditions. Our results provide new insights into the rare-event statistics and large deviations of random walks.", "url": "https://arxiv.org/abs/2610.38492", "type": "理论", "summary": "罕见事件和大偏差理论引起了人们对随机游走研究的极大兴趣。在这里，我们使用鞍点法研究普通和平衡初始条件下连续时间随机游走的位置分布的罕见事件。我们表明，远尾行为对等待时间分布在其最小值附近的扩展很敏感。对于接近最小等待时间的一般幂级数展开，位置分布在其远端表现出近似指数衰减。相反，当等待时间分布在其最小值处截止时，位置分布表现出意想不到的高斯衰减，这与续订计数分布的远尾行为形成鲜明对比。我们进一步发现，到达给定位置所需的最可能的更新次数以及相关的速率函数对初始条件不敏感，而位置分布的远尾保留对初始条件的依赖。我们的结果为罕见事件统计和随机游走的大偏差提供了新的见解。", "authors": [{"name": "Chen Zhou"}, {"name": "YuDa Cheng"}, {"name": "Yangji Li"}, {"name": "Jing Xu"}, {"name": "Wanli Wang"}], "featured_authors": [{"name": "Chen Zhou"}, {"name": "YuDa Cheng"}, {"name": "Yangji Li"}, {"name": "Jing Xu"}, {"name": "Wanli Wang"}], "author_count": 5}, {"id": "2610.38501", "category": "cond-mat", "title": "Ordered patches cap the stability of disordered frameworks", "abstract": "Structural disorder can stabilize frameworks against pressure-induced failure, yet the ordered regions it contains limit this gain. We show that, in rigid-jointed frames under hydrostatic pressure, an ensemble containing arbitrarily large patches of a crystal at positive density, whose centres carry a scaled crystal prestress, cannot stay linearly stable once those patches are stressed beyond the crystal's threshold for localizable instabilities. A homogeneous loss of positive definiteness while all Bloch modes, including the acoustic limit, remain stable cannot localize, leaving a window for stabilization. Extending an acoustic criterion to prestress, we show for all point groups that such a window requires a strain that keeps the crystal's symmetry. Unless the patches are shielded from stress, disorder cannot protect a crystal against a failure that breaks its symmetry, and protects a cubic crystal at most against volume collapse. In two-dimensional Truchet frames, planted ordered domains bring the threshold within 1% of the bound, and correlations short of long-range order localize failure on ordered clusters. Across 876 slender-strut nets, 798 fail first by a localizable instability; the other 78 have a median window of 7.6%. Stability gained through disorder is capped by the localizable instabilities of the local order it permits.", "url": "https://arxiv.org/abs/2610.38501", "type": "理论", "summary": "结构无序可以稳定框架以防止压力引起的失效，但它所包含的有序区域限制了这种增益。我们表明，在静水压力下的刚性连接框架中，包含任意大正密度晶体片的整体，其中心带有缩放的晶体预应力，一旦这些片受到的应力超过晶体局部不稳定性的阈值，就无法保持线性稳定。当所有布洛赫模式（包括声学极限）保持稳定时，正定性的均匀损失无法定位，从而留下了稳定的窗口。将声学标准扩展到预应力，我们对所有点组表明，这样的窗口需要保持晶体对称性的应变。除非这些补丁能够免受应力影响，否则无序无法保护晶体免受破坏其对称性的破坏，并且最多可以保护立方晶体免受体积塌陷。在二维 Truchet 框架中，植入的有序域将阈值控制在边界的 1% 以内，并且短程有序的相关性会导致有序簇上的局部失败。\n\n在 876 个细长支柱网中，有 798 个首先因局部不稳定而失败；其他 78 个的中值窗口为 7.6%。通过无序获得的稳定受到其所允许的局部秩序的局部不稳定的限制。", "authors": [{"name": "Joohan Nam"}], "featured_authors": [{"name": "Joohan Nam"}], "author_count": 1}, {"id": "2610.38594", "category": "cond-mat", "title": "Swimming versus Screening: How Activity Reshapes the Ionic Cloud of a Charged Particle", "abstract": "A major question in active matter is how interactions between particles are modified by activity. Here, we address this question for Coulomb interactions by considering a charged swimmer immersed in an electrolyte. A static charge is screened by an ionic cloud that decays over the Debye length $\\lambda_D$. We show that the persistent motion of the swimmer can qualitatively modify the steady-state ionic charge-density profile. At low activity, the swimmer appears effectively quasistatic to the ions, and conventional Debye-Hückel screening is recovered. At higher activity, the ballistic-to-diffusive dynamics of the swimmer are reflected in distinct spatial regimes. A power-law decay is followed by a stretched-exponential decay at intermediate distances. At sufficiently large distances, exponential screening is restored, but with an increased screening length, $\\lambda>\\lambda_D$, revealing activity-induced underscreening. Thus, active motion modifies both the spatial form and the range of electrostatic screening. Our results motivate the study of active electrolytes composed of positively and negatively charged swimmers.", "url": "https://arxiv.org/abs/2610.38594", "type": "理论", "summary": "活性物质的一个主要问题是粒子之间的相互作用如何被活动改变。在这里，我们通过考虑浸入电解质中的带电游泳者来解决库仑相互作用的问题。静电荷被离子云屏蔽，离子云在德拜长度 $\\lambda_D$ 上衰变。我们表明，游泳者的持续运动可以定性地改变稳态离子电荷密度分布。在低活性时，游泳者对离子表现出有效的准静态，并且恢复了传统的德拜-休克尔筛选。在较高的活动度下，游泳者的弹道到扩散动力学反映在不同的空间状态中。幂律衰减之后是中等距离的拉伸指数衰减。在足够大的距离下，指数筛选恢复，但筛选长度 $\\lambda>\\lambda_D$ 增加，揭示了活动引起的筛选不足。因此，主动运动改变了静电屏蔽的空间形式和范围。我们的结果激发了对由带正电和带负电的游泳者组成的活性电解质的研究。", "authors": [{"name": "Tanmoy Chakraborty"}, {"name": "Tomer Markovich"}, {"name": "Ram M. Adar"}], "featured_authors": [{"name": "Tanmoy Chakraborty"}, {"name": "Tomer Markovich"}, {"name": "Ram M. Adar"}], "author_count": 3}, {"id": "2610.38626", "category": "cond-mat", "title": "Topology of Wannierizable Insulators", "abstract": "We study the freedom in choosing Wannier centers and the associated symmetry representations in noninteracting Wannierizable insulators. We compare Wyckoff deformations of atomic configurations with symmetry-preserving adiabatic deformations of occupied states, both with and without adding common occupied atomic orbitals. Explicit examples show that stable Wyckoff equivalence and adiabatic equivalence at fixed filling do not imply each other. In spinless $Fm'm'm'$, an Euler class distinguishes stably Wyckoff-equivalent configurations. In spinless $P\\overline1'$, adiabatically equivalent configurations remain distinct under stable Wyckoff deformations. We also classify when stable Wyckoff and stable adiabatic equivalence coincide. They agree in two or fewer dimensions and in three-dimensional spinful systems. For three-dimensional spinless systems, Chern insulator pumps give additional equivalences in 134 magnetic space groups. These groups preserve spacetime orientation and have a point whose site-symmetry group contains $222$, $\\overline1'$, or $\\overline4'$.", "url": "https://arxiv.org/abs/2610.38626", "type": "理论", "summary": "我们研究了选择万尼尔中心的自由度以及非相互作用万尼尔化绝缘体中相关的对称表示。我们将原子构型的威科夫变形与占据态的保对称绝热变形进行比较，无论是否添加共同占据原子轨道。明确的例子表明，固定填充时的稳定威科夫等价和绝热等价并不相互暗示。在无旋转 $Fm'm'm'$ 中，欧拉类区分稳定的威科夫等价配置。在无自旋 $P\\overline1'$ 中，绝热等效构型在稳定的威科夫变形下仍然不同。我们还对稳定威科夫和稳定绝热等价一致时进行分类。它们在二维或更少维度以及三维旋转系统中是一致的。对于三维无旋转系统，陈绝缘体泵在 134 个磁空间群中给出了额外的等价性。这些组保留时空方向，并且有一个点，其位点对称组包含 $222$、$\\overline1'$ 或 $\\overline4'$。", "authors": [{"name": "Ken Shiozaki"}], "featured_authors": [{"name": "Ken Shiozaki"}], "author_count": 1}, {"id": "2610.38627", "category": "cond-mat", "title": "Uniaxial strain tuning of functional properties in antiferroelectric PbZrO3 membrane capacitors", "abstract": "Lead zirconate (PbZrO3, PZO) is a prototypical antiferroelectric (AFE) system promising for applications such as energy storage and neuromorphic computing. However, in conventional thin-film architectures, its functional potential is often limited by substrate clamping. Although emerging freestanding membrane techniques offer an approach to release this clamping and enable dynamic strain engineering, a systematic understanding of how external strain modulates the switching between AFE and ferroelectric (FE) states is missing. In this study, we investigate the uniaxial strain effects on PZO membrane capacitors transferred onto flexible substrates via a gold-bonding method. We demonstrate that in-plane dynamic strain modulates the AFE-FE switching and functional properties. Corroborated by atomistic simulations, we reveal that the strain-dependent evolution arises from the superposition of the intrinsic strain dependence of specific domain orientation variants and extrinsic strain-induced redistribution of the relative population of different domain variants. These findings provide a predictive understanding of uniaxial strain tuning of AFE-FE switching in PZO, and pave the way for exploiting the functional potential of freestanding antiferroelectric membranes.", "url": "https://arxiv.org/abs/2610.38627", "type": "数值", "summary": "锆酸铅（PbZrO3，PZO）是一种典型的反铁电（AFE）系统，有望用于能量存储和神经形态计算等应用。然而，在传统的薄膜架构中，其功能潜力通常受到基板夹持的限制。尽管新兴的独立式膜技术提供了一种释放这种钳位并实现动态应变工程的方法，但仍缺乏对外部应变如何调节 AFE 和铁电 (FE) 状态之间切换的系统理解。在这项研究中，我们研究了通过金键合方法转移到柔性基板上的 PZO 薄膜电容器的单轴应变效应。我们证明面内动态应变可调节 AFE-FE 切换和功能特性。通过原子模拟证实，我们揭示了应变依赖性演化是由特定域方向变体的内在应变依赖性和外在应变引起的不同域变体相对群体的重新分布的叠加而产生的。\n\n这些发现提供了对 PZO 中 AFE-FE 切换的单轴应变调谐的预测性理解，并为开发独立式反铁电膜的功能潜力铺平了道路。", "authors": [{"name": "Umair Saeed"}, {"name": "Huazhang Zhang"}, {"name": "David Pesquera"}, {"name": "Fernando Gómez-Ortiz"}, {"name": "Jessica Padilla- Pantoja"}, {"name": "Jose Santiso"}, {"name": "Philippe Ghosez"}, {"name": "Gustau Catalan"}], "featured_authors": [{"name": "Umair Saeed"}, {"name": "Huazhang Zhang"}, {"name": "David Pesquera"}, {"name": "Jose Santiso"}, {"name": "Philippe Ghosez"}, {"name": "Gustau Catalan"}], "author_count": 8}, {"id": "2610.38689", "category": "cond-mat", "title": "The effects of hydrodynamic interactions on the swimming velocity and stability of a swarm of microswimmers", "abstract": "The dynamics and stability of a swarm of microswimmers is examined here using a thermodynamically compliant microswimmer model. The theory presented here is a mean-field model in which the swarm is considered to be a uniform solution of swimmers that are moving, on average, in the same direction. The hydrodynamic interaction between swimmers is modeled accurately assuming a crystalline arrangement to the swarm. A swimmer in the swarm can swim up to twelve times faster than when alone in an infinite sea, when the volume fraction of swimmers in the swarm is about 0.14. Moreover we have also studied the stability of the swarm around a uniform crystalline arrangement by calculating the hydrodynamic torques generated by the swarm as a function of the volume fraction of swimmers. The predictions presented here agree with recent multiparticle simulations that have shown that hydrodynamic torques have a stabilizing effect in swarms of pullers while swarms of pushers are generally destabilized by hydrodynamic interactions. The thermodynamically admissible coupling between the swimmer's motion and fuel consumption allows us to study the full dynamics instead of artificially constrained steady-states only. By accounting for fuel consumption and high order hydrodynamic interactions we are able to examine the swarm's stability as function of fuel concentration and the volume fraction of swimmers. We find that at high concentrations of fuel, swarms of pullers are stabilized by hydrodynamic torques for volume fractions of swimmers as low as 0.02 but at lower volume fractions Brownian forces make the swarm unstable.", "url": "https://arxiv.org/abs/2610.38689", "type": "理论+数值", "summary": "这里使用符合热力学的微型游泳者模型检查了一群微型游泳者的动力学和稳定性。这里提出的理论是一个平均场模型，其中群体被认为是平均沿同一方向移动的游泳者的均匀解。假设群体呈晶体排列，准确地模拟了游泳者之间的水动力相互作用。当群体中游泳者的体积分数约为 0.14 时，群体中的游泳者的游泳速度比单独在无限海洋中时快 12 倍。此外，我们还通过计算群产生的流体动力扭矩作为游泳者体积分数的函数，研究了均匀晶体排列周围群的稳定性。这里提出的预测与最近的多粒子模拟一致，该模拟表明流体动力扭矩对拉动群具有稳定作用，而推动动群通常会因流体动力相互作用而不稳定。\n\n游泳者的运动和燃料消耗之间的热力学允许耦合使我们能够研究完整的动力学，而不仅仅是人为约束的稳态。通过考虑燃料消耗和高阶流体动力学相互作用，我们能够检查蜂群的稳定性作为燃料浓度和游泳者体积分数的函数。我们发现，在高浓度的燃料下，拉拔器群可以通过水动力扭矩来稳定，游泳者的体积分数低至 0.02，但在较低的体积分数下，布朗力使拉拔器群变得不稳定。", "authors": [{"name": "Andrés Córdoba"}, {"name": "Jay D. Schieber"}], "featured_authors": [{"name": "Andrés Córdoba"}, {"name": "Jay D. Schieber"}], "author_count": 2}, {"id": "2610.38692", "category": "cond-mat", "title": "Symmetries and Propagation of Surface Plasmon Polaritons in Axion Electrodynamics", "abstract": "Surface plasmon polaritons at the interface between a conductor governed by axion electrodynamics and an ordinary dielectric are studied using a general phenomenological model, in which the macroscopic response is described by an axial vector $ \\mathbf{G} $, responsible for the anomalous Hall effect, and a pseudoscalar $ W $, accounting for the chiral magnetic effect. We extend the analysis of the chiral magnetic effect in the planar geometry, address its role in the cylindrical one and, in both geometries, discuss the case in which the two effects coexist. We find an upper bound on $ W $, a nonreciprocity requiring both effects and the absence of freely propagating modes, depending on the orientation of $ \\mathbf{G} $, for the planar interface, and, for the cylindrical one, a novel coupling between the linear and orbital angular momenta of the modes, which already arises from the chiral magnetic effect alone and persists when the anomalous Hall effect is also present. The exact eigenmodes of the axion medium are derived, and the symmetries and propagation features of the surface modes are made explicit by analytical and asymptotic evaluation of the dispersion relations.", "url": "https://arxiv.org/abs/2610.38692", "type": "理论", "summary": "使用一般唯象模型研究了受轴子电动力学控制的导体与普通电介质之间界面处的表面等离子体激元，其中宏观响应由轴向矢量$ \\mathbf{G} $（负责反常霍尔效应）和赝标量$ W $（负责手性磁效应）来描述。我们扩展了平面几何中手性磁效应的分析，解决了其在圆柱几何中的作用，并在两种几何中讨论了两种效应共存的情况。我们发现 $ W $ 上的一个上限，即对于平面界面，需要效应和不存在自由传播模式的非互易性，具体取决于 $ \\mathbf{G} $ 的方向；对于圆柱界面，模式的线性和轨道角动量之间存在一种新颖的耦合，这种耦合已经单独由手性磁效应产生，并且当反常霍尔效应也存在时仍然存在。推导了轴子介质的精确本征模，并通过色散关系的解析和渐近评估明确了表面模的对称性和传播特征。", "authors": [{"name": "Marco Peluso"}], "featured_authors": [{"name": "Marco Peluso"}], "author_count": 1}, {"id": "2610.38724", "category": "cond-mat", "title": "Large connectivity expansion of Ising Spin Glasses on random graphs", "abstract": "We compute a high-connectivity analytical expansion for Ising spin glasses on sparse random graphs. We expand the cavity equations around the fully-connected mean-field limit, focusing on the critical behavior of the system: our approach allows us to compute the de Almeida-Thouless line of mean-field finitely-connected systems in the temperature $T$--magnetic field $H$ plane, by means of closed analytical equations. The exact cavity solution of such systems can only be obtained by solving numerically iterative equations, so our approach brings a notable computational advantage. On the theoretical side, we are able to identify three sources of corrections to the fully-connected mean-field solution: i) the non-Gaussianity of the cavity fields, ii) the statistical correlation between the cavity fields and their fluctuations, and iii) the corrections to the cavity filter functions. These corrections are treated using two different expansions: a non-uniform expansion, where we expand all three contributions around the mean-field solution, and a uniform expansion, where we only expand the statistics but leave the cavity filters untouched. The former allows for a direct comparison with the Sherrington-Kirkpatrick model but fails at low temperatures, as a consequence of the de Almeida-Thouless line diverging in the zero-temperature limit. On the other hand, the uniform expansion describes with good accuracy the critical behavior of the system. We also extend these results to the $T = 0$ limit.", "url": "https://arxiv.org/abs/2610.38724", "type": "理论+数值", "summary": "我们在稀疏随机图上计算伊辛自旋玻璃的高连通性分析展开式。我们围绕全连通平均场极限展开腔方程，重点关注系统的临界行为：我们的方法允许我们通过闭合解析方程计算温度 $T$-磁场 $H$ 平面中平均场有限连通系统的 de Almeida-Thouless 线。此类系统的精确腔解只能通过求解数值迭代方程来获得，因此我们的方法带来了显着的计算优势。在理论方面，我们能够确定全连接平均场解的三个校正源：i）腔场的非高斯性，ii）腔场及其波动之间的统计相关性，以及iii）对腔滤波器函数的校正。这些校正使用两种不同的扩展进行处理：非均匀扩展，我们扩展平均场解周围的所有三个贡献，以及均匀扩展，我们仅扩展统计数据，但保持空腔滤波器不变。\n\n前者可以与 Sherrington-Kirkpatrick 模型进行直接比较，但在低温下会失败，因为 de Almeida-Thouless 线在零温度限制下发散。另一方面，均匀展开非常准确地描述了系统的关键行为。我们还将这些结果扩展到 $T = 0$ 限制。", "authors": [{"name": "Luca Maria Del Bono"}, {"name": "Flavio Nicoletti"}, {"name": "Federico Ricci-Tersenghi"}], "featured_authors": [{"name": "Luca Maria Del Bono"}, {"name": "Flavio Nicoletti"}, {"name": "Federico Ricci-Tersenghi"}], "author_count": 3}, {"id": "2610.38762", "category": "cond-mat", "title": "A Luminescent Organic Triradical as an Optically Addressable Qudit", "abstract": "Luminescent molecular trityl radicals provide options for optically-addressable electron spins and are promising for quantum sensing. Here, we present a luminescent triradical comprising three trityl groups covalently attached to a central phenyl ring. We find two distinct photoluminescence bands at 633 nm and 690 nm with different temporal evolutions, which we attribute to excited quartet and doublet states respectively. The ground state quartet is 1 meV (11.5K) lower in energy than the doublet, resulting in near-equal population of doublets and quartets at room temperature. We demonstrate optically initialized spin polarization, coherent control of the ground state quartet, and optical readout. Potential for optical quantum sensing is shown via optically detected magnetic resonance at room temperature and magneto-photoluminescence up to 3% at 5 mT. This material is a candidate optically addressable molecular qudit, providing opportunities to leverage larger state spaces than qubit systems.", "url": "https://arxiv.org/abs/2610.38762", "type": "理论", "summary": "发光分子三苯甲基自由基为光学可寻址电子自旋提供了选择，并且有望用于量子传感。在这里，我们提出了一种发光三自由基，包含三个共价连接到中心苯环的三苯甲基。我们在 633 nm 和 690 nm 处发现了两个不同的光致发光带，具有不同的时间演化，我们分别将其归因于激发四重态和双重态。基态四重态的能量比双重态低 1 meV (11.5K)，导致室温下双重态和四重态的数量几乎相等。我们演示了光学初始化的自旋偏振、基态四重态的相干控制和光学读出。通过室温下光学检测的磁共振和 5 mT 下高达 3% 的磁光致发光显示了光学量子传感的潜力。这种材料是候选的光学可寻址分子量子，提供了利用比量子位系统更大的状态空间的机会。", "authors": [{"name": "Kueyoung E. Kim"}, {"name": "Avik Bhanja"}, {"name": "Alistair Inglis"}, {"name": "William K. Myers"}, {"name": "Sam L. Bayliss"}, {"name": "Richard H. Friend"}, {"name": "Petri Murto"}], "featured_authors": [{"name": "Kueyoung E. Kim"}, {"name": "Avik Bhanja"}, {"name": "Alistair Inglis"}, {"name": "Sam L. Bayliss"}, {"name": "Richard H. Friend"}, {"name": "Petri Murto"}], "author_count": 7}, {"id": "2610.38801", "category": "cond-mat", "title": "Transverse momentum transport and collective-mode localization in dipolar tube arrays", "abstract": "We study transverse transport of longitudinal momentum in an array of one-dimensional Bose gases coupled by dipolar interactions without particle tunneling. Within zero-temperature Bogoliubov theory, we characterize this transport using the inter-tube momentum correlator and its squared magnitude, termed amplitude and intensity. In a uniform array, pairs of Bogoliubov quasiparticles propagate ballistically across the tubes, while their dephasing produces a $t^{-3}$ decay of the long-wavelength amplitude. Tube-to-tube density imbalance acts as quenched disorder and localizes the transverse collective modes. At fixed longitudinal momentum, this arrests the growth of the intensity profile, whose time-averaged spatial decay measures the localization length. Equal-time correlations are much less sensitive to disorder and primarily reflect the interaction range: in the uniform array they decay with tube separation as $r^{-7}$ for dipolar coupling, compared with exponential decay for nearest-neighbor coupling. Finally, sufficiently strong inter-tube repulsion destabilizes the longitudinally uniform state toward density modulations staggered between neighboring tubes, at a threshold independent of density imbalance.", "url": "https://arxiv.org/abs/2610.38801", "type": "理论", "summary": "我们研究了通过偶极相互作用耦合的一维玻色气体阵列中纵向动量的横向传输，无需粒子隧道效应。在零温 Bogoliubov 理论中，我们使用管间动量相关器及其平方幅度（称为幅度和强度）来表征这种传输。在均匀阵列中，成对的博戈留波夫准粒子在管内弹道传播，而它们的相移会产生长波长振幅的 $t^{-3}$ 衰减。管与管之间的密度不平衡起到猝灭无序的作用，并使横向集体模式局域化。在固定的纵向动量下，这会阻止强度分布的增长，其时间平均空间衰减测量局部长度。等时相关性对无序的敏感度要低得多，主要反映相互作用范围：在均匀阵列中，偶极耦合的均匀阵列随管间距衰减为 $r^{-7}$，而最近邻耦合的指数衰减则为 $r^{-7}$。\n\n最后，足够强的管间排斥力使纵向均匀状态不稳定，导致相邻管之间交错的密度调制处于与密度不平衡无关的阈值。", "authors": [{"name": "Camilla Polvara"}, {"name": "Nishchhal Verma"}, {"name": "Sarang Gopalakrishnan"}, {"name": "Vadim Oganesyan"}], "featured_authors": [{"name": "Camilla Polvara"}, {"name": "Nishchhal Verma"}, {"name": "Sarang Gopalakrishnan"}, {"name": "Vadim Oganesyan"}], "author_count": 4}, {"id": "2610.38805", "category": "cond-mat", "title": "Spectrum of the steady-state distribution function of disordered Lindbladian fermions at large channel number", "abstract": "Free fermions coupled to particle gain and loss relax to a Gaussian steady state, in which every natural orbital has its own occupation. We find the distribution of these occupations $\\varrho_{\\rm st}$ for a random Hamiltonian coupled to many random gain and loss channels. Each orbital is filled and emptied at its own rates, and the Hamiltonian, moving particles across the levels during their lifetime, averages the differences between the orbitals. We show that this averaging is incomplete: the spread of the occupations decreases only as the inverse square root of the number of channels per level. At large system size the distribution depends on the grain Hamiltonian only through its density of states $\\nu(E)$. The spread is bounded by the baths alone: even Hamiltonians with unbounded, heavy-tailed spectra cannot widen it beyond this bound. The spread suppresses the particle-number fluctuations below their binomial value.", "url": "https://arxiv.org/abs/2610.38805", "type": "理论", "summary": "与粒子增益和损耗耦合的自由费米子松弛到高斯稳态，其中每个自然轨道都有自己的占据。我们找到了与许多随机增益和损失通道耦合的随机哈密顿量的这些占用 $\\varrho_{\\rm st}$ 的分布。每个轨道都以自己的速率充满和排空，哈密顿量在粒子的生命周期内跨越各个能级移动粒子，对轨道之间的差异进行平均。我们证明这种平均是不完整的：占用的分布仅随着每级通道数量的平方根的倒数而减小。在大系统规模下，分布仅通过其状态密度 $\\nu(E)$ 取决于晶粒哈密顿量。传播仅受浴池限制：即使具有无界、重尾光谱的哈密顿量也无法将其扩大到超出此界限。该散布将粒子数波动抑制在其二项式值以下。", "authors": [{"name": "Maksim Parfenov"}, {"name": "Igor Burmistrov"}], "featured_authors": [{"name": "Maksim Parfenov"}, {"name": "Igor Burmistrov"}], "author_count": 2}, {"id": "2610.38874", "category": "cond-mat", "title": "Effect of the surface on the energy levels in PbS and PbSe nanocrystals", "abstract": "The structure of the electron and hole quantum confinement levels in spherical PbS and PbSe nanocrystals (NCs) is studied within the framework of a four-band effective-mass model. This level structure was initially calculated within the Kang--Wise model, which employs the standard boundary condition of vanishing carrier wave functions at the NC surface. This model, however, does not allow one to account for the effect of the NC surface on the level structure. Here, the effect of the NC surface is modeled using general boundary conditions (GBCs) imposed on the envelope wave functions at the surface. We show that the surface properties modify the size dependence of the electron and hole confinement levels and lead to an additional spin--orbit splitting of the $1P_{h,e}$ levels. Using the GBCs, we are able to quantitatively describe the size dependence of the lowest optical transitions in bare PbS and PbSe NCs and explain the differences between the absorption spectra of bare and Cl-passivated PbS NCs", "url": "https://arxiv.org/abs/2610.38874", "type": "理论", "summary": "在四能带有效质量模型的框架内研究了球形 PbS 和 PbSe 纳米晶体 (NC) 中电子和空穴量子限制能级的结构。这种能级结构最初是在 Kang--Wise 模型中计算的，该模型采用了NC 表面消失载波函数的标准边界条件。然而，该模型不允许考虑 NC 表面对水平结构的影响。这里，NC 表面的影响是使用施加在表面包络波函数上的一般边界条件 (GBC) 进行建模的。我们表明，表面特性改变了电子和空穴限制能级的尺寸依赖性，并导致 $1P_{h,e}$ 能级的额外自旋轨道分裂。使用 GBC，我们能够定量描述裸 PbS 和 PbSe NC 中最低光学跃迁的尺寸依赖性，并解释裸 PbS NC 和 Cl 钝化 PbS NC 吸收光谱之间的差异", "authors": [{"name": "O. Lundgren"}, {"name": "A. V. Rodina"}, {"name": "Al.L. Efros"}], "featured_authors": [{"name": "O. Lundgren"}, {"name": "A. V. Rodina"}, {"name": "Al.L. Efros"}], "author_count": 3}, {"id": "2610.38876", "category": "cond-mat", "title": "Learning Between the Lines: Interaction Interpolation in a Multi Element Machine Learning Interatomic Potential", "abstract": "The continuous development of machine learning inter-atomic potentials (MLIAPs)has greatly accelerated materials research in recent years. However, the need to con- struct custom MLIAPs for each unique problem remains a bottleneck which raises the question of the transferability of MLIAPs. While foundation MLIAPs can achieve transferability due to the broad coverage of chemical space represented in their training sets, their size and computational cost limits their routine use. We address this gap by developing a lightweight general-purpose MLIAP for metal alloys spanning twelve elements (Al, Sc, Ti, V, Cu, Zn, Zr, Nb, Mo, Hf, Ta, W). Here, we utilize a step-wise active learning (AL) approach to develop a compact yet diverse dataset and model that generalizes well by interpolating from previously seen interactions. The resulting potentials transfer effectively to unseen, higher body-order alloys systems, requiring only unary and binary training data to capture ternary and quaternary systems. The model also transfers well to new elements via an alchemical extrapolation within the network, requiring only unary data for the new element and its alloys. These findings suggest that MLIAPs trained on targeted, diversity-driven datasets provide transferability at a relatively low computational cost, offering a practical path toward general-purpose, resource-efficient MLIAPs for materials modeling.", "url": "https://arxiv.org/abs/2610.38876", "type": "理论+数值", "summary": "近年来，机器学习原子间势（MLIAP）的不断发展极大地加速了材料研究。然而，为每个独特问题构建定制 MLIAP 的需求仍然是一个瓶颈，这引发了 MLIAP 的可转移性问题。虽然基础 MLIAP 由于其训练集中所代表的化学空间的广泛覆盖而可以实现可转移性，但它们的大小和计算成本限制了它们的常规使用。我们通过开发一种适用于十二种元素（Al、Sc、Ti、V、Cu、Zn、Zr、Nb、Mo、Hf、Ta、W）金属合金的轻质通用 MLIAP 来解决这一差距。在这里，我们利用逐步主动学习（AL）方法来开发一个紧凑而多样化的数据集和模型，通过从以前看到的交互中进行插值来很好地概括。由此产生的电势有效地转移到看不见的、更高体序的合金系统，只需要一元和二元训练数据来捕获三元和四元系统。该模型还通过网络内的炼金术外推法很好地转移到新元素，只需要新元素及其合金的一元数据。\n\n这些发现表明，在有针对性的、多样性驱动的数据集上训练的 MLIAP 以相对较低的计算成本提供可转移性，为实现通用、资源高效的材料建模 MLIAP 提供了一条实用途径。", "authors": [{"name": "Ademola Soyemi"}, {"name": "Kipton Barros"}, {"name": "Timothy C. Germann"}, {"name": "Benjamin T. Nebgen"}, {"name": "Brenden W. Hamilton"}], "featured_authors": [{"name": "Ademola Soyemi"}, {"name": "Kipton Barros"}, {"name": "Timothy C. Germann"}, {"name": "Benjamin T. Nebgen"}, {"name": "Brenden W. Hamilton"}], "author_count": 5}, {"id": "2610.38925", "category": "cond-mat", "title": "Thermodynamic cost of locally maintaining a steady state", "abstract": "The Gibbs states of local Hamiltonians have short-range conditional correlations. To maintain a steady state with long-range conditional correlations, one might expect that a stochastic process must ``pay'' either in nonlocal moves or entropy production. Surprisingly, we find strictly local Gaussian processes that obey detailed balance and have unique steady states with arbitrarily long-range conditional correlations. We show that such processes must still produce entropy, if implemented using a local quadratic Hamiltonian coupled locally to equilibrium, rapidly relaxing baths. We lower-bound this entropy production in terms of the steady state's conditional mutual information (CMI); if the CMI decays exponentially with distance, the associated length-scale is called the Markov length $\\xi$. The entropy production per site per relaxation time obeys $\\hat\\sigma \\ge c \\xi^2$ for large $\\xi$, and with $c$ an implementation-dependent constant. We also bound the tradeoff between coupling range and entropy production. We contrast these Gaussian processes with jump processes on discrete state spaces, for which, under certain irreducibility assumptions, steady states with long-range CMI are only possible if detailed balance is violated. We conjecture (and present evidence) that rapidly mixing local jump processes cannot stabilize steady states with long-range CMI.", "url": "https://arxiv.org/abs/2610.38925", "type": "理论", "summary": "当地哈密顿量的吉布斯状态具有短程条件相关性。为了保持具有长期条件相关性的稳定状态，人们可能期望随机过程必须在非局部移动或熵产生中“付出”。令人惊讶的是，我们发现严格的局部高斯过程服从细节平衡，并具有具有任意长程条件相关性的独特稳态。我们证明，如果使用局部耦合到平衡、快速松弛浴的局部二次哈密顿量来实现，这样的过程仍然必须产生熵。我们根据稳态的条件互信息（CMI）来限制这种熵产生；如果 CMI 随距离呈指数衰减，则相关的长度尺度称为马尔可夫长度 $\\xi$。对于大的 $\\xi$，每个站点每个弛豫时间的熵产生服从 $\\hat\\sigma \\ge c \\xi^2$，并且 $c$ 是依赖于实现的常数。我们还限制了耦合范围和熵产生之间的权衡。\n\n我们将这些高斯过程与离散状态空间上的跳跃过程进行对比，在某些不可约性假设下，只有在违反详细平衡的情况下，具有长程 CMI 的稳态才有可能。我们推测（并提供证据）快速混合局部跳跃过程无法通过远程 CMI 稳定稳态。", "authors": [{"name": "Sarang Gopalakrishnan"}], "featured_authors": [{"name": "Sarang Gopalakrishnan"}], "author_count": 1}, {"id": "2610.38937", "category": "cond-mat", "title": "Development and application of a machine learning potential for diamond surfaces and their sliding interfaces with silicon nitride and silica: effect of passivation, orientation and load", "abstract": "Friction and wear of diamond are controlled by its surface chemistry, which determines whether covalent bonds form across the sliding interface. First-principles simulations have explored the role of surface orientation and passivation, but are limited to a few hundred atoms and tens of picoseconds. To bridge this gap, we develop a reactive machine learning interatomic potential for the C/H/N/O/Si chemical space, covering diamond, silicon nitride, silicon oxide, their surfaces, interfaces, and environmental molecules. The potential is trained on a large dataset of diverse structures and is tested on multiple physical properties, including ab initio reaction barriers on diamond surfaces, and structural/mechanical properties of amorphous Si$_3$N$_4$ and SiO$_2$. We then simulate sliding of diamond-Si$_3$N$_4$ interfaces with four surface orientations, clean and H/OH-passivated terminations, and normal loads from 0.1 to 23 GPa. We identify two different regimes: one where sliding is localized at the interface, and shear stress is proportional to the interfacial bond density, and another where shear is distributed inside the softer material, and adhesion due to full interfacial bonding dominates. These results show how passivation, surface orientation and load together determine interfacial bonding and friction, with implications for the environmental sensitivity of diamond wear. More broadly, the potential enables reactive simulations of diamond, silicon nitride and silica with near-ab initio accuracy at length and time scales beyond first-principles methods, providing a useful tool for future studies of wear at plowing asperities, chemical-mechanical polishing, and properties of amorphous ceramic films.", "url": "https://arxiv.org/abs/2610.38937", "type": "理论+数值", "summary": "金刚石的摩擦和磨损由其表面化学控制，这决定了滑动界面上是否形成共价键。第一原理模拟探索了表面取向和钝化的作用，但仅限于几百个原子和几十皮秒。为了弥补这一差距，我们开发了 C/H/N/O/Si 化学空间的反应式机器学习原子间势，涵盖金刚石、氮化硅、氧化硅及其表面、界面和环境分子。该潜力在不同结构的大型数据集上进行了训练，并在多种物理特性上进行了测试，包括金刚石表面上的从头算反应势垒，以及非晶态 Si$_3$N$_4$ 和 SiO$_2$ 的结构/机械特性。然后，我们模拟具有四个表面方向、清洁和 H/OH 钝化终端以及 0.1 至 23 GPa 的法向载荷的金刚石-Si$_3$N$_4$ 界面的滑动。\n\n我们确定了两种不同的状态：一种是滑动集中在界面处，剪切应力与界面键合密度成正比，另一种是剪切力分布在较软的材料内部，并且由于完全界面键合而产生的粘附力占主导地位。这些结果表明钝化、表面取向和载荷如何共同决定界面结合和摩擦，并对金刚石磨损的环境敏感性产生影响。更广泛地说，这种潜力使得金刚石、氮化硅和二氧化硅的反应模拟能够在长度和时间尺度上以接近从头开始的精度超出第一原理方法，为未来研究犁耕粗糙度磨损、化学机械抛光和非晶陶瓷薄膜的性能提供了有用的工具。", "authors": [{"name": "Enrico Pedretti"}, {"name": "Maria Clelia Righi"}], "featured_authors": [{"name": "Enrico Pedretti"}, {"name": "Maria Clelia Righi"}], "author_count": 2}, {"id": "2610.38959", "category": "cond-mat", "title": "Separating the Density Wave Phase from Zero-Resistance Superconductivity in La$_4$Ni$_3$O$_{10}$", "abstract": "Identifying the key ingredients for superconductivity under pressure in the Ruddlesden-Popper nickelates remains a formidable challenge, due to a complex interplay between structural variations, oxygen content and location, electronically ordered phases, and the need for high pressures to reach the superconducting phase. To disentangle these complex inter-dependencies, here we study a series of clean single crystals of trilayer La$_4$Ni$_3$O$_{10}$. We discover that enhanced biaxial, compressive pressures induce a zero-resistance state at a 60\\% lower pressure compared to previous reports. At the same time, we completely separate the low-pressure density wave phase from superconductivity, effectively ruling out that soft, quantum critical fluctuations of the density wave order parameter act as the pairing glue in this system. Our results establish biaxial, in-plane pressures as a powerful tool for promoting superconductivity in nickelates, unifying the required pressure scales for superconductivity in different Ruddlesden-Popper structures, and providing a connection to the recently discovered thin film samples.", "url": "https://arxiv.org/abs/2610.38959", "type": "理论", "summary": "由于结构变化、氧含量和位置、电子有序相以及达到超导相所需的高压之间存在复杂的相互作用，确定 Ruddlesden-Popper 镍酸盐中压力下超导性的关键成分仍然是一项艰巨的挑战。为了理清这些复杂的相互依赖性，我们在这里研究了一系列干净的三层 La$_4$Ni$_3$O$_{10}$ 单晶。我们发现，与之前的报告相比，增强的双轴压缩压力可在压力降低 60% 的情况下产生零阻力状态。同时，我们将低压密度波相位与超导性完全分开，有效地排除了密度波序参数的软量子临界涨落在该系统中充当配对粘合剂的情况。我们的研究结果确立了双轴面内压力作为促进镍酸盐超导性的有力工具，统一了不同 Ruddlesden-Popper 结构中超导性所需的压力尺度，并提供了与最近发现的薄膜样品的连接。", "authors": [{"name": "P. Puphal"}, {"name": "A. Suthar"}, {"name": "B. Wehinger"}, {"name": "V. Sundaramurthy"}, {"name": "T. Priessnitz"}, {"name": "M. Knauft"}, {"name": "P. Sosa-Lizama"}, {"name": "Y.-M. Wu"}, {"name": "M. Hepting"}, {"name": "J. Nuss"}, {"name": "M. Isobe"}, {"name": "P. A. van Aken"}, {"name": "Y. E. Suyolcu"}, {"name": "B. Keimer"}, {"name": "H. Takagi"}, {"name": "P. Reiss"}], "featured_authors": [{"name": "P. Puphal"}, {"name": "A. Suthar"}, {"name": "B. Wehinger"}, {"name": "B. Keimer"}, {"name": "H. Takagi"}, {"name": "P. Reiss"}], "author_count": 16}, {"id": "2610.39037", "category": "cond-mat", "title": "Nonreciprocity Propels Nematic Defects", "abstract": "Nonreciprocal interactions are a generic source of nonequilibrium dynamics, yet their consequences for nematic topological defects remain unexplored. We introduce a nonreciprocal nematic model on a two-dimensional hexagonal lattice and formulate a continuum theory containing a nematic nonreciprocal torque. In the deterministic limit, simulations and symmetry analysis show that this torque drives +1/2 defects to self-propel along their polar axes. Nonreciprocity modifies the splitting pathway of integer +1 defects. These results identify a symmetry-resolved route from nonreciprocity to nematic defect transport and topological reorganization, distinct from active-stress-driven motion.", "url": "https://arxiv.org/abs/2610.39037", "type": "理论+数值", "summary": "非互易相互作用是非平衡动力学的一般来源，但它们对向列拓扑缺陷的影响仍未被探索。我们在二维六方晶格上引入了非互易向列模型，并制定了包含向列非互易扭矩的连续介质理论。在确定性极限下，模拟和对称分析表明，该扭矩驱动 +1/2 缺陷沿其极轴自推进。非互易性改变了整数+1缺陷的分裂路径。这些结果确定了从非互易性到向列缺陷传输和拓扑重组的对称解决途径，与主动应力驱动的运动不同。", "authors": [{"name": "Yunpeng Cao"}, {"name": "Yu Du"}, {"name": "Yao Li"}], "featured_authors": [{"name": "Yunpeng Cao"}, {"name": "Yu Du"}, {"name": "Yao Li"}], "author_count": 3}, {"id": "2610.39039", "category": "cond-mat", "title": "Response of Hydrogels and Microgels to Nanoparticle Crowding", "abstract": "Internal degrees of freedom of cross-linked polymer networks enable compressible hydrogels and microgels to swell or deswell by absorbing or expelling solvent in response to environmental changes. Macromolecules in solution can influence the swelling response by acting as crowding agents, with practical relevance for drug delivery and biosensing. We extend the Flory-Rehner theory of polymer network swelling to incorporate nanoparticle crowders as another implicit species that can perturb a gel through volume exclusion, including the entropic cost of crowder penetration from polymer field theory. Within the free energy landscape of asymmetric ternary mixtures, we numerically solve equilibrium relations equating solvent and crowder chemical potentials inside and outside the gel. Independently, we perform Monte Carlo simulations, including trial moves that allow gels to swell and take up crowders. We investigate how crowder size, solution concentration, cross-link density, and solvent quality influence swelling of polymeric gels, partitioning of crowders between inside and outside, and structural properties of microgel suspensions governed by Hertzian elastic pair interactions. Our results show that nanoparticle crowding promotes deswelling, thereby weakening interparticle correlations, and that, with increasing the concentration of crowders, polymeric gels reach a maximum loading capacity, dependent on crowder size and polymer cross-link density.", "url": "https://arxiv.org/abs/2610.39039", "type": "理论+数值", "summary": "交联聚合物网络的内部自由度使可压缩水凝胶和微凝胶能够通过吸收或排出溶剂来响应环境变化而膨胀或消膨胀。溶液中的大分子可以通过充当拥挤剂来影响肿胀反应，与药物输送和生物传感具有实际相关性。我们扩展了聚合物网络膨胀的 Flory-Rehner 理论，将纳米颗粒拥挤剂纳入作为另一种隐含物种，可以通过体积排除扰动凝胶，包括聚合物场理论中拥挤剂渗透的熵成本。在不对称三元混合物的自由能景观中，我们数值求解了平衡关系，使凝胶内外的溶剂和拥挤化学势相等。我们独立地进行蒙特卡罗模拟，包括允许凝胶膨胀并占据拥挤物的试验移动。我们研究了拥挤器尺寸、溶液浓度、交联密度和溶剂质量如何影响聚合物凝胶的膨胀、拥挤器内部和外部之间的分配以及由赫兹弹性对相互作用控制的微凝胶悬浮液的结构特性。\n\n我们的结果表明，纳米颗粒拥挤促进消溶胀，从而削弱颗粒间相关性，并且随着拥挤剂浓度的增加，聚合物凝胶达到最大负载能力，这取决于拥挤剂尺寸和聚合物交联密度。", "authors": [{"name": "Mahesh Aryal"}, {"name": "Alan R. Denton"}], "featured_authors": [{"name": "Mahesh Aryal"}, {"name": "Alan R. Denton"}], "author_count": 2}, {"id": "2610.39081", "category": "cond-mat", "title": "A rhombic spin-1 interpretation of a room-temperature GaN emitter", "abstract": "Single defects in GaN show optically detected magnetic resonance at room temperature. In the more abundant class, a minimal $S=3/2$ model leaves a $g\\approx 4$ line unexplained. For one defect, this line lies near the sum of the two outer lines, consistent with transitions among three shared levels. A rhombic $S=1$ model reproduces the three line positions with rms errors of 8.1-9.8 MHz. The tested second-order $S=3/2$ fits containing all three transitions and the published minimal model do not reproduce these positions. A ladder fitted to the strong lines remains viable if the $g\\approx 4$ line is a separate transition near the sum of the outer two. An unresolved frequency-window shift prevents the existing data from establishing the $S=1$ assignment uniquely. We propose a zero-field sweep that directly tests the isolated $S=1$ assignment.", "url": "https://arxiv.org/abs/2610.39081", "type": "理论+数值", "summary": "GaN 中的单缺陷在室温下显示出光学检测到的磁共振。在更丰富的类别中，最小的 $S=3/2$ 模型留下 $g\\approx 4$ 线无法解释。对于一个缺陷，这条线位于两条外部线的总和附近，与三个共享级别之间的过渡一致。菱形 $S=1$ 模型再现了 3 个线位置，均方根误差为 8.1-9.8 MHz。测试的二阶 $S=3/2$ 适合包含所有三个转换，并且已发布的最小模型不会重现这些位置。如果 $g\\approx 4$ 线是靠近外部两条线总和的单独过渡，则适合强线的梯子仍然可行。未解决的频率窗口偏移会阻止现有数据唯一地建立 $S=1$ 分配。我们提出了一种零场扫描，直接测试孤立的$S=1$分配。", "authors": [{"name": "Daniel Hashemi"}], "featured_authors": [{"name": "Daniel Hashemi"}], "author_count": 1}, {"id": "2610.39098", "category": "cond-mat", "title": "The End of Chaos at the Ideal Glass Transition", "abstract": "The ideal glass transition has often been associated with the extrapolated vanishing of configurational entropy $S_c$, yet how this thermodynamic criterion is reflected in microscopic dynamics remains unclear. Here, we show that the vanishing of deterministic chaos quantified by the maximum Lyapunov exponent $\\lambda_{
