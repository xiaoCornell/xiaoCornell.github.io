y: the apparent $k^{-5/3}$ signature in the kinetic energy spectrum is a narrow crossover between the $k^{-1}$ single-vortex and $k^{-3}$ core regimes, not a genuine Kolmogorov inertial range. The real-space second-order structure function provides decisive evidence via $S_2(r)\\propto \\ln r$ where $r$ is the spatial separation, with no $r^{2/3}$ Kolmogorov scaling, ruling out a true inertial cascade. These findings reveal that strongly coupled quantum turbulence lacks an inverse cascade due to the absence of macroscopic Onsager clusters, demonstrating energy transport fundamentally distinct from weakly coupled superfluids.", "url": "https://arxiv.org/abs/2608.17012", "type": "理论", "summary": "量子湍流的一个长期障碍是难以维持稳健的统计稳态，从而阻碍了对普遍涡旋组织和动力学尺度的明确识别。我们通过连续朗道不稳定驱动在二维全息超流体湍流中构建了这样的稳态，维持 ${\\sim}2500$ 漩涡，没有瞬态伪影。拓扑电荷结构因子 $S_c(k)$ 揭示了 I 类无序超均匀性，其中 $S_c(k)\\propto k^{\\alpha>1}$ 为 $k\\to0$，其中 $k$ 是波数。这构成了同类中最强的长程有序，也是首次在强驱动、以拓扑缺陷为组织原理的非平衡量子流体中观察到，建立了一种新颖的非平衡涡旋相。利用这个平台，我们解决了缩放争议：动能谱中明显的 $k^{-5/3}$ 特征是 $k^{-1}$ 单涡流和 $k^{-3}$ 核心状态之间的狭窄交叉，而不是真正的柯尔莫哥洛夫惯性范围。\n\n实空间二阶结构函数通过 $S_2(r)\\propto \\ln r$ 提供决定性证据，其中 $r$ 是空间分离，没有 $r^{2/3}$ Kolmogorov 缩放，排除了真正的惯性级联。这些发现表明，由于不存在宏观的 Onsager 簇，强耦合量子湍流缺乏逆级联，这表明能量传输与弱耦合超流体根本不同。", "authors": [{"name": "Yu-Ping An"}, {"name": "Peng-Bo Ding"}, {"name": "Zhen-Han Jin"}, {"name": "Li Li"}], "featured_authors": [{"name": "Yu-Ping An"}, {"name": "Peng-Bo Ding"}, {"name": "Zhen-Han Jin"}, {"name": "Li Li"}], "author_count": 4}, {"id": "2608.17064", "category": "hep-th", "title": "Robin boundary conditions in global AdS$_4$: exact double-trace thermodynamics and a soft-mode instability", "abstract": "We consider a conformally coupled scalar field in four-dimensional global anti-de Sitter space with Robin boundary conditions, parametrized by an angle $\\alpha$. On the boundary cylinder $\\mathbb{R}\\times S^{2}$ these conditions realize the double-trace deformation $\\tfrac12\\lambda\\!\\int O^{2}$ of the dimension-one operator $O$ in the alternate quantization with $\\lambda=\\cot\\alpha/L$. Because the conformal map to one half of the Einstein static universe is exact, the boundary integral equation can be diagonalized, and the deformed two-point function follows in closed form, $\\widehat{\\mathcal G}_{\\alpha}=\\widehat{\\mathcal G}_{N}/(1+\\lambda\\widehat{\\mathcal G}_{N})$. Its poles give the normal-mode spectrum, and its determinant gives the free energy exactly within this Gaussian sector. After three local boundary counterterms, the Casimir energy reaches the stability endpoint with a finite square-root cusp. At any finite coupling the bulk $T^{4}$ and $T^{3}$ terms are independent of $\\alpha$ and cancel in the difference from Neumann, leaving $\\tfrac{\\pi}{3}\\cot\\alpha\\,LT^{2}$ as the leading $\\alpha$-dependent term. All nonanalyticity comes from one static homogeneous mode, which becomes soft at $\\alpha_{\\rm crit}$, in agreement with the known classical stability threshold. The susceptibility diverges with exponent $\\gamma=1$ and the gap closes with exponent $1/2$. Beyond this angle the mode is tachyonic, and a stable phase would require a stabilizing interaction. In the flat-space limit the physical coupling scales to zero at fixed energy, so the Robin dependence survives only in the soft-frequency sector, which we characterize by a meromorphic Mellin transform in the boost weight. The Robin angle thus gives a control parameter for a Gaussian stability endpoint that can be followed exactly, and raises the analogous question for relaxed boundary conditions in AdS gravity.", "url": "https://arxiv.org/abs/2608.17064", "type": "理论", "summary": "我们考虑具有 Robin 边界条件的四维全局反德西特空间中的共形耦合标量场，通过角度 $\\alpha$ 进行参数化。在边界圆柱$\\mathbb{R}\\times S^{2}$上，这些条件实现了与$\\lambda=\\cot\\alpha/L$交替量化中一维算子$O$的双迹变形$\\tfrac12\\lambda\\!\\int O^{2}$。由于爱因斯坦静态宇宙二分之一的共角映射是精确的，因此边界积分方程可以对角化，并且变形的两点函数以闭合形式遵循 $\\widehat{\\mathcal G}_{\\alpha}=\\widehat{\\mathcal G}_{N}/(1+\\lambda\\widehat{\\mathcal G}_{N})$。它的极点给出了简正模谱，它的行列式给出了恰好在这个高斯扇区内的自由能。经过三个局部边界反项后，卡西米尔能量达到具有有限平方根尖点的稳定性端点。在任何有限耦合下，体 $T^{4}$ 和 $T^{3}$ 项独立于 $\\alpha$ 并抵消了与 Neumann 的差异，留下 $\\tfrac{\\pi}{3}\\cot\\alpha\\,LT^{2}$ 作为主要依赖于 $\\alpha$ 的项。\n\n所有非解析性都来自一种静态齐次模式，该模式在 $\\alpha_{\\rm crit}$ 下变得柔和，与已知的经典稳定性阈值一致。磁化率以指数 $\\gamma=1$ 发散，差距以指数 $1/2$ 缩小。超过这个角度，模式是快子模式，稳定的相位需要稳定的相互作用。在平坦空间中，固定能量下的物理耦合尺度限制为零，因此罗宾依赖性仅存在于软频率区域中，我们通过增强权重中的亚纯梅林变换来表征软频率区域。因此，罗宾角给出了可以精确遵循的高斯稳定性端点的控制参数，并提出了 AdS 重力中松弛边界条件的类似问题。", "authors": [{"name": "David A. Lowe"}, {"name": "Juanyi Yang"}], "featured_authors": [{"name": "David A. Lowe"}, {"name": "Juanyi Yang"}], "author_count": 2}, {"id": "2608.17211", "category": "hep-th", "title": "Variable-mass sine-Gordon with point defects: integrability, soliton transmission, and quasi-conservation", "abstract": "We study integrable variable-mass sine-Gordon model (vmSG) with point defects. Using the Lax and Bäcklund-gauge formulations, we construct type-I and type-II defect matrices, derive the corresponding sewing conditions, and generate the bulk and defect contributions to an infinite hierarchy of conserved charges. The lowest members reduce to the standard sine-Gordon energy and momentum in the homogeneous limit, while for inhomogeneous backgrounds they define integrability-generated energy- and momentum-type quantities. Defect compatibility imposes matching conditions on the variable-mass functions across the defect. An analytical transmission factor $z$ characterizes soliton transmission, topological conversion, and absorption/emission processes. We then deform the type-I sewing conditions by parameters $\\alpha$ and $\\beta$ and derive the associated defect anomalies. Consistent one-soliton transmission is recovered for $\\alpha \\beta =1$, whereas for $\\alpha \\beta \\neq 1$ parity-centered kink-kink and kink-antikink transmissions display vanishing lowest order integrated anomalies but no generic vanishing at higher order. Numerical simulations reproduce the integrable transmission/conversion regimes and show that non-integrable defects generate weak radiative tails and lowest order quasi-conserved charges, while quasi-conservation of the higher order charges remains unestablished. These results elucidate how exact defect integrability deforms into charge-dependent quasi-conservation and establish a framework for defect-controlled soliton transport in inhomogeneous media, with potential applications to nonuniform Josephson junctions, magnetic and nonlinear-optical systems, and effective molecular and DNA models.", "url": "https://arxiv.org/abs/2608.17211", "type": "理论", "summary": "我们研究具有点缺陷的可积变质量正弦戈登模型（vmSG）。使用 Lax 和 Bäcklund 规范公式，我们构建了 I 型和 II 型缺陷矩阵，推导相应的缝合条件，并生成对守恒电荷的无限层次结构的体积和缺陷贡献。最低成员在均匀极限下减少到标准正弦戈登能量和动量，而对于非均匀背景，它们定义可积生成的能量和动量类型量。缺陷兼容性对跨缺陷的可变质量函数施加匹配条件。分析传输因子 $z$ 表征孤子传输、拓扑转换和吸收/发射过程。然后，我们通过参数 $\\alpha$ 和 $\\beta$ 使 I 类缝纫条件变形，并导出相关的缺陷异常。对于$\\alpha \\beta =1$，恢复了一致的单孤子传输，而对于$\\alpha \\beta \\neq 1$，以奇偶校验为中心的扭结-扭结和扭结-反扭结传输显示了消失的最低阶积分异常，但在高阶上没有通用消失。\n\n数值模拟再现了可积传输/转换机制，并表明不可积缺陷产生弱辐射尾和最低阶准守恒电荷，而高阶电荷的准守恒尚未建立。这些结果阐明了精确的缺陷可积性如何变形为电荷相关的准守恒，并建立了非均匀介质中缺陷控制孤子传输的框架，并具有在非均匀约瑟夫森结、磁和非线性光学系统以及有效分子和 DNA 模型中的潜在应用。", "authors": [{"name": "A.R. Aguirre"}, {"name": "H. Blas"}, {"name": "H.F. Callisaya"}, {"name": "M.C. de Oliveira"}], "featured_authors": [{"name": "A.R. Aguirre"}, {"name": "H. Blas"}, {"name": "H.F. Callisaya"}, {"name": "M.C. de Oliveira"}], "author_count": 4}, {"id": "2608.17837", "category": "hep-th", "title": "Elliptic spin Ruijsenaars-Schneider integrable models from 5d $\\mathcal{N}=1$ gauge theories", "abstract": "We show that the Coulomb branches of 5d $\\mathcal{N}=1$ necklace quiver gauge theories on $\\mathbb{R}^3 \\times T^2$ are identified with the phase spaces of elliptic spin Ruijsenaars-Schneider models with dynamical inhomogeneities. This identification resolves the long-standing problem of determining a Poisson structure and a quantization of these models. We further show that the resulting quantum system is the integrable system governing supersymmetric indices of 4d $\\mathcal{N}=1$ theories of class $\\mathcal{S}_k$.", "url": "https://arxiv.org/abs/2608.17837", "type": "理论", "summary": "我们证明，$\\mathbb{R}^3 \\times T^2$ 上的 5d $\\mathcal{N}=1$ 项链箭袋规范理论的库仑分支可以用具有动态不均匀性的椭圆自旋 Ruijsenaars-Schneider 模型的相空间来确定。这种识别解决了确定泊松结构和这些模型的量化这一长期存在的问题。我们进一步表明，由此产生的量子系统是控制 $\\mathcal{S}_k$ 类 4d $\\mathcal{N}=1$ 理论超对称指数的可积系统。", "authors": [{"name": "Gleb Arutyunov"}, {"name": "Lukas Hardi"}], "featured_authors": [{"name": "Gleb Arutyunov"}, {"name": "Lukas Hardi"}], "author_count": 2}, {"id": "2608.17877", "category": "hep-th", "title": "A compact analytic formula for the one-loop triangle cosmological correlator", "abstract": "We derive a compact analytic formula for the one-loop triangle correlator of conformally coupled scalars in de Sitter space. The result is organised as six leading-singularity prefactors multiplying pure weight-two functions of the six energy variables. It contains forty-two dilogarithms, compared with approximately one hundred and twenty in the previously known closed-form representation, and requires no auxiliary regulator. The dilogarithms occur in Galois-conjugate pairs, making each contribution separately real throughout the physical region. We validate the result numerically. Moreover, we show that its symbol can be derived directly from the dressed integral representation or, independently, bootstrapped from Landau singularities and general consistency conditions. Finally, we show that the correlator (in a suitable normalization) is a Stieltjes function of each squared energy separately and is jointly completely monotone in all six squared energies. These structures suggest a route towards higher-point one-loop cosmological correlators.", "url": "https://arxiv.org/abs/2608.17877", "type": "理论", "summary": "我们推导了德西特空间中共形耦合标量的单环三角相关器的紧凑解析公式。结果被组织为六个主奇异性前因子乘以六个能量变量的纯权重二函数。它包含四十二个双对数，而先前已知的封闭形式表示中大约有一百二十个双对数，并且不需要辅助调节器。双对数出现在伽罗瓦共轭对中，使得每个贡献在整个物理区域中分别为实数。我们用数字验证结果。此外，我们表明它的符号可以直接从修饰的积分表示中导出，或者独立地从朗道奇点和一般一致性条件中引导。最后，我们证明相关器（在适当的归一化下）是每个平方能量单独的 Stieltjes 函数，并且在所有六个平方能量中共同完全单调。这些结构提出了一条通向更高点单环宇宙学相关器的途径。", "authors": [{"name": "Johannes Henn"}, {"name": "Jiajie Mei"}, {"name": "Qinglin Yang"}], "featured_authors": [{"name": "Johannes Henn"}, {"name": "Jiajie Mei"}, {"name": "Qinglin Yang"}], "author_count": 3}, {"id": "2608.17898", "category": "hep-th", "title": "Holographic subregion complexity in unbalanced Stückelberg holographic superconductors", "abstract": "Within the subregion complexity-volume conjecture, we numerically compare holographic subregion complexity (HSC) and holographic entanglement entropy (HEE) for a strip in unbalanced Stückelberg holographic superconductors. Varying the Stückelberg parameter $\\gamma$ yields both second- and first-order transitions. Both observables signal these transitions, but with markedly different robustness. The qualitative HEE signatures persist across strip widths, and the finite part of HEE remains smaller in the superconducting phase than in the normal phase. The HSC is instead strongly width dependent: its temperature trend is opposite to that of HEE at small $\\ell$ and agrees with it at large $\\ell$. Consequently, the superconducting and normal HSC branches reverse their relative ordering, creating a crossover region where they nearly coincide. There, HSC alone cannot reliably determine the occurrence or order of the transition, and the physical branch must be selected from the grand potential. Thus, HEE provides a more robust diagnostic, whereas HSC is a scale-dependent probe whose interpretation depends explicitly on the subsystem size.", "url": "https://arxiv.org/abs/2608.17898", "type": "理论", "summary": "在子区域复杂性-体积猜想中，我们对不平衡 Stückelberg 全息超导体中的条带的全息子区域复杂性 (HSC) 和全息纠缠熵 (HEE) 进行了数值比较。改变 Stückelberg 参数 $\\gamma$ 会产生二阶和一阶跃迁。两个可观测值都表明了这些转变，但鲁棒性明显不同。定性 HEE 特征在整个条带宽度上持续存在，并且 HEE 的有限部分在超导相中仍然比在正常相中小。相反，HSC 强烈依赖于宽度：其温度趋势在较小的 $\\ell$ 处与 HEE 的温度趋势相反，而在较大的 $\\ell$ 处与 HEE 一致。因此，超导分支和正常 HSC 分支颠倒了它们的相对顺序，在它们几乎重合的地方创建了一个交叉区域。在那里，HSC 本身无法可靠地确定转变的发生或顺序，并且必须从大势中选择物理分支。因此，HEE 提供了更可靠的诊断，而 HSC 是一种尺度相关的探针，其解释明确取决于子系统的大小。", "authors": [{"name": "Yu Shi"}, {"name": "Chikun Ding"}, {"name": "Yuebing Zhou"}, {"name": "Qiyuan Pan"}, {"name": "Jiliang Jing"}], "featured_authors": [{"name": "Yu Shi"}, {"name": "Chikun Ding"}, {"name": "Yuebing Zhou"}, {"name": "Qiyuan Pan"}, {"name": "Jiliang Jing"}], "author_count": 5}, {"id": "2608.17900", "category": "hep-th", "title": "Gravity and Matter from Soldered Chiral Superconnections", "abstract": "We present a reformulation of four-dimensional chiral gravity in terms of a chiral gauge connection and a Clifford-valued coframe. The exterior algebra generated by $e^a \\gamma_a$, together with the gauge curvature $F$, provides a natural and systematic construction of gauge-covariant differential forms. We show that suitable combinations of the chiral actions reproduce Einstein--Cartan--Holst gravity with a cosmological term. The original superconnection invariants yield only algebraic fermionic equations, so the fermionic one-forms do not propagate but instead generate a mass-like mixing between the two chiralities. Spinor propagation is supplied by a spinorial BF-type term, which under the matter ansatz reduces to the standard first-order Weyl kinetic action, including the torsion coupling. We also review the symmetry and variational properties of the matter ansatz, including its Lorentz equivariance, its relation to residual supersymmetry and twistor spinors, and the connection between the reduced and unrestricted field equations.", "url": "https://arxiv.org/abs/2608.17900", "type": "理论", "summary": "我们根据手性规范连接和 Clifford 值坐标系提出了四维手性引力的重新表述。由 $e^a \\gamma_a$ 生成的外部代数与规范曲率 $F$ 一起提供了规范协变微分形式的自然且系统的构造。我们证明，手性作用的适当组合可以用宇宙学术语再现爱因斯坦-嘉当-霍尔斯特引力。原始的超连接不变量仅产生代数费米子方程，因此费米子一式不会传播，而是在两个手性之间产生类似质量的混合。旋量传播由旋量 BF 型项提供，该项在物质 ansatz 下简化为标准一阶 Weyl 动力学作用，包括扭转耦合。我们还回顾了物质拟像的对称性和变分性质，包括其洛伦兹等变性、其与剩余超对称性和扭量旋量的关系，以及简化场方程和无限制场方程之间的联系。", "authors": [{"name": "P. D. Alvarez"}, {"name": "J. T. Hartwig"}, {"name": "A. Sharma"}], "featured_authors": [{"name": "P. D. Alvarez"}, {"name": "J. T. Hartwig"}, {"name": "A. Sharma"}], "author_count": 3}, {"id": "2608.17946", "category": "hep-th", "title": "Gravitational Compton scattering at the fifth post-Minkowskian order", "abstract": "Working in the Worldline Quantum Field Theory framework, we obtain the classical gravitational Compton amplitude through the fifth post-Minkowskian order, $\\mathcal{O}(G^5)$. At this order, the point-particle description must be supplemented by the leading static tidal operators. After removing lower-order iterations, we extract the corresponding $N$-matrix element and match it to black-hole perturbation theory. The matching fixes the static tidal Wilson coefficients to zero, providing confirmation of the vanishing static Love numbers of a Schwarzschild black hole.", "url": "https://arxiv.org/abs/2608.17946", "type": "理论", "summary": "在世界线量子场论框架下，我们通过后闵可夫斯基第五阶 $\\mathcal{O}(G^5)$ 获得经典引力康普顿振幅。按照这个顺序，点粒子描述必须由领先的静态潮汐算子来补充。去除低阶迭代后，我们提取相应的$N$矩阵元素并将其与黑洞微扰理论相匹配。匹配将静态潮汐威尔逊系数固定为零，从而证实了史瓦西黑洞静态洛夫数的消失。", "authors": [{"name": "Giacomo Brunello"}, {"name": "Mario Meo"}, {"name": "Sid Smith"}], "featured_authors": [{"name": "Giacomo Brunello"}, {"name": "Mario Meo"}, {"name": "Sid Smith"}], "author_count": 3}, {"id": "2608.18073", "category": "hep-th", "title": "Analytic Continuation of Conformal Integrals in Momentum Space", "abstract": "Conformal symmetry strongly constrains correlation functions. In momentum space, the conformal Ward identities are solved for three-point functions by integrals of a product of three Bessel functions (\"triple-$K$ integrals\"); more generally, integrals of this type (\"multiple-$K$ integrals\"), serve as the building blocks of a wide class of higher-point conformal correlators. These integrals belong to the class of generalised hypergeometric functions, and while their series representations are known in principle, none converges throughout the entire physical region of kinematic space selected by momentum conservation. In this work, we construct series representations adapted to exactly this physical domain. Using the method of brackets, which turns the evaluation of definite integrals into solving a linear system of algebraic equations, we derive various Lauricella-type series representations for multiple-$K$ integrals. For triple-$K$ integrals, conventionally expressed in terms of the Appell $F_4$ function whose series converges only outside the triangle-inequality region, we find instead a compact, two-branch series that converges throughout the entire physical region and for arbitrary scaling dimensions. We then extend this construction to general multiple-$K$ integrals: by introducing a new set of kinematic variables, we build an iterative series representation that converges for all physical kinematic configurations.", "url": "https://arxiv.org/abs/2608.18073", "type": "理论", "summary": "共形对称性强烈约束相关函数。在动量空间中，通过三个贝塞尔函数乘积的积分（“三$K$积分”）来求解三点函数的共形沃德恒等式；更一般地，这种类型的积分（“多 $K$ 积分”）用作各种更高点共形相关器的构建块。这些积分属于广义超几何函数类别，虽然它们的级数表示原则上是已知的，但在由动量守恒选择的运动学空间的整个物理区域中没有一个收敛。在这项工作中，我们构建了完全适合该物理领域的系列表示。使用括号方法，将定积分的计算转化为求解线性代数方程组，我们推导了多重 $K$ 积分的各种 Lauricella 型级数表示。\n\n对于三 $K$ 积分，通常用 Appell $F_4$ 函数表示，其级数仅在三角形不等式区域之外收敛，我们发现了一个紧凑的两分支级数，它在整个物理区域和任意缩放维度上收敛。然后，我们将此构造扩展到一般的多重 $K$ 积分：通过引入一组新的运动学变量，我们构建了一个迭代级数表示，该表示对于所有物理运动学配置都收敛。", "authors": [{"name": "Jonathan Gräfe"}, {"name": "Prashanth Raman"}, {"name": "Denis Werth"}], "featured_authors": [{"name": "Jonathan Gräfe"}, {"name": "Prashanth Raman"}, {"name": "Denis Werth"}], "author_count": 3}, {"id": "2608.17198", "category": "math-ph", "title": "A Projected Semiexplicit Integrator for Dissipative Systems with Configuration-Dependent Kinetic Energy: Contact-Herglotz Formulation and Benchmarks", "abstract": "Contact Hamiltonian dynamics gives dissipative mechanics an intrinsic action variable, but explicit contact splittings reach only kinetic energies whose terms are exactly integrable: frozen-coordinate diagonal metrics (the spherical pendulum, a torus particle) are included, while dense metrics with momentum cross terms, with the double pendulum as flagship, are not. We introduce a projected Pihajoki-contact integrator for this non-separable setting, combining phase-space duplication, symmetric projection onto the physical diagonal, and constant-friction damping half-steps, with the action factor carried by an exact Herglotz update. As in the projected extended-phase-space framework it builds on, the construction needs no binding parameter, returns the copies to the diagonal at every step, and confines the nonlinear solve to the $2n$ projection variables. For constant friction the step rescales $\\omega=d\\eta$ by the exact factor $e^{-\\gamma\\tau}$ when the projection is solved exactly (a classical conformally symplectic identity, realized here for this class), while time-symmetry, consistency, and smoothness yield an $O(\\tau^3)$ one-step contact-form residual, a bound not specific to the contact form. On the damped double pendulum, spherical pendulum, and torus particle the method is second-order accurate, reproduces the contact decay law, and controls long-time energy and contact drift in coarse or stiff regimes where the Tao baseline and the unprojected average lose the solution. A head-to-head with exact-contactomorphism splittings delimits the niche: where a frozen-coordinate splitting exists it preserves the contact form exactly and wins at matched cost; for the dense double-pendulum metric the realizable alternative is first-order with a prohibitive constant and the projected method prevails. The contact-form estimate is local, one-step, and constant-friction.", "url": "https://arxiv.org/abs/2608.17198", "type": "理论", "summary": "接触哈密顿动力学为耗散力学提供了一个内在的作用变量，但显式接触分裂仅达到其项完全可积的动能：包括冻结坐标对角度量（球摆，环面粒子），而具有动量交叉项的密集度量（以双摆为旗舰）则不包括在内。我们针对这种不可分离的设置引入了投影 Pihajoki 接触积分器，结合了相空间复制、物理对角线上的对称投影和恒定摩擦阻尼半步，以及由精确的 Herglotz 更新承载的作用因子。与它所构建的投影扩展相空间框架一样，该构造不需要绑定参数，在每一步将副本返回到对角线，并将非线性求解限制为 $2n$ 投影变量。\n\n对于恒定的摩擦力，当精确求解投影时，步骤通过精确因子 $e^{-\\gamma\\tau}$ 重新缩放 $\\omega=d\\eta$（经典的共形辛恒等式，在此类中实现），而时间对称性、一致性和平滑性会产生 $O(\\tau^3)$ 单步接触形式残差，这是一个不特定于接触形式的界限。在阻尼双摆、球摆和环面粒子上，该方法具有二阶精度，可重现接触衰减定律，并在粗糙或刚性状态下控制长期能量和接触漂移，其中 Tai 基线和未投影平均值失去解。具有精确接触同态分裂的头对头界定了利基：在存在冻结坐标分裂的情况下，它精确地保留接触形式并以匹配的成本获胜；对于稠密双摆度量，可实现的替代方案是具有禁止常数的一阶，并且投影方法占主导地位。接触形式估计是局部的、一步的、恒定摩擦的。", "authors": [{"name": "Lorena Loera-Galeana"}, {"name": "Santiago Mejía"}, {"name": "Espartaco Alvarado"}, {"name": "Héctor Medel-Cobaxin"}], "featured_authors": [{"name": "Lorena Loera-Galeana"}, {"name": "Santiago Mejía"}, {"name": "Espartaco Alvarado"}, {"name": "Héctor Medel-Cobaxin"}], "author_count": 4}, {"id": "2608.17221", "category": "math-ph", "title": "Romanovski polynomials, Gegenbauer connections, and $\\mathrm{su}(1,1)$ ladder structures", "abstract": "We study the monic Romanovski (pseudo-Jacobi) polynomials corresponding to the degree dependent parameters $\\beta_K=-K$, $\\alpha_K=c/(K+1)$, with $K=n+\\ell$. We write down, in explicit form, the parameter preserving first order lowering and raising relations at fixed $(\\alpha,\\beta)$, with real proportionality constants. Combining them one recovers the standard three-term recurrence existing in any hypergeometric-type family, and iterating them one gets an ordered first order construction of $R_n^{\\alpha,\\beta}$ starting from the unit constant polynomial. We also solve the connection problem with the $\\alpha=0$ family in a finite triangular form, identifying this last family with the Gegenbauer polynomials, and transferring the ladder relations to the $(n,\\ell)$ lattice. After the substitution $x=\\cot\\chi$, the in-level operators depend on $\\ell$, but not on $K$. The resulting dressed functions support intrinsic lowest weight $\\mathrm{su}(1,1)$ modules along the columns with $\\ell$ fixed, while the circular row ($n=0$) requires an explicit boundary prescription and a rescaling.", "url": "https://arxiv.org/abs/2608.17221", "type": "理论", "summary": "我们研究与度相关参数$\\beta_K=-K$、$\\alpha_K=c/(K+1)$相对应的莫尼克罗曼诺夫斯基（伪雅可比）多项式，其中$K=n+\\ell$。我们以显式形式写下在固定 $(\\alpha,\\beta)$ 处保留一阶降序和升序关系的参数，并具有实比例常数。将它们组合起来，可以恢复任何超几何类型族中存在的标准三项递归，并且迭代它们，可以得到从单位常数多项式开始的 $R_n^{\\alpha,\\beta}$ 的有序一阶构造。我们还以有限三角形形式解决了 $\\alpha=0$ 族的连接问题，用 Gegenbauer 多项式识别最后一个族，并将梯子关系转移到 $(n,\\ell)$ 格。替换 $x=\\cot\\chi$ 后，层内运算符依赖于 $\\ell$，但不依赖于 $K$。由此产生的修饰函数支持沿列的内在最低权重 $\\mathrm{su}(1,1)$ 模块，$\\ell$ 固定，而圆形行 ($n=0$) 需要明确的边界规定和重新缩放。", "authors": [{"name": "José A. Vallejo"}, {"name": "Mariana Kirchbach"}], "featured_authors": [{"name": "José A. Vallejo"}, {"name": "Mariana Kirchbach"}], "author_count": 2}, {"id": "2608.17263", "category": "math-ph", "title": "Cohomology for solutions of polygon equations", "abstract": "Polygon equations form a family of equations generalizing the pentagon equation. In this paper, we construct semi-simplicial sets of permitted colorings associated with set-theoretic solutions of polygon equations and use them to define the corresponding (co)homology groups. We investigate several properties of these groups and establish an equivalence of categories between set-theoretic solutions of polygon equations and higher Segal semi-simplicial sets satisfying certain conditions. As a special case, our result recovers the correspondence between bijective set-theoretic solutions of the pentagon equation and $2$-Segal semi-simplicial sets proved by Dyckerhoff--Kapranov.", "url": "https://arxiv.org/abs/2608.17263", "type": "理论", "summary": "多边形方程形成了推广五边形方程的方程族。在本文中，我们构造了与多边形方程的集合论解相关的允许着色的半单纯集，并使用它们来定义相应的（共）同调群。我们研究了这些群的几个性质，并建立了多边形方程的集合论解和满足某些条件的更高 Segal 半单纯集之间的类别等价性。作为一个特例，我们的结果恢复了五边形方程的双射集合论解与 Dyckerhoff-Kapranov 证明的 $2$-Segal 半单纯集之间的对应关系。", "authors": [{"name": "Serban Matei Mihalache"}, {"name": "Tomoro Mochida"}], "featured_authors": [{"name": "Serban Matei Mihalache"}, {"name": "Tomoro Mochida"}], "author_count": 2}, {"id": "2608.16939", "category": "quant-ph", "title": "SPSA Hyperparameter Tuning for Variational Quantum Natural Language Inference", "abstract": "Training variational quantum models requires choosing between parameter-shift gradients, which are exact but cost $O(P)$ forward evaluations, and simultaneous perturbation stochastic approximation (SPSA), which uses only two samples but produces high-variance estimates that can degrade optimisation on small supervised tasks. Whether the cheap gradient is usable depends on the variance that results from different choices of the SPSA perturbation scale, learning rate, and gain-decay schedule. We varied those quantities across a broad grid on a 6-qubit, 60-parameter QNLI classifier and compared the best configurations to parameter-shift AdamW and BuresQNG. AdamW-style SPSA with $c_0=0.01$, $\\eta=0.10$, $\\gamma=0.10$ reached $55\\% \\pm 11\\%$ test accuracy, improving over the default configuration ($49\\% \\pm 6\\%$) but remaining 16-19 percentage points below the parameter-shift baselines because the two-sample SPSA gradient estimate has too much variance for reliable optimisation of 60 parameters in 40 epochs. Classical-gain SPSA and Bures-preconditioned SPSA performed worse, at $51\\%$ and $46\\%$ respectively. Bures-preconditioning a noisy two-sample SPSA gradient amplifies perturbation noise.", "url": "https://arxiv.org/abs/2608.16939", "type": "理论+数值", "summary": "训练变分量子模型需要在参数平移梯度和同时扰动随机逼近 (SPSA) 之间进行选择，参数平移梯度是精确的，但前向评估成本为 $O(P)$，而同时扰动随机逼近 (SPSA) 仅使用两个样本，但会产生高方差估计，从而降低小型监督任务的优化效果。廉价梯度是否可用取决于 SPSA 扰动尺度、学习率和增益衰减方案的不同选择所产生的方差。我们在 6 量子位、60 参数 QNLI 分类器上的广泛网格上改变这些量，并将最佳配置与参数转移 AdamW 和 BuresQNG 进行比较。 AdamW 式 SPSA（$c_0=0.01$、$\\eta=0.10$、$\\gamma=0.10$ 达到 $55\\% \\pm 11\\%$ 测试精度，比默认配置 ($49\\% \\pm 6\\%$) 有所提高，但仍比参数偏移基线低 16-19 个百分点，因为两个样本 SPSA 梯度估计对于 40 个参数中的 60 个参数的可靠优化有太大方差纪元。经典增益 SPSA 和 Bures 预处理 SPSA 表现较差，分别为 $51\\%$ 和 $46\\%$。\n\n对有噪声的两个样本 SPSA 梯度进行 Bures 预处理会放大扰动噪声。", "authors": [{"name": "Nayan D'Souza"}, {"name": "Christopher J. Agostino"}], "featured_authors": [{"name": "Nayan D'Souza"}, {"name": "Christopher J. Agostino"}], "author_count": 2}, {"id": "2608.16941", "category": "quant-ph", "title": "A formal correspondence between Bayesian inference problems and the Heisenberg representation", "abstract": "The proposed formulation establishes a formal correspondence between the Heisenberg representation and the Bayesian formulation of inverse problems by identifying the observational noise operator with the initial observable. The initial observable is linked to the quadratic likelihood norm in Hilbert space, which depends on noisy observations and a direct model parameterized by unknown parameters. Using the Karhunen-Loeve expansion, the quantum state is expressed in terms of the eigenvalues and eigenfunctions of the Matern covariance. The likelihood probability is then expressed in terms of the observed state, and the model-dependent state, and is rewritten as a quadratic norm in terms of the quantum states, where the observational noise covariance is proposed to be identified with the initial observable. The main results are summarized by four theorems: the unitarity of the evolution operator, the self-adjointness of the Hamiltonian, the time invariance of the observable, and the equivalence between Heisenberg evolution and Bayesian posterior probability. Limiting cases of the Matern covariance are analyzed as the length parameter tends to zero and infinity. Finally, numerical results support the analytical findings.", "url": "https://arxiv.org/abs/2608.16941", "type": "理论+数值", "summary": "所提出的公式通过识别观测噪声算子与初始可观测值，在海森堡表示和反问题的贝叶斯公式之间建立了正式的对应关系。初始可观测值与希尔伯特空间中的二次似然范数相关，这取决于噪声观测值和由未知参数参数化的直接模型。使用 Karhunen-Loeve 展开式，量子态用马特恩协方差的特征值和特征函数来表示。然后，似然概率用观测状态和模型相关状态表示，并根据量子态重写为二次范数，其中观测噪声协方差建议用初始可观测值来识别。主要结果概括为四个定理：演化算子的​​幺正性、哈密顿量的自伴性、可观测量的时间不变性以及海森堡演化与贝叶斯后验概率的等价性。当长度参数趋于零和无穷大时，分析了马特恩协方差的极限情况。\n\n最后，数值结果支持了分析结果。", "authors": [{"name": "C. Abugattas Chacoff"}], "featured_authors": [{"name": "C. Abugattas Chacoff"}], "author_count": 1}, {"id": "2608.16994", "category": "quant-ph", "title": "Basis-update and Galerkin time integration in canonical matrix-product-state form", "abstract": "Matrix product state algorithms must enlarge their bond spaces as entanglement grows and compress them to control cost. We formulate basis-update and Galerkin (BUG) time integration as a sequence of canonical MPS sweeps for Hamiltonians represented as matrix product operators. We show when two natural basis updates produce the same trial space and when transporting coefficients between successive bases preserves the represented state. Under these conditions, the existing first-order error bound for uncompressed tree-tensor-network BUG also applies to the alternating-endpoint MPS schedule. We verify the uncompressed implementation against an independent six-site calculation. We then compare BUG with two-site TDVP for 16-site transverse-field Ising and Haldane-Shastry dynamics. At matched timestep and truncation settings, BUG performs fewer local exponential actions and has lower runtime. These settings do not produce equal accuracy. The runtime versus accuracy curves cross for the Ising model and are close for the Haldane-Shastry model. The comparison therefore identifies model-dependent trade-offs rather than a general advantage for either method.", "url": "https://arxiv.org/abs/2608.16994", "type": "理论+数值", "summary": "矩阵乘积状态算法必须随着纠缠的增长而扩大其键空间并压缩它们以控制成本。我们将基础更新和伽辽金 (BUG) 时间积分公式化为表示为矩阵乘积算子的哈密顿量的规范 MPS 扫描序列。我们展示了两个自然基更新何时产生相同的试验空间，以及何时在连续基之间传输系数保留所表示的状态。在这些条件下，未压缩树张量网络 BUG 的现有一阶误差界限也适用于交替端点 MPS 调度。我们根据独立的六站点计算验证未压缩的实现。然后，我们将 BUG 与 16 位点横向场 Ising 和 Haldane-Shastry 动力学的两位点 TDVP 进行比较。在匹配的时间步长和截断设置下，BUG 执行的局部指数操作较少，并且运行时间较短。这些设置不会产生相同的精度。 Ising 模型的运行时间与准确度曲线交叉，而 Haldane-Shastry 模型的运行时间与准确度曲线接近。因此，比较确定了依赖于模型的权衡，而不是这两种方法的一般优势。", "authors": [{"name": "Maximilian Fröhlich"}, {"name": "Richard M. Milbradt"}, {"name": "Martin Eigel"}, {"name": "Aaron Sander"}, {"name": "Robert Wille"}, {"name": "Christian B. Mendl"}], "featured_authors": [{"name": "Maximilian Fröhlich"}, {"name": "Richard M. Milbradt"}, {"name": "Martin Eigel"}, {"name": "Aaron Sander"}, {"name": "Robert Wille"}, {"name": "Christian B. Mendl"}], "author_count": 6}, {"id": "2608.17023", "category": "quant-ph", "title": "Hardware-Aware Compilation and Execution of Bivariate Bicycle Codes on Neutral-Atom Systems", "abstract": "Quantum computers are noisy; without quantum error correction (QEC), deep programs fail as qubits lose information due to decoherence. Among QEC approaches, bivariate bicycle (BB) codes offer low overhead and constant-depth syndrome extraction, while neutral-atom arrays provide scalable, reconfigurable qubit layouts. However, executing BB-code primitives on neutral-atom systems requires a hardware-aware mapping that respects movement, zoning, and interaction constraints. We present Park-n-Ride, a system for compiling and executing the BB code on neutral-atom processors. Park-n-Ride introduces a module layout and movement model aligned with neutral-atom constraints, exposes a compact BB-native logical interface for compilation, and integrates scheduling mechanisms that enable efficient execution on zoned architectures. By co-designing BB-code abstractions with hardware execution, Park-n-Ride provides a practical path from qLDPC primitives to resource-efficient, high-throughput execution on reconfigurable neutral-atom arrays.", "url": "https://arxiv.org/abs/2608.17023", "type": "理论", "summary": "量子计算机有噪音；如果没有量子纠错（QEC），深度程序就会失败，因为量子位会因退相干而丢失信息。在 QEC 方法中，双变量自行车 (BB) 代码提供低开销和恒定深度的校正子提取，而中性原子阵列提供可扩展、可重新配置的量子位布局。然而，在中性原子系统上执行 BB 代码原语需要一个尊重移动、分区和交互约束的硬件感知映射。我们推出 Park-n-Ride，一个在中性原子处理器上编译和执行 BB 代码的系统。 Park-n-Ride 引入了与中性原子约束一致的模块布局和运动模型，公开了用于编译的紧凑 BB 原生逻辑接口，并集成了调度机制，可在分区架构上实现高效执行。通过共同设计 BB 代码抽象和硬件执行，Park-n-Ride 提供了一条从 qLDPC 原语到可重构中性原子阵列上资源高效、高吞吐量执行的实用路径。", "authors": [{"name": "Jason Ludmir"}, {"name": "Aditya Ranjan"}, {"name": "Nicholas S. DiBrita"}, {"name": "Jason Han"}, {"name": "Tirthak Patel"}], "featured_authors": [{"name": "Jason Ludmir"}, {"name": "Aditya Ranjan"}, {"name": "Nicholas S. DiBrita"}, {"name": "Jason Han"}, {"name": "Tirthak Patel"}], "author_count": 5}, {"id": "2608.17065", "category": "quant-ph", "title": "Exact Moments of Gaussian Gram Hafnians Reveal an $n^2/\\log n$ Threshold for Weak Anticoncentration", "abstract": "Anticoncentration is central to hardness arguments for approximate sampling. In the independent Gaussian surrogate for collision free Gaussian boson sampling, the moment ratio studied here also determines the averaged ideal linear cross entropy reference value. Let $H_{k,n}=\\mathrm{haf}(X^{\\mathsf T}X)$, where $X\\in\\mathbb{C}^{k\\times 2n}$ has independent standard circular complex Gaussian entries. We evaluate $\\mathbb{E}|H_{k,n}|^2$ and $\\mathbb{E}|H_{k,n}|^4$ exactly by reducing four hafnian copies to a rank two Gaussian integral. For $R_{k,n}=(\\mathbb{E}|H_{k,n}|^2)^2/\\mathbb{E}|H_{k,n}|^4$, we obtain $R_{k,n}=4^{-n}\\binom{2n}{n}/F_{k,n}$, where $F_{k,n}={}3F_2(-n,-n,1/2;1,k/2;1)$ is a terminating generalized hypergeometric polynomial. If $k/n^2\\to c>0$, then $F{k,n}\\to e^{1/c}I_0(1/c)$, where $I_0$ is the modified Bessel function of the first kind of order zero, and consequently $R_{k,n}\\sqrt{\\pi n}\\to[e^{1/c}I_0(1/c)]^{-1}$. Thus $k\\asymp n^2$ is a smooth Bessel crossover, whereas the scaling order boundary for inverse polynomial weak anticoncentration is $k\\asymp n^2/\\log n$. These conclusions concern the Gaussian surrogate moment criterion; finite dimensional Haar moment transfer and high probability small ball anticoncentration remain separate problems.", "url": "https://arxiv.org/abs/2608.17065", "type": "理论+数值", "summary": "反集中是近似采样的硬度论证的核心。在无碰撞高斯玻色子采样的独立高斯代理中，这里研究的矩比也确定了平均理想线性交叉熵参考值。设$H_{k,n}=\\mathrm{haf}(X^{\\mathsf T}X)$，其中$X\\in\\mathbb{C}^{k\\times 2n}$具有独立的标准循环复高斯项。我们通过将四个哈夫尼副本减少为二阶高斯积分来精确评估 $\\mathbb{E}|H_{k,n}|^2$ 和 $\\mathbb{E}|H_{k,n}|^4$ 。对于 $R_{k,n}=(\\mathbb{E}|H_{k,n}|^2)^2/\\mathbb{E}|H_{k,n}|^4$，我们得到 $R_{k,n}=4^{-n}\\binom{2n}{n}/F_{k,n}$，其中$F_{k,n}={}3F_2(-n,-n,1/2;1,k/2;1)$ 是终止广义超几何多项式。如果 $k/n^2\\to c>0$，则 $F{k,n}\\to e^{1/c}I_0(1/c)$，其中 $I_0$ 是第一类零阶修正贝塞尔函数，因此 $R_{k,n}\\sqrt{\\pi n}\\to[e^{1/c}I_0(1/c)]^{-1}$。因此$k\\asymp n^2$ 是一个平滑的贝塞尔交叉，而逆多项式弱反集中的缩放阶边界是$k\\asymp n^2/\\log n$。\n\n这些结论涉及高斯代理矩准则；有限维哈尔矩传递和高概率小球反集中仍然是单独的问题。", "authors": [{"name": "Hongru Zhao"}], "featured_authors": [{"name": "Hongru Zhao"}], "author_count": 1}, {"id": "2608.17069", "category": "quant-ph", "title": "Dynamic Entanglement-Weighted Pruning for Quantum Federated Unlearning in Supply-Chain Risk Prediction", "abstract": "Federated deployments of variational quantum classifiers are attractive for cross-organisation risk prediction in supply chains, because raw data never leaves the client, yet data-protection regulations such as the GDPR grant clients a right to request that their contribution be removed from a trained model after the fact. Retraining a federated model from scratch to honour such a request is correct but wasteful, and it is not obvious which quantum circuit parameters actually carry a given client's influence. We introduce Entanglement-Weighted Pruning (EWP), an unlearning procedure for quantum federated learning that scores every trainable circuit parameter with the product of two signals: the diagonal entry of the quantum Fisher information matrix estimated on the target client's data via the parameter-shift rule, and a structural entanglement weight associated with the parameter's gate. Parameters with the lowest scores are pruned, optionally followed by a short fine-tuning pass on the retained clients. We implement the full pipeline in Qiskit for a four-qubit data-re-uploading ansatz trained with FedAvg across five simulated supply-chain-risk clients, and benchmark EWP against full retraining, fine-tuning alone, random pruning, Fisher-only pruning, and entanglement-only pruning, over three random seeds. EWP attains a mean post-unlearning accuracy statistically indistinguishable from the full-retraining oracle, while producing a lower forgetting score and requiring roughly 16 times less wall-clock time. Ablations over pruning threshold, client count, and non-IID strength show that combining the two signals is necessary, as entanglement-only and Fisher-only pruning each substantially degrade accuracy relative to EWP.", "url": "https://arxiv.org/abs/2608.17069", "type": "理论+数值", "summary": "变分量子分类器的联合部署对于供应链中的跨组织风险预测很有吸引力，因为原始数据永远不会离开客户，但 GDPR 等数据保护法规授予客户事后要求将其贡献从训练模型中删除的权利。从头开始重新训练联邦模型来满足这样的请求是正确的，但很浪费，而且哪些量子电路参数实际上携带给定客户端的影响并不明显。我们引入了纠缠加权修剪（EWP），这是一种量子联邦学习的忘却过程，它用两个信号的乘积对每个可训练电路参数进行评分：通过参数移位规则在目标客户端数据上估计的量子费舍尔信息矩阵的对角线条目，以及与参数门相关的结构纠缠权重。得分最低的参数将被修剪，然后可以选择对保留的客户端进行简短的微调。\n\n我们在 Qiskit 中实现了完整的管道，用于在五个模拟供应链风险客户端上使用 FedAvg 进行训练的四量子位数据重新上传 ansatz，并针对三个随机种子的完全再训练、单独微调、随机剪枝、仅费舍尔剪枝和仅纠缠剪枝对 EWP 进行基准测试。 EWP 达到的平均遗忘后准确率在统计上与完全再训练预言机没有什么区别，同时产生较低的遗忘分数，并且需要大约 16 倍的挂钟时间。对剪枝阈值、客户端数量和非 IID 强度的消融表明，组合这两个信号是必要的，因为仅纠缠和仅费舍尔剪枝都会大大降低相对于 EWP 的准确性。", "authors": [{"name": "Aditya Kumar"}, {"name": "Sumit Chongder"}], "featured_authors": [{"name": "Aditya Kumar"}, {"name": "Sumit Chongder"}], "author_count": 2}, {"id": "2608.17094", "category": "quant-ph", "title": "Lie-Algebraic Classical Simulation of Bosonic Systems Beyond Gaussian Dynamics", "abstract": "Classical simulability is ultimately determined by both the dynamics of a quantum system and the observables being evaluated. Lie-algebraic simulation exploits the latter to make exact polynomial-time classical simulations by propagating observables through low-dimensional invariant operator spaces. However, its conventional formulation in terms of polynomial-dimensional dynamical Lie algebras does not directly accommodate bosonic systems as their algebras are neither compact nor semisimple. In this contribution, we overcome this limitation, making bosonic systems accessible to the Lie-algebraic programme of exact polynomial-time classical simulation. We prove that expectation values, fixed-order correlation functions, including multi-time correlators and out-of-time-ordered correlators, and gradients are efficiently computable whenever their operator modules have polynomial dimension. This recovers Gaussian quantum optics and extends it to non-Gaussian input states, while identifying exact polynomial regimes of interacting non-Gaussian dynamics including bounded-photon Kerr and pair-hopping Hamiltonians and nilpotent polynomial phase dynamics. We show that unlike in the finite-dimensional spin and fermionic setting treated previously, a finite-dimensional bosonic generator algebra alone does not guarantee finite observable dynamics. We further derive a controlled perturbative hierarchy for squeezing beyond exact sector confinement and confirm the predicted error orders numerically. We also evaluate operator spreading on interacting chains of up to $400$ modes and connect a topological doublon band with flux-reversed edge motion. These results provide a unified formalism for classifying, discovering, and systematically approximating tractable bosonic quantum dynamics with classical polynomial-time simulation.", "url": "https://arxiv.org/abs/2608.17094", "type": "理论+数值", "summary": "经典可模拟性最终由量子系统的动力学和所评估的可观察量决定。李代数模拟利用后者通过低维不变算子空间传播可观测量来进行精确的多项式时间经典模拟。然而，其多项式维动力学李代数的传统公式不能直接适应玻色子系统，因为它们的代数既不是紧的也不是半简单的。在这篇文章中，我们克服了这一限制，使玻色子系统可以用于精确多项式时间经典模拟的李代数程序。我们证明，只要算子模块具有多项式维数，期望值、固定阶相关函数（包括多时间相关器和无序相关器）以及梯度就可以有效计算。这恢复了高斯量子光学并将其扩展到非高斯输入状态，同时识别相互作用的非高斯动力学的精确多项式体系，包括有界光子克尔和成对跳哈密顿量以及幂零多项式相位动力学。\n\n我们表明，与之前处理的有限维自旋和费米子设置不同，有限维玻色子发生器代数本身并不能保证有限的可观测动力学。我们进一步推导了一个受控的扰动层次结构，用于超越精确的扇区限制，并以数字方式确认预测的错误顺序。我们还评估了高达 400 美元模式的交互链上的算子扩展，并将拓扑双布朗带与通量反转边缘运动连接起来。这些结果为通过经典多项式时间模拟来分类、发现和系统地逼近易处理的玻色量子动力学提供了统一的形式。", "authors": [{"name": "Adelina Bärligea"}, {"name": "Timothy Heightman"}, {"name": "Jakob S. Kottmann"}, {"name": "Antonio Acín"}], "featured_authors": [{"name": "Adelina Bärligea"}, {"name": "Timothy Heightman"}, {"name": "Jakob S. Kottmann"}, {"name": "Antonio Acín"}], "author_count": 4}, {"id": "2608.17109", "category": "quant-ph", "title": "Hardness of approximation for minimum-weight decoding of two-dimensional topological quantum codes", "abstract": "Efficient decoding is essential for the practical realization of fault-tolerant quantum computers. We study the computational complexity of minimum-weight decoding for topological quantum codes. For surface codes under the depolarizing channel, we consider Minimum-Weight decoding, which seeks a minimum-weight Pauli error consistent with both the $X$- and $Z$-syndromes. For color codes under independent $X$- and $Z$-error models, we consider Separate Minimum-Weight decoding. Assuming $P\\neq NP$, we establish polynomial additive inapproximability gaps for these problems. Specifically, for the toric code and the $4.8.8$ color code on the torus, no polynomial-time algorithm can always produce a solution whose weight is within $\\Omega(N^{1/14})$ of the optimum, where $N$ is the number of qubits. For the planar surface code, we obtain an $\\Omega(N^{1/18})$ gap. Our inapproximability results use Håstad's hardness of approximation for MAX-3SAT. Our reduction develops a general, modular framework for embedding logical constraints into coupled primal--dual join problems on a lattice. A key ingredient is a localization argument that controls unintended interactions between different parts of the construction.", "url": "https://arxiv.org/abs/2608.17109", "type": "理论+数值", "summary": "高效解码对于容错量子计算机的实际实现至关重要。我们研究拓扑量子码的最小权重解码的计算复杂度。对于去极化通道下的表面码，我们考虑最小权重解码，它寻求与$X$-和$Z$-综合症一致的最小权重泡利误差。对于独立$X$-和$Z$-错误模型下的颜色代码，我们考虑单独的最小权重解码。假设 $P\\neq NP$，我们为这些问题建立多项式加性不可逼近性差距。具体来说，对于环面代码和环面上的 $4.8.8$ 颜色代码，任何多项式时间算法都无法始终生成权重在最优值 $\\Omega(N^{1/14})$ 范围内的解决方案，其中 $N$ 是量子位的数量。对于平面代码，我们获得 $\\Omega(N^{1/18})$ 间隙。我们的不可近似性结果使用 MAX-3SAT 的 Håstad 近似硬度。我们的简化开发了一个通用的模块化框架，用于将逻辑约束嵌入到格上的耦合原始双连接问题中。\n\n一个关键因素是控制结构不同部分之间意外相互作用的本地化论证。", "authors": [{"name": "Louay Bazzi"}, {"name": "Georges Khater"}], "featured_authors": [{"name": "Louay Bazzi"}, {"name": "Georges Khater"}], "author_count": 2}, {"id": "2608.17115", "category": "quant-ph", "title": "Block Encoding Non-Abelian Lattice Gauge Theory", "abstract": "Gauge theories like lattice QCD present a complex problem for quantum simulation. In a basis where the electric part of the Hamiltonian is simple, the magnetic part, generally expressed as a sum over the plaquette operators of the lattice, is quite complicated, producing correlated transitions between several link and site degrees of freedom. We provide an efficient block encoding of the plaquette operator in the irrep basis, a refinement of the electric basis where the internal gauge-variant degrees of freedom are integrated out. The construction removes the plaquette matrix element scaling wall which has been a significant barrier for other approaches in this basis. The algorithm leverages a convenient factorization property of the matrix elements, cheap classical precomputation, and quantum oracles built from lookup tables and programmed rotations.", "url": "https://arxiv.org/abs/2608.17115", "type": "理论+数值", "summary": "像晶格 QCD 这样的规范理论为量子模拟提出了一个复杂的问题。在哈密顿量的电部分很简单的基础上，磁部分（通常表示为晶格的平板算子的和）相当复杂，在几个链接和位点自由度之间产生相关的转变。我们在不可再现基础上提供了斑块算子的高效块编码，这是对内部规范变量自由度进行积分的电基础的细化。该结构消除了斑块矩阵单元缩放壁，这对于在此基础上的其他方法来说是一个重要障碍。该算法利用了矩阵元素方便的因式分解特性、廉价的经典预计算以及根据查找表和编程旋转构建的量子预言机。", "authors": [{"name": "Patrick Draper"}], "featured_authors": [{"name": "Patrick Draper"}], "author_count": 1}, {"id": "2608.17118", "category": "quant-ph", "title": "Entanglement assisted quantum $(r,δ)$-locally recoverable codes", "abstract": "Quantum $(r,\\delta)$-locally recoverable codes are quantum error-correcting codes capable of correcting $\\delta-1$ qudit erasures within one subset of qudits of cardinality at most $r+\\delta-1$. In this paper, we introduce the more general framework of entanglement-assisted quantum $(r,\\delta)$-locally recoverable codes, assuming that the local recovery operation is assisted by receiver-held qudits that remain unaffected by erasures. We establish necessary and sufficient conditions for these codes to satisfy this property. For codes derived from Hermitian or Euclidean constructions, we establish connections between entanglement-assisted quantum and classical notions of $(r,\\delta)$-local recoverability, and derive a Singleton-like bound. Furthermore, we construct optimal pure entan\\-gle\\-ment-assisted quantum $(r,\\delta)$-locally recoverable codes from several families of classical codes, including bivariate $J$-affine variety codes, BCH codes, and homothetic-BCH codes.", "url": "https://arxiv.org/abs/2608.17118", "type": "理论", "summary": "量子$(r,\\delta)$-局部可恢复码是量子纠错码，能够纠正最多$r+\\delta-1$基数的一个子集中的$\\delta-1$qudit擦除。在本文中，我们介绍了纠缠辅助量子 $(r,\\delta)$ 本地可恢复码的更通用框架，假设本地恢复操作由不受擦除影响的接收器持有的量子来辅助。我们为这些代码建立必要和充分的条件来满足这个属性。对于从厄米特或欧几里得构造派生的代码，我们在纠缠辅助量子和 $(r,\\delta)$ 局部可恢复性的经典概念之间建立联系，并派生出类似单例的界限。此外，我们从几个经典代码族中构造了最佳的纯纠缠辅助量子$(r,\\delta)$局部可恢复代码，包括二元$J$-仿射多样性代码、BCH代码和拟似BCH代码。", "authors": [{"name": "Carlos Galindo"}, {"name": "Fernando Hernando"}, {"name": "Helena Mart\\'ın-Cruz"}, {"name": "Ryutaroh Matsumoto"}], "featured_authors": [{"name": "Carlos Galindo"}, {"name": "Fernando Hernando"}, {"name": "Helena Mart\\'ın-Cruz"}, {"name": "Ryutaroh Matsumoto"}], "author_count": 4}, {"id": "2608.17136", "category": "quant-ph", "title": "Gate-level Implementation and Resource Analysis of Lackadaisical Quantum Walk Search", "abstract": "Lackadaisical quantum walks (LQW) extend discrete-time quantum walks (DTQW) by introducing weighted self-loops, enabling improved spatial-search performance through controlled localization of the walker. Although their theoretical properties and algorithmic advantages have been studied extensively, practical gate-level realizations suitable for execution on quantum hardware remain largely unexplored. This gap limits the assessment of lackadaisical quantum walk search under realistic architectural constraints, noise processes, and resource requirements. In this work, we present a gate-level implementation framework for lackadaisical quantum walk search. The proposed construction encodes the position and coin spaces into qubit registers, and realizes the walk dynamics through oracle, coin, and flip-flop shift operations. We validate the circuit by reproducing the expected search behavior for single and multiple marked vertices and by analyzing the effect of the self-loop weight on the success probability. We further evaluate the implementation under realistic noisy settings using superconducting hardware's noise models and apply noise-mitigation techniques to improve the measured search performance. Logical-resource analysis shows that, for grids ranging from $8\\times8$ to $64\\times64$, the algorithmic register increases from 9 to 15 qubits, while the transpiled gate count increases from $3.63\\times10^{5}$ to $4.38\\times10^{6}$ and the circuit depth from $2.13\\times10^{5}$ to $2.56\\times10^{6}$. Finally, fault-tolerant resource estimates based on a surface-code model using the Microsoft Quantum Resource Estimator demonstrate the substantial space-time trade-off associated with magic-state production.", "url": "https://arxiv.org/abs/2608.17136", "type": "理论+数值", "summary": "Lackadaisical 量子行走 (LQW) 通过引入加权自循环扩展了离散时间量子行走 (DTQW)，通过控制行走器的定位来提高空间搜索性能。尽管它们的理论特性和算法优势已被广泛研究，但适合在量子硬件上执行的实用门级实现在很大程度上仍未得到探索。这一差距限制了在现实架构限制、噪声过程和资源需求下对懒散的量子行走搜索的评估。在这项工作中，我们提出了一个用于懒惰的量子行走搜索的门级实现框架。所提出的结构将位置和硬币空间编码到量子位寄存器中，并通过预言机、硬币和触发器移位操作实现行走动态。我们通过重现单个和多个标记顶点的预期搜索行为并分析自循环权重对成功概率的影响来验证电路。\n\n我们使用超导硬件的噪声模型进一步评估现实噪声设置下的实现，并应用噪声缓解技术来提高测量的搜索性能。逻辑资源分析表明，对于从 $8\\times8$ 到 $64\\times64$ 的网格，算法寄存器从 9 个量子位增加到 15 个量子位，而转译门计数从 $3.63\\times10^{5}$ 增加到 $4.38\\times10^{6}$，电路深度从 $2.13\\times10^{5}$ 增加到 $2.13\\times10^{5}$ $2.56\\times10^{6}$。最后，使用 Microsoft 量子资源估算器基于表面代码模型的容错资源估算展示了与魔态生产相关的大量时空权衡。", "authors": [{"name": "Amit Saha"}, {"name": "Debanjan Kola"}, {"name": "Nishanka Das"}, {"name": "Amlan Chakrabarti"}], "featured_authors": [{"name": "Amit Saha"}, {"name": "Debanjan Kola"}, {"name": "Nishanka Das"}, {"name": "Amlan Chakrabarti"}], "author_count": 4}, {"id": "2608.17239", "category": "quant-ph", "title": "Gaussian Optimality of Energy-Constrained One-Shot Communication through Single-Mode Bosonic Gaussian Channels", "abstract": "We prove Gaussian optimality for the energy-constrained one-shot Holevo capacity of single-mode bosonic Gaussian channels, including phase-sensitive channels with arbitrarily squeezed thermal noise. The unresolved regime is the low energy branch, where the Gaussian optimizer modulates only one quadrature and minimum-output-entropy arguments cannot decouple the average state from the letters. For pure one-mode dilations we retain a stronger pointwise result: moment-matched Gaussianization improves the fixed average Holevo function for every input. For mixed environments, whose purification produces a 1:2 entanglement-of-formation problem, we avoid any generic 1:2 Gaussian extremality conjecture. The optimal Gaussian letter selects an effective environmental Schmidt mode and an affine two-mode EPR witness. Its null direction is exactly the modulated quadrature, while its slope equals the negative derivative of the Gaussian letter-output entropy. This produces a supporting lower bound on the dilated entanglement of formation; Gaussian maximum entropy and concavity then give a global upper bound tangent at the Gaussian optimizer. Consequently the known Gaussian formulas for attenuating, amplifying, phase-conjugating, and additive-noise fiducial channels are exact over unrestricted ensembles at every input energy. Via the passive-input fiducial decomposition and energy-constrained continuity, the result extends to every single-mode Gaussian channel, including lower-rank canonical limits. No additivity across channel uses is assumed.", "url": "https://arxiv.org/abs/2608.17239", "type": "理论+数值", "summary": "我们证明了单模玻色高斯通道（包括具有任意压缩热噪声的相敏通道）的能量受限单次 Holevo 容量的高斯最优性。未解决的情况是低能量分支，其中高斯优化器仅调制一个正交，并且最小输出熵参数无法将平均状态与字母解耦。对于纯单模膨胀，我们保留更强的逐点结果：矩匹配高斯化改进了每个输入的固定平均 Holevo 函数。对于混合环境，其净化会产生 1:2 纠缠问题，我们避免任何通用的 1:2 高斯极值猜想。最优高斯字母选择有效的环境施密特模式和仿射二模式EPR见证。它的零方向恰好是调制的正交，而其斜率等于高斯字母输出熵的负导数。这产生了扩张纠缠形成的支撑下界；然后，高斯最大熵和凹度在高斯优化器处给出全局上限正切。\n\n因此，用于衰减、放大、相位共轭和加性噪声基准通道的已知高斯公式在每个输入能量的无限制系综上都是精确的。通过无源输入基准分解和能量约束连续性，结果扩展到每个单模高斯通道，包括低阶规范极限。假设通道使用之间没有可加性。", "authors": [{"name": "Se-Wan Ji"}], "featured_authors": [{"name": "Se-Wan Ji"}], "author_count": 1}, {"id": "2608.17249", "category": "quant-ph", "title": "Low-Depth and Noise-Resilient Quantum State Preparation for Partial Differential Equations via Virtual Rz", "abstract": "Preparing smooth real-amplitude quantum states is a key subroutine in quantum solvers for dissipative PDEs, such as LCHS, where discretized positive weights must be encoded into amplitudes. Exact state-preparation decompositions can reach unit fidelity ideally, but their two-qubit depth grows quickly and causes severe fidelity loss on NISQ hardware. We propose a low-depth, hardware-aware variational ansatz tailored to smooth, weakly entangled, near-real target distributions typical of damped PDE dynamics. The circuit uses one layer of local Ry rotations to generate real amplitudes, a nearest-neighbor CZ entangling layer to introduce limited entanglement, and additional Rz rotations implemented virtually as frame updates. Virtual Rz operations add no physical pulses and do not increase circuit duration, providing extra degrees of freedom without enlarging the gate footprint; in simulation they are treated as ideal to isolate their benefit. From a tensor-network viewpoint, the alternating structure restricts the state to a low-bond-dimension MPS, matching the target smoothness (for 3 qubits, bond dimension <= 2). We optimize parameters with COBYLA to minimize infidelity and benchmark against exact state preparation (Qiskit) and a RealAmplitudes (CZ) baseline. Under depolarizing noise representative of NISQ and early fault-tolerant regimes, the proposed single-layer circuit achieves high ideal fidelity with O(n) depth and substantially higher noisy fidelity than deeper exact constructions. In coherent-noise sweeps, virtual Rz parameters absorb systematic phase errors and axis mismatch, maintaining near-unity fidelity over a wide error range. These results indicate that virtual-Rz-enabled, low-depth circuits provide a practical, noise-resilient state-preparation primitive for PDE solvers on NISQ and early FTQC hardware.", "url": "https://arxiv.org/abs/2608.17249", "type": "理论+数值", "summary": "准备平滑的实振幅量子态是耗散偏微分方程（例如 LCHS）量子求解器中的一个关键子程序，其中离散正权重必须编码为振幅。精确的状态准备分解可以理想地达到单位保真度，但它们的两个量子位深度增长很快，并会在 NISQ 硬件上导致严重的保真度损失。我们提出了一种低深度、硬件感知的变分 ansatz，适合平滑、弱纠缠、接近真实的目标分布，典型的阻尼偏微分方程动力学。该电路使用一层局部 Ry 旋转来生成真实振幅，使用最近邻 CZ 纠缠层来引入有限纠缠，并使用虚拟地作为帧更新实现的附加 Rz 旋转。虚拟 Rz 操作不会添加物理脉冲，也不会增加电路持续时间，从而在不扩大栅极占用空间的情况下提供额外的自由度；在模拟中，它们被视为理想的选择，以隔离它们的好处。从张量网络的角度来看，交替结构将状态限制为低键维 MPS，匹配目标平滑度（对于 3 个量子位，键维 <= 2）。\n\n我们使用 COBYLA 优化参数，以最大限度地减少不忠实性，并针对精确状态准备 (Qiskit) 和 RealAmplitudes (CZ) 基线进行基准测试。在代表 NISQ 和早期容错机制的去极化噪声下，所提出的单层电路实现了 O(n) 深度的高理想保真度，并且比更深的精确结构具有更高的噪声保真度。在相干噪声扫描中，虚拟 Rz 参数吸收系统相位误差和轴失配，在较宽的误差范围内保持接近一致的保真度。这些结果表明，支持虚拟 Rz 的低深度电路为 NISQ 和早期 FTQC 硬件上的 PDE 求解器提供了实用的抗噪声状态准备原语。", "authors": [{"name": "Toru Fujii"}], "featured_authors": [{"name": "Toru Fujii"}], "author_count": 1}, {"id": "2608.17274", "category": "quant-ph", "title": "Weak Typicality of von Neumann Entanglement Entropy in Gaussian Boson Sampling", "abstract": "We study the von Neumann entanglement entropy generated by a Haar distributed passive interferometer acting on $n$ equally squeezed input modes with fixed nonzero squeezing strength $s$. Previous work established proportional weak typicality for integer R'enyi orders $\\alpha\\geq 2$ and stated a sublinear von Neumann result, while the proportional von Neumann case remained open. For a subsystem of $k_n$ modes satisfying $k_n/n\\to r\\in(0,1)$, we prove that, for every $\\varepsilon>0$ and all sufficiently large $n$, $\\mathbb{P}\\left(\\left|\\frac{S_{1,n}}{\\mathbb{E}S_{1,n}}-1\\right|\\geq\\varepsilon\\right)\\leq2\\exp\\left[-\\frac{c_{s,r}\\varepsilon^2n^2}{\\log^2(en)}\\right].$ The proof represents the entropy as a singular value statistic of a principal block of $UU^{\\mathsf T}$, where $U$ denotes the unitary interferometer. It regularizes the logarithmic singularity at the endpoint corresponding to a pure Gaussian mode and applies concentration on the unitary group. The result establishes proportional von Neumann weak typicality and further implies almost sure convergence of $S_{1,n}/\\mathbb{E}S_{1,n}$ to $1$, a typical volume law, and the variance bound $\\mathrm{Var}(S_{1,n})=O_s(\\log^2 n)$. An accompanying Lean 4 development verifies the proof chain.", "url": "https://arxiv.org/abs/2608.17274", "type": "理论", "summary": "我们研究了哈尔分布式无源干涉仪产生的冯·诺依曼纠缠熵，该干涉仪作用于具有固定非零挤压强度 $s$ 的 $n$ 均等挤压输入模式。先前的工作建立了整数 R'enyi 阶 $\\alpha\\geq 2$ 的比例弱典型性，并陈述了次线性冯诺依曼结果，而比例冯诺依曼情况仍然悬而未决。对于满足 $k_n/n\\to r\\in(0,1)$ 的 $k_n$ 模式子系统，我们证明，对于每个 $\\varepsilon>0$ 且所有足够大的 $n$， $\\mathbb{P}\\left(\\left|\\frac{S_{1,n}}{\\mathbb{E}S_{1,n}}-1\\right|\\geq\\varepsilon\\right)\\leq2\\exp\\left[-\\frac{c_{s,r}\\varepsilon^2n^2}{\\log^2(en)}\\right].$证明将熵表示为主块的奇异值统计量$UU^{\\mathsf T}$，其中$U$表示单一干涉仪。它正则化对应于纯高斯模式的端点处的对数奇异性，并将集中应用于酉群。结果建立了比例冯诺依曼弱典型性，并进一步暗示 $S_{1,n}/\\mathbb{E}S_{1,n}$ 几乎肯定会收敛到 $1$（典型的体积定律）和方差界限 $\\mathrm{Var}(S_{1,n})=O_s(\\log^2 n)$。\n\n随附的 Lean 4 开发验证了证明链。", "authors": [{"name": "Hongru Zhao"}], "featured_authors": [{"name": "Hongru Zhao"}], "author_count": 1}, {"id": "2608.17280", "category": "quant-ph", "title": "A Connectivity-Order Law and Conditional Minimal-Mechanism Identification in Many-Body Geometric Phases", "abstract": "The value of a multiqubit geometric phase at a single operating point does not reveal whether it was generated directly or through a connected sequence of lower-body interactions. For analytic, gapped, nondegenerate Abelian holonomies, we jointly resolve logical support and independently calibrated coupling support. Every nonzero connected response must involve an active set that connects and covers the target and must contain one factor of each active coupling, yielding the sharp onset bound $\\nu_S \\geq \\tau_E(S)$. The same selection law applies locally to projected Berry curvature. Conversely, an unrestricted finite-dimensional construction realizes all responses allowed by the connected-cover condition simultaneously, making the condition necessary and sufficient within this theorem class. Operationally, simultaneous confidence bands certify detected mixed responses while controlling false positives; a factor-of-two separation condition additionally recovers exact library-relative response minima. In a complete dictionary, nontriviality of every minimal-cover response is generically necessary and sufficient for these minima to coincide with the minimal calibrated mechanisms. Three-qubit Wilson calculations distinguish direct and pair-mediated routes with the same endpoint phase, and a synthetic Ramsey audit locates the finite-resolution boundary.", "url": "https://arxiv.org/abs/2608.17280", "type": "理论+数值", "summary": "单个操作点处的多量子位几何相位的值并不能揭示它是直接生成的还是通过下半身相互作用的连接序列生成的。对于解析的、有间隙的、非简并的阿贝尔完整函数，我们共同解决逻辑支持和独立校准的耦合支持。每个非零连接响应必须涉及一个连接并覆盖目标的活动集，并且必须包含每个活动耦合的一个因子，从而产生尖锐的起始边界 $\\nu_S \\geq \\tau_E(S)$。相同的选择法则局部适用于投影贝里曲率。相反，无限制的有限维构造同时实现了连通覆盖条件允许的所有响应，使得该条件在该定理类中是必要且充分的。在操作上，同步置信带可证明检测到的混合响应，同时控制误报；两倍的分离条件还可以恢复精确的文库相关响应最小值。在完整的字典中，每个最小覆盖响应的非平凡性通常对于这些最小值与最小校准机制一致是必要和充分的。\n\n三量子位威尔逊计算区分具有相同端点相位的直接路径和成对介导路径，并且综合拉姆齐审核定位有限分辨率边界。", "authors": [{"name": "Kuo Hai"}, {"name": "Junhao Huang"}, {"name": "Qiong Chen"}, {"name": "Wenhua Hai"}], "featured_authors": [{"name": "Kuo Hai"}, {"name": "Junhao Huang"}, {"name": "Qiong Chen"}, {"name": "Wenhua Hai"}], "author_count": 4}, {"id": "2608.17313", "category": "quant-ph", "title": "Reduced State Stabilizer Rényi Entropy as a Probe of Quantum Phase Transitions in Frustrated J_1-J_2 Spin Models", "abstract": "We investigate whether the second-order purity-corrected stabilizer Rényi entropy (SRE) of reduced two-qubit density matrices can serve as a reliable local indicator of quantum phase transitions (QPTs) in frustrated quantum spin systems. We consider the one-dimensional isotropic \\(J_1-J_2\\) Heisenberg model, the one-dimensional XXZ \\(J_1-J_2\\) model, and the two-dimensional \\(J_1-J_2\\) Heisenberg model on a \\(4\\times4\\) square lattice. Unlike several previously studied quantum information measures, which fail to detect QPTs in the ground state of these frustrated systems, the reduced ground-state purity-corrected SRE successfully identifies most transitions. For the remaining cases, we consider a low temperature subjacent state, modeled as a statistical mixture of the ground and first excited states with a Maxwell--Boltzmann-type occupation probability. For the 1D isotropic model, the subjacent-state SRE shows a discontinuity at the critical point, yielding \\(\\alpha_c(\\infty)=0.24116\\), in excellent agreement with established values; the ground-state SRE shows a point of inflection, yielding \\(\\alpha_c(\\infty)=0.2681\\). For the 1D XXZ model, the subjacent-state SRE reproduces the full anisotropy dependent phase diagram, while the ground-state SRE captures transitions only at low anisotropy. For the 2D model, the subjacent-state SRE detects two transitions, at \\(\\alpha_c(4\\times4)=0.40781\\) and \\(0.6208\\), while the ground-state SRE identifies the second at \\(0.6230\\). Compared with conventional two-qubit entanglement, purity-corrected SRE shows a clear advantage in revealing otherwise-invisible phase transitions, establishing it as a robust, efficient, local probe of frustrated quantum criticality.", "url": "https://arxiv.org/abs/2608.17313", "type": "理论+数值", "summary": "我们研究了约简双量子位密度矩阵的二阶纯度校正稳定器 Rényi 熵 (SRE) 是否可以作为受挫量子自旋系统中量子相变 (QPT) 的可靠局部指标。我们考虑一维各向同性 \\(J_1-J_2\\) 海森堡模型、一维 XXZ \\(J_1-J_2\\) 模型和 \\(4\\times4\\) 方格上的二维 \\(J_1-J_2\\) 海森堡模型。与之前研究的几种量子信息测量不同，这些测量无法检测到这些受挫系统的基态中的 QPT，而减少的基态纯度校正 SRE 成功地识别了大多数跃迁。对于其余情况，我们考虑低温下态，建模为具有麦克斯韦-玻尔兹曼型占据概率的基态和第一激发态的统计混合。对于一维各向同性模型，下态 SRE 在临界点表现出不连续性，产生 \\(\\alpha_c(\\infty)=0.24116\\)，与既定值非常一致；基态 SRE 显示出一个拐点，产生 \\(\\alpha_c(\\infty)=0.2681\\)。\n\n对于 1D XXZ 模型，下态 SRE 再现了完整的各向异性相关相图，而基态 SRE 仅捕获低各向异性时的跃迁。对于 2D 模型，下态 SRE 在 \\(\\alpha_c(4\\times4)=0.40781\\) 和 \\(0.6208\\) 处检测到两个跃迁，而基态 SRE 在 \\(0.6230\\) 处识别出第二个跃迁。与传统的两个量子位纠缠相比，纯度校正的 SRE 在揭示原本不可见的相变方面显示出明显的优势，使其成为受挫量子临界性的稳健、高效、局部探针。", "authors": [{"name": "George Biswas"}, {"name": "Santanu Sarkar"}, {"name": "Jun-Yi Wu"}, {"name": "Anindya Biswas"}], "featured_authors": [{"name": "George Biswas"}, {"name": "Santanu Sarkar"}, {"name": "Jun-Yi Wu"}, {"name": "Anindya Biswas"}], "author_count": 4}, {"id": "2608.17376", "category": "quant-ph", "title": "Exact certification of a positive-order Rényi additivity violation for an explicit channel pair", "abstract": "Cubitt, Harrow, Leung, Montanaro, and Winter (CHLMW) exhibited an explicit pair of quantum channels whose minimum output Rényi entropy is nonadditive at order zero, and reported numerical violations at positive orders close to zero. Their paper states that a semidefinite-programming argument yields a rigorous positive-order interval for the same example, without printing the endpoint or a verifiable certificate; a recent paper by Leung, Lovitz, and Wu records that for this pair \"no rigorous endpoint was obtained\". We close that gap for the trace-preserving normalization of the printed pair fixed in Section 2. Small rational witness matrices prove that every output of either channel has all eigenvalues between $301/100000$ and $2/3$; a single explicit entangled input has an exact rational joint output spectrum of rank eight; and two independent elementary interval arguments turn these three facts into a proof of strict additivity violation, $S_p^{\\min}(\\mathrm{N}_R\\otimes\\mathrm{N}_{\\bar S}) < S_p^{\\min}(\\mathrm{N}_R)+S_p^{\\min}(\\mathrm{N}_{\\bar S}),$ for every real order $0<p\\le 1/22$. Every step of the verification reduces to comparisons of integers, and the complete certificate is a few small rational matrices that a reader can check with a short program -- or, for any single order, by hand. To our knowledge, consistent with the assessment of Leung, Lovitz, and Wu, this is the first printed, computer-verifiable certified positive-order endpoint for this explicit pair. We claim no novelty for the phenomenon or for the eigenvalue-floor mechanism, both due to CHLMW, and no optimality of the endpoint.", "url": "https://arxiv.org/abs/2608.17376", "type": "理论+数值", "summary": "Cubitt、Harrow、Leung、Montanaro 和 Winter (CHLMW) 展示了一对显式量子通道，其最小输出 Rényi 熵在零阶上是非可加性的，并报告了在接近零的正阶上的数值违规。他们的论文指出，半定编程论证可以为同一示例产生严格的正序区间，而无需打印端点或可验证的证书； Leung、Lovitz 和 Wu 最近发表的一篇论文记录了这对“没有获得严格的终点”。我们缩小了第 2 节中固定的打印对的跟踪保留归一化的差距。小型理性见证矩阵证明任一通道的每个输出都具有介于 $301/100000$ 和 $2/3$ 之间的所有特征值；单个显式纠缠输入具有精确的八阶有理联合输出谱；两个独立的基本区间参数将这三个事实转化为严格可加性违规的证明， $S_p^{\\min}(\\mathrm{N}_R\\otimes\\mathrm{N}_{\\bar S}) < S_p^{\\min}(\\mathrm{N}_R)+S_p^{\\min}(\\mathrm{N}_{\\bar S}),$ 对于每个实数阶 $0<p\\le 1/22$。\n\n验证的每一步都简化为整数的比较，完整的证书是一些小的有理矩阵，读者可以使用简短的程序来检查 - 或者，对于任何单个订单，可以手动检查。据我们所知，与 Leung、Lovitz 和 Wu 的评估一致，这是该显式对的第一个印刷的、计算机可验证的认证正序端点。我们声称这种现象或特征值下限机制没有新颖性，这都是由于 CHLMW，并且端点没有最优性。", "authors": [{"name": "Artus Krohn-Grimberghe"}], "featured_authors": [{"name": "Artus Krohn-Grimberghe"}], "author_count": 1}, {"id": "2608.17470", "category": "quant-ph", "title": "Absorption-emission quantum repeater using diamond quantum memories", "abstract": "Quantum repeaters are essential for overcoming the exponential photon loss that limits entanglement generation over long distances in quantum networks. An absorption-emission-based quantum repeater exploits the fundamental light-matter interactions of a diamond nitrogen-vacancy (NV) center---photon absorption and photon emission---to transfer a quantum state from an absorbed photon to an emitted photon, offering a scalable architecture that operates without photon interference between remote nodes. Here we demonstrate an absorption-emission-based quantum repeater node using a single NV center, realizing the complete single-node operation in which heralded photon-to-memory quantum state transfer, repeat-until-success (RUS) emission of a spin-entangled photon, and quantum teleportation of the memory state onto the emitted photon constitute the essential repeater operation. By characterizing the complete repeater operation as a quantum channel from the absorbed photon to the emitted photon via quantum process tomography, we obtain a process fidelity of 78%. This demonstration establishes the absorption-emission approach as a fundamental building block for scalable quantum repeater architectures and paves the way toward practical long-distance quantum networks.", "url": "https://arxiv.org/abs/2608.17470", "type": "理论", "summary": "量子中继器对于克服指数光子损失至关重要，这种损失限制了量子网络中长距离纠缠的产生。基于吸收发射的量子中继器利用金刚石氮空位（NV）中心的基本光与物质相互作用——光子吸收和光子发射——将量子态从吸收的光子转移到发射的光子，提供了一种可扩展的架构，在远程节点之间没有光子干扰的情况下运行。在这里，我们展示了一个使用单个NV中心的基于吸收发射的量子中继器节点，实现了完整的单节点操作，其中预示着光子到存储器的量子状态转移、自旋纠缠光子的重复直到成功（RUS）发射以及存储器状态到发射光子的量子隐形传态构成了基本的中继器操作。通过量子过程断层扫描将完整的中继器操作描述为从吸收光子到发射光子的量子通道，我们获得了 78% 的过程保真度。\n\n该演示将吸收发射方法确立为可扩展量子中继器架构的基本构建模块，并为实际的长距离量子网络铺平了道路。", "authors": [{"name": "Taichi Fujiwara"}, {"name": "Yuhei Sekiguchi"}, {"name": "Raustin Reyes"}, {"name": "Toshiharu Makino"}, {"name": "Hiromitsu Kato"}, {"name": "Hideo Kosaka"}], "featured_authors": [{"name": "Taichi Fujiwara"}, {"name": "Yuhei Sekiguchi"}, {"name": "Raustin Reyes"}, {"name": "Toshiharu Makino"}, {"name": "Hiromitsu Kato"}, {"name": "Hideo Kosaka"}], "author_count": 6}, {"id": "2608.17500", "category": "quant-ph", "title": "Characterizing Entanglement in Combinations of Bell States through Superposition and Mixing: An Increase in Entanglement on Introducing Depolarizing, Phase Damping, and Amplitude Damping Noise", "abstract": "We systematically characterize quantum entanglement in all sixteen combinations of two-qubit Bell states across three operational regimes: pure superposition, noiseless mixing, and asymmetric mixing of one noisy and one pure Bell state. For pure superpositions, we calculate the von Neumann entropy and show that entanglement depends critically on the relative phase phi between superposed states. For mixed states, we use concurrence C under three physically motivated decoherence channels. The Depolarizing (DP) and Phase Damping (PD) channels are modeled as global, collective operations on the two-qubit Hilbert space, while Amplitude Damping (AD) is treated as independent local decay on each qubit, reflecting the asymmetric, energy-dissipating nature of spontaneous emission. A central and counterintuitive result is that increasing noise can raise concurrence in specific parameter regimes across all three channels. We further map the boundary between mathematical entanglement (C > 0) and operational quantum non-locality using the Horodecki criterion, finding this boundary to be strongly channel-dependent. Under Phase Damping, the Bell-local entanglement regime vanishes entirely for identical and same-bases mixtures, meaning any surviving entanglement guarantees a CHSH violation. Under Depolarizing noise, a large Bell-local region requires mixing probability r > 1/sqrt(2) to recover non-locality at maximum noise. For Amplitude Damping, certain mixtures exhibit a non-monotonic Horodecki parameter M(T): concurrence decreases monotonically with noise, yet the capacity for CHSH violation is lost at intermediate noise levels and restored at high noise, as maximal damping repurifies the noisy branch. These results provide a unified analytical reference for entanglement and non-locality management across Bell-state combinations and decoherence channels relevant to NISQ architectures.", "url": "https://arxiv.org/abs/2608.17500", "type": "理论", "summary": "我们系统地描述了跨三种操作机制的两个量子位贝尔态的所有 16 种组合中的量子纠缠：纯叠加、无噪声混合以及一种噪声和一种纯贝尔态的不对称混合。对于纯叠加，我们计算了冯·诺依曼熵，并表明纠缠关键取决于叠加态之间的相对相位 phi。对于混合状态，我们在三个物理驱动的退相干通道下使用并发 C。去极化 (DP) 和相位阻尼 (PD) 通道被建模为两个量子位希尔伯特空间上的全局集体操作，而振幅阻尼 (AD) 被视为每个量子位上的独立局部衰减，反映了自发发射的不对称、能量耗散性质。一个核心且违反直觉的结果是，增加噪声可以提高所有三个通道的特定参数机制的并发性。我们使用 Horodecki 准则进一步映射数学纠缠 (C > 0) 和操作量子非定域性之间的边界，发现该边界强烈依赖于通道。\n\n在相位阻尼下，对于相同和相同碱基的混合物，贝尔本地纠缠机制完全消失，这意味着任何幸存的纠缠都会保证 CHSH 违规。在去极化噪声下，大的贝尔局部区域需要混合概率 r > 1/sqrt(2) 才能在最大噪声下恢复非局部性。对于振幅阻尼，某些混合物表现出非单调的 Horodecki 参数 M(T)：并发性随噪声单调降低，但 CHSH 违规的能力在中等噪声水平下会丢失，并在高噪声下恢复，因为最大阻尼重新净化了噪声分支。这些结果为与 NISQ 架构相关的贝尔态组合和退相干通道的纠缠和非局域性管理提供了统一的分析参考。", "authors": [{"name": "Nishant Chaudhari"}, {"name": "Jean-François Van Huele"}], "featured_authors": [{"name": "Nishant Chaudhari"}, {"name": "Jean-François Van Huele"}], "author_count": 2}, {"id": "2608.17610", "category": "quant-ph", "title": "Towards the Impossibility of Imperfectly Complete Key Agreement in the QROM", "abstract": "We make progress towards the impossibility of imperfectly complete quantum-computation, classical-communication (QCCC) key agreement by constructing the first unconditional attacks on quantum key agreement in the following restricted settings. In the two-message setting, we assume that Alice makes only classical queries to the oracle in the first round and that her message to Bob is classical, but otherwise both parties may perform arbitrary quantum computation, make quantum queries, and send a quantum state in the second round. Our attack and analysis are based on the heavy-query learning techniques from Austrin et al. (CRYPTO 2022) and the reprogramming techniques of Katz and Sela (arXiv 2401.14319 ). In the round-independent setting, we show that the attack of Barak and Mahmoody (CRYPTO 2009; J. Cryptology 2017) can be extended to multiple rounds when Alice and Bob share classical communication and make only classical queries in all but the final round. In both settings, the attacker is computationally unbounded and makes $poly(\\lambda)$ queries to recover the key whenever each honest query bound is at most $poly(\\lambda)$ and the valid agreement probability is inverse-polynomial. As a consequence, we rule out imperfectly correct quantum public-key encryption for classical messages whose length is bounded by a polynomial in $\\lambda$ in the QROM when key generation has classical oracle access, even if encryption, decryption, and the ciphertext are quantum. In particular, the one-bit case applies to the imperfectly correct PKE obtained from two-round OSP by Bartusek and Khurana (CRYPTO 2025) whenever the classical OSP sender makes only classical random-oracle queries.", "url": "https://arxiv.org/abs/2608.17610", "type": "理论", "summary": "通过在以下受限设置中构建对量子密钥协议的第一个无条件攻击，我们在实现不完全完整的量子计算、经典通信（QCCC）密钥协议方面取得了进展。在双消息设置中，我们假设 Alice 在第一轮中仅对预言机进行经典查询，并且她给 Bob 的消息是经典消息，但双方都可以在第二轮中执行任意量子计算、进行量子查询并发送量子状态。我们的攻击和分析基于 Austrin 等人的重查询学习技术。 (CRYPTO 2022) 以及 Katz 和 Sela 的重编程技术 (arXiv 2401.14319)。在与回合无关的设置中，我们表明，当 Alice 和 Bob 共享经典通信并在除最后一轮之外的所有回合中仅进行经典查询时，Barak 和 Mahmoody（CRYPTO 2009；J. Cryptology 2017）的攻击可以扩展到多轮。\n\n在这两种设置中，攻击者在计算上都是无界的，只要每个诚实查询界限最多为 $poly(\\lambda)$ 并且有效一致概率为逆多项式，攻击者就会进行 $poly(\\lambda)$ 查询来恢复密钥。因此，当密钥生成具有经典预言机访问权限时，即使加密、解密和密文是量子的，我们也排除了对于长度受 QROM 中 $\\lambda$ 中的多项式限制的经典消息的不完全正确的量子公钥加密。特别是，当经典 OSP 发送方仅进行经典随机预言查询时，一位情况适用于 Bartusek 和 Khurana (CRYPTO 2025) 从两轮 OSP 获得的不完全正确的 PKE。", "authors": [{"name": "Fuyuki Kitagawa"}, {"name": "Ryo Nishimaki"}, {"name": "Agi Villanyi"}, {"name": "Takashi Yamakawa"}], "featured_authors": [{"name": "Fuyuki Kitagawa"}, {"name": "Ryo Nishimaki"}, {"name": "Agi Villanyi"}, {"name": "Takashi Yamakawa"}], "author_count": 4}, {"id": "2608.17629", "category": "quant-ph", "title": "Unclonable encryption from BB84 states: a simultaneous Goldreich-Levin reduction", "abstract": "Goldreich-Levin reductions are ubiquitous in cryptography: they convert an algorithm capable of guessing $\\langle r, m \\rangle$ (mod $2$) for a hidden string $m$ and a random challenge $r$, to one that is capable of extracting the entirety of $m$. Here, we describe a \"simultaneous\" Goldreich-Levin reduction for two entangled parties who are capable of guessing $\\langle r, m \\rangle$ given uniformly random identical challenges $r$. This allows to upgrade any unclonable encryption scheme satisfying \"search\" security to one satisfying the gold standard of unclonable \"indistinguishability\". As a corollary, we show that the simplest candidate unclonable encryption scheme from BB84 states satisfies unclonable indistinguishability. This result was discovered by GPT-5.6 Ultra after a few interactions. Our prompts included recent results on unclonable encryption by Ananth and Sahai, and Ragavan.", "url": "https://arxiv.org/abs/2608.17629", "type": "理论+数值", "summary": "Goldreich-Levin 约简在密码学中无处不在：它们将能够猜测隐藏字符串 $m$ 的 $\\langle r, m \\rangle$ (mod $2$) 和随机挑战 $r$ 的算法转换为能够提取整个 $m$ 的算法。在这里，我们描述了两个纠缠方的“同时”Goldreich-Levin 约简，他们能够在均匀随机的相同挑战 $r$ 的情况下猜测 $\\langle r, m \\rangle$。这允许将任何满足“搜索”安全性的不可克隆加密方案升级为满足不可克隆“不可区分性”黄金标准的方案。作为推论，我们证明了 BB84 状态中最简单的候选不可克隆加密方案满足不可克隆不可区分性。这个结果是 GPT-5.6 Ultra 经过几次交互后发现的。我们的提示包括 Ananth 和 Sahai 以及 Ragavan 关于不可克隆加密的最新结果。", "authors": [{"name": "Andrea Coladangelo"}, {"name": "Qipeng Liu"}, {"name": "Ziyi Xie"}], "featured_authors": [{"name": "Andrea Coladangelo"}, {"name": "Qipeng Liu"}, {"name": "Ziyi Xie"}], "author_count": 3}, {"id": "2608.17653", "category": "quant-ph", "title": "Quantum simulation of slow analytic time-dependent Hamiltonians", "abstract": "We develop a quantum algorithm for slow analytic Hamiltonians $\\widetilde H(t)=H(t/T)$ with $\\|H(s)\\|\\leq\\alpha$ that achieves nearly additive query complexity and low gate overhead. Our main technical contribution is a periodic Gevrey extension of $H(s)$, together with Fourier component decay and truncation bounds that enable an efficient finite-dimensional simulation. Combined with Floquet embedding and optimal time-independent Hamiltonian simulation technique, this gives query complexity $\\widetilde{\\mathcal O}\\!\\left(\\alpha T+\\log(1/\\varepsilon)\\right)$ and additional gate complexity $\\widetilde{\\mathcal O}\\!\\left((\\alpha T+\\log(1/\\varepsilon))^2\\log(1/\\varepsilon)\\right)$, assuming coherent access to $H'(s)$ and endpoint derivatives. For slow analytic control Hamiltonians, only block encodings of the time-independent control operators are required, with the same query complexity and lower gate overhead. Our method also extends to Gevrey Hamiltonians and improves the precision dependence for simulating slow analytic semi-dissipative linear differential equations.", "url": "https://arxiv.org/abs/2608.17653", "type": "理论+数值", "summary": "我们为慢速分析哈密顿量 $\\widetilde H(t)=H(t/T)$ 开发了一种量子算法，其中 $\\|H(s)\\|\\leq\\alpha$ 实现了近乎加性的查询复杂性和低门开销。我们的主要技术贡献是 $H(s)$ 的周期性 Gevrey 扩展，以及傅里叶分量衰减和截断界限，从而实现有效的有限维模拟。结合 Floquet 嵌入和最佳时间无关的哈密顿模拟技术，这给出了查询复杂度 $\\widetilde{\\mathcal O}\\!\\left(\\alpha T+\\log(1/\\varepsilon)\\right)$ 和额外的门复杂度 $\\widetilde{\\mathcal O}\\!\\left((\\alpha T+\\log(1/\\varepsilon))^2\\log(1/\\varepsilon)\\right)$，假设对 $H'(s)$ 和端点导数的一致访问。对于慢速分析控制哈密顿量，仅需要时间无关控制算子的块编码，具有相同的查询复杂度和较低的门开销。我们的方法还扩展到 Gevrey Hamiltonian，并提高了模拟慢解析半耗散线性微分方程的精度依赖性。", "authors": [{"name": "Chenhao Zhao"}, {"name": "Yinan Li"}, {"name": "Dong An"}], "featured_authors": [{"name": "Chenhao Zhao"}, {"name": "Yinan Li"}, {"name": "Dong An"}], "author_count": 3}, {"id": "2608.17792", "category": "quant-ph", "title": "Interference Engineering for Quantum Imaginary-Time Evolution through Multiple Energy Shifts", "abstract": "Energy shifting is usually trivial in imaginary-time evolution because it changes only the normalization of the evolved state. On a quantum computer, however, imaginary-time evolution can be implemented as a coherent or sampled superposition of real-time evolutions, in which energy shifts generate relative phases that can interfere. Here we introduce multi-shift quantum imaginary-time evolution (MS-QITE), which uses a distribution of energy shifts to engineer interference and optimize different implementations. In a Monte Carlo realization, multi-shift reshapes the sampling distribution and concentrates it within a shorter real-time window, thereby reducing the required Hamiltonian-evolution time and improving the stability of ground-state-energy estimation. In a continuous-variable-assisted realization, it permits postselection over a finite quadrature interval rather than near a single quadrature value, substantially reducing resource consumption while retaining accurate thermal-state preparation. Numerical results for transverse-field Ising models demonstrate that energy shifts provide a useful interference-based approach for optimizing quantum imaginary-time evolution.", "url": "https://arxiv.org/abs/2608.17792", "type": "理论+数值", "summary": "能量转移在虚时演化中通常是微不足道的，因为它只改变演化状态的标准化。然而，在量子计算机上，虚时间演化可以实现为实时演化的相干或采样叠加，其中能量变化产生可以干扰的相对相位。在这里，我们介绍多位移量子虚时间演化（MS-QITE），它使用能量位移的分布来设计干扰并优化不同的实现。在蒙特卡罗实现中，多移重塑采样分布并将其集中在较短的实时窗口内，从而减少所需的哈密顿演化时间并提高基态能量估计的稳定性。在连续变量辅助实现中，它允许在有限正交区间而不是接近单个正交值进行后选择，从而大大减少资源消耗，同时保持准确的热状态准备。横向场伊辛模型的数值结果表明，能量转移为优化量子虚数时间演化提供了一种有用的基于干涉的方法。", "authors": [{"name": "Hong-Jian Tang"}, {"name": "Dan-Bo Zhang"}], "featured_authors": [{"name": "Hong-Jian Tang"}, {"name": "Dan-Bo Zhang"}], "author_count": 2}, {"id": "2608.17846", "category": "quant-ph", "title": "Quantum Circuit for General Unitary: Improved T-count via Block Flattening and Dilation", "abstract": "Synthesizing arbitrary $n$-qubit unitaries using as few non-Clifford gates as possible is a central problem in fault-tolerant quantum compilation. We present a Clifford+$T$ quantum circuit construction that approximately implements any classically specified unitary to within error $\\epsilon$ and achieves a worst-case $T$-count with leading exponential scaling of $2^{5n/4}$ whenever $\\log(1/\\epsilon)=\\operatorname{poly}(n)$. This improves upon the best previous $2^{4n/3}$ scaling. The key innovation lies in treating the target unitary as a single block-encoded object rather than a long product of simpler operations. A technique of block flattening controls the normalization while preserving an efficient implementation of the block encoding; subsequently, quantum singular value transformation maps its common singular value to one, thereby recovering the target unitary.", "url": "https://arxiv.org/abs/2608.17846", "type": "理论", "summary": "使用尽可能少的非 Clifford 门合成任意 $n$ 量子位酉是容错量子编译中的核心问题。我们提出了一个 Clifford+$T$ 量子电路结构，它近似地实现了误差 $\\epsilon$ 内的任何经典指定的酉，并在 $\\log(1/\\epsilon)=\\operatorname{poly}(n)$ 时实现了最坏情况的 $T$ 计数，领先指数缩放为 $2^{5n/4}$。这比之前最好的 $2^{4n/3}$ 缩放有所改进。关键的创新在于将目标统一视为单个块编码对象，而不是更简单操作的长乘积。块平坦化技术控制归一化，同时保持块编码的有效实现；随后，量子奇异值变换将其公共奇异值映射到1，从而恢复目标幺正。", "authors": [{"name": "Pei Yuan"}, {"name": "Shengyu Zhang"}, {"name": "Wei Zi"}], "featured_authors": [{"name": "Pei Yuan"}, {"name": "Shengyu Zhang"}, {"name": "Wei Zi"}], "author_count": 3}, {"id": "2608.17854", "category": "quant-ph", "title": "A quantum optical concept of attosecond pulses: the attoquants", "abstract": "High-harmonic generation (HHG) is conventionally understood to produce attosecond pulse trains only when the emitted harmonics are mutually phase-locked, in accordance with the classical theory of mode-locking. Such locking is necessary for pulse synthesis when the harmonic field is in a separable multimode quantum state. This requirement, however, can be circumvented entirely for harmonic combs exhibiting intermodal entanglement. We introduce a novel family of multimode quantum states, termed attoquants: states associated with highly structured pulse trains that are inherently insensitive to relative phases. As a concrete example, we analyse the coherent permanent state, constructed as a completely symmetric superposition of products of coherent states over all permutations of a fixed parameter set. It is shown analytically that its electric-field expectation value is a locked Fourier superposition of the driving-field harmonics, yielding an attosecond pulse train without requiring mode-locking. We further calculate the photon statistics, the Wigner function, and the logarithmic negativity of this state, confirming it to be genuinely
