  <script>
    const papers = [{"id": "2608.16949", "category": "cond-mat", "title": "Critical couplings of two dimensional Ising model on various lattices", "abstract": "We develop a unified fermionic-field formulation of the two-dimensional Ising model on several planar lattices using the Kac--Ward representation. Grassmann fields are associated with directed lattice links, while the turning of a fermionic trajectory at a lattice vertex is encoded by the corresponding Kac--Ward phase factor. Within this approach the partition function is expressed through the determinant of a finite-dimensional momentum-space matrix, whose zeros determine the excitation spectrum and the critical coupling. We apply the method to the regular square, honeycomb, triangular, kagomé, and dual kagomé (dice or $T_3$) lattices. In all cases the known exact critical couplings are reproduced. Particular attention is given to the anisotropic kagomé lattice, for which the fermionic determinant yields the complete critical surface and the low-energy spectral equation. We also construct the fermionic action for the dual kagomé lattice and derive its anisotropic critical condition. In the isotropic dice model the spectrum reduces at low energy and momentum to a relativistic massive form, with the mass vanishing at $\\cosh(2J_c)=(1+\\sqrt3)/2$. The results demonstrate that the same fermionic construction provides a compact description of criticality and low-energy excitations for Ising models on lattices with different local geometries and coordination numbers.", "url": "https://arxiv.org/abs/2608.16949", "type": "理论", "summary": "我们使用 Kac--Ward 表示在几个平面晶格上开发了二维 Ising 模型的统一费米子场公式。格拉斯曼场与有向晶格链接相关联，而晶格顶点处费米子轨迹的转动由相应的 Kac--Ward 相位因子编码。在这种方法中，配分函数通过有限维动量空间矩阵的行列式来表达，其零点决定激发谱和临界耦合。我们将该方法应用于规则正方形、蜂窝状、三角形、kagomé 和双 kagomé（骰子或 $T_3$）格子。在所有情况下，都会再现已知的精确关键耦合。特别关注各向异性 Kagomé 晶格，其中费米子行列式产生完整的临界表面和低能谱方程。我们还构造了双 Kagomé 晶格的费米子作用并推导了其各向异性临界条件。在各向同性骰子模型中，光谱在低能量和动量下减少为相对论性质量形式，质量在 $\\cosh(2J_c)=(1+\\sqrt3)/2$ 处消失。\n\n结果表明，相同的费米子结构为具有不同局部几何形状和配位数的晶格上的伊辛模型提供了临界性和低能激发的紧凑描述。", "authors": [{"name": "Sh. Khachatryan"}, {"name": "A. Sedrakyan"}], "featured_authors": [{"name": "Sh. Khachatryan"}, {"name": "A. Sedrakyan"}], "author_count": 2}, {"id": "2608.16980", "category": "cond-mat", "title": "Hydrodynamization in 1D Bose gases at nonzero temperature", "abstract": "Hydrodynamization refers to the remarkably rapid process in relativistic heavy-ion collisions by which hydrodynamic descriptions become applicable. Following the observation of analogous behavior in ultracold one-dimensional (1D) Bose gases, hydrodynamization has been conjectured to be a universal dynamical phenomenon in quantum systems following high-energy quenches. Theoretical studies in this cold-atom setting have so far been restricted to quenches from ground states. Here we study how nonzero temperatures affect hydrodynamization. Specifically, using a homogeneous 1D gas of hard-core bosons, we explore how the initial temperature affects the timescales associated with hydrodynamization and prethermalization following a Bragg-pulse quench. We find that while the hydrodynamization coherence time remains unchanged, increasing temperature shortens both the damping time of the hydrodynamization oscillations and the prethermalization time. We argue that this is mainly the result of the broadening of the initial rapidity distribution, and introduce a nonzero-temperature dephasing time defined in terms of the extent of the rapidity distribution.", "url": "https://arxiv.org/abs/2608.16980", "type": "理论", "summary": "水动力化是指相对论性重离子碰撞中非常快速的过程，通过该过程可以应用流体动力学描述。在超冷一维 (1D) 玻色气体中观察到类似行为后，推测氢动力化是高能猝灭后量子系统中的一种普遍动力学现象。迄今为止，这种冷原子环境的理论研究仅限于基态淬火。在这里，我们研究非零温度如何影响水动力化。具体来说，使用硬核玻色子的均匀一维气体，我们探索了初始温度如何影响与布拉格脉冲淬灭后的水动力化和预热相关的时间尺度。我们发现，虽然水动力相干时间保持不变，但升高温度会缩短水动力振荡的阻尼时间和预热时间。我们认为这主要是初始速度分布变宽的结果，并引入了根据速度分布范围定义的非零温度移相时间。", "authors": [{"name": "Jeff Leiberton"}, {"name": "Marcos Rigol"}], "featured_authors": [{"name": "Jeff Leiberton"}, {"name": "Marcos Rigol"}], "author_count": 2}, {"id": "2608.17061", "category": "cond-mat", "title": "Emissivity by Design: Geometric Mesh Inductance Governs Thermal Radiation in Metallic Nanowire Networks", "abstract": "The thermal infrared emissivity of metallic nanowire networks - the property that makes them candidate low-emissivity transparent electrodes - follows regularities that have resisted physical explanation: a strong wire-diameter dependence with no wire-length dependence, a correlation with sheet resistance that breaks down above ~15 ohm/sq, and an angular signature that turns from dielectric-like to metallic as the network densifies. We show that all of them follow from one local geometric length, the average inter-wire gap g, acting through the geometric inductance of a mesh finer than the thermal wavelength: $X_L = Z_0 (g/\\lambda) \\ln(2g/\\pi D)$, a parameter-free reactance that exceeds the ohmic loss and, unlike the DC sheet resistance, stays finite instead of diverging at the percolation threshold. Since the gap is fixed by areal density and wire diameter alone, the optics is length-independent and decoupled from percolative transport; what has been read as a second, optical percolation is instead a smooth impedance crossing. With a single fitted parameter the theory reproduces 56 silver-nanowire samples across four diameters to a mean absolute error of 0.04, collapses them onto one universal curve, and - unchanged - predicts the emissivity-transmittance data of five independent groups and the measured spectral emissivity, including the silica phonon band. Because this reactance contains no material constant, the inter-wire gap emerges as the master design variable for the radiative properties of metallic nanowire transparent conductors.", "url": "https://arxiv.org/abs/2608.17061", "type": "理论", "summary": "金属纳米线网络的热红外发射率（使其成为低发射率透明电极的候选属性）遵循物理解释无法解释的规律：具有很强的线直径依赖性，但不依赖于线长度，与薄膜电阻的相关性在~15欧姆/平方以上，并且随着网络致密化，角度特征从类电介质转变为金属。我们表明，所有这些都遵循一个局部几何长度，即平均线间间隙 g，通过比热波长更细的网格的几何电感起作用：$X_L = Z_0 (g/\\lambda) \\ln(2g/\\pi D)$，这是一种超过欧姆损耗的无参数电抗，并且与直流薄层电阻不同，它保持有限而不是在渗透阈值处发散。由于间隙仅由面密度和线直径固定，因此光学器件与长度无关，并且与渗透传输分离；相反，被理解为第二个光学渗滤的是平滑的阻抗交叉。\n\n利用单个拟合参数，该理论以平均绝对误差为 0.04 的方式再现了 4 个直径上的 56 个银纳米线样本，将它们折叠到一条通用曲线上，并且在保持不变的情况下预测了五个独立组的发射率-透射率数据以及测量的光谱发射率，包括二氧化硅声子带。由于该电抗不包含材料常数，因此线间间隙成为金属纳米线透明导体辐射特性的主要设计变量。", "authors": [{"name": "Amaury Baret"}, {"name": "Ngoc Duy Nguyen"}], "featured_authors": [{"name": "Amaury Baret"}, {"name": "Ngoc Duy Nguyen"}], "author_count": 2}, {"id": "2608.17125", "category": "cond-mat", "title": "Demonstration of a scalable all-solid-state refrigerator exploiting diffusion geometries and limiting interfacial conductances at temperatures below 1", "abstract": "Solid-state refrigerators using Normal-metal/Insulator/Superconductor (NIS) junctions have previously demonstrated excellent electron cooling but limited ability to cool phonons. The energy gap of the superconductor is used as an energy filter to allow higher than average energy electrons to preferentially tunnel from the normal-metal through the insulator into the superconductor where they travel as quasi-particles. Typically, the heat is moved and work is done to deposit hot quasi-particles into a normal-metal quasi-particle trap for rejection to the next refrigeration stage. Realizing that (1) the quasi-particles flow diffusively, driven by a concentration gradient in the electric field-free superconductor, and (2) that the undesirable backwards leaking of heat from the hot-side trap can be reduced by engineering the geometry and materials at the superconductor-to-trap interface, enhanced cooling can be achieved. Fabrication of the refrigerator was accomplished using a tungsten and titanium-tungsten alloy as the cold-side normal-metal, aluminum oxide as the insulator, aluminum as the superconductor, and gold as the trap, with the cold-side NIS portion being attached to the hot-side gold trap by bump bonding. The refrigerator consisted of 1121 junction pairs, each pair being an SINIS unit, all electrically connected in series. Using this we have measured the effective phonon temperature of a 3.9 mm x 3.9 mm x 0.65 mm silicon chip driven down to 70 mK from a bath temperature of 120 mK, and down to 174 mK from a 271 mK rejection temperature (a cooling of -97 mK). This is the first demonstration of the sub 1 K cooling of an entire silicon chip using NIS junctions.", "url": "https://arxiv.org/abs/2608.17125", "type": "理论", "summary": "使用普通金属/绝缘体/超导体（NIS）结的固态制冷机此前已表现出出色的电子冷却能力，但冷却声子的能力有限。超导体的能隙被用作能量过滤器，以允许高于平均能量的电子优先从普通金属穿过绝缘体进入超导体，在那里它们作为准粒子行进。通常，热量被移动并做功以将热准粒子沉积到普通金属准粒子捕集器中，以便被拒绝到下一个制冷阶段。认识到（1）准粒子在无电场超导体中的浓度梯度驱动下扩散流动，以及（2）通过设计超导体与陷阱界面处的几何结构和材料可以减少从热侧陷阱产生的不良热量向后泄漏，从而可以实现增强冷却。\n\n制冷机的制造是使用钨和钛钨合金作为冷侧普通金属，氧化铝作为绝缘体，铝作为超导体，金作为陷阱，冷侧NIS部分通过凸块接合连接到热侧金陷阱。该冰箱由 1121 个结对组成，每对都是一个 SINIS 单元，全部串联电气连接。使用此方法，我们测量了 3.9 mm x 3.9 mm x 0.65 mm 硅芯片的有效声子温度，该硅芯片从 120 mK 的浴温降至 70 mK，并从 271 mK 抑制温度（-97 mK 冷却）降至 174 mK。这是首次演示使用 NIS 结对整个硅芯片进行低于 1 K 的冷却。", "authors": [{"name": "Northrop Grumman Microelectronics Design"}, {"name": "Applications Team"}, {"name": "Robert M. Young"}, {"name": "Zachary Stegen"}, {"name": "John X. Przybysz"}, {"name": "Edward R. Engbrecht"}, {"name": "Aaron A. Hathaway"}, {"name": "Justin C. Hackley"}, {"name": "Kirby B. Myers"}, {"name": "Christian C. Thorpe"}, {"name": "Aurelius L. Graninger"}, {"name": "Robert Miller"}, {"name": "Diego A. Morales"}, {"name": "Roberto D. Carcamo"}, {"name": "Glen Walters"}, {"name": "Jeric P. Sarad"}, {"name": "Nicholas F. Pleim"}, {"name": "Seth Whitsitt"}, {"name": "Joshua T. Shipman"}, {"name": "Anil Erol"}, {"name": "Melissa G. Loving"}, {"name": "Evan Donohue"}, {"name": "Corey A. Kegerreis"}, {"name": "Benjamin Dalfort"}, {"name": "Moe S. Khalil"}, {"name": "Christopher Pinion"}, {"name": "Randi Jaramillo"}, {"name": "John Milinichik"}, {"name": "Sandro J. Di Giacomo"}, {"name": "Thomas Zodda"}, {"name": "Nilesh Tralshawala"}, {"name": "Gregory R. Boyd"}, {"name": "Jonathan M. Cochran"}, {"name": "Katherine A. Maddock"}, {"name": "Michael P. De Feo"}, {"name": "Aaron A.Pesetski"}, {"name": "Marc E. Sherwin"}], "featured_authors": [{"name": "Northrop Grumman Microelectronics Design"}, {"name": "Applications Team"}, {"name": "Robert M. Young"}, {"name": "Michael P. De Feo"}, {"name": "Aaron A.Pesetski"}, {"name": "Marc E. Sherwin"}], "author_count": 37}, {"id": "2608.17149", "category": "cond-mat", "title": "Temperature-Induced Reorganization of Supported Zn$_3$ Clusters on Cu(111): From Minimum-Energy Structures to Finite-Temperature Ensembles", "abstract": "Understanding the nature of catalytic active sites under reaction conditions remains a central challenge in heterogeneous catalysis. In industrial copper/zinc oxide/alumina catalysts for methanol synthesis, small Zn-based species at the Cu interface have long been proposed as active-site candidates, yet their atomic-scale structure and stability remain controversial. Computational studies typically identify such species from optimized 0 K structures, assuming that minimum-energy configurations remain representative under reaction conditions. Here, we combine machine-learning-interatomic-potential-accelerated global optimization, molecular dynamics, and enhanced-sampling free-energy calculations to investigate supported Zn$_3$(OH)$_3$ and Zn$_3$(OH)$_2$CHOO clusters on Cu(111)-based surfaces from 0 to 450 K. While compact triangular configurations are generally favored among minimum-energy structures at 0 K, finite-temperature free-energy calculations reveal a pronounced shift toward extended linear configurations with increasing temperature. This transition is driven primarily by entropic stabilization and cannot be inferred from potential energies alone. Molecular dynamics further shows substantial cluster mobility on pristine Cu(111), indicating that long-term persistence depends not only on configurational stability but also on surface mobility. Surface Zn alloying strongly suppresses diffusion, thereby stabilizing isolated interfacial Zn species. Together, these results show that thermodynamically relevant structures of supported Zn-based clusters can differ fundamentally from static 0 K predictions because of competing enthalpic and entropic effects. Our findings highlight the limitations of identifying catalytic active sites solely from 0 K structures and underscore the importance of explicit finite-temperature sampling in catalyst modeling.", "url": "https://arxiv.org/abs/2608.17149", "type": "理论+数值", "summary": "了解反应条件下催化活性位点的性质仍然是多相催化的核心挑战。在用于甲醇合成的工业铜/氧化锌/氧化铝催化剂中，铜界面上的小锌基物质长期以来一直被认为是活性位点的候选者，但它们的原子尺度结构和稳定性仍然存在争议。计算研究通常从优化的 0 K 结构中识别此类物质，假设最小能量构型在反应条件下仍然具有代表性。在这里，我们结合机器学习原子间势加速全局优化、分子动力学和增强采样自由能计算来研究 0 至 450 K 的 Cu(111) 基表面上受支持的 Zn$_3$(OH)$_3$ 和 Zn$_3$(OH)$_2$CHOO 簇。虽然紧凑的三角形构型通常在 0 K 的最小能量结构中受到青睐，但有限温度自由能计算揭示了明显的随着温度的升高，向扩展线性构型转变。这种转变主要由熵稳定驱动，不能仅从势能推断。\n\n分子动力学进一步显示原始 Cu(111) 上具有显着的簇迁移率，表明长期持久性不仅取决于构型稳定性，还取决于表面迁移率。表面锌合金化强烈抑制扩散，从而稳定孤立的界面锌物种。总之，这些结果表明，由于竞争的焓和熵效应，支持的锌基团簇的热力学相关结构可能与静态 0 K 预测有根本不同。我们的研究结果强调了仅从 0 K 结构识别催化活性位点的局限性，并强调了催化剂建模中显式有限温度采样的重要性。", "authors": [{"name": "Jiayan Xu"}, {"name": "Zheng Yu"}, {"name": "Abhirup Patra"}, {"name": "Amar Deep Pathak"}, {"name": "Sharan Shetty"}, {"name": "Detlef Hohl"}, {"name": "Roberto Car"}], "featured_authors": [{"name": "Jiayan Xu"}, {"name": "Zheng Yu"}, {"name": "Abhirup Patra"}, {"name": "Sharan Shetty"}, {"name": "Detlef Hohl"}, {"name": "Roberto Car"}], "author_count": 7}, {"id": "2608.17200", "category": "cond-mat", "title": "Discovery of novel magnetic Y-Mn-B compounds via advanced machine learning guided framework", "abstract": "Rare-earth transition-metal borides offer critical structural motifs for permanent-magnet design; however, the manganese-rich regions within these compositional phase spaces remain largely unexplored. In this work, we develop an advanced machine-learning-assisted discovery framework to explore Y-Mn-B ternary system. Starting from over one million hypothetical structures generated from known structures in databases, we filtered promising candidates by first applying graph neural networks to predict material stability, then using machine-learning-interatomic-potential to relax their structures, and finally validating the results with first-principles calculations. We identify 5 stable and near-stable Y-Mn-B phases along with 61 metastable compounds with the formation energy within 100 meV/atom with respect to the ternary convex hull. Among them, Y2Mn7B7 and YMn4B4 are structurally analogous to the previously synthesized $R_{1+\\epsilon}Fe_4B_4$ 1D incommensurate composite chain compounds. In striking contrast to the strongly suppressed Fe moments reported, our first-principles calculations reveal that the predicted Mn-chain phases preserve sizable local Mn moments (approximately 1.1 $\\mu_B$) and favored ferromagnetic ordering. Electronic structure analyses elucidate the microscopic origin of moment recovery via an enhanced exchange splitting driven by a Stoner-like instability. We also perform systematic Mn-Fe substitution to confirm the thermodynamic continuity and a monotonic enhancement of the macroscopic magnetization, from Fe to Mn. These findings indicate that targeted transition-metal substitution within a one-dimensional boride family can recover transition-metal magnetism, offering a physically interpretable route for designing new magnetic rare-earth transition-metal borides.", "url": "https://arxiv.org/abs/2608.17200", "type": "理论+数值", "summary": "稀土过渡金属硼化物为永磁体设计提供了关键的结构图案；然而，这些组成相空间内的富锰区域在很大程度上仍未被探索。在这项工作中，我们开发了一种先进的机器学习辅助发现框架来探索 Y-Mn-B 三元系统。从数据库中已知结构生成的超过一百万个假设结构开始，我们首先应用图神经网络来预测材料稳定性，然后使用机器学习原子间势来松弛其结构，最后通过第一性原理计算验证结果，从而筛选出有前途的候选结构。我们确定了 5 种稳定和近稳定的 Y-Mn-B 相以及 61 种亚稳态化合物，相对于三元凸包，其形成能在 100 meV/原子以内。其中，Y2Mn7B7和YMn4B4在结构上类似于先前合成的$R_{1+\\epsilon}Fe_4B_4$一维不通约复合链化合物。\n\n与报告的强烈抑制的 Fe 矩形成鲜明对比，我们的第一性原理计算表明，预测的 Mn 链相保留了相当大的局部 Mn 矩（大约 1.1 $\\mu_B$）并有利于铁磁有序。电子结构分析通过类斯托纳不稳定性驱动的增强交换分裂阐明了力矩恢复的微观起源。我们还进行了系统的 Mn-Fe 替代，以确认从 Fe 到 Mn 的热力学连续性和宏观磁化强度的单调增强。这些发现表明，在一维硼化物家族中进行有针对性的过渡金属取代可以恢复过渡金属的磁性，为设计新的磁性稀土过渡金属硼化物提供了一条物理上可解释的途径。", "authors": [{"name": "Weiyi Xia"}, {"name": "Wei Shen Tee"}, {"name": "Maxim Moraru"}, {"name": "Ying Wai Li"}, {"name": "Cai-Zhuang Wang"}], "featured_authors": [{"name": "Weiyi Xia"}, {"name": "Wei Shen Tee"}, {"name": "Maxim Moraru"}, {"name": "Ying Wai Li"}, {"name": "Cai-Zhuang Wang"}], "author_count": 5}, {"id": "2608.17225", "category": "cond-mat", "title": "Windmill Spin Dynamics and Its Induced Anomalous Hall Effect in Noncollinear Antiferromagnet Mn3Sn", "abstract": "We demonstrate that the spin dynamics of the noncollinear antiferromagnet Mn\\textsubscript{3}Sn possesses a special soft eigen mode, which starts as a small-angle oscillation and eventually develops into a large-angle, windmill-type precession, when the canting angle surpasses a threshold value determined by the bending of the spin order. Such windmill precession possesses a unique chiral direction of motion, which can be sensed by electrons, producing a Berry curvature through the Berry connection polarizability in the mixed parameter space. Such Berry curvature can then yield a characteristic static anomalous Hall effect during windmill precession, even though the anomalous Hall effect from the equilibrium spin order vanishes. Our work reveals rich dynamical information in noncollinear antiferromagnets.", "url": "https://arxiv.org/abs/2608.17225", "type": "理论", "summary": "我们证明了非共线反铁磁体 Mn\\textsubscript{3}Sn 的自旋动力学具有特殊的软本征模式，当倾斜角度超过由自旋顺序弯曲确定的阈值时，该模式以小角度振荡开始，最终发展为大角度、风​​车式进动。这种风车进动具有独特的手性运动方向，可以被电子感知，通过混合参数空间中的贝里连接极化率产生贝里曲率。这样的贝里曲率可以在风车进动期间产生特征静态反常霍尔效应，即使来自平衡自旋级的反常霍尔效应消失。我们的工作揭示了非共线反铁磁体中丰富的动力学信息。", "authors": [{"name": "Jikun Zhou"}, {"name": "Yang Gao"}, {"name": "Qian Niu"}], "featured_authors": [{"name": "Jikun Zhou"}, {"name": "Yang Gao"}, {"name": "Qian Niu"}], "author_count": 3}, {"id": "2608.17229", "category": "cond-mat", "title": "Incidence-based random walks on simplicial complexes", "abstract": "We introduce an incidence-based random walk on the edges of a random two-dimensional simplicial complex with a complete $1$-skeleton and independently retained triangular faces. The dynamics combine two transport channels, one mediated by vertices and the other by triangular faces, through an effective transition operator controlled by a mixing parameter $q$. This construction isolates the effects of higher-order connectivity without modifying the underlying pairwise support of the walk. We characterize the model through structural observables, spectral relaxation, stationary localization, and first-passage transport. Our results show that partial face retention generates heterogeneous higher-order connectivity, giving rise to a pronounced transport bottleneck at intermediate face densities. In this regime, the second-largest eigenvalue modulus, the inverse participation ratio of the stationary distribution, and the mean first-passage time all exhibit non-monotonic behavior, reaching their largest values at intermediate face densities. The corresponding first-passage-time distributions reveal an enhanced probability of unusually long trajectories. Together, these results establish a simple framework for investigating how heterogeneous higher-order connectivity reshapes spectral and transport properties beyond pairwise network dynamics.", "url": "https://arxiv.org/abs/2608.17229", "type": "理论", "summary": "我们在随机二维单纯复形的边缘上引入基于关联的随机游走，该复形具有完整的 $1$ 骨架和独立保留的三角形面。动力学通过由混合参数 $q$ 控制的有效转换算子结合了两个传输通道，一个由顶点介导，另一个由三角形面介导。这种结构隔离了高阶连接的影响，而不修改步行的底层成对支持。我们通过结构可观测值、谱弛豫、稳态定位和首通道传输来表征该模型。我们的结果表明，部分面保留会产生异构高阶连接，从而在中间面密度处产生明显的传输瓶颈。在这种情况下，第二大特征值模量、平稳分布的逆参与比和平均首次通过时间都表现出非单调行为，在中间面密度处达到最大值。相应的首次通过时间分布揭示了异常长轨迹的概率增加。\n\n这些结果共同建立了一个简单的框架，用于研究异构高阶连接如何重塑成对网络动力学之外的光谱和传输特性。", "authors": [{"name": "C.T. Martínez-Martínez"}, {"name": "Francisco J. Sevilla"}], "featured_authors": [{"name": "C.T. Martínez-Martínez"}, {"name": "Francisco J. Sevilla"}], "author_count": 2}, {"id": "2608.17308", "category": "cond-mat", "title": "Spontaneous symmetry-breaking in equilibrium tree-packing configurations of a kinetically constrained cubic-lattice system", "abstract": "We explore kinetic-constraint induced thermodynamic phase transition in the cubic lattice, employing the Fredrikson-Anderson spin model with hyperparameter $K=2$ as a representative kinetic system. Each lattice site may flip its binary occupation state if at most one of its six nearest neighbors is currently occupied. The whole set of microscopic configurations that are kinetically connected with the fully empty one is described by an equilibrium partition function with a single global constraint, that is, the occupied sites do not form closed loops but instead organize into different tree components in the lattice. We discover a continuous thermodynamic gas--crystal phase transition in the cubic system and determine the critical chemical potential $\\mu^* \\approx -3.252$, at which the occupied sites of the equilibrium tree-packing configurations start to prefer one of the two nested cubic sublattices. This thermodynamic phase transition is absent in the two-dimensional square lattice.", "url": "https://arxiv.org/abs/2608.17308", "type": "理论", "summary": "我们采用超参数 $K=2$ 的 Fredrikson-Anderson 自旋模型作为代表性动力学系统，探索立方晶格中的动力学约束引起的热力学相变。如果每个格点的六个最近邻居中最多有一个当前被占用，则每个格点可以翻转其二元占用状态。与完全空的结构在动力学上连接的整套微观结构由具有单一全局约束的平衡配分函数来描述，即，占据的位点不形成闭环，而是组织成晶格中的不同树组件。我们发现立方系统中存在连续的热力学气体-晶体相变，并确定了临界化学势 $\\mu^* \\approx -3.252$，此时平衡树堆积构型的占据位点开始优先选择两个嵌套立方亚晶格之一。这种热力学相变在二维方形晶格中不存在。", "authors": [{"name": "Hai-Jun Zhou"}], "featured_authors": [{"name": "Hai-Jun Zhou"}], "author_count": 1}, {"id": "2608.17359", "category": "cond-mat", "title": "Resonant Untrapping of Active Polymers in Breathing Lattices", "abstract": "In crowded environments, active polymers can trap themselves by winding into long-lived conformations. We show that fluctuations of the surrounding confinement can resonantly accelerate escape from these self-generated traps. Brownian dynamics simulations of a driven semiflexible chain in a breathing obstacle lattice reveal intermittent switching between a compact rotating spiral and an extended translating state. Long-time diffusion increases by up to two orders of magnitude when the environmental fluctuation rate becomes comparable to the spiral's intrinsic relaxation rate. The enhancement persists under stochastic fluctuations, showing that coherent periodic forcing is not required. Activity creates a second optimum: it promotes escape once favorable conformations form, yet at strong drive stabilizes the spiral and suppresses their formation. Resonant untrapping thus provides a general mechanism by which fluctuating environments regulate transport through barriers generated by internal conformational dynamics.", "url": "https://arxiv.org/abs/2608.17359", "type": "数值", "summary": "在拥挤的环境中，活性聚合物可以通过缠绕成长寿命的构象来捕获自身。我们表明，周围限制的波动可以共振地加速逃离这些自生陷阱。呼吸障碍晶格中驱动半柔性链的布朗动力学模拟揭示了紧凑旋转螺旋和扩展平移状态之间的间歇切换。当环境波动率与螺旋的固有弛豫率相当时，长时间扩散会增加两个数量级。这种增强在随机波动下持续存在，表明不需要相干周期性强迫。活动创造了第二个最佳状态：一旦形成有利的构象，它就会促进逃逸，但在强驱动下，它会稳定螺旋并抑制其形成。因此，共振解捕获提供了一种通用机制，波动的环境通过该机制调节通过内部构象动力学产生的屏障的运输。", "authors": [{"name": "Yihang Sun"}, {"name": "Yixiang Li"}, {"name": "Tsvi Tlusty"}, {"name": "Guolong Zhu"}], "featured_authors": [{"name": "Yihang Sun"}, {"name": "Yixiang Li"}, {"name": "Tsvi Tlusty"}, {"name": "Guolong Zhu"}], "author_count": 4}, {"id": "2608.17408", "category": "cond-mat", "title": "Giant Bandgap Pulsation Driven by Hotspot Breathing Phonons in a Flat-Band Solid", "abstract": "The electronic bandgap of solids is conventionally viewed as a static property at a given temperature, with only weak and stochastic thermal fluctuations under equilibrium conditions. Here, using ab initio molecular dynamics and first-principles electron-phonon calculations, we reveal a pronounced room-temperature bandgap pulsation at about 7.8 THz in a perovskite-like flat-band solid, with a maximum peak-to-peak variation approaching 0.95 eV. This behavior originates from a dual selection mechanism: the A1g-like breathing branch couples much more strongly to the flat conduction-band edge than other phonon branches, while real-space phase selectivity distinguishes its hotspot gamma-point and finite-q components. Although finite-q modes retain appreciable microscopic coupling, their intercell phase shifts produce smaller-amplitude shorter-recurrence-period responses, leaving the unit-cell-synchronous gamma-point A1g component to dominate the fundamental-period bandgap pulsation. The resulting band-edge dynamics further modulates the optical response on femtosecond timescales. These findings demonstrate that an unexpectedly ordered electronic response can emerge from intrinsically disordered thermal lattice fluctuations.", "url": "https://arxiv.org/abs/2608.17408", "type": "理论+数值", "summary": "固体的电子带隙通常被视为给定温度下的静态特性，在平衡条件下仅具有微弱且随机的热波动。在这里，利用从头算分子动力学和第一原理电子声子计算，我们揭示了类钙钛矿平带固体中约 7.8 THz 的明显室温带隙脉动，最大峰峰值变化接近 0.95 eV。这种行为源于双重选择机制：与其他声子分支相比，类 A1g 呼吸分支与平坦导带边缘的耦合更强，而实空间相位选择性区分其热点伽马点和有限 q 分量。尽管有限 q 模式保留了明显的微观耦合，但它们的单元间相移会产生较小幅度的较短重复周期响应，从而使单位单元同步伽马点 A1g 分量主导基本周期带隙脉动。由此产生的带边动力学进一步调制飞秒时间尺度上的光学响应。\n\n这些发现表明，本质上无序的热晶格涨落可能会出现意想不到的有序电子响应。", "authors": [{"name": "Wenjie Liu"}, {"name": "Huaxin Wu"}, {"name": "Jiyang Fan"}], "featured_authors": [{"name": "Wenjie Liu"}, {"name": "Huaxin Wu"}, {"name": "Jiyang Fan"}], "author_count": 3}, {"id": "2608.17428", "category": "cond-mat", "title": "Flat band and Bulk-Boundary correspondence in a non-Hermitian trimerized lattice model with generic boundary conditions", "abstract": "We consider a Su-Schrieffer-Heeger(SSH)-type trimer model with next-nearest-neighbor(NNN) interaction and balanced loss-gain(BLG) to study the combined effect of lattice symmetries, topology, non-hermiticity and general boundary conditions(GBC)on the existence of flat band and the nature of Bulk-Boundary correspondence(BBC). We derive the necessary and sufficient conditions for the existence of an entirely real spectrum under the periodic boundary condition(PBC). The exact expressions for the compact localized states(CLS) and energy eigenvalues corresponding to flat bands are derived analytically under the PBC. We establish topological phase transitions(TPT) for PT-symmetry and pseudo-chiral symmetry through the computation of the Zak phase and sub-lattice Zak phase, respectively. The Hamiltonian under the open boundary condition(OBC) is studied numerically, and edge states are observed in the topologically non-trivial phase, thereby establishing the non-hermitian BBC. The CLS exists in both bulk and the boundary for systems having only pseudo-chiral symmetry, and an additional PT-symmetry destroys the CLS at the boundary. We generalize a known formalism to study the same Hamiltonian under GBC, and derive analytic expressions for the energy and eigenstates for a class of boundary conditions in parametric ranges which admit flat band under the PBC. The edge states for these boundary conditions, including the OBC, are obtained analytically in the topologically non-trivial phase, thereby establishing BBC. The non-hermitian skin effect(NHSE) is seen in the model with reciprocal bulk interaction and strongly non-reciprocal boundary terms. The winding number based on spectral topology is computed analytically.", "url": "https://arxiv.org/abs/2608.17428", "type": "理论+数值", "summary": "我们考虑具有次近邻（NNN）相互作用和平衡损失增益（BLG）的Su-Schrieffer-Heeger（SSH）型三聚体模型来研究晶格对称性、拓扑、非厄尔密性和一般边界条件（GBC）对平带存在性和体边界对应（BBC）性质的综合影响。推导了周期边界条件（PBC）下全实谱存在的充要条件。在PBC下解析推导了紧定域态（CLS）和平带对应的能量特征值的精确表达式。我们分别通过计算 Zak 相和亚晶格 Zak 相，建立了 PT 对称性和伪手性对称性的拓扑相变（TPT）。对开放边界条件（OBC）下的哈密顿量进行数值研究，观察拓扑非平凡相中的边缘态，从而建立非埃尔米特BBC。对于仅具有伪手性对称性的系统，CLS 存在于体积和边界中，而额外的 PT 对称性会破坏边界处的 CLS。\n\n我们推广了一种已知的形式主义来研究 GBC 下的相同哈密顿量，并导出 PBC 下允许平带的参数范围内的一类边界条件的能量和本征态的解析表达式。这些边界条件的边缘状态（包括 OBC）是在拓扑非平凡相中通过分析获得的，从而建立 BBC。在具有互易体相互作用和强非互易边界项的模型中可以看到非厄米趋肤效应（NHSE）。解析计算基于谱拓扑的绕数。", "authors": [{"name": "Supriyo Ghosh"}, {"name": "Pijush K. Ghosh"}, {"name": "Shreekantha Sil"}], "featured_authors": [{"name": "Supriyo Ghosh"}, {"name": "Pijush K. Ghosh"}, {"name": "Shreekantha Sil"}], "author_count": 3}, {"id": "2608.17461", "category": "cond-mat", "title": "Intra-atomic magnetic octupoles and their coupling to cluster magnetic octupoles in Chiral antiferromagnets Mn$_3$Sn", "abstract": "We demonstrate that Mn$_3$Sn hosts finite intra-atomic magnetic octupoles (AMOs) $\\mathbf{o}$ in addition to the well-established cluster magnetic octupole (CMO) $\\mathbf{O}$. In contrast to the cluster-scale CMO, the AMO is a site-localized magnetic multipole associated with the anisotropic intra-atomic spin density. Symmetry analysis shows that the CMO and AMO transform in the same representation, allowing a bilinear interaction of the form $-g\\,\\mathbf{O}\\cdot\\mathbf{o}$. Using first-principles calculations, we confirm the presence of finite AMO densities and show that the AMO transforms concomitantly with the CMO under rotations of the noncollinear magnetic structure, providing microscopic evidence for the coupling between them. We further show that the magnetic band splitting can be represented by projected AMO operators, with manifold-dependent effective octupolar exchange coefficients in realistic Mn$_3$Sn. The presence of AMOs has three important implications. First, we show that the nonrelativistic spin splitting of Mn$_3$Sn can be described in terms of projected AMO operators, with manifold-dependent effective octupolar exchange coefficients, establishing the AMO as a microscopic operator underlying the spin splitting. Second, the AMO reveals a close connection between Mn$_3$Sn and $d$-wave altermagnets from the magnetic-octupole perspective. Third, the $\\mathbf{O}\\cdot\\mathbf{o}$ coupling suggests a new route to manipulate the CMO using AMO currents, opening a direction for controlling the multipolar order in Mn$_3$Sn.", "url": "https://arxiv.org/abs/2608.17461", "type": "理论+数值", "summary": "我们证明，除了成熟的簇磁八极子（CMO）$\\mathbf{O}$之外，Mn$_3$Sn还拥有有限的原子内磁八极子（AMO）$\\mathbf{o}$。与团簇尺度的 CMO 相比，AMO 是与各向异性原子内自旋密度相关的位点局部磁多极子。对称分析表明，CMO 和 AMO 以相同的表示形式进行变换，从而允许 $-g\\,\\mathbf{O}\\cdot\\mathbf{o}$ 形式的双线性相互作用。利用第一性原理计算，我们确认了有限AMO密度的存在，并表明在非共线磁结构的旋转下，AMO与CMO伴随变换，为它们之间的耦合提供了微观证据。我们进一步表明，磁带分裂可以用投影 AMO 算子来表示，在现实的 Mn$_3$Sn 中具有流形相关的有效八极交换系数。 AMO 的存在具有三个重要影响。\n\n首先，我们证明 Mn$_3$Sn 的非相对论性自旋分裂可以用投影 AMO 算子来描述，具有流形相关的有效八极交换系数，将 AMO 确立为自旋分裂背后的微观算子。其次，AMO 从磁八极子角度揭示了 Mn$_3$Sn 和 $d$ 波交流磁体之间的密切联系。第三，$\\mathbf{O}\\cdot\\mathbf{o}$耦合提出了一种利用AMO电流操纵CMO的新途径，为控制Mn$_3$Sn中的多极有序开辟了方向。", "authors": [{"name": "Dohoon Park"}, {"name": "Seungyun Han"}, {"name": "Hyun-Woo Lee"}], "featured_authors": [{"name": "Dohoon Park"}, {"name": "Seungyun Han"}, {"name": "Hyun-Woo Lee"}], "author_count": 3}, {"id": "2608.17473", "category": "cond-mat", "title": "Universal quantum corrections of two-body correlation in a weakly interspecies interacting binary Bose mixture", "abstract": "We investigate universal quantum corrections to two-body correlations in a zero-temperature binary Bose mixture using the Cornwall-Jackiw-Tomboulis two-particle-irreducible effective action formalism. In the weak interspecies-coupling regime, a saddle-point treatment based on Hubbard-Stratonovich transformations can be combined with a two-loop expansion and a gapless Hartree-Fock correction, thereby preserving the Goldstone theorem and reducing the coupled two-component problem to two analytically solvable single-component theories. Within this framework, we derive the ground-state energy density as a low-density expansion in the gas parameter, together with the quantum depletion and chemical potentials. The results exhibit a simple mapping to the single-component case: the universal quantum corrections of the mixture are obtained by evaluating the known single-component series at an effective scattering length $a_{\\sigma\\sigma}-a_{12}$ for each species, where $a_{\\sigma\\sigma}$ and $a_{12}$ are the intra- and interspecies $s$-wave scattering lengths. This reproduces Petrov's equation of state at one-loop order in the weak-coupling limit and yields beyond-Lee-Huang-Yang corrections at two-loop order. We also analyze the role of mass imbalance, which enters the energy density through the exact rescaling factor $(1+m_{1}/m_{2})/2$.", "url": "https://arxiv.org/abs/2608.17473", "type": "理论+数值", "summary": "我们使用 Cornwall-Jackiw-Tomboulis 双粒子不可约有效作用形式主义研究零温二元玻色混合物中两体相关性的通用量子校正。在弱种间耦合机制中，基于 Hubbard-Stratonovich 变换的鞍点处理可以与双环展开和无间隙 Hartree-Fock 校正相结合，从而保留 Goldstone 定理并将耦合的二分量问题简化为两个可分析求解的单分量理论。在这个框架内，我们将基态能量密度导出为气体参数的低密度膨胀，以及量子耗尽和化学势。结果显示了到单组分情况的简单映射：混合物的通用量子校正是通过评估每个物种的有效散射长度 $a_{\\sigma\\sigma}-a_{12}$ 下的已知单组分系列来获得的，其中 $a_{\\sigma\\sigma}$ 和 $a_{12}$ 是物种内和物种间 $s$ 波散射长度。\n\n这在弱耦合极限的单环阶上重现了 Petrov 的状态方程，并在两环阶上产生了超越 Lee-Huang-Yang 的修正。我们还分析了质量不平衡的作用，它通过精确的缩放因子 $(1+m_{1}/m_{2})/2$ 进入能量密度。", "authors": [{"name": "Rui-Yan Chen"}, {"name": "Zhaoxin Liang"}, {"name": "Gao Xianlong"}], "featured_authors": [{"name": "Rui-Yan Chen"}, {"name": "Zhaoxin Liang"}, {"name": "Gao Xianlong"}], "author_count": 3}, {"id": "2608.17505", "category": "cond-mat", "title": "Unconventional Pressure Evolution of Spin-Density-Wave State in La$_{3}$Ni$_{2}$O$_{7}$", "abstract": "The discovery of pressure-induced high temperature superconductivity in the bilayer nickelate La$_{3}$Ni$_{2}$O$_{7}$ has raised the question of how its spin-density-wave (SDW) state evolves toward the superconducting regime. Here, we report a systematic electronic Raman study of La$_{3}$Ni$_{2}$O$_{7}$ single crystals under hydrostatic pressures up to 16.51 GPa. Both the SDW gap energy and the transition temperature $T_{\\mathrm{SDW}}$ show an overall increase with pressure, while the dimensionless coupling ratio 2$\\Delta_{\\text{SDW}}/(k_{\\text{B}}T_{\\text{SDW}})$ remains constant around $\\sim7.5$, indicating a robust strong-coupling character of SDW state. At the same time, the Raman SDW peak broadens as pressure is applied, indicating a gradual weakening of long-range SDW order. These results reveal an unusual pressure evolution in which the SDW energy scale is enhanced while the SDW state becomes progressively less coherent, providing spectroscopic constraints on the magnetic correlations relevant to superconductivity in bilayer nickelates.", "url": "https://arxiv.org/abs/2608.17505", "type": "理论", "summary": "双层镍酸盐 La$_{3}$Ni$_{2}$O$_{7}$ 中压力诱导的高温超导性的发现提出了其自旋密度波 (SDW) 态如何向超导状态演化的问题。在这里，我们报告了在高达 16.51 GPa 的静水压力下对 La$_{3}$Ni$_{2}$O$_{7}$ 单晶进行的系统电子拉曼研究。 SDW能隙能和转变温度$T_{\\mathrm{SDW}}$均随压力的增加而整体增加，而无量纲耦合比2$\\Delta_{\\text{SDW}}/(k_{\\text{B}}T_{\\text{SDW}})$在$\\sim7.5$附近保持恒定，表明SDW态具有鲁棒的强耦合特征。同时，拉曼 SDW 峰随着压力的施加而变宽，表明长程 SDW 有序性逐渐减弱。这些结果揭示了一种不寻常的压力演化，其中 SDW 能量尺度增强，而 SDW 状态逐渐变得不相干，为与双层镍酸盐超导性相关的磁关联提供了光谱约束。", "authors": [{"name": "Xiaoxiang Zhou"}, {"name": "Shiyu Xie"}, {"name": "Liangxin Qiao"}, {"name": "Hengyuan Zhang"}, {"name": "Jun Shu"}, {"name": "Rui Liu"}, {"name": "Mengwu Huo"}, {"name": "Deyuan Hu"}, {"name": "Hengjie Liu"}, {"name": "Chuansheng Hu"}, {"name": "Yilin Wang"}, {"name": "Ge He"}, {"name": "Zeming Qi"}, {"name": "Meng Wang"}, {"name": "Dong-Lai Feng"}, {"name": "Zengyi Du"}], "featured_authors": [{"name": "Xiaoxiang Zhou"}, {"name": "Shiyu Xie"}, {"name": "Liangxin Qiao"}, {"name": "Meng Wang"}, {"name": "Dong-Lai Feng"}, {"name": "Zengyi Du"}], "author_count": 16}, {"id": "2608.17511", "category": "cond-mat", "title": "Conditional-path Monte Carlo for rare stochastic dynamics on networks: Details and derivations", "abstract": "The simulation of rare macroscopic events in stochastic network dynamics, such as widespread epidemic outbreaks, cascading failures in communication networks, or the escape from metastable states in many-body systems, is severely hindered by methodological challenges like catastrophic rejection rates, weight degeneracy, genealogical correlations, and critical slowing down inherent to standard forward-time algorithms, splitting methods, and transition-path sampling. Conditional-path Monte Carlo (CPMC) overcomes these limitations by employing non-local Swendsen-Wang-like cluster updates that operate directly on full-system trajectories. Serving as the technical companion to [Sun, Moody, and Barthel, arXiv:2608.16171 ], this paper provides the rigorous mathematical foundations and algorithmic details underlying the CPMC framework. We formally define the joint path-graph probability weights and derive the transition and uniformization sum rules that guarantee detailed balance. Applying the framework to susceptible-infectious-susceptible (SIS) models, we systematically construct and optimize single-node and edge graph vertex sets specifically designed to prevent lock avalanches and maintain the structural mobility of the epidemic trunk. Furthermore, we detail a dynamic programming scheme to exactly implement complex boundary conditions - including patient-zero and macroscopic outbreak-size constraints - enabling the rejection-free generation of valid trajectories. Finally, we assess the computational complexity of the algorithm, describe parallelization strategies, and validate CPMC against exact solutions for dynamics on small networks.", "url": "https://arxiv.org/abs/2608.17511", "type": "理论+数值", "summary": "随机网络动力学中罕见的宏观事件的模拟，例如广泛的流行病爆发、通信网络的级联故障或多体系统中的亚稳态逃逸，受到方法论挑战的严重阻碍，例如灾难性拒绝率、权重简并性、谱系相关性以及标准前向时间算法、分裂方法和转换路径采样固有的关键减速。条件路径蒙特卡罗 (CPMC) 通过采用直接在全系统轨迹上运行的非本地 Swendsen-Wang 式集群更新克服了这些限制。作为 [Sun、Moody 和 Barthel，arXiv:2608.16171] 的技术伴侣，本文提供了 CPMC 框架背后严格的数学基础和算法细节。我们正式定义联合路径图概率权重，并推导保证详细平衡的转换和均匀化总和规则。\n\n将该框架应用于易感-传染-易感（SIS）模型，我们系统地构建和优化单节点和边图顶点集，专门设计用于防止锁雪崩并保持流行树干的结构移动性。此外，我们详细介绍了一种动态编程方案，以精确实现复杂的边界条件（包括零患者和宏观爆发规模约束），从而能够无排斥地生成有效轨迹。最后，我们评估算法的计算复杂性，描述并行化策略，并根据小型网络动力学的精确解决方案验证 CPMC。", "authors": [{"name": "Thomas Barthel"}, {"name": "Jiazheng Sun"}, {"name": "Jhao-Hong Peng"}], "featured_authors": [{"name": "Thomas Barthel"}, {"name": "Jiazheng Sun"}, {"name": "Jhao-Hong Peng"}], "author_count": 3}, {"id": "2608.17527", "category": "cond-mat", "title": "Equilibrium and nonequlibrium scaling behaviors of localization transition in a non-Hermitian Aubry-André model with onsite gain and loss", "abstract": "The interplay between non-Hermiticity and localization has attracted considerable interest, yet the driven dynamics of localization transitions in non-Hermitian systems with on-site gain and loss remains largely unexplored. Here we investigate the critical scaling behavior and driven dynamics of the non-Hermitian Aubry-André (AA) model with on-site gain and loss. Through finite-size scaling analyses of the localization length, the inverse participation ratio (IPR), and the energy gap, we extract the critical exponents $\\nu = 1.00(2)$, $s = 0.7965(2)$, and $z = 1.999(2)$. These exponents are different from those of both the Hermitian AA model and the nonreciprocal hopping AA model, particularly the IPR exponent $s$, demonstrating that the gain-loss mechanism belongs to a distinct universality class. For the driven dynamics, we focus on the case where the system is initially prepared in a gapless extended state and linearly driven across the critical point. We verify that the finite-time scaling (FTS) framework remains applicable provided that the criterion $z' < r$ is satisfied, where $z' = 1.999(2)$ characterizes the gap closure in the extended phase and $r = z + 1/\\nu \\approx 2.999$. The predicted FTS scaling forms for the IPR are numerically validated across a wide range of system sizes and driving rates, demonstrating that the unified scaling description can be successfully generalized to the gain-loss type non-Hermitian AA model. Our work not only establishes the gain-loss AA model as a new universality class of localization transitions but also extends the applicability of the FTS framework to non-Hermitian systems with gapless initial states.", "url": "https://arxiv.org/abs/2608.17527", "type": "理论+数值", "summary": "非厄米性和局域化之间的相互作用引起了人们的极大兴趣，但非厄米系统中局域化转变的驱动动态以及现场增益和损失仍然很大程度上未被探索。在这里，我们研究了具有现场增益和损耗的非厄米奥布里-安德烈 (AA) 模型的临界缩放行为和驱动动态。通过对局域长度、逆参与比（IPR）和能隙的有限尺寸尺度分析，我们提取了临界指数$\\nu = 1.00(2)$、$s = 0.7965(2)$和$z = 1.999(2)$。这些指数不同于 Hermitian AA 模型和非互易跳跃 AA 模型，特别是 IPR 指数 $s$，表明增益-损失机制属于不同的普遍性类别。对于驱动动力学，我们关注系统最初准备在无间隙扩展状态并线性驱动穿过临界点的情况。\n\n我们验证了有限时间缩放（FTS）框架仍然适用，前提是满足标准 $z' < r$，其中 $z' = 1.999(2)$ 表征扩展阶段的间隙闭合，$r = z + 1/\\nu \\approx 2.999$。 IPR 预测的 FTS 标度形式在各种系统尺寸和驱动速率下进行了数值验证，表明统一的标度描述可以成功推广到增益损失型非埃尔米特 AA 模型。我们的工作不仅将增益-损失 AA 模型建立为一种新的局部化转变的普遍性类别，而且还将 FTS 框架的适用性扩展到具有无间隙初始状态的非厄米系统。", "authors": [{"name": "Wen-Jing Yu"}, {"name": "Yue-Mei Sun"}, {"name": "Xin-Yu Wang"}, {"name": "Liang-Jun Zhai"}], "featured_authors": [{"name": "Wen-Jing Yu"}, {"name": "Yue-Mei Sun"}, {"name": "Xin-Yu Wang"}, {"name": "Liang-Jun Zhai"}], "author_count": 4}, {"id": "2608.17548", "category": "cond-mat", "title": "Absence of nontrivial local conserved quantities in a class of $U(1)$-symmetric spin-1 chains", "abstract": "We prove the absence of nontrivial local conserved quantities in a class of $U(1)$-symmetric spin-$1$ chains with nearest-neighbor interactions in which some of the quadrupolar couplings vanish, a class that is not covered by previous studies. Applying the technique of Shiraishi to these systems, we show that, for every model in this class on a periodic chain of $N$ sites, there is no $k$-local conserved quantity for any $3\\le k\\le N/2$. In particular, for a frustration-free spin-$1$ chain that exhibits spontaneous $U(1)$ symmetry breaking at zero temperature in one spatial dimension, we prove that every local conserved quantity with support up to half of the system size is a linear combination of the identity, the total magnetization $S^z$, and the Hamiltonian itself. This rigorously establishes that, unlike the Heisenberg ferromagnet, the model admits no local order parameter commuting with the Hamiltonian, so that its continuous symmetry breaking is enabled by the frustration-free structure rather than by a conserved order parameter. We also prove the absence of $k$-local conserved quantities for $3\\le k\\le N/2$ in the periodic Motzkin chain, a frustration-free spin-$1$ chain closely related to the original Motzkin chain, for which spontaneous $U(1)$ symmetry breaking at zero temperature has also been reported.", "url": "https://arxiv.org/abs/2608.17548", "type": "理论", "summary": "我们证明了一类具有最近邻相互作用的 $U(1)$ 对称自旋 $1$ 链中不存在非平凡的局部守恒量，其中一些四极耦合消失，这一类未被以前的研究涵盖。将白石技术应用于这些系统，我们表明，对于 $N$ 位点周期链上的此类中的每个模型，对于任何 $3\\le k\\le N/2$ 不存在 $k$ 局部守恒量。特别是，对于在一个空间维度中零温度下表现出自发 $U(1)$ 对称破缺的无挫败自旋 $1$ 链，我们证明了支持高达系统大小一半的每个局部守恒量是恒等式、总磁化强度 $S^z$ 和哈密顿量本身的线性组合。这严格证明，与海森堡铁磁体不同，该模型不允许局部序参数与哈密顿量交换，因此其连续对称性破缺是通过无挫败结构而不是守恒序参数实现的。\n\n我们还证明了周期性 Motzkin 链中不存在 $3\\le k\\le N/2$ 的 $k$ 局部守恒量，这是一条与原始 Motzkin 链密切相关的无挫败自旋 $1$ 链，其中零温度下自发 $U(1)$ 对称性破缺也已被报道。", "authors": [{"name": "Shunsuke Sengoku"}, {"name": "Haruki Watanabe"}], "featured_authors": [{"name": "Shunsuke Sengoku"}, {"name": "Haruki Watanabe"}], "author_count": 2}, {"id": "2608.17602", "category": "cond-mat", "title": "KPZ scaling in one-dimensional arrays of photon condensates", "abstract": "Bose-Einstein condensates of photons in dye filled microcavities are known to feature many properties of the ideal bose gas at thermal equilibrium. Nevertheless, the finite photon life time renders them driven dissipative systems where losses are balanced by continuous driving by a pump laser. We show here with simulations based on a classical field model that their driven-dissipative nature causes their first order coherence to feature Kardar-Parisi-Zhang (KPZ) scaling, a phenomenon well known in the related condensates of exciton-polaritons. Remarkably, we find that the KPZ scaling even occurs in a regime with large density fluctuations. We discuss the modification of the scaling by the occupation of excited states and how to recover the universal scaling behavior by spectral filtering.", "url": "https://arxiv.org/abs/2608.17602", "type": "理论+数值", "summary": "众所周知，填充染料的微腔中光子的玻色-爱因斯坦凝聚体具有热平衡下理想玻色气体的许多特性。然而，有限的光子寿命使它们成为驱动耗散系统，其中损耗通过泵浦激光器的连续驱动来平衡。我们在这里通过基于经典场模型的模拟表明，它们的驱动耗散性质导致它们的一阶相干性具有卡达尔-帕里西-张（KPZ）标度的特征，这是激子极化子相关凝聚体中众所周知的现象。值得注意的是，我们发现 KPZ 缩放甚至发生在密度波动较大的区域。我们讨论了通过占据激发态来修改标度以及如何通过光谱过滤来恢复通用标度行为。", "authors": [{"name": "Michiel Yzewyn"}, {"name": "Michiel Wouters"}], "featured_authors": [{"name": "Michiel Yzewyn"}, {"name": "Michiel Wouters"}], "author_count": 2}, {"id": "2608.17627", "category": "cond-mat", "title": "Quantized Spin Hall Effect in Three-Dimensional Nodal-Ring Semimetal: Geometric Scaling and Symmetry-Engineered Spin Response", "abstract": "The anomalous Hall conductivity in magnetic Weyl semimetals scales linearly with the momentum separation between Weyl nodes, establishing a geometric paradigm for three-dimensional Hall responses. Here we discover an analogous phenomenon in the spin Hall effect: a quantized spin Hall conductivity (SHC) in nodal-ring semimetals that scales linearly with the nodal-ring radius $R$. From an ideal model with a single nodal ring, we derive analytically that the SHC inside the spin-orbit-coupled gap obeys $\\sigma_{\\alpha \\beta}^{S, 3D}=\\sigma_0^{S,2D} \\cdot (\\pi R/2 \\pi)$, where $\\sigma_0^{S,2D}=(e^2/h) \\cdot (\\hbar/2 e)$ is the two-dimensional quantum spin Hall conductance. Crucially, the symmetry of the spin-orbit coupling acts as an independent switch: Rashba coupling generates purely conventional SHC components, while Weyl coupling additionally activates unconventional ones, providing separate control over response magnitude and tensor symmetry. We validate this principle in yttrium nitride, where strain tunes $R$ and symmetry breaking toggles between response types. Our work establishes a new paradigm for engineering quantized geometric responses in three dimensions, opening pathways to tailored spin-orbit functionalities.", "url": "https://arxiv.org/abs/2608.17627", "type": "理论", "summary": "磁性外尔半金属中的反常霍尔电导率与外尔节点之间的动量分离成线性比例，从而建立了三维霍尔响应的几何范例。在这里，我们发现了自旋霍尔效应中的类似现象：节环半金属中的量子化自旋霍尔电导率（SHC）与节环半径 $R$ 呈线性比例。从单节环的理想模型，我们分析得出自旋轨道耦合间隙内的SHC服从$\\sigma_{\\alpha \\beta}^{S, 3D}=\\sigma_0^{S,2D} \\cdot (\\pi R/2 \\pi)$，其中$\\sigma_0^{S,2D}=(e^2/h) \\cdot (\\hbar/2 e)$是二维量子自旋霍尔电导。至关重要的是，自旋轨道耦合的对称性充当了一个独立的开关：Rashba 耦合产生纯粹的传统 SHC 分量，而 Weyl 耦合另外激活非常规分量，提供对响应幅度和张量对称性的单独控制。我们在氮化钇中验证了这一原理，其中应变调整 $R$ 并打破对称性在响应类型之间切换。\n\n我们的工作建立了三维工程量化几何响应的新范例，为定制自旋轨道功能开辟了途径。", "authors": [{"name": "Jiali Chen"}, {"name": "Chaoxi Cui"}, {"name": "Zhi-Ming Yu"}, {"name": "Wei Jiang"}, {"name": "Yugui Yao"}], "featured_authors": [{"name": "Jiali Chen"}, {"name": "Chaoxi Cui"}, {"name": "Zhi-Ming Yu"}, {"name": "Wei Jiang"}, {"name": "Yugui Yao"}], "author_count": 5}, {"id": "2608.17649", "category": "cond-mat", "title": "Long-range Nonlinear Sigma Model for a Singular Quantum Kicked Rotor", "abstract": "Singular kicked rotors have long been compared with power-law random banded matrices (PRBM) because their momentum-space Floquet matrix elements decay algebraically. However, it has remained unclear whether the deterministic correlations of the rotor become irrelevant at long distances and, consequently, under what conditions the two systems share the same infrared theory. To address this question, we derive a nonlocal supersymmetric nonlinear sigma model directly from a quantum kicked rotor with a power-law or logarithmic singularity. By carrying out the renormalization-group analysis up to two-loop order, we show that, after matching the symmetry class and coupling convention, the rotor reproduces the long-range Anderson transition of the corresponding PRBM, including its localized, critical, and extended infrared regimes.", "url": "https://arxiv.org/abs/2608.17649", "type": "理论", "summary": "奇异踢动转子长期以来一直与幂律随机带状矩阵 (PRBM) 进行比较，因为它们的动量空间 Floquet 矩阵元素会发生代数衰减。然而，目前尚不清楚转子的确定性相关性是否在长距离下变得无关紧要，因此，在什么条件下这两个系统共享相同的红外理论。为了解决这个问题，我们直接从具有幂律或对数奇点的量子踢动转子导出非局部超对称非线性西格玛模型。通过进行二环阶重整化群分析，我们表明，在匹配对称类和耦合约定后，转子再现了相应 PRBM 的长程安德森跃迁，包括其局域、临界和扩展红外区域。", "authors": [{"name": "Weitao Chen"}, {"name": "Yunxiang Liao"}], "featured_authors": [{"name": "Weitao Chen"}, {"name": "Yunxiang Liao"}], "author_count": 2}, {"id": "2608.17692", "category": "cond-mat", "title": "Effect of Convection Rolls in Motility-Induced Phase Separation of Active Janus Particles", "abstract": "We numerically study motility-induced phase separation of active particles in two-dimensional convection rolls. We analyse local packing-fraction distributions, density fluctuations, the corresponding phase diagrams, and diffusivity curves to characterise the interplay between self-propulsion, global packing fraction, and advection strength. In the weak-flow regime, the system exhibits phase separation characterised by bimodal density distributions, slowly decaying density fluctuations, and a sharp reduction in diffusivity. Increasing advection suppresses clustering by enhancing particle transport and reducing trapping, leading to a shift in the critical self-propulsion velocity for motility-induced phase separation and a shrinkage of the spinodal region. Beyond the intuitive suppression of clustering by weak-flow advection, our results reveal several non-trivial phenomena including a reentrant phase behaviour where extremely high self-propulsion hinders motility-induced phase separation by facilitating particle escape from dense regions. We also observe that the density distributions strongly depend on roll periodicity. These findings demonstrate that convection rolls provide an effective means to control non-equilibrium collective behaviour in active matter.", "url": "https://arxiv.org/abs/2608.17692", "type": "理论+数值", "summary": "我们对二维对流辊中活性颗粒的运动引起的相分离进行了数值研究。我们分析局部堆积分数分布、密度波动、相应的相图和扩散率曲线，以表征自推进、全局堆积分数和平流强度之间的相互作用。在弱流动状态下，系统表现出以双峰密度分布、缓慢衰减的密度波动和扩散率急剧下降为特征的相分离。增加平流通过增强颗粒传输和减少捕获来抑制聚集，从而导致运动引起的相分离的临界自推进速度发生变化以及旋节线区域的收缩。除了弱流平流对聚类的直观抑制之外，我们的结果还揭示了几种重要的现象，包括重入相行为，其中极高的自推进力通过促进颗粒从致密区域逃逸来阻碍运动引起的相分离。我们还观察到密度分布强烈依赖于滚动周期。\n\n这些发现表明，对流辊提供了控制活性物质中非平衡集体行为的有效手段。", "authors": [{"name": "Poulami Bag"}], "featured_authors": [{"name": "Poulami Bag"}], "author_count": 1}, {"id": "2608.17705", "category": "cond-mat", "title": "Hydrodynamic Mode Coupling: Effects of density variations in nanoscale channel flows", "abstract": "We apply a modal framework for investigating the effect of density variations on gravity-type driven flows at the nanoscale. Using eigenfunction decomposition of the density and acceleration fields, each shear-pressure mode is separated into a homogeneous contribution and an inhomogeneous contribution determined by the Fourier amplitudes of the density and applied acceleration. This decomposition provides a direct means of identifying how density variations and external forcing couple and govern the flow behavior. We first revisit the Poiseuille flow and show that for channel heights larger than the characteristic intermolecular distance the homogeneous contribution dominates the long wave length (small wave vector) response, consistent with previous simulation results. In contrast, for sinusoidally driven flow, selective excitation of acceleration modes can produce the opposite behavior, with the inhomogeneous contribution dominating the long wave length response. The results show that the effect of the density variations depends on the specific flow; specifically the detailed mode coupling between the acceleration and density fields. The framework presented here provides a direct systematic approach for understanding and predicting the flow depending on the applied acceleration.", "url": "https://arxiv.org/abs/2608.17705", "type": "理论+数值", "summary": "我们应用模态框架来研究密度变化对纳米尺度重力型驱动流的影响。使用密度场和加速度场的本征函数分解，每个剪切压力模式被分成由密度和施加的加速度的傅立叶振幅确定的均匀贡献和非均匀贡献。这种分解提供了一种直接方法来识别密度变化和外力如何耦合并控制流动行为。我们首先重新审视泊肃叶流，并表明，对于大于特征分子间距离的通道高度，均匀贡献主导长波长（小波矢量）响应，与之前的模拟结果一致。相反，对于正弦驱动流，加速模式的选择性激励可以产生相反的行为，其中非均匀贡献主导长波长响应。结果表明，密度变化的影响取决于比流量；特别是加速度场和密度场之间的详细模式耦合。\n\n这里提出的框架提供了一种直接的系统方法，用于根据所施加的加速度来理解和预测流量。", "authors": [{"name": "L. Heitmeier"}, {"name": "J. S. Hansen"}], "featured_authors": [{"name": "L. Heitmeier"}, {"name": "J. S. Hansen"}], "author_count": 2}, {"id": "2608.17745", "category": "cond-mat", "title": "Bridging ambient- and high-pressure superconductivity in La$_2$LnNi$_2$O$_7$ films", "abstract": "The discovery of high critical-temperature $T_{\\mathrm{c}}$ superconductivity near 80 K in bilayer nickelates under high pressure has sparked extensive studies. While superconductivity exceeding 40 K was subsequently discovered at ambient pressure in compressively strained films, the relationship between ambient- and high-pressure regimes remains an open question. Here we present a systematic investigation of superconductivity in compressively strained La$_2$LnNi$_2$O$_7$ films (Ln = lanthanides) at ambient and high pressures. The normal-state resistivity at ambient pressure, revealed by suppressing superconductivity with magnetic fields of 59 T, tends toward $T^2$ behaviour. Under high pressure in a cubic-anvil cell, $T_{\\mathrm{c}}$ was enhanced from 41-42 K at ambient pressure to 67-73 K at 16 GPa. On the other hand, lattice compression induced by Ln substitution, which may mimic effects of pressure, lowers $T_{\\mathrm{c}}$. In both cases, $T_{\\mathrm{c}}$ correlates with the evolution of normal-state transport between $T^2$ and $T$-linear behaviour, offering insight into the interplay between lattice structure and superconductivity in bilayer nickelates.", "url": "https://arxiv.org/abs/2608.17745", "type": "理论", "summary": "高压下双层镍酸盐中近 80 K 的高临界温度 $T_{\\mathrm{c}}$ 超导性的发现引发了广泛的研究。虽然随后在环境压力下发现压缩应变薄膜具有超过 40 K 的超导性，但环境压力和高压状态之间的关系仍然是一个悬而未决的问题。在这里，我们对常压和高压下压缩应变 La$_2$LnNi$_2$O$_7$ 薄膜（Ln = 镧系元素）的超导性进行了系统研究。通过用 59 T 的磁场抑制超导性揭示了环境压力下的常态电阻率，倾向于 $T^2$ 行为。在立方砧室的高压下，$T_{\\mathrm{c}}$ 从环境压力下的 41-42 K 提高到 16 GPa 下的 67-73 K。另一方面，由 Ln 取代引起的晶格压缩（可能模拟压力的影响）降低了 $T_{\\mathrm{c}}$。在这两种情况下，$T_{\\mathrm{c}}$ 都与 $T^2$ 和 $T$ 线性行为之间的正常状态输运演化相关，从而深入了解双层镍酸盐中晶格结构和超导性之间的相互作用。", "authors": [{"name": "Motoki Osada"}, {"name": "Chieko Terakura"}, {"name": "Shusaku Imajo"}, {"name": "Jean-Baptiste Morée"}, {"name": "Akiko Kikkawa"}, {"name": "Masamichi Nakajima"}, {"name": "Hsiao-Yi Chen"}, {"name": "Yusuke Nomura"}, {"name": "Koichi Kindo"}, {"name": "Ryotaro Arita"}, {"name": "Yoshinori Tokura"}, {"name": "Atsushi Tsukazaki"}], "featured_authors": [{"name": "Motoki Osada"}, {"name": "Chieko Terakura"}, {"name": "Shusaku Imajo"}, {"name": "Ryotaro Arita"}, {"name": "Yoshinori Tokura"}, {"name": "Atsushi Tsukazaki"}], "author_count": 12}, {"id": "2608.17817", "category": "cond-mat", "title": "Frustration without Glass in Non-Abelian Simplicial Networks", "abstract": "We formulate a non-Abelian theory of structural consistency for systems in which dynamical transformations reside on the links of a simplicial network. Gauge covariance follows from freedom to choose local representation frames, while plaquette holonomies quantify the incompatibility of alternative paths. For an SU(2) model on the complete simplicial $2$-complex with quenched random plaquette couplings, parallel-tempering simulations reveal a continuous disorder-driven loss of global compatibility. In the high-disorder phase, the uniform compatibility $M_P$ decreases with system size, the integrated adjacent correlation weight $\\mathcal I_{\\mathrm{adj}}$ remains finite value. Moreover, the connected replica-overlap width approaches the numerical noise floor and its distribution narrows, providing no evidence for thermodynamic replica-symmetry breaking. Dense frustration therefore produces a non-glassy correlated gauge liquid in which individual pair correlations are geometrically diluted while a finite integrated correlation weight survives.", "url": "https://arxiv.org/abs/2608.17817", "type": "理论+数值", "summary": "我们为动态变换驻留在单纯网络链接上的系统制定了一种非阿贝尔结构一致性理论。规范协方差源于选择局部表示框架的自由，而板状完整则量化替代路径的不兼容性。对于具有淬火随机板耦合的完整单纯 $2$ 复合体上的 SU(2) 模型，平行回火模拟揭示了连续无序驱动的全局兼容性损失。在高无序阶段，均匀相容性$M_P$随着系统规模的增大而减小，集成的相邻相关权重$\\mathcal I_{\\mathrm{adj}}$仍然是有限值。此外，连接的复制重叠宽度接近数值本底噪声，并且其分布变窄，没有提供热力学复制对称破缺的证据。因此，密集挫败产生了非玻璃态相关测量液体，其中各个对相关性被几何稀释，而有限的积分相关性权重仍然存在。", "authors": [{"name": "Xuanhua Wang"}], "featured_authors": [{"name": "Xuanhua Wang"}], "author_count": 1}, {"id": "2608.17840", "category": "cond-mat", "title": "The Deformed Image Vortex Ansatz: A Perturbation-Aware Description of Magnetic Vortices in In-Plane Fields", "abstract": "Thiele-based descriptions of magnetic vortex dynamics in thin ferromagnetic nanodots rely on magnetization ansätze that describe the equilibrium texture but cannot represent perturbation-induced deformations. We introduce the Deformed Image Vortex Ansatz (DIVA): a perturbation-aware ansatz in which the response to an external perturbation is built into the magnetization profile itself, rather than appended to the dynamics as a correction. Here, we demonstrate the concept for a uniform, stationary in-plane field applied to a Permalloy nanodot, for which the deformation is analytically tractable. A symmetry-based perturbative expansion identifies the leading deformation as a single $m = 1$ harmonic around the disk, while energy minimization and a dominant-balance analysis yield a closed-form interpolant for the radial profile. Benchmarked against micromagnetic simulations on Permalloy disks of aspect ratio $t/R = 0.1$ and $0.0125$, this realization reduces the disk-averaged angular deviation by a factor of 3 to 6 relative to the two-vortex ansatz, depending on geometry and field, and reduces the total-energy deviation by about a factor of six in the thicker disk.", "url": "https://arxiv.org/abs/2608.17840", "type": "理论+数值", "summary": "基于蒂勒的薄铁磁纳米点磁涡动力学描述依赖于描述平衡纹理但不能代表扰动引起的变形的磁化强度。我们介绍了变形图像涡旋 Ansatz (DIVA)：一种扰动感知 ansatz，其中对外部扰动的响应内置于磁化曲线本身中，而不是附加到动力学中作为校正。在这里，我们演示了应用于坡莫合金纳米点的均匀、静止面内场的概念，其变形在分析上是易于处理的。基于对称性的微扰展开将主要变形识别为圆盘周围的单个 $m = 1$ 谐波，而能量最小化和主导平衡分析则为径向轮廓生成闭合形式插值。以纵横比 $t/R = 0.1$ 和 $0.0125$ 的坡莫合金圆盘上的微磁模拟为基准，这种实现将圆盘平均角度偏差相对于双涡旋 ansatz 减少了 3 到 6 倍，具体取决于几何形状和场，并且在较厚的圆盘中将总能量偏差减少了约 6 倍。", "authors": [{"name": "Thomas G. Coppée"}, {"name": "Colin Ducarme"}, {"name": "Simon de Wergifosse"}, {"name": "Flavio Abreu Araujo"}], "featured_authors": [{"name": "Thomas G. Coppée"}, {"name": "Colin Ducarme"}, {"name": "Simon de Wergifosse"}, {"name": "Flavio Abreu Araujo"}], "author_count": 4}, {"id": "2608.17850", "category": "cond-mat", "title": "A solid-state theory for dense cylindrical packings of balls", "abstract": "We develop an analytical theory for the dense packing of hard spheres in cylinders. Physically, our theory consists of a finite cylindrical masking of a close-packed three-dimensional solid and covers the entire range of cylinder aspect ratios, thus going beyond efforts that are focused on very tall cylinders in a narrow range of widths. We explicitly derive an exact equation for resulting packing fractions, valid for any regular lattice, and it provides a basis to understand the oscillations and scaling of volume fractions that have appeared in previous works. Our analytical relation serves as a rigorous lower bound and to tighten it we derive, and implement, an efficient mathematical procedure to optimize the orientation of the cylinder. Furthermore, we suggest simple techniques to improve on the predicted packings. Overall, we provide a general theoretical foundation for the packing of balls in cylinders, valid for all container sizes.", "url": "https://arxiv.org/abs/2608.17850", "type": "理论+数值", "summary": "我们开发了一种用于圆柱体中硬球密集堆积的分析理论。从物理上讲，我们的理论由密排三维固体的有限圆柱掩蔽组成，涵盖了圆柱体纵横比的整个范围，从而超越了专注于窄宽度范围内非常高的圆柱体的努力。我们明确地推导了所得堆积分数的精确方程，该方程对任何规则晶格都有效，并且它为理解先前作品中出现的体积分数的振荡和缩放提供了基础。我们的分析关系作为严格的下限，为了收紧它，我们推导并实施了一个有效的数学程序来优化圆柱体的方向。此外，我们建议使用简单的技术来改进预测的包装。总的来说，我们为钢瓶中球的包装提供了通用的理论基础，适用于所有容器尺寸。", "authors": [{"name": "Luke K. Davis"}, {"name": "Alexander R. Klotz"}], "featured_authors": [{"name": "Luke K. Davis"}, {"name": "Alexander R. Klotz"}], "author_count": 2}, {"id": "2608.17899", "category": "cond-mat", "title": "Hidden Unbounded Potential and Re-Entrant Multifractalization in a Generalized Su-Schrieffer-Heeger Model", "abstract": "We study the multifractal criticality in a generalized Su-Schrieffer-Heeger model. The results show that the system supports not only critical phases but also re-entrance multifractalization (REM). By mapping the hopping term to an effective potential, we analytically prove that although the model has no explicit unbounded potential, a hidden unbounded potential is actually present-this is the key mechanism driving the emergence of multifractal critical phases. Moreover, one can get a condition where the competition between the explicit and hidden unbounded potentials is exactly balanced. Under this condition, the multifractal critical phase vanish, and the system returns to the extended phase. Based on this mechanism, we achieve both demultifractalization and re-entrant multifractalization. Finally, we double check the theoretical predictions through wave packet dynamics, and the numerical results are consistent with our theoretical analysis. This work broadens our understanding of how unbounded potentials induce multifractal critical phases, providing a theoretical basis for designing new systems with multifractal critical phases.", "url": "https://arxiv.org/abs/2608.17899", "type": "理论+数值", "summary": "我们研究了广义 Su-Schrieffer-Heeger 模型中的多重分形临界性。结果表明，该系统不仅支持关键相，还支持重入多重分形（REM）。通过将跳跃项映射到有效势，我们分析证明，虽然模型没有显式的无界势，但实际上存在隐藏的无界势——这是驱动多重分形临界相出现的关键机制。此外，我们还可以得到这样一个条件：显性和隐性无界势之间的竞争完全平衡。在此条件下，多重分形临界相消失，系统返回到扩展相。基于这种机制，我们实现了去多重分形和可重入多重分形。最后，我们通过波包动力学双重检验了理论预测，数值结果与我们的理论分析一致。这项工作拓宽了我们对无界势如何诱发多重分形临界相的理解，为设计具有多重分形临界相的新系统提供了理论基础。", "authors": [{"name": "Yun-Yan Chen"}, {"name": "Jia-Ming Zhang"}, {"name": "Zhi Li"}], "featured_authors": [{"name": "Yun-Yan Chen"}, {"name": "Jia-Ming Zhang"}, {"name": "Zhi Li"}], "author_count": 3}, {"id": "2608.17937", "category": "cond-mat", "title": "Dephasing-induced distinct mobility edges in a dimerized off-diagonal quasicrystal", "abstract": "Anderson localization and the mobility edge (ME) have been extensively studied in isolated aperiodic systems. Conventional theory suggests that dephasing and decoherence should disrupt localization and facilitate transport. In this work, we investigate localization behaviors in a dimerized off-diagonal Aubry-Andre-Harper (AAH) quasicrystal subject to on-site pure dephasing. In the strong-dephasing limit, we apply adiabatic elimination within the Lindblad master equation framework to derive an effective classical Markov transition matrix that governs the dissipative relaxation dynamics. Counterintuitively, we demonstrate that pure dephasing can induce distinct MEs, including both conventional MEs separating extended and localized states and anomalous MEs separating multifractal critical states from localized states, even when all eigenstates of the original closed coherent system are delocalized or multifractal. Using fractal dimension finite-size scaling, wave-packet spreading dynamics, and energy spectrum statistics, we numerically verify the coexistence of fully extended, multifractal critical, and localized regions within the relaxation spectrum of the dissipative system, and construct the global dissipative phase diagram. These findings reveal that dephasing can see as a powerful mechanism for controlling localization transitions, thus enhancing our understanding of dissipative quasicrystal systems.", "url": "https://arxiv.org/abs/2608.17937", "type": "理论+数值", "summary": "安德森定位和移动边缘（ME）已在孤立的非周期系统中进行了广泛的研究。传统理论认为，相移和退相干应该会破坏定位并促进传输。在这项工作中，我们研究了二聚化非对角 Aubry-Andre-Harper (AAH) 准晶体中进行现场纯移相的定位行为。在强相移极限下，我们在 Lindblad 主方程框架内应用绝热消除来导出控制耗散弛豫动力学的有效经典马尔可夫转移矩阵。与直觉相反，我们证明，即使原始封闭相干系统的所有本征态都是离域的或多重分形的，纯相移也可以诱导不同的 ME，包括分离扩展态和局域态的常规 ME 和将多重分形临界态与局域态分离的异常 ME。\n\n利用分形维数有限尺寸缩放、波包扩散动力学和能谱统计，我们数值验证了耗散系统弛豫谱内完全扩展、多重分形临界和局域区域的共存，并构建了全局耗散相图。这些发现表明，相移可以被视为控制局域化转变的强大机制，从而增强我们对耗散准晶系统的理解。", "authors": [{"name": "Ming-Jie Tao"}, {"name": "Yi-Ting Wang"}, {"name": "Jing Li"}, {"name": "Hongsheng Hou"}, {"name": "Xiang-Ping Jiang"}, {"name": "Lei Pan"}], "featured_authors": [{"name": "Ming-Jie Tao"}, {"name": "Yi-Ting Wang"}, {"name": "Jing Li"}, {"name": "Hongsheng Hou"}, {"name": "Xiang-Ping Jiang"}, {"name": "Lei Pan"}], "author_count": 6}, {"id": "2608.17954", "category": "cond-mat", "title": "Topology of Nonequilibrium Currents Controls Active Transport", "abstract": "Structured environments repeatedly redirect active particles, producing transport pathways that cannot be readily inferred from individual trajectories. Here, we show that the large-scale organization of these transport pathways is governed by topological constraints. Hydrodynamic scattering generates nonequilibrium current fields whose defect structure, characterized by integer indices, constrain transport pathways and renders them robust to smooth perturbations. This principle is demonstrated with rotating colloids in obstacle arrays and extended to stokeslet and force-dipole flows, thereby linking microscale transport to the topology of hydrodynamically generated nonequilibrium currents.", "url": "https://arxiv.org/abs/2608.17954", "type": "理论", "summary": "结构化环境反复改变活性粒子的方向，产生无法从单个轨迹中轻易推断出的传输路径。在这里，我们表明这些传输路径的大规模组织受到拓扑约束的控制。流体动力散射产生非平衡电流场，其缺陷结构以整数指数为特征，限制了传输路径并使它们对平滑扰动具有鲁棒性。这一原理通过障碍物阵列中的旋转胶体得到证明，并扩展到斯托克斯勒和力偶极流，从而将微尺度输运与流体动力学产生的非平衡流的拓扑联系起来。", "authors": [{"name": "A. Escobar"}, {"name": "G. Geva"}, {"name": "A. Alexander-Katz"}, {"name": "L.R. Arriaga"}, {"name": "J.V. Alvarez"}, {"name": "J.L. Aragones"}], "featured_authors": [{"name": "A. Escobar"}, {"name": "G. Geva"}, {"name": "A. Alexander-Katz"}, {"name": "L.R. Arriaga"}, {"name": "J.V. Alvarez"}, {"name": "J.L. Aragones"}], "author_count": 6}, {"id": "2608.18016", "category": "cond-mat", "title": "Critical behavior and crossover scaling in the Light-Heavy model", "abstract": "The Light-Heavy (LH) model involves two species of particles (light and heavy) coupled with a fluctuating surface (described by tilts). The dynamics include the inherent diffusion of the particles (or tilts) as well as the drive provided by the tilts (or particles). When the two are of similar magnitude, the system lies in the unscaled (uLH) regime, while a significantly weaker drive leads to the scaled (sLH) regime. In the unscaled limit, the model exhibits an order-disorder transition characterized by the fluctuation-dominated phase ordering (FDPO). In this state, interestingly the dynamics is driven by multiple modes, giving rise to dynamic clusters. Away from the critical regime the disordered phase retains vestiges of FDPO behavior on length scales smaller than the correlation length. We examine this local FDPO-like behavior by using a scaling function that links the off-critical and critical regimes. We next turn to the scaled model and show that the multi-mode dynamics present in the unscaled regime is replaced by dynamics that is effectively controlled by a single dominant mode in the scaled regime. Concurrently, the two-point correlations change from the $\\mathcal{O}(1)$ FDPO form to an anomalous long-range form that decays as $1/\\sqrt{L}$. Drawing on the analogy with the sABC model, where similar anomalous correlations appear at criticality, we derive an analytical expression for the two-point correlation function using the same approach used for that model.", "url": "https://arxiv.org/abs/2608.18016", "type": "理论", "summary": "轻重 (LH) 模型涉及两种粒子（轻粒子和重粒子）以及波动表面（通过倾斜描述）。动力学包括粒子（或倾斜）的固有扩散以及倾斜（或粒子）提供的驱动。当两者大小相似时，系统处于未缩放（uLH）状态，而明显较弱的驱动导致缩放（sLH）状态。在无标度限制下，模型表现出以涨落主导的相序 (FDPO) 为特征的有序-无序转变。在这种状态下，有趣的是，动态是由多种模式驱动的，从而产生动态集群。远离临界状态，无序相在小于相关长度的长度尺度上保留了 FDPO 行为的痕迹。我们通过使用连接非关键和关键状态的缩放函数来检查这种类似于 FDPO 的本地行为。接下来我们转向缩放模型，并表明非缩放区域中存在的多模动态被缩放区域中的单一主导模式有效控制的动态所取代。\n\n同时，两点相关性从 $\\mathcal{O}(1)$ FDPO 形式变为异常的长程形式，以 $1/\\sqrt{L}$ 衰减。借鉴 sABC 模型的类比，在临界点出现类似的异常相关性，我们使用与该模型相同的方法推导出两点相关函数的解析表达式。", "authors": [{"name": "Shilpa Prakash"}, {"name": "Mustansir Barma"}, {"name": "Kabir Ramola"}], "featured_authors": [{"name": "Shilpa Prakash"}, {"name": "Mustansir Barma"}, {"name": "Kabir Ramola"}], "author_count": 3}, {"id": "2608.18065", "category": "cond-mat", "title": "Quantum Geometric Tensor Preconditioning for Stable Training of Recurrent Neural Quantum States", "abstract": "Neural Quantum States (NQS) provide a powerful neural network-based variational framework for representing many-body wave functions and solving for ground states. Recurrent Neural Networks (RNNs) are particularly promising owing to their relatively low computational cost and their autoregressive property, which enables perfect sampling. Recently, RNNs have been reported to be unstable under curvature-based optimizers such as the minimum-step stochastic reconfiguration (minSR) method. In this paper, we address this perceived limitation and show that minSR can be stabilized through simple regularization techniques, enabling robust training of RNN-based NQS with only a few samples. Our approach outperforms the Adam optimizer on the one-dimensional transverse-field Ising model and the one-dimensional cluster state, and provides competitive results on the two-dimensional Heisenberg and $J_1-J_2$ models. This work offers a promising pathway for using modern optimization techniques with autoregressive NQS to address open questions in quantum simulation.", "url": "https://arxiv.org/abs/2608.18065", "type": "理论+数值", "summary": "神经量子态 (NQS) 提供了一个强大的基于神经网络的变分框架，用于表示多体波函数和求解基态。循环神经网络（RNN）由于其相对较低的计算成本和自回归特性（可以实现完美采样）而特别有前途。最近，据报道，RNN 在基于曲率的优化器（例如最小步随机重新配置（minSR）方法）下不稳定。在本文中，我们解决了这个感知到的局限性，并表明 minSR 可以通过简单的正则化技术来稳定，从而仅用少量样本即可对基于 RNN 的 NQS 进行鲁棒训练。我们的方法在一维横向场伊辛模型和一维簇状态上优于 Adam 优化器，并在二维海森堡和 $J_1-J_2$ 模型上提供了有竞争力的结果。这项工作为使用现代优化技术和自回归 NQS 来解决量子模拟中的悬而未决的问题提供了一条有前途的途径。", "authors": [{"name": "Adil Attar"}, {"name": "Amine M. Aboussalah"}, {"name": "Mohamed Hibat-Allah"}], "featured_authors": [{"name": "Adil Attar"}, {"name": "Amine M. Aboussalah"}, {"name": "Mohamed Hibat-Allah"}], "author_count": 3}, {"id": "2608.16982", "category": "hep-th", "title": "A geodesic distance interpretation of Lanczos coefficients", "abstract": "We study the spread complexity of the infinite-temperature thermofield double state in large-$N$ random matrix theory and investigate the physical meaning of its Lanczos coefficients. The leading density of states defines a family of orthogonal polynomials whose recursion coefficients coincide with the Lanczos coefficients of the associated Krylov dynamics. Starting from the Coulomb-gas equation, we derive a pair of nonlinear relations for these coefficients, which we call the Lanczos equations. Since the Lanczos coefficients approach constants at large Krylov index, the spread complexity grows linearly at late times. We further show that the Lanczos coefficients can be interpreted as generating functions for planar maps. For an even potential, the difference $b_{n+1}^2-b_n^2$ generates maps with two legs whose marked legs are separated by the exact geodesic distance $n$. Consequently, the spread complexity acceleration operator equals twice the geodesic generating operator. We illustrate these results in the quartic matrix model, where the expansion in the quartic coupling counts tetravalent planar maps, and in the double-scaled Sachdev--Ye--Kitaev model, where the auxiliary Hilbert space can be identified with the physical chord Hilbert space.", "url": "https://arxiv.org/abs/2608.16982", "type": "理论", "summary": "我们研究了大$N$随机矩阵理论中无限温度热场双态的扩展复杂性，并研究了其Lanczos系数的物理意义。主态密度定义了一系列正交多项式，其递归系数与相关 Krylov 动力学的 Lanczos 系数一致。从库仑-气体方程出发，我们推导出这些系数的一对非线性关系，我们称之为 Lanczos 方程。由于 Lanczos 系数在大 Krylov 指数下接近常数，因此扩展复杂度在后期呈线性增长。我们进一步证明兰佐斯系数可以解释为平面地图的生成函数。对于偶势，差值 $b_{n+1}^2-b_n^2$ 生成具有两条腿的地图，其标记的腿由精确的测地距离 $n$ 分开。因此，扩展复杂度加速算子等于测地线生成算子的两倍。\n\n我们在四次矩阵模型中说明了这些结果，其中四次耦合中的展开计算四价平面映射，并在双尺度 Sachdev--Ye-Kitaev 模型中说明这些结果，其中辅助希尔伯特空间可以用物理弦希尔伯特空间来识别。", "authors": [{"name": "Le-Chen Qu"}], "featured_authors": [{"name": "Le-Chen Qu"}], "author_count": 1}, {"id": "2608.16985", "category": "hep-th", "title": "Pure gravity OPE density for genus-two handlebody in $\\text{AdS}_3$", "abstract": "In this work, we compute the operator product expansion density for the genus-two handlebody by exploiting its duality with extremal conformal field theories arXiv:0710.2129 . Using a Poincaré construction, we analytically determine the first- and second-order corrections in the pinching parameter to the genus-two OPE density through a direct inversion of the partition function. As a consistency check, we also compute the genus-one density within the same Poincaré framework and find perfect agreement with the result obtained from the lightcone bootstrap analysis arXiv: 1906.04184 . It is known that, at genus one, the OPE density of extremal CFTs exhibits a negativity pathology for states lying just above the black-hole threshold. We show that this pathology continues to persist at genus two, despite the emergence of a nontrivial inversion kernel. In particular, the OPE density associated with states of both odd and even spin $j_i$ remains negative within a very narrow band above the black-hole threshold. We further analyze the sharp transition from large positive to large negative values of the OPE density across a curve along which the density vanishes.", "url": "https://arxiv.org/abs/2608.16985", "type": "理论", "summary": "在这项工作中，我们通过利用极值共形场理论 arXiv:0710.2129 利用其对偶性来计算属二手柄的算子乘积展开密度。使用庞加莱构造，我们通过配分函数的直接反演来分析确定对属二 OPE 密度的箍缩参数的一阶和二阶修正。作为一致性检查，我们还在同一庞加莱框架内计算属一密度，并发现与 lightcone bootstrap 分析 arXiv: 1906.04184 获得的结果完全一致。众所周知，在属一处，极值 CFT 的 OPE 密度对于刚好高于黑洞阈值的状态表现出负病理学。我们表明，尽管出现了不平凡的反转核，但这种病理学在第二属中仍然存在。特别是，与奇数和偶数自旋$j_i$状态相关的OPE密度在黑洞阈值以上的非常窄的带内保持负值。我们进一步分析了 OPE 密度从大正值到大负值在密度消失的曲线上的急剧转变。", "authors": [{"name": "Saptaswa Ghosh"}, {"name": "Sounak Pal"}], "featured_authors": [{"name": "Saptaswa Ghosh"}, {"name": "Sounak Pal"}], "author_count": 2}, {"id": "2608.16992", "category": "hep-th", "title": "Bulk Criticality and Boundary Spectra in AdS from Matrix Product States", "abstract": "We study interacting scalar quantum field theories in anti-de Sitter (AdS) space using a tensor-network approach based on matrix product states. We develop methods for extracting low-lying boundary spectra from global-AdS energy levels, probing bulk criticality through finite-size scaling in the AdS radius, and identifying conformal boundary conditions. Applying these methods to scalar $\\phi^4$ theory in $\\mathrm{AdS}_2$, we compute the lowest non-trivial $\\mathbb{Z}_2$-odd and even boundary scaling dimensions non-perturbatively. We then locate the bulk $\\mathbb{Z}_2$ symmetry-breaking transition and extract critical exponents and central charge consistent with the 2D Ising universality class. At the critical point, we determine the low-lying boundary spectrum and use it to identify the $\\mathbb{Z}_2$-preserving free/ordinary Ising conformal boundary condition, thereby characterising both the bulk and boundary universality classes.", "url": "https://arxiv.org/abs/2608.16992", "type": "理论", "summary": "我们使用基于矩阵乘积状态的张量网络方法研究反德西特 (AdS) 空间中的相互作用标量量子场论。我们开发了从全局 AdS 能级中提取低洼边界光谱、通过 AdS 半径中的有限尺寸缩放来探测体积临界性以及识别共形边界条件的方法。将这些方法应用于 $\\mathrm{AdS}_2$ 中的标量 $\\phi^4$ 理论，我们非扰动地计算最低的非平凡 $\\mathbb{Z}_2$-奇数和偶数边界缩放维度。然后，我们定位大量 $\\mathbb{Z}_2$ 对称破缺跃迁，并提取与 2D Ising 普适性类一致的关键指数和中心电荷。在关键点，我们确定低洼边界谱，并用它来识别 $\\mathbb{Z}_2$ 保留的自由/普通伊辛共形边界条件，从而表征体和边界普遍性类。", "authors": [{"name": "Faizan Bhat"}], "featured_authors": [{"name": "Faizan Bhat"}], "author_count": 1}, {"id": "2608.16997", "category": "hep-th", "title": "Who Writes the Gravitational Second Law of Thermodynamics?", "abstract": "We define gravitational entropy as the manifestly integrable surface charge associated with local transverse Lorentz boosts, entirely bypassing the conventional reliance on spacetime diffeomorphisms. Any notion of entropy must satisfy the second law. To answer the question posed in the title, an analogy with Newtonian classical mechanics is instructive: Newton's second law of motion is written by inertial observers who are defined by the first law of mechanics. We show that the second law of gravitational thermodynamics is written by free-fall observers with path parameterization in which the non-affinity of the geodesics is equal to the expansion of their velocity vector field. We then provide a proof of the local second law by studying variations in entropy as viewed by this class of covariantly-defined causal free-fall observers. We show that the entropy variation is strictly non-decreasing, provided the matter sector satisfies the integrated strong energy condition along the observer path.", "url": "https://arxiv.org/abs/2608.16997", "type": "理论", "summary": "我们将引力熵定义为与局部横向洛伦兹增​​强相关的明显可积的表面电荷，完全绕过了对时空微分同胚的传统依赖。任何熵的概念都必须满足第二定律。为了回答标题中提出的问题，与牛顿经典力学的类比是有启发性的：牛顿第二运动定律是由惯性观察者写成的，而惯性观察者是由力学第一定律定义的。我们证明了引力热力学第二定律是由具有路径参数化的自由落体观察者编写的，其中测地线的非亲和力等于其速度矢量场的扩展。然后，我们通过研究这类协变定义的因果自由落体观察者所看到的熵的变化来提供局部第二定律的证明。我们证明，只要物质扇区满足沿观察者路径的积分强能量条件，熵变化是严格不递减的。", "authors": [{"name": "V. R. Shajiee"}, {"name": "M. M. Sheikh-Jabbari"}, {"name": "V. Taghiloo"}], "featured_authors": [{"name": "V. R. Shajiee"}, {"name": "M. M. Sheikh-Jabbari"}, {"name": "V. Taghiloo"}], "author_count": 3}, {"id": "2608.17012", "category": "hep-th", "title": "Statistically Steady Holographic Quantum Turbulence: Hyperuniform Vortex Matter and Crossover", "abstract": "A long-standing obstacle in quantum turbulence has been the difficulty of sustaining robust statistical steady states, preventing unambiguous identification of universal vortex organization and kinetic scaling. We construct such a steady state in two-dimensional holographic superfluid turbulence by continuous Landau-instability driving, sustaining ${\\sim}2500$ vortices free from transient artifacts. The topological charge structure factor $S_c(k)$ reveals Class I disordered hyperuniformity with $S_c(k)\\propto k^{\\alpha>1}$ as $k\\to0$, where $k$ is the wavenumber. This constitutes the strongest long-range order of its kind and its first observation in a strongly driven, far-from-equilibrium quantum fluid with topological defects as the organizing principle, establishing a novel non-equilibrium vortex phase. Exploiting this platform, we resolve the scaling controvers
