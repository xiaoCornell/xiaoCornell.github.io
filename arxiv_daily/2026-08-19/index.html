 nonclassical and entangled. Finally, we offer a phenomenological interpretation for the generation of such entangled states during HHG, as a consequence of multi-atom effects. Since the coherence volume of the driving field greatly exceeds that of its harmonics, a collectively-driven cluster of atoms can radiate the individual harmonics as spatially resolved, but fundamentally indistinguishable sources. This can generate the permutation-symmetric entanglement structure of an attoquant.", "url": "https://arxiv.org/abs/2608.17854", "type": "理论+数值", "summary": "根据锁模的经典理论，高次谐波发生（HHG）通常被认为只有当发射的谐波相互锁相时才会产生阿秒脉冲序列。当谐波场处于可分离的多模量子态时，这种锁定对于脉冲合成是必要的。然而，对于表现出联运纠缠的谐波梳来说，这一要求可以完全规避。我们引入了一种新颖的多模量子态家族，称为阿托量子态：与高度结构化的脉冲序列相关的状态，本质上对相对相位不敏感。作为一个具体的例子，我们分析了相干永久态，它被构造为相干态乘积在固定参数集的所有排列上的完全对称叠加。分析表明，其电场期望值是驱动场谐波的锁定傅里叶叠加，无需锁模即可产生阿秒脉冲串。我们进一步计算了该状态的光子统计、维格纳函数和对数负性，确认它确实是非经典和纠缠的。\n\n最后，我们对 HHG 期间由于多原子效应而产生的这种纠缠态提供了现象学解释。由于驱动场的相干体积大大超过其谐波的相干体积，集体驱动的原子簇可以将各个谐波辐射为空间分辨但基本上无法区分的来源。这可以生成阿托量子的排列对称纠缠结构。", "authors": [{"name": "Sándor Varró"}, {"name": "Ákos Gombkötő"}], "featured_authors": [{"name": "Sándor Varró"}, {"name": "Ákos Gombkötő"}], "author_count": 2}, {"id": "2608.17980", "category": "quant-ph", "title": "Dressed magnon dynamics in a Bose-Hubbard bath: retardation, pairing, entanglement and two-magnon scattering", "abstract": "We study one- and two-magnon dynamics in a spin-$1/2$ XX chain coupled to a tunable Bose-Hubbard bath. The XX Hamiltonian transports the magnons, while the bath dresses their motion and mediates an effective attraction. A single magnon forms a mobile polaron whose retarded bosonic cloud reduces its velocity below the static Lang-Firsov prediction and generates magnon-boson entanglement. In the weak-dressing, off-resonant mobile regime, the residual velocity deficit and entanglement are governed by the excitation weight of the cloud, as captured by perturbation theory and tensor network-based real-time simulations. Transport therefore provides a model-calibrated proxy for entanglement without joint-state reconstruction. When two clouds overlap, the bath mediates a finite-range attraction, yielding finite-size evidence for a compact two-magnon bound state and a transient post-scattering signature. On-site bath interactions suppress local boson number fluctuations and stiffen the bath response, reducing entanglement and weakening ground-state binding. Bath deformability thus emerges as a common control parameter for magnon transport, entanglement, and bath-mediated pairing.", "url": "https://arxiv.org/abs/2608.17980", "type": "理论+数值", "summary": "我们研究了与可调 Bose-Hubbard 浴耦合的自旋 $1/2$ XX 链中的一磁振子和二磁振子动力学。 XX 哈密顿量传输磁振子，而浴则调整它们的运动并调节有效的吸引力。单个磁振子形成移动极化子，其延迟的玻色子云将其速度降低到静态朗-菲尔索夫预测以下，并产生磁振子-玻色子纠缠。在弱装饰、非共振移动状态下，残余速度赤字和纠缠由云的激励权重控制，如微扰理论和基于张量网络的实时模拟所捕获的那样。因此，传输为纠缠提供了模型校准的代理，无需联合状态重建。当两朵云重叠时，浴会介导有限范围的吸引力，产生紧凑的双磁振子束缚态和瞬态后散射特征的有限大小的证据。现场浴相互作用抑制局部玻色子数波动并加强浴响应，减少纠缠并削弱基态结合。因此，浴变形性成为磁振子输运、纠缠和浴介导配对的常见控制参数。", "authors": [{"name": "Andrés N. Cáliz"}, {"name": "Arnau Riera"}, {"name": "Enrique Rico"}, {"name": "João Barata"}, {"name": "Marcin Płodzień"}], "featured_authors": [{"name": "Andrés N. Cáliz"}, {"name": "Arnau Riera"}, {"name": "Enrique Rico"}, {"name": "João Barata"}, {"name": "Marcin Płodzień"}], "author_count": 5}, {"id": "2608.17984", "category": "quant-ph", "title": "High-Harmonicity Planar Penning Traps for Single-Electron Qubits", "abstract": "We present a detailed account of the design choices required for planar Penning traps that feature a highly harmonic confining potential. High harmonicity is indispensable for a number of applications, particularly for confinement of single electrons as qubits in quantum-information processing. The present work extends previous studies [D. Goldmann and G. Gabrielse, Phys. Rev. A 81, 052335 (2010)] by a fully analytic treatment of finite electrode gaps and their relevance for small traps on the millimetre size scale and below, when relative gap sizes are non-negligible. We derive the overall trap potential with a particular focus on different models of finite-gap potentials and show how to find the optimum trap geometry and electrode voltages to minimize anharmonicities. The analytic calculations are compared with detailed finite-element simulations.", "url": "https://arxiv.org/abs/2608.17984", "type": "理论+数值", "summary": "我们详细介绍了具有高谐波限制势的平面潘宁陷阱所需的设计选择。高谐波对于许多应用来说是必不可少的，特别是对于在量子信息处理中将单电子限制为量子位而言。目前的工作扩展了以前的研究[D. Goldmann 和 G. Gabrielse，物理学家。 Rev. A 81, 052335 (2010)]，当相对间隙尺寸不可忽略时，对有限电极间隙及其与毫米级及以下小陷阱的相关性进行全面分析处理。我们推导了总体陷阱电势，特别关注有限间隙电势的不同模型，并展示了如何找到最佳陷阱几何形状和电极电压以最大限度地减少非谐波。将分析计算与详细的有限元模拟进行比较。", "authors": [{"name": "Kedar Mal"}, {"name": "A. N. Agnihotri"}, {"name": "Sugam Kumar"}, {"name": "Wolfgang Quint"}, {"name": "Manuel Vogel"}], "featured_authors": [{"name": "Kedar Mal"}, {"name": "A. N. Agnihotri"}, {"name": "Sugam Kumar"}, {"name": "Wolfgang Quint"}, {"name": "Manuel Vogel"}], "author_count": 5}, {"id": "2608.18030", "category": "quant-ph", "title": "Three-qubit entanglement in the Bethe-Heitler process", "abstract": "The familiar Bethe-Heitler process on the proton target $e+p\\to e+p+\\gamma$ is transformed into a laboratory for studying multiparticle entanglement. We discuss how bipartite and genuine tripartite entanglement between the final state electron, proton and photon are built up by successive $1\\to 2$ and $2\\to 2$ elementary interactions. We validate our argument by simulating events. Below 5 GeV center-of-mass energy, we identify more than 900 Greenberger-Horne-Zeilinger (GHZ) states and 1200 W states, each with a fidelty exceeding 99%.", "url": "https://arxiv.org/abs/2608.18030", "type": "理论", "summary": "质子靶 $e+p\\to e+p+\\gamma$ 上熟悉的 Bethe-Heitler 过程被改造成研究多粒子纠缠的实验室。我们讨论最终态电子、质子和光子之间的二分纠缠和真正的三分纠缠是如何通过连续的 $1\\to 2$ 和 $2\\to 2$ 基本相互作用建立起来的。我们通过模拟事件来验证我们的论点。在低于 5 GeV 质心能量时，我们识别出超过 900 个 Greenberger-Horne-Zeilinger (GHZ) 状态和 1200 个 W 状态，每个状态的保真度都超过 99%。", "authors": [{"name": "Haotian Cao"}, {"name": "Yuxun Guo"}, {"name": "Yoshitaka Hatta"}, {"name": "Jakob Schoenleber"}], "featured_authors": [{"name": "Haotian Cao"}, {"name": "Yuxun Guo"}, {"name": "Yoshitaka Hatta"}, {"name": "Jakob Schoenleber"}], "author_count": 4}, {"id": "2608.18070", "category": "quant-ph", "title": "Nearly Sample-Optimal Estimators for Quantum Rényi and Tsallis Entropies", "abstract": "In this paper, we provide estimators for quantum Rényi and Tsallis entropies with nearly optimal sample complexity. Specifically, for order $\\alpha$, dimension $d$, and additive error $\\varepsilon$, 1. For $0 < \\alpha < 1$, the sample complexity is $O(d^{1+1/\\alpha}/\\varepsilon^{1/\\alpha} + d^{1/\\alpha-1}/\\varepsilon^{2})$ for Rényi entropy and $O(d^{1+1/\\alpha}/\\varepsilon^{1/\\alpha} + d^{2-2\\alpha}/\\varepsilon^2)$ for Tsallis entropy. In particular, for $0 < \\alpha \\leq 1/2$, the sample complexity for both entropies is $O(d^{1+1/\\alpha}/\\varepsilon^{1/\\alpha})$. 2. For non-integer $\\alpha > 1$, the sample complexity is $O(d^2/\\varepsilon^{1/\\alpha} + d^{1-1/\\alpha}/\\varepsilon^2)$ for Rényi entropy. Our upper bounds improve the quantum Rényi entropy estimators due to Acharya, Issa, Shende, and Wagner (2017) and the quantum Tsallis entropy estimators due to Chen, Liu, and Wang (2026), and match the lower bounds recently established by Wang (2026).", "url": "https://arxiv.org/abs/2608.18070", "type": "理论", "summary": "在本文中，我们提供了具有接近最优样本复杂度的量子 Rényi 和 Tsallis 熵估计器。具体来说，对于阶数 $\\alpha$、维度 $d$ 和加性误差 $\\varepsilon$，1。对于 $0 < \\alpha < 1$，样本复杂度为 $O(d^{1+1/\\alpha}/\\varepsilon^{1/\\alpha} + d^{1/\\alpha-1}/\\varepsilon^{2})$，对于 Rényi 熵和$O(d^{1+1/\\alpha}/\\varepsilon^{1/\\alpha} + d^{2-2\\alpha}/\\varepsilon^2)$ 表示 Tsallis 熵。特别是，对于 $0 < \\alpha \\leq 1/2$，两个熵的样本复杂度为 $O(d^{1+1/\\alpha}/\\varepsilon^{1/\\alpha})$。 2. 对于非整数 $\\alpha > 1$，对于 Rényi 熵，样本复杂度为 $O(d^2/\\varepsilon^{1/\\alpha} + d^{1-1/\\alpha}/\\varepsilon^2)$。我们的上限改进了 Acharya、Issa、Shende 和 Wagner (2017) 提出的量子 Rényi 熵估计量以及 Chen、Liu 和 Wang (2026) 提出的量子 Tsallis 熵估计量，并与 Wang (2026) 最近建立的下界相匹配。", "authors": [{"name": "Kean Chen"}, {"name": "Qisheng Wang"}], "featured_authors": [{"name": "Kean Chen"}, {"name": "Qisheng Wang"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
