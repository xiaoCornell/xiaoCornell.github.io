  <script>
    const papers = [{"id": "2611.21652", "category": "cond-mat", "title": "Exact solution of the two-dimensional one-component plasma on the truncated Beltrami pseudosphere", "abstract": "We solve exactly the two-dimensional one-component plasma at coupling $\\Gamma=2$ on the truncated Beltrami pseudosphere, a surface of constant negative curvature bounded by two parallels. A conformal map onto a flat cylinder leaves the particles interacting through the flat-cylinder potential, with the curvature entering only through the area element. The partition function becomes a product of incomplete gamma functions, the density is explicit, and all correlations are determinantal. Since the area is bounded, the large-N limit is taken at fixed shape. The free energy, obtained through the constant term with every coefficient in closed form, contains a bulk term (1/2)N ln N, a term linear in N, the flat hard-wall surface tension times the total boundary length, and a shape-dependent constant, with no ln N term. This is the conformal-anomaly prediction for Euler characteristic zero, tested here on a surface where the integrated Gaussian and boundary curvatures are separately nonzero and cancel. The expansion coincides term by term with the cylinder result of Shen and Forrester, whose universal constants are quadratures of the two boundary layers. At both walls the density tends to the flat contact value $n_b$ ln 2, from opposite sides, although the circumferences differ by a factor cosh u_max. We compare the asymptotics with the exact solution up to N=4096, and Monte Carlo simulations at $\\Gamma= $1, 4 and 6, validated against the exact $\\Gamma= $ 2 density, show how the boundary layers evolve with coupling.", "url": "https://arxiv.org/abs/2611.21652", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Josep Batle"}], "featured_authors": [{"name": "Josep Batle"}], "author_count": 1}, {"id": "2611.21675", "category": "cond-mat", "title": "Statistical Properties of the $q$-Deformed Monolayer and Bilayer Graphene", "abstract": "We investigate the statistical properties of the $q$-deformed Dirac oscillator for monolayer and bilayer graphene in the presence of a constant external magnetic field. Using $q$-deformed creation and annihilation operators, we obtain the corresponding energy spectra and eigenfunctions, as well as their probability current densities, recovering the conventional Landau-level structures in the undeformed limit. For bilayer graphene, the lowest Landau levels are explicitly constructed within the $q$-deformed framework. The partition functions for both systems are derived using zeta-function techniques and the Euler-Maclaurin formula, allowing us to determine their main thermodynamic quantities for small values of the deformation parameter. Our results show that the $q$-deformation modifies the energy spectra, the behavior of the probability current density components, and the thermodynamic response of the systems. A comparison between monolayer and bilayer graphene reveals distinct thermal behaviors, reflecting their different Landau-level structures and highlighting the influence of the $q$-deformation on their statistical properties.", "url": "https://arxiv.org/abs/2611.21675", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Omar Pedraza"}, {"name": "Erik Díaz-Bautista"}, {"name": "L. A. López"}, {"name": "Daniel O-Campa"}], "featured_authors": [{"name": "Omar Pedraza"}, {"name": "Erik Díaz-Bautista"}, {"name": "L. A. López"}, {"name": "Daniel O-Campa"}], "author_count": 4}, {"id": "2611.21676", "category": "cond-mat", "title": "Renormalization-Group Foundation of Critical Modes in Correlation Matrices", "abstract": "Based on the relevant scaling operators of renormalization-group theory, we establish a theoretical framework for constructing complete families of critical-sensitive fluctuation observables and their connected correlation matrices. The corresponding eigenstates of the correlation matrices reveal a hierarchy of multiscale critical correlation patterns and the leading normalized eigenvalues and their ratios show the finite-size scaling behavior. Applying this framework to the two-dimensional Ising model, the correlation matrices associated with both spin and energy operators are constructed. The resulting energy-sector eigenstate patterns, together with the scaling behavior of the leading eigenvalues, provide further support for the proposed framework. Finally, we discuss its potential extension to systems with unknown Hamiltonians.", "url": "https://arxiv.org/abs/2611.21676", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yanhua Zhang"}, {"name": "Mingmei Xu"}, {"name": "Jinghua Fu"}, {"name": "Yuanfang Wu"}], "featured_authors": [{"name": "Yanhua Zhang"}, {"name": "Mingmei Xu"}, {"name": "Jinghua Fu"}, {"name": "Yuanfang Wu"}], "author_count": 4}, {"id": "2611.21697", "category": "cond-mat", "title": "The Kitaev model on finite hyperbolic PBC clusters", "abstract": "We construct and solve the three-colored Kitaev model on finite hyperbolic lattices with periodic boundary conditions. We describe a self-contained procedure which uses finite quotients of orientation- preserving triangle groups to generate regular maps on compact genus-g surfaces. From these, one can extract their lattice connectivity, plaquette structure, homology cycles and Wilson sectors while implementing consistent boundary conditions. On the example of {8, 3} and {12, 3} lattices, we enumerate a selection of quotients with up to 72 vertices, which constitute the discrete steps in a finite-size scaling analysis. For the isotropic point, corresponding to the spin-liquid phase in the thermodynamic limit, we identify the ground state superselection sectors, quantify their deviation from the homogeneous {\\pi} flux sector and show how the selected flux background depends on the quotient geometry. We then discuss how the resulting ground state sector degeneracies are entirely generated by physical lattice symmetries acting on both the plaquette fluxes and non-contractible Wilson loops. Finally, we study the behaviour of the finite-size two-vison gap and matter fermion correlations. We find that the gap does not decrease monotonically with increasing system size, while one still recovers the expected algebraic decay of the correlations at the isotropic point, even for the considered modest system sizes.", "url": "https://arxiv.org/abs/2611.21697", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alberto Zorzato"}, {"name": "Jiri Minář"}], "featured_authors": [{"name": "Alberto Zorzato"}, {"name": "Jiri Minář"}], "author_count": 2}, {"id": "2611.21773", "category": "cond-mat", "title": "Hidden convexity of the Eliashberg condensation energy: existence, uniqueness and continuity of the superconducting state", "abstract": "Kiessling, Altshuler and Yuzbashyan conjectured the thermodynamic transition picture for the isotropic Eliashberg spin-chain functional with vanishing Coulomb pseudopotential: the normal state is the unique minimizer above and at a critical temperature, the superconducting minimizer below it is unique up to gauge, and the transition is continuous. We establish the nonlinear part of this picture. In the variables $\\rho_n=\\sin^2\\theta_n$, the condensation energy restricted to the first quadrant is strictly convex, and folding any admissible chain into that quadrant cannot increase its energy. For every positive, non-increasing interaction with power-law decay, hidden convexity and a compactness estimate give existence and uniqueness of the minimizer up to gauge. The normal state minimizes the energy exactly when its quadratic form is non-negative, including marginal stability. Among admissible chains, a positive solution of the nonlinear Eliashberg equations exists exactly when the normal state is linearly unstable and is then unique. For temperature-dependent families with pointwise continuity and locally uniform decay bounds, the minimizing density is continuous in a weighted $\\ell^1$ norm. Together with uniqueness of the linear-stability temperature, these results prove the thermodynamic conjectures for the $\\gamma$-model, Einstein phonons and general phonon spectra; the phonon applications use separately established spectral input. Finite-dimensional algebraic and convex-analytic components are machine-checked in Lean. The proofs were obtained independently of concurrent work that reaches overlapping conclusions.", "url": "https://arxiv.org/abs/2611.21773", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Davis Rens"}], "featured_authors": [{"name": "Davis Rens"}], "author_count": 1}, {"id": "2611.21876", "category": "cond-mat", "title": "Magnetic tuning of odd elastic instabilities in chiral active crystals", "abstract": "We investigate the dynamical properties of an odd active crystal whose elementary units follow an inertial dynamics and experience a Lorentz force induced by an external magnetic field. The continuous injection of energy associated with active chirality gives rise to odd elasticity, manifested through transverse forces between the crystal constituents. We show that the interplay between the magnetic field and these transverse forces produces a distinctive long-wavelength instability at vanishing wavevector, which is absent in both non-magnetic elastic crystals and passive crystals subjected to a magnetic field. Moreover, the magnetic field provides a means of tuning the collective oscillations of the crystal, enabling the emergence of exceptional points and tuning the dynamical instability induced by odd elasticity at finite wavevectors. Our analytical results yield explicit predictions for the displacement spectrum, static structure factor, and intermediate scattering function. These findings suggest that magnetic fields could provide a powerful tool for controlling collective phenomena in high-density systems of granular or colloidal spinners.", "url": "https://arxiv.org/abs/2611.21876", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Umberto Marini Bettolo Marconi"}, {"name": "Lorenzo Caprini"}], "featured_authors": [{"name": "Umberto Marini Bettolo Marconi"}, {"name": "Lorenzo Caprini"}], "author_count": 2}, {"id": "2611.22046", "category": "cond-mat", "title": "Coexisting orders and dipolar Luttinger liquids in $\\mathbb{Z}_N$ quantum torus chain", "abstract": "We establish a unified ground-state phase diagram for the one-dimensional $\\mathbb{Z}_N$ quantum torus chain, which is connected to dipolar cluster and dipolar Ising chains via noninvertible dualities. Combining tensor-network calculations with bosonization and perturbation theory, we establish a rich phase diagram governed by the local Hilbert-space dimension $N$ and its parity. We identify phases with coexisting $X$ and $Z$ long-range orders ($C$ phase), and dipolar Luttinger liquids (dLL$_{\\rm I}$ and dLL$_{\\rm II}$) separating coexisting phases from single-order phases. Gapless dipolar excitations coexist with long-range order in dLLs. Both the $C$ and dLL phases appear at $N \\geq 5$, but only the $C$ phases persist as $N\\to \\infty$. The stability of the dLL phase is understood by an emergent Luttinger liquid theory, with Berezinskii-Kosterlitz-Thouless transitions out of it driven by competing umklapp and clock anisotropy perturbations. For odd $N \\geq 5$, a third dLL phase (dLL$_{\\rm III}$) emerges near $\\theta = \\pi$ due to the low-energy dynamics inside the exponentially degenerate ground-state manifold that maps onto an effective XXZ chain. Duality considerations suggest a possible gapless dipolar symmetry-protected topological phase and spontaneous dipole-symmetry breaking in dipolar cluster chains.", "url": "https://arxiv.org/abs/2611.22046", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Seunghun Lee"}, {"name": "Seungho Lee"}, {"name": "Hyun-Yong Lee"}, {"name": "Jung Hoon Han"}], "featured_authors": [{"name": "Seunghun Lee"}, {"name": "Seungho Lee"}, {"name": "Hyun-Yong Lee"}, {"name": "Jung Hoon Han"}], "author_count": 4}, {"id": "2611.22073", "category": "cond-mat", "title": "Apparent contact angle equation for a dielectric droplet on a conductive hydrophilic surface in an electric field", "abstract": "A dielectric droplet resting on a conductive substrate elongates when a voltage is applied across the surrounding gap without touching the upper electrode. We construct a closed form theory of the equilibrium shapes by approximating the interface as a truncated spheroid with a single shape parameter and obtain the dimensionless electrostatic prefactor that corrects the free-space depolarization, based on the mirror symmetry across the substrate. Minimizing the resulting free energy along voltage ramps reproduces the boundary-element-method (BEM) equilibria, both the droplet height and the contact-line radius, with and without gravity, at negligible computational cost. An explicit apparent contact angle equation is found that collapses all the numerical calculation data. The configuration shows a behavior of fixed contact angle and an increasing apparent angle with the applied voltage, which is completely different from that of the Young--Lippmann equation.", "url": "https://arxiv.org/abs/2611.22073", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ren-Qiang Huang"}, {"name": "Gao-Xiao Jiang"}, {"name": "Zhong-Yi Li"}, {"name": "Rui Ma"}, {"name": "Chen-Xu Wu"}], "featured_authors": [{"name": "Ren-Qiang Huang"}, {"name": "Gao-Xiao Jiang"}, {"name": "Zhong-Yi Li"}, {"name": "Rui Ma"}, {"name": "Chen-Xu Wu"}], "author_count": 5}, {"id": "2611.22074", "category": "cond-mat", "title": "Electrostatic screening and nitrogen-vacancy charge states in boron-doped/nitrogen-doped diamond junctions", "abstract": "Boron-doped diamond (BDD) enables the integration of electrical functionality with nitrogen-vacancy (NV) centers, but the influence of junction electrostatics on NV charge-state stability remains unclear. In this study, we investigate the equilibrium electrostatics of BDD/nitrogen-doped diamond junctions using self-consistent Poisson-Fermi calculations. The results reveal two distinct electrostatic length scales in the nitrogen-doped substrate: a near-interface region of ionized donors that produces dominant band bending and determines the NV$^{0/-}$ charge-state boundary, and a much longer screening tail associated with weak donor ionization in the neutral bulk. The resulting NV$^-$ depletion depth depends strongly on the nitrogen concentration but exhibits a more moderate dependence on boron doping. At $N_B = 10^{21}$ cm$^{-3}$, varying the interface grading scale $w$ from 0.5 to 8 nm changes the depletion depth by approximately 22 nm, whereas variations in the modeled bulk BDD charge response produce a shift of only 1.27 nm. These results indicate that, under the conditions studied, the nitrogen donor concentration and local interface structure primarily govern the equilibrium NV charge-state profile, rather than the bulk electronic response of BDD alone.", "url": "https://arxiv.org/abs/2611.22074", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masato Koga"}, {"name": "Haizen Cho"}, {"name": "El Mustapha Mansouri"}, {"name": "Eikichi Kimura"}, {"name": "Ryo Matsumoto"}, {"name": "Yoshihiko Takano"}, {"name": "Keigo Arai"}], "featured_authors": [{"name": "Masato Koga"}, {"name": "Haizen Cho"}, {"name": "El Mustapha Mansouri"}, {"name": "Ryo Matsumoto"}, {"name": "Yoshihiko Takano"}, {"name": "Keigo Arai"}], "author_count": 7}, {"id": "2611.22209", "category": "cond-mat", "title": "Contact-number hyperuniformity at glass close packing in infinite dimensions", "abstract": "We investigate contact-number fluctuations of harmonic spheres near glass close packing (GCP), the amorphous jamming endpoint reached by compressing an ideal glass. Using replica theory, we show that the Gardner-unstable region shrinks toward jamming as the spatial dimension increases, allowing GCP to be approached along a stable one-step replica symmetry breaking branch in the high-dimensional limit. By coupling an external field to the local contact number, we derive the variance of the total contact number and the wave-number-dependent structure factor directly from the microscopic interactions. At GCP, the structure factor vanishes quadratically at small scaled wave numbers, demonstrating contact-number hyperuniformity. Upon weak compression above GCP, the structure factor develops a low-wave-number plateau whose height is proportional to the excess coordination. These results provide an analytical description of contact-number hyperuniformity and its breakdown upon compression.", "url": "https://arxiv.org/abs/2611.22209", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Harukuni Ikeda"}], "featured_authors": [{"name": "Harukuni Ikeda"}], "author_count": 1}, {"id": "2611.22229", "category": "cond-mat", "title": "Intrinsic second-order nonlinear Hall effect from perturbation theory", "abstract": "Nonlinear transport provides an efficient probe of the electronic structure and symmetry of quantum materials. As a prominent example, the intrinsic nonlinear Hall effect has attracted considerable attention in recent years because it is independent of impurity scattering and directly reflects the quantum geometry of Bloch electrons. Here we establish a simple textbook-style perturbation theory for the intrinsic nonlinear conductivity. Based on the well-defined Bloch-state velocity, our formulation perturbatively determines the field-corrected velocity and distribution function, from which the conductivity follows directly. We further compare our approach with wavepacket-based theories and discuss their consistency.", "url": "https://arxiv.org/abs/2611.22229", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhi-Hao Wei"}, {"name": "Xiao-Bin Qiang"}, {"name": "Renjie Tong"}, {"name": "Hai-Zhou Lu"}, {"name": "X. C. Xie"}], "featured_authors": [{"name": "Zhi-Hao Wei"}, {"name": "Xiao-Bin Qiang"}, {"name": "Renjie Tong"}, {"name": "Hai-Zhou Lu"}, {"name": "X. C. Xie"}], "author_count": 5}, {"id": "2611.22313", "category": "cond-mat", "title": "Supercell periodicity biases octahedral tilting and energetics in high-entropy perovskite oxides", "abstract": "Odd-period supercells such as $3 \\times 3 \\times 5$ are often used for equimolar five-component compositions in computational studies of high-entropy perovskite oxides (HEPOs). However, such cells are known to constrain octahedral tilting because they cannot accommodate all standard tilt patterns (Glazer tilt systems). How strongly this constraint affects HEPOs, whose octahedra respond to local cation environments, remains unclear. Here we show that supercell periodicity systematically biases computed octahedral tilting and energetics. Using a machine-learning interatomic potential, we compared odd-period and tilt-commensurate cells for 13 HEPOs. Odd-period cells yielded smaller and less coherent tilts and higher energies, even after configurational averaging. In ~1,700-atom cells, tilt differences persisted in all compositions and energy differences in most. The bias extended to defects, with lower oxygen vacancy formation energies in odd-period cells for strongly tilted compositions. Based on these findings, a simple design rule for equimolar supercells is proposed to lift this constraint.", "url": "https://arxiv.org/abs/2611.22313", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hanzo Tsubota"}, {"name": "Wai Kian Tan"}, {"name": "Hiroyuki Muto"}, {"name": "Atsunori Matsuda"}, {"name": "Tom Ichibha"}, {"name": "Kenta Hongo"}, {"name": "Ryo Maezono"}, {"name": "Liangzhi Kou"}, {"name": "Go Kawamura"}], "featured_authors": [{"name": "Hanzo Tsubota"}, {"name": "Wai Kian Tan"}, {"name": "Hiroyuki Muto"}, {"name": "Ryo Maezono"}, {"name": "Liangzhi Kou"}, {"name": "Go Kawamura"}], "author_count": 9}, {"id": "2611.22332", "category": "cond-mat", "title": "Mapping phase competition in GaAs under pressure and temperature", "abstract": "Pressure-induced transformations in GaAs offer a means to investigate the interplay between crystal structure, electronic behaviour, and phase stability in a technologically important III-V semiconductor. Here, we have used structure search algorithm combined with first-principles calculations and identified high-pressure competitive phases. The previously proposed $Imm2$ structure lies above the calculated minimum-enthalpy envelope. The static enthalpy calculations with the PBEsol functional predict the transition sequence $F\\bar{4}3m \\rightarrow Cmcm \\rightarrow I\\bar{4}m2 \\rightarrow C2/m \\rightarrow Amm2$, at approximately 12, 14, 34, and 69 GPa, respectively. The initial zinc blende to $Cmcm$ transition is accompanied by a volume reduction of approximately 17.5 % and metallization within the PBEsol description. Phonon calculations support the dynamical stability of all five phases at representative pressures, while elastic calculations characterize their mechanical response. Vibrational free energies are incorporated within the quasiharmonic approximation to examine phase competition over 0-80 GPa and 0-1000 K. These results identify competing high-pressure structures and connect their relative energetics with the electronic, vibrational, and elastic responses of compressed GaAs.", "url": "https://arxiv.org/abs/2611.22332", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sakshi Patel"}, {"name": "Paras Patel"}, {"name": "Prafulla K. Jha"}], "featured_authors": [{"name": "Sakshi Patel"}, {"name": "Paras Patel"}, {"name": "Prafulla K. Jha"}], "author_count": 3}, {"id": "2611.22336", "category": "cond-mat", "title": "Complex mobility edges from competing localization channels in non-Hermitian quasicrystals", "abstract": "Non-Hermitian localization transitions often accompany multiple mobility edges, but their physical origin can be ambiguous. To address the issue, we introduce an extension of the Ganeshan-Pixley-Das Sarma model with both asymmetric hopping and complex onsite potential, thereby incorporating a broad range of non-Hermitian quasiperiodic chains. Its solution reveals two energy-dependent localization contributions manifested as distinct Lyapunov growth scales, whose competition determines the structure of mobility edges. We derive exact Lyapunov exponents via Avila's global theory, obtain thresholds of the two channels on complex-energy plane, and formulate a selection rule that distinguishes physical mobility edges from suppressed analytical candidates. The channel that uniquely controls localization can switch with energy, producing complex mobility edges of non-Hermitian origins. Nonreciprocal hopping further shifts the thresholds and alters the bulk energy patterns. Numerical spectra and finite-size localization diagnostics confirm the theory. Our work thus provides a unified framework for characterizing phase transitions and mobility edges under competing localization mechanisms in non-Hermitian quasicrystals.", "url": "https://arxiv.org/abs/2611.22336", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bing Shao"}, {"name": "Weiwei Zhu"}, {"name": "Longwen Zhou"}], "featured_authors": [{"name": "Bing Shao"}, {"name": "Weiwei Zhu"}, {"name": "Longwen Zhou"}], "author_count": 3}, {"id": "2611.22419", "category": "cond-mat", "title": "Thermal radiation of nanowires and near-field interaction with substrates: exact computation and proximity approximation", "abstract": "Radiative heat transfer involving complex nano-objects is difficult to evaluate due to their sub-wavelength size, which induces deviation to macroscopic Planck's opaque surface-to-surface formalism, and due to the small distances involved, which lead to near-field radiative (photon tunneling) effects. As a result, thermal radiation has mostly been neglected in analyses of thermal transport in nanowires. Here, we report on calculations of thermal emission by single nanowires and on the radiative interaction between suspended silicon nanowires and flat substrates. We observe that metallic nanowires can be particularly emissive in comparison to wires made of other materials. While thermal emission from an isolated silicon nanowire is lower than Stefan-Boltzmann's prediction, the radiative exchange with a substrate can be larger by one order of magnitude. The considered configurations also allow benchmarking various levels of common or original approximations, including, in near field, the proximity approximation, the thickness-dependent PA, the electrostatic approach, and the effective emissivity in the far field.", "url": "https://arxiv.org/abs/2611.22419", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jose M. Sojo-Gordillo"}, {"name": "Ahmed Alwakil"}, {"name": "Olivier Merchiers"}, {"name": "Pierre-Olivier Chapuis"}], "featured_authors": [{"name": "Jose M. Sojo-Gordillo"}, {"name": "Ahmed Alwakil"}, {"name": "Olivier Merchiers"}, {"name": "Pierre-Olivier Chapuis"}], "author_count": 4}, {"id": "2611.22436", "category": "cond-mat", "title": "Confinement Alters Energy Relaxation in Subrecoil Laser Cooling", "abstract": "Controlling atomic motion through laser cooling requires both reducing kinetic energy and confining atoms to a finite spatial region. Here, we investigate how harmonic confinement modifies the long-time energy relaxation in subrecoil laser cooling. Using a stochastic scattering-rate model, numerical simulations, and an analytically tractable renewal approximation, we show that confinement qualitatively changes the asymptotic relaxation law. For a scattering rate that vanishes at low momentum as $R(p)\\propto |p|^\\alpha$, the change arises because confinement reshapes the phase-space geometry of rare, long trapping events. In free space, such events require only small momentum. Under harmonic confinement, however, position and momentum are coupled along phase-space orbits, restricting long-lived low-scattering trajectories to the vicinity of the phase-space origin. This geometric constraint modifies the trapping-time statistics, produces two dynamical crossovers, and leads to an optimal scattering-rate exponent of $\\alpha=4$ for the fastest asymptotic decay of the mean energy. Our results demonstrate that confinement changes the asymptotic energy-relaxation dynamics even when the local scattering law remains unchanged.", "url": "https://arxiv.org/abs/2611.22436", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daiki Kanbe"}, {"name": "Eli Barkai"}, {"name": "Takuma Akimoto"}], "featured_authors": [{"name": "Daiki Kanbe"}, {"name": "Eli Barkai"}, {"name": "Takuma Akimoto"}], "author_count": 3}, {"id": "2611.22488", "category": "cond-mat", "title": "Burgers vectors from Voronoi topology", "abstract": "Automated dislocation analysis is standard in atomistic simulations, yet current tools are limited to a handful of crystal structures. We introduce an algorithm without adjustable parameters, based on Voronoi topology, that identifies dislocations in a broad class of crystals. Each face shared by two cells that match the ideal crystal is taken as a step in it, and summing these steps around closed circuits of such cells yields exact Burgers vectors, without geometric templates. Tested on dislocations inserted into all 9,610 Materials Project structures whose Voronoi cells are stable with a wide margin, the algorithm finds every dislocation with its correct Burgers vector. In raw molecular-dynamics snapshots, including eleven dislocation types in $\\theta$-Al$_2$Cu and bcc iron up to its melting point, every Burgers vector it returns is correct, although near melting the dislocations merge into one cluster. Voronoi topology thus provides a natural language in which a crystal, its defects, and their Burgers vectors are all described.", "url": "https://arxiv.org/abs/2611.22488", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Emanuel A. Lazar"}], "featured_authors": [{"name": "Emanuel A. Lazar"}], "author_count": 1}, {"id": "2611.22489", "category": "cond-mat", "title": "Combined magnetic and structural transition state in first-principles calculations", "abstract": "We present a generalized nudged elastic band (NEB) implementation within potential-based constrained density-functional theory (cDFT) for calculating transition pathways that simultaneously optimize atomic, lattice, and magnetic degrees of freedom. Unlike standard fixed-cell NEB calculations restricted to atomic displacements, our framework consistently couples atomic forces, stresses, and spin torques. The method supports fixed- and variable-cell approaches for collinear and non- collinear magnetic configurations, by incorporating magnetic torques and generalized cell coordinates within the NEB optimization. To validate the methodology, we present benchmark calculations for representative magnetostructural systems. Specifically, we investigate the bcc-to-hcp transformation in Fe and the antiferromagnetic-to-ferromagnetic transition in FeRh using the variable-cell formalism. Furthermore, we examine spin-reversal processes in two-dimensional CrI3 to analyze the influence of spin-orbit coupling on transition paths and their associated energy barriers.", "url": "https://arxiv.org/abs/2611.22489", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Samare Rostami"}, {"name": "Xavier Gonze"}], "featured_authors": [{"name": "Samare Rostami"}, {"name": "Xavier Gonze"}], "author_count": 2}, {"id": "2611.22493", "category": "cond-mat", "title": "From the Full Fermionic Hilbert Space to the BCS Paired Subspace", "abstract": "Conventional Bardeen--Cooper--Schrieffer (BCS) and number-projected BCS variational treatments are formulated within a paired Hilbert subspace, where modes with opposite momenta and spins are either both empty or both occupied. Here we ask whether this paired subspace can itself be selected energetically from the full fermionic Hilbert space of the attractive reduced BCS model. Using conserved projectors that distinguish singly occupied states from empty and doubly occupied ones, we decompose the full Hilbert space into invariant sectors. A direct energy comparison between sectors shows that, at zero temperature, every ground state at fixed average particle number lies in the paired subspace. The same holds at fixed even particle number, with the comparison preserving the total particle number, while at fixed odd particle number one fermion remains unpaired, as required by parity. Within the resulting paired subspace, minimization over positive generalized-$P$ representations of pseudospin coherent states selects a common phase for the nonzero pair amplitudes and determines their magnitudes. BCS and number-projected BCS states arise as particular minimizers under the respective particle-number constraints.", "url": "https://arxiv.org/abs/2611.22493", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Guo-Jian Qiao"}, {"name": "Xin Yue"}, {"name": "C. P. Sun"}], "featured_authors": [{"name": "Guo-Jian Qiao"}, {"name": "Xin Yue"}, {"name": "C. P. Sun"}], "author_count": 3}, {"id": "2611.22500", "category": "cond-mat", "title": "Landscape index and its boundary correspondence in inhomogeneous chiral systems", "abstract": "We define a real-space topological index from the geometry of a quadratic landscape associated with the spatial dynamics, which is governed by the zero-energy eigenvalue equation of chiral systems. The landscape index remains invariant under continuous deformations preserving the uniform exponential separation between decaying and growing spatial solutions and equals the continuum winding number in the homogeneous limit. Across an inhomogeneous interface, the difference between the indices on the two sides equals the protected net chiral zero-mode count, without requiring asymptotically homogeneous bulk regions. Explicit landscape constructions yield analytical bounds on Hamiltonian parameters and their spatial gradients that determine the indices for all profiles satisfying these bounds, without specifying their detailed spatial form. Dimensional reduction extends the landscape index and its boundary correspondence to higher-dimensional systems. The resulting bounds guarantee protected radial zero modes in effective Kitaev-type systems of arbitrary transverse codimension and identify parameter and momentum regions supporting chiral edge states in periodically modulated quantum anomalous Hall systems. For the quasiperiodic interface considered, the index difference guarantees a single protected chiral branch despite persistent modulation on both sides, as confirmed by numerical calculations. Landscape geometry thus connects real-space topology to the protected net chirality of boundary states.", "url": "https://arxiv.org/abs/2611.22500", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Guo-Jian Qiao"}, {"name": "Zhi-Lei Zhang"}, {"name": "C. P. Sun"}], "featured_authors": [{"name": "Guo-Jian Qiao"}, {"name": "Zhi-Lei Zhang"}, {"name": "C. P. Sun"}], "author_count": 3}, {"id": "2611.22562", "category": "cond-mat", "title": "Few Dipolar Bosons in a Ring Trap: Quantum States and Transitions between Them", "abstract": "The degenerate dipolar Bose gas has attracted great research interest for studying novel quantum states of matter due to the interplay between short-range contact and long-range dipole-dipole interactions. The superfluid, quantum droplet, and supersolid states, along with the transition between them, have been widely studied using the extended mean-field theory, which relies on the Lee-Huang-Yang correction to approximately account for the effect of quantum fluctuation. In this work, we examine the system of a few dipolar bosons trapped in a ring potential employing the exact diagonalization method, which can yield the full quantum nature of the system. By examining the quantum correlation and coherence properties of the system, we reveal a rich variety of quantum states (including Wigner crystal, superfluid, quantum droplet, and the mixed states of them) and their formation mechanisms. Furthermore, we show that transitions between these quantum states can be induced by tuning the interaction strength and particle number. The findings of this work can provide valuable insights into the dipolar gas at the microscopic quantum level, and may also find applications in the fields such as quantum sensing and quantum information.", "url": "https://arxiv.org/abs/2611.22562", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jieli Qin"}], "featured_authors": [{"name": "Jieli Qin"}], "author_count": 1}, {"id": "2611.22573", "category": "cond-mat", "title": "Targeted material doping to enable the formation and coherent propagation of Laser Induced Periodic Surface Structures (LIPSS): the ZnO paradigm", "abstract": "This work explores how the initial free carrier density governs the formation and coherent propagation of Low Spatial Frequency Laser-Induced Periodic Surface Structures (LSF-LIPSS). As a paradigm we have analyzed the behavior of ad-hoc-doped ZnO films. ZnO is a multifunctional Transparent Conducting Oxide (TCO) with many scientific and technologic uses including applications in biomedicine, photonics, sensing or photocatalysis. Many of them would benefit from the use of large area, electrically anisotropic surfaces. By introducing small amounts of Yb3+ as donor dopant in ZnO films grown by Pulse Laser Deposition (PLD), we have substantially improved its carrier density at room temperature (RT) and its electrical conductivity while preserving the functional properties of pure ZnO. For RT carrier densities ne > 1019 cm-3, coherent propagation of LSF-LIPSS has been successfully achieved upon irradiation with 350 fs laser pulses at 1030 nm at high repetition rate (500 kHz) and for laser scanning speeds well above 1 m/s. However, the ablation mechanism (ZnO sublimation at the LIPSS valleys) and the large melting temperature of ZnO, make the thermal conductivity of the substrate, the film thickness and the irradiation pulse duration to play a crucial role in determining the morphology of the LSF-LIPPS propagated over large areas, especially in avoiding film cracking. The results achieved upon optimization fully confirm the role of free carrier density in the large-scale propagation of high quality LSF-LIPSS in doped ZnO and enable using these structures to easily generate large electrical anisotropies over macroscopic regions with conductivities along the LIPSS several times larger than transversally.", "url": "https://arxiv.org/abs/2611.22573", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gonzalo Gomez-Munoz"}, {"name": "Rocio Ariza"}, {"name": "Juan Francisco Ramos-Justicia"}, {"name": "Fatima Cabello Pardos"}, {"name": "Antonio Pablo Pérez-Marín"}, {"name": "Jose Gonzalo"}, {"name": "Belén Sotillo"}, {"name": "Binbing Xia"}, {"name": "Paloma Fernandez"}, {"name": "Javier Solis"}], "featured_authors": [{"name": "Gonzalo Gomez-Munoz"}, {"name": "Rocio Ariza"}, {"name": "Juan Francisco Ramos-Justicia"}, {"name": "Binbing Xia"}, {"name": "Paloma Fernandez"}, {"name": "Javier Solis"}], "author_count": 10}, {"id": "2611.22626", "category": "cond-mat", "title": "Prior-guided adaptive local refinement of foundation interatomic potentials", "abstract": "Foundation interatomic potentials enable simulations across diverse materials, but task-specific inaccuracies can require additional first-principles data. Obtaining these data is challenging when the relevant local environments arise in large simulation cells. Here we introduce the Prior-guided Adaptive Refinement Scheme (PARS), which identifies weakly supported environments during molecular dynamics by comparing their frozen representations with prototypes of pretraining environments, without requiring initial task labels or model ensembles. Selected environments are reconstructed as compact periodic cells for first-principles labelling and iterative refinement. Applications to phase stability, surface migration and vacancy clustering show improvements in target properties, including an 81% reduction in the mean absolute error of Ti vacancy-cluster energies per vacancy relative to the pretrained model. For Si/Ge, a foundation potential refined using 800 labelled cells containing 10-128 atoms is subsequently distilled into a compact potential without additional first-principles training labels. In simulations containing approximately 362,880 atoms, the distilled model predicts an interfacial thermal resistance consistent with that of a potential trained directly on density-functional theory data. These results demonstrate a route for adapting foundation potentials to target applications through local reference calculations.", "url": "https://arxiv.org/abs/2611.22626", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yunlong Wang"}, {"name": "Jianzhen Ma"}, {"name": "Yusu Zhang"}, {"name": "Jiahang Li"}, {"name": "Qinqiu Cheng"}, {"name": "Junjie Yuan"}, {"name": "Wenrui Yan"}, {"name": "Yucheng Zhang"}, {"name": "Chen Yu"}, {"name": "Weibin Chu"}, {"name": "Hongxia Hao"}, {"name": "Jielan Li"}], "featured_authors": [{"name": "Yunlong Wang"}, {"name": "Jianzhen Ma"}, {"name": "Yusu Zhang"}, {"name": "Weibin Chu"}, {"name": "Hongxia Hao"}, {"name": "Jielan Li"}], "author_count": 12}, {"id": "2611.22662", "category": "cond-mat", "title": "Domain walls of a spin-chirality ferroelectric as tunable quantum particles", "abstract": "In frustrated spin chains with competing nearest- and next-nearest-neighbor exchange, the vector spin chirality sets the electric polarization, so a ferroelectric domain wall is a domain wall of the chirality. The semiclassical picture suggests nonlocal switching dynamics due to topological constraints on the spins, but little is known about such domain walls in a quantum spin chain. Using density-matrix renormalization group calculations for a frustrated spin-1/2 XXZ chain in which a bond alternation $\\delta$ opens a spin gap, we show that the wall then becomes a quantum particle. In a finite chain, it has the energy levels and wave functions of a particle in a box, and it moves under an electric field as a particle under a constant force does. In the infinite chain, its mass grows by more than two orders of magnitude as $\\delta$ decreases and diverges at $\\delta^*\\approx0.012$, where the bottom of its band becomes flat; below $\\delta^*$ the band has two degenerate minima away from its center. The large mass results from a near cancellation of in-plane and out-of-plane exchange energies.", "url": "https://arxiv.org/abs/2611.22662", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Aleksandr Buzdakov"}, {"name": "Atharva Hingane"}, {"name": "Sergey Artyukhin"}], "featured_authors": [{"name": "Aleksandr Buzdakov"}, {"name": "Atharva Hingane"}, {"name": "Sergey Artyukhin"}], "author_count": 3}, {"id": "2611.22712", "category": "cond-mat", "title": "Bypassing the Entropy Production Speed Limit of State-to-State Transitions with Adaptive Resetting", "abstract": "State-to-state transitions in colloids and cold atoms (trap compression, bit erasure) are often achieved through driving, whose speed and entropy production are constrained by a fundamental bound. We show that this bound can be surpassed by changing the transport mechanism. Adaptive resetting enables transitions through nonlocal jumps, with rates learned from reset-free trajectories. A hybrid protocol, combining resetting with a switch to the target potential, surpasses the diffusive bound in three transformations. Finally, we derive a speed limit governing coupled diffusion-reset dynamics.", "url": "https://arxiv.org/abs/2611.22712", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daniel B. K. Chu"}, {"name": "Rémi Goerlich"}, {"name": "Itamar Steinitz"}, {"name": "Yael Roichman"}, {"name": "Barak Hirshberg"}], "featured_authors": [{"name": "Daniel B. K. Chu"}, {"name": "Rémi Goerlich"}, {"name": "Itamar Steinitz"}, {"name": "Yael Roichman"}, {"name": "Barak Hirshberg"}], "author_count": 5}, {"id": "2611.22839", "category": "cond-mat", "title": "Axion electrodynamics and the advection-diffusion structure of TEM modes in hollow-conductor waveguides", "abstract": "We present a systematic investigation of transverse electromagnetic (TEM) modes in hollow-conductor waveguides filled with a dielectric medium described by axion electrodynamics. While such modes do not propagate in conventional single-conductor waveguides, the coupling of the axion field to an external magnetic field enables their propagation. We show that the resulting TEM modes are governed by an advection-diffusion-type equation for the transverse electrostatic potential, establishing a direct mathematical connection between axion electrodynamics and advection-diffusion phenomena. We illustrate this connection through explicit solutions and field profiles for cylindrical waveguides, considering uniform and rigid rotational drift fields, both individually and in combination, as well as different values of the parameter controlling the advection-to-diffusion ratio (Péclet number). These results establish a transport-based framework for understanding how spatial variations of the axion-electrodynamics background shape the transverse electromagnetic fields in hollow-conductor waveguides.", "url": "https://arxiv.org/abs/2611.22839", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "André H. Gomes"}], "featured_authors": [{"name": "André H. Gomes"}], "author_count": 1}, {"id": "2611.22858", "category": "cond-mat", "title": "AlCoCuFeNi High-Entropy Alloy Nanoparticle Melting and Solidification: A Classical Molecular Dynamics Simulation Study", "abstract": "The processes of melting and solidification of an AlCoCuFeNi high-entropy alloy nanoparticle with a diameter of about 10 nm were studied by classical molecular dynamics simulation using an embedded atom model potential. Three cooling rates, 10^11, 10^12, and 10^13 K/s, were considered. Melting and crystallization behavior were characterized through the temperature dependence of the potential energy. Structural evolution was analyzed using adaptive common-neighbor analysis (CNA) and radial distribution functions (RDF). The results show that the final structure changes from amorphous to crystalline as the cooling rate decreases. A pronounced temperature hysteresis associated with melting and crystallization was also observed.", "url": "https://arxiv.org/abs/2611.22858", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "O.I. Kushnerov"}], "featured_authors": [{"name": "O.I. Kushnerov"}], "author_count": 1}, {"id": "2611.22877", "category": "cond-mat", "title": "Temperature Flips the Sign of the Hydrogen Response in Nanogranular Palladium Networks", "abstract": "In nanogranular palladium networks, hydrogen uptake has two opposing effects on electrical resistance. Absorbed hydrogen scatters electrons within the particles, raising their resistance, while particle expansion narrows the gaps between them and lowers the junction resistance. Such networks are widely studied as resistive hydrogen sensors, and the sign of their net response is usually treated as a fixed property of the architecture. In networks grown by atomic layer deposition on macroporous silicon, we show that changing the operating temperature can reverse this sign at a fixed hydrogen concentration. A thermodynamic model indicates that scattering contributes less as temperature rises, allowing sub-angstroem changes in gap width to dominate. Where the two effects cancel, the network absorbs hydrogen yet gives the same reading as in hydrogen-free gas, so a leak could escape detection. Between 25 and 40 degrees Celsius, this cancellation point is predicted to rise over tenfold, crossing reported leak-alarm setpoints. At 55 degrees Celsius, the measured response stays negative but passes through a minimum, so a concentration above a setpoint can mimic one below it. Annealing at 200 degrees Celsius alters the calibration and turns the room-temperature response negative at the lowest concentration tested. Quantitative sensing therefore requires a defined thermal pretreatment and an operating temperature giving distinct signals across the intended concentration range. Response polarity becomes an operating parameter rather than a fixed property. More broadly, any nanoparticle network whose particles deform on sorption may show the same temperature-dependent competition between transport within and between particles, with implications for sensors and switches beyond palladium-hydrogen.", "url": "https://arxiv.org/abs/2611.22877", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Niclas Alkazaz"}, {"name": "Robert Zierold"}, {"name": "Patrick Huber"}], "featured_authors": [{"name": "Niclas Alkazaz"}, {"name": "Robert Zierold"}, {"name": "Patrick Huber"}], "author_count": 3}, {"id": "2611.22928", "category": "cond-mat", "title": "Non-Invertible Quantum Cellular Automata I: Microscopic Definition of Non-Invertible Symmetries", "abstract": "We introduce non-invertible quantum cellular automata (QCAs), defined as locality-preserving quantum channels that are dualizable and pure. This provides an operator-algebraic definition of non-invertible symmetries of quantum lattice systems, formulated in terms of their action on local operators. Focusing on quantum spin chains, we motivate these defining conditions and conjecture that every such quantum channel admits a realization by dualizable topological defects or, equivalently, by dualizable sequential quantum circuits. We construct a broad class of examples, including on-site non-invertible symmetries that are anomalous, as well as higher-dimensional examples. In Part II of this work, we reconstruct topological defects whose boundary algebras yield an index theory that classifies non-invertible QCAs up to blend equivalence.", "url": "https://arxiv.org/abs/2611.22928", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sahand Seifnashri"}, {"name": "Shu-Heng Shao"}], "featured_authors": [{"name": "Sahand Seifnashri"}, {"name": "Shu-Heng Shao"}], "author_count": 2}, {"id": "2611.22938", "category": "cond-mat", "title": "From quasiperiodic three-colour order on a triangular lattice to covalent carbon sheets", "abstract": "Can the quasiperiodic colouring of a lattice be encoded in the bonds of a single carbon sheet? We construct golden-, silver- and bronze-mean three-colour patterns on a triangular lattice. The positions of one colour determine the other two through a nearest-neighbour rule. The three patterns have eight, nine and seven first-shell environments, respectively. A triangle of three identical motifs frustrates the alternating bond ports of each of the three molecular alphabets in the golden and silver patterns. The bronze pattern admits four designs with direct or ethynylene connections. Three periodic structures reproduce its infinite environment frequencies in a local-energy model. For a 708-atom sheet with independently matched environment counts, the predicted energy lies 0.295 meV per carbon below the density-functional result. Across four periodic cells initialized from two smaller donors, relaxation changes the bond lengths by at most 0.00113 angstroms in root-mean-square terms. Fitting one 60-degree sector to relaxed periodic geometries gives complete sixfold-symmetric fragments with up to 22,140 carbon atoms. In the 13,950-atom directly linked sheet, a $\\pi$ doublet places 79.05% of its weight in a boundary shell comprising 7.96% of the atoms, whereas the lowest unoccupied doublet places only 0.124% there. These calculations connect a testable motif-selection rule to the energetics and finite-patch spectra of candidate quasiperiodic carbon sheets.", "url": "https://arxiv.org/abs/2611.22938", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chaoyu He"}], "featured_authors": [{"name": "Chaoyu He"}], "author_count": 1}, {"id": "2611.22966", "category": "cond-mat", "title": "Polymer adsorption on vicinal surfaces", "abstract": "While polymer adsorption is theoretically well established on flat surfaces --- and somewhat understood on rough surfaces --- the common and practically relevant case of nearly flat stepped surfaces remains poorly studied. Here, we address this gap via extensive simulations of flexible polymer chains grafted at the step edge of vicinal surfaces. For wide terraces, the polymer-step interaction yields a stable step-attached (SA) phase, alongside the desorbed and terrace-adsorbed (TA) phases, all of them separated by continuous transition lines that meet at a multicritical point previously unanticipated in polymer thermodynamics. This scenario is observed for terrace widths $\\mathcal{W} \\gtrsim 3 R_g^{(2D)}$, being $R_g^{(2D)}$ the radius of gyration of TA polymers. Simpler phase diagrams, absent this multicriticality, are found for $\\mathcal{W} \\lesssim 3 R_g^{(2D)}$, where a simple crossover exists between the SA and TA phases. The presence of kinks at the steps does not alter these behaviors. Besides their theoretical relevance, these findings unveil an interesting route to produce polymer nanowires and control polymer conformation via step attachment-detachment on designed stepped surfaces.", "url": "https://arxiv.org/abs/2611.22966", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nathann T. Rodrigues"}, {"name": "Tiago J. Oliveira"}], "featured_authors": [{"name": "Nathann T. Rodrigues"}, {"name": "Tiago J. Oliveira"}], "author_count": 2}, {"id": "2611.22978", "category": "cond-mat", "title": "Quasiconformal geometry and elastic anisotropy in liquid crystals", "abstract": "Unequal splay and bend elastic constants endow planar nematic liquid crystals with a director-dependent anisotropic geometry. Here, we show that this geometry is quasiconformal: the magnitude of the associated Beltrami coefficient is fixed by the elastic constants, while its phase depends on the director relative to a compatible rotating frame introducing an SO(2) spin connection. We construct explicit maps for a hybrid-aligned film and isolated defect textures, generalizing the conformal construction of isotropic defects. These results provide a new insight into the classical Dzyaloshinskii defect solutions, which are shown to define an auxiliary reference cone on which the defect texture is quasiconformally distorted before being projected conformally into physical space. Numerical simulations of constrained +2 defects reveal core morphologies consistent with the quasiconformal geometry. Our results suggest that quasiconformal maps provide a broader geometric language for anisotropy in liquid crystals and other materials.", "url": "https://arxiv.org/abs/2611.22978", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Timothy J Atherton"}], "featured_authors": [{"name": "Timothy J Atherton"}], "author_count": 1}, {"id": "2611.23002", "category": "cond-mat", "title": "Indentation of pre-tensioned cortex-like fibre networks: tension, local stretching and the signature of defect architecture", "abstract": "Indentation is widely used to infer the mechanical state of biological materials like the actomyosin cortex. It reduces a single force-indentation curve to an apparent modulus. The cortex, however, is a pre-tensioned, heterogeneous fibre network. We show that this inference is ambiguous. The same amount of weakening can leave the indentation force unchanged or lower it tenfold, depending on where it lies relative to the probe. The force reflects how the probe couples to the tensioned, load-bearing structure, not the amount of weakening. We combine molecular dynamics simulations of a pressure-loaded, crosslinked fibre network indented by a rigid sphere with a continuum membrane solution. We represent the simulated force-depth response by a two-term fit, $F\\propto a\\delta+b\\delta^{3/2}$, with $a$ reflecting the global tension, and $b$ the stiffening with depth. At a fixed fraction of weakened bonds, diffuse weakening lowers the force by a factor of about 1.5. A weak cluster beneath the probe lowers it 8-12-fold, because the slack cluster decouples the probe from the tension. When the clusters are displaced from the contact, the force returns to within 15% of the healthy value. Two opposite effects cancel. The clusters soften the whole layer, which lowers its tension and the force. But they also channel the load through the intact network beneath the probe, which stiffens it locally and raises the force. The shape of the curve retains what the force level hides. The coefficient $a$ reflects the softened layer when clusters beside the probe keep the force near the healthy value. The local exponent $\\alpha=\\mathrm{d}\\ln F/\\mathrm{d}\\ln\\delta$ increases with depth in every configuration except when a cluster lies beneath the probe, where the two-term form no longer applies. Detecting localised weakening requires spatial sampling and analysis of the curve shape, not a single fitted modulus.", "url": "https://arxiv.org/abs/2611.23002", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shubham Agarwal"}, {"name": "Olivier Noël"}, {"name": "Martin H. Müser"}], "featured_authors": [{"name": "Shubham Agarwal"}, {"name": "Olivier Noël"}, {"name": "Martin H. Müser"}], "author_count": 3}, {"id": "2611.23008", "category": "cond-mat", "title": "Dynamical theory of the East model. II. A path-probability formalism", "abstract": "We develop a dynamical theory of the East model---a one-dimensional, hierarchically constrained kinetic Ising model---based on path-probability densities. This theory yields an infinite but closed set of equations for single-spin path-probability densities, which, after Laplace transformation, become algebraic difference equations. To render the theory tractable, we introduce a systematic factorization approximation in which the joint probability densities of consecutive flip intervals are factorized into lower-order joint probability densities. We implement the first-order single-interval factorization approximation, obtain a closed set of four equations for the persistence functions, and solve them numerically. The resulting time correlation functions and relaxation times agree closely with Monte Carlo simulations and with the two-domain-basis approximation of the Zwanzig--Mori formalism over a wide range of temperatures, although both approximations fail to capture the exact low-temperature asymptotic super-Arrhenius scaling of the relaxation time. The present formalism provides a plausible foundation for a complete and rigorous theoretical description of the dynamics of the East model and offers a promising route toward generalization to other systems.", "url": "https://arxiv.org/abs/2611.23008", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chong Zha"}, {"name": "Yuliang Jin"}], "featured_authors": [{"name": "Chong Zha"}, {"name": "Yuliang Jin"}], "author_count": 2}, {"id": "2611.23016", "category": "cond-mat", "title": "Ab initio Engineering of Topological Superconductivity in Substrate-Supported Magnetic Chains", "abstract": "In this paper, we employ a combination of several first-principles-based approaches to systematically scan chains of several types of magnetic atoms in different chain geometries on top of various overlayers on the Nb(110) surface, to develop a pathway to engineer topological Majorana edge states. Using atomistic spin-model calculations, we first identify a rich variety of magnetic configurations, including ferromagnetic, antiferromagnetic, spin-spiral, and exotic up-up-down-down states stabilized solely within a second-order Heisenberg model. In the next step, we solve the Bogoliubov-de Gennes equations using a band-theoretical method. Depending on the magnetic structure and atomic configuration, the superconducting spectra may exhibit topologically trivial minigaps, broad overlapping Shiba bands, or localized zero-energy edge states accompanied by sizable topological minigaps. In particular, Fe chains on Ag/Nb(110) are found to display pronounced signatures associated with topological superconductivity, including strongly localized zero-energy edge states and indications of Shiba band inversion. We further demonstrate that changes in the spin structure or a small amount of spatial relaxation can substantially modify the superconducting band structure and the localization properties of the edge states.", "url": "https://arxiv.org/abs/2611.23016", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "András Lászlóffy"}, {"name": "Balazs Ujfalussy"}], "featured_authors": [{"name": "András Lászlóffy"}, {"name": "Balazs Ujfalussy"}], "author_count": 2}, {"id": "2611.23029", "category": "cond-mat", "title": "Spin and Orbital Angular Momentum Textures at Chiral Molecule-Metal Interfaces", "abstract": "Chiral molecular adsorption can modify the spin and orbital character of metal surface states, providing an electronic-structure basis for interpreting spin-dependent interfacial phenomena. Using first-principles calculations with spin-orbit coupling, band unfolding, and an atom-projected orbital angular momentum (OAM) analysis, we investigate spin and OAM textures at chiral heptahelicene/Au(111) interfaces and compare them with clean Au (111) and an achiral coronene/Au system. Adsorption changes the orientations of the spin and OAM vectors and reduces the sampled OAM magnitudes of Au-derived surface states near the Fermi level. The two heptahelicene enantiomers exhibit textures related by mirror and time-reversal symmetries, whereas the comparison with coronene identifies changes that also occur without molecular chirality. These results clarify how molecular adsorption modifies interfacial spin and orbital character and establish symmetry constraints relevant to chirality-dependent photoemission.", "url": "https://arxiv.org/abs/2611.23029", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gyanu P. Kafle"}, {"name": "Amos Afugu"}, {"name": "Zhen-Fei Liu"}], "featured_authors": [{"name": "Gyanu P. Kafle"}, {"name": "Amos Afugu"}, {"name": "Zhen-Fei Liu"}], "author_count": 3}, {"id": "2611.23065", "category": "cond-mat", "title": "Quasi-long-range order in the quantum XY model on Sierpiński gaskets", "abstract": "Fractal geometry has recently been shown to enhance the amplitude of the superconducting order parameter, but the fate of the superconducting phase on such lattices is far less clear. Classical XY models on finitely ramified fractals have no finite-temperature transition, as the energy of a vortex stays bounded as the system grows. However, that statement concerns an infinite gasket and thermal vortices, while real fractal structures are finite by construction. It also leaves open what happens at $T = 0$, where the phase competes not with temperature but with its own quantum fluctuations. In this work we address whether superconducting phase coherence survives at $T=0$. %Whether coherence survives those is the prior question, and the one we address here. To that end, we study the spin-$1/2$ XY ferromagnet, the phase sector of a Josephson network with at most one Cooper pair per island, thus capturing the maximum effect of quantum phase fluctuations, on both triangular and honeycomb Sierpiński gaskets. By using vision-transformer neural quantum states optimized by variational Monte Carlo, we reach generations up to $G = 5$, that is $366$ sites for the triangular gasket and $609$ for the honeycomb one, well beyond the reach of exact diagonalization. We find that the transverse two-point correlator decays algebraically, $C_{xy}(r) \\sim r^{-\\eta}$ with $\\eta \\simeq 0.12\\!-\\!0.32$, independent of distance measured along the graph, along the fractal boundary, or in the embedding plane. Quantum phase fluctuations thus leave quasi-long-range order intact in the ground state. We further discuss the implication of these results for the superconducting response of a finite gasket at low but nonzero temperature.", "url": "https://arxiv.org/abs/2611.23065", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Robert Canyellas"}, {"name": "Jannes van Poppelen"}, {"name": "Annica M. Black-Schaffer"}, {"name": "Mikhail I. Katsnelson"}, {"name": "Andrey A. Bagrov"}], "featured_authors": [{"name": "Robert Canyellas"}, {"name": "Jannes van Poppelen"}, {"name": "Annica M. Black-Schaffer"}, {"name": "Mikhail I. Katsnelson"}, {"name": "Andrey A. Bagrov"}], "author_count": 5}, {"id": "2611.23092", "category": "cond-mat", "title": "Memory kernel and closure for systems driven by intermittent forcing with power-law waiting times", "abstract": "Many systems are controlled by intermittent control variables that take on a random value for a random time interval. In the presence of such noise at update steps, the main equation for the controlled variables has a memory kernel whose coefficients are the cumulants, also known as $G$-cumulants, of the noise, which are fully ordered in time. In the case of Poisson switching, these correspond to the Boolean cumulants of the jump distribution, and the kernel can be summed exactly. We derive an exact decomposition of these coefficients for any waiting-time distribution with independent amplitudes and durations, which separates the jump statistics from the renewal statistics. In the case of waiting times that follow a power-law distribution with a finite mean, it is highly probable that a long time interval will be covered by a single period, and we have shown that, as a result, the coefficients for long delays intersect in all orders, from Boolean cumulants to the usual moments of the jump law. The long-lag kernel thus becomes a superposition of frozen deterministic flux kernels, weighted by the expression $\\xi^2p(\\xi)$, and from this the corresponding main equation in closed form follows. For $2<\\mu<3$, where the noise correlation time is infinite, the second-order closure retains a finite error even in the presence of slow dynamics, whereas the main equation of the frozen flows in this limit yields an exact stationary mean value. The telegraphic process is the only case of noise with renewal steps for which second-order conclusions are exact. An exactly solvable model with additive and correlated multiplicative noise confirms these predictions.", "url": "https://arxiv.org/abs/2611.23092", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Marco Bianucci"}, {"name": "Riccardo Mannella"}], "featured_authors": [{"name": "Marco Bianucci"}, {"name": "Riccardo Mannella"}], "author_count": 2}, {"id": "2611.23107", "category": "cond-mat", "title": "Spontaneous axis formation through defect fusion in active nematics", "abstract": "Initially spherical embryos break symmetry to establish a body axis. Topological defects in tissue nematic order have been implicated in axis formation, but the physical mechanisms underlying defect organization in active materials remain unclear. We study an active nematic fluid on a sphere using a fully covariant hydrodynamic theory that ensures thermodynamic consistency in the passive limit. We find that, in compressible systems, active nematic traction drives a spontaneous transition from the equilibrium configuration of four separated +1/2 defects to two antipodal +1 defects through pairwise fusion. The resulting state defines an axis, with aster or vortex textures at the poles depending on the flow-nematic coupling. These results identify a physical mechanism by which active forces reorganize topological defects to establish an axis on a spherical surface.", "url": "https://arxiv.org/abs/2611.23107", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mathieu Dedenon"}, {"name": "Claire A. Dessalles"}, {"name": "Aurélien Roux"}, {"name": "Karsten Kruse"}], "featured_authors": [{"name": "Mathieu Dedenon"}, {"name": "Claire A. Dessalles"}, {"name": "Aurélien Roux"}, {"name": "Karsten Kruse"}], "author_count": 4}, {"id": "2611.23121", "category": "cond-mat", "title": "Specific heat in the BCS-rashbon BEC crossover regime of an ultracold Fermi gas with a 3D spherical spin-orbit coupling", "abstract": "We theoretically investigate strong-coupling properties of an ultracold Fermi gas with a tunable spherical (isotropic) spin-orbit interaction. In this spin-orbit coupled system, it is known that a two-body bound state, called rashbon, can be formed even in the coupling regime where a pairing interaction alone cannot form such a two-body bound molecule. In this paper, we evaluate the specific heat at constant volume $C_V$, including pairing fluctuations in the presence of SOC within the framework of the strong-coupling theory developed by Nozières and Schmitt-Rink, to show that this thermodynamic quantity is very useful to see how system properties vary from a Fermi gas to a rashbon gas with increasing spin-orbit coupling strength. At the superfluid phase transition temperature $T_{\\rm c}$, $C_V$ is found to exhibit a peak structure in the intermediate spin-orbit coupling regime between the weak-coupling Fermi gas regime and a strong-SOC rashbon gas regime. In the normal state above $T_{\\rm c}$, from detailed analyses of the temperature dependences of $C_V$, we also identify the regions where system properties are dominated by (1) a Fermi atomic gas, (2) a Bose gas of stable rashbons, and (3) fluctuating rashbons. Combining these results with the conventional Bardeen-Cooper-Schrieffer (BCS)--Bose-Einstein condensation (BEC) crossover physics realized by tuning the strength of a pairing interaction, we present a unified description of the BCS--BEC and BCS--rashbon BEC crossover phenomena.", "url": "https://arxiv.org/abs/2611.23121", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yusuke Okajima"}, {"name": "Koki Takemoto"}, {"name": "Shumpei Iwasaki"}, {"name": "Yoji Ohashi"}], "featured_authors": [{"name": "Yusuke Okajima"}, {"name": "Koki Takemoto"}, {"name": "Shumpei Iwasaki"}, {"name": "Yoji Ohashi"}], "author_count": 4}, {"id": "2611.23160", "category": "cond-mat", "title": "Localized corrosion resistance of ultrafine-grained austenitic steel 321 obtained by Rotary Swaging: The role of annealing conditions", "abstract": "The object of this study was austenitic steel 321, which has an ultrafine-grained (UFG) structure formed by Rotary Swaging (RS). RS leads to the formation of a two-phase macroscopically heterogeneous and, at the same time, a microscopically homogeneous UFG structure with an increased content of martensite. It has been shown that secondary TiC nanoparticles form in the annealing at 450-550C, the reverse transformation of martensite into austenite occurs at 550-650C, and recrystallization begins at 700C. Electrochemical studies of the resistance of the UFG steel to general corrosion, intergranular corrosion (IGC), and pitting corrosion (PC) have been carried out. It has been shown that the UFG steel after RS has a reduced IGC resistance. The surface of steel rods after RS has a reduced hardness and corrosion resistance compared to the central part of the rods. It has been shown that in the temperature range of 450-550C, there is a slight increase in the microhardness, and a significant decrease in the IGC and PC resistance of the UFG steel. Recrystallization at 700-800C leads to an increased PC resistance and IGC resistance. Annealing conditions have been determined that ensure a good combination of strength, ductility and corrosion resistance of the UFG steel. It was demonstrated that to explain the non-monotonic variation in the localized corrosion rate of UFG steel during annealing, it is necessary to consider not only the well-known effects of martensite and delta-ferrite, but also the precipitation of TiC particles and the changes in the free energy of non-equilibrium grain boundaries.", "url": "https://arxiv.org/abs/2611.23160", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. V. Nokhrin"}, {"name": "M. K. Chegurov"}, {"name": "N. V. Melekhin"}, {"name": "D. A. Zotov"}, {"name": "V. I. Kopylov"}, {"name": "A. N. Sysoev"}, {"name": "K. A. Rubtsova"}], "featured_authors": [{"name": "A. V. Nokhrin"}, {"name": "M. K. Chegurov"}, {"name": "N. V. Melekhin"}, {"name": "V. I. Kopylov"}, {"name": "A. N. Sysoev"}, {"name": "K. A. Rubtsova"}], "author_count": 7}, {"id": "2611.23167", "category": "cond-mat", "title": "Dynamics of a Single-Domain Dissipative Magnetic Gyroscope in Electric and Magnetic Fields", "abstract": "We formulate the coupled spin--rotation dynamics of a single-domain symmetric top ferromagnetic needle (a magnetic gyroscope) in static magnetic and electric fields. The conservative Hamiltonian contains the rotational kinetic energy, the magnetocrystalline and shape anisotropy, the Zeeman energy, the electrostatic energy of the dipole induced in the conducting needle, the linear magnetoelectric coupling, and the relativistic motional (spin-orbit) coupling. Gilbert damping is introduced, and in an electric field, Debye relaxation of the induced electric dipole of the conducting needle also results in dissipation. We give the equations of motion in the laboratory and body-fixed frames, with singularity-free quaternion kinematics. For a 120-nm-long single-domain cobalt needle in a 0.5~T field we find: (i) because the anisotropy field ($\\approx 1.3$~T) exceeds the applied magnetic field, the spin reverses direction several times during the initial Gilbert-damping transient, and the parity of the number of reversals determines whether the easy axis ends up parallel or antiparallel to the spin; (ii) after the transient the needle librates about the field---precession accompanied by nutation at twice the precession frequency---with a period of about 20~ns, consistent with the libration period $2\\pi(I_1/\\mu B)^{1/2}$, while the Zeeman and rotational kinetic energies oscillate out of phase and the total energy is conserved; (iii) a static electric field $\\mathbf E$ exerts on the conducting needle a shape-dependent polarization torque that tends to align the long axis of the needle with $\\mathbf E$. The torques due to the magnetoelectric interaction and motional magnetic fields ($\\lesssim1~\\mu$T) are negligible compared with the polarization torque. A conducting needle can therefore serve as a magnetometer only if $E\\ll E_c$.", "url": "https://arxiv.org/abs/2611.23167", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Y. B. Band"}, {"name": "Igor Kuzmenko"}], "featured_authors": [{"name": "Y. B. Band"}, {"name": "Igor Kuzmenko"}], "author_count": 2}, {"id": "2611.23170", "category": "cond-mat", "title": "Competing Magnetic Orders and Continuously Varying Exponents in $U(1)$ Spin Liquids", "abstract": "Unequal couplings to a common emergent gauge field provide a continuous way to tune competing magnetic instabilities in an effective description of $U(1)$ spin-liquid mixtures. We study this mechanism in quantum electrodynamics in 2+1 dimensions with two families of four-component Dirac fermions. Combining a leading large-$N$ treatment with Schwinger--Dyson equations, we obtain chiral condensates representing Néel order in the two sectors. At fixed fermion number, the coupling ratio $\\kappa=e_2^2/e_1^2$ controls which condensates develop. Depending on $N$, the phases with a single condensate are connected through either coexistence or a finite interval in which both fermion families remain gapless. The mass-generation thresholds are reciprocal, and the fermion gaps close with Miransky essential singularities. The renormalization group flow has a circular line of fixed points parametrized by the invariant ratio $\\kappa$. At the calculated order, gauge-invariant staggered magnetization correlations have continuously varying exponents in the gapless regime, while the exponent for correlations between the two sectors is independent of $\\kappa$. These results connect the competition between magnetic orders to a continuous family of critical theories and identify magnetic correlation signatures of the intervening gapless regime.", "url": "https://arxiv.org/abs/2611.23170", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vira Shyta"}, {"name": "Flavio S. Nogueira"}], "featured_authors": [{"name": "Vira Shyta"}, {"name": "Flavio S. Nogueira"}], "author_count": 2}, {"id": "2611.23171", "category": "cond-mat", "title": "Richtmyer-Meshkov instability induced by a Gaussian-kicked rotor-like potential in a three-component Bose-Einstein condensate", "abstract": "This research investigates the Richtmyer-Meshkov instability within a three-component Bose-Einstein condensate. We offer a kicking potential that replicates the impulsive shock across both interfaces of the three-component BEC to trigger the Richtmyer-Meshkov instability. We propose a hydrodynamic model that indicates the essential criteria for the onset of hydrodynamic instability in the BEC through the application of the hydrodynamic pressure equation. We utilise the split-step Crank-Nicolson method to numerically solve the coupled Gross-Pitaevskii equations, with the objective of obtaining the immiscible ground state of all components in a quasi-2D harmonic trap. Following this, we introduce a Gaussian-like disruption instigated by the kick rotor model at both interfaces of the confined three-component BEC to explore the time-dependent development of nonlinear hydrodynamic instability patterns, culminating in quantum turbulence and nonlinear configurations at the interfaces. The kinetic energy spectra of both the incompressible and compressible elements of the system exhibit scaling in the low-wavenumber domain with power-law exponents of $-5/3$ and $1$, respectively. Conversely, the high-wavenumber domain is defined by $k^{-4}$ and $k^{-7/2}$ scaling for the incompressible and compressible elements, respectively, aligning with the established spectral characteristics of quantum turbulence. This research offers fresh perspectives on the mechanisms of hydrodynamic instability, vortex generation, non-equilibrium pattern evolution, and quantum turbulence in superfluid systems comprising multiple interacting elements.", "url": "https://arxiv.org/abs/2611.23171", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Susovan Giri"}], "featured_authors": [{"name": "Susovan Giri"}], "author_count": 1}, {"id": "2611.23178", "category": "cond-mat", "title": "Photon condensation driven by scalar spin chirality", "abstract": "Gauge invariance forbids equilibrium photon condensation for spatially uniform electric-dipole coupling, motivating alternative routes based on orbital magnetic response. We show that triangular molecular magnets coupled to a cavity support photon condensation driven by emergent scalar spin chirality. Starting from the half-filled Hubbard model in the Mott regime, we derive an effective Hamiltonian in which virtual ring exchange couples the cavity flux directly to scalar spin c
