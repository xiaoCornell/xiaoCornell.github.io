hirality. Mean-field theory, collective-fluctuation calculations, and finite-size exact diagonalization reveal a phase with spontaneous chirality ordering and a macroscopic cavity displacement, together with hybrid chirality-photon excitations. The condensation threshold can be tuned electrically through the molecular chirality splitting. Our results establish emergent orbital degrees of freedom in frustrated magnets as a route to equilibrium light-matter ordering beyond conventional dipolar cavity quantum electrodynamics.", "url": "https://arxiv.org/abs/2611.23178", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dimitrije Stepanenko"}, {"name": "Daniel Loss"}, {"name": "Mircea Trif"}], "featured_authors": [{"name": "Dimitrije Stepanenko"}, {"name": "Daniel Loss"}, {"name": "Mircea Trif"}], "author_count": 3}, {"id": "2611.23183", "category": "cond-mat", "title": "Effect of superplastic deformation on the intergranular corrosion resistance of austenitic steel 321 with different types of UFG structure: A case of homogeneous and heterogeneous microstructure obtained by ECAP", "abstract": "The effects of superplasticity (SP) on the structure, hardness, and intergranular corrosion (IGC) resistance of UFG 321L steel are reported. By increasing the number of the ECAP cycles (N) and varying the ECAP temperature, and annealing temperature, the degree of the microstructural heterogeneity was changed. Regardless of the microstructural homogeneity degree, UFG steels demonstrated the possibility of realizing the SP effect at temperatures below the onset temperature of dynamic recrystallization. The dependence of ductility of the UFG steel on the test temperature is non-monotonic with a minimum at 450-600C. The maximum elongation to failure (~250%) was achieved at a SP temperature of 800C. The SP deformation of the UFG steel is controlled by the power law creep. It is shown that the hardness of UFG steel samples after SP is equal than the hardness of UFG steels annealed at the same temperature. It is also shown what SP leads to a decrease in the IGC resistance of the UFG steel. Heterostructured steel have reduced ductility, as well as lower resistance to IGC after tension tests at room temperature (RT). The minimum IGC resistance is ensured at N=2, and the maximum - at N=4. The IGC resistance of homogeneous UFG samples after tension testing exceeds the IGC resistance of coarse-grained steel. Tension test at a RT has the greatest negative effect on the IGC resistance of heterostructured steel, and the least negative effect on the IGC resistance of homogeneous steel. Increasing the number of ECAP cycles enhances the ductility of the UFG steel at 750-900C. Increasing the ECAP temperature results in a simultaneous decrease in ductility and flow stress. Heterostructured steel exhibits minimal values of the activation energy of SP deformation. Increasing the number of ECAP cycles and increasing the ECAP temperature lead to an increase in the activation energy of SP deformation.", "url": "https://arxiv.org/abs/2611.23183", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. V. Nokhrin"}, {"name": "V. I. Kopylov"}, {"name": "M. K. Chegurov"}, {"name": "S. V. Shotin"}, {"name": "C. V. Likhnitskii"}, {"name": "N. V. Melekhin"}, {"name": "D. A. Zotov"}, {"name": "K. A. Rubtsova"}, {"name": "O. E. Pirozhnikova"}, {"name": "N. N. Berendeev"}, {"name": "D. D. Kulagin"}], "featured_authors": [{"name": "A. V. Nokhrin"}, {"name": "V. I. Kopylov"}, {"name": "M. K. Chegurov"}, {"name": "O. E. Pirozhnikova"}, {"name": "N. N. Berendeev"}, {"name": "D. D. Kulagin"}], "author_count": 11}, {"id": "2611.23224", "category": "cond-mat", "title": "From nonlocal correlations to local symmetry breaking: Asymmetry dynamics of crosscap states", "abstract": "Under unitary dynamics preserving a global symmetry, bipartite entanglement typically grows while an initially broken symmetry is locally restored. Here, we show that this conventional scenario can be reversed when symmetry-breaking coherence is initially encoded in long-range entanglement. We investigate this phenomenon in a family of charge deformed crosscap states, characterized by antipodal entangled pairs with tunable entanglement and symmetry breaking. We first characterize their static properties, finding a Page-like entanglement profile and an entanglement asymmetry that vanishes for subsystems smaller than half the system size, but grows logarithmically for larger subsystems. For symmetric subsystems, we also analyze the symmetry-resolved entanglement and investigate how it evolves as the subsystem is continuously deformed away from a symmetric partition. Following a quench to a free-fermion tight-binding chain, we uncover an unconventional dynamics in which the entanglement entropy decreases whereas the entanglement asymmetry increases, so that initially symmetric subsystems dynamically develop local symmetry breaking. This behavior is quantitatively captured by a quasiparticle picture describing the propagation of antipodal correlations. Our results reveal how symmetry-preserving dynamics can redistribute globally encoded symmetry-breaking coherence, making it locally accessible, and establish the initial entanglement structure as a key ingredient in determining the fate of local symmetries out of equilibrium.", "url": "https://arxiv.org/abs/2611.23224", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Konstantinos Chalas"}, {"name": "Pasquale Calabrese"}, {"name": "Colin Rylands"}], "featured_authors": [{"name": "Konstantinos Chalas"}, {"name": "Pasquale Calabrese"}, {"name": "Colin Rylands"}], "author_count": 3}, {"id": "2611.21711", "category": "hep-th", "title": "Isomorphisms of Class S Theories with IndexLab", "abstract": "We use IndexLab to scan untwisted and twisted class $\\mathcal{S}$ constructions based on ADE Lie algebras of rank up to seven, as well as $A_8$ and $E_8$. We consider surfaces of genus at most three with up to five punctures, covering 167,244,647 constructions in total. To find candidate pairs of isomorphic theories, we compare Schur and Hall-Littlewood indices, Weyl anomalies, Coulomb branch spectra, and flavor data. We set aside pairs explained by known mechanisms, leaving a catalogue of 5,278 candidate pairs. Recurring changes in rank, puncture labels, and twists suggest families of candidate isomorphisms. We group 99.58% of the pairs into 25 families and 6 finite families. IndexLab is available at this http URL .", "url": "https://arxiv.org/abs/2611.21711", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhihao Duan"}, {"name": "Zhenghao Zhong"}], "featured_authors": [{"name": "Zhihao Duan"}, {"name": "Zhenghao Zhong"}], "author_count": 2}, {"id": "2611.21713", "category": "hep-th", "title": "An infrared-safe $S$-matrix for $\\mathcal N=4$ super Yang-Mills", "abstract": "Scattering amplitudes of massless gauge theories are not observables: they are infrared divergent, and the standard regulators are tied either to perturbation theory or the planar limit. We study $\\mathcal N=4$ super Yang-Mills theory on rigid AdS$_4$ with Dirichlet boundary conditions, where the role of the amplitude is played by correlation functions of boundary operators. These are finite, and they are defined at any coupling and for any gauge group. Among them, the four-point function of the flavor-current supermultiplet is the counterpart of the $2\\to2$ amplitude of the elementary supergluon states, and arguably the simplest non-trivial observable of the theory. In this paper, we compute it at weak coupling to one loop. The tree-level correlator follows directly from the microscopic theory, and the one-loop correlator, which we obtain from AdS unitarity, takes a remarkably simple form in Mellin space. In the flat-space limit, it reproduces the one-loop scattering amplitude, with the infrared divergences re-emerging as logarithms.", "url": "https://arxiv.org/abs/2611.21713", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Maria Nocchi"}, {"name": "Leonardo Rastelli"}], "featured_authors": [{"name": "Maria Nocchi"}, {"name": "Leonardo Rastelli"}], "author_count": 2}, {"id": "2611.21717", "category": "hep-th", "title": "'Forward-backward' flows and integration cycles for semiclassical Euclidean gravity", "abstract": "Integrating Euclidean semiclassical gravity over real Riemannian metrics is subtle due to the conformal factor problem. A perturbative prescription was given by Gibbons-Hawking-Perry (GHP) where the integration contour for the conformal perturbations is rotated to be imaginary. A potential non-perturbative remedy is that the integration cycles associated to semiclassical saddle points should be deformed into the space of complex metrics in the sense of Picard-Lefschetz theory. Here we propose a non-perturbative construction of such complex integration cycles. This employs a 'forward-backward' gradient flow of the Einstein-Hilbert action, starting at a saddle point, along which the action has monotonically increasing real part and constant imaginary part. The flow is not parabolic. In a neighbourhood of a saddle point, the real part of the conformal factor flows forward and that of the conformal class backwards, with the opposite true of their imaginary parts. Starting the flow at a saddle point, then roughly speaking, one specifies the real part of the conformal class and the imaginary part of the conformal factor at the end of the flow. Solving the flow one finds the complex metrics along a one parameter path within the integration cycle of that saddle, and varying this final data generates the integration cycle, the Lefschetz thimble of the saddle point. We find that near to a real saddle point this reproduces the GHP prescription. We characterise the neighbourhood of a saddle where such forward-backward flows may exist, finding a weaker restriction than that of Kontsevich-Segal-Witten. We numerically demonstrate flows explicitly for 4-dimensional gravity, constructing sections through the integration contours for the saddles given by Euclidean de Sitter, and for Schwarzschild in a cavity.", "url": "https://arxiv.org/abs/2611.21717", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nicholas M. K. Ross"}, {"name": "Toby Wiseman"}], "featured_authors": [{"name": "Nicholas M. K. Ross"}, {"name": "Toby Wiseman"}], "author_count": 2}, {"id": "2611.21722", "category": "hep-th", "title": "Cosmic Censorship in the Landscape of SUSY-Broken AdS Vacua", "abstract": "We investigate signatures of weak cosmic censorship in non-supersymmetric vacua of both IIA and IIB string theory. In particular, we examine the Penrose Inequality, which can be proven holographically using Ryu-Takayanagi, and can be independently proven in SUSY AdS vacua for spherically symmetric initial data. We prove that any EFT of scalars coupled to gravity in AdS, including in particular those of string compactifications, satisfies both the Penrose Inequality and a positive mass theorem if a function that we call a \"weak fake superpotential\" exists. We demonstrate that this condition is satisfied globally for the DGKT skew-whiffed vacua in IIA. Since there is no known nonperturbative instability in this DGKT vacuum, this provides evidence that the IIA SUSY-broken AdS vacua may be absolutely stable. We also find the weak fake superpotential exists locally in field space in some SUSY-broken AdS vacua in a KKLT construction in IIB. Thus, within the framework considered here, some false SUSY-broken KKLT AdS vacua are stable against vacuum decay. Conversely, we find that some KKLT vacua do not have a weak fake superpotential, and correspondingly violate the Penrose Inequality and fail to have a positive mass theorem; the DGKT vacua only violate the Penrose Inequality in the presence of designer gravity boundary conditions. In all cases studied, this is due to false vacuum decay. We discuss the implications of these violations for holography and black hole thermodynamics in these SUSY-broken AdS vacua.", "url": "https://arxiv.org/abs/2611.21722", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Netta Engelhardt"}, {"name": "Richard Nally"}], "featured_authors": [{"name": "Netta Engelhardt"}, {"name": "Richard Nally"}], "author_count": 2}, {"id": "2611.21724", "category": "hep-th", "title": "Localization identities for spectral determinants: two-dimensional QCD and Ising field theory", "abstract": "Spectral determinants encode the meson spectra of planar two-dimensional QCD and of Ising field theory in the two-particle Bethe-Salpeter approximation. We derive localization identities for these determinants which express their logarithmic derivatives with respect to the spectral parameter in terms of Baxter $Q-$functions evaluated at special points, proving previously conjectured relations. Our derivation uses finite-rank commutation relations and virial identities of the underlying integral spectral operators. We identify a sufficient rational closure condition on the symbol of these operators that extends localization to a broader class of spectral problems and determines the evaluation points. Applications include generalized two-dimensional QCD with a quartic gauge-field potential and symbols interpolating between the QCD and Ising cases. We also give a general construction of the spectral operators and establish conditions for the finite-rank reduction on which localization relies.", "url": "https://arxiv.org/abs/2611.21724", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bercel Boldis"}, {"name": "Nikolay Gromov"}, {"name": "Gregory P. Korchemsky"}, {"name": "Alessandro Testa"}], "featured_authors": [{"name": "Bercel Boldis"}, {"name": "Nikolay Gromov"}, {"name": "Gregory P. Korchemsky"}, {"name": "Alessandro Testa"}], "author_count": 4}, {"id": "2611.21725", "category": "hep-th", "title": "All-Genus 2D $\\mathcal{N}=1$ Superconformal Blocks", "abstract": "We develop a numerical algorithm for two dimensional $\\mathcal{N}=1$ superconformal blocks at arbitrary genera, in arbitrary plumbing channels, and for arbitrary spin structures. The algorithm utilizes two commuting copies of Virasoro subalgebras of the direct sum of the $\\mathcal{N}=1$ superconformal algebra with an auxiliary free fermion algebra, which allows us to reduce the $\\mathcal{N}=1$ superconformal blocks to Virasoro conformal blocks.", "url": "https://arxiv.org/abs/2611.21725", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sam Christian"}, {"name": "Yuchen Wang"}, {"name": "Xi Yin"}, {"name": "Yutai Zhang"}], "featured_authors": [{"name": "Sam Christian"}, {"name": "Yuchen Wang"}, {"name": "Xi Yin"}, {"name": "Yutai Zhang"}], "author_count": 4}, {"id": "2611.21726", "category": "hep-th", "title": "Not All Holographic Entropy Inequalities Are Free of Area Law Ultraviolet Divergences", "abstract": "In the AdS/CFT correspondence, linear constraints on subsystem entropies, which are necessary conditions for the validity of the Ryu-Takayanagi proposal, define the holographic entropy cone. We disprove a prior claim that all holographic constraints of this type are free of area law divergences (superbalanced). We analyze one explicit counterexample and explain how to easily find more; we report signatures of $\\mathcal{O}(10^5)$ counterexamples. Our findings invalidate multiple prior claims and conjectures.", "url": "https://arxiv.org/abs/2611.21726", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xin-Xiang Ju"}, {"name": "Bartlomiej Czech"}], "featured_authors": [{"name": "Xin-Xiang Ju"}, {"name": "Bartlomiej Czech"}], "author_count": 2}, {"id": "2611.21727", "category": "hep-th", "title": "Supersymmetric warped AdS$_3$ solutions in eleven-dimensional supergravity", "abstract": "We construct new families of supersymmetric solutions of eleven-dimensional supergravity by deforming the half-BPS $\\mathrm{AdS}_3\\times \\mathrm{S}^3_+\\times \\mathrm{S}^3_-\\times\\mathbb R^2$ background. We consider lightlike, spacelike and timelike warpings of the anti-de Sitter factor, accompanied by deformations of the two three-spheres, and determine the supporting four-form fluxes and the constraints imposed by the equations of motion. In particular, the deformation parameters of the two spheres are necessarily equal, although their radii need not coincide. We compute the conserved charges and determine the preserved supersymmetries and Killing superalgebras. Generic lightlike solutions preserve four real supercharges, whereas spacelike and timelike solutions preserve eight, with a Killing superalgebra containing a single exceptional $\\mathfrak d(2,1;\\alpha)$ factor.", "url": "https://arxiv.org/abs/2611.21727", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ruggero Noris"}], "featured_authors": [{"name": "Ruggero Noris"}], "author_count": 1}, {"id": "2611.21730", "category": "hep-th", "title": "Gravity/Thermodynamics Correspondence for Generic Dynamical Spacetimes", "abstract": "Working within covariant phase space formalism, we establish \\textit{gravity-thermodynamics correspondence} for generic dynamical spacetimes. We derive local first and second laws of thermodynamics on general null boundaries, for generic non-stationary solutions to Einstein gravity {with minimally coupled matter} for physical observers that we carefully specify. Entropy variation, which receives contribution only from the gravitational sector, is the surface charge variation associated with a vector field generating the null boundary, and temperature is its non-affinity parameter (divided by $2\\pi$). The statement of the second law in our setting is that the entropy variation evaluated along the null vector field is strictly non-negative for the admissible positive-non-affinity clock and matter satisfying the null energy condition. Our dynamical entropy variation, which is non-integrable for generic non-stationary solutions, becomes integrable in near-stationary configurations, reproducing the Hollands--Wald--Zhang dynamical entropy formula. Strikingly, this local second law holds even when the boundary area is decreasing, disentangling thermodynamic irreversibility and the second law from standard area theorems. Our first-principles construction demonstrates that gravitational thermodynamics requires neither a stationary background, teleological event horizons, nor an exact entropy state function on individual codimension-1 spacelike slices of the null boundary (codimension two in spacetime).", "url": "https://arxiv.org/abs/2611.21730", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vahid Reza Shajiee"}, {"name": "Mohammad Mehdi Sheikh-Jabbari"}, {"name": "Vahid Taghiloo"}], "featured_authors": [{"name": "Vahid Reza Shajiee"}, {"name": "Mohammad Mehdi Sheikh-Jabbari"}, {"name": "Vahid Taghiloo"}], "author_count": 3}, {"id": "2611.21739", "category": "hep-th", "title": "Modular Hamiltonian and modular flow of a massive scalar in an interval", "abstract": "We obtain the vacuum modular Hamiltonian of a free massive scalar in an interval, for any $mL$. Its eigenvectors are superpositions of massive plane waves emitted from the two end points, with amplitudes given by a linear integral equation whose Neumann series is an expansion in reflections, and a normalization fixed by a Painlevé V transcendent. We follow the modular flow of initially localized wave packets inside the causal diamond. The flow is not geometric: the commutator profiles spread and can develop peaks ahead of the conformal trajectory.", "url": "https://arxiv.org/abs/2611.21739", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Raúl E. Arias"}, {"name": "Daniel Fondevila"}], "featured_authors": [{"name": "Raúl E. Arias"}, {"name": "Daniel Fondevila"}], "author_count": 2}, {"id": "2611.21743", "category": "hep-th", "title": "Center anomalies without twists: torsion, exact degeneracies, and condensates", "abstract": "Mixed center anomalies are usually exposed by 't Hooft's twisted boundary conditions in a Hamiltonian formalism. On $\\mathbb {RP}^3$, torsion makes the twist unnecessary: a center operator on the untwisted $SU(2)$ Hilbert space anticommutes with time reversal in Yang-Mills theory at $\\theta=\\pi$ and with the chiral symmetry of super Yang-Mills theory, so every level is at least doubly degenerate. The relevant semiclassical object is the BPST instanton, which descends to a charge-$\\tfrac12$ saddle on the orbifold $\\mathbb R^4/\\mathbb Z_2$. We complete it in two ways: applying a conformal transformation maps the orbifold to $\\mathbb R\\times\\mathbb {RP}^3$, with the saddle describing the tunneling event between the two center sectors; by resolving the orbifold singularity, we obtain the Eguchi-Hanson space, which gives the gaugino condensate at its weak-coupling value.", "url": "https://arxiv.org/abs/2611.21743", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mohamed M. Anber"}], "featured_authors": [{"name": "Mohamed M. Anber"}], "author_count": 1}, {"id": "2611.21750", "category": "hep-th", "title": "Modular conjugations for thermal states and second worlds", "abstract": "The modular conjugation $J$ maps an algebra of observables onto its commutant. For the vacuum on a Rindler wedge it is a spacetime reflection, but for thermal states in two-dimensional CFTs the known expressions involve chiral fields at the complex points $x\\pm i\\beta/2$, interpreted as belonging to a ``second world''. Here we compute $J$ for the geometric thermal state in explicit cyclic purifications, using either the vacuum vector, through the conformal map to a Rindler wedge, or a vector in the natural cone of a local algebra. The modular images are then fields at real points, and complex coordinates arise only when operators of the commutant outside the image of the thermal representation are written as fields on the original spacetime. For the chiral $U(1)$ current we also purify by doubling the Fock space, obtain explicit formulas for $J$, show that this purification coincides with Sorce's canonical purification, and treat all primary thermal states.", "url": "https://arxiv.org/abs/2611.21750", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alan Garbarz"}, {"name": "Gabriel Palau"}, {"name": "Guillem Pérez-Nadal"}], "featured_authors": [{"name": "Alan Garbarz"}, {"name": "Gabriel Palau"}, {"name": "Guillem Pérez-Nadal"}], "author_count": 3}, {"id": "2611.21751", "category": "hep-th", "title": "From Top to Bottom: Quark Mass Hierarchies in Heterotic String Theory", "abstract": "Standard Model fermion masses exhibit large hierarchies, spanning more than five orders of magnitude in the quark sector alone. In this paper, we study whether these hierarchies can be generated perturbatively at tree level in smooth heterotic Calabi-Yau compactifications, where the supergravity approximation remains under computational control. In such backgrounds, physical Yukawa couplings combine holomorphic superpotential integrals with matter field Kahler metrics. The former can be computed algebraically, while the latter require solving a coupled system of partial differential equations for the Ricci-flat metric, Hermitian Yang-Mills connections, and harmonic bundle-valued forms. Within this framework, we identify two new tree-level mechanisms by which complex structure moduli can generate fermion mass hierarchies and show analytically and numerically that both mechanisms are obstructed for previously studied tetra-quadric models. Motivated by these obstructions, we scan the existing databases of tens of thousands of complete intersection Calabi-Yau line bundle models and find a unique smooth quotient admitting a rank-three up-quark Yukawa matrix at tree level. Evaluating the physical couplings on this manifold and evolving them under the renormalization group, we obtain realistic mass hierarchies for the top, charm, up, and bottom quarks in the smooth supergravity regime.", "url": "https://arxiv.org/abs/2611.21751", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuri Chervonyi"}, {"name": "Fabian Ruehle"}, {"name": "Nenad Tomasev"}], "featured_authors": [{"name": "Yuri Chervonyi"}, {"name": "Fabian Ruehle"}, {"name": "Nenad Tomasev"}], "author_count": 3}, {"id": "2611.21754", "category": "hep-th", "title": "Giant gravitons without giant gravitons", "abstract": "We demonstrate that the partition function of a free bosonic $U(N)$ multi-matrix model admits a giant graviton expansion. For $d$ matrices, there are $d$ distinct giant gravitons, and the expansion can be characterized by a $d$-node quiver with bifundamentals connecting the nodes. This suggests the intriguing possibility of a more generalized holography where models without any obvious gravitational dual can nevertheless be given a dual brane interpretation. The giant graviton expansion of this multi-matrix model is somewhat unconventional though, as the giant graviton partition functions will necessarily have intrinsic $N$-dependence.", "url": "https://arxiv.org/abs/2611.21754", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Blake J. Bottesi"}, {"name": "James T. Liu"}], "featured_authors": [{"name": "Blake J. Bottesi"}, {"name": "James T. Liu"}], "author_count": 2}, {"id": "2611.21787", "category": "hep-th", "title": "FLZ integrability in the 't Hooft model", "abstract": "We study the 't Hooft equation describing mesons in large-$N_c$ two-dimensional QCD with arbitrary unequal quark masses. Using its Fredholm formulation and the associated Baxter finite-difference equation, we investigate the relations between spectral determinants and canonical Baxter $Q$-functions. We derive special-point identities for the Baxter solutions by exploiting finite-rank commutator relations of the underlying integral operators. We also determine the spectral residues of the inhomogeneous solutions and obtain exact expressions for eigenfunction normalization factors in terms of values at distinguished complex points. These results establish the unit-residue property of the Baxter expressions entering the Fateev-Lukyanov-Zamolodchikov (FLZ) spectral-determinant identities. As a further application, we prove the nondegeneracy of the meson spectrum for arbitrary unequal quark masses. We further identify a broader class of integral operators exhibiting the same mechanism, which we refer to as FLZ integrability, and illustrate its applicability to the meson spectral problem in Ising field theory. Our approach reveals a connection between the analytic structure of Baxter equations and the theory of completely integrable Fredholm operators.", "url": "https://arxiv.org/abs/2611.21787", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexey Litvinov"}, {"name": "Egor Shestopalov"}, {"name": "Nikita Slavnov"}], "featured_authors": [{"name": "Alexey Litvinov"}, {"name": "Egor Shestopalov"}, {"name": "Nikita Slavnov"}], "author_count": 3}, {"id": "2611.21842", "category": "hep-th", "title": "Simple Models of Thermal Order in $2+1$ Dimensions", "abstract": "Heating need not destroy order. We show that it persists to arbitrarily high temperatures in simple quantum field theories in $2+1$ spacetime dimensions. In a $\\mathbb Z_2\\times\\mathbb Z_2$ model of two real scalar fields, a sufficiently negative mixed quartic coupling drives one field to condense, spontaneously breaking its $\\mathbb Z_2$ symmetry. When coupled to massless Dirac fermions through a Yukawa interaction, this condensate generates a fermion mass, thereby spontaneously breaking parity and time-reversal symmetries. We extend this construction to a $\\mathbb Z_2\\times O(n)$ scalar model, in which the Mermin-Wagner theorem precludes spontaneous breaking of the continuous $O(n)$ symmetry at finite temperatures. Nevertheless, for $n=2$, a Berezinskii-Kosterlitz-Thouless superfluid phase persists to arbitrarily high temperatures. In this phase, spatial correlations decay algebraically, with an exponent that approaches zero as the temperature increases. For $n\\geq 3$, we uncover a further unexpected feature of these models: the characteristic size of ordered domains grows asymptotically with temperature, revealing an unusual enhancement of spatial correlations upon heating. We establish our results using a controlled high-temperature expansion, with selected findings corroborated by numerical functional renormalization group analysis. The simplicity of the field content in these models provides a promising starting point for exploring experimental realizations of persistent thermal order in thin-film materials.", "url": "https://arxiv.org/abs/2611.21842", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Michael Smolkin"}, {"name": "Lev Yung"}], "featured_authors": [{"name": "Michael Smolkin"}, {"name": "Lev Yung"}], "author_count": 2}, {"id": "2611.21843", "category": "hep-th", "title": "Structure Constants of Planar N=4 SYM at Any Coupling", "abstract": "We recast a recent conjecture for structure constants in planar N=4 supersymmetric Yang-Mills theory in a separation-of-variables-inspired form suitable for non-perturbative analysis. All state-dependent information enters through the quantum spectral curve. As a showcase, we compute at finite coupling the three-point functions of two half-BPS operators and the spin-two member of the Konishi multiplet. Our results span weak to strong coupling, reproduce the known perturbative and string-theory limits, and are consistent with conformal-bootstrap bounds. We also obtain new six- and seven-loop perturbative coefficients and extract new strong-coupling data from high-precision numerical fits.", "url": "https://arxiv.org/abs/2611.21843", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Simon Ekhammar"}, {"name": "Alessandro Georgoudis"}, {"name": "Nikolay Gromov"}], "featured_authors": [{"name": "Simon Ekhammar"}, {"name": "Alessandro Georgoudis"}, {"name": "Nikolay Gromov"}], "author_count": 3}, {"id": "2611.22107", "category": "hep-th", "title": "Regular/Singular Black Hole Thermodynamics from Renormalised Volume/Area", "abstract": "We study the finite mismatch between the holographically and topologically renormalised Euclidean actions of the four-dimensional AdS C-metric. Starting from the relation between Renormalised Volume and the Einstein sector of Conformal Gravity, we separate the regular curvature contribution from the contributions supported on the two conical axes. After introducing the usual Euler normalisation for smooth manifolds, the residual difference between the regular action evaluations is determined by the tension-weighted Euler terms of the renormalised worldsheet area. We identify this difference with the Gauss--Bonnet entropy contribution at the polar conical points of the horizon. The ordinary Euler characteristic remains fixed, while the deficits determine how its curvature representation is divided between regular and singular contributions. At fixed total string tension, the difference of the renormalised worldsheet areas per unit Euclidean time determines the relative tension work, giving a geometric interpretation of the relative thermodynamic length.", "url": "https://arxiv.org/abs/2611.22107", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gabriel Arenas-Henriquez"}, {"name": "Rodrigo Olea"}, {"name": "David Rivera-Betancour"}], "featured_authors": [{"name": "Gabriel Arenas-Henriquez"}, {"name": "Rodrigo Olea"}, {"name": "David Rivera-Betancour"}], "author_count": 3}, {"id": "2611.22570", "category": "hep-th", "title": "Non-integrability of open strings via Pohlmeyer reduction", "abstract": "We study integrable and non-integrable boundary conditions for classical strings from the point of view of Pohlmeyer reduction. We first consider the integrable case of strings ending on Y=0 non-maximal giant gravitons. Pohlmeyer reduction of such strings leads to a sine-Gordon model, for which a criterion for boundary integrability was provided by Ghoshal and Zamolodchikov. We confirm that the Pohlmeyer field satisfies this condition. We then turn to the main focus of our work, which is open strings on AdS3. By evaluating the Ghoshal-Zamolodchikov criterion for the corresponding Pohlmeyer-reduced models, we are able to distinguish between integrable and non-integrable cases, in line with expectations from recent analytic and numerical studies. We conclude that Pohlmeyer reduction can provide a useful perspective on open-string non-integrability.", "url": "https://arxiv.org/abs/2611.22570", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Divania Carelse"}, {"name": "Laila Tribelhorn"}, {"name": "Konstantinos Zoubos"}], "featured_authors": [{"name": "Divania Carelse"}, {"name": "Laila Tribelhorn"}, {"name": "Konstantinos Zoubos"}], "author_count": 3}, {"id": "2611.22594", "category": "hep-th", "title": "Higher Spin Lagrangians for Black Holes in Arbitrary Dimension", "abstract": "In this paper, we investigate the classical gravitational multipolar structure of rotating objects studying higher-spin Lagrangians coupled to gravity in arbitrary dimensions $D=d+1$. We first consider fields described by totally symmetric tensors with $s$ indices. At finite spin, the minimal coupling depends on both the spin and spacetime dimension. We show that, in the high-spin limit $s\\gg 1$, the minimal multipolar expansion becomes dimension independent and it corresponds to the one which reproduces the Kerr solution in four dimensions. Furthermore, we identify a dimension independent relation among the non-minimal coupling coefficients that allows us to reproduce the Myers-Perry multipolar structure in arbitrary dimensions. We then extend our analysis to Lagrangians involving fields with different Young representations, which are allowed in higher dimensions.", "url": "https://arxiv.org/abs/2611.22594", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Francesco Campanella"}], "featured_authors": [{"name": "Francesco Campanella"}], "author_count": 1}, {"id": "2611.22615", "category": "hep-th", "title": "Lie-Poisson Formulation of Dissipative Spin Hydrodynamics", "abstract": "Covariance and the second law cannot fix how fluid flow couples to spin, since reversible couplings produce no entropy. We show that the spin commutation relations and the Poincaré algebra fix these couplings. Reversibly, a flow exerts no torque on the spin: its magnitude per particle is conserved, its direction is Fermi--Walker transported, and spin--shear couplings reflect a deforming triad. The magnitude changes only through higher multipoles, as in spinor condensates, or dissipation, whose first-order spin--shear coupling reorients the spin away from the vorticity above a critical shear rate.", "url": "https://arxiv.org/abs/2611.22615", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zi-Hao Liu"}, {"name": "Mei Huang"}], "featured_authors": [{"name": "Zi-Hao Liu"}, {"name": "Mei Huang"}], "author_count": 2}, {"id": "2611.22687", "category": "hep-th", "title": "Spectral recurrences and maximal analyticity: cosmological correlators at one and two loops", "abstract": "We develop a method for computing de Sitter boundary correlators based on the maximal analyticity of the two-point function and differential--difference equations satisfied by Schwinger--Keldysh diagrams. The vertex integrations are analytically continued through the relevant de Sitter tuboids onto purely imaginary Lobachevskij cycles. Taking the Mehler--Fock transform of the invariant bubble kernels on these Riemannian cycles converts their differential--difference equations into algebraic recurrences in the spectral parameter. The mixed-branch kernel obeys a homogeneous recurrence, whereas the chronological and antichronological kernels satisfy sourced recurrences whose local terms are determined by dimensionally continued tadpoles. We solve these recurrences, constructing explicit particular solutions in terms of generalised hypergeometric functions and identifying the analytic conditions selecting their physical completion. Attachment to the external boundary points then yields an intrinsic spectral representation and a complete solution of the boundary in--in diagrams considered here. Our method is fully coordinate-independent. Specialising to a Poincaré chart readily gives expressions that can be compared directly with those obtained by the standard coordinate-dependent approach. Composing two or more bubbles yields a multi-loop chain whose spectral multiplier is determined by the one-loop building blocks and the sum over intermediate Schwinger--Keldysh branches.", "url": "https://arxiv.org/abs/2611.22687", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bruce A. Bassett"}, {"name": "Sergio L. Cacciatori"}, {"name": "Ugo Moschella"}], "featured_authors": [{"name": "Bruce A. Bassett"}, {"name": "Sergio L. Cacciatori"}, {"name": "Ugo Moschella"}], "author_count": 3}, {"id": "2611.22718", "category": "hep-th", "title": "Fluid/Gravity Correspondence in 3d Flat Gravity with Non-Compact Boundaries", "abstract": "We study 3d flat gravity on a restricted phase space with a non-compact spatial boundary. The charge algebra splits into two commuting chiral current algebras, which a fluid/gravity dictionary maps to the stress tensor of a two-dimensional conformal fluid, with energy bounded below by the momentum. On the line, finiteness of the charges selects integrable, square-integrable currents, and the global data are carried by the scattering variables of a Schrödinger operator rather than by a monodromy. We analyze Heisenberg-like and Dirichlet-like boundary conditions; the latter give independently propagating chiral kinks associated with the reflectionless Pöschl-Teller operator. Both admit first-law relations. We outline the quantization as a Weyl $C^*$-algebra with quasi-free states. Retaining the radial dependence, the quasi-local stress tensor obeys an exact, non-perturbative flow of square-root $T\\bar T$ type, which integrates to a finite boost in the radial position.", "url": "https://arxiv.org/abs/2611.22718", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "H. Adami"}, {"name": "R. Espíndola"}, {"name": "K. Lara"}, {"name": "A. Latifi"}], "featured_authors": [{"name": "H. Adami"}, {"name": "R. Espíndola"}, {"name": "K. Lara"}, {"name": "A. Latifi"}], "author_count": 4}, {"id": "2611.22785", "category": "hep-th", "title": "Toric Calabi-Yau orientifolds: constructions, fixed loci and O-plane charges", "abstract": "We review the systematic construction of toric orientifold Calabi-Yau threefolds through divisor exchanges and coordinate reflections. We relate the homogeneous-coordinate and lattice descriptions and explain the computation of fixed loci and the geometric data entering Hodge splittings and tadpole conditions. Our triangulation-wise analysis identifies multiple compatible involutions on a single triangulation and tracks their realisations across different triangulations, revealing the orientifold structure within and across toric phases. We complement this review with new calculations and explicit examples that refine the fixed-locus geometry and the associated orientifold charge data. The examples also identify coordinate representatives of the identity and invariant hypersurface families with unavoidable singularities. These results support an ongoing update of the orientifold catalogue and provide geometric input for D-brane configurations, flux compactifications and moduli stabilisation.", "url": "https://arxiv.org/abs/2611.22785", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xu Cao"}, {"name": "Xin Gao"}], "featured_authors": [{"name": "Xu Cao"}, {"name": "Xin Gao"}], "author_count": 2}, {"id": "2611.22791", "category": "hep-th", "title": "Quantum phase transition and superselection sectors in two-color one-flavor matrix QCD at weak coupling", "abstract": "We numerically investigate the weak-coupling (small $g$) regime of the matrix model of $SU(2)$ gauge theory coupled to one flavor of massless fundamental quarks. The theory possesses a global Pauli-Gürsey $SU(2)_B$ symmetry, which organizes physical states of spin $J$ into sectors labelled by its representation $B$. We find localization-delocalization quantum phase transitions (QPTs) in multiple $(B,J)$ sectors at sector-dependent critical couplings $g_\\ast^{BJ}$. Direct evaluation of the localization probability reveals that the ground states are predominantly localized near $A_i=0$ for $g<g_\\ast^{BJ}$, but become almost entirely expelled from this region for $g>g_*^{BJ}$. The QPTs in different sectors exhibit distinct features, and we establish that quark-glue interactions are essential for these transitions. The transitions are singular: the ground state expectation value of $\\text{Tr}(A_iA_i)$ remains finite for $g< g_\\ast^{BJ}$, whereas it diverges as $g$ approaches $g_\\ast^{BJ}$ from above. We show that the two limiting ground states on either side of $g_\\ast^{BJ}$ belong to distinct superselection sectors. Furthermore, as $g$ approaches $g_\\ast^{BJ}$ from above, the ground state localizes on a submanifold (of codimension 2) of the gauge configuration space, with the spin and color of its glue components becoming locked.", "url": "https://arxiv.org/abs/2611.22791", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nirmalendu Acharyya"}, {"name": "Arkajyoti Bandyopadhyay"}, {"name": "Parthsarathi Kondapure"}, {"name": "Sachindeo Vaidya"}], "featured_authors": [{"name": "Nirmalendu Acharyya"}, {"name": "Arkajyoti Bandyopadhyay"}, {"name": "Parthsarathi Kondapure"}, {"name": "Sachindeo Vaidya"}], "author_count": 4}, {"id": "2611.22811", "category": "hep-th", "title": "5d $\\mathbb{Z}_{n}$ S-folds, quotient curves, and isogenies", "abstract": "We construct Seiberg--Witten curves for the $\\mathbb{Z}_3$, $\\mathbb{Z}_4$, and $\\mathbb{Z}_6$ S-folds of 5d rank-1 superconformal theories. Compared with the $\\mathbb{Z}_2$ case arXiv:2611.09804 , $\\mathbb{Z}_{3,4,6}$ S-folds require stronger constraints on the mass parameters. We provide a systematic procedure of realizing the S-foldings at the mirror curve level. We obtain the same elliptic curve families by specializing the complexified mass parameters of the rank-1 $E_6$, $E_7$, and $E_8$ theories, with holonomies motivated by the 7-brane insertions required by the S-fold prescription. The two constructions agree in Weierstrass form. The families with continuous mass deformations organize into characters of $\\mathfrak{su}(2)$ and $\\mathfrak{g}_2$, consistently with their singular fibers. Finally, we discuss that the Seiberg--Witten curves for $\\mathbb{Z}_n$ S-folds can be obtained through cyclic $n$-isogenies, which may provide a uniform quotient curve description of rank-1 S-folds.", "url": "https://arxiv.org/abs/2611.22811", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sung-Soo Kim"}, {"name": "Song Liu"}, {"name": "Mudassar Sabir"}, {"name": "Futoshi Yagi"}], "featured_authors": [{"name": "Sung-Soo Kim"}, {"name": "Song Liu"}, {"name": "Mudassar Sabir"}, {"name": "Futoshi Yagi"}], "author_count": 4}, {"id": "2611.22985", "category": "hep-th", "title": "Strange-Metal Magnetotransport without a Strange-Metal Ground State", "abstract": "Strange metals display a linear-in-temperature resistivity, $\\rho_{xx}\\sim T$, and a quadratic inverse Hall angle, $\\cot\\Theta_H\\sim T^2$. These seemingly universal laws are often attributed to quantum criticality, yet no controlled theory realizes both at an asymptotic zero-temperature fixed point, and experimentally they persist only over finite temperature windows. Here, we show that these properties can arise from an intermediate critical regime that does not govern the ground state. Using a minimal class of holographic models, we construct a fully backreacted realization of both scalings, which appear within a finite temperature window controlled by an emergent intermediate scaling geometry. The window is bounded by relevant deformations of the corresponding fixed point: momentum relaxation sets the upper edge, while the magnetic field $B$ closes it from below at $T_{\\min}\\sim B^{2/3}$, up to logarithmic corrections. At $T_{\\min}$, strange-metal transport, the scaling geometry, and critical thermodynamics break down together. Our results point to intermediate criticality as a distinct route to strange-metal transport, and suggest that it can be identified by the simultaneous breakdown of transport and thermodynamic scaling under a magnetic field.", "url": "https://arxiv.org/abs/2611.22985", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yongjun Ahn"}, {"name": "Matteo Baggioli"}, {"name": "Hyun-Sik Jeong"}, {"name": "Keun-Young Kim"}], "featured_authors": [{"name": "Yongjun Ahn"}, {"name": "Matteo Baggioli"}, {"name": "Hyun-Sik Jeong"}, {"name": "Keun-Young Kim"}], "author_count": 4}, {"id": "2611.23169", "category": "hep-th", "title": "An Effective Theory for Hot Lines", "abstract": "We develop a high-temperature effective theory for spatial conformal line defects in theories with thermal screening. The defect partition function admits a local geometric expansion, whose leading terms describe the effective tension and bending response of the line. Using a convergent bulk OPE for heavy-state defect matrix elements, we derive asymptotic relations for averaged products of defect one-point coefficients and bulk OPE coefficients in the regime $1 \\ll \\Delta_\\chi \\ll \\Delta^{1/d}$. We compute the leading EFT coefficients for a twisted free scalar and for the magnetic line at the $\\mathrm{O}(N)$ Wilson-Fisher fixed point, large-$N$ Gross--Neveu model and $\\mathcal N = 2$ Chern-Simons-matter theory. For the three-dimensional Ising model, Monte Carlo simulations yield a perimeter coefficient in good agreement with a Padé interpolation of our $\\varepsilon$-expansion result.", "url": "https://arxiv.org/abs/2611.23169", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Julien Barrat"}, {"name": "Alessio Miscioscia"}, {"name": "Fedor K. Popov"}], "featured_authors": [{"name": "Julien Barrat"}, {"name": "Alessio Miscioscia"}, {"name": "Fedor K. Popov"}], "author_count": 3}, {"id": "2611.23173", "category": "hep-th", "title": "The Pfaffian sector of $\\mathrm{SO}(2N)$ BPS cohomology: brane excitations, triality and fortuity", "abstract": "We study the classical $\\frac{1}{16}$-BPS cohomology of $\\mathcal{N}=4$ super-Yang-Mills theory with gauge group $\\mathrm{SO}(2N)$ in the BMN sector, including the operators built with one $\\epsilon$-tensor. These operators are odd under the reflection in $\\mathrm{O}(2N)$, carry the $\\mathbb{Z}_2$ charge of a D3-brane wrapped on $\\mathbb{RP}^3\\subset\\mathbb{RP}^5$, and form the Pfaffian sector. For $\\mathrm{SO}(8)$ we determine this sector through level $j=18$, where the level is twice the total charge of an operator. All but one of its $106$ $\\mathrm{SU}(3)_R$ multiplets are products of trace gravitons and excited Pfaffians. The exception is a singlet, represented by the singlet projection of the rank-four member of a four-term family of $\\epsilon$-tensor operators. We construct a covering space for the Pfaffian sector in which this family is closed at every rank, and the family defines a non-graviton class for every $N\\ge 4$. Triality pairs the singlet with a reflection-even class that is fortuitous with respect to the trace covering. The two classes restrict, along the spinor and the vector embedding of $\\mathfrak{so}(7)$ respectively, to the known non-graviton singlet of $\\mathrm{SO}(7)$, which is lifted at first order. We show that the two $\\mathrm{SO}(8)$ classes, and the family for every $N\\ge 4$, are protected to all orders of perturbation theory. Their protection is compatible with the lifting in $\\mathrm{SO}(7)$ because restriction to a subalgebra does not commute with the quantum corrections to the supercharge.", "url": "https://arxiv.org/abs/2611.23173", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zheng Miao"}, {"name": "Yuezhang Tang"}], "featured_authors": [{"name": "Zheng Miao"}, {"name": "Yuezhang Tang"}], "author_count": 2}, {"id": "2611.23225", "category": "hep-th", "title": "StringQFT: A Multiuse Textbook Resource for AI-Assisted Theoretical Physics", "abstract": "We present StringQFT as a textbook collection for string constructions of quantum field theory and as infrastructure for AI-assisted theoretical physics. The collection comprises 18 volumes, 190 chapters and 3,795 pages, covering brane probes, brane webs, geometric engineering, F-theory constructions, wrapped M5-branes and exact worldsheet constructions. Its open-book benchmark inventory contains 1,073 items, including 499 with automatic finite-answer checking. For retrieval-augmented generation, it provides 1,371 section records linked to textbook sources and PDF locations, together with a local lexical retriever. Training-data preparation is illustrated by 21 private, source-linked examples. For agents, it exposes 19 calculation tools with specified inputs and finite domains, connecting tool use to textbook derivations. We illustrate these uses through specific questions, retrieved passages and finite calculations. The textbook collection and accompanying resources are available at this https URL .", "url": "https://arxiv.org/abs/2611.23225", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xingyang Yu"}], "featured_authors": [{"name": "Xingyang Yu"}], "author_count": 1}, {"id": "2611.23231", "category": "hep-th", "title": "CFTs with Large Virasoro Primary Gaps", "abstract": "We construct the first explicit examples of compact unitary bosonic full conformal field theories (CFTs) in two dimensions with a unique vacuum and an all-spin Virasoro-primary gap greater than two. Our constructions use asymmetric orbifolds of lattice CFTs built from even unimodular lattices of sufficiently large minimum norm, ensuring that no charged state lies below the desired gap. The gauged symmetries combine a common orthogonal action on the left- and right-moving currents with independent sign reversals; the latter project out the dimension-two scalar primary $\\sum_i J_L^iJ_R^i$ that survives when the symmetry acts identically on both chiral halves. We prove that the gauging is anomaly-free and determine the exact gaps by analyzing the invariant untwisted spectrum and all twisted sectors. From lattices constructed using ternary quadratic-residue codes, we obtain an infinite family with gap three at $(c_L,c_R)=(p+1,p+1)$ for primes $p\\ge71$ with $p\\equiv23\\pmod{24}$. From Barnes-Wall lattices, we obtain an infinite family with gap four at $(c_L,c_R)=(2^m,2^m)$ for odd $m\\ge7$. We also obtain two additional examples, with gap three at $(c_L,c_R)=(48,48)$ and gap four at $(c_L,c_R)=(512,512)$.", "url": "https://arxiv.org/abs/2611.23231", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ziming Ji"}, {"name": "Jiahua Tian"}], "featured_authors": [{"name": "Ziming Ji"}, {"name": "Jiahua Tian"}], "author_count": 2}, {"id": "2611.21744", "category": "math-ph", "title": "Parametric and Universal Thouless Invariants in Matrix Product States", "abstract": "We investigate the classification of continuous families of translation-invariant injective matrix product states on an infinite chain, parametrized by a paracompact Hausdorff space $X$ and subject to a compact Hausdorff symmetry $G$. We construct an invariant for phases of such families, valued in $\\check{H}^1(X;\\widehat{G})$, that generalizes the known $\\widehat{G}$ phase invariant for $G$-symmetric Thouless pumps. The phase invariant is constructed as the pullback to $X$ of a single universal Čech cohomology class on a classifying space of $G$-symmetric translation-invariant injective matrix product states. Several examples are given over various parameter spaces where this invariant is nontrivial.", "url": "https://arxiv.org/abs/2611.21744", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Leonardo Goller"}, {"name": "Amartya H. Singh"}, {"name": "Daniel D. Spiegel"}, {"name": "Marco Venuti"}], "featured_authors": [{"name": "Leonardo Goller"}, {"name": "Amartya H. Singh"}, {"name": "Daniel D. Spiegel"}, {"name": "Marco Venuti"}], "author_count": 4}, {"id": "2611.21767", "category": "math-ph", "title": "Existence of a third self-similar solution of the Yang--Mills equation in high even dimensions", "abstract": "We prove that the spherically symmetric $SO(d)$ Yang--Mills equation admits a third smooth self-similar profile, in addition to the two known explicit profiles, in every even dimension $d\\geq 12$. This complements the analogous existence theorem in odd dimensions $d\\geq 11$ ( arXiv:2610.36784 ). In contrast to the odd-dimensional case, where the classification of smooth self-similar profiles reduces to counting roots of an explicit resonance polynomial [Phys. Rev. D 114, 064021 (2026)], the even-dimensional proof requires solving a nonlinear connection problem. In $d=10$, where one explicit profile degenerates to the zero solution, we give a formal argument for the existence of a second nontrivial smooth profile in addition to the single nontrivial explicit one.", "url": "https://arxiv.org/abs/2611.21767", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Piotr Bizoń"}], "featured_authors": [{"name": "Piotr Bizoń"}], "author_count": 1}, {"id": "2611.21916", "category": "math-ph", "title": "A refined upper bound on the critical temperature for dilute Bose gases", "abstract": "We establish an upper bound on the critical temperature shift of three-dimensional Bose gases with general nonnegative finite-range interactions. In the dilute regime $a\\rho^{1/3}\\to0$, we prove $T_c(\\rho)/T_c^{(0)}(\\rho) \\le 1 + (C_{\\rm H}+o(1))\\sqrt{a\\rho^{1/3}}$, where \\[ C_{\\rm H}=\\frac{2^{7/2}\\sqrt\\pi}{3\\zeta(3/2)^{2/3}} =3.523992\\ldots \\] is the coefficient predicted by Huang in 1999. This improves the earlier rigorous upper bound of Seiringer and Ueltschi in 2009. More precisely, we prove the exponential decay of the correlations above the stated temperature through the Feynman--Kac representation, for both integrable and hard-core interactions.", "url": "https://arxiv.org/abs/2611.21916", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Phan Thành Nam"}, {"name": "Toan T. Nguyen"}, {"name": "Izabella Stuhl"}, {"name": "Yuri Suhov"}], "featured_authors": [{"name": "Phan Thành Nam"}, {"name": "Toan T. Nguyen"}, {"name": "Izabella Stuhl"}, {"name": "Yuri Suhov"}], "author_count": 4}, {"id": "2611.22041", "category": "math-ph", "title": "Quantum Born Geometries from Modular Quantization", "abstract": "A structural link between quantization and \"thermal-doubled\" non-commutative Born geometry (with its split-quaternionic structure) is uncovered via Tomita-Takesaki first-quantized modular theory for complexified and polarized ortho-symplectic spaces. Implications for the modular algebraic quantum gravity program ( arXiv:1007.4094 ) hint at further deep modifications of the notions of space and geometry (thermal quantum space-time hypothesis) waiting to be further explored. Speculative suggestions in the direction of this http URL and this http URL CPT-mirror cosmologies will be mentioned, among several others. The present work is based on the manuscript \"Modular Quantization and Non-commutative Space-time\" (now on alphaXiv) that has been shared, with a selected number of researchers, since end of April 2026.", "url": "https://arxiv.org/abs/2611.22041", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Paolo Bertozzini"}, {"name": "Roberto Conti"}], "featured_authors": [{"name": "Paolo Bertozzini"}, {"name": "Roberto Conti"}], "author_count": 2}, {"id": "2611.22194", "category": "math-ph", "title": "Towards the componentwise three-soliton conjecture: cones, collisions, soft momenta and graphs", "abstract": "The componentwise three-soliton conjecture of Part~I states that if an even polynomial $P$ with $P(0)=0$ satisfies Hirota's three-soliton condition on a non-hyperplane component of multiplicity one of its dispersion variety, then it satisfies the $N$-soliton condition there for every $N$. We prove restrictions on components carrying this condition and classify the polynomials satisfying it on several families of components, with no degree bound. Restrictions: if the top homogeneous part of the equation of the component has a nonlinear irreducible factor, then $P$ is a multiple of a quadratic form; the order of $P$ at the origin is tied to the multiplicities of the component and of the doubled component; a component through the origin has odd multiplicity; the condition passes to all limits of the rescaled component, and the Newton polygon of a plane component has edges of only ten directions. Classifications: on the cubic graph $v=u^3$, where the four-soliton condition holds exactly in multiplicity one; on the graphs $v=q(u)$ with $°q\\ge3$, where $P$ exists only if $q$ is an odd cubic or an odd quintic, so the conjecture holds for all graphs of polynomials; and for three families of Hietarinta's list, where each irreducible member is, up to a constant factor, the only such polynomial on its dispersion variety. All three satisfy the $N$-soliton condition for every $N$, so the conjecture holds for them: two belong to the BKP hierarchy, and for Hietarinta's quartic equation, known to satisfy it for $N\\le4$, we prove it by fusing resonant momenta and counting zeros on its curve. For translated hyperbolas we exclude the one through the origin and all $P$ of degree at most eight. The solutions of multiplicity one on graphs are known bilinear equations; new is that there are no others. The conjecture remains open.", "url": "https://arxiv.org/abs/2611.22194", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shi Zhenhua"}], "featured_authors": [{"name": "Shi Zhenhua"}], "author_count": 1}, {"id": "2611.22414", "category": "math-ph", "title": "Small-ball asymptotics of Gaussian matrix products: Open Fermi shells and the Grassmannian", "abstract": "Let $P=A_N\\cdots A_1$ be a product of independent standard real or complex Gaussian matrices of arbitrary fixed sizes. For complex entries we determine the exact leading terms, of the form $\\kappa\\,\\varepsilon^C(\\log1/\\varepsilon)^q$, of the operator-norm and Frobenius small-ball probabilities of $P$, together with the corresponding asymptotics of the Laplace transform of $\\|P^2\\|_{F}$. The exponent $C$ is the known diversity order, while the logarithmic power follows a filling rule: when fermions are placed on ladders of states determined by the sizes and the last occupied level has degeneracy $\\mu$ and contains $h$ particles, $q=h(\\mu-h)$. The determinant of this last shell expands in Plücker coordinates graded by the Schubert cells of the Grassmannian $\\mathrm{Gr}(h,\\mu)$, with leading coefficients proportional to normalized degrees of Schubert varieties. For real entries we prove that the Frobenius small-ball probability has an exact positive leading term of order $\\varepsilon^{C/2}(\\log1/\\varepsilon)^q$ and that the operator-norm probability has the same order, which gives a proof of the known real log canonical threshold and its multiplicity that needs no explicit resolution of singularities. We evaluate the real leading coefficient in closed form for every shell with at most one logarithm, a class that contains all products of two factors, and we conjecture its general form, which agrees with the classical constant of vector chains. Applications include the outage probability of cascaded multi-antenna channels at high signal-to-noise ratio and the Bayesian evidence of deep linear networks.", "url": "https://arxiv.org/abs/2611.22414", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jiahua Tian"}], "featured_authors": [{"name": "Jiahua Tian"}], "author_count": 1}, {"id": "2611.22783", "category": "math-ph", "title": "Extended Hamiltonian formalism for multicontact field theories", "abstract": "We develop an extended Hamiltonian formalism for action-dependent (Herglotz-type) classical field theories within the framework of multicontact geometry. While the standard Hamiltonian description of these theories is formulated on the restricted multimomentum bundle, we work instead on the extended multimomentum bundle, which carries an additional energy-type coordinate together with a canonical multicontact structure. In this setting, an extended Hamiltonian multicontact system is governed by a Hamiltonian density and its associated Hamiltonian one-form, and the submanifold they determine recovers the restricted formalism. We characterise the admissible one-forms and prove that the associated Hamilton-de Donder-Weyl field equations, stated equivalently for sections, multivector fields, and Ehresmann connections, are mutually equivalent. We then establish the precise relation between the extended and restricted formalisms in both the regular (multicontact) and the almost-regular (premulticontact) settings, the latter requiring a constraint algorithm. The formalism is illustrated with two examples: the action-dependent Klein-Gordon equation, which includes the telegrapher equation as a particular case, and the heat equation, whose contactification yields Burgers' equation.", "url": "https://arxiv.org/abs/2611.22783", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Manuel de León"}, {"name": "Rubén Izquierdo-López"}, {"name": "Xavier Rivas"}, {"name": "Narciso Román-Roy"}, {"name": "Annamaria Villanova"}], "featured_authors": [{"name": "Manuel de León"}, {"name": "Rubén Izquierdo-López"}, {"name": "Xavier Rivas"}, {"name": "Narciso Román-Roy"}, {"name": "Annamaria Villanova"}], "author_count": 5}, {"id": "2611.22917", "category": "math-ph", "title": "Exact Inversion of Relaxation from Rheometer Measurement Data", "abstract": "A rheometer is commonly used to measure the input-output relation for analyzing the relaxation of stress for rheological materials. Here, the input is a time-harmonic torque and the output is the angular displacement. This paper aims to propose an exact inversion scheme of the relaxation function from two input-output relations only having different moments of inertia. The relaxation function is represented by a Prony's series of known number of terms, with a positive constant term and terms with distinct relaxation times. The augmented system relates the material parameters to its characteristic roots. These roots are the poles of the transfer function. Here the transfer function is the Laplace transform of the output divided by that of the input, and it is a rational function in the Laplace variable. The poles of the transfer function are recovered using Pade's approximation. By measuring two input-output relations only having different moments of inertia, we can rigorously recover the relaxation function. Thus, we note a clear link between the characteristic roots and the poles. Numerical experiments reconstruct the relaxation function from synthetic angular displacements corresponding to two given moments of inertia based on our inversion method. The results show the effect of measurement noise on the recovered characteristic roots and relaxation function.", "url": "https://arxiv.org/abs/2611.22917", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yu Jiang"}, {"name": "Takayuki Kurokawa"}, {"name": "Ching-Lung Lin"}, {"name": "Gen Nakamura"}], "featured_authors": [{"name": "Yu Jiang"}, {"name": "Takayuki Kurokawa"}, {"name": "Ching-Lung Lin"}, {"name": "Gen Nakamura"}], "author_count": 4}, {"id": "2611.22942", "category": "math-ph", "title": "Sobolev theory for the inverse problem of time-dependent density functional theory on the torus", "abstract": "We show that, given a sufficiently regular time-dependent density, there exists a unique potential such that the Schrödinger equation with this external potential has the prescribed one-particle density. We treat densities that are twice differentiable in time and of finite Sobolev regularity in space; the resulting potentials are continuous in time and of finite Sobolev regularity in space. Our method of proof is to rewrite the problem as a nonlinear Schrödinger equation with a loss of derivatives, which we in turn handle with a completion-of-the-square argument. This is a refinement of our recent work [Lauritsen, Lewin, and Oldenburg, arXiv:2609.08984 ], which handled this loss of derivatives using the Cauchy-Kovalevskaya theorem and treated analytic-in-space densities and potentials.", "url": "https://arxiv.org/abs/2611.22942", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Asbjørn Bækgaard Lauritsen"}, {"name": "Mathieu Lewin"}, {"name": "Jakob Oldenburg"}], "featured_authors": [{"name": "Asbjørn Bækgaard Lauritsen"}, {"name": "Mathieu Lewin"}, {"name": "Jakob Oldenburg"}], "author_count": 3}, {"id": "2611.23006", "category": "math-ph", "title": "Comment on \"The eigenvalues and eigenfunctions of the toroidal dipole operator'", "abstract": "We show here that the spectrum of the operator $\\hat{T}_3^{(\\theta)}$ studied by Anghel and Dolineanu (Phys. Scr. {\\bf 98} (2023) 015223) is continuous, not discrete, contrary to what is claimed by the authors of the paper to which this comment refers. Consequently, there is no splitting of the energy levels corresponding to this operator that could be observed experimentally.", "url": "https://arxiv.org/abs/2611.23006", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "G. Vaman"}], "featured_authors": [{"name": "G. Vaman"}], "author_count": 1}, {"id": "2611.23032", "category": "math-ph", "title": "On the $ϕ^4_2$ theory on $\\mathbb R\\times S$", "abstract": "We present a construction of the Euclidean two-dimensional $\\phi^4$ quantum field theory model on $\\mathbb R\\times S$ using parabolic stochastic quantization and discuss the Osterwalder-Schrader axioms. Motivated by one-loop string scattering amplitudes, we first construct finite-volume measures on a family of tori with varying geometry. To construct an infinite-volume measure on the cylinder, we establish uniform renormalization and stochastic estimates as the complex structure varies, including the degenerating regime in which the torus approaches an infinite cylinder.", "url": "https://arxiv.org/abs/2611.23032", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Azam Jahandideh"}], "featured_authors": [{"name": "Azam Jahandideh"}], "author_count": 1}, {"id": "2611.23062", "category": "math-ph", "title": "Unique continuation for the Pauli-Fierz Hamiltonian", "abstract": "We prove a unique continuation property for eigenstates of the Pauli-Fierz Hamiltonian, viewed as functions of the electron configuration with values in the spin-photon space. The vector potential may lie in $L^6_\\mathrm{loc}$, with its divergence, curl, and the scalar potential in $L^p_\\mathrm{loc}$ for some $p>2$. As an application, we prove a Hohenberg-Kohn theorem at positive coupling strength: the spin-summed ground-state density and combined current density determine the external potentials up to a gauge transformation and an additive constant.", "url": "https://arxiv.org/abs/2611.23062", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mihály A. Csirik"}], "featured_authors": [{"name": "Mihály A. Csirik"}], "author_count": 1}, {"id": "2611.23086", "category": "math-ph", "title": "The Infinitesimal Covariant Stone-von Neumann Theorem", "abstract": "In a previous paper, the authors established the Covariant Stone-von Neumann Theorem, which generalizes the Stone-von Neumann Theorem in quantum mechanics and yields a classification of all unitary Heisenberg representations of an abelian elementary $ C^{\\ast} $-dynamical system up to unitary equivalence. In this sequel to that paper, we establish an infinitesimal version of the Covariant Stone-von Neumann Theorem in the setting of real elementary $ C^{\\ast} $-dynamical systems. Firstly, we generalize Stone's Theorem to secure a one-to-one correspondence between the strongly continuous one-parameter unitary groups and the regular self-adjoint densely defined operators on a Hilbert $ C^{\\ast} $-module. Secondly, we define the infinitesimal Heisenberg representations and the infinitesimal Schrödinger representation of a real $ C^{\\ast} $-dynamical system. Thirdly, we construct a one-to-one correspondence between the unitary Heisenberg representation and the infinitesimal Heisenberg representations of a real $ C^{\\ast} $-dynamical system, providing a rigorous two-way passage--which we call ``Heisenberg differentiability-integrability''--between the global unitary formulation of Heisenberg covariance and its infinitesimal formulation in terms of regular self-adjoint densely defined operators. This allows us to prove the Infinitesimal Covariant Stone-von Neumann Theorem: For a real elementary $ C^{\\ast} $-dynamical system, every infinitesimal Heisenberg representation is a direct sum of copies of the infinitesimal Schrödinger representation. Lastly, we obtain explicit descriptions of the position and momentum operators for a real $ C^{\\ast} $-dynamical system and construct a natural common invariant core of analytic vectors for them. All requisite technical domain and integrability issues are fully accounted for.", "url": "https://arxiv.org/abs/2611.23086", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Leonard Huang"}, {"name": "Lara Ismert"}], "featured_authors": [{"name": "Leonard Huang"}, {"name": "Lara Ismert"}], "author_count": 2}, {"id": "2611.23087", "category": "math-ph", "title": "Zero mode surface of Hermitian two-by-two matrices", "abstract": "We classify the zero mode surfaces, also called Clifford spectra, of Hermitian $2\\times 2$ matrices. Using the covariance of the Dirac operator under the Euclidean group and its invariance under unitary conjugation, together with a singular value decomposition, every $m$-tuple of Hermitian $2\\times 2$ matrices, after adjoining zero matrices if $m<3$, is reduced to the normal form $(b_1\\sigma_1,b_2\\sigma_2,b_3\\sigma_3,0,\\dots,0)$ with $b_1\\geq b_2\\geq b_3\\geq 0$. Since adding a vanishing matrix only embeds the Clifford spectrum into a higher-dimensional space, it suffices to consider three matrices. In this normal form the determinant of the Dirac operator is given in closed form and its critical points are determined explicitly. The zero mode surface consists of one or two points if $b_3=0$. Otherwise it consists of two disjoint topological spheres if $b_1>b_2+b_3$, of two topological spheres touching at one point if $b_1=b_2+b_3$, and of a single topological sphere if $b_1<b_2+b_3$. The topology is thus governed by the triangle inequality for $(b_1,b_2,b_3)$, which can be interpreted with Heron's formula. In particular, the Clifford spectrum of any tuple of Hermitian $2\\times 2$ matrices is never empty.", "url": "https://arxiv.org/abs/2611.23087", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andreas Sykora"}], "featured_authors": [{"name": "Andreas Sykora"}], "author_count": 1}, {"id": "2611.21681", "category": "quant-ph", "title": "Remark on internal relaxation in large number qubit systems", "abstract": "For a time $t_{c}$ of calculation in an $N$ qubit quantum computer that is much shorter than the intrinsic Heisenberg time $t_H$, $t_c\\ll t_H$, the dynamics of the system is effectively irreversible and the couplings between the qubits give rise to a relaxation time scale $\\tau_r$. If $t_H\\gg t_c >\\sim \\tau_r$ one looses quantum coherence exponentially fast. Since $t_H$ scales exponentially with $N$ there is a threshold $N_c$ such that for $N\\gg N_c$ one must be aware of possible intrinsic relaxation during calculation. As an order of magnitude estimation we find $N_c\\approx \\ln(\\tau_r/T)$ where $T$ is a typical system specific oscillation time of a single qubit. $\\tau_r$ can be estimated as the typical inverse transition rate between two parts of the system, one of which is treated as an environment of the other.", "url": "https://arxiv.org/abs/2611.21681", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Martin Janßen"}], "featured_authors": [{"name": "Martin Janßen"}], "author_count": 1}, {"id": "2611.21709", "category": "quant-ph", "title": "QEDist: Practical Exact Distance Certification for Stabilizer Codes", "abstract": "We present QEDist, a method and software package that certifies the distance of qubit stabilizer codes. Building on tree-search methods, QEDist constructs candidate logical operators one qubit at a time, using sparse parity checks, stabilizer equivalence, and verified symmetries to reduce the work. For a cutoff $W$, a completed search either finds a nontrivial logical operator of weight at most $W$ or proves that none exists. Because satisfying one check can violate another, we use both satisfied and unsatisfied checks to lower-bound the weight needed to complete a logical operator, and prune branches whose bound exceeds the remaining budget, which substantially reduces net search time. We benchmark QEDist mainly on Calderbank-Shor-Steane (CSS) codes; the same formulation extends to non-CSS codes and to the fault distance of syndrome-extraction circuits. For lifted-product (LP) codes, we further exploit the product structure to replace part of the full-code search with a smaller search on a classical constituent. We establish exact distances for codes with up to several thousand qubits, including Abelian and non-Abelian LP codes whose distances were previously reported only as upper bounds. In several seconds of search on one laptop core, QEDist certifies exact distances up to 20 for many of these codes and fault distance 10 for the syndrome-extraction circuit of the $[[144,12,12]]$ code. With orders-of-magnitude speedups over the tested exact solvers, QEDist makes exact distance certification a practical tool for selecting and optimizing finite-length quantum codes.", "url": "https://arxiv.org/abs/2611.21709", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jong Yeon Lee"}], "featured_authors": [{"name": "Jong Yeon Lee"}], "author_count": 1}, {"id": "2611.21723", "category": "quant-ph", "title": "Black holes as black boxes: a query lower bound on python's lunch decoding", "abstract": "The python's lunch conjecture relates the complexity of bulk reconstruction in holographic tensor networks to an exponential cost associated with post-selection. We establish a tight query lower bound for this decoding problem in a Haar random oracle model, with a python's lunch circuit that applies Haar random unitary $U$ to a logical input and fixed ancillas, followed by post-selection on $m$ output qubits. Given one copy of the normalized encoded state and coherent oracle access to $U$ and $U^\\dagger$, including controlled queries, we prove that recovering even a single logical bit with constant average advantage requires $\\Omega(2^{m/2})$ queries. Together with the state-independent amplitude amplification upper bound for approximately isometric encodings, this establishes query complexity $\\Theta(2^{m/2})$ at constant decoding accuracy. We also comment on the decoding cost for other \"admissible'\" ensembles of unitaries $U$ which give rise to families of approximately isometric holographic maps.", "url": "https://arxiv.org/abs/2611.21723", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chris Waddell"}, {"name": "Michelle Xu"}], "featured_authors": [{"name": "Chris Waddell"}, {"name": "Michelle Xu"}], "author_count": 2}, {"id": "2611.21740", "category": "quant-ph", "title": "A Proposal for Quantum Reference Frames in Quantum Field Theory and their Experimental Exploration", "abstract": "We construct quantum reference frames (QRFs) in quantum field theory, using localized modes of a scalar field as frames for its shift symmetry. We import tools from relativistic quantum information to explicitly compute entropies and correlation measures of relational observables, investigating their frame dependence and the new features arising from the field-theoretic character of the system. Unlike QRFs for systems with finitely many degrees of freedom, localized field-theoretic QRFs are necessarily mixed in physically relevant states and generically correlated with the subsystems they describe. These aspects of QRFs for fields affect the properties of relational observables in a subtle way. Furthermore, we put forward a proposal for testing these predictions with existing quantum simulators based on ultracold atoms and quantum fluids, thus connecting QRF physics with analogue gravity platforms.", "url": "https://arxiv.org/abs/2611.21740", "type": "实验", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ivan Agullo"}, {"name": "Fabio M. Mele"}], "featured_authors": [{"name": "Ivan Agullo"}, {"name": "Fabio M. Mele"}], "author_count": 2}, {"id": "2611.21749", "category": "quant-ph", "title": "Robust Passive Quantum Memory in Three Dimensions, Part I: Thermal and Zero-Temperature Perturbative Stability", "abstract": "Whether a three-dimensional quantum many-body system with geometrically local, bounded-degree interactions can passively protect encoded quantum information has remained a central open question since Kitaev introduced topological quantum computation. Passive protection requires stability against both thermal noise at nonzero temperature and generic static Hamiltonian perturbations Balasubramanian, Davydova, and Lin (BDL) recently established unperturbed three-dimensional thermal self-correction using a recursively defined family of stabilizer Hamiltonians. However, they left open whether their construction remains stable against quantum perturbations, even at zero temperature. In this paper, we show that a slight variant of the BDL code family achieves stability along both boundary axes of the perturbation-temperature phase diagram as the system size grows. Following BDL, in the absence of perturbation it is thermally stable below a critical temperature, achieving a stretched-exponentially long memory lifetime when coupled to any local Markovian thermal bath generated by single-site system-bath interactions satisfying detailed balance with bounded coupling rates. At zero temperature under arbitrary weak, superpolynomially decaying quantum perturbations, the family maintains a uniform bulk spectral gap, superpolynomially small ground-space splitting, and a superpolynomially long closed-system unitary memory lifetime for quasi-locally dressed logical observables. To prove this zero-temperature stability, we establish local topological quantum order across the multiscale hierarchy using a linearly dilated relaxation of the usual Bravyi-Hastings-Michalakis criteria. In the companion paper, we combine the tools developed here with finite-temperature worldline cluster expansions to establish passive self-correction throughout the phase diagr
