am's positive-temperature perturbed interior.", "url": "https://arxiv.org/abs/2611.21749", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Patrick Hayden"}], "featured_authors": [{"name": "Patrick Hayden"}], "author_count": 1}, {"id": "2611.21778", "category": "quant-ph", "title": "Transient State Preservation of a Dissipative Qubit via Lyapunov Control", "abstract": "Preserving quantum states in the presence of environmental decoherence remains a fundamental challenge for quantum information processing. This work investigates whether Hamiltonian Lyapunov feedback can transiently preserve the state of an open qubit by reshaping its trajectory under Markovian dissipation. A state-error Lyapunov function is adopted to derive an analytical feedback law for Lindblad dynamics, ensuring a nonincreasing Lyapunov function whenever the control sensitivities are nonzero. The analysis identifies the geometric conditions under which the feedback becomes ineffective, showing that control authority vanishes when the current and target Bloch vectors are collinear. Numerical simulations are performed for amplitude damping and pure dephasing using selected target states. Performance is evaluated through fidelity, accumulated infidelity, dwell time above a fidelity threshold, coherence, and control effort. The results demonstrate that the proposed feedback cannot eliminate irreversible dissipation or achieve universal asymptotic stabilization, but it can provide transient benefits for selected target-channel combinations. In particular, under amplitude damping, the controller significantly reduces accumulated infidelity and substantially extends the interval during which the system remains above a prescribed fidelity threshold. In the pure dephasing cases examined, improvements in fidelity are generally limited, although transient coherence preservation is observed for the oblique target considered, revealing a trade-off between coherence and state fidelity. These findings indicate that Lyapunov-based Hamiltonian feedback is best suited as a transient preservation mechanism and motivate its application to gate operations and preservation of prepared states during finite time intervals before their use or readout.", "url": "https://arxiv.org/abs/2611.21778", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ilan Sabaj"}, {"name": "Pablo Monzón"}], "featured_authors": [{"name": "Ilan Sabaj"}, {"name": "Pablo Monzón"}], "author_count": 2}, {"id": "2611.21829", "category": "quant-ph", "title": "Charge self-consistent DFT+QDMFT framework with a Krylov-based quantum impurity solver", "abstract": "We integrate a quantum impurity solver into a charge self-consistent density functional theory (DFT) plus quantum dynamical mean-field theory framework. The solver optimizes adaptive circuits to approximate the ground state of the impurity model and its particle and hole excitations, and reconstructs the impurity Green's function from their Hamiltonian moments. Higher-order moments are predicted from low-order ones using a machine-learning model, while regularized optimization mitigates violations of causality in the resulting self-energy. The latter is used to update the charge density until self-consistency is achieved. We demonstrate the framework through body-centered cubic lithium calculations and compare the results with a reference one using a continuous-time quantum Monte Carlo solver. These calculations converge with root-mean-square charge-density residuals below $\\boldsymbol{2\\times10^{-3}}$ and yield a nearly vanishing impurity self-energy, consistent with the noninteracting limit used for weakly correlated lithium.", "url": "https://arxiv.org/abs/2611.21829", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "M. Karabin"}, {"name": "T. Sohail"}, {"name": "E. A. Coello Pérez"}, {"name": "S. Ghosh"}, {"name": "M. Sajjan"}, {"name": "H. Terletska"}, {"name": "M. Eisenbach"}], "featured_authors": [{"name": "M. Karabin"}, {"name": "T. Sohail"}, {"name": "E. A. Coello Pérez"}, {"name": "M. Sajjan"}, {"name": "H. Terletska"}, {"name": "M. Eisenbach"}], "author_count": 7}, {"id": "2611.21830", "category": "quant-ph", "title": "Infrared fluctuations and collective entanglement modes in harmonic lattices", "abstract": "We investigate how infrared fluctuations and spatial separation shape vacuum entanglement between two finite regions in the relativistic harmonic chain and its Lifshitz generalizations. At fixed lattice spacing and finite geometry, we establish that logarithmic negativity remains uniformly bounded as the mass approaches zero, while mutual information diverges. Infrared-enhanced total correlations therefore do not provide an unbounded distillable-entanglement resource. Using local symplectic consolidation, we identify the collective canonical modes carrying the negativity and follow their evolution with separation. Their participation crosses over from localization near the facing boundaries to a collective distribution within each region. Expansion in the adjacent-state canonical basis connects this evolution to progressively weaker, more extended reference modes, including adjacent-halo directions. Building on the established concentration of long-distance logarithmic negativity into a single canonical pair, we show that its spatial participation is smooth and infrared-dominated despite its ultraviolet canonical structure, a distinction also present in pure-state entanglement modes. These results refine the ultraviolet mode picture by resolving the long-wavelength organization of the oscillators participating in the surviving entanglement. Across the massless dispersions studied, the normalized participation approaches a universal long-distance profile when separation is scaled by the negativity radius. Its detailed form and the entanglement range nevertheless remain sensitive to ultraviolet deformations. Together, these findings distinguish infrared-enhanced correlations from distillable entanglement and reveal the collective spatial organization underlying its persistence at large separation.", "url": "https://arxiv.org/abs/2611.21830", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mahsa Lezgi"}, {"name": "Ali Mollabashi"}], "featured_authors": [{"name": "Mahsa Lezgi"}, {"name": "Ali Mollabashi"}], "author_count": 2}, {"id": "2611.21840", "category": "quant-ph", "title": "Quantum-Classical Separation in Probability Distribution Transport via Nonlocal Games", "abstract": "In many-body physics and generative artificial intelligence, locality provides a natural notion of phase equivalence: two quantum states or classical probability distributions are regarded as in the same phase when local dynamics can reversibly transform one into the other. This raises a fundamental question: can local quantum dynamics transport classical probability distributions in ways that local classical dynamics cannot? We establish a quantum-classical separation in distribution transport: two classical distributions can be connected exactly and reversibly by a constant-depth local quantum circuit, whereas classical stochastic transport requires a substantially larger spatial range. We demonstrate this separation explicitly on a one-dimensional chain and develop a general construction principle on graphs, based on nonlocal games. Moreover, the source distribution can itself be generated by a simple local classical process, establishing a quantum advantage in distribution generation as well. Our results reveal a fundamental distinction between classical and quantum local reversibility, even when both the initial and final states are entirely classical.", "url": "https://arxiv.org/abs/2611.21840", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fangjun Hu"}, {"name": "Xun Gao"}], "featured_authors": [{"name": "Fangjun Hu"}, {"name": "Xun Gao"}], "author_count": 2}, {"id": "2611.21898", "category": "quant-ph", "title": "A Geometric Framework for Local-to-Global Symmetry: Global Constraints on Local Dynamics", "abstract": "Aggregate molecular systems are routinely understood by decomposing them into local structural units, such as monomers in J/H-aggregates, chemical moieties, motifs, and functional groups. Implicit in such decompositions is the assumption that these local structures remain meaningful within the aggregate. Here, we ask how the symmetries of constituent structures relate to aggregate symmetry, and how this relation determines the constraints that global symmetry imposes on transitions between local symmetry sectors. We construct a covariant local-to-global representation from framed local symmetry data and show that its reconstruction map intertwines with a global quantum representation. By identifying which global symmetry sectors overlap each local symmetry sector, we resolve symmetry-enforced dynamical exclusions into site-resolved pathways. Through Frobenius reciprocity, these exclusions can be determined from standard character tables of the local and global symmetry groups, with the character values in the inner product paired according to the relative positions and orientations of local structures within the aggregate. Although motivated by molecular aggregates, the construction is formulated for arbitrary geometries modeled by a homogeneous space of an ambient transformation group.", "url": "https://arxiv.org/abs/2611.21898", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Connor Terry Weatherly"}, {"name": "Roel Tempelaar"}], "featured_authors": [{"name": "Connor Terry Weatherly"}, {"name": "Roel Tempelaar"}], "author_count": 2}, {"id": "2611.21949", "category": "quant-ph", "title": "Quantum Information Transfer in Molecular Polaritonic Networks: A Van Vleck Effective-Hamiltonian Approach", "abstract": "Achieving high-fidelity transfer of an arbitrary quantum state between spatially separated qubits is a central challenge for reliable quantum hardware. We address this question within a polaritonic framework by introducing Projected-Block Van Vleck Perturbation Theory (PB-VVPT). Based on quasidegenerate perturbation theory, this approach describes a molecular network coupled to an optical cavity and local phonons through a generalized Holstein--Tavis--Cummings Hamiltonian. Quantum information is encoded in a coherent superposition of exciton-cavity states, while phonons constitute a weakly coupled environment. In the nonadiabatic regime of weak exciton-phonon coupling, the method incorporates phonon-induced renormalization of polaritonic states and their dynamics while reducing the Hamiltonian to independent fixed-phonon-number sectors and coupled polaron-polariton subblocks. This structure provides efficient access to the coherence and population propagators governing quantum-state transfer without invoking a Markovian approximation. We benchmark the approach against exact dynamics for a molecular wheel network, considering both molecule-to-molecule and molecule-to-cavity transfer. PB-VVPT accurately reproduces short- and long-time transfer dynamics, including thermal decoherence and fidelity revivals consistent with non-Markovian memory effects, with prediction errors below $1\\%$ over most of the simulated time intervals. This accuracy is achieved with an estimated diagonalization cost more than two orders of magnitude lower than that of the exact reference calculations. These results establish PB-VVPT as an accurate and computationally efficient approach to quantum information transfer in molecular polaritonic networks.", "url": "https://arxiv.org/abs/2611.21949", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Saad Yalouz"}, {"name": "Vincent Pouthier"}], "featured_authors": [{"name": "Saad Yalouz"}, {"name": "Vincent Pouthier"}], "author_count": 2}, {"id": "2611.21994", "category": "quant-ph", "title": "An alternate proof of the QMA lower bound for set-size estimation", "abstract": "In the set-size estimation query task, a query algorithm decides whether an $N$-bit input has Hamming weight $\\ge B$ or $\\le A$ (with $\\ge B$ as the yes instances and $\\le A$ as the no instances). When $B = 2A$, this is sometimes called approximate counting. The query complexity for this problem with a quantum witness (i.e., $\\mathsf{QMA}$ query bounds) was resolved by Aaronson, Kothari, Kretschmer, and Thaler (CCC 2020) and proved using Laurent polynomials. Here we give a morally similar but distinct proof of the lower bound using the polynomial method.", "url": "https://arxiv.org/abs/2611.21994", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chinmay Nirkhe"}], "featured_authors": [{"name": "Chinmay Nirkhe"}], "author_count": 1}, {"id": "2611.22014", "category": "quant-ph", "title": "Generalized Schrieffer-Wolff transformation", "abstract": "The Schrieffer-Wolff transformation (SWT) is a cornerstone of effective-Hamiltonian theory. However, the SWT is predominantly used for weak-coupling problems, while a systematic counterpart for strongly coupled regimes remains largely unexplored. A general closed-form SWT generator and a clear physical principle for gauge fixing remain elusive, obscuring the transformation's underlying structure. We introduce the dual SWT to deal with the strong-coupling problems. The generalized SWT (gSWT) is formulated for any Hermitian operator and block partition. We establish the geodesic principle for its canonical gauge. Furthermore, we derive an exact closed-form solution of the gSWT generator at every order as a finite nested-commutator sum whose only input is the active gap set. Both the geometric and algebraic aspects of the SWT physics are revealed. The gSWT framework is illustrated in two quantum many-body models, the collective spin model and the transverse-field Ising model.", "url": "https://arxiv.org/abs/2611.22014", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tie-Cheng Guo"}], "featured_authors": [{"name": "Tie-Cheng Guo"}], "author_count": 1}, {"id": "2611.22048", "category": "quant-ph", "title": "Cantor correlations II. Synchronicity and bisynchronicity", "abstract": "We study synchronous and bisynchronous no-signalling correlations, defined over Cantor topological spaces, from the perspectives of both continuous variable quantum information and operator algebra theories. We focus on strategies, satisfying a natural no-signalling condition across the Cantor space levels, called graded, identifying a universal C*-algebra, whose tracial states of different types characterise synchronous correlations of respective types. The universal C*-algebra for bisynchronous graded correlations is shown to coincide with the C*-algebra of a projective limit of free wreath products of quantum permutation groups, introduced by Bhowmick, Goswami and Skalski, and a type description, analogous to the one in the synchronous case, is provided. Extending results in the finite case, we show that bisynchronous graded correlations canonically give rise to factorisable maps on type I factors, defined via Cantor permutation matrices. We examine non-local games over Cantor topological spaces, with inputs/outputs that are finite words of equal length, define corresponding game algebras, and characterise the perfect strategies of the games via the respective game algebras. In the case of the Cantor graph isomorphism game, we provide equivalent descriptions of the existence of perfect strategies of quantum commuting type, in terms of bigalois correspondences, factorisable maps, Cantor permutation intertwiners and game algebra non-triviality. Our results supply a quantum information interpretation of a notion of a quantum isomorphism of locally finite graphs, introduced by Rollier and Vaes, canonically arising from Cantor graphs.", "url": "https://arxiv.org/abs/2611.22048", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Georgios Baziotis"}, {"name": "Alexandros Chatzinikolaou"}, {"name": "Ivan G. Todorov"}, {"name": "Lyudmila Turowska"}], "featured_authors": [{"name": "Georgios Baziotis"}, {"name": "Alexandros Chatzinikolaou"}, {"name": "Ivan G. Todorov"}, {"name": "Lyudmila Turowska"}], "author_count": 4}, {"id": "2611.22087", "category": "quant-ph", "title": "Commutator-guided repair and classical-accessibility boundaries for shallow quantum circuits", "abstract": "Trainability does not guarantee low-energy arrival: a shallow quantum circuit can be optimizable yet fail, under fixed depth and evaluation budgets, to reach Hamiltonian-selected states. We introduce a commutator-guided repair for this operational failure mode. Low-order host--Hamiltonian commutators and fixed same-support companion axes define a restricted pool of local Pauli rotations, from which a compact completion layer is selected before full reoptimization. Across 189 paired six-qubit trials, unrepaired circuits achieve 0/189 strict successes, a non-deployable per-trial control envelope achieves 109/189, and two predeclared selectors achieve 133/189 and 127/189. The repair loses to matched controls for transverse-field Ising, is weak for pure-ZZ MaxCut, and remains size-limited for weighted MIS. Under fixed-depth geometric locality, repaired losses and gradients are classically computable, while corresponding ground-state targets admit low-bond-dimension tensor-network approximations through the tested sizes. The method reveals a trainability--arrival--classical-accessibility tradeoff rather than quantum advantage.", "url": "https://arxiv.org/abs/2611.22087", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yifeng Peng"}, {"name": "Sunpreet Singh Arora"}, {"name": "Harshal Shah"}, {"name": "Srinivasan Raghuraman"}, {"name": "Kim Wagner"}, {"name": "Bin Yan"}], "featured_authors": [{"name": "Yifeng Peng"}, {"name": "Sunpreet Singh Arora"}, {"name": "Harshal Shah"}, {"name": "Srinivasan Raghuraman"}, {"name": "Kim Wagner"}, {"name": "Bin Yan"}], "author_count": 6}, {"id": "2611.22108", "category": "quant-ph", "title": "Perturbative Recovery of Stabilizer-Subspace Correlations for Quantum Computational Chemistry", "abstract": "Stabilizer-based subspace methods can substantially reduce the quantum resources required for electronic structure calculations, but the resulting projection neglects Hamiltonian couplings to configurations outside the retained subspace. In this work, we introduce Stabilizer-Subspace Perturbation Theory (SSPT) to recover the associated correlation contributions, using the Contextual Subspace Variational Quantum Eigensolver (CS-VQE) as a representative application. The central idea is to exploit the Pauli terms eliminated by stabilizer projection as perturbative operators that generate an external manifold from the optimized reference state. Their energetic contributions are evaluated using an Epstein-Nesbet-type second-order correction or a resolvent-based formulation that retains couplings within the external space. By exploiting the factorized structure of the stabilizer-constrained reference state, the required matrix elements can be evaluated through Pauli expectation values on the reduced contextual register without explicitly reconstructing the full-space wave function. Molecular benchmarks demonstrate substantial reductions in projection-induced energy errors, allowing chemical precision to be achieved with fewer contextual qubits in several cases. These results establish stabilizer-guided perturbation theory as a promising strategy for improving the accuracy of resource-efficient quantum chemistry calculations.", "url": "https://arxiv.org/abs/2611.22108", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Qianjun Yao"}, {"name": "Jie Liu"}, {"name": "He Li"}], "featured_authors": [{"name": "Qianjun Yao"}, {"name": "Jie Liu"}, {"name": "He Li"}], "author_count": 3}, {"id": "2611.22123", "category": "quant-ph", "title": "Two-Qutrit Quantum Battery Charging through Ising Model and Anisotropic XZ Heisenberg Interactions", "abstract": "In this paper, we propose a model of a two-qutrit quantum battery composed of two spin-1 systems coupled to an external field via anisotropic Heisenberg interactions. From the Ising model, we derive an exact analytical expression of ergotropy in the parallel-charging case. However, the collective charging process offers an advantage over the parallel one. Moreover, increasing the collective exchange coupling accelerates the evolution of ergotropy and enhances the maximum average power, as measured by global coherence and mutual information. Conversely, the Dzyaloshinskii-Moriya (DM) interaction primarily acts as a detrimental mechanism, essentially reducing all of these quantities. In the XZ model, the obtained results show that the DM interaction is constructive when it cooperates with the longitudinal anisotropy and when the exchange coupling is sufficiently strong. Therefore, by optimising the maximum reachable ergotropy and maximum average power, we conclude that the Ising model without DM interaction is sufficient to maximise the ergotropy. The anisotropic XZ model allows the DM interaction to be exploited constructively to improve the maximum average power through the joint control of the exchange coupling, longitudinal anisotropy, and chiral interaction.", "url": "https://arxiv.org/abs/2611.22123", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "F. El Hani"}, {"name": "I. El Aouadi"}, {"name": "K. El Anouz"}, {"name": "A. El Allati"}], "featured_authors": [{"name": "F. El Hani"}, {"name": "I. El Aouadi"}, {"name": "K. El Anouz"}, {"name": "A. El Allati"}], "author_count": 4}, {"id": "2611.22125", "category": "quant-ph", "title": "Exceptional-point Sensing with Quantum Advantage", "abstract": "Exceptional-point sensors exploit singular non-Hermitian dynamics to enhance their response to weak perturbations. Recently, however, a no-go result has been established for a gain-loss-balanced dimer coupled to independent, phase-insensitive reservoirs: the exceptional-point susceptibility amplifies the signal and reservoir noise equally, precluding any quantum advantage. Here, we circumvent this limitation by engineering non-Hermitian dynamics in particle-hole Nambu space. A single common reservoir acts on modes forming a quantum-mechanics-free subsystem and generates an enhanced response protected from additional noise. We demonstrate quantum-metrological advantage for weak-signal sensing and static-parameter estimation. A continuous interpolation of the operator basis at fixed exceptional-point drift, with a singular midpoint, reveals how reservoir noise vanishes toward the protected limit. Our results provide a route to exceptional-point sensing with genuine quantum-metrological advantage through reservoir engineering.", "url": "https://arxiv.org/abs/2611.22125", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chuming Wang"}, {"name": "Xinyao Guo"}, {"name": "Dezhi Zhang"}, {"name": "Mingchen Liu"}, {"name": "Yifei Li"}, {"name": "Haixing Miao"}, {"name": "Yiqiu Ma"}], "featured_authors": [{"name": "Chuming Wang"}, {"name": "Xinyao Guo"}, {"name": "Dezhi Zhang"}, {"name": "Yifei Li"}, {"name": "Haixing Miao"}, {"name": "Yiqiu Ma"}], "author_count": 7}, {"id": "2611.22192", "category": "quant-ph", "title": "Symmetry-selected entanglement death at Floquet resonances of parametrically coupled qubits", "abstract": "Periodic modulation of a qubit--qubit coupling is a standard way to engineer quantum interactions, but a strong modulation also reorganizes the transitions through which the qubits dissipate into a comb of Floquet channels. We study two identical, strongly coupled qubits whose transverse coupling is modulated anharmonically, as by a nonlinear coupler, with each qubit damped by its own reservoir. The modulation raises the ground-state concurrence of the cycle-averaged Hamiltonian from 0.45 to above 0.8, yet the steady-state concurrence stays close to its undriven value except at Floquet resonances selected by symmetry. There it undergoes entanglement death, vanishing at all times in the drive cycle over a finite range of modulation depths. Parity and exchange symmetry split the Floquet spectrum into an even sector, whose branches anticross at multiphoton resonances, and an exactly solvable odd sector, whose branches cross. Every dissipative channel connects the two sectors, so only the even anticrossings cause entanglement death, provided their gap exceeds the damping rate, whereas the nearby odd crossings leave the concurrence unchanged. Comparing time-independent and Floquet master equations, with and without the secular approximation, we show that the basis in which the dissipator is built changes the entanglement by up to 0.2 for an Ohmic bath and 0.5 for a flat one, whereas the secular approximation matters only near anticrossings with gaps comparable to the damping. The basis matters most when the bath has spectral weight at low frequency, where the drive moves dissipative channels through zero frequency. A transverse field that breaks parity lifts the selection rule.", "url": "https://arxiv.org/abs/2611.22192", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kamran Akbari"}, {"name": "Stephen Hughes"}], "featured_authors": [{"name": "Kamran Akbari"}, {"name": "Stephen Hughes"}], "author_count": 2}, {"id": "2611.22211", "category": "quant-ph", "title": "Emergence and Persistence of Maximal Atom-Field Entanglement in the Jaynes-Cummings model", "abstract": "We investigate the emergence and persistence of maximal entanglement between a two-level atom and a single-mode quantized electromagnetic field inside a cavity, whose dynamics are governed by the Jaynes-Cummings Hamiltonian. Using the von Neumann entropy as a measure of entanglement, we establish a direct connection between entanglement, atomic coherence, and atomic population inversion. This establishment shows that maximal atom-field entanglement is achieved when both the atomic population inversion and the $l_1$-norm of atomic coherence simultaneously vanish. By considering the atom initially in its excited state, we further demonstrate that the persistence of maximal atom-field entanglement strongly depends on the initial state of the field. For field states whose photon-number distributions have no two consecutive occupied photon-number levels, the local atomic coherence remains zero throughout the evolution. Consequently, complete collapse of the atomic population inversion for an extended period leads to persistent maximal atom-field entanglement. In contrast, for other field states, the interaction generates local atomic coherence, resulting in transient maximal entanglement. Our results demonstrate how the choice of the initial field state controls the temporal characteristics of entanglement in the Jaynes-Cummings system. The generation and persistence of maximal atom-field entanglement in such systems could be valuable for applications in quantum information processing.", "url": "https://arxiv.org/abs/2611.22211", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Siva Prasanna Karri"}, {"name": "Mounika Sri Gudipati"}, {"name": "Nilakantha Meher"}], "featured_authors": [{"name": "Siva Prasanna Karri"}, {"name": "Mounika Sri Gudipati"}, {"name": "Nilakantha Meher"}], "author_count": 3}, {"id": "2611.22260", "category": "quant-ph", "title": "Logical error prediction and geometry selection for rectangular surface codes under biased circuit-level noise", "abstract": "Realistic quantum hardware often exhibits biased noise, but at the circuit level this bias may affect only a subset of operations and need not be transferred uniformly to logical errors. The logical response to a given physical bias is therefore central to selecting resource-efficient surface code geometries. Here, we study unrotated rectangular surface codes under standard depolarizing and superconducting-inspired circuit-level noise models. We first construct geometry-dependent logical error rate models from unbiased circuit-level simulations. We then use logical sensitivities to compare the responses to localized idle-bias and global physical error perturbations, defining logical-error-type-dependent response coefficients from an unbiased reference circuit without fitting to finite-bias data. These coefficients are incorporated through effective error parameters, yielding a median fold error of 1.09 over the evaluated finite-bias conditions. Geometries selected by the model are validated through direct biased circuit-level simulations. At a physical error rate of 0.004 and a target logical error rate of 10^{-3}, the validated rectangular codes reduce physical qubit overhead by up to 42.4% and 26.2% under the two noise models, respectively, relative to unrotated square codes. These results provide a practical link between circuit-level bias response and resource-efficient surface code design.", "url": "https://arxiv.org/abs/2611.22260", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Youshin Chung"}, {"name": "Yujin Kang"}, {"name": "Jun Heo"}], "featured_authors": [{"name": "Youshin Chung"}, {"name": "Yujin Kang"}, {"name": "Jun Heo"}], "author_count": 3}, {"id": "2611.22315", "category": "quant-ph", "title": "Circuit compilation in the quspect quantum SDK: selecting routings after coupling-constrained resynthesis", "abstract": "quspect is an open-source quantum computing SDK that provides circuit construction, C++ state-vector simulation with adjoint gradients, support for variational and combinatorial-optimization algorithms, Hamiltonian simulation, control-pulse envelopes and backends for several cloud quantum processors. Here we describe and evaluate its circuit compiler. Routing and synthesis interact: inserting a SWAP can change the circuit structure that later optimization exploits. At its highest optimization level, the compiler evaluates a screened set of routing candidates by their cost after coupling-constrained resynthesis. The pipeline combines parity-state A* search for small CNOT-phase regions, heuristic synthesis for larger regions, and numerical three-qubit instantiation with a per-block 10^-9 check. For a fixed phase polynomial, A* certifies the minimum CX count when it reaches a goal within budget. On an evaluation set of 55 circuits from 41 arXiv papers on five topologies, the compiler uses 0.616 times as many two-qubit gates as Qiskit O3 (95% circuit-cluster bootstrap interval 0.555-0.679) at 0.592 times its depth. BQSKit level 2 reaches 0.853 and tket 0.930. On a 17-qubit superconducting processor, the compiled circuits had the fewest CZ gates in all six scenarios of the main run. Ablations assess the contributions within the integrated pipeline.", "url": "https://arxiv.org/abs/2611.22315", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xusheng Xu"}, {"name": "Runqing Zhang"}, {"name": "Hongtao Xue"}, {"name": "Jize Han"}, {"name": "Jingwei Wen"}, {"name": "Ruoyu Zhou"}, {"name": "Lei Jin"}, {"name": "Xiaoxiao Hu"}, {"name": "Gui-Lu Long"}], "featured_authors": [{"name": "Xusheng Xu"}, {"name": "Runqing Zhang"}, {"name": "Hongtao Xue"}, {"name": "Lei Jin"}, {"name": "Xiaoxiao Hu"}, {"name": "Gui-Lu Long"}], "author_count": 9}, {"id": "2611.22358", "category": "quant-ph", "title": "Optimizing interference zeros for finite-pulse transmission in waveguide quantum electrodynamics", "abstract": "A photon pulse occupies a range of frequencies, so suppressing reflection at its carrier need not minimize the error of the transmitted pulse. We study two separated emitters coupled to a common waveguide at several contact points. Interference between the contact paths can make the coupling that drives each emitter quadratic in frequency detuning. With matched propagation and emitter resonances centered on the carrier, the reflected fields cancel once more. Their combined reflection probability is then sixth order at zero loss. Separating each local double zero into two simple zeros can nevertheless improve transmission of a finite pulse. We minimize the leading narrowband error within this common static adjustment, counting reflection, absorption, and distortion of the transmitted mode. For a Gaussian pulse without loss, the minimum is two-fifths of the error for coincident zeros. Independent emitter loss favors a smaller separation because photons entering separate reservoirs do not share the cancellation of the reflected fields. The optimum follows from the pulse spectrum and the relative weight of these two processes. Uniform and Su--Schrieffer--Heeger waveguides realize the mechanism. In the latter, coordinated contact and resonance adjustments also preserve the full ratio of complex transmission amplitudes for opposite incidence directions. Finite-band calculations determine how the benefit changes with bandwidth and contact errors.", "url": "https://arxiv.org/abs/2611.22358", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "J. Zhou"}, {"name": "Y. M. Zhang"}, {"name": "X. Z. Zhang"}], "featured_authors": [{"name": "J. Zhou"}, {"name": "Y. M. Zhang"}, {"name": "X. Z. Zhang"}], "author_count": 3}, {"id": "2611.22391", "category": "quant-ph", "title": "Strong eigenstate thermalization in Singer-cycle Clifford circuits", "abstract": "Eigenstate thermalization hypothesis (ETH) provides a central framework for understanding thermalization in isolated quantum systems. Recently, the infinite-temperature ETH has been established for almost all Floquet eigenstates in linear feedback shift register quantum circuits. Here we introduce brickwork Clifford circuits with $L$ qubits where the induced transformation of Pauli operators is represented by an irreducible symplectic matrix over the finite field $\\mathbb F_2$ of the maximal order $2^L+1$, known as a Singer cycle. For these Singer-cycle Clifford circuits, we prove a strong version of ETH: all Floquet eigenstates are thermal at infinite temperature without exceptions. We derive uniform bounds on both diagonal deviations from thermal expectation values and off-diagonal matrix elements of arbitrary observables supported on a fixed number of sites. The results indicate that long-time averages of observables approach the infinite-temperature values in the thermodynamic limit for arbitrary initial states. We also show that the temporal fluctuation of expectation values of observables is exponentially suppressed in the thermodynamic limit, implying that each observable remains close to the infinite-temperature value for almost all times.", "url": "https://arxiv.org/abs/2611.22391", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Naoto Tsuji"}], "featured_authors": [{"name": "Naoto Tsuji"}], "author_count": 1}, {"id": "2611.22448", "category": "quant-ph", "title": "Analytical prediction of superradiant burst dynamics in extended atomic ensembles", "abstract": "We present an open-system quantum theory of forward superradiant bursts in extended two-level atomic ensembles using coupled Heisenberg-Langevin and Maxwell propagation equations. Starting from a fully inverted state with zero mean polarization, local dipole correlations initiate emission without a prescribed tipping angle or stochastic seed. Assuming a spatially uniform population inversion while retaining longitudinal field propagation and spatially dependent atomic polarization, we derive an analytical expression for the absolute photon emission rate into the selected forward optical channel. Coupled to self-consistent inversion dynamics, the expression quantitatively reproduces the pulse waveform and absolute peak rate from spatially resolved stochastic simulations for the sample parameters considered, up to an optical depth (OD) of approximately 200. At higher OD, longitudinal inversion gradients limit the approximation, while the peak rate trends toward Dicke-like quadratic scaling and the pulse width decreases approximately inversely with OD. The framework thus connects quantum initiation, propagation, and inversion depletion while delineating the limits of a spatially reduced description.", "url": "https://arxiv.org/abs/2611.22448", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wei-Lin Chen"}, {"name": "Zi-Yu Liu"}, {"name": "Jiun-Shiuan Shiu"}, {"name": "Yong-Fan Chen"}], "featured_authors": [{"name": "Wei-Lin Chen"}, {"name": "Zi-Yu Liu"}, {"name": "Jiun-Shiuan Shiu"}, {"name": "Yong-Fan Chen"}], "author_count": 4}, {"id": "2611.22505", "category": "quant-ph", "title": "Quantum Optimal Control of Many-Body States in an Antiferromagnetic XXZ Chain with a Single Local Magnetic Field", "abstract": "We investigate the quantum optimal control of an antiferromagnetic XXZ spin chain with open boundary conditions, driven solely by a local time-dependent magnetic field applied to a single terminal spin. By optimizing the control field via Krotov's algorithm, we evaluate the feasibility of preparing multi-particle many-body states, including highly polarized Greenberger-Horne-Zeilinger (GHZ)-type states and study the mechanisms by which the control is applied. We demonstrate that global spin-flip symmetry restricts reachable state spaces, strictly confining dynamics within the parity sector of the initial ground state and requiring parity-adapted linear combinations to avoid fundamental population upper bounds. Beyond symmetry constraints, driven population transfer does not occur via direct multi-spin flips, but proceeds stepwise across intermediate magnetization sectors ($|S_{\\mathrm{tot}}^z| = 0 \\to 1 \\to 2 \\to 3$) mediated by resonant frequency components matching the internal energy gaps. To overcome optimization stagnation caused by the small overlap mechanism in gradient updates, we introduce a four-stage sequential target protocol and compared it to spectrally filtered, time-localized frequency seed pulses. Combining frequency-tailored seed fields with an extended propagation time window yields GHZ state preparation fidelities exceeding $0.927$ establishing that a single local actuator is sufficient for high-fidelity multipartite state engineering in interacting spin networks.", "url": "https://arxiv.org/abs/2611.22505", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nicolás Rojo"}, {"name": "Ignacio R. Solá"}, {"name": "Juan J. Omiste"}], "featured_authors": [{"name": "Nicolás Rojo"}, {"name": "Ignacio R. Solá"}, {"name": "Juan J. Omiste"}], "author_count": 3}, {"id": "2611.22546", "category": "quant-ph", "title": "Multilevel Effects and the Limits of the Quantum Rabi Model in Ultrastrong Coupling system", "abstract": "The spectrum of artificial atoms coupled to resonators in the ultrastrong coupling regime have been analyzed using the quantum Rabi model over a wide range of coupling strengths. However, the accuracy of models obtained by truncating multilevel artificial atoms to two levels, as well as the correspondence between effective parameters extracted from spectral fitting and the bare parameters of the circuit Hamiltonian, depends on the multilevel structure of the system. In this study, I analyze the spectrum of an ultrastrongly coupled circuit consisting of a multilevel superconducting artificial atom and a resonator using a circuit Hamiltonian, and investigate the effects of truncating higher atomic levels on the low-energy spectrum. Based on Löwdin partitioning, I evaluate the contributions of virtual transitions through higher atomic levels and show that diagonal energy corrections reduce the errors arising from simple two-level truncation over a wide parameter range. I also show that there are parameter regimes in which readjustment of the effective Rabi parameters successfully reproduces the multilevel spectrum, while systematic deviations remain in other regimes. These results demonstrate the necessity of separately evaluating two-level truncation, perturbative corrections, and effective-parameter fitting in ultrastrongly coupled systems, and provide guidance for quantitative spectral analysis of multilevel quantum circuits.", "url": "https://arxiv.org/abs/2611.22546", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Akiyoshi Tomonaga"}], "featured_authors": [{"name": "Akiyoshi Tomonaga"}], "author_count": 1}, {"id": "2611.22547", "category": "quant-ph", "title": "Predicting Quantum Mpemba Effects from Quantum Speed Limits", "abstract": "Can anomalous Quantum Mpemba Effects be anticipated before a system comes close to its stationary state? We employ Quantum Speed Limits as geometric indicators of Quantum Mpemba Effects, arguing that Mpemba physics is already imprinted in speed limits by benchmarking dissipative qubits and open spin chains. Our results show that short-time speed limits can predict Quantum Mpemba Effects at low cost and with reasonable precision over broad parameter regimes. This predictive power implies a useful application of speed limits for open many-body quantum systems.", "url": "https://arxiv.org/abs/2611.22547", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrea Nava"}, {"name": "Rosario Fazio"}, {"name": "Reinhold Egger"}], "featured_authors": [{"name": "Andrea Nava"}, {"name": "Rosario Fazio"}, {"name": "Reinhold Egger"}], "author_count": 3}, {"id": "2611.22553", "category": "quant-ph", "title": "Local distinguishability of five six-partite orthogonal product states", "abstract": "The local distinguishability of a set of orthogonal quantum states can be used to reduce the amount of quantum state transmission in quantum protocols and lower system operational costs and quantum resource overhead. In this paper, we investigate the local distinguishability of five six-partite orthogonal product states (OPSs), where any two states are orthogonal on only one subsystem. We classify all feasible sets of five six-partite OPSs into five categories with 249 cases in total, and prove that these sets can be perfectly distinguished by local operations and classical communication, except for two cases. For five six-partite OPSs corresponding to these two exceptional cases, we further discuss their local distinguishability. Our work fully characterizes the local distinguishability of all feasible sets of five six-partite OPSs.", "url": "https://arxiv.org/abs/2611.22553", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ben-Hao Zhao"}, {"name": "Dong-Huan Jiang"}, {"name": "Yu-Guang Yang"}, {"name": "Guang-Bao Xu"}], "featured_authors": [{"name": "Ben-Hao Zhao"}, {"name": "Dong-Huan Jiang"}, {"name": "Yu-Guang Yang"}, {"name": "Guang-Bao Xu"}], "author_count": 4}, {"id": "2611.22621", "category": "quant-ph", "title": "Entanglement Lower Bounds for Symmetric Quantum Circuits", "abstract": "Symmetric circuits require every symmetry of the input to extend to an automorphism of the circuit. In the classical setting, their connection to descriptive complexity yields strong unconditional lower bounds. We extend this approach to the quantum model of symmetric computation defined by Castro-Silva, Gur, and Strelchuk (ITCS 2026), proving a tradeoff between circuit size and entanglement width (the smallest $b$ such that, on every computational-basis input, the state after each layer factors into states on at most $b$ qubits each). Our main result identifies a graph property decidable in classical polynomial time that no polynomial-size family of symmetric quantum circuits on $n$-vertex graphs with entanglement width $o(n/\\log n)$ can compute. The bound holds for circuits with arbitrary one-qubit and two-qubit gates and unrestricted depth, and remains valid under the weaker notion of symmetry with respect to even permutations of vertices. Our proof is based on a new quantum pebble game based on the partial trace. The resulting indistinguishability theorem transfers classical pebble-game lower bounds to quantum circuits with restricted entanglement. By contrast, without entanglement restrictions, we show that every graph property in BQP can be computed by a uniform family of polynomial-size symmetric quantum circuits. Restricting to circuits with no entanglement at all, we show that polynomial-size symmetric quantum circuits with entanglement width 1 can compute every graph property definable in fixed-point logic with counting. Finally, we give an efficient symmetric implementation of QAOA for MAX 3XOR, providing a starting point for studying entanglement lower bounds in quantum optimization algorithms.", "url": "https://arxiv.org/abs/2611.22621", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Davi Castro-Silva"}, {"name": "Ryan Dancy"}, {"name": "Sergii Strelchuk"}], "featured_authors": [{"name": "Davi Castro-Silva"}, {"name": "Ryan Dancy"}, {"name": "Sergii Strelchuk"}], "author_count": 3}, {"id": "2611.22630", "category": "quant-ph", "title": "Quantum speed limits from symmetries: A numerical analysis", "abstract": "Target-specific quantum speed limits (QSLs) bound the minimal time required to realize a given operation. Recent theoretical work derives these limits directly from the symmetries of the dynamical Lie algebra of the control system and a symmetry-restoring perturbation, bypassing the need to solve the equations of motion. In practice, however, identifying a suitable symmetry and a perturbation that restores it demands strong physical intuition and offers no guarantee of tightness. We show that, for any given symmetry, the minimal restoring perturbation is the solution of a convex semidefinite program, which can be solved to global optimality and thus yields the tightest achievable speed limit for that symmetry. This semidefinite program is one building block of our numerical method, alongside an explicit computation of the space of admissible symmetries and a search over this space. Since this search is non-convex, it is addressed with gradient-based optimization, black-box heuristics, or the injection of physically motivated candidate symmetries. We apply the method to three examples: a two-qubit CNOT gate, a SWAP on a spinless-particle chain, and a Dicke state preparation on a qubit ring. Our results improve on previously known symmetry-based bounds, most notably for the SWAP, where solving the semidefinite program for the known analytical symmetry tightens the bound by a factor of approximately 2.5. For the Dicke state preparation, however, the bounds decrease with system size, which we trace back to a symmetry-independent perturbation ceiling. This work provides a reproducible numerical procedure for constructing target-specific quantum speed limits directly from the system Hamiltonians and the target operation.", "url": "https://arxiv.org/abs/2611.22630", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Santana Lujan"}, {"name": "Marco Wiedmann"}, {"name": "Daniel Burgarth"}], "featured_authors": [{"name": "Santana Lujan"}, {"name": "Marco Wiedmann"}, {"name": "Daniel Burgarth"}], "author_count": 3}, {"id": "2611.22688", "category": "quant-ph", "title": "Proven optimality for LABS with quantum-classical branch and bound", "abstract": "Low autocorrelation binary sequences (LABS) are the phase codes of pulse compression radar and the synchronization words of digital communication, and finding the sequence of a given length whose aperiodic autocorrelations have the smallest sum of squares is a hard binary optimization problem. The quantum optimization methods tested on LABS so far return good sequences, but they cannot show that a sequence is optimal or bound how far from optimal it may be. We show that a quantum optimization algorithm can deliver proven optimality. In our quantum-classical branch and bound, fixed-angle QAOA samples the Hamiltonians of the nodes of the search tree, its samples supply candidate sequences and the branching choice, and classical bounds prune the tree, so that the algorithm returns either a proof of optimality or, if it is stopped early, the best sequence found with a certified lower bound and gap. It works on the native quartic Hamiltonian without penalty terms, and its correctness does not depend on the sampler. With QAOA at depth p= 12 and at p= 1 and 1,000 shots per node, it proved the optima of all lengths from 2 to 30, where from length 27 on the root node is split without being sampled. Every run records both bounds against time, and its primal-dual integral measures its convergence. We claim no speedup.", "url": "https://arxiv.org/abs/2611.22688", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "András Czégel"}], "featured_authors": [{"name": "András Czégel"}], "author_count": 1}, {"id": "2611.22693", "category": "quant-ph", "title": "Tomographic reconstruction of non-Markovian Gaussian noise in continuous-variable photonic systems", "abstract": "Memory effects in continuous-variable (CV) photonic systems can make standard Markovian Gaussian noise models inaccurate, even when the average noise strength is correctly calibrated. We propose a theoretical and simulation-based tomography framework for reconstructing such memory effects directly from time-resolved homodyne data. The method estimates an effective time-local Gaussian generator, represented by drift and diffusion matrices, using a regularized maximumlikelihood procedure constrained by complete positivity (CP) of the finite-time Gaussian channel. This description covers any Gaussian-preserving noise dynamics for which a well-defined time-local generator exists, rather than being restricted to particular noise mechanisms. Non-Markovianity is then diagnosed at the generator level through temporary violations of local CP-divisibility, rather than from time dependence alone. This distinction is important because ordinary nonstationary noise can remain CP-divisible, whereas genuine memory can produce a non-CP-divisible reduced generator while the accumulated channel remains physical. Numerical benchmarks covering memorydependent loss, nonstationary thermal excitation, and pseudomode-mediated memory show that the reconstruction distinguishes CP-divisible time-dependent noise from genuine non-CP-divisible dynamics and captures the corresponding signatures in the Gaussian covariance evolution. The framework therefore provides a practical route for diagnosing non-Markovian Gaussian noise in CV photonic quantum systems.", "url": "https://arxiv.org/abs/2611.22693", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hamid Reza Naeij"}], "featured_authors": [{"name": "Hamid Reza Naeij"}], "author_count": 1}, {"id": "2611.22774", "category": "quant-ph", "title": "Double-Bracket Quantum Algorithms for Preparing Multiple Excited States", "abstract": "Many problems in quantum chemistry, many-body physics, and optimization require excited states of a Hamiltonian. Double-bracket quantum algorithms compile circuits recursively from evolutions under the Hamiltonian and a second operator, without a parameterized ansatz. They have been proposed for several tasks, such as diagonalization and the preparation of ground and thermal states. In this work, we extend this framework to excited states. Combining the ensemble approach with double-bracket flows, we introduce the Double-Bracket quantum algorithm for Multiple EXcited states (DB-MEX), which evolves $p+1$ orthonormal states toward low-lying eigenstates of the Hamiltonian with a single recursively compiled quantum circuit, so they remain orthonormal by construction. The circuit approximates a double-bracket flow of a weighted sum of projectors onto the evolving states, whose number and weights are design parameters. The number of states sets the highest targeted excited state, and the weights determine whether the algorithm prepares the $p+1$ lowest eigenstates, only the $p$-th excited state, or only the span of the $p+1$ lowest eigenstates. In the latter case, a post-processing step recovers the individual eigenstates from their span. We show that the double-bracket flow and, for small step sizes, its discretization converge to the target for almost all initial states, with explicit local rates given by products of weight and energy gaps.", "url": "https://arxiv.org/abs/2611.22774", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Salahuddin Abdul Rahman"}, {"name": "Özkan Karabacak"}, {"name": "Rafal Wisniewski"}], "featured_authors": [{"name": "Salahuddin Abdul Rahman"}, {"name": "Özkan Karabacak"}, {"name": "Rafal Wisniewski"}], "author_count": 3}, {"id": "2611.22794", "category": "quant-ph", "title": "Time-Travel Paradox in a Bohmian Extension of Deutsch's Approach: Mandatory Tunneling as the \"Banana Peel Mechanism\"", "abstract": "We consider a self-prevention paradox in which a particle travels through a wormhole into its own past, encounters its younger version, and blocks its movement. In a specially constructed one-dimensional model, this collision rules out a classically self-consistent history. Deutsch's quantum approach can resolve such contradictions by imposing a self-consistency condition on the density matrix. The physical interpretation of this approach, however, remains debated. In particular, Dunlap argues that Deutsch's model presupposes the existence of interacting parallel worlds. Here we extend Deutsch's approach within de Broglie-Bohm theory by supplementing the self-consistency condition on the quantum state with a self-consistency requirement for the particle's ontic configuration. This allows us to consider the self-consistent evolution of an individual particle. In a two-channel, narrow-band Gaussian approximation, we find a self-consistent solution in which quantum tunneling is mandatory, despite its arbitrarily small probability in an ordinary scattering process. This realizes the \"banana peel mechanism\": to avoid a contradiction during a journey into the past, an event that would ordinarily be extremely unlikely occurs nonetheless.", "url": "https://arxiv.org/abs/2611.22794", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vladimir Nikitin"}], "featured_authors": [{"name": "Vladimir Nikitin"}], "author_count": 1}, {"id": "2611.22810", "category": "quant-ph", "title": "Depth-Dependent Collapse and Warm-Start Limits of a Symmetry-Preserving VQE for the J$_1$--J$_2$ Heisenberg Ring", "abstract": "Increasing circuit depth is expected to improve a variational quantum eigensolver (VQE). We show that this expectation can fail, and that curing the failure does not guarantee the exact ground state. We study a symmetry-preserving ansatz of SingleExcitationMinus gates, started from the Néel state, on the frustrated spin-$1/2$ $J_1$--$J_2$ Heisenberg ring with $N=10$ and $12$ sites. With random initialization the fidelity, energy error, half-chain entropy and total spin change abruptly at intermediate depth ($L\\approx 9$ for $N=10$, $L=10$--$12$ for $N=12$), giving improvement, degradation and recovery, a double-descent-like shape. The circuit family is nested and the gradient stays finite, so this is an optimization failure, not a loss of expressibility or a barren plateau. A chained warm start, which extends an optimized shallow circuit with identity layers, removes the collapse and improves energy error and fidelity almost monotonically for most frustration values. However, near $J_2/J_1=0.60$ ($N=10$) and over $J_2/J_1=0.60$--$1.00$ ($N=12$) the warm start stalls at a fidelity of $\\approx 0.50$--$0.58$, although the energy error is small and the total spin stays in the $S=0$ sector. Removing the non-monotonic depth dependence is therefore not the same as reaching the ground state, and low energy and a singlet-like state are not sufficient: the fidelity, entropy and total spin must be satisfied together. The conclusions are limited to the system sizes and frustration values studied.", "url": "https://arxiv.org/abs/2611.22810", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Soumyadip Sahoo"}, {"name": "Sahinur Reja"}], "featured_authors": [{"name": "Soumyadip Sahoo"}, {"name": "Sahinur Reja"}], "author_count": 2}, {"id": "2611.22834", "category": "quant-ph", "title": "Molecular energies from sparse quantum prolate diagonalization on a trapped-ion quantum processor", "abstract": "We introduce sparse quantum prolate diagonalization (sparse QPD), which combines the original formulation of QPD [Phys. Rev. Res., 8(3), 033177, (2026)] with compressed sensing to exploit Hamiltonian spectrum sparsity for molecular systems. We show that sparse sampling reduces the sample complexity of QPD from $\\mathcal{O}(N_s)$ to $\\mathcal{O}(\\log N_s)$, where $N_s$ is the number of sampled points of the autocorrelation function (i.e.\\ distinct circuits), without increasing circuit depth at chemical accuracy. With a two-orbital active-space-embedded Hamiltonian for an interacting arginine--tryptophan residue pair in water as an example, we show that on the Quantinuum Helios trapped-ion quantum computer, sparse QPD resolves the Hamiltonian energies to chemical accuracy with circuits of up to 448 two-qubit gates. For a suitably large quantum processor, we demonstrate numerically in the weakly correlated regime that the method extends to larger systems.", "url": "https://arxiv.org/abs/2611.22834", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Davide Castaldo"}, {"name": "Marvin Kronenberger"}, {"name": "Marek Miller"}, {"name": "Sélène Forget"}, {"name": "Gemma C. Solomon"}, {"name": "Kresten Lindorff-Larsen"}, {"name": "Matthias Christandl"}, {"name": "Markus Reiher"}], "featured_authors": [{"name": "Davide Castaldo"}, {"name": "Marvin Kronenberger"}, {"name": "Marek Miller"}, {"name": "Kresten Lindorff-Larsen"}, {"name": "Matthias Christandl"}, {"name": "Markus Reiher"}], "author_count": 8}, {"id": "2611.22893", "category": "quant-ph", "title": "Exact classical bounds of bipartite correlation Bell inequalities using improved branch-and-bound", "abstract": "We present an improved branch-and-bound (IBB) algorithm for the exact computation of classical (local) bounds of bipartite correlation Bell inequalities. We strengthen pruning in the standard BB algorithm in two ways: a heuristic search based on see-saw iteration supplies a strong initial lower bound, and greedy row reordering of the Bell matrix reduces the tail bounds used during the exact search. An OpenMP implementation combines these improvements with shared-memory parallelism and dynamic work redistribution. Random-matrix benchmarks show substantial runtime reductions in matrix sizes, while explicit constructions demonstrate exact local-bound computations for square matrices up to $130 \\times 130$ and rectangular matrices of sizes up to $81 \\times 321$. Applications provide improved lower bounds on finite-order Grothendieck constants for $d=3,4,5,7$ and uniform-input XOR games with quantum-to-classical ratios exceeding $\\sqrt2$. The method retains an exponential worst-case search for this NP-hard optimization problem, and its practical performance depends on matrix structure and tail-bound preprocessing depth.", "url": "https://arxiv.org/abs/2611.22893", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "István Márton"}, {"name": "Erika Bene"}, {"name": "Péter Diviánszky"}, {"name": "Tamás Vértesi"}], "featured_authors": [{"name": "István Márton"}, {"name": "Erika Bene"}, {"name": "Péter Diviánszky"}, {"name": "Tamás Vértesi"}], "author_count": 4}, {"id": "2611.22906", "category": "quant-ph", "title": "Development of a Discrete Variable Representation of a Field-Adaptive Hermite Basis for Accurate Modeling of Magnetically Confined Systems", "abstract": "Accurate magnetic-field evolution of spectra requires a common wavefunction representation that consistently describes multiple states across different field regimes. Discrete Variable Representation (DVR) methods combine accurate basis-based kinetic-energy evaluation with flexible real-space potential representation, enabling arbitrary non-analytic potentials to be treated. Here, we develop a magnetic-field-dependent Hermite function-based (Hermite-B) DVR that adapts naturally to magnetic confinement, efficiently representing compressed wavefunctions across a wide range of field strengths while remaining centered in regions relevant to the scalar confinement potential. This ensures accurate treatment of the field-dependent kinetic energy while addressing two key challenges: maintaining accuracy from the Zeeman to Landau regimes and accommodating diverse confinement potentials. We also introduce a spatial restriction scheme that confines Hermite DVR grid points to a fixed-length domain, enabling compact representations for smooth potentials. The method is benchmarked for two-dimensional quantum dots in perpendicular magnetic fields against analytical models and compared with finite-grid, sine DVR, and field-free Hermite DVR calculations. The performance of field-independent DVR methods for magnetically confined systems is also investigated for the first time. Excellent agreement with exact analytical spectra and wavefunctions is obtained, with Hermite-B requiring the fewest basis functions and smaller Hamiltonian matrices, improving computational efficiency. Applications to arbitrary confinement potentials and tilted magnetic fields demonstrate its versatility beyond analytically solvable systems. The proposed method offers a robust, accurate, and efficient framework for large-scale calculations of realistic semiconductor nanostructures and molecular systems in external magnetic fields.", "url": "https://arxiv.org/abs/2611.22906", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Athul Tom"}, {"name": "Pratyush Bhattacharjya"}, {"name": "Sangita Sen"}], "featured_authors": [{"name": "Athul Tom"}, {"name": "Pratyush Bhattacharjya"}, {"name": "Sangita Sen"}], "author_count": 3}, {"id": "2611.22915", "category": "quant-ph", "title": "Entanglement cost and classical capacity of multimode Gaussian states and channels", "abstract": "Gaussian states and operations are central to continuous-variable quantum information and communication. For systems with any finite number of modes, we prove that entanglement of formation, Gaussian entanglement of formation, and entanglement cost coincide for every finite-energy bipartite Gaussian state. Their common value is strongly superadditive and lower-bounds entanglement of formation and entanglement cost for arbitrary non-Gaussian states with the same covariance matrix. We then determine the entanglement cost of every multimode Gaussian channel as well as its classical capacity under a mean energy constraint. These quantities reduce to Gaussian covariance optimizations, and the capacity is attained by pure Gaussian signals with Gaussian displacement modulation, independently across channel uses. The proof combines geodesic convexity of entanglement for pure Gaussian states with a relative-entropy inequality for arbitrary states. We also obtain a closed formula for the entanglement cost of a family of four-mode bound entangled states.", "url": "https://arxiv.org/abs/2611.22915", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuan Gao"}, {"name": "Gerardo Adesso"}], "featured_authors": [{"name": "Yuan Gao"}, {"name": "Gerardo Adesso"}], "author_count": 2}, {"id": "2611.22916", "category": "quant-ph", "title": "Problem-adjusted $X$-mixer eigenstates for improved QAOA", "abstract": "We show that the use of problem-adjusted excited eigenstates of the $X$-mixer Hamiltonian can be beneficial for the performance of the Quantum Approximate Optimization Algorithm (QAOA) when applied to problems with degenerate ground states. We show that this advantage persists in the presence of quantum gate and readout noise, with the problem-adjusted excited initial states achieving better optimal performance than the standard ground state initialization. The realized advantage depends on the number of QAOA layers and whether or not the initial state has a reasonable time evolution path into the ground space of the problem Hamiltonian. We also explain how to prepare these problem-adjusted $X$-mixer eigenstates exactly, as well as how to approximate them using a linear combination of ladder operators. Finally, we discuss how the power of these initial states can be applied to any problem Hamiltonian regardless of the degeneracy of its ground state by making use of a Grover-style mixer Hamiltonian.", "url": "https://arxiv.org/abs/2611.22916", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matvii Kistaiev"}, {"name": "Georgios Korpas"}, {"name": "Bart Partoens"}, {"name": "Matthias Van der Donck"}], "featured_authors": [{"name": "Matvii Kistaiev"}, {"name": "Georgios Korpas"}, {"name": "Bart Partoens"}, {"name": "Matthias Van der Donck"}], "author_count": 4}, {"id": "2611.23128", "category": "quant-ph", "title": "Causality, determinism and predictability: Probing nature through classical and quantum eyes", "abstract": "In this article, mainly focussed on students and interested readers, we discuss how the understanding of causality, determinism and predictability is transformed as we move from the classical world view to the quantum description. We first explain how determinism and predictability operate in classical dynamics and outline the notion of causality. A paradigm shift occurs within the framework of quantum mechanics where we have to revisit, and even give up, the notions of determinism, predictability and maybe even strict causality. An engrossing and fascinating debate ensues, after the formulation of quantum mechanics among the giants of physics like Einstein, Bohr, Heisenberg, Pauli, and many others. While some questions have been settled in the last century in favour of quantum world view, there are still many open questions, most important of which is the role of gravity in shaping events within the quantum framework.", "url": "https://arxiv.org/abs/2611.23128", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mundur V N Murthy"}, {"name": "Usha Devi A R"}], "featured_authors": [{"name": "Mundur V N Murthy"}, {"name": "Usha Devi A R"}], "author_count": 2}, {"id": "2611.23132", "category": "quant-ph", "title": "Non-equilibrium topological order from Floquet anyon proliferation in the toric code", "abstract": "We analyze the dynamics of Kitaev's toric code in Floquet quenches where the drive coherently creates and propagates fermionic $f$ anyons. We show that the long-time state departs from pure-state topological order but retains long-range entanglement, thereby realizing a Floquet analog of intrinsic mixed-state topological order. As a key result enabling this analysis, we derive decompositions of the entanglement entropy and logarithmic negativity that separate the ground-state value, including topological terms, from a contribution given by the driven quasiparticles. For a drive inducing non-interacting $f$ dynamics, these decompositions allow us to leverage numerical methods for free fermions and to link the emergence of the proposed long-time ordered state to the equilibration of $f$ anyons to a periodic Gibbs ensemble. For drives inducing Floquet eigenstate thermalization of $f$, our results suggest a scenario where Floquet heating of the $f$ sector stabilizes a genuine non-equilibrium topological phase, in contrast with the usual view of heating as an obstacle to order in periodically driven systems.", "url": "https://arxiv.org/abs/2611.23132", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Francesco Petiziol"}], "featured_authors": [{"name": "Francesco Petiziol"}], "author_count": 1}, {"id": "2611.23186", "category": "quant-ph", "title": "Integral Tensor Isomorphism via Cubic Rings and Lattice Methods", "abstract": "We prove that isomorphism of integral $2\\times3\\times3$ tensors under $\\mathrm{GL}_2(\\mathbb{Z})\\times\\mathrm{GL}_3(\\mathbb{Z})\\times\\mathrm{GL}_3(\\mathbb{Z})$ is decidable in bounded-error quantum polynomial time. For a tensor $T=(A,B)$ with nonzero determinant form $\\det(xA-yB)$, we use the parametrization of Wood by balanced modules to reduce the isomorphism problem to principality tests for compatible lattices, and use the algorithms of Bley, Hofmann, and Johnston to solve this in BQP. When the determinant form vanishes identically, we get either an integral $2\\times2\\times2$ core, or a polynomial kernel vector of degree one or two. The linear-kernel case yields another compatible lattice problem, while the quadratic-kernel case reduces to a fixed system of polynomial congruences and unimodular lifting. A quantifier-elimination argument decides these congruences in deterministic polynomial time given the prime factorization of the modulus, which quantum integer factorization supplies. Finally, we show that zero padding preserves integral $2\\times2\\times2$ tensor isomorphism, yielding a polynomial-time reduction from real-quadratic principality to the identically singular $2\\times3\\times3$ problem.", "url": "https://arxiv.org/abs/2611.23186", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Thomas Huffstutler"}], "featured_authors": [{"name": "Thomas Huffstutler"}], "author_count": 1}, {"id": "2611.23207", "category": "quant-ph", "title": "Local interference algorithms for observables in large random circuits", "abstract": "In quantum dynamics, it is generally believed that interference effects lead to a sign problem for classical Monte Carlo sampling methods, rendering sampling ineffective. In this paper we show that this is generically not the case for the task of simulating the evolution of observables in random instances of circuit dynamics. Specifically, we consider two examples of observables which give large signals despite the randomness of the dynamics: first order out-of-time-ordered correlators (OTOCs) in unstructured random circuits without conservation laws and time-ordered charge-charge correlators (TOCs) in particle number-preserving random circuits. We show that these observables can be approximated by classical stochastic processes and that these approximations can be systematically improved with a series expansion that incorporates coherent corrections associated with clusters of gates. We design and implement algorithms that combine Monte Carlo sampling and tensor network methods to approximate the series. We observe numerically that the computational complexity of approximating TOCs and OTOCs scales polynomially in the circuit size and in the target precision. We study the accuracy of these algorithms by directly mapping their ensemble-averaged errors to partition functions of replica statistical models, allowing for perturbative analysis and numerics in $1$d brickwork geometries. Our theoretical analysis explains the empirical observation of polynomial complexity of these algorithms and is consistent with polynomial complexity extending to arbitrarily small precision and to the thermodynamic limit.", "url": "https://arxiv.org/abs/2611.23207", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Philippe Suchsland"}, {"name": "Brayden Ware"}, {"name": "Vladislav D. Kurilovich"}, {"name": "Vadim Smelyanskiy"}, {"name": "Kostyantyn Kechedzhi"}], "featured_authors": [{"name": "Philippe Suchsland"}, {"name": "Brayden Ware"}, {"name": "Vladislav D. Kurilovich"}, {"name": "Vadim Smelyanskiy"}, {"name": "Kostyantyn Kechedzhi"}], "author_count": 5}, {"id": "2611.23227", "category": "quant-ph", "title": "Expressivity of two-dimensional Gaussian fermion tensor network states", "abstract": "Tensor network states (TNS) provide a family of efficiently compressed approximations to physically relevant many-body quantum states. An important quantity that characterizes the computational resources required by a TNS is its bond dimension. While in one dimension an area law for the Renyi-0 entropy guarantees an exact matrix product state representation with a bond dimension independent of the system size, an analogous statement does not hold for general states in two dimensions (2D). This leaves open the question of how the expressivity of 2D TNS is related to the entanglement properties of the states they represent. In this work, we focus on two families of 2D translation-invariant Gaussian fermionic states: single-band BCS superconductors and half-filled two-band insulators (including semimetals). For each family, we prove that an area law for the Renyi-0 entropy is equivalent to having an exact Gaussian fermionic TNS representation with a finite bond dimension determined by the Renyi-0 entropy. We also establish equivalent characterizations in terms of compactly supported Wannier-type orbitals and the momentum-space wavefunction, relating the spatial extent of these orbitals and the structure of the wavefunction to the required bond dimension.", "url": "https://arxiv.org/abs/2611.23227", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pok Man Tam"}, {"name": "William Musk"}, {"name": "Zhehao Dai"}], "featured_authors": [{"name": "Pok Man Tam"}, {"name": "William Musk"}, {"name": "Zhehao Dai"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
