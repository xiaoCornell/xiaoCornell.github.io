ion remain when such correlated catalysts are freely available? We answer this question in the positive-partial-transpose (PPT) resource theory, which allows a substantially broader class of operations than local operations and classical communication (LOCC). We identify general conditions under which regularized relative-entropy measures become strongly superadditive, and use them to construct monotones that constrain correlated catalytic PPT transformations without any knowledge of the catalyst. In particular, we prove that the regularized PPT relative entropy is fully additive and strongly superadditive, resolving an open problem in entanglement theory. Most importantly, these constraints show that even arbitrary correlated catalysts cannot restore asymptotic reversibility: for an explicit state, the optimal entanglement distillation rate remains strictly smaller than the entanglement cost. Thus, substantial catalytic assistance does not remove some of the fundamental limitations of mixed-state entanglement manipulation.", "url": "https://arxiv.org/abs/2608.20063", "type": "理论", "summary": "量子催化剂可以在不被消耗的情况下克服原本不可能的量子态转换，并且允许它们与输出相关联使得这种帮助变得更加强大。这给纠缠理论提出了一个基本问题：当这种相关催化剂可以免费获得时，状态操纵仍然存在哪些限制？我们在正部分转置（PPT）资源理论中回答了这个问题，该理论允许比局部操作和经典通信（LOCC）更广泛的操作类别。我们确定了正则化相对熵度量变得强超加性的一般条件，并使用它们构建单调，在不了解催化剂的情况下约束相关催化 PPT 变换。特别是，我们证明了正则化 PPT 相对熵是完全可加性和强超可加性的，解决了纠缠理论中的一个悬而未决的问题。\n\n最重要的是，这些约束表明，即使任意相关催化剂也无法恢复渐近可逆性：对于显式状态，最佳纠缠蒸馏速率仍然严格小于纠缠成本。因此，大量的催化辅助并不能消除混合态纠缠操纵的一些基本限制。", "authors": [{"name": "Jingsong Ao"}, {"name": "Aby Philip"}, {"name": "Alexander Streltsov"}], "featured_authors": [{"name": "Jingsong Ao"}, {"name": "Aby Philip"}, {"name": "Alexander Streltsov"}], "author_count": 3}, {"id": "2608.20088", "category": "quant-ph", "title": "Squeezed- and coherent-state quantum key distribution over a deployed hybrid fibre-free-space channel", "abstract": "Quantum networks will combine optical fibre with free-space links, yet continuous-variable quantum key distribution (CV-QKD) has been developed predominantly for one medium or the other, while operation across concatenated fibre-free-space channels remains largely unexplored. The two media impose contrasting requirements: fibre transmission is stable and permits long processing intervals, whereas atmospheric propagation imposes transmittance fluctuations that degrade security and must be resolved on short timescales. Here we demonstrate a locally generated local oscillator CV-QKD with both Gaussian-modulated coherent and squeezed states over a deployed hybrid channel comprising a 620-m free-space link and 2 km of deployed fibre, with a total loss up to 20 dB. Rather than adapting the optics to each medium, we move channel adaptation to the post-processing, through a unified adaptive post-processing framework coupling transmittance-based clustering, residual-fading mitigation by covariance-matrix averaging or de-fading, and rate-adaptive blind reconciliation, which alone recovers up to 19% additional key. The same adaptive-processing principle is applied to both protocols, while accounting for their different security analyses and statistical requirements, yielding asymptotic secret-key rates of 0.42 Mbit per sec for the coherent-state protocol and 0.93 Mbit per sec for the squeezed-state protocol under the respective channel conditions, and establishing squeezed-state CV-QKD over a deployed atmospheric channel. These results show that adaptation to the transmission medium can largely be transferred to the data-processing layer, providing a route towards heterogeneous quantum networks spanning fibre, terrestrial free-space and satellite links.", "url": "https://arxiv.org/abs/2608.20088", "type": "理论+数值", "summary": "量子网络将光纤与自由空间链路相结合，但连续可变量子密钥分发（CV-QKD）主要是针对一种介质或另一种介质而开发的，而跨级联光纤自由空间通道的操作在很大程度上仍未得到探索。这两种介质提出了截然不同的要求：光纤传输稳定并允许较长的处理间隔，而大气传播会产生传输率波动，从而降低安全性，必须在短时间内解决。在这里，我们演示了本地生成的本地振荡器 CV-QKD，在部署的混合信道上具有高斯调制相干和压缩状态，该混合信道包括 620 米自由空间链路和 2 公里部署光纤，总损耗高达 20 dB。我们不是将光学器件适应每种介质，而是通过统一的自适应后处理框架将通道适应转移到后处理，该框架结合了基于透射率的聚类、通过协方差矩阵平均或去衰落来减轻残余衰落以及速率自适应盲协调，仅此一项就可以恢复高达 19% 的额外密钥。\n\n相同的自适应处理原理适用于两种协议，同时考虑到它们不同的安全分析和统计要求，在各自的信道条件下，相干状态协议的渐近密钥速率为每秒 0.42 Mbit，压缩状态协议的渐近密钥速率为每秒 0.93 Mbit，并在已部署的大气信道上建立压缩状态 CV-QKD。这些结果表明，对传输介质的适应很大程度上可以转移到数据处理层，从而为跨越光纤、地面自由空间和卫星链路的异构量子网络提供了一条途径。", "authors": [{"name": "Dnan A.E. Hajomer"}, {"name": "Huy Q. Nguyen"}, {"name": "Ivan Derkach"}, {"name": "Andreas B. Kidmose"}, {"name": "Edoardo Rossi"}, {"name": "Mattia Sabatini"}, {"name": "Yoann Pietri"}, {"name": "Marco Avesani"}, {"name": "Francesco Vedovato"}, {"name": "Michael Hentschel"}, {"name": "Radim Filip"}, {"name": "Giuseppe Vallone"}, {"name": "Vladyslav Usenko"}, {"name": "Tobias Gehring"}, {"name": "Soren Forchhammer"}, {"name": "Paolo Villoresi"}, {"name": "Ulrik L. Andersen"}], "featured_authors": [{"name": "Dnan A.E. Hajomer"}, {"name": "Huy Q. Nguyen"}, {"name": "Ivan Derkach"}, {"name": "Soren Forchhammer"}, {"name": "Paolo Villoresi"}, {"name": "Ulrik L. Andersen"}], "author_count": 17}, {"id": "2608.20136", "category": "quant-ph", "title": "Boltzmann counting in Hilbert space", "abstract": "We introduce a geometric entropy for quantum preparations, defined as the logarithm of the Hilbert-space volume of pure states compatible with a given set of constraints. This construction extends Boltzmann's counting perspective to the quantum setting, where compatible states need not be orthogonal and the relevant notion of \"number of states\" is naturally replaced by a volume in state space. We analyze three classes of constraints: restriction to a subspace, fixed expectation values, and coarse-grained subsystem descriptions. For representative examples, including subspace projection, spin expectation values, partial trace, and an imperfect detector map, we obtain explicit scaling laws and closed-form expressions for the associated volumes. The resulting framework provides a geometric measure of quantum ignorance at the level of the preparation and complements entropy notions based on density matrices and coarse graining.", "url": "https://arxiv.org/abs/2608.20136", "type": "理论", "summary": "我们引入了量子准备的几何熵，定义为与给定约束集兼容的纯态希尔伯特空间体积的对数。这种结构将玻尔兹曼的计数视角扩展到了量子环境，其中兼容的状态不需要是正交的，并且“状态数”的相关概念自然地被状态空间中的体积所取代。我们分析三类约束：子空间的限制、固定期望值和粗粒度子系统描述。对于代表性示例，包括子空间投影、自旋期望值、部分轨迹和不完美的探测器图，我们获得了相关体积的显式缩放定律和闭合形式表达式。由此产生的框架提供了制备水平上量子无知的几何测量，并补充了基于密度矩阵和粗粒化的熵概念。", "authors": [{"name": "Raúl O. Vallejos"}, {"name": "Isadora Veeren"}, {"name": "Frederico Brito"}, {"name": "Fernando de Melo"}], "featured_authors": [{"name": "Raúl O. Vallejos"}, {"name": "Isadora Veeren"}, {"name": "Frederico Brito"}, {"name": "Fernando de Melo"}], "author_count": 4}, {"id": "2608.20140", "category": "quant-ph", "title": "Vacuum viscosity and relativistic inertia: Motion of a massive object with charged internal degrees of freedom interacting with a classical field", "abstract": "Our present investigation into a rather rudimentary problem is motivated by two classes of problems studied since the 70's, cosmological particle creation and its more accessible analog, the dynamical Casimir effect on the one hand, and quantum friction a neutral atom moving along a dielectric surface would experience, on the other. The backreaction effects of produced particles being able to isotropize the expansion of the universe, or to slow down the moving mirror can be understood via the concept of vacuum viscosity arising from fluctuations of the quantum field. We want to track down the origin of this effect by asking the question whether a moving massive $M$ object with a charged internal degrees of freedom $\\chi$ interacting with a free unbounded classical field $\\phi$ at zero temperature would experience a viscous force, similar to the said precedents. Adopting a microphysics model for optomechanics which can treat the unequal tripartite $\\chi$-$\\phi$-$M$ interactions, we first perform a nonrelativistic calculation, which seems perfectly legitimate considering the needs of atomic physics, and found the answer to be yes, but a relativistic covariant calculation says no. We identify where the nonrelativistic framework is defective. The resolution of this latent yet real conflict is technically nontrivial but physically quite inspirational. It results in added enriched contents to Newton's first and second laws when the principles of special relativity are enforced, and rules to follow to get the correct nonrelativistic answer", "url": "https://arxiv.org/abs/2608.20140", "type": "理论+数值", "summary": "我们目前对一个相当基本的问题的研究是由自 70 年代以来研究的两类问题推动的，宇宙粒子的产生及其更容易理解的模拟，一方面是动态卡西米尔效应，另一方面是中性原子沿着介电表面移动时会经历的量子摩擦。产生的粒子的反反应效应能够使宇宙的膨胀各向同性，或者减慢移动镜子的速度，可以通过量子场波动产生的真空粘度的概念来理解。我们想通过询问这样一个问题来追踪这种效应的起源：一个具有带电内部自由度 $\\chi$ 的移动的巨大 $M$ 物体在零温度下与自由无界经典场 $\\phi$ 相互作用是否会受到粘性力，类似于上述先例。采用光力学微观物理模型，可以处理不平等的三方 $\\chi$-$\\phi$-$M$ 相互作用，我们首先进行非相对论计算，考虑到原子物理学的需要，这似乎完全合法，并发现答案是肯定的，但相对论协变计算说不是。\n\n我们找出非相对论框架的缺陷所在。这种潜在但真实的冲突的解决在技术上并不平凡，但在物理上却非常鼓舞人心。这使得狭义相对论原理的执行，为牛顿第一、第二定律增添了丰富的内容，并为得到正确的非相对论答案提供了遵循的规则。", "authors": [{"name": "Jen-Tsung Hsiang"}, {"name": "Bei-Lok Hu"}], "featured_authors": [{"name": "Jen-Tsung Hsiang"}, {"name": "Bei-Lok Hu"}], "author_count": 2}, {"id": "2608.20155", "category": "quant-ph", "title": "The ebbs and flows of quantum learning and sensing", "abstract": "What is the relation between subsystem quantum complexity and the emergence of computationally useful structure? We address this by studying a family of minimally tunable postvariational quantum circuits, and show how spectral nonflatness and metrological response directly control the ensemble-typical information processing power. This unveils an intermediate \"learning phase\" that precedes the onset of quantum chaos, characterized by pronounced nonflatness and sensitivity of readout states. The optimal information processing capacity improves with system size, while deep scrambling suppresses observable response. The results reveal how such features of random quantum dynamics can be viewed as computational resources for scalable nonlinear computation.", "url": "https://arxiv.org/abs/2608.20155", "type": "数值", "summary": "子系统量子复杂性与计算有用结构的出现之间有什么关系？我们通过研究一系列最小可调谐后变分量子电路来解决这个问题，并展示光谱不平坦性和计量响应如何直接控制系综典型的信息处理能力。这揭示了量子混沌开始之前的中间“学习阶段”，其特征是读出状态的明显不平坦性和敏感性。最佳信息处理能力随着系统规模的增加而提高，而深度加扰会抑制可观察到的响应。结果揭示了如何将随机量子动力学的这些特征视为可扩展非线性计算的计算资源。", "authors": [{"name": "Matias Karjula"}, {"name": "Teemu Ojanen"}, {"name": "Tapio Ala-Nissila"}, {"name": "Moein N. Ivaki"}], "featured_authors": [{"name": "Matias Karjula"}, {"name": "Teemu Ojanen"}, {"name": "Tapio Ala-Nissila"}, {"name": "Moein N. Ivaki"}], "author_count": 4}, {"id": "2608.20162", "category": "quant-ph", "title": "Proper Learning of Shallow All-to-All Quantum Circuits", "abstract": "This work considers a variation on the problem of learning shallow quantum circuits. Given query access to the circuit, as well as knowledge of its gate layout, we consider the task of learning the specific gates used in the circuit, producing an operationally-equivalent circuit matching this structure. Building on recent work for learning Haar random brickwork circuits, we identify a meta-algorithmic framework for learning broad classes of circuits based on iterative local gate inversions at the front and back of the circuit. We apply these techniques to study random, all-to-all, two-local circuits, and provide analytical and numerical evidence that this ensemble undergoes a sharp learnability transition at depth $d^* \\sim \\log_2 n + \\log_2\\log_2 n$ in the large size limit, based on an analysis of lightcone growth. These results have implications for recently proposed quantum cryptographic schemes based on the difficulty of circuit learning, though there are important distinctions with respect to our setting that suggest avenues for future study.", "url": "https://arxiv.org/abs/2608.20162", "type": "数值", "summary": "这项工作考虑了学习浅量子电路问题的一种变体。给定对电路的查询访问以及对其门布局的了解，我们考虑学习电路中使用的特定门的任务，生成与该结构匹配的操作等效电路。基于最近学习 Haar 随机砖砌电路的工作，我们确定了一个元算法框架，用于基于电路前面和后面的迭代局部门反转来学习广泛的电路类别。我们应用这些技术来研究随机、全对全、两个局部电路，并提供分析和数值证据，证明该系综在大尺寸限制的深度 $d^* \\sim \\log_2 n + \\log_2\\log_2 n$ 处经历了急剧的可学习性转变，基于对光锥生长的分析。这些结果对最近提出的基于电路学习难度的量子密码方案具有影响，尽管我们的设置存在重要的区别，为未来的研究提出了途径。", "authors": [{"name": "Steven Kordonowy"}, {"name": "Jacob Watkins"}], "featured_authors": [{"name": "Steven Kordonowy"}, {"name": "Jacob Watkins"}], "author_count": 2}, {"id": "2608.20164", "category": "quant-ph", "title": "Architecture and Compilation Co-Design for High-Rate Quantum Product Codes on Neutral Atom Arrays", "abstract": "Achieving fault-tolerant quantum computing at a practical scale demands quantum error correction (QEC) codes with high encoding rates. Quantum low-density parity-check (qLDPC) codes emerge as a promising candidate, especially given the rise of neutral atom arrays that provide dynamic long-range connectivity via atom movements. In general, synthesizing valid and efficient physical execution plans for QEC is a provably hard combinatorial problem, forming a critical compilation bottleneck that worsens as code sizes grow. To overcome this complexity, we focus on an important product family of qLDPC codes with dimension-reduction properties, and propose ONEX. This framework decomposes complex 2D physical execution planning into independent 1D subproblems, each solved to optimal execution depth within practical compilation time. First, we formulate the 1D execution plan with an explicit satisfiability modulo theories (SMT) encoding. This protocol produces provably depth-optimal solutions with substantial duration reduction. Second, we develop a multi-stage compilation pipeline featuring anytime optimization, movement compaction, and iterative feedback. This pipeline maintains practical wall-clock times while providing progressive refinement and on-demand retrieval of quality solutions. Third, we evaluate ONEX in the application of hypergraph product (HGP) code memory mapped onto neutral atom arrays, achieving 3.7x to 6.1x and 29.8x to 42.1x higher clock rates than the constructive 1D algorithm and the general 2D compiler, respectively, while scaling efficiently to codes with 2,500 data qubits. Finally, we extend ONEX to zoned layouts, revealing architectural insights into the associated trade-offs, and demonstrate its applicability to the broader lifted-product (LP) code family through a representative example.", "url": "https://arxiv.org/abs/2608.20164", "type": "理论+数值", "summary": "在实际规模上实现容错量子计算需要具有高编码率的量子纠错（QEC）代码。量子低密度奇偶校验（qLDPC）码成为一个有前途的候选者，特别是考虑到通过原子运动提供动态远程连接的中性原子阵列的兴起。一般来说，为 QEC 综合有效且高效的物理执行计划是一个可证明的困难组合问题，形成一个关键的编译瓶颈，随着代码大小的增长，该瓶颈会变得更糟。为了克服这种复杂性，我们专注于具有降维特性的 qLDPC 码的重要产品系列，并提出了 ONEX。该框架将复杂的 2D 物理执行规划分解为独立的 1D 子问题，每个子问题都在实际编译时间内解决到最佳执行深度。首先，我们使用显式可满足性模理论 (SMT) 编码制定一维执行计划。该协议可产生可证明的深度最优解决方案，并显着减少持续时间。其次，我们开发了一个多阶段编译管道，具有随时优化、运动压缩和迭代反馈的特点。\n\n该管道保持实用的挂钟时间，同时提供质量解决方案的渐进细化和按需检索。第三，我们在映射到中性原子阵列的超图积 (HGP) 代码存储器的应用中评估了 ONEX，其时钟速率分别比构造性 1D 算法和通用 2D 编译器高 3.7 倍到 6.1 倍和 29.8 倍到 42.1 倍，同时有效地扩展到具有 2,500 个数据量子位的代码。最后，我们将 ONEX 扩展到分区布局，揭示相关权衡的架构见解，并通过一个代表性示例展示其对更广泛的提升产品 (LP) 代码系列的适用性。", "authors": [{"name": "Adrian Liu"}, {"name": "Wan-Hsuan Lin"}, {"name": "Daniel Bochen Tan"}, {"name": "Qian Xu"}, {"name": "Jason Cong"}], "featured_authors": [{"name": "Adrian Liu"}, {"name": "Wan-Hsuan Lin"}, {"name": "Daniel Bochen Tan"}, {"name": "Qian Xu"}, {"name": "Jason Cong"}], "author_count": 5}, {"id": "2608.20178", "category": "quant-ph", "title": "Characterization of a damping channel as a mixture of amplitude damping and anti-damping channels of different parameters", "abstract": "Non-unital noise is a fundamental feature of open quantum systems, governing energy exchange and inducing state translations on the Bloch sphere. While such translations can be useful for tasks such as state preparation and channel capacity, unital dynamics where no translation occurs are often preferred in quantum information processing, particularly for error correction. Phase-covariant dynamics provide a general framework encompassing dissipation, excitation, and dephasing processes in qubit systems; however, commonly used models such as the generalized amplitude damping (GAD) channel offer only limited control over these features. In this work, we present a constructive framework for generating a broader class of phase-covariant dynamics by mixing amplitude-damping and anti-damping channels with unequal decay parameters and time-dependent mixing probabilities. This approach enables independent control over contraction and translation, allows continuous tuning between non-unital and unital regimes, and yields an effective dephasing contribution absent in GAD. To characterize these dynamics, we employ the general theorem for P-divisibility and show that it can be used constructively by evaluating it in suitably chosen Hilbert space bases, leading to simplified conditions for both unital and non-unital cases. The framework captures a wide range of behaviors, including CP-divisible, P-divisible but not CP-divisible, and non-P-divisible dynamics. We further show that appropriate mixing can reduce the deviation from the ideal noiseless evolution and that such improvement persists even after tuning the dynamics to the unital regime. Our results provide a flexible approach to engineering open system dynamics beyond standard thermal models, with potential applications in noise control and quantum information processing.", "url": "https://arxiv.org/abs/2608.20178", "type": "理论+数值", "summary": "非单位噪声是开放量子系统的基本特征，控制能量交换并诱导布洛赫球上的状态转换。虽然这种转换对于状态准备和通道容量等任务很有用，但在量子信息处理中，特别是在纠错方面，通常首选不发生转换的单位动力学。相位协变动力学提供了一个涵盖量子位系统中的耗散、激发和移相过程的通用框架；然而，常用的模型（例如广义振幅阻尼（GAD）通道）只能对这些功能提供有限的控制。在这项工作中，我们提出了一个建设性框架，通过将振幅阻尼和抗阻尼通道与不等的衰减参数和时间相关的混合概率混合来生成更广泛的相位协变动力学。这种方法能够独立控制收缩和平移，允许在非单位和单位状态之间进行连续调整，并产生 GAD 中不存在的有效相移贡献。\n\n为了表征这些动力学，我们采用 P-整除性的一般定理，并表明可以通过在适当选择的希尔伯特空间基中对其进行评估来建设性地使用它，从而简化单位和非单位情况的条件。该框架捕获了广泛的行为，包括 CP 可整除、P 可整除但不可整除的 P 以及不可整除的动态。我们进一步表明，适当的混合可以减少与理想无噪声演化的偏差，并且即使在将动力学调整到单位状态之后，这种改进仍然存在。我们的结果提供了一种超越标准热模型的灵活的开放系统动力学设计方法，在噪声控制和量子信息处理方面具有潜在的应用。", "authors": [{"name": "Vijay Pathak"}, {"name": "R. Srikanth"}], "featured_authors": [{"name": "Vijay Pathak"}, {"name": "R. Srikanth"}], "author_count": 2}, {"id": "2608.20209", "category": "quant-ph", "title": "Rigorous existence and location of quantum phase transitions in lattice Hamiltonian systems", "abstract": "We extend the analysis of the class of quantum phase transitions (QPTs) that can be interpreted as condensations in state space, first introduced in [M. Ostilli and C. Presilla, J. Phys. A 54, 055005 (2021)], by generalizing the arguments of [M. Ostilli and C. Presilla, Phys. Rev. Lett. 127, 040601 (2021)] to prove the existence and determine the location (via simple bounds) of QPTs in general one-parameter lattice Hamiltonians. Unlike our original formulation, this extension also encompasses second-order QPTs, for which we provide the explicit example of the transverse-field Ising model. Our analysis suggests that, under conditions typically satisfied in physical contexts, any QPT taking place in lattice systems can be interpreted as a condensation in state space.", "url": "https://arxiv.org/abs/2608.20209", "type": "理论", "summary": "我们扩展了对量子相变（QPT）类的分析，量子相变可以解释为状态空间中的凝聚，首先在 [M. Ostilli 和 C. Presilla，J. Phys。 A 54, 055005 (2021)]，通过概括 [M. A 54, 055005 (2021)] 的论点。 Ostilli 和 C. Presilla，物理学家。莱特牧师。 127, 040601 (2021)] 证明一般单参数格哈密顿量中 QPT 的存在并确定其位置（通过简单边界）。与我们最初的公式不同，这个扩展还包含二阶 QPT，为此我们提供了横向场 Ising 模型的明确示例。我们的分析表明，在物理环境中通常满足的条件下，晶格系统中发生的任何 QPT 都可以解释为状态空间中的凝聚。", "authors": [{"name": "Massimo Ostilli"}, {"name": "Carlo Presilla"}], "featured_authors": [{"name": "Massimo Ostilli"}, {"name": "Carlo Presilla"}], "author_count": 2}, {"id": "2608.20227", "category": "quant-ph", "title": "Hybrid Qubit-Rotor Quantum Systems: Clifford Structure, Universal Control, and Applications", "abstract": "A $U(1)$ quantum rotor pairs a periodic angle with an integer-valued conjugate momentum, and occurs in molecular rotation, superconducting phase-charge circuits, and compact gauge fields. Coupling such a rotor coherently to qubits gives a hybrid register whose control structure is not inherited from either the oscillator-qubit or the qudit case. We develop a Clifford theory, together with a universal-control result, for registers of $n$ qubits and $r$ rotors. We classify all automorphisms of the hybrid phase space $\\mathbb{F}_2^{2n}\\times\\mathbb{Z}^r\\times\\mathbb{T}^r$ that preserve the Weyl commutation relations, and give an explicit finite Clifford circuit for each one. The classification is directional: rotor momentum parity may control qubit Pauli operations within the Clifford group, while every nonzero qubit-controlled rotor momentum shift is non-Clifford. It also yields normal forms for the mixed qubit-rotor couplings and the exact minimum number of elementary mixed gates needed to synthesize them. Adding a rotor cosine potential and one fixed qubit-rotor conditional phase to the local Clifford operations gives universal control on the full Hilbert space in the strong operator topology. We then apply this structure in three settings: an exact controlled-shift realization of gauge-covariant matter hopping, which is necessarily non-Clifford; rotor phase estimation with direct angle readout and probe optimization under momentum-support and energy constraints; and finite Fourier transforms on rotor momentum codes, where the one-rotor transform for $d=2^s$ compiles into $O(s)$ momentum-selective and controlled-shift instructions and each cross-register Fourier factor is implemented by one quadratic rotor Clifford gate.", "url": "https://arxiv.org/abs/2608.20227", "type": "理论+数值", "summary": "$U(1)$ 量子转子将周期角与整数值共轭动量配对，并出现在分子旋转、超导相电荷电路和紧凑规范场中。将这样的转子与量子位相干耦合给出了混合寄存器，其控制结构不是从振荡器量子位或量子位情况继承的。我们针对 $n$ 量子位和 $r$ 转子的寄存器开发了 Clifford 理论以及通用控制结果。我们对保留 Weyl 交换关系的混合相空间 $\\mathbb{F}_2^{2n}\\times\\mathbb{Z}^r\\times\\mathbb{T}^r$ 的所有自同构进行分类，并为每个自同构给出一个显式有限 Clifford 电路。分类是有方向性的：转子动量宇称可以控制 Clifford 群内的量子位泡利操作，而每个非零量子位控制的转子动量位移都是非 Clifford 的。它还产生混合量子位-转子耦合的范式以及合成它们所需的基本混合门的确切最小数量。\n\n在局部 Clifford 运算中添加一个转子余弦势和一个固定的量子位转子条件相位，可以在强算子拓扑中对整个希尔伯特空间进行通用控制。然后，我们将这种结构应用于三种设置：规范协变物质跳跃的精确受控移位实现，这必然是非克利福德；在动量支持和能量约束下，通过直接角度读数和探头优化进行转子相位估计；以及转子动量代码上的有限傅立叶变换，其中 $d=2^s$ 的单转子变换编译为 $O(s)$ 动量选择性和受控移位指令，并且每个跨寄存器傅立叶因子由一个二次转子 Clifford 门实现。", "authors": [{"name": "Dengyao Luo"}, {"name": "Arvin Kushwaha"}, {"name": "Mastawal Tirfe"}, {"name": "Bojko N. Bakalov"}], "featured_authors": [{"name": "Dengyao Luo"}, {"name": "Arvin Kushwaha"}, {"name": "Mastawal Tirfe"}, {"name": "Bojko N. Bakalov"}], "author_count": 4}, {"id": "2608.20233", "category": "quant-ph", "title": "Nonthermal Dynamics of a One-dimensional Rydberg-atom Chain with Constraint Four-body Interactions", "abstract": "We investigate dynamics of a linear chain of Rydberg atoms driven by a constrained four-body interaction, where two neighboring atoms are excited simultaneously from the electronic ground state $|0\\rangle$ to Rydberg state $|1\\rangle$ only when their closest neighbors are in $|0\\rangle$ state. By employing an ansatz for the many-body ground state, the low-energy Hamiltonian is given by a tridiagonal form. The many-body ground state energy, which scales linearly with the chain length $L$, is obtained analytically in the thermodynamic limit and agrees with the one of the exact diagonalization. Our model supports quantum many-body scar eigenstates that are nearly equally spaced energetically. The scar states overlap strongly with the basis state $|\\mathbf{0}\\rangle=|0\\cdots 0\\rangle$. We show that the overlap distribution is tilted by the state-dependent four-body interaction. This leads to non-ergodic dynamics, evidenced by the revival of the initial state. The four-body constrained model can be realized with Rydberg atoms in a Peierls array with alternating bond lengths, where atoms on the shorter and longer bonds experience Rydberg blockade and antiblockade, respectively. Our study provides a pathway to explore constrained non-ergodic dynamics with four-body interactions by combining the Rydberg blockade and antiblockade.", "url": "https://arxiv.org/abs/2608.20233", "type": "理论+数值", "summary": "我们研究了由约束四体相互作用驱动的里德堡原子线性链的动力学，其中两个相邻原子仅当它们最接近的邻居处于 $|0\\rangle$ 状态时同时从电子基态 $|0\\rangle$ 激发到里德堡状态 $|1\\rangle$ 。通过对多体基态采用 ansatz，低能哈密顿量由三对角形式给出。多体基态能量与链长 $L$ 成线性比例，是在热力学极限下解析获得的，并且与精确对角化的能量一致。我们的模型支持能量上几乎等距的量子多体疤痕本征态。疤痕状态与基础状态 $|\\mathbf{0}\\rangle=|0\\cdots 0\\rangle$ 强烈重叠。我们表明，重叠分布因状态相关的四体相互作用而倾斜。这导致了非遍历动力学，初始状态的恢复证明了这一点。四体约束模型可以通过具有交替键长的 Peierls 阵列中的里德伯原子来实现，其中较短键和较长键上的原子分别经历里德伯封锁和反封锁。\n\n我们的研究提供了一条通过结合里德堡封锁和反封锁来探索四体相互作用的约束非遍历动力学的途径。", "authors": [{"name": "Tianyi Yan"}, {"name": "Weibin Li"}], "featured_authors": [{"name": "Tianyi Yan"}, {"name": "Weibin Li"}], "author_count": 2}, {"id": "2608.20250", "category": "quant-ph", "title": "Logarithmic depth compression of Heisenberg Hamiltonian simulation by fan-out parallelization, with built-in error detection", "abstract": "Noisy intermediate-scale quantum computers are constrained by circuit depth, while product-formula simulation of spin systems leads to narrow and deep circuits. Here we introduce a fan-out-based gadget compiler that trades circuit depth for width in simulations of Heisenberg-type nuclear magnetic resonance (NMR) Hamiltonians. Each logical spin is encoded into a small repetition-code register sized by its interaction degree, so that all pairwise interactions of a given Pauli type execute in parallel after a logarithmic-depth CNOT fan-out, and the redundant registers provide error detection for post-selection at no additional algorithmic overhead. The central result is a fixed-protocol resource comparison of the two compilations, transpiled to heavy-hex superconducting and all-to-all trapped-ion targets across a set of NMR spin systems. For interaction graphs with a high-degree hub the volume-optimal schedule halves the two-qubit depth and reduces the volume 1.7-fold for the 13-spin demonstration, which on heavy-hex also lowers the two-qubit gate count, and the depth reduction rises to 2.5-fold on all-to-all for the highest-degree molecule studied. On all-to-all the two-qubit gate count rises for every system, so the volume reduction is a benefit on depth-limited hardware. The gain grows with the degree inhomogeneity of the interaction graph and vanishes for dense uniform graphs, where the optimum is the sequential circuit. We simulate the zero-field NMR spectrum of tetramethylsilane, a 13-spin star system. Under a noise model scaled from a published present-day processor calibration, the shallower gadget circuits match or surpass the sequential compilation only after post-selection on their built-in error detection, once error rates improve by one to one and a half orders of magnitude. We verify the spectra against an independent classical computation.", "url": "https://arxiv.org/abs/2608.20250", "type": "理论+数值", "summary": "嘈杂的中规模量子计算机受到电路深度的限制，而自旋系统的乘积公式模拟则导致电路又窄又深。在这里，我们介绍一种基于扇出的小工具编译器，它在海森堡型核磁共振 (NMR) 哈密顿量的模拟中以电路深度换取宽度。每个逻辑自旋都被编码到一个小的重复代码寄存器中，该寄存器的大小取决于其交互程度，以便给定泡利类型的所有成对交互在对数深度 CNOT 扇出后并行执行，并且冗余寄存器为后选择提供错误检测，而无需额外的算法开销。核心结果是对两个编译结果进行固定协议资源比较，将其转换为跨一组 NMR 自旋系统的重六角超导和所有捕获离子目标。对于具有高度集线器的交互图，体积最优方案将两个量子位深度减半，并将 13 个自旋演示的体积减少 1.7 倍，这在重六角形上也降低了两个量子位门数，并且对于所研究的最高度分子，深度减少到全部到全部的 2.5 倍。\n\n总的来说，每个系统的两个量子位门数都会增加，因此体积的减少对于深度有限的硬件来说是一个好处。增益随着交互图的不均匀程度而增长，对于密集均匀图则消失，其中最优是时序电路。我们模拟了 13 自旋星系统四甲基硅烷的零场核磁共振谱。在根据当前已发布的处理器校准缩放的噪声模型下，只有在对其内置错误检测进行后选择之后，一旦错误率提高一到一个半数量级，较浅的小工具电路才能匹配或超过顺序编译。我们根据独立的经典计算验证了光谱。", "authors": [{"name": "Artemiy Burov"}, {"name": "Clément Javerzac"}], "featured_authors": [{"name": "Artemiy Burov"}, {"name": "Clément Javerzac"}], "author_count": 2}, {"id": "2608.20273", "category": "quant-ph", "title": "Analytical Solutions of the Generalized Klein-Gordon Oscillator in Som-Raychaudhuri Space-Time via the Extended Nikiforov-Uvarov Method", "abstract": "In this study, we present an analytical approach based on the extended Nikiforov-Uvarov method to solve the generalized Klein-Gordon oscillator in the presence of a uniform magnetic field within the Som-Raychaudhuri space-time. Exact eigenstate solutions are obtained for two distinct potential models, namely the linear potential and the Cornell potential. The corresponding energy eigenvalues are determined, and the associated eigenfunctions are analyzed and illustrated graphically.", "url": "https://arxiv.org/abs/2608.20273", "type": "理论", "summary": "在这项研究中，我们提出了一种基于扩展 Nikiforov-Uvarov 方法的分析方法，用于在 Som-Raychaudhuri 时空中存在均匀磁场的情况下求解广义 Klein-Gordon 振子。对于两个不同的势模型，即线性势和康奈尔势，获得了精确的本征态解。确定相应的能量本征值，并分析相关的本征函数并以图形方式说明。", "authors": [{"name": "Hale Karayer"}, {"name": "Tolga Celik"}, {"name": "Dogan Demirhan"}], "featured_authors": [{"name": "Hale Karayer"}, {"name": "Tolga Celik"}, {"name": "Dogan Demirhan"}], "author_count": 3}, {"id": "2608.20282", "category": "quant-ph", "title": "Quantum-mechanical wave functions in singular potentials: linear and nonlinear states", "abstract": "It is known that the attractive singular inverse-square potential gives rise to the critical quantum collapse in the framework of the three-dimensional (3D) linear Schroedinger equation. This article summarizes theoretical results which demonstrate suppression of the collapse, caused by this singular potential, and the creation of the otherwise missing ground state (GS) in a 3D gas of bosonic particles, carrying an electric dipole moment, which are pulled to the central electric charge, with repulsive contact interactions between the particles. In the mean-field approximation, the repulsive interactions are represented by the cubic term in the respective Gross-Pitaevskii (GP) equation. In addition to the GS, excited states with angular momentum are briefly considered too. Another topic considered in the article is 1D and 2D bound states in the linear Schroedinger and GP equations with the repulsive potential, which demonstrates a singularity at r --> infinity. A very recent result is that such a potential, growing faster than the negative harmonic-oscillator potential, produces a full spectrum of counter-intuitive normalizable (localized) bound states. The article puts forward perspectives for further studies of linear and nonlinear bound states existing under the action of the potentials with the singularity at r --> 0 or r --> infinity.", "url": "https://arxiv.org/abs/2608.20282", "type": "理论", "summary": "众所周知，有吸引力的奇异平方反比势会在三维 (3D) 线性薛定谔方程的框架中引起临界量子塌缩。本文总结了理论结果，证明了由奇异势引起的塌缩的抑制，以及在玻色子粒子的 3D 气体中创建原本缺失的基态 (GS)，携带电偶极矩，通过粒子之间的排斥接触相互作用被拉向中心电荷。在平均场近似中，排斥相互作用由相应 Gross-Pitaevskii (GP) 方程中的三次项表示。除了 GS 之外，还简要考虑了具有角动量的激发态。本文考虑的另一个主题是具有排斥势的线性薛定谔和 GP 方程中的一维和二维束缚态，它证明了 r --> 无穷大处的奇点。最近的结果是，这种势的增长速度快于负谐波振荡器势，产生了全谱的反直觉可归一化（局域化）束缚态。\n\n文章提出了进一步研究奇点为r-->0或r-->无穷大的势作用下存在的线性和非线性束缚态的观点。", "authors": [{"name": "Hidetsugu Sakaguchi"}, {"name": "Boris A. Malomed"}], "featured_authors": [{"name": "Hidetsugu Sakaguchi"}, {"name": "Boris A. Malomed"}], "author_count": 2}, {"id": "2608.20297", "category": "quant-ph", "title": "Parallel Quantum Advantage with Limited Adaptivity Requires Structure", "abstract": "Aaronson and Ambainis (Theory of Computing, 2014) conjectured that quantum query algorithms admit efficient almost-everywhere classical simulation: for any $T$-query quantum algorithm, its acceptance probability can be approximated on a $(1-\\delta)$ fraction of inputs, up to $\\epsilon$ additive error, using $\\mathrm{poly}(T, 1/\\epsilon, 1/\\delta)$ classical queries. At a high level, the conjecture suggests that exponential quantum speedups are possible only on sufficiently structured inputs. In this work, we make progress on this conjecture by proving it for quantum algorithms that make massively parallel quantum queries. In contrast, Yamakawa and Zhandry (Journal of the ACM, 2024) showed that quantum algorithms restricted to parallel queries can still achieve exponential speedups over classical algorithms for sampling problems. We establish our simulation theorem by proving the stronger statement that parallel-query quantum algorithms cannot distinguish the uniform distribution over oracles from oracles drawn from so-called \"dense distributions\". Our main technical contribution is a coupling theorem that relates the uniform distribution over oracles to oracles drawn from dense distributions. We further extend this approach beyond the purely parallel setting, obtaining simulation theorems both for algorithms with a bounded quantum-query prefix followed by a massively parallel quantum-query stage, and for hybrid algorithms that make an arbitrary polynomial number of adaptive classical queries before the massively parallel quantum-query stage. Finally, using the parallel-query simulation theorem as a base case, we obtain simulation theorems for quantum algorithms with constant rounds of adaptivity.", "url": "https://arxiv.org/abs/2608.20297", "type": "理论+数值", "summary": "Aaronson 和 Ambainis（计算理论，2014）推测量子查询算法几乎可以在任何地方进行高效的经典模拟：对于任何 $T$ 查询量子算法，其接受概率可以近似于 $(1-\\delta)$ 输入部分，最多 $\\epsilon$ 加性误差，使用 $\\mathrm{poly}(T, 1/\\epsilon, 1/\\delta)$ 经典查询。在较高的层面上，该猜想表明，指数量子加速只有在足够结构化的输入上才有可能。在这项工作中，我们通过证明进行大规模并行量子查询的量子算法，在这一猜想上取得了进展。相比之下，Yamakawa 和 Zhandry（Journal of the ACM，2024）表明，仅限于并行查询的量子算法仍然可以在采样问题上实现比经典算法指数级的加速。我们通过证明更强有力的陈述来建立我们的模拟定理，即并行查询量子算法无法区分预言机上的均匀分布和从所谓的“密集分布”得出的预言机。\n\n我们的主要技术贡献是一个耦合定理，它将预言机上的均匀分布与从密集分布中得出的预言机联系起来。我们进一步将这种方法扩展到纯粹的并行设置之外，获得模拟定理，既适用于具有有界量子查询前缀、后跟大规模并行量子查询阶段的算法，也适用于在大规模并行量子查询阶段之前进行任意多项式自适应经典查询的混合算法。最后，以并行查询模拟定理为基础案例，我们得到了具有恒定轮次自适应性的量子算法的模拟定理。", "authors": [{"name": "Qipeng Liu"}, {"name": "Saachi Mutreja"}], "featured_authors": [{"name": "Qipeng Liu"}, {"name": "Saachi Mutreja"}], "author_count": 2}, {"id": "2608.20340", "category": "quant-ph", "title": "Group-theoretic treatment of strong light-matter coupling with an arbitrary number of excitations", "abstract": "Strong light-matter interactions in optical microcavities give rise to hybrid light-matter states known as polaritons. While actively used in modern technologies, theoretical descriptions of such systems are often restricted to the single-excitation case, limiting their ability to capture many-excitation physics and hindering further technological advancements. Here, by exploiting the combinatorial structure of quantum emitters, we investigate the Tavis-Cummings model with arbitrary number of excitations. We derive the structure and properties of its eigensystem and identify allowed radiative transitions in systems of realistic size scales. Our work reveals new behavior inaccessible to the few-excitation regime, while also providing a framework to reduce the computational complexity of similar systems with exponentially growing Hilbert spaces.", "url": "https://arxiv.org/abs/2608.20340", "type": "理论", "summary": "光学微腔中强烈的光-物质相互作用产生了称为极化子的混合光-物质态。虽然在现代技术中被积极使用，但此类系统的理论描述通常仅限于单激发情况，限制了它们捕获多激发物理的能力并阻碍了进一步的技术进步。在这里，通过利用量子发射器的组合结构，我们研究了具有任意数量激发的 Tavis-Cummings 模型。我们推导了其本征系统的结构和性质，并确定了实际尺寸系统中允许的辐射跃迁。我们的工作揭示了少激励机制无法实现的新行为，同时还提供了一个框架来降低具有指数级增长的希尔伯特空间的类似系统的计算复杂性。", "authors": [{"name": "Antti Peltola"}, {"name": "Olli Siltanen"}, {"name": "Kimmo Luoma"}, {"name": "Konstantinos S. Daskalakis"}], "featured_authors": [{"name": "Antti Peltola"}, {"name": "Olli Siltanen"}, {"name": "Kimmo Luoma"}, {"name": "Konstantinos S. Daskalakis"}], "author_count": 4}];

    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
