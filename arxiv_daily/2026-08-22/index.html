  <style>
    :root {

      padding: 30px;

      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }

      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }

    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }

    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }

  <script>
    const papers = [{"id": "2608.19274", "category": "cond-mat", "title": "Exact expressions of correlation functions between two spins in the boundary row of the two-dimensional rectangular Ising model with periodic-free boundary conditions and finite size", "abstract": "We present exact expressions of correlation functions between two spins in the boundary row of the two-dimensional rectangular Ising model with periodic-free boundary conditions and finite size. Some properties of exact expressions obtained are discussed. The fundamental property of the Ising model that the long range order emerge as the temperature decrease is shown clearly; expressions of the correlation functions in the thermodynamic limit varies depending on the order of taking limits of two parameters L and N; the impact of different sizes on correlation functions is illustrated with the aid of diagrams. Expressions of the correlation function discussed in this paper in the thermodynamic limit has been presented by previous researchers, and we prove that expressions obtained in this article is identical in form to expressions provided by previous researchers in the thermodynamic limit.", "url": "https://arxiv.org/abs/2608.19274", "type": "理论", "summary": "我们提出了具有无周期边界条件和有限尺寸的二维矩形伊辛模型边界行中两个自旋之间相关函数的精确表达式。讨论了所获得的精确表达式的一些性质。伊辛模型的基本性质，即随着温度的降低而出现长程有序；热力学极限中相关函数的表达式根据两个参数L和N取极限的顺序而变化；借助图表说明了不同尺寸对相关函数的影响。本文讨论的相关函数在热力学极限下的表达式已经被前人给出，我们证明本文得到的表达式与前人在热力学极限下提供的表达式在形式上是相同的。", "authors": [{"name": "Mei Tao"}], "featured_authors": [{"name": "Mei Tao"}], "author_count": 1}, {"id": "2608.19284", "category": "cond-mat", "title": "Extension of the Shockley-Queisser Limit for Nanostructured Solar Cells", "abstract": "This article extends the Shockley-Queisser limit to nanostructured solar cells using the quantum phase space formalism. The parameter B_ll represents the momentum variance in each confinement direction and acts as a variance-covariance matrix linking the nanostructure geometry to thermodynamic properties. Electron-electron interactions are included via an exchange-correlation energy with an adjustable coefficient theta. The authors derive an analytical expression for the maximum efficiency as a function of size, shape, temperature, and doping. For the cylindrical geometry, the exact confinement energy uses the first zero of the Bessel function j_0,1. Numerical simulations are performed with Python 3.8.1, NumPy, and Matplotlib for PbS quantum dots in four geometries: cube, square parallelepiped, cylinder, and sphere. The integral is evaluated using an exact convergent series expansion. Results show that the maximum efficiency reaches 48.7 percent for a 5 nanometre cube, 49.0 percent for flattened parallelepiped and cylinder shapes, and 49.1 percent for a 3 nanometre sphere. These values greatly exceed the bulk PbS efficiency of 15.8 percent and surpass classical Shockley-Queisser limits. For constant-volume shapes, two efficiency peaks appear corresponding to different aspect ratios. The model correctly returns to classical values for large sizes. This approach provides a theoretical framework for optimising nanostructured solar cells and demonstrates that quantum confinement offers a promising route to surpass traditional photovoltaic limits.", "url": "https://arxiv.org/abs/2608.19284", "type": "理论+数值", "summary": "本文使用量子相空间形式主义将 Shockley-Queisser 极限扩展到纳米结构太阳能电池。参数 B_ll 表示每个限制方向上的动量方差，并充当将纳米结构几何形状与热力学属性联系起来的方差-协方差矩阵。电子-电子相互作用通过具有可调节系数 θ 的交换相关能量来包含。作者推导出了最大效率作为尺寸、形状、温度和掺杂函数的解析表达式。对于圆柱几何形状，精确的约束能使用贝塞尔函数 j_0,1 的第一个零。使用 Python 3.8.1、NumPy 和 Matplotlib 对四种几何形状的 PbS 量子点进行数值模拟：立方体、长方体、圆柱体和球体。使用精确的收敛级数展开来计算积分。结果表明，5纳米立方体的最大效率达到48.7%，扁平平行六面体和圆柱体的最大效率达到49.0%，3纳米球体的最大效率达到49.1%。\n\n这些值大大超过了 15.8% 的本体 PbS 效率，并超过了经典的 Shockley-Queisser 极限。对于恒定体积形状，出现对应于不同长宽比的两个效率峰。对于大尺寸，模型正确返回经典值。这种方法为优化纳米结构太阳能电池提供了理论框架，并证明量子限制提供了超越传统光伏极限的有前途的途径。", "authors": [{"name": "Rivo Herivola Manjakamanana Ravelonjato"}, {"name": "Jean Patrice Rakotoniaina"}, {"name": "Ravo Tokiniaina Ranaivoson"}, {"name": "Wilfrid Chrysante Solofoarisina"}], "featured_authors": [{"name": "Rivo Herivola Manjakamanana Ravelonjato"}, {"name": "Jean Patrice Rakotoniaina"}, {"name": "Ravo Tokiniaina Ranaivoson"}, {"name": "Wilfrid Chrysante Solofoarisina"}], "author_count": 4}, {"id": "2608.19312", "category": "cond-mat", "title": "Interferometric Signatures of Zero Modes in Fractional Quantum Hall-Superconductor Heterostructures", "abstract": "Fractional quantum Hall-superconductor (FQH-SC) heterostructures are predicted to host defect-bound parafermion zero modes (PZMs). We propose two related configurations to probe their fusion structure. In a Josephson junction coupled to a single quantum point contact (QPC), quasiparticle tunneling switches the defect fusion channel, producing stochastic transitions between branches of the fractional Josephson spectrum. Embedding the junction in a two-QPC Fabry-Pérot interferometer provides a complementary probe. Weak zero mode tunneling produces fusion-channel-dependent interference while strong tunneling makes the interferometer probe a superposition of fusion channels and strongly suppresses the signal: in the topological limit it vanishes exactly, revealing the defects' non-Abelian nature even when the parent FQH state is Abelian.", "url": "https://arxiv.org/abs/2608.19312", "type": "理论", "summary": "分数量子霍尔超导体 (FQH-SC) 异质结构预计将具有缺陷束缚的平费米子零模式 (PZM)。我们提出了两种相关的配置来探测它们的融合结构。在耦合到单量子点接触 (QPC) 的约瑟夫森结中，准粒子隧道效应会切换缺陷融合通道，从而在分数约瑟夫森谱的分支之间产生随机跃迁。将结嵌入双 QPC 法布里-珀罗干涉仪中可提供互补探针。弱零模式隧道效应会产生与融合通道相关的干扰，而强隧道效应使干涉仪探测融合通道的叠加并强烈抑制信号：在拓扑极限下，它完全消失，即使父 FQH 状态是阿贝尔状态，也揭示了缺陷的非阿贝尔性质。", "authors": [{"name": "Junyi Cao"}, {"name": "Ramanjit Sohal"}, {"name": "Angela Kou"}, {"name": "Eduardo Fradkin"}], "featured_authors": [{"name": "Junyi Cao"}, {"name": "Ramanjit Sohal"}, {"name": "Angela Kou"}, {"name": "Eduardo Fradkin"}], "author_count": 4}, {"id": "2608.19343", "category": "cond-mat", "title": "Self-calibrating thermal interferometry of vortex parity in a two-dimensional chiral superconductor", "abstract": "A chiral superconductor carries chiral Majorana modes along its boundary, and the integer that counts them fixes everything that follows, yet that integer has never been measured together with a local parity observable on one object. Proximitized one-dimensional wires read fermion parity rapidly but diagnose bulk topology through a separate protocol. Here we show that a reconfigurable domain wall between regions of opposite Chern number in an intrinsic two-dimensional chiral superconductor performs both functions. Opened to its contacts the wall is a ballistic channel whose quantized thermal conductance counts its Majorana modes; closed, the same wall is a Fabry--Pérot resonator whose spectrum shifts by half a level spacing when the parity of the enclosed vortices changes, giving a two-level heat conductance. We derive the exact transmission, the elastic heat full counting statistics, and a theorem showing that linear-response heat scattering of a fixed quadratic problem resolves vortex parity but not the fusion channel of well-separated cores. An outside vortex hybridized with the wall is an intrinsic false positive; temperature, geometry and a finite-bias mean--noise test separates it. Rhombohedral-graphene parameters place submicron loops in the resolved regime at millikelvin temperatures, where chiral-domain reconfiguration and noise thermometry are both established.", "url": "https://arxiv.org/abs/2608.19343", "type": "理论+数值", "summary": "手性超导体沿着其边界携带手性马约拉纳模式，计算它们的整数确定了后面的一切，但该整数从未与在一个物体上可观测到的局部宇称宇称一起测量。邻近的一维线可以快速读取费米子奇偶校验，但可以通过单独的协议诊断体拓扑。在这里，我们证明了本征二维手性超导体中相反陈数区域之间的可重构畴壁执行这两种功能。向其接触点开放的壁是一个弹道通道，其量化热导计算其马约拉纳模式；在封闭状态下，同一壁是法布里-珀罗谐振器，当封闭涡旋的奇偶性发生变化时，其频谱会移动半个能级间距，从而产生两级热导。我们推导了精确的传输、弹性热全计数统计数据，以及一个定理，该定理表明固定二次问题的线性响应热散射解决了涡旋宇称问题，但不能解决分离良好的核心的融合通道。\n\n与壁混合的外部涡流是固有的误报；温度、几何形状和有限偏差均值噪声测试将其分开。菱面体石墨烯参数将亚微米环置于毫开尔文温度下的解析区域，其中手性域重构和噪声测温均已建立。", "authors": [{"name": "Kumar Ghosh"}], "featured_authors": [{"name": "Kumar Ghosh"}], "author_count": 1}, {"id": "2608.19365", "category": "cond-mat", "title": "Layered matter that maintains spacing but loses stacking order", "abstract": "In layered materials, spacing and stacking-order extent are usually locked. Here we show that in swollen suspensions of stiff, charged nanosheets they decouple, and that this defines a distinct regime, apart from the crystalline- and Wigner-swelling regimes such systems usually occupy. The mean spacing stays sharp and salinity-tunable while scattering-weighted stacking spans only two to three layers. We demonstrate this in a near-perfect model material, so the behaviour is intrinsic, not defect-driven. X-ray and neutron scattering, sedimentation and a Donnan analysis show the spacing is held by a parameter-free osmotic restoring slope below one pascal per nanometre. Because the slope is so weak, the spacing sits at equilibrium while faults relax slowly, a quenched metastable registry whose ageing-like relaxation of low-dimensional periodic order has not, to our knowledge, been realised before. The same decoupling is expected across stiff, swollen nanosheets, from clays to oxide nanosheets and graphene oxide.", "url": "https://arxiv.org/abs/2608.19365", "type": "理论", "summary": "在分层材料中，间距和堆叠顺序范围通常是锁定的。在这里，我们表明，在坚硬的带电纳米片的膨胀悬浮液中，它们会解耦，并且除了此类系统通常占据的晶体膨胀和维格纳膨胀状态之外，这定义了一个独特的状态。平均间距保持尖锐且盐度可调，而散射加权堆叠仅跨越两到三层。我们在近乎完美的模型材料中证明了这一点，因此该行为是内在的，而不是缺陷驱动的。 X 射线和中子散射、沉降和唐南分析表明，无参数渗透恢复斜率将间距保持在每纳米 1 帕斯卡以下。由于坡度很弱，当断层缓慢松弛时，间距处于平衡状态，这是一种淬灭的亚稳态记录，据我们所知，以前从未实现过低维周期序的老化式松弛。预计在坚硬、膨胀的纳米片（从粘土到氧化物纳米片和氧化石墨烯）中也会出现同样的解耦。", "authors": [{"name": "Osvaldo Trigueiro Neto"}, {"name": "Paulo Henrique Michels-Brito"}, {"name": "Bruno Ceccato Telli"}, {"name": "Natalie Jasmin Eichstaedt"}, {"name": "Leide P. Cavalcanti"}, {"name": "Tomás S. Plivelic"}, {"name": "Josef Breu"}, {"name": "Jon Otto Fossum"}], "featured_authors": [{"name": "Osvaldo Trigueiro Neto"}, {"name": "Paulo Henrique Michels-Brito"}, {"name": "Bruno Ceccato Telli"}, {"name": "Tomás S. Plivelic"}, {"name": "Josef Breu"}, {"name": "Jon Otto Fossum"}], "author_count": 8}, {"id": "2608.19391", "category": "cond-mat", "title": "State convertibility and fluctuation theorems from a dynamical reference: majorization meets martingales", "abstract": "State convertibility represents a fundamental concept used to determine whether a transformation is possible given a specific set of resources. Within the field of Thermodynamics, where physical process are required to preserve a reference state typically in microcanonical or canonical form, this translates into the notions of majorization and thermo-majorization ---criteria that require constructing and comparing state-dependent Lorenz curves. In this work, we firstly unify and extend these notions to an arbitrary and possibly time-dependent reference distribution $g(t)$, introducing the concept of $g(t)$-majorization; we then introduce a dual picture whereby state convertibility is turned into a one-dimensional convex-order problem, which allows us to demonstrate that a transition is admissible if and only if the associated real-valued distributions of relative populations $ k_j(t)/g_j(t)$ are connected by a martingale. Building on it, we then derive an exact fluctuation theorem for a reference-relative entropy production whose average violation certifies, through a $\\chi^{2}$-divergence bound, the mismatch between an assumed and the true reference evolution---a model-independent diagnostic that requires no independent characterization of the latter and turns an observed breakdown of the fluctuation relation into a certified lower bound on the reference error.", "url": "https://arxiv.org/abs/2608.19391", "type": "理论+数值", "summary": "状态可转换性代表了一个基本概念，用于确定在给定一组特定资源的情况下是否可以进行转换。在热力学领域，需要物理过程来保存通常以微规范或规范形式的参考状态，这转化为主要化和热主要化的概念——需要构建和比较状态相关洛伦兹曲线的标准。在这项工作中，我们首先将这些概念统一并扩展到任意且可能依赖于时间的参考分布 $g(t)$，引入 $g(t)$-majorization 的概念；然后，我们引入一个对偶图，其中状态可转换性转化为一维凸阶问题，这使我们能够证明当且仅当相对总体 $ k_j(t)/g_j(t)$ 的相关实值分布通过鞅连接时，转移是可接受的。\n\n在此基础上，我们推导出参考相对熵产生的精确波动定理，其平均违规通过 $\\chi^{2}$ 散度界限证明假设的参考演化与真实的参考演化之间的不匹配——这是一种独立于模型的诊断，不需要对后者进行独立表征，并将观察到的波动关系分解转变为参考误差的经认证下界。", "authors": [{"name": "Davide Cugini"}, {"name": "Giacomo Guarnieri"}], "featured_authors": [{"name": "Davide Cugini"}, {"name": "Giacomo Guarnieri"}], "author_count": 2}, {"id": "2608.19485", "category": "cond-mat", "title": "Statistical complexity from fluctuations in the information content", "abstract": "We argue that the variance of the information content ($C$), an information-theoretic quantity, can be naturally interpreted as a measure of statistical complexity. We show that $C$ satisfies widely accepted criteria for statistical complexity measures: it vanishes for both ordered and equiprobable states, while attaining maxima in intermediate regimes, typically shifted toward order. This interpretation establishes direct connections with thermodynamics and phase transitions: for systems obeying Boltzmann--Gibbs statistics, $C$ is extensive and directly proportional to energy fluctuations and heat capacity. Moreover, unlike other statistical complexity measures, it attains a maximum at continuous phase transitions, as illustrated for the two-dimensional Ising model. Applications to chaotic maps and fractional Gaussian noise further indicate that $C$ captures nontrivial dynamical structure in different classes of correlated systems.", "url": "https://arxiv.org/abs/2608.19485", "type": "理论", "summary": "我们认为，信息内容的方差（$C$）是一种信息论量，可以自然地解释为统计复杂性的度量。我们证明 $C$ 满足广泛接受的统计复杂性度量标准：它对于有序状态和等概率状态都消失，同时在中间状态（通常转向有序状态）中达到最大值。这种解释与热​​力学和相变建立了直接联系：对于遵循玻尔兹曼-吉布斯统计的系统，$C$ 是广泛的，并且与能量波动和热容量成正比。此外，与其他统计复杂性度量不同，它在连续相变时达到最大值，如二维伊辛模型所示。混沌映射和分数高斯噪声的应用进一步表明 $C$ 捕获了不同类别的相关系统中的非平凡动态结构。", "authors": [{"name": "Renio S. Mendes"}, {"name": "Sergio Picoli"}, {"name": "Evaldo M. F. Curado"}], "featured_authors": [{"name": "Renio S. Mendes"}, {"name": "Sergio Picoli"}, {"name": "Evaldo M. F. Curado"}], "author_count": 3}, {"id": "2608.19573", "category": "cond-mat", "title": "Free Energy of Non-uniform Disordered Superconductors", "abstract": "We extend the Luttinger-Ward free energy functional to disordered superconductors and superfluids with arbitrary scattering mechanisms, including both impurity disorder and the presence of interfaces. The disorder is taken into account within the self-consistent $t$-matrix approximation, thus allowing for arbitrary impurity scattering strengths. It is shown that both the interface and the impurity scattering self-energy appear in the functional only implicitly, through self-consistently determined fermionic propagators. The free energy functional is formulated in terms of a generalized integral in the complex energy plane, which encompasses formulations both in terms of retarded/advanced propagators and in terms of Matsubara Green's functions by appropriately choosing the integration path. It can be applied, e.g., to spatially non-uniform and hybrid systems, triplet and other unconventional condensates, and strongly-correlated Fermi liquids. A particularly useful formulation in terms of the quasiclassical propagators is applied to unconventional non-uniform singlet and triplet superconductors and superfluids in an external Zeeman magnetic field.", "url": "https://arxiv.org/abs/2608.19573", "type": "理论", "summary": "我们将 Luttinger-Ward 自由能泛函扩展到具有任意散射机制的无序超导体和超流体，包括杂质无序和界面的存在。在自洽 $t$ 矩阵近似中考虑了无序性，从而允许任意的杂质散射强度。结果表明，通过自洽确定的费米子传播子，界面和杂质散射自能仅隐式地出现在泛函中。自由能泛函是根据复杂能量平面中的广义积分来表述的，它包含了延迟/先进传播器方面的表述以及通过适当选择积分路径而根据松原格林函数的表述。它可以应用于空间不均匀和混合系统、三重态和其他非常规凝聚态以及强相关费米液体等。准经典传播子方面的特别有用的公式应用于外部塞曼磁场中的非常规非均匀单重态和三重态超导体和超流体。", "authors": [{"name": "Matthias Eschrig"}, {"name": "Anton B. Vorontsov"}], "featured_authors": [{"name": "Matthias Eschrig"}, {"name": "Anton B. Vorontsov"}], "author_count": 2}, {"id": "2608.19592", "category": "cond-mat", "title": "Dynamic Pseudogap Model", "abstract": "We formulate a microscopic theory of pseudogap formation generated by dynamic finite nesting vector ${\\bf Q}$ fluctuations with characteristic oscillation frequency $\\omega_0$, and damping $\\gamma$. Starting from a Hamiltonian describing electrons coupled to a classical Gaussian random field, we derive explicit double-series representations of the single-particle Green's function within an Abelian (commuting) approximation to the exact SU(2) time evolution. The resulting propagator naturally acquires a generalized Bogoliubov structure in which every stochastic scattering history is characterized by an effective dynamic gap, leading to a coherent superposition of dynamically broadened sidebands with complex Poisson weights. A central result of the theory is the emergence of a dynamically generated decoherence scale $\\Gamma_{\\rm eff}$ governing the crossover between two qualitatively different pseudogap regimes. For $\\omega_0>\\Gamma_{\\rm eff}$ the fluctuating field is resolved coherently and the double-series representation provides a controlled description of dynamic sideband formation. Conversely, when $\\Gamma_{\\rm eff}\\gtrsim\\omega_0$, coherence is progressively lost and the theory crosses over to the quasistatic fluctuating-gap regime described by the exact continued-fraction solution. The coherent and quasistatic descriptions are therefore interpreted as two complementary asymptotic limits of the same microscopic dynamic pseudogap model. The detailed results of numerical calculations for electron spectral density and density of states are presented for different sets of model parameters confirming this crossover over the broad range of model parameters.", "url": "https://arxiv.org/abs/2608.19592", "type": "理论+数值", "summary": "我们制定了赝能隙形成的微观理论，该理论是由具有特征振荡频率 $\\omega_0$ 和阻尼 $\\gamma$ 的动态有限嵌套向量 ${\\bf Q}$ 波动生成的。从描述与经典高斯随机场耦合的电子的哈密顿量开始，我们在精确的 SU(2) 时间演化的阿贝尔（通勤）近似内推导出单粒子格林函数的显式双级数表示。由此产生的传播器自然地获得了广义的 Bogoliubov 结构，其中每个随机散射历史都以有效动态间隙为特征，从而导致动态加宽边带与复杂泊松权重的相干叠加。该理论的一个核心结果是出现了动态生成的退相干尺度 $\\Gamma_{\\rm eff}$ 来控制两个性质不同的赝能隙区域之间的交叉。对于$\\omega_0>\\Gamma_{\\rm eff}$，波动场被相干地解析，并且双级数表示提供了动态边带形成的受控描述。\n\n相反，当 $\\Gamma_{\\rm eff}\\gtrsim\\omega_0$ 时，相干性逐渐丧失，并且理论跨越到由精确连分数解描述的准静态波动间隙状态。因此，相干和准静态描述被解释为同一微观动态赝能隙模型的两个互补渐近极限。针对不同组的模型参数给出了电子谱密度和态密度数值计算的详细结果，证实了在广泛的模型参数范围内的这种交叉。", "authors": [{"name": "E.Z. Kuchinskii"}, {"name": "M.V. Sadovskii"}], "featured_authors": [{"name": "E.Z. Kuchinskii"}, {"name": "M.V. Sadovskii"}], "author_count": 2}, {"id": "2608.19604", "category": "cond-mat", "title": "Universality of long-wavelength behavior of composite-fermion Fermi liquid", "abstract": "A recent article evaluated the long-wavelength behavior of the projected static structure factor of the composite-fermion (CF) liquid within the zeroth-order microscopic theory and found $\\bar{S}(\\mathbf{q})\\sim q^3$, in disagreement with the $\\bar{S}(\\mathbf{q})\\sim q^3\\ln q$ behavior predicted by the Chern-Simons field theory for the Coulomb interaction. Here we consider the possibility that the discrepancy arises because the zeroth-order CF Fermi-liquid wave function used in that work does not properly capture the long wavelength behavior. We use CF diagonalization to significantly improve the wave function but do not find any evidence for $\\bar{S}(\\mathbf{q})\\sim q^3 \\ln q$ behavior. Additionally, we find that the small-$q$ behavior of $\\bar{S}(\\mathbf{q})$ is also insensitive to the form of the interaction between electrons, suggesting universality.", "url": "https://arxiv.org/abs/2608.19604", "type": "理论+数值", "summary": "最近的一篇文章评估了零阶微观理论中复合费米子 (CF) 液体的投影静态结构因子的长波长行为，发现 $\\bar{S}(\\mathbf{q})\\sim q^3$ 与陈-西蒙斯库仑相互作用场论预测的 $\\bar{S}(\\mathbf{q})\\sim q^3\\ln q$ 行为不一致。在这里，我们考虑出现这种差异的可能性是因为该工作中使用的零阶 CF 费米液体波函数不能正确捕获长波长行为。我们使用 CF 对角化来显着改善波函数，但没有找到 $\\bar{S}(\\mathbf{q})\\sim q^3 \\ln q$ 行为的任何证据。此外，我们发现 $\\bar{S}(\\mathbf{q})$ 的小 $q$ 行为对电子之间相互作用的形式也不敏感，这表明了普遍性。", "authors": [{"name": "Aamir A. Makki"}, {"name": "Mytraya Gattu"}, {"name": "J. K. Jain"}], "featured_authors": [{"name": "Aamir A. Makki"}, {"name": "Mytraya Gattu"}, {"name": "J. K. Jain"}], "author_count": 3}, {"id": "2608.19605", "category": "cond-mat", "title": "Exact partition function of arithmetic Ising model", "abstract": "We present a compact formula for the exact partition function of the $d$-dimensional arithmetic Ising model (AIM). For a $2\\times2$ system, we express it analytically using the $q$-Hurwitz-Lerch zeta function and derive explicit forms for the free energy and entropy. Additionally, we find that the entropy increases at high temperatures, supporting the presence of entropic order.", "url": "https://arxiv.org/abs/2608.19605", "type": "理论", "summary": "我们提出了 $d$ 维算术 Ising 模型 (AIM) 的精确配分函数的紧凑公式。对于 $2\\times2$ 系统，我们使用 $q$-Hurwitz-Lerch zeta 函数进行分析表达，并导出自由能和熵的显式形式。此外，我们发现熵在高温下增加，支持熵序的存在。", "authors": [{"name": "Anu Dhochak"}, {"name": "Ken Kikuchi"}, {"name": "Shrinit Singh"}], "featured_authors": [{"name": "Anu Dhochak"}, {"name": "Ken Kikuchi"}, {"name": "Shrinit Singh"}], "author_count": 3}, {"id": "2608.19698", "category": "cond-mat", "title": "Interplay of exchange and spin-conserving scattering processes in a ferromagnetic two-sublattice system", "abstract": "In magnetic alloys or hybrid systems formed by molecular magnets coupled to a magnetic substrate, the exchange interaction leads to fast spin dynamics after excitation. We investigate the electronic charge and spin dynamics due to the exchange interaction in a two-sublattice system with antiferromagnetic coupling. We employ a simplified model for a ferrimagnetic alloy as a coupled system of itinerant and localized electron states together with an exchange coupling between the two. For the itinerant system we include electron-electron Coulomb scattering and electron-phonon scattering. We study numerically the heat-induced ultrafast magnetization dynamics due to the interplay of exchange scattering and spin-independent scattering processes and discuss different scenarios for the demagnetization and relaxation dynamics of the sublattices. Our results highlight the impact of spin-conserving electron-electron scattering processes on the exchange-driven spin dynamics on ultrashort timescales.", "url": "https://arxiv.org/abs/2608.19698", "type": "理论+数值", "summary": "在磁性合金或由分子磁体耦合到磁性基底形成的混合系统中，交换相互作用导致激发后快速自旋动力学。我们研究了具有反铁磁耦合的两个亚晶格系统中由于交换相互作用而产生的电子电荷和自旋动力学。我们采用亚铁磁合金的简化模型作为巡回电子态和局域电子态的耦合系统以及两者之间的交换耦合。对于巡回系统，我们包括电子-电子库仑散射和电子-声子散射。我们对由于交换散射和自旋无关散射过程的相互作用而引起的热致超快磁化动力学进行了数值研究，并讨论了亚晶格的退磁和弛豫动力学的不同情况。我们的结果强调了自旋守恒电子-电子散射过程对超短时间尺度上交换驱动的自旋动力学的影响。", "authors": [{"name": "Ariyan Tavakoli"}, {"name": "Kai Leckron"}, {"name": "Hans Christian Schneider"}], "featured_authors": [{"name": "Ariyan Tavakoli"}, {"name": "Kai Leckron"}, {"name": "Hans Christian Schneider"}], "author_count": 3}, {"id": "2608.19712", "category": "cond-mat", "title": "Internal cyclotron probe of the vertical polarizability of a surface-state electron on helium", "abstract": "We study a surface-state electron on liquid helium in a tilted magnetic field. The tilt couples the cyclotron ladder to the vertical Rydberg-like subbands of the same electron and thereby realizes a self-coupled Landau-subband Hamiltonian. In the far-detuned regime, the cyclotron line acquires a state-dependent shift described by standard second-order perturbation theory. The resulting expression identifies the cyclotron resonance as a direct probe of the dynamical polarizability of the vertical ladder. The theory is intrinsically multilevel. Exact diagonalization confirms a broad microwave window in which sizable state-dependent cyclotron shifts are expected while the system remains dispersive.", "url": "https://arxiv.org/abs/2608.19712", "type": "理论+数值", "summary": "我们研究倾斜磁场中液氦上的表面态电子。倾斜将回旋梯子耦合到同一电子的垂直类里德堡子带，从而实现自耦合朗道子带哈密顿量。在远失谐状态下，回旋加速器线获得由标准二阶微扰理论描述的状态相关位移。由此产生的表达式将回旋加速器共振识别为垂直梯动态极化率的直接探针。该理论本质上是多层次的。精确的对角化证实了一个宽的微波窗口，在该窗口中，预计会出现相当大的状态相关回旋加速器位移，同时系统仍保持色散。", "authors": [{"name": "Kirill Shulga"}], "featured_authors": [{"name": "Kirill Shulga"}], "author_count": 1}, {"id": "2608.19810", "category": "cond-mat", "title": "A Central Disulfide Junction Drives Transient Network Formation in Elastin-Like Polypeptides, Enabling Low-Concentration Hydrogels", "abstract": "The self-assembly of associative triblock copolymers composed of a central hydrophilic elastin-like polypeptide (ELP) block and short fatty acid end groups (C16) was investigated in aqueous solution. In one system, the ELP contains 80 pentapeptide units (C16-80-C16), whereas in the other two C16-ELP40 chains were oxidatively coupled through their terminal cysteine residues to form a central disulfide bond, yielding C16-(40)2-C16. Despite their nearly identical molecular weights and compositions, the two polymers exhibit markedly different self-assembly behaviors. C16-80-C16 forms large hydrophobic aggregates that remain kinetically trapped and do not develop a dynamically connected network. In contrast, C16-(40)2-C16 forms very small associative nodes with an aggregation number of only $\\sim$3 chains. These nodes coexist with larger clusters and become dynamically interconnected at higher concentrations, leading to transparent hydrogels at concentrations as low as 2.5 wt %. Oscillatory rheology reveals a transient Maxwell network governed by a single relaxation process associated with the reversible association of the C16 end groups. SAXS, light scattering, cryo-TEM, and molecular modeling consistently support a model in which the central disulfide junction promotes transient network formation.", "url": "https://arxiv.org/abs/2608.19810", "type": "理论", "summary": "研究了由中心亲水性弹性蛋白样多肽（ELP）嵌段和短脂肪酸端基（C16）组成的缔合三嵌段共聚物在水溶液中的自组装。在一个系统中，ELP 包含 80 个五肽单元 (C16-80-C16)，而在其他两条 C16-ELP40 链中，通过其末端半胱氨酸残基氧化偶联，形成中心二硫键，产生 C16-(40)2-C16。尽管它们的分子量和组成几乎相同，但这两种聚合物表现出明显不同的自组装行为。 C16-80-C16 形成大的疏水聚集体，其保持动力学捕获并且不形成动态连接的网络。相比之下，C16-(40)2-C16 形成非常小的关联节点，聚合数量仅为 $\\sim$3 链。这些节点与较大的簇共存，并在较高浓度下动态互连，从而在浓度低至 2.5 wt% 时形成透明水凝胶。振荡流变学揭示了瞬态麦克斯韦网络，该网络由与 C16 端基可逆缔合相关的单一弛豫过程控制。\n\nSAXS、光散射、冷冻 TEM 和分子建模一致支持中心二硫键连接促进瞬态网络形成的模型。", "authors": [{"name": "Tingting Zhang"}, {"name": "Jean-François Le Meins"}, {"name": "Jean-Paul Chapel"}, {"name": "Saron Catak"}, {"name": "Guillaume Goudounet"}, {"name": "Olivier Sandre"}, {"name": "Nadia Mahmoudi"}, {"name": "Christophe Schatz"}, {"name": "Bertrand Garbay"}], "featured_authors": [{"name": "Tingting Zhang"}, {"name": "Jean-François Le Meins"}, {"name": "Jean-Paul Chapel"}, {"name": "Nadia Mahmoudi"}, {"name": "Christophe Schatz"}, {"name": "Bertrand Garbay"}], "author_count": 9}, {"id": "2608.19884", "category": "cond-mat", "title": "A solvent-flux theory for nonequilibrium swelling dynamics of thermoresponsive microgels", "abstract": "Thermoresponsive microgels undergo large reversible size changes as temperature alters solvent quality. Predicting their nonequilibrium swelling and deswelling kinetics is challenging because polymer volume fraction, mechanical response, and solvent transport evolve during large volume changes. Here we develop a solvent-flux theory for the dynamics of a spherical microgel. The radius-change rate is driven by the osmotic-pressure imbalance across the particle boundary and resisted by water transport through the polymer network, yielding a nonlinear equation for the global swelling coordinate and a state- and temperature-dependent swelling diffusion coefficient, $D_{\\mathrm{SW}}(\\phi,T)$. In the linear-response regime, the theory recovers Tanaka--Fillmore exponential relaxation and the scaling $\\tau_\\mathrm{SW}\\sim R_{\\mathrm{eq}}^2\\gamma/K_{\\mathrm{eq}}$, while providing a microscopic interpretation of the polymer--solvent friction coefficient $\\gamma$. Beyond this limit, the model retains quadratic size scaling while accounting for state-dependent transport and mechanics. For pNIPAM microgels, it predicts asymmetric pathways, with deswelling faster than swelling over the same temperature interval. Finite thermalization produces a crossover from a microgel-controlled to a thermalization-controlled regime, in which the apparent relaxation time grows linearly with the external thermalization time and hysteresis-like loops emerge in the radius--temperature plane. A stochastic extension based on the Smoluchowski equation predicts transient broadening of the radius distribution during collapse, with maximal fluctuations in the volume-transition region. The theory links solvent transport, nonlinear swelling dynamics, thermalization effects, and nonequilibrium size fluctuations in responsive microgels.", "url": "https://arxiv.org/abs/2608.19884", "type": "理论", "summary": "当温度改变溶剂质量时，热响应微凝胶会经历大的可逆尺寸变化。预测它们的非平衡溶胀和消溶胀动力学具有挑战性，因为聚合物体积分数、机械响应和溶剂传输在大体积变化期间发生变化。在这里，我们开发了球形微凝胶动力学的溶剂通量理论。半径变化率由颗粒边界上的渗透压不平衡驱动，并受到聚合物网络中水传输的抵抗，从而产生全局膨胀坐标的非线性方程以及与状态和温度相关的膨胀扩散系数 $D_{\\mathrm{SW}}(\\phi,T)$。在线性响应状态下，该理论恢复了 Tanaka--Fillmore 指数弛豫和缩放 $\\tau_\\mathrm{SW}\\sim R_{\\mathrm{eq}}^2\\gamma/K_{\\mathrm{eq}}$，同时提供了聚合物-溶剂摩擦系数 $\\gamma$ 的微观解释。超出此限制，该模型保留二次尺寸缩放，同时考虑状态相关的传输和力学。\n\n对于 pNIPAM 微凝胶，它预测不对称途径，在相同的温度间隔内消溶胀快于溶胀。有限热化产生从微凝胶控制到热化控制状态的交叉，其中表观弛豫时间随着外部热化时间线性增长，并且在半径-温度平面中出现类似磁滞的回线。基于 Smoluchowski 方程的随机扩展预测了塌陷过程中半径分布的瞬态展宽，并且体积转变区域出现最大波动。该理论将响应微凝胶中的溶剂传输、非线性膨胀动力学、热化效应和非平衡尺寸波动联系起来。", "authors": [{"name": "Arturo Moncho-Jordá"}, {"name": "Alessandro Patti"}, {"name": "Fabián A. García-Daza"}, {"name": "Alejandro Cuetos"}], "featured_authors": [{"name": "Arturo Moncho-Jordá"}, {"name": "Alessandro Patti"}, {"name": "Fabián A. García-Daza"}, {"name": "Alejandro Cuetos"}], "author_count": 4}, {"id": "2608.19969", "category": "cond-mat", "title": "Unmasking the internal structure of casein micelles through enzymatic hydrolysis: A SAXS study", "abstract": "Casein micelles, one of the most studied natural association colloids, are supramolecular assemblies of caseins and colloidal calcium phosphate that constitute the fundamental building blocks of dairy matrices. Despite extensive investigation, the internal structure of casein micelles remains debated. While $\\kappa$-casein is known to ensure colloidal stability of casein micelle suspension, the spatial organization of casein fractions and salts is still unresolved, and several structural models coexist. Small-angle scattering is a method of choice to probe biological colloids \\emph{in situ}, yet interpretation of scattering data remains challenging due to the hierarchical nature of casein micelles. Here we address this issue by probing micelle structure during enzymatic gelation induced by chymosin, which cleaves $\\kappa$-casein and triggers aggregation. Using time-resolved SAXS, we probe structural changes throughout the sol-gel transition over length scales from 3 nm to 3 $\\mu$m. First, we show that enzyme-driven aggregation, counterintuitively, reveals information about the internal organization of casein micelles: the reduction of specific surface area during gelation unmasks a high-q structural peak previously observed under contrast-matching conditions. Second, we report that $\\kappa$-casein cleavage leads to a gradual disappearance of the structural feature at intermediate scales. Analysis of the disappearance kinetics and comparison to structural models reveal that $\\kappa$-casein cleavage induces a progressive relaxation of the colloidal porous substructure, providing direct evidence for its contribution to micellar organization. More broadly, these results demonstrate that the gelation process provides unique access to the internal structure of biological colloids and offers new perspectives for interpreting scattering data in complex soft-matter systems.", "url": "https://arxiv.org/abs/2608.19969", "type": "理论+数值", "summary": "酪蛋白胶束是研究最多的天然缔合胶体之一，是酪蛋白和胶体磷酸钙的超分子组装体，构成乳制品基质的基本构件。尽管进行了广泛的研究，酪蛋白胶束的内部结构仍然存在争议。虽然已知$\\kappa$-酪蛋白可确保酪蛋白胶束悬浮液的胶体稳定性，但酪蛋白组分和盐的空间组织仍未解决，并且多种结构模型并存。小角度散射是探测生物胶体\\emph{原位}的一种选择方法，但由于酪蛋白胶束的分层性质，散射数据的解释仍然具有挑战性。在这里，我们通过探测凝乳酶诱导的酶促胶凝过程中的胶束结构来解决这个问题，凝乳酶会裂解 $\\kappa$-酪蛋白并触发聚集。使用时间分辨 SAXS，我们在 3 nm 到 3 $\\mu$m 的长度尺度上探测整个溶胶-凝胶转变过程中的结构变化。\n\n首先，我们发现酶驱动的聚集与直觉相反，揭示了酪蛋白胶束内部组织的信息：凝胶化过程中比表面积的减少揭示了先前在对比度匹配条件下观察到的高q结构峰。其次，我们报告$\\kappa$-酪蛋白裂解导致中间尺度的结构特征逐渐消失。对消失动力学的分析以及与结构模型的比较表明，$\\kappa$-酪蛋白裂解诱导胶体多孔亚结构逐渐松弛，为其对胶束组织的贡献提供了直接证据。更广泛地说，这些结果表明，凝胶化过程提供了了解生物胶体内部结构的独特途径，并为解释复杂软物质系统中的散射数据提供了新的视角。", "authors": [{"name": "Julien Bauland"}, {"name": "Ghazi Ben Messaoud"}, {"name": "François Boué"}, {"name": "Pascaline Hamon"}, {"name": "Florence Rousseau"}, {"name": "Thomas Gibaud"}, {"name": "Thomas Croguennec"}], "featured_authors": [{"name": "Julien Bauland"}, {"name": "Ghazi Ben Messaoud"}, {"name": "François Boué"}, {"name": "Florence Rousseau"}, {"name": "Thomas Gibaud"}, {"name": "Thomas Croguennec"}], "author_count": 7}, {"id": "2608.20003", "category": "cond-mat", "title": "Role of topology in scaling laws for studying mechanics in open-porous solids: Moving beyond classical Gibson-Ashby scaling", "abstract": "The elastic modulus of porous materials is commonly described using power-law scaling relations with relative density, where the scaling exponent is often interpreted in terms of the underlying deformation mechanism. However, in highly disordered porous networks, changes in density are generally accompanied by changes in network topology, which can substantially modify the apparent scaling behavior. In this paper, we propose a topology-informed framework that separates the intrinsic mechanical contribution from the effects of network structure. Three representative topological descriptors are considered: the mean coordination number, the fraction of the load-bearing backbone, and the tortuosity of the load paths. For each case, the corresponding density-dependent contribution to the apparent modulus-scaling exponent is derived and analyzed. The results show that variations in connectivity, mechanical participation of the solid phase, and load-path efficiency can all lead to apparent scaling exponents exceeding the intrinsic exponent associated with the local deformation mechanism. These effects are particularly pronounced at low relative densities, where network topology evolves most strongly. The framework provides a physically interpretable basis for understanding anomalous modulus-density scaling in disordered porous materials and highlights the need to consider topology explicitly alongside relative density.", "url": "https://arxiv.org/abs/2608.20003", "type": "理论", "summary": "多孔材料的弹性模量通常使用相对密度的幂律比例关系来描述，其中比例指数通常根据潜在的变形机制来解释。然而，在高度无序的多孔网络中，密度的变化通常伴随着网络拓扑的变化，这可以显着改变表观尺度行为。在本文中，我们提出了一种基于拓扑的框架，它将内在的机械贡献与网络结构的影响分开。考虑三个代表性的拓扑描述符：平均配位数、承载骨干的分数和负载路径的曲折度。对于每种情况，都会导出并分析对表观模量缩放指数的相应密度相关贡献。结果表明，连通性、固相机械参与和载荷路径效率的变化都可能导致表观缩放指数超过与局部变形机制相关的固有指数。\n\n这些影响在相对密度较低时尤其明显，此时网络拓扑的演化最为强烈。该框架为理解无序多孔材料中的反常模量-密度缩放提供了物理上可解释的基础，并强调需要明确考虑拓扑结构和相对密度。", "authors": [{"name": "Ameya Rege"}], "featured_authors": [{"name": "Ameya Rege"}], "author_count": 1}, {"id": "2608.20013", "category": "cond-mat", "title": "Exact Fluctuation-Response Relations for Underdamped Langevin Dynamics", "abstract": "Thermodynamic uncertainty relations connect current fluctuations to dissipation and are often rooted in fluctuation-response principles. In underdamped dynamics, however, conventional mean-current uncertainty relations can fail, while the underlying connection between fluctuations, response, and dissipation remains elusive. Here we uncover this structure by deriving an exact finite-time fluctuation-response equality for underdamped Langevin dynamics, valid for arbitrary time-dependent driving and general additive observables. The equality yields sharp response bounds and a variational characterization of the dynamically generated variance. Choosing the perturbation along the irreversible probability flow gives a friction-response thermodynamic uncertainty relation that can be saturated at any finite observation time, leading to an exact variational principle for the total entropy production. We further show that the conventional uncertainty factor of velocity-resolved currents can decay exponentially with dissipation even in driven free diffusion, while the friction-response factor retains its universal lower bound. These results establish response, rather than the mean current itself, as the quantity directly linking fluctuations and dissipation in underdamped dynamics.", "url": "https://arxiv.org/abs/2608.20013", "type": "理论+数值", "summary": "热力学不确定性关系将电流波动与耗散联系起来，并且通常植根于波动响应原理。然而，在欠阻尼动力学中，传统的平均电流不确定性关系可能会失效，而波动、响应和耗散之间的潜在联系仍然难以捉摸。在这里，我们通过导出欠阻尼朗之万动力学的精确有限时间涨落响应方程来揭示这种结构，该方程对于任意依赖时间的驱动和一般可加性可观测量有效。该等式产生尖锐的响应界限和动态生成的方差的变分特征。选择沿着不可逆概率流的扰动给出了摩擦响应热力学不确定性关系，该关系可以在任何有限的观测时间内饱和，从而得出总熵产生的精确变分原理。我们进一步表明，即使在驱动自由扩散中，速度分辨电流的传统不确定性因子也会随着耗散呈指数衰减，而摩擦响应因子保留其通用下界。\n\n这些结果建立了响应，而不是平均电流本身，作为直接联系欠阻尼动力学中的波动和耗散的量。", "authors": [{"name": "Tan Van Vu"}, {"name": "Van Tuan Vo"}, {"name": "Ruicheng Bao"}, {"name": "Keiji Saito"}], "featured_authors": [{"name": "Tan Van Vu"}, {"name": "Van Tuan Vo"}, {"name": "Ruicheng Bao"}, {"name": "Keiji Saito"}], "author_count": 4}, {"id": "2608.20039", "category": "cond-mat", "title": "Anomalous behavior of native point defects in C2-ordered antiferromagnet $α$-MnO$_2$", "abstract": "$\\alpha$-MnO$_2$ is an emerging material for electronic, optoelectronic, and energy applications, owing to its structural flexibility and defect-driven functionality. During synthesis of $\\alpha$-MnO$_2$, native oxygen vacancies readily form and are typically compensated by foreign dopants. A thorough understanding of intrinsic defects is therefore essential for enabling controlled extrinsic doping and optimizing material performance. Using density functional approach, we investigate the structural, electronic, magnetic, and optical properties of the ground state C2-type antiferromagnetic $\\alpha$-MnO$_2$ in the presence of native point defects, including interstitials, vacancies, and antisites. We compute their thermodynamic stability, incorporating electrostatic corrections to eliminate spurious long-range interactions. Mn interstitial (Mn$_\\text{i}$) and Mn antisite O (Mn$_\\text{O}$) introduce shallow donor levels, whereas O-vacancy (V$_\\text{O}$) exhibit amphoteric behavior and act as compensating centers. The calculated defect formation energies reveal pronounced competition between donor- and acceptor-type native defects, leading to strong intrinsic defect compensation under both Mn-rich and O-rich growth conditions. Mn vacancy (V$_\\text{Mn}$) remains ionized across the band gap and behaves as a shallow acceptor, suggesting its potential role under suitable non-equilibrium growth conditions, whereas O antisite Mn (O$_\\text{Mn}$) forms deep acceptor levels. BSE@G$_0$$W_0$ calculations reveal a strongly anisotropic optical response in stoichiometric $\\alpha$-MnO$_2$, while native point defects introduce pronounced sub-gap excitations and enhanced dielectric screening, with vacancies producing the largest effect.", "url": "https://arxiv.org/abs/2608.20039", "type": "数值", "summary": "$\\alpha$-MnO$_2$ 因其结构灵活性和缺陷驱动功能而成为一种用于电子、光电和能源应用的新兴材料。在 $\\alpha$-MnO$_2$ 的合成过程中，自然氧空位很容易形成，并且通常由外来掺杂剂补偿。因此，彻底了解内在缺陷对于实现受控外在掺杂和优化材料性能至关重要。使用密度泛函方法，我们研究了存在原生点缺陷（包括填隙、空位和反位点）的基态 C2 型反铁磁 $\\alpha$-MnO$_2$ 的结构、电子、磁性和光学性质。我们计算它们的热力学稳定性，并结合静电校正来消除虚假的长程相互作用。 Mn 间隙 (Mn$_\\text{i}$) 和 Mn 反位 O (Mn$_\\text{O}$) 引入浅供体能级，而 O 空位 (V$_\\text{O}$) 表现出两性行为并充当补偿中心。\n\n计算出的缺陷形成能揭示了供体型和受体型天然缺陷之间的明显竞争，从而在富锰和富氧生长条件下产生强大的固有缺陷补偿。 Mn 空位 (V$_\\text{Mn}$) 在带隙上保持电离状态并充当浅受体，表明其在合适的非平衡生长条件下的潜在作用，而 O 反位 Mn (O$_\\text{Mn}$) 形成深受体能级。 BSE@G$_0$$W_0$ 计算揭示了化学计量 $\\alpha$-MnO$_2$ 中的强各向异性光学响应，而原生点缺陷引入了明显的子间隙激发和增强的介电屏蔽，其中空位产生最大的影响。", "authors": [{"name": "Archana Sharma"}, {"name": "Brahmananda Chakraborty"}], "featured_authors": [{"name": "Archana Sharma"}, {"name": "Brahmananda Chakraborty"}], "author_count": 2}, {"id": "2608.20049", "category": "cond-mat", "title": "Effect of molecular constraints on vibrational and quasilocalized excitations in glasses", "abstract": "Recent years have seen substantial progress in elucidating the statistical physics of the vibrational properties of structural glasses. Although many real-world glasses relevant for science and technology are molecular, the majority of computational studies concerning the mechanical and vibrational properties of structural glasses employ simple atomistic glass-forming models. Thus, the effects of stiff molecular constraints on mechanical and vibrational glass physics remain largely unexplored. In this work, we directly compare the properties of a molecular computer glass with those of an atomistic model featuring the same inter-molecular interaction potential, and created using the same formation protocol. We find that the molecular glass features a higher degree of mechanical disorder, with larger mesoscopic correlation lengths, while at the same time it hosts a lower number of soft, quasilocalized vibrations per atom -- compared to the atomistic glass. We rationalize these differences by accounting for the reduction in the effective number of degrees of freedom induced by the stiff molecular constraints. We additionally find that nonlinear plastic modes --- that carry plastic deformation in driven glassy solids --- couple much more strongly to volumetric strains in the molecular glass. Future research directions are discussed.", "url": "https://arxiv.org/abs/2608.20049", "type": "理论", "summary": "近年来，在阐明结构玻璃振动特性的统计物理学方面取得了实质性进展。尽管现实世界中许多与科学技术相关的玻璃都是分子玻璃，但大多数有关结构玻璃机械和振动特性的计算研究都采用简单的原子玻璃形成模型。因此，刚性分子约束对机械和振动玻璃物理的影响在很大程度上仍未得到探索。在这项工作中，我们直接将分子计算机玻璃的特性与具有相同分子间相互作用势的原子模型的特性进行比较，并使用相同的形成协议创建。我们发现，与原子玻璃相比，分子玻璃具有更高程度的机械无序性，具有更大的介观相关长度，同时每个原子的软准局域振动数量更少。我们通过考虑刚性分子约束引起的有效自由度数的减少来合理化这些差异。\n\n我们还发现非线性塑性模式（在驱动玻璃态固体中进行塑性变形）与分子玻璃中的体积应变耦合得更强烈。讨论了未来的研究方向。", "authors": [{"name": "Keane Ramdin"}, {"name": "Edan Lerner"}], "featured_authors": [{"name": "Keane Ramdin"}, {"name": "Edan Lerner"}], "author_count": 2}, {"id": "2608.20156", "category": "cond-mat", "title": "Biorthogonal Conformal Dynamics in Non-Hermitian Quantum Quenches", "abstract": "Global quenches at one-dimensional critical points admit a boundary conformal field theory (BCFT) description in which Euclidean strip correlators are analytically continued to real time. We formulate this construction for interacting non-Hermitian critical systems, where a right ket alone does not specify the dynamical readout and the left covector is part of the microscopic quench protocol. Independent left and right preparations flowing to the same conformal boundary define the two temporal boundaries of a strip with generally complex one-sided extrapolation parameters; linear and antilinear symmetry pairings are exploited to constrain this geometry. In the interacting Yang-Lee spin chain, statically calibrated boundary data determine the biorthogonal dynamics of the complete-character return amplitude, a primary one-point function, and a spatial correlator. The imaginary part of the linear-paired extrapolation parameter predicts the temporal center of an independently evolved antilinear-paired one-point function at the $10^{-3}$ relative level; the same preparation phase controls local phase evolution and the analytic-continuation path of boundary blocks. Further results test this formalism with a direct field-on quench, mixed left and right preparations, and a complex five-state Potts fixed point with complex primary dimensions. These results establish a BCFT framework for biorthogonal global quenches in interacting non-Hermitian critical systems, in which complex temporal-boundary data organize universal post-quench dynamics.", "url": "https://arxiv.org/abs/2608.20156", "type": "理论", "summary": "一维临界点处的全局淬灭采用边界共形场理论 (BCFT) 描述，其中欧几里得带相关器在分析上持续实时。我们为相互作用的非厄米临界系统制定了这种结构，其中单独的右酮不指定动态读数，而左协向量是微观淬灭协议的一部分。流向同一共形边界的独立左、右准备体定义了具有通常复杂的单侧外推参数的条带的两个时间边界；利用线性和反线性对称配对来约束这种几何形状。在相互作用的杨-李自旋链中，静态校准的边界数据确定了完整字符返回幅度、初级单点函数和空间相关器的双正交动力学。线性配对外推参数的虚部在 $10^{-3}$ 相对水平上预测独立演化的反线性配对单点函数的时间中心；相同的准备阶段控制局部相演化和边界块的解析连续路径。\n\n进一步的结果通过直接场淬灭、左右混合准备以及具有复杂初级尺寸的复杂五态 Potts 不动点来测试这种形式。这些结果为相互作用的非厄米临界系统中的双正交全局淬火建立了 BCFT 框架，其中复杂的时间边界数据组织了通用的淬火后动力学。", "authors": [{"name": "Yifan Liu"}], "featured_authors": [{"name": "Yifan Liu"}], "author_count": 1}, {"id": "2608.20168", "category": "cond-mat", "title": "Quantum Dissipative Paraelectricity", "abstract": "Whether a quantum system with a double-well effective potential undergoes spontaneous symmetry breaking depends not only on the potential landscape but also on the kinetics and the coupling with additional degrees of freedom. Here we introduce a quasi-exactly solvable model to study this problem in the context of ferroelectrics, with results that apply to a broad class of quantum phase transitions. Exploiting the analytical solutions, we provide a strict definition of the quantum paraelectric regime and identify a distinct quantum ferroelectric regime in which symmetry breaking can be realized without tunneling features. We then show that explicit symmetry breaking cannot be inferred from the order-parameter Hamiltonian alone, but requires additional couplings. This leads us to identify a regime of \\emph{quantum dissipative paraelectricity}, in which observable symmetry breaking is suppressed during the evolution toward the ground state, even when the double-well structure dominates over zero-point quantum fluctuations.", "url": "https://arxiv.org/abs/2608.20168", "type": "理论", "summary": "具有双阱有效势的量子系统是否会发生自发对称破缺不仅取决于势场，还取决于动力学和附加自由度的耦合。在这里，我们引入了一个准精确可解的模型来研究铁电体背景下的这个问题，其结果适用于广泛的量子相变。利用解析解，我们提供了量子顺电态的严格定义，并确定了一种独特的量子铁电态，其中可以在没有隧道特征的情况下实现对称性破缺。然后我们表明，显式对称破缺不能单独从序参数哈密顿量推断出来，而是需要额​​外的耦合。这使我们识别出一种\\emph{量子耗散顺电性}的机制，其中可观察到的对称性破缺在向基态演化过程中受到抑制，即使双阱结构在零点量子涨落中占主导地位。", "authors": [{"name": "A. Cano"}], "featured_authors": [{"name": "A. Cano"}], "author_count": 1}, {"id": "2608.20221", "category": "cond-mat", "title": "Universal meson spectra near $(1+1)$-dimensional Ising criticality", "abstract": "Near $(1+1)$-dimensional [$(1+1)$D] Ising criticality, a magnetic perturbation induces confinement and produces a cascade of bound-state excitations known as mesons. Here we show these mesons share a universal mass scaling after independently rescaling the model-dependent microscopic couplings. The number of stable mesons is controlled by the lightest two-meson threshold, while the lightest-meson mass follows a continuous trajectory characterized by a single scaling parameter. Using Hamiltonian truncation method, we obtain the trajectory numerically in both Ising field theory and the near-critical mixed-field Ising chain (MFIC). Under the rescaling, the trajectory and stable-meson-count crossover windows of MFIC both collapse onto the field-theory results. To further demonstrate the above universal organization of the meson spectra, we consider a class of four-periodic spin-$1/2$ Heisenberg-Ising chains under transverse fields, whose parameter space contains a family of quantum Ising critical points. The Hamiltonian family includes effective spin models for the quasi-one-dimensional antiferromagnets Ba(Sr)Co$_2$V$_2$O$_8$. Using tensor-network calculations, we obtain the corresponding lightest-meson mass trajectory for BaCo$_2$V$_2$O$_8$ and find that it also collapse onto the same universal curve given by field-theory result. Our results suggest that the universal scaling structure of quantum Ising criticality extends into the nearby confining regime, governing the organization of the meson spectrum. They thereby provide a practical criterion for interpreting excitations of quasi-1D Ising-like magnets in mixed fields beyond $E_8$ integrability.", "url": "https://arxiv.org/abs/2608.20221", "type": "理论+数值", "summary": "在 $(1+1)$ 维 [$(1+1)$D] 伊辛临界点附近，磁扰动会引起约束并产生一系列称为介子的束缚态激发。在这里，我们展示了这些介子在独立重新缩放依赖于模型的微观耦合后共享通用质量缩放。稳定介子的数量由最轻的二介子阈值控制，而最轻的介子质量遵循以单个尺度参数为特征的连续轨迹。利用哈密顿截断法，我们在伊辛场理论和近临界混合场伊辛链（MFIC）中数值化地获得了轨迹。在重新缩放下，MFIC 的轨迹和稳定介子计数交叉窗口都崩溃到场论结果上。为了进一步证明介子光谱的上述普遍组织，我们考虑横向场下的一类四周期自旋-$1/2$海森堡-伊辛链，其参数空间包含一系列量子伊辛临界点。哈密​​顿族包括准一维反铁磁体 Ba(Sr)Co$_2$V$_2$O$_8$ 的有效自旋模型。\n\n使用张量网络计算，我们获得了 BaCo$_2$V$_2$O$_8$ 相应的最轻介子质量轨迹，并发现它也折叠到场论结果给出的相同通用曲线上。我们的结果表明，量子伊辛临界度的通用标度结构延伸到附近的限制区域，控制介子谱的组织。因此，它们提供了解释准一维类伊辛磁体在超过 $E_8$ 可积性的混合场中的激励的实用标准。", "authors": [{"name": "Xiao Wang"}, {"name": "Jianda Wu"}], "featured_authors": [{"name": "Xiao Wang"}, {"name": "Jianda Wu"}], "author_count": 2}, {"id": "2608.20226", "category": "cond-mat", "title": "Splitting probabilities for Brownian motion with diffusing boundaries: Application to polymer translocation", "abstract": "We study the translocation of a polymer chain through a nanopore where the chain length fluctuates stochastically due to the polymerization-depolymerization processes at the chain ends. We map this process to an equivalent representation where the pore performs a stochastic random-walk-like process on a line in the presence of two diffusing sinks on either side of it with diffusion constants $D_1$ and $D_3$ respectively. The translocation process terminates when the pore hits either of the two outer diffusing sinks. In the case where the pore motion itself is diffusive with diffusion constant $D_2$, we compute exactly the splitting probability that the pore hits the left (right) sink before hitting the right (left) sink. We show that the splitting probability in the presence of mobile sinks is rather nontrivial compared to the classical case of immobile sinks (the latter corresponds to the case when the chain length is fixed). Furthermore, we also compute exactly the probability distribution of the translocation time and that of the chain length at the completion time of the translocation. We show that both distributions have power law tails with exponents that depend continuously on the diffusion constants $D_1$, $D_2$ and $D_3$. We validate our analytical predictions via numerical simulations. We then present numerical results for the case when the pore performs a fractional Brownian motion with Hurst exponent $0<H<1$, while the sinks are still diffusive.", "url": "https://arxiv.org/abs/2608.20226", "type": "理论+数值", "summary": "我们研究了聚合物链通过纳米孔的易位，其中链长由于链端的聚合-解聚过程而随机波动。我们将此过程映射到等效表示，其中孔隙在一条线上执行随机随机游走过程，且在其两侧存在两个扩散汇，扩散常数分别为 $D_1$ 和 $D_3$。当孔隙撞击两个外部扩散槽中的任何一个时，易位过程终止。在孔隙运动本身具有扩散常数 $D_2$ 的情况下，我们精确计算孔隙在撞击右（左）水槽之前撞击左（右）水槽的分裂概率。我们表明，与固定接收器的经典情况相比，存在移动接收器的分裂概率相当重要（后者对应于链长度固定的情况）。此外，我们还精确计算了易位时间的概率分布和易位完成时链长的概率分布。\n\n我们证明，两种分布都具有幂律尾部，其指数连续依赖于扩散常数 $D_1$、$D_2$ 和 $D_3$。我们通过数值模拟验证我们的分析预测。然后，我们给出了当孔隙执行赫斯特指数 $0<H<1$ 的分数布朗运动，而汇仍然是扩散的情况下的数值结果。", "authors": [{"name": "Alexander K. Hartmann"}, {"name": "Satya N. Majumdar"}, {"name": "Alberto Rosso"}], "featured_authors": [{"name": "Alexander K. Hartmann"}, {"name": "Satya N. Majumdar"}, {"name": "Alberto Rosso"}], "author_count": 3}, {"id": "2608.20269", "category": "cond-mat", "title": "Nonlinear Drude weight of the one-dimensional Hubbard model", "abstract": "We investigate nonlinear Drude weights (NLDWs) in the one-dimensional repulsive Hubbard model by combining exact Bethe-ansatz calculations with low-energy effective field theory. At quarter filling, we first derive the strong-coupling expansion of the NLDWs and confirm it numerically over a wide range of interaction strength. We then compare the numerical results with the prediction of the Tomonaga-Luttinger liquid (TLL) description including irrelevant perturbations. While band-curvature corrections yield finite contributions to higher-order NLDWs, the Umklapp interaction predicts divergent NLDWs when the order $n$ of the Drude weight exceeds a threshold determined by the TLL parameter. In contrast, finite-size scaling of the exact Bethe-ansatz results indicates that all calculated NLDWs remain finite in the thermodynamic limit, revealing a discrepancy between the exact results and the predictions of the low-energy effective field theory. At half filling, we analyze the finite-size scaling of the NLDWs across the Mott metal-insulator transition. We derive their asymptotic behavior in the insulating phase and propose a hyperscaling ansatz for NLDWs near the critical point, which is verified numerically. Our results clarify the interaction dependence and critical scaling of nonlinear transport coefficients in the one-dimensional Hubbard model and highlight limitations of the conventional low-energy effective description for higher-order transport.", "url": "https://arxiv.org/abs/2608.20269", "type": "理论+数值", "summary": "我们通过将精确的 Bethe-ansatz 计算与低能有效场理论相结合，研究一维排斥 Hubbard 模型中的非线性 Drude 权重 (NLDW)。在季度填充时，我们首先推导出 NLDW 的强耦合展开式，并在广泛的相互作用强度范围内以数值方式对其进行确认。然后，我们将数值结果与 Tomonaga-Luttinger 液体 (TLL) 描述（包括不相关扰动）的预测进行比较。虽然能带曲率校正对高阶 NLDW 产生有限的贡献，但当 Drude 权重的阶 $n$ 超过由 TLL 参数确定的阈值时，Umklapp 交互会预测发散的 NLDW。相比之下，精确的 Bethe-ansatz 结果的有限尺寸缩放表明，所有计算的 NLDW 在热力学极限下仍然是有限的，揭示了精确结果与低能有效场理论的预测之间的差异。在半填充时，我们分析了 Mott 金属-绝缘体转变过程中 NLDW 的有限尺寸缩放。\n\n我们推导了它们在绝缘阶段的渐近行为，并提出了 NLDW 在临界点附近的超尺度模拟，并得到了数值验证。我们的结果阐明了一维哈伯德模型中非线性输运系数的相互作用依赖性和临界标度，并强调了传统低能有效描述高阶输运的局限性。", "authors": [{"name": "Tetsuya Iwasaki"}, {"name": "Hosho Katsura"}], "featured_authors": [{"name": "Tetsuya Iwasaki"}, {"name": "Hosho Katsura"}], "author_count": 2}, {"id": "2608.20325", "category": "cond-mat", "title": "Strange Metal Hall Effect in Underdoped BaFe$_2$(As$_{1-x}$P$_x$)$_2$", "abstract": "The unusual transport properties of strange metals point to the breakdown of the quasiparticle picture, the understanding of which remains one of the most vexing problems in physics. Here, we report investigations of the electrical Hall effect of the strange metal superconductor BaFe$_2$(As$_{1-x}$P$_x$)$_2$. We show that a doping-independent contribution to the Hall effect exists within a fan shaped region above a putative quantum critical point. This `strange metal Hall' contribution echoes many of the properties of the antiferromangetic Hall response, but attains universal properties that distinguish it from the effects of Fermi surface reconstruction. This is consistent with an underlying origin connected to the presence of critical fluctuations, tying it to observations of $T$-linear resistivity and the appearance of unconventional superconductivity.", "url": "https://arxiv.org/abs/2608.20325", "type": "理论", "summary": "奇怪金属的不寻常输运特性表明了准粒子图像的崩溃，而对准粒子图像的理解仍然是物理学中最棘手的问题之一。在这里，我们报告了对奇怪金属超导体 BaFe$_2$(As$_{1-x}$P$_x$)$_2$ 的霍尔效应的研究。我们表明，在假定的量子临界点之上的扇形区域内存在对霍尔效应的与掺杂无关的贡献。这种“奇怪的金属霍尔”贡献与反铁磁霍尔响应的许多特性相呼应，但获得了将其与费米表面重建效应区分开来的通用特性。这与与临界波动的存在相关的潜在起源一致，将其与 $T$ 线性电阻率的观察和非常规超导性的出现联系起来。", "authors": [{"name": "Augusto Ghiotto"}, {"name": "Darian Hall"}, {"name": "Yuanqi Lyu"}, {"name": "Kohtaro Yamakawa"}, {"name": "Sophie Rodehutskors"}, {"name": "Corina Dunn"}, {"name": "Philip J. W. Moll"}, {"name": "John Singleton"}, {"name": "Nikola Maksimovic"}, {"name": "James G. Analytis"}], "featured_authors": [{"name": "Augusto Ghiotto"}, {"name": "Darian Hall"}, {"name": "Yuanqi Lyu"}, {"name": "John Singleton"}, {"name": "Nikola Maksimovic"}, {"name": "James G. Analytis"}], "author_count": 10}, {"id": "2608.20330", "category": "cond-mat", "title": "Torus Berry Data Determine All-Genus Abelian Topological Orders", "abstract": "We show that for Abelian Chern-Simons topological orders, torus Berry matrices determine the all-genus extended TQFT. We identify the topological part of the projective Berry holonomy under metric deformations with the mapping-class-group representation of the Abelian Chern-Simons TQFT and prove that the normalized torus data reconstruct its finite quadratic module $(G,q)$. Recent work showed that $(G,q)$ classifies the extended theory up to symmetric monoidal natural isomorphism, then genus-one data determine the all-genus theory without choosing a $K$-matrix presentation. We also prove that, for normalized character row errors $\\delta<21.96$%, nearest-row decoding recovers the Abelian fusion algebra independently of the number of anyons. The result applies to Abelian fractional quantum Hall and spin-liquid phases described by even-lattice Chern-Simons theories.", "url": "https://arxiv.org/abs/2608.20330", "type": "理论", "summary": "我们证明，对于阿贝尔 Chern-Simons 拓扑序，环面 Berry 矩阵决定了全属扩展 TQFT。我们用阿贝尔 Chern-Simons TQFT 的映射类群表示来识别度量变形下射影 Berry 完整的拓扑部分，并证明归一化环面数据重建其有限二次模 $(G,q)$。最近的工作表明，$(G,q)$ 将扩展理论分类为对称幺半群自然同构，然后属一数据确定全属理论，而无需选择 $K$ 矩阵表示。我们还证明，对于归一化字符行错误 $\\delta<21.96$%，最近行解码可以独立于任意子的数量恢复阿贝尔融合代数。该结果适用于偶点阵陈-西蒙斯理论描述的阿贝尔分数量子霍尔和自旋液相。", "authors": [{"name": "Daniel Galviz"}], "featured_authors": [{"name": "Daniel Galviz"}], "author_count": 1}, {"id": "2608.19293", "category": "hep-th", "title": "Constrained Scenarios of Non-Commutative Schwarzschild Black Holes with Global Monopoles from Van der Waals Behaviors", "abstract": "Combining thermodynamics and optics, we investigate the Van der Waals behaviors of non-commutative Schwarzschild black holes with global monopoles. First, we examine the constrained thermodynamic recovering such properties. Using these thermodynamic results, we approach the shadows by merging Event Horizon Telescope findings and the Van der Waals limits. In this context, we provide a machine learning study to determine the compatibility with the empirical data of M87^*, SgrA^*_{\\mathrm{VLTI}}, and SgrA^*_{\\mathrm{Keck}} black holes. As a result, we find that such a proposed model matches with the M87^* observational data.", "url": "https://arxiv.org/abs/2608.19293", "type": "理论", "summary": "结合热力学和光学，我们研究了具有全局单极子的非交换史瓦西黑洞的范德华行为。首先，我们检查恢复这些特性的约束热力学。利用这些热力学结果，我们通过合并视界望远镜的发现和范德华极限来接近阴影。在此背景下，我们提供了一项机器学习研究，以确定与 M87^*、SgrA^*_{\\mathrm{VLTI}} 和 SgrA^*_{\\mathrm{Keck}} 黑洞经验数据的兼容性。结果，我们发现所提出的模型与 M87^* 观测数据相匹配。", "authors": [{"name": "Ismail Benyaich"}, {"name": "Maryem Jemri"}], "featured_authors": [{"name": "Ismail Benyaich"}, {"name": "Maryem Jemri"}], "author_count": 2}, {"id": "2608.19305", "category": "hep-th", "title": "Holographic Local Operator Quenches with Conserved Momentum and Spin", "abstract": "We investigate the holographic dictionary relating point particles carrying longitudinal momentum or angular momentum in asymptotically AdS$_3$ spacetimes to suitably regulated, time-evolved states created by local primary operators in the dual two-dimensional conformal field theory (2D CFT). We find that asymmetric left/right Euclidean smearing of local operators produces states carrying momentum, and the corresponding bulk excitation is a particle with conserved momentum. We compute the energy density and entanglement entropy in these states and in their dual back-reacted geometries, finding exact agreement between the CFT and gravity descriptions. We further extend this correspondence to particles with intrinsic spin, whose CFT duals are primary operators with unequal holomorphic and anti-holomorphic scaling dimensions. We again find a precise match between CFT and holographic calculations of energy densities and entanglement entropies. Finally, we explore applications of these setups beyond holography by deriving the evolution of Rényi entropies in 2D rational CFTs and introducing a new class of local quantum quench protocols with conserved longitudinal or angular momentum.", "url": "https://arxiv.org/abs/2608.19305", "type": "理论", "summary": "我们研究了将渐进 AdS$_3$ 时空中携带纵向动量或角动量的点粒子与由对偶二维共形场论 (2D CFT) 中的局部主算子创建的适当调节的时间演化状态相关联的全息字典。我们发现局域算子的不对称左/右欧几里得涂抹会产生携带动量的状态，而相应的体激发是动量守恒的粒子。我们计算了这些状态及其双反反应几何结构中的能量密度和纠缠熵，发现 CFT 和重力描述之间完全一致。我们进一步将这种对应关系扩展到具有内在自旋的粒子，其 CFT 对偶是具有不相等的全纯和反全纯缩放维度的主要算子。我们再次发现 CFT 与能量密度和纠缠熵的全息计算之间的精确匹配。最后，我们通过推导二维有理 CFT 中 Rényi 熵的演化并引入一类具有守恒纵向或角动量的新型局部量子淬灭协议，探索这些设置在全息之外的应用。", "authors": [{"name": "Pawel Caputa"}, {"name": "Pedro Castellini Grand"}, {"name": "Justin R. David"}, {"name": "Rahul Metya"}], "featured_authors": [{"name": "Pawel Caputa"}, {"name": "Pedro Castellini Grand"}, {"name": "Justin R. David"}, {"name": "Rahul Metya"}], "author_count": 4}, {"id": "2608.19309", "category": "hep-th", "title": "3D Einstein action from 6D Kodaira-Spencer gravity", "abstract": "In view of embedding 3D gravity into topological string theory, we show that the dimensional reduction of 6D Kodaira-Spencer gravity on $\\text{AdS}_3\\times S^3$, i.e. the low-energy description of twisted holography, contains a subsector that coincides with the action of chiral 3D gravity on $\\text{AdS}_3$. Furthermore, we show that the full 3D Einstein action is obtained as the reduction of two independent complex-conjugate copies of 6D Kodaira-Spencer gravity. We perform the dimensional reduction explicitly at the level of the classical actions, extending our previous work that related the equations of motion of the two theories. Our reduction procedure is based on a novel rewriting of the non-local 6D Kodaira-Spencer action as a local 6D holomorphic Chern-Simons action for the gauge group $\\mathrm{SL}(2,\\mathbb{C})$, valid within a subsector of complex structure deformations that we identify. Our results provide a necessary step toward embedding the Euclidean path integral of 3D gravity into topological string theory.", "url": "https://arxiv.org/abs/2608.19309", "type": "理论", "summary": "鉴于将3D引力嵌入到拓扑弦理论中，我们证明$\\text{AdS}_3\\times S^3$上的6D Kodaira-Spencer引力的降维，即扭曲全息术的低能描述，包含一个与$\\text{AdS}_3$上的手性3D引力作用一致的子扇区。此外，我们表明完整的 3D 爱因斯坦作用是通过减少 6D Kodaira-Spencer 引力的两个独立的复共轭副本而获得的。我们在经典行为的层面上明确地进行降维，扩展了我们之前与两种理论的运动方程相关的工作。我们的归约过程基于将非局部 6D Kodaira-Spencer 作用新颖地重写为规范组 $\\mathrm{SL}(2,\\mathbb{C})$ 的局部 6D 全纯 Chern-Simons 作用，在我们识别的复杂结构变形的子区域内有效。我们的结果为将 3D 引力的欧几里得路径积分嵌入拓扑弦理论提供了必要的一步。", "authors": [{"name": "Johanna Erdmenger"}, {"name": "Jonathan Karl"}, {"name": "Jani Kastikainen"}, {"name": "Henri Scheppach"}], "featured_authors": [{"name": "Johanna Erdmenger"}, {"name": "Jonathan Karl"}, {"name": "Jani Kastikainen"}, {"name": "Henri Scheppach"}], "author_count": 4}, {"id": "2608.19322", "category": "hep-th", "title": "The EEC-Hedron: Positivity Bounds on Energy Correlators", "abstract": "We study the constraints placed by energy positivity on general unitary quantum field theories. We show that the coefficients in the partial wave expansion of energy-energy correlators all must lie within a bounded region of parameter space, which we call the ``EEC-hedron''. For the particular case of conformal field theories, these positivity constraints on energy correlators lead to bounds on the allowed values of coefficients in the operator product expansion. We demonstrate this approach in the 3d Ising and $O(2)$ CFTs, deriving new bounds on OPE coefficients in both theories.", "url": "https://arxiv.org/abs/2608.19322", "type": "理论", "summary": "我们研究能量正性对一般酉量子场论的限制。我们表明，能量-能量相关器的部分波展开中的系数都必须位于参数空间的有界区域内，我们将其称为“EEC 面体”。对于共形场论的特殊情况，能量相关器的这些正性约束导致算子乘积展开中系数的允许值受到限制。我们在 3d Ising 和 $O(2)$ CFT 中演示了这种方法，得出两种理论中 OPE 系数的新界限。", "authors": [{"name": "Bianka Meçaj"}, {"name": "Ian Moult"}, {"name": "Hidde Stoffels"}, {"name": "Matthew T. Walters"}, {"name": "Yuan Xin"}], "featured_authors": [{"name": "Bianka Meçaj"}, {"name": "Ian Moult"}, {"name": "Hidde Stoffels"}, {"name": "Matthew T. Walters"}, {"name": "Yuan Xin"}], "author_count": 5}, {"id": "2608.19324", "category": "hep-th", "title": "Black Holes, the Bethe Ansatz, and Elliptic Calogero--Moser Systems", "abstract": "We define a map from solutions of the Bethe Ansatz equations (BAEs) of four-dimensional $\\mathcal{N}=4$ super-Yang--Mills with arbitrary semisimple gauge algebra $\\mathfrak{g}$ to extrema and poles of the potential of the untwisted elliptic Calogero--Moser system of type $\\mathfrak{g}$. We conjecture the map to be a bijection on the preimage of the Calogero--Moser extrema, and show that it intertwines the symmetries of the two systems, both the gauge ones (torus, Weyl and center invariance) and a $\\mathrm{PSL}(2,\\mathbb{Z})$ action, so that solutions on both sides organize into orbits, each BAE orbit mapping onto a single orbit of Calogero--Moser extrema or poles. That the system produced is the untwisted one has a consequence: the conjectured correspondence between BAE solutions and vacua of the $\\mathcal{N}=1^\\ast$ deformation of $\\mathcal{N}=4$ on $\\mathbb{R}^{3,1}$, which are extrema of the twisted system, cannot extend to non-simply-laced $\\mathfrak{g}$. It also fails within the simply-laced cases, though not for $\\mathfrak{su}(N)$: we exhibit an $\\mathfrak{so}(8)$ solution that flows to a pole of the Calogero--Moser potential rather than to an extremum, and so has no $\\mathcal{N}=1^\\ast$ counterpart. We illustrate the map in detail for every rank-two $\\mathfrak{g}$, classical and exceptional alike, and use these cases as evidence for the conjecture.", "url": "https://arxiv.org/abs/2608.19324", "type": "理论", "summary": "我们定义了一个映射，从四维 $\\mathcal{N}=4$ super-Yang--Mills 的 Bethe Ansatz 方程（BAE）的解到任意半简单规范代数 $\\mathfrak{g}$ 到 $\\mathfrak{g}$ 类型的无扭曲椭圆 Calogero-Moser 系统势的极值和极点。我们推测该映射是卡洛杰罗-莫泽极值原像上的双射，并表明它交织了两个系统的对称性，即规范系统（环面、外尔和中心不变性）和 $\\mathrm{PSL}(2,\\mathbb{Z})$ 作用，以便两侧的解组织成轨道，每个 BAE 轨道映射到单个轨道Calogero——莫泽极值或极点。产生的系统是未扭曲的系统，其结果是：BAE 解与 $\\mathcal{N}=1^\\ast$ 的 $\\mathcal{N}=4$ 在 $\\mathbb{R}^{3,1}$ 上的 $\\mathcal{N}=1^\\ast$ 变形（扭曲系统的极值）之间的猜想对应关系不能扩展到非简单连接的 $\\mathfrak{g}$。\n\n它在简单的情况下也会失败，但不适用于 $\\mathfrak{su}(N)$：我们展示了一个 $\\mathfrak{so}(8)$ 解，它流向 Calogero--Moser 势的极点而不是极值，因此没有 $\\mathcal{N}=1^\\ast$ 对应项。我们详细说明了每个二级 $\\mathfrak{g}$ 的映射，无论是经典的还是例外的，并使用这些案例作为猜想的证据。", "authors": [{"name": "Marco Fazzi"}, {"name": "Kuba Krawczyk"}], "featured_authors": [{"name": "Marco Fazzi"}, {"name": "Kuba Krawczyk"}], "author_count": 2}, {"id": "2608.19327", "category": "hep-th", "title": "Inflationary Bispectra and IR Physics from Quantum Simulators", "abstract": "Bose-Einstein condensates have been used successfully as quantum simulators for early-universe particle production. Here we extend this analogy to the interacting theory. To this end, we compute the leading interaction terms expected in a general experimental setup that determine the 3-point correlations. We apply them to cosmologically motivated expanding model universes, but also periodically oscillating ones. While expanding scale factors do not necessarily lead to easily observable signatures due to experimental constraints on the realizable scale factor, periodically driven ones produce resonant correlators that grow linearly over time and lend themselves well to experimental detection. One direct application of this analysis is the experimental study of late-time infrared divergencies often discussed in the context of massless scalars in de Sitter space.", "url": "https://arxiv.org/abs/2608.19327", "type": "理论", "summary": "玻色-爱因斯坦凝聚态已成功用作早期宇宙粒子产生的量子模拟器。在这里，我们将这个类比扩展到相互作用理论。为此，我们计算了确定三点相关性的一般实验设置中预期的主要交互作用项。我们将它们应用于宇宙学驱动的膨胀模型宇宙，但也应用于周期性振荡的模型宇宙。虽然由于可实现的比例因子的实验限制，扩展比例因子不一定会导致易于观察的特征，但周期性驱动的特征会产生随时间线性增长的谐振相关器，并且非常适合实验检测。该分析的一个直接应用是对德西特空间中无质量标量背景下经常讨论的晚期红外发散的实验研究。", "authors": [{"name": "Matthias Thomas Nowinski"}, {"name": "Ivo Sachs"}], "featured_authors": [{"name": "Matthias Thomas Nowinski"}, {"name": "Ivo Sachs"}], "author_count": 2}, {"id": "2608.19331", "category": "hep-th", "title": "Deep neural networks as lattice gauge theories", "abstract": "We modify the NN/QFT duality [1] to incorporate the layerwise permutation symmetry of the network, resulting in a $(0\\!+\\!1)$-dimensional lattice gauge theory, in which each layer of $N$ neurons acts as an $N$-component lattice site, and the weight matrices play the role of gauge fields living on the links. In this framework, we compute the tree-level neuron-neuron propagator which describes the evolution of layer variance in the network, and develop the Feynman diagram machinery to compute interactions in the perturbative expansion in $1/N$. In particular, we obtain a recursive expression for all corrections to the exact propagator at $O(1)$, representing statistical fluctuations in the ensemble of networks, including infinitely-many loop diagrams mediating the interactions from previous layers. We also present a preliminary analysis of neuron scattering amplitudes that contribute order-by-order in $1/N$, which provides a field-theoretic framework for studying higher-point correlations, and by extension information propagation, in deep networks. We remark on some interesting directions for future work at the intersection of neural networks and quantum field theory.", "url": "https://arxiv.org/abs/2608.19331", "type": "理论", "summary": "我们修改了 NN/QFT 对偶性 [1]，以纳入网络的分层排列对称性，从而产生 $(0\\!+\\!1)$ 维晶格规范理论，其中每层 $N$ 神经元充当 $N$ 组件晶格位点，权重矩阵充当链接上规范场的角色。在此框架中，我们计算树级神经元-神经元传播器，它描述网络中层方差的演化，并开发费曼图机制来计算 $1/N$ 中扰动扩展中的相互作用。特别是，我们在 $O(1)$ 上获得了对精确传播器的所有校正的递归表达式，表示网络整体中的统计波动，包括​​调解前几层交互的无限多个循环图。我们还对神经元散射幅度进行了初步分析，这些幅度按顺序贡献为 $1/N$，这为研究深层网络中的更高点相关性以及扩展信息传播提供了场论框架。我们评论了神经网络和量子场论交叉领域未来工作的一些有趣方向。", "authors": [{"name": "Ro Jefferson"}, {"name": "Shradha Ramakrishnan"}], "featured_authors": [{"name": "Ro Jefferson"}, {"name": "Shradha Ramakrishnan"}], "author_count": 2}, {"id": "2608.19346", "category": "hep-th", "title": "Quantum chaos and late-time equipartition of symmetry-resolved Krylov complexity", "abstract": "We study symmetry-resolved Krylov complexity in finite-dimensional chaotic quantum many-body systems. When both the Hamiltonian and the initial operator commute with a conserved charge, the operator dynamics decomposes into independent symmetry sectors, each with its own Krylov chain. We show that, after saturation, the unresolved Krylov complexity is additive over symmetry sectors. In the absence of additional Liouvillian degeneracies, the late-time contribution of a sector with Hilbert-space dimension $d_q$ is controlled by $d_q(d_q-1)$, leading to a dimension-weighted equipartition that approaches the simple large-sector scaling $d_q^2/\\sum_{q'}d_{q'}^2$. This late-time rule differs from the early-time weighted-average discussed in the literature and is governed instead by the dimensions of the accessible operator spaces. We support the analytic prediction with numerical studies of the real and complex SYK models, a chaotic bosonic spin model, and the mixed-field Ising chain. Our results show that resolving exact symmetries is essential for interpreting the saturation value of Krylov complexity as a diagnostic of chaotic operator growth.", "url": "https://arxiv.org/abs/2608.19346", "type": "理论", "summary": "我们研究有限维混沌量子多体系统中对称解析的克雷洛夫复杂性。当哈密顿量和初始算子都以守恒电荷交换时，算子动力学分解为独立的对称扇区，每个对称扇区都有自己的克雷洛夫链。我们表明，饱和后，未解决的克雷洛夫复杂度在对称扇区上是可加的。在没有额外的刘维尔简并性的情况下，具有希尔伯特空间维度 $d_q$ 的扇区的后期贡献由 $d_q(d_q-1)$ 控制，从而导致接近简单大扇区缩放 $d_q^2/\\sum_{q'}d_{q'}^2$ 的维度加权均分。这种后期规则与文献中讨论的早期加权平均不同，而是由可访问算子空间的维度决定。我们通过对真实和复杂的 SYK 模型、混沌玻色子自旋模型和混合场伊辛链的数值研究来支持分析预测。我们的结果表明，解决精确对称性对于将 Krylov 复杂度的饱和值解释为混沌算子增长的诊断至关重要。", "authors": [{"name": "Jayashish Das"}, {"name": "Suman Das"}, {"name": "Juan F. Pedraza"}, {"name": "Le-Chen Qu"}], "featured_authors": [{"name": "Jayashish Das"}, {"name": "Suman Das"}, {"name": "Juan F. Pedraza"}, {"name": "Le-Chen Qu"}], "author_count": 4}, {"id": "2608.19359", "category": "hep-th", "title": "Quantum effects of charged massive scalar fields on charged black hole space-times", "abstract": "We compute the renormalized expectation values of the scalar condensate, charge current and stress-energy tensor for a massive charged quantum scalar field on a Reissner-Nordstrom black hole. The mass of the scalar field is sufficiently large that classical superradiance is absent. We present results for the Boulware, Unruh and Hartle-Hawking states. Renormalized expectation values in the Hartle-Hawking state are computed using an efficient and accurate mode sum prescription, and for the other two states we employ state subtraction. The efficiency of our numerical method enables us to explore a large part of the parameter space, including near-extremal black hole charges and scalar field masses close to the superradiant limit.", "url": "https://arxiv.org/abs/2608.19359", "type": "理论", "summary": "我们计算了 Reissner-Nordstrom 黑洞上大质量带电量子标量场的标量凝聚体、充电电流和应力能量张量的重整化期望值。标量场的质量足够大，以至于不存在经典的超辐射。我们提供了布尔韦尔州、安鲁州和哈特尔-霍金州的结果。 Hartle-Hawking 状态中的重整化期望值是使用有效且准确的模式和规定来计算的，对于其他两个状态，我们采用状态减法。我们的数值方法的效率使我们能够探索大部分参数空间，包括接近极值的黑洞电荷和接近超辐射极限的标量场质量。", "authors": [{"name": "Cormac Breen"}, {"name": "George Montagnon"}, {"name": "Peter Taylor"}, {"name": "Elizabeth Winstanley"}], "featured_authors": [{"name": "Cormac Breen"}, {"name": "George Montagnon"}, {"name": "Peter Taylor"}, {"name": "Elizabeth Winstanley"}], "author_count": 4}, {"id": "2608.19373", "category": "hep-th", "title": "Krylov complexity and the growth of the black hole interior in 3D gravity", "abstract": "We investigate the growth of the black hole interior in three-dimensional gravity from the boundary theory. For the two-sided BTZ black hole, we propose a boundary reconstruction of the time dependence of a codimension-one surface in terms of correlation functions of smeared operators in the thermofield double state, reproducing the characteristic late-time linear growth predicted by the complexity-volume proposal. Using the Chern--Simons formulation of three-dimensional gravity, these nonlocal correlators are represented by bulk Wilson lines with smeared endpoints, extending the familiar connection between Wilson lines and codimension-two observables underlying holographic entanglement entropy to codimension-one observables. We then ask whether the same geometric growth is captured by Krylov complexity. For the smeared operators, we extract the Lanczos data from their correlation functions and find that operator Krylov complexity reproduces the late-time linear growth of the black hole interior, extending previous connections between operator growth and bulk geometry to AdS$_3$. By contrast, the Krylov spread complexity of the thermofield double state, obtained from the semiclassical gravitational partition function, does not exhibit the linear growth of the bulk volume within the regime accessible to our analysis. Our results therefore point to a distinguished role for operator Krylov complexity in encoding black hole interior growth beyond two-dimensional gravity, while highlighting a qualitative distinction between operator and state notions of Krylov complexity.", "url": "https://arxiv.org/abs/2608.19373", "type": "理论", "summary": "我们从边界理论研究三维引力中黑洞内部的生长。对于双面 BTZ 黑洞，我们提出了根据热场双态中涂抹算子的相关函数对余维一表面的时间依赖性进行边界重建，再现了复杂性-体积提议所预测的特征后期线性增长。使用三维引力的 Chern-Simons 公式，这些非局域相关器由具有涂抹端点的体威尔逊线表示，将威尔逊线和全息纠缠熵基础的余维二可观测量之间的熟悉联系扩展到余维一可观测量。然后我们询问克雷洛夫复杂度是否可以捕获相同的几何增长。对于涂抹算子，我们从其相关函数中提取 Lanczos 数据，发现算子 Krylov 复杂度再现了黑洞内部的后期线性增长，将算子增长和体几何之间的先前联系扩展到 AdS$_3$。\n\n相比之下，从半经典引力分配函数获得的热场双态的克雷洛夫扩展复杂性，在我们分析的范围内并未表现出体积体积的线性增长。因此，我们的结果表明算子 Krylov 复杂度在编码超越二维引力的黑洞内部增长方面发挥着杰出作用，同时强调了 Krylov 复杂度算子和状态概念之间的定性区别。", "authors": [{"name": "Arpan Bhattacharyya"}, {"name": "Sounak Pal"}, {"name": "Juan F. Pedraza"}], "featured_authors": [{"name": "Arpan Bhattacharyya"}, {"name": "Sounak Pal"}, {"name": "Juan F. Pedraza"}], "author_count": 3}, {"id": "2608.19378", "category": "hep-th", "title": "Stochastic Schwinger Effect: de Sitter and beyond", "abstract": "We develop a stochastic formulation of the Schwinger effect in de Sitter spacetime using the Schwinger--Keldysh (in-in) formalism, tailored to particle production by non-stationary gauge backgrounds in the early Universe. Treating the gauge field as a prescribed classical stochastic ensemble, we integrate out massless charged matter and derive the corresponding influence functional and particle-production kernel to leading non-trivial order in the gauge coupling. Conformal invariance allows the result to be extended directly from de Sitter to generic spatially flat FLRW spacetimes, without relying on asymptotic out states. We establish the infrared safety and classicality conditions of the stochastic description and clarify its relation to the conventional static Schwinger effect. We further extend the framework to massless conformally coupled scalars and to weakly coupled non-Abelian gauge sectors, including Standard Model and hidden-sector examples, in regimes where thermal corrections are negligible. Our results provide a general framework for matter creation by stochastic gauge fields in inflation, preheating, and non-thermal BSM sectors, connecting quantum field theory in curved spacetime with early-Universe and high-energy phenomenology.", "url": "https://arxiv.org/abs/2608.19378", "type": "理论", "summary": "我们使用施温格-凯尔迪什（in-in）形式主义开发了德西特时空中施温格效应的随机公式，该公式针对早期宇宙中非平稳规范背景的粒子产生而定制。将规范场视为规定的经典随机系综，我们对无质量带电物质进行积分，并推导出相应的影响函数和粒子产生核，以在规范耦合中引导非平凡顺序。共形不变
