性允许结果直接从德西特扩展到通用空间平坦的 FLRW 时空，而不依赖于渐近输出状态。我们建立了随机描述的红外安全性和经典性条件，并阐明了其与常规静态施温格效应的关系。我们进一步将框架扩展到无质量共形耦合标量和弱耦合非阿贝尔规范扇区，包括标准模型和隐藏扇区示例，在热校正可以忽略不计的情况下。\n\n我们的研究结果为暴胀、预热和非热 BSM 领域中的随机规范场创造物质提供了一个总体框架，将弯曲时空中的量子场论与早期宇宙和高能现象学联系起来。", "authors": [{"name": "Lucas Vicente García-Consuegra"}, {"name": "Azadeh Maleknejad"}], "featured_authors": [{"name": "Lucas Vicente García-Consuegra"}, {"name": "Azadeh Maleknejad"}], "author_count": 2}, {"id": "2608.19400", "category": "hep-th", "title": "Lorentzian Kähler-Dirac fermions", "abstract": "We examine the formulation of Kähler fermions on spacetimes with Lorentz signature. In practice we focus on Minkowski spacetime since most of the difficulties that are encountered are visible even when the spacetime is flat. We show that the theory, when interpreted as a Lorentz invariant theory of forms or antisymmetric tensor fields, is non-unitary. We show that unitarity can be restored provided one adopts a modified inner product on the Hilbert space. This modified inner product requires the insertion of an operator J that anti-commutes with certain modes of the Kähler field in such a way as to guarantee all states have positive norm. We give an explicit (and local) form for J and show that while it commutes with the Hamiltonian, it is incompatible with the Lorentz transformation properties of the tensor fields. In flat space, the unitarized formulation is equivalent to 4 Dirac fermions.", "url": "https://arxiv.org/abs/2608.19400", "type": "理论", "summary": "我们研究了具有洛伦兹签名的时空上的凯勒费米子的公式。在实践中，我们关注闵可夫斯基时空，因为即使时空是平坦的，遇到的大多数困难也是可见的。我们证明，当将该理论解释为形式或反对称张量场的洛伦兹不变理论时，该理论是非酉的。我们证明，只要在希尔伯特空间上采用修改的内积，就可以恢复幺正性。这种修改后的内积需要插入一个运算符 J，该运算符与 Kähler 场的某些模式进行反交换，以保证所有状态都具有正范数。我们给出 J 的显式（局部）形式，并表明虽然它与哈密顿量可交换，但它与张量场的洛伦兹变换属性不兼容。在平坦空间中，酉化公式相当于 4 个狄拉克费米子。", "authors": [{"name": "Simon Catterall"}, {"name": "Jay Hubisz"}], "featured_authors": [{"name": "Simon Catterall"}, {"name": "Jay Hubisz"}], "author_count": 2}, {"id": "2608.19418", "category": "hep-th", "title": "BCFW recursion for light-like Wilson loop correlators", "abstract": "We apply the idea of holomorphic linking ( arXiv:1101.1329 ) to correlators of multiple light-like loop operators in $\\mathcal{N}=4$ super Yang-Mills theory. This allows us to extend the BCFW recursion relations for planar scattering amplitude integrands or single Wilson loops in the planar theory to correlators of multiple loop operators. We discover a novel term which feeds the recursion for single loops into the relation for multiple loop operators. We illustrate the recursion relations with several examples and highlight its applicability in combination with the $\\bar{Q}$-equation for multiple loop operators. Finally, we again employ holomorphic linking to derive a recursion relation for colour-exact Wilson loop correlators.", "url": "https://arxiv.org/abs/2608.19418", "type": "理论", "summary": "我们将全纯链接（ arXiv:1101.1329 ）的思想应用于 $\\mathcal{N}=4$ super Yang-Mills 理论中的多个类光循环算子的相关器。这使我们能够将平面散射振幅被积函数或平面理论中的单个 Wilson 环的 BCFW 递归关系扩展到多个环算子的相关器。我们发现了一个新术语，它将单个循环的递归提供给多个循环运算符的关系。我们用几个例子来说明递归关系，并强调其与多个循环运算符的 $\\bar{Q}$ 方程结合的适用性。最后，我们再次使用全纯链接来导出颜色精确威尔逊环相关器的递归关系。", "authors": [{"name": "James Drummond"}, {"name": "Matthew Rochford"}, {"name": "Rowan Wright"}], "featured_authors": [{"name": "James Drummond"}, {"name": "Matthew Rochford"}, {"name": "Rowan Wright"}], "author_count": 3}, {"id": "2608.19428", "category": "hep-th", "title": "Holographic Bit Threads from String-Diagrammatic Quantum Information Flow", "abstract": "Bit threads, arising as the convex dual of the minimal-surface formula for holographic entanglement entropy, are line-like structures with nontrivial bulk trajectories. Their physical picture has long been associated with Bell-pair interpretations, yet the meaning of their detailed trajectories, particularly their nonuniqueness, remains unclear. We propose to apply Coecke's notion of quantum information flow (QIF) in protocol-network geometry, developed within categorical quantum mechanics, to a holographic setup, and show that its trajectories within the discrete holographic bulk---the tensor network---obey the divergence-free and density-bound conditions of bit threads. From this process-centered perspective, bit-thread nonuniqueness becomes natural: for a given resource state, different protocols realizing the same distillation task can give rise to different QIF trajectories. We further analyze stabilizer-type holographic tensor networks using ZX string diagrams and show that QIF trajectories can probe finer entanglement structure beyond the level captured by entanglement entropy.", "url": "https://arxiv.org/abs/2608.19428", "type": "理论", "summary": "位线是作为全息纠缠熵的最小表面公式的凸对偶而出现的，是具有非平凡体轨迹的线状结构。它们的物理图像长期以来一直与贝尔对的解释联系在一起，但它们的详细轨迹的意义，特别是它们的非唯一性，仍然不清楚。我们建议将 Coecke 在协议网络几何中的量子信息流 (QIF) 概念（在分类量子力学中发展起来）应用于全息设置，并表明其在离散全息体（张量网络）内的轨迹遵守位线程的无散度和密度约束条件。从这个以流程为中心的角度来看，位线程的非唯一性变得很自然：对于给定的资源状态，实现相同蒸馏任务的不同协议可以产生不同的 QIF 轨迹。我们使用 ZX 弦图进一步分析稳定器型全息张量网络，并表明 QIF 轨迹可以探测超出纠缠熵捕获水平的更精细的纠缠结构。", "authors": [{"name": "Yi-Yu Lin"}, {"name": "Song Cheng"}], "featured_authors": [{"name": "Yi-Yu Lin"}, {"name": "Song Cheng"}], "author_count": 2}, {"id": "2608.19539", "category": "hep-th", "title": "Higher Chern--Simons Theory in $2n+2$ Dimensions for Balanced 2-term $L_\\infty$-Algebras", "abstract": "We construct a semistrict higher Chern--Simons (HCS) gauge theory in $2n+2$ dimensions associated with balanced 2-term $L_\\infty$-algebras. Starting from the homotopy Maurer--Cartan theory, we first introduce 2-term $L_\\infty$-algebra gauge theory, and show that there is a four-dimensional HCS construction. Then we extend invariant bilinear pairings to invariant multilinear forms of the appropriate degree, and define a $(2n+3)$-dimensional higher Pontryagin--Chern form, which is closed and invariant under infinitesimal gauge transformations. Its transgression yields an explicit $(2n+2)$-dimensional HCS form. We further establish a higher Chern--Weil theorem that generates higher transgression forms, and prove that the HCS theory is a distinguished instance of the higher transgression gauge theory. Finally, we apply the extended Cartan homotopy formula in this semistrict setting, and show that it is a common origin of both the higher Chern--Weil theorem and the associated triangle equation.", "url": "https://arxiv.org/abs/2608.19539", "type": "理论", "summary": "我们构建了与平衡 2 项 $L_\\infty$-代数相关的 $2n+2$ 维度的半严格高陈-西蒙斯 (HCS) 规范理论。从同伦Maurer--Cartan理论出发，首先引入2项$L_\\infty$-代数规范理论，并证明存在一个四维HCS结构。然后，我们将不变双线性对扩展到适当程度的不变多线性形式，并定义 $(2n+3)$ 维更高的 Pontryagin-Chern 形式，该形式在无穷小规范变换下是封闭且不变的。它的越界产生了一个明确的 $(2n+2)$ 维 HCS 形式。我们进一步建立了产生更高海侵形式的更高陈-韦伊定理，并证明HCS理论是更高海侵规范理论的一个杰出实例。最后，我们在这个半严格的设置中应用扩展的嘉当同伦公式，并表明它是高等陈-韦伊定理和相关三角方程的共同起源。", "authors": [{"name": "Danhua Song"}, {"name": "Yibo Wang"}], "featured_authors": [{"name": "Danhua Song"}, {"name": "Yibo Wang"}], "author_count": 2}, {"id": "2608.19720", "category": "hep-th", "title": "Tropical and Stringy Integrals for In-In Correlators", "abstract": "We introduce tropical and stringy integrals for fixed-graph contributions to cosmological in-in correlators of conformally coupled scalars. The full-time representation factorizes into a graph-dependent vertex-space Laplace integral, with one real variable for each graph vertex, and an elementary edge-space Laplace integral, with one real variable for each internal edge. The vertex-space exponent is a sum of absolute values associated with sites and relative edge times; as a piecewise-linear function, it is the support function of the in-in zonotope. Each absolute value is also the tropical limit of a positive Laurent binomial. Retaining these binomials before tropicalization defines a finite-$\\alpha'$ vertex-space stringy integral, so both the polytope and its stringy integral are read directly from the physical time integral. In the $\\alpha' \\to 0$ limit this integral becomes the normalized dual volume of the in-in zonotope, while the edge-space factor deforms independently into a product of beta integrals and restores the elementary propagator normalization. We derive the field-theory rational form from augmented-graph chambers, as well as exact finite-$\\alpha'$ parallel-edge reduction, factorization formulas for edge-energy and partial-energy poles, and even descendant towers. As an alternative geometric realization of fixed-graph correlators, we find an ambient Minkowski-sum and stringy-integral realization of the graph correlahedron for a tree graph as the so-called graph cubeahedron of its line graph. For completeness, we also record the logarithmic critical equations and generic reference degrees of the associated affine divisor arrangement.", "url": "https://arxiv.org/abs/2608.19720", "type": "理论", "summary": "我们引入了热带和弦积分，用于固定图对共形耦合标量的宇宙学内内相关器的贡献。全时表示分解为图相关顶点空间拉普拉斯积分（每个图顶点有一个实变量）和基本边空间拉普拉斯积分（每个内部边有一个实变量）。顶点空间指数是与站点和相对边缘时间相关的绝对值的总和；作为分段线性函数，它是 in-in 区域的支持函数。每个绝对值也是正洛朗二项式的热带极限。在热带化之前保留这些二项式定义了有限$\\alpha'$顶点空间弦积分，因此多胞形及其弦积分都是直接从物理时间积分读取的。在 $\\alpha' \\to 0$ 限制下，该积分成为 in-in 区域的归一化对偶体积，而边缘空间因子独立变形为 beta 积分的乘积并恢复基本传播器归一化。\n\n我们从增强图室中推导出场论有理形式，以及精确的有限$\\alpha'$平行边约简、边能量和部分能量极的因式分解公式，甚至后代塔。作为固定图相关器的替代几何实现，我们找到了树图的图相关面体的环境 Minkowski 和和弦积分实现，作为其线图的所谓图立方面体。为了完整性，我们还记录了相关仿射除数排列的对数临界方程和通用参考度。", "authors": [{"name": "Song He"}, {"name": "Xiang Li"}, {"name": "Yong-Xiang Su"}, {"name": "Fan Zhu"}], "featured_authors": [{"name": "Song He"}, {"name": "Xiang Li"}, {"name": "Yong-Xiang Su"}, {"name": "Fan Zhu"}], "author_count": 4}, {"id": "2608.19775", "category": "hep-th", "title": "Supergroup Gauged Linear Sigma Models and their Physical Mathematics", "abstract": "We construct 2d $\\mathcal{N}=(2,2)$ gauged linear sigma models with $\\mathrm{U}(1|1)^N$ supergauge group possibly with superpotential. Despite being nonunitary, one can still study their space of supersymmetric states and explore their applications to mathematics. In particular, we find a relation between a nonlinear sigma model on a Calabi-Yau complete intersection of hypersurfaces in a super-Grassmannian and a supergauged Landau-Ginzburg orbifold, which can reduce to a regular Calabi-Yau/Landau-Ginzburg correspondence for complete intersections. This defines a super-Grassmannian/supergroup generalization of the correspondence proved by Clader [1] and Zhao [2]. Similarly, we find a relation between a nonlinear sigma model on a Calabi-Yau hypersurface in a product of super-Grassmannians and a hybrid NLSM/supergauged Landau-Ginzburg orbifold, which can reduce to a regular hybrid Calabi-Yau/Landau-Ginzburg correspondence for hypersurfaces in product space. This defines a super-Grassmannian/supergroup generalization of the correspondence proved by Fan-Jarvis-Ruan [3]. We also find that Calabi-Yau supervector bundles over a super-Grassmannian can undergo a physically related mild topology change which is reducible to a regular Atiyah-type flop transition. This defines a super-Grassmannian generalization of a birational equivalence of Calabi-Yau vector bundles in mathematics. Similarly, we find that a Calabi-Yau complete intersection of quadrics in a super-Grassmannian can also undergo a physically related topology change which is reducible to a regular conifold transition. This defines a super-Grassmannian generalization of a homological projective duality for Calabi-Yau quadrics by Kuznetsov-Perry [4] in mathematics.", "url": "https://arxiv.org/abs/2608.19775", "type": "理论", "summary": "我们用可能具有超势的 $\\mathrm{U}(1|1)^N$ 超量规组构建了二维 $\\mathcal{N}=(2,2)$ 量规线性 sigma 模型。尽管是非酉的，但人们仍然可以研究它们的超对称态空间并探索它们在数学中的应用。特别是，我们发现了超格拉斯曼超曲面 Calabi-Yau 完全相交上的非线性 sigma 模型与超规范 Landau-Ginzburg 环折之间的关系，这可以简化为完全相交的常规 Calabi-Yau/Landau-Ginzburg 对应关系。这定义了 Clader [1] 和 Zhu [2] 证明的对应关系的超格拉斯曼/超群推广。类似地，我们发现了超级格拉斯曼乘积中卡拉比-丘超曲面上的非线性 sigma 模型与混合 NLSM/超规范 Landau-Ginzburg 环折之间的关系，这可以简化为产品空间中超曲面的常规混合卡拉比-丘/朗道-金茨堡对应关系。这定义了 Fan-Jarvis-Ruan [3] 证明的对应关系的超格拉斯曼/超群推广。\n\n我们还发现超格拉斯曼上的 Calabi-Yau 超向量丛可以经历物理相关的温和拓扑变化，这可以简化为常规的 Atiyah 型触发器转换。这定义了数学中 Calabi-Yau 向量丛的双有理等价的超格拉斯曼推广。类似地，我们发现超格拉斯曼二次曲面的 Calabi-Yau 完全交集也可以经历物理相关的拓扑变化，这可以简化为规则的圆锥形过渡。这定义了 Kuznetsov-Perry [4] 在数学中对 Calabi-Yau 二次曲面的同调射影对偶性的超格拉斯曼推广。", "authors": [{"name": "Arif Er"}, {"name": "Zhangcheng Liu"}, {"name": "Meng-Chwan Tan"}], "featured_authors": [{"name": "Arif Er"}, {"name": "Zhangcheng Liu"}, {"name": "Meng-Chwan Tan"}], "author_count": 3}, {"id": "2608.19795", "category": "hep-th", "title": "A Stationary Composition Law for Schwinger-Keldysh Effective Actions", "abstract": "Let $W_{\\cal O}[J]$ and $W_{\\cal C}[J]$ denote the connected generating functionals of an open system and its closed system counterpart, and define the environment-induced contribution $W_{\\rm IF}[J]$ by the difference: $ W_{\\rm IF}[J]\\equiv W_{\\cal O}[J]-W_{\\cal C}[J].$ The corresponding Legendre transforms, $\\Gamma_{\\cal O}$, $\\Gamma_{\\cal C}$, and $\\Gamma_{\\rm IF}$, do not obey an analogous additive relation but satisfy a stationary composition law given by: \\[ \\Gamma_{\\cal O}[\\Phi] = \\operatorname*{Stat}_{\\Psi} \\left\\{ \\Gamma_{\\cal C}[\\Psi] + \\Gamma_{\\rm IF}[\\Phi-\\Psi] \\right\\} \\] where ${\\rm Stat}$ denotes evaluation at a solution of the stationarity condition with respect to $\\Psi$. This variational composition applies to both local and nonlocal Schwinger-Keldysh effective actions in nonequilibrium quantum field theory. We illustrate its linear and nonlinear realizations through quadratic theories and general time independent effective actions, respectively.", "url": "https://arxiv.org/abs/2608.19795", "type": "理论", "summary": "设 $W_{\\cal O}[J]$ 和 $W_{\\cal C}[J]$ 表示开放系统及其封闭系统对应的连通生成泛函，并通过差值定义环境引起的贡献 $W_{\\rm IF}[J]$： $ W_{\\rm IF}[J]\\equiv W_{\\cal O}[J]-W_{\\cal C}[J].$ 相应的勒让德变换， $\\Gamma_{\\cal O}$、$\\Gamma_{\\cal C}$ 和 $\\Gamma_{\\rm IF}$ 不服从类似的加法关系，但满足平稳合成律： \\[ \\Gamma_{\\cal O}[\\Phi] = \\operatorname*{Stat}_{\\Psi} \\left\\{ \\Gamma_{\\cal C}[\\Psi] + \\Gamma_{\\rm IF}[\\Phi-\\Psi] \\right\\} \\] 其中 ${\\rm Stat}$ 表示相对于 $\\Psi$ 的平稳性条件解的评估。这种变分组合适用于非平衡量子场论中的局域和非局域施温格-凯尔迪什有效作用。我们分别通过二次理论和一般时间无关的有效作用来说明其线性和非线性实现。", "authors": [{"name": "Denis Comelli"}], "featured_authors": [{"name": "Denis Comelli"}], "author_count": 1}, {"id": "2608.19845", "category": "hep-th", "title": "Holographic Dual of Synge's Identity in AdS/CFT", "abstract": "We identify CFT counterparts of Synge's identity for finite AdS geodesics in arbitrary dimensions. Starting from exact finite bulk--boundary pairs, the Synge equation induces endpoint scale equations for a Weyl-frame scalar two-point function and for the finite entanglement entropy between disjoint balls. In the planar frame, the common-scale correlator equation is the dilatation Ward identity. In the entanglement sector, the corresponding relative-scale equation is governed by a transverse hyperbolic area and reduces in two dimensions to the previously identified entanglement RG equation.", "url": "https://arxiv.org/abs/2608.19845", "type": "理论", "summary": "我们针对任意维度的有限 AdS 测地线确定了 Synge 恒等式的 CFT 对应项。从精确的有限体边界对开始，Synge 方程导出了 Weyl 框架标量两点函数和不相交球之间的有限纠缠熵的端点尺度方程。在平面框架中，共尺度相关器方程是膨胀沃德恒等式。在纠缠扇区中，相应的相对尺度方程由横向双曲线区域控制，并在二维上简化为先前确定的纠缠 RG 方程。", "authors": [{"name": "Bingbing Chen"}, {"name": "Deyou Chen"}], "featured_authors": [{"name": "Bingbing Chen"}, {"name": "Deyou Chen"}], "author_count": 2}, {"id": "2608.19859", "category": "hep-th", "title": "One more Sine-Gordon soliton in AdS", "abstract": "In previous work arXiv:2604.00160 , we found soliton solutions in a deformation of the sine-Gordon theory in AdS spacetime that, in the infinite-radius limit, reduce to single-soliton solutions in flat space. In this paper, we find another single soliton solution that has no analog in flat space.", "url": "https://arxiv.org/abs/2608.19859", "type": "理论", "summary": "在之前的工作 arXiv:2604.00160 中，我们发现了 AdS 时空中正弦戈登理论变形中的孤子解，在无限半径限制下，简化为平坦空间中的单孤子解。在本文中，我们找到了另一种在平坦空间中没有类似物的单孤子解。", "authors": [{"name": "D. V. Diakonov"}], "featured_authors": [{"name": "D. V. Diakonov"}], "author_count": 1}, {"id": "2608.19896", "category": "hep-th", "title": "Massive spin-2 supermultiplet and supergravity", "abstract": "In this work, we consider the interaction of massless $N=1$ supergravity with a massive (2,3/2,3/2,1) supermultiplet, as a possible candidate for a supersymmetric extension to bigravity. A gauge invariant description for massive spin-2, spin-3/2 and spin-1 fields is used. As a result of this, ambiguities arise related to possible field redefinitions, which are fixed by using a recently proposed method based on unfolded equations, and by restricting ourselves to interactions with the minimum number of derivatives (two for bosonic and one for fermionic vertices). It appears that this completely fixes the entire construction.", "url": "https://arxiv.org/abs/2608.19896", "type": "理论", "summary": "在这项工作中，我们考虑无质量 $N=1$ 超引力与大质量 (2,3/2,3/2,1) 超多重态的相互作用，作为重引力超对称扩展的可能候选者。使用大规模自旋 2、自旋 3/2 和自旋 1 场的规范不变描述。因此，出现了与可能的场重新定义相关的模糊性，这些模糊性通过使用最近提出的基于展开方程的方法以及通过限制我们与最小数量的导数（两个用于玻色子和一个用于费米子顶点）的相互作用来解决。看来这完全修复了整个结构。", "authors": [{"name": "Yu. M. Zinoviev"}], "featured_authors": [{"name": "Yu. M. Zinoviev"}], "author_count": 1}, {"id": "2608.19941", "category": "hep-th", "title": "A Note on a High-Energy Limit of Gravitational Perturbation Theory", "abstract": "The post-Minkowskian expansion of general relativity expands the metric in Newton's constant G around flat space-time, but much effort currently focuses on ways to extend its range of applicability by summing the perturbative series to all orders. A regime of particular interest is a specific high-energy limit where a formula derived recently provides the momentum kick of binary scattering problem to all orders, and even suggests an approach towards strong coupling. We show that this is an asymptotic expansion. Although the series diverges we give evidence that it is Borel summable, and the full function in integral form is finite. As a by-product we determine the transcendentality properties of the coefficients in the expanded expression.", "url": "https://arxiv.org/abs/2608.19941", "type": "理论", "summary": "广义相对论的后闵可夫斯基展开扩展了围绕平坦时空的牛顿常数 G 的度量，但目前的大部分努力都集中在通过对所有阶的微扰级数求和来扩展其适用范围的方法上。特别感兴趣的一个机制是特定的高能极限，其中最近导出的公式为所有阶提供了二元散射问题的动量冲击，甚至提出了一种实现强耦合的方法。我们证明这是一个渐近展开。尽管级数发散，但我们证明它是 Borel 可求和的，并且积分形式的完整函数是有限的。作为副产品，我们确定了扩展表达式中系数的超越性属性。", "authors": [{"name": "Poul H. Damgaard"}, {"name": "Ludovic Plante"}], "featured_authors": [{"name": "Poul H. Damgaard"}, {"name": "Ludovic Plante"}], "author_count": 2}, {"id": "2608.19948", "category": "hep-th", "title": "Hilbert space relation from dS to AdS through Reflection Positivity", "abstract": "De Sitter unitarity and reflection positivity are logically independent. We study their relation for a free scalar field on a fixed de Sitter background, restricting attention to the one-particle sector. Motivated by Witten's de Sitter pairing and the radial adjoint of Bousso, Maloney and Strominger, we compose the invariant Hilbert product with equatorial reflection. In the standard principal-series realization, this form vanishes identically and its Osterwalder-Schrader quotient contains no states. For the complementary series, the reflected product becomes a nonzero reflected kernel on the unit ball. A result of Neeb and Ólafsson shows that this kernel is positive semidefinite precisely when the lower weight satisfies the scalar conformal unitarity bound. The resulting Hilbert space with the reflected inner product furnishes a positive-energy representation of AdS isometries according to Neeb and Ólafsson. We identify that the range coincides with the Klebanov-Witten alternative-quantization window from physics point of view. This correspondence suggests a novel relation from the representation viewpoint between AdS and dS without the conventional analytic continuation of radius.", "url": "https://arxiv.org/abs/2608.19948", "type": "理论", "summary": "德西特幺正性和反射正性在逻辑上是独立的。我们研究了它们与固定德西特背景上的自由标量场的关系，将注意力限制在单粒子扇区上。受 Witten 的德西特配对和 Bousso、Maloney 和 Strominger 的径向伴随的启发，我们用赤道反射合成了不变的希尔伯特积。在标准主级数实现中，这种形式同样消失，并且其 Osterwalder-Schrader 商不包含任何状态。对于互补级数，反射积成为单位球上的非零反射核。 Neeb 和 Ólafsson 的结果表明，当较低权重满足标量共形酉界时，该核正是半正定的。根据 Neeb 和 Ólafsson 的说法，由此产生的带有反射内积的希尔伯特空间提供了 AdS 等距的正能量表示。从物理学的角度来看，我们发现该范围与 Klebanov-Witten 替代量化窗口一致。\n\n这种对应关系从 AdS 和 dS 之间的表示观点来看提出了一种新颖的关系，而无需传统的半径解析延拓。", "authors": [{"name": "Yu-ki Suzuki"}], "featured_authors": [{"name": "Yu-ki Suzuki"}], "author_count": 1}, {"id": "2608.20071", "category": "hep-th", "title": "Singularity-Rank Signatures in Generalized Dirac Oscillators near a BTZ Horizon", "abstract": "We study singular generalized Dirac-oscillator couplings in the near-horizon region of a nonextremal BTZ black hole. An effective covariant construction adapted to the stationary horizon congruence relates the two singular profiles to the proper acceleration and its radial gradient, whose leading near-horizon behaviors are $1/\\rho$ and $1/\\rho^2$. This motivates the family $\\mathcal{L}_p(\\rho)=\\lambda_0+\\beta_p/\\rho^p$, with $p=1,2$. The $p=1$ system has a regular singular point and is Fuchsian, whereas $p=2$ is the first irregular case; more generally, a leading $\\rho^{-p}$ interaction with $p>1$ has Poincaré rank $p-1$. For $p=1$, a constant spinor transformation reduces the matrix-Coulomb system exactly to the Whittaker equation, while elimination in the original basis gives an equivalent confluent-Heun representation with an apparent finite singularity. For $p=2$, the local branches contain the essential factors $e^{\\pm\\beta_2/\\rho}\\rho^{-1/2}$, and their coefficient expansions exhibit generic factorial late-order growth. The finite-radius response $\\mathcal{Z}_p(\\Omega;\\rho_0)=\\psi_{2,p}(\\rho_0)/\\psi_{1,p}(\\rho_0)$ obeys an exact Riccati equation whose large-damping expansion first becomes sensitive to the radial gradient of the interaction at order $\\gamma^{-3}$. Even when the two couplings are matched at $\\rho_0$, this response retains information about their different pole orders. The response functions provide local spinorial data for subsequent matching to the complete BTZ exterior.", "url": "https://arxiv.org/abs/2608.20071", "type": "理论", "summary": "我们研究非极值 BTZ 黑洞近地平线区域的奇异广义狄拉克振荡器耦合。适应静止地平线同余的有效协变结构将两个奇异轮廓与适当的加速度及其径向梯度联系起来，其主要的近地平线行为是 $1/\\rho$ 和 $1/\\rho^2$。这激励了$\\mathcal{L}_p(\\rho)=\\lambda_0+\\beta_p/\\rho^p$族，其中$p=1,2$。 $p=1$ 系统有一个规则奇点并且是 Fuchsian 系统，而 $p=2$ 是第一个不规则情况；更一般地，$p>1$ 的主导 $\\rho^{-p}$ 交互具有庞加莱等级 $p-1$。对于 $p=1$，常数旋量变换将矩阵-库仑系统精确地简化为 Whittaker 方程，而原始基中的消除给出了具有明显有限奇点的等效合流-Heun 表示。对于$p=2$，局部分支包含基本因子$e^{\\pm\\beta_2/\\rho}\\rho^{-1/2}$，并且它们的系数展开表现出通用阶乘后序增长。\n\n有限半径响应 $\\mathcal{Z}_p(\\Omega;\\rho_0)=\\psi_{2,p}(\\rho_0)/\\psi_{1,p}(\\rho_0)$ 服从精确的 Riccati 方程，其大阻尼展开首先对 $\\gamma^{-3}$ 阶相互作用的径向梯度敏感。即使两个耦合在 $\\rho_0$ 处匹配，此响应也会保留有关其不同极阶的信息。响应函数提供局部旋量数据，以便随后与完整的 BTZ 外部进行匹配。", "authors": [{"name": "João V. R. Alencar"}, {"name": "Allan R. P. Moreira"}, {"name": "João B. R. Silva"}, {"name": "Abdullah Guvendi"}], "featured_authors": [{"name": "João V. R. Alencar"}, {"name": "Allan R. P. Moreira"}, {"name": "João B. R. Silva"}, {"name": "Abdullah Guvendi"}], "author_count": 4}, {"id": "2608.20333", "category": "hep-th", "title": "Maximal Torus Topological Entanglement Entropy in WZW Theories at Bounded Ground-State Degeneracy", "abstract": "For an untwisted Wess--Zumino--Witten modular tensor category $\\cC(\\mathfrak g,k)$, let $r(\\mathfrak g,k)$ be the number of simple objects and $\\cD(\\mathfrak g,k)$ its total quantum dimension. The vacuum-flux state on a torus divided into two cylinders has positive universal entropy contribution $\\Gamma_{T^2}=2\\log\\cD$. We maximize this quantity over all simple Lie algebras and positive integral levels subject to $r(\\mathfrak g,k)\\leq R$. If $q_R=\\log_2R$, then $\\Gamma_{\\max}(R)\\sim[7\\zeta(3)/(4\\pi^2)]q_R^2$ as $R\\to\\infty$. The sequence $Sp(2n)_n$ attains the asymptotic coefficient. At equal rank and level, the Fourier expansion of the type-$C$ root product loses its even modes, leaving $2\\pi^{-2}\\sum_{m\\,\\mathrm{odd}}m^{-3}=7\\zeta(3)/(4\\pi^2)$. An entropy--spectral inequality proves optimality among the classical families, while rank--level duality and fixed-rank estimates control unbalanced and exceptional sequences.", "url": "https://arxiv.org/abs/2608.20333", "type": "理论", "summary": "对于未扭曲的 Wess--Zumino--Witten 模张量类别 $\\cC(\\mathfrak g,k)$，令 $r(\\mathfrak g,k)$ 为简单对象的数量，$\\cD(\\mathfrak g,k)$ 为其总量子维度。分成两个圆柱体的圆环上的真空通量状态具有正的通用熵贡献 $\\Gamma_{T^2}=2\\log\\cD$。我们在所有简单的李代数和正积分水平上最大化这个数量，并服从 $r(\\mathfrak g,k)\\leq R$。如果 $q_R=\\log_2R$，则 $\\Gamma_{\\max}(R)\\sim[7\\zeta(3)/(4\\pi^2)]q_R^2$ 为 $R\\to\\infty$。序列 $Sp(2n)_n$ 获得渐近系数。在相同的秩和水平下，$C$ 型根乘积的傅立叶展开失去了偶模，留下 $2\\pi^{-2}\\sum_{m\\,\\mathrm{odd}}m^{-3}=7\\zeta(3)/(4\\pi^2)$。熵谱不等式证明了经典族中的最优性，而等级级二元性和固定等级估计控制着不平衡和异常序列。", "authors": [{"name": "Ce Shen"}], "featured_authors": [{"name": "Ce Shen"}], "author_count": 1}, {"id": "2608.19619", "category": "math-ph", "title": "Moore--Read construction and explicit monodromies of Laughlin states on Riemann surfaces", "abstract": "We revisit the Moore--Read construction of the $\\nu=1/k$ Laughlin states on compact Riemann surfaces, deriving their conformal blocks from $U(1)_k$ Chern--Simons theory through the CS/WZW correspondence. We compute their explicit monodromies under quasi-hole transport and Aharonov--Bohm flux insertion, and conjecture that these coincide with the corresponding adiabatic holonomies. Under this identification, we recover classical results on Laughlin states including the flux-averaged Hall conductance $1/k$ via a vector bundle of Laughlin states over $Jac(\\Sigma)$. We also relate our construction to the recently developed algebro-geometric approach to higher genus Laughlin states.", "url": "https://arxiv.org/abs/2608.19619", "type": "理论", "summary": "我们重新审视紧致黎曼曲面上 $\\nu=1/k$ Laughlin 态的 Moore--Read 构造，通过 CS/WZW 对应从 $U(1)_k$ Chern-Simons 理论推导出它们的共形块。我们计算了它们在准空穴输运和阿哈罗诺夫-玻姆通量插入下的显式单向性，并推测它们与相应的绝热完整性一致。在此识别下，我们通过 $Jac(\\Sigma)$ 上的 Laughlin 态向量束恢复了 Laughlin 态的经典结果，包括通量平均霍尔电导 $1/k$。我们还将我们的构造与最近开发的更高属劳克林态的代数几何方法联系起来。", "authors": [{"name": "Kiyoon Eum"}], "featured_authors": [{"name": "Kiyoon Eum"}], "author_count": 1}, {"id": "2608.19243", "category": "quant-ph", "title": "The HALO Engine: $\\mathcal{O}(1)$-Step Compilation and Localized String Rupture for Lattice Gauge Theories on Quantum Hardware", "abstract": "Simulating the real-time dynamics of lattice gauge theories (LGTs) represents a challenge for near-term quantum computing. Standard digital simulations rely on Trotterization schemes where circuit depth scales proportionally with lattice size, inevitably colliding with the coherence limits of noisy intermediate-scale quantum (NISQ) hardware. To deal with this depth-scaling bottleneck, we introduce the Hardware-Aware Lattice Optimization (HALO) compiler, an architecture that executes global time-evolution steps in an immutable $\\mathcal{O}(1)$ circuit depth per Trotter step. Leveraging this framework, we elevate the digital simulation of the Quantum Link Model (QLM) truncation of the Schwinger model to the mesoscopic scale, utilizing a composite multi-qubit gauge link representation to support non-trivial electric field dynamics. We initialize and execute the non-perturbative dynamics of a heavily stretched $L=15$ meson string on a 16-qubit superconducting transmon processor. By coupling the $\\mathcal{O}(1)$ compilation with Zero-Noise Extrapolation (ZNE), we suppress physical hardware decoherence to extract the precise dynamical crossover of localized pair creation, identifying the topological transition at $t \\approx 0.790$ lattice units with an $18.3 \\pm 2.2\\%$ rupture probability. Furthermore, we empirically map the dynamical phase diagram of the mesoscopic lattice, pinpointing the effective confinement phase boundary at precisely $g_c = 1.0$. Finally, we extend the mathematical principles of the HALO engine to higher dimensions, presenting a scalable, constant-depth 2D unit-cell blueprint that eliminates the routing overhead of magnetic plaquettes, paving a direct algorithmic pathway toward the fault-tolerant simulation of two-dimensional Quantum Chromodynamics (QCD).", "url": "https://arxiv.org/abs/2608.19243", "type": "理论+数值", "summary": "模拟晶格规范理论 (LGT) 的实时动态对近期量子计算来说是一个挑战。标准数字模拟依赖于 Trotterization 方案，其中电路深度与晶格尺寸成比例，不可避免地与噪声中尺度量子 (NISQ) 硬件的相干限制相冲突。为了解决这个深度扩展瓶颈，我们引入了硬件感知晶格优化（HALO）编译器，该架构在每个 Trotter 步骤的不可变 $\\mathcal{O}(1)$ 电路深度中执行全局时间演化步骤。利用这个框架，我们将施温格模型的量子链接模型（QLM）截断的数字模拟提升到介观尺度，利用复合多量子位规范链接表示来支持非平凡的电场动力学。我们在 16 量子位超导 transmon 处理器上初始化并执行严重拉伸的 $L=15$ 介子串的非微扰动力学。\n\n通过将 $\\mathcal{O}(1)$ 编译与零噪声外推（ZNE）相结合，我们抑制物理硬件退相干，以提取局部对创建的精确动态交叉，识别 $t \\approx 0.790$ 晶格单元处的拓扑转变，破裂概率为 $18.3 \\pm 2.2\\%$。此外，我们凭经验绘制了介观晶格的动态相图，精确地将有效限制相边界精确定位在 $g_c = 1.0$ 处。最后，我们将 HALO 引擎的数学原理扩展到更高的维度，提出了一个可扩展的、恒定深度的二维单元蓝图，消除了磁性板的布线开销，为二维量子色动力学 (QCD) 的容错模拟铺平了直接的算法途径。", "authors": [{"name": "Abhiroop Gohar"}], "featured_authors": [{"name": "Abhiroop Gohar"}], "author_count": 1}, {"id": "2608.19249", "category": "quant-ph", "title": "Adaptive Error Budget Allocation for Fault-Tolerant Quantum Resource Estimation: A Metaheuristic Approach", "abstract": "System-level resource estimation is a key component of fault-tolerant quantum computing (FTQC) toolchains. Its efficiency depends on how global error tolerance is allocated across logical operations, T-state distillation, and rotation synthesis to minimize physical resource overhead. The commonly used uniform-allocation strategy ignores circuit-specific structure and can overprovision inactive or less critical subsystems, leading to inflated space-time estimates. Prior work aims to address this limitation using supervised models trained on offline-generated datasets. However, this approach incurs additional data-generation costs and limits deployment flexibility. To overcome these drawbacks, we propose a training-free optimization framework that performs derivative-free search directly on the Azure Quantum Resource Estimator (AQRE), enabling instance-specific error budget allocation for previously unseen circuits without requiring offline training data. To evaluate robustness to optimizer choice, we instantiate the framework with two structurally distinct metaheuristics, simulated annealing and quantum particle swarm optimization. We evaluate our framework across 433 circuits spanning 2 to 91 qubits from 31 families in the MQT Bench suite. Across the benchmark suite, both methods reduce space-time cost by more than 33\\% on average and agree within 1.34\\% points, indicating that the gains are stable across different metaheuristic search strategies. Our analysis further finds that the optimization benefit is driven primarily by error-profile asymmetry rather than circuit scale, and the metric, Gini coefficient of optimized allocation, provides an interpretable diagnostic of expected improvement. Together, these results position adaptive error budget allocation as a system-software optimization layer for FTQC resource estimation pipeline.", "url": "https://arxiv.org/abs/2608.19249", "type": "理论+数值", "summary": "系统级资源估计是容错量子计算（FTQC）工具链的关键组成部分。其效率取决于如何在逻辑操作、T 状态蒸馏和旋转合成之间分配全局容错，以最大限度地减少物理资源开销。常用的统一分配策略忽略了特定于电路的结构，并且可能过度配置不活动或不太关键的子系统，从而导致时空估计过高。之前的工作旨在使用在离线生成的数据集上训练的监督模型来解决这一限制。然而，这种方法会产生额外的数据生成成本并限制部署灵活性。为了克服这些缺点，我们提出了一种免训练优化框架，该框架直接在 Azure 量子资源估计器 (AQRE) 上执行免导数搜索，从而无需离线训练数据即可为以前未见过的电路进行特定于实例的错误预算分配。为了评估优化器选择的鲁棒性，我们使用两种结构不同的元启发法（模拟退火和量子粒子群优化）来实例化框架。\n\n我们评估了 MQT Bench 套件中 31 个系列的 433 个电路，涵盖 2 到 91 个量子位。在整个基准测试套件中，两种方法平均将时空成本降低了 33% 以上，并且一致在 1.34% 以内，这表明不同元启发式搜索策略的收益是稳定的。我们的分析进一步发现，优化收益主要是由误差分布不对称性而不是电路规模驱动的，并且优化分配的基尼系数指标提供了预期改进的可解释诊断。总之，这些结果将自适应误差预算分配定位为 FTQC 资源估计管道的系统软件优化层。", "authors": [{"name": "Asif Akhtab Ronggon"}, {"name": "Tasnuva Farheen"}], "featured_authors": [{"name": "Asif Akhtab Ronggon"}, {"name": "Tasnuva Farheen"}], "author_count": 2}, {"id": "2608.19310", "category": "quant-ph", "title": "Dissipation-enhanced scrambling in the SYK model coupled to a lossy cavity", "abstract": "We study the Yukawa-Sachdev-Ye-Kitaev model, a disordered model of $N$ Majorana fermions and $R=\\gamma N$ bosons in which the bosons are linearly coupled to independent realizations of SYK $p$-body interactions, in the presence of dissipation, modeled by a Lindblad master equation. Motivated by recent proposals for implementing SYK models in quantum simulators, we focus on bosonic leakage at rate $\\kappa$. Initializing the system in the steady state, we analyze the late-time fermionic relaxation rate and the Lyapunov exponent, solving the large-$N$ theory both numerically and for $p$ large, finding a rich landscape of dynamical behaviors. Most notably, the Lyapunov exponent remains positive for every value of $\\kappa$ and, for $p>2$, can even grow as $\\kappa$ increases. The QED case $p=2$, which lies between the fully chaotic regime $p>2$ and the integrable case $p=1$, exhibits special features. We also identify a critical value of the boson-to-fermion ratio $\\gamma_c \\approx 2/p^2$ separating distinct dynamical regimes.", "url": "https://arxiv.org/abs/2608.19310", "type": "理论+数值", "summary": "我们研究了 Yukawa-Sachdev-Ye-Kitaev 模型，这是 $N$ 马约拉纳费米子和 $R=\\gamma N$ 玻色子的无序模型，其中玻色子线性耦合到 SYK $p$-body 相互作用的独立实现，在存在耗散的情况下，由 Lindblad 主方程建模。受最近在量子模拟器中实施 SYK 模型的提议的推动，我们重点关注 $\\kappa$ 速率的玻色子泄漏。在稳态下初始化系统，我们分析了后期费米子弛豫率和李雅普诺夫指数，在数值上和对于 $p$large 求解了 Large-$N$ 理论，发现了丰富的动态行为景观。最值得注意的是，李亚普诺夫指数对于 $\\kappa$ 的每个值都保持正值，并且对于 $p>2$，甚至可以随着 $\\kappa$ 的增加而增长。 QED 情况 $p=2$ 位于完​​全混沌状态 $p>2$ 和可积情况 $p=1$ 之间，表现出特殊的特征。我们还确定了玻色子与费米子比率 $\\gamma_c \\approx 2/p^2$ 的临界值，以区分不同的动力学状态。", "authors": [{"name": "Pietro Pelliconi"}, {"name": "Bastien Lapierre"}, {"name": "Shinsei Ryu"}], "featured_authors": [{"name": "Pietro Pelliconi"}, {"name": "Bastien Lapierre"}, {"name": "Shinsei Ryu"}], "author_count": 3}, {"id": "2608.19314", "category": "quant-ph", "title": "Proof of the hiding conjecture for Gaussian boson sampling with an arbitrary number of squeezed input modes", "abstract": "Gaussian boson sampling (GBS) is a sampling task proposed to demonstrate quantum advantage. We consider Gaussian boson sampling on $M$ optical modes, with $K$ equally squeezed input modes and $N$ observed photon counts. We complete the proof of the hiding conjecture for Gaussian boson sampling with an arbitrary number of squeezers $K$, which is a part of the argument for classical hardness of GBS. In particular, we show that for any $K$ and $N=o(\\sqrt{K})$, the symmetric product $MK^{-1/2}U_{NK}U_{NK}^T$, for $U_{NK}$ the top left $N\\times K$ submatrix of an $M\\times M$ Haar random unitary $U$, is close in total variation distance to both an $N\\times N$ symmetric complex Gaussian matrix $\\mathbf G$ with independent entries, and the symmetric product $GG^T/\\sqrt{K}$ for $G$ an $N\\times K$ matrix of iid standard complex Gaussians. We show however that the density-based instance generating method of [Aaronson and Arkhipov, Theory Comput. 9, 143 (2013), Lemma 5.8] used to efficiently implement a hiding procedure fails for Gaussian boson sampling with $K=cM$ if $c<1/2$. Instead we use approximate instance generating to implement the hiding for the usual classical hardness reduction.", "url": "https://arxiv.org/abs/2608.19314", "type": "理论", "summary": "高斯玻色子采样（GBS）是为了证明量子优势而提出的采样任务。我们考虑在 $M$ 光学模式上进行高斯玻色子采样，其中 $K$ 同等压缩输入模式和 $N$ 观察到的光子计数。我们用任意数量的压缩器$K$完成了高斯玻色子采样隐藏猜想的证明，这是GBS经典硬度论证的一部分。特别是，我们表明，对于任何 $K$ 和 $N=o(\\sqrt{K})$，对称乘积 $MK^{-1/2}U_{NK}U_{NK}^T$，对于 $U_{NK}$，$M\\times M$ Haar 随机酉 $U$ 的左上 $N\\times K$ 子矩阵在总变异距离上接近于 $N\\times N$ 对称复高斯矩阵$\\mathbf G$ 具有独立条目，以及 $G$ 的对称乘积 $GG^T/\\sqrt{K}$ 和 iid 标准复高斯矩阵的 $N\\times K$ 矩阵。然而，我们展示了[Aaronson 和 Arkhipov，理论计算] 的基于密度的实例生成方法。 9, 143 (2013), 引理 5.8] 用于有效实现隐藏过程的高斯玻色子采样失败，如果 $c<1/2$，则 $K=cM$。相反，我们使用近似实例生成来实现通常的经典硬度降低的隐藏。", "authors": [{"name": "Laura Shou"}, {"name": "Alexey V. Gorshkov"}, {"name": "Victor Galitski"}, {"name": "Sarah H. Miller"}], "featured_authors": [{"name": "Laura Shou"}, {"name": "Alexey V. Gorshkov"}, {"name": "Victor Galitski"}, {"name": "Sarah H. Miller"}], "author_count": 4}, {"id": "2608.19315", "category": "quant-ph", "title": "Thermal Throttling of Quantum State Transfer", "abstract": "Quantum state transfer on qubit lattices is a crucial step in a panoply of quantum information processing tasks. Understanding its fundamental limits in the presence of practical imperfections remains a pressing open question. In particular, it is unclear how thermal noise in the intermediate ancilla sites impedes transfer. In this work, we derive tight lower bounds on the necessary growth of commutator norms to achieve approximate state transfer. Specializing to 1D power-law systems with thermal ancilla states, we demonstrate that state transfer runtimes depend sensitively on the scaling of temperature with system size, improving logarithmic bounds to algebraic ones. Our work extends previous results on exact state transfer to the qualitatively different and more practically relevant regime of approximate state transfer.", "url": "https://arxiv.org/abs/2608.19315", "type": "理论", "summary": "量子位晶格上的量子状态转移是一系列量子信息处理任务中的关键一步。在存在实际缺陷的情况下理解其基本局限性仍然是一个紧迫的悬而未决的问题。特别是，尚不清楚中间辅助位点的热噪声如何阻碍转移。在这项工作中，我们得出了实现近似状态转移所需的交换器规范增长的严格下限。我们专门研究具有热辅助状态的一维幂律系统，证明状态转移运行时间敏感地依赖于温度随系统尺寸的缩放，从而改善了代数范围的对数界限。我们的工作将先前关于精确状态转移的结果扩展到性质不同且更实际相关的近似状态转移制度。", "authors": [{"name": "Twesh Upadhyaya"}, {"name": "T. C. Mooney"}, {"name": "Yifan Hong"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Twesh Upadhyaya"}, {"name": "T. C. Mooney"}, {"name": "Yifan Hong"}, {"name": "Alexey V. Gorshkov"}], "author_count": 4}, {"id": "2608.19336", "category": "quant-ph", "title": "Multipolar Light-Matter Hamiltonians in Symmetry-Breaking Photonic Vacuums", "abstract": "We show that the conventional multipolar Hamiltonian is qualitatively modified when the photonic vacuum breaks inversion or time-reversal symmetry. By explicitly applying the Power-Zienau-Woolley transformation, we derive the resulting multipolar Hamiltonians for two idealized chiral photonic environments: a spatial-chiral vacuum, which breaks inversion symmetry, and a temporal-chiral vacuum, which breaks time-reversal symmetry. In the spatial-chiral case, the transformation generates an inversion-breaking self-energy, whereas in the temporal-chiral case it produces an additional Zeeman-like energy. Using a trapped hydrogen-like atom and a charged harmonic oscillator in cavities as minimal examples, we show that these symmetry-dependent terms lead to characteristic spectral shifts. Our work provides a general framework for describing light-matter interactions in chiral quantum electrodynamics and identifying the associated symmetry-dependent effects on cavity-embedded atoms, molecules, and quantum materials.", "url": "https://arxiv.org/abs/2608.19336", "type": "理论", "summary": "我们证明，当光子真空打破反演或时间反转对称性时，传统的多极哈密顿量会被定性地修改。通过明确应用 Power-Zienau-Woolley 变换，我们得出了两个理想化手性光子环境的多极哈密顿量：空间手性真空（打破反演对称性）和时间手性真空（打破时间反转对称性）。在空间手性情况下，该变换产生一种破坏反转的自能，而在时间手性情况下，它产生额外的类塞曼能量。使用空腔中捕获的类氢原子和带电谐振子作为最小示例，我们表明这些对称性相关项会导致特征光谱偏移。我们的工作提供了一个通用框架，用于描述手性量子电动力学中的光与物质相互作用，并识别对空腔嵌入原子、分子和量子材料的相关对称性相关效应。", "authors": [{"name": "Liu Yang"}, {"name": "Jiadu Lin"}, {"name": "Qing-Dong Jiang"}], "featured_authors": [{"name": "Liu Yang"}, {"name": "Jiadu Lin"}, {"name": "Qing-Dong Jiang"}], "author_count": 3}, {"id": "2608.19348", "category": "quant-ph", "title": "Dataflows and Computational Patterns for Hybrid Quantum-Classical Scientific Computing", "abstract": "Hybrid quantum-classical computing has emerged as the dominant paradigm for near-term quantum applications, yet hybrid workflows are typically described by individual algorithms rather than their underlying execution behavior. We introduce the Quantum Execution Locality Framework (QELF), a qualitative framework for characterizing hybrid quantum-classical workflows according to recurring dataflow structures and quantum execution locality, the extent to which computation remains resident on the Quantum Processing Unit (QPU) before host intervention or classical synchronization. From a representative cross-section of applications, QELF identifies five recurring computational patterns with distinct locality characteristics and discusses their implications for communication overhead, workflow organization, and future hybrid computing architectures. By providing a common vocabulary for reasoning about hybrid workloads, QELF establishes a foundation for future quantitative validation and the co-design of algorithms, runtime systems, and hybrid computing architectures.", "url": "https://arxiv.org/abs/2608.19348", "type": "理论+数值", "summary": "混合量子经典计算已成为近期量子应用的主导范例，但混合工作流程通常由单个算法而不是其底层执行行为来描述。我们介绍了量子执行局部性框架（QELF），这是一个定性框架，用于根据循环数据流结构和量子执行局部性来表征混合量子经典工作流程，即在主机干预或经典同步之前计算保留在量子处理单元（QPU）上的程度。 QELF 从应用程序的代表性横截面中识别出五种具有不同局部特征的重复计算模式，并讨论了它们对通信开销、工作流组织和未来混合计算架构的影响。通过提供用于推理混合工作负载的通用词汇表，QELF 为未来的定量验证以及算法、运行时系统和混合计算架构的协同设计奠定了基础。", "authors": [{"name": "Ryan Landfield"}, {"name": "Jordan J. Winetrout"}, {"name": "Michael A. Sandoval"}], "featured_authors": [{"name": "Ryan Landfield"}, {"name": "Jordan J. Winetrout"}, {"name": "Michael A. Sandoval"}], "author_count": 3}, {"id": "2608.19403", "category": "quant-ph", "title": "Rescaled Mandelstam Tamm characterization of discrete time crystal response in a disordered Floquet Ising chain", "abstract": "For pure state unitary dynamics, the Mandelstam Tamm (MT) lower-bound functional compares the endpoint Fubini Study return angle with path averaged energy dispersion. Their distinct size and temporal dependences obscure the origin of period two MT structure in discrete time crystal (DTC) like dynamics and its relation to the spin response. For binary Floquet drives, we derive an exact segment resolved MT expression without assuming commuting segment Hamiltonians and apply it to a disordered Floquet Ising chain. Absolute and uniform summability of connected covariances of local energy terms implies an $O(\\sqrt{L})$ upper bound on the path-averaged energy dispersion. Endpoint data for four system sizes are consistent with this leading behavior and support the corresponding rescaling of the MT functional. At a representative point in the finite-size region with a locked spin response, odd and even rescaled MT branches remain separated throughout the $10^2$ period observation window. The return angle alternates strongly, whereas the size-normalized path-averaged energy dispersion shows little discernible parity dependence, indicating that endpoint geometry is the main source of the branch splitting. Across the interacting parameter grid, the period-two MT component has a strong partial Spearman rank correlation with the locked spin response after controlling for pulse error and interaction strength. The rescaled MT functional characterizes the global return geometry of finite-size period-two dynamics and quantifies its association with the locked spin response.", "url": "https://arxiv.org/abs/2608.19403", "type": "理论+数值", "summary": "对于纯态酉动力学，Mandelstam Tamm (MT) 下界泛函将端点 Fubini 研究返回角与路径平均能量色散进行比较。它们独特的尺寸和时间依赖性掩盖了离散时间晶体 (DTC) 类动力学中第二周期 MT 结构的起源及其与自旋响应的关系。对于二进制 Floquet 驱动器，我们在不假设通勤段哈密顿量的情况下推导了精确的段解析 MT 表达式，并将其应用于无序的 Floquet Ising 链。局部能量项的连通协方差的绝对和均匀可求性意味着路径平均能量色散的上限为 $O(\\sqrt{L})$。四种系统规模的端点数据与这种领先行为一​​致，并支持 MT 功能的相应重新调整。在具有锁定自旋响应的有限大小区域中的代表点，奇数和偶数重新缩放的 MT 分支在整个 $10^2$ 周期观察窗口中保持分离。\n\n返回角强烈交替，而尺寸归一化路径平均能量色散几乎没有显示出明显的奇偶校验依赖性，表明端点几何形状是分支分裂的主要来源。在相互作用的参数网格中，在控制脉冲误差和相互作用强度后，第二周期 MT 分量与锁定自旋响应具有很强的部分斯皮尔曼等级相关性。重新调整的 MT 函数表征了有限大小的二周期动力学的全局返回几何形状，并量化了其与锁定自旋响应的关联。", "authors": [{"name": "Abrar Ahmed Naqash"}, {"name": "Salman Sajad Wani"}, {"name": "Saif Al-Kuwari"}], "featured_authors": [{"name": "Abrar Ahmed Naqash"}, {"name": "Salman Sajad Wani"}, {"name": "Saif Al-Kuwari"}], "author_count": 3}, {"id": "2608.19427", "category": "quant-ph", "title": "Compressibility of genuine multipartite entanglement under the Hadamard map", "abstract": "One of the most counterintuitive effects in the examination of quantum states is the phenomenon of superactivation, which describes the fact that a quantum state, which is useless for a specific task, may become useful when one considers multiple copies of it. This effect can be observed in the case of genuine multipartite entanglement, where local projections from multiple copies to the single-copy Hilbert space could significantly simplify the practical accessibility of its superactivation. We investigate how such projections behave in the limit of many copies, using the Hadamard map as an example, and studying different state families. We show that, in this scheme, for a fixed map, an optimal number of copies exists, beyond which the obtained entanglement decreases, highlighting the differences between entanglement distillation and local projection schemes.", "url": "https://arxiv.org/abs/2608.19427", "type": "理论", "summary": "在量子态研究中最违反直觉的效应之一是超激活现象，它描述了这样一个事实：对于特定任务无用的量子态，当人们考虑它的多个副本时可能会变得有用。在真正的多部分纠缠的情况下可以观察到这种效应，其中从多个副本到单副本希尔伯特空间的局部投影可以显着简化其超激活的实际可访问性。我们以哈达玛地图为例，研究了这种投影在许多副本的限制下的表现，并研究了不同的状态族。我们表明，在该方案中，对于固定映射，存在最佳副本数量，超过该数量，获得的纠缠会减少，突出了纠缠蒸馏和局部投影方案之间的差异。", "authors": [{"name": "Klára Baksová"}, {"name": "Lisa T. Weinbrenner"}], "featured_authors": [{"name": "Klára Baksová"}, {"name": "Lisa T. Weinbrenner"}], "author_count": 2}, {"id": "2608.19448", "category": "quant-ph", "title": "Efficient Classical Simulation of Weakly Interacting Fermion Dynamics", "abstract": "We consider the task of simulating the real-time dynamics of weakly interacting fermionic systems. In particular, we focus on computing the expectation value of a local observable $A$ at time $t$. By analyzing the convergence of the perturbative expansion in the interaction strength $\\lambda$ for the Heisenberg-picture observable, we propose a polynomial-time algorithm for estimating this expectation value in the weakly interacting regime $\\lambda |t|^{2D+1}=\\mathcal{O}(1)$, when the Hamiltonian is geometrically local on a $D$-dimensional lattice. Importantly, this condition is independent of the system size. If the goal is instead to approximate the time-evolved observable in normalized Frobenius norm, we extend the convergence regime to $\\lambda |t|=\\mathcal{O}(1)$ with quasi-polynomial runtime. When the non-interacting part exhibits Anderson localization, our polynomial-time algorithm can be extended up to $\\lambda |t|=\\mathcal{O}(1)$, modulo polylogarithmic factors. Our algorithm brings together ideas from continuous-time QMC, diagrammatic QMC, and Majorana Propagation, but with a new Heisenberg-picture operator-growth analysis that makes the sampling complexity rigorously controllable. This leads to provably efficient classical algorithms in regimes where the interaction is weak enough that the sampling variance remains bounded independently of system size. Together, these results identify broad regimes in which weak interactions, locality, and localization can be leveraged to make real-time fermionic dynamics classically tractable.", "url": "https://arxiv.org/abs/2608.19448", "type": "理论+数值", "summary": "我们考虑模拟弱相互作用费米子系统的实时动力学的任务。特别是，我们专注于计算局部可观测值 $A$ 在时间 $t$ 的期望值。通过分析海森堡图可观相互作用强度 $\\lambda$ 的微扰展开式的收敛性，我们提出了一种多项式时间算法，用于在弱相互作用机制 $\\lambda |t|^{2D+1}=\\mathcal{O}(1)$ 中估计此期望值，此时哈密顿量在 $D$ 维晶格上是几何局部的。重要的是，此条件与系统大小无关。如果目标是在归一化弗罗贝尼乌斯范数中近似随时间演化的可观测量，我们将收敛机制扩展到具有拟多项式运行时间的 $\\lambda |t|=\\mathcal{O}(1)$ 。当非交互部分表现出安德森定位时，我们的多项式时间算法可以扩展到$\\lambda |t|=\\mathcal{O}(1)$，模多对数因子。\n\n我们的算法汇集了连续时间 QMC、图解 QMC 和马约拉纳传播的思想，但采用了新的海森堡图片算子增长分析，使采样复杂度严格可控。这导致在相互作用足够弱以至于采样方差保持独立于系统大小的情况下有效的经典算法。总之，这些结果确定了广泛的机制，在这些机制中，可以利用弱相互作用、局域性和局部化来使实时费米子动力学在经典上易于处理。", "authors": [{"name": "Chu Zhao"}, {"name": "Iman Marvian"}, {"name": "Yu Tong"}], "featured_authors": [{"name": "Chu Zhao"}, {"name": "Iman Marvian"}, {"name": "Yu Tong"}], "author_count": 3}, {"id": "2608.19458", "category": "quant-ph", "title": "Renormalization group ontology in quantum foundations: a non-interacting spin-0 toy model", "abstract": "A realist, anti-psi interpretation of quantum field theory is introduced, based on an expanded ontology that was inspired by the renormalization group. A goal will be to work with a classical non-interacting scalar field \"toy model\" in the canonical ensemble and show that an observer in this expanded ontology, under certain limiting conditions, will see a QFT. The inverse renormalization group (IRG) will be key in both interpreting this expanded ontology and furnishing novel examples of QFTs. This will lead to a definition of Planck's constant that flows as we head towards a fixed point, is expressed in terms of a temperature, and depends on the observer being studied in this expanded ontology. Our hope is that this approach will lead both to insights into quantum foundations and to prescriptions for developing new QFTs.", "url": "https://arxiv.org/abs/2608.19458", "type": "理论", "summary": "基于受重正化群启发的扩展本体论，引入了量子场论的实在论、反 psi 解释。我们的目标是使用规范系综中的经典非相互作用标量场“玩具模型”，并表明该扩展本体中的观察者在某些限制条件下将看到 QFT。逆重整化群 (IRG) 将在解释这一扩展本体论和提供 QFT 的新颖示例方面发挥关键作用。这将导致普朗克常数的定义，当我们走向固定点时，该常数以温度表示，并且取决于在这个扩展本体中研究的观察者。我们希望这种方法既能深入了解量子基础，又能为开发新的 QFT 提供处方。", "authors": [{"name": "Gary Kapilevich"}], "featured_authors": [{"name": "Gary Kapilevich"}], "author_count": 1}, {"id": "2608.19459", "category": "quant-ph", "title": "Is the Quantum-Entangled Universe a Small World?", "abstract": "Partial entanglement may provide enough connections in the universe to satisfy the definition of a small world. To investigate this possibility, we define a network of particles on a given space-like hyper-surface with a long-range link between any two particles that are connected by a chain of exchanged particles involving less than some small maximum number of interactions. Considering the mean free paths of particles in different regions of space and the resulting probability distributions of entanglement connections vs. distance, we find evidence of small-world or random network structure on all but the smallest scales - corresponding to stars and planets - on which other types of connections would need to be added to complete the small world picture.", "url": "https://arxiv.org/abs/2608.19459", "type": "理论", "summary": "部分纠缠可能在宇宙中提供足够的连接以满足小世界的定义。为了研究这种可能性，我们在给定的类空间超表面上定义了一个粒子网络，任何两个粒子之间都有长程链接，这两个粒子通过交换粒子链连接，涉及少于某个小的最大数量的相互作用。考虑到不同空间区域中粒子的平均自由程以及由此产生的纠缠连接与距离的概率分布，我们发现除了最小尺度（对应于恒星和行星）之外的所有尺度上都存在小世界或随机网络结构的证据，在这些尺度上需要添加其他类型的连接来完成小世界图景。", "authors": [{"name": "Gregory S. Duane"}], "featured_authors": [{"name": "Gregory S. Duane"}], "author_count": 1}, {"id": "2608.19489", "category": "quant-ph", "title": "Fast Algorithms for Stoquastic Spin Systems", "abstract": "We establish a general framework for developing fast sampling and counting algorithms for stoquastic spin systems at high temperature. Our framework is based on a rapidly mixing Markov chain for polymer models and a subcritical percolation process for sampling individual polymers. We apply our framework to obtain fast algorithms for approximating the partition function and sampling from the thermal distribution of (1) general stoquastic spin systems, (2) ferromagnetic Heisenberg models, and (3) antiferromagnetic Heisenberg models on bipartite graphs. For the Heisenberg models, we obtain an improved bound on the inverse temperature by using their respective cycle and loop representations.", "url": "https://arxiv.org/abs/2608.19489", "type": "理论+数值", "summary": "我们建立了一个通用框架，用于开发高温下随机自旋系统的快速采样和计数算法。我们的框架基于用于聚合物模型的快速混合马尔可夫链和用于对单个聚合物进行采样的亚临界渗滤过程。我们应用我们的框架来获得快速算法，用于近似配分函数并从二部图上的（1）一般随机自旋系统、（2）铁磁海森堡模型和（3）反铁磁海森堡模型的热分布进行采样。对于海森堡模型，我们通过使用它们各自的循环和循环表示来获得逆温度的改进界限。", "authors": [{"name": "Ryan L. Mann"}], "featured_authors": [{"name": "Ryan L. Mann"}], "author_count": 1}, {"id": "2608.19508", "category": "quant-ph", "title": "Quantum algorithm for differential equations via permutation matrix representation with application to the Burgers equation", "abstract": "We develop a quantum algorithm for solving the dynamics of the nonlinear viscous Burgers equation. We apply the Carleman linearization procedure on the spatially discretized equation, followed by a padding scheme that allows implementation on qubit registers. Existing Carleman-based quantum algorithms commonly formulate the lifted linear differential equation in an oracle model. Here we decompose the padded generator into diagonal masks and reversible arithmetic permutations using the Permutation Matrix Representation (PMR), which we show to be naturally compatible with the Linear Combination of Hamiltonian Simulations (LCHS) algorithm. Under the assumptions required by LCHS - most importantly positive semidefiniteness of the Hermitian part of the linear generator, possibly after a stabilizing shift - the algorithm prepares a normalized quantum state proportional to the solution of the truncated lifted system; the stabilizing shift introduces an exponential postselection overhead, which we quantify and mitigate through a rescaling scheme. We show that our algorithm scales with the off-diagonal norm of the Carleman generator instead of the matrix norm, which can be advantageous for other generators that are diagonally dominant. We also extend the PMR scheme to general fluid equations that may contain higher-order derivatives or nonlinear terms, or may involve multiple fluid variables or spatial dimensions. The construction illustrates how PMR can serve as a convenient Hamiltonian-simulation primitive for a broader class of LCU-based algorithms.", "url": "https://arxiv.org/abs/2608.19508", "type": "理论+数值", "summary": "我们开发了一种量子算法来求解非线性粘性伯格斯方程的动力学。我们对空间离散方程应用卡尔曼线性化过程，然后是允许在量子位寄存器上实现的填充方案。现有的基于卡尔曼的量子算法通常在预言机模型中制定提升的线性微分方程。在这里，我们使用置换矩阵表示（PMR）将填充生成器分解为对角掩码和可逆算术置换，我们证明它与哈密顿模拟线性组合（LCHS）算法自然兼容。在 LCHS 要求的假设下 - 最重要的是线性发生器厄米特部分的正半定性，可能在稳定偏移之后 - 该算法准备与截断提升系统的解成比例的归一化量子态；稳定转变引入了指数级的选择后开销，我们通过重新调整方案来量化和减轻这种开销。\n\n我们证明了我们的算法是根据卡尔曼生成器的非对角范数而不是矩阵范数来缩放的，这对于其他对角占主导地位的生成器来说是有利的。我们还将 PMR 方案扩展到可能包含高阶导数或非线性项，或者可能涉及多个流体变量或空间维度的一般流体方程。该结构说明了 PMR 如何作为更广泛的基于 LCU 的算法的方便的哈密顿模拟原语。", "authors": [{"name": "Hriday Sabharwal"}, {"name": "Amir Kalev"}, {"name": "Itay Hen"}], "featured_authors": [{"name": "Hriday Sabharwal"}, {"name": "Amir Kalev"}, {"name": "Itay Hen"}], "author_count": 3}, {"id": "2608.19519", "category": "quant-ph", "title": "Beyond Integrability Preserving Renormalization-Group Protocol in Non-Hermitian Hamiltonians with Time-Dependent Interaction Strengths", "abstract": "It is well established that in time-dependent quantum systems, integrability preserving time-dependent interaction strengths are identical to the renormalization group (RG) trajectories of the corresponding static model when time `$t$' in the driven model is identified with the logarithm of the cutoff `$\\log\\Lambda$' of the static model. We refer to this integrability preserving driving as the RG protocol. In this work we extend the class of time-dependent integrable models to include non-Hermitian quantum models with time-dependent interaction strengths. Using the recently formulated generalized Bethe ansatz framework [P. R. Pasnoori, Phys. Rev. B 112, L060409 (2025)], we show that the constraints imposed by integrability are more general: The interaction strengths of the static model that flow in the RG follow the respective RG trajectories in the corresponding time-dependent model as described above. In addition, the interaction strengths of the static model that are RG invariant can either be constant or have a specific time-dependence in the corresponding time-dependent model which is constrained by integrability. Thus we establish that in the context of time-dependent non-Hermitian systems, the set of integrability preserving time-dependent strengths is larger than the set corresponding to the RG protocol.", "url": "https://arxiv.org/abs/2608.19519", "type": "理论+数值", "summary": "众所周知，在时间相关的量子系统中，当驱动模型中的时间“$t$”用静态模型的截止值“$\\log\\Lambda$”的对数来识别时，保持时间相关相互作用强度的可积性与相应静态模型的重正化群（RG）轨迹相同。我们将这种可集成性保留驱动称为 RG 协议。在这项工作中，我们扩展了时间相关可积模型的类别，以包括具有时间相关相互作用强度的非厄米量子模型。使用最近制定的广义 Bethe ansatz 框架 [P. R.帕斯努里，物理学家。 Rev. B 112, L060409 (2025)]，我们表明可积性施加的约束更为普遍：在 RG 中流动的静态模型的相互作用强度遵循相应的瞬态模型中各自的 RG 轨迹，如上所述。此外，RG 不变的静态模型的相互作用强度可以是恒定的，也可以在相应的受可积性约束的时间相关模型中具有特定的时间依赖性。\n\n因此，我们确定，在时间相关非厄米系统的背景下，保留时间相关强度的可积性集合大于与 RG 协议相对应的集合。", "authors": [{"name": "Parameshwar R. Pasnoori"}], "featured_authors": [{"name": "Parameshwar R. Pasnoori"}], "author_count": 1}, {"id": "2608.19655", "category": "quant-ph", "title": "Variational Quantum Linear Solver via Block Encoding for the Poisson Equation", "abstract": "We present a variational quantum linear solver (VQLS) for the Poisson equation built on an exact block encoding of the discrete Laplacian, and demonstrate its performance on physically motivated benchmarks. Unlike LCU-based VQLS where the number of distinct circuits required per cost-function evaluation is $\\mathcal{O}(L^2)$, where $L$ is the number of terms in the LCU decomposition of the discrete Laplacian operator, this approach requires only a single circuit for cost evaluation. We further empirically demonstrate that the choice of classical optimizer materially affects where the variational optimization ceases to make progress. The solver is benchmarked on three problems: a Poisson equation with sinusoidal forcing and a steady-state heat conduction problem with a localized Gaussian source, both with Dirichlet boundaries, and the pressure-Poisson equation of a two-dimensional lid-driven cavity flow, in which the solver is invoked once per time step under Neumann boundary conditions.", "url": "https://arxiv.org/abs/2608.19655", "type": "理论+数值", "summary": "我们提出了一种基于离散拉普拉斯精确块编码的泊松方程的变分量子线性求解器（VQLS），并在物理激励基准上展示了其性能。与基于 LCU 的 VQLS 不同，其中每个成本函数评估所需的不同电路的数量为 $\\mathcal{O}(L^2)$，其中 $L$ 是离散拉普拉斯算子的 LCU 分解中的项数，这种方法只需要单个电路进行成本评估。我们进一步凭经验证明，经典优化器的选择会对变分优化停止进展的情况产生重大影响。该求解器以三个问题为基准：具有正弦强迫的泊松方程和具有局域高斯源的稳态热传导问题（均具有狄利克雷边界），以及二维盖驱动腔流的压力泊松方程，其中求解器在诺伊曼边界条件下每个时间步调用一次。", "authors": [{"name": "Viraj Dsouza"}, {"name": "Ayush Singhal"}, {"name": "Alex Khan"}, {"name": "Rut Lineswala"}, {"name": "Abhishek Chopra"}], "featured_authors": [{"name": "Viraj Dsouza"}, {"name": "Ayush Singhal"}, {"name": "Alex Khan"}, {"name": "Rut Lineswala"}, {"name": "Abhishek Chopra"}], "author_count": 5}, {"id": "2608.19679", "category": "quant-ph", "title": "Geometric phase of open paths and a geodesic-selection rule at a level degeneracy", "abstract": "When the control field of a qubit, a polarization state, or a spin-$\\tfrac12$ system is swept through a level degeneracy, its direction traces an open curve on the Bloch sphere whose endpoints are antipodal, and the geodesic rule for the open-path geometric phase becomes ambiguous: infinitely many geodesics close the path, and different closures enclose different solid angles. We resolve this ambiguity in closed form. A coordinate-free monopole connection defines the open-path solid angle $\\Omega[C]$ intrinsically, and displacing the degeneracy by $\\epsilon\\uhat$ closes the path with enclosed solid angle $\\Omega(\\epsilon\\uhat)=\\Omega[C]+2\\alpha+O(\\epsilon)$, where $\\alpha$ is the azimuth of the transverse part of $\\uhat$ measured from the principal normal of the control curve at the crossing. The identity between geometric phase and enclosed solid angle therefore holds for exactly one closing geodesic---the great circle in the osculating plane ($\\alpha=0$)---supplied by the curvature at the degeneracy. Berry's $\\pi$ invariant under reversal of the displacement and the values $\\pm\\pi/2$ under a reflection symmetry follow as corollaries, and the pure-state limit of the finite-temperature Uhlmann phase selects the osculating-plane closure automatically, turning the heuristic closing rules of the open-path literature into a computable prescription.", "url": "https://arxiv.org/abs/2608.19679", "type": "理论", "summary": "当量子位、极化态或自旋-$\\tfrac12$系统的控制场扫过能级简并时，其方向在布洛赫球上追踪一条开放曲线，其端点是对映体，开放路径几何相位的测地线规则变得模糊：无限多个测地线闭合路径，不同的闭合封闭不同的立体角。我们以封闭的形式解决这个歧义。无坐标单极连接本质上定义了开路立体角 $\\Omega[C]$，并通过 $\\epsilon\\uhat$ 置换简并性，以闭合立体角 $\\Omega(\\epsilon\\uhat)=\\Omega[C]+2\\alpha+O(\\epsilon)$ 闭合路径，其中 $\\alpha$ 是从主函数测量的 $\\uhat$ 横向部分的方位角控制曲线在交叉点的法线。因此，几何相位和封闭立体角之间的恒等式恰好适用于一个闭合测地线——密切平面中的大圆 ($\\alpha=0$)——由简并处的曲率提供。\n\n位移反转下的 Berry 的 $\\pi$ 不变量和反射对称下的 $\\pm\\pi/2$ 值作为推论，有限温度 Uhlmann 相的纯态极限自动选择密切平面闭合，将开放路径文献的启发式闭合规则转变为可计算的处方。", "authors": [{"name": "Hyeonseok Yang"}, {"name": "Changsuk Noh"}], "featured_authors": [{"name": "Hyeonseok Yang"}, {"name": "Changsuk Noh"}], "author_count": 2}, {"id": "2608.19685", "category": "quant-ph", "title": "Tight Entropy Contraction of Generalized Quantum Depolarization", "abstract": "We establish upper and lower bounds for relative entropy contraction of generalized quantum depolarizing channels and semigroups. Our bound provides tight first order asymptotic of the contraction rate in terms of the dimension constant. One side estimate are based on sharp reverse ratio and convexity of relative entropy of two states, which can be derived from the recently introduced Hockey-Stick quantum $f$-divergence, and also independently, Bogoliubov--Kubo--Mori quantum Fisher information metric. The other side follows from the existence of index achieving pure state with respect to a general conditional expectation. Our results extend to the complete entropy contraction rate, tensor stable estimates for product dynamics. Examples include quantum depolarization, dephasing, and compact group symmetrization, with consequences for the decay rate of coherence and asymmetry.", "url": "https://arxiv.org/abs/2608.19685", "type": "理论", "summary": "我们建立了广义量子去极化通道和半群的相对熵收缩的上限和下限。我们的界限提供了尺寸常数方面的收缩率的紧一阶渐近。一侧估计基于两个状态的相对熵的锐逆比和凸性，这可以从最近引入的 Hockey-Stick 量子 $f$ 散度导出，也可以独立地从 Bogoliubov--Kubo-Mori 量子 Fisher 信息度量导出。另一面是根据相对于一般条件期望达到纯状态的指标的存在而得出的。我们的结果扩展到完全熵收缩率、产品动力学的张量稳定估计。例子包括量子去极化、移相和紧群对称化，从而导致相干性和不对称性的衰减率。", "authors": [{"name": "Li Gao"}, {"name": "Long Zhao"}], "featured_authors": [{"name": "Li Gao"}, {"name": "Long Zhao"}], "author_count": 2}, {"id": "2608.19694", "category": "quant-ph", "title": "Dissipation-tunable extended and localized steady states in a non-disordered lattice", "abstract": "Dissipation is usually regarded as a source of decoherence that suppresses quantum interference and localization. Here we show that suitably engineered dissipation can instead be used to select localized or extended states in a strictly non-disordered one-dimensional lattice. The underlying clean lattice has spatially inhomogeneous hopping and supports both extended bulk states and localized boundary states, including an algebraically localized bound state in the continuum. We introduce a nonlocal bond jump operator with a tunable relative phase and show that this phase selectively favors eigenstates with different spatial phase correlations. As a result, the long-time density matrix can be steered toward sectors dominated by localized or extended Hamiltonian eigenstates without changing any Hamiltonian parameter. The microscopic origin of the selection is quantified by the fraction of site pairs separated by a distance $l$ that are phase matched with the dissipative channel. We further characterize the dissipative quench through the quantum fidelity and show that the selected character of the steady state can persist after the dissipation is removed. Our results establish phase-selective bond dissipation as a route to controllable state preparation and transport manipulation in non-disordered lattices.", "url": "https://arxiv.org/abs/2608.19694", "type": "理论", "summary": "耗散通常被视为抑制量子干涉和局域化的退相干源。在这里，我们表明，适当设计的耗散可以用来在严格无序的一维晶格中选择局部或扩展状态。底层的干净晶格具有空间不均匀的跳跃，并支持扩展的体态和局域边界态，包括连续体中的代数局域束缚态。我们引入了具有可调相对相位的非局部键跳跃算子，并表明该相位选择性地支持具有不同空间相位相关性的本征态。因此，长时间密度矩阵可以转向由局部或扩展哈密顿本征态主导的扇区，而不改变任何哈密顿参数。选择的微观起源通过与耗散通道相位匹配的相距 $l$ 的位点对的分数来量化。我们通过量子保真度进一步表征耗散失超，并表明在耗散消除后，选定的稳态特征可以持续存在。\n\n我们的结果确立了相选择性键耗散作为非无序晶格中可控状态制备和传输操纵的途径。", "authors": [{"name": "Ming-Jie Tao"}, {"name": "Yi-Ting Wang"}, {"name": "Jing Li"}, {"name": "Hongsheng Hou"}, {"name": "Xiang-Ping Jiang"}, {"name": "Lei Pan"}], "featured_authors": [{"name": "Ming-Jie Tao"}, {"name": "Yi-Ting Wang"}, {"name": "Jing Li"}, {"name": "Hongsheng Hou"}, {"name": "Xiang-Ping Jiang"}, {"name": "Lei Pan"}], "author_count": 6}, {"id": "2608.19770", "category": "quant-ph", "title": "Gradient flow towards quantum states with ideal quantum geometry", "abstract": "We propose a gradient-flow method for quantum states in lattice models, generated by an action consisting of the quantum-metric and the square of the Berry curvature. These two terms drive the spectral projector toward Bogomolny saturation and uniform Berry curvature, respectively. We show that, due to a no-go theorem for finite-dimensional projectors, the two conditions cannot in general be satisfied simultaneously in lattice models. Hence the flow is expected to approach a nontrivial fixed point that balances the two geometric requirements. For the Wilson-Dirac model, we demonstrate that the flowed projector exhibits almost uniform Berry curvature while remaining close to the Bogomolny bound. We further construct a short-range truncated flattened Hamiltonian from the flowed projector and obtain a lattice model with nearly flat bands and nearly uniform Berry curvature. We also apply the method to the Hofstadter model and confirm the roles of the metric and Berry-curvature terms in a Chern band with higher Chern number.", "url": "https://arxiv.org/abs/2608.19770", "type": "理论", "summary": "我们提出了一种用于晶格模型中量子态的梯度流方法，该方法由量子度量和贝里曲率的平方组成的作用生成。这两项分别驱动光谱投影仪趋向博戈莫尔尼饱和度和均匀贝里曲率。我们证明，由于有限维投影仪的不可行定理，这两个条件通常不能在晶格模型中同时满足。因此，预计流量将接近平衡两个几何要求的重要固定点。对于威尔逊-狄拉克模型，我们证明流动投影仪表现出几乎均匀的贝里曲率，同时保持接近博戈莫尔尼边界。我们进一步从流动投影仪构造了一个短程截断平坦哈密顿量，并获得了具有近平能带和近均匀贝里曲率的晶格模型。我们还将该方法应用于 Hofstadter 模型，并确认了度量和 Berry 曲率项在具有较高陈数的陈氏带中的作用。", "authors": [{"name": "T. Shiga"}, {"name": "T. Fukui"}], "featured_authors": [{"name": "T. Shiga"}, {"name": "T. Fukui"}], "author_count": 2}, {"id": "2608.19779", "category": "quant-ph", "title": "An Irreducible Quantum Advantage in Aligning World Models with Reality", "abstract": "World models provide digital simulacra of the true world, allowing agents to be trained and tested before costly real-world deployment. At each time step, they receive an action and generate an observation and reward matching the statistics of the true world. In complex environments where present outcomes depend on events far in the past, this requires memory. One might expect that, by increasing memory, we can always build a model accurately enough to align the optimal agent policies of the real and virtual worlds. We show that this is false for classical world models, even when the true world itself is classical. We construct true worlds for which every finite classical model fails along the same possible trajectory: it either loses the ability to distinguish actions when the true world clearly prefers one, or repeatedly assigns the highest expected reward to suboptimal actions. Its expected-reward estimates also retain a nonvanishing average error. In contrast, each such true world admits a quantum world model using a single qutrit that reproduces it exactly: its reward estimates and preferred actions always match those of the true world, ensuring that the optimal policies of the real and virtual worlds remain perfectly aligned.", "url": "https://arxiv.org/abs/2608.19779", "type": "理论", "summary": "世界模型提供了真实世界的数字模拟，允许在昂贵的现实世界部署之前对代理进行培训和测试。在每个时间步骤，他们都会收到一个动作并生成与真实世界的统计数据相匹配的观察和奖励。在当前结果取决于遥远过去的事件的复杂环境中，这需要记忆。人们可能期望，通过增加内存，我们总是可以足够准确地构建模型来协调现实和虚拟世界的最佳代理策略。我们证明，这对于经典世界模型来说是错误的，即使真实世界本身是经典的。我们构建了真实世界，其中每个有限经典模型都沿着相同的可能轨迹失败：当真实世界明显更喜欢某个动作时，它要么失去区分动作的能力，要么重复地将最高预期奖励分配给次优动作。其预期回报估计也保留了非零平均误差。\n\n相比之下，每个这样的真实世界都承认使用单个 qutrit 的量子世界模型可以准确地再现它：其奖励估计和首选行动始终与真实世界相匹配，从而确保真实世界和虚拟世界的最优策略保持完美一致。", "authors": [{"name": "Josep Lumbreras"}, {"name": "Hailan Ma"}, {"name": "Jayne Thompson"}, {"name": "Mile Gu"}], "featured_authors": [{"name": "Josep Lumbreras"}, {"name": "Hailan Ma"}, {"name": "Jayne Thompson"}, {"name": "Mile Gu"}], "author_count": 4}, {"id": "2608.19787", "category": "quant-ph", "title": "Constant-round quantum advantage in communication complexity for total functions", "abstract": "We show that there exists a total function for which there is a polynomial gap between the randomized and the constant-round quantum communication complexity. Previously, such a separation was known only for quantum protocols using polynomially many rounds.", "url": "https://arxiv.org/abs/2608.19787", "type": "理论", "summary": "我们证明存在一个总函数，其中随机量子通信复杂性和恒定轮量子通信复杂性之间存在多项式差距。此前，这种分离仅适用于使用多项式多轮的量子协议。", "authors": [{"name": "Atsuya Hasegawa"}, {"name": "François Le Gall"}], "featured_authors": [{"name": "Atsuya Hasegawa"}, {"name": "François Le Gall"}], "author_count": 2}, {"id": "2608.19868", "category": "quant-ph", "title": "Resource-Efficient Bio-Molecular Docking on a NISQ-era Digital Quantum Computer", "abstract": "Molecular docking is a vital computational task in drug discovery, wherein the objective is to efficiently identify optimal binding poses between a ligand and a target receptor protein. Due to the combinatorial explosion of possible binding configurations, docking of large and flexible molecules remains a computationally intensive problem, especially at scale. Early studies have revealed that the molecular docking can be re-cast as a maximum vertex-weighted clique problem (MVWCP) problem on a compatibility graph to be solved classically. In this work, we proposed a hybrid quantum-classical approach for molecular docking leveraging the MVWCP formalism with a variational full-basis encoding (FBE) strategy, which enables efficient encoding of classical binary variables with Bloch sphere vectors. We further prove that a global minimizer of the FBE objective can always be chosen to be a pure product state, thereby providing a rigorous justification for its optimization using a unitary variational circuit. The molecular docking problem is first mapped to a cost Hamiltonian that is minimized within a variational framework, optimized via a randomized imaginary time evolution (ITE)-inspired warm start, and gradient-based techniques. Finally, we also executed the circuit on an IBM quantum computer, underlying the feasibility and of quantum-assisted optimization for structure-based drug design and point towards the broader utility of advanced encoding techniques in quantum optimization for computational biology.", "url": "https://arxiv.org/abs/2608.19868", "type": "理论+数值", "summary": "分子对接是药物发现中的一项重要计算任务，其目标是有效识别配体和靶受体蛋白之间的最佳结合姿势。由于可能的结合构型的组合爆炸，大而灵活的分子的对接仍然是一个计算密集型问题，尤其是在规模上。早期研究表明，分子对接可以重新转换为兼容性图上的最大顶点加权团问题（MVWCP）问题，以进行经典解决。在这项工作中，我们提出了一种混合量子经典方法进行分子对接，利用 MVWCP 形式和变分全基编码（FBE）策略，该策略能够使用布洛赫球向量对经典二进制变量进行有效编码。我们进一步证明，FBE 目标的全局最小化器始终可以选择为纯乘积状态，从而为使用酉变分电路进行优化提供了严格的理由。\n\n分子对接问题首先映射到在变分框架内最小化的成本哈密顿量，并通过随机虚数时间演化 (ITE) 启发的热启动和基于梯度的技术进行优化。最后，我们还在 IBM 量子计算机上执行了该电路，为基于结构的药物设计的可行性和量子辅助优化提供了基础，并指出先进编码技术在计算生物学量子优化中的更广泛用途。", "authors": [{"name": "Tianqi Chen"}, {"name": "Adrian M. Mak"}, {"name": "Jianguo Li"}, {"name": "Jian Feng Kong"}, {"name": "Chandra Verma"}, {"name": "Sebastian Maurer-Stroh"}], "featured_authors": [{"name": "Tianqi Chen"}, {"name": "Adrian M. Mak"}, {"name": "Jianguo Li"}, {"name": "Jian Feng Kong"}, {"name": "Chandra Verma"}, {"name": "Sebastian Maurer-Stroh"}], "author_count": 6}, {"id": "2608.19917", "category": "quant-ph", "title": "Disassembling qLDPC codes for depth-optimal parity-check circuits", "abstract": "Quantum low-density parity-check (qLDPC) codes offer a promising route to scalable fault-tolerant quantum computing, but their practical implementation requires efficient circuits for syndrome extraction. Many qLDPC families are assembled from a small set of components through explicit constructions that imprint edge symmetries on their Tanner graphs. We show that these symmetries can be exploited to design syndrome-extraction circuits from the underlying components, rather than from the full quantum code. For Lifted Product and Balanced Product codes this approach yields an analytical construction with provably optimal or near-optimal CNOT depth. For Quantum Tanner codes it produces depth-optimal circuits on every instance we test, including codes up to nearly 600 data qubits.", "url": "https://arxiv.org/abs/2608.19917", "type": "理论", "summary": "量子低密度奇偶校验（qLDPC）码为可扩展的容错量子计算提供了一条有前途的途径，但其实际实现需要高效的电路来进行校正子提取。许多 qLDPC 系列是通过在 Tanner 图上印记边缘对称性的显式构造从一小组组件组装而成的。我们证明，可以利用这些对称性从底层组件而不是从完整的量子代码中设计综合症提取电路。对于提升产品和平衡产品代码，此方法产生具有可证明最佳或接近最佳 CNOT 深度的分析结构。对于 Quantum Tanner 代码，它会在我们测试的每个实例上生成深度优化电路，包括高达近 600 个数据量子位的代码。", "authors": [{"name": "Minh T. P. Nguyen"}, {"name": "Maximilian Rimbach-Russ"}, {"name": "Stefano Bosco"}], "featured_authors": [{"name": "Minh T. P. Nguyen"}, {"name": "Maximilian Rimbach-Russ"}, {"name": "Stefano Bosco"}], "author_count": 3}, {"id": "2608.19943", "category": "quant-ph", "title": "Imaginary time evolution of a quantum system through analytic continuation from real-time quantum simulation", "abstract": "Though quantum computing naturally offers an advantage for simulations of real-time quantum systems, implementing Imaginary-Time Evolution (ITE) is comparatively more difficult. Nevertheless, quantum implementations of ITE are useful both in cases where classical implementations have associated sign problems, and also as an exact method of preparing eigenstates on quantum computers. In this work we present an algorithm to obtain ITE of a generic quantum Hamiltonian by performing analytic continuation of measured real-time correlation functions. We present simulations and demonstrations on IBM quantum hardware of 1D Fokker-Planck equations for classical diffusion process and imaginary-time evolution of integrated correlation functions in 1D quantum mechanical scattering as examples to demonstrate the effectiveness of the method.", "url": "https://arxiv.org/abs/2608.19943", "type": "理论+数值", "summary": "尽管量子计算自然为实时量子系统的模拟提供了优势，但实现虚时演化（ITE）相对更加困难。尽管如此，ITE 的量子实现在经典实现具有相关符号问题的情况下以及作为在量子计算机上准备本征态的精确方法方面都很有用。在这项工作中，我们提出了一种算法，通过对测量的实时相关函数进行分析延拓来获得通用量子哈密顿量的 ITE。我们在 IBM 量子硬件上对经典扩散过程的一维 Fokker-Planck 方程和一维量子力学散射中积分相关函数的虚时间演化进行了模拟和演示，以证明该方法的有效性。", "authors": [{"name": "Peng Guo"}, {"name": "Anto Shibu"}, {"name": "Joshua Lin"}, {"name": "Yong Zhao"}], "featured_authors": [{"name": "Peng Guo"}, {"name": "Anto Shibu"}, {"name": "Joshua Lin"}, {"name": "Yong Zhao"}], "author_count": 4}, {"id": "2608.19945", "category": "quant-ph", "title": "Entangling two qudits of arbitrary dimension through light-atomic Faraday interaction", "abstract": "The paper investigates entangling operations acting on two qudits of arbitrary dimension, with one encoded in the states of a spatially multimode optical field, the other in those of atomic collective spin coherence, both carrying orbital angular momentum (OAM). We demonstrate the generation of a wide range of entangling operations within a protocol consisting of two Faraday interactions and a rotation of atomic and light quadratures between them. All generated gates can be represented as rational powers of the d-dimensional gate $SWAP^{\\alpha}_d$. The probabilities of two-qudit transformations are calculated for various dimensions of the logical space and for different entangling powers of the logical gates.", "url": "https://arxiv.org/abs/2608.19945", "type": "理论", "summary": "该论文研究了作用于任意维度的两个量子的纠缠操作，其中一个以空间多模光场的状态编码，另一个以原子集体自旋相干的状态编码，两者都携带轨道角动量（OAM）。我们演示了在由两个法拉第相互作用以及它们之间的原子和光正交旋转组成的协议中生成各种纠缠操作。所有生成的门都可以表示为 d 维门 $SWAP^{\\alpha}_d$ 的有理幂。针对逻辑空间的各个维度和逻辑门的不同纠缠能力计算二量子体变换的概率。", "authors": [{"name": "R. Surmay"}, {"name": "V.A. Leonov"}, {"name": "E.A. Vashukevich"}], "featured_authors": [{"name": "R. Surmay"}, {"name": "V.A. Leonov"}, {"name": "E.A. Vashukevich"}], "author_count": 3}, {"id": "2608.19988", "category": "quant-ph", "title": "Dynamical one-from-many quantum metrology: Sum rule and matrix-free precision bound", "abstract": "Practical quantum single-parameter estimation is rarely a pristine task; it almost invariably involves nuisance parameters, casting it as a one-from-many problem. Existing approaches to this problem rely on multi-parameter metrology, reducing the matrix quantum Cramér-Rao bound to obtain scalar quantum precision limits. However, these methods are often hampered by the demanding inversion of the quantum Fisher information (QFI) matrix and the requisite choice of a weight matrix, and they break down when the QFI matrix becomes singular. Here, we show that for dynamical one-from-many estimation, a previously overlooked sum rule connecting the QFI about all model parameters to the QFI about time necessitates including the latter to consider an augmented QFI matrix while simultaneously rendering it inherently singular--precisely the scenario where conventional approaches fail. To meet this challenge, we derive a tight, matrix-free quantum precision bound that involves only scalar quantities, offers broad applicability, and subsumes existing results as special cases. Validated in both unitary and noisy settings, our findings provide a refined operational framework for practical quantum single-parameter metrology.", "url": "https://arxiv.org/abs/2608.19988", "type": "理论", "summary": "实用的量子单参数估计很少是一项原始任务。它几乎总是涉及令人讨厌的参数，将其视为一个多中之一的问题。解决这个问题的现有方法依赖于多参数计量学，减少矩阵量子 Cramér-Rao 约束以获得标量量子精度限制。然而，这些方法常常受到量子费希尔信息（QFI）矩阵的要求反转和权重矩阵的必要选择的阻碍，并且当 QFI 矩阵变得奇异时，它们就会崩溃。在这里，我们表明，对于动态一对多估计，之前被忽视的将所有模型参数的 QFI 与有关时间的 QFI 连接起来的总和规则需要包括后者来考虑增强的 QFI 矩阵，同时呈现其固有的奇异性——这正是传统方法失败的情况。为了应对这一挑战，我们得出了一个严格的、无矩阵的量子精度界限，它仅涉及标量，提供广泛的适用性，并将现有结果纳入特殊情况。\n\n我们的研究结果在单一和噪声环境中得到了验证，为实用的量子单参数计量提供了一个完善的操作框架。", "authors": [{"name": "Ziyu Xie"}, {"name": "Junjie Liu"}], "featured_authors": [{"name": "Ziyu Xie"}, {"name": "Junjie Liu"}], "author_count": 2}, {"id": "2608.20050", "category": "quant-ph", "title": "Radial Convex Geometry of Quantum States and Its Relation to Best Separable Approximation", "abstract": "We study bipartite entanglement from the convex geometry of quantum states. Taking the maximally mixed state as a reference point, we define a geometric entangled-space quantity $G(\\rho)=[1-L(\\rho)]/L(\\rho)$ from the relative positions of the separable and quantum-state boundaries, and introduce a relative entanglement degree $Q(\\rho)=[(1-p)/p]/G(\\rho)$ by comparing it with the robustness relative to the maximally mixed state. We apply this geometric construction to the Best Separable Approximation (BSA). For the optimal decomposition, we derive the general bound $(1-p)L_B/[p(1-L_B)]\\leq p_0\\leq Q(\\rho)$ and show that the entangled component of the BSA has an entangled-space size no smaller than that of the original mixed state, namely $[1-L_R]/L_R\\leq[1-L_B]/L_B$. For two-qubit states, the BSA entangled component is a pure entangled state. Using the PPT criterion, its geometric parameter can be evaluated explicitly, giving the bound $(1-p)/(2p)\\leq p_0\\leq Q(\\rho)$. These results provide a simple geometric description of the relation between BSA, robustness, and the entangled region of the quantum-state space.", "url": "https://arxiv.org/abs/2608.20050", "type": "理论+数值", "summary": "我们从量子态的凸几何结构研究二分纠缠。以最大混合态为参考点，从可分离边界和量子态边界的相对位置定义几何纠缠空间量 $G(\\rho)=[1-L(\\rho)]/L(\\rho)$，并通过与相对于最大混合态的鲁棒性进行比较，引入相对纠缠度 $Q(\\rho)=[(1-p)/p]/G(\\rho)$。我们将这种几何构造应用于最佳可分离近似（BSA）。对于最优分解，我们推导了一般界限 $(1-p)L_B/[p(1-L_B)]\\leq p_0\\leq Q(\\rho)$ 并表明 BSA 的纠缠分量的纠缠空间大小不小于原始混合状态的大小，即 $[1-L_R]/L_R\\leq[1-L_B]/L_B$。对于两个量子位态，BSA 纠缠分量是纯纠缠态。使用 PPT 准则，可以显式评估其几何参数，给出边界 $(1-p)/(2p)\\leq p_0\\leq Q(\\rho)$。这些结果为 BSA、鲁棒性和量子态空间的纠缠区域之间的关系提供了简单的几何描述。", "authors": [{"name": "Haonan Qiang"}], "featured_authors": [{"name": "Haonan Qiang"}], "author_count": 1}, {"id": "2608.20063", "category": "quant-ph", "title": "PPT Entanglement with Correlated Catalysis: Monotones and Irreversibility", "abstract": "Quantum catalysts can overcome otherwise impossible quantum state transformations without being consumed, and allowing them to become correlated with the output makes this assistance substantially more powerful. This raises a fundamental question for entanglement theory: which limitations on state manipulat
