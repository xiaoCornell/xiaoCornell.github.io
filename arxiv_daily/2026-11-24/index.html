 remarkably insensitive to the approximation scheme, with differences of only a few percent even at strong coupling. By contrast, the improved approximation substantially improves the description of the Berezinskii-Kosterlitz-Thouless (BKT) transition, reproducing the universal jump of the superfluid density and the critical anomalous dimension to within a few percent. At weak coupling, our results agree very well with classical-field Monte Carlo simulations, while at stronger coupling we observe deviations from classical-field scaling, valid at weak coupling. Our approach thus provides a quantitative description of the thermodynamics and superfluid density across the BKT transition, including in the strong-coupling regime where classical-field methods are no longer reliable.", "url": "https://arxiv.org/abs/2611.30407", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yaniss Rabahi"}, {"name": "Ivan Balog"}, {"name": "Adam Rançon"}], "featured_authors": [{"name": "Yaniss Rabahi"}, {"name": "Ivan Balog"}, {"name": "Adam Rançon"}], "author_count": 3}, {"id": "2611.30474", "category": "cond-mat", "title": "Exact solution of the long-range voter model in arbitrary dimensions: correlations and effective-dimensional scaling", "abstract": "Long-range interactions can profoundly alter collective ordering and critical behavior, yet exact ana- lytical results for non-equilibrium systems with such interactions remain scarce. We obtain an exact analytical solution for the spatial correlation function of the voter model with long-range interac- tions in arbitrary spatial dimension. Starting from the evolution equation for the Fourier modes, we identify the long-wavelength dispersion generated by the interaction kernel and derive the resulting coarsening and stationary scaling regimes. The solution yields the critical condition separating these regimes, the characteristic coarsening length, and the asymptotic decay of stationary correlations. These results establish an exact effective-dimensional correspondence: the long-range model in dimen- sion d, with interaction exponent \\b{eta}, exhibits the same scaling exponents as a short-range voter model in the effective dimension deff = 2d/\\b{eta}. The correspondence holds across the coarsening, marginal, and stationary regimes, while the associated scaling functions need not coincide", "url": "https://arxiv.org/abs/2611.30474", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fabrizio Rippa"}, {"name": "Jacopo Alexander Garofalo"}, {"name": "Giuseppe Petrillo"}, {"name": "Eugenio Lippiello"}], "featured_authors": [{"name": "Fabrizio Rippa"}, {"name": "Jacopo Alexander Garofalo"}, {"name": "Giuseppe Petrillo"}, {"name": "Eugenio Lippiello"}], "author_count": 4}, {"id": "2611.30521", "category": "cond-mat", "title": "Collective order from language models without communication, memory or shared context", "abstract": "Physical matter orders without a centre: units interact only with neighbours, and fluctuations carry them over energy barriers from a locally stable arrangement to the ordered state. We ask whether language-model agents can do the same, treating each memoryless query as a particle that sees its neighbours but cannot communicate, has no identifier or shared context and receives the same question as all others. Such a particle behaves as if at zero temperature: told a rule or a temperature, it returns the most probable state, and a collective can freeze in a local minimum. We therefore give each particle only a goal and a die whose weights it sets itself, and test several models. Some of them use the die as a noise source even at a local optimum, with weights that fall with the energy cost of the move; on a lattice the energy of one of them climbs over barriers and reaches the ground state, where the noise stops by itself. Particles in three-lane counterflow also order, from mixed traffic into one-way lanes: a spontaneous symmetry breaking. Decentralized collective order can thus arise from disorder without communication, memory or shared context, with noise that the particles choose themselves.", "url": "https://arxiv.org/abs/2611.30521", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yong Wang"}], "featured_authors": [{"name": "Yong Wang"}], "author_count": 1}, {"id": "2611.30753", "category": "cond-mat", "title": "Aharonov-Bohm oscillations in transport through interacting quantum dots", "abstract": "We investigate electronic transport through a two-terminal Aharonov-Bohm interferometer with two quantum dots in the presence of finite intra-dot Coulomb interactions. With the help of a diagrammatic technique, we derive, within linear perturbation theory in the tunnelling-coupling strength, analytic expressions for the occupations, current, and interferometric visibility in terms of a coherence measure that involves the sum of four off-diagonal elements of the reduced density matrix. The latter are calculated numerically from a master equation for arbitrary settings of the system parameters. For some symmetric setups, we obtain closed-form expressions for the linear conductance. We systematically analyse the impact of a finite Coulomb interaction on the interferometric visibility, and reveal a rapid suppression of destructive interference upon breaking of system symmetries. Our results are supported by alternative methods, including the TraSPI method.", "url": "https://arxiv.org/abs/2611.30753", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Oliver Oing"}, {"name": "Alexander Hahn"}, {"name": "Jürgen König"}, {"name": "Alfred Hucht"}], "featured_authors": [{"name": "Oliver Oing"}, {"name": "Alexander Hahn"}, {"name": "Jürgen König"}, {"name": "Alfred Hucht"}], "author_count": 4}, {"id": "2611.30758", "category": "cond-mat", "title": "Geometry-controlled clogging and transport mechanisms in confined Y-junctions", "abstract": "We investigate transport and clogging of hard particles in a confined symmetric Y-junction using off-lattice Monte Carlo simulations. The geometry is controlled by the channel width w and a truncation parameter s that modifies the inner vertex. The flow probability exhibits a sharp sigmoidal crossover, defining a characteristic width wc that depends non-monotonically on s. This non-monotonic behavior persists under variations of the transverse Monte Carlo step, although the absolute values of wc change. Microscopic analysis reveals two distinct blocking mechanisms: single-particle obstruction at small truncations and collective arch-like structures at larger truncations. Residence-time statistics and particle-order inversions provide additional evidence of this change in transport dynamics. Our results demonstrate that local modifications of junction geometry can strongly affect clogging and particle transport, even in a minimal model with excluded-volume interactions only.", "url": "https://arxiv.org/abs/2611.30758", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Horacio Javier Diaz Carrera"}, {"name": "Diego J. Pérez-Morelo"}, {"name": "Sergio J. Manzi"}, {"name": "Paulo M. Centres"}], "featured_authors": [{"name": "Horacio Javier Diaz Carrera"}, {"name": "Diego J. Pérez-Morelo"}, {"name": "Sergio J. Manzi"}, {"name": "Paulo M. Centres"}], "author_count": 4}, {"id": "2611.30795", "category": "cond-mat", "title": "Multipartite entanglement structure of crystal quenches", "abstract": "Understanding how entanglement emerges and spreads in out-of-equilibrium quantum many-body systems is a fundamental problem. In this paper, we investigate multipartite entanglement after quantum quenches. In particular, we study the entanglement structure and dynamics of quasiparticle multiplets generated by crystal quenches in the tight-binding chain. We identify zero-configurations for which a multiplet shared between three parties has no irreducible tripartite entanglement---these configurations consist entirely of pairwise distributed bipartite-entangled states. The existence of zero-configurations has important implications on the entanglement structure and dynamics of crystal quenches. For example, we show that it can further delay the production of tripartite entanglement. We build the quasiparticle picture for the Markov gap, and prove that it is a faithful witness of irreducible tripartite entanglement for crystal quenches. We discuss several key aspects of their tripartite entanglement dynamics through the lens of the Markov gap. We confront our results with exact lattice numerics and find perfect agreement in the hydrodynamic regime.", "url": "https://arxiv.org/abs/2611.30795", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Paul Gaudin"}, {"name": "Clément Berthière"}], "featured_authors": [{"name": "Paul Gaudin"}, {"name": "Clément Berthière"}], "author_count": 2}, {"id": "2611.30865", "category": "cond-mat", "title": "Altermagnetism of MnSiN2 and MnGeN2 in a wurtzite-based crystal structure", "abstract": "Based on symmetry analysis, the Pna2_1 wurtzite-based crystal structure with Mn as a magnetic group-II element, MnSiN2 and MnGeN2 belong to the class of altermagnets because spin-up and spin-down Mn in the unit cell are related by rotation or mirror plane type operations rather than inversion or translation. Spin polarized density functional theory calculations and quasiparticle self-consistent (QS) GW calculations support the symmetry analysis and identify the lowest-energy spin configuration as Pna'2_1' in agreement with neutron diffraction data. The altermagnetic band splittings allowed for the three different antiferromagnetic ordering patterns are reported and symmetry analyzed. Additionally, spin wave dispersions, chiral magnon spltting, and Neel temperature estimates from the mean-field and random-phase approximations are provided, as well as calculations of the optical dielectric function using the Bethe-Salpeter Equation method. MnSiN2 exhibits both Wannier-type excitons with N-p to Si-s transition character and charge-transfer Frenkel-type excitons with hole on N-p and electron on Mn-d orbital character.", "url": "https://arxiv.org/abs/2611.30865", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ilteris K. Turan"}, {"name": "Jonathan Agrinya"}, {"name": "Walter R. L. Lambrecht"}], "featured_authors": [{"name": "Ilteris K. Turan"}, {"name": "Jonathan Agrinya"}, {"name": "Walter R. L. Lambrecht"}], "author_count": 3}, {"id": "2611.30910", "category": "cond-mat", "title": "Statistical mechanics of noisy collisions in active matter: Dyson-Landau theory", "abstract": "Active systems and other coarse-grained descriptions are often modeled by generalized dynamics, effective equations of motion that are not bound by the constraints of genuinely microscopic physics. In particular, these equations are generally stochastic on the smallest resolved scale. This poses a challenge to first-principles statistical physics, which usually derives emergent noise on larger scales from deterministic interactions. Here, we show how to systematically incorporate microscopic noise into kinetic theory in the limit of weak noise, i.e., high activity. By means of a Dyson expansion of the noisy free propagator, we derive the leading correction to the Landau kinetic equation for weakly interacting systems. We find that the common practice of combining a deterministic collision integral with the diffusive terms of the Fokker--Planck equation is the correct leading order. For dry aligning active matter, however, the corrections are non-analytic in the noise strength, as nearly parallel particles interact for arbitrarily long times. For noise that acts only during interactions, a minimal model of stochastic interactions, noise and collisions do not decouple: the leading corrections are odd in the coupling strength, partly logarithmically enhanced, and amount to an orientation-dependent effective noise strength. Agent-based simulations confirm the predicted dependence on the sign of the coupling. Even in this minimal model, the effect of noise on collisions can thus not be inferred from symmetry alone.", "url": "https://arxiv.org/abs/2611.30910", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Horst-Holger Boltz"}, {"name": "Max-Robin Schultz"}, {"name": "Thomas Ihle"}], "featured_authors": [{"name": "Horst-Holger Boltz"}, {"name": "Max-Robin Schultz"}, {"name": "Thomas Ihle"}], "author_count": 3}, {"id": "2611.30924", "category": "cond-mat", "title": "Dirac-like bands and weak-field transverse transport in ABA trilayer graphene", "abstract": "The low-energy electronic structure of ABA trilayer graphene is composed of light and heavy electron branches, which can be altered by an out-of-plane displacement field. Here, we show that, depending on the values of Slonczewski-Weiss-McClure parameters, a displacement field can inflict a band edge inversion, for which we identify the inversion conditions. This inversion is accompanied by a reversal of Berry curvature and giant topological magnetic moments at the band edges. In a weak perpendicular magnetic field, those topological magnetic moments produce valley splitting, giving rise to distinct anomalous transverse electrical and thermoelectric responses. These features offer a potential route to detecting the band inversion and constraining several of the least established tight-binding parameters, such as the on-site energy shift for the dimer pair of carbons $\\Delta^\\prime$ and the next neighbour hopping parameters $\\gamma_2$ and $\\gamma_5$.", "url": "https://arxiv.org/abs/2611.30924", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Agustin Montemurro"}, {"name": "Fujia Lu"}, {"name": "Ellis R. Huntley"}, {"name": "Vladimir Fal'ko"}], "featured_authors": [{"name": "Agustin Montemurro"}, {"name": "Fujia Lu"}, {"name": "Ellis R. Huntley"}, {"name": "Vladimir Fal'ko"}], "author_count": 4}, {"id": "2611.30961", "category": "cond-mat", "title": "Donnan Grand Canonical Monte Carlo Simulations with Fast Ewald Summation for Calculating Individual Ionic Chemical Potentials", "abstract": "We present a Donnan Grand Canonical Monte Carlo (GCMC) simulation method using fast Ewald summation to accurately and efficiently calculate the individual ionic excess chemical potentials of $\\alpha_+:\\alpha_-$ electrolyte solutions. By introducing a dynamic inner electrostatic potential that acts to penalize net charge fluctuations and maintain average charge neutrality ($\\langle Q_t \\rangle = 0$), the method enables single-ion GCMC trial moves without sacrificing convergence speed or breaking thermodynamic consistency. Unlike the Widom particle insertion method---which suffers from severe phase-space sampling bottlenecks and requires separate virtual insertions for each ionic species---the Donnan GCMC protocol simultaneously yields the individual excess chemical potentials $\\mu_+^{\\text{ex}}$ and $\\mu_-^{\\text{ex}}$ corresponding to a resulting bulk concentration $c_b$ with rapid numerical convergence. Varying the reference activity parameter $c_r$ allows us to efficiently construct the complete $\\mu_\\pm^{\\text{ex}}(c_b)$ curves. Comparison with the Mean Spherical Approximation (MSA) demonstrates excellent agreement for size-symmetric electrolytes, while highlighting the failure of linear-response theories for size-asymmetric ions where electrostatic correlations and cavity effects become strongly coupled.", "url": "https://arxiv.org/abs/2611.30961", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexandre P. dos Santos"}, {"name": "Amin Bakhshandeh"}, {"name": "Yan Levin"}], "featured_authors": [{"name": "Alexandre P. dos Santos"}, {"name": "Amin Bakhshandeh"}, {"name": "Yan Levin"}], "author_count": 3}, {"id": "2611.30974", "category": "cond-mat", "title": "Interface-Engineered Piezoelectricity and Electromechanical Coupling in Two-Dimensional van der Waals Heterostructures", "abstract": "Interfaces between dissimilar two-dimensional (2D) materials provide a route to engineer electromechanical responses that are not intrinsic to the individual constituent layers. Here, we use high-throughput density functional theory (DFT) calculations to investigate 461 van der Waals heterostructures constructed from 57 2D monolayers and establish a materials-design framework linking work-function mismatch, interfacial charge redistribution, dipole formation, and strain-dependent electromechanical response. We find that heterostructure formation generates out-of-plane interfacial dipoles via charge redistribution between the constituent layers, while biaxial in-plane strain systematically modulates them. The resulting heterostructures exhibit two distinct regimes: metallic interfaces with strain-tunable interfacial dipoles and semiconducting heterostructures with well-defined piezoelectric responses. For the latter, Berry-phase (BP) calculations independently validate the charge-density-difference (CDD) approach, which is generally applicable to all representative systems, with piezoelectric coefficients calculated via two methods agreeing to within 10%. Among 24 selected heterostructures, effective biaxial interfacial electromechanical coefficients reach 83.35 pCm-1 . These results demonstrate that the interface can serve as the active element governing electromechanical coupling and provide a computationally guided strategy for designing strain-tunable out-of-plane electromechanical responses in 2D van der Waals heterostructures.", "url": "https://arxiv.org/abs/2611.30974", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shivanand Yadav"}, {"name": "Raihan Ahammed"}, {"name": "Umer Ali"}, {"name": "B. S. Bhadoria"}, {"name": "Yogesh S. Chauhan"}, {"name": "Amit Agarwal"}, {"name": "Somnath Bhowmick"}], "featured_authors": [{"name": "Shivanand Yadav"}, {"name": "Raihan Ahammed"}, {"name": "Umer Ali"}, {"name": "Yogesh S. Chauhan"}, {"name": "Amit Agarwal"}, {"name": "Somnath Bhowmick"}], "author_count": 7}, {"id": "2611.30992", "category": "cond-mat", "title": "Terahertz detection of magnon chirality in polycrystalline CsCuCl$_3$", "abstract": "In antiferromagnets, the handedness of magnon precession is usually measured on single crystals. In a pressed pellet of the chiral helimagnet CsCuCl$_3$, whose grains carry both structural handednesses and all orientations, we found that, from 5 to 7 T, the sub-terahertz magnon absorbs one circular polarization more than 20 times as strongly as the other, which rules out precession about each grain's own axis. Spin-wave theory attributes this to the Zeeman frequency, here two to four times the exchange-enhanced gap, which locks the precession axis to the field in every grain. Magnon chirality in antiferromagnets is thus accessible without a single crystal.", "url": "https://arxiv.org/abs/2611.30992", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Juan S. Rodríguez-Hernández"}, {"name": "Gabriel F. Freitas"}, {"name": "Nicolas M. Kawahala"}, {"name": "Rafael S. Freitas"}, {"name": "Felix G. G. Hernandez"}], "featured_authors": [{"name": "Juan S. Rodríguez-Hernández"}, {"name": "Gabriel F. Freitas"}, {"name": "Nicolas M. Kawahala"}, {"name": "Rafael S. Freitas"}, {"name": "Felix G. G. Hernandez"}], "author_count": 5}, {"id": "2611.30996", "category": "cond-mat", "title": "Self-consistent Floquet theory of steady-state ordering in driven open systems", "abstract": "Periodically driven open systems have quasienergy bands whose steady-state occupations are set by the drive and reservoir. We formulate a self-consistent Floquet spectral theory of electronic ordering in the weak-reservoir-coupling limit, expressing the nonlinear mean-field equation and the particle-hole response in terms of quasienergies, steady-state occupations, and harmonic matrix elements that account for micromotion. We illustrate the theory in the square-lattice Hubbard model and show how the drive produces `dynamical nesting' conditions and how Floquet resonances produce \\textit{hysteretic} responses due to multiple self-consistent solutions. Interestingly, we find that the hysteresis branches exhibit distinct Floquet topologies. Away from half-filling, we find that the combination of drive-induced detuning of the van Hove saddle points and the micromotion leads to the onset of switching between competing incommensurate orders.", "url": "https://arxiv.org/abs/2611.30996", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Srinjoy Ghosh"}, {"name": "Babak Seradjeh"}, {"name": "Arijit Kundu"}], "featured_authors": [{"name": "Srinjoy Ghosh"}, {"name": "Babak Seradjeh"}, {"name": "Arijit Kundu"}], "author_count": 3}, {"id": "2611.31007", "category": "cond-mat", "title": "Fast-erasure energy-cost lower bound and its first-order correction under restricted control", "abstract": "Determining the minimum work required for information erasure is central to understanding the energetic limits of fast and reliable information processing. In the fast-erasure limit, we derive an explicit expression for this minimum work in a one-dimensional overdamped isothermal system with control restricted to linear and quadratic additions to a reference potential. For symmetric initial distributions at fixed mobility, the minimum work scales inversely with the erasure duration, with a prefactor determined solely by the second moment and a quantile associated with the target success probability. We further derive the leading finite-time correction at a prescribed success probability and verify both analytical predictions numerically. These results provide an analytical benchmark for fast erasure under restricted control, connecting a universal leading cost with finite-time corrections that account for the detailed form of the memory potential.", "url": "https://arxiv.org/abs/2611.31007", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yihang Cai"}, {"name": "Yirong Jiang"}, {"name": "Chenlong Huang"}, {"name": "Yue Liu"}, {"name": "Dahai He"}], "featured_authors": [{"name": "Yihang Cai"}, {"name": "Yirong Jiang"}, {"name": "Chenlong Huang"}, {"name": "Yue Liu"}, {"name": "Dahai He"}], "author_count": 5}, {"id": "2611.31029", "category": "cond-mat", "title": "LeIFF: A localized-electron and ion force field for coupled nuclear and electronic dynamics", "abstract": "Classical and machine-learned interatomic potentials enable large-scale simulations by replacing electronic structure with an effective energy surface for nuclear motion. This excludes electronic dynamics, electronic excitation and energy exchange between electrons and ions. First-principles electron dynamics can describe these processes, but its computational cost restricts system sizes and simulation times. Electron force fields offer an intermediate description by treating electrons as semiclassical dynamical particles interacting with ions. We introduce the localized-electron and ion force field (LeIFF), a compact physical model for both ground state bonding and excited electron dynamics. Valence electrons are represented by spin-labeled spherical charge distributions with dynamical centers and widths. The energy combines analytic electronic kinetic, Coulomb, and dispersion terms with spline-interpolated short-range interactions fitted to a large molecular data set. The resulting energy surface describes a variety of ground state properties across diverse bonding environments and charge states. It also provides a qualitative description of electronic behavior away from equilibrium. It shows improved robustness, accuracy, and transferability relative to earlier electron force-fields. Without any solid-state training, the same model describes dielectric screening and collective electronic response in silicon. LeIFF thus opens a route to large-scale simulations of nonadiabatic processes in molecules and solids, combining chemical bonding and nonequilibrium electronic motion within a common physical framework.", "url": "https://arxiv.org/abs/2611.31029", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anthony Mannino"}, {"name": "Isidro Losada"}, {"name": "Simon Divilov"}, {"name": "Michelle Fritz"}, {"name": "Younos Hashem"}, {"name": "Ashraf Mrabet"}, {"name": "Paula Mori Sánchez"}, {"name": "Javier Junquera"}, {"name": "Mariví Fernández-Serra"}, {"name": "Jose M. Soler"}], "featured_authors": [{"name": "Anthony Mannino"}, {"name": "Isidro Losada"}, {"name": "Simon Divilov"}, {"name": "Javier Junquera"}, {"name": "Mariví Fernández-Serra"}, {"name": "Jose M. Soler"}], "author_count": 10}, {"id": "2611.31093", "category": "cond-mat", "title": "Quantum and classical transport in the underscreened Kondo lattice", "abstract": "We investigate quantum effects in high-spin Kondo-lattice transport as resistivity approaches the classical spin-disorder limit. Using dynamical mean-field theory and the numerical renormalization group, we calculate resistivity, the Seebeck coefficient, and optical conductivity for the paramagnetic single-channel Kondo lattice away from half filling. At intermediate temperatures, the resistivity for large local spin $S$ approaches the double-exchange plateau. Thermopower retains a positive quantum excess even where resistivity is nearly classical. The excess arises from the transport kernel's particle-hole asymmetry. Even the full Kelvin approximation, often accurate for incoherent correlated metals, captures only part of it. Incomplete Kondo screening leaves residual moments and leads to singular Fermi-liquid behavior at low temperatures. For $S=1$, the apparent power-law resistivity is consistent with a $1/\\ln^2(T_\\rho/T)$ asymptote. Above the Kondo scale $T_K$, weak-coupling resistivity follows $1/\\ln^2(T/T_K)$. Above the band and exchange scales, the charge susceptibility decreases as $1/T$, while the effective diffusion constant becomes nearly temperature independent, resulting in linear resistivity. A many-body coherent-potential approximation accounts for the spin dependence of the linear coefficient without adjustable parameters.", "url": "https://arxiv.org/abs/2611.31093", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Leo Pintar"}, {"name": "Don Rolih"}, {"name": "Rok Žitko"}], "featured_authors": [{"name": "Leo Pintar"}, {"name": "Don Rolih"}, {"name": "Rok Žitko"}], "author_count": 3}, {"id": "2611.31102", "category": "cond-mat", "title": "Lincege.jl: LINked Cluster Expansions on a GEneral GEometry", "abstract": "The numerical linked-cluster expansion (NLCE) is a powerful tool for studying properties of quantum lattice models directly in the thermodynamic limit. Here, we introduce this http URL , a versatile, efficient, and easy-to-use package for generating the clusters needed to perform the NLCE on a general finite or infinite lattice. this http URL takes as input only the Bravais lattice vectors, the basis information, and the expansion unit and uses a depth-first search to efficiently generate clusters, their lattice constants, and the sub-cluster information. It outputs final coefficients of the series, expressed in terms of the extensive properties of the clusters, in different orders. The package also contains tools for visualizing the lattice and the generated clusters as well as a classical Ising model solver that can be used as a template for interfacing this http URL with solvers of other lattice models. This package can be installed using the Julia package manager and utilized with example scripts from our GitHub repository at this https URL . The online documentation, including examples, can be found at this https URL .", "url": "https://arxiv.org/abs/2611.31102", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pranav Seetharaman"}, {"name": "Francisco Correia"}, {"name": "Ehsan Khatami"}], "featured_authors": [{"name": "Pranav Seetharaman"}, {"name": "Francisco Correia"}, {"name": "Ehsan Khatami"}], "author_count": 3}, {"id": "2611.31103", "category": "cond-mat", "title": "Self-similar Inequality Dynamics in Biased Competition for a Conserved Resource", "abstract": "In many complex systems the redistribution of a conserved resource can generate strong inequality. Important examples are cities exchanging inhabitants, farms competing for farmland, or agents for wealth in saturated markets. Here we model such systems as agents competing for a fixed total resource, and show that coupling agent extinction to a bias favoring richer agents dynamically amplifies this inequality over time. Drawing on an analogy with emulsions, where droplets compete for a conserved quantity, we introduce a dynamical critical resource size that determines an agent's fate. Crucially, this threshold grows in time, continuously raising the bar for survival and further reinforcing inequality. Increasing the bias strength, we find a transition from a continuous resource concentration towards a winner-takes-all outcome. Furthermore, the case of continuous resource concentration is characterized by a self-similar dynamics accompanied by a power-law or exponential increase in inequality, quantified by the Gini coefficient. We derive these results analytically in a mean-field model and compare them to agent-based simulations, showing excellent agreement.", "url": "https://arxiv.org/abs/2611.31103", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Giacomo Bartolucci"}, {"name": "Jonathan Bauermann"}], "featured_authors": [{"name": "Giacomo Bartolucci"}, {"name": "Jonathan Bauermann"}], "author_count": 2}, {"id": "2611.31206", "category": "cond-mat", "title": "Solute-Aware Stochastic Korhonen Model of Electromigration in Wide vs Near-Bamboo Al-Cu Lines", "abstract": "We couple an evolving Cu field to the one-dimensional Korhonen stress equation on random grain maps for wide (10 $\\mu$m), narrow (3 $\\mu$m) and near-bamboo Al-Cu lines. Earlier random-microstructure simulations fixed the Cu effect, and most continuum solute models used prescribed structures with all Cu mobile; we join the two and let only dissolved Cu move, the excess staying as immobile precipitate. With $10^3$ maps per condition at 200 $^\\circ$C, we report nucleation times and sites, immortal fractions and Black's-law parameters. In cathode-limited lines Cu depletion shortens the median nucleation time 1.15- to 1.20-fold relative to immobile Cu for the cited Cu diffusivity; treating all Cu as mobile overstates this a further 2.24- to 2.36-fold at 2 wt%; the exponent stays near 2. In wide lines with reservoir ends, Cu steps left by the immobile precipitate become the failure sites, removing their Cu-free immortality if a quarter or more of the precipitate blocks Al diffusion. With Cu above the solvus the lifetime is not Arrhenius, as the dissolved fraction rises with temperature: a Black's-law fit at 250 to 300 $^\\circ$C overestimates the median nucleation time at 150 $^\\circ$C up to 2.33-fold at 2 wt% Cu with an exponent near 2. At the test durations the model qualitatively matches the cathode-side damage in narrow lines and the Cu build-up and mid-line peaks in wide lines but not the cathode-side Cu peaks or longer lives of narrow lines.", "url": "https://arxiv.org/abs/2611.31206", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Narahara Chari Dingari"}, {"name": "David R. Heskett"}], "featured_authors": [{"name": "Narahara Chari Dingari"}, {"name": "David R. Heskett"}], "author_count": 2}, {"id": "2611.31234", "category": "cond-mat", "title": "A Fractional Chern Semimetal: Exact Wavefunction and Conformal Criticality", "abstract": "Unlike fractional quantum Hall states in uniform Landau levels, fractional Chern insulators can host dispersive anyon bands, raising the question of what happens when the anyon gap closes. We construct an exact finite-bond-dimension tensor-network state for a fractional Chern semimetal by Gutzwiller projecting a critical parton state. This state exhibits divergent correlation lengths in charged sectors but a fractionally quantized many-body Chern number of $1/3$. Although it has one electron per unit cell, its modular $S$ and $T$ matrices and entanglement spectrum match those of the $\\nu=1/3$ Laughlin state. We identify a $(1+1)$--dimensional $U(3)_1\\times SU(3)_1$ conformal field theory (CFT) governing the wavefunction norm in the infrared, an unexpected result for a state with $U(1)_3$ topology. The $SU(3)_1$ sector is a nonlinear sigma model whose Wess--Zumino level and kinetic stiffness are determined by the parton Chern number and Fubini--Study metric, respectively. Under renormalization, it flows to the conformal fixed point, with an initial distance to this fixed point controlled by the idealness of parton quantum geometry. Favorable geometry enables precise agreement with CFT predictions even on narrow cylinders.", "url": "https://arxiv.org/abs/2611.31234", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fa-Jie Wang"}, {"name": "Yang Qi"}, {"name": "Zhi-Da Song"}], "featured_authors": [{"name": "Fa-Jie Wang"}, {"name": "Yang Qi"}, {"name": "Zhi-Da Song"}], "author_count": 3}, {"id": "2611.28095", "category": "hep-th", "title": "Horizon mergers and initial test-charge acceleration in charged black-hole geometries with anisotropic sources", "abstract": "We study horizon mergers and the initial radial acceleration of charged test particles in static, spherically symmetric black-hole geometries with a string cloud, a Kiselev power-law component, or a logarithmic profile conventionally. After separating the Maxwell contribution, the effective environmental stress tensors are anisotropic and are not identified with homogeneous quintessence or pressureless cold dark matter. Using a common mass-function formulation, we derive the horizon-merger conditions and classify the Kiselev branches. In this family, the inner-event merger charge provides only an upper bound: three distinct positive horizons can additionally require a positive lower charge bound associated with the event-cosmological merger. For a test particle released from rest relative to a static observer, we derive the local charge-to-mass threshold for outward initial acceleration. Writing $\\lambda=q/\\mu$ and $z=Q/Q_{\\rm ext}$, where $Q_{\\rm ext}$ is the inner-event merger charge, the subextremal string-cloud threshold has infimum $1/z$, approached only at infinity. For the subextremal logarithmic profile, the threshold exceeds unity throughout the finite exterior and attains a finite global minimum. For $\\alpha/M=0.4$ and $Q/M=1.2$, this minimum is $\\lambda_*\\simeq1.251125$. In a nondegenerate Kiselev static patch, the neutral balance radius is unique and radially unstable. Density matching supplies conditional profile normalizations, not observational fits. For the logarithmic profile, the integration parameter is distinguished from the mass combination inferred from circular motion. These results characterize geometric horizon bounds and test-particle dynamics; they do not establish a two-black-hole force law or a mechanism for cosmic acceleration, nor do they constitute a test of the Weak Gravity Conjecture.", "url": "https://arxiv.org/abs/2611.28095", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Saeed Noori Gashti"}, {"name": "Mohammad Ali S. Afshar"}, {"name": "Mohammad Reza Alipour"}], "featured_authors": [{"name": "Saeed Noori Gashti"}, {"name": "Mohammad Ali S. Afshar"}, {"name": "Mohammad Reza Alipour"}], "author_count": 3}, {"id": "2611.28203", "category": "hep-th", "title": "Level repulsion and the quantum viscosity of near-extremal black branes", "abstract": "Below the gap scale of the AdS$_2$ throat, quantum fluctuations make the shear viscosity of near-extremal black branes grow as $(CT)^{-1/2}$ in the disk approximation of JT gravity, and the one-loop $\\eta/s$ diverges. To cure this divergence, we include the non-perturbative completion of JT gravity as a matrix integral. The Kubo formula then probes universal features of level correlations. At finite extremal entropy $S_0$, level repulsion makes the DC viscosity vanish. A finite, universal viscosity survives in a double-scaling limit in which the probe frequency $\\omega$ is held in a fixed ratio to the level-spacing scale $\\omega_{\\rm sp}\\equiv e^{-S_0}/C$. At fixed $\\omega$, with $\\omega_{\\rm sp}\\ll\\omega\\ll e^{S_0/3}\\omega_{\\rm sp}$ the Schwarzian growth then saturates at $\\eta_{\\max}\\simeq0.174\\,(\\omega/\\omega_{\\rm sp})\\,\\eta_{sc}$, where $\\eta_{sc}$ is the semiclassical viscosity, and the viscosity decreases at lower temperatures. At the extremely low temperature scale $CT\\sim e^{-2S_0/3}$ the genus expansion and the one-loop entropy computations completely break down. There we start probing the edge of the spectrum and the problem reduces exactly to the Airy kernel. We find that the ratio of the quenched averages of $\\eta$ and $s$ is finite and positive at every non-zero temperature. We compare our results with explicit completions defined by the string equation, in which the spectrum is bounded from below. The bulk results are the same in these completions and the quenched edge results change only by a few per cent, while the annealed quantities depend on the non-perturbative completion at order one.", "url": "https://arxiv.org/abs/2611.28203", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Panos Betzios"}, {"name": "Olga Papadoulaki"}, {"name": "Maria Myrto Pegioudi"}], "featured_authors": [{"name": "Panos Betzios"}, {"name": "Olga Papadoulaki"}, {"name": "Maria Myrto Pegioudi"}], "author_count": 3}, {"id": "2611.28204", "category": "hep-th", "title": "The index from a super-point", "abstract": "We extend the algebro-geometric construction of filtered graded rings that encode both the Higgs branch and the Macdonald index of 4d $\\mathcal{N}=2$ superconformal field theories to theories whose Schur sector contains fermionic generators. The rings are then $\\mathbb{Z}_2$-graded-commutative, and the index is reproduced by the Hilbert series of a generalized arc space, whose defining ideal may contain relations among the generators and their derivatives. We study the free $\\mathcal{N}=2$ vector multiplet, $\\mathcal{N}=4$ super Yang--Mills with gauge algebras $\\mathfrak{su}(2)$ and $\\mathfrak{su}(3)$, the rank-one $\\mathcal{N}=3$ SCFTs, and the $\\widehat{E}_6(SU(2))$ SCFT. For the rank-one $\\mathcal{N}=3$ SCFTs, the ideal is the sum of the Jacobian ideals of a single superpotential and of its two supersymmetry variations. For $\\mathcal{N}=4$ super Yang--Mills, the ideal is similarly the sum of the Jacobian ideals of the components of a single $\\mathcal{N}=4$ superfield, which is a singlet of the $\\mathfrak{su}(2)$ flavor symmetry for gauge algebra $\\mathfrak{su}(2)$, and a triplet for $\\mathfrak{su}(3)$. The associated VOA for the $\\widehat{E}_6(SU(2))$ theory is given by the Feigin--Feigin--Tipunin $\\mathcal{A}(6)$ algebra. The arc space of Zhu's $C_2$-algebra of $\\mathcal{A}(6)$ does not reproduce the vacuum character, and therefore $\\mathcal{A}(6)$ is not classically free. Supplementing Zhu's $C_2$-algebra by three relations in the first jet ring, the generalized arc space reproduces the Macdonald index of $\\widehat{E}_6(SU(2))$ up to, at least, order $q^{51}$.", "url": "https://arxiv.org/abs/2611.28204", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dhanvarsh Annamalai"}, {"name": "Hyunook Hur"}, {"name": "Thomas Hussel"}, {"name": "Monica Jinwoo Kang"}, {"name": "Craig Lawrie"}, {"name": "Jaewon Song"}], "featured_authors": [{"name": "Dhanvarsh Annamalai"}, {"name": "Hyunook Hur"}, {"name": "Thomas Hussel"}, {"name": "Monica Jinwoo Kang"}, {"name": "Craig Lawrie"}, {"name": "Jaewon Song"}], "author_count": 6}, {"id": "2611.28205", "category": "hep-th", "title": "The Gradient Structure of Perturbative RG Flows", "abstract": "Weyl consistency conditions show that perturbative renormalisation group flows in two, four and six dimensions are almost gradient flows. The obstruction is an antisymmetric contribution to the metric on the space of couplings, which has resisted removal since the work of Jack and Osborn more than 35 years ago. We show that a conformal Ward identity on the sphere allows it to be removed by a choice of scheme. The beta function is then the gradient of a potential $A$ with respect to a symmetric metric, to all orders in perturbation theory. The Ward identity gives this result in any dimension $d$, in theories with and without a Weyl anomaly. At leading order the metric is fixed by the two-point functions of the perturbing operators, so unitarity makes it positive definite at weak coupling. At fixed points $A$ equals $\\widetilde{F}=\\sin\\tfrac{\\pi d}{2}\\,\\ln Z_{S^{d}}$, so the $\\widetilde{F}$-theorem follows for perturbative flows to all loop orders. We show that sources of relevant operators, which on the sphere mix with the curvature, do not affect these results. In unitary theories the only exception is the source of a free scalar field near $d=6,10,\\ldots\\,$, so that for $\\phi^3$ theory near six dimensions the gradient property remains open.", "url": "https://arxiv.org/abs/2611.28205", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lorenzo Benfatto"}, {"name": "William H. Pannell"}, {"name": "Andreas Stergiou"}], "featured_authors": [{"name": "Lorenzo Benfatto"}, {"name": "William H. Pannell"}, {"name": "Andreas Stergiou"}], "author_count": 3}, {"id": "2611.28206", "category": "hep-th", "title": "An all-orders proof of gradient flow for multiscalar $ϕ^4$ theory in four dimensions", "abstract": "We prove that the renormalisation group flow of multiscalar $\\phi^4$ theory in four dimensions is a gradient flow to all orders in perturbation theory. The proof uses the Weyl consistency conditions of Osborn and Jack, and it assumes two properties of perturbation theory: that the generating functional with local couplings is finite (also assumed by Osborn and Jack), and that the known expansion of massive Feynman integrals at large momenta holds with a bound on its remainder at each momentum. The consistency conditions give a gradient formula in which the tensor that multiplies the beta function is allowed to have an antisymmetric part, determined by coefficients of the Weyl anomaly. We derive a Ward identity for the two-point function of the marginal operators at constant couplings away from fixed points, with sources for the currents of field rotations and for the mass operator. It re-expresses one of the anti-symmetric contributions in terms of two-point functions and the first moment of the three-point function. We show that, after this rewrite, each of the resulting terms is equivalent to a symmetric contribution to the metric and a contribution to the potential, and we give both explicitly. The metric is positive definite to all orders in perturbation theory. The proof implies in particular the four relations among five- and six-loop coefficients of the field rotation, which Pannell and Stergiou derived as the conditions for a gradient flow at six loops. We check by explicit computation that these relations indeed hold. A companion paper treats $d=4-\\varepsilon$ and other critical dimensions with a Ward identity on the sphere.", "url": "https://arxiv.org/abs/2611.28206", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Marten Reehorst"}], "featured_authors": [{"name": "Marten Reehorst"}], "author_count": 1}, {"id": "2611.28208", "category": "hep-th", "title": "Bring Your Own Instanton: Monopole Catalysis from Sourced SU(2) Instantons", "abstract": "We show that Rubakov-Callan catalysis of proton decay in the field of a 't Hooft-Polyakov monopole proceeds through \"sourced SU(2) instantons\", which are novel topological gauge configurations sourced by fermions and carrying unit instanton number. Unlike vacuum BPST instantons, these sourced instantons do not give rise to exponentially suppressed rates. We relate the winding number to the number of fermionic zero modes, suggesting an underlying index theorem for sourced instantons. We also calculate the closed-form expression for the leading-order correlator for fermion insertions both outside and inside the monopole core. Our results indicate that Rubakov-Callan catalysis is an IR effect where the scattering fermions do not reach the monopole core.", "url": "https://arxiv.org/abs/2611.28208", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Csaba Csáki"}, {"name": "Larissa Kiriliuk"}, {"name": "Zhihan Liu"}, {"name": "Rotem Ovadia"}], "featured_authors": [{"name": "Csaba Csáki"}, {"name": "Larissa Kiriliuk"}, {"name": "Zhihan Liu"}, {"name": "Rotem Ovadia"}], "author_count": 4}, {"id": "2611.28210", "category": "hep-th", "title": "Wormholes do not contribute to supersymmetric partition functions", "abstract": "We show that wormholes connecting multiple asymptotic boundaries always spontaneously break at least some of the symmetries preserved by their boundary conditions. Their configurations then form nontrivial orbits of the broken symmetry, and for the case of a fermionic symmetry, the contribution of each orbit vanishes. We conclude that wormholes do not contribute to moments of supersymmetric partition functions. This extends results on supersymmetric indices by Iliesiu, Kologlu, and Turiaci. We emphasize that supersymmetric partition functions can still have a nonzero ensemble variance. In SYK-like examples that we analyze, this arises due to the contribution of ``non-geometric wormhole'' configurations that preserve all continuous symmetries.", "url": "https://arxiv.org/abs/2611.28210", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jan Boruch"}, {"name": "Douglas Stanford"}], "featured_authors": [{"name": "Jan Boruch"}, {"name": "Douglas Stanford"}], "author_count": 2}, {"id": "2611.28594", "category": "hep-th", "title": "The chiral $M^{3,2}$ theory: partition functions beyond large-$N$ and quantum holography", "abstract": "We identify families of Bethe vacua in the chiral $M^{3,2}$ theory whose individual free energies grow as $N^{3/2}$. High-precision data support closed forms for their all-order perturbative $1/N$ expansions. At a distinguished mixed Chern--Simons coupling, the baryonic magnetic flux distinguishes members of this family of vacua. We also study the three-sphere partition function numerically in the 't Hooft limit and Cardy limit, and propose an all-order Airy formula. The four-derivative and one-loop corrections are precision tests of holography.", "url": "https://arxiv.org/abs/2611.28594", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xuao Zhang"}], "featured_authors": [{"name": "Xuao Zhang"}], "author_count": 1}, {"id": "2611.28735", "category": "hep-th", "title": "Relativistic Hydrodynamics as an Intersection Problem", "abstract": "Ideal relativistic hydrodynamics admits a covariant description as an intersection problem in a symplectic space associated with spacetime. The independent fields are differential forms of degrees 0,1,3,4. Spacetime diffeomorphisms and shifts of the momentum one-form act Hamiltonianly; the zero locus of their moment map is a coisotropic subvariety encoding the transport equations. The spacetime metric and equation of state determine a Lagrangian submanifold, whose intersection with the coisotropic subvariety is precisely the Lichnerowicz--Carter system. We explain the geometric meaning of the canonical flow parameter, derive circulation and Ertel invariants directly from the constraints, and identify energy--momentum conservation with covariance of the constitutive Lagrangian. The nonrelativistic limit and a relation of entropy-level helicity to split Calabi--Yau geometry are briefly indicated.", "url": "https://arxiv.org/abs/2611.28735", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nikita Nekrasov"}, {"name": "Paul Wiegmann"}], "featured_authors": [{"name": "Nikita Nekrasov"}, {"name": "Paul Wiegmann"}], "author_count": 2}, {"id": "2611.28780", "category": "hep-th", "title": "Massive Particles in Carrollian Holography", "abstract": "Understanding how massive particles are encoded in boundary operators is a central problem in Carrollian holography. We construct a three-dimensional Carrollian description of a massive scalar in four-dimensional flat spacetime, together with an explicit bulk-to-boundary integral transform. In this construction, nonzero mass requires infinitely many linearly independent primary states, while the absence of bulk spin imposes relations among their descendants. We show that these relations are equivalent to null-state decoupling and give a local constraint on the boundary fields. The integral transform preserves the full Poincaré symmetry and maps bulk scalar data to fields satisfying this constraint. We also obtain two- and three-point functions and the associated formal operator product expansion coefficients. The integral transform evaluates bulk data at complex momenta, making analytic continuation essential in Lorentzian signature. This construction provides a concrete starting point for relating massive scattering amplitudes to Carrollian correlators and for reconstructing bulk fields from boundary data.", "url": "https://arxiv.org/abs/2611.28780", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bin Chen"}, {"name": "Zezhou Hu"}, {"name": "Reiko Liu"}, {"name": "Wen-Jie Ma"}], "featured_authors": [{"name": "Bin Chen"}, {"name": "Zezhou Hu"}, {"name": "Reiko Liu"}, {"name": "Wen-Jie Ma"}], "author_count": 4}, {"id": "2611.28884", "category": "hep-th", "title": "Thermodynamics of hard wall model of AdS/QCD at finite chemical potential with Gauss-Bonnet corrections", "abstract": "We study the confinement/deconfinement transition of the hard wall model of AdS/QCD at finite quark density in five-dimensional Einstein--Maxwell--Gauss--Bonnet gravity, with the back-reaction of the quark matter on the geometry included. The deconfined phase is a charged Gauss--Bonnet black hole, and the confined phase is thermally charged AdS cut off in the infrared. The infrared value of the gauge field, which Lee, Park and Sin fixed by requiring a consistent quark number, becomes a function of the Gauss--Bonnet coupling. We obtain the transition line in closed form at fixed quark chemical potential and at fixed quark number density. At fixed density the transition passes through a region where the two phases coexist. A negative Gauss--Bonnet coupling raises the transition temperature and extends the confined phase to higher density. A value inside the causality bound gives a transition temperature at zero density close to the lattice value. In the dense confined phase we compute the masses and decay constants of the $\\rho$ meson and its radial excitations. All masses increase with density. A WKB analysis relates the increase to a shorter effective size of the confining region, and at nuclear density the $\\rho$ mass rises by about one percent.", "url": "https://arxiv.org/abs/2611.28884", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dharm Veer Singh"}, {"name": "Shobhit Sachan"}], "featured_authors": [{"name": "Dharm Veer Singh"}, {"name": "Shobhit Sachan"}], "author_count": 2}, {"id": "2611.29000", "category": "hep-th", "title": "Finite-Temperature Stabilization of a KKLT Modulus in Three-Dimensional Lattice Simulations", "abstract": "We investigate the cosmological stabilization of a KKLT modulus through three-dimensional Langevin lattice simulations incorporating an evolving thermal bath, dissipation, spatial gradients, and stochastic fluctuations. While the spatially averaged modulus closely follows homogeneous evolution away from the capture threshold, near-critical trajectories linger near the unstable potential barrier for approximately one e-fold, allowing long-wavelength fluctuations to undergo tachyonic amplification and drive localized regions across the barrier even as the mean field turns back toward the stabilized vacuum. Linear Langevin theory reproduces the fluctuation growth, while convergence tests identify a narrow stochastic layer in which the barrier-crossing fraction shows no systematic dependence on the discretization at a fixed effective distance from the threshold. These results demonstrate that capture of the spatially averaged modulus does not guarantee that every spatial region remains within the stabilizing barrier.", "url": "https://arxiv.org/abs/2611.29000", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Saya Mahmoudi"}, {"name": "Furkan Utku Biber"}, {"name": "Hyukjung Kim"}, {"name": "Heeseung Zoe"}], "featured_authors": [{"name": "Saya Mahmoudi"}, {"name": "Furkan Utku Biber"}, {"name": "Hyukjung Kim"}, {"name": "Heeseung Zoe"}], "author_count": 4}, {"id": "2611.29060", "category": "hep-th", "title": "Exact stress-tensor fluctuations from conformal symmetry and black hole radiation", "abstract": "Semiclassical gravity is sourced by the expectation value of the stress tensor, and it is reliable only if the fluctuations around this value are small. In two dimensions, conformal symmetry captures the essential physics of Hawking radiation in its s-wave sector and determines the mean value exactly, for any background and any quantum state. We show that it also determines the local fluctuations of the null components $T_{\\pm\\pm}$. The square of the stress tensor is defined by the operator product expansion, up to a multiple $\\alpha$ of $\\partial_\\pm^2T_{\\pm\\pm}$ that labels point-splitting prescriptions. Its transformation law under the conformal map to locally inertial coordinates gives the variance in closed form. The relative fluctuation scales as $1/c$, with $c$ the central charge. For the Schwarzschild black hole it is $22/5c$ for the Hawking flux at infinity, that of flat-space thermal radiation. At the horizon it is $-44\\alpha/3c$ for the outgoing flux and $(238+720\\alpha)/5c$ for the ingoing flux that drives the backreaction. Both reduce to $22/5c$ for $\\alpha=-3/10$, which corresponds to the Möbius-covariant prescription. For large $c$ these results support the semiclassical approximation.", "url": "https://arxiv.org/abs/2611.29060", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "José Navarro-Salas"}, {"name": "Roberto Balbinot"}, {"name": "Alessandro Fabbri"}], "featured_authors": [{"name": "José Navarro-Salas"}, {"name": "Roberto Balbinot"}, {"name": "Alessandro Fabbri"}], "author_count": 3}, {"id": "2611.29415", "category": "hep-th", "title": "The Generalized Second Law from Fluctuation Theorems in a Quantum Reference Frame", "abstract": "We prove the generalized second law (GSL) for black-hole exteriors undergoing unitary driving and relaxation on a fixed semifinite algebra. Wall's influential proof assumes semiclassical geometry and restricts fixed parent states to algebras of successive horizon cuts. We instead evolve the state on a fixed dressed exterior algebra. With complete characteristic data, the same semiclassical exterior supports both descriptions, analogous to the Heisenberg and Schrödinger pictures through state--operator duality. Using a gravitational charge as a quantum clock, we construct a modular crossed product with density operators whose trace entropy reproduces generalized entropy up to clock contributions. Our approach parallels thermodynamics in regulated field theory and formulates the GSL through a quantum channel fluctuation theorem (FT) for the open exterior. We develop three complementary formulations under specified dynamical assumptions. Separated unitary driving and relaxation combine modular work, the physical-process first law relating horizon absorption to area gain, and relative-entropy contraction through data processing. A time-local description accommodates simultaneous unitary driving and dissipation. A two-time surprisal FT treats the complete channel, identifies the nonunital correction, and yields a GSL bound for unital dressed evolution without resolving intermediate dynamics. Relaxation that does not mix distinct dressed-charge sectors and preserves the full dressed reference state is unital. Unitality is sufficient for this FT proof but is not necessary for the GSL along a particular evolution. The entropy bounds establish the GSL in a controlled slow-clock limit and quantify finite-width clock corrections.", "url": "https://arxiv.org/abs/2611.29415", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Feng-Li Lin"}, {"name": "Sayid Mondal"}], "featured_authors": [{"name": "Feng-Li Lin"}, {"name": "Sayid Mondal"}], "author_count": 2}, {"id": "2611.29425", "category": "hep-th", "title": "Symmetry resolved spread complexity for BMN matrix model", "abstract": "We investigate the symmetry-resolved spread complexity of the Berenstein-Maldacena-Nastase (BMN) matrix model under a global $U(1)$ symmetry acting within the transverse $SO(6)$ scalar sector. Decomposing the time-evolved charged thermofield double (cTFD) state into orthogonal fixed-charge sectors, we examine the return amplitude, spectral moments, tridiagonal Lanczos coefficients, and early-time spread complexity across the low-temperature confined ($\\beta\\mu \\gg 1$) and finite-temperature deconfined ($T \\gg \\mu$) phases. In the low-temperature gapped regime, effective sector dynamics map onto decoupled, displaced harmonic oscillators with a Casimir-like zero-point offset, yielding factorized moments, linear drift in diagonal Lanczos coefficients $a_n^{(q)}$, and sub-linear $\\sqrt{n}$ off-diagonal growth with thermally suppressed initial hopping. Charge-dependent Boltzmann weights, vacuum shifts, and degeneracies break complexity equipartition, while inter-sector coherence and charge dispersion enforce an early-time positivity bound $\\Delta C(t) = C_{\\text{total}}(t) - \\bar{C}(t) \\ge 0$. In the \\emph{finite}-temperature continuum phase, modeling the planar large-$N$ spectral density as a thermal Gaussian gives constant diagonal coefficients $a_n^{(q)} = \\bar{E}_q$, universal square-root scaling $b_n^{(q)} = \\sigma_E \\sqrt{n}$, and a quadratic spread launch $\\mathcal{C}^{(q)}(t) = \\sigma_E^2(q,T)\\,t^2 + \\mathcal{O}(t^4)$ governed by the backreacted sector energy variance. Holographically, these regimes distinguish coherent string fluctuations in horizonless Lin-Maldacena (LM) droplet geometries from dissipative scrambling near charged ten-dimensional black D0-brane horizons.", "url": "https://arxiv.org/abs/2611.29425", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dibakar Roychowdhury"}], "featured_authors": [{"name": "Dibakar Roychowdhury"}], "author_count": 1}, {"id": "2611.29622", "category": "hep-th", "title": "Scattering amplitudes in AdS$_5\\times$ S$^5$ from the pure spinor superstring", "abstract": "We formulate a BRST-invariant prescription for the integration of zero modes in the pure spinor superstring on $AdS_5\\times S^5$. The measure includes contributions absent in flat space and admits a description in terms of picture changing operators or a non-minimal regulator. The prescription is valid for genus-zero amplitudes with arbitrary multiplicity and external states and removes a central obstacle to amplitude computations in this background. We use it to perform the first direct worldsheet computation of two and three-point amplitudes of half-BPS supergravity states. The properly normalised three-point amplitudes exactly reproduce the results of planar ${\\mathcal N}=4$ super Yang-Mills theory.", "url": "https://arxiv.org/abs/2611.29622", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Luis F. Alday"}, {"name": "Thiago Fleury"}, {"name": "Tobias Hansen"}, {"name": "Lucas N. S. Martins"}, {"name": "Dennis Zavaleta"}], "featured_authors": [{"name": "Luis F. Alday"}, {"name": "Thiago Fleury"}, {"name": "Tobias Hansen"}, {"name": "Lucas N. S. Martins"}, {"name": "Dennis Zavaleta"}], "author_count": 5}, {"id": "2611.29670", "category": "hep-th", "title": "Quadratic-in-spin scattering of compact bodies at fourth post-Minkowskian order", "abstract": "We present the fourth-post-Minkowskian scattering angle of aligned spinning compact bodies through quadratic spin at arbitrary velocity and mass ratio. We include spin-induced quadrupoles and radiation reaction, supplemented by curvature-squared spin-tidal terms. Three-loop worldline integrals yield closed forms in polylogarithms and elliptic integrals. Infrared poles cancel exactly, fixing the tail logarithm. We obtain a new post-Newtonian coefficient and third-order angular-momentum loss for general quadrupoles. The new input shifts resummed predictions for black-hole scattering.", "url": "https://arxiv.org/abs/2611.29670", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Taushif Ahmed"}, {"name": "Syed Mehedi Hasan"}], "featured_authors": [{"name": "Taushif Ahmed"}, {"name": "Syed Mehedi Hasan"}], "author_count": 2}, {"id": "2611.29677", "category": "hep-th", "title": "A note on Holographic Renormalization for Polarized IKKT", "abstract": "We construct a boundary counterterm for the on-shell action of type IIB supergravity solutions dual to vacua of the polarized IKKT matrix model. The construction is based on the variational principle, with off-shell fluctuations whose fall-off conditions are based on the asymptotic equations of motion. The renormalized on-shell action of the supersymmetric saddles reproduces the matrix- model result once we pass to the ensemble of fixed D1-brane charges, which we implement off-shell by dualizing the RR two-form potential.", "url": "https://arxiv.org/abs/2611.29677", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matteo Guglielmetti"}], "featured_authors": [{"name": "Matteo Guglielmetti"}], "author_count": 1}, {"id": "2611.29691", "category": "hep-th", "title": "Infrared finite scattering theory: Non-relativistic Coulomb scattering", "abstract": "We revisit non-relativistic quantum-mechanical scattering in a Coulomb potential. The long-range nature of the interaction leads to divergent integrals in conventional S-matrix calculations using the Born series. Dollard showed that a well-defined scattering operator can be constructed by replacing the free Hamiltonian $ H_0 $ with an appropriate asymptotic Hamiltonian $ H_{\\rm D} $. However, explicit perturbative calculations within Dollard's framework have remained scarce. We develop a perturbative formulation of the Dollard scattering operator in which the Coulomb divergences cancel to all orders. Perturbatively, we demonstrate this cancellation explicitly through second Born order and show that the resulting amplitude reproduces the known exact distributional Coulomb amplitude, including its forward-scattering contribution. With the aim of generalizing our analysis to quantum field theory, we reformulate the problem in the Heisenberg picture. We construct a new set of canonical variables through a time-dependent canonical transformation that removes the logarithmic Coulomb correction from the asymptotic phase-space coordinates. Using these variables, we construct the corresponding Heisenberg S-matrix through several complementary approaches. This leads to a formulation of the Lehmann--Symanzik--Zimmermann (LSZ) reduction formalism adapted to the modified asymptotic dynamics, which we relate to the Dollard scattering operator. This construction provides a framework for extending the LSZ formalism to infrared divergences in relativistic quantum field theories with long-range interactions and massless fields.", "url": "https://arxiv.org/abs/2611.29691", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kartik Prabhu"}, {"name": "Shivam Upadhyay"}], "featured_authors": [{"name": "Kartik Prabhu"}, {"name": "Shivam Upadhyay"}], "author_count": 2}, {"id": "2611.29699", "category": "hep-th", "title": "Bounds on entanglement fluctuations at holographic interfaces", "abstract": "How small can entanglement fluctuations be at fixed entropy? For a class of holographic conformal interfaces supported by a scalar with a potential, we prove $c_\\text{eff}\\leq c_\\text{cap}\\leq c_\\text{eff}^2/c_{LR}$, relating entropy, capacity, and energy transmission. The coupled gravitational response is a transport term minus a positive scalar contribution; the background Einstein equation bounds that subtraction. A long Janus throat allows unbounded capacity at a finite entropy coefficient while the scalar response remains gapped.", "url": "https://arxiv.org/abs/2611.29699", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pallab Basu"}, {"name": "Vishnu Jejjala"}], "featured_authors": [{"name": "Pallab Basu"}, {"name": "Vishnu Jejjala"}], "author_count": 2}, {"id": "2611.29713", "category": "hep-th", "title": "Lie Algebra Cohomology and Seiberg-Witten Theory", "abstract": "We compute the algebra of perturbative holomorphic-topological local operators of pure $\\mathcal N=2$ gauge theory with gauge group $SU(2)$, proving a conjecture of the author: it is the Poisson vertex algebra generated by a Virasoro element $X$ of central charge zero and an odd primary $Y$ of weight three, subject only to $X^2=0$. Equivalently, we compute the relative Lie algebra cohomology $H^*(\\mathfrak{sl}_2[z,w]/(w^2),\\mathfrak{sl}_2)$ and the self-Ext groups of the unit in the coherent Satake category for $SL_2$ and $PGL_2$. The proof uses factorization on configuration spaces of points on the affine line, a depth argument, and two deformations of the coefficient algebra $\\mathbb C[z,w]/(w^2)$.", "url": "https://arxiv.org/abs/2611.29713", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ahsan Z. Khan"}], "featured_authors": [{"name": "Ahsan Z. Khan"}], "author_count": 1}, {"id": "2611.30092", "category": "hep-th", "title": "Boundary spectroscopy of hidden near-horizon reflection", "abstract": "A classical black hole horizon absorbs completely, and any deviation would be hidden in the bulk. For a scalar field in a rotating Bañados-Teitelboim-Zanelli exterior, we derive an exact boundary response of a corotating passive wall near the horizon. An Airy filter gives its spectrum, and positive energy excludes growing modes. On any frequency band the response identifies a constant wall impedance and the wall position, which enter orthogonally with weights determined by the spectral function. The boundary thus sees a reflecting wall, whereas a perfect absorber is exponentially hidden.", "url": "https://arxiv.org/abs/2611.30092", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yiling Chen"}, {"name": "Jiayue Yang"}, {"name": "Zhen Zhong"}, {"name": "Robert B. Mann"}, {"name": "Jie Jiang"}, {"name": "Ming Zhang"}], "featured_authors": [{"name": "Yiling Chen"}, {"name": "Jiayue Yang"}, {"name": "Zhen Zhong"}, {"name": "Robert B. Mann"}, {"name": "Jie Jiang"}, {"name": "Ming Zhang"}], "author_count": 6}, {"id": "2611.30225", "category": "hep-th", "title": "Charged spin-$\\frac32$ in a chiral Feshbach--Villars model: hyperbolic propagation, Landau-level instability, and exceptional points", "abstract": "We study a Pauli-coupled second-order wave equation on $(\\frac32,0)\\oplus(0,\\frac32)$ with a free gyromagnetic ratio $g$. Its Feshbach--Villars form is a sixteen-component pseudo-Hermitian Hamiltonian system with lightlike covariant characteristics in smooth electromagnetic backgrounds. The solution space is chirality doubled; a covariant physical single-species reduction is not assumed. The exact spin-$j$ Landau spectrum remains real at every field strength precisely when $|g|j\\le1$. At $g=2$, the critical spin-$\\frac32$ channel reaches zero at $|qB|=m^2/2$, where each chiral block develops a second-order exceptional point. This threshold also marks the loss of a time-independent positive-definite conserved quadratic form for the channel. We also include a bounded, Gaussian-damped harmonic electrostatic potential and its associated electric field. The complete first-order problem on a degenerate manifold reduces to $V\\pm iC$, with $V$ and $C$ the projected potential and spin--electric coupling. On the lowest two-state spin-$\\frac32$ manifold, nonreal eigenvalue branches arise for $m^2/6<|qB|<m^2/2$ at sufficiently small nonzero perturbation amplitude, except at a special well range where the first-order splitting vanishes. The spin-$\\frac12$, $g=2$ limit satisfies the Dirac spectral-reality check, whereas $g=1/j$ has no imaginary first-order correction for this perturbation. These results separate spectral instability from loss of hyperbolicity; they do not establish a physical fermionic quantization.", "url": "https://arxiv.org/abs/2611.30225", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Haryanto M. Siahaan"}], "featured_authors": [{"name": "Haryanto M. Siahaan"}], "author_count": 1}, {"id": "2611.30296", "category": "hep-th", "title": "Matter-decorated trumpets in double-scaled SYK", "abstract": "In sine-dilaton gravity, the double trumpet, the wormhole amplitude without matter, is obtained by gluing two trumpets along a closed geodesic of discrete length and summing over this length. When the wormhole carries the propagator of a matter field of dimension $\\Delta$, joining the two asymptotic boundaries and crossing the neck, such a gluing is known only in the Jackiw--Teitelboim (JT) limit. We construct the gluing beyond JT in double-scaled SYK (DSSYK), the proposed boundary dual of sine-dilaton gravity, whose disk amplitudes it reproduces. In this context, we adopt the definition of the matter-decorated wormhole in terms of the ETH two-matrix model with Gaussian matter. We build matter-decorated trumpets from an end-of-the-world brane trace with a matter insertion, and prove that the wormhole is glued from them exactly, sector by sector in the number of chords through the neck, with a positive weight that accounts for the twists and windings of these chords and for the closed loops around the neck. Trumpets and weight are obtained in closed form, the former as transforms of Rogers polynomials, and we discuss the uniqueness of the construction. In the JT limit, both reproduce the known gluing separately, and not only in combination. In the classical limit, each trumpet takes the form expected in the bulk: a pure-gravity sine-dilaton trumpet dressed by the factor that a probe matter geodesic contributes at its boundary.", "url": "https://arxiv.org/abs/2611.30296", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matteo Beccaria"}], "featured_authors": [{"name": "Matteo Beccaria"}], "author_count": 1}, {"id": "2611.30337", "category": "hep-th", "title": "Rotating Black Holes from Scaling Transformations in Horava Gravity", "abstract": "We study the scaling transformations that change the physical parameters of solutions in low-energy Horava gravity. In particular, we present a simple scaling transformation that generates rotating black-hole solutions in low-energy Horava gravity from known relativistic solutions. As explicit examples, we obtain \"Doran-like\" and \"Kerr-Schild-like\" rotating solutions in Horava gravity. We find that both solutions are horizon-penetrating, but their null horizons are not Killing horizons. We also find that, although their singularity structures differ from each other, chronology is protected in both solutions, as in the previously obtained Kerr-like solutions in Boyer-Lindquist coordinates.", "url": "https://arxiv.org/abs/2611.30337", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Deniz O. Devecioglu"}, {"name": "Mu-In Park"}], "featured_authors": [{"name": "Deniz O. Devecioglu"}, {"name": "Mu-In Park"}], "author_count": 2}, {"id": "2611.30433", "category": "hep-th", "title": "Darboux transformation for the ASDYM equations: Solitons and instantons", "abstract": "Using a one-fold Darboux transformation for the anti-self-dual Yang--Mills equations, we express the Yang--Mills Lagrangian density in terms of $\\tau$-functions. For solitons constructed from exponential functions, we show that the associated $\\tau$-functions admit a parametrization by arbitrary points in the Grassmannian Gr(N,M;$\\mathbb{C}$), and construct the corresponding Yang--Mills fields. For instantons arising from the Atiyah--Drinfeld--Hitchin--Manin (ADHM) construction, we reinterpret the ADHM construction in terms of a one-fold Darboux transformation, recover Osborn's formula for the Yang--Mills Lagrangian density, and obtain the corresponding gauge connection.", "url": "https://arxiv.org/abs/2611.30433", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shangshuai Li"}], "featured_authors": [{"name": "Shangshuai Li"}], "author_count": 1}, {"id": "2611.30489", "category": "hep-th", "title": "Non-invertible Duality Defects in Four-Dimensional $\\mathbb{Z}_N$ Lattice Gauge Theories", "abstract": "We consider four-dimensional $\\mathbb{Z}_N$ lattice gauge theories with generalized plaquette actions. These theories are known to exhibit dualities. We construct topological interfaces implementing these dualities by assigning a weight to each building block and proving topological invariance. At self-dual couplings, these interfaces become duality defects representing non-invertible symmetries. We also study center symmetry defects and their junctions with the duality interfaces and derive several crossing relations.", "url": "https://arxiv.org/abs/2611.30489", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Satoshi Yamaguchi"}], "featured_authors": [{"name": "Satoshi Yamaguchi"}], "author_count": 1}, {"id": "2611.30567", "category": "hep-th", "title": "Dirichlet walls beyond JT gravity and their quantum group interpretation", "abstract": "We canonically quantize sinh dilaton gravity with finite Dirichlet boundary conditions. The reduced phase space is formulated in terms of the length of a two-sided spacelike geodesic in an effective AdS$_2$ geometry and its conjugate momentum. Canonical quantization leads to a finite-difference Schrödinger equation whose wavefunctions of the universe are given by $q$-hypergeometric functions. These furnish a quantum deformation of the hypergeometric wavefunctions of JT gravity. We further show that the finite cutoff Hamiltonian derived from the bulk analysis admits a natural interpretation as the reduced Casimir of $U_q(\\mathfrak{sl}(2,\\mathbb{R}))$ acting on hyperbolic matrix elements. The two scattering wave solutions are hyperbolic matrix elements of the modular double $U_q(\\mathfrak{sl}(2,\\mathbb R))\\otimes U_{\\tilde q}(\\mathfrak{sl}(2,\\mathbb R))$, and the wavefunction of the universe is their unique combination regular at vanishing length.", "url": "https://arxiv.org/abs/2611.30567", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Luca Griguolo"}, {"name": "Jacopo Papalini"}, {"name": "Lorenzo Russo"}, {"name": "Domenico Seminara"}, {"name": "Alex Tarana"}], "featured_authors": [{"name": "Luca Griguolo"}, {"name": "Jacopo Papalini"}, {"name": "Lorenzo Russo"}, {"name": "Domenico Seminara"}, {"name": "Alex Tarana"}], "author_count": 5}, {"id": "2611.30762", "category": "hep-th", "title": "Conservative tidal effects to third post-Minkowskian order in scalar-tensor theories", "abstract": "Using worldline effective field theory, we compute the conservative finite-size contributions to the impulse and scattering angle of nonspinning compact binaries in massless scalar-tensor theories with a scalar-Gauss-Bonnet coupling through third post-Minkowskian (3PM) order. We retain the full velocity dependence at linear order in the tidal response coefficients. The calculation covers the scalar dipole and quadrupole and the electric, magnetic, and mixed quadrupoles and octupoles. Among them, the scalar dipole enters the dynamics already at third post-Newtonian (3PN) order, two orders before the gravitational quadrupole. At 3PM, the tidal correction to the angle also depends on the first scalar derivatives of the responses and contains terms linear in the Gauss-Bonnet coupling. The results reproduce the general-relativistic tidal angle and the post-Newtonian tidal dynamics through 5PN, and a test-body calculation confirms their leading order in the mass ratio, including the Gauss-Bonnet terms for a companion with vanishing sensitivity.", "url": "https://arxiv.org/abs/2611.30762", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhengwen Liu"}, {"name": "Hongbin Wang"}], "featured_authors": [{"name": "Zhengwen Liu"}, {"name": "Hongbin Wang"}], "author_count": 2}, {"id": "2611.31050", "category": "hep-th", "title": "Gradient formula from the sphere for perturbative RG flows near critical dimensions", "abstract": "We study the gradient property of perturbative renormalisation group flows in $d=d_c-\\varepsilon$, with a potential and a metric regular at $\\varepsilon=0$ up to logarithms of gauge couplings. We state properties of the renormalised functional with local couplings on the sphere $S^d$: finiteness, a local Weyl anomaly, the Ward identity of a conformal Killing vector, rotation properties and statements on the free theory. From them we derive a Ward identity without anomaly for a combination of the functional and its anomaly. Its first variation is a gradient formula whose symmetric metric contains the two-point function on the sphere and whose potential at fixed points is, in an extended form of the properties, proportional to the sphere free energy $\\tilde F$ up to a constant. Sources of relevant operators enter through their Weyl variation, and in a scheme which we construct the gradient formula persists, with a nondegenerate metric if a matrix of the free theory is invertible. For multiscalar $\\phi^4$ theory and for scalars and Dirac fermions with Yukawa and quartic couplings in $d=4-\\varepsilon$, for sextic scalars in $d=3-\\varepsilon$ and for cubic scalars in $d=6-\\varepsilon$, we derive all these properties from a finiteness hypothesis. The gradient formula then holds to all orders for the beta function defined on the sphere. For interacting gauge theories the properties remain assumptions.", "url": "https://arxiv.org/abs/2611.31050", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Marten Reehorst"}], "featured_authors": [{"name": "Marten Reehorst"}], "author_count": 1}, {"id": "2611.31106", "category": "hep-th", "title": "Near-boundary and near-horizon momentum--Krylov response in noncommutative-inspired BTZ spacetime", "abstract": "We compute the proper radial momentum of a massive probe falling into a Lorentzian-smeared, noncommutative-inspired BTZ black hole at fixed asymptotic mass, and use it as the growth rate of momentum--Krylov complexity. In the BTZ limit the accumulated complexity is $\\mathcal{K}_0 = X(\\cosh\\tau - 1)$. With smearing, the initial growth coefficient is $F'_\\alpha(X)/4$, while the late-time exponent is the surface gravity $F'_\\alpha(x_+)/2$. The two depend differently on the smearing parameter, so the deformed response is not a rescaled BTZ curve; we show this analytically and confirm it numerically. For a distant release point the early response a
