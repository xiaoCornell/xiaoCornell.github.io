pproaches BTZ, whereas the late-time rate does not. A BTZ black hole with the same Hawking temperature reproduces the response to within about ten percent, and the remaining difference is set by the early/late mismatch. A Gaussian mass profile gives the same picture. The horizon radius and the surface gravity vanish at the critical smearing with exponents $1/2$ and $3/2$. At fixed mass the boundary stress tensor coincides with that of BTZ, but the $z^3$ Fefferman--Graham coefficient and the lengths of boundary-anchored geodesics do not.", "url": "https://arxiv.org/abs/2611.31106", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "F. A. Brito"}, {"name": "F. G. Costa"}, {"name": "J. A. V. Campos"}], "featured_authors": [{"name": "F. A. Brito"}, {"name": "F. G. Costa"}, {"name": "J. A. V. Campos"}], "author_count": 3}, {"id": "2611.31107", "category": "hep-th", "title": "Electromagnetic Memory as a Collider Observable", "abstract": "Electromagnetic memory and charge correlators are measured by different detectors, sensitive to soft radiation and to hard charged tracks. We show that the Ward identity of large gauge symmetry relates these quantities as inclusive observables. For lepton pairs produced by an electromagnetic current, we compute all massless multipoint memory correlators and the massive two-point function, whose coincident limit gives the soft photon number. The correlators admit a celestial free-boson representation and remain finite at first radiative order, where recoil generates back-to-back Sudakov logarithms.", "url": "https://arxiv.org/abs/2611.31107", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Felipe Diaz"}, {"name": "Hernán A. González"}, {"name": "Oriana Labrin"}, {"name": "Jakob Salzer"}], "featured_authors": [{"name": "Felipe Diaz"}, {"name": "Hernán A. González"}, {"name": "Oriana Labrin"}, {"name": "Jakob Salzer"}], "author_count": 4}, {"id": "2611.31189", "category": "hep-th", "title": "Tensionless M5-brane in light-cone gauge. The spinor moving frame method is wanted", "abstract": "We perform the complete light-cone gauge fixing for the tensionless limit of the M-theory 5-brane the action for which was recently obtained in [1]. The problem of gauge fixing of local fermionic $\\kappa$-symmetry becomes quite nontrivial because the projector of that is constructed from the gauge field strength which in its turn is required to be nonvanaishing and nontrivial in this limit. To resolve this problem the spinor moving frame method has been adapted. The corresponding moving frame is constructed on a vector quadratic in the gauge field strength, which is required to be nonvanishing and nondegenerate in the tensionless limit, and the derivative of the PST (Pasti-Sorokin-Tonin) scalar. The symmetries of the gauge fixed action and equations of motion are briefly discussed. To make a comparison with the case of usual tensionless p-branes (null-p-branes), those which do not carry worldvolume gauge fields, we also elaborate their spinor moving frame formulation.", "url": "https://arxiv.org/abs/2611.31189", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Igor Bandos"}], "featured_authors": [{"name": "Igor Bandos"}], "author_count": 1}, {"id": "2611.31214", "category": "hep-th", "title": "Massive de Sitter correlators at one loop", "abstract": "Fermions and massive fields charged under an unbroken symmetry couple to the inflaton only in pairs, so their signals in primordial correlators begin at one loop. Templates for these signals are mostly late-time estimates. Starting from a representation of massive de Sitter correlators as finite Mellin-Barnes integrals, we compute the exact squeezed coefficients of these signals and their corrections away from the squeezed limit. The leading coefficient factorizes into a hard part and a soft vertex. Late-time estimates treat the hard part exactly but approximate the soft vertex by its late-time limit, whereas we compute both exactly. Without a chemical potential, the exact coefficient differs from the late-time one by a universal factor that depends only on the masses in the loop and the coupling at the soft vertex. For the heavy Standard Model loops, the exact signals are ten to thirty times larger than their late-time estimates. With a chemical potential, the ratio depends on the model, and at our benchmarks it reaches a factor of thirty for helical vectors and about a hundred for the fermion triangle, where we agree with recent exact results. Away from the squeezed limit the leading term soon fails, mainly through a drift in the phase of the oscillation, which we derive for scalar and fermion loops.", "url": "https://arxiv.org/abs/2611.31214", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Amara McCune"}], "featured_authors": [{"name": "Amara McCune"}], "author_count": 1}, {"id": "2611.31232", "category": "hep-th", "title": "Nonabelianization map for the $W_{3,c=2}$ conformal blocks. Part I", "abstract": "This work is inspired by the nonabelianization construction of Virasoro conformal blocks. We start the process of defining the nonabelianization map which expresses $c=2$ $W_3$-algebra conformal blocks on a Riemann surface $C$ from Heisenberg blocks on a branched triple cover $\\tilde{C}$ of $C$. This generalized nonabelianization map uses the datum of a $\\mathfrak{gl}_3$ spectral network on $C$ and we find that this map also depends on the soliton degeneracies corresponding to the spectral network even though the soliton data didn't show up explicitly in the Virasoro case. This nonabelianization construction defines new formulas for $W_3$-algebra conformal blocks on $C$ in terms of fermion correlation functions determined by the Heisenberg blocks on $\\tilde{C}$. We provide a check of the proposed construction associated to the more challenging $(123)$ type branch points which start to show up in three-fold covers. To be more precise, the simplest example that we focus on has only two of the $(123)$ type branch points and we show that in this example, our nonabelianization construction gives the desired two-point correlator and $\\tau$-function.", "url": "https://arxiv.org/abs/2611.31232", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Qianyu Hao"}], "featured_authors": [{"name": "Qianyu Hao"}], "author_count": 1}, {"id": "2611.28296", "category": "math-ph", "title": "A simple counterexample to the Hohenberg-Kohn theorem for excited states", "abstract": "For an even number of non-interacting fermions on the one-dimensional unit torus, a semi-explicit counterexample to the Hohenberg--Kohn theorem for excited states is exhibited. Indeed, for each $n = 2l$, it is shown that there exist constants $m \\in (0, 1)$ and $\\ell > 0$ such that an $n$-body system with the rescaled Lamé potential $v_*(x) = 2m \\ell^2 \\operatorname{sn}^2(\\ell x; m)$ has a simple first excited energy and a first excited-state particle density which is constant on the torus. By translating this potential, we exhibit a non-trivial one-parameter family of potentials, all of which have a constant first excited-state density. As such, the potential-to-density map is not one-to-one in this setting. Under a spectral nonresonance assumption, we obtain the same nonuniqueness at a simple excited energy for odd $n \\geq 3$. We also explore connections to the classification problem of elastica in the plane when $n = 2$, and outline some related questions of interest.", "url": "https://arxiv.org/abs/2611.28296", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dominic Shillingford"}], "featured_authors": [{"name": "Dominic Shillingford"}], "author_count": 1}, {"id": "2611.28328", "category": "math-ph", "title": "Effective Hamiltonians and asymptotic band coupling", "abstract": "By a multiple-scale asymptotic expansion, we derive effective macroscopic models for a large class of tight-binding Schrödinger equations with slow spatial variations. For wave packets that are spectrally localized to some point $(K;E) \\in \\mathbb{R}^d \\times \\mathbb{R}$ in the unperturbed tight-binding dispersion relation, our effective models produce long-time approximations of the tight-binding dynamics, accurate to any prescribed order in the asymptotic parameter. Our framework allows the point $(K;E)$ to be degenerate, meaning that multiple (but not necessarily all) energy bands of the tight-binding Hamiltonian can attain the value $E$ at the frequency $K$. We construct an effective Hamiltonian on the relevant degenerate subspace, which quantifies the coupling between the degenerate and other bands. Several applications and numerical simulations illustrate the theory.", "url": "https://arxiv.org/abs/2611.28328", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Guillaume Bal"}, {"name": "Paul Cazeaux"}, {"name": "Daniel Massatt"}, {"name": "Solomon Quinn"}], "featured_authors": [{"name": "Guillaume Bal"}, {"name": "Paul Cazeaux"}, {"name": "Daniel Massatt"}, {"name": "Solomon Quinn"}], "author_count": 4}, {"id": "2611.28389", "category": "math-ph", "title": "On a class of affine Temperley-Lieb modules", "abstract": "We prove that the class of all affine Temperley-Lieb modules, equipped with the recently introduced \"diagrammatic\" tensor product, forms a quasitensor (i.e. monoidal braided) category. When the Temperley-Lieb parameter $q$ is not a root of unity, we consider the infinite subcategory generated by the simple quotients of reducible standard modules, and we argue that it is a semi-simple ribbon category. We present some evidence that, under the fusion rules and the associativity maps, each simple module in this subcategory is equivalent to a pair of $U_q(sl_2)$ heighest-weight modules.", "url": "https://arxiv.org/abs/2611.28389", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yacine Ikhlef"}], "featured_authors": [{"name": "Yacine Ikhlef"}], "author_count": 1}, {"id": "2611.28444", "category": "math-ph", "title": "Integrable Orbital Exchange between Ellipsoidally Deformed $p$, $d$, and $f$ Electron States: Two-Angle Sklyanin Representations and Fused Elliptic $R$-Matrices", "abstract": "We construct integrable orbital exchange models from ellipsoidally deformed $p$, $d$, and $f$ multiplets. A two-angle realization of the Sklyanin algebra gives explicit Jacobi difference operators $D,L_i$, complete distortion spectra and eigenfunctions, and a positive inner product transported from Sklyanin's integral. In the $p$ sector the coordinate functions carry an exact spin-one action, and applying $D$ componentwise maps the confocal ellipsoid to a sphere. Elliptic fusion gives explicit $R$-matrices in the angular generators on both factors. Their Yang--Baxter relations yield commuting charges and exchange Hamiltonians for homogeneous and alternating chains, as well as mixed-pair interactions that can act between angular degrees of freedom on the same center. Exchange changes angular projections and correlations while preserving the two local Casimirs of each constituent, which fix its angular-momentum-squared and distortion-plus-rotation kinetic-energy invariants. The $p$--$p$ model recovers Fateev's elliptic spin-one interaction and reduces to the Takhtajan--Babujian Hamiltonian in the rational isotropic limit.", "url": "https://arxiv.org/abs/2611.28444", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vladimir Mikhalev"}], "featured_authors": [{"name": "Vladimir Mikhalev"}], "author_count": 1}, {"id": "2611.28480", "category": "math-ph", "title": "An Elasticity Complex for Kirchhoff--Love Shells", "abstract": "We develop an elasticity complex for Kirchhoff--Love shell theory, based on the linearized Gauss--Codazzi equations as compatibility conditions for shell strains. The resulting shell complex forms a fine resolution of the sheaf of infinitesimal rigid motions, so its cohomology groups are determined by the corresponding sheaf cohomology. Remarkably, the complex also reveals an Airy potential representation of equilibrium stress fields. The framework further identifies natural boundary conditions for both kinematic and dynamic variables. Finally, we establish a Hodge--Morrey--Friedrichs decomposition for strain and stress fields on shells with boundary.", "url": "https://arxiv.org/abs/2611.28480", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hang Yin"}, {"name": "Albert Chern"}], "featured_authors": [{"name": "Hang Yin"}, {"name": "Albert Chern"}], "author_count": 2}, {"id": "2611.28743", "category": "math-ph", "title": "Feshbach resonances of the second order in a Friedrichs model", "abstract": "We consider an extended version of the matrix Friedrichs model that may produce Feshbach resonances of the second order. In this model, under enlarging of the coupling constant, a pair of eigenvalues of the unperturbed Hamiltonian embedded into the continuous spectrum first transforms in resonances of the first order. At some moment later on, these two resonances merge into a single resonance but of the second order, and we fix conditions for this event. Being based on the operator interpretation of resonances, we found that, in the case under consideration, the operator roots of the transfer function have a very particular structure.", "url": "https://arxiv.org/abs/2611.28743", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dmitry S. Grudko"}, {"name": "Alexander K. Motovilov"}], "featured_authors": [{"name": "Dmitry S. Grudko"}, {"name": "Alexander K. Motovilov"}], "author_count": 2}, {"id": "2611.28773", "category": "math-ph", "title": "Pauli-consistent ensemble Monte Carlo method for bipolar charge transport in graphene", "abstract": "We develop a Pauli-consistent ensemble Monte Carlo method for bipolar charge transport in graphene, with an explicit treatment of phonon-assisted interband scattering, including electron-hole generation and recombination. The method employs a valence-vacancy representation to describe coupled electron and hole populations without explicitly simulating the highly populated valence band. It preserves the discrete occupation bounds during both free flight and scattering while conserving net charge. The numerical properties of the method are assessed through sensitivity and refinement studies and comparison with an independent deterministic discontinuous Galerkin solution of the same kinetic model. The two approaches show very good agreement for the time evolution, carrier distributions, and steady-state transport observables across the investigated transport regimes. The results also demonstrate the computational practicality of the method for microscopic simulations of bipolar graphene transport.", "url": "https://arxiv.org/abs/2611.28773", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tigran Zalinyan"}, {"name": "Giovanni Nastasi"}], "featured_authors": [{"name": "Tigran Zalinyan"}, {"name": "Giovanni Nastasi"}], "author_count": 2}, {"id": "2611.28992", "category": "math-ph", "title": "Trigonal Elliptic Coordinates on the Sphere and Some Applications", "abstract": "We construct a theta-function parametrization of the unit sphere adapted to the eight trigonal directions. The construction follows from a cubic theta identity discussed by Bobek and admits an equivalent representation in Jacobi elliptic functions. The angular parameter and theta nome give a nonorthogonal coordinate system whose squared Cartesian components are related to the three-component Volterra chain. An algebraic change of angle, retaining the nome, yields orthogonal coordinates with explicit metric coefficients and a diagonal Laplace--Beltrami operator. We apply both parametrizations to the geometry of O'Brien's reduced Jahn--Teller model and give compact expressions for real spherical harmonics of degrees two and three. The orthogonal angle is the polar angle of an $E_g$ quadrupolar doublet, while one octupolar harmonic depends only on the nome within each octant.", "url": "https://arxiv.org/abs/2611.28992", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vladimir Mikhalev"}], "featured_authors": [{"name": "Vladimir Mikhalev"}], "author_count": 1}, {"id": "2611.29005", "category": "math-ph", "title": "Spin-geodesic systems", "abstract": "We introduce and study a class of geometric dynamical systems on Riemannian manifolds called spin-geodesic systems, in which the motion of a point is coupled to an internal classical spin through a symmetric endomorphism field $B$, the spin-coupling field. These systems may be viewed as $B$-dependent deformations of geodesic motion and have connections with frame flows, magnetic geodesic flows, and nonholonomic rolling systems. We show that every spin-geodesic system admits an equivalent interpretation as a no-slip rolling system in an abstract ambient geometry; when the associated metric connection, determined by $B$, is flat, this construction reduces, under the usual integrability hypotheses, to ordinary rolling on a Euclidean hypersurface. Our second main result is a Liouville theorem: for an arbitrary symmetric spin-coupling field B, the spin-geodesic flow preserves the canonical Liouville volume on its mechanical phase space. This holds even though the flow is not symplectic unless $B$ is identically zero.", "url": "https://arxiv.org/abs/2611.29005", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Renato Feres"}, {"name": "Zijie Hu"}], "featured_authors": [{"name": "Renato Feres"}, {"name": "Zijie Hu"}], "author_count": 2}, {"id": "2611.29024", "category": "math-ph", "title": "The marginal sine-Gordon field theory", "abstract": "At $\\beta_*^2=8\\pi$ we construct the two-dimensional sine--Gordon vacuum from a noncompact real lattice field with nearest-neighbor kinetic energy, positive cosine activity and zero Dirichlet data. Its mass $M$ is the lower edge of the energy spectrum above the vacuum. In units of the length $a_{\\rm exit}$ at which the flow leaves weak coupling it obeys $0<c_-\\le M a_{\\rm exit}\\le c_+<\\infty$ on compact positive endpoint intervals, with uniform constants. A prescribed response to a smooth background in a fixed square determines the nonlinear asymptotically free bare parameters at each sufficiently fine cutoff. In the local relativistic continuum theory the vacuum is unique, physical dilation realizes every positive mass, and literal derivatives generate the reflected Hilbert space even for finite composite and contact families. Variance and exponential moments of a derivative smear rule out a Gaussian law. A connected correlation of some finite even order above two is nonzero on separated supports. The construction gives universality for the specified finite nonnegative higher harmonics, the field equation, topological current and geometric stress tensor with their Ward, trace and contact identities, and a normalized source-transfer theorem with explicit finite-scale hypotheses.", "url": "https://arxiv.org/abs/2611.29024", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dyuman Bhattacharya"}], "featured_authors": [{"name": "Dyuman Bhattacharya"}], "author_count": 1}, {"id": "2611.29045", "category": "math-ph", "title": "Path Integrals on Functional Lattices", "abstract": "Path integrals in quantum field theory are commonly approached through finite-dimensional approximations, but existence and regulator independence of the infinite-dimensional limit require separate analysis. We introduce a scheme in which spacetime remains continuous and the field is expanded in a discrete complete family of localized functions, called a functional lattice. Truncation to finite-dimensional functional subspaces yields ordinary finite-dimensional integrals while leaving the continuum differential operator unchanged. For the massive free Euclidean scalar field, we prove convergence of the finite-dimensional covariance operators and normalized generating functionals by a Galerkin argument. The limit is independent of the compatible functional lattice: any sequence of finite-dimensional subspaces dense in the quadratic-form domain converges to the same continuum covariance and generating functional. A direct Minkowski construction is obtained at fixed Feynman regulator $i\\epsilon$, followed by the distributional limit $\\epsilon\\downarrow0$. For interacting theories, each truncation gives an ordinary non-Gaussian integral. At fixed perturbative order, convergence follows when the finite-resolution graph integrands converge pointwise and admit an integrable majorant independent of the functional resolution. Numerical results for one-dimensional $\\phi^4$ theory approach the known first- and second-order mass-gap coefficients, while four-dimensional calculations exhibit the expected mass divergence and logarithmic wave-function renormalization. Thus functional lattices provide a continuum-space approach to path integrals with mathematically controlled limits in the cases considered here.", "url": "https://arxiv.org/abs/2611.29045", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexey A. Kryukov"}], "featured_authors": [{"name": "Alexey A. Kryukov"}], "author_count": 1}, {"id": "2611.29351", "category": "math-ph", "title": "A Novel Algebraic Approach to Medium-Range Solvable Models", "abstract": "We extend Jones' Baxterisation, which produces solutions to the Yang-Baxter equation directly from the generators of an algebra, to quantum spin chains with medium-range interactions. The key ingredient is an extended Yang-Baxter equation for R matrices that are built from the generators attached to two neighbouring sites. Together with the accompanying Lax operator, it gives rise to transfer matrices that are in involution up to boundary terms, exactly as in Jones' construction. We find a solution to the extended Yang-Baxter equation, of non-difference form, in terms of the generators of the chromatic algebra of 3-colouring, and obtain from it two families of medium-range lattice Hamiltonians. Thus, each representation of the algebra provides a medium-range solvable model. Using the relation between the chromatic algebra of 3-colouring and the fusion category $\\mathrm{Rep}(S_3)$, we construct four such representations. They reproduce the folded XXZ model and the hard-rod deformed XXZ model, and give new medium-range models of a three-state antiferromagnet and of a Rydberg-blockade ladder. Two of the four models possess non-invertible symmetries.", "url": "https://arxiv.org/abs/2611.29351", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuan Miao"}, {"name": "Kohei Fukai"}], "featured_authors": [{"name": "Yuan Miao"}, {"name": "Kohei Fukai"}], "author_count": 2}, {"id": "2611.29390", "category": "math-ph", "title": "A thermodynamically consistent variational formulation and structure-preserving finite element methods for non-isothermal liquid--vapor flows with moving contact lines", "abstract": "In this paper, we present a variational formulation and structure-preserving finite element methods for non-isothermal liquid--vapor flows with moving contact lines. Based on the dynamic van der Waals theory with gradient contributions and surface thermodynamics, the governing equations and hydrodynamic boundary conditions are derived from a generalized Hamilton's principle for nonequilibrium thermodynamics. Two equivalent variational formulations based on internal energy and Helmholtz free energy are developed, using entropy density and temperature, respectively, as the primary thermal variable. Using the resulting weak forms, compatible spatial operators and discrete thermodynamic chain rules, we construct two thermodynamically consistent fully discrete finite element schemes. We rigorously prove the following properties for both fully discrete schemes: mass conservation, bound preservation for the number density, positivity of the temperature, an exact total energy balance incorporating external work and heat exchange, and a temperature-weighted weak entropy inequality with nonnegative bulk and boundary entropy production. Numerical experiments in two and three dimensions assess accuracy and structure preservation, with applications to non-isothermal droplet wetting, pool boiling and droplet ejection.", "url": "https://arxiv.org/abs/2611.29390", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Junkai Wang"}, {"name": "Ting Xiao"}, {"name": "Qiaolin He"}], "featured_authors": [{"name": "Junkai Wang"}, {"name": "Ting Xiao"}, {"name": "Qiaolin He"}], "author_count": 3}, {"id": "2611.29420", "category": "math-ph", "title": "Reconstruction and geometry of $4\\times4$ quantum Sudoku", "abstract": "We study the reconstruction and geometry of $4 \\times 4$ quantum Sudoku, viewed as arrays of rank-one projections whose rows, columns and blocks decompose the identity. We give necessary and sufficient conditions for two prescribed opposite blocks to admit a completion, prove its uniqueness, and obtain explicit reconstruction formulas, also expressed in the language of quantum logic. The sixteen overlaps between these blocks determine the unitary equivalence class of the grid, while the number of nonzero overlaps equals its cardinality. Using a matrix representation, we parametrise the equivalence classes by five closed squares, with the sides of one square identified with the diagonals of the other four. The quotient by classical cell symmetries is a closed disc containing exactly two classical classes. Finally, measurement in the basis of the first block gives a fractional Sudoku that retains the full unitary class and is a convex combination of at most four classical grids. This measurement map embeds the five-square model into a seven-dimensional polytope whose vertices are the twelve classical Sudoku.", "url": "https://arxiv.org/abs/2611.29420", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fabio Deelan Cunden"}, {"name": "Paolo Facchi"}, {"name": "Roberto La Scala"}, {"name": "Marilena Ligabò"}, {"name": "Karol Życzkowski"}], "featured_authors": [{"name": "Fabio Deelan Cunden"}, {"name": "Paolo Facchi"}, {"name": "Roberto La Scala"}, {"name": "Marilena Ligabò"}, {"name": "Karol Życzkowski"}], "author_count": 5}, {"id": "2611.29441", "category": "math-ph", "title": "Analytic continuation of the T- and S-matrices to unphysical sheets in a multichannel extension of the Friedrichs-Faddeev model", "abstract": "We consider a matrix multichannel extension of the Friedrichs-Faddeev model. First, we formulate conditions on the kernels of the potential matrix that guarantee for the T-matrix (and then for the S-matrix) the existence of analytical continuation to unphysical energy sheets. We also obtain explicit representations for the analytically continued T- and S-matrices on unphysical sheets in terms of these matrices themselves, but only taken in the physical sheet. From the explicit representations obtained, it follows that the resonances on a certain unphysical sheet are nothing but the points at which the corresponding truncation of the scattering matrix in the physical sheet has an eigenvalue of 0.", "url": "https://arxiv.org/abs/2611.29441", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mikhail V. Kremenetsky"}, {"name": "Alexander K. Motovilov"}], "featured_authors": [{"name": "Mikhail V. Kremenetsky"}, {"name": "Alexander K. Motovilov"}], "author_count": 2}, {"id": "2611.29543", "category": "math-ph", "title": "$μ$- and $q$-extension of special functions in quantum field theory", "abstract": "Analytic calculations up to single-scale quantities in perturbative quantum field theory result into special numbers and functions, which are generalizations as iterative integrals over special alphabets. In this way one obtains polylogarithms, Nielsen integrals, the iterated integrals over linear denominator terms, cyclotomic letters, letters induced by quadratic forms, and square-root valued letters. The inverse Mellin transform relates special nested sums to these quantities, which are harmonic sums, generalized harmonic sums, nested sums implied by quadratic forms, cyclotomic harmonic sums, and nested sums containing central binomials. We construct the $\\mu$- and $q$-extensions of all these special functions. They are expected to occur in loop calculations within $\\mu$- and $q$-extended quantum field theories via modified (anti)commutation relations. The $\\mu$-extended special functions are quite different form the corresponding $q$-extended functions. While in the former case one observes class-preservation characterized by the polynomial $\\mu$-parameter, except for the case of root-valued letters. In the latter case new higher transcendental functions are obtained.", "url": "https://arxiv.org/abs/2611.29543", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "J. Blümlein"}, {"name": "A.M. Gavrilik"}, {"name": "U.Y. Lunha"}, {"name": "O. Mykhailiv"}, {"name": "C. Schneider"}], "featured_authors": [{"name": "J. Blümlein"}, {"name": "A.M. Gavrilik"}, {"name": "U.Y. Lunha"}, {"name": "O. Mykhailiv"}, {"name": "C. Schneider"}], "author_count": 5}, {"id": "2611.29719", "category": "math-ph", "title": "Interface currents of magnetized differential systems: quantization and bulk-interface correspondence", "abstract": "This paper concerns transport along an interface between two insulators modeled by self-adjoint differential systems $H$ of arbitrary order, coupled to a magnetic field either by Peierls substitution or, for operators of the form $L^*L+W$, in the factor $L$. Each bulk carries a constant field, which may vanish. The principal symbol of $H$ is either elliptic or has a kernel of constant rank, in which case finitely many bands remain bounded at large momentum, as in rotating shallow water, cold plasmas, Maxwell's equations and pseudospin-one materials. Ellipticity is then replaced by a Douglis-Nirenberg structure and by a gap condition on an effective flat symbol. We show that, for every energy $\\alpha$ away from the flat-band set and in a spectral gap of both bulks, the interface current $\\sigma_I=\\mathrm{Tr}\\,i[H,P]\\varphi'(H)$ is well defined, with $2\\pi\\sigma_I$ a Fredholm index, and that it is given, for all walls in the elliptic case and under a freezing condition otherwise, by a bulk-interface correspondence of the form $2\\pi\\sigma_I=J(a_+,B_+;\\alpha)-J(a_-,B_-;\\alpha)+\\mathsf{C}$. For a nonzero bulk field, $J=2\\pi\\sigma_H$ is the Kubo-Chern Hall conductivity, which we compute by an extension-corrected count of generalized Landau levels. For a vanishing field, $J$ is the Chern integral of the field-free symbol, which is also, under a weak-field condition, the weak-field limit of the Hall conductivity. The term $\\mathsf{C}$ is a Chern integral of the occupied projector at infinite momentum across the wall. The current is stable under large perturbations, and boundaries of the applied field inside a homogeneous material carry quantized currents that change at field-induced transitions. Near flat-band energies, where generalized Landau levels may accumulate, the current may diverge.", "url": "https://arxiv.org/abs/2611.29719", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Guillaume Bal"}], "featured_authors": [{"name": "Guillaume Bal"}], "author_count": 1}, {"id": "2611.29778", "category": "math-ph", "title": "Characterizing Ultrafast Processes via Work", "abstract": "Consider the following cycle for a mean-field system initially in thermodynamic equilibrium: an instantaneous parameter jump, relaxation to the new equilibrium, and a reverse jump. For certain systems and parameter values, the two equilibrium macrostates coincide in the thermodynamic limit. We characterize this matching phenomenon through the work required to perform the cycle. Our main result concerns scalar many-particle mean-field systems under suitable assumptions. In the matching regime, the total work has a non-Gaussian limiting distribution, and the average work per particle tends to zero. Away from matching, the properly rescaled fluctuations of the total work have a Gaussian limiting distribution, and the average work per particle converges to a strictly positive constant. Further motivation arises from a contact-geometric model of thermodynamics, in which matching corresponds to a Reeb chord between two equilibrium Legendrian submanifolds.", "url": "https://arxiv.org/abs/2611.29778", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bernard Derrida"}, {"name": "Michael Entov"}, {"name": "Leonid Polterovich"}, {"name": "Lenya Ryzhik"}], "featured_authors": [{"name": "Bernard Derrida"}, {"name": "Michael Entov"}, {"name": "Leonid Polterovich"}, {"name": "Lenya Ryzhik"}], "author_count": 4}, {"id": "2611.29827", "category": "math-ph", "title": "Modulation equations and coherence dynamics in a qubit chain coupled to a circulating fluxon", "abstract": "We derive modulation equations for the joint quantum amplitudes of a circulating fluxon and an exchange-coupled qubit chain whose endpoint interacts with the field. A unitary passage operator combines the translational packet, vacuum dressing, and discrete oscillatory modes. A resonant normal form separates the slow amplitude evolution from nonresonant corrections. Ordered emission and return amplitudes generate a second-order correction that changes the population and coherence of an internal qubit. The next ground-band coefficient gives compensating diagonal and near-resonant off-diagonal contributions to the accumulated error. We bound the state error a posteriori. At a velocity-selected resonance, direct propagation over 81 passages gives a mode contribution of order $6\\times10^{-8}$; the cubic ground-band approximation agrees with an expanded full calculation to $1.5\\times10^{-9}$ in the tested observables. The equations describe how the source profile and field memory affect coherence inside the chain.", "url": "https://arxiv.org/abs/2611.29827", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "O.M.Kiselev"}], "featured_authors": [{"name": "O.M.Kiselev"}], "author_count": 1}, {"id": "2611.29898", "category": "math-ph", "title": "Frobenius $2$-algebras and $R$-matrices", "abstract": "In this paper, introducing Frobenius $2$-algebras, which are categorical generalizations of Frobenius algebras, we show that every Frobenius $2$-algebra determines an $R$-matrix satisfying the Yang-Baxter equation in the monoidal category of endomorphisms of its underlying object. Moreover, we illustrate this construction through three examples: a pair of objects in a braided monoidal category, a Hopf algebra with invertible antipode, and representations of the Heisenberg double of a finite-dimensional Hopf algebra. In particular, in the third example, we recover Kashaev's construction of the universal $R$-matrix. Thus, our construction provides a categorical generalization of Kashaev's construction.", "url": "https://arxiv.org/abs/2611.29898", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hibiki Shibuya"}, {"name": "Yuji Terashima"}], "featured_authors": [{"name": "Hibiki Shibuya"}, {"name": "Yuji Terashima"}], "author_count": 2}, {"id": "2611.29967", "category": "math-ph", "title": "A decomposition of Hamiltonian matrices with symplectic kernels and its application to Williamson's diagonal form", "abstract": "In this paper, we establish a decomposition of Hamiltonian matrices with symplectic kernels, which extends the main result in [K. D. Ikramov, On the Symplectic Eigenvalues of Positive Definite Matrices. Moscow Univ. Comput. Math. Cybern., 42(2018)1-4]. As an application, we present another proof of Williamson's diagonal form for positive-semidefinite matrices with symplectic kernels.", "url": "https://arxiv.org/abs/2611.29967", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shaowu Huang"}, {"name": "Yingxin Huang"}], "featured_authors": [{"name": "Shaowu Huang"}, {"name": "Yingxin Huang"}], "author_count": 2}, {"id": "2611.30367", "category": "math-ph", "title": "Derivation of BCS functionals and gap equations from quantum many-body fermionic system", "abstract": "We consider 3D single-species spin-$1/2$ Fermi systems with general dispersion relation and general attractive interaction initially inside a finite box. Up to some critical temperature $T_c$ determined by the interaction and system size, we establish, for the expected discrete BCS gap equation, existence of positive maximal solution. We then prove the uniqueness of nonzero (not identically zero) nonnegative solution. That is, any nonzero nonnegative solution, if exist or obtained via other methods, must equal to the positive maximal solution. Building on such a well-posedness result and assuming quasi-freeness, we prove the emergence of the $SU(2)$ symmetry of the finite system. Finally, letting the system size tend to infinity, we prove the emergence of the continuous BCS functional and gap equation for which we also have the uniqueness of nonzero nonnegative solution, and the convergence of the critical temperature. In particular, our work also implies there is a positive energy (hence mass) gap for aforementioned Fermi systems for $[0,T_c)$, any nonzero nonnegative solution for the gap equations are from the many-body system it suppose to describe, and the Cooper divergence of the density of states from a finite to an infinite system.", "url": "https://arxiv.org/abs/2611.30367", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xuwen Chen"}, {"name": "Jiahao Wu"}, {"name": "Zhifei Zhang"}], "featured_authors": [{"name": "Xuwen Chen"}, {"name": "Jiahao Wu"}, {"name": "Zhifei Zhang"}], "author_count": 3}, {"id": "2611.30403", "category": "math-ph", "title": "Quantum walks and conformal mappings", "abstract": "We study the most elementary discrete model of an electron moving along a line, known as Feynman checkers, quantum walk, or the six-vertex model with special complex weights, and provide a uniform asymptotic formula for the wave function in the whole xt-plane. In addition to the well-known appearance of the Airy function that describes the transition between the oscillating and exponentially decaying regimes, we observe a second transition governed by the gamma function when the electron speed approaches the speed of light. We prove two general theorems producing uniform asymptotic formulae involving the Airy and gamma functions, using conformal mappings associated with the underlying integral representations. They are applicable in several other situations as well.", "url": "https://arxiv.org/abs/2611.30403", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fedor Kuyanov"}, {"name": "Michael Drmota"}, {"name": "Mikhail Skopenkov"}, {"name": "Alexey Ustinov"}], "featured_authors": [{"name": "Fedor Kuyanov"}, {"name": "Michael Drmota"}, {"name": "Mikhail Skopenkov"}, {"name": "Alexey Ustinov"}], "author_count": 4}, {"id": "2611.30418", "category": "math-ph", "title": "Uniform Ionization Bounds in Molecular Thomas--Fermi--Dirac--von Weizsäcker Theory", "abstract": "We study the molecular Thomas--Fermi--Dirac--von Weizsäcker theory. For each fixed number $K$ of nuclei, we prove that every minimizer of mass $N$ satisfies $N\\leq Z+C_K$, where $Z$ is the total nuclear charge, and $C_K>0$ is independent of the nuclear charges and positions. This answers the molecular large-charge ionization question posed in [R. L. Frank, P. T. Nam and H. Van Den Bosch, CPAM, 2018]. For $N\\geq Z$, we also compare the screened potentials and electronic radii of Thomas--Fermi--Dirac--von Weizsäcker minimizers with those of the corresponding neutral molecular Thomas--Fermi minimizers and establish a uniform bound on the ionization energy.", "url": "https://arxiv.org/abs/2611.30418", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shuang Wu"}], "featured_authors": [{"name": "Shuang Wu"}], "author_count": 1}, {"id": "2611.30425", "category": "math-ph", "title": "Non-Perturbative Analysis of Resonances by a Contraction Mapping on Complex Domains", "abstract": "In this paper, we consider a perturbation problem of embedded eigenvalues for an abstract Friedrichs--Lee Hamiltonian and analyze its spectral properties. By deforming the contour and constructing a contraction mapping on complex domains, we prove the existence of resonance poles.", "url": "https://arxiv.org/abs/2611.30425", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Toshimitsu Takaesu"}, {"name": "Tamotsu Teruya"}], "featured_authors": [{"name": "Toshimitsu Takaesu"}, {"name": "Tamotsu Teruya"}], "author_count": 2}, {"id": "2611.30468", "category": "math-ph", "title": "For whom the Bell tolls: joint measurements and state updates in quantum field theory", "abstract": "State update rules and their behaviour in Bell tests play an important role in the study of measurement schemes and quantum information. We consider the state updates of the Fewster-Verch measurement framework for quantum field theory using their connection to the probability distribution of measurement outcomes. We focus on a set of observables of the form $A(f_i)^*A(f_i)$, where $A(f)$ is the (complex) smeared field operator for any theory induced by a formally hermitian, Green hyperbolic differential operator, and where the $(A(f_i))_{i=1, \\dots, m}$ are assumed to be normal and mutually commuting. Under the assumption that these operators have a sufficiently nice representation on a bosonic Fock space, we derive the joint moment generating functional and the unique joint probability distribution for the observables $(A(f_i)^*A(f_i))_{i=1,\\dots,m}$. As an application of these results, we construct a model of a Bell inequality test within quantum field theory using a recently developed coupled Proca-scalar model for polarization measurements. We show that our Bell test model can violate the CHSH inequality, approaching Tsirelson's bound for maximally entangled states in the limit where vacuum effects are perfectly rejected. These results show that the state update rules derived in the Fewster-Verch framework are compatible with strongly quantum correlations. They also support a viewpoint in which state updates should be understood in relation to available information.", "url": "https://arxiv.org/abs/2611.30468", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Christopher J. Fewster"}, {"name": "Christiane K. M. Klein"}], "featured_authors": [{"name": "Christopher J. Fewster"}, {"name": "Christiane K. M. Klein"}], "author_count": 2}, {"id": "2611.30529", "category": "math-ph", "title": "Density of states for random Schrödinger operators with linearly correlated heavy-tailed disorder", "abstract": "We study the density of states of random Schrödinger operators with linearly correlated heavy-tailed disorder. Using an integration-by-parts supersymmetric representation, we prove smoothness of the density of states and Wegner estimates in the strong-disorder regime. We are particularly interested in mixed-sign correlation kernels, which serve as a toy model for the hyperbolic structures arising in the analysis of averaged squared Green's functions. Our approach applies to a broad class of correlation kernels and disorder distributions, including $\\alpha$-stable laws.", "url": "https://arxiv.org/abs/2611.30529", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Margherita Disertori"}, {"name": "Luca Fresta"}, {"name": "Liza Schonlau"}], "featured_authors": [{"name": "Margherita Disertori"}, {"name": "Luca Fresta"}, {"name": "Liza Schonlau"}], "author_count": 3}, {"id": "2611.30576", "category": "math-ph", "title": "Reproducing kernel and matrix representation of the deformed quantum optical density operator of $\\mathcal{R}(p,q)-$super-coherent states on $\\mathcal{B}_0\\oplus\\mathcal{B}_1$ fermionic quantum algebra", "abstract": "We study the $\\mathcal{R}(p,q)-$super-coherent states with two Grassmann variables $(\\zeta_1,\\zeta_2)$ built on the superalgebra $\\mathcal{B}_0\\oplus\\mathcal{B}_1$ associated with the $\\mathcal{R}(p,q)-$deformed quantum algebras of Hounkonnou and Bukweli-Kyemba, the two dilation parameters $\\phi_1(p,q)$ and $\\phi_2(p,q)$ being meromorphic functions of two variables evaluated at $(p,q)$. The graded super-Fock space splits into four sectors: bosonic, $\\phi_1-$fermionic, $\\phi_2-$fermionic and bi-fermionic. In each of them we establish the diagonal representation of the density operator by means of the $\\mathcal{R}(p,q)-$derivative, angular integration and Berezin integration, and we give a unified compact form in terms of sectorial parametric functions. The total density operator is obtained in explicit form as the sum of the four sectorial contributions, and can be read as a mixture of the four sectors. We define the sectorial reproducing kernels, obtained from the resolution of the identity, we compute the matrix elements of the density operator in the super-coherent state basis, and we prove the hermiticity, positivity and matrix multiplication properties of the kernels, together with the series expansion of their diagonal values. An integral formulation relates the density operator, its density function and the reproducing kernel, the latter being the function associated with the identity operator. Berezin quantization in the bosonic sector yields the quantized operators associated with $z$, $\\bar z$, $|z|^2$, $z^2$ and $\\bar z^2$ and their mean values; the dispersions of the super-position and super-momentum operators show that the super-coherent states are intelligent states.", "url": "https://arxiv.org/abs/2611.30576", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kawèyim Lankpetre"}, {"name": "Isiaka Aremua"}, {"name": "Joseph Désiré Bukweli Kyemba"}, {"name": "Bienvenu Gnim Adewi"}], "featured_authors": [{"name": "Kawèyim Lankpetre"}, {"name": "Isiaka Aremua"}, {"name": "Joseph Désiré Bukweli Kyemba"}, {"name": "Bienvenu Gnim Adewi"}], "author_count": 4}, {"id": "2611.30987", "category": "math-ph", "title": "Gaudin's determinantal norm formula and Hall--Littlewood polynomials", "abstract": "The Hall--Littlewood polynomials are orthogonal with respect to a discrete measure stemming from a discretization of the Lieb--Liniger model that describes $q$-bosons on the circle. This note establishes a previously conjectured Gaudin-type determinantal formula for their quadratic norms.", "url": "https://arxiv.org/abs/2611.30987", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jan Felipe van Diejen"}], "featured_authors": [{"name": "Jan Felipe van Diejen"}], "author_count": 1}, {"id": "2611.31005", "category": "math-ph", "title": "Symmetries, conservation laws, series solutions and singularity formation for the spherically symmetric Euler-Poisson equations in mass coordinates", "abstract": "Written in Lagrangian mass coordinates, the spherically symmetric Euler-Poisson equations for a polytropic gas become a single second-order equation for the radius $r(t,m)$ of the shell enclosing mass $m$, with adiabatic index $\\gamma>1$ and entropy profile $S(m)$. We determine all point symmetries of this equation. Apart from time translation there is at most one scaling, except at the critical index $\\gamma=4/3$, where a scaling exists for every entropy profile; these scalings are the entropy-fixed stabilisers of the two-parameter scaling group of the non-isentropic system, and we give the exact symmetry defect when $\\gamma\\neq4/3$. Noether's theorem singles out the profiles $S=Km^{14-10\\gamma}$, for which a scaling is variational and gives a conservation law beyond energy; otherwise the scalings yield virial identities. We construct exact collapse solutions and reduce the self-similar problem to one ordinary differential equation. Using the Briot-Bouquet theorem we prove that the regular centre of self-similar and homologous collapse carries a convergent analytic expansion with free central amplitude, and we derive a Puiseux expansion at the stellar surface whose exponent is the polytropic index $1/(\\gamma-1)$. In mass coordinates a density singularity is a zero of $r_m$ or of $r$; for the first kind we prove a Hopf-type fold law and an exact shell-crossing criterion for free-falling dust. Finally, linear perturbations of the critical Einstein-de Sitter collapse separate exactly into spherical Bessel profiles, with exponents solving $3\\kappa^2+\\kappa-2+\\mu=0$. All identities were checked by computer algebra, and the numerical statements rest on convergence studies of a second-order Lagrangian scheme, including a collapse with a free surface.", "url": "https://arxiv.org/abs/2611.31005", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Adnan Shamaoon"}], "featured_authors": [{"name": "Adnan Shamaoon"}], "author_count": 1}, {"id": "2611.28215", "category": "quant-ph", "title": "State-selective dynamical freezing in driven Rydberg atom chains", "abstract": "Dynamical freezing, the near-complete suppression of dynamics at special drive frequencies, offers a route to mitigating Floquet heating in periodically driven quantum systems. In interacting systems, however, the energy cost of each transition depends on the many-body configuration, so that the freezing condition itself becomes state dependent. We study this dependence in periodically driven Rydberg atom chains under single- and bi-frequency driving. Using Floquet perturbation theory, we show that each spin flip is characterised by a single interference amplitude set by its local interaction shift, and that a state freezes only where the amplitudes of all its available flips vanish simultaneously. This picture accounts quantitatively for the shift and proliferation of freezing frequencies with interatomic spacing and for the response of entire families of initial states, which are sorted by a single local motif. Freezing is strong only within a window of spacings bounded by interaction tails on one side and nearest-neighbour excitation facilitation on the other, outside of which the advantage of bi-frequency driving is lost. In the regime of large detuning amplitude, where freezing points are numerous and the perturbative description is controlled, this window leaves almost no room for the PXP limit.", "url": "https://arxiv.org/abs/2611.28215", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Madhumita Sarkar"}, {"name": "Sougato Bose"}, {"name": "Roopayan Ghosh"}], "featured_authors": [{"name": "Madhumita Sarkar"}, {"name": "Sougato Bose"}, {"name": "Roopayan Ghosh"}], "author_count": 3}, {"id": "2611.28361", "category": "quant-ph", "title": "Incompressible quantum information", "abstract": "For a small classical system correlated with a large one, it is always possible to compress the large system down to a size only dependent on the size of the smaller one, while preserving all correlations up to a given controllable error. Here, we show that such a statement does not hold at all when the large system is quantum mechanical. More precisely, we show that there are bipartite states such that any compression of the large system, by a non-trivial relative factor, will necessarily lead to the destruction of a significant amount of correlation, measured in mutual information. Our results therefore identify a limitation of information-bottleneck approaches to quantum machine learning, showing that a small system specifying the relevant features contained in a large quantum data set does not guarantee a compact encoding of the latter that preserves the relevant correlations.", "url": "https://arxiv.org/abs/2611.28361", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lasse H. Wolff"}, {"name": "Matthias Christandl"}, {"name": "Bergfinnur Durhuus"}, {"name": "Christoph Hirche"}, {"name": "Andreas Winter"}], "featured_authors": [{"name": "Lasse H. Wolff"}, {"name": "Matthias Christandl"}, {"name": "Bergfinnur Durhuus"}, {"name": "Christoph Hirche"}, {"name": "Andreas Winter"}], "author_count": 5}, {"id": "2611.28373", "category": "quant-ph", "title": "Online Scheduling for Entanglement Distillation: Learning When to Wait", "abstract": "Entanglement distillation probabilistically increases the fidelity of entangled pairs at the cost of reducing their number. The outcome of each distillation operation takes time to communicate, during which the entangled pairs decohere while idle in their memories. This raises a dilemma: wait for the outcome before proceeding, or continue optimistically at the risk of needlessly consuming further pairs. We study online distillation scheduling, in which distillation trees are constructed dynamically to maximize the throughput of pairs that meet a required fidelity. A policy decides which pairs to distill together and, for each operation, whether to wait for its outcome. We derive an upper bound on the throughput of every scheduling policy and, by formulating the problem as a Markov decision process, train, with reinforcement learning, a policy that applies to any number of memories. Compared with two baselines that always or never wait, the learned policy delivers as many pairs of the required fidelity as the better one when one of these two extremes is the best choice, and more otherwise.", "url": "https://arxiv.org/abs/2611.28373", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Panagiotis Promponas"}, {"name": "Spyros Tserkis"}, {"name": "Leandros Tassiulas"}], "featured_authors": [{"name": "Panagiotis Promponas"}, {"name": "Spyros Tserkis"}, {"name": "Leandros Tassiulas"}], "author_count": 3}, {"id": "2611.28388", "category": "quant-ph", "title": "Verification and Evaluation of A Comprehensive Quantum Simulation Compiler", "abstract": "Hamiltonian simulation is a central application of quantum computing, yet most existing compilers offer no machine-checked guarantee that the circuits they produce approximate the intended evolution. The previous QBlue compiler verifies a Hamiltonian simulation compiler containing only Trotter-based algorithms. It takes a Hamiltonian written over Pauli strings, a simulation time, and an error bound, and produces a circuit or analog schedule that is proven, in the Rocq proof assistant, to approximate the ideal time evolution within that bound and proves a single end-to-end error bound that composes the errors of the individual stages; the compiler uses it to select, by resource estimation, the cheapest algorithm that meets the user's bound. This paper advances the verification efforts with two further steps. First, we extend QBlue to $\\textsf{QBlue}_{\\texttt{BE}}$ by verifying another important compilation method for Hamiltonian simulation: block-encoding-based (BE-based) algorithms. Second, we empirically evaluate 279 Hamiltonian simulation programs against the state-of-the-art BE-based compiler, PennyLane. For many programs, our compiler shows a $94\\%$ gate reduction compared to PennyLane. Additionally, we also discover issues and bugs in PennyLane. We also compare Trotter- and BE-based algorithms, providing a practical comparison for the long-standing debate over which algorithms perform better. Our results surprisingly show that Trotter-based algorithms may gain a practical advantage, even though BE algorithms have a theoretical advantage.", "url": "https://arxiv.org/abs/2611.28388", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bhuwan Joshi"}, {"name": "Zoukarneini Difaizi Tagba"}, {"name": "Zhi Xiang Chong"}, {"name": "Liyi Li"}], "featured_authors": [{"name": "Bhuwan Joshi"}, {"name": "Zoukarneini Difaizi Tagba"}, {"name": "Zhi Xiang Chong"}, {"name": "Liyi Li"}], "author_count": 4}, {"id": "2611.28427", "category": "quant-ph", "title": "Froq: Safe Speculative Execution on Live Quantum States for FTQC", "abstract": "Reducing execution time is critical to fault-tolerant quantum computing (FTQC) as longer executions expose logical qubits to more opportunities for failure. However, quantum processors could frequently stall due to slow classical error-correction decoders. Recent speculative decoding accelerates this process, but its speculation remains on the classical side, leaving quantum operations waiting for confirmed decoding results. Extending speculative execution to the quantum side is fundamentally challenging. Unlike classical processor states, quantum states cannot be arbitrarily copied or checkpointed for rollback, making recovery from mispredictions difficult. In this work, we propose Froq to enable safe speculative execution on live quantum states. Froq uses compiler-assisted recovery contracts to track how mispredictions propagate through quantum operations. It further employs a resource-aware runtime mechanism to reserve recovery workspace and dynamically balance the benefits of speculative execution against the expected costs of recovery. We evaluate Froq on eight FTQC programs across 88 configurations, building on an existing speculative window decoder. Froq reduces quantum-side time by 9.81% across all 88 configurations. The reduction reaches 18.34% across the 45 configurations allowing concurrent predictions, and peaks at 31.1% at code distance d=21, under limited resources.", "url": "https://arxiv.org/abs/2611.28427", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yicheng Guang"}, {"name": "Yueqi Chen"}], "featured_authors": [{"name": "Yicheng Guang"}, {"name": "Yueqi Chen"}], "author_count": 2}, {"id": "2611.28478", "category": "quant-ph", "title": "Causal Consistency and Cost of Quantum Control", "abstract": "An unknown quantum state can supply the information needed to control a computation, but how much quantum data must be consumed to perform a prescribed action? We connect this resource question to causal consistency within the quantum state space. No-signaling requires identical observable predictions for remotely chosen ensemble preparations of the same complete input; quantum distinguishability then converts this requirement into finite-copy bounds. For amplitude amplification, we identify an exact low-copy obstruction and establish a dimension-independent, optimal quadratic dependence of the copy cost on angular gain at fixed accuracy, uniformly over arbitrary pure inputs. A coherent protocol attains this scaling without reconstructing a classical state description. Prior knowledge of a real two-level family additionally permits exponentially decreasing error with the copy budget at fixed gain. These results separate the resources needed to perform a specified quantum operation from those needed for universal state reconstruction. The central connection is operational: physical consistency restricts which distinctions a controller can expose, and the information carried by its complete input determines the cost of doing so. This links a causal requirement to quantitative limits on converting quantum data into computational control.", "url": "https://arxiv.org/abs/2611.28478", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jeongho Bang"}, {"name": "Kyoungho Cho"}, {"name": "Jeongwoo Jae"}], "featured_authors": [{"name": "Jeongho Bang"}, {"name": "Kyoungho Cho"}, {"name": "Jeongwoo Jae"}], "author_count": 3}, {"id": "2611.28493", "category": "quant-ph", "title": "Coherent Control of Single-Photon Emission in Broadband Plasmonic Resonators", "abstract": "Encoding phase information with quantum emitters in metallic optical nanocavities is challenging due to ultrafast relaxation induced by the broadband nature of the plasmonic near field. Using macroscopic quantum electrodynamics theory, we demonstrate that an individual emitter strongly coupled to a plasmonic nanocavity field that is driven by a pulsed laser with frequency comb spectrum undergoes spontaneous emission of well-resolved one-photon pulses whose amplitude scales quadratically with the number of frequency comb components due to coherent accumulation, and ultrashort non-exponential temporal profiles with duration set by the light-matter coupling strength. Conditions are discussed for exponentially suppressing the probability of two or more emission events within the lifetime of the coupled emitter-nanocavity system. The spectral signatures of the optimal one-photon wavepackets are discussed. This work paves the way for the development of ultrafast laser-triggered single-photon emitters using atoms and molecules in optical nanocavities.", "url": "https://arxiv.org/abs/2611.28493", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Athul S. Rema"}, {"name": "Adrián E. Rubio López"}, {"name": "Felipe Herrera"}], "featured_authors": [{"name": "Athul S. Rema"}, {"name": "Adrián E. Rubio López"}, {"name": "Felipe Herrera"}], "author_count": 3}, {"id": "2611.28506", "category": "quant-ph", "title": "Subquantum Pilot-Wave System Theory: Structural and Amplitude Nonequilibrium under Source Fields", "abstract": "A source in the Schrodinger equation changes the norm of the guiding wave, apparently conflicting with the conservation of probability. In source-extended de Broglie-Bohm dynamics the conflict disappears: probability is carried by the particle ensemble, while the wavefunction guides its motion. The difficulty is then different. What does quantum equilibrium mean when the particle distribution remains normalized but the guiding density does not? We show that the departure has two independent components: a structural one, measured by the Kullback--Leibler divergence between the particle distribution and the normalized guiding density, and an amplitude one, measured by the Born weight. The Born rule holds precisely when both are equilibrated. Their evolution is governed by the complex source-to-wavefunction ratio; scale covariance further distinguishes an independently prescribed source, against which the amplitude of the wave matters, from state-dependent generators for which rescaling remains a symmetry. We develop a source-aware analytical--computational method, combining exact or semi-analytical guiding fields with Bohmian trajectory transport, ensemble quadrature and independent numerical checks. Free-space impulses expose the limits of global diagnostics and an exact jump rule; a driven ring has constant Born weight but either periodic or secular structural departure; oscillators show both source-generated structural change and amplitude-only evolution, including a finite-horizon weak-drive plateau far below its frozen-particle value; and a coupled two-body model exhibits nonlocal guidance and evolving particle entanglement. The source-free, initially equilibrated sector recovers standard quantum mechanics.", "url": "https://arxiv.org/abs/2611.28506", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Said Mikki"}], "featured_authors": [{"name": "Said Mikki"}], "author_count": 1}, {"id": "2611.28674", "category": "quant-ph", "title": "Quantum nonclassicality as a marginal problem", "abstract": "Classical explanations of quantum statistics---local, noncontextual, or causal---fail for one and the same reason: the probability distributions observed in different contexts are not the marginals of a single joint distribution. Every single context admits a classical model. This is Boole's problem of the \"conditions of possible experience.\" Garg and Mermin treated it as a linear problem and showed, via Farkas's lemma, that its solvability is equivalent to a finite list of Bell-type inequalities, one for each extreme ray of a convex polyhedral cone; Pitowsky gave it the form of correlation polytopes. We sketch this common structure and discuss two examples: Aerts's elastic-band model, which reproduces the quantum cosine in one context but obeys the classical bound when contexts are combined; and nonclassicality in causal data fusion, where the contexts are supplied by interventions on a causal structure.", "url": "https://arxiv.org/abs/2611.28674", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Karl Svozil"}], "featured_authors": [{"name": "Karl Svozil"}], "author_count": 1}, {"id": "2611.28677", "category": "quant-ph", "title": "Revealing the Hidden Symmetry of the Asymmetric Quantum Rabi Model", "abstract": "A longitudinal bias breaks ordinary parity in the asymmetric quantum Rabi model, yet exact crossings reappear when the bias equals an integer multiple $m$ of the oscillator energy spacing. We trace the hidden symmetry to exchange between equal-energy partners $m$ rungs apart on two displaced oscillator ladders. Tunneling to other rungs makes this exchange vary in time. We construct the exact symmetry operator by adding spin and oscillator coherences that cancel this variation. At nonzero coupling and tunneling, the resulting charge has no zero modes, and its sign divides the full Hilbert space into two generalized-parity sectors that cannot mix. Spin-resolved mirror interference probes coherence between the two opposite-parity states at a crossing. Its small-displacement exponent gives $m$, and its leading coefficient, together with the charge magnitude, predicts the mixing induced by a slight change in bias.", "url": "https://arxiv.org/abs/2611.28677", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zi-Min Li"}, {"name": "Zi-Cheng Liu"}, {"name": "Long-Jie Li"}, {"name": "Xuan Zou"}, {"name": "Jin-Xiang Fu"}, {"name": "Xilin Lu"}, {"name": "Murray T. Batchelor"}], "featured_authors": [{"name": "Zi-Min Li"}, {"name": "Zi-Cheng Liu"}, {"name": "Long-Jie Li"}, {"name": "Jin-Xiang Fu"}, {"name": "Xilin Lu"}, {"name": "Murray T. Batchelor"}], "author_count": 7}, {"id": "2611.28700", "category": "quant-ph", "title": "Phase-dependent atomicity and PPT edge states for cyclic-sign covariant qutrit maps", "abstract": "Decomposable positive maps cannot detect entangled states with positive partial transpose (PPT). We obtain a necessary and sufficient criterion for decomposability in the entire seven-real-parameter class of Hermiticity-preserving cyclic-sign covariant maps on $M_3$. The criterion reduces to a one-variable inequality and, for positive maps in this class, characterizes indecomposability exactly. We apply it to a phase-dependent family obtained by adding a completely positive map to the Choi map. Every map in this family is positive, and we find the exact phase-dependent threshold for indecomposability and atomicity. At three phase values, the maps remain indecomposable for every finite deformation strength. Each indecomposable map gives an indecomposable entanglement witness through its Choi matrix. We construct PPT edge states of birank $(5,5)$ detected by these witnesses throughout the indecomposable region.", "url": "https://arxiv.org/abs/2611.28700", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Adam Rutkowski"}], "featured_authors": [{"name": "Adam Rutkowski"}], "author_count": 1}, {"id": "2611.28738", "category": "quant-ph", "title": "Many-Body Flux Selection in Chiral Quantum Batteries", "abstract": "We study an interacting quantum-battery chain in which a synthetic flux controls interference between hopping paths. Keeping the internal battery Hamiltonian fixed, we seek the flux that leaves the most extractable work. Even a Gaussian reconstruction supplied with exact one-body information can rank competing flux settings incorrectly. A reduced many-body model that retains correlations within a few battery-occupation sectors recovers the correct ranking and selects nearly optimal fluxes across the finite systems and parameter ranges studied. Strikingly, the model can make an accurate control choice even when it excludes configurations carrying substantial probability in the exact state. Thus, choosing a nearly optimal charging flux can require much less information than reconstructing the full many-body state.", "url": "https://arxiv.org/abs/2611.28738", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Borhan Ahmadi"}], "featured_authors": [{"name": "Borhan Ahmadi"}], "author_count": 1}, {"id": "2611.28749", "category": "quant-ph", "title": "Sharp Purity Based Entropy Bounds and Machine Learning Assisted Entropy Estimation", "abstract": "Purity quantifies quantum-state mixedness, motivating the study of its role in controlling entropy variations. A sharp purity-based continuity bound is established for the von Neumann entropy of qubit states. The bound is attainable for every admissible purity difference and strictly improves the existing purity bound. In higher dimensions, an explicit sharp bound is derived within the family of pure states mixed with the maximally mixed state. Further continuity estimates are obtained for conditional entropy, quantum mutual information, quantum conditional mutual information, and squashed entanglement within specified bipartite and tripartite families. An application to machine learning assisted qubit entropy estimation illustrates how the sharp bound converts purity estimation errors into rigorous entropy error bounds.", "url": "https://arxiv.org/abs/2611.28749", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Komal Kumar"}, {"name": "Shree Prakash"}], "featured_authors": [{"name": "Komal Kumar"}, {"name": "Shree Prakash"}], "author_count": 2}, {"id": "2611.28801", "category": "quant-ph", "title": "Quantum Metrology With Quantum Limit Cycles", "abstract": "Beyond nonclassical states, emergent quantum phenomena offer new metrological resources. Quantum limit cycles, in particular, sustain long-lived oscillations that prolong coherent signal accumulation. However, quantum fluctuations may limit this advantage, leaving their metrological performance unclear. Here, we propose a quantum limit-cycle metrology protocol for collective spins by introducing nonlinear damping into the conventional collective-decay protocol. We develop a semiclassical phase-diffusion theory to characterize its metrological performance, in good agreement with numerical simulations. The limit-cycle protocol improves estimation precision and approaches Heisenberg scaling with system size. We further combine limit-cycle dynamics with spin squeezing, finding that squeezing improves short-time precision, but phase diffusion ultimately dominates, leaving the asymptotic scaling unchanged. Our results establish quantum limit cycles as a metrological resource and clarify the interplay between limit-cycle dynamics and squeezing in quantum sensing.", "url": "https://arxiv.org/abs/2611.28801", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhi-Hao Liu"}, {"name": "Xiangyu Niu"}, {"name": "Keren Li"}, {"name": "Ran Liu"}, {"name": "Xiao-Dong Yang"}, {"name": "Jun Li"}], "featured_authors": [{"name": "Zhi-Hao Liu"}, {"name": "Xiangyu Niu"}, {"name": "Keren Li"}, {"name": "Ran Liu"}, {"name": "Xiao-Dong Yang"}, {"name": "Jun Li"}], "author_count": 6}, {"id": "2611.28847", "category": "quant-ph", "title": "Increasing Quantum LDPC Code Distance through Explicit Extensions", "abstract": "We give an explicit construction of quantum low-density parity-check (LDPC) codes without searching for candidates at each size. A fixed pair partition (PP) and fixed integer parameters determine the parity-check matrices at a specified size. Using affine permutation matrices (APMs), we construct a $[[3072,772,32]]$ code with column weight 3 and check weight 8 in each of the X and Z parity-check matrices. A construction based on circulant permutation matrices (CPMs) gives $[[1270,260,\\ge34]]$, with column weight 4 and check weight 10. We prove that the construction yields commuting checks and verify the resulting distances using exhaustive search and logical operators. For the main construction, we conjecture the existence of a finite structural distance upper bound and distance improvement toward that bound as the size increases.", "url": "https://arxiv.org/abs/2611.28847", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kenta Kasai"}], "featured_authors": [{"name": "Kenta Kasai"}], "author_count": 1}, {"id": "2611.28904", "category": "quant-ph", "title": "The resource--invariant gap: a protected Floquet invariant need not protect Wigner negativity", "abstract": "Topological invariants constrain a driven Floquet generator, yet whether they protect a transient nonlinear bosonic resource remains open. We track boundary Wigner negativity of an even cat state in a chiral Floquet Su--Schrieffer--Heeger chain with boundary Kerr nonlinearity and structured loss. The quasienergy windings remain quantized at every chain length, yet the matched sector contrast flips sign when the chain grows under index-end shielding and is null within $3\\times 10^{-5}$ under uniform loss at $t=T$ for $d\\le 0.5$. Prepared and shielded on the physical dangling end, the contrast remains positive, modulated by local dimer return rather than set by the invariant. A three-site causal light cone and a boundary-Laplacian erosion law trace the flip to strong-bond bulk exposure: the sign is set by where the bulk-rate loss sits relative to the prepared site, not by chain length. We call this decoupling the resource--invariant gap.", "url": "https://arxiv.org/abs/2611.28904", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Juste Deuyekbe"}, {"name": "Philippe Djorwé"}, {"name": "Nsangou Mama"}, {"name": "S. G. Nana Engo"}], "featured_authors": [{"name": "Juste Deuyekbe"}, {"name": "Philippe Djorwé"}, {"name": "Nsangou Mama"}, {"name": "S. G. Nana Engo"}], "author_count": 4}, {"id": "2611.28962", "category": "quant-ph", "title": "On locked states for damped driven Jaynes--Cummings equations", "abstract": "We consider damped driven version of the Jaynes-Cummings equation which describes quantised one-mode Maxwell field coupled to a two-level molecule. The pumping and dissipation operator are polynomial in the creation and annihilation operators. The structure of the dissipation operator corresponds to the theory of completely positive trace preserving operators due to Lindblad, Kossakowski and others. We construct examples of {\\it locked states} which are stationary states of the corresponding averaged dynamics in the interaction picture. The states are nonnegative Hermitian density operators with finite Hilbert-Schmidt norm. The calculations rely on the recurrence equation for diagonal entries.", "url": "https://arxiv.org/abs/2611.28962", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A.I. Komech"}, {"name": "E.A.Kopylova"}], "featured_authors": [{"name": "A.I. Komech"}, {"name": "E.A.Kopylova"}], "author_count": 2}, {"id": "2611.28984", "category": "quant-ph", "title": "Perfect state transfer on trees in the normalized Laplacian quantum walk", "abstract": "We prove that, in the normalized-Laplacian model, perfect state transfer between two vertices of a tree can only happen if they are at distance at most $2$. We show that a conjecture of Coutinho and Baptista, stating that the only trees admitting perfect state transfer are $K_2$ and $P_3$, is true when the two vertices are at odd distance. We then construct infinite families of trees admitting perfect state transfer, disproving their conjecture in the general case.", "url": "https://arxiv.org/abs/2611.28984", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Laureline Polli"}], "featured_authors": [{"name": "Laureline Polli"}], "author_count": 1}, {"id": "2611.29019", "category": "quant-ph", "title": "A Frequency-Learning Interpolation-Based Coordinate Descent Method to Optimize Parameterized Quantum Circuits on Quantum Hardware", "abstract": "Structure-aware optimizers have been the focus of recent study for the optimization of parameters in variational quantum circuits. Many of these optimizers follow a coordinate-based paradigm, making single parameter updates by using classical approximations to the cost function generated from quantum sampling. However, the performance of structure-aware optimizers on real quantum hardware at large system size has yet to be demonstrated. Recently, Interpolation-based Coordinate Descent (ICD) has been proposed to unify many of these optimizers into one framework. ICD requires a preset frequency set for interpolation, which can be theoretically derived, but for which the cost function is generally sparse over and may require manual tuning. To address these issues, we propose Frequency-learning Interpolation-based Coordinate Descent (FLICD) to adaptively learn frequencies online, allowing easier scaling up to larger systems. We demonstrate that our algorithm is more accurate than an existing zeroth-order method COBYLA and requires fewer quantum resources than ICD on simulator. Using IBM quantum hardware, we execute FLICD on systems up to 100 qubits and observe robust performance with an increasing number of layers.", "url": "https://arxiv.org/abs/2611.29019", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jack Mandell"}, {"name": "Adam Leicester"}, {"name": "Zixu Wang"}, {"name": "Jian Shi"}, {"name": "Haimeng Zhang"}, {"name": "Yangyang Xu"}], "featured_authors": [{"name": "Jack Mandell"}, {"name": "Adam Leicester"}, {"name": "Zixu Wang"}, {"name": "Jian Shi"}, {"name": "Haimeng Zhang"}, {"name": "Yangyang Xu"}], "author_count": 6}, {"id": "2611.29134", "category": "quant-ph", "title": "Undecidable quantum storage: no algorithm can tell from the noise rate whether a fixed circuit remembers", "abstract": "Below a threshold noise rate, error correction lets larger quantum memories store a qubit for longer, without limit. Can the noise rate alone tell us whether a given noisy circuit does this? We construct fixed local circuits for which no algorithm can, already in one dimension under single-qubit noise. Each circuit is translation-invariant and time-periodic, with depolarizing noise on every wire after every layer, including all classical control. A computable list of disjoint rate intervals is indexed by the inputs $n$ of a universal Turing machine; local noise statistics select the input that the circuit simulates, and halting triggers erasure. If the machine runs forever on $n$, a qubit is stored throughout the $n$-th interval at entanglement fidelity at least $15/16$ for a time that grows without bound with size: linearly on rings, exponentially in six dimensions. The encoding and decoding maps are noiseless and global; they depend on $n$, the system size and, for decoding, the time, but not on the rate. If it halts, the fidelity of every encoding falls below $1/2+\\eta$, for any fixed $\\eta>0$, after a time independent of size and rate. The labels of the intervals with unbounded storage form a $\\Pi^0_1$-complete set, and intervals of both kinds accumulate at zero, so these circuits have no noise threshold. Without rate selection, the ring construction is a translation-invariant, time-periodic memory: from an initialized classical hierarchy it stores a qubit for a time linear in the ring length at every sufficiently small rate, addressing the memory part of a one-dimensional question raised by Dünnweber, Styliaris and Trivedi. These are existence results: registers and interaction ranges are very large and the rates astronomically smal
