  <style>

  <script>
    const papers = [{"id": "2611.28147", "category": "cond-mat", "title": "Particle separation in a time-correlated Gaussian velocity field: a numerical study", "abstract": "We numerically investigate the dispersion of passive tracer pairs in a two-dimensional, divergence-free, time-correlated Gaussian velocity field. The field is constructed from a sparse set of Fourier modes evolving as independent Ornstein--Uhlenbeck processes, with spatial regularity and scale-dependent temporal decorrelation comparable to those of a power-law Gaussian velocity ensemble. We show that, for spatial roughness exponent $\\alpha=0.2$ and temporal decorrelation exponent $\\beta=0.5$, corresponding to the regime $\\alpha+\\beta<1$, the extrapolated mean-square distance is compatible with particle separation (in mean-square) at positive time: two particles reach a mean-square positive distance at a finite time, no matter how close they are initially.", "url": "https://arxiv.org/abs/2611.28147", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mario Maurelli"}, {"name": "Silvia Morlacchi"}], "featured_authors": [{"name": "Mario Maurelli"}, {"name": "Silvia Morlacchi"}], "author_count": 2}, {"id": "2611.28213", "category": "cond-mat", "title": "Multiorbital driving of quantum geometric nonlinear transport in oxide interfaces", "abstract": "Quantum geometry plays a relevant role in determining the intrinsic non-linear transport properties of low-dimensional electron systems. Here, we theoretically investigate the quantum geometric contribution to the non-linear conductivity in $\\text{SrTiO}_3$-based two-dimensional electron gases, comparing the prototypical (001) and (111) crystallographic interface orientations. Using a multi-orbital tight-binding approach, we uncover the crucial role of the multiband electronic structure in determining the quantum-geometric contribution to nonlinear transport. In particular, we show how the hybridization of $t_{2g}$ orbitals near avoided band crossings shapes the momentum-space distribution of the band-normalized quantum metric and the resulting nonlinear conductivity. Furthermore, we reveal a strong dependence on crystal orientation: while the (001) interface exhibits sharp peak-and-dip features confined around Lifshitz transitions, the trigonal symmetry of the (111) interface promotes strong orbital mixing. Our results highlight how the interplay between orbital hybridization and crystallographic orientation gives rise to distinct quantum-geometric nonlinear transport responses in oxide interfaces.", "url": "https://arxiv.org/abs/2611.28213", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Irene Gaiardoni"}, {"name": "Mattia Trama"}, {"name": "Roberta Citro"}, {"name": "Annika Johansson"}], "featured_authors": [{"name": "Irene Gaiardoni"}, {"name": "Mattia Trama"}, {"name": "Roberta Citro"}, {"name": "Annika Johansson"}], "author_count": 4}, {"id": "2611.28276", "category": "cond-mat", "title": "Symmetry classes of hyperdeterminant wavefunctions: Application to phase transitions between a bosonic fractional Chern insulator and superfluids", "abstract": "We study a phase transition between a superfluid phase and a fractional Chern insulator phase in a hard-core boson model on the honeycomb lattice using symmetric hyperdeterminant (Hdet) wavefunctions. Combining projective symmetry group analysis with variational Monte Carlo, we construct and optimize Hdet states in various symmetry classes. Based on the associated effective theories, we show that different symmetry classes, i.e., representations of the projective symmetry group, describe specific quantum phases. Compared with traditional fermionic parton construction, the symmetric Hdet wavefunctions are shown to improve microscopics significantly, allowing quantitative investigation of quantum phase diagrams. We argue that, in contrast with the common belief, this putative continuous phase transition is described by a fluctuating $SU(2)_g$ gauge field coupling with four Dirac nodes forming two $SU(2)_g$ doublets (i.e., $N_f=2$ QCD).", "url": "https://arxiv.org/abs/2611.28276", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Guan-Lin Lin"}, {"name": "Xiaodong Hu"}, {"name": "Di Xiao"}, {"name": "Ying Ran"}], "featured_authors": [{"name": "Guan-Lin Lin"}, {"name": "Xiaodong Hu"}, {"name": "Di Xiao"}, {"name": "Ying Ran"}], "author_count": 4}, {"id": "2611.28284", "category": "cond-mat", "title": "Intrinsic volume fraction can decouple from hydrodynamic size in p(NIPAm-co-AA) microgels", "abstract": "Quantifying the packing fraction of microgels is key to understanding their rheology and transport properties. Often, packing fractions are extrapolated from the hydrodynamic size and intrinsic volume fraction under the assumption that particle size and polymer volume change are proportional. Here, we test this assumption for p(N-isopropylacrylamide-co-acrylic acid) [p(NIPAm-co-AA)] microgels of two crosslinker concentrations (1 wt\\% and 7 wt\\% methylenebisacrylamide) using capillary viscometry and light scattering (static and dynamic) above and below the pKa of acrylic acid (AA). At pH 8, where AA is fully ionized, the microgels do not undergo a pronounced volume phase transition because electrostatic repulsion hinders thermal collapse, and both measures of hydrodynamic volume are equal. At pH 4, however, p(NIPAm-co-AA) microgels are weakly charged and exhibit a volume phase transition near the lower critical solution temperature of pNIPAm; the magnitude of the size change is greater for the less-crosslinked microgel. Above the volume phase transition temperature, the volume change from hydrodynamic radius decouples from that from viscosity. The ratio of the radius of gyration and hydrodynamic radius R_g/R_h of p(NIPAm-co-AA) microgels at high temperature exceeds the value theoretically predicted for homogeneous spheres and the deviation increases with the extent of crosslinking, suggesting that a non-uniform internal distribution of polymer gives rise to the anomalous decoupling at high temperatures. Our results indicate that care must be taken in extrapolating packing fractions for multi-responsive copolymer microgels, and suggest that copolymer composition and crosslink density may be used to tune bulk properties such as rheology through the internal microstructure.", "url": "https://arxiv.org/abs/2611.28284", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Peter Edimeh"}, {"name": "Howard Chen"}, {"name": "Jacinta C. Conrad"}], "featured_authors": [{"name": "Peter Edimeh"}, {"name": "Howard Chen"}, {"name": "Jacinta C. Conrad"}], "author_count": 3}, {"id": "2611.28313", "category": "cond-mat", "title": "Oscillatory superconducting proximity effects in a buried Pt interlayer detected by FMR", "abstract": "We investigate superconducting proximity effects in NbN/Pt/Py and NbN/Cu/Py trilayers using broadband ferromagnetic resonance (FMR). The reduction of the spin-pumping contribution to the Py damping below the superconducting transition temperature (Tc) is used to probe the superconducting correlations and electronic density of state in the buried metallic interlayer. For a Cu interlayer, the damping reduction remains finite up to at least 20 nm, in agreement with the large coherence length above 100nm in Cu. In contrast, the damping reduction for a Pt interlayer exhibits a non-monotonic thickness dependence and is fully suppressed above 5 nm. Using the quasiclassical theory, we are able to explain the oscillation in damping reduction below Tc with the coexistence of superconducting and magnetic proximity effects in Pt, which generates oscillations of the superconducting order parameter and electronic density of state in the exchange-splitted Pt interlayer. Our results establish spin-pumping damping as a sensitive probe of superconducting proximity effects in buried metallic layers.", "url": "https://arxiv.org/abs/2611.28313", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "L. Peridon"}, {"name": "T. Courtois"}, {"name": "S.A Hussain"}, {"name": "J.B. Tjernshaugen"}, {"name": "J. Linder"}, {"name": "S. ElMeligy"}, {"name": "B. Újfalussy"}, {"name": "K. Dumesnil"}, {"name": "S. Mangin"}, {"name": "S. Petit-Watelot"}, {"name": "C. Ciccarelli"}, {"name": "T. Hauet"}], "featured_authors": [{"name": "L. Peridon"}, {"name": "T. Courtois"}, {"name": "S.A Hussain"}, {"name": "S. Petit-Watelot"}, {"name": "C. Ciccarelli"}, {"name": "T. Hauet"}], "author_count": 12}, {"id": "2611.28358", "category": "cond-mat", "title": "Exploring new speciation patterns: architecture of genetic similarity networks", "abstract": "We use an individual based model to identify signatures of speciation modes in genetic similarity networks. These networks group individuals based on their genetic similarity, defined through Hamming distances between binary strings representing their genomes. The results of our extensive simulations demonstrate that sympatric and parapatric speciation modes are clearly distinguishable and measurable through specific network metrics. In particular, structural properties -- including clustering coefficient, mean degree, geodesic distance, and assortativity -- show significant differences in both stationary values and transient phases, giving rise to a novel framework for distinguishing between speciation modes.", "url": "https://arxiv.org/abs/2611.28358", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "David M. Schneider"}, {"name": "Claudio Pastorino"}], "featured_authors": [{"name": "David M. Schneider"}, {"name": "Claudio Pastorino"}], "author_count": 2}, {"id": "2611.28514", "category": "cond-mat", "title": "Higher-Order Modulational Instability in Spin-Orbit-Coupled Bose-Einstein Condensates: Finite-Raman Effects and Branch-Resolved Spectral Redistribution", "abstract": "We investigate higher-order modulational instability and the nonlinear spectral redistribution in a spin-orbit-coupled (SOC) binary Bose--Einstein condensate with equal interactions. For finite Raman coupling, the system is nonintegrable and exhibits both nonoscillatory and oscillatory instability regimes. Raman coupling reshapes the instability bands and changes what harmonics can grow. Direct simulations show that this reorganization modifies the subsequent nonlinear sideband dynamics. In the zero-Raman limit, SOC shifts successive harmonics between instability bands and stability gaps at a fixed carrier wavenumber. It thereby controls higher-order instability, distinct breather branches, and frequency-hopping sequences. We derive exact algebraic coefficients for the carrier and arbitrary-order sidebands. This yields an exact geometric power spectrum for the complete infinite sideband sequence and a unified description of carrier depletion, directional imbalance, and sideband decay, including an exact relation between the instability gain and the minimum spectral decay rate. For two coexisting breather branches with the same background and modulation wavenumber, the higher-gain branch can have a smaller maximum carrier depletion, a slower high-order spectral decay, and a weaker directional imbalance. SOC can also restore a symmetric sideband spectrum when the SOC-induced momentum shift compensates the carrier wavenumber, even when both $k$ and $k_L$ are nonzero. These analytical and numerical results clarify how SOC and Raman couplings organize higher-order instability and nonlinear spectral redistribution, providing a unified framework for studying coherent nonlinear-wave dynamics in multicomponent condensates.", "url": "https://arxiv.org/abs/2611.28514", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Cui-Cui Ding"}, {"name": "Boris A. Malomed"}, {"name": "Qin Zhou"}], "featured_authors": [{"name": "Cui-Cui Ding"}, {"name": "Boris A. Malomed"}, {"name": "Qin Zhou"}], "author_count": 3}, {"id": "2611.28536", "category": "cond-mat", "title": "Ultrahigh Thermal Conductivity and Mirror-Parity Constraints in a Corrugated Two-Dimensional Oxide", "abstract": "Contrary to the expectation of poor heat transport in oxides, first-principles calculations predict an ultrahigh lattice thermal conductivity of 756 $\\mathrm{W\\,m^{-1}\\,K^{-1}}$ at 300 K in corrugated two-dimensional B$_2$O$_2$. Acoustic phonons dominate heat transport, with the flexural acoustic (ZA) branch contributing 40.62$\\%$. Triplet resolved analysis including acoustic and optical partners finds that mirror forbidden three phonon scattering is negligible within numerical precision for sampled ZA modes. These results highlight horizontal mirror symmetry as a constraint on phonon scattering in corrugated oxides.", "url": "https://arxiv.org/abs/2611.28536", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Babu Ram"}, {"name": "Arun S. Nissimagoudar"}, {"name": "Weichao Wang"}, {"name": "Geunsik Lee"}], "featured_authors": [{"name": "Babu Ram"}, {"name": "Arun S. Nissimagoudar"}, {"name": "Weichao Wang"}, {"name": "Geunsik Lee"}], "author_count": 4}, {"id": "2611.28593", "category": "cond-mat", "title": "Competing magnetic correlations in the square-lattice Hubbard model with spin-dependent nearest-neighbor and next-nearest-neighbor hopping", "abstract": "Altermagnets have spin-split bands without net magnetization. The splitting can come from a spin-dependent nearest-neighbor (NN) hopping anisotropy $t_A$ or from a spin-dependent next-nearest-neighbor (NNN) hopping $t'$. Both change sign under a $90^\\circ$ rotation and are present together when the lattice has no mirror planes, yet they have so far been studied only separately. Here we study the two-dimensional square-lattice Hubbard model with both $t_A$ and $t'$, using constrained-path quantum Monte Carlo at $U=4t$ and scanning the electron filling $n$, $t_A$ and $t'$. We find four types of magnetic correlations: Néel, stripe, diagonal, and spiral spin-density-wave. The phase diagram depends on both hoppings together. Diagonal correlations require finite $t_A$ and are suppressed by $t'$. Stripe correlations appear only once $t'$ is large enough to overcome the diagonal tendency set by $t_A$. Néel correlations survive at large $t_A$ and large $t'$, where the NNN model alone gives stripe or spiral correlations. The noninteracting susceptibility matches the dominant wavevector at small $t'$, but not the Néel correlations at $t'\\geq0.3$, which come from the interaction. Finite-size scaling with three lattice sizes is consistent with long-range order only near half filling; at the stripe, spiral and diagonal points we tested, the structure factor per site extrapolates to zero. The joint behavior persists up to $U=6t$.", "url": "https://arxiv.org/abs/2611.28593", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rana Imran Mushtaq"}, {"name": "Ji Liu"}, {"name": "Yinlong Li"}, {"name": "Wing Chi Yu"}, {"name": "Xiaosen Yang"}, {"name": "Ho-Kin Tang"}], "featured_authors": [{"name": "Rana Imran Mushtaq"}, {"name": "Ji Liu"}, {"name": "Yinlong Li"}, {"name": "Wing Chi Yu"}, {"name": "Xiaosen Yang"}, {"name": "Ho-Kin Tang"}], "author_count": 6}, {"id": "2611.28597", "category": "cond-mat", "title": "Hartree--Fock analysis of the bilayer Hubbard model", "abstract": "We study the half-filled Hubbard model on two parallel square lattices with on-site repulsion $U>0$ and with nearest-neighbor hopping specified by a constant $t>0$ within each plane and by another constant $t_\\perp \\geq 0$ between the planes. Working in the Hartree--Fock approximation, we obtain asymptotic formulas for the Néel temperature and the antiferromagnetic gap ratio in the weak coupling limit. We also determine the behavior of the antiferromagnetic gap ratio near the critical curve separating the paramagnetic and antiferromagnetic regions in the phase diagram. Furthermore, we present numerical phase diagrams away from half-filling, and we make an analytical conjecture regarding their structure.", "url": "https://arxiv.org/abs/2611.28597", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "E. Langmann"}, {"name": "J. Lenells"}], "featured_authors": [{"name": "E. Langmann"}, {"name": "J. Lenells"}], "author_count": 2}, {"id": "2611.28689", "category": "cond-mat", "title": "Spherical HgTe nanocrystal: a multi-band effective mass study", "abstract": "The size-quantized energies, eigenstates, and optical selection rules in a spherical HgTe nanocrystal are studied by solving the multi-band effective-mass equations analytically. The six-band Kane model, involving both the $\\Gamma_{6}$ and $\\Gamma_{8}$ bands within the spherical approximation, is employed in the derivation. The eigenstates can be classified by both the total angular momentum and the parity. As the nanocrystal radius varies, crossings occur not only between electron and hole energy levels but also among the hole levels themselves. The lowest two electron states (in each spin subspace) are surface states, one with even parity and the other with odd parity. The optical selection rules consist of two parts, namely, the parity selection and the angular momentum selection.", "url": "https://arxiv.org/abs/2611.28689", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rui Li"}], "featured_authors": [{"name": "Rui Li"}], "author_count": 1}, {"id": "2611.28705", "category": "cond-mat", "title": "Corrections to the IPR in the localized phase of the Anderson model on the Bethe lattice", "abstract": "We show that finite-size effects in the localized phase of the Anderson model on the Bethe lattice are highly anomalous. On random regular graphs of $N$ sites the inverse participation ratio (IPR) approaches its thermodynamic-limit value as $I_2(N)-I_2^\\infty\\sim N^{-\\kappa(W)}$, with a disorder-dependent exponent $0<\\kappa<1$ throughout the localized phase, and the same exponent governs the correction due to a finite imaginary regulator, $I_2(\\eta)-I_2^\\infty\\sim\\eta^{\\kappa(W)}$. We derive $\\kappa = 2\\beta-1$, with $\\beta$ the power-law tail exponent of the local density of states distribution, in a solvable model sharing the criticality of the Anderson model on the Bethe lattice. We then show that the same mechanism operates in the Anderson model itself, and find quantitative agreement with the numerics. A self-consistent one-loop treatment of the loops of finite graphs independently reproduces the finite-size corrections. Physically, a spectral identity and an exact sum rule tie both corrections to rare Mott-like resonances hybridizing distant localized eigenstates: a finite graph lacks the resonant pairs whose centers would lie farther apart than its size allows. Our results identify the scaling variable needed to extrapolate IPR data to the thermodynamic limit.", "url": "https://arxiv.org/abs/2611.28705", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tommaso Rizzo"}, {"name": "Marco Tarzia"}, {"name": "Angelica Vecchiarelli"}], "featured_authors": [{"name": "Tommaso Rizzo"}, {"name": "Marco Tarzia"}, {"name": "Angelica Vecchiarelli"}], "author_count": 3}, {"id": "2611.28709", "category": "cond-mat", "title": "Anomalous corrections to the inverse participation ratio in the localized phase on the Bethe lattice: insights from a solvable \"toy\" non-linear $σ$-model", "abstract": "In the localized phase of the Anderson model on the Bethe lattice, the inverse participation ratio (IPR) approaches its asymptotic value as the imaginary regulator $\\eta \\to 0$ with an anomalous power law, $I_2(\\eta) - I_2^\\infty \\propto \\eta^{2\\beta-1}$, where $\\beta \\in (1/2,1)$ is the tail exponent of the local density of states distribution. We derive it analytically in a \"toy\" non-linear $\\sigma$-model on the hyperbolic superplane, which shares the exotic criticality of the Bethe-lattice Anderson transition. Matching the bulk solution of its cavity equation to a boundary layer set by the symmetry-breaking field $H$ gives a correction $\\propto H^{2\\beta-1}$, controlled by the subdominant root $1-\\beta$ of the linearized equation; at criticality it becomes $\\propto 1/|\\ln H|$. Under a few natural assumptions the same mechanism operates in the Anderson model, where the correction is a zero mode of the $\\eta=0$ cavity recursion, as we confirm numerically, also for finite-size corrections. Through a spectral identity and an exact sum rule, the same exponent fixes exactly the decay $\\omega^{-\\mu}$, with $\\mu = 2(1-\\beta)$, of the correlation function of two eigenstates at energy distance $\\omega$, including its amplitude, as we confirm by exact diagonalization, population dynamics on the infinite lattice, and analytically in the toy model. A counting of Mott resonances between distant localized eigenstates explains this physically; on finite graphs, finite-size corrections reflect a deficit of doubly-peaked eigenstates. Finally, we derive the finite-size scaling of the IPR in the variable $(2\\beta-1)\\ln N$, which describes both finite-$\\eta$ and finite-$N$ data. It yields a Kosterlitz-type renormalization-group flow of the running fractal dimension: finite fractal dimensions of localized states at accessible sizes are a logarithmic finite-size effect.", "url": "https://arxiv.org/abs/2611.28709", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tommaso Rizzo"}, {"name": "Marco Tarzia"}, {"name": "Angelica Vecchiarelli"}], "featured_authors": [{"name": "Tommaso Rizzo"}, {"name": "Marco Tarzia"}, {"name": "Angelica Vecchiarelli"}], "author_count": 3}, {"id": "2611.28751", "category": "cond-mat", "title": "Quantum Hall Effect in a 3D Cross-Dimensional Quantum Anomalous Hall System", "abstract": "We systematically investigate cross-dimensional transport and the resulting quantum Hall effect in 3D quantum anomalous Hall effect systems, which are constructed by coupling two Weyl-semimetal Hamiltonians. Our study unveils that the system hosts highly anisotropic surface states and chiral modes, leading to rich quantum Hall responses. Crucially, we clarify how magnetic fields applied along three high-symmetry directions dictate the evolution of the Chern numbers, chiral modes, and Hall responses. We discover that chiral modes along different directions can originate from distinct mechanisms, giving rise to various magnetic modulation characteristics. Furthermore, we unveil the breakdown of the conventional Chern-number-based bulk-boundary correspondence under magnetic fields, where the Chern numbers alone fail to fully characterize the evolution of the chiral states. This anomalous behavior is attributed to the unique momentum-space distributions of surface bands. These insights are further validated numerically through multi-terminal Hall transport simulations. Our findings expand the understanding of magnetic-field-driven mechanisms in 3D topological systems and provide deeper insights into the interplay between quantized Hall effects and Chern numbers in 3D systems.", "url": "https://arxiv.org/abs/2611.28751", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Liang-Liang Cheng"}, {"name": "Ao-Long Li"}, {"name": "Zhi-Qiang Zhang"}, {"name": "Hua Jiang"}], "featured_authors": [{"name": "Liang-Liang Cheng"}, {"name": "Ao-Long Li"}, {"name": "Zhi-Qiang Zhang"}, {"name": "Hua Jiang"}], "author_count": 4}, {"id": "2611.28797", "category": "cond-mat", "title": "Floquet-Induced Valley Polarization and Topological Phases in Twisted Bilayer Graphene Heterostructures", "abstract": "We theoretically investigate twisted bilayer graphene (tTBG) heterostructures subjected to circularly polarized light. Inversion symmetry is broken through the combined application of an out-of-plane electric field and the incorporation of insulating substrates, enabling precise control of the valley degrees of freedom and associated topological phases. We identify a regime in which the valley degeneracy is lifted: one valley retains a gapless, linear Dirac-like dispersion, whereas the other develops a finite band gap and becomes electronically inactive. The interplay between Floquet driving and inversion-symmetry breaking induces topological phase transitions characterized by Chern numbers C = -2, C = -1, and C = 0, together with the emergence of perfectly valley-polarized domain-wall channels. Furthermore, magnetic asymmetry arising from proximity to adjacent two-dimensional ferromagnetic contacts enables spin-valley filtering. These findings establish the potential of graphene-based heterostructures as highly tunable systems for controlling spin and valley degrees of freedom.", "url": "https://arxiv.org/abs/2611.28797", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. Belayadi"}, {"name": "I. A. Assi"}, {"name": "A. Johansson"}, {"name": "C. I. Osuala"}, {"name": "H. Bahlouli"}, {"name": "Udo Schwingenschlögl"}, {"name": "J. P. F. LeBlanc"}, {"name": "A. Abbout"}], "featured_authors": [{"name": "A. Belayadi"}, {"name": "I. A. Assi"}, {"name": "A. Johansson"}, {"name": "Udo Schwingenschlögl"}, {"name": "J. P. F. LeBlanc"}, {"name": "A. Abbout"}], "author_count": 8}, {"id": "2611.28810", "category": "cond-mat", "title": "Learning free energy across a differentiable temperature range by deep generative modeling", "abstract": "Free energy governs the directionality, stability, and temperature sensitivity of physical, chemical, and biological transformations. Conventional free energy calculations, such as thermodynamic integration and free energy perturbation, often have to be performed at individual temperatures and are limited by the high cost of sampling an extensive set of thermodynamic states. Here, we introduce learned temperature-differentiable free energy perturbation (TD-FEP), a deep generative framework that learns a temperature-conditioned, invertible mapping between reference and target systems through data-free, energy-based optimization. TD-FEP thereby unifies one-shot state generation and free energy calculation across a continuous temperature range. We validated TD-FEP across a broad range of applications, including isolated molecules, periodic materials, and chemical reactions.", "url": "https://arxiv.org/abs/2611.28810", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yaowen Zhang"}, {"name": "Chen Chen"}, {"name": "Wanyu Lin"}, {"name": "Shuo-Hui Li"}, {"name": "Ding Pan"}], "featured_authors": [{"name": "Yaowen Zhang"}, {"name": "Chen Chen"}, {"name": "Wanyu Lin"}, {"name": "Shuo-Hui Li"}, {"name": "Ding Pan"}], "author_count": 5}, {"id": "2611.28811", "category": "cond-mat", "title": "Large Deviations and Critical Scaling in the Finite-Population Granovetter Threshold Model", "abstract": "We develop a systematic asymptotic analysis of the exact finite-population solution of Granovetter's threshold model, in which a single initial instigator triggers a cascade among agents with independently distributed adoption thresholds. By expressing the propagation probability as an order-statistic boundary-crossing event, we formulate its macroscopic large-deviation rate as a constrained relative-entropy minimization problem. For Beta-distributed thresholds, we obtain explicit solutions for all shape parameters $\\alpha$ and $\\beta$, identifying four possible optimal empirical threshold profiles: fully free, fully pinned, pinned--free, and free--pinned. These profiles determine both the exponential probability of macroscopic cascades and the threshold configurations responsible for their occurrence. Importance-sampling estimates confirm the analytical rate functions, while sequential Monte Carlo simulations independently reproduce the predicted optimal profiles. We also revisit the critical scaling near $\\alpha_c=1$ and confirm the principal finite-size scaling laws: the mean active fraction decays as $N^{-1/2}$ for uniform thresholds and as $N^{-1}$ for $\\alpha=1$ and $0<\\beta<1$. In the latter regime, we further derive an explicit scaling function for the logarithmic critical window from the microscopic branching-process limit. Our results provide a general framework for determining the probabilities and characteristic configurations of rare collective events in threshold-driven cascade processes", "url": "https://arxiv.org/abs/2611.28811", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "José F. Fontanari"}], "featured_authors": [{"name": "José F. Fontanari"}], "author_count": 1}, {"id": "2611.28824", "category": "cond-mat", "title": "Statistical mechanics of linear classification on hierarchical tree data", "abstract": "Deep networks owe much of their success to their ability to exploit the structure in data, from the grammar of language to the multi-scale organization of images. Yet, many statistical mechanics approaches to structured data rely on Gaussian equivalence, whose assumptions can fail when a few latent variables influence all input coordinates. In this work, we take a step beyond this setting with a simple setup, in which a linear classifier is trained to infer the root of the classical broadcast process on a tree from its $N$ leaves. Despite this simplicity, the data already display non-Gaussian statistics along the direction carrying the label, as well as strong finite-size effects. By retaining the exact law along this direction and approximating the transverse fluctuations as Gaussian, we obtain a finite-depth replica theory that accurately describes the measured learning curves. At large depth and sufficiently weak regularization, we uncover a double descent whose two stages are separated in scale. In a range of broadcast noise below the reconstruction threshold, the first descent occurs at a number of samples scaling as $N^\\omega$, with $0<\\omega<1$ set by the data statistics, whereas the overfitting peak occurs at order $N$ samples. Beyond linear classifiers, this setup could serve as a controlled starting point to study deeper architectures and generative models on hierarchical data.", "url": "https://arxiv.org/abs/2611.28824", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jerome Garnier-Brun"}, {"name": "Federica Kulka"}, {"name": "Carlo Lucibello"}], "featured_authors": [{"name": "Jerome Garnier-Brun"}, {"name": "Federica Kulka"}, {"name": "Carlo Lucibello"}], "author_count": 3}, {"id": "2611.29070", "category": "cond-mat", "title": "Finite-size reversal of a multiparticle correction to local spin spectra in a flux-disordered Kitaev honeycomb model", "abstract": "A spin flip in the Kitaev honeycomb model changes the flux background and therefore the Hamiltonian seen by the matter fermions. Can a one-particle approximation with the correct total spin intensity nevertheless misestimate the depth of a depression in the local spin spectrum? We test this question in a frozen, flux-disordered ensemble by retaining the actual one-particle transition energies and relative spectral weights after the spin flip, then rescaling those weights to match the full intensity. We measure the depression by subtracting the central intensity from the average at two flanking frequencies. For spin-created states with odd final quasiparticle number and nonzero one-particle weight, restoring multiparticle weight shallows the depression on 24 sites and deepens it on both 1,536-site shapes and the 3,456- and 6,144-site tori, as judged by the median paired correction at each of two energy resolutions. For these states, the one-particle approximation overestimates the mean dip depth by about 16-18% on 24 sites and underestimates it by 33-56% in the 6,144-site sample. Extrapolating from 24 sites would therefore give the wrong sign for this correction on those four larger tori under the same disorder prescription.", "url": "https://arxiv.org/abs/2611.29070", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "David C. Ronquillo"}], "featured_authors": [{"name": "David C. Ronquillo"}], "author_count": 1}, {"id": "2611.29093", "category": "cond-mat", "title": "Interface invariants of rhombohedral graphene with layer-dependent potentials and couplings", "abstract": "Domain walls in the perpendicular bias of rhombohedral (ABC-stacked) graphene bind valley-resolved interface modes whose signed number is fixed by a bulk-difference invariant. We determine which values of this invariant are reachable when the layer potentials are arbitrary monotone profiles, as produced by screening, and when the interlayer couplings vary from bond to bond. Within the single-particle continuum model, the invariant of an $m$-layer stack equals the difference of occupied angular weights of the zero-momentum levels, which reduces the classification to the ordering of those levels. At equal coupling, nonlinear monotone potentials reproduce exactly the set of invariants of linear potentials, also under the requirement of a common energy gap: screening moves phase boundaries but creates no new invariant values. With bond-dependent coupling, we characterize all occupied configurations. The range of attainable invariants is unchanged, but the gaps inside it are filled, beginning at five layers. Reflection-symmetric stacks realize a large subfamily with a guaranteed common gap, and lower bounds on single-bulk gaps complete the set of invariants with a common global gap for five and six layers. Among the examples is an eight-layer domain wall defined purely by gates, whose number of co-propagating channels per valley switches from 8 to 16 as the gate strength increases. Exact transfer-matrix calculations of the interface spectrum reproduce every predicted signed crossing count. A norm bound gives the minimum spread of interlayer coupling compatible with a prescribed gap.", "url": "https://arxiv.org/abs/2611.29093", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuelong Li"}], "featured_authors": [{"name": "Yuelong Li"}], "author_count": 1}, {"id": "2611.29174", "category": "cond-mat", "title": "An informational interpretation of the reverse nonequilibrium molecular dynamics", "abstract": "Reverse nonequilibrium molecular dynamics (RNEMD) is an efficient simulation method for determining transport coefficients. In this method, a flux is imposed by a seemingly artificial nonlocal exchange operation and the corresponding thermodynamic gradient is induced as a result, apparently reversing the usual force-flux causality. Although this method is well studied as a simulation technique, developing an information-thermodynamic interpretation of its Maxwell-demon-type operation and the associated apparent reversal of force-flux causality would provide a solid physical foundation for algorithms of this type. Here, we develop an information-reservoir interpretation for a representative RNEMD scheme for determining self-diffusivity. We show that the statistical bias of the information reservoir defines an information affinity that sustains a concentration gradient and a diffusive flux in the steady state. We further derive the linear transport coefficient corresponding to the information affinity in the linear response regime. Using the large deviation functional for the steady-state densities and currents, we also establish a fluctuation theorem for entropy production and the thermodynamic uncertainty relation linking entropy production to the fluctuations of the particle current. Computer simulations are performed to corroborate our theoretical results.", "url": "https://arxiv.org/abs/2611.29174", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuxing Jiao"}, {"name": "Mingcheng Yang"}], "featured_authors": [{"name": "Yuxing Jiao"}, {"name": "Mingcheng Yang"}], "author_count": 2}, {"id": "2611.29317", "category": "cond-mat", "title": "Quantum-Metric-Driven Hollow Wigner Crystals", "abstract": "Recent studies have revealed the profound influence of Berry curvature on electron crystallization, yet the independent role of the quantum metric remains unclear. Here, we introduce a minimal three-band continuum model with separately tunable quantum metric and Berry flux. Employing the Hartree-Fock approach, we find that a conventional s-wave Wigner crystal can develop a hollow charge distribution with depleted density at lattice sites, without a change in symmetry or topology. We show that this density reconstruction occurs even at vanishing Berry curvature and arises from strong quantum metric and the nontrivial angular structure of the form factor. In our model, the continuous crossover between hollow and conventional WCs is accompanied by anomalous direct exchange interactions, nearly vanishing at intermediate quantum metric but enhanced by over an order of magnitude in the strong-metric regime. These results reveal how quantum metric can reshape both the charge distribution and exchange interactions of electron crystals beyond simple wave-function delocalization.", "url": "https://arxiv.org/abs/2611.29317", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zekun Zhuang"}], "featured_authors": [{"name": "Zekun Zhuang"}], "author_count": 1}, {"id": "2611.29349", "category": "cond-mat", "title": "Graph Neural Networks for Accurate Quasiparticle Energy Levels in Large Supercells of Transition Metal Dichalcogenides", "abstract": "The GW method is the one of the main workhorses of the materials science community to accurately calculate the electronic bandgap of materials, as it overcomes the gap underestimation problem from Density Functional Theory (DFT). Despite its accuracy, its computational cost becomes prohibitive when calculations have more than 10-100 atoms, which makes more difficult its use for defects, surfaces and moiré systems that demand large supercells. To overcome this problem, we developed a Graph Neural Network trained with smaller GW calculations which can make accurate predictions on large supercells at a small fraction of the computational cost. Our model uses as features the projection of DFT wavefunctions into localized atomic orbitals, while graph nodes represent the atomic positions and edges represent atom to atom distances, which captures the system geometry. We explore how to do \"small AI\", providing a workflow of how to create a personal and convenient dataset of GW calculations to train the model that can be applied to different materials so that the final user does not need to rely on massive datasets. We define what must be included in the training dataset to capture the physics of our objective simulation, and perform a Bayesian optimization of hyperparameters. In the case of monolayer MoS$_2$ with a sulfur vacancy our GNN models achieve high accuracy (MAE ranging 10 to 50 meV) with a simplified workflow applicable to other materials, accelerating accurate large electronic structure calculations.", "url": "https://arxiv.org/abs/2611.29349", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rafael R. Del Grande"}, {"name": "David A. Strubbe"}], "featured_authors": [{"name": "Rafael R. Del Grande"}, {"name": "David A. Strubbe"}], "author_count": 2}, {"id": "2611.29362", "category": "cond-mat", "title": "Renormalization-group analysis of two-dimensional long-range XY models with $p$-fold anisotropy: the $σ=2$ boundary", "abstract": "The two-dimensional classical XY model with $1/r^{2+\\sigma}$ interactions has recently been shown to undergo, at the marginal case $\\sigma=2$, a continuous transition into a logarithmic quasi-long-range-ordered (log-QLRO) phase where the correlation decays as $C(r) \\sim (\\ln r)^{-\\eta_\\ell}$. We study how a $p$-fold field $h_p\\cos(p\\theta)$ modifies this picture. Using the physical vortex and $p$-fold field fugacities, we construct a unified set of renormalization-group (RG) equations that interpolate between the short-range (SR) and long-range (LR) cases through an LR coupling parameter $\\kappa$. For $p<4$, the small-$h_p$ perturbative treatment breaks down and the critical behavior lies beyond the present RG treatment. For $p>4$, the field is irrelevant at the pure fixed point, but at low temperature the LR enhancement drives the stiffness upward: log-QLRO appears only as a finite-scale crossover, and the only transition is the continuous one from the disordered into the $p$-fold-ordered phase. For $p=4$, the fixed line shifts from the SR Ashkin-Teller form, and the transition into the fourfold-ordered phase has a nonuniversal correlation-length exponent depending on both $\\kappa$ and $h_4$. These results support the $\\sigma_*=2$ boundary, in contrast to Sak's criterion.", "url": "https://arxiv.org/abs/2611.29362", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xianzhi Pan"}, {"name": "Chengxiang Ding"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Xianzhi Pan"}, {"name": "Chengxiang Ding"}, {"name": "Youjin Deng"}], "author_count": 3}, {"id": "2611.29495", "category": "cond-mat", "title": "Ground-State Manifold Curvature and Phase Transitions in the Kitaev Honeycomb Model", "abstract": "The Kitaev honeycomb model is an exactly solvable spin model whose ground state realizes a quantum spin liquid with gapped Abelian phases and a gapless phase that becomes a non-Abelian phase in a magnetic field. Here we study its phase transitions through the geometry of the ground-state manifold, using the Ricci scalar of the quantum metric. In the three gapped phases we obtain closed-form expressions for the curvature, which is negative and diverges at the critical lines; the three phases are related to one another by an exact change of coordinates. In the gapless phase, the curvature of the infrared-regularized metric is positive and decays inversely with the logarithm of the system size, with a size-independent amplitude that diverges at the phase boundaries, with an exponent different from that of the gapped side. The change of sign and the divergences together reproduce the complete phase diagram. A magnetic field gaps out the gapless phase and plays the role of the infrared cutoff, so that away from the critical lines the curvature of the non-Abelian phase becomes finite and positive, while around the critical lines it opens a crossover region whose width scales quadratically with the field. Since divergences of geometric quantities are often regarded as signatures of phase transitions, the divergence of the Ricci scalar at the critical lines provides a geometric signature of these transitions.", "url": "https://arxiv.org/abs/2611.29495", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Omid Yahyayi Monem"}, {"name": "Setare Bashari"}, {"name": "Hosein Mohammadzadeh"}], "featured_authors": [{"name": "Omid Yahyayi Monem"}, {"name": "Setare Bashari"}, {"name": "Hosein Mohammadzadeh"}], "author_count": 3}, {"id": "2611.29537", "category": "cond-mat", "title": "Exact superdiffusion exponents and hull exploration of chiral random walkers on critical percolation clusters", "abstract": "Generalizing de Gennes' ant-in-the-labyrinth concept, we consider a chiral random walker on a percolation cluster at criticality. The fully chiral ant clings to obstacle boundaries and traces the fractal hulls of the cluster, spreading with the exact walk dimension $7/4$ until its orbit closes. Because the cluster contains holes on all scales, the ensemble spreads superdiffusively, $\\langle r^2\\rangle\\sim t^{89/84}$, carried by a diminishing fraction of walkers whose orbits are still open. Both exponents follow from percolation geometry alone, and agree well with large-scale numerical simulations. When the walker turns chirally only with probability $\\chi<1$, superdiffusion gives way to the subdiffusion of the ant at a crossover time set by both exponents, with a diffusion coefficient enhanced by $(1-\\chi)^{-2/d_w}$. The relation between crossover time and diffusion coefficient does not depend on how chirality is realized, offering a direct test for chiral tracers in disordered media.", "url": "https://arxiv.org/abs/2611.29537", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Joshua Uhlig"}, {"name": "Ralf Metzler"}, {"name": "Erik Kalz"}], "featured_authors": [{"name": "Joshua Uhlig"}, {"name": "Ralf Metzler"}, {"name": "Erik Kalz"}], "author_count": 3}, {"id": "2611.29574", "category": "cond-mat", "title": "MagPot: A magnetoelastic potential generator for molecular dynamics simulations", "abstract": "Magnetoelastic phenomena originate from the coupling between atomic displacements and magnetic degrees of freedom, and their atomistic simulation requires interatomic models in which magnetic interactions depend explicitly on interatomic distance. This paper presents MagPot, a Python program that generates Bethe-Slater parameter sets for spin-lattice molecular dynamics simulations using the SPIN package of the Large-scale Atomic/Molecular Massively Parallel Simulator (LAMMPS). From a compact set of material properties, the program determines the radial functions describing Heisenberg exchange and the dipole and quadrupole contributions of the two-ion Néel interaction. Version 1.0 supports simple-cubic, body-centred-cubic and face-centred-cubic lattices with ferromagnetic and antiferromagnetic configurations. A central feature of MagPot is its modular architecture, which allows the magnetic contribution it generates to be combined additively with a broad range of compatible non-magnetic interatomic potentials. The parameterisation workflow is assessed through equation-of-state, Curie-temperature, volume-magnetostriction, pressure-dependent magnetocrystalline-anisotropy and anisotropic-magnetoelastic tests. By automating the construction of the magnetic contribution to the interatomic model, MagPot offers a straightforward and reproducible route from material properties to LAMMPS-ready magnetic interactions, facilitating large-scale atomistic simulations of magnetoelasticity and magnetostriction, as well as physical phenomena associated with magnon-phonon coupling.", "url": "https://arxiv.org/abs/2611.29574", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "P. Nieves"}, {"name": "I. Korniienko"}, {"name": "S. Arapan"}, {"name": "A. Fraile"}, {"name": "R. Iglesias"}, {"name": "D. Legut"}], "featured_authors": [{"name": "P. Nieves"}, {"name": "I. Korniienko"}, {"name": "S. Arapan"}, {"name": "A. Fraile"}, {"name": "R. Iglesias"}, {"name": "D. Legut"}], "author_count": 6}, {"id": "2611.29645", "category": "cond-mat", "title": "Kinetic inductance of two-dimensional viscous electron fluid", "abstract": "Modern high-mobility two-dimensional electron systems are pure enough to manifest hydrodynamic regime of electron transport similar to dynamics of classical fluids. With the bulk scattering controlled by momentum-conserving electron-electron collisions, these novel hydrodynamic materials demonstrate systematic violation of conventional metallic behavior due to the Drude model in stationary electric transport. In this letter, we study the linear reactive AC response of 2D electron fluid in a narrow channel geometry and show that the essentially non-local viscous dissipation induces non-trivial size effect in it. In particular, kinetic inductance, which represents collective inertia of the entire electron fluid, is enhanced by non-uniform flow profile and, in contrast to diffusive transport, dominates the electrical impedance already in collisional regime by virtue of viscous skin effect. The onset of reactive behavior falls within the microwave frequency domain in the state-of-the-art 2D hydrodynamic conductors which makes them promising material system for applications in high-frequency electronics at elevated temperatures.", "url": "https://arxiv.org/abs/2611.29645", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. A. Grigorev"}, {"name": "A. N. Afanasiev"}], "featured_authors": [{"name": "A. A. Grigorev"}, {"name": "A. N. Afanasiev"}], "author_count": 2}, {"id": "2611.29649", "category": "cond-mat", "title": "Geometry Reorganizes Nonequilibrium States that Gate Topological Switching in an Active Polymer", "abstract": "Even under identical external conditions, a driven system can occupy distinct long-lived states with different susceptibilities to the same rare transition. We demonstrate this in a confined partially active polymer, where independent unknotted replicas occupy distinct mechanical states with different topological futures. Matched-control and event-resolved analyses reveal a susceptible reservoir and a short threading precursor. We test this state dependence prospectively by launching 2272 Langevin-noise branches from 71 preserved unknotted phase-space states using a classifier prespecified from independent data. Most strikingly, the same classifier strongly separates finite-time knotting at one pore radius, yet reverses its susceptibility ordering at a neighboring radius. Thus geometry does not merely shift an average knotting rate; it selects among long-lived nonequilibrium states and reorganizes the mapping between a pre-existing mechanical coordinate and future topological fate.", "url": "https://arxiv.org/abs/2611.29649", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shiqi Zhou"}], "featured_authors": [{"name": "Shiqi Zhou"}], "author_count": 1}, {"id": "2611.29754", "category": "cond-mat", "title": "Exact many-body scars of generic spin models from singlet covers", "abstract": "The square-lattice transverse-field Ising model has exact zero-energy eigenstates at any field: products of singlets on alternate plaquette diagonals. A longitudinal field isolates them from a symmetry-protected degeneracy. The mechanism is that a site coupled equally to both ends of a singlet annihilates it. The result thus holds for any spin $s$, anisotropic exchange, a large class of bond disorder and certain three-spin terms. This mechanism decides which lattices host such states: two of the 11 Archimedean lattices (four at $s=1/2$), bcc and quasicrystals with spins on the edges. Singlet pumping cools any state into them.", "url": "https://arxiv.org/abs/2611.29754", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Camilla Polvara"}, {"name": "William Witczak-Krempa"}], "featured_authors": [{"name": "Camilla Polvara"}, {"name": "William Witczak-Krempa"}], "author_count": 2}, {"id": "2611.29791", "category": "cond-mat", "title": "A phenomenological decomposition of SRC-inspired occupation effects in imbalanced Fermi superfluids", "abstract": "Imbalanced two-component Fermi superfluids are usually formulated with sharp Fermi-step occupations, although interacting systems exhibit depletion below the Fermi surface and a high-momentum tail. We introduce a sector-resolved phenomenological framework in which one prescribed short-range-correlation (SRC)-inspired momentum distribution modifies either the anomalous pairing contribution (model P), the imbalance-induced blocking term (model B), or both (model P+B). The four realizations---ideal, P, B, and P+B---are compared through the grand-potential landscape and through a fixed-density reconstruction of the paired/phase-separated to polarized-normal boundary in three and two dimensions. In both dimensionalities, the pairing-sector modification accounts for nearly all of the reduction in the critical polarization, whereas the blocking-sector correction remains subdominant. Consequently, the phase boundaries form two nearly degenerate pairs, ideal $\\simeq$ B and P $\\simeq$ P+B. These results quantify, within the stated phenomenological construction, how a prescribed SRC-inspired occupation propagates separately through the pairing and blocking sectors of an imbalanced superfluid.", "url": "https://arxiv.org/abs/2611.29791", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lucas A. Souza"}], "featured_authors": [{"name": "Lucas A. Souza"}], "author_count": 1}, {"id": "2611.29875", "category": "cond-mat", "title": "Sondheimer oscillations in Weyl semimetal films", "abstract": "In conducting films subject to an out-of-plane magnetic field, electron motion between the surfaces gives rise to conductance oscillations periodic in magnetic field, known as Sondheimer oscillations. While this size effect has been investigated in conventional metals, its dependence on the Berry curvature of topological materials remains less explored. In this work, we extend the semiclassical Boltzmann description of Sondheimer oscillations to type-I Weyl semimetal films. We account for the Berry curvature, the orbital magnetic moment and the effect of the Zeeman coupling on the Fermi wavevector and the electronic group velocity. The Berry curvature and the orbital magnetic moment generate a beating pattern and chirping in the Sondheimer oscillations. In the thick-film and thin-film regimes, we provide analytical expressions for the longitudinal conductivity, which highlight the interplay between electronic band topology and boundary-scattering in magnetotransport.", "url": "https://arxiv.org/abs/2611.29875", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lucas Méchet"}, {"name": "Louis-Thomas Gendron"}, {"name": "Ion Garate"}], "featured_authors": [{"name": "Lucas Méchet"}, {"name": "Louis-Thomas Gendron"}, {"name": "Ion Garate"}], "author_count": 3}, {"id": "2611.30015", "category": "cond-mat", "title": "Nonmonotonic In-Plane Thermal Transport in Metal-Embedded Graphitic Carbon Nitride", "abstract": "Embedding metal atoms within the intrinsic cavities of graphitic carbon nitride (g-C3N4) modifies its local bonding and vibrational properties, yet its consequences for lattice thermal transport remain poorly understood. Here, we combine a machine-learned potential (MLP) with homogeneous nonequilibrium molecular dynamics (HNEMD) to investigate in-plane thermal transport in Cu-embedded g-C3N4 across the full range of cavity occupation. The thermal conductivity exhibits a pronounced nonmonotonic dependence on Cu occupation, decreasing at intermediate occupation and partially recovering as the cavities approach full occupation. Frequency-resolved analysis reveals that this behavior originates from the competition between two phonon contributions. The low-frequency vibrations introduced by Cu couple to the intrinsic modes of g-C3N4, reconstructing the phonon dispersion and suppressing thermal transport below 10 THz. With increasing Cu occupation, the collective mechanical response of the N atoms surrounding the cavities is enhanced, accompanied by increased phonon group velocities in the 20-30 THz range and a corresponding recovery of the high-frequency thermal contribution. The competition between the saturating low-frequency suppression and the increasing high-frequency contribution gives rise to the nonmonotonic thermal conductivity. A similar occupation dependence and spectral redistribution are observed for Ag-embedded g-C3N4. These results identify competing phonon contributions as the microscopic origin of nonmonotonic thermal transport in metal-embedded g-C3N4 and suggest that occupation of intrinsic cavities provides a route to redistributing phonon transport in porous crystalline materials.", "url": "https://arxiv.org/abs/2611.30015", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wenwu Jiang"}, {"name": "Hekai Bu"}, {"name": "Wei Qiu"}, {"name": "Yong Ni"}], "featured_authors": [{"name": "Wenwu Jiang"}, {"name": "Hekai Bu"}, {"name": "Wei Qiu"}, {"name": "Yong Ni"}], "author_count": 4}, {"id": "2611.30053", "category": "cond-mat", "title": "Trajectory arclength reveals thermodynamic criticality", "abstract": "Thermodynamic criticality arises at continuous phase transitions, where collective interactions produce non-analytic behavior in equilibrium thermodynamic quantities in the thermodynamic limit. We show that this criticality also leaves an analytically predictable signature in the arclength of microscopic Hamiltonian trajectories. For the attractive Hamiltonian mean-field model, we derive the thermodynamic limit of the equilibrium-averaged arclength, formulated as a normalized Lagrangian descriptor, and demonstrate that it develops a kink precisely at the phase transition. We trace this non-analyticity to spontaneous magnetization and derive the leading critical finite-size correction, scaling as $N^{-1/2}$ with an explicit analytical prefactor. Simulations with up to $10^5$ degrees of freedom confirm both predictions without adjustable parameters. Requiring neither tangent-space evolution nor prior specification of an order parameter for its computation, trajectory arclength provides a simple, quantitative link between microscopic Hamiltonian motion and collective thermodynamic criticality.", "url": "https://arxiv.org/abs/2611.30053", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jiménez-López"}, {"name": "Javier"}, {"name": "García-Garrido"}], "featured_authors": [{"name": "Jiménez-López"}, {"name": "Javier"}, {"name": "García-Garrido"}], "author_count": 3}, {"id": "2611.30076", "category": "cond-mat", "title": "NEP-Spin: A spin-dependent neuroevolution potential for large-scale spin--lattice simulations", "abstract": "NEP-Spin is a \\glsentrylong{nep} for coupled atomic motion and variable-length magnetic moments. Local bond and spin tensors give an energy invariant under independent spin and spatial rotations without \\glsentrylong{soc} and under joint rotations with it. We benchmark energies, atomic forces, and magnetic forces on public datasets for collinear Fe--Al and noncollinear Fe. In multiferroic \\glsentrylong{bfo}, the predicted zero-field cycloid period is 69.7~nm, compared with 62--63~nm from neutron scattering. An electric field of 20~mV/Å opposite to the polarization lengthens the period to 93.2~nm, while imposing the same polar displacement at zero field gives 85.1~nm. In a uniform antiferromagnetic cell at fixed lattice vectors, 6~T magnetic fields along orthogonal basal axes reorient the Fe moments and give opposite signs of the ionic polarization change $\\Delta P_y$. First-principles ionic relaxations at the predicted moment vectors reproduce both signs. In a 2.79-million-atom ferroelectric twin, the cycloid rotation planes tilt by different amounts from their shared initial plane and remain distinct over 10~ps at 100~K. At 10~ps the propagation axes lie within about $7^\\circ$ of their initial directions. With inertial spin dynamics, GPUMD advances a 5.93-million-atom BiFeO$_3$ cell at 21.8 million atom-steps per second on four RTX 4090 GPUs.", "url": "https://arxiv.org/abs/2611.30076", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chengbing Chen"}, {"name": "Zheyong Fan"}, {"name": "Ben Xu"}], "featured_authors": [{"name": "Chengbing Chen"}, {"name": "Zheyong Fan"}, {"name": "Ben Xu"}], "author_count": 3}, {"id": "2611.30143", "category": "cond-mat", "title": "Projecting Fermions into Exact Scar Towers: Local Protection across Phase Transitions", "abstract": "We construct exact scar towers in $SO(n)$ ($n\\ge3$) spin chains by Gutzwiller projection of $n$-flavor flat-band Kitaev chains. The projected roots have only singlet and antisymmetric components on each bond. These local constraints allow a staggered flavor flip to generate an equidistant tower. The root and its first descendant exhaust the two-site configurations that are visited by the tower, leaving an orthogonal bond subspace unvisited. Deformations within this subspace can break $SO(n)$ symmetry and reshape the low-energy physics without altering the exact scar tower. A polarization-selective deformation drives an exact first-order transition from the symmetry-protected topological phase to a ferromagnetic phase. The tower retains its wave functions and absolute energies across the phase transition, including at the gapless point. Exact scars therefore need not inherit the symmetries, order parameters, or criticality of the ground state.", "url": "https://arxiv.org/abs/2611.30143", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wenjie Wei"}, {"name": "Kun Jiang"}, {"name": "Hui-Ke Jin"}], "featured_authors": [{"name": "Wenjie Wei"}, {"name": "Kun Jiang"}, {"name": "Hui-Ke Jin"}], "author_count": 3}, {"id": "2611.30152", "category": "cond-mat", "title": "A Unified Energy-Density Framework for Moiré Interface Energetics and Mechanics", "abstract": "The mechanical response of moiré interfaces depends on how atomic registry combines with contact size and boundary geometry. An analytical description must retain this discrete lattice information while connecting microscopic interactions to the energetics of finite contacts. Here, we develop a unified energy-density framework for rigid van der Waals interfaces by expressing registry-dependent pair potentials and atomic densities in reciprocal space. The resulting formulation accommodates different lattice bases and atomic species, linking single-atom and molecular adsorption to infinite bilayers and finite crystalline contacts. Explicit expressions for circular and regular polygonal flakes separate the area contribution from boundary-dependent terms and connect microscopic corrugation coefficients to energy barriers, rotational torques, and interlayer shear stiffnesses. The boundary analysis recovers the quarter-power area scaling of the barrier envelope for circular flakes and distinguishes bounded oscillations from square-root area scaling for polygonal contacts according to edge orientation. A dimensionless criterion characterizes the polygon-to-circle crossover in terms of moiré wavelength, flake size, and side number. Direct-summation benchmarks support the finite-domain expressions, while calculations for two-dimensional ice on graphene demonstrate the corresponding boundary-scaling trends in a molecular lattice. Applications to interlayer shear and graphite compression connect the same microscopic interaction description to tangential and normal mechanical responses. The framework establishes an analytical connection between microscopic registry, moiré periodicity, and finite-domain geometry, providing a basis for understanding and tailoring the energetics and mechanics of van der Waals contacts.", "url": "https://arxiv.org/abs/2611.30152", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhangke Lei"}, {"name": "Weidong Yan"}, {"name": "Zhicheng Feng"}, {"name": "Wengen Ouyang"}], "featured_authors": [{"name": "Zhangke Lei"}, {"name": "Weidong Yan"}, {"name": "Zhicheng Feng"}, {"name": "Wengen Ouyang"}], "author_count": 4}, {"id": "2611.30160", "category": "cond-mat", "title": "Generation and non-thermal annealing of dislocations and atomic-scale roughness by nonlinear surface acoustic waves", "abstract": "Surface acoustic waves (SAWs) are widely used to probe near-surface material properties and microstructure, but their potential to drive permanent structural modification remains largely unexplored. Large-scale molecular dynamics simulations reveal the mechanisms of defect generation and evolution induced by nonlinear Rayleigh waves in Pt. Strong crystallographic dependence of the nonlinear evolution is observed. SAWs on Pt(111) undergo rapid nonlinear sharpening and shock formation, with localized elastic energy and increasing near-surface stresses, whereas much weaker sharpening on Pt(001) allows dissipation to compete effectively with shock formation. For sufficiently strong SAWs on Pt(111), Shockley partial dislocations are emitted from the surface when the resolved shear stress approaches the theoretical shear strength. The highly localized and rapidly changing stress field at the shock front activates multiple slip systems and promotes crossslip and reactions between Shockley partials, producing complex dislocation structures with sessile stair-rod segments. Subsequent SAW interactions activate dislocation sources on slip systems where the stress is insufficient for homogeneous nucleation, leading, in one case, to sequential emission of Shockley partials and formation of a subsurface twinned domain. Repeated SAW passages progressively reduce dislocation density, demonstrating SAW-driven nonthermal annealing. Dislocation interactions with the free surface generate atomic-scale steps, terraces, and other under-coordinated configurations, providing a microscopic pathway for permanent surface modification that may contribute to the acoustically enhanced catalytic activity observed on Pt surfaces. These results establish nonlinear SAWs as drivers of nonthermal defect generation, restructuring, and annealing, opening opportunities for acoustic processing of near-surface microstructure.", "url": "https://arxiv.org/abs/2611.30160", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuan Xu"}, {"name": "Maxim V. Shugaev"}, {"name": "Leonid V. Zhigilei"}], "featured_authors": [{"name": "Yuan Xu"}, {"name": "Maxim V. Shugaev"}, {"name": "Leonid V. Zhigilei"}], "author_count": 3}, {"id": "2611.30210", "category": "cond-mat", "title": "Quantum Geometry Effects in Lattice Dynamics", "abstract": "Quantum geometric effects such as the Berry curvature and the quantum metric are well established in electronic transport, whereas in lattice dynamics the Berry curvature also plays a key role: adiabatically following the lattice, electrons generate a molecular Berry curvature that splits degenerate optical phonons into chiral partners. To determine how the quantum metric affects phonons, we go beyond adiabatic lattice dynamics, identifying Berry curvature and quantum metric contributions to the electronic response of the lattice. Using first-principles calculations in the magnetic topological semimetal EuB$_6$, we find that phonon modes with chiral splitting and those with nonchiral splitting coexist. Unlike the former, which originate from the Berry curvature, the latter arise from the pure quantum metric, while the Berry curvature contribution is forbidden by crystal symmetry.", "url": "https://arxiv.org/abs/2611.30210", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Haoshu Li"}, {"name": "Hao Chen"}, {"name": "Qian Niu"}], "featured_authors": [{"name": "Haoshu Li"}, {"name": "Hao Chen"}, {"name": "Qian Niu"}], "author_count": 3}, {"id": "2611.30232", "category": "cond-mat", "title": "Dynamical evolution and rheological behavior of a sheared compound vesicle with a highly viscous core: a mesoscale particle-based study", "abstract": "We study numerically the dynamics and the rheology of a two-dimensional compound vesicle in wall-bounded shear flow, as a minimal model of a nucleated cell. We consider the configuration in which the annular fluid is iso-viscous with the external one, while the inner core is more viscous. Increasing the core viscosity drives the external vesicle away from steady tank-treading at values $\\phi \\geq 0.6$. When an internal body is present, the annular fluid partially shields the outer membrane from the viscous core, so that at small filling fractions the external vesicle retains tank-treading with a higher inclination angle and the intrinsic viscosity stays comparatively low. The internal vesicle, by contrast, tumbles and migrates away from the center, and at high $\\phi$ this motion couples back to the host, producing intermittent shape excursions of the external membrane. The inner viscous body thus acts as an internal governor of the dynamical state.", "url": "https://arxiv.org/abs/2611.30232", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. Lamura"}], "featured_authors": [{"name": "A. Lamura"}], "author_count": 1}, {"id": "2611.30245", "category": "cond-mat", "title": "Growing Knot Embeddings into Spherical Graphs", "abstract": "Knotted structures occur throughout soft matter and biology, where topological constraints can shape relaxation and spatial organization. Here, we introduce a computational construction that maps a specific 3D knot embedding to a graph embedded on the sphere through growth and interfacial-energy relaxation. For standard 3D embeddings of prime knots with at most seven crossings, we obtain a family of growth-based graphs that generally differ from the corresponding Tait graphs. We further identify an empirical growth-graph reconstruction rule based on polygonal regions with alternating crossing structure in a knot diagram. Non-minimal diagrams demonstrate that these graphs are not knot invariants, while selected connected sums suggest that graph features associated with their prime factors can remain recognizable. Determining how these graphs transform under isotopy may reveal invariant features, which we leave for future study.", "url": "https://arxiv.org/abs/2611.30245", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Eren Gülmez"}, {"name": "Joost de Graaf"}], "featured_authors": [{"name": "Eren Gülmez"}, {"name": "Joost de Graaf"}], "author_count": 2}, {"id": "2611.30297", "category": "cond-mat", "title": "Anatomy of orbital and spin responses in GaAs and Si: Hall, inverse Faraday, and magneto-optical Kerr effects", "abstract": "Magneto-optical signals in nonmagnetic semiconductors entangle spin and orbital contributions, both in angular-momentum generation and magneto-optical detection. We calculate these contributions for electron-doped GaAs and Si using density-functional theory, linear-response theory, and a second-order density-matrix treatment of the inverse Faraday effect. At small electron doping, the intrinsic orbital Hall conductivity exceeds its spin counterpart in magnitude, while the orbital contribution to light-induced magnetization dominates over broad photon-energy ranges. We show that orbital- and spin-resolved optical Hall and polar Kerr coefficients exhibit stronger sensitivity to orbital moments than to equal spin moments. This contrast reflects direct electric-dipole coupling to orbital motion versus spin-orbit-mediated coupling to spin polarization. Consequently, Si maintains a substantial orbital magneto-optical response despite its weak spin-orbit interaction. At probe energies of 1.5 eV in GaAs and 3.0 eV in Si, the magnitude of the Kerr rotation per unit orbital moment is approximately 5 and 13 times larger than that per unit spin moment, respectively. Combining the calculated Hall conductivities and Kerr coefficients with a phenomenological drift-diffusion model yields predominantly orbital edge signals for the assumed diffusion constants and relaxation lengths. These results indicate that optical detection of induced magnetization in doped semiconductors such as GaAs and Si can be dominated by orbital signals, and therefore cannot be interpreted solely in terms of spin polarization.", "url": "https://arxiv.org/abs/2611.30297", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sanaz Alikhah"}, {"name": "Daegeun Jo"}, {"name": "Peter M. Oppeneer"}], "featured_authors": [{"name": "Sanaz Alikhah"}, {"name": "Daegeun Jo"}, {"name": "Peter M. Oppeneer"}], "author_count": 3}, {"id": "2611.30330", "category": "cond-mat", "title": "Atomistic insight into defect-mediated boron redistribution and high-temperature strengthening in TiAl alloys", "abstract": "Boron (B) microalloying can effectively refine microstructures of as-cast TiAl alloys and regulate their mechanical properties. Yet, how dilute B exists in TiAl and interacts with defects and how these interactions govern high-temperature deformation remain elusive. Here, we systematically elucidate defect-mediated B redistribution in TiAl alloys and its consequences for their deformation using hybrid grand-canonical Monte Carlo/molecular dynamics simulations augmented with a newly developed high-fidelity machine-learning potential. As a typical product of B microalloying, borides are markedly stiffer than the TiAl matrix and act as brittle reinforcing phases, while borides/matrix interfacial adhesion depends on surface termination and stacking sequence. In the bulk, interstitial B tends to be trapped at Ti-rich octahedral sites by high migration barriers but can kinetically evolve into substitutional dopants upon approaching Al vacancies. Increased tensile stress and vacancy concentration further promote B enrichment in the bulk. B is enriched at semi-coherent $\\gamma/\\alpha_2$ boundaries and preferentially partitions into the $\\alpha_2$ phase. In polycrystalline TiAl, B accumulates primarily in disordered regions, raising the average flow stress by 9.4% at 1 at.% B and 900 K. This strengthening is accompanied by reduced shear strain accumulation. Simulated microstructural evolution and stacking-fault energetics indicate that B impedes dislocation glide via local pinning and suppresses deformation twinning, thereby increasing resistance to plastic deformation. By linking solute redistribution to defect interactions and deformation, these findings establish an atomistic framework for understanding and designing high-performance alloys based on interstitial solutes.", "url": "https://arxiv.org/abs/2611.30330", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xiang Meng"}, {"name": "Shuhei Shinzato"}, {"name": "Zhiqiang Zhao"}, {"name": "Linfeng Yu"}, {"name": "Jian Guo"}, {"name": "Liangli Chu"}, {"name": "Kepeng Ouyang"}, {"name": "Shigenobu Ogata"}, {"name": "Zhuhua Zhang"}], "featured_authors": [{"name": "Xiang Meng"}, {"name": "Shuhei Shinzato"}, {"name": "Zhiqiang Zhao"}, {"name": "Kepeng Ouyang"}, {"name": "Shigenobu Ogata"}, {"name": "Zhuhua Zhang"}], "author_count": 9}, {"id": "2611.30343", "category": "cond-mat", "title": "Edge-asymmetric magnetism in semi-Dirac quantum dots", "abstract": "In this study, we investigated the electronic and magnetic properties of quantum dots (QDs) throughout the transition from the Dirac limit to the semi-Dirac limit and beyond. When non-interacting semi-Dirac fermions are confined in triangular QDs, the resulting electronic states near the Fermi level are localized asymmetrically among the three edges of these systems. In the presence of electron interactions, we show that these low-energy states favor the formation of edge-asymmetric magnetism in triangular QDs. In particular, the magnetic moments were localized only along a single edge of the zigzag triangular QDs, corresponding to an edge-asymmetric ferromagnetic ground state. For various system sizes, these zigzag triangular QDs exhibit a one-unit increase in the ground-state total spin ($\\Delta S_z = +1$) beyond the semi-Dirac limit, revealing a striking result of this transition. In contrast, the remaining two edges are antiferromagnetically coupled in the armchair triangular QDs, indicating an edge-asymmetric antiferromagnetic (AFM) ground state. We further identified the AFM ground states in hexagonal QDs, indicating that these types of asymmetric configurations are not unique to triangular QDs. Collectively, edge-asymmetric magnetism could create potential opportunities for future spintronics.", "url": "https://arxiv.org/abs/2611.30343", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mustafa Polat"}], "featured_authors": [{"name": "Mustafa Polat"}], "author_count": 1}, {"id": "2611.30359", "category": "cond-mat", "title": "Manipulation of Ferroelectric Polarization Under Near-Gap Light", "abstract": "Noncontacting light control of ferroelectric (FE) order has been receiving extensive interest in condensed matter physics. In this work, we investigate near-resonant light irradiation that induces structure-dependent photoexcited carrier density along the transition pathway. We combine a minimal Rice-Mele model containing intersite density-density correlations with ab initio calculations for realistic materials such as GeTe and SnTe. If the photon energy is below-gap without carrier excitation, only off-resonant scattering occurs and the FE order tends to be diminished. Slightly increasing photon energy at the near-gap regime would lead to a centrosymmetric non-polar (NP) to FE phase transition, which is not thermally accessible in conventional pressure-temperature phase diagram. This is in contrast to the well-above-gap light situation that tends to suppress the FE order under a fixed amount of photoexcitation. We apply phenomenological Landau theory and show that they belong to the continuous and first-order phase transitions, respectively. The occupation constrained calculations suggest that these reversible NP-FE phase transitions could be triggered under moderate light fluence. Our mechanism provides a potential route to reversible light-stabilized polar phases with reduced lattice heating and marginal lattice damages.", "url": "https://arxiv.org/abs/2611.30359", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hanli Cui"}, {"name": "Jian Zhou"}], "featured_authors": [{"name": "Hanli Cui"}, {"name": "Jian Zhou"}], "author_count": 2}, {"id": "2611.30407", "category": "cond-mat", "title": "Universal thermodynamics and BKT transition of the planar Bose gas from weak to strong interactions", "abstract": "We compute the universal thermodynamics of the dilute two-dimensional Bose gas at weak and strong coupling using the functional renormalization group (FRG). We employ an approximation that retains the full field dependence of the effective potential and spatial derivative terms, extending previous FRG calculations. We find that the equation of state is
