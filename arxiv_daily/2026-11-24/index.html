  <script>
    const papers = [{"id": "2611.26686", "category": "cond-mat", "title": "Topologically Obstructed Kondo Hybridization: A Route to Kondo Semimetals", "abstract": "The interplay of strong correlations, topology, and symmetry can reshape the low-energy electronic structure of quantum materials and drive the emergence of novel quantum phases. In heavy-fermion systems, the Kondo effect entangles localized $f$ moments with conduction electrons, giving rise to coherent heavy-electron bands at low temperatures, typically characterized by a Kondo hybridization gap. Here we show, however, that the topology and symmetry of the conduction-electron Fermi surface can obstruct the opening of the Kondo hybridization gap at certain momenta. Treating the Fermi surface of a three-dimensional system as an effective two-dimensional manifold, we demonstrate that nontrivial topological invariants defined on this manifold impose a topological obstruction to opening a full hybridization gap, forcing the $fc$ hybridization to vanish at certain momenta on the Fermi surface. These hybridization zeros lead to crossings between $c$ and $f$ bands, giving rise to nodal points or lines near the Fermi energy within the Kondo phase. Our results establish topological obstructions to Kondo hybridization as a route to Kondo semimetals, revealing a fundamental connection between Fermi-surface topology and the emergence of correlated electronic phases.", "url": "https://arxiv.org/abs/2611.26686", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yue Liu"}, {"name": "Junze Deng"}, {"name": "Haoyu Hu"}], "featured_authors": [{"name": "Yue Liu"}, {"name": "Junze Deng"}, {"name": "Haoyu Hu"}], "author_count": 3}, {"id": "2611.26690", "category": "cond-mat", "title": "Off-diagonal long-range order and $p$-wave pairing in one dimension from critical density fluctuations", "abstract": "A central theme in the theory of unconventional superconductivity is that Cooper pairing can be mediated by bosonic collective modes other than lattice vibrations. However, collective fluctuations in reduced dimensions can also have a destabilizing effect on superconductivity, by suppressing long-range order or by destroying Fermi-liquid quasiparticles in the normal state. In this work, we study a one-dimensional (1D) model of spinless fermions with local interactions that exhibits a continuous quantum phase transition from a Luttinger liquid to a phase-separated state. Combining field-theoretic arguments with numerical exact diagonalization and matrix-product-state methods, we find that the quantum critical point exhibits two-particle off-diagonal long-range order and $p$-wave pairing. Our work shows that critical density fluctuations at a phase-separation instability can act as pairing glue for unconventional superconductivity in 1D, overcoming the disordering effect of phase fluctuations and the absence of long-lived fermionic quasiparticles in the normal state.", "url": "https://arxiv.org/abs/2611.26690", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthew D. Thomson"}, {"name": "Simon M. Martin"}, {"name": "Frank Marsiglio"}, {"name": "Joseph Maciejko"}], "featured_authors": [{"name": "Matthew D. Thomson"}, {"name": "Simon M. Martin"}, {"name": "Frank Marsiglio"}, {"name": "Joseph Maciejko"}], "author_count": 4}, {"id": "2611.26693", "category": "cond-mat", "title": "Topological phases protected by half-chiral symmetry", "abstract": "Chiral (or sublattice) symmetry describes bipartite systems such as the Su-Schrieffer-Heeger (SSH) chain where same-sublattice A-A and B-B hoppings are forbidden, enabling the protection of topological phases. Here we identify new topological phases protected by half-chiral symmetry wherein chiral symmetry is preserved on only one sublattice, as may occur with sublattice imbalance (e.g. graphene-hBN) or localized orbitals (e.g. zincblende). Unlike conventional symmetry operators described by group theory, half-chiral symmetry is an algebraic constraint on the sublattice-projected Hamiltonian such as $PHP=0$, requiring a new framework for topological protection. We develop such a framework, identifying real-space bulk topological invariants and corresponding topological boundary modes that stick to zero energy. In two dimensions we construct a half-chiral Kekule honeycomb model and show that its unusual higher-order topology protects a single zero-energy mode at a single corner.", "url": "https://arxiv.org/abs/2611.26693", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chen-Shen Lee"}, {"name": "Itamar Kimchi"}], "featured_authors": [{"name": "Chen-Shen Lee"}, {"name": "Itamar Kimchi"}], "author_count": 2}, {"id": "2611.26697", "category": "cond-mat", "title": "When the magnetic force theorem fails: dressed exchange in the induced-moment magnets FePt, FePd, CoPt, and CoPd", "abstract": "Effective spin Hamiltonians for itinerant magnets are commonly parameterized by magnetic-force-theorem (MFT) exchange constants, which are subsequently used to compute the behavior of complex and delicate spin textures, for example skyrmions. We show that for systems containing atoms with large spin susceptibility, such as Pd or Pt, this approach misses important parts of the energetics. For FePt, it even predicts the wrong ground state. Benchmarking against fully self-consistent spin-spiral density-functional calculations - in which the electronic structure, including the induced Pd/Pt moments, relaxes for every spin configuration - we quantify the missing energetics for the ordered L1$_0$ alloys FePt, FePd, CoPt, and CoPd. By comparing a family of models that differ only in their treatment of the induced Pt moment, including the configuration-dependent models of Mryasov and Polesya, we identify the origin: the energetics of the induced moments are governed by the exchange-enhanced (dressed) susceptibility, of which the frozen-potential MFT captures only the bare part - about one third of the Pt-mediated interaction in FePt. We derive a general bound showing that no on-site (intra-atomic) refinement can supply the missing strength. The dressing decides the magnetic ground state in FePt, where the interlayer ordering rests entirely on the Pt-mediated interactions, and shifts the Curie temperatures of the other alloys by several hundred kelvin. Computed ordering temperatures, magnon spectra and spin wave stiffness for all four compounds are provided.", "url": "https://arxiv.org/abs/2611.26697", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vladislav Borisov"}, {"name": "Maryna Pankratova"}, {"name": "Rohit Pathak"}, {"name": "Pamela Costa Carvalho"}, {"name": "Erna K. Delczeg-Czirjak"}, {"name": "Sagar Sarkar"}, {"name": "Anders Bergman"}, {"name": "Qichen Xu"}, {"name": "Nezhat Pournaghavi"}, {"name": "Manuel Pereiro"}, {"name": "Hermann Dürr"}, {"name": "Mikhail I. Katsnelson"}, {"name": "Olle Eriksson"}, {"name": "Anna Delin"}], "featured_authors": [{"name": "Vladislav Borisov"}, {"name": "Maryna Pankratova"}, {"name": "Rohit Pathak"}, {"name": "Mikhail I. Katsnelson"}, {"name": "Olle Eriksson"}, {"name": "Anna Delin"}], "author_count": 14}, {"id": "2611.26704", "category": "cond-mat", "title": "Large deviations, effective dynamics, and dynamical phase transitions in random maps", "abstract": "Large deviation theory provides a natural framework to characterize rare fluctuations of time-averaged observables in deterministic and stochastic systems. Building on previous results for deterministic chaotic maps, here we extend the Doob transform to random maps, constructing an effective dynamics in which rare events become typical. This makes it possible to directly reproduce the dynamics of rare trajectories that are exponentially difficult to sample under the original dynamics. We further apply spectral large-deviation methods to characterize dynamical phase transitions in random maps. The spectral structure of the tilted operator provides insight into the mechanisms underlying these transitions and, in particular, allows us to identify the appropriate initial states that select one dynamical phase or another. Our results extend the connection between large deviation theory, spectral methods, and effective dynamics to random chaotic maps, providing a general framework to study rare events and dynamical phase transitions in these systems.", "url": "https://arxiv.org/abs/2611.26704", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ángela Tajuelo-Valbuena"}, {"name": "Jorge Hidalgo"}, {"name": "Ricardo Gutiérrez"}, {"name": "Carlos Pérez-Espigares"}], "featured_authors": [{"name": "Ángela Tajuelo-Valbuena"}, {"name": "Jorge Hidalgo"}, {"name": "Ricardo Gutiérrez"}, {"name": "Carlos Pérez-Espigares"}], "author_count": 4}, {"id": "2611.26741", "category": "cond-mat", "title": "Emergent Long-Range Entanglement in the XXZ Quantum Spin Chain with Competing Orders", "abstract": "Competition between short-range and long-range interactions is a largely unexplored route to one-dimensional quantum matter. We introduce a spin-1/2 XXZ chain with ferromagnetic nearest-neighbour and antiferromagnetic power-law couplings. Using DMRG and spin-wave theory, we show this competition stabilises a gapless phase with central charge $c=0.997(17)$, a twofold-degenerate ground state and entanglement spectrum, absent in nearest-neighbour models, and is long-range entangled as diagnosed by finite quantum conditional mutual information. The model also generates a unique gapped quantum phase and gapless antiphase with non-decaying correlations.", "url": "https://arxiv.org/abs/2611.26741", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anthony Balchin"}, {"name": "Eytan Grosfeld"}, {"name": "Eran Ginossar"}], "featured_authors": [{"name": "Anthony Balchin"}, {"name": "Eytan Grosfeld"}, {"name": "Eran Ginossar"}], "author_count": 3}, {"id": "2611.26753", "category": "cond-mat", "title": "Geometric properties of Wilsonian flows of periodic potentials in two dimensions", "abstract": "Periodic interactions can possess multiple competing minima and barriers, whose evolution under coarse-graining offers a geometric perspective complementary to the scaling of Fourier harmonics. We study this evolution in two dimensions by deriving a functional Wilsonian renormalization-group flow for a general smooth periodic potential and its running sine-Gordon frequency within a constant-kinetic projection. Reaction--diffusion and Burgers representations reveal two key properties of the flow: discrete translation symmetries are preserved, and the number of extrema can only remain constant or decrease. Consequently, the nonlinear generation of Fourier harmonics may accompany a progressive simplification of the potential landscape. We illustrate the role of symmetry with two complementary examples. A weak breaking of the $\\pi$-translation symmetry allows a reduction from four extrema to two, whereas a non-sinusoidal interaction retaining this symmetry evolves from eight extrema to the four protected by its periodicity. These results highlight how symmetry and coarse-graining jointly reorganize competing minima and barriers in periodic interactions.", "url": "https://arxiv.org/abs/2611.26753", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daniel G. Barci"}, {"name": "Nathan O. Silvano"}], "featured_authors": [{"name": "Daniel G. Barci"}, {"name": "Nathan O. Silvano"}], "author_count": 2}, {"id": "2611.26814", "category": "cond-mat", "title": "Simple Routes to Turing-Like Patterns", "abstract": "Spots, stripes, and networks recur in systems with very different microscopic dynamics, suggesting that the competing processes behind Turing-like patterns may be easy to realise. We ask whether local amplification coupled to suppression over a wider region can generate these geometries in simple systems beyond chemical reaction--diffusion models. We test this idea in two settings, a binary cellular automaton obtained by adding a distant neighbour count to Conway's Game of Life and a self-gravitating toy universe described by particle motion and two continuous fields. The automaton produces spots, stripes, and coexistence across its control plane, while a rule retaining only the two opposing counts produces islands, stripes, and holes. Directional correlations and intrinsic dimension identify the same region of orientational order. In the gravitational system, convergence increases local density while mass transport depletes the surroundings. The two-field and particle densities have a smoothed spatial correlation of $0.962$ at scale factor $a=1$ under the original force law, and strengthening its long-wavelength component drives both descriptions toward fewer dense condensations. Together, these results show how simple counting rules and redistribution of a conserved quantity can realise competing growth and suppression, providing two concrete routes by which Turing-like geometries can recur across different dynamics.", "url": "https://arxiv.org/abs/2611.26814", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhan Zhao"}, {"name": "Xiang-Ning Li"}, {"name": "Wen-Wen Li"}, {"name": "Ji-Chong Yang"}], "featured_authors": [{"name": "Zhan Zhao"}, {"name": "Xiang-Ning Li"}, {"name": "Wen-Wen Li"}, {"name": "Ji-Chong Yang"}], "author_count": 4}, {"id": "2611.26823", "category": "cond-mat", "title": "Geometric Contribution to the Electron-Phonon Coupling Constant: Checkerboard and Hyper-diamond Models", "abstract": "Recent theoretical studies on electron-phonon coupling (EPC) - a key ingredient in the emergence of diverse quantum phases such as superconductivity and charge-density waves - have revealed a distinct contribution to its strength arising from the quantum geometry of electronic bands. Here we investigate the quantum geometric contribution, characterized by the quantum metric, to the dimensionless EPC constant in the checkerboard and hyper-diamond models, under the Gaussian approximation. We show that in the checkerboard model, the geometric contribution can be tuned independently while keeping the energetic part fixed, demonstrating the possibility of enhancing EPC strength through quantum geometry. In the hyper-diamond model, the geometric contribution accounts for roughly $50\\%$ of the total EPC constant across all spatial dimensions, generalizing the $d=2$ result for graphene to higher dimensions.", "url": "https://arxiv.org/abs/2611.26823", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Thomas Caligiure"}, {"name": "Daniel P. Arovas"}, {"name": "Jiabin Yu"}], "featured_authors": [{"name": "Thomas Caligiure"}, {"name": "Daniel P. Arovas"}, {"name": "Jiabin Yu"}], "author_count": 3}, {"id": "2611.26872", "category": "cond-mat", "title": "Majorana quasiparticles, mass hierarchies, and the phase diagram of the Gross-Neveu model in D=2+1", "abstract": "We show that the canonical $2+1$-dimensional $O(2N)$-symmetric Gross-Neveu model with the inversion-breaking mass-term features a sequence of $O(2N-k) \\times O(k)$ - symmetric ground states in its zero-temperature phase diagram, with $k=1,...,N$. For odd $k$ the quasiparticle excitations are itinerant, massive, two-real-component Majorana fermions, i.e. half of Dirac fermions. The solutions of the mean-field equations symmetric under $O(2N-k_1-k_2) \\times O(k_1) \\times O(k_2)$ with $k_1, k_2 \\geq 1$ also exist, but are found to be unstable. Some manifestations of Majorana quasiparticle in the particular ``uniaxial nematic\" state with $k=1$ are outlined, and analogies to other physical systems are offered.", "url": "https://arxiv.org/abs/2611.26872", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Igor F. Herbut"}, {"name": "Mathew Schneider"}], "featured_authors": [{"name": "Igor F. Herbut"}, {"name": "Mathew Schneider"}], "author_count": 2}, {"id": "2611.26877", "category": "cond-mat", "title": "Interfacial Transition Waves and Domain Wall Self-Pinning in Bi-stable Mechanical Metamaterial", "abstract": "The understanding of transition waves in mechanical metamaterials currently derives from architectures fitting one of three archetypes as distinguished by the stability and order parameter: multi-stable with scalar or vector order parameter, and bi-stable with scalar order parameter. However, a fourth archetype is conspicuously absent: bi-stable with vector order parameter. Completing the tetrad, in this article, we numerically examine the transformation dynamics unique to bi-stable mechanical metamaterials with vector order parameter. We report two types of interfacial transition waves, whose propagation is restricted to the narrow region of configurational boundaries (e.g., domain walls). We show that the wave speed may depend on its polarization. In addition, we reveal an approach to regulate the severity of discreteness effects, which elevates discreteness as an intrinsic, tunable mechanism for controlling the wave speed -- including pinning/de-pinning of the domain wall -- without altering the metamaterial architecture. The results support applications in, e.g., reconfigurable mechanical circuits and complex domain patterning, and motivate further investigation of metamaterials with unconventional transition processes.", "url": "https://arxiv.org/abs/2611.26877", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Michael J. Frazier"}], "featured_authors": [{"name": "Michael J. Frazier"}], "author_count": 1}, {"id": "2611.26932", "category": "cond-mat", "title": "Parametric excitation of nano-scale spin waves with controlled phase by an open-resonator-type transducer", "abstract": "Parametric excitation is one of the most effective methods for the excitation of nano-scale spin waves (SW) (or magnons) in magnetic films and nano-waveguides, as this method removes restrictions on the excited wave wavelength imposed by a finite width of the excitation transducer. Especially efficient parametric excitation of SW is achieved if the SW excitation is based on the effect of voltage-controlled magnetic anisotropy (VCMA). However, in a traditional parametric excitation process, the excited propagating waves have an arbitrary phase, which prevents the use of such waves in signal processing applications. Here, we demonstrate that the use of an VCMA transducer in the form of an open resonator with controlled partial reflections of waves at the boundaries allows one to excite SW having only two allowed phase states, controlled by the phase of the parametric pumping and reflections at the transducer boundaries. These reflections, also, lead to a reduced value of the parametric excitation threshold. In addition, micromagnetic simulations reveal the possibility to tune the phase distribution of the excited magnons using static voltage, which could be useful for applications in probabilistic computing.", "url": "https://arxiv.org/abs/2611.26932", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Roman Verba"}, {"name": "Vladyslav Borynskyi"}, {"name": "Vasil Tiberkevich"}, {"name": "Andrei Slavin"}], "featured_authors": [{"name": "Roman Verba"}, {"name": "Vladyslav Borynskyi"}, {"name": "Vasil Tiberkevich"}, {"name": "Andrei Slavin"}], "author_count": 4}, {"id": "2611.26970", "category": "cond-mat", "title": "Unveiling plastic rearrangements in silica glass through persistent homology", "abstract": "Plastic deformation of amorphous solids proceeds through localised atomic rearrangements. While much effort has been devoted to identifying where such rearrangements occur, how the local structure changes during a rearrangement is less well understood. In silica glass, a rearrangement can involve both distortion within SiO4 tetrahedra and deformation of the network connecting them, but the contributions of these two modes have rarely been quantified. Here, we characterise plastic rearrangements in silica glass under athermal quasistatic shear using persistent homology, which extracts rings from atomic configurations, and link the changes in the persistence diagrams to individual rings in real space. We classify rearrangement events into two types according to bond-coordination changes. By performing inverse analysis, we reveal that Si-centred triangles within tetrahedra, hinge triangles spanning two corner-sharing tetrahedra, and the other (non-hinge) O3 triangles are the dominant sources of topological changes upon rearrangements. The birth-time changes of Si-centred and hinge triangles closely follow the change in the angle opposite the longest edge, whereas that of non-hinge triangles also reflects changes in inter-tetrahedral O--O distances. Further, we clarify that triangles with large birth-time changes are localised in the rearrangement region. Comparing the two types of triangles, we find that the ratio of their birth-time changes is larger for coordination-changing events than for coordination-preserving events, indicating that such events involve relatively more intra-tetrahedral deformation compared with network deformation. These results demonstrate that persistent homology separates intra-tetrahedral and network deformation and quantifies each as a continuous quantity within a single framework.", "url": "https://arxiv.org/abs/2611.26970", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fuya Katsuyama"}, {"name": "Kumpei Shiraishi"}, {"name": "Emi Minamitani"}], "featured_authors": [{"name": "Fuya Katsuyama"}, {"name": "Kumpei Shiraishi"}, {"name": "Emi Minamitani"}], "author_count": 3}, {"id": "2611.27037", "category": "cond-mat", "title": "Transition-Metal Substitutions in MOF-5: A Hybrid-DFT Study of Oxygen Electrocatalysis", "abstract": "Hybrid density functional theory calculations were used to investigate the stability, electronic properties, and catalytic activity of transition-metal impurities substituting Zn sites (M\\(_{\\rm Zn}\\)) in the MOF-5 metal-organic framework [Zn\\(_4\\)O(BDC)\\(_3\\), BDC = 1,4-benzenedicarboxylate], with M = Sc, Ti, V, Cr, Mn, Fe, Co, Ni, and Cu. Most substitutions introduce \\(3d\\) states within the MOF-5 band gap and induce localized magnetic moments. Partially occupied \\(3d\\) states promote orbital hybridization and charge transfer with oxygenated intermediates, activating the dopant sites toward oxygen electrocatalysis. The oxygen reduction and evolution reaction (ORR and OER) activities were evaluated using the computational hydrogen electrode model. Mn\\(_{\\rm Zn}\\) and Fe\\(_{\\rm Zn}\\) exhibit calculated ORR overpotentials of 0.57~V, while Mn\\(_{\\rm Zn}\\) and Co\\(_{\\rm Zn}\\) yield OER overpotentials of 0.42 and 0.51~V, respectively, approaching those of benchmark precious-metal electrocatalysts. These findings identify Mn substitution as a promising strategy for achieving bifunctional ORR/OER activity in MOF-5 and establish a link between dopant electronic structure and catalytic performance to guide the design of MOF-based electrocatalysts.", "url": "https://arxiv.org/abs/2611.27037", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pedro H. Souza"}, {"name": "Walter Orellana"}], "featured_authors": [{"name": "Pedro H. Souza"}, {"name": "Walter Orellana"}], "author_count": 2}, {"id": "2611.27076", "category": "cond-mat", "title": "Quantum order by disorder among lozenge tilings: a staircase of hub-free crystals between the Lieb ferrimagnet and the antiferromagnet", "abstract": "Lozenge tilings of the triangular lattice define an exponentially large family of bipartite networks, from the dice lattice, a Lieb ferrimagnet with the largest sublattice imbalance, to square-type tilings, which are compensated antiferromagnets. For the classical Heisenberg antiferromagnet all of them are degenerate. We show that quantum fluctuations lift this degeneracy through a local mechanism: the zero-point energy is, to leading order, a sum of site terms that are convex in the coordination $z$, so that Jensen's inequality at fixed $\\langle z\\rangle=4$ selects the square-type tiling. An expansion about the Ising limit explains the convexity: a site with more bonds has more channels for quantum fluctuations, but each fluctuation frustrates more bonds. A magnetic field couples to the Lieb moment and competes with this selection. Because the moment is carried most cheaply by threefold and fivefold sites, sixfold hubs are avoided, and bond counting together with the Lieb--Mattis theorem limits hub-free tilings to $3/5$ of the dice moment. Quantum Monte Carlo and a complete enumeration of periodic tilings with small unit cells show that the classical jump is replaced by a staircase of periodic crystals. Its widest step is a hub-free crystal that saturates the bound; below it, threefold and fivefold defects pack ever more densely in a shallow sequence of crystals, controlled by a short-ranged attraction between defects of equal curvature and a repulsion between defects of opposite curvature. Selection energies scale as $JS$. In the height representation the coordination is the discrete Gaussian curvature and the Lieb moment its sublattice-staggered part. We give spectroscopic signatures and discuss realizations in nanographenes, atomic spin arrays and quantum simulators.", "url": "https://arxiv.org/abs/2611.27076", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Suhwan Yoo"}, {"name": "Jeehoon Choi"}, {"name": "Chaeyeon Kim"}, {"name": "Hee Young Kwon"}, {"name": "Changyeon Won"}], "featured_authors": [{"name": "Suhwan Yoo"}, {"name": "Jeehoon Choi"}, {"name": "Chaeyeon Kim"}, {"name": "Hee Young Kwon"}, {"name": "Changyeon Won"}], "author_count": 5}, {"id": "2611.27103", "category": "cond-mat", "title": "Axial Thermal Transport in Transition Metal Chalcogenide Nanowires from Machine-Learning Molecular Dynamics Simulations", "abstract": "Transition metal chalcogenide M6X6 nanowires (M = Mo or W; X = S, Se, or Te) are promising one-dimensional (1D) building blocks for nanowire bundles and arrays, but how elemental composition controls their intrinsic axial heat transport remains unclear. Here we develop a multicomponent neuroevolution potential (NEP) from first-principles reference data and use homogeneous nonequilibrium molecular dynamics (HNEMD) simulations to quantify the thermal conductivity of six MX6 nanowires. The Mo6X6 series show a nonmonotonic composition dependence, whereas the thermal conductivity of the W6X6 series decreases monotonically with increasing chalcogen mass. Frequency-resolved thermal conductivity and phonon mean-free path analyses show that axial heat conduction is dominated by low-frequency phonons. Vibrational density of states and spectral energy density analyses further reveal that the contrasting trends arise from a competition between metal-chalcogen vibrational matching and phonon softening induced by heavier chalcogen atoms. A phenomenological model incorporating the combined atomic mass and the relative mass difference between the metal and chalcogen atoms reproduces these trends. These results link elemental composition, phonon characteristics and axial thermal conductivity in M6X6 nanowires, providing an atomistic basis for selecting heat-conducting units in nanowire bundles and arrays.", "url": "https://arxiv.org/abs/2611.27103", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wenwu Jiang"}, {"name": "Hekai Bu"}], "featured_authors": [{"name": "Wenwu Jiang"}, {"name": "Hekai Bu"}], "author_count": 2}, {"id": "2611.27194", "category": "cond-mat", "title": "Recoverable Necking Enabled by Reverse Phase-Boundary Motion in Liquid Crystal Elastomers", "abstract": "Strain localization is often associated with plastic flow and permanent deformation. Here we show that a tensile neck in a crosslinked nematic network can undergo nearly complete recovery through reverse phase-boundary motion, leaving little residual deformation. In a monodomain liquid crystal elastomer stretched perpendicular to its initial director, this recovery occurs during an isothermal loading-unloading cycle. Digital image correlation resolves the process as the retreat of interfaces separating low- and high-stretch regions, where the high-stretch domain shrinks while previously necked material thickens, despite substantial mechanical hysteresis. Within the recoverable-necking regime, increasing temperature lowers the loading plateau stress but raises the unloading plateau stress. A nonconvex constitutive description provides an energetic basis for the coexistence of the two stretch states, while gradient regularization accounts for the finite width of their interfaces through an equilibrium reference profile. These results identify the spatial mechanism of neck recovery and distinguish recoverable strain localization from mechanical reversibility in an orientationally ordered polymer network.", "url": "https://arxiv.org/abs/2611.27194", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Weida Kang"}, {"name": "Yufeng Zhang"}, {"name": "Changyue Liu"}, {"name": "Zhijian Wang"}, {"name": "Xudong Liang"}], "featured_authors": [{"name": "Weida Kang"}, {"name": "Yufeng Zhang"}, {"name": "Changyue Liu"}, {"name": "Zhijian Wang"}, {"name": "Xudong Liang"}], "author_count": 5}, {"id": "2611.27231", "category": "cond-mat", "title": "Revealing the growth of structural length in glass-forming liquids without using dynamical information", "abstract": "Dynamical heterogeneity underlies the dramatic slowdown of supercooled liquids and has long been a central topic in glass physics. Despite considerable progress in identifying structural motifs and order parameters correlated with dynamical heterogeneity, a general characterization of structural descriptors remains elusive because they can vary among glass formers and are not generally known \\emph{a priori}. To address this challenge, we establish a unified framework that can be applied to varieties of glass formers to extract structural signatures of dynamical heterogeneity directly from their static configurations. The framework combines a graph neural network (GNN) with gradient-weighted class activation mapping (Grad-CAM). Across three canonical three-dimensional glass-forming models, the resulting structural field exhibits a characteristic correlation length that tracks the corresponding dynamical correlation length. Notably, a network trained on small systems can be applied to larger systems without retraining, indicating that the extracted features are encoded in local and mesoscopic structural correlations. These results demonstrate that static configurations encode structural signatures of dynamical heterogeneity and establish a scalable, interpretable route for extracting them.", "url": "https://arxiv.org/abs/2611.27231", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Min Liu"}, {"name": "Daisuke Nishigaito"}, {"name": "Yusuke Hara"}, {"name": "Norihiro Oyama"}, {"name": "Takeshi Kawasaki"}], "featured_authors": [{"name": "Min Liu"}, {"name": "Daisuke Nishigaito"}, {"name": "Yusuke Hara"}, {"name": "Norihiro Oyama"}, {"name": "Takeshi Kawasaki"}], "author_count": 5}, {"id": "2611.27247", "category": "cond-mat", "title": "Nonmonotonic Magnetic Correlations in Decorated Lieb-Lattice Anderson Models", "abstract": "The interplay between electronic correlations and lattice geometry can strongly modify the competition between magnetic correlations and local singlet formation in multiorbital Hamiltonians. Here we use determinant quantum Monte Carlo simulations to investigate two periodic Anderson-like models constructed by selectively hybridizing localized orbitals to the inequivalent sites of a Lieb lattice. The resulting geometries possess partially filled flat bands and different sublattice imbalances. We examine the evolution of local spin correlations and orbital-resolved magnetic structure factors as the hybridization is increased. Although correlations between hybridized orbitals evolve relatively smoothly toward local singlet formation, the longer-range magnetic correlations exhibit a striking nonmonotonic dependence on hybridization. In particular, we observe a pronounced suppression at intermediate hybridization followed by a substantial recovery on undecorated lattice sites. We discuss these results in relation to earlier studies of depleted periodic Anderson models and the constraints imposed by Lieb's theorem. Our findings illustrate how selective hybridization and flat-band structure can produce unusual redistributions of magnetic correlations in strongly interacting multiorbital systems.", "url": "https://arxiv.org/abs/2611.27247", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Raymond Hmuifoo"}, {"name": "Edwin W. Huang"}, {"name": "Annabelle Ancheta"}, {"name": "Richard T. Scalettar"}], "featured_authors": [{"name": "Raymond Hmuifoo"}, {"name": "Edwin W. Huang"}, {"name": "Annabelle Ancheta"}, {"name": "Richard T. Scalettar"}], "author_count": 4}, {"id": "2611.27256", "category": "cond-mat", "title": "Quantum-Chaos-Assisted Measure Synchronization in a Double-Well Ultracold Bose Gas", "abstract": "This paper investigates measure synchronization (MS) in a two-component ultracold atomic system confined in a double-well potential, which realizes a quantum many-body bosonic Josephson junction. Through spectral-statistics analysis, we identify the quantum chaotic parameter regime and confirm that the system achieves MS within this regime with weak dependence on the initial energy imbalance. We further show that chaotic dynamics not only significantly shortens the time scale for establishing synchronization but is also accompanied by entanglement entropy approaching the random-state prediction. These results reveal close connections among quantum chaos, MS, and quantum entanglement in conservative quantum many-body systems and may motivate further studies on the underlying mechanisms of chaos-assisted synchronization.", "url": "https://arxiv.org/abs/2611.27256", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xianchao Le"}, {"name": "Jiaxin Peng"}, {"name": "Weiping Zhang"}, {"name": "Keye Zhang"}], "featured_authors": [{"name": "Xianchao Le"}, {"name": "Jiaxin Peng"}, {"name": "Weiping Zhang"}, {"name": "Keye Zhang"}], "author_count": 4}, {"id": "2611.27321", "category": "cond-mat", "title": "Gap-label bounds and optical reconstruction of Landau-subband quantum geometry", "abstract": "We derive a magnetic gap-label lower bound on the internal quantum weight of Landau subbands that remains nonzero even when the occupied Chern number vanishes. Using the second fundamental forms of nested subbundles to decompose the quantum geometric tensor, we isolate the constraint imposed by the uniform parent curvature and show that the excess quantum weight above the bound equals twice the weaker circular transition weight. For a noninteracting parabolic band with a periodic scalar potential, Landau-level mixing preserves the integrated relative curvature while the occupied direct gap remains open. Nevertheless, uncorrected sub-cyclotron absorption need not satisfy the projected bound. Using exact circular-dipole relations, we reconstruct the low-frequency guiding-centre weight and signed dichroism from circularly polarized absorption. This reconstruction removes the first-order orbit-polarization contribution. For an insulating filling of an isolated lowest-Landau-level-derived cluster, a potential-gradient estimate bounds the omitted remote-transition weight quadratically at weak coupling. This yields a finite-window lower bound on reconstructed quantum weight and bounds the deviation of reconstructed dichroism from the integrated relative curvature.", "url": "https://arxiv.org/abs/2611.27321", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Özgür Kelekçi"}], "featured_authors": [{"name": "Özgür Kelekçi"}], "author_count": 1}, {"id": "2611.27386", "category": "cond-mat", "title": "Pushy Random Walk on the Bethe lattice: a Galton-Watson perspective", "abstract": "Pushy random walks are minimal models of transport in deformable media, in which the walker displaces the obstacles it bumps into rather than being blocked by them. On the Bethe lattice, we show that the walkable structure dynamically created by a pushy walker can be generated a priori as an explicit multi-type Galton-Watson tree, so that the walker reduces to a simple random walk on a static random tree, and its escape to infinity coincides with the survival of the underlying branching process. Standard generating-function tools then give direct access to the escape properties of these walks. For the Sokoban walk, which pushes a single obstacle, we recover the known critical density $\\rho_c = 1-(z-1)^{-2}$ and the behavior of the escape probability close to $\\rho_c$, and derive its small-density asymptotics. For the second-order pushy walk, which can push trains of two obstacles, we establish the conjectured $\\rho_c = 1-(z-1)^{-3}$, and compute the escape probability at all densities. Beyond escape, the same framework yields the statistics of the trace of trapped walkers: the distribution of the maximal depth follows from the extinction probabilities, while the distributions of the visited volume and of the number of dead ends are encoded in explicit functional equations for their generating functions, which we invert numerically. All predictions agree with Monte Carlo simulations.", "url": "https://arxiv.org/abs/2611.27386", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jérémie Klinger"}], "featured_authors": [{"name": "Jérémie Klinger"}], "author_count": 1}, {"id": "2611.27391", "category": "cond-mat", "title": "Pure Orbitronics: Hall Responses and Torques by Orbital Exchange in Spinless Transition-Metal Dichalcogenides", "abstract": "Recent studies have identified orbital exchange fields as a novel mechanism for controlling electronic and magnetic phenomena through the orbital degree of freedom. In contrast to conventional spin exchange fields, orbital exchange fields couple directly to orbital angular momentum and can emerge from purely orbital interactions or dynamically through couplings to chiral excitations such as phonons and magnons. Motivated by these developments, we investigate the transport and torque responses generated by orbital exchange fields in two-dimensional materials. Using monolayer H-phase MoS$_2$ as a prototypical transition-metal dichalcogenide, we introduce a Zeeman-like orbital exchange field that breaks time-reversal symmetry in orbital space while leaving the spin degree of freedom inactive. We demonstrate that this perturbation induces a sizable intrinsic anomalous Hall conductivity even in the absence of spin magnetism and spin--orbit coupling driven mechanisms. Simultaneously, the orbital Hall response remains robust in the weak-field regime and undergoes substantial reconstruction at larger exchange strengths due to pronounced band modifications. In addition, we show that currents can generate sizable current-induced orbital torques on the orbital magnetization. Our results establish orbital exchange fields as an effective route toward Hall transport and nonequilibrium torque phenomena driven purely by orbital physics, opening new perspectives for orbitronics and orbitally engineered quantum functionalities.", "url": "https://arxiv.org/abs/2611.27391", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mahmoud Zeer"}, {"name": "Dongwook Go"}, {"name": "Yuriy Mokrousov"}], "featured_authors": [{"name": "Mahmoud Zeer"}, {"name": "Dongwook Go"}, {"name": "Yuriy Mokrousov"}], "author_count": 3}, {"id": "2611.27406", "category": "cond-mat", "title": "How many states does an exact relaxation model need? Sharp state complexity and geometric obstructions for reversible chains", "abstract": "How many states does a reversible Markov model need to reproduce two prescribed relaxation modes exactly? We maximize the smaller of the two stationary coordinate variances over all finite reversible chains whose states lie in a given convex region and whose coordinates relax at rates $1$ and $\\rho$. Detailed balance turns this into the equilibrium of a tension-only cable network whose loads depend on the stationary masses. For the moment curve of the Wright-Fisher diffusion no finite chain is optimal: maximizing sequences converge to a unique beta law, and the best deficit with $N$ states is of order $N^{-2}$. We find the exact leading constant for states on the curve and for states in its convex hull, together with the optimal cube-root density of states. The hull constant is the curve constant times $c/(1+c)$, $c=(\\rho-2)/\\rho$; at $\\rho=5/2$ the hull needs $\\sqrt{6}$ times fewer states, although the limiting law is the same. For $\\rho>8/3$ any upward enlargement of the hull lowers the constant again. All lower bounds hold for arbitrary transition graphs. At every fixed number of states an optimizer exists. On a seven-gon the smallest optimal chain jumps from three to four states while the optimal value stays constant, and a family of polygons forces the state count to grow linearly with the number of sides. Monotone vector fields give exact upper certificates, which solve an asymmetric quadrilateral at all rates and 381 polygon-rate instances in exact arithmetic. We formulate a finite-realizability problem and a finite-dictionary conjecture for polygons, and derive state budgets and exclusion tests for finite kinetic models.", "url": "https://arxiv.org/abs/2611.27406", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Murad Aznagulov"}], "featured_authors": [{"name": "Murad Aznagulov"}], "author_count": 1}, {"id": "2611.27430", "category": "cond-mat", "title": "Conductivity of electrolyte solutions: Self-consistent Debye-Hückel-Onsager theory", "abstract": "This study presents a novel approach to addressing the limitations in understanding the behavior of charged particles in solutions. The approach is based on the development of the Self-Consistent Debye-Hückel-Onsager (SCDHO) theory, which integrates the effects of non-local charge distributions using a Slater-type charge form factor model. This results in a modified Coulomb potential at short distances, unlike traditional approaches such as the classical Debye-Hückel-Onsager theory. The proposed method relies on explicit expressions derived from gradients of local chemical potentials rooted in classical Density Functional Theory (DFT) and the Ornstein-Zernike formalism for correlation functions. Our theoretical framework enables the derivation of analytic equations that describe both correlation (aka relaxation) and electrophoretic contributions to total electric conductivity. Within the established theoretical framework, the model of smeared charges with Slater-type charge form factors provides an accurate predictive tool that can be applied to a wide range of ion valences, concentrations, and temperatures, including both aqueous and non-aqueous electrolyte solutions.", "url": "https://arxiv.org/abs/2611.27430", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yury Budkov"}, {"name": "Nikolai Kalikin"}], "featured_authors": [{"name": "Yury Budkov"}, {"name": "Nikolai Kalikin"}], "author_count": 2}, {"id": "2611.27440", "category": "cond-mat", "title": "Decoupling Exciton Energetics from Wavefunction Geometry in Imide-Based Defect Double Antiperovskites", "abstract": "The excited-state properties of imide-based defect double antiperovskites AE$_5$AsPn(NH)$_2$ (AE = Ca, Sr; Pn = Sb, Bi) are investigated using spin--orbit-coupled quasiparticle calculations, the model Bethe--Salpeter equation (mBSE), and analytical descriptions of lattice-polarization effects. Across five tetragonal ($P4/mmm$) and monoclinic ($Cm$) structural models, the calculated exciton binding energies range from 140 to 210 meV. Chemical substitution modifies both the binding energies and the hydrogenic estimates of exciton spatial extent. By contrast, the structural distortion from tetragonal $P4/mmm$ ($D_{4h}$) to monoclinic $Cm$ ($C_s$), which removes inversion and fourfold rotational symmetry, produces comparatively modest changes in binding energy but appreciably reshapes the real- and momentum-space exciton distributions. This contrast reveals a partial decoupling between exciton energetics and wavefunction geometry, and identifies a symmetry-associated sensitivity of exciton geometry to structural distortion. The changes are understood to occur together with modifications of local coordination and electronic dispersion, rather than as an isolated effect of symmetry alone. Lattice polarization provides an additional screening channel, reducing the estimated exciton binding energies by approximately 9--16\\%. Complementary Fröhlich-polaron calculations yield moderate mass enhancement and model-estimated electron-polaron mobilities of 39--99 cm$^2$ V$^{-1}$ s$^{-1}$, with comparatively modest differences between the two polymorphs. These results highlight the distinct responses of exciton energetics, exciton wavefunction geometry, and carrier transport to chemical and structural modifications.", "url": "https://arxiv.org/abs/2611.27440", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dhriti Mandal"}, {"name": "Saswata Bhattacharya"}], "featured_authors": [{"name": "Dhriti Mandal"}, {"name": "Saswata Bhattacharya"}], "author_count": 2}, {"id": "2611.27470", "category": "cond-mat", "title": "Adaptive obstacle deposition drives dynamical localization in chase-and-escape dynamics", "abstract": "Most pursuit--evasion models assume a fixed environment, although defensive actions can leave persistent structures that affect subsequent encounters. We study a two-dimensional lattice model in which threatened escapers deposit permanent obstacles, coupling capture kinetics to the geometry explored by their pursuers. Increasing the deposition probability enhances escaper survival and strongly suppresses chaser transport. For dilute chasers, the mean-squared-displacement exponent decreases from values near unity towards zero, trajectories contract to a few lattice spacings and the localized fraction rises sharply. The localization response becomes weaker as chaser abundance increases. Time-resolved obstacle densities support a kinetic explanation: rapid capture depletes obstacle-producing escapers before a comparably confining environment can develop. At intermediate parameters, broad or bimodal distributions of trajectory radii and MSD exponents reveal simultaneous mobile and localized subpopulations. Thus deposition redistributes trajectories between distinct dynamical behaviors, producing heterogeneity beyond a uniform slowdown. We summarize the coupled survival and transport response in an empirical map of mobile, heterogeneous and trapping-dominated regimes, interpreted as finite-time crossovers. These results identify the lifetime of the obstacle-producing population as a key control of adaptive localization: a stronger instantaneous pursuit pressure can weaken confinement by shortening the period over which the environment is modified.", "url": "https://arxiv.org/abs/2611.27470", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "R. G. Rossatto"}, {"name": "Amin Bakhshandeh"}, {"name": "H. Arial Alvarez"}, {"name": "C. Manuel Carlevaro"}, {"name": "José Rafael Bordin"}], "featured_authors": [{"name": "R. G. Rossatto"}, {"name": "Amin Bakhshandeh"}, {"name": "H. Arial Alvarez"}, {"name": "C. Manuel Carlevaro"}, {"name": "José Rafael Bordin"}], "author_count": 5}, {"id": "2611.27532", "category": "cond-mat", "title": "Annular Terahertz Near-Field of a Breathing Charged Vortex", "abstract": "We study the radial electric field around a singly quantized vortex in a charged BCS superconductor, when the Higgs amplitude mode is driven by a uniform terahertz (THz) electromagnetic pulse. In a local-density approximation the pairing gap vanishes on the vortex axis at all times, so the particle density on the axis cannot oscillate, whereas the curvature of the density profile around the axis does. Starting from the electrostatic-lens formalism of our previous work, we show that this converts the electrically neutral Higgs oscillation into an alternating radial electric field that vanishes on the axis. When the electrostatic screening length is much shorter than the vortex core, we obtain the field in closed form: it has a ring-shaped profile, with a maximum at a distance of the order of the coherence length from the axis, and the Higgs drive modulates it by a fraction $2\\eta$, where $\\eta$ is the relative oscillation of the gap. For niobium nitride and $\\eta=0.1$ the static field of the vortex is about $140$~V/m and its modulation about $30$~V/m, independently of the carrier density and of the dielectric constant. We also discuss how the thermodynamic factor entering the field changes toward the BCS-BEC crossover.", "url": "https://arxiv.org/abs/2611.27532", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "I. Tolbatov"}, {"name": "L. Salasnich"}], "featured_authors": [{"name": "I. Tolbatov"}, {"name": "L. Salasnich"}], "author_count": 2}, {"id": "2611.27538", "category": "cond-mat", "title": "Rotation-induced supersolidity in a spin-imbalanced unitary Fermi gas", "abstract": "We show that a supersolid can be spontaneously generated by a persistent current in a spin-imbalanced unitary Fermi gas in a ring. As polarization increases, stable superflow turns dissipative via vortex emission before superfluid and crystalline order coexist. Pairing and spin densities are modulated with an even number of nodes, where the pairing phase jumps by $\\pi$ and excess majority spins accumulate. Even at fixed polarization, the modulation period changes with the winding number, unlike in FFLO states. The modulation slides freely, supporting a gapless translational Goldstone mode.", "url": "https://arxiv.org/abs/2611.27538", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Buğra Tüzemen"}, {"name": "Gabriel Wlazłowski"}, {"name": "Piotr Magierski"}, {"name": "Klejdja Xhani"}], "featured_authors": [{"name": "Buğra Tüzemen"}, {"name": "Gabriel Wlazłowski"}, {"name": "Piotr Magierski"}, {"name": "Klejdja Xhani"}], "author_count": 4}, {"id": "2611.27555", "category": "cond-mat", "title": "Minimal chiral $p$-wave superconductor", "abstract": "Chiral $p$-wave superconductors are among the most intriguing topological phases: their vortices bind Majorana zero modes and their edges carry chiral Majorana modes, yet no material has been unambiguously identified as one. Here, we carry the bottom-up approach of Kitaev chains to two dimensions, proposing a minimal chiral $p$-wave superconductor from a square array of quantum dots coupled via Andreev dots. Rashba spin-orbit coupling in the tunnel barriers provides the $p$-wave winding, and a Zeeman field renders the dots spinless. At a sweet spot, the edge states are confined to the outermost row, so that a chiral thermal conductance and a vortex-bound Majorana zero mode with sub-percent splitting emerge already in $3\\times3$ and $5\\times5$ arrays. Our setup is realizable with existing InAs and Ge quantum-dot arrays.", "url": "https://arxiv.org/abs/2611.27555", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fabian Hassler"}, {"name": "Michael Wimmer"}], "featured_authors": [{"name": "Fabian Hassler"}, {"name": "Michael Wimmer"}], "author_count": 2}, {"id": "2611.27564", "category": "cond-mat", "title": "From non-universal spectra at the RS-RSB transition to the universal $ω^4$ regime inside the glassy phase", "abstract": "The universal low-frequency nonphononic density of states $\\mathcal{D}_\\mathrm{G}(\\omega)\\sim\\omega^4$ is a robust feature of structural glasses, yet its origin remains poorly understood. Here we investigate this question using the mean-field KHGPS model of interacting anharmonic oscillators. We show that the universal quartic spectrum is deeply rooted in the glassy, replica-symmetry-broken (RSB) phase, whereas the gapless density of states found at the boundary of the replica-symmetric (RS) phase is non-universal and depends sensitively on the details of the quenched disorder. We formulate a simplified variant of the KHGPS model that allows us to characterize the crossover between these two regimes and provides a physical interpretation of the associated crossover frequency scale. We further show that the conventional, spin-glass-like, continuous RS-RSB transition, accompanied by diverging susceptibilities, can be suppressed by an appropriate choice of the quenched disorder, allowing for a discontinuous RS-RSB transition even in the absence of an external field. Our results establish a direct connection between the emergence of the universal $\\omega^4$ spectrum and the glassy phase, and provide a simple framework for exploring the low-temperature properties of glasses and the soft localized excitations that emerge from bistable local potentials.", "url": "https://arxiv.org/abs/2611.27564", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tommaso Pettinari"}, {"name": "Edan Lerner"}, {"name": "Gustavo Düring"}], "featured_authors": [{"name": "Tommaso Pettinari"}, {"name": "Edan Lerner"}, {"name": "Gustavo Düring"}], "author_count": 3}, {"id": "2611.27577", "category": "cond-mat", "title": "Lacrymaria-like dynamics: compression and length change in active slender bodies", "abstract": "Length change is central to the behaviour of many active slender bodies, yet most elastohydrodynamic models of microscopic locomotion treat filaments as effectively inextensible. Here we introduce a compressible $N$-link formulation for planar active filaments, in which both bending angles and segment lengths are dynamical variables coupled through local hydrodynamic drag, modelled using resistive force theory. We first use the model to test whether passive extensibility can improve bending-driven swimming and crawling. Across the parameter ranges studied, passive compressibility usually reduces locomotion speed, indicating that axial compliance alone is not a robust mechanism for propulsion enhancement. We then prescribe active rest-length waves and show that compression can either enhance, suppress, or redirect locomotion depending on its phase, wavelength, and frequency relative to bending. Finally, motivated by the extensible neck dynamics of \\textit{Lacrymaria olor}, we apply the method to clamped and free filaments driven by oscillatory follower forces. These examples show that elastic compression-bending coupling can reorganise swimming, exploration, and locomotion in strongly deforming active filaments.", "url": "https://arxiv.org/abs/2611.27577", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Clément Moreau"}, {"name": "Yukinori Nishigami"}, {"name": "Johann Hérault"}, {"name": "Kenta Ishimoto"}], "featured_authors": [{"name": "Clément Moreau"}, {"name": "Yukinori Nishigami"}, {"name": "Johann Hérault"}, {"name": "Kenta Ishimoto"}], "author_count": 4}, {"id": "2611.27581", "category": "cond-mat", "title": "Disentangling Lengthscales in Disordered Fracture", "abstract": "The interplay between quenched disorder and collective interactions can generate multiple emergent lengthscales in damage processes, yet their roles in determining the strength of heterogeneous materials remain incompletely understood. Here, we develop a coarse-grained description of load redistribution in the two-dimensional random fuse model (RFM) with Weibull-distributed quenched disorder, interpreting shielding in the crack-tip damage density as a consequence of nonlocal current redistribution. Our numerical results distinguish this emergent screening length, identified as the size of the statistical fracture process zone, from the regularizing length in Bazant's established quasibrittle size-effect law (SEL), revealing their distinct disorder dependences, and challenging previous associations of the two. We further uncover a comparable scaling between the SEL and pre-failure crack extension, suggesting the former may instead be more naturally associated with a percolation process of micro-fractures around the crack-tip. These findings disentangle important emergent lengthscales within the RFM, and highlight a candidate physical mechanism for explaining macroscopic size effects in quasibrittle fracture.", "url": "https://arxiv.org/abs/2611.27581", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthaios Chouzouris"}, {"name": "Marcelo A. Dias"}], "featured_authors": [{"name": "Matthaios Chouzouris"}, {"name": "Marcelo A. Dias"}], "author_count": 2}, {"id": "2611.27647", "category": "cond-mat", "title": "Cyclic perturbations encode memories in trained neural networks without loss of performance", "abstract": "Many disordered materials exhibit a remarkable form of memory: they retain information about the history of cyclic perturbations. Whether this phenomenon also occurs in artificial neural networks, whose mathematical structure and dynamics share many similarities with disordered physical systems, is unknown. Here we show that cyclically perturbing a trained, overparameterized deep neural network encodes information in the structure of the weights that can subsequently be retrieved, thus retaining memory of the perturbation history. During each write cycle, all weights are displaced, after which the network relaxes through gradient descent. Repeated cycles organise the neural network into a state that is reversible for perturbations up to the write amplitude, allowing the encoded value to be read from the onset of irreversible weight motion. Multiple memories can also be encoded, although under deterministic writing only the largest persists at long times. Inspired by cyclically sheared suspensions, we introduce a novel noisy-write protocol that preserves all encoded memories at long times. Remarkably, neither deterministic nor noisy memory writing measurably affects the network's performance on unseen data from its original learning task. Our results establish cyclic memory as a phenomenon shared by disordered physical systems and deep neural networks, and show that networks can exploit as yet unexplored memory capabilities without compromising their original function.", "url": "https://arxiv.org/abs/2611.27647", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Max Kerr Winter"}, {"name": "Liesbeth M. C. Janssen"}], "featured_authors": [{"name": "Max Kerr Winter"}, {"name": "Liesbeth M. C. Janssen"}], "author_count": 2}, {"id": "2611.27654", "category": "cond-mat", "title": "Modeling the contact area and intersurface forces between Pb nanoparticles and suspended graphene", "abstract": "We perform large-scale atomistic simulations to explore the contact mechanics of Pb nanoparticles (NPs) physisorbed on a suspended graphene sheet at zero external load. The study considers the kinetics of the NPs' relative contact area and the distributions of intersurface atomic force magnitudes acting on the NP during self-assembly from the liquid phase, and the size scaling of these quantities for the solidified NPs. The functional forms of both the repulsive and attractive parts of the normal intersurface force distributions for solidified NPs are size-independent for nanoislands with a linear lateral size larger than about 10 nm (or a surface area-to-volume ratio less than about 1 nm$^{-1}$). To first order, the repulsive tail decays exponentially, while the cutoff power law fits more precisely, especially for the high-probability repulsive forces. In both cases, the decay exponent is around -5 nN$^{-1}$. The exponentially modified Gaussian is the best fit for the attractive part for most NP sizes. The time-averaged relative contact area calculated directly in the simulations shows considerable fluctuations for NPs a few nm in diameter, while converging to approximately 0.44 for larger NPs. Based on fitting the normal-force distributions, we obtain analytical expressions for the relative contact area. Ensemble-averaged relative contact areas for NPs larger than around 10 nm, calculated using the analytical expressions, match the time-averaged MD values within statistical error. Our model is the first step towards developing analytical approximations for quantitative estimates of the relative contact area of Pb NPs adsorbed on suspended graphene.", "url": "https://arxiv.org/abs/2611.27654", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mykola Prodanov"}, {"name": "Anton Samilyk"}, {"name": "Oleksii Khomenko"}, {"name": "Antonina Biesiedina"}], "featured_authors": [{"name": "Mykola Prodanov"}, {"name": "Anton Samilyk"}, {"name": "Oleksii Khomenko"}, {"name": "Antonina Biesiedina"}], "author_count": 4}, {"id": "2611.27658", "category": "cond-mat", "title": "Capillary partitioning of solutes on conformally coated colloidal monolayers: a universal geometric threshold", "abstract": "Depositing a conformal solid film on a hexagonal monolayer of spheres progressively closes the interstitial pores, and this closure controls where a dilute solute spin-coated from a volatile solvent ends up after drying: buried in the interstitial valleys or spread over the exposed caps. We derive the fraction of solute that ends in the valleys from first principles, for any sphere radius, film thickness and wetting liquid. The control parameter is the film thickness divided by the sphere radius, and a purely geometric threshold, about 0.155, separates two regimes for all sphere sizes. Below it, the three-sphere interstice is an open cup that the liquid fills through a narrow throat at the sphere equator, and about nine tenths of the solute end in the valleys. Above it, the throat pinches shut, sealing the cup and leaving only a shallow surface dimple, so this fraction drops more than twofold, never to recover. Treating the throat as a nearly triangular duct gives a closed-form filling rate, confirmed by exact flow calculations. During spin-coating, filling outpaces drying by up to five orders of magnitude, except within a fraction of a nanometre of the threshold. Partitioning is therefore set by capacity alone, through a one-parameter ratio of exact void volumes, identical for all sphere sizes. Thin-film simulations confirm the direction of liquid transport. For dye in ethanol on tantalum-pentoxide-coated polystyrene lattices, the predicted on-cap fraction rises from 0.06 to 0.76 across the threshold, agreeing at both ends with values inferred from measured Purcell factors.", "url": "https://arxiv.org/abs/2611.27658", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Renaud A. L. Vallée"}, {"name": "Carlos Drummond"}], "featured_authors": [{"name": "Renaud A. L. Vallée"}, {"name": "Carlos Drummond"}], "author_count": 2}, {"id": "2611.27747", "category": "cond-mat", "title": "Atomistic theory of the $d$-wave phonon angular momentum splitter effect", "abstract": "Phonons offer a bosonic route to angular-momentum transport in solids, but how their momentum-space textures manifest in transport remains unclear. Here we develop an atomistic theory of the phonon angular momentum splitter effect in an antiferromagnetic square lattice with checkerboard-modulated elastic couplings, analogous to the spin-splitter effect in $d$-wave altermagnets. We calculate the transport and accumulation of phonon angular momentum driven by a temperature gradient and find that the transverse response separates into Hall and $d_{xy}$-wave splitter contributions. The splitter contribution requires both the antiferromagnetic order and the checkerboard elastic modulation and exhibits a characteristic $d_{xy}$ angular dependence, whereas the Hall contribution is nearly isotropic. Their combination enables directional control of the edge phonon angular momentum accumulation.", "url": "https://arxiv.org/abs/2611.27747", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daniel A. Bustamante Lopez"}, {"name": "Dominik M. Juraschek"}], "featured_authors": [{"name": "Daniel A. Bustamante Lopez"}, {"name": "Dominik M. Juraschek"}], "author_count": 2}, {"id": "2611.27749", "category": "cond-mat", "title": "Lattice-geometry dependence of Type-I and Type-II magnetic flux responses in strongly correlated bosons", "abstract": "Superfluids and superconductors are classified into Type-I and Type-II according to their response to a magnetic flux, but this classification has hardly been addressed for lattice bosons under magnetic flux, where the Meissner and vortex phases have been studied mostly in ladder geometries. Here, we study the flux response of the extended Bose-Hubbard model with nearest-neighbor interaction $V$ at half filling on square and triangular ladders with two to four legs by using the density-matrix renormalization group. On the square ladders, the vortex phase is confined to a region near $V=0$. At finite $V$, a magnetic flux-induced charge-density-wave (CDW) order replaces it, and the response becomes Type-I-like. In contrast, on the triangular ladders, the vortex phase persists over the whole range of $V$ studied, and the response remains Type-II-like. By extrapolating the ladder results to two dimensions, we argue that the Type-I or Type-II character of the flux response depends on the lattice geometry, which suggests a role of geometric frustration.", "url": "https://arxiv.org/abs/2611.27749", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Takayuki Yokoyama"}, {"name": "Yasuhiro Tada"}], "featured_authors": [{"name": "Takayuki Yokoyama"}, {"name": "Yasuhiro Tada"}], "author_count": 2}, {"id": "2611.27763", "category": "cond-mat", "title": "General Transport Signatures of Odd-Parity Magnets: Charge--Spin Selection Rules and Temporal--Spectral Separation", "abstract": "While even-parity altermagnets are known for spatially separating charge and spin currents via the crystal spin Hall effect, the defining transport counterpart for odd-parity magnets remains to be established. Here, we establish temporal and spectral charge--spin separation as a general transport signature across all spin-splitting classes of collinear and noncollinear odd-parity magnets with unitary spin-flip inversion $\\mathcal U=[C_2^\\perp\\Vert P]$. This symmetry restricts charge responses to odd orders and $z$-polarized spin responses to even orders, independent of microscopic mechanism and without requiring spin conservation. For ac drives that reverse sign after half a period, charge and spin currents exhibit opposite half-period parities, and their spectra contain only odd charge and even spin harmonics. This allows dc spin rectification without a dc charge counterpart, even in longitudinal transport and beyond weak fields. We show that although antiunitary $\\mathcal T\\tau$ enforces odd-parity bands, it reverses the charge--spin selection of Berry-curvature and Berry-curvature-dipole responses, providing a direct transport fingerprint distinguishing the two protecting symmetries. We verify the selection rules for all linear and second-order transport mechanisms and demonstrate harmonic separation in a minimal odd-parity model, representative Floquet-engineered collinear MnPS$_3$, and the equilibrium noncollinear VCl$_2$ family.", "url": "https://arxiv.org/abs/2611.27763", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Junxi Yu"}, {"name": "Pu Zhang"}, {"name": "Yichen Liu"}, {"name": "Yongpan Li"}, {"name": "Cheng-Cheng Liu"}], "featured_authors": [{"name": "Junxi Yu"}, {"name": "Pu Zhang"}, {"name": "Yichen Liu"}, {"name": "Yongpan Li"}, {"name": "Cheng-Cheng Liu"}], "author_count": 5}, {"id": "2611.27767", "category": "cond-mat", "title": "Disk 2-point functions for conformal loop ensemble: a derivation from the SLE loop CFT", "abstract": "We give a derivation of the bulk two-point functions of two-dimensional critical loop models in the disk based on conformal loop ensembles (CLE) and the conformal field theory of SLE loop measures developed by Baverez--Jego. Combining local Ward identities with the spectral resolution of the SLE-loop CFT, we express the two-point functions as contour integrals involving known CLE three-point structure constants and Virasoro conformal blocks. With a suitable choice of contour, these integrals are absolutely convergent and provide a unified representation of a broad class of correlation functions, valid for both irrational and rational central charges. For irrational central charges, evaluating these integrals by residues determines the discrete closed-channel spectrum and yields expansions that agree with the analytic bootstrap predictions of Downing--Jacobsen--Nivesvivat--Ribault--Saleur.", "url": "https://arxiv.org/abs/2611.27767", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shengzhi Jin"}, {"name": "Xin Sun"}, {"name": "Baojun Wu"}], "featured_authors": [{"name": "Shengzhi Jin"}, {"name": "Xin Sun"}, {"name": "Baojun Wu"}], "author_count": 3}, {"id": "2611.27818", "category": "cond-mat", "title": "Corrections to the Fick-Jacobs Description of Diffusion across Pickering Droplet Interfaces", "abstract": "Particle-laden interfaces give rise to important classes of multiphase materials, including Pickering-Ramsden systems and bicontinuous interfacially jammed emulsion gels (bijels). In these systems, colloidal particles adsorb at fluid-fluid interfaces and form semipermeable layers that provide structural stability and controlled diffusive transport. These properties make them attractive for encapsulation applications and motivate understanding transport across particle-laden interfaces. Diffusion through geometries with varying cross-section, including those found at particle-laden interfaces, is commonly described using the Fick-Jacobs formalism. However, this approach relies on the assumptions of slowly varying geometries and rapid equilibration in the transverse direction. Subsequent studies have developed corrections based on higher-order geometric derivatives, but an elegant closed-form description remains elusive. Here, we compare predictions of the Fick-Jacobs model with fully resolved simulations of 2D Pickering droplets. We find that discrepancies in model predictions increase with interfacial particle crowding, revealing the limits of the Fick-Jacobs approximation. We show that the required correction can be understood through simple geometrical arguments. Our results provide an effective framework for describing transport across particle-laden interfaces and lay the foundation for a more general description of diffusion in complex geometries.", "url": "https://arxiv.org/abs/2611.27818", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rohit Khandoori"}, {"name": "Wim Thielemans"}, {"name": "Joost de Graaf"}], "featured_authors": [{"name": "Rohit Khandoori"}, {"name": "Wim Thielemans"}, {"name": "Joost de Graaf"}], "author_count": 3}, {"id": "2611.27819", "category": "cond-mat", "title": "Magnetic-Field Response of a Hyperbolic Kitaev Spin Liquid", "abstract": "Hyperbolic geometry can give rise to Kitaev spin liquids with distinct flux structures and Majorana spectra, raising the question of how these fractionalized states respond beyond exactly solvable limits. We address this question on the Kekulé-colored hyperbolic {8,3} lattice by developing an infinite projected entangled-pair-state approach with flux-resolved loop-gas initialization and geometry-adapted tensor-network contraction. Under uniform and staggered [111] magnetic fields, we find markedly different many-body responses. The uniform field induces a sharp change between competing variational branches at weak field, whereas the polarization and mean plaquette flux evolve over a much broader field range under the staggered field. Exchange-energy competition helps explain the different response scales, while third-order effective Majorana models in a fixed-flux background exhibit contrasting low-energy spectra. Our results connect the geometry-dependent fractionalized structure of a solvable hyperbolic spin liquid to its many-body response under physical perturbations that break flux conservation.", "url": "https://arxiv.org/abs/2611.27819", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tao Yang"}, {"name": "Baigeng Wang"}, {"name": "Rui Wang"}, {"name": "Z. Y. Xie"}], "featured_authors": [{"name": "Tao Yang"}, {"name": "Baigeng Wang"}, {"name": "Rui Wang"}, {"name": "Z. Y. Xie"}], "author_count": 4}, {"id": "2611.27846", "category": "cond-mat", "title": "Pseudo-entropy in Thouless Pumps and Majorana Topological Phases", "abstract": "We study the average excess pseudo entropy, $\\Delta S_{12}$, in the Rice-Mele model under Thouless pumping. We compute it for two driving schemes, the control-freak and smooth pumps, under open and periodic boundary conditions. We find that $\\Delta S_{12}$ distinguishes the trivial, monomer, and topological stages of the pump, and that it depends on the boundary condition, the driving scheme, and the reference time. We also find that a nonzero staggered potential breaks chiral symmetry and gaps out the SSH critical point, thereby flattening the pseudo-entropy peak at the phase boundary. We also study reference-state dependence in the open Kitaev chain, comparing a fixed even-parity target with five reference families: even free-fermion, pairing-only, vacuum, and two fixed gapped states. We find that the pseudo-entropy response depends on the reference and on the parity of the subsystem size, even when the reference remains gapped. At $\\mu=0$, the pairing-only reference gives the exact result $S_{\\mathrm{pr}}=\\ln 2$ for $L=4m+2$, while the $L=4m$ sequence has analytically determined finite-size corrections. These results show that, in both models, pseudo entropy is a property of the reference-target pair and the subsystem partition, rather than a reference-independent signature of the topological phase.", "url": "https://arxiv.org/abs/2611.27846", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nabaraj Khatri"}, {"name": "Shuvam Chudal"}, {"name": "Ashish Khanal"}], "featured_authors": [{"name": "Nabaraj Khatri"}, {"name": "Shuvam Chudal"}, {"name": "Ashish Khanal"}], "author_count": 3}, {"id": "2611.27923", "category": "cond-mat", "title": "The Fiscal and Economic Implications of Green Mandates: a Boltzmann Approach to Public Governance", "abstract": "Public authorities increasingly need to translate multifaceted policy objectives into concrete fiscal and investment choices while accounting for their socioeconomic consequences. A credible ex-ante impact assessment should report downstream implications attributable to the historical baseline and specified policy targets, without introducing discretionary assumptions about unknown administrative, socioeconomic or other physical processes. Bringing the large-scale perspective of statistical physics to public governance, we construct such an ex-ante impact assessment. Its scope encompasses policy objectives that condition a finite number of generalized moments of observables in the historical baseline, which comprises a sufficiently large collection of projects or public programmes. As a proof-of-principle application, we consider the green transition in the energy-generation sector using the historical baseline of many infrastructure projects from the World Bank. Our earlier results deriving closed-form expressions for coarse-grained combinatorial probabilities enable a tractable statistical and downstream assessment. We assess the statistical compatibility of the historical baseline with different levels of green-power surplus and demonstrate how the same statistical-physics construction can estimate any downstream metric expressible through arbitrary functions of generalized moments of the baseline observables. In the absence of more detailed knowledge about the processes forming the historical baseline, large-scale universality, whenever many unknown influences on collective phenomena become negligible, unambiguously offers a principled route to a self-contained ex-ante impact assessment.", "url": "https://arxiv.org/abs/2611.27923", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Katerina Savvaidou"}, {"name": "Georgia Foudoukidou-Louka"}, {"name": "Ho-Ryun Chung"}, {"name": "Orestis Loukas"}], "featured_authors": [{"name": "Katerina Savvaidou"}, {"name": "Georgia Foudoukidou-Louka"}, {"name": "Ho-Ryun Chung"}, {"name": "Orestis Loukas"}], "author_count": 4}, {"id": "2611.27948", "category": "cond-mat", "title": "Minkowski Correlation Functions (MCF): Long-range, robust shape descriptors for point patterns", "abstract": "A morphometric analysis of point patterns using Minkowski functionals is short-sighted, whereas correlation functions do not provide robust, i.e., additive shape descriptors. To combine the advantages of both standard techniques and to overcome their weaknesses, we introduce ring-based Minkowski correlation functions (MCFs) as robust and sensitive descriptors of disordered point patterns. By assigning to each point a spherical shell and quantifying the resulting t
