l.", "url": "https://arxiv.org/abs/2611.29134", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Seth Douglas"}, {"name": "Nidhal Mghirbi"}], "featured_authors": [{"name": "Seth Douglas"}, {"name": "Nidhal Mghirbi"}], "author_count": 2}, {"id": "2611.29314", "category": "quant-ph", "title": "Quantum Geometric Tensor in Parameter-Dependent Quasi-Hermitian Systems", "abstract": "A parameter-dependent physical inner product makes the comparison of quantum states at different parameter points non-unique. We formulate two geometric prescriptions for this comparison in quasi-Hermitian systems. The Type I QGT is defined by an inner-product-compatible covariant derivative and horizontal projection. It is a Hermitian, positive-semidefinite Gram tensor, and, for any normalized solution of the inner-product-preserving dynamics, its tangential component equals the physical energy variance. The Type II QGT is constructed from the endpoint overlap of physical dual states and is invariant under local $GL(1,\\mathbb{C})$ rescalings. We show that, on a normalized section, it coincides with the established left--right (LR) QGT, while providing an endpoint-overlap interpretation of that tensor. Our central result is an exact relation between the two constructions: in the positive Dyson frame, the Type I QGT is the positive Gram block of the dressed-derivative sector, while the real symmetric part of the Type II QGT is this metric minus a positive-semidefinite contribution from the metric connection; the full complex tensor also contains cross terms. This relation clarifies the origin of the possible indefiniteness of the Type II metric and separates it from the positivity of the physical Hilbert-space metric. We further distinguish instantaneous Dyson mappings from the fixed inner-product-preserving dynamics and characterize the conditions under which the corresponding QGTs agree. Three two-level models illustrate these results. The physical content of the two tensors is then identified through the energy uncertainty and evolution speed for Type I, and the symmetrized endpoint overlap, complex holonomy, and signed dynamical response for Type II.", "url": "https://arxiv.org/abs/2611.29314", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ming-Zhang Wang"}, {"name": "Xu-Yang Hou"}, {"name": "Hao Guo"}], "featured_authors": [{"name": "Ming-Zhang Wang"}, {"name": "Xu-Yang Hou"}, {"name": "Hao Guo"}], "author_count": 3}, {"id": "2611.29427", "category": "quant-ph", "title": "Bogoliubov-picture thermofield dynamics in anharmonic environments", "abstract": "Thermofield dynamics (TFD) describes finite-temperature quantum relaxation through a purified wavefunction, without sampling thermally populated initial states. For harmonic environments, TFD is typically combined with a thermal Bogoliubov transformation to obtain a compact wavefunction representation. This transformation can also be useful for anharmonic baths, but preparing the corresponding thermal state in the transformed representation poses additional numerical challenges. Here, we explore TFD approaches tailored to anharmonic potentials and compatible with efficient tensor network methods for quantum propagation. We show that the conceptually appealing route of converting a harmonic-reference thermal state into the target anharmonic state by imaginary-time propagation can be numerically ill-conditioned. As a practical alternative, we formulate a multilayer multiconfiguration time-dependent Hartree (ML-MCTDH) protocol that separates thermal-state preparation from the harmonic-reference Bogoliubov transformation. We prepare the thermal purification in the bare representation and then apply finite-basis Bogoliubov unitaries to the physical--auxiliary mode pairs. For independent bath modes, direct construction of the thermal amplitude provides a complementary initialization procedure. We illustrate this protocol through vibrational relaxation and spatial-superposition decoherence of a harmonic subsystem coupled to a Morse-oscillator bath. We find non-monotonic energy relaxation, shifts in the dominant resonant response, and oscillatory energy exchange at zero and finite temperature. For decoherence, we recover the expected harmonic-bath scaling and find a pronounced non-monotonic dependence of the decay rate on anharmonicity at finite temperature in a low-frequency model, with a weaker dependence in a high-frequency model.", "url": "https://arxiv.org/abs/2611.29427", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rocco Martinazzo"}, {"name": "Bartosz Błasiak"}, {"name": "Irene Burghardt"}], "featured_authors": [{"name": "Rocco Martinazzo"}, {"name": "Bartosz Błasiak"}, {"name": "Irene Burghardt"}], "author_count": 3}, {"id": "2611.29430", "category": "quant-ph", "title": "No-Go Theorems for Transversal and Automorphism Clifford Gates on Prime-Dimensional Qudit Stabilizer Codes", "abstract": "Logical Clifford gates are a basic primitive of fault-tolerant quantum computation. For stabilizer codes on qudits of prime dimension $p$ that encode $k\\geq 2$ logical qudits, we prove that Clifford gadgets that are transversal with respect to a fixed partition of the physical qudits into blocks of fewer than $k$ qudits cannot realize the full logical Clifford group, and that this block size is tight. Code automorphisms, which combine single-qudit Clifford gates with qudit permutations, also fail for every $p$. Both obstructions come from prime-order logical Clifford elements that these gadgets cannot reach.", "url": "https://arxiv.org/abs/2611.29430", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuchen Zhan"}, {"name": "Qi Ye"}, {"name": "Dong-Ling Deng"}], "featured_authors": [{"name": "Yuchen Zhan"}, {"name": "Qi Ye"}, {"name": "Dong-Ling Deng"}], "author_count": 3}, {"id": "2611.29463", "category": "quant-ph", "title": "Scaling of phase rigidity without eigenstate coalescence", "abstract": "Phase rigidity vanishes as a power law near exceptional points, reflecting the coalescence of eigenstates at these points. In this Letter, we show that non-Hermitian skin effects induce distinct asymptotic behaviors of phase rigidity without eigenstate coalescence. To demonstrate this, we derive exact analytical results for three non-Hermitian chain models and verify them numerically. For the ordinary skin effect, phase rigidity decays exponentially with increasing system size $N$, as the right and left eigenstates are exponentially localized at opposite boundaries. For the scale-free skin effect, phase rigidity exhibits an $N^{-2}$ power-law approach to a nonzero constant as the right and left eigenstates have decay lengths proportional to $N$. For the algebraic skin effect studied here, phase rigidity can exhibit an $N^{-1/2}$ power-law decay to zero, with the right eigenstate algebraically localized near a boundary and the left eigenstate spread across the chain. These findings show that non-Hermitian skin effects govern phase-rigidity scaling by shaping the spatial profiles of the right and left eigenstates, enabling control of eigenstate nonorthogonality without exceptional points.", "url": "https://arxiv.org/abs/2611.29463", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shang-En Xie"}, {"name": "Li-Mei Chen"}, {"name": "Yao Zhou"}, {"name": "Peng Ye"}], "featured_authors": [{"name": "Shang-En Xie"}, {"name": "Li-Mei Chen"}, {"name": "Yao Zhou"}, {"name": "Peng Ye"}], "author_count": 4}, {"id": "2611.29605", "category": "quant-ph", "title": "Just another Markovian embedding for open quantum systems", "abstract": "In this work, I present one more method for analysis of non-Markovian open quantum systems by embedding them into larger Markovian systems. As many other approaches, this method starts from finding a rational approximation for the bath correlation function in the frequency domain, the difference is that I retain $\\omega \\to -\\overline \\omega$ symmetry for the poles of the approximation. This allows to reduce the dimension of embedding from one- to half-degree-of-freedom per pole. In case of odd number of poles, the resulting equation describing dynamics of the system turns out to be not a Lindblad, but a hybrid quantum-classical master equation.", "url": "https://arxiv.org/abs/2611.29605", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vasilii Vadimov"}], "featured_authors": [{"name": "Vasilii Vadimov"}], "author_count": 1}, {"id": "2611.29631", "category": "quant-ph", "title": "Direct quantum simulation of compressible Navier-Stokes flow via finite homotopy linearisation", "abstract": "We develop a direct quantum simulation algorithm for finite homotopy approximations to the non-isothermal compressible Navier-Stokes equations. A primitive-variable formulation gives polynomial residuals in the fields and their spatial and time derivatives, including density-weighted time derivatives. On a periodic grid, applying each spatial stencil uniformly to every factor in a shifted product preserves the dynamics of the finite homotopy hierarchy in an affine linearisation. Because each deformation equation depends only on lower homotopy orders, the lifted generator matrix is strictly block lower-triangular and hence nilpotent. The resulting finite-polynomial solution evaluates the final state directly without time-stepping error, while explicit short-time convergence conditions bound the homotopy truncation error on a fixed grid. In two-dimensional Taylor-Green flow, initial pressure balance removes the leading longitudinal acceleration and delays the onset of dilatational kinetic energy from quadratic to quartic in time. At Mach numbers 0.2 and 0.4, the fifth-order hierarchy reproduces viscous dissipation over a longer interval than pressure-dilatation at the same relative tolerance. We identify auxiliary variables representing the same evolving product, compile the finite-polynomial evolution into logical quantum circuits, and recover a signed velocity Fourier mode via Hadamard interference. Together, the Taylor-Green energy budgets quantify the accuracy windows of each homotopy order, while coarse-grid circuits verify the signed readout and measure gate counts. For higher-order evolution on finer grids, merging coincident stencil terms and combining block-encoded products along strictly increasing homotopy-order paths substantially reduce the predicted normalisation cost.", "url": "https://arxiv.org/abs/2611.29631", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ming-Yang Tan"}, {"name": "Guo-Ping Guo"}, {"name": "Zhao-Yun Chen"}], "featured_authors": [{"name": "Ming-Yang Tan"}, {"name": "Guo-Ping Guo"}, {"name": "Zhao-Yun Chen"}], "author_count": 3}, {"id": "2611.29650", "category": "quant-ph", "title": "Improved two-way capacity upper bounds for amplitude-damping channels", "abstract": "We derive an improved upper bound on the two-way-assisted capacities of the qubit amplitude-damping channel with decay probability $\\gamma$, given by $\\log_2[1+(1-\\gamma)\\gamma^{\\gamma/(1-\\gamma)}]$. It applies to quantum communication, entanglement distribution, private communication, and secret-key agreement, and, for every $0<\\gamma<1$, strictly improves the PLOB relative-entropy bound, the analytic max-relative-entropy bound, and the optimized balanced squashed-entanglement bound. At high damping, a known triple-rail protocol attains more than $99.54\\%$ of its leading coefficient. Our method extends sector teleportation simulation to qubits: phase rotations and permutations give exact simulations within fixed-excitation subspaces while preserving the two-level input structure. We determine the exact, additive relative entropy of entanglement of the amplitude-damping resources and the exact regularized entanglement gain at fixed input population. We then derive explicit bounds for generalized amplitude damping, which includes thermal excitation. Combining the amplitude-damping gain with unital and entanglement-breaking channels gives a closed expression that recovers the zero-temperature result and vanishes throughout the entanglement-breaking region. It improves established benchmarks over broad parameter ranges, while the exact entanglement of the generalized resources remains open. Both results admit refinements under an average-excitation constraint. The bounds provide quantitative limits for adaptive communication through relaxing qubits and show how a sector simulation can remain useful beyond channels whose resource entanglement is known exactly.", "url": "https://arxiv.org/abs/2611.29650", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stefano Pirandola"}], "featured_authors": [{"name": "Stefano Pirandola"}], "author_count": 1}, {"id": "2611.29689", "category": "quant-ph", "title": "Local redundancies are necessary for long-lived memories in finite spatial dimensions", "abstract": "We prove a no-go theorem for exponentially long-lived thermal memories, based on the structure of redundancies among Hamiltonian terms. For local stabilizer Hamiltonians in finite spatial dimensions, the absence of local redundancies---relations in which the product of a small number of Hamiltonian terms equals the identity---is known to preclude bulk thermodynamic phase transitions. Yet glassy dynamics can still sustain long-lived memories even without a thermodynamic transition, as demonstrated by LDPC codes on non-Euclidean graphs. A longstanding question, exemplified by Haah's cubic code, is whether such a mechanism can also support passive (quantum) memory in finite-dimensional Euclidean systems. We show that this route fails for local stabilizer Hamiltonians without local redundancies: at any constant nonzero temperature, local heat-bath dynamics is fast mixing, with $O(N)$ mixing time, where $N$ is the number of qubits. We establish this by proving a strong decay of correlations property of the thermal Gibbs state. We further prove rapid mixing with $O(\\log N)$ mixing time under a stronger condition on induced redundancies in suitably chosen regions. This stronger result applies to several well-studied examples, including Haah's cubic code and its generalizations, as well as three-dimensional layer codes. Our work identifies redundancy structure as a key property for understanding thermal memories.", "url": "https://arxiv.org/abs/2611.29689", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chao Yin"}, {"name": "Yaodong Li"}, {"name": "Benedikt Placke"}, {"name": "Vedika Khemani"}], "featured_authors": [{"name": "Chao Yin"}, {"name": "Yaodong Li"}, {"name": "Benedikt Placke"}, {"name": "Vedika Khemani"}], "author_count": 4}, {"id": "2611.29755", "category": "quant-ph", "title": "Stopping-Time Leakage in Blind Quantum Delegation", "abstract": "Blind quantum computation lets a client delegate a computation while hiding it from the server, up to a declared leakage. Its security definitions cover a single round. A variational quantum algorithm, however, delegates many rounds, and its classical optimizer decides from private data when to stop. We study what the resulting round count tells an honest-but-curious server. For protocols with one-time-padded transcripts and fresh randomness in every round, we prove that the server's best distinguishing advantage over the whole sequence equals the total-variation distance between the stopping-time distributions, so the round count is the only residual channel in this model. We also show that soundness composes as $\\delta\\,\\mathbb{E}[T]$ under adaptive stopping, given a conditional per-round soundness property that composably secure verifiable protocols provide. In simulated delegated eigensolvers for the transverse-field Ising chain, the local Polyak-Lojasiewicz ratio measured in iterations 5 to 15 predicts the noiseless stopping round with a leave-one-out error of 1.7 iterations, compared with 10.3 for a constant predictor. Across 14 configurations that differ in optimizer, stopping rule, initialization, system size, shot budget and problem family, the leakage is significant in 12 and ranges from 0.14 to 1.68 bits, and a maximum-entropy bound estimated on held-out sessions lies above it in all of them. For defense, we show that any mechanism acting after the stopping decision can only add rounds, and that differentially private padding costs the full adjacency radius. A fixed public iteration budget removes the channel completely; set at the median run length, it costs 10% of the remaining energy gap. A differentially private stopping rule based on AboveThreshold protects every pair of instances, but it must often stop too early, which makes it costly.", "url": "https://arxiv.org/abs/2611.29755", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Noureldin Mohamed"}, {"name": "Saif Al-Kuwari"}], "featured_authors": [{"name": "Noureldin Mohamed"}, {"name": "Saif Al-Kuwari"}], "author_count": 2}, {"id": "2611.29787", "category": "quant-ph", "title": "Joint Dynamics of Spins and Frequency-Resolved Bosonic Occupations: A Projection-Operator Approach", "abstract": "We derive weak-coupling kinetic equations for frequency-resolved bosonic mode occupations in the spin--boson model. Rather than integrating out the bath completely, we retain these mode occupations as independent dynamical variables whose equations are coupled to those for the spin observables. A projection-operator construction closes the dynamics on a product-spin ansatz and an undisplaced Gaussian environment with a diagonal covariance matrix. The equations are obtained to second order in the interaction parameter $\\lambda$ for an arbitrary number of spins within this factorized closure, and are solved numerically for a single spin. A fixed-truncation calculation using the hierarchical equations of motion provides a benchmark for the spin dynamics with the Drude--Lorentz spectral density. The numerical results reveal a redistribution of bosonic mode occupations concentrated near the spin transition frequency $\\Omega=\\sqrt{\\Delta^2+h^2}$. We also examine the response of the coupled spin--boson system to structured spectra, nonthermal initial occupations, and slow modulation of the coupling. The calculated mode occupations also allow changes in the bath-side occupation and energy densities $p(\\omega)\\delta\\langle N_\\omega\\rangle(t)$ and $\\omega p(\\omega)\\delta\\langle N_\\omega\\rangle(t)$ to be obtained without requiring an exponential decomposition of the bath correlation function. Its scope is restricted to weak coupling, diagonal Gaussian bath states, and, for time-dependent couplings, the adiabatic regime.", "url": "https://arxiv.org/abs/2611.29787", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Khazret Sh. Meretukov"}, {"name": "Alexander E. Teretenkov"}], "featured_authors": [{"name": "Khazret Sh. Meretukov"}, {"name": "Alexander E. Teretenkov"}], "author_count": 2}, {"id": "2611.29845", "category": "quant-ph", "title": "Quantum-Memory Forensics for Tampered Quantum Seals: Resource-Dependent Sample Gains", "abstract": "Quantum seals reveal that an object was disturbed, but not where, with which tool, or when the tool changed. We study quantum-memory forensics for sealed items returning through an untrusted network where one tool opens many. Each seal cell is half of a Bell pair whose partner the verifier keeps in a protected quantum memory, a secret Pauli frame turns any attack into a Pauli channel, and a three-tier report localizes the tampering, learns a hidden-parity fingerprint of the tool and detects a tool switch in arrival order, not necessarily in attack order. Attribution concerns attackers who do not erase that fingerprint, which a random Pauli layer would do cheaply. Each result is stated within one of four verifier classes. For per-unit verifiers, which never couple two seal units and hold no untouched reference, the sample separation is asymptotically exponential, by reduction from a known lower bound for one parity of strength up to 1/3. On ten tampered cells it is proved to be at least \\qnProvedUniformMin-fold against non-adaptive stabilizer probes and observed in simulation at \\qnEoneRatioFine-fold. Against an implemented self-referencing strategy the simulated gain is about twice the inverse squared strength. The value also depends on the attack: destroying the untouched cells makes the reference necessary, whereas copying errors exposes the fingerprint to reference-free probes. We derive the vault's qubit inventory and simulate a seal requirement curve: ten times more seal noise lengthens the seal's lifetime \\qnSealLifeGainFive-fold at \\qnSealRhoFive{} times the attribution cost at $r=10$.", "url": "https://arxiv.org/abs/2611.29845", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jaeyun Jeong"}, {"name": "Zehua Wang"}, {"name": "Lilia Tightiz"}, {"name": "Ki-Woong Park"}, {"name": "Victor C. M. Leung"}], "featured_authors": [{"name": "Jaeyun Jeong"}, {"name": "Zehua Wang"}, {"name": "Lilia Tightiz"}, {"name": "Ki-Woong Park"}, {"name": "Victor C. M. Leung"}], "author_count": 5}, {"id": "2611.29965", "category": "quant-ph", "title": "Proposal for a cat-cluster-state machine gun", "abstract": "Non-Gaussian bosonic states such as the Schrödinger cat states are essential for continuous-variable quantum-information processing. A convenient and deterministic process for generating cat states is through the use of a Rabi interaction between a single bosonic mode and a spin which facilitates a state-dependent displacement. The lack of a Rabi interaction for propagating optical photons has rendered optical cat states elusive. Here, we show that the complex nonlinear scattering dynamics of a single-mode squeezed-vacuum state interacting with a quantum emitter can be engineered to produce a Rabi interaction between a quantum emitter and a propagating photon mode while the contributions from other orthogonal modes destructively interfere. Our protocol can deterministically prepare large-scale high-fidelity squeezed cat states from squeezed-vacuum pulses and is robust to photon loss due to spontaneous emission to non-guided modes. Extending to scattering multiple input squeezed-vacuum pulses off the quantum emitter, we propose generating linear cluster state strings with logical qubits encoded as squeezed cat states, which we refer as the cat cluster state. Our interaction scheme can potentially produce strings of entangled cat states at GHz rates using semiconductor quantum dots.", "url": "https://arxiv.org/abs/2611.29965", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Haoyuan Luo"}, {"name": "Hugo P. Stackhouse"}, {"name": "Sahand Mahmoodian"}], "featured_authors": [{"name": "Haoyuan Luo"}, {"name": "Hugo P. Stackhouse"}, {"name": "Sahand Mahmoodian"}], "author_count": 3}, {"id": "2611.30014", "category": "quant-ph", "title": "Spin-adapted state preparation for quantum chemistry", "abstract": "Quantum phase estimation for strongly-correlated molecules requires an initial state of high overlap with the true ground state, and preparing one is a significant fault-tolerant cost. Matrix product states (MPS) produced by the density matrix renormalisation group (DMRG) are a leading choice, yet existing circuits treat their tensors as dense or do not use the full symmetries present in molecular electronic Hamiltonians. In quantum chemistry, DMRG also exploits total spin, a non-abelian symmetry, storing one amplitude per spin multiplet instead of one per state. We show that the reduced tensors of such a spin-adapted MPS, labelled by the steps of the unitary group approach, form an abelian-symmetric MPS, which existing block-sparse preparation protocols can load at a cost set by the multiplet count. One state-independent rotation per site, determined by a Clebsch-Gordan coefficient, then returns the state to the occupation basis. We provide resource estimates for our circuits on singlet ground states of active space models of iron-sulphur clusters, finding improvements in Toffoli count up to $135\\times$ compared to dense methods and $4.9\\times$ compared to block-sparse methods applied to the same states, with up to $3.7\\times$ fewer ancilla qubits required.", "url": "https://arxiv.org/abs/2611.30014", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthew L. Sims-Goh"}, {"name": "Fredrik Hasselgren"}, {"name": "Hamza Jnane"}], "featured_authors": [{"name": "Matthew L. Sims-Goh"}, {"name": "Fredrik Hasselgren"}, {"name": "Hamza Jnane"}], "author_count": 3}, {"id": "2611.30038", "category": "quant-ph", "title": "Super-Multiplicativity of the Noncommutative Minimum and Applications to Quantum Privacy and Hypothesis Testing", "abstract": "The hockey-stick divergence is a fundamental distinguishability measure in quantum information theory. It characterizes quantum differential privacy and determines the optimal error probability of binary quantum hypothesis testing with arbitrary priors. We study how it behaves on tensor-product states. To this end, we consider the noncommutative minimum $m(A,B):=(\\mathrm{Tr}[A]+\\mathrm{Tr}[B]-\\|A-B\\|_1)/2$ of positive semidefinite operators, which reduces to $\\sum_x\\min\\{a_x,b_x\\}$ when $A$ and $B$ commute, and we prove that it is super-multiplicative, i.e., $m(A\\otimes C,B\\otimes D)\\ge m(A,B)\\,m(C,D)$. As a consequence, we establish a sub-additivity property of the hockey-stick divergence on product states, in which the parameters of the individual systems are multiplied, and no additional prefactor appears. We show that this bound is tight, also for noncommuting states, and that it is strict for faithful states whenever at least two of the divergences are positive. Using this, we obtain sub-additivity of the Datta-Leditzky divergences, a parallel composition theorem for quantum differentially private channels under product neighboring inputs with at most linear degradation of the privacy parameters, and a sharp sub-additivity property of the hypothesis-testing relative entropy normalized by the acceptance probability. Finally, we apply the same tools to symmetric binary quantum hypothesis testing. We determine the exact prefactor of the quantum Chernoff bound for every pair of noncommuting states satisfying mild conditions including a nonlattice condition and, under a quantitative version of this condition, the full asymptotic expansion to every fixed order in $1/n$, with explicitly computable coefficients. As a consequence, we determine the sample complexity of symmetric binary quantum hypothesis testing up to one sample, as the error probability tends to zero.", "url": "https://arxiv.org/abs/2611.30038", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Theshani Nuradha"}, {"name": "Sujeet Bhalerao"}, {"name": "Christoph Hirche"}, {"name": "Mark M. Wilde"}, {"name": "Mingze Xu"}], "featured_authors": [{"name": "Theshani Nuradha"}, {"name": "Sujeet Bhalerao"}, {"name": "Christoph Hirche"}, {"name": "Mark M. Wilde"}, {"name": "Mingze Xu"}], "author_count": 5}, {"id": "2611.30097", "category": "quant-ph", "title": "Positive-partial-transpose structure of completely entangled subspaces and their complements", "abstract": "A completely entangled subspace (CES) contains no product vectors, so every state supported on it is entangled. Whether such a subspace can support states with positive partial transpose (PPT) is a more subtle question. The normalized projector onto a CES may be NPT even if there exist PPT states supported on the CES. We investigate this distinction using a semidefinite criterion that optimizes the smallest partial-transpose eigenvalue over all supported density operators. For two- qutrit states supported on CESs, this leads to a complete characterization: a CES supports PPT states exactly when it is four-dimensional and related by invertible local transformations to the complement of an unextendible product basis (UPB). We also establish restrictions on PPT states whose ranges contain only vectors of Schmidt rank at least three, ruling out their existence in $3\\otimes n$, $4\\otimes4$, and $4\\otimes5$, and showing that any such state in $4\\otimes6$ must have rank eight. An interesting structure emerges when two orthogonal completely entangled subspaces together span the full Hilbert space, which we term \\textit{complementary CESs}. Explicit constructions in $3\\otimes4$ demonstrate that both subspaces can support PPT entanglement even when their normalized projectors are NPT. In $4\\otimes4$, we construct a complementary pair whose normalized projectors are themselves PPT entangled. These constructions offer an alternative route to obtaining PPT entangled states, beyond the familiar approach based on UPB complements.", "url": "https://arxiv.org/abs/2611.30097", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gurvir Singh"}, {"name": "Arvind"}], "featured_authors": [{"name": "Gurvir Singh"}, {"name": "Arvind"}], "author_count": 2}, {"id": "2611.30105", "category": "quant-ph", "title": "Remote Charging of Quantum Batteries via a Multimode Resonator", "abstract": "We study the remote charging of a qubit battery by a qubit charger coupled through a finite multimode resonator. The charging protocol uses time-shifted coupling pulses that account for the spatial phases of the resonator modes. We compare the energy stored in the battery with its ergotropy, the maximum work extractable by a local unitary operation. In the single-excitation regime considered here, the battery stores energy at any nonzero excited-state population, but its ergotropy is positive only when that population exceeds one half. In the absence of loss, stronger coupling brings the battery above this threshold earlier, while the final charge remains nearly complete across the coupling range studied. For the parameters considered, qubit relaxation suppresses ergotropy more strongly than resonator loss at comparable decay rates. After the battery is disconnected, relaxation causes its stored energy to decay exponentially, yet its ergotropy vanishes at a finite time while half of its energy capacity remains occupied. For a fixed storage interval, disconnecting at the population maximum therefore preserves the most extractable work.", "url": "https://arxiv.org/abs/2611.30105", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Maryam Hadipour"}, {"name": "Soroush Haseli"}], "featured_authors": [{"name": "Maryam Hadipour"}, {"name": "Soroush Haseli"}], "author_count": 2}, {"id": "2611.30187", "category": "quant-ph", "title": "Quantum simulation of low-temperature impurity models", "abstract": "Quantum impurity models, which describe a small but strongly-interacting subsystem coupled to a large noninteracting bath, are the computational core of dynamical mean field theory and play an important role in simulating strongly correlated materials. We develop quantum algorithms for efficiently simulating these models at low temperatures and with high precision. For any impurity model on $n$ fermionic modes with fixed impurity size: (1) We give a quantum algorithm that prepares the thermal state at inverse temperature $\\beta$ to precision $\\delta$ in time $\\mathrm{poly}(n,\\beta,\\log(1/\\delta))$. This algorithm is the first to achieve both polynomial scaling in the inverse temperature and polylogarithmic scaling in the precision. When the Hamiltonian has an inverse-polynomial spectral gap, our quantum algorithm prepares its ground state to precision $\\delta$ in time $\\mathrm{poly}(n,\\log(1/\\delta))$. (2) We further give a quantum algorithm that prepares a purification of the thermal state in time $\\mathrm{poly}(n,\\beta,\\log(1/\\delta))$. Using this purification, we estimate static and dynamical properties with error $\\delta$ in time polynomial in $n$ and $\\beta$ and linear in $1/\\delta$ up to polylogarithmic factors, achieving the Heisenberg scaling. Our algorithms build on quantum Gibbs samplers, which are quantum analogues of Markov chain Monte Carlo methods. By using global jump operators instead of local ones, we avoid the $\\exp(\\beta)$ overhead commonly associated with quantum Gibbs samplers, making them efficient for impurity models even at low temperatures.", "url": "https://arxiv.org/abs/2611.30187", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jiaqing Jiang"}, {"name": "Nathan Ju"}], "featured_authors": [{"name": "Jiaqing Jiang"}, {"name": "Nathan Ju"}], "author_count": 2}, {"id": "2611.30192", "category": "quant-ph", "title": "Combining Schrödinger and Heisenberg Evolution to Extend Quantum Many-Body Simulations", "abstract": "Classical simulations of quantum many-body dynamics face complementary limitations: entanglement growth restricts state evolution in the Schrödinger picture, while operator spreading makes Heisenberg-picture calculations increasingly expensive. Here, we combine both approaches by evolving quantum states and observables independently and joining their dynamics through massively parallel tensor-network contractions. We implement this strategy using tree tensor networks and sparse Pauli propagation, extending evolution times beyond those reached by either method separately in our calculations. For a quench of the two-dimensional transverse-field Ising model at the critical field, we simulate the magnetization of an $11\\times11$ open lattice up to $t=1.20$ by combining state and operator evolution over intervals $t_S=t_H=0.60$. We compare the dynamics with iPEPS, numerical linked-cluster expansion, and X-truncated sparse Pauli dynamics results. We also combine exact state evolution on small clusters with operator propagation on a larger lattice, improving agreement with iPEPS relative to cluster evolution alone. We further derive error bounds showing how the state can suppress operator errors and the evolved observable can reduce sensitivity to state errors.", "url": "https://arxiv.org/abs/2611.30192", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhigang Hu"}, {"name": "Igor Ermakov"}, {"name": "Yauheni Talochka"}, {"name": "Biao Wu"}, {"name": "Oleg Lychkovskiy"}], "featured_authors": [{"name": "Zhigang Hu"}, {"name": "Igor Ermakov"}, {"name": "Yauheni Talochka"}, {"name": "Biao Wu"}, {"name": "Oleg Lychkovskiy"}], "author_count": 5}, {"id": "2611.30426", "category": "quant-ph", "title": "Exact finite-sample and loss limits of squeezed-vacuum phase estimation", "abstract": "We settle the dispute over squeezed-vacuum phase estimation by exact computation of the finite-sample errors, resource-fair scaling, phase window, and loss ceilings. A fixed overhead of ten repetitions sets the attainable finite-sample frontier; the repetitions cancel from the resource-fair bound, so Heisenberg scaling survives; the operating window holds a repetition-set number of resolvable points and needs one bit of branch prior; and fixed loss caps the per-photon advantage at a value set only by transmissivity, already reached by the reported record.", "url": "https://arxiv.org/abs/2611.30426", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wangjun Lu"}, {"name": "Qing Yu"}], "featured_authors": [{"name": "Wangjun Lu"}, {"name": "Qing Yu"}], "author_count": 2}, {"id": "2611.30485", "category": "quant-ph", "title": "Universal stabilizer correlations in chaotic eigenstates", "abstract": "Entanglement and nonstabilizerness provide complementary perspectives on quantum-state structure. In this work, we find that the stabilizer correlation, defined as the difference between the Rényi-$2$ mutual information and the mutual stabilizer Rényi entropy, approaches a universal constant for chaotic eigenstates. This constant is determined solely by the symmetries, and quantifies the correlation that does not contribute to nonstabilizerness. We identify this universal stabilizer correlation analytically via random-state ensembles, which give $\\log_2 7$ (GOE) and $\\log_2 4$(GUE) without extra symmetries, $\\log_2 14$ and $\\log_2 8$ under spin-inversion parity or half-filling magnetization. While imposing reflection or translation symmetry leaves these values unchanged. Exact calculations for a chaotic mixed-field Ising chain confirm the predicted plateau and finite-size approach. Integrable free-fermion and strongly disordered eigenstates behave qualitatively differently. This universal stabilizer correlation reveals a characteristic structure of chaotic eigenstates beyond entanglement or nonstabilizerness alone.", "url": "https://arxiv.org/abs/2611.30485", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhi-Han Liu"}, {"name": "Hao-Yue Qi"}, {"name": "Wei Zheng"}], "featured_authors": [{"name": "Zhi-Han Liu"}, {"name": "Hao-Yue Qi"}, {"name": "Wei Zheng"}], "author_count": 3}, {"id": "2611.30645", "category": "quant-ph", "title": "Floquet dark-mode manipulation in a three-mode optomechanical system", "abstract": "We propose a Floquet sideband method to manipulate the dark-mode effect in a three-mode optomechanical system consisting of a single cavity mode coupled to two mechanical modes. We introduce a periodic frequency modulation for one mechanical mode to generate the Floquet sidebands, one of which is selected to match the resonance frequency of the other mechanical mode, allowing complete destructive interference to produce a mechanical dark mode decoupled from the cavity mode. The semiclassical operating point is determined self-consistently within the framework for linearization of optomechanical interaction, and the linear stability is examined under the rotating-wave approximation. We evaluate the validity of the approximate Hamiltonian by examining the fidelity between the states governed by the approximate and exact Hamiltonians. We further demonstrate dark-mode control by inspecting the bright/dark-mode populations of the system, when a frequency detuning is introduced suddenly. These results may provide a basis for further study of quantum-state storage using the Floquet mechanical dark modes.", "url": "https://arxiv.org/abs/2611.30645", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mian Mao"}, {"name": "Jin-Feng Huang"}, {"name": "Jie-Qiao Liao"}], "featured_authors": [{"name": "Mian Mao"}, {"name": "Jin-Feng Huang"}, {"name": "Jie-Qiao Liao"}], "author_count": 3}, {"id": "2611.30654", "category": "quant-ph", "title": "Quantum Cyclic XYZ Stabilizer Codes", "abstract": "XYZ codes generalize the Calderbank--Shor--Steane (CSS) framework by adding $\\sym{Y}$-type stabilizers to the usual $\\sym{X}$- and $\\sym{Z}$-type ones. We study XYZ codes whose three classical component codes are binary cyclic codes of odd length~$n$. Assigning disjoint sets of irreducible factors of $x^n-1$ to the three Pauli types fixes the number of encoded logical qubits and ensures that the row spaces of the three parity-check matrices intersect pairwise trivially. Then, a coprimality condition between the factors assigned to each type and the reciprocals of those assigned to the others guarantees the required orthogonality. Cyclotomic cosets give a complete and explicit description of the resulting family. We show that, for odd~$n$, a cyclic stabilizer code admits an XYZ representation with cyclic component codes iff its stabilizer generators are invariant, up to a phase, under the qubit permutation $i\\mapsto 2i\\bmod n$. By fixing the length and the dimension of the code, the proposed cyclic XYZ codes attain the best known minimum distance of stabilizer codes, exceed the minimum distance of the underlying CSS codes, and even exceed the linear-programming upper bounds for general CSS codes.", "url": "https://arxiv.org/abs/2611.30654", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alessio Baldelli"}, {"name": "Francisco Lázaro"}, {"name": "Davide Orsucci"}, {"name": "Massimo Battaglioni"}], "featured_authors": [{"name": "Alessio Baldelli"}, {"name": "Francisco Lázaro"}, {"name": "Davide Orsucci"}, {"name": "Massimo Battaglioni"}], "author_count": 4}, {"id": "2611.30744", "category": "quant-ph", "title": "Geometric properties of concatenated geometric and holonomic quantum gates", "abstract": "We investigate the geometric properties of concatenated quantum gates, focusing on the distinction between geometric and holonomic quantum computation. We show that, although individual gates may be purely geometric, their concatenation does not generally preserve this property, since the cyclic states of the composite operation can accumulate nontrivial dynamical phases over the course of the concatenated evolution. In contrast, we demonstrate that concatenations of arbitrary single-qubit holonomic gates remain holonomic, provided that the parallel-transport condition holds throughout the evolution and the computational subspace undergoes cyclic evolution. The preservation of geometric or holonomic character under concatenation is an important prerequisite for extending arguments underlying geometric protection from individual gates to complete quantum circuits.", "url": "https://arxiv.org/abs/2611.30744", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rasmus Wallentin"}, {"name": "Erik Sjöqvist"}], "featured_authors": [{"name": "Rasmus Wallentin"}, {"name": "Erik Sjöqvist"}], "author_count": 2}, {"id": "2611.30789", "category": "quant-ph", "title": "Quantum resources constrain function approximation", "abstract": "Universal function approximation is central to machine learning. Quantum learning models are universal as well, but this does not specify the resources needed to approximate a given function. We study how coherence, imaginarity, entanglement and magic constrain function approximation for a fixed encoding and readout, using the cumulative resource power of the trainable gates. In a one-qubit model with phase encoding, coherence bounds the oscillation of the model function, while imaginarity bounds its odd part. In a two-qubit model, entanglement bounds the distance from product functions. These bounds hold at any encoding depth. For magic, the phase encoding itself supplies non-Clifford operations. On domains bounded away from zero, Clifford trainable gates suffice for uniform approximation. Replacing unrestricted trainable gates by Clifford gates increases the encoding depth at most polynomially in the original depth, the inverse error and the inverse distance of the domain from zero. Magic in the trainable gates can nevertheless improve accuracy at fixed depth. These results show how the resources of a quantum model must match the structure of the target function.", "url": "https://arxiv.org/abs/2611.30789", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Oxana Shaya"}, {"name": "Lirandë Pira"}], "featured_authors": [{"name": "Oxana Shaya"}, {"name": "Lirandë Pira"}], "author_count": 2}, {"id": "2611.30902", "category": "quant-ph", "title": "Optimal fidelity over zero-capacity erasure channels", "abstract": "Antidegradable quantum channels have zero capacity for reliable quantum communication. However, they can nevertheless transmit quantum information with nontrivial fidelity. This raises the question: how well can quantum information be preserved through such channels? In this work, we exactly characterize the optimal asymptotic entanglement fidelity of quantum erasure channels throughout the antidegradable regime. Specifically, we show that it equals $\\gamma+\\frac{1-\\gamma}{d}$ for transmission probabilities $0<\\gamma\\le \\frac{1}{2}$ and logical dimension $d$. We use fractional extendibility to establish an upper bound on the entanglement fidelity achievable by arbitrary error-correcting protocols. Furthermore, we construct a family of permutation-invariant codes that asymptotically saturates this bound.", "url": "https://arxiv.org/abs/2611.30902", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Camilo Castro-Landolt"}, {"name": "Rabsan Galib Ahmed"}, {"name": "Graeme Smith"}], "featured_authors": [{"name": "Camilo Castro-Landolt"}, {"name": "Rabsan Galib Ahmed"}, {"name": "Graeme Smith"}], "author_count": 3}, {"id": "2611.30947", "category": "quant-ph", "title": "Linear entanglement suffices for $f$-routing", "abstract": "In $f$-routing, Alice receives an $n$-bit string $x$ and an unknown qubit, and Bob receives an $n$-bit string $y$. They share a state prepared in advance and exchange one simultaneous message each. The party selected by the Boolean function $f(x,y)$ must then recover the unknown qubit without further communication. To perform $f$-routing successfully, Alice and Bob need to share entanglement that scales with $n$ for some functions $f$, but the lower and upper bounds for the entanglement are not tight. This paper shows that $2n+2$ shared EPR pairs suffice for every function $f$. The best previous bound that holds for all functions is a shared state of $2^{O(\\sqrt{n\\log n})}$ qubits. The new strategy moves the cost from the shared state to the messages: Alice sends an exponentially long message of $2^{n+1}+1$ qubits, while Bob sends only classical bits. When the messages are counted towards the resources as well, the previous strategy remains the cheapest known. The result also limits lower bounds that count only the shared state: they cannot exceed a linear number of EPR pairs. The result is formalized in Lean.", "url": "https://arxiv.org/abs/2611.30947", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kevin Bogner"}], "featured_authors": [{"name": "Kevin Bogner"}], "author_count": 1}, {"id": "2611.30969", "category": "quant-ph", "title": "Wigner negativity costs phase-space area: A conjectured refinement of the Lieb--Solovej inequality at Rényi order one half", "abstract": "We conjecture that the Wigner logarithmic negativity of any single-mode state is bounded by the amount by which the Rényi-$1/2$ entropy of its Husimi function exceeds the coherent-state value, with equality only for coherent states. If true, this refines the Lieb--Solovej (generalized Wehrl) inequality with a remainder term that is a resource monotone, and it implies that heterodyne statistics alone certify an upper bound on the classical-simulation cost of a state. We show that it suffices to prove the conjecture for pure states, since the negativity is convex and the squared $L^{1/2}$ norm of the Husimi function is concave. We prove the conjecture up to an additive constant $\\ln 2$ for all states, and identify where the factor of two is lost: For pure states the Wigner function is the wavefunction of a two-mode state obtained by passive operations, and over generic two-mode wavefunctions our constant is already optimal, so that a proof of the sharp bound must exploit the product structure of that state. Finally, we show with an explicit superposition of the vacuum and a distant coherent state that the analogous inequality fails for the Wehrl entropy and for higher Rényi orders, meaning that the conjecture is not a consequence of the majorization relation underlying the Lieb--Solovej theorem.", "url": "https://arxiv.org/abs/2611.30969", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Christos N. Gagatsos"}], "featured_authors": [{"name": "Christos N. Gagatsos"}], "author_count": 1}, {"id": "2611.31000", "category": "quant-ph", "title": "Quantum Approximation and Integration in Sobolev Spaces -- Low Smoothness", "abstract": "We study the complexity of approximation and integration in Sobolev spaces in the quantum setting of information-based complexity theory (IBC). Previous results have been obtained under the assumption that the embedding condition holds. Here we drop this assumption and use a quantum version of a previously developed stochastic discretization technique.", "url": "https://arxiv.org/abs/2611.31000", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stefan Heinrich"}], "featured_authors": [{"name": "Stefan Heinrich"}], "author_count": 1}, {"id": "2611.31114", "category": "quant-ph", "title": "Resilience of Entangling Gates to Spatiotemporally Correlated Noise", "abstract": "As quantum processors scale, spatially and temporally correlated noise is emerging as a limiting factor in the fidelity of multiqubit gates. Here we show that this makes the choice of entangling operation a first-order design decision: for two-qubit gates in semiconductor spin qubits, the CZ and $\\sqrt{\\mathrm{iSWAP}}$ gates exhibit a pronounced resilience to correlated noise relative to the SWAP gate, even though correlated fluctuations of the entangling interaction can degrade gate performance to a level comparable to that of local noise. We trace this hierarchy to the redistribution of noise-sensitive channels away from zero frequency and show it to hold for noise spectra dominated by low-frequency weight, including $1/f$ and Lorentzian. These results follow from a general expression, derived here, for the average gate infidelity under arbitrary spatiotemporal noise correlations, valid for generic multiqubit systems and system-environment coupling structures. The infidelity takes the form of a spectral overlap between the noise correlation matrix and a gate-dependent filter function, in which the coherent dynamics of the gate itself shapes the spectral window through which correlated fluctuations enter. The framework converts measured noise correlations into quantitative error budgets and provides a concrete design principle for selecting entangling operations in scalable quantum architectures.", "url": "https://arxiv.org/abs/2611.31114", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xinru Tang"}, {"name": "Sander Driessen"}, {"name": "Ji Zou"}, {"name": "Stefano Bosco"}, {"name": "Jelena Klinovaja"}, {"name": "Daniel Loss"}], "featured_authors": [{"name": "Xinru Tang"}, {"name": "Sander Driessen"}, {"name": "Ji Zou"}, {"name": "Stefano Bosco"}, {"name": "Jelena Klinovaja"}, {"name": "Daniel Loss"}], "author_count": 6}, {"id": "2611.31116", "category": "quant-ph", "title": "A Quantum Model from the Riemann-Siegel Formula", "abstract": "We construct a two-component quantum model in which destructive interference selects the critical-line zeros of a regularized zeta function within a continuous spectrum. Starting from the exact Riemann--Siegel integral representation, we define $\\zeta_{\\rm reg}(s)$ by subtracting the contribution of the pole at the origin. The two remaining contour integrals supply the interfering amplitudes. A Dirichlet heat filter suppresses high spatial frequencies, and an arithmetic dressing has a profile generated by prime-power dilations. These transformations map the dilation generator to a self-adjoint, parity--time ($PT$) symmetric Hamiltonian on a physical Hilbert space with a positive metric. Its spectrum is real and continuous. The computed lower critical-line zeros of $\\zeta_{\\rm reg}(s)$ lie close to the corresponding Riemann zeros and exhibit spacing and pair-correlation statistics consistent with the Gaussian unitary ensemble over the sampled range. Whether every analytic zero in the lower half of the critical strip belongs to the physical spectral family remains open.", "url": "https://arxiv.org/abs/2611.31116", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Germán Sierra"}], "featured_authors": [{"name": "Germán Sierra"}], "author_count": 1}, {"id": "2611.31179", "category": "quant-ph", "title": "Floquet spectra and parameter sensitivity of entanglement in the quantum kicked top", "abstract": "We investigate the relationship between the Floquet spectrum and the sensitivity of the entanglement landscape to parameter and initial condition change in the quantum kicked top. We focus on the case of four qubits and on locating degeneracies in its Floquet eigenphases using the resultant of its characteristic polynomial $p$ and its derivative $\\partial_{\\lambda}p$ and quantitatively map the sensitivity of the entanglement landscape to changes in kicking strength over the sphere of spin coherent initial states. We find that prominent sensitivity maxima coincide with either Floquet eigenphase degeneracies or kick strengths exhibiting short-period quantum revivals, with some points satisfying both conditions. These results establish a connection between the spectral structure of the Floquet operator and entanglement landscape sensitivity, demonstrating the utility of the resultant in studying the dynamics of small-$j$ quantum kicked tops. Since this structure extends to all values of $j$, the central lessons apply completely generally.", "url": "https://arxiv.org/abs/2611.31179", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dyari Jarvis"}, {"name": "Peter A. Rose"}, {"name": "Arjendu K. Pattanayak"}], "featured_authors": [{"name": "Dyari Jarvis"}, {"name": "Peter A. Rose"}, {"name": "Arjendu K. Pattanayak"}], "author_count": 3}, {"id": "2611.31236", "category": "quant-ph", "title": "Two messages suffice for quantum interactive proof systems", "abstract": "Quantum interactive proof systems can be parallelized to three messages, as shown by Kitaev and Watrous (STOC 2000), perhaps their most striking distinction from classical counterparts. In this work, we establish that any quantum interactive proof system can further be parallelized to two messages, with the verifier sending halves of EPR pairs (``quantum public coins'') and, after the prover's response, using only stoquastic verification. Technically, we strengthen ${\\sf QIP}(3) = {\\sf QIP} = {\\sf PSPACE}$ of Jain, Ji, Upadhyay, and Watrous (JACM, 2011) and fully characterize two-message quantum interactive proof systems by proving \\[ {\\rm qq}\\text{-}{\\sf StoqAM} = {\\rm qq}\\text{-}{\\sf QAM} = {\\sf QIP}(2) = {\\sf QIP} = {\\sf PSPACE}. \\] Our main technical contributions show that Close Image to Uniform (CIUniform), which is naturally in the stoquastic version of ${\\rm qq}\\text{-}{\\sf QAM}$, is $\\sf PSPACE$-hard via transforming the sum-check protocol of Shamir (JACM, 1992) and Shen (JACM, 1992) into a CIUniform instance consisting of an efficient sampler whose image distribution is exactly uniform for some input distribution when the underlying quantified Boolean formula is true.", "url": "https://arxiv.org/abs/2611.31236", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yupan Liu"}], "featured_authors": [{"name": "Yupan Liu"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
