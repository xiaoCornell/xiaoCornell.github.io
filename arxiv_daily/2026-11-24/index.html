wo-phase morphology via Minkowski functionals, MCFs capture structural information across multiple length scales, remain sensitive at radii where conventional disk-based Minkowski functionals have saturated, and implicitly encode higher-order correlations beyond the pair correlation and structure factor. We present an exact and efficient algorithm for planar patterns extending the established disk-based morphological approach to long ranges. Applications across scales -- active colloids (Quincke rollers), longleaf pine trees, and the Hubble Ultra Deep Field -- demonstrate clear and systematic deviations from homogeneous Poisson references, with distinct responses of covered area, boundary length, and Euler characteristic. The approach combines short computation times, robustness to noise, and straightforward edge handling with clear interpretability as low-dimensional functions of the outer ring radius.", "url": "https://arxiv.org/abs/2611.27948", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dominik Pabst"}, {"name": "Michael A. Klatt"}, {"name": "Klaus Mecke"}], "featured_authors": [{"name": "Dominik Pabst"}, {"name": "Michael A. Klatt"}, {"name": "Klaus Mecke"}], "author_count": 3}, {"id": "2611.27976", "category": "cond-mat", "title": "Observation of rotonic density enhancement at the boundary of a uniform dipolar superfluid", "abstract": "The collective excitations of a quantum liquid lie at the heart of its emergent behaviour. In many systems, the variation of excitation energy ${\\varepsilon}$ with wavevector $k$ exhibits a softening at a characteristic lengthscale, which plays a key role in thermodynamics and transport. These excitations, termed rotons, often reflect an underlying tendency of the liquid to crystallize into a competing symmetry-broken state, such as the solid state of helium or the Wigner crystal of electrons in a magnetic field. More than $50$ years ago, it was predicted that rotons should manifest as emergent density oscillations at the fluid's boundary, but this effect has not been observed. Here, we realize an ultracold dipolar superfluid confined in a homogeneous trapping potential and directly confirm the emergence of rotonic density enhancement at its edge. This is accompanied by rotonic density fluctuations across the bulk, which are linked to the static edge structure via the fluctuation-dissipation theorem. Increasing the dipolar character leads to an azimuthal density modulation of the fluid's boundary, which we show to be analogous to the behaviour of a quasi-one-dimensional fluid confined in an annular optical potential.", "url": "https://arxiv.org/abs/2611.27976", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jasmine Kalia"}, {"name": "Kiryang Kwon"}, {"name": "William J. Solorio Hernandez"}, {"name": "Rubaiya R. Emran"}, {"name": "Aryan Prasad"}, {"name": "Richard J. Fletcher"}], "featured_authors": [{"name": "Jasmine Kalia"}, {"name": "Kiryang Kwon"}, {"name": "William J. Solorio Hernandez"}, {"name": "Rubaiya R. Emran"}, {"name": "Aryan Prasad"}, {"name": "Richard J. Fletcher"}], "author_count": 6}, {"id": "2611.27980", "category": "cond-mat", "title": "Structure and relaxation of long-lived odd-parity modes in two-dimensional Fermi liquids", "abstract": "In two-dimensional Fermi liquids, odd-parity deformations of the Fermi surface relax anomalously slowly at a rate $\\sim T^4$, where $T$ is the temperature. However, the leading-logarithmic prediction for the magnitude of this rate $\\sim m^4 \\ln m$, where $m$ is an angular harmonic index, exceeds exact-diagonalization results and the $\\ln m$ scaling is not observed. We resolve this discrepancy by evaluating the 2D Fermi-liquid collision integral for general regular isotropic potentials to leading order in $T/T_F$, including the nonlogarithmic term beyond the $\\ln(T_F/T)$ term. We find that the local temperature modulation of the odd mode, which we call the thermal dressing, suppresses relaxation by collinear scattering, with residual relaxation set by large-angle scattering. Such large-angle processes give corrections of order $\\ln m/\\ln(T_F/T)$ that are not small and must be resummed. We benchmark our results against exact-diagonalization calculations for constant interactions and find agreement over a range $m^2 T/T_F \\lesssim 0.4$, and we provide closed-form results for the slowest odd-mode relaxation rate of a spin-polarized dipolar gas.", "url": "https://arxiv.org/abs/2611.27980", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stan Boeve"}, {"name": "Johannes Hofmann"}], "featured_authors": [{"name": "Stan Boeve"}, {"name": "Johannes Hofmann"}], "author_count": 2}, {"id": "2611.27981", "category": "cond-mat", "title": "Thermopower overshoot from collinear scattering in two-dimensional Fermi liquids", "abstract": "Electron transport is typically described in terms of relaxation times, which measure how quickly Fermi-surface deformations decay. We show here that the thermopower of a two-dimensional Fermi liquid instead probes the structure of these deformations in the form of their local temperature change, which we call the thermal dressing. This structure leads to an overshoot of the thermopower over its hydrodynamic value $- s/(ne)$ with increasing wave vector, before it falls to half that value in the ballistic limit. At low temperatures, the excess thermopower does not have the linear-in-temperature scaling expected of a Fermi liquid, but decreases only logarithmically as $1/\\ln(T_F/T)$ at optimal wave vector. The overshoot is caused by collinear scattering, which redistributes energy over the Fermi surface and induces the thermal dressing, the strength of which grows with the angular harmonic index $m$ of the deformation. In contrast to tomographic effects in the charge conductivity, this overshoot does not rely on an odd-even effect in quasiparticle lifetimes and defines a distinct thermographic transport regime. The thermopower overshoot survives realistic disorder and should be detectable in a thermocouple with high-mobility samples.", "url": "https://arxiv.org/abs/2611.27981", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Johannes Hofmann"}], "featured_authors": [{"name": "Johannes Hofmann"}], "author_count": 1}, {"id": "2611.27982", "category": "cond-mat", "title": "Quantum Many-Body Scars from Operator Size", "abstract": "We present a general construction of approximate many-body scar states in two copies of a system using a bilocal size interaction that couples one site to its partner on the other copy. For an uncoupled two-sided Hamiltonian whose terms have fixed size in an operator basis, we identify polynomially many Krylov basis states that it annihilates and that, in the thermodynamic limit, become concentrated on a single size sector. The size operator splits them into a tower of equally spaced levels that gives rise to coherent revivals characterized by collective oscillations of energy across the two copies. We provide a concrete realization of this construction in two copies of a general $q$-body nearest-neighbor spin chain, and the SYK model.", "url": "https://arxiv.org/abs/2611.27982", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Debarghya Chakraborty"}, {"name": "Dario Rosa"}], "featured_authors": [{"name": "Debarghya Chakraborty"}, {"name": "Dario Rosa"}], "author_count": 2}, {"id": "2611.26679", "category": "hep-th", "title": "Feynman integrals, coactions and Lie-algebra representations", "abstract": "We outline a link between canonical differential equations of Feynman integrals and matrix representations of flat connections taking values in certain Lie algebras. Leveraging insights from string theory and properties of periods associated with these Lie algebras, we deduce single-valued solutions to the differential equations and coactions for the integrals. We introduce a novel form of the differential equations which connects with the representation theory of the Lie algebras and may depart from $\\varepsilon$-factorisation in a controlled way. We illustrate the formalism through relevant examples.", "url": "https://arxiv.org/abs/2611.26679", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Emiel Claasen"}, {"name": "Mehregan Doroudiani"}, {"name": "Claude Duhr"}, {"name": "Axel Kleinschmidt"}, {"name": "Franca Lippert"}, {"name": "Oliver Schlotterer"}, {"name": "Yoann Sohnle"}], "featured_authors": [{"name": "Emiel Claasen"}, {"name": "Mehregan Doroudiani"}, {"name": "Claude Duhr"}, {"name": "Franca Lippert"}, {"name": "Oliver Schlotterer"}, {"name": "Yoann Sohnle"}], "author_count": 7}, {"id": "2611.26687", "category": "hep-th", "title": "A matrix model of an M5--brane on a plane--wave background", "abstract": "We construct the maximally supersymmetric deformation of the recently proposed $\\mathcal{A}_6$ matrix model on a plane--wave background. We derive the same theory independently, by reducing the light--cone M5--brane on a five--sphere in this background to its lowest harmonics, including the dynamics of its chiral two--form and of its fermions. We then classify all its classical vacua. We show that one of them is the fivebrane giant graviton, and that its fluctuations form a single $\\mathfrak{su}(2|4)$ multiplet, which reproduces the $\\ell=1$ level of the spherical transverse fivebrane identified in the large $N$ limit of BMN theory. Moreover, the dynamical tensor supports new families of vacua, where the flux balances the size of the brane, and whose spectrum contains that of a fuzzy membrane. Finally, we show that BLG theory sits inside the model, both on a Coulomb branch of the massless theory and around the giant graviton of the massive one, where the two membranes are polarized into the fivebrane.", "url": "https://arxiv.org/abs/2611.26687", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Carmine Montella"}], "featured_authors": [{"name": "Carmine Montella"}], "author_count": 1}, {"id": "2611.26694", "category": "hep-th", "title": "Onset of quantum chaos in a family of two-dimensional conformal field theories", "abstract": "We exhibit random matrix statistics in the scaling dimensions of non-BPS primary operators in a family of two-dimensional conformal field theories. Specifically, we consider the sigma model with K3 target space and $\\mathcal N=(4,4)$ supersymmetry in a neighborhood of the Kummer orbifold point $\\mathbb T^4/\\mathbb Z_2$. At the free-fermion radius, the spin-zero spectrum of the $\\mathbb Z_2^4$-invariant sector is exactly degenerate at integer energies. The exactly marginal blow-up deformations that preserve this symmetry form a four-dimensional space, whose directions we parametrize by unit quaternions. Along each deformation direction, we compute the first-order splitting of the degenerate levels, i.e., the leading anomalous dimensions as the coupling goes to zero. In sectors where all exact symmetries are resolved, including a hidden $\\mathbb Z_2$ at the even levels, the non-zero first-order shifts along a generic direction follow the Gaussian orthogonal ensemble (GOE), as we verify by computing several spectral diagnostics. We compare quantitatively with the well-known singlet deformation, which has enhanced symmetry: even after all its known symmetries are resolved, its first-order spectrum has exact degeneracies, its gap ratio approaches the GOE value only slowly as the energy increases, and its unfolded spectrum lacks the long-range rigidity of the GOE.", "url": "https://arxiv.org/abs/2611.26694", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Felix M. Haehl"}, {"name": "Moshe Rozali"}], "featured_authors": [{"name": "Felix M. Haehl"}, {"name": "Moshe Rozali"}], "author_count": 2}, {"id": "2611.27002", "category": "hep-th", "title": "Energy and Charge Transmission at Conformal Interfaces: Relations and Bounds", "abstract": "Symmetry constrains how independently energy and charge can pass through a conformal interface. For interfaces between Wess--Zumino--Witten (WZW) models $G_{k_L}$ and $G_{k_R}$ preserving the diagonal affine algebra, we derive an exact relation between the energy and charge transmission coefficients, $c_{LR}=2(\\dim G)k_{LR}/(k_L+k_R+2h^\\vee)$. Together with positivity of outgoing energy, this relation excludes complete energy transmission at unequal levels. With additional bulk degrees of freedom, the equality is replaced by bounds controlled by the coset central charges. Complete transmission from a lower-level WZW model then imposes a lower bound on the coset central charge on the other side. In linear response, the relation fixes the ratio of thermal to charge conductance to the harmonic mean of the two bulk ratios, independently of the interface, while coset sectors bound the thermal conductance at fixed charge conductance. This interface-independent ratio is a generalized Wiedemann--Franz law for conformal interfaces between WZW models. The charge transmission coefficient $k_{LR}$ also governs equilibrium charge fluctuations and fixes the leading quadratic dependence of the boundary-condition-changing operator's scaling dimension on the rotation angle.", "url": "https://arxiv.org/abs/2611.27002", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuma Furuta"}, {"name": "Yuya Kusuki"}, {"name": "Toshiki Onagi"}, {"name": "Yin Tang"}], "featured_authors": [{"name": "Yuma Furuta"}, {"name": "Yuya Kusuki"}, {"name": "Toshiki Onagi"}, {"name": "Yin Tang"}], "author_count": 4}, {"id": "2611.27021", "category": "hep-th", "title": "Perturbative $S$-matrix Unitarity in Higher-Derivative Theory of Fermions", "abstract": "We construct a higher-derivative fermion theory with four-Fermi interactions. In quantum field theory, it is conjectured that good high-energy behavior of tree-level scattering amplitudes implies renormalizability, a notion referred to as the tree-unitarity criterion. To investigate whether this criterion is satisfied in a higher-derivative fermion theory, we examine the structure of the $S$-matrix in detail. Owing to the higher-derivative kinetic term, the mass dimension of the spinor field differs from that of a conventional fermion, rendering four-Fermi interactions renormalizable at the cost of introducing ghost states. We show that, unlike bosonic ghosts, fermionic ghosts inevitably give rise to negative-norm states regardless of the sign of their energy eigenvalues. We further demonstrate that, in contrast to conventional four-Fermi theories, the higher-derivative four-Fermi theory satisfies perturbative $S$-matrix unitarity. In light of the tree-unitarity criterion, these results provide supporting evidence for the renormalizability of higher-derivative fermion theories and generalize our previous findings on higher-derivative scalar theories to the fermionic case.", "url": "https://arxiv.org/abs/2611.27021", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yugo Abe"}, {"name": "Takeo Inami"}, {"name": "Keisuke Izumi"}, {"name": "Shinsuke Kawai"}], "featured_authors": [{"name": "Yugo Abe"}, {"name": "Takeo Inami"}, {"name": "Keisuke Izumi"}, {"name": "Shinsuke Kawai"}], "author_count": 4}, {"id": "2611.27134", "category": "hep-th", "title": "String breaking in a (1+1)-dimensional $e^+e^-$ collider", "abstract": "In this paper, we develop a framework for studying solitons in $(1+1)$-dimensional gauge theories using tensor networks, and we apply it to simulate $e^+e^-$ collisions in the massive Schwinger model. We work at $\\theta = \\pi$ and at a bare fermion mass exceeding the critical value; in this regime, there are two degenerate vacua, and the $e^+$ and $e^-$ particles are realized as soliton states interpolating between them. We carefully explain how to find and characterize such soliton states using infinite tensor network methods, and then exhibit real-time simulations of their collisions. These collisions involve the formation of an energetic flux string, and we demonstrate that our final states are superpositions of elastic and string-breaking trajectories.", "url": "https://arxiv.org/abs/2611.27134", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ross Dempsey"}, {"name": "Anna-Maria E. Glück"}, {"name": "Silviu S. Pufu"}, {"name": "Benjamin T. Søgaard"}], "featured_authors": [{"name": "Ross Dempsey"}, {"name": "Anna-Maria E. Glück"}, {"name": "Silviu S. Pufu"}, {"name": "Benjamin T. Søgaard"}], "author_count": 4}, {"id": "2611.27378", "category": "hep-th", "title": "Pairing and modular: Generalized electrons and quasiholes inside the $\\boxtimes$ of topological orders", "abstract": "We study the relationship between the pair creation mechanism in physics and the pairing ($\\boxtimes_{\\mathbf{A}_{\\text{ub}}}$) in mathematics, focusing on the modular and algebraic properties. We provide a way to couple two topologically ordered systems, $\\mathbf{A}$ and $\\mathbf{A'}$ sharing the common (non-group-like) structure $\\mathbf{A}_{\\text{ub}}=\\overline{\\mathbf{A'}_{\\text{ub}}}$, through the nonabelian anyon analog of the pair creation mechanism denoted as $\\mathbf{A}_{\\text{ub},\\boxtimes}=\\mathbf{A}_{\\text{ub}}\\boxtimes \\mathbf{A'}_{\\text{ub}}$. We identify $\\mathbf{A}_{\\text{ub},\\boxtimes}$ as the generalized version of electron operators in general topological orders or hidden current with (half-)integer spin involving the conformal embeddings. We provide a way to construct $\\mathbf{A}_{\\text{ub},\\boxtimes}$ as the hidden topological operator and identify $\\mathbf{A}\\boxtimes_{\\mathbf{A}_{\\text{ub}}}\\mathbf{A'}$, a general class of topoloical orders, as the $\\mathbf{A}_{\\text{ub},\\boxtimes}$-extended symmetry topological field theory. We also conjecture a series of underlying (unexplored) modular invariants, connecting the conformal embedding and the pairing.", "url": "https://arxiv.org/abs/2611.27378", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yoshiki Fukusumi"}, {"name": "Yuma Furuta"}], "featured_authors": [{"name": "Yoshiki Fukusumi"}, {"name": "Yuma Furuta"}], "author_count": 2}, {"id": "2611.27411", "category": "hep-th", "title": "Neural variational Skyrmions as a topological benchmark: emergent symmetry, precision energies and KAN--MLP comparison", "abstract": "We propose the three-dimensional Skyrme model as a topological benchmark for neural variational methods and construct fully three-dimensional Skyrmions with baryon number $B=1,\\ldots,4$ without imposing a symmetry ansatz, with high precision. For $B=2,3,4$, the relaxation of these Skyrmions starts from $B$ unit-charge lumps with random positions and orientations, which carry no symmetry information. The known toroidal, tetrahedral, and cubic Skyrmions nevertheless emerge spontaneously. The resulting variational energies for $B=1,\\ldots,4$ lie slightly below the published reference values. The neural method highlights the high accuracy for retaining the topological charge, differing from $B$ by at most $10^{-6}$ in the highest-precision solutions. Our numerical method goes through physical constraint tests such as the Derrick virial relation and the Faddeev--Bogomolny bound, together with evaluation / verification through independent quadratures and resolution sweeps. We then compare Kolmogorov--Arnold networks (KANs) with multilayer perceptrons (MLPs) in more than a thousand training runs, both with and without a rational-map ansatz. With default settings, KANs appear markedly superior, but most of the gap disappears once the MLP activation function and learning rate are tuned. KANs remain more parameter-efficient and more robust at fixed epoch budget, while MLPs with the tuned activation function perform at least as well at fixed wall-clock time. We also argue that continuous gradient descent cannot smoothly change the topological sector of our neural field, clarifying the origin of topological freezing observed in our neural variational solvers. Our results on the neural methods applied to Skyrmions pave a research ground for AI-agentic benchmarks for classical topological solitons, toward AI-assisted soliton physics.", "url": "https://arxiv.org/abs/2611.27411", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Koji Hashimoto"}, {"name": "Masaki Murata"}, {"name": "Gakuto Ogiwara"}], "featured_authors": [{"name": "Koji Hashimoto"}, {"name": "Masaki Murata"}, {"name": "Gakuto Ogiwara"}], "author_count": 3}, {"id": "2611.27437", "category": "hep-th", "title": "Gauging background isometries of the ILST null string", "abstract": "We present a general gauging of a subalgebra, $\\mathfrak h$, of the isometries $\\mathfrak g$ of the background geometry for the ILST string (e-Print: hep-th/9307108 [hep-th]). We discuss which of the isometries in $\\mathfrak g$ survive the gauging as symmetries. The gauged symmetry does not in general involve transformations of the vector density V. There is thus a corresponding contraction of the algebra of constraints as compared to the flat background and it no longer represent the full Carroll-Weyl algebra. This algebra of constraints is derived and discussed, partly in an appendix. The gauging of isometries sets the stage for a reduction, or quotient construction, leading to a new null string on the space of orbits of the gauge group. We illustrate this by deriving the ILST string in $AdS$ background as a quotient of a model in SO(d,2) background by a SO(d,1) isometry, in group space", "url": "https://arxiv.org/abs/2611.27437", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ulf Lindström"}], "featured_authors": [{"name": "Ulf Lindström"}], "author_count": 1}, {"id": "2611.27464", "category": "hep-th", "title": "The $a$-function in fractional dimensions", "abstract": "We consider the $\\beta$-functions for both scalar, and supersymmetric chiral scalar, field theories with a general $n$th-order self-interaction, in their critical dimensions, which are in general non-integer. We perform a full computation up to fourth order in the coupling in the supersymmetric case, and a partial one in the scalar case. We then demonstrate the existence of an $a$-function, related to the $\\beta$-functions by a gradient flow with a positive-definite metric, through fourth order in the coupling in the supersymmetric case; and show that all our fourth-order results in the scalar case are consistent with a similar property holding there too.", "url": "https://arxiv.org/abs/2611.27464", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "I. Jack"}, {"name": "D.R.T. Jones"}], "featured_authors": [{"name": "I. Jack"}, {"name": "D.R.T. Jones"}], "author_count": 2}, {"id": "2611.27482", "category": "hep-th", "title": "Polarized IKKT holography: bulk realization of BPS operators", "abstract": "We study the holographic imprint of polarization in the lowest BPS multiplet of the IKKT matrix model. On the matrix model side, the deformation requires operator mixing and broken-symmetry Ward identities to organize the surviving operators into an irreducible atypical multiplet of the $F(4)$ superalgebra. In the bulk, we use one-dimensional maximal gauged supergravity to identify the analytic half-BPS background with $F(4)$ symmetry whose boundary behavior matches the IKKT polarization. We solve the linearized bosonic and fermionic equations around this background and its undeformed counterpart exactly, and extract the independent asymptotic data. The supersymmetry transformations of these data reproduce the matrix model multiplets, thus establishing a bulk realization of this BPS operator structure.", "url": "https://arxiv.org/abs/2611.27482", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Franz Ciceri"}, {"name": "Aymeric Proust"}, {"name": "Henning Samtleben"}], "featured_authors": [{"name": "Franz Ciceri"}, {"name": "Aymeric Proust"}, {"name": "Henning Samtleben"}], "author_count": 3}, {"id": "2611.27488", "category": "hep-th", "title": "BMS Charges from Null Hypersurfaces", "abstract": "We show how the gravitational dynamics, phase space and Noether charges of the BMS group at future null infinity $\\mathscr{I}^+$ can be derived as limits of their analogues on null hypersurfaces at finite distance. The Bondi mass-loss and angular-momentum evolution equations arise as limits of the Raychaudhuri and Damour constraints. The Ashtekar--Streubel (aka Wald--Zoupas) symplectic potential arises as a specific member of a two-parameter family of null-boundary symplectic potentials, corresponding to the Dirichlet (aka canonical) polarization, while the other members differ by field-space exact terms, leading to the same radiative pre-symplectic structure but potentially different BMS fluxes. Deriving the BMS charges requires additional care, since BMS generators extended into the bulk are generally not tangent to the null hypersurfaces. After accounting for this and the associated anomalies, the renormalized canonical charges still contain an additional soft contribution. The prescription of a covariant boundary Lagrangian determines a corner improvement that removes this term and recovers the standard BMS charges.", "url": "https://arxiv.org/abs/2611.27488", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Martina Adamo"}, {"name": "Luca Ciambelli"}, {"name": "Felipe Diaz"}, {"name": "Michael Imseis"}, {"name": "Leonardo Sanhueza"}, {"name": "Simone Speziale"}], "featured_authors": [{"name": "Martina Adamo"}, {"name": "Luca Ciambelli"}, {"name": "Felipe Diaz"}, {"name": "Michael Imseis"}, {"name": "Leonardo Sanhueza"}, {"name": "Simone Speziale"}], "author_count": 6}, {"id": "2611.27546", "category": "hep-th", "title": "Banana D-modules", "abstract": "We study the holonomic $D$-module whose solutions are generic-mass banana Feynman integrals with complex propagator powers and spacetime dimension. We call this the banana $D$-module. Two properties of the banana $D$-module are studied: its holonomic rank and the irreducibility of the monodromy representation. This is achieved by relating the banana $D$-module to Lauricella $F_{C}$ hypergeometric systems. Further, we expand the generic-mass banana Feynman integral and the associated discontinuity integral in terms of series solutions. Finally, we analyze the Pfaffian system arising from the banana $D$-module and construct an explicit $d\\log$ representation in the equal-mass specialization.", "url": "https://arxiv.org/abs/2611.27546", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Giacomo Brunello"}, {"name": "Wojciech Flieger"}, {"name": "Yoshiaki Goto"}, {"name": "Saiei-Jaeyeong Matsubara-Heo"}, {"name": "Nobuki Takayama"}], "featured_authors": [{"name": "Giacomo Brunello"}, {"name": "Wojciech Flieger"}, {"name": "Yoshiaki Goto"}, {"name": "Saiei-Jaeyeong Matsubara-Heo"}, {"name": "Nobuki Takayama"}], "author_count": 5}, {"id": "2611.27573", "category": "hep-th", "title": "The Kerr Metric in Canonical Harmonic Coordinates to All Orders", "abstract": "We give in closed form the transformation from Boyer--Lindquist coordinates to the canonical harmonic coordinates of the Kerr metric, to all orders in Newton's constant and in the spin. This is the canonical harmonic chart selected by the MPM prescription and by the harmonic-gauge Einstein recursion sourced by the Kerr multipoles, with the residual homogeneous freedom fixed by the boundary conditions. The chart is the real, time-reversal-covariant combination of the two radial harmonic functions underlying the Cook--Scheel coordinates, which differ from it by a definite residual harmonic transformation. The proof rests on a classification of the residual harmonic freedom. Rotational covariance, parity, time reversal and analyticity in the spin allow a decaying homogeneous solution beyond the linear field only in the spatial components at third post-Minkowskian order, with angular degree $\\ell=p+2$ at spin order $a^p$. This sector is a pure gauge mode, equivalent to an MPM gauge moment. The exact chart selects the representative in which this third-PM homogeneous mode vanishes; imposing the same condition on the recursion removes the only residual ambiguity and fixes its solution uniquely. As a consequence, the canonical MPM iteration needs no finite-part regularisation and no harmonicity correction at any order. We give the exact gothic metric and the post-Minkowskian coefficients in closed form through fifth order, where an arctangent function first appears at fourth order. We find agreement with recent canonical MPM and amplitude-based results at fourth order, and we verify the construction in exact arithmetic through fifth order and twelfth order in the spin, with code made publicly available.", "url": "https://arxiv.org/abs/2611.27573", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Amina Sadu"}, {"name": "Pierre Vanhove"}], "featured_authors": [{"name": "Amina Sadu"}, {"name": "Pierre Vanhove"}], "author_count": 2}, {"id": "2611.27611", "category": "hep-th", "title": "Cosmological Correlators with Triple Massive Exchanges", "abstract": "Among all tree-level contributions to the primordial bispectrum, the triple exchange of massive scalars is the most challenging. In this paper we present an analytical formula for this bispectrum in the form of a double series, which allows the three exchanged fields to have different masses and converges throughout the whole physical region. We obtain it by expanding the mixed propagator with the softest momentum, so that the triple exchange becomes a sum of integrals over two mixed propagators. Each of these integrals satisfies a differential equation and is fixed by its value at equal momentum. We further show that the squeezed limit follows directly from this formula and takes a simple and compact form.", "url": "https://arxiv.org/abs/2611.27611", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shuntaro Aoki"}, {"name": "Lucas Pinol"}, {"name": "Zhehan Qin"}, {"name": "Fumiya Sano"}, {"name": "Masahide Yamaguchi"}, {"name": "Yuhang Zhu"}], "featured_authors": [{"name": "Shuntaro Aoki"}, {"name": "Lucas Pinol"}, {"name": "Zhehan Qin"}, {"name": "Fumiya Sano"}, {"name": "Masahide Yamaguchi"}, {"name": "Yuhang Zhu"}], "author_count": 6}, {"id": "2611.27739", "category": "hep-th", "title": "Bulk Wilson Loops from $\\mathscr{I}$", "abstract": "A Carrollian description of four-dimensional Yang-Mills theory on partially complexified future null infinity was recently proposed by Opreij, Skinner and Wang in arXiv:2604.09771 . In this paper, we give a new form of the Carrollian Yang-Mills kinetic action on real future null infinity, and recover the logarithmic two-point function found by arXiv:2604.09771 . We then extend the Carrollian description of Yang-Mills beyond scattering amplitudes by studying the expectation value of a null polygonal Wilson loop in Minkowski spacetime. We propose a boundary operator given by the trace of a cyclic product of holomorphic frames on the good cuts associated with the polygon's vertices. At order $g^2$, we show analytically that the boundary calculation reproduces the rational bulk integrand obtained from a self-dual Lagrangian insertion.", "url": "https://arxiv.org/abs/2611.27739", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "James Drummond"}, {"name": "Bruno Giménez Umbert"}, {"name": "Prahar Mitra"}], "featured_authors": [{"name": "James Drummond"}, {"name": "Bruno Giménez Umbert"}, {"name": "Prahar Mitra"}], "author_count": 3}, {"id": "2611.27861", "category": "hep-th", "title": "Brane Tilings and Polygons with Two Interior Points", "abstract": "We fully classify the brane tilings and the 4d N=1 supersymmetric quiver gauge theories corresponding to toric Calabi-Yau 3-folds whose toric diagrams are convex lattice polygons with two interior lattice points. There are 45 such polygons up to GL(2,Z) transformations and lattice translations: 5 triangles, 19 quadrilaterals, 16 pentagons and 5 hexagons. We identify all 323 toric phases corresponding to these toric Calabi-Yau 3-folds. For every toric phase, we present the brane tiling with its quiver and superpotential, the perfect matching matrix and the F- and D-term charge matrices. For each brane tiling, we study the mesonic moduli space of the corresponding abelian 4d N=1 theory through its Hilbert series and plethystic logarithm, and identify its generators and their leading relations. We also identify the mesonic global symmetry for each brane tiling and determine the superconformal U(1)R charges.", "url": "https://arxiv.org/abs/2611.27861", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rak-Kyeong Seong"}], "featured_authors": [{"name": "Rak-Kyeong Seong"}], "author_count": 1}, {"id": "2611.26997", "category": "math-ph", "title": "On a Supersymmetric Generalization of the Matytsin Formula", "abstract": "We derive the leading asymptotics of the supersymmetric analogue of the Itzykson-Zuber integral for the supergroup $U(n|m)$ in the limit $n,m\\to\\infty$ when $n/m$ is kept finite. This generalizes the Matytsin result for $U(N)$. We show that it is described by the classical action of two independent Hamiltonian systems corresponding to the bosonic and fermionic sectors.", "url": "https://arxiv.org/abs/2611.26997", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Evgeny Porubov"}], "featured_authors": [{"name": "Evgeny Porubov"}], "author_count": 1}, {"id": "2611.27417", "category": "math-ph", "title": "Reset Quantum Channels", "abstract": "We introduce Reset Quantum Channels (RQCs), a class of quantum channels acting on a Hilbert space structured as a direct sum of an arbitrary number of subspaces. Within each subspace, the state evolves unitarily; across subspaces, it is transferred by measure-and-prepare resets along given states. In this general setting, we show that the determination of their invariant states reduces to a stochastic eigenvalue problem, whose size is set by the number of reset states rather than by the dimension of the Hilbert space, and we discuss the uniqueness of these states. We further address the primitivity and the spectrum of these channels, which we compute explicitly when the reset states commute with the unitary evolutions. Applications include a small system coupled to several thermal reservoirs. We also consider random unitary evolutions and analyze the averages of the invariant states in this setup. Finally, we show that a suitable continuous-time limit yields Lindblad generators of reset type on the algebra of block-diagonal operators.", "url": "https://arxiv.org/abs/2611.27417", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Thomas Argoud"}, {"name": "Alain Joye"}], "featured_authors": [{"name": "Thomas Argoud"}, {"name": "Alain Joye"}], "author_count": 2}, {"id": "2611.27481", "category": "math-ph", "title": "Scattering by two parallel semi--infinite arrays of sound--soft scatterers", "abstract": "This article considers the scattering of an acoustic wave by two identical semi--infinite arrays of point scatterers which are positioned parallel to one another. The resulting system of scattering coefficients is formulated as a pair of coupled discrete Wiener--Hopf equations with a full $2\\times2$ matrix kernel composed of two scalar kernel functions that represent interaction within the selected array and between the two arrays. Exploiting the symmetry of the two arrays, we introduce symmetric and antisymmetric components of the scattering coefficients, which decouple the matrix Wiener--Hopf system into two independent scalar problems with kernels given by the sum and difference of the two original kernel functions. The scalar Wiener--Hopf equations are then solved using the Wiener--Hopf technique in a very similar way to what has previously been used to solve the semi--infinite array problem. The original definitions of the two scalar kernels are represented by a lattice sum and practical evaluation techniques are discussed. Comparisons with previous work are also critically discussed. The resulting formulation provides an exact analytical solution to a coupled semi--infinite array problem and illustrates how symmetry can reduce a discrete matrix Wiener--Hopf problem to two scalar problems.", "url": "https://arxiv.org/abs/2611.27481", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthew Nethercote"}], "featured_authors": [{"name": "Matthew Nethercote"}], "author_count": 1}, {"id": "2611.27617", "category": "math-ph", "title": "Moments, Equilibrium Equations and Barycentric Coordinates", "abstract": "In a previous article, we applied the classical theory of moments to establish equilibrium equations for rather general finite systems of interacting particles. An equilibrium of such a system occurs if and only if the corresponding ``zeroth'' moment $\\mu_0$ and the first moment $\\mu_1$ vanish. Our focus then was on the relationship between $\\mu_0$, $\\mu_1$ and the second moment $\\mu_2$ in order to produce systems of equilibrium equations solely dependent on mutual distances, including a generalization of the Albouy-Chenciner equations for central configurations in Celestial Mechanics. In the present work, we explore in depth the condition of simultaneously vanishing $\\mu_0$ and $\\mu_1$ on its own. This condition defines at once a vector space which is studied via barycentric coordinates and elementary exterior algebra, thereby yielding families of equilibrium equations for systems with any consistent number $n$ of particles and dimension $d$. As before, the present equilibrium equations are homogeneous as well as invariant by oriented isometries (for interactions depending only on mutual distances). Our method also develops and extends the approach by A. Albouy from central configurations of codimension $c=(n-1)-d$ equal to one, the so-called Dziobek configurations, to equilibria of systems of interacting particles of arbitrary codimension. Despite the similar appearance, our generalized Albouy equations constitute new equilibrium equations when $c$ is greater than one, even in the case of central configurations. The paper closes with applications to central configurations, with specific results for $n=5,6$ in dimension $d=2$.", "url": "https://arxiv.org/abs/2611.27617", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Eduardo S. G. Leandro"}], "featured_authors": [{"name": "Eduardo S. G. Leandro"}], "author_count": 1}, {"id": "2611.27690", "category": "math-ph", "title": "Dynamics of a spherical ferromagnet on a non-conducting incline in an external magnetic field", "abstract": "Magnetic particles of various shapes and sizes are used in biomedical applications, robotics, nanomagnetism, electrotechnology, and education. Yet despite years of study, a theoretical description of the rolling motion of a solid magnetic sphere still eludes us. One of the reasons is that coupling magnetic fields with mechanical degrees of freedom creates a highly non-linear motion with non-holonomic constraints, which makes modeling these systems analytically or by simulations non-trivial. The Lagrange-d'Alembertian approach to holonomic systems remains one of the most versatile methods to prove central theorems and solve problems in analytical mechanics and electrodynamics. While non-holonomic systems are not accessible by the original theory, recent developments generalize the principle to certain dissipative systems. Here, we present a successful application of these developments to a simple mechanical system comprising a magnetic solid sphere on an incline within an external magnetic field. Using numerical simulations, we characterized how the system depends on its initial parameters. Furthermore, our findings are in line with recent experiments, demonstrating that even very weak magnetic fields can cause unexpected motion of ferromagnetic objects. The simplicity of this example also makes it a promising candidate for undergraduate physics education where the treatment of non-holonomic variational principles is still widely uncommon.", "url": "https://arxiv.org/abs/2611.27690", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rasmus C. Raschke"}, {"name": "Tim Matthies"}, {"name": "Roland Wiesendanger"}, {"name": "Elena Y. Vedmedenko"}], "featured_authors": [{"name": "Rasmus C. Raschke"}, {"name": "Tim Matthies"}, {"name": "Roland Wiesendanger"}, {"name": "Elena Y. Vedmedenko"}], "author_count": 4}, {"id": "2611.27707", "category": "math-ph", "title": "Comparing weakly interacting and free quantum dynamics locally", "abstract": "Lieb-Robinson bounds (LRBs) have become a standard tool for perturbative results in quantum many-body physics, including gap stability and many-body adiabatic theory. Here, we use LRBs to locally approximate weakly interacting many-body dynamics with one-body dynamics on large, perturbative time scales. This allows us to use one-body transport results to establish the expected many-body transport behavior on finite time scales in the following two illustrative settings: (i) We prove quantum diffusion, as quantified by a certain operator spreading diagnostic, in weakly interacting and weakly disordered Fermi systems in dimensions $D\\geq2$ on large finite time scales based on the non-interacting diffusion result of Black, Drogin, and Hernández [ arXiv:2506.06468 ]. (ii) We show for Fermi-Hubbard models with initially low spin-down density, that all local multi-time spin-up correlation functions are approximated by their free counterparts. In particular, we obtain an OTOC (out-of-time-ordered correlator) counterpart to the patterns of short-time entanglement related to lattice path counts observed numerically by Bippus et al. [Phys. Rev. B 113, 035152 (2026)].", "url": "https://arxiv.org/abs/2611.27707", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jorge Acuña Flores"}, {"name": "Joscha Henheik"}, {"name": "Marius Lemm"}, {"name": "Daniele Toniolo"}], "featured_authors": [{"name": "Jorge Acuña Flores"}, {"name": "Joscha Henheik"}, {"name": "Marius Lemm"}, {"name": "Daniele Toniolo"}], "author_count": 4}, {"id": "2611.27873", "category": "math-ph", "title": "Quantum Dobrushin comparison and locality of fermionic equilibrium states", "abstract": "We prove a quantum analogue of Dobrushin's comparison theorem for lattice fermions. As in the classical case, it is a tool for proving uniqueness of equilibrium states, decay of correlations, and stability of local expectations under distant perturbations. We apply it to fermions with weak many-body interactions added to a quadratic Hamiltonian, allowing pairing, spatial inhomogeneity and long-range interactions. If the quadratic Hamiltonian is gapped, there is a coupling strength below which the thermal equilibrium (KMS) state is unique at every positive temperature and its correlations decay uniformly in the temperature. Its local expectations converge to those of the unique gapped ground state exponentially fast in the inverse temperature. In the same regime, local perturbations perturb locally in a strong sense (strong LPPL): every equilibrium state of a system with a distant defect is locally close to the equilibrium state without the defect, however strong or extended the defect is. The same holds for finite-volume Gibbs states with arbitrary even boundary terms. Without a gap, uniqueness, decay of correlations and strong LPPL hold at each positive temperature for interactions below a coupling strength that depends on the temperature. At high temperature, they hold for general interactions.", "url": "https://arxiv.org/abs/2611.27873", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lennart Becker"}, {"name": "Harman Preet Singh"}, {"name": "Stefan Teufel"}], "featured_authors": [{"name": "Lennart Becker"}, {"name": "Harman Preet Singh"}, {"name": "Stefan Teufel"}], "author_count": 3}, {"id": "2611.27928", "category": "math-ph", "title": "From Giant Vortex States to Bright Solitons in Rapidly Rotating Bose--Einstein Condensates with Attractive Interactions", "abstract": "We study the ground state of a Bose--Einstein condensate (BEC) with attractive interaction of strength $ a_\\Omega $, confined by a two-dimensional anharmonic trap rotating at angular velocity $ \\Omega $. We prove the occurrence of a phase transition, as $ \\Omega \\to\\infty $, from an annular giant vortex state to an angularly localized bright soliton. More precisely, we distinguish three regimes according to the relative sizes of the radial and angular concentration scales. In the weak coupling regime $ a_\\Omega = \\mathcal{O}({\\Omega}^{-1/2}) $, the limiting angular profile is governed by a variational problem on the unit circle showing rotational symmetry breaking: below a given sharp threshold, the condensate remains uniformly distributed in the annulus and has a giant vortex profile with a vortex-free bulk and macroscopic circulation; above it, rotational symmetry is broken. In the intermediate coupling regime $ \\Omega^{-1/2} \\ll a_\\Omega \\ll 1 $, the condensate localizes at a point on the unit circle with radial and angular widths of order $ \\Omega^{-1/2} $ and $ a_\\Omega \\sqrt{\\Omega})^{-1} $, respectively. After rescaling, the limiting profile factorizes into the ground state of the one-dimensional harmonic oscillator in the radial variable and a one-dimensional bright soliton in the angular variable. In the regime $ a_\\Omega = a \\in (0,a^*) $, corresponding to stable attraction below the collapse threshold $ a^* $ both the radial and angular widths are of order $ \\Omega^{-1/2} $; consequently, the limiting profile is no longer a product but rather a genuinely two-dimensional localized state.", "url": "https://arxiv.org/abs/2611.27928", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Michele Correggi"}, {"name": "Yujin Guo"}, {"name": "Yong Luo"}], "featured_authors": [{"name": "Michele Correggi"}, {"name": "Yujin Guo"}, {"name": "Yong Luo"}], "author_count": 3}, {"id": "2611.26695", "category": "quant-ph", "title": "Thermalization and quantum chaos in a pure gauge discrete non-Abelian lattice gauge theory", "abstract": "Gauge theories constitute the basis of our microscopic description of fundamental physical laws, and they are a cornerstone of contemporary scientific research. Yet, how such systems thermalize far from equilibrium remains a fundamental open question at the crossroads of statistical, high-energy, and condensed-matter physics. In this work, we investigate the thermalization properties of non-Abelian lattice gauge theories, focusing on the discrete gauge group $D_3$, which is ideally suited for current qudit-based quantum simulators. Specifically, we study a linear plaquette chain in a gauge-fixed formulation that removes unphysical degrees of freedom. A numerical analysis of the Hamiltonian spectrum and expectation values of local operators shows a behavior broadly aligned with the Eigenstate Thermalization Hypothesis (ETH). We also study thermalization through the real-time dynamics of the entanglement spectrum, confirming the emergence of random-matrix level statistics after an initial transient. Our results expand the rich phenomenology of dihedral non-Abelian gauge systems. Once the relevant symmetry structure is properly resolved, the model displays the same qualitative ETH-based thermalization scenario observed in Abelian gauge models and generic non-integrable quantum many-body systems.", "url": "https://arxiv.org/abs/2611.26695", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Marco Vaia"}, {"name": "Edoardo Ballini"}, {"name": "Alberto Bottarelli"}, {"name": "Matteo M. Wauters"}, {"name": "Philipp Hauke"}], "featured_authors": [{"name": "Marco Vaia"}, {"name": "Edoardo Ballini"}, {"name": "Alberto Bottarelli"}, {"name": "Matteo M. Wauters"}, {"name": "Philipp Hauke"}], "author_count": 5}, {"id": "2611.26720", "category": "quant-ph", "title": "Improved Digitization Bounds for U(1) Lattice Gauge Theory via Semiclassical Analysis", "abstract": "Simulating lattice gauge theories on a digital quantum computer or using tensor network methods requires a finite-dimensional approximation of the gauge field, a process often called digitization. Controlling the resulting error is essential for assessing the accuracy and resource requirements of these simulations. In this work, we derive a digitization error bound for low-lying eigenstates of the Kogut--Susskind Hamiltonian for pure U(1) gauge theory and translate it into a bound on time-evolution error. Compared with existing bounds, our result achieves exponentially improved dependence on the inverse lattice spacing $1/a$ and evolution time $T$, together with improved dependence on the inverse coupling $1/g$. The key idea is to identify a small parameter in the Kogut--Susskind Hamiltonian and apply tools from semiclassical analysis. Specifically, we adapt Agmon's method to establish exponential decay of the error with the truncation threshold. These results sharpen estimates of the local Hilbert space dimension and qubit resources needed to simulate gauge theories near the continuum limit, at weak coupling, and over long times.", "url": "https://arxiv.org/abs/2611.26720", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Di Fang"}, {"name": "Yu Tong"}], "featured_authors": [{"name": "Di Fang"}, {"name": "Yu Tong"}], "author_count": 2}, {"id": "2611.26737", "category": "quant-ph", "title": "Entropy production from crossing a quantum separatrix", "abstract": "If the Hamiltonian of a large quantum system depends on a variable parameter, its parameter-dependent energy spectrum may often form a dense lattice of avoided crossings. If the parameter slowly changes, the system's time evolution through the avoided crossings tends in the semi-classical limit to change from adiabatic to diabatic across a narrow energy range that has recently been defined as a quantum separatrix. Here we show that in the extreme semi-classical limit of a quasi-continuously dense spectrum, all quantum separatrices form a universal one-parameter family, and that evolution through the separatrix becomes efficiently ergodizing. If the unitary evolution is realistically averaged over small variations in the parameter time dependence, quantum separatrix crossing generates diagonal entropy according to a universal formula. Numerical examples confirm that the results for quasi-continuous spectra remain clearly recognizable in finite systems, with only small finite-size effects.", "url": "https://arxiv.org/abs/2611.26737", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Peter Stabel"}, {"name": "James R. Anglin"}], "featured_authors": [{"name": "Peter Stabel"}, {"name": "James R. Anglin"}], "author_count": 2}, {"id": "2611.26740", "category": "quant-ph", "title": "Efficient Tensor Decomposition of the Coulomb and Coulomb-like Potentials and Its Application to Probing Molecular Geometries Using a Quantum Computer", "abstract": "We present an efficient canonical polyadic decomposition of the Coulomb and Coulomb-like potentials in real-space grid representations suited to quantum computing applications. By decomposing the matrix elements of Coulomb-like potentials into low-rank Cartesian components, we achieve $O(N^{1/3})$ T-gate scaling per Coulomb term, where $N$ is the number of grid points (basis functions) per electron, while maintaining high accuracy. This opens a path to significantly reducing the number of basis functions (i.e., qubits) required compared to previous methods by utilizing improved representations of the Coulomb potential that converge faster with grid spacing. The decomposition is also valid for certain pseudopotentials, which can decrease the cost significantly compared to previous work. This efficient decomposition enables the application of block-encoding techniques at larger grid spacings than with previous decompositions, and can therefore be used for algorithms that do not require high energy accuracy. We apply this decomposed Coulomb potential to hydrogen atom energy levels, the helium ground-state energy, and the Hartree-Fock potential energy curve of LiH, and show that modest basis sizes achieve semi-quantitative to quantitative accuracy. As an example of where these faster-converging Coulomb representations can be used on a quantum computer, we discuss their application to probing low-energy molecular geometries, and we estimate the resulting reduction in the cost of real-time evolution.", "url": "https://arxiv.org/abs/2611.26740", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "James Brown"}, {"name": "Masashi Takahashi"}, {"name": "Robert Wodraszka"}, {"name": "James Whitfield"}], "featured_authors": [{"name": "James Brown"}, {"name": "Masashi Takahashi"}, {"name": "Robert Wodraszka"}, {"name": "James Whitfield"}], "author_count": 4}, {"id": "2611.26755", "category": "quant-ph", "title": "Gravity-induced entanglement assisted by an additional interaction using magic angle calibration", "abstract": "Gravity-induced entanglement provides an operational test of whether gravitational dynamics are compatible with local operations and classical communication (LOCC), but the weakness of the gravitational interaction and the presence of force noise make direct entanglement generation extremely demanding. We introduce a controllable additional coherent interaction that biases two test masses close to, but within, a separability-preservation bound, so that the weak Newtonian coupling supplies only the remaining coherent contribution needed for entanglement. If the additional interaction alone is shown to be incapable of generating entanglement, while entanglement is observed when gravity is included, the gravitational interaction provides a non-LOCC contribution. Since gravity cannot be turned off, we use a magic-angle null of the projected tidal coupling to calibrate the additional interaction and force noise. If the additional dynamics is certified to preserve separability at the magic angle and entanglement is subsequently observed in a non-null configuration, the gravitational contribution is incompatible with an LOCC description within the Markovian model. The protocol trades the stringent absolute force-noise requirement of direct schemes for precision in controlling the additional coupling, its backaction, and angle-dependent systematics.", "url": "https://arxiv.org/abs/2611.26755", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daisuke Miki"}, {"name": "Alfred Li"}, {"name": "Yanbei Chen"}], "featured_authors": [{"name": "Daisuke Miki"}, {"name": "Alfred Li"}, {"name": "Yanbei Chen"}], "author_count": 3}, {"id": "2611.26884", "category": "quant-ph", "title": "Scheduling the quantum implementation of the Trotter decomposition for Hamiltonian simulation", "abstract": "For the quantum computational task for Hamiltonian simulation, the arrangement in which sub-Hamiltonians appear in the Trotter decomposition may have a large influence on the precision, under a given circuit complexity. In this paper, we design several scheduling strategies by combining two methods; that is, the existing simultaneous diagonalization scheme leveraged in order to guarantee the performance in a relatively short circuit depth, with a method inspired from a Trotter-Suzuki decomposition of the second or the fourth order for a better accuracy. By conducting numerical simulations on various Hamiltonian instances, we confirm a systematic advantage over previous methods. Thus, our proposal may eliminate the need of dealing with several Hamiltonian-dependent scheduling strategies.", "url": "https://arxiv.org/abs/2611.26884", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Augustin Ho"}, {"name": "Naoki Yamamoto"}], "featured_authors": [{"name": "Augustin Ho"}, {"name": "Naoki Yamamoto"}], "author_count": 2}, {"id": "2611.26960", "category": "quant-ph", "title": "Resonance-controlled post-selected mode entanglement in one-dimensional quantum scattering", "abstract": "We study resonance-controlled post-selected mode entanglement in a one-dimensional quantum-scattering model. Two incoming electrons scatter independently from a symmetric double-barrier structure and the sector with one reflected and one transmitted electron is selected. The idealised delta-function barriers used in earlier work are replaced by exponentially localised cusp barriers, $U(x)=U_0\\exp(-|x\\mp d/2|/a)$, for which the single-barrier scattering problem is exactly solvable in terms of modified Bessel functions of imaginary order. We derive the corresponding reflection and transmission amplitudes, verify their current normalisation and validate them independently by direct numerical integration. Two separated cusp barriers are then combined through a Fabry-Pérot composition, whose accuracy is quantified by solving the full two-centre Schrödinger equation. In the well-separated regime the approximation reproduces the full resonance positions to high accuracy. The concurrence zeros are controlled by the resonance phase condition $\\delta(\\kappa)+\\kappa d=n\\pi$, with a continuously unwrapped single-barrier reflection phase $\\delta$. We also calculate the post-selection probability $P_{RT}$, showing explicitly that large conditional concurrence can occur in a low-probability sector. Systematic scans in barrier width, integrated strength and reference momentum show that finite width can shift off-resonant concurrence maxima and, depending on the reference momentum, reduce their attainable height. The results identify resonance-controlled conditional entanglement as a robust feature of the well-separated double-barrier geometry rather than an artefact of the zero-range idealisation.", "url": "https://arxiv.org/abs/2611.26960", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Víctor M. Villalba"}], "featured_authors": [{"name": "Víctor M. Villalba"}], "author_count": 1}, {"id": "2611.27034", "category": "quant-ph", "title": "Generalized Wigner-Yanase Uncertainty Bounds for Multiple Quantum Channels", "abstract": "We derive uncertainty relations for quantum channels based on the generalized Wigner-Yanase skew information. For three channels, we obtain a product lower bound by optimizing over permutations of commutator and anticommutator pairings. For an arbitrary number of channels, we establish a lower bound on the sum of squared uncertainties and construct a hierarchy of bounds using the partial Cauchy-Schwarz inequality. These bounds are invariant under changes of Kraus representation for a fixed operator basis. The first two levels of the hierarchy coincide with the elementary arithmetic-geometric mean bound, while the intermediate levels generally depend on the ordering of the operator basis. Examples involving three and four qubit channels demonstrate the bounds and compare their performance with an earlier pairing inequality under fixed channel representations.", "url": "https://arxiv.org/abs/2611.27034", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jianming Zhou"}, {"name": "Xiaoli Hu"}, {"name": "Naihuan Jing"}], "featured_authors": [{"name": "Jianming Zhou"}, {"name": "Xiaoli Hu"}, {"name": "Naihuan Jing"}], "author_count": 3}, {"id": "2611.27267", "category": "quant-ph", "title": "Pulse-tube-vibration induced Larmor frequency jitter in anisotropic Kramers spins", "abstract": "We investigate the role of pulse-tube mechanical vibrations towards spin frequency noise in a cryogen-free dilution refrigerator. Our system comprises of a low mode-volume superconducting resonator coupled to 50 ppm $\\text{Er}^{3+}:\\text{CaWO}_4$ spins with highly anisotropic g-factors. By measuring single-shot spin echoes using narrow-bandwidth three-pulse sequences, we directly observe a vibration induced stochastic signal resulting from the spin's Larmor frequency moving into and out of the detection bandwidth. The sensitivity to these vibrations is substantially suppressed when a) the external magnetic field is aligned along the symmetry c-axis and b) spin temperature is modestly increased to 60~mK. We also benchmark the system as a quantum sensor for angular fluctuations, extracting a noise floor of 350 nanodegrees.", "url": "https://arxiv.org/abs/2611.27267", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "R. Shaik"}, {"name": "P. Kesarwani"}, {"name": "S. Rajendran"}, {"name": "S. E. Kubatkin"}, {"name": "A. V. Danilov"}, {"name": "S. E. de Graaf"}, {"name": "V. Ranjan"}], "featured_authors": [{"name": "R. Shaik"}, {"name": "P. Kesarwani"}, {"name": "S. Rajendran"}, {"name": "A. V. Danilov"}, {"name": "S. E. de Graaf"}, {"name": "V. Ranjan"}], "author_count": 7}, {"id": "2611.27295", "category": "quant-ph", "title": "Consecutive Supersymmetric Quantum Mechanical Algorithms for Resolving the Spectra of Legendre-type Differential Operators", "abstract": "Quite comprehensive iterative algorithms based on consecutive supersymmetric quantum mechanics (SUSYQM) have been constructed heuristically, for resolving the eigenspectra of the Legendre operator and its associates parametrized in various coordinates, \\emph{without receiving any input from traditional analytical methods}. On building these algorithms, the two symmetries \\text{--} supersymmetry and shape invariance symmetry \\text{--} hidden in these operators are brought to the fore as the only two governing principles, with the aids of the newly devised algebraic techniques such as the \\emph{active supersymmetrization transformations}, \\emph{momentum operator maps} as well as plain and \\emph{higher-order spin matrix maps}. In view of their algebraic simplicity and elegance, high efficiency, as well as independence of traditional methods, some of these algorithms become the promising candidates to supplant the popular power series approach to the eigenspectra of Legendre-type operators.", "url": "https://arxiv.org/abs/2611.27295", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tianchun Zhou"}], "featured_authors": [{"name": "Tianchun Zhou"}], "author_count": 1}, {"id": "2611.27300", "category": "quant-ph", "title": "Symplectic Matroids, Stabilizer Codes, and Quantum Secret-Sharing", "abstract": "An $\\mathbb{F}_q$-linear $[[n,k]]_q$ stabilizer code is represented by a totally isotropic subspace of $\\mathbb{F}_q^{2n}$ of dimension $n-k$, whose full-rank generator matrix has nonzero maximal minors on admissible column sets forming the bases of a representable symplectic matroid. Sarvepalli asked whether graphical symplectic matroids introduced by Chow give stabilizer codes with good parameters, when a Lagrangian matroid induces a quantum access structure, which code realizes it, and which polynomial carries the weight enumerator. We answer these questions. For a $3$-connected simple graph, every representation of a graphical symplectic matroid, over any field, gives a stabilizer code of distance exactly $2$, so the girth is not a lower bound. For a represented Lagrangian matroid and a dealer, we construct the dealer-shortened stabilizer code, its logical operators, an encoding isometry and explicit recovery maps, and we show that this is the code implemented by the stabilizer state through teleportation. A set of players recovers the secret, learns nothing, or learns part of it according to a rank formula on pairs of columns, which equals its mutual information with the dealer; for graph states it becomes a cut-rank condition. Over $\\F_2$ a symplectic matroid of any rank has only one representation, so the code, its access structure and its weight enumerators depend on the matroid alone; for $q\\ge3$ even the enumerator does not. Circuit-induced authorized sets always reconstruct when the matroid is self-dual, but not in general, and a six-qubit graph state shows that the two access structures can differ even then. Finally, a polynomial in the ranks of column pairs determines both weight enumerators.", "url": "https://arxiv.org/abs/2611.27300", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sayantan Ganguly"}], "featured_authors": [{"name": "Sayantan Ganguly"}], "author_count": 1}, {"id": "2611.27359", "category": "quant-ph", "title": "Trotter Error Bounds in Lean 4 with a Cancellation-Aware Analysis of the Fourth-Order Suzuki Formula", "abstract": "We formalize the commutator-scaling bound of Childs et al. in Lean 4. For skew-adjoint generators, the local order condition gives an explicit integer step count sufficient to meet a prescribed error tolerance. We apply the theorem in Lean to the binary fourth-order Suzuki formula. For this formula we can also account for cancellation within and between steps. Using local remainder estimates of Casas and Murua, we sum the signed quintic and centered seventh-degree error terms after conjugating each to the interaction picture. For every positive integer step count, we bound the difference between this sum and the global error operator. At fixed time the explicit remainder is eighth order in the step size, and the integral of the conjugated quintic term gives the exact leading error coefficient. The Lean proofs cover the two-generator finite-sum estimates, including the spectral norm for complex matrices. On five ten-site nearest-neighbor Heisenberg instances at time $10$ and tolerance $10^{-3}$, the transported sum meets the tolerance at a mean of $129.4$ steps. Taking a separate norm at each step with the same polynomial and remainder gives a mean first crossing between $184.6$ and $185.2$ steps. The accumulated Casas--Murua local bound at $q=8$ gives a mean of $184.8$ steps.", "url": "https://arxiv.org/abs/2611.27359", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bingyu Xia"}, {"name": "Jue Xu"}, {"name": "Yue Wang"}], "featured_authors": [{"name": "Bingyu Xia"}, {"name": "Jue Xu"}, {"name": "Yue Wang"}], "author_count": 3}, {"id": "2611.27458", "category": "quant-ph", "title": "The inverted harmonic oscillator in Segal-Bargmann space: Time-asymmetric propagator reconstruction and bi-coherent states", "abstract": "We investigate the real-time dynamics and resonance quantization of the inverted harmonic oscillator (IHO). Its self-adjoint Hamiltonian on $L^2(\\mathbb{R})$ has a real continuous spectrum, while generalized resonance states outside $L^2(\\mathbb{R})$ have purely imaginary energies $\\pm i\\hbar\\omega(n+1/2)$. In coordinate space, these states are expressed in terms of complex Hermite polynomials and are biorthonormal under the Fresnel Gaussian pairing. Adapting Moriconi's coordinate-time transformation to the real-time path integral, we derive the exact Feynman propagator. Using Mehler's formula, we show that each discrete expansion alone reconstructs the full unitary kernel on its time half-axis, with the decaying Gamow-Siegert branch converging for $T>0$ and the growing antiresonant branch converging for $T<0$. In the complex-scaled Segal-Bargmann representation, the two Hamiltonians take the form $\\pm i\\hbar\\omega(z(d/dz)+1/2)$, and their monomial eigenfunctions map back to the dual complex Hermite states. The two convergence domains correspond to one-sided contraction semigroups of dilations. Finally, we construct bi-coherent states whose biorthogonal position and momentum second cumulants are purely imaginary and complex conjugate, with product $\\hbar^2/4$. The corresponding Heisenberg expectation values follow the exact classical hyperbolic trajectories for arbitrary real initial positions and momenta.", "url": "https://arxiv.org/abs/2611.27458", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hongze Ding"}, {"name": "Ni Liu"}, {"name": "J.-Q. Liang"}], "featured_authors": [{"name": "Hongze Ding"}, {"name": "Ni Liu"}, {"name": "J.-Q. Liang"}], "author_count": 3}, {"id": "2611.27535", "category": "quant-ph", "title": "geodesiq: a Python package for geometric diabatic-adiabatic optimal state transfer", "abstract": "We introduce the geodesiq Python package, which implements a geometric framework for shaping control pulses that achieve high-fidelity state transfer in multilevel quantum systems. The underlying method combines adiabatic and diabatic control into a single metric, suppressing unwanted excitations while allowing selected diabatic passages. Finding the pulse thereby reduces to solving a single first-order ordinary differential equation. We explain how to use geodesiq and illustrate its use explicitly with Landau-Zener transitions, spin-qubit initialization, adiabatic many-body ground-state preparation, and a diabatic-adiabatic transfer in a four-level system.", "url": "https://arxiv.org/abs/2611.27535", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "David Fernández-Fernández"}, {"name": "Christian Ventura-Meinersen"}, {"name": "Maximilian Rimbach-Russ"}, {"name": "Gloria Platero"}], "featured_authors": [{"name": "David Fernández-Fernández"}, {"name": "Christian Ventura-Meinersen"}, {"name": "Maximilian Rimbach-Russ"}, {"name": "Gloria Platero"}], "author_count": 4}, {"id": "2611.27548", "category": "quant-ph", "title": "Communication advantages of a quantum switch of two pure-loss channels", "abstract": "The quantum switch can enable communication through otherwise unusable channels, a phenomenon known as causal activation. We show that a switch of two identical pure-loss channels can achieve strictly greater energy-constrained classical and quantum capacities than their sequential use, even when two-way classical communication is available. Remarkably, the switch also activates quantum communication over a range of transmissivities for which the sequential channel has zero quantum capacity.", "url": "https://arxiv.org/abs/2611.27548", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Carlo Marconi"}], "featured_authors": [{"name": "Carlo Marconi"}], "author_count": 1}, {"id": "2611.27587", "category": "quant-ph", "title": "Block Search Conditioned on Features for Sequential Quantum Data Encoding", "abstract": "Sequential quantum data encoding is addressed through the joint selection of input features and encoding blocks within a fixed quantum register. At each step, a new feature, a block of operations, its placement, and its rotation weights are selected together from training data, extending the incremental construction of Q-FLAIR. With direct-loss selection (RAW), nine to twelve features were retained in four qubits across five new Bars and Stripes datasets. Under the same final calibration, mean changes relative to the calibrated Q-FLAIR reference were +5.53 percentage points in balanced accuracy, -15.83% in binary cross-entropy (BCE), and +7.79% in area under the ROC curve (AUC). The prespecified success criterion was met in four of five datasets and for the mean paired differences. These results were obtained by comparing complete procedures under a common cap of 32 operations.", "url": "https://arxiv.org/abs/2611.27587", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Cecília S. C. Botelho"}, {"name": "Erico S. Teixeira"}, {"name": "Anderson F. P. dos Santos"}, {"name": "Guilherme D. Lima"}, {"name": "Helida Santos"}, {"name": "Adenauer Yamin"}, {"name": "Renata Reiser"}, {"name": "Inês de Castro Dutra"}], "featured_authors": [{"name": "Cecília S. C. Botelho"}, {"name": "Erico S. Teixeira"}, {"name": "Anderson F. P. dos Santos"}, {"name": "Adenauer Yamin"}, {"name": "Renata Reiser"}, {"name": "Inês de Castro Dutra"}], "author_count": 8}, {"id": "2611.27626", "category": "quant-ph", "title": "Criterion and Construction Framework for Impure Quantum $(r,δ)$-LRCs from Optimal $(r,δ)$-LRCs", "abstract": "This paper aims to uncover new phenomena and provide new tools for quantum \\((r,\\delta)\\)-LRCs derived from optimal \\((r,\\delta)\\)-LRCs. The initial motivation is to identify the main reason for the existence of impure cases in such quantum codes. Our main result reveals that whether \\(d = r+1\\) is the key factor governing the impurity of quantum \\((r,\\delta)\\)-LRCs. We prove that, when \\(d \\neq r+1\\), impure quantum codes derived from optimal \\((r,\\delta)\\)-LRCs have bounded lengths. Conversely, when \\(d = r+1\\), we construct impure quantum \\((r,\\delta)\\)-LRCs with unbounded lengths. The central tool developed in this work is a criterion for identifying impure quantum codes derived from optimal \\((r,\\delta)\\)-LRCs. The main results include a criterion for impurity in quantum \\((r,\\delta)\\)-LRCs (Theorem 3.2), a construction framework for impure quantum \\((r,\\delta)\\)-LRCs (Theorem 4.4), and two families of impure quantum \\((r,\\delta)\\)-LRCs (Theorems 4.8 and 4.11).", "url": "https://arxiv.org/abs/2611.27626", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kun Zhou"}, {"name": "Meng Cao"}], "featured_authors": [{"name": "Kun Zhou"}, {"name": "Meng Cao"}], "author_count": 2}, {"id": "2611.27640", "category": "quant-ph", "title": "Ancilla-Free Exact Dicke-State Synthesis with Optimal Size and Depth", "abstract": "We construct exact circuits for $n$-qubit Dicke states of any Hamming weight $k$ using $O(n)$ single-qubit gates and CNOTs in $O(\\log n)$ depth without ancillary qubits. The gate count and depth are asymptotically optimal for every $0<k<n$. We compress symmetric blocks to free output qubits for weight-dependent phases. A sign correction followed by a collective rotation produces a state whose overlap with the target is at least a positive constant, so exact amplitude amplification takes $O(1)$ steps. For balanced Dicke states ($k=\\lfloor n/2\\rfloor$), the logarithmic depth disproves the $\\Omega(k)$ depth lower bound conjectured by Yuan and Zhang (2025).", "url": "https://arxiv.org/abs/2611.27640", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yunqi Huang"}, {"name": "Wei Zi"}, {"name": "Jianhao He"}, {"name": "Zekun Ye"}, {"name": "Shenggen Zheng"}], "featured_authors": [{"name": "Yunqi Huang"}, {"name": "Wei Zi"}, {"name": "Jianhao He"}, {"name": "Zekun Ye"}, {"name": "Shenggen Zheng"}], "author_count": 5}, {"id": "2611.27650", "category": "quant-ph", "title": "Emergent Causality of Macroscopic Transport and Equilibration in Long-Range Quantum Systems", "abstract": "Long-range couplings in quantum many-body systems challenge conventional notions of locality and causality. Here, we show that macroscopic particle transport nevertheless exhibits emergent causality --- an effective light cone that becomes strict in the thermodynamic limit. For power-law hopping with a decay exponent $\\alpha\\in(D,D+1)$ in $D$ spatial dimensions, the emergent causality cone expands super-ballistically, and we establish that its scaling is optimal. Our results imply lower bounds on the equilibration time of long-range systems. Finally, we construct an example of a long-range free-fermion chain with $\\alpha\\in (1,3/2)$, whose macroscopic density equilibrates super-ballistically, i.e., in a time sub-linear in the system size. While long-range interactions are usually associated with slow equilibration due to increased energy barriers, our example demonstrates that long-range hopping can lead to accelerated equilibration.", "url": "https://arxiv.org/abs/2611.27650", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hongchao Li"}, {"name": "Marius Lemm"}], "featured_authors": [{"name": "Hongchao Li"}, {"name": "Marius Lemm"}], "author_count": 2}, {"id": "2611.27660", "category": "quant-ph", "title": "Detection of genuine multipartite entanglement by means of entanglement monotones", "abstract": "We look for pure state entanglement monotones that may serve as certificates of a strong form of genuine multipartite entanglement, that we refer to as irreducible entanglement: a $D$-partite state (with $D\\geq 3$) is irreducibly $D$-partite entangled if it cannot be decomposed as a product of states that are at most $(D-1)$-partite entangled. We start by establishing a no-go result proving that no reasonable genuine multipartite entanglement entropy can simultaneously obey LOCC-monotonicity and subadditivity. After relaxing the first condition to LO-monotonicity, we provide a simple method generating genuine multipartite entanglement monotones with the desired properties. Focusing on a subfamily of these monotones, we show that they are able to detect any form of genuine tripartite entanglement in three-qubit systems.", "url": "https://arxiv.org/abs/2611.27660", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sylvain Carrozza"}, {"name": "Johann Chevrier"}, {"name": "Luca Lionni"}], "featured_authors": [{"name": "Sylvain Carrozza"}, {"name": "Johann Chevrier"}, {"name": "Luca Lionni"}], "author_count": 3}, {"id": "2611.27702", "category": "quant-ph", "title": "Full-chip constrained quantum annealing via self-calibrating spin-susceptibility control", "abstract": "Discrete optimization in finance, power grids, and logistics requires minimizing Ising Hamiltonians under coupled linear constraints. However, quadratic-penalty formulations generate dense cliques that exhaust the minor-embedding capacity of sparse superconducting processors at 128-176 spins, and first-order dual subgradient schemes diverge or stall under constraint coupling. Accordingly, this study proposes a closed-loop primal-dual scheme, designated as Self-Calibrating Quantum Susceptibility Quasi-Newton (SelfCal-QSQN), in which linear constraints are encoded in longitudinal fields and dual curvature is reconstructed from single-shot spin-fluctuation covariances. This scheme requires no penalty couplers, slack qubits, or perturbation queries. Evaluated over 891 runs on D-Wave Advantage (5,612 qubits) and Advantage2 (4,560 qubits), SelfCal-QSQN achieves 83.3% full-chip exact feasibility, reduces high-constraint error by 6.1-20.1-fold over $K$-scaled first-order updates (138.4-323.3-fold over fixed-gain curvature), outperforms time-matched mixed-integer programming at 256 spins, and attains 95.0%-96.7% feasibility on non-native and inequality benchmarks. Moreover, the scheme is robust toward shot noise and freeze-out drift.", "url": "https://arxiv.org/abs/2611.27702", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chia-Ho Ou"}], "featured_authors": [{"name": "Chia-Ho Ou"}], "author_count": 1}, {"id": "2611.27779", "category": "quant-ph", "title": "Complex chaotic Boltzmann machines as deterministic representations of quantum states", "abstract": "Neural networks and tensor networks have opened new ways to explore quantum systems by parameterizing families of wave functions through the structure and parameters of a network. Here we extend this perspective to a dynamical representation: we introduce a complex chaotic Boltzmann machine that assigns a deterministic system to a pure quantum state. We extend Suzuki's construction to incorporate both Born probabilities and relative phases. The probabilities set the trajectory velocities in a hypercube, while the phases define a complex field that lifts its Poincare sections. The evolution is determined by the network parameters and initial conditions, with
