  <style>

  <script>
    const papers = [{"id": "2608.14810", "category": "cond-mat", "title": "Electronic structure and magnetic correlations in the epitaxially strained bilayer nickelate La$_3$Ni$_2$O$_{7}$", "abstract": "Using the DFT+dynamical mean-field theory method we study the effects of electron-electron correlations and epitaxial strain of the crystal structure on the normal-state electronic structure, quasiparticle band renormalizations, Fermi surface, and magnetic correlations of the bilayer Ruddlesden-Popper nickelate La$_3$Ni$_2$O$_7$ (LNO). Our results exhibit a remarkable orbital-selective renormalization and strong incoherence of the Ni $3d$ bands, pointing to the proximity of the Ni $x^2-y^2$ and $3z^2-r^2$ states to orbital-selective localization. The electronic properties of LNO show a high sensitivity to the in-plane strain. We note that both a tensile and a moderate compressive strain (up to about $-2$\\%) yield a significant enhancement of magnetic correlations compared to the unstrained LNO. Under a large compressive strain of about $-4$\\%, we observe a Lifshitz transition characterized by the disappearance of the $\\gamma$ Fermi surface sheet, which is associated with a nearly fully occupied, shallow flat-band of the bonding Ni $3z^2-r^2$ orbital character. As a result, we observe a sharp decrease of magnetic correlations, implying suppression of superconductivity. Overall, our results support the picture of spin- and change-density-wave stripe instability driven by the Fermi surface nesting in LNO. Our results suggest that both pressure and strain can effectively tune (suppress or enhance) spin-change-density-wave ordering, giving rise to enhanced spin fluctuations.", "url": "https://arxiv.org/abs/2608.14810", "type": "理论+数值", "summary": "采用DFT+动态平均场理论方法，研究了电子-电子相关性和晶体结构的外延应变对双层Ruddlesden-Popper镍酸盐La$_3$Ni$_2$O$_7$ (LNO)的正常态电子结构、准粒子能带重整化、费米面和磁相关性的影响。我们的结果表现出显着的轨道选择性重正化和 Ni $3d$ 能带的强烈不相干性，表明 Ni $x^2-y^2$ 和 $3z^2-r^2$ 状态接近轨道选择性局域化。 LNO 的电子特性对面内应变表现出高度敏感性。我们注意到，与无应变的 LNO 相比，拉伸应变和中等压缩应变（高达约 $-2$\\%）都会产生磁相关性的显着增强。在大约 $-4$\\% 的大压缩应变下，我们观察到以 $\\gamma$ 费米表面片消失为特征的 Lifshitz 跃迁，这与键合 Ni $3z^2-r^2$ 轨道特征的几乎完全占据的浅平带有关。结果，我们观察到磁相关性急剧下降，这意味着超导性受到抑制。\n\n总体而言，我们的结果支持了由 LNO 中的费米表面嵌套驱动的自旋和变化密度波条纹不稳定性的图景。我们的结果表明，压力和应变都可以有效地调节（抑制或增强）自旋变化密度波排序，从而增强自旋波动。", "authors": [{"name": "I. V. Leonov"}], "featured_authors": [{"name": "I. V. Leonov"}], "author_count": 1}, {"id": "2608.14842", "category": "cond-mat", "title": "Rapid supercurrent decay in Mn$_5$Si$_3$ Josephson junctions", "abstract": "Theoretical work predicts that Josephson junctions containing metallic altermagnetic barriers should display $0$-$\\pi$ transitions of the critical current as a function of both barrier thickness and temperature, with the decay and oscillation period of the supercurrent depending on the orientation of the crystal axes relative to the transport direction. Motivated by these predictions, and by reports of a compensated magnetic phase attributed to altermagnetism in epitaxial Mn$_5$Si$_3$ thin films, we fabricate and measure Nb/Pt/Mn$_5$Si$_3$/Pt/Nb Josephson junctions varying the thickness of the Mn$_5$Si$_3$ barrier. The critical current decays as a single exponential over more than four orders of magnitude with decay length $\\xi_{\\text{Mn}_5\\text{Si}_3} = 0.31 \\pm 0.03$ nm, shorter than reported for Josephson junctions containing the metallic antiferromagnets FeMn, Cr, and NiMn. The Mn$_5$Si$_3$ barrier has an estimated current-perpendicular-to-plane resistivity of $320 \\pm 10 \\mu\\Omega\\,$cm. No $0$-$\\pi$ transition is resolved at the sampled barrier thicknesses, and the temperature dependence of the critical current of a junction with a 1 nm barrier is smooth and monotonic. We discuss the absence of resolvable transitions in terms of the microstructure of the barrier, its uncertain magnetic phase, and the narrow thickness window imposed by the rapid decay, and identify barriers with well-defined crystalline orientation as the key requirement for future tests of altermagnetic Josephson physics.", "url": "https://arxiv.org/abs/2608.14842", "type": "理论+数值", "summary": "理论工作预测，包含金属交变磁势垒的约瑟夫森结应显示临界电流的 $0$-$\\pi$ 转变，作为势垒厚度和温度的函数，超电流的衰减和振荡周期取决于晶轴相对于传输方向的方向。受这些预测的启发，以及外延 Mn$_5$Si$_3$ 薄膜中交变磁性引起的补偿磁相位的报告，我们制造并测量了改变 Mn$_5$Si$_3$ 势垒厚度的 Nb/Pt/Mn$_5$Si$_3$/Pt/Nb 约瑟夫森结。临界电流以单指数形式衰减超过四个数量级，衰减长度 $\\xi_{\\text{Mn}_5\\text{Si}_3} = 0.31 \\pm 0.03$ nm，比报道的含有金属反铁磁体 FeMn、Cr ​​和 NiMn 的约瑟夫森结要短。 Mn$_5$Si$_3$ 势垒的垂直于平面的电流电阻率估计为 $320 \\pm 10 \\mu\\Omega\\,$cm。在采样的势垒厚度处没有解析出 $0$-$\\pi$ 转变，并且具有 1 nm 势垒的结的临界电流的温度依赖性是平滑且单调的。\n\n我们讨论了势垒微观结构、其不确定的磁相以及快速衰变造成的狭窄厚度窗口方面缺乏可解析的转变，并确定具有明确晶体取向的势垒作为未来交磁约瑟夫森物理测试的关键要求。", "authors": [{"name": "Arjun Sapkota"}, {"name": "Kurt Lorenzen"}, {"name": "Tyler Kuhn"}, {"name": "Juan Gomez"}, {"name": "Demet Korucu"}, {"name": "Robert M. Klaes"}, {"name": "Reza Loloee"}, {"name": "Norman O. Birge"}, {"name": "Nathan Satchell"}], "featured_authors": [{"name": "Arjun Sapkota"}, {"name": "Kurt Lorenzen"}, {"name": "Tyler Kuhn"}, {"name": "Reza Loloee"}, {"name": "Norman O. Birge"}, {"name": "Nathan Satchell"}], "author_count": 9}, {"id": "2608.14853", "category": "cond-mat", "title": "Physics-Informed Symbolic Regression for Predicting the Glass Transition Temperature of Alkali Borate Glasses", "abstract": "The glass transition temperature ($T_{g}$) of alkali borate glasses is strongly composition-dependent and difficult to predict from first principles due to the structural complexity of the boron network. Here, we apply physics-informed symbolic regression (combining evolutive search with physically meaningful descriptors) to derive an interpretable closed-form expression for $T_{g}$ in the $x\\mathrm{M}_2\\mathrm{O}\\cdot(100-x)\\mathrm{B}_2\\mathrm{O}_3$ glass family, with M = Li, Na, and K and $x$ expressed in mol%, and subsequently extrapolate it to M = Rb and Cs. The resulting model achieves a root-mean-square error of 14-16 K while maintaining clear physical interpretability, explicitly capturing the interplay among $T_{g}$, structural dissociation energy, and network packing. Critically, models built on the Rigid Unit Packing Fraction (RUPF) yield substantially more realistic $T_{g}$ predictions than those using the conventional Atomic Packing Fraction (APF), as APF overestimates structural rigidity at intermediate compositions. The fitted dissociation energies are further validated against the revised Makishima-Mackenzie model, confirming that the inferred parameters are physically consistent, not merely statistically effective, within the alkali borate family. Finally, Monte Carlo uncertainty quantification reveals that prediction uncertainty is highest in the compositional regions associated with the boron anomaly, directly linking model limitations to a known structural transition in these glasses. This result highlights the potential of physics-informed symbolic regression as a transparent and interpretable alternative to black-box models for property prediction in glass systems.", "url": "https://arxiv.org/abs/2608.14853", "type": "理论+数值", "summary": "碱金属硼酸盐玻璃的玻璃化转变温度 ($T_{g}$) 强烈依赖于成分，并且由于硼网络的结构复杂性，很难根据第一原理进行预测。在这里，我们应用基于物理的符号回归（将进化搜索与物理上有意义的描述符相结合）来导出 $x\\mathrm{M}_2\\mathrm{O}\\cdot(100-x)\\mathrm{B}_2\\mathrm{O}_3$ 玻璃族中 $T_{g}$ 的可解释的封闭式表达式，其中 M = Li、Na 和 K，$x$ 以 mol% 表示，随后将其外推至 M = Rb 和 Cs。所得模型实现了 14-16 K 的均方根误差，同时保持清晰的物理可解释性，明确捕获 $T_{g}$、结构解离能和网络包装之间的相互作用。至关重要的是，基于刚性单元堆积分数 (RUPF) 构建的模型比使用传统原子堆积分数 (APF) 的模型产生更真实的 $T_{g}$ 预测，因为 APF 高估了中间成分的结构刚性。\n\n拟合的解离能进一步根据修订后的 Makishima-Mackenzie 模型进行验证，确认推断的参数在碱金属硼酸盐家族中是物理一致的，而不仅仅是统计上有效的。最后，蒙特卡罗不确定性量化表明，与硼异常相关的成分区域的预测不确定性最高，将模型限制与这些玻璃中已知的结构转变直接联系起来。这一结果凸显了基于物理的符号回归作为玻璃系统性能预测黑盒模型的透明且可解释的替代方案的潜力。", "authors": [{"name": "Leonardo dos Santos Vitoria"}, {"name": "Marcio Luis Ferreira Nascimento"}, {"name": "Susana de Souza Lalic"}, {"name": "Daniel Roberto Cassar"}], "featured_authors": [{"name": "Leonardo dos Santos Vitoria"}, {"name": "Marcio Luis Ferreira Nascimento"}, {"name": "Susana de Souza Lalic"}, {"name": "Daniel Roberto Cassar"}], "author_count": 4}, {"id": "2608.14899", "category": "cond-mat", "title": "Data-Efficient Construction of Material-Specific Machine-Learning Interatomic Potentials from Ab Initio Molecular Dynamics Trajectories", "abstract": "Pretrained machine-learning interatomic potentials, so-called universal or foundation models offer an appealing starting point for atomistic simulations, but their accuracy for material-specific observables often remains limited without additional reference data (fine-tuning). Here, we systematically quantify how much first-principles data are required to convert universal models into ab initio-accurate material-specific potentials, and ask whether fine-tuning is necessarily preferable to training from scratch. We compare five universal MLIP frameworks, MACE-MP-0, SevenNet-0, GRACE-1L-OAM, MatterSim-v1-5M and ORB-v2, across seven chemically diverse systems incorporating rare and reactive events. Fine-tuning on only 10 AIMD-derived configurations is insufficient for the investigated systems; 200 configurations succeed in favorable cases, but the outcome remains strongly system-dependent. By contrast, 2000 AIMD configurations constitute a robust default, yielding low force and energy errors and reproducing the target material-specific observables. Moderately dense sub-sampling of the AIMD trajectory reduces the required trajectory length tenfold with little loss in model quality. Training from scratch on the same datasets is competitive with, and often slightly more accurate than, naive fine-tuning for MACE and SevenNet, whereas GRACE requires more data. The energy profile for a sulfur-vacancy jump in MoS$_2$ reveals that low trajectory-level errors do not guarantee a correct reaction profile, highlighting the need for observable-level validation. Finally, we show that averaging independently trained models improves predictions in scarce-data regimes at no additional first-principles cost. Together, these results provide practical guidelines for converting limited AIMD reference data into reliable material-specific MLIPs for nanosecond-timescale simulations at near-DFT accuracy.", "url": "https://arxiv.org/abs/2608.14899", "type": "理论+数值", "summary": "预训练的机器学习原子间势，即所谓的通用或基础模型，为原子模拟提供了一个有吸引力的起点，但如果没有额外的参考数据（微调），它们对特定材料可观测值的准确性通常仍然有限。在这里，我们系统地量化了将通用模型转换为从头开始精确的材料特定势所需的第一原理数据，并询问微调是否一定比从头开始训练更可取。我们比较了五种通用 MLIP 框架：MACE-MP-0、SevenNet-0、GRACE-1L-OAM、MatterSim-v1-5M 和 ORB-v2，涵盖七个包含稀有和反应事件的化学多样化系统。对于所研究的系统来说，仅对 10 个 AIMD 派生配置进行微调是不够的； 200 个配置在有利的情况下会成功，但结果仍然强烈依赖于系统。相比之下，2000 AIMD 配置构成了强大的默认值，产生较低的力和能量误差，并再现了目标材料特定的可观测值。 AIMD 轨迹的中等密集子采样将所需的轨迹长度减少了十倍，而模型质量损失很小。\n\n在相同的数据集上从头开始训练与 MACE 和 SevenNet 的简单微调相比具有竞争力，而且通常稍微准确一些，而 GRACE 需要更多数据。 MoS$_2$ 中硫空位跃迁的能量分布表明，低轨迹水平误差并不能保证正确的反应分布，这凸显了可观察水平验证的必要性。最后，我们表明，对独立训练的模型进行平均可以提高稀缺数据状态下的预测，而无需额外的第一原理成本。总之，这些结果为将有限的 AIMD 参考数据转换为可靠的特定于材料的 MLIP 提供了实用指南，以便以接近 DFT 的精度进行纳秒级模拟。", "authors": [{"name": "Jonas Hänseroth"}, {"name": "Christian Dreßler"}], "featured_authors": [{"name": "Jonas Hänseroth"}, {"name": "Christian Dreßler"}], "author_count": 2}, {"id": "2608.14911", "category": "cond-mat", "title": "ESPResSo++: A Fast and Extensible Molecular Simulation Package for Coarse-Grained Models", "abstract": "ESPResSo++ is an open-source software package for molecular dynamics (MD) simulations with a particular emphasis on coarse-grained (CG) models of soft matter systems. Written in C++ with a flexible Python interface, it is designed for high-performance computing (HPC) environments and supports massively parallel simulations through MPI. The package enables simulations of polymers, membranes, colloids and complex fluids with a wide range of interaction models and advanced algorithms.", "url": "https://arxiv.org/abs/2608.14911", "type": "理论+数值", "summary": "ESPResSo++ 是一个用于分子动力学 (MD) 模拟的开源软件包，特别强调软物质系统的粗粒度 (CG) 模型。它采用 C++ 编写，具有灵活的 Python 接口，专为高性能计算 (HPC) 环境而设计，并通过 MPI 支持大规模并行模拟。该软件包能够通过各种相互作用模型和先进算法来模拟聚合物、膜、胶体和复杂流体。", "authors": [{"name": "Zhen-Hao Xu"}, {"name": "James Vance"}, {"name": "Nikita Tretyakov"}, {"name": "Sebastian Eibl"}, {"name": "Pavel Kus"}, {"name": "Jakub Krajniak"}, {"name": "Tristan Bereau"}, {"name": "Horacio V. Guzman"}, {"name": "Bin Song"}, {"name": "Markus Rampp"}, {"name": "Torsten Stuehn"}, {"name": "Christoph Junghans"}], "featured_authors": [{"name": "Zhen-Hao Xu"}, {"name": "James Vance"}, {"name": "Nikita Tretyakov"}, {"name": "Markus Rampp"}, {"name": "Torsten Stuehn"}, {"name": "Christoph Junghans"}], "author_count": 12}, {"id": "2608.14990", "category": "cond-mat", "title": "Discovering Physically Interpretable Mathematical Expression for Predicting CO2 Adsorption in Metal-Organic Frameworks via Machine Learning-Symbolic Regression", "abstract": "This work presents a machine learning-symbolic regression (ML-SR) strategy to develop a physically interpretable formula for predicting low pressure CO2 adsorption capacity in hypothetical metal-organic frameworks (hMOFs). Four ML models were trained on a small dataset of 1,000 samples, and five key descriptors-largest cavity diameter, pore limiting diameter, void fraction, gravimetric surface area, and number of hydrogen atoms-were identified through SHAP and feature importance analyses. Symbolic regression was then employed to derive a concise adsorption formula, Q=aA, where a represents an adsorption baseline (mmol/g) and A is a dimensionless adsorption number incorporating four structural descriptors. We interpret A as the ratio between an adsorption binding force and a diffusion driving force, revealing how pore topology and surface chemistry jointly influence adsorption. Validation against a comprehensive dataset of 137,652 hMOFs demonstrates that this formula achieves over 70% prediction accuracy for 62,448 structures, confirming strong applicability within defined structural and operational ranges. Unlike conventional black box ML models, the proposed physics-guided expression enables efficient prediction and provides clearer insight into adsorption mechanisms.", "url": "https://arxiv.org/abs/2608.14990", "type": "理论+数值", "summary": "这项工作提出了一种机器学习符号回归（ML-SR）策略，以开发一个物理可解释的公式，用于预测假设的金属有机框架（hMOF）中的低压二氧化碳吸附能力。在包含 1,000 个样本的小数据集上训练了四个 ML 模型，并通过 SHAP 和特征重要性分析确定了五个关键描述符（最大空腔直径、孔径极限直径、空隙率、重量表面积和氢原子数量）。然后采用符号回归推导出简明的吸附公式，Q=aA，其中a代表吸附基线（mmol/g），A是包含四个结构描述符的无量纲吸附数。我们将 A 解释为吸附结合力和扩散驱动力之间的比率，揭示了孔隙拓扑和表面化学如何共同影响吸附。针对 137,652 个 hMOF 的综合数据集进行的验证表明，该公式对 62,448 个结构的预测精度达到了 70% 以上，证实了在定义的结构和操作范围内的强大适用性。\n\n与传统的黑盒机器学习模型不同，所提出的物理引导表达式可以实现有效的预测，并提供对吸附机制的更清晰的了解。", "authors": [{"name": "Yimin Shao"}, {"name": "Shengluo Ma"}, {"name": "Shenghong Ju"}, {"name": "Yijun Shi"}, {"name": "Wei Li"}], "featured_authors": [{"name": "Yimin Shao"}, {"name": "Shengluo Ma"}, {"name": "Shenghong Ju"}, {"name": "Yijun Shi"}, {"name": "Wei Li"}], "author_count": 5}, {"id": "2608.15078", "category": "cond-mat", "title": "Localization and Transport in a Non-Hermitian Hexagonal Harper Model", "abstract": "We investigate a one-dimensional non-Hermitian hexagonal Harper model with quasiperiodically modulated hopping amplitudes. In the Hermitian limit, the model exhibits metallic, insulating, and multifractal phases characterized by distinct eigenstate properties. Upon introducing non- Hermiticity, the phase diagram is qualitatively altered, with an expansion of metallic regions and strong boundary sensitivity arising from the non-Hermitian skin effect. By analyzing wave-packet dynamics, we uncover qualitatively distinct transport signatures in metallic, multifractal, and in- sulating regimes. In the metallic region, nonreciprocal hopping induces finite sliding, resulting in ballistic center-of-mass motion that is absent in the Hermitian model, while wave-packet spreading is simultaneously suppressed and exhibits diffusive scaling. Interestingly, the multifractal regime emerges as a distinct dynamical phase supporting both enhanced spreading and finite sliding, both primarily of superdiffusive nature, in contrast to metallic regions where sliding (spreading) shows ballistic (diffusive) scaling. These features are markedly different from their Hermitian counterpart. On the other hand, in the insulating region, both the spreading and sliding are strongly suppressed. We reconfirm these intriguing transport characteristics by investigating the distinct growth profile of single-particle entanglement entropy where the effect of spreading of the wave-packet is clearly manifested. These results demonstrate that quasiperiodicity in hopping amplitudes, combined with non-Hermiticity, establishes the multifractal regime as a key mediator of transport.", "url": "https://arxiv.org/abs/2608.15078", "type": "理论+数值", "summary": "我们研究了具有准周期调制跳频幅度的一维非厄米六边形哈珀模型。在埃尔米特极限下，该模型表现出金属相、绝缘相和多重分形相，其特征在于不同的本征态特性。引入非厄米性后，相图发生了质的改变，金属区域扩大，并且非厄米集肤效应产生了强边界敏感性。通过分析波包动力学，我们发现了金属、多重分形和绝缘体系中性质不同的输运特征。在金属区域中，不可逆跳跃引起有限滑动，导致埃尔米特模型中不存在的弹道质心运动，同时波包传播受到抑制并表现出扩散缩放。有趣的是，多重分形体系作为一种独特的动态相出现，支持增强扩散和有限滑动，两者主要具有超扩散性质，与滑动（扩散）显示弹道（扩散）缩放的金属区域形成鲜明对比。这些特征与厄米特对应特征明显不同。\n\n另一方面，在绝缘区域中，扩散和滑动均受到强烈抑制。我们通过研究单粒子纠缠熵的独特增长曲线再次确认了这些有趣的传输特性，其中波包的传播效应清晰可见。这些结果表明，跳跃幅度的准周期性与非厄米性相结合，将多重分形机制确立为传输的关键介质。", "authors": [{"name": "Akshey Rajoriya"}, {"name": "Dibyajyoti Sahu"}, {"name": "Suhas Gangadharaiah"}, {"name": "Tanay Nag"}], "featured_authors": [{"name": "Akshey Rajoriya"}, {"name": "Dibyajyoti Sahu"}, {"name": "Suhas Gangadharaiah"}, {"name": "Tanay Nag"}], "author_count": 4}, {"id": "2608.15120", "category": "cond-mat", "title": "The $6-ε$ Expansion for Long-Range Lee--Yang and Percolation Criticality", "abstract": "The crossover from long-range (LR) to short-range (SR) criticality in percolation has remained unsettled because previous renormalization-group (RG) analysis within the $\\epsilon'=3\\sigma-d$ expansion fixes the anomalous dimension at $\\eta=2-\\sigma$, whereas SR percolation has $\\eta_{\\rm SR}<0$ near $d=6$. Sak's matching condition then places the crossover above $\\sigma=2$, outside the regime in which the LR interaction dominates. In spatial dimension $d=6-\\epsilon$, we formulate a perturbative expansion for the LR $\\phi^3$ field theory and perform a one-loop RG analysis throughout the perturbatively accessible nonclassical regime $0<\\delta<\\epsilon/3$, where $\\delta = 2-\\sigma$. We derive the one-loop corrections to the critical exponents $\\eta$ and $\\nu$, which acquire nontrivial dependence on $\\epsilon$ and $\\delta$. They reduce to their mean-field values at the LR upper critical line and continuously recover the SR $6-\\epsilon$ results as $\\sigma\\to2$. These results support a crossover threshold $\\sigma_*=2$ and remove the apparent discontinuity of $\\eta$ between the LR and SR values within this framework. The same approach also yields the anomalous and edge exponents of the LR Lee--Yang universality class and $q$-state Potts universality classes with $q<2$.", "url": "https://arxiv.org/abs/2608.15120", "type": "理论", "summary": "渗流中从长程 (LR) 到短程 (SR) 临界点的交叉仍未解决，因为 $\\epsilon'=3\\sigma-d$ 展开中的先前重正化群 (RG) 分析修复了 $\\eta=2-\\sigma$ 处的异常维度，而 SR 渗流在 $d=6$ 附近具有 $\\eta_{\\rm SR}<0$。然后，Sak 的匹配条件将交叉置于 $\\sigma=2$ 之上，处于 LR 相互作用占主导地位的范围之外。在空间维度 $d=6-\\epsilon$ 中，我们为 LR $\\phi^3$ 场论制定了微扰展开式，并在整个可微扰访问的非经典体系 $0<\\delta<\\epsilon/3$ 中执行单循环 RG 分析，其中 $\\delta = 2-\\sigma$。我们推导了对关键指数 $\\eta$ 和 $\\nu$ 的单循环修正，这获得了对 $\\epsilon$ 和 $\\delta$ 的非平凡依赖。它们减少到 LR 上临界线处的平均场值，并连续将 SR $6-\\epsilon$ 结果恢复为 $\\sigma\\to2$。这些结果支持交叉阈值 $\\sigma_*=2$ 并消除了该框架内 LR 和 SR 值之间 $\\eta$ 的明显不连续性。\n\n同样的方法还产生 LR Lee-Yang 普遍性类和 $q$-state Potts 普遍性类（$q<2$）的异常指数和边缘指数。", "authors": [{"name": "Zhiyi Li"}, {"name": "Kun Chen"}, {"name": "Zhijie Fan"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Zhiyi Li"}, {"name": "Kun Chen"}, {"name": "Zhijie Fan"}, {"name": "Youjin Deng"}], "author_count": 4}, {"id": "2608.15189", "category": "cond-mat", "title": "Broadband phonon-velocity suppression and a finite anisotropic crossover in twisted bilayer SnSe", "abstract": "Moiré superlattices reshape lattice dynamics without altering chemical composition, yet how crystal anisotropy modifies this control remains unclear. We combine density-functional-theory (DFT)-calibrated lattice-dynamical calculations with angle-matched untwisted controls to study puckered bilayer SnSe across seven commensurate twist angles ($3.18^\\circ$--$8.77^\\circ$). At 300 K, twisting suppresses the band-path heat-capacity-weighted mean-square group velocity to 2.6--8.4\\% of the control values; the suppression spans a broad frequency range rather than a few soft branches. The velocity response crosses over between $4.78^\\circ$ and $3.82^\\circ$ into a regime where the relaxed stacking textures and frequency-resolved velocity profiles become self-similar, with the normalized mean-square velocity ratio spanning only 11.1\\% of its mean across the three smallest angles---a finite anisotropic crossover, not a singular-angle condition. Direct DFT--MACE force-constant agreement ($r=0.996$), uniform $4\\times4\\times1$ stability scans, and acoustic-sum-rule and path-density tests support the trend. The equilibrium trend is defined by six structures after excluding one relaxation-sensitive case. These results extend phonon twistronics to low-symmetry layered materials and identify crystal anisotropy as a key determinant of finite-angle phonon crossover behavior.", "url": "https://arxiv.org/abs/2608.15189", "type": "理论+数值", "summary": "莫尔超晶格在不改变化学成分的情况下重塑晶格动力学，但晶体各向异性如何改变这种控制仍不清楚。我们将密度泛函理论 (DFT) 校准的晶格动力学计算与角度匹配的未扭曲控制相结合，研究跨七个相应扭曲角度 ($3.18^\\circ$--$8.77^\\circ$) 的褶皱双层 SnSe。在300 K时，扭转将带路热容加权均方群速度抑制为控制值的2.6--8.4%；抑制跨越了广泛的频率范围，而不是几个软分支。速度响应在 $4.78^\\circ$ 和 $3.82^\\circ$ 之间交叉，进入松弛堆叠纹理和频率分辨速度分布变得自相似的状态，归一化均方速度比仅跨越三个最小角度的平均值的 11.1\\% - 有限各向异性交叉，而不是奇异角度条件。直接 DFT-MACE 力常数一致性 ($r=0.996$)、均匀的 $4\\times4\\times1$ 稳定性扫描以及声学总和规则和路径密度测试支持这一趋势。\n\n排除一种松弛敏感情况后，平衡趋势由六种结构定义。这些结果将声子扭转电子​​学扩展到低对称性层状材料，并将晶体各向异性确定为有限角度声子交叉行为的关键决定因素。", "authors": [{"name": "Peng Kang"}, {"name": "Wei Yin"}, {"name": "Da Wan"}, {"name": "Shulin Bai"}, {"name": "Sirui Fan"}, {"name": "Qi Zou"}, {"name": "Hongfeng Li"}, {"name": "Xiao Xiang"}, {"name": "Zhen Li"}, {"name": "Yu Liu"}, {"name": "Lei Zheng"}, {"name": "Li-Dong Zhao"}], "featured_authors": [{"name": "Peng Kang"}, {"name": "Wei Yin"}, {"name": "Da Wan"}, {"name": "Yu Liu"}, {"name": "Lei Zheng"}, {"name": "Li-Dong Zhao"}], "author_count": 12}, {"id": "2608.15227", "category": "cond-mat", "title": "Linking Electronic Bonding and Short-range Order to Strength in $α$-Titanium Alloys: A First-Principles Study", "abstract": "The development of accurate strength prediction models for titanium alloys is critical for advanced materials design. This study systematically examines how the mechanical properties of $\\alpha$-Ti are affected by substitutional (X = Al, V, Mo) and interstitial (Y = H, C, N, O) alloying elements, with a focus on electronic bonding. Using density functional theory (DFT), we uncover the short-range ordering (SRO) of substitutional atoms and quantify their influence on the electronic bonding and mechanical behavior. The primary novelty of this work lies in developing a predictive model for tensile strength that goes beyond traditional empirical approaches. To quantify the contributions of individual solutes to strengthening, we use physically grounded quantum-chemical descriptors, such as the Integrated Crystal Orbital Hamilton Population (ICOHP), which is a direct measure of bond strength derived from first-principles calculations. The resulting formula quantitatively predicts the tensile strength of a wide range of $\\alpha$-Ti alloys, demonstrating a significant advancement in the computational design of high-performance structural materials.", "url": "https://arxiv.org/abs/2608.15227", "type": "理论+数值", "summary": "开发钛合金精确的强度预测模型对于先进材料设计至关重要。本研究系统地研究了替代型（X = Al、V、Mo）和间隙型（Y = H、C、N、O）合金元素如何影响 $\\alpha$-Ti 的机械性能，重点关注电子键合。利用密度泛函理论（DFT），我们揭示了取代原子的短程有序（SRO）并量化了它们对电子键合和机械行为的影响。这项工作的主要新颖之处在于开发了一种超越传统经验方法的拉伸强度预测模型。为了量化单个溶质对强化的贡献，我们使用物理基础的量子化学描述符，例如集成晶体轨道哈密顿布居（ICOHP），它是从第一原理计算得出的键强度的直接测量。由此产生的公式定量预测了各种$\\alpha$-Ti合金的拉伸强度，证明了高性能结构材料计算设计的重大进步。", "authors": [{"name": "Md Faiz Akhtar"}, {"name": "Nilesh P. Gurao"}, {"name": "Somnath Bhowmick"}], "featured_authors": [{"name": "Md Faiz Akhtar"}, {"name": "Nilesh P. Gurao"}, {"name": "Somnath Bhowmick"}], "author_count": 3}, {"id": "2608.15293", "category": "cond-mat", "title": "Field-Gated Programming of Nested Skyrmion Bags by Spatially Selective Skyrmion Writing", "abstract": "Nested skyrmion bags are composite magnetic solitons whose internal occupation numbers provide an expanded state space for multilevel information encoding. However, deterministic and region-selective writing of individual skyrmions into nested bags remains challenging. Here, using micromagnetic simulations, we propose a field-gated nanocontact protocol for generating and programming double-layer nested skyrmion bags S(m,S(n)). The protocol exploits the opposite field responses of bag regions with antiparallel magnetic backgrounds. Spatially segmented perpendicular magnetic fields selectively expand either the outer region or the inner bag until it overlaps with a nanocontact. A spin-polarized current pulse of the appropriate polarity then nucleates one skyrmion in the selected region, while subsequent field-driven contraction moves the written skyrmion away from the contact and restores the writing site for repeated operation. Starting from an empty nested bag S(0,S(0)), this procedure enables the controlled construction of S(m,S(0)), S(0,S(n)), and general S(m,S(n)) states. The simulated total topological charge changes in unit steps during sequential writing, confirming one-at-a-time and region-selective control. These results provide a possible route toward programmable nested topological states for multilevel spintronic information encoding.", "url": "https://arxiv.org/abs/2608.15293", "type": "理论+数值", "summary": "嵌套斯格明子袋是复合磁孤子，其内部占用数为多级信息编码提供了扩展的状态空间。然而，将单个斯格明子写入嵌套袋的确定性和区域选择性仍然具有挑战性。在这里，使用微磁模拟，我们提出了一种场门控纳米接触协议，用于生成和编程双层嵌套斯格明子袋 S(m,S(n))。该协议利用具有反平行磁场背景的袋子区域的相反场响应。空间分段的垂直磁场选择性地扩展外部区域或内袋，直到其与纳米接触重叠。然后，适当极性的自旋极化电流脉冲使选定区域中的一个斯格明子成核，而随后的场驱动收缩将写入的斯格明子移离触点并恢复写入位置以进行重复操作。从空嵌套包 S(0,S(0)) 开始，此过程可以控制 S(m,S(0))、S(0,S(n)) 和一般 S(m,S(n)) 状态的构造。\n\n模拟的总拓扑电荷在顺序写入期间以单位步骤变化，证实了一次一个和区域选择性控制。这些结果为多级自旋电子信息编码提供了通往可编程嵌套拓扑状态的可能途径。", "authors": [{"name": "Shuhuang Lin"}, {"name": "Shirong Lin"}], "featured_authors": [{"name": "Shuhuang Lin"}, {"name": "Shirong Lin"}], "author_count": 2}, {"id": "2608.15320", "category": "cond-mat", "title": "Growth-Induced Transitions in Viscoelastic Matter", "abstract": "Growth is a fundamental process in living systems. Although the stress-deformation response of growing materials is often described as either purely elastic or purely viscous, many biological tissues, from biofilms to tumors, exhibit both elastic and viscous behavior. Here, we show that this viscoelastic response can crucially control the mechanics of proliferating matter when the growth rate becomes comparable to the rate of stress relaxation. Focusing first on the prototypical case of a growing elastic beam, we find that the dynamics are governed by a single dimensionless parameter, $g \\tau$, where $g$ is the growth rate and $\\tau$ is the viscoelastic relaxation time. While the limits $g \\tau \\to 0$ and $g \\tau \\to \\infty$ recover purely viscous and purely elastic behavior, respectively, the intermediate regime is not merely a smooth crossover between them. Instead, qualitatively new dynamics emerge at $g \\tau \\sim 1$, including rapid transitions between metastable states that occur in neither limiting regime. We then develop a general, growth-compatible theoretical framework in which unconstrained growth is intrinsically stress-free, extending the analysis to other prototypical geometries and enabling simulations of more realistic growing biological materials. Within this framework, sharp mechanical transitions arise when stress generated by exponential growth accumulates faster than it can be dissipated by viscoelastic relaxation.", "url": "https://arxiv.org/abs/2608.15320", "type": "数值", "summary": "生长是生命系统的一个基本过程。尽管生长材料的应力变形响应通常被描述为纯弹性或纯粘性，但许多生物组织，从生物膜到肿瘤，都表现出弹性和粘性行为。在这里，我们表明，当生长速率与应力松弛速率相当时，这种粘弹性响应可以至关重要地控制物质增殖的力学。首先关注增长弹性梁的典型情况，我们发现动力学由单个无量纲参数 $g \\tau$ 控制，其中 $g$ 是增长率，$\\tau$ 是粘弹性弛豫时间。虽然限制 $g \\tau \\to 0$ 和 $g \\tau \\to \\infty$ 分别恢复纯粘性和纯弹性行为，但中间状态不仅仅是它们之间的平滑交叉。相反，在 $g \\tau \\sim 1$ 处出现了定性的新动态，包括在两种限制状态下都不会发生的亚稳态之间的快速转变。\n\n然后，我们开发了一个通用的、与生长兼容的理论框架，其中无约束的生长本质上是无应力的，将分析扩展到其他原型几何形状，并能够模拟更真实的生长生物材料。在此框架内，当指数增长产生的应力累积速度快于粘弹性松弛消散的速度时，就会出现急剧的机械转变。", "authors": [{"name": "Valentin Slepukhin"}, {"name": "Oskar Hallatschek"}], "featured_authors": [{"name": "Valentin Slepukhin"}, {"name": "Oskar Hallatschek"}], "author_count": 2}, {"id": "2608.15371", "category": "cond-mat", "title": "Nonequilibrium Maxwell-Demon NEMD simulations of transport: I. Extrapolating shear viscosity to the hydrodynamic limit", "abstract": "We present a Maxwell-Demon nonequilibrium molecular dynamics method for measuring the shear viscosity of a Lennard-Jones fluid. The simulation cell is divided into two regions of width $w$ in the $x$-direction, with particles free to move between the two sides. The Demon maintains equal and opposite regional average particle velocities in the $y$-direction ($\\pm u_p$), by applying an acceleration $g_{total}$ that includes both total force balance and a correction for diffusion of particles across boundaries. The momentum relaxation rate needed to sustain the nonequilibrium steady state (NESS) is $\\gamma=g_{total}/u_p$. We show that the driven velocity profile is not imposed point-wise in $x$ by the constraint, but is selected by the regional hydrodynamic response of the fluid. For this shear geometry, the measured NESS profile in Eulerian slabs is well represented by a piecewise parabolic form, reminiscent of planar Poiseuille flow. The parabolic profile estimates the kinematic viscosity from work done on the shearing fluid, $\\nu_{para}=\\gamma_{total}w^2/12$, as well as an entropy production estimate, derived from heat removal by the Nosé--Hoover thermostat that keeps each regional average temperature constant. For a representative run, the work and entropy routes agree to within $0.6\\%$, confirming consistency between the mechanical work supplied by the Demon and the heat removed by the thermostat. Once NESS driving is removed, the parabolic velocity profile relaxes exponentially rapidly to sinusoidal, the natural transverse momentum-diffusion eigenmode. These results establish the Maxwell-Demon shear method as a direct NEMD route for obtaining shear viscosity from momentum diffusion, work, and entropy balances. Our results in 3D for increasing system size $N$ (the number of particles) demonstrate that shear viscosity approaches an asymptote (the hydrodynamic limit) as $1/\\sqrt{N}$.", "url": "https://arxiv.org/abs/2608.15371", "type": "理论+数值", "summary": "我们提出了一种麦克斯韦-恶魔非平衡分子动力学方法来测量伦纳德-琼斯流体的剪切粘度。模拟单元在 $x$ 方向上分为两个宽度为 $w$ 的区域，粒子可以在两侧之间自由移动。通过应用加速度 $g_{total}$（包括总力平衡和粒子跨边界扩散校正），恶魔在 $y$ 方向 ($\\pm u_p$) 上保持相等且相反的区域平均粒子速度。维持非平衡稳态（NESS）所需的动量弛豫率为$\\gamma=g_{total}/u_p$。我们表明，驱动速度分布不是由约束在 $x$ 中逐点施加的，而是由流体的区域流体动力响应选择的。对于这种剪切几何形状，在欧拉板中测量的 NESS 剖面可以用分段抛物线形式很好地表示，让人想起平面泊肃叶流。\n\n抛物线轮廓根据剪切流体所做的功来估计运动粘度，$\\nu_{para}=\\gamma_{total}w^2/12$，以及熵产生估计，该估计是由保持每个区域平均温度恒定的 Nosé--Hoover 恒温器的排热得出的。对于代表性运行，功和熵路线一致在 $0.6\\%$ 范围内，确认了 Demon 提供的机械功和恒温器消除的热量之间的一致性。一旦 NESS 驱动被移除，抛物线速度分布就会以指数方式快速松弛到正弦曲线，即自然横向动量扩散本征模式。这些结果将麦克斯韦-恶魔剪切法确立为从动量扩散、功和熵平衡获得剪切粘度的直接 NEMD 途径。我们在增加系统尺寸 $N$（颗粒数量）时的 3D 结果表明，剪切粘度接近渐近线（流体动力学极限）为 $1/\\sqrt{N}$。", "authors": [{"name": "Hesam Arabzadeh"}, {"name": "Brad Lee Holian"}], "featured_authors": [{"name": "Hesam Arabzadeh"}, {"name": "Brad Lee Holian"}], "author_count": 2}, {"id": "2608.15457", "category": "cond-mat", "title": "Why the Multi-Sphere Shape Generator Works: Medial-Axis Placement of Spheres", "abstract": "The Multi-Sphere Shape Generator (MSS) [1] places spheres according to a feature-enhanced residual field, but the geometric basis of this strategy has remained unknown. We prove that every local maximum of the residual field lies on the medial axis of the target shape, implying that MSS places spheres at the centers of maximal inscribed spheres without explicit skeleton extraction. Numerical tests show that deviations from the exact medial axis are limited to the voxel resolution. This result provides a mathematical explanation for the placement strategy that underlies the accuracy of MSS.", "url": "https://arxiv.org/abs/2608.15457", "type": "理论+数值", "summary": "多球体形状生成器 (MSS) [1] 根据特征增强的残差场放置球体，但该策略的几何基础仍然未知。我们证明残差场的每个局部最大值都位于目标形状的中轴上，这意味着 MSS 将球体放置在最大内接球体的中心，而无需显式骨架提取。数值测试表明，与精确中轴的偏差仅限于体素分辨率。这一结果为 MSS 准确性的布局策略提供了数学解释。", "authors": [{"name": "Arash Moradian"}, {"name": "Felix Buchele"}, {"name": "Thorsten Poeschel"}], "featured_authors": [{"name": "Arash Moradian"}, {"name": "Felix Buchele"}, {"name": "Thorsten Poeschel"}], "author_count": 3}, {"id": "2608.15462", "category": "cond-mat", "title": "Information, order, complexity, and entropy in materials including biological systems: a thermodynamic theory based on state variables", "abstract": "Entropy plays a central role in thermodynamics, statistical mechanics, information theory, and biology. However, its interpretation becomes increasingly ambiguous when information-theoretic concepts are applied to materials, including biological systems. For example, in biology, it is common practice to evaluate the entropy of DNA by enumerating possible configurations. This configuration entropy does not vanish at $T=0$, apparently contradicting the third law. Similar conceptual difficulties also arise in relating entropy to order, randomness, complexity, and information. In thermodynamics, entropy is a state function, and hence the entropy must be uniquely determined by a given state of a material. The crucial issue is therefore to identify the state variables that uniquely specify the thermodynamic state of a material. By establishing consistent definition of equilibrium and state variable, it is found that the time-averaged atom positions serve as the state variables of a solid. This leads to the important conclusion that a solid possesses many equilibrium states even at fixed temperature and volume. Entropy is not information but uncertainty associated with the state variables. The latter quantities convey the information of a material. This framework provides a unified thermodynamic basis of entropy, information, order, complexity, hysteresis, and residual entropy while preserving the third law. Frozen configurations and their activation resolve many longstanding ambiguities the thermodynamic evaluation of entropy.", "url": "https://arxiv.org/abs/2608.15462", "type": "理论+数值", "summary": "熵在热力学、统计力学、信息论和生物学中发挥着核心作用。然而，当信息论概念应用于材料（包括生物系统）时，它的解释变得越来越模糊。例如，在生物学中，通常的做法是通过枚举可能的构型来评估 DNA 的熵。这种构型熵在 $T=0$ 时并没有消失，这显然与第三定律相矛盾。在将熵与秩序、随机性、复杂性和信息联系起来时，也会出现类似的概念困难。在热力学中，熵是一个状态函数，因此熵必须由材料的给定状态唯一确定。因此，关键问题是确定唯一指定材料热力学状态的状态变量。通过建立一致的平衡和状态变量定义，发现时间平均原子位置可以作为固体的状态变量。这得出了一个重要的结论：即使在固定的温度和体积下，固体也具有许多平衡态。\n\n熵不是信息，而是与状态变量相关的不确定性。后者的量传达了材料的信息。该框架提供了熵、信息、有序、复杂性、滞后和残余熵的统一热力学基础，同时保留了第三定律。冻结构型及其激活解决了熵的热力学评估中许多长期存在的模糊性。", "authors": [{"name": "Koun Shirai"}], "featured_authors": [{"name": "Koun Shirai"}], "author_count": 1}, {"id": "2608.15463", "category": "cond-mat", "title": "GEMSS: A C++ Library for Multi-Sphere Modeling in DEM Simulations", "abstract": "GEMSS (GEnerator of Multi-Sphere Shapes) converts 3D surface meshes or voxel grids into multi-sphere representations of granular particles using the recently published MSS algorithm. It computes key physical properties required for discrete element method (DEM) and general multibody dynamics simulations, including particle volume, center of mass, and principal moments and axes of inertia. Implemented as a header-only C++ library, GEMSS is easily integrated into DEM and molecular dynamics frameworks. The library has been integrated into MercuryDPM, which enables on-the-fly generation of multi-sphere particles directly within the simulation loop.", "url": "https://arxiv.org/abs/2608.15463", "type": "理论+数值", "summary": "GEMSS（多球体形状生成器）使用最近发布的 MSS 算法将 3D 表面网格或体素网格转换为颗粒粒子的多球体表示。它计算离散元法 (DEM) 和一般多体动力学模拟所需的关键物理属性，包括粒子体积、质心以及主力矩和惯性轴。 GEMSS 作为纯头文件 C++ 库实现，可轻松集成到 DEM 和分子动力学框架中。该库已集成到 MercuryDPM 中，可直接在模拟循环中动态生成多球体粒子。", "authors": [{"name": "Arash Moradian"}, {"name": "Felix Buchele"}, {"name": "Thorsten Poeschel"}], "featured_authors": [{"name": "Arash Moradian"}, {"name": "Felix Buchele"}, {"name": "Thorsten Poeschel"}], "author_count": 3}, {"id": "2608.15529", "category": "cond-mat", "title": "Weak localization in magnetic Euler bands", "abstract": "We study the quantum correction to the conductivity due to disorder in two-dimensional fragile topological bands with nonzero Euler class. Contrary to graphene where two Dirac nodes have opposite vorticities, two bands with a unit Euler number possess two Dirac points with the same vorticity, which may affect the Anderson localization. Most notably, we report an anomalous localization behavior in spinful magnetic Euler bands based on symmetry analysis and diagrammatic calculations. Despite the presence of spin-orbit coupling and an in-plane magnetization that explicitly breaks physical time-reversal symmetry, the system exhibits weak localization behavior characteristic of the orthogonal symmetry class. We demonstrate that this counter-intuitive phenomenon originates from an emergent effective time-reversal symmetry composed of crystalline and spacetime inversion symmetries, allowing it to supersede the standard localization behavior. Our findings reveal that the effective crystalline symmetries can fundamentally alter the universality class of disordered systems, rendering the localization behavior independent of the specific vorticity configuration of Dirac nodes.", "url": "https://arxiv.org/abs/2608.15529", "type": "理论+数值", "summary": "我们研究了非零欧拉类二维脆弱拓扑带无序导致的电导率的量子校正。与石墨烯中两个狄拉克节点具有相反涡度相反，具有单位欧拉数的两个带具有两个具有相同涡度的狄拉克点，这可能会影响安德森定域化。最值得注意的是，我们基于对称分析和图解计算报告了自旋磁欧拉带中的异常局域化行为。尽管存在自旋轨道耦合和明显破坏物理时间反转对称性的面内磁化，但该系统表现出正交对称类的弱局域化行为特征。我们证明，这种反直觉现象源于由晶体和时空反演对称性组成的新兴有效时间反演对称性，使其能够取代标准的局域化行为。我们的研究结果表明，有效的晶体对称性可以从根本上改变无序系统的普遍性类别，使局域化行为独立于狄拉克节点的特定涡度配置。", "authors": [{"name": "Doh Young Kim"}, {"name": "Seung Hun Lee"}, {"name": "Akira Furusaki"}, {"name": "Bohm-Jung Yang"}], "featured_authors": [{"name": "Doh Young Kim"}, {"name": "Seung Hun Lee"}, {"name": "Akira Furusaki"}, {"name": "Bohm-Jung Yang"}], "author_count": 4}, {"id": "2608.15542", "category": "cond-mat", "title": "Zero-point theorems in quantum many-body physics", "abstract": "We propose several zero-point type arguments based on the inevitable zero point(s) of a spectral gap in the quantum spin system phase diagrams in various dimensions. We consider multi-parameter families of Hamiltonian extending the conventional zero-point theorem that includes only one parameter. Analogously to the zero-point theorem, we only impose model-independent transformation relations along the parameter boundary, rather than specifying any low-energy dynamics or response. We further give a series of conjectures, which generalize our statements in a uniform way. Our results give powerful and universal model-independent constraints on the possible relevant operators for critical phenomena in quantum spin models in arbitrary high dimensions.", "url": "https://arxiv.org/abs/2608.15542", "type": "理论+数值", "summary": "我们基于不同维度的量子自旋系统相图中光谱间隙不可避免的零点，提出了几种零点类型论证。我们考虑哈密顿量的多参数族，扩展仅包含一个参数的传统零点定理。与零点定理类似，我们只沿着参数边界施加与模型无关的变换关系，而不是指定任何低能动力学或响应。我们进一步给出一系列猜想，以统一的方式概括我们的陈述。我们的结果对任意高维量子自旋模型中的关键现象的可能相关算子给出了强大且通用的独立于模型的约束。", "authors": [{"name": "Yuan Yao"}], "featured_authors": [{"name": "Yuan Yao"}], "author_count": 1}, {"id": "2608.15557", "category": "cond-mat", "title": "Intrinsic Wannier Functions for Hamiltonian downfolding", "abstract": "Downfolding ab initio material band structure into a low-energy subspace spanned by orbitals of specified atomic character, a procedure known as Wannier downfolding, is a common task in the simulation of complex materials. We introduce the Intrinsic Wannier Function (IWF) method to Wannierize bands with given atomic character. The method is non-iterative and requires only a single dimensionless parameter to disentangle bands. In benchmarks on silicon, graphene, and the three-band model of a mercury cuprate, we show that Intrinsic Wannier Functions provide high quality downfolded band structures compared to those from standard approaches such as Maximally Localized Wannier Functions and the Selected Columns of the Density Matrix method. Further, their straightforward implementation and robustness positions Intrinsic Wannier Functions as a general and useful tool for Wannier downfolding in materials electronic structure and in high-throughput applications.", "url": "https://arxiv.org/abs/2608.15557", "type": "理论+数值", "summary": "将从头开始的材料能带结构向下折叠到由指定原子特征的轨道跨越的低能子空间中，这一过程称为万尼尔向下折叠，是复杂材料模拟中的一项常见任务。我们引入了本征万尼尔函数 (IWF) 方法来对具有给定原子特征的能带进行万尼尔化。该方法是非迭代的，仅需要一个无量纲参数来解开带。在硅、石墨烯和汞铜酸盐的三能带模型的基准测试中，我们表明，与最大局部化万尼尔函数和密度矩阵方法的选定列等标准方法相比，本征万尼尔函数提供了高质量的下折叠能带结构。此外，其简单的实现和稳健性使固有 Wannier 函数成为材料电子结构和高通量应用中 Wannier 向下折叠的通用且有用的工具。", "authors": [{"name": "Shuoxue Li"}, {"name": "Garnet Kin-Lic Chan"}], "featured_authors": [{"name": "Shuoxue Li"}, {"name": "Garnet Kin-Lic Chan"}], "author_count": 2}, {"id": "2608.15562", "category": "cond-mat", "title": "Reflection Resonances in the One-Dimensional Anderson Localization: Finite-Length Statistics, Wigner Time Delay, and Boundary Eigenfunctions", "abstract": "We study reflection-resonance poles $Z_j=E_j-i\\Gamma_j$, $\\Gamma_j>0$, of a finite one-dimensional disordered sample of length $L$, coupled at one end to a semi-infinite lead, in the regime $L\\gg\\ell_L\\gg k^{-1}$, where $\\ell_L$ is the localization length and $k=\\sqrt{E}$. The key step is to relate the resonance density to the reflection coefficient at the complex energy $E+i\\Gamma$, corresponding to uniform absorption. Exact finite-chain Kac--Rice and Poincaré--Lelong identities reduce pole counting to a finite-length diffusion of the reflected intensity. For the perfect contact transparency the density crosses over from the localization-controlled $\\Gamma^{-1}$ law to the broad-resonance $\\Gamma^{-2}$ law at $\\Gamma_L=k/\\ell_L$, in agreement with $L\\to\\infty$ result of Fyodorov and Meibohm. Finite length cuts off the $\\Gamma^{-1}$ regime at $\\Gamma_{\\rm ultra}=\\frac{e^{1-\\gamma_{\\rm E}}}{2}\\Gamma_L e^{-L/\\ell_L}$. We derive the ultranarrow resonances crossover shape as an explicit moving front; for contact transparency $\\mathcal T<1$ this scale shifts to $\\mathcal T\\Gamma_{\\rm ultra}$. The same reflection process yields the finite-length Wigner time-delay statistics and, in the weak-absorption limit, the Comtet--Texier distribution. We show that at eigenvalues of the corresponding closed Dirichlet sample the Wigner delay is inversely proportional to the squared boundary derivative of the normalized eigenfunction. This quantity also gives the eigenvalue response to displacement of the Dirichlet boundary at the lead-contact end, and hence the force exerted by the eigenmode on that boundary; we obtain its finite-length distribution. Finally, the finite-transparency resonance density obeys the single-channel Moldauer--Simonius sum rule, linking its perfect-coupling divergence to the $\\Gamma^{-2}$ tail. Direct lattice and spectral computations test the crossover and front constant.", "url": "https://arxiv.org/abs/2608.15562", "type": "理论", "summary": "我们研究长度为 $L$ 的有限一维无序样本的反射共振极点 $Z_j=E_j-i\\Gamma_j$, $\\Gamma_j>0$，在 $L\\gg\\ell_L\\gg k^{-1}$ 状态下在一端耦合到半无限导联，其中 $\\ell_L$ 是定位长度，$k=\\sqrt{E}$。关键步骤是将共振密度与复能量 $E+i\\Gamma$ 处的反射系数联系起来，对应于均匀吸收。精确的有限链 Kac--Rice 和 Poincaré--Lelong 恒等式将极计数简化为反射强度的有限长度扩散。为了获得完美的接触透明度，密度在 $\\Gamma_L=k/\\ell_L$ 处从局域化控制的 $\\Gamma^{-1}$ 定律跨越到宽共振 $\\Gamma^{-2}$ 定律，与 Fyodorov 和 Meibohm 的 $L\\to\\infty$ 结果一致。有限长度在 $\\Gamma_{\\rm ultra}=\\frac{e^{1-\\gamma_{\\rm E}}}{2}\\Gamma_L e^{-L/\\ell_L}$ 处切断 $\\Gamma^{-1}$ 区域。我们将超窄共振交叉形状推导出为明确的移动前沿；对于接触透明度 $\\mathcal T<1$，该比例会转变为 $\\mathcal T\\Gamma_{\\rm ultra}$。\n\n相同的反射过程产生有限长度维格纳时滞统计，并且在弱吸收极限下产生 Comtet-Texier 分布。我们证明，在相应的闭合狄利克雷样本的特征值处，维格纳延迟与归一化特征函数的边界导数的平方成反比。该量还给出了引线接触端狄利克雷边界位移的特征值响应，以及特征模式施加在该边界上的力；我们得到它的有限长度分布。最后，有限透明共振密度遵循单通道 Moldauer-Simonius 和规则，将其完美耦合散度与 $\\Gamma^{-2}$ 尾部联系起来。直接晶格和光谱计算测试交叉和前沿常数。", "authors": [{"name": "Yan V. Fyodorov"}], "featured_authors": [{"name": "Yan V. Fyodorov"}], "author_count": 1}, {"id": "2608.15570", "category": "cond-mat", "title": "Neural-Embedded Graphical Model for Self-Consistent Hierarchical Upscaling of Complex Composites", "abstract": "A persistent challenge in computational physical modeling is the substantial disparity between the characteristic length scales of microstructures and macroscopic structural components. Multiscale modeling has been widely adopted to bridge this gap by coupling methodologies tailored to different scales. However, conventional approaches, such as asymptotic homogenization (bottom-up) and submodeling (top-down), often entail rigorous mathematical prerequisites or intricate interfacing procedures. To address these limitations, we introduce a fully scalable neural-embedded graphical model (NEGM) that provides a unified framework for the progressive upscaling of highly heterogeneous composite materials. Specifically, NEGM encodes all microstructure- and material-related complexities into constituent neural network blocks, which are then organized into a hypergraph to simulate progressively larger domains. Extensive numerical benchmarks demonstrate that NEGM reliably predicts the physical responses of 2D and 3D composites exhibiting strong material nonlinearity, arbitrary boundary conditions, and irregular geometries. Crucially, because NEGM relies solely on neural network training and inference, it offers a scale-invariant formulation. This enables iterative application of NEGM to upscale from the microscale to arbitrarily large scales, circumventing the need for complex interfacing protocols between disparate modeling frameworks. We validate this progressive upscaling strategy on a large mosaic composite domain, showing that the accumulated error can be effectively contained provided the constituent blocks achieve sufficiently high prediction accuracy. Our findings suggest that artificial neural networks not only enhance the efficiency of direct single-scale simulations, as previously demonstrated, but also provide a clean and elegant pathway toward streamlined multiscale modeling.", "url": "https://arxiv.org/abs/2608.15570", "type": "理论+数值", "summary": "计算物理建模中的一个持续挑战是微观结构和宏观结构部件的特征长度尺度之间的巨大差异。多尺度建模已被广泛采用，通过针对不同尺度定制的耦合方法来弥补这一差距。然而，传统方法，例如渐近均质化（自下而上）和子建模（自上而下），通常需要严格的数学先决条件或复杂的接口程序。为了解决这些限制，我们引入了一种完全可扩展的神经嵌入式图形模型（NEGM），它为高度异质复合材料的逐步升级提供了统一的框架。具体来说，NEGM 将所有与微观结构和材料相关的复杂性编码到组成的神经网络块中，然后将其组织成超图以模拟逐渐更大的域。广泛的数值基准表明，NEGM 可以可靠地预测 2D 和 3D 复合材料的物理响应，这些复合材料表现出很强的材料非线性、任意边界条件和不规则几何形状。\n\n至关重要的是，由于 NEGM 仅依赖于神经网络训练和推理，因此它提供了尺度不变的公式。这使得 NEGM 的迭代应用能够从微观尺度升级到任意大尺度，从而避免了不同建模框架之间对复杂接口协议的需求。我们在大型镶嵌复合域上验证了这种渐进升级策略，表明只要组成块达到足够高的预测精度，就可以有效地包含累积误差。我们的研究结果表明，人工神经网络不仅提高了直接单尺度模拟的效率（如之前所证明的），而且还为简化的多尺度建模提供了一条简洁而优雅的途径。", "authors": [{"name": "Nuo Xu"}, {"name": "Shaohua Chen"}], "featured_authors": [{"name": "Nuo Xu"}, {"name": "Shaohua Chen"}], "author_count": 2}, {"id": "2608.15588", "category": "cond-mat", "title": "A General-purpose Solver of Fourier Neural Swarm Operator Towards Accurate and Efficient Mechanical Modeling of Ultra Large Composite Materials", "abstract": "Composite media with complex microstructures exhibit highly tailorable mechanical properties but remain challenging to model efficiently and accurately. Conventional homogenization often oversimplifies microstructural effects, whereas multiscale approaches typically require costly coupling across spatial and temporal scales. To address these limitations, we propose a two-scale neural-swarm framework for large-scale mechanical modeling of heterogeneous composites. At the local scale, the mechanical characteristics of representative microstructural features are encoded into building-block Fourier neural operators (FNOs) using level-set representations. At the global scale, these pretrained FNOs are assembled into an FNO swarm according to the spatial distribution of microstructural constituents. A coarse-mesh finite element model is employed to provide global physical guidance, while Schwarz iteration is used to synchronize neighboring FNOs and enforce consistency across shared interfaces. The proposed framework is validated through nonlinear simulations of SiC-Al composites with diverse microstructural configurations. Compared with nonlinear finite element analysis, the FNO-swarm method achieves comparable accuracy while reducing computational cost by orders of magnitude. For an extreme dual-property SiC-Al composite containing more than a billion nodal points, the proposed approach predicts the mechanical response within approximately one hour, demonstrating exceptional scalability. Furthermore, the framework naturally accommodates arbitrary Dirichlet boundary conditions and complex domain geometries. The proposed neural-swarm strategy provides a robust and scalable paradigm for large-scale mechanics simulations, reconciling the longstanding trade-off between computational efficiency and physical fidelity in heterogeneous materials modeling.", "url": "https://arxiv.org/abs/2608.15588", "type": "理论+数值", "summary": "具有复杂微观结构的复合介质表现出高度可定制的机械性能，但高效、准确地建模仍然具有挑战性。传统的均质化通常过度简化微观结构效应，而多尺度方法通常需要跨空间和时间尺度的昂贵耦合。为了解决这些限制，我们提出了一种用于异质复合材料大规模机械建模的两尺度神经群框架。在局部尺度上，代表性微观结构特征的机械特性被编码为使用水平集表示的构建块傅立叶神经算子（FNO）。在全球范围内，这些预训练的 FNO 根据微观结构成分的空间分布被组装成 FNO 群。采用粗网格有限元模型来提供全局物理指导，同时使用 Schwarz 迭代来同步相邻 FNO 并强制共享接口之间的一致性。所提出的框架通过具有不同微观结构配置的 SiC-Al 复合材料的非线性模拟得到验证。\n\n与非线性有限元分析相比，FNO-swarm 方法实现了相当的精度，同时将计算成本降低了几个数量级。对于包含超过十亿个节点的极端双性能 SiC-Al 复合材料，所提出的方法可以预测大约一小时内的机械响应，展现出卓越的可扩展性。此外，该框架自然地适应任意狄利克雷边界条件和复杂的域几何形状。所提出的神经群策略为大规模力学模拟提供了一个强大且可扩展的范例，协调了异质材料建模中计算效率和物理保真度之间长期存在的权衡。", "authors": [{"name": "Lekun Gao"}, {"name": "Shaohua Chen"}], "featured_authors": [{"name": "Lekun Gao"}, {"name": "Shaohua Chen"}], "author_count": 2}, {"id": "2608.15732", "category": "cond-mat", "title": "Accessing Gapped Chiral Phase with Auxiliary-Assisted PEPS", "abstract": "It has been controversial whether infinite projected entangled pair state (PEPS) can faithfully describe chiral gapped phases in two dimensions or not. Finite-bond-dimension PEPS can capture many local and topological properties of chiral phases, but generically develop spurious long-range power-law like correlations. We introduce an auxiliary-assisted framework that bypass this obstruction by embedding the physical chiral system together with an auxiliary time-reversed partner, yielding a non-chiral enlarged representation whose physical chiral sector is recovered with controlled decoupling. For both a free-fermion Chern insulator and an interacting chiral spin liquid, the resulting PEPS show clean gapped correlation functions, and a finite transfer-matrix correlation length, in contrast with the artificial long-range tail of direct chiral PEPS representations. There exist small and negligibly coupling between the physical and auxiliary systems due to the finite entanglement effect, which only affect short-ranged local quantities. Despite the nonchiral enlarged representation, the chiral topological information remains encoded in the entanglement. Using layer-resolved momentum projection, we recover the expected universal chiral entanglement boundary spectrum. Our study provides a practical route to access gapped chiral phases with finite bond-dimension PEPS by changing the representation problem rather than directly studying the chiral pure state.", "url": "https://arxiv.org/abs/2608.15732", "type": "理论+数值", "summary": "无限投影纠缠对态（PEPS）是否可以忠实地描述二维手性带隙相一直存在争议。有限键维 PEPS 可以捕获手性相的许多局部和拓扑特性，但通常会产生虚假的长程幂律相关性。我们引入了一种辅助辅助框架，通过将物理手性系统与辅助时间反转伙伴一起嵌入来绕过这一障碍，产生非手性放大表示，其物理手性部分通过受控解耦来恢复。对于自由费米子陈绝缘体和相互作用的手性自旋液体，所得的 PEPS 显示出干净的带隙相关函数和有限的传递矩阵相关长度，这与直接手性 PEPS 表示的人工长程尾部形成对比。由于有限纠缠效应，物理系统和辅助系统之间存在较小且可忽略不计的耦合，仅影响短程局部量。尽管非手性放大表示，手性拓扑信息仍然编码在纠缠中。\n\n使用层分辨动量投影，我们恢复了预期的通用手性纠缠边界谱。我们的研究通过改变表示问题而不是直接研究手性纯态，提供了一种利用有限键维 PEPS 获取带隙手性相的实用途径。", "authors": [{"name": "Sen Niu"}, {"name": "Rui-Zhen Huang"}], "featured_authors": [{"name": "Sen Niu"}, {"name": "Rui-Zhen Huang"}], "author_count": 2}, {"id": "2608.15800", "category": "cond-mat", "title": "Linear response functions from inhomogeneous dynamical mean-field theory", "abstract": "We present a method for calculating static lattice susceptibilities with inhomogeneous dynamical mean-field theory. The method utilizes the response of the system to an external field and thereby circumvents two-particle vertex functions. We demonstrate the success of our approach for the magnetic susceptibility of the square-lattice Hubbard model using the numerical renormalization group as an impurity solver and show that it compares well with the results obtained using the standard vertex approach. As it avoids vertex functions and is compatible with virtually any impurity solver, our method is able to reach low temperatures that are hard to access with other methods.", "url": "https://arxiv.org/abs/2608.15800", "type": "理论+数值", "summary": "我们提出了一种利用非齐次动态平均场理论计算静态晶格磁化率的方法。该方法利用系统对外部场的响应，从而规避二粒子顶点函数。我们使用数值重正化群作为杂质求解器证明了我们的方格哈伯德模型磁化率方法的成功，并表明它与使用标准顶点方法获得的结果相比较。由于它避免了顶点函数并且几乎与任何杂质求解器兼容，因此我们的方法能够达到其他方法难以达到的低温。", "authors": [{"name": "Don Rolih"}, {"name": "Fabian B. Kugler"}], "featured_authors": [{"name": "Don Rolih"}, {"name": "Fabian B. Kugler"}], "author_count": 2}, {"id": "2608.15811", "category": "cond-mat", "title": "Topological Altermagnetic Insulators", "abstract": "We study the emergence of altermagnetic topological phases stabilized by Ising spin-orbit coupling in a prototypical Lieb lattice model of a correlated altermagnet. Treating the electron interactions within the Hartree-Fock and the exact diagonalization techniques, we establish the co-existence of a quantum spin Hall effect with altermagnetic spin order over a wide region of the parameter space for average electron densities of 2 and 4 per unit cell. We explore how the magnetic structure along edges influences the electronic behavior of the associated topological edge modes, demonstrating their robustness against inversion-symmetry breaking terms.", "url": "https://arxiv.org/abs/2608.15811", "type": "理论+数值", "summary": "我们研究了相关交变磁体的原型利布晶格模型中伊辛自旋轨道耦合稳定的交变拓扑相的出现。通过处理 Hartree-Fock 内的电子相互作用和精确的对角化技术，我们在参数空间的广阔区域内建立了量子自旋霍尔效应与交变自旋序的共存，每个晶胞的平均电子密度为 2 和 4。我们探索沿边缘的磁性结构如何影响相关拓扑边缘模式的电子行为，证明它们对反演对称破缺项的鲁棒性。", "authors": [{"name": "Jasmin Bedow"}, {"name": "Nitin Kaushal"}, {"name": "Marcel Franz"}], "featured_authors": [{"name": "Jasmin Bedow"}, {"name": "Nitin Kaushal"}, {"name": "Marcel Franz"}], "author_count": 3}, {"id": "2608.15887", "category": "cond-mat", "title": "Dynamic critical exponent of the Yang--Lee edge singularity at three loops", "abstract": "We compute the dynamic critical exponent $z$ of the Yang--Lee edge singularity in relaxational dynamics using perturbative renormalization-group methods to the three-loop order. The calculation combines diagram reduction, analytic two-loop evaluation via parametric integration with hyperlogarithms, and numerical evaluation of three-loop integrals using the Sector Decomposition method. The perturbative series obtained is resummed using Padé and Padé-Borel-Leroy methods to produce estimates of $z$ in various spatial dimensions. The resulting values are consistent with previous perturbative and functional renormalization-group calculations.", "url": "https://arxiv.org/abs/2608.15887", "type": "理论+数值", "summary": "我们使用三环阶微扰重正化群方法计算松弛动力学中杨-李边缘奇点的动态临界指数 $z$。该计算结合了图简化、通过超对数参数积分进行的解析二环评估以及使用扇形分解方法进行三环积分的数值评估。使用 Padé 和 Padé-Borel-Leroy 方法恢复获得的扰动序列，以生成不同空间维度的 $z$ 估计值。所得值与之前的微扰和函数重正化群计算一致。", "authors": [{"name": "Loran Ts. Adzhemyan"}, {"name": "Diana A. Davletbaeva"}, {"name": "Daniil A. Evdokimov"}, {"name": "Mikhail V. Kompaniets"}], "featured_authors": [{"name": "Loran Ts. Adzhemyan"}, {"name": "Diana A. Davletbaeva"}, {"name": "Daniil A. Evdokimov"}, {"name": "Mikhail V. Kompaniets"}], "author_count": 4}, {"id": "2608.15900", "category": "cond-mat", "title": "Crystal-structure design by agentic AI in a language of motifs", "abstract": "Data-driven materials discovery interpolates more reliably than it extrapolates and seldom reaches new structure types. We present MatEvolve, an agentic-AI framework designing crystals, proposing each candidate with a stated rationale and testing it. The agent reasons in an interpretable \\emph{language of motifs}, writing each crystal as a \\emph{motif profile} that describes the recurring geometric patterns---the \\emph{motifs}---composing it. The motif profile serves not merely as a description of a material but as the medium for material design: the agent edits the profile and constructs a crystal from the modified one, and the most promising candidates are validated by first-principles calculation. Applied to the design of rare-earth-lean permanent magnets, MatEvolve---built on the state-of-the-art language model Claude Fable~5 without fine-tuning---reaches new structural prototypes more than three times as often as generative models under an equal validation budget, at a comparable on-target-magnet rate. Beyond design, analysing the discovered crystals' human-readable profiles reveals structure--property relationships.", "url": "https://arxiv.org/abs/2608.15900", "type": "理论+数值", "summary": "数据驱动的材料发现插值比推断更可靠，并且很少达到新的结构类型。我们推出了 MatEvolve，一个设计晶体的代理人工智能框架，为每个候选者提出了明确的理由并进行测试。智能体以可解释的\\emph{图案语言}进行推理，将每个晶体写为\\emph{图案轮廓}，描述组成它的重复出现的几何图案——\\emph{图案}。图案轮廓不仅用作材料的描述，而且作为材料设计的媒介：代理编辑轮廓并从修改后的轮廓构建晶体，并且通过第一原理计算验证最有希望的候选者。 MatEvolve 应用于贫稀土永磁体的设计，基于最先进的语言模型 Claude Fable~5 构建，无需微调，在相同的验证预算和相当的目标磁体率下，达到新结构原型的频率是生成模型的三倍多。除了设计之外，分析发现的晶体的人类可读的轮廓揭示了结构-性质关系。", "authors": [{"name": "Dinh-Khiet Le"}, {"name": "Minh-Quyet Ha"}, {"name": "Hong-Phuc Vu-Dinh"}, {"name": "Takashi Miyake"}, {"name": "Hiori Kino"}, {"name": "Hieu-Chi Dam"}], "featured_authors": [{"name": "Dinh-Khiet Le"}, {"name": "Minh-Quyet Ha"}, {"name": "Hong-Phuc Vu-Dinh"}, {"name": "Takashi Miyake"}, {"name": "Hiori Kino"}, {"name": "Hieu-Chi Dam"}], "author_count": 6}, {"id": "2608.15911", "category": "cond-mat", "title": "External identification and electrothermal modeling of persistent-current-switch operating states in a Siemens MRI magnet", "abstract": "A persistent current switch (PCS) closes the superconducting loop of an MRI magnet; a heater makes it resistive so an external supply can change the magnet current. PCS control is usually treated as binary: heater on--resistive, heater off--superconducting. External current and voltage logs from an MPS2 service power supply (Digit Systems) show for a Siemens MAGNETOM Avanto magnet that the command does not uniquely determine the PCS state: after heater switch-off, Joule self-heating can sustain the resistive state. Purpose-designed maneuvers separate two resistive regimes. With the heater energized, the branch resistance is nearly constant at 1.86--2.19 $\\Omega$ below 0.5 V. After switch-off, the self-sustained regime follows $R_{sw}=0.65|V_{node}|^{1.5}$ ($R_{sw}$ in ohms, $V_{node}$ in volts) and is 12-fold below the heater-on resistance at 0.4 V. Both regimes obey one electrothermal relation, $R_{sw}=C(P_h h+V_{node}^2/R_{sw})^a$, with $h$ the binary heater command, over a 690-fold resistance range. First, branch resistance and coil inductance set the redistribution time constant, $\\tau=L/R_{sw}$; final-hold duration therefore controls persistent-current accuracy. Across 18 service sessions on other Siemens magnets, analyzed without transferring the Avanto coefficients, the median hold was $13\\tau$ and the median residual branch current was 8 ppm of coil current. Second, the intersection of the PCS characteristic and external-circuit load line sets the self-sustainment boundary. The cross-session estimate of 0.062 V lies between observed retrapping at 0.06 V and retention at 0.07 V. In dynamic simulation, the two fixed-coefficient characteristics $R(V,h)$ reduce current RMSE from 1.449 to 0.154 A (9.4-fold); omitting explicit heater input gives no improvement over the inductance-only model.", "url": "https://arxiv.org/abs/2608.15911", "type": "理论+数值", "summary": "持续电流开关 (PCS) 闭合 MRI 磁体的超导回路；加热器使其具有电阻，因此外部电源可以改变磁体电流。 PCS 控制通常被视为二进制：加​​热器打开 - 电阻，加热器关闭 - 超导。来自 MPS2 服务电源（数字系统）的外部电流和电压日志显示，对于西门子 MAGNETOM Avanto 磁铁，该命令不能唯一确定 PCS 状态：加热器关闭后，焦耳自加热可以维持电阻状态。专门设计的操作将两种阻力区分开。加热器通电后，支路电阻几乎恒定在 1.86--2.19 $\\Omega$，低于 0.5 V。关闭后，自维持状态遵循 $R_{sw}=0.65|V_{node}|^{1.5}$（$R_{sw}$ 以欧姆为单位，$V_{node}$ 以伏特为单位），并且比加热器开启电阻低 12 倍0.4 V。两种状态都遵循一种电热关系，$R_{sw}=C(P_h h+V_{node}^2/R_{sw})^a$，其中 $h$ 是二进制加热器命令，电阻范围超过 690 倍。首先，支路电阻和线圈电感设定重分配时间常数，$\\tau=L/R_{sw}$；因此，最终保持持续时间控制持续电流精度。\n\n在其他西门子磁体上的 18 次维修过程中，在不传输 Avanto 系数的情况下进行分析，保持中位数为 $13\\tau$，残余支路电流中位数为线圈电流的 8 ppm。其次，PCS 特性与外部电路负载线的交点设定了自我维持边界。 0.062 V 的跨会话估计位于观察到的 0.06 V 重新捕获和 0.07 V 保留之间。在动态模拟中，两个固定系数特性 $R(V,h)$ 将当前 RMSE 从 1.449 A 降低到 0.154 A（9.4 倍）；省略显式加热器输入并没有比纯电感模型有任何改进。", "authors": [{"name": "Volodymyr Pupkov"}], "featured_authors": [{"name": "Volodymyr Pupkov"}], "author_count": 1}, {"id": "2608.16020", "category": "cond-mat", "title": "Beyond Local Berry Geometry: A First-Principles Finite-Momentum Theory of Electronic Position", "abstract": "Electronic position controls how a crystal polarizes and responds to an external field. In crystals, it is usually described through local changes of electronic states in momentum space. This Berry framework has reshaped modern solid-state physics, but strong fields drive electrons across a finite momentum range, where coherence between different momenta becomes part of the response. Here we establish a first-principles theory of electronic position at finite momentum that retains this missing information. We show that unequal-momentum coherence can cancel under spatial averaging and still produce polarization, forming a coherence dipole. We obtain the matrix directly from material wave functions, without model bands or fitted transition elements. In Si, the finite-momentum geometry sets a material momentum scale. Comparing this scale with the momentum change driven by the field predicts when finite-momentum physics becomes active. Crossing the scale strongly reorganizes the fifth and higher harmonics, showing that momentum-space geometry, rather than emitted photon energy alone, controls the nonlinear response. HHG is the first demonstration, but the theory applies whenever driven electrons explore a finite momentum range. It therefore extends quantum geometry beyond the local Berry limit and provides a general basis for predicting field-driven phenomena in real materials.", "url": "https://arxiv.org/abs/2608.16020", "type": "理论", "summary": "电子位置控制晶体如何极化和响应外部场。在晶体中，通常通过动量空间中电子态的局部变化来描述。这个贝里框架重塑了现代固态物理学，但强场驱动电子穿过有限的动量范围，其中不同动量之间的相干性成为响应的一部分。在这里，我们建立了有限动量下电子位置的第一原理理论，保留了这些缺失的信息。我们证明，不等动量相干性可以在空间平均下抵消，但仍然产生偏振，形成相干偶极子。我们直接从材料波函数获得矩阵，无需模型带或拟合过渡元素。在 Si 中，有限动量几何设定了材料动量尺度。将这个尺度与场驱动的动量变化进行比较，可以预测有限动量物理学何时变得活跃。跨越尺度强烈地重组了五次和更高次谐波，表明动量空间几何结构，而不是单独发射的光子能量，控制着非线性响应。\n\nHHG 是第一个演示，但该理论适用于驱动电子探索有限动量范围的情况。因此，它将量子几何扩展到局部贝里极限之外，并为预测实际材料中的场驱动现象提供了一般基础。", "authors": [{"name": "M. S. Si"}, {"name": "Y. Q. Li"}, {"name": "G. P. Zhang"}], "featured_authors": [{"name": "M. S. Si"}, {"name": "Y. Q. Li"}, {"name": "G. P. Zhang"}], "author_count": 3}, {"id": "2608.16113", "category": "cond-mat", "title": "First-Principles Prediction of Phonon-Mediated Infrared Optical Properties of WO$_3$ Polymorphs", "abstract": "Many crystals exhibit polymorphism, undergoing atomic rearrangements that result in unit cells belonging to different symmetry groups. These structural changes directly affect lattice vibration modes and consequently influence their mid-infrared optical properties. In this study, we use tungsten trioxide (WO$_3$) as a representative system, owing to its multiple temperature-dependent phases, to study the impact of polymorphism on mid-infrared optical behaviour. Using a fully first-principles approach, we investigate three phases of WO$_3$ and evaluate their mid-infrared optical properties. Significant differences are observed among the three crystallographic phases, demonstrating the potential of this methodology as a predictive tool for materials discovery and targeted design.", "url": "https://arxiv.org/abs/2608.16113", "type": "理论+数值", "summary": "许多晶体表现出多态性，经历原子重排，导致晶胞属于不同的对称群。这些结构变化直接影响晶格振动模式，从而影响其中红外光学特性。在本研究中，我们使用三氧化钨（WO$_3$）作为代表系统，由于其具有多个温度依赖性相，来研究多态性对中红外光学行为的影响。使用完全第一性原理方法，我们研究了 WO$_3$ 的三个相并评估了它们的中红外光学特性。在三个晶体相之间观察到显着差异，证明了该方法作为材料发现和目标设计的预测工具的潜力。", "authors": [{"name": "Sreerag Sundaram"}, {"name": "Karthik Sasihithlu"}], "featured_authors": [{"name": "Sreerag Sundaram"}, {"name": "Karthik Sasihithlu"}], "author_count": 2}, {"id": "2608.16124", "category": "cond-mat", "title": "Spin-pump-induced spin transport demonstration in a photoconductive PTCDA molecular thin film with a transparent spin current detector", "abstract": "We demonstrate spin-pump-induced spin transport in a photoconductive PTCDA (3,4,9,10-perylene-teracarboxylic dianhydride) molecular thin film with a transparent ITO (In2O3 + SnO2) film as a spin current detector. In a tri-layer stacking structure sample composed of ITO/PTCDA/Ni80Fe20, pure spin current is generated in the PTCDA layer by using the spin pumping driven by the ferromagnetic resonance of the Ni80Fe20 layer. The generated spin current is absorbed into the ITO layer, converted to a charge current due to the inverse spin-Hall effect of the ITO layer, and detected as an electromotive force via the ITO resistance. Also, the light irradiation effect on spin transport in PTCDA films is investigated.", "url": "https://arxiv.org/abs/2608.16124", "type": "理论", "summary": "我们在光电导 PTCDA（3,4,9,10-苝-四甲酸二酐）分子薄膜中演示了自旋泵诱导的自旋输运，并以透明 ITO（In2O3 + SnO2）薄膜作为自旋电流探测器。在由ITO/PTCDA/Ni80Fe20组成的三层堆叠结构样品中，利用Ni80Fe20层的铁磁共振驱动的自旋泵浦在PTCDA层中产生纯自旋电流。产生的自旋电流被ITO层吸收，由于ITO层的逆自旋霍尔效应而转换为充电电流，并通过ITO电阻检测为电动势。此外，还研究了光照射对 PTCDA 薄膜中自旋输运的影响。", "authors": [{"name": "Yuri Matsukawa"}, {"name": "Eiji Shikoh"}], "featured_authors": [{"name": "Yuri Matsukawa"}, {"name": "Eiji Shikoh"}], "author_count": 2}, {"id": "2608.16171", "category": "cond-mat", "title": "Rare-event sampling for stochastic dynamics in network systems using cluster updates", "abstract": "Understanding the stochastic evolution in complex networks is a central challenge across physics, biology, engineering, social science, and finance. The most consequential macroscopic events, like cascading failures in communication networks, widespread epidemic outbreaks, and rapid shifts in societal opinions, often emerge from a confluence of rare, localized stochastic processes and need to pass certain bottlenecks. Standard forward-time simulation algorithms like the Gillespie method are inefficient for the investigation of such phenomena due to catastrophic rejection rates. Advanced rare-event techniques like splitting methods and transition-path sampling often suffer from kinetic trapping, path degeneracy, genealogical correlations, or critical slowing down when applied to complex heterogeneous networks. We propose to overcome this challenge by establishing a novel technique called conditional-path Monte Carlo (CPMC), inspired by loop algorithms from equilibrium condensed-matter physics. By employing non-local updates on spacetime clusters without rejections, CPMC generates a Markov chain of trajectories that all strictly respect the targeted macroscopic boundary conditions like the occurrence of a massive network failure. We demonstrate the framework's potential by performing a simple risk factor analysis for rare large-scale epidemic outbreaks in SIS dynamics on kinship networks.", "url": "https://arxiv.org/abs/2608.16171", "type": "理论+数值", "summary": "理解复杂网络中的随机演化是物理学、生物学、工程学、社会科学和金融领域的一个核心挑战。最重要的宏观事件，例如通讯网络的级联故障、广泛的流行病爆发以及社会舆论的快速转变，往往是由罕见的局部随机过程汇合而成，需要克服某些瓶颈。由于灾难性的拒绝率，像 Gillespie 方法这样的标准正向时间模拟算法对于研究此类现象效率低下。先进的罕见事件技术，如分裂方法和转移路径采样，在应用于复杂的异构网络时，通常会遇到动力学捕获、路径简并、谱系相关性或严重减速的问题。我们建议通过建立一种称为条件路径蒙特卡罗（CPMC）的新技术来克服这一挑战，该技术受到平衡凝聚态物理循环算法的启发。\n\n通过在时空簇上采用非局部更新而不排斥，CPMC 生成了一条马尔可夫轨迹链，所有轨迹都严格遵守目标宏观边界条件，例如发生大规模网络故障。我们通过对亲属网络上 SIS 动态中罕见的大规模流行病爆发进行简单的风险因素分析，展示了该框架的潜力。", "authors": [{"name": "Jiazheng Sun"}, {"name": "James Moody"}, {"name": "Thomas Barthel"}], "featured_authors": [{"name": "Jiazheng Sun"}, {"name": "James Moody"}, {"name": "Thomas Barthel"}], "author_count": 3}, {"id": "2608.16247", "category": "cond-mat", "title": "Bond Disproportionation, Ligand Holes, and Persistent Spin Textures in Ag$_2$BiO$_3$", "abstract": "The origin of the proposed bond disproportionated insulating state of the non-centrosymmetric ($Pnn2$) phase of Ag$_{2}$BiO$_{3}$ is explored using first principles electronic structure calculations. The novel insulating state is elucidated by first considering the initially proposed centosymmetric metallic ($Pnna$) phase of Ag$_{2}$BiO$_{3}$. Our calculations reveal that the valence skipping Bi$^{4+}$ ions in this phase are better described as Bi$^{3+}\\underline{L}$ with completely filled Bi-(6$s$) states and a ligand hole. However, phonon calculations indicate that the metallic ($Pnna$) state is dynamically unstable. Structural stability is achieved through breathing distortions of the oxygen octahedra, resulting in two inequivalent Bi sites and a reduction of symmetry to the $Pnn2$ phase. Electronic structure calculations further reveal that the $Pnn2$ phase is a bond disproportionated insulator where the nominal charge state of Bi is described by : 2[Bi$^{3+}\\underline{L}$ (Bi$^{4+}$)] $\\rightarrow$ Bi$^{3+}\\underline{L}^{2-\\delta}$ (Bi1$^{5+}$) + Bi$^{3+}\\underline{L}^{\\delta}$ (Bi2$^{3+}$), highlighting the crucial role of ligand holes in driving the insulating state. Next we have investigated the electronic structure of Ag$_{2}$BiO$_{3}$ in the insulating ($Pnn2$) phase including spin-orbit coupling. Our density functional theory (DFT ) calculations complemented by ${\\bf k.p}$ model Hamiltonian analysis reveal persistent spin-textures around the $X$ and $Y$ high symmetry points of the orthorhombic Brillouin zone imposed by non-symmorphic symmetry, positioning Ag$_{2}$BiO$_{3}$ as a promising candidate for spintronic applications.", "url": "https://arxiv.org/abs/2608.16247", "type": "理论+数值", "summary": "使用第一原理电子结构计算探讨了 Ag$_{2}$BiO$_{3}$ 非中心对称 ($Pnn2$) 相的所提出的键歧化绝缘态的起源。首先考虑最初提出的 Ag$_{2}$BiO$_{3}$ 中心对称金属 ($Pnna$) 相，阐明了这种新颖的绝缘态。我们的计算表明，该相中的价跳跃 Bi$^{4+}$ 离子可以更好地描述为 Bi$^{3+}\\underline{L}$ ，具有完全填充的 Bi-(6$s$) 态和配体空穴。然而，声子计算表明金属 ($Pnna$) 态动态不稳定。结构稳定性是通过氧八面体的呼吸变形实现的，导致两个不等的 Bi 位点和 $Pnn2$ 相的对称性降低。电子结构计算进一步表明$Pnn2$相是键歧化绝缘体，其中Bi的标称电荷态描述为： 2[Bi$^{3+}\\underline{L}$ (Bi$^{4+}$)] $\\rightarrow$ Bi$^{3+}\\underline{L}^{2-\\delta}$ (Bi1$^{5+}$) + Bi$^{3+}\\underline{L}^{\\delta}$ (Bi2$^{3+}$)，强调了配体空穴在驱动绝缘态中的关键作用。\n\n接下来我们研究了 Ag$_{2}$BiO$_{3}$ 在绝缘 ($Pnn2$) 相中的电子结构，包括自旋轨道耦合。我们的密度泛函理论 (DFT ) 计算辅以 ${\\bf k.p}$ 模型哈密顿分析，揭示了非对称性所造成的斜方布里渊区 $X$ 和 $Y$ 高对称点周围的持续自旋纹理，将 Ag$_{2}$BiO$_{3}$ 定位为自旋电子应用的有前途的候选者。", "authors": [{"name": "Atanu Paul"}, {"name": "Subhadeep Bandyopadhay"}, {"name": "Anupam Mondal"}, {"name": "Indra Dasgupta"}], "featured_authors": [{"name": "Atanu Paul"}, {"name": "Subhadeep Bandyopadhay"}, {"name": "Anupam Mondal"}, {"name": "Indra Dasgupta"}], "author_count": 4}, {"id": "2608.16348", "category": "cond-mat", "title": "Effect of Magnetic Vacancies on the Spontaneous Spin-Reorientation Transition in HoFe$_{1-x}$Al$_x$O$_3$ Single Crystals", "abstract": "In this work, we report the first growth of single crystals of the substitution series HoFe$_{1-x}$Al$_x$O$_3$ with aluminium concentrations up to $x=0.2$ and investigate the evolution of their spontaneous spin-reorientation transition (SRT). Among rare-earth orthoferrites, HoFeO$_3$ exhibits a distinctive sequence of magnetic phases ($\\Gamma_4$-$\\Gamma_{24}$-$\\Gamma_{12}$-$\\Gamma_2$). This complex sequence arises from the competition between the $K_{ac}$ and $K_{ab}$ anisotropies associated with the Ho$^{3+}$ ions and the effective magnetic field produced by the weak ferromagnetic moment of the canted Fe$^{3+}$ sublattice. Introducing magnetic vacancies perturbs the antiferromagnetic compensation of the Fe$^{3+}$ subsystem in the $ab$ plane and generates an additional effective magnetic field acting on the Ho$^{3+}$ ions. This field alters the balance between the $K_{ac}$ and $K_{ab}$ anisotropies within the SRT temperature range and thereby broadens the stability range of the $\\Gamma_{12}$ phase in the magnetic phase diagram.", "url": "https://arxiv.org/abs/2608.16348", "type": "数值", "summary": "在这项工作中，我们报告了取代系列 HoFe$_{1-x}$Al$_x$O$_3$ 的单晶的首次生长，其中铝浓度高达 $x=0.2$，并研究了其自发自旋重定向跃迁 (SRT) 的演化。在稀土正铁氧体中，HoFeO$_3$ 表现出独特的磁相序列 ($\\Gamma_4$-$\\Gamma_{24}$-$\\Gamma_{12}$-$\\Gamma_2$)。这个复杂的序列源于与 Ho$^{3+}$ 离子相关的 $K_{ac}$ 和 $K_{ab}$ 各向异性与倾斜 Fe$^{3+}$ 亚晶格的弱铁磁矩产生的有效磁场之间的竞争。引入磁空位会扰乱 $ab$ 平面中 Fe$^{3+}$ 子系统的反铁磁补偿，并产生作用于 Ho$^{3+}$ 离子的额外有效磁场。该场改变了 SRT 温度范围内 $K_{ac}$ 和 $K_{ab}$ 各向异性之间的平衡，从而拓宽了磁相图中 $\\Gamma_{12}$ 相的稳定范围。", "authors": [{"name": "S. A. Skorobogatov"}, {"name": "V. A. Babkina"}, {"name": "M. S. Pavlovskii"}, {"name": "M. I. Kolkov"}, {"name": "S. V. Semenov"}, {"name": "I. N. Khoroshiy"}, {"name": "S. E. Nikitin"}, {"name": "K. A. Shaykhutdinov"}], "featured_authors": [{"name": "S. A. Skorobogatov"}, {"name": "V. A. Babkina"}, {"name": "M. S. Pavlovskii"}, {"name": "I. N. Khoroshiy"}, {"name": "S. E. Nikitin"}, {"name": "K. A. Shaykhutdinov"}], "author_count": 8}, {"id": "2608.16350", "category": "cond-mat", "title": "Theory of Magnetic Excitations in the Heavy-Fermion Spin-Triplet Superconductor UTe$_2$", "abstract": "We study the dynamical spin response of UTe$_2$ by using a mixed-dimensional periodic Anderson model. Within the BCS-RPA formalism, we examine how the $f$-orbital character of the quasiparticles affects magnetic excitations in both the normal and superconducting (SC) states. In the normal state, finite mixing between localized $f$ electrons and conduction electrons produces a hybridization gap and enhances the spin response at $\\mathbf{Q}_{\\mathrm{Y}} = (0,\\pi,0)$, indicating that the magnetic excitation originates from particle--hole scattering across the hybridization gap. In the SC state, we compare four odd-parity irreducible representations, $A_u$, $B_{1u}$, $B_{2u}$, and $B_{3u}$, for the spin-triplet order parameter. We find that, for the component of the spin susceptibility parallel to the $\\mathbf{d}$ vector, a pronounced superconductivity-induced spin resonance appears at $\\mathbf{Q}_{\\mathrm{Y}}$ only in the $B_{2u}$ state. This behavior arises because the $B_{2u}$ order parameter remains finite and changes its sign between the relevant $f$-electron-dominated Fermi-surface regions connected by $\\mathbf{Q}_\\mathrm{Y}$ near $k_z=\\pi$. The sign-change criterion is applicable to multiband superconductors in three-dimensional heavy-fermion systems, in the presence of (i) low-dimensional portions of the Fermi surface connected by a nesting vector, (ii) the dominance of the $f$-electron character, and (iii) the finite amplitude of SC gap on the portions.", "url": "https://arxiv.org/abs/2608.16350", "type": "理论", "summary": "我们使用混合维周期性安德森模型研究了 UTe$_2$ 的动态自旋响应。在 BCS-RPA 形式中，我们研究了准粒子的 $f$ 轨道特征如何影响正常状态和超导 (SC) 状态下的磁激发。在正常状态下，局域$f$电子和传导电子之间的有限混合会产生杂化间隙，并增强$\\mathbf{Q}_{\\mathrm{Y}} = (0,\\pi,0)$处的自旋响应，表明磁激发源自穿过杂化间隙的粒子-空穴散射。在 SC 状态下，我们比较自旋三重态序参数的四种奇宇称不可约表示：$A_u$、$B_{1u}$、$B_{2u}$ 和 $B_{3u}$。我们发现，对于与$\\mathbf{d}$向量平行的自旋磁化率分量，仅在$B_{2u}$状态下$\\mathbf{Q}_{\\mathrm{Y}}$处出现明显的超导引起的自旋共振。出现这种行为的原因是 $B_{2u}$ 阶次参数保持有限，并且在 $k_z=\\pi$ 附近由 $\\mathbf{Q}_\\mathrm{Y}$ 连接的相关 $f$ 电子主导费米面区域之间的符号发生变化。\n\n符号变化准则适用于三维重费米子系统中的多带超导体，存在以下情况：(i) 由嵌套向量连接的费米表面的低维部分，(ii) $f$ 电子特征的主导地位，以及 (iii) 这些部分上 SC 能隙的有限振幅。", "authors": [{"name": "Koki Shimura"}, {"name": "Shuntaro Sumita"}, {"name": "Yusuke Kato"}], "featured_authors": [{"name": "Koki Shimura"}, {"name": "Shuntaro Sumita"}, {"name": "Yusuke Kato"}], "author_count": 3}, {"id": "2608.16368", "category": "cond-mat", "title": "Optical Response Beyond Magnetic Symmetries", "abstract": "The optical response of magnetic materials is conventionally classified through magnetic space groups (MSGs), where spin and lattice are locked by the relativistic spin-orbit interaction. However, most optical observables are governed primarily by nonrelativistic physics, and thus a purely MSG-based description can overlook important insights. Here we systematically show that spin-space groups (SSGs), which operate at the nonrelativistic level, provide a broader and more predictive framework for analyzing a variety of optical responses of magnets. Focusing on linear optical absorption, we derive the transformation rules imposed by SSGs and show that they generate effective real-space point groups, which can enforce relations among charge response coefficients that are absent from conventional MSG analysis. We illustrate the basic principle in a Lieb-lattice altermagnet model with tunable spin-orbit coupling, where SSG predictions on the linear dichroism remain remarkably accurate even when relativistic band splittings become sizable. We further establish the predictive power of this framework through first-principles calculations on two altermagnetic candidates: the actinide UCr2Si2C, where the optical absorption remains nearly isotropic despite its strong spin-orbit coupling and the pronounced anisotropy apparent from magnetic symmetries, and the transition-metal fluoride RbMnF4, where birefringence is confined to a single plane by symmetries emerging exclusively from SSGs. Finally, we extend the concept to the spin Hall response of the coplanar noncollinear antiferromagnet ScMnO3, where SSGs explain the hierarchy of calculated spin Hall coefficients, d
