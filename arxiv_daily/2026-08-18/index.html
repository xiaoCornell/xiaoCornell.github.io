featured_authors": [{"name": "Naoto Kan"}, {"name": "Masashi Kawahira"}, {"name": "Hiroki Wada"}], "author_count": 3}, {"id": "2608.16579", "category": "hep-th", "title": "Chiral Soliton Lattices under Magnetic Fields and Rotation: a Holographic Analysis", "abstract": "We study the chiral soliton lattice (CSL) in rotating QCD matter under a background magnetic field within holographic QCD. We show that rotation can be incorporated as a background gauge field and that the CSL in rotating matter becomes a ground state in the gravity dual. We also provide a brane interpretation of the CSL under a magnetic field and rotation. Solving the bulk equations, we derive an effective Hamiltonian where the meson decay constant $\\tilde{f}$ emerges as an anisotropic, field-dependent matrix. Furthermore, we discuss the thermodynamic properties of the ground state in rotating matter and study its equation of state.", "url": "https://arxiv.org/abs/2608.16579", "type": "理论", "summary": "我们研究全息 QCD 内背景磁场下旋转 QCD 物质中的手性孤子晶格 (CSL)。我们证明旋转可以作为背景规范场并入，并且旋转物质中的 CSL 成为重力对偶中的基态。我们还提供了磁场和旋转下 CSL 的膜解释。求解体方程，我们推导出一个有效的哈密顿量，其中介子衰变常数 $\\tilde{f}$ 表现为各向异性、场相关矩阵。此外，我们讨论了旋转物质中基态的热力学性质并研究了其状态方程。", "authors": [{"name": "Markus A. G. Amano"}, {"name": "Minoru Eto"}, {"name": "Muneto Nitta"}, {"name": "Shin Sasaki"}], "featured_authors": [{"name": "Markus A. G. Amano"}, {"name": "Minoru Eto"}, {"name": "Muneto Nitta"}, {"name": "Shin Sasaki"}], "author_count": 4}, {"id": "2608.16772", "category": "hep-th", "title": "The linear dilaton in cosmology and particle physics", "abstract": "A warped extra dimension in a five-dimensional (5D) anti de Sitter (AdS) background was introduced in 1999 by Lisa Randall and Raman Sundrum to solve the gauge hierarchy problem in particle physics. As a bonus, a holographic interpretation in terms of four dimensional (4D) conformal field theories (CFT) was found. Interestingly enough, another 5D background, the linear dilaton (LD), was found to have a holographic interpretation in terms of Little String Theory. In this review we will show how a set of 5D backgrounds, parametrized in terms of a real parameter $\\nu$, generalizes both theories and gives rise, in particular, to AdS for $\\nu=0$ and to LD for $\\nu=1$. Furthermore, working in the 5D theory, we will consider applications of the LD background to: i) Particle Physics, so that the 5D Planck scale can be lowered to sub-Planckian values, ii) Brane World Cosmology (BWC), based on the appearance of an extra vacuum characterized by a 5D black hole. In all cases we find a gapped continuum for bulk propagating fields, which makes connection with unparticles. In the case of BWC we also point out on the existence of a pressureless holographic fluid which could play the role of dark matter (DM), with feeble (gravitational) interactions to the Standard Model (SM), decoupled from the thermal SM bath, and generated by a freeze-in mechanism after inflation. We also point out the additional possibility of identifying DM with a long-lived feebly interacting massive graviton, as an isolated resonance generated by radiative corrections to the continuum graviton propagator self-energy.", "url": "https://arxiv.org/abs/2608.16772", "type": "理论", "summary": "Lisa Randall 和 Raman Sundrum 于 1999 年引入了五维 (5D) 反德西特 (AdS) 背景中的扭曲额外维度，以解决粒子物理学中的规范层次问题。作为奖励，我们发现了四维 (4D) 共形场论 (CFT) 的全息解释。有趣的是，另一种 5D 背景，即线性膨胀 (LD)，被发现具有小弦理论的全息解释。在这篇综述中，我们将展示一组以实参数 $\\nu$ 为参数的 5D 背景如何概括这两种理论，并特别产生 $\\nu=0$ 的 AdS 和 $\\nu=1$ 的 LD。此外，在 5D 理论中，我们将考虑 LD 背景的应用：i) 粒子物理学，以便 5D 普朗克尺度可以降低到亚普朗克值，ii) 膜世界宇宙学 (BWC)，基于以 5D 黑洞为特征的额外真空的出现。在所有情况下，我们都发现体传播场有一个有隙连续体，它与非粒子建立了联系。\n\n就 BWC 而言，我们还指出存在一种无压全息流体，它可以起到暗物质 (DM) 的作用，与标准模型 (SM) 具有微弱的（引力）相互作用，与热 SM 浴解耦，并由膨胀后的冻结机制产生。我们还指出了用长寿命的微弱相互作用的大质量引力子识别 DM 的额外可能性，作为对连续介质引力子传播器自能的辐射校正产生的孤立共振。", "authors": [{"name": "Eugenio Megias"}, {"name": "Mariano Quiros"}], "featured_authors": [{"name": "Eugenio Megias"}, {"name": "Mariano Quiros"}], "author_count": 2}, {"id": "2608.16781", "category": "hep-th", "title": "Higher spin dynamics in Weyl reference frame", "abstract": "In this manuscript we derive the $w_{1+\\infty}$ algebra on an arbitrary null hypersurface located at finite distance. A straightforward integration of the evolution Bianchi identities is performed in a suitable dynamical reference frame, dubbed the Weyl reference frame. In this reference frame, the extraction of the (linear) higher spin charge bracket is similar to the asymptotic null case, except that the corner metric evolves non trivially in time. In other words, boundary degrees of freedom that are frozen at null infinity due to the boundary conditions now become part of the dynamics. This feature is reflected in the appearance of non-local terms in the brackets. In order to avoid the presence of these non-local terms in the charge bracket, we absorb this non-locality - which encodes nothing other than the history of the corner metric - into the definition of the higher spin charges. Moreover, a new perspective on the memory effect at finite distance is suggested. In conclusion, we believe that this treatment can also be applied to asymptotically (A)dS$_{4}$ spacetimes, where the presence of a non-vanishing cosmological constant leads to the introduction of a cosmological reference frame.", "url": "https://arxiv.org/abs/2608.16781", "type": "理论", "summary": "在这份手稿中，我们在位于有限距离的任意零超曲面上推导 $w_{1+\\infty}$ 代数。演化 Bianchi 恒等式的直接积分是在合适的动态参考系（称为 Weyl 参考系）中执行的。在此参考系中，（线性）较高自旋电荷括号的提取与渐近零情况类似，只是角度量随时间不平凡地演化。换句话说，由于边界条件而冻结在零无穷大的边界自由度现在成为动力学的一部分。这一特征体现在括号中非局部术语的出现上。为了避免电荷括号中出现这些非局部项，我们将这种非局部性（除了角度量的历史之外不编码任何内容）吸收到较高自旋电荷的定义中。此外，还提出了有限距离记忆效应的新视角。\n\n总之，我们相信这种处理也可以应用于渐近 (A)dS$_{4}$ 时空，其中非零宇宙学常数的存在导致引入宇宙学参考系。", "authors": [{"name": "Gianfranco De Simone"}], "featured_authors": [{"name": "Gianfranco De Simone"}], "author_count": 1}, {"id": "2608.14699", "category": "math-ph", "title": "Integrability of Hamiltonian systems on COLCS Manifold", "abstract": "We develop an integrability framework for Hamiltonian dynamics on \\emph{con-locally conformal symplectic} (COLCS) manifolds, odd-dimensional quadruples $(M,\\Omega,\\theta,\\eta)$ where $d\\Omega=\\theta\\wedge\\Omega$, a closed $1$-form $\\eta$ determines a codimension-one distribution on which $\\Omega$ is non-degenerate, and $R$ is the Reeb vector field satisfying $\\iota_R\\Omega=\\iota_R\\theta=0$, $\\iota_R\\eta=1$. This class simultaneously generalises LCS and cosymplectic manifolds and provides a natural arena for time-dependent Hamiltonian systems with twisted differential $d^\\theta=d-\\theta\\wedge$. The COLCS bracket is introduced on $C^\\infty(M)$ and shown to be a Lie bracket that induces Poisson structures on the subalgebras of $\\theta$-strong ($\\theta(X_H)=0$) and $R$-strong ($R(H)=0$) functions. A Lie-type integrability theorem is then established: given $2n-k$ functionally independent first integrals with $k$ of them $\\theta$-strong and generating a solvable Lie algebra under the COLCS bracket, the flow is integrable by quadratures on the common level set. Finally, scaling symmetries of degree $(\\Lambda,\\beta,\\gamma)$, defined by $L_X\\Omega=\\beta\\Omega$, $L_XH=\\Lambda H$, $L_X\\eta=\\gamma\\eta$, are studied: they rescale $X_H$ by $(\\Lambda-\\beta)$, generate families of first integrals, and imply structural primitives for $\\Omega$ and $\\eta$.", "url": "https://arxiv.org/abs/2608.14699", "type": "理论", "summary": "我们在\\emph{con局部共形辛}（COLCS）流形、奇维四元组$(M,\\Omega,\\theta,\\eta)$上开发了哈密顿动力学的可积性框架，其中$d\\Omega=\\theta\\wedge\\Omega$，封闭的$1$形式$\\eta$确定了一个余维一分布，其中$\\Omega$是非简并的，并且$R$是满足 $\\iota_R\\Omega=\\iota_R\\theta=0$、$\\iota_R\\eta=1$ 的 Reeb 向量场。该类同时推广了 LCS 和余辛流形，并为具有扭曲微分 $d^\\theta=d-\\theta\\wedge$ 的时间相关哈密顿系统提供了一个自然的舞台。 COLCS 括号是在 $C^\\infty(M)$ 上引入的，它是一个李括号，可在 $\\theta$-strong ($\\theta(X_H)=0$) 和 $R$-strong ($R(H)=0$) 函数的子代数上导出泊松结构。然后建立李型可积定理：给定 $2n-k$ 功能独立的第一积分，其中 $k$ 为 $\\theta$-strong，并在 COLCS 括号下生成可解的李代数，流可通过公共水平集上的求积进行积分。\n\n最后，研究由 $L_X\\Omega=\\beta\\Omega$、$L_XH=\\Lambda H$、$L_X\\eta=\\gamma\\eta$ 定义的度 $(\\Lambda,\\beta,\\gamma)$ 的缩放对称性：它们通过 $(\\Lambda-\\beta)$ 重新缩放 $X_H$，生成第一积分族，并隐含 $\\Omega$ 和 $\\eta$ 的结构基元。", "authors": [{"name": "Antonio J. Pan-Collantes"}, {"name": "Xuefeng Zhao"}], "featured_authors": [{"name": "Antonio J. Pan-Collantes"}, {"name": "Xuefeng Zhao"}], "author_count": 2}, {"id": "2608.14946", "category": "math-ph", "title": "On Physical Components of Tensors in Elasticity and Inelasticity", "abstract": "Widely used in mechanics and mathematical physics, physical components remove the inherent coordinate-dependent scaling in curvilinear coordinates, yielding components of consistent physical dimension. In orthogonal coordinates, they are constructed by normalizing the coordinate frame and coframe; in general coordinates, however, their construction requires additional, non-trivial choices. In this paper, we extract physical components of arbitrary tensors on arbitrary Riemannian manifolds by orthonormalization of the coordinate frame. We further formulate a general normalization framework distinguishing three requirements: dimensional consistency, dual frame-coframe compatibility, and unit normalization. We show that dimensional consistency alone leaves independent general linear gauge freedoms for the contravariant and covariant components. Further requiring dual compatibility locks these into a single general linear gauge; a dual-compatible frame and coframe are both of unit length if and only if they are orthonormal. Thus, the choice of orthonormal transformations emerges as the only physical-components framework that satisfies all three requirements. We apply this framework to nonlinear elasticity and inelasticity, referring broadly to constitutive responses involving internal distortions, of which we study anelasticity, viscoelasticity, and visco-anelasticity. We examine the deformation gradient, inelastic distortions, strain measures, and stress tensors. We conclude by arguing that physical components remain neither intrinsic nor unique.", "url": "https://arxiv.org/abs/2608.14946", "type": "理论", "summary": "物理组件广泛应用于力学和数学物理中，消除了曲线坐标中固有的依赖于坐标的缩放，从而产生物理尺寸一致的组件。在正交坐标系中，它们是通过对坐标系和辅助系进行归一化来构造的；然而，在一般坐标中，它们的构造需要额外的、重要的选择。在本文中，我们通过坐标系的正交化来提取任意黎曼流形上的任意张量的物理分量。我们进一步制定了一个通用的标准化框架，区分了三个要求：维度一致性、双框架-共框架兼容性和单位标准化。我们证明，仅尺寸一致性就为逆变和协变分量留下了独立的一般线性规范自由度。进一步要求双重兼容性将这些锁定到单个通用线性仪表中；双兼容帧和协同帧当且仅当它们是正交的时都是单位长度。因此，正交变换的选择成为满足所有三个要求的唯一物理组件框架。\n\n我们将该框架应用于非线性弹性和非弹性，广泛指涉及内部扭曲的本构响应，其中我们研究迟弹性、粘弹性和粘弹性。我们检查变形梯度、非弹性变形、应变测量和应力张量。我们的结论是，物理成分既不是内在的，也不是唯一的。", "authors": [{"name": "Souhayl Sadik"}, {"name": "Arash Yavari"}], "featured_authors": [{"name": "Souhayl Sadik"}, {"name": "Arash Yavari"}], "author_count": 2}, {"id": "2608.15801", "category": "math-ph", "title": "Quantized Bertrand models on two-dimensional spaces of constant curvature", "abstract": "Discussed are Bertrand systems on two-dimensional spaces of constant curvature, i.e. sphere and pseudosphere (Lobachevsky space). These models often involve applying quantization techniques, such as those based on the Laplace-Beltrami operator, to the classical models and analyzing the resulting quantum behavior.", "url": "https://arxiv.org/abs/2608.15801", "type": "理论", "summary": "讨论的是常曲率二维空间（即球面和伪球面（洛巴切夫斯基空间））上的伯特兰系统。这些模型通常涉及将量化技术（例如基于 Laplace-Beltrami 算子的技术）应用于经典模型并分析由此产生的量子行为。", "authors": [{"name": "Agnieszka Martens"}], "featured_authors": [{"name": "Agnieszka Martens"}], "author_count": 1}, {"id": "2608.16501", "category": "math-ph", "title": "Symmetry-Fixed Holonomies and Spectral Isolation in Two-Cycle Photonic Geometries A Square Parent Manifold for a Qubit and a Hexagonal Qutrit Manifold", "abstract": "A system with two periodic directions carries two commuting holonomies \\(a=(u,v)\\in\\R^2/\\Z^2\\). We determine their distinguished values while separating lattice, arithmetic, and observable effects. Maximizing the lowest twisted eigenvalue places \\(a\\) at a deep hole of the momentum lattice. For every rectangular torus the maximizer is antiperiodic, so complex multiplication is sufficient for torsion optima but not necessary. Let \\(G_\\tau^{-1}\\) be the dual metric and \\(D_\\tau(a)\\) the normalized zeta determinant of the twisted Laplacian. At the rotation-fixed deep holes of the square and hexagonal lattices, symmetry gives the exact determinant response \\(-\\operatorname{Hess}_a\\log D_\\tau=2\\pi(\\Im\\tau)G_\\tau^{-1}\\). With spectral wavenumber \\(\\kappa=2\\pi\\), the lowest manifolds are fourfold and threefold, with gaps \\(2\\kappa^2\\) and \\(4\\kappa^2/3\\); phase errors split them linearly while their centroids remain stationary. We then give a finite-device realization: an \\(8\\times8\\) microring lattice closed by two phase-controlled seams. At a reported coupling scale of \\(16\\) GHz, its exact square-lattice spectrum has a \\(17.32\\) GHz shell gap and a \\(1.92\\) GHz doublet separation for a \\(0.1\\) holonomy error; a triangular-link configuration gives a threefold qutrit manifold with an \\(18.11\\) GHz gap. This is a quantitative spectroscopy proposal, not a claim of topological protection or a completed device.", "url": "https://arxiv.org/abs/2608.16501", "type": "理论", "summary": "具有两个周期方向的系统具有两个交换完整函数 \\(a=(u,v)\\in\\R^2/\\Z^2\\)。我们在分离晶格、算术和可观察效应的同时确定它们的区别值。最大化最低扭曲特征值将 \\(a\\) 放置在动量晶格的深孔处。对于每个矩形环面，最大化器都是反周期的，因此复数乘法足以实现扭转最优，但不是必需的。令\\(G_\\tau^{-1}\\) 为对偶度量，\\(D_\\tau(a)\\) 为扭曲拉普拉斯算子的归一化zeta 行列式。在方形和六角形晶格的旋转固定深孔处，对称性给出了精确的行列式响应 \\(-\\operatorname{Hess}_a\\log D_\\tau=2\\pi(\\Im\\tau)G_\\tau^{-1}\\)。对于谱波数 \\(\\kappa=2\\pi\\)，最低流形是四重和三重，间隙为 \\(2\\kappa^2\\) 和 \\(4\\kappa^2/3\\)；相位误差将它们线性分割，而它们的质心保持静止。然后我们给出一个有限器件实现：一个由两个相控接缝封闭的 \\(8\\times8\\) 微环晶格。\n\n在报告的耦合尺度为 \\(16\\) GHz 时，其精确的方晶格频谱具有 \\(17.32\\) GHz 壳间隙和 \\(1.92\\) GHz 双峰间隔，且完整误差为 \\(0.1\\)；三角形链接配置给出了具有 \\(18.11\\) GHz 间隙的三重 qutrit 流形。这是一个定量光谱学建议，而不是拓扑保护或完整装置的主张。", "authors": [{"name": "Michel Planat"}], "featured_authors": [{"name": "Michel Planat"}], "author_count": 1}, {"id": "2608.16727", "category": "math-ph", "title": "Asymptotic analysis of a Fredholm determinant occurring in the description of the dynamical correlation functions of the Lieb--Liniger Bose gas", "abstract": "We perform a large-$x$ asymptotic analysis of the Fredholm determinant of an integrable integral operator with generalized sine kernel, where $x$ controls the strength of the oscillations along the integration contour of the operator and will play the role of the distance variable in applications to the correlation functions of integrable quantum systems. Our generalized sine kernel involves a number of functional parameters that will allow us to adapt it to the analysis of the dynamical correlation functions of the Lieb--Liniger model at finite temperature and for all positive values of the coupling constant. It will also allow us to consider a class of equilibrium correlation functions that are governed by generalized Gibbs ensembles. Our work is based on the analysis of a matrix Riemann--Hilbert problem that is canonically connected with our integrable integral operator.", "url": "https://arxiv.org/abs/2608.16727", "type": "理论", "summary": "我们对具有广义正弦核的可积积分算子的 Fredholm 行列式进行大 $x$ 渐近分析，其中 $x$ 控制沿算子积分轮廓的振荡强度，并将在可积量子系统的相关函数的应用中发挥距离变量的作用。我们的广义正弦核涉及许多函数参数，这些参数将使我们能够使其适应有限温度下和耦合常数的所有正值的 Lieb-Liniger 模型的动态相关函数的分析。它还允许我们考虑一类由广义吉布斯系综控制的平衡相关函数。我们的工作基于对矩阵黎曼-希尔伯特问题的分析，该问题与我们的可积积分算子规范地相关。", "authors": [{"name": "Frank Göhmann"}, {"name": "Karol K. Kozlowski"}, {"name": "Mikhail D. Minin"}], "featured_authors": [{"name": "Frank Göhmann"}, {"name": "Karol K. Kozlowski"}, {"name": "Mikhail D. Minin"}], "author_count": 3}, {"id": "2608.14807", "category": "quant-ph", "title": "Multicolor nonlinear chiral quantum optics: beyond phase", "abstract": "Chiral quantum nonlinearities that arise when light interacts with quantum emitters are known to modulate only the phase but not the amplitude of scattered photons, enabling the creation of non-reciprocal photonic elements, quantum logic gates, and quantum network protocols. In this work, we show that the addition of a second photon beam drastically changes this picture, enabling both phase and amplitude modulation. Surprisingly, coherent photon transfer between the different beams enables a stronger amplitude modulation than standard symmetric interactions. This is most obvious in the coherent, three-photon amplification, which we predict peaks with a 30% efficiency in a chiral geometry, 3x the efficiency of the symmetric configuration. Our results uncover a new regime of chiral quantum optics and provide a route towards more efficient all-optical control at few-photon energies.", "url": "https://arxiv.org/abs/2608.14807", "type": "理论", "summary": "已知光与量子发射器相互作用时产生的手性量子非线性仅调制散射光子的相位，而不调制散射光子的振幅，从而能够创建非互易光子元件、量子逻辑门和量子网络协议。在这项工作中，我们表明，添加第二个光子束会极大地改变这一情况，从而实现相位和幅度调制。令人惊讶的是，不同光束之间的相干光子转移能够实现比标准对称相互作用更强的幅度调制。这在相干三光子放大中最为明显，我们预测手性几何结构中的峰值效率为 30%，是对称构型效率的 3 倍。我们的结果揭示了手性量子光学的新机制，并提供了一条在少光子能量下实现更有效的全光控制的途径。", "authors": [{"name": "Cedric Dufresne"}, {"name": "Annabelle Makowski"}, {"name": "Nir Rotenberg"}], "featured_authors": [{"name": "Cedric Dufresne"}, {"name": "Annabelle Makowski"}, {"name": "Nir Rotenberg"}], "author_count": 3}, {"id": "2608.14818", "category": "quant-ph", "title": "Geometric signatures of the onset of many-body ergodicity", "abstract": "Identifying universal, robust, and interpretable signatures of the onset of ergodicity remains a major challenge. The adiabatic gauge potential has been noted to act as a sensitive probe of quantum chaos. In this work, we generalize the features of the adiabatic gauge potential to multi-parameter perturbations, yielding an emergent quantum geometry. We dub this geometry the Hilbert-Killing metric, which allows us to study the onset of ergodicity in many-body quantum systems. Our Hilbert-Killing metric sensitively probes the boundary between ergodic and integrable regimes across all investigated geometric components. This boundary is uniquely identified by the presence of the consistently fastest growth with system size, which is corroborated by extensive numerical investigations of the Ising and PXP models.", "url": "https://arxiv.org/abs/2608.14818", "type": "理论+数值", "summary": "识别遍历性开始的普遍的、稳健的和可解释的特征仍然是一个重大挑战。人们注意到绝热规范势可以作为量子混沌的敏感探针。在这项工作中，我们将绝热规范势的特征推广到多参数扰动，从而产生了新兴的量子几何。我们将这种几何学称为希尔伯特-基林度量，它使我们能够研究多体量子系统中遍历性的开始。我们的希尔伯特-基林度量敏感地探索了所有研究的几何组件的遍历和可积体系之间的边界。这一边界的唯一确定是系统规模始终保持最快的增长，这一点已通过 Ising 和 PXP 模型的广泛数值研究得到证实。", "authors": [{"name": "Chris Ventura-Meinersen"}, {"name": "Edmondo Valvo"}, {"name": "Stefano Bosco"}, {"name": "Francisco Machado"}, {"name": "Maximilian Rimbach-Russ"}], "featured_authors": [{"name": "Chris Ventura-Meinersen"}, {"name": "Edmondo Valvo"}, {"name": "Stefano Bosco"}, {"name": "Francisco Machado"}, {"name": "Maximilian Rimbach-Russ"}], "author_count": 5}, {"id": "2608.14871", "category": "quant-ph", "title": "Chiral Nonlinear Optics and Optical Control", "abstract": "Chiral light-matter interactions lie at the heart of emerging technologies such as quantum network protocols and quantum logic gates. In the few photon regime, it has been shown that chiral interactions between photons and a waveguide-embedded two-level quantum emitter can break reciprocity and impart a directional $\\pi$ phase shift while the transmission remains intact. In this work, we present a model for multicolor, chiral nonlinear interactions in waveguides using a Green's Tensor formalism. We challenge previously held notions and demonstrate the complex photon dynamics hidden in multicolor light-matter interactions in the few photon regime. By modulating a stronger control beam, we can manipulate a weaker signal beam that contains much less than a single photon per emitter lifetime, on average. We develop equations for the transmission of the signal photons and removing the control photons to uncover the true strength of these nonlinearities, which we show is stronger than what is possible in symmetric geometries. The model predicts tunable unity extinction and up to 30% amplification in the signal, a $\\sim$100x increase from standard predictions in which control photons are present. We also predict a tunable 0-$\\pi$ phase shift via control modulation with significant robustness to emitter imperfections. Our model opens a new regime of directional nonlinear quantum light-matter interactions for study, providing a route to efficient all-optical control of photons.", "url": "https://arxiv.org/abs/2608.14871", "type": "理论", "summary": "手性光与物质相互作用是量子网络协议和量子逻辑门等新兴技术的核心。在少光子状态下，事实证明，光子和波导嵌入的两级量子发射器之间的手性相互作用可以打破互易性，并在传输保持完好的情况下产生定向 $\\pi$ 相移。在这项工作中，我们使用格林张量形式提出了波导中多色手性非线性相互作用的模型。我们挑战了以前的观念，并证明了隐藏在少数光子状态下的多色光与物质相互作用中的复杂光子动力学。通过调制更强的控制光束，我们可以操纵更弱的信号光束，平均而言，该信号光束在每个发射器寿命中包含的光子要少得多。我们开发了信号光子传输方程并去除控制光子，以揭示这些非线性的真实强度，我们证明这种非线性比对称几何中可能的强度更强。\n\n该模型预测可调谐统一消光和高达 30% 的信号放大，比存在控制光子的标准预测增加了 $\\sim$100 倍。我们还预测通过控制调制可调节 0-$\\pi$ 相移，并且对发射器缺陷具有显着的鲁棒性。我们的模型开辟了定向非线性量子光与物质相互作用的新研究领域，为光子的高效全光控制提供了一条途径。", "authors": [{"name": "Cedric Dufresne"}, {"name": "Annabelle Makowski"}, {"name": "Nir Rotenberg"}], "featured_authors": [{"name": "Cedric Dufresne"}, {"name": "Annabelle Makowski"}, {"name": "Nir Rotenberg"}], "author_count": 3}, {"id": "2608.14872", "category": "quant-ph", "title": "Minimality of the Pure Qubit ZX Calculus", "abstract": "The ZX calculus is a graphical language for reasoning about quantum processes. In this paper, we develop a minimal pure-qubit ZX calculus based on the work of Vilmart [ arXiv:1812.09114 ], Backens, Perdrix, and Wang [ arXiv:1709.08903 ], and Stoltz [ arXiv:2606.12383 ]. This resolves a problem that has remained open for nearly a decade, since completeness was first proved. Specifically, we show that $(I_r)$ is derivable and establish the necessity of $(B)$ and $(I_g)$, yielding two complete and minimal rulesets.", "url": "https://arxiv.org/abs/2608.14872", "type": "理论", "summary": "ZX 演算是一种用于推理量子过程的图形语言。在本文中，我们基于 Vilmart [ arXiv:1812.09114 ]、Backens、Perdrix 和 Wang [ arXiv:1709.08903 ] 以及 Stoltz [ arXiv:2606.12383 ] 的工作开发了一种最小的纯量子位 ZX 演算。这解决了自首次证明完整性以来近十年来一直悬而未决的问题。具体来说，我们证明 $(I_r)$ 是可导的，并建立 $(B)$ 和 $(I_g)$ 的必要性，产生两个完整且最小的规则集。", "authors": [{"name": "Harry K. Stoltz"}, {"name": "Renaud Vilmart"}], "featured_authors": [{"name": "Harry K. Stoltz"}, {"name": "Renaud Vilmart"}], "author_count": 2}, {"id": "2608.14966", "category": "quant-ph", "title": "Floquet-Liouville Theory for Strongly Driven Open Quantum Systems", "abstract": "Periodically driven quantum systems are commonly modeled using master equations constructed in the eigenbasis of an undriven Hamiltonian, implicitly assuming that environmental dissipation couples to static energy transitions even under strong time-periodic driving. The validity of this approximation beyond weak or near-resonant driving remains poorly understood. To address the need for a more self-consistent quantum theory approach, we formulate a nonsecular Floquet--Markov generalized master equation (F-GME) in the quasienergy basis, treating interaction-induced (internal) and drive-induced (external) nonperturbative dressing on an equal footing. We subsequently investigate dissipation in two minimal driven open quantum systems---a harmonically driven two-level system and a harmonically driven coupled-two-level-system---each weakly coupled to a Markovian bath. Comparing the F-GME to a time-independent dressed-basis master equation, we show that even for a flat-bath spectral density and weak dissipation, the two approaches can yield qualitatively different steady-state populations and emission spectra. We resolve dissipation into drive-assisted sideband processes decaying via Floquet extended-space quasienergy channels, and show these channels can hybridize through nonsecular couplings into collective Floquet--Liouville modes governing observable spectral resonances. This analysis demonstrates that time-independent dissipative descriptions can incorrectly weight multiphoton Floquet transitions by collapsing quasienergy-resolved decay pathways into static energy gaps. The F-GME framework provides a systematic diagnostic for identifying regimes where Floquet-consistent dissipation is essential and clarifies the physical origin of discrepancies between commonly used master-equation approaches.", "url": "https://arxiv.org/abs/2608.14966", "type": "理论+数值", "summary": "周期性驱动的量子系统通常使用在非驱动哈密顿量的本征基础上构建的主方程进行建模，隐含地假设即使在强时间周期驱动下环境耗散也会与静态能量跃迁耦合。这种近似在弱或近共振驱动之外的有效性仍然知之甚少。为了满足对更自洽的量子理论方法的需求，我们在准能量基础上制定了非世俗 Floquet-Markov 广义主方程（F-GME），平等地对待相互作用引起的（内部）和驱动引起的（外部）非微扰修饰。随后，我们研究了两个最小驱动开放量子系统中的耗散——一个谐波驱动的两能级系统和一个谐波驱动的耦合两能级系统——每个系统都弱耦合到马尔可夫浴。将 F-GME 与时间无关的修饰基主方程进行比较，我们表明，即使对于平浴谱密度和弱耗散，这两种方法也可以产生性质不同的稳态布居和发射光谱。\n\n我们将耗散解析为通过 Floquet 扩展空间准能量通道衰减的驱动辅助边带过程，并表明这些通道可以通过非长期耦合混合成控制可观测光谱共振的集体 Floquet-Liouville 模式。该分析表明，与时间无关的耗散描述可以通过将准能量分辨的衰变路径塌陷为静态能隙来错误地对多光子 Floquet 跃迁进行加权。 F-GME 框架提供了系统诊断，用于识别 Floquet 一致耗散至关重要的状态，并澄清了常用主方程方法之间差异的物理根源。", "authors": [{"name": "Kamran Akbari"}, {"name": "Stephen Hughes"}], "featured_authors": [{"name": "Kamran Akbari"}, {"name": "Stephen Hughes"}], "author_count": 2}, {"id": "2608.14981", "category": "quant-ph", "title": "Qudit-ADAPT-VQE: an adaptive variational algorithm with counterdiabatic-inspired improvements for qudits", "abstract": "Variational quantum algorithms based on qudits have attracted significant attention in recent years. However, as in their qubit-based counterparts, challenges such as barren plateaus and the design of efficient ansatz remain major obstacles. In this work, we propose to address these issues through a qudit implementation of the ADAPT-VQE algorithm, which constructs the ansatz iteratively. Specifically, we introduce an operator pool inspired by adiabatic evolution enhanced with counterdiabatic driving for ansatz construction and employ it to solve Max 3-Cut. We show that the warm-start strategy inherent to ADAPT-VQE, together with an ansatz construction based on counterdiabatic operators, achieves higher accuracy and lower native gates implementation than approaches on fixed ansatz. Furthermore, we show that, in qudit-based quantum computing, ADAPT-VQE with a counterdiabatic operator pool can navigate rough optimization landscapes with local traps through the burrowing mechanism, suggesting robustness against barren plateau effects and providing a scalable framework for variational quantum algorithms with qudits.", "url": "https://arxiv.org/abs/2608.14981", "type": "数值", "summary": "近年来，基于量子的变分量子算法引起了人们的广泛关注。然而，与基于量子比特的同行一样，贫瘠的高原和高效 ansatz 的设计等挑战仍然是主要障碍。在这项工作中，我们建议通过 ADAPT-VQE 算法的 qdit 实现来解决这些问题，该算法迭代地构建 ansatz。具体来说，我们引入了一个受绝热演化启发的算子池，该算子池通过反绝热驱动增强了 ansatz 构造，并用它来解决 Max 3-Cut。我们表明，ADAPT-VQE 固有的热启动策略与基于反绝热算子的 ansatz 结构一起，比固定 ansatz 的方法实现了更高的精度和更低的本机门实现。此外，我们还表明，在基于 qudit 的量子计算中，具有反非绝热算子池的 ADAPT-VQE 可以通过挖掘机制在具有局部陷阱的粗糙优化环境中导航，这表明了针对贫瘠高原效应的鲁棒性，并为带有 qudit 的变分量子算法提供了可扩展的框架。", "authors": [{"name": "Joaquín Molina"}, {"name": "Herbert Díaz-Moraga"}, {"name": "Dardo Goyeneche"}, {"name": "Diego Tancara"}], "featured_authors": [{"name": "Joaquín Molina"}, {"name": "Herbert Díaz-Moraga"}, {"name": "Dardo Goyeneche"}, {"name": "Diego Tancara"}], "author_count": 4}, {"id": "2608.15094", "category": "quant-ph", "title": "An error-mitigated quantum annealing solution for the weighted Max-Cut problem on a cubic lattice", "abstract": "The weighted Max-Cut problem is an NP-hard problem with application implications. It is investigated on a cubic lattice with 113 nodes and mixed-signed random edge weights. For a fixed upper bound on edge weights, it has been demonstrated that the computational difficulty increases as the lower bound on edge weights becomes more negative. The solution time for the problem using a novel error-mitigated quantum annealing approach is compared with standard D-Wave quantum annealing (QA) and BQM hybrid solvers, as well as various classical solvers. For the QPU-embeddable weighted Max-Cut instances with mixed-signed edge weights, it has been quantitatively demonstrated that the SEMO (spin-error mitigation for optimisation) error-mitigated quantum annealing achieved substantially shorter time-to solution than standard D-Wave QA, D-Wave BQM, simulated annealing and Tabu search baselines. The error-mitigated quantum annealing approach presented in this article potentially elevates the efficiency and application scope of quantum annealing and would be applicable in solving other discrete optimisation problems that can be formulated as QUBO or Ising instances. The promising solution time advantage would be particularly impactful for time-critical optimisation applications.", "url": "https://arxiv.org/abs/2608.15094", "type": "理论+数值", "summary": "加权最大割问题是一个具有应用意义的 NP 难题。它是在具有 113 个节点和混合符号随机边权重的立方晶格上进行研究的。对于边权重的固定上限，已经证明，随着边权重的下限变得更负，计算难度增加。将使用新型误差减轻量子退火方法解决问题的时间与标准 D-Wave 量子退火 (QA) 和 BQM 混合求解器以及各种经典求解器进行了比较。对于具有混合符号边权重的 QPU 嵌入式加权 Max-Cut 实例，已经定量证明了 SEMO（优化自旋误差缓解）误差缓解量子退火比标准 D-Wave QA、D-Wave BQM、模拟退火和 Tabu 搜索基线实现了显着更短的求解时间。本文提出的误差减轻量子退火方法可能会提高量子退火的效率和应用范围，并且适用于解决可表示为 QUBO 或 Ising 实例的其他离散优化问题。\n\n有前途的解决方案时间优势对于时间关键的优化应用程序特别有影响。", "authors": [{"name": "Y. S. Yang"}, {"name": "P. Tyson"}, {"name": "A. B Murphy"}], "featured_authors": [{"name": "Y. S. Yang"}, {"name": "P. Tyson"}, {"name": "A. B Murphy"}], "author_count": 3}, {"id": "2608.15161", "category": "quant-ph", "title": "Exact and Efficient Circuit Construction for Block Encoding Matrix Polynomials", "abstract": "We propose a direct and stable circuit compiling algorithm that explicitly and exactly constructs block encodings of matrix polynomials for Hermitian matrices. In a unified framework, our algorithm is directly applicable to both standard input models: block encoding and Hamiltonian simulation. For a target polynomial of degree $d$, our classical algorithm achieves a near-optimal time complexity of $\\mathcal{O}(d\\log d)$. Numerical results confirm this asymptotic scaling for polynomial degrees up to $10^7$ in about a minute on a standard CPU. We achieve this by developing a general-purpose diagonal block encoding of function values, which bridges standard quantum-state preparation techniques with an interpolation-based QSP framework.", "url": "https://arxiv.org/abs/2608.15161", "type": "理论+数值", "summary": "我们提出了一种直接且稳定的电路编译算法，该算法可以显式且准确地构造埃尔米特矩阵的矩阵多项式的块编码。在统一的框架中，我们的算法直接适用于两种标准输入模型：块编码和哈密顿模拟。对于 $d$ 次的目标多项式，我们的经典算法实现了接近最优的时间复杂度 $\\mathcal{O}(d\\log d)$。数值结果证实了在标准 CPU 上大约一分钟内多项式次数达到 10^7$ 的渐近缩放。我们通过开发函数值的通用对角块编码来实现这一目标，它将标准量子态准备技术与基于插值的 QSP 框架联系起来。", "authors": [{"name": "Taehee Ko"}], "featured_authors": [{"name": "Taehee Ko"}], "author_count": 1}, {"id": "2608.15197", "category": "quant-ph", "title": "Equivalence of quantum resources under ergodic dynamics", "abstract": "Quantum resource theories characterize distinct forms of nonclassicality in many-body quantum states, raising the question of whether these resources evolve independently under generic ergodic dynamics. Considering diagnostics quadratic in the state, we show that the dynamics of different resource measures become mutually interdependent and are governed by a few common degrees of freedom. For Haar-random circuits, the purity together with a single resource witness suffices to reconstruct the remaining resource measures, as we demonstrate for coherence, various asymmetries, and number entropies. The same relations hold, to a good approximation, under chaotic Floquet and continuous-time Hamiltonian dynamics, establishing that this dynamical resource equivalence extends beyond random circuits. We further derive an exact coherence--imaginarity relation, remarkably accurate also beyond Haar-random circuits. Our results reveal an emergent simplification of many-body dynamics, in which sufficiently strong scrambling reduces seemingly distinct quantum resources to a few common dynamical degrees of freedom.", "url": "https://arxiv.org/abs/2608.15197", "type": "理论", "summary": "量子资源理论描述了多体量子态中不同形式的非经典性，提出了这些资源是否在通用遍历动力学下独立演化的问题。考虑到国家的二次诊断，我们表明不同资源措施的动态变得相互依赖，并受到一些共同的自由度的控制。对于哈尔随机电路，纯度与单个资源见证足以重建剩余的资源度量，正如我们演示的一致性、各种不对称性和数熵。在混沌 Floquet 和连续时间哈密顿动力学下，相同的关系保持良好的近似，从而确定这种动态资源等价性超出了随机电路。我们进一步推导出精确的相干-虚数关系，其精确度也超出了哈尔随机电路。我们的结果揭示了多体动力学的一种新兴简化，其中足够强的置乱将看似不同的量子资源减少到几个常见的动力学自由度。", "authors": [{"name": "Sreemayee Aditya"}, {"name": "Xhek Turkeshi"}, {"name": "Piotr Sierant"}], "featured_authors": [{"name": "Sreemayee Aditya"}, {"name": "Xhek Turkeshi"}, {"name": "Piotr Sierant"}], "author_count": 3}, {"id": "2608.15237", "category": "quant-ph", "title": "On the zeros of the stellar representation in the discrete cylinder", "abstract": "The discrete cylinder phase space offers a natural setting for twisted photons, Josephson junctions, and certain bosonic codes. In that context, we build a number-of-zeros hierarchy for the stellar distribution of states on the discrete cylinder phase space, tied to usefulness for quantum computation. The orbital angular momentum (OAM) and phase eigenstate, having no zeros, sits at the bottom of the hierarchy and share mathematical properties with the coherent state on the plane phase space, both sharing zero rank and a positive Wigner distribution. This reveals a structural peculiarity of the cylinder: its coherent state---the wrapped coherent state---is instead the most quantum, carrying infinitely many zeros, so \"coherent state\" need not signal classicality across different phase-space geometries. We identify the operations that preserve or change the zero count, giving explicit access to every rank of the hierarchy. We then ask whether this hierarchy also governs localization. Using the $L^r$ norm, the inverse participation ratio, and the Wehrl entropy as complementary measures of spread in the Husimi density, we find that the two hierarchies need not track one another: the wrapped coherent state can be more localized than the OAM eigenstate even though it carries infinitely many zeros.", "url": "https://arxiv.org/abs/2608.15237", "type": "理论", "summary": "离散圆柱相空间为扭曲光子、约瑟夫森结和某些玻色码提供了自然的设置。在这种情况下，我们为离散圆柱相空间上的恒星态分布构建了一个零数层次结构，与量子计算的有用性相关。轨道角动量 (OAM) 和相位本征态没有零点，位于层次结构的底部，并与平面相空间上的相干态共享数学属性，两者共享零阶和正维格纳分布。这揭示了圆柱体的结构特性：它的相干态（包裹相干态）是最量子的，带有无限多个零，因此“相干态”不需要在不同的相空间几何结构中表示经典性。我们确定保留或更改零计数的操作，从而明确访问层次结构的每个等级。然后我们问这个层次结构是否也管理本地化。\n\n使用 $L^r$ 范数、逆参与比和 Wehrl 熵作为 Husimi 密度中扩展的补充度量，我们发现这两个层次结构不需要相互跟踪：包裹的相干态可以比 OAM 本征态更加局部化，即使它带有无限多个零。", "authors": [{"name": "Nicolas Fabre"}], "featured_authors": [{"name": "Nicolas Fabre"}], "author_count": 1}, {"id": "2608.15413", "category": "quant-ph", "title": "Quantum Information Analysis in a q-Deformed Deng-Fan Model", "abstract": "We introduce a $q$-deformed Deng-Fan potential ($q$DFP) model that enables controlled modulation of short-range repulsion and long-range attraction while preserving the equilibrium configuration. The model is solved exactly within the framework of the time-independent Schrödinger equation, yielding closed-form expressions for the energy eigenvalues and wave functions in terms of hypergeometric functions. We show that the deformation parameter $q$ induces non-uniform spectral shifts and a redistribution of bound states. In particular, for $q<1$, the system exhibits spectral compression and enhanced spatial localization. In addition, we investigate the system from an information-theoretic perspective using Shannon entropy, Fisher information, and Fisher--Shannon complexity measures in both position and momentum spaces. The results reveal that the deformation parameter governs the redistribution of quantum information, establishing a direct connection between spatial confinement and momentum delocalization in accordance with the Białynicki-Birula and Mycielski entropic uncertainty principle. Stronger deformation pushes the quantum state further from the minimum-uncertainty configuration, increasing the entropic excess above the BBM bound and reducing the information content about complementary observables, even as position-space localization sharpens. The analysis of entropic and Fisher information densities further shows how the deformation reshapes both the local information content and the structural complexity of the quantum states. We show that in the limit $q\\to 1$, the $q$DFP model is reduced to the standard Deng-Fan potential.", "url": "https://arxiv.org/abs/2608.15413", "type": "理论+数值", "summary": "我们引入了 $q$ 变形邓凡势 ($q$DFP) 模型，该模型能够在保持平衡配置的同时控制短程斥力和长程吸引力的调制。该模型在与时间无关的薛定谔方程的框架内精确求解，产生能量特征值和超几何函数波函数的封闭式表达式。我们证明变形参数 $q$ 会引起不均匀的光谱位移和束缚态的重新分布。特别是，对于 $q<1$，系统表现出频谱压缩和增强的空间定位。此外，我们还使用位置和动量空间中的香农熵、费舍尔信息和费舍尔-香农复杂性度量，从信息论的角度研究了该系统。结果表明，变形参数控制着量子信息的重新分布，根据 Białynicki-Birula 和 Mycielski 熵不确定原理，在空间限制和动量离域之间建立了直接联系。\n\n更强的变形将量子态推离最小不确定性配置，增加了 BBM 界限之上的熵过剩，并减少了互补可观测量的信息内容，即使位置空间局域化变得尖锐。对熵和费希尔信息密度的分析进一步表明变形如何重塑量子态的局部信息内容和结构复杂性。我们证明，在 $q\\to 1$ 的限制下，$q$DFP 模型被简化为标准 Deng-Fan 势。", "authors": [{"name": "P. O. Amadi"}, {"name": "Collins O. Edet"}, {"name": "A. R. P. Moreirae"}, {"name": "P. Kalasuwana"}, {"name": "N.Ali"}, {"name": "R. Endut"}, {"name": "S. A. Aljunid"}], "featured_authors": [{"name": "P. O. Amadi"}, {"name": "Collins O. Edet"}, {"name": "A. R. P. Moreirae"}, {"name": "N.Ali"}, {"name": "R. Endut"}, {"name": "S. A. Aljunid"}], "author_count": 7}, {"id": "2608.15464", "category": "quant-ph", "title": "A minimal qutrit counterexample to Conjecture 4.9 of Lesniewski and Ruskai", "abstract": "Lesniewski and Ruskai conjectured that the contraction coefficient of every monotone Riemannian metric under a unital stochastic map equals the Hilbert--Schmidt contraction on the traceless subspace. We disprove the conjecture with an explicit entanglement-breaking qutrit channel induced by a doubly stochastic $3\\times3$ matrix. A faithful diagonal state and a commuting traceless tangent give, simultaneously for every normalized monotone metric, the exact lower bound $\\eta^{\\mathrm{Riem}}_{\\kappa}(\\Phi_K)\\ge 8896/20007>(62+2\\sqrt{61})/225=\\Lambda_2(\\Phi_K^{\\dagger}\\Phi_K)$. The counterexample is entirely classical on a maximal abelian subalgebra. A theorem of Hiai and Ruskai establishes the conjectured identity for all unital qubit maps, so dimension three is minimal among full matrix algebras.", "url": "https://arxiv.org/abs/2608.15464", "type": "理论", "summary": "Lesniewski和Ruskai推测，单位随机映射下每个单调黎曼度量的收缩系数等于无迹子空间上的希尔伯特-施密特收缩。我们用双随机 $3\\times3$ 矩阵引发的显式纠缠破坏 qutrit 通道反驳了这一猜想。对于每个归一化单调度量，忠实的对角状态和通勤无迹切线同时给出精确的下界 $\\eta^{\\mathrm{Riem}}_{\\kappa}(\\Phi_K)\\ge 8896/20007>(62+2\\sqrt{61})/225=\\Lambda_2(\\Phi_K^{\\dagger}\\Phi_K)$。反例完全是最大阿贝尔子代数的经典例子。 Hiai 和 Ruskai 定理为所有单位量子位图建立了推测的恒等式，因此第三维在全矩阵代数中是最小的。", "authors": [{"name": "Domingos S. P. Salazar"}], "featured_authors": [{"name": "Domingos S. P. Salazar"}], "author_count": 1}, {"id": "2608.15576", "category": "quant-ph", "title": "Local observable errors from truncating interaction tails in gapped quantum lattice systems", "abstract": "We bound the error in ground-state expectations of local observables caused by truncating the spatial tails of a gapped quantum lattice Hamiltonian. We show that the error is controlled by the interaction strength discarded near each site, rather than by the extensive norm of the omitted Hamiltonian. If the gap remains open along a path that removes the interaction tail, the resulting bounds are uniform in system size and extend, under suitable assumptions, to thermodynamic-limit ground states. The convergence rate reflects the decay of the interaction tail: it is algebraic for power-law interactions, superpolynomial for superpolynomial interactions, and exponential at any strictly smaller rate for exponentially decaying interactions. For superpolynomial interactions, we also derive a direct infinite-volume estimate using automorphic equivalence. The results extend to isolated low-energy sectors and parity-even fermionic systems. For two-body interactions decaying as $r^{-p}$ in $d$ dimensions, we prove an error bound $O(R^{-(p-d)})$ for $p>2d$, where $R$ is the truncation range. We construct a gapped non-translation-invariant example that saturates this scaling, showing that the bound is optimal for the general class considered. Our results quantify when finite-range truncations faithfully reproduce the local physics of gapped long-range systems.", "url": "https://arxiv.org/abs/2608.15576", "type": "理论", "summary": "我们限制了由于截断有隙量子晶格哈密顿量的空间尾部而引起的局部可观测量的基态期望误差。我们表明，误差是由每个位点附近丢弃的相互作用强度控制的，而不是由省略的哈密顿量的扩展范数控制的。如果间隙沿着消除相互作用尾部的路径保持开放，则所得的边界在系统尺寸上是均匀的，并且在适当的假设下延伸至热力学极限基态。收敛速率反映了相互作用尾部的衰减：对于幂律相互作用，它是代数的；对于超多项式相互作用，它是超多项式的；对于指数衰减相互作用，它是在任何严格更小的速率下的指数。对于超多项式相互作用，我们还使用自守等价推导出直接的无限体积估计。结果扩展到孤立的低能扇区和宇称偶费米子系统。对于 $d$ 维度中以 $r^{-p}$ 衰减的二体相互作用，我们证明了 $p>2d$ 的误差界限 $O(R^{-(p-d)})$，其中 $R$ 是截断范围。\n\n我们构建了一个有间隙的非平移不变示例，该示例使该缩放饱和，表明该界限对于所考虑的一般类别来说是最佳的。我们的结果量化了有限范围截断何时忠实地再现有间隙的远程系统的局部物理现象。", "authors": [{"name": "Kangle Li"}], "featured_authors": [{"name": "Kangle Li"}], "author_count": 1}, {"id": "2608.15577", "category": "quant-ph", "title": "Qutrit-Native Spatial-Orbital Encoding for Resource-Efficient Quantum Chemistry Simulation", "abstract": "Additional levels in a qudit can serve as more than extra computational capacity and can represent physically relevant correlations when the algorithmic design reflects the underlying physics of the problem. We demonstrate this principle for quantum chemistry simulation using a qutrit-native spatial-orbital encoding, where $|0\\rangle$, $|1\\rangle$, and $|2\\rangle$ denote orbital occupation states. We establish a qutrit simulation framework that combines number-conserving pair-transfer and broken-pair generators with a projected-Hamiltonian energy estimator constructed from qutrit populations and coherences. Benchmarks for H$_2$, LiH, and H$_2$O show that the encoding reproduces the relevant potential-energy curves, while retaining a compact quantum resource structure. Direct comparison with the pair-only restriction confirms that the third level reduces errors by tens of mHa in LiH and by more than 100 mHa in H$_2$O. Despite a partial spin-coupling truncation in the compact H$_2$O encoding, the resulting energy curve deviates from FCI by only a few mHa over the tested range. Compared with a conventional qubit-based UCCSD approach, the qutrit scheme requires half as many quantum units and reduces the scaling of the parameterized ansatz generator count from $O(M^4)$ to $O(M^2)$, where $M$ is the number of spatial orbitals. This work elucidates how a physically motivated qutrit encoding can reduce quantum-resource requirements while retaining controlled electronic-structure accuracy, thereby providing a concrete starting point for broader qudit-native quantum algorithm design.", "url": "https://arxiv.org/abs/2608.15577", "type": "理论+数值", "summary": "当算法设计反映问题的底层物理时，qudit 中的附加级别不仅可以充当额外的计算能力，还可以表示物理相关的相关性。我们使用 qutrit 原生空间轨道编码演示了量子化学模拟的这一原理，其中 $|0\\rangle$、$|1\\rangle$ 和 $|2\\rangle$ 表示轨道占据状态。我们建立了一个 qutrit 模拟框架，它将数守恒对传递和断对生成器与由 qutrit 总体和相干性构建的投影哈密尔顿能量估计器相结合。 H$_2$、LiH 和 H$_2$O 的基准表明，编码再现了相关的势能曲线，同时保留了紧凑的量子资源结构。与仅对限制的直接比较证实，第三级在 LiH 中将误差减少了数十 mHa，在 H$_2$O 中将误差减少了 100 mHa 以上。尽管紧凑 H$_2$O 编码中存在部分自旋耦合截断，但在测试范围内所得能量曲线与 FCI 的偏差仅几 mHa。\n\n与传统的基于量子位的 UCCSD 方法相比，qutrit 方案需要一半数量的量子单元，并将参数化 ansatz 生成器计数的缩放比例从 $O(M^4)$ 减少到 $O(M^2)$，其中 $M$ 是空间轨道的数量。这项工作阐明了物理驱动的 qutrit 编码如何减少量子资源需求，同时保持受控的电子结构精度，从而为更广泛的 qudit 原生量子算法设计提供了具体的起点。", "authors": [{"name": "Sumin Lim"}], "featured_authors": [{"name": "Sumin Lim"}], "author_count": 1}, {"id": "2608.15604", "category": "quant-ph", "title": "Nonlinear Landau-Zener Tunneling with Heat-Bath Colored Noise", "abstract": "In this work, we investigate the influence of colored noise originating from a heat bath on nonlinear Landau-Zener (LZ) tunneling. The nonlinearity might arise intrinsically from many-body mean-field atomic self-interactions or Kerr nonlinearities in optical systems. Contrary to the well-established picture of thermally enhanced quantum tunneling within the linear LZ paradigm, ensemble statistics of our numerical simulations demonstrate that nonlinearity can give rise to thermally suppressed LZ tunneling: the tunneling probability of the nonlinear LZ system decreases as the amplitude of the colored noise increases beyond a critical value. Analytically, the Wiener-Hermite expansion facilitates elucidation of the intrinsic mechanism accounting for the nonmonotonic dependence of tunneling probability on noise amplitude. We compare these behaviors with stochastic resonance responses and clarify that the two phenomena stem from distinct physical mechanisms. In addition, we obtain approximate solutions in the weak- and strong-noise limits and discuss the implications of our theory.", "url": "https://arxiv.org/abs/2608.15604", "type": "理论+数值", "summary": "在这项工作中，我们研究了源自热浴的有色噪声对非线性朗道-齐纳 (LZ) 隧道的影响。非线性可能本质上源于光学系统中的多体平均场原子自相互作用或克尔非线性。与线性 LZ 范式中热增强量子隧道效应的既定图像相反，我们数值模拟的集合统计表明，非线性可以引起热抑制 LZ 隧道效应：随着有色噪声的幅度增加超过临界值，非线性 LZ 系统的隧道概率降低。从分析上讲，维纳-埃尔米特展开有助于阐明隧道概率对噪声幅度的非单调依赖性的内在机制。我们将这些行为与随机共振响应进行比较，并阐明这两种现象源于不同的物理机制。此外，我们还获得了弱噪声和强噪声限制下的近似解，并讨论了我们的理论的含义。", "authors": [{"name": "Yi Cao"}, {"name": "Jie Liu"}], "featured_authors": [{"name": "Yi Cao"}, {"name": "Jie Liu"}], "author_count": 2}, {"id": "2608.15620", "category": "quant-ph", "title": "Finite-energy GKP-QPC architectures for photonic quantum memories and repeaters", "abstract": "Photonic quantum networks require error-correction architectures that remain useful with finite-energy bosonic states, pure-loss fiber transmission, and explicit resource accounting. In this light, we study a concatenated architecture in which each physical rail is a finitely squeezed Gottesman--Kitaev--Preskill (GKP) qubit transmitted through a pure-loss fiber segment, corrected by teleportation-based GKP error correction with finitely squeezed ancillae, and decoded by an outer quantum parity code (QPC). The GKP layer converts continuous homodyne syndromes into effective rail-level Pauli marginals, while the QPC layer suppresses the residual qubit-level errors. For the concatenated code family considered here, we find a finite-squeezing threshold of $5.06\\,\\mathrm{dB}$ at zero propagation loss. In the memory setting, the QPC layer lowers the squeezing at which repeated error correction becomes beneficial from $6.7\\,\\mathrm{dB}$ for bare GKP correction to $5.2\\,\\mathrm{dB}$ for QPC$(3,3)$ and $4.3\\,\\mathrm{dB}$ for QPC$(5,5)$, and improves the average-fidelity ratio by up to $75$--$90\\%$ in the relevant intermediate-noise regime. In the repeater setting, avoiding pre-amplification gives larger secret-key fractions at moderate squeezing, but also produces an optimal squeezing because highly squeezed GKP peaks become sensitive to loss-induced inward displacement. Resource-normalized rates show that QPC concatenation can exceed the repeaterless PLOB benchmark by orders of magnitude and extend the communication reach, at short repeater spacing, to distances of order $10^4$km with $14$dB squeezing. However, QPC concatenation becomes detrimental when each elementary hop is too lossy. These results provide quantitative design rules for finite-squeezing GKP--QPC quantum memories and repeaters.", "url": "https://arxiv.org/abs/2608.15620", "type": "理论", "summary": "光子量子网络需要纠错架构，该架构对于有限能量玻色子态、纯损耗光纤传输和显式资源核算仍然有用。有鉴于此，我们研究了一种级联架构，其中每个物理轨道都是通过纯损耗光纤段传输的有限压缩 Gottesman-Kitaev-Preskill (GKP) 量子位，通过基于隐形传输的 GKP 纠错和有限压缩辅助进行校正，并通过外部量子奇偶校验码 (QPC) 进行解码。 GKP 层将连续零差综合症转换为有效的轨道级泡利边际，而 QPC 层则抑制残余量子位级错误。对于这里考虑的级联代码族，我们发现传播损耗为零时的有限压缩阈值为 $5.06\\,\\mathrm{dB}$。在内存设置中，QPC 层将重复纠错变得有益的压缩从裸 GKP 校正的 $6.7\\,\\mathrm{dB}$ 降低到 QPC$(3,3)$ 的 $5.2\\,\\mathrm{dB}$ 和 QPC$(5,5)$ 的 $4.3\\,\\mathrm{dB}$，并将平均保真度提高高达在相关的中间噪声范围内，$75$--$90\\%$。\n\n在中继器设置中，避免预放大会在适度压缩时提供更大的秘密密钥分数，但也会产生最佳压缩，因为高度压缩的 GKP 峰对损耗引起的向内位移变得敏感。资源归一化速率表明，QPC 级联可以超出无中继器 PLOB 基准几个数量级，并且在短中继器间距下，将通信范围扩展到 10^4$km 量级（压缩 14$dB）。然而，当每个基本跳损耗太大时，QPC 串联就会变得有害。这些结果为有限压缩 GKP-QPC 量子存储器和中继器提供了定量设计规则。", "authors": [{"name": "Kaustav Chatterjee"}, {"name": "Ulrik Lund Andersen"}], "featured_authors": [{"name": "Kaustav Chatterjee"}, {"name": "Ulrik Lund Andersen"}], "author_count": 2}, {"id": "2608.15655", "category": "quant-ph", "title": "Rand-SEMI-QAOA: Finite-Budget Depth-One MaxCut Ensembles on Compressed Quantum Registers", "abstract": "We introduce Rand-SEMI-QAOA, a finite-budget QRAO--QAOA ensemble for MaxCut based on a $(3,1)$-QRAC relaxation. The method samples labels uniformly without replacement from the product-$X$ family of an implemented Galois stabilizer mutually unbiased basis (MUB) system. Each selected state--mixer pair is optimized independently for relaxed QRAO energy and then evaluated by deterministic Pauli-sign decoding. Exhaustive scans of the implemented noncomputational MUB catalog place the product-$X$ family first in 18 of 20 validated family-mean cells and in every tested cell for $r=5,6,7$. On a complete cohort of $2{,}400$ random connected 3-regular MaxCut instances with $n\\in\\{18,20,22\\}$, the capped matched-cardinality schedule attains a graph-mean decoded best-of-set approximation ratio of $0.9421$ with one QAOA layer, while the $K=r^2$ schedule attains $0.9319$. These statistics are conditional on the disclosed frozen selector pools and do not estimate variability over selector seeds. An exact gauge identity shows that product-family labels generate the orbit of the QRAO Hamiltonian under an $r$-dimensional sign-gauge group. For common angles and relaxed energy, deterministic syndrome analysis proves branchwise dephasing, while an anisotropic Gaussian surrogate controls the coherent label-averaged response on the scale $\\beta=b/r$. The theory does not order independently optimized decoded maxima. The results are finite-size and resource-explicit and do not establish quantum advantage.", "url": "https://arxiv.org/abs/2608.15655", "type": "理论+数值", "summary": "我们引入 Rand-SEMI-QAOA，这是一种基于 $(3,1)$-QRAC 松弛的 MaxCut 有限预算 QRAO--QAOA 集成。该方法对标签进行统一采样，无需从已实施的伽罗瓦稳定器互不偏基（MUB）系统的产品$X$系列中进行替换。每个选定的状态混合器对都针对松弛 QRAO 能量进行独立优化，然后通过确定性泡利符号解码进行评估。对已实施的非计算 MUB 目录的详尽扫描将产品-$X$ 系列置于 20 个经过验证的系列平均单元中的 18 个中的首位，并且在 $r=5,6,7$ 的每个测试单元中。在具有 $n\\in\\{18,20,22\\}$ 的完整的 $2{,}400$ 随机连接的 3-正则 MaxCut 实例队列中，上限匹配基数计划通过一个 QAOA 层获得了 $0.9421$ 的图均值解码最佳集逼近率，而 $K=r^2$ 计划获得了 $0.9319$。这些统计数据以所公开的冻结选择器池为条件，并且不估计选择器种子的变异性。精确的规范标识表明，产品系列标签在 $r$ 维符号规范组下生成 QRAO 哈密顿量的轨道。\n\n对于共同角度和松弛能量，确定性综合症分析证明了分支相移，而各向异性高斯代理控制了尺度 $\\beta=b/r$ 上的相干标签平均响应。该理论不会对独立优化的解码最大值进行排序。结果是有限大小和资源显式的，并且没有建立量子优势。", "authors": [{"name": "Emilio Semre"}, {"name": "Steven Frankel"}], "featured_authors": [{"name": "Emilio Semre"}, {"name": "Steven Frankel"}], "author_count": 2}, {"id": "2608.15718", "category": "quant-ph", "title": "Quantum Kernel k-Means for Credit-Card Fraud Detection:A Controlled Benchmark on Real Transaction Data", "abstract": "We benchmarked quantum kernel $k$-means against classical clustering for credit-card fraud detection on real transaction data, at up to \\MaxQubits{} qubits, under a protocol with separated selection and reporting data and matched search budgets. We find no robust quantum advantage: the sign of the difference depends on register size, all effect sizes are below $0.013$ ARI, and the single significant advantage we observe is fully explained by the number of configurations searched. We further show that ordinary hyperparameter choices move performance by considerably more than the quantum kernel does, that additional qubits degrade rather than improve performance through kernel concentration, and that the clustering framing itself fails at realistic class imbalance though kernel-based anomaly scoring does not. We regard the methodological contribution as the more durable one. The search-budget ablation in particular is inexpensive and, in our case, decisive: it converted a statistically significant advantage into a procedural artefact. We would encourage its routine use.", "url": "https://arxiv.org/abs/2608.15718", "type": "理论", "summary": "我们根据具有分离的选择和报告数据以及匹配的搜索预算的协议，对真实交易数据上高达 \\MaxQubits{} 量子位的信用卡欺诈检测的量子内核 $k$-means 进行了基准测试。我们发现没有鲁棒的量子优势：差异的符号取决于寄存器大小，所有效应大小都低于 $0.013$ ARI，并且我们观察到的单一显着优势可以通过搜索的配置数量来充分解释。我们进一步表明，普通的超参数选择对性能的影响远远大于量子内核的影响，额外的量子位通过内核集中降低而不是提高性能，并且聚类框架本身在现实的类不平衡方面失败，尽管基于内核的异常评分不会。我们认为方法论的贡献是更持久的。搜索预算的削减尤其便宜，而且在我们的例子中是决定性的：它将统计上的显着优势转化为程序上的假象。我们鼓励其日常使用。", "authors": [{"name": "Muhammad Faryad"}], "featured_authors": [{"name": "Muhammad Faryad"}], "author_count": 1}, {"id": "2608.15739", "category": "quant-ph", "title": "Tunable Statistics-Induced Caging in the Anyon-Hubbard Model", "abstract": "We study the quantum dynamics of two interacting anyons in the Anyon-Hubbard model on a four-site plaquette, a system that is exactly mappable to a Bose-Hubbard model. We reveal that static Aharonov-Bohm (AB) caging, induced by only specific statistical phases, emerges in the strongly interacting limit but breaks down under weak interparticle interactions. To address this, we demonstrate that statistical-factor-induced AB caging can be dynamically restored via Floquet engineering. This dynamical mechanism, governed by the synthetic Floquet flux and the anyonic statistical phase, extends the caging effect into the weakly interacting regime across the full spectrum of statistical phases. Furthermore, we show that the external drive enables the selective caging of anyons, providing an efficient approach for manipulating anyons and identifying statistical phases.", "url": "https://arxiv.org/abs/2608.15739", "type": "理论", "summary": "我们在四位点板上研究了 Anyon-Hubbard 模型中两个相互作用的任意子的量子动力学，该系统可以精确映射到 Bose-Hubbard 模型。我们揭示了仅由特定统计相引起的静态阿哈罗诺夫-玻姆（AB）笼化，在强相互作用极限中出现，但在弱粒子间相互作用下崩溃。为了解决这个问题，我们证明了统计因素引起的 AB 笼可以通过 Floquet 工程动态恢复。这种由合成 Floquet 通量和任意子统计相控制的动力学机制，将笼效应扩展到整个统计相范围内的弱相互作用区域。此外，我们表明外部驱动器能够选择性地囚禁任意子，为操纵任意子和识别统计相位提供了一种有效的方法。", "authors": [{"name": "Zenong Zhou"}, {"name": "Chaorong Guo"}, {"name": "Hongzheng Wu"}, {"name": "Qianglin Hu"}, {"name": "Xiaobing Luo"}], "featured_authors": [{"name": "Zenong Zhou"}, {"name": "Chaorong Guo"}, {"name": "Hongzheng Wu"}, {"name": "Qianglin Hu"}, {"name": "Xiaobing Luo"}], "author_count": 5}, {"id": "2608.15754", "category": "quant-ph", "title": "Designing Quantum Error Correcting Codes to fit decoders via Reinforcement Learning", "abstract": "We present a reinforcement learning (RL) approach to the co-design of stabilizer sets of Quantum Error Correcting Codes (QECCs) and decoders. We show how to produce a generative model that produces Bivariate Bicycle (BB) codes based on the choice of decoder. Specifically, we fix a decoder architecture and use Proximal Policy Optimisation (PPO) to train an agent over BB codes to maximise decoder performance under a depolarising channel noise model.", "url": "https://arxiv.org/abs/2608.15754", "type": "理论+数值", "summary": "我们提出了一种强化学习（RL）方法来协同设计量子纠错码（QECC）和解码器的稳定器组。我们展示了如何生成一个生成模型，该模型根据解码器的选择生成双变量自行车（BB）代码。具体来说，我们修复了解码器架构，并使用近端策略优化 (PPO) 来训练 BB 代码上的代理，以在去极化信道噪声模型下最大化解码器性能。", "authors": [{"name": "Omer S. Sella"}, {"name": "Robert Pinsler"}, {"name": "Thomas Heinis"}], "featured_authors": [{"name": "Omer S. Sella"}, {"name": "Robert Pinsler"}, {"name": "Thomas Heinis"}], "author_count": 3}, {"id": "2608.15806", "category": "quant-ph", "title": "Longitudinal-Field-Driven Transition in a non-integrable Non-Hermitian Transverse-Field Ising Chain via RBMs", "abstract": "We investigate the ground-state properties and quantum critical behavior of a non-Hermitian transverse-field Ising chain subjected to longitudinal and complex transverse magnetic fields. To address this interacting many-body problem, we employ real-valued neural quantum states based on Restricted Boltzmann Machines (RBMs), optimized using Variational Monte Carlo (VMC) sampling. Spectral analysis of finite chains reveals exceptional points associated with spontaneous parity-time (PT) symmetry breaking. A real-valued RBM framework is developed to reconstruct the ground-state eigenstates of the non-Hermitian Hamiltonian. Benchmark comparisons with exact diagonalization demonstrate that the RBM approach accurately reproduces the ground-state energy, magnetization, and spin-spin correlations. Extending the analysis to larger system sizes, we identify a non-Hermitian quantum phase transition characterized by PT-symmetry breaking and the emergence of magnetic order. Our results establish real-valued neural quantum states as an efficient and scalable framework for investigating critical phenomena in interacting non-Hermitian quantum systems.", "url": "https://arxiv.org/abs/2608.15806", "type": "理论+数值", "summary": "我们研究了非厄米横向场伊辛链在纵向和复杂横向磁场作用下的基态特性和量子临界行为。为了解决这个相互作用的多体问题，我们采用基于受限玻尔兹曼机（RBM）的实值神经量子态，并使用变分蒙特卡罗（VMC）采样进行优化。有限链的谱分析揭示了与自发宇称时间（PT）对称性破缺相关的异常点。开发了实值 RBM 框架来重建非厄米哈密顿量的基态本征态。与精确对角化的基准比较表明，RBM ​​方法准确地再现了基态能量、磁化强度和自旋-自旋相关性。将分析扩展到更大的系统尺寸，我们发现了一种非厄米量子相变，其特征是 PT 对称性破缺和磁序的出现。我们的结果将实值神经量子态建立为一个有效且可扩展的框架，用于研究相互作用的非厄米量子系统中的关键现象。", "authors": [{"name": "M.E. Ateuafack"}, {"name": "M.R. Kamsap"}, {"name": "J.T. Diffo"}, {"name": "L.C. Fai"}, {"name": "M.N. Jipdi"}], "featured_authors": [{"name": "M.E. Ateuafack"}, {"name": "M.R. Kamsap"}, {"name": "J.T. Diffo"}, {"name": "L.C. Fai"}, {"name": "M.N. Jipdi"}], "author_count": 5}, {"id": "2608.15827", "category": "quant-ph", "title": "Resource Analysis for Quantum Simulation of Spatially Varying Transport-Reaction Equations", "abstract": "Spatially varying coefficients are the primary source of circuit complexity in quantum simulation of linear advection-diffusion-reaction equations. This work presents a resource analysis of single-step quantum propagators constructed using sparse FABLE block encodings, Quantum Singular Value Transformation, and linear-combination-of-unitaries. We derive theoretical estimates for qubit count, gate complexity, and circuit depth in terms of the spatial discretization, sparsity, and polynomial degree, and compare these predictions with synthesized quantum circuits for one- and two-dimensional variable-coefficient problems. The resulting analysis quantifies the cost of encoding realistic transport operators and provides practical resource estimates for near-term implementations.", "url": "https://arxiv.org/abs/2608.15827", "type": "理论+数值", "summary": "空间变化的系数是线性平流扩散反应方程的量子模拟中电路复杂性的主要来源。这项工作提出了使用稀疏 FABLE 块编码、量子奇异值变换和酉线性组合构建的单步量子传播器的资源分析。我们根据空间离散化、稀疏性和多项式次数得出了量子位计数、门复杂性和电路深度的理论估计，并将这些预测与一维和二维可变系数问题的合成量子电路进行了比较。由此产生的分析量化了对现实运输运营商进行编码的成本，并为近期实施提供了实际的资源估算。", "authors": [{"name": "Benjamin Jasperson"}, {"name": "Krishna Garikipati"}, {"name": "Siddhartha Srivastava"}], "featured_authors": [{"name": "Benjamin Jasperson"}, {"name": "Krishna Garikipati"}, {"name": "Siddhartha Srivastava"}], "author_count": 3}, {"id": "2608.15829", "category": "quant-ph", "title": "Topologically Protected Learning from Exceptional Point Braiding: Toward Braid Programming", "abstract": "We present a framework for topological learning based on exceptional point (EP) braiding in a non-Hermitian Bogoliubov-de Gennes Hamiltonian. A closed algebraic equation for the EP super-surface is derived; through momentum quantisation in finite systems, it predicts the exact number and parameter positions of all EPs in real space, irrespective of system size. The EP topology is characterised by two quantised invariants the state-swap fidelity and the normalised Berry phase which cannot both be zero for a topological EP. A complete topological map shows that all EPs lie within a specefic region. Adiabatic encirclements confirm robust state swapping and yield a universal set of braid gates, including Pauli-X, Pauli-Y, Pauli-Z, a Hadamard-like gate, the T-gate, and a SWAP operation, with the special case where a is 0, providing additional phase gates. Building on these generators, we reformulate learning as braid programming a discrete search over the braid group that replaces gradient descent on continuous weights with combinatorial optimisation. A proof-of-concept genetic search successfully discovers short braid words that reproduce the standard Hadamard gate and the H.Z gate with perfect fidelity. This paradigm offers inherent noise immunity, catastrophic-forgetting prevention through compositional concatenation, and guaranteed generalisation by mathematical construction, establishing EP braiding as a promising substrate for robust, interpretable, and topologically protected neuromorphic computation.", "url": "https://arxiv.org/abs/2608.15829", "type": "理论", "summary": "我们提出了一种基于非厄米特 Bogoliubov-de Gennes 哈密顿量中的异常点 (EP) 编织的拓扑学习框架。推导了EP超表面的封闭代数方程；通过有限系统中的动量量化，它可以预测真实空间中所有 EP 的确切数量和参数位置，而不管系统规模如何。 EP 拓扑的特征在于两个量化不变量：状态交换保真度和归一化 Berry 相位，对于拓扑 EP 而言，这两个不变量不能同时为零。完整的拓扑图显示所有 EP 都位于特定区域内。绝热包围确认了稳健的状态交换，并产生了一组通用的辫子门，包括 Pauli-X、Pauli-Y、Pauli-Z、Hadamard 类门、T 门和 SWAP 操作，在 a 为 0 的特殊情况下，提供了额外的相位门。在这些生成器的基础上，我们将学习重新表述为辫子编程，对辫子组进行离散搜索，用组合优化代替连续权重上的梯度下降。\n\n概念验证基因搜索成功地发现了短辫子词，它们以完美的保真度再现了标准哈达玛门和 H.Z 门。该范式提供了固有的抗噪性、通过组合串联防止灾难性遗忘，并通过数学构造保证泛化，将 EP 编织建立为稳健、可解释和拓扑保护的神经形态计算的有前途的基础。", "authors": [{"name": "M.N. Jipdi"}, {"name": "C. Avomo Mba"}, {"name": "A. B. Moubissi"}, {"name": "L.C. Fai"}, {"name": "M.E. Ateuafack"}], "featured_authors": [{"name": "M.N. Jipdi"}, {"name": "C. Avomo Mba"}, {"name": "A. B. Moubissi"}, {"name": "L.C. Fai"}, {"name": "M.E. Ateuafack"}], "author_count": 5}, {"id": "2608.15833", "category": "quant-ph", "title": "Geodesic Quantum $f$-Divergences", "abstract": "We introduce the geodesic quantum $f$-divergences $D_f^t$, $0\\leq t\\leq1$, obtained from the affine-invariant geodesic between the standard and maximal relative modular operators. They reduce to the classical $f$-divergence for commuting states. The logarithmic generator yields geodesic relative entropies joining the Umegaki and Belavkin-Staszewski entropies, while the power generators yield $(t,\\alpha)$-Rényi divergences joining the Petz and geometric families. Our first main result is data processing of $D_f^t$ for every finite operator-convex generator $f$ and every $t\\in[0,1]$. In particular, this gives DPI for the geodesic relative entropies and for the $(t,\\alpha)$-Rényi divergences when $0<\\alpha<1$ or $1<\\alpha\\leq2$. Our second main result identifies equality in the DPI: for invertible states, every equality-determining operator-convex generator has, at each nonmaximal parameter $0\\leq t<1$, exactly the Petz sufficiency class; at $t=1$, this changes to the generally larger maximal, or BS, class, which also coincides with the equality class of the divergences associated with the quadratic generator for every $t$. Our third main result is the corresponding collapse of invertible geodesic quantum Markov chains: for each of the three ordered conditional-mutual-information constructions, the $t$-quantum Markov chains are precisely the quantum Markov chains for $0\\leq t<1$, whereas at $t=1$ they are the invertible BS quantum Markov chains, a class that can be strictly larger. We also determine parameter-monotonicity regimes and the intersections with the $(\\alpha,z)$ family. We prove strengthened data-processing and reconstruction estimates; we compare the three conditional orientations; we establish continuity bounds under positive lower-eigenvalue assumptions together with complementary discontinuity results; and we give a capacity-per-unit-cost interpretation.", "url": "https://arxiv.org/abs/2608.15833", "type": "理论", "summary": "我们引入测地线量子$f$-散度$D_f^t$、$0\\leq t\\leq1$，这是从标准相对模算子和最大相对模算子之间的仿射不变测地线获得的。它们减少到通勤状态的经典 $f$ 分歧。对数发生器产生连接 Umegaki 和 Belavkin-Staszewski 熵的测地相对熵，而幂发生器产生连接 Petz 和几何族的 $(t,\\alpha)$-Rényi 散度。我们的第一个主要结果是对每个有限算子凸生成器 $f$ 和每个 $t\\in[0,1]$ 进行 $D_f^t$ 的数据处理。特别是，当 $0<\\alpha<1$ 或 $1<\\alpha\\leq2$ 时，这给出了测地线相对熵和 $(t,\\alpha)$-Rényi 散度的 DPI。我们的第二个主要结果确定了 DPI 中的相等性：对于可逆状态，每个相等确定算子凸生成器在每个非最大参数 $0\\leq t<1$ 处都具有精确的 Petz 充分性类；在 $t=1$ 时，这会更改为通常较大的最大值或 BS 类，该类也与与每个 $t$ 的二次生成器相关的散度的等式类一致。\n\n我们的第三个主要结果是可逆测地量子马尔可夫链的相应崩溃：对于三个有序条件互信息结构中的每一个，$t$量子马尔可夫链恰好是$0\\leq t<1$的量子马尔可夫链，而在$t=1$处它们是可逆BS量子马尔可夫链，一个可以严格更大的类。我们还确定参数单调性机制以及与 $(\\alpha,z)$ 系列的交集。我们证明了加强的数据处理和重建估计；我们比较了三种条件取向；我们在正的下特征值假设下建立连续性界限以及互补的不连续性结果；我们给出了每单位成本容量的解释。", "authors": [{"name": "Ángela Capel"}, {"name": "Pablo Costa Rico"}], "featured_authors": [{"name": "Ángela Capel"}, {"name": "Pablo Costa Rico"}], "author_count": 2}, {"id": "2608.15859", "category": "quant-ph", "title": "Anomalous radiation pressure in strong-field ionization driven by quantum light", "abstract": "We show that in strong-field ionization driven by bright squeezed vacuum, the mean longitudinal photoelectron momentum scales with the mean incident intensity $I$ as $I^{2/3}$, rather than linearly as under coherent-light driving. This anomalous scaling originates from a field-amplitude saddle-point structure: nonlinear tunneling selects two dominant field amplitudes of equal magnitude and opposite sign from the broad quantum fluctuations. Tracing over the final photon state erases their relative-phase information, leaving their common magnitude to determine the field-dependent longitudinal momentum shift and its $I^{2/3}$ scaling. Photon-number resolution instead preserves this coherence, producing parity-dependent modulations of the longitudinal momentum transfer through time-domain double-slit interference between two field pathways separated by half a cycle. These results establish longitudinal momentum transfer as a distinct observable in strong-field quantum optics that encodes both the photon statistics and the field coherence of intense quantum light.", "url": "https://arxiv.org/abs/2608.15859", "type": "理论", "summary": "我们表明，在明亮压缩真空驱动的强场电离中，平均纵向光电子动量随平均入射强度 $I$ 变化为 $I^{2/3}$，而不是像相干光驱动下那样呈线性变化。这种反常尺度源于场振幅鞍点结构：非线性隧道效应从宽量子涨落中选择两个大小相等、符号相反的主场振幅。追踪最终的光子态会消除它们的相对相位信息，留下它们的共同幅度来确定场相关的纵向动量偏移及其 $I^{2/3}$ 缩放。相反，光子数分辨率保留了这种相干性，通过相隔半个周期的两个场路径之间的时域双缝干涉，产生奇偶相关的纵向动量传递调制。这些结果将纵向动量转移确立为强场量子光学中的一个独特的可观测值，它编码了光子统计数据和强量子光的场相干性。", "authors": [{"name": "Xiaodan Mao"}, {"name": "Feng He"}, {"name": "Pei-Lun He"}], "featured_authors": [{"name": "Xiaodan Mao"}, {"name": "Feng He"}, {"name": "Pei-Lun He"}], "author_count": 3}, {"id": "2608.15870", "category": "quant-ph", "title": "A certified lower bound on the quantum-capacity threshold of the depolarizing channel", "abstract": "The noise threshold below which the qubit depolarizing channel retains positive quantum capacity has been studied since 1996, and every improvement to date -- most recently the record of Agarwal et al. -- rests on floating-point evaluation of the coherent information. We give the first proven positivity results in this regime: an explicit 45-copy rank-two input state A, published as a 1,472-byte witness, with certified $I_c>0$ at the exact rational $p=16239/250000=0.064956$ (per-Pauli convention; total error rate $3p=0.194868$), beyond the best previously reported numerical value. Because the depolarizing family is a semigroup under composition, fixed-input coherent information is nonincreasing in $p$ on $[0,1/4]$, so a single certified point extends to the entire interval below it. The same machinery confines the positivity boundaries of A and of the strongest public state of Agarwal et al. to disjoint rational intervals separated by more than $1/25000$ -- to our knowledge the first proven ordering of two competing code states. Every computational claim in the paper reduces to a finite list of big-integer comparisons, checkable by a dependency-free few-hundred-line verifier whose soundness rests on three self-contained half-page lemmas. Payloads, certificates, and verifier accompany the paper as a supplementary artifact.", "url": "https://arxiv.org/abs/2608.15870", "type": "理论+数值", "summary": "自 1996 年以来，人们一直在研究噪声阈值（低于该噪声阈值，量子位去极化通道仍保留正量子容量），并且迄今为止的每一项改进 - 最近的记录是 Agarwal 等人。 ——依赖于相干信息的浮点计算。我们给出了该机制中第一个经过验证的积极结果：一个明确的 45 副本二级输入状态 A，作为 1,472 字节的见证人发布，并在精确的有理数 $p=16239/250000=0.064956$ 处经过认证 $I_c>0$（根据泡利约定；总错误率 $3p=0.194868$），超出了之前报告的最佳数值。由于去极化族是组合下的半群，因此固定输入相干信息在 $[0,1/4]$ 上的 $p$ 中不增加，因此单个认证点扩展到其下方的整个区间。同样的机制限制了 A 和 Agarwal 等人的最强公共状态的积极边界。分离超过 $1/25000$ 的有理区间——据我们所知，这是两个竞争代码状态的第一个经过验证的排序。\n\n论文中的每个计算主张都简化为大整数比较的有限列表，可以通过无依赖性的数百行验证器进行检查，该验证器的可靠性取决于三个独立的半页引理。有效负载、证书和验证器作为本文的补充工件附随。", "authors": [{"name": "Artus Krohn-Grimberghe"}], "featured_authors": [{"name": "Artus Krohn-Grimberghe"}], "author_count": 1}, {"id": "2608.15889", "category": "quant-ph", "title": "Resource-Efficient QUBO Formulation for Anchored Currency Arbitrage", "abstract": "Currency arbitrage (CA) involves trading currencies in cycles to exploit discrepancies in market valuations. Quadratic unconstrained binary optimization (QUBO) involves minimizing a quadratic cost (energy) function of binary variables. Previous works have explored the use of QUBO to solve CA problems. We build on these previous works by introducing realistic constraints such as beginning cycles from a held currency and accounting for per-transaction trading fees. We show that this formulation requires fewer logical variables (qubits) than previous QUBO encodings in the literature. We derive provably sufficient penalty weights for its constraint terms. We also introduce an exact anchor-gauge reweighting of the exchange rates that compresses the QUBO coefficient range from the rate scale to the arbitrage scale, addressing the finite analog precision of annealing hardware. We demonstrate the efficacy of this formulation using classical simulated annealing against an exact Held-Karp baseline on the same CPU and show that it can effectively find profitable cycles and account for trading fees. Finally, we benchmark faithful implementations of five prior QUBO encodings at matched sampler budgets and show that the proposed encoding is the only one to recover the exact fee-adjusted optimum.", "url": "https://arxiv.org/abs/2608.15889", "type": "数值", "summary": "货币套利（CA）涉及周期性交易货币以利用市场估值的差异。二次无约束二元优化 (QUBO) 涉及最小化二元变量的二次成本（能量）函数。之前的工作已经探索了使用 QUBO 来解决 CA 问题。我们在这些先前工作的基础上引入了现实的约束，例如从持有的货币开始周期以及计算每笔交易的交易费用。我们表明，与文献中以前的 QUBO 编码相比，该公式需要更少的逻辑变量（量子位）。我们为其约束项得出可证明足够的惩罚权重。我们还引入了汇率的精确锚定规重新加权，将 QUBO 系数范围从汇率尺度压缩到套利尺度，解决了退火硬件的有限模拟精度问题。我们在同一 CPU 上使用经典模拟退火对照精确的 Held-Karp 基线来证明该公式的有效性，并表明它可以有效地找到盈利周期并考虑交易费用。\n\n最后，我们在匹配的采样器预算下对五种先前 QUBO 编码的忠实实现进行了基准测试，并表明所提出的编码是唯一能够恢复精确的费用调整最优值的编码。", "authors": [{"name": "Eric A. F. Reinhardt"}, {"name": "Adam J. Hauser"}], "featured_authors": [{"name": "Eric A. F. Reinhardt"}, {"name": "Adam J. Hauser"}], "author_count": 2}, {"id": "2608.15963", "category": "quant-ph", "title": "Classical Verification of Quantum Advantage via Clifford Obfuscation", "abstract": "Demonstrating quantum advantage in a manner that can be independently verified by classical means remains one of the most pressing open problems in quantum computing. Here we propose a new heuristic approach for constructing quantum circuits that are hard to classically simulate yet whose output distributions can be efficiently verified classically. Our approach is based on Clifford circuit obfuscation. This obfuscation scheme hides the Clifford structure and injects a controlled and rapidly growing non-stabilizer resources that resist known classical attack strategies including reverse engineering and direct simulation. Our protocol is heuristic but is supported by both numerical and theoretical evidence. This work provides a new avenue toward classically verifiable quantum advantage that avoids the stringent implementation requirements of known approaches.", "url": "https://arxiv.org/abs/2608.15963", "type": "理论+数值", "summary": "以可以通过经典方法独立验证的方式展示量子优势仍然是量子计算中最紧迫的开放问题之一。在这里，我们提出了一种新的启发式方法来构建难以经典模拟但其输出分布可以有效经典验证的量子电路。我们的方法基于 Clifford 电路混淆。这种混淆方案隐藏了 Clifford 结构，并注入了受控且快速增长的非稳定器资源，可以抵抗已知的经典攻击策略，包括逆向工程和直接模拟。我们的协议是启发式的，但得到了数字和理论证据的支持。这项工作为实现经典可验证的量子优势提供了一条新途径，避免了已知方法的严格实施要求。", "authors": [{"name": "Bin Yan"}], "featured_authors": [{"name": "Bin Yan"}], "author_count": 1}, {"id": "2608.16077", "category": "quant-ph", "title": "Quantum Rabi oscillations of a qubit strongly coupled to a one-dimensional waveguide", "abstract": "We theoretically investigate quantum Rabi oscillations in a system consisting of a two-level atom (qubit) strongly coupled to a one-dimensional open waveguide. In contrast to conventional cavity quantum electrodynamics, the qubit interacts with a continuum of propagating modes, which gives rise to fundamentally different dynamical behavior. Within the rotating-wave approximation, we express the multimode Jaynes-Cummings Hamiltonian in terms of collective bosonic operators and show that the system possesses two integrals of motion, enabling an exact diagonalization of the Hamiltonian in the single-excitation subspace. Considering the initially excited qubit and field states described by multiphoton Fock-like states, we demonstrate that the Rabi oscillations represent a collective phenomenon corresponding to oscillations between multiphoton states differing by a single photon. We then extend our analysis to multiphoton processes in which the initial field is a multimode coherent state in a continuous spectrum. In this case, the Rabi frequency is shown to be sensitive to the spectral profile of the function that generates the coherent state.", "url": "https://arxiv.org/abs/2608.16077", "type": "理论+数值", "summary": "我们从理论上研究了由与一维开放波导强耦合的两级原子（量子位）组成的系统中的量子拉比振荡。与传统的腔量子电动力学相反，量子位与传播模式的连续体相互作用，从而产生根本不同的动力学行为。在旋转波近似中，我们用集体玻色子算子来表达多模 Jaynes-Cummings 哈密顿量，并表明系统拥有两个运动积分，从而能够在单激发子空间中实现哈密顿量的精确对角化。考虑到多光子类福克态描述的初始激发量子位和场态，我们证明拉比振荡代表了一种集体现象，对应于单个光子不同的多光子态之间的振荡。然后，我们将分析扩展到多光子过程，其中初始场是连续光谱中的多模相干态。在这种情况下，拉比频率对生成相干态的函数的光谱轮廓敏感。", "authors": [{"name": "Ya. S. Greenberg"}, {"name": "A. A. Shtygashev"}, {"name": "O. A. Chuikin"}, {"name": "A. G. Moiseev"}, {"name": "O. V. Kibis"}], "featured_authors": [{"name": "Ya. S. Greenberg"}, {"name": "A. A. Shtygashev"}, {"name": "O. A. Chuikin"}, {"name": "A. G. Moiseev"}, {"name": "O. V. Kibis"}], "author_count": 5}, {"id": "2608.16183", "category": "quant-ph", "title": "Half a qubit: an algebraic fractionalization", "abstract": "Fractionalizing a quantum two-level system is usually associated with encodings based on pairs of Majorana fermions---an operational fractionalization. We show an alternative algebraic fractionalization by embedding Székely's classical ``half-coin'' into a non-Hermitian Krein space. The coefficients of $(q+pz)^{1/2}$ define a signed sequence and a normalized, non-Hermitian biorthogonal operator describing a biorthogonal half-qubit. We prove that two such objects fuse into an arbitrary pure qubit through the signed Vandermonde convolution that the collective $N\\ge2$ vectors are null in Krein space. $L_1$ norm of the half-qubit follows in closed form, $\\lVert p\\rVert_1 = 2\\sqrt{q}-\\sqrt{q-p}$. Its $L_1$ norm increases monotonically with the bias and attains its supremum $\\sqrt{2}$ precisely at the unbiased point $p=q=1/2$. Interestingly, we identify two structural results as follows. First, number parity and the $\\eta$-metric generate a distinguished commuting $\\mathbb Z_2\\times\\mathbb Z_2$ subgroup. Second, we find the $\\eta$-metric obstructs any local $\\eta$-self-adjoint partner of the parity, so a half-qubit carries a $\\mathbb{Z}_2$ observable but no local $SU(2)$. The full Pauli algebra emerges only upon fusion. We then show that the construction survives truncation of the Fock basis: the fused qubit is exact at every cutoff, and the Vandermonde cancellation is visible in sign-weighted photon-number statistics, and can be tested using existing cavity and trapped-ion state-synthesis methods. Finally, we generalize this algebraic fractionalization to a $1/n$-qubit, which can be achieved by replacing the square root with an $n$th root.", "url": "https://arxiv.org/abs/2608.16183", "type": "理论", "summary": "量子二能级系统的分段通常与基于马约拉纳费米子对的编码相关联——一种可操作的分段。我们通过将 Székely 的经典“半硬币”嵌入到非 Hermitian Kerin 空间中来展示另一种代数分数化。 $(q+pz)^{1/2}$ 的系数定义了一个有符号序列和一个描述双正交半量子位的归一化非厄米双正交算子。我们证明两个这样的对象通过有符号范德蒙卷积融合成任意纯量子位，集体 $N\\ge2$ 向量在 Kerin 空间中为空。半量子位的 $L_1$ 范数采用封闭形式，$\\lVert p\\rVert_1 = 2\\sqrt{q}-\\sqrt{q-p}$。它的 $L_1$ 范数随着偏差单调增加，并在无偏差点 $p=q=1/2$ 处精确地达到其最高值 $\\sqrt{2}$。有趣的是，我们确定了两个结构结果如下。首先，数字奇偶性和 $\\eta$ 度量生成一个杰出的通勤 $\\mathbb Z_2\\times\\mathbb Z_2$ 子群。其次，我们发现 $\\eta$ 度量阻碍了奇偶校验的任何局部 $\\eta$-自伴伙伴，因此半量子位带有 $\\mathbb{Z}_2$ 可观测值，但没有局部 $SU(2)$。\n\n完整的泡利代数只有在融合时才会出现。然后，我们证明了该结构在福克基础的截断中仍然存在：融合的量子位在每个截止点都是精确的，并且范德蒙抵消在符号加权光子数统计中是可见的，并且可以使用现有的腔和俘获离子态合成方法进行测试。最后，我们将这种代数分数化推广到 $1/n$-量子位，这可以通过用 $n$th 根替换平方根来实现。", "authors": [{"name": "Po-Yao Chang"}], "featured_authors": [{"name": "Po-Yao Chang"}], "author_count": 1}, {"id": "2608.16292", "category": "quant-ph", "title": "Quantum Wave-Particle Duality in Free-Electron--Free-Electron Entanglement", "abstract": "Point-particle descriptions of electron-electron interaction omit the coherent longitudinal extent of a free-electron quantum wave packet (QEW). A relativistic two-electron wave-packet theory identifies the longitudinal QEW size as a direct control parameter for entanglement generated by mutual electromagnetic coupling. For two electrons in spatially separated paths, the quadratic interaction phase gives a dimensionless entangling parameter $\\Gee$ and the logarithmic negativity $\\EN=\\operatorname{arsinh}(\\Gee)/\\ln2$. Full time-dependent Schrödinger equation calculations confirm the scaling for narrow QEWs and reveal higher-order Coulomb effects at larger spatial extent. Free drift increases the interaction-point QEW width while preserving the momentum probability distribution, thereby enhancing the subsequently generated entanglement. The results establish a direct connection between free-electron wave-particle duality and bipartite entanglement.", "url": "https://arxiv.org/abs/2608.16292", "type": "理论+数值", "summary": "电子-电子相互作用的点粒子描述忽略了自由电子量子波包（QEW）的相干纵向范围。相对论双电子波包理论将纵向 QEW 尺寸确定为相互电磁耦合产生的纠缠的直接控制参数。对于空间分离路径中的两个电子，二次相互作用相给出无量纲纠缠参数 $\\Gee$ 和对数负性 $\\EN=\\operatorname{arsinh}(\\Gee)/\\ln2$。完全依赖于时间的薛定谔方程计算证实了窄 QEW 的缩放，并揭示了更大空间范围内的高阶库仑效应。自由漂移增加了相互作用点QEW宽度，同时保留了动量概率分布，从而增强了随后生成的纠缠。结果建立了自由电子波粒二象性和二分纠缠之间的直接联系。", "authors": [{"name": "Du Ran"}, {"name": "Jing-Yi Liu"}, {"name": "Dan Jin"}, {"name": "Peng-Yu Su"}, {"name": "Reuven Ianconescu"}, {"name": "Shuai Liu"}, {"name": "Avraham Gover"}], "featured_authors": [{"name": "Du Ran"}, {"name": "Jing-Yi Liu"}, {"name": "Dan Jin"}, {"name": "Reuven Ianconescu"}, {"name": "Shuai Liu"}, {"name": "Avraham Gover"}], "author_count": 7}, {"id": "2608.16358", "category": "quant-ph", "title": "Negative quasiprobability trajectories for Bell-diagonal states under local decoherence", "abstract": "The fluctuation theorem (FT) relates microscopic trajectory distributions to macroscopic averages. Using quasiprobability trajectories, this framework has recently been extended to quantum information dynamics. Despite sharing the form of conventional thermodynamic FTs, information FTs involve quasiprobabilities whose negativity and statistical properties remain poorly understood. We analytically determine the properties of negative distributions based on the two-qubit Bell-diagonal states evolving under local dephasing, depolarizing, and amplitude-damping channels. We show that the occurrence of negative quasiprobabilities is not determined by the entanglement or Bell nonlocality of the initial state. Instead, a diagonal-interference decomposition of the transition quasiprobability provides a sufficient condition for negativity. More importantly, we prove that quasiprobability distributions containing negative weights can violate Horváth's necessary and sufficient criterion for the Jensen-Steffensen inequality to hold for every continuous convex function, even though the specific exponential Jensen-like relation enforced by the FT and the quantum data-processing inequality remains valid. This trajectory-level contrast with classical stochastic descriptions reveals a distinctive feature of quantum information dynamics that is invisible when only the corresponding average-level information inequalities are considered.", "url": "https://arxiv.org/abs/2608.16358", "type": "理论", "summary": "波动定理 (FT) 将微观轨迹分布与宏观平均值联系起来。使用准概率轨迹，该框架最近已扩展到量子信息动力学。尽管共享传统热力学 FT 的形式，但信息 FT 涉及准概率，其负性和统计特性仍然知之甚少。我们根据局部相移、去极化和振幅阻尼通道下演化的两个量子位贝尔对角态状态，分析确定了负分布的性质。我们证明负准概率的出现并不是由初始状态的纠缠或贝尔非定域性决定的。相反，转移准概率的对角线干涉分解为负性提供了充分条件。\n\n更重要的是，我们证明包含负权重的准概率分布可能违反 Horváth 的 Jensen-Steffensen 不等式对每个连续凸函数成立的充分必要条件，即使 FT 和量子数据处理不等式强制执行的特定指数类 Jensen 关系仍然有效。这种轨迹水平与经典随机描述的对比揭示了量子信息动力学的一个显着特征，当仅考虑相应的平均水平信息不等式时，该特征是不可见的。",
