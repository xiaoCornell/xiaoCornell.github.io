"authors": [{"name": "Qing Yu"}, {"name": "Kun Zhang"}, {"name": "Yang-Yang Chen"}, {"name": "Xiao-Hui Wang"}], "featured_authors": [{"name": "Qing Yu"}, {"name": "Kun Zhang"}, {"name": "Yang-Yang Chen"}, {"name": "Xiao-Hui Wang"}], "author_count": 4}, {"id": "2608.16439", "category": "quant-ph", "title": "Optimal bounds on the classical value of the repeated CHSH game", "abstract": "We show that the maximum winning probability in the repeated CHSH game for classical strategies is at most $\\left(\\frac{1+\\sqrt{5}}{4}\\right)^n$. Together with a matching lower bound by Barak et al. (FOCS'2008), this determines the asymptotic value of the repeated CHSH game exactly. We also show that, if an XOR game has a gap between classical and quantum values, there is also a gap between the asymptotic values for the repeated game.", "url": "https://arxiv.org/abs/2608.16439", "type": "理论", "summary": "我们证明，经典策略的重复 CHSH 博弈中的最大获胜概率至多为 $\\left(\\frac{1+\\sqrt{5}}{4}\\right)^n$。与 Barak 等人的匹配下界一起。 (FOCS'2008)，这准确地确定了重复 CHSH 博弈的渐近值。我们还表明，如果异或游戏的经典值和量子值之间存在差距，那么重复游戏的渐近值之间也存在差距。", "authors": [{"name": "Andris Ambainis"}], "featured_authors": [{"name": "Andris Ambainis"}], "author_count": 1}, {"id": "2608.16452", "category": "quant-ph", "title": "Strong Converse Exponents of Quantum Soft Covering and Privacy Amplification", "abstract": "We determine the exact strong converse exponent of quantum soft covering under the sandwiched R{é}nyi divergence for all orders $\\alpha\\in[\\frac{1}{2},\\infty)$. For $\\alpha\\in[\\frac{1}{2},1)$, the exponent is characterized by the two-parameter club-sandwiched mutual information, whereas for $\\alpha\\in[1,\\infty)$, it is characterized by the order-$\\alpha$ sandwiched R{é}nyi mutual information. We also determine the exact strong converse exponent of privacy amplification against quantum side information under the sandwiched R{é}nyi divergence for $\\alpha\\in(2,\\infty)$, expressed in terms of the corresponding order-$\\alpha$ sandwiched R{é}nyi conditional entropy. To the best of our knowledge, these results provide the first exact characterization of the strong converse exponent of quantum soft covering and the first precise operational interpretation of the two-parameter club-sandwiched mutual information in the quantum setting. The key ingredient is that we establish the exponential rate of the $K$-functional, which is instrumental in deriving the strong converse exponent of quantum soft covering for $\\alpha\\in[\\frac{1}{2},1)$.", "url": "https://arxiv.org/abs/2608.16452", "type": "理论", "summary": "我们确定了所有阶 $\\alpha\\in[\\frac{1}{2},\\infty)$ 夹层 R{é}nyi 散度下量子软覆盖的精确强逆指数。对于$\\alpha\\in[\\frac{1}{2},1)$，指数由二参数俱乐部夹心互信息表征，而对于$\\alpha\\in[1,\\infty)$，指数由阶$\\alpha$夹心R{é}nyi互信息表征。我们还确定了 $\\alpha\\in(2,\\infty)$ 的夹层 R{é}nyi 散度下针对量子边信息的隐私放大的精确强逆指数，以相应的阶 $\\alpha$ 夹层 R{é}nyi 条件熵表示。据我们所知，这些结果提供了量子软覆盖强逆指数的第一个精确表征，以及量子环境中双参数俱乐部夹心互信息的第一个精确操作解释。关键在于我们建立了 $K$ 泛函的指数率，这有助于推导 $\\alpha\\in[\\frac{1}{2},1)$ 的量子软覆盖的强逆指数。", "authors": [{"name": "Shi-Bing Li"}, {"name": "Hongsen Qiu"}, {"name": "Xinyu Zhang"}], "featured_authors": [{"name": "Shi-Bing Li"}, {"name": "Hongsen Qiu"}, {"name": "Xinyu Zhang"}], "author_count": 3}, {"id": "2608.16527", "category": "quant-ph", "title": "Two-Photon Bound States in the Continuum: A No-Go Theorem and Long-Lived Quasi-Bound States", "abstract": "Two-photon bound states in the continuum provide a stringent setting in which quantum interference must suppress radiative decay despite photon--photon interactions. Here, we prove a no-go theorem showing that a single nonlinear mode linearly coupled to a noninteracting bosonic continuum cannot support an interaction-active two-photon bound state in the continuum, provided the local spectral density vanishes only at isolated energies. Apart from this regularity condition, the result is independent of the continuum dispersion and the frequency-dependent coupling. Although such an exact bound state is forbidden, long-lived two-photon quasi-bound states remain possible. For a giant Kerr cavity nonlocally coupled to a waveguide, we derive the asymptotic scaling of the two-photon decay rate with the coupling-point separation from weak nonlinearity to the hard-core limit. We further identify a regime in which the two-photon resonance is substantially longer lived than the single-photon excitation. Our work establishes the limits of exact multiphoton confinement while opening a route to engineering long-lived interacting few-photon states.", "url": "https://arxiv.org/abs/2608.16527", "type": "理论", "summary": "连续谱中的双光子束缚态提供了一个严格的设置，其中尽管光子与光子相互作用，但量子干涉必须抑制辐射衰变。在这里，我们证明了一个不可行定理，表明线性耦合到非相互作用玻色连续体的单个非线性模式不能支持连续体中的相互作用活跃双光子束缚态，前提是局部谱密度仅在孤立能量处消失。除了这种规律性条件之外，结果与连续色散和频率相关耦合无关。尽管这种精确的束缚态是被禁止的，但长寿命的双光子准束缚态仍然是可能的。对于非局域耦合到波导的巨型克尔腔，我们推导了双光子衰减率的渐近标度以及从弱非线性到硬核极限的耦合点分离。我们进一步确定了一种机制，其中双光子共振的寿命比单光子激发的寿命要长得多。我们的工作确立了精确多光子限制的极限，同时开辟了设计长寿命相互作用少光子状态的途径。", "authors": [{"name": "Yue Chang"}], "featured_authors": [{"name": "Yue Chang"}], "author_count": 1}, {"id": "2608.16532", "category": "quant-ph", "title": "Quantum Permutations and Beyond Quantum Controlled Reference Frames", "abstract": "Quantum permutations, or magic unitaries, have in recent years been explored in the context of identifying `genuinely quantum' isometries of graphs. Here, we import this tool in physics, showing that quantum permutations yield a generalisation of quantum reference frames in a discrete setting that is reminiscent of the passage from special to general relativity. We show that the typical quantum reference frames framework corresponds to quantum permutations classified as `classical' in the mathematical literature, and which we demonstrate are quantum controlled transformations (superpositions of classical coordinate maps). Genuinely quantum permutations (i) allow to construct \\emph{non--commuting} quantum reference frames (ii) correspond to \\emph{local}, as opposed to global, superpositions of transformations. Strikingly, we find that the non-commutativity of quantum fields, when used as reference systems, is exactly what implies that the change of frame is achieved through a genuine quantum permutation. We illustrate the above with several examples in both first and second quantization formalism, which demonstrate (a) simultaneous control on non--commuting variables, (b) the existence of bipartite states that can be localized with a genuine quantum permutation and cannot be localized with the usual quantum reference frame transformations (without introducing additional degrees of freedom), (c) extension of the Ising model symmetries to genuinely quantum permutations, and (d) extension of the symmetries of a scalar field action on curved spacetime to genuinely quantum permutations. While we have in mind applications in quantum gravity, we expect our formalism to be of interest in a wide range of topics in quantum information.", "url": "https://arxiv.org/abs/2608.16532", "type": "理论", "summary": "近年来，人们在识别图的“真正量子”等距的背景下探索了量子排列或神奇酉。在这里，我们在物理学中引入了这个工具，表明量子排列在离散设置中产生了量子参考系的概括，这让人想起从狭义相对论到广义相对论的转变。我们证明了典型的量子参考系框架对应于数学文献中归类为“经典”的量子排列，并且我们证明了它是量子控制变换（经典坐标图的叠加）。真正的量子排列 (i) 允许构造 \\emph{non-commuting} 量子参考系 (ii) 对应于 \\emph{local}，而不是全局变换的叠加。引人注目的是，我们发现，当量子场用作参考系统时，其不可交换性正是意味着框架的变化是通过真正的量子排列来实现的。\n\n我们用第一和第二量子化形式主义中的几个例子来说明上述内容，这些例子证明了（a）对非交换变量的同时控制，（b）可以用真正的量子排列进行局域化并且不能用通常的量子参考系变换（不引入额外的自由度）进行局域化的二分态的存在，（c）将伊辛模型对称性扩展到真正的量子排列，以及（d）标量场作用的对称性的扩展从弯曲时空到真正的量子排列。虽然我们考虑的是量子引力中的应用，但我们期望我们的形式主义能够引起量子信息中广泛主题的兴趣。", "authors": [{"name": "Ofek Bengyat"}, {"name": "Časlav Brukner"}, {"name": "Marios Christodoulou"}], "featured_authors": [{"name": "Ofek Bengyat"}, {"name": "Časlav Brukner"}, {"name": "Marios Christodoulou"}], "author_count": 3}, {"id": "2608.16595", "category": "quant-ph", "title": "Krylov complexity of anyons", "abstract": "Anyons obey fractional statistics that lie between bosonic and fermionic statistics, giving rise to a broad range of intriguing phenomena. However, how anyonic statistics govern quantum-state complexity is still largely unexplored. In this work, we investigate the interplay between the statistical phase and on-site interactions in the anyon-Hubbard model, identifying exact quantum many-body scar eigenstates and novel quench dynamics. The Krylov complexity exhibits perfect periodic revivals independent of the statistical phase in the scarred dynamics, whereas after a quench it depends on both the statistical phase and the interaction strength. In the strong-interaction regime, we find approximate scarred dynamics, while in the weak-interaction regime the state spreads over Krylov space and the complexity ultimately saturates. Moreover, for the bosonic initial state, the complexity of fermions exhibits the lowest saturation value, and vice versa. For fractional statistics, the saturation plateau is minimized when the post-quench statistical phase is close to that of the initial state. Our results demonstrate the central role of the statistical phase in governing many-body dynamics and provide new insights into Krylov complexity and quantum many-body scars.", "url": "https://arxiv.org/abs/2608.16595", "type": "理论", "summary": "任意子服从介于玻色子统计和费米子统计之间的分数统计，从而产生了一系列有趣的现象。然而，任意子统计如何控制量子态复杂性仍然很大程度上未被探索。在这项工作中，我们研究了任意子哈伯德模型中统计阶段和现场相互作用之间的相互作用，识别精确的量子多体疤痕本征态和新颖的淬灭动力学。克雷洛夫复杂度表现出完美的周期性复兴，与伤痕动力学中的统计相位无关，而在淬灭之后，它取决于统计相位和相互作用强度。在强相互作用状态下，我们发现近似的疤痕动力学，而在弱相互作用状态下，状态在克雷洛夫空间上扩散，复杂性最终饱和。此外，对于玻色子初始态，费米子的复杂度表现出最低的饱和值，反之亦然。对于分数统计，当淬火后统计阶段接近初始状态时，饱和平台最小化。\n\n我们的结果证明了统计阶段在控制多体动力学中的核心作用，并为克雷洛夫复杂性和量子多体疤痕提供了新的见解。", "authors": [{"name": "Ya-Nan Wang"}, {"name": "Qing-Min Hu"}, {"name": "Wen-Long You"}, {"name": "Gaoyong Sun"}], "featured_authors": [{"name": "Ya-Nan Wang"}, {"name": "Qing-Min Hu"}, {"name": "Wen-Long You"}, {"name": "Gaoyong Sun"}], "author_count": 4}, {"id": "2608.16608", "category": "quant-ph", "title": "Discretisation of quantum feedback networks for implementation on a quantum computer", "abstract": "Quantum Feedback Network Theory (also known colloquially as the SLH-framework) is a powerful tool for modeling systems in quantum optics. This paper describes a method for discretising SLH-networks such that they can be implemented on a quantum computer. Building on a discretisation theorem for quantum stochastic differential equations, we establish strong convergence, uniformly on compact time intervals, of the discretised system to the continuous SLH-network as the discretisation mesh goes to zero.", "url": "https://arxiv.org/abs/2608.16608", "type": "理论", "summary": "量子反馈网络理论（俗称 SLH 框架）是量子光学系统建模的强大工具。本文描述了一种离散 SLH 网络的方法，以便它们可以在量子计算机上实现。基于量子随机微分方程的离散化定理，当离散化网格变为零时，我们在紧凑的时间间隔上一致地建立了离散系统到连续 SLH 网络的强收敛。", "authors": [{"name": "Luc Bouten"}, {"name": "John Gough"}], "featured_authors": [{"name": "Luc Bouten"}, {"name": "John Gough"}], "author_count": 2}, {"id": "2608.16619", "category": "quant-ph", "title": "On Casimir force between two real metallic plates", "abstract": "The corrections to Casimir pressure (force) on two plates of real metal described by the dielectric constant of the Drude, Drude-Lorentz, Drude-Smith and plasma models at the finite temperature and conductivity are considered. We consider the contour integral lost in the Lifshitz formula and discuss inconsistencies for the corrections to the Casimir force given in the literature. Numerical and analytical results in the near and far zones are presented. The two first-order correction obtained due to the actual dielectric constant of the metal coincided with the literature data.", "url": "https://arxiv.org/abs/2608.16619", "type": "理论+数值", "summary": "考虑了在有限温度和电导率下由德鲁德、德鲁德-洛伦兹、德鲁德-史密斯和等离子体模型的介电常数描述的两块真实金属板上的卡西米尔压力（力）的修正。我们考虑了 Lifshitz 公式中丢失的轮廓积分，并讨论了文献中给出的卡西米尔力修正的不一致之处。给出了近区和远区的数值和分析结果。由于金属的实际介电常数得到的两次一阶修正与文献数据吻合。", "authors": [{"name": "Michael V. Davidovich"}], "featured_authors": [{"name": "Michael V. Davidovich"}], "author_count": 1}, {"id": "2608.16674", "category": "quant-ph", "title": "Crossover from Fast Scrambling to Operator Confinement Tuned by an Auxiliary Qubit", "abstract": "We demonstrate a static, disorder-free spin chain Hamiltonian which, by tuning the coupling to an auxiliary qubit, realizes a crossover between super-ballistic, ancilla-accelerated scrambling and sub-ballistic operator confinement. Our minimal model is the mixed-field Ising chain with a spin-1/2 ancilla coupled to its longitudinal magnetization. The ancilla mediates an effective all-to-all interaction which accelerates operator spreading and entanglement growth when weakly coupled, but rapidly saturates its entanglement and projects spin chain operators into effectively frozen subspaces when the ancilla coupling is strong. We locate this crossover independently through both a divergent peak in the mutual-information saturation time near $\\lambda_c N/h \\approx 8$ and an exponential suppression of the late-time OTOC growth rate, $\\log\\alpha \\propto 1/\\lambda$. Through a Feshbach-Fano projection and Schrieffer-Wolff transformation, we reveal an effective hidden symmetry on the chain which confines operators on the chain for a time exponential in the coupling strength. This reconciles the fast, $\\log(N)$ scrambling reported for random-unitary-circuit realizations of the star geometry with the confinement previously found in its time-independent Hamiltonian analog, showing both emerge from a single Hamiltonian family as a function of one dimensionless parameter.", "url": "https://arxiv.org/abs/2608.16674", "type": "理论", "summary": "我们展示了一种静态、无序自旋链哈密顿量，它通过调整与辅助量子位的耦合，实现了超弹道、辅助加速扰乱和亚弹道算子限制之间的交叉。我们的最小模型是混合场 Ising 链，其自旋 1/2 辅助与其纵向磁化耦合。辅助介导有效的全对所有交互，在弱耦合时加速算子扩散和纠缠增长，但当辅助耦合强时，其纠缠迅速饱和并将自旋链算子投射到有效冻结的子空间中。我们通过 $\\lambda_c N/h \\approx 8$ 附近互信息饱和时间的发散峰值和后期 OTOC 增长率的指数抑制 $\\log\\alpha \\propto 1/\\lambda$ 独立地定位此交叉。通过 Feshbach-Fano 投影和 Schrieffer-Wolff 变换，我们揭示了链上有效的隐藏对称性，该对称性将算子限制在链上，耦合强度呈时间指数。\n\n这将星形几何的随机酉电路实现的快速、$\\log(N)$扰乱与先前在其时间无关的哈密顿模拟中发现的限制相协调，表明两者都来自作为一个无量纲参数的函数的单个哈密顿族。", "authors": [{"name": "Ryan Buechele"}, {"name": "Joseph Szabo"}, {"name": "Nandini Trivedi"}], "featured_authors": [{"name": "Ryan Buechele"}, {"name": "Joseph Szabo"}, {"name": "Nandini Trivedi"}], "author_count": 3}, {"id": "2608.16702", "category": "quant-ph", "title": "Time-optimal quantum gates with bang-bang control in multilevel systems", "abstract": "We determine the optimal quantum manipulation protocols for implementing high-fidelity, fast single-qubit gates. We demonstrate that the time-optimal pulse sequence is a ``bang-bang'' sequence: discrete pulses of either positive or negative maximum amplitude or zero. The non-adiabatic bang-bang pulse sequence minimizes gate duration providing a speedup for low-frequency architectures. We first derive the protocol for a transversally driven two-level system, extracting exact analytic expressions for minimum gate times. We then extend this framework to general multilevel architectures, identifying conditions that enable the coherent suppression of leakage errors. Using the fluxonium circuit as a representative case study, we optimize $X/2$ and $Y/2$ gates through a combination of discrete bang sequences and continuous waveform smoothing. This approach preserves near-optimal execution speeds while mitigating transitions outside the computational subspace. Open-system simulations demonstrate that these sequences outperform commensurate and resonant pulse schemes across different fluxonium regimes, achieving low-error manipulation significantly faster than standard resonant control, even in the presence of $1/f$ flux noise and dissipation.", "url": "https://arxiv.org/abs/2608.16702", "type": "数值", "summary": "我们确定了用于实现高保真、快速单量子位门的最佳量子操纵协议。我们证明了时间最优脉冲序列是一个“bang-bang”序列：正或负最大幅度或零的离散脉冲。非绝热 bang-bang 脉冲序列最大限度地缩短了栅极持续时间，从而为低频架构提供了加速。我们首先推导出横向驱动的两级系统的协议，提取最小门时间的精确分析表达式。然后，我们将该框架扩展到通用的多级架构，识别能够一致抑制泄漏错误的条件。使用 Fluxium 电路作为代表性案例研究，我们通过离散爆炸序列和连续波形平滑的组合来优化 $X/2$ 和 $Y/2$ 门。这种方法保留了接近最佳的执行速度，同时减轻了计算子空间之外的转换。\n\n开放系统仿真表明，这些序列在不同的 Fluxium 状态下优于相应的谐振脉冲方案，即使在存在 $1/f$ 磁通噪声和耗散的情况下，也能比标准谐振控制快得多地实现低误差操作。", "authors": [{"name": "Valentín Reparaz"}, {"name": "Santiago Ferreyra"}, {"name": "María José Sánchez"}, {"name": "Daniel Domínguez"}, {"name": "Leandro Tosi"}], "featured_authors": [{"name": "Valentín Reparaz"}, {"name": "Santiago Ferreyra"}, {"name": "María José Sánchez"}, {"name": "Daniel Domínguez"}, {"name": "Leandro Tosi"}], "author_count": 5}, {"id": "2608.16732", "category": "quant-ph", "title": "The preferred-time problem in the conditional interpretation of time", "abstract": "In timeless formulations of quantum theory, the Page-Wootters proposal (PW) recovers time and dynamics as relative clock-and-world states. By interpreting the total timeless system as a clock entangled with the world, the states having a definite clock reading appear to recover the temporal states of the world as relative states, and dynamics emerges. But an entangled state admits infinitely many decompositions as a superposition of product states, each decomposition corresponding to a different but equally valid time operator of the same clock system. Different valid choices of the time operator for the same clock system lead to different physical histories, where the world states in a history are superpositions of the world states from another history. Fixing one operator as \"the\" clock time would import the temporal meaning that the Page-Wootters proposal is meant to explain in the first place. Therefore, the interpretation of PW that the world state is passively conditioned on the clock state cannot hold. The timeless state is resolved into time-dependent states by the intrinsic pointer observables of the world, without having to outsource the role of the time operator to a separate clock. Fortunately, the formalism of PW remains valid, provided that it is interpreted in terms of intrinsic pointer observables of the world itself.", "url": "https://arxiv.org/abs/2608.16732", "type": "理论+数值", "summary": "在量子理论的永恒表述中，佩奇-伍特斯提案 (PW) 将时间和动力学恢复为相对的时钟和世界状态。通过将整个永恒系统解释为与世界纠缠在一起的时钟，具有明确时钟读数的状态似乎将世界的时间状态恢复为相对状态，并且出现了动态。但是纠缠态允许无限多个分解作为乘积状态的叠加，每个分解对应于同一时钟系统的不同但同样有效的时间运算符。同一时钟系统的时间算子的不同有效选择会导致不同的物理历史，其中一个历史中的世界状态是另一个历史中的世界状态的叠加。将一个运算符固定为“the”时钟时间将导入 Page-Wootters 提案首先要解释的时间含义。因此，关于世界状态被动地以时钟状态为条件的PW解释是站不住脚的。\n\n永恒状态通过世界的内在指针可观察量解析为时间相关状态，而不必将时间运算符的角色外包给单独的时钟。幸运的是，PW 的形式主义仍然有效，只要它是根据世界本身的内在指针可观察量来解释的。", "authors": [{"name": "Ovidiu Cristinel Stoica"}], "featured_authors": [{"name": "Ovidiu Cristinel Stoica"}], "author_count": 1}, {"id": "2608.16835", "category": "quant-ph", "title": "Classical-limit formula for matrix elements between bound states of distinct one-dimensional potentials", "abstract": "A classical-limit formula is derived for matrix elements between bound states of distinct one-dimensional potentials. We leave open the physical interpretation of the potentials, but generally envision them to be Born-Oppenheimer-type potentials with the position variable $x$ identifying with a slowly evolving degree of freedom of the system. For instance, $x$ could represent the internuclear separation in a diatomic molecule, with the potentials being potential energy curves for different electronic states. In this scenario, the matrix elements could be, e.g., conventional Franck-Condon factors. To test the derived formula, we assume functional forms for the potentials and operator that afford analytical solutions for the matrix elements. As the classical limit is approached, the computed matrix elements exhibit a clear tendency towards the classical-limit formula, providing strong validation for the formula. In future work, we anticipate using the formula to model inhomogeneous excitation spectra of atoms in one-dimensional optical lattices, with an eye towards improved optical lattice clock performance.", "url": "https://arxiv.org/abs/2608.16835", "type": "理论+数值", "summary": "推导了不同一维势的束缚态之间的矩阵元素的经典极限公式。我们对势的物理解释保持开放，但通常将它们设想为玻恩-奥本海默型势，位置变量 $x$ 与系统缓慢演化的自由度相一致。例如，$x$ 可以代表双原子分子中的核间分离，其中势能是不同电子态的势能曲线。在这种情况下，矩阵元素可以是例如传统的弗兰克-康登因子。为了测试导出的公式，我们假设为矩阵元素提供解析解的势和运算符的函数形式。当接近经典极限时，计算出的矩阵元素表现出明显的经典极限公式趋势，为该公式提供了强有力的验证。在未来的工作中，我们预计使用该公式来模拟一维光学晶格中原子的非均匀激发光谱，着眼于提高光学晶格时钟性能。", "authors": [{"name": "K. Beloy"}], "featured_authors": [{"name": "K. Beloy"}], "author_count": 1}, {"id": "2608.16857", "category": "quant-ph", "title": "Fault-Tolerant Quantum Computation with Adversarial Errors", "abstract": "We prove a fault-tolerance theorem for quantum computation against adversarial noise. For every quantum circuit on $\\bar{N}$ logical qudits of depth $\\bar{T}$, we construct a fault-tolerant circuit on $N=\\text{poly}(\\bar{N})$ physical qudits of depth $\\bar{T}\\cdot\\bar{N}^{o(1)}$, which is robust against an adversary who may arbitrarily choose and corrupt an almost-linear number $N^{1-o(1)}$ of physical qudits at each time step. This robustness significantly improves upon prior fault-tolerance theorems, which assumed corruptions were either local and stochastic, or else only act on a polynomially vanishing fraction of qudits. Our fault-tolerance scheme addresses a key bottleneck towards constructing quantum PCPs via the circuit-to-Hamiltonian mapping of Anshu, Breuckmann, and Nguyen (STOC'24). More fundamentally, our result demonstrates that fault-tolerant quantum computation remains possible under noise models that are global, worst-case, and non-Markovian over the full duration of the computation, directly countering concerns that correlated noise could fundamentally undermine quantum fault tolerance. Our construction is based on a new family of subsystem product codes we develop, which have large dimension and distance along with low-weight parity-checks, and which support transversal non-Clifford gates. We show how to perform single-shot fault-tolerant error correction on these codes using a Floquet-like procedure based on the local testability of classical tensor codes. We then obtain a universal fault-tolerance scheme using repeated code switching in a hypercubic qudit architecture. Finally, we recursively compose our scheme with itself to reduce an initially exponential qudit dimension down to a constant.", "url": "https://arxiv.org/abs/2608.16857", "type": "理论", "summary": "我们证明了针对对抗性噪声的量子计算的容错定理。对于深度为 $\\bar{T}$ 的 $\\bar{N}$ 逻辑量子数上的每个量子电路，我们在深度为 $\\bar{T}\\cdot\\bar{N}^{o(1)}$ 的 $N=\\text{poly}(\\bar{N})$ 物理量子数上构造一个容错电路，该电路对于任意选择和破坏几乎线性数量 $N^{1-o(1)}$ 物理量子数的对手来说具有鲁棒性。每个时间步的 qudits。这种鲁棒性显着改进了先前的容错定理，该定理假设损坏要么是局部的、随机的，要么只作用于量子数的多项式消失部分。我们的容错方案通过 Anshu、Breuckmann 和 Nguyen (STOC'24) 的电路到哈密尔顿映射解决了构造量子 PCP 的关键瓶颈。更重要的是，我们的结果表明，在整个计算期间，在全局、最坏情况和非马尔可夫的噪声模型下，容错量子计算仍然是可能的，直接反驳了相关噪声可能从根本上破坏量子容错的担忧。\n\n我们的构造基于我们开发的一系列新的子系统产品代码，这些代码具有大尺寸和距离以及低重量奇偶校验，并且支持横向非 Clifford 门。我们展示了如何使用基于经典张量代码的局部可测试性的类似 Floquet 的过程对这些代码执行单次容错纠错。然后，我们在超立方 Qudit 架构中使用重复代码切换获得通用容错方案。最后，我们递归地组合我们的方案，将最初的指数 qudit 维度减少到一个常数。", "authors": [{"name": "Nikolas P. Breuckmann"}, {"name": "Louis Golowich"}, {"name": "Umesh Vazirani"}], "featured_authors": [{"name": "Nikolas P. Breuckmann"}, {"name": "Louis Golowich"}, {"name": "Umesh Vazirani"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
