emonstrating their direct relevance to spintronics as well.", "url": "https://arxiv.org/abs/2608.16368", "type": "理论+数值", "summary": "磁性材料的光学响应通常通过磁性空间群（MSG）进行分类，其中自旋和晶格通过相对论自旋轨道相互作用锁定。然而，大多数光学可观测量主要受非相对论物理学控制，因此纯粹基于 MSG 的描述可能会忽略重要的见解。在这里，我们系统地展示了在非相对论水平上运行的自旋空间群（SSG）为分析磁体的各种光学响应提供了更广泛和更具预测性的框架。着眼于线性光学吸收，我们推导了 SSG 施加的变换规则，并表明它们生成有效的实空间点群，这可以加强电荷响应系数之间的关系，而传统 MSG 分析中没有这种关系。我们阐述了具有可调谐自旋轨道耦合的利布晶格交变磁体模型的基本原理，其中即使相对论能带分裂变得相当大，SSG 对线性二色性的预测仍然非常准确。\n\n我们通过对两种互变磁性候选物的第一性原理计算，进一步确定了该框架的预测能力：锕系元素 UCr2Si2C，尽管其自旋轨道耦合很强，并且磁对称性具有明显的各向异性，但其光学吸收几乎保持各向同性；过渡金属氟化物 RbMnF4，其中双折射通过仅由 SSG 出现的对称性限制在单个平面内。最后，我们将这一概念扩展到共面非共线反铁磁体 ScMnO3 的自旋霍尔响应，其中 SSG 解释了计算的自旋霍尔系数的层次结构，并证明了它们与自旋电子学的直接相关性。", "authors": [{"name": "Javier Sivianes"}, {"name": "Enrique Boquete-Someso"}, {"name": "Daniel Hernangómez-Pérez"}, {"name": "Julen Ibañez-Azpiroz"}], "featured_authors": [{"name": "Javier Sivianes"}, {"name": "Enrique Boquete-Someso"}, {"name": "Daniel Hernangómez-Pérez"}, {"name": "Julen Ibañez-Azpiroz"}], "author_count": 4}, {"id": "2608.16450", "category": "cond-mat", "title": "Insights into the Structural and Orientational Ordering of 2D Metal Halide Perovskites", "abstract": "Metal halide perovskite nanoplatelets combine quantum confinement with structural anisotropy, yet how thickness and processing govern their internal crystal lattice versus collective organization remains unresolved. In this study, we separate internal structure, superlattice organization, and film texture using 2-5 monolayer CsPbBr3 nanoplatelets and larger nanocrystals across spin-coating and drop-casting routes. Grazing incidence X-ray diffraction analysis of the specimens indicates that orthorhombic-compatible signatures recur throughout the thickness and deposition series, with a preserved lattice-morphology relationship in which 020/040 and 101/202 lattice planes are associated with the platelet thickness and lateral dimensions, respectively. Upon deposition on the substrate, we notice a thickness-dependent crossover: 2-monolayer nanoplatelets remain predominantly face-on across deposition routes, whereas thicker nanoplatelets show marked processing sensitivity and orientational disorder. Processing therefore can be used as a tool to direct the NPL packing, establishing thickness as a key determinant of processing sensitivity.", "url": "https://arxiv.org/abs/2608.16450", "type": "数值", "summary": "金属卤化物钙钛矿纳米片将量子限制与结构各向异性结合在一起，但厚度和加工如何控制其内部晶格与集体组织仍然悬而未决。在这项研究中，我们使用 2-5 个单层 CsPbBr3 纳米片和更大的纳米晶体通过旋涂和滴铸路线分离内部结构、超晶格组织和薄膜纹理。样品的掠入射 X 射线衍射分析表明，在整个厚度和沉积系列中，正交相容的特征重复出现，并保留了晶格形态关系，其中 020/040 和 101/202 晶格平面分别与片晶厚度和横向尺寸相关。在基材上沉积后，我们注意到厚度依赖性的交叉：2-单层纳米片在整个沉积路径上主要保持面对面，而较厚的纳米片表现出明显的加工敏感性和取向紊乱。因此，加工可以用作指导 NPL 包装的工具，将厚度确定为加工敏感性的关键决定因素。", "authors": [{"name": "Mustafa Mahmoud Aboulsaad"}, {"name": "German Alvarez Carrero"}, {"name": "Trupthi Devaiah Chonamada"}, {"name": "Germán Salazar Alvarez"}, {"name": "Ute Cappel"}, {"name": "Rafael B. Araujo"}, {"name": "Tomas Edvinsson"}], "featured_authors": [{"name": "Mustafa Mahmoud Aboulsaad"}, {"name": "German Alvarez Carrero"}, {"name": "Trupthi Devaiah Chonamada"}, {"name": "Ute Cappel"}, {"name": "Rafael B. Araujo"}, {"name": "Tomas Edvinsson"}], "author_count": 7}, {"id": "2608.16520", "category": "cond-mat", "title": "Non-invertible Lattice 1-Form Symmetries for Non-Abelian Topological Order", "abstract": "Higher-form symmetries generalize conventional global symmetries and act on lower-dimensional submanifolds of a quantum system. While Abelian topological phases can be organized by 1-form symmetries that form a group, non-Abelian topological phases based on finite groups require 1-form symmetry operators governed by non-invertible fusion algebras. In this work, we make this statement precise in quantum double lattice models $\\mathcal D(G)$ for finite non-Abelian groups $G$. We construct the electric, magnetic, and dyonic 1-form operators directly at the lattice fixed point and show that together they form a complete nonlocal diagnostic algebra for the topological Hilbert space. Using these operators, we explicitly determine the cylinder and torus ground-state subspaces for arbitrary finite $G$. Furthermore, we calculate the microscopic fusion and gluing of the 1-form symmetries and show that their topological deformation properties emerge after projection to the defect-free topological subspace. Our results establish ground states of non-Abelian quantum double models as a concrete microscopic realization of spontaneous non-invertible 1-form symmetry breaking and provide an operator language that may be useful for characterizing such states in quantum processors.", "url": "https://arxiv.org/abs/2608.16520", "type": "理论", "summary": "更高形式的对称性概括了传统的全局对称性，并作用于量子系统的低维子流形。虽然阿贝尔拓扑相可以通过形成群的 1-形式对称性来组织，但基于有限群的非阿贝尔拓扑相需要由不可逆融合代数控制的 1-形式对称性算子。在这项工作中，我们在有限非阿贝尔群 $G$ 的量子双晶格模型 $\\mathcal D(G)$ 中使这一陈述变得精确。我们直接在晶格不动点构造电、磁和动力 1 型算子，并证明它们一起形成拓扑希尔伯特空间的完整非局部诊断代数。使用这些算子，我们明确地确定任意有限 $G$ 的圆柱体和环面基态子空间。此外，我们计算了 1 型对称性的微观融合和粘合，并表明它们的拓扑变形特性在投影到无缺陷拓扑子空间后出现。\n\n我们的结果将非阿贝尔量子双模型的基态建立为自发不可逆 1 型对称破缺的具体微观实现，并提供了一种可能有助于表征量子处理器中此类状态的运算符语言。", "authors": [{"name": "Rafael Flores-Calderón"}, {"name": "Frank Pollmann"}, {"name": "Michael Knap"}], "featured_authors": [{"name": "Rafael Flores-Calderón"}, {"name": "Frank Pollmann"}, {"name": "Michael Knap"}], "author_count": 3}, {"id": "2608.16605", "category": "cond-mat", "title": "Five-terminal quantized transconductance originating from symmetric quantum fluctuations", "abstract": "We consider the renormalization of transport in a quantum contact by the external electromagnetic environment and show that weak quantum fluctuations from a symmetric environment can lead to a quantized transconductance in five-terminal contacts. This mechanism does not work for fewer terminals. We present an implementation of the environment and investigate several example quantum contacts where the quantization takes place.", "url": "https://arxiv.org/abs/2608.16605", "type": "理论", "summary": "我们考虑了外部电磁环境对量子接触中输运的重正化，并表明来自对称环境的微弱量子涨落可以导致五端接触中的量子化跨导。该机制不适用于较少的终端。我们提出了环境的实现，并研究了发生量子化的几个量子接触示例。", "authors": [{"name": "Klaiv Mertiri"}, {"name": "Yuli V. Nazarov"}], "featured_authors": [{"name": "Klaiv Mertiri"}, {"name": "Yuli V. Nazarov"}], "author_count": 2}, {"id": "2608.16616", "category": "cond-mat", "title": "Scarred discrete time crystal in a periodically driven dimerized spin chain", "abstract": "We investigate the emergence of a scarred discrete time crystal (SDTC) phase in a periodically driven dimerized spin chain. While generic interacting Floquet systems are expected to thermalize according to the eigenstate thermalization hypothesis (ETH), we demonstrate that this system hosts quantum many-body scars (QMBS) that induce a regime of weak ergodicity breaking. Through an analysis of Floquet level statistics, entanglement entropy, and eigenstate fidelity, we identify a manifold of low-entanglement states characterized by semi-Poisson statistics embedded within an otherwise thermal spectrum. These scarred states support robust subharmonic oscillations with period doubling, signaling the spontaneous breaking of discrete time-translation symmetry. We show that the SDTC response is robust against a variety of initial state configurations, demonstrating its stability beyond fine-tuned conditions. A finite-size scaling analysis reveals that the time-crystalline lifetime grows with system size within the range accessible to our exact-diagonalization calculations. However, drawing on the general phenomenology of approximate many-body scars, we expect that hybridization between Floquet scars and the thermal continuum will eventually curtail this growth, causing the lifetime to saturate at system sizes beyond our current numerical reach. This characterizes the SDTC as a long-lived metastable dynamical regime rather than a strictly stable thermodynamic phase, providing a comprehensive framework for understanding the interplay between periodic driving and constrained many-body dynamics in disorder-free systems.", "url": "https://arxiv.org/abs/2608.16616", "type": "理论+数值", "summary": "我们研究了周期性驱动的二聚自旋链中疤痕离散时间晶体（SDTC）相的出现。虽然一般相互作用的 Floquet 系统预计会根据本征态热化假说 (ETH) 热化，但我们证明该系统具有量子多体疤痕 (QMBS)，会导致弱遍历性破坏的状态。通过对 Floquet 级统计、纠缠熵和本征态保真度的分析，我们确定了多种低纠缠态，其特征是嵌入热谱中的半泊松统计。这些伤痕累累的状态支持具有周期倍增的鲁棒次谐波振荡，标志着离散时间平移对称性的自发破坏。我们证明了 SDTC 响应对于各种初始状态配置都是稳健的，证明了其超出微调条件的稳定性。有限尺寸缩放分析表明，在我们精确对角化计算可访问的范围内，时间晶体寿命随着系统尺寸的增加而增长。\n\n然而，利用近似多体疤痕的一般现象学，我们预计 Floquet 疤痕和热连续体之间的混合最终将抑制这种增长，导致寿命在超出我们当前数值范围的系统尺寸处达到饱和。这将 SDTC 描述为一种长期存在的亚稳态动力学状态，而不是严格稳定的热力学相，为理解无序系统中周期性驱动和约束多体动力学之间的相互作用提供了一个全面的框架。", "authors": [{"name": "Davood Marripour"}, {"name": "Saeed S. Jahromi"}, {"name": "Jahanfar Abouie"}], "featured_authors": [{"name": "Davood Marripour"}, {"name": "Saeed S. Jahromi"}, {"name": "Jahanfar Abouie"}], "author_count": 3}, {"id": "2608.16617", "category": "cond-mat", "title": "Statistical Mechanics of a Quantum Harmonic Oscillator with Folded Gaussian Frequency", "abstract": "A self-contained statistical-mechanics treatment of a single quantum harmonic oscillator is presented, whose frequency $\\omega$ is drawn from a folded Gaussian distribution: $\\omega=|\\xi|$ with $\\xi\\sim\\mathcal{N}(\\mu,\\sigma^2)$. The exact integral representations for the partition function, internal energy, free energy, heat capacity, and entropy are derived, and analytic approximations are given in two complementary limits---small variance ($\\sigma\\ll\\mu$) via a cumulant expansion, and the zero-center case ($\\mu=0$) via low-frequency asymptotic analysis. The model is extended to $N$ independent oscillators, where the heat capacity is shown to be extensive with self-averaging fluctuations $\\propto N^{-1/2}$, and finally to a disordered oscillator lattice, where the folded-Gaussian kink at $\\omega=0$ produces a soft-mode infrared tail. For a single isolated oscillator with $\\mu=0$, both $C$ and $S$ vanish linearly at low $T$. In the lattice case, the van Hove factor converts this to a $T^d$ power law. The oft-quoted ``third-law violation'' for disordered phonons is here shown to be a spectral property---the absence of an energy gap and a power-law freeze-out---driven by the single-site distribution kink rather than by a genuine Lifshitz tail (which requires rare large-scale spatial fluctuations). The folded Gaussian thus serves as a minimal benchmark for soft-mode disorder thermodynamics.", "url": "https://arxiv.org/abs/2608.16617", "type": "理论", "summary": "提出了单量子谐振子的独立统计力学处理，其频率 $\\omega$ 从折叠高斯分布中得出：$\\omega=|\\xi|$ 和 $\\xi\\sim\\mathcal{N}(\\mu,\\sigma^2)$。导出了配分函数、内能、自由能、热容和熵的精确积分表示，并在两个互补极限下给出了解析近似——通过累积量展开的小方差 ($\\sigma\\ll\\mu$) 和通过低频渐近分析的零中心情况 ($\\mu=0$)。该模型扩展到 $N$ 独立振荡器，其中热容量显示为广泛的自平均波动 $\\propto N^{-1/2}$，并最终扩展到无序振荡器晶格，其中 $\\omega=0$ 处的折叠高斯扭结产生软模式红外尾部。对于 $\\mu=0$ 的单个孤立振荡器，$C$ 和 $S$ 在低 $T$ 时线性消失。在格子情况下，van Hove 因子将其转换为 $T^d$ 幂律。\n\n经常被引用的无序声子的“违反第三定律”在这里被证明是一种光谱特性——不存在能隙和幂律冻结——是由单点分布扭结驱动的，而不是由真正的利夫希茨尾部（这需要罕见的大规模空间涨落）驱动的。因此，折叠高斯函数可以作为软模式无序热力学的最小基准。", "authors": [{"name": "Liu Zhao"}], "featured_authors": [{"name": "Liu Zhao"}], "author_count": 1}, {"id": "2608.16660", "category": "cond-mat", "title": "Topological insulator realization induced by fermionic interaction through BF mediators", "abstract": "This paper demonstrates that ordinary fermions, interacting via a BF mediator, form a renormalized structure with non-trivial topological properties. We explore the analogy between the renormalized fermion and a subset of real three-dimensional topological insulators (TIs) in the vicinity of their single Dirac cones. Using the typical magnitude of TI lattice and gaps, we constrain model parameters. The topological structure induced by radiative corrections enters a class of modified Dirac equations, ensuring the existence of helical gapless near-boundary modes. We derive an effective potential for inter-quasi-particle interactions that incorporates finite-size effects in the axial direction, revealing signatures of spin-orbit coupling and time-reversal invariance. Remarkably, particles with different spins do not interact via the characteristic spin-orbit coupling, and a non-central spin-dependent force arises. We also address the behavior of the system in the phase transition associated with the thin-film limit.", "url": "https://arxiv.org/abs/2608.16660", "type": "理论", "summary": "本文证明，普通费米子通过 BF 介体相互作用，形成具有非平凡拓扑特性的重正化结构。我们探索了重正化费米子和单个狄拉克锥附近的真实三维拓扑绝缘体 (TI) 子集之间的类比。使用 TI 晶格和间隙的典型大小，我们约束模型参数。辐射校正引起的拓扑结构进入一类修正狄拉克方程，保证了螺旋无间隙近边界模式的存在。我们推导了准粒子间相互作用的有效潜力，该相互作用结合了轴向方向的有限尺寸效应，揭示了自旋轨道耦合和时间反转不变性的特征。值得注意的是，具有不同自旋的粒子不会通过特征自旋轨道耦合相互作用，并且会产生非中心自旋相关力。我们还研究了系统在与薄膜极限相关的相变中的行为。", "authors": [{"name": "G. B. de Gracia"}, {"name": "R. da Rocha"}, {"name": "A. A. Nogueira"}, {"name": "M. A. C. de Barcelos"}], "featured_authors": [{"name": "G. B. de Gracia"}, {"name": "R. da Rocha"}, {"name": "A. A. Nogueira"}, {"name": "M. A. C. de Barcelos"}], "author_count": 4}, {"id": "2608.16711", "category": "cond-mat", "title": "Proximity-induced superconductivity in a bilayer graphene quantum point contact", "abstract": "We report the realization of a gate-defined quantum point contact (QPC) in bilayer graphene proximitized by a single aluminum superconducting electrode. Superconducting correlations induced in the ballistic channel enhance the conductance plateaus beyond their normal-state values. In addition, we observe a pronounced above-gap conductance anomaly which serves as a spectroscopic signature of the loss of superconductivity and the associated collapse of the Andreev excess current. By reconstructing the nonlinear current-voltage characteristics, we find that the magnitude of the excess current increases as successive QPC modes are populated. Additionally, we find that the switching current associated with the loss of superconductivity follows the underlying mode structure of the QPC, exhibiting discrete levels consistent with a heat dissipation-driven transition. These results demonstrate that the one-dimensional transport modes of the QPC govern both the equilibrium proximity effect and the non-equilibrium dynamics of the hybrid system.", "url": "https://arxiv.org/abs/2608.16711", "type": "理论", "summary": "我们报告了在双层石墨烯中实现了由单个铝超导电极邻近的栅极定义的量子点接触（QPC）。弹道通道中引起的超导相关性增强了电导平台，使其超出了正常状态值。此外，我们观察到明显的带隙上方电导异常，它是超导性损失和安德烈夫过量电流相关崩溃的光谱特征。通过重建非线性电流-电压特性，我们发现随着连续 QPC 模式的填充，过量电流的幅度会增加。此外，我们发现与超导性损失相关的开关电流遵循 QPC 的基础模式结构，表现出与散热驱动的转变一致的离散水平。这些结果表明，QPC 的一维输运模式控制着混合系统的平衡邻近效应和非平衡动力学。", "authors": [{"name": "Clara Galante-Agero"}, {"name": "Christoph Adam"}, {"name": "Artem O. Denisov"}, {"name": "Jonas D. Gerber"}, {"name": "Markus Niese"}, {"name": "Alexandra Mestre-Torà"}, {"name": "Marta Perego"}, {"name": "Jessica Richter"}, {"name": "Takashi Taniguchi"}, {"name": "Kenji Watanabe"}, {"name": "Klaus Ensslin"}, {"name": "Thomas Ihn"}], "featured_authors": [{"name": "Clara Galante-Agero"}, {"name": "Christoph Adam"}, {"name": "Artem O. Denisov"}, {"name": "Kenji Watanabe"}, {"name": "Klaus Ensslin"}, {"name": "Thomas Ihn"}], "author_count": 12}, {"id": "2608.16719", "category": "cond-mat", "title": "Exact mobility rings in non-Hermitian quasiperiodically decorated Lieb lattices", "abstract": "The mobility ring (MR), a critical boundary in the complex energy plane separating extended and localized states, is fundamental to understanding the Anderson transition in non-Hermitian (NH) disordered systems. While MRs have been extensively studied in one-dimensional (1D) NH quasiperiodic models, rigorous analytical frameworks beyond 1D remain critically scarce. Here, we investigate a class of two-dimensional (2D) quasiperiodically decorated Lieb lattices (QDLLs) featuring complex incommensurate potentials selectively applied to the lattice vertices. By exactly mapping these 2D structures onto NH generalized Aubry-Andr{é}-Harper (AAH) models and leveraging extended-localized transition point, we analytically derive the Lyapunov exponents and obtain exact expressions for the MRs. These exact theoretical boundaries are strongly corroborated by numerical computations of wavefunction fractal dimensions and real-space probability distributions. Furthermore, we reveal distinct evolutionary behaviors of the MRs driven by the quasiperiodic potential strength: systems characterized by $\\kappa=2$ possess a single MR, whereas systems with $\\kappa=3$ undergo a dynamic sequential evolution from a single integrated ring into two independent rings. We hope that our exact results of MRs in 2D will benefit the study of Anderson localizations and MRs in high-dimensional NH systems.", "url": "https://arxiv.org/abs/2608.16719", "type": "理论+数值", "summary": "迁移环 (MR) 是复杂能量平面中分隔扩展态和局域态的关键边界，对于理解非厄米 (NH) 无序系统中的安德森转变至关重要。虽然磁流变已在一维 (1D) NH 准周期模型中得到广泛研究，但一维之外的严格分析框架仍然严重缺乏。在这里，我们研究了一类二维（2D）准周期装饰利布晶格（QDLL），其特征是选择性地应用于晶格顶点的复杂不通约势。通过将这些二维结构精确映射到 NH 广义 Aubry-Andr{é}-Harper (AAH) 模型并利用扩展局部化转变点，我们分析推导了 Lyapunov 指数并获得了 MR 的精确表达式。这些精确的理论边界得到了波函数分形维数和实空间概率分布的数值计算的有力证实。\n\n此外，我们揭示了由准周期势强度驱动的 MR 的独特演化行为：以 $\\kappa=2$ 为特征的系统拥有单个 MR，而 $\\kappa=3$ 的系统经历了从单个集成环到两个独立环的动态顺序演化。我们希望我们在 2D 中的 MR 的精确结果将有助于安德森定位和高维 NH 系统中的 MR 的研究。", "authors": [{"name": "Ming-Jie Tao"}, {"name": "Yi-Ting Wang"}, {"name": "Jing Li"}, {"name": "Hongsheng Hou"}, {"name": "Xiang-Ping Jiang"}, {"name": "Lei Pan"}], "featured_authors": [{"name": "Ming-Jie Tao"}, {"name": "Yi-Ting Wang"}, {"name": "Jing Li"}, {"name": "Hongsheng Hou"}, {"name": "Xiang-Ping Jiang"}, {"name": "Lei Pan"}], "author_count": 6}, {"id": "2608.16720", "category": "cond-mat", "title": "Reduced vortex descriptors linking polycrystallinity in magnetic nanoparticles with polarized magnetic small-angle neutron scattering", "abstract": "Analytical vortex models reduce polarized magnetic small-angle neutron scattering (SANS) from nanoparticle ensembles to a small set of texture descriptors. In this work, we apply this reduction to micromagnetic simulations of polycrystalline iron oxide nanoflowers at a fixed particle size and examine how a controlled parametrization of multigrain disorder is reflected in the remanent descriptors. The particles are represented by explicit Voronoi microstructures, and intraparticle disorder is varied through the intergrain exchange coupling and anisotropy-axis coherence. Fitting each remanent magnetization state to a hyperbolic vortex model reveals a predominantly two-channel organization: the intergrain exchange coupling is associated mainly with the radial vortex profile, whereas the anisotropy-axis coherence is associated mainly with the orientational moment of the vortex-axis distribution. The normalized spin-flip SANS cross sections are accurately represented by independent fits of the analytical linear-vortex SANS expression obtained from the first-order expansion of the hyperbolic profile. The fitted orientational descriptor agrees closely with its independent real-space estimate, whereas the corresponding radial descriptors exhibit a strong global nonlinear relation. This separation identifies which information from the micromagnetic vortex textures is robustly retained by the reduced analytical representation.", "url": "https://arxiv.org/abs/2608.16720", "type": "理论+数值", "summary": "分析涡旋模型将极化磁小角中子散射 (SANS) 从纳米颗粒集合减少到一小组纹理描述符。在这项工作中，我们将这种还原应用于固定粒径的多晶氧化铁纳米花的微磁模拟，并研究多晶无序的受控参数化如何反映在剩余描述符中。颗粒由显式 Voronoi 微观结构表示，颗粒内无序通过晶粒间交换耦合和各向异性轴相干性而变化。将每个剩磁状态拟合到双曲线涡旋模型揭示了主要是双通道组织：晶粒间交换耦合主要与径向涡旋轮廓相关，而各向异性轴相干性主要与涡旋轴分布的取向矩相关。归一化的自旋翻转 SANS 横截面通过从双曲线轮廓的一阶展开获得的分析线性涡 SANS 表达式的独立拟合来精确表示。\n\n拟合的方向描述符与其独立的真实空间估计非常一致，而相应的径向描述符表现出很强的全局非线性关系。这种分离确定了来自微磁涡旋纹理的哪些信息通过简化的分析表示而被稳健地保留。", "authors": [{"name": "M.P. Adams"}, {"name": "J. Leliaert"}, {"name": "A. Michels"}, {"name": "E.M. Jefremovas"}], "featured_authors": [{"name": "M.P. Adams"}, {"name": "J. Leliaert"}, {"name": "A. Michels"}, {"name": "E.M. Jefremovas"}], "author_count": 4}, {"id": "2608.16724", "category": "cond-mat", "title": "Resolving the Magnetic Ground State and Field-Induced Transitions in Magnetic Dirac Semimetal Candidate EuMnSb$_2$", "abstract": "The magnetic structure of a magnetic topological semimetal EuMnSb$_2$ is investigated in fields up to 30 T using polarized and unpolarized neutron diffraction, pulsed-field x-ray magnetic circular dichroism and pulsed-field magnetometry. We determine the zero-field magnetic structures of the Eu and Mn sublattices, and find that magnetic transitions induced by applied fields below 2 T correspond to changes in the magnetic order of the Eu spins alone without detectable perturbation to the order of the Mn spins. An additional magnetic transition is observed at fields close to the saturation field for the Eu spins. We present a mean-field model which describes key features of the magnetic behavior and allows us to estimate the dominant Eu--Eu and Eu--Mn exchange interactions responsible for the coupling between magnetism and electronic topology.", "url": "https://arxiv.org/abs/2608.16724", "type": "理论", "summary": "使用极化和非极化中子衍射、脉冲场 X 射线磁圆二色性和脉冲场磁力测量，在高达 30 T 的磁场中研究了磁性拓扑半金属 EuMnSb$_2$ 的磁结构。我们确定了 Eu 和 Mn 亚晶格的零场磁结构，并发现由低于 2 T 的外加场引起的磁转变对应于单独的 Eu 自旋磁序的变化，而对 Mn 自旋序没有可检测到的扰动。在接近 Eu 自旋饱和场的场处观察到额外的磁转变。我们提出了一个平均场模型，它描述了磁性行为的关键特征，并使我们能够估计负责磁性和电子拓扑之间耦合的主要 Eu--Eu 和 Eu--Mn 交换相互作用。", "authors": [{"name": "Yiu-Fung Chiu"}, {"name": "Jian-Rui Soh"}, {"name": "Sanjay Sharma"}, {"name": "J. Alberto Rodríguez-Velamazán"}, {"name": "John Singleton"}, {"name": "Eugen Weschke"}, {"name": "Oleksandr Prokhnenko"}, {"name": "Oksana Zaharko"}, {"name": "Dharmalingam Prabhakaran"}, {"name": "Stephen J. Blundell"}, {"name": "Paul A. Goddard"}, {"name": "Andrew T. Boothroyd"}], "featured_authors": [{"name": "Yiu-Fung Chiu"}, {"name": "Jian-Rui Soh"}, {"name": "Sanjay Sharma"}, {"name": "Stephen J. Blundell"}, {"name": "Paul A. Goddard"}, {"name": "Andrew T. Boothroyd"}], "author_count": 12}, {"id": "2608.16808", "category": "cond-mat", "title": "Surface weak ferromagnetism", "abstract": "This paper proposes a model of a Néel-ordered antiferromagnet exhibiting a weak ferromagnetic moment restricted to the crystal surface, generated by spin-orbit coupling induced by broken surface symmetries. Depending on crystal termination, the surface magnetic moment can align with identical or opposing signs on the top and bottom surfaces, resulting in a zero Faraday effect paired with a finite Kerr effect upon reflection for the latter configuration.", "url": "https://arxiv.org/abs/2608.16808", "type": "理论", "summary": "本文提出了一种尼尔有序反铁磁体模型，该模型表现出仅限于晶体表面的弱铁磁矩，该铁磁矩是由破缺表面对称性引起的自旋轨道耦合产生的。根据晶体终端，表面磁矩可以与顶部和底部表面上相同或相反的符号对齐，从而在后一种配置的反射时产生零法拉第效应与有限克尔效应。", "authors": [{"name": "Vladimir A. Zyuzin"}], "featured_authors": [{"name": "Vladimir A. Zyuzin"}], "author_count": 1}, {"id": "2608.16847", "category": "cond-mat", "title": "Spectral Edge Rigidity of Quantum Chaotic States", "abstract": "We determine the distribution of fidelity susceptibility for chaotic eigenstates at the spectral edge of Gaussian random-matrix ensembles. Previous work showed that, in the unitary class, the characteristic susceptibility scale of edge states grows as $D^{1/3}$, rather than proportionally to $D$ as in the spectral bulk, reflecting Airy-edge level rigidity. Extending a determinant-based framework introduced for bulk states, we derive the universal edge distributions for both the orthogonal and unitary ensembles. The two symmetry classes share the scaling variable $g/D^{1/3}$ and exhibit a symmetry-dependent cubic suppression of small susceptibilities, while their algebraic large-$g$ tails reflect the corresponding symmetry-dependent level repulsion. Although eigenvector statistics retain their random-matrix form throughout the spectrum, edge rigidity makes low-lying chaotic states parametrically less sensitive to generic perturbations than bulk states. Our results establish universal, symmetry-dependent spectral-edge fidelity-susceptibility statistics in systems whose chaotic dynamics extends down to the ground state.", "url": "https://arxiv.org/abs/2608.16847", "type": "理论", "summary": "我们确定高斯随机矩阵系综谱边缘处混沌本征态的保真度敏感性分布。先前的工作表明，在酉类中，边缘态的特征磁化率随 $D^{1/3}$ 增长，而不是像谱体中那样与 $D$ 成比例增长，反映了艾里边缘能级刚性。扩展为体态引入的基于行列式的框架，我们推导了正交系综和酉系综的通用边缘分布。这两个对称类共享标度变量 $g/D^{1/3}$ 并表现出小磁化率的对称相关立方抑制，而它们的代数大 $g$ 尾部反映了相应的对称相关能级排斥。尽管特征向量统计在整个频谱中保留其随机矩阵形式，但边缘刚性使得低位混沌态在参数上对一般扰动的敏感度低于体态。我们的结果在混沌动力学延伸至基态的系统中建立了通用的、对称性相关的谱边缘保真度磁化率统计。", "authors": [{"name": "Joaquim Telles de Miranda"}, {"name": "Tobias Micklitz"}], "featured_authors": [{"name": "Joaquim Telles de Miranda"}, {"name": "Tobias Micklitz"}], "author_count": 2}, {"id": "2608.16874", "category": "cond-mat", "title": "Size matters more than packing in bimodal colloidal gel compositions", "abstract": "Colloidal gels are frequently modeled as monodisperse particle networks, although practical formulations commonly contain particles with multiple characteristic sizes. Here, we use large-scale, hydrodynamically resolved simulations of colloidal depletion gels to isolate the effects of particle size and local packing in bimodal systems with a small-to-large size ratio of 1:2. Increasing the large-particle fraction introduces new heterotypic angular motifs and substantially increases the fraction of bonds participating in tetrahedral structures, with a maximum at intermediate composition. However, these additional rigid motifs do not reorganize into larger or more highly connected tetrahedral aggregates. The mean coordination and characteristic aggregate size remain nearly composition independent. By contrast, the void and cluster-size distributions coarsen systematically as the large-particle fraction increases. These mesoscale distributions largely collapse when normalized by a composition-dependent particle length scale, indicating that changes in composition primarily rescale gel architecture rather than producing distinct rigid-network topologies. An elastic modulus estimated using Cauchy-Born theory similarly follows this effective length scale more closely than the abundance of local tetrahedral motifs. These results show that, for moderate size disparity, particle size controls the structural scale and predicted mechanical response of bimodal colloidal gels more strongly than enhanced local packing.", "url": "https://arxiv.org/abs/2608.16874", "type": "理论+数值", "summary": "尽管实际配方通常包含具有多种特征尺寸的颗粒，但胶体凝胶经常被建模为单分散颗粒网络。在这里，我们使用胶体消耗凝胶的大规模流体动力学解析模拟来隔离小到大尺寸比为 1:2 的双峰系统中颗粒尺寸和局部堆积的影响。增加大颗粒分数引入了新的异型角图案，并显着增加了参与四面体结构的键的分数，其中最大为中间组成。然而，这些额外的刚性图案不会重新组织成更大或更高度连接的四面体聚集体。平均配位和特征聚集体尺寸几乎保持与组成无关。相比之下，随着大颗粒部分的增加，空隙和团簇尺寸分布系统地变粗。当通过依赖于组成的颗粒长度尺度标准化时，这些介观分布很大程度上崩溃，表明组成的变化主要重新调整凝胶结构，而不是产生独特的刚性网络拓扑。\n\n使用柯西玻恩理论估计的弹性模量类似地比局部四面体图案的丰度更接近于这种有效长度尺度。这些结果表明，对于中等尺寸差异，颗粒尺寸比增强的局部堆积更能控制结构尺度并预测双峰胶体凝胶的机械响应。", "authors": [{"name": "Robert A. Campbell"}, {"name": "Ziye Zhuang"}, {"name": "Ali Mohraz"}, {"name": "Safa Jamali"}], "featured_authors": [{"name": "Robert A. Campbell"}, {"name": "Ziye Zhuang"}, {"name": "Ali Mohraz"}, {"name": "Safa Jamali"}], "author_count": 4}, {"id": "2608.16877", "category": "cond-mat", "title": "Giant Thermal Amplification via Engineered Dissipation in a Sierpiski-Gasket Aharonov-Bohm Interferometer", "abstract": "We propose a three-terminal thermal amplifier based on a Sierpiski-gasket Aharonov-Bohm interferometer, where the third (base) terminal is realized as a floating Buttiker probe that acts as an engineered dissipative reservoir, exchanging energy with the conductor while carrying no net charge current. Using the nonequilibrium Green's function formalism, we demonstrate that the interplay of quantum coherence and engineered dissipation gives rise to giant, magnetic-flux-controlled thermal amplification, whereas purely coherent transport exhibits little or no amplification. We show that the amplification originates from a flux-induced cancellation of the energy-resolved thermal response of the base terminal, causing its differential heat current to vanish while finite heat currents continue to flow through the emitter and collector terminals. As a result, the thermal gain diverges without requiring resonant transmission. This interference-driven cancellation gives rise to an emergent thermal transparency, closely analogous to electromagnetically induced transparency in optical systems, where destructive quantum interference suppresses the thermal response of the base reservoir while maintaining finite heat transport through the remaining terminals. Our results establish the interplay of engineered dissipation and quantum interference as a powerful mechanism for controlling heat flow and realizing high-performance thermal amplifiers in mesoscopic conductors.", "url": "https://arxiv.org/abs/2608.16877", "type": "理论+数值", "summary": "我们提出了一种基于谢尔皮斯基垫片阿哈罗诺夫-博姆干涉仪的三端子热放大器，其中第三个（基极）端子实现为浮动 Buttiker 探针，充当工程耗散储存器，与导体交换能量，同时不承载净充电电流。使用非平衡格林函数形式，我们证明了量子相干性和工程耗散的相互作用产生了巨大的、磁通量控制的热放大，而纯相干传输则表现出很少或没有放大。我们表明，放大源于基极端子能量分辨热响应的通量引起的抵消，导致其差分热电流消失，而有限热电流继续流过发射极和集电极端子。结果，热增益发散而不需要谐振传输。\n\n这种干扰驱动的抵消产生了一种新兴的热透明性，与光学系统中的电磁感应透明性非常相似，其中破坏性量子干涉抑制了基础储层的热响应，同时保持通过其余终端的有限热传输。我们的研究结果确立了工程耗散和量子干涉的相互作用，作为控制热流和在介观导体中实现高性能热放大器的强大机制。", "authors": [{"name": "Shubhra Shubhadarshini Mallick"}, {"name": "Salil Bedkihal"}, {"name": "Mattias Fitzpatrick"}, {"name": "Malay Bandyopadhyay"}], "featured_authors": [{"name": "Shubhra Shubhadarshini Mallick"}, {"name": "Salil Bedkihal"}, {"name": "Mattias Fitzpatrick"}, {"name": "Malay Bandyopadhyay"}], "author_count": 4}, {"id": "2608.14596", "category": "hep-th", "title": "MacDowell-Mansouri $σ$-model", "abstract": "Standard pre-geometric mechanisms reproduce the {\\Lambda}CDM model but lack a natural source for inflation. We propose a mechanism for the emergence of scalar-coupled topological terms by extending the Lie algebra of a MacDowell-Mansouri model to a Lie algebroid. These terms are commonly regarded as a source for cosmological inflation in effective string actions. The theory reduces to the scalar-tensor theory belonging to the Horndeski class, and reproduces inflationary dynamics that meet existing constraints (Planck/BICEP/Keck and GW170817).", "url": "https://arxiv.org/abs/2608.14596", "type": "理论", "summary": "标准的前几何机制再现了 CDM 模型，但缺乏通货膨胀的自然来源。我们提出了一种通过将 MacDowell-Mansouri 模型的李代数扩展到李代数体来出现标量耦合拓扑项的机制。这些术语通常被认为是有效弦作用中宇宙膨胀的来源。该理论简化为属于 Horndeski 类的标量张量理论，并再现了满足现有约束的通货膨胀动力学（Planck/BICEP/Keck 和 GW170817）。", "authors": [{"name": "Egor Pluzhnikov"}, {"name": "Stanislav Alexeyev"}], "featured_authors": [{"name": "Egor Pluzhnikov"}, {"name": "Stanislav Alexeyev"}], "author_count": 2}, {"id": "2608.14780", "category": "hep-th", "title": "Catastrophic Inflation in the Axiverse", "abstract": "In the landscape of compactifications of type IIB string theory on O3/O7 orientifolds of Calabi--Yau threefolds, we identify regions of the axion potential in specific geometries that support small-field inflation, under the assumption that the overall Calabi--Yau volume can be stabilized at certain tuned values. At the tuned volume multiple critical points of the axion potential merge in a ``catastrophe'', creating a region with small gradient and small Hessian determinant --- necessary conditions for slow-roll inflation. We describe an algorithm that identifies several explicit examples of these catastrophes that have small field range $f / M_{\\rm Pl} \\ll 1 $ yet inflate for thousands of efolds. Some examples correctly reproduce the observed spectral tilt but not the amplitude of scalar perturbations, while others reproduce the observed amplitude but with a tilt that is slightly too red. All our examples have negligible tensor perturbations and no significant non-Gaussianity generated during the slow-roll phase. Our results demonstrate that string theory axions can be the source of cosmic inflation without alignment or large field ranges, provided that the Kähler moduli can be stabilized at special values of the volume.", "url": "https://arxiv.org/abs/2608.14780", "type": "理论", "summary": "在卡拉比-丘三倍的 O3/O7 东方褶皱上的 IIB 型弦理论的致密化景观中，我们在总体卡拉比-丘体积可以稳定在某些调谐值的假设下，确定了支持小场膨胀的特定几何形状中的轴子势区域。在调谐体积处，轴子势的多个临界点合并为“灾难”，形成一个具有小梯度和小 Hessian 行列式的区域——这是慢速膨胀的必要条件。我们描述了一种算法，该算法可以识别这些灾难的几个明确示例，这些灾难的场范围较小 $f / M_{\\rm Pl} \\ll 1 $ 但膨胀了数千个 efold。一些示例正确地再现了观察到的光谱倾斜，但没有再现标量扰动的幅度，而其他示例则再现了观察到的幅度，但倾斜稍微太红。我们所有的例子都具有可忽略的张量扰动，并且在慢滚阶段没有产生显着的非高斯性。\n\n我们的结果表明，只要凯勒模量可以稳定在特定的体积值，弦论轴子就可以成为宇宙膨胀的根源，而无需对准或大的场范围。", "authors": [{"name": "Naomi Gendler"}, {"name": "Oliver Janssen"}, {"name": "Matthew Kleban"}, {"name": "Cameron Norton"}], "featured_authors": [{"name": "Naomi Gendler"}, {"name": "Oliver Janssen"}, {"name": "Matthew Kleban"}, {"name": "Cameron Norton"}], "author_count": 4}, {"id": "2608.14781", "category": "hep-th", "title": "What is the simplest holographic matrix model?", "abstract": "We study a generalization of a two-matrix model proposed by J. Hoppe in '89. At strong coupling and large $N$, we unveil an emergent area preserving diffeomorphism symmetry of this model, which allows us to completely solve it at leading order. The solution for all $n$-point connected correlators takes the form of a Witten diagram-like expansion in an emergent two-dimensional dual spacetime. We conclude with speculations about the quantization of this dual model and comment on its extensions to higher dimensions and relations to holography more broadly.", "url": "https://arxiv.org/abs/2608.14781", "type": "理论", "summary": "我们研究了 J. Hoppe 在 89 年提出的二矩阵模型的推广。在强耦合和大$N$下，我们揭示了一个保留该模型微分同胚对称性的紧急区域，这使我们能够在前导阶上完全求解它。所有 $n$ 点连接相关器的解决方案均采用新兴二维双时空中类似维滕图展开的形式。最后我们对这种对偶模型的量子化进行了推测，并评论了它向更高维度的扩展以及更广泛地与全息术的关系。", "authors": [{"name": "Harish Murali"}, {"name": "Pedro Vieira"}], "featured_authors": [{"name": "Harish Murali"}, {"name": "Pedro Vieira"}], "author_count": 2}, {"id": "2608.14816", "category": "hep-th", "title": "Universal Emergence of Bosonic and Fermionic Algebras in a Deterministic Proper-Time Framework", "abstract": "This work develops the deterministic, discrete proper-time framework introduced in our previous work, Eur.\\ Phys.\\ J.\\ C \\textbf{86} (2026) 829, in which quantum field theory emerges as an effective infrared description characterized by a running Planck constant. There, the effective quantization scale was inferred from the microscopic multiplicity unresolved by coarse-graining. Here, we provide its dynamical and operatorial realization and extend the construction to fermionic degrees of freedom. First, consistency under changes of macroscopic resolution leads to the structure of the Renormalization Group Equation, while the running Planck constant governs the crossover toward the deterministic regime. Second, we represent the reversible microscopic dynamics through finite-difference translations in field-configuration space. After coarse-graining, the resulting operator-valued canonical commutation relations reproduce the same quantization scale previously obtained from statistical microstate counting, thereby linking microscopic evolution to the emergent canonical algebra. Third, representing the same update within a Grassmann algebra yields the corresponding canonical anticommutation relations. The bosonic and fermionic sectors thus inherit a common effective Planck constant without introducing an independent fermionic update or quantization scale. Finally, we discuss possible implications for high-energy loop amplitudes and effective Hawking radiation.", "url": "https://arxiv.org/abs/2608.14816", "type": "理论", "summary": "这项工作开发了我们之前的工作 Eur.\\ Phys.\\ J.\\ C \\textbf{86} (2026) 829 中引入的确定性、离散原时框架，其中量子场论作为一种有效的红外描述出现，其特征在于运行的普朗克常数。在那里，有效的量化尺度是从粗粒度未解决的微观多重性中推断出来的。在这里，我们提供了其动力学和操作实现，并将其构造扩展到费米子自由度。首先，宏观分辨率变化下的一致性导致了重整化群方程的结构，而运行的普朗克常数则控制着向确定性体系的交叉。其次，我们通过场配置空间中的有限差分平移来表示可逆微观动力学。粗粒度化后，所得到的算子值规范交换关系再现了先前从统计微观状态计数获得的相同量化尺度，从而将微观演化与新出现的规范代数联系起来。\n\n第三，在格拉斯曼代数中表示相同的更新会产生相应的规范反交换关系。因此，玻色子和费米子扇区继承了共同的有效普朗克常数，而无需引入独立的费米子更新或量化尺度。最后，我们讨论对高能环振幅和有效霍金辐射的可能影响。", "authors": [{"name": "Alessio Maiezza"}], "featured_authors": [{"name": "Alessio Maiezza"}], "author_count": 1}, {"id": "2608.14844", "category": "hep-th", "title": "Applications of Flux Compactifications in F-Theory", "abstract": "This thesis studies 4D F-theory compactifications with fluxes and their connection to particle physics, accompanied with a review of F-theory. First, we develop a general formalism for gauge symmetry breaking with fluxes. Vertical and remainder fluxes can be used to break a rigid gauge group, with the former simultaneously inducing chiral matter, even when the unbroken gauge group has no complex representations. We show that it is fairly likely to have three generations of chiral matter. We focus on the realization of the Standard Model gauge groups and chiral matter by breaking rigid $E_7,E_6$ gauge groups with an intermediate SU(5) gauge group, and provide examples of explicit constructions. Then, the phenomenological aspects of rigid $E_7$ models are studied in detail. We find that many other Standard-Model like features are naturally compatible with the $E_7$ models. For example, dimension-4 and dimension-5 proton decay are ubiquitously suppressed. Many of these features are due to the group-theoretic structure of $E_7$ and its F-theory geometry. In particular, a set of approximate global symmetries descends from the $E_7$ group, leading to exponential suppression of undesired couplings. These features suggest a new set of grand unified theories based on the $E_7$ group and its string theory construction. Finally, we study constructions of abelian gauge symmetries with exotic charges. By breaking a rigid nonabelian group to a U(1) gauge group using vertical flux, very large charges can arise in the massless or light spectrum. We give an explicit construction in 4D F-theory in which the vector-like matter carries charges as large as 657, which is much larger than the previously known bounds in F-theory. We heuristically argue that this result may provide an upper bound on charges for light fields under decoupled U(1) gauge groups in the F-theory landscape.", "url": "https://arxiv.org/abs/2608.14844", "type": "理论", "summary": "本论文研究了具有通量的 4D F 理论紧化及其与粒子物理的联系，并对 F 理论进行了回顾。首先，我们开发了一种用于通量规范对称性破缺的通用形式。垂直通量和剩余通量可用于破坏刚性规范组，前者同时引发手性物质，即使未破坏的规范组没有复杂的表示。我们证明它很可能具有三代手性物质。我们通过使用中间 SU(5) 规范组打破严格的 $E_7,E_6$ 规范组来重点关注标准模型规范组和手性物质的实现，并提供显式构造的示例。然后，详细研究了刚性 $E_7$ 模型的现象学方面。我们发现许多其他类似标准模型的功能自然与 $E_7$ 模型兼容。例如，第四维和第五维质子衰变普遍受到抑制。其中许多特征归因于 $E_7$ 的群论结构及其 F 理论几何。\n\n特别是，一组近似全局对称性源自 $E_7$ 组，导致对不需要的耦合的指数抑制。这些特征提出了一套基于 $E_7$ 群及其弦理论构造的新大统一理论。最后，我们研究了具有奇异电荷的阿贝尔规范对称性的构造。通过使用垂直通量将刚性非阿贝尔群分解为 U(1) 规范群，可以在无质量或光谱中产生非常大的电荷。我们在 4D F 理论中给出了一个明确的构造，其中类矢量物质携带的电荷高达 657，这比 F 理论中先前已知的界限大得多。我们启发性地认为，这一结果可能为 F 理论景观中解耦 U(1) 规范组下的光场电荷提供上限。", "authors": [{"name": "Shing Yan Li"}], "featured_authors": [{"name": "Shing Yan Li"}], "author_count": 1}, {"id": "2608.14932", "category": "hep-th", "title": "On M2-, M5-, and D3-branes from 12d anomalies: an equivariant perspective on duality", "abstract": "We revisit the twelve-dimensional anomaly polynomial that has long been known to govern M5-brane worldvolume theories, together with its more recently proposed D3-brane counterpart. We show that these constructions naturally fit into the framework of equivariant integration, allowing the anomaly inflow formulas to be rewritten entirely in terms of equivariant volumes. In particular, we use the fact that the Bott--Cattaneo formula for the integral of powers of the global angular form on $S^{2k}$ emerges from the equivariant Euler-class integration of $\\mathbb{C}^k$, with two copies glued antipodally at the north and south poles of the sphere. Building on this perspective, we generalize the anomaly construction to include both electrically and magnetically charged branes, thereby incorporating M2-branes as well as a dual formulation of D3-branes. This provides a unified framework encompassing a number of classical results together with several recent developments, and offers a natural interpretation of the recently proposed M2/M5 duality, arXiv:2604.06343 , in terms of an AGT-like correspondence. Remarkably, it also leads to a direct reinterpretation of constant-map contributions in topological string theory as manifestations of M-theory anomalies.", "url": "https://arxiv.org/abs/2608.14932", "type": "理论", "summary": "我们重新审视长期以来已知控制 M5 膜世界体积理论的 12 维异常多项式，以及最近提出的 D3 膜对应物。我们证明这些结构自然地适合等变积分的框架，允许异常流入公式完全根据等变体积重写。特别地，我们使用这样一个事实：$S^{2k}$ 上的全局角形式的幂积分的 Bott--Cattaneo 公式源自 $\\mathbb{C}^k$ 的等变欧拉级积分，两个副本以对映方式粘在球体的北极和南极。基于这个观点，我们将异常结构概括为包括带电和带磁的膜，从而合并了 M2 膜以及 D3 膜的双重配方。这提供了一个统一的框架，包含许多经典结果以及一些最近的发展，并根据类似 AGT 的对应关系提供了对最近提出的 M2/M5 对偶性 arXiv:2604.06343 的自然解释。\n\n值得注意的是，它还导致拓扑弦理论中常数映射贡献的直接重新解释为 M 理论异常的表现。", "authors": [{"name": "Kiril Hristov"}, {"name": "Pedro Vicente Marto"}], "featured_authors": [{"name": "Kiril Hristov"}, {"name": "Pedro Vicente Marto"}], "author_count": 2}, {"id": "2608.14997", "category": "hep-th", "title": "History-Dependent Mode Selection in a Driven Holographic Superfluid", "abstract": "We study finite-rate mode selection among competing Landau-unstable modes in a holographic superfluid. The selected mode is not generally the instantaneous fastest-growing one, while time-dependent linear evolution on the driven background reproduces the full dynamics. Protocols with identical present driving conditions can exhibit opposite modal ordering, revealing memory of the preceding drive. This memory is quantitatively captured by the accumulated difference between the QNM growth rates of the competing modes.", "url": "https://arxiv.org/abs/2608.14997", "type": "理论", "summary": "我们研究全息超流体中竞争朗道不稳定模式之间的有限速率模式选择。所选模式通常不是瞬时增长最快的模式，而驱动背景上的时间相关线性演化则再现了完整的动态。具有相同当前驾驶条件的协议可以表现出相反的模态顺序，从而揭示先前驾驶的记忆。这种记忆是通过竞争模式的 QNM 增长率之间的累积差异来定量捕获的。", "authors": [{"name": "Bo-Xuan Ge"}], "featured_authors": [{"name": "Bo-Xuan Ge"}], "author_count": 1}, {"id": "2608.15001", "category": "hep-th", "title": "Spinning Conformal Correlators from Neural Networks", "abstract": "We construct spinning conformal fields from neural networks and the embedding formalism, computing their two-, three- and four-point functions in examples, building on scalar conformal field techniques introduced in \\cite{Halverson:2024axc}. For a particular ensemble of i.i.d. neurons we recover the 4d Maxwell CFT in the infinite-width limit.", "url": "https://arxiv.org/abs/2608.15001", "type": "理论", "summary": "我们从神经网络和嵌入形式构建旋转共形场，在示例中计算它们的两点、三点和四点函数，建立在 \\cite{Halverson:2024axc} 中引入的标量共形场技术的基础上。对于一个特定的 i.i.d. 集合我们在无限宽度限制下恢复了 4d Maxwell CFT。", "authors": [{"name": "Manas Dogra"}, {"name": "James Halverson"}, {"name": "Joydeep Naskar"}], "featured_authors": [{"name": "Manas Dogra"}, {"name": "James Halverson"}, {"name": "Joydeep Naskar"}], "author_count": 3}, {"id": "2608.15111", "category": "hep-th", "title": "Quasinormal frequencies and greybody factors for axial perturbations of dilaton-Euler-Heisenberg de Sitter black holes", "abstract": "We investigate the quasinormal modes (QNMs) and greybody factors of dilaton-Euler-Heisenberg (dEH) de Sitter (dS) black holes in string-inspired Euler-Heisenberg gravity. Since the axial gravitational and electromagnetic perturbations decouple, we treat them independently. By applying the asymptotic iteration method (AIM) alongside a sixth-order WKB approximation, we compute the quasinormal frequencies and find excellent agreement between the two approaches. We also find that the QNM spectra depend sensitively on the magnetic charge $Q_{\\text{m}}$, cosmological constant $\\Lambda$, and nonlinear coupling $\\epsilon$, with a notable topological anomaly appearing in the electromagnetic frequency trajectories. Additionally, larger values of $Q_{\\text{m}}$ or the multipole number $l$ generally suppress wave transmission, while the electromagnetic sector with $\\epsilon=1$ exhibits an anomalous response.", "url": "https://arxiv.org/abs/2608.15111", "type": "理论", "summary": "我们研究了受弦启发的欧拉-海森堡引力中膨胀-欧拉-海森堡 (dEH) 德西特 (dS) 黑洞的准正态模式 (QNM) 和灰体因子。由于轴向引力和电磁扰动是解耦的，因此我们单独对待它们。通过应用渐近迭代法 (AIM) 和六阶 WKB 近似，我们计算了拟正态频率，并发现两种方法之间非常一致。我们还发现QNM谱敏感地依赖于磁荷$Q_{\\text{m}}$、宇宙常数$\\Lambda$和非线性耦合$\\epsilon$，电磁频率轨迹中出现了显着的拓扑异常。此外，较大的$Q_{\\text{m}}$或多极数$l$通常会抑制波传输，而$\\epsilon=1$的电磁扇区表现出异常响应。", "authors": [{"name": "Ming Zhang"}, {"name": "Guo-Xin Chen"}, {"name": "Xufen Zhang"}, {"name": "Cheng-Fu Feng"}, {"name": "Sheng-Yuan Li"}, {"name": "Rui-Hong Yue"}, {"name": "De-Cheng Zou"}], "featured_authors": [{"name": "Ming Zhang"}, {"name": "Guo-Xin Chen"}, {"name": "Xufen Zhang"}, {"name": "Sheng-Yuan Li"}, {"name": "Rui-Hong Yue"}, {"name": "De-Cheng Zou"}], "author_count": 7}, {"id": "2608.15220", "category": "hep-th", "title": "Topological Field Theory and Stochastic Dynamics", "abstract": "In the late 1980s, Baulieu and Grossman demonstrated that the supersymmetric formulation of Langevin stochastic differential equations (SDEs), proposed earlier by Parisi and Sourlas, belongs to the family of Witten-type topological field theories (TFTs). From a certain angle, this finding may appear puzzling: TFTs have no local degrees of freedom, whereas SDEs do exhibit local fluctuations. In this paper, we address this apparent contradiction in the context of the supersymmetric theory of stochastic dynamics (STS), a generalization of the Parisi-Sourlas-Baulieu-Grossman approach to SDEs of arbitrary form. We further discuss how, within STS, dynamical chaos can be identified with the spontaneous breakdown of the corresponding topological supersymmetry, while 1/f noise can be understood as a consequence of the Goldstone theorem. The butterfly effect, in turn, calls for an effective field-theoretic description that may itself possess a hidden topological structure, as we speculate on the basis of the Ginzburg-Landau approach and insights from AdS/CFT duality.", "url": "https://arxiv.org/abs/2608.15220", "type": "理论", "summary": "20 世纪 80 年代末，Baulieu 和 Grossman 证明了 Parisi 和 Sourlas 早期提出的 Langevin 随机微分方程 (SDE) 的超对称公式属于 Witten 型拓扑场论 (TFT) 家族。从某个角度来看，这一发现可能显得令人费解：TFT 没有局部自由度，而 SDE 确实表现出局部波动。在本文中，我们在随机动力学（STS）超对称理论的背景下解决了这个明显的矛盾，这是对任意形式的 SDE 的 Parisi-Sourlas-Baulieu-Grossman 方法的推广。我们进一步讨论在 STS 中，如何通过相应拓扑超对称性的自发破坏来识别动态混沌，而 1/f 噪声可以理解为戈德斯通定理的结果。反过来，蝴蝶效应需要一种有效的场论描述，其本身可能具有隐藏的拓扑结构，正如我们根据 Ginzburg-Landau 方法和 AdS/CFT 对偶性的见解推测的那样。", "authors": [{"name": "Igor V. Ovchinnikov"}], "featured_authors": [{"name": "Igor V. Ovchinnikov"}], "author_count": 1}, {"id": "2608.15393", "category": "hep-th", "title": "Higher-order analogues of colour-kinematics duality in first-order Yang-Mills Feynman diagrams", "abstract": "Colour-kinematics duality is, even at tree level, not manifest from the standard Lagrangian of Yang-Mills theory in that the usual Feynman-diagram expansion does not follow the kinematic Jacobi identities. For a Lagrangian manifesting colour-kinematics duality, the kinematic Jacobi identities of the Feynman-diagram expansion follow from the existence of a second-order differential operator $\\mathsf{b}$ acting on the algebra of colour-stripped fields that forms part of the data of a BV$^\\square$-algebra. We argue that the existence of differential operators of order greater than two implies weaker but nontrivial fragments of kinematic Jacobi identities. We further show that a superspace formulation of the first-order Yang-Mills action in the Batalin-Vilkovisky formalism admits a differential operator of order six in every spacetime dimension. Therefore, the Feynman-diagram expansion of tree and loop scattering amplitudes of the first-order formulation of Yang-Mills theory automatically enjoy a weak form of colour-kinematics duality.", "url": "https://arxiv.org/abs/2608.15393", "type": "理论", "summary": "即使在树级别，颜色运动学二元性也没有从杨米尔斯理论的标准拉格朗日中体现出来，因为通常的费曼图展开不遵循运动学雅可比恒等式。对于拉格朗日表现的颜色运动学对偶性，费曼图展开式的运动雅可比恒等式源自二阶微分算子 $\\mathsf{b}$ 的存在，该算子作用于构成 BV$^\\square$-代数数据一部分的颜色剥离域的代数。我们认为，阶数大于二的微分算子的存在意味着运动学雅可比恒等式的较弱但不平凡的片段。我们进一步表明，Batalin-Vilkovisky 形式主义中一阶杨-米尔斯作用的超空间公式在每个时空维度上都承认六阶微分算子。因此，杨-米尔斯理论一阶公式的树和环散射振幅的费曼图展开自动享有弱形式的颜色运动学对偶性。", "authors": [{"name": "Leron Borsten"}, {"name": "Dimitri Kanakaris"}, {"name": "Hyungrok Kim"}], "featured_authors": [{"name": "Leron Borsten"}, {"name": "Dimitri Kanakaris"}, {"name": "Hyungrok Kim"}], "author_count": 3}, {"id": "2608.15589", "category": "hep-th", "title": "Quantum Information in SYK Model", "abstract": "We investigate the bulk-boundary correspondence in the SYK model from a quantum information perspective. The SYK model describes a system of Majorana fermions with random all-to-all interactions, whose disorder average-typically taken over a Gaussian ensemble-admits a dual description in terms of JT gravity in the large-$N$, low-energy limit. This framework provides a minimal setting for exploring holography and emergent spacetime in nearly AdS$_2$. We probe the holographic principle through diagnostics of quantum chaos and entanglement. In the early-time regime, the SYK model saturates the universal bound on the Lyapunov exponent, signaling maximal chaos consistent with semiclassical black hole dynamics. In the late-time regime, its spectral statistics are governed by random matrix theory, reflecting universal features of strongly chaotic quantum systems. These dynamical properties establish a concrete link between boundary quantum chaos and bulk semiclassical gravity. In parallel, we analyze quantum entanglement and the structure of operator algebras to investigate transitions in the associated von Neumann algebras and their implications for emergent geometry. To explore the robustness of these phenomena, we consider deformations of the SYK model through modified matter couplings and alternative random distributions. Our results clarify how quantum information-theoretic structures encode bulk gravitational dynamics and provide insight into the mechanism of spacetime emergence.", "url": "https://arxiv.org/abs/2608.15589", "type": "理论", "summary": "我们从量子信息的角度研究了 SYK 模型中的体边界对应关系。 SYK 模型描述了一个具有随机所有相互作用的马约拉纳费米子系统，其无序平均（通常采用高斯系综）承认在大 $N$、低能量极限下的 JT 引力方面的双重描述。该框架为在近 AdS$_2$ 中探索全息和涌现时空提供了最小的设置。我们通过量子混沌和纠缠的诊断来探索全息原理。在早期状态下，SYK 模型使 Lyapunov 指数的通用界限饱和，表明与半经典黑洞动力学一致的最大混沌。在后期，其谱统计受随机矩阵理论控制，反映了强混沌量子系统的普遍特征。这些动力学特性在边界量子混沌和体积半经典引力之间建立了具体的联系。同时，我们分析量子纠缠和算子代数的结构，以研究相关冯诺依曼代数的转变及其对涌现几何的影响。\n\n为了探索这些现象的鲁棒性，我们通过修改物质耦合和替代随机分布来考虑 SYK 模型的变形。我们的结果阐明了量子信息理论结构如何编码整体引力动力学，并提供了对时空出现机制的见解。", "authors": [{"name": "Chen-Te Ma"}, {"name": "Jeff Murugan"}, {"name": "Masaki Tezuka"}], "featured_authors": [{"name": "Chen-Te Ma"}, {"name": "Jeff Murugan"}, {"name": "Masaki Tezuka"}], "author_count": 3}, {"id": "2608.15606", "category": "hep-th", "title": "Positive Singularities and Volumes in Scattering Amplitudes", "abstract": "Recent advances have revealed that scattering amplitudes in certain quantum field theories admit a geometric formulation in terms of positive geometries. In this framework, amplitudes are encoded by differential forms whose boundary structure reflects physical principles such as locality, unitarity, and factorization. This thesis gives a self-contained introduction to positive geometries, with particular emphasis on the Amplituhedron, which describes amplitudes in planar maximally supersymmetric Yang--Mills theory through its canonical form. We develop three related directions connecting positivity, volumes, and singularities. First, we study positivity properties of canonical forms through dual volume representations. For polytopes, canonical functions compute volumes of dual polytopes; we extend this picture to nonlinear positive geometries, uncovering non-negative transcendental measures and links with complete monotonicity. Second, we investigate loop-level amplitudes via their singularity structure. Combining Amplituhedron geometry with Landau analysis, we classify leading singularities of the Wilson loop with Lagrangian insertion and constrain the possible singular loci. Third, we examine conjectural relations between Landau singularities, positivity, and cluster algebras. Using momentum-twistor and Grassmannian methods, we identify recursive structures across loop orders, prove several infinite families of cases, and propose a strategy toward the general conjectures. Overall, the thesis develops the perspective that positive geometry provides a unifying language for the analytic and geometric organization of scattering amplitudes, from canonical forms and volumes to the singularities that emerge after loop integration.", "url": "https://arxiv.org/abs/2608.15606", "type": "理论", "summary": "最近的进展表明，某些量子场论中的散射振幅允许采用正几何的几何公式​​。在此框架中，幅度由微分形式编码，其边界结构反映了局部性、幺正性和分解等物理原理。本论文对正几何进行了独立的介绍，特别强调了振幅面体，它通过其规范形式描述了平面最大超对称杨-米尔斯理论中的振幅。我们开发了三个相关的方向，将积极性、体积和奇点联系起来。首先，我们通过双体积表示研究规范形式的积极性质。对于多胞体，规范函数计算双多胞体的体积；我们将这幅图扩展到非线性正几何，揭示非负超越测度和完全单调性的联系。其次，我们通过奇点结构研究环路电平幅度。将放大面体几何与朗道分析相结合，我们对带有拉格朗日插入的威尔逊环的主要奇点进行分类，并约束可能的奇异位点。\n\n第三，我们研究朗道奇点、正性和簇代数之间的猜想关系。使用动量扭转和格拉斯曼方法，我们识别跨循环顺序的递归结构，证明几个无限的情况族，并提出针对一般猜想的策略。总体而言，本文提出了这样的观点：正几何为散射振幅的分析和几何组织提供了一种统一的语言，从规范形式和体积到循环积分后出现的奇点。", "authors": [{"name": "Elia Mazzucchelli"}], "featured_authors": [{"name": "Elia Mazzucchelli"}], "author_count": 1}, {"id": "2608.15611", "category": "hep-th", "title": "Strong CP Problem in Type IIA Toroidal Orientifold String Theory", "abstract": "We present a globally consistent Type IIA $T^6/(\\mathbb{Z}_2 \\times \\mathbb{Z}_2)$ orientifold with intersecting D6-branes that dynamically solves the strong CP problem via the four-form flux mechanism. The construction satisfies all RR tadpole, K-theory, and SUSY conditions, stabilizes all moduli, and uplifts to dS vacuum with an anti-D6-brane. Four new results beyond our earlier proof-of-principle \\cite{Liu:2025tnx} are given: (i) an explicit one-to-one dictionary between field-theory four-form parameters and string fluxes, including flux quantization constraints; (ii) a quantitative anti-D6 backreaction estimate showing $|\\delta \\bar{\\theta}|<10^{-11}$; (iii) an analysis of swampland constraints that are simultaneously satisfied only in a parameter window; (iv) a comparison with Type IIB LVS and heterotic solutions. The predicted axion decay constant $f_a$ and mass $m_a$ are within reach of next generation observations.", "url": "https://arxiv.org/abs/2608.15611", "type": "理论", "summary": "我们提出了一种具有相交 D6 膜的全局一致的 Type IIA $T^6/(\\mathbb{Z}_2 \\times \\mathbb{Z}_2)$ orientifold，通过四形式通量机制动态解决强 CP 问题。该结构满足所有 RR 蝌蚪、K 理论和 SUSY 条件，稳定所有模量，并通过反 D6 膜提升至 dS 真空。给出了超出我们之前的原理证明 \\cite{Liu:2025tnx} 的四个新结果：（i）场论四形式参数和弦通量之间的显式一对一字典，包括通量量化约束； (ii) 定量抗 D6 逆反应估计显示 $|\\delta \\bar{\\theta}|<10^{-11}$； (iii) 对仅在参数窗口中同时满足的沼泽地约束进行分析； (iv) 与 IIB 型 LVS 和杂种优势解决方案的比较。预测的轴子衰变常数 $f_a$ 和质量 $m_a$ 在下一代观测的范围内。", "authors": [{"name": "Yang Liu"}], "featured_authors": [{"name": "Yang Liu"}], "author_count": 1}, {"id": "2608.15628", "category": "hep-th", "title": "Bezoutian Decoupling for Conformal Yang--Mills Multiplets in $(A)dS$", "abstract": "Metsaev exhibited generic and decoupled formulations of conformal Yang--Mills theory in $(A)dS_6$, $(A)dS_8$, and $(A)dS_{10}$, and conjectured the corresponding relations in higher even dimensions. Motivated by the low-dimensional matrices in Appendix C, we identify and diagonalize a natural all-$N$ Bezoutian continuation of the three generic Gram forms. The monic Hankel cutoff, the evaluation pattern in Appendix C, and the conjectured mass nodes determine this continuation uniquely. Its vector and radical Gram-form diagonalization identities hold for every $D=d+1=2N+4$, $N\\geq1$. The continuation is the Bezout matrix of $z\\prod_{i=1}^N(z-\\rho i(2N+1-i))$ and $1$; evaluation at its simple roots produces the Vandermonde congruence appearing in the field redefinition. The same calculation gives closed formulas for the inverse, determinant, and inertia, and identifies the normalization weights with Johnson-graph multiplicities. Any nonlinear coefficient algebra already specified in the generic formulation is transported by this change of basis. The result does not construct such an algebra in arbitrary dimension. At $N=4$, we impose associativity, Frobenius invariance, and a fixed flat specialization; these algebraic constraints still admit a one-parameter family of pairwise distinct products in a fixed generic basis.", "url": "https://arxiv.org/abs/2608.15628", "type": "理论", "summary": "Metsaev 在 $(A)dS_6$、$(A)dS_8$ 和 $(A)dS_{10}$ 中展示了共形杨米尔斯理论的通用和解耦公式，并猜想了更高偶数维度中的对应关系。受附录 C 中低维矩阵的启发，我们识别并对角化了三种通用 Gram 形式的自然全 $N$ Bezooutian 延续。莫尼克汉克尔截止、附录 C 中的评估模式以及推测的质量节点唯一地确定了这种延续。它的向量和根式革兰氏形式对角化恒等式对于每个 $D=d+1=2N+4$、$N\\geq1$ 都成立。延拓是$z\\prod_{i=1}^N(z-\\rho i(2N+1-i))$和$1$的Bezout矩阵；求值的简单根源产生了出现在域重定义中的范德蒙同余。相同的计算给出了倒数、行列式和惯性的封闭公式，并用约翰逊图重数确定了归一化权重。通用公式中已经指定的任何非线性系数代数都通过基的改变来传输。结果并没有构造出任意维度的这样的代数。\n\n在 $N=4$ 时，我们施加关联性、Frobenius 不变性和固定的平坦特化；这些代数约束仍然允许在固定的通用基础上存在成对不同乘积的单参数族。", "authors": [{"name": "Weiqi Jiang"}], "featured_authors": [{"name": "Weiqi Jiang"}], "author_count": 1}, {"id": "2608.15661", "category": "hep-th", "title": "Renormalization-group locking of finite anisotropic propagation cones in Yukawa networks", "abstract": "Different field species can begin with finite anisotropic propagation geometries whose principal axes need not coincide. We ask whether local Yukawa interactions on a finite graph can nevertheless generate one common infrared spatial cone, even when the interactions that drive the locking become marginally irrelevant. Retaining the full finite mismatch between positive-definite spatial kinetic matrices, we derive the one-loop nonlinear matrix flow and show that its Thompson diameter is globally nonexpansive. On a connected graph, persistent normalized edge activity upgrades this to a uniform finite-window contraction, so all interacting sectors asymptotically share one relative propagation geometry. An explicit two-channel Pauli-Dirac Yukawa-quartic completion realizes the persistence conditions on an open weak-coupling set of finite-mismatch initial data. In four dimensions the Yukawa couplings vanish in the infrared, yet their accumulated interaction time diverges, leaving a Gaussian endpoint with a common spatial cone. For a controlled two-plateau extremal class, graph distance also fixes the first nonzero short-time order of the diameter decrease. Thus a common cone can be collectively selected by renormalization-group dynamics rather than imposed as a microscopic common structure.", "url": "https://arxiv.org/abs/2608.15661", "type": "理论", "summary": "不同的场种类可以从主轴不必重合的有限各向异性传播几何形状开始。我们询问有限图上的局部汤川相互作用是否仍然可以生成一个共同的红外空间锥，即使驱动锁定的相互作用变得稍微无关紧要。保留正定空间动力学矩阵之间的完全有限失配，我们推导了单环非线性矩阵流，并证明其汤普森直径是全局非膨胀的。在连通图上，持续归一化边缘活动将其升级为统一的有限窗口收缩，因此所有相互作用的扇区渐近地共享一个相对传播几何结构。显式双通道泡利-狄拉克汤川四次完成实现了有限失配初始数据的开放弱耦合集的持久性条件。在四个维度中，汤川耦合在红外中消失，但它们累积的相互作用时间发散，留下具有共同空间锥体的高斯端点。对于受控的两平台极值类，图距离还固定了直径减小的第一个非零短时阶。\n\n因此，公共锥体可以通过重正化群动力学来集体选择，而不是强加为微观公共结构。", "authors": [{"name": "Shuai Zeng"}], "featured_authors": [{"name": "Shuai Zeng"}], "author_count": 1}, {"id": "2608.15756", "category": "hep-th", "title": "Bootstrapping bilinear relations of discrete Painlevé systems from 5d gauge theories", "abstract": "We study tau-functions of elliptic and $ q $-Painlevé equations through their correspondence with 5d $ \\mathcal{N}=1 $ supersymmetric field theories. Defining tau-functions associated with 5d field theories in terms of partition functions on the $ \\Omega $-background, we propose a bootstrap method that determines their bilinear relations from the effective prepotential and the perturbative contributions, together with the global symmetry of the theory. Applying the method to 5d $ \\mathrm{SU}(2) $ gauge theories coupled to $ N_f \\leq 8 $ fundamental hypermultiplets, we obtain the bilinear relations of the elliptic and $ q $-Painlevé equations. This method can be applied to general 5d supersymmetric field theories beyond $ \\mathrm{SU}(2) $ gauge theories.", "url": "https://arxiv.org/abs/2608.15756", "type": "理论", "summary": "我们通过椭圆方程和 $ q $-Painlevé 方程与 5d $ \\mathcal{N}=1 $ 超对称场论的对应关系来研究它们的 tau 函数。根据 $ \\Omega $ 背景上的配分函数定义与 5d 场论相关的 tau 函数，我们提出了一种自举方法，该方法根据有效预势和微扰贡献以及理论的全局对称性确定它们的双线性关系。将该方法应用于 5d $ \\mathrm{SU}(2) $ 规范理论以及 $ N_f \\leq 8 $ 基本超多重数，我们得到了椭圆方程和 $ q $-Painlevé 方程的双线性关系。该方法可以应用于 $ \\mathrm{SU}(2) $ 规范理论之外的一般 5d 超对称场论。", "authors": [{"name": "Minsung Kim"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Minsung Kim"}, {"name": "Xin Wang"}], "author_count": 2}, {"id": "2608.15862", "category": "hep-th", "title": "Holographic Entanglement and Emergent Gravity", "abstract": "We investigate the emergence of bulk geometry from boundary entanglement entropy in the context of holographic duality. Considering a thermal $1+1$-dimensional conformal field theory dual to the BTZ black hole, we compute four distinct holographic entanglement measures: the standard spacelike HEE, its complementary spacelike counterpart HEE$^s$, the timelike HTEE and its complementary timelike counterpart HEE$^t$. These measures probe both the exterior and interior regions of the black hole horizon. Remarkably, by taking appropriate derivatives of these entanglement entropies with respect to the boundary intervals and the turning point of the extremal surface, we reconstruct the full BTZ metric, including the radial component $g_{zz}$, without imposing the Einstein equations. The reconstruction yields the correct metric components in all regions of the geometry. We further show that in the zero-temperature limit, our results consistently reduce to the pure AdS$_3$ metric and the familiar vacuum CFT$_2$ entanglement entropies. Our findings demonstrate that entanglement entropy data alone contains sufficient information to uniquely determine the dual gravitational background, offering a concrete realization of holographic emergence where gravity arises from the quantum information structure of the boundary theory.", "url": "https://arxiv.org/abs/2608.15862", "type": "理论", "summary": "我们研究了全息二元性背景下边界纠缠熵中体几何的出现。考虑到与 BTZ 黑洞对偶的热 $1+1$ 维共形场论，我们计算了四种不同的全息纠缠测量：标准类空 HEE、其互补类空对应物 HEE$^s$、类时 HTEE 及其互补类时对应物 HEE$^t$。这些措施探测了黑洞视界的外部和内部区域。值得注意的是，通过对这些纠缠熵相对于边界间隔和极值表面的转折点进行适当的导数，我们重建了完整的 BTZ 度量，包括径向分量 $g_{zz}$，而无需强加爱因斯坦方程。重建在几何的所有区域中产生正确的度量分量。我们进一步表明，在零温度限制下，我们的结果始终减少到纯 AdS$_3$ 度量和熟悉的真空 CFT$_2$ 纠缠熵。\n\n我们的研究结果表明，纠缠熵数据本身就包含足够的信息来唯一地确定双引力背景，提供了全息出现的具体实现，其中引力源自边界理论的量子信息结构。", "authors": [{"name": "Mohammad Ali-Akbari"}], "featured_authors": [{"name": "Mohammad Ali-Akbari"}], "author_count": 1}, {"id": "2608.15878", "category": "hep-th", "title": "Lagrangian Schur index and Bethe ansatz type formula", "abstract": "We propose a surprisingly elementary method to compute the Schur index in closed-form for general $\\mathcal{N} = 2$ Lagrangian theories. The method is inspired by the Bethe ansatz type formula for $\\mathcal{N} = 1$ superconformal index. We identify issues underlying the original derivation: the loss of periodicity property upon integration and the omitted poles outside of the annulus region. We circumvent the problems and transform integration into solving a simple difference equation. The final result is expressed as a finite sum of quasi-Jacobi forms involving twisted Eisenstein series. We test our method on different types of theories, including BCD-type $\\mathcal{N} = 4$ theories and various $\\mathcal{N} = 2$ quiver gauge theories.", "url": "https://arxiv.org/abs/2608.15878", "type": "理论", "summary": "我们提出了一种令人惊讶的基本方法来计算一般 $\\mathcal{N} = 2$ 拉格朗日理论的封闭形式的 Schur 指数。该方法的灵感来自于 $\\mathcal{N} = 1$ 超共形索引的 Bethe ansatz 类型公式。我们确定了原始推导背后的问题：积分时周期性属性的损失以及环形区域之外的极点的省略。我们规避了这些问题，并将积分转化为求解一个简单的差分方程。最终结果表示为涉及扭曲爱森斯坦级数的拟雅可比形式的有限和。我们在不同类型的理论上测试我们的方法，包括 BCD 型 $\\mathcal{N} = 4$ 理论和各种 $\\mathcal{N} = 2$ 箭袋规范理论。", "authors": [{"name": "Yutong Li"}, {"name": "Yiwen Pan"}], "featured_authors": [{"name": "Yutong Li"}, {"name": "Yiwen Pan"}], "author_count": 2}, {"id": "2608.16046", "category": "hep-th", "title": "Gravitational wave signatures from area metric gravity", "abstract": "Area metric theories have been proposed as effective descriptions in a number of quantum gravity approaches: as continuum limit of effective spin foams, as an effective description for string theory and in the context of holography. Area metric actions allow for non-topological parity violating terms, which opens the possibility of observationally determining the Barbero-Immirzi parameter. We consider the shift symmetric version of linearized area metric theory in Lorentzian signature, which arises in particular from spin foams and modified Plebanski theory, and avoids ghost and tachyonic instabilities in the graviton sector. We discuss the gravitational wave like solutions of this theory and through an analysis of the coupling to electro-magnetism, deduce the signals in gravitational wave detectors. Using polarized light in such interferometers allows in principle to measure area metric induced birefringence and to determine the Barbero-Immirzi parameter. Assuming Planck massive non-length excitations in the area metric the resulting signal is however extremely weak.", "url": "https://arxiv.org/abs/2608.16046", "type": "理论", "summary": "面积度量理论已被提出作为许多量子引力方法中的有效描述：作为有效自旋泡沫的连续介质极限，作为弦理论和全息术背景下的有效描述。面积度量操作允许非拓扑奇偶校验违反项，这开启了通过观察确定 Barbero-Immirzi 参数的可能性。我们考虑洛伦兹签名中线性化面积度量理论的移位对称版本，该版本特别源自自旋泡沫和修正的普列班斯基理论，并避免了引力子区域中的幽灵和快子不稳定性。我们讨论了该理论的类引力波解，并通过对电磁耦合的分析，推导出引力波探测器中的信号。在此类干涉仪中使用偏振光原则上允许测量面积引起的双折射并确定 Barbero-Immirzi 参数。然而，假设面积度量中存在普朗克大量非长度激励，则所得信号极其微弱。", "authors": [{"name": "Bianca Dittrich"}], "featured_authors": [{"name": "Bianca Dittrich"}], "author_count": 1}, {"id": "2608.16083", "category": "hep-th", "title": "Positive Tensor-Network Kähler Metrics on gCICY Threefolds", "abstract": "We develop and implement a positive tensor-network parameterization for computing Ricci-flat Kähler metrics on Calabi-Yau manifolds. It replaces the large Hermitian coefficient matrix of a high-degree algebraic metric by a matrix-product factorization. For the immersed source spaces used here, the resulting metric is globally positive for every parameter value and, at fixed local and bond dimensions, its number of parameters grows only linearly with the algebraic degree. We test the construction on three generalized complete-intersection Calabi-Yau (gCICY) threefolds, constructing chart by chart the generalized sections, holomorphic volume forms and sampling measures that define and train the metric there. From a common low-degree metric, the tensor network outperforms a parameter-matched neural potential using the same section data, reducing both bulk errors and the one-percent tail conditional mean in every paired run. It also reaches a substantially lower error than direct optimization of an unrestricted Hermitian metric of the same degree from the same start, with both methods optimized to validation convergence under their respective schedules. On a second geometry, a higher-degree network with fewer parameters than a lower-degree unrestricted Hermitian baseline substantially reduces the same-sample errors. We further observe saturation within the tested calculations: at fixed bond dimension, increasing the degree eventually plateaus; increasing the bond dimension at fixed optimization effort gives no resolved gain; and the outcome depends strongly on initialization and optimization path.", "url": "https://arxiv.org/abs/2608.16083", "type": "理论", "summary": "我们开发并实现了正张量网络参数化，用于计算 Calabi-Yau 流形上的 Ricci-flat Kähler 度量。它通过矩阵乘积分解取代了高次代数度量的大埃尔米特系数矩阵。对于此处使用的浸没源空间，所得度量对于每个参数值都是全局正的，并且在固定的局部和键维数下，其参数数量仅随代数度线性增长。我们在三个广义完全相交 Calabi-Yau (gCICY) 上测试了三倍的构造，逐个图表地构造广义截面、全纯体积形式和定义和训练度量的采样度量。从常见的低度度量来看，张量网络优于使用相同截面数据的参数匹配神经势，减少了每次配对运行中的批量错误和百分之一的尾部条件均值。与从同一起点对相同程度的无限制埃尔米特度量进行直接优化相比，它的误差也大大降低，两种方法都在各自的时间表下针对验证收敛进行了优化。\n\n在第二种几何结构上，与较低阶的无限制埃尔米特基线相比，具有较少参数的较高阶网络大大减少了相同样本的误差。我们进一步观察测试计算中的饱和度：在固定的键维数下，增加程度最终达到稳定状态；在固定的优化努力下增加键维没有给出解决的增益；结果很大程度上取决于初始化和优化路径。", "authors": [{"name": "Juntao Wang"}], "featured_authors": [{"name": "Juntao Wang"}], "author_count": 1}, {"id": "2608.16369", "category": "hep-th", "title": "Quantum-Corrected Black Holes in Higher Dimensions: From Gravitational Collapse to Remnants, WGC-Like Behavior and Accretion Signatures", "abstract": "We study the gravitational collapse of a homogeneous dust sphere in higher-dimensional spacetime, with the loop quantum gravity correction entered through a modified Friedmann equation. Its most striking feature is an endpoint: at a finite horizon radius the temperature vanishes and evaporation stops, leaving a remnant. Reading \\(\\alpha\\) as an effective charge, we find behavior reminiscent of the Weak Gravity Conjecture (WGC), although no \\(U(1)\\) gauge field is present in the model. Solving the degeneracy conditions with the untruncated metric function, rather than with a mass expansion that is not uniform near the endpoint, we obtain closed-form expressions for the remnant radius and mass in \\(D=4,5,6,7\\). The unscaled ratio \\(\\alpha/M_{\\text{remnant}}^2\\) is constant only in four dimensions and grows as \\(\\alpha^{4-D}\\) elsewhere, but it carries dimension \\(L^{8-2D}\\), so that growth is an artifact of the units. The dimensionless combination \\(\\tilde{\\mathcal{R}} = (\\alpha/M^2) r_0^{2D-8}\\) settles instead on a finite \\(\\alpha\\)-independent number in every dimension, decreasing from \\(27/64\\) in four dimensions to \\(13824/(15625\\pi^4)\\) in seven. We also deform the quantum parameter, \\(\\alpha \\to \\alpha + \\varepsilon\\), and evaluate \\(-T(\\partial S/\\partial \\varepsilon)_M\\) in the remnant limit. Because \\((\\partial M/\\partial r)_\\alpha\\) vanishes there, the fixed-entropy derivative reduces exactly to a fixed-radius one, and the resulting combination \\(\\mathcal{U}\\) is finite in each dimension but depends on \\(\\varepsilon\\) except for \\(D=5\\). What is invariant is the product \\(\\mathcal{R}\\,\\mathcal{U}\\,M_{\\text{remnant}} = (D-3)/2\\), which we verify numerically. Lastly, we study Bondi accretion onto the quantum-corrected black hole and obtain the Eddington luminosity for each dimension.", "url": "https://arxiv.org/abs/2608.16369", "type": "理论", "summary": "我们研究了高维时空中均匀尘埃球的引力塌缩，并通过修正的弗里德曼方程进行了环量子引力修正。它最引人注目的特征是一个端点：在有限的地平线半径处，温度消失，蒸发停止，留下残余物。将 \\(\\alpha\\) 解读为有效电荷，我们发现其行为让人想起弱重力猜想 (WGC)，尽管模型中不存在 \\(U(1)\\) 规范场。使用未截断的度量函数求解简并条件，而不是使用端点附近不均匀的质量膨胀，我们获得了 \\(D=4,5,6,7\\) 中剩余半径和质量的闭合形式表达式。未缩放比例 \\(\\alpha/M_{\\text{remnant}}^2\\) 仅在四个维度上是恒定的，并在其他地方以 \\(\\alpha^{4-D}\\) 的形式增长，但它带有维度 \\(L^{8-2D}\\)，因此增长是单位的人工产物。无量纲组合 \\(\\tilde{\\mathcal{R}} = (\\alpha/M^2) r_0^{2D-8}\\) 在每个维度上都落在一个与 \\(\\alpha\\) 无关的有限数上，从四个维度的 \\(27/64\\) 减少到七个维度的 \\(13824/(15625\\pi^4)\\)。\n\n我们还将量子参数 \\(\\alpha \\ 变形为 \\alpha + \\varepsilon\\)，并在剩余极限内评估 \\(-T(\\partial S/\\partial \\varepsilon)_M\\)。因为 \\((\\partial M/\\partial r)_\\alpha\\) 在那里消失，固定熵导数精确地减少到固定半径导数，并且所得组合 \\(\\mathcal{U}\\) 在每个维度上都是有限的，但取决于 \\(\\varepsilon\\)，除了 \\(D=5\\) 之外。不变的是我们通过数值验证的乘积 \\(\\mathcal{R}\\,\\mathcal{U}\\,M_{\\text{remnant}} = (D-3)/2\\)。最后，我们研究了量子校正黑洞上的邦迪吸积，并获得了每个维度的爱丁顿光度。", "authors": [{"name": "Saeed Noori Gashti"}, {"name": "Umair Anwar"}, {"name": "Abdul Jawad"}, {"name": "Behnam Pourhassan"}, {"name": "İzzet Sakallı"}, {"name": "Sanjar Shaymatov"}, {"name": "Aram Bahroz Brzo"}], "featured_authors": [{"name": "Saeed Noori Gashti"}, {"name": "Umair Anwar"}, {"name": "Abdul Jawad"}, {"name": "İzzet Sakallı"}, {"name": "Sanjar Shaymatov"}, {"name": "Aram Bahroz Brzo"}], "author_count": 7}, {"id": "2608.16374", "category": "hep-th", "title": "Quantum Stability of the Fuzzy Sphere Black Hole Horizon", "abstract": "We establish the perturbative stability of the fuzzy-sphere black-hole horizon in the large-$N$ matrix quantum mechanics of \\cite{Chu:2024qil}. Large-$N$ counting shows that the leading quantum correction to the fluctuation spectrum is the planar bosonic one-loop contribution, while higher-loop bosonic effects and the leading fermionic one-loop contribution are parametrically suppressed. The classical spectrum contains a tachyonic $(1,2)$ mode and a marginal $(2,3)$ mode; we show that both acquire positive quantum curvature and are stabilized. For the general spectrum, we find that a factorization structure of the Hessian controls the leading quantum curvature and renders it non-negative. Quantum effects dominate the stabilization of generic low-angular-momentum modes, whereas classical curvature dominates at high angular momentum. The two effects become comparable in the crossover regime $L \\sim \\sqrt{N}$, where both must be retained. Under smoothness and non-saturation assumptions supported by finite-$N$ numerical tests, positivity of the quantum fluctuation spectrum is thus established for sufficiently large but finite $N$. This local curvature stability is compatible with non-perturbative monopole tunneling. Intriguingly, the same $L\\sim\\sqrt{N}$ mesoscopic angular momentum range also dominates the tunneling process, suggesting a distinguished IR--UV crossover regime in the quantum dynamics of the black-hole horizon.", "url": "https://arxiv.org/abs/2608.16374", "type": "理论", "summary": "我们在\\cite{Chu:2024qil}的大$N$矩阵量子力学中建立了模糊球黑洞视界的微扰稳定性。大$N$计数表明，对涨落谱的主要量子校正是平面玻色子单环贡献，而高环玻色子效应和主要费米子单环贡献被参数抑制。经典频谱包含快子 $(1,2)$ 模式和边际 $(2,3)$ 模式；我们证明两者都获得正量子曲率并且稳定。对于一般谱，我们发现 Hessian 矩阵的因式分解结构控制着主导量子曲率并使其非负。量子效应主导一般低角动量模式的稳定性，而经典曲率在高角动量模式中主导。这两种效应在交叉机制 $L \\sim \\sqrt{N}$ 中具有可比性，其中两者都必须保留。在有限$N$数值测试支持的平滑和非饱和假设下，对于足够大但有限的$N$，量子涨落谱的正性由此成立。\n\n这种局部曲率稳定性与非微扰单极子隧道兼容。有趣的是，相同的 $L\\sim\\sqrt{N}$ 介观角动量范围也主导了隧道过程，这表明黑洞视界的量子动力学中存在独特的红外-紫外交叉机制。", "authors": [{"name": "Chong-Sun Chu"}], "featured_authors": [{"name": "Chong-Sun Chu"}], "author_count": 1}, {"id": "2608.16486", "category": "hep-th", "title": "Effective field equations with stochastic initial conditions", "abstract": "The evolution of quantum field expectation values from an initial non-equilibrium quantum state can be followed numerically using the Truncated Wigner technique. It can track non-perturbative quantum phenomena, such as false vacuum decay, in real time with promising results. Nevertheless, it is an approximate method subject to quantum loop corrections. The extension of Truncated Wigner into a fully fledged effective field equation approach is discussed here, including corrections from higher loops and higher momenta.", "url": "https://arxiv.org/abs/2608.16486", "type": "理论", "summary": "可以使用截断维格纳技术对量子场期望值从初始非平衡量子态的演化进行数值跟踪。它可以实时跟踪非微扰量子现象，例如假真空衰变，并取得有希望的结果。然而，它是一种需要进行量子环修正的近似方法。这里讨论将截断维格纳扩展到成熟的有效场方程方法，包括来自更高环和更高动量的修正。", "authors": [{"name": "Ian G. Moss"}], "featured_authors": [{"name": "Ian G. Moss"}], "author_count": 1}, {"id": "2608.16487", "category": "hep-th", "title": "Flat space limits of symmetric Taub-NUT instantons", "abstract": "We construct $U(1)$-symmetric $SU(2)$ instantons on the Taub-NUT space with generic holonomy, and instanton number and magnetic charge $(k,m)=(2,0)$, $(1,1)$, and $(2,-1)$. We construct these instantons via the bow construction, a Nahm-like non-linear transformation which identifies them with a set of bow data solving an integrable ODE and a series of algebraic relations on an interval. We show how the bow data recovers the data for all corresponding $U(1)$-symmetric instantons on flat $\\mathbb{R}^4$ and calorons on $\\mathbb{R}^3\\times S^1$ in various limits, and we demonstrate the existence of Taub-NUT instantons that do not limit to $\\mathbb{R}^4$ instantons nor calorons.", "url": "https://arxiv.org/abs/2608.16487", "type": "理论", "summary": "我们在具有通用完整性的 Taub-NUT 空间上构造 $U(1)$ 对称 $SU(2)$ 瞬子，以及瞬子数和磁荷 $(k,m)=(2,0)$、$(1,1)$ 和 $(2,-1)$。我们通过弓构造来构造这些瞬子，这是一种类似 Nahm 的非线性变换，它通过求解可积常微分方程和区间上的一系列代数关系的一组弓数据来识别它们。我们展示了弓数据如何在各种限制下恢复平坦 $\\mathbb{R}^4$ 上所有相应 $U(1)$ 对称瞬子和 $\\mathbb{R}^3\\times S^1$ 上的卡罗子的数据，并且我们证明了 Taub-NUT 瞬间子的存在，该瞬时子不限于 $\\mathbb{R}^4$ 瞬间子或卡罗子。", "authors": [{"name": "Matthew Dales"}], "featured_authors": [{"name": "Matthew Dales"}], "author_count": 1}, {"id": "2608.16517", "category": "hep-th", "title": "Metric Reconstruction from Timelike Entanglement Entropy", "abstract": "Timelike entanglement entropy (TEE) provides a Lorentzian boundary probe of bulk geometry, but its use for metric reconstruction depends on the holographic prescription and on the extremal-surface branch selected by that prescription. We study this inverse problem for strip-shaped TEE data and make these dependencies explicit. In the complex-valued weak extremal surface (CWES) prescription, the time-width dependence of TEE determines an Abel density $H(W)$ on a selected real branch; for Bañados-Teitelboim-Zanelli (BTZ) black holes this gives an analytic reconstruction of the blackening factor once the singularity endpoint fixes the radial origin. After developing a forward numerical method for the complex-coordinate prescription, we formulate it as the main reconstruction scheme for the asymptotically $AdS_{d+1}$ backgrounds with $d\\geq 2$. On a chosen complex branch, the time-width dependence of TEE supplies the Abel input that determines the TEE-accessible density, while one additional geometric anchor is required to convert that density into a definite radial metric profile. With UV or horizon-scale anchoring and rational continuation from the reconstructed complex-path samples, the method reproduces the benchmark BTZ, four-dimensional Schwarzschild, and Reissner-Nordström (RN) blackening factors. However, the Gubser-Rocha example shows that a single strip observable with a nontrivial spatial warp factor determines only one functional combination of the metric functions.", "url": "https://arxiv.org/abs/2608.16517", "type": "理论", "summary": "类时纠缠熵（TEE）提供了体几何的洛伦兹边界探测，但其在度量重建中的使用取决于全息规定以及该规定选择的极值表面分支。我们研究了带状 TEE 数据的逆问题，并使这些依赖性变得明确。在复值弱极值表面 (CWES) 规定中，TEE 的时间宽度依赖性决定了所选实分支上的阿贝尔密度 $H(W)$；对于 Bañados-Teitelboim-Zanelli (BTZ) 黑洞，一旦奇点端点固定了径向原点，就会对黑化因子进行分析重建。在开发了复杂坐标处方的正向数值方法后，我们将其制定为具有$d\\geq 2$的渐近$AdS_{d+1}$背景的主要重建方案。在选定的复杂分支上，TEE 的时间宽度依赖性提供了确定 TEE 可访问密度的 Abel 输入，而需要一个额外的几何锚点将该密度转换为明确的径向公制轮廓。\n\n通过 UV 或水平尺度锚定以及重构的复杂路径样本的合理延续，该方法再现了基准 BTZ、四维 Schwarzschild 和 Reissner-Nordström (RN) 黑化因子。然而，Gubser-Rocha 示例表明，具有非平凡空间扭曲因子的单个可观测条带仅确定度量函数的一种函数组合。", "authors": [{"name": "Hao Feng"}, {"name": "Tian-Shun Chen"}, {"name": "Shao-Feng Wu"}], "featured_authors": [{"name": "Hao Feng"}, {"name": "Tian-Shun Chen"}, {"name": "Shao-Feng Wu"}], "author_count": 3}, {"id": "2608.16522", "category": "hep-th", "title": "7-branes and $Γ_0(2)$ Duality in Type 0B String Theory", "abstract": "We investigate 7-branes in type 0B string theory, motivated by the recent proposal of Baykara, Dudas, and Vafa, which connects type 0B string theory with M-theory. On the $Q$-symmetric branch, the self-duality group of type 0B string theory is $\\Gamma_0(2)$, whose Abelianization is $\\mathbb{Z}\\times\\mathbb{Z}_4$. This implies the existence of two independent 7-brane charges. We construct explicit charge operators in terms of modular forms and identify the corresponding charged objects in gravity solutions. One is the ordinary D7-brane, while the other is a 7-brane carrying a nontrivial $\\mathbb{Z}_4$ charge. We further construct a compact background consisting of eight such $\\mathbb{Z}_4$ 7-branes using a restricted Weierstrass model. Remarkably, in this background the axio-dilaton is fixed to the constant value $\\tau=(1+\\mathsf{i})/2$, which coincides with the unstable de Sitter critical point proposed in the M-theory description of type 0B string theory. We also analyze fluctuations in the $Q$-odd sector and find that, although the corresponding equations of motion are globally well-defined in this background, the closed string tachyon remains unstable. Our results provide a concrete realization of new 7-branes in type 0B string theory and clarify their relation to its strong-coupling structure.", "url": "https://arxiv.org/abs/2608.16522", "type": "理论", "summary": "我们研究了 0B 型弦理论中的 7-膜，受到 Baykara、Dudas 和 Vafa 最近提出的将 0B 型弦理论与 M 理论联系起来的启发。在$Q$对称分支上，0B型弦论的自对偶群为$\\Gamma_0(2)$，其阿贝尔化为$\\mathbb{Z}\\times\\mathbb{Z}_4$。这意味着存在两个独立的七膜电荷。我们以模块化形式构造显式电荷算子，并识别重力解中相应的带电物体。一种是普通的 D7 膜，另一种是带有重要 $\\mathbb{Z}_4$ 电荷的 7 膜。我们进一步使用受限的 Weierstrass 模型构建了一个由八个这样的 $\\mathbb{Z}_4$ 7-膜组成的紧凑背景。值得注意的是，在此背景下，轴膨胀被固定为常数值 $\\tau=(1+\\mathsf{i})/2$，这与 0B 型弦理论的 M 理论描述中提出的不稳定德西特临界点一致。我们还分析了$Q$-奇扇区的波动，发现尽管在此背景下相应的运动方程是全局明确定义的，但闭弦快子仍然不稳定。\n\n我们的结果提供了 0B 型弦理论中新 7 膜的具体实现，并阐明了它们与其强耦合结构的关系。", "authors": [{"name": "Naoto Kan"}, {"name": "Masashi Kawahira"}, {"name": "Hiroki Wada"}], "
