gen scheduling setting and deploy it on the QuEra Aquila neutral-atom quantum processor. This is the first end-to-end industrial scheduling workflow that connects real operational decisions to programmable neutral-atom hardware through a solver-agnostic MWIS representation. Across a 15-day hardware campaign on 50-node instances, hardware-generated solutions after classical refinement match or exceed the dispatch margins obtained from exact MWIS on every day. When scaling to 144 nodes, encoding quality remains stable, while the probability that the full atom array survives, rather than graph embedding, emerges as the dominant bottleneck to further scaling. Together, these results establish a hardware-compatible computational pathway toward larger problem scales, and lay the groundwork for exploring regimes in which exact classical optimisation may no longer scale efficiently.", "url": "https://arxiv.org/abs/2609.01248", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jiying Chen"}, {"name": "Min Lin"}, {"name": "Jingwei Wen"}, {"name": "Zhihong Zhang"}, {"name": "Chuixiong Wu"}], "featured_authors": [{"name": "Jiying Chen"}, {"name": "Min Lin"}, {"name": "Jingwei Wen"}, {"name": "Zhihong Zhang"}, {"name": "Chuixiong Wu"}], "author_count": 5}, {"id": "2609.01267", "category": "quant-ph", "title": "A nonabelian anyon violates Haag duality", "abstract": "We show that a superselction sector describing a single nonabelian anyon violates Haag duality, which is equivalent to the fundamental quantum-information theoretic principle of uniqueness of purifications. We provide a simple physics argument as well as a rigorous proof using sector theory, and instantiate our result concretely in Levin-Wen models. We also show that the associated ground state does not allow for quantum steering despite being a pure state. Finally, we show that this ground state violates approximate Haag duality, disproving the conjecture that all gapped ground states satisfy this condition. Our result implies that there are gapped phases of matter where Haag duality fails at every point in the phase.", "url": "https://arxiv.org/abs/2609.01267", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daniel Wallick"}, {"name": "Henrik Wilming"}], "featured_authors": [{"name": "Daniel Wallick"}, {"name": "Henrik Wilming"}], "author_count": 2}, {"id": "2609.01280", "category": "quant-ph", "title": "Dynamical regimes of QAOA gradient response", "abstract": "Characterizing the trainability of the Quantum Approximate Optimization Algorithm (QAOA) requires understanding how its gradient landscape changes across circuit parameters and problem size. Yet these gradients are usually described in terms of the native QAOA angles, making it difficult to distinguish parameter specific features from broader changes in the underlying circuit dynamics. Here we introduce a dynamical representation of the QAOA parameter space based on a norm-weighted layer strength and a cost--mixer imbalance, separating the overall scale of the evolution from the relative contribution of the two generators. Using exact-state simulations of MaxCut, we find that the gradient landscape exhibits a coarse organization in these dynamical variables that persists across changes in circuit depth and schedule structure, while the finer interference pattern remains schedule dependent. Near-optimal solutions do not simply coincide with the largest local gradients, but instead occupy a distinct intermediate dynamical regime. Uniform schedules recover the broad location of this regime, whereas nonuniform schedules mainly reorganize its fine structure. Across the system sizes studied, near-optimal solution regions remain extended in the dynamical representation while their preimages in the native QAOA angles become substantially compressed at larger sizes. These results separate the persistence of useful QAOA dynamics from their accessibility in the native parameterization, and provide a dynamical framework for interpreting QAOA trainability across circuit and problem scales.", "url": "https://arxiv.org/abs/2609.01280", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zarin Shakibaei"}, {"name": "Alexander Schnell"}], "featured_authors": [{"name": "Zarin Shakibaei"}, {"name": "Alexander Schnell"}], "author_count": 2}, {"id": "2609.01299", "category": "quant-ph", "title": "Emerging Personas and Tools for Hybrid Quantum-HPC Systems", "abstract": "Quantum computing is entering an era where quantum processing units (QPUs) with tens to hundreds of qubits are increasingly integrated with high-performance computing (HPC) systems to support hybrid quantum-classical workloads. This paradigm, often referred to as Quantum-Centric SuperComputing (QCSC), introduces new operational, software, and infrastructure challenges. In this paper, we identify and characterize six distinct personas involved in QCSC environments. Particular attention is given to emerging roles that arise at the interface between quantum and HPC systems. We analyze the responsibilities and tools associated with each persona and examine their differing requirements for operational data. Consistent data representations and analytics frameworks will be required to support diverse users across the quantum-HPC ecosystem. By defining personas and their data needs, we provide a foundation for future discussions in this critical area.", "url": "https://arxiv.org/abs/2609.01299", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Eun-Kyung Lee"}, {"name": "Jessie Yu"}, {"name": "Claudio Carvalho"}, {"name": "Yoonho Park"}, {"name": "Marcelo Amaral"}, {"name": "Tim Osborne"}, {"name": "Woong Shin"}], "featured_authors": [{"name": "Eun-Kyung Lee"}, {"name": "Jessie Yu"}, {"name": "Claudio Carvalho"}, {"name": "Marcelo Amaral"}, {"name": "Tim Osborne"}, {"name": "Woong Shin"}], "author_count": 7}, {"id": "2609.01334", "category": "quant-ph", "title": "Fast Microwave-free State Preparation and Measurement of Superconducting Qubits", "abstract": "Fast, high-fidelity, scalable state preparation and measurement is critical to the realization of a quantum computing system. The state-of-the-art methods for preparation and readout of superconducting qubits require finely tuned microwave signals and ~100 ns of measurement time, which are major obstacles to the scalability and performance of superconducting quantum computers. Here, we have demonstrated novel, microwave-free methods for both preparation and readout of superconducting qubits with >99% fidelity in only 10 ns for either operation while maintaining qubit coherence. This technology is compatible with scalable superconducting digital control systems, and using quantum flux parametrons for amplification, we demonstrated full quantum-to-digital conversion in only 15 ns, which is an order of magnitude faster than state-of-the-art microwave-based techniques.", "url": "https://arxiv.org/abs/2609.01334", "type": "实验", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "R. Abraham"}, {"name": "F. Amet"}, {"name": "P. Anderson"}, {"name": "M. Arrigo"}, {"name": "J. Arteaga"}, {"name": "C. J. Ballard"}, {"name": "C. Barker"}, {"name": "T. Barnes"}, {"name": "P. Bechman"}, {"name": "R. Bhatt"}, {"name": "K. Blaine"}, {"name": "T. M. Borman"}, {"name": "J. Botimer"}, {"name": "G. R. Boyd"}, {"name": "P. Bradley"}, {"name": "A. D. Brandon"}, {"name": "T. K. Bristol"}, {"name": "A. Bulkos"}, {"name": "R. M. Burnett"}, {"name": "D. Burrowes"}, {"name": "D. N. Cakan"}, {"name": "N. Carniero"}, {"name": "T. Chamberlin"}, {"name": "D. Chen"}, {"name": "M. Chilcote"}, {"name": "B. G. Christensen"}, {"name": "I. Christie"}, {"name": "J. Clark"}, {"name": "D. Clarke"}, {"name": "J. M. Cochran"}, {"name": "J. C. Collini"}, {"name": "K. Connolly"}, {"name": "G. Costa"}, {"name": "D. Cowger"}, {"name": "B. Dalfort"}, {"name": "D. Davies"}, {"name": "S. Deitemeyer"}, {" {"name": "M. E. Weippert"}, {"name": "T. Weitzel"}, {"name": "J. Wenner"}, {"name": "L. White"}, {"name": "S. Whitsitt"}, {"name": "A. Wilkinson"}, {"name": "R. Willey"}, {"name": "I. Yandow"}, {"name": "J. Yang"}, {"name": "L. Yu"}, {"name": "F. Yumiceva"}, {"name": "V. Zheng"}, {"name": "R. Zimmerman"}, {"name": "C. Zinn"}, {"name": "J. Ziskind"}, {"name": "et al. (114 additional authors not shown)"}], "featured_authors": [{"name": "R. Abraham"}, {"name": "F. Amet"}, {"name": "P. Anderson"}, {"name": "C. Zinn"}, {"name": "J. Ziskind"}, {"name": "et al. (114 additional authors not shown)"}], "author_count": 215}, {"id": "2609.01340", "category": "quant-ph", "title": "Quantum phase transitions of the Cavity Heisenberg spin-chain", "abstract": "The interplay between quantum criticality and ergodicity breaking constitutes a central challenge in complex quantum many-body systems. Here, we investigate ground-state quantum phase transitions (QPTs) and excited-state quantum phase transitions (ESQPTs), as well as ergodic-nonergodic transition in the cavity Heisenberg spin-chain (CHS) model. By combining quantum information measures with semiclassical fixed-point analysis, we identify a deformed phase that interpolates between the normal and superradiant phases, featuring a logarithmic nonanalyticity in the density of states (DoS) and two additional jump discontinuities. We further elucidate the spectral-structure mechanism underlying the connection between ESQPTs and the ergodic--nonergodic transition (ENET) via level statistics, participation ratios, and multifractal analysis. Our results provide a general framework for characterizing phase structures and spectral features in light--matter quantum many-body systems.", "url": "https://arxiv.org/abs/2609.01340", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lv-Ting Gong"}, {"name": "Shao-Fan He"}, {"name": "Fu-Quan Dou"}], "featured_authors": [{"name": "Lv-Ting Gong"}, {"name": "Shao-Fan He"}, {"name": "Fu-Quan Dou"}], "author_count": 3}, {"id": "2609.01524", "category": "quant-ph", "title": "Quantum Weighted Moving Average for Predicting Limit Order Book Trends", "abstract": "Can quantum computers be useful for forecasting multivariate financial time series? In this work, we consider the problem of predicting price trends from limit order book (LOB) data. After identifying key components of classical models, we introduce the quantum weighted moving average (QWMA) model. The two main building blocks are, first, classically preprocessing via normalization of both feature and temporal dimensions and, second, a linear combination of unitaries-based layer for unitarily-embedded classical data. The models are evaluated on the FI-2010 benchmark dataset and a second dataset of China A-share stocks. While we do not present evidence of quantum advantage, the combined classical-quantum model demonstrates performances close to the best classical models. The quantum part of the model is expressive enough to focus on the most predictive parts of the time series. Several specializations of the QWMA model are considered, in particular a variant related to the widely-used exponential moving average (EMA). We give consideration to the limitations of the methods and the datasets.", "url": "https://arxiv.org/abs/2609.01524", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthias Kamm"}, {"name": "Dinh-Long Vu"}, {"name": "Patrick Rebentrost"}], "featured_authors": [{"name": "Matthias Kamm"}, {"name": "Dinh-Long Vu"}, {"name": "Patrick Rebentrost"}], "author_count": 3}, {"id": "2609.01547", "category": "quant-ph", "title": "Irreducibility and regularisation properties of Gaussian quantum Markov semigroups", "abstract": "We study regularisation and irreducibility properties of Gaussian quantum Markov semigroups (GQMSs) acting on continuous-variable quantum systems. We first identify a natural notion of regularity for operators in this setting, which allows us to formulate and characterise the smoothing effects of GQMSs in terms of algebraic conditions involving the drift and quantum diffusion matrices. These conditions establish a connection with the controllability theory of quantum linear systems and with the structure of decoherence-free subsystems. We then characterise irreducibility through several equivalent algebraic criteria: one formulated in terms of the drift and quantum diffusion matrices, one in terms of the operators appearing in the generalised GKLS representation of the generator, and a third given by a quantum analogue of Hörmander's condition. A central and somewhat surprising consequence is that, in contrast with the classical case, irreducibility is strictly stronger than conditions ensuring regularisation. Our results provide an algebraic framework for analysing these properties and lay the groundwork for a broader study of reducible Gaussian quantum Markov semigroups and, more generally, more general relevant quantum Markov semigroups on continuous-variable systems.", "url": "https://arxiv.org/abs/2609.01547", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Franco Fagnola"}, {"name": "Federico Girotti"}], "featured_authors": [{"name": "Franco Fagnola"}, {"name": "Federico Girotti"}], "author_count": 2}, {"id": "2609.01605", "category": "quant-ph", "title": "Depth-1 expanders on the unitary group and applications", "abstract": "We construct a constant-degree and constant-gap quantum expander on $n$ qubits where each unitary can be implemented by a depth-$1$ and 1D circuit of Pauli or CNOT gates. We provide two applications of this expander. First, we use it to construct a family of frustration-free 1D Hamiltonians whose ground states obey the entanglement-gap relation $S = \\Theta(\\Delta^{-1/2})$; this is believed to be optimal, but achieving it had been open. Second, we use it to provide a streaming protocol that tests for closeness to a class of 1D volume-law entangled states. Moreover, we extend our quantum expander to a constant-degree and constant-gap expander on the unitary group where each unitary is a single $T$ gate, a single $T^{\\dagger}$ gate, or a depth-$1$ Clifford circuit. This implies that a random sequence of unitaries from the expander yields a gapped walk on a dense subgroup of the unitary group. This improves upon previous work by Bourgain and Gamburd which did not control the dependence of the gap on the dimension.", "url": "https://arxiv.org/abs/2609.01605", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anurag Anshu"}, {"name": "Shankar Balasubramanian"}, {"name": "Jonas Haferkamp"}, {"name": "Aram W. Harrow"}, {"name": "Xinyu Tan"}], "featured_authors": [{"name": "Anurag Anshu"}, {"name": "Shankar Balasubramanian"}, {"name": "Jonas Haferkamp"}, {"name": "Aram W. Harrow"}, {"name": "Xinyu Tan"}], "author_count": 5}];

    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
