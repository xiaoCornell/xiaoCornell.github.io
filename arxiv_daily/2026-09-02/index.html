 finite temperature, a subsystem occupying less than half of the total system can carry high complexity at late times, even as the complexity of its larger complement remains low. This inversion of the usual hierarchy is intrinsically thermal: it vanishes in the infinite-temperature limit, which is the regime modeled by random quantum circuits. Second, if a subsystem's complexity equilibrates at an early time, then fragmenting it into $m$ disjoint components can further reduce this timescale by a factor of $m$, a phenomenon we exhibit in both holography and random quantum circuits. These results not only sharpen the correspondence between geometric and computational notions of complexity, but also motivate the search for novel complexity phenomena in quantum dynamics.", "url": "https://arxiv.org/abs/2609.00126", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yale Fan"}, {"name": "Nicholas Hunter-Jones"}, {"name": "Andreas Karch"}, {"name": "Minju Kum"}, {"name": "Shivan Mittal"}], "featured_authors": [{"name": "Yale Fan"}, {"name": "Nicholas Hunter-Jones"}, {"name": "Andreas Karch"}, {"name": "Minju Kum"}, {"name": "Shivan Mittal"}], "author_count": 5}, {"id": "2609.00131", "category": "hep-th", "title": "A 1/4-BPS chiral algebra in D1D5: from charge concentration to BPS chaos", "abstract": "The D1D5 CFT exhibits a charge concentration puzzle for BPS states, similar to, but simpler than, that of $\\mathcal{N}=4$ SYM. We consider the chiral algebra of 1/4-BPS operators in the D1D5 CFT arising from a supercharge cohomology, and the resulting rational correlators. Using crossing symmetry and this chiral algebra, we establish a non-perturbative proof of the existence of a family of 1/4-BPS states away from the charge concentration locus for general coupling and finite central charge. We further discuss possible implications for BPS chaos in the D1D5 CFT and compute a late-time BPS plateau at the orbifold point.", "url": "https://arxiv.org/abs/2609.00131", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexandre Belin"}, {"name": "Suzanne Bintanja"}, {"name": "Alessandra Gnecchi"}, {"name": "Damian R. Musk"}, {"name": "Kyriakos Papadodimas"}], "featured_authors": [{"name": "Alexandre Belin"}, {"name": "Suzanne Bintanja"}, {"name": "Alessandra Gnecchi"}, {"name": "Damian R. Musk"}, {"name": "Kyriakos Papadodimas"}], "author_count": 5}, {"id": "2609.00148", "category": "hep-th", "title": "Regulating Free-scalar and Yang--Lee 5d CFTs on the Fuzzy Four Sphere", "abstract": "Non-commutative sphere regularization of CFT has become a powerful tool for computing conformal data of 3d CFTs and was recently extended to 4d CFTs. In this work we further construct 5d free-scalar CFT and Yang-Lee CFT on a fuzzy 4-sphere. We observe a continuous phase transition and conformal towers in these examples. We obtain the first three scalar primaries of the 5d free-scalar CFT, furthermore, we compute the 5d Yang-Lee $\\Delta_\\phi,\\Delta_{\\phi^3}$ with $N_e=10$ fermions using exact diagonalization (ED) and $N_e=20$ fermions using density matrix renormalization group (DMRG), obtaining relatively good agreement with both $\\epsilon$-expansion and the Gliozzi truncated bootstrap result.", "url": "https://arxiv.org/abs/2609.00148", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jiangyuan Qian"}], "featured_authors": [{"name": "Jiangyuan Qian"}], "author_count": 1}, {"id": "2609.00150", "category": "hep-th", "title": "On the mass spectrum of Viel-dreibein gravity", "abstract": "We study the AdS-wave configurations of Viel-dreibein gravity, a three-dimensional theory of $N$ interacting spin-2 fields, as a pretext to characterize the mass spectrum of this multigravity theory. We manage to implement the known strategy of rewriting the system as a higher-derivative theory for a single dreibein, thereby deriving the precise $2N$th-order equation governing the dynamics of the AdS-wave profile in question. The second novelty we introduce is a factorization of such an equation as the product of $N$ Klein-Gordon operators, exploiting the recent representation of the roots of any $N$th-degree polynomial in terms of the increasingly celebrated $\\mathscr{A}$-hypergeometric functions. Remarkably, this allows us to determine the mass spectrum of the full theory independently of the number of involved gravities, which is essential for an explicit construction of the AdS-wave solutions. This enables us to explore the parameter space of the theory and find all its critical points (not only the Breitenlohner-Freedman bounds) where a much wider range of degeneracies in the squared masses arises. At those points, the solutions allow a zoo of new logarithmic modes leading to several $\\log^{\\chi-1}$ asymptotic behaviors, with $\\chi\\le N$, a signature of the existence of allegedly dual logarithmic conformal field theories.", "url": "https://arxiv.org/abs/2609.00150", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Eloy Ayón-Beato"}, {"name": "Elizabeth Rodr\\'ıguez Querts"}], "featured_authors": [{"name": "Eloy Ayón-Beato"}, {"name": "Elizabeth Rodr\\'ıguez Querts"}], "author_count": 2}, {"id": "2609.00153", "category": "hep-th", "title": "Subleading Collinear Limits of Yang-Mills Amplitudes from Gravity", "abstract": "We show that the subleading collinear sector of Yang-Mills (YM) amplitudes is controlled by ordinary Einstein-Yang-Mills (EYM) amplitudes and their higher-derivative corrections. The complete set of strict subleading collinear limits associated with an equal-helicity collinear pair can be extracted from open-closed string disk amplitudes. The latter generate $\\frac12 (n-3)!$ BCJ-like relations with non-linear kinematic coefficients, reducing the $(n-3)!$ collinear data to a basis of dimension $\\frac12 (n-3)!$. This reduced basis can be represented by gravitational amplitudes in EYM theories and by their higher-derivative open-string corrections. At multiplicity $n$ this gravitational basis consists of the $(n-4)!$ independent EYM subamplitudes together with $\\frac12 (n-5)(n-4)!$ higher-order corrections involving one graviton and $n-2$ gluons. The resulting decomposition is governed by unsigned Stirling numbers of the first kind: the ordinary EYM amplitudes correspond to the sector $\\left[{n-3\\atop 1}\\right]$, the higher-order BCJ-like relations to even sectors $\\left[{n-3\\atop 2j}\\right]$, and the higher-derivative EYM corrections to odd sectors $\\left[{n-3\\atop 2j+1}\\right]$ with $j\\geq 1$.", "url": "https://arxiv.org/abs/2609.00153", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jin Dong"}, {"name": "Stephan Stieberger"}], "featured_authors": [{"name": "Jin Dong"}, {"name": "Stephan Stieberger"}], "author_count": 2}, {"id": "2609.00160", "category": "hep-th", "title": "Exploring thermal order in conformal theories with multiple scalars coupled to an $O(N)$ vector field", "abstract": "We study thermal order in conformal field theories (CFTs) in $d=4-\\epsilon$ and $d=3$ dimensions where several scalars are coupled to an $O(N)$ vector field. In $(4-\\epsilon)$ dimensions, we consider models coupling a cubic model of $M$ scalars with $\\mathbb{Z}_2^M\\rtimes S_M$ symmetry (corresponding to sign flips and permutations of the scalars) to an $O(N)$ vector model. For any $M$, we find a window of $N$ in which two Wilson-Fisher-like fixed points exist. We show that the $\\mathbb{Z}_2^M\\rtimes S_M$ symmetry is spontaneously broken at arbitrary nonzero temperatures for $M=2$ and sufficiently large $N$ within this window, but it remains unbroken for $M>2$. Using the functional renormalisation group to continue these fixed points towards three dimensions, we find that they collide and move into the complex plane well before reaching $d=3$, suggesting that their continuation to $d=3$ does not yield unitary CFTs. We then work directly in three dimensions at large but finite $N$, with $M\\ll N$, initially without assuming any permutation symmetry among the $M$ scalars. By studying the RG flow, we show that these models possess a conformal manifold up to the leading nontrivial order in the $1/N$ expansion of the beta functions (which is $\\mathcal{O}(1/N)$). At each point on this manifold, the scalars split into two classes that are distinguished by how they couple to the $O(N)$ vector field. We then restrict to a subspace of the conformal manifold where there is an additional symmetry under permutations of the scalars within each class. We prove that in a domain of this subspace, all $M$ scalars acquire thermal expectation values such that the symmetry under sign flips of the scalars is spontaneously broken at all nonzero temperatures. This provides a novel class of large $N$ CFTs that exhibit a rich pattern of persistent symmetry breaking at nonzero temperatures.", "url": "https://arxiv.org/abs/2609.00160", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Soumyadeep Chaudhuri"}, {"name": "Bilal Hawashin"}, {"name": "Eliezer Rabinovici"}, {"name": "Michael M. Scherer"}], "featured_authors": [{"name": "Soumyadeep Chaudhuri"}, {"name": "Bilal Hawashin"}, {"name": "Eliezer Rabinovici"}, {"name": "Michael M. Scherer"}], "author_count": 4}, {"id": "2609.00170", "category": "hep-th", "title": "Higher anomalies, compressing SPTs and cohomology operations", "abstract": "We explicitly compute and tabulate the suspension map for cohomology operations, applying it to the dimensional reduction of anomalies and higher group structures of generalised symmetries in quantum field theories and lattice systems. In a quantum system with a discrete $p$-form symmetry, we can restrict the symmetry defects to a codimension-$q$ subspace of spacetime, or equivalently confine the gauge field to a slab whose thickness approaches zero. This results in a $(p-q)$-form symmetry on the subspace. We determine the fate of two important properties of symmetries under this process. First, we compute the anomaly of the reduced symmetry, or the higher anomaly of the original symmetry, which acts as an obstruction to higher gauging and onsiteability. Second, for two symmetries forming a higher-group structure, encoded as a Postnikov class, we compute the reduced higher-group structure, which may or may not be trivial. Both cases are captured by the $q$-fold iteration of the cohomology suspension $\\Omega$, also known as the loop functor or transgression, in the cohomology of Eilenberg--MacLane spaces. Classical results state that $\\Omega$ is an isomorphism in a stable range and annihilates mixed anomalies. To calculate $\\Omega$ over a base ring which is not a field, we make use of small models for the chain DGAs of Eilenberg--MacLane spaces, pioneered by Cartan and Moore, whose results we review and extend. The critical added step is the improvement of a mod $p$ chain contraction to the $p$-local integers, obtained via a $p$-adic series. We automate the computations in a software package \\texttt{emcm}, and provide extensive tables of the results. Finally, to make contact with explicit cochain formulations of cohomology operations, we demonstrate how to calculate cup products and certain cup-$i$ products in this framework.", "url": "https://arxiv.org/abs/2609.00170", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shani Nadir Meynet"}, {"name": "Elias Riedel Gårding"}], "featured_authors": [{"name": "Shani Nadir Meynet"}, {"name": "Elias Riedel Gårding"}], "author_count": 2}, {"id": "2609.00214", "category": "hep-th", "title": "Anomaly Matching between Topological Superconductors and $\\mathcal{N}=8$ Supergravity", "abstract": "The boundary of a $3{+}1$-dimensional topological superconductor carries a $\\mathbb{Z}_{16}$-valued global (Dai-Freed) anomaly, famously matched by the $16$ fermions of a Standard Model generation once a certain $\\mathbb{Z}_4$ symmetry is gauged. In a supergravity completion, though, a gravitino contributes $-7/16$ rather than $\\pm1/16$, obstructing this $\\mathbb{Z}_4$ in the Minimal Supersymmetric Standard Model. We observe that four-dimensional $\\mathcal{N}=8$ supergravity evades this fate. Its fermions, eight gravitini in the $\\mathbf 8$ and fifty-six spin-$\\tfrac12$ states in the $\\mathbf{56}=\\Lambda^3\\mathbf 8$ of the $SU(8)$ R-symmetry, saturate the anomaly. The cancellation holds for every admissible $\\mathbb{Z}_4$ structure, is consistent with the vanishing of the continuous $SU(8)$ anomaly, and follows from a Smith homomorphism identifying the supergravity anomaly with that of the topological superconductor. In maximal supergravity this $\\mathbb{Z}_4$ stays anomaly-free and gaugeable despite its eight gravitini. All numbers are reproduced by an open-source library described in the Supplemental Material.", "url": "https://arxiv.org/abs/2609.00214", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Christopher W. Murphy"}], "featured_authors": [{"name": "Christopher W. Murphy"}], "author_count": 1}, {"id": "2609.00328", "category": "hep-th", "title": "Accretion, mergers, and metastability of fuzzy spheres in a three-matrix model", "abstract": "A three-matrix model that contains a plethora of fuzzy sphere solutions was defined twenty years ago. It has been shown that in a certain regime of the model, combinations of fuzzy spheres become classical solutions of the model. In the original paper and subsequent works, the stability of specific states has been discussed, showing that only a single largest fuzzy-sphere configuration is stable. Here, we focus on a complementary question: starting from some initial configuration, is the thermodynamically preferred state approached rapidly, or are there other long-lived, metastable configurations which may support interesting physics? We find that the answer in the large-matrix limit depends on the dispersion of the initial configuration. We identify the elementary transition as an accretion, in which one sphere absorbs a single unit from another, and show that it is driven by fluctuations of the sphere centers. By measuring these fluctuations in long simulations, we find quantitative agreement with the one-loop effective action, with no free parameters. For multi-sphere states, we find that the stiffness of an inner sphere grows logarithmically with the number of surrounding layers, so that concentric onion-like configurations -- describing an emergent three-dimensional quantum space -- become increasingly long-lived.", "url": "https://arxiv.org/abs/2609.00328", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "M. Hrmo"}, {"name": "S. Kováčik"}, {"name": "K. Magdolenová"}, {"name": "A. Manta"}, {"name": "K. Nedeľková"}, {"name": "P. Rusnák"}, {"name": "H. C. Steinacker"}, {"name": "J. Tekel"}], "featured_authors": [{"name": "M. Hrmo"}, {"name": "S. Kováčik"}, {"name": "K. Magdolenová"}, {"name": "P. Rusnák"}, {"name": "H. C. Steinacker"}, {"name": "J. Tekel"}], "author_count": 8}, {"id": "2609.00353", "category": "hep-th", "title": "Topologically induced deformations of differential forms", "abstract": "Motivated by deformations of spin structures and their geometric implications, we study a deformed exterior derivative, which is a third-order nilpotent operator. This higher-order differential structure induces an anholonomic rescaling of the local frame and leads to a bifurcation of the associated cohomological structure, with two distinct notions of closedness and exactness. We prove that the Poincaré Lemma fails in both sectors, so that closed deformed forms need not be exact even locally. We then apply the resulting framework to a four-dimensional effective field theory and show that a constant saturation of the deformation parameter can generate a hierarchy between the electroweak and fundamental Planck scales through a purely geometric mechanism, without introducing extra spatial dimensions.", "url": "https://arxiv.org/abs/2609.00353", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "J. M. Hoff da Silva"}, {"name": "J. M. B. Matzenbacher"}, {"name": "R. da Rocha"}], "featured_authors": [{"name": "J. M. Hoff da Silva"}, {"name": "J. M. B. Matzenbacher"}, {"name": "R. da Rocha"}], "author_count": 3}, {"id": "2609.00558", "category": "hep-th", "title": "Iso-$μ/T$ holographic entropy and its attractor for a strongly coupled quantum fluid", "abstract": "Numerical evidence has shown that a period of vanishing entropy production during far-from-equilibrium stages induces subsequent violations of the dominant energy condition in strongly coupled plasmas. This behavior also appears to hold for a Bjorken-expanding, hot and dense strongly coupled quantum fluid. In this context, it has been established that the chemical potential-to-temperature ratio ($\\mu/T$) in the medium increases with higher initial charge density, $\\rho_0$, and/or lower initial energy density, $\\varepsilon_0$. Here, we present a numerical method to evolve Bjorken R-charged plasmas by varying $(\\varepsilon_0,\\rho_0)$ in order to generate a curve that preserves a constant $\\mu/T$. This allows us to address the case in which all Bekenstein-Hawking entropy densities evolve towards configurations with the same $\\mu/T$. This approach enables a more direct comparison with the $\\mathcal{N}=4$ SYM plasma case ($\\mu/T=0$) and, consequently, provides clearer evidence of the correlation between entropy production and violations of the dominant energy condition. Moreover, this procedure offers a characterization (albeit numerical and partial) of the iso$-\\mu/T$ entropy density hydrodynamic attractor for hot and dense strongly coupled quantum fluids.", "url": "https://arxiv.org/abs/2609.00558", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "W. Barreto"}], "featured_authors": [{"name": "W. Barreto"}], "author_count": 1}, {"id": "2609.00797", "category": "hep-th", "title": "Carroll Limit of $\\mathcal{O}(F^2)$ $\\text{D}_p$-branes from Kaluza--Klein-like Null reduction in the Polyakov Formulation", "abstract": "We construct the electric and magnetic Carroll limits of the $\\mathcal{O}(F^2)$-truncated $\\text{D}_p$-brane via the Polyakov--KK route, which combines a single-mode Kaluza--Klein-like reduction at fixed light-cone momentum with a Dirac classification that keeps the auxiliary worldvolume frame. Unlike the $U(1)$-free ILST string, for $p\\geq2$ the Carrollian D$_{p}$-brane cannot be treated as a consistent fixed-frame constrained system after the Dirac classification. In the electric family the obstruction is directly produced by the worldvolume $U(1)$ matter sector, while in the magnetic family the frame retention is forced by the scalar kinetic's density-weight structure rather than by the $U(1)$ currents. The frame must therefore be retained through the classification and eliminated afterwards by Dirac brackets. Freezing it beforehand is not a legitimate step in the Dirac procedure. The embedding scalar sector inherits the Carroll--Weyl $\\chi$ structure at the level of the ILST kinetic density, which is $\\chi$-invariant, whereas the full scalar action is only $\\chi$-covariant. The local extension of $\\chi$ to the full matter sector is obstructed by the $U(1)$ sector through the Gauss, circle and $A_-$-gradient brackets. The electric family keeps the global rescaling as a weak symmetry, while the magnetic family fails even for a global parameter. For $P_{-}\\neq0$ the electric and magnetic families have $d-2$ and $d-3$ degrees of freedom, and the restored local circle at $P_{-}=0$ removes one further degree of freedom in each family. These features identify the resulting theories as constrained systems distinct from both the null string and the parent $\\mathcal{O}(F^2)$ DBI theory, and we also discuss their on-shell interpretation and relation to tensionless/null strings.", "url": "https://arxiv.org/abs/2609.00797", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Limin Zeng"}], "featured_authors": [{"name": "Limin Zeng"}], "author_count": 1}, {"id": "2609.00942", "category": "hep-th", "title": "Fuchsian Resonance and a Horizon-to-Boundary Dictionary for Pole-Skipping", "abstract": "Pole-skipping occurs at special complex frequencies and momenta where the retarded Green function of a black-hole or black-brane background is not uniquely defined. The local near-horizon mechanism is well known: at resonance, a Frobenius recurrence matrix loses rank and the space of smooth horizon solutions enlarges. We address the global question of how two boundary-normalized solutions enter this resonant horizon solution space. For a general second-order scalar radial equation on a nonextremal background analytic near the horizon, the Frobenius recurrence at the resonant order yields a solvability condition. We prove that its vanishing is equivalent to singularity of the horizon recurrence matrix, absence of the logarithmic Frobenius term, and existence of two independent smooth horizon solutions. Away from resonance, the source zero is equivalent to horizon smoothness of the response-normalized solution, while the response zero is equivalent to horizon smoothness of the source-normalized solution. We then analyze the parameter-dependent simple pole of the nonresonant ingoing solution as resonance is approached. After removing this singularity, its resonant limit is proportional to the larger-root Frobenius solution, with proportionality factor given by the same solvability function. Continuing to the boundary shows that the same condition is equivalent to simultaneous vanishing of the two regularized boundary connection coefficients. This establishes a horizon-to-boundary dictionary between local Fuchsian resonance and the boundary source-response 0/0 structure of pole-skipping. Finally, different directions of approach can select different resonant solutions, with the selection governed by the first parameter variation of the same solvability function.", "url": "https://arxiv.org/abs/2609.00942", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yoon-Seok Choun"}], "featured_authors": [{"name": "Yoon-Seok Choun"}], "author_count": 1}, {"id": "2609.01039", "category": "hep-th", "title": "Logarithmic corrections to the entropy for near-extremal rotating black holes", "abstract": "An interesting feature of quantum corrections to the Bekenstein--Hawking entropy is the appearance of logarithmic area terms, whose coefficients are governed by the spectrum of massless fields. For near-extremal black holes, the entropy also receives a logarithmic temperature corrections, whose coefficient is determined by the zero modes of the corresponding extremal black holes. In this paper, we study near-extremal rotating black holes in three, four, and five dimensions with an important focus on rotational zero modes. For three-dimensional BTZ black holes, our results are in agreement with the microscopic description. Furthermore, by treating the cosmological constant scale \\(\\ell\\) as an independent parameter, we find an additional \\(\\log \\ell\\) correction to the entropy at extremality. For the five-dimensional BMPV black hole, we explicitly construct all the extremal zero modes and use them to evaluate the log temperature corrections to the entropy.", "url": "https://arxiv.org/abs/2609.01039", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nabamita Banerjee"}, {"name": "Koustubh Guha"}, {"name": "Muktajyoti Saha"}], "featured_authors": [{"name": "Nabamita Banerjee"}, {"name": "Koustubh Guha"}, {"name": "Muktajyoti Saha"}], "author_count": 3}, {"id": "2609.01097", "category": "hep-th", "title": "Galilean Kalb-Ramond Field", "abstract": "In this paper, we build the Galilean limit of the free Kalb-Ramond two-form and also study the symmetries. Two different methods are discussed. The first is an Inönü-Wigner contraction. In this method, we take the scaling of space-time coordinates and the two-form field. The relativistic equations boil down to two inequivalent limits, electric and magnetic. In both, the equations of motion come out to be invariant under the full infinite-dimensional Galilean conformal algebra precisely in D=6. The second method is the null-reduction. In this, we start from a theory in D+1 dimensions and end up with a theory in D dimensions. This method yields a local Galilean Lagrangian. Here, the action is invariant under the global generators (boosts, rotations, translations and scale transformations) but not under higher Witt modes of the Galilean conformal algebra. We also calculate the two-point functions in both constructions from the boost, scale and rotation Ward identities, and by exhibiting the truncation that maps the null-reduction correlators onto those of the magnetic limit.", "url": "https://arxiv.org/abs/2609.01097", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Aditya Mehra"}], "featured_authors": [{"name": "Aditya Mehra"}], "author_count": 1}, {"id": "2609.01332", "category": "hep-th", "title": "Perturbative Double-Scalar Hair on Planar Black Holes in AdS$_{4}$ Einstein-Scalar Gravity", "abstract": "We construct a two-scalar hairy planar black hole in four-dimensional Einstein gravity coupled to two scalars whose potential descends from the ABJM consistent truncation of eleven-dimensional supergravity. Starting from the known single-scalar hairy black brane, we switch on the second scalar $\\phim$ perturbatively in its amplitude $\\eps$ and solve the coupled Einstein-scalar system to order $\\eps^{2}$. The linearized $\\phim$ profile is an exact hypergeometric function, independent of the $\\pp$ hair, whose horizon-regular branch always carries a source, so there is no spontaneous $\\phim$ hair. Because the dual operator $\\mathcal{O}_{-}$ is irrelevant ($\\Delta=4$), the second-order response develops a logarithmically running condensate with a closed-form, scheme-independent slope $\\tfrac{\\sqrt{21}}{70}C_{s}^{2}$. The renormalized free energy is scheme dependent, but the geometric temperature shift $\\delta T/T_{0}\\approx-0.345\\,\\eps^{2}$ at fixed entropy is not. The full metric and $\\pp$ back-reaction is obtained in closed form, diagonalizing into two Pöschl-Teller problems with $\\delta\\pp=\\tfrac{6}{\\sqrt7}\\,\\delta H$. Three transport coefficients of the dual fluid remain exactly conformal to this order, while the sound speed, like the free energy, is scheme dependent.", "url": "https://arxiv.org/abs/2609.01332", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sangheon Yun"}], "featured_authors": [{"name": "Sangheon Yun"}], "author_count": 1}, {"id": "2609.01454", "category": "hep-th", "title": "Lagrangian varieties from $q$-matrix models", "abstract": "We consider three specific $q$-deformed matrix models (the Chern-Simons, $q$-Laguerre, and $q$-Gaussian matrix models) which can be solved explicitly using the property of superintegrability. We show that one- and two-point functions of inverse characteristic polynomials can be interpreted as quantizations of Lagrangian subvarieties in $(\\mathbb{C}^*)^2$ and $(\\mathbb{C}^*)^4$, respectively. While such a geometric picture is expected for the Chern-Simons matrix model, our results for the $q$-Laguerre and $q$-Gaussian models are new and exhibit additional features. In particular, specific anti-symplectic birational involutions play an essential role in the construction. This reformulation provides a geometric framework for analyzing the semiclassical, large-$N$ expansion of matrix-model correlators. This picture is suggestive of the geometry underlying open topological strings, although the two constructions are not identical and the precise relation between them remains to be understood.", "url": "https://arxiv.org/abs/2609.01454", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Victor Mishnyakov"}, {"name": "Maxim Zabzine"}], "featured_authors": [{"name": "Victor Mishnyakov"}, {"name": "Maxim Zabzine"}], "author_count": 2}, {"id": "2609.01517", "category": "hep-th", "title": "Non-symmetric triads and Baker-Akhiezer functions", "abstract": "The symmetric Macdonald polynomial at peculiar values of parameter $t=q^{-m}$, $m\\in\\mathbb{Z}_{\\ge 0}$ is naturally split into non-symmetric parts, which are the (quasi)polynomial Baker-Akhiezer (BA) functions. One may think this is due to symmetricity, and one just picks up this way non-symmetric parts already containing all the information. However, we demonstrate that, in the case of {\\bf non-symmetric} Macdonald polynomials, it still works, though each single BA function splits into $N!$ distinct (quasi)polynomial BA functions. The sum of these functions gives rise to the universal solution of the eigenstate problem for the Cherednik Hamiltonians. Extending to arbitrary values of $t$ is also immediate giving rise to counterparts of the Noumi-Shiraishi power series. Altogether, this power series and its reductions to non-symmetric Macdonald polynomials and to BA functions form a non-symmetric triad. There are $N!$ different branches of the non-symmetric triad, each branch being split into $N!$ distinct triads, and of these $(N!)^2$ triads $N!(N-1)!$ are independent. We describe in detail the simplest $N=2$ case.", "url": "https://arxiv.org/abs/2609.01517", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. Mironov"}, {"name": "A. Morozov"}, {"name": "A. Popolitov"}], "featured_authors": [{"name": "A. Mironov"}, {"name": "A. Morozov"}, {"name": "A. Popolitov"}], "author_count": 3}, {"id": "2609.00020", "category": "math-ph", "title": "Chern--Simons Fluctuations and Information Geometry in Discrete Electromagnetism", "abstract": "We construct helicity-conditioned statistical states for a Whitney-discretized electromagnetic field on a closed oriented three-manifold. The simplicial de Rham complex provides exact discrete gauge symmetry, while the Whitney inner product separates exact, harmonic, and coexact sectors. The spatial Abelian Chern--Simons functional is gauge invariant and depends only on the coexact potential. After fixing harmonic modes, we introduce a helicity-biased Gaussian ensemble on the reduced electromagnetic phase space and derive explicit formulas for its admissible parameters, partition function, mean helicity, relative entropy, and Fisher information. The distribution uniquely minimizes relative entropy under a prescribed mean-helicity constraint. Its helicity susceptibility equals the variance of the discrete Chern--Simons functional and controls the local distinguishability of neighboring statistical states. Because magnetic helicity is generally not conserved under unconstrained Maxwell dynamics, these states represent conditioned inference rather than dynamical equilibrium.", "url": "https://arxiv.org/abs/2609.00020", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jean-Pierre Magnot"}], "featured_authors": [{"name": "Jean-Pierre Magnot"}], "author_count": 1}, {"id": "2609.00034", "category": "math-ph", "title": "Alternative-mean trace divergences: geometry, data processing, and barycenters", "abstract": "Let $f:(0,\\infty)\\to(0,\\infty)$ be a nontrivial normalized operator monotone function and set $s=f'(1)$. We introduce the alternative-mean trace functional $$ \\altPhi_f(A,B) :=\\Tr(A\\nabla_s B) -\\Tr\\!\\left( f(A^{-1}\\sharp B)\\,A\\,f(A^{-1}\\sharp B) \\right). $$ on the positive definite cone. We prove that $\\altPhi_f$ is a quantum divergence in the sense of Bhatia--Gaubert--Jain whose diagonal Hessian induces a positive multiple of the Bures--Wasserstein Riemannian metric. We also establish the sharp comparison $$ s(1-s)d_{\\rm BW}(A,B)^2 \\le \\altPhi_f(A,B) \\le (1-s+s^2)d_{\\rm BW}(A,B)^2. $$", "url": "https://arxiv.org/abs/2609.00034", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Trung Dung Vuong"}, {"name": "Hiroki Shudo"}, {"name": "Hiroyuki Osaka"}], "featured_authors": [{"name": "Trung Dung Vuong"}, {"name": "Hiroki Shudo"}, {"name": "Hiroyuki Osaka"}], "author_count": 3}, {"id": "2609.00040", "category": "math-ph", "title": "Fock-Space Formulation of the Boltzmann Collision Operator for Maxwell Molecules", "abstract": "We develop a representation-independent symmetric-Fock formulation of the nonlinear Boltzmann collision operator for Maxwell molecules. Starting from the standard velocity-space operator, we give a short derivation of Bobylev's Fourier identity and isolate its characteristic structure: two linearly related Fourier arguments followed by multiplication. We then prove, independently of collision geometry and of any coordinate realization, a canonical lift--fusion intertwining theorem: one-particle linear maps lift to the two incoming Fock legs and symmetric-algebra multiplication fuses them into a single outgoing state. Bargmann coordinates make this intrinsic construction especially transparent, but do not define it; Bobylev's collision maps subsequently select the Maxwell vertex from the already graded lift--fusion class. The resulting bilinear map obeys the exact grading \\[ \\widehat{\\mathcal Q}(\\mathscr H_p,\\mathscr H_q)\\subseteq\\mathscr H_{p+q}, \\] which gives an intrinsic origin for the triangular structures of Maxwell kinetics. Its one-vacuum restriction yields the complete Wang Chang--Uhlenbeck spectrum, while moment adaptation makes the nonequilibrium hierarchy strictly triangular and every finite compatible Fock jet an exact autonomous factor with global exponential relaxation. For the inhomogeneous problem, we extend realization covariance to the nonlinear two-leg vertex and evaluate the moving-frame connection independently through Hermite-function and Fourier realizations. The two routes give the same abstract Fock propagation and the same first Chapman--Enskog source; its traceless level-$2$ and vector level-$3$ sectors are relaxed by the exact Maxwell rates, giving $\\Pr=2/3$. This provides an explicit computational demonstration that coordinate realizations may be chosen for economy without entering the structural Fock formulation.", "url": "https://arxiv.org/abs/2609.00040", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ilya Karlin"}], "featured_authors": [{"name": "Ilya Karlin"}], "author_count": 1}, {"id": "2609.00255", "category": "math-ph", "title": "Szegő-type determinant asymptotics for generalized Hilbert matrices with edge eigenvalues", "abstract": "We compute the large-$N$ asymptotics of the determinant of the identity plus or minus a generalized Hilbert matrix. For $N \\in \\mathbb{N}$ and $\\delta \\in \\mathbb{R} \\setminus \\{-1, -2, \\ldots\\}$, let \\[ H_N^\\delta := \\left( \\frac{\\sin((1+\\delta)\\pi)}{\\pi(j+k+1+\\delta)} \\right)_{j,k=0}^{N-1} \\] be the generalized Hilbert matrix. For $\\delta$ not a half-integer, we prove the large-$N$ power-law asymptotics of the determinant \\[ \\log \\text{det}(I_N \\pm H_N^\\delta) = -\\frac{\\theta_\\delta^2 \\pm \\theta_\\delta}{2} \\log N + O(1) \\] where $\\theta_\\delta := \\delta$ if $\\delta < -1/2$, and $\\theta_\\delta := \\frac 1 \\pi \\arcsin(\\sin(\\delta\\pi))$ if $\\delta \\ge -1/2$ and $\\arcsin \\colon [-1,1] \\to [-\\frac{\\pi}{2}, \\frac{\\pi}{2}]$ denotes the principal branch of $\\arcsin$. For $\\delta \\geq -\\frac 12$ the asymptotics is known. The novelty of the present paper is the regime $\\delta < - \\frac 12$ and understanding the dichotomy in the decay exponent. This stems from the $\\pm 1$ edge eigenvalues of the limiting operator appearing for $\\delta < - \\frac 12$. Most notably, we obtain for $\\delta < -\\frac12$ \\[ \\log \\det\\bigl(I_N - (H_N^\\delta)^2\\bigr) = -\\delta^2 \\log N + O(1). \\] Such determinants arise in the study of Anderson's orthogonality catastrophe.", "url": "https://arxiv.org/abs/2609.00255", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Martin Gebert"}, {"name": "Heinrich Küttler"}], "featured_authors": [{"name": "Martin Gebert"}, {"name": "Heinrich Küttler"}], "author_count": 2}, {"id": "2609.00315", "category": "math-ph", "title": "Robin Laplacians with point interactions on unbounded domains: discrete spectrum and coupling asymptotics", "abstract": "We investigate the discrete spectrum of finitely many point interactions for Neumann and Robin Laplacians on special unbounded and exterior $C^{1,1}$ domains in dimensions two and three. The operators are realized as self-adjoint extensions through an ordinary boundary triple whose gamma field and Weyl matrix are constructed from the Robin Green kernel. Eigenvalues below the background spectrum are characterized by the Weyl matrix, yielding an exact finite-dimensional counting formula. If the background operator is non-negative, this also gives the number of negative eigenvalues without assuming a finite zero-energy limit of the Weyl matrix. In the one-centre case we identify the critical coupling and prove that the unique eigenvalue branch is real analytic, strictly increasing, and strictly concave. For scalar multicentre couplings $\\Theta=\\alpha I_N$, sufficiently strong attraction produces exactly $N$ eigenvalues below the background spectrum, and all of them have universal leading asymptotics coinciding with the whole-space laws. If the bottom of the background spectrum is an isolated eigenvalue, the branch exists for every finite coupling and we determine its leading decoupling asymptotics as the coupling tends to $+\\infty$. Explicit exterior-sphere and exterior-disk models illustrate the critical couplings and their threshold behaviour.", "url": "https://arxiv.org/abs/2609.00315", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Diego Noja"}, {"name": "Francesco Raso Stoia"}], "featured_authors": [{"name": "Diego Noja"}, {"name": "Francesco Raso Stoia"}], "author_count": 2}, {"id": "2609.00517", "category": "math-ph", "title": "Topological Recursion on Spectral Curves with Infinite Ramification Loci", "abstract": "Recently in the physics literature there have been a small, but growing, number of papers that have applied the Eynard-Orantin topological recursion procedure to spectral curves with ramification loci of infinite cardinality. However, there is a corresponding gap in the mathematics literature; indeed, it has not been checked rigorously whether the resulting infinite sums converge, or whether the resulting correlators have all the desired properties of the topological recursion. The present work aims to bridge this gap by defining topological recursion on a suitably broad class of spectral curves to cover the aforementioned physics applications and to rigorously prove that this definition has the properties one would intuitively expect. As a by-product, some interesting coincidences involving quantum curves are discovered, where two different spectral curves yield the same quantum curve, a situation that has, hitherto, not appeared in the literature.", "url": "https://arxiv.org/abs/2609.00517", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Quinten Weller"}], "featured_authors": [{"name": "Quinten Weller"}], "author_count": 1}, {"id": "2609.00750", "category": "math-ph", "title": "Two-photon quantum Rabi models - Spectral degeneracy and symmetries", "abstract": "The quantum Rabi model occupies a distinguished role in the study of quantum light and matter, describing the most fundamental interactions. Elucidation of its spectral properties, along with those of its generalizations, is necessary for quantum optics and applications in areas such as quantum information technologies. In this paper, we explore a precise description of energy degeneracy of the two-photon asymmetric quantum Rabi model and the nature of the system's symmetries; as a result, we demonstrate that these have significant relationships with the structure of certain algebraic curves (hyperelliptic curves) and number theory. Concretely, we first prove the existence of degenerate eigenvalues using the monodromy data of the Fuchsian ODE, which draws the eigenvalue problem of the system, and the existence of associated symmetry operators, previously discovered and studied heuristically in physics. Subsequently, we give a complete characterization of spectral degeneracies and present a series of conjectures showing that the degeneracy may determine the entire energy spectral structure. More precisely, for sufficiently strong interaction, we obtain an excellent approximation of the energy curves by the zero locus of a two-variable polynomial associated to degenerate eigenstates. In addition, we postulate an explicit description of the relation between the missing symmetry at the Hamiltonian level (hidden symmetry) and the degeneracy of the two-photon quantum Rabi model.", "url": "https://arxiv.org/abs/2609.00750", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Cid Reyes-Bustos"}, {"name": "Masato Wakayama"}], "featured_authors": [{"name": "Cid Reyes-Bustos"}, {"name": "Masato Wakayama"}], "author_count": 2}, {"id": "2609.00793", "category": "math-ph", "title": "Blow-Up, Asymptotics, and Improbability of Collision Singularities in the n-Body Problem", "abstract": "We study finite-time singularities in $n$-body systems with pair potentials that are homogeneous of degree $-\\alpha$, where $0<\\alpha<2$, that are not necessarily attractive and with bounded time-dependent external forces. We develop a systematic method to analyse a colliding subsystem in the presence of simultaneous collision or non-collision singularities elsewhere in the system. We extend classical results of von Zeipel and Painlevé to such subsystems, establish bounds on their internal energy near total collision, and implement a McGehee blow-up that remains effective without conservation of energy. The blow-up yields the asymptotics of the cluster size, and in the case of attractive potentials, the convergence towards the set of central configurations and asymptotics of relative position, relative velocities, and internal angular momentum. As an application of the asymptotic results, we construct a simplified proof that the initial conditions leading to collision form a set of measure zero.", "url": "https://arxiv.org/abs/2609.00793", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nathan Duignan"}, {"name": "Manuel Quaschner"}], "featured_authors": [{"name": "Nathan Duignan"}, {"name": "Manuel Quaschner"}], "author_count": 2}, {"id": "2609.00876", "category": "math-ph", "title": "A general improbability result for non-collision singularities as subsystems with at most four particles", "abstract": "Non-collision singularities of the $n$-body problem are initial conditions for which no global solution exists and which, however, do not lead to a collision in the limit; i.e., the moment of inertia of the system diverges. The question of whether the set of initial conditions leading to non-collision singularities in the $n$-body problem is improbable is open and is the first on Barry Simon's list of fifteen problems in mathematical physics from the year 1984. So far, this question has only been answered positively in the case $n=4$. Using a final cluster decomposition into subsystems whose particles interact strongly with each other and exert only small forces on particles from different subsystems, we can prove the improbability of the set of all singular orbits with the following conditions: -There may be arbitrarily many subsystems undergoing total collision at their center of mass. - There may be subsystems exhibiting a non-collision singularity, i.e. the respective moment of inertia of the subsystem diverges. These subsystems consist of exactly four particles each and the asymptotic directions of these subsystems have to differ (which is only a mild condition). This result includes all known statements and indicates a way how the general problem could be solved.", "url": "https://arxiv.org/abs/2609.00876", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Manuel Quaschner"}], "featured_authors": [{"name": "Manuel Quaschner"}], "author_count": 1}, {"id": "2609.01443", "category": "math-ph", "title": "$A_1$ - Coulomb branches over finite fields and Selberg Character sums", "abstract": "Motivated by mirror symmetry, we study exponential sums over the $\\mathbb{F}_q$-points of the $A_1$ Coulomb branch. We show that their fiberwise structure is governed by polynomial Gauss sums, providing a geometric realization of Selberg character sums studied by Evans. Using Evans's evaluation, we obtain explicit formulas for the Coulomb-branch exponential sums as products of classical Gauss sums.", "url": "https://arxiv.org/abs/2609.01443", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Junzhe Lyu"}, {"name": "Andrey Smirnov"}], "featured_authors": [{"name": "Junzhe Lyu"}, {"name": "Andrey Smirnov"}], "author_count": 2}, {"id": "2609.00056", "category": "quant-ph", "title": "Isospectral potentials with Dirac delta interaction: Constrained Spectra", "abstract": "We study quantum potentials containing Dirac delta function (DDF) within its supersymmetric (isospectral) construction via a discontinuous superpotential, instead of being simply an added part. This construction comprises of two independently solvable sectors joined at the singular point by matching conditions imposed by the corresponding self-adjoint extension. Needing careful regularization, these boundary conditions impose independent algebraic constraints on each of the eigenstates, that restrict and truncate the spectrum. The number of surviving bound states, which are required to be parity-even, is thus fixed by the available system parameters rather than by the usual quantization rule. The specific cases of the Harmonic oscillator and the Rosen-Morse potential isospectrally infused with the DDF demonstrate such highly restrictive spectra, while the similar combination of the DDF with a Calogero-type singularity turns out to be largely incompatible as the regularization breaks down. Therefore, localized singularities are capable of controlling and engineering the discrete spectrum of quantum systems, with possible use in myriads of physical systems with very localized interactions.", "url": "https://arxiv.org/abs/2609.00056", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kumar Abhinav"}, {"name": "Biswanath Rath"}, {"name": "Prasanta K. Panigrahi"}], "featured_authors": [{"name": "Kumar Abhinav"}, {"name": "Biswanath Rath"}, {"name": "Prasanta K. Panigrahi"}], "author_count": 3}, {"id": "2609.00168", "category": "quant-ph", "title": "Entangling capability of coherently controlled quantum processes", "abstract": "We analytically characterize entanglement generation by two paradigmatic coherently controlled quantum processes, the quantum switch and time-flip. Retaining rather than measuring or discarding the control, we treat the control and target as the bipartite system and assume pure product inputs, so that any output entanglement reflects the entangling capability of the process. For the switch of qubit unitaries, we derive exact expressions for entanglement, together with a geometric characterization and a coherence-entanglement conservation relation. We then extend our analysis to binary random unitary, Pauli, amplitude damping, and generalized amplitude damping channels. We prove that switch of channels commuting under composition cannot entangle a separable input. Yet maximal entanglement is possible even with dissipation, e.g., an entanglement-breaking damping channel switched with a bit-flip can transform a product input into a maximally entangled state. For two generalized amplitude damping channels, a common stationary state prevents entanglement, while different stationary populations can enable it. We present an analogous study for the time-flip of unitary and binary random unitary channels. Our findings provide a systematic analysis of how much entanglement can be generated by coherent control of channel order or input-output direction.", "url": "https://arxiv.org/abs/2609.00168", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Beyza Aslanbaş"}, {"name": "Bedirhan Alkan"}, {"name": "Göktuğ Karpat"}], "featured_authors": [{"name": "Beyza Aslanbaş"}, {"name": "Bedirhan Alkan"}, {"name": "Göktuğ Karpat"}], "author_count": 3}, {"id": "2609.00220", "category": "quant-ph", "title": "Quantum Secret Sharing with a Helper and Programmable Access Structures", "abstract": "Quantum secret sharing (QSS) is a process in which the state of a quantum system is partitioned into multiple shares, allowing only specific subsets of shareholders to reconstruct the state, while others gain no information about its identity. In this work, we propose a variant of QSS, called ``helper QSS,'' which designates a special shareholder whose participation with any other group of parties is sufficient for recovering the state. We present different families of helper codes that function for an arbitrary number of parties and system sizes. As an application, we introduce the idea of a programmable access structure in QSS, which allows for a third-party programmer to independently choose the access structure of the code even after the shares are delivered to all the shareholders. This choice is made blindly, meaning that the programmer has no information about the secret being encoded, and it is implemented using the nonlocal process of quantum steering.", "url": "https://arxiv.org/abs/2609.00220", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Eric Chitambar"}, {"name": "Sarah Hagen"}, {"name": "David W. Kribs"}, {"name": "Mike I. Nelson"}, {"name": "Andrew Nemec"}], "featured_authors": [{"name": "Eric Chitambar"}, {"name": "Sarah Hagen"}, {"name": "David W. Kribs"}, {"name": "Mike I. Nelson"}, {"name": "Andrew Nemec"}], "author_count": 5}, {"id": "2609.00234", "category": "quant-ph", "title": "Codes for Quantum Secret Sharing with a Helper", "abstract": "Helper quantum secret sharing is a form of secret sharing defined by its unique access structure. One special fixed party, called the helper, can work together with any other party to fully decode the secret. A blind helper is one who can provide this assistance while not holding any local information about the encoded secret. In this work, we analyze the general structure of QSS helper codes and present new code constructions. We fully characterize the structure of blind helper stabilizer codes and show that for the encoding of a single qubit, recovery is always possible using one-way local operations and classical communication (LOCC) from the helper to the targeted party. Furthermore, we demonstrate how such codes also allow for the helper to target larger subsets of parties by one-way LOCC, enabling them to be authorized to recover the secret. Finally, when each party only holds a qubit, we identify the general form of all helper codes (including non-stabilizer codes) and find that LOCC recovery is only possible in special cases.", "url": "https://arxiv.org/abs/2609.00234", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Eric Chitambar"}, {"name": "Sarah Hagen"}, {"name": "David W. Kribs"}, {"name": "Zhao Ma"}, {"name": "Mike I. Nelson"}, {"name": "Andrew Nemec"}], "featured_authors": [{"name": "Eric Chitambar"}, {"name": "Sarah Hagen"}, {"name": "David W. Kribs"}, {"name": "Zhao Ma"}, {"name": "Mike I. Nelson"}, {"name": "Andrew Nemec"}], "author_count": 6}, {"id": "2609.00235", "category": "quant-ph", "title": "Optimization Landscape Geometry in VQE for Frustrated Quantum Spin Models", "abstract": "We benchmark eight classical optimizers for exact-statevector VQE calculations on a controlled hierarchy of frustrated spin models, ranging from a diagonal Ising glass to transverse-field Ising and anisotropic Heisenberg models. The benchmark includes local, stochastic-gradient, evolutionary, covariance-adaptation, and swarm-based optimization methods under matched function-evaluation budgets. To understand their performance beyond final energies, we characterize the underlying Hamiltonian--ansatz landscapes in terms of local minima, gradients, curvature, and ground-state reachability. We use simple variational circuits, from an $R_y$ product-state ansatz for the diagonal model to shallow $R_y$--CNOT hardware-efficient circuits for the noncommuting models, and study how increasing circuit depth changes their expressivity, reachability, and optimization geometry. We find that optimizer performance changes substantially across the model hierarchy and is closely connected to landscape structure, while the variational gap represents a separate source of error. These results show how classical optimization, variational expressivity, and landscape geometry jointly determine VQE performance for frustrated spin models.", "url": "https://arxiv.org/abs/2609.00235", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vojtěch Novák"}, {"name": "Ivan Zelinka"}, {"name": "Swagatam Das"}, {"name": "Martin Beseda"}], "featured_authors": [{"name": "Vojtěch Novák"}, {"name": "Ivan Zelinka"}, {"name": "Swagatam Das"}, {"name": "Martin Beseda"}], "author_count": 4}, {"id": "2609.00321", "category": "quant-ph", "title": "Which Otto Engine Is the Fastest?", "abstract": "A general thermal machine is characterized by distinct time or energy scales: temperature, coupling to the heat baths, internal free dynamics and interactions, and external driving. We address the question: what parameters determine the speed of a given engine, and how can they be used to reliably compare different types of engine? Specifically, we consider four realizations of the Otto engine, each operating with the same Otto efficiency, and aim to characterize and compare their power outputs. The main insight of this paper is that, irrespective of their very different dynamical implementations, the power of each engine can be factorized into a common characteristic work and an implementation-specific characteristic time. The characteristic work depends only on the internal frequencies of the machine and the temperatures, whereas the characteristic time depends on the coupling strength to the baths and on the implementation-specific driving. This observation allows us to compare the power of different engines through their characteristic times and thereby reduce the relevant parameter space to parameters that capture the dynamical aspects of engine performance. Despite different dynamical implementations, this framework reveals simple common features. In all cases, the maximum operating speed is limited by a common timescale given by the sum of the characteristic thermalization times of the hot and cold baths. Moreover, the four engines fall into two distinct asymptotic classes: implementations in which driving and thermalization occur simultaneously exhibit quadratic scaling, whereas those in which work extraction and thermalization alternate exhibit linear scaling. These results expose general dynamical features that determine the operational speed of quantum Otto engines.", "url": "https://arxiv.org/abs/2609.00321", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Idriss Hank Nkouatchoua Ngueya"}, {"name": "Marcin Łobejko"}], "featured_authors": [{"name": "Idriss Hank Nkouatchoua Ngueya"}, {"name": "Marcin Łobejko"}], "author_count": 2}, {"id": "2609.00348", "category": "quant-ph", "title": "Spatial correlations of photons interacting via transverse Rydberg blockade", "abstract": "We develop a theory of the transverse spatial dynamics of two interacting photons in a Rydberg nonlinear medium. Extending the well-studied one-dimensional case, we explore both longitudinal and transverse correlations of photons propagating as Rydberg polaritons. We identify distinct behaviors and scaling laws for these correlations, arising from fundamentally different mechanisms in the two directions: diffraction for transverse correlations and diffusion for longitudinal correlations. We develop a model incorporating a Gaussian optical beam and an inhomogeneous atomic density distribution, from which we derive quantitative predictions for correlation functions in both directions. We further show that the propagation equations can be reduced to a single Schrödinger-like equation, allowing approximate solutions that are supported by full numerical results. Our findings indicate that the transverse correlation length is determined primarily by the blockade radius, whereas the longitudinal correlation length is limited by bandwidth. These results establish transverse Rydberg blockade as a distinct and measurable correlation mechanism and show that spatial photon correlations provide a direct means of measuring the blockade radius.", "url": "https://arxiv.org/abs/2609.00348", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bankim Chandra Das"}, {"name": "Daniil Svirskiy"}, {"name": "Matthias Metternich"}, {"name": "Wolfgang Alt"}, {"name": "Sebastian Hofferberth"}, {"name": "Ofer Firstenberg"}], "featured_authors": [{"name": "Bankim Chandra Das"}, {"name": "Daniil Svirskiy"}, {"name": "Matthias Metternich"}, {"name": "Wolfgang Alt"}, {"name": "Sebastian Hofferberth"}, {"name": "Ofer Firstenberg"}], "author_count": 6}, {"id": "2609.00475", "category": "quant-ph", "title": "Fractal dimension predicts quantum kernel collapse in angle-encoded data", "abstract": "Angle-encoded quantum kernels on tabular data collapse when the feature map is wider than the intrinsic dimension of the data. We propose the correlation fractal dimension D2 as an a priori qubit budget: encode D2 coordinates chosen by FD-ASE instead of the PCA-95% width or all E attributes. On nine data sets and a statevector simulator (n= 32), a one-layer ZZ fidelity kernel at q=D2 stays geometrically alive while the same kernel at the PCA-95% width has already collapsed. The budget is map-dependent: product-state and IQP maps overshoot it; a second ZZ layer undershoots it. Packed dense-angle and re-uploading encodings still live at the fractal q, but not when PCA-95% features are stacked onto those qubits. Shrinking the angle bandwidth moves the ZZ knee later; stretching it kills the kernel earlier. On IBM Quantum (ibm_fez, 256 shots, n=8) the one-layer ZZ kernel at the fractal width matches the exact kernel (MAE 0.021); past that width both hardware and simulator have collapsed. The ceiling is a property of the map-data pair at a stated bandwidth, not of the classical table alone.", "url": "https://arxiv.org/abs/2609.00475", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ana Paula Appel"}], "featured_authors": [{"name": "Ana Paula Appel"}], "author_count": 1}, {"id": "2609.00671", "category": "quant-ph", "title": "Parametric amplification of continuous-variable entangled state for loss-tolerant quantum distributed sensing", "abstract": "Quantum metrology exploits quantum states to achieve an estimation sensitivity beyond classical limits. In the continuous-variable (CV) regime, the squeezed state has been used to implement deterministic quantum sensing, but the quantum metrology sensitivity of this state is significantly affected by losses or detection inefficiencies, which restrict its applications. In this work, quantum distributed sensing is proposed using optical parametric amplified multimode entanglement generated from squeezed states. It is found that the sensitivity is robust to loss or detection inefficiency when large-gain optical parametric amplification (OPA) is introduced, where a two-mode Einstein--Podolsky--Rosen-entangled state and a four-mode cluster state are exploited for analysis. The quantum sensitivity is greatly improved compared to that without OPA in almost all loss scenarios. The quantum Fisher matrix is calculated for both states to obtain the optimal bound in comparison with our scheme, and it is found that even with a small or moderate OPA gain, quantum sensing can be improved compared with the traditional scheme. The states are also compared with corresponding single-mode squeezed states, finding the parameter ranges where entangled states perform better. This study provides a method for realizing large-scale quantum metrology in real-world applications despite losses or detection inefficiencies.", "url": "https://arxiv.org/abs/2609.00671", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sijin Li"}, {"name": "Wei Wang"}], "featured_authors": [{"name": "Sijin Li"}, {"name": "Wei Wang"}], "author_count": 2}, {"id": "2609.00694", "category": "quant-ph", "title": "The Fermionic Cohomology Problem on the Full Fock Space Is $\\mathrm{QMA}_1$-Complete", "abstract": "Fermionic cohomology characterizes the zero-energy states of the supersymmetric Hamiltonian associated with a fermionic differential. Previous work showed that the problem restricted to a particle-number sector specified with the input is $\\mathrm{QMA}_1$-hard and belongs to $\\mathrm{QMA}$. We study the global problem, in which no sector is specified and cohomology may occur anywhere in the full Fock space. This formulation directly matches the whole-space ground-state question: a specified-degree NO instance may still have zero-energy states in another sector, whereas the global NO promise excludes them across all sectors and their superpositions. We prove that this full-Fock problem is $\\mathrm{QMA}_1$-complete for differentials given as exact lists of local monomials, even when each monomial acts on at most $41$ modes. As a companion result, we prove $\\mathrm{QMA}_1$-completeness for the specified-degree problem with $30$-mode terms whose hard instances admit a one-dimensional block-chain realization.", "url": "https://arxiv.org/abs/2609.00694", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yibin Wang"}], "featured_authors": [{"name": "Yibin Wang"}], "author_count": 1}, {"id": "2609.00778", "category": "quant-ph", "title": "High-Rank Encoding Can Improve Approximate Quantum Error Correction", "abstract": "Conventional quantum-code constructions encode pure logical states as pure code states, but this restriction can sacrifice performance. We show that intrinsic encoding randomness can improve optimal entanglement fidelity. We bound the loss from imposing a rank-one encoder and prove it is at most quadratic near perfect recovery after joint optimization. The optimized advantage survives small noise perturbations. An explicit noise family requires higher-rank encoders arbitrarily close to perfect recovery, with every optimal encoder mapping pure inputs to mixed code states.", "url": "https://arxiv.org/abs/2609.00778", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bikun Li"}, {"name": "Liang Jiang"}], "featured_authors": [{"name": "Bikun Li"}, {"name": "Liang Jiang"}], "author_count": 2}, {"id": "2609.00848", "category": "quant-ph", "title": "Ontic and epistemic states in the theory of spacetime-local beables", "abstract": "Bell's theorem rules out developing a locally causal theory to describe quantum phenomena. Many take this to imply that any model of quantum entanglement must employ variables (called beables by Bell) which follow nonlocal rules, even though signaling is local. The alternative is to adopt an all-at-once (block universe) approach, with beables which may depend on both past and future inputs, even though signaling is causal. Within this lenient-causality approach (a.k.a. retrocausal), simple cases of entanglement have been successfully described by locally mediated stochastic toy models, i.e.,~toy models which are local in a sense which generalizes Bell's local causality. Developing a widely applicable reformulation of quantum mechanics along these lines is a grand challenge. This work presents a general framework for such models and theories, and identifies the corresponding ontic and epistemic states. The epistemic state is closely analogous to the quantum state, yielding an explanation for the collapse of the wavefunction. In the case of the models of the framework, it is clear what the information is about. The expression for the empirically verifiable predictions of the models in terms of the ontic and epistemic states displays remarkable parallels to the Born rule. A toy-model example is discussed.", "url": "https://arxiv.org/abs/2609.00848", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nathan Argaman"}], "featured_authors": [{"name": "Nathan Argaman"}], "author_count": 1}, {"id": "2609.00852", "category": "quant-ph", "title": "Structure-Aware Placement and Routing of Multi-Controlled Toffoli on Bivariate Bicycle Code Architectures", "abstract": "The multi-controlled Toffoli (MCT) gate is a fundamental primitive in quantum circuit design, with applications in quantum arithmetic, cryptanalysis, and algorithmic implementations. Being a high-level logical operation, the efficient decomposition of MCT gates into lower-level netlists has remained a major optimization challenge for decades. While emerging quantum error-correcting codes such as bivariate bicycle (BB) codes drastically reduce fault-tolerance overhead, realizing non-Clifford circuits on modular BB-code architectures introduces complex compilation bottlenecks governed by inter-module routing, factory density, and layout. Consequently, the mapping of MCT gates onto BB-code architectures remains relatively unexplored. In this paper, we overcome these challenges by mapping optimal-Toffoli-depth MCT decompositions (Dutta et al., PRA, 2025) onto BB-code-based fault-tolerant architectures via direct $\\lvert \\mathrm{CCZ} \\rangle$ state injection from an external magic state factory. We introduce a targeted placement strategy that exploits the binary-tree structure of MCT decompositions to co-locate interacting subtrees. This approach reduces inter-module instruction counts by up to $\\mathbf{16.02}\\%$ compared to a naive sequential first-fit placement. We also evaluate the impact of factory placement across different topologies, demonstrating that grid-based layouts yield up to a $\\mathbf{23.7}\\%$ reduction in inter-module instructions relative to linear architectures (Yoder et al., arXiv, 2025). Finally, we validate the practical viability of our compiled circuits by analyzing aggregate execution errors and logical failure probabilities using the bicycle-ISA error estimator bicycle_numerics provided by the Qiskit community, this https URL .", "url": "https://arxiv.org/abs/2609.00852", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anik Basu Bhaumik"}, {"name": "Suman Dutta"}, {"name": "Siyi Wang"}, {"name": "Anupam Chattopadhyay"}], "featured_authors": [{"name": "Anik Basu Bhaumik"}, {"name": "Suman Dutta"}, {"name": "Siyi Wang"}, {"name": "Anupam Chattopadhyay"}], "author_count": 4}, {"id": "2609.00939", "category": "quant-ph", "title": "Robust CZ gate against flux line memory", "abstract": "High-fidelity CZ gates are central to superconducting quantum processors, but implementations based on flux tuning are still sensitive to pulse distortion. Conventional predistortion, typically used for an isolated gate, can recover the desired flux at the chip but it fails if the flux line memory exists, causing the fidelity of repeated CZ gates to drop rapidly. To address this issue, we model the flux line distortion as the dynamics of a stateful classical actuator coupled to a quantum system. Using a first-order Dyson expansion, we derive the error generators induced by variations in the initial flux-line state. We then design a robust CZ gate by optimizing the flux pulse to suppress these generators and minimize the residual flux line state at the gate exit. A one-pole flux line model shows the expected first-order robustness plateau. For a more practical three-pole model, the optimized CZ pulse achieves $F_{\\mathrm{avg}}=99.998\\%$, suppresses all first-order error generators, and brings the residual flux line state close to zero. With no additional waiting time between gates, our robust pulse achieves $F_{\\mathrm{avg}}=99.97\\%$ for the complete ten-gate sequence and reduces the sequence infidelity by a factor of about $2.3\\times10^{3}$ relative to the baseline under the same predistortion protocol. These results show that explicitly accounting for flux line memory maintains high-fidelity CZ operation across repeated gate sequences and addresses a key limitation of conventional predistortion.", "url": "https://arxiv.org/abs/2609.00939", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yao Song"}, {"name": "Xiu-Hao Deng"}], "featured_authors": [{"name": "Yao Song"}, {"name": "Xiu-Hao Deng"}], "author_count": 2}, {"id": "2609.00977", "category": "quant-ph", "title": "Information geometry of non-equilibrium quantum states: Mixed metric structures on an extended information manifold", "abstract": "We discuss an information-geometric framework for characterizing quantum states in non-equilibrium dynamics. Using the transverse-field Ising chain model as a laboratory, we investigate the quantum Fisher information metric with particular emphasis on the mixed metric component $g_{ht}$ and related geometric observables, where $h$ is a controllable post-quench Hamiltonian parameter and $t$ is real time. The framework treats $h$ and $t$ as coordinates of an extended information manifold $(h,t)$. The geometric observables characterize the speed of evolution on the manifold and the alignment between the temporal and parameter-deformation directions. Correlations between these geometric quantities and two widely used measures of non-equilibrium dynamics, the entanglement entropy and the Loschmidt echo, are analyzed.", "url": "https://arxiv.org/abs/2609.00977", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kouji Kashiwa"}, {"name": "Hidefumi Matsuda"}], "featured_authors": [{"name": "Kouji Kashiwa"}, {"name": "Hidefumi Matsuda"}], "author_count": 2}, {"id": "2609.01008", "category": "quant-ph", "title": "Uniform Hiding of Haar Block Transpose Gram Matrices", "abstract": "Gaussian boson sampling with equally squeezed active inputs assigns collision free probabilities through a complex symmetric transpose Gram matrix formed from a rectangular block of a Haar interferometer. We prove a finite total variation comparison with the corresponding complex Gaussian transpose Gram law. The error bound is explicit, quadratic in the number of selected output modes, inversely proportional to the interferometer size, and uniform in the number of squeezed active inputs. The proof combines a centered circular orthogonal ensemble score analysis in the dense regime with a rectangular relative entropy bound. This result supplies a random matrix replacement component of Gaussian boson sampling hardness arguments.", "url": "https://arxiv.org/abs/2609.01008", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hongru Zhao"}], "featured_authors": [{"name": "Hongru Zhao"}], "author_count": 1}, {"id": "2609.01029", "category": "quant-ph", "title": "Tangent fermions can restore vacuum stability of discrete-time Dirac models", "abstract": "The Dirac quantum walk (a 1+1 dimensional space-time discretization of the Dirac equation) has a $2\\mu$ mass gap both at the center and at the corner of the quasi-energy-momentum Brillouin zone. Gupta and Short recently noted [Quantum 9, 1845 (2025)] that the Dirac vacuum can create a particle-hole pair at the zone corner with the release of an energy $2\\mu$ to the environment. They removed this vacuum instability at the expense of fermion doubling, the appearance of a second low-energy Dirac cone. Here we show that an alternative discretization scheme, with a tangent rather than a sine dispersion relation, offers stability while retaining a single Dirac cone. The key step is the Cayley transformation from the unit circle of Floquet eigenvalues $e^{-i\\varepsilon}$ to the real line of unbounded energies $E=2\\tan(\\varepsilon/2)$. We compute the Schwinger effect (particle-hole pair creation in a uniform electric field) for tangent fermions and show that the pair-production rate agrees with the continuum result for a single Dirac cone. The zone corner is exactly decoupled if the scalar potential is coupled through the Hermitian generator of the quantum map. If it is coupled as a split operator, in order to preserve exact gauge invariance on the lattice, the corner does contribute - with a weight that vanishes quadratically with the lattice constants, in contrast to the Dirac quantum walk where the zone-corner instability survives the continuum limit.", "url": "https://arxiv.org/abs/2609.01029", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "C.W.J. Beenakker"}], "featured_authors": [{"name": "C.W.J. Beenakker"}], "author_count": 1}, {"id": "2609.01066", "category": "quant-ph", "title": "Scattering and Tunneling in Real Quantum Mechanics", "abstract": "We establish the general form of the evolution equation and study scattering and tunneling in real quantum mechanics. We prove an analogue of Stone's theorem for a real Kahler space and derive the corresponding general evolution equation, whose evolution operator is both orthogonal and symplectic. We formulate scattering theory in terms of real wave operators and the associated S-matrix. For the class of potentials considered, we show that the differential scattering cross section is equivalent to that obtained in standard complex quantum mechanics. We also show that the tunneling probability in real quantum mechanics is identical to that in complex quantum mechanics.", "url": "https://arxiv.org/abs/2609.01066", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Firdevs Karakus"}, {"name": "Daniil Stepanenko"}, {"name": "Igor Volovich"}], "featured_authors": [{"name": "Firdevs Karakus"}, {"name": "Daniil Stepanenko"}, {"name": "Igor Volovich"}], "author_count": 3}, {"id": "2609.01157", "category": "quant-ph", "title": "A continuous-mode quantum-optical representation of finite strong-field laser pulses in free space", "abstract": "We formulate an energy-consistent quantum-optical representation of finite paraxial laser pulses in free space. The formulation is based on a continuous-mode description and provides a step toward a unified treatment of coherent and nonclassical strong-field drivers. Starting from plane-wave quantization, we construct a transverse vector-mode reduction in which the selected mode can reproduce an arbitrary normalized spatial--polarization profile. For a coherent pulse, the measured pulse energy and full laboratory analytic signal determine the frequency-dependent coherent-state displacement $(\\alpha(\\omega))$, without introducing a physical quantization volume. For nonclassical pulses, the same first-order field data and total energy do not uniquely specify the quantum state. Additional correlation information or model assumptions are required. We incorporate this information through normal and anomalous covariance kernels and discuss $g^{(2)}$-based diagnostics of squeezed pulses. We also derive a phase-sensitive convergence criterion for numerical frequency-bin discretizations. An exactly solvable continuum-mode free-electron application shows that the coherent displacement reproduces the semiclassical mean trajectory, whereas the field covariances determine the electron wave packet width. The framework offers a convenient, energy-consistent interface between measured free-space pulses and quantum-optical calculations.", "url": "https://arxiv.org/abs/2609.01157", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Szabolcs Hack"}, {"name": "Attila Czirják"}, {"name": "Péter Földi"}], "featured_authors": [{"name": "Szabolcs Hack"}, {"name": "Attila Czirják"}, {"name": "Péter Földi"}], "author_count": 3}, {"id": "2609.01204", "category": "quant-ph", "title": "Unbiased sampling from Boltzmann distributions with noisy energies", "abstract": "Sampling from the Boltzmann distribution is central to computational physics, yet hard when the energy is known only through a stochastic estimate, such as with machine-learned molecular potentials, in variational Monte Carlo, or on quantum computers, because a noisy energy biases the sampled distribution. The penalty method of Ceperley and Dewing corrects this but requires the noise variance and becomes intractable when it is large. We introduce the Poisson product estimator, an unbiased, non-negative estimator of the Boltzmann weight that only needs an upper bound on the energy estimator and remains efficient at high noise. Using it to optimize a variational quantum circuit gradient-free, we recover the $H_3^+$ ground-state energy in a minimal basis and, by sampling rather than following a single trajectory, also map the variational energy landscape.", "url": "https://arxiv.org/abs/2609.01204", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Iwo Sanderski"}, {"name": "Gian Gentinetta"}, {"name": "Giuseppe Carleo"}], "featured_authors": [{"name": "Iwo Sanderski"}, {"name": "Gian Gentinetta"}, {"name": "Giuseppe Carleo"}], "author_count": 3}, {"id": "2609.01241", "category": "quant-ph", "title": "Anticoncentration and entanglement in Gaussian boson sampling", "abstract": "Anticoncentration and entanglement are two properties used to study classical hardness or easiness of Gaussian boson sampling in varying regimes. In this paper, we consider three directions concerning anticoncentration and entanglement in Gaussian boson sampling: (1) We derive closed-form expressions for the second moment of hafnians of symmetric Gaussian products, and use this to precisely locate the anticoncentration transition as a function of the number of squeezed input modes. (2) We derive closed-form expressions for the Rényi-$\\alpha$ Page curves for Gaussian boson sampling. (3) We study unequal input squeezing parameters $(s_i)_i$, and prove estimates as well as monotonicity of the average-case Rényi-2 entropy Page curve in terms of the magnitudes $|s_i|$, which allow for extending equal squeezing results to unequal squeezing.", "url": "https://arxiv.org/abs/2609.01241", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Laura Shou"}, {"name": "Adam Ehrenberg"}, {"name": "Yu-Xin Wang"}, {"name": "Joseph T. Iosue"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Laura Shou"}, {"name": "Adam Ehrenberg"}, {"name": "Yu-Xin Wang"}, {"name": "Joseph T. Iosue"}, {"name": "Alexey V. Gorshkov"}], "author_count": 5}, {"id": "2609.01248", "category": "quant-ph", "title": "A Backend-Agnostic MWIS Kernel for Stochastic Unit Commitment with Neutral-Atom Hardware Validation", "abstract": "Quantum hardware is beginning to address structured combinatorial optimisation, but two steps still block practical use: mapping real operational models onto hardware-compatible instances, and converting noisy hardware output back into feasible decisions. Here we introduce a backend-agnostic computational interface that compiles the discrete decision layer of stochastic unit commitment into a move-based maximum-weight independent set (MWIS) problem, while retaining continuous dispatch and feasibility recovery in the classical computational layer. We validate the approach in a green hydro
