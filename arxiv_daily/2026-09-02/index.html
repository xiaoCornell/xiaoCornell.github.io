  <script>
    const papers = [{"id": "2609.00083", "category": "cond-mat", "title": "Fermi-Level Metal-d Character of Group-6 Bis-Hexahapto Bilayer Graphene", "abstract": "Superconductivity in graphite intercalation compounds requires occupancy of a carbon-derived interlayer band filled by charge from an electropositive intercalant. Bis-hexahapto (eta6-eta6) coordination binds transition metals covalently to two graphene sheets with little charge transfer -- the mechanism that defines this chemistry removes the donation on which intercalated-graphite superconductivity rests. We ask, for group-6 Cr, Mo and W in bilayer graphene, whether Fermi-level states retain the interstitial, carbon-p character of ionic references, with bulk CaC6 and same-cell C12Ca/C12Li controls. Electron-phonon coupling is not computed. At one metal per gallery (C12M), the ionic controls retain 68 and 45 per cent, respectively, of gallery spectral weight in atom-masked interstitial regions at EF; the group-6 systems retain 15, 22 and 23 per cent. The contrast is compositional: group-6 galleries carry more absolute interstitial weight than C12Li, but projected density of states within +/-0.15 eV of EF is carbon p dominated in the ionic references and metal d dominated (~73 per cent) in all three group-6 bilayers. Every system studied is metallic; they differ in what carries the Fermi surface. Geometrically, eta6-eta6 coordination requires AA stacking and reverses the intrinsic Bernal preference by 400-600 meV wherever metal is present. Ordered phases are metastable against bulk metal (+2.9-5.0 eV per atom) but bound against isolated atoms (-1.6-4.1 eV); instability ordering (Cr least, W most) matches Cr > Mo > W reactivity. C12Cr is metallic; tungsten alone carries 0.65 muB. Bis-hexahapto intercalation delivers strong interlayer bonding and a definite AA registry, but not the interlayer-band character associated with superconducting graphite intercalation compounds.", "url": "https://arxiv.org/abs/2609.00083", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mingguang Chen"}], "featured_authors": [{"name": "Mingguang Chen"}], "author_count": 1}, {"id": "2609.00124", "category": "cond-mat", "title": "Green-function Zeros Encode Competing Mott and Charge-ordering Scales", "abstract": "While correlated insulators are devoid of low-energy quasiparticle poles, their Green functions retain clean momentum structure through zeros. However, precisely what zeros imply is not clear. By studying the extended Hubbard model both analytically and numerically, we establish a new paradigm for strongly correlated matter: the dispersion of Green function zeros is determined by both microscopic spin-spin correlations and defect kinematics. In fact, we find that the dispersion changes discontinuously across the transition between the Mott and the checkerboard charge-density wave phases as is expected for a first-order transition. This physics is robust to the inclusion of further neighbor hopping which simply fine tunes the spin-correlation or charge-defect kinematics. We conclude that it is the {\\it dispersion} of the Green-function zeros that encode the physics of ordering resultant from the strong correlations.", "url": "https://arxiv.org/abs/2609.00124", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Peizhi Mai"}, {"name": "Philip W. Phillips"}], "featured_authors": [{"name": "Peizhi Mai"}, {"name": "Philip W. Phillips"}], "author_count": 2}, {"id": "2609.00139", "category": "cond-mat", "title": "Higher-Winding Fractionalization", "abstract": "Higher-winding skyrmion textures can generate emergent magnetic fields with multiple flux quanta per unit cell. This opens an intriguing route toward fractionalization, allowing fractionalized quantum anomalous Hall states to arise even at integer filling of the microscopic unit cell. We show that, in this setting, increasing lattice-scale inhomogeneity of the emergent magnetic field drives a Berezinskii--Kosterlitz--Thouless (BKT) transition between a fractionalized liquid and a crystalline dielectric state. This transition carries a topological signature: under flux insertion, the many-body polarization defines a quantized winding number that is nonzero in the fractionalized phase and vanishes in the dielectric crystal.", "url": "https://arxiv.org/abs/2609.00139", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kishore Iyer"}, {"name": "Christophe Mora"}, {"name": "Daniele Guerci"}], "featured_authors": [{"name": "Kishore Iyer"}, {"name": "Christophe Mora"}, {"name": "Daniele Guerci"}], "author_count": 3}, {"id": "2609.00141", "category": "cond-mat", "title": "Magnetic frustration and non-collinear textures in layered Gd magnets", "abstract": "Using scale-bridging simulations based on electronic structure theory and atomistic spin dynamics, we investigate the magnetic properties of skyrmionic GdRu$_2$Si$_2$ and GdRu$_2$Ge$_2$ layered rare-earth magnets and similar Gd-based compounds (GdAu$_2$Si$_2$, GdAu$_2$Ge$_2$, GdAg$_2$Si$_2$ and GdAg$_2$Ge$_2$). By studying the trends across this structural family, we confirm the importance of magnetic frustration and dipolar interactions for the stability of non-collinear and skyrmion phases. Furthermore, our calculations predict promising opportunities for chemical tuning of these magnets in terms of the balance between various exchange interactions and the character of the magnetic anisotropy. These changes lead to the formation of new types of skyrmions that are stable in a wide range of applied external magnetic field. In particular, we propose partial alkali-metal substitution of Gd in GdRu$_2$Si$_2$ leading to GdKRu$_4$Si$_4$, GdRbRu$_4$Si$_4$, GdCsRu$_4$Si$_4$ as well as GdYRu$_4$Si$_4$ compounds, and suggest that it is likely to result in an ordered layered structure, similarly to previously reported iron pnictides like CaKFe$_4$As$_4$.", "url": "https://arxiv.org/abs/2609.00141", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vladislav Borisov"}, {"name": "Rohit Pathak"}, {"name": "Sagar Sarkar"}, {"name": "Anna Delin"}, {"name": "Olle Eriksson"}], "featured_authors": [{"name": "Vladislav Borisov"}, {"name": "Rohit Pathak"}, {"name": "Sagar Sarkar"}, {"name": "Anna Delin"}, {"name": "Olle Eriksson"}], "author_count": 5}, {"id": "2609.00142", "category": "cond-mat", "title": "Subgap Bound States from Dynamical Impurities", "abstract": "We find that a single non-magnetic dynamical impurity (e.g., a low-frequency localized \"vibron\" mode) induces a subgap bound state in an s-wave superconductor. A closed-form solution for the bound state energy is found as a function of the vibron frequency in the elastic scattering limit, with the salient features of the bound state energies unaffected by inelastic scattering processes in the sub-THz regime. In addition to subgap features in the low-frequency local density of states, such impurities result in real space regions of reduced spectroscopic weight outside the gap peak.", "url": "https://arxiv.org/abs/2609.00142", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Joshuah T. Heath"}], "featured_authors": [{"name": "Joshuah T. Heath"}], "author_count": 1}, {"id": "2609.00144", "category": "cond-mat", "title": "Bayesian Tracking of a Diffusing Target in Two and Three Dimensions", "abstract": "We study Bayesian tracking of a diffusing target monitored by a noisy distributed sensor array. Building on an earlier mapping to KPZ growth with a moving defect (or an equivalent directed polymer pinning problem) we determine the phase structure, beyond the previously-studied one-dimensional case, for both Bayes-optimal and suboptimal inference. In $d=2$, theoretical analysis and numerical simulations both give a depinning transition between a successful tracking phase and a failure phase. Weak-coupling RG shows that Bayes-optimal tracking is always successful in $d=2$, but failure can arise from overconfident (suboptimal) inference. In $d=3$, tracking can succeed, or can fail in two distinct ways: the posterior probability distribution may delocalize (no detection), or may become sharply localized, but at the wrong position (a false detection). The two possibilities correspond to Edwards-Wilkinson or Kardar-Parisi-Zhang statistics for the log-posterior. The three phases meet at a Nishimori-like multicritical point on a Bayes-optimal line in a two-parameter phase diagram. (Model misspecification alone can drive depinning into either unpinned phase: underconfidence gives diffuse failure, while overconfidence gives localized-but-wrong failure.) We analyze the transitions between the various phases numerically and with renormalization group arguments. We show that some of these have unusual critical behavior, which the conventional $\\epsilon$ expansion fails to describe. Recent rigorous results for directed polymers indicate an alternative scenario. Many of our results, including a scaling relation for exponents at pinning transitions and results for RG flows, are relevant to other phase transitions that involve surface growth or directed polymers in 2+1D or 3+1D.", "url": "https://arxiv.org/abs/2609.00144", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ewan McCulloch"}, {"name": "Adam Nahum"}], "featured_authors": [{"name": "Ewan McCulloch"}, {"name": "Adam Nahum"}], "author_count": 2}, {"id": "2609.00145", "category": "cond-mat", "title": "Size-Dependent Growth Rates Amplify Infinitesimal Asymmetry in Nanocrystals", "abstract": "The kinetic Wulff construction predicts symmetric nonequilibrium shapes when crystallographically equivalent facets share a fixed growth rate. However, nanocrystals grow through finite facets whose nucleation barriers and ligand coverages depend on facet size. Here we develop a size-dependent kinetic construction and show that as a consequence infinitesimal seed asymmetries can be amplified into strongly asymmetric nanocrystal morphologies even when all symmetry-related facets obey the same microscopic growth law. Spatially heterogeneous nucleation rates and boundary limited growth generate facet growth velocities that depend on size, and deterministic shape evolution translates these local rates into global shape symmetry breaking. We illustrate the mechanism of persistent anisotropic growth on square and triangular lattices in two dimensions and on FCC seeds in three dimensions, where cuboctahedra can evolve toward rods or tetrahedra depending on which facet-area perturbations are amplified.", "url": "https://arxiv.org/abs/2609.00145", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sam Oaks-Leaf"}, {"name": "David T. Limmer"}], "featured_authors": [{"name": "Sam Oaks-Leaf"}, {"name": "David T. Limmer"}], "author_count": 2}, {"id": "2609.00159", "category": "cond-mat", "title": "Nonlinear Fluctuating Hydrodynamics from Interacting Noisy Quantum Matter", "abstract": "A universal characterization of non-equilibrium steady states in interacting quantum many-body systems remains one of the central challenges of statistical physics. Here, we address this problem for a paradigmatic model of diffusive interacting quantum matter---the boundary-driven XXZ spin chain with bulk dephasing---and derive, directly from its microscopic Lindblad dynamics, an emergent classical Macroscopic Fluctuation Theory (MFT) governing its large-scale fluctuations. Crucially, the resulting hydrodynamics carries a density-dependent diffusivity and mobility as the fingerprint of interactions. This effective description enables the exact computation of the stationary density profile, long-range correlations, and the full counting statistics of the current, in excellent agreement with tensor-network simulations. Our work demonstrates that noisy quantum many-body systems can realize the universality class of genuinely interacting diffusive matter, beyond the constant-diffusivity class of the symmetric simple exclusion process, and establishes MFT as a powerful universal framework for interacting diffusive quantum systems.", "url": "https://arxiv.org/abs/2609.00159", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexios Christopoulos"}, {"name": "João Costa"}, {"name": "Stefano Scopa"}, {"name": "Jacopo De Nardis"}, {"name": "Zala Lenarčič"}, {"name": "Denis Bernard"}, {"name": "Tony Jin"}], "featured_authors": [{"name": "Alexios Christopoulos"}, {"name": "João Costa"}, {"name": "Stefano Scopa"}, {"name": "Zala Lenarčič"}, {"name": "Denis Bernard"}, {"name": "Tony Jin"}], "author_count": 7}, {"id": "2609.00162", "category": "cond-mat", "title": "Duality between the level statistics of Hermitian and non-Hermitian random matrices", "abstract": "Random matrix theory describes complex quantum systems statistically, with symmetry as its organizing principle. We uncover an exact duality between the level statistics of Hermitian and non-Hermitian random matrices in the large-$N$ (matrix size) limit. It acts class by class: the two replica partition functions, given by fermionic nonlinear $\\sigma$ models, are related by analytic continuation. Applied to the three Wigner--Dyson classes, the duality yields the universal bulk eigenvalue pair-correlation functions of non-Hermitian random matrices. This establishes a non-Hermitian counterpart of Dyson's threefold way, organized by transposition symmetry: generic complex, complex symmetric, and complex self-dual matrices. The dissipative spectral form factors of these classes follow in closed form as well. Applied to the seven nonstandard Altland--Zirnbauer classes, the duality yields the exact spectral densities near the origin, the non-Hermitian hard-edge statistics. Most of these statistics were previously known only numerically. Exact diagonalization confirms the analytical predictions, and physical models demonstrate their universality. We expect these results to be the tip of a deeper correspondence between Hermitian and non-Hermitian random matrix theory.", "url": "https://arxiv.org/abs/2609.00162", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ze Chen"}, {"name": "Zhenyu Xiao"}, {"name": "Yifei Liu"}, {"name": "Shinsei Ryu"}], "featured_authors": [{"name": "Ze Chen"}, {"name": "Zhenyu Xiao"}, {"name": "Yifei Liu"}, {"name": "Shinsei Ryu"}], "author_count": 4}, {"id": "2609.00164", "category": "cond-mat", "title": "Exact joint eigenvalue densities of non-Hermitian random matrices are Calogero scattering states", "abstract": "Determining exact joint eigenvalue densities is central to random matrix theory. We solve this long-standing problem for non-Hermitian matrices with transposition symmetry (complex symmetric and complex self-dual) at arbitrary matrix size. Up to a Vandermonde factor, they are scattering-state wave functions of the Calogero model, a line of particles interacting through an inverse-square potential, with the coupling strength set by the symmetry. In contrast to many previously known joint densities, the densities cannot be written as a gas of eigenvalues with pairwise interactions. We further compute the complex level spacing distributions and two-point spectral correlation functions, which carry power-law tails, absent in a Coulomb gas. Our results shed light on the interplay among random matrices, integrability, and symmetry.", "url": "https://arxiv.org/abs/2609.00164", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhenyu Xiao"}, {"name": "Ze Chen"}, {"name": "Yifei Liu"}, {"name": "Shinsei Ryu"}], "featured_authors": [{"name": "Zhenyu Xiao"}, {"name": "Ze Chen"}, {"name": "Yifei Liu"}, {"name": "Shinsei Ryu"}], "author_count": 4}, {"id": "2609.00338", "category": "cond-mat", "title": "Impurity-dependent quantum geometry in 2D flat band superconductors", "abstract": "In flat band superconductors, quantum geometry, rather than kinetic energy, governs pairing and transport. However, how this geometry manifests in the response to a local, individually addressable impurity remains largely unexplored. Here, we study the Yu-Shiba-Rusinov (YSR) bound state induced by a magnetic adatom that hybridizes with every orbital of a two-dimensional flat band superconductor, and characterize its spatial profile using two quantities: the quadratic spread $Q_S$ and the localization length $\\xi$. We show that $Q_S$ is not set by the quantum metric alone, as geometric corrections arising from inter-orbital interference and, more importantly, from the anisotropy of the adatom-lattice hybridization contribute on equal footing, making $Q_S$ strongly impurity dependent and tunable. On the other hand, $\\xi$ emerges from the projection onto the flat band alone and is a universal property set by the overlap of compact localized states. All impurity dependence is instead isolated in the prefactor of the wavefunction whose magnitude correlates directly with $Q_S$. We, therefore, report a clean separation between universal and impurity-tunable physics from the induced YSR bound state in these systems, and confirm our results numerically via exact diagonalization.", "url": "https://arxiv.org/abs/2609.00338", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Simão S. Cardoso"}, {"name": "A. Mesaros"}, {"name": "P. Simon"}], "featured_authors": [{"name": "Simão S. Cardoso"}, {"name": "A. Mesaros"}, {"name": "P. Simon"}], "author_count": 3}, {"id": "2609.00368", "category": "cond-mat", "title": "Chiral phonons driven by chiral cavities", "abstract": "Lattice vibrations carrying angular momentum give rise to fundamental phenomena such as the phonon Hall effect and the Einstein-de Haas effect, offering new opportunities for manipulating angular momentum in condensed-matter systems. Generating such circularly polarized phonons requires either the use of an external magnetic field, or of polarized light pulses. The latter approach does not require the use of any magnetic response of the material, but it has limitations, in particular regarding the duration of the pulse. Consequently, any effect stemming from phonons generated by light pulses is transient. In this paper, we propose the use of a driven electromagnetic cavity as a route to generate a steady-state population of chiral phonons. We derive a general description of cavity-chiral phonon interaction, with a particular focus on modes of chiral cavities. We show that, under optimized conditions, a significant effective phonon-induced magnetic field can be generated by means of an external drive with realistic power. Our approach is specially tailored for Gamma point phonons with THz frequencies, and opens a new route for investigating chiral phonons with electromagnetic cavities.", "url": "https://arxiv.org/abs/2609.00368", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "V. A. S. V. Bittencourt"}, {"name": "N. Shabala"}, {"name": "R. M. Geilhufe"}, {"name": "A. Metelmann"}], "featured_authors": [{"name": "V. A. S. V. Bittencourt"}, {"name": "N. Shabala"}, {"name": "R. M. Geilhufe"}, {"name": "A. Metelmann"}], "author_count": 4}, {"id": "2609.00433", "category": "cond-mat", "title": "Bound states, resonances, and their thermodynamic properties in pseudospin-1 systems with short-range impurities", "abstract": "Bound states and resonances induced by short-range impurities modeled by circular potential wells are analyzed in the vicinity of flat and dispersive bands in gapped and gapless pseudospin-1 systems. We find that the bound and resonant states derived from the flat band show unusual characteristics originating from the multicomponent structure of pseudospin-1 fermions, which are distinct from those for pseudospin-$\\tfrac{1}{2}$ fermions. Contrary to gapped Dirac systems and unlike bound states in the vicinity of the upper dispersive band, the bound states derived from the flat band occur for any value of the total angular momentum. The energies of these bound states with higher angular momentum $j$ tend to decrease with $|j|$. In addition, it is found that their wave functions are localized at the potential well edge and the localization increases with $|j|$. The signatures of the impurity states in the local density of states are determined. Using the Anderson model for independent electrons in the disorder potential, the thermodynamic potential, entropy density, and heat capacity are obtained. In the regime dominated by bound states derived from the flat band, the entropy density monotonically increases with temperature and saturates, whereas the heat capacity exhibits a single maximum.", "url": "https://arxiv.org/abs/2609.00433", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "E. V. Gorbar"}, {"name": "Pavlo Sukhachov"}], "featured_authors": [{"name": "E. V. Gorbar"}, {"name": "Pavlo Sukhachov"}], "author_count": 2}, {"id": "2609.00545", "category": "cond-mat", "title": "Parafermions in plain sight", "abstract": "We show that for any potential with a discrete energy spectrum, the well-known interpolation between ideal boson and fermion partition functions at discrete values of $\\xi=-1/m$ yielded zero temperature ground state energies corresponding to $m$ fermions occupying a single quantum state. The grand canonical partition function in this case can be a result from genuine parastatistics.", "url": "https://arxiv.org/abs/2609.00545", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Siu A. Chin"}, {"name": "A. Chaudhary"}], "featured_authors": [{"name": "Siu A. Chin"}, {"name": "A. Chaudhary"}], "author_count": 2}, {"id": "2609.00594", "category": "cond-mat", "title": "GW and Bethe-Salpeter Theory for Molecular Polaritons, Quasiparticles, and Excitons", "abstract": "The electron self-energy is central to quasiparticle theory, yet how an optical cavity enters it remains unclear. We address this question for a molecule in a single-mode cavity using the dipole-gauge Pauli-Fierz Hamiltonian and a coherent-state QED Hartree-Fock reference. The cavity enters through three channels: the static dipole self-energy (DSE) shift of reference orbital energies, direct DSE augmentation of the screened interaction, and the polariton pole carrying the bilinear electron-photon coupling. We benchmark QED-$GW$ ionization potentials (IPs) and electron affinities (EAs) against a cavity $\\Delta$-method ladder from QED-HF to correlated wave-function methods, whose cavity-induced shifts agree within 1 meV where directly comparable. For closed-shell molecules with unbound anions, $GW$ systematically overestimates cavity-induced IP redshifts, whereas EA shifts are reproduced nearly quantitatively, although this does not imply comparable accuracy for absolute EAs. For ionic molecules with bound anions, this ordering reverses, consistent with published QED coupled-cluster results. Coupling and detuning scans show that the error is predominantly quadratic in $\\lambda$ and DSE-driven rather than resonant. The spectral function develops a polariton-replica photoemission sideband with weight scaling as $\\lambda^2$. In the static screened interaction used in the Bethe-Salpeter equation, bare-photon exchange cancels the matching DSE contribution to the direct interaction, while exchange and polariton-screening corrections remain. Their net effect on the lowest excitation is appreciable only for ammonia in the molecules studied. Exciton-binding energies involving unbound anions are strongly basis-dependent and should therefore be viewed as diagnostics of electron-hole interactions rather than basis-converged molecular quantities.", "url": "https://arxiv.org/abs/2609.00594", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Soohaeng Yoo Willow"}, {"name": "Gi Beom Sim"}, {"name": "Tae Hyeon Park"}, {"name": "Tae In Kim"}, {"name": "D. ChangMo Yang"}, {"name": "Mikuláš Matoušek"}, {"name": "Jiří Brabec"}, {"name": "Libor Veis"}, {"name": "Chang Woo Myung"}], "featured_authors": [{"name": "Soohaeng Yoo Willow"}, {"name": "Gi Beom Sim"}, {"name": "Tae Hyeon Park"}, {"name": "Jiří Brabec"}, {"name": "Libor Veis"}, {"name": "Chang Woo Myung"}], "author_count": 9}, {"id": "2609.00631", "category": "cond-mat", "title": "Floquet scattering and Fano resonances in nodal-ring and multi-Weyl semimetals: Role of propagating and evanescent modes", "abstract": "We develop a comprehensive Floquet scattering theory for quantum transport in periodically driven nodal-ring semimetals (NRSs) and multi-Weyl semimetals (mWSMs), extending our earlier study reported in Annalen der Physik 535, 2200460 (2023), in which evanescent modes were neglected, to a complete formalism that includes both propagating and evanescent channels. By solving the full boundary-value problem, we obtain the complete set of scattering states and show that, although evanescent modes are indispensable for satisfying the matching conditions at the potential interfaces, they carry zero net probability current and do not contribute to any observable transport quantity. We identify a previously unexplored transport regime in NRSs in which two propagating channels coexist and participate in coherent scattering, producing multi-channel quantum interference and Floquet-induced Fano resonances. The transmission, reflection, pumped shot noise, and the associated Fano resonance features are determined entirely by the propagating channels, and the resonance energies coincide with those of the corresponding quasi-bound states of the static potential well. Our results establish a unified framework for Floquet transport in anisotropic topological semimetals, and confirm that the approximation of neglecting evanescent modes in our earlier work is justified for all measurable transport properties.", "url": "https://arxiv.org/abs/2609.00631", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sandip Bera"}, {"name": "Ipsita Mandal"}], "featured_authors": [{"name": "Sandip Bera"}, {"name": "Ipsita Mandal"}], "author_count": 2}, {"id": "2609.00639", "category": "cond-mat", "title": "Strengthened second law for periodic processes", "abstract": "Many physical systems evolve under periodic driving: the same control protocol is applied again and again, even though the state of the system itself need not return to where it started after each cycle. We derive a physics-independent lower bound on the entropy production of \\emph{any} periodic process modeled by the evolution of an initial distribution $p_0$ by a repeated application of the same map $G$. This is a strict strengthening of the second law of thermodynamics for periodic processes. It does not require that the single-period dynamics arise from a CTMC, satisfy (local) detailed balance, or be subject to other typical restrictions. We discuss its application to spins in the Curie-Weiss model and Deterministic Finite Automata, with possible extensions to other uniform computers.", "url": "https://arxiv.org/abs/2609.00639", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jake Schaefer"}, {"name": "Ben Ansbacher"}, {"name": "Jan Korbel"}, {"name": "David H. Wolpert"}], "featured_authors": [{"name": "Jake Schaefer"}, {"name": "Ben Ansbacher"}, {"name": "Jan Korbel"}, {"name": "David H. Wolpert"}], "author_count": 4}, {"id": "2609.00697", "category": "cond-mat", "title": "Correlation-Driven Nonlinear Magnetoelectric Response in an Altermagnet: A Dynamical Mean-Field Study", "abstract": "We investigate the optical nonlinear magnetoelectric effect (NMEE) in a strongly correlated altermagnet using dynamical mean-field theory. Unlike effective band descriptions with an imposed spin splitting, our approach determines the altermagnetic order, electronic spectrum, and optical nonlinear response self-consistently. We find that the NMEE is finite in the altermagnetic phase and vanishes in the paramagnetic phase. Its frequency dependence reflects the spin-resolved spectral structure and provides an estimate of the characteristic altermagnetic spin-splitting scale. Interaction and temperature tuning produce qualitatively different behavior: at low temperature, reducing the interaction strength toward the interaction-driven magnetic phase boundary enhances the response, whereas increasing the temperature suppresses it and drives it to zero above the critical temperature. These results establish the optical NMEE as a probe of correlated altermagnetic order and suggest that tuning parameters such as pressure, strain, or chemical substitution toward an interaction-driven phase boundary may provide a promising route to maximizing the response.", "url": "https://arxiv.org/abs/2609.00697", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Robert Peters"}, {"name": "Jun Ōiké"}], "featured_authors": [{"name": "Robert Peters"}, {"name": "Jun Ōiké"}], "author_count": 2}, {"id": "2609.00721", "category": "cond-mat", "title": "BKT-like Correlation Scaling and Twist Responses in a One-Dimensional Fractional $U(1)$ Ginzburg--Landau Model", "abstract": "We study a one-dimensional fractional $U(1)$ Ginzburg--Landau model whose quadratic part has Fourier multiplier $|k|^\\sigma$, focusing on the marginal case $\\sigma=1$. This dispersion yields logarithmic spin-wave fluctuations, suggesting BKT-like behavior despite the one-dimensional setting. We sample the equilibrium Gibbs measure using stochastic Gross--Pitaevskii dynamics and analyze correlation functions, dimensionless ratios, effective exponents, and twist responses. The correlation function shows a low-temperature algebraic branch with a temperature-dependent exponent, while the high-temperature regime exhibits a nonlocal-kernel-induced tail consistent with $C(r)\\sim r^{-2}$. The correlation and Binder ratios are nearly size independent at low temperature and collapse with the BKT-type variable $(T-T_{\\rm BKT})(\\log L)^2$; finite-size effects set in around $T\\simeq0.35\\text{--}0.4$, consistent with $T_{\\rm BKT}\\simeq0.35$. Unlike the two-dimensional XY model, twist responses do not yield a finite helicity modulus: the ordinary linear-response quantity grows with system size, whereas the cusp twist response scales as $L^{-\\eta(T)}$, like the squared zero-mode order parameter. Thus, the transition is BKT-like in correlation scaling, but lacks a universal helicity-modulus jump.", "url": "https://arxiv.org/abs/2609.00721", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hitomi Endo"}, {"name": "Michikazu Kobayashi"}], "featured_authors": [{"name": "Hitomi Endo"}, {"name": "Michikazu Kobayashi"}], "author_count": 2}, {"id": "2609.00780", "category": "cond-mat", "title": "Anti-higher-order topological insulators", "abstract": "Duality is a fundamental concept in physics that connects complementary opposites like particles and holes. Similarly, while topological states in topological insulators localize at boundaries, the existence and nature of their dual counterparts remain unexplored. Here, we introduce anti-topological states as the dual of topological states, exemplified by anti-higher-order topological insulators. Unlike higher-order topological insulators, where states localize at corners, anti-higher-order topological insulators host states along edges but absent at corners, realizing an inverted distribution of states. We demonstrate this phenomenon in a bilayer Chern insulator with opposite Chern numbers, where the band inversion surfaces enclose distinct high-symmetry points. The topological invariant distinguishing these phases is given by the topological charges enclosed by band inversion surfaces. This work establishes anti-topology as a new paradigm, opening a chapter in topological research.", "url": "https://arxiv.org/abs/2609.00780", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Cheng-Ming Miao"}, {"name": "Yu-Hao Wan"}, {"name": "Ying-Tao Zhang"}, {"name": "Qing-Feng Sun"}], "featured_authors": [{"name": "Cheng-Ming Miao"}, {"name": "Yu-Hao Wan"}, {"name": "Ying-Tao Zhang"}, {"name": "Qing-Feng Sun"}], "author_count": 4}, {"id": "2609.00784", "category": "cond-mat", "title": "Anti-higher-order Weyl semimetal", "abstract": "Higher-order topology extends the bulk-boundary correspondence by enabling corner or hinge localized states. Here we identify an anti-higher-order Weyl semimetal, a three dimensional topological phase in which the conventional boundary hierarchy is reversed. Unlike conventional higher-order Weyl semimetals where bulk topology enforces hinge Fermi arcs, this phase hosts anti-hinge states, meaning the bulk topology forces states to vanish at specific hinge orientations. Using a minimal two-band model, we show how Weyl points separate the Brillouin zone into quantum anomalous Hall and anti-higher-order topological insulating regions, with the latter characterized by a band-inversion surface enclosing two distinct high-symmetry points carrying opposite topological charges. Analytical solutions for Weyl points, Berry curvature monopoles, and slice Chern numbers are derived, with numerical simulations confirming the resulting anti-hinge behavior. Our work establishes anti-higher-order topology as a dual counterpart to conventional higher-order phenomena, further extending the exploration of topological phases.", "url": "https://arxiv.org/abs/2609.00784", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Cheng-Ming Miao"}, {"name": "Yu-Hao Wan"}, {"name": "Qing-Feng Sun"}], "featured_authors": [{"name": "Cheng-Ming Miao"}, {"name": "Yu-Hao Wan"}, {"name": "Qing-Feng Sun"}], "author_count": 3}, {"id": "2609.00900", "category": "cond-mat", "title": "Fourier Neural Operators for Composition-Driven Crystal Structure Discovery", "abstract": "Crystalline materials discovery is essential for energy, electronics, and catalysis, but the vast chemical and structural space makes exhaustive screening infeasible. Existing voxel-based methods are limited by the local receptive fields of three-dimensional convolutional neural networks and the posterior collapse of high-dimensional variational autoencoders. Here, we develop a Fourier Neural Operator (FNO)-based crystal-field solver that maps a prescribed chemical formula and lattice parameters to periodic number-density and electron-density fields. By operating on global Fourier modes, the solver captures long-range correlations in periodic crystal fields beyond conventional local convolutions. Building on this solver, we construct a coupled generation-solving framework in which a conditional variational autoencoder generates diverse candidate lattice parameters in a low-dimensional basis-coefficient space, followed by density-field prediction and atomic reconstruction through peak detection, position optimization, and weight optimization. The reconstructed structures are further screened using voxel-level filtering, machine-learning interatomic-potential relaxation, and first-principle calculations. The framework generates novel structures across 104 chemical formulas with competitive reconstruction accuracy, demonstrating high generative diversity and structural validity. By extending Fourier neural operators to periodic crystal fields and coupling them with composition-conditioned lattice generation, our approach provides a scalable route to crystal structure discovery from prescribed chemical compositions.", "url": "https://arxiv.org/abs/2609.00900", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhijie Yu"}, {"name": "Jingyu Li"}, {"name": "Yang Huang"}, {"name": "Jingrun Chen"}], "featured_authors": [{"name": "Zhijie Yu"}, {"name": "Jingyu Li"}, {"name": "Yang Huang"}, {"name": "Jingrun Chen"}], "author_count": 4}, {"id": "2609.00915", "category": "cond-mat", "title": "Element priors and target support shape chemical transfer in materials graph networks", "abstract": "Materials graph neural networks must often transfer to chemical regions weakly represented in training data. Such transfer can rely on predefined relations among elements or supervised evidence from target-containing structures, but these pathways are usually entangled. Here, held-out-element splits and incremental target support separate their roles. Without target-containing training structures, formation-energy errors depend strongly on the element representation, particularly for H, O and F. Matched perturbations show that representation-induced sharing matters beyond input dimension or numerical form, while a label-free similarity-graph prior reduces selected zero-shot errors. Adding a few target-containing structures sharply lowers errors and contracts differences among one-hot, k-hot and continuous inputs across ALIGNN and CGCNN. Calibration explains only part of this recovery, and freezing the initial element projection preserves most gains in five of six ALIGNN splits. Target support therefore shifts chemical transfer from reliance on static element relations toward learning from target-containing environments.", "url": "https://arxiv.org/abs/2609.00915", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ran Zhao"}, {"name": "Kangming Li"}], "featured_authors": [{"name": "Ran Zhao"}, {"name": "Kangming Li"}], "author_count": 2}, {"id": "2609.00931", "category": "cond-mat", "title": "Beyond Panchromatic Absorption: Deciphering the Excited-State Maze from Light Absorption to Photocatalysis in Dye-Sensitized MOFs", "abstract": "Metal--organic frameworks (MOFs) are promising photocatalysts whose visible-light absorption can be extended through linker functionalization; however, a red-shifted absorption edge does not guarantee enhanced efficiency. Here, we establish a multi-spectroscopic framework to decipher the photophysical fate of photoexcited states in diazo-sensitized UiO-66 using 2D photoluminescence (PL/PLE) mapping and wavelength-resolved continuous-wave X-band photo-EPR. By correlating visible absorption with photo-EPR and PLE action spectra, we distinguish a \\textit{productive red shift} from a \\textit{non-productive emissive red shift}. In highly active UiO-66-Anisole (97\\% activity relative to \\ch{TiO2}), photo-EPR tracks the new absorption band, confirming that excitation populates a charge-transfer pathway yielding persistent, spin-separated states. Conversely, poorly active UiO-66-$\\beta$-naphthol (4\\%) exhibits an extended visible absorption tracked by PLE but not photo-EPR. This reflects excitation trapping in a localized state caused by an \\textit{ortho}-$\\mathrm{OH}$ group forming a rigid intramolecular hydrogen bond, which locks the keto-hydrazone tautomer and disrupts the conjugated azo bridge. A new optical overlap descriptor ($S_{\\mathrm{Exc}}$) quantitatively captures this trade-off across the series. We demonstrate that photosensitizer design must suppress rigid tautomeric traps and target specific charge-transfer manifolds ($\\lambda \\le 500$~nm) rather than merely maximizing apparent panchromatic absorption breadth.", "url": "https://arxiv.org/abs/2609.00931", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Manuela L. Kim"}, {"name": "Mauricio E. Calvo"}, {"name": "Katsuya Teshima"}, {"name": "Fabio La Mattina"}, {"name": "Eugenio H. Otal"}], "featured_authors": [{"name": "Manuela L. Kim"}, {"name": "Mauricio E. Calvo"}, {"name": "Katsuya Teshima"}, {"name": "Fabio La Mattina"}, {"name": "Eugenio H. Otal"}], "author_count": 5}, {"id": "2609.00953", "category": "cond-mat", "title": "Weisfeiler-Lehman subtree encoding for Bayesian optimization of atomic configurations", "abstract": "The efficiency of Bayesian optimization (BO) of atomic configurations depends strongly on how configurations are encoded. We introduce the Weisfeiler-Lehman (WL) subtree kernel, which views configurations as element-labeled graphs and measures their similarity by how many local structural patterns they share, into Bayesian-optimization-based configuration search. Because this kernel is reproduced as the plain inner product of explicit features (L$^2$-normalized histograms of local topological patterns), introducing it reduces to introducing the corresponding features: the encoding enters existing BO frameworks as an ordinary descriptor. In a benchmark ground-state configuration search of cubic BC$_2$N evaluated with a universal machine-learning interatomic potential, the WL encoding reached the ground state almost immediately after a shared random initialization of 100 samples in every one of five independent rounds (108$\\pm$5 evaluations on average), whereas the one-hot baseline required 280$\\pm$122 evaluations; the WL-driven sampler first exhausted the degenerate ground-state group and then discovered the metastable degenerate groups from the bottom up, in order of increasing energy.", "url": "https://arxiv.org/abs/2609.00953", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Akira Kusaba"}, {"name": "Tatoshi Yonemori"}, {"name": "Tetsuji Kuboyama"}, {"name": "Yoshihiro Kangawa"}], "featured_authors": [{"name": "Akira Kusaba"}, {"name": "Tatoshi Yonemori"}, {"name": "Tetsuji Kuboyama"}, {"name": "Yoshihiro Kangawa"}], "author_count": 4}, {"id": "2609.00971", "category": "cond-mat", "title": "Kibble--Zurek Mechanism and Defect Freezing in Imbalanced-Pairing Kitaev Models", "abstract": "We investigate driven dynamics across critical and exceptional points in the one- and two-dimensional imbalanced-pairing Kitaev models using both the wave-function normalization approach and the biorthogonal framework. For a positive pairing imbalance parameter, the quasiparticle spectrum remains real, and a pairing imbalance neither shifts the equilibrium phase boundaries nor generates imaginary eigenenergies. In this regime, the defect density follows the conventional Kibble--Zurek scaling in one dimension and the extended Kibble--Zurek scaling, arising from a gapless manifold, in two dimensions within both frameworks. The corresponding scaling exponents are therefore governed by those of the Hermitian transition. For a negative pairing imbalance parameter, time-reversal symmetry is broken, the quasiparticle spectrum develops complex eigenvalues, and the gap closes at exceptional points. For ramps ending at an exceptional point, the defect density follows the modified Kibble--Zurek scaling in the wave-function normalization approach, whereas it obeys the conventional Kibble--Zurek scaling in the biorthogonal framework. When the ramp traverses the time-reversal-symmetry-broken region, a finite density of defects remains even in the adiabatic limit, leading to defect freezing in both frameworks. Although this frozen background indicates a breakdown of adiabaticity, the excess defects generated on top of this background continue to obey the conventional Kibble--Zurek scaling in one dimension and the extended Kibble--Zurek scaling in two dimensions.", "url": "https://arxiv.org/abs/2609.00971", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "R. Jafari"}, {"name": "Alireza Akbari"}, {"name": "Shukhrat Mardonov"}, {"name": "A. Langari"}], "featured_authors": [{"name": "R. Jafari"}, {"name": "Alireza Akbari"}, {"name": "Shukhrat Mardonov"}, {"name": "A. Langari"}], "author_count": 4}, {"id": "2609.00975", "category": "cond-mat", "title": "Topological charges and parity selection at Floquet quasienergy degeneracies", "abstract": "The quasienergy spectrum of a strongly driven two-level system as a function of the driving parameters exhibits conical intersections, which are enabled by hidden time-nonlocal symmetries. We show that each such crossing carries a quantized topological charge: the Floquet--Berry phase acquired along an adiabatic loop around a cone is equal to a $\\mathbb{Z}_2$-valued charge. We further identify a second family of degeneracies that occurs at vanishing driving amplitude, when the level splitting matches $m$ energy quanta of the field. Along the Stark-shifted resonance line, the minimum quasienergy gap opens as $|A|^m$, and the charge is nontrivial only for odd $m$. We analytically derive both results from a perturbative reduction to a spin-$1/2$ in an effective two-dimensional magnetic field and confirm them numerically through the Bargmann invariant. Moreover, we propose a chirality-based protocol that cancels the dynamical phase to isolate the geometric one, and an ancilla-based Ramsey readout that renders the topological charge directly observable.", "url": "https://arxiv.org/abs/2609.00975", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sigmund Kohler"}, {"name": "David Guéry-Odelin"}], "featured_authors": [{"name": "Sigmund Kohler"}, {"name": "David Guéry-Odelin"}], "author_count": 2}, {"id": "2609.01044", "category": "cond-mat", "title": "Mass-conserving growth percolation in polymer gelation", "abstract": "Polymer gelation involves the emergence of a system-spanning network from growing polymer-rich domains, yet conventional percolation models typically prescribe particle size independently of material consumption. We formulate gelation as a locally mass-conserving growth-percolation process in which Voronoi capture zones define finite material reservoirs for individual nuclei. Local depletion determines the evolving supersaturation and limiting particle size, while particle contacts generate a dynamic network whose first spanning cluster defines the gel point. Three mechanisms, namely, interface-, diffusion-, and polymer-blob-controlled growth produce distinct gelation kinetics while sharing the same accessible final state. Spatial fluctuations in nucleation further generate a distribution of gelation times. The framework separates gelation from saturation and naturally captures post-gel aging as continued growth and topological maturation.", "url": "https://arxiv.org/abs/2609.01044", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ameya Rege"}, {"name": "Lorenz Ratke"}], "featured_authors": [{"name": "Ameya Rege"}, {"name": "Lorenz Ratke"}], "author_count": 2}, {"id": "2609.01076", "category": "cond-mat", "title": "Text-guided flow matching enables sample-efficient crystal structure generation", "abstract": "Crystal generators can now propose periodic structures, but their control interfaces remain poorly matched to the mixed descriptors used in materials design. Text provides a compact way to combine composition, symmetry, prototype and property cues, yet it has not been clear whether such information can steer flow-based crystal generation. Here we introduce TFMat, a text-conditioned flow-matching framework that uses structured materials language as a semantic prior for a CrystalFlow generator. Across Perov-5, Carbon-24 and MP-20 crystal structure prediction benchmarks, TFMat improves one-candidate match rates over CrystalFlow and reaches a 92.04% MP-20 match rate with 20 candidates; in de novo generation, it improves element-count and density distribution alignment while retaining coarse property consistency in composition-selected outputs. These results position structured text as an inspectable control layer for translating human-readable materials intent into candidate crystals for downstream simulation and validation.", "url": "https://arxiv.org/abs/2609.01076", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wentao Li"}], "featured_authors": [{"name": "Wentao Li"}], "author_count": 1}, {"id": "2609.01078", "category": "cond-mat", "title": "Statistical Language Competition Model with Dynamic Edge Weighting on a Random Network", "abstract": "This paper presents a computational study of language competition dynamics on Erdős--Rényi random networks, extending the foundational Abrams--Strogatz model through two novel contributions: (i) a dynamic edge-weighting mechanism that reinforces social ties between co-minority speakers by an additive increment $\\Delta$, and (ii) a probabilistic agent-based framework governing language switching via a weighted majority rule. Phase boundaries separating the dominance and coexistence regimes are identified across a two-dimensional parameter space $(p, \\Delta)$, where $p$ denotes the network connectivity probability. We further characterise anomalous persistence zones within predicted dominance regions, attributing them to the formation of isolated minority speaker clusters. Scaling study across network sizes $N \\in \\{50, 100, 250, 500, 1000\\}$ reveal that average cluster size decreases with $N$ and that phase boundaries diffuse with increasing stochastic noise. Finally, we discuss extensions to a tripartite bilingual model and heterogeneous prestige/volatility to more faithfully capture real sociolinguistic contact scenarios.", "url": "https://arxiv.org/abs/2609.01078", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Somyaranjan Chakra"}, {"name": "Mohit Anand Madhesia"}, {"name": "Shradha Mishra"}], "featured_authors": [{"name": "Somyaranjan Chakra"}, {"name": "Mohit Anand Madhesia"}, {"name": "Shradha Mishra"}], "author_count": 3}, {"id": "2609.01088", "category": "cond-mat", "title": "Pressure-regulated mechanochemistry at lithium metal-sulfide electrolyte interfaces", "abstract": "Stack pressure is commonly treated as a means of maintaining physical contact in all-solid-state lithium-metal batteries, but it can also alter the chemistry of reactive solid-solid interfaces. Here, using pressure-aware, charge-resolved machine-learning molecular dynamics validated against DFT, we determine how pressure magnitude and loading geometry regulate interphase formation at Li||Li6PS5Cl interfaces. The response is nonmonotonic: compression at 1 kbar accelerates PS4 decomposition and Li2S-like ordering, whereas 10-100 kbar compression restricts structural rearrangement and long-range crystallization. Charge-resolved dynamics further identify sulfur-centered, lithium-rich early-interphase environments associated with subsequent Li2S-like ordering. Uniaxial loading accelerates interfacial reaction relative to isostatic loading at the same nominal pressure. Pressure also changes void closure and dead-lithium spreading in a defect-location-dependent manner. These results establish applied pressure as a mechanochemical process variable coupling interphase chemistry, ion transport and defect evolution, providing a mechanistic framework for interpreting pressure effects in sulfide solid-state batteries.", "url": "https://arxiv.org/abs/2609.01088", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kunik Jang"}, {"name": "Jaehwan Choi"}, {"name": "Jang Wook Choi"}, {"name": "Yousung Jung"}], "featured_authors": [{"name": "Kunik Jang"}, {"name": "Jaehwan Choi"}, {"name": "Jang Wook Choi"}, {"name": "Yousung Jung"}], "author_count": 4}, {"id": "2609.01137", "category": "cond-mat", "title": "Quantum antidipolar systems in two-dimensional geometries", "abstract": "Particles with magnetic moment can be polarized, and rapidly rotated, employing a magnetic field such that the dipolar interaction among them changes sign, becoming antidipolar and thus isotropically attractive in a plane. Polar molecules can also be manipulated using microwave dressing fields to invert the sign of the dipole-dipole interaction. In this work, we study a two-dimensional system of antidipolar particles by calculating its equation of state and structural properties. The system behaves as a liquid even for scattering lengths significantly greater than the dipolar length. For large enough densities, the system transitions to a solid with one particle per lattice site via a first-order phase transition at a significantly smaller density than its dipolar counterpart. Moreover, motivated by the recent realization of a strongly axially trapped, bilayer geometry [Science 384, 546-551 (2024)], we study the properties of the bilayer liquid phase as the inter-layer distance is tuned, and provide the range of parameters where one layer can influence the properties of the other.", "url": "https://arxiv.org/abs/2609.01137", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Juan Sánchez-Baena"}, {"name": "Jordi Boronat"}], "featured_authors": [{"name": "Juan Sánchez-Baena"}, {"name": "Jordi Boronat"}], "author_count": 2}, {"id": "2609.01160", "category": "cond-mat", "title": "Layer-selective and magnetic-field-enhanced transport of topological kink states in rhombohedral multilayer graphene", "abstract": "Topological valley kink states (VKSs), which are quantum valley Hall states emerging at the interfaces between adjacent domains with opposite valley Chern numbers, have attracted considerable interest in graphene-based systems. In this work, we investigate the quantum transport of VKSs in ABC-stacked rhombohedral multilayer graphene in the presence of Anderson disorder and a perpendicular magnetic field. Two prominent transport characteristics are revealed. First, in the absence of a magnetic field, the kink states exhibit strong layer polarization, with their wave functions predominantly localized and equally distributed on the outermost top and bottom layers. As a result, their transport properties are highly sensitive to the layer-selective disorder distribution. Second, under a perpendicular magnetic field, the layer-symmetric spatial distribution of VKSs is broken, leading to a significant reduction in the wave-function overlap between counter-propagating VKSs from opposite valleys. Consequently, intervalley scattering is suppressed, and the transmission of VKSs through disordered regions is substantially enhanced. Our results provide new insights into multichannel topological valley transport in rhombohedral multilayer graphene and demonstrates disorder-engineering and magnetic fields as effective approaches for manipulating the propagation of VKSs.", "url": "https://arxiv.org/abs/2609.01160", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chengyu Shen"}, {"name": "Zhe Hou"}], "featured_authors": [{"name": "Chengyu Shen"}, {"name": "Zhe Hou"}], "author_count": 2}, {"id": "2609.01197", "category": "cond-mat", "title": "Dynamical phase transitions for single particles in the semiclassical and weak noise limits", "abstract": "We present a unifying description of dynamical phase transitions in the unitary evolution of an isolated quantum particle and the dissipative relaxation of a classical Brownian particle, based on a dynamical generat- ing function. In the semiclassical and weak-noise limits, Fisher zeros of this function condense in the complex- time plane and reach the corresponding physical axes, producing dynamical phase transitions through a competition between return trajectories. This establishes a direct connection between quantum and classical (finite-time) dynamical phase transitions, where the semiclassical limit plays the role of the thermodynamic limit. In particular, the established link naturally provides a classical version of the Loschmidt amplitude and shows how dynamical quantum phase transitions, typically associated with isolated many-body systems, can arise in a single-particle quantum system. The dynamical phases are distinguished by a unifying, trajectory- based order parameter, realized as a classical correlation function and a sequential quantum weak value.", "url": "https://arxiv.org/abs/2609.01197", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Norayr Asriyan"}, {"name": "Jan Meibohm"}, {"name": "Vasco Cavina"}, {"name": "Massimiliano Esposito"}], "featured_authors": [{"name": "Norayr Asriyan"}, {"name": "Jan Meibohm"}, {"name": "Vasco Cavina"}, {"name": "Massimiliano Esposito"}], "author_count": 4}, {"id": "2609.01213", "category": "cond-mat", "title": "Robust thermodynamics constrain disorder and pairing in far-overdoped Tl$_2$Ba$_2$CuO$_6$", "abstract": "The physical origin of the suppression of superconductivity with hole doping in overdoped cuprates remains unclear. We measure the electronic specific heat of microgram-scale Tl$_2$Ba$_2$CuO$_6$ crystals and find sharp superconducting anomalies persisting far into the overdoped regime, with $\\Delta\\gamma(T_{\\rm c})/\\gamma_n\\approx0.6$ for $T_{\\rm c}=14$-$25$K. A weak-coupling BCS-like framework incorporating the known Fermi surface and cation disorder quantitatively reproduces the observed anomaly and its weak doping dependence. We conclude that the observed $T_{\\rm c}(p)$ cannot be driven predominantly by increasing disorder and is instead consistent with a smoothly decreasing pairing strength.", "url": "https://arxiv.org/abs/2609.01213", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ayanesh Maiti"}, {"name": "David M. Broun"}, {"name": "Seunghyun Khim"}, {"name": "Michal Moravec"}, {"name": "Antony Carrington"}, {"name": "Carsten Putzke"}, {"name": "Vivek Mishra"}, {"name": "Peter Hirschfeld"}, {"name": "Andrew P. Mackenzie"}, {"name": "Andreas W. Rost"}], "featured_authors": [{"name": "Ayanesh Maiti"}, {"name": "David M. Broun"}, {"name": "Seunghyun Khim"}, {"name": "Peter Hirschfeld"}, {"name": "Andrew P. Mackenzie"}, {"name": "Andreas W. Rost"}], "author_count": 10}, {"id": "2609.01278", "category": "cond-mat", "title": "An exact and fast solution of the inverse Regularized Optimal Transport problem", "abstract": "Optimal transport describes the most efficient way to move mass between two distributions, given a cost matrix for moving mass between each pair of locations. Entropic optimal transport, solved via the Sinkhorn algorithm, is a widely used regularized version of this problem. Its inverse problem asks the opposite question: given an observed transport plan, what cost matrix produced it? This is difficult because the cost is identifiable only up to an additive gauge freedom. Here we show that this freedom can be fixed exactly by a single double-centering operation applied to the observed plan, yielding the true cost matrix in closed form, with no iterative optimization required. When a modest number of true cost entries are known, the same approach lets us jointly estimate the temperature parameter controlling the entropic regularization, together with a diagnostic for the reliability of this estimate. We further show that the method is not specific to the entropic optimal transport, but extends to a broader class of transport models defined by an invertible relation between cost and plan.", "url": "https://arxiv.org/abs/2609.01278", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dario Mazzilli"}, {"name": "Riccardo Piombo"}, {"name": "Lorenzo Buffa"}, {"name": "Aurelio Patelli"}], "featured_authors": [{"name": "Dario Mazzilli"}, {"name": "Riccardo Piombo"}, {"name": "Lorenzo Buffa"}, {"name": "Aurelio Patelli"}], "author_count": 4}, {"id": "2609.01301", "category": "cond-mat", "title": "Self-Healing Diffusion Monte Carlo applied to a simple fermionic model: A critical assessment of the method", "abstract": "We investigate the Self-Healing Diffusion Monte Carlo (SHDMC) method using a one-dimensional model with periodic boundary conditions. An inversion symmetry is introduced to mimic the antisymmetry property of fermionic wavefunctions, with the bosonic and fermionic sectors being modeled by the even and odd eigenstates, respectively. As in realistic fermionic systems, the nodal structure is only partially constrained by symmetry, making this model a non-trivial testbed for nodal optimization algorithms such as SHDMC. We show that the nodal evolution under SHDMC iterations can be cast into a dynamical system exhibiting both attractive and repulsive fixed points. In the standard formulation of SHDMC applied to this model, the fixed-node energy is found to increase upon iteration, and the node converges to a wrong value, indicating that SHDMC does not always converge to the correct solution. We further show that this problem is partially cured by modifying the nodal update criterion to give more importance to the nodal region. Achieving convergence in the general case very likely requires the use of a localized basis set, as is the case for this model.", "url": "https://arxiv.org/abs/2609.01301", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Michel Caffarel"}, {"name": "Manon Pinar"}, {"name": "Anthony Scemama"}], "featured_authors": [{"name": "Michel Caffarel"}, {"name": "Manon Pinar"}, {"name": "Anthony Scemama"}], "author_count": 3}, {"id": "2609.01312", "category": "cond-mat", "title": "Inversion-symmetric topological insulators in cut-and-project binary chains", "abstract": "We investigate the electronic properties of binary tight-binding chains generated by the cut-and-project method for rational slopes $\\alpha=p/q$, leading to periodic and inversion symmetric chains with $n=p+q$ sites. The binary structure is encoded in two hopping amplitudes $t_a$ and $t_b$. For fixed $t_a \\neq t_b$, the support of the energy spectrum as a function of $p/n$ gives rise to a \"Cut-and-Project butterfly\". We concentrate on insulators with $M$ filled bands among a total of $n$ bands and vary $t_a/t_b$. Inversion symmetry constrains the electric polarization $P$ to $0$ or $P_q/2$ modulo a polarization quantum $P_q = \\gcd(M,n)/n$. A topological transition, between two insulators that differ by their quantized polarization, occurs if and only if $n/\\gcd(M,n)$ is odd. When $n/\\gcd(M,n)$ is even, the two insulating regimes have a vanishing polarization and no topological transition occurs, despite the gap closing at $t_a=t_b$. When $n$ is even and $M$ odd, we find an adiabatic path between $t_a>t_b$ and $t_a<t_b$ that maintains inversion symmetry and a gap.", "url": "https://arxiv.org/abs/2609.01312", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhipeng Zeng"}, {"name": "Yuge Chen"}, {"name": "Jean-Noël Fuchs"}, {"name": "Jianxin Zhong"}, {"name": "Rémy Mosseri"}], "featured_authors": [{"name": "Zhipeng Zeng"}, {"name": "Yuge Chen"}, {"name": "Jean-Noël Fuchs"}, {"name": "Jianxin Zhong"}, {"name": "Rémy Mosseri"}], "author_count": 5}, {"id": "2609.01329", "category": "cond-mat", "title": "Pole-Zero Geometry, Model Reduction, and Identifiability in Sensory Adaptation", "abstract": "Sensory adaptation provides a concrete setting in which low-order system identification can fail qualitatively. We show that one fixed higher-order adaptive system composed entirely of real first-order relaxation modes can be reduced to opposite sides of the second-order pole boundary: low-frequency moment matching gives $\\rho_{\\rm moment}=4.50$, whereas finite-window fitting gives $\\rho_{\\rm window}=3.31$, and the inferred pole class changes further with sampling protocol. Thus the real-versus-complex classification of a reduced model is not itself reduction invariant. We then use the general two-state spectrum to connect stochastic identifiability to adaptation: for nontrivial coupling and one-state observation, cross diffusion drops out of the scalar spectrum when the hidden state has no self-relaxation. In the adaptive model, this condition is precisely the integral-memory limit that produces exact adaptation, while leaky memory restores spectral sensitivity. For the exact-adaptation model, the Gaussian path-space irreversibility nevertheless depends on the hidden cross-diffusion channel. Hence $\\{H,S_x\\}$ does not determine the irreversibility rate. Independently, for a specified all-even reduced two-state drift with $\\rho<4$, the drift-only lower bound is $\\sigma \\ge \\tau_x^{-1}(4/\\rho-1)$. Published \\textit{E.~coli} and \\textit{C.~elegans} responses provide biological examples of these limits. The distinction established here between transfer-function invariants, reduction-dependent properties, and hidden-state quantities provides a concrete framework for evaluating the limitations of low-dimensional models of adaptive biological dynamics.", "url": "https://arxiv.org/abs/2609.01329", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gunn Kim"}], "featured_authors": [{"name": "Gunn Kim"}], "author_count": 1}, {"id": "2609.01363", "category": "cond-mat", "title": "Antiresonances of Wannier-Stark ladders in Su-Schrieffer-Heeger lattices", "abstract": "We demonstrate that Wannier-Stark ladders (WSLs) in one-dimensional Su-Schrieffer-Heeger (SSH) chains manifest as antiresonance signatures in the electron transmission. We study the quantum transport in the SSH chain in the presence of a periodic potential profile plus a uniform electric field. By employing the global matrix method with non-trivial matching conditions, we find that these WSL antiresonances correspond to states that are exponentially localized at the potential's incident boundary. These findings provide a robust, unified framework for identifying WSLs across diverse scales, ranging from electronic transport in trans-polyacetylene to classical-wave analogs in phononic crystals and surface water waves.", "url": "https://arxiv.org/abs/2609.01363", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yonatan Betancur-Ocampo"}, {"name": "Guillermo Monsivais"}], "featured_authors": [{"name": "Yonatan Betancur-Ocampo"}, {"name": "Guillermo Monsivais"}], "author_count": 2}, {"id": "2609.01492", "category": "cond-mat", "title": "Accelerating dynamic simulations of photoexcited materials and their evolution by electron-informed machine learning", "abstract": "Nonadiabatic coupled electron-nuclear dynamics upon electronic excitation underpin the microscopic mechanism and rational modulation of diverse photoinduced functional phenomena in materials, yet their direct first-principles simulations remain computationally demanding. Here we develop a framework for nonadiabatic excited-state machine-learning molecular dynamics (EMLMD) simulations, where the nonequilibrium electronic information upon photoexcitation such as electron temperature is rigorously calibrated from high-precision real-time time-dependent density functional theory (rt-TDDFT) benchmark simulations, enabling accurate reconstruction of excited-state potential energy surfaces (PES). This framework natively incorporates the excited-state electron-phonon couplings and intrinsically captures photoinduced phonon anharmonicity, both of which are missing in standard machine learning molecular dynamics, thus delivering first-principles-level accuracy for excited-state atomic evolutions. Large-scale EMLMD simulations resolve time- and momentum-resolved phonon dynamics in photoexcited materials, directly uncovering the competition between photogenerated coherent phonons and thermal phonons during photoinduced phase transition of bismuth. It also simultaneously resolves elusive atomic-scale microscopic dynamics and global structural rearrangement for selenium photoamorphization. Balancing high accuracy and efficiency, EMLMD offers a versatile paradigm to tackle key challenges in the study of complex excited-state molecular dynamics.", "url": "https://arxiv.org/abs/2609.01492", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yunzhe Jia"}, {"name": "Fankai Xie"}, {"name": "Yunfei Bai"}, {"name": "Miao Liu"}, {"name": "Cui Zhang"}, {"name": "Sheng Meng"}], "featured_authors": [{"name": "Yunzhe Jia"}, {"name": "Fankai Xie"}, {"name": "Yunfei Bai"}, {"name": "Miao Liu"}, {"name": "Cui Zhang"}, {"name": "Sheng Meng"}], "author_count": 6}, {"id": "2609.01602", "category": "cond-mat", "title": "Singular Weak-Field Thermodynamics of 2D Superconductors", "abstract": "In a bulk 3D type-II superconductor, the lower critical field at which an isolated vortex becomes thermodynamically favorable is a size-independent material property. We show that the situation is different in 2D superconductors: the larger the superconductor, the weaker the field needed to create its first vortex. The lower critical field in 2D is always size-dependent. For a disk of area $\\mathcal A$, the lower critical field $B_v(\\mathcal A)$ scales as $\\mathcal A^{-1}\\ln(\\mathcal A/\\mathcal A_0)$ in the weak-screening regime and as $\\mathcal A^{-1/2}$ in the strong-screening regime. We derive these results from an analytically tractable microscopic model that admits many-body wavefunctions for both the uniform and singly quantized vortex states in a magnetic field, and incorporate screening by coupling their long-distance 2D supercurrents to 3D Maxwell equations. These results motivate organizing the weak-field ground-state of a 2D superconductor in the $(1/\\mathcal A,B)$ plane. The origin represents the zero-field thermodynamic limit and it is singular. Approaching the origin along the $B$ axis leads to an increasingly dilute vortex lattice, whereas approaching along the $1/\\mathcal A$ axis yields the uniform vortex-free state. Our theory shows that every trajectory carrying fixed finite flux ultimately approaches the vortex-free state in the thermodynamic limit and provides a firm microscopic foundation for the weak-field thermodynamics of 2D superconductors.", "url": "https://arxiv.org/abs/2609.01602", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Guopeng Xu"}, {"name": "Chunli Huang"}], "featured_authors": [{"name": "Guopeng Xu"}, {"name": "Chunli Huang"}], "author_count": 2}, {"id": "2609.00096", "category": "hep-th", "title": "Quantum corrections to the black hole entropy using the brick wall model", "abstract": "It was suggested by 't Hooft that to avoid the divergence of the free energy or entropy of the probe fields, one has to introduce an infrared (IR) cutoff. This introduction of the IR cutoff, namely, the brick wall model, has been studied for the Schwarzschild black hole and has been shown by 't Hooft that to have the entropy of the order of Bekenstein-Hawking entropy, the cutoff must be of the order of Planck length. In this study, we investigated the brick wall model in the context of a Reissner-Nordstróm, quantum corrected Schwarzschild and quantum corrected Reissner-Nordström black holes. In particular, we have shown that the brick wall model can give logarithmic correction to the black hole entropy in the subleading order. The important aspect of our analysis is that we have not considered the near horizon approximation of the lapse function and get more accurate correction to the entropy. This corrected entropy has an important feature that it is larger than the usual Bekenstein-Hawking entropy which aligns with the result of Barrow entropy.", "url": "https://arxiv.org/abs/2609.00096", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gopinath Guin"}, {"name": "Arpita Jana"}, {"name": "Sunandan Gangopadhyay"}], "featured_authors": [{"name": "Gopinath Guin"}, {"name": "Arpita Jana"}, {"name": "Sunandan Gangopadhyay"}], "author_count": 3}, {"id": "2609.00119", "category": "hep-th", "title": "Black Hole-Tower Correspondence: Species backreaction in minimal black hole limits", "abstract": "The Black Hole-String Correspondence identifies the microstates of a minimal black hole with those of a highly excited string. In decompactification limits, where the light states are Kaluza--Klein modes, its proposed counterpart is the Black Hole-Tower Correspondence at the species scale. We extend it in three directions. First, we expand the free thermodynamic analysis to include towers with string-oscillators and Kaluza--Klein modes, and clarify whether the ensemble connects to a $d$-dimensional black hole or a wrapped black string. Second, we include gravitational backreaction in the pure Kaluza--Klein tower transition. With no winding-tachyon analogue, the interpolating configuration is the one-loop Kaluza--Klein gas, which reorganizes into higher-dimensional radiation and yields self-gravitating solutions whose instability points to the black string and whose thermodynamics match it at the correspondence point, $S\\sim N_{\\rm sp}$, where the size approaches the species length. This shows that the matching is robust under self-interactions. Third, we ask whether the two phases are continuously connected, revisiting and extending the worldsheet and topological analyses of the Black Hole-String case to include also Kaluza--Klein towers. Linear sigma model families interpolate smoothly in the heterotic string, while in type II the transition is obstructed. The cobordism classes of the two saddles agree in every structure we check, but their brane-charge lattices, given by bordism groups, differ, which is the source of the type II obstruction. This obstruction is thus perturbative, showing that the transition can only proceed through the non-perturbative, charge-violating processes of the kind predicted by the Cobordism Conjecture.", "url": "https://arxiv.org/abs/2609.00119", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Miquel Aparici"}, {"name": "Alvaro Herráez"}, {"name": "Joaquin Masias"}], "featured_authors": [{"name": "Miquel Aparici"}, {"name": "Alvaro Herráez"}, {"name": "Joaquin Masias"}], "author_count": 3}, {"id": "2609.00120", "category": "hep-th", "title": "Subleading Collinear Limits of Yang--Mills Amplitudes from Recursions", "abstract": "We study the subleading adjacent-collinear limit of tree-level color-ordered Yang--Mills amplitudes. In general dimensions, a Lorentz null rotation transports the polarizations of collinear legs along the collinear path while preserving transversality and gauge equivalence. The finite coefficient then separates into a pole-free hard contribution, computed by a channel-deleted Berends--Giele recursion, and an explicit contribution from the adjacent factorization channel. In four dimensions, we construct the same coefficient directly from a collinear-aware Britto-Cachazo-Feng-Witten recursion whose terminal data are closed MHV and $\\overline{\\rm MHV}$ formulas. Both constructions apply at arbitrary momentum fraction and extend to collinear gluons with distinct polarizations; at the symmetric split, the auxiliary-vector dependence cancels for equal polarizations and for the polarization-symmetrized mixed limit. Open--closed disk relations then give a direct construction of one-graviton Einstein--Yang--Mills amplitudes and their higher-derivative string corrections from the recursively generated coefficients. A self-contained \\textsc{Mathematica} implementation accompanies the paper.", "url": "https://arxiv.org/abs/2609.00120", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jin Dong"}, {"name": "Stephan Stieberger"}], "featured_authors": [{"name": "Jin Dong"}, {"name": "Stephan Stieberger"}], "author_count": 2}, {"id": "2609.00122", "category": "hep-th", "title": "Classification of Rational $c=1$ Vertex Operator Algebras and Vertex Operator Superalgebras", "abstract": "For mathematicians: In this first in a series of two papers, we give a mathematically rigorous classification of (sufficiently nice) $c=1$ vertex operator algebras (VOAs) and vertex operator superalgebras (VOSAs). We confirm the lore that any such VO(S)A is either a lattice VO(S)A $V_L$ associated to a rank-1 integral lattice $L$, or can be obtained as an orbifold thereof, i.e. a $G$-invariant subalgebra $V_L^G$ for some finite group $G$ of automorphisms. All such $G$ are known, allowing for an explicit enumeration of nice $c=1$ VO(S)As. A key ingredient in our approach is to establish a general criterion for nice VOAs, requiring knowledge only of the vacuum character, for testing when the simple modules with integer conformal dimension span a symmetric fusion subcategory which is braided tensor equivalent to $Rep(G)$. In our companion paper, we calculate the ribbon auto-equivalences of the representation categories of the nice $c=1$ VOAs, and leverage this to obtain the classification of nice bosonic and fermionic $c=1$ full conformal field theories. For physicists: We rigorously classify the chiral algebras that can arise in the holomorphic sector of a bosonic or fermionic rational $c=1$ conformal field theory (CFT) whose non-identity primaries all have positive conformal dimension. Thinking of chiral algebras as gapless boundary conditions of 3D topological quantum field theories (TQFTs), our result says that any such chiral algebra is either a holomorphic boundary of $U(1)_k$ Chern-Simons theory, or can be obtained by passing to the $G$-invariant states thereof for some finite group $G$ of symmetries. We explicitly enumerate these chiral algebras and also discuss their non-invertible symmetries. In a companion paper, we build on these results using techniques from the study of 3D TQFTs to classify full bosonic and fermionic rational $c=1$ CFTs.", "url": "https://arxiv.org/abs/2609.00122", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Terry Gannon"}, {"name": "Brandon C. Rayhaun"}], "featured_authors": [{"name": "Terry Gannon"}, {"name": "Brandon C. Rayhaun"}], "author_count": 2}, {"id": "2609.00126", "category": "hep-th", "title": "Quantum Complexity Dynamics for Disjoint Subsystems", "abstract": "Quantum complexity has emerged as a natural probe of chaos, thermalization, and the black hole interior on timescales long after local observables have equilibrated. However, its time evolution has been studied almost exclusively in subsystems confined to a single connected region. We show, using complementary tools from holography and random quantum circuits, that noncontiguous subsystems composed of multiple disjoint regions give rise to qualitatively new physics compared to the contiguous case. First, at
