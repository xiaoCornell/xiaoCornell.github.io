  <style>

  <script>
    const papers = [{"id": "2609.16045", "category": "cond-mat", "title": "Maxwell-J$ü$ttner averaged nonaffine theory of relativistic shear viscosity", "abstract": "We formulate a Maxwell-Jüttner averaged extension of relativistic nonaffine shear-viscosity theory for a classical gas of massive particles. The starting point is the relativistic nonaffine response formula derived from generalized Langevin dynamics, where proper-momentum dissipation produces a Lorentz-factor enhancement of the viscosity. Since a thermal relativistic gas is not characterized by a single Lorentz factor, we replace this scalar enhancement by an equilibrium momentum average over the Maxwell-Jüttner distribution. Within the scalar transverse mean-field closure used in this work, the minimal relativistic correction is the Maxwell-Jüttner mean of the Lorentz factor and becomes a finite-mass enhancement function of $\\zeta=mc^2/(k_BT)$. In the general closure, the averaged object is the full product of the Lorentz factor, the zero-frequency memory kernel, and the nonaffine affine-force correlator. This construction separates kinematic relativistic enhancement from dynamical dissipation encoded in the bath memory and collective mode spectrum. We derive the nonrelativistic and ultrarelativistic limits, show that a specified effective hard-sphere scaling reproduces the classical square-root law as a consistency test, and identify the assumptions under which a cubic high-temperature law follows. Comparison with relativistic kinetic-theory examples clarifies that the memory kernel is not equivalent to a relaxation time unless a microscopic closure is specified. Retaining the full frequency dependence instead yields a relaxation spectrum. A single dominant pole reduces this spectrum to one shear relaxation time and gives the usual transient shear equation.", "url": "https://arxiv.org/abs/2609.16045", "type": "理论", "summary": "我们针对大质量粒子的经典气体制定了相对论非仿射剪切粘度理论的麦克斯韦-尤特纳平均延伸。起点是从广义朗之万动力学导出的相对论非仿射响应公式，其中固有动量耗散产生粘度的洛伦兹因子增强。由于热相对论气体不具有单一洛伦兹因子的特征，因此我们用麦克斯韦-朱特纳分布上的平衡动量平均值来代替这种标量增强。在本工作中使用的标量横向平均场闭合中，最小相对论校正是洛伦兹因子的 Maxwell-Jüttner 均值，并成为 $\\zeta=mc^2/(k_BT)$ 的有限质量增强函数。在一般闭包中，平均对象是洛伦兹因子、零频率内存内核和非仿射仿射力相关器的全乘积。这种结构将运动相对论增强与浴记忆和集体模谱中编码的动态耗散分开。\n\n我们推导出非相对论和超相对论极限，表明指定的有效硬球标度可再现经典平方根定律作为一致性检验，并确定三次高温定律所遵循的假设。与相对论动力学理论示例的比较表明，除非指定微观闭包，否则内存内核并不等同于弛豫时间。相反，保留完整的频率依赖性会产生弛豫谱。单个主极点将该谱简化为一个剪切弛豫时间，并给出通常的瞬态剪切方程。", "authors": [{"name": "Reggie C. Pantig"}, {"name": "Ali Övgün"}], "featured_authors": [{"name": "Reggie C. Pantig"}, {"name": "Ali Övgün"}], "author_count": 2}, {"id": "2609.16084", "category": "cond-mat", "title": "Topological superconductors and Majorana fermions based on $X$-wave magnets with $X=p,d,f,g,i $", "abstract": "We study superconductors coupled with $X$-wave magnets with $X=p,d,f,g,i$. They are essentially different between altermagnets with $X=d,g,i$ and odd-parity magnets $X=p,f$ due to the compatibility of the spin-singlet formation of the $s$-wave superconductor. The altermagnets and odd-parity magnets show rich superconducting phase diagrams depending on the strength of the magnetic order, the chemical potential and the ratio of the on-site and nearest-neighbor interactions. Especially, we find that the altermagnetic order stabilizes the chiral ($p_{x}+ip_{y}$)-wave superconductor, which is a class D topological superconductor hosting Majorana chiral edge states. It is characterized by the Chern number. Especially, there emerge two chiral edge modes in the $i$-wave altermagnet, which are characterized by the Chern number 2. On the other hand, the $p$ ($f$)-wave odd-parity magnetic order stabilizes the $p$ ($f$)-wave topological superconductor, which is a class DIII topological superconductor hosting Majorana flat bands. It is characterized by the winding number. Majorana flat bands are robust in the presence of the mixing with the $s$-wave superconductivity, which is inevitable for odd-parity magnets although the magnitude of the mixing is tiny.", "url": "https://arxiv.org/abs/2609.16084", "type": "理论+数值", "summary": "我们研究与 $X$ 波磁体耦合的超导体，其中 $X=p,d,f,g,i$。由于 $s$ 波超导体的自旋单线态形成的兼容性，$X=d,g,i$ 的交流磁体和奇宇称磁体 $X=p,f$ 之间有本质上的不同。交变磁体和奇宇称磁体显示出丰富的超导相图，具体取决于磁序的强度、化学势以及现场相互作用和最近邻相互作用的比率。特别是，我们发现交变磁序稳定了手性 ($p_{x}+ip_{y}$) 波超导体，这是一种具有马约拉纳手性边缘态的 D 类拓扑超导体。它的特征是陈数。特别是，$i$波交变磁体中出现了两种手性边缘模式，其特征为陈数2。另一方面，$p$($f$)波奇宇称磁序稳定了$p$($f$)波拓扑超导体，这是一种具有马约拉纳平带的DIII类拓扑超导体。它的特点是绕数。\n\n马约拉纳平带在与$s$波超导混合的情况下是稳健的，这对于奇宇称磁体来说是不可避免的，尽管混合的幅度很小。", "authors": [{"name": "Motohiko Ezawa"}], "featured_authors": [{"name": "Motohiko Ezawa"}], "author_count": 1}, {"id": "2609.16124", "category": "cond-mat", "title": "Anderson localization in topological metals", "abstract": "We address the question of whether topological metals (TM) retain their nontrivial characteristics in the presence of disorder. While in the clean case, the issue is what protects the gaplessness of the spectrum, i.e. the band-touching nodes in TM, this question needs to be reformulated in the presence of disorder. The concept of gaplessness loses its sharp meaning in this case, since spectral gaps can be filled in by disorder-induced states. What is still meaningful is entanglement: one may ask whether the long-range entanglement of the clean gapless TM survives in the presence of disorder or, in other words, whether nontrivial topology protects the TM from Anderson localization. We demonstrate that such a protection exists in the case of three-dimensional (3D) Weyl semimetals, but not in 2D and 3D (type-I) Dirac or 3D nodal line semimetals. We establish this by combining the idea of unquantized anomaly as the topological response of TM with the decorated domain wall construction, used previously to discuss average symmetry-protected topological insulating phases.", "url": "https://arxiv.org/abs/2609.16124", "type": "理论", "summary": "我们解决了拓扑金属（TM）在无序存在时是否保留其重要特征的问题。在干净的情况下，问题是如何保护频谱的无间隙，即 TM 中的带接触节点，在存在无序的情况下需要重新表述这个问题。在这种情况下，无间隙的概念就失去了其尖锐的意义，因为光谱间隙可以由无序引起的状态填充。仍然有意义的是纠缠：人们可能会问，干净无间隙TM的长程纠缠是否在无序存在的情况下仍然存在，或者换句话说，非平凡的拓扑是否可以保护TM免受安德森局域化的影响。我们证明这种保护存在于三维 (3D) 韦尔半金属中，但不存在于 2D 和 3D（I 型）狄拉克或 3D 节线半金属中。我们通过将非量化异常作为 TM 拓扑响应的想法与装饰畴壁结构相结合来建立这一点，之前用于讨论平均对称保护拓扑绝缘相。", "authors": [{"name": "A.A. Burkov"}], "featured_authors": [{"name": "A.A. Burkov"}], "author_count": 1}, {"id": "2609.16147", "category": "cond-mat", "title": "Quantum Critical Solids", "abstract": "We study the fate of quantum solids with a vanishing velocity of transverse phonons. Such ``floppy'' solids exhibit a cubic elastic nonlinearity that is relevant in spatial dimensions $d<4$ and drives the system to a strongly-coupled Lifshitz quantum critical point in $d=3$, that we analyze in an $\\epsilon = 4-d$ expansion. The associated phase transition is generically first-order, preempting the system's full access to the strongly-coupled fixed point. Nevertheless, the critical data of this quantum critical point is accessible within a Ginzburg region in the vicinity of the transition. This cubic nonlinearity vanishes exactly in $d=2$, where the leading interactions are instead quartic and are marginal, leading to weak logarithmic singularities. We discuss possible realizations of this ``crystal Lifshitz criticality'' in quantum materials.", "url": "https://arxiv.org/abs/2609.16147", "type": "理论", "summary": "我们研究横向声子消失速度下量子固体的命运。这种“软”固体表现出与空间维度 $d<4$ 相关的立方弹性非线性，并将系统驱动到 $d=3$ 中的强耦合 Lifshitz 量子临界点，我们在 $\\epsilon = 4-d$ 展开中进行分析。相关的相变通常是一阶的，抢占系统对强耦合定点的完全访问。然而，这个量子临界点的关键数据可以在过渡附近的金兹堡区域内获得。这种三次非线性在 $d=2$ 中完全消失，其中主要相互作用是四次的并且是边际的，导致弱对数奇点。我们讨论了量子材料中这种“晶体利夫席茨临界性”的可能实现。", "authors": [{"name": "Subham Dutta Chowdhury"}, {"name": "Leo Radzihovsky"}, {"name": "Luca V. Delacrétaz"}], "featured_authors": [{"name": "Subham Dutta Chowdhury"}, {"name": "Leo Radzihovsky"}, {"name": "Luca V. Delacrétaz"}], "author_count": 3}, {"id": "2609.16172", "category": "cond-mat", "title": "Two-Dimensional Materials toward CMOS-Compatible Scalable Quantum Hardware", "abstract": "Manufacturability is one of several constraints on developing solid-state quantum processors, along with qubit performance, control, connectivity, cryogenic operation, and fault tolerance. Chemical residues, structural disorder, and non-uniform interfaces introduced during fabrication can compromise qubit coherence. Two-dimensional (2D) materials, with their atomically thin crystals and van der Waals interfaces, offer routes to address some of these challenges. Their concurrent development as next-generation CMOS channel materials motivates an examination of whether relevant processes can be transferred to quantum chips. This Perspective evaluates the opportunities and limitations of 2D materials for CMOS-compatible quantum hardware.", "url": "https://arxiv.org/abs/2609.16172", "type": "理论+数值", "summary": "可制造性是开发固态量子处理器的几个限制之一，其他限制还包括量子位性能、控制、连接、低温操作和容错。制造过程中引入的化学残留物、结构紊乱和不均匀界面可能会损害量子位的一致性。二维 (2D) 材料具有原子级厚度的晶体和范德华界面，为解决其中一些挑战提供了途径。它们作为下一代 CMOS 通道材料的同时开发激发了人们对相关工艺是否可以转移到量子芯片的研究。本视角评估了 2D 材料在 CMOS 兼容量子硬件中的机遇和局限性。", "authors": [{"name": "Mara Lieberegts"}, {"name": "Ye Wang"}], "featured_authors": [{"name": "Mara Lieberegts"}, {"name": "Ye Wang"}], "author_count": 2}, {"id": "2609.16311", "category": "cond-mat", "title": "An improved auxiliary boson method for quantum dots with finite Coulomb interaction U", "abstract": "In this work, we present an improved version of the formulation of the four auxiliary bosons originally proposed by Kotliar and Ruckenstein, adapted to describe a quantum dot in the Kondo regime with finite electron-electron interaction U. The proposed refinement provides a more accurate treatment of strong electronic correlations while preserving the analytical tractability of the original approach, thereby enabling a reliable description of transport properties in nanoscale systems. Benchmark calculations show good agreement with the results of the numerical renormalization group, supporting the validity of the improved formulation. Our approach therefore provides an efficient and robust framework for investigating transport through strongly correlated quantum dots.", "url": "https://arxiv.org/abs/2609.16311", "type": "理论+数值", "summary": "在这项工作中，我们提出了 Kotliar 和 Ruckenstein 最初提出的四种辅助玻色子公式的改进版本，适用于描述具有有限电子-电子相互作用 U 的近藤体系中的量子点。所提出的改进提供了对强电子相关性的更准确处理，同时保留了原始方法的分析易处理性，从而能够可靠地描述纳米级系统中的输运特性。基准计算显示与数值重正化组的结果非常吻合，支持了改进公式的有效性。因此，我们的方法为研究强相关量子点的传输提供了一个有效且强大的框架。", "authors": [{"name": "Juan Pablo Ramos-Andrade"}, {"name": "Patricia Almeida"}, {"name": "Ana María Calle"}, {"name": "Gustavo Lara"}], "featured_authors": [{"name": "Juan Pablo Ramos-Andrade"}, {"name": "Patricia Almeida"}, {"name": "Ana María Calle"}, {"name": "Gustavo Lara"}], "author_count": 4}, {"id": "2609.16343", "category": "cond-mat", "title": "Domain-wall energy governs coercivity in ordered and disordered additively manufactured Fe--49Co--2V", "abstract": "Additively manufactured soft-magnetic Fe--Co is consistently harder than wrought material of the same composition, and controlling that excess is the central obstacle to printing electrical machines from these alloys. The literature attributes it to B2 chemical ordering, untested because the anisotropy of the ordered state had not been measured for this alloy and because printed material had never been compared with wrought material at matched grain size. In this study we supply both. Calibrating on wrought Fe--49Co--2V at a known order parameter fixes the ordered-state domain-wall energy and caps every pinning channel independent of grain size. Ordering then falls orders of magnitude short of the measured excess, and a tenfold change in antiphase-domain size leaves coercivity unchanged. What ordering controls is the wall energy, and that effect is small and bounded. The excess is retained defect content, which moves process optimization from post-build annealing to in-build defect control.", "url": "https://arxiv.org/abs/2609.16343", "type": "理论+数值", "summary": "增材制造的软磁铁钴始终比相同成分的锻造材料更硬，控制过量是用这些合金印刷电机的主要障碍。文献将其归因于 B2 化学有序性，未经测试，因为尚未测量该合金的有序态各向异性，并且从未将印刷材料与晶粒尺寸匹配的锻造材料进行比较。在这项研究中，我们提供了两者。在已知有序参数下对锻造 Fe--49Co--2V 进行校准可固定有序态畴壁能量，并覆盖每个钉扎通道，而与晶粒尺寸无关。然后，有序度会比测量的过量值低几个数量级，并且反相域尺寸的十倍变化会使矫顽力保持不变。顺序控制的是壁能量，而且这种影响很小且有限。多余的部分是保留的缺陷内容，这将工艺优化从构建后退火转移到构建内缺陷控制。", "authors": [{"name": "Dennis Boakye"}, {"name": "Chuang Deng"}], "featured_authors": [{"name": "Dennis Boakye"}, {"name": "Chuang Deng"}], "author_count": 2}, {"id": "2609.16371", "category": "cond-mat", "title": "Soft thermal diodes: grafted polymers provide a highly tunable thermal rectification", "abstract": "We explore the heat-rectification properties of a two-phase fluid confined in a nano-chamber with one wall coated with end-grafted polymers using molecular-dynamics simulations. We find a significant thermal diode effect for a wide range of chamber fillings for both very stiff and fully flexible polymers. A stationary heat flux is imposed on the system by fixing the walls at two different temperatures, computing the heat flow as a function of the filling density. The fluid presents a liquid phase, located close to the cold wall, and, for many fillings, a vapor phase in contact with the hot wall. A vapor-liquid interface is also present and located at different distances from the walls, depending on the fluid filling. We study the system by comparing two operational modes: a direct mode, in which the polymers are grafted on the hot wall and exposed to the vapor phase. In the inverse mode, the wall temperatures are swapped and the fluid rearranges to adapt to the interchanged temperature gradient. We calculate the mean heat flow, number density and temperature profiles for the stationary state in both modes. From them, we computed the density and temperature profiles, heat rectification coefficient, and resistivity profiles, for the two studied extreme cases of polymer bending rigidity. We found that, the nano-chamber presents a significant degree of heat rectification with different characteristics and filling density ranges. We describe the conditions to be met to obtain high thermal rectification as regards fluid filling, polymer properties and fluid-polymer affinity. They can be fine-tuned according to the application or material availability. In the direction parallel to the walls the system is easily scalable towards macroscopic sizes, without affecting the thermal rectification. This makes the soft-diode mechanism very versatile in geometry, size and materials choice.", "url": "https://arxiv.org/abs/2609.16371", "type": "理论+数值", "summary": "我们利用分子动力学模拟探索了限制在纳米室中的两相流体的热整流特性，该纳米室的一个壁涂有末端接枝聚合物。我们发现各种腔室填充物对于非常坚硬和完全柔性的聚合物都具有显着的热二极管效应。通过将壁固定在两个不同的温度，计算热流作为填充密度的函数，对系统施加固定热通量。流体呈现出靠近冷壁的液相，并且对于许多填充物而言，呈现出与热壁接触的气相。还存在蒸气-液体界面，并且其距壁的距离不同，具体取决于流体填充。我们通过比较两种操作模式来研究该系统：直接模式，其中聚合物接枝在热壁上并暴露于气相。在逆模式中，壁温被交换，流体重新排列以适应交换的温度梯度。我们计算两种模式下稳态的平均热流、数密度和温度分布。\n\n根据它们，我们计算了两个研究的聚合物弯曲刚度极端情况的密度和温度分布、热整流系数和电阻率分布。我们发现，纳米室呈现出显着程度的热整流，具有不同的特性和填充密度范围。我们描述了在流体填充、聚合物性能和流体-聚合物亲和力方面获得高热整流所需满足的条件。它们可以根据应用或材料可用性进行微调。在平行于壁的方向上，系统可以轻松地扩展到宏观尺寸，而不影响热整流。这使得软二极管机构在几何形状、尺寸和材料选择方面非常通用。", "authors": [{"name": "Claudio Pastorino"}, {"name": "Alejandro Monastra"}, {"name": "Florencia Carusela"}], "featured_authors": [{"name": "Claudio Pastorino"}, {"name": "Alejandro Monastra"}, {"name": "Florencia Carusela"}], "author_count": 3}, {"id": "2609.16438", "category": "cond-mat", "title": "Analytical solutions to the non-equilibrium Green's functions in large-$q$ SYK models", "abstract": "It is known that the Sachdev-Ye-Kitaev (SYK) model is exactly solvable at leading order in $1/q$; specifically, the instantaneously thermal time block after the quench is known in closed form. Thus far the remaining (inherently out of equilibrium) blocks have only been numerically accessible. Here we provide their analytical solutions for a quench between non-commuting $q/2$-body SYK Hamiltonians. We obtain the Green's functions in closed form for every time block. We extract a simple relation between the pre- and post-quench energies $\\epsilon_1 \\propto \\epsilon_0$ leading to an exact temperature update rule. Via a Cauchy-Schwarz inequality, we show that heating is inevitable for the closed system; hence, the second law emerges geometrically. The solution is used in a companion paper to address what ``instantaneous thermalization'' means at finite $q$.", "url": "https://arxiv.org/abs/2609.16438", "type": "理论+数值", "summary": "众所周知，Sachdev-Ye-Kitaev (SYK) 模型在 $1/q$ 的首阶上完全可解；具体而言，淬火后的瞬时热时间块以封闭形式已知。到目前为止，剩余的（本质上不平衡的）块只能通过数字方式访问。在这里，我们提供了非通勤 $q/2$-body SYK 哈密顿量之间失超的解析解。我们获得每个时间块的闭合形式的格林函数。我们提取淬火前和淬火后能量 $\\epsilon_1 \\propto \\epsilon_0$ 之间的简单关系，从而得出精确的温度更新规则。通过柯西-施瓦茨不等式，我们证明了封闭系统的加热是不可避免的；因此，第二定律以几何形式出现。该解决方案在配套论文中用于解决有限 $q$ 下“瞬时热化”的含义。", "authors": [{"name": "Jan C. Louw"}], "featured_authors": [{"name": "Jan C. Louw"}], "author_count": 1}, {"id": "2609.16441", "category": "cond-mat", "title": "Full Minimal Coupling All-Electron Real-Time TDDFT for X-Ray-Matter Interactions", "abstract": "Standard real-time time-dependent density functional theory (RT-TDDFT) couples light to matter through a spatially uniform (dipole) vector potential, an approximation that breaks down in the X-ray regime, where the photon wavelength approaches interatomic scales. We present an all-electron, numeric-atom-centered-orbital implementation of full minimal coupling in FHI-aims that retains the spatial structure of the vector potential in both the paramagnetic and diamagnetic couplings, implements a reciprocal-space-resolved current diagnostic, and extends the propagation to periodic systems through a perturbative photon-momentum sideband coupling that recovers the density response at the photon wavevector. Four benchmarks ranging in energy from 100 eV to 5 keV validate the implementation and exercise its reach. The retained photon momentum proves physically consequential throughout, from measurable beyond dipole corrections to the enabling of channels forbidden in the dipole limit. On an all-electron footing, the implementation lays the groundwork for a general ab initio treatment of X-ray light-matter interaction across molecules, surfaces, and solids.", "url": "https://arxiv.org/abs/2609.16441", "type": "理论+数值", "summary": "标准实时时间相关密度泛函理论 (RT-TDDFT) 通过空间均匀（偶极）矢量势将光与物质耦合，这是一种在 X 射线范围内分解的近似值，其中光子波长接近原子间尺度。我们提出了 FHI 目标中完全最小耦合的全电子、数字原子中心轨道实现，它保留了顺磁和反磁耦合中矢量势的空间结构，实现了倒易空间分辨电流诊断，并通过微扰光子动量边带耦合将传播扩展到周期系统，恢复了光子波矢的密度响应。能量范围从 100 eV 到 5 keV 的四个基准验证了实施并发挥了其影响力。事实证明，保留的光子动量在整个过程中都具有物理意义，从可测量的偶极校正之外到启用偶极极限中禁止的通道。在全电子的基础上，该实现为跨分子、表面和固体的 X 射线光-物质相互作用的一般从头计算处理奠定了基础。", "authors": [{"name": "Daniel Schacher"}, {"name": "Tod A. Pascal"}, {"name": "Craig P. Schwartz"}, {"name": "Keith V. Lawler"}], "featured_authors": [{"name": "Daniel Schacher"}, {"name": "Tod A. Pascal"}, {"name": "Craig P. Schwartz"}, {"name": "Keith V. Lawler"}], "author_count": 4}, {"id": "2609.16466", "category": "cond-mat", "title": "Scaling LLM Agents for Materials Design through Hierarchical Collective Reasoning", "abstract": "Materials design must reconcile competing functional requirements with stability and synthesis constraints. Generative models can produce stable, novel crystals, but accommodating detailed natural-language design instructions remains challenging. Here we introduce HiMatGen, a framework for scaling large language model agents through hierarchical collective reasoning. Built from GPT-5.6 Terra, HiMatGen connects 100 investigators in discussion pods across ten scientific domains with tool-enabled domain representatives. Representatives investigate proposals, exchange evidence across domains and return findings and unresolved questions to their pods. This bidirectional exchange turns specialist disagreements into structural revisions and alternative designs. Across six chemical systems, HiMatGen produces 1.9 times as many final crystal candidates and 1.7 times as many stable, unique and novel (SUN) structures as a tool-enabled GPT-6 Astra single-agent baseline. In property-directed tasks, the complete HiMatGen workflow outperforms same-model single-agent and independent-generation controls. Comparisons with MatterGen and Chemeleon2 demonstrate its ability to develop diverse crystals satisfying joint functional and chemical requirements. In a paired comparison initialized from the same proposals, hierarchical discussion reduces debate-stage token usage by a factor of 22 relative to full debate. HiMatGen provides an approach to materials design that sustains the exchange of scientific knowledge and computational evidence throughout iterative exploration as the agent population grows.", "url": "https://arxiv.org/abs/2609.16466", "type": "理论+数值", "summary": "材料设计必须协调相互竞争的功能要求与稳定性和合成限制。生成模型可以生产稳定、新颖的晶体，但适应详细的自然语言设计指令仍然具有挑战性。在这里，我们介绍 HiMatGen，一个通过分层集体推理扩展大型语言模型代理的框架。 HiMatGen 基于 GPT-5.6 Terra 构建，将十个科学领域的讨论池中的 100 名研究人员与支持工具的领域代表联系起来。代表们调查提案，跨领域交换证据，并将调查结果和未解决的问题返回给他们的小组。这种双向交流将专家的分歧转化为结构修改和替代设计。在六个化学系统中，HiMatGen 产生的最终候选晶体数量是工具支持的 GPT-6 Astra 单剂基线的 1.9 倍，稳定、独特和新颖 (SUN) 结构的数量是工具支持的 GPT-6 Astra 单剂基线的 1.7 倍。在属性导向的任务中，完整的 HiMatGen 工作流程优于同模型单代理和独立生成控制。\n\n与 MatterGen 和 Chemeleon2 的比较证明了其开发满足联合功能和化学要求的多种晶体的能力。在从相同提案初始化的配对比较中，分层讨论相对于完整辩论将辩论阶段令牌的使用减少了 22 倍。 HiMatGen 提供了一种材料设计方法，随着智能体数量的增长，在整个迭代探索过程中维持科学知识和计算证据的交换。", "authors": [{"name": "Jaehwan Choi"}, {"name": "Yousung Jung"}], "featured_authors": [{"name": "Jaehwan Choi"}, {"name": "Yousung Jung"}], "author_count": 2}, {"id": "2609.16483", "category": "cond-mat", "title": "Entropy-driven transitions between extended integer and fractional quantum Hall regimes", "abstract": "Electronic states with coexisting Wigner-crystal order can sometimes exhibit a quantum Hall effect over a finite range of electron densities---i.e., exhibit ``extended'' quantum Hall (QH) plateaus in the absence of disorder. Such an extended quantum Hall state can then compete with other QH states over the same density range, allowing a first-order thermal transition between them. Here, we analyze several settings in which the entropy associated with Goldstone modes (e.g., magnons or phonons) or soft gapped modes (e.g., magnetoroton) drives a finite-temperature transition between competing QH regimes. Applying this framework to moiré rhombohedral graphene, we argue that a soft magnetoroton in a fractional quantum anomalous Hall state provides a plausible bulk mechanism for the observed thermal evolution from an extended integer QH to a fractional QH regime.", "url": "https://arxiv.org/abs/2609.16483", "type": "理论", "summary": "具有共存维格纳晶序的电子态有时可以在有限的电子密度范围内表现出量子霍尔效应，即在没有无序的情况下表现出“扩展”的量子霍尔（QH）平台。这种扩展的量子霍尔态可以与相同密度范围内的其他量子霍尔态竞争，从而允许它们之间发生一阶热转变。在这里，我们分析了与戈德斯通模式（例如磁振子或声子）或软间隙模式（例如磁子）相关的熵驱动竞争 QH 状态之间的有限温度转变的几种设置。将此框架应用于莫尔菱形石墨烯，我们认为分数量子反常霍尔态的软磁转子为观察到的从扩展整数 QH 到分数 QH 状态的热演化提供了一种合理的体机制。", "authors": [{"name": "Kyung-Su Kim"}, {"name": "Steven A. Kivelson"}], "featured_authors": [{"name": "Kyung-Su Kim"}, {"name": "Steven A. Kivelson"}], "author_count": 2}, {"id": "2609.16506", "category": "cond-mat", "title": "Unsupervised Machine Learning of the Contact Process", "abstract": "We investigate how unsupervised machine-learning methods can characterize the active-absorbing phase transition in the contact process in one and two spatial dimensions. Our analysis focuses on principal component analysis (PCA) and variational autoencoders (VAEs), and we show that direct applications of these methods encounter a central difficulty: contact process configurations are intrinsically positive-definite. In the PCA case, standard centering procedures fail to isolate the order parameter in the leading component. To address this, we augment the data with sign-reversed configurations, creating a balanced dataset with zero mean while preserving the density information required to describe the transition. This preprocessing allows the dominant principal component to recover the order parameter and reproduce the expected finite-size scaling near criticality. For VAEs, we find a related limitation: a fixed Gaussian prior does not provide sufficient latent regularization across the full range of control parameters and system sizes for positive-definite data. We overcome this by adopting a heteroscedastic Gaussian prior that adapts to the control parameter, leading to a substantial improvement in the finite-size scaling of reconstruction-based observables near the critical threshold. Taken together, these results highlight a key lesson: the success of machine learning in phase-transition problems does not rely on algorithmic complexity alone, but on tailoring the representation to respect the physical structure of the system, including its intrinsic constraints and symmetries.", "url": "https://arxiv.org/abs/2609.16506", "type": "理论+数值", "summary": "我们研究无监督机器学习方法如何在一维和二维空间维度上表征接触过程中的主动吸收相变。我们的分析重点是主成分分析（PCA）和变分自动编码器（VAE），我们表明这些方法的直接应用遇到了一个中心困难：接触过程配置本质上是正定的。在 PCA 情况下，标准居中程序无法隔离主导组件中的阶次参数。为了解决这个问题，我们使用符号反转配置来扩充数据，创建一个均值为零的平衡数据集，同时保留描述转变所需的密度信息。这种预处理允许主导主成分恢复阶次参数并再现接近临界点的预期有限尺寸缩放。对于 VAE，我们发现了一个相关的限制：固定的高斯先验不能为正定数据的整个控制参数和系统规模提供足够的潜在正则化。\n\n我们通过采用适应控制参数的异方差高斯先验克服了这个问题，从而在临界阈值附近基于重建的可观测量的有限尺寸缩放方面取得了实质性的改进。总而言之，这些结果凸显了一个重要的教训：机器学习在相变问题中的成功不仅仅依赖于算法的复杂性，而是依赖于定制表示以尊重系统的物理结构，包括其内在的约束和对称性。", "authors": [{"name": "L. T. Brito"}, {"name": "G. A. Alves"}, {"name": "F. W. S. Lima"}, {"name": "A. Macedo-Filho"}, {"name": "R. S. Ferreira"}, {"name": "T. F. A. Alves"}], "featured_authors": [{"name": "L. T. Brito"}, {"name": "G. A. Alves"}, {"name": "F. W. S. Lima"}, {"name": "A. Macedo-Filho"}, {"name": "R. S. Ferreira"}, {"name": "T. F. A. Alves"}], "author_count": 6}, {"id": "2609.16526", "category": "cond-mat", "title": "Symbolic Ensemble Learning Enables Discovery of Fast Accurate Physics-Based Interatomic Potentials", "abstract": "Machine learning has transformed materials simulation by delivering force fields with ab initio accuracy, yet bridging the gap between high-dimensional regression and physical interpretability remains a grand challenge. Conventional analytical potentials offer transparency but often fail to capture the complexity of far-from-ground state regimes. Here, we introduce a hybrid symbolic-neural framework that unifies the interpretability of the Embedded Atom Method (EAM) with the adaptability of data-driven learning. Using Equation Learner Neural Networks (EqNNs) trained on density functional theory (DFT) data, we obtain interpretable models for aluminum through three distinct training protocols: random initialization trained via Monte Carlo Tree Search (MCTS) and gradient descent, and two transfer-learning strategies initialized from a copper potential - one employing MCTS followed by gradient descent, and the other using gradient descent only. We find that while all three resulting symbolic models achieve sub-10 meV/atom accuracy, they occupy distinct local minima in the functional landscape, exhibiting complementary trade-offs across phonon dispersion, surface energetics, and elastic response. By integrating these diverse functional forms through a weighted symbolic ensemble, we derive a composite potential that surpasses the fidelity of its constituent models. The resulting ensemble effectively mitigates individual biases, delivering superior consistency with DFT benchmarks across equation-of-state curvature, phonon spectra, and melting dynamics. This approach demonstrates that combining transfer learning with ensemble symbolic regression yields compact, transparent potentials capable of robust prediction across equilibrium and non-equilibrium states.", "url": "https://arxiv.org/abs/2609.16526", "type": "理论+数值", "summary": "机器学习通过从头开始精确地提供力场，改变了材料模拟，但弥合高维回归和物理可解释性之间的差距仍然是一个巨大的挑战。传统的分析潜力提供了透明度，但往往无法捕捉到远离地面的国家政权的复杂性。在这里，我们引入了一种混合符号神经框架，它将嵌入式原子方法（EAM）的可解释性与数据驱动学习的适应性结合起来。使用在密度泛函理论 (DFT) 数据上训练的方程学习器神经网络 (EqNN)，我们通过三种不同的训练协议获得铝的可解释模型：通过蒙特卡罗树搜索 (MCTS) 和梯度下降训练的随机初始化，以及从铜势初始化的两种迁移学习策略 - 一种采用 MCTS，然后采用梯度下降，另一种仅使用梯度下降。\n\n我们发现，虽然所有三个由此产生的符号模型都达到了低于 10 meV/原子的精度，但它们在功能景观中占据了明显的局部最小值，在声子色散、表面能量和弹性响应方面表现出互补的权衡。通过加权符号集合整合这些不同的功能形式，我们得出了超越其组成模型保真度的复合潜力。由此产生的系综有效地减轻了个体偏差，在状态方程曲率、声子谱和熔化动力学方面与 DFT 基准保持了卓越的一致性。这种方法表明，将迁移学习与集成符号回归相结合可以产生紧凑、透明的势，能够在平衡和非平衡状态下进行稳健的预测。", "authors": [{"name": "Bilvin Varughese"}, {"name": "Aditya Koneru"}, {"name": "Adil Muhammad"}, {"name": "Troy D. Loeffler"}, {"name": "Sukriti Manna"}, {"name": "Jan Michael Y. Carrillo"}, {"name": "Orcun Yildiz"}, {"name": "Thomas Peterka"}, {"name": "Subramanian K.R.S. Sankaranarayanan"}], "featured_authors": [{"name": "Bilvin Varughese"}, {"name": "Aditya Koneru"}, {"name": "Adil Muhammad"}, {"name": "Orcun Yildiz"}, {"name": "Thomas Peterka"}, {"name": "Subramanian K.R.S. Sankaranarayanan"}], "author_count": 9}, {"id": "2609.16530", "category": "cond-mat", "title": "Orbital-resolved superexchange and topological magnon bands in MXene Fe$_2$C", "abstract": "Magnetic MXenes are promising candidates for future spintronics due to their intriguing properties. Nevertheless, the topological properties of magnon bands and superexchange mechanism remain relatively underexplored. In this work, we have calculated the spin wave dispersions for MXene Fe$_2$C using the linear spin wave method, with the exchange coupling parameters obtained from first-principles calculations. Owing to the staggered stacking of two Fe sub-lattices, the interlayer exchange coupling lifts the degeneracy of the ferromagnetic magnon modes. A Dirac point is identified in the magnon bands at the $K$ point. The topological properties of magnon bands, including Berry curvature, valley Chern number and edge states, are further computed by means of a two-band model. We also derive an effective Hamiltonian to explain the magnonic topology, which is protected by the $C_{3v}$ rotational symmetry. To understand the microscopic origin of the exchange couplings that govern the magnon bands, we then construct a refined model integrating perturbation theory and the tight-binding approach. The ferromagnetic superexchange coupling is mediated by the virtual hopping between the d orbitals of two distinct Fe sites via a pair of orthogonal p orbitals at the bridging C site. In detail, the intralayer exchange coupling is governed by the in-plane $p_x$ and $p_y$ orbitals, while the out-of-plane $p_z$ orbital is responsible for the interlayer exchange coupling. Our results establish a direct link between the orbital-resolved anisotropic superexchange and topological properties of the magnon bands in magnetic MXene Fe$_2$C, providing theoretical guidance for future spintronics applications.", "url": "https://arxiv.org/abs/2609.16530", "type": "理论+数值", "summary": "磁性 MXene 因其有趣的特性而成为未来自旋电子学的有希望的候选者。然而，磁振子带的拓扑性质和超交换机制仍然相对未得到充分研究。在这项工作中，我们使用线性自旋波方法计算了 MXene Fe$_2$C 的自旋波色散，并通过第一性原理计算获得了交换耦合参数。由于两个Fe子晶格的交错堆叠，层间交换耦合提高了铁磁磁振子模式的简并性。狄拉克点在 $K$ 点的磁振子带中被识别。磁振子带的拓扑性质，包括贝里曲率、谷陈数和边缘态，通过二能带模型进一步计算。我们还推导了一个有效的哈密顿量来解释波角拓扑，它受到 $C_{3v}$ 旋转对称性的保护。为了了解控制磁振子带的交换耦合的微观起源，我们构建了一个集成微扰理论和紧束缚方法的精细模型。\n\n铁磁超交换耦合是由两个不同 Fe 位点的 d 轨道之间通过桥接 C 位点的一对正交 p 轨道之间的虚拟跳跃介导的。具体来说，层内交换耦合由面内$p_x$和$p_y$轨道控制，而面外$p_z$轨道则负责层间交换耦合。我们的结果在磁性 MXene Fe$_2$C 中的轨道分辨各向异性超交换和磁振子带的拓扑性质之间建立了直接联系，为未来的自旋电子学应用提供了理论指导。", "authors": [{"name": "Qiang Gao"}, {"name": "Wei Wang"}, {"name": "Shaojin Qi"}, {"name": "Guimei Shi"}, {"name": "Anbang Guo"}, {"name": "Xin Jin"}, {"name": "Chen Shen"}, {"name": "Xing-Qiu Chen"}], "featured_authors": [{"name": "Qiang Gao"}, {"name": "Wei Wang"}, {"name": "Shaojin Qi"}, {"name": "Xin Jin"}, {"name": "Chen Shen"}, {"name": "Xing-Qiu Chen"}], "author_count": 8}, {"id": "2609.16559", "category": "cond-mat", "title": "Diffusivity in Dissipative Quantum Transport from an Exactly Solvable Krylov Chain", "abstract": "The computation of transport coefficients in interacting quantum many-body systems is rarely analytically accessible. Here, we develop a new Krylov-space mechanism that makes the leading density dependent correction to Green-Kubo diffusivity \\emph{exactly} calculable in the strong-dissipation regime of a one-dimensional noisy spin-$\\frac{1}{2}$ XXZ chain. This is done by showing that the density-polarization-dressed bond coherence generates a Krylov subspace where repeated action of the dissipator closes exactly on an explicitly identifiable operator family. Within this subspace, the dissipative dynamics is then mapped onto a self-similar semi-infinite chain with a boundary defect. Surprisingly, \\emph{all} Lanczos coefficients of the Krylov chain and its boundary Green's function can be determined exactly. The latter then determines the exact leading density-dependent correction to the diffusivity. Finally, we calculate analytically the full boundary-to-bulk Green's function and find that it decays exponentially along the emergent Krylov chain.", "url": "https://arxiv.org/abs/2609.16559", "type": "理论", "summary": "相互作用的量子多体系统中输运系数的计算很少能够通过分析进行。在这里，我们开发了一种新的 Krylov 空间机制，该机制使得对 Green-Kubo 扩散率 \\emph{exact} 的主要密度相关校正可以在一维噪声自旋 $\\frac{1}{2}$ XXZ 链的强耗散区域中计算。这是通过证明密度极化修饰的键相干性生成一个克雷洛夫子空间来完成的，其中耗散器的重复作用精确地闭合在一个明确可识别的算子族上。在这个子空间内，耗散动力学被映射到具有边界缺陷的自相似半无限链上。令人惊讶的是，克雷洛夫链的 \\emph{all} Lanczos 系数及其边界格林函数可以被精确确定。然后，后者确定对扩散率的精确的领先密度相关校正。最后，我们分析计算了完整的边界到体格格林函数，发现它沿着涌现的克雷洛夫链呈指数衰减。", "authors": [{"name": "Zhi-Li Zhou"}, {"name": "Jorge Noronha"}], "featured_authors": [{"name": "Zhi-Li Zhou"}, {"name": "Jorge Noronha"}], "author_count": 2}, {"id": "2609.16583", "category": "cond-mat", "title": "Adsorbing Boundaries Stratify the Kinetics of Confined Colloidal Phase Separation", "abstract": "Phase separation in network-forming materials couples mass transport to mechanical relaxation, yet how adsorbing boundaries reshape this coupling remains unclear. We compare fluid-particle-dynamics simulations resolving solvent hydrodynamics with free-draining Brownian dynamics for attractive colloids confined between parallel walls. Adsorbing boundaries do not slow coarsening uniformly but stratify the network into spatially distinct kinetic regimes. With hydrodynamics, the self-similar central network exhibits growth consistent with poroelastic relaxation, Lb~t^(1/2), whereas the adsorbed region follows an effective Lw~t^(1/3) law. In free-draining dynamics, central coarsening approaches t^(1/3), while the boundary exponent remains time dependent over the accessible times. Direction-resolved displacements reveal suppressed wall-normal motion and reduced lateral mobility near the walls. Increasing wall attraction connects adsorbed islands into an extended layer while leaving local dense-phase packing nearly unchanged. For island-like domains, we propose a testable encounter-controlled scaling framework linking boundary growth to domain geometry, size-dependent mobility, and evolving adsorbed mass. Locally self-similar central coarsening thus coexists with distinct or nonstationary boundary kinetics, precluding a common dynamic-scaling length for the central and adsorbed regions over the accessible times; in both regions, the growth law depends on whether solvent hydrodynamics is resolved.", "url": "https://arxiv.org/abs/2609.16583", "type": "理论+数值", "summary": "网络形成材料中的相分离将质量传递与机械弛豫耦合起来，但吸附边界如何重塑这种耦合仍不清楚。我们将解决溶剂流体动力学的流体粒子动力学模拟与限制在平行壁之间的有吸引力的胶体的自由排水布朗动力学进行比较。吸附边界不会均匀地减缓粗化，而是将网络分层为空间上不同的动力学状态。根据流体动力学，自相似中心网络表现出与多孔弹性松弛Lb~t^(1/2)一致的生长，而吸附区域遵循有效的Lw~t^(1/3)定律。在自由排水动力学中，中心粗化接近 t^(1/3)，而边界指数仍然依赖于可访问时间。方向解析位移揭示了壁法向运动受到抑制，并且壁附近的横向移动性降低。增加的壁吸引力将吸附岛连接成延伸层，同时使局部密相堆积几乎不变。\n\n对于岛状域，我们提出了一种可测试的遭遇控制缩放框架，将边界增长与域几何形状、尺寸相关的迁移率和不断变化的吸附质量联系起来。因此，局部自相似的中心粗化与不同的或非平稳的边界动力学共存，排除了可访问时间内中心区域和吸附区域的共同动态缩放长度；在这两个区域中，生长定律取决于溶剂流体动力学是否得到解决。", "authors": [{"name": "Kui Lin"}, {"name": "Haiming Lu"}], "featured_authors": [{"name": "Kui Lin"}, {"name": "Haiming Lu"}], "author_count": 2}, {"id": "2609.16587", "category": "cond-mat", "title": "Hartree-Fock Density-Matrix Renormalization Group for Very Long Chains", "abstract": "We formulate Hartree--Fock as a density-matrix renormalization group (DMRG) sweep of a single Slater determinant, assuming a density--density electron--electron interaction. We compress the occupied state and long-range interaction separately, reducing each sweep step to a small local Fock problem. Exchange is retained throughout. Uniform antiferromagnetic hydrogen chains provide an almost ideal setting for this approach, while retaining the Coulomb interaction and its $1/r$ tail. We initialize and converge a chain of 100,000 electrons in 1.8 million spatial basis functions in about two hours on a 64-GB Mac mini, using less than a third of its memory. The work per sweep is nearly proportional to chain length, and the number of sweeps needed for convergence changes little from 1000 to 100,000 atoms. DMRG's compression of states and environments thus makes large HF calculations with long-range Hartree and exchange practical on an ordinary desktop computer.", "url": "https://arxiv.org/abs/2609.16587", "type": "理论+数值", "summary": "我们将 Hartree--Fock 公式化为单个 Slater 行列式的密度矩阵重正化群 (DMRG) 扫描，假设密度-密度电子-电子相互作用。我们分别压缩占用状态和远程交互，将每个扫描步骤减少为一个小的局部 Fock 问题。交换始终保留。均匀的反铁磁氢链为这种方法提供了几乎理想的设置，同时保留了库仑相互作用及其 $1/r$ 尾部。我们在 64 GB Mac mini 上用不到三分之一的内存在大约两个小时内初始化并聚合了 180 万个空间基础函数中的 100,000 个电子链。每次扫描的功几乎与链长成正比，并且收敛所需的扫描次数在 1000 到 100,000 个原子之间几乎没有变化。因此，DMRG 对状态和环境的压缩使得远程 Hartree 的大型 HF 计算和交换在普通台式计算机上变得可行。", "authors": [{"name": "Steven R. White"}], "featured_authors": [{"name": "Steven R. White"}], "author_count": 1}, {"id": "2609.16649", "category": "cond-mat", "title": "Total-energy-assisted Tight-binding Method Based on Density Functional Theory - Design Principles toward Transferability and Extrapolation", "abstract": "The previously proposed tight-binding method derived from the total energy has been extended within the local density approximation (TE-TB method; J. Phys. Soc. Jpn. 87, 064802 (2018)). Unlike the earlier two-parameter formulation, the present method introduces three parameters. These parameters explicitly capture local packing effects and improve transferability. Furthermore, based on physical considerations, several boundary conditions (inductive bias) are imposed on the functionals defining the tight-binding Hamiltonian and related energy functionals. The revised formalism is tested on crystalline silicon to assess the stability of the diamond structure, a monovacancy, and the (001) surface. These benchmark tests demonstrate the high transferability and reliability of the present three-parameter TE-TB design philosophy.", "url": "https://arxiv.org/abs/2609.16649", "type": "理论+数值", "summary": "先前提出的从总能量导出的紧束缚方法已在局域密度近似内扩展（TE-TB 方法；J. Phys. Soc. Jpn. 87, 064802 (2018)）。与早期的二参数公式不同，本方法引入了三个参数。这些参数明确捕获局部堆积效应并提高可转移性。此外，基于物理考虑，对定义紧束缚哈密顿量和相关能量泛函的泛函施加了几个边界条件（归纳偏差）。修改后的形式在晶体硅上进行了测试，以评估金刚石结构、单空位和 (001) 表面的稳定性。这些基准测试证明了当前三参数 TE-TB 设计理念的高可移植性和可靠性。", "authors": [{"name": "Takeo Fujiwara"}, {"name": "Yoshiro Nohara"}, {"name": "Susumu Yamamoto"}], "featured_authors": [{"name": "Takeo Fujiwara"}, {"name": "Yoshiro Nohara"}, {"name": "Susumu Yamamoto"}], "author_count": 3}, {"id": "2609.16780", "category": "cond-mat", "title": "Topological spin textures in 2D altermagnetic chromium chalcogenides: Interplay between magnetic frustration and Dzyaloshinskii-Moriya interaction", "abstract": "Altermagnetism has recently emerged as a distinct magnetic paradigm, yet the exploration of topological spin textures within two-dimensional (2D) altermagnets remains limited. Using first-principles calculations and atomistic spin simulations, we investigate monolayer $\\mathrm{Cr_2X_2}$ and Janus monolayer $\\mathrm{Cr_2XY}$ altermagnets ($\\mathrm{X, Y}=\\mathrm{O, S, Se, Te}$, and $\\mathrm{X \\neq Y}$). Both systems exhibit strong intrinsic exchange frustration arising from competition between nearest-neighbor and further-neighbor exchange interactions. In Janus $\\mathrm{Cr_2XY}$, breaking the out-of-plane mirror symmetry additionally activates a substantial in-plane Dzyaloshinskii-Moriya interaction (DMI), mediated by the strong spin-orbit coupling of heavy chalcogen ligands. The interplay between exchange frustration and DMI gives rise to distinct frustration- and DMI-dominated regimes, while magnetic anisotropy determines the preferred spin orientation, leading to a diverse range of non-collinear states. Systematic phase-space scans and geodesic nudged elastic band (GNEB) calculations reveal two distinct mechanisms governing this interplay: a synergistic effect, in which frustration lowers the critical DMI for the onset of non-collinear states, and a competitive effect, in which frustration favors high-topological-charge states while DMI favors low-charge states. Our results establish a general framework for understanding the interplay between frustration and DMI and guiding the design of topological spin textures in two-dimensional altermagnets.", "url": "https://arxiv.org/abs/2609.16780", "type": "理论+数值", "summary": "交变磁性最近已成为一种独特的磁范式，但对二维 (2D) 交变磁体中的拓扑自旋纹理的探索仍然有限。利用第一原理计算和原子自旋模拟，我们研究了单层 $\\mathrm{Cr_2X_2}$ 和 Janus 单层 $\\mathrm{Cr_2XY}$ 交替磁体 ($\\mathrm{X, Y}=\\mathrm{O, S, Se, Te}$ 和 $\\mathrm{X \\neq Y}$)。这两个系统都表现出由最近邻居和更远邻居交换交互之间的竞争引起的强烈的内在交换挫败感。在 Janus $\\mathrm{Cr_2XY}$ 中，打破面外镜像对称性还激活了实质的面内 Dzyaloshinskii-Moriya 相互作用（DMI），这是由重硫族配体的强自旋轨道耦合介导的。交换挫败和 DMI 之间的相互作用产生了明显的挫败和 DMI 主导的状态，而磁各向异性决定了首选自旋方向，导致了各种非共线状态。\n\n系统相空间扫描和测地微移弹性带（GNEB）计算揭示了控制这种相互作用的两种不同机制：协同效应，其中挫败感降低了非共线态开始的临界DMI；以及竞争效应，其中挫败感有利于高拓扑电荷态，而DMI有利于低电荷态。我们的研究结果建立了一个通用框架，用于理解挫折和 DMI 之间的相互作用，并指导二维交替磁体中拓扑自旋纹理的设计。", "authors": [{"name": "Zirui Zhang"}, {"name": "Shiwei Zhu"}, {"name": "Ruixiao Ma"}, {"name": "Qiuyao Zhang"}, {"name": "Xiaoping Wu"}, {"name": "Changsheng Song"}], "featured_authors": [{"name": "Zirui Zhang"}, {"name": "Shiwei Zhu"}, {"name": "Ruixiao Ma"}, {"name": "Qiuyao Zhang"}, {"name": "Xiaoping Wu"}, {"name": "Changsheng Song"}], "author_count": 6}, {"id": "2609.16802", "category": "cond-mat", "title": "ZStar: An automated toolkit for polarization, Born effective charges, dielectric response, and infrared and Raman spectra calculations", "abstract": "Born effective charges (BEC) link atomic displacements to polarization, connecting lattice vibrations to dielectric response and infrared activity. We present ZStar, an open-source Python toolkit that automates calculations of polarization, BEC, phonons, static and frequency-dependent dielectric response, and infrared and Raman spectra. ZStar supports calculations across all dimensionalities, including bulk crystals, two-dimensional materials, one-dimensional structures, and molecules, through an integrated workflow spanning input preparation, execution, and response analysis. Berry-phase polarization and real-space dipoles describe responses along periodic and open directions, respectively. Our unified, symmetry-adapted finite-displacement framework jointly determines BEC and zone-center force constants from the same calculations, improving computational efficiency while preserving numerical accuracy. Reusing the electronic Hamiltonian in the ABACUS+PYATB route enables Raman calculations without additional self-consistent calculations. Reproducible examples and a packaged agent skill support conventional and agent-assisted use. ZStar enables efficient, automated exploration of polarization, BEC, dielectric response, and vibrational spectra across all dimensionalities.", "url": "https://arxiv.org/abs/2609.16802", "type": "理论+数值", "summary": "玻恩有效电荷 (BEC) 将原子位移与极化联系起来，将晶格振动与介电响应和红外活动联系起来。我们推出了 ZStar，这是一个开源 Python 工具包，可自动计算偏振、BEC、声子、静态和频率相关介电响应以及红外和拉曼光谱。 ZStar 通过涵盖输入准备、执行和响应分析的集成工作流程，支持跨所有维度的计算，包括块状晶体、二维材料、一维结构和分子。贝里相偏振和实空间偶极子分别描述沿周期性和开放方向的响应。我们统一的对称自适应有限位移框架通过相同的计算共同确定 BEC 和区域中心力常数，从而提高计算效率，同时保持数值精度。在ABACUS+PYATB路线中重复使用电子哈密顿量可以实现拉曼计算，而无需额外的自洽计算。可重复的示例和打包的代理技能支持常规和代理辅助使用。\n\nZStar 能够高效、自动地探索所有维度的偏振、BEC、介电响应和振动光谱。", "authors": [{"name": "Xudong Zhu"}, {"name": "Junhong Li"}, {"name": "Gan Jin"}, {"name": "Zheng Guan"}, {"name": "Lixin He"}], "featured_authors": [{"name": "Xudong Zhu"}, {"name": "Junhong Li"}, {"name": "Gan Jin"}, {"name": "Zheng Guan"}, {"name": "Lixin He"}], "author_count": 5}, {"id": "2609.16821", "category": "cond-mat", "title": "Odd diffusion and power-law correlations in chiral mass-transport processes", "abstract": "We study mass-conserving Markov jump processes on a square lattice, where masses hop with a preferred rotational sense, thus breaking both time-reversal and mirror symmetries. We consider closed systems with both periodic and open (reflecting) boundaries, the latter supporting a steady-state edge current. We show that odd diffusion, arising from the chiral transport, generically provides a mechanism for the emergence of scale-invariant two-point density correlations in nonequilibrium steady states even in the presence of lattice rotation symmetry -- a mechanism that is qualitatively distinct from the well-known mechanism of anisotropic hopping. We exactly calculate the steady-state equal-time density-density correlations, which exhibit an algebraic decay, $C(\\mathbf{r}) \\sim |\\mathbf{r}|^{-4}$ for $|\\mathbf{r}| \\gg 1$. This algebraic behavior results from the interplay between the off-diagonal components of the diffusion and mobility tensors, demonstrating that chiral transport alone can generate power-law correlations in isotropic driven systems. Remarkably, the structure factor in the zero-wavenumber limit and the amplitude of the power laws depend nontrivially on chirality. While increasing chirality initially suppresses large-scale density fluctuations, the fluctuations beyond a threshold odd-diffusion strength vary nonmonotonically with chirality and develop a cusp singularity.", "url": "https://arxiv.org/abs/2609.16821", "type": "理论", "summary": "我们研究了方晶格上的质量守恒马尔可夫跳跃过程，其中质量以首选旋转方向跳跃，从而打破了时间反转和镜像对称。我们考虑具有周期性和开放（反射）边界的封闭系统，后者支持稳态边缘电流。我们表明，由手性输运产生的奇扩散通常提供了一种在非平衡稳态中出现尺度不变的两点密度相关性的机制，即使存在晶格旋转对称性，这种机制在质量上不同于众所周知的各向异性跳跃机制。我们精确地计算了稳态等时间密度-密度相关性，它表现出代数衰减，$C(\\mathbf{r}) \\sim |\\mathbf{r}|^{-4}$ for $|\\mathbf{r}| \\gg 1$。这种代数行为是由扩散张量和迁移张量的非对角分量之间的相互作用产生的，表明仅手性输运就可以在各向同性驱动系统中产生幂律相关性。值得注意的是，零波数极限中的结构因子和幂律的振幅在很大程度上取决于手性。\n\n虽然增加手性最初会抑制大规模密度波动，但超出阈值奇数扩散强度的波动随手性非单调变化并形成尖点奇点。", "authors": [{"name": "Koushik Das"}, {"name": "Animesh Hazra"}, {"name": "Punyabrata Pradhan"}], "featured_authors": [{"name": "Koushik Das"}, {"name": "Animesh Hazra"}, {"name": "Punyabrata Pradhan"}], "author_count": 3}, {"id": "2609.16868", "category": "cond-mat", "title": "Enskog kinetic theory in a model of confined granular mixtures. Heat flux and some applications", "abstract": "This work considers the Enskog kinetic theory for moderately dense confined granular mixtures within the framework of the $\\Delta$-model, an effective collisional model that accounts for the transfer of energy from the vertical to the horizontal degrees of freedom of grains through an additional velocity increment during collisions. The main objective is to complete the Navier--Stokes hydrodynamic description of dense binary granular mixtures by explicitly determining the heat-flux transport coefficients, namely the Dufour and thermal conductivity coefficients, together with the first-order contributions to the partial temperatures and the cooling rate. These quantities are determined in the steady state from the Enskog kinetic equation by means of the Chapman--Enskog method and are expressed in terms of the masses and diameters of the particles, mixture composition, density, and coefficients of restitution. The results show that finite-density effects have a significant influence on transport, leading to behaviors that differ markedly from those observed in the dilute regime. The complete set of transport coefficients is considered further to study two different problems. First, we perform a linear stability analysis of the homogeneous steady state (HSS). The analysis demonstrates that no unstable transverse or longitudinal hydrodynamic modes are found over the parameter space explored, indicating that the HSS is linearly stable even at moderate densities. As a second problem, the violation of the Onsager reciprocal relations for a confined dense granular mixture is quantified in terms of the parameter space of the problem.", "url": "https://arxiv.org/abs/2609.16868", "type": "理论", "summary": "这项工作考虑了 $\\Delta$ 模型框架内中等密度受限颗粒混合物的 Enskog 动力学理论，该模型是一种有效的碰撞模型，通过碰撞过程中额外的速度增量来解释能量从颗粒的垂直自由度到水平自由度的转移。主要目标是通过明确确定热通量传输系数（即 Dufour 和导热系数）以及对部分温度和冷却速率的一阶贡献，完成致密二元颗粒混合物的纳维-斯托克斯流体动力学描述。这些量是在稳定状态下通过查普曼-恩斯科格方法从恩斯科格动力学方程确定的，并以颗粒的质量和直径、混合物组成、密度和恢复系数表示。结果表明，有限密度效应对输运有显着影响，导致行为与稀释状态下观察到的行为明显不同。进一步考虑完整的传输系数集来研究两个不同的问题。\n\n首先，我们对均质稳态 (HSS) 进行线性稳定性分析。分析表明，在探索的参数空间中没有发现不稳定的横向或纵向流体动力模式，这表明即使在中等密度下，HSS 也是线性稳定的。作为第二个问题，约束致密颗粒混合物的 Onsager 倒易关系的违反根据问题的参数空间进行量化。", "authors": [{"name": "David González Méndez"}, {"name": "Vicente Garzó Puertos"}], "featured_authors": [{"name": "David González Méndez"}, {"name": "Vicente Garzó Puertos"}], "author_count": 2}, {"id": "2609.16935", "category": "cond-mat", "title": "Nonlocal Magic across the Many-Body Localization Crossover", "abstract": "Nonlocal magic quantifies the minimum nonstabilizerness attainable under independent local unitary transformations on the two subsystems. Here, we use min-relative nonlocal magic (NLM) to characterize the crossover from ergodicity to many-body localization (MBL) in the random-field XXZ chain. Unlike entanglement entropy, NLM probes how entanglement is organized through the distance of the Schmidt spectrum from dyadic-flat stabilizer spectra. From weak to intermediate disorder, NLM evolves from an $O(1)$ Haar-like value into a size-enhanced dome, while entanglement remains volume-law, revealing a spectral reorganization not visible in the entropy. Deep in the MBL regime, a two-level cut-hybridization model captures the nearly binary Schmidt spectrum and explains why the mean and median NLM decay approximately as $W^{-1}$ and $W^{-2}$, respectively. Following a product-state quench, NLM overshoots and relaxes in the ergodic regime, whereas at strong disorder it grows slowly and approximately logarithmically. These results show that NLM resolves Schmidt-spectrum structure not visible in the entanglement entropy and provides a complementary probe of ergodicity breaking.", "url": "https://arxiv.org/abs/2609.16935", "type": "理论", "summary": "非局部魔力量化了两个子系统上独立局部酉变换下可达到的最小非稳定性。在这里，我们使用最小相对非局部魔法 (NLM) 来表征随机场 XXZ 链中从遍历性到多体局部化 (MBL) 的交叉。与纠缠熵不同，NLM 探测纠缠是如何通过施密特谱与二进平坦稳定器谱的距离来组织的。从弱无序到中度无序，NLM 从类似 $O(1)$ Haar 的值演变为尺寸增强的圆顶，而纠缠仍然是体积定律，揭示了熵中不可见的光谱重组。在 MBL 体系深处，两级剪切杂交模型捕获了近乎二元的施密特谱，并解释了为什么平均 NLM 和中值 NLM 分别大约衰减为 $W^{-1}$ 和 $W^{-2}$。在产品状态淬灭之后，NLM 在遍历状态下超调并松弛，而在强无序状态下，它缓慢且近似对数地增长。这些结果表明，NLM 解析了纠缠熵中不可见的施密特谱结构，并提供了遍历性破坏的补充探针。", "authors": [{"name": "Shan-Zhong Li"}, {"name": "Zhi Li"}], "featured_authors": [{"name": "Shan-Zhong Li"}, {"name": "Zhi Li"}], "author_count": 2}, {"id": "2609.17005", "category": "cond-mat", "title": "Odd slip at chiral active surfaces", "abstract": "Odd slip at solid-liquid interfaces, characterized by a velocity component perpendicular to the applied shear stress, introduces a novel class of odd transport phenomena with transverse momentum transfer at boundaries, distinct from odd viscosity, odd elasticity, or odd diffusivity. This effect arises on chiral active surfaces with persistent energy input and defined handedness, such as carpets of rotating biological or synthetic cilia with flexible anchoring. Although odd slip itself is dissipationless, its maintenance comes at an energetic cost, which we estimate from the microscopic model. With respect to its orientation dependence, odd slip can be classified as pseudo-scalar or pseudo-vectorial. We use a perturbative expansion to determine the resistance tensors of problems with different levels of broken symmetries. They reveal how the surface chirality and body asymmetry together violate the Onsager symmetry, but uphold the Onsager-Casimir reciprocity. Strikingly, suspensions of particles with odd slip embedded in a conventional Newtonian bulk fluid exhibit odd viscosity, providing a new minimal mechanism for its emergence beyond current microscopic models.", "url": "https://arxiv.org/abs/2609.17005", "type": "理论", "summary": "固液界面处的奇滑移以垂直于所施加的剪切应力的速度分量为特征，引入了一类新颖的奇传输现象，其在边界处具有横向动量传递，与奇粘度、奇弹性或奇扩散率不同。这种效应出现在具有持续能量输入和定义的手性的手性活性表面上，例如具有灵活锚定的旋转生物或合成纤毛的地毯。尽管奇滑移本身是无耗散的，但其维护需要能量成本，这是我们根据微观模型估计的。就其方向依赖性而言，奇滑移可分为伪标量或伪矢量。我们使用微扰展开来确定具有不同程度的对称性破缺问题的阻力张量。他们揭示了表面手性和体不对称性如何共同违反 Onsager 对称性，但又维持 Onsager-Casimir 互易性。引人注目的是，嵌入传统牛顿散装流体中的具有奇数滑移的颗粒悬浮液表现出奇数粘度，为其超越当前微观模型的出现提供了新的最小机制。", "authors": [{"name": "Yuto Yosaka"}, {"name": "Andrej Vilfan"}], "featured_authors": [{"name": "Yuto Yosaka"}, {"name": "Andrej Vilfan"}], "author_count": 2}, {"id": "2609.17047", "category": "cond-mat", "title": "Trajectory Statistics Govern Mechanical Power Transfer in Active Baths", "abstract": "The mechanical response of a moving probe in an active bath reflects both the dynamics of the bath and how the probe couples to it. For a probe moving at velocity $\\mathbf V$ and interacting weakly with an ideal active bath, we show that the trajectory statistics of a free bath particle determine a density response from which the bath force on the probe follows. The probe-particle interaction determines how this response is weighted over wave vector $\\mathbf q$, while the probe motion selects frequencies $\\omega_{\\mathbf q}=\\mathbf q\\cdot \\mathbf V$. This trajectory-response relation separates the bath dynamics from the wave-vector weighting, so neither the stationary state nor force correlations need to be recalculated for each probe interaction and velocity. Applying this relation to active-particle models, we prove that positive power transfer is excluded for active Ornstein--Uhlenbeck particles in all dimensions and for complete-reset run-and-tumble particles in $d\\geq2$, while one-dimensional run-and-tumble particles and two-dimensional active Brownian particles possess modes that can transfer positive mechanical power. For a given probe, this response predicts drag reversal, spontaneous probe motion, and motion-induced density distortions, all in quantitative agreement with simulations. Varying the probe geometry changes how the same bath response is weighted, thereby selecting different moving states. Beyond the leading weak-probe, ideal-bath limit, higher orders in probe strength involve multi-interval trajectory statistics, while finite-density corrections involve interacting-particle dynamics. Our results connect the trajectory statistics of active bath particles to the mechanical response of a passive probe, providing a route to predict probe response from single-particle trajectory statistics measured in the absence of the probe.", "url": "https://arxiv.org/abs/2609.17047", "type": "理论+数值", "summary": "活动浴中移动探头的机械响应反映了浴的动态以及探头与其耦合的方式。对于以速度 $\\mathbf V$ 移动并与理想活性浴弱相互作用的探针，我们表明自由浴粒子的轨迹统计确定了探针上的浴力所遵循的密度响应。探针-粒子相互作用决定了该响应如何在波矢量 $\\mathbf q$ 上加权，而探针运动选择频率 $\\omega_{\\mathbf q}=\\mathbf q\\cdot \\mathbf V$。这种轨迹响应关系将浴动力学与波矢量加权分开，因此不需要为每个探针相互作用和速度重新计算静止状态和力相关性。将这种关系应用于活性粒子模型，我们证明了所有维度中的活性奥恩斯坦-乌伦贝克粒子和$d\\geq2$中的完全复位运行翻滚粒子都排除了正功率传递，而一维运行翻滚粒子和二维活性布朗粒子拥有可以传递正机械功率的模式。\n\n对于给定的探针，该响应预测阻力反转、探针自发运动和运动引起的密度变形，所有这些都与模拟定量一致。改变探头几何形状会改变相同浴响应的加权方式，从而选择不同的移动状态。除了领先的弱探针、理想浴极限之外，探针强度的更高阶涉及多区间轨迹统计，而有限密度校正涉及相互作用粒子动力学。我们的结果将主动浴颗粒的轨迹统计数据与被动探针的机械响应联系起来，提供了一种根据在没有探针的情况下测量的单粒子轨迹统计数据来预测探针响应的途径。", "authors": [{"name": "Chul-Ung Woo"}, {"name": "Jiwon Choi"}, {"name": "Heiko Rieger"}], "featured_authors": [{"name": "Chul-Ung Woo"}, {"name": "Jiwon Choi"}, {"name": "Heiko Rieger"}], "author_count": 3}, {"id": "2609.17069", "category": "cond-mat", "title": "Interplay of dimerization and quasiperiodicity in the superconducting proximity effect of a one-dimensional hybrid ring", "abstract": "Recent studies of the superconducting proximity effect in quasicrystalline and topological systems have opened up a new research direction for exploring how quasiperiodicity and topology influence proximity induced superconductivity. In this work, we investigate spatial variation of the proximity induced pairing amplitude in a hybrid ring composed of a spin singlet superconductor and a normal region described by three different lattice models using the self-consistent Bogoliubov-de Gennes formalism. We first consider the normal region described by the diagonal Aubry-André-Harper (AAH) model. Increasing the quasiperiodic potential enhances spatial fluctuations in the induced order parameter, while progressively suppressing its magnitude in the normal region. Beyond the localization transition, proximity-induced pairing is strongly diminished due to the localized nature of the underlying electronic states. The normal region is then modeled by the Su-Schrieffer-Heeger (SSH) chain to investigate the effect of hopping dimerization. Weak dimerization introduces oscillatory modulations in the induced pairing that extend deep into the normal region, whereas strong dimerization confines these oscillations and significantly reduces the penetration of superconducting correlations. Finally, we study the combined SSH-AAH model to explore the interplay between the dimerized hopping and quasiperiodicity. The results show that the SSH dimerization determines the oscillatory behavior and penetration of the induced pairing, while the AAH potential enhances spatial inhomogeneity and further reduces its magnitude. Together, these two effects provide a versatile means of controlling proximity-induced superconductivity in quasiperiodic hybrid systems.", "url": "https://arxiv.org/abs/2609.17069", "type": "理论", "summary": "最近对准晶和拓扑系统中超导邻近效应的研究为探索准周期性和拓扑如何影响邻近感应超导性开辟了新的研究方向。在这项工作中，我们使用自洽的 Bogoliubov-de Gennes 形式研究了由自旋单线态超导体和由三种不同晶格模型描述的正常区域组成的混合环中邻近引起的配对振幅的空间变化。我们首先考虑对角 Aubry-André-Harper (AAH) 模型描述的正常区域。增加准周期势会增强诱导有序参数的空间波动，同时逐渐抑制其在正常区域的幅度。除了局域化转变之外，由于底层电子态的局域化性质，邻近引起的配对会大大减弱。然后通过 Su-Schrieffer-Heeger (SSH) 链对正常区域进行建模，以研究跳跃二聚化的影响。\n\n弱二聚化在延伸到正常区域深处的诱导配对中引入了振荡调制，而强二聚化则限制了这些振荡并显着降低了超导相关性的穿透力。最后，我们研究了组合的 SSH-AAH 模型，以探索二聚化跳跃和准周期性之间的相互作用。结果表明，SSH 二聚化决定了诱导配对的振荡行为和渗透，而 AAH 电位增强了空间不均匀性并进一步降低了其幅度。这两种效应共同提供了一种控制准周期混合系统中邻近感应超导性的通用方法。", "authors": [{"name": "Sourav Karmakar"}, {"name": "Santanu K. Maiti"}], "featured_authors": [{"name": "Sourav Karmakar"}, {"name": "Santanu K. Maiti"}], "author_count": 2}, {"id": "2609.17080", "category": "cond-mat", "title": "La substitution studies on the heavy-fermion superconductor CeRh$_2$As$_2$", "abstract": "CeRh$_2$As$_2$ has been receiving considerable attention due to its unusual two-phase superconductivity. The superconducting (SC) phase appears at $T_{\\mathrm{c}}$ = 0.35 K in an ordered state (phase I) of the Ce-4$f$ moments, which develops below $T_{\\mathrm{0}}$ = 0.55 K. The microscopic nature of phase I has not been fully established yet. We report a single-crystal study of the effect of La substitution on these low-temperature phases in Ce$_{1-\\textit{x}}$La$_\\textit{x}$Rh$_2$As$_2$ up to $x$ = 0.1. The lattice parameters increase monotonically with $x$, corresponding to an effective negative pressure of approximately -0.3 GPa for $x$ = 0.1. While the Ce$^{3+}$ local valence state and the non-Fermi-liquid behavior are preserved, the resistivity coherence maximum $T^{*}_{\\mathrm{max}}$ $\\approx$ 45 K in the pristine sample shifts to lower temperatures with increasing $x$, indicating a suppression of the Kondo energy scale upon lattice expansion. On the other hand, both $T_{\\mathrm{c}}$ and $T_{\\mathrm{0}}$ are rapidly suppressed to below 0.1 K for $x$ $>$ 0.05. Notably, such a rapid decrease of $T_{\\mathrm{c}}$ under moderate negative pressure is unexpected, but is rather consistent with substitution-induced disorder effect which leads to strong pair breaking in unconventional superconductors. The observed fragility of phase I under both pressure and disorder may imply its itinerant origin.", "url": "https://arxiv.org/abs/2609.17080", "type": "理论", "summary": "CeRh$_2$As$_2$ 由于其不寻常的两相超导性而受到广泛关注。超导（SC）相出现在 $T_{\\mathrm{c}}$ = 0.35 K 处，处于 Ce-4$f$ 矩的有序状态（第一相），并在 $T_{\\mathrm{0}}$ = 0.55 K 以下发展。第一相的微观性质尚未完全确定。我们报告了一项单晶研究，研究 La 取代对 Ce$_{1-\\textit{x}}$La$_\\textit{x}$Rh$_2$As$_2$ 中这些低温相的影响，最高可达 $x$ = 0.1。晶格参数随 $x$ 单调增加，对应于 $x$ = 0.1 时约 -0.3 GPa 的有效负压。虽然 Ce$^{3+}$ 局域价态和非费米液体行为得以保留，但原始样品中的电阻率相干最大值 $T^{*}_{\\mathrm{max}}$ $\\approx$ 45 K 随着 $x$ 的增加而转向较低的温度，表明晶格膨胀时近藤能量尺度受到抑制。另一方面，当 $x$ $>$ 0.05 时，$T_{\\mathrm{c}}$ 和 $T_{\\mathrm{0}}$ 都被迅速抑制到 0.1 K 以下。\n\n值得注意的是，在中等负压下 $T_{\\mathrm{c}}$ 的如此快速下降是出乎意料的，但与取代引起的无序效应相当一致，该效应导致非常规超导体中强烈的电子对断裂。观察到的第一阶段在压力和混乱下的脆弱性可能暗示着它的流动起源。", "authors": [{"name": "Sushma Lakshmi Ravi Sankar"}, {"name": "Manuel Brando"}, {"name": "Jochen Wosnitza"}, {"name": "Seunghyun Khim"}], "featured_authors": [{"name": "Sushma Lakshmi Ravi Sankar"}, {"name": "Manuel Brando"}, {"name": "Jochen Wosnitza"}, {"name": "Seunghyun Khim"}], "author_count": 4}, {"id": "2609.17097", "category": "cond-mat", "title": "Course on two-dimensional quantum gases", "abstract": "This course on two-dimensional quantum gases, prepared for the S{ã}o Paulo ICTP-SAIFR IVth School on Light and Cold Atoms, is organized into three lectures. The first introductory lecture addresses Bose-Einstein condensation in an ideal gas, the effect of interactions in the weakly interacting limit, Gross-Pitaevskii equation and its hydrodynamic formulation, as well as superfluidity. The second lecture is devoted to the main features of two-dimensional quantum gases: importance of the interactions, enhanced phase fluctuations and the emergence of a quasi long-range order, superfluidity through the Berezinskii-Kosterlitz-Thouless mechanism, scaling symmetry. The third lecture has taken the form of a seminar on fast rotating quasi two-dimensional Bose gases and thermal melting of the vortex lattice. The slides accompanying these notes can be found on the school website: this https URL .", "url": "https://arxiv.org/abs/2609.17097", "type": "理论", "summary": "这门关于二维量子气体的课程是为圣保罗 ICTP-SAIFR IVth 轻原子和冷原子学校准备的，分为三个讲座。第一个介绍性讲座讨论了理想气体中的玻色-爱因斯坦凝聚、弱相互作用极限中相互作用的影响、格罗斯-皮塔耶夫斯基方程及其流体动力学公式，以及超流性。第二讲致力于二维量子气体的主要特征：相互作用的重要性、增强的相位涨落和准长程有序的出现、通过别列津斯基-科斯特利茨-托利斯机制实现的超流性、尺度对称性。第三场讲座采取了关于快速旋转准二维玻色气体和涡晶格热熔化的研讨会的形式。这些笔记附带的幻灯片可以在学校网站上找到：此 https URL 。", "authors": [{"name": "Hélène Perrin"}], "featured_authors": [{"name": "Hélène Perrin"}], "author_count": 1}, {"id": "2609.17123", "category": "cond-mat", "title": "AI for Science with GPT-6 Astra: Thermal Design and Electrothermal Analysis of 2D CFET", "abstract": "Thermal optimization of 2D CFET inverters requires testing structural proposals against their electrical costs. We examine these research tasks using an AI agent workflow within a supplied electrothermal model. At 12 nm, Astra selects a redistributed source-interconnect geometry, while a coordinating agent proposes a substrate-directed heat-removal path. The combined design reduces peak temperature rise by 1.67 K at fixed metal volume and 20 {\\mu}W. A subsequent metal-resistance sensitivity gives about 0.6-K inverter cooling alongside a 2% nFET on-current loss. Effective contact-length scaling further shows that lower temperature can accompany higher thermal resistance when current falls. Reproduction identifies agreeing implementations and retains a 104.95-K failure for diagnosis. These results show that an AI scientist workflow can propose thermal structures, test them under common constraints, and quantify their electrical cost.", "url": "https://arxiv.org/abs/2609.17123", "type": "理论+数值", "summary": "2D CFET 逆变器的热优化需要根据其电力成本测试结构方案。我们在提供的电热模型中使用人工智能代理工作流程来检查这些研究任务。在 12 nm 时，Astra 选择重新分布的源极互连几何结构，而协调代理则提出了基板导向的散热路径。在固定金属体积和 20 {μ}W 的情况下，组合设计将峰值温升降低了 1.67 K。随后的金属电阻灵敏度可提供约 0.6K 的逆变器冷却以及 2% 的 nFET 导通电流损耗。有效的接触长度缩放进一步表明，当电流下降时，较低的温度会伴随较高的热阻。复制会识别一致的实现并保留 104.95-K 故障以供诊断。这些结果表明，人工智能科学家工作流程可以提出热结构，在常见约束下对其进行测试，并量化其电力成本。", "authors": [{"name": "Min-Hui Kim"}, {"name": "Khushi Sharma"}, {"name": "Sarah Zhang"}, {"name": "Ye Wang"}], "featured_authors": [{"name": "Min-Hui Kim"}, {"name": "Khushi Sharma"}, {"name": "Sarah Zhang"}, {"name": "Ye Wang"}], "author_count": 4}, {"id": "2609.17166", "category": "cond-mat", "title": "Numerical Study of Stability of Clean Critical Points across Aperiodic, Topological, and Uncorrelated Disorder", "abstract": "Using the two-dimensional Ashkin-Teller (AT) model, we compare criticality on three non-periodic lattices: the Smith-hat aperiodic tiling, Voronoi-Delaunay (VD) random triangulations, and uncorrelated diluted square lattices. The decay of the block-averaged coordination fluctuation $\\sigma_Q$ with exponent $\\alpha$ is used to describe the connectivity disorder. The first two lattices share the same exponent $\\alpha$, which differs from that of the third. We consider the regime where the correlation-length exponent $\\nu<1$, where randomness is relevant according to the Harris criterion $d \\nu \\le 2$, but should be irrelevant in cases of the Smith-hat tiling and VD triangulations, where $\\alpha \\nu >1$, according to the Harris--Barghathi--Vojta (HBV) criterion. For the diluted lattice, we indeed find that the clean universality behavior breaks down along the entire critical line, indicating a crossover to a fixed line dominated by disorder, in line with both the Harris criterion and the HBV criterion. In contrast, both VD and Smith-hat lattices display critical exponents consistent with the clean AT universality class, as validated by a Coulomb-gas self-consistency check, violating the Harris criterion while conforming to the HBV criterion.", "url": "https://arxiv.org/abs/2609.17166", "type": "理论+数值", "summary": "使用二维 Ashkin-Teller (AT) 模型，我们比较了三种非周期晶格的临界性：史密斯帽非周期平铺、Voronoi-Delaunay (VD) 随机三角剖分和不相关的稀释方晶格。块平均协调波动 $\\sigma_Q$ 随指数 $\\alpha$ 的衰减用于描述连接障碍。前两个格子共享相同的指数 $\\alpha$，与第三个格子不同。我们考虑相关长度指数 $\\nu<1$ 的情况，其中根据 Harris 准则 $d \\nu \\le 2$，随机性是相关的，但根据 Harris--Barghathi--Vojta (HBV) 准则，在 Smith-hat 平铺和 VD 三角剖分的情况下应该是无关的，其中 $\\alpha \\nu >1$。对于稀释晶格，我们确实发现干净的普遍性行为沿着整个临界线崩溃，表明与无序主导的固定线交叉，符合 Harris 准则和 HBV 准则。\n\n相比之下，VD 和史密斯帽晶格都显示出与清洁 AT 普遍性类别一致的临界指数，经库仑气体自一致性检查验证，违反了 Harris 准则，同时符合 HBV 标准。", "authors": [{"name": "Shuhao Fan"}, {"name": "Lu Liu"}, {"name": "Wenan Guo"}], "featured_authors": [{"name": "Shuhao Fan"}, {"name": "Lu Liu"}, {"name": "Wenan Guo"}], "author_count": 3}, {"id": "2609.17213", "category": "cond-mat", "title": "Latent kinetic Ising models of neural spike trains", "abstract": "Inferring directed effective interactions from neuronal spike trains is a central inverse problem in statistical physics and computational neuroscience. Kinetic Ising models provide a tractable framework for this task, but their application to neural data typically requires binning spike trains into binary activity variables, discarding within-bin timing and conflating collective network dynamics with single-neuron history effects. We introduce SpiKIsing, a latent-variable model that separates these two levels of description. A discrete-time asymmetric kinetic Ising model describes collective network activity, while continuous-time, history-dependent point processes generate the observed spikes conditional on the latent states, accounting explicitly for refractoriness and post-spike recovery. We derive a variational mean-field expectation-maximization scheme in which the point-process likelihood enters as an effective observation field, enabling joint inference of latent activity, network couplings, and emission parameters. The framework extends naturally to maximum-a-posteriori inference with structured priors, including sparsity and a hierarchical extension favouring Dale-consistent outgoing interactions. We validate parameter recovery on matched synthetic data and test the method on spike trains generated by a recurrent conductance-based leaky integrate-and-fire network. In this setting, SpiKIsing recovers sparse connection structure and correctly classifies all excitatory and inhibitory neurons despite the substantial mismatch between the data-generating dynamics and the SpiKIsing model.", "url": "https://arxiv.org/abs/2609.17213", "type": "理论+数值", "summary": "从神经元尖峰序列推断定向有效相互作用是统计物理学和计算神经科学中的核心逆问题。动力学 Ising 模型为此任务提供了一个易于处理的框架，但它们在神经数据中的应用通常需要将尖峰序列分箱到二元活动变量中，丢弃箱内计时并将集体网络动态与单神经元历史效应混为一谈。我们引入了 SpiKIsing，这是一种将这两个描述级别分开的潜变量模型。离散时间不对称动力学伊辛模型描述了集体网络活动，而连续时间、历史相关的点过程则生成以潜在状态为条件的观察到的尖峰，明确说明了不应性和尖峰后恢复。我们推导了一种变分平均场期望最大化方案，其中点过程似然作为有效观察场进入，从而能够联合推断潜在活动、网络耦合和发射参数。\n\n该框架自然地扩展到具有结构化先验的最大后验推理，包括稀疏性和有利于戴尔一致的传出交互的分层扩展。我们在匹配的合成数据上验证参数恢复，并在由基于循环电导的泄漏积分和激发网络生成的尖峰序列上测试该方法。在此设置中，尽管数据生成动力学与 SpiKIsing 模型之间存在严重不匹配，但 SpiKIsing 仍能恢复稀疏连接结构并正确分类所有兴奋性和抑制性神经元。", "authors": [{"name": "Davide Ghio"}, {"name": "David Saad"}], "featured_authors": [{"name": "Davide Ghio"}, {"name": "David Saad"}], "author_count": 2}, {"id": "2609.17239", "category": "cond-mat", "title": "Quantum Brownian motion in a temperature gradient", "abstract": "When a classical Brownian particle is subjected to a temperature gradient it can undergo thermophoresis, i.e., the particle gets transported towards the colder regions of the environment, which bears relevant consequences to nonequilibrium self-organization. Here, we investigate how the quantum Brownian motion is affected by a temperature gradient. We employ a recently proposed generalized system-plus-reservoir model, where one assumes a continuum field of thermal baths. As our main result, we obtain the quantum influence functional, within the Feynmann-Vernon path integral approach. To test convergence, we derive an effective Langevin equation for the center of mass of the quantum wavepacket, and show that it coincides with the classical Langevin equation at high temperatures. Both the fully quantum (low temperatures) and the semiclassical (high temperature) limits show signatures of quantum thermophoresis in the quantum Brownian motion, a so far unexplored effect.", "url": "https://arxiv.org/abs/2609.17239", "type": "理论", "summary": "当经典布朗粒子受到温度梯度时，它会发生热泳，即粒子被传输到环境中较冷的区域，这会对非平衡自组织产生相关影响。在这里，我们研究温度梯度如何影响量子布朗运动。我们采用了最近提出的广义系统加水库模型，其中假设有一个连续的温泉浴场。作为我们的主要结果，我们在 Feynmann-Vernon 路径积分方法中获得了量子影响泛函。为了测试收敛性，我们推导了量子波包质心的有效朗之万方程，并证明它与高温下的经典朗之万方程一致。全量子（低温）和半经典（高温）极限都显示了量子布朗运动中量子热泳的特征，这是迄今为止尚未探索的效应。", "authors": [{"name": "Ricardo J. S. Afonso"}, {"name": "Pedro V. Paraguassú"}, {"name": "Thiago Werlang"}, {"name": "Daniel Valente"}], "featured_authors": [{"name": "Ricardo J. S. Afonso"}, {"name": "Pedro V. Paraguassú"}, {"name": "Thiago Werlang"}, {"name": "Daniel Valente"}], "author_count": 4}, {"id": "2609.17289", "category": "cond-mat", "title": "Self-balancing luminescence kinetics of charged excitons in WS$_2$ monolayer", "abstract": "Two-dimensional tungsten-based transition metal dichalcogenides exhibit a rich emission spectrum with distinct lines of exciton and biexciton states, neutral and charged, which are typically considered as independent entities. Here, we present a study of the emission kinetics of a WS$_2$ monolayer, demonstrating that these states together form a single interacting ensemble, with their population and depletion mutually coordinated with temperature. Dark trions make a long-lived contribution to the bright trion on a time scale of 200-300 picoseconds, and replenishment from dark states promotes intense luminescence of charged biexcitons. The developed self-consistent rate equation model reproduces the temperature dependence of the kinetics well, opening the way to controlling exciton states in such materials.", "url": "https://arxiv.org/abs/2609.17289", "type": "理论", "summary": "二维钨基过渡金属二硫属化物表现出丰富的发射光谱，具有明显的激子和双激子状态线、中性和带电，通常被认为是独立的实体。在这里，我们对 WS$_2$ 单层的发射动力学进行了研究，证明这些状态一起形成一个相互作用的整体，它们的布居和耗尽与温度相互协调。暗三重子在 200-300 皮秒的时间尺度上对亮三重子做出了长期贡献，暗态的补充促进了带电双激子的强烈发光。开发的自洽速率方程模型很好地再现了动力学的温度依赖性，为控制此类材料中的激子态开辟了道路。", "authors": [{"name": "A.I. Veretennikov"}, {"name": "A.I. Galimov"}, {"name": "M.M. Glazov"}, {"name": "T.V. Shubina"}], "featured_authors": [{"name": "A.I. Veretennikov"}, {"name": "A.I. Galimov"}, {"name": "M.M. Glazov"}, {"name": "T.V. Shubina"}], "author_count": 4}, {"id": "2609.17329", "category": "cond-mat", "title": "Integrated quantum-secured cryptographic memory in customizable single nanodiamonds", "abstract": "As advanced physical cloning and cyber-extraction techniques proliferate, achieving absolute hardware-level information security has become a paramount global challenge. Conventional architectures systems are fundamentally vulnerable because deterministic memory and cryptographic hardware are physically decoupled, exposing sensitive data to interception. While physical unclonable functions (PUFs) offer robust authentication, integrating them with high-density data writing within a unified nanoscale medium remains elusive. Here, we present an intrinsically secure all-in-one architecture that inextricably fuses high-dimensional data encoding with multiscale physical encryption within single nanodiamonds (NDs). Through precise focused-electron-beam irradiation, we achieve single-nanoparticle defect engineering, enabling deterministic base-36 data writing within individual NDs. Crucially, this customized memory layer is permanently locked within the medium's inherent stochasticity, combining macroscopic spatial PUFs with strictly irreproducible atomic-scale quantum fingerprints extracted via optically detected magnetic resonance (ODMR). By seamlessly embedding deterministic memory into an unclonable physical environment, our approach intrinsically eliminates the vulnerabilities of separated hardware, providing an unconditionally secure solid-state foundation for tamper-proof memory chips, zero-trust networks and next-generation data vaults.", "url": "https://arxiv.org/abs/2609.17329", "type": "理论", "summary": "随着先进的物理克隆和网络提取技术的激增，实现绝对的硬件级信息安全已成为全球面临的首要挑战。传统架构系统从根本上来说很容易受到攻击，因为确定性内存和加密硬件在物理上是解耦的，从而使敏感数据容易被拦截。虽然物理不可克隆功能 (PUF) 提供了强大的身份验证，但将它们与统一纳米级介质中的高密度数据写入集成仍然难以实现。在这里，我们提出了一种本质上安全的一体式架构，它将高维数据编码与单纳米金刚石（ND）内的多尺度物理加密紧密地融合在一起。通过精确的聚焦电子束照射，我们实现了单纳米粒子缺陷工程，从而能够在单个 ND 内进行确定性的 36 进制数据写入。至关重要的是，这种定制的存储层永久锁定在介质固有的随机性内，将宏观空间 PUF 与通过光学检测磁共振 (ODMR) 提取的严格不可复制的原子级量子指纹相结合。\n\n通过将确定性内存无缝嵌入到不可克隆的物理环境中，我们的方法从本质上消除了分离硬件的漏洞，为防篡改内存芯片、零信任网络和下一代数据库提供了无条件安全的固态基础。", "authors": [{"name": "Tongtong Zhang"}, {"name": "Jiaqi Li"}, {"name": "Zhiqin Chu"}], "featured_authors": [{"name": "Tongtong Zhang"}, {"name": "Jiaqi Li"}, {"name": "Zhiqin Chu"}], "author_count": 3}, {"id": "2609.17378", "category": "cond-mat", "title": "Exact solutions of nonreciprocal Su-Schrieffer-Heeger model with domain walls", "abstract": "We investigate domain-wall physics in a non-Hermitian Su-Schrieffer-Heeger model featuring the non-Hermitian skin effect and its higher-dimensional extensions, focusing on analytical eigenstate solutions under open boundary conditions. By gluing two Su-Schrieffer-Heeger chains with inverted coupling ratios together, we identify two distinct interface geometries, and derive closed-form quantization conditions for the complex wave number and wave functions using symmetry-based ansatzes. Besides conventional skin modes and topological zero modes, the domain walls generate additional localized states at finite energy that detach from the bulk open-boundary-condition continuum. We validate the analytical results by exact diagonalization, and further generalize the interface construction to a two-dimensional Lieb lattice, where competing nonreciprocities produce tunable funneling regimes towards codimension-one and codimension-two interfaces.", "url": "https://arxiv.org/abs/2609.17378", "type": "理论+数值", "summary": "我们研究了非厄米 Su-Schrieffer-Heeger 模型中的域壁物理，该模型具有非厄米趋肤效应及其高维扩展，重点关注开放边界条件下的解析本征态解。通过将两个具有反向耦合比的 Su-Schrieffer-Heeger 链粘合在一起，我们确定了两种不同的界面几何形状，并使用基于对称性的模拟推导出复波数和波函数的封闭形式量化条件。除了传统的集肤模式和拓扑零模式之外，畴壁还会在有限能量下产生额外的局域态，这些态与块体开放边界条件连续体分离。我们通过精确对角化验证了分析结果，并进一步将界面构造推广到二维利布格子，其中竞争的非互易性产生了朝向余维一和余维二界面的可调漏斗机制。", "authors": [{"name": "Tong Wang"}, {"name": "Mengjie Yang"}, {"name": "Flore K. Kunst"}], "featured_authors": [{"name": "Tong Wang"}, {"name": "Mengjie Yang"}, {"name": "Flore K. Kunst"}], "author_count": 3}, {"id": "2609.17433", "category": "cond-mat", "title": "Nonlinear electron-phonon interactions from first principles", "abstract": "Electron-phonon interactions underpin a variety of phenomena, ranging from transport and superconductivity to polarons and ultrafast carrier dynamics. Despite being one of the most intensely studied subjects in condensed matter physics, research on electron-phonon physics mostly focused on linear, first-order couplings. Second- and higher-order nonlinear couplings are commonly ignored because their calculations are too demanding and we lack computational frameworks that can provide both diagonal and off-diagonal coupling matrix elements. In this work, we report a theory and computational method for computing nonlinear electron-phonon interactions of any order in real materials. Our approach combines the advantages of unit-cell calculations of electron wavefunctions and supercell calculations of phonon perturbations, is systematically improvable, can be used with either semilocal or nonlocal exchange-correlation functionals, and is amenable to Wannier-Fourier interpolation. As a first proof of concept, we illustrate this method by computing second-order electron-phonon coupling matrix elements in diamond, lithium fluoride, and graphite as representative nonpolar semiconductors, polar semiconductors, and metals, respectively. Furthermore, we generalize the ab initio polaron equations to second-order electron-phonon couplings, and we show that second-order couplings are essential to achieve quantitative accuracy in polaron formation energies and hopping barriers. The present methodology will find application in the study of all properties and phenomena that are currently being investigated within the linear electron-phonon coupling approximation, from phonon-mediated superconductivity to excited-states dynamics, both in harmonic and anharmonic systems.", "url": "https://arxiv.org/abs/2609.17433", "type": "理论+数值", "summary": "电子-声子相互作用支撑着各种现象，从输运和超导到极化子和超快载流子动力学。尽管电子声子物理是凝聚态物理中研究最深入的学科之一，但它的研究主要集中在线性一阶耦合上。二阶和高阶非线性耦合通常被忽略，因为它们的计算要求太高，而且我们缺乏可以提供对角线和非对角线耦合矩阵元素的计算框架。在这项工作中，我们报告了一种用于计算实际材料中任意阶的非线性电子-声子相互作用的理论和计算方法。我们的方法结合了电子波函数的晶胞计算和声子扰动的超晶胞计算的优点，可以系统地改进，可以与半局域或非局域交换相关泛函一起使用，并且适合 Wannier-Fourier 插值。\n\n作为概念的第一个证明，我们通过计算分别作为代表性非极性半导体、极性半导体和金属的金刚石、氟化锂和石墨中的二阶电子声子耦合矩阵元素来说明该方法。此外，我们将从头算起的极化子方程推广到二阶电子声子耦合，并且表明二阶耦合对于实现极化子形
