y of the locality-preserving Derby-Klassen (DK) fermion-to-qubit mapping [ arXiv:2003.06939 ] for variational quantum simulation of two-dimensional $t$-$V$ and Fermi-Hubbard models. The DK mapping preserves the locality of fermionic interactions with an enlarged Hilbert space, thereby requiring additional constraints that define the physical sector. We incorporate these constraints directly into a Hamiltonian Variational Ansätz (HVA) through Clifford-gate state preparation and use the Variational Quantum Eigensolver (VQE) to show that the low-energy properties of the resulting qubit Hamiltonian are accurately reproduced. We further exploit particle-number conservation inherent in the ansätz to resolve distinct symmetry sectors and reliably access degenerate states. Consequently, we benchmark the DK-HVA against Jordan-Wigner-based variational circuits at nonzero chemical potential, where particle-hole symmetry and the associated half-filled sign-free condition are absent. Finally, we demonstrate the advantage of locality-preserving mappings in higher-dimensional fermionic systems, where the conventional Jordan-Wigner (JW) transformation generates increasingly long Pauli strings and corresponding circuit overheads. We further extend the framework to the spinful Fermi-Hubbard model and identify a tradeoff between fermionic-mode placement and the locality of hopping and on-site interaction terms. These results establish a practical framework combining locality-preserving fermion-to-qubit mappings, constraint-preserving Clifford state preparation, and symmetry-preserving variational circuits, that trades auxiliary-qubit and stabilizer-preparation overhead for reduced operator nonlocality, providing a practical route toward resource-efficient quantum simulation of higher-dimensional interacting fermionic systems.", "url": "https://arxiv.org/abs/2609.16142", "type": "理论+数值", "summary": "我们研究了保局性 Derby-Klassen (DK) 费米子到量子位映射 [ arXiv:2003.06939 ] 在二维 $t$-$V$ 和 Fermi-Hubbard 模型的变分量子模拟中的实用性。 DK 映射保留了费米子相互作用与扩大的希尔伯特空间的局部性，因此需要定义物理扇区的额外约束。我们通过 Clifford 门状态准备将这些约束直接合并到哈密顿变分分析 (HVA) 中，并使用变分量子本征解算器 (VQE) 来表明所得到的量子位哈密顿量的低能特性被准确再现。我们进一步利用 ansätz 中固有的粒子数守恒来解决不同的对称扇区并可靠地访问简并态。因此，我们在非零化学势下将 DK-HVA 与基于 Jordan-Wigner 的变分电路进行基准测试，其中粒子空穴对称性和相关的半填充无符号条件不存在。\n\n最后，我们展示了在高维费米子系统中保留局部性映射的优势，其中传统的 Jordan-Wigner (JW) 变换生成越来越长的泡利弦和相应的电路开销。我们进一步将该框架扩展到自旋费米-哈伯德模型，并确定费米子模式放置与跳跃局部性和现场相互作用项之间的权衡。这些结果建立了一个实用的框架，结合了保局性费米子到量子位映射、保留约束的 Clifford 状态准备和保对称性变分电路，以辅助量子位和稳定器准备开销来减少算子非局域性，为高维相互作用费米子系统的资源高效量子模拟提供了一条实用途径。", "authors": [{"name": "Ashutosh P. Tripathi"}, {"name": "Debasish Banerjee"}, {"name": "Sandip Maiti"}, {"name": "Nilmani Mathur"}], "featured_authors": [{"name": "Ashutosh P. Tripathi"}, {"name": "Debasish Banerjee"}, {"name": "Sandip Maiti"}, {"name": "Nilmani Mathur"}], "author_count": 4}, {"id": "2609.16198", "category": "quant-ph", "title": "Utility-Based Path Selection and Configuration in Quantum Networks via Layered Shortest Paths", "abstract": "A path in a quantum network is a chain of repeaters that distributes entanglement between two users. Selecting a path requires balancing the rate and quality (e.g., fidelity) of the delivered entanglement, but these quantities, unlike standard routing metrics, compose non-additively. The problem is compounded by link-level configuration choices (e.g., distillation rounds or emitter brightness tuning), each trading rate against fidelity, so that a path's performance depends jointly on its route and its per-link settings. We cast this joint path selection and configuration problem as a shortest path computation on a layered graph whose layers track discretized end-to-end fidelity. A single run returns the full rate fidelity Pareto frontier, from which the path maximizing any nondecreasing utility function of rate and fidelity can be selected. We prove that for certain utility functions (including the secret key rate of BB84), the method is a fully polynomial time approximation scheme, returning a near-optimal path within a specified tolerance. We further characterize exactly when cheaper scalarization-based routing suffices: it is optimal for utility functions with convex fidelity profiles, but can be arbitrarily suboptimal otherwise (e.g., for step-like, sigmoidal utilities), whereas the layered method remains reliable in all cases.", "url": "https://arxiv.org/abs/2609.16198", "type": "理论", "summary": "量子网络中的路径是在两个用户之间分配纠缠的中继器链。选择路径需要平衡所传递的纠缠的速率和质量（例如保真度），但这些数量与标准路由度量不同，是非相加的。链路级配置选择（例如，蒸馏循环或发射器亮度调整）、每个保真度的交易率使问题变得更加复杂，因此路径的性能共同取决于其路由和每个链路的设置。我们将此联合路径选择和配置问题视为分层图上的最短路径计算，该图的层跟踪离散的端到端保真度。单次运行返回全速率保真度帕累托前沿，从中可以选择最大化速率和保真度的任何非递减效用函数的路径。我们证明，对于某些效用函数（包括 BB84 的密钥率），该方法是完全多项式时间近似方案，返回指定容差内的接近最优路径。\n\n我们进一步准确地描述了何时更便宜的基于标量化的路由就足够了：它对于具有凸保真度分布的效用函数是最优的，但在其他情况下可能是任意次优的（例如，对于阶梯式、S形效​​用），而分层方法在所有情况下仍然可靠。", "authors": [{"name": "Leonardo Bacciottini"}, {"name": "Subhransu Maji"}, {"name": "Don Towsley"}, {"name": "Gayane Vardoyan"}], "featured_authors": [{"name": "Leonardo Bacciottini"}, {"name": "Subhransu Maji"}, {"name": "Don Towsley"}, {"name": "Gayane Vardoyan"}], "author_count": 4}, {"id": "2609.16200", "category": "quant-ph", "title": "Coupling Structure Determines Communication Regimes in Discrete Quantum Convolutional Channels", "abstract": "We study the recently developed theory of quantum convolution for discrete-variable quantum systems. We classify the discrete quantum convolutional channels generated by an invertible $2\\times2$ coupling matrix and a fixed environmental state according to which entries of the coupling ma- trix vanish. Under role-preserving basis relabelings, matrices with all four entries nonzero form $d-2$ canonical cross-ratio classes, whereas matrices with exactly one vanishing entry split into four inequivalent branches. We determine the optimized one-shot Holevo information and the classical, quantum, and private capacities for all four one-entry-vanishing branches. If a diago- nal entry vanishes, the channel is an entanglement-breaking measure-and-prepare orbit channel: its classical capacity equals a relative entropy coherence of the environmental state, whereas its quantum and private capacities vanish. If an off-diagonal entry vanishes, the channel is a degradable generalized-dephasing channel: one complete orthonormal basis is transmitted without error, whereas the quantum and private capacities are determined by the entropy deficit of the environ-ental state after dephasing in the conjugate basis. Thus, the position of a single vanishing entry selects two qualitatively different communication regimes. When all four entries are nonzero, the channels are irreducibly Weyl covariant, reducing the classical-capacity problem to a regularized minimum-output-entropy problem. For the unique fully nonzero coupling class in the single-qutrit case, we further derive an exact Holevo formula for a depolarized one-parameter family and identify its entanglement-breaking threshold.", "url": "https://arxiv.org/abs/2609.16200", "type": "理论+数值", "summary": "我们研究最近发展的离散变量量子系统的量子卷积理论。我们根据耦合矩阵的条目消失对由可逆 $2\\times2$ 耦合矩阵和固定环境状态生成的离散量子卷积通道进行分类。在角色保留基础重新标记下，所有四个条目均非零的矩阵形成 $d-2$ 规范交叉比类，而只有一个消失条目的矩阵则分为四个不等价的分支。我们确定了所有四个单项消失分支的优化单次 Holevo 信息以及经典、量子和私有容量。如果对角线条目消失，则该通道是一个打破纠缠的测量和准备轨道通道：其经典容量等于环境状态的相对熵相干性，而其量子和私人容量消失。\n\n如果非对角线条目消失，则该信道是可降解的广义相移信道：一个完整​​的正交基可以无差错地传输，而量子和私有容量则由共轭基相移后环境状态的熵亏确定。因此，单个消失条目的位置选择了两种性质不同的通信机制。当所有四个条目均非零时，通道是不可约的 Weyl 协变，将经典容量问题简化为正则化最小输出熵问题。对于单量子态中独特的完全非零耦合类，我们进一步推导了去极化单参数族的精确 Holevo 公式，并确定了其纠缠破坏阈值。", "authors": [{"name": "Chunhe Xiong"}], "featured_authors": [{"name": "Chunhe Xiong"}], "author_count": 1}, {"id": "2609.16208", "category": "quant-ph", "title": "Link-middle-cut lower bounds for Clifford circuit synthesis", "abstract": "Minimizing the number of CNOT gates required to synthesize a Clifford operator is a central problem in quantum circuit optimization. We extend the link--middle--cut (LMC) framework for linear reversible circuits to Clifford operators represented by binary symplectic tableaux. By introducing block-support connectivity graphs and determinantal invariants, we obtain efficiently computable lower bounds on ancilla-free CNOT complexity. We prove that these bounds are tight for qubit permutations: a permutation of $n$ qubits with $k$ cycles requires exactly $3(n-k)$ CNOT gates, even when arbitrary one-qubit Clifford gates are available. We also derive efficiently computable bounds for synthesis up to a permutation of the output qubits, corresponding to free qubit relabeling. Finally, we further demonstrate the utility of the bound by using it as an admissible heuristic for $A^*$-based Clifford synthesis and show that, on benchmark instances, the resulting search can prove optimality beyond what was possible with earlier SAT-based methods, and that it may be used in combination with earlier $A^*$ heuristics to improve the CNOT counts obtained through heuristic search.", "url": "https://arxiv.org/abs/2609.16208", "type": "理论+数值", "summary": "最小化合成 Clifford 算子所需的 CNOT 门的数量是量子电路优化中的核心问题。我们将线性可逆电路的链路中切（LMC）框架扩展到由二元辛表表示的 Clifford 算子。通过引入块支持连接图和行列式不变量，我们获得了无辅助 CNOT 复杂性的有效可计算下界。我们证明这些界限对于量子位排列来说是严格的：具有 $k$ 周期的 $n$ 量子位的排列恰好需要 $3(n-k)$ CNOT 门，即使任意单量子位 Clifford 门可用。我们还导出了有效的可计算范围，用于合成输出量子位的排列，对应于自由量子位重新标记。最后，我们进一步证明了界限的实用性，将其用作基于 $A^*$ 的 Clifford 综合的可接受的启发式方法，并表明，在基准实例上，结果搜索可以证明超出早期基于 SAT 的方法所能达到的最优性，并且它可以与早期的 $A^*$ 启发式结合使用，以提高通过启发式搜索获得的 CNOT 计数。", "authors": [{"name": "Søren Fuglede Jørgensen"}], "featured_authors": [{"name": "Søren Fuglede Jørgensen"}], "author_count": 1}, {"id": "2609.16226", "category": "quant-ph", "title": "Error-corrected function estimation advantage in multiparameter Hamiltonians", "abstract": "We establish the ultimate precision limits for estimating a function of multiple Hamiltonian parameters in the presence of Markovian noise. By reducing multiparameter function estimation to an optimization over effective single-parameter embeddings, we derive tight bounds on the quantum Fisher information. We identify a necessary and sufficient functional Hamiltonian-not-in-Lindblad-span condition for Heisenberg-limited scaling in time. When this condition holds, we construct a code that simultaneously removes the noise and nuisance Hamiltonian parameters while preserving the target signal. When it fails, we derive the optimal standard quantum-limit coefficient and show that it is asymptotically attainable using approximate quantum error correction. Finally, we demonstrate that direct function estimation can substantially outperform estimating all parameters individually and subsequently evaluating the function. This advantage can scale with both the evolution time and the number of parameters.", "url": "https://arxiv.org/abs/2609.16226", "type": "理论+数值", "summary": "我们建立了在存在马尔可夫噪声的情况下估计多个哈密顿参数函数的最终精度限制。通过将多参数函数估计简化为有效单参数嵌入的优化，我们得出了量子费希尔信息的严格界限。我们确定了海森堡有限时间缩放的必要且充分的函数哈密顿量不在林德布拉德范围内的条件。当这个条件成立时，我们构建一个代码，在保留目标信号的同时消除噪声和令人讨厌的哈密顿参数。当它失败时，我们得出最佳标准量子极限系数，并证明它可以使用近似量子误差校正渐近获得。最后，我们证明直接函数估计可以大大优于单独估计所有参数并随后评估函数。这种优势可以随着进化时间和参数数量的增加而扩展。", "authors": [{"name": "Erfan Abbasgholinejad"}, {"name": "Lorcán O. Conlon"}, {"name": "Sean R. Muleady"}, {"name": "Jacob Bringewatt"}, {"name": "Ali Fahimniya"}, {"name": "Yu-Xin Wang"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Erfan Abbasgholinejad"}, {"name": "Lorcán O. Conlon"}, {"name": "Sean R. Muleady"}, {"name": "Ali Fahimniya"}, {"name": "Yu-Xin Wang"}, {"name": "Alexey V. Gorshkov"}], "author_count": 7}, {"id": "2609.16266", "category": "quant-ph", "title": "Towards Surrogate Based Dequantization of Quantum Reinforcement Learning", "abstract": "In recent years, the utility of parameterized quantum circuits as function approximators has been widely studied. In the context of reinforcement learning, this approach has led to variational quantum algorithms such as quantum Q-learning. While these methods show promising empirical results, and can provide provable advantages for artificial problems, it remains unclear whether they can provide a provable quantum advantage over classical approaches for problems of practical relevance. A natural way to investigate this question is through the lens of dequantization: The construction of efficient classical algorithms capable of matching the performance of quantum variational methods. Building on recent kernel-based dequantization results for supervised learning, we take steps towards extending this surrogate-based dequantization program to reinforcement learning. Specifically, we study the simplified setting of reinforcement learning with a uniform generative model in which uniformly random state-action samples are available, which models the regime of sampling from a large experience replay buffer after sufficient exploration. Within this setting, we provide finite sample guarantees for classical kernelized Fitted Q-Iteration, with classical kernels designed to match the inductive bias of particular parameterized quantum circuits. Using these results, we then provide a set of sufficient conditions, on the data-encoding strategy of a parameterized quantum circuit, the corresponding classical kernel, and the problem structure, under which kernelized Fitted Q-Iteration provides a meaningful dequantization of quantum Q-learning, in this simplified setting. Apart from providing rigorous dequantization guarantees when these conditions are met, these results also motivate the use of kernelized fitted Q-iteration as a dequantization heuristic when these sufficient conditions cannot be verified.", "url": "https://arxiv.org/abs/2609.16266", "type": "理论+数值", "summary": "近年来，参数化量子电路作为函数逼近器的实用性已得到广泛研究。在强化学习的背景下，这种方法催生了变分量子算法，例如量子 Q 学习。虽然这些方法显示出有希望的经验结果，并且可以为人工问题提供可证明的优势，但仍不清楚它们是否可以为实际相关问题提供优于经典方法的可证明的量子优势。研究这个问题的一种自然方法是通过反量化的视角：构建能够匹配量子变分方法性能的高效经典算法。基于最近用于监督学习的基于内核的反量化结果，我们采取措施将这种基于代理的反量化程序扩展到强化学习。具体来说，我们研究了具有统一生成模型的强化学习的简化设置，其中提供统一随机状态动作样本，该模型在充分探索后对从大型经验重播缓冲区中采样的机制进行建模。\n\n在此设置中，我们为经典核化拟合 Q 迭代提供有限样本保证，经典核旨在匹配特定参数化量子电路的归纳偏差。然后，利用这些结果，我们在参数化量子电路的数据编码策略、相应的经典内核和问题结构上提供一组充分条件，在这些条件下，内核化拟合 Q 迭代在这种简化的设置中提供了量子 Q 学习的有意义的反量化。除了在满足这些条件时提供严格的反量化保证之外，这些结果还促使在无法验证这些充分条件时使用核化拟合 Q 迭代作为反量化启发式方法。", "authors": [{"name": "Pablo Rodriguez-Grasa"}, {"name": "Sofiene Jerbi"}, {"name": "Mikel Sanz"}, {"name": "Ryan Sweke"}], "featured_authors": [{"name": "Pablo Rodriguez-Grasa"}, {"name": "Sofiene Jerbi"}, {"name": "Mikel Sanz"}, {"name": "Ryan Sweke"}], "author_count": 4}, {"id": "2609.16308", "category": "quant-ph", "title": "Geometric View of Iterative Fixed-Node Dynamics", "abstract": "The sign-structure of a quantum many-body ground state is a central quantity in fixed-node approaches to mitigating the Fermion sign problem. For continuum electronic-structure Hamiltonians, the correct sign-structure is sufficient to compute exact ground state properties; on the other hand, lattice fixed-node approaches retain an additional dependence on trial wave-function amplitudes which are improved upon non-optimally while preserving their sign structure. Here we consider an iterative map obtained by repeatedly replacing the fixed-node trial state with the ground state of its associated lattice fixed-node Hamiltonian (independent of whether and how a practical algorithm could implement this iteration). We show the fixed points of this map are eigenstates of the Hamiltonian and reduced Hamiltonian resulting in at most one fixed point in the interior of each sign chamber. We prove that the ground state fixed point is stable and that the boundary of the ground state sign chamber is repulsive. This shows the amplitude dependence beyond having the correct ground state sign-structure disappears under self-consistent iteration. In other sign chambers, energy descent can be obstructed by the imposed sign structure; this tension leads to the iteration driving select amplitudes to zero producing `support collapse' onto chamber boundaries and corresponding to reduced Hamiltonians. Excited-state fixed points are therefore provably unstable and flow toward lower-energy boundary fixed points. We show sign chamber boundaries have a directional stability; boundary points attractive in one direction are repulsive under a sign flip. By revealing the geometry and stability structure of iterative fixed-node dynamics, our results clarify the foundations of a central approach to the Fermion sign problem and motivate potential new algorithmic strategies.", "url": "https://arxiv.org/abs/2609.16308", "type": "理论+数值", "summary": "量子多体基态的符号结构是缓解费米子符号问题的固定节点方法中的核心量。对于连续电子结构哈密顿量，正确的符号结构足以计算精确的基态性质；另一方面，点阵固定节点方法保留了对试验波函数振幅的额外依赖性，该振幅在非最优的基础上进行了改进，同时保留了其符号结构。在这里，我们考虑通过用其关联的格子固定节点哈密顿量的基态重复替换固定节点试验状态而获得的迭代图（与实际算法是否以及如何实现此迭代无关）。我们证明该映射的固定点是哈密顿量的本征态和简化哈密顿量，从而在每个符号室内部最多产生一个固定点。我们证明了基态不动点是稳定的，并且基态符号室的边界是排斥的。这表明在自洽迭代下，除了正确的基态符号结构之外，幅度依赖性消失了。\n\n在其他符号室中，强加的符号结构可能会阻碍能量下降；这种张力导致迭代驱动选择的振幅为零，产生室边界上的“支撑塌陷”并对应于减少的哈密顿量。因此，激发态固定点被证明是不稳定的，并且流向较低能量的边界固定点。我们表明标志室边界具有方向稳定性；在一个方向上有吸引力的边界点在符号翻转下是排斥的。通过揭示迭代固定节点动力学的几何结构和稳定性结构，我们的结果阐明了费米子符号问题的中心方法的基础，并激发了潜在的新算法策略。", "authors": [{"name": "Pranav Kairon"}, {"name": "Bryan K. Clark"}], "featured_authors": [{"name": "Pranav Kairon"}, {"name": "Bryan K. Clark"}], "author_count": 2}, {"id": "2609.16352", "category": "quant-ph", "title": "qdmag: A Python package for simulating nonequilibrium magnetization of molecules using quantum master equations", "abstract": "We present qdmag, a computational utility for calculating the magnetization of magnetic molecules in a time-varying external magnetic field by solving a generalized Lindblad quantum master equation with spin-phonon coupling treated as a dissipation term. The package relies on the spin Hamiltonian formalism, which includes both the magnetic exchange interactions and the zero-field splitting (ZFS) interaction. Different types of magnetic exchange interaction and ZFS terms up to 12th order, which are written in terms of the extended Stevens operators, are supported. qdmag enables long-time evolution of magnetization for up to a few milliseconds, which is achieved through a staircase approximation of the magnetic field as a function of time. For high-dimensional spin Hamiltonians, a lower-dimensional effective Hamiltonian is constructed to make the calculations computationally feasible. Three case studies of one-spin, two-spin, and three-spin systems are presented to demonstrate the usage of qdmag. Our work offers a computational tool to bridge the gap between theoretical development and numerical calculations of spin dynamics in the presence of spin-phonon coupling.", "url": "https://arxiv.org/abs/2609.16352", "type": "理论+数值", "summary": "我们提出了 qdmag，一种计算实用程序，用于通过求解广义 Lindblad 量子主方程（将自旋声子耦合视为耗散项）来计算时变外部磁场中磁性分子的磁化强度。该软件包依赖于自旋哈密顿形式主义，其中包括磁交换相互作用和零场分裂（ZFS）相互作用。支持不同类型的磁交换相互作用和高达 12 阶的 ZFS 项，这些项以扩展史蒂文斯算子的形式编写。 qdmag 能够实现长达几毫秒的磁化强度的长时间演化，这是通过磁场随时间的阶梯近似而实现的。对于高维自旋哈密顿量，构造低维有效哈密顿量以使计算在计算上可行。提出了一次旋转、两次旋转和三次旋转系统的三个案例研究来演示 qdmag 的用法。我们的工作提供了一种计算工具，可以弥合自旋声子耦合情况下自旋动力学的理论发展和数值计算之间的差距。", "authors": [{"name": "Shuanglong Liu"}, {"name": "Xiao Chen"}, {"name": "Andrew Cupo"}, {"name": "James N. Fry"}, {"name": "Hai-Ping Cheng"}], "featured_authors": [{"name": "Shuanglong Liu"}, {"name": "Xiao Chen"}, {"name": "Andrew Cupo"}, {"name": "James N. Fry"}, {"name": "Hai-Ping Cheng"}], "author_count": 5}, {"id": "2609.16460", "category": "quant-ph", "title": "Environmental records unlock universal quantum computation from thermal decoherence", "abstract": "At a fixed thermal exposure, the same stabilizer processor can be classically simulable or quantum universal, depending on which environmental records its controller retains. We give an exact computational classification of energy-counting thermal-idle instruments in a quantum processor with ideal stabilizer control and independent local Markov baths. The relaxation time $T_1$, homogeneous coherence time $T_2$, and equilibrium excited-state population $p_e$ determine an exact computational boundary at $(1-p_e)T_2/T_1=1$. If every location lies at or below it, branchwise nonnegative stabilizer decompositions give an explicit efficient classical sampler for the adaptive circuit and its full time-resolved exchange record. Above it at a single repeatedly accessible location, a suitable idle duration and no-exchange conditioning supply distillable ancillas and enable universal quantum computation with polynomial overhead. At finite temperature on the resource side, erasing the record at a sufficiently long, unsplit exposure makes the averaged channel stabilizer measure-and-prepare, and even a terminal parity check then yields only simulable branches. Yet at that same exposure, retaining only the bit recording whether any exchange occurred still heralds distillable ancillas, because a thermal round trip restores the parity after its first exchange has already removed the coherence.", "url": "https://arxiv.org/abs/2609.16460", "type": "理论+数值", "summary": "在固定的热暴露下，相同的稳定器处理器可以是经典模拟的或量子通用的，具体取决于其控制器保留的环境记录。我们在具有理想稳定器控制和独立局部马尔可夫浴的量子处理器中给出了能量计数热闲置仪器的精确计算分类。弛豫时间 $T_1$、均匀相干时间 $T_2$ 和平衡激发态布居 $p_e$ 确定 $(1-p_e)T_2/T_1=1$ 处的精确计算边界。如果每个位置都位于或低于它，则分支非负稳定器分解为自适应电路及其全时间解析交换记录提供显式有效的经典采样器。在其上方的一个可重复访问的位置，适当的空闲时间和无交换条件提供了可蒸馏的辅助功能，并实现了具有多项式开销的通用量子计算。在资源侧的有限温度下，以足够长的不分割曝光擦除记录使得平均通道稳定器进行测量和准备，甚至终端奇偶校验也仅产生可模拟的分支。\n\n然而，在相同的暴露下，仅保留记录是否发生任何交换的位仍然预示着可蒸馏的辅助，因为热往返在其第一次交换已经消除了一致性之后恢复了奇偶校验。", "authors": [{"name": "Chenfeng Cao"}, {"name": "Qi Zhao"}], "featured_authors": [{"name": "Chenfeng Cao"}, {"name": "Qi Zhao"}], "author_count": 2}, {"id": "2609.16490", "category": "quant-ph", "title": "A complete classification of the existence of finite-dimensional quantum solutions to inconsistent linear constraint systems", "abstract": "Linear constraint systems (LCS) provide a compact algebraic language for nonlocal games and state-independent contextuality. In the binary case the Mermin--Peres square shows that inconsistent LCS can be solved by promoting variables to local Pauli operators, whereas a series of no-go results excludes analogous Pauli-, Clifford- and monomial unitary-based constructions at odd prime modulus. We first isolate the reason for this difference: for tensor-product quantum solutions, the obstruction to a classical solution of a LCS over $\\mathbb{Z}_n$ decomposes into obstruction classes carried by the individual factors. As a consequence, a genuinely global obstruction cannot arise solely by tensoring locally unobstructed systems. The argument is specific to odd modulus; at even modulus the reordering phase need not vanish, as in Pauli-based examples. Given this distinction, we instead associate LCS to finite arrangements of rank-one projectors and resolutions of the identity in finite-dimensional vector spaces. Quantum solvability for such LCS is automatic and the search for a quantum-classical gap rests entirely on proving classical unsatisfiability of the underlying modular incidence problem of the arrangement. By relating such LCS with group-valued frame functions, we identify a family of examples in the work of [Harding, Jager, and Smith, Int. J. Theor. Phys. 44, 539 (2005)]. To establish the (non)existence of classically unsatisfiable LCS over $\\mathbb{Z}_n$ with quantum solutions in all dimensions $d$ and for all $n\\in\\mathbb{N}$, we further construct explicit examples for the cases $d=n$ prime. Our main result thus positively resolves the existence problem of such LCS beyond the binary case: such systems exist if and only if $d\\geq 3$ and $\\gcd(n,d)>1$. Moreover, we establish the existence of LCS with a quantum-classical gap over finite fields if and only if $d\\geq 3$ and $p\\mid d$.", "url": "https://arxiv.org/abs/2609.16490", "type": "理论+数值", "summary": "线性约束系统（LCS）为非局部博弈和状态无关的上下文提供了一种紧凑的代数语言。在二元情况下，Mermin--Peres 方表明，不一致的 LCS 可以通过将变量提升为局部 Pauli 算子来解决，而一系列不可行的结果排除了奇素数模数处类似的 Pauli、Clifford 和单项酉结构。我们首先找出这种差异的原因：对于张量积量子解，$\\mathbb{Z}_n$ 上的 LCS 经典解的障碍分解为由各个因子携带的障碍类。因此，真正的全局障碍不能仅通过张紧局部无障碍系统来产生。该参数特定于奇模数；在偶数模下，重新排序阶段不需要消失，如基于泡利的例子。鉴于这种区别，我们将 LCS 与一级投影仪的有限排列和有限维向量空间中的恒等式分辨率相关联。\n\n这种 LCS 的量子可解性是自动的，并且对量子经典间隙的搜索完全取决于证明该排列的基础模关联问题的经典不满足性。通过将此类 LCS 与群值框架函数联系起来，我们在 [Harding、Jager 和 Smith，Int. 的工作中确定了一系列示例。 J.理论。物理。 44, 539 (2005)]。为了在所有维度 $d$ 和所有 $n\\in\\mathbb{N}$ 上建立在 $\\mathbb{Z}_n$ 上经典不可满足的 LCS 的（不）存在性以及所有 $n\\in\\mathbb{N}$ 的量子解，我们进一步为 $d=n$ 素数的情况构造显式示例。因此，我们的主要结果积极地解决了这种超出二元情况的 LCS 的存在问题：当且仅当 $d\\geq 3$ 和 $\\gcd(n,d)>1$ 时，这种系统才存在。此外，当且仅当 $d\\geq 3$ 和 $p\\mid d$ 时，我们建立了有限域上具有量子经典间隙的 LCS 的存在。", "authors": [{"name": "Markus Frembs"}], "featured_authors": [{"name": "Markus Frembs"}], "author_count": 1}, {"id": "2609.16507", "category": "quant-ph", "title": "Exact Ionization Amplitudes for a Delta-Function Well in an Arbitrary-Strength DC Electric Field", "abstract": "We investigate finite-time field-induced ionization from a one-dimensional attractive delta-function well in a uniform dc electric field of arbitrary strength. Our aim is to determine the physical bound-state survival amplitude \\(a_b(t)\\) at any observation time without constructing the complete time-dependent propagator or wavefunction. In the gauge-equivalent Kramers--Henneberger representation, the field appears as motion of the contact point, and the resulting dynamics reduces to a closed Volterra equation. Exact endpoint-phase factorization organizes the full chronological rescattering history into a relative-time convolution hierarchy and an exact resolvent. By introducing the accumulated bound-state amplitude and reorganizing its two-time domain in relative and complementary center times, the final contact contribution becomes an explicit boundary integral. All spatial integrations are carried out analytically. The field-driven contact-free term is obtained in closed form using the Faddeeva function, while the direct and repeated-rescattering terms are expressed as explicitly evaluable time integrals. The result applies at arbitrary dc-field strength and finite time, with no weak-field expansion, rescattering truncation, or asymptotic-time approximation. It is verified through the exact field-free limit and an independent numerical solution of the original physical Volterra equation. The formulation gives an exact nonperturbative solution of a fundamental ionization model and reveals otherwise hidden analytical structure in driven quantum dynamics.", "url": "https://arxiv.org/abs/2609.16507", "type": "理论+数值", "summary": "我们研究了任意强度的均匀直流电场中一维吸引δ函数井的有限时间场诱导电离。我们的目标是确定任何观察时间的物理束缚态生存幅度\\(a_b(t)\\)，而不构建完整的时间相关传播器或波函数。在规范等效的 Kramers-Henneberger 表示中，场表现为接触点的运动，所得动力学简化为闭合 Volterra 方程。精确端点相位分解将完整的时间顺序重散射历史组织成相对时间卷积层次结构和精确解析。通过引入累积的束缚态振幅并在相对和互补的中心时间中重新组织其两时域，最终的接触贡献成为显式边界积分。所有空间积分都是通过分析进行的。场驱动的无接触项是使用 Faddeeva 函数以封闭形式获得的，而直接和重复重散射项则表示为明确可评估的时间积分。\n\n结果适用于任意直流场强度和有限时间，没有弱场扩展、重散射截断或渐近时间近似。通过精确的无场极限和原始物理Volterra方程的独立数值解对其进行了验证。该公式给出了基本电离模型的精确非微扰解，并揭示了驱动量子动力学中隐藏的分析结构。", "authors": [{"name": "Ilki Kim"}, {"name": "Gerald J. Iafrate"}], "featured_authors": [{"name": "Ilki Kim"}, {"name": "Gerald J. Iafrate"}], "author_count": 2}, {"id": "2609.16542", "category": "quant-ph", "title": "Phantom Codes: Hardness, Rate Optimal qLDPC Constructions, and Distance Limits", "abstract": "An $[[n,k,d]]$ stabilizer code is phantom if every in-block logical CNOT gate can be realized by a permutation of its physical qubits. This eliminates the large and complicated physical overhead normally required for logical entangling gates. Yet this symmetry is highly restrictive: phantom codes are rare, the number of logical qubits is limited to $k=O(\\log n)$, and no phantom qLDPC family with growing logical dimension was previously known. We make three contributions. 1. We prove that recognizing phantomness of a given stabilizer code is at least as hard as Graph Isomorphism, even for CSS codes encoding only $k=2$ logical qubits. 2. We propose the first rate optimal phantom qLDPC families: for every fixed $D$, our CSS families achieve the maximal logical scaling $k=\\Theta(\\log n)$ and distance $d\\geq D$. 3. We prove a distance no-go theorem: every phantom code family with $k=\\omega(\\sqrt{\\log n})$ and check weight $w=O(1)$ satisfies $d\\leq w$ for sufficiently large $n$. Thus our fixed-distance qLDPC families are distance-scaling optimal at the maximal logical scaling $k=\\Theta(\\log n)$.", "url": "https://arxiv.org/abs/2609.16542", "type": "理论", "summary": "如果每个块内逻辑 CNOT 门都可以通过其物理量子位的排列来实现，则 $[[n,k,d]]$ 稳定器代码是幻像的。这消除了逻辑纠缠门通常所需的大量且复杂的物理开销。然而，这种对称性具有高度限制性：幻像代码很少见，逻辑量子位的数量仅限于 $k=O(\\log n)$，并且以前不知道具有不断增长的逻辑维度的幻像 qLDPC 系列。我们做出三项贡献。 1. 我们证明，识别给定稳定器代码的幻像至少与图同构一样困难，即使对于仅编码 $k=2$ 逻辑量子位的 CSS 代码也是如此。 2. 我们提出了一流的最优模体 qLDPC 系列：对于每个固定的 $D$，我们的 CSS 系列实现了最大逻辑缩放 $k=\\Theta(\\log n)$ 和距离 $d\\geq D$。 3. 我们证明一个距离不可行定理：每个具有 $k=\\omega(\\sqrt{\\log n})$ 的幻影码族，并且检查权值 $w=O(1)$ 满足 $d\\leq w$ 对于足够大的 $n$。因此，我们的固定距离 qLDPC 系列在最大逻辑缩放 $k=\\Theta(\\log n)$ 下是距离缩放最优的。", "authors": [{"name": "Rui Mao"}, {"name": "Weixiao Sun"}, {"name": "Shengyu Zhang"}], "featured_authors": [{"name": "Rui Mao"}, {"name": "Weixiao Sun"}, {"name": "Shengyu Zhang"}], "author_count": 3}, {"id": "2609.16549", "category": "quant-ph", "title": "Pretty good quantum state transfer via transcendental edge weights", "abstract": "We prove that if we take a rooted product of a circulant graph with universal perfect state transfer with a path of fixed length whose end edge is weighted with a transcendental number, then there is pretty good state transfer between any pair of endpoints of these paths. As a consequence, in a path with an even number of vertices with transcendental weights on the two edges incident to the endpoints, there is pretty good state transfer.", "url": "https://arxiv.org/abs/2609.16549", "type": "理论", "summary": "我们证明，如果我们采用具有通用完美状态转移的循环图的根乘积，该循环图具有固定长度的路径，其末端边缘用超越数加权，那么这些路径的任何一对端点之间都存在相当好的状态转移。因此，在具有偶数个顶点且在与端点相关的两条边上具有超越权重的路径中，存在相当好的状态转移。", "authors": [{"name": "Addison Ballif"}, {"name": "Mark Kempton"}, {"name": "James B. Larsen"}, {"name": "Kellon Sandall"}, {"name": "Christino Tamon"}, {"name": "Trevor Wai"}], "featured_authors": [{"name": "Addison Ballif"}, {"name": "Mark Kempton"}, {"name": "James B. Larsen"}, {"name": "Kellon Sandall"}, {"name": "Christino Tamon"}, {"name": "Trevor Wai"}], "author_count": 6}, {"id": "2609.16608", "category": "quant-ph", "title": "Strong converse for the quantum capacity of the pure-loss bosonic channel", "abstract": "This paper reports the proof of a strong converse for the unconstrained quantum capacity of the pure-loss bosonic channel. At every fixed rate above capacity, the entanglement-generation fidelity of every code is bounded by a constant times the reciprocal of the number of channel uses. The bound holds without an energy constraint and for arbitrary encoded states, including states correlated across all input modes, and arbitrary joint decoders. The proof combines quantum Chebyshev and hockey-stick testing inequalities with a uniform relative-entropy-variance bound for the balanced pure-loss channel, corresponding to transmissivity $\\eta=1/2$. The variance bound follows by expressing the balanced beam splitter in bright and dark modes: the dark modes are exactly in vacuum, and any state orthogonal to that vacuum contains at least one dark photon. For general transmissivity, dilating the degrading attenuator reduces the problem to this balanced-channel setting and bounds the decoder test by precisely the factor that produces the known quantum-capacity threshold. The resulting argument establishes the strong converse at the unconstrained quantum capacity for every pure-loss bosonic channel.", "url": "https://arxiv.org/abs/2609.16608", "type": "理论", "summary": "本文报告了纯损耗玻色子通道的无约束量子容量的强逆证明。在高于容量的每个固定速率下，每个代码的纠缠生成保真度受到常数乘以信道使用数量的倒数的限制。该界限在没有能量约束的情况下并且对于任意编码状态（包括跨所有输入模式和任意联合解码器相关的状态）成立。该证明将量子切比雪夫和曲棍球棒测试不等式与平衡纯损耗通道的统一相对熵方差界限结合起来，对应于透射率 $\\eta=1/2$。方差界限通过在亮模式和暗模式下表达平衡分束器来遵循：暗模式恰好处于真空中，并且与该真空正交的任何状态都包含至少一个暗光子。对于一般透射率，扩大降级衰减器可将问题减少到平衡通道设置，并通过产生已知量子容量阈值的精确因子来限制解码器测试。\n\n由此产生的论点为每个纯损耗玻色子通道的无约束量子容量建立了强逆命题。", "authors": [{"name": "Mark M. Wilde"}], "featured_authors": [{"name": "Mark M. Wilde"}], "author_count": 1}, {"id": "2609.16609", "category": "quant-ph", "title": "Floquet Dressing and Bath Spectral Effects on the Geometric Phase of a Driven Dissipative Qubit", "abstract": "Building on recent work by Wang et al. on the dissipative geometric phase (GP) in the spin-boson model (SBM), the GP dynamics of a periodically driven symmetric SBM are investigated using the numerically exact process-tensor time-evolving matrix product operator (PT-TEMPO) method. A symmetric two-level system subjected to a longitudinal monochromatic drive along the same system coordinate that couples to an Ohmic bosonic environment exhibits rich GP dynamics arising from the interplay between driving and dissipation. To isolate cooperative drive-bath effects, a non-additive GP contribution is introduced that separates the driven dissipative response from its driven-unitary and undriven-dissipative components. Periodic driving is found to either suppress or enhance bath-induced GP deformation depending on the interplay between drive and bath timescales. These trends are interpreted through Floquet spectral steering, whereby the drive redistributes the coherent dynamics among quasienergy sidebands whose transition frequencies and Fourier-resolved system-bath matrix elements determine their coupling to the environmental spectrum. Floquet analysis shows that the dominant dissipative pathways are governed jointly by Floquet matrix-element weights and bath spectral overlap, rather than by either alone. These results connect Floquet engineering, quantum dissipation, and GP dynamics and establish periodic driving as a means of controlling the GP of open quantum systems (OQSs).", "url": "https://arxiv.org/abs/2609.16609", "type": "理论+数值", "summary": "以 Wang 等人最近的工作为基础。在自旋玻色子模型（SBM）中的耗散几何相位（GP）上，使用数值精确的过程张量时间演化矩阵乘积算子（PT-TEMPO）方法研究了周期性驱动的对称SBM的GP动力学。沿同一系统坐标受到纵向单色驱动的对称两级系统耦合到欧姆玻色子环境，表现出由驱动和耗散之间的相互作用产生的丰富的 GP 动力学。为了隔离协同驱动浴效应，引入了非加性 GP 贡献，将驱动耗散响应与其驱动单一和非驱动耗散分量分开。研究发现，周期性驱动可以抑制或增强浴引起的 GP 变形，具体取决于驱动和浴时间尺度之间的相互作用。这些趋势通过 Floquet 频谱控制进行解释，驱动器在准能量边带之间重新分配相干动态，准能量边带的过渡频率和傅里叶解析系统浴矩阵元素决定了它们与环境频谱的耦合。\n\nFloquet 分析表明，主要耗散路径由 Floquet 矩阵元素权重和浴谱重叠共同控制，而不是单独受其中任何一个控制。这些结果将 Floquet 工程、量子耗散和 GP 动力学联系起来，并建立周期性驱动作为控制开放量子系统 (OQS) GP 的手段。", "authors": [{"name": "Chirag Arora"}], "featured_authors": [{"name": "Chirag Arora"}], "author_count": 1}, {"id": "2609.16659", "category": "quant-ph", "title": "Approximate synthesis of general single-qubit unitaries over the Clifford+$\\sqrt{T}$ gate set", "abstract": "For the standard Clifford+$T$ gate set, deterministic, ancilla-free synthesis now attains the minimal $T$-count for general single-qubit unitaries (Morisaki et al., arXiv:2510.05816 ). The $\\sqrt{T}$ gate rotates by half the angle of $T$, generating a finer lattice of implementable operations. It was assumed that access to this magic state lowers the cost of deterministic and ancilla-free synthesis of general single-qubit unitaries, but no direct Clifford+$\\sqrt{T}$ algorithm existed for this case. We provide one by extending the integer lattice-point enumeration method of Morisaki et al. We adopt a resource state cost model based on the magic-state catalysis approach of Gidney and Fowler ( arXiv:1812.01238 ). On Haar-random targets synthesized to precisions ranging from $\\varepsilon=10^{-3}$ to $10^{-8}$, the cost of Clifford+$\\sqrt{T}$ circuits scales as $2.4\\log_2(1/\\varepsilon)$ compared to $3.0\\log_2(1/\\varepsilon)$ for the provably $T$-count-optimal Clifford+$T$ circuits. Once a one-time catalyst state is amortized, the Clifford+$\\sqrt{T}$ circuits are never costlier than their Clifford+$T$ counterparts.", "url": "https://arxiv.org/abs/2609.16659", "type": "理论+数值", "summary": "对于标准 Clifford+$T$ 门集，确定性、无辅助合成现在可以达到一般单量子位酉的最小 $T$ 计数（Morisaki 等人，arXiv:2510.05816）。 $\\sqrt{T}$ 门旋转 $T$ 角度的一半，生成更精细的可实现操作的网格。人们假设访问这种神奇状态会降低一般单量子位酉的确定性和无辅助合成的成本，但对于这种情况不存在直接的 Clifford+$\\​​sqrt{T}$ 算法。我们通过扩展 Morisaki 等人的整数格点枚举方法提供了一种方法。我们采用基于 Gidney 和 Fowler 的魔态催化方法的资源状态成本模型 (arXiv:1812.01238)。在合成精度范围从 $\\varepsilon=10^{-3}$ 到 $10^{-8}$ 的 Haar 随机目标上，Clifford+$\\sqrt{T}$ 电路的成本为 $2.4\\log_2(1/\\varepsilon)$，而对于可证明的 $T$-count-optimal Clifford+$T$ 电路的成本为 $3.0\\log_2(1/\\varepsilon)$电路。一旦一次性催化剂状态被摊销，Clifford+$\\​​sqrt{T}$ 电路永远不会比 Clifford+$T$ 电路更昂贵。", "authors": [{"name": "Mathias Weiden"}, {"name": "Jae Won Kim"}, {"name": "Justin Kalloor"}, {"name": "John Kubiatowicz"}, {"name": "Costin Iancu"}], "featured_authors": [{"name": "Mathias Weiden"}, {"name": "Jae Won Kim"}, {"name": "Justin Kalloor"}, {"name": "John Kubiatowicz"}, {"name": "Costin Iancu"}], "author_count": 5}, {"id": "2609.16726", "category": "quant-ph", "title": "Improved Separations between Quantum and Classical Communication Complexity of Total Functions", "abstract": "We refine Gavinsky's framework ( arXiv:2608.18784 ) for exponential separations between quantum and randomized communication complexity of total functions and obtain larger separations: polylogarithmic quantum communication versus $\\tilde\\Omega(\\sqrt n)$ randomized communication with two quantum messages, and versus $\\Omega(n^{1-\\varepsilon})$ for every fixed $0<\\varepsilon<1$ with more quantum messages.", "url": "https://arxiv.org/abs/2609.16726", "type": "理论", "summary": "我们改进了 Gavinsky 的框架（ arXiv:2608.18784 ），以实现总函数的量子和随机通信复杂性之间的指数分离，并获得更大的分离：多对数量子通信与 $\\tilde\\Omega(\\sqrt n)$ 具有两个量子消息的随机通信，以及与 $\\Omega(n^{1-\\varepsilon})$ 对于每个固定的 $0<\\varepsilon<1$ 与更多量子消息。", "authors": [{"name": "François Le Gall"}], "featured_authors": [{"name": "François Le Gall"}], "author_count": 1}, {"id": "2609.16781", "category": "quant-ph", "title": "Initial-Slip Dynamics Enables the Quantum Mpemba Effect", "abstract": "We investigate the quantum Mpemba effect, whereby a system initially farther from equilibrium relaxes faster than one initially closer to equilibrium, emerging in a quantum harmonic oscillator linearly coupled to a bosonic environment. Starting from factorized thermal states at different temperatures, we derive exact analytical criteria for the occurrence of the quantum Mpemba effect valid also beyond the typically considered weak-coupling and Markovian approximations. Most importantly, we show that the effect is enabled by the initial-slip dynamics generated by the sudden switch-on of the system-bath interaction. Neglecting this contribution completely suppresses the anomalous relaxation, identifying transient system-bath correlations as the key ingredient underlying the quantum Mpemba effect.", "url": "https://arxiv.org/abs/2609.16781", "type": "理论", "summary": "我们研究了量子 Mpemba 效应，即最初远离平衡的系统比最初接近平衡的系统松弛得更快，出现在与玻色环境线性耦合的量子谐振子中。从不同温度下的分解热态开始，我们得出了量子 Mpemba 效应发生的精确分析标准，该标准也超出了通常考虑的弱耦合和马尔可夫近似。最重要的是，我们表明这种效应是由系统与浴相互作用的突然开启产生的初始滑移动力学实现的。忽略这种贡献会完全抑制异常弛豫，从而将瞬态系统浴相关性识别为量子姆彭巴效应的关键成分。", "authors": [{"name": "M. Crotti"}, {"name": "F. Cavaliere"}, {"name": "D. Ferraro"}, {"name": "G. Benenti"}, {"name": "M. Sassetti"}], "featured_authors": [{"name": "M. Crotti"}, {"name": "F. Cavaliere"}, {"name": "D. Ferraro"}, {"name": "G. Benenti"}, {"name": "M. Sassetti"}], "author_count": 5}, {"id": "2609.16813", "category": "quant-ph", "title": "TSS Graphs for Hadamard Matrices: Real vs Complex", "abstract": "We have observed that Hadamard matrices whether real or complex lead to a dense output of identical probabilities for any given single input state. Complex Hadamard matrices have unusual orders and introduce phase which prove useful when controlled phase transformation gates are used. By taking a superposed combinations of input states, we discovered that the Hadamards generate non-uniform probabilities which is practically significant towards amplitude amplification without the need for manual parameterization like Grover's operator~\\cite{grover1996}. A variety of graph theoretic properties are applied to TSS graphs and their trends were explored. Additionally, graphs turn out to be nearly isomorphic for the same set of input states which has potential applications for developing Quantum Algorithms. Keywords: Quantum Algorithms, Hadamard Matrices, Unitary Matrix Approach, Topological Structure of Superpositions (TSS), Graph Theory", "url": "https://arxiv.org/abs/2609.16813", "type": "理论+数值", "summary": "我们观察到，哈达玛矩阵无论是实数还是复数都会导致任何给定的单个输入状态的相同概率的密集输出。复杂的 Hadamard 矩阵具有不寻常的阶数并引入相位，这在使用受控相变门时证明是有用的。通过输入状态的叠加组合，我们发现哈达马产生非均匀概率，这对于幅度放大实际上很重要，而不需要像 Grover 算子那样进行手动参数化~\\cite{grover1996}。将各种图论特性应用于 TSS 图并探讨了它们的趋势。此外，对于同一组输入状态，图几乎是同构的，这对于开发量子算法具有潜在的应用。关键词：量子算法、哈达玛矩阵、酉矩阵方法、叠加拓扑结构 (TSS)、图论", "authors": [{"name": "Wesley Lewis"}, {"name": "Darsh Pareek"}, {"name": "Ravi Janjam"}], "featured_authors": [{"name": "Wesley Lewis"}, {"name": "Darsh Pareek"}, {"name": "Ravi Janjam"}], "author_count": 3}, {"id": "2609.16851", "category": "quant-ph", "title": "Understanding the spin coherence of molecular photoexcited triplet states from first principles", "abstract": "Optically readable molecular spins are attractive as quantum sensors due to their nanoscale modularity, synthetic tunability, and scope for sensitive readout. In particular, photoexcited spin-triplet states in organic molecules are appealing in supporting high optical-spin contrast at room temperature. Their utility is underpinned by their coherence, which warrants a detailed understanding of it. Here, from first principles, we systematically explore the Hahn-echo decoherence of the benchmark molecular system for room-temperature optically detected spin coherence---pentacene guest molecules coupled to a para-terphenyl host. Using generalized cluster-correlation expansion methods, we investigate the mechanisms of nuclear-spin-induced decoherence from zero to high magnetic field, exploring the role of guest vs host molecules, specific nuclei, zero-field splitting interactions, and hyperfine parameters. We describe how zero-field decoherence is driven by ~6 nuclei on the guest, while high-field decoherence is driven by ~600 nuclei in the host; how the longitudinal zero-field splitting parameter, $D$, can prolong $T_2$; and the magnetic-field-dependent processes which drive decoherence. These results advance our understanding of decoherence in optically readable molecular spins, providing insight for their synthetic enhancement and deployment as quantum probes.", "url": "https://arxiv.org/abs/2609.16851", "type": "理论", "summary": "光学可读的分子自旋由于其纳米级模块化、合成可调性和灵敏读出范围而作为量子传感器很有吸引力。特别是，有机分子中的光激发自旋三重态在支持室温下的高光学自旋对比度方面具有吸引力。它们的实用性是以它们的连贯性为基础的，这需要对其进行详细的理解。在这里，我们从第一原理出发，系统地探索了室温光学检测自旋相干基准分子系统的哈恩回波退相干性——与对三联苯主体偶联的并五苯客体分子。使用广义簇相关展开方法，我们研究了从零到高磁场的核自旋引起的退相干机制，探索客体分子与主体分子、特定核、零场分裂相互作用和超精细参数的作用。\n\n我们描述了客体上约 6 个原子核如何驱动零场退相干，而主体上约 600 个原子核驱动高场退相干；纵向零场分裂参数$D$如何延长$T_2$；以及驱动退相干的磁场相关过程。这些结果增进了我们对光学可读分子自旋退相干的理解，为其合成增强和作为量子探针的部署提供了见解。", "authors": [{"name": "Ecaterina Păunică"}, {"name": "Sam L. Bayliss"}], "featured_authors": [{"name": "Ecaterina Păunică"}, {"name": "Sam L. Bayliss"}], "author_count": 2}, {"id": "2609.16901", "category": "quant-ph", "title": "Portable Vector NV-Diamond Magnetometer for Shot-Noise-Limited, Drift-Free Operation in Unshielded Environments", "abstract": "Ensemble nitrogen-vacancy (NV) diamond magnetometers combine high sensitivity with vector-field reconstruction, but practical deployment is limited by errors arising from high-frequency laser noise during short-duration operations and slow-varying gain fluctuations and offset drift during long-term operation. Here, we present an integrated digital architecture for achieving NV magnetometry stability across distinct timescales. A dynamic differential readout continuously balances fluorescence and reference channels to suppress correlated laser noise. Second-derivative Lorentzian lineshape tracking enables in-situ correction of slope variations arising from slow changes in gain and optical excitation. We further identify temperature-induced bias-magnet fluctuations as a dominant source of long-term drift and introduce a magnetic eigenvector transformation that uses the intrinsic response of NV resonances to eliminate these variations. We show, under unshielded ambient conditions, that this architecture achieves an off-resonance noise factor of 1.0 $\\pm$ 0.1, matching the fundamental limit with ten-fold suppression of long-term drift, enabling stable, field-ready quantum magnetometry.", "url": "https://arxiv.org/abs/2609.16901", "type": "理论", "summary": "系综氮空位 (NV) 金刚石磁力计将高灵敏度与矢量场重建结合在一起，但实际部署受到短时操作期间高频激光噪声以及长期操作期间缓慢变化的增益波动和偏移漂移产生的误差的限制。在这里，我们提出了一种集成数字架构，用于在不同时间尺度上实现 NV 磁力测量稳定性。动态差分读数持续平衡荧光和参考通道，以抑制相关激光噪声。二阶导数洛伦兹线形跟踪能够对因增益和光学激励的缓慢变化而引起的斜率变化进行原位校正。我们进一步确定温度引起的偏置磁体波动是长期漂移的主要来源，并引入磁特征向量变换，利用 NV 共振的固有响应来消除这些变化。我们证明，在非屏蔽环境条件下，该架构实现了 1.0 $\\pm$ 0.1 的偏共振噪声系数，与基本极限相匹配，对长期漂移的抑制达到十倍，从而实现稳定、现场就绪的量子磁力测量。", "authors": [{"name": "Annirudh K P"}, {"name": "Vinayak Rane"}, {"name": "Shradha Atakar"}, {"name": "Sanika Joshi"}, {"name": "Maheshwar Mangat"}, {"name": "Jay Gharat"}, {"name": "Siddharth Tallur"}, {"name": "Kasturi Saha"}], "featured_authors": [{"name": "Annirudh K P"}, {"name": "Vinayak Rane"}, {"name": "Shradha Atakar"}, {"name": "Jay Gharat"}, {"name": "Siddharth Tallur"}, {"name": "Kasturi Saha"}], "author_count": 8}, {"id": "2609.16938", "category": "quant-ph", "title": "Classical Communication Protocol based on Joint Classical-Quantum Coding", "abstract": "We introduce a robust quantum communication protocol that integrates classical error-control coding, entanglement distribution, and superdense coding. Classical error-correcting codes are used to mitigate dark counts and photon losses by determining the positions of qubit transmissions and protecting the data embedded through superdense coding. We derive conditions on the employed codes that guarantee successful error correction under a bounded error-frequency model. Moreover, upper bounds are derived on the performance of conventional superdense coding protected by classical error correction. It is shown that, under the same constraints on error frequency, suitable code configurations of the proposed protocol can exceed those upper bounds both in terms of data rate and energy efficiency. Finally, we develop a physical error model based on fiber attenuation, detector efficiency, dark counts, and time-slot duration, and use it to evaluate the effective performance of different configurations of error-correcting codes. The proposed approach is primarily suited for short-distance quantum links, as in Quantum Local Area Network (QLAN) where it can provide high communication throughput while integrating entanglement distribution directly into the communication process.", "url": "https://arxiv.org/abs/2609.16938", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kristian Skafte Jensen"}, {"name": "René Bødker Christensen"}, {"name": "Čedomir Stefanović"}, {"name": "Petar Popovski"}], "featured_authors": [{"name": "Kristian Skafte Jensen"}, {"name": "René Bødker Christensen"}, {"name": "Čedomir Stefanović"}, {"name": "Petar Popovski"}], "author_count": 4}, {"id": "2609.17037", "category": "quant-ph", "title": "Eigenstate thermalization beyond the envelope: exact two-point overlap statistics in random free fermions", "abstract": "Eigenstate thermalization constrains the smooth dependence of observables on energy, but it does not by itself fix the microscopic statistics of the overlaps between many-body eigenstates and a chosen basis: the smooth envelope is a one-point statement, and the fluctuation field it leaves undetermined carries a structured two-point covariance. We establish this distinction, and solve that fluctuation field exactly, in random free fermions---an ensemble of Slater-determinant eigenstates built from a Gaussian orthogonal single-particle Hamiltonian, whose eigenstate thermalization was established by Magán. In this ensemble every channel overlap is a minor of a Haar-distributed orthogonal matrix, so its statistics follow from classical random-matrix theory. The one-point law is exactly flat for every channel, with an exact moment hierarchy that is not Porter--Thomas: small intensities are enhanced algebraically rather than by the exponential Porter--Thomas form, and the mean sector carries a negative, order-one correlation correction of purely normalization origin. The two-point covariance closes exactly at the Gaussian fixed point: it is organized by the number of one-body modes shared by two eigenstates and by the number of modes shared by two channels, and its energy-resolved form factorizes into this geometry times the classical convolution of the single-particle semicircle, from which the two-resolvent covariance follows by an integral transform. Exact finite-size computations confirm all closed forms, and the structural identities of the dictionary hold at machine precision. The results provide an exactly solvable microscopic realization of the two-point fluctuation sector underlying multi-resolvent descriptions of eigenstate thermalization: a smooth envelope does not determine fine-grained fluctuations.", "url": "https://arxiv.org/abs/2609.17037", "type": "理论+数值", "summary": "本征态热化限制了可观测量对能量的平滑依赖性，但它本身并不能修复多体本征态和选定基之间重叠的微观统计：平滑包络是单点陈述，而它留下的未确定的涨落场带有结构化的两点协方差。我们在随机自由费米子中建立了这种区别，并精确地求解了涨落场——由高斯正交单粒子哈密顿量构建的斯莱特行列式本征态系综，其本征态热化是由 Magán 建立的。在这个集合中，每个通道重叠都是 Haar 分布正交矩阵的次要部分，因此其统计数据遵循经典随机矩阵理论。单点定律对于每个通道来说都是完全平坦的，具有非波特-托马斯的精确矩层次结构：小强度以代数方式增强，而不是通过指数波特-托马斯形式，并且平均扇区带有纯粹归一化起源的负一阶相关校正。\n\n两点协方差恰好在高斯不动点处闭合：它由两个本征态共享的单体模式的数量和两个通道共享的模式的数量组成，其能量解析形式分解为该几何乘以单粒子半圆的经典卷积，从中通过积分变换得出双分辨协方差。精确的有限大小计算确认了所有封闭形式，并且字典的结构恒等式保持机器精度。结果提供了对本征态热化的多分辨率描述基础的两点涨落扇区的精确可解的微观实现：平滑的包络并不能确定细粒度的涨落。", "authors": [{"name": "Zhiqiang Huang"}], "featured_authors": [{"name": "Zhiqiang Huang"}], "author_count": 1}, {"id": "2609.17044", "category": "quant-ph", "title": "Constant sized support state distillation with qubit recycling", "abstract": "In order to circumvent that no universal set of gates can be achieved on a given quantum error-correcting codes, additional gates can be performed through magic state injection. This however requires to have access to high fidelity magic state, which can be obtained by the distillation of low quality states to fewer higher quality ones. In this paper, we provide a family of distillation protocols able to produce diagonal states at every level of the Clifford hierarchy. This family is obtained recursively using code doubling techniques and leveraging qubit recycling, the fact that some idle qubits of the protocols can be measured and re-used. At a given level of the Clifford hierarchy, we show that the protocols we derive can be performed at arbitrary high distance on a fix number of logical qubits. This family recovers many known efficient protocols, and uncovers new ones, such as a $111 \\to 1$ protocol for $|T\\rangle$ state distillation at distance $7$, which are the most compact in term of volume. Finally, we discuss possible extension of this framework for distillation protocols producing more than one output state.", "url": "https://arxiv.org/abs/2609.17044", "type": "理论", "summary": "为了避免在给定的量子纠错码上无法实现通用的门集，可以通过魔术状态注入来执行附加的门。然而，这需要能够访问高保真魔法状态，这可以通过将低质量状态蒸馏为更少的高质量状态来获得。在本文中，我们提供了一系列蒸馏协议，能够在 Clifford 层次结构的每个级别产生对角状态。该系列是使用代码加倍技术和利用量子位回收递归获得的，事实上协议的一些空闲量子位可以被测量和重新使用。在克利福德层次结构的给定级别上，我们表明我们推导的协议可以在固定数量的逻辑量子位上以任意高的距离执行。该系列恢复了许多已知的高效协议，并发现了新的协议，例如在距离 $7$ 处进行 $|T\\rangle$ 状态蒸馏的 $111 \\to 1$ 协议，该协议在体积上是最紧凑的。最后，我们讨论了该框架对于产生多个输出状态的蒸馏协议的可能扩展。", "authors": [{"name": "Victor Barizien"}], "featured_authors": [{"name": "Victor Barizien"}], "author_count": 1}, {"id": "2609.17095", "category": "quant-ph", "title": "Probabilistic Error Cancellation for Single-Mode Gottesman-Kitaev-Preskill Codes", "abstract": "In order to solve practical problems on a quantum computer, it is necessary to use fault-tolerant quantum error correction schemes to overcome noise: the errors arising from imperfections in physical components. The Gottesman-Kitaev-Preskill (GKP) code aims at achieving this in a hardware efficient manner by encoding finite-dimensional logical subspaces in the Hilbert space of one or more continuous variable modes. In near term implementations, however, it is not feasible to eliminate errors entirely, so it is natural to also employ alternative error mitigation techniques together with error correction. In this work, we study a quantum error mitigation method known as probabilistic error cancellation in the context of the GKP code. We compare Steane-type and teleportation-based GKP error correction, and calculate the sampling overheads associated with the technique for square and hexagonal GKP codes. We employ the stabilizer subsystem decomposition for GKP codes to obtain an effective logical channel for noisy operations that is used to express the ideal one of a target logical unitary. We consider noise from finite squeezing on the data and the two ancilla modes, needed for error correction, and examine the relationship between the sampling overhead and the noise for different decoding methods. Our results are calculated for single- and two-qubit GKP Clifford gates and one round of error correction, and show the nontrivial combination of error correction and mitigation in continuous variable codes.", "url": "https://arxiv.org/abs/2609.17095", "type": "理论", "summary": "为了解决量子计算机上的实际问题，有必要使用容错量子纠错方案来克服噪声：由于物理组件的缺陷而产生的错误。 Gottesman-Kitaev-Preskill (GKP) 代码旨在通过对一个或多个连续变量模式的希尔伯特空间中的有限维逻辑子空间进行编码，以硬件有效的方式实现这一目标。然而，在近期实现中，完全消除错误是不可行的，因此很自然地还采用替代错误缓解技术和错误校正。在这项工作中，我们在 GKP 代码的背景下研究了一种称为概率错误消除的量子错误缓解方法。我们比较了 Steane 型和基于隐形传态的 GKP 纠错，并计算了与方形和六边形 GKP 码技术相关的采样开销。我们采用 GKP 码的稳定器子系统分解来获得用于噪声操作的有效逻辑通道，用于表达目标逻辑单元的理想通道。\n\n我们考虑纠错所需的数据有限压缩和两种辅助模式产生的噪声，并检查不同解码方法的采样开销和噪声之间的关系。我们的结果是针对单量子位和两个量子位 GKP Clifford 门和一轮纠错进行计算的，并显示了连续变量代码中纠错和缓解的重要组合。", "authors": [{"name": "Victoria Wadewitz"}, {"name": "Alessandro Ciani"}], "featured_authors": [{"name": "Victoria Wadewitz"}, {"name": "Alessandro Ciani"}], "author_count": 2}, {"id": "2609.17116", "category": "quant-ph", "title": "Thouless pumping via discrete jumping of the adiabatic Hamiltonian", "abstract": "Thouless pumping is a celebrated topological effect that enables quantized particle transport and holds promise for applications in quantum technologies. However, the standard adiabatic pumping theory dictate that the Hamiltonian must be varied continuously and slowly throughout the whole pumping process. In this work, we show that Thouless pumping can be realized by using only discrete sampling of the Hamiltonian, removing the conventional constraint of continuous and slow change of control. Specifically, we select particular parameter points of the Hamiltonian for conventional continuous quantum adiabatic evolution, and then apply the Hamiltonian at these parameter points which induces a geodesic evolution for the pseudospin with a given quasimomentum. This realizes an adiabatic evolution for the Thouless pumping according to a necessary and sufficient condition for quantum adiabatic evolution.", "url": "https://arxiv.org/abs/2609.17116", "type": "理论", "summary": "无意识泵浦是一种著名的拓扑效应，它能够实现量子化粒子传输，并有望在量子技术中得到应用。然而，标准绝热泵浦理论规定哈密顿量必须在整个泵浦过程中连续且缓慢地变化。在这项工作中，我们证明了仅使用哈密顿量的离散采样就可以实现无意识泵浦，从而消除了控制连续且缓慢变化的传统约束。具体来说，我们为传统的连续量子绝热演化选择哈密顿量的特定参数点，然后在这些参数点应用哈密顿量，从而在给定准动量的情况下诱导赝自旋的测地演化。这根据量子绝热演化的充要条件，实现了Thouless泵浦的绝热演化。", "authors": [{"name": "Lang Yu"}, {"name": "Yihan Wu"}, {"name": "Zhen-Yu Wang"}], "featured_authors": [{"name": "Lang Yu"}, {"name": "Yihan Wu"}, {"name": "Zhen-Yu Wang"}], "author_count": 3}, {"id": "2609.17176", "category": "quant-ph", "title": "Preparation-protocol-dependent quantum Mpemba dynamics in a magnetically tunable graphene nanotorus qubit", "abstract": "We investigate the quantum Mpemba effect in a graphene nanotorus qubit and show that its strength depends strongly on how the initial state is prepared. We compare two protocols that share the same final Hamiltonian, thermal bath, and Markovian Liouvillian: bare Gibbs preparation, in which the coherent drive is switched on only at the final quench, and driven steady-state preparation, in which the initial states are stationary states of the driven dynamics. Using the distance to the final stationary state and an integrated Mpemba parameter, we find broad regions of strong anomalous relaxation for bare Gibbs preparation, with $M_B$ approaching unity, whereas the driven steady-state protocol almost completely suppresses the effect. A Liouvillian-mode analysis reveals the mechanism: the bare Gibbs protocol typically yields a smaller hot-state weight in the slow active sector than the cold state, $R_s<1$, while the driven steady-state protocol predominantly gives $R_s>1$. Since the final Liouvillian spectrum is identical for both protocols at corresponding parameter points, the contrast originates from preparation-dependent modal weights rather than from changes in the decay-rate hierarchy. These results identify state preparation as a control parameter for anomalous quantum relaxation in a curved graphene qubit.", "url": "https://arxiv.org/abs/2609.17176", "type": "理论", "summary": "我们研究了石墨烯纳米环量子位中的量子 Mpemba 效应，并表明其强度很大程度上取决于初始态的准备方式。我们比较了共享相同最终哈密顿量、热浴和马尔可夫刘维利式的两种协议：裸吉布斯准备，其中相干驱动仅在最终淬灭时打开，以及驱动稳态准备，其中初始状态是驱动动力学的稳态。使用到最终稳态的距离和积分 Mpemba 参数，我们发现裸吉布斯制备的强异常弛豫的广泛区域，$M_B$ 接近统一，而驱动稳态协议几乎完全抑制了这种效应。刘维尔模式分析揭示了这一机制：裸吉布斯协议通常在慢速活动扇区中产生比冷态更小的热态权重，$R_s<1$，而驱动稳态协议主要给出$R_s>1$。\n\n由于两种协议在相应参数点的最终刘维尔谱是相同的，因此对比度源自与制备相关的模态权重，而不是源自衰减率层次结构的变化。这些结果将状态准备确定为弯曲石墨烯量子位中反常量子弛豫的控制参数。", "authors": [{"name": "J. Furtado"}], "featured_authors": [{"name": "J. Furtado"}], "author_count": 1}, {"id": "2609.17188", "category": "quant-ph", "title": "Real-Space Renormalization of Stabilizer Rényi Entropies in Spin Chains", "abstract": "Stabilizer states constitute an important class of quantum states that can be generated from computational-basis states using Pauli operators and Clifford gates. Although they may exhibit substantial multipartite entanglement, quantum circuits restricted to stabilizer operations can be efficiently simulated classically and therefore cannot, by themselves, provide a quantum computational advantage. Such an advantage requires non-stabilizer resources, commonly referred to as quantum magic. In this paper, we investigate the non-stabilizerness of quantum states arising in a class of spin Hamiltonians by computing their stabilizer Rényi entropies. Using real-space renormalization-group techniques, we obtain a closed-form expression valid in the low-energy, large-distance regime. We analyze how quantum magic evolves under coarse-graining and explore its behavior across different parameter regimes and quantum phases.", "url": "https://arxiv.org/abs/2609.17188", "type": "理论", "summary": "稳定态构成一类重要的量子态，可以使用泡利算子和克利福德门从计算基础态生成。尽管它们可能表现出大量的多部分纠缠，但仅限于稳定器操作的量子电路可以有效地进行经典模拟，因此它们本身无法提供量子计算优势。这种优势需要非稳定器资源，通常称为量子魔法。在本文中，我们通过计算自旋哈密顿量的稳定器 Rényi 熵来研究一类自旋哈密顿量中出现的量子态的非稳定性。使用实空间重整化群技术，我们获得了在低能量、大距离范围内有效的封闭形式表达式。我们分析量子魔法在粗粒度下如何演化，并探索其在不同参数体系和量子阶段的行为。", "authors": [{"name": "Sonja Gombar"}, {"name": "Petar Mali"}, {"name": "Slobodan Radošević"}, {"name": "Milica Rutonjski"}, {"name": "Milan Pantić"}, {"name": "Milica Pavkov-Hrvojević"}], "featured_authors": [{"name": "Sonja Gombar"}, {"name": "Petar Mali"}, {"name": "Slobodan Radošević"}, {"name": "Milica Rutonjski"}, {"name": "Milan Pantić"}, {"name": "Milica Pavkov-Hrvojević"}], "author_count": 6}, {"id": "2609.17256", "category": "quant-ph", "title": "Geometric quantifier of the incompatibility of single-particle property attribution in indistinguishable boson systems", "abstract": "Entanglement in indistinguishable particle systems can be characterized by the impossibility of unambiguously attributing a complete set of physical properties to the individual constituent particles. In this work, we introduce a geometric quantifier of the incompatibility of such simultaneous property attribution for pure states of $N$ indistinguishable bosons. Using the Majorana stellar representation, any symmetric multi-qubit state can be expressed as the symmetrization of constituent single-particle states, allowing the associated single-particle properties to be directly linked with the corresponding Majorana stars. This establishes a direct connection between the geometry of the Majorana representation on the Bloch sphere and the entanglement criterion based on the attribution of single-particle properties in systems of identical two-level bosons. We then generalize this geometric approach to higher-dimensional bosons, extending the quantifier from qubits to qudits, while retaining a geometric interpretation of property-attribution incompatibility in terms of Fubini-Study angles.", "url": "https://arxiv.org/abs/2609.17256", "type": "理论", "summary": "无法区分的粒子系统中的缠结的特征是不可能将一组完整的物理特性明确地归因于各个组成粒子。在这项工作中，我们引入了一个几何量词，用于描述 $N$ 不可区分玻色子的纯态的同时属性归因的不相容性。使用马约拉纳恒星表示，任何对称多量子位状态都可以表示为组成单粒子状态的对称化，从而允许相关的单粒子属性与相应的马约拉纳恒星直接相关。这在布洛赫球上的马约拉纳表示的几何形状与基于相同两能级玻色子系统中单粒子属性的归因的纠缠准则之间建立了直接联系。然后，我们将这种几何方法推广到高维玻色子，将量词从量子比特扩展到量子比特，同时保留 Fubini-Study 角度对属性-归因不相容性的几何解释。", "authors": [{"name": "P. Céspedes"}, {"name": "A. Valdés-Hernández"}, {"name": "F. H. Holik"}, {"name": "A. P. Majtey"}], "featured_authors": [{"name": "P. Céspedes"}, {"name": "A. Valdés-Hernández"}, {"name": "F. H. Holik"}, {"name": "A. P. Majtey"}], "author_count": 4}, {"id": "2609.17307", "category": "quant-ph", "title": "Forbidden Subspaces in Quantum State Smoothing", "abstract": "A system between a preparation and a post-selection has had no agreed state since 1964. With positivity as the criterion, a post-selection admits an interval of orderings around the symmetric one exactly when the subspace it forbids is spanned by eigenvectors of a full-rank filtered state. Otherwise it certifies contextuality, testable on a qubit. The averaged filtered state carries the entanglement spectrum of the record, so the smallest forbidden subspaces a symmetry allows are even-dimensional in the Haldane class and odd in the trivial one. That parity is the record's topological class.", "url": "https://arxiv.org/abs/2609.17307", "type": "理论", "summary": "自 1964 年以来，准备和后选择之间的系统一直没有达成一致的状态。以正性为标准，当后选择所禁止的子空间由满秩过滤状态的特征向量跨越时，后选择允许对称有序周围的有序区间。否则它会证明上下文，可在量子位上进行测试。平均过滤状态携带记录的纠缠谱，因此对称性允许的最小禁止子空间在 Haldane 类中是偶维的，在平凡类中是奇数的。该奇偶性是记录的拓扑类别。", "authors": [{"name": "Chon-Fai Kam"}, {"name": "Kai-Wen Wong"}], "featured_authors": [{"name": "Chon-Fai Kam"}, {"name": "Kai-Wen Wong"}], "author_count": 2}, {"id": "2609.17309", "category": "quant-ph", "title": "Generalised quantum Stein's lemma more robust than ever", "abstract": "The generalised quantum Stein's lemma is a key result in quantum hypothesis testing, and connects this fundamental primitive of quantum information processing with quantum resource manipulation, a task that is central for technological applications. Prior works have proved this statement in the idealised setting of independent and identically distributed (i.i.d.) sequences of quantum states, and recent extensions consider also sources that are 'close' to i.i.d., according to the strict notion put forth by Mazzola, Sutter, and Renner. For several applications, however, one would need to consider yet more general sources. We establish a version of the generalised quantum Stein's lemma that is conceptually much simpler and general, as it applies to any source that is asymptotically close to an i.i.d. state with respect to the normalised quantum Wasserstein distance of order 1. As an immediate consequence, we solve the Stein exponent of a scenario where the null hypothesis is arbitrarily varying, expressing it in terms of i.i.d. Stein exponents corresponding to arbitrary states in the convex hull of the null hypothesis base set.", "url": "https://arxiv.org/abs/2609.17309", "type": "理论", "summary": "广义量子斯坦因引理是量子假设检验的关键结果，它将量子信息处理的基本原语与量子资源操纵（一项技术应用的核心任务）联系起来。先前的工作已经在量子态独立同分布 (i.i.d.) 序列的理想化设置中证明了这一说法，根据 Mazzola、Sutter 和 Renner 提出的严格概念，最近的扩展还考虑了“接近”i.i.d. 的源。然而，对于某些应用程序，人们需要考虑更通用的来源。我们建立了广义量子斯坦因引理的一个版本，它在概念上更加简单和通用，因为它适用于渐近接近独立同分布的任何源。相对于 1 阶归一化量子 Wasserstein 距离的状态。作为直接结果，我们求解了原假设任意变化场景的 Stein 指数，并用独立同分布 (i.i.d) 来表示。对应于原假设基集凸包中任意状态的斯坦指数。", "authors": [{"name": "Filippo Girardi"}, {"name": "Kuan-Yi Lee"}, {"name": "Masahito Hayashi"}, {"name": "Ludovico Lami"}], "featured_authors": [{"name": "Filippo Girardi"}, {"name": "Kuan-Yi Lee"}, {"name": "Masahito Hayashi"}, {"name": "Ludovico Lami"}], "author_count": 4}, {"id": "2609.17313", "category": "quant-ph", "title": "Exceptional Topology Survives Strong Hermitian Fields in Radiative Atomic Arrays", "abstract": "Exceptional points are topological defects of complex band structures that are stable against weak perturbations, yet in bounded two-band systems they are ultimately removed by a sufficiently strong Hermitian field. Here we demonstrate a striking exception in a two-dimensional subwavelength atomic array. Along a continuous square-to-triangular deformation at fixed magnetic field, the bulk passes between line-gapped topological regions with band Chern numbers (C_1,C_2)=(2,-2) through a gapless exceptional region. Within a finite interval of lattice deformation, increasing the magnetic field merely drives the exceptional points toward the light cone because of the singular radiative dipolar couplings. We further show that skin localization toward open boundaries responds non-monotonically to the same field. An intermediate field drives a bipolar skin localization, with bulk modes accumulating at opposite edges, whereas stronger fields suppress boundary localization. Our results establish the interplay of lattice geometry, light-cone singularity, and Hermitian magnetic field as a route to engineering Chern and exceptional topology beyond the conventional strong-field limit.", "url": "https://arxiv.org/abs/2609.17313", "type": "理论", "summary": "特殊点是复杂能带结构的拓扑缺陷，这些缺陷在弱扰动下保持稳定，但在有界二能带系统中，它们最终会被足够强的埃尔米特场消除。在这里，我们演示了二维亚波长原子阵列中的一个引人注目的异常。沿着固定磁场下的连续方形到三角形变形，块体在带陈数 (C_1,C_2)=(2,-2) 的线隙拓扑区域之间穿过无间隙异常区域。在晶格变形的有限区间内，由于奇异的辐射偶极耦合，增加磁场只会将异常点驱动到光锥。我们进一步表明，朝向开放边界的皮肤定位对同一场的非单调响应。中间场驱动双极皮肤定位，体模在相对边缘累积，而更强的场抑制边界定位。我们的结果确立了晶格几何、光锥奇点和厄米磁场之间的相互作用，作为设计陈省身和超越传统强场限制的特殊拓扑的途径。", "authors": [{"name": "Tian-Shu Gou"}, {"name": "Yi-Cheng Wang"}, {"name": "Ya-Tang Yu"}, {"name": "Guin-Dar Lin"}, {"name": "Jhih-Shih You"}, {"name": "H. H. Jen"}], "featured_authors": [{"name": "Tian-Shu Gou"}, {"name": "Yi-Cheng Wang"}, {"name": "Ya-Tang Yu"}, {"name": "Guin-Dar Lin"}, {"name": "Jhih-Shih You"}, {"name": "H. H. Jen"}], "author_count": 6}, {"id": "2609.17314", "category": "quant-ph", "title": "Evolution of quantum imaginarity in black hole quantum atmosphere", "abstract": "Quantum imaginarity, as a critical resource metric for quantifying intrinsic nonreal coherence encoded in quantum states, exhibits nontrivial evolutionary behaviors in curved spacetime backgrounds. This work focuses on bipartite Dirac field reduced states in the quantum atmosphere of a static Schwarzschild black hole, aiming to explore the modulation of three mainstream imaginarity measures by Hawking thermal radiation. We reveal that the relative-entropy imaginarity, the geometric imaginarity and robustness of imaginarity, the fully accessible state presents a valley-shaped radial profile with a local minimum inside the quantum atmosphere, while the cross-coupling and fully inaccessible states follow opposite peak-shaped trends. Further analysis demonstrates that the Hartle-Hawking constant significantly strengthens the redistribution effect of imaginarity across both regions, whereas an increase in the event horizon radius weakens such redistribution and flattens the extremum features. These findings offer a new perspective for decoding the information structure of black hole quantum atmospheres and the intrinsic quantum nature of Hawking radiation.", "url": "https://arxiv.org/abs/2609.17314", "type": "理论", "summary": "量子想象力作为量化量子态中编码的内在非真实相干性的关键资源度量，在弯曲时空背景中表现出非平凡的进化行为。这项工作主要研究静态史瓦西黑洞量子大气中的二分狄拉克场还原态，旨在探索霍金热辐射对三种主流虚数测度的调制。我们揭示了相对熵虚数、几何虚数和虚数的鲁棒性，完全可达态呈现谷形径向轮廓，在量子大气内具有局部最小值，而交叉耦合和完全不可可达态则遵循相反的峰形趋势。进一步的分析表明，哈特尔-霍金常数显着增强了两个区域中虚数的重新分布效应，而事件视界半径的增加削弱了这种重新分布并使极值特征变得平坦。这些发现为解码黑洞量子大气的信息结构和霍金辐射的内在量子性质提供了新的视角。", "authors": [{"name": "Ruopu Sun"}, {"name": "Xiaofen Huang"}], "featured_authors": [{"name": "Ruopu Sun"}, {"name": "Xiaofen Huang"}], "author_count": 2}, {"id": "2609.17457", "category": "quant-ph", "title": "One Gate at a Time: Complexity Growth in Random Quantum Circuits", "abstract": "A random unitary quantum circuit is expected to be incompressible for exponentially long times. We show that the constant-error circuit complexity of a random unitary circuit grows almost linearly with time as $\\Omega(T/\\log T)$. The bound holds for all $2\\leq T\\leq 4^n$ where $n$ is the system size, and involves no other $n$-dependence. This improves previous lower bounds derived from spectral gaps and unitary designs by a factor of $\\mathrm{poly}(n)$. Drawing on insights from stochastic calculus, geometric functional analysis, and randomized linear algebra, our approach exploits the circuit's response to variations of individual gates and requires no control over convergence to high-order unitary designs.", "url": "https://arxiv.org/abs/2609.17457", "type": "理论", "summary": "随机酉量子电路预计在指数级长时间内是不可压缩的。我们证明，随机酉电路的恒定误差电路复杂度几乎随时间线性增长，如 $\\Omega(T/\\log T)$。该界限适用于所有 $2\\leq T\\leq 4^n$，其中 $n$ 是系统大小，并且不涉及其他 $n$ 依赖性。这将之前从谱间隙和单一设计得出的下限提高了 $\\mathrm{poly}(n)$ 倍。借鉴随机微积分、几何泛函分析和随机线性代数的见解，我们的方法利用了电路对各个门的变化的响应，并且不需要控制高阶酉设计的收敛。", "authors": [{"name": "Zhi Li"}], "featured_authors": [{"name": "Zhi Li"}], "author_count": 1}, {"id": "2609.17482", "category": "quant-ph", "title": "Predictive Structure Behind Rare Outcomes in Random Quantum Circuits", "abstract": "Rare outputs of random quantum circuits are usually treated as terminal statistics. We ask whether they reveal intermediate organization that remains useful beyond the selecting future. Comparing unconditioned random-normal (RN) and peak-selected random-peaked (RP) circuits from the same local generator, we find stronger pairwise correlations and probability redistribution but reduced bipartite and output spreading in RP across n=8-16. Exact full-suffix decomposition reveals stronger peak-directed interference. The structural separation and fresh-future advantage persist across four nominal depths at n=8-14, with 2.01-7.15 fold RP enrichment in the depth extensions at fixed, independently calibrated thresholds. Within the unconditioned ensemble, a structural prefix score predicts fresh-event probability without using the evaluated circuits' terminal outcomes. Population-preserving phase scrambling identifies a functional contribution from relative-phase organization across the tested settings, including primary-depth held-out confirmation. RP trajectory-guided initialization improves high-peak yield over Haar initialization under common local refinement. Intermediate multivariate guidance also improves the fresh-continuation susceptibility of constructed states beyond peak-only guidance across the same size-depth grid. Rare outputs thus reveal intermediate physical organization that remains useful under new dynamics and can guide circuit construction.", "url": "https://arxiv.org/abs/2609.17482", "type": "数值", "summary": "随机量子电路的罕见输出通常被视为终端统计。我们询问它们是否揭示了在选择未来之后仍然有用的中间组织。比较来自同一本地生成器的无条件随机正态 (RN) 和峰值选择随机峰值 (RP) 电路，我们发现更强的成对相关性和概率重新分布，但在 n=8-16 的 RP 中减少了二分和输出扩散。精确的全后缀分解揭示了更强的峰值定向干扰。结构分离和新鲜未来优势在 n=8-14 的四个标称深度上持续存在，在固定的、独立校准的阈值下，深度扩展中 RP 富集了 2.01-7.15 倍。在无条件集成中，结构前缀分数可以预测新鲜事件概率，而无需使用评估电路的最终结果。群体保留相位扰乱识别了测试设置中相对相位组织的功能贡献，包括主要深度保留确认。在常见的局部细化下，RP 轨迹引导的初始化比 Haar 初始化提高了高峰值产量。\n\n中间多元指导还提高了构建状态的新鲜连续敏感性，超越了相同尺寸深度网格上的仅峰值指导。因此，罕见的输出揭示了在新动态下仍然有用的中间物理组织，并且可以指导电路构建。", "authors": [{"name": "Myeongsu Kim"}, {"name": "Travis Humble"}, {"name": "Sabre Kais"}], "featured_authors": [{"name": "Myeongsu Kim"}, {"name": "Travis Humble"}, {"name": "Sabre Kais"}], "author_count": 3}, {"id": "2609.17490", "category": "quant-ph", "title": "Query-optimal quantum simulation of Lindblad evolution", "abstract": "For the problem of simulating Lindblad evolution for time $t$ to precision $\\epsilon$, Hamiltonian simulation provides an additive query lower bound, informally, $\\Omega(t + \\mathrm{polylog}(1/\\epsilon))$. However, the best previously known algorithms for general Lindblad simulation achieve a multiplicative upper bound, informally, $\\mathcal{O}(t\\,\\mathrm{polylog}(1/\\epsilon))$, in gate complexity. It has remained open whether this multiplicative dependence is necessary. In this paper, we close the gap in query complexity by giving an algorithm with optimal additive dependence on evolution time and precision in the block-encoding model. Our approach uses the transducer framework to reduce the query cost of composing first-order approximations to the evolution channel, together with linear combinations of reuse circuits of different lengths to suppress catalyst-removal error. Although our additional gate complexity is higher than that of existing algorithms, our optimal query complexity resolves the question of how much oracle access is fundamentally necessary and identifies the remaining challenge to achieve the optimal gate complexity.", "url": "https://arxiv.org/abs/2609.17490", "type": "理论+数值", "summary": "对于模拟时间 $t$ 的 Lindblad 演化到精度 $\\epsilon$ 的问题，哈密顿模拟提供了一个加性查询下界，非正式地为 $\\Omega(t + \\mathrm{polylog}(1/\\epsilon))$。然而，之前已知的一般 Lindblad 模拟的最佳算法在门复杂度方面实现了乘法上限，非正式地为 $\\mathcal{O}(t\\,\\mathrm{polylog}(1/\\epsilon))$。这种乘法依赖是否必要仍然悬而未决。在本文中，我们通过给出一种对块编码模型中的进化时间和精度具有最佳加性依赖性的算法来缩小查询复杂性的差距。我们的方法使用传感器框架来减少对演化通道构成一阶近似的查询成本，同时使用不同长度的重用电路的线性组合来抑制催化剂去除误差。尽管我们额外的门复杂性高于现有算法，但我们的最佳查询复杂性解决了从根本上需要多少预言机访问的问题，并确定了实现最佳门复杂性的剩余挑战。", "authors": [{"name": "Chunhao Wang"}, {"name": "Christopher Ye"}], "featured_authors": [{"name": "Chunhao Wang"}, {"name": "Christopher Ye"}], "author_count": 2}, {"id": "2609.17501", "category": "quant-ph", "title": "A Case Study on Noise Resilient Operator Selection in Adaptive Variational Quantum Algorithms", "abstract": "Hardware noise has been shown to significantly impact the accuracy of ADAPT-VQE, a ground state preparation algorithm. While previous work has studied the impact of noise on its parameter optimization step, its impact on the critical operator selection step remains comparatively unexplored. In this work, we examine the impact of a variety of noise channels on this step, using a linear H$_3$ molecule as a test case. We show that, despite the selection criterion's natural resilience to some noise, both coherent and incoherent noise can prevent convergence for sufficiently high noise rates. We employ quantum error mitigation techniques--dynamical decoupling, zero noise extrapolation, and Pauli twirling--and show that when combined appropriately, these techniques are capable of restoring a successful convergence profile. Our results highlight how error mitigation can improve the performance of ADAPT-VQE and enable convergence in the presence of hardware noise, offering valuable insights into the implementation of the algorithm on near-term quantum hardware.", "url": "https://arxiv.org/abs/2609.17501", "type": "理论+数值", "summary": "硬件噪声已被证明会显着影响 ADAPT-VQE（一种基态准备算法）的准确性。虽然之前的工作研究了噪声对其参数优化步骤的影响，但其对关键算子选择步骤的影响仍然相对未经探索。在这项工作中，我们使用线性 H$_3$ 分子作为测试用例，检查各种噪声通道对此步骤的影响。我们表明，尽管选择标准对某些噪声具有天然的弹性，但相干和非相干噪声都可以阻止足够高噪声率的收敛。我们采用量子误差缓解技术——动态解耦、零噪声外推和泡利旋转——并表明，当适当组合时，这些技术能够恢复成功的收敛曲线。我们的结果强调了错误缓解如何提高 ADAPT-VQE 的性能并在存在硬件噪声的情况下实现收敛，为近期量子硬件上算法的实现提供了宝贵的见解。", "authors": [{"name": "Soorya Haravu"}, {"name": "Mafalda Ramôa"}, {"name": "Bharath Sambasivam"}], "featured_authors": [{"name": "Soorya Haravu"}, {"name": "Mafalda Ramôa"}, {"name": "Bharath Sambasivam"}], "author_count": 3}, {"id": "2609.17517", "category": "quant-ph", "title": "Regularized barycentric Rényi divergences", "abstract": "Barycentric Rényi divergences were introduced in [Mosonyi, Bunth, Vrana, Linear Algebra and its Applications, 2024] as an alternative to standard Kubo-Ando constructions to define multivariate quantum Rényi divergences. They are defined via a variational expression and depend on a finite collection of quantum relative entropies $D^{q_x}$. When all the relative entropies are monotone under CPTP maps then so are the corresponding barycentric Rényi divergences, and when all the relative entropies are additive then the corresponding barycentric Rényi divergences are subadditive under tensor product. Additivity has only been established before for the case where all $D^{q_x}$ are chosen to be the Umegaki relative entropy, which is also the only case where the barycentric Rényi divergence (called the minimal one) admits an explicit expression. Here we settle the problem of additivity by showing that for any choice of additive and monotone quantum relative entropies, the regularized barycentric Rényi divergence coincides with the minimal barycentric Rényi divergence on strictly positive inputs. This in turn implies that the only additive barycentric Rényi divergence is the minimal one.", "url": "https://arxiv.org/abs/2609.17517", "type": "数值", "summary": "重心 Rényi 散度在 [Mosonyi, Bunth, Vrana, 线性代数及其应用，2024] 中引入，作为标准 Kubo-Ando 结构的替代方案来定义多元量子 Rényi 散度。它们通过变分表达式定义，并依赖于量子相对熵 $D^{q_x}$ 的有限集合。当所有相对熵在 CPTP 映射下单调时，则相应的重心 Rényi 散度也是单调的，而当所有相对熵是可加的时，则相应的重心 Rényi 散度在张量积下是次加性的。之前仅针对所有 $D^{q_x}$ 被选择为 Umegaki 相对熵的情况建立了可加性，这也是重心 Rényi 散度（称为最小散度）允许显式表达式的唯一情况。在这里，我们通过证明对于加性和单调量子相对熵的任何选择，正则化重心 Rényi 散度与严格正输入上的最小重心 Rényi 散度一致来解决可加性问题。这反过来意味着唯一的加性重心 Rényi 散度是最小的。", "authors": [{"name": "Milán Mosonyi"}], "featured_authors": [{"name": "Milán Mosonyi"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
