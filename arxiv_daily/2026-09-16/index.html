成能量和跳跃势垒的定量精度至关重要。本方法将应用于当前在线性电子声子耦合近似中研究的所有性质和现象的研究，从声子介导的超导性到激发态动力学，无论是在谐波还是非谐波系统中。", "authors": [{"name": "Zhenbang Dai"}, {"name": "Feliciano Giustino"}], "featured_authors": [{"name": "Zhenbang Dai"}, {"name": "Feliciano Giustino"}], "author_count": 2}, {"id": "2609.17477", "category": "cond-mat", "title": "Bias-Induced Crossover in Absolute Capacity of Dense Associative Memory", "abstract": "The absolute capacity of dense associative memory has mainly been analyzed for unbiased patterns. Here we examine the effect of bias in centered binary patterns under the Krotov-Hopfield single-site criterion $P_{\\mathrm{error}}=1/N$, where $P_{\\mathrm{error}}$ is the probability that a single-site flip lowers the energy of a stored pattern and $N$ is the number of neurons. Each pattern component takes $1-q$ with probability $q$ and $-q$ otherwise, where $0<q\\le1/2$. For polynomial interactions of order $n$, a signal-to-noise analysis gives an absolute capacity of order $N^{n-1}/\\ln N$ at $q=1/2$. For fixed $q<1/2$, however, the capacity is $O(N^{n/2})$ for even $n\\ge4$ and $O(N^{(n+1)/2})$ for odd $n\\ge5$. For $n=3$, both the unbiased and fixed-bias capacities remain $O(N^2/\\ln N)$. For $n\\ge4$, these different asymptotic forms imply a nonuniform large-$N$ limit near $q=1/2$. Asymptotic matching predicts a bias-induced crossover in the region $1-2q=O(\\ln N/N^{\\lfloor n/2\\rfloor-1})$. The crossover originates from a bias-dependent crosstalk mean that reduces the stability of sites carrying the more frequent value $-q$. Computer simulations are compared with the finite-size conditioned-Gaussian predictions. An activity-dependent control potential that cancels the conditional crosstalk mean restores the $N^{n-1}/\\ln N$ capacity for fixed $0<q<1/2$ within the conditioned-Gaussian approximation.", "url": "https://arxiv.org/abs/2609.17477", "type": "理论+数值", "summary": "密集联想记忆的绝对容量主要是针对无偏模式进行分析的。在这里，我们在 Krotov-Hopfield 单点准则 $P_{\\mathrm{error}}=1/N$ 下检查中心二进制模式的偏差影响，其中 $P_{\\mathrm{error}}$ 是单点翻转降低存储模式能量的概率，$N$ 是神经元的数量。每个模式分量采用 $1-q$，概率为 $q$，否则采用 $-q$，其中 $0<q\\le1/2$。对于 $n$ 阶多项式相互作用，信噪比分析给出 $q=1/2$ 时 $N^{n-1}/\\ln N$ 阶的绝对容量。然而，对于固定的 $q<1/2$，偶数 $n\\ge4$ 的容量为 $O(N^{n/2})$，奇数 $n\\ge5$ 的容量为 $O(N^{(n+1)/2})$。对于 $n=3$，无偏和固定偏压容量仍为 $O(N^2/\\ln N)$。对于 $n\\ge4$，这些不同的渐近形式意味着 $q=1/2$ 附近的非均匀大 $N$ 限制。渐近匹配预测 $1-2q=O(\\ln N/N^{\\lfloor n/2\\rfloor-1})$ 区域中由偏差引起的交叉。交叉源于依赖于偏差的串扰均值，该均值降低了携带更频繁值 $-q$ 的站点的稳定性。\n\n将计算机模拟与有限尺寸条件高斯预测进行比较。取消条件串扰均值的活动相关控制势可恢复条件高斯近似内固定 $0<q<1/2$ 的 $N^{n-1}/\\ln N$ 容量。", "authors": [{"name": "Yuto Sakurai"}, {"name": "Takeaki Shimokawa"}, {"name": "Kazunori Iwata"}, {"name": "Kazushi Mimura"}], "featured_authors": [{"name": "Yuto Sakurai"}, {"name": "Takeaki Shimokawa"}, {"name": "Kazunori Iwata"}, {"name": "Kazushi Mimura"}], "author_count": 4}, {"id": "2609.17514", "category": "cond-mat", "title": "Molecular Decomposition of the Area Compressibility Modulus of Lipid Membranes", "abstract": "The area compressibility modulus is a key descriptor of lipid membrane mechanics, but the molecular interactions that determine this elasticity are not evident from the total modulus alone. Here, molecular dynamics simulations of a POPC bilayer described by the coarse-grained Martini 3 force field were combined with virial stress analysis to decompose the area compressibility modulus into contributions from molecular groups and their interactions. Partial lateral tensions were evaluated as functions of membrane area strain, and their derivatives at the equilibrium state were used to obtain the corresponding contributions to the area compressibility modulus. Hydrocarbon chains provided the dominant positive contribution, accounting for approximately 70% of the total modulus, whereas water-lipid interactions contributed approximately 30%, predominantly through water-headgroup interactions. Within the bilayer, the headgroup and headgroup-chain contributions were of similar magnitude but opposite in sign and nearly canceled. Direct intermonolayer interactions contributed only about 3% of the bilayer-only modulus, indicating an almost additive elastic response of the two monolayers. The hierarchy of elastic contributions differed markedly from that of equilibrium partial tensions, showing that interactions responsible for static stress balance are not necessarily those governing membrane stiffness. This decomposition provides a microscopic interpretation of lipid bilayer area elasticity.", "url": "https://arxiv.org/abs/2609.17514", "type": "数值", "summary": "面积压缩模量是脂质膜力学的关键描述符，但仅从总模量来看，决定这种弹性的分子相互作用并不明显。在这里，粗粒度 Martini 3 力场描述的 POPC 双层的分子动力学模拟与维里应力分析相结合，将面积压缩模量分解为分子团及其相互作用的贡献。部分侧向张力被评估为膜面积应变的函数，并且使用它们在平衡状态下的导数来获得对面积压缩模量的相应贡献。烃链提供了主要的正贡献，约占总模量的 70%，而水-脂质相互作用贡献了约 30%，主要通过水-头基相互作用。在双层内，头基和头基链的贡献大小相似，但符号相反，几乎抵消。直接的单层间相互作用仅贡献了约 3% 的双层模量，表明两个单层的弹性响应几乎是相加的。\n\n弹性贡献的层次结构与平衡部分张力的层次结构明显不同，这表明负责静态应力平衡的相互作用不一定是控制膜刚度的相互作用。这种分解提供了脂质双层区域弹性的微观解释。", "authors": [{"name": "Konstantin V. Pinigin"}], "featured_authors": [{"name": "Konstantin V. Pinigin"}], "author_count": 1}, {"id": "2609.16103", "category": "hep-th", "title": "A LooKK at the Higuchi Bound", "abstract": "Massive spin 2 fields on de Sitter must satisfy the Higuchi bound, $m^2\\geq 2H^2$. Compactifications of higher dimensional gravity to $\\mathrm{dS}_4$ come with a tower of Kaluza-Klein gravitons whose masses are fixed by the internal geometry, so the bound becomes a constraint on the compactification. We propose that the KK gravitons of a consistent compactification never violate it, and test this in a few examples. On a circle stabilized by Casimir energy the bound holds unless the circle shrinks below the species scale, and on a warped interval with negative tension branes the tower is gapped at $m^2\\geq \\tfrac{9}{4}H^2$ for any length of the interval. On group manifolds, we argue that if the internal curvature is not parametrically larger than the Hubble scale, the bound can apparently be violated by smooth deformations. The violation disappears once one promotes these deformations to moduli, which are immediately extremized when solving the 10d equations of motion.", "url": "https://arxiv.org/abs/2609.16103", "type": "理论", "summary": "德西特上的大规模自旋 2 场必须满足樋口界 $m^2\\geq 2H^2$。高维引力压缩到 $\\mathrm{dS}_4$ 伴随着 Kaluza-Klein 引力子塔，其质量由内部几何形状固定，因此界限成为压缩的约束。我们建议一致紧化的 KK 引力子永远不会违反它，并在几个例子中测试这一点。在由卡西米尔能量稳定的圆上，除非圆收缩到物种尺度以下，否则界限保持不变，并且在具有负张力膜的扭曲区间上，对于任何区间长度，塔的间隙为 $m^2\\geq \\tfrac{9}{4}H^2$。在群流形上，我们认为如果内部曲率在参数上不大于哈勃尺度，则平滑变形显然会违反界限。一旦将这些变形提升为模数，这种违反就会消失，在求解 10 维运动方程时，模数会立即达到极值。", "authors": [{"name": "Dieter Lüst"}, {"name": "Joaquin Masias"}], "featured_authors": [{"name": "Dieter Lüst"}, {"name": "Joaquin Masias"}], "author_count": 2}, {"id": "2609.16107", "category": "hep-th", "title": "Canonical differential equations for Feynman integrals from $\\mathcal{A}$-hypergeometric systems in the Schwinger representation", "abstract": "We follow a $D$-module approach to the construction of canonical differential equations for Feynman integrals directly from their Gel'fand-Kapranov-Zelevinsky (GKZ) hypergeometric systems. Starting from the Schwinger representation, we identify the associated generalized Euler integral and its GKZ system, as an alternative to the Lee-Pomeransky representation. The generalized Euler formulation allows reductions associated with facets of the Newton polytope to be identified directly, reducing the number of variables in the resulting differential systems. We construct the associated Pfaffian systems using Frobenius bases, which also provide direct access to the singular loci. After a suitable rationalizing change of variables, the systems are brought into canonical $\\epsilon$-form. A key feature of the construction is that the dimension of the canonical basis is determined by the holonomic rank of the GKZ system and, for the examples considered, it is smaller than or equal to the number of master integrals obtained from integration-by-parts, thus providing a reduced description of the differential system.", "url": "https://arxiv.org/abs/2609.16107", "type": "理论", "summary": "我们遵循 $D$ 模块方法直接从 Gel'fand-Kapranov-Zelevinsky (GKZ) 超几何系统构造费曼积分的正则微分方程。从 Schwinger 表示开始，我们确定了相关的广义欧拉积分及其 GKZ 系统，作为 Lee-Pomeransky 表示的替代。广义欧拉公式允许直接识别与牛顿多胞形面相关的约简，从而减少所得微分系统中的变量数量。我们使用 Frobenius 碱基构建相关的普法夫系统，这也提供了对奇异基因座的直接访问。在对变量进行适当的合理化改变之后，系统被带入规范的 $\\epsilon$-形式。该构造的一个关键特征是，规范基的维数由 GKZ 系统的完整秩决定，并且对于所考虑的示例，它小于或等于通过分部积分获得的主积分的数量，从而提供了微分系统的简化描述。", "authors": [{"name": "Mateo Jimenez-Santacruz"}, {"name": "Cristhiam Lopez-Arcos"}, {"name": "Alexander Quintero Velez"}], "featured_authors": [{"name": "Mateo Jimenez-Santacruz"}, {"name": "Cristhiam Lopez-Arcos"}, {"name": "Alexander Quintero Velez"}], "author_count": 3}, {"id": "2609.16109", "category": "hep-th", "title": "Boundary duals of bulk detectors", "abstract": "What is the boundary dual of an Unruh-DeWitt detector in anti-de Sitter space? We argue that this question is naturally answered by the HKLL reconstruction program. A local detector in the bulk can be associated with a smeared detector in the boundary, where the choice of smearing depends on the choice of HKLL kernel. We use this formalism to analyze entanglement harvesting in the Poincaré patch of AdS$_{3}$ for a bulk Unruh-DeWitt detector paired either with a boundary detector or with a second bulk detector. We compute the amount of harvesting in the standard way, namely by evaluating the two-detector density matrix to quadratic order in the coupling $\\lambda$. Additionally, we address an apparent tension between microcausality for spacelike-separated bulk detectors and the fact that the dual HKLL detectors may directly overlap in the boundary theory.", "url": "https://arxiv.org/abs/2609.16109", "type": "理论", "summary": "反德西特空间中 Unruh-DeWitt 探测器的边界对偶是什么？我们认为，香港连接线重建计划自然可以回答这个问题。块体中的局部检测器可以与边界中的涂抹检测器相关联，其中涂抹的选择取决于 HKLL 内核的选择。我们使用这种形式来分析 AdS$_{3}$ 的庞加莱补丁中与边界检测器或第二个体检测器配对的体 Unruh-DeWitt 检测器的纠缠收获。我们以标准方式计算收获量，即通过将耦合 $\\lambda$ 中的双探测器密度矩阵评估为二次阶。此外，我们还解决了类空间分离体探测器的微观因果关系与双 HKLL 探测器在边界理论中可能直接重叠的事实之间的明显张力。", "authors": [{"name": "Jacqueline Caminiti"}, {"name": "Robert C. Myers"}, {"name": "Kelly Wurtz"}], "featured_authors": [{"name": "Jacqueline Caminiti"}, {"name": "Robert C. Myers"}, {"name": "Kelly Wurtz"}], "author_count": 3}, {"id": "2609.16111", "category": "hep-th", "title": "Classification of c=1 CFTs", "abstract": "We completely classify unitary 2d CFTs with central charge $c=1$ and discrete spectrum. We confirm the folklore that the only such theories are the compact free boson, its $\\mathbb{Z}_2$-orbifold, and three exceptional theories obtained as orbifolds of the SU(2)$_1$ WZW model. The proof is by recasting the $c=1$ modular bootstrap as a crystalline measure problem for the density of states, and analytically solving it. We also show that, once the density of states is specified, the full CFT can be uniquely reconstructed.", "url": "https://arxiv.org/abs/2609.16111", "type": "理论", "summary": "我们对具有中心电荷 $c=1$ 和离散谱的酉二维 CFT 进行了完全分类。我们证实了民间传说，唯一这样的理论是紧致自由玻色子、它的 $\\mathbb{Z}_2$ 轨道折叠，以及作为 SU(2)$_1$ WZW 模型轨道折叠获得的三个例外理论。证明是通过将 $c=1$ 模块化引导程序重新设计为状态密度的晶体测量问题，并分析解决它。我们还表明，一旦指定了态密度，就可以唯一地重建完整的 CFT。", "authors": [{"name": "Lorenz Eberhardt"}, {"name": "Nat Levine"}], "featured_authors": [{"name": "Lorenz Eberhardt"}, {"name": "Nat Levine"}], "author_count": 2}, {"id": "2609.16113", "category": "hep-th", "title": "When the gravity path integral describes a statistical average", "abstract": "We find the necessary and sufficient conditions for the gravitational path integral (GPI) to admit an interpretation in terms of (i) an inner product in the Hilbert space of open/closed universes or (ii) a statistical average of boundary observables. The conditions needed for (i) are necessary but not sufficient for (ii). Requiring the stronger condition (ii) places additional constraints on all wormhole amplitudes, giving a concrete diagnostic of whether the GPI computes an average or merely a pseudo-average. To exemplify the difference between the two constraints, we present a class of gravitational toy models that satisfy (i) but fail the stronger condition (ii); to emphasize the power of the stronger condition, we initiate a bootstrap study of statistical ensembles based on condition (ii), finding that the resulting constraints substantially sharpen the bounds on the moments of the ensemble obtained by imposing (i). More broadly, both of these positivity conditions impose nontrivial constraints on wormhole amplitudes and thereby restrict which gravitational effective field theories can be embedded in consistent theories of quantum gravity.", "url": "https://arxiv.org/abs/2609.16113", "type": "理论", "summary": "我们找到了引力路径积分（GPI）接受以下解释的必要和充分条件：（i）开放/封闭宇宙的希尔伯特空间中的内积或（ii）边界可观测量的统计平均值。 (i) 所需的条件对于 (ii) 是必要的，但不是充分的。要求更强的条件 (ii) 对所有虫洞振幅施加了额外的约束，从而给出了 GPI 计算平均值还是伪平均值的具体诊断。为了举例说明这两个约束之间的差异，我们提出了一类满足（i）但不满足更强条件（ii）的引力玩具模型；为了强调更强条件的力量，我们基于条件（ii）启动了统计系综的引导研究，发现由此产生的约束大大锐化了通过施加（i）获得的系综矩的界限。更广泛地说，这两个正性条件都对虫洞振幅施加了重要的约束，从而限制了哪些引力有效场理论可以嵌入到一致的量子引力理论中。", "authors": [{"name": "Gabriele Di Ubaldo"}, {"name": "Luca V. Iliesiu"}, {"name": "Henry W. Lin"}, {"name": "Cynthia Yan"}], "featured_authors": [{"name": "Gabriele Di Ubaldo"}, {"name": "Luca V. Iliesiu"}, {"name": "Henry W. Lin"}, {"name": "Cynthia Yan"}], "author_count": 4}, {"id": "2609.16116", "category": "hep-th", "title": "Group-averaged baby universe field theory", "abstract": "Gravitational sums over spacetime topology suggest a baby-universe field theory whose quanta are entire universes. We develop such a description from group-averaged amplitudes that impose gravitational constraints and define physical inner products in the single-universe theory. To sharpen the contrast with ordinary QFT, we start with gravity on one-dimensional worldlines, which can arise from reducing higher-dimensional cylinders. For multiple noninteracting worldlines that pair boundary components, the baby-universe Hilbert space is the symmetric Fock space over the physical one-universe Hilbert space, and the universe field expands in the on-shell modes spanning the latter. Each mode multiplies the sum of creation and annihilation operators, so the mode coefficients commute. The mode expansion thus makes explicit the field's commutativity and its Wheeler-DeWitt linear field equation. Diagonalizing the coefficients recovers a statistical description by a Gaussian path integral over on-shell field configurations labelling superselection ($\\alpha$-)sectors. We take exploratory steps toward more general topologies. Disk-like topologies coherently shift the no-boundary state, turning on the Hartle-Hawking wavefunction as a one-point function. Even with nontrivial topologies represented by interacting Feynman diagrams, we argue that group averaging near each boundary still enforces the same linear field equation, while interactions instead enter through a non-Gaussian measure over $\\alpha$-sectors. In the topological Marolf-Maxfield model, we promote a disk-and-cylinder truncation to an exact Fock-space representation of the full theory incorporating all topologies. We also relate the truncated and exact inner products by an insertion of interactions, whose perturbative expansion produces a sum over time evolutions generated by pairs of pants, evoking an analogy to group averaging.", "url": "https://arxiv.org/abs/2609.16116", "type": "理论", "summary": "时空拓扑上的引力和表明了一种婴儿宇宙场论，其量子是整个宇宙。我们根据群平均振幅开发了这样的描述，该描述施加了引力约束并定义了单宇宙理论中的物理内积。为了加强与普通 QFT 的对比，我们从一维世界线上的引力开始，这可以通过减少高维圆柱体来产生。对于配对边界分量的多个非相互作用世界线，婴儿宇宙希尔伯特空间是物理单宇宙希尔伯特空间上的对称福克空间，并且宇宙场以跨越后者的壳上模式扩展。每个模式都乘以创建和消灭运算符的总和，因此模式系数可以交换。因此，模式展开明确了场的交换性及其惠勒-德威特线性场方程。对系数进行对角化可通过标记超选择 ($\\alpha$-) 扇区的壳上场配置上的高斯路径积分来恢复统计描述。我们采取探索性的步骤来实现更通用的拓扑。\n\n盘状拓扑连贯地改变了无边界态，将哈特尔-霍金波函数转变为单点函数。即使用相互作用的费曼图表示的非平凡拓扑，我们认为每个边界附近的组平均仍然强制执行相同的线性场方程，而相互作用则通过 $\\alpha$ 扇区上的非高斯测度进入。在拓扑 Marolf-Maxfield 模型中，我们将圆盘和圆柱截断提升为包含所有拓扑的完整理论的精确福克空间表示。我们还通过插入交互作用将截断内积和精确内积联系起来，交互作用的扰动扩展产生了由裤子产生的随时间演变的总和，这与群体平均进行了类比。", "authors": [{"name": "Hong Zhe Chen"}], "featured_authors": [{"name": "Hong Zhe Chen"}], "author_count": 1}, {"id": "2609.16117", "category": "hep-th", "title": "An attempt to derive the LVS from a 10d EFT perspective", "abstract": "Non-perturbative scalar potentials are a central ingredient for stabilising moduli in flux compactifications. A key target in this context is the direct 10d derivation of the LVS AdS potential, i.e., the scalar potential of the Large Volume Scenario before the uplift. The familiar result, relying on 4d supergravity machinery and large volume expansion, consists of three terms of parametric form $\\exp(-2a\\tau_s)/{\\mathcal V}$, $W_0\\exp(-a\\tau_s)/{\\mathcal V}^2$, and $W_0^2/{\\mathcal V}^3$. In plain 10d EFT language, the first term is an instanton-anti-instanton effect while the second term comes from a single instanton coupled to 3-form flux. When attempting to derive the suppression by the volume ${\\mathcal V}$ directly from the 10d EFT, one encounters a puzzle: One expects a flux-dilution factor $1/\\sqrt{\\mathcal V}$ for the second term and a factor $1/{\\mathcal V}^2$ from Weyl rescaling to the 4d Einstein frame for both the first and second term. Thus, the total volume suppression for these two terms is stronger than in the aforementioned 4d EFT expectations. We discuss the underlying logic in detail, also in the gaugino condensation case, but fail to find a satisfactory explanation for the mismatch. While log-corrections to the Kähler potential may be responsible, these would have to be strong enough to affect the outcome of the LVS scheme at the ${\\mathcal O}(1)$ level. What is worse, the origin of the required correction remains unclear.", "url": "https://arxiv.org/abs/2609.16117", "type": "理论", "summary": "非微扰标量势是通量紧化中稳定模量的核心要素。在这种情况下的一个关键目标是 LVS AdS 潜力的直接 10 d 推导，即提升之前大容量场景的标量潜力。熟悉的结果依赖于 4d 超重力机械和大体积膨胀，由参数形式 $\\exp(-2a\\tau_s)/{\\mathcal V}$、$W_0\\exp(-a\\tau_s)/{\\mathcal V}^2$ 和 $W_0^2/{\\mathcal V}^3$ 的三项组成。在简单的 10d EFT 语言中，第一项是瞬子-反瞬子效应，而第二项来自与 3 种磁通耦合的单个瞬子。当尝试直接从 10 d EFT 导出体积 ${\\mathcal V}$ 的抑制时，遇到了一个难题：人们预计第二项有一个通量稀释因子 $1/\\sqrt{\\mathcal V}$ ，而第一项和第二项都期望有一个从 Weyl 重新缩放到 4d 爱因斯坦坐标系的因子 $1/{\\mathcal V}^2$ 。因此，这两项的总交易量抑制比上述 4d EFT 预期更强。\n\n我们详细讨论了高吉诺凝聚案例中的基本逻辑，但未能找到对不匹配的令人满意的解释。虽然对 Kähler 势的对数校正可能是原因，但这些校正必须足够强大才能在 ${\\mathcal O}(1)$ 水平上影响 LVS 方案的结果。更糟糕的是，所需修正的起源仍不清楚。", "authors": [{"name": "Arthur Hebecker"}, {"name": "Andreas Schachner"}, {"name": "Gaetano Maria Sifo"}], "featured_authors": [{"name": "Arthur Hebecker"}, {"name": "Andreas Schachner"}, {"name": "Gaetano Maria Sifo"}], "author_count": 3}, {"id": "2609.16130", "category": "hep-th", "title": "Single-Instance Observables in the Sachdev-Ye-Kitaev Model", "abstract": "We present a diagrammatic expansion for thermal expectation values of low-weight Majorana strings in a fixed realization of the $N$-fermion Sachdev--Ye--Kitaev (SYK) model. At each order in the expansion, the observable is expressed as a finite sum of polynomials in the couplings multiplied by temperature-dependent kernels built from the large-$N$ melonic propagator. At fixed $\\beta J$, the expansion is organized in powers of $N^{-1/2}$, and each order can be efficiently evaluated with classical resources polynomial in $N$. The expansion also extends to correlations at arbitrary imaginary times and sufficiently short real times. For the four-body SYK model, we show that the diagrammatic predictions give an excellent account of exact diagonalization results at sizes up to $N=24$. We also apply the method to the Maldacena--Qi (MQ) model formed from two identical copies of a fixed SYK realization. This enables the identification of a nearby SYK-like Hamiltonian whose thermofield double state has higher fidelity with the Maldacena--Qi ground state than the thermofield double of the original SYK Hamiltonian.", "url": "https://arxiv.org/abs/2609.16130", "type": "理论", "summary": "我们在 $N$-费米子 Sachdev--Ye--Kitaev (SYK) 模型的固定实现中提出了低权重马约拉纳弦热期望值的图解展开。在展开的每个阶次，可观测值表示为耦合中多项式的有限和乘以由大型 $N$ 甜瓜传播器构建的温度相关内核。在固定的 $\\beta J$ 下，展开式以 $N^{-1/2}$ 的幂形式组织，并且每个阶都可以使用 $N$ 中的经典资源多项式进行有效评估。该扩展还扩展到任意虚数时间和足够短的实时间的相关性。对于四体 SYK 模型，我们表明图解预测很好地说明了尺寸高达 $N=24$ 的精确对角化结果。我们还将该方法应用于由固定 SYK 实现的两个相同副本形成的 Maldacena--Qi (MQ) 模型。这使得能够识别附近的类 SYK 哈密顿量，其热场双态与 Maldacena-Qi 基态的保真度高于原始 SYK 哈密顿量的热场双态。", "authors": [{"name": "Brian Swingle"}], "featured_authors": [{"name": "Brian Swingle"}], "author_count": 1}, {"id": "2609.16132", "category": "hep-th", "title": "Exact group invariant scar towers in two dimensional gauge theories", "abstract": "We construct exact many-body scar towers in two dimensional gauge theories with two flavors of massless fundamental fermions. For oppositely charged fermions, the scar subspace is generated by a gauge-neutral $\\eta$-pairing operator, and admits a purely algebraic construction. Exact diagonalization methods reveal anomalously low entanglement and long-range pair correlations in the scar states. Charge conjugation maps the $\\eta$-tower to a vector-flavor polarization sector of the equal charge model, yielding an interpretation as a coherent flavor mode with Josephson-like phase dynamics. Finite fermion masses mix the protected pair with an orthogonal channel and destroy the exact tower. The identified scar tower can be algebraically realized in a large family of lattice field theories, revealing a universal character of these states. Our results provide an analytical construction of invariant scar subspaces in a gauge theory with a nontrivial continuum interpretation.", "url": "https://arxiv.org/abs/2609.16132", "type": "理论", "summary": "我们用两种无质量基本费米子在二维规范理论中构造了精确的多体疤痕塔。对于带相反电荷的费米子，疤痕子空间由规范中性 $\\eta$ 配对算子生成，并允许纯代数构造。精确对角化方法揭示了疤痕态中异常低的纠缠和长程对相关性。电荷共轭将$\\eta$塔映射到等电荷模型的矢量风味偏振扇区，产生具有类约瑟夫森相动力学的相干风味模式的解释。有限的费米子质量将受保护的对与正交通道混合并摧毁确切的塔。所识别的疤痕塔可以在一大群晶格场论中用代数方式实现，揭示了这些状态的普遍特征。我们的结果提供了规范理论中不变疤痕子空间的分析构造，并具有非平凡的连续统解释。", "authors": [{"name": "João Barata"}, {"name": "Kiryl Pakrouski"}, {"name": "Andrey V. Sadofyev"}], "featured_authors": [{"name": "João Barata"}, {"name": "Kiryl Pakrouski"}, {"name": "Andrey V. Sadofyev"}], "author_count": 3}, {"id": "2609.16136", "category": "hep-th", "title": "$D$-term and $F$-term potential of non-Abelian D7-branes in IIB Calabi-Yau orientifolds", "abstract": "We derive the 4d $D$-term and $F$-term potential generated by a D7-brane stack in Calabi-Yau orientifold compactifications of type IIB string theory, taking into account the effect of worldvolume and ISD bulk fluxes and the non-Abelian nature of the brane fields. This potential is an important ingredient for moduli stabilization in IIB, e.g., in de Sitter scenarios using a T-brane uplift. While aspects of the $D$-term and $F$-term parts of the potential have been inferred before with various arguments, we provide here a unified first-principles derivation of the full potential by dimensionally reducing the non-Abelian DBI action of the D7-branes. Our result generalizes previous expressions and agrees with them where applicable, thus confirming the mutual consistency of the various approaches. Moreover, we provide a thorough discussion of corrections from integrating out KK modes and argue that demanding control over such corrections implies bounds on the Calabi-Yau volume and the brane fields. Aside from these various results for the 4d effective action, our calculation also shows how bulk fluxes correct the potential and the BPS equations in the 8d worldvolume theory that governs the microscopic dynamics of non-Abelian branes.", "url": "https://arxiv.org/abs/2609.16136", "type": "理论", "summary": "考虑到世界体积和 ISD 体通量的影响以及膜场的非阿贝尔性质，我们推导了 IIB 型弦理论的 Calabi-Yau 东方紧化中 D7 膜堆栈产生的 4d $D$-term 和 $F$-term 势。这种潜力是 IIB 模量稳定的重要因素，例如，在使用 T 形膜隆起的德西特场景中。虽然之前已经通过各种论证推断了势的 $D$ 项和 $F$ 项部分的各个方面，但我们在这里通过降维减少 D7 膜的非阿贝尔 DBI 作用，提供了全部势的统一第一原理推导。我们的结果概括了以前的表达式并在适用的情况下与它们一致，从而证实了各种方法的相互一致性。此外，我们对整合 KK 模式的校正进行了彻底的讨论，并认为要求对此类校正的控制意味着卡拉比-丘体积和膜场的界限。\n\n除了 4 维有效作用的这些不同结果之外，我们的计算还显示了体通量如何校正控制非阿贝尔膜微观动力学的 8 维世界体积理论中的势能和 BPS 方程。", "authors": [{"name": "Daniel Junghans"}], "featured_authors": [{"name": "Daniel Junghans"}], "author_count": 1}, {"id": "2609.16141", "category": "hep-th", "title": "Symmetry Descent in M-theory, Part I: A Twelve-Dimensional Parent Theory", "abstract": "We initiate a symmetry descent procedure for M-theory engineered quantum field theories. Starting from a higher form BF theory supplemented by a cubic bulk topological interaction, we construct a gauge-invariant bulk-boundary system whose edge modes acquire generalized Maxwell--Chern--Simons dynamics after the introduction of a metric-dependent boundary action. The nonlinear contribution to the boundary equation is induced entirely by the cubic bulk interaction. In the case of twelve dimensional bulk parent, the resulting boundary conditions reproduce the local flux equations of the eleven-dimensional supergravity $C$-field, including the gravitational $I_8$ correction. Thus, the electric--magnetic pairing and the nonlinear Maxwell--Chern--Simons dynamics descend from a single 12D topological model. Using Hypothesis H, we identify the bulk equations with the Sullivan model of $S^4$ and interpret their nonlinear gauge transformations as homotopies. We then propose a twisted 4-cohomotopy quantization of the bulk fields and a homotopy pullback description of the coupled bulk--boundary field space. The construction provides both a local dynamical mechanism for M-theory symmetry descent and a candidate global characterization of its fields.", "url": "https://arxiv.org/abs/2609.16141", "type": "理论", "summary": "我们为 M 理论工程量子场论启动了对称下降过程。从更高形式的BF理论出发，辅以立方体拓扑相互作用，我们构造了一个规范不变的体边界系统，在引入度量相关的边界作用后，其边缘模式获得了广义麦克斯韦-陈-西蒙斯动力学。对边界方程的非线性贡献完全是由立方体相互作用引起的。在十二维块体母体的情况下，产生的边界条件再现了十一维超重力 $C$ 场的局部通量方程，包括引力 $I_8$ 校正。因此，电磁配对和非线性麦克斯韦-陈-西蒙斯动力学源自单个 12 维拓扑模型。使用假设 H，我们用 $S^4$ 的沙利文模型识别体方程，并将它们的非线性规范变换解释为同伦。然后，我们提出了体场的扭曲 4-同伦量化和耦合体边界场空间的同伦回拉描述。\n\n该构造既提供了 M 理论对称性下降的局部动力学机制，又提供了其场的候选全局表征。", "authors": [{"name": "Pinak Banerjee"}, {"name": "Subham Roy"}, {"name": "Xingyang Yu"}], "featured_authors": [{"name": "Pinak Banerjee"}, {"name": "Subham Roy"}, {"name": "Xingyang Yu"}], "author_count": 3}, {"id": "2609.16146", "category": "hep-th", "title": "Separation of variables for non-diagonalisable models: XXX with twisted boundary conditions", "abstract": "We study the Heisenberg XXX spin chain with twisted periodic boundary conditions with a defective twist matrix. Using quantum separation of variables, we show that the generalised eigenvectors of this system can be characterised in terms of a modified TQ equation that we have named \"Jordanian TQ equation\". We also show that the wavefunction in the separated basis is only separable for true eigenvectors, while the wavefunction for generalised eigenvectors of higher rank is given instead by a sum over weak compositions.", "url": "https://arxiv.org/abs/2609.16146", "type": "理论", "summary": "我们研究了具有扭曲周期性边界条件和有缺陷的扭曲矩阵的海森堡 XXX 自旋链。使用变量的量子分离，我们表明该系统的广义特征向量可以用我们命名为“Jordanian TQ 方程”的修改 TQ 方程来表征。我们还表明，分离基中的波函数仅对于真实特征向量是可分离的，而高阶广义特征向量的波函数则由弱组合的总和给出。", "authors": [{"name": "Juan Miguel Nieto García"}], "featured_authors": [{"name": "Juan Miguel Nieto García"}], "author_count": 1}, {"id": "2609.16153", "category": "hep-th", "title": "The Role of Completeness in Probing Symmetry Breaking", "abstract": "Completeness is widely recognized in quantum information as an important property of a family of monotones, because it ensures that no information relevant to state conversion is lost. We show that completeness is also physically important in many-body systems: an incomplete measure of symmetry breaking can miss essential features of symmetry-restoration dynamics. We study the logarithmic characteristic function (LCF), also known as the string order parameter, whose full family is complete for exact i.i.d. pure-state conversion under symmetry-preserving operations for finite groups. We introduce a fidelity-based extension of the LCF to mixed states and identify two concrete advantages over entanglement asymmetry (EA). First, for a finite symmetry group $G$, EA is bounded by $\\log |G|$ and can approach the same saturated value for different initial states in the thermodynamic limit, making their relaxation curves indistinguishable and preventing the identification of a discrete-symmetry Mpemba effect. By contrast, the LCF can remain extensive, with a coefficient that depends on the initial state and time, and therefore continues to distinguish their relaxation dynamics. Second, different LCF components can exhibit distinct relaxation and crossing behavior, including cases in which EA shows no crossing. We demonstrate these advantages in spin-chain quenches and a single-qubit system under depolarizing noise. We also develop a replica construction for the fidelity-based LCF in quantum field theory and derive analytical results for conformal field theory.", "url": "https://arxiv.org/abs/2609.16153", "type": "理论", "summary": "在量子信息中，完整性被广泛认为是单调族的一个重要属性，因为它确保了与状态转换相关的信息不会丢失。我们证明，完整性在多体系统中在物理上也很重要：对称性破缺的不完整测量可能会错过对称性恢复动力学的基本特征。我们研究对数特征函数 (LCF)，也称为串序参数，其完整家族对于精确 i.i.d 来说是完整的。有限群保对称运算下的纯态转换。我们将 LCF 引入到混合态的基于保真度的扩展，并确定了相对于纠缠不对称 (EA) 的两个具体优势。首先，对于有限对称群 $G$，EA 以 $\\log |G|$ 为界，并且可以在热力学极限内的不同初始状态接近相同的饱和值，使得它们的弛豫曲线不可区分，并阻止离散对称 Mpemba 效应的识别。相比之下，LCF 可以保持广泛，其系数取决于初始状态和时间，因此可以继续区分它们的弛豫动态。\n\n其次，不同的 LCF 组件可以表现出不同的弛豫和交叉行为，包括 EA 不显示交叉的情况。我们在去极化噪声下的自旋链猝灭和单量子位系统中展示了这些优势。我们还开发了量子场论中基于保真度的 LCF 的复制结构，并得出了共形场论的分析结果。", "authors": [{"name": "Yuya Kusuki"}, {"name": "Hiroyasu Tajima"}, {"name": "Shion Yamashika"}], "featured_authors": [{"name": "Yuya Kusuki"}, {"name": "Hiroyasu Tajima"}, {"name": "Shion Yamashika"}], "author_count": 3}, {"id": "2609.16154", "category": "hep-th", "title": "Making the Great Desert Bloom", "abstract": "The absence of new physics beyond neutrino masses between the weak scale and the Planck scale is referred to as the great desert. It is often seen as a nightmare scenario for particle physics. Here we argue, by contrast, that the great desert assumption in fact has dramatic implications: it predicts that the Standard Model has a semi-classical AdS$_4$ vacuum with CFT$_3$ dual and, under reasonable assumptions, must be accompanied by at least one extra dimension significantly larger than Planck length. We also present one plausible candidate CFT$_3$ to be ``the\" dual to the Standard Model.", "url": "https://arxiv.org/abs/2609.16154", "type": "理论", "summary": "在弱尺度和普朗克尺度之间缺乏中微子质量之外的新物理学被称为大沙漠。这通常被视为粒子物理学的噩梦场景。相比之下，我们在这里认为，大沙漠假设实际上具有戏剧性的含义：它预测标准模型具有半经典 AdS$_4$ 真空与 CFT$_3$ 对偶，并且在合理的假设下，必须伴随至少一个显着大于普朗克长度的额外维度。我们还提出了一种可能的候选 CFT$_3$，作为标准模型的“双重”模型。", "authors": [{"name": "Jacques Distler"}, {"name": "Andreas Karch"}], "featured_authors": [{"name": "Jacques Distler"}, {"name": "Andreas Karch"}], "author_count": 2}, {"id": "2609.16162", "category": "hep-th", "title": "Persistent Spontaneous Time-Reversal Breaking", "abstract": "We provide an analytic realization of spontaneous parity and time-reversal breaking without thermal restoration in a local, unitary, ultraviolet-complete quantum field theory in $2+1$ dimensions with finitely many fields. The theory is defined by a relevant Yukawa deformation of a product of the critical biconical vector model and free massless Dirac fermions. This deformation induces a renormalization group flow whose infrared endpoint is a decoupled product of the critical vector model and the conformal Gross-Neveu-Yukawa model. At zero temperature, the vacuum preserves both symmetries, whereas upon heating, the theory undergoes an inverse thermal transition at a finite critical temperature. Above this temperature, a fermion mass, odd under parity and time reversal, is dynamically generated, and the broken phase persists to arbitrarily high temperatures.", "url": "https://arxiv.org/abs/2609.16162", "type": "理论", "summary": "我们在具有有限多个场的 $2+1$ 维度的局域、酉、紫外完全量子场论中提供了自发宇称和时间反转破缺的解析实现，无需热恢复。该理论是通过临界双锥矢量模型和自由无质量狄拉克费米子的乘积的相关汤川变形来定义的。这种变形引起重正化群流，其红外端点是临界矢量模型和共形 Gross-Neveu-Yukawa 模型的解耦乘积。在零温度下，真空保持两种对称性，而在加热时，该理论在有限的临界温度下经历逆热转变。高于该温度，动态生成奇偶校验和时间反转下的奇数费米子质量，并且破碎相持续到任意高温。", "authors": [{"name": "Michael Smolkin"}, {"name": "Lev Yung"}], "featured_authors": [{"name": "Michael Smolkin"}, {"name": "Lev Yung"}], "author_count": 2}, {"id": "2609.16164", "category": "hep-th", "title": "Schwinger-Keldysh effective actions for non-hydrodynamic poles and branch cuts", "abstract": "Retarded thermal correlators, analytically continued to complex frequency, exhibit non-hydrodynamic poles and branch cuts that constrain hydrodynamics. We construct Gaussian Schwinger-Keldysh effective actions in which branch cuts arise from continua of relaxation poles and response functions are governed by Stieltjes transforms of relaxation-time densities. Dynamical KMS symmetry, positivity and stability constrain the spectra, while endpoint behaviour controls the local branch structure and near-edge pole scaling. The illustrative examples of uniform and power-law densities exhibit respectively beyond-all-orders pole-endpoint separation and a continuous interpolation between pole-pole and pole-branch-point termination. Finally, we show that an energy-dependent relaxation-time approximation in kinetic theory provides a microscopic realization of our branch cuts at zero momentum.", "url": "https://arxiv.org/abs/2609.16164", "type": "理论", "summary": "延迟热相关器在分析上持续到复数频率，表现出限制流体动力学的非流体动力学极点和分支切割。我们构建了高斯 Schwinger-Keldysh 有效动作，其中分支切割由松弛极点的连续体产生，响应函数由松弛时间密度的 Stieltjes 变换控制。动态 KMS 对称性、正性和稳定性约束谱，而端点行为控制局部分支结构和近边缘极点缩放。均匀密度和幂律密度的说明性示例分别表现出超全阶极端点分离以及极-极点和极-分支点终止之间的连续插值。最后，我们证明了动力学理论中与能量相关的弛豫时间近似提供了零动量分支切割的微观实现。", "authors": [{"name": "Andrea Amoretti"}, {"name": "Matteo Anselmi"}, {"name": "Daniel K. Brattan"}], "featured_authors": [{"name": "Andrea Amoretti"}, {"name": "Matteo Anselmi"}, {"name": "Daniel K. Brattan"}], "author_count": 3}, {"id": "2609.16165", "category": "hep-th", "title": "Instanton Interactions and the Axion Weak Gravity Conjecture", "abstract": "The Weak Gravity Conjecture admits a formulation in terms of long-range charged particle self-interactions being repulsive. We adopt a similar approach to the Axionic Weak Gravity Conjecture by considering long-range instanton interactions. At leading order, in the instanton separation, such interactions are mediated purely by massless scalar fields. Gravitational and gauge interactions are sub-leading. We formulate a repulsive interaction Axionic Weak Gravity Conjecture, which forms a bound on the scalar field dependence of the complex Euclidean instanton action. We show that in standard ultraviolet complete examples, this bound implies the usual formulation of the Axionic Weak Gravity Conjecture, while generally being stronger. Because this formulation is purely a statement about massless scalar fields, it implies that in the absence of massless scalars the usual bound on the axion decay constant could be modified.", "url": "https://arxiv.org/abs/2609.16165", "type": "理论", "summary": "弱引力猜想承认长程带电粒子自相互作用是排斥的。我们通过考虑长程瞬子相互作用，采用与轴离子弱引力猜想类似的方法。在前导阶，在瞬子分离中，这种相互作用纯粹由无质量标量场介导。重力和规范相互作用是次领先的。我们提出了排斥相互作用轴子弱引力猜想，它对复杂的欧几里德瞬子作用的标量场依赖性形成了界限。我们证明，在标准的紫外完整例子中，这个界限意味着轴子弱重力猜想的通常公式，同时通常更强。因为这个公式纯粹是关于无质量标量场的陈述，所以它意味着在没有无质量标量的情况下，轴子衰变常数的通常界限可以被修改。", "authors": [{"name": "Jarod Hattab"}, {"name": "Eran Palti"}], "featured_authors": [{"name": "Jarod Hattab"}, {"name": "Eran Palti"}], "author_count": 2}, {"id": "2609.16169", "category": "hep-th", "title": "A $dS_4$ maximum in M-theory from Casimir energies on Riemann-flat manifolds", "abstract": "We describe a fully explicit, four-dimensional, top-down de Sitter saddle, constructed via compactification of M-theory on the Riemann-flat manifold $T^7/\\mathbb{Z}_8$. The solution has a vacuum energy of $5.02\\cdot 10^{-10}\\,M_\\text{Pl}^4$, a hierarchy $m_{KK}/H\\sim 10^{2}$, and is under control with respect to higher-loop and higher-derivative corrections. While the solution is the first example of a top-down dS maximum in four dimensions, it is far from being phenomenologically viable. The solution also suggests several promising directions in the search for higher-quality dS saddles in the Riemann-flat Landscape, which we describe.", "url": "https://arxiv.org/abs/2609.16169", "type": "理论", "summary": "我们描述了一个完全明确的、四维的、自上而下的德西特鞍，它是通过黎曼平坦流形 $T^7/\\mathbb{Z}_8$ 上的 M 理论的紧致化构建的。该解的真空能量为 $5.02\\cdot 10^{-10}\\,M_\\text{Pl}^4$，层次结构为 $m_{KK}/H\\sim 10^{2}$，并且在高环和高导数校正方面受到控制。虽然该解决方案是四个维度中自上而下 dS 最大值的第一个示例，但它在现象学上远非可行。该解决方案还提出了在黎曼平面景观中寻找更高质量 dS 鞍座的几个有希望的方向，正如我们所描述的。", "authors": [{"name": "Miquel Aparici"}, {"name": "Bruno Valeixo Bento"}, {"name": "Miguel Montero"}], "featured_authors": [{"name": "Miquel Aparici"}, {"name": "Bruno Valeixo Bento"}, {"name": "Miguel Montero"}], "author_count": 3}, {"id": "2609.16263", "category": "hep-th", "title": "Zero- and Finite-Temperature Casimir Effect in a Fracton Gauge Field", "abstract": "We investigate the zero- and finite-temperature Casimir interaction of the free trace-full scalar-charge fracton gauge field between two parallel reflecting boundaries. A variational analysis determines a consistent boundary-value problem that confines all five physical polarizations of the rank-two field. The spectrum separates into three faster and two slower propagating modes. At zero temperature, the vacuum interaction weights the modes by their propagation speeds; when the fast-branch speed is set equal to the speed of light, the resulting Casimir pressure is approximately 2.21 times the ideal electromagnetic value. At finite temperature, the two branches acquire different thermal weights and generate a split crossover. The normalized free energy and pressure follow distinct crossover profiles but approach the same classical high-temperature ratio of 2.5 relative to ideal electromagnetism, because the Matsubara zero mode counts the five confined polarizations independently of their propagation speeds. We derive the exact thermal interaction, its low- and high-temperature limits, and the dependence of the crossover scale on the effective gauge-field velocity. The transition from velocity-weighted quantum fluctuations to classical mode counting provides a direct spectral signature of the multi-branch structure of the higher-rank gauge field.", "url": "https://arxiv.org/abs/2609.16263", "type": "理论", "summary": "我们研究了两个平行反射边界之间自由痕量满标量电荷分形规范场的零温度和有限温度卡西米尔相互作用。变分分析确定了一个一致的边值问题，该问题限制了二级场的所有五个物理极化。频谱分为三种较快的传播模式和两种较慢的传播模式。在零温度下，真空相互作用通过传播速度对模式进行加权；当快分支速度设置为等于光速时，产生的卡西米尔压力约为理想电磁值的2.21倍。在有限温度下，两个分支获得不同的热重并产生分裂交叉。归一化自由能和压力遵循不同的交叉曲线，但相对于理想电磁学接近相同的经典高温比 2.5，因为松原零模式独立于传播速度对五个受限极化进行计数。我们推导出精确的热相互作用、其低温和高温极限，以及交叉尺度对有效规范场速度的依赖性。\n\n从速度加权量子涨落到经典模式计数的转变提供了高阶规范场的多分支结构的直接光谱特征。", "authors": [{"name": "Celio R. Muniz"}], "featured_authors": [{"name": "Celio R. Muniz"}], "author_count": 1}, {"id": "2609.16400", "category": "hep-th", "title": "Edge observables in Maxwell theory on null boundaries", "abstract": "We study edge observables in three-dimensional Maxwell theory on null boundaries using a Hamiltonian formulation adapted to null foliations. We consider three backgrounds: Minkowski spacetime, the BTZ black hole, and de Sitter space, where the relevant boundaries are, respectively, null infinity, the black hole horizon, and the cosmological horizon. In all three cases we find, besides the usual $U(1)$ charge, a second edge observable associated with an intrinsic symmetry on the null boundary. The two charges are well defined quasilocally. They form a centrally extended algebra which, in Fourier modes, becomes two independent Abelian Kac-Moody algebras with opposite levels. Thus, the same centrally extended edge structure appears at both asymptotic and finite-distance null boundaries.", "url": "https://arxiv.org/abs/2609.16400", "type": "理论", "summary": "我们使用适用于零叶状结构的哈密顿公式研究零边界上三维麦克斯韦理论中的边缘可观测量。我们考虑三个背景：闵可夫斯基时空、BTZ 黑洞和德西特空间，其中相关边界分别是零无穷大、黑洞视界和宇宙视界。在所有三种情况下，我们发现，除了通常的 $U(1)$ 电荷之外，还有与零边界上的内在对称性相关的第二个边缘可观察值。这两个电荷在准局部上得到了很好的定义。它们形成一个中心扩展代数，在傅里叶模式下，成为两个具有相反级的独立阿贝尔卡克-穆迪代数。因此，相同的中心延伸边缘结构出现在渐近和有限距离零边界处。", "authors": [{"name": "Dušan Đorđević"}, {"name": "Olivera Miskovic"}, {"name": "Antonia Montecinos"}, {"name": "Tatjana Vukašinac"}], "featured_authors": [{"name": "Dušan Đorđević"}, {"name": "Olivera Miskovic"}, {"name": "Antonia Montecinos"}, {"name": "Tatjana Vukašinac"}], "author_count": 4}, {"id": "2609.16455", "category": "hep-th", "title": "Stringy Gauge Structures", "abstract": "A field theory action, able to incorporate stringy gauge symmetry enhancement-breaking effects, which occur at particular points of moduli space in a heterotic string toroidal compactification framework, was previously constructed from three-point interactions and duality symmetries. Via doubled periodic coordinates and a non-commutative product, it encodes the non-Abelian structure in a background-independent form. Moduli-space dependence becomes manifest upon performing a generalized mode expansion. Here we further elaborate on this construction. In particular, we propose field transformations for the retained sectors that make up the foundations of a potential symmetry of the action and that, when mode expanded at enhancement points in moduli space, contain the usual non-Abelian gauge transformations. We also examine the covariance of the corresponding scalar derivative structures. Although the proposal must be regarded as a truncated version of a full, presently unknown field-theory description, it already encodes representations of massless and massive states containing up to one oscillator excitation. Finally, we relate the construction to gauged DFT with an extended tangent space by associating generalized Kaluza-Klein modes considered here with additional generalized-frame directions. At enhancement, their brackets reproduce the enhanced gauge algebra; away from enhancement, the same algebraic structure is recovered by rotating the Cartan basis.", "url": "https://arxiv.org/abs/2609.16455", "type": "理论", "summary": "场论作用能够结合弦规范对称性增强破缺效应，这种效应发生在异质弦环形致密化框架中模空间的特定点，之前是根据三点相互作用和对偶对称性构建的。通过双周期坐标和非交换积，它以与背景无关的形式编码非阿贝尔结构。在执行广义模式展开时，模空间依赖性变得明显。这里我们进一步阐述一下这个构造。特别是，我们提出了保留扇区的场变换，这些扇区构成了作用的潜在对称性的基础，并且当模式在模空间中的增强点处扩展时，包含通常的非阿贝尔规范变换。我们还检查了相应标量导数结构的协方差。尽管该提议必须被视为完整的、目前未知的场论描述的截断版本，但它已经编码了包含最多一个振荡器激励的无质量和质量状态的表示。\n\n最后，我们通过将这里考虑的广义 Kaluza-Klein 模式与附加的广义框架方向相关联，将构造与具有扩展切线空间的规范 DFT 联系起来。在增强时，它们的括号再现了增强的规范代数；远离增强，通过旋转嘉当基可以恢复相同的代数结构。", "authors": [{"name": "Gerardo Aldazabal"}, {"name": "Eduardo Andrés"}, {"name": "Lucía M. Cabrera"}, {"name": "Martín Mayo"}], "featured_authors": [{"name": "Gerardo Aldazabal"}, {"name": "Eduardo Andrés"}, {"name": "Lucía M. Cabrera"}, {"name": "Martín Mayo"}], "author_count": 4}, {"id": "2609.16896", "category": "hep-th", "title": "Unitarity and the Forward Direction in Theories with Long-Range Forces", "abstract": "Integrating scattering amplitudes over the forward direction, and consequently the unitarity constraints one extracts from such integrals, can appear ambiguous in theories with long-range forces. Standard techniques for bounding EFT couplings then typically produce bounds that depend on an arbitrary infrared scale. We study a non-relativistic model in which the standard techniques produce such an ambiguous bound, but which is simple enough that the exact bound can also be derived non-perturbatively and shown to involve no infrared scale. We then show how to derive bounds perturbatively, with no infrared scale entering at any stage. This requires two ingredients: accounting for the modified distributional structure of long-range amplitudes, and using distorted-wave perturbation theory (DWPT), which treats the Coulomb dynamics exactly. Together they give amplitudes with well-defined partial-wave projections and no spurious infrared divergences. Interpreting the model as an EFT with an ultraviolet cutoff $\\Lambda_{\\rm EFT}$, we derive cutoff-dependent bounds valid for arbitrary UV completions. Taking $\\Lambda_{\\rm EFT}\\to\\infty$ at each order yields bounds that rapidly converge to the exact bound, reaching $0.002\\%$ accuracy at fourth order in the expansion. Finally, we demonstrate that every order of the DWPT expansion resums infinitely many Feynman diagrams of short-range perturbation theory, which individually evaluate to multiple polylogarithms and complete elliptic integrals, into a compact expression. At the orders we compute, no integration is even required, suggesting that DWPT may offer a simpler representation of scattering amplitudes than standard perturbation theory.", "url": "https://arxiv.org/abs/2609.16896", "type": "理论", "summary": "对前向散射振幅进行积分，以及从此类积分中提取的幺正性约束，在具有长程力的理论中可能会显得不明确。用于限制 EFT 耦合的标准技术通常会产生取决于任意红外尺度的限制。我们研究了一种非相对论模型，其中标准技术产生了这样一个模糊的界限，但它足够简单，也可以非微扰地导出精确的界限，并且表明不涉及红外尺度。然后，我们展示如何以扰动方式导出边界，而在任何阶段都没有红外尺度进入。这需要两个要素：考虑长程振幅的修正分布结构，并使用扭曲波扰动理论（DWPT），它可以准确地处理库仑动力学。它们一起给出具有明确的分波投影的幅度，并且没有寄生的红外发散。将该模型解释为具有紫外线截止 $\\Lambda_{\\rm EFT}$ 的 EFT，我们得出对任意 UV 完成有效的截止相关边界。\n\n在每个阶上采用 $\\Lambda_{\\rm EFT}\\to\\infty$ 会产生快速收敛到精确边界的边界，在展开的第四阶处达到 $0.002\\%$ 精度。最后，我们证明了 DWPT 展开的每一个阶都会恢复无限多个短程微扰理论的费曼图，这些图分别计算多个多对数和完全椭圆积分，形成一个紧凑的表达式。在我们计算的阶数下，甚至不需要积分，这表明 DWPT 可以提供比标准微扰理论更简单的散射幅度表示。", "authors": [{"name": "Luke Lippstreu"}], "featured_authors": [{"name": "Luke Lippstreu"}], "author_count": 1}, {"id": "2609.16924", "category": "hep-th", "title": "Positivity Bounds in $\\mathcal N =1$ Supersymmetry", "abstract": "For a low-energy Effective Field Theory (EFT) to admit a consistent ultraviolet (UV) completion, it must adhere to the fundamental principles of locality, unitarity, analyticity, and Lorentz invariance. This leads to positivity constraints on certain Wilson coefficients via dispersion relations of $2\\rightarrow2$ forward elastic amplitudes, which carry significant implications for both theoretical consistency and experimental phenomenology. In this work, we extend this bootstrap framework to $\\mathcal N = 1$ supersymmetric theories, where the super-Poincaré algebra relates the bosonic and fermionic degrees of freedom within a single supermultiplet. Supersymmetric Ward identities (SWIs) enforce exact linear relations among component scattering amplitudes. Consequently, the Wilson coefficients associated with different $2\\rightarrow2$ processes are mutually constrained, rendering their respective positivity bounds dependent. Focusing on dimension-8 operators, we explicitly show the positivity bounds on quartic interactions involving scalars, fermions and gauge fields, and demonstrate how they are related as a direct consequence of the SWIs. Furthermore, we expect that the algebraic nature of this framework naturally extends to loop-level superamplitudes and higher-point processes, providing a unified bootstrap perspective on supersymmetric EFTs.", "url": "https://arxiv.org/abs/2609.16924", "type": "理论", "summary": "对于低能有效场论 (EFT) 来说，要实现一致的紫外线 (UV) 完成，它必须遵守局域性、幺正性、解析性和洛伦兹不变性的基本原理。这导致通过 $2\\rightarrow2$ 正向弹性振幅的色散关系对某些威尔逊系数进行正性约束，这对理论一致性和实验现象学都有重大影响。在这项工作中，我们将此引导框架扩展到 $\\mathcal N = 1$ 超对称理论，其中超庞加莱代数将单个超多重态内的玻色子和费米子自由度联系起来。超对称 Ward 恒等式 (SWI) 强制分量散射幅度之间存在精确的线性关系。因此，与不同 $2\\rightarrow2$ 过程相关的威尔逊系数是相互约束的，使得它们各自的正边界相互依赖。我们重点关注 8 维算子，明确展示了涉及标量、费米子和规范场的四次相互作用的正界，并演示了它们如何作为 SWI 的直接结果相互关联。\n\n此外，我们预计该框架的代数性质自然会扩展到循环级超振幅和更高点的过程，从而为超对称 EFT 提供统一的引导视角。", "authors": [{"name": "Jingxuan Bu"}, {"name": "Jiayin Gu"}, {"name": "Runqing Wang"}], "featured_authors": [{"name": "Jingxuan Bu"}, {"name": "Jiayin Gu"}, {"name": "Runqing Wang"}], "author_count": 3}, {"id": "2609.16980", "category": "hep-th", "title": "Constraints on Kasner Exponents from Holography and Energy Conditions", "abstract": "A central question in bottom-up holography is whether a given bulk effective theory admits a consistent holographic dual. In this work, we explore whether the near-singularity Kasner scaling of planar AdS black hole interiors can serve as a useful diagnostic based on interior-sensitive holographic probes. By examining the metric combinations that control interior-sensitive observables, including Complexity=Volume (CV), the bulk contribution to Complexity=Action (CA), Hartman-Maldacena (HM) entropy, and the thermal $a$-function, we derive algebraic bounds on the Kasner exponents $(p_t,p_s)$ for the relevant semi-classical regimes: finite-radius late-time branches of CV and HM, finite CA complexity, and a finite near-singularity thermal $a$-function. The resulting inequalities delineate the corresponding regions of Kasner space in which the terminal scaling alone is sufficient to realize these behaviors. Furthermore, we demonstrate that classical energy conditions, specifically the null and dominant energy conditions, provide simple sufficient criteria ensuring that the Kasner exponents fall within these holographically allowed regions. These results establish a direct connection between classical bulk energy conditions and the interior geometry selected by holographic probes, and suggest that Kasner scaling can provide a complementary diagnostic in bottom-up holography.", "url": "https://arxiv.org/abs/2609.16980", "type": "理论", "summary": "自下而上全息术的一个核心问题是给定的整体有效理论是否承认一致的全息对偶。在这项工作中，我们探讨了平面 AdS 黑洞内部的近奇点 Kasner 标度是否可以作为基于内部敏感全息探针的有用诊断。通过检查控制内部敏感可观测量的度量组合，包括复杂性=体积（CV）、对复杂性=作用（CA）的大量贡献、Hartman-Maldacena（HM）熵和热$a$函数，我们推导出相关半经典状态的Kasner指数$(p_t,p_s)$上的代数界限：CV和HM的有限半径后期分支、有限CA复杂性和有限的近奇点热 $a$ 函数。由此产生的不等式描绘了卡斯纳空间的相应区域，其中仅终端缩放就足以实现这些行为。此外，我们证明经典能量条件，特别是零能量条件和主导能量条件，提供了简单的充分标准，确保 Kasner 指数落在这些全息允许的区域内。\n\n这些结果在经典体能量条件和全息探针选择的内部几何形状之间建立了直接联系，并表明卡斯纳标度可以在自下而上的全息术中提供补充诊断。", "authors": [{"name": "Zi-Hao Li"}, {"name": "Run-Qiu Yang"}], "featured_authors": [{"name": "Zi-Hao Li"}, {"name": "Run-Qiu Yang"}], "author_count": 2}, {"id": "2609.17086", "category": "hep-th", "title": "Carrollian Conformal Dynamics and Flat-Space Holography", "abstract": "The conformal boundary of asymptotically flat spacetime is null and therefore carries a Carrollian rather than Lorentzian geometry. This changes the relation between symmetry, variational principles and evolution equations in an essential way: unlike a Lorentzian Levi-Civita connection, a torsion-free Carrollian connection compatible with the conformal structure contains genuine independent data. We develop a metric-affine formulation of conformal dynamics that keeps track of these connection degrees of freedom through hypermomenta. Local Carroll boosts, rotations, Weyl transformations and diffeomorphisms then imply a set of covariant evolution equations. We apply this framework to Einstein gravity in four-dimensional asymptotically flat spacetimes. Penrose's conformal compactification identifies null infinity as a conformal Carrollian manifold; the undetermined transverse symmetric part of its compatible connection is the asymptotic Bondi shear. After fixing a Bondi-van der Burg-Metzner-Sachs (BMS) frame and identifying the Carrollian momenta and hypermomenta with the Bondi data, the general Carrollian evolution equations reproduce the standard evolution equations for the mass and angular-momentum aspects. The result provides a boundary-intrinsic derivation of the gravitational evolution equations and a geometric realization of radiative degrees of freedom in flat-space holography. This is a proceedings contribution to the \"Athens Workshop in Theoretical Physics: 10th Anniversary\", held at the National and Kapodistrian University of Athens on December 17-19 2025.", "url": "https://arxiv.org/abs/2609.17086", "type": "理论", "summary": "渐近平坦时空的共形边界为零，因此具有卡罗尔几何而不是洛伦兹几何。这从本质上改变了对称性、变分原理和演化方程之间的关系：与洛伦兹列维-奇维塔连接不同，与共形结构兼容的无扭转卡罗尔连接包含真正的独立数据。我们开发了一种共形动力学的度量仿射公式，通过超动量跟踪这些连接自由度。局部卡罗尔提升、旋转、Weyl 变换和微分同胚意味着一组协变演化方程。我们将这个框架应用于四维渐近平坦时空中的爱因斯坦引力。彭罗斯的共形紧化将零无穷大识别为共形卡罗尔流形；其相容连接的未定横向对称部分是渐近邦迪剪切。\n\n在固定 Bondi-van der Burg-Metzner-Sachs (BMS) 框架并使用 Bondi 数据识别卡罗尔动量和超动量之后，一般卡罗尔演化方程再现了质量和角动量方面的标准演化方程。结果提供了引力演化方程的边界本征推导以及平坦空间全息术中辐射自由度的几何实现。这是对 2025 年 12 月 17 日至 19 日在雅典国立卡波迪斯特里亚大学举行的“雅典理论物理研讨会：十周年”的会议论文集。", "authors": [{"name": "Simon Pekar"}], "featured_authors": [{"name": "Simon Pekar"}], "author_count": 1}, {"id": "2609.17161", "category": "hep-th", "title": "Supersymmetric extension of the Hull--Lambert--Sen chiral boson on the 2-Torus", "abstract": "We present a supersymmetric extension of the Hull-Lambert-Sen chiral boson model. The two-metric formulation developed by Hull provides a powerful and tractable framework for the quantization of chiral bosons, and we demonstrate that it admits a natural supersymmetric generalization. We construct the theory explicitly on the two-torus and analyze its coupling to external sources.", "url": "https://arxiv.org/abs/2609.17161", "type": "理论", "summary": "我们提出了赫尔-兰伯特-森手性玻色子模型的超对称扩展。赫尔开发的二度量公式为手性玻色子的量化提供了一个强大且易于处理的框架，并且我们证明它允许自然的超对称概括。我们在两个环面上明确地构建了该理论，并分析了其与外部源的耦合。", "authors": [{"name": "Amine El Amri"}, {"name": "Pietro Antonio Grassi"}], "featured_authors": [{"name": "Amine El Amri"}, {"name": "Pietro Antonio Grassi"}], "author_count": 2}, {"id": "2609.17182", "category": "hep-th", "title": "Generalized complexity and dynamical response in holographic Vaidya spacetimes", "abstract": "We investigate \"Complexity=Anything\" for smooth Vaidya geometries, using the Weyl squared functional as the most common candidate for our study. Our numerical analysis of candidates in 4- and 5-dimensional Reissner-Nordström (RN) and 5-dimensional Gauss-Bonnet (GB) shows evolution in both $r$ and $v$ (\"doubled complexity\"), unlike static solutions that depend only on $r$. We then study the difference between the complexity of static and dynamical solutions in the asymptotically AdS regime using a Fefferman-Graham expansion. By expanding the bulk metric, extremal embedding, induced metric, normal vector, and extrinsic curvature simultaneously, we show that the first four FG coefficients cancel between the two geometries. In contrast, the first nonvanishing contribution occurs at the fifth coefficient and is controlled by the boundary stress tensor and its derivatives. During the Vaidya quench, the derivative contribution encodes the time-dependent response of the boundary state. In linear response, this response is governed by the retarded stress-tensor correlator and, through generalized Kramers-Kronig relations, can be represented in terms of its spectral density. We thus identify a connection between generalized holographic complexity and the dynamical stress-tensor response, which in the linear-response regime can be represented in terms of the corresponding stress-tensor spectral density.", "url": "https://arxiv.org/abs/2609.17182", "type": "理论", "summary": "我们研究“复杂性=任何东西”以获得平滑的 Vaidya 几何形状，使用 Weyl 平方泛函作为我们研究中最常见的候选者。我们对 4 维和 5 维 Reissner-Nordström (RN) 和 5 维 Gauss-Bonnet (GB) 候选方案的数值分析显示了 $r$ 和 $v$ 的演变（“双倍复杂性”），这与仅依赖于 $r$ 的静态解决方案不同。然后，我们使用 Fefferman-Graham 展开研究渐近 AdS 体系中静态解和动态解的复杂性之间的差异。通过同时扩展体积度量、极值嵌入、诱导度量、法向向量和外在曲率，我们表明前四个 FG 系数在两个几何形状之间相互抵消。相反，第一个非零贡献发生在第五个系数处，并由边界应力张量及其导数控制。在 Vaidya 淬灭期间，导数贡献编码边界态的时间相关响应。在线性响应中，该响应由延迟应力张量相关器控制，并且通过广义的 Kramers-Kronig 关系，可以用其谱密度来表示。\n\n因此，我们确定了广义全息复杂性和动态应力张量响应之间的联系，在线性响应状态下，可以用相应的应力张量谱密度来表示。", "authors": [{"name": "Mojtaba Shahbazi"}, {"name": "Monireh Emami"}], "featured_authors": [{"name": "Mojtaba Shahbazi"}, {"name": "Monireh Emami"}], "author_count": 2}, {"id": "2609.17195", "category": "hep-th", "title": "Cohomological Aspects of Entanglement Entropy: From Information Theory to Noncommutative Geometry", "abstract": "We develop a cohomological framework for entanglement entropy that unifies perspectives from information theory, operator algebras, and noncommutative geometry. Starting from the information-theoretic characterization of entropy as a 1-cocycle, we show how this structure generalizes to the quantum setting through Hochschild and cyclic cohomology. A central result is the embedding of an entanglement complex into the Connes cyclic bicomplex via a conditional expectation, identifying entanglement cohomology as the kernel of the restriction map from a von Neumann algebra to its subalgebra. The Tomita-Takesaki modular theory provides the dynamical structure, with the Connes-Radon-Nikodym cocycle serving as the fundamental object encoding relative entanglement. This framework naturally accommodates Type III von Neumann algebras, where no local density matrix exists, offering a rigorous foundation for entanglement in quantum field theory and holography.", "url": "https://arxiv.org/abs/2609.17195", "type": "理论", "summary": "我们开发了纠缠熵的上同调框架，该框架统一了信息论、算子代数和非交换几何的观点。从熵作为 1-cocycle 的信息论表征开始，我们展示了这种结构如何通过 Hochschild 和循环上同调推广到量子设置。一个核心结果是通过条件期望将纠缠复形嵌入到 Connes 循环双复形中，将纠缠上同调确定为从冯·诺依曼代数到其子代数的限制图的核心。 Tomita-Takesaki 模理论提供了动态结构，Connes-Radon-Nikodym 余循环作为编码相对纠缠的基本对象。该框架自然地适应了 III 型冯诺依曼代数，其中不存在局域密度矩阵，为量子场论和全息术中的纠缠提供了严格的基础。", "authors": [{"name": "Radoslav C. Rashkov"}], "featured_authors": [{"name": "Radoslav C. Rashkov"}], "author_count": 1}, {"id": "2609.17342", "category": "hep-th", "title": "Low-energy brane decoupling in AdS flux vacua", "abstract": "We study the decoupling of branes sourcing AdS flux vacua from the asymptotic bulk using scalar-wave absorption probabilities. In a one-modulus truncation, the result depends only on the dimension of the AdS vacuum and on the asymptotic steepness of the scalar potential. We find that for any steepness and for any dimension greater than two the absorption probability vanishes in the low-energy limit, showing that the branes decouple from the bulk. We illustrate the general analysis in several scale-separated AdS vacua. For DGKT we find $P_{\\rm abs}\\sim\\omega^{27/7}$ and an effective transverse dimension $d_{\\rm eff}=20/7$. Interestingly, the scalar potential along the brane-induced moduli trajectory agrees with that obtained by compactifying a hypothetical $(4+13/7)$-dimensional gravity theory on a $13/7$-dimensional sphere threaded by flux. We also apply the analysis to scale-separated $\\mathrm{AdS}_3$ examples and to the simplest one-modulus KKLT model.", "url": "https://arxiv.org/abs/2609.17342", "type": "理论", "summary": "我们使用标量波吸收概率研究了从渐进体中获取 AdS 通量真空的膜的解耦。在一模截断中，结果仅取决于 AdS 真空的维数和标量势的渐近陡度。我们发现，对于任何陡度和任何大于 2 的维度，吸收概率在低能量极限下消失，表明膜与本体解耦。我们以几个尺度分离的 AdS 真空来说明一般分析。对于 DGKT，我们找到 $P_{\\rm abs}\\sim\\omega^{27/7}$ 和有效横向尺寸 $d_{\\rm eff}=20/7$。有趣的是，沿膜诱导模量轨迹的标量势与通过在由通量穿过的 $13/7$ 维球体上压缩假设的 $(4+13/7)$ 维重力理论而获得的标量势一致。我们还将分析应用于尺度分离的 $\\mathrm{AdS}_3$ 示例和最简单的一模 KKLT 模型。", "authors": [{"name": "Fien Apers"}, {"name": "Noelia Sánchez González"}], "featured_authors": [{"name": "Fien Apers"}, {"name": "Noelia Sánchez González"}], "author_count": 2}, {"id": "2609.17359", "category": "hep-th", "title": "Topological Modular Forms Constrain Threshold States in Extremal $\\mathcal{N}=1$ AdS$_3$ Gravity", "abstract": "We identify a topological constraint on extremal $\\mathcal{N}=1$ AdS$_3$ spectra that is not implied by genus-one modular covariance of the three even spin structure partition functions. Assuming the expected topological modular forms divisibility of the Ramond Witten index, we show that for infinitely many odd $n$ at central charge $c=12n$, an extremal holomorphic $\\mathcal{N}=1$ superconformal field theory requires an odd number of Neveu--Schwarz primaries at the BTZ threshold. Thus the strict ansatz with no threshold primaries is excluded for this infinite family.", "url": "https://arxiv.org/abs/2609.17359", "type": "理论", "summary": "我们确定了极值 $\\mathcal{N}=1$ AdS$_3$ 谱的拓扑约束，该约束不是由三个偶自旋结构配分函数的属一模协方差所暗示的。假设拉蒙德·维滕指数的预期拓扑模形式可除，我们表明，对于中心电荷 $c=12n$ 处的无限多个奇数 $n$，极值全纯 $\\mathcal{N}=1$ 超共形场论需要 BTZ 阈值处的奇数个 Neveu-Schwarz 原色。因此，没有阈值初选的严格 ansatz 被排除在这个无限家族之外。", "authors": [{"name": "Yutaka Yoshida"}], "featured_authors": [{"name": "Yutaka Yoshida"}], "author_count": 1}, {"id": "2609.17426", "category": "hep-th", "title": "Channel-Resolved High-Overtone Quasinormal Modes Decode Kasner Scaling inside Black Holes", "abstract": "The high-overtone quasinormal-mode spectrum encodes the near-singularity Kasner scaling of black-hole interiors. We show that distinct structures in this spectrum independently determine the temporal and spatial Kasner grades, allowing the corresponding metric exponents to be reconstructed without imposing Kasner constraints or invoking holography. We demonstrate this independent reconstruction at the fixed Kasner point of five-dimensional asymptotically flat Schwarzschild and planar Schwarzschild--AdS$_5$, and then extend it to a continuously varying Gibbons--Maeda black-hole family. The reconstructed exponents satisfy the Kasner relation a posteriori, providing a nontrivial geometric consistency check. More generally, the high-overtone spectrum separates into global spectral data and local algebraic corrections whose fractional powers are fixed by the near-singularity Kasner geometry. These fractional corrections therefore provide a direct spectral probe of the local geometry behind the horizon.", "url": "https://arxiv.org/abs/2609.17426", "type": "理论", "summary": "高泛音准正规模谱编码了黑洞内部的近奇点卡斯纳标度。我们表明，该光谱中的不同结构独立地决定了时间和空间的卡斯纳等级，允许在不施加卡斯纳约束或调用全息术的情况下重建相应的度量指数。我们在五维渐近平坦史瓦西和平面史瓦西--AdS$_5$的固定Kasner点证明了这种独立重建，然后将其扩展到连续变化的吉本斯-前田黑洞族。重建的指数满足后验 Kasner 关系，提供了重要的几何一致性检查。更一般地，高泛音谱分为全局谱数据和局部代数校正，其分数功率由近奇异性卡斯纳几何固定。因此，这些分数校正提供了地平线后面局部几何形状的直接光谱探测。", "authors": [{"name": "Zi-Qing Xiao"}, {"name": "Jun Nian"}, {"name": "Li Li"}], "featured_authors": [{"name": "Zi-Qing Xiao"}, {"name": "Jun Nian"}, {"name": "Li Li"}], "author_count": 3}, {"id": "2609.17447", "category": "hep-th", "title": "On the relaxation dynamics of non-equilibrium quantum systems", "abstract": "We investigate the relaxation of an approximately conserved charge in interacting quantum systems close to local equilibrium. To this end, we provide a pedagogical review of Zubarev's non-equilibrium statistical operator approach in the minimal setting of a single non-conserved charge and apply it to the problem at hand. We explicitly highlight the physical assumptions that lead to a local relaxation law: weak charge violation, a separation between the short timescale of microscopic correlations and the much longer timescale of charge relaxation, and the resulting loss of microscopic memory. Under these conditions, the leading relaxation rate is determined by an equilibrium correlation function of the charge-violating operator. We show that the same result follows from a simpler local-equilibrium construction based on the system's evolution over an intermediate timescale, providing a direct alternative for practical calculations and making the common physical ingredients of the two approaches explicit. Beyond the decay law itself, we relate the relaxation rate to the equilibrium diffusion of the same charge. We then allow the charge density to vary in space, which leads to a diffusion-relaxation equation. Finally, we illustrate the formalism through electroweak $\\mathrm{B+L}$ washout and a perturbative scalar model, where agreement with the linearized Boltzmann equation establishes a direct connection between equilibrium-correlator and kinetic descriptions.", "url": "https://arxiv.org/abs/2609.17447", "type": "理论", "summary": "我们研究了接近局部平衡的相互作用量子系统中近似守恒电荷的弛豫。为此，我们对祖巴列夫在单个非守恒电荷的最小设置下的非平衡统计算子方法进行了教学回顾，并将其应用于当前的问题。我们明确强调了导致局部弛豫定律的物理假设：弱电荷违规、微观相关性的短时间尺度和电荷弛豫的较长时间尺度之间的分离，以及由此导致的微观记忆的损失。在这些条件下，领先弛豫率由电荷破坏算子的平衡相关函数确定。我们表明，基于系统在中间时间尺度上的演化的更简单的局域平衡构造可以得出相同的结果，为实际计算提供了直接替代方案，并使两种方法的共同物理成分变得明确。除了衰变定律本身之外，我们还将弛豫率与相同电荷的平衡扩散联系起来。\n\n然后，我们允许电荷密度在空间中变化，从而得出扩散弛豫方程。最后，我们通过电弱$\\mathrm{B+L}$冲洗和微扰标量模型来说明形式主义，其中与线性化玻尔兹曼方程的一致在平衡相关器和动力学描述之间建立了直接联系。", "authors": [{"name": "Matthias Carosi"}, {"name": "Björn Garbrecht"}, {"name": "Silvia Pla"}, {"name": "Nils Wagner"}, {"name": "Edward Wang"}], "featured_authors": [{"name": "Matthias Carosi"}, {"name": "Björn Garbrecht"}, {"name": "Silvia Pla"}, {"name": "Nils Wagner"}, {"name": "Edward Wang"}], "author_count": 5}, {"id": "2609.17528", "category": "hep-th", "title": "Exact Black Branes in General Dimensions in Higher-Curvature Scalar-Tensor Gravity", "abstract": "We obtain two families of neutral planar black branes in a potential-free dilaton-coupled Lovelock--Horndeski theory. Heterotic compactification relates higher-dimensional curvature to scalar dynamics and motivates the interaction structure. At fixed scalar zero mode, the horizon radius and temperature vary while the complete stationary Wald entropy remains constant and positive. The exponential scalar factor at the horizon exactly compensates the area growth, giving this behavior a direct geometric explanation. An exact coefficient analysis determines the two four-dimensional branches and their continuation to every higher dimension through closed coupling relations. The linear family is conformally flat and leaves the AdS scale free at fixed couplings; the fractional family is Weyl curved and fixes that scale. The common kinetic relation also excludes their realization through a real one-scalar flat-torus reduction of a metric--dilaton parent.", "url": "https://arxiv.org/abs/2609.17528", "type": "理论", "summary": "我们在无势膨胀耦合 Lovelock-Horndeski 理论中获得了两个中性平面黑膜族。异质紧化将高维曲率与标量动力学联系起来并激发相互作用结构。在固定标量零模式下，视界半径和温度发生变化，而完全平稳的 Wald 熵保持恒定且为正值。地平线上的指数标量因子精确地补偿了面积增长，为这种行为提供了直接的几何解释。精确的系数分析确定两个四维分支及其通过闭合耦合关系向每个更高维度的延续。线性族是共形平坦的，并且在固定耦合处使 AdS 无垢；分数族是 Weyl 曲线并固定了该比例。共同的动力学关系还排除了它们通过度量膨胀父体的真实单标量平圆环简化来实现。", "authors": [{"name": "Tianhao Wu"}], "featured_authors": [{"name": "Tianhao Wu"}], "author_count": 1}, {"id": "2609.16043", "category": "math-ph", "title": "Gauged AKSZ sigma models", "abstract": "We propose a new class of sigma models that extend AKSZ sigma models, which we refer to as gauged AKSZ sigma models. These models are constructed using QP-manifolds. The compatibility between the AKSZ structure and gauging is characterized by geometric conditions on the target graded manifold. As an example, we explicitly analyze the gauging of higher Courant sigma models in higher dimensions. When fluxes and boundaries are introduced into gauged higher Courant sigma models, generalizations of momentum maps and Hamiltonian $G$-spaces arise as consistency conditions for the models.", "url": "https://arxiv.org/abs/2609.16043", "type": "理论", "summary": "我们提出了一类新的 sigma 模型，它扩展了 AKSZ sigma 模型，我们将其称为测量 AKSZ sigma 模型。这些模型是使用 QP 流形构建的。 AKSZ 结构和测量之间的兼容性通过目标分级流形上的几何条件来表征。作为一个例子，我们明确分析了更高维度的更高 Courant sigma 模型的测量。当通量和边界被引入计量更高的库朗西格玛模型时，动量图和哈密顿 $G$ 空间的推广就会作为模型的一致性条件出现。", "authors": [{"name": "Noriaki Ikeda"}], "featured_authors": [{"name": "Noriaki Ikeda"}], "author_count": 1}, {"id": "2609.16949", "category": "math-ph", "title": "Reflectionless edge states in Dirac models of topological insulators", "abstract": "We study an effective model of topological insulators joined along a bent interface. The Hamiltonian is a Dirac operator $\\mathcal{D} = D_1\\sigma_1 + D_2\\sigma_2 + \\kappa(x) \\sigma_3$ on $L^2(\\mathbb{R}^2,\\mathbb{C}^2)$, where $\\kappa(x)$ represents a domain wall with a corner: while initially straight, it undergoes a bend when passing from one side of $\\mathbb{R}^2$ to the other. For most energies in a spectral window centered at $0$, we construct a reflectionless edge state of $\\mathcal{D}$: a distorted plane wave with transmission coefficient of modulus $1$. This implies that $\\mathcal{D}$ admits modes confined near $\\kappa^{-1}(\\{0\\})$, that travel through the bend with no loss neither to the bulk nor to reflection. Our result explains experimental observations from the physics literature, as well as our own numerical simulations.", "url": "https://arxiv.org/abs/2609.16949", "type": "理论", "summary": "我们研究了沿弯曲界面连接的拓扑绝缘体的有效模型。哈密顿量是 $L^2(\\mathbb{R}^2,\\mathbb{C}^2)$ 上的狄拉克算子 $\\mathcal{D} = D_1\\sigma_1 + D_2\\sigma_2 + \\kappa(x) \\sigma_3$，其中 $\\kappa(x)$ 表示有角的畴壁：虽然最初是直的，但当从$\\mathbb{R}^2$ 到另一个。对于以 $0$ 为中心的光谱窗口中的大多数能量，我们构造 $\\mathcal{D}$ 的无反射边缘状态：传输系数为 $1$ 的扭曲平面波。这意味着 $\\mathcal{D}$ 允许限制在 $\\kappa^{-1}(\\{0\\})$ 附近的模式，这些模式穿过弯曲时既不会损失体积，也不会损失反射。我们的结果解释了物理文献中的实验观察结果以及我们自己的数值模拟。", "authors": [{"name": "Alexis Drouot"}], "featured_authors": [{"name": "Alexis Drouot"}], "author_count": 1}, {"id": "2609.16969", "category": "math-ph", "title": "Operator-theoretic and analytic properties of a driven single-mode Kerr cavity in Bargmann space", "abstract": "We study the stationary spectrum of a coherently driven single-mode Kerr cavity in Bargmann--Fock space. For positive Kerr coupling the Hamiltonian is self-adjoint, bounded below, and has compact resolvent. For nonzero drive, a minimal-solution continued fraction yields an exact scalar spectral condition, with all eigenvalues simple. A Liouville transformation identifies the eigenvalue equation with a degenerate double-confluent Heun problem and classifies its singularities. An Olver-type Volterra construction gives normalized sectorial solutions at infinity with explicit error bounds. In the strong-drive regime, the leading turning-point energy coefficient is proved, whereas the next coefficient remains conditional on a stated global-connection conjecture; independent Bogoliubov and complex-WKB calculations provide consistency checks. A formal weak-drive expansion is verified from the Bargmann recurrence, and its upper-edge tridiagonal series is summed in closed form. Exploratory WKB iteration portraits are included only as visual aids and do not establish the conjectural global connection.", "url": "https://arxiv.org/abs/2609.16969", "type": "理论", "summary": "我们研究了巴格曼-福克空间中相干驱动的单模克尔腔的稳态谱。对于正克尔耦合，哈密顿量是自伴的，有界于下，并且具有紧解。对于非零驱动，最小解连分数产生精确的标量谱条件，并且所有特征值都是简单的。刘维尔变换将特征值方程与退化双汇合 Heun 问题识别并对其奇点进行分类。 Olver 型 Volterra 结构给出了具有明确误差界限的无穷远归一化扇形解。在强驱动机制中，领先的转折点能量系数被证明，而下一个系数仍然以规定的全局连接猜想为条件；独立的 Bogoliubov 和复杂的 WKB 计算提供一致性检查。从巴格曼递推验证了形式的弱驱动展开式，并以闭式求和其上缘三对角级数。探索性 WKB 迭代肖像仅作为视觉辅助工具包含在内，并不建立推测的全局联系。", "authors": [{"name": "Maciej Janowicz"}], "featured_authors": [{"name": "Maciej Janowicz"}], "author_count": 1}, {"id": "2609.17441", "category": "math-ph", "title": "Diassociative conformal algebras and their deformation cohomology", "abstract": "In this paper, we introduce diassociative conformal algebras that unify both associative conformal algebras and diassociative algebras. We show that the category of diassociative conformal algebras is equivalent to the category of equivalence classes of formal distribution diassociative algebras. By employing its Maurer-Cartan characterization, we then define the cohomology of a diassociative conformal algebra and show that it carries a Gerstenhaber algebra structure. Our cohomology can be used to study deformations and extensions of the structure. Finally, we define averaging operators on associative conformal algebras and find their close relations with diassociative conformal algebras.", "url": "https://arxiv.org/abs/2609.17441", "type": "理论", "summary": "在本文中，我们介绍了结合共形代数和结合代数的结合共形代数。我们证明解关联共形代数的范畴等价于形式分布解关联代数的等价类范畴。然后，通过利用其 Maurer-Cartan 表征，我们定义了非关联共形代数的上同调，并表明它具有 Gerstenhaber 代数结构。我们的上同调可用于研究结构的变形和延伸。最后，我们定义了关联共形代数的平均算子，并发现了它们与非关联共形代数的密切关系。", "authors": [{"name": "Anupam Sahoo"}, {"name": "Apurba Das"}], "featured_authors": [{"name": "Anupam Sahoo"}, {"name": "Apurba Das"}], "author_count": 2}, {"id": "2609.17518", "category": "math-ph", "title": "Higher abelian gauge theory in BV formalism", "abstract": "A BV structure is constructed on the space of zero modes of a quadratic elliptic higher abelian gauge theory. The associated BV integral is shown to be independent of the choice of zero-mode Lagrangian under mild hypotheses. The construction yields explicit zero-mode partition functions for several $p$-form abelian gauge theories.", "url": "https://arxiv.org/abs/2609.17518", "type": "理论", "summary": "BV 结构构建在二次椭圆高阿贝尔规范理论的零模空间上。在温和的假设下，相关的 BV 积分与零模式拉格朗日的选择无关。该构造为几个 $p$ 形式的阿贝尔规范理论产生显式的零模式配分函数。", "authors": [{"name": "Shuhan Jiang"}], "featured_authors": [{"name": "Shuhan Jiang"}], "author_count": 1}, {"id": "2609.16108", "category": "quant-ph", "title": "Large-scale quantum simulations of dissipative spin-1/2 Heisenberg chains", "abstract": "A quantum many-body system coupled to an environment relaxes to a nonequilibrium steady state that can sustain order with no equilibrium counterpart. Computing such steady states is harder than closed-system dynamics as the density matrix problem squares the Hilbert-space dimension, and no free energy selects the steady state. The dissipative spin-1/2 Heisenberg chain is a benchmark example for nonequilibrium steady state physics; various methods have each calculated its phase diagram but do not agree, and a controlled determination at large system size has remained out of reach. Here we simulate the Lindblad dynamics of chains of up to 50 sites on the superconducting processor ibm_kingston -- 100 simultaneously active qubits at up to 1700 entangling-gate depths -- realizing the dissipation via Stinespring dilation. The system's dissipative evolution is a self-correcting mechanism that effectively erases errors, so hardware noise enters only as a weak competing dissipator. We measure static structure factors and resolve ferromagnetic, antiferromagnetic, spin-density-wave, and paramagnetic steady states, mapping the phase diagram with 117 quantum hardware data points across the $J_x$--$J_y$ plane. We uncover a rich non-equilibrium phase diagram of ordered phases with only remnants of the mean-field order, and where sharp transitions give way to the crossovers expected in one dimension. We also find the existence of an incipient (Trotter-induced) spin density wave phase, highlighting the potential of controlled Trotterization as a tool to engineer various magnetic phases in dissipative spin systems. Our quantum simulations largely settle the lingering uncertainty regarding the correct phase diagram of this benchmark system. Moreover, they show that quantum computers are now a feasible tool for addressing scientific questions involving dissipative quantum systems.", "url": "https://arxiv.org/abs/2609.16108", "type": "数值", "summary": "与环境耦合的量子多体系统松弛到非平衡稳态，可以在没有平衡对应物的情况下维持秩序。计算这种稳态比封闭系统动力学更难，因为密度矩阵问题与希尔伯特空间维数成平方，并且没有自由能选择稳态。耗散自旋 1/2 海森堡链是非平衡稳态物理学的基准示例；各种方法都计算了其相图，但不一致，并且在大系统尺寸下的受控测定仍然遥不可及。在这里，我们模拟超导处理器 ibm_kingston 上多达 50 个位点的链的 Lindblad 动力学——100 个同时活跃的量子位，深度多达 1700 个纠缠门——通过 Stinespring 膨胀实现耗散。系统的耗散演化是一种自我纠正机制，可以有效地消除错误，因此硬件噪声仅作为弱竞争耗散器进入。\n\n我们测量静态结构因子并解析铁磁、反铁磁、自旋密度波和顺磁稳态，在 $J_x$-$J_y$ 平面上绘制具有 117 个量子硬件数据点的相图。我们发现了丰富的有序相非平衡相图，仅具有平均场顺序的残余，并且其中急剧转变让位于一维中预期的交叉。我们还发现了早期（Trotter 诱导的）自旋密度波相位的存在，突出了受控 Trotterization 作为在耗散自旋系统中设计各种磁相位的工具的潜力。我们的量子模拟很大程度上解决了有关该基准系统正确相图的挥之不去的不确定性。此外，他们表明量子计算机现在是解决涉及耗散量子系统的科学问题的可行工具。", "authors": [{"name": "João C. Getelina"}, {"name": "Andrew Cox"}, {"name": "Muhammad Asaduzzaman"}, {"name": "Omar Alsheikh"}, {"name": "Ryan S. Bennink"}, {"name": "James K. Freericks"}, {"name": "Alexander F. Kemper"}], "featured_authors": [{"name": "João C. Getelina"}, {"name": "Andrew Cox"}, {"name": "Muhammad Asaduzzaman"}, {"name": "Ryan S. Bennink"}, {"name": "James K. Freericks"}, {"name": "Alexander F. Kemper"}], "author_count": 7}, {"id": "2609.16125", "category": "quant-ph", "title": "Hyperbolic color codes with constant rate and polynomial distance", "abstract": "Recent advances in quantum hardware relax the strict geometric-locality constraints traditionally imposed on quantum error-correcting codes, motivating interest in high-rate quantum low-density parity-check (qLDPC) codes. At the same time, color codes provide a particularly rich setting for fault-tolerant quantum computation, underlying protocols such as single-shot error correction and self-correcting quantum computation. Hyperbolic color codes provide a class of high-rate qLDPC codes that also retain the structural features of color codes relevant to fault-tolerant quantum computation. However, previous constructions of hyperbolic color codes have achieved at most logarithmic code distance. In this work, we construct hyperbolic color codes with both constant rate and polynomial distance by building on arithmetic hyperbolic manifolds that support polynomial-distance hyperbolic toric codes. Our construction applies in arbitrary dimension \\(D\\geq 4\\). In even dimensions, the resulting type-\\(D/2\\) color codes have constant encoding rate and polynomial distance, while in other cases the number of logical qubits and the code distance both exhibit polynomial scaling. We further derive explicit exponents for polynomial lower bounds as functions of the dimension and code type. These results establish a family of hyperbolic color codes simultaneously achieving constant rate and polynomial distance and providing a testbed to explore fault-tolerant quantum computation protocols that combine high-rate quantum codes with the structural advantages of color codes.", "url": "https://arxiv.org/abs/2609.16125", "type": "理论", "summary": "量子硬件的最新进展放松了传统上对量子纠错码施加的严格几何局部性约束，激发了人们对高速量子低密度奇偶校验（qLDPC）码的兴趣。同时，颜色代码为容错量子计算、单次纠错和自校正量子计算等底层协议提供了特别丰富的设置。双曲颜色代码提供了一类高速 qLDPC 代码，它还保留了与容错量子计算相关的颜色代码的结构特征。然而，以前的双曲颜色代码构造最多实现了对数代码距离。在这项工作中，我们通过建立支持多项式距离双曲环面代码的算术双曲流形来构造具有恒定速率和多项式距离的双曲颜色代码。我们的构造适用于任意维度 \\(D\\geq 4\\)。在偶数维度中，生成的类型\\(D/2\\)颜色代码具有恒定的编码率和多项式距离，而在其他情况下，逻辑量子位的数量和代码距离都表现出多项式缩放。\n\n我们进一步导出多项式下界的显式指数作为维数和代码类型的函数。这些结果建立了一系列双曲颜色代码，同时实现恒定速率和多项式距离，并为探索将高速量子代码与颜色代码的结构优势相结合的容错量子计算协议提供了一个测试平台。", "authors": [{"name": "Shun Hasegawa"}, {"name": "Hayata Yamasaki"}], "featured_authors": [{"name": "Shun Hasegawa"}, {"name": "Hayata Yamasaki"}], "author_count": 2}, {"id": "2609.16133", "category": "quant-ph", "title": "Pulse-Level Compilation of Measurement-Free Recovery in Transmon Circuits", "abstract": "Quantum error correction commonly relies on syndrome measurement, decoding, and conditional feedback. We numerically show that the conditional spectrum of an interacting transmon circuit can compile a local recovery rule into a fixed open-loop control cycle. In a four-bit repetition-code ring, the resulting input-independent control slows the decay of logical coherence under Pauli-\\(X\\) noise and stabilizes logical-one population under data relaxation relative to uncorrected references. Its local, bounded-degree architecture provides a hardware-native framework for extending compiled recovery control to larger quantum networks.", "url": "https://arxiv.org/abs/2609.16133", "type": "实验", "summary": "量子纠错通常依赖于校正子测量、解码和条件反馈。我们以数值方式表明，交互传输电路的条件谱可以将局部恢复规则编译为固定的开环控制周期。在四位重复码环中，所产生的与输入无关的控制减缓了泡利\\(X\\)噪声下逻辑一致性的衰减，并稳定了相对于未校正参考的数据松弛下的逻辑一总体。其局部有界度架构提供了一个硬件本机框架，用于将编译的恢复控制扩展到更大的量子网络。", "authors": [{"name": "Yi-Han Yu"}, {"name": "Kai Xu"}, {"name": "Heng Fan"}], "featured_authors": [{"name": "Yi-Han Yu"}, {"name": "Kai Xu"}, {"name": "Heng Fan"}], "author_count": 3}, {"id": "2609.16140", "category": "quant-ph", "title": "Designs without disorder: unitary $k$-designs from a single-site bulk defect", "abstract": "We show that an $O(1)$ local defect is sufficient to generate approximate unitary $k$-designs from an otherwise integrable quantum many-body system. Using a two-Pauli-kick (2PK) protocol with temporal sampling, we demonstrate this mechanism in a fixed-magnetization sector of deterministic XXZ spin chains with a single integrability-breaking bulk defect. We derive an analytical selection rule for the Pauli kicks and show that symmetry-preserving strings with a specific domain-wall count, fixed by the couplings, govern design formation. An exhaustive search over all admissible Pauli strings identifies a broad family of kicks that produce designs in the chaotic regime, whereas no such kicks exist in the integrable limit, including for boundary defects. We further show that the design-forming mechanism remains effective for weak bulk defects as the system size increases.", "url": "https://arxiv.org/abs/2609.16140", "type": "理论", "summary": "我们证明，$O(1)$ 局部缺陷足以从其他可积量子多体系统生成近似单一的 $k$ 设计。使用带有时间采样的双保利踢 (2PK) 协议，我们在具有单个破坏可积分性的体缺陷的确定性 XXZ 自旋链的固定磁化区域中演示了这种机制。我们推导了泡利踢的分析选择规则，并表明具有特定域壁计数（由耦合固定）的对称性保持弦控制着设计形成。对所有可接受的泡利弦进行详尽的搜索，确定了在混沌状态下产生设计的广泛的冲击家族，而在可积极限中不存在这样的冲击，包括边界缺陷。我们进一步表明，随着系统尺寸的增加，设计形成机制对于弱体缺陷仍然有效。", "authors": [{"name": "Samudra Sur"}, {"name": "Pratik Nandy"}], "featured_authors": [{"name": "Samudra Sur"}, {"name": "Pratik Nandy"}], "author_count": 2}, {"id": "2609.16142", "category": "quant-ph", "title": "Investigating Interacting Fermionic Models with Locality-Preserving Qubit Encodings", "abstract": "We investigate the utilit
