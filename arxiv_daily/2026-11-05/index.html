  <style>
    :root {

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }

  <script>
    const papers = [{"id": "2611.05477", "category": "cond-mat", "title": "Shapiro spikes in driven quantum fluids", "abstract": "Periodic driving of a Josephson junction produces resonant transport signatures known as Shapiro spikes, conventionally described by effective circuit models. Here, we demonstrate Shapiro spikes in a neutral quantum fluid using simulations of a potential-biased atomic Josephson junction. The dc-current resonances follow the expected Bessel-function scaling, including the suppression and revival of individual resonances with increasing modulation strength. We uncover their microscopic mechanism by showing that the phase-winding frequency develops finite plateaus at integer multiples of the drive frequency. These phase-locked states are sustained by quantized-vortex nucleation and the associated $2\\pi$ phase slips. Remarkably, within a locking plateau, the dc current and density transfer can reverse direction while the phase-winding frequency remains locked to the drive, giving rise to negative-mobility transport. Our results establish a microscopic link between vortex-mediated phase slips, Shapiro resonances, and anomalous transport in a neutral quantum fluid, revealing how quantized vortices convert resonant transport into phase-locked dynamics with negative mobility.", "url": "https://arxiv.org/abs/2611.05477", "type": "理论+数值", "summary": "约瑟夫森结的周期性驱动会产生称为夏皮罗尖峰的共振传输特征，通常由有效电路模型来描述。在这里，我们通过模拟电位偏置原子约瑟夫森结来演示中性量子流体中的夏皮罗尖峰。直流电流谐振遵循预期的贝塞尔函数缩放，包括随着调制强度的增加而抑制和恢复各个谐振。我们通过证明相绕组频率在驱动频率的整数倍处形成有限平台来揭示其微观机制。这些锁相状态由量子化涡旋成核和相关的 $2\\pi$ 相滑维持。值得注意的是，在锁定平台内，直流电流和密度传输可以反转方向，而相绕组频率保持锁定到驱动器，从而引起负迁移率传输。我们的结果建立了涡旋介导的相滑、夏皮罗共振和中性量子流体中的反常输运之间的微观联系，揭示了量子化涡旋如何将共振输运转化为具有负迁移率的锁相动力学。", "authors": [{"name": "Vijay Pal Singh"}, {"name": "Ludwig Mathey"}, {"name": "Luigi Amico"}], "featured_authors": [{"name": "Vijay Pal Singh"}, {"name": "Ludwig Mathey"}, {"name": "Luigi Amico"}], "author_count": 3}, {"id": "2611.05529", "category": "cond-mat", "title": "Resonantly interacting $2e/3$ anyons: a controlled microscopic theory of anyon superconductivity", "abstract": "We develop a microscopic theory of anyon superconductivity that connects electronic interactions in a lightly doped Laughlin state to the universal physics of a resonantly interacting anyon gas. Using geometric quantization of Laughlin quasiholes, we derive the effective many-body Hamiltonian of dilute charge-$2e/3$ anyons, including their valley structure, dispersion, and statistical and short-range interactions, together with an explicit map between anyon and electron observables. This reduces the dilute many-body problem to a few parameters fixed by data computable from few anyon numerics. In analogy with resonant Fermi and Bose gases, we organize the dilute anyon problem around a two-body binding resonance and its relevant and marginal perturbations. For a three-valley gas of charge-$2e/3$ anyons, we identify a resonance whose long-distance theory is governed by an Aharonov-Casher anyon Hamiltonian whose magnetic field is the statistical Chern-Simons field and whose ground state is exactly solvable. Using the ground state wavefunction, we demonstrate Cooper-pair off-diagonal long-range order directly in electron coordinates and determine the pairing symmetry and vortex-lattice structure. The leading perturbations at the fixed point are a relevant pair detuning and a marginal three-body contact in the valley-singlet channel, which determine the compressibility and sound velocity. A repulsive three-body coupling is marginally irrelevant, allowing the fixed point to control a parametrically broad dilute regime near pair resonance, while attractive three-body interactions instead generate charge-$2e$ trimers. More broadly, our results show that binding thresholds between competing anyon composites host universal resonant regimes that are not captured by the lowest-energy anyon species alone, providing a new setting for controlled theories of anyon matter.", "url": "https://arxiv.org/abs/2611.05529", "type": "理论", "summary": "我们开发了一种任意子超导的微观理论，该理论将轻掺杂劳克林态中的电子相互作用与共振相互作用的任意子气体的普遍物理联系起来。利用劳克林准空穴的几何量子化，我们推导出稀电荷-$2e/3$任意子的有效多体哈密顿量，包括它们的谷结构、色散、统计和短程相互作用，以及任意子和电子可观测量之间的显式映射。这将稀释多体问题减少为由可从几个任意数值计算的数据固定的几个参数。与共振费米和玻色气体类似，我们围绕二体结合共振及其相关和边际扰动组织稀释任意子问题。对于电荷为 $2e/3$ 任意子的三谷气体，我们确定了一个共振，其长距离理论由阿哈罗诺夫-卡舍尔任意子哈密顿量控制，其磁场是统计 Chern-Simons 场，其基态是完全可解的。\n\n利用基态波函数，我们直接在电子坐标中证明了库珀对非对角长程有序，并确定了配对对称性和涡晶格结构。固定点处的主要扰动是谷单通道中的相关对失谐和边缘三体接触，它们决定了可压缩性和声速。排斥性三体耦合几乎无关紧要，允许固定点控制对共振附近的参数广泛稀释区域，而有吸引力的三体相互作用则产生电荷 $2e$ 三聚体。更广泛地说，我们的结果表明，竞争性任意子复合材料之间的结合阈值具有普遍的共振机制，而这些共振机制不能被最低能量的任意子物种单独捕获，从而为任意子物质的受控理论提供了新的设置。", "authors": [{"name": "Qingchen Li"}, {"name": "Pavel A. Nosov"}, {"name": "Zhaoyu Han"}, {"name": "Si-Yuan Chen"}, {"name": "Taige Wang"}, {"name": "Eslam Khalaf"}], "featured_authors": [{"name": "Qingchen Li"}, {"name": "Pavel A. Nosov"}, {"name": "Zhaoyu Han"}, {"name": "Si-Yuan Chen"}, {"name": "Taige Wang"}, {"name": "Eslam Khalaf"}], "author_count": 6}, {"id": "2611.05563", "category": "cond-mat", "title": "Bypass Transition via the Non-Hermitian Skin Effect", "abstract": "Non-Hermitian skin lattices can directionally amplify propagating signals. Here we show that this amplification and nonlinear feedback together drive a bypass transition to self-sustained motion, familiar from shear flows. A finite local excitation can trigger sustained periodic or chaotic motion while the resting state remains linearly stable. We develop a return-map theory that predicts the triggering threshold, its scaling with directional gain, and the instability governing near-critical dynamics. The threshold decreases exponentially with chain length. Weak noise triggers sustained motion as well, with a characteristic ignition length that grows logarithmically as noise weakens at fixed observation time. Our work establishes a skin-effect route to bypass transitions, opening a new avenue for predicting and controlling nonlinear wave dynamics.", "url": "https://arxiv.org/abs/2611.05563", "type": "理论", "summary": "非厄米皮肤晶格可以定向放大传播信号。在这里，我们展示了这种放大和非线性反馈共同驱动旁路过渡到自持运动，这与剪切流很相似。有限的局部激励可以触发持续的周期性或混沌运动，而静止状态保持线性稳定。我们开发了一种返回图理论，可以预测触发阈值、其随方向增益的缩放以及控制近临界动力学的不稳定性。阈值随着链长度呈指数下降。弱噪声也会触发持续运动，其特征点火长度随着噪声在固定观察时间减弱而呈对数增长。我们的工作建立了一条绕过转变的集肤效应路径，为预测和控制非线性波动力学开辟了一条新途径。", "authors": [{"name": "Konghao Sun"}, {"name": "Haiping Hu"}], "featured_authors": [{"name": "Konghao Sun"}, {"name": "Haiping Hu"}], "author_count": 2}, {"id": "2611.05688", "category": "cond-mat", "title": "Medial Model of Elastic Curve Contacts, from Clasps to Knits", "abstract": "Materials constructed from interlocking and tangled fibers are challenging to model and understand due in part to the complex interplay between fiber shape and contact mechanics. Much of our intuition about contact mechanics comes from the Hertzian description, which is based on interactions between convex bodies. However, fibers often form clasp shapes, which involve saddle-shaped contact surfaces; the ability for two interacting bodies to conform to each other along a saddle surface confounds many existing mechanical contact models. Following an observation that contact surfaces between fibers tend to look like minimal, constant mean-curvature surfaces, we seek to test this hypothesis and provide a direct link to geometric modeling methods. To do this, we leverage the medial axis transformation, which generalizes the notion of a Voronoi tessellation to generating curves and surfaces. Through computational studies on an orthogonal clasp and a simple knit structure, we find that the medial axis transformation provides a reasonable model for contact surfaces between identical curves. We also show that a generalization of the medial axis transformation based on radical Voronoi tessellations can be used to well-approximate contact surfaces between non-identical curves. We apply this ``radical axis transform'' to curves of different radii and demonstrate a trend for surfaces to adopt finite mean curvature. Our results may point the way towards more sophisticated geometric methods for modeling tangles.", "url": "https://arxiv.org/abs/2611.05688", "type": "理论", "summary": "由互锁和缠结的纤维构成的材料很难建模和理解，部分原因是纤维形状和接触力学之间复杂的相互作用。我们对接触力学的大部分直觉都来自赫兹描述，它基于凸体之间的相互作用。然而，纤维通常形成扣环形状，其中涉及马鞍形接触表面；两个相互作用的物体沿着鞍形表面相互符合的能力混淆了许多现有的机械接触模型。根据观察，纤维之间的接触表面往往看起来像最小的、恒定的平均曲率表面，我们试图检验这一假设并提供与几何建模方法的直接联系。为此，我们利用中轴变换，它将 Voronoi 曲面细分的概念推广到生成曲线和曲面。通过对正交扣环和简单针织结构的计算研究，我们发现中轴变换为相同曲线之间的接触面提供了合理的模型。\n\n我们还表明，基于激进 Voronoi 曲面细分的中轴变换的推广可用于很好地逼近不同曲线之间的接触面。我们将这种“根轴变换”应用于不同半径的曲线，并展示了表面采用有限平均曲率的趋势。我们的结果可能为更复杂的缠结建模几何方法指明道路。", "authors": [{"name": "Kathryn Chain"}, {"name": "Haoye Sun"}, {"name": "Michael S. Dimitriyev"}], "featured_authors": [{"name": "Kathryn Chain"}, {"name": "Haoye Sun"}, {"name": "Michael S. Dimitriyev"}], "author_count": 3}, {"id": "2611.05710", "category": "cond-mat", "title": "Exact Mirror-Parity Selection Rule for Electron-Phonon Coupling in Two-Dimensional Crystals", "abstract": "The electron--phonon (e-ph) interaction underlies conventional superconductivity and plays a central role in transport and other many-body phenomena in solids. Here, we derive a symmetry selection rule for e-ph scattering in two-dimensional crystals possessing a horizontal mirror plane, $\\sigma_h$. For electronic states of mirror parity $s_n(\\mathbf{k})$ and $s_m(\\mathbf{k}+\\mathbf{q})$, and a phonon mode of parity $\\chi_\\nu(\\mathbf{q})$, we show that the e-ph matrix element $g_{mn,\\nu}(\\mathbf{k},\\mathbf{q})$ vanishes identically unless $s_n(\\mathbf{k})\\,\\chi_\\nu(\\mathbf{q})\\, s_m(\\mathbf{k}+\\mathbf{q})=+1$. The rule follows from the covariance of the phonon-induced deformation potential under $\\sigma_h$, constitutes the $C_s$ case of the general group-theoretical selection rule for matrix elements, and partitions the e-ph interaction throughout the Brillouin zone into symmetry-allowed and symmetry-forbidden scattering channels. Consequently, mirror-even phonons couple electronic states of the same mirror parity, either even--even or odd--odd, whereas mirror-odd phonons couple only states of opposite mirror parity, for both intra- and interband processes. We illustrate the selection rule through first-principles calculations for the two-dimensional superconductor $\\mathrm{Sc_2BCH_4}$, where mirror parity is well defined throughout the entire Brillouin zone and symmetry-forbidden matrix elements vanish up to numerical precision. We then extend the analysis to bulk $\\mathrm{MgB_2}$, where the rule applies exactly only on mirror-invariant planes of the three-dimensional Brillouin zone. Moving away from these planes removes the exact mirror constraint and activates scattering channels that are symmetry forbidden when the mirror eigenvalues are well defined. Our results establish horizontal mirror symmetry as an exact and practical filter of e-ph scattering processes.", "url": "https://arxiv.org/abs/2611.05710", "type": "理论+数值", "summary": "电子-声子 (e-ph) 相互作用是传统超导性的基础，在固体输运和其他多体现象中发挥着核心作用。在这里，我们推导了具有水平镜面 $\\sigma_h$ 的二维晶体中 e-ph 散射的对称性选择规则。对于镜像宇称 $s_n(\\mathbf{k})$ 和 $s_m(\\mathbf{k}+\\mathbf{q})$ 的电子态以及宇称 $\\chi_\\nu(\\mathbf{q})$ 的声子模式，我们证明 e-ph 矩阵元素 $g_{mn,\\nu}(\\mathbf{k},\\mathbf{q})$ 消失相同，除非 $s_n(\\mathbf{k})\\,\\chi_\\nu(\\mathbf{q})\\, s_m(\\mathbf{k}+\\mathbf{q})=+1$。该规则遵循 $\\sigma_h$ 下声子引起的变形势的协方差，构成了矩阵元素的一般群论选择规则的 $C_s$ 情况，并将整个布里渊区的 e-ph 相互作用划分为允许对称和禁止对称的散射通道。因此，对于带内和带间过程，镜像偶声子耦合相同镜像奇偶校验的电子态，偶-偶或奇-奇，而镜像奇声子仅耦合相反镜像奇偶校验的状态。\n\n我们通过二维超导体 $\\mathrm{Sc_2BCH_4}$ 的第一原理计算来说明选择规则，其中镜像宇称在整个布里渊区中得到了很好的定义，并且对称禁止矩阵元素在达到数值精度时消失。然后，我们将分析扩展到块体 $\\mathrm{MgB_2}$，其中该规则仅适用于三维布里渊区的镜像不变平面。远离这些平面会消除精确的反射镜约束，并激活当反射镜特征值明确定义时对称性禁止的散射通道。我们的结果将水平镜像对称性确立为 e-ph 散射过程的精确且实用的滤波器。", "authors": [{"name": "Nicolás F. Barrera"}, {"name": "Javiera Cabezas-Escares"}, {"name": "Francisco Munoz"}, {"name": "Carlos Cardenas"}, {"name": "Julia Contreras-García"}], "featured_authors": [{"name": "Nicolás F. Barrera"}, {"name": "Javiera Cabezas-Escares"}, {"name": "Francisco Munoz"}, {"name": "Carlos Cardenas"}, {"name": "Julia Contreras-García"}], "author_count": 5}, {"id": "2611.05721", "category": "cond-mat", "title": "Topological localization in unentangled random braids", "abstract": "In 2015, P. Serna, G. Bunin, and A. Nahum numerically investigated fluctuations in a bunch of unentangled random threads. They showed that fluctuations of an individual thread in a braid are qualitatively different from those of a thread embedded in a medium of fixed parallel lines. In particular, Serna et al. observed a logarithmic increase in the average transverse span, $\\left<|x_N|\\right>$, of a thread with polymer length, $N$. This behavior highlights the collective nature of topological interactions, in which each polymer fluctuates and constrains the motion of the others. Studying this problem both numerically and analytically, we propose the following interpretation: the logarithmic regime is transient, and sufficiently long polymers exhibit topological localization, where $\\left<|x_N|\\right>$ approaches a finite limit at $N\\to\\infty$. Unlike localization induced by quenched external disorder, this phenomenon arises solely from collective topological constraints. We study braids within a locally free approximation and support the localization by analytical investigation of Brownian bridges on the asymptotic Cayley graph of a locally free group. We further conjecture that topologically induced localization emerges as a phase transition: for a small number of threads, $n \\sim 2÷5$, the span, $\\left<|x_N|\\right>$, grows algebraically, with the usual scaling $\\left<|x_N|\\right>\\sim N^{1/4}$ at $N\\gg 1$; by contrast, for sufficiently large $n$, each thread in a long braid ($N\\gg 1$) asymptotically localizes, approaching $\\left<|x_N|\\right>\\sim \\mathrm{const}$.", "url": "https://arxiv.org/abs/2611.05721", "type": "理论+数值", "summary": "2015 年，P. Serna、G. Bunin 和 A. Nahum 对一堆未纠缠的随机线的波动进行了数值研究。他们表明，编织物中单根线的波动与嵌入固定平行线介质中的线的波动有本质上的不同。特别是，塞尔纳等人。观察到聚合物长度 $N$ 的线的平均横向跨度 $\\left<|x_N|\\right>$ 呈对数增加。这种行为凸显了拓扑相互作用的集体性质，其中每种聚合物都会波动并限制其他聚合物的运动。通过数值和分析研究这个问题，我们提出以下解释：对数状态是瞬态的，足够长的聚合物表现出拓扑局域化，其中 $\\left<|x_N|\\right>$ 在 $N\\to\\infty$ 处接近有限极限。与抑制外部无序引起的局域化不同，这种现象完全是由集体拓扑约束引起的。我们在局部自由近似内研究辫子，并通过局部自由群的渐近凯莱图上的布朗桥的分析研究来支持局部化。\n\n我们进一步推测，拓扑诱导的局部化表现为相变：对于少量线程，$n \\sim 2÷5$，跨度$\\left<|x_N|\\right>$以代数方式增长，通常的缩放$\\left<|x_N|\\right>\\sim N^{1/4}$在$N\\gg 1$；相比之下，对于足够大的 $n$，长辫子 ($N\\gg 1$) 中的每个线程渐近定位，接近 $\\left<|x_N|\\right>\\sim \\mathrm{const}$。", "authors": [{"name": "Daniil Fedotov"}, {"name": "Pieter Hendrik Willem Van Der Hoek"}, {"name": "Sergei Nechaev"}], "featured_authors": [{"name": "Daniil Fedotov"}, {"name": "Pieter Hendrik Willem Van Der Hoek"}, {"name": "Sergei Nechaev"}], "author_count": 3}, {"id": "2611.05752", "category": "cond-mat", "title": "Shock-driven Jetting at HMX Crystal Surface Asperities", "abstract": "Shock-induced jetting and recompression are plausible mechanisms for hot spot formation in energetic materials, but remain poorly understood. To this end, we apply all-atom nonreactive molecular dynamics (MD) simulations of a shock-loaded sinusoidal surface asperity in the crystalline explosive HMX (octahydro-1,3,5,7-tetranitro-1,3,5,7-tetrazocine) to quantify the roles of shock strength, asperity geometry, system size, and crystallographic orientation in determining the jetting response. Our simulations span a shock pressure interval of $\\approx$4-47 GPa, which captures responses in both detonation initiation and steady-state detonation regimes. We find that shock strength and asperity curvature exert strong influence on jet velocity, temperature, and morphology, while feature size and crystallographic orientation play more modest roles. Jet morphology correlates strongly with the HMX ambient-pressure phase diagram and the narrow temperature range associated with its liquid phase. Coherent jets form when focusing and dissipation are sufficient to drive local temperatures above the melting point, while formation of molecular plumes is seemingly connected to jet temperatures exceeding the liquid-vapor transition temperature. Formation of plumes is unlike the jetting responses seen in metals, which typically exhibit liquid phases that are stable over wider temperature intervals. This work proposes a simple hypothesis for the connection between jet morphology and ambient-pressure phase diagrams that can be readily tested in other explosives and metals. It also provides a foundation for ongoing nonreactive and reactive MD simulations of jet impact and recompression to quantify the role played by jets in forming hot spots in HMX-based explosives.", "url": "https://arxiv.org/abs/2611.05752", "type": "理论+数值", "summary": "冲击引起的喷射和再压缩是含能材料中热点形成的合理机制，但人们仍然知之甚少。为此，我们对结晶炸药 HMX（八氢-1,3,5,7-四硝基-1,3,5,7-四佐辛）中的冲击加载正弦表面粗糙体应用全原子非反应分子动力学 (MD) 模拟，以量化冲击强度、粗糙体几何形状、系统尺寸和晶体取向在确定喷射响应中的作用。我们的模拟跨越了大约 4-47 GPa 的冲击压力区间，它捕获了爆炸引发和稳态爆炸状态下的响应。我们发现冲击强度和粗糙曲率对射流速度、温度和形态产生强烈影响，而特征尺寸和晶体取向则发挥较小的作用。射流形态与 HMX 环境压力相图以及与其液相相关的窄温度范围密切相关。\n\n当聚焦和耗散足以驱动局部温度高于熔点时，相干射流就会形成，而分子羽流的形成似乎与射流温度超过液-汽转变温度有关。羽流的形成与金属中看到的喷射响应不同，金属通常表现出在更宽的温度范围内稳定的液相。这项工作提出了一个关于射流形态和环境压力相图之间联系的简单假设，可以很容易地在其他炸药和金属中进行测试。它还为正在进行的射流冲击和再压缩的非反应性和反应性MD模拟提供了基础，以量化射流在HMX基炸药中形成热点中所起的作用。", "authors": [{"name": "Ethan Holbrook"}, {"name": "Matthew P. Kroonblawd"}, {"name": "H. Keo Springer"}, {"name": "Alejandro Strachan"}], "featured_authors": [{"name": "Ethan Holbrook"}, {"name": "Matthew P. Kroonblawd"}, {"name": "H. Keo Springer"}, {"name": "Alejandro Strachan"}], "author_count": 4}, {"id": "2611.05820", "category": "cond-mat", "title": "Analytic two-body density-matrix spectrum of the Fermionic Tonks-Girardeau gas", "abstract": "The two-body density matrix (TBDM) of a quantum many-body system provides information about particle correlations, e.g., pairing. In this work, we derive the complete spectrum of the TBDM of the fermionic Tonks-Girardeau gas using its exact ground-state wavefunction in second quantization. We obtain analytical expressions for all eigenvalues and eigenvectors for an arbitrary number of particles and identify two different types of eigenstates: collective states, formed by superpositions of paired momentum modes, and single-determinant states. We provide a physical interpretation of this structure, explaining the origin of the different eigenstates and their degeneracies. We further derive an asymptotic expansion for the largest eigenvalue, improving on previous estimates and analytically confirming its linear scaling with the particle number, thereby indicating off-diagonal long-range order. For the high-index collective states, we obtain simpler expressions for the eigenvalues and eigenvectors, showing that the eigenvalues decay as $n^{-4}$ and that the eigenvectors become independent of the number of particles. Finally, we discuss the connection between the collective states and an effective description in terms of composite bosons, whose spectral properties suggest a behavior consistent with Tan's contact for interacting bosonic systems.", "url": "https://arxiv.org/abs/2611.05820", "type": "理论", "summary": "量子多体系统的二体密度矩阵（TBDM）提供有关粒子相关性的信息，例如配对。在这项工作中，我们在第二次量子化中使用其精确的基态波函数推导了费米子 Tonks-Girardeau 气体的 TBDM 的完整谱。我们获得了任意数量粒子的所有特征值和特征向量的解析表达式，并识别了两种不同类型的特征态：由成对动量模式叠加形成的集体态和单行列式态。我们提供了这种结构的物理解释，解释了不同本征态的起源及其简并性。我们进一步推导了最大特征值的渐近展开，改进了之前的估计，并分析确认了其与粒子数的线性缩放，从而表明了非对角长程顺序。对于高指数集体状态，我们获得了特征值和特征向量的更简单的表达式，表明特征值衰减为 $n^{-4}$ 并且特征向量变得独立于粒子数量。\n\n最后，我们讨论了集体态与复合玻色子的有效描述之间的联系，复合玻色子的光谱特性表明与相互作用玻色子系统的 Tan 接触一致的行为。", "authors": [{"name": "Abel Rojo-Francàs"}, {"name": "Joan Martorell"}, {"name": "Francesc Sabater"}, {"name": "Bruno Juliá-Díaz"}], "featured_authors": [{"name": "Abel Rojo-Francàs"}, {"name": "Joan Martorell"}, {"name": "Francesc Sabater"}, {"name": "Bruno Juliá-Díaz"}], "author_count": 4}, {"id": "2611.05836", "category": "cond-mat", "title": "Ferroelectricity and Peierls transition in MOI$_2$ (M=Ta, Nb): a first-principle analysis", "abstract": "The van der Waals ferroelectric NbOI$_2$ hosts a polar distortion that is commonly attributed to the Peierls dimerization of its Nb chains. Here we show, using first-principles calculations and a Landau-type energy, that the polar instability is in fact a distinct order parameter that does not stem from the Peierls mode condensation and that three main distinct modes are important in the whole MOI$_2$ family. They are a polar mode $P$, an antipolar mode $\\eta$, and a Peierls mode $\\delta$, whose stabilities and couplings strongly depend on the nature of the $M$ metal element, as evidenced by the fact that the isostructural, TaOI$_2$ system is not polar while possessing Peirls distortions.", "url": "https://arxiv.org/abs/2611.05836", "type": "数值", "summary": "范德华铁电 NbOI$_2$ 具有极性畸变，这通常归因于其 Nb 链的 Peierls 二聚化。在这里，我们使用第一原理计算和朗道型能量表明，极性不稳定性实际上是一个独特的有序参数，它并非源于 Peierls 模式凝聚，并且三个主要的不同模式在整个 MOI$_2$ 系列中很重要。它们是极性模式 $P$、反极性模式 $\\eta$ 和 Peierls 模式 $\\delta$，其稳定性和耦合很大程度上取决于 $M$ 金属元素的性质，同构 TaOI$_2$ 系统在具有 Peirls 畸变的同时不是极性的，这一事实证明了这一点。", "authors": [{"name": "Carmel Dansou"}, {"name": "Charles Paillard"}, {"name": "Laurent Bellaiche"}], "featured_authors": [{"name": "Carmel Dansou"}, {"name": "Charles Paillard"}, {"name": "Laurent Bellaiche"}], "author_count": 3}, {"id": "2611.05840", "category": "cond-mat", "title": "Interplay between Spin Stripes and Pairing Crossover in the Bilayer Hubbard Model", "abstract": "Whether $d$-wave or $s_\\pm$-wave pairing prevails in the bilayer nickelate \\ce{La3Ni2O7} remains unresolved, and how its observed spin order and magnetic excitations relate to the pairing mechanism is unclear. Here, we use finite-temperature determinant quantum Monte Carlo simulations of a minimal bilayer Hubbard model to investigate pairing competition at strong interlayer coupling, where intralayer and interlayer antiferromagnetic correlations have comparable strengths. We find that spin stripes develop spontaneously with increasing hole doping, accompanied by a crossover of the dominant pairing symmetry from $d$-wave to $s_\\pm$-wave. The crossover tracks the changing relative strengths of the spin correlations, with the interlayer correlations overtaking their intralayer counterparts in magnitude. Concomitantly, the dynamical spin structure factor exhibits a momentum-dependent reorganization of the magnetic excitations, consistent with fluctuating spin stripes. Our results identify the structure of spin fluctuations as a key link between spin stripes and pairing competition, offering a minimal-model perspective for understanding \\ce{La3Ni2O7}.", "url": "https://arxiv.org/abs/2611.05840", "type": "理论+数值", "summary": "双层镍酸盐 \\ce{La3Ni2O7} 中是否存在 $d$ 波或 $s_\\pm$ 波配对尚未解决，并且其观察到的自旋顺序和磁激发与配对机制之间的关系尚不清楚。在这里，我们使用最小双层哈伯德模型的有限温度行列式量子蒙特卡罗模拟来研究强层间耦合下的配对竞争，其中层内和层间反铁磁相关性具有相当的强度。我们发现，随着空穴掺杂的增加，自旋条纹会自发形成，并伴随着主要配对对称性从 $d$ 波到 $s_\\pm$ 波的交叉。交叉跟踪自旋相关性相对强度的变化，层间相关性在幅度上超过了层内相关性。与此同时，动态自旋结构因子表现出磁激发的动量依赖性重组，与波动的自旋条纹一致。我们的结果将自旋波动的结构确定为自旋条纹和配对竞争之间的关键联系，为理解 \\ce{La3Ni2O7} 提供了最小模型的视角。", "authors": [{"name": "Zixuan Jia"}, {"name": "Xuelei Sui"}, {"name": "Shijie Hu"}, {"name": "Tianxing Ma"}, {"name": "Haiqing Lin"}, {"name": "Bing Huang"}], "featured_authors": [{"name": "Zixuan Jia"}, {"name": "Xuelei Sui"}, {"name": "Shijie Hu"}, {"name": "Tianxing Ma"}, {"name": "Haiqing Lin"}, {"name": "Bing Huang"}], "author_count": 6}, {"id": "2611.05846", "category": "cond-mat", "title": "Neural Networks with Exciton-Polariton Waveguides", "abstract": "We propose and numerically study a scheme for neural networks using exciton-polariton waveguide meshes. These enable arbitrary programmable interlayer couplings suited to a restricted Boltzmann machine architecture where polariton phases act as stochastic network variables. We show that such a network can be trained using unsupervised Hebbian and anti-Hebbian updates. This allows the implementation of an associative memory, where the network recovers learned patterns from imperfect inputs.", "url": "https://arxiv.org/abs/2611.05846", "type": "数值", "summary": "我们提出并数值研究了一种使用激子极化波导网格的神经网络方案。这些使得任意可编程层间耦合适合于受限玻尔兹曼机器架构，其中极化子相位充当随机网络变量。我们表明，可以使用无监督的赫布和反赫布更新来训练这样的网络。这允许实现联想记忆，网络从不完美的输入中恢复学习的模式。", "authors": [{"name": "Huawen Xu"}, {"name": "Ruiqi Bao"}, {"name": "Lingyu Tian"}, {"name": "Yusong Gan"}, {"name": "Junfeng Gao"}, {"name": "Michal Matuszewski"}, {"name": "Qihua Xiong"}, {"name": "Timothy Liew"}], "featured_authors": [{"name": "Huawen Xu"}, {"name": "Ruiqi Bao"}, {"name": "Lingyu Tian"}, {"name": "Michal Matuszewski"}, {"name": "Qihua Xiong"}, {"name": "Timothy Liew"}], "author_count": 8}, {"id": "2611.05856", "category": "cond-mat", "title": "Floquet-Volkov spin polarization in spin-degenerate Antiferromagnets", "abstract": "Periodic driving enables ultrafast control of electronic structures in solids through the formation of photon-dressed Floquet-Bloch states. However, the measured photoemission spectra are influenced not only by these states but also by their interference with Volkov-dressed outgoing photoelectrons. Here, we demonstrate that Floquet-Volkov interference can generate spin-polarized photoemission in a collinear antiferromagnetic Dirac model without spin-orbit coupling (SOC). An in-plane linearly polarized pump preserves $\\mathcal{PT}$ symmetry, leaving the Floquet quasienergies spin degenerate. Under near-resonant driving, photon-dressed conduction and valence bands hybridize, producing spin-dependent relative phases that are converted into unequal spin-resolved photoemission intensities through interference between pathways reaching the same Volkov-dressed final state. We analytically identify this interference mechanism and verify it using nonequilibrium Green-function calculations under periodic driving and finite pump-probe pulses. We further demonstrate that rotating the probe polarization can suppress or reverse the spin polarization without modifying the Floquet bands. Our findings establish Floquet-Volkov interference as a route to spin-selective photoemission in driven antiferromagnets without Floquet spin splitting or SOC.", "url": "https://arxiv.org/abs/2611.05856", "type": "理论+数值", "summary": "周期性驱动可以通过形成光子修饰的 Floquet-Bloch 态来超快控制固体中的电子结构。然而，测量的光发射光谱不仅受到这些状态的影响，而且还受到它们对沃尔科夫装饰的出射光电子的干扰的影响。在这里，我们证明了 Floquet-Volkov 干涉可以在没有自旋轨道耦合（SOC）的共线反铁磁狄拉克模型中产生自旋偏振光电发射。面内线性极化泵浦保持 $\\mathcal{PT}$ 对称性，使 Floquet 准能自旋简并。在近共振驱动下，光子修饰的导带和价带杂交，产生自旋相关的相对相位，通过达到相同沃尔科夫修饰的最终状态的路径之间的干扰，这些相对相位转换为不相等的自旋分辨光电发射强度。我们分析地识别了这种干扰机制，并在周期性驱动和有限泵浦探测脉冲下使用非平衡格林函数计算来验证它。我们进一步证明，旋转探针偏振可以抑制或逆转自旋偏振，而不改变 Floquet 能带。\n\n我们的研究结果表明，Floquet-Volkov 干涉是在驱动反铁磁体中实现自旋选择性光电发射的一种途径，无需 Floquet 自旋分裂或 SOC。", "authors": [{"name": "Jiyang Fan"}, {"name": "Dinghui Wang"}, {"name": "Tongshuai Zhu"}], "featured_authors": [{"name": "Jiyang Fan"}, {"name": "Dinghui Wang"}, {"name": "Tongshuai Zhu"}], "author_count": 3}, {"id": "2611.05946", "category": "cond-mat", "title": "Temperature-Dependent Ion Dynamics in Argyrodite Superionic Conductor Li$_{6}$PS$_{5}$Cl with Fine-Tuned MACE Foundation Model", "abstract": "The rapid growth of machine-learning interatomic potentials (MLIP), particularly the foundational models for materials chemistry, such as MACE, has significantly strengthened our capabilities in studying the complex dynamics of materials through statistical sampling. Here, by performing molecular dynamics with a fine-tuned MACE model, that are further combined with essential dynamics analysis, a tool that is commonly applied in (bio)molecular simulations, we examine the temperature-dependent ion dynamics in a prototypical inorganic solid superionic conductor, namely argyrodite Li$_{6}$PS$_{5}$Cl. Our analyses show clear localised phonon-like dynamics for Li$^+$ ions below 500 K with trajectories lying in a low-dimensional manifold that is highly nonlinear, which is opposite to the case in the high-temperature ($\\sim$800 K) end. Between 500-700 K, the system exhibit strong competition in the dynamics between the Li$^+$ and framework ions, that are reflected in both the eigenspectrum and the projected low-dimensional embeddings characterising these dynamics not showing a simple monotonic dependency upon rising temperatures, and is further supported by investigations employing Langevin dynamics that systematically examine how damping the framework motions affects the dynamics of the Li$^+$ ions, thanks to the computational efficiency provided by MLIP. This work thus contributes towards the broader theoretical and data-driven framework for studying the lattice dynamics of solids.", "url": "https://arxiv.org/abs/2611.05946", "type": "理论+数值", "summary": "机器学习原子间势（MLIP）的快速发展，特别是材料化学的基础模型（例如 MACE），显着增强了我们通过统计采样研究材料复杂动力学的能力。在这里，通过使用微调的 MACE 模型执行分子动力学，并进一步与基本动力学分析（一种常用于（生物）分子模拟的工具）相结合，我们检查了原型无机固体超离子导体（即银汞矿 Li$_{6}$PS$_{5}$Cl）中的温度依赖性离子动力学。我们的分析显示，500 K 以下的 Li$^+$ 离子具有清晰的局域声子动力学，其轨迹位于高度非线性的低维流形中，这与高温 ($\\sim$800 K) 端的情况相反。\n\n在 500-700 K 之间，该系统在 Li$^+$ 和框架离子之间的动力学方面表现出强烈的竞争，这反映在特征谱和表征这些动力学的投影低维嵌入中，没有表现出对温度升高的简单单调依赖性，并且由于 MLIP 提供的计算效率，采用 Langevin 动力学的研究进一步支持了该研究，系统地检查了框架运动阻尼如何影响 Li$^+$ 离子的动力学。因此，这项工作有助于建立更广泛的理论和数据驱动框架来研究固体晶格动力学。", "authors": [{"name": "Jack Yang"}, {"name": "Lei Ao"}, {"name": "Sean Li"}], "featured_authors": [{"name": "Jack Yang"}, {"name": "Lei Ao"}, {"name": "Sean Li"}], "author_count": 3}, {"id": "2611.05964", "category": "cond-mat", "title": "Variational Monte Carlo Study of Superconductivity in a Correlated System with Broken Inversion Symmetry", "abstract": "Unconventional superconductivity in systems with broken inversion symmetry has attracted considerable interest because antisymmetric spin-orbit coupling (ASOC) can strongly affect the spin structure and stability of superconducting states. In this study, we investigate superconductivity in a correlated system with the symmetry of a honeycomb network using the variational Monte Carlo method. We consider a single-band Hubbard model including an on-site Coulomb interaction $U$ and ASOC with coupling strength $\\lambda$, and compare several pairing states with different pairing symmetries. The trial wave functions are constructed from particle-number- and Gutzwiller-projected BCS states. To examine the energetic stability of each pairing state, we calculate the variational energy as a function of the gap amplitude, while optimizing the variational parameter $\\mu$ and the Gutzwiller parameter $g$ for each gap amplitude. At $U/t = 10$, the $f$-wave state has the lowest variational energy for $\\lambda/t = 0$, whereas the chiral $p$-wave state becomes the most energetically favorable for $\\lambda/t = 0.1$. These results indicate that ASOC strongly affects the competition among superconducting pairing states in the presence of strong electron correlations.", "url": "https://arxiv.org/abs/2611.05964", "type": "理论+数值", "summary": "反演对称性破缺系统中的非常规超导引起了人们极大的兴趣，因为反对称自旋轨道耦合（ASOC）可以强烈影响自旋结构和超导态的稳定性。在本研究中，我们使用变分蒙特卡罗方法研究具有蜂窝网络对称性的相关系统中的超导性。我们考虑单带哈伯德模型，包括现场库仑相互作用 $U$ 和耦合强度 $\\lambda$ 的 ASOC，并比较具有不同配对对称性的几种配对状态。试验波函数是根据粒子数和 Gutzwiller 投影的 BCS 状态构建的。为了检查每个配对状态的能量稳定性，我们计算变分能量作为间隙幅度的函数，同时优化每个间隙幅度的变分参数 $\\mu$ 和 Gutzwiller 参数 $g$。当$U/t = 10$时，$f$波态在$\\lambda/t = 0$时具有最低的变分能量，而手性$p$波态在$\\lambda/t = 0.1$时变得最有利。\n\n这些结果表明，在存在强电子相关性的情况下，ASOC 强烈影响超导配对态之间的竞争。", "authors": [{"name": "Tsuyoshi Imazu"}, {"name": "Katsunori Kubo"}], "featured_authors": [{"name": "Tsuyoshi Imazu"}, {"name": "Katsunori Kubo"}], "author_count": 2}, {"id": "2611.05967", "category": "cond-mat", "title": "Frank Elastic Constants of Associating Rigid-Rodlike Systems", "abstract": "Frank elastic constants of associating rigid rodlike systems are investigated using a mean field theory combined with the Straley elastic free energy formalism. The aggregation equilibrium and orientational ordering are treated self-consistently to analyze the concentration and temperature dependences of the elastic constants. Both a monomer--dimer model and a fully polydisperse rodlike aggregate model are considered. We find that aggregation selectively enhances the bend elastic constant through the long-tail structure of the aggregate-size distribution. As a result, a pronounced elastic anisotropy, $K_{33}\\gg K_{11}>K_{22}$, emerges in the nematic phase. Decreasing temperature or increasing concentration promotes the formation of long rodlike aggregates and induces a rapid increase in the bend elastic constant, while the relation $K_{11}=3K_{22}$ remains unchanged. The exceptionally large bend elastic constants predicted here should be regarded as upper-bound estimates for the rigid-aggregate limit.", "url": "https://arxiv.org/abs/2611.05967", "type": "理论", "summary": "使用平均场理论结合斯特雷弹性自由能形式研究了关联刚性棒状系统的弗兰克弹性常数。聚集平衡和取向排序被自洽地处理，以分析弹性常数的浓度和温度依赖性。单体-二聚体模型和完全多分散的棒状聚集体模型都被考虑。我们发现聚集通过聚集体尺寸分布的长尾结构选择性地增强弯曲弹性常数。因此，向列相中出现明显的弹性各向异性 $K_{33}\\gg K_{11}>K_{22}$。降低温度或增加浓度会促进长棒状聚集体的形成，并导致弯曲弹性常数快速增加，而关系式$K_{11}=3K_{22}$保持不变。这里预测的异常大的弯曲弹性常数应被视为刚性骨料极限的上限估计。", "authors": [{"name": "Akihiko Matsuyama"}], "featured_authors": [{"name": "Akihiko Matsuyama"}], "author_count": 1}, {"id": "2611.05990", "category": "cond-mat", "title": "Symmetry-Selective Shift Current in Polar Multidomain Superlattices", "abstract": "Periodic polar multidomain superlattices can act as symmetry-selective elements for shift-current generation. We demonstrate this using a two-dimensional Su-Schrieffer-Heeger model with prescribed multidomain configurations. The distinct full-supercell symmetries of periodic head-to-head and head-to-tail arrangements impose different constraints on the shift-current tensor and thereby select complementary nonlinear-response channels, as confirmed by numerical calculations. A direct comparison with equal-area averages of the constituent single-domain spectra shows that an independent-domain average does not reproduce the detailed multidomain spectra. A bond-resolved contribution analysis further clarifies the real-space origin of the multidomain response. Widening each domain from one to ten primitive cells leaves the selection rules intact. On the photon-energy grid used here, the allowed head-to-tail response changes sign and grows by about an order of magnitude. These results provide a theoretical framework for the symmetry-based design of anisotropic optical rectification in polar multidomain superlattices.", "url": "https://arxiv.org/abs/2611.05990", "type": "理论+数值", "summary": "周期性极性多畴超晶格可以充当移动电流生成的对称选择元件。我们使用具有指定多域配置的二维 Su-Schrieffer-Heeger 模型来演示这一点。正如数值计算所证实的，周期性头对头和头对尾排列的独特的全超胞对称性对位移电流张量施加了不同的约束，从而选择互补的非线性响应通道。与组成单域光谱的等面积平均值的直接比较表明，独立域平均值不能再现详细的多域光谱。键解析贡献分析进一步阐明了多域响应的真实空间起源。将每个域从 1 个原始细胞扩大到 10 个原始细胞，使选择规则保持不变。在这里使用的光子能量网格上，允许的头尾响应改变符号并增长大约一个数量级。这些结果为极性多域超晶格中基于对称性的各向异性光学整流设计提供了理论框架。", "authors": [{"name": "Tomoaki Kameda"}, {"name": "Kosuke Nagashio"}, {"name": "Katsunori Wakabayashi"}], "featured_authors": [{"name": "Tomoaki Kameda"}, {"name": "Kosuke Nagashio"}, {"name": "Katsunori Wakabayashi"}], "author_count": 3}, {"id": "2611.06037", "category": "cond-mat", "title": "Thermodynamic signatures of the period-doubling route to chemical chaos", "abstract": "Chemical reaction networks can evolve from stable oscillations to chaos through successive period doublings. We investigate general properties of entropy-production fluctuations near the onset of chaos and within the chaotic regime in reversible, well-mixed reaction networks. Near an isolated supercritical period-doubling bifurcation, we find a one-sided divergence of the diffusion constant with exponent one. For chaotic attractors satisfying the stated conditions, the entropy variance per unit volume grows exponentially when the macroscopic limit is taken first. Its exponential growth rate is $2\\lambda_{\\max}$, where $\\lambda_{\\max}$ is the largest Lyapunov exponent, implying a divergent diffusion constant. We also discuss the volume dependence of the fluctuations and the underlying physical mechanisms.", "url": "https://arxiv.org/abs/2611.06037", "type": "理论", "summary": "化学反应网络可以通过连续的倍周期从稳定振荡演变成混沌。我们研究了可逆、混合良好的反应网络中混沌开始时和混沌状态内熵产生波动的一般特性。在孤立的超临界倍周期分岔附近，我们发现扩散常数与指数一的单向发散。对于满足规定条件的混沌吸引子，当首先取宏观极限时，单位体积的熵方差呈指数增长。其指数增长率为$2\\lambda_{\\max}$，其中$\\lambda_{\\max}$是最大的李亚普诺夫指数，意味着发散扩散常数。我们还讨论了波动的体积依赖性和潜在的物理机制。", "authors": [{"name": "Kyota Tamano"}, {"name": "Keiji Saito"}], "featured_authors": [{"name": "Kyota Tamano"}, {"name": "Keiji Saito"}], "author_count": 2}, {"id": "2611.06293", "category": "cond-mat", "title": "A Construction Framework for Three-Dimensional Topological Magnetic Textures", "abstract": "Three-dimensional magnetic systems offer diverse possibilities for constructing complex topological textures from simpler magnetic configurations. Here, we present different routes for constructing complex three-dimensional magnetic textures from simpler parent configurations and discuss their impact on the topology of the resulting structures. We identify four construction principles: (i) adding transverse modulations, (ii) adding structures, (iii) entangling textures (e.g. braiding, or twisting), and (iv) introducing singularities. Using the skyrmion tube as an explicit parent configuration, we show how these principles give rise to several known three-dimensional magnetic textures. We then apply the same principles to predict novel textures derived from a meron tube, which are confirmed by micromagnetic simulations to be metastable in chiral magnets. Our results establish general principles for the systematic construction and discovery of complex three-dimensional magnetic textures.", "url": "https://arxiv.org/abs/2611.06293", "type": "理论+数值", "summary": "三维磁系统为从更简单的磁配置构造复杂的拓扑纹理提供了多种可能性。在这里，我们提出了从更简单的父配置构造复杂的三维磁性纹理的不同路线，并讨论了它们对所得结构的拓扑的影响。我们确定了四个构造原则：（i）添加横向调制，（ii）添加结构，（iii）纠缠纹理（例如编织或扭曲），以及（iv）引入奇点。使用斯格明子管作为明确的父配置，我们展示了这些原理如何产生几种已知的三维磁性纹理。然后，我们应用相同的原理来预测源自梅隆管的新颖纹理，微磁模拟证实这些纹理在手性磁体中是亚稳态的。我们的结果为复杂三维磁性纹理的系统构建和发现建立了一般原则。", "authors": [{"name": "Maria Azhar"}, {"name": "Sandra C. Shaju"}, {"name": "Karin Everschor-Sitte"}], "featured_authors": [{"name": "Maria Azhar"}, {"name": "Sandra C. Shaju"}, {"name": "Karin Everschor-Sitte"}], "author_count": 3}, {"id": "2611.06463", "category": "cond-mat", "title": "Steady states in asymmetric exclusion processes with reactions: Fluctuations and non-mean field behaviour", "abstract": "We study an totally asymmetric simple exclusion process (TASEP) in an open geometry. We couple TASEP with simple reactions in the form of production (birth) and degradation (death) due to over crowding taking place in the bulk. We investigate the steady states, which are generically space-dependent. Phase coexistences are also possible for some choices of the model parameters. We study the system by mean-field theories (MFT) supplemented by extensive Monte-Carlo simulations (MCS). Intriguingly, unlike oridinary TASEP and other related models, configuration-dependent bulk reactions in a TASEP model can make nearest-neighbour correlations quantitatively important even in an open driven system where mean-field theory would ordinarily be expected to provide a useful description. We attribute this to the correlation effects ignored in MFT. We numerically quantify this correlation effect.", "url": "https://arxiv.org/abs/2611.06463", "type": "理论+数值", "summary": "我们研究开放几何中的完全不对称简单排除过程（TASEP）。我们将 TASEP 与由于大量发生的过度拥挤而产生的生产（诞生）和降解（死亡）形式的简单反应结合起来。我们研究通常与空间相关的稳态。对于模型参数的某些选择，相位共存也是可能的。我们通过平均场理论（MFT）并辅以广泛的蒙特卡罗模拟（MCS）来研究该系统。有趣的是，与普通的 TASEP 和其他相关模型不同，即使在通常期望平均场理论提供有用描述的开放驱动系统中，TASEP 模型中依赖于构型的本体反应也可以使最近邻相关性在数量上变得重要。我们将此归因于 MFT 中忽略的相关效应。我们对这种相关效应进行数值量化。", "authors": [{"name": "Rohn Chatterjee"}, {"name": "Atri Goswami"}, {"name": "Sudip Mukherjee"}], "featured_authors": [{"name": "Rohn Chatterjee"}, {"name": "Atri Goswami"}, {"name": "Sudip Mukherjee"}], "author_count": 3}, {"id": "2611.06490", "category": "cond-mat", "title": "Mutual linearity in semi-Markov networks", "abstract": "Despite their microscopic complexity, stochastic networks show a surprising degree of universal, parameter-independent properties. One example is mutual linearity, which has recently been characterized as a generic, pairwise-linear relation between observables of Markov processes under local perturbations, valid for both stationary dynamics and for transient dynamics in Laplace space. Here we show that mutual linearity arises if a certain global affine relation is satisfied. This allows us to demonstrate that mutual linearity also holds for a broad class of local perturbations in semi-Markov networks, which, unlike Markov networks, have memory in terms of the dwell time in the current state. However, exceptions exist, meaning that mutual linearity does not extend to all possible perturbations of semi-Markov networks. Strikingly, this restriction disappears for first-passage times. Thus, semi-Markov networks exhibit a fundamental asymmetry between occupation and first-passage statistics, different from Markov networks. Finally, we show that our results are directly applicable to stochastic resetting in semi-Markov networks, where the Laplace-space relations acquire a physical interpretation in terms of stationary occupations and the probability to reach a target before reset. This provides a natural setting in which the predicted affine relations can be probed.", "url": "https://arxiv.org/abs/2611.06490", "type": "理论", "summary": "尽管随机网络具有微观的复杂性，但它却表现出令人惊讶的普遍性、与参数无关的特性。一个例子是互线性，它最近被描述为局部扰动下马尔可夫过程的可观测量之间的一种通用的成对线性关系，对于拉普拉斯空间中的稳态动力学和瞬态动力学都有效。在这里，我们表明，如果满足某种全局仿射关系，就会出现相互线性。这使我们能够证明，互线性也适用于半马尔可夫网络中的一大类局部扰动，与马尔可夫网络不同，半马尔可夫网络具有当前状态停留时间的记忆。然而，也存在例外，这意味着互线性​​并不能扩展到半马尔可夫网络的所有可能的扰动。引人注目的是，这种限制在首次通过时就消失了。因此，与马尔可夫网络不同，半马尔可夫网络在占据和首次传代统计之间表现出基本的不对称性。\n\n最后，我们表明我们的结果直接适用于半马尔可夫网络中的随机重置，其中拉普拉斯空间关系根据静止占据和重置前达到目标的概率获得物理解释。这提供了一个自然的环境，可以在其中探测预测的仿射关系。", "authors": [{"name": "Julian B. Voits"}, {"name": "Ulrich S. Schwarz"}], "featured_authors": [{"name": "Julian B. Voits"}, {"name": "Ulrich S. Schwarz"}], "author_count": 2}, {"id": "2611.06528", "category": "cond-mat", "title": "Stability of energy gap of macroscopic quantum matter", "abstract": "In quantum many-body physics and quantum field theory, it is often assumed that gapped systems remain gapped under sufficiently weak local perturbations. However, to what extent this assumption holds is elusive, except for some special systems. In this work, we examine the stability of energy gap of macroscopic quantum matter that is only subject to two physically natural conditions, locality and translation invariance. We first show that in any spatial dimension, there are gapped local Hamiltonians with a unique ground state and an unstable gap, i.e., they become gapless under certain arbitrarily weak local perturbation in the thermodynamic limit. We then prove that for both spin and fermionic systems in one dimension, such Hamiltonians with an unstable gap must not only break translation invariance but also be fine-tuned. We further show that in any dimension greater than one, there are fine-tuned local translation invariant Hamiltonians with a unique ground state and an unstable gap. These results greatly sharpen our understanding of the fundamental problem of the stability of quantum phases of matter. We also discuss implications of our results on, for example, anyon superconductivity and higher-form symmetries.", "url": "https://arxiv.org/abs/2611.06528", "type": "理论", "summary": "在量子多体物理和量子场论中，通常假设有隙系统在足够弱的局部扰动下仍然保持有隙。然而，除了一些特殊的系统外，这个假设在多大程度上成立是难以捉摸的。在这项工作中，我们研究了宏观量子物质能隙的稳定性，该稳定性仅受两个物理自然条件的影响：局域性和平移不变性。我们首先证明，在任何空间维度上，都存在具有独特基态和不稳定能隙的带隙局部哈密顿量，即，它们在热力学极限内的某些任意弱局部扰动下变得无带隙。然后我们证明，对于一维的自旋和费米子系统，这种具有不稳定间隙的哈密顿量不仅必须打破平移不变性，而且还必须进行微调。我们进一步证明，在任何大于一的维度上，都存在具有独特基态和不稳定能隙的微调局部平移不变哈密顿量。这些结果极大地加深了我们对物质量子相稳定性这一基本问题的理解。\n\n我们还讨论了我们的结果对任意子超导性和更高形式对称性等的影响。", "authors": [{"name": "Kangle Li"}, {"name": "Liujun Zou"}], "featured_authors": [{"name": "Kangle Li"}, {"name": "Liujun Zou"}], "author_count": 2}, {"id": "2611.06541", "category": "cond-mat", "title": "Dynamically Reentrant Skyrmion Phase in Oscillating Magnetic Fields", "abstract": "We address a central open question in driven topological matter by investigating the nonequilibrium response of a two-dimensional magnet with Dzyaloshinskii-Moriya interactions subjected to a periodically oscillating magnetic field. Using extensive Monte Carlo simulations, we uncover a dynamically reentrant skyrmion phase that emerges within a finite window of field amplitudes and bias fields, sandwiched between the conventional skyrmion and polarized ferromagnetic phases. This phase has no equilibrium counterpart and originates from an imbalance between skyrmion creation and annihilation over a single field cycle, leading to a reversal of the period-averaged topological charge. We show that the re-entrant phase exists only in the dynamic response regime where the system can follow the drive, and is suppressed at higher driving frequencies. Our results establish periodic driving as a nonequilibrium control parameter for stabilizing and reversing skyrmion topology.", "url": "https://arxiv.org/abs/2611.06541", "type": "理论+数值", "summary": "我们通过研究具有 Dzyaloshinskii-Moriya 相互作用的二维磁体在周期性振荡磁场下的非平衡响应，解决了驱动拓扑物质中的一个核心开放问题。通过广泛的蒙特卡罗模拟，我们发现了一种动态重入斯格明子相，它出现在场振幅和偏置场的有限窗口内，夹在传统斯格明子相和极化铁磁相之间。该相没有平衡对应物，源于单个场周期内斯格明子产生和湮灭之间的不平衡，导致周期平均拓扑电荷的逆转。我们表明，重入阶段仅存在于系统可以跟随驱动的动态响应区域中，并且在较高的驱动频率下被抑制。我们的结果将周期性驱动确立为稳定和反转斯格明子拓扑的非平衡控制参数。", "authors": [{"name": "Z.Demir Vatansever"}, {"name": "E. Vatansever"}, {"name": "A. Vasilopoulos"}, {"name": "N.G. Fytas"}, {"name": "A. Berger"}], "featured_authors": [{"name": "Z.Demir Vatansever"}, {"name": "E. Vatansever"}, {"name": "A. Vasilopoulos"}, {"name": "N.G. Fytas"}, {"name": "A. Berger"}], "author_count": 5}, {"id": "2611.06582", "category": "cond-mat", "title": "Finite-width shift of the edge of chaos in deep neural networks", "abstract": "Deep neural networks train best when they are initialised at the edge of chaos, the critical line in the plane of weight and bias variances on which the distance between two inputs neither grows nor shrinks with depth. The line is known for infinitely wide networks; at finite width it moves, and how it moves has been disputed. We treat the logarithm of the distance between two inputs through a network of width $N$ as a random walk and compute its drift and variance to order $1/N$. The edge of chaos moves to a larger weight variance, by $\\Delta\\sigma_w^2=-a_1/(N\\,\\partial_{\\sigma_w^2}\\ln\\chi_1)$, about $8/N$ for $\\tanh$ networks at a bias variance of $0.05$, confirmed by simulations of the exact finite-width recursion. The shift describes a typical network; the average over many networks is dominated by rare networks in which the distance grows, and its critical point moves the other way, which explains why calculations and simulations have disagreed. Backpropagation follows the same random walk, so the shift applies to gradients unchanged. Along the edge of chaos, the information about the similarity of two inputs is constant until the compression over the depth exceeds about one nat, which fixes where to sit on the line. The results give an initialisation rule, Crinit, that places a network on its finite-width edge of chaos without a search. On MNIST and Fashion-MNIST at width $64$ it is more accurate than the standard rules at their usual settings, by a small margin in shallow networks and a large one in deep networks, where most standard rules fail; it trains in fewer steps, and it matches or beats the standard rules with a tuned gain.", "url": "https://arxiv.org/abs/2611.06582", "type": "理论+数值", "summary": "深度神经网络在混沌边缘初始化时训练效果最好，混沌边缘是权重和偏差方差平面中的临界线，在该临界线上两个输入之间的距离既不随深度增加也不缩小。该线路以无限宽广的网络而闻名。它在有限的宽度下移动，并且它如何移动一直存在争议。我们将宽度为 $N$ 的网络中两个输入之间的距离的对数视为随机游走，并按 $1/N$ 顺序计算其漂移和方差。混沌边缘移动到更大的权重方差，$\\Delta\\sigma_w^2=-a_1/(N\\,\\partial_{\\sigma_w^2}\\ln\\chi_1)$，对于$\\tanh$网络来说，偏差方差为$0.05$，约为$8/N$，通过精确有限宽度递归的模拟证实。该转变描述了一个典型的网络；许多网络的平均值主要由距离增长的稀有网络主导，并且其临界点向相反方向移动，这解释了为什么计算和模拟不一致。反向传播遵循相同的随机游走，因此偏移适用于不变的梯度。\n\n沿着混沌的边缘，关于两个输入的相似性的信息是恒定的，直到深度上的压缩超过大约 1 nat，这确定了在线的位置。结果给出了一个初始化规则 Crinit，它将网络放置在其有限宽度的混沌边缘上，而无需搜索。在宽度为 $64$ 的 MNIST 和 Fashion-MNIST 上，它比通常设置下的标准规则更准确，在浅层网络中精确度较小，而在大多数标准规则失败的深层网络中精确度较大；它以更少的步骤进行训练，并且通过调整的增益匹配或击败标准规则。", "authors": [{"name": "Arn Caesar"}], "featured_authors": [{"name": "Arn Caesar"}], "author_count": 1}, {"id": "2611.06614", "category": "cond-mat", "title": "Explicit pore pre-conditioning and inverse design of amorphous nanoporous carbon", "abstract": "Porous carbons store energy, capture gases and purify water, and their performance depends strongly on the geometry of their pores. Atomistic models mostly simulate their synthesis by molecular dynamics, with results that depend on the interatomic potential, and return the pore network as an output rather than as a specification. Here we show that the pore network can be an input: pores drawn from a target size distribution fill a prescribed volume fraction, carbon is grown around them by stochastic ring placement, and a particle swarm recovers the construction parameters from a structural fingerprint. The search reproduces the density, surface area and pore volume of a carbon produced by quenched molecular dynamics within about 5 %, together with its pore size distribution. As a stress test, it also recovers a bimodal distribution, and the search history reveals which parameters the targets constrain and flags a failed search. A short anneal completes the network, recovering the coordination of the reference while the pore size distribution keeps its shape. Molecular dynamics still supplies the local chemistry, but the pore geometry becomes a design variable for a given application.", "url": "https://arxiv.org/abs/2611.06614", "type": "理论+数值", "summary": "多孔碳可以储存能量、捕获气体和净化水，其性能在很大程度上取决于其孔隙的几何形状。原子模型主要通过分子动力学模拟它们的合成，其结果取决于原子间势，并将孔隙网络作为输出而不是作为规范返回。在这里，我们表明孔隙网络可以作为输入：从目标尺寸分布中提取的孔隙填充规定的体积分数，通过随机环放置在它们周围生长碳，并且粒子群从结构指纹中恢复构造参数。该搜索重现了由淬火分子动力学产生的碳的密度、表面积和孔体积（误差在 5% 左右）及其孔径分布。作为压力测试，它还恢复双峰分布，搜索历史记录显示目标限制哪些参数并标记失败的搜索。短暂的退火完成了网络，恢复了参考的配位，同时孔径分布保持其形状。\n\n分子动力学仍然提供局部化学，但孔隙几何形状成为给定应用的设计变量。", "authors": [{"name": "Matteo Alberghini"}, {"name": "Giacomo Pierotti"}, {"name": "Maryam Amini"}, {"name": "Mauro Sgroi"}, {"name": "Alessio Tommasi"}], "featured_authors": [{"name": "Matteo Alberghini"}, {"name": "Giacomo Pierotti"}, {"name": "Maryam Amini"}, {"name": "Mauro Sgroi"}, {"name": "Alessio Tommasi"}], "author_count": 5}, {"id": "2611.06720", "category": "cond-mat", "title": "Cell-type-specific modularity in E/I networks shapes dynamical regimes and computational capabilities", "abstract": "Structural modularity is a ubiquitous feature of brain networks that shapes neural dynamics and information processing. Yet excitatory and inhibitory populations can differ in their modular organization, and it remains unclear how this asymmetry affects network dynamics and computation. Here, using dynamical mean-field theory and simulations of networks performing complex temporal tasks, we show that independently tuning excitatory and inhibitory modularity controls the dynamical regimes of balanced E/I networks. In particular, such tuning can generate a dominant spectral outlier despite overall E/I balance, producing a topology-controlled transition between bulk- and low-rank-dominated regimes, with different dynamical bifurcations leading to chaos and bistability, respectively. In chaotic time-series prediction tasks, computational performance is enhanced near these dynamical boundaries, including both the onset of chaos and the transition to bistability. Favorable configurations exhibit strongly modular excitation and comparatively homogeneous inhibition, similar to what is observed in cortical connectivity.", "url": "https://arxiv.org/abs/2611.06720", "type": "理论+数值", "summary": "结构模块化是大脑网络的普遍特征，它塑造神经动力学和信息处理。然而，兴奋性和抑制性群体的模块化组织可能不同，而且这种不对称性如何影响网络动态和计算仍不清楚。在这里，利用动态平均场理论和执行复杂时间任务的网络模拟，我们表明独立调整兴奋性和抑制性模块控制着平衡 E/I 网络的动态机制。特别是，尽管整体 E/I 平衡，这种调谐仍可以产生主要的光谱异常值，从而在体和低秩主导的体系之间产生拓扑控制的过渡，不同的动态分叉分别导致混沌和双稳态。在混沌时间序列预测任务中，在这些动态边界附近，计算性能得到增强，包括混沌的开始和向双稳态的过渡。有利的配置表现出强烈的模块化兴奋和相对均匀的抑制，类似于在皮质连接中观察到的情况。", "authors": [{"name": "Emmanouil Giannakakis"}, {"name": "Victor Buendía"}, {"name": "Oleg Vinogradov"}, {"name": "Anna Levina"}], "featured_authors": [{"name": "Emmanouil Giannakakis"}, {"name": "Victor Buendía"}, {"name": "Oleg Vinogradov"}, {"name": "Anna Levina"}], "author_count": 4}, {"id": "2611.06795", "category": "cond-mat", "title": "Hidden entropic order of emergent charges in a classical Ampère spin liquid", "abstract": "Classical spin liquids are characterized by an extensive number of ground-state configurations. Coulomb spin liquids have, in this ground-state manifold, a divergence-free local constraint, which gives dipolar correlations and pinch points in the structure factor. Recently, models with a complementary ground-state constraint, defined by a zero-circulation constraint (Ampère's law), have been proposed. While classical Coulomb spin liquids forbid emergent charges, their Ampère counterparts leave the charges unconstrained. Here we study an Ising Ampère model on the octochlore lattice. The ground states obey a Gauss law for an antisymmetric rank-two field, i.e., three coupled two-dimensional Gauss laws, which are expected to produce pinch points in the structure factor. Nevertheless, maximal charges, vertices with all six arrows in or out, spontaneously accumulate on one of the two sublattices of the cubic lattice, with disordered signs. This order has a purely entropic origin; it washes out the pinch-point singularities at large scales, produces no magnetic Bragg peaks, and coexists with an extensive entropy. The system enters into this sublattice long-range ordered state through a continuous transition in what seems to be the three-dimensional Ising universality class. Moreover, the state has no magnetic order; it is even under time reversal: it is a hidden, entropic order within the Ampère manifold. Thus, a system whose Gauss law would predict an algebraic spin liquid becomes, through a non-magnetic ordering transition, a partially ordered short-range spin liquid. Our study is based on a combination of the constraint-vector theory, exact bounds and enumeration, and Monte Carlo, Wang-Landau, and parallel-tempering simulations.", "url": "https://arxiv.org/abs/2611.06795", "type": "理论+数值", "summary": "经典自旋液体的特点是具有大量的基态构型。在这个基态流形中，库仑自旋液体具有无散度局部约束，它给出了结构因子中的偶极相关性和夹点。最近，提出了具有由零循环约束（安培定律）定义的互补基态约束的模型。虽然经典的库仑自旋液体禁止紧急电荷，但它们的安培对应物却使电荷不受限制。在这里，我们研究八氯石晶格上的伊辛安培模型。基态服从反对称二阶场的高斯定律，即三个耦合的二维高斯定律，预计它们会在结构因子中产生夹点。然而，最大电荷，即所有六个箭头都进出的顶点，会自发地累积在立方晶格的两个子晶格之一上，并且符号无序。这个秩序有一个纯粹的熵起源；它在大尺度上消除了夹点奇点，不产生磁性布拉格峰，并且与广泛的熵共存。\n\n系统通过看似三维伊辛普适性类的连续转变进入这种亚晶格长程有序状态。而且，国家没有磁力秩序；即使在时间反转的情况下也是如此：它是安培流形内隐藏的熵序。因此，高斯定律预测代数自旋液体的系统通过非磁性有序转变变成部分有序的短程自旋液体。我们的研究基于约束向量理论、精确界限和枚举以及蒙特卡罗、Wang-Landau 和平行回火模拟的组合。", "authors": [{"name": "H. Diego Rosales"}, {"name": "Emma M. Bizot"}, {"name": "Flavia A. Gómez Albarracín"}, {"name": "Pierre Pujol"}], "featured_authors": [{"name": "H. Diego Rosales"}, {"name": "Emma M. Bizot"}, {"name": "Flavia A. Gómez Albarracín"}, {"name": "Pierre Pujol"}], "author_count": 4}, {"id": "2611.06843", "category": "cond-mat", "title": "Thermally Conditioned Time-Series Forecasting of Grain Growth in Polycrystalline Materials", "abstract": "Grain growth during heat treatment strongly affects the microstructure of polycrystalline materials and, consequently, their mechanical properties. Although numerical methods such as front-tracking or front-capturing simulations can accurately describe grain growth, their high computational cost limits their use for long or non-isothermal thermal cycles. In previous work, grain growth was successfully predicted under isothermal conditions by treating grain size distributions as time series and forecasting their evolution using recurrent neural networks, allowing complete grain growth trajectories to be generated in seconds rather than through costly PDE-based simulations. In the present work, this forecasting framework is reformulated to handle non-isothermal conditions by explicitly incorporating thermal information into the model architecture. Grain size distributions are encoded using a convolutional neural network, thermal descriptors are embedded through a dedicated multilayer perceptron, and temporal evolution is predicted using a recurrent network. Instantaneous temperature and thermal rate are provided at each time step, allowing the model to adapt its predictions to changing thermal conditions. The framework is trained and evaluated on datasets generated from validated front-tracking simulations across a wide range of non-isothermal thermal paths. The results show that the thermally conditioned model accurately reproduces grain growth dynamics under complex thermal histories, achieving, in k-fold cross-validation over all simulations, mean relative errors of 2.99% (one-hour cycles) and 4.51% (four-hour cycles) with coefficients of determination exceeding 0.99, and mean relative errors between 1.91% and 14.66% on ten simulations following four unseen thermal histories of increasing complexity.", "url": "https://arxiv.org/abs/2611.06843", "type": "理论+数值", "summary": "热处理过程中的晶粒生长强烈影响多晶材料的微观结构，从而影响其机械性能。尽管前沿跟踪或前沿捕获模拟等数值方法可以准确地描述晶粒生长，但其高计算成本限制了它们在长或非等温热循环中的使用。在之前的工作中，通过将晶粒尺寸分布视为时间序列并使用循环神经网络预测其演化，成功地预测了等温条件下的晶粒生长，从而可以在几秒钟内生成完整的晶粒生长轨迹，而不是通过昂贵的基于偏微分方程的模拟。在目前的工作中，该预测框架被重新制定，通过将热信息明确地纳入模型架构来处理非等温条件。使用卷积神经网络对粒度分布进行编码，通过专用的多层感知器嵌入热描述符，并使用循环网络预测时间演化。\n\n每个时间步骤都会提供瞬时温度和热速率，使模型能够根据不断变化的热条件调整其预测。该框架根据跨各种非等温热路径的经过验证的前向跟踪模拟生成的数据集进行训练和评估。结果表明，热调节模型准确地再现了复杂热历史下的晶粒生长动态，在所有模拟的 k 倍交叉验证中，平均相对误差为 2.99%（一小时循环）和 4.51%（四小时循环），确定系数超过 0.99，在 4 次看不见的复杂性不断增加的热历史之后的 10 次模拟中，平均相对误差在 1.91% 和 14.66% 之间。", "authors": [{"name": "Eliane Younes"}, {"name": "Elie Hachem"}, {"name": "Marc Bernacki"}], "featured_authors": [{"name": "Eliane Younes"}, {"name": "Elie Hachem"}, {"name": "Marc Bernacki"}], "author_count": 3}, {"id": "2611.05473", "category": "hep-th", "title": "Exact thermal correlators at vanishing momenta and the black hole singularity", "abstract": "We study thermal two- and three-point functions of scalar primaries in holographic CFTs dual to AdS black branes. The three-point function arises from a cubic scalar interaction in the bulk. At vanishing external momenta, the tree-level results can be written in closed form and are exact in the operator dimensions. We reproduce them through direct CFT calculations in two dimensions. Their large-dimension expansions contain subleading exponential terms encoding the radial proper time from the horizon to the black hole singularity. These results provide an exact test of earlier WKB and saddle-point predictions for higher-point thermal correlators, confirming the proper-time signature while correcting the predicted asymptotic form.", "url": "https://arxiv.org/abs/2611.05473", "type": "理论", "summary": "我们研究了与 AdS 黑膜对偶的全息 CFT 中标量原色的热两点和三点函数。三点函数源自本体中的三次标量相互作用。在外部动量消失的情况下，树级结果可以以封闭形式编写，并且在算子维度上是精确的。我们通过直接二维 CFT 计算来重现它们。它们的大维展开包含编码从地平线到黑洞奇点的径向固有时间的次领先指数项。这些结果提供了对早期 WKB 和较高点热相关器鞍点预测的精确测试，确认了原时特征，同时校正了预测的渐近形式。", "authors": [{"name": "Kaustubh Singhi"}], "featured_authors": [{"name": "Kaustubh Singhi"}], "author_count": 1}, {"id": "2611.05480", "category": "hep-th", "title": "Satisfying Freed--Witten quantization on smooth divisors in Calabi--Yau orientifolds", "abstract": "Freed--Witten quantization conditions on several divisors wrapped by D-branes must be satisfied with one bulk $B$-field. On a smooth Calabi--Yau threefold $X$ with a holomorphic O3/O7 involution $\\sigma$, we show that the common background $B_{2,+}^{\\star}=\\tfrac12[R]$, where $R$ is the total O7 divisor, permits Freed--Witten period quantization on the full two-cycle lattice of \\emph{every smooth connected divisor}, modulo torsion. The worldvolume fluxes are chosen individually and obey the orientifold relation between each divisor and its image. The central step concerns setwise invariant divisors $D$: we prove that the bulk Freed--Witten class $\\eta_D^\\star=\\tfrac12([R]+[D])|_D$ has integer periods on every $\\sigma$-even integral two-cycle class, including inherited and autochthonous classes. Its periods on purely $\\sigma$-odd classes vanish, so any remaining non-integer periods occur only on classes that are neither $\\sigma$-even nor $\\sigma$-odd. We show how to choose $\\sigma$-odd worldvolume fluxes on these invariant divisors that make all periods integral. For exchanged divisor pairs, quantizing the flux on one member automatically quantizes its orientifold image. On invariant divisors with $h^{2,0}_-(D)=0$, the constructed flux is of type $(1,1)$ and admits a primitive representative; this includes every smooth rigid invariant divisor. We also study zero worldvolume flux on invariant divisors. For $h^{1,1}_-(X)\\leq1$, we construct common bulk backgrounds satisfying every inherited intersection period on all such divisors. A binary compatibility test determines whether a common shift exists for larger $h^{1,1}_-(X)$. Non-inherited period tests then determine whether the resulting backgrounds allow zero flux on the full worldvolume lattices.", "url": "https://arxiv.org/abs/2611.05480", "type": "理论", "summary": "Freed——由 D 膜包裹的几个除数的维滕量化条件必须满足一个批量 $B$ 字段。在光滑的 Calabi--Yau 三重 $X$ 上，具有全纯 O3/O7 对合 $\\sigma$，我们证明了公共背景 $B_{2,+}^{\\star}=\\tfrac12[R]$，其中 $R$ 是总 O7 除数，允许在 \\emph{每个光滑连通除数} 的完整二周期晶格上进行 Freed--Witten 周期量化，模扭转。世界体积通量是单独选择的，并遵循每个除数与其图像之间的东方关系。中心步骤涉及集合不变除数 $D$：我们证明批量 Freed--Witten 类 $\\eta_D^\\star=\\tfrac12([R]+[D])|_D$ 在每个 $\\sigma$ 甚至整数二周期类上都有整数周期，包括继承类和本地类。它在纯 $\\sigma$-奇数类上的周期消失，因此任何剩余的非整数周期仅出现在既不是 $\\sigma$-偶数也不是 $\\sigma$-奇数的类上。我们展示了如何在这些使所有周期积分的不变除数上选择 $\\sigma$-奇世界体积通量。对于交换的除数对，量化一个成员上的通量会自动量化其东方图像。\n\n在 $h^{2,0}_-(D)=0$ 的不变除数上，构造的通量是 $(1,1)$ 类型并允许一个原始代表；这包括每个平滑刚性不变除数。我们还研究了不变除数的零世界体积通量。对于 $h^{1,1}_-(X)\\leq1$，我们构造了满足所有此类除数上的每个继承交集周期的公共块背景。二进制兼容性测试确定较大的 $h^{1,1}_-(X)$ 是否存在公共移位。然后，非继承周期测试确定所产生的背景是否允许整个世界体积晶格上的零通量。", "authors": [{"name": "Mudit Jain"}], "featured_authors": [{"name": "Mudit Jain"}], "author_count": 1}, {"id": "2611.05498", "category": "hep-th", "title": "Goldstone theory of gluon saturation in high energy QCD: From color glass to color superfluid condensate", "abstract": "In the high energy Regge asymptotics of QCD, the rapid overpopulation of gluons leads to gluon saturation, characterized by nonperturbative semi-classical lumpy configurations of size $1/Q_S$, where $Q_S\\gg \\Lambda_{\\rm QCD}$ is a dynamical semi-hard saturation scale. We discuss here a generalization of the Color Glass Condensate (CGC) framework describing this phenomenon that is obtained by carefully treating the breaking of global symmetries by the condensate. In particular, we show that the breaking of a global subgroup of color results in a Goldstone effective field theory (EFT) whose dynamics is characterized by a Goldstone decay constant $f_G = \\sqrt{N} Q_S$, where $N=O(1/\\alpha_S)$ is the phase space occupancy of the condensate, which is large for $\\alpha_S(Q_S)\\ll 1$. Further, the coupling of these colored Goldstones to collinear gluon modes leads to a depletion of the condensate, thereby modifying the static shockwave scattering framework of the CGC on timescales controlled by $f_G$. The CGC EFT on these longer time scales is a novel color superfluid. Low frequency modes with $\\omega\\leq \\alpha_S Q_S$ in an external probe of the CGC are sensitive to superfluid dynamics, with interesting physical consequences for deeply inelastic scattering and ultrarelativistic nuclear collisions.", "url": "https://arxiv.org/abs/2611.05498", "type": "理论", "summary": "在 QCD 的高能 Regge 渐进中，胶子的快速过量导致胶子饱和，其特征是大小为 $1/Q_S$ 的非微扰半经典块状配置，其中 $Q_S\\gg \\Lambda_{\\rm QCD}$ 是动态半硬饱和尺度。我们在这里讨论彩色玻璃凝聚体（CGC）框架的概括，该框架描述了通过仔细处理凝聚体对全局对称性的破坏而获得的现象。特别是，我们证明了全局颜色子群的破坏导致了戈德斯通有效场论（EFT），其动力学特征是戈德斯通衰变常数$f_G = \\sqrt{N} Q_S$，其中$N=O(1/\\alpha_S)$是凝聚态的相空间占用率，对于$\\alpha_S(Q_S)\\ll 1$来说很大。此外，这些彩色金石与共线胶子模式的耦合导致凝聚体的耗尽，从而在 $f_G$ 控制的时间尺度上修改 CGC 的静态冲击波散射框架。这些较长时间尺度上的 CGC EFT 是一种新颖的彩色超流体。\n\nCGC 外部探头中 $\\omega\\leq \\alpha_S Q_S$ 的低频模式对超流体动力学敏感，对深度非弹性散射和超相对论核碰撞产生有趣的物理后果。", "authors": [{"name": "V. P. Nair"}, {"name": "Raju Venugopalan"}], "featured_authors": [{"name": "V. P. Nair"}, {"name": "Raju Venugopalan"}], "author_count": 2}, {"id": "2611.05530", "category": "hep-th", "title": "Schwinger Effect with a Transversal Boundary", "abstract": "We study the effect of a boundary on pair production by an electric field. In particular, we are interested in the case in which the electric field has a normal component with respect to the boundary. This is essentially more complex than pure tangential fields due to the reflection of created particles against the boundary. In this article we provide the explicit solution for the case of an instantaneous electric pulse which is spatially uniform and normal to a flat surface. We show that pair production exhibits a bulk contribution that accounts for the interference of reflected modes, in addition to a purely boundary term. To conclude, we give an expression for the total particle production due to an irrotational electric pulse in a region delimited by an arbitrary boundary.", "url": "https://arxiv.org/abs/2611.05530", "type": "理论", "summary": "我们研究边界对电场对产生的影响。我们特别感兴趣的是电场具有相对于边界的法向分量的情况。由于所产生的粒子在边界上的反射，这本质上比纯切向场更复杂。在本文中，我们提供了空间均匀且垂直于平坦表面的瞬时电脉冲情况的显式解。我们表明，除了纯粹的边界项之外，对产生还表现出很大的贡献，可以解释反射模式的干扰。总之，我们给出了由任意边界界定的区域中无旋电脉冲产生的总粒子产生的表达式。", "authors": [{"name": "Santiago Christiansen Murguizur"}, {"name": "Daniela D'Ascanio"}, {"name": "Pablo Pisani"}, {"name": "Ulises Wainstein-Haimovichi"}], "featured_authors": [{"name": "Santiago Christiansen Murguizur"}, {"name": "Daniela D'Ascanio"}, {"name": "Pablo Pisani"}, {"name": "Ulises Wainstein-Haimovichi"}], "author_count": 4}, {"id": "2611.05624", "category": "hep-th", "title": "Complex phase diagram and thermodynamic supercriticality of five-dimensional four-charge AdS black holes in $STU-W^2U$ gauged supergravity", "abstract": "In this paper, we investigate the complex phase structure and thermodynamic supercriticality of static four-charge anti-de Sitter (AdS) black holes in five-dimensional $STU-W^2U$ gauged supergravity, with all four physical electric charges held fixed. A Van der Waals-like first-order small/large black hole phase transition is found to terminate at a critical point. By analytically continuing the fixed-charge thermodynamic relations, we trace the two real spinodal singularities through criticality into a complex-conjugate pair in the supercritical region. The corresponding spinodal temperatures exhibit the characteristic $3/2$ near-critical scaling, connecting the subcritical temperature splitting with the imaginary parts of the supercritical complex temperatures. We construct the associated complex phase diagram and identify a Widom-type crossover line from the real-temperature projection of the complex spinodals. This line progressively deviates from the locus of real heat-capacity maxima as the pressure increases. At higher pressures, the real heat-capacity extrema eventually merge and disappear, while the complex spinodal singularities persist. Together, these results reveal a continuous connection between critical phase transitions and supercritical thermodynamics through complex singularity structures, providing further insight into the thermodynamic phase behavior of multicharge supergravity black holes.", "url": "https://arxiv.org/abs/2611.05624", "type": "理论", "summary": "在本文中，我们研究了五维 $STU-W^2U$ 测量超重力中静态四电荷反德西特 (AdS) 黑洞的复杂相结构和热力学超临界性，所有四个物理电荷均保持固定。发现类范德华一阶小/大黑洞相变在临界点终止。通过分析延续固定电荷热力学关系，我们通过临界性将两个实旋节线奇点追踪到超临界区域中的复共轭对。相应的旋节线温度表现出 $3/2$ 近临界标度特征，将亚临界温度分裂与超临界复合温度的虚部联系起来。我们构建了相关的复数相图，并从复数旋节线的实际温度投影中识别出 Widom 型交叉线。随着压力的增加，这条线逐渐偏离实际热容最大值的轨迹。在较高的压力下，真实的热容极值最终会合并并消失，而复杂的旋节线奇点仍然存在。\n\n总之，这些结果通过复杂的奇点结构揭示了临界相变和超临界热力学之间的连续联系，从而进一步深入了解多电荷超重力黑洞的热力学相行为。", "authors": [{"name": "Di Wu"}, {"name": "Xiao-Dan Zhu"}], "featured_authors": [{"name": "Di Wu"}, {"name": "Xiao-Dan Zhu"}], "author_count": 2}, {"id": "2611.05663", "category": "hep-th", "title": "Chiral edge modes from lattice Chern-Simons theory", "abstract": "It is shown that a level $k$ Abelian lattice Chern-Simons theory with continuum time and a spatial square lattice, which is a topological field theory on the latticized plane and torus, when quantized on a spatial cylinder reduces to chiral edge excitations, exactly localized on the two boundaries and carrying two commuting lattice versions of the level-$k$ $U(1)$ Kac-Moody algebra of opposite chirality. The algebras are represented on a Fock space in the noncompact theory and by a finite Weyl algebra in the compact one. We also observe that the theory has a natural framing of Wilson loops which exhibits the correct framing anomaly.", "url": "https://arxiv.org/abs/2611.05663", "type": "理论", "summary": "结果表明，具有连续时间和空间方晶格的 $k$ 级阿贝尔格子陈-西蒙斯理论，这是一种关于格子化平面和环面的拓扑场论，当在空间圆柱上量化时，可简化为手性边缘激励，精确地定位在两个边界上，并带有相反手性的 $k$ $U(1)$ 级 Kac-Moody 代数的两个交换格子版本。在非紧理论中代数由 Fock 空间表示，在紧理论中由有限 Weyl 代数表示。我们还观察到该理论具有威尔逊环的自然框架，它表现出正确的框架异常。", "authors": [{"name": "Gordon W. Semenoff"}], "featured_authors": [{"name": "Gordon W. Semenoff"}], "author_count": 1}, {"id": "2611.05768", "category": "hep-th", "title": "Static and dynamical Casimir effects in a wedge within the worldline formulation", "abstract": "We study a real massless scalar field in $d+1$ dimensions confined to a wedge of opening angle $\\alpha$, in the presence of a semitransparent circular arc that may oscillate radially. Within the worldline formulation, and for an arbitrary strength $\\lambda$ of the $\\delta$-potential that models the arc, we expand the effective action in powers of the radial displacement $R$ of the arc. In this formulation, all the information about the media is contained in the propagator of a non-relativistic point particle, so that known results for that propagator can be used directly. At zeroth order we obtain the Casimir energy of the wedge, with Dirichlet, Neumann or mixed walls, and the contribution of the arc in closed form for arbitrary $\\lambda$. We show that the worldline integrand is, point by point, the energy density obtained from the energy-momentum tensor of the scalar field with curvature coupling $\\xi=1/4$; with this identification, and using dimensional regularization for the integrated quantities, we recover the known results for the wedge and for the wedge closed by a Dirichlet arc. At second order in $R$, we reduce the form factor that determines the imaginary part of the in-out effective action, and hence the probability of pair creation by the moving arc, to a one-loop expression involving the radial Green's functions of each angular sector. In the narrow-wedge limit, each angular sector behaves as a field with a mass set by the angular quantization, coupled to a moving $\\delta$-mirror; for a Dirichlet arc, the pair creation spectrum of the exterior region approaches that of a planar massive mirror, while the interior region behaves as a tapered cavity. Finally, by decomposing the electromagnetic field into TE and TM scalars, we obtain the Casimir energy of wedges with perfectly conducting, perfectly permeable and mixed walls.", "url": "https://arxiv.org/abs/2611.05768", "type": "理论", "summary": "我们研究了 $d+1$ 维度中的真实无质量标量场，限制在开角 $\\alpha$ 的楔形内，并且存在可能径向振荡的半透明圆弧。在世界线公式中，对于模拟弧的 $\\delta$ 势的任意强度 $\\lambda$，我们将有效作用扩展为弧的径向位移 $R$ 的幂。在这个公式中，有关介质的所有信息都包含在非相对论性点粒子的传播器中，因此可以直接使用该传播器的已知结果。在零阶，我们获得了楔形的卡西米尔能量，具有狄利克雷、诺依曼或混合壁，以及封闭形式的弧对任意 $\\lambda$ 的贡献。我们证明，世界线被积函数逐点是由曲率耦合的标量场的能量动量张量$\\xi=1/4$获得的能量密度；通过这种识别，并对积分量使用维度正则化，我们恢复了楔形和由狄利克雷弧闭合的楔形的已知结果。\n\n在 $R$ 的二阶，我们将决定输入输出有效作用的虚部的形状因子，以及因此移动弧创建对的概率，减少为涉及每个角扇区的径向格林函数的单循环表达式。在窄楔形极限中，每个角扇区表现为一个具有由角量化设置的质量的场，耦合到移动的 $\\delta$ 镜；对于狄利克雷弧，外部区域的电子对产生谱接近平面大镜子的谱，而内部区域则表现为锥形腔。最后，通过将电磁场分解为TE和TM标量，我们获得了具有完美导电、完美磁导和混合壁的楔子的卡西米尔能量。", "authors": [{"name": "César Daniel Fosco"}, {"name": "Bruno Cardin Guntsche"}], "featured_authors": [{"name": "César Daniel Fosco"}, {"name": "Bruno Cardin Guntsche"}], "author_count": 2}, {"id": "2611.05787", "category": "hep-th", "title": "Partially Massless Condensates and Reentrant NUT/Bolt Phase Transitions in Conformal Gravity", "abstract": "We study non-Einstein Bach-flat Taub-NUT/Bolt instantons with weakened AdS boundary conditions. In particular, the next-to-leading-order coefficient in the Fefferman--Graham expansion is nonvanishing, and it sources the partially massless response in the dual conformal field theory. As in the Einstein case, the holographic stress tensor of these instantons represents a perfect fluid with vorticity. Remarkably, we identify a non-Einstein Taub-Bolt branch supporting a nonvanishing partially massless response at zero source, while preserving the full symmetry of the squashed conformal boundary. The additional holographic degrees of freedom enrich the thermodynamic phase structure, allowing the conventional NUT/Bolt transition to disappear or give way to reentrant transitions. We further show that non-Einstein Bolts can possess negative thermodynamic volume and establish the absence of negative modes of a conformally coupled probe scalar on regular Bach-flat NUT backgrounds.", "url": "https://arxiv.org/abs/2611.05787", "type": "理论", "summary": "我们研究具有弱 AdS 边界条件的非爱因斯坦巴赫平坦 Taub-NUT/Bolt 瞬子。特别是，Fefferman-Graham 展开中的次前导阶系数是非零的，它源自对偶共形场论中的部分无质量响应。与爱因斯坦的情况一样，这些瞬子的全息应力张量代表了具有涡度的完美流体。值得注意的是，我们发现了一个非爱因斯坦陶布-博尔特分支，它支持零源处的非零部分无质量响应，同时保持压扁的共形边界的完全对称性。额外的全息自由度丰富了热力学相结构，使传统的 NUT/Bolt 转变消失或让位于重入转变。我们进一步表明，非爱因斯坦螺栓可以拥有负热力学体积，并确定在常规巴赫平坦 NUT 背景上不存在共形耦合探针标量的负模式。", "authors": [{"name": "Cristóbal Corral"}, {"name": "Felipe Diaz"}, {"name": "Borja Diez"}, {"name": "Eleftherios Papantonopoulos"}, {"name": "Per Sundell"}], "featured_authors": [{"name": "Cristóbal Corral"}, {"name": "Felipe Diaz"}, {"name": "Borja Diez"}, {"name": "Eleftherios Papantonopoulos"}, {"name": "Per Sundell"}], "author_count": 5}, {"id": "2611.05789", "category": "hep-th", "title": "Gluon and Faddeev--Popov ghost propagators in rotating background: An eigenfunction approach", "abstract": "We construct the free gluon and Faddeev--Popov ghost propagators in rigidly rotating cylindrical coordinates using an eigenfunction approach within the Feynman gauge. Starting from the quadratic gauge-fixed QCD action, we derive the corresponding kinetic operators and obtain their spectral representations. For the gluon field, a circular polarization basis diagonalizes the vector wave operator, leading to polarization-dependent shifts in the orders of the radial Bessel functions. In the absence of radial boundaries, we explicitly recover the standard Minkowski propagator in inertial Cartesian coordinates, showing that the off-diagonal tensor components in the cylindrical basis have a geometrical origin. We then extend the construction to a finite-radius cylinder satisfying the causality condition $|\\Omega|R<1$, imposing relative boundary conditions on the gluon field and Dirichlet conditions on the ghosts. The resulting discrete transverse spectra involve both Dirichlet and Neumann eigenvalues for the gluon modes, from which we obtain explicit spectral representations of the propagators. Our results provide a consistent framework for perturbative QCD calculations in rotating geometries, retaining the angular-momentum, polarization, and boundary effects relevant to future studies of correlation functions and radiative corrections.", "url": "https://arxiv.org/abs/2611.05789", "type": "理论", "summary": "我们使用费曼规范内的本征函数方法在刚性旋转的柱坐标中构造自由胶子和法捷夫-波波夫鬼传播器。从二次规范固定的QCD作用出发，我们推导了相应的动力学算子并获得了它们的谱表示。对于胶子场，圆偏振基础使矢量波算子对角化，导致径向贝塞尔函数的阶数发生偏振相关的变化。在没有径向边界的情况下，我们明确地恢复了惯性笛卡尔坐标中的标准闵可夫斯基传播器，表明圆柱基中的非对角张量分量具有几何原点。然后，我们将构造扩展到满足因果条件 $|\\Omega|R<1$ 的有限半径圆柱体，对胶子场施加相对边界条件，对鬼影施加狄利克雷条件。由此产生的离散横向光谱涉及胶子模式的狄利克雷和诺伊曼特征值，从中我们获得了传播子的明确光谱表示。\n\n我们的结果为旋转几何中的微扰 QCD 计算提供了一致的框架，保留了与未来相关函数和辐射校正研究相关的角动量、偏振和边界效应。", "authors": [{"name": "Benjamín García-Contreras"}, {"name": "Luis A. Hernández"}, {"name": "R. Zamora"}], "featured_authors": [{"name": "Benjamín García-Contreras"}, {"name": "Luis A. Hernández"}, {"name": "R. Zamora"}], "author_count": 3}, {"id": "2611.06058", "category": "hep-th", "title": "On phases of 4d $Spin/SO$ Yang-Mills theories", "abstract": "We study the low-temperature phase diagrams of $Spin(N)/SO(N)_\\pm$ Yang-Mills theories as functions of the $\\theta$-parameter. In particular, for every even integer $N\\geq 4$, we find a phase diagram consistent with the center/CP mixed anomaly, via the technique of mixed gauge theory. The resulting phase diagrams are in perfect agreement with the phase diagrams of $Spin(N)/SO(N)_\\pm$ super Yang-Mills theory softly broken by a small gaugino mass. In the case of $Spin(4k)$ Yang-Mills for an integer $k\\geq 2$, only two phases appear in the phase diagram, while in the $Spin(4)$ case the phase diagram contains four SPT phases protected by the $\\mathbb{Z}_2\\times \\mathbb{Z}_2$ center symmetry. In the case of $Spin(4k+2)$ Yang-Mills for a positive integer $k$, the phase diagram contains four SPT phases protected by the $\\mathbb{Z}_4$ center symmetry.", "url": "https://arxiv.org/abs/2611.06058", "type": "理论", "summary": "我们研究 $Spin(N)/SO(N)_\\pm$ Yang-Mills 理论的低温相图作为 $\\theta$ 参数的函数。特别是，对于每个偶数$N\\geq 4$，我们通过混合规范理论技术找到了与中心/CP混合异常一致的相图。由此产生的相图与 $Spin(N)/SO(N)_\\pm$ super Yang-Mills 理论的相图完全一致，该理论被小高吉诺质量轻轻打破。对于整数 $k\\geq 2$ 的 $Spin(4k)$ Yang-Mills 情况，相图中仅出现两个相，而在 $Spin(4)$ 情况下，相图包含受 $\\mathbb{Z}_2\\times \\mathbb{Z}_2$ 中心对称性保护的四个 SPT 相。对于正整数 $k$ 的 $Spin(4k+2)$ Yang-Mills 情况，相图包含受 $\\mathbb{Z}_4$ 中心对称性保护的四个 SPT 相。", "authors": [{"name": "Ryo Hamachika"}, {"name": "Takahiro Nishinaka"}], "featured_authors": [{"name": "Ryo Hamachika"}, {"name": "Takahiro Nishinaka"}], "author_count": 2}, {"id": "2611.06295", "category": "hep-th", "title": "Spectral flow in AdS$\\mathbf{_3}$ revisited", "abstract": "We revisit an old idea that spectral flow in WZW models can be associated with certain $G$-bundles over a worldsheet. This allows us to introduce a novel method for computing correlators of spectrally-flowed vertex operators in WZW models with group $G$ and level $k$, by systematically computing the contribution from a network of line defects. Specialising to the case of $G=SL(2, \\mathbb{R})$, as is relevant to AdS$_3$ string theory, we dem
