uantum compilation. This research illuminates pathways to achieving highly noise-resistant quantum circuits prior to the era of fault tolerance.", "url": "https://arxiv.org/abs/2611.06291", "type": "理论+数值", "summary": "噪声环境中的量子误差仍然是推进量子信息技术的主要障碍。标准量子纠错需要大量辅助量子位开销，从而激发了对硬件高效缓解策略的需求。在这项工作中，我们提出了一种电路级动态量子纠错框架，不需要逻辑编码或辅助量子位。通过将几何框架（最初是为在控制脉冲级别创建动态纠错门而开发的）扩展到数字电路的离散动态，我们将相干误差的累积映射到高维误差空间中的轨迹。我们证明，插入确定性优化的旋转门序列可以主动塑造这些轨迹，利用破坏性干扰来保持累积误差与误差缩放 $\\mathcal{O}(1)$ 的界限。这种确定性路径整形抑制电路错误的方式与使用错误缩放$\\mathcal{O}(\\sqrt{N})$的标准随机编译的随机游走行为根本不同。\n\n此外，我们还表明，这种电路级动态校正与脉冲级鲁棒控制相协同，在连续噪声动态和离散量子编译之间提供了一座分析桥梁。这项研究阐明了在容错时代之前实现高度抗噪声量子电路的途径。", "authors": [{"name": "Junkai Zeng"}, {"name": "Hao Liang"}, {"name": "Yong-Ju Hai"}, {"name": "Xiu-Hao Deng"}], "featured_authors": [{"name": "Junkai Zeng"}, {"name": "Hao Liang"}, {"name": "Yong-Ju Hai"}, {"name": "Xiu-Hao Deng"}], "author_count": 4}, {"id": "2611.06306", "category": "quant-ph", "title": "Spatial Path Superposition: A No-Cloning Perspective on MIMO-Inspired Spatial Diversity", "abstract": "Spatial diversity is a key mechanism in classical Multi-Input Multi-Output (MIMO) communications, where multiple propagation alternatives provide redundant observations that improve reliability in noisy environments. A direct translation of this principle to quantum communications is forbidden by the no-cloning theorem, since an unknown quantum state cannot be copied and transmitted through independent links. In this Perspective article, we argue that spatial path superposition provides a no-cloning-compatible analogue of the spatial-diversity principle of MIMO. Rather than duplicating the transmitted quantum state, a quantum carrier is coherently delocalized over multiple communication links, so that alternative spatial evolutions are experienced in quantum superposition. In this framework, classical redundancy is replaced by spatial coherence, and the communication link itself becomes part of the quantum dynamics. Indeed, spatial coherence can enhance the fidelity of the received quantum state, providing the quantum counterpart of the classical diversity gain, and can be converted into bipartite and multipartite entanglement during propagation. This implies that, under suitable coherent path control, noisy channel evolutions can contribute constructively to entanglement generation. This Perspective identifies spatial path superposition as a quantum-native primitive for the Quantum Internet, linking no-cloning-compatible spatial diversity, fidelity enhancement, entanglement generation, and coherent path control.", "url": "https://arxiv.org/abs/2611.06306", "type": "理论", "summary": "空间分集是经典多输入多输出 (MIMO) 通信中的关键机制，其中多种传播替代方案提供冗余观测，从而提高噪声环境中的可靠性。不可克隆定理禁止将该原理直接转化为量子通信，因为未知的量子态无法通过独立链路复制和传输。在这篇 Perspective 文章中，我们认为空间路径叠加提供了 MIMO 空间分集原理的非克隆兼容模拟。量子载体不是复制传输的量子态，而是在多个通信链路上相干地离域，从而在量子叠加中经历替代的空间演化。在这个框架中，经典冗余被空间相干性取代，通信链路本身成为量子动力学的一部分。事实上，空间相干性可以增强接收到的量子态的保真度，提供经典分集增益的量子对应物，并且可以在传播过程中转换为二部分和多部分纠缠。\n\n这意味着，在适当的相干路径控制下，噪声信道演化可以对纠缠的产生做出建设性的贡献。该观点将空间路径叠加确定为量子互联网的量子原生原语，将非克隆兼容的空间多样性、保真度增强、纠缠生成和相干路径控制联系起来。", "authors": [{"name": "Angela Sara Cacciapuoti"}, {"name": "Claudio Pellitteri"}, {"name": "Marcello Caleffi"}], "featured_authors": [{"name": "Angela Sara Cacciapuoti"}, {"name": "Claudio Pellitteri"}, {"name": "Marcello Caleffi"}], "author_count": 3}, {"id": "2611.06341", "category": "quant-ph", "title": "Improved Exact and Approximate Quantum Fourier Transforms from Multiplication", "abstract": "In the world of quantum computing, quantum Fourier transform (QFT) has been one of the most important subroutines for quantum algorithms, as exemplified by Shor's factoring algorithms and phase estimation (which in itself has been used as a primitive in various quantum algorithms). In fact most of the well known quantum algorithms can be divided into two classes, QFT based algorithms and search based algorithms. The usual circuit for QFT (covered in almost every basic quantum algorithms course) needs $O(q^2)$ gates (and $O(q)$ qubits) to perform the exact Fourier transform over $\\mathbb{F}_{2^q}$. Cleve and Watrous (FOCS 2000) improved this gate count to $O(q (\\log q)^2 (\\log \\log q))$ using the integer multiplication algorithm in $O(n (\\log n) (\\log \\log n))$ time for two $n$-bit integers (best known at that time). Our first main result shows that this gate count can be improved to $O(q (\\log q))$. In fact, if there is a multiplication circuit, to multiply two $n$-bit integers, with $O(n (\\log n)^{\\alpha})$ gates; we get a QFT circuit with $O(q (\\log q)^{\\alpha})$ gates (improving upon $O(q (\\log q)^{\\alpha + 1})$) gates from the construction of Cleve and Watrous). Given the recent claim by OpenAI about integer multiplication, this opens up the possibility of having a QFT circuit with $o \\left( q (\\log q)\\right)$ gates. On approximating the QFT over $\\ZZ/(2^q \\ZZ)$, the result of Ahokas, Cleve and Hales (ERATO 2003) showed that an approximating circuit can be built with $O \\left( q (\\log \\log(q/\\varepsilon))^{\\alpha+1} \\right)$ gates, where $\\epsilon$ is the approximating parameter. Our second main result again improves this to $O \\left( q (\\log \\log(q/\\varepsilon))^{\\alpha} \\right)$ gates.", "url": "https://arxiv.org/abs/2611.06341", "type": "数值", "summary": "在量子计算领域，量子傅立叶变换（QFT）一直是量子算法最重要的子例程之一，例如 Shor 的因式分解算法和相位估计（其本身已被用作各种量子算法中的原语）。事实上，大多数众所周知的量子算法可以分为两类：基于 QFT 的算法和基于搜索的算法。 QFT 的常用电路（几乎每个基本量子算法课程中都有介绍）需要 $O(q^2)$ 门（和 $O(q)$ 量子位）来对 $\\mathbb{F}_{2^q}$ 执行精确的傅里叶变换。 Cleve 和 Watrous (FOCS 2000) 使用整数乘法算法在 $O(n (\\log n) (\\log \\log n))$ 时间内将两个 $n$ 位整数的门数改进为 $O(q (\\log q)^2 (\\log \\log q))$（当时最著名）。我们的第一个主要结果表明，这个门数可以提高到 $O(q (\\log q))$。事实上，如果有一个乘法电路，将两个$n$位整数相乘，需要$O(n (\\log n)^{\\alpha})$门；我们得到了一个带有 $O(q (\\log q)^{\\alpha})$ 门的 QFT 电路（改进了 Cleve 和 Watrous 构造中的 $O(q (\\log q)^{\\alpha + 1})$) 门）。\n\n鉴于 OpenAI 最近关于整数乘法的声明，这开启了具有 $o \\left( q (\\log q)\\right)$ 门的 QFT 电路的可能性。在 $\\ZZ/(2^q \\ZZ)$ 上近似 QFT 时，Ahokas、Cleve 和 Hales (ERATO 2003) 的结果表明，可以使用 $O \\left( q (\\log \\log(q/\\varepsilon))^{\\alpha+1} \\right)$ 门构建近似电路，其中 $\\epsilon$ 是近似参数。我们的第二个主要结果再次将其改进为 $O \\left( q (\\log \\log(q/\\varepsilon))^{\\alpha} \\right)$ 门。", "authors": [{"name": "Chandrima Kayal"}, {"name": "Rajat Mittal"}, {"name": "Manaswi Paraashar"}, {"name": "Nitin Saurabh"}], "featured_authors": [{"name": "Chandrima Kayal"}, {"name": "Rajat Mittal"}, {"name": "Manaswi Paraashar"}, {"name": "Nitin Saurabh"}], "author_count": 4}, {"id": "2611.06448", "category": "quant-ph", "title": "Helium States in a CAS(2,2) Subspace Inspired by Quantum Photonics", "abstract": "We present a four-mode Fock-state photonics implementation of the variational quantum deflation (VQD) algorithm to calculate the ground-state and excited-state energies for the neutral helium atom in a CAS(2,2) Subspace. Its CAS(2,2) electronic Hilbert space is encoded into a bosonic Fock-space representation and subsequently optimized using a continuous-variable quantum circuit. The circuit architecture under study is constructed of single-mode phase shifts, beam splitters, and cross-Kerr interactions. The variational circuit is initialized in the Fock state $\\ket{1100}$ and its performance is benchmarked against exact diagonalization of the active-space configuration-interaction (CASCI) Hamiltonian. We also extend the method to optimize from the first to three excited states of the helium atom with the aid of the variational quantum deflation $(VQD)$ method in a CAS(2,2). We then investigate the performance of this circuit architecture as a basis for implementing the VQD method. In the ideal noiseless simulation setting, we see that the survival probability of the ground and the excited states within the target $CAS$ subspace is unity, because the total photon number and the photon number in the two spin sectors $\\alpha$ and $\\beta$ are preserved. We demonstrate that the proposed approach enables the determination of the ground and excited-state energies within the CAS(2,2) electronic Hilbert space using a continuous-variable quantum circuit and the variational quantum deflation ($VQD$) algorithm, while satisfying the orthogonality conditions with negligible errors.", "url": "https://arxiv.org/abs/2611.06448", "type": "理论+数值", "summary": "我们提出了变分量子紧缩 (VQD) 算法的四模式福克态光子学实现，用于计算 CAS(2,2) 子空间中中性氦原子的基态和激发态能量。其 CAS(2,2) 电子希尔伯特空间被编码为玻色福克空间表示，并随后使用连续变量量子电路进行优化。正在研究的电路架构由单模相移、分束器和交叉克尔相互作用构成。变分电路在 Fock 状态 $\\ket{1100}$ 中初始化，其性能以活动空间配置相互作用 (CASCI) 哈密顿量的精确对角化为基准。我们还借助 CAS(2,2) 中的变分量子紧缩 $(VQD)$ 方法将该方法扩展为从氦原子的第一激发态优化到三个激发态。然后我们研究该电路架构的性能，作为实现 VQD 方法的基础。\n\n在理想的无噪声模拟设置中，我们看到目标$CAS$子空间内的基态和激发态的生存概率是一致的，因为总光子数和两个自旋扇区$\\alpha$和$\\beta$中的光子数被保留。我们证明，所提出的方法能够使用连续变量量子电路和变分量子紧缩 ($VQD$) 算法确定 CAS(2,2) 电子希尔伯特空间内的基态和激发态能量，同时满足误差可忽略不计的正交性条件。", "authors": [{"name": "Forouzan Mirmasoudi"}, {"name": "Badie Ghavami"}], "featured_authors": [{"name": "Forouzan Mirmasoudi"}, {"name": "Badie Ghavami"}], "author_count": 2}, {"id": "2611.06454", "category": "quant-ph", "title": "Beyond the Gap: What Imaginary-Time Evolution Reveals About the Edge of the Continuum", "abstract": "The spectral gap, the energy separating the ground state from the first excitation, governs many quantum phenomena, yet it is far harder to compute than the ground state. We propose a mathematically rigorous method for extracting the gap from imaginary-time evolution in infinite-dimensional Hamiltonians, where the first excitation typically marks the edge of a continuous spectrum. We show that a gap is not automatically detected: detection depends on how the initial state and observable couple the ground state to excitations at the bottom of the continuum. When this coupling follows a power law, the gap is recovered together with a logarithmic correction whose coefficient yields the exponent of the spectral density near the edge of the continuum, which reflects the physics of the excitations. We confirm both predictions numerically for an exactly solvable model. Our results offer a new numerical approach to many-body quantum physics, in which both the gap and the threshold exponent are obtained merely at the cost of a ground-state calculation.", "url": "https://arxiv.org/abs/2611.06454", "type": "理论+数值", "summary": "光谱间隙（将基态与第一次激发分开的能量）控制着许多量子现象，但它比基态更难计算。我们提出了一种数学上严格的方法，用于从无限维哈密顿量的虚时间演化中提取间隙，其中第一次激励通常标记连续谱的边缘。我们表明，间隙不会自动检测到：检测取决于初始态和可观察到的基态如何与连续体底部的激励耦合。当这种耦合遵循幂律时，间隙与对数校正一起恢复，其系数产生连续谱边缘附近的谱密度的指数，这反映了激发的物理性质。我们在数值上证实了精确可解模型的两个预测。我们的结果为多体量子物理提供了一种新的数值方法，其中间隙和阈值指数仅以基态计算为代价获得。", "authors": [{"name": "Ruben Karapetyan"}, {"name": "Denys Bondar"}, {"name": "Jakub Mareček"}, {"name": "Aleš Wodecki"}], "featured_authors": [{"name": "Ruben Karapetyan"}, {"name": "Denys Bondar"}, {"name": "Jakub Mareček"}, {"name": "Aleš Wodecki"}], "author_count": 4}, {"id": "2611.06469", "category": "quant-ph", "title": "Universally Certifying Partially Self-Correcting Quantum Memories in 3D Translation-Invariant Stabilizer Codes", "abstract": "Achieving passive protection of quantum information at finite temperature is a central problem at the intersection of quantum information and quantum many-body physics. Yet a general, computable criterion for determining self-correcting behavior directly from the form of local interactions remains elusive. Here we develop a unified algebraic-geometric framework for certifying partial self-correction in three-dimensional translation-invariant local stabilizer codes, encompassing the cubic code as a special case. From the algebraic curves defined by the codes' defining polynomials, we construct valuation matrices on the boundaries of their normalized projective closures and derive a computable rank criterion. Together with a polynomial-time decoder, this criterion guarantees super-Arrhenius memory lifetimes for code families satisfying it under the specified local Davies dynamics. We apply the framework to certify several classes of partially self-correcting quantum memories, including nearest-neighbor models with stabilizer weight as low as six and long memory lifetimes at modest system sizes. These results establish an algebraic-geometric connection between local stabilizer structure and the recoverability of quantum information at finite temperature, providing a systematic approach to certifying and designing passive quantum memories.", "url": "https://arxiv.org/abs/2611.06469", "type": "理论", "summary": "在有限温度下实现量子信息的被动保护是量子信息与量子多体物理交叉的一个中心问题。然而，直接从局部交互的形式确定自我纠正行为的通用的、可计算的标准仍然难以捉摸。在这里，我们开发了一个统一的代数几何框架，用于证明三维平移不变局部稳定器代码中的部分自校正，其中将立方代码作为特例。根据代码定义多项式定义的代数曲线，我们在其归一化投影闭包的边界上构造评估矩阵，并导出可计算的等级标准。与多项式时间解码器一起，该标准保证了在指定的局部戴维斯动力学下满足该标准的代码族的超阿伦尼乌斯内存寿命。我们应用该框架来验证几类部分自校正量子存储器，包括稳定器重量低至六的最近邻模型以及在适度系统尺寸下的长存储器寿命。\n\n这些结果在局部稳定器结构与有限温度下量子信息的可恢复性之间建立了代数几何联系，为验证和设计无源量子存储器提供了系统方法。", "authors": [{"name": "Chong-Yuan Xu"}, {"name": "Yong Xu"}], "featured_authors": [{"name": "Chong-Yuan Xu"}, {"name": "Yong Xu"}], "author_count": 2}, {"id": "2611.06502", "category": "quant-ph", "title": "A Variational Quantum Algorithm for Multi-Skill Project Scheduling", "abstract": "Job scheduling is an NP-hard optimization problem with clear industrial relevance. In practice, distributing work across a team is not only about meeting deadlines or improving productivity; it also affects fatigue, stress, and employee well-being. Variational Quantum Algorithms (VQAs) provide a promising way to address these problems through QUBO formulations, although their scalability on near-term NISQ hardware is still limited by Hilbert-space growth and barren plateaus. In this work, we simulate a VQA for a realistic Multi-Skill Resource-Constrained Project Scheduling Problem (MS-RCPSP), including worker capacities, skill matrices, task priorities, deadlines, and calendar stability during rescheduling. To keep the problem within a near-term circuit size, we use a temporal batch decomposition that solves one day at a time, propagates the remaining workload, and combines it with a logarithmic binary encoding that keeps every batch at or below 30 qubits. Because the ground state of a QUBO Hamiltonian is a computational basis state, entanglement is not required to represent the solution, raising the question of whether it helps or hinders ansatz training. We address this question by comparing the linear and brick-wall entangling topologies of a hardware-efficient ansatz with an entanglement-free reference that has the same number of parameters and by training every configuration with COBYLA and with Adam using SPSA gradient estimation. For the instance and initialization studied, the entanglement-free reference produced feasible schedules under both optimizers. With COBYLA, it produced the feasible schedule closest to the required workload at a fraction of the simulation cost of the entangled topologies, indicating that entanglement did not improve the solutions found by the VQA.", "url": "https://arxiv.org/abs/2611.06502", "type": "理论+数值", "summary": "作业调度是一个 NP 难优化问题，具有明显的工业相关性。在实践中，在团队中分配工作不仅是为了按时完成任务或提高生产力，更是为了提高工作效率。它还会影响疲劳、压力和员工的幸福感。变分量子算法 (VQA) 提供了一种通过 QUBO 公式解决这些问题的有前途的方法，尽管它们在近期 NISQ 硬件上的可扩展性仍然受到希尔伯特空间增长和贫瘠平台的限制。在这项工作中，我们模拟了现实的多技能资源受限项目调度问题（MS-RCPSP）的 VQA，包括工人能力、技能矩阵、任务优先级、截止日期和重新安排期间的日历稳定性。为了将问题控制在近期电路大小内，我们使用时间批量分解来解决一天的问题，传播剩余的工作负载，并将其与对数二进制编码相结合，使每个批次保持在或低于 30 个量子位。由于 QUBO 哈密顿量的基态是计算基础状态，因此不需要纠缠来表示解，这就提出了它是否有助于或阻碍 ansatz 训练的问题。\n\n我们通过将硬件高效 ansatz 的线性和砖墙纠缠拓扑与具有相同数量参数的无纠缠参考进行比较，并使用 COBYLA 和 Adam 使用 SPSA 梯度估计来训练每个配置来解决这个问题。对于所研究的实例和初始化，无纠缠参考在两个优化器下都产生了可行的调度。借助 COBYLA，它以纠缠拓扑模拟成本的一小部分生成了最接近所需工作负载的可行计划，这表明纠缠并没有改进 VQA 找到的解决方案。", "authors": [{"name": "Raul Martinez"}, {"name": "Miguel Sánchez-Beato"}, {"name": "Matilde Osa"}, {"name": "Jorge Parra"}, {"name": "Mario Calonge"}], "featured_authors": [{"name": "Raul Martinez"}, {"name": "Miguel Sánchez-Beato"}, {"name": "Matilde Osa"}, {"name": "Jorge Parra"}, {"name": "Mario Calonge"}], "author_count": 5}, {"id": "2611.06568", "category": "quant-ph", "title": "Parrondo's paradox for three discrete-time quantum walks with distinct shift operators", "abstract": "Parrondo's paradox describes a surprising phenomenon in which certain combinations of biased quantum walks result in an unexpected reversal of their bias direction. To date, research on this effect has predominantly focused on one-dimensional discrete-time quantum walks that employ fixed sequences of two or three quantum coins, paired with a single shift operator. In this work, we first introduce a wide class of unitary shift operators which allow for three movement options (left, right or stay in place) of a walker in one time step, and we then demonstrate that Parrondo's paradox can also arise with a single coin and three distinct shift operators. Furthermore, we investigate how this paradox influences the time evolution of quantum entanglement between the walker and the coin in such quantum walks.", "url": "https://arxiv.org/abs/2611.06568", "type": "理论", "summary": "帕隆多悖论描述了一种令人惊讶的现象，其中偏向量子行走的某些组合导致其偏向方向意外逆转。迄今为止，对这种效应的研究主要集中在一维离散时间量子行走，该行走采用两个或三个量子硬币的固定序列，并与单个移位运算符配对。在这项工作中，我们首先引入一类广泛的酉移位算子，它允许步行者在一个时间步内提供三种运动选项（左、右或留在原地），然后我们证明帕隆多悖论也可以通过单个硬币和三个不同的移位算子出现。此外，我们研究了这种悖论如何影响这种量子行走中步行者和硬币之间的量子纠缠的时间演化。", "authors": [{"name": "Zbigniew Walczak"}, {"name": "Jarosław H. Bauer"}], "featured_authors": [{"name": "Zbigniew Walczak"}, {"name": "Jarosław H. Bauer"}], "author_count": 2}, {"id": "2611.06630", "category": "quant-ph", "title": "Noise-regularized training of quantum circuit Born machines under a finite shot budget", "abstract": "Quantum circuit Born machines (QCBMs) can learn distributions that are hard to sample from classically, but their value depends on generalizing from finite training data. Here, we study how hardware noise affects this generalization. We show that, for any noise process, the generalization gap of a QCBM trained with the maximum mean discrepancy is bounded by the complexity of the distributions the noisy model can reach. Scrambled local Pauli noise contracts this complexity but biases the model towards the uniform distribution, so residual noise acts as a regularizer whose optimal strength can be intermediate. We propose GENIE, a framework that realizes a chosen noise level with capped error mitigation and selects it during training from held-out data within a fixed execution budget, with provably bounded regret. In simulations on synthetic and census data, GENIE stays close to the best of four noise-control strategies, whereas every fixed noise level falls short in many settings.", "url": "https://arxiv.org/abs/2611.06630", "type": "理论+数值", "summary": "量子电路玻恩机（QCBM）可以学习很难从经典中采样的分布，但它们的价值取决于对有限训练数据的概括。在这里，我们研究硬件噪声如何影响这种概括。我们表明，对于任何噪声过程，以最大平均差异训练的 QCBM 的泛化差距受到噪声模型可以达到的分布复杂性的限制。加扰的局部泡利噪声降低了这种复杂性，但使模型偏向均匀分布，因此残余噪声充当正则化器，其最佳强度可以是中间的。我们提出了 GENIE，这是一个框架，它通过限制错误缓解来实现选定的噪声水平，并在训练期间从固定执行预算内的保留数据中选择它，并且可以证明，遗憾是有限的。在对合成数据和人口普查数据的模拟中，GENIE 接近四种噪声控制策略中的最佳策略，而每个固定噪声水平在许多设置中都达不到要求。", "authors": [{"name": "Hoang M. Ngo"}, {"name": "Quan Nguyen"}, {"name": "Jung Taek Seo"}, {"name": "Wanli Xing"}, {"name": "My T. Thai"}], "featured_authors": [{"name": "Hoang M. Ngo"}, {"name": "Quan Nguyen"}, {"name": "Jung Taek Seo"}, {"name": "Wanli Xing"}, {"name": "My T. Thai"}], "author_count": 5}, {"id": "2611.06645", "category": "quant-ph", "title": "Precision Limits and Non-Gaussian Advantage in Optical Phase Estimation under Preparation Constraints", "abstract": "In optical quantum metrology, the scaling of the quantum Fisher information (QFI) with the mean photon number is a standard benchmark for relating precision to probe resources. For phase estimation, Heisenberg scaling corresponds to a quadratic growth of the QFI with the mean photon number, which Gaussian probes can approach. Interestingly, certain non-Gaussian probes can exhibit arbitrarily large QFI even at fixed mean photon number. Here, we clarify the resource requirements underlying this behavior by introducing a constraint that separates physically admissible states from inadmissible ones: an envelope on the photon-number distribution that arises naturally from the physical limitations of state-generation methods. Building on this constraint and considering pure single-mode probes, we define a resource quantity, $N_\\mathrm{RMS}$, fixed by the preparation constraints, and derive a finite bound on the QFI whose Heisenberg scaling is attainable. We identify a genuine metrological advantage of non-Gaussian states over Gaussian probes subject to the same constraints. Finally, we illustrate these results with an optical preparation model based on a universal gate set.", "url": "https://arxiv.org/abs/2611.06645", "type": "理论", "summary": "在光学量子计量中，量子费希尔信息 (QFI) 与平均光子数的缩放是将精度与探针资源相关联的标准基准。对于相位估计，海森堡缩放对应于 QFI 与平均光子数的二次增长，高斯探针可以接近这一点。有趣的是，某些非高斯探针即使在平均光子数固定的情况下也可以表现出任意大的 QFI。在这里，我们通过引入一个约束来阐明这种行为背后的资源需求，该约束将物理上可接受的状态与不可接受的状态分开：光子数分布的包络，它是由状态生成方法的物理限制自然产生的。在此约束的基础上并考虑纯单模探头，我们定义了一个资源量 $N_\\mathrm{RMS}$，由准备约束固定，并推导出 QFI 上的有限界限，其海森堡缩放是可实现的。我们发现，在相同约束下，非高斯态相对于高斯探针具有真正的计量优势。最后，我们用基于通用门组的光学制备模型来说明这些结果。", "authors": [{"name": "Víctor Izquierdo"}, {"name": "Javier Lalueza-Puértolas"}], "featured_authors": [{"name": "Víctor Izquierdo"}, {"name": "Javier Lalueza-Puértolas"}], "author_count": 2}, {"id": "2611.06651", "category": "quant-ph", "title": "Efficient quantum ultraspherical transform and a well-conditioned quantum spectral method", "abstract": "Solving differential equations is a promising application of quantum computing. Spectral methods, where the solution is represented by coefficients in a basis, are particularly well suited to quantum solvers because their structured discretizations can enable efficient linear-algebra operations while providing rapid convergence. Their quantum implementation, however, requires an efficient transform between amplitudes encoding function values and amplitudes encoding expansion coefficients. This work develops two key components of a quantum spectral method. First, we construct the quantum ultraspherical transform (QUT) for orthonormal ultraspherical polynomials, a basis that supports sparse and well-conditioned discretizations of differential equations. For the basis parameters $m=0$ and $1$, this transform reduces to the discrete cosine and sine transforms with known efficient circuits. Our contribution covers every fixed integer $m\\geq2$: for dimensions $N$ with $N+m=2^n$, where $n$ is the number of qubits, the QUT achieves error at most $\\varepsilon$ using a gate count polynomial in $n$ and $\\log(1/\\varepsilon)$. The construction builds on the quantum Fourier transform, augmented by approximations whose accuracy guarantees are independent of $N$. Second, we develop a quantum spectral solver for regular linear ordinary differential equations based on the QUT. Under suitable boundary conditions and data-access assumptions, preconditioning keeps condition numbers bounded independently of the basis size, allowing the solution state to be prepared at polylogarithmic cost in system size and inverse error. Together, these contributions provide a framework for quantum spectral methods with the potential to solve linear differential equations efficiently.", "url": "https://arxiv.org/abs/2611.06651", "type": "理论+数值", "summary": "求解微分方程是量子计算的一个有前景的应用。谱方法的解由基中的系数表示，特别适合量子求解器，因为它们的结构化离散化可以实现高效的线性代数运算，同时提供快速收敛。然而，它们的量子实现需要幅度编码函数值和幅度编码展开系数之间的有效变换。这项工作开发了量子光谱方法的两个关键组成部分。首先，我们为正交超球多项式构造量子超球变换（QUT），这是支持微分方程的稀疏且条件良好的离散化的基础。对于基本参数 $m=0$ 和 $1$，该变换通过已知的高效电路简化为离散余弦和正弦变换。我们的贡献涵盖了每个固定整数 $m\\geq2$：对于维度 $N$ 和 $N+m=2^n$，其中 $n$ 是量子位的数量，QUT 使用 $n$ 和 $\\log(1/\\varepsilon)$ 中的门计数多项式最多实现 $\\varepsilon$ 错误。\n\n该结构建立在量子傅立叶变换的基础上，并通过近似值进行增强，其精度保证与 $N$ 无关。其次，我们开发了一种基于 QUT 的常规线性常微分方程的量子谱求解器。在适当的边界条件和数据访问假设下，预处理使条件数保持独立于基础大小的界限，从而允许以系统大小和逆误差的多对数成本准备解状态。这些贡献共同为量子光谱方法提供了一个框架，具有有效求解线性微分方程的潜力。", "authors": [{"name": "Trong Duong"}, {"name": "Norbert Hosters"}], "featured_authors": [{"name": "Trong Duong"}, {"name": "Norbert Hosters"}], "author_count": 2}, {"id": "2611.06698", "category": "quant-ph", "title": "QASPA-MaxCut on Unweighted Graphs: Edge Encoding and QAOA Restarts", "abstract": "Max-Cut is a common testbed for near-term quantum optimization because it has a simple Ising Hamiltonian, established classical baselines, and a parameterized quantum circuit whose performance depends on the outer classical optimizer. This paper develops QASPA-MaxCut, a shift-phase circuit for Max-Cut that encodes graph edges through controlled $R_y$ rotations of the form $\\mathrm{CX}_{ij}R_y(\\theta_{ij})\\mathrm{CX}_{ij}$. We derive the exact two-qubit algebra of the edge block, trace an unweighted four-vertex example, and compare one-layer QASPA-MaxCut with depth-one QAOA by exact state-vector simulation. The protocol uses seed 42, evaluates connected backbone-augmented random graphs with additional-edge probabilities $p_{\\mathrm{edge}}\\in\\{0.1,0.3,0.5,0.7\\}$, and adds nineteen custom unweighted topologies. The QASPA-MaxCut score is reported after the algorithm's classical selection stage: the four leading QASPA bit strings are evaluated by the Max-Cut objective, and the best cut is retained. The QAOA score is the expected approximation ratio after local optimization, reported as a best-of-$k$ curve over one to ten restarts. In these small exact simulations, fixed-angle QASPA-MaxCut produces reported group-mean selection ratios between $0.955$ and $1.000$, the topology-level readout is unchanged in the retained finite-shot checks under the rule $\\lceil 0.03047\\cdot 2^n+1016.2\\rceil$, and depth-one QAOA improves with additional classical restarts while remaining lower than the QASPA selection score in the reported mean summaries. This comparison motivates further study of the classical search budget needed to obtain competitive Max-Cut samples at shallow circuit depth.", "url": "https://arxiv.org/abs/2611.06698", "type": "理论+数值", "summary": "Max-Cut 是近期量子优化的常见测试平台，因为它具有简单的伊辛哈密顿量、已建立的经典基线以及性能取决于外部经典优化器的参数化量子电路。本文开发了 QASPA-MaxCut，这是一种用于 Max-Cut 的移相电路，通过 $\\mathrm{CX}_{ij}R_y(\\theta_{ij})\\mathrm{CX}_{ij}$ 形式的受控 $R_y$ 旋转对图边缘进行编码。我们推导了边缘块的精确两量子位代数，跟踪未加权的四顶点示例，并通过精确的状态向量模拟将一层 QASPA-MaxCut 与深度一 QAOA 进行比较。该协议使用种子 42，使用附加边概率 $p_{\\mathrm{edge}}\\in\\{0.1,0.3,0.5,0.7\\}$ 评估连接的骨干增强随机图，并添加 19 个自定义未加权拓扑。 QASPA-MaxCut 分数在算法的经典选择阶段之后报告：通过 Max-Cut 目标评估四个领先的 QASPA 位串，并保留最佳切割。 QAOA 分数是局部优化后的预期近似比率，报告为一到十次重新启动后的最佳 $k$ 曲线。\n\n在这些小型精确模拟中，固定角度 QASPA-MaxCut 生成介于 $0.955$ 和 $1.000$ 之间的报告组平均选择比，在规则 $\\lceil 0.03047\\cdot 2^n+1016.2\\rceil$ 下保留的有限射击检查中，拓扑级读数保持不变，并且深度一 QAOA 通过额外的经典重新启动而得到改善，同时保持低于 QASPA 选择分数报告的平均摘要。这种比较激发了对在浅电路深度获得有竞争力的最大切割样本所需的经典搜索预算的进一步研究。", "authors": [{"name": "Dmytro Sapozhnyk"}], "featured_authors": [{"name": "Dmytro Sapozhnyk"}], "author_count": 1}, {"id": "2611.06712", "category": "quant-ph", "title": "Phase-Locked Quantum Battery Charging via Dissipative Mode Selection", "abstract": "We investigate how dynamical instability and reservoir engineering can be harnessed to enhance the quality of quantum-battery charging in a bosonic two-mode system. We show that reservoir-engineered dissipative coupling selectively amplifies a single unstable quasi-dark mode, enabling phase-locked exponential charging at a reduced gain threshold, whereas coherent coupling can amplify two frequency-split unstable modes, resulting in persistent beating. This dissipative mode selection yields a near-unit ergotropy fraction and a substantially higher work-like signal-to-noise ratio (SNR), defined as ergotropy divided by the standard deviation of battery energy. Although optimizing the driving frequency enables coherent coupling to achieve faster charging and higher ergotropy power, dissipative coupling retains its advantage in the work-like SNR. An exact finite-time source-noise relation reveals that this advantage arises from a more constructive accumulation of coherent driving relative to incoherent fluctuations. Our results establish dissipative mode selection as a promising route to high-quality quantum-battery charging.", "url": "https://arxiv.org/abs/2611.06712", "type": "数值", "summary": "我们研究如何利用动态不稳定性和储层工程来提高玻色子双模系统中量子电池充电的质量。我们表明，储层工程耗散耦合有选择地放大单个不稳定的准暗模式，从而能够在降低的增益阈值下实现锁相指数充电，而相干耦合可以放大两个分频不稳定模式，从而导致持续跳动。这种耗散模式选择产生接近单位的各向异性分数和显着更高的类似工作的信噪比 (SNR)，定义为各向异性除以电池能量的标准差。虽然优化驱动频率可以使相干耦合实现更快的充电和更高的各向功率，但耗散耦合在类似工作的信噪比方面保留了其优势。精确的有限时间源噪声关系表明，这种优势来自于相干驱动相对于非相干波动更具建设性的积累。我们的研究结果表明，耗散模式选择是实现高质量量子电池充电的一条有前途的途径。", "authors": [{"name": "Borhan Ahmadi"}, {"name": "Lei Du"}, {"name": "André H. A. Malavazi"}, {"name": "Shabir Barzanjeh"}, {"name": "Adam Miranowicz"}, {"name": "Paweł Horodecki"}], "featured_authors": [{"name": "Borhan Ahmadi"}, {"name": "Lei Du"}, {"name": "André H. A. Malavazi"}, {"name": "Shabir Barzanjeh"}, {"name": "Adam Miranowicz"}, {"name": "Paweł Horodecki"}], "author_count": 6}, {"id": "2611.06751", "category": "quant-ph", "title": "A Quantum Lower Bound for Triangle Finding", "abstract": "Triangle finding is a fundamental problem in graph theory that has played a central role in the development of quantum algorithmic techniques. For $N$-vertex graphs given by their adjacency matrices, a long line of work has improved the quantum query upper bound from $O(N^{3/2})$ to $O(N^{5/4})$. However, the best known lower bound has remained the elementary $\\Omega(N)$ bound obtained from unstructured search. We prove the first superlinear quantum query lower bound for triangle finding, showing that $\\Omega(N^{13/12})$ queries are necessary. Our result also implies the same lower bound for triangle detection and for detecting every fixed connected non-bipartite graph. The proof builds on the compressed oracle approach of Zhandry and the transfer approaches of Belovs. It compares the computation on graphs with a planted triangle to the computation on random graphs conditioned to be triangle-free, through a map on the input registers that almost commutes with every query. We average over local changes to the input while preserving its distribution, through a procedure known as conditional resampling. Our main technical contribution is a set of estimates that let us control the query error under this averaging, despite the dependence introduced by conditioning a dense graph to be triangle-free.", "url": "https://arxiv.org/abs/2611.06751", "type": "理论+数值", "summary": "三角形查找是图论中的一个基本问题，在量子算法技术的发展中发挥了核心作用。对于由邻接矩阵给出的 $N$ 顶点图，大量工作已将量子查询上限从 $O(N^{3/2})$ 改进为 $O(N^{5/4})$。然而，最著名的下界仍然是从非结构化搜索中获得的基本 $\\Omega(N)$ 界。我们证明了三角形查找的第一个超线性量子查询下界，表明 $\\Omega(N^{13/12})$ 查询是必要的。我们的结果还意味着三角形检测和检测每个固定连接的非二分图具有相同的下限。该证明建立在 Zhandry 的压缩预言方法和 Belovs 的传输方法的基础上。它将带有植入三角形的图的计算与条件为无三角形的随机图的计算进行比较，通过输入寄存器上的映射，该映射几乎与每个查询进行交换。我们通过称为条件重采样的过程对输入的局部变化进行平均，同时保留其分布。\n\n我们的主要技术贡献是一组估计，使我们能够控制在此平均下的查询误差，尽管通过将密集图调节为无三角形而引入了依赖性。", "authors": [{"name": "Arjan Cornelissen"}, {"name": "Amin Shiraz Gilani"}, {"name": "Xingyu Zhou"}], "featured_authors": [{"name": "Arjan Cornelissen"}, {"name": "Amin Shiraz Gilani"}, {"name": "Xingyu Zhou"}], "author_count": 3}, {"id": "2611.06771", "category": "quant-ph", "title": "Non-compact Kogut-Susskind gauge theories: 1D lattice models with exact ${\\rm SL}(2,\\mathbb{R})$ gauge invariance", "abstract": "The Kogut-Susskind (KS) formulation of gauge theories constructs quantum many-body Hamiltonians with gauge invariance under a compact Lie group exactly implemented on a spatial lattice. Here, we revisit this construction for a non-compact gauge group. Although motivated in part by theories like general relativity whose first-order formulation involves the non-compact Lorentz group as a local symmetry, we focus on simpler cases in one spatial dimension akin to the Schwinger model. In a bottom-up approach, we show how exact gauge invariance under the simplest non-compact Lie group ${\\rm SL}(2,\\mathbb{R})$ can be retained exactly on a 1D lattice, and highlight the differences that arise with respect to compact gauge groups, including a continuous spectrum of the Casimir operators of the gauge fields and the emergence of infinite-dimensional representations of the matter fields. For the pure gauge theory, we discuss how a consistent restriction to the positive semigroup ${\\rm SL}^{+}(2,\\mathbb{R})$ reproduces well-known results from the quantization of Jackiw-Teitelboim (JT) gravity. Motivated by the constraint structure of general dilaton gravity, we introduce static charges coupled to the non-compact gauge field, which can be realised by single-fermion degrees of freedom living in an additional, synthetic dimension. With static charges our lattice model remains exactly integrable, but when extending to dynamical fermionic matter, we arrive at an interacting 1D ${\\rm SL}(2,\\mathbb{R})$ KS gauge theory. We give an interpretation of this model as a chain of charges sequentially connected by strings whose tension pulls matter left or right depending on the sign of the relative continuous ${\\rm SL}(2,\\mathbb{R})$ fluxes. This picture becomes exact when the involved ${\\rm SL}(2,\\mathbb{R})$ charges are strongly self-interacting, where we solve the reduced two-body problem analytically.", "url": "https://arxiv.org/abs/2611.06771", "type": "理论", "summary": "规范理论的 Kogut-Susskind (KS) 公式在空间晶格上精确实现的紧致李群下构造了具有规范不变性的量子多体哈密顿量。在这里，我们重新审视非紧凑仪表组的这种结构。尽管部分受到广义相对论等理论的推动，广义相对论的一阶公式涉及作为局部对称性的非紧洛伦兹群，但我们关注的是类似于施温格模型的一个空间维度中的更简单的情况。在自下而上的方法中，我们展示了如何在一维晶格上精确保留最简单的非紧李群 ${\\rm SL}(2,\\mathbb{R})$ 下的精确规范不变性，并强调与紧规范群相关的差异，包括规范场的卡西米尔算子的连续谱和物质场的无限维表示的出现。对于纯规范理论，我们讨论对正半群 ${\\rm SL}^{+}(2,\\mathbb{R})$ 的一致限制如何重现 Jackiw-Teitelboim (JT) 引力量子化的众所周知的结果。\n\n受一般膨胀引力约束结构的启发，我们引入了与非紧规范场耦合的静电荷，这可以通过生活在附加合成维度中的单费米自由度来实现。对于静电荷，我们的晶格模型仍然是完全可积的，但是当扩展到动态费米子物质时，我们得到了相互作用的一维${\\rm SL}(2,\\mathbb{R})$ KS规范理论。我们将此模型解释为由弦顺序连接的电荷链，弦的张力将物质向左或向右拉，具体取决于相对连续的 ${\\rm SL}(2,\\mathbb{R})$ 通量的符号。当涉及的 ${\\rm SL}(2,\\mathbb{R})$ 电荷具有强自相互作用时，这张图就变得精确，我们通过分析方法解决了简化的二体问题。", "authors": [{"name": "Carlos Fulgado-Claudio"}, {"name": "Torsten V. Zache"}], "featured_authors": [{"name": "Carlos Fulgado-Claudio"}, {"name": "Torsten V. Zache"}], "author_count": 2}, {"id": "2611.06774", "category": "quant-ph", "title": "Entanglement Entropy in Non Relativistic Collisions", "abstract": "We study numerically the build-up of entanglement entropy between two colliding, non relativistic particles, that are driven by the plain Schrödinger equation containing local, finite range potentials, and whose initial state is the product of two independent wave packets. Different situations are considered, ranging from a tunnel and mirror effect at low energy in front of a barrier, to higher energies, and also attraction rather than repulsion. While the calculated wave functions and density matrices significantly depend on the physical situations described by our models, the build-up trends and values in time of entanglement entropy look surprisingly alike one another.", "url": "https://arxiv.org/abs/2611.06774", "type": "理论+数值", "summary": "我们以数值方式研究两个碰撞的非相对论粒子之间纠缠熵的形成，这些粒子由包含局部有限范围势的简单薛定谔方程驱动，其初始状态是两个独立波包的乘积。考虑了不同的情况，从障碍物前面低能量的隧道和镜子效应到更高的能量，以及吸引而不是排斥。虽然计算的波函数和密度矩阵在很大程度上取决于我们的模型描述的物理情况，但纠缠熵时间的累积趋势和值看起来惊人地相似。", "authors": [{"name": "Bertrand Giraud"}, {"name": "Robi Peschanski"}], "featured_authors": [{"name": "Bertrand Giraud"}, {"name": "Robi Peschanski"}], "author_count": 2}, {"id": "2611.06797", "category": "quant-ph", "title": "Resource-efficient formulations of the Knapsack problem for quantum computing", "abstract": "Quantum computing has emerged as a new tool for solving combinatorial optimization problems. Quantum optimization approaches usually operate on the subclass of Quadratic Unconstrained Binary Optimization (QUBO) problems. Many optimization problems can be reformulated in this form, though there are often multiple ways to do so. The choice of formulation can considerably affect the performance of QUBO solvers in practice. In this work, we study QUBO formulations of the Knapsack problem, a canonical example of a problem with inequality constraints. In the standard formulation these constraints are converted into penalty terms, which requires additional slack variables. Here, we investigate three more resource-efficient approaches for formulating the Knapsack as a QUBO. The first two modify the standard formulation, either by deriving a smaller penalty constant or by reducing the number of slack variables. The third approach is a wholly different method, which avoids the use of slack variables entirely. All three approaches increase the probability of finding the optimal solution, both in simulations of the linear ramp Quantum Approximate Optimization Algorithm (LR-QAOA) and on a D-Wave quantum annealer. The slackless method performs best, increasing success probabilities by several orders of magnitude even for relatively small problem sizes.", "url": "https://arxiv.org/abs/2611.06797", "type": "数值", "summary": "量子计算已成为解决组合优化问题的新工具。量子优化方法通常适用于二次无约束二元优化 (QUBO) 问题的子类。许多优化问题都可以用这种形式重新表述，尽管通常有多种方法可以做到这一点。公式的选择会极大地影响 QUBO 求解器在实践中的性能。在这项工作中，我们研究背包问题的 QUBO 公式，这是具有不等式约束的问题的典型示例。在标准公式中，这些约束被转换为惩罚项，这需要额外的松弛变量。在这里，我们研究了三种更节省资源的方法，将背包设计为 QUBO。前两个通过导出较小的惩罚常数或减少松弛变量的数量来修改标准公式。第三种方法是一种完全不同的方法，它完全避免使用松弛变量。\n\n所有这三种方法都增加了在线性斜坡量子近似优化算法 (LR-QAOA) 的模拟和 D-Wave 量子退火器上找到最佳解决方案的概率。无松弛方法表现最佳，即使对于相对较小的问题规模，也能将成功概率提高几个数量级。", "authors": [{"name": "Pim van den Heuvel"}, {"name": "Vrinda Mehta"}, {"name": "Dennis Willsch"}, {"name": "J. A. Montanez-Barrera"}, {"name": "Kristel Michielsen"}], "featured_authors": [{"name": "Pim van den Heuvel"}, {"name": "Vrinda Mehta"}, {"name": "Dennis Willsch"}, {"name": "J. A. Montanez-Barrera"}, {"name": "Kristel Michielsen"}], "author_count": 5}, {"id": "2611.06809", "category": "quant-ph", "title": "Finite-temperature transition-window weights on a fault-tolerant quantum computer: duplex filtering on a thermal purification", "abstract": "The excite-filter-readout framework of Kharazi et al. computes zero-temperature response windows on a fault-tolerant quantum computer from a pure ground state. We extend it to Gibbs states, where the two objects decouple: filters act on absolute energies, a thermal response on transition frequencies. The extension rests on a Liouville-space/TFD identity, explicit in the block-encoding/QSP setting: the thermally weighted transition-window weight is a spectral projection of H_0 (x) I - I (x) H_0^T onto the Schmidt (thermofield-double) purification, instance of Rall's framework. Around it we assemble a routed-SELECT block encoding (one Hamiltonian query per filter query), a conjugate-pair readout, and a four-route (duplex, bin, Fourier-LCU, METTS) compatibility analysis. The cost is multiplicative and conditional: a per-window query bound M_\"AE\" * (2*sqrt(d/Z_\"lb\")*d_\"vt\" + 4*d_W), with a tight signal-adaptive count, the optimal sqrt(alpha beta) degree, and a window-edge term. The preparation factor sqrt(d/Z) grows exponentially with system size at fixed temperature in positive-entropy-density systems (2.08 -> 25.7, N = 8 to 14 at beta = 2), relieved only as beta -> 0. Zero temperature is recovered for beta G >= ln(2(d-1)||D||^2/epsilon). Identities are cross-checked between independent formula paths to 10^(-16)-10^(-12) and the readout assembly is validated at matrix level under a block-encoding promise.", "url": "https://arxiv.org/abs/2611.06809", "type": "理论", "summary": "Kharazi 等人的激励过滤器读出框架。从纯基态计算容错量子计算机上的零温度响应窗口。我们将其扩展到吉布斯状态，其中两个物体解耦：滤波器作用于绝对能量，热响应作用于过渡频率。该扩展基于刘维尔空间/TFD 恒等式，在块编码/QSP 设置中明确：热加权过渡窗口权重是 H_0 (x) I - I (x) H_0^T 到施密特（热场双）纯化（Rall 框架的实例）上的光谱投影。围绕它，我们组装了一个路由选择块编码（每个过滤器查询一个哈密顿查询）、一个共轭对读出和一个四路由（双工、bin、Fourier-LCU、METTS）兼容性分析。成本是乘法和有条件的：每个窗口查询边界 M_\"AE\" * (2*sqrt(d/Z_\"lb\")*d_\"vt\" + 4*d_W)，具有严格的信号自适应计数、最佳 sqrt(alpha beta) 度和窗口边缘项。在正熵密度系统中，制备因子 sqrt(d/Z) 在固定温度下随系统尺寸呈指数增长（2.08 -> 25.7，N = 8 至 14，beta = 2），仅当 beta -> 0 时缓解。\n\nbeta G >= ln(2(d-1)||D||^2/epsilon) 时恢复零温度。身份在 10^(-16)-10^(-12) 的独立公式路径之间进行交叉检查，并且读出组件在块编码承诺下在矩阵级别进行验证。", "authors": [{"name": "Yujin Tang"}, {"name": "Yunlong Liu"}, {"name": "Miao Xu"}, {"name": "Qing-Xing Xie"}], "featured_authors": [{"name": "Yujin Tang"}, {"name": "Yunlong Liu"}, {"name": "Miao Xu"}, {"name": "Qing-Xing Xie"}], "author_count": 4}, {"id": "2611.06823", "category": "quant-ph", "title": "Optimal Holding Times for Entanglement Swapping", "abstract": "We revisit the optimization of entanglement holding times in memory-based quantum repeaters for maximizing entanglement swapping throughput under different fidelity constraints - strict, probabilistic, and mean. We consider two heterogeneous quantum links that are equipped with single or multiple memories and differ in decoherence rates, memory capacities, entanglement attempt rates and success probabilities, as well as classical communication latencies. Efficient models are developed to estimate the expected entanglement throughput and the probability density functions of the conditional wait time to swap. The models are then used to satisfy different fidelity requirements by optimizing the maximum holding times for the two links. Finally, our proposed model and approach are validated with a discrete-event quantum network simulator.", "url": "https://arxiv.org/abs/2611.06823", "type": "理论+数值", "summary": "我们重新审视基于内存的量子中继器中纠缠保持时间的优化，以在不同保真度约束（严格、概率和平均）下最大化纠缠交换吞吐量。我们考虑两种异构量子链路，它们配备有单个或多个存储器，并且在退相干率、存储器容量、纠缠尝试率和成功概率以及经典通信延迟方面有所不同。开发了有效的模型来估计预期的纠缠吞吐量和条件等待交换时间的概率密度函数。然后，通过优化两个链路的最大保持时间，使用该模型来满足不同的保真度要求。最后，我们提出的模型和方法通过离散事件量子网络模拟器进行了验证。", "authors": [{"name": "Van Sy Mai"}, {"name": "Richard J. La"}, {"name": "Abdella Battou"}], "featured_authors": [{"name": "Van Sy Mai"}, {"name": "Richard J. La"}, {"name": "Abdella Battou"}], "author_count": 3}, {"id": "2611.06909", "category": "quant-ph", "title": "Arithmetic Depth, Minimal Gate Alphabets, and Exact Program-State Resources for Single-Qubit Dyadic Programs", "abstract": "Resource analyses for quantum programs commonly provide safe upper bounds on qubits, gates, or non-Clifford operations. We study a single-qubit dyadic fragment in which the deepest exact resource layer can instead be inferred exactly. Starting from the normalized-midpoint misty-state syntax, we define dyadic program states and the real cyclotomic tower $K_D=\\mathbb Q(2\\cos(\\pi/2^D))$. For the projective single-qubit Clifford-cyclotomic tower $\\widehat G_D\\subseteq SO(3)$, we prove the relative intersection law $\\widehat G_D\\cap SO(3,K_d)=\\widehat G_d$ for $d\\le D$. Combining this descent theorem with an arithmetic-closure invariant for adaptive stabilizer processing yields $\\mathrm{Fdepth}(U)=\\mathrm{Adepth}(U)=\\mathrm{Rdepth}(U)$: the smallest real cyclotomic field containing the Bloch matrix of an exactly synthesizable channel, the shallowest dyadic gate alphabet realizing it up to global phase, and the shallowest dyadic program-state layer sufficient for exact stabilizer-assisted implementation coincide. At that common minimum, known fixed-alphabet synthesis gives minimum primitive-rotation count. We package the result as an exact static resource effect and outline a certificate-producing compiler.", "url": "https://arxiv.org/abs/2611.06909", "type": "理论", "summary": "量子程序的资源分析通常提供量子位、门或非 Clifford 操作的安全上限。我们研究了一个单量子位二元片段，其中最深的精确资源层可以被精确推断。从归一化中点迷雾状态语法开始，我们定义二元程序状态和真正的分圆塔$K_D=\\mathbb Q(2\\cos(\\pi/2^D))$。对于射影单量子位 Clifford 分圆塔 $\\widehat G_D\\subseteq SO(3)$，我们证明了 $d\\le D$ 的相对交集律 $\\widehat G_D\\cap SO(3,K_d)=\\widehat G_d$。将此下降定理与自适应稳定器处理的算术闭包不变量相结合，得到$\\mathrm{F深度}(U)=\\mathrm{A深度}(U)=\\mathrm{R深度}(U)$：包含精确可合成通道的布洛赫矩阵的最小实分圆域，将其实现到全局阶段的最浅二进门字母表，以及足以精确合成通道的最浅二进程序状态层稳定器辅助实施重合。在该共同最小值下，已知的固定字母合成给出了最小的基元旋转计数。\n\n我们将结果打包为精确的静态资源效果，并概述了一个生成证书的编译器。", "authors": [{"name": "Tony Newton"}, {"name": "Dan-Adrian German"}], "featured_authors": [{"name": "Tony Newton"}, {"name": "Dan-Adrian German"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
