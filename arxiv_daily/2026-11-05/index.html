onstrate that generic $n$-point functions of spectrally-flowed vertex operators at tree level can be rewritten in terms of an $(n+1)$-point function of $n$ unflowed vertex operators and one degenerate insertion. This is to be interpreted as an unflowed $n$-point function in an instanton background. Moreover, we conjecture that this $(n+1)$-point function can be recast as an $n$-point function of unflowed operators and we provide evidence for this. We demonstrate that the $(n+1)$-point function satisfies the same constraints from global spacetime conformal invariance as does an unflowed $n$-point function for a specific choice of spacetime coordinates that we determine. We verify that our results agree with bootstrap results in the literature. This provides the next step towards fully solving the $SL(2,\\mathbb{R})$ WZW model.", "url": "https://arxiv.org/abs/2611.06295", "type": "理论", "summary": "我们重新审视一个旧的想法，即 WZW 模型中的谱流可以与世界表上的某些 $G$-bundles 相关联。这使我们能够引入一种新颖的方法，通过系统地计算线缺陷网络的贡献，来计算具有组 $G$ 和级别 $k$ 的 WZW 模型中谱流顶点算子的相关器。专门针对 $G=SL(2, \\mathbb{R})$ 的情况，与 AdS$_3$ 弦理论相关，我们证明了树级别谱流顶点算子的通用 $n$ 点函数可以重写为 $n$ 非流顶点算子的 $(n+1)$ 点函数和一个简并插入。这将被解释为瞬子背景中不流动的 $n$ 点函数。此外，我们推测这个 $(n+1)$ 点函数可以被重写为不流动运算符的 $n$ 点函数，并且我们为此提供了证据。我们证明 $(n+1)$ 点函数满足全局时空保形不变性的相同约束，与我们确定的特定时空坐标选择的未流动 $n$ 点函数一样。我们验证我们的结果与文献中的引导结果一致。\n\n这为完全求解 $SL(2,\\mathbb{R})$ WZW 模型提供了下一步。", "authors": [{"name": "Nathan McStay"}, {"name": "Ronald Reid-Edwards"}, {"name": "Sean Seet"}], "featured_authors": [{"name": "Nathan McStay"}, {"name": "Ronald Reid-Edwards"}, {"name": "Sean Seet"}], "author_count": 3}, {"id": "2611.06411", "category": "hep-th", "title": "A dynamical Einstein-Proca-dilaton holographic model and exotic hybrid meson resonances", "abstract": "A fully dynamical Einstein-Proca-dilaton (EPD) holographic model is developed for the exotic $J^{PC}=1^{-+}$ hybrid meson, incorporating the backreaction of the massive vector field dual to the hybrid current in the bulk. Solving the coupled EPD system yields a self-consistent gravitational background and the mass spectrum of hybrid resonances. While the soft-wall limit reproduces linear Regge behavior, the inclusion of backreaction yields quantitative shifts that improve agreement with experimental candidates. The finite-temperature regime is approached by studying black hole thermodynamics and spectral functions across the confinement-deconfinement transition, fixing the Hawking-Page temperature to $T_c \\sim 150 \\, \\mathrm{MeV}$. Unlike non-backreacted AdS/QCD models, the dynamical background predicts a strong suppression of hybrid states already near the onset of deconfinement. These results demonstrate that gravitational backreaction has measurable consequences for both vacuum spectroscopy and in-medium properties of exotic hybrid mesons, emphasizing the relevance of a dynamical self-consistent approach in AdS/QCD.", "url": "https://arxiv.org/abs/2611.06411", "type": "理论", "summary": "针对奇异的 $J^{PC}=1^{-+}$ 混合介子开发了完全动态的爱因斯坦-普罗卡膨胀 (EPD) 全息模型，其中结合了对偶于体中混合电流的巨大矢量场的反反应。求解耦合的 EPD 系统会产生自洽的引力背景和混合共振的质谱。虽然软壁极限再现了线性 Regge 行为，但包含逆反应会产生定量变化，从而提高与实验候选者的一致性。通过研究禁闭-解除禁闭转变过程中的黑洞热力学和谱函数，将霍金-佩奇温度固定为 $T_c \\sim 150 \\, \\mathrm{MeV}$ 来接近有限温度状态。与非反反应 AdS/QCD 模型不同，动态背景预测在解除限制开始时已经对混合态产生强烈抑制。这些结果表明，引力反反应对真空光谱和奇异混合介子的介质特性都有可测量的影响，强调了 AdS/QCD 中动态自洽方法的相关性。", "authors": [{"name": "Bruno Toniato"}, {"name": "David Dudal"}, {"name": "Hudson Almeida"}, {"name": "Roldao da Rocha"}], "featured_authors": [{"name": "Bruno Toniato"}, {"name": "David Dudal"}, {"name": "Hudson Almeida"}, {"name": "Roldao da Rocha"}], "author_count": 4}, {"id": "2611.06421", "category": "hep-th", "title": "Striped phases of N=4 SYM at finite density", "abstract": "We construct spatially modulated phases of strongly coupled $\\mathcal N=4$ supersymmetric Yang--Mills theory at finite $R$-charge density. Compactification on a three-torus and unequal background charges isolate an unstable charge-density mode. Its static threshold seeds a nonlinear branch of striped black branes in the STU model. The striped states have higher entropy than homogeneous states with the same energy and conserved charges. They connect continuously to the homogeneous branch, with an entropy excess that begins at fourth order in the modulation amplitude. These solutions provide a candidate endpoint of the charge-transport instability.", "url": "https://arxiv.org/abs/2611.06421", "type": "理论", "summary": "我们在有限的$R$电荷密度下构建了强耦合$\\mathcal N=4$超对称Yang-Mills理论的空间调制相。三环面和不等背景电荷的致密化隔离了不稳定的电荷密度模式。它的静态阈值在 STU 模型中播种了黑色条纹膜的非线性分支。条纹态比具有相同能量和守恒电荷的均匀态具有更高的熵。它们连续连接到同质分支，熵过剩从调制幅度的第四阶开始。这些解决方案提供了电荷传输不稳定性的候选终点。", "authors": [{"name": "Alex Buchel"}], "featured_authors": [{"name": "Alex Buchel"}], "author_count": 1}, {"id": "2611.06473", "category": "hep-th", "title": "Quasi-Normal Modes and thermalization in integrable Quantum Field Theories from the Thermodynamic Bethe Ansatz", "abstract": "We propose a Thermodynamic Bethe Ansatz (TBA) approach for describing thermalization in integrable quantum field theories. The exponential damping and oscillations when approaching thermal equilibrium can be understood as the analogs of quasi-normal mode (QNM) frequencies of black hole perturbations within the framework of holography. Holographic intuitions and some general properties of thermal Green's functions motivate the existence of such a TBA formulation, as well as lead to the imposition of a nonstandard analytical structure on the QNM TBA, while comparison with integrable form-factor expansions fixes the remaining ingredients. We conjecture the QNM TBA to be equivalent to performing an all-order resummation of secular terms in a thermal form factor expansion of retarded 2-point correlation functions. We compare the predictions with tensor network simulations of the E8 deformation of Ising CFT at nonzero temperature. We conjecture that the QNM TBA framework should also be applicable for describing out-of-equilibrium approach to Generalized Hydrodynamics (GHD).", "url": "https://arxiv.org/abs/2611.06473", "type": "理论", "summary": "我们提出了一种热力学 Bethe Ansatz (TBA) 方法来描述可积量子场论中的热化。接近热平衡时的指数阻尼和振荡可以理解为全息框架内黑洞扰动的准正态模式（QNM）频率的模拟。全息直觉和热格林函数的一些一般性质激发了这种 TBA 公式的存在，并导致在 QNM TBA 上强加非标准分析结构，而与可积形状因子扩展的比较则修复了其余成分。我们推测 QNM TBA 相当于在延迟 2 点相关函数的热形状因子展开中执行长期项的全阶恢复。我们将预测结果与伊辛 CFT 在非零温度下 E8 变形的张量网络模拟进行了比较。我们推测 QNM TBA 框架也应该适用于描述广义流体动力学 (GHD) 的非平衡方法。", "authors": [{"name": "Zoltan Bajnok"}, {"name": "Romuald A. Janik"}], "featured_authors": [{"name": "Zoltan Bajnok"}, {"name": "Romuald A. Janik"}], "author_count": 2}, {"id": "2611.06507", "category": "hep-th", "title": "Higher Integrability, Generalized Symmetries, and Partially Topological Field Theories", "abstract": "We exhibit a classical link between higher Lax integrability and generalized symmetries in a non-Lorentzian higher semi-holomorphic Chern--Simons theory on $M\\times\\mathbb CP^1$. The equations of motion determine a spectrally dependent flat higher connection on $M$ whose Laurent coefficients organise an infinite hierarchy of conserved quantities. We construct a spectral family of classical $(d_M-2)$-form symmetry line defects associated with the Lax connection, establish an action-preserving deformation law, and exhibit suitable gauge-invariant probes on which the induced transformations act nontrivially.", "url": "https://arxiv.org/abs/2611.06507", "type": "理论", "summary": "我们在 $M\\times\\mathbb CP^1$ 上的非洛伦兹高级半全纯 Chern-Simons 理论中展示了较高 Lax 可积性和广义对称性之间的经典联系。运动方程确定了 $M$ 上的谱相关平坦更高连接，其洛朗系数组织了守恒量的无限层次结构。我们构建了与 Lax 连接相关的经典 $(d_M-2)$ 形式对称线缺陷的谱族，建立了作用保持变形定律，并展示了合适的规范不变探针，诱导变换在其上发挥着非平凡的作用。", "authors": [{"name": "Luigi Alfonsi"}, {"name": "Leron Borsten"}, {"name": "Mehran Jalali Farahani"}, {"name": "Hyungrok Kim"}, {"name": "Martin Wolf"}, {"name": "Charles A. S. Young"}], "featured_authors": [{"name": "Luigi Alfonsi"}, {"name": "Leron Borsten"}, {"name": "Mehran Jalali Farahani"}, {"name": "Hyungrok Kim"}, {"name": "Martin Wolf"}, {"name": "Charles A. S. Young"}], "author_count": 6}, {"id": "2611.06679", "category": "hep-th", "title": "Form Factors in AdS from the Worldsheet", "abstract": "We study AdS form factors describing closed strings scattering off D-branes. Assuming that these form factors admit worldsheet integral representations in terms of multiple polylogarithms, we determine their leading curvature corrections around the flat-space limit by matching their pole structure to CFT data. We focus on two examples of defects in 4d $\\mathcal{N}=4$ SYM: a $\\frac{1}{2}$-BPS 't Hooft loop, dual to a D1 brane, and a pair of giant gravitons, dual to a D3 brane. For the 't Hooft loop, the worldsheet bootstrap completely fixes the form factor, and the result passes nontrivial checks from supersymmetric localization. For the giant gravitons, the bootstrap initially leaves five free coefficients, one of which can be fixed using localization. Remarkably, imposing instead that no new operators appear in the defect channel at this order fixes all five coefficients and reproduces the localization constraint. Under this additional assumption, we therefore obtain a unique D3-brane form factor, with supersymmetric localization providing an independent check.", "url": "https://arxiv.org/abs/2611.06679", "type": "理论", "summary": "我们研究了描述 D 膜散射的闭合弦的 AdS 形状因子。假设这些形状因子允许以多个多对数表示世界表积分，我们通过将它们的极结构与 CFT 数据相匹配来确定它们在平坦空间限制周围的主要曲率修正。我们重点关注 4d $\\mathcal{N}=4$ SYM 中的两个缺陷示例：一个 $\\frac{1}{2}$-BPS 't Hooft 环，对偶于 D1 膜，以及一对巨型引力子，对偶于 D3 膜。对于 't Hooft 循环，世界表引导程序完全修复了形状因子，并且结果通过了超对称本地化的重要检查。对于巨引力子，引导程序最初留下五个自由系数，其中之一可以使用定位来固定。值得注意的是，改为不按此顺序在缺陷通道中出现新算子可以修复所有五个系数并重现定位约束。因此，在这个额外的假设下，我们获得了独特的 D3 膜形状因子，超对称定位提供了独立的检查。", "authors": [{"name": "Luis F. Alday"}, {"name": "Clément Virally"}, {"name": "Xinan Zhou"}], "featured_authors": [{"name": "Luis F. Alday"}, {"name": "Clément Virally"}, {"name": "Xinan Zhou"}], "author_count": 3}, {"id": "2611.06794", "category": "hep-th", "title": "5-brane webs and generalised symmetries", "abstract": "5-brane webs provide a powerful geometric description of five-dimensional quantum field theories, encoding data such as symmetries and dualities. Although the extraction of continuous 0-form symmetries from these systems is well understood, their higher-form symmetries have received less attention. We develop a microscopic prescription for determining 1-form symmetries directly from 5-brane webs. BPS Wilson lines are represented by configurations of D3-branes and $(p,q)$ strings, while their screening by local operators is realised through string junctions, Higgsing, and Hanany-Witten transitions. For webs without orientifold planes, this construction reproduces the Smith normal form prescription based on asymptotic 7-brane charges. We extend the analysis to webs containing O7- and O5- planes. For O7$^-$-planes, the resolved 7-brane charges can be incorporated into the Smith normal form, whereas for O7$^+$-planes we propose an effective charge prescription and test it in both Lagrangian and non-Lagrangian examples. For webs with O5-planes, configurations of half-D3-branes reproduce the centre symmetries of Spin gauge theories and their breaking by matter. Crucially, we find that the 1-form symmetry of an O5-plane system is not determined by asymptotic data alone, but can depend on the local structure of the brane configuration near the orientifold.", "url": "https://arxiv.org/abs/2611.06794", "type": "理论", "summary": "五膜网提供了五维量子场论的强大几何描述，编码对称性和对偶性等数据。尽管从这些系统中提取连续的 0 型对称性已被很好地理解，但它们的更高形式对称性受到的关注较少。我们开发了一种微观处方，用于直接从 5 膜网确定 1 型对称性。 BPS Wilson 线由 D3 膜和 $(p,q)$ 弦的配置表示，而本地算子的筛选是通过弦连接、Higgsing 和 Hanany-Witten 跃迁实现的。对于没有东方褶皱平面的网，该结构再现了基于渐近 7 膜电荷的史密斯范式处方。我们将分析扩展到包含 O7- 和 O5- 平面的腹板。对于 O7$^-$-平面，解析的 7 膜电荷可以合并到史密斯范式中，而对于 O7$^+$-平面，我们提出了有效的电荷处方，并在拉格朗日和非拉格朗日例子中对其进行了测试。对于具有 O5 平面的网，半 D3 膜的配置再现了自旋规范理论的中心对称性及其被物质的破坏。\n\n至关重要的是，我们发现 O5 平面系统的 1 型对称性并非仅由渐近数据决定，而是取决于东方褶皱附近膜构型的局部结构。", "authors": [{"name": "Mohammad Akhond"}, {"name": "Federico Carta"}, {"name": "Sung-Soo Kim"}, {"name": "Futoshi Yagi"}], "featured_authors": [{"name": "Mohammad Akhond"}, {"name": "Federico Carta"}, {"name": "Sung-Soo Kim"}, {"name": "Futoshi Yagi"}], "author_count": 4}, {"id": "2611.06810", "category": "hep-th", "title": "Exact Splitting of Amplitudes and One-Loop Integrands: A Classical Origin of Zeros", "abstract": "We introduce a recursion based on hidden zeros that reconstructs complete tree level scattering amplitudes and one-loop integrands at generic kinematics. The recursion takes a universal exact-splitting form: both tree amplitudes and one-loop surface integrands are expressed as sums of products of complete tree functions, with the chosen zero conditions manifest in every term. We establish this structure for cubic scalar theory, the nonlinear sigma model, and inverse string Kawai--Lewellen--Tye (KLT) functions. We derive the tree splitting formula from the equations of motion, showing that hidden zeros arise when the product of two currents solves the equations of motion, while corrections away from the zero reconstruct the full amplitude. We further show that inverse KLT is the unique extension of $\\mathrm{Tr}(\\phi^3)$ with higher-point non-derivative interactions that preserves hidden zeros.", "url": "https://arxiv.org/abs/2611.06810", "type": "理论", "summary": "我们引入了一种基于隐藏零点的递归，它可以在通用运动学上重建完整的树级散射幅度和单环被积函数。递归采用通用的精确分裂形式：树振幅和单环表面被积函数都表示为完整树函数的乘积之和，并且所选的零条件在每一项中都体现出来。我们为三次标量理论、非线性 sigma 模型和逆弦 Kawai--Lewellen--Tye (KLT) 函数建立了这种结构。我们从运动方程推导出树分裂公式，表明当两个电流的乘积求解运动方程时，会出现隐藏的零点，而远离零点的校正会重建完整的振幅。我们进一步证明逆 KLT 是 $\\mathrm{Tr}(\\phi^3)$ 的独特扩展，具有保留隐藏零的更高点非导数相互作用。", "authors": [{"name": "Yang Li"}, {"name": "Laurentiu Rodina"}, {"name": "Zhi-Zhen Wang"}], "featured_authors": [{"name": "Yang Li"}, {"name": "Laurentiu Rodina"}, {"name": "Zhi-Zhen Wang"}], "author_count": 3}, {"id": "2611.06842", "category": "hep-th", "title": "Anomaly effective actions for 4d $\\mathcal{N}=1$ superconformal field theories", "abstract": "We present a comprehensive analysis of the Wess-Zumino anomaly effective action of four-dimensional $\\mathcal{N}=1$ superconformal field theories in components. After reviewing the coset construction of the Wess-Zumino action in the presence of an unbroken subgroup, the gauging of the conformal algebra and the Wess-Zumino effective action for non-supersymmetric conformal field theories with a U(1) symmetry in two and four dimensions, we revisit the superconformal anomalies of $\\mathcal{N}=1$ conformal supergravity. Solving the Wess-Zumino consistency conditions we determine both the bosonic and fermionic superconformal anomalies in a two-parameter family of schemes, to quadratic order in the gravitino. Turning on a chiral compensator multiplet and identifying a local super-Poincaré subalgebra of the conformal supergravity algebra without gauge-fixing the coset symmetries, we employ the coset construction and the superconformal anomalies in order to evaluate the Wess-Zumino action for generic $\\mathcal{N}=1$ superconformal field theories coupled to conformal supergravity. By construction, this action reproduces the Weyl, R-symmetry, and S-supersymmetry coset anomalies, but its transformation under the unbroken Poincaré supersymmetry differs from the corresponding anomaly of the conformal supergravity functional. We show that there exists a local functional of the coset-invariant old-minimal fields that, when added to the Wess-Zumino action, results in a generalized Wess-Zumino action that reproduces all anomalies of the conformal supergravity functional. The same local functional enables us to determine the super-Weyl anomalies and the Wess-Zumino action of old-minimal supergravity, providing a component version of the known superspace Wess-Zumino action.", "url": "https://arxiv.org/abs/2611.06842", "type": "理论", "summary": "我们对四维 $\\mathcal{N}=1$ 超共形场论在分量中的 Wess-Zumino 异常有效作用进行了全面分析。在回顾了存在未破子群的情况下 Wess-Zumino 作用的陪集构造、共形代数的计量以及二维和四维 U(1) 对称性的非超对称共形场论的 Wess-Zumino 有效作用之后，我们重新审视了 $\\mathcal{N}=1$ 共形超引力的超共形异常。解决 Wess-Zumino 一致性条件，我们确定了双参数方案族中的玻色子和费米子超共形异常，以及引力子中的二次阶。打开手性补偿器多重态并识别共形超重力代数的局部超庞加莱子代数，无需规范固定陪集对称性，我们采用陪集构造和超共形异常来评估与共形超重力耦合的通用 $\\mathcal{N}=1$ 超共形场论的 Wess-Zumino 作用。\n\n通过构造，该作用再现了 Weyl、R 对称和 S 超对称陪集异常，但其在未破缺庞加莱超对称下的变换与共形超引力泛函的相应异常不同。我们证明存在陪集不变旧极小值场的局部泛函，当将其添加到 Wess-Zumino 作用时，会产生广义的 Wess-Zumino 作用，再现共形超重力泛函的所有异常。相同的局部泛函使我们能够确定超外尔异常和旧最小超重力的韦斯-祖米诺作用，提供已知超空间韦斯-祖米诺作用的组件版本。", "authors": [{"name": "Pantelis Panopoulos"}, {"name": "Ioannis Papadimitriou"}], "featured_authors": [{"name": "Pantelis Panopoulos"}, {"name": "Ioannis Papadimitriou"}], "author_count": 2}, {"id": "2611.06907", "category": "hep-th", "title": "Conformal field theory from automorphic forms on a quantum group", "abstract": "We reformulate two-dimensional conformal field theory (2d CFT) in the language of noncommutative geometry. To this end, we introduce automorphic forms for the von Neumann algebraic quantum group $\\mathrm{SL}^+_b(2,\\mathbb{R})$. A quantum measure space is a von Neumann algebra equipped with a weight. We study such spaces carrying a weight-preserving action of $\\mathrm{SL}^+_b(2,\\mathbb{R})$. We argue that every unitary bosonic 2d CFT with central charge $c=1+6(b+b^{-1})^2>1$ is equivalent to a quantum measure space with an action of $\\mathrm{SL}^+_b(2,\\mathbb{R})\\times\\mathrm{SL}^+_b(2,\\mathbb{R})$. In this dictionary, Virasoro primary operators are quantum automorphic forms and their scaling dimensions correspond to the spectrum of a quantum Laplace operator. The Virasoro crossing equations express associativity of multiplication on the quantum measure space. For compact theories, the algebra is a type III$_1$ factor. Liouville CFT is realized as $\\mathrm{SL}^+_b(2,\\mathbb{R})$ acting on itself by left and right translations. Virasoro boundary conditions correspond to quantum measure spaces with an action of a single copy of $\\mathrm{SL}^+_b(2,\\mathbb{R})$. When the boundary spectrum is discrete, these are noncommutative counterparts of compact hyperbolic surfaces. The formulation accommodates models both with and without extended chiral algebras. It bridges the Virasoro conformal bootstrap with categorical and von Neumann algebraic approaches to 2d CFT.", "url": "https://arxiv.org/abs/2611.06907", "type": "理论", "summary": "我们用非交换几何的语言重新表述了二维共形场论（2d CFT）。为此，我们引入冯诺依曼代数量子群 $\\mathrm{SL}^+_b(2,\\mathbb{R})$ 的自同构形式。量子测度空间是配备有权重的冯·诺依曼代数。我们研究这样的空间，其重量保持作用为$\\mathrm{SL}^+_b(2,\\mathbb{R})$。我们认为，每个具有中心电荷 $c=1+6(b+b^{-1})^2>1$ 的酉玻色子二维 CFT 等价于具有 $\\mathrm{SL}^+_b(2,\\mathbb{R})\\times\\mathrm{SL}^+_b(2,\\mathbb{R})$ 作用的量子测度空间。在这本词典中，Virasoro 主算子是量子自同构形式，它们的标度维度对应于量子拉普拉斯算子的谱。 Virasoro 交叉方程表达了量子测度空间上乘法的结合律。对于紧致理论，代数是 III$_1$ 类型因子。 Liouville CFT 被实现为 $\\mathrm{SL}^+_b(2,\\mathbb{R})$ 通过左右平移作用于自身。 Virasoro 边界条件对应于具有 $\\mathrm{SL}^+_b(2,\\mathbb{R})$ 单个副本作用的量子测度空间。\n\n当边界谱是离散的时，这些是紧双曲曲面的非交换对应物。该公式适用于具有和不具有扩展手性代数的模型。它将 Virasoro 保形引导程序与 2d CFT 的分类方法和冯诺依曼代数方法连接起来。", "authors": [{"name": "Dalimil Mazac"}], "featured_authors": [{"name": "Dalimil Mazac"}], "author_count": 1}, {"id": "2611.05490", "category": "math-ph", "title": "Representation theory and massive spectral zeta functions on spherical space forms", "abstract": "We study the spectral theory of the massive scalar kinetic operator on spherical space forms $\\Gamma \\backslash S^{3}$, where $\\Gamma$ is a finite subgroup of $\\mathrm{SO}(4)$ acting freely on $S^{3}$. Using the Peter-Weyl theorem and Molien series we compute the spectrum of the Laplace-Beltrami operator on $\\Gamma\\backslash S^3$ directly from representation theory, obtaining the eigenvalues and their multiplicities for all lens spaces $L(p,q)$ and for each ADE-class of finite subgroups of $\\mathrm{SU}(2)$, which includes homogeneous lens spaces, prism spaces and quotients by the binary tetrahedral, octahedral and icosahedral groups, the last also known as the Poincaré homology sphere. For homogeneous quotients by subgroups of even order, we construct the meromorphic continuation of the spectral zeta function of the massive kinetic operator and obtain the general zeta-regularized determinant in closed form. The determinant is expressed as a finite sum of polylogarithms, valid for all real mass, and depends on $\\Gamma$ only through its order and a finite set of parameters which we call twist coefficients fixed by the dimensions of the $\\Gamma$-invariant subspaces. As a complementary approach, we express the heat trace of the kinetic operator on spherical space forms in terms of Jacobi theta functions, whose modular properties relate the spectral zeta function to geometric data, the volume and closed geodesic lengths of $\\Gamma\\backslash S^3$. We find that the spectral zeta function admits a rapidly convergent expansion in the heavy mass sector in terms of modified Bessel functions, and provides an independent check on the determinant. This framework extends to quotients of higher-dimensional manifolds directly, which we outline for future work.", "url": "https://arxiv.org/abs/2611.05490", "type": "理论", "summary": "我们研究球面空间 $\\Gamma \\backslash S^{3}$ 上的大规模标量运动算子的谱理论，其中 $\\Gamma$ 是 $\\mathrm{SO}(4)$ 自由作用于 $S^{3}$ 的有限子群。使用 Peter-Weyl 定理和 Molien 级数，我们直接从表示论计算 $\\Gamma\\backslash S^3$ 上的 Laplace-Beltrami 算子的谱，获得所有透镜空间 $L(p,q)$ 和 $\\mathrm{SU}(2)$ 有限子群的每个 ADE 类的特征值及其重数，其中包括齐次透镜空间、棱镜空间和二元商四面体、八面体和二十面体群，最后一个也称为庞加莱同调球。对于偶次子群的齐次商，我们构造了大规模动力学算符的谱zeta函数的亚纯延拓，并获得了封闭形式的一般zeta正则化行列式。行列式表示为多对数的有限和，对所有实际质量都有效，并且仅通过其阶数和一组有限参数（我们称为由 $\\Gamma$ 不变子空间的维度固定的扭曲系数）来依赖于 $\\Gamma$。\n\n作为一种补充方法，我们用雅可比 theta 函数表达球空间形式上的动力学算子的热迹，其模属性将光谱 zeta 函数与几何数据、$\\Gamma\\backslash S^3$ 的体积和闭合测地线长度相关联。我们发现光谱 zeta 函数在修正贝塞尔函数方面允许重质量扇区的快速收敛展开，并提供对行列式的独立检查。该框架直接扩展到高维流形的商，我们为未来的工作概述了这一点。", "authors": [{"name": "Victoria Martin"}, {"name": "Allan Merino"}, {"name": "Rahul Poddar"}, {"name": "Simon Roby"}], "featured_authors": [{"name": "Victoria Martin"}, {"name": "Allan Merino"}, {"name": "Rahul Poddar"}, {"name": "Simon Roby"}], "author_count": 4}, {"id": "2611.05516", "category": "math-ph", "title": "Rough-to-frozen transition in non-integrable dimer models", "abstract": "The transition from rough to frozen phases in models of random surfaces is expected to be governed by the Pokrovsky-Talapov law, which predicts a $\\varepsilon^{3/2}$-type singularity of the macroscopic height profile (limit shape), as the distance $\\varepsilon$ from the frozen phase (facet) is sent to zero. This has been proved so far only in exactly solvable cases, notably the classical, determinantal, 2D dimer model. In this paper we prove the validity of the Pokrovsky-Talapov law for a non-integrable 2D dimer model on the hexagonal lattice, whose Gibbs weight depends upon a weak plaquette interaction among dimers. Our proof is based on a multiscale analysis (constructive fermionic Renormalization Group), which allows us to identify two different regimes with distinct scaling properties and to explain the universality of the Pokrovsky-Talapov exponent $3/2$, in contrast with the interaction-dependent critical exponents characterizing the rough phase. The first regime, corresponding to smaller distances, is characterized by an effective quadratic dispersion relation, while the second comes with an effective linear dispersion relation, typical of Luttinger liquid behavior. As a byproduct of our construction, we control the scaling limit of the interacting dimer model uniformly in the distance from the frozen phase.", "url": "https://arxiv.org/abs/2611.05516", "type": "理论", "summary": "随机表面模型中从粗糙相到冻结相的转变预计将受到 Pokrovsky-Talapov 定律的控制，该定律预测宏观高度轮廓（极限形状）的 $\\varepsilon^{3/2}$ 型奇点，因为与冻结相（面）的距离 $\\varepsilon$ 被发送到零。到目前为止，这一点仅在完全可解的情况下得到证明，特别是经典的、决定性的、二维二聚体模型。在本文中，我们证明了波克罗夫斯基-塔拉波夫定律对于六方晶格上不可积的二维二聚体模型的有效性，其吉布斯权重取决于二聚体之间的弱血小板相互作用。我们的证明基于多尺度分析（建设性费米子重正化群），它使我们能够识别具有不同标度特性的两种不同状态，并解释 Pokrovsky-Talapov 指数 $3/2$ 的普遍性，与表征粗糙相的相互作用相关关键指数形成对比。第一个区域对应于较小的距离，其特征在于有效的二次色散关系，而第二个区域则具有有效的线性色散关系，这是典型的路廷格液体行为。\n\n作为我们构建的副产品，我们在距冷冻相的距离上均匀地控制相互作用二聚体模型的缩放限制。", "authors": [{"name": "Alessandro Giuliani"}, {"name": "Vieri Mastropietro"}, {"name": "Bruno Renzi"}, {"name": "Fabio Toninelli"}], "featured_authors": [{"name": "Alessandro Giuliani"}, {"name": "Vieri Mastropietro"}, {"name": "Bruno Renzi"}, {"name": "Fabio Toninelli"}], "author_count": 4}, {"id": "2611.05554", "category": "math-ph", "title": "Stroh--Hamiltonian Framework for Modeling Incompressible Poroelastic Materials", "abstract": "The Stroh sextic formalism, developed by Stroh, offers a compelling framework for representing the equilibrium equations in anisotropic elasticity. This approach has proven particularly effective for studying multilayered structures and time-harmonic problems, owing to its ability to seamlessly integrate physical constraints into the analysis. By recognizing that the Stroh formalism aligns with the canonical Hamiltonian structure, this work extends its application to Biot's poroelasticity, focusing on scenarios where the solid material is incompressible and there is no fluid pressure gradient. The study introduces a novel Hamiltonian-based approach to analyze such systems, offering deeper insights into the interplay between solid incompressibility and fluid-solid coupling. A key novelty lies in the derivation of canonical equations under these constraints, enabling clearer interpretations of reversible poroelastic behavior. However, the framework assumes perfectly drained conditions and neglects dissipative effects, which limits its applicability to fully realistic scenarios involving energy loss or complex fluid dynamics. Despite this limitation, the work provides a foundational step toward understanding constrained poroelastic systems and paves the way for future extensions to more general cases, including dissipative and nonlinear regimes.", "url": "https://arxiv.org/abs/2611.05554", "type": "理论", "summary": "由 Stroh 开发的 Stroh 六次方程提供了一个令人信服的框架来表示各向异性弹性的平衡方程。事实证明，这种方法对于研究多层结构和时谐问题特别有效，因为它能够将物理约束无缝集成到分析中。通过认识到斯特罗形式主义与规范哈密顿结构一致，这项工作将其应用扩展到比奥孔隙弹性，重点关注固体材料不可压缩且不存在流体压力梯度的情况。该研究引入了一种基于哈密顿量的新颖方法来分析此类系统，为固体不可压缩性和流固耦合之间的相互作用提供了更深入的见解。一个关键的新颖之处在于在这些约束下推导规范方程，从而能够更清晰地解释可逆孔隙弹性行为。然而，该框架假设完全排水条件并忽略耗散效应，这限制了其在涉及能量损失或复杂流体动力学的完全现实场景中的适用性。\n\n尽管存在这种限制，这项工作为理解约束多孔弹性系统迈出了基础一步，并为未来扩展到更一般情况（包括耗散和非线性体系）铺平了道路。", "authors": [{"name": "Kinza Arshad"}, {"name": "Vincenzo Tibullo"}], "featured_authors": [{"name": "Kinza Arshad"}, {"name": "Vincenzo Tibullo"}], "author_count": 2}, {"id": "2611.05606", "category": "math-ph", "title": "When light travels with infinite speed: the electromagnetic loop circuits", "abstract": "Considering the ideal limit where the speed of light is infinite, or more precisely where the permittivity and permeability of the vaccuum are both zero, we construct a new type of electromagnetic circuit that we name an EM-loop circuit. These consist of wires having very high permittivity (E-wires) and wires having very high permeability (M-wires). These are threaded together by coils, the E-wire loops and M-wire loops. Some of the loops are terminal loops, pierced by an applied magnetic flux (for E-wire loops) or an applied displacement field (for M-wire loops) that are outside the vacuum since it does not support these fields. The response is the net flux of displacement field through a cross section of each E-wire terminal loop and the net magnetic flux through a cross section of each terminal M-wire loop. To calculate this response, the fields at the internal loops (those that are not terminal loops) are eliminated from the this http URL turns out that the response is governed by a new class of function pairs - dual Herglotz functions. Superpositions of a special class of EM-loop circuits, termed fundamental, allow us to realize any pair of dual Herglotz functions. Thus, we have obtained a complete characterization of the response functions of EM-loop circuits.", "url": "https://arxiv.org/abs/2611.05606", "type": "理论", "summary": "考虑到光速无限大的理想极限，或者更准确地说，真空的介电常数和磁导率都为零的理想极限，我们构建了一种新型电磁电路，我们将其命名为电磁环电路。这些由具有非常高介电常数的线（E-线）和具有非常高磁导率的线（M-线）组成。它们通过线圈、电子线环和米线环连接在一起。有些环路是终端环路，被施加的磁通量（对于电子线环路）或施加的位移场（对于米线环路）刺穿，这些环路位于真空之外，因为真空不支持这些场。响应是通过每个电子线端子环路的横截面的位移场的净通量和通过每个终端M线环路的横截面的净磁通量。为了计算此响应，从该 http URL 中消除了内部循环处的字段（那些不是终端循环的字段），结果表明该响应由一类新的函数对 - 双 Herglotz 函数控制。一类特殊的 EM 环电路（称为基本电路）的叠加使我们能够实现任何一对对偶 Herglotz 函数。\n\n因此，我们获得了 EM 环路响应函数的完整表征。", "authors": [{"name": "Graeme W Milton"}, {"name": "Pierre Seppecher"}], "featured_authors": [{"name": "Graeme W Milton"}, {"name": "Pierre Seppecher"}], "author_count": 2}, {"id": "2611.05641", "category": "math-ph", "title": "A liquid vapor phase transition in quantum statistical mechanics", "abstract": "We prove a liquid vapor phase transition for a quantum system of particles in the continuum. The system is the quantum version with Boltzmann statistics of the point particles model introduced in by Lebowitz, Mazel and Presutti.", "url": "https://arxiv.org/abs/2611.05641", "type": "理论", "summary": "我们证明了连续体中粒子的量子系统的液汽相变。该系统是 Lebowitz、Mazel 和 Presutti 引入的点粒子模型的玻尔兹曼统计的量子版本。", "authors": [{"name": "Francesco Baffioni"}, {"name": "Tobias Kuna"}, {"name": "Immacolata Merola"}, {"name": "Errico Presutti"}], "featured_authors": [{"name": "Francesco Baffioni"}, {"name": "Tobias Kuna"}, {"name": "Immacolata Merola"}, {"name": "Errico Presutti"}], "author_count": 4}, {"id": "2611.05686", "category": "math-ph", "title": "Dynamical Signatures of Selective Gap Closing in Multi-Dimensional Monotone Quasiperiodic Operators", "abstract": "We translate the spectral gap-closing criterion for multi-dimensional monotone quasiperiodic Schrödinger operators into a concrete dynamical protocol and verify it by large-scale numerics. For a non-principal label we construct a sampling function whose leading eigenfunction weight at the origin vanishes; a local bump then drives the residual weight through zero. The height of a weighted oscillatory time average of the origin-to-localization-center correlator exhibits a deep minimum precisely at the closing, while the site-control label remains featureless and orders of magnitude larger. The signature is robust and maps directly onto superconducting-circuit and photonic platforms.", "url": "https://arxiv.org/abs/2611.05686", "type": "理论", "summary": "我们将多维单调准周期薛定谔算子的谱间隙闭合准则转化为具体的动力学协议，并通过大规模数值验证。对于非主标签，我们构造一个采样函数，其原点处的主特征函数权重消失；然后，局部碰撞将剩余重量驱动至零。原点到定位中心相关器的加权振荡时间平均值的高度在结束时精确地表现出深度最小值，而位点控制标签保持无特征并且数量级大。该签名非常强大，可以直接映射到超导电路和光子平台上。", "authors": [{"name": "Leonid Parnovski"}, {"name": "Roman Shterenberg"}], "featured_authors": [{"name": "Leonid Parnovski"}, {"name": "Roman Shterenberg"}], "author_count": 2}, {"id": "2611.06104", "category": "math-ph", "title": "Compatible Condensation and Generalized Gauging: Marked Transport and Wall Interchange", "abstract": "We formulate condensation compatible with a specified separable generalized gauging operation in a unitary (2 + 1)-dimensional defect realization. Compatibility is a coherent reversible crossing of the full condensate algebra, retaining charged channels and the marked condensation interface. The resulting composite network determines the transported condensate, the induced operation, and a commuting square of specified walls. For connected gauging data, compatibility admits a central matching description that retains the transported condensate and its algebra identification on the specified wall. The specified unit may absorb a nontrivial parent anyon algebra; strong connectedness appears only as the transparent-unit specialization. We distinguish original vacuum insertions, vacuum branches after unit absorption, and the full vacuum algebra of the final phase, and we prove a complete Higgs criterion that incorporates the parent algebra absorbed by the specified unit. In the toric-code example of a non-invertible subgroup gauging we classify the compatible condensations for the fixed operation, exhibit two inequivalent crossings of the same parent condensate that lead to different final phases, and analyse a pure condensation operation in which the specified unit absorbs the parent electric condensate and produces additional final vacuum operators. The transparent-unit case recovers reverse-condensation transport and the vacuum-overlap formula, and the three complete Higgs conditions appear as a corollary of the general criterion.", "url": "https://arxiv.org/abs/2611.06104", "type": "理论", "summary": "我们在单一 (2 + 1) 维缺陷实现中制定了与指定的可分离广义测量操作兼容的凝聚。兼容性是完整凝聚代数的连贯可逆交叉，保留带电通道和标记的凝聚界面。由此产生的复合网络决定了输送的冷凝水、诱导的操作以及指定墙壁的通勤广场。对于连接的测量数据，兼容性允许中央匹配描述，该描述在指定的墙上保留传输的冷凝物及其代数标识。指定单位可以吸收非平凡的父任意子代数；强连通性仅表现为透明单元专业化。我们区分了原始真空插入、单元吸收后的真空分支以及最终阶段的全真空代数，并证明了包含指定单元吸收的父代数的完整希格斯准则。\n\n在不可逆子组计量的环面代码示例中，我们对固定操作的兼容凝结进行分类，展示导致不同最终相的同一母体凝结的两个不等价交叉，并分析纯凝结操作，其中指定单元吸收母体电凝结并产生额外的最终真空运算符。透明单元盒恢复了逆凝聚输运和真空重叠公式，三个完整的希格斯条件作为一般准则的推论出现。", "authors": [{"name": "Youxuan Wang"}], "featured_authors": [{"name": "Youxuan Wang"}], "author_count": 1}, {"id": "2611.06202", "category": "math-ph", "title": "The Quantum Stochastic Limit for Non-Markovian Driving Processes", "abstract": "We express the stochastic limit (weak-coupling limit) of a quantum system interacting with its environment as the limit of solutions to a parametrized family of quantum stochastic differential equations (QSDEs). We prove the convergence of such solutions in the case where the driving processes may be non-Markovian and the system may be infinite-dimensional with unbounded Hamiltonian. We achieve this by imposing a particular condition on the n-point functions of the driving process which we verify for annihilation, creation, and gauge operators on a bosonic Fock space with sufficient mixing. Additionally, we include not only the usual fast-evolving system Hamiltonian which is averaged out in the limit, but also a slow-evolving system Hamiltonian which survives the limit. We also relax the requirement for the fast-evolving Hamiltonian to have a purely discrete spectrum allowing accumulation points under some circumstances. Moreover, our convergence mode for the processes is convergence of all time-centered n-point functions which is stronger than the typical semigroup convergence for the stochastic limit.", "url": "https://arxiv.org/abs/2611.06202", "type": "理论", "summary": "我们将量子系统与其环境相互作用的随机极限（弱耦合极限）表示为参数化量子随机微分方程族（QSDE）的解的极限。我们证明了在驱动过程可能是非马尔可夫且系统可能是具有无界哈密顿量的无限维的情况下此类解的收敛性。我们通过对驱动过程的 n 点函数施加特定条件来实现这一目标，我们在充分混合的玻色福克空间上验证湮灭、创建和规范算子。此外，我们不仅包括通常的快速演化系统哈密顿量（在极限内求平均值），还包括慢速演化系统哈密顿量（在极限内存活）。我们还放宽了对快速演化哈密顿量的要求，使其具有纯离散谱，允许在某些情况下积累点。此外，我们的过程收敛模式是所有以时间为中心的n点函数的收敛，这比随机极限的典型半群收敛更强。", "authors": [{"name": "Tanner J. Reese"}], "featured_authors": [{"name": "Tanner J. Reese"}], "author_count": 1}, {"id": "2611.06485", "category": "math-ph", "title": "Fluctuating Hydrodynamics of Quantum Fluids from the Nonlinear Fokker-Planck Equation", "abstract": "Starting from the nonlinear Fokker-Planck equation (NFPE), we establish the fluctuating hydrodynamics for quantum fluids. We also investigate the corresponding stochastic thermodynamics and derive the associated fluctuation theorems. We then apply this framework to both fermionic and bosonic systems. For the ideal Fermi gas, we study the electrical conduction and reveal a resistance proportional to the product of temperature and the density of states at the Fermi surface. For bosonic fluids, we analyze the relaxation time characterizing the critical slowing down phenomenon and identify three distinct scaling behaviors corresponding to the non-interacting, repulsive interaction, and attractive interaction regimes. Overall, this work provides a experimentally verifiable phenomenological description for the dynamics of quantum fluids and demonstrates the applicability of the nonlinear Fokker-Planck equation in characterizing such systems.", "url": "https://arxiv.org/abs/2611.06485", "type": "理论", "summary": "从非线性福克-普朗克方程（NFPE）出发，我们建立了量子流体的脉动流体动力学。我们还研究了相应的随机热力学并推导了相关的涨落定理。然后我们将该框架应用于费米子和玻色子系统。对于理想的费米气体，我们研究了电导率并揭示了与费米表面温度和态密度的乘积成正比的电阻。对于玻色流体，我们分析了表征临界减速现象的弛豫时间，并确定了与非相互作用、排斥相互作用和吸引相互作用机制相对应的三种不同的尺度行为。总体而言，这项工作为量子流体动力学提供了可通过实验验证的唯象描述，并证明了非线性福克-普朗克方程在表征此类系统时的适用性。", "authors": [{"name": "Mingjian Gu"}, {"name": "Zhaoyu Fei"}, {"name": "Xiaoguang Wang"}], "featured_authors": [{"name": "Mingjian Gu"}, {"name": "Zhaoyu Fei"}, {"name": "Xiaoguang Wang"}], "author_count": 3}, {"id": "2611.06558", "category": "math-ph", "title": "Spectral properties of twisted soft waveguides", "abstract": "We discuss a model of a soft waveguide described by Schrödinger operator whose potential is a twisted straight channel of non-circular profile. We show that a compactly supported twist makes the operator subcritical, the property being expressed in terms of a Hardy-type inequality. On the other hand, a periodic twist raises the essential spectrum and its local slowdown may give rise to isolated eigenvalues below the essential spectrum threshold.", "url": "https://arxiv.org/abs/2611.06558", "type": "理论", "summary": "我们讨论了薛定谔算子描述的软波导模型，其潜力是非圆形轮廓的扭曲直通道。我们证明了紧支撑的扭曲使得算子亚临界，该性质用 Hardy 型不等式表示。另一方面，周期性扭曲会提高基本频谱，并且其局部减速可能会导致低于基本频谱阈值的孤立特征值。", "authors": [{"name": "Pavel Exner"}, {"name": "David Spitzkopf"}], "featured_authors": [{"name": "Pavel Exner"}, {"name": "David Spitzkopf"}], "author_count": 2}, {"id": "2611.06617", "category": "math-ph", "title": "A Counterexample to the Weak Gibbs and Regularity Conjectures", "abstract": "We provide a counterexample to the weak Gibbs and regularity conjectures. The example is a spin-one system on the square lattice with a translation-invariant nearest-neighbor interaction. At high temperatures and high on-site field strengths, it has a unique KMS state that does not have the weak Gibbs or regularity properties.", "url": "https://arxiv.org/abs/2611.06617", "type": "理论", "summary": "我们为弱吉布斯猜想和正则性猜想提供了一个反例。该示例是方晶格上具有平移不变最近邻相互作用的自旋一系统。在高温和高现场场强下，它具有独特的 KMS 状态，不具有弱吉布斯或正则性特性。", "authors": [{"name": "Marius Wesle"}], "featured_authors": [{"name": "Marius Wesle"}], "author_count": 1}, {"id": "2611.06669", "category": "math-ph", "title": "Large particle number asymptotics for point-interacting bosons in the plane", "abstract": "We consider $N$ bosons in two dimensions interacting via point interactions, modeled by the TMS Hamiltonian. We prove that their ground state energy has the asymptotic behavior $-e^{C N }$ for large $N$, for an explicit constant $C$ related to the sharp constant in the Ladyzhenskaya-Gagliardo-Nirenberg inequality. Such asymptotic behavior was predicted in the physics literature, based on a variant of the mean-field approximation.", "url": "https://arxiv.org/abs/2611.06669", "type": "理论", "summary": "我们考虑二维中的 $N$ 玻色子通过点相互作用相互作用，由 TMS 哈密顿量建模。我们证明，对于较大的 $N$，对于与 Ladyzhenskaya-Gagliardo-Nirenberg 不等式中的尖锐常数相关的显式常数 $C$，它们的基态能量具有渐近行为 $-e^{C N }$。物理学文献基于平均场近似的变体预测了这种渐近行为。", "authors": [{"name": "Rupert L. Frank"}, {"name": "Robert Seiringer"}], "featured_authors": [{"name": "Rupert L. Frank"}, {"name": "Robert Seiringer"}], "author_count": 2}, {"id": "2611.06675", "category": "math-ph", "title": "Concavity of Normalized Generalized Brézin--Gross--Witten Correlators and Its Applications", "abstract": "In this paper, we study the generalized Brézin--Gross--Witten model using its BKP integrability. By virtue of the formula for connected $n$-point functions of tau-functions of the BKP hierarchy obtained by Wang and the first-named author, we prove that the normalized generalized BGW correlators are strictly concave for fixed genus and fixed total degree. As applications, we establish the strict Schur-concavity and derive upper and lower bounds for these correlators. We also prove the strict monotonicity of normalized ordinary BGW correlators, which resolves a conjecture by Guo--Norbury--Yang--Zagier.", "url": "https://arxiv.org/abs/2611.06675", "type": "理论", "summary": "在本文中，我们利用 BKP 可积性研究了广义 Brézin--Gross--Witten 模型。借助Wang和第一作者获得的BKP层次tau函数的$n$点连通函数公式，我们证明了归一化广义BGW相关器对于固定亏格和固定总度是严格凹的。作为应用，我们建立严格的 Schur 凹性并导出这些相关器的上限和下限。我们还证明了归一化普通BGW相关器的严格单调性，解决了Guo-Norbury-Yang-Zagier的猜想。", "authors": [{"name": "Chenglang Yang"}, {"name": "Xuhui Zhang"}], "featured_authors": [{"name": "Chenglang Yang"}, {"name": "Xuhui Zhang"}], "author_count": 2}, {"id": "2611.06780", "category": "math-ph", "title": "A local Yang-Baxter obstruction for the hard-square model", "abstract": "Many exact solutions of two-dimensional lattice models rest on an analytic family of weights satisfying the Yang-Baxter equation. The hard-hexagon model was solved in this way, while the neighbouring hard-square model has no known closed form. We determine the height alphabets that encode hard squares without hidden heights, and there are exactly two connected ones, the occupation variables themselves and the four heights of Andrews, Baxter and Forrester. Hard hexagons is integrable on both, but no analytic Yang-Baxter family of face weights passes through hard squares at nonzero activity on either. The difference lies in the exclusion rule, which for hard squares turns a few Yang-Baxter equations into polynomial identities that force auxiliary weights to vanish. A closed form for hard squares is not excluded, but a solution by this route would have to leave these encodings or go beyond a single analytic family through the model. Encodings with hidden heights remain open.", "url": "https://arxiv.org/abs/2611.06780", "type": "理论", "summary": "二维晶格模型的许多精确解依赖于满足 Yang-Baxter 方程的解析权重族。硬六边形模型以这种方式求解，而相邻的硬方形模型没有已知的闭合形式。我们确定了编码没有隐藏高度的硬方块的高度字母表，并且恰好有两个相连的字母表，即职业变量本​​身以及安德鲁斯、巴克斯特和福雷斯特的四个高度。硬六边形在两者上都是可积的，但是面权重的解析 Yang-Baxter 系列在任何一个上都不会以非零活动通过硬正方形。不同之处在于排除规则，对于硬平方，该规则将一些 Yang-Baxter 方程转换为多项式恒等式，迫使辅助权重消失。不排除硬方块的封闭形式，但是通过这种途径的解决方案必须离开这些编码或通过模型超越单个分析族。具有隐藏高度的编码保持开放。", "authors": [{"name": "Gabriel Ortega"}, {"name": "Eliecer Peña-Ancavil"}], "featured_authors": [{"name": "Gabriel Ortega"}, {"name": "Eliecer Peña-Ancavil"}], "author_count": 2}, {"id": "2611.05462", "category": "quant-ph", "title": "Spectral measures and sharpness of quantum speed limits", "abstract": "Quantum speed limits bound the time required for a given state to evolve into a given subspace of the Hilbert space under specific energy constraints. We prove that for several standard orthogonalization time bounds, the unique spectral measure associated with the initial vector that saturates the bound is a sum of two Dirac measures. Furthermore, we constrain the families of spectral measures that come arbitrarily close to these bounds and construct examples with measures which are purely absolutely continuous and purely singular continuous with respect to the Lebesgue measure. As a complementary perspective, we discuss the geometric intuition behind quantum speed limits provided by the numerical range of the evolution operator.", "url": "https://arxiv.org/abs/2611.05462", "type": "理论+数值", "summary": "量子速度限制限制了给定状态在特定能量约束下演化为希尔伯特空间的给定子空间所需的时间。我们证明，对于几个标准正交化时间界限，与饱和界限的初始向量相关的唯一谱测度是两个狄拉克测度之和。此外，我们约束任意接近这些界限的谱测度族，并用相对于勒贝格测度而言纯粹绝对连续和纯粹奇异连续的测度构造示例。作为补充的视角，我们讨论了演化算子的​​数值范围提供的量子速度限制背后的几何直觉。", "authors": [{"name": "Ivica Smolić"}], "featured_authors": [{"name": "Ivica Smolić"}], "author_count": 1}, {"id": "2611.05483", "category": "quant-ph", "title": "Classical training of conditional instantaneous quantum polynomial-time Born machines", "abstract": "Instantaneous quantum polynomial-time (IQP) Born machines are attractive quantum generative models, as certain IQP circuit families are conjectured to be hard to sample, yet they can be trained classically. Previously proposed conditional IQP Born machines make the parameters of the diagonal layer condition dependent. We introduce conditional IQP Born machines, in which the condition is encoded in the input state and a single IQP unitary is shared across conditions. Efficient sampling and amplitude-ratio evaluation for the reference state entering the diagonal layer suffice to obtain unbiased classical estimates of a conditional maximum mean discrepancy objective and its gradients. We show that input conditioning can represent conditional families that no diagonally conditioned IQP model with the same number of qubits can reproduce. For the sixteen-qubit Curie-Weiss spin model, a single conditional model captures the magnetization transition at held-out temperatures. Its mean total variation distance is six times lower than that of diagonal conditioning under the same protocol and comparable to that of classical generative models with up to seven times as many parameters. We also train conditional models classically with up to 2048 qubits, which reproduce the mean squared magnetization of the target away from the crossover. These results extend classically trained IQP Born machines to conditional generation.", "url": "https://arxiv.org/abs/2611.05483", "type": "理论", "summary": "瞬时量子多项式时间 (IQP) Born 机器是有吸引力的量子生成模型，因为某些 IQP 电路系列被认为难以采样，但它们可以进行经典训练。先前提出的条件 IQP Born 机器使对角线层的参数依赖于条件。我们引入了条件 IQP Born 机器，其中条件在输入状态中进行编码，并且单个 IQP 单一在条件之间共享。对进入对角层的参考状态的有效采样和幅度比评估足以获得条件最大平均差异目标及其梯度的无偏经典估计。我们证明，输入条件可以代表具有相同量子位数量的对角条件 IQP 模型无法重现的条件族。对于十六量子位居里-韦斯自旋模型，单个条件模型捕获保持温度下的磁化转变。其平均总变异距离比相同协议下的对角条件条件低六倍，并且与参数数量高达七倍的经典生成模型相当。\n\n我们还使用最多 2048 个量子位来经典训练条件模型，这些模型再现了远离交叉点的目标的均方磁化强度。这些结果将经过经典训练的 IQP Born 机器扩展到条件生成。", "authors": [{"name": "Oriol Balló-Gimbernat"}, {"name": "Emiliano Tolotti"}, {"name": "Laia Domingo"}, {"name": "Fernando Vilariño"}, {"name": "Adan Garriga"}], "featured_authors": [{"name": "Oriol Balló-Gimbernat"}, {"name": "Emiliano Tolotti"}, {"name": "Laia Domingo"}, {"name": "Fernando Vilariño"}, {"name": "Adan Garriga"}], "author_count": 5}, {"id": "2611.05495", "category": "quant-ph", "title": "Krylov meets Fock: Complementary lenses on quantum dynamics", "abstract": "Quantum dynamics in Krylov space can be represented by a particle hopping on a chain whose sites are the Krylov basis vectors. The goal of this work is to extend this idea to the Fock basis, which in turn allows the description of a generic dynamics in terms of a more general, possibly higher-dimensional lattice. This construction has been dubbed the Fock state lattice (FSL), since its sites are identified with Fock states. To analyze the dynamics on the FSL we introduce various measures of the spread of a state, comparing them among themselves and with their Krylov counterparts. We apply our analysis to two models of light-matter interaction studied in quantum optics: the multi-mode Jaynes-Cummings and the Dicke models. We find that, whenever the FSL is not a chain, the corresponding dynamics provides insights complementary to the Krylov space analysis and, in some instances, greater analytical control. For example, we obtain analytical results for the FSL spread measures of the Dicke model in the thermodynamic limit and determine that their scaling in time detects the superradiant phase transition.", "url": "https://arxiv.org/abs/2611.05495", "type": "理论", "summary": "克雷洛夫空间中的量子动力学可以用在链上跳跃的粒子来表示，该链的位点是克雷洛夫基向量。这项工作的目标是将这个想法扩展到 Fock 基础，这反过来又允许用更通用、可能更高维的晶格来描述通用动力学。这种结构被称为福克态晶格（FSL），因为它的位置被确定为福克态。为了分析 FSL 的动态，我们引入了国家传播的各种衡量标准，将它们相互之间以及与克雷洛夫对应国家进行比较。我们将分析应用于量子光学中研究的两种光与物质相互作用模型：多模杰恩斯-卡明斯模型和迪克模型。我们发现，只要 FSL 不是链，相应的动力学就会提供与 Krylov 空间分析互补的见解，并且在某些情况下提供更好的分析控制。例如，我们获得了 Dicke 模型在热力学极限下的 FSL 扩展测量的分析结果，并确定它们的时间缩放可检测超辐射相变。", "authors": [{"name": "Giuseppe Di Giulio"}, {"name": "Dimitrios Patramanis"}], "featured_authors": [{"name": "Giuseppe Di Giulio"}, {"name": "Dimitrios Patramanis"}], "author_count": 2}, {"id": "2611.05526", "category": "quant-ph", "title": "Quantum error correcting codes from quiver moduli: Grassmannians, cyclic monodromy, and argyle collision divisors", "abstract": "Building on aspects of a recent diagrammatic field-theory programme for quantum error correction put forward by the first-named author ( arXiv:2607.08911 ), we construct exact finite-dimensional codes from twisted cyclic and argyle quiver moduli on the projective line. A regular fibre of the node-labelled cyclic Hitchin map records the ways to distribute simple spectral zeroes among the arrows with prescribed degrees. The Hilbert space spanned by these allocations is a Young permutation module. Root monodromy acts on its Specht factors and leaves their multiplicity spaces noiseless. Resetting the Specht factor therefore recovers the encoded state for every channel in the monodromy noise model. We prove that the largest Kostka multiplicity is the optimal dimension of a subspace code correcting the full monodromy algebra, even among codes spanning several isotypic blocks. Quantizing an argyle master space recovers the cyclic sheet space as a weight sector of a tensor power, with the identification preserving monodromy. For the balanced three-cycle with $t$ zeroes per arrow, the multiplicity of a partition $(a,b,c)$ of $3t$ is $1+\\min(a-b,b-c)$. The optimal logical dimension is thus $t+1$, attained uniquely by the block indexed by $(2t,t)$. At $t=1$ we give explicit codewords for a qubit on six sheets. The commuting right action generates its full logical algebra, yielding errors outside the monodromy model that leave the measured footprint statistics unchanged yet require different recoveries. We also compute collision-parity ranks, give a higher-rank Grassmannian example, and derive a conditional criterion for recovery across splitting types.", "url": "https://arxiv.org/abs/2611.05526", "type": "理论", "summary": "基于第一作者（arXiv:2607.08911）最近提出的量子纠错图解场论程序的各个方面，我们从射影线上的扭曲循环和菱形颤动模构建了精确的有限维码。节点标记的循环希钦图的规则光纤记录了在具有规定度数的箭头之间分配简单谱零的方法。这些分配所跨越的希尔伯特空间是杨氏排列模块。根单一性作用于其光谱因子，并使它们的多重性空间保持安静。因此，重置 Specht 因子可以恢复单色噪声模型中每个通道的编码状态。我们证明最大的 Kostka 重数是校正完整单一代数的子空间代码的最佳维度，即使在跨越多个同型块的代码中也是如此。量化菱形主空间将循环片空间恢复为张量幂的权重扇区，并且标识保持单性。对于每个箭头 $t$ 个零的平衡三循环，$3t$ 的分区 $(a,b,c)$ 的重数为 $1+\\min(a-b,b-c)$。\n\n因此，最佳逻辑维度是 $t+1$，由 $(2t,t)$ 索引的块唯一获得。在 $t=1$ 时，我们为六张纸上的量子位给出明确的代码字。通勤正确的动作生成其完整的逻辑代数，产生单一模型之外的错误，使测量的足迹统计数据保持不变，但需要不同的恢复。我们还计算碰撞奇偶校验等级，给出更高等级的格拉斯曼例子，并导出跨分裂类型恢复的条件标准。", "authors": [{"name": "Steven Rayan"}, {"name": "Evan Sundbo"}], "featured_authors": [{"name": "Steven Rayan"}, {"name": "Evan Sundbo"}], "author_count": 2}, {"id": "2611.05537", "category": "quant-ph", "title": "Quantum theory of damping: A new approach to temporal evolution of density operator without the rotating wave approximation", "abstract": "The Lindblad master equation is the standard framework for describing dissipative dynamics of the open quantum system context. Its conventional derivation, however, relies on the rotating-wave approximation (RWA), which neglects the counter rotating terms in the system-reservoir interaction. Here, we derive a generalized Lindblad master equation beyond the RWA within the density operator formalism, retaining the full systemreservoir coupling. We consider two prototypical open quantum systems, a two-level atom and a single-mode quantized field, each interacting with thermal or squeezed reservoirs described by the Wigner-Weisskopf theory. The resulting master equations are applied to the evolution of representative physical observables and compared with the conventional RWA based formulation. We show that counter-rotating terms produce significant modifications to the dissipative dynamics and therefore cannot, in general, be neglected. For a thermal reservoir, increasing the mean thermal photon number, nth, enhances the decay of h{\\sigma}^yi beyond the RWA but suppresses it within the RWA. Likewise, the evolution of h{\\sigma}^zi exhibits opposite damping behavior with increasing {\\Gamma}t and squeezing parameter r. These findings demonstrate the importance of including counter rotating terms for an accurate description of open quantum systems.", "url": "https://arxiv.org/abs/2611.05537", "type": "理论", "summary": "Lindblad 主方程是描述开放量子系统环境耗散动力学的标准框架。然而，其传统推导依赖于旋转波近似（RWA），该近似忽略了系统-储层相互作用中的反向旋转项。在这里，我们在密度算子形式内推导了超越 RWA 的广义 Lindblad 主方程，保留了完整的系统储层耦合。我们考虑两个典型的开放量子系统，一个两级原子和一个单模量子化场，每个系统都与维格纳-韦斯科普夫理论描述的热储层或压缩储层相互作用。由此产生的主方程应用于代表性物理可观测量的演化，并与传统的基于 RWA 的公式进行比较。我们表明，反向旋转项会对耗散动力学产生显着的改变，因此通常不能被忽略。对于热储层，增加平均热光子数 nth 会增强 RWA 之外的 h{\\sigma}^yi 的衰减，但会抑制 RWA 内的 h{\\sigma}^yi 的衰减。\n\n同样，随着 {\\Gamma}t 的增加和压缩参数 r 的增加，h{\\sigma}^zi 的演化表现出相反的阻尼行为。这些发现证明了包含反旋转项对于准确描述开放量子系统的重要性。", "authors": [{"name": "A. Marashi Nasab"}, {"name": "E. Ghasemian"}, {"name": "M. K. Tavassoly"}], "featured_authors": [{"name": "A. Marashi Nasab"}, {"name": "E. Ghasemian"}, {"name": "M. K. Tavassoly"}], "author_count": 3}, {"id": "2611.05541", "category": "quant-ph", "title": "Higher-order quantum information inequalities and error-correction of non-Markovian noise", "abstract": "Defining entropy of a quantum channel has become a challenge with potential candidates recently reported in literature. In this Article, it is taken under consideration the entropy of a quantum channel defined as the quantum entropy of its associated Choi state. The consequences presented here of such approach is two-fold. First, the limitations on the information-processing of quantum channels are assessed, leading to the \\emph{higher-order quantum information inequalities}. Those are then considered as useful witnesses of non-Markovian effects beyond a given number of quantum side-channels in a quantum process. Importantly, the presentation is given with the application of the methods for the study of examples. Second, such approach provides a characterization on the condition for the recovery of quantum channel preparations under non-Markovian noise. Such result is a straightforward extension of standard error-correction conditions which gives further meaning to the higher-order information measures defined here.", "url": "https://arxiv.org/abs/2611.05541", "type": "理论", "summary": "对于最近文献报道的潜在候选者来说，定义量子通道的熵已成为一个挑战。在本文中，考虑了量子通道的熵，定义为其相关 Choi 态的量子熵。这里提出的这种方法的后果是双重的。首先，评估量子通道信息处理的局限性，导致\\emph{高阶量子信息不等式}。然后，这些被认为是量子过程中超出给定数量的量子侧通道的非马尔可夫效应的有用证据。重要的是，演示是通过应用示例研究方法来给出的。其次，这种方法提供了非马尔可夫噪声下量子通道准备恢复条件的表征。这样的结果是标准纠错条件的直接扩展，它为此处定义的高阶信息度量赋予了进一步的含义。", "authors": [{"name": "Matheus Capela"}], "featured_authors": [{"name": "Matheus Capela"}], "author_count": 1}, {"id": "2611.05603", "category": "quant-ph", "title": "Quantum resource trade-offs of mixed sparse single and double factorization for qubitization-based phase estimation", "abstract": "We study a mixed block encoding of quantum-chemistry Hamiltonians for quantum phase estimation (QPE) on fault-tolerant quantum computers. Following a Cholesky decomposition of the electron repulsion integral tensor, we assign each Cholesky tensor to either a double-factorization (DF) branch or a sparse-single-factorization (SPSF) branch. This freedom permits a trade-off between reducing the block-encoding normalization factor $\\lambda$ with DF and reducing the coefficient data loaded through quantum read-only memory (QROM) with SPSF. Resource estimates across molecular benchmarks show, however, that the mixed circuit does not generally reduce the Toffoli count relative to the less expensive pure circuit. The main obstacles are the overhead of loading substantial data through separate branch-specific QROMs and the limited benefit of mixing when the pure DF and SPSF circuits have dissimilar costs. Modest savings occur only in restricted parameter regimes, most clearly when logical-qubit requirements are included in the cost metric. These results identify the circuit-level conditions that a useful mixed block encoding must satisfy.", "url": "https://arxiv.org/abs/2611.05603", "type": "理论", "summary": "我们研究了量子化学哈密顿量的混合块编码，用于容错量子计算机上的量子相位估计（QPE）。在对电子斥力积分张量进行 Cholesky 分解之后，我们将每个 Cholesky 张量分配给双因子分解 (DF) 分支或稀疏单因子分解 (SPSF) 分支。这种自由度允许在使用 DF 减少块编码归一化因子 $\\lambda$ 和使用 SPSF 减少通过量子只读存储器 (QROM) 加载的系数数据之间进行权衡。然而，跨分子基准的资源估计表明，相对于较便宜的纯电路，混合电路通常不会减少 Toffoli 计数。主要障碍是通过单独的特定于分支的 QROM 加载大量数据的开销，以及当纯 DF 和 SPSF 电路具有不同成本时混合的有限好处。仅在受限制的参数方案中才会出现适度的节省，当成本指标中包含逻辑量子位要求时，这一点最为明显。这些结果确定了有用的混合块编码必须满足的电路级条件。", "authors": [{"name": "Troy Losey"}, {"name": "Jacob Z. Williams"}, {"name": "Avanish Mishra"}, {"name": "Jian-Xin Zhu"}, {"name": "Yu Zhang"}], "featured_authors": [{"name": "Troy Losey"}, {"name": "Jacob Z. Williams"}, {"name": "Avanish Mishra"}, {"name": "Jian-Xin Zhu"}, {"name": "Yu Zhang"}], "author_count": 5}, {"id": "2611.05627", "category": "quant-ph", "title": "Tensor-network simulation of strongly coupled multi-fluxonium circuits", "abstract": "Designing a superconducting quantum processor rests on predicting the low-lying spectrum of its coupled circuit. The Hilbert-space dimension of the circuit's lumped-element model grows exponentially with the number of circuit nodes. The usual methods split the circuit into subsystems, but that split is hard to choose when the elements are strongly coupled. We present a tensor-network method that chooses no subsystems and whose memory and run time per solve are set by the number of modes and two truncations, the Fock cutoff of each normal mode and the bond dimension of a matrix product state (MPS), not by the Hilbert-space dimension. From the capacitance matrix, the inverse-inductance matrix and the junction list alone, the linear circuit is diagonalized into normal modes. Each junction cosine is then a sum of two products of single-mode operators, so the complete lumped-element Hamiltonian is a matrix product operator (MPO) of small bond dimension with one site per mode, solved by the density matrix renormalization group (DMRG). The normal modes make the method generic, and the tensor network makes it affordable. For two fluxonia joined by a tunable coupler, the method agrees with exact diagonalization of the same truncated space to within 1 MHz. Our circuit of three fluxonia joined by two couplers has 11 normal modes and a truncated space of $10^9$ states, out of reach of exact diagonalization in dense or sparse storage. At a bond dimension of 32, its lowest eight levels are converged to within 1 MHz in both truncations, and each state is stored in a small fraction of the numbers a dense vector needs. One solve at that bond dimension takes 81 min and 1.3 GB of memory on one CPU node.", "url": "https://arxiv.org/abs/2611.05627", "type": "理论+数值", "summary": "设计超导量子处理器取决于预测其耦合电路的低位频谱。电路集总元件模型的希尔伯特空间维数随着电路节点的数量呈指数增长。通常的方法将电路分割成子系统，但当元件强耦合时，这种分割很难选择。我们提出了一种不选择子系统的张量网络方法，其每次求解的内存和运行时间由模态数量和两次截断、每个正态模态的 Fock 截断和矩阵乘积状态 (MPS) 的键维数设置，而不是由希尔伯特空间维数设置。仅根据电容矩阵、逆电感矩阵和结列表，线性电路就被对角化为普通模式。每个结余弦都是单模算子的两个乘积之和，因此完整的集总元素哈密顿量是小键维数的矩阵积算子 (MPO)，每个模式一个位点，由密度矩阵重正化群 (DMRG) 求解。正规模式使该方法具有通用性，而张量网络使其变得经济实惠。\n\n对于通过可调谐耦合器连接的两个 Fluxonia，该方法与将相同截断空间精确对角化到 1 MHz 以内一致。我们的由两个耦合器连接的三个 Fluxonia 电路具有 11 种正常模式和 $10^9$ 状态的截断空间，在密集或稀疏存储中无法实现精确对角化。当键维数为 32 时，其最低八个能级在两次截断中都收敛到 1 MHz 以内，并且每个状态都存储在密集向量所需数字的一小部分中。该键维度的一项求解需要 81 分钟，并在一个 CPU 节点上占用 1.3 GB 内存。", "authors": [{"name": "Christian Hensel"}, {"name": "Andrés N. Cáliz"}, {"name": "Pau Torrente"}, {"name": "María Hita-Pérez"}, {"name": "Arnau Riera"}], "featured_authors": [{"name": "Christian Hensel"}, {"name": "Andrés N. Cáliz"}, {"name": "Pau Torrente"}, {"name": "María Hita-Pérez"}, {"name": "Arnau Riera"}], "author_count": 5}, {"id": "2611.05722", "category": "quant-ph", "title": "Trinetra.Q: Statistical and Behavioral Detection of Attacks on the Quantum-Error-Correction Layer and Classical Control Stack of Quantum Computing Systems", "abstract": "Most quantum-computer security work targets physical-layer attacks on qubits, while two surfaces remain inadequately defended: the quantum-error-correction (QEC) syndrome-and-decoder pipeline, and the classical control and software stack that runs it. Tampering on these surfaces can corrupt a computation while the physical error rate appears normal, and can stay within a single-circuit integrity tolerance. We present Trinetra.Q, a detection layer of cooperating detectors, each monitoring a statistical or behavioral property of quantum-domain data against an envelope calibrated from honest operation, and raising an indication only on a statistically significant deviation. The detectors cover (A) QEC integrity over per-stabilizer firing rates, syndrome defect-count, and repeated-syndrome rate; (B) decoder confidence over the margin between minimum-weight error explanations in distinct logical classes; (C) behavioral output divergence, flagging crosstalk-class and novel attacks by their effect on a victim's output relative to a matched control; (D) control-stack tampering via known-answer canary circuits, built to be indistinguishable to a resident implant, with a cross-job consistency statistic; and (E) compilation/execution integrity. Each gates on significance, so honest operation raises no alarm. We evaluate in faithful simulation and on three production IBM Heron processors, and bound the physical attack surface with a systematic negative map: most physical-layer attacks return statistically null, the exception an implemented, measured within-job feed-forward covert-channel primitive. Every detector is also evaluated against an adaptive attacker with full knowledge of it. To our knowledge this is the first unified statistical-and-behavioral detection layer for the QEC layer and classical control stack of a quantum computing system, demonstrated on production hardware.", "url": "https://arxiv.org/abs/2611.05722", "type": "理论+数值", "summary": "大多数量子计算机安全工作都针对量子位的物理层攻击，而两个表面仍然没有得到充分的防御：量子纠错（QEC）综合症和解码器管道，以及运行它的经典控制和软件堆栈。对这些表面的篡改可能会破坏计算，而物理错误率看起来正常，并且可以保持在单电路完整性容差范围内。我们提出了 Trinetra.Q，一个由协作检测器组成的检测层，每个检测器都根据诚实操作校准的包络来监控量子域数据的统计或行为属性，并仅针对统计上显着的偏差提出指示。\n\n检测器涵盖 (A) 每个稳定器发射率、综合症缺陷计数和重复综合症率的 QEC 完整性； (B) 解码器对不同逻辑类别中最小权重错误解释之间的余量的置信度； (C) 行为输出差异，通过相对于匹配控制对受害者输出的影响来标记串扰类和新颖的攻击； (D) 通过已知答案的金丝雀电路进行控制堆栈篡改，该电路与常驻植入物无法区分，具有跨作业一致性统计； (E) 编译/执行完整性。每一道门都很重要，所以诚实的操作不会引起任何警报。我们在忠实的模拟和三个生产 IBM Heron 处理器上进行评估，并将物理攻击面与系统负图绑定：大多数物理层攻击返回统计上的空值，例外是一个已实现、测量的作业内前馈隐蔽通道原语。每个检测器都会针对完全了解它的自适应攻击者进行评估。\n\n据我们所知，这是第一个针对量子计算系统的 QEC 层和经典控制堆栈的统一统计和行为检测层，并在生产硬件上进行了演示。", "authors": [{"name": "Garrv Sipani"}], "featured_authors": [{"name": "Garrv Sipani"}], "author_count": 1}, {"id": "2611.05757", "category": "quant-ph", "title": "The most entangled states of four and seven qubits", "abstract": "Pure states of four and seven qubits cannot be maximally entangled across every balanced bipartition; we determine how entangled they can be on average. For four qubits we prove the conjecture of Higuchi and Sudbery: the mean von Neumann entropy of the three $2|2$ cuts is at most $1+\\tfrac12\\log_2 3$ bits, with equality exactly on the local-unitary orbits of their state $M_4$ and its complex conjugate. For seven qubits the mean purity of the 35 balanced $3|4$ cuts is at least $121/917$ and their mean entropy is at most $2.965356029\\ldots$ bits, each with a unique optimiser up to local unitaries and qubit permutations. The two optimisers are distinct members of one icosahedral family, so minimum purity and maximum entropy select different states. The proofs bound moments of the marginal spectra by positive identities on several copies of the state, some of them spin flipped, and bound the entropy by a polynomial in those moments. The four-qubit maximum has an analytic proof; the seven-qubit proofs, and some of the four-qubit refinements below, are computer-assisted, with exact arithmetic and rigorous error bounds. We also prove the Gour--Wallach conjecture for Rényi entropies of all orders, with the maximiser changing from $M_4$ to cluster states at $q_*\\approx1.588$, and obtain sharp Tsallis bounds, mixed-state bounds and quantitative stability.", "url": "https://arxiv.org/abs/2611.05757", "type": "理论", "summary": "四个和七个量子位的纯态不能在每个平衡二分上最大程度地纠缠；我们确定它们的平均纠缠程度。对于四个量子位，我们证明了 Higuchi 和 Sudbery 的猜想：三个 $2|2$ 切割的平均冯·诺依曼熵最多为 $1+\\tfrac12\\log_2 3$ 位，并且恰好在其状态 $M_4$ 及其复共轭的局域酉轨道上相等。对于七个量子位，35 个平衡的 $3|4$ 切割的平均纯度至少为 $121/917$，它们的平均熵最多为 $2.965356029\\ldots$ 位，每个位都有一个独特的优化器，最多可达局部酉和量子位排列。这两个优化器是一个二十面体族的不同成员，因此最小纯度和最大熵选择不同的状态。证明通过状态的几个副本上的正恒等式来约束边缘谱的矩，其中一些副本旋转翻转，并通过这些矩中的多项式来约束熵。四量子位最大值有解析证明；七个量子位的证明以及下面的一些四量子位的改进是由计算机辅助的，具有精确的算术和严格的误差范围。\n\n我们还证明了所有阶 Rényi 熵的 Gour--Wallach 猜想，其中最大值从 $M_4$ 变为 $q_*\\approx1.588$ 处的簇状态，并获得尖锐的 Tsallis 边界、混合状态边界和定量稳定性。", "authors": [{"name": "Antony Lewis"}], "featured_authors": [{"name": "Antony Lewis"}], "author_count": 1}, {"id": "2611.05865", "category": "quant-ph", "title": "Symmetry-guided algorithms for variational quantum optimization", "abstract": "Quantum numbers associated with symmetries classify quantum states and identify the sectors relevant to a given simulation. Generic hardware-efficient ansatzes do not necessarily preserve the quantum numbers and may therefore explore states outside the target sector. We develop symmetry-guided algorithms based on the quantum-accessible Hilbert--Schmidt asymmetry (\\(\\AHS\\)), which quantifies the deviation of a quantum state from invariance under a specified symmetry group. This quantity guides the optimization toward a highly reduced symmetry-based target sector, without enforcing the symmetry on the preparation circuit. We demonstrate the approach as a proof of principle in variational quantum eigensolver calculations targeting singlet ground states with collective SU(2) symmetry. The applications include a five-qubit \\(S\\)-wave \\(p+{}^3\\mathrm{He}\\) two-cluster Hamiltonian, deduced from \\textit{ab initio} many-body calculations, and collective spin models with up to 12 particles, which provide a many-particle benchmark of asymmetry-guided optimization. Across these applications, \\(\\AHS\\)-based guidance increases the singlet probability. Overall, the proposed algorithms improve energy accuracy during optimization and ground-state fidelity compared with direct energy minimization, with substantial fidelity improvements in the larger spin systems. These results demonstrate the utility of an asymmetry objective determined by the group action, independently of the Hamiltonian energy, for improving the reliability of variational quantum optimization.", "url": "https://arxiv.org/abs/2611.05865", "type": "理论+数值", "summary": "与对称性相关的量子数对量子态进行分类并识别与给定模拟相关的扇区。通用硬件高效模拟不一定保留量子数，因此可能会探索目标扇区之外的状态。我们开发基于量子可访问的希尔伯特-施密特不对称性（\\(\\AHS\\)）的对称引导算法，该算法量化了指定对称群下量子态与不变性的偏差。该量引导优化朝着高度降低的基于对称性的目标扇区进行，而无需在准备电路上强制对称性。我们证明该方法是针对具有集体 SU(2) 对称性的单线态基态的变分量子本征解算器计算的原理证明。这些应用包括从 \\textit{ab initio} 多体计算推导出来的五量子位 \\(S\\) 波 \\(p+{}^3\\mathrm{He}\\) 二簇哈密顿量，以及最多 12 个粒子的集体自旋模型，这些模型提供了不对称引导优化的多粒子基准。在这些应用中，基于 \\(\\AHS\\) 的引导增加了单线态概率。\n\n总体而言，与直接能量最小化相比，所提出的算法提高了优化过程中的能量精度和基态保真度，并且在较大的自旋系统中保真度得到了显着提高。这些结果证明了由群作用确定的不对称目标的实用性，与哈密顿能量无关，可提高变分量子优化的可靠性。", "authors": [{"name": "Eunjin In"}, {"name": "Kristina D. Launey"}, {"name": "Darin C. Mumma"}, {"name": "James A. Sauls"}], "featured_authors": [{"name": "Eunjin In"}, {"name": "Kristina D. Launey"}, {"name": "Darin C. Mumma"}, {"name": "James A. Sauls"}], "author_count": 4}, {"id": "2611.05955", "category": "quant-ph", "title": "The Structure of Shared Classical Facts in Quantum Systems", "abstract": "Perfectly matching local outcomes need not constitute a nondisturbing shared classical record. For finite-dimensional multipartite states, we prove that nontrivial exact records are equivalent to a spectrum sharing structure with a unique finest decomposition into locally distinguishable sectors, where entanglement may persist. For a fixed complete pointer, exact sharing is equivalent to strong quantum Darwinism together with global nondisturbance, while spectrum broadcast structure additionally requires conditional independence. Arbitrarily weak full-rank admixtures eliminate exact sharing, but two-sided distance bounds quantify robustness through disturbance and disagreement, while information bounds connect accurate local readouts to observer consensus.", "url": "https://arxiv.org/abs/2611.05955", "type": "理论", "summary": "完美匹配的当地结果不一定构成不令人不安的共享经典记录。对于有限维多部分状态，我们证明非平凡的精确记录相当于频谱共享结构，具有独特的最精细分解为局部可区分的扇区，其中纠缠可能持续存在。对于固定的完整指针来说，精确共享相当于强量子达尔文主义和全局无扰性，而频谱广播结构还需要条件独立性。任意弱的满秩混合消除了精确共享，但两侧距离界限通过干扰和分歧来量化鲁棒性，而信息界限将准确的本地读数与观察者共识联系起来。", "authors": [{"name": "Jie Gu"}], "featured_authors": [{"name": "Jie Gu"}], "author_count": 1}, {"id": "2611.05975", "category": "quant-ph", "title": "Sample-based Quantum Diagonalization via Density Matrix Renormalization Group", "abstract": "We introduce SqDMRG, which combines sample-based quantum diagonalization (SQD) with the density matrix renormalization group (DMRG). SqDMRG expands the sampled determinant space into a product of fragment spaces constructed from the samples, and solves the Hamiltonian in this product space using DMRG. We demonstrate the method on benzene pentamer and decamer clusters using classical reference samples, and on the pentamer using quantum samples obtained from the IBM Quantum Nighthawk r2 processor ibm phoenix. It achieves sub-kcal/mol accuracy with far fewer configurations than direct diagonalization.", "url": "https://arxiv.org/abs/2611.05975", "type": "理论+数值", "summary": "我们引入了 SqDMRG，它将基于样本的量子对角化（SQD）与密度矩阵重整化群（DMRG）相结合。 SqDMRG 将采样的行列式空间扩展为由样本构造的片段空间的乘积，并使用 DMRG 求解该乘积空间中的哈密顿量。我们使用经典参考样本演示了苯五聚体和十聚体簇的方法，并使用从 IBM Quantum Nighthawk r2 处理器 ibm phoenix 获得的量子样本演示了五聚体的方法。它以比直接对角化少得多的配置实现亚千卡/摩尔精度。", "authors": [{"name": "Yuto Sugimoto"}, {"name": "Tomonori Shirakawa"}, {"name": "Yukio Kawashima"}, {"name": "Toshinari Itoko"}, {"name": "Seiji Yunoki"}], "featured_authors": [{"name": "Yuto Sugimoto"}, {"name": "Tomonori Shirakawa"}, {"name": "Yukio Kawashima"}, {"name": "Toshinari Itoko"}, {"name": "Seiji Yunoki"}], "author_count": 5}, {"id": "2611.05976", "category": "quant-ph", "title": "Collectively pumped superradiant laser with coherence scaling beyond the standard quantum limit", "abstract": "For more than half a century, the standard quantum limit (SQL) was thought to limit the laser coherence $\\mathfrak{C}$ -- the number of photons emitted from the laser into the beam in one coherence time -- to a scaling $\\Theta(\\mu^2)$, where $\\mu$ is the mean number of optical-frequency excitations stored inside the laser. However, recently it has been shown [Baker et al., Nat. Phys. 17, 179 (2021)] that the Heisenberg limit -- an achievable ultimate limit set by quantum mechanics for the task of producing a beam with the standard properties of a laser beam -- is $\\mathfrak{C}=\\Theta(\\mu^4)$, a quadratic enhancement. So far, proposals to demonstrate beyond-SQL scaling of $\\mathfrak{C}$ have been limited to circuit QED, at microwave frequencies (i.e., a maser). Here, we introduce a class of generalized far-above-threshold (FAT) laser models, obtained by replacing the ordinary bosonic lowering operator $\\hat{a}$ by a general lowering operator $\\hat{L}$ in the superoperators appearing in the master equation that governs the FAT laser dynamics. We then show that an optical-frequency superradiant laser in the bad-cavity limit, with feedback-controlled collective pumping, realizes one such model, in which $\\hat{L}$ is identified with the collective superradiant lowering operator $\\hat{J}$. This model can surpass the SQL scaling, with the coherence exhibiting a scaling as large as $\\mathfrak{C}= \\Theta(\\mu^{8/3})$ in the optimal parameter regime. Here, in the bad-cavity limit, $\\mu\\approx N/2$, where $N$ is the number of superradiant atoms.", "url": "https://arxiv.org/abs/2611.05976", "type": "理论", "summary": "半个多世纪以来，标准量子极限 (SQL) 被认为将激光相干性 $\\mathfrak{C}$（在一个相干时间内从激光器发射到光束中的光子数量）限制为 $\\Theta(\\mu^2)$，其中 $\\mu$ 是激光器内部存储的光频激励的平均数量。然而，最近它已被证明[Baker et al., Nat.物理。 17, 179 (2021)]海森堡极限——量子力学为产生具有激光束标准特性的光束而设定的可实现的最终极限——是 $\\mathfrak{C}=\\Theta(\\mu^4)$，是二次增强。到目前为止，证明 $\\mathfrak{C}$ 超出 SQL 扩展的提议仅限于微波频率（即微波激射器）下的电路 QED。在这里，我们介绍一类广义远高于阈值（FAT）激光模型，该模型是通过在控制 FAT 激光动力学的主方程中出现的超级算子 $\\hat{L}$ 中替换普通玻色子降低算子 $\\hat{a}$ 来获得的。\n\n然后，我们证明了坏腔极限中的光频超辐射激光器，具有反馈控制的集体泵浦，实现了这样一个模型，其中 $\\hat{L}$ 与集体超辐射降低算子 $\\hat{J}$ 相同。该模型可以超越 SQL 缩放，在最佳参数范围内，一致性表现出与 $\\mathfrak{C}= \\Theta(\\mu^{8/3})$ 一样大的缩放。这里，在坏腔限制中，$\\mu\\approx N/2$，其中$N$是超辐射原子的数量。", "authors": [{"name": "Ori Somech"}, {"name": "Howard M. Wiseman"}], "featured_authors": [{"name": "Ori Somech"}, {"name": "Howard M. Wiseman"}], "author_count": 2}, {"id": "2611.05985", "category": "quant-ph", "title": "Quantum Key Exchange from Public Quantum Money", "abstract": "Two-message quantum key exchange (2QKE) cannot be realized in a statistically secure way, and therefore some computational assumptions are required. So far, the known weakest assumption for 2QKE is the existence of one-way functions (OWFs). Can we construct 2QKE from a weaker assumption than OWFs? In this paper, we give the first complete characterization of 2QKE. We show that the following four primitives are (existentially) equivalent: everlasting-secure 2QKE, standard 2QKE, efficiently-verifiable state puzzles (EV-StatePuzzs), and one-time secure digital signatures with quantum signatures and signing keys. Because EV-StatePuzzs are potentially weaker than OWFs [Kretschmer, Qian and Tal 2025], the equivalence implies that 2QKE are potentially weaker than OWFs. Moreover, our result shows the equivalence between standard 2QKE and everlasting-secure 2QKE, which means that everlasting security comes for free. Finally, one-shot signatures, quantum lightning, and public-key quantum money mini-schemes imply EV-StatePuzzs, and therefore, our result also gives a new lowerbound, namely everlasting-secure 2QKE, of these public-key unclonable primitives. We also show that one-shot signatures imply QPKE with quantum public keys. [Kitagawa, Morimae,Nishimaki and Yamakawa, 2024] constructed QPKE with quantum public keys from OWFs, and it was open whether QPKE with quantum public keys can be constructed from an assumption weaker than or incomparable to OWFs. Our result gives a potential answer to this question since one-shot signatures seem to be incomparable with OWFs. Moreover, QPKE constructed from one-shot signatures has an additional functionality, which we call certified freeze, that allows the receiver to publish a publicly verifiable classical certificate that computationally binds the receiver to an upper bound on the total number of distinct valid ciphertexts under its verification key.", "url": "https://arxiv.org/abs/2611.05985", "type": "理论", "summary": "两消息量子密钥交换（2QKE）无法以统计上安全的方式实现，因此需要一些计算假设。到目前为止，已知的 2QKE 最弱假设是单向函数 (OWF) 的存在。我们能否从比 OWF 更弱的假设构建 2QKE？在本文中，我们首次给出了 2QKE 的完整表征。我们证明以下四个原语（存在）是等效的：永久安全的 2QKE、标准 2QKE、高效可验证的状态谜题（EV-StatePuzzs）以及具有量子签名和签名密钥的一次性安全数字签名。由于 EV-StatePuzzs 可能比 OWF 弱 [Kretschmer、Qian 和 Tal 2025]，因此等价性意味着 2QKE 可能比 OWF 弱。此外，我们的结果显示了标准 2QKE 和永久安全 2QKE 之间的等效性，这意味着永久安全是免费的。最后，一次性签名、量子闪电和公钥量子货币迷你方案意味着 EV-StatePuzzs，因此，我们的结果还给出了这些公钥不可克隆原语的新下界，即永久安全 2QKE。\n\n我们还表明，一次性签名意味着带有量子公钥的 QPKE。 [Kitakawa、Morimae、Nishimaki 和 Yamakawa，2024] 使用 OWF 的量子公钥构建了 QPKE，并且是否可以根据比 OWF 弱或无法比较的假设来构建使用量子公钥的 QPKE 是开放的。我们的结果为这个问题提供了一个潜在的答案，因为一次性签名似乎与 OWF 无法相比。此外，由一次性签名构建的 QPKE 具有一项附加功能，我们称之为认证冻结，它允许接收者发布一个可公开验证的经典证书，该证书通过计算将接收者绑定到其验证密钥下的不同有效密文总数的上限。", "authors": [{"name": "Eli Goldin"}, {"name": "Tomoyuki Morimae"}], "featured_authors": [{"name": "Eli Goldin"}, {"name": "Tomoyuki Morimae"}], "author_count": 2}, {"id": "2611.06124", "category": "quant-ph", "title": "A Post-Quantum Interactive Hashing Theorem", "abstract": "Interactive hashing, introduced by Ostrovsky, Venkatesan, and Yung [OVY93], is a building block in many cryptographic protocols, including perfectly hiding commitments from one-way permutations [NOVY92]. Its multi-output generalization is a key ingredient in constructions of statistical zero-knowledge arguments for NP and statistically hiding commitments from arbitrary one-way functions [NOV06,HR07]. In this note, we give a post-quantum security proof for this multi-output interactive hashing protocol with arbitrary relations.", "url": "https://arxiv.org/abs/2611.06124", "type": "理论", "summary": "交互式哈希由 Ostrovsky、Venkatesan 和 Yung [OVY93] 提出，是许多加密协议的构建块，包括完美隐藏单向排列的承诺 [NOVY92]。它的多输出泛化是构建 NP 统计零知识论证和统计隐藏任意单向函数承诺的关键要素 [NOV06,HR07]。在这篇文章中，我们为这种具有任意关系的多输出交互式哈希协议提供了后量子安全证明。", "authors": [{"name": "Céline Chevalier"}, {"name": "Laurent Holin"}, {"name": "Quoc-Huy Vu"}], "featured_authors": [{"name": "Céline Chevalier"}, {"name": "Laurent Holin"}, {"name": "Quoc-Huy Vu"}], "author_count": 3}, {"id": "2611.06215", "category": "quant-ph", "title": "Spatial Cost of Recovering a Fusion Qubit in a Critical Spin Chain", "abstract": "Vanishing-error recovery of a fusion qubit from a fixed-sector ground doublet of four Kramers--Wannier defects in a critical Ising chain requires at least the shorter three-defect span of physical spins to leading order. Across arbitrary preselected spin sets and unrestricted joint decoding, this bound holds when the thermodynamic limit precedes large spacings at fixed positive ratios. An exact interval decoder attains it. Collective records of both logical axes in the complement force successful near-minimal supports to concentrate in density on a leading-order shortest interval.", "url": "https://arxiv.org/abs/2611.06215", "type": "理论", "summary": "从关键伊辛链中的四个克莱默-万尼尔缺陷的固定扇区接地双峰恢复聚变量子位的消失错误至少需要物理自旋到前序的较短的三缺陷跨度。在任意预选的自旋集和无限制的联合解码中，当热力学极限以固定的正比率先于大间距时，该界限成立。精确间隔解码器可以实现这一点。补体中两个逻辑轴的集体记录迫使成功的近最小支持集中在前导最短间隔的密度上。", "authors": [{"name": "Yi Liang"}], "featured_authors": [{"name": "Yi Liang"}], "author_count": 1}, {"id": "2611.06260", "category": "quant-ph", "title": "Connection of surface code patches based on entanglement distillation without postselection", "abstract": "Distributed quantum computing is a promising approach for overcoming the scalability limitations of fault-tolerant quantum computing. Entanglement distillation, a process that extracts higher-fidelity entangled states from noisy ones, plays a key role in distributed quantum computing. However, simple distillation protocols typically rely on postselection, which poses practical challenges for implementation. Here, we propose a scheme for distributed surface-code quantum computing that benefits from entanglement distillation even without postselection. Numerical simulations show that the logical error rates in the proposed scheme are lower than those in the setting without distillation. Additionally, we demonstrate that the logical error rates can be suppressed further by exploiting the asymmetry between spacelike and timelike errors in the surface code. The proposed scheme offers a practical and simple approach to distributed quantum computing with surface codes.", "url": "https://arxiv.org/abs/2611.06260", "type": "理论+数值", "summary": "分布式量子计算是克服容错量子计算的可扩展性限制的一种有前途的方法。纠缠蒸馏是一种从噪声纠缠态中提取更高保真度纠缠态的过程，在分布式量子计算中发挥着关键作用。然而，简单的蒸馏协议通常依赖于后选择，这给实施带来了实际挑战。在这里，我们提出了一种分布式表面代码量子计算方案，即使没有后选择，该方案也能从纠缠蒸馏中受益。数值模拟表明，该方案的逻辑错误率低于没有蒸馏的设置。此外，我们证明了通过利用表面代码中的类空错误和类时错误之间的不对称性可以进一步抑制逻辑错误率。所提出的方案为使用表面代码的分布式量子计算提供了一种实用且简单的方法。", "authors": [{"name": "Moeto Mishima"}, {"name": "Toshihiko Sasaki"}, {"name": "Yasunari Suzuki"}, {"name": "Koji Azuma"}, {"name": "Masato Koashi"}], "featured_authors": [{"name": "Moeto Mishima"}, {"name": "Toshihiko Sasaki"}, {"name": "Yasunari Suzuki"}, {"name": "Koji Azuma"}, {"name": "Masato Koashi"}], "author_count": 5}, {"id": "2611.06291", "category": "quant-ph", "title": "Bridging Pulse and Circuit Levels: A Geometric Framework for Deterministic Error Suppression", "abstract": "Quantum errors in noisy environments remain a major obstacle to advancing quantum information technology. Standard quantum error correction requires massive ancillary qubit overhead, motivating the need for hardware-efficient mitigation strategies. In this work, we propose a framework for dynamical quantum error correction at the circuit level, requiring no logical encoding or ancillary qubits. By extending a geometric framework (originally developed for creating dynamical error-correcting gates at the control pulse level) to the discrete dynamics of digital circuits, we map the accumulation of coherent errors to trajectories in a high-dimensional error space. We demonstrate that inserting deterministically optimized twirling gate sequences actively shapes these trajectories, utilizing destructive interference to keep the accumulated error bounded with error scaling $\\mathcal{O}(1)$. This deterministic path-shaping suppresses circuit errors fundamentally differently than the stochastic random-walk behavior of standard randomized compiling with error scaling $\\mathcal{O}(\\sqrt{N})$. Furthermore, we show that this circuit-level dynamical correction synergizes with pulse-level robust control, providing an analytical bridge between continuous noise dynamics and discrete q
