oise, this holds for full-system tripartitions, where correlations between the two sides require an error cluster to cross the buffer, an exponentially unlikely event. At strong noise, exponential decay holds whenever the buffer supports no logical operator, since correlations can persist only along rare chains of buffer qudits that remain informative. Under an additional space-uniformity assumption, we establish the robustness of Levin--Wen topological entropy. On finite-dimensional lattices of size $n$, the weak-noise bound further implies a constant-layer quasi-local Petz recovery channel of range $O(\\poly(\\log n)/\\varepsilon)$ that recovers the noiseless state within trace-distance error $\\varepsilon$. Both CMI bounds apply to general qLDPC interaction graphs, including geometries where such constant-depth quasi-local recovery need not exist. Thus, the exponential decay of the noise-induced CMI provides a general criterion for mixed-state phase stability.", "url": "https://arxiv.org/abs/2610.22357", "type": "理论", "summary": "量子低密度奇偶校验（qLDPC）码具有规范的混合状态——码空间上的归一化投影——位于量子纠错和量子多体物理的交叉点，但其信息论结构在局部噪声下的稳定性仍然知之甚少。物质混合态相的最新进展已确定条件互信息 (CMI) $I(A:C|B)$ 的空间衰减是这种稳定性的关键诊断，类似于量子基态光谱间隙的作用。我们证明，对于局部泡利噪声下 $\\mathbb{Z}_d$ qLDPC 稳定器代码的归一化代码投影器状态，将 $A$ 与 $C$ 分开的缓冲区 $B$ 上的 CMI 在两个互补噪声区域中随 $B$ 的宽度呈指数衰减，与系统大小无关。在弱噪声下，这适用于全系统三分区，其中两侧之间的相关性需要错误簇穿过缓冲区，这是一种指数级不可能发生的事件。在强噪声下，只要缓冲区不支持逻辑运算符，指数衰减就会成立，因为相关性只能沿着保留信息的缓冲区量子的稀有链持续存在。\n\n在额外的空间均匀性假设下，我们建立了 Levin-Wen 拓扑熵的鲁棒性。在大小为 $n$ 的有限维晶格上，弱噪声界限进一步意味着范围为 $O(\\poly(\\log n)/\\varepsilon)$ 的常量层准局部 Petz 恢复通道，可恢复迹线距离误差 $\\varepsilon$ 内的无噪声状态。两个 CMI 边界都适用于一般 qLDPC 交互图，包括不需要存在这种恒定深度准局部恢复的几何形状。因此，噪声引起的 CMI 的指数衰减为混合状态相位稳定性提供了通用标准。", "authors": [{"name": "Tai-Hsuan Yang"}, {"name": "Andrew D. Kim"}, {"name": "Akash Vijay"}, {"name": "Jong Yeon Lee"}], "featured_authors": [{"name": "Tai-Hsuan Yang"}, {"name": "Andrew D. Kim"}, {"name": "Akash Vijay"}, {"name": "Jong Yeon Lee"}], "author_count": 4}, {"id": "2610.22367", "category": "quant-ph", "title": "Discovering state-of-the-art quantum circuits with large language models", "abstract": "Significant efforts are currently being directed toward the implementation of large-scale quantum information processors, but realizing useful quantum advantage also requires the development of efficient quantum algorithms. While for many practical problems the dominant resource costs are associated with a small set of computational primitives, optimizing them in the quantum setting presents unique challenges, including a reversibility constraint absent from ordinary classical computation. Here we introduce an evolutionary framework in which large language models (LLMs) propose circuit designs and an independent evaluator verifies and scores them. We apply this framework to tasks spanning numerical computation, chemistry, optimization, quantum simulation, and number theory. In seven of the eight tasks, the discovered circuits significantly reduce both Toffoli and qubit counts relative to the state of the art. In the eighth, the search discovers a new reversible architecture for prime-field modular inversion. By handling reversibility differently, the architecture makes divsteps -- a classical algorithm previously impractical for reversible integer arithmetic -- viable and substantially improves the Toffoli-qubit trade-off for modular inversion. These results open the door for evaluator-guided LLM co-design of new algorithmic structures for quantum computation.", "url": "https://arxiv.org/abs/2610.22367", "type": "理论+数值", "summary": "目前正在大力实施大规模量子信息处理器，但实现有用的量子优势还需要开发高效的量子算法。虽然对于许多实际问题来说，主要的资源成本与一小组计算原语相关，但在量子环境中优化它们提出了独特的挑战，包括普通经典计算中不存在的可逆性约束。在这里，我们介绍了一个进化框架，其中大型语言模型（LLM）提出电路设计，并由独立评估者对其进行验证和评分。我们将该框架应用于数值计算、化学、优化、量子模拟和数论等领域的任务。在八项任务中的七项中，所发现的电路相对于现有技术显着减少了 Toffoli 和量子位计数。在第八个中，搜索发现了一种用于素数域模反演的新可逆架构。\n\n通过以不同方式处理可逆性，该架构使得 divsteps（一种以前对于可逆整数算术不切实际的经典算法）变得可行，并大大改善了模逆的 Toffoli 量子位权衡。这些结果为评估者引导的法学硕士共同设计量子计算新算法结构打开了大门。", "authors": [{"name": "Andi Gu"}, {"name": "Alek H. Kemeny"}, {"name": "Susanne F. Yelin"}, {"name": "Mikhail D. Lukin"}], "featured_authors": [{"name": "Andi Gu"}, {"name": "Alek H. Kemeny"}, {"name": "Susanne F. Yelin"}, {"name": "Mikhail D. Lukin"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
