模型中扭转控制的热力学异常。通过足够强的层间耦合，扭转会改变比热峰的数量和结构：单个峰可以分成两个，或者两个峰可以合并为一个，具体取决于允许的自旋方向的数量。这些变化在扭转角上是非单调的，并且在较窄的参数范围内发生，或者对于所检查的较大 q 值不存在。伴随的自旋纹理和涡流分布暗示了一幅物理图片，其中层间耦合的莫尔条纹调制重新组织了局部自旋对准和拓扑缺陷。在代表性情况下，峰值分裂与莫尔尺度上排列的几乎均匀的旋转区域和减少的涡旋数量一致。\n\n这些发现将扭曲确定为离散自旋系统集体热响应的控制参数，并提出了修改相变行为的可能性，包括中间 Berezinskii-Kosterlitz-Thouless 相的出现或抑制。", "authors": [{"name": "Ze-Heng Yu"}, {"name": "Liang He"}], "featured_authors": [{"name": "Ze-Heng Yu"}, {"name": "Liang He"}], "author_count": 2}, {"id": "2610.21955", "category": "cond-mat", "title": "Spin-1/2 Heisenberg diamond-like decorated honeycomb lattice in a magnetic field from the perspective of localized magnons and exact diagonalization", "abstract": "The spin-$1/2$ quantum Heisenberg model on the diamond-decorated honeycomb lattice in a magnetic field is investigated using complementary analytical and numerical methods. The ground-state phase diagram comprises Lieb-Mattis ferrimagnetic, dimer-tetramer, monomer-dimer, spin-canted, and saturated paramagnetic phases, giving rise to characteristic magnetization plateaus, continuous and discontinuous field-induced transitions. In the highly frustrated regime, a localized-magnon approach based on an effective classical lattice-gas model provides an accurate description of the low-temperature magnetism and thermodynamics in agreement with numerical results. At intermediate frustration, finite-temperature calculations reveal characteristic specific-heat signatures of the field-induced transitions including the development of Ising critical behavior at the field-induced transition between the monomer-dimer and Lieb-Mattis ferrimagnetic phase.", "url": "https://arxiv.org/abs/2610.21955", "type": "理论+数值", "summary": "使用互补的分析和数值方法研究了磁场中金刚石装饰的蜂窝晶格的自旋 $1/2$ 量子海森堡模型。基态相图包括利布-马蒂斯亚铁磁相、二聚体-四聚体、单体-二聚体、自旋倾斜相和饱和顺磁相，产生特征磁化平台、连续和不连续场诱导转变。在高度受挫状态下，基于有效经典晶格气体模型的局域磁振子方法提供了与数值结果一致的低温磁性和热力学的准确描述。在中间挫折时，有限温度计算揭示了场诱导转变的特征比热特征，包括单体二聚体和利布-马蒂斯亚铁磁相之间场诱导转变时伊辛临界行为的发展。", "authors": [{"name": "Katarina Karlova"}, {"name": "Malo Rouxel"}, {"name": "Jozef Strecka"}, {"name": "Andreas Honecker"}], "featured_authors": [{"name": "Katarina Karlova"}, {"name": "Malo Rouxel"}, {"name": "Jozef Strecka"}, {"name": "Andreas Honecker"}], "author_count": 4}, {"id": "2610.21962", "category": "cond-mat", "title": "Sluggish random walks with resetting: nonequilibrium aspects", "abstract": "We derive exact analytical expressions for the fixed-time probability distribution and the Laplace transform of the distribution of the first-passage time to reach a target for a sluggish random walk in one dimension subject to two different types of stochastic resetting: stochastic resetting at random Poisson-distributed times, and resetting implemented whenever a position threshold is reached. The optimal resetting rate that minimises the mean first-passage time is obtained as a function of the sluggishness parameter, while under threshold resetting the mean first-passage time to the origin is found to increase monotonically with the threshold. We also characterise the occupation-time statistics, retrieving a Lamperti-type distribution under free dynamics and under Poissonian resetting at rate for short observation times, a Gaussian distribution centred at half for long observation times, and a distinct deterministic limit under threshold resetting. To further characterise nonequilibrium aspects of resetting, we evaluate the distribution and mean of the cost incurred per reset under Poissonian resetting, and the cost rate under threshold resetting, for different (linear, power-law, exponential) cost functions, and find the same critical behaviour of the cost rate in the limits of a vanishing resetting rate and an infinite threshold, respectively. Numerical simulations validate with excellent accuracy our analytical formulae.", "url": "https://arxiv.org/abs/2610.21962", "type": "理论+数值", "summary": "我们推导了固定时间概率分布和首次通过时间分布的拉普拉斯变换的精确解析表达式，以达到一维缓慢随机游走的目标，受到两种不同类型的随机重置的影响：随机泊松分布时间的随机重置，以及每当达到位置阈值时实施的重置。获得最小化平均首次通过时间的最佳重置率作为迟缓参数的函数，而在阈值下重置到原点的平均首次通过时间被发现随着阈值单调增加。我们还描述了占用时间统计数据的特征，在自由动力学和短观察时间速率下的泊松重置下检索兰珀蒂型分布，在长观察时间下以一半为中心的高斯分布，以及阈值重置下的明显确定性限制。\n\n为了进一步表征重置的非平衡方面，我们评估了泊松重置下每次重置所产生的成本的分布和平均值，以及阈值重置下的成本率，对于不同的（线性、幂律、指数）成本函数，并分别在消失重置率和无限阈值的限制下找到成本率的相同关键行为。数值模拟以极高的精度验证了我们的分析公式。", "authors": [{"name": "Theophilus Dwamena Frimpong"}, {"name": "Léa Bresque"}, {"name": "Edgar Roldán"}], "featured_authors": [{"name": "Theophilus Dwamena Frimpong"}, {"name": "Léa Bresque"}, {"name": "Edgar Roldán"}], "author_count": 3}, {"id": "2610.21996", "category": "cond-mat", "title": "PANDA-D: Interface-free determination of two dynamic contact angles", "abstract": "Contact angles are central descriptors of wetting and capillary behavior at solid--fluid interfaces. Dynamic contact angles in molecular simulations are commonly extracted from two-dimensional liquid--vapor contours and near-wall tangent fits. We introduce PANDA-D, an extension of Predicting Angle from Nanoscale Density Analysis (PANDA) that determines both contact angles of a driven liquid roll without extracting an interface. The density profile measures occupied layer width but does not identify which meniscus is advancing. The method resolves this ambiguity by jointly fitting density and the layerwise center-of-mass displacement relative to the roll. A circular-meniscus model maps these profiles to receding and advancing angles and an effective near-wall offset. On synthetic rolls with prescribed angles, the reconstruction error is $0.29^\\circ$ root-mean-square. We then analyze force-driven Lennard--Jones rolls between crystalline walls. Joint fits reproduce both measured profiles, whereas density-only fits can match density while assigning incorrect asymmetry. The resulting angles agree with independently determined circle-fit angles to $0.84^\\circ$ root-mean-square. Across four wall--fluid attractions, the receding angle decreases and the advancing angle increases with force, approximately linearly over the studied ranges. By eliminating contour thresholds and near-wall tangent extrapolation from the primary estimate, the two-profile approach enables reproducible, automated angle analysis across molecular trajectories.", "url": "https://arxiv.org/abs/2610.21996", "type": "理论+数值", "summary": "接触角是固-液界面润湿和毛细管行为的核心描述因素。分子模拟中的动态接触角通常是从二维液-汽轮廓和近壁切线拟合中提取的。我们引入了 PANDA-D，它是纳米级密度分析 (PANDA) 预测角度的扩展，可在不提取界面的情况下确定驱动液体辊的两个接触角。密度分布测量占据的层宽度，但不能识别哪个弯月面正在前进。该方法通过联合拟合密度和相对于辊的分层质心位移来解决这种模糊性。圆形弯月面模型将这些轮廓映射到后退角和前进角以及有效的近壁偏移。在具有规定角度的合成卷上，重建误差为 $0.29^\\circ$ 均方根。然后我们分析了力驱动的伦纳德-琼斯在水晶壁之间的滚动。关节拟合再现了两个测量的轮廓，而仅密度拟合可以匹配密度，同时分配不正确的不对称性。所得角度与独立确定的圆拟合角度一致，达到 $0.84^\\circ$ 均方根。\n\n穿过四个壁流体吸引力，后退角随着力的增加而减小，前进角随着力的增加而增加，在研究范围内近似线性。通过从初步估计中消除轮廓阈值和近壁切线外推，双轮廓方法能够在分子轨迹上进行可重复的、自动化的角度分析。", "authors": [{"name": "Georgii K. Vandyshev"}, {"name": "Grigorii S. Gorkaev"}, {"name": "Nikolay D. Kondratyuk"}, {"name": "Kirill M. Gerke"}, {"name": "Ilia V. Kopanichuk"}], "featured_authors": [{"name": "Georgii K. Vandyshev"}, {"name": "Grigorii S. Gorkaev"}, {"name": "Nikolay D. Kondratyuk"}, {"name": "Kirill M. Gerke"}, {"name": "Ilia V. Kopanichuk"}], "author_count": 5}, {"id": "2610.22037", "category": "cond-mat", "title": "Exciton superfluidity in two-dimensional bilayers at zero and high magnetic fields", "abstract": "We study interlayer exciton superfluidity versus layer separation in two-dimensional electron-hole bilayers at zero magnetic field and quantum Hall bilayers at total filling $\\nu_T=1$. Unscreened Hartree-Fock theory predicts coherence at every finite separation, with an energy scale decaying inversely with separation at large distances. We examine how screening, correlations, and spatial instabilities modify this prediction. At zero field, we solve the linearized gap equation with the full momentum and frequency dependence of the interaction screened within the random-phase approximation, without an imposed cutoff. The apparent plasmon enhancement of pairing in the ladder approximation is largely cancelled by the second-order crossed-rung correction. Static screening determines the leading pairing exponent in the controlled high-density limit at fixed separation. At large separation, the pairing scale falls exponentially with squared separation while the instability persists. Extending this result to fixed density assumes Fermi-liquid layers and higher-order dynamical corrections subleading to the static pairing interaction. At high field, we obtain an analytic uniform Hartree-Fock saddle point in the lowest Landau level, coherent at every finite separation. Within Hartree-Fock theory, its finite-wave-vector collective-mode instability favors an excitonic supersolid, distinguishing loss of spatial uniformity from loss of coherence. We conjecture that the quantum Hall bilayer evolves continuously toward weak pairing of composite fermions, with a scale far below the mean-field prediction at large separation. This suppression could produce an apparent critical separation at finite temperature without a ground-state quantum phase transition. The comparison separates the existence, energy scale, and spatial stability of interlayer coherence.", "url": "https://arxiv.org/abs/2610.22037", "type": "理论+数值", "summary": "我们研究了零磁场下二维电子空穴双层和总填充 $\\nu_T=1$ 下量子霍尔双层中的层间激子超流性与层分离的关系。未屏蔽的 Hartree-Fock 理论预测了每次有限分离时的相干性，能量尺度与大距离分离呈反比衰减。我们研究筛选、相关性和空间不稳定性如何修改这一预测。在零场处，我们求解线性间隙方程，其具有在随机相位近似内筛选的相互作用的完整动量和频率依赖性，而没有强加的截止。阶梯近似中配对的明显等离子体增强在很大程度上被二阶交叉梯级校正所抵消。静态筛选确定固定间隔下受控高密度限制内的主要配对指数。在大分离时，配对规模随着分离的平方呈指数下降，同时不稳定性仍然存在。将此结果扩展到固定密度假设费米液体层和高阶动态校正导致静态配对相互作用。\n\n在高场下，我们在最低 Landau 能级中获得了一个解析均匀 Hartree-Fock 鞍点，在每个有限间隔处都是相干的。在哈特里-福克理论中，其有限波矢量集体模式不稳定性有利于激子超固体，区分空间均匀性的损失和相干性的损失。我们推测，量子霍尔双层不断向复合费米子的弱配对演化，其规模远低于大分离时的平均场预测。这种抑制可以在有限温度下产生明显的临界分离，而无需基态量子相变。比较区分了层间相干性的存在、能量尺度和空间稳定性。", "authors": [{"name": "Sankar Das Sarma"}, {"name": "Yang-Zhi Chou"}], "featured_authors": [{"name": "Sankar Das Sarma"}, {"name": "Yang-Zhi Chou"}], "author_count": 2}, {"id": "2610.22038", "category": "cond-mat", "title": "Partial Localization and Multifractality in Heterogeneous Population Growth with Resetting", "abstract": "We study a model of heterogeneous multiplicative growth with mean-field redistribution and independent local stochastic resetting. The model describes populations or wealth distributed over sites with quenched growth-rate heterogeneity, while resets represent random local extinction or bankruptcy events. At large redistribution or resetting rate, we find a delocalized phase and we compute the growth rate as well as the stationary distribution of the population of a given site. We show that reset-free growth episodes generate power-law stationary tails with site-dependent exponents. For weak resetting and redistribution, favorable sites can undergo long reset-free episodes and localize. This produces a partially localized phase, in which a finite fraction of the total population is carried by a small set of sites whose identity changes on an $O(1)$ time scale within a subextensive pool of $N^{u^\\star}$ favorable candidates, with $0<u^\\star<1$. We derive the corresponding growth rate from a saddle point analysis, and show that the averaged stationary fractions display multifractal behavior.", "url": "https://arxiv.org/abs/2610.22038", "type": "理论", "summary": "我们研究了具有平均场重新分布和独立局部随机重置的异质乘性增长模型。该模型描述了分布在增长率异质性已消除的地点的人口或财富，而重置则代表随机的局部灭绝或破产事件。在大的重新分布或重置率下，我们发现一个离域阶段，并计算给定地点人口的增长率和平稳分布。我们证明，无重置增长事件会产生具有依赖于位点的指数的幂律平稳尾部。对于弱重置和重新分配，有利的站点可以经历长时间的无重置事件并本地化。这产生了一个部分局部化阶段，其中总人口的有限部分由一小组站点携带，这些站点的身份在 $N^{u^\\star}$ 有利候选者的次广泛池中以 $O(1)$ 时间尺度变化，其中 $0<u^\\star<1$。我们从鞍点分析中得出相应的增长率，并表明平均平稳分数显示出多重分形行为。", "authors": [{"name": "Maximilien Bernard"}, {"name": "Giuseppe Del Vecchio Del Vecchio"}, {"name": "Jean-Philippe Bouchaud"}, {"name": "Pierre Le Doussal"}], "featured_authors": [{"name": "Maximilien Bernard"}, {"name": "Giuseppe Del Vecchio Del Vecchio"}, {"name": "Jean-Philippe Bouchaud"}, {"name": "Pierre Le Doussal"}], "author_count": 4}, {"id": "2610.22134", "category": "cond-mat", "title": "Putting a Temperature on Electron Correlation", "abstract": "It is common wisdom that a better understanding of how to quantify electron correlation should lead to more efficient treatments of the correlation problem. Here, we not only substantiate this view but turn it into a concrete, systematic framework for ground states. Since prominent correlation measures such as the nonfreeness depend only on the one-particle reduced density matrix, modeling the correlation energy as a function of such a measure naturally places the framework within reduced density matrix functional theory, while keeping the cost at mean-field level. Strikingly, the variable conjugate to the measure emerges as a ``correlation temperature'', thereby connecting correlation measures, functional theory, and effective temperatures. The framework rationalizes methods such as i-DMFT, and we illustrate its key concepts analytically for the Hubbard dimer and numerically for small molecular systems. This brings a fundamental question within reach: how much of the correlation problem can be solved at mean-field cost?", "url": "https://arxiv.org/abs/2610.22134", "type": "理论+数值", "summary": "人们普遍认为，更好地理解如何量化电子相关性应该有助于更有效地处理相关性问题。在这里，我们不仅证实了这一观点，还将其转化为具体的、系统的基态框架。由于诸如非自由度之类的显着相关性度量仅取决于单粒子约化密度矩阵，因此将相关能量建模为此类度量的函数自然地将框架置于约化密度矩阵泛函理论中，同时将成本保持在平均场水平。引人注目的是，与测量值共轭的变量以“相关温度”的形式出现，从而将相关测量值、泛函理论和有效温度联系起来。该框架合理化了 i-DMFT 等方法，并且我们通过哈伯德二聚体的分析和小分子系统的数值说明了其关键概念。这就带来了一个基本问题：有多少相关问题可以以平均场成本得到解决？", "authors": [{"name": "Paul G. Graf"}, {"name": "Florian Matz"}, {"name": "Markus Penz"}, {"name": "Christian Schilling"}], "featured_authors": [{"name": "Paul G. Graf"}, {"name": "Florian Matz"}, {"name": "Markus Penz"}, {"name": "Christian Schilling"}], "author_count": 4}, {"id": "2610.22140", "category": "cond-mat", "title": "A rigid commensurate host and a defect that switches: vacancies in the frustrated alternating spin-(1, 1/2) Heisenberg chain", "abstract": "The alternating spin-$(1,\\tfrac12)$ Heisenberg chain with a frustrating next-nearest-neighbor coupling $J_2$ loses its Lieb--Mattis moment through a discontinuous transition to a singlet whose nature was left open. Using an SU(2)-symmetric density-matrix renormalization group, in which the total spin is a quantum-number label, we identify that phase and follow a single vacancy through it. The total spin collapses directly from $S=L/4$ to $S=0$, with no partially polarized window. The singlet phase is critical: its singlet--triplet gap closes as $1/L$, its entanglement entropy grows logarithmically with a central charge $c\\simeq1.8$, and its modulation wavevector, extrapolated from $L=80$ to $200$, is commensurate at $3\\pi/4$ and independent of $J_2$ to $5\\times10^{-5}$. Removing the central $S=1$ site switches the ground state of the doped chain from a triplet to a singlet at $J_2^{\\ast}=0.3068(3)$, where the host shows no feature; the triplet is not bound to the vacancy but spread over one of the two segments it leaves. The transmission of correlations through the vacancy saturates at a finite value below $J_2^{\\ast}$, $T(\\infty)=0.102(15)$ and $0.036(9)$ at $J_2=0.28$ and $0.30$, and the cut-chain law $T\\propto L^{-1}$ is excluded on both sides. We also show that the longitudinal correlator is not an observable in a triplet sector.", "url": "https://arxiv.org/abs/2610.22140", "type": "理论", "summary": "具有令人沮丧的次近邻耦合 $J_2$ 的交替自旋 $(1,\\tfrac12)$ 海森堡链通过不连续过渡到性质保持开放的单线态而失去了其 Lieb--Mattis 矩。使用 SU(2) 对称密度矩阵重正化群（其中总自旋是量子数标签），我们识别该相并跟踪其中的单个空位。总自旋直接从 $S=L/4$ 塌缩到 $S=0$，没有部分偏振窗口。单重态相至关重要：其单重态-三重态能隙接近$1/L$，其纠缠熵随中心电荷$c\\simeq1.8$呈对数增长，其调制波矢从$L=80$外推到$200$，在$3\\pi/4$处相当，并且独立于$J_2$至$5\\times10^{-5}$。删除中心 $S=1$ 位点将掺杂链的基态从三重态切换为 $J_2^{\\ast}=0.3068(3)$ 处的单重态，其中主体不显示任何特征；三元组不与空位绑定，而是分布在它留下的两个段之一上。\n\n在$J_2=0.28$和$0.30$处，通过空位的相关性传输在低于$J_2^{\\ast}$、$T(\\infty)=0.102(15)$和$0.036(9)$的有限值处饱和，并且在两侧均排除了割链定律$T\\propto L^{-1}$。我们还表明，纵向相关器在三重态扇区中不是可观的。", "authors": [{"name": "R. L. Silva"}, {"name": "R. C. Silva"}, {"name": "A. R. Pereira"}], "featured_authors": [{"name": "R. L. Silva"}, {"name": "R. C. Silva"}, {"name": "A. R. Pereira"}], "author_count": 3}, {"id": "2610.22191", "category": "cond-mat", "title": "Attention over noisy examples: generalization and memorization in the exponential Hopfield network", "abstract": "In Hebbian learning from examples a Hopfield network of $N$ neurons is not supplied with the $K$ archetypes it has to retrieve but with $M$ blurred examples of each, of quality $r$, and whether it can infer them depends on the load $\\alpha=K/N$ (interference among them) and on the dataset entropy $\\rho=(1-r^2)/(Mr^2)$ (how little the examples say about them). We transfer this protocol to the exponential Hopfield model, whose zero-temperature update is a step of softmax attention with the unlabelled examples as keys. A signal-to-noise analysis gives in closed form the overlap between the output and an unseen archetype, $m^{(1)}={\\rm erf}(1/\\sqrt{2\\rho_{\\rm eff}})$: the majority-rule law of the pairwise model at small load, with $\\rho$ replaced by an attention entropy $\\rho_{\\rm eff}$ built from the weight the softmax gives to the correct class and the number of examples it spreads it over. Two consequences follow. First, in a window of inverse temperatures $\\beta$ that widens as $\\sqrt N$ the interference between archetypes is exponentially small in $N\\beta$: the load drops out and the number of archetypes that can be learnt grows as $\\exp(c\\sqrt N)$. Second, learning fails differently: in the pairwise model through a spin-glass phase, in the exponential model through memorization: the softmax concentrates its weight on the training example closest to the input and returns it in place of the archetype. Seen from the input the softmax weights are those of the random energy model, and memorization is its freezing transition, at $\\beta\\sqrt{N(1-r^2)}\\simeq\\sqrt{2\\ln M}$; it is measurable on a head whose keys are examples as the number of examples carrying weight. On MNIST the diagnostic follows the random-energy prediction; on fashion-MNIST it detects sub-clusters in the classes, and the best accuracy lies beyond the memorization threshold, where the softmax reads out a local sub-prototype.", "url": "https://arxiv.org/abs/2610.22191", "type": "理论", "summary": "在 Hebbian 从示例中学习的过程中，$N$ 神经元的 Hopfield 网络没有提供它必须检索的 $K$ 原型，而是提供了每个 $M$ 的模糊示例，质量为 $r$，并且它是否可以推断它们取决于负载 $\\alpha=K/N$ （它们之间的干扰）和数据集熵 $\\rho=(1-r^2)/(Mr^2)$ （示例对它们的描述有多么少）。我们将该协议转移到指数 Hopfield 模型，其零温度更新是 softmax 注意力的一个步骤，以未标记的示例作为键。信噪分析以封闭形式给出了输出和看不见的原型之间的重叠，$m^{(1)}={\\rm erf}(1/\\sqrt{2\\rho_{\\rm eff}})$：小负载下成对模型的多数规则法则，其中 $\\rho$ 替换为注意力熵 $\\rho_{\\rm eff}$，该熵是根据 softmax 赋予正确类别的权重构建的它传播的例子的数量。接下来有两个后果。首先，在逆温 $\\beta$ 的窗口中，随着 $\\sqrt N$ 的扩大，原型之间的干扰在 $N\\beta$ 中呈指数级小：负载下降，可学习的原型数量随着 $\\exp(c\\sqrt N)$ 增长。\n\n其次，学习失败的方式不同：在通过自旋玻璃阶段的成对模型中，在通过记忆的指数模型中：softmax 将其权重集中在最接近输入的训练示例上，并将其返回以代替原型。从输入来看，softmax权重是随机能量模型的权重，记忆是其冻结转变，位于$\\beta\\sqrt{N(1-r^2)}\\simeq\\sqrt{2\\ln M}$；它可以在一个头部上进行测量，其关键是作为承载重量的样本数量。在 MNIST 上，诊断遵循随机能量预测；在 Fashion-MNIST 上，它检测类中的子簇，并且最好的准确度超出了记忆阈值，其中 softmax 读出局部子原型。", "authors": [{"name": "Francesco Alemanno"}], "featured_authors": [{"name": "Francesco Alemanno"}], "author_count": 1}, {"id": "2610.22361", "category": "cond-mat", "title": "Band-Resolved Superconducting Gaps via the Thermal Hall Effect in CeRu2", "abstract": "Standard bulk probes of multiband superconductors cannot assign pairing gaps to specific electron or hole Fermi surfaces. Here we show that thermal Hall transport ($\\kappa_{xy}$), constrained by specific heat and normal-state magnetotransport, resolves this ambiguity in the compensated heavy-fermion superconductor CeRu$_2$. Fixing the gap magnitudes ($\\Delta_e/k_B\\approx 13$K, $\\Delta_h/k_B\\approx 8$K) and band mobilities completely determines the electronic degrees of freedom in $\\kappa_{xx}$ and $\\kappa_{xy}$. A low-field sign reversal in $\\kappa_{xy}$ places the larger gap on the heavy Ce $4f$ electron sheets and the smaller on the hole sheets.", "url": "https://arxiv.org/abs/2610.22361", "type": "数值", "summary": "多带超导体的标准体探针无法将配对间隙分配给特定的电子或空穴费米表面。在这里，我们展示了受比热和正常状态磁输运约束的热霍尔输运 ($\\kappa_{xy}$)，解决了补偿重费米子超导体 CeRu$_2$ 中的这种模糊性。固定能隙大小（$\\Delta_e/k_B\\约13$K，$\\Delta_h/k_B\\约8$K）和能带迁移率完全确定$\\kappa_{xx}$和$\\kappa_{xy}$中的电子自由度。 $\\kappa_{xy}$ 中的低场符号反转使重 Ce $4f$ 电子片上的间隙较大，而孔片上的间隙较小。", "authors": [{"name": "Darian Hall"}, {"name": "Luke Pritchard Cairns"}, {"name": "Nico Rowland"}, {"name": "Yuanqi Lyu"}, {"name": "Kohtaro Yamakawa"}, {"name": "Josue Rodriguez"}, {"name": "Kirin Chanteloup"}, {"name": "Didier Perrodin"}, {"name": "Joel E. Moore"}, {"name": "James G. Analytis"}], "featured_authors": [{"name": "Darian Hall"}, {"name": "Luke Pritchard Cairns"}, {"name": "Nico Rowland"}, {"name": "Didier Perrodin"}, {"name": "Joel E. Moore"}, {"name": "James G. Analytis"}], "author_count": 10}, {"id": "2610.20696", "category": "hep-th", "title": "Worldsheet string theory on $\\mathrm{AdS}_3 \\times \\mathbf{S}^3 \\times \\mathrm{K3}$", "abstract": "The RNS formalism describing string theory on $\\mathrm{AdS}_3 \\times \\mathbf{S}^3 \\times \\mathrm{K3}$ supported by pure NS-NS flux is in principle straightforward to write down. One can directly check that the worldsheet theory reproduces the correct chiral spectrum expected from supergravity by analyzing the BRST cohomology. However, when one attempts to construct the worldsheet partition function using the standard rules of the RNS formalism by appropriately summing over spin structures to ensure worldsheet modular invariance, one finds a result in tension with spacetime supersymmetry. We explain why this is the case and, more importantly, propose a resolution. Specifically, we fix the physical state projection for the partition function uniquely by requiring spacetime supersymmetry. Perhaps surprisingly, the projected worldsheet partition function does not factorize into a bosonic and a fermionic part and involves functions that are not modular covariant. As a consistency check, we show that our prescription for the worldsheet partition function reproduces the supergravity spectrum for both Type IIB and IIA theories. Furthermore, we compute the elliptic genus of the dual CFT from the worldsheet, which has both a holomorphic short string and a non-holomorphic long string contribution. The latter displays characteristics of a mock modular function, albeit with some key differences, while the former has the tantalizing structure of a symmetric orbifold. We also point out the worldsheet construction of a non-supersymmetric theory, whose spectrum is free of tachyons.", "url": "https://arxiv.org/abs/2610.20696", "type": "理论", "summary": "描述由纯 NS-NS 通量支持的 $\\mathrm{AdS}_3 \\times \\mathbf{S}^3 \\times \\mathrm{K3}$ 上的弦论的 RNS 形式原则上很容易写出来。通过分析 BRST 上同调，可以直接检查世界表理论是否再现了超引力所预期的正确手征谱。然而，当人们尝试使用 RNS 形式主义的标准规则，通过对自旋结构进行适当求和来构建世界表配分函数以确保世界表模不变性时，人们会发现与时空超对称性存在张力的结果。我们解释为什么会出现这种情况，更重要的是，提出解决方案。具体来说，我们通过要求时空超对称性来唯一地修复配分函数的物理状态投影。也许令人惊讶的是，投影的世界表划分函数不会分解为玻色子和费米子部分，并且涉及非模协变的函数。作为一致性检查，我们表明我们对世界表配分函数的规定再现了 IIB 型和 IIA 理论的超重力谱。\n\n此外，我们从世界表计算对偶 CFT 的椭圆亏格，它既有全纯短弦贡献，也有非全纯长弦贡献。后者显示了模拟模块化函数的特征，尽管存在一些关键差异，而前者则具有对称轨道折叠的诱人结构。我们还指出了非超对称理论的世界表构造，其谱不包含快子。", "authors": [{"name": "Lorenz Eberhardt"}, {"name": "Matthias R. Gaberdiel"}, {"name": "Sameer Murthy"}, {"name": "Mukund Rangamani"}], "featured_authors": [{"name": "Lorenz Eberhardt"}, {"name": "Matthias R. Gaberdiel"}, {"name": "Sameer Murthy"}, {"name": "Mukund Rangamani"}], "author_count": 4}, {"id": "2610.20699", "category": "hep-th", "title": "An SYK wormhole under the microscope", "abstract": "We derive a large-N wormhole saddle in the Sachdev-Ye-Kitaev (SYK) model for the variance of the thermal one-point function of a heavy operator across realizations of the microscopic couplings. We propose that this saddle describes a double trumpet geometry. In the double-scaling limit, we express the wormhole as a transition amplitude in an emergent bulk Hilbert space of chords connecting the two boundaries. In the Schwarzian limit, the chords proliferate and the wormhole defines a quantum transition amplitude in the open-universe Hilbert space of Jackiw-Teitelboim (JT) gravity. Comparing the SYK wormhole amplitude with its counterpart in JT gravity coupled to matter provides a direct test of the heavy-operator randomness hypothesis in SYK. The microscopic SYK couplings specify the {\\alpha}-parameters of the wormhole. For a fixed realization of the couplings, we compute the observable in the corresponding {\\alpha}-state. We provide the bulk wavefunction of the associated half-wormhole, which exhibits erratic correlations in the length basis that do not self-average. We extend the bulk description to the Hilbert space of a closed universe. We point out that the correlation chords from which the wormhole geometry emerges structurally resemble local observer worldlines.", "url": "https://arxiv.org/abs/2610.20699", "type": "理论", "summary": "我们在 Sachdev-Ye-Kitaev (SYK) 模型中推导了一个大 N 虫洞鞍，用于解决重算子在微观耦合实现中的热单点函数的方差。我们建议该鞍座描述双喇叭几何形状。在双尺度极限下，我们将虫洞表示为连接两个边界的弦的突现体希尔伯特空间中的过渡幅度。在施瓦茨极限中，弦扩散，虫洞定义了杰克-泰特尔博伊姆（JT）引力的开放宇宙希尔伯特空间中的量子跃迁幅度。将 SYK 虫洞振幅与与物质耦合的 JT 引力中的对应振幅进行比较，可以直接检验 SYK 中的重算子随机性假设。微观 SYK 耦合指定了虫洞的 {\\alpha} 参数。对于耦合的固定实现，我们计算相应的 {\\alpha} 状态下的可观测值。我们提供了相关半虫洞的体波函数，它在长度基础上表现出不稳定的相关性，不能自平均。我们将批量描述扩展到封闭宇宙的希尔伯特空间。\n\n我们指出，虫洞几何形状的相关弦在结构上类似于本地观察者的世界线。", "authors": [{"name": "Valérie Bettaque"}, {"name": "Martin Sasieta"}, {"name": "Brian Swingle"}, {"name": "Alejandro Vilar López"}], "featured_authors": [{"name": "Valérie Bettaque"}, {"name": "Martin Sasieta"}, {"name": "Brian Swingle"}, {"name": "Alejandro Vilar López"}], "author_count": 4}, {"id": "2610.20701", "category": "hep-th", "title": "Region bounds, error margins and certified positivity in the numerical conformal bootstrap; Or the first mathematically rigorous bounds on the 3d Ising CFT critical exponents", "abstract": "Numerical conformal bootstrap bounds are commonly called rigorous, yet as published they are not theorems: they hold at sampled points rather than on regions of parameter space, for truncated rational approximations of the conformal blocks, for a finite list of spins, and up to floating-point rounding. We close all four gaps. We show how to search efficiently for functionals positive on regions, including external-dimension space; how positivity on the large-spin crossing vectors can be imposed as such a region constraint; how new analytic bounds on the conformal-block recursion relations give functionals positive on the true, untruncated crossing vectors; and how to certify the positivity of these functionals in exact arithmetic. The certification rests on Bernstein-basis positivity certificates in up to three variables, exact arithmetic in $\\mathbb{Q}(\\sqrt2)$, a compactified treatment of the infinite spin tail, and an explicit bound on the difference between the true blocks and their truncations, so that infinitely many positivity conditions reduce to finitely many machine-checked sign conditions. As a flagship application we certify an exclusion region in the $(\\Delta_\\sigma,\\Delta_\\epsilon)$ plane: for $\\Delta_\\sigma\\in[0.505,0.5405]$ all of $\\Delta_\\epsilon\\in(1/2,3]$ is excluded except a small rectangle containing the 3d Ising island, giving rigorous two-sided bounds on the critical exponents $\\eta$ and $\\nu$ under explicitly stated spectrum assumptions. The analytic inputs for the mixed $\\sigma$-$\\epsilon$ system, which would remove the spin-2 gap assumption, are also proved. The same methods prevent common practical failure modes and can make bootstrap searches faster: region bounds turn the mapping of an island into a handful of one-dimensional bisections. The essential code to reproduce the search and the certification, and all machine-checkable certificates, are released.", "url": "https://arxiv.org/abs/2610.20701", "type": "理论", "summary": "数值共形自举边界通常被称为严格的，但正如所发表的那样，它们不是定理：它们适用于采样点而不是参数空间区域，适用于共形块的截断有理近似，适用于有限的自旋列表，直至浮点舍入。我们弥补了所有四个差距。我们展示了如何有效地搜索区域上的正函数，包括外部维度空间；如何将大自旋交叉向量的正值作为这样的区域约束施加；共形块递归关系上的新解析界限如何在真实的、未截断的交叉向量上给出正函数；以及如何用精确算术证明这些泛函的正性。该认证依赖于最多三个变量的伯恩斯坦基础正性证明、$\\mathbb{Q}(\\sqrt2)$中的精确算术、无限自旋尾部的紧凑处理以及真实块与其截断之间差异的显式界限，以便无限多个正性条件减少为有限多个机器检查的符号条件。\n\n作为旗舰应用程序，我们验证 $(\\Delta_\\sigma,\\Delta_\\epsilon)$ 平面中的排除区域：对于 $\\Delta_\\sigma\\in[0.505,0.5405]$，除了包含 3d Ising 岛的小矩形外，所有 $\\Delta_\\epsilon\\in(1/2,3]$ 均被排除，从而在关键指数 $\\eta$ 和 $\\nu$ 上给出严格的两侧边界在明确规定的频谱假设下，还证明了混合 $\\sigma$-$\\epsilon$ 系统的分析输入，该系统将消除 spin-2 间隙假设，并且可以防止常见的实际故障模式，并且可以使引导搜索更快：区域边界将岛的映射转换为少数一维二等分。", "authors": [{"name": "Marten Reehorst"}], "featured_authors": [{"name": "Marten Reehorst"}], "author_count": 1}, {"id": "2610.20703", "category": "hep-th", "title": "Finite-cutoff geometry from double-scaled SYK", "abstract": "We develop a finite-cutoff holographic description of the double-scaled SYK (DSSYK) model. We construct microscopic deformations of Kourkoulou-Maldacena and thermofield-double SYK states whose double-scaling limits reproduce a lower-dimensional analogue of $\\text{T}\\overline{\\text{T}}$ and $\\text{T}\\overline{\\text{T}}+\\Lambda_2$ deformations, which we denote $T^2$ and $T^2+\\Lambda_1$, respectively. The ensemble-averaged theory describes wormhole states in finite-cutoff sine dilaton gravity, and finite-cutoff anti-de Sitter and de Sitter geometries in the low- and high-energy regimes, respectively. The analysis includes both perturbative and non-perturbative solutions to the energy spectrum flow equation, and the regions behind and beyond the respective horizons. Only the perturbative branch admits physical quantum states. We study how to incorporate end-of-the-world (ETW) branes in the finite cutoff holographic dictionary. The ETW brane leads to an additional boundary theory deformation, which leads to black hole or eternal traversable wormhole geometries depending on the existence of normalizable bound states. We extend the finite cutoff length evaluations for constant mean curvature (CMC) slices, and interpret them as complexity in the boundary theory. We discuss possible extensions with matter. Our results provide a microscopic framework for studying the finite-cutoff boundaries, CMC slices and branes in the holographic dictionary of DSSYK.", "url": "https://arxiv.org/abs/2610.20703", "type": "理论", "summary": "我们开发了双尺度 SYK (DSSYK) 模型的有限截止全息描述。我们构建了 Kourkoulou-Maldacena 和热场双 SYK 态的微观变形，其双尺度极限再现了 $\\text{T}\\overline{\\text{T}}$ 和 $\\text{T}\\overline{\\text{T}}+\\Lambda_2$ 变形的低维模拟，我们分别表示 $T^2$ 和 $T^2+\\Lambda_1$。系综平均理论描述了有限截止正弦膨胀引力中的虫洞状态，以及分别在低能和高能状态下的有限截止反德西特和德西特几何。分析包括能谱流方程的扰动和非扰动解，以及各自视界后面和之外的区域。只有微扰分支才允许物理量子态。我们研究如何将世界末日（ETW）膜纳入有限截止全息字典中。 ETW 膜导致额外的边界理论变形，这导致黑洞或永恒可穿越虫洞几何形状，具体取决于可归一化束缚态的存在。\n\n我们扩展了恒定平均曲率（CMC）切片的有限截止长度评估，并将它们解释为边界理论中的复杂性。我们讨论物质的可能扩展。我们的结果为研究 DSSYK 全息字典中的有限截止边界、CMC 切片和膜提供了微观框架。", "authors": [{"name": "Sergio E. Aguilar-Gutierrez"}], "featured_authors": [{"name": "Sergio E. Aguilar-Gutierrez"}], "author_count": 1}, {"id": "2610.20707", "category": "hep-th", "title": "Gluon Scattering in Expanding de Sitter Universe", "abstract": "We construct an observer-centric S-matrix in the expanding Poincaré patch of four-dimensional de Sitter space. The asymptotic states are defined along the worldline of a comoving, or eternal, observer, the only kind of geodesic observer that remains in the patch for all proper time, and the free Hamiltonian is the conserved charge generating translations in her proper time. The resulting S-matrix is independent of which eternal observer is chosen. We apply the construction to pure Yang--Mills theory in Coulomb gauge and compute the three- and four-gluon amplitudes at tree level. The amplitudes have a structure similar to the cosmological correlators of gauge currents and are constrained by the Ward identities of de Sitter isometries.", "url": "https://arxiv.org/abs/2610.20707", "type": "理论", "summary": "我们在四维德西特空间的扩展庞加莱补丁中构建了一个以观察者为中心的 S 矩阵。渐近态是沿着共动或永恒观察者的世界线定义的，这是唯一一种在所有适当时间内都保留在补丁中的测地线观察者，而自由哈密顿量是在其适当时间产生平移的守恒电荷。由此产生的 S 矩阵与选择哪个永恒观察者无关。我们将该构造应用于库仑规范中的纯杨-米尔斯理论，并计算树级别的三胶子和四胶子振幅。振幅的结构类似于规范电流的宇宙学相关器，并受到德西特等距的沃德恒等式的约束。", "authors": [{"name": "Audrey Lindsay"}, {"name": "Tomasz R. Taylor"}], "featured_authors": [{"name": "Audrey Lindsay"}, {"name": "Tomasz R. Taylor"}], "author_count": 2}, {"id": "2610.20721", "category": "hep-th", "title": "6d SCFTs and terminal singularities", "abstract": "The classification of 6d $\\mathcal{N}=(1,0)$ SCFTs has been carried out with great success, enumerating consistent elliptically fibered threefolds in F-theory. In this note, we observe that the E-string 6d SCFT can be decorated with extra matter sectors. This decoration exploits an opening allowed by the current classification, implementing terminal singularities nested on the curve of the base of the elliptic fibration that supplies the tensor branch. Additionally, via dimensional reduction on a circle, we identify versions of the 5d $E_n$ theories decorated by extra matter sectors. As a bonus, the end of the resulting RG flow cascade reproduces a 5d theory recently constructed in the literature, explaining its 6d origin. We remain agnostic as to whether the decorated 6d and 5d theories constitute novel SCFTs.", "url": "https://arxiv.org/abs/2610.20721", "type": "理论", "summary": "6d $\\mathcal{N}=(1,0)$ SCFT 的分类已取得巨大成功，在 F 理论中枚举了一致的椭圆纤维三重。在这篇文章中，我们观察到 E 弦 6d SCFT 可以用额外的物质扇区进行装饰。这种装饰利用了当前分类允许的开口，实现了嵌套在提供张量分支的椭圆纤维化底部曲线上的终端奇点。此外，通过对圆进行降维，我们确定了由额外物质扇区装饰的 5d $E_n$ 理论的版本。作为奖励，由此产生的 RG 流级联的末端重现了最近在文献中构建的 5d 理论，解释了其 6d 起源。对于装饰后的 6d 和 5d 理论是否构成新颖的 SCFT，我们仍然不可知。", "authors": [{"name": "Andrea Sangiovanni"}], "featured_authors": [{"name": "Andrea Sangiovanni"}], "author_count": 1}, {"id": "2610.20745", "category": "hep-th", "title": "Orientation-Dependent Casimir Energy and Generalized Torque in Lorentz-Violating Rectangular Compactifications", "abstract": "We derive the renormalized Casimir energy of a free massive real scalar field on the rectangular compactification \\(\\mathbb{R}^{1,r}\\times T^p\\) in the presence of a constant CPT-even aether-like Lorentz-violating background. Allowing the spatial part of the background vector to have an arbitrary orientation relative to the compactification lattice, we characterize the resulting orientation-dependent geometric response of the vacuum. Integrating out the noncompact momenta reduces the effective spatial kinetic matrix to its Schur complement, and Poisson resummation yields a closed, exponentially convergent Bessel-function lattice sum within the stability domain. The resulting expression separates an orientation-independent kinetic normalization, \\([1+\\lambda u_\\mu u^\\mu]^{-1/2}\\), from an orientation-dependent deformation of the image-lattice metric. Coordinate-aligned configurations are recovered as special cases, and the exact massless limit and the compact-direction pressures are obtained. For a two-dimensional compact subspace, we explicitly analyze the angular dependence of the vacuum energy and derive the associated generalized Casimir torque. These results establish how the relative orientation between a Lorentz-violating background and an anisotropic compactification lattice enters the renormalized vacuum energy and its directional response.", "url": "https://arxiv.org/abs/2610.20745", "type": "理论", "summary": "我们在存在恒定 CPT 甚至类以太洛伦兹破坏背景的情况下，推导了矩形紧致化 \\(\\mathbb{R}^{1,r}\\times T^p\\) 上自由质量实标量场的重正化卡西米尔能量。允许背景矢量的空间部分相对于致密晶格具有任意方向，我们表征了所得的与方向相关的真空几何响应。对非紧动量进行积分可将有效空间动力学矩阵减少为其 Schur 补集，并且泊松恢复会在稳定域内产生一个闭合的、指数收敛的贝塞尔函数晶格和。所得表达式将与方向无关的动力学归一化 \\([1+\\lambda u_\\mu u^\\mu]^{-1/2}\\) 与图像晶格度量的方向相关变形分开。坐标对齐构型被恢复为特殊情况，并获得了精确的无质量极限和压缩方向压力。对于二维紧致子空间，我们明确分析了真空能量的角度依赖性并推导了相关的广义卡西米尔扭矩。\n\n这些结果确定了洛伦兹破坏背景和各向异性致密晶格之间的相对取向如何进入重整化真空能量及其方向响应。", "authors": [{"name": "Zohreh Ashkipoor Gofreh"}, {"name": "Reza Moazzemi"}], "featured_authors": [{"name": "Zohreh Ashkipoor Gofreh"}, {"name": "Reza Moazzemi"}], "author_count": 2}, {"id": "2610.20768", "category": "hep-th", "title": "The Magic Barrier: A Universal Feature of Quantum Thermalization", "abstract": "We show that the emergence of a ``magic barrier'', characterized by a transient maximum of nonstabilizerness during rapid entanglement growth, is a universal feature of thermalization within quantum ergodic theories, which is intimately connected to random matrix spectral properties. Starting from a pure product state, we analytically determine the time evolution of entanglement entropy, antiflatness, capacity of entanglement, and nonlocal trace distance magic under unitary dynamics generated by random matrix Hamiltonians drawn from all three Gaussian ensembles. We find that the transient maxima of antiflatness, capacity of entanglement, and nonlocal magic occur on the same characteristic timescale as the maximum rate of entanglement growth. These results establish that the magic barrier is a universal feature of RMT thermalization, suggesting universality across quantum chaotic systems. We conclude that quantitative simulations of thermalization in ergodic quantum theories inherently require quantum computation.", "url": "https://arxiv.org/abs/2610.20768", "type": "理论", "summary": "我们证明，“魔障”的出现是量子遍历理论中热化的普遍特征，其特征是在快速纠缠增长过程中瞬时最大非稳定性，它与随机矩阵光谱特性密切相关。从纯乘积态开始，我们分析确定了由从所有三个高斯系综中抽取的随机矩阵哈密顿量生成的酉动力学下纠缠熵、反平坦性、纠缠能力和非局部迹距离魔法的时间演化。我们发现反平坦性、纠缠能力和非局部魔力的瞬态最大值与纠缠增长的最大速率发生在相同的特征时间尺度上。这些结果表明，魔障是 RMT 热化的普遍特征，表明量子混沌系统的普遍性。我们得出的结论是，遍历量子理论中热化的定量模拟本质上需要量子计算。", "authors": [{"name": "Jakob J. Minar"}, {"name": "Andreas Schäfer"}, {"name": "Leonhard Schmotzer"}, {"name": "Clemens Seidl"}], "featured_authors": [{"name": "Jakob J. Minar"}, {"name": "Andreas Schäfer"}, {"name": "Leonhard Schmotzer"}, {"name": "Clemens Seidl"}], "author_count": 4}, {"id": "2610.20770", "category": "hep-th", "title": "All Order Gravitational Wave Tails for Subleading Post-Newtonian Expansion", "abstract": "The low-frequency gravitational waveform emitted in a classical scattering process contains an infinite tower of late- and early-time tail terms of the form $u^{-r}(\\ln|u|)^{r-1}$, $r \\geq 1$. In the Newtonian limit, the coefficients of this entire tower have recently been shown to be universal, i.e. fixed by the asymptotic data of the scattering objects alone. At the retained order in the velocity expansion, these leading-logarithmic tails are determined to all orders in Newton's constant $G$. We extend this result to the first subleading order in the post-Newtonian expansion of the asymptotic states. We consider scattering of an arbitrary number of incoming and outgoing nonrelativistic objects interacting only through gravity at long range, and we derive the complete tower of tail terms at this order. The correction arises from the first subleading term in the retardation expansion and is determined by the asymptotic Newtonian trajectories of the massive particles. Its coefficients are again determined entirely by the asymptotic trajectories and are independent of the details of the interaction. For $2\\to2$ scattering, the leading-logarithmic series can be summed in closed form. Our results agree with a relativistic conjecture proposed in earlier work arXiv:2610.07134 .", "url": "https://arxiv.org/abs/2610.20770", "type": "理论", "summary": "经典散射过程中发出的低频引力波形包含无限塔的晚期和早期尾项，其形式为 $u^{-r}(\\ln|u|)^{r-1}$, $r \\geq 1$。在牛顿极限下，整个塔的系数最近被证明是通用的，即仅由散射物体的渐近数据固定。在速度展开式中保留的阶数处，这些前导对数尾部由牛顿常数 $G$ 中的所有阶数决定。我们将这个结果推广到渐近态的后牛顿展开中的第一次主导阶。我们考虑仅通过远距离重力相互作用的任意数量的传入和传出非相对论物体的散射，并按此顺序导出完整的尾项塔。该修正源自延迟展开中的第一个副项，并由大质量粒子的渐近牛顿轨迹确定。它的系数再次完全由渐近轨迹决定，并且独立于相互作用的细节。对于 $2\\to2$ 散射，前导对数级数可以以封闭形式求和。\n\n我们的结果与早期工作 arXiv:2610.07134 中提出的相对论猜想一致。", "authors": [{"name": "Debanjan Karan"}, {"name": "Babli Khatun"}], "featured_authors": [{"name": "Debanjan Karan"}, {"name": "Babli Khatun"}], "author_count": 2}, {"id": "2610.20839", "category": "hep-th", "title": "Exact AdS and pp-waves in multi-gravity beyond pairwise interactions", "abstract": "We construct exact anti-de Sitter (AdS) waves and pp-waves in ghost-free multi-gravity beyond pairwise interactions for an arbitrary number $\\mathcal{N}$ of vielbeins, in any spacetime dimension $D\\geq3$. Deforming proportional AdS and Minkowski solutions along a common null direction reduces the full nonlinear field equations to coupled linear differential equations for the wave profiles, without restricting their amplitudes. The system is diagonalised in the same eigenbasis as the perturbative Fierz-Pauli mass matrix, separating the solutions into one massless and $\\mathcal{N}-1$ massive eigenprofiles. We obtain explicit radial and transverse solutions and impose an AdS boundary falloff. This falloff admits the appropriate radial branch of every mode with non-negative squared mass and excludes profiles with negative squared masses, including logarithmic solutions at the Breitenlohner-Freedman threshold. We also relate the AdS waves to pp-waves through a local flat limit. Explicit examples exhibit wave configurations that cannot be reproduced by ghost-free pairwise theories, demonstrating that genuine multi-field interactions support new exact gravitational-wave solutions.", "url": "https://arxiv.org/abs/2610.20839", "type": "理论", "summary": "我们在任意时空维度 $D\\geq3$ 中为任意数量 $\\mathcal{N}$ 的 vielbeins 构建精确的反德西特 (AdS) 波和 pp 波，在无鬼多重引力中超越成对相互作用。沿公共零方向变形比例 AdS 和 Minkowski 解可将完整的非线性场方程简化为波剖面的耦合线性微分方程，而不限制其幅度。该系统在与微扰 Fierz-Pauli 质量矩阵相同的特征基中进行对角化，将解分成一个无质量和 $\\mathcal{N}-1$ 质量特征分布。我们获得显式的径向和横向解，并施加 AdS 边界衰减。这种衰减允许具有非负平方质量的每种模式的适当径向分支，并排除具有负平方质量的轮廓，包括 Breitenlohner-Freedman 阈值处的对数解。我们还通过局部平坦极限将 AdS 波与 pp 波联系起来。明确的例子展示了无法通过无鬼影成对理论重现的波配置，证明真正的多场相互作用支持新的精确引力波解。", "authors": [{"name": "Joakim Flinckman"}], "featured_authors": [{"name": "Joakim Flinckman"}], "author_count": 1}, {"id": "2610.20853", "category": "hep-th", "title": "Beyond the polynomial ansatz: regular $AdS_3\\times M_8$ solutions of M-theory", "abstract": "We study regular compact solutions of the cohomogeneity-one $AdS_3\\times M_8$ system of Gauntlett, Mac Conamhna, Mateos and Waldram, where $M_8$ is an $S^2$ bundle over three constant-curvature Riemann surfaces. We find that an endpoint argument rules out every non-flat curvature-sign sector without a positive-curvature factor, while an analytic deformation gives regular families with four radial shape parameters in all remaining sectors, with the base geometry held fixed. The known polynomial solutions form a proper analytic locus in these families. Non-polynomiality is therefore generic in parameter space, although the deviation from an endpoint-matching polynomial can be very small. Apart from the completely flat exception, the curvature-sign criterion is necessary and sufficient within this ansatz. Four magnetic flux ratios give local coordinates near the reference solution and its small-curvature deformations, and a rational inverse reconstructs candidate endpoint data directly from finite flux ratios. In the fully positive sector we prove that one explicit four-dimensional finite-ratio neighbourhood lies inside the physical flux image. The magnetic periods and leading holographic central charge reduce to endpoint data, and, once the common Brown--Henneaux normalization is fixed, the nontrivial flux dependence of the equivariant localization formula agrees with the endpoint result as an exact algebraic identity. We also quantify the non-polynomial corrections and analyse finite degenerations under explicit convergence hypotheses.", "url": "https://arxiv.org/abs/2610.20853", "type": "理论", "summary": "我们研究 Gauntlett、Mac Conamhna、Mateos 和 Waldram 的同齐一 $AdS_3\\times M_8$ 系统的常规紧解，其中 $M_8$ 是三个常曲率黎曼曲面上的 $S^2$ 丛。我们发现端点参数排除了没有正曲率因子的每个非平坦曲率符号扇区，而解析变形在所有剩余扇区中给出了具有四个径向形状参数的常规族，并且基本几何形状保持固定。已知的多项式解在这些族中形成适当的解析轨迹。因此，非多项式在参数空间中是通用的，尽管与端点匹配多项式的偏差可能非常小。除了完全平坦的例外之外，曲率符号准则在该 ansatz 中是必要且充分的。四个磁通量比给出参考解及其小曲率变形附近的局部坐标，有理逆直接从有限磁通量比重建候选端点数据。在完全正的扇区中，我们证明了一个显式的四维有限比率邻域位于物理通量图像内部。\n\n磁周期和前导全息中心电荷减少到端点数据，并且一旦共同的 Brown-Henneaux 归一化固定，等变定位公式的非平凡通量依赖性与作为精确代数恒等式的端点结果一致。我们还量化了非多项式修正并分析了显式收敛假设下的有限退化。", "authors": [{"name": "Carolina Matté Gregory"}], "featured_authors": [{"name": "Carolina Matté Gregory"}], "author_count": 1}, {"id": "2610.20931", "category": "hep-th", "title": "Local supersymmetry implies momentum map/Gauntlett-Pakis equations and vanishing generalized Komar forms", "abstract": "The first-order differential equations satisfied by Killing spinor bilinears (momentum map equations or Gauntlett--Pakis equations, Killing vector equations and the vanishing of the generalized Komar charge of the supersymmetric Killing vector) can be derived directly from the action of the local supersymmetry algebra on bosonic fields. We show how this comes about in several examples of increasing complexity, one of which is 11-dimensional supergravity.", "url": "https://arxiv.org/abs/2610.20931", "type": "理论", "summary": "Killing 旋量双线性满足的一阶微分方程（动量映射方程或 Gauntlett-Pakis 方程、Killing 向量方程和超对称 Killing 向量的广义 Komar 电荷消失）可以直接从局部超对称代数对玻色子场的作用导出。我们通过几个日益复杂的例子展示了这是如何发生的，其中之一就是 11 维超引力。", "authors": [{"name": "Patrick Meessen"}, {"name": "Tomás Ortín"}], "featured_authors": [{"name": "Patrick Meessen"}, {"name": "Tomás Ortín"}], "author_count": 2}, {"id": "2610.21058", "category": "hep-th", "title": "Regge Dilaton Gravity from BF Theory", "abstract": "In this work we investigate the relation between gauge and geometric descriptions of two-dimensional dilaton gravity at the level of discrete path integrals. We develop a Regge discretization of Euclidean two-dimensional dilaton gravity using homogeneously curved simplices, as well as a ribbon refined discretization of two-dimensional BF theory adapted to homogeneously curved spacetimes. For Euclidean signature and vanishing or negative cosmological constant we show how the ribbon BF discretization, through appropriate gauge fixings, leads to the Regge dilaton gravity formulation. The resulting correspondence makes explicit how a geometric Regge path integral with its associated measure emerges from its gauge theoretic formulation.", "url": "https://arxiv.org/abs/2610.21058", "type": "理论", "summary": "在这项工作中，我们研究了离散路径积分水平上二维膨胀引力的规范和几何描述之间的关系。我们使用均匀弯曲单纯形开发了欧几里得二维膨胀引力的 Regge 离散化，以及适用于均匀弯曲时空的二维 BF 理论的带状细化离散化。对于欧几里得签名和消失或负宇宙学常数，我们展示了带状 BF 离散化如何通过适当的规范固定导致雷格膨胀引力公式。由此产生的对应关系明确了几何 Regge 路径积分及其相关测量是如何从规范理论公式中出现的。", "authors": [{"name": "Florian Girelli"}, {"name": "Christopher Pollack"}], "featured_authors": [{"name": "Florian Girelli"}, {"name": "Christopher Pollack"}], "author_count": 2}, {"id": "2610.21066", "category": "hep-th", "title": "Stability and dynamics of bumblebee models", "abstract": "In this work, we study vector field theories with spontaneous Lorentz violation induced by a nonderivative potential $V(X)$ (with $X = B_\\mu B^\\mu$), known as bumblebee models, with a Maxwell kinetic term in Minkowski spacetime. We confirm a recent result showing that a class of smooth potentials, including a purely cubic potential, leads to a Hamiltonian density that is bounded from below and assumes a global minimum for nonzero timelike expectation values of the vector field satisfying $X = b^2 > 0$, inducing spontaneous Lorentz-symmetry breaking. We show explicitly that the standard quadratic potential has a Hamiltonian that is unbounded from below and thus unstable. We analyze the Hamiltonian equations of motion for the timelike case and demonstrate that they are regular at the global minimum. Furthermore, we examine the linearized spectrum of small fluctuations around the minimum. We also study particular solutions with spherical symmetry analytically and numerically, without assuming linearization. We find that the time evolution of smooth initial configurations can develop shock-like singularities, and we explain why this behavior is expected in this model. We also identify a subset of the space of field configurations in which the field equations cease to be hyperbolic, leading to a breakdown of well-posedness of the Cauchy initial-value problem.", "url": "https://arxiv.org/abs/2610.21066", "type": "理论", "summary": "在这项工作中，我们研究了由非导数势 $V(X)$（其中 $X = B_\\mu B^\\mu$）引起的自发洛伦兹破坏的矢量场论，称为大黄蜂模型，在 Minkowski 时空中具有麦克斯韦动力学项。我们确认了最近的结果，表明一类平滑势（包括纯三次势）导致哈密顿密度从下界开始，并假定满足 $X = b^2 > 0$ 的矢量场的非零类时期望值的全局最小值，从而引发自发洛伦兹对称破缺。我们明确地表明，标准二次势具有一个自下无界的哈密顿量，因此不稳定。我们分析了类时情况的哈密顿运动方程，并证明它们在全局最小值处是规则的。此外，我们还检查了最小值附近小波动的线性化频谱。我们还通过分析和数值研究具有球对称性的特定解，而不假设线性化。我们发现平滑初始配置的时间演化可以产生类似冲击的奇点，并且我们解释了为什么在该模型中预期会出现这种行为。\n\n我们还确定了场配置空间的一个子集，其中场方程不再是双曲的，从而导致柯西初始值问题的适定性崩溃。", "authors": [{"name": "Quentin G. Bailey"}, {"name": "Robertus Potting"}, {"name": "Dario T. Walter-Cardona"}], "featured_authors": [{"name": "Quentin G. Bailey"}, {"name": "Robertus Potting"}, {"name": "Dario T. Walter-Cardona"}], "author_count": 3}, {"id": "2610.21478", "category": "hep-th", "title": "Difference between pair creation and anomaly matching: Nontrivial aspects of invertible symmetries and defects in $SU(N)$ models", "abstract": "We study the connection between the $SU(N)_{K}$ Wess-Zumino-Witten (WZW) model and $SU(N)_{K'}$ WZW models, enforcing the unbroken $\\mathbb{Z}_{N}$ symmetries. The fundamental underlying structures are the (half-)integer spin simple currents in the topological quantum field theories and anomaly matching conditions in conformal field theories. For the (half-)integer spin simple current condition of the folded models $SU(N)_{K}\\boxtimes_{\\mathbb{Z}_{N}} \\overline{SU(N)_{K'}}$ or $SU(N)_{K}\\boxtimes_{\\mathbb{Z}_{N}} SU(N)_{K'}$, we obtain the generalized pairing condition $K= \\pm R^{2}K' (\\text{mod}.N)$ with $\\text{gcd}(R,N)=1$. On the other hand, the anomaly matching condition results in the weaker condition $K= \\pm RUK' (\\text{mod}.N)$ with $\\text{gcd}(R,N)=\\text{gcd}(U,N)=1$. Surprisingly, the anomaly matching without the pairing condition results in the intrinsic mismatch of the preservation law of the $\\mathbb{Z}_{N}$ defects and symmetries. The pairing condition canonically relates symmetries and defects, as in category theory, whereas it is unclear whether it can be a guiding principle in prohibiting the massless renormalization group flows.", "url": "https://arxiv.org/abs/2610.21478", "type": "理论", "summary": "我们研究 $SU(N)_{K}$ Wess-Zumino-Witten (WZW) 模型和 $SU(N)_{K'}$ WZW 模型之间的联系，强制执行不间断的 $\\mathbb{Z}_{N}$ 对称性。基本结构是拓扑量子场论中的（半）整数自旋简单电流和共形场论中的异常匹配条件。对于折叠模型 $SU(N)_{K}\\boxtimes_{\\mathbb{Z}_{N}} \\overline{SU(N)_{K'}}$ 或 $SU(N)_{K}\\boxtimes_{\\mathbb{Z}_{N}} SU(N)_{K'}$ 的（半）整数自旋简单当前条件，我们得到广义配对条件 $K= \\pm R^{2}K' (\\text{mod}.N)$ 且 $\\text{gcd}(R,N)=1$。另一方面，异常匹配条件导致较弱的条件 $K= \\pm RUK' (\\text{mod}.N)$ 且 $\\text{gcd}(R,N)=\\text{gcd}(U,N)=1$。令人惊讶的是，没有配对条件的异常匹配导致$\\mathbb{Z}_{N}$缺陷和对称性的保存律本质上不匹配。正如范畴论中一样，配对条件规范地将对称性和缺陷联系起来，但尚不清楚它是否可以成为禁止无质量重正化群流的指导原则。", "authors": [{"name": "Yoshiki Fukusumi"}, {"name": "Shuma Nakashiba"}], "featured_authors": [{"name": "Yoshiki Fukusumi"}, {"name": "Shuma Nakashiba"}], "author_count": 2}, {"id": "2610.21574", "category": "hep-th", "title": "Krylov complexity and oscillatory quantum dynamics in two-field inflation", "abstract": "We investigate Krylov-space dynamics of primordial perturbations in two-field inflation. Starting from the quadratic action for coupled curvature and entropy perturbations, we solve the mode equations with Bunch-Davies initial conditions and construct the corresponding quadratic Hamiltonian. The Gaussian quantum state is described by a four-mode squeezed state with two squeezing channels. We derive the evolution of the squeezing strength and squeezing angle and use them to evaluate the Krylov complexity, Krylov entropy, and channel-resolved Lanczos coefficients. Our numerical results show that the two channels remain weakly squeezed inside the horizon but develop different squeezing histories after horizon exit. The two channels exhibit different onset times and distinct oscillatory Krylov dynamics. The second channel develops strong squeezing earlier and dominates the intermediate evolution, whereas the first channel shows a delayed enhancement. The corresponding Krylov complexities exhibit oscillatory structures across horizon crossing and pronounced fluctuations in the strongly squeezed superhorizon regime. These oscillations originate from the relative phases entering the squeezing equations and are amplified through the nonlinear relation between Krylov complexity of different channels.", "url": "https://arxiv.org/abs/2610.21574", "type": "理论", "summary": "我们研究了两场暴胀中原初扰动的克雷洛夫空间动力学。从曲率和熵扰动耦合的二次作用出发，我们求解具有 Bunch-Davies 初始条件的模态方程，并构造相应的二次哈密顿量。高斯量子态由具有两个压缩通道的四模压缩态来描述。我们推导了挤压强度和挤压角度的演化，并用它们来评估 Krylov 复杂度、Krylov 熵和通道解析 Lanczos 系数。我们的数值结果表明，两个通道在视界内仍然受到弱挤压，但在视界退出后会产生不同的挤压历史。这两个通道表现出不同的起始时间和不同的振荡克雷洛夫动力学。第二个通道较早发展出强烈的挤压并主导中间演化，而第一个通道则显示出延迟的增强。相应的克雷洛夫复杂度表现出跨越视界的振荡结构以及在强烈挤压的超视界区域中的明显波动。\n\n这些振荡源自进入压缩方程的相对相位，并通过不同通道的克雷洛夫复杂度之间的非线性关系被放大。", "authors": [{"name": "Tao Li"}, {"name": "Lei-Hua Liu"}, {"name": "Hai-Bing Fu"}], "featured_authors": [{"name": "Tao Li"}, {"name": "Lei-Hua Liu"}, {"name": "Hai-Bing Fu"}], "author_count": 3}, {"id": "2610.21592", "category": "hep-th", "title": "Fortuitous BMN Cohomology at Every $N$", "abstract": "Finite-$N$ trace relations can produce $Q$-cohomology classes with no stable large-$N$ ancestor. The brane-fused construction at $SU(3)$ suggests that such states can retain an $SU(2)$ nonabelian core accompanied by scalar hair. We develop this idea into a general construction for every $SU(N)$, $N\\geq3$. Starting from the $SU(2)$ threshold operator $O_{24}$, we select pairs of eigenvalues of one scalar and construct corrected two-colour letters whose $Q$-transformations obey the $SU(2)$ rules exactly. Substitution into $O_{24}$ gives a closed rational operator for each pair. Multiplying by eigenvalue-separation factors removes the denominators, and summing over all pairs produces a gauge-invariant polynomial. An exact block-restriction identity recovers a nonzero multiple of $O_{24}$. The restriction maps every stable class to a stable $SU(2)$ class, proving that the resulting operator is non-exact and fortuitous, even when non-Coulombic stable classes are included. This proves the existence of fortuitous BMN cohomology at every $N\\geq3$. The construction is an exact algebraic realization of a nonabelian core with scalar dressing.", "url": "https://arxiv.org/abs/2610.21592", "type": "理论", "summary": "有限$N$迹关系可以产生没有稳定的大$N$祖先的$Q$上同调类。 $SU(3)$ 处的膜融合结构表明，此类状态可以保留 $SU(2)$ 非阿贝尔核心并伴有标量毛。我们将这个想法发展为每个 $SU(N)$, $N\\geq3$ 的一般结构。从 $SU(2)$ 阈值运算符 $O_{24}$ 开始，我们选择一个标量的一对特征值并构造校正的双色字母，其 $Q$ 变换完全遵循 $SU(2)$ 规则。代入 $O_{24}$ 给出每对的闭合有理运算符。乘以特征值分离因子可消除分母，对所有对求和可生成规范不变多项式。精确的块限制标识恢复 $O_{24}$ 的非零倍数。该限制将每个稳定类映射到稳定的 $SU(2)$ 类，证明生成的运算符是不精确且偶然的，即使包含非库仑稳定类也是如此。这证明了在每个 $N\\geq3$ 处存在偶然的 BMN 上同调。该结构是具有标量修整的非阿贝尔核心的精确代数实现。", "authors": [{"name": "Robert de Mello Koch"}, {"name": "Minkyoo Kim"}, {"name": "Sinong Liu"}], "featured_authors": [{"name": "Robert de Mello Koch"}, {"name": "Minkyoo Kim"}, {"name": "Sinong Liu"}], "author_count": 3}, {"id": "2610.21706", "category": "hep-th", "title": "Renormalization of Quantum Gravity with Lagrange Multiplier Fields", "abstract": "We study the renormalization of Einstein gravity coupled to a scalar field in the Lagrange multiplier (LM) formulation, where a pair of quantum LM fields, $(\\lambda'_{\\mu\\nu},\\sigma')$, is coupled to the gauge-fixed gravitational and scalar equations of motion. Using the fact that in this approach there are no higher loop corrections, we show that renormalizing the two quantum LM fields at one-loop order absorbs, off-shell, five out of the six independent divergent structures. The remaining off-shell counterterm, proportional to $ (\\partial_\\mu\\bar\\phi\\,\\partial^\\mu\\bar\\phi)^2, $ is nonzero on shell and cannot be absorbed by any LM field redefinition, since such redefinitions generate only counterterms that vanish on shell. In contrast, in pure gravity (no matter), the LM renormalization absorbs all one-loop divergences and no additional counterterms are required. The LM formulation therefore provides a sharp off-shell separation between equation-of-motion divergences, absorbed into LM field renormalizations, and the single irreducible structure.", "url": "https://arxiv.org/abs/2610.21706", "type": "理论", "summary": "我们研究了爱因斯坦引力与拉格朗日乘子 (LM) 公式中的标量场耦合的重整化，其中一对量子 LM 场 $(\\lambda'_{\\mu\\nu},\\sigma')$ 耦合到规范固定的引力和标量运动方程。利用这种方法中没有更高的环路校正这一事实，我们表明，以单环阶重整化两个量子 LM 场可以在壳外吸收六个独立发散结构中的五个。剩余的壳外反项，与 $ (\\partial_\\mu\\bar\\phi\\,\\partial^\\mu\\bar\\phi)^2 成比例，$ 在壳上非零，并且不能被任何 LM 场重新定义吸收，因为此类重新定义仅生成在壳上消失的反项。相比之下，在纯重力（无论如何）中，LM 重整化吸收了所有单环散度，并且不需要额外的反项。因此，LM 公式在运动方程发散（吸收到 LM 场重正化中）与单一不可约结构之间提供了清晰的离壳分离。", "authors": [{"name": "F. T. Brandt"}, {"name": "J. Frenkel"}, {"name": "S. Martins-Filho"}, {"name": "D. G. C. McKeon"}], "featured_authors": [{"name": "F. T. Brandt"}, {"name": "J. Frenkel"}, {"name": "S. Martins-Filho"}, {"name": "D. G. C. McKeon"}], "author_count": 4}, {"id": "2610.21879", "category": "hep-th", "title": "One generation of the Standard Model as a quantum error-correcting code", "abstract": "Together with a right-handed neutrino, the fermions of one generation of the Standard Model are labelled by five bits, a combinatorial structure tied to anomaly cancellation. We make this precise. Anomaly cancellation is the vanishing of a cubic form, the defining property of triorthogonal codes, the quantum error-correcting codes behind magic state distillation. Removing the right-handed neutrino gives a $[[15,1,3]]_p$ code for every prime $p$, including the Bravyi-Kitaev code for $p = 2$. For qutrits it is the unique shortest distance-three triorthogonal code.", "url": "https://arxiv.org/abs/2610.21879", "type": "理论", "summary": "一代标准模型的费米子与右手中微子一起由五位标记，这是一种与异常消除相关的组合结构。我们使这一点变得精确。异常消除是立方形式的消失，是三正交码的定义属性，是神奇状态蒸馏背后的量子纠错码。删除右手中微子会为每个素数 $p$ 提供一个 $[[15,1,3]]_p$ 代码，包括 $p = 2$ 的 Bravyi-Kitaev 代码。对于 qutrits 来说，它是唯一的最短距离三正交码。", "authors": [{"name": "Shiroman Prakash"}, {"name": "K. L. Ramya"}], "featured_authors": [{"name": "Shiroman Prakash"}, {"name": "K. L. Ramya"}], "author_count": 2}, {"id": "2610.21930", "category": "hep-th", "title": "Vortex clusters and vortex-filled bubbles in a modified Abelian-Higgs model", "abstract": "We investigate a single-component Abelian-Higgs model with an eighth-order scalar potential whose vacuum manifold consists of two disconnected circles. The model supports two species of vortices and domain walls interpolating between the two vacuum components. We find type-1.5-like behavior characterized by nonmonotonic intervortex interactions and bound states of spatially separated vortices. Inner-vacuum vortices form clusters through short-range repulsion and long-range attraction, whereas outer-vacuum vortices form vortex-filled bubbles in which a closed domain wall confines multiple inner-vacuum-vortex cores. We construct the domain wall analytically, derive the asymptotic vortex-wall interactions, and analyze the fluctuation spectra of coincident multivortices to identify their splitting instabilities.", "url": "https://arxiv.org/abs/2610.21930", "type": "理论", "summary": "我们研究了具有八阶标量势的单分量阿贝尔-希格斯模型，其真空流形由两个不相连的圆组成。该模型支持在两个真空组件之间插值的两种涡旋和畴壁。我们发现类似 1.5 型的行为，其特征是非单调涡旋间相互作用和空间分离涡旋的束缚态。内真空涡旋通过短程排斥和长程吸引形成簇，而外真空涡旋形成充满涡旋的气泡，其中封闭的磁畴壁限制了多个内真空涡旋核心。我们分析地构造了磁畴壁，推导了渐近涡旋壁相互作用，并分析了重合多涡旋的涨落谱以识别它们的分裂不稳定性。", "authors": [{"name": "D. Miguélez-Caballero"}, {"name": "S. Navarro-Obregón"}, {"name": "Muneto Nitta"}, {"name": "Keisuke Ohashi"}], "featured_authors": [{"name": "D. Miguélez-Caballero"}, {"name": "S. Navarro-Obregón"}, {"name": "Muneto Nitta"}, {"name": "Keisuke Ohashi"}], "author_count": 4}, {"id": "2610.22054", "category": "hep-th", "title": "Monopole-deformed Kim-Park dualities from elementary dualities", "abstract": "We derive the ellipsoid partition function identities for the monopole-deformed Kim-Park dualities of 3d $\\mathcal{N}=2$ adjoint SQCD with unitary gauge groups. The derivation uses only Aharony and Benini-Benvenuti-Pasquetti dualities as building blocks. By deconfining the adjoint into a $C_p[U(N)]$ quiver tail, we construct explicit duality sequences. Confinement and a rank-reducing duality chain then yield the expected magnetic partition functions, including the singlet contributions. We also present an alternative partition-function derivation of the $C_p[U(N)]$ s-confinement and provide Quiver Lab, a standalone HTML application for implementing and visualizing duality moves on quiver diagrams.", "url": "https://arxiv.org/abs/2610.22054", "type": "理论", "summary": "我们推导出具有酉规范组的 3d $\\mathcal{N}=2$ 伴随 SQCD 的单极子变形 Kim-Park 对偶性的椭球配分函数恒等式。该推导仅使用 Aharony 和 Benini-Benvenuti-Pasquetti 对偶作为构建块。通过将伴随词解除限制为 $C_p[U(N)]$ 颤尾，我们构造了显式对偶序列。然后，限制和降级对偶链产生预期的磁配分函数，包括单线态贡献。我们还提出了 $C_p[U(N)]$ s 限制的另一种配分函数推导，并提供 Quiver Lab，这是一个独立的 HTML 应用程序，用于在箭袋图上实现和可视化对偶移动。", "authors": [{"name": "Sungjoon Kim"}, {"name": "Jehyun Lee"}], "featured_authors": [{"name": "Sungjoon Kim"}, {"name": "Jehyun Lee"}], "author_count": 2}, {"id": "2610.22101", "category": "hep-th", "title": "Aspects of Codimension two Holography in de Sitter Space", "abstract": "Following \\cite{Yadav:2024ray} we embark on a further study of the codimension two holography in de Sitter (dS) space. The $d$ dimensional bulk dS space is sliced by two end of the world $(d-1)$ dimensional branes which are bestowed with either Lorentzian dS or Euclidean AdS metric joining at a common $(d-2)$ dimensional space where the dual CFT lives. Through explicit computations of the holographic entanglement entropy, partition function, and Renyi entropy in both slicings for the bulk dS space emphasizing their similarities as well as differences we provide further evidence for this duality. We also make comments on further generalization of the codimension two holography.", "url": "https://arxiv.org/abs/2610.22101", "type": "理论", "summary": "继\\cite{Yadav:2024ray}之后，我们开始进一步研究德西特（dS）空间中的余维二全息术。 $d$ 维散装 dS 空间被世界两端的 $(d-1)$ 维膜切片，这些膜被赋予洛伦兹 dS 或欧几里德 AdS 度量，连接到双 CFT 所在的公共 $(d-2)$ 维空间。通过对体 dS 空间的两个切片中的全息纠缠熵、配分函数和 Renyi 熵的显式计算，强调它们的相似性和差异，我们为这种二元性提供了进一步的证据。我们还对余维二全息术的进一步推广进行了评论。", "authors": [{"name": "Kanhu Kishore Nanda"}, {"name": "Somnath Porey"}, {"name": "Masataka Watanabe"}, {"name": "Gopal Yadav"}], "featured_authors": [{"name": "Kanhu Kishore Nanda"}, {"name": "Somnath Porey"}, {"name": "Masataka Watanabe"}, {"name": "Gopal Yadav"}], "author_count": 4}, {"id": "2610.22332", "category": "hep-th", "title": "Non-Coulomb $Q$-Cohomology and Quantum Lifting", "abstract": "We study quantum lifting of classical BPS cohomology classes in four-dimensional $\\mathcal N=4$ super-Yang-Mills theory. Certain powers of the gaugino bilinear $\\mathcal S=\\text{Tr}(\\lambda_+\\lambda_-)$ in orthogonal theories provide non-Coulomb monotones: multi-graviton classes that vanish upon Cartan restriction. For $SO(7)$, we identify $\\mathcal S^4$ as a superconformal descendant of a known lifted monotone class, explaining the latter's non-Coulomb character, and explicitly construct a fortuitous lifting partner for $\\mathcal S^4$. This construction provides a strategy for finding analogous partners for higher powers at higher ranks. Our main result establishes restrictions on the quantum lifting of classical BPS cohomologies for general gauge groups. We show that the one-loop correction $Q_1$ to the supercharge annihilates every monotone class in classical cohomology, while every non-zero $Q_1$ image is of non-Coulomb type. Thus every non-zero one-loop pairing has a fortuitous source and a non-Coulomb target, so that Coulomb monotones survive at this order at finite rank. In the BMN sector, our results imply that non-Coulomb monotones survive at one loop order as well. A crucial step in the argument shows that every non-Coulomb class, fortuitous or monotone, is annihilated in classical cohomology by a sufficiently high power of a scalar discriminant, which we interpret as a partial no-hair property.", "url": "https://arxiv.org/abs/2610.22332", "type": "理论", "summary": "我们研究四维 $\\mathcal N=4$ super-Yang-Mills 理论中经典 BPS 上同调类的量子提升。正交理论中高吉诺双线性 $\\mathcal S=\\text{Tr}(\\lambda_+\\lambda_-)$ 的某些幂提供非库仑单调：在嘉当限制下消失的多引力子类。对于 $SO(7)$，我们将 $\\mathcal S^4$ 识别为已知提升单调类的超共形后代，解释了后者的非库仑特征，并显式地为 $\\mathcal S^4$ 构造了一个偶然的提升伙伴。这种结构提供了一种为更高级别的更高权力寻找类似合作伙伴的策略。我们的主要结果对一般规范群的经典 BPS 上同调的量子提升建立了限制。我们证明，对增压的单循环校正 $Q_1$ 消除了经典上同调中的每个单调类，而每个非零 $Q_1$ 图像都是非库仑类型。因此，每个非零单环配对都有一个偶然源和一个非库仑目标，因此库仑单调在有限等级上以这个顺序存在。在 BMN 领域，我们的结果表明非库仑单调也存在于一个循环阶中。\n\n论证中的关键一步表明，每个非库仑类，无论是偶然的还是单调的，在经典上同调中都会被足够高的标量判别式的幂所消除，我们将其解释为部分无毛性质。", "authors": [{"name": "Tanay Kibe"}, {"name": "Sam van Leuven"}, {"name": "Kayleigh Mathieson"}], "featured_authors": [{"name": "Tanay Kibe"}, {"name": "Sam van Leuven"}, {"name": "Kayleigh Mathieson"}], "author_count": 3}, {"id": "2610.20910", "category": "math-ph", "title": "Equality of the Jellium and the Uniform Electron Gas Energies", "abstract": "Jellium, a system of electrons in a uniform neutralizing background, and the uniform electron gas (UEG), a system of electrons with constant density and no background, are two standard models of the electron gas. We prove that the ground-state energy per unit volume of Jellium, as defined by Lieb and Narnhofer, coincides with the UEG energy defined by Lewin, Lieb and Seiringer, i.e. \\[ e^\\hbar_{\\rm Jel}(\\rho_0)=e^\\hbar_{\\rm UEG}(\\rho_0). \\] This equality was previously established in the classical case by Lewin, Lieb and Seiringer and independently by Cotar and Petrache.", "url": "https://arxiv.org/abs/2610.20910", "type": "理论", "summary": "Jellium（均匀中和背景中的电子系统）和均匀电子气（UEG）（具有恒定密度且无背景的电子系统）是电子气的两种标准模型。我们证明了 Lieb 和 Narnhofer 定义的 Jellium 单位体积基态能量与 Lewin、Lieb 和 Seiringer 定义的 UEG 能量一致，即 \\[ e^\\hbar_{\\rm Jel}(\\rho_0)=e^\\hbar_{\\rm UEG}(\\rho_0)。 \\] 这种等式先前由 Lewin、Lieb 和 Seiringer 在经典案例中建立，并由 Cotar 和 Petrache 独立建立。", "authors": [{"name": "Mihály A. Csirik"}], "featured_authors": [{"name": "Mihály A. Csirik"}], "author_count": 1}, {"id": "2610.21172", "category": "math-ph", "title": "Free Fermion frustration-free models have zero Hall conductance", "abstract": "We give a new proof that translation-invariant free Fermion frustration-free models have zero Hall conductance. Our proof is analytic in nature and it uses the bulk-edge correspondence. The central argument, which holds beyond the translation-invariant situation, is that in frustration-free models, edge modes cannot merge into the ground state band. We give an example of a gapped frustration-free model that is nonetheless gapless on the half-plane.", "url": "https://arxiv.org/abs/2610.21172", "type": "理论", "summary": "我们给出了新的证明，证明平移不变的免费费米子无挫败模型具有零霍尔电导。我们的证明本质上是分析性的，它使用块边对应。超越平移不变情况的核心论点是，在无挫折模型中，边缘模式不能合并到基态带中。我们给出了一个有间隙的无挫折模型的例子，该模型在半平面上仍然是无间隙的。", "authors": [{"name": "Sven Bachmann"}, {"name": "Zhiqian Du"}, {"name": "Martin Fraas"}], "featured_authors": [{"name": "Sven Bachmann"}, {"name": "Zhiqian Du"}, {"name": "Martin Fraas"}], "author_count": 3}, {"id": "2610.21268", "category": "math-ph", "title": "Poisson statistics for one-dimensional Anderson--Bernoulli Schrödinger operators", "abstract": "We prove Poisson local eigenvalue statistics for one-dimensional Schrödinger operators with nondegenerate Bernoulli potentials at any fixed nonzero coupling. After unfolding by the integrated density of states (IDS), the local eigenvalue process converges to a Poisson point process of unit intensity at every energy in the interior of the almost-sure spectrum. The theorem also holds for bounded nonconstant iid potentials, provided the IDS is continuous and strictly increasing near the reference energy. If the IDS also has a finite positive derivative at that energy, the usual linear normalization gives the same limit. The proof uses a phase coordinate with exact IDS drift to obtain a uniform exponential crossing law and joint Poisson counts in disjoint energy windows.", "url": "https://arxiv.org/abs/2610.21268", "type": "理论", "summary": "我们证明了在任何固定非零耦合下具有非简并伯努利势的一维薛定谔算子的泊松局部特征值统计。通过积分态密度（IDS）展开后，局部特征值过程收敛到几乎确定谱内部每个能量处的单位强度的泊松点过程。该定理也适用于有界非恒定 iid 势，前提是 IDS 是连续的并且在参考能量附近严格增加。如果 IDS 在该能量处也具有有限正导数，则通常的线性归一化给出相同的极限。该证明使用具有精确 IDS 漂移的相位坐标来获得均匀指数交叉定律和不相交能量窗口中的联合泊松计数。", "authors": [{"name": "Yi Han"}], "featured_authors": [{"name": "Yi Han"}], "author_count": 1}, {"id": "2610.21462", "category": "math-ph", "title": "Semiclassical Band Splitting in the Infinite Chern Band Model", "abstract": "We study the two lowest Bloch bands of the infinite Chern band model in the semiclassical limit. When the Berry curvature parameter is an odd multiple of \\(\\pi\\), we derive an explicit asymptotic formula for their exponentially small splitting, uniformly over the Brillouin torus. The proof combines Agmon estimates and WKB approximations for a matrix Schrödinger operator whose lowest potential eigenvalue has two wells. Geometric properties of the Agmon distance allow us to compute the leading tunneling coefficients by the method of stationary phase. We provide numerical computations to illustrate the asymptotic formula and support the conjecture that the two bands remain separated for other values of the Berry curvature parameter.", "url": "https://arxiv.org/abs/2610.21462", "type": "理论", "summary": "我们研究半经典极限下无限陈氏能带模型的两个最低布洛赫能带。当 Berry 曲率参数是 \\(\\pi\\) 的奇数倍时，我们得出了一个显式的渐近公式，用于它们在布里渊环上均匀的指数小分裂。该证明结合了矩阵薛定谔算子的 Agmon 估计和 WKB 近似，该算子的最低潜在特征值有两个井。 Agmon 距离的几何特性使我们能够通过固定相方法计算主导隧道系数。我们提供数值计算来说明渐进公式，并支持对于贝里曲率参数的其他值，两个频带保持分离的猜想。", "authors": [{"name": "Tyler Guo"}], "featured_authors": [{"name": "Tyler Guo"}], "author_count": 1}, {"id": "2610.21475", "category": "math-ph", "title": "Approach to Equilibrium in Translation-Invariant Quantum Systems: Structural Results II", "abstract": "We continue the development, started in [AHP 25 (2023), 715-749], of a structural theory of approach to equilibrium in translation-invariant quantum spin systems. Dynamical Steady States (DSS) are defined as w*-limit points of the time-averaged evolution of an initial state. We show that if a DSS is an equilibrium state of a sufficiently regular interaction, then the specific energy of this interaction is necessarily a constant of the motion. Two distinct mechanisms lead to this conclusion, one based on dynamical surface energies and the other on conservation of specific relative entropy. We conjecture that these properties hold for a natural class of interactions. For a DSS admitting a physical equilibrium description, the associated equilibrium states are characterized by a dynamical Gibbs variational principle: they are precisely the minimizers of the specific relative entropy from the initial state over the physical equilibrium states. The achieved minimum equals the increase of specific entropy. The structural theory also yields characterizations of approach to thermal equilibrium, based on two model-dependent questions: restoration of a sufficiently local thermodynamic description at large times and classification of the corresponding local constants of motion. Once locality is restored, the constants of motion determine the possible asymptotic equilibrium states. In particular, if finite-range locality is restored and the energy is the only finite-range constant of the motion, then every DSS is a thermal equilibrium state at the temperature fixed by energy conservation. The finite-time dynamical input underlying this theory is established in a companion paper.", "url": "https://arxiv.org/abs/2610.21475", "type": "理论", "summary": "我们继续开发从 [AHP 25 (2023), 715-749] 开始的平移不变量子自旋系统平衡方法的结构理论。动态稳态 (DSS) 定义为初始状态的时间平均演化的 w* 极限点。我们证明，如果 DSS 是足够规则相互作用的平衡状态，那么这种相互作用的比能必然是运动常数。两种不同的机制得出了这个结论，一种基于动态表面能，另一种基于特定相对熵的守恒。我们推测这些属性适用于一类自然的相互作用。对于承认物理平衡描述的 DSS，相关的平衡状态由动态吉布斯变分原理来表征：它们恰好是初始状态与物理平衡状态之间的特定相对熵的最小值。达到的最小值等于比熵的增加。\n\n结构理论还基于两个与模型相关的问题得出热平衡方法的表征：在很大程度上恢复足够局部的热力学描述以及相应的局部运动常数的分类。一旦局部性恢复，运动常数就决定了可能的渐近平衡状态。特别是，如果恢复有限范围局部性并且能量是运动的唯一有限范围常数，则每个 DSS 都是由能量守恒固定的温度下的热平衡状态。该理论背后的有限时间动态输入是在另一篇论文中建立的。", "authors": [{"name": "Vojkan Jakšić"}, {"name": "Claude-Alain Pillet"}, {"name": "Anna Szczepanek"}], "featured_authors": [{"name": "Vojkan Jakšić"}, {"name": "Claude-Alain Pillet"}, {"name": "Anna Szczepanek"}], "author_count": 3}, {"id": "2610.21489", "category": "math-ph", "title": "Dynamical Conservation Laws in Quantum Spin Systems", "abstract": "We study dynamical conservation laws and the propagation of thermodynamic structure in translation-invariant lattice quantum spin systems. Using Lieb-Robinson bounds [CMP 28 (1972), 251-257] in arbitrary dimension, and Araki's bounds [CMP 14 (1969), 120-157] in dimension one, we prove conservation of the specific entropy, specific energy, and specific relative entropy under suitable assumptions on the interactions. The transported local Hamiltonians admit surface energies that vanish per unit volume in the van Hove limit, and local observables remain a core for the transported generators at every finite time. Weak Gibbsianity is preserved for sufficiently small times in arbitrary dimension and for all times in dimension one. These results provide the analytical foundation for the structural theory of approach to equilibrium developed in a companion paper, and establish partial results toward the conjectures formulated there.", "url": "https://arxiv.org/abs/2610.21489", "type": "理论", "summary": "我们研究平移不变晶格量子自旋系统中的动力学守恒定律和热力学结构的传播。使用任意维度中的 Lieb-Robinson 界限 [CMP 28 (1972), 251-257] 和第一维度中的 Araki 界限 [CMP 14 (1969), 120-157]，我们证明了在适当的相互作用假设下比熵、比能量和比相对熵的守恒。传输的局部哈密顿量承认在范霍夫极限内每单位体积的表面能消失，并且局部可观测量在每个有限时间仍然是传输发生器的核心。弱吉布斯性在任意维度中保留足够小的时间，并且在一维中保留所有时间。这些结果为另一篇论文中提出的均衡方法的结构理论提供了分析基础，并为其中提出的猜想建立了部分结果。", "authors": [{"name": "Vojkan Jakšić"}, {"name": "Claude-Alain Pillet"}, {"name": "Anna Szczepanek"}], "featured_authors": [{"name": "Vojkan Jakšić"}, {"name": "Claude-Alain Pillet"}, {"name": "Anna Szczepanek"}], "author_count": 3}, {"id": "2610.21585", "category": "math-ph", "title": "Augmentation curve for torus knots", "abstract": "We prove a version of topological recursion for the correlation differentials of colored HOMFLY-PT polynomials of torus knots on the corresponding augmentation curves, following the proposal of Gu, Jockers, Klemm, and Soroush. To this end, we explicitly construct the spectral curve from the so-called auxiliary curve of Brini, Eynard, and Mariño and prove that it coincides with the augmentation curve for every torus knot with coprime $(r,s)$. Finally, our version of topological recursion proves the higher-genus closed-string prediction of the Aganagic--Vafa conjecture for all torus knot augmentation curves.", "url": "https://arxiv.org/abs/2610.21585", "type": "理论", "summary": "我们遵循 Gu、Jockers、Klemm 和 Soroush 的建议，证明了相应增广曲线上环面结彩色 HOMFLY-PT 多项式相关微分的拓扑递归版本。为此，我们明确地从所谓的 Brini、Eynard 和 Mariño 辅助曲线构建谱曲线，并证明它与每个具有互质 $(r,s)$ 的环面结的增广曲线一致。最后，我们的拓扑递归版本证明了所有环面结增广曲线的 Aganagic-Vafa 猜想的高属闭弦预测。", "authors": [{"name": "Alexander Hock"}, {"name": "Sergey Shadrin"}], "featured_authors": [{"name": "Alexander Hock"}, {"name": "Sergey Shadrin"}], "author_count": 2}, {"id": "2610.21927", "category": "math-ph", "title": "On the exact quantization of BCOV Theory on Calabi-Yau Manifolds", "abstract": "We announce the solution of constructing perturbative quantum BCOV invariants on arbitrary Calabi-Yau manifolds. In this note, we outline the construction and present an explicit solution. The quantization includes all descendant fields and all loop orders, and expresses the quantum BCOV interaction by an explicit integration over the moduli space of marked Riemann surfaces. This canonical solution provides a mathematical construction of all higher genus BCOV invariants on compact Calabi-Yau manifolds, which are conjecturally equivalent to all higher genus Gromov-Witten invariants on the mirror.", "url": "https://arxiv.org/abs/2610.21927", "type": "理论", "summary": "我们宣布了在任意 Calabi-Yau 流形上构造微扰量子 BCOV 不变量的解决方案。在这篇文章中，我们概述了构造并提出了明确的解决方案。量化包括所有后代场和所有循环阶，并通过在标记黎曼曲面的模空间上的显式积分来表达量子 BCOV 相互作用。该规范解提供了紧致 Calabi-Yau 流形上所有高属 BCOV 不变量的数学构造，它们推测等价于镜子上所有高属 Gromov-Witten 不变量。", "authors": [{"name": "Si Li"}, {"name": "Minghao Wang"}], "featured_authors": [{"name": "Si Li"}, {"name": "Minghao Wang"}], "author_count": 2}, {"id": "2610.22183", "category": "math-ph", "title": "Fixed-Point Abundances and the Onset of Extinctions in Multispecies Lotka-Volterra Ecosystems", "abstract": "I investigate the average and variance of species abundance distributions for fixed-point solutions to generalized Lotka-Volterra ecosystems. Two different analytical methods are constructed. First, I build up on the perturbative Random Matrix Theory approach developed in my earlier work [Phys. Rev. E. 113, L062202 (2026)], and formalize this method diagrammatically. The abundance average is given by a sum of planar diagrams with non-crossing vertex pairings which can be encoded as Dyck paths. This allows me to express the combinatorial factor multiplying perturbative terms at each order as Catalan and Narayana numbers, following which the abundance average is given by the latter's generating functions. In this way, the infinite perturbation expansion is exactly resummed in a closed-form formula. I have not been able to find a similar resummation for the abundance variance, however diagrammatic Feynman rules are expressed, following which the perturbative series can be calculated to any desirable order. Second, I do the same calculations using the cavity method, which gives closed-form formulas for both the abundance average and variance. For the average, the cavity formula gives the exact same result as the perturbative approach when the average interspecies interaction vanishes. When this is not the case, the two results are functionally different, however they are hardly distinguishable in their parametric range of validity. Comparison with numerical data indicate that the cavity result is more accurate over a larger parameter range.", "url": "https://arxiv.org/abs/2610.22183", "type": "理论", "summary": "我研究了广义 Lotka-Volterra 生态系统定点解的物种丰度分布的平均值和方差。构建了两种不同的分析方法。首先，我以我早期工作中开发的微扰随机矩阵理论方法为基础 [Phys. Rev. E. 113, L062202 (2026)]，并以图表形式形式化该方法。丰度平均值由具有非交叉顶点对的平面图之和给出，这些非交叉顶点对可以编码为 Dyck 路径。这使我能够将每个阶的扰动项相乘的组合因子表示为加泰罗尼亚数和纳拉亚纳数，随后丰度平均值由后者的生成函数给出。这样，无限微扰展开就精确地恢复为闭式公式。我无法找到丰度方差的类似恢复，但是表达了图解费曼规则，随后可以将微扰级数计算为任何所需的顺序。其次，我使用空腔方法进行相同的计算，该方法给出了丰度平均值和方差的封闭式公式。\n\n对于平均值，当平均种间相互作用消失时，空腔公式给出的结果与微扰方法完全相同。如果情况并非如此，则两个结果在功能上有所不同，但在其参数有效性范围内几乎无法区分。与数值数据的比较表明，在更大的参数范围内，腔体结果更加准确。", "authors": [{"name": "Philippe Jacquod"}], "featured_authors": [{"name": "Philippe Jacquod"}], "author_count": 1}, {"id": "2610.20654", "category": "quant-ph", "title": "The noise cost of reservoir locality in broadband quantum amplifier chains", "abstract": "Directional quantum amplifiers enable weak-signal readout while protecting the source, but reservoir noise limits sensitivity. Finite-band suppression must reconcile frequency-dependent responses with fixed local couplings and finite rates. We construct adjacent-site loss channels attaining the known single-frequency minimum under local compatibility conditions, as an uncapped benchmark. For specified uniform and dimerized chains, we compare fixed reservoirs at matched drift, ports, high-gain band and complete gain/loss rate caps. At the representative cap $R=8$ and halfwidth $\\Omega=0.05$, nearest-neighbor arithmetic band average noise exceeds the unrestricted optimum by more than $1.01265$ quanta in the uniform chain for every finite $N\\ge64$. Boundary-response bounds give necessary rates and targets requiring range two. At $N=64$, finite-auxiliary calculations retain a noise advantage under matched total coupling budgets; response bounds quantify noise-resolution tolerances. These theoretical results guide reservoir design and noise calibration for a proposed cryogenic microwave array with a $100$ kHz design band.", "url": "https://arxiv.org/abs/2610.20654", "type": "理论+数值", "summary": "定向量子放大器可以在保护信号源的同时实现弱信号读出，但储存器噪声会限制灵敏度。有限带抑制必须使频率相关响应与固定局部耦合和有限速率相协调。我们构建了在本地兼容性条件下达到已知单频最小值的相邻站点损耗信道，作为无上限基准。对于指定的均匀链和二聚链，我们比较了匹配漂移、端口、高增益带和完整增益/损失率上限的固定储库。在代表性上限 $R=8$ 和半宽 $\\Omega=0.05$ 下，对于每个有限的 $N\\ge64$，最近邻算术频带平均噪声在均匀链中超出无限制的最佳值超过 $1.01265$ 量子。边界响应界限给出了需要范围二的必要速率和目标。在 $N=64$ 时，有限辅助计算在匹配的总耦合预算下保留了噪声优势；响应界限量化了噪声分辨率容差。这些理论结果指导建议的具有 100 kHz 设计频带的低温微波阵列的储层设计和噪声校准。", "authors"
