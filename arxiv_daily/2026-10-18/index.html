  <style>
    :root {
      --bg: #f6f1e8;

    }

    .hero {
      padding: 30px;

      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;

    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }

    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }

    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }

  <script>
    const papers = [{"id": "2610.20717", "category": "cond-mat", "title": "All-temperature superfluidity in two dimensions", "abstract": "In local theories with short-range interactions, continuous symmetries cannot be spontaneously broken in two spatial dimensions at nonzero temperature. $\\mathrm{U}(1)$-symmetric models instead admit a Berezinskii--Kosterlitz--Thouless (BKT) phase with quasi-long-range order and nonzero phase stiffness, which is normally destroyed at high temperatures by vortex proliferation. Here, we show that a BKT phase, and with it superfluidity, can persist to arbitrarily high temperatures. Using the large-$N$ expansion, we study a $(2+1)$-dimensional quantum field theory in which a complex scalar is coupled to the critical $\\mathrm{O}(N)$ model. At the biconical fixed point, where the inter-sector coupling is negative, the thermal effective potential has a circle of minima with nonzero $\\mathrm{U}(1)$ amplitude. Integrating out the gapped fluctuations yields an effective theory for the compact phase mode at distances large compared to $1/T$. Since temperature is the only scale at the fixed point, the phase stiffness grows linearly with temperature, with a proportionality factor that scales linearly with $N$ and is fixed entirely by the fixed point. This renders vortex operators irrelevant for sufficiently large $N$. We further show that the vortex fugacity is exponentially small in $N$.", "url": "https://arxiv.org/abs/2610.20717", "type": "理论", "summary": "在具有短程相互作用的局域理论中，连续对称性在非零温度下在两个空间维度上不能自发破缺。 $\\mathrm{U}(1)$-对称模型反而承认具有准长程有序和非零相刚度的 Berezinskii--Kosterlitz--Thouless (BKT) 相，该相通常在高温下被涡旋扩散破坏。在这里，我们证明了 BKT 相及其超流动性可以持续到任意高温。使用大$N$展开，我们研究了$(2+1)$维量子场论，其中复标量耦合到临界$\\mathrm{O}(N)$模型。在双锥固定点，扇区间耦合为负，热有效势具有非零 $\\mathrm{U}(1)$ 振幅的最小值圆。对带隙涨落进行积分，可以得出与 $1/T$ 相比距离较大的紧凑相位模式的有效理论。由于温度是固定点处的唯一尺度，因此相位刚度随温度线性增长，比例因子随 $N$ 线性缩放，并且完全由固定点固定。\n\n这使得涡算子与足够大的$N$无关。我们进一步表明，涡逸度在 $N$ 中呈指数小。", "authors": [{"name": "Bilal Hawashin"}, {"name": "Soumyadeep Chaudhuri"}, {"name": "Igor F. Herbut"}, {"name": "Michael M. Scherer"}], "featured_authors": [{"name": "Bilal Hawashin"}, {"name": "Soumyadeep Chaudhuri"}, {"name": "Igor F. Herbut"}, {"name": "Michael M. Scherer"}], "author_count": 4}, {"id": "2610.20723", "category": "cond-mat", "title": "Boundary-induced geometrical frustration in a square Rydberg-atom lattice", "abstract": "We study geometric defects in square-lattice Rydberg-atom arrays induced by lattice-size parity in the striated density-wave phase. While odd-sized lattices select a single striated domain, even-sized lattices seed incompatible domains at the four corners, resulting in a {\\pi}/2-rotation invariant state with a geometrical defect emanating from the lattice center. At larger detunings, we instead identify a {\\pi}-rotation-invariant state with two domains nucleated by opposite corners and separated by a one-dimensional diagonal defect. We probe the state-preparation protocol on the Aquila atomic quantum processor and benchmark it with equilibrium and real-time dynamics tensor-network simulations. Our results assess the role of boundaries and lattice size in determining the global ordering in programmable quantum matter.", "url": "https://arxiv.org/abs/2610.20723", "type": "理论+数值", "summary": "我们研究了条纹密度波相位中由晶格尺寸宇称引起的方晶格里德伯原子阵列中的几何缺陷。奇数尺寸的晶格选择单个条纹域，而偶数尺寸的晶格在四个角处播种不兼容的域，从而产生具有从晶格中心发出的几何缺陷的 {\\pi}/2 旋转不变状态。在较大的失谐中，我们改为识别一个 {\\pi}-旋转不变状态，其中两个域由对角成核并由一维对角线缺陷分隔开。我们探讨了 Aquila 原子量子处理器上的状态准备协议，并通过平衡和实时动态张量网络模拟对其进行基准测试。我们的结果评估了边界和晶格尺寸在确定可编程量子物质的全局排序中的作用。", "authors": [{"name": "Marco Rigobello"}, {"name": "Luka Pavešić"}, {"name": "Daniel Jaschke"}, {"name": "Pietro Silvi"}, {"name": "Marco Di Liberto"}, {"name": "Simone Montangero"}, {"name": "Simone Notarnicola"}], "featured_authors": [{"name": "Marco Rigobello"}, {"name": "Luka Pavešić"}, {"name": "Daniel Jaschke"}, {"name": "Marco Di Liberto"}, {"name": "Simone Montangero"}, {"name": "Simone Notarnicola"}], "author_count": 7}, {"id": "2610.20724", "category": "cond-mat", "title": "Long-lived local coherences at high temperature from frozen domain walls", "abstract": "Local coherences between distinct charge sectors--measured by the single-particle Green's function or the transverse spin autocorrelation function--do not overlap with hydrodynamic modes. At finite temperature, therefore, they decay faster than any power law in generic chaotic systems. We present a mechanism by which these coherences can persist anomalously long, for integrable and chaotic spin chains (including the XXZ and Fredkin spin chains) that obey a quantum group symmetry. We show--using a Mazur bound derived from the quantum-group symmetry, together with locality and a \"non-undershoot\" assumption--that the transverse spin autocorrelation function $C(t) \\equiv \\langle \\sigma^-_x(t) \\sigma^+_x(0)\\rangle$ can decay at most algebraically: $C(t) \\gtrsim 1/t^2$. This bound is not tight: in the large-anisotropy limit of the XXZ spin chain, at infinite temperature, we explicitly compute $C(t) \\sim \\sqrt{3}/(18 \\sqrt{t})$. We also compute this decay rate in the XXZ spin chain for general easy-axis anisotropy, and estimate it to scale as $C(t) \\sim t^{-2/z}$ (for transport exponent $z$) in the chaotic models.", "url": "https://arxiv.org/abs/2610.20724", "type": "理论", "summary": "不同电荷扇区之间的局部相干性（通过单粒子格林函数或横向自旋自相关函数测量）与流体动力学模式不重叠。因此，在有限温度下，它们的衰减速度比一般混沌系统中的任何幂律都快。我们提出了一种机制，对于服从量子群对称性的可积混沌自旋链（包括 XXZ 和 Fredkin 自旋链），这些相干性可以异常长时间地持续存在。我们使用从量子群对称性导出的马祖尔界，以及局域性和“非下冲”假设，证明横向自旋自相关函数 $C(t) \\equiv \\langle \\sigma^-_x(t) \\sigma^+_x(0)\\rangle$ 最多可以代数衰减：$C(t) \\gtrsim 1/t^2$。这个界限并不严格：在 XXZ 自旋链的大各向异性极限中，在无限温度下，我们显式计算 $C(t) \\sim \\sqrt{3}/(18 \\sqrt{t})$。我们还计算了 XXZ 自旋链中一般易轴各向异性的衰减率，并估计其在混沌模型中的缩放比例为 $C(t) \\sim t^{-2/z}$ （对于传输指数 $z$）。", "authors": [{"name": "Sarang Gopalakrishnan"}, {"name": "Romain Vasseur"}], "featured_authors": [{"name": "Sarang Gopalakrishnan"}, {"name": "Romain Vasseur"}], "author_count": 2}, {"id": "2610.20734", "category": "cond-mat", "title": "Quantum oscillations in a solvable model of a Kondo insulator", "abstract": "We study the effects of interactions on the low-energy density of states (SdH) and magnetization (dHvA) quantum oscillations (QOs) in a Kondo insulator. Toward this end we introduce a generalization of the periodic Anderson model with Sachdev-Ye-Kitaev (SYK) interactions at each site that is exactly solvable in the large-$N$ limit, where $N$ is the number of flavors of the heavy $f$ electrons. We show analytically and numerically that the insulating state remains stable in terms of spectrum, thermodynamics, and transport at low temperatures even for interaction strengths much larger than non-interacting band gap of the hybridization-gap insulator. We analytically derive generalizations of Lifshitz-Kosevich (LK) formulae, distinct for the SdH and dHvA QOs, for the interacting insulator. We find that the SdH oscillation frequencies, $F_0\\pm \\delta F$, corresponding to the conduction and valence band edges, can be weakly renormalized by interaction relative to their non-interacting values. In contrast, dHvA QO frequency $F_0$ is not renormalized by interactions, and remains the same as that for the non-interacting unhybridized bands. The QO amplitudes show a remarkable difference: the dHvA amplitude is essentially unaffected by interactions, while the SdH amplitude is strongly enhanced due to gap renormalization.", "url": "https://arxiv.org/abs/2610.20734", "type": "理论+数值", "summary": "我们研究了近藤绝缘体中相互作用对低能态密度 (SdH) 和磁化强度 (dHvA) 量子振荡 (QO) 的影响。为此，我们引入了周期性安德森模型的推广，每个位点具有 Sachdev-Ye-Kitaev (SYK) 相互作用，该模型在大 $N$ 限制下完全可解，其中 $N$ 是重 $f$ 电子的味道数量。我们通过分析和数值证明，即使相互作用强度远大于杂化带隙绝缘体的非相互作用带隙，绝缘态在低温下的光谱、热力学和输运方面也保持稳定。我们通过分析推导了相互作用绝缘体的 Lifshitz-Kosevich (LK) 公式的概括，该公式对于 SdH 和 dHvA QO 是不同的。我们发现，对应于导带边缘和价带边缘的 SdH 振荡频率 $F_0\\pm \\delta F$ 可以通过相对于非相互作用值的相互作用进行弱重整化。相反，dHvA QO 频率 $F_0$ 不会通过相互作用重新归一化，并且与非相互作用的未杂交频带保持相同。\n\nQO 幅度显示出显着差异：dHvA 幅度基本上不受相互作用的影响，而 SdH 幅度由于间隙重正化而大大增强。", "authors": [{"name": "Abhisek Samanta"}, {"name": "Mohit Randeria"}, {"name": "Sumilan Banerjee"}], "featured_authors": [{"name": "Abhisek Samanta"}, {"name": "Mohit Randeria"}, {"name": "Sumilan Banerjee"}], "author_count": 3}, {"id": "2610.20755", "category": "cond-mat", "title": "Resonant enhancement of Raman scattering in a MoS$_2$ nanotube", "abstract": "The whispering-gallery modes confined in the wall of a multiwall MoS$_2$ nanotube resonantly enhance the spontaneous Raman scattering by its own optical phonons. The enhancement is doubly resonant --- pump and Stokes waves hit two adjacent modes at one pump energy, and the signal scales as $(Q_{\\rm pump}Q_{\\rm sc})^2$ - whenever a phonon energy matches the free spectral range of the mode ladder. Near the A exciton the excitonic dispersion compresses the ladder and sweeps its spacing through all intralayer phonon energies of MoS$_2$, so the match, reached for $A_{1g}$ at $E_{\\rm pump}=1551$~meV, requires no geometric tuning. A missed match splits the excitation peak into a pump- and a scattered-resonant doublet whose splitting measures the residual detuning. Selection rules confine the double resonance to the TM$\\to$TM channel and exclude $E_{1g}$.", "url": "https://arxiv.org/abs/2610.20755", "type": "理论", "summary": "限制在多壁 MoS$_2$ 纳米管壁中的回音壁模式通过其自身的光学声子共振增强了自发拉曼散射。这种增强是双重共振的——泵浦波和斯托克斯波以一种泵浦能量撞击两个相邻模式，并且只要声子能量与模式梯的自由光谱范围匹配，信号就会缩放为 $(Q_{\\rm Pump}Q_{\\rm sc})^2$。在 A 激子附近，激子色散压缩梯子并将其间距扫过 MoS$_2$ 的所有层内声子能量，因此在 $E_{\\rm Pump}=1551$~meV 处达到 $A_{1g}$ 的匹配，不需要几何调整。错过的匹配将激发峰分裂成泵浦和散射谐振双峰，其分裂测量残余失谐。选择规则将双共振限制在 TM$\\to$TM 通道并排除 $E_{1g}$。", "authors": [{"name": "D.R. Kazanov"}, {"name": "A.V. Poshakinskiy"}], "featured_authors": [{"name": "D.R. Kazanov"}, {"name": "A.V. Poshakinskiy"}], "author_count": 2}, {"id": "2610.20886", "category": "cond-mat", "title": "Material dependence of direct light-induced charge injection from metallic nanoparticles into adsorbates", "abstract": "Direct injection of charge from metallic nanoparticles into adsorbed molecules via the chemical interface damping of localized surface plasmons has emerged as a promising avenue to avoid the rapid thermalization of hot carriers. In this paper, we develop an approach for predicting hot-electron and hot-hole injection rates from large spherical nanoparticles into adsorbed carbon monoxide (CO) molecules. The approach combines a detailed description of the adsorbate-metal interactions via ab initio density functional theory with a macroscopic electrodynamics treatment of the localized surface plasmon. We apply this approach to nine different metals including both traditional (Ag, Au, Cu) and emerging (Al) plasmonic metals as well as non-plasmonic metals (Ni, Rh, Pd, Ir, Pt). For all metals, hot-electron injection is larger than hot-hole injection. This is a consequence of the alignment of the CO frontier orbitals, with the CO lowest unoccupied molecular orbital (LUMO) being closer to the metal Fermi energy than the highest occupied molecular orbital (HOMO). The largest electron injection rates in the optical photon ranges are obtained for Al, Ag, Cu and Au, with Cu and Au showing significant plasmonic enhancement. The non-plasmonic metals show weak electron injection as a consequence of their high LUMO energies relative to the metal Fermi level. The results of our study pave the way towards a rational design of metallic nanoscale photocatalysts for specific chemical processes.", "url": "https://arxiv.org/abs/2610.20886", "type": "理论+数值", "summary": "通过局部表面等离激元的化学界面阻尼将金属纳米粒子的电荷直接注入到吸附的分子中已成为避免热载流子快速热化的有前途的途径。在本文中，我们开发了一种方法来预测从大型球形纳米粒子到吸附的一氧化碳（CO）分子的热电子和热空穴注入速率。该方法将通过从头算密度泛函理论对吸附物-金属相互作用的详细描述与局部表面等离子体的宏观电动力学处理相结合。我们将此方法应用于九种不同的金属，包括传统的（Ag、Au、Cu）和新兴的（Al）等离子体金属以及非等离子体金属（Ni、Rh、Pd、Ir、Pt）。对于所有金属，热电子注入大于热空穴注入。这是 CO 前沿轨道排列的结果，CO 最低未占据分子轨道 (LUMO) 比最高占据分子轨道 (HOMO) 更接近金属费米能量。\n\nAl、Ag、Cu 和 Au 获得了光学光子范围内最大的电子注入速率，其中 Cu 和 Au 显示出显着的等离子体增强。非等离子体金属由于其相对于金属费米能级具有较高的 LUMO 能量而表现出较弱的电子注入。我们的研究结果为合理设计用于特定化学过程的金属纳米级光催化剂铺平了道路。", "authors": [{"name": "Jordan Alan Edwards"}, {"name": "Johannes Lischner"}], "featured_authors": [{"name": "Jordan Alan Edwards"}, {"name": "Johannes Lischner"}], "author_count": 2}, {"id": "2610.20897", "category": "cond-mat", "title": "Casimir Sign Reversal from Finite-Range Bogoliubov Fluctuations", "abstract": "We study the zero-temperature Casimir effect of a three-dimensional Bose fluid with finite-range corrections to its Bogoliubov spectrum. Beyond the universal acoustic contribution scaling as $L^{-3}$, the long-distance expansion contains a nonuniversal $L^{-5}$ correction that can compete with the phononic term. We derive this crossover analytically within a minimal isotropic finite-range model and test the asymptotic result against the full dispersion. A regulator-independent Poisson-resummed calculation confirms that sign reversals of the Casimir energy are possible, while showing that the apparent low-coupling zero inferred by balancing only the $L^{-3}$ and $L^{-5}$ terms is not quantitatively controlled. Robust sign changes instead occur in the stable regime close to roton softening, where the Casimir energy acquires an oscillatory finite-momentum contribution. Strongly dipolar atomic gases provide a natural motivation for microscopic interaction lengths in the nanometric regime. We further discuss how the resulting nonlinear force law could be probed through the frequency response of a driven nanomechanical resonator.", "url": "https://arxiv.org/abs/2610.20897", "type": "理论+数值", "summary": "我们研究了三维玻色流体的零温卡西米尔效应，并对其 Bogoliubov 谱进行了有限范围修正。除了通用声学贡献缩放 $L^{-3}$ 之外，长距离扩展还包含可与声子项竞争的非通用 $L^{-5}$ 校正。我们在最小各向同性有限范围模型内分析得出这种交叉，并针对完全色散测试渐近结果。独立于调节器的泊松恢复计算证实卡西米尔能量的符号反转是可能的，同时表明通过仅平衡 $L^{-3}$ 和 $L^{-5}$ 项推断出的表观低耦合零不受定量控制。相反，鲁棒的符号变化发生在接近旋转软化的稳定区域，其中卡西米尔能量获得振荡有限动量贡献。强偶极原子气体为纳米范围内的微观相互作用长度提供了自然的动力。我们进一步讨论如何通过驱动纳米机械谐振器的频率响应来探测由此产生的非线性力定律。", "authors": [{"name": "Fabrizio Canfora"}, {"name": "Pablo Pais"}, {"name": "Luigi Rosa"}], "featured_authors": [{"name": "Fabrizio Canfora"}, {"name": "Pablo Pais"}, {"name": "Luigi Rosa"}], "author_count": 3}, {"id": "2610.20953", "category": "cond-mat", "title": "Denser-than-crystalline disordered polydisperse ellipse packings", "abstract": "By employing SWAP Monte Carlo moves during slow Lubachevsky-Stillinger-like particle growth, we generate well-thermalized disordered jammed ellipse packings for a wide range of particle aspect ratios $\\alpha$ and maximum/minimum particle-diameter ratios $\\lambda$. For $\\lambda > \\lambda_{\\rm xtal}(\\alpha)$, the packings are denser than the perfect monodisperse ellipse crystal ($\\phi_{\\rm xtal}^{\\rm mono} = \\pi/2\\sqrt{3} \\simeq 0.9069$) despite lacking any obvious long-range structural order; we find that $\\lambda_{\\rm xtal}(\\alpha)$ remains below $2.88$ over the range $1 \\leq \\alpha \\leq 5$, and drops below $1.65$ for $\\alpha \\simeq 1.2$. These disordered $\\phi > \\phi_{\\rm xtal}^{\\rm mono}$ packings are the first of their kind reported for anisotropic particles. Multiscale analyses reveal that their characteristic structural motifs are strongly $\\alpha$- and $\\lambda$-dependent, but none of the examined metrics change sharply as the $\\lambda = \\lambda_{\\rm xtal}(\\alpha)$ boundary is crossed. For example, we find that packings with $\\alpha \\simeq 1.2$ and $\\lambda \\simeq \\lambda_{\\rm xtal}(\\alpha)$ exhibit a fractionated-hexatic-plastic-polycrystalline structure that (like that of the recently-reported ideal disk glasses) can be exactly-isostatic, triangulated, and effectively-hyperuniform with respect to packing-fraction fluctuations. In contrast, even-denser packings with larger $\\alpha$ and $\\lambda$ have none of these properties.", "url": "https://arxiv.org/abs/2610.20953", "type": "理论+数值", "summary": "通过在类似 Lubachevsky-Stillinger 的颗粒缓慢生长过程中采用 SWAP 蒙特卡罗移动，我们生成了良好热化的无序堵塞椭圆填料，适用于各种颗粒长宽比 $\\alpha$ 和最大/最小颗粒直径比 $\\lambda$。对于 $\\lambda > \\lambda_{\\rm xtal}(\\alpha)$，尽管缺乏任何明显的长程结构顺序，但堆积比完美单分散椭圆晶体 ($\\phi_{\\rm xtal}^{\\rm mono} = \\pi/2\\sqrt{3} \\simeq 0.9069$) 更致密；我们发现 $\\lambda_{\\rm xtal}(\\alpha)$ 在 $1 \\leq \\alpha \\leq 5$ 范围内保持在 $2.88$ 以下，在 $\\alpha \\simeq 1.2$ 范围内降至 $1.65$ 以下。这些无序的 $\\phi > \\phi_{\\rm xtal}^{\\rm mono}$ 填料是第一个针对各向异性粒子报道的同类填料。多尺度分析表明，它们的特征结构基序强烈依赖于$\\alpha$-和$\\lambda$，但是当$\\lambda = \\lambda_{\\rm xtal}(\\alpha)$边界被跨越时，所检查的指标都没有发生急剧变化。\n\n例如，我们发现具有 $\\alpha \\simeq 1.2$ 和 $\\lambda \\simeq \\lambda_{\\rm xtal}(\\alpha)$ 的填料表现出分级六方塑料多晶结构，该结构（如最近报道的理想圆盘玻璃的结构）可以是完全等静压的、三角化的，并且相对于填料分数波动而言是有效超均匀的。相反，具有较大 $\\alpha$ 和 $\\lambda$ 的甚至更密集的堆积则没有这些属性。", "authors": [{"name": "Kinsley G. Trlak"}, {"name": "Dewni S. de Silva"}, {"name": "Salvatore Torquato"}, {"name": "Robert S. Hoy"}], "featured_authors": [{"name": "Kinsley G. Trlak"}, {"name": "Dewni S. de Silva"}, {"name": "Salvatore Torquato"}, {"name": "Robert S. Hoy"}], "author_count": 4}, {"id": "2610.20963", "category": "cond-mat", "title": "Fisher information analysis of a Langevin System with Thermal and Athermal Noise", "abstract": "Fisher Information (FI) has proven to be a useful tool for estimating the parameters of a system when only statistical data are available. We apply this method to a system of Langevin equations analogous to the Brownian Gyrator, in which the coupling parameter $b$ and the athermal noise strength $D$ are treated as unknown quantities. Using the FI, we discuss the estimation of the coupling parameter between the degrees of freedom and the quantity $D$ associated with the external noise effects. We find that the diagonal components of the FI exhibit nontrivial behavior, whereas the off-diagonal components display a monotonic dependence on the parameters of interest. This distinction may contribute to an accurate estimation of $b$ and $D$.", "url": "https://arxiv.org/abs/2610.20963", "type": "理论", "summary": "事实证明，当只有统计数据可用时，费希尔信息 (FI) 是估计系统参数的有用工具。我们将此方法应用于类似于布朗回转器的朗之万方程组，其中耦合参数 $b$ 和无热噪声强度 $D$ 被视为未知量。使用 FI，我们讨论了自由度和与外部噪声影响相关的量 $D$ 之间的耦合参数的估计。我们发现 FI 的对角线分量表现出不平凡的行为，而非对角线分量则表现出对感兴趣参数的单调依赖性。这种区别可能有助于准确估计 $b$ 和 $D$。", "authors": [{"name": "Eduardo S. Nascimento"}, {"name": "Welles A. M. Morgado"}], "featured_authors": [{"name": "Eduardo S. Nascimento"}, {"name": "Welles A. M. Morgado"}], "author_count": 2}, {"id": "2610.20982", "category": "cond-mat", "title": "The Blume-Capel Model as a $ϕ^6$ Field Theory: A Monte Carlo and Flow Model Study", "abstract": "We report Monte Carlo simulations of a continuous spin variant of the Blume-Capel model. We compute the phase diagrams in the crystal-field-temperature plane, as a function of the softness of the spins. We show that normalizing flows, a class of generative models capable of direct sampling without autocorrelation, are effective samplers across the phase diagram, including in the first-order transition region and in the vicinity of the tricritical point. Finite-size scaling analyses of flow samples locate the first- and second-order transitions as well as the tricritical point with accuracy comparable to canonical and extended-ensemble Monte Carlo.", "url": "https://arxiv.org/abs/2610.20982", "type": "理论+数值", "summary": "我们报告了 Blume-Capel 模型的连续自旋变体的蒙特卡罗模拟。我们计算晶体场温度平面中的相图，作为自旋柔软度的函数。我们证明，归一化流是一类能够在没有自相关的情况下直接采样的生成模型，是整个相图中的有效采样器，包括一阶过渡区域和三临界点附近。流样本的有限尺寸缩放分析可以定位一阶和二阶转变以及三临界点，其精度可与规范和扩展系综蒙特卡罗相媲美。", "authors": [{"name": "Ejaaz Merali"}, {"name": "Ryan Larson"}, {"name": "Ehsan Khatami"}, {"name": "Richard T. Scalettar"}], "featured_authors": [{"name": "Ejaaz Merali"}, {"name": "Ryan Larson"}, {"name": "Ehsan Khatami"}, {"name": "Richard T. Scalettar"}], "author_count": 4}, {"id": "2610.21050", "category": "cond-mat", "title": "Large Language Model-Assisted Systematic Study of Anomalous Adsorption Phenomena", "abstract": "Soft porous crystals can undergo guest-induced structural transitions producing unconventional adsorption isotherms, which are valuable for gas separation and storage applications. However, the evidence for these transitions is scattered across the literature in narrative form and has not been aggregated. Here we use a large language model pipeline to mine the literature for anomalous adsorption, extracting phase-transition events together with material, adsorbate, temperature and pressure metadata and classifying each into an established behavioural class. Benchmarked against human annotation, the extraction stage attains an F1 score of 0.96. When applied at scale, the pipeline yields a curated corpus of 547 transitions across 240 distinct materials, drawn from 200 of 4,252 screened publications, which we further link to crystallographic structures. Analysis of this database shows that the principal behavioural classes, gate-opening and breathing, are distinguished by their functional response. Gate-opening frameworks transform at a significantly lower pressure than breathing frameworks (p = 3.8E-3). In contrast, no difference in pore size, void fraction, linker chemistry or metal identity was detected between the classes. Our findings argue for a functional rather than purely structural description of responsive porous materials. They also highlight the need for a community database that records the guest, temperature and pressure of every reported transition of these materials.", "url": "https://arxiv.org/abs/2610.21050", "type": "理论", "summary": "软多孔晶体可以经历客体诱导的结构转变，产生非常规的吸附等温线，这对于气体分离和存储应用很有价值。然而，这些转变的证据以叙述形式分散在文献中，并且没有被汇总。在这里，我们使用大型语言模型管道来挖掘异常吸附的文献，提取相变事件以及材料、吸附物、温度和压力元数据，并将每个事件分类为已建立的行为类别。以人类注释为基准，提取阶段的 F1 分数为 0.96。当大规模应用时，该管道会生成一个包含 240 种不同材料的 547 个转变的精选语料库，这些语料库取自 4,252 篇经过筛选的出版物中的 200 篇，我们进一步将其与晶体结构联系起来。对该数据库的分析表明，主要的行为类别（开门和呼吸）通过其功能反应来区分。开门框架在比呼吸框架低得多的压力下发生转变 (p = 3.8E-3)。\n\n相比之下，在不同类别之间没有检测到孔径、空隙率、连接化学或金属特性的差异。我们的研究结果支持对响应性多孔材料进行功能性而非纯粹结构性的描述。他们还强调需要一个社区数据库来记录这些材料每次报告的转变的客人、温度和压力。", "authors": [{"name": "Fengxu Yang"}, {"name": "Matthew L. Schneider"}, {"name": "Weitong Chen"}, {"name": "Jack D. Evans"}], "featured_authors": [{"name": "Fengxu Yang"}, {"name": "Matthew L. Schneider"}, {"name": "Weitong Chen"}, {"name": "Jack D. Evans"}], "author_count": 4}, {"id": "2610.21155", "category": "cond-mat", "title": "Localized states of the non-Hermitian Schr{ö}dinger equation with a complex $1/r^{2}$ potential: from Efimov states to bipolarons", "abstract": "We study the non-Hermitian Schrödinger equation with a complex $1/r^{2}$ potential, which bridges Hermitian few-body and non-Hermitian many-body physics: a real attractive potential describes Efimov bound states, whereas a purely imaginary one describes the medium-induced interaction between two heavy polarons at large separations. We solve this equation analytically, obtaining both the localized and continuum states, and compare the solutions with numerical and WKB results. As the imaginary part of the potential is increased, the energies of the Efimov bound states acquire imaginary parts and rotate counterclockwise in the complex plane. On approaching the purely imaginary potential, the excited states disappear sequentially, while the Efimov ground state is smoothly connected to a bipolaron state localized at short distance. Such a bipolaron is localized solely by the medium-induced imaginary interaction, without any attractive real potential. Solving the equation by finite differences, we find that each bipolaron state is necessarily accompanied by another localized state that oscillates on the scale of the mesh size and hence has no counterpart in the continuum limit. Each such pair coalesces at an exceptional point as the strength of the purely imaginary potential is varied, whereas the coalescence is lifted once a finite real part is introduced. We show that this behavior originates from a symmetry of the discretized Schrödinger equation that holds for any purely imaginary potential.", "url": "https://arxiv.org/abs/2610.21155", "type": "理论+数值", "summary": "我们研究了具有复杂 $1/r^{2}$ 势的非厄米薛定谔方程，该方程连接了厄米少体和非厄米多体物理：真正的吸引势描述了 Efimov 束缚态，而纯虚数则描述了大间距下两个重极化子之间的介质诱导相互作用。我们解析求解该方程，获得局域态和连续态，并将解与数值和 WKB 结果进行比较。随着势的虚部增加，Efimov 束缚态的能量获得虚部并在复平面中逆时针旋转。在接近纯虚数势时，激发态依次消失，而 Efimov 基态平滑地连接到短距离局域的双极子态。这种双极子仅由介质引起的想象相互作用来定位，没有任何有吸引力的真实潜力。通过有限差分求解方程，我们发现每个双极子状态必然伴随着另一个在网格尺寸范围内振荡的局域状态，因此在连续体极限中没有对应的状态。\n\n当纯虚势的强度变化时，每个这样的对在一个特殊点处合并，而一旦引入有限实部，合并就会解除。我们证明这种行为源于离散薛定谔方程的对称性，该方程适用于任何纯虚数势。", "authors": [{"name": "Kyoka Tsunoda"}, {"name": "Kazuki Yamamoto"}, {"name": "Shimpei Endo"}], "featured_authors": [{"name": "Kyoka Tsunoda"}, {"name": "Kazuki Yamamoto"}, {"name": "Shimpei Endo"}], "author_count": 3}, {"id": "2610.21288", "category": "cond-mat", "title": "Dynamical phase transition for a logarithm observable in chaotic systems", "abstract": "We consider the full distribution $P_N(A)$ of the dynamical observable $A = - \\sum_{i=1}^N \\ln x_i$ where $x_1, \\dots, x_N$ is a sequence generated by a chaotic map $f(x)$ via $x_{n+1} = f(x_n)$. We study the particular cases where $f(x)$ is the doubling, tent or logistic map, and focus on the limit $N \\gg 1$. Typical fluctuations of $A$ are Gaussian with mean $\\left\\langle A\\right\\rangle$ and variance which are both of order $\\sim N$. We find that the left tail of the distribution ($A < \\left\\langle A\\right\\rangle$) scales as $P_{N}(A) \\sim e^{-NI(A/N)}$, and calculate the rate function $I(a)$ which depends on the map $f(x)$. Interestingly, we find that the right tail of the distribution ($A > \\left\\langle A\\right\\rangle$) follows an anomalous scaling: $P_{N}(A) \\sim e^{-N^{1/3} F((A-\\left\\langle A\\right\\rangle) / N^{2/3})}$. The large-deviation function $F(y)$ has a universal form for the three maps, differing only in the scaling constants. At a critical value $y=y_c$, it exhibits a corner singularity which has the character of a condensation transition. The transition separates between a subcritical phase $0< y<y_c$ in which the fluctuations are Gaussian and arise homogeneously from all of the $x_i$'s, and a supercritical phase $y>y_c$ in which a small fraction of the $x_i$'s give a macroscopic contribution to the fluctuation. Despite this anomalous behavior of the right tail, we find that the cumulants of the distribution $P_N(A)$ grow linearly with $N$ at large $N$, and calculate the associated coefficients.", "url": "https://arxiv.org/abs/2610.21288", "type": "理论", "summary": "我们考虑动态可观测值 $A = - \\sum_{i=1}^N \\ln x_i$ 的完整分布 $P_N(A)$，其中 $x_1, \\dots, x_N$ 是由混沌映射 $f(x)$ 通过 $x_{n+1} = f(x_n)$ 生成的序列。我们研究 $f(x)$ 是加倍图、帐篷图或逻辑图的特殊情况，并重点关注极限 $N \\gg 1$。 $A$ 的典型波动是高斯分布，均值 $\\left\\langle A\\right\\rangle$ 和方差均为 $\\sim N$ 阶。我们发现分布的左尾 ($A < \\left\\langle A\\right\\rangle$) 缩放为 $P_{N}(A) \\sim e^{-NI(A/N)}$，并计算依赖于映射 $f(x)$ 的速率函数 $I(a)$。有趣的是，我们发现分布的右尾 ($A > \\left\\langle A\\right\\rangle$) 遵循异常缩放：$P_{N}(A) \\sim e^{-N^{1/3} F((A-\\left\\langle A\\right\\rangle) / N^{2/3})}$。大偏差函数 $F(y)$ 对于这三个地图具有通用形式，仅在缩放常数上有所不同。在临界值 $y=y_c$ 处，它表现出具有凝聚转变特征的角奇点。\n\n该转变将亚临界相 $0< y<y_c$ 和超临界相 $y>y_c$ 分开，其中波动为高斯分布，并且由所有 $x_i$ 均匀产生，而超临界相 $y>y_c$ 则 $x_i$ 的一小部分对波动产生宏观贡献。尽管右尾有这种异常行为，我们发现分布 $P_N(A)$ 的累积量在大 $N$ 处随 $N$ 线性增长，并计算相关系数。", "authors": [{"name": "Lucianno Defaveri"}, {"name": "Naftali R. Smith"}], "featured_authors": [{"name": "Lucianno Defaveri"}, {"name": "Naftali R. Smith"}], "author_count": 2}, {"id": "2610.21317", "category": "cond-mat", "title": "Thermodynamic-limit bootstrap: Solving fractional quantum Hall ground states", "abstract": "Strongly interacting ground states are usually computed in finite systems and then extrapolated to the thermodynamic limit (TDL). Here we develop a quantum many-body bootstrap that solves fractional quantum Hall ground states directly in the TDL. The method gives rigorous and quantitatively tight lower bounds on the ground-state energy and identifies the ground-state structure and topological order. For Laughlin and Pfaffian parent Hamiltonians, it reproduces exact pair-correlation functions and low-lying orbital entanglement spectrum (OES) nearly level by level. For Coulomb interactions, the rigorous TDL energy bounds closely match thermodynamic estimates from exact diagonalization and density-matrix renormalization group (DMRG) extrapolations, and the local diagnostics recover established Laughlin and Moore--Read OES counting and Friedel oscillations of the composite Fermi liquid. Beyond these benchmarks, the bootstrap resolves the thermodynamic ground states at $\\nu=1/4$ and $\\nu=12/5$, identifying a composite Fermi liquid and $\\overline{\\mathrm{RR}}_3$ topological order, respectively. The same framework applies equally well to Abelian and non-Abelian, gapped and gapless quantum Hall states. The TDL bootstrap therefore provides a general ground-state solver that determines both the energy and the state directly in the TDL.", "url": "https://arxiv.org/abs/2610.21317", "type": "理论+数值", "summary": "强相互作用的基态通常在有限系统中计算，然后外推到热力学极限（TDL）。在这里，我们开发了一种量子多体自举程序，可以直接在 TDL 中求解分数量子霍尔基态。该方法给出了严格且定量严格的基态能量下界，并确定了基态结构和拓扑顺序。对于劳克林和普法夫父哈密顿量，它几乎逐层再现了精确的配对相关函数和低位轨道纠缠谱（OES）。对于库仑相互作用，严格的 TDL 能量界限与精确对角化和密度矩阵重正化群 (DMRG) 外推法的热力学估计紧密匹配，并且局部诊断恢复了已建立的 Laughlin 和 Moore--Read OES 计数和复合费米液体的 Friedel 振荡。除了这些基准之外，引导程序还解析了 $\\nu=1/4$ 和 $\\nu=12/5$ 处的热力学基态，分别识别了复合费米液体和 $\\overline{\\mathrm{RR}}_3$ 拓扑顺序。\n\n相同的框架同样适用于阿贝尔和非阿贝尔、有隙和无隙量子霍尔态。因此，TDL 自举程序提供了一个通用基态求解器，可以直接确定 TDL 中的能量和状态。", "authors": [{"name": "Qiang Gao"}, {"name": "Taige Wang"}], "featured_authors": [{"name": "Qiang Gao"}, {"name": "Taige Wang"}], "author_count": 2}, {"id": "2610.21369", "category": "cond-mat", "title": "Pairing-channel reconstruction by Ising spin-orbit coupling in a multiorbital triangular-lattice model", "abstract": "Ising spin-orbit coupling (SOC) is widely known for locking electronic spins and protecting superconductivity against in-plane paramagnetic pair breaking. Here we show that, in a correlated multiorbital system, Ising SOC can play a qualitatively different role: it reconstructs the hierarchy of spin-fluctuation-mediated pairing channels by reshaping the low-energy Fermi surfaces, orbital-spin coherence factors, and momentum-resolved scattering phase space. We study a noncentrosymmetric two-orbital triangular-lattice model with Rashba SOC, Ising SOC, and onsite SOC. We solve the pairing problem within a multiorbital random-phase-approximation framework. In the single-orbital limit, an $E$-representation state with a dominant $S_z=0$ component emerges only at relatively strong Ising SOC. Orbital degrees of freedom facilitate the stabilization of this pairing state at a smaller nominal Ising SOC strength and generate a broad competition between $E$ and $A_1$ pairing channels. The $E$ state can maintain the same $S_z=0$ triplet character, whereas the $A_1$ state becomes a fully gapped sign-changing $\\splusminus$ superconductor. The latter also realizes a topologically nontrivial phase in the time-reversal-invariant weak-pairing regime, with a nonzero $\\mathbb{Z}_2$ index, Wilson-loop spectral flow, and boundary modes. Its topology is not carried by a single orbital pairing component, but emerges cooperatively from the dominant intra- and inter-orbital pairing components. These results establish a microscopic route by which Ising SOC and orbital hybridization can reconstruct interaction-driven superconductivity, producing both Ising-triplet and topological singlet-dominated phases in correlated non-centrosymmetric systems.", "url": "https://arxiv.org/abs/2610.21369", "type": "理论+数值", "summary": "伊辛自旋轨道耦合 (SOC) 因锁定电子自旋和保护超导免受面内顺磁对断裂而广为人知。在这里，我们表明，在相关的多轨道系统中，伊辛 SOC 可以发挥性质不同的作用：它通过重塑低能费米面、轨道自旋相干因子和动量分辨散射相空间来重建自旋涨落介导的配对通道的层次结构。我们研究了具有 Rashba SOC、Ising SOC 和现场 SOC 的非中心对称双轨道三角晶格模型。我们在多轨道随机相位近似框架内解决配对问题。在单轨道极限下，仅在相对较强的 Ising SOC 下才会出现具有主导 $S_z=0$ 分量的 $E$ 表示态。轨道自由度有助于在较小的名义 Ising SOC 强度下稳定该配对状态，并在 $E$ 和 $A_1​​$ 配对通道之间产生广泛的竞争。 $E$ 态可以保持相同的 $S_z=0$ 三元组字符，而 $A_1​​$ 态则成为完全带隙的变号 $\\splusminus$ 超导体。\n\n后者还实现了时间反转不变弱配对机制中的拓扑非平凡相，具有非零 $\\mathbb{Z}_2$ 索引、威尔逊环谱流和边界模式。它的拓扑结构不是由单个轨道配对组件承载的，而是由占主导地位的轨道内和轨道间配对组件共同产生的。这些结果建立了一条微观途径，伊辛 SOC 和轨道杂化可以重建相互作用驱动的超导性，从而在相关非中心对称系统中产生伊辛三重态和拓扑单重态为主的相。", "authors": [{"name": "Lichuan Wang"}, {"name": "Yuhang Xiao"}, {"name": "Ran Wang"}, {"name": "Xinliang Huang"}, {"name": "Ning Hao"}], "featured_authors": [{"name": "Lichuan Wang"}, {"name": "Yuhang Xiao"}, {"name": "Ran Wang"}, {"name": "Xinliang Huang"}, {"name": "Ning Hao"}], "author_count": 5}, {"id": "2610.21416", "category": "cond-mat", "title": "Edge state reconstruction in proximitized graphene and its probe using RKKY interaction", "abstract": "Proximity induced spin-orbit coupling (SOC) in graphene emerges when it is placed on a substrate, breaking sublattice symmetry and giving rise to staggered intrinsic SOC together with Rashba spin-orbit coupling. In zigzag graphene nanoribbons, this staggered SOC produces pseudohelical edge states exhibiting sublattice-locked rather than spin-locked helicity. We investigate the effect of a finite on-site potential, restricted to the edges of the ribbon, on these edge states. We find the inter-valley edge states undergo reconstruction and become purely intra-valley, exhibiting both spin and valley polarization. The charge conductance calculations fail to capture this reconstruction, since the number of transmitted channels remains unchanged. We show that the Ruderman-Kittel-Kasuya-Yosida (RKKY) magnetic exchange interaction, between two magnetic impurities situated on the ribbon edge can be used to probe the shifted band dispersion, for both the uniform and staggered spin-orbit coupling. In the presence of strong intrinsic and Rashba SOC, the RKKY interaction becomes fully anisotropic. Both sublattice staggering and edge potential-induced reconstruction lead to distinct features in the RKKY interaction. We show that the RKKY interaction terms acquire faster oscillations as a function of the spatial separation between two magnetic impurities, in response to the edge state reconstruction, establishing it as an effective probe of the edge states. Additionally, the significant mismatch in the amplitudes of the DM term corresponding to the uniform and staggered SOC, can also act as a probe of the type of SOC.", "url": "https://arxiv.org/abs/2610.21416", "type": "理论+数值", "summary": "当石墨烯放置在基板上时，就会出现石墨烯中的邻近诱导自旋轨道耦合（SOC），打破亚晶格对称性并与 Rashba 自旋轨道耦合一起产生交错的本征 SOC。在锯齿状石墨烯纳米带中，这种交错的 SOC 产生伪螺旋边缘态，表现出亚晶格锁定螺旋性，而不是自旋锁定螺旋性。我们研究了限制在带边缘的有限现场电势对这些边缘状态的影响。我们发现谷间边缘态经历重建并变成纯粹的谷内，表现出自旋和谷极化。电荷电导计算无法捕获这种重建，因为传输通道的数量保持不变。我们表明，位于带边缘的两个磁性杂质之间的 Ruderman-Kittel-Kasuya-Yosida (RKKY) 磁交换相互作用可用于探测均匀和交错自旋轨道耦合的移位能带色散。在存在强本征和 Rashba SOC 的情况下，RKKY 相互作用变得完全各向异性。\n\n亚晶格交错和边缘电势诱导重建都导致 RKKY 相互作用的独特特征。我们表明，RKKY 相互作用项随着两个磁性杂质之间的空间分离而获得更快的振荡，以响应边缘态重建，从而将其确立为边缘态的有效探针。此外，与均匀且交错的 SOC 相对应的 DM 项幅度的显着失配也可以充当 SOC 类型的探针。", "authors": [{"name": "Seerat Khan"}, {"name": "SK Firoz Islam"}], "featured_authors": [{"name": "Seerat Khan"}, {"name": "SK Firoz Islam"}], "author_count": 2}, {"id": "2610.21580", "category": "cond-mat", "title": "Flat-band ferrimagnetism in the edge-centered honeycomb antiferromagnet: From harmonic flat magnon to broad continuum", "abstract": "One of the most striking aspects of a flat band is not merely its lack of dispersion, but that it reduces the single-particle kinetic energy to a very small scale, allowing interaction effects to become the dominant energy scale in the low-energy physics. This picture has underpinned concepts such as flat-band ferromagnetism, flat-band superconductivity, and localized magnons. A more fundamental question, however, remains. Flat bands belong to the language of single-particle or linear-spin-wave physics; whether they survive as protected sharp excitations in a genuine many-body quantum magnet, or merely provide a skeleton of spectral weight left by the noninteracting picture, remains unclear. We study the spin-1/2 Heisenberg antiferromagnet on the edge-centered honeycomb lattice to examine this question. In contrast to flat bands in geometrically frustrated magnets such as kagome, this lattice has a 2:3 sublattice imbalance that renders the intersublattice coupling matrix rectangular, whose null space gives rise to a flat band at the single-particle level. The same imbalance stabilizes a ferrimagnetic ground state through the Lieb--Mattis theorem and leads to an edge-site-localized flat magnon in linear spin-wave theory. Combining linear spin-wave theory, sign-problem-free stochastic series expansion quantum Monte Carlo, and stochastic analytic continuation, we find that quantum fluctuations transform this harmonic flat mode into a broad continuum whose centroid is about 1.55J and nearly dispersionless along the high-symmetry path. Sublattice imbalance thus offers an unfrustrated route that unifies flat bands and ferrimagnetism, and suggests that flat-band geometry organizes many-body spectral weight rather than giving rise to a protected quasiparticle.", "url": "https://arxiv.org/abs/2610.21580", "type": "理论+数值", "summary": "平带最引人注目的方面之一不仅仅是它缺乏色散，而且它将单粒子动能降低到非常小的尺度，使相互作用效应成为低能物理中的主要能量尺度。这张图支撑了平带铁磁性、平带超导性和局域磁振子等概念。然而，一个更根本的问题仍然存在。平带属于单粒子或线性自旋波物理学的语言；它们是否作为受保护的锐激发存在于真正的多体量子磁体中，或者仅仅提供非相互作用图像留下的光谱权重骨架，目前仍不清楚。我们研究边缘中心蜂窝晶格上的自旋 1/2 海森堡反铁磁体来研究这个问题。与戈薇等几何受挫磁体中的平带相比，该晶格具有 2:3 的子晶格不平衡，使子晶格间耦合矩阵呈矩形，其零空间在单粒子水平上产生平带。\n\n同样的不平衡通过利布-马蒂斯定理稳定了亚铁磁基态，并导致线性自旋波理论中的边缘位置局域平面磁振子。结合线性自旋波理论、无符号问题随机级数展开量子蒙特卡罗和随机解析延拓，我们发现量子涨落将这种谐波平坦模式转变为一个宽连续谱，其质心约为1.55J，并且沿着高对称性路径几乎无色散。因此，亚晶格不平衡提供了一条统一平带和亚铁磁性的顺利途径，并表明平带几何结构组织了多体光谱权重，而不是产生受保护的准粒子。", "authors": [{"name": "Sicheng He"}, {"name": "Zhixuan Zhao"}, {"name": "Hanxiang Di"}, {"name": "Shuaihua Zhang"}, {"name": "Yanling Wu"}, {"name": "Jun Li"}], "featured_authors": [{"name": "Sicheng He"}, {"name": "Zhixuan Zhao"}, {"name": "Hanxiang Di"}, {"name": "Shuaihua Zhang"}, {"name": "Yanling Wu"}, {"name": "Jun Li"}], "author_count": 6}, {"id": "2610.21625", "category": "cond-mat", "title": "Universal Dynamic Scaling for Sub-Yield Aging and Over-Yield Rejuvenation in A Cyclically Driven Metallic Glass", "abstract": "Whether sub-yield aging and over-yield rejuvenation in cyclically deformed amorphous solids share a common physical origin or arise from distinct microscopic mechanisms remains a fundamental yet unresolved debate. Using molecular dynamics simulations of a metallic glass, we resolve this duality by uncovering a unified dynamic clock that dictates energy landscape navigation across both regimes. We show that the transition between regimes reflects a fundamental shift in energy injection pathways: (i) In the over-yield regime, rejuvenation is driven as a first-order response to macroscopic plastic shear work derived from Herschel-Bulkley non-linear rheological scaling. (ii) In contrast, this macroscopic work scaling fails in the sub-yield regime, where early-stage energy landscape elevation and subsequent cyclic aging are instead governed by second-order localized elastic stress fluctuations acting as a mechanical catalyst and noise source, respectively. Intense high-rate agitation increases the escape probability from deeper potential energy minima, thereby suppressing the retention efficiency of structural relaxation. By identifying these localized fluctuations as the primary origin of rate-attenuated sub-yield relaxation, we establish an exact scaling identity relating the relaxation attenuation exponent to the stress fluctuation exponent. This work directly bridges non-linear rheology with stress fluctuation dynamics, providing a unified framework to predict and manipulate structural evolution in amorphous solids.", "url": "https://arxiv.org/abs/2610.21625", "type": "理论+数值", "summary": "循环变形非晶固体中的亚屈服老化和超屈服回复是否具有共同的物理起源，或者源于不同的微观机制，仍然是一个基本但尚未解决的争论。利用金属玻璃的分子动力学模拟，我们通过发现一个统一的动态时钟来解决这种二元性，该时钟决定了两种状态下的能量景观导航。我们表明，两种状态之间的转变反映了能量注入途径的根本转变：（i）在超屈服状态中，再生是对源自赫歇尔-巴尔克利非线性流变尺度的宏观塑性剪切功的一阶响应。 （ii）相比之下，这种宏观工作缩放在次屈服状态下失败，其中早期能量景观提升和随后的循环老化反而由分别充当机械催化剂和噪声源的二阶局部弹性应力波动控制。强烈的高速搅拌增加了逃离更深势能最小值的概率，从而抑制了结构松弛的保留效率。\n\n通过将这些局部波动识别为速率衰减子屈服松弛的主要来源，我们建立了将松弛衰减指数与应力波动指数相关联的精确标度恒等式。这项工作直接将非线性流变学与应力波动动力学联系起来，提供了一个统一的框架来预测和操纵非晶固体的结构演化。", "authors": [{"name": "Nannan Ren"}, {"name": "Hongfei Zhang"}, {"name": "Rui Wan"}, {"name": "Pengfei Guan"}, {"name": "Limin Wang"}, {"name": "Baoshuang Shang"}], "featured_authors": [{"name": "Nannan Ren"}, {"name": "Hongfei Zhang"}, {"name": "Rui Wan"}, {"name": "Pengfei Guan"}, {"name": "Limin Wang"}, {"name": "Baoshuang Shang"}], "author_count": 6}, {"id": "2610.21631", "category": "cond-mat", "title": "Finite-size geometric crossover toward fragmentation of the potential energy shell in the quantum random energy model", "abstract": "The quantum random energy model (QREM) is a paradigmatic model for studying delocalization-localization transitions at finite energy density in Fock space. In the computational basis, its diagonal energies are independent Gaussian random variables, in contrast to the correlated energies of local interacting models such as the disordered XXZ chain. In this work, we construct a potential energy shell associated with a basis state, defined through its energy variance, and investigate its connectivity on the Fock-space hypercube. As the transverse field is varied, this energy-selected subgraph undergoes a finite-size geometric crossover between fully connected and fragmented regimes. Furthermore, we observe a correlation between the shell connectivity and the finite-size fractal dimension of the eigenstates, as extracted from the participation entropy. For the QREM, the statistical independence of the diagonal energies allows the shell connectivity to be analyzed as an effective independent site percolation problem on the hypercube, with its crossover scale estimated within a one-hop approximation. At finite energy density, this estimate gives a nonmonotonic dependence of the crossover scale on system size $L$: increasing $L$ initially favors connectivity, while beyond an energy-dependent scale $L^*(\\varepsilon)$ the trend reverses towards fragmentation.", "url": "https://arxiv.org/abs/2610.21631", "type": "理论", "summary": "量子随机能量模型（QREM）是研究福克空间中有限能量密度下的离域-局域转变的范例模型。在计算基础上，其对角线能量是独立的高斯随机变量，与无序 XXZ 链等局部相互作用模型的相关能量相反。在这项工作中，我们构建了一个与基态相关的势能壳，通过其能量方差定义，并研究了它在福克空间超立方体上的连通性。随着横向场的变化，该能量选择子图在完全连接和碎片状态之间经历有限尺寸的几何交叉。此外，我们观察到从参与熵中提取的壳连通性和本征态的有限尺寸分形维数之间的相关性。对于 QREM，对角线能量的统计独立性允许将壳连通性分析为超立方体上的有效独立位点渗流问题，其交叉尺度在一跳近似内估计。\n\n在有限的能量密度下，该估计给出了交叉尺度对系统尺寸 $L$ 的非单调依赖性：增加 $L$ 最初有利于连通性，而超过能量依赖的尺度 $L^*(\\varepsilon)$ 则趋势逆转为碎片化。", "authors": [{"name": "Ishita Modak"}, {"name": "Vatsana Tiwari"}, {"name": "Soumya Bera"}], "featured_authors": [{"name": "Ishita Modak"}, {"name": "Vatsana Tiwari"}, {"name": "Soumya Bera"}], "author_count": 3}, {"id": "2610.21637", "category": "cond-mat", "title": "Directed impulsive molecular dynamics reveal energy-routing pathways of bond cleavage in TATB", "abstract": "Responses of energetic materials to external stimuli involve more than uniform thermalization. Understanding directional energy redistribution is essential for structural and ignition design. Here, we use TATB as an example to construct a vibrationally faithful machine-learning potential from only 4,630 configurations. To resolve the elusive nonequilibrium energy flow, we develop directed impulsive molecular dynamics, a statistically controlled protocol that repeatedly deposits equal kinetic energy along selected vibrational modes. By amplifying mode-specific responses while tracking the ensuing nonequilibrium evolution, this approach turns energy redistribution into a directly traceable routing process. We find that initial bond cleavage depends strongly on the initially excited mode, rather than being determined by bond-cleavage barriers alone. Specifically, modes that readily trigger reaction efficiently channel energy towards a bond cleavage coordinate, whereas modes that are less effective at inducing break divert energy into soft-like modes or trap it in modes from which energy flow is inefficient.", "url": "https://arxiv.org/abs/2610.21637", "type": "数值", "summary": "高能材料对外部刺激的反应不仅仅涉及均匀的热化。了解定向能量再分配对于结构和点火设计至关重要。在这里，我们以 TATB 为例，仅从 4,630 个配置中构建了一个振动忠实的机器学习潜力。为了解决难以捉摸的非平衡能量流，我们开发了定向脉冲分子动力学，这是一种统计控制协议，可沿选定的振动模式重复沉积相等的动能。通过放大特定模式的响应，同时跟踪随后的非平衡演化，这种方法将能量重新分配转变为直接可追踪的路由过程。我们发现初始键断裂很大程度上取决于初始激发模式，而不是仅由键断裂势垒决定。具体来说，容易触发反应的模式有效地将能量引导至键断裂坐标，而在诱导断裂方面效果较差的模式将能量转移到类似软的模式或将其捕获在能量流效率低下的模式中。", "authors": [{"name": "Guanchen Dong"}, {"name": "Xiaona Huang"}, {"name": "Yuxuan Chen"}, {"name": "Linghua Tan"}, {"name": "Guangcheng Yang"}, {"name": "Rui Su"}, {"name": "Lin Wang"}, {"name": "Pengfei Guan"}], "featured_authors": [{"name": "Guanchen Dong"}, {"name": "Xiaona Huang"}, {"name": "Yuxuan Chen"}, {"name": "Rui Su"}, {"name": "Lin Wang"}, {"name": "Pengfei Guan"}], "author_count": 8}, {"id": "2610.21650", "category": "cond-mat", "title": "Distribution Functions and Moments of Harmonically Trapped Inertial Run-and-Tumble Particles in a Shear-Thickening Medium", "abstract": "We study the dynamics of an athermal inertial active particle confined in a harmonic potential and moving through shear-thickening media in one dimension. The activity is modeled using a symmetric dichotomous noise of strength $\\Sigma$ and flipping rate $\\lambda$, which mimics a run-and-tumble particle. The shear-thickening response of the medium is incorporated through a velocity-dependent viscous force of the form $g(v) \\sim \\tan(v)$. Starting from the Fokker-Planck equations corresponding to the particle's dynamics, we numerically compute the time-dependent joint probability density function $f(x,v,t)$ using a finite-volume upwind scheme. Next, we numerically solve the particle's equations of motion to obtain the steady-state position $P_s(x)$ and velocity $W_s(v)$ distributions and compare them with the marginal distributions obtained from $f(x,v,t)$ at sufficiently large $t$. The two approaches show excellent agreement. Both $P_s(x)$ and $W_s(v)$ exhibit several intriguing transitions as $\\lambda$ is varied, and they eventually approach Gaussian-like profiles at sufficiently large $\\lambda$. Our study of the time-dependent position-velocity correlation, $\\langle xv \\rangle(t)$, shows that larger values of $\\lambda$ lead to faster relaxation to the steady state when all other parameters are held constant.", "url": "https://arxiv.org/abs/2610.21650", "type": "理论+数值", "summary": "我们研究了限制在谐波势中并在一维剪切增稠介质中移动的无热惯性活性粒子的动力学。该活动使用强度 $\\Sigma$ 和翻转速率 $\\lambda$ 的对称二分噪声进行建模，模拟奔跑和翻滚的粒子。介质的剪切增稠响应通过 $g(v) \\sim \\tan(v)$ 形式的速度相关粘性力来合并。从对应于粒子动力学的 Fokker-Planck 方程开始，我们使用有限体积迎风方案数值计算与时间相关的联合概率密度函数 $f(x,v,t)$。接下来，我们对粒子的运动方程进行数值求解，以获得稳态位置 $P_s(x)$ 和速度 $W_s(v)$ 分布，并将它们与在足够大的 $t$ 下从 $f(x,v,t)$ 获得的边缘分布进行比较。这两种方法表现出极好的一致性。当 $\\lambda$ 变化时，$P_s(x)$ 和 $W_s(v)$ 都表现出几个有趣的转变，并且它们最终在足够大的 $\\lambda$ 下接近高斯分布。\n\n我们对时间依赖性位置速度相关性 $\\langle xv \\rangle(t)$ 的研究表明，当所有其他参数保持不变时，较大的 $\\lambda$ 值会导致更快地松弛到稳定状态。", "authors": [{"name": "Subhanker Howlader"}, {"name": "Prasenjit Das"}], "featured_authors": [{"name": "Subhanker Howlader"}, {"name": "Prasenjit Das"}], "author_count": 2}, {"id": "2610.21652", "category": "cond-mat", "title": "Theory of Dispersion and Exchange Interactions Subjected to Surface Roughness in Application to Signal Transmission through a Nanoswitch", "abstract": "We present the theoretical description of a resistive nanoswitch designated for a change-over between the two operation modes by calculating the electri elastic, dispersion (van der Waals and Casimir), and also exchange repulsive forces in its configuration with an account of surface roughness. The dispersion forces are described by means of the Lifshitz theory and, at the shortest separations between the interacting bodies, where this theory is inapplicable, by the method of additive summation of the interatomic potentials corrected for the role of the effects of nonadditivity. The exchange repulsion is also found by a summation of the interatomic potentials and using the proximity force approximation. It is shown that the nanoswitch possesses the equilibrium closest separation between a cantilever tip and a ground plate calculated as a function of the actuation voltage and operates in a cyclic manner with no pull-in when this voltage is switched on and off. We have found the tunnel current between a cantilever tip and a plate and investigated distortions appearing in the signal transmitted through a nanoswitch. According to our results, the amplitude distortions arising in the low-frequency information signal can be made sufficiently small by increasing a difference between the amplitudes of the carrier and information signals. Possible applications of the obtained results are discussed.", "url": "https://arxiv.org/abs/2610.21652", "type": "理论", "summary": "我们通过计算电弹性、色散（范德华和卡西米尔）提出了电阻纳米开关的理论描述，该纳米开关设计用于在两种操作模式之间进行转换，并且还通过考虑表面粗糙度来交换其配置中的排斥力。色散力通过 Lifshitz 理论来描述，并且在相互作用物体之间的最短距离处（该理论不适用），通过原子间势的加性求和方法来描述，该方法针对非加和性效应的作用进行了校正。交换排斥也可以通过原子间势的求和并使用邻近力近似来找到。结果表明，纳米开关在悬臂尖端和接地板之间具有平衡最接近的距离，计算为驱动电压的函数，并且当该电压打开和关闭时以循环方式工作，没有吸合。我们发现了悬臂尖端和板之间的隧道电流，并研究了通过纳米开关传输的信号中出现的失真。\n\n根据我们的结果，通过增加载波和信息信号的幅度之间的差异，可以使低频信息信号中出现的幅度失真足够小。讨论了所得结果的可能应用。", "authors": [{"name": "Galina L. Klimchitskaya"}, {"name": "Alexander S. Korotkov"}, {"name": "Vera V. Loboda"}, {"name": "Vladimir M. Mostepanenko"}], "featured_authors": [{"name": "Galina L. Klimchitskaya"}, {"name": "Alexander S. Korotkov"}, {"name": "Vera V. Loboda"}, {"name": "Vladimir M. Mostepanenko"}], "author_count": 4}, {"id": "2610.21670", "category": "cond-mat", "title": "Defect Candidates for Single-Photon Emission in Monolayer GaS and GaSe", "abstract": "We investigate the spin-resolved electronic structure of native vacancies and substitutional defects in monolayer GaS and GaSe using an anisotropic screened-exchange functional developed for two-dimensional material systems. By combining an energy-based classification of defect-associated states with spatially resolved projections and partial charge densities, we examine how these defects modify the in-gap electronic structure and assess their relevance for defect-based single-photon emission. The results identify gallium vacancies, particularly in GaS, as candidates single-photon emitters.", "url": "https://arxiv.org/abs/2610.21670", "type": "理论+数值", "summary": "我们使用为二维材料系统开发的各向异性屏蔽交换函数研究单层 GaS 和 GaSe 中本征空位和替代缺陷的自旋分辨电子结构。通过将基于能量的缺陷相关态分类与空间分辨投影和部分电荷密度相结合，我们研究了这些缺陷如何改变带内电子结构，并评估它们与基于缺陷的单光子发射的相关性。结果确定镓空位（尤其是 GaS 中的镓空位）作为候选单光子发射器。", "authors": [{"name": "Michael Lorke"}], "featured_authors": [{"name": "Michael Lorke"}], "author_count": 1}, {"id": "2610.21683", "category": "cond-mat", "title": "Novel high-pressure silicon allotrope with quartz topology from first principles", "abstract": "A novel silicon allotrope, qtz Si, with quartz topology is proposed and investigated alongside four known allotropes (dia Si-I, lon Si-IV, bsn Si-II, and gsi Si-III) using first-principles density functional theory. qtz Si is found to exhibit the smallest atom-averaged volume (18.06 A3), highest density (2.582 g/cm3), highest bulk modulus (98 GPa), and highest maximum phonon frequency (16 THz) among the five, while showing the lowest shear modulus (37 GPa). All five allotropes are confirmed to satisfy the Born stability criteria and to display positive phonon frequencies throughout the Brillouin zone, i.e., they are mechanically and dynamically stable. Electronic structure calculations show that qtz Si is a semimetal with a vanishing gap, whereas dia Si and lon Si are semiconductors, and bsn and gsi allotropes are weakly metallic. Energy-volume equations of state place gsi and qtz 0.11-0.15 eV/atom above dia, bsn, and lon, consistent with their identification as high-pressure or metastable phases.", "url": "https://arxiv.org/abs/2610.21683", "type": "理论+数值", "summary": "提出了一种具有石英拓扑的新型硅同素异形体 qtz Si，并使用第一原理密度泛函理论与四种已知同素异形体（dia Si-I、lon Si-IV、bsn Si-II 和 gsi Si-III）一起进行了研究。 qtz Si 在五种材料中表现出最小的原子平均体积（18.06 A3）、最高的密度（2.582 g/cm3）、最高的体积模量（98 GPa）和最高的最大声子频率（16 THz），同时表现出最低的剪切模量（37 GPa）。所有五种同素异形体均被确认满足玻恩稳定性标准，并在整个布里渊区显示正声子频率，即它们在机械和动态上都是稳定的。电子结构计算表明qtz Si是能隙消失的半金属，dia Si和lon Si是半导体，bsn和gsi同素异形体是弱金属。状态的能量体积方程将 gsi 和 qtz 置于 dia、bsn 和 lon 上方 0.11-0.15 eV/atom，这与它们作为高压或亚稳态相的识别一致。", "authors": [{"name": "Samir F. Matar"}, {"name": "Vladimir L. Solozhenko"}], "featured_authors": [{"name": "Samir F. Matar"}, {"name": "Vladimir L. Solozhenko"}], "author_count": 2}, {"id": "2610.21733", "category": "cond-mat", "title": "Low magnon damping of a EuSe film down to millikelvin temperatures", "abstract": "The rapid development of quantum magnonics over the past decade has created a demand for magnetic materials that keep their magnon losses low at millikelvin temperatures and add functionality beyond that of the established iron garnets and ferromagnetic metals. The europium chalcogenides are natural candidates $-$ they are magnetic semiconductors whose moment of $7\\,\\mu_{\\mathrm{B}}$ per Eu$^{2+}$ ion stems from a half-filled $4f$ shell with zero orbital momentum, so that spin-orbit coupling and intrinsic damping are expected to be weak. Here we characterize an epitaxial film of the metamagnet EuSe on diamagnetic BaF$_2$ by magnetometry and broadband ferromagnetic resonance from 10 K down to 30 mK. EuSe combines a saturation magnetization of 1100 kA/m with antiferromagnetic, ferrimagnetic and ferromagnetic phases that are reached with fields below 0.25 T. In contrast to a Gilbert-damped ferromagnet, the linewidth of the field-aligned film decreases with increasing frequency and field, and below 750 mK it no longer depends on temperature. At 30 mK, 68 GHz and 1.8 T, it reaches 5.5 mT, close to the values of bulk single crystals, which corresponds to a magnon lifetime of 2 ns and to an upper bound of $1.1\\times10^{-3}$ for the Gilbert damping parameter. These properties make EuSe and the europium chalcogenides promising materials for hybrid quantum systems and quantum magnonics.", "url": "https://arxiv.org/abs/2610.21733", "type": "理论", "summary": "过去十年量子磁振子学的快速发展产生了对磁性材料的需求，这些材料在毫开尔文温度下保持较低的磁振子损耗，并增加了现有铁石榴石和铁磁金属之外的功能。铕硫属化物是天然的候选者$-$，它们是磁性半导体，每个Eu$^{2+}$离子的矩$7\\,\\mu_{\\mathrm{B}}$源自轨道动量为零的半填充$4f$壳，因此自旋轨道耦合和固有阻尼预计较弱。在这里，我们通过磁力测量和从 10 K 到 30 mK 的宽带铁磁共振来表征反磁性 BaF$_2$ 上的超磁体 EuSe 外延膜。 EuSe 将 1100 kA/m 的饱和磁化强度与反铁磁、亚铁磁和铁磁相相结合，磁场低于 0.25 T 时即可达到。与吉尔伯特阻尼铁磁体相比，场对准薄膜的线宽随着频率和磁场的增加而减小，而在 750 mK 以下，它不再依赖于温度。\n\n在 30 mK、68 GHz 和 1.8 T 下，它达到 5.5 mT，接近大块单晶的值，这对应于 2 ns 的磁振子寿命和吉尔伯特阻尼参数的上限 $1.1\\times10^{-3}$。这些特性使 EuSe 和铕硫属化物成为混合量子系统和量子磁子学的有前途的材料。", "authors": [{"name": "Rostyslav O. Serha"}, {"name": "Jan Hofer"}, {"name": "Khrystyna O. Levchenko"}, {"name": "Andreas Ney"}, {"name": "Sergej O. Demokritov"}, {"name": "Gunther Springholz"}, {"name": "Andrii V. Chumak"}], "featured_authors": [{"name": "Rostyslav O. Serha"}, {"name": "Jan Hofer"}, {"name": "Khrystyna O. Levchenko"}, {"name": "Sergej O. Demokritov"}, {"name": "Gunther Springholz"}, {"name": "Andrii V. Chumak"}], "author_count": 7}, {"id": "2610.21769", "category": "cond-mat", "title": "Spatiotemporally correlated activity regulation of random-organizing hyperuniform states", "abstract": "Center-of-mass (COM) conservation has been widely accepted as an important mechanism for generating nonequilibrium dynamic hyperuniform states with vanishing long-wavelength density fluctuations, but whether it is sufficient for hyperuniformity remains unclear. Here, using particle simulations and a linear fluctuating theory, we show that spatiotemporally correlated activity regulation can destroy hyperuniformity while preserving COM conservation. We construct a binary mixture in which the local density of independently evolving driver particles regulates the activity of regulated particles following COM-conserving biased random organization. This counterexample demonstrates that hyperuniformity depends on the spatial and temporal correlations of activity as well as the conservation laws governing particle displacements. Our findings clarify the limits of COM conservation as a route to hyperuniformity and highlight the importance of controlling activity correlations in the design of nonequilibrium multihyperuniform mixtures.", "url": "https://arxiv.org/abs/2610.21769", "type": "理论+数值", "summary": "质心（COM）守恒已被广泛认为是产生长波长密度波动消失的非平衡动态超均匀态的重要机制，但它是否足以实现超均匀性仍不清楚。在这里，利用粒子模拟和线性涨落理论，我们证明时空相关的活动调节可以破坏超均匀性，同时保持 COM 守恒。我们构建了一个二元混合物，其中独立演化的驱动粒子的局部密度按照 COM 保守的偏向随机组织来调节受调节粒子的活动。这个反例表明，超均匀性取决于活动的空间和时间相关性以及控制粒子位移的守恒定律。我们的研究结果阐明了 COM 守恒作为超均匀性途径的局限性，并强调了在非平衡多重超均匀混合物设计中控制活性相关性的重要性。", "authors": [{"name": "Yuhan Peng"}, {"name": "Yusheng Lei"}, {"name": "Ran Ni"}], "featured_authors": [{"name": "Yuhan Peng"}, {"name": "Yusheng Lei"}, {"name": "Ran Ni"}], "author_count": 3}, {"id": "2610.21770", "category": "cond-mat", "title": "Coexistence of Altermagnetic and Compensated Ferrimagnetic Motifs in a Noncollinear Multiferroic", "abstract": "Collinear compensated magnets with nonrelativistic spin splitting comprise altermagnets (ALMs), whose rotation- or mirror-related opposite-spin sublattices produce momentum-selective splitting that vanishes at $\\Gamma$, and compensated ferrimagnets (CFIMs), whose symmetry-inequivalent sublattices allow splitting throughout the Brillouin zone, including at $\\Gamma$. Here, we show that the coplanar noncollinear magnetic state of multiferroic boracite Ni$_3$B$_7$O$_{13}$Cl hosts both motifs on distinct Ni sublattices in real space. The electronic structure and spin texture exhibit coexisting $d$-wave-like and $s$-wave-like spin-polarization components associated with the ALM and CFIM motifs, respectively. Opposite ferroelectric states exhibit reversed band-resolved spin polarizations, indicating magnetoelectric coupling, and sign reversals of linear shift and circular injection currents.", "url": "https://arxiv.org/abs/2610.21770", "type": "理论+数值", "summary": "具有非相对论性自旋分裂的共线补偿磁体包括互变磁体（ALM）和补偿亚铁磁体（CFIM），其旋转或镜像相关的相反自旋子晶格产生在$\\Gamma$处消失的动量选择性分裂，以及补偿亚铁磁体（CFIM），其对称不等价子晶格允许在整个布里渊区（包括在$\\Gamma$处分裂）。在这里，我们证明了多铁硼砂石 Ni$_3$B$_7$O$_{13}$Cl 的共面非共线磁态在真实空间中不同的 Ni 亚晶格上承载着两个图案。电子结构和自旋织构表现出分别与 ALM 和 CFIM 图案相关的共存的 $d$ 波状和 $s$ 波状自旋极化分量。相反的铁电态表现出反向的带分辨自旋极化，表明磁电耦合以及线性位移和圆形注入电流的符号反转。", "authors": [{"name": "Vikrant Chaudhary"}, {"name": "Fu Li"}, {"name": "Hui Liu"}, {"name": "Mengli Hu"}, {"name": "Rajyavardhan Ray"}, {"name": "Chen Shen"}, {"name": "Jeroen van den Brink"}, {"name": "Hongbin Zhang"}, {"name": "Harish K. Singh"}], "featured_authors": [{"name": "Vikrant Chaudhary"}, {"name": "Fu Li"}, {"name": "Hui Liu"}, {"name": "Jeroen van den Brink"}, {"name": "Hongbin Zhang"}, {"name": "Harish K. Singh"}], "author_count": 9}, {"id": "2610.21777", "category": "cond-mat", "title": "Localization induced by Sinai disorder in mass-exchange models", "abstract": "We introduce a conservative continuous-mass-exchange model with quenched disorder in the splitting laws on the bonds of a finite segment. Although the dynamics is generically irreversible, its stationary mean mass profile remarkably turns out to be exactly solvable through an associated birth-and-death chain and has a Gibbs representation in terms of a simple random-walk potential. If $N$ is the number of bonds and $\\beta$ measures the strength of disorder, the parameter $\\beta\\sqrt N$ separates an asymptotically flat profile, a Brownian crossover, and a profile localized near the global minimum. We characterize the fluctuations of macroscopic masses and identify arcsine laws for the localization centre, the competition between left and right valleys, and the disorder-averaged mass measure. Furthermore, for the extremal masses, we discuss the emergent limiting random variable in terms of the literature linking finite RW paths seen from its minimum to infinite-horizon walks conditioned to stay positive. Finally, in proximity of the localization transition point $\\beta=0$, we show that the inverse participation ratio for the extremal masses give rises to a scaling with decay of order $k^{-3/2}$ consistent with the scaling limit of the latter conditioned walk. In the same limit, the inverse participation ratio shows a scaling form.", "url": "https://arxiv.org/abs/2610.21777", "type": "理论", "summary": "我们在有限段键的分裂定律中引入了具有淬灭无序的保守连续质量交换模型。尽管动力学通常是不可逆的，但其平稳平均质量分布显然可以通过相关的生死链完全求解，并且具有简单随机游走势的吉布斯表示。如果 $N$ 是键的数量，$\\beta$ 测量无序的强度，则参数 $\\beta\\sqrt N$ 分离渐近平坦轮廓、布朗交叉和局部于全局最小值附近的轮廓。我们描述了宏观质量的波动，并确定了定位中心的反正弦定律、左右谷之间的竞争以及无序平均质量测量。此外，对于极值质量，我们根据将有限 RW 路径从其最小到无限范围游走的文献联系起来讨论新兴的限制随机变量，条件是保持正值。\n\n最后，在定位转变点 $\\beta=0$ 附近，我们表明极值质量的逆参与比会导致 $k^{-3/2}$ 阶衰减的缩放，与后者条件行走的缩放限制一致。在同一极限下，逆参与比呈现缩放形式。", "authors": [{"name": "Michele Giusfredi"}, {"name": "Luca Avena"}, {"name": "Paolo Politi"}], "featured_authors": [{"name": "Michele Giusfredi"}, {"name": "Luca Avena"}, {"name": "Paolo Politi"}], "author_count": 3}, {"id": "2610.21816", "category": "cond-mat", "title": "Drying-Induced Size Segregation and Stratification in Colloidal Droplets across Binary, Ternary, and Polydisperse Systems", "abstract": "We study evaporation-induced size segregation and stratification in binary, ternary, and polydisperse mixtures of colloidal particles within a drying droplet using Brownian dynamics (BD) simulations. We show that drying-induced stratification can occur in all three types of mixtures, with larger particles preferentially accumulating in the droplet interior and smaller particles near the droplet surface. In binary mixtures, size segregation becomes more pronounced as the Peclet number and the size difference between particles increase, and as the relative volume fraction of large particles and the initial particle concentration decrease. In ternary mixtures, three distinct layers form when the Peclet number is sufficiently high and the intermediate particle size is suitably selected. Under the conditions studied, increasing the fraction of intermediate-sized particles can also enhance separation between the small and large particles. These results are in qualitative agreement with previous studies of drying planar films. Extending the analysis to polydisperse systems, we find that the average particle size decreases with increasing radial distance under stratifying conditions. Furthermore, higher Peclet numbers and particle-size distributions with more particles at both size extremes lead to steeper radial gradients in particle size. Additionally, we use multi-particle collision dynamics (MPCD) simulations to assess the role of hydrodynamic interactions. BD simulations predict stronger stratification than MPCD simulations, although stratification persists in the MPCD simulations. Our results thus demonstrate that droplet-confined drying offers a simple and versatile strategy for engineering radial composition and size gradients in colloidal assemblies, thereby offering new opportunities for the controlled fabrication of hierarchically structured supraparticles.", "url": "https://arxiv.org/abs/2610.21816", "type": "数值", "summary": "我们使用布朗动力学 (BD) 模拟研究干燥液滴内胶体颗粒的二元、三元和多分散混合物中蒸发引起的尺寸分离和分层。我们表明，干燥引起的分层可以发生在所有三种类型的混合物中，较大的颗粒优先积聚在液滴内部，较小的颗粒优先积聚在液滴表面附近。在二元混合物中，随着佩克莱特数和颗粒之间的尺寸差异的增加，以及随着大颗粒的相对体积分数和初始颗粒浓度的降低，尺寸偏析变得更加明显。在三元混合物中，当佩克莱特数足够高并且适当选择中间颗粒尺寸时，形成三个不同的层。在研究的条件下，增加中等尺寸颗粒的比例也可以增强小颗粒和大颗粒之间的分离。这些结果与之前干燥平面薄膜的研究定性一致。将分析扩展到多分散系统，我们发现在分层条件下，平均粒径随着径向距离的增加而减小。\n\n此外，较高的佩克莱特数和粒径分布以及两个极端尺寸下的更多颗粒会导致粒径的径向梯度更陡。此外，我们使用多粒子碰撞动力学 (MPCD) 模拟来评估流体动力学相互作用的作用。尽管分层在 MPCD 模拟中仍然存在，但 BD 模拟预测比 MPCD 模拟更强的分层。因此，我们的结果表明，液滴限制干燥为设计胶体组件中的径向组成和尺寸梯度提供了一种简单且通用的策略，从而为分层结构超粒子的受控制造提供了新的机会。", "authors": [{"name": "Zhoaxuan Liu"}, {"name": "Marjolein Dijkstra"}], "featured_authors": [{"name": "Zhoaxuan Liu"}, {"name": "Marjolein Dijkstra"}], "author_count": 2}, {"id": "2610.21835", "category": "cond-mat", "title": "From Action Principle to Stochastic Thermodynamics of Elastic and Viscous Active Matter", "abstract": "Motivated by the complex material properties of living matter, we derive a framework of stochastic thermo- and elastodynamics for active materials from the classical principle of least action and the Rayleighian formalism for external forces. Our approach couples the local barycentric collective coordinate and the streaming velocity as the canonical conjugate pair, which unifies various descriptions of elastic and viscous soft matter, including Helfrich theory for lipid membranes, linear and nonlinear elasticity of thin shells and deformable droplets, as well as hydrodynamics of active and passive fluids. The Lagrangian mechanics of collective field variables permits direct applications of the results and theorems from statistical mechanics to existing models of complex soft and living matter. To illustrate the potential applications of stochastic elastodynamics in biology, we derive and simulate a boundary-driven deformation model of an elastic cell nucleus in the presence of fluctuations.", "url": "https://arxiv.org/abs/2610.21835", "type": "理论", "summary": "受生命物质复杂材料特性的启发，我们从经典的最小作用原理和外力的瑞利形式主义中推导出活性材料的随机热力学和弹性动力学框架。我们的方法将局部重心集体坐标和流动速度耦合为规范共轭对，统一了弹性和粘性软物质的各种描述，包括脂质膜的赫尔弗里希理论、薄壳和可变形液滴的线性和非线性弹性，以及主动和被动流体的流体动力学。集体场变量的拉格朗日力学允许将统计力学的结果和定理直接应用于复杂软物质和生命物质的现有模型。为了说明随机弹性动力学在生物学中的潜在应用，我们推导并模拟了存在波动时弹性细胞核的边界驱动变形模型。", "authors": [{"name": "Valentina Barletta"}, {"name": "Michele Lupini"}, {"name": "Ian D. Estabrook"}, {"name": "Laeschkir Würthner"}, {"name": "Isabella R. Graf"}, {"name": "Caren Norden"}, {"name": "Lamberto Rondoni"}, {"name": "Anna Erzberger"}, {"name": "Roman Belousov"}], "featured_authors": [{"name": "Valentina Barletta"}, {"name": "Michele Lupini"}, {"name": "Ian D. Estabrook"}, {"name": "Lamberto Rondoni"}, {"name": "Anna Erzberger"}, {"name": "Roman Belousov"}], "author_count": 9}, {"id": "2610.21842", "category": "cond-mat", "title": "Synchronization induced by stochastic subsystem resetting in complex networks", "abstract": "We study synchronization in network-coupled oscillators subject to stochastic resetting of a subset of nodes. We show that resetting can induce collective coherence in oscillators that are never directly reset, through the interplay of network structure, frequency heterogeneity, and the organization of the reset subsystem. In the infinite-resetting-rate limit, the reset nodes become effectively pinned to a reference phase, and linearization near synchronization maps the dynamics of the remaining subsystem onto a grounded-Laplacian problem. This formulation yields an analytical relation between the synchronization level and the reset parameters, providing an estimate of the coupling strength required to achieve a prescribed degree of coherence. Beyond the linear regime, we develop a mean-field description in which the reset subsystem acts as an effective ordering field for the remaining oscillators. Numerical simulations across different network topologies confirm these predictions and show that synchronization is enhanced by increasing both the reset fraction and network connectivity. In heterogeneous networks, the placement of reset nodes can strongly influence the synchronization response. For frequency distributions with nonzero mean, resetting competes with the intrinsic collective rotation and can drive the system from a rotating synchronized state to a phase-locked state. These results establish subsystem resetting as a mechanism for inducing and controlling collective synchronization in complex networks.", "url": "https://arxiv.org/abs/2610.21842", "type": "理论+数值", "summary": "我们研究受节点子集随机重置影响的网络耦合振荡器的同步。我们表明，通过网络结构、频率异质性和复位子系统的组织的相互作用，复位可以在从未直接复位的振荡器中引起集体一致性。在无限重置速率限制下，重置节点有效地固定到参考相位，并且接近同步的线性化将剩余子系统的动态映射到接地拉普拉斯问题上。该公式产生同步水平和重置参数之间的分析关系，提供实现规定相干度所需的耦合强度的估计。除了线性状态之外，我们还开发了一种平均场描述，其中重置子系统充当其余振荡器的有效排序场。不同网络拓扑的数值模拟证实了这些预测，并表明通过增加重置分数和网络连接性可以增强同步。\n\n在异构网络中，重置节点的放置会强烈影响同步响应。对于具有非零均值的频率分布，重置与固有的集体旋转竞争，并且可以驱动系统从旋转同步状态到锁相状态。这些结果将子系统重置确立为复杂网络中诱导和控制集体同步的机制。", "authors": [{"name": "Kevin Paramero-Arias"}, {"name": "Alejandro P. Riascos"}], "featured_authors": [{"name": "Kevin Paramero-Arias"}, {"name": "Alejandro P. Riascos"}], "author_count": 2}, {"id": "2610.21856", "category": "cond-mat", "title": "Large in-plane optical anisotropy in epitaxial CrN(113) films", "abstract": "CrN, a transition-metal nitride crystallizing in the cubic rocksalt structure, exhibits a unique combination of mechanical robustness, semiconducting behavior, and thermoelectric functionality. To date, however, CrN has been synthesized primarily as polycrystalline material or as epitaxial films grown along high-symmetry orientations such as (001) and (111). Here, we prepare epitaxial CrN(113) films on AlN(11\\bar{2}2) templates by plasma-assisted molecular beam epitaxy. The low-symmetry interface and highly direction dependent lattice mismatch are expected to modify the physical properties of CrN relative to the bulk material. Indeed, variable-angle spectroscopic ellipsometry in the photon-energy range from 1.25 to 5 eV reveals a surprisingly strong polarization dependence of the optical response despite the nearly strain-free cubic crystal structure of the films. The pseudo-optical constants n and k differ by more than 10% for orthogonal in-plane polarizations throughout the investigated spectral range. We evaluate possible origins of this effect and conclude that it most likely arises from anisotropic surface morphology of CrN(113), which creates a metasurface acting as a subwavelength grating in the strongly absorbing regime.", "url": "https://arxiv.org/abs/2610.21856", "type": "理论+数值", "summary": "CrN 是一种在立方岩盐结构中结晶的过渡金属氮化物，表现出机械鲁棒性、半导体行为和热电功能的独特组合。然而，迄今为止，CrN 主要被合成为多晶材料或沿高对称取向（例如（001）和（111）生长的外延膜）。在这里，我们通过等离子体辅助分子束外延在 AlN(11\\bar{2}2) 模板上制备外延 CrN(113) 薄膜。低对称性界面和高度方向依赖的晶格失配有望改变 CrN 相对于块体材料的物理特性。事实上，尽管薄膜具有几乎无应变的立方晶体结构，但在 1.25 至 5 eV 光子能量范围内的可变角度光谱椭偏仪揭示了光学响应的​​惊人的强偏振依赖性。在整个研究的光谱范围内，正交面内偏振的赝光学常数 n 和 k 相差超过 10%。\n\n我们评估了这种效应的可能起源，并得出结论，它很可能源于 CrN(113) 的各向异性表面形态，它创建了一个在强吸收区域充当亚波长光栅的超表面。", "authors": [{"name": "Duc V. Dinh"}, {"name": "Frank Peiris"}, {"name": "Oliver Brandt"}], "featured_authors": [{"name": "Duc V. Dinh"}, {"name": "Frank Peiris"}, {"name": "Oliver Brandt"}], "author_count": 3}, {"id": "2610.21861", "category": "cond-mat", "title": "Diffusion-Induced Stabilization of Nonreciprocal Wealth Dynamics", "abstract": "We study the stability of equal wealth shares in a spatial model combining local sharing, global redistribution, and random nonreciprocal interactions. On a two-dimensional square lattice in the infinite-system limit, the effect of local sharing depends on whether the influence of one site on another tends to have the same or opposite sign as the reverse influence. When these influences are nonnegatively correlated, diffusion reduces the redistribution required for stability, but a positive rate remains necessary. Negative correlations instead allow stability without redistribution, with the largest stability margin at finite diffusion and a return toward marginal stability at strong diffusion. This nonmonotonicity reflects a competition between spatial smoothing and the weakening of the stabilizing contribution of reciprocal anticorrelations. Equal shares can even remain stable under wealth-concentrating transfers, but only within an intermediate range of diffusion strengths.", "url": "https://arxiv.org/abs/2610.21861", "type": "理论", "summary": "我们研究了结合局部共享、全球再分配和随机非互惠相互作用的空间模型中平等财富份额的稳定性。在无限系统极限的二维方晶格上，局部共享的效果取决于一个站点对另一个站点的影响是否倾向于与反向影响具有相同或相反的符号。当这些影响呈非负相关时，扩散会减少稳定所需的重新分配，但仍需要正比率。相反，负相关允许在不进行重新分配的情况下保持稳定，在有限扩散时具有最大的稳定裕度，在强扩散时会回归到边际稳定性。这种非单调性反映了空间平滑与互反相关稳定贡献减弱之间的竞争。在财富集中转移的情况下，平等份额甚至可以保持稳定，但只能在扩散强度的中间范围内。", "authors": [{"name": "Pierre Bousseyroux"}, {"name": "Gilles Zérah"}, {"name": "Michael Benzaquen"}], "featured_authors": [{"name": "Pierre Bousseyroux"}, {"name": "Gilles Zérah"}, {"name": "Michael Benzaquen"}], "author_count": 3}, {"id": "2610.21911", "category": "cond-mat", "title": "VoroTypes: automated enumeration of Voronoi cell topologies for structural identification of complex crystals in atomistic simulations", "abstract": "VoroTypes enumerates, for an arbitrary crystal structure, the complete family of Voronoi cell topologies that can arise under small generic perturbations of atomic positions, and exports it as a topological filter for the VoroTop framework. This extends per-atom structural identification in molecular dynamics simulations, previously limited to a handful of simple reference structures, to complex crystals such as Frank--Kasper and Laves phases, with per-sublattice resolution. The package takes a standard crystallographic description (a CIF or POSCAR file) as input, applies exact symmetry reduction and validity pruning to accelerate the enumeration, and produces filters that load directly into the standalone VoroTop program or into OVITO. A library of pre-computed filters covers over a thousand structures from the Materials Project.", "url": "https://arxiv.org/abs/2610.21911", "type": "理论+数值", "summary": "VoroTypes 针对任意晶体结构枚举了在原子位置的小通用扰动下可能出现的完整 Voronoi 单元拓扑家族，并将其导出为 VoroTop 框架的拓扑过滤器。这将分子动力学模拟中的每原子结构识别（以前仅限于少数简单的参考结构）扩展到具有每亚晶格分辨率的复杂晶体，例如 Frank-Kasper 和 Laves 相。该软件包采用标准晶体学描述（CIF 或 POSCAR 文件）作为输入，应用精确的对称性简化和有效性修剪来加速枚举，并生成直接加载到独立 VoroTop 程序或 OVITO 中的过滤器。预先计算的过滤器库涵盖了材料项目中的一千多个结构。", "authors": [{"name": "Emanuel A. Lazar"}, {"name": "Chris H. Rycroft"}], "featured_authors": [{"name": "Emanuel A. Lazar"}, {"name": "Chris H. Rycroft"}], "author_count": 2}, {"id": "2610.21917", "category": "cond-mat", "title": "Phase coexistence and nucleation of aging condensates", "abstract": "Biomolecular condensates form by phase separation and often age over time by transitioning from liquid-like droplets to solid-like states. To capture the fundamental behavior of aging condensates, we connect the Flory-Huggins model of phase separation with the trap model of aging dynamics. This combined model yields a rich phase diagram, including a regime of metastable coexisting liquids. Interestingly, the dense metastable liquid serves as an intermediate state in the nucleation pathway of the glass, which thus nucleates in two steps. Our results are generic, since they follow from a basic free-energy structure, providing a unified foundation for describing the thermodynamics and kinetics of aging biomolecular condensates.", "url": "https://arxiv.org/abs/2610.21917", "type": "理论+数值", "summary": "生物分子凝聚物是通过相分离形成的，并且通常会随着时间的推移从液态液滴转变为固态而老化。为了捕捉老化冷凝物的基本行为，我们将相分离的 Flory-Huggins 模型与老化动力学的陷阱模型联系起来。该组合模型产生丰富的相图，包括亚稳态共存液体的状态。有趣的是，致密的亚稳液体充当玻璃成核路径中的中间态，因此分两步成核。我们的结果是通用的，因为它们遵循基本的自由能结构，为描述老化生物分子凝聚体的热力学和动力学提供了统一的基础。", "authors": [{"name": "Yicheng Qiang"}, {"name": "Chengjie Luo"}, {"name": "David Zwicker"}], "featured_authors": [{"name": "Yicheng Qiang"}, {"name": "Chengjie Luo"}, {"name": "David Zwicker"}], "author_count": 3}, {"id": "2610.21949", "category": "cond-mat", "title": "Twist-controlled thermodynamic anomalies in bilayer q-state clock models", "abstract": "Twist has emerged as a geometric means of controlling collective behavior across a wide range of physical systems. Whether it can qualitatively reorganize the thermodynamic anomalies of discrete spin models, and how such changes relate to microscopic spin configurations, remains less explored. Here we demonstrate twist-controlled thermodynamic anomalies in ferromagnetic bilayer q-state clock models using Monte Carlo simulations. With sufficiently strong interlayer coupling, twisting changes the number and structure of specific-heat peaks: a single peak can split into two, or two peaks can merge into one, depending on the number of allowed spin orientations. These changes are nonmonotonic in twist angle and occur over narrower parameter ranges, or are absent, for the larger q values examined. The accompanying spin textures and vortex distributions suggest a physical picture in which moire modulation of the interlayer coupling reorganizes local spin alignment and topological defects. In a representative case, peak splitting coincides with nearly uniform spin regions arranged on the moire scale and a reduced vortex population. These findings identify twist as a control parameter for the collective thermal response of discrete spin systems and raise the possibility of modified phase-transition behavior, including the emergence or suppression of an intermediate Berezinskii-Kosterlitz-Thouless phase.", "url": "https://arxiv.org/abs/2610.21949", "type": "理论+数值", "summary": "Twist 已成为控制各种物理系统中集体行为的几何手段。它是否能够定性地重组离散自旋模型的热力学异常，以及这些变化与微观自旋构型的关系，仍然很少被探索。在这里，我们使用蒙特卡罗模拟演示了铁磁双层 q 态时钟
