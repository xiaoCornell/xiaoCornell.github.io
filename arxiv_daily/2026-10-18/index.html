: [{"name": "Chengxi Li"}, {"name": "Hao Zhu"}, {"name": "Tie-Fu Zhang"}, {"name": "Lin Zhuang"}, {"name": "Wanzi Sun"}, {"name": "Wuming Liu"}], "featured_authors": [{"name": "Chengxi Li"}, {"name": "Hao Zhu"}, {"name": "Tie-Fu Zhang"}, {"name": "Lin Zhuang"}, {"name": "Wanzi Sun"}, {"name": "Wuming Liu"}], "author_count": 6}, {"id": "2610.20694", "category": "quant-ph", "title": "Quantum Partial Information Decompositions, an Operational Order on Ensembles, and Direct Quantifications of Objective Information", "abstract": "The partial information decomposition (PID) framework is an extension of classical information theory that enables a systematic analysis of the structure of information in multipartite systems. We advance a simple extension of this framework enabling the construction of multipartite quantum PIDs (QPIDs); generalizing recent, exclusively bipartite, extensions. We construct two QPIDs of the Holevo quantity. First a naive QPID based on the classical minimum mutual information. Second a sophisticated QPID enabled by our development of an operational partial order on quantum ensembles in terms of ensemble (inter-)convertability. Finally, as a concrete example of how QPIDs can be applied, we investigate objectivity scenarios; using our Holevo QPIDs to directly quantify objective information in extended graph states. These findings ultimately establish a foundation upon which generic multipartite QPIDs can be systematically constructed, introduce an operational partial order on ensembles, advance QPIDs as interesting objects of study in their own right, and demonstrate their immediate applicability to problems in quantum information.", "url": "https://arxiv.org/abs/2610.20694", "type": "理论", "summary": "部分信息分解（PID）框架是经典信息论的扩展，可以对多部分系统中的信息结构进行系统分析。我们对该框架进行了简单的扩展，从而能够构建多部分量子 PID（QPID）；概括最近的、完全双方的扩展。我们构建 Holevo 数量的两个 QPID。首先是基于经典最小互信息的朴素 QPID。其次，我们在系综（相互）可转换性方面开发了量子系综上的操作偏序，从而实现了复杂的 QPID。最后，作为如何应用 QPID 的具体示例，我们研究了客观场景；使用我们的 Holevo QPID 直接量化扩展图状态中的客观信息。这些发现最终奠定了一个基础，在此基础上可以系统地构建通用多部分 QPID，引入集合上的操作偏序，将 QPID 本身作为有趣的研究对象，并证明它们对量子信息问题的直接适用性。", "authors": [{"name": "Alexander Nico-Katz"}], "featured_authors": [{"name": "Alexander Nico-Katz"}], "author_count": 1}, {"id": "2610.20737", "category": "quant-ph", "title": "A constructive solution to the $n$-representability problem", "abstract": "We present a solution to the fermionic quantum marginal problem by constructing the complete family of two-body witnesses at each level of a weighted sum-of-squares hierarchy. Our construction combines positive-semidefinite Gram matrices with explicit linear nullspace constraints that exactly cancel all higher-body contributions, replacing the search for individual representability conditions with a systematic algebraic procedure. Beyond the completeness proof, we demonstrate the construction numerically by solving the associated semidefinite program and recovering the exact ground-state energy of a Richardson Hamiltonian in the three-fermion sector. We further prove that higher-degree particle-number multipliers are unnecessary when the full sum-of-squares generating algebra is used. These results establish a unified constructive framework for verifying the physicality of a candidate two-particle reduced density matrix through a complete characterization of all two-body witnesses.", "url": "https://arxiv.org/abs/2610.20737", "type": "理论+数值", "summary": "我们通过在加权平方和层次结构的每个级别构建完整的二体见证族来提出费米子量子边际问题的解决方案。我们的构造将正半定格拉姆矩阵与显式线性零空间约束相结合，精确地消除了所有高体贡献，用系统的代数过程取代了对个体可表示性条件的搜索。除了完整性证明之外，我们还通过求解相关的半定程序并恢复三费米子扇区中理查森哈密顿量的精确基态能量来以数值方式演示该构造。我们进一步证明，当使用完全平方和生成代数时，不需要更高阶的粒子数乘法器。这些结果建立了一个统一的建设性框架，用于通过所有二体见证人的完整表征来验证候选二粒子降低密度矩阵的物理性。", "authors": [{"name": "Nicholas C. Rubin"}, {"name": "A. Eugene DePrince III"}], "featured_authors": [{"name": "Nicholas C. Rubin"}, {"name": "A. Eugene DePrince III"}], "author_count": 2}, {"id": "2610.20775", "category": "quant-ph", "title": "The Lovász number is not alone: a continuum of Rényi points in the entanglement-assisted spectrum of graphs", "abstract": "Li and Zuiddam's entanglement-assisted asymptotic spectrum of graphs consists of the normalized graph parameters that are additive under disjoint unions, multiplicative under strong products and monotone under entanglement-assisted cohomomorphisms; the entanglement-assisted Shannon capacity is their pointwise minimum. To our knowledge, the Lovász number $\\vartheta$ was its only known element. We find a continuum of others. Three quantities of Duan and Winter, $\\log_2\\vartheta$, the minimal Holevo capacity $C_{\\min}$ and the logarithm of the no-signalling simulation cost $\\Sigma$, are the smallest information radii of classical-quantum channels compatible with a graph, measured with Petz-Rényi divergences of orders $0$, $1$ and $2$. At order zero this is due to Schrijver (as credited by Dalai) and to Duan and Winter; at order one it is the min-max formula for the Holevo capacity. Interpolating in the order gives a family $\\vartheta_\\alpha$, $0\\le\\alpha\\le2$, and we prove that every member lies in the spectrum. The main step, multiplicativity under strong products for channels that need not factor, follows from an exact nesting identity for compressions. Sandwiched Rényi radii of order $\\beta\\in[1/2,\\infty]$ give the same family, at $\\alpha=2-1/\\beta$. On the five-cycle the family takes every value in $[\\sqrt5,5/2]$. A Hilbert-Schmidt inequality for the pentagon gives $C_{\\min}(C_5)=\\log_2(5/2)$, proving a conjecture of Duan and Winter. We also settle the two open links of their inequality chain: the graph-level no-signalling simulation rate always equals its single-letter value $\\log_2\\Sigma(G)$, and a 32-vertex graph from the Mermin-Peres magic square has $C_{\\min}<\\log_2\\Sigma$, certified in exact rational arithmetic. Finally, $\\Sigma$ never exceeds the projective rank of the complement; a rank inequality for the same square makes this strict on a 1440-vertex graph.", "url": "https://arxiv.org/abs/2610.20775", "type": "理论+数值", "summary": "Li 和 Zuiddam 的纠缠辅助渐近图谱由归一化图参数组成，这些参数在不相交并集下是加法，在强积下是乘法，在纠缠辅助上同态下是单调的；纠缠辅助香农容量是它们的逐点最小值。据我们所知，洛瓦兹数 $\\vartheta$ 是其唯一已知的元素。我们发现了其他人的连续体。 Duan 和 Winter 的三个量 $\\log_2\\vartheta$、最小 Holevo 容量 $C_{\\min}$ 和无信令模拟成本的对数 $\\Sigma$ 是与图兼容的经典量子通道的最小信息半径，用 $0$、$1$ 和 $2$ 阶的 Petz-Rényi 散度来测量。在零阶中，这是由于 Schrijver（如达赖所记）以及 Duan 和 Winter 造成的；第一阶是 Holevo 容量的最小-最大公式。按顺序插值得到一个族 $\\vartheta_\\alpha$, $0\\le\\alpha\\le2$，我们证明每个成员都位于谱中。主要步骤，即不需要因子的通道的强乘积下的乘法性，源自压缩的精确嵌套标识。\n\n$\\beta\\in[1/2,\\infty]$ 阶的夹层 Rényi 半径在 $\\alpha=2-1/\\beta$ 处给出相同的族。在五个周期中，该系列采用 $[\\sqrt5,5/2]$ 中的每个值。五边形的希尔伯特-施密特不等式给出 $C_{\\min}(C_5)=\\log_2(5/2)$，证明了 Duan 和 Winter 的猜想。我们还解决了其不等式链中的两个开放环节：图级无信号模拟率始终等于其单字母值 $\\log_2\\Sigma(G)$，而来自 Mermin-Peres 魔方的 32 顶点图具有 $C_{\\min}<\\log_2\\Sigma$，经过精确有理算术验证。最后，$\\Sigma$ 永远不会超过补集的投影秩；同一个正方形的等级不等式使得这一点在 1440 个顶点的图上变得严格。", "authors": [{"name": "Nidhal Mghirbi"}, {"name": "Seth Douglas"}], "featured_authors": [{"name": "Nidhal Mghirbi"}, {"name": "Seth Douglas"}], "author_count": 2}, {"id": "2610.20790", "category": "quant-ph", "title": "Infinite magic and the emergence of the continuum", "abstract": "Which features of a quantum state are needed for a relativistic quantum field theory to emerge from a lattice system? We address this question by establishing a quantitative relationship between the type classification of hyperfinite von Neumann algebras and the quantum-information-theoretic resource of nonstabilizerness, also called magic. Our results establish two complementary parts of this relationship. First, we prove that any stabilizer system on a lattice defines a canonical GNS Hilbert space in which local von Neumann algebras do not contain type III factors in their central decomposition. As an explicit example, we prove that for stabilizer systems with short-range order, the local algebras are isomorphic to tensor products of hyperfinite factors of type I or type II. This demonstrates that the absence of magic is accompanied by the absence of type III factors in the local algebras, therefore prohibiting the appearance of a quantum field theory. Second, for the hyperfinite factors of Araki, Woods and Powers, we prove a quantitative equivalence: The limiting factor is of type III if and only if the locally optimized min-relative entropy of magic diverges. This divergence is necessary to generate the continuous spectrum associated to a type III factor. Thus, in this setting, the emergence of a type III factor requires not merely the presence of magic, but an infinite amount of it. These results provide a rigorous setting supporting the proposal that infinite magic is a necessary structural ingredient for the emergence of a relativistic continuum from lattice systems.", "url": "https://arxiv.org/abs/2610.20790", "type": "理论+数值", "summary": "相对论量子场论从晶格系统中出现需要量子态的哪些特征？我们通过建立超有限冯诺依曼代数的类型分类与非稳定器的量子信息理论资源（也称为魔法）之间的定量关系来解决这个问题。我们的结果建立了这种关系的两个互补部分。首先，我们证明晶格上的任何稳定系统都定义了一个规范的 GNS Hilbert 空间，其中局部冯诺依曼代数在其中心分解中不包含 III 型因子。作为一个明确的例子，我们证明对于短程有序的稳定系统，局部代数与 I 型或 II 型超有限因子的张量积同构。这表明，魔法的缺失伴随着局域代数中第三类因子的缺失，因此阻碍了量子场论的出现。其次，对于荒木经惟、伍兹和鲍尔斯的超有限因子，我们证明了一个定量等价性：当且仅当局部优化的魔法最小相对熵发散时，限制因子是类型 III。\n\n这种发散对于生成与 III 型因子相关的连续谱是必要的。因此，在这种情况下，第三类因素的出现不仅需要魔法的存在，而且需要无限量的魔法。这些结果提供了严格的背景，支持这样的观点：无限魔力是晶格系统中出现相对论连续体的必要结构成分。", "authors": [{"name": "Leo Shaposhnik"}, {"name": "Lorenzo Leone"}, {"name": "Lennart Bittel"}, {"name": "Dimitris Saraidaris"}, {"name": "Alexander Jahn"}, {"name": "Jens Eisert"}], "featured_authors": [{"name": "Leo Shaposhnik"}, {"name": "Lorenzo Leone"}, {"name": "Lennart Bittel"}, {"name": "Dimitris Saraidaris"}, {"name": "Alexander Jahn"}, {"name": "Jens Eisert"}], "author_count": 6}, {"id": "2610.20846", "category": "quant-ph", "title": "Entanglement of superpositions in zero-energy subspace: insights from stabilizer theory", "abstract": "Exact zero-energy eigenstates built from entangled dimers have recently been found in a large class of spin Hamiltonians. While the individual states have a simple structure, their superpositions can have very different entanglement properties. In this work, we study these superpositions for geometrically local spin-1/2 chains with periodic boundary conditions. Using stabilizer theory and polynomial methods, we characterize the subspace they span and find the minimum entanglement entropy between two halves of the chain. For Hamiltonians generated by a single local Pauli interaction with noncommuting translates, this minimum obeys a volume law at fixed interaction range. The structure of the least-entangled superpositions also suggests further exact eigenstate constructions, including zero-energy states separable between the two halves of the chain and states at nonzero energies.", "url": "https://arxiv.org/abs/2610.20846", "type": "理论", "summary": "最近在一大类自旋哈密顿量中发现了由纠缠二聚体构建的精确零能量本征态。虽然各个状态具有简单的结构，但它们的叠加可以具有非常不同的纠缠特性。在这项工作中，我们研究了具有周期性边界条件的几何局部自旋 1/2 链的这些叠加。使用稳定器理论和多项式方法，我们描述了它们跨越的子空间，并找到了链的两半之间的最小纠缠熵。对于通过与非交换平移的单个局部泡利相互作用生成的哈密顿量，该最小值在固定相互作用范围内服从体积定律。最不纠缠叠加态的结构还提出了更精确的本征态结构，包括链的两半之间可分离的零能态和非零能量的态。", "authors": [{"name": "Konstantin Antipin"}, {"name": "Richik Sengupta"}], "featured_authors": [{"name": "Konstantin Antipin"}, {"name": "Richik Sengupta"}], "author_count": 2}, {"id": "2610.20987", "category": "quant-ph", "title": "Practical wavelength selection for quantum-augmented networks over shared optical fiber", "abstract": "In a quantum augmented network, sharing optical fiber with classical traffic requires quantum wavelength selection to balance logical fidelity, block acceptance, and classical data reception. Here we develop a wavelength-selection framework for an error-corrected three-stage quantum communication protocol. Under a thermal-background model with independent errors, an ideal one-photon receiver, and ideal recovery, we derive an accepted qubit channel and a key-independent lower bound on logical entanglement fidelity. Combining this bound with block acceptance gives an entanglement-fidelity yield bound, which we maximize over evaluated wavelengths subject to fidelity and classical link-budget requirements. For the Steane [[7,1,3]] code at 5 km per traversal and -10 dBm per classical channel, the largest fidelity certificate occurs near 1537 nm, whereas the largest yield bound occurs near 1551 nm. Along the 1.25 Gb/s classical link budget with 0.2% base error, the optimized yield bound falls below 10^-6 near 10 km per traversal, while fidelity remains certified at 0.99 or higher at longer spans. These results distinguish fidelity and yield constraints and identify certified operating regions for quantum-augmented networks sharing optical fiber.", "url": "https://arxiv.org/abs/2610.20987", "type": "理论+数值", "summary": "在量子增强网络中，与经典流量共享光纤需要选择量子波长来平衡逻辑保真度、块接受和经典数据接收。在这里，我们为纠错三级量子通信协议开发了一个波长选择框架。在具有独立误差、理想单光子接收器和理想恢复的热背景模型下，我们推导出可接受的量子位通道和与密钥无关的逻辑纠缠保真度下界。将此界限与块接受相结合给出了纠缠保真度产量界限，我们根据保真度和经典链路预算要求在评估的波长上最大化该界限。对于每次遍历 5 km 和每个经典通道 -10 dBm 的 Steane [[7,1,3]] 码，最大保真度证书出现在 1537 nm 附近，而最大产量界限出现在 1551 nm 附近。沿着具有 0.2% 基本误差的 1.25 Gb/s 经典链路预算，每次遍历接近 10 公里时，优化的良率界限降至 10^-6 以下，而在较长跨度上，保真度仍保持在 0.99 或更高。\n\n这些结果区分了保真度和产量限制，并确定了共享光纤的量子增强网络的经过认证的操作区域。", "authors": [{"name": "Nitin Jha"}, {"name": "Prateek Paudel"}, {"name": "Abhishek Parakh"}], "featured_authors": [{"name": "Nitin Jha"}, {"name": "Prateek Paudel"}, {"name": "Abhishek Parakh"}], "author_count": 3}, {"id": "2610.20988", "category": "quant-ph", "title": "Classification of quantum states through conserved operators", "abstract": "Determining whether quantum states can be interconverted by a prescribed set of transformations is a fundamental problem in quantum information. Here we develop a general classification framework based on conserved operators (COs), i.e., not necessarily hermitian matrices having the state of interest as an eigenstate. We first show that COs belonging to the algebra generating the allowed transformations can be obtained from the kernel of a quantum covariance matrix. Their number determines the dimension of the accessible orbit, while their algebraic structure and eigenvalues provide further constraints on state convertibility. We establish general bounds on the number of COs and prove that highest-weight states, like separable states in the case of $n$ qudits, attain the maximum. We also show how these operators generate parent Hamiltonians having the characterized state as an exact ground state. We then also consider positive zero-eigenvalue COs, which encode forbidden directions of reduced density matrices and incorporate rank-based constraints into the same framework. Applying this approach to multiqubit SLOCC, we obtain complementary classifications from algebraic and rank COs. While for $n\\leq 3$ qubits both lead to the usual classes, for $n=4$ qubits they distinguish 17 and 20 types separately, and 29 when combined. The combined classification yields 287 fixed types and $4$ continuous families for $n=5$ qubits, and 4926 fixed types and 147 continuous families for $n=6$ qubits, providing, to our knowledge, the most refined exhaustive classification of SLOCC-convertibility classes based on such data.", "url": "https://arxiv.org/abs/2610.20988", "type": "理论", "summary": "确定量子态是否可以通过一组规定的变换相互转换是量子信息中的一个基本问题。在这里，我们开发了一个基于保守算子（CO）的通用分类框架，即不一定具有作为本征态的感兴趣状态的埃尔米特矩阵。我们首先证明，属于生成允许变换的代数的 CO 可以从量子协方差矩阵的核中获得。它们的数量决定了可到达轨道的尺寸，而它们的代数结构和特征值则对状态可转换性提供了进一步的限制。我们建立了 CO 数量的一般界限，并证明最高权重状态（如 $n$ qudits 情况下的可分离状态）达到最大值。我们还展示了这些算子如何生成具有特征状态作为精确基态的父哈密顿量。然后，我们还考虑正零特征值 CO，它对约简密度矩阵的禁止方向进行编码，并将基于排序的约束合并到同一框架中。将此方法应用于多量子位 SLOCC，我们从代数和秩 CO 中获得了补充分类。\n\n虽然对于 $n\\leq 3$ 量子位都导致通常的类别，但对于 $n=4$ 量子位，它们分别区分 17 和 20 种类型，组合时区分 29 种类型。组合分类为 $n=5$ 量子位产生 287 个固定类型和 $4$ 连续系列，为 $n=6$ 量子位产生 4926 个固定类型和 147 个连续系列，据我们所知，提供了基于此类数据的 SLOCC 可转换类别的最精细的详尽分类。", "authors": [{"name": "Federico Petrovich"}, {"name": "R. Rossignoli"}, {"name": "M. Cerezo"}], "featured_authors": [{"name": "Federico Petrovich"}, {"name": "R. Rossignoli"}, {"name": "M. Cerezo"}], "author_count": 3}, {"id": "2610.21000", "category": "quant-ph", "title": "monoprop: Scaling Pauli and Majorana propagation via Anticommutation Indices", "abstract": "We introduce monoprop, an open-source, massively parallel operator-propagation framework for fermion and qubit bases. For $N$ qubits or modes, existing codes represent each of the $K$ tracked operator terms (Pauli strings or products of Majorana operators) as a $2N$-bit string, testing each for anticommutation with the gate at $O(KN)$ cost per gate. Here, we introduce the anticommutation index which rapidly looks up the terms anticommuting with a gate. A local gate changes only the terms that touch its sites, and when terms are truncated to act on few sites, only a fraction $\\sim1/N$ touch any given qubit or mode, and we use this to prove the time per gate scales as $O(K/N)$. This counterintuitive result tells us that for a fixed number of terms, increasing the number of sites can make things faster. We demonstrate this numerically, and show monoprop scales almost ideally to 8192 cores, tracking $9.5\\times10^{10}$ terms. Beyond propagation, we present memory-efficient surrogate graphs, which record one propagation and replay it at new angles, for fast energy re-estimation and parameter gradients, and an efficient method for finding energy-minimising gates and optimal angles for simulating adaptive quantum-chemistry circuits.", "url": "https://arxiv.org/abs/2610.21000", "type": "理论+数值", "summary": "我们引入了 monoprop，这是一种用于费米子和量子位基础的开源大规模并行算子传播框架。对于 $N$ 量子位或模式，现有代码将每个 $K$ 跟踪运算符项（保利字符串或马约拉纳运算符的乘积）表示为 $2N$ 位字符串，以每门 $O(KN)$ 成本测试每个门的反交换性。在这里，我们引入反交换索引，它可以通过门快速查找术语反交换。局域门仅更改触及其位点的项，并且当项被截断以作用于少数位点时，只有一小部分 $\\sim1/N$ 触及任何给定的量子位或模式，我们用它来证明每个门的时间尺度为 $O(K/N)$。这个违反直觉的结果告诉我们，对于固定数量的术语，增加站点数量可以使事情变得更快。我们以数字方式证明了这一点，并显示单螺旋桨几乎理想地扩展到 8192 个核心，跟踪 $9.5\\times10^{10}$ 项。\n\n除了传播之外，我们还提出了内存高效的替代图，它记录一次传播并以新的角度重放它，以实现快速能量重新估计和参数梯度，以及一种寻找能量最小化门和模拟自适应量子化学电路的最佳角度的有效方法。", "authors": [{"name": "Aaron Miller"}], "featured_authors": [{"name": "Aaron Miller"}], "author_count": 1}, {"id": "2610.21044", "category": "quant-ph", "title": "Singular wave functions and quantum collapse in inverse-power potentials", "abstract": "Quantum collapse (QC) occurs under the action of the inverse-power potential U(r)=-U_{0}/(2r^{n}) in the framework of the Schroedinger equation. The corresponding stationary wave functions feature an infinite number of spatial oscillations at $r\\rightarrow 0$. The ground state (GS) is missing in the presence of the QC, but the available bound states at finite energies may be physically relevant, as they are normalizable. This work aims to produce singular stationary wave functions. The analytical findings represent an asymptotic form of the stationary wave functions at $r\\rightarrow 0$, which fill a continuous spectrum, and some exact solutions for the wave functions, obtained under appropriate conditions. As a regularized version, we also consider the potential truncated at a finite difference from the center. The regularized wave functions feature a finite number of spatial oscillations, the missing GS reappears, and the spectrum of the bound states is discrete.", "url": "https://arxiv.org/abs/2610.21044", "type": "理论", "summary": "量子塌缩（QC）是在薛定谔方程框架中的反幂势U(r)=-U_{0}/(2r^{n})的作用下发生的。相应的驻波函数在 $r\\rightarrow 0$ 处具有无限数量的空间振荡。在存在 QC 的情况下，基态 (GS) 缺失，但有限能量下的可用束缚态可能是物理相关的，因为它们是可归一化的。这项工作的目的是产生奇异的平稳波函数。分析结果代表了 $r\\rightarrow 0$ 处平稳波函数的渐近形式，它填充了连续谱，以及在适当条件下获得的波函数的一些精确解。作为正则化版本，我们还考虑在距中心有限差处截断的势能。正则化波函数具有有限数量的空间振荡，丢失的 GS 重新出现，并且束缚态的谱是离散的。", "authors": [{"name": "Hidetsugu Sakaguchi"}, {"name": "Boris Malomed"}], "featured_authors": [{"name": "Hidetsugu Sakaguchi"}, {"name": "Boris Malomed"}], "author_count": 2}, {"id": "2610.21071", "category": "quant-ph", "title": "Multiplicative Semidefinite Programming Upper Bounds on Quantum No-Signalling-Assisted Zero-Error Capacity", "abstract": "We study zero-error communication and exact simulation of quantum channels assisted by quantum no-signalling correlations. For a channel with Kraus operator space $K$, we introduce a semidefinite programming parameter $\\Gamma(K)$ that is exactly multiplicative under tensor products and upper-bounds $\\Theta_{\\rm NS}(K)$, where $\\log_2\\Theta_{\\rm NS}(K)=C_{0,\\rm NS}(K)$ and $C_{0,\\rm NS}(K)$ denotes the asymptotic quantum no-signalling-assisted zero-error capacity. Among known upper bounds on $\\Theta_{\\rm NS}$ given by semidefinite programs, $\\Gamma$ is the tightest. We also prove that the previously introduced simulation lower bound $\\Sigma^{-}(K)$ is exactly multiplicative and satisfies $\\Theta_{\\rm NS}(K)\\leq\\Gamma(K)\\leq\\Sigma^{-}(K)\\leq\\Gamma(K)^2$. Using this multiplicativity, we show that neither $S_{0,\\rm NS}(K)=\\log_2\\Sigma^{-}(K)$ nor its regularized extension $S_{0,\\rm NS}(K)=\\lim\\nolimits_{n\\to\\infty}n^{-1}\\log_2\\Sigma^{-}(K^{\\otimes n})$ holds in general. This answers an open question about the asymptotic simulation cost $S_{0,\\rm NS}(K)$. For classical-quantum channels, we obtain sharp bounds. If $r$ is the effective output dimension, then $\\Theta_{\\rm NS}\\leq\\Gamma\\leq(1+r^{1/2})\\Theta_{\\rm NS}/2$ and $\\Gamma\\leq\\Sigma^{-}\\leq(1+r^{1/2})\\Gamma/2$. If $k$ is the minimum rank of the output support projections, then $\\Sigma^{-}/\\Theta_{\\rm NS}\\leq[(1+r^{1/2})/(1+k^{1/2})]^2$, and this bound is sharp for every $1\\leq k\\leq r$. Thus, we obtain the sharp bound $S_{0,\\rm NS}-C_{0,\\rm NS}\\leq2\\log_2[(1+r^{1/2})/(1+k^{1/2})]$.", "url": "https://arxiv.org/abs/2610.21071", "type": "理论+数值", "summary": "我们研究量子无信号相关性辅助下的零错误通信和量子通道的精确模拟。对于具有 Kraus 算子空间 $K$ 的通道，我们引入一个半定编程参数 $\\Gamma(K)$，它在张量积和上限 $\\Theta_{\\rm NS}(K)$ 下精确乘法，其中 $\\log_2\\Theta_{\\rm NS}(K)=C_{0,\\rm NS}(K)$ 和 $C_{0,\\rm NS}(K)$ 表示渐近量子无信令辅助的零错误能力。在由半定规划给出的 $\\Theta_{\\rm NS}$ 的已知上限中，$\\Gamma$ 是最紧的。我们还证明了之前引入的模拟下界 $\\Sigma^{-}(K)$ 是完全乘法的并且满足 $\\Theta_{\\rm NS}(K)\\leq\\Gamma(K)\\leq\\Sigma^{-}(K)\\leq\\Gamma(K)^2$。利用这个乘法性，我们证明 $S_{0,\\rm NS}(K)=\\log_2\\Sigma^{-}(K)$ 及其正则化扩展 $S_{0,\\rm NS}(K)=\\lim\\nolimits_{n\\to\\infty}n^{-1}\\log_2\\Sigma^{-}(K^{\\otimes n})$ 一般都不成立。这回答了关于渐近模拟成本 $S_{0,\\rm NS}(K)$ 的悬而未决的问题。对于经典量子通道，我们获得了尖锐的边界。\n\n如果$r$是有效输出维度，则$\\Theta_{\\rm NS}\\leq\\Gamma\\leq(1+r^{1/2})\\Theta_{\\rm NS}/2$和$\\Gamma\\leq\\Sigma^{-}\\leq(1+r^{1/2})\\Gamma/2$。如果 $k$ 是输出支持投影的最小等级，则 $\\Sigma^{-}/\\Theta_{\\rm NS}\\leq[(1+r^{1/2})/(1+k^{1/2})]^2$，并且这个界限对于每个 $1\\leq k\\leq r$ 都是尖锐的。因此，我们得到锐界$S_{0,\\rm NS}-C_{0,\\rm NS}\\leq2\\log_2[(1+r^{1/2})/(1+k^{1/2})]$。", "authors": [{"name": "Xin Li"}, {"name": "Yinan Li"}], "featured_authors": [{"name": "Xin Li"}, {"name": "Yinan Li"}], "author_count": 2}, {"id": "2610.21410", "category": "quant-ph", "title": "Parallel Repetition for Entangled Games via Conditional Relative Entropy", "abstract": "We give a proof of the cubic parallel-repetition bound for finite two-player entangled games using quantum conditional relative entropy. For a game with entangled value $1-\\varepsilon<1$ and answer alphabets $\\mathcal A,\\mathcal B$, its $n$-fold repeated value is at most \\[ \\exp[-\\Omega(\\varepsilon^3n/L)],\\qquad L:=\\max\\{1,\\log(|\\mathcal A||\\mathcal B|)\\}, \\] for every $n\\ge1$. This recovers Song's cubic rate. We also prove a threshold bound: the probability of winning a fraction at least $1-\\varepsilon+\\delta$ is at most $\\exp[-\\Omega(\\delta^5n/(\\varepsilon^2L))]$ for $0<\\delta\\le\\varepsilon$. Our information charge is the decrease in relative entropy when a question reference is discarded. Our comparison states preserve the original conditional question law. A chain rule bounds the coordinate charges using the cost of conditioning on checked wins and retaining checked answers. Our main lemma converts small charges into nearby pure-state descriptions and local corrections, each depending only on one player's question. Together with Song's sampler, these enable approximate local preparation of the conditioned workspace.", "url": "https://arxiv.org/abs/2610.21410", "type": "理论", "summary": "我们使用量子条件相对熵给出了有限两人纠缠游戏的三次并行重复界限的证明。对于纠缠值 $1-\\varepsilon<1$ 和答案字母 $\\mathcal A,\\mathcal B$ 的游戏，对于每个 $n\\ge1$，其 $n$ 次重复值最多为 \\[ \\exp[-\\Omega(\\varepsilon^3n/L)],\\qquad L:=\\max\\{1,\\log(|\\mathcal A||\\mathcal B|)\\}, \\]。这恢复了宋的立方率。我们还证明了一个阈值界限：对于 $0<\\delta\\le\\varepsilon$，赢得至少 $1-\\varepsilon+\\delta$ 的分数的概率至多为 $\\exp[-\\Omega(\\delta^5n/(\\varepsilon^2L))]$。我们的信息费用是当问题参考被丢弃时相对熵的减少。我们的比较状态保留了原始的条件问题法。链式法则使用检查获胜和保留检查答案的条件成本来限制协调费用。我们的主要引理将小电荷转换为附近的纯状态描述和局部校正，每个仅取决于一个玩家的问题。与宋的采样器一起，这些可以实现调节工作空间的近似本地准备。", "authors": [{"name": "Rahul Jain"}], "featured_authors": [{"name": "Rahul Jain"}], "author_count": 1}, {"id": "2610.21428", "category": "quant-ph", "title": "Crossovers between Time-Bin and Energy-Time Entanglement in Homodyned Resonance Fluorescence", "abstract": "We theoretically investigate photonic entanglement generated by homodyning resonance fluorescence from a two-level emitter with a phase-locked laser field. Under weak excitation, increasing the relative laser-field amplitude produces crossovers from time-bin to energy--time and back to time-bin entanglement. The intermediate energy--time regime occurs near amplitude matching, where destructive interference suppresses the single-photon component, allowing the two-photon contributions to dominate the coincidence signal. We evaluate the resulting photon statistics and first-order coherence and characterize the entanglement through violations of the CHSH Bell inequality in a Franson interferometer. This scheme provides a route to controlling photonic entanglement through linear optics and coherent interference.", "url": "https://arxiv.org/abs/2610.21428", "type": "理论+数值", "summary": "我们从理论上研究了具有锁相激光场的两级发射器的零差共振荧光产生的光子纠缠。在弱激励下，增加相对激光场振幅会产生从时间仓到能量时间的交叉，然后回到时间仓纠缠。中间能量-时间状态发生在幅度匹配附近，其中相消干涉抑制单光子分量，从而允许双光子贡献主导符合信号。我们评估了由此产生的光子统计数据和一阶相干性，并通过违反弗朗森干涉仪中的 CHSH 贝尔不等式来表征纠缠。该方案提供了一种通过线性光学和相干干涉来控制光子纠缠的途径。", "authors": [{"name": "Zi-Qi Zeng"}, {"name": "Jian Wang"}, {"name": "Bang Wu"}, {"name": "Zhiliang Yuan"}], "featured_authors": [{"name": "Zi-Qi Zeng"}, {"name": "Jian Wang"}, {"name": "Bang Wu"}, {"name": "Zhiliang Yuan"}], "author_count": 4}, {"id": "2610.21469", "category": "quant-ph", "title": "Limits of adaptive linear postprocessing in six-state quantum key distribution", "abstract": "Two-way classical communication improves the noise tolerance of quantum key distribution, but the limits of adaptive parity processing remain unclear. For the six-state protocol with equal three-basis error rate $p\\in[p_*,1/2]$, where $p_*=(5-\\sqrt5)/10\\simeq27.64\\%$, we construct a single compatible collective attack that defeats a broad class of linear postprocessing. Each public message may be an affine function of the sender's raw key, chosen adaptively from the public history. For every finite input length and every accepted transcript of positive probability, Eve's optimal probability of recovering any affine function of Alice's raw key is at least Bob's. Consequently, reliable agreement on a linear final key is incompatible with secrecy. The same conclusion holds for arbitrary publicly seeded privacy amplification after reliable recovery of a linear candidate. The proof conditions on the complete transcript, which restricts the two raw keys to affine subspaces. A local degradation of Eve's state, a known Rényi-entropy comparison, and a coset-probability inequality then give the recovery comparison. Both inequalities are proved in self-contained appendices. The result allows block splitting, regrouping, nonzero-syndrome selection, and adaptive linear reconciliation.", "url": "https://arxiv.org/abs/2610.21469", "type": "理论", "summary": "双向经典通信提高了量子密钥分配的噪声容限，但自适应奇偶校验处理的局限性仍不清楚。对于具有相同三基错误率 $p\\in[p_*,1/2]$ 的六状态协议，其中 $p_*=(5-\\sqrt5)/10\\simeq27.64\\%$，我们构建了一个单一的兼容集体攻击，该攻击击败了广泛的线性后处理。每个公共消息可以是从公共历史中自适应选择的发送者原始密钥的仿射函数。对于每个有限的输入长度和每个接受的正概率转录，Eve 恢复 Alice 原始密钥的任何仿射函数的最佳概率至少是 Bob 的。因此，线性最终密钥的可靠一致与保密性是不相容的。同样的结论也适用于线性候选可靠恢复后任意公开种子的隐私放大。完整转录本的证明条件，将两个原始密钥限制为仿射子空间。然后，Eve 状态的局部退化、已知的 Rényi 熵比较和陪集概率不等式给出恢复比较。这两个不等式都在独立的附录中得到了证明。\n\n结果允许块分裂、重组、非零校正子选择和自适应线性协调。", "authors": [{"name": "Toyohiro Tsurumaru"}], "featured_authors": [{"name": "Toyohiro Tsurumaru"}], "author_count": 1}, {"id": "2610.21557", "category": "quant-ph", "title": "Reducing the Cost of Qudit State Preparation by Learning a Sparse Structure for SNAP Gates", "abstract": "Preparing quantum states in bosonic qudits with SNAP--Displacement sequences requires both optimizing the gate parameters and deciding which Fock levels should be controlled by each SNAP gate. A fully parameterized ansatz assigns an independent phase to every Fock level in every gate, leading to a number of phases that grows steeply. This constitutes a problem for short to medium term systems as controlling many phases requires complex control pulses which are subject to increased control errors. Previous work reduced this cost by restricting the trainable phases to predefined sparse patterns, such as a diagonal or a grid, which however may not be optimal for a specific target state. In this work, we address this limitation by introducing a method that learns which phases are needed together with their values, using a differentiable mask. A sparsity penalty encourages the removal of unnecessary phases, while temperature annealing gradually turns the masks into binary decisions. We compare the proposed method with fully parameterized and predefined sparse ansatzes on Fourier and Haar-random target states. The evaluation considers both the minimum number of phases required to reach different infidelity thresholds and the overall trade-off between fidelity and phases required, measured through Pareto frontiers and hypervolume. The results show that learning the location of the phases together with their values provides competitive or improved fidelity--resource trade-offs, although the advantage depends on the target state and qudit dimension.", "url": "https://arxiv.org/abs/2610.21557", "type": "理论+数值", "summary": "使用 SNAP-位移序列在玻色子量子中准备量子态需要优化门参数并决定每个 SNAP 门应控制哪些 Fock 能级。完全参数化的 ansatz 为每个门中的每个 Fock 级别分配一个独立的阶段，导致阶段数量急剧增长。这对于中短期系统来说是一个问题，因为控制许多相需要复杂的控制脉冲，而这些控制脉冲会增加控制误差。之前的工作通过将可训练阶段限制为预定义的稀疏模式（例如对角线或网格）来降低成本，但这对于特定目标状态可能不是最佳的。在这项工作中，我们通过引入一种方法来解决这个限制，该方法使用可微掩码来了解需要哪些阶段及其值。稀疏性惩罚鼓励去除不必要的阶段，而温度退火逐渐将掩模变成二元决策。我们将所提出的方法与傅里叶和哈尔随机目标状态上的完全参数化和预定义的稀疏分析进行比较。\n\n该评估考虑了达到不同不忠阈值所需的最小阶段数，以及通过帕累托前沿和超体积衡量的保真度和所需阶段之间的总体权衡。结果表明，学习相的位置及其值可以提供竞争性或改进的保真度——资源权衡，尽管优势取决于目标状态和 qdit 维度。", "authors": [{"name": "Marco Pennazio"}, {"name": "Leonardo Ignazio Pagliochini"}, {"name": "Riccardo Pellini"}, {"name": "Maurizio Ferrari Dacrema"}, {"name": "Paolo Cremonesi"}], "featured_authors": [{"name": "Marco Pennazio"}, {"name": "Leonardo Ignazio Pagliochini"}, {"name": "Riccardo Pellini"}, {"name": "Maurizio Ferrari Dacrema"}, {"name": "Paolo Cremonesi"}], "author_count": 5}, {"id": "2610.21596", "category": "quant-ph", "title": "Time-optimal robust quantum control for partially known errors", "abstract": "Robust quantum control usually assumes one of two extremes: the error is of a known form and only its strength is unknown, or nothing at all is known about it. In practice one often sits in between. The size of a static error is unknown, but its class is known, for example, it only shifts energy levels, or it acts on each subsystem separately. We ask how fast a control can cancel, to first order, every error in such a class. A time-independent Hamiltonian can do this if and only if all errors in the class have zero diagonal in a common basis. In that case an equally spaced energy ladder in this basis does it after one period. A lower bound that holds for any time-dependent control with bounded drive power shows that this simple constant control is optimal for several natural classes, including unknown level shifts and unknown local errors on two subsystems. Completely unknown errors need a time-dependent control, and there, knowing the error class shortens the minimum time by a factor $\\sqrt{d^2+1}$. So partial knowledge of the error changes not only how long an optimal robust control takes, but also its form.", "url": "https://arxiv.org/abs/2610.21596", "type": "理论+数值", "summary": "鲁棒量子控制通常假设两个极端之一：误差的形式已知，仅其强度未知，或者对此一无所知。在实践中，人们常常介于两者之间。静态误差的大小未知，但其类别是已知的，例如，它仅改变能级，或者单独作用于每个子系统。我们问一个控件能够以多快的速度消除此类中的每个错误。当且仅当类中的所有误差在共同基础上具有零对角线时，与时间无关的哈密顿量才能做到这一点。在这种情况下，在此基础上的等距能量梯会在一个周期后完成。适用于任何具有有限驱动功率的瞬态控制的下限表明，这种简单的恒定控制对于几个自然类别是最佳的，包括两个子系统上的未知电平移位和未知局部误差。完全未知的错误需要依赖于时间的控制，并且知道错误类别可以将最短时间缩短 $\\sqrt{d^2+1}$ 倍。因此，对误差的部分了解不仅会改变最优鲁棒控制所需的时间，还会改变其形式。", "authors": [{"name": "Llorenç Balada Gaggioli"}], "featured_authors": [{"name": "Llorenç Balada Gaggioli"}], "author_count": 1}, {"id": "2610.21608", "category": "quant-ph", "title": "Driving the cooling process of a quantum system via classical noise", "abstract": "It is known that under particular hypotheses anomalous thermalization processes can occur, such as the Mpemba effect, consisting in a faster cooling down when the system is prepared in a hotter initial condition, thus making convenient to warm up the system before the freezing process in order to make it freeze in a shorter time. It is shown here that the action of a Markovian classical noise during the freezing process can accelerate the approach to the zero-temperature thermal state. This prediction is counterintuitive, especially after observing that a classical noise can be considered equivalent to the action of an infinite-temperature reservoir, since both drive the system toward the same state. These facts lead to the statement that warming up the system during the contact with a low-temperature reservoir can accelerate the cooling process.", "url": "https://arxiv.org/abs/2610.21608", "type": "理论", "summary": "众所周知，在特定的假设下，可能会发生异常热化过程，例如Mpemba效应，当系统在较热的初始条件下制备时，会出现更快的冷却，从而方便在冻结过程之前预热系统，以使其在更短的时间内冻结。这里表明，冻结过程中马尔可夫经典噪声的作用可以加速接近零温热状态。这种预测是违反直觉的，特别是在观察到经典噪声可以被认为等同于无限温度储存器的作用之后，因为两者都将系统驱动到相同的状态。这些事实导致这样的说法：在与低温储层接触期间加热系统可以加速冷却过程。", "authors": [{"name": "B. Militello"}, {"name": "A. Napoli"}], "featured_authors": [{"name": "B. Militello"}, {"name": "A. Napoli"}], "author_count": 2}, {"id": "2610.21712", "category": "quant-ph", "title": "Size-Dependent High-Order Harmonic Generation from Linear Carbon-Chain Molecules in Linearly Polarized Laser Fields", "abstract": "High-order harmonic generation from molecules is highly sensitive to molecular geometry and strong-field electron dynamics, providing a powerful route for probing and controlling ultrafast processes in extended systems. In this work, we systematically investigate the influence of molecular chain length on HHG from linear carbon-chain molecules C$_2$H$_2$, C$_6$H$_2$, and C$_{10}$H$_2$ driven by an 800 nm linearly polarized laser field. To isolate the molecular-size effect from the influence of different ionization potentials, the laser intensities are adjusted to maintain the same Keldysh parameter for different molecules. Real-time time-dependent density functional theory simulations are performed with the molecular axis aligned parallel to the laser polarization direction. The results show that increasing the molecular chain length significantly enhances the harmonic yield and tends to extend the cutoff region. In particular, C$_{10}$H$_2$ exhibits much stronger plateau harmonics than C$_2$H$_2$, while the intermediate molecule C$_6$H$_2$ shows harmonic intensities between those of C$_2$H$_2$ and C$_{10}$H$_2$. Time-frequency analysis and charge-density evolution reveal that the enhanced HHG emission in longer chains originates from the enlarged electron acceleration distance and increased probability of multi-center recollision, especially near the terminal carbon atoms. These findings demonstrate that molecular-size engineering offers an effective strategy for controlling harmonic emission and optimizing attosecond light sources in extended molecular systems.", "url": "https://arxiv.org/abs/2610.21712", "type": "理论+数值", "summary": "分子产生的高阶谐波对分子几何形状和强场电子动力学高度敏感，为探测和控制扩展系统中的超快过程提供了强大的途径。在这项工作中，我们系统地研究了由800 nm线偏振激光场驱动的线性碳链分子C$_2$H$_2$、C$_6$H$_2$和C$_{10}$H$_2$的分子链长度对HHG的影响。为了将分子尺寸效应与不同电离势的影响隔离开来，需要调整激光强度以保持不同分子相同的凯尔迪什参数。实时依赖于时间的密度泛函理论模拟是通过与激光偏振方向平行的分子轴进行的。结果表明，增加分子链长度可显着提高谐波产率，并倾向于延长截止区域。特别是，C$_{10}$H$_2$ 表现出比 C$_2$H$_2$ 更强的平台谐波，而中间分子 C$_6$H$_2$ 显示出 C$_2$H$_2$ 和 C$_{10}$H$_2$ 之间的谐波强度。\n\n时频分析和电荷密度演化表明，较长链中HHG发射的增强源于电子加速距离的扩大和多中心碰撞概率的增加，特别是在末端碳原子附近。这些发现表明，分子尺寸工程为控制谐波发射和优化扩展分子系统中的阿秒光源提供了有效的策略。", "authors": [{"name": "Yifan Kang"}, {"name": "Yang Yang"}, {"name": "Yingtan Li"}, {"name": "Shuwen Pang"}, {"name": "Huiwen Yang"}, {"name": "Yingdan Zhang"}, {"name": "Shushan Zhou"}], "featured_authors": [{"name": "Yifan Kang"}, {"name": "Yang Yang"}, {"name": "Yingtan Li"}, {"name": "Huiwen Yang"}, {"name": "Yingdan Zhang"}, {"name": "Shushan Zhou"}], "author_count": 7}, {"id": "2610.21723", "category": "quant-ph", "title": "Operator-Space Entanglement Entropy in Random Fermionic Gaussian Dynamics", "abstract": "We study the von Neumann operator-space entanglement entropy (OSEE) of initial product operators evolved under random gaussian dynamics, as modeled by a Brownian SYK$_2$ model. By exploiting a mapping to a domain-wall melting problem, we derive an exact expression for the time-dependent bipartite OSEE in the thermodynamic limit, and obtain an analytic characterization of the corresponding gaussian Page curve emerging at late times. Our results build on recent work on the entanglement dynamics in the all-to-all quantum simple exclusion process, leveraging tools from RMT, including the Coulomb-gas approach and a mapping to the free Jacobi process. Finally, based on our results, we discuss the possibility of relating the OSEE with non-gaussianity measures in the Heisenberg picture.", "url": "https://arxiv.org/abs/2610.21723", "type": "理论+数值", "summary": "我们研究了随机高斯动力学下演化的初始乘积算子的冯诺依曼算子空间纠缠熵（OSEE），由布朗 SYK$_2$ 模型建模。通过利用磁畴壁熔化问题的映射，我们推导了热力学极限中与时间相关的二部 OSEE 的精确表达式，并获得了后期出现的相应高斯 Page 曲线的分析表征。我们的结果建立在最近关于全量子简单排除过程中纠缠动力学的研究的基础上，利用了 RMT 的工具，包括库仑气体方法和自由雅可比过程的映射。最后，根据我们的结果，我们讨论了将 OSEE 与海森堡图中的非高斯度量相关联的可能性。", "authors": [{"name": "Pablo Bayona-Pena"}, {"name": "Elena Gramellini"}, {"name": "Lorenzo Piroli"}], "featured_authors": [{"name": "Pablo Bayona-Pena"}, {"name": "Elena Gramellini"}, {"name": "Lorenzo Piroli"}], "author_count": 3}, {"id": "2610.21778", "category": "quant-ph", "title": "Same Spectrum, Harder First-Order Training: Phase-Locking in Single- versus Multi-Qubit Re-Uploading Circuits", "abstract": "Angle-encoded variational quantum circuits implement truncated Fourier series. For one-dimensional inputs, a single-qubit re-uploading (serial) circuit represents every function that a multi-qubit circuit with the same encoding budget $E$ can; we find that this exchange of width for depth is not free in first-order training. Because its state lives on the Bloch sphere, all parameters of the serial circuit move the state, at each input, along one complex direction, which we call \\emph{phase-locking}. We prove that this costs no Fourier direction but leaves no direction to spare: however many parameters it has, the serial circuit has at most $2E+2$ tangent directions, one more than its $2E+1$ Fourier coefficients need, while a two-qubit control with the same encoding budget and model class generically has at least $6E+6$. The cost in training is measured against this control, as the number of runs out of 100 that reach the optimum within a fixed step budget. On an exact loss with flat-spectrum targets the gap grows with $E$; at $E=32$ the serial circuit converges in 3, 53 and 83 runs under gradient descent, Adam and Levenberg--Marquardt, the control in 99, 100 and 100. On three real-world series, at matched parameter counts, the serial circuit reaches the least-squares optimum in at most 9 runs under Adam and in 32 to 93 under Levenberg--Marquardt, the control in at least 98 and in all 100; its held-out error is up to about $1.5$ times that of the control under Adam, but no larger in the typical run under Levenberg--Marquardt.", "url": "https://arxiv.org/abs/2610.21778", "type": "理论+数值", "summary": "角度编码变分量子电路实现截断傅里叶级数。对于一维输入，单量子位重新上传（串行）电路代表具有相同编码预算 $E$ 的多量子位电路可以实现的每个功能；我们发现，在一阶训练中，这种宽度与深度的交换并不是免费的。因为它的状态存在于布洛赫球上，所以串行电路的所有参数都会在每个输入处沿着一个复杂的方向移动状态，我们称之为 \\emph{锁相}。我们证明，这不需要傅里叶方向，但没有留下多余的方向：无论它有多少参数，串行电路最多有 $2E+2$ 切线方向，比其 $2E+1$ 傅里叶系数需要多一个，而具有相同编码预算和模型类的两量子位控制通常至少有 $6E+6$。训练成本是根据此控制来衡量的，即在固定步骤预算内达到最佳值的 100 次运行次数。在平坦频谱目标的精确损失中，差距随着 $E$ 的增加而增大；在$E=32$处，串行电路在梯度下降下收敛于3、53和83，Adam和Levenberg-Marquardt，控制在99、100和100。\n\n在三个现实世界的系列中，在匹配的参数计数下，串行电路在 Adam 下最多运行 9 次，在 Levenberg-Marquardt 下运行 32 到 93 次，达到最小二乘最优，控制至少 98 次和全部 100 次；它的保留误差大约是 Adam 控制下的 1.5 倍，但在 Levenberg-Marquardt 控制下的典型运行中并没有更大。", "authors": [{"name": "Michael Poppel"}, {"name": "David Bucher"}, {"name": "Maximilian Zorn"}, {"name": "Markus Baumann"}, {"name": "Sebastian Wölckert"}, {"name": "Claudia Linnhoff-Popien"}, {"name": "Philipp Altmann"}, {"name": "Jonas Stein"}], "featured_authors": [{"name": "Michael Poppel"}, {"name": "David Bucher"}, {"name": "Maximilian Zorn"}, {"name": "Claudia Linnhoff-Popien"}, {"name": "Philipp Altmann"}, {"name": "Jonas Stein"}], "author_count": 8}, {"id": "2610.21797", "category": "quant-ph", "title": "Controlled-Memory Identification with Shared Generators: Dimension--Horizon Tradeoffs and Quantum--Classical Separation", "abstract": "We determine the finite-horizon identification limits of a \\(d\\)-dimensional memory when the control interface is restricted to four shared, time-homogeneous generators. A writer encodes a message by applying a prefix word to a common root state. The verifier then applies a candidate-dependent query word followed by a shared terminal binary test, with each word of length at most \\(T\\). For fixed error tolerances \\(\\lambda_2>0\\) and \\(\\lambda_1+\\lambda_2<1\\), the optimal identification sizes satisfy \\(\\ln N_{\\mathsf Q,4}=\\Theta_{\\lambda_1,\\lambda_2}(\\min\\{d^2,T\\})\\) for arbitrary CPTP generators and \\(\\ln N_{\\mathsf S,4}=\\Theta_{\\lambda_1,\\lambda_2}(\\min\\{d,T\\})\\) for stochastic maps. Four unitary letters and four permutation letters attain these respective bounds, showing that a four-letter reversible alphabet reaches the static code-size orders in optimal quadratic and linear word length. In the fully dimension-limited regime, this yields \\(\\ln N_{\\mathsf Q,4}=\\Theta(d^2)\\) versus \\(\\ln N_{\\mathsf S,4}=\\Theta(d)\\), establishing a quadratic quantum--classical separation in logarithmic code size. Low-overlap Grassmann and agreement-code packings supply the orbit endpoints, while exact inverse query words match each encoded state to its designated test. At the sharp boundary \\(\\lambda_2=0\\), \\(0\\leq\\lambda_1<1\\), all four model classes satisfy \\(\\ln N=\\Theta(\\min\\{\\ln d,T\\})\\). Thus any fixed positive false-acceptance tolerance activates the metric-packing regime, whereas zero false acceptance imposes an exclusive-witness constraint and yields the logarithmic-dimension boundary.", "url": "https://arxiv.org/abs/2610.21797", "type": "理论", "summary": "当控制接口仅限于四个共享的时间同质生成器时，我们确定了 d 维存储器的有限范围识别限制。编写者通过将前缀词应用于公共根状态来对消息进行编码。然后，验证者应用一个与候选相关的查询词，然后进行共享终端二进制测试，每个词的长度最多为 \\(T\\)。对于固定误差容限 \\(\\lambda_2>0\\) 和 \\(\\lambda_1+\\lambda_2<1\\)，对于任意 CPTP 生成器，最佳识别大小满足 \\(\\ln N_{\\mathsf Q,4}=\\Theta_{\\lambda_1,\\lambda_2}(\\min\\{d^2,T\\})\\) 和 \\(\\ln N_{\\mathsf S,4}=\\Theta_{\\lambda_1,\\lambda_2}(\\min\\{d,T\\})\\) 用于随机映射。四个单一字母和四个排列字母达到了这些各自的界限，表明四字母可逆字母表达到了最佳二次和线性字长的静态代码大小顺序。在完全维度限制的情况下，这会产生 \\(\\ln N_{\\mathsf Q,4}=\\Theta(d^2)\\) 与 \\(\\ln N_{\\mathsf S,4}=\\Theta(d)\\)，建立对数代码大小的二次量子经典分离。\n\n低重叠的格拉斯曼和协议代码打包提供轨道端点，而精确的反向查询字将每个编码状态与其指定的测试相匹配。在尖锐边界 \\(\\lambda_2=0\\)、\\(0\\leq\\lambda_1<1\\) 处，所有四个模型类都满足 \\(\\ln N=\\Theta(\\min\\{\\ln d,T\\})\\)。因此，任何固定的正错误接受容忍度都会激活度量打包机制，而零错误接受会施加排它见证约束并产生对数维度边界。", "authors": [{"name": "Yixin Zhao"}], "featured_authors": [{"name": "Yixin Zhao"}], "author_count": 1}, {"id": "2610.21883", "category": "quant-ph", "title": "Hybrid Quantum-Classical Optimization for Emergency-Priority Traffic Signal Control", "abstract": "Emergency-priority traffic signal control requires reducing emergency-vehicle delay while limiting disruption to ordinary traffic. This work investigates a finite-horizon QUBO formulation and compares Exact QUBO optimization, QAOA, CVaR-QAOA, a quantum machine-learning policy, fixed-time control, and max-pressure control in a three-intersection corridor. The study evaluates three traffic-demand regimes, examines the effect of the emergency-priority weight, and compares quantum solutions with the exact QUBO optimum. The optimization-based controllers achieved reliable emergency progression across all tested demand regimes, while max-pressure produced lower ordinary-traffic delay. Increasing emergency priority reduced emergency travel time but increased congestion, with diminishing improvements at larger weights. CVaR-QAOA reproduced the exact QUBO solution more accurately than standard QAOA, although the resulting differences in closed-loop traffic performance were comparatively small.", "url": "https://arxiv.org/abs/2610.21883", "type": "数值", "summary": "紧急优先交通信号控制需要减少紧急车辆延误，同时限制对正常交通的干扰。这项工作研究了有限范围 QUBO 公式，并比较了三交叉口走廊中的精确 QUBO 优化、QAOA、CVaR-QAOA、量子机器学习策略、固定时间控制和最大压力控制。该研究评估了三种流量需求机制，检查了紧急优先权重的影响，并将量子解决方案与精确的 QUBO 最优值进行了比较。基于优化的控制器在所有测试的需求状态下实现了可靠的紧急进展，同时最大压力产生了较低的普通交通延迟。提高紧急优先级减少了紧急出行时间，但增加了拥堵，而重量越大，改善效果就越小。 CVaR-QAOA 比标准 QAOA 更准确地再现了精确的 QUBO 解决方案，尽管闭环流量性能的差异相对较小。", "authors": [{"name": "Silvie Illésová"}, {"name": "Vojtěch Novák"}], "featured_authors": [{"name": "Silvie Illésová"}, {"name": "Vojtěch Novák"}], "author_count": 2}, {"id": "2610.21907", "category": "quant-ph", "title": "Selected Stabilizer Subspaces for Compact Many-Body Wave Functions", "abstract": "Selected configuration interaction (SCI) obtains accurate many-body solutions by variationally diagonalising the Hamiltonian in a sparse, iteratively selected set of configurations, but can lose compactness when the target state has broad configurational support. We introduce selected stabilizer interaction (SSI), a fully classical, SCI-inspired method that instead iteratively constructs a nonorthogonal subspace spanned by a systematically enlargeable set of selected stabilizer states. A single stabilizer, generated by Clifford operations, can encode a structured superposition of (possibly exponentially) many configurations, shifting the relevant compression from configurational to stabilizer sparsity. We benchmark ground-state energies, fidelities, superposition degrees and required expansion lengths against exact diagonalization and equivalent SCI schemes for the transverse-field Ising, XXZ Heisenberg, and Hubbard models, finding particularly strong compression from the stabilizer representation in the spin models, and increasing advantage with system size for these systems. The results establish a proof of principle for heuristic selected stabilizer diagonalization, while also identifying particular challenges in symmetry handling and effective exploration of the stabilizer space.", "url": "https://arxiv.org/abs/2610.21907", "type": "理论+数值", "summary": "选择构型交互 (SCI) 通过在稀疏、迭代选择的构型集中对哈密顿量进行变分对角化来获得准确的多体解，但当目标状态具有广泛的构型支持时，可能会失去紧凑性。我们引入了选择稳定剂相互作用（SSI），这是一种完全经典的、受 SCI 启发的方法，它迭代地构建一个由一组系统可放大的选定稳定剂状态组成的非正交子空间。由 Clifford 运算生成的单个稳定器可以对许多配置（可能呈指数级）的结构化叠加进行编码，从而将相关压缩从配置稀疏性转变为稳定器稀疏性。我们将基态能量、保真度、叠加度和所需的膨胀长度与横向场伊辛、XXZ 海森堡和哈伯德模型的精确对角化和等效 SCI 方案进行基准测试，发现自旋模型中稳定器表示的特别强的压缩，并增加了这些系统的系统尺寸优势。\n\n结果为启发式选择稳定器对角化建立了原理证明，同时还确定了对称处理和稳定器空间有效探索中的特殊挑战。", "authors": [{"name": "Maria-Andreea Filip"}, {"name": "George H. Booth"}], "featured_authors": [{"name": "Maria-Andreea Filip"}, {"name": "George H. Booth"}], "author_count": 2}, {"id": "2610.21909", "category": "quant-ph", "title": "Looking Beyond Visibility: Resolving the Temporal Structure of Continuous-Wave Four-Photon Hong-Ou-Mandel Interference", "abstract": "Hong-Ou-Mandel interference underpins many photonic quantum information protocols and is commonly characterized by a single visibility parameter. This quantity is typically obtained by averaging over a fixed coincidence window, thereby discarding details of the underlying temporal structure that are critical in continuous-wave processes. Four-photon interference with continuous-wave sources furthermore requires photon pairs with long coherence times, which we generate in microring resonators and measure with ultrafast time-resolved detection. Here, we model and resolve their interference and temporal structure by recording all four photon arrival times and mapping their relative delays onto a three-dimensional coincidence histogram relative to a trigger detection. The resulting structure preserves relative arrival-time correlations that are usually discarded and enables post-processed optimization of coincidence windows to trade off visibility against count rate. This method provides a general benchmark for continuous-wave sources in interference-based quantum network protocols.", "url": "https://arxiv.org/abs/2610.21909", "type": "理论+数值", "summary": "红欧曼德尔干涉是许多光子量子信息协议的基础，通常以单一可见性参数为特征。该量通常是通过对固定重合窗口进行平均来获得的，从而丢弃了连续波过程中至关重要的底层时间结构的细节。连续波源的四光子干涉还需要具有长相干时间的光子对，我们在微环谐振器中生成光子对，并通过超快时间分辨检测进行测量。在这里，我们通过记录所有四个光子到达时间并将它们的相对延迟映射到相对于触发检测的三维重合直方图来建模和解析它们的干扰和时间结构。由此产生的结构保留了通常被丢弃的相对到达时间相关性，并实现了重合窗口的后处理优化，以权衡可见性和计数率。该方法为基于干扰的量子网络协议中的连续波源提供了通用基准。", "authors": [{"name": "Sabine Häussler"}, {"name": "Meritxell Cabrejo-Ponce"}, {"name": "Ana Maria Torres"}, {"name": "Baghdasar Baghdasaryan"}, {"name": "Karen Lozano-Mendéz"}, {"name": "Fabian Steinlechner"}], "featured_authors": [{"name": "Sabine Häussler"}, {"name": "Meritxell Cabrejo-Ponce"}, {"name": "Ana Maria Torres"}, {"name": "Baghdasar Baghdasaryan"}, {"name": "Karen Lozano-Mendéz"}, {"name": "Fabian Steinlechner"}], "author_count": 6}, {"id": "2610.21923", "category": "quant-ph", "title": "Opinion bubbles in the quantum Buridan's ass problem", "abstract": "The quantum Buridan's ass problem concerns a network of interconnected nodes in which transitions between the nodes are governed by the laws of quantum mechanics. In such situations interference between probability amplitudes plays a key role in determining whether the probability of leaving the initial node is large or small and also the speed at which the associated transitions occur. In this paper we extend this idea to consider transitions between one given set of coupled nodes and the remainder of the network. We have in mind a quantum analogy to changing an opinion, in which the initially occupied set of nodes is one opinion bubble, with the remaining parts of the network corresponding to a different opinion. We find that quantum interference again plays a crucial role in the dynamics. A further key component is the role of symmetry between the nodes and their interconnections, as it is symmetry that lies at the heart of the Buridan's ass puzzle. In the classical Buridan's ass paradox it is symmetry between competing alternatives that freezes the ass into indecision. In the quantum case, however, interference results in a far richer dynamics.", "url": "https://arxiv.org/abs/2610.21923", "type": "理论", "summary": "量子布里丹的屁股问题涉及互连节点的网络，其中节点之间的转换受量子力学定律控制。在这种情况下，概率幅度之间的干扰在确定离开初始节点的概率是大还是小以及相关转移发生的速度方面起着关键作用。在本文中，我们扩展了这一想法，以考虑一组给定的耦合节点与网络其余部分之间的转换。我们想到了改变意见的量子类比，其中最初占用的一组节点是一个意见泡沫，而网络的其余部分对应于不同的意见。我们发现量子干涉再次在动力学中发挥着至关重要的作用。另一个关键组成部分是节点及其互连之间的对称性的作用，因为对称性是布里丹屁股谜题的核心。在经典的布里丹屁股悖论中，竞争选择之间的对称性使屁股陷入优柔寡断的境地。然而，在量子情况下，干涉会产生更丰富的动力学。", "authors": [{"name": "Leonid Chaichenets"}, {"name": "Jaroslav Novotný"}, {"name": "Igor Jex"}, {"name": "Stephen M. Barnett"}, {"name": "Tamás Kiss"}], "featured_authors": [{"name": "Leonid Chaichenets"}, {"name": "Jaroslav Novotný"}, {"name": "Igor Jex"}, {"name": "Stephen M. Barnett"}, {"name": "Tamás Kiss"}], "author_count": 5}, {"id": "2610.21928", "category": "quant-ph", "title": "Synergistic charging of a quantum battery via Dzyaloshinskii-Moriya interaction and non-Markovian noise", "abstract": "Protecting quantum batteries from environmental noise remains a challenge. Using exact Burshtein-Kubo equations, we study a two-spin quantum battery with Dzyaloshinskii-Moriya (DM) coupling under indepen dent local longitudinal random telegraph noise (RTN). At a fixed effective noise scale, the DM-assisted slow switching protocol yields a superadditive transient ergotropy gain and near-maximal ergotropy during the initial charging stage, while the no-DM slow-switching control reaches comparable ergotropy only in a later revival. A finite superadditive region persists at fixed RTN amplitude, with protocol-dependent location and gain. In the Ising model, the enhancement is nonmonotonic in DM strength, with intermediate coupling giving near-optimal performance. Dressed-channel analysis associates this enhancement with changes in transition frequencies and longitudinal-noise matrix elements that reduce slow-RTN spectral weight. Superadditivity also persists in the tested anisotropic XY model.", "url": "https://arxiv.org/abs/2610.21928", "type": "理论", "summary": "保护量子电池免受环境噪声的影响仍然是一个挑战。使用精确的 Burshtein-Kubo 方程，我们研究了独立局部纵向随机电报噪声 (RTN) 下具有 Dzyaloshinskii-Moriya (DM) 耦合的双自旋量子电池。在固定的有效噪声范围内，DM 辅助的慢速开关协议在初始充电阶段产生超加性瞬态各向异性增益和接近最大的各向异性，而无 DM 慢速开关控制仅在稍后的恢复中才达到可比较的各向异性。有限超加性区域持续保持固定 RTN 幅度，具有与协议相关的位置和增益。在 Ising 模型中，DM 强度的增强是非单调的，中间耦合可提供接近最佳的性能。修饰通道分析将这种增强与过渡频率和纵向噪声矩阵元素的变化联系起来，从而减少慢速 RTN 频谱权重。超可加性在测试的各向异性 XY 模型中也持续存在。", "authors": [{"name": "Si-Yu Zhang"}, {"name": "Meng-Long Song"}, {"name": "Hai-Tao Dong"}, {"name": "Xue-Ke Song"}, {"name": "Liu Ye"}, {"name": "Dong Wang"}], "featured_authors": [{"name": "Si-Yu Zhang"}, {"name": "Meng-Long Song"}, {"name": "Hai-Tao Dong"}, {"name": "Xue-Ke Song"}, {"name": "Liu Ye"}, {"name": "Dong Wang"}], "author_count": 6}, {"id": "2610.21936", "category": "quant-ph", "title": "ZZ-Free bSWAP Gates under Strong Driving in Far-Detuned Fixed-Frequency Transmons", "abstract": "Far-detuned frequency allocations in fixed-frequency superconducting processors mitigate spectral crowding but constrain cross-resonance interactions at practical drive amplitudes. Here, we demonstrate that a single strong drive induces a large $XX-YY$ interaction in the far-detuned regime, while a weak second tone tunes the accompanying $ZZ$ phase. The interaction realizes a 150-ns $\\sqrt{\\mathrm{bSWAP}}$ gate, which can directly prepare a maximally entangled state from the ground state. For the implementations on the same qubit pair at matched drive strengths, cross resonance gives a shorter CNOT operation, while $\\sqrt{\\mathrm{bSWAP}}$ gives a 33% shorter SWAP operation with a higher IRB fidelity. The multilevel theory further predicts a regime where stronger driving can yield a speed advantage for CNOT as well, a possibility absent in the two-level model. As an application of the $XX-YY$ interaction, we also demonstrate two-spin squeezing beyond the standard quantum limit through two-axis countertwisting. The interaction realized here complements cross resonance and offers a route to efficient gate synthesis and quantum simulation of interacting spin systems.", "url": "https://arxiv.org/abs/2610.21936", "type": "理论+数值", "summary": "固定频率超导处理器中的远失谐频率分配减轻了频谱拥挤，但限制了实际驱动幅度下的交叉谐振相互作用。在这里，我们证明单个强驱动会在远失谐状态中引起较大的 $XX-YY$ 相互作用，而弱的第二音则调整伴随的 $ZZ$ 相位。该交互实现了一个 150 ns $\\sqrt{\\mathrm{bSWAP}}$ 门，可以直接从基态准备最大纠缠态。对于在匹配驱动强度的同一量子位对上的实现，交叉共振提供更短的 CNOT 操作，而 $\\sqrt{\\mathrm{bSWAP}}$ 提供更短的 33% SWAP 操作和更高的 IRB 保真度。多级理论进一步预测，更强的驾驶能力也能为 CNOT 带来速度优势，而两级模型中不存在这种可能性。作为 $XX-YY$ 相互作用的应用，我们还通过两轴反扭转演示了超出标准量子极限的双自旋挤压。这里实现的相互作用补充了交叉共振，并为相互作用自旋系统的有效门合成和量子模拟提供了一条途径。", "authors": [{"name": "Akinori Machino"}, {"name": "Kazuhisa Ogawa"}, {"name": "Yuto Ikegai"}, {"name": "Takafumi Miyanaga"}, {"name": "Koichiro Ban"}, {"name": "Nilton F. G. Filho"}, {"name": "Hidehisa Shiomi"}, {"name": "Toshi Sumida"}, {"name": "Shuhei Tamate"}, {"name": "Yutaka Tabuchi"}, {"name": "Yasunobu Nakamura"}, {"name": "Makoto Negoro"}], "featured_authors": [{"name": "Akinori Machino"}, {"name": "Kazuhisa Ogawa"}, {"name": "Yuto Ikegai"}, {"name": "Yutaka Tabuchi"}, {"name": "Yasunobu Nakamura"}, {"name": "Makoto Negoro"}], "author_count": 12}, {"id": "2610.22004", "category": "quant-ph", "title": "Thermal activation of photon catalysis in difference-intensity Mach-Zehnder interferometry with squeezed thermal light", "abstract": "Realistic non-Gaussian operations, which can be implemented by mixing a nonclassical Gaussian state with a Fock state at a beam splitter and then heralding on a photon-number-resolving detector, are known to improve phase estimation in a Mach-Zehnder interferometer. The existing studies have considered the single-mode squeezed vacuum for difference-intensity and parity detection, and the two-mode squeezed thermal state for parity detection alone as the initial Gaussian resources. However, a real squeezer in the lab actually produces single-mode squeezed thermal light, which has not been studied in a coherent-plus-resource interferometer. We take up this case and using the phase space Wigner picture, we obtain the heralded state produced by photon subtraction, addition and catalysis on a single-mode squeezed thermal resource, and evaluate the corresponding phase sensitivities. Single-photon catalysis, which is useless on squeezed vacuum, becomes a useful operation for any thermal occupation above $\\nth\\simeq0.2$, and since it heralds with a probability near one-half, it turns out to be the best success-weighted operation over the whole thermal range. In the vacuum limit our results reproduce the known hierarchy, where two-photon catalysis is the best operation. The quantum Fisher information computations confirms that thermal noise enhances the phase information encoded in the catalyzed state, demonstrating that difference-intensity detection closely approaches the ultimate precision bound across most operational regimes, and, together with a loss analysis, verifies the robustness of the effect.", "url": "https://arxiv.org/abs/2610.22004", "type": "理论+数值", "summary": "现实的非高斯操作可以通过在分束器处将非经典高斯状态与福克状态混合然后在光子数分辨探测器上进行预示来实现，已知可以改善马赫-曾德尔干涉仪中的相位估计。现有研究将用于差强度和奇偶校验检测的单模压缩真空和仅用于奇偶校验检测的双模压缩热态作为初始高斯资源。然而，实验室中的真实压缩器实际上会产生单模压缩热光，这尚未在相干加资源干涉仪中进行过研究。我们以这种情况为基础，利用相空间维格纳图，获得了单模压缩热源上光子相减、相加和催化产生的预示态，并评估了相应的相敏性。单光子催化在压缩真空下毫无用处，但对于任何高于 $\\nth\\simeq0.2$ 的热占用来说却是一种有用的操作，并且由于它预示着接近二分之一的概率，因此它被证明是整个热范围内最好的成功加权操作。\n\n在真空极限下，我们的结果再现了已知的层次结构，其中双光子催化是最佳操作。量子费希尔信息计算证实，热噪声增强了催化状态下编码的相位信息，证明差异强度检测非常接近大多数操作方案的最终精度范围，并且与损耗分析一起验证了效果的鲁棒性。", "authors": [{"name": "Kirtpreet Singh"}, {"name": "Arvind"}], "featured_authors": [{"name": "Kirtpreet Singh"}, {"name": "Arvind"}], "author_count": 2}, {"id": "2610.22034", "category": "quant-ph", "title": "Energetic channels in finite many-body quantum charging", "abstract": "We examine how a finite many-body system can function as an effective charger for a single-qubit quantum battery, using the Lipkin-Meshkov-Glick model as a paradigmatic setting. As our figure of merit, we consider the battery ergotropy while explicitly resolving the energetic flows across the composite system. In the absence of intra-charger interactions, we show that the generation of non-zero ergotropy is controlled by the competition between collective coupling and spectral mismatch. We further demonstrate that even passive positive-temperature charger states can generate finite battery ergotropy, provided the charger is sufficiently large and sufficiently hot. Intra-charger interactions restructure the charger spectrum and qualitatively modify the available energetic pathways. While they can enhance the amount of energy accessible for charging, they can simultaneously divert energy into internal many-body and battery-charger interaction channels, producing an energetic impedance to direct charger-to-battery transfer. Consequently, battery ergotropy alone is insufficient to characterize an effective many-body charger: the useful work generated and its energetic provenance must be assessed together.", "url": "https://arxiv.org/abs/2610.22034", "type": "理论", "summary": "我们使用 Lipkin-Meshkov-Glick 模型作为范例设置，研究有限多体系统如何充当单量子位量子电池的有效充电器。作为我们的品质因数，我们考虑电池的各向异性，同时明确解决复合系统中的能量流。在没有充电器内相互作用的情况下，我们表明非零各向异性​​的产生是由集体耦合和光谱失配之间的竞争控制的。我们进一步证明，只要充电器足够大且足够热，即使是被动正温度充电器状态也可以产生有限的电池各向异性。充电器内的相互作用重组了充电器频谱并定性地改变了可用的能量路径。虽然它们可以增加可用于充电的能量，但它们可以同时将能量转移到内部多体和电池充电器交互通道中，产生能量阻抗以直接从充电器到电池传输。\n\n因此，仅电池的各向异性不足以表征有效的多体充电器：必须一起评估产生的有用功及其能量来源。", "authors": [{"name": "Dara Murphy"}, {"name": "George Mihailescu"}, {"name": "Anne Matthies"}, {"name": "Irene D'Amico"}, {"name": "Steve Campbell"}], "featured_authors": [{"name": "Dara Murphy"}, {"name": "George Mihailescu"}, {"name": "Anne Matthies"}, {"name": "Irene D'Amico"}, {"name": "Steve Campbell"}], "author_count": 5}, {"id": "2610.22069", "category": "quant-ph", "title": "Generalized $m$-body mean-field projections for classical simulation of $d$-dimensional Heisenberg-picture dynamics", "abstract": "Classical simulation of quantum many-body dynamics is challenged by the rapid growth of operator complexity, particularly in higher dimensions where tensor-network methods become increasingly demanding. We develop state-adapted Pauli-weight propagation based on generalized $m$-body mean-field projections, which compress many-body observables into optimal low-body representations in a covariance geometry induced by the initial state. Combined with adaptive Krylov-like restricted Heisenberg dynamics, this provides an alternative to conventional Hilbert--Schmidt Pauli-weight truncation. We derive necessary and conditional sufficient bounds on low-body approximation accuracy using standard operator complexity measures and characterize possible dynamical failure mechanisms of the state-adapted method. Numerical benchmarks demonstrate substantial state-dependent accuracy gains, while identifying regimes of reduced accuracy or violations of Pauli spectral bounds. For a three-dimensional system of $80$ interacting spins, our method achieves strong body-order convergence, close agreement with independently converging tensor-network simulations, and substantially smaller sparse Pauli representations. These results establish state-adapted Pauli propagation as a promising approach to classical simulation of higher-dimensional coherent many-body dynamics.", "url": "https://arxiv.org/abs/2610.22069", "type": "理论+数值", "summary": "量子多体动力学的经典模拟受到算子复杂性快速增长的挑战，特别是在张量网络方法变得越来越要求的更高维度中。我们基于广义 $m$ 体平均场投影开发状态自适应泡利权重传​​播，它将多体可观测量压缩为由初始状态引起的协方差几何中的最佳低体表示。与自适应克雷洛夫式限制海森堡动力学相结合，这提供了传统希尔伯特-施密特泡利权重截断的替代方案。我们使用标准算子复杂性度量得出低体近似精度的必要且有条件的充分界限，并表征状态适应方法的可能动态故障机制。数值基准证明了与状态相关的精度增益，同时识别了精度降低或违反泡利谱界限的情况。\n\n对于 80 美元相互作用自旋的三维系统，我们的方法实现了强大的体序收敛，与独立收敛的张量网络模拟紧密一致，以及更小的稀疏泡利表示。这些结果确立了状态自适应泡利传播作为高维相干多体动力学经典模拟的一种有前景的方法。", "authors": [{"name": "Federico Tomás B. Pérez"}, {"name": "Gabriela Wójtowicz"}, {"name": "Matthias Kost"}, {"name": "Martin B. Plenio"}], "featured_authors": [{"name": "Federico Tomás B. Pérez"}, {"name": "Gabriela Wójtowicz"}, {"name": "Matthias Kost"}, {"name": "Martin B. Plenio"}], "author_count": 4}, {"id": "2610.22093", "category": "quant-ph", "title": "Bubble-Sort Exchange Networks: Symmetry Selection Rules and Language-Model Distillation on Exchange-Only Spin Chains", "abstract": "On a chain of exchange-coupled quantum dots a Heisenberg exchange pulse of area pi is a SWAP, so the parallel bubble-sort SWAP network of superconducting chains is native to exchange-only (EO) spin qubits, and any other pulse area fuses routing with an entangling interaction. We build a variational \"bubble-sort exchange network\" (odd-even transposition, one parameter per pulse) and study it as a Born machine read out by Pauli spin blockade. Exchange conserves total spin, so the reachable readout distributions are fixed by the total-spin content of the initial product state. For the two-spin singlet-triplet encoding we derive a selection rule -- outcomes with k triplet pairs are bounded by the initial weight in sectors S <= k (S = 0 excluded for k = 1) -- and prove by a transportation argument that it is also sufficient: the reachable distributions form the polytope cut out by the rule, and its total-variation floor is attained. Products of singlets and T0's forbid whole outcome classes; the Neel state forbids none; the three-spin EO code has no floor. We then distil, in noise-free simulation, next-token distributions of GPT-2 over restricted vocabularies into the network, with matrix-product-state (MPS) Born machines as classical control. At six logical qubits the three-spin chain reaches KL = 0.011 nat at depth N and 0.004 at 2N, below the bond-dimension-4 MPS; the two-spin chain from the Neel state reaches 0.014 at 2N and 0.004 at 3N, against 0.28-1.5 from singlet/triplet products for the first teacher. Final states lie largely outside the code space: leakage is a resource, not an error. No arrangement of disjoint pulses meets every pair in fewer than N-1 rounds, and at depth 2N the chain distils as well as a 2D array or non-local couplings. Sector-restricted simulation extends this to 10-14 logical qubits (up to 30 dots).", "url": "https://arxiv.org/abs/2610.22093", "type": "理论+数值", "summary": "在交换耦合量子点链上，区域 pi 的海森堡交换脉冲是一个 SWAP，因此超导链的并行气泡排序交换网络原生于仅交换 (EO) 自旋量子位，并且任何其他脉冲区域都会融合路由与纠缠相互作用。我们构建了一个变分“冒泡排序交换网络”（奇偶转置，每个脉冲一个参数），并将其作为泡利自旋封锁读出的玻恩机进行研究。交换保留总自旋，因此可达到的读出分布由初始产品状态的总自旋内容固定。对于双自旋单重态-三重态编码，我们推导出一个选择规则——具有 k 个三重态对的结果受扇区 S <= k 中的初始权重限制（对于 k = 1，S = 0 除外）——并通过传输论证证明它也是足够的：可达分布形成由规则切出的多面体，并且获得其总变异下限。单线和 T0 的产品禁止整个结果类别；尼尔州没有禁止任何规定；三自旋EO代码没有底线。\n\n然后，我们在无噪声模拟中将 GPT-2 在受限词汇表上的下一个标记分布提炼到网络中，并使用矩阵乘积状态 (MPS) Born 机器作为经典控制。在六个逻辑量子位处，三自旋链在深度 N 处达到 KL = 0.011 nat，在 2N 处达到 KL = 0.004，低于键维 4 MPS；来自尼尔态的双自旋链在 2N 时达到 0.014，在 3N 时达到 0.004，而第一个教师的单线态/三线态产物为 0.28-1.5。最终状态很大程度上位于代码空间之外：泄漏是一种资源，而不是错误。不相交脉冲的排列不会在少于 N-1 轮的时间内满足每一对，并且在深度 2N 处，链会蒸馏以及 2D 阵列或非局部耦合。扇区限制模拟将其扩展到 10-14 个逻辑量子位（最多 30 个点）。", "authors": [{"name": "Yuichiro Minato"}], "featured_authors": [{"name": "Yuichiro Minato"}], "author_count": 1}, {"id": "2610.22097", "category": "quant-ph", "title": "Operational Limits of Gravity-Mediated Entanglement", "abstract": "Tests of gravity-mediated entanglement aim to determine whether two massive objects in spatial superposition can become entangled through their mutual gravitational interaction. In an ideal model, the two objects are often treated as pointlike branches, but real wave packets have a finite width and are also exposed to dephasing and residual non-gravitational forces. We study these effects in a two-branch gravitational cat-state model with Gaussian wave packets. The Newtonian interaction is averaged over the finite wave-packet width, and spatially correlated dephasing is included phenomenologically. We then ask a practical question: when does the generated state remain useful rather than merely entangled? To answer this, we examine Bell violation, teleportation fidelity, coherent information, Fisher information, and state distinguishability. We find finite parameter windows where the same state is Bell-nonlocal and teleportation-useful, but these windows shrink as the wave packets become broader or the dephasing becomes stronger. We also show that a residual electrostatic branch interaction can coherently cancel the gravitational nonlocal phase and strongly suppress the operational signal. The results identify finite-width and electrostatic tolerance boundaries that should be considered in future tests of gravity-mediated entanglement.", "url": "https://arxiv.org/abs/2610.22097", "type": "理论", "summary": "引力介导的纠缠测试旨在确定空间叠加中的两个大质量物体是否可以通过相互的引力相互作用而纠缠在一起。在理想模型中，这两个物体通常被视为点状分支，但真实的波包具有有限的宽度，并且还受到相移和残余非重力的影响。我们在具有高斯波包的二分支引力猫态模型中研究这些效应。牛顿相互作用在有限的波包宽度上进行平均，并且在现象学上包括空间相关的移相。然后我们问一个实际问题：生成的状态什么时候仍然有用而不仅仅是纠缠？为了回答这个问题，我们研究了贝尔违规、隐形传态保真度、相干信息、费舍尔信息和状态可区分性。我们发现有限参数窗口，其中相同的状态对贝尔非局域和隐形传态有用，但这些窗口随着波包变宽或相移变强而缩小。\n\n我们还表明，残余静电分支相互作用可以相干地消除引力非局域相位并强烈抑制操作信号。结果确定了在未来重力介导的纠缠测试中应考虑的有限宽度和静电容限边界。", "authors": [{"name": "Atta ur Rahman"}, {"name": "Muhammad Noman"}, {"name": "Ying-Jian Zhu"}, {"name": "Jia-Xin Peng"}, {"name": "Saeed Haddadi"}], "featured_authors": [{"name": "Atta ur Rahman"}, {"name": "Muhammad Noman"}, {"name": "Ying-Jian Zhu"}, {"name": "Jia-Xin Peng"}, {"name": "Saeed Haddadi"}], "author_count": 5}, {"id": "2610.22145", "category": "quant-ph", "title": "Gyrators for superconducting circuit design", "abstract": "Assuming only the solubility of Kirchhoff's laws, the conservation of energy, and the form of the constitutive relations, we present a flux-charge symmetric Hamiltonian formalism that always admits a symplectic reduction for nonsingular, well-posed circuits involving gyrators, inductors, and capacitors (LCG circuits) with arbitrary non-linearity. The formalism introduces a notion of circuit duality on non-linear non-reciprocal circuits and a family of point transformations that inserts, removes, and moves reciprocal elements across gyrators while preserving the Hamiltonian spectrum. With these transformations, we extend Tellegen's classic result that gyrators make reciprocal elements behave as their dual to non-linear reciprocal elements such as the Josephson junction and quantum phase slip. Furthermore, we present conditions under which non-reciprocal circuits can be transformed to dynamically equivalent reciprocal circuits.", "url": "https://arxiv.org/abs/2610.22145", "type": "理论", "summary": "仅假设基尔霍夫定律的可解性、能量守恒和本构关系的形式，我们提出了一种磁通荷对称哈密顿形式主义，该形式主义始终允许涉及具有任意非线性的回转器、电感器和电容器（LCG 电路）的非奇异、适定电路（LCG 电路）的辛约简。该形式主义引入了非线性非互易电路上的电路对偶性概念以及一系列点变换，这些点变换在回转器上插入、删除和移动互易元素，同时保留哈密顿谱。通过这些变换，我们扩展了特勒根的经典结果，即回转器使互易元件表现为对偶非线性互易元件，例如约瑟夫森结和量子相滑。此外，我们提出了不可逆电路可以转换为动态等效可逆电路的条件。", "authors": [{"name": "Ciro Salcedo"}, {"name": "Sasha Cocquyt"}, {"name": "Andrew Osborne"}, {"name": "Andrew A. Houck"}], "featured_authors": [{"name": "Ciro Salcedo"}, {"name": "Sasha Cocquyt"}, {"name": "Andrew Osborne"}, {"name": "Andrew A. Houck"}], "author_count": 4}, {"id": "2610.22199", "category": "quant-ph", "title": "Energetics of Fault-Tolerant Spin-Qubit Quantum Computation", "abstract": "Semiconductor spin qubits offer a promising route to compact and scalable quantum computers, combining long coherence times in isotopically purified silicon with compatibility with semiconductor manufacturing. Beyond computational speedup, their energy efficiency is an important consideration for future large-scale systems. We evaluate the power and energy requirements of a Loss-DiVincenzo spin-qubit quantum computer by analyzing the Quantum Fourier Transform (QFT) and benchmarking it against the classical Fast Fourier Transform (FFT). We develop a detailed energy budget, identifying cryogenic cooling as the dominant baseline contribution before quantum error correction (QEC). The comparison between the QFT and the classical FFT reveals that, for any quantum workload operating under a polynomially bounded sampling regime, the crossover in energy consumption occurs at smaller problem sizes than the crossover in execution time. Thus, quantum computing can become energetically competitive before achieving a speedup in execution time. We then incorporate surface-code QEC and analyze the energy costs of QEC cycles, gate synthesis, and decoding. At scale, instrumentation and decoding become dominant contributions, while cryogenic cooling imposes a constraint on scalability. We show that optimizing the control-signal demultiplexing ratio can reduce the overall energy cost by approximately two orders of magnitude. For a system with about one million physical qubits, we estimate a power consumption of approximately 100 kW, at least one order of magnitude below that of today's highest-performance classical computing systems.", "url": "https://arxiv.org/abs/2610.22199", "type": "理论+数值", "summary": "半导体自旋量子位为紧凑且可扩展的量子计算机提供了一条有前途的途径，它将同位素纯化硅的长相干时间与半导体制造的兼容性相结合。除了计算加速之外，它们的能源效率是未来大型系统的重要考虑因素。我们通过分析量子傅里叶变换 (QFT) 并将其与经典快速傅里叶变换 (FFT) 进行基准测试，评估了 Loss-DiVincenzo 自旋量子位量子计算机的功率和能量需求。我们制定了详细的能源预算，将低温冷却确定为量子误差校正（QEC）之前的主要基线贡献。 QFT 和经典 FFT 之间的比较表明，对于在多项式有界采样机制下运行的任何量子工作负载，能耗交叉发生在比执行时间交叉更小的问题规模上。因此，在实现执行时间加速之前，量子计算可以变得极具竞争力。然后，我们结合表面代码 QEC 并分析 QEC 周期、门综合和解码的能量成本。\n\n在规模上，仪器和解码成为主要贡献，而低温冷却对可扩展性施加了限制。我们表明，优化控制信号解复用比可以将总体能源成本降低大约两个数量级。对于一个拥有约 100 万个物理量子位的系统，我们估计功耗约为 100 kW，比当今最高性能的经典计算系统至少低一个数量级。", "authors": [{"name": "João Santos"}, {"name": "Jayshankar Nath"}, {"name": "Marco Pezzutto"}, {"name": "Valentin Savin"}, {"name": "Tristan Meunier"}, {"name": "Yasser Omar"}], "featured_authors": [{"name": "João Santos"}, {"name": "Jayshankar Nath"}, {"name": "Marco Pezzutto"}, {"name": "Valentin Savin"}, {"name": "Tristan Meunier"}, {"name": "Yasser Omar"}], "author_count": 6}, {"id": "2610.22223", "category": "quant-ph", "title": "Constrained dissipation and the lifetime of quantum many-body scars", "abstract": "We investigate the fate of quantum many-body scars in the PXP model subject to Markovian dissipation. We show that when local jump operators respect the same symmetries of the Hamiltonian the full Liouvillian spectrum displays a tower of states with properties analogous to standard quantum scars: large overlaps with Néel states and equally spaced gaps in the imaginary part of the eigenvalues, set by a single frequency. Whether the long-time dynamics is dominated by scars is determined by the real parts of the eigenvalues, which are set by the ratio between the two relaxation rates $\\gamma_{\\pm}$ describing spin flips down-to-up or up-to-down respectively. For asymmetric dissipation ($\\gamma_+ > \\gamma_-$) the scarred eigenvalues have the smallest real parts: the resulting enhanced fidelity oscillations are further stabilized by staggered jump operators. In contrast, replacing the full projection operator in the dissipators with a partial one breaks the symmetries of the problem and is seen to destroy dissipative scars altogether.", "url": "https://arxiv.org/abs/2610.22223", "type": "理论", "summary": "我们研究了 PXP 模型中受马尔可夫耗散影响的量子多体疤痕的命运。我们证明，当局部跳跃算子遵循哈密顿量的相同对称性时，完整的刘维尔谱显示出具有类似于标准量子疤痕属性的状态塔：与尼尔状态的大量重叠以及由单个频率设置的特征值虚部中的等间隔间隙。长期动态是否由疤痕主导取决于特征值的实部，特征值由分别描述自旋翻转从下到上或从上到下的两个弛豫率 $\\gamma_{\\pm}$ 之间的比率设置。对于不对称耗散 ($\\gamma_+ > \\gamma_-$)，伤痕特征值具有最小的实部：交错跳跃算子进一步稳定了所产生的增强保真度振荡。相比之下，用部分投影算子替换耗散器中的完整投影算子会破坏问题的对称性，并且可以完全消除耗散疤痕。", "authors": [{"name": "Weyner Ccuiro"}, {"name": "Rosario Fazio"}, {"name": "Alessandro Silva"}], "featured_authors": [{"name": "Weyner Ccuiro"}, {"name": "Rosario Fazio"}, {"name": "Alessandro Silva"}], "author_count": 3}, {"id": "2610.22275", "category": "quant-ph", "title": "SynDebug: A Framework to Debug Logic Bugs in Fault-Tolerant Quantum Computing Programs", "abstract": "Fault-tolerant quantum computing (FTQC) introduces substantial systems-level complexity through quantum error correction (QEC), making debugging FTQC programs challenging. Existing quantum debugging approaches primarily target logical-level circuits and do not naturally support debugging within realistic FTQC execution flows. We present SynDebug, the first systems-level debugging framework for FTQC programs. SynDebug introduces lightweight assertion-based debugging primitives that operate directly within encoded FTQC infrastructures while avoiding additional logical surface area and minimizing temporal overhead. We evaluate SynDebug across multiple QEC code families, code distances, and encoded workloads, including state preparation, entanglement validation, and Shor-style programs. Our results demonstrate that SynDebug enables practical FTQC debugging with an average 1.8% additional circuit depth overhead (0% in most cases) and no measurable increase in the logical error rate, showing that systems-level debugging for large-scale FTQC applications is both feasible and practical.", "url": "https://arxiv.org/abs/2610.22275", "type": "理论+数值", "summary": "容错量子计算 (FTQC) 通过量子纠错 (QEC) 引入了大量的系统级复杂性，使得调试 FTQC 程序变得具有挑战性。现有的量子调试方法主要针对逻辑级电路，自然不支持实际 FTQC 执行流程中的调试。我们推出 SynDebug，这是第一个用于 FTQC 程序的系统级调试框架。 SynDebug 引入了基于断言的轻量级调试原语，这些原语直接在编码的 FTQC 基础设施内运行，同时避免了额外的逻辑表面积并最大限度地减少了时间开销。我们跨多个 QEC 代码系列、代码距离和编码工作负载评估 SynDebug，包括状态准备、纠缠验证和 Shor 风格程序。我们的结果表明，SynDebug 能够实现实际的 FTQC 调试，平均增加 1.8% 的电路深度开销（大多数情况下为 0%），并且逻辑错误率没有明显增加，这表明大规模 FTQC 应用的系统级调试既可行又实用。", "authors": [{"name": "Nicholas S. DiBrita"}, {"name": "Jack Lange"}, {"name": "Tirthak Patel"}], "featured_authors": [{"name": "Nicholas S. DiBrita"}, {"name": "Jack Lange"}, {"name": "Tirthak Patel"}], "author_count": 3}, {"id": "2610.22308", "category": "quant-ph", "title": "Classical Capacity of Single-Mode Bosonic Gaussian Channels", "abstract": "The classical capacity of a noisy optical channel is the maximum rate at which information can be transmitted reliably, given a constraint on the mean input energy. For the ubiquitous bosonic Gaussian channels, which include standard models of loss and noise in fibre and free-space optical links, determining this rate requires addressing whether entanglement between channel uses or non-Gaussian signals can outperform Gaussian encodings. More precisely, the question is whether the energy-constrained Holevo information is additive across arbitrarily many channel uses and coincides with its Gaussian counterpart. We answer these fundamental questions in the affirmative for every single-mode bosonic Gaussian channel at every input energy. Namely, we prove that independently prepared Gaussian states with Gaussian-distributed random displacements achieve the capacity, including in the low-energy regime where squeezing the signals competes with encoding information in their displacement. Our proof connects an entanglement inequality to a sharp, additive lower bound on output entropy. We then characterise communication above capacity: under a strict total photon-number cutoff, the probability of correct decoding decreases exponentially with the number of channel uses, and we derive explicit bounds on the decay exponent. When only the mean photon number is constrained, a simple energy-rescaling formula determines exactly the entire asymptotic rate--error trade-off: the capacity at mean photon number $N$ and allowed average decoding error $\\epsilon$ equals the vanishing-error capacity at mean photon number $N/(1-\\epsilon)$. Together, these results identify the ultimate limits of classical communication for some of the most fundamental models of optical communication.", "url": "https://arxiv.org/abs/2610.22308", "type": "理论", "summary": "噪声光通道的经典容量是在平均输入能量受到限制的情况下可靠传输信息的最大速率。对于无处不在的玻色高斯信道（包括光纤和自由空间光链路中的损耗和噪声的标准模型），确定该速率需要解决信道使用或非高斯信号之间的纠缠是否可以优于高斯编码。更准确地说，问题是能量受限的 Holevo 信息是否可以在任意多个通道使用中相加，并与其对应的高斯信息一致。对于每个输入能量的每个单模玻色高斯通道，我们对这些基本问题的回答是肯定的。也就是说，我们证明了具有高斯分布随机位移的独立准备的高斯态达到了这种能力，包括在低能量状态下，压缩信号与位移中的编码信息竞争。我们的证明将纠缠不等式与输出熵的尖锐的加性下界联系起来。\n\n然后，我们描述了上述容量上的通信：在严格的总光子数截止下，正确解码的概率随着通道使用的数量呈指数下降，并且我们得出了衰减指数的明确界限。当仅限制平均光子数时，一个简单的能量重新缩放公式可以精确确定整个渐近率-误差权衡：平均光子数 $N$ 处的容量和允许的平均解码误差 $\\epsilon$ 等于平均光子数 $N/(1-\\epsilon)$ 处的消失误差容量。这些结果共同确定了一些最基本的光通信模型的经典通信的最终极限。", "authors": [{"name": "Gerardo Adesso"}, {"name": "Ludovico Lami"}, {"name": "Vittorio Giovannetti"}], "featured_authors": [{"name": "Gerardo Adesso"}, {"name": "Ludovico Lami"}, {"name": "Vittorio Giovannetti"}], "author_count": 3}, {"id": "2610.22357", "category": "quant-ph", "title": "Stability of Quantum LDPC States under Local Pauli Noise", "abstract": "Quantum low-density parity-check (qLDPC) codes have a canonical mixed state---the normalized projector onto the code space---that lies at the intersection of quantum error correction and quantum many-body physics, yet the stability of its information-theoretic structure under local noise remains poorly understood. Recent progress on mixed-state phases of matter has identified the spatial decay of conditional mutual information (CMI) $I(A:C|B)$ as a key diagnostic of such stability, analogous to the role of the spectral gap for quantum ground states. We prove that, for the normalized code-projector state of a $\\mathbb{Z}_d$ qLDPC stabilizer code under local Pauli noise, the CMI across a buffer $B$ separating $A$ from $C$ decays exponentially with the width of $B$ in two complementary noise regimes independent of system size. At weak n
