  <script>
    const papers = [{"id": "2609.05447", "category": "cond-mat", "title": "Superdiffusive two-dimensional superconductors", "abstract": "We formulate a non-local, field-theoretic description of phase fluctuations and topological transitions in two-dimensional (2D) superconductors by generalizing the local only-phase Popov action to a framework utilizing non-local fractional operators. By replacing the standard spatial Laplacian with the Riesz fractional Laplacian $-(-\\nabla^2)^{\\alpha/2}$ (where $1<\\alpha<2$), we prove that the vortex-antivortex interaction transitions from logarithmic confinement to a stronger power-law confinement of the form $V(r)\\propto r^{2-\\alpha}$. Through a generalized Kosterlitz-Thouless energetic-entropic analysis, we demonstrate that this non-local confinement strictly suppresses thermal vortex proliferation. Because the non-local operator safely places the system outside the strict domain of validity of the Mermin-Wagner restriction, this power-law confinement natively stabilizes true long-range order at finite temperatures. Finally, by constructing a gauge-invariant fractional action, we formulate a fractional London equation. This approach yields a real-space power-law kernel that maps directly onto the anomalous Pippard limit of superconductors with long coherence lengths, providing a unified phenomenologically motivated framework for non-local electrodynamics.", "url": "https://arxiv.org/abs/2609.05447", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "featured_authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "author_count": 2}, {"id": "2609.05477", "category": "cond-mat", "title": "The prey-predator motion of the active droplets", "abstract": "We present a generic solution for the relative motion of two diffusiophoretic prey-predator particles of arbitrary chemical activity Ai and radius Ri, where i = 1;2 refers to the predator and prey, respectively. Using the Lorentz reciprocal theorem, we investigate the impact of radius ratios and chemical reaction rates on the interaction between the particles. Our study reveals four distinct regimes of interaction, similar to the findings of Nasouri & Ramin (Phys. Rev. Lett., vol. 124, 2020, pp. 168003) for particles of identical sizes: (i) the prey particle escapes; (ii) two particles reach a stable equilibrium distance; (iii) two particles reach an unstable equilibrium distance where the prey is captured below it and escapes above it; (iv) the prey particle is captured. Unlike previous work, we differentiate between regimes with near-field and far-field interactions, which can be either attractive or repulsive, and find that the boundary between (i, iii) and (ii, iv) represents the transition from the attraction to repulsion in the far field, given by jA1=A2j = (R2=R1)2, while the transition between (i, ii) and (iii, iv) represents the interaction transition for particles in close proximity. We also perform three-dimensional simulations of prey-predator systems, which validate our theoretical predictions. Our study extends the applicability of the Lorentz reciprocal theorem to prey-predator system and quantitatively obtains interaction regime transition curves by distinguishing near-field and far-field interactions.", "url": "https://arxiv.org/abs/2609.05477", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yibo Chen"}, {"name": "Kai Leong Chong"}, {"name": "Roberto Verziccoa"}, {"name": "Detlef Lohse"}], "featured_authors": [{"name": "Yibo Chen"}, {"name": "Kai Leong Chong"}, {"name": "Roberto Verziccoa"}, {"name": "Detlef Lohse"}], "author_count": 4}, {"id": "2609.05482", "category": "cond-mat", "title": "A Heterogeneous General Model for Neuromorphic-Inspired Computation", "abstract": "In recent years, both academia and industry have focused on the development of computational architectures inspired by the distributed, adaptive, and event-driven characteristics of biological neural systems, with the aim of reducing the computational cost associated with conventional training approaches [1]. However, a major challenge is the lack of general models and design guidelines for emerging computational systems and hardware. This work introduces a general model based on an input-dependent stochastic weight network, referred to as a substrate. The substrate weights evolve through input-triggered stochastic updates, with correlations between weight coefficients described by a matrix-valued covariance kernel. The proposed framework is implemented using quadratic polynomial weight functions, where the input amplitude controls the magnitude of the stochastic perturbation and a substrate-dependent distance determines the correlation structure. Numerical simulations show that correlations in the stochastic weight evolution significantly affect the system response, suggesting a potential mechanism for neuromorphic-inspired computation without conventional weight training. The aim of this work is to provide a general formulation of the model and identify its main properties and characteristics. 1 H. Jaeger, Towards a generalized theory comprising digital, neuromorphic and unconventional computing, Neuromorphic Comput. Eng., vol. 1, no. 1, p. 012002, Sep. 2021", "url": "https://arxiv.org/abs/2609.05482", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matteo Mirigliano"}], "featured_authors": [{"name": "Matteo Mirigliano"}], "author_count": 1}, {"id": "2609.05486", "category": "cond-mat", "title": "Tilt control of coverage heterogeneity for hard spherocylinders locked on a sphere", "abstract": "We study hard spherocylinders on a sphere with axes rigidly locked to a tangential director field at fixed angle $\\tilt$ to the meridian, necessarily singular at the poles. Three lengths set the problem: the rod length $\\Lrod$, the diameter $\\Drod$, and the host radius $\\Rsph$. Monte Carlo simulations across fifteen geometries and four coverages give two main results for the polar marginal, the azimuthal average of rod-center density. First, the tilt is a continuous handle on the width of the depleted region that packing induces around each singularity. Under meridian locking it is set principally by the rod length; turning the director toward the latitude contracts it substantially, the contraction being spent well before latitude locking. Second, how uniform the polar marginal can be made is limited by geometry, not tilt. The smallest variance on the sampled grid follows a power law in $\\Lrod^{2}/(\\Rsph\\Drod)$, which measures how far a straight rod's ends stand off the curved surface in rod diameters, with an effective exponent between $1.1$ and $1.3$. Long rods on small hosts cannot be made uniform at any sampled tilt; the remedy is geometric, not orientational. The polar marginal is equator-heavy almost everywhere, inverting only at high coverage and tilt; meridian locking is the least uniform choice, and the variance-minimizing tilt usually lies in a sampled band from $31.7^{\\circ}$ to $55^{\\circ}$. The golden-ratio tilt $\\arctan(1/\\phigold)$ is one of those angles: a benchmark, not one the model selects. Both results describe the infinitely locked athermal ensemble.", "url": "https://arxiv.org/abs/2609.05486", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jonathan Washburn"}, {"name": "Hartmut Löwen"}, {"name": "Elshad Allahyarov"}], "featured_authors": [{"name": "Jonathan Washburn"}, {"name": "Hartmut Löwen"}, {"name": "Elshad Allahyarov"}], "author_count": 3}, {"id": "2609.05502", "category": "cond-mat", "title": "A dual network approach to connect structure and flow in random networks", "abstract": "Flows in random networks are known to exhibit heavy-tailed statistics, giving rise to anomalous transport in a range of biological, environmental and engineered systems. Yet, how structure determines flow remains an open question. Here we derive a dual network approach that relates flow statistics and network properties. Conditional statistics in a range of networks reveal the existence of two interlaced subnetworks with distinct hydraulic behaviors. Based on this hidden structure, we derive a universal analytical approach that predicts heavy-tailed flow statistics based on network topology and disorder distribution across a range of random networks.", "url": "https://arxiv.org/abs/2609.05502", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Marco Dentz"}, {"name": "Philippe Gouze"}, {"name": "Tanguy le Borgne"}, {"name": "Alexandre Puyguiraud"}], "featured_authors": [{"name": "Marco Dentz"}, {"name": "Philippe Gouze"}, {"name": "Tanguy le Borgne"}, {"name": "Alexandre Puyguiraud"}], "author_count": 4}, {"id": "2609.05556", "category": "cond-mat", "title": "Kibble-Zurek Dynamics in Two-dimensional Frustrated Systems with a Neural Foundation-state Subspace Method", "abstract": "Universal scaling generated when a strongly interacting quantum many-body system is driven across a continuous phase transition provides a dynamical probe of equilibrium criticality. Accessing this regime numerically in two dimensions is challenging because it requires accurate real-time evolution of correlated many-body states over many system sizes and driving rates. We introduce a Neural Foundation-state Subspace (NFS) method for near-adiabatic dynamics. A foundation neural-network quantum state represents the ground-state manifold along the driving path, and a small fidelity-selected subset defines a fixed variational subspace. The many-body Schrödinger equation then reduces to the evolution of a few linear coefficients, with projected operators reusable across ramp times. We validate the method on the two-dimensional transverse-field Ising model, recovering the expected Kibble-Zurek scaling and critical exponents in quantitative agreement with ground-state quantum Monte Carlo estimates. Applied to the frustrated square-lattice $J_1$-$J_2$ Heisenberg model up to $16 \\times 16$ clusters, our approach provides strong numerical evidence of Kibble-Zurek mechanism across the Néel-to-spin-liquid transition at $J_2/J_1=0.49$, yielding ${\\nu=1.23(15)}$ and ${\\eta=0.409(19)}$ at fixed $z=1$, consistent with static estimates and supporting the proposed continuous critical behavior.", "url": "https://arxiv.org/abs/2609.05556", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Linda Mauron"}, {"name": "Luciano Loris Viteritti"}, {"name": "Zakari Denis"}, {"name": "Riccardo Rende"}, {"name": "Giuseppe Carleo"}], "featured_authors": [{"name": "Linda Mauron"}, {"name": "Luciano Loris Viteritti"}, {"name": "Zakari Denis"}, {"name": "Riccardo Rende"}, {"name": "Giuseppe Carleo"}], "author_count": 5}, {"id": "2609.05603", "category": "cond-mat", "title": "Pair density wave order from non-symmorphic momentum symmetry", "abstract": "We develop a class of microscopic lattice models in which pair density wave order emerges in the asymptotically exact weak coupling limit. The underlying mechanism is due to non-symmorphic momentum symmetry implied by the models' projective space group representation of electrons. Our mechanism suggests moiré systems and extended s-wave altermagnets as potential hosts for pair density wave order.", "url": "https://arxiv.org/abs/2609.05603", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matteo Dürrnagel"}, {"name": "C. Alexander Baum"}, {"name": "Michael Klett"}, {"name": "Lennart Klebl"}, {"name": "Ronny Thomale"}], "featured_authors": [{"name": "Matteo Dürrnagel"}, {"name": "C. Alexander Baum"}, {"name": "Michael Klett"}, {"name": "Lennart Klebl"}, {"name": "Ronny Thomale"}], "author_count": 5}, {"id": "2609.05634", "category": "cond-mat", "title": "Fast universal parametric spin control in an acoustically modulated quantum dot", "abstract": "Quantum communication, distributed computing, and hybrid architectures rely on nodes enabling coherent control of qubits and coupling to propagating quantum modes. While semiconductor quantum-dot (QD) spins couple to microwave and optical photons, weak interaction with mechanical waves has limited the integration of single-QD spin qubits into on-chip, acoustically coupled hybrid systems. The existing theory of acoustic QD spin control suffers from a limited range of rotation-axis angles, enforcing complex realizations of gate primitives and long gate times, leaving little margin against decoherence from trion decay and quasi-static nuclear-spin noise. We propose parametric control that overcomes these problems. We use far-detuned optical coupling to a trion state to dress and thus mix spin states, combined with acoustic modulation of the optical transition energy. Instead of relying on direct acoustic resonance with the spin splitting that leads to significant bottlenecks, we induce spin rotations parametrically via resonance with the dressed-spin splitting. We thus develop a spin analog of the ``swing-up'' charge-state excitation. Our scheme provides fast universal qubit control with nearly arbitrary rotation axes. Our ${\\sim}$155 ps Pauli-$X$ gate duration is ${\\sim}290\\times$ faster than in the previous acousto-optical formulation and ${\\sim}14\\times$ faster than optical Faraday-geometry spin rotation. The parametric scheme naturally enables higher-harmonic processes. Numerical simulations for ${\\sim}44$ GHz acoustic driving show average gate fidelity $\\ge99.9\\%$ even for uncooled nuclear-spin environments of GaAs and InAs QDs for trion lifetime $\\gtrsim1.25$ ns. These metrics suggest practically usable control and may introduce a spin-phonon interface with high interaction rates, versatility, and multi-phonon processes, essential for future acoustically coupled hybrid architectures.", "url": "https://arxiv.org/abs/2609.05634", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mateusz Kuniej"}, {"name": "Michał Gawełczyk"}], "featured_authors": [{"name": "Mateusz Kuniej"}, {"name": "Michał Gawełczyk"}], "author_count": 2}, {"id": "2609.05646", "category": "cond-mat", "title": "Gauge-covariant magnetic Bloch sums for general multiorbital Hofstadter models", "abstract": "We formulate a unified treatment of the Hofstadter problem for general two-dimensional multiorbital Peierls tight-binding Hamiltonians using a gauge-covariant magnetic Bloch-sum basis. The construction retains the full Bravais geometry, arbitrary intracell orbital positions, and the original hopping table, so lattice geometry, orbital embedding, hopping range, and orbital content can all be handled within the same framework. At rational flux $\\Phi/\\Phi_0=p/q$, commuting magnetic translations reduce the Peierls Hamiltonian to minimal $qN_{\\rm orb}\\times qN_{\\rm orb}$ blocks. Their dimension depends only on the flux through the primitive cell, even when the fractional orbital coordinates are irrational. Electromagnetic gauge transformations act by unitary conjugation within the construction and do not alter the required magnetic supercell. We derive an explicit sparse matrix in an oblique Landau gauge and establish the associated band counting, spectral redundancy, Chern-number formulation, magnetic spatial constraints, and flux periodicity. Numerical examples include elementary lattices, topological and flat-band models, and a spinful 22-band Wannier Hamiltonian of monolayer $\\mathrm{MoS}_2$, demonstrating a direct interface with first-principles electronic-structure calculations. As a complementary representation, we also derive exact generalized Harper equations from the same hopping data and relate them to the finite magnetic-Bloch blocks.", "url": "https://arxiv.org/abs/2609.05646", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hao Shi"}, {"name": "Tianyu Qiao"}, {"name": "Wangqian Miao"}, {"name": "Jin-Tao Jin"}, {"name": "Quansheng Wu"}, {"name": "Xi Dai"}], "featured_authors": [{"name": "Hao Shi"}, {"name": "Tianyu Qiao"}, {"name": "Wangqian Miao"}, {"name": "Jin-Tao Jin"}, {"name": "Quansheng Wu"}, {"name": "Xi Dai"}], "author_count": 6}, {"id": "2609.05649", "category": "cond-mat", "title": "Distribution of currents in a system of active particles with biased hops and Ising interactions", "abstract": "We consider an ensemble of particles performing a biased random walk on a two-dimensional lattice. Due to the adhesion between particles (nearest-neighbor Ising interactions), the probability of hopping depends on the number of neighbors and the strength of adhesive interaction. The asymmetry in the hopping directions leads to a macroscopic current of particles through the system. We theoretically compute the distribution of currents and verify the results in stochastic particle simulations. To make theoretical progress, one has to determine the probabilities of various particle configurations such as single particles, pairs, and different configurations of three-particle clusters. These probabilities are theoretically derived by formulating rate equations for the concentrations of various structures resembling Becker-Döring cluster equations. One intriguing finding is that the concentration of left-handed triplets is not equal to the concentration of right-handed triplets for non-zero asymmetry of hops and non-zero interaction between particles.", "url": "https://arxiv.org/abs/2609.05649", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Evgeniy Khain"}, {"name": "Shriram Ramesh"}, {"name": "Vladimir Chernyak"}], "featured_authors": [{"name": "Evgeniy Khain"}, {"name": "Shriram Ramesh"}, {"name": "Vladimir Chernyak"}], "author_count": 3}, {"id": "2609.05691", "category": "cond-mat", "title": "Hidden amplitude and dynamical information in phase-separation spectra", "abstract": "Framewise variance normalization removes fluctuation amplitude from an observation, but not from the dynamics that generate later patterns. The current normalized spectrum therefore need not determine its own future. We study this effect in three two-dimensional phase-separation models that change transport, add active driving, or suppress large-scale separation. For paired initial fields, their normalized spectra evolve identically in the linear regime. The restoring model provides an exact example: damping does not directly change how the normalized spectrum evolves when both equations are applied to the same field. It nevertheless changes the hidden amplitude, which alters the later nonlinear shape. An exact comparison separates the immediate effect of changing the equation from the effect of reaching a different state through earlier evolution. It also reveals strong cancellation between these effects in the mobility and active models. As a practical test, spectral histories improve classification by about 4-6 percentage points at several later observation windows, although the gain depends on quench depth and spectral construction. Temporal spectra can therefore reveal dynamical consequences of information absent from every individual normalized frame.", "url": "https://arxiv.org/abs/2609.05691", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Boliang Yu"}, {"name": "Ruixin Zhou"}, {"name": "Jiaxing Yuan"}], "featured_authors": [{"name": "Boliang Yu"}, {"name": "Ruixin Zhou"}, {"name": "Jiaxing Yuan"}], "author_count": 3}, {"id": "2609.05696", "category": "cond-mat", "title": "Bridging simulation length scales with cellular automata", "abstract": "Multiscale simulation requires coupling physics models that operate at different characteristic length and time scales, because no single method spans the range needed for most problems of interest. Moving to a coarser-grained representation unlocks longer length and time scales, but it discards the microscopic interactions that build morphology. A fine-grained model can be initialized from an arbitrary packing and left to self-assemble into a physically meaningful structure; a lower-resolution model cannot, and must inherit its starting configuration from a higher-fidelity simulation. The length scales accessible to the coarse-grained model are therefore set not by the coarse-grained method itself, but by the largest fine-grained configuration that can be affordably equilibrated. A representative example is the scale-up from particle-based molecular dynamics (MD) to a lattice-based representation such as kinetic Monte Carlo (kMC). In this work, we present a cellular automata (CA) approach for generating arbitrarily large lattice starting configurations. CA is a natural fit for this task: short-ranged local rules drive the evolution of a lattice, and their repeated application gives rise to emergent long-range order, thematically mirroring how short-ranged interactions in MD produce self-assembled morphology. We use a configuration from a higher-fidelity simulation as a training set and learn the CA rules from it via logistic regression. As a proof of principle, we develop these rules for a hydrated anion exchange membrane (AEM), generate new starting configurations, and benchmark their performance in mesoscale kMC simulations against an MD-derived \"ground truth.\" We then demonstrate the ability to generate substantially larger lattices and show that their behavior in kMC is consistent with that of the smaller CA benchmark configurations.", "url": "https://arxiv.org/abs/2609.05696", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "John J. Karnes"}, {"name": "Esteban D. Gadea"}, {"name": "Shakkira Erimban"}, {"name": "Ignacio J. Bombau"}, {"name": "Valeria Molinero"}], "featured_authors": [{"name": "John J. Karnes"}, {"name": "Esteban D. Gadea"}, {"name": "Shakkira Erimban"}, {"name": "Ignacio J. Bombau"}, {"name": "Valeria Molinero"}], "author_count": 5}, {"id": "2609.05699", "category": "cond-mat", "title": "Generating quantum error correcting codes from topological pre-thermal scars", "abstract": "Quantum many-body scars are rare nonthermal states embedded within otherwise thermalizing spectra, making them promising candidates for storing and manipulating quantum information. However, a general framework that can both identify such states without prior knowledge of their microscopic scarring mechanism and determine when they enable a quantum error correcting code has remained elusive. Here, we develop an end-to-end framework connecting nonthermal-state discovery to certifiable quantum error correction using a many-body spectral localizer. By searching for states jointly localized in energy and a diagnostic observable in systems with a many-body grading symmetry, the spectral localizer identifies candidate scars within dense many-body spectra in tandem with a topological index whose shifts determine their graded subspace. For suitable pairs of same-graded scars, the grading renders grading-odd errors exactly detectable, while their localization can suppress the logical action of sufficiently local grading-even error products, yielding an approximate Knill--Laflamme condition and an operator-algebra quantum error-correction structure. We demonstrate the scar-identification framework in one- and two-dimensional density-difference-dependent bosonic models and in the PXP model, and explicitly construct the resulting approximate quantum code in the one-dimensional bosonic system. Our results establish a systematic route from identifying nonthermal many-body states to exploiting them for protecting quantum information, and position pseudospectral methods as a broadly applicable tool for discovering useful behaviors in interacting quantum systems.", "url": "https://arxiv.org/abs/2609.05699", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "William N. Faugno"}, {"name": "Frank Barrows"}, {"name": "Terry A. Loring"}, {"name": "Nathan Goldman"}, {"name": "Alexander Cerjan"}], "featured_authors": [{"name": "William N. Faugno"}, {"name": "Frank Barrows"}, {"name": "Terry A. Loring"}, {"name": "Nathan Goldman"}, {"name": "Alexander Cerjan"}], "author_count": 5}, {"id": "2609.05714", "category": "cond-mat", "title": "FPBench: Application-Oriented Error Decomposition for Foundation Potentials", "abstract": "Foundation potentials (FPs) have emerged as a new basis for atomistic modeling. While their evaluation using average energy and force errors often indicates near-DFT accuracy, their performance in practical computational studies remains inconsistent. Here, we present FPBench, an application-oriented benchmark that evaluates FPs on representative computational tasks. Multiple state-of-the-art FPs are assessed on three fundamental tasks: force prediction for atomistic simulations, energy ranking for substitutional and vacancy orderings, and ion/vacancy migration. Benchmarking these FPs shows that average force and energy errors often fail to predict task performance, revealing substantial differences in practical reliability. FPBench introduces application-oriented error decomposition through metrics that resolve performance according to the physically consequential quantities and configurations governing computational tasks, including the fractions of highly accurate and large-force-error atoms, far-from-equilibrium atoms, relative phase-stability and convex-hull agreement, and along-path errors in ion migration. These error-decomposition metrics identify where FP errors arise within specific computational tasks, providing targeted guidance for model development. FPBench provides an open benchmark, evaluation code, and a public leaderboard for rigorous FP assessment and development.", "url": "https://arxiv.org/abs/2609.05714", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kiyan Amirian"}, {"name": "Ramanuja Srinivasan Saravanan"}, {"name": "Felix Adams"}, {"name": "Charles E Schwarz"}, {"name": "Yifei Mo"}], "featured_authors": [{"name": "Kiyan Amirian"}, {"name": "Ramanuja Srinivasan Saravanan"}, {"name": "Felix Adams"}, {"name": "Charles E Schwarz"}, {"name": "Yifei Mo"}], "author_count": 5}, {"id": "2609.05747", "category": "cond-mat", "title": "Ultrafast electron crystallography reveals the atomic pathway of a light-driven correlated insulator-to-metal transition", "abstract": "Ultrafast phase transitions in correlated materials are often inferred from selected diffraction peak intensities or diffraction peak displacements, leaving the underlying three-dimensional atomic trajectories elusive. Resolving these trajectories is essential for identifying which atomic motions drive changes in electronic properties and how they couple to electronic degrees of freedom. We address this challenge in vanadium dioxide (VO2), a correlated oxide with a near-room-temperature transition between the insulating monoclinic (M1) phase and metallic rutile (R) phase. For this purpose, we introduce ultrafast three-dimensional electron diffraction, which enables refinement of the transient unit cell and internal V and O coordinates, revealing the V-V dimerization and zigzag motion during the phase transition. The refined atomic coordinates follow a linear trajectory in real space during the transition, in contrast to nonlinear or sequential transformation pathways inferred from more indirect observables in earlier work. Quantum many-body calculations treating each V-V pair as a correlated unit show that dimerization creates the level splitting responsible for the electronic gap, which is further enhanced by nonlocal electronic interactions between the paired V atoms. The gap collapses when dimerization is lost. This work turns time-resolved diffraction from order-parameter tracking into transient crystallography, directly connecting atomic trajectories to electronic mechanisms in correlated materials.", "url": "https://arxiv.org/abs/2609.05747", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arthur Niedermayr"}, {"name": "Hongyi Xu"}, {"name": "Chin Shen Ong"}, {"name": "Patrik Thunström"}, {"name": "Michael Yannai"}, {"name": "Jianyu Wu"}, {"name": "Gaolong Cao"}, {"name": "Lior Kornblum"}, {"name": "Ido Kaminer"}, {"name": "Oscar Grånäs"}, {"name": "Xiaodong Zou"}, {"name": "Jonas Weissenrieder"}], "featured_authors": [{"name": "Arthur Niedermayr"}, {"name": "Hongyi Xu"}, {"name": "Chin Shen Ong"}, {"name": "Oscar Grånäs"}, {"name": "Xiaodong Zou"}, {"name": "Jonas Weissenrieder"}], "author_count": 12}, {"id": "2609.05875", "category": "cond-mat", "title": "Extended strange metal regime in a pure nematic quantum critical superconductor", "abstract": "High-temperature superconductivity often emerges from a strange metallic state, where the electrical resistivity exhibits a linear-in-temperature dependence over an anomalously extended temperature range. The prevailing belief is that magnetic critical fluctuations gives rise to strange metallicity, enhancing the superconducting transition temperature. Here, using high pulsed magnetic fields, we have uncovered the strange metallic ground state hidden below the superconducting dome of nonmagnetic FeSe$_{1-x}$Te$_{x}$, which harbors a quantum critical point (QCP) of pure electronic nematicity, characterized by spontaneous rotational symmetry breaking. Unlike the conventional quantum criticality, this strange metallic state does not appear in a fan-shaped region above the singular QCP but spans a wide compositional range, where pairing interactions are strengthened by nonmagnetic nematic critical fluctuations. This stands in sharp contrast to the much cleaner system FeSe$_{1-x}$S$_{x}$, which displays a quantum critical fan above nematic QCP, indicating that disorder-induced spatial randomness of the nematic fluctuations likely enlarges the QCP of FeSe$_{1-x}$Te$_{x}$ into an extended region of criticality, as suggested by relevant hybrid Quantum Monte Carlo simulations. These observations highlight superconductivity promoted by a unique interplay between pure nematic critical fluctuations, strange metallicity and disorder, providing new insight into the emergence of non-Fermi-liquid transport in various correlated materials.", "url": "https://arxiv.org/abs/2609.05875", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kousuke Ishida"}, {"name": "Kiyotaka Mukasa"}, {"name": "Shusaku Imajo"}, {"name": "Andrew Hardy"}, {"name": "Mingwei Qiu"}, {"name": "Mikihiko Saito"}, {"name": "Aavishkar A. Patel"}, {"name": "Kohei Matsuura"}, {"name": "Yuichi Sugimura"}, {"name": "Yu Uezono"}, {"name": "Takumi Otsuka"}, {"name": "Nigel E. Hussey"}, {"name": "Takao Watanabe"}, {"name": "Koichi Kindo"}, {"name": "Takasada Shibauchi"}], "featured_authors": [{"name": "Kousuke Ishida"}, {"name": "Kiyotaka Mukasa"}, {"name": "Shusaku Imajo"}, {"name": "Takao Watanabe"}, {"name": "Koichi Kindo"}, {"name": "Takasada Shibauchi"}], "author_count": 15}, {"id": "2609.05878", "category": "cond-mat", "title": "Foundations of Many-Body Theory of Quantum Unified Statistics: Green functions and Linear Response Theory", "abstract": "We develop a comprehensive many-body theory for systems of particles obeying quantum unified statistics, or quons. After exploring the properties of the Fock space of this system, we formulate a systematic S-matrix expansion and a generalized Wick's theorem. A consistent Green-function formalism is constructed at both zero and finite temperatures, accompanied by a generalized Wick's theorem appropriate for infinite-statistics operator algebras. Within this framework, we establish diagrammatic rules for interacting quon systems. Employing the random phase approximation, we derive the dielectric function and reveal the emergence of anomalous plasmon modes that have no direct counterpart in conventional Bose or Fermi systems. We further analyze the ground-state energy, energy-loss function, generalized Thomas-Fermi screening wave vectors, and Friedel oscillations, elucidating how infinite statistics qualitatively modifies collective behavior and screening properties.", "url": "https://arxiv.org/abs/2609.05878", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "M. Beyrami"}, {"name": "M. N. Najafi"}, {"name": "H. Esmaili"}, {"name": "M. Dournama"}, {"name": "H. Mohammadzadeh"}], "featured_authors": [{"name": "M. Beyrami"}, {"name": "M. N. Najafi"}, {"name": "H. Esmaili"}, {"name": "M. Dournama"}, {"name": "H. Mohammadzadeh"}], "author_count": 5}, {"id": "2609.05969", "category": "cond-mat", "title": "The electromagnetic stress tensor in cubic crystals and amorphous solids", "abstract": "The electromagnetic vacuum stress tensor in a system consisting of classical point-like atoms on a cubic lattice is derived directly from the electric field and, alternatively, using the known more phenomenological formula involving the (usually unknown) derivative of the dielectric tensor. The results agree. The stress tensor contains a nontrivial constant and therefore cannot be obtained from macroscopic electrodynamics alone. A system consisting of a mosaic of randomly oriented grains of a cubic crystal is used as a model of an amorphous solid. The electromagnetic stress tensor in this system is deduced by averaging the corresponding quantity in a cubic crystal over all orientations. Two components remain: the component in the direction of the electric field and the component perpendicular to it. The transverse component agrees with the analogous quantity for liquids derived by Peierls in an entirely different way.", "url": "https://arxiv.org/abs/2609.05969", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Richard Dengler"}], "featured_authors": [{"name": "Richard Dengler"}], "author_count": 1}, {"id": "2609.05971", "category": "cond-mat", "title": "Reusable Operators for Irreducible Cartesian Tensor Decomposition and Coupling", "abstract": "Molecular and material properties, from the polarizability to the elastic constants, are described by tensors. Their behavior under rotations is made explicit when a tensor is decomposed into irreducible parts that transform independently. In Cartesian form these parts are the symmetric and traceless irreducible Cartesian tensors (ICTs), whose decomposition and coupling underlie selection rules, orientational averages, and the use of symmetry. The decomposition is a textbook result at rank two, but higher rank and the intrinsic symmetry of physical tensors make it nontrivial. What has been lacking, unlike in the well-established spherical formalism, is a general construction for a given intrinsic symmetry, together with reusable operators that extract the ICTs and rebuild the original tensor exactly. Here, we develop such a construction and obtain these operators explicitly. These operators depend on rank and symmetry alone, and therefore each need only be built once and then applied to any tensor of that class. Building on them, we further obtain the Cartesian harmonics of a vector and the operators that couple two ICTs into a third, both central to equivariant machine learning. The construction is demonstrated on the elastic tensor, in both its second-order form of rank four and its third-order form of rank six. The ICTs of the rank-4 tensor also define a rotation- and scale-invariant measure of anisotropy, which we evaluate across the first-principles elastic tensors of crystalline materials from the Materials Project. The construction is implemented in the open-source package natto, which produces the operators in both exact symbolic and numerical form.", "url": "https://arxiv.org/abs/2609.05971", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mingjian Wen"}], "featured_authors": [{"name": "Mingjian Wen"}], "author_count": 1}, {"id": "2609.06003", "category": "cond-mat", "title": "Controlling pair dynamics of rotating magnetic microparticles through radial and transverse interactions", "abstract": "Rotating magnetic microparticles are building blocks for field-driven assembly and microrobotic control. As the elementary interaction rule for larger assemblies, pair motion in these systems is governed not only by magnetic forcing, but also by hydrodynamic coupling and other long-range interactions. Here we develop a reduced framework for two synchronized rotating magnetic particles by resolving the interactions into radial components that change the interparticle distance and transverse components that rotate the line of centers. The competition between magnetic dipolar interaction, additional radial repulsion, and rotation-induced transverse coupling selects three pair-motion modes: rigid-body rotation, contact-separation rotation, and irreversible separation. We derive transition criteria for the rigid-body state, reversed orbital motion, and the separation boundary, and obtain an asymptotic solution for the separation dynamics. Lattice Boltzmann simulations of particles rotating near a wall provide a hydrodynamic realization of the model, in which inertial secondary flow generates radial repulsion and rotational flow produces transverse coupling. The resulting phase diagram in the physical $(\\mathrm{Re},C_m)$ plane is consistent with the reduced-model predictions. These results provide design rules for programming elementary pair interactions in rotating magnetic-particle systems and may help guide the control of microrobotic assemblies.", "url": "https://arxiv.org/abs/2609.06003", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dongfang Fu"}, {"name": "Leilei Wang"}, {"name": "Kailai Wang"}, {"name": "Xu Zheng"}, {"name": "Zaiyi Shen"}], "featured_authors": [{"name": "Dongfang Fu"}, {"name": "Leilei Wang"}, {"name": "Kailai Wang"}, {"name": "Xu Zheng"}, {"name": "Zaiyi Shen"}], "author_count": 5}, {"id": "2609.06014", "category": "cond-mat", "title": "Microscopic calculation of coherence lengths and magnetic penetration depth in multiband superconductors", "abstract": "We present an extended Ginzburg-Landau (GL) method for calculating the superconducting coherence length and magnetic penetration depth at temperatures well below the transition temperature $T_{\\mathrm c}$. In contrast to conventional GL theory, which expands the free energy in both the order parameters and their gradients, our method applies a perturbative expansion only to the covariant-gradient terms, while retaining the full dependence on the superconducting order parameters. The coefficients of these terms are determined from finite differences of microscopic free energies evaluated at small imposed pair momenta. The method applies to both single-band and multiband superconductors and therefore provides a framework for incorporating more realistic electronic structures. For the models examined here, the extended GL method agrees well with real-space Bogoliubov-de Gennes (BdG) calculations over a wide temperature range, while requiring substantially less computational effort.", "url": "https://arxiv.org/abs/2609.06014", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tristan Ryoma Fuchs"}, {"name": "Takuya Nomoto"}, {"name": "Hikaru Watanabe"}, {"name": "Ryotaro Arita"}], "featured_authors": [{"name": "Tristan Ryoma Fuchs"}, {"name": "Takuya Nomoto"}, {"name": "Hikaru Watanabe"}, {"name": "Ryotaro Arita"}], "author_count": 4}, {"id": "2609.06028", "category": "cond-mat", "title": "Elucidating Guest-Host Mechanisms in ZIF-L for Tuneable Highly Luminescent 2D Materials", "abstract": "3D metal-organic frameworks (MOFs) are well known effective hosts for luminescent guests that improve tuneability, photostability and material fabricability. 2D guest@MOF systems, while less explored, offer competitive advantages over 3D guest@MOF systems due to their optical transparency, inter-layer spacing, and vertical thinness. This work examines luminescent organic dyes@ZIF-L to establish the underlying mechanisms of guest incorporation in ZIF-L and demonstrate the advantages of the 2D ZIF-L architecture for the material's functional luminescence. Analysing a case study system, fluorescein@ZIF-L (F@ZIF-L), using nanoscale FTIR, diffraction, and topology mapping, confirmed that fluorescein (F) resided in the ZIF-L framework cavities. Supported by surface energy simulations, the extent of guest incorporation was found to be indicated by a morphological continuum, from the characteristic leaf-shaped ZIF-L to rectangular F@ZIF-L. By modifying synthesis temperature and solvent ratios, the luminescent properties of F@ZIF-L could be rationally tuned in terms of guest loading (% mol) and arrangement (i.e. guest monomer to aggregate ratio). When optimised, F@ZIF-L exhibited tuneable emission chromaticity, 99.7% photoluminescent quantum yield, minimal guest leaching in solution over 12 months, and high photostability. Perylene@ZIF-L exhibited unique white light emitting properties, with CIE coordinates (0.33, 0.34) arising from a combination of yellow alpha-phase excimer and blue monomeric perylene emission. Finally, oriented luminescent thin films of guest@ZIF-L materials were grown on malleable Zn foils, demonstrating an in situ fabrication technique. Together, the work highlights the potential for luminescent dye@ZIF-L systems in developing tuneable and resilient luminescent components of next-generation optoelectronics, sensors, and lighting systems.", "url": "https://arxiv.org/abs/2609.06028", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dylan A. Sherman"}, {"name": "Lorenzo Donà"}, {"name": "Cyril Besnard"}, {"name": "Lars Mester"}, {"name": "Ben Slater"}, {"name": "Judit Farrando-Pérez"}, {"name": "Christopher Allen"}, {"name": "Joaquín Silvestre-Albero"}, {"name": "Jin-Chong Tan"}], "featured_authors": [{"name": "Dylan A. Sherman"}, {"name": "Lorenzo Donà"}, {"name": "Cyril Besnard"}, {"name": "Christopher Allen"}, {"name": "Joaquín Silvestre-Albero"}, {"name": "Jin-Chong Tan"}], "author_count": 9}, {"id": "2609.06040", "category": "cond-mat", "title": "One-dimensional quasicrystals with tensor-network finite-state automata", "abstract": "Quasicrystals occupy a distinctive position between the translational order of crystals and the disordered amorphous matter. Simulating this physics has remained challenging, since quasiperiodic structures lack the translational symmetry exploited for crystals and generally require costly diagonalization of large finite approximants. Quasicrystalline order admits two equivalent descriptions, a cut-and-project scheme from a higher-dimensional periodic crystal, and a discrete set of substitution rules acting on a finite alphabet. We show that the latter, written in a numeration system adapted to the substitution, defines a deterministic finite automaton with output, the digits of a site index are fed, and the automaton returns the letter occupying that site. We further exploit another equivalence to a different construction, the transition matrices are exactly the tensors of a matrix product state, whose bond dimension is the number of automaton states and is independent of system size. This allows efficient representation of extremely large tight-binding Hamiltonians in the tensor-train language, thereby yielding an exact matrix product operator for the quasicrystal Hamiltonian at any system size. We show how this framework works for two families of one-dimensional quasicrystals, the metallic-mean and $k$-bonacci families and we explicitly construct the Fibonacci, silver-mean, and Tribonacci quasicrystals. By leveraging efficient tensor-network compression and the kernel polynomial method, we compute spectral densities for chains with more than $10^9$ sites and directly resolve the hierarchical structure of the spectrum.", "url": "https://arxiv.org/abs/2609.06040", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Milla Kolehmainen"}, {"name": "Jose L. Lado"}, {"name": "Anouar Moustaj"}], "featured_authors": [{"name": "Milla Kolehmainen"}, {"name": "Jose L. Lado"}, {"name": "Anouar Moustaj"}], "author_count": 3}, {"id": "2609.06043", "category": "cond-mat", "title": "Momentum-Resolved Electronic Structure for Quasicrystals: Full-Band Spectra and Chern Number", "abstract": "Quasicrystals lack the translational symmetry that underlies Bloch decomposition and Brillouin-zone integration, making full-band momentum-resolved electronic structure difficult to formulate and compute. We develop a systematically convergent reciprocal-space tight-binding framework for a broad class of quasicrystals. The method combines two systematically refinable components: a Fourier-module scattering-channel Hamiltonian that yields local spectral and current-current correlation quantities at each physical momentum, and an expanding hierarchy of pseudo-Brillouin zones that converts the resulting local quantities into bulk thermodynamic observables through an exact local-to-global relation. Applied to the Penrose and Ammann-Beenker models, the framework uncovers full-band momentum-resolved quasibands and a multichannel mechanism for pseudogap formation, both beyond the scope of low-energy effective models. It further resolves Zeeman-driven gap closings and reopenings, quantized Chern plateaus, and the phason invariance of bulk spectral and topological observables. This framework provides a unified reciprocal-space route to full-band spectral and topological properties of quasicrystals.", "url": "https://arxiv.org/abs/2609.06043", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Donglin Yang"}, {"name": "Huajie Chen"}, {"name": "Dexuan Zhou"}, {"name": "Xiaoxu Li"}], "featured_authors": [{"name": "Donglin Yang"}, {"name": "Huajie Chen"}, {"name": "Dexuan Zhou"}, {"name": "Xiaoxu Li"}], "author_count": 4}, {"id": "2609.06081", "category": "cond-mat", "title": "Multiplicity of surface polariton configurations in bi-isotropic media with anomalous Hall current", "abstract": "In this work, we investigate surface polaritons (SPs) arising at the interface between a simple dielectric and a bi-isotropic medium, in the lossless regime and in the presence of small losses. For the former, non-Dyakonov surface polaritons can arise for positive permittivities and magnetoelectric parameters. General restrictions on the permittivities and bi-isotropic parameter (existence conditions) are derived. For the latter, the effect of small losses is considered, and the characteristic surface plasmon-polariton lengths are discussed. The propagation length can exhibit a local maximum for specific values of the magnetoelectric parameter, an unusual new behavior that can be regarded as a signature of these chiral surface polaritons. Surface waves in an interface involving a bi- isotropic medium with an anomalous Hall effect (AHE) are also examined. Multiple configurations for their occurrence are obtained, revealing a richer scenario with distinct regimes of propagation and coexistence in the parameter space. The presence of a non-null AHE contribution creates a magnetoelectric range for which the surface wave propagation is forbidden, providing an additional signature of surface-polariton propagation in bi-isotropic media with an AHE contribution.", "url": "https://arxiv.org/abs/2609.06081", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alex Q. Costa"}, {"name": "Pedro D. S. Silva"}, {"name": "Manoel M. Ferreira Jr"}], "featured_authors": [{"name": "Alex Q. Costa"}, {"name": "Pedro D. S. Silva"}, {"name": "Manoel M. Ferreira Jr"}], "author_count": 3}, {"id": "2609.06120", "category": "cond-mat", "title": "Coupled self-charging and self-propulsion of evaporating sessile droplets", "abstract": "Evaporating sessile water droplets universally deposit surface charges while simultaneously becoming self-charged---a phenomenon that remains under-appreciated despite its potentially important consequences. Here, we investigate one such consequence: droplet self-propulsion driven by self-charging. This self-propulsion arises spontaneously in the absence of external stimuli and produces self-avoiding trajectories that can displace droplets by many times their own diameter. Our results have important practical implications for processes requiring spatial precision, such as inkjet printing. The coupling between self-charging and self-propulsion produces mosaic surface charge patterns characterized by alternating polarities, which we explain with a physical model based on properties of the electric double layer.", "url": "https://arxiv.org/abs/2609.06120", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nitish Singh"}, {"name": "Aaron D. Ratschow"}, {"name": "Syed N. R. Kazmi"}, {"name": "Dan Daniel"}], "featured_authors": [{"name": "Nitish Singh"}, {"name": "Aaron D. Ratschow"}, {"name": "Syed N. R. Kazmi"}, {"name": "Dan Daniel"}], "author_count": 4}, {"id": "2609.06215", "category": "cond-mat", "title": "Purely Electric-Field Control of Topological Magnetism in Two-Dimensional Magnets", "abstract": "Electrical control of topological magnetism is central to realizing energy-efficient topological spintronics. Yet most electric-field approaches modify the competing magnetic interactions through a nonselective rearrangement of low-energy electronic states, yielding coarse magnetic phase control that often requires external magnetic fields to stabilize topological quasiparticles, while few schemes solely based on electric fields are restricted to specific conducting materials. Here, we establish a general approach for purely electric-field control of topological magnetism, in which an applied electric field electrostatically dopes a selected orbital-angular-momentum-polarized band edge of a two-dimensional (2D) van der Waals (vdW) magnetic semiconductor via proximity to an adjacent nonmagnetic vdW metal. We show that the resulting electrostatic doping predominantly tunes magnetic anisotropy of the 2D magnet, while leaving exchange interaction and Dzyaloshinskii-Moriya interaction nearly unchanged, thereby reversibly driving the system through ferromagnetic, skyrmion, spiral, and bimeron phases. We demonstrate this mechanism for CrBr3/graphene and Cr2Ge2Te6/TaS2 vdW heterostructures hosting electron and hole pockets of different orbital characters. These results establish a broadly applicable strategy for purely electric-field control in topological spintronics.", "url": "https://arxiv.org/abs/2609.06215", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhonglin He"}, {"name": "Naafis Ahnaf Shahed"}, {"name": "Kai Huang"}, {"name": "Himanshu Mavani"}, {"name": "Evgeny Y. Tsymbal"}], "featured_authors": [{"name": "Zhonglin He"}, {"name": "Naafis Ahnaf Shahed"}, {"name": "Kai Huang"}, {"name": "Himanshu Mavani"}, {"name": "Evgeny Y. Tsymbal"}], "author_count": 5}, {"id": "2609.06334", "category": "cond-mat", "title": "Chemical and interface confinement effects in promoting plastic co-deformation in high-strength nano-scale eutectics", "abstract": "Eutectics offer a route to overcome plastic incompatibility in disparate-phase heterostructures by coupling microstructural refinement with phase-specific chemical and crystallographic hierarchy. Here, we investigate laser-rapid-solidified Al-(Si,Ge) eutectic composites designed along the univariant ternary eutectic path, solidifying with an Al-rich face-centered cubic (fcc) matrix and (Si,Ge)-rich diamond-cubic (dc) fibers as constituent eutectic phases with faceted interfaces. The microstructure was hierarchical in nature with finer structures within eutectic phases: nanoscale (Si,Ge) clusters in the Al phase and growth twins within the (Si,Ge) fibers with some Al retention. Although increasing Ge content coarsens the eutectic spacing, the yield strength is slightly enhanced compared to the relatively finer Al-Si, and tensile ductility of Al-(Si,Ge) is higher than that of Al-Si. In situ SEM micromechanical testing combined with post-mortem STEM and TEM showed that in the Al-rich phase, Ge segregated to the deformation-induced sub-grain boundaries that confined glide dislocations. Simultaneously, the (Si,Ge)-rich fibers remain crack-resistant at large plastic strain and exhibit deformation-induced planar faults, consistent with localized partial-dislocation activity at highly stressed interfaces and twin boundaries. These coupled mechanisms due to interface confinement and hard phase chemistry enable co-deformation of the metallic and covalent phases, providing a pathway for designing high-tensile-strength and ductile hierarchical eutectics beyond conventional length-scale-controlled strengthening.", "url": "https://arxiv.org/abs/2609.06334", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arkajit Ghosh"}, {"name": "Amit Misra"}], "featured_authors": [{"name": "Arkajit Ghosh"}, {"name": "Amit Misra"}], "author_count": 2}, {"id": "2609.06350", "category": "cond-mat", "title": "Barrierless Water Dissociation on Rare-Earth Sesquioxide Surfaces from First Principles", "abstract": "Water dissociation on metal oxide surfaces is a key elementary step in heterogeneous catalysis, photocatalysis, and radiation chemistry, yet its mechanistic details on rare-earth (RE) sesquioxides remain poorly understood. Here, we investigate water dissociation on the (110) surfaces of three cubic bixbyite oxides, Sc$_2$O$_3$, Y$_2$O$_3$, and Lu$_2$O$_3$, using molecular dynamics combining ab initio calculations with on-the-fly machine-learning force field acceleration. By sampling 25 independent trajectories per material, we obtain an unbiased picture of the reaction landscape inaccessible to conventional static calculations. Two distinct dissociation pathways are identified: a conventional proximal mechanism with a small but finite barrier of $\\sim$0.1 eV, and a previously unreported distal mechanism that is effectively barrierless and energetically preferred at both the adsorption and dissociation stages. The low barriers are consistent with the periodic array of inherently undercoordinated RE$^{3+}$ sites in the bixbyite lattice, suggesting that ordered intrinsic coordination defects play a role analogous to stochastic oxygen vacancies in conventional oxides.", "url": "https://arxiv.org/abs/2609.06350", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shuxiang Zhou"}, {"name": "Jay A. LaVerne"}, {"name": "Hanna Hlushko"}], "featured_authors": [{"name": "Shuxiang Zhou"}, {"name": "Jay A. LaVerne"}, {"name": "Hanna Hlushko"}], "author_count": 3}, {"id": "2609.06354", "category": "cond-mat", "title": "Continuum Limit of Nonlocal Electrostatics in Random Media", "abstract": "We derive a two-scale continuum limit for the electrostatic energy of random charge density fields that are stationary and ergodic under lattice translations. Each microscopic cell is charge neutral in every realization, while its dipole moment may fluctuate and have a nonzero mean. Under assumptions on the stationary microscopic potential and the finite-volume fields, the local and nonlocal energies converge almost surely to deterministic limits. The local limit consists of the ensemble-averaged microscopic Coulomb energy and a cell-depolarization term, whereas the effective polarization determines the nonlocal limit. The cell-depolarization terms cancel in the total energy, which consists of the ensemble-averaged microscopic cell energy and the macroscopic electrostatic field energy. The deterministic specialization recovers the periodic two-scale limit. For an independent-cell random-displacement model, we verify the assumptions of the continuum-limit theorem and show that centered microscopic fluctuations can change the local energy without changing the effective polarization or the nonlocal energy.", "url": "https://arxiv.org/abs/2609.06354", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Prashant K. Jha"}, {"name": "Kaushik Dayal"}], "featured_authors": [{"name": "Prashant K. Jha"}, {"name": "Kaushik Dayal"}], "author_count": 2}, {"id": "2609.06405", "category": "cond-mat", "title": "Statistical mechanical evaluation of a spread-spectrum watermarking model with image restoration II AT stability of a hybrid system with message decoding and image", "abstract": "In the previous paper ( arxiv.org/abs/1209.4772 ), we proposed a spread-spectrum watermarking model with image restoration based on Bayes estimation assuming several prior probabilities and adopting the Gaussian channel model to represent attacks from unauthorized users. When an image is generated from the infinite range Ising model, we analyzed the model using the statistical mechanical method, the replica method, and derived the replica symmetric (RS) solution and performed Markov chain Monte Carlo simulations. The theoretical results of the RS solution and the simulation results were in good agreement except for some range of parameters. We treated the informed case where only the original image is known and the blind case where both the original message and the original image are unknown and found that the difference between these cases was small as long as the embedding and attack rates were small. In this paper, we treat the blind case and investigate the de Almeida-Thouless (AT) stability of the RS solution and reveal that the AT stability is broken in the range of parameters where theoretical and simulation results do not agree.", "url": "https://arxiv.org/abs/2609.06405", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tatsuya Uezu"}, {"name": "Kao Hayashi"}, {"name": "Masaki Kawamura"}], "featured_authors": [{"name": "Tatsuya Uezu"}, {"name": "Kao Hayashi"}, {"name": "Masaki Kawamura"}], "author_count": 3}, {"id": "2609.06487", "category": "cond-mat", "title": "Dynamical signatures of Hardcore-Boson Supersolid on the Triangular Lattice", "abstract": "We investigate the dynamical signatures of the supersolid phase in the triangular-lattice hardcore Bose-Hubbard model via large-scale quantum Monte Carlo simulations and linear spin-wave theory. We reveal a distinct momentum-space separation in the spectral weights. The transverse spectrum shows gapless Goldstone modes at the $\\Gamma$ and $K$ points, while the longitudinal spectrum features a gapless mode at $K$ and a roton-like minimum at $M$. Directly in the imaginary-time domain, the supersolid is unambiguously characterized by the coexistence of transverse spectral lines at $\\Gamma$ and $K$. Furthermore, we show that strong quantum fluctuations induce a breakdown of the sharp quasiparticle picture, leading to asymmetric line shapes and broad continua. Our work establishes the definitive dynamical signatures of the hardcore-boson supersolid, providing key insights into analogous spin supersolids in triangular quantum magnets.", "url": "https://arxiv.org/abs/2609.06487", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xingchuan Zhu"}, {"name": "Qingyang Guo"}, {"name": "Junsong Sun"}, {"name": "Yujun Fu"}, {"name": "Xingmin Huo"}, {"name": "Yixuan Huang"}, {"name": "Shiping Feng"}, {"name": "Richard T. Scalettar"}, {"name": "Huaiming Guo"}], "featured_authors": [{"name": "Xingchuan Zhu"}, {"name": "Qingyang Guo"}, {"name": "Junsong Sun"}, {"name": "Shiping Feng"}, {"name": "Richard T. Scalettar"}, {"name": "Huaiming Guo"}], "author_count": 9}, {"id": "2609.06513", "category": "cond-mat", "title": "Exact Analytic Solution for the Time-Fractional Hunter-Saxton Equation with Caputo derivative", "abstract": "A time fractional extension of the Hunter Saxton equation is examined, in which the temporal derivative of u_x is replaced by a Caputo derivative of order 0 < alpha <= 1. This modification introduces memory effects into a model traditionally associated with director field dynamics in nematic liquid crystals. By employing a fractional separation of variables strategy together with the exponential spatial profile phi(x) = exp(b+x), which cancels the nonlinear structure exactly, the governing nonlinear partial differential equation is reduced to a fractional relaxation ODE, whose closed form solution is the one-parameter Mittag Leffler function. The exact analytic solution is derived algebraically from the separation process. This appears to be the first exact closed form solution of the Caputo time fractional Hunter Saxton equation. The result is validated symbolically using the MathHandbook computer-algebra system. Quantitative analysis in both the fractional (0 < alpha < 1) and classical (alpha -> 1) limits demonstrates how fractional-order memory slows temporal relaxation relative to the exponential baseline. The solution provides a reliable benchmark for numerical schemes and clarifies how fractional dynamics influence nonlinear wave propagation in orientationally ordered fluids.", "url": "https://arxiv.org/abs/2609.06513", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Weiguang Huang"}], "featured_authors": [{"name": "Weiguang Huang"}], "author_count": 1}, {"id": "2609.06515", "category": "cond-mat", "title": "Superfluidity in active quantum flocks", "abstract": "Active quantum matter has very recently emerged at the intersection between bio- and quantum many-body physics, combining the self-organization of living systems with the coherence of the quantum world. Active quantum systems have been shown to exhibit flocking - a collective phenomenon with no precedent in equilibrium quantum physics. In this work we uncover an unexpected layer of quantum order in active quantum flocks: they can become superfluid. We show that, in addition to the symmetry breaking associated with their directed motion, these flocks can also break an additional U(1) symmetry, giving rise to off-diagonal long-range order. For a microscopic model of active hard-core bosons governed by Lindblad dynamics, we derive an effective long-wavelength description of the single-particle density matrix and demonstrate that the flocking phase develops an instability toward off-diagonal long-range order characteristic of superfluid behavior. Our findings reveal active quantum matter as a promising research direction for discovering exotic nonequilibrium phases of quantum matter.", "url": "https://arxiv.org/abs/2609.06515", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Byjesh N. Radhakrishnan"}, {"name": "Reyhaneh Khasseh"}, {"name": "Thomas Schmidt"}, {"name": "Markus Heyl"}], "featured_authors": [{"name": "Byjesh N. Radhakrishnan"}, {"name": "Reyhaneh Khasseh"}, {"name": "Thomas Schmidt"}, {"name": "Markus Heyl"}], "author_count": 4}, {"id": "2609.06613", "category": "cond-mat", "title": "Coupling and decoupling between translational and rotational dynamics in a tetrahedral molecular liquid", "abstract": "The translational dynamics usually decouples earlier than the rotational in supercooled liquids as the temperature decreases, whereas the inverted scenario remains scarce reported. In this work, starting from the coarse-grained ortho-terphenyl model, we build a rigid tetrahedral structure model. It exhibits an earlier decoupling in rotation than in translation. The Stokes-Einstein-Debye relation breaks down while the Stokes-Einstein relation remains intact. The decoupling happens at approximately 2Tg similar as that observed in supercooled water. The rotation shows more heterogeneous dynamics than the translation at all temperatures. Our results suggest that the steric hindrance plays an important role in determining the decoupling between the translational and rotational dynamics.", "url": "https://arxiv.org/abs/2609.06613", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gan Ren"}], "featured_authors": [{"name": "Gan Ren"}], "author_count": 1}, {"id": "2609.06618", "category": "cond-mat", "title": "Structure and dynamics of interface around a quenched impurity in a colloidal liquid film", "abstract": "The interfacial structure and dynamics around a quenched impurity is far from understood till date. Here we explore the structural and dynamical properties of interface between colloidal fluid film and a quenched impurity by using computer simulation. We tune the size($\\sigma_{imp}$) of a quenched pinned impurity and observe that the impurity surface is wetted by a fluid layer, giving rise to a finite-width interfacial region for sufficiently large impurities. Beyond this interfacial region, the host fluid exhibits quasi-long ranged orientational order(QLRO) due to the fluid- crystal phase coexistence. We find that the mean diffusivity becomes very low in the QLRO phase where the self van Hove function shows an exponential tail, signature of dynamic heterogeneity within the system. In the presence of second impurity the orientational order is suppressed if the fluid layers around the impurity particles overlap.", "url": "https://arxiv.org/abs/2609.06618", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sabuj Mandal"}, {"name": "Jaydeb Chakrabarti"}], "featured_authors": [{"name": "Sabuj Mandal"}, {"name": "Jaydeb Chakrabarti"}], "author_count": 2}, {"id": "2609.06707", "category": "cond-mat", "title": "Electronic correlations and fluctuating lattice distortions in vanadium dioxide", "abstract": "Metal-insulator transitions in correlated materials are often accompanied by a change of crystal structure. They are commonly described within a coherent lattice approximation, which combines a correlated treatment of the electrons with a lattice represented by one or a few classical distortion coordinates fixed by minimizing an energy. The structural degrees of freedom then carry no entropy of their own, even though the partition of the transition entropy between electrons and lattice is often what decides the transition temperature. Here we develop a stochastic semiclassical extension of dynamical mean-field theory in which correlated electrons and fluctuating lattice distortions are evolved together, extending previous formulations from linear to nonlinear electron-phonon interactions and from a single to several coupled lattice modes. The resulting non-conservative Langevin equations have deterministic forces, damping, and correlated noise generated self-consistently by the interacting electronic subsystem. Applying the approach to a minimal two-orbital model containing the two symmetry-distinct distortions of the monoclinic phase of vanadium dioxide, we find that the two distortions melt at well separated temperatures, giving an insulating, an intermediate metallic, and a high-symmetry phase. The two transitions have different origins: the melting of the dimerization is driven by the coupling to the correlated electrons and is captured already within the coherent lattice approximation, whereas the restoration of the undistorted structure requires the entropy of the fluctuating lattice. Since the electronic subsystem is treated within nonequilibrium dynamical mean-field theory, the framework can be extended in future work to photoexcited systems with nonthermal electronic distributions.", "url": "https://arxiv.org/abs/2609.06707", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Antonio Picano"}, {"name": "Martin Eckstein"}, {"name": "Francesco Grandi"}], "featured_authors": [{"name": "Antonio Picano"}, {"name": "Martin Eckstein"}, {"name": "Francesco Grandi"}], "author_count": 3}, {"id": "2609.06722", "category": "cond-mat", "title": "Activity enhances heterogenous dynamics in 2D granular glasses", "abstract": "We study the effect of self-propulsion in the approach to the glassy regime of 2D bidisperse mixtures of frictional discs, confined to a horizontal plane, and fluidized by vertical vibrations. The discs are designed either to be passive, that is, exhibiting isotropic motion in the plane, or active, with a preferred polar mobility. When dynamics in mixtures of large active and small passive discs are compared to mixtures of large and small passive discs, the active system shows faster dynamics at equal area fractions. To explore whether activity merely speeds up motion, we select active and passive mixtures with the same relaxation time and compare their dynamics. Many indicators show that dynamical heterogeneity is much greater in the active glass with longer-ranged spatial velocity correlations, larger temporal variations in displacement, and higher amplitude of the four-point correlator. In this very crowded regime, despite frequent collisions, the activity directions of the discs remain persistent. However, the activity direction of the discs remains spatially uncorrelated, and furthermore, the particle displacements are not aligned with the activity direction, thus presenting a puzzle as to how activity leads to such strong heterogeneity.", "url": "https://arxiv.org/abs/2609.06722", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chetan Yadav"}, {"name": "Narayanan Menon"}], "featured_authors": [{"name": "Chetan Yadav"}, {"name": "Narayanan Menon"}], "author_count": 2}, {"id": "2609.06751", "category": "cond-mat", "title": "Ginzburg-Landau Theory for Non-Invertible Symmetry-Breaking Transitions", "abstract": "Recently, a generalized Landau paradigm has been proposed, in which a broad class of \"unconventional\" phase transitions lying beyond the original symmetry-breaking framework of Landau are understood as the symmetry-breaking transitions of generalized symmetries. In particular, in (1+1)D, such \"topological\" or \"deconfined\" transitions can be mapped to the symmetry-breaking transitions of non-invertible symmetries. How to extract the universal dynamical properties of the transitions from this understanding? In this paper, we follow the Ginzburg-Landau philosophy and develop a field-theoretic description of such critical points in terms of the fluctuations of local order parameters, now of non-invertible symmetries. The Symmetry Topological Field Theory formalism plays a central role in our analysis, allowing us to identify the algebra of local order parameters from the Lagrangian algebra of a (2+1)D topological order. We illustrate the key ideas and the full steps of this generalized Ginzburg-Landau procedure using the transitions between gapped phases with a simple non-invertible symmetry --- the Rep($S_3$) symmetry.", "url": "https://arxiv.org/abs/2609.06751", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vibhu Ravindran"}, {"name": "Luisa Eck"}, {"name": "Xie Chen"}], "featured_authors": [{"name": "Vibhu Ravindran"}, {"name": "Luisa Eck"}, {"name": "Xie Chen"}], "author_count": 3}, {"id": "2609.06858", "category": "cond-mat", "title": "Magneto-spin-orbit graphene: Chern topology and photoinduced Hall response", "abstract": "Magneto-spin-orbit graphene can host Chern phases due to proximity interactions, but in realistic heterostructures these depend on substrate chemistry, local stacking registry and may be altered by buried-interface reconstruction. Investigation of these effects requires special efforts to take into account the long-range moire patterns that often arise for these heterostructures. We address this question using first-principles calculations and effective four-band models for four out-of-plane magnetized Gr/(Au, Pt)/(Co, Mn) heterostructures in commensurate (2 x 2) and moire (9 x 9) supercells where the latter include misfit dislocations for the Co-based interfaces. The commensurate cells overestimate charge transfer and exaggerate valley asymmetry, whereas moire averaging strongly reduces both effects while preserving sizable spin splittings. The Pt spacer mediates stronger proximity interactions than Au, while replacing Co by Mn substantially changes the balance of the effective exchange interactions in a spacer-dependent manner. Introduction of misfit dislocations into the Co-based structures is selective and tunes the Dirac gap in Gr/Au/Co or spin splittings in Gr/Pt/Co. Graphene in Gr/Pt/Co exhibits effective ferromagnetic Chern phase with C = 2 in all studied supercells. By contrast, the moire models of the other three compositions are ferrimagnetic and topologically trivial, with C = 0. Nevertheless, they exhibit helicity-dependent photoinduced Hall responses, which are strongly enhanced by misfit-dislocation reconstruction in Gr/Au/Co. This work demonstrates that moire-scale stacking controls the effective Chern phase and Hall conductivity, whereas buried-interface defects tune the photoinduced Hall response without changing the topology.", "url": "https://arxiv.org/abs/2609.06858", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Artem V. Tarasov"}, {"name": "Alexander V. Eryzhenkov"}], "featured_authors": [{"name": "Artem V. Tarasov"}, {"name": "Alexander V. Eryzhenkov"}], "author_count": 2}, {"id": "2609.06884", "category": "cond-mat", "title": "On average stress within sub-regions of granular media", "abstract": "The paper concerns computation of average stress within small sub-regions of a larger static granular assembly, where the sub-region's boundary is allowed to pass through the assembly's particles. An exact average is computed for certain stress components and for certain categories of sub-regions. The paper also identifies those choices of sub-regions for which exact stress components may be exactly computed, but when these conditions are not met, provides reasonable bounds on the error.", "url": "https://arxiv.org/abs/2609.06884", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthew R. Kuhn"}], "featured_authors": [{"name": "Matthew R. Kuhn"}], "author_count": 1}, {"id": "2609.06902", "category": "cond-mat", "title": "Spin--orbit-enhanced correlation sensitivity and anomalous magnetic response in non-dimerized $4d^4$ ilmenite CdRuO$_3$", "abstract": "We report the synthesis and physical properties of CdRuO$_3$, a nominal Ru$^{4+}$ $4d^4$ ilmenite with edge-sharing RuO$_6$ honeycomb layers. Powder X-ray diffraction establishes a crystallographically non-dimerized $R\\bar{3}$ structure with equivalent Ru-Ru bonds and a strongly distorted RuO$_6$ environment. The compacted-pellet resistivity is nonmetallic but non-Arrhenius, while the heat capacity contains a finite residual linear term. Matched nonmagnetic calculations show that PBE+$U$ without spin-orbit coupling remains metallic or semimetallic up to $U_{\\mathrm{eff}} = 3$ eV, whereas PBE+SOC+$U$ exhibits a strong $U_{\\mathrm{eff}}$ dependence and opens a direct gap of approximately 55 meV at $\\Gamma$ for $U_{\\mathrm{eff}} = 2.5$ eV. Spin-orbit coupling therefore markedly enhances the correlation sensitivity of the non-cubic Ru $t_{2g}$ manifold. After subtraction of a dilute Curie-Weiss defect contribution, the susceptibility remains weakly nonmonotonic and is inconsistent with both an ordinary Pauli response and independent spin-only $S = 1$ moments. CdRuO$_3$ thus realizes the non-dimerized structural branch predicted for ruthenium ilmenites, but not a simple robust multiorbital metal.", "url": "https://arxiv.org/abs/2609.06902", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuya Haraguchi"}, {"name": "Hayato Yatsuzuka"}, {"name": "Hiroko Aruga Katori"}], "featured_authors": [{"name": "Yuya Haraguchi"}, {"name": "Hayato Yatsuzuka"}, {"name": "Hiroko Aruga Katori"}], "author_count": 3}, {"id": "2609.07039", "category": "cond-mat", "title": "Irreversibility of many-body harmonic oscillators characterized by generalized Husimi's adiabaticity parameter", "abstract": "In a classical paper [K. Husimi, Prog. Theor. Phys. 9, 381 (1953)], Husimi showed that, for a single harmonic oscillator with a time-dependent angular frequency and initial conditions sampled from an equilibrium distribution, the averaged energy cannot decrease after a cyclic operation. This irreversibility is quantified by Husimi's adiabaticity parameter constituted with adiabatic invariants. In this work, we generalize Husimi's framework to a many-body system of one-dimensional harmonic oscillators coupled on an arbitrary connected network, with all spring constants sharing a common time dependence. For a system attached to a fixed wall, the dynamics can be decomposed into independent normal modes by transforming to mass-weighted coordinates and diagonalizing the resulting positive definite matrix, with each mode characterized by its own Husimi's adiabaticity parameter. By defining the generalized Husimi's adiabaticity parameter as their arithmetic mean, we derive the exact time evolution of the averaged energy and establish its non-decrease under cyclic operations. Numerical simulations confirm these results for both a uniform nearest-neighbor chain and a heterogeneous network.", "url": "https://arxiv.org/abs/2609.07039", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kyosuke Watanabe"}, {"name": "Yuki Izumida"}], "featured_authors": [{"name": "Kyosuke Watanabe"}, {"name": "Yuki Izumida"}], "author_count": 2}, {"id": "2609.07146", "category": "cond-mat", "title": "Nonequilibrium full counting statistics of multicomponent strongly-interacting quantum gases with defects", "abstract": "We investigate the full counting statistics of a one-dimensional multicomponent impenetrable gas released from a bipartite state in the presence of a local defect. Spin--charge separation reduces the multivariate generating function to an exact Fredholm determinant whose kernel is built from time-evolved single-particle orbitals. Expressing these orbitals in terms of scattering data gives access to both transient dynamics and the nonequi
