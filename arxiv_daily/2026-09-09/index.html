nonlinear PDE is linearized through the homotopy perturbation. Second, the solutions are obtained with a variational quantum simulation framework, where the number of qubits is decreased with functional encoding and the depth of parametrized circuits is reduced. The additional contribution of this paper is the introduction of new criteria for selecting the homotopy series truncation order and circuit depth for cost-effective QHPM. The proposed approach is demonstrated with several examples, including the vorticity transport equation and the reduced magnetohydrodynamics equations.", "url": "https://arxiv.org/abs/2609.06357", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jungin E. Kim"}, {"name": "Eunsik Choi"}, {"name": "Yan Wang"}], "featured_authors": [{"name": "Jungin E. Kim"}, {"name": "Eunsik Choi"}, {"name": "Yan Wang"}], "author_count": 3}, {"id": "2609.06415", "category": "quant-ph", "title": "After Theft: From Revocation to Neutralization in the Custody of Quantum Clones", "abstract": "Encrypted quantum cloning enables the creation of multiple encrypted clones of an unknown quantum state while allowing only one effective decryption, with the decryption resource being intrinsically consumed in the process. In this paper, we argue that this property supports a distinctive custodial security primitive for post-compromise response. We consider a threat model in which an adversary steals an encrypted quantum clone but does not yet possess the corresponding decryption key. In such a scenario, a legitimate custodian may unseal a different trusted clone, thereby exhausting the sole available unsealing opportunity and rendering the stolen clone permanently useless. We argue that this mechanism is not adequately described as mere revocation. Rather, it realizes a stronger form of post-theft response, which we call neutralization. We formalize this distinction, locate it within a broader post-theft response space, and introduce a temporal threat model. We compare the mechanism with its closest classical analogue, showing that the classical case can reproduce the policy outcome only through external procedural composition. We finally interpret encrypted quantum cloning as a primitive for post-compromise quantum custody in distributed preservation settings, with prospective relevance for Cyber-Humanities-oriented preservation architectures.", "url": "https://arxiv.org/abs/2609.06415", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gabriele Gianini"}, {"name": "Jianyi Lin"}, {"name": "Corrado Mio"}, {"name": "Stelvio Cimato"}, {"name": "Ernesto Damiani"}], "featured_authors": [{"name": "Gabriele Gianini"}, {"name": "Jianyi Lin"}, {"name": "Corrado Mio"}, {"name": "Stelvio Cimato"}, {"name": "Ernesto Damiani"}], "author_count": 5}, {"id": "2609.06471", "category": "quant-ph", "title": "Generation of entanglement statistics with a large-scale integrated photonic-electronic circuit", "abstract": "Continuous-variable quantum processors scale with the modes they can transform, and each transformation adds loss. We demonstrate optoelectronic quantum information processing, moving the mixing into radio-frequency electronics after homodyne detection. Squeezed vacuum falls on a large-scale integrated photonic-electronic circuit, a 32-channel coherent receiver array whose radio-frequency network mixes the analog photocurrents. A local-oscillator ramp reconstructs the two-mode covariance at the aperture, which is physical, and its partial transpose has smallest symplectic eigenvalue 0.99270, three standard deviations below the separability bound. Mode transformation becomes a circuit function whose scale follows integrated electronics. With electro-optic transducers in place of the photodiodes, the same receiver would transfer optical modes into superconducting circuits and back, toward a photonic-electronic quantum computer spanning the optical and microwave bands.", "url": "https://arxiv.org/abs/2609.06471", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Volkan Gurses"}, {"name": "Ali Hajimiri"}], "featured_authors": [{"name": "Volkan Gurses"}, {"name": "Ali Hajimiri"}], "author_count": 2}, {"id": "2609.06480", "category": "quant-ph", "title": "Quantum Optics of harmonic generation in the strongly driven Jaynes-Cummings-type system", "abstract": "We adapt the Jaynes-Cummings model to study the interface of cavity quantum electrodynamics with strong field and attosecond physics. We show how multi-photon resonances in the Jaynes- Cummings system driven by a strong low-frequency classical light field lead to the generation of highly non-classical, quantum-correlated harmonics of the classical driver. Our treatment assumes no approximations, apart from the typical Jaynes-Cummings model assumption of only a few discrete quantum modes of light. The paper is dedicated to Joseph Henry Eberly, whose remarkable research has left indelible mark on both strong field physics and quantum optics.", "url": "https://arxiv.org/abs/2609.06480", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "M Suman"}, {"name": "Sili Yi"}, {"name": "Maria Chekhova"}, {"name": "Misha Ivanov"}], "featured_authors": [{"name": "M Suman"}, {"name": "Sili Yi"}, {"name": "Maria Chekhova"}, {"name": "Misha Ivanov"}], "author_count": 4}, {"id": "2609.06617", "category": "quant-ph", "title": "Spectral bounds for the partial transpose", "abstract": "Among the various entanglement measures, the negativity stands out not only for its clear physical meaning but also for being directly computable from the spectrum of the partial transpose. However, the negativity captures only the total weight of the negative eigenvalues, whereas the finer structure of the negative spectrum remains largely unexplored. In this work, we fill this gap by introducing a hierarchical generalization of the negativity, the Ky Fan $k$-negativity, and developing a unified analytical framework for deriving spectral bounds on the partial transpose. To obtain the absolute bounds, we reduce the maximization problem to a spectral graph optimization, whose solution yields the exact bound for every $k$ through a single cubic equation. We further investigate these spectral bounds both analytically and numerically under a fixed-purity constraint. In particular, we solve the $k=1$ case completely and uncover a simple underlying graph structure. As two direct applications, we show that the Ky Fan $k$-negativity robustly certifies genuine multilevel entanglement and that it converts the $p_3$-PPT condition into a quantitative lower bound on the negativity.", "url": "https://arxiv.org/abs/2609.06617", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wei-Jie Jiang"}, {"name": "Jing-Tao Qiu"}, {"name": "Xiao-Dong Yu"}], "featured_authors": [{"name": "Wei-Jie Jiang"}, {"name": "Jing-Tao Qiu"}, {"name": "Xiao-Dong Yu"}], "author_count": 3}, {"id": "2609.06632", "category": "quant-ph", "title": "Anomaly fluctuation theorem for quantum coherence dynamics", "abstract": "Quantum coherence is a central resource in quantum information science, yet general frameworks and constraints governing its dynamics remain limited. Although quantum coherence lacks a general monotonicity law, we establish an exact integral fluctuation theorem (FT) for coherence dynamics, formulated in terms of Kirkwood-Dirac (KD) quasiprobability trajectories and valid for arbitrary initial states and dynamics. This integral FT deviates from the standard unit-valued form, and the complex deviation, termed the anomaly, quantifies a weighted overlap between the residual final-state coherence and the coherence generated from the dephased input. The real part of the anomaly yields bounds on coherence change, while its imaginary part constrains the second-order moment of the stochastic coherence change weighted by the imaginary parts of the KD quasiprobabilities. Our results establish general statistical constraints on coherence dynamics, demonstrating the utility and broad applicability of FTs for studying quantum-resource dynamics.", "url": "https://arxiv.org/abs/2609.06632", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kun Zhang"}, {"name": "Hai-Long Shi"}, {"name": "Xiao-Hui Wang"}, {"name": "Wen-Li Yang"}], "featured_authors": [{"name": "Kun Zhang"}, {"name": "Hai-Long Shi"}, {"name": "Xiao-Hui Wang"}, {"name": "Wen-Li Yang"}], "author_count": 4}, {"id": "2609.06672", "category": "quant-ph", "title": "Efficient Representation of multicategorical local Hilbert spaces: nonlinear Restricted Boltzmann Machines to Kolmogorov-Arnold Networks", "abstract": "Neural network quantum states (NQS) for representing spin-$\\frac{1}{2}$ systems are typically built from Multi-Layer Perceptrons (MLPs) with binary visible variables, in which the input spins are first combined through linear affine maps before more expressive nonlinear transformations are applied. The standard way for representing multi-categorical systems, namely spin-1 and spin-2, or the q-state quantum Potts systems with more than two local degrees of freedom, is a unary or one-hot encoded MLP architecture. Following a few similar studies, I observe that while the one-hot construction is the mathematically faithful encoding for systems with more than two local states such as spin-$S$ models with $S > 1/2$ or $q$-state Potts models, its parameter count grows with the number of local states, and the resulting optimization landscape can hinder convergence. I find numerically that allowing $\\log \\Psi$ to be a nonlinear function of the raw multi-valued spin variable is a natural categorical generalization: it preserves the labelling freedom of the local basis and reproduces the one-hot model with strictly fewer parameters, often with improved trainability. I first benchmark this idea on shallow Restricted Boltzmann Machines (RBMs), equipping them with several distinct nonlinear connections, for spin-1, 2, and 3 Heisenberg chains. I then turn to Kolmogorov-Arnold Networks (KANs), where each edge carries a learnable univariate nonlinearity, and show that they provide a strictly more expressive realization of the same principle. Finally, I demonstrate that this framework captures the critical behaviour of the quantum Potts Hamiltonian, recovering its phase transition.", "url": "https://arxiv.org/abs/2609.06672", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Abhiroop Lahiri"}], "featured_authors": [{"name": "Abhiroop Lahiri"}], "author_count": 1}, {"id": "2609.06675", "category": "quant-ph", "title": "Contact order governs the onset of entanglement cascades", "abstract": "Entangling rates describe a direct entangling channel, but give no information when that channel is forbidden. For finite-dimensional analytic pure-state dynamics, we show that the onset of genuine $(n+1)$-partite entanglement is determined by the contact order $m_\\star$ between the physical trajectory and the $S|E$ product manifold. It is the first Taylor order that cannot be reproduced by any product curve, or equivalently the first nonvanishing order of the Fubini--Study distance from the product manifold. We derive a time-ordered recursion that removes curvature-induced kinematic terms and computes $m_\\star$ from the Taylor coefficients of $H(t)$. This provides a geometric description of an entanglement cascade, in which new subsystems can join multipartite entanglement only after one or more interaction steps. A symmetry-protected three-qubit model realizes $m_\\star=2$, and a three-mode bosonic example shows that genuine tripartite entanglement can arise even when the two newly formed reduced pairs remain separable.", "url": "https://arxiv.org/abs/2609.06675", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sugumi Kanno"}, {"name": "Jiro Soda"}], "featured_authors": [{"name": "Sugumi Kanno"}, {"name": "Jiro Soda"}], "author_count": 2}, {"id": "2609.06688", "category": "quant-ph", "title": "Error Exponents of Probabilistic Quantum Resource Distillation", "abstract": "In this manuscript, we establish a unified framework for analyzing the conditional error exponents of probabilistic resource distillation under approximately resource-nongenerating instruments. For generic quantum resource theories satisfying suitable structural conditions, we derive general one-shot bounds on the conditional distillation error exponents. By relating probabilistic distillation to postselected composite quantum hypothesis testing, we further obtain analytical characterizations of the conditional error exponents for entanglement, coherence, and magic distillation at finite blocklength, and derive their asymptotic expressions in the zero-rate regime. For several representative families of states in entanglement and magic resource theories, these characterizations reduce to explicit closed-form formulas. Comparing them with the corresponding deterministic distillation exponents, we identify regimes in which postselection yields a strict improvement in the exponential decay rate of the conditional error. Our results reveal an operational advantage of postselection in quantum resource distillation and establish postselected composite hypothesis testing as a general tool for characterizing probabilistic resource-processing tasks.", "url": "https://arxiv.org/abs/2609.06688", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xian Shi"}], "featured_authors": [{"name": "Xian Shi"}], "author_count": 1}, {"id": "2609.06799", "category": "quant-ph", "title": "Scale-Free Localization Morphing in Bilocally Coupled Hatano-Nelson Chains", "abstract": "We investigate an anomalous critical non-Hermitian skin effect (CNHSE) in two Hatano--Nelson chains coupled locally at two bulk sites separated by an inclusive distance $d$. Whereas conventional CNHSE is commonly associated with weakly coupled subsystems, the critical behavior in our system persists in the strong inter-chain-coupling regime. Strong local hybridization generates high-energy impurity modes and effectively fragments the low-energy Hilbert space into geometry-selected sectors, one of which supports scale-free skin states. Independently, the count of states selected in the outer sector follows $2(L-d)$ for the two-chain system. These results establish local-coupling-induced fragmentation as a route to critical non-Hermitian behavior beyond the weak-coupling paradigm.", "url": "https://arxiv.org/abs/2609.06799", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chong Wang"}, {"name": "Linhu Li"}], "featured_authors": [{"name": "Chong Wang"}, {"name": "Linhu Li"}], "author_count": 2}, {"id": "2609.06800", "category": "quant-ph", "title": "Hilbert space geometry change by a nonadiabatic electromagnetic field", "abstract": "A change in the geometry of the Hilbert space of a quantum system interacting with a nonadiabatic electromagnetic field is found. To identify its physical origin, the evolution of orthogonality to non-orthogonality of the states of the quantum system has been investigated based on the matrix elements of the quantum states in three main physical cases: a quantum system in zero external field (closed quantum system), a quantum system in slowly changing (adiabatic) field, and a quantum system in rapidly changing (nonadiabatic) field. The quantum states are orthogonal in the first two cases and change to non-orthogonal in a nonadiabatic field, following continuously the parameters of the field. A time-dependent Fubini-Study metric of the Hilbert space can be determined based on the matrix elements of the quantum states in the nonadiabatic case. Such a dynamical metric of the Hilbert space in quantum mechanics resembles the dynamical metric of spacetime in general relativity.", "url": "https://arxiv.org/abs/2609.06800", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ivan Georgiev Koprinkov"}], "featured_authors": [{"name": "Ivan Georgiev Koprinkov"}], "author_count": 1}, {"id": "2609.06957", "category": "quant-ph", "title": "Trace-class spectra of irreducible Gaussian quantum Markov semigroups", "abstract": "We determine the spectrum of the predual generator of an irreducible Gaussian quantum Markov semigroup on the trace-class operators over a finite-mode bosonic Fock space in the stable, strictly unstable, and periodic critical drift regimes. For stable drift, irreducibility is equivalent to the existence of a unique faithful normal invariant state. The spectrum and approximate point spectrum are the closed left half-plane, whereas the point spectrum is the open left half-plane together with zero. Thus the polynomial eigenvalues generated by the drift matrix do not exhaust the trace-class point spectrum. If the drift has an eigenvalue with strictly positive real part, the spectrum is again the closed left half-plane, but the point spectrum is empty and the open left half-plane together with zero belongs to the residual spectrum. For periodic critical drift, we obtain an explicit spectral formula that includes the displacement parameter and yields horizontal half-lines or parabolic regions. The proofs use characteristic functions, Gaussian diffusion semigroups, and bounded eigenoperators of the dual semigroup. The nonperiodic critical drift case remains open.", "url": "https://arxiv.org/abs/2609.06957", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Franco Fagnola"}, {"name": "Zheng Li"}], "featured_authors": [{"name": "Franco Fagnola"}, {"name": "Zheng Li"}], "author_count": 2}, {"id": "2609.06981", "category": "quant-ph", "title": "Coherence-Mediated Boundary Control of the Liouvillian Gap in Nonreciprocal Open Quantum Systems", "abstract": "We study a single-particle Lindblad lattice in which nonreciprocal incoherent hopping is combined with a tunable coherent boundary link. The link changes the Hamiltonian boundary condition while the incoherent jump rates are kept fixed, so it does not directly alter the diagonal population generator. Its effect on the Liouvillian gap comes from population-coherence-population feedback: the Hamiltonian couples populations to damped coherences, and eliminating those coherences produces a frequency-dependent self-energy for the slow population branch. For the periodic reference system, where translation symmetry is imposed on both the Hamiltonian and the dissipator, we derive an exact fixed-momentum reduction, a scalar secular equation for the population-connected branch, and the associated hydrodynamic drift and coherence-corrected diffusion. For open finite lattices, exact diagonalization and sparse near-zero eigensolvers show that the coherent boundary link can enhance or suppress the gap in one dimension and produce geometry-dependent responses in two dimensions. We also show that an observed relaxation scale can differ from $1/\\Delta_{\\mathcal L}$ when the gap family has weak visibility in the chosen perturbation and observable. The periodic construction gives exact analytical benchmarks, while finite-size simulations in one and two dimensions demonstrate how the same coherence-mediated mechanism controls open-boundary gaps and observable relaxation.", "url": "https://arxiv.org/abs/2609.06981", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "K. L. Li"}, {"name": "M. H. Yu"}, {"name": "X. Z. Zhang"}], "featured_authors": [{"name": "K. L. Li"}, {"name": "M. H. Yu"}, {"name": "X. Z. Zhang"}], "author_count": 3}, {"id": "2609.07035", "category": "quant-ph", "title": "Capability-Gated Conformance Testing of Quantum Error-Correction Decoder Libraries", "abstract": "A quantum error correction decoder is a library other people's results depend on, judged in one dominant way. Sample errors, decode, and count wrong logical observables. We ask what else can be checked there. Our conformance contract needs no oracle. One check asks that a returned correction explain the syndrome in the caller's index space. The other hands a decoder one instance under two presentations differing only in bookkeeping, where two feasible corrections of different weight prove the heavier is not minimum-weight. Verdicts are gated on what each library declares, so a firing contradicts a published guarantee. Nine configurations from five public libraries give three results. Documentation answers 4 of 54 capability questions. Bounded-distance correctness, the property callers most depend on, has a direct declaration yield of 0.0%, though its hypotheses hold in 62.1% of cases. Presentation sensitivity is real but shallow. One solver moved to a 26% heavier correction under a different numbering, which reaches the logical class at most once in twenty thousand shots. Established evaluation misses corruptions that preserve logical parity, while one summation over the caller's weights catches every one we injected. All 639 certificates ship as bundles a standalone verifier re-derives from first principles.", "url": "https://arxiv.org/abs/2609.07035", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jiachen Shen"}, {"name": "Hui Zhong"}], "featured_authors": [{"name": "Jiachen Shen"}, {"name": "Hui Zhong"}], "author_count": 2}, {"id": "2609.07060", "category": "quant-ph", "title": "2-Fold Forrelation is in QAC$^0$", "abstract": "We show that 2-fold Forrelation with inverse-polylogarithmic promise gap can be solved, with bounded error, by polynomial-size QAC$^0$ circuits. Unlike the standard oracle-based Forrelation algorithm, our circuits receive the input explicitly, in the same form as the AC$^0$ circuits against which Forrelation is known to be hard. At constant gap, this yields a natural promise-problem separation between QAC$^0$ and AC$^0$.", "url": "https://arxiv.org/abs/2609.07060", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Francisca Vasconcelos"}], "featured_authors": [{"name": "Francisca Vasconcelos"}], "author_count": 1}, {"id": "2609.07076", "category": "quant-ph", "title": "Single-tone drive-enhanced CROT gate for bosonic quantum error correction", "abstract": "Bosonic error correction provides a hardware-efficient route to protected qubits for accurate quantum information processing. A critical component for error correction of rotation-symmetric bosonic (RSB) codes, like the well-known cat codes, is the two-mode controlled-rotation (CROT) operation. The CROT gate is useful because of its code-agnostic generality and its error-propagation properties. While the CROT gate can in principle be composed from existing bosonic physical primitives, the desirable properties are typically lost when composed as a sequence of imperfect primitive operations. Past work has focused on direct implementations that rely on features of specific codes. Here, we present a direct route to CROT within the circuit-QED architecture that retains its code-agnostic and error-propagation characteristics. By driving a transmon simultaneously coupled to two microwave cavities, we controllably enhance the effective nonlinearities between the microwave cavities and thus engineer the necessary two-mode interaction underlying the CROT gate. Using only a single drive frequency, we can achieve an on-off ratio sufficient for gate implementation, while minimizing mode distortions. We provide simple analytical formulas that permit the identification of potential working regimes, further refined by exact numerics, and illustrate the efficacy of our CROT approach in an error-correction example involving different RSB codes within the same circuit. Our CROT gate adds to the arsenal of direct two-mode gates available for general bosonic information processing.", "url": "https://arxiv.org/abs/2609.07076", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shushen Qin"}, {"name": "Long D. H. My"}, {"name": "Adrian Copetudo"}, {"name": "Amon M. Kasper"}, {"name": "Yvonne Y. Gao"}, {"name": "Hui Khoon Ng"}], "featured_authors": [{"name": "Shushen Qin"}, {"name": "Long D. H. My"}, {"name": "Adrian Copetudo"}, {"name": "Amon M. Kasper"}, {"name": "Yvonne Y. Gao"}, {"name": "Hui Khoon Ng"}], "author_count": 6}, {"id": "2609.07090", "category": "quant-ph", "title": "Complexity Amplification from Compression in Quantum Random Access Optimization", "abstract": "Compressed quantum encodings aim to overcome hardware limitations towards tackling challenging problems at scale, with many classical variables mapped onto noncommuting observables of fewer qubits. Classically, relaxations such as the semidefinite program formulation of MaxCut trade solution quality for computational efficiency. By contrast, quantum relaxations based on compression can amplify the worst-case complexity of the problem being solved. We study quantum random access optimization (QRAO), a special case of the Pauli correlation encoding (PCE) framework that assigns up to three binary variables to the Pauli $X$, $Y$, and $Z$ observables of each qubit, with the packing choices determining the compressed Hamiltonian to be optimized. We identify explicit QRAO optimal energy promise problems complete for NP, StoqMA, and QMA, with inverse-polynomial promise gaps for the latter two. Our problem reductions preserve inverse-polynomial promise gaps without requiring gadgets or ancillas. For any prescribed packing, we show that weighted MaxCut instances compress, up to a known shift and rescaling, to arbitrary nonnegative-weight pairwise Pauli couplings allowed by the packing. For QRAO, using one aligned axis gives an NP-complete energy problem. Using two or three positive aligned Pauli axes generally gives QMA-complete problems, while their bipartite restrictions lie in StoqMA. We show that this computational hardness survives compilation and is practically relevant. Notably, this result applies directly to the current QRAO compiler implementation in Qiskit Optimization 0.7.0, confirming our hardness results are not artifacts of artificial or contrived packing rules. Altogether our results identify worst-case complexity barriers arising from quantum compression, while making no broad claims about typical cases or the performance and trainability of algorithm pipelines that use it.", "url": "https://arxiv.org/abs/2609.07090", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stuart Hadfield"}], "featured_authors": [{"name": "Stuart Hadfield"}], "author_count": 1}, {"id": "2609.07127", "category": "quant-ph", "title": "From Quantum Cryptography to Intuitionism and beyond: relativity, many-worlds and non-locality", "abstract": "After a recollection of some of my encounters with Gilles Brassard, on the occasion of his 70th birthday I present, first, a new idea on creation of new information at a limited rate. Next, I develop the idea that \"indeterminacy is relative\" [Entropy {23} 1326 (2021)] and how this illuminates the compatibility between relativity and non-locality.", "url": "https://arxiv.org/abs/2609.07127", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nicolas Gisin"}], "featured_authors": [{"name": "Nicolas Gisin"}], "author_count": 1}, {"id": "2609.07198", "category": "quant-ph", "title": "Remote Flux Refocuses Nonadiabatic Excursions in Compact-State Quantum Transfer", "abstract": "Compact states embedded in a propagating band can carry quantum information, but finite-time transfer can populate modes outside their subspace. We show that a remote flux can refocus this amplitude without changing the transfer states or the motion-induced coupling out of their subspace. In a resonator ring, this separation is exact because both endpoints of the flux-bearing bond are nodes of every compact transfer state. For the same pulse, zero and refocusing flux both produce substantial excursions, but only the latter yields near-complete logical transfer. Interference between matrix amplitudes associated with different windings suppresses the endpoint error. Under matched control bounds, numerical optimization yields higher worst-input fidelity at the refocusing flux, providing a route to accurate transfer through coherent return.", "url": "https://arxiv.org/abs/2609.07198", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "X. S. Meng"}, {"name": "Y. S. Liu"}, {"name": "X. Z. Zhang"}], "featured_authors": [{"name": "X. S. Meng"}, {"name": "Y. S. Liu"}, {"name": "X. Z. Zhang"}], "author_count": 3}, {"id": "2609.07242", "category": "quant-ph", "title": "Hudson's theorem fails for the SU(1,1) discrete series", "abstract": "Hudson's theorem states that a pure state of a bosonic mode has a non-negative Wigner function if and only if it is Gaussian. It underwrites the reading of Wigner negativity as a faithful signature of pure-state non-classicality. We show the statement has no analogue on curved phase space. For the positive discrete series of $SU(1,1)$, realised on the upper sheet of a two-sheeted hyperboloid, the Wigner-positive pure states form a strictly larger set than the Perelomov coherent orbit. Superpositions of the lowest weight state with the first excited state stay positive up to a mixing angle of $24.93^\\circ$ at Bargmann index $k=1$, and the admissible set has positive volume, with a maximal width that is not attained in the two-state direction. We show analytically that the quadratic form controlling positivity degenerates in the far field onto a single mixing angle. That degeneracy bounds the window by $\\arctan(1/\\sqrt{2k})$ and leaves the threshold itself fixed at intermediate hyperbolic distance.", "url": "https://arxiv.org/abs/2609.07242", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chon-Fai Kam"}], "featured_authors": [{"name": "Chon-Fai Kam"}], "author_count": 1}, {"id": "2609.07267", "category": "quant-ph", "title": "Spectral Criterion for Disorder-Free Localization of Quantum Walks on Hypercube: QBN Approach", "abstract": "We study disorder-free localization in a spin-coupled quantum walk on the hypercube within the quantum Bernoulli noises framework. We derive a general criterion for disorder-free localization: it occurs if and only if some spectral subspace of a reduced unitary evolution contains a vector whose position marginal probability is non-uniform. For the Grover walk with distance-dependent coupling \\(\\phi_\\sigma=|\\sigma|\\pi/(n+1)\\) in dimension \\(d=4\\), we explicitly construct a non-uniform fixed point in the all \\(+1\\) spin configuration. This implies that disorder-free localization occurs in our model.", "url": "https://arxiv.org/abs/2609.07267", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ce Wang"}], "featured_authors": [{"name": "Ce Wang"}], "author_count": 1}, {"id": "2609.07284", "category": "quant-ph", "title": "Implementing QESEM's High-Accuracy Error Mitigation on a Quantum Computer: a Water Potential Energy Surface Study", "abstract": "Quantum error mitigation (QEM) is essential for extracting chemically accurate results from near-term quantum hardware. Many widely used QEM methods rely on uncontrolled heuristics whose bias depends on the specific circuit and noise realization. In this work, we employ QESEM---a characterization-based, unbiased quasi-probabilistic mitigation method---on IBM's Aachen quantum processor to compute the ground-state potential energy surface (PES) of the symmetrically-stretched water molecule. We consider a classically-optimized, single-layer perfect-pairing tiled unitary product state ansatz. We map this ansatz to an 8-qubit register corresponding to a (4,4) active space and the STO-3G basis set. Compared to the statevector reference, we find that raw QPU results typically overestimate the ground-state energy by around 500~mHa across the scanned geometries. On the other hand, QESEM-mitigated results fall approximately within 100~mHa, 30~mHa, or ``chemical accuracy'' ($\\sim$1.5~mHa), depending on the target precision. We benchmark QESEM at both loose (0.1~Ha) and tight (0.01~Ha) precision targets, evaluating both individual and merged batches of runs. As the precision target is tightened, the accuracy improves systematically, matching or exceeding results reported in the literature. We further quantify the sampling cost of these results, reporting the number of shots required at each precision level. Our results show how, with the current levels of hardware error, reaching the highest accuracies demands substantial QPU time. The results demonstrate that the characterization-based, unbiased error mitigation provided by QESEM allows to measure quantitatively meaningful potential energy surfaces on current quantum hardware. Concurrently, they highlight the sampling overhead associated with QEM, which remains a central bottleneck en route to larger chemical problems and higher precision.", "url": "https://arxiv.org/abs/2609.07284", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Renato Olarte Hernandez"}, {"name": "Emanuele Rossi"}, {"name": "Sonia Coriani"}, {"name": "Karl Michael Ziems"}, {"name": "Erik Kjellgren"}, {"name": "Jacob Kongsted"}, {"name": "Tali Shnaider"}, {"name": "Stephan P. A. Sauer"}], "featured_authors": [{"name": "Renato Olarte Hernandez"}, {"name": "Emanuele Rossi"}, {"name": "Sonia Coriani"}, {"name": "Jacob Kongsted"}, {"name": "Tali Shnaider"}, {"name": "Stephan P. A. Sauer"}], "author_count": 8}, {"id": "2609.07319", "category": "quant-ph", "title": "Symmetry-resolved tree tensor network analysis of Bell-state discrimination with ancilla-assisted passive linear optics", "abstract": "Ancillary photons allow passive linear-optical Bell-state discrimination to exceed the one-half probability of success limit achievable with vacuum auxiliary modes. For a fixed analyzer and ancillary resource, the discrimination probability is determined by the photon-counting patterns that occur uniquely for each Bell input. We develop a photon-number-resolved tree tensor network method for evaluating these detector supports in recursively structured analyzers. Photon-number conservation and mode symmetries separate most of the Bell-state outputs before the remaining detector support is examined. We establish a tree tensor network based construction to evaluate the remaining support without need of recalling all relevant photon detector patterns separately. We apply the method to recursive, product, and asymmetric ancillary states with up to $32$ optical modes and reproduce known analytical and literature benchmarks. For factorized ancillary resources with fixed photon numbers in halves of the analyzer and the symmetry property used in our analysis, we also derive an exact composition relation; for reflected asymmetric pairings the success probability is the arithmetic mean of the corresponding symmetric configurations. The complete enumeration for smaller systems, permanent-based amplitude calculations, and independent evaluations provide additional checks of the numerical results.", "url": "https://arxiv.org/abs/2609.07319", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anand Kumar"}, {"name": "Wojciech Roga"}, {"name": "Devendra Kumar Mishra"}, {"name": "Masahiro Takeoka"}], "featured_authors": [{"name": "Anand Kumar"}, {"name": "Wojciech Roga"}, {"name": "Devendra Kumar Mishra"}, {"name": "Masahiro Takeoka"}], "author_count": 4}, {"id": "2609.07376", "category": "quant-ph", "title": "Cat-Code-Protected Controlled Quantum Communication via Non-Local CNOT Gates over Star Quantum Networks", "abstract": "Controlled quantum communication enables secure state transfer between a sender and receiver with the assistance of one or more controllers. However, practical implementation over optical fibre networks is severely hindered by amplitude damping, which reduces fidelity exponentially with distance. We address this challenge by combining two powerful techniques: cat-state encoding for error correction and optimal non-local CNOT gates for distributed gate implementation. The protocol eliminates the need for the physical position qubit itself to travel through the optical fibre, reducing damping events. We show, through density-matrix simulations, that our cat-code-protected protocol with a non-local CNOT operation achieves higher fidelity at 50 km, significantly outperforming the standard protocol. We analyse the protocol's security against beam-splitter attacks and show that CHSH tests provide security against beam-splitter attacks on the distributed entanglement resource despite the cat code's error correction. Our results establish that cat-code-protected controlled quantum communication is feasible with current technology and structurally extensible to multiple controllers, providing a theoretical framework for studying error-corrected controlled quantum communication over long-distance star quantum networks.", "url": "https://arxiv.org/abs/2609.07376", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Subham Das"}, {"name": "Abhishek Sharma"}, {"name": "Kailash S"}], "featured_authors": [{"name": "Subham Das"}, {"name": "Abhishek Sharma"}, {"name": "Kailash S"}], "author_count": 3}, {"id": "2609.07380", "category": "quant-ph", "title": "Multi-copy and Catalytic Superactivation of Genuine Multipartite Nonlocality", "abstract": "Genuine multipartite Bell nonlocality (GMNL) aims at capturing correlations between many distant observers that are globally Bell nonlocal. A commonly used definition for GMNL is based on biseparable models constructed from non-signalling correlations. Here we uncover an effect of superactivation of GMNL in this framework. Specifically, by locally wiring together two copies of a biseparable correlation, i.e. not GMNL, one can obtain another correlation that is GMNL. We show that this is possible for any number of parties, and for quantum-realizable correlations. Finally, we show that superactivation of GMNL is also possible at the single-copy level, via a catalytic protocol involving only local wirings. These results question the operational meaning of this definition of GMNL.", "url": "https://arxiv.org/abs/2609.07380", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bora Ulu"}, {"name": "Mirjam Weilenmann"}, {"name": "Nicolas Brunner"}], "featured_authors": [{"name": "Bora Ulu"}, {"name": "Mirjam Weilenmann"}, {"name": "Nicolas Brunner"}], "author_count": 3}, {"id": "2609.07384", "category": "quant-ph", "title": "Wavelength-Uniform Quantum Algorithms for Quantum Dynamics", "abstract": "One of the main challenges in quantum simulation is the prohibitive cost of computing its solutions in the semi-classical regime, in which the de Broglie wavelength is small compared with the characteristic length scale and the solution is highly oscillatory. This difficulty is overcome by using the Weyl variable, under which the solution is not oscillatory. Furthermore, we use the exact Hermite moments and quantum singular value transformation to treat the polynomial and Fourier components of the potential, resulting in a quantum algorithm efficient for {\\it all} ranges of wavelengths. Specifically, it has a {\\it polynomial} complexity in spatial dimension, and discretization and query bounds {\\it without} negative powers of possibly small wavelength, thus enabling it to capture the correct physical observables even if the spatial grid does not resolve the frequency, hence defying the Nyquist-Shannon sampling theorem.", "url": "https://arxiv.org/abs/2609.07384", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shi Jin"}, {"name": "Chuwen Ma"}], "featured_authors": [{"name": "Shi Jin"}, {"name": "Chuwen Ma"}], "author_count": 2}, {"id": "2609.07391", "category": "quant-ph", "title": "Unitary equivalence of Schrödinger and Heisenberg pictures survives in nonlinear quantum mechanics", "abstract": "The equivalence of Schrödinger and Heisenberg pictures is often thought to break down in nonlinear quantum mechanics due to the absence of a state-independent unitary propagator. We show that for Hamiltonians depending on the state through instantaneous expectation values, the equivalence is preserved. While the unitary intertwiner becomes initial-state dependent, it remains well-defined and ensures identical physical predictions in both pictures. We illustrate this with the analytically solvable examples of a nonlinear spin precession and a mean-field harmonic force, as well as in local field theory with mean-field coupling.", "url": "https://arxiv.org/abs/2609.07391", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lajos Diósi"}], "featured_authors": [{"name": "Lajos Diósi"}], "author_count": 1}, {"id": "2609.07454", "category": "quant-ph", "title": "High-purity fluorescence photon bundle emission from two separate emitters", "abstract": "We propose a scheme for generating high-purity fluorescence two-photon bundles from two spatially separate two-level emitters, whose correlated excitation is mediated by a strongly driven auxiliary emitter. Unlike bosonic-mode-based approaches, the finite excitation space of the two target emitters intrinsically excludes higher-excitation manifolds, and thus eliminates impurity photons associated with undesired higher-excitation states. We further analytically characterize the residual population of off-resonant single-excitation states and show that suppressing the corresponding leakage improves photon bundle purity. Our scheme offers a feasible pathway for constructing high-purity quantum light sources with promising applications in quantum information processing.", "url": "https://arxiv.org/abs/2609.07454", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhicai Chen"}, {"name": "Jun Xu"}, {"name": "Deyi Kong"}, {"name": "Xiangming Hu"}, {"name": "Fei Wang"}], "featured_authors": [{"name": "Zhicai Chen"}, {"name": "Jun Xu"}, {"name": "Deyi Kong"}, {"name": "Xiangming Hu"}, {"name": "Fei Wang"}], "author_count": 5}, {"id": "2609.07505", "category": "quant-ph", "title": "Stationary states for a particle in a box with slanted walls", "abstract": "The quantum mechanical problem of a particle in a infinite potential well with slanted walls is studied. The energy eigenvalues are determined by a transcendental equation involving the Airy function of the first kind. Two limiting cases are discussed. Next, the allowed energies are found by graphical and numerical methods. The graphical analysis hints that for large quantum numbers the consecutive energy levels get arbitrarily close together. This asymptotic behavior of the energy spectrum actually holds, as shown by means of an intuitive argument and confirmed by resorting to basic properties of Airy functions. In a sense, Bohr's correspondence principle is more accurately fulfilled than in the cases of the standard particle in a box or the harmonic oscillator. A state is regarded the more confined the less the probability of finding the particle in the classically forbidden region. For some stationary states the confinement degree is calculated and a comparison is made with the harmonic oscillator, for which the ground state is the least confined of all stationary states. In the symmetric case --- right and left walls of equal slope --- something unexpected happens: beyond a certain critical slope the ground state is no longer the least confined eigenstate. Over and above its interesting physical features, this problem provides students with the opportunity to get acquainted with Airy functions, which do not belong to the standard mathematical repertoire of physics undergraduates.", "url": "https://arxiv.org/abs/2609.07505", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nivaldo A. Lemos"}], "featured_authors": [{"name": "Nivaldo A. Lemos"}], "author_count": 1}, {"id": "2609.07579", "category": "quant-ph", "title": "Geometry Dependence of Error Thresholds in Two-Dimensional Toric Codes", "abstract": "We investigate how the lattice geometry influences the error thresholds of two-dimensional toric codes. In the presence of bit- or phase-flip errors, the toric code maps onto the two-dimensional random-bond Ising model (RBIM). We determine the critical behaviour of the RBIM using replica-exchange Monte Carlo simulations. While previous studies have explored thresholds for general lattice geometries under suboptimal decoders such as minimum-weight perfect matching, the rapid development of near-optimal decoders makes resolving the ultimate, maximum-likelihood code capacity relevant. We compute these optimal error thresholds on the Nishimori line for the square, honeycomb, triangular, dice, and kagome lattices. Owing to lattice duality, the phase-flip threshold on a given lattice is equivalent to the bit-flip threshold on its dual. We find that the optimal thresholds of dual-lattice pairs display a characteristic duality-driven splitting around the self-dual square-lattice, mirroring the qualitative behaviour observed for suboptimal decoders. While the average coordination number has the strongest impact on the error threshold, our results demonstrate that the detailed arrangement of vertices and plaquettes also plays a significant role in determining its precise value.", "url": "https://arxiv.org/abs/2609.07579", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "D. Lessing"}, {"name": "A. Langheld"}, {"name": "C. Krämer"}, {"name": "J.A. Koziol"}, {"name": "K.P. Schmidt"}], "featured_authors": [{"name": "D. Lessing"}, {"name": "A. Langheld"}, {"name": "C. Krämer"}, {"name": "J.A. Koziol"}, {"name": "K.P. Schmidt"}], "author_count": 5}, {"id": "2609.07591", "category": "quant-ph", "title": "Topology Obstructs Pure Foundation Neural Quantum States", "abstract": "Foundation models for ground states in spin-1/2 systems are a promising method for problems ranging from quantum chemistry to identifying new phase diagrams. Nearly all such models are currently pure-states that condition on the Hamiltonian's parameters, whose Monte Carlo samples give energy estimates according to the variational principle. In this contribution, we show that this representation is topologically obstructed. For any gapped Hamiltonian family whose ground-state bundle is non-trivial, every continuous normalized state-vector model has zero fidelity with the ground state at some parameter value in the Hamiltonian family. For that value, the energy is at least one spectral gap, $\\Delta$, with an $O(\\Delta)$ gap in an open-neighbourhood of that point. We show that this is a sufficient no-go also in the case of degenerate ground-state manifolds, time dynamics, and periodic systems with mixed space-time topology, demonstrating these obstructions on one- and two-qubit systems. We discuss how this causes a spike in the fidelity susceptibility, giving a numerical signature of a phase-transition where there is none. We then show that operator-valued models canonically avoid these obstructions and preserve topological information, implying a structural necessity in representation for foundation neural quantum states.", "url": "https://arxiv.org/abs/2609.07591", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Timothy Heightman"}, {"name": "Elena Orlova"}, {"name": "Philip Mantrov"}, {"name": "Aleksei Ustimenko"}], "featured_authors": [{"name": "Timothy Heightman"}, {"name": "Elena Orlova"}, {"name": "Philip Mantrov"}, {"name": "Aleksei Ustimenko"}], "author_count": 4}, {"id": "2609.07604", "category": "quant-ph", "title": "Quantum Approximate Counting with Bernoulli Oracles", "abstract": "Quantum counting is a fundamental quantum algorithm that estimates the fraction of marked elements using a membership oracle, achieving a quadratic speedup over classical sampling. The membership oracle, however, assumes exact labeling of each element, but this assumption fails when the labels are inherently probabilistic. We study quantum counting with \\emph{Bernoulli oracles}, where given $m$ Bernoulli distributions with unknown biases $p_1,\\dots,p_m$ and a gap parameter $\\Delta$, the goal is to estimate the fraction $\\rho$ of \\emph{positive} distributions ($p_i\\ge1/2+\\Delta$) to within additive error $\\epsilon$. We prove an upper bound of $\\tilde{O}\\!\\big(\\frac{\\sqrt{\\rho}}{\\Delta\\epsilon}+\\frac{1}{\\Delta\\sqrt{\\epsilon}}\\big)$ queries, achieving a quadratic speedup over the classical sample complexity. % of $\\Theta(\\rho/\\Delta^2\\epsilon^2)$. Our algorithm first uses the Quantum Singular Value Transformation (QSVT) to coherently amplify the bias gap without collapsing the superposition over distributions, and then applies two-stage adaptive amplitude estimation. We complement this upper bound with a near-matching lower bound of $\\Omega(\\sqrt{\\rho}/(\\Delta\\epsilon))$ via a new composition theorem for the quantum adversary method in the Boolean-over-average-case direction. For the special case of a constant gap $\\Delta=\\Theta(1)$, which corresponds to the bounded-error oracle where each query returns the correct label with constant probability, our bounds specialize to $\\tilde{O}\\big(\\frac{\\sqrt{\\rho}}{\\epsilon}+\\frac{1}{\\sqrt{\\epsilon}}\\big)$ and $\\Omega(\\frac{\\sqrt{\\rho}}{\\epsilon})$, thereby characterizing the query complexity of quantum counting with bounded-error oracles.", "url": "https://arxiv.org/abs/2609.07604", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chengshen Gao"}, {"name": "Yongzhen Xu"}, {"name": "Lvzhou Li"}], "featured_authors": [{"name": "Chengshen Gao"}, {"name": "Yongzhen Xu"}, {"name": "Lvzhou Li"}], "author_count": 3}, {"id": "2609.07613", "category": "quant-ph", "title": "Experimental realization of quantum-computing-enhanced sensing", "abstract": "Quantum algorithms offer computational advantages, yet incorporating them into quantum sensing and converting these advantages into enhanced information acquisition remains challenging. Here, we realize quantum-computing-enhanced sensing in a spin-oscillator architecture, where a microwave cavity provides a high-dimensional quantum register and a coupled superconducting qubit serves as the sensor. The unknown signal directly generates the phase oracle operation, establishing a natural physical interface between quantum computation and sensing. We experimentally demonstrate the first Grover search in a bosonic mode and observe quantum amplitude amplification in a Hilbert space spanning more than 128 photons. For the same number of sensing iterations, our protocol extracts more information and resolves more frequency candidates than classical sequential search. Our results establish signal-driven oracles as a route for harnessing oracle-based quantum algorithms and realizing quantum-computing-enhanced sensing.", "url": "https://arxiv.org/abs/2609.07613", "type": "实验", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yifang Xu"}, {"name": "Hongwei Huang"}, {"name": "Yilong Zhou"}, {"name": "Yunlai Zhu"}, {"name": "Chuanlong Ma"}, {"name": "Lida Sun"}, {"name": "Lintao Xiao"}, {"name": "Ziyue Hua"}, {"name": "Weiting Wang"}, {"name": "Zijie Chen"}, {"name": "Weizhou Cai"}, {"name": "Hekang Li"}, {"name": "Haohua Wang"}, {"name": "Xiaoting Wang"}, {"name": "Ming Li"}, {"name": "Chang-Ling Zou"}, {"name": "Luyan Sun"}], "featured_authors": [{"name": "Yifang Xu"}, {"name": "Hongwei Huang"}, {"name": "Yilong Zhou"}, {"name": "Ming Li"}, {"name": "Chang-Ling Zou"}, {"name": "Luyan Sun"}], "author_count": 17}, {"id": "2609.07645", "category": "quant-ph", "title": "Geometric inflation of deviations challenges neural quantum states in dynamics of quantum Ising models", "abstract": "Neural quantum states (NQS) have emerged as a powerful framework for simulating non-equilibrium dynamics in strongly correlated quantum systems, offering scalable variational representations of highly entangled states. Yet, accurate NQS simulations have been found to be surprisingly challenging in some physical regimes of limited complexity. Here, we address paradigmatic quench dynamics of a one-dimensional quantum Ising model as a controlled benchmark. Through supervised state reconstruction we establish substantially tighter empirical upper bounds on the required parameter count than previous estimates, ruling out representational limitations as the key obstruction. Instead, we uncover a geometric inflation of small deviations as a hitherto overlooked challenge for accurate solutions of the infinitesimal time-dependent variational principle (TDVP): the dynamical rotation of the kernel of the quantum geometric tensor (QGT) can suddenly lend physical significance to previously irrelevant parameter deviations. The stability of matrix product state solutions of the same TDVP suggests that the non-linearity of the neural network ansatz is the origin of the sensitivity. These results identify QGT-null-space rotation as a geometric diagnostic of sensitive NQS dynamics and as a concrete target for improving TDVP algorithms", "url": "https://arxiv.org/abs/2609.07645", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wladislaw Krinitsin"}, {"name": "Jonas B. Rigo"}, {"name": "Mohammad Abedi"}, {"name": "Markus Schmitt"}], "featured_authors": [{"name": "Wladislaw Krinitsin"}, {"name": "Jonas B. Rigo"}, {"name": "Mohammad Abedi"}, {"name": "Markus Schmitt"}], "author_count": 4}, {"id": "2609.07674", "category": "quant-ph", "title": "Dynamical Crossover of the Quantum Fisher Information in the Spin-Boson Model", "abstract": "We investigate the dynamical quantum Fisher information of a two-level system coupled to a bosonic environment, focusing on the estimation of the qubit gap. We combine analytical calculations with numerically controlled matrix-product-state simulations. In the exactly solvable pure-dephasing Ohmic regime at zero temperature, the long-time quantum Fisher information displays a coupling-dependent algebraic behavior, leading to a dynamical crossover: it grows without bound at weak coupling, approaches a finite asymptotic value at the crossover coupling, and vanishes at strong coupling. At finite temperature, thermal fluctuations suppress the long-time growth and generate a finite-time maximum, whose dependence on the dephasing coupling retains a clear signa- ture of the zero-temperature crossover. We show that this crossover is absent at zero temperature in non-Ohmic baths: the long-time quantum Fisher information vanishes in the sub-Ohmic and diverges in the super-Ohmic regimes. At non-zero temperature instead, the crossover appears for a super-Ohmic quadratic bath and the crossover coupling becomes temperature-dependent. Moreover, in the zero-temperature Ohmic regime, we introduce an additional amplitude-damping system-bath coupling that induces energy relaxation. This relaxation channel replaces the unbounded long-time growth with a finite asymptotic quantum Fisher information associated with the reduced interacting ground state, while a signature of the pure-dephasing crossover persists in the early-time dynamics. These results establish a direct connection between the low-frequency structure of the bath and the asymptotic metrological behavior of dynamical gap sensing, and show how thermal fluctuations and energy relaxation regularize the ideal pure-dephasing dynamical crossover of the quantum Fisher information.", "url": "https://arxiv.org/abs/2609.07674", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "D. Parlato"}, {"name": "G. Di Bello"}, {"name": "F. Pavan"}, {"name": "G. De Filippis"}, {"name": "C. A. Perroni"}], "featured_authors": [{"name": "D. Parlato"}, {"name": "G. Di Bello"}, {"name": "F. Pavan"}, {"name": "G. De Filippis"}, {"name": "C. A. Perroni"}], "author_count": 5}, {"id": "2609.07702", "category": "quant-ph", "title": "Subsystem self-correction of the GKP qubit", "abstract": "Passive quantum error correction, also known as self-correction, is a holy grail in quantum information science. Recent theoretical advances suggest that the Gottesman-Kitaev-Preskill (GKP) code can exhibit self-correction properties, positioning it as a candidate for the realization of self-correcting quantum memories. In this article, we provide a self-contained derivation of the self-correcting behavior of the ideal GKP Hamiltonian, manifested in the Arrhenius type scaling of the logical lifetime, from a quantum-information perspective based on the subsystem code decomposition. When coupling through the physical quadrature $q$ and $p$, the detailed-balance jump operators decompose into a dominant part acting only on the gauge subsystem and a boundary term that acts non-trivially on the logical qubit. The boundary term is then exponentially suppressed by the Gibbs weights near the edge of the modular cells. In contrast to spin-based quantum memories such as the two-dimensional surface code, the GKP Hamiltonian realizes an effective string tension in modular phase space, whereby the energy cost increases as an error approaches the boundary of a logical sector.", "url": "https://arxiv.org/abs/2609.07702", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Brian Chung Hang Cheung"}, {"name": "Lasse Bjørn Kristensen"}, {"name": "Frederik Nathan"}, {"name": "Michael Kastoryano"}], "featured_authors": [{"name": "Brian Chung Hang Cheung"}, {"name": "Lasse Bjørn Kristensen"}, {"name": "Frederik Nathan"}, {"name": "Michael Kastoryano"}], "author_count": 4}, {"id": "2609.07730", "category": "quant-ph", "title": "Propaq: A Python package for Heisenberg Propagation", "abstract": "We introduce Propaq, a performant and flexible Python package implementing Heisenberg propagation techniques for classically simulating quantum circuits. Propaq is compatible with major quantum software packages like Qiskit and Cirq, and matches or outperforms similar state-of-the-art packages for Heisenberg propagation. Beyond this, Propaq has multiple distinguishing features for simulation and research. These include Heisenberg propagation in any basis, hybrid Schrödinger-Heisenberg simulation, custom truncation and noisy simulation methods, and detailed logging information for analyzing simulation accuracy, runtime, and memory usage. We describe these features, how to use Propaq for research, and its backend implementation.", "url": "https://arxiv.org/abs/2609.07730", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hrishikesh Belagali"}, {"name": "Ryan LaRose"}], "featured_authors": [{"name": "Hrishikesh Belagali"}, {"name": "Ryan LaRose"}], "author_count": 2}, {"id": "2609.07832", "category": "quant-ph", "title": "Restricted typicality in non-equilibrium quantum many-body systems", "abstract": "Characterizing the time evolution of generic quantum many-body systems is a fundamental challenge, as representing the exact state requires exponentially scaling computational resources. While hydrodynamics and statistical mechanics successfully simplify this task by predicting the expectation values of local observables, these macroscopic frameworks provide no information about nonlinear characteristics of the quantum state. In this work, we demonstrate that for systems exhibiting a timescale separation, with dynamics governed by the transport of conserved charges, this lost information can be systematically recovered. By constraining the maximum-entropy Scrooge ensemble solely by the system's slow modes, we accurately reconstruct complex, nonlinear quantum properties of the global time-evolved state, including the half-chain entanglement entropy and the participation entropy in the computational basis. Our results generalize the paradigm of canonical typicality, revealing that a hydrodynamically bottlenecked system behaves as a typical pure state within a dynamically restricted submanifold of the Hilbert space - a phenomenon we term global restricted typicality.", "url": "https://arxiv.org/abs/2609.07832", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Konrad Pawlik"}, {"name": "Piotr Sierant"}, {"name": "Jakub Zakrzewski"}], "featured_authors": [{"name": "Konrad Pawlik"}, {"name": "Piotr Sierant"}, {"name": "Jakub Zakrzewski"}], "author_count": 3}, {"id": "2609.07860", "category": "quant-ph", "title": "Snakes on a Hyper-Plane: Dynamical and Ontological Locality in Everettian Quantum Mechanics", "abstract": "An apparently emerging consensus holds that Everettian Quantum Mechanics (EQM), in the Spacetime State Realism (SSR) version of Wallace and Timpson, involves ontological non-locality (i.e., non-separability) but is fully compatible with the dynamical notion of locality usually taken to be required by relativity. The claim of dynamical locality is based on the fact that the local beables postulated by the theory (namely, Reduced Density Matrices, RDMs, associated with localized regions) are not affected by interventions outside their past light cones. However, the theory's non-separability means that it posits non-local beables (namely RDMs for non-localized regions) in addition to the local ones. We argue here that the involvement of non-local beables introduces complications for extant formulations of dynamical locality and at least suggests, contrary to the emerging consensus, that SSR EQM should perhaps not be considered compatible with relativistic causality after all.", "url": "https://arxiv.org/abs/2609.07860", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Travis Norsen"}], "featured_authors": [{"name": "Travis Norsen"}], "author_count": 1}, {"id": "2609.07869", "category": "quant-ph", "title": "Quantifying Margenau--Hill Nonclassicality", "abstract": "Quasiprobability distributions offer a useful way of describing nonclassical features of quantum systems through their departure from classical probability theory. In this work, we investigate the quantification of nonclassicality associated with the Margenau--Hill quasiprobability (MHQ) distribution using its moments, without requiring reconstruction of the full distribution. First we introduce the logarithmic MHQ negativity as a quantifier of nonclassicality, and then derive a hierarchy of rigorous lower bounds in terms of low-order moments. Within the resulting hierarchy, the fourth-moment bound is the strongest among the bounds based on even moments. For qubits, we further derive a tight upper bound on the exact MHQ negativity and identify the corresponding extremal state. We also obtain an optimal positivity threshold based on the fourth moment for arbitrary pairs of qubit observables. Finally, we show that the relevant moments admit exact multicopy representations, providing a route to their estimation using interferometry or classical shadow techniques. Our results establish a moment-based framework for extracting quantitative information about MHQ negativity from a finite set of low-order observables.", "url": "https://arxiv.org/abs/2609.07869", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sudip Chakrabarty"}], "featured_authors": [{"name": "Sudip Chakrabarty"}], "author_count": 1}, {"id": "2609.07890", "category": "quant-ph", "title": "Riemannian optimization for linear optical problems", "abstract": "Many applications of linear optics in quantum science involve searching for some optimal configuration of a multiport interferometer. For example, to find heralded state preparations, one can optimize the interferometer to maximize the fidelity and success probability of the state preparation. In this paper, we derive a closed analytical formula for the Riemannian gradient of any differentiable function defined over the interferometer unitaries. We use this gradient in Riemannian optimization algorithms, such as gradient descent or BFGS, to find the optimal setup of the interferometer. As an interesting use case, we search for linear optical state preparations, improving some of the success probabilities reported in the literature for NOON or photon catalysis preparations. Finally, we show that our optimizer is orders of magnitude faster than other methods in the literature, opening the door for solving linear optical problems involving more modes and photons.", "url": "https://arxiv.org/abs/2609.07890", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pablo V. Parellada"}], "featured_authors": [{"name": "Pablo V. Parellada"}], "author_count": 1}, {"id": "2609.07894", "category": "quant-ph", "title": "A Novel Steganography Scheme Using Quantum Hilbert Transform", "abstract": "The main goal of steganography is to transmit hidden messages in legitimate-looking communication messages. Phase-domain information hiding, however, has not been fully explored for quantum systems. This work introduces a finite-dimensional Quantum Hilbert Transform (QHT) as a unitary phase operator based on the Quantum Fourier Transform. Using this construction, we develop a QHT-based quantum steganography scheme that embeds classical bits as weak signed phase perturbations of quantum cover states. Bob recovers the hidden message through binary state discrimination, block aggregation, and classical error-correcting decoding.", "url": "https://arxiv.org/abs/2609.07894", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nitin Jha"}, {"name": "Abhishek Parakh"}], "featured_authors": [{"name": "Nitin Jha"}, {"name": "Abhishek Parakh"}], "author_count": 2}, {"id": "2609.07972", "category": "quant-ph", "title": "Quantum Wavefunction Augmentation via Variational Autoencoders", "abstract": "Sample-based quantum diagonalization (SQD) has emerged as a promising route for quantum-centric supercomputing, relying on classical diagonalization of the molecular Hamiltonian within a hardware-sampled determinant subspace. However, its accuracy degrades in strongly correlated regimes where the relevant determinant space exceeds what finite-shot sampling can capture. In this work, we introduce Quantum Wavefunction Augmentation via Variational Autoencoders (Q-WAVE), a hybrid method that combines determinants sampled via SqDRIFT Krylov circuits and configuration interaction singles and doubles (CISD) determinants with generative machine learning. Using a custom $\\beta$-annealed variational autoencoder (VAE) model, Q-WAVE iteratively expands this basis toward the variational ground state. The VAE learns the wavefunction's primary support structure from the combined hardware and CISD seed in a continuous latent space, generating new dominant determinants beyond any fixed excitation hierarchy. The resulting compact wavefunction exceeds what can be extracted from raw hardware samples alone. We demonstrate sub-millihartree accuracy compared to full configuration interaction for $\\text{H}_2\\text{O}$ and $\\text{N}_2$ dissociation. Finally, we establish Q-WAVE's scalability on a 52-qubit ethylene system (achieving sub-millihartree accuracy versus CCSD(T)) and a highly correlated 60-qubit $\\text{Cr}_2$ stress test that attains chemical accuracy upon a final perturbative correction.", "url": "https://arxiv.org/abs/2609.07972", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sonaldeep Halder"}, {"name": "Chayan Patra"}, {"name": "Rahul Maitra"}], "featured_authors": [{"name": "Sonaldeep Halder"}, {"name": "Chayan Patra"}, {"name": "Rahul Maitra"}], "author_count": 3}, {"id": "2609.08099", "category": "quant-ph", "title": "Spectral Sign Implication for Quantum Logic", "abstract": "We study the spectral sign implication for quantum logic, defined by the nonnegative spectral projection of the operator obtained by subtracting the antecedent projection from the consequent projection. The construction agrees with classical material implication on commuting projections and compares arbitrary pairs of projections through the spectral structure of their difference. It satisfies Hardegree's four minimal implicative conditions, his law of contraposition, and a falsity condition. It differs from the standard polynomial implications in that its value need not belong to the ortholattice generated by its arguments. Within a uniform class of Borel constructions for pairs of projections, the operations satisfying entailment, contraposition, and the falsity condition correspond exactly to measurable choices of spectral branch. In the continuous subclass, these three conditions determine the spectral sign implication uniquely. In finite dimensions, the operation is also the largest among the acceptance projections of optimal projective tests for Helstrom discrimination between subspace states with priors proportional to rank. These results connect quantum implication with the operator theory of two projections and binary quantum discrimination.", "url": "https://arxiv.org/abs/2609.08099", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kenji Tokuo"}], "featured_authors": [{"name": "Kenji Tokuo"}], "author_count": 1}, {"id": "2609.08140", "category": "quant-ph", "title": "Quantum algorithm for PageRank computation through multistep quantum resonant transitions", "abstract": "We present a quantum algorithm for obtaining a quantum state that encodes the PageRank vector of the Google matrix through multistep quantum resonant transition (mQRT). In the algorithm, the PageRank vector is encoded in the ground state of a problem Hamiltonian associated with the Google matrix. By dividing the web graph corresponding to the Google matrix into a series of subgraphs with nested structure, we construct a sequence of Hamiltonians based on the subgraphs to form a Hamiltonian evolution path from a simple initial Hamiltonian to the problem Hamiltonian. The ground state of the problem Hamiltonian is obtained by going through ground states of the intermediate Hamiltonians via QRT step by step. This algorithm requires only one ancillary qubit, and the runtime of the algorithm is proportional to the number of steps. It provides a new way for efficiently obtaining the quantum state of the PageRank vector of large-scale networks.", "url": "https://arxiv.org/abs/2609.08140", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chuqing Wang"}, {"name": "Hefeng Wang"}, {"name": "Hua Xiang"}], "featured_authors": [{"name": "Chuqing Wang"}, {"name": "Hefeng Wang"}, {"name": "Hua Xiang"}], "author_count": 3}, {"id": "2609.08233", "category": "quant-ph", "title": "Transversal Fanout for Fault Tolerant Distributed Quantum Computing: Analysis and Application", "abstract": "We study a resource-efficient approach for implementing logical fanout operations in fault-tolerant distributed quantum computing using transversal operations on quantum error-correcting code blocks. Logical fanout, comprising multiple controlled-NOT operations from a common control qubit to target qubits located at remote nodes, is an important primitive for distributed quantum computation but can require substantial non-local communication when implemented directly between encoded blocks. We exploit the structure of encoded blocks and the availability of transversal logical operations to construct distributed fanout circuits that reduce the required non-local operations while preserving the logical action of the fanout operation. The construction is developed for encoded quantum information and illustrated using Bivariate Bicycle (BB)-code blocks. We analyze the resulting physical gate, entanglement, circuit-depth, and ancilla requirements. The approach provides a systematic method for implementing large logical fanout operations across distributed error-corrected quantum processors. Also, we study a distributed implementation of the global gate GCZ involving logical qubits (encoded using BB-code blocks), exploiting the concurrency in transversal distributed fanouts.", "url": "https://arxiv.org/abs/2609.08233", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Seng W. Loke"}], "featured_authors": [{"name": "Seng W. Loke"}], "author_count": 1}, {"id": "2609.08348", "category": "quant-ph", "title": "Instantaneous-Frame Theory of Strongly Driven Parametric Gates", "abstract": "Parametric two-qubit gates using tunable couplers are a promising approach to scalable superconducting quantum processors. However, conventional theories formulated in the idle eigenbasis break down in the large-amplitude regime required for fast gate operations. Here, we show that parametric gates are more naturally and accurately described as coherent rotations between instantaneous eigenstates rather than idle eigenstates. This approach may appear counterintuitive, since instantaneous eigenbases are usually associated with adiabatic dynamics. However, they also form a natural moving frame for driven dynamics, where the non-Abelian Berry connection governs transitions and provides a compact description of the exchange and effective $ZZ$ couplings. We show that this theory achieves quantitative agreement with exact numerical simulations across representative tunable-coupler architectures, including double-transmon, capacitively shunted double-transmon, and single-transmon couplers. The description remains accurate even in regimes where idle-frame descriptions fail, while substantially reducing the reliance on computationally demanding exact simulations. These results establish an instantaneous-frame theory of parametric gates beyond conventional idle-frame models and provide a new perspective on driven quantum dynamics.", "url": "https://arxiv.org/abs/2609.08348", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kentaro Kubo"}, {"name": "Shinichi Inoue"}, {"name": "Jushin Tei"}, {"name": "Yinghao Ho"}, {"name": "Yasunobu Nakamura"}, {"name": "Hayato Goto"}], "featured_authors": [{"name": "Kentaro Kubo"}, {"name": "Shinichi Inoue"}, {"name": "Jushin Tei"}, {"name": "Yinghao Ho"}, {"name": "Yasunobu Nakamura"}, {"name": "Hayato Goto"}], "author_count": 6}, {"id": "2609.08389", "category": "quant-ph", "title": "A theoretical study of subcarrier-wave quantum key distribution system integration with an optical transport network utilizing dense wavelength division multiplexing", "abstract": "In this paper we study the performance of subcarrier-wave quantum key distribution (SCW QKD) in the presence of classical channels of optical transport network utilizing dense wavelength division multiplexing (DWDM). We consider the impact of spontaneous Raman scattering noise as well as the four-wave mixing and channel isolation efficiency. We calculate quantum bit error rate as well as the secure key generation rate of SCW-QKD protocol for different parameters of DWDM system and quantum channel allocations. Our calculations show, that quantum channel allocation at the wavelength of 1310 nm is preferable to allocation at C-band due to lower nonlinear noise, despite fiber's larger attenuation at this wavelength.", "url": "https://arxiv.org/abs/2609.08389", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fedor Kiselev"}, {"name": "Natalia Veselkova"}, {"name": "Roman Goncharov"}, {"name": "Vladimir Egorov"}], "featured_authors": [{"name": "Fedor Kiselev"}, {"name": "Natalia Veselkova"}, {"name": "Roman Goncharov"}, {"name": "Vladimir Egorov"}], "author_count": 4}, {"id": "2609.08406", "category": "quant-ph", "title": "Performance of the subcarrier-wave quantum key distribution in the presence of spontaneous Raman scattering noise generated by classical DWDM channels", "abstract": "In this paper we study performance of the subcarrier-wave quantum key distribution system (SCW QKD) in the presence of spontaneous Raman scattering (SpRS) noise generated by classical channels of dense wavelength division multiplexing (DWDM) network within a single-mode optical fiber. We present the mathematical model for evaluation of the quantum bit error rate (QBER) and the secure key generation rate with the SpRS noise taken into account. We consider two regimes of the SCW QKD system: the continuous wave regime that uses continuous wave laser and the pulsed regime. For these regimes, performance of the system is analyzed depending on receiver sensitivity of classical DWDM. It is found that the pulsed regime outperforms the continuous wave regime in both the secure key generation rate and the maximum achievable distance.", "url": "https://arxiv.org/abs/2609.08406", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fedor Kiselev"}, {"name": "Roman Goncharov"}, {"name": "Natalia Veselkova"}, {"name": "Eduard Samsonov"}, {"name": "Alexei D. Kiselev"}, {"name": "Vladimir Egorov"}], "featured_authors": [{"name": "Fedor Kiselev"}, {"name": "Roman Goncharov"}, {"name": "Natalia Veselkova"}, {"name": "Eduard Samsonov"}, {"name": "Alexei D. Kiselev"}, {"name": "Vladimir Egorov"}], "author_count": 6}, {"id": "2609.08415", "category": "quant-ph", "title": "Time-Dependent Quantum Monte Carlo for fermions: from Bayesian conditioning to spinor dynamics", "abstract": "The time-dependent quantum Monte Carlo method represents a many-electron state by an ensemble of replicas, in which each electron is described by a cloud of walkers which samples its density in physical space, one walker and one guide wave per replica, and it replaces the Hartree potential by a conditional interaction built from the walker positions. The sampling is in physical space rather than in configuration space, which is what keeps the cost polynomial. Here that conditional interaction is derived rather than postulated. The method has so far been applied mostly to opposite-spin electrons, where the exchange is dormant rather than absent, and the present formulation addresses the regime in which it is active. Treating the walker as a localization of its electron to a finite resolution, Bayes theorem and a single empirical substitution yield the Nadaraya-Watson form which the method has used heuristically. The nonlocality length thereby acquires a meaning as the width of the conditioning rather than as a fitted coupling, and the pair and mean-field limits follow from one construction. For fermions, exchange cannot be carried by the walkers and stays in the wave sector, which is what leaves the positive walker sampling free of the sign problem. Because the conditioning removes the gauge freedom which eliminates the orthonormality multipliers in Hartree-Fock, orthonormality is enforced here by a term derived from the constraint. The formulation is generalized to spinors, where the Pauli suppression at coincidence becomes graded by the local spin alignment, and it reduces through the collinear and mean-field limits to the known two-particle spin equations.", "url": "https://arxiv.org/abs/2609.08415", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ivan P. Christov"}], "featured_authors": [{"name": "Ivan P. Christov"}], "author_count": 1}, {"id": "2609.08423", "category": "quant-ph", "title": "Trapdoor Functions with Secure Key Leasing and Copy Protection", "abstract": "Inspired by the no-cloning theorem in quantum theory, a variety of quantum cryptographic primitives with unclonable functionalities, such as secure key leasing and copy protection, have been proposed and attracted significant attention. However, trapdoor functions (TDFs), fundamental primitives in public-key cryptography, have not been extensively studied in these areas. In this work, we initiate a study of TDFs in both secure key leasing and copy protection set
