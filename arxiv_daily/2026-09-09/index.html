lleyors and a hard-wall envelope. This yields closed-form expressions for the two lowest states and their splitting, including the characteristic oscillatory $|\\sin(k_{\\rm min}L)|$ dependence. The variational result agrees with exact diagonalization to within $\\sim1\\%$ for realistic couplings, and provides a simple prescription for tuning the shear strain away from the nodes to enhance the valley splitting. We further show that finite barrier heights primarily renormalize the effective width of the quantum well while preserving the oscillatory dependence. For a wiggle-well coupling $V_w\\cos(k_wz)\\tau_1$, the valleyor representation reveals a crossover near the $k_w=2k_1$ resonance from wiggle-dominated splitting to orbital quantization. Remarkably, at high wiggle-well amplitudes, the empty-box energy scale predominantly dictates the near-resonant valley splitting, while the wiggle-well potential enters only as a sub-leading correction. This behavior can be viewed as asymptotic freedom for spin qubits. Away from resonance, the splitting exhibits a broadly peaked resonance with diffraction-like side-lobes as a function of detuning.", "url": "https://arxiv.org/abs/2609.08839", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Johannes L. P. Steinschuld"}, {"name": "Hendrik J. Bluhm"}, {"name": "Seyed Akbar Jafari"}], "featured_authors": [{"name": "Johannes L. P. Steinschuld"}, {"name": "Hendrik J. Bluhm"}, {"name": "Seyed Akbar Jafari"}], "author_count": 3}, {"id": "2609.08870", "category": "cond-mat", "title": "Stochastic Processes as Non-Metric Geodesics in Information Geometry", "abstract": "We establish a one-to-one correspondence between geodesics associated with the one-parameter family of $\\alpha$-connections on the Gaussian statistical manifold and a class of continuous stochastic processes characterized by a time-independent noise intensity. We demonstrate that geodesics in expectation parameters naturally classify into three distinct geometric categories, among which the Boundary-connecting class allows us to construct an explicit linear stochastic realization with constant diffusion, representing a generalized bridge process. This result demonstrates how continuous stochastic processes within this Gaussian class can be extended along geometric curves. Under appropriate operational limits, this generalized bridge process reduces to fundamental stochastic dynamics, either Ornstein-Uhlenbeck (OU) relaxation or free Brownian diffusion. Crucially, the physical restoring force governing the resulting OU relaxation directly determines the underlying connection parameter $\\alpha$, providing a concrete physical observable to constrain the manifold geometry. Depending on the chosen affine connection representation, this restoring force can be attributed either to scalar curvature or purely to non-metricity, establishing a direct conceptual analogy with the Geometrical Trinity of Gravity. Furthermore, applying this framework to driven stochastic thermodynamics, we show that the work-minimizing optimal protocol in the slow-driving limit coincides precisely with an expectation geodesic of the statistical manifold with non-metricity equipped with $(g, {}^{(1/2)}\\Gamma, {}^{(-1/2)}\\Gamma)$, highlighting the active physical role of non-metricity in information geometry.", "url": "https://arxiv.org/abs/2609.08870", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "T. Koide"}, {"name": "A. van de Venn"}], "featured_authors": [{"name": "T. Koide"}, {"name": "A. van de Venn"}], "author_count": 2}, {"id": "2609.08913", "category": "cond-mat", "title": "Zirconium Carbide as a High-Temperature Benchmark for the Beyond Quasi-Harmonic Method", "abstract": "Molar heat capacity at constant pressure, C_p (T), is a central thermodynamic quantity in materials science, but it remains difficult to calculate accurately from first principles when anharmonic vibrational effects become important. In this work, rocksalt ZrC is used as a high-temperature benchmark for the Beyond Quasi-Harmonic (BQH) method, a prepared-supercell first-principles approach that extracts anharmonic vibrational energy directly from density-functional-theory energy evaluations. The calculated BQH molar heat capacity is compared with CALPHAD reference values, a fully anharmonic thermodynamic-integration calculation, a calculated C_v (T) curve from the present work, and a quasi-harmonic calculation. The BQH curve gives a substantial improvement beyond C_v (T) and beyond the quasi-harmonic approximation. Because ZrC is electronically conductive, an electronic heat-capacity correction was also estimated from the density of states at the Fermi level and added to the vibrational BQH result. This correction brings the calculated molar heat capacity into close agreement with the fully anharmonic theoretical benchmark through approximately 1200 K. These results show that the BQH method fully captures important anharmonic phonon contributions missing from ordinary quasi-harmonic calculations.", "url": "https://arxiv.org/abs/2609.08913", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Christopher M. Stanley"}], "featured_authors": [{"name": "Christopher M. Stanley"}], "author_count": 1}, {"id": "2609.08928", "category": "cond-mat", "title": "Thermomechanics of dense granular materials: a particle-scale perspective", "abstract": "The paper presents a broad thermomechanic framework for the isothermal rate-independent constitutive behavior of dense granular materials. The essential quantities in this framework are directly measurable in discrete element (DEM) simulations: free energy, dissipation, stress, and strain. The paper proposes that energy and dissipation are governed by two sets of internal variables: fabric variables that control the reversible stiffness and structure variables associated with internal sliding. The relevant fabric variables are identified and measured with simulations. Two hypotheses are considered for the structure variables: the macro-scale irreversible strain and an aggregate measure of the micro-scale frictional forces among sliding contacts. Both hypotheses are tested with simulations, which allow direct calculation of the internal variables. The paper then demonstrates the manner in which the measured variables are applied in incremental constitutive models. Among other findings are the following. (1) Dissipation from contact sliding is pervasive and occurs in all directions of incremental loading. (2) Contact motions are not reversed by a reversal of the strain direction, and contacts continue to slide when loading is reversed. (3) The free energy can not be assumed smoothly differentiable; instead, Gâteaux derivatives must be used with irreversible effects. (4) Basic assumptions of elastoplasticity are contravened: no region of purely reversible strain exists, no uniform yield direction exists, no uniform flow direction exists, and irreversible strain is not proportional to the projected total strain. A three-mechanism elastoplasticity model, however, closely fit the DEM results, and methods are demonstrated for quantifying the model. The results emphasize that advanced constitutive models are needed for capturing the general incremental behavior of granular materials.", "url": "https://arxiv.org/abs/2609.08928", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthew R. Kuhn"}], "featured_authors": [{"name": "Matthew R. Kuhn"}], "author_count": 1}, {"id": "2609.08932", "category": "cond-mat", "title": "Real-time Dyson expansion for the nonequilibrium $GW$ approximation: Correlated spectra and dependence on the reference propagator", "abstract": "Electronic spectra provide direct insight into the excitations and correlations of condensed matter systems. Their description requires electron correlations beyond mean field. In equilibrium, the $GW$ approximation has become the method of choice for many materials. Extending this approximation to nonequilibrium, however, is challenging. Full two-time $GW$ simulations within the nonequilibrium Green's functions approach scale at least cubically with propagation time, whereas improved scaling schemes such as time-local (adiabatic) approximations or the generalized Kadanoff--Baym ansatz usually retain only mean-field character in the spectra. The recently introduced real-time Dyson expansion recovers dynamical correlations in the spectrum at time-linear cost, but has so far been restricted to the second-order Born approximation with mean-field reference propagators. Here we formulate and implement the RT-DE for the nonequilibrium $GW$ self-energy with reference propagators of general form whose off-diagonal evolution is time local. In particular, we assess Hartree--Fock propagators, propagators with statically screened exchange with nonequilibrium screening, and a correlated propagator based on the Hartree--Fock GKBA. Benchmarks against exact diagonalization for a driven two-band lattice model with long-range interactions show that the mean-field and statically screened references yield the most accurate spectra, including satellite structures absent at mean-field level, whereas the GKBA-based approach best captures scattering-induced occupation dynamics, but artificially broadens and splits spectral peaks. When applied to large systems that are beyond the reach of exact methods, the scheme resolves the excitonic replica of the valence band and satellites identified as exciton shake-up, as well as their reshaping with increasing excitation density.", "url": "https://arxiv.org/abs/2609.08932", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Erik Schroedter"}, {"name": "Jan-Philip Joost"}, {"name": "Michael Bonitz"}, {"name": "Vojtech Vlcek"}], "featured_authors": [{"name": "Erik Schroedter"}, {"name": "Jan-Philip Joost"}, {"name": "Michael Bonitz"}, {"name": "Vojtech Vlcek"}], "author_count": 4}, {"id": "2609.08976", "category": "cond-mat", "title": "Water, vacancies, and competing exchange interactions in Prussian blue analogues: a neutron diffraction study of field and dehydration-driven magnetic transitions", "abstract": "We report a neutron diffraction study of the structural and magnetic properties of a family of ferro- and ferrimagnetic Prussian blue analogues (PBAs), $A_4$[Fe(CN)$_6$]$_{2.7}$ ($A$ = Co, Mn, Ni), Rb$_2$Ni$_4$[Fe(CN)$_6$]$_{3.3}$, and Mn$_4$[Cr(CN)$_6$]$_{2.7}$, as a function of temperature (2--450~K) and applied magnetic field. All bimetallic compounds of the Fm$\\overline{3}$m family exhibit a broad diffuse feature at low scattering angle, which we identify, through comparison with the cation-stabilized Rb$_2$NiFe framework, as an intrinsic signature of correlated vacancies and their associated interstitial water. High-temperature diffraction reveals a continuous crossover from positive to negative thermal expansion in CoFe and MnFe upon dehydration, while NiFe remains structurally robust up to 450~K. At low temperature, all compounds order in a collinear ferrimagnetic state with propagation vector $\\mathbf{k}=(0,0,0)$, except MnFe, which adopts a partially frustrated magnetic structure with $\\mathbf{k}=(1,0,0)$. A moderate magnetic field of $B_c = 1.3$~T drives a spin reorientation in MnFe toward the collinear $\\mathbf{k}=(0,0,0)$ ferrimagnetic state common to the other compounds; the same transition is independently induced by dehydration. A minimal Heisenberg model shows that this transition results from a near-compensation between antiferromagnetic Mn--Fe coupling and a geometrically frustrated antiferromagnetic Mn--Mn interaction on the face-centered-cubic Mn sublattice, placing MnFe in the vicinity of a magnetic compensation point. These results resolve a longstanding ambiguity in the interpretation of the Fe $K$-edge XMCD response of MnFe-based PBAs, and establish water content as a key parameter controlling both the structural and magnetic stability of this family of materials, with direct relevance to their use as battery electrodes.", "url": "https://arxiv.org/abs/2609.08976", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "N. S. Dhami"}, {"name": "C. V. Colin"}, {"name": "V. Nassif"}, {"name": "O. Fabelo"}, {"name": "T. Nait"}, {"name": "A. Bleuzen"}, {"name": "A. Bordage"}, {"name": "V. Balédent"}], "featured_authors": [{"name": "N. S. Dhami"}, {"name": "C. V. Colin"}, {"name": "V. Nassif"}, {"name": "A. Bleuzen"}, {"name": "A. Bordage"}, {"name": "V. Balédent"}], "author_count": 8}, {"id": "2609.08983", "category": "cond-mat", "title": "Time-Dependent Density Functional Theory with Coulomb Interactions", "abstract": "We provide the first fully rigorous justification of time-dependent density functional theory in the continuum: Given a time-dependent density, we prove that there exists an external potential, unique up to a time-dependent constant, such that the corresponding Schrödinger equation reproduces the given density. This potential can be obtained with an iteration scheme. Our argument covers Coulomb interactions and does not need any Taylor expansion in time. It instead requires analyticity in space for the density and potential, which is compatible with extended nuclei.", "url": "https://arxiv.org/abs/2609.08983", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Asbjørn Bækgaard Lauritsen"}, {"name": "Mathieu Lewin"}, {"name": "Jakob Oldenburg"}], "featured_authors": [{"name": "Asbjørn Bækgaard Lauritsen"}, {"name": "Mathieu Lewin"}, {"name": "Jakob Oldenburg"}], "author_count": 3}, {"id": "2609.08987", "category": "cond-mat", "title": "Exact Phase-Space Rotation in the Trapped Quantum Calogero Model", "abstract": "We develop a microscopic phase-space description of the quantum Calogero model in the presence of an external harmonic confining potential. Building on the quantum Lax-pair structure, we construct a Hermitian Wigner operator whose expectation value obeys the exact phase-space evolution equation d_t rho + lambda d_x rho - Omega^2 x d_lambda rho = 0 for arbitrary initial states and to all orders in the interaction strength. The resulting dynamics is a rigid rotation in phase space with period 2 pi/Omega, providing a microscopic realization of the isochronous dynamics of the trapped Calogero model. We further show that the moments of the phase-space density form rotating multiplets rather than independent conserved quantities. In particular, within the quadratic sector, the unique conserved combination is proportional to the trapped Hamiltonian, providing a nontrivial consistency check of the construction. In the limit Omega -> 0, the equation reduces to the exact free-streaming equation of the untrapped model.", "url": "https://arxiv.org/abs/2609.08987", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Akash Sarkar"}], "featured_authors": [{"name": "Akash Sarkar"}], "author_count": 1}, {"id": "2609.08996", "category": "cond-mat", "title": "Probing Antialtermagnetism via Orbital-Field-Induced Spin Splitting", "abstract": "Layer compensation can conceal spin polarization behind a spin-degenerate bulk spectrum in antialtermagnets, preventing spectroscopic identification of the underlying magnetic order. Here we show that the orbital effect of an in-plane magnetic field converts the hidden spin texture into an observable spin splitting of opposite momentum parity, thereby restoring spectroscopic access. Once the parity of the hidden exchange order is determined, complementary response functions in the weak-field regime further resolve its wave character: within a minimal model, we illustrate that a band sum rule over the induced band splittings isolates the momentum gradient of the form factor and differentiates hidden even-parity orders, whereas for odd-parity sectors the induced net spin polarization exhibits characteristic field-amplitude and angular dependences. These results establish orbital-field-induced spin splitting as a generic route to identifying the hidden altermagnetic order parameter without layer resolution.", "url": "https://arxiv.org/abs/2609.08996", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zi-Ting Sun"}], "featured_authors": [{"name": "Zi-Ting Sun"}], "author_count": 1}, {"id": "2609.09017", "category": "cond-mat", "title": "Hilbert space connectivity in non-Hermitian many-body systems: emergent scale-dependent amplification and constraint-induced skin localization", "abstract": "Various exotic many-body phenomena such as quantum scars and fractons have been linked to Hilbert space fragmentation. In this work, we find that in non-Hermitian settings, Hilbert space connectivity has an even more universal and fundamental influence, tightly controlling the nature of spectral amplification and state localization. Far more complicated than real-space lattices, non-Hermitian many-body Hilbert space graphs not only possess intricate competing amplification channels, but also global feedback loops connecting remote Fock states related by particle symmetry. These features lead to amplification behavior with unconventional scaling and localization properties. Particle occupation constraints can furthermore remove selected Hilbert space pathways, leading to robust unipolar and asymmetric bipolar skin localization in otherwise reciprocal processes. These results extend beyond simple interacting bosonic models and establish Hilbert space connectivity as a versatile control knob for many-body non-Hermitian critical transitions.", "url": "https://arxiv.org/abs/2609.09017", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zichang Hao"}, {"name": "Wen-Tan Xue"}, {"name": "Ching Hua Lee"}], "featured_authors": [{"name": "Zichang Hao"}, {"name": "Wen-Tan Xue"}, {"name": "Ching Hua Lee"}], "author_count": 3}, {"id": "2609.09057", "category": "cond-mat", "title": "Discretization strategies for colloidal particles in multiparticle collision dynamics simulations", "abstract": "Discrete models are frequently used in multiparticle dynamics simulations to capture hydrodynamic interactions between colloidal particles and the solvent as well as to represent anisotropic pairwise interactions between colloidal particles; however, there is currently limited guidance on how to reliably parameterize these models. Here, we first compare strategies for selecting the density and mass of discrete surface sites used to couple colloidal particles to the solvent, finding that using a minimum of 2 sites per unit area with a scheme that matches the total mass and moment of inertia for a neutrally buoyant solid particle produces reliable and accurate results for the transport properties of colloidal particles at both infinite dilution and in suspension. We then compare strategies for representing the excluded volume of nearly-hard shape-anisotropic colloidal particles using a collection of discrete interaction sites with isotropic repulsion, finding that having a discrepancy between the nominal volume and the excluded volume of the particle can significantly affect suspension transport properties. This discrepancy can be mitigated by placing the interaction sites inside and tangent to the surface of the colloidal particle. We expect these findings to help construct discrete models for colloidal particles with less sensitivity to parameterization.", "url": "https://arxiv.org/abs/2609.09057", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Michaela Bush"}, {"name": "Michael P. Howard"}], "featured_authors": [{"name": "Michaela Bush"}, {"name": "Michael P. Howard"}], "author_count": 2}, {"id": "2609.09065", "category": "cond-mat", "title": "Divergent Orbital Diamagnetism from Chiral Edge States in Chern Insulators", "abstract": "Two-dimensional massless Dirac systems, exemplified by graphene, are known to exhibit a divergent orbital diamagnetic susceptibility that scales linearly with system size. Motivated by viewing a chiral edge state as one half of an enlarged analogue of a benzene ring, we study Chern insulators under open boundary conditions and find the same divergent scaling. This giant diamagnetism is robust against disorder, revealing its topological nature. Our results further suggest a profound connection to the divergent diamagnetism of massless Dirac systems.", "url": "https://arxiv.org/abs/2609.09065", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nobuyuki Okuma"}], "featured_authors": [{"name": "Nobuyuki Okuma"}], "author_count": 1}, {"id": "2609.09067", "category": "cond-mat", "title": "On spectral properties of Generalized Kadanoff--Baym Ansatz", "abstract": "The Generalized Kadanoff--Baym Ansatz with mean-field propagators is increasingly used to simulate non-equilibrium quantum fermionic and bosonic systems. Compared with the full Kadanoff--Baym equations, its mean-field propagators substantially reduce computational cost, enabling simulations with computational effort that scales linearly with propagation time. However, the time-diagonal structure of the Generalized Kadanoff--Baym Ansatz obscures spectral properties within the collision integral of the transport equation. Here, we recover and investigate these hidden spectral properties using the extended Generalized Kadanoff--Baym Ansatz. For a Hubbard cluster, we compare ground-state spectral functions obtained with the extended Generalized Kadanoff--Baym Ansatz against those from standard Kadanoff--Baym equations. At moderate interaction strengths, the spectral functions show good agreement. At large interaction strengths, however, significant deviations emerge, and the spectral function obtained with the extended Generalized Kadanoff--Baym Ansatz becomes negative. These results demonstrate that, despite its computational advantages, the Generalized Kadanoff--Baym Ansatz has important limitations in strongly interacting regimes and may produce unphysical spectral properties when interactions become sufficiently large.", "url": "https://arxiv.org/abs/2609.09067", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Miroslav Hopjan"}], "featured_authors": [{"name": "Miroslav Hopjan"}], "author_count": 1}, {"id": "2609.09068", "category": "cond-mat", "title": "Renormalization of One-Dimensional Semirelativistic Bosons with Contact Interactions", "abstract": "We study one-dimensional spinless bosons with semirelativistic spinless-Salpeter dispersion and attractive pairwise contact interactions. Because the dispersion becomes linear at large momentum, the contact interaction is marginal by power counting and produces a logarithmic ultraviolet divergence. We construct the renormalized many-body theory using an enlarged Fock space and a Schur-complement representation of the resolvent, eliminating the bare coupling in favor of the physical zero-total-momentum two-body bound-state energy. The resulting cutoff-independent resolvent defines a self-adjoint Hamiltonian in each fixed particle-number sector. We treat the two-body problem explicitly and show, in the norm-resolvent sense, that the nonrelativistic limit reproduces the attractive Lieb--Liniger Hamiltonian. We also formulate a mean-field approximation directly within the renormalized theory. In the massless and deeply bound large-particle-number regimes, it predicts an exponentially increasing binding scale whose exponent is determined by a one-dimensional variational problem.", "url": "https://arxiv.org/abs/2609.09068", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fatih Erman"}, {"name": "O. Teoman Turgut"}], "featured_authors": [{"name": "Fatih Erman"}, {"name": "O. Teoman Turgut"}], "author_count": 2}, {"id": "2609.09074", "category": "cond-mat", "title": "Effects of Interaction Range on Fluid Multicriticality: A Computational Study of an Interconverting Lattice Model", "abstract": "The range of intermolecular interactions plays a central role in determining the nature of phase behavior and critical phenomena. It is well established through studies of the Ising model that as interaction range increases, Monte Carlo simulations progressively approach meanfield predictions as the effects of critical fluctuations are suppressed. In this work, we investigate how varying interaction range influences fluid multicriticality using an interconverting lattice model that exhibits both Ising-like liquid-gas criticality and symmetric fluid tricriticality (similar to that in the superfluid $^4$He-$^3$He mixture). This minimal model serves as a representative system for exploring the evolution of competing critical points within a generic framework. We analyze the model using both meanfield theory and three-dimensional Monte Carlo simulations while systematically varying the number of interacting neighbors, $Z_n$, from 6 to 388. We find that the system with nearest-neighbor interactions ($Z_n=6$) reveals only two types of multicritical behavior, while for larger interaction ranges, four distinct archetypes emerge. We demonstrate the convergence of the simulation results to those of the meanfield theory as the number of interacting neighbors tends to infinity, and we discuss the results within the framework of crossover critical phenomena.", "url": "https://arxiv.org/abs/2609.09074", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Thomas J. Longo"}, {"name": "Sergey V. Buldyrev"}, {"name": "Frédéric Caupin"}, {"name": "Mikhail A. Anisimov"}], "featured_authors": [{"name": "Thomas J. Longo"}, {"name": "Sergey V. Buldyrev"}, {"name": "Frédéric Caupin"}, {"name": "Mikhail A. Anisimov"}], "author_count": 4}, {"id": "2609.09097", "category": "cond-mat", "title": "Junction-free polarity-tunable superconducting diode effect enables XNOR logic operation", "abstract": "The realization of the superconducting diode effect (SDE), characterized by non-reciprocal supercurrent, is a major step towards dissipationless logic circuits. A polarity-tunable superconducting diode with high diode efficiency primarily consists of Josephson-junction architectures that couple two superconducting regions via a weak link. Realizing an SDE without a weak-link junction would reduce fabrication complexity, lower electrical noise, and minimize dependence on junction quality. Here, we report an all-vdW, highly efficient, junction-free SDE in NbSe2, enabled by proximity-induced symmetry breaking from a strong uniaxial ferromagnet Fe3GeTe2 (F3GT). Superconducting diode efficiency of up to 30% is achieved at a small magnetic field of 50 mT. A field-free diode rectification effect is realized with diode polarity that is tunable by the F3GT spin polarization. Furthermore, by employing the active-field dependence of the SDE, a two-input exclusive-NOR (XNOR) logic gate operation is demonstrated. The findings highlight the potential utilization of magnetic proximity effect towards realizing junction-free superconducting diodes for high-performance, energy-efficient logic circuits.", "url": "https://arxiv.org/abs/2609.09097", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alapan Bera"}, {"name": "Soumik Mukhopadhyay"}], "featured_authors": [{"name": "Alapan Bera"}, {"name": "Soumik Mukhopadhyay"}], "author_count": 2}, {"id": "2609.09118", "category": "cond-mat", "title": "Topological Impurity Bands", "abstract": "The effects of disorder on topological phases of matter are typically either preservation of topology or its destruction. For example, the quantum Hall effect's quantization and chiral edge mode remain robust until a strong-disorder percolation transition exits the topological phase. Disorder can also enlarge a preexisting topological phase, yielding a topological Anderson insulator (TAI). However, the reliance of TAI and other theoretical treatments on perturbatively averaging out long-wavelength randomness suggests that additional effects might appear when the disorder involves localized defects. Here we show that a finite density of randomly distributed defects can generate various new topological phase transitions. This route to disorder-induced topology can be viewed as the formation of topological impurity bands (TIB) and is applicable even if the initial clean model is a trivial band insulator. The theory relies on an orbital-dependent vorticity of impurity bound states, which we derive analytically near a generic Dirac cone phase transition as well as using the Chern insulator lattice models of Qi-Wu-Zhang and Haldane. Their numerically computed phase diagrams at 3% defect density show robust topological transitions in distinct TIB and TAI regimes, suggesting a local route to topological phases.", "url": "https://arxiv.org/abs/2609.09118", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arnab Seth"}, {"name": "Itamar Kimchi"}], "featured_authors": [{"name": "Arnab Seth"}, {"name": "Itamar Kimchi"}], "author_count": 2}, {"id": "2609.09129", "category": "cond-mat", "title": "Anderson orthogonality scaling in the Rabi-driven heavy Fermi polaron", "abstract": "The Anderson orthogonality catastrophe (AOC) is a paradigmatic many-body phenomenon in which a local perturbation induces a macroscopic response of a Fermi sea. We probe signatures of the AOC by coherently driving heavy Fermi polarons in an ultracold $^6$Li-$^{133}$Cs mixture. We observe a power-law dependence of the measured Rabi frequency on the drive strength, with exponents consistent with AOC predictions. Finite-temperature simulations quantitatively reproduce the observed scaling, indicating that AOC signatures persist beyond the idealized zero-temperature, infinite-mass limit. The damping of the Rabi oscillations provides access to polaron dephasing and reveals a nonmonotonic drive dependence, qualitatively consistent with current theories. Our results establish coherently driven impurities as a versatile probe of quantum many-body dynamics through local coherent control.", "url": "https://arxiv.org/abs/2609.09129", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Michael Rautenberg"}, {"name": "Tobias Krom"}, {"name": "Eugen Dizer"}, {"name": "Olivier Bleu"}, {"name": "Eleonora Lippi"}, {"name": "Tilman Enss"}, {"name": "Manfred Salmhofer"}, {"name": "Lauriane Chomaz"}, {"name": "Matthias Weidemüller"}], "featured_authors": [{"name": "Michael Rautenberg"}, {"name": "Tobias Krom"}, {"name": "Eugen Dizer"}, {"name": "Manfred Salmhofer"}, {"name": "Lauriane Chomaz"}, {"name": "Matthias Weidemüller"}], "author_count": 9}, {"id": "2609.09139", "category": "cond-mat", "title": "Large-scale dynamics of integrable quenches", "abstract": "The Ballistic Macroscopic Fluctuation Theory (BMFT) is a path-integral based approach to treat large-scale correlations in interacting integrable systems which, so far, has only been applied to quasi-equilibrium settings. In this paper we extend this approach to integrable quench problems and, to illustrate it, we compute the time evolution of the full-counting-statistics (FCS) of a conserved charge. We identify the relevant path integral, solve it via saddle-point, and obtain a set of partial differential equations describing the dynamics of the FCS. We solve these equations explicitly for free fermionic systems and for the interacting cellular automaton Rule 54. In both cases, we recover the known exact results. For Rule 54, our construction moreover completes the solution across the entire ballistic window.", "url": "https://arxiv.org/abs/2609.09139", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "David X. Horvath"}, {"name": "Bruno Bertini"}], "featured_authors": [{"name": "David X. Horvath"}, {"name": "Bruno Bertini"}], "author_count": 2}, {"id": "2609.05606", "category": "hep-th", "title": "Cosmology, Cluster Algebras, and $\\boldsymbol{u}$", "abstract": "We explore the cluster algebra structures present in the wavefunction and correlators of conformally coupled scalar fields in de Sitter space. To connect cosmological kinematics to cluster variables, we utilize the so-called $u$-variables that appear on both sides. Since $u$-variables parameterize a rigid space, it is natural to identify the ones that appear from cosmological graphs and those that arise from cluster algebras. This provides a mapping between kinematic variables and cluster variables. For $n$-site chain Feynman graphs, this gives a coordinate-invariant relation to $A_{2n-2}$-type cluster algebras, while in the case of $n$-site cycle graph momentum integrands, the relevant cluster algebra is $B_{2n-1}$, as found previously. Since kinematic variables are mapped to nonlinear combinations of cluster variables, cluster compatibility imposes strong conditions on possible symbol entries. We use this notion of compatibility to bootstrap the symbol. In the chain case, both the cosmological wavefunction and products of lower-point functions satisfy cluster compatibility, with the correlator a particular combination, so that the wavefunction and correlator share the same cluster structure. In the cycle case, however, the wavefunction appears to be uniquely selected by the cluster structure, and the correlator does not display the same compatibility as the wavefunction.", "url": "https://arxiv.org/abs/2609.05606", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daniel Glazer"}, {"name": "Austin Joyce"}], "featured_authors": [{"name": "Daniel Glazer"}, {"name": "Austin Joyce"}], "author_count": 2}, {"id": "2609.05613", "category": "hep-th", "title": "Matrix Holography on an Optical Lattice", "abstract": "We propose an analog quantum-simulation protocol based on a lattice of atomic ensembles and time-averaged Floquet dynamics to construct the four-body potentials that typically appear in bosonic BFSS-like matrix quantum mechanics. In contrast to gate-based digital implementations requiring deep circuits, our approach generates the target model through a fixed set of control stages per Floquet cycle, keeping the number of consecutive unitaries constant with respect to the matrix size $N$. The principal scaling cost in our construction is given by the frequency range required to control the growing lattice. We show that this cost grows at most as $\\mathcal{O}(N^3)$, giving a polynomial scaling route to large$-N$, attractive to experimental implementation. Additionally, we demonstrate that the coupling parameter can be tuned beyond $\\mathcal{O}(1)$, enabling the simulation of strong-coupling physics necessary for holographic phases.", "url": "https://arxiv.org/abs/2609.05613", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Robin Löwenberg"}, {"name": "Julian Sonner"}], "featured_authors": [{"name": "Robin Löwenberg"}, {"name": "Julian Sonner"}], "author_count": 2}, {"id": "2609.05630", "category": "hep-th", "title": "Equation of State of a Strongly Coupled Perfect Fluid with Spin from Holography", "abstract": "We derive the equation of state of a strongly coupled relativistic perfect fluid with finite spin in $2+1$ dimensions using holography. The dual gravitational description is provided by a spinning black hole in $AdS_4$, whose Hawking temperature, angular velocity, and Bekenstein-Hawking entropy determine the thermodynamic properties of the boundary fluid. We obtain the equation of state and analyze its local thermodynamic stability, finding a critical rotation above which the fluid becomes thermodynamically unstable providing a bound for the rotation of a strongly coupled quark gluon plasma at temperature $T$ and angular velocity $\\omega$ given by $\\frac{4\\pi T}{\\omega}> 2.77239$. Remarkably, the same gravitational solution contains a second black hole associated with a second boundary. Although this black hole is non-spinning, its dual fluid rotates and possesses a distinct, ``exotic'' equation of state. Our results provide a holographic equation of state for strongly coupled matter with finite spin and establish a direct connection between black-hole rotation, intrinsic angular momentum, and the thermodynamic stability of relativistic fluids.", "url": "https://arxiv.org/abs/2609.05630", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andres Anabalon"}, {"name": "Horatiu Nastase"}], "featured_authors": [{"name": "Andres Anabalon"}, {"name": "Horatiu Nastase"}], "author_count": 2}, {"id": "2609.05653", "category": "hep-th", "title": "Birth and Death in Two-color ABJM", "abstract": "We solve exactly the leading quantum deformation of the two-point metric of half-BPS operators in $U(2)\\times U(2)$ ABJM theory at finite rank. In the natural coupling-independent Schur frame, its tree-normalized two-loop correction is a Jacobi operator on the chain of two-row Young diagrams. A ground-state transform maps it to a reversible birth--death process whose stationary distribution is the Plancherel measure conditioned on diagrams with at most two rows. Its eigenmodes are Racah polynomials, its large-$n$ limit approaches radial Ornstein--Uhlenbeck dynamics, and an equivalent two-spin description identifies the Jacobi operator with a restricted $SU(2)$ Casimir.", "url": "https://arxiv.org/abs/2609.05653", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Marco S. Bianchi"}], "featured_authors": [{"name": "Marco S. Bianchi"}], "author_count": 1}, {"id": "2609.05685", "category": "hep-th", "title": "Searching for Bell-CHSH-Violating Bose Operators", "abstract": "We construct explicit bounded wedge-local observables for Bell inequalities in a relativistic free Bose field using an exact spectral-fibre approach. The construction turns the relevant canonical pair into measurable fibre involutions and provides an operator-algebraic proof of wedge locality, self-adjointness, unitarity, and exact anticommutation. Translation-cell observables yield an explicit Bell violation with a controlled infinite-tail error, while inclusion of reflection branches produces a substantially larger violation. These results demonstrate that simple bounded local observables can expose Bell nonlocality constructively in relativistic quantum field theory and that the translation-cell result is not artifact but a strictly valid lower bound.", "url": "https://arxiv.org/abs/2609.05685", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "T. Newton"}, {"name": "S. P. Sorella"}], "featured_authors": [{"name": "T. Newton"}, {"name": "S. P. Sorella"}], "author_count": 2}, {"id": "2609.05716", "category": "hep-th", "title": "Landau and cluster structures of one-loop amplitudes in ${\\mathcal N}=4$ SYM in dimensional regularization", "abstract": "Generalized unitarity, Landau analysis, and cluster adjacency encode complementary aspects of scattering amplitudes. We use one-loop planar $\\mathcal N=4$ SYM amplitudes in dimensional regularization, at arbitrary multiplicity and helicity, to make their interface explicit. The weight-two symbol decomposes into an LS part, in which maximal-cut leading singularities furnish the coefficients and Landau loci associated with nested cuts organize the ordered symbol entries, an algebraic four-mass sector, and residual terms. Cancellations of certain letters contributed by individual box integrals, as well as further simplifications, are explained by the two-mass triangle relations among box coefficients. We prove these relations using a BCFW-like application of the global residue theorem and show that they can be understood geometrically as different dissections of the same region in the tree amplituhedron obtained by projecting the loop geometry of a triple cut. We then prove that the full rational symbol, including its infrared-divergent part, obeys cluster adjacency in the flag cluster algebra $\\mathrm{Fl}_{2,4;n}$ for all multiplicities and helicities. Within the sector depending only on momentum-twistor four-brackets, we conjecture a stronger cluster property in $\\operatorname{Gr}(4,n)$ for all helicities and prove it for NMHV amplitudes: the amplitude admits a representation in which every pole of each coefficient is compatible with both symbol entries. Finally, we observe that the algebraic four-mass letters, although non-rational, exhibit a suggestive Sklyanin-bracket pattern.", "url": "https://arxiv.org/abs/2609.05716", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Athanasia-Konstantina Angelopoulou"}, {"name": "Ruth Britto"}, {"name": "Matteo Parisi"}], "featured_authors": [{"name": "Athanasia-Konstantina Angelopoulou"}, {"name": "Ruth Britto"}, {"name": "Matteo Parisi"}], "author_count": 3}, {"id": "2609.06075", "category": "hep-th", "title": "Non-critical M-Theory and the Resolved Conifold: Refinement and Nonperturbative Completion", "abstract": "We extend the Hořava--Keeler correspondence between finite-temperature non-critical M-theory and the resolved-conifold A-model to the refined theory. The grand potential of the stationary rotating non-critical M-theory vacuum reproduces the refined Gopakumar--Vafa expansion, with the angular chemical potential deforming the $\\Omega$-background away from the self-dual locus $\\eps_1=-\\eps_2$. At finite thermal radius, we establish an exact match with the nonperturbative conifold completions proposed by Hattab--Palti and by Chuang in the unrefined and refined cases, respectively. Both the one-particle Schwinger integrand and its integration cycle arise from the non-critical M-theory spectrum and resolvent, providing a microscopic spectral realization of these completions. The correspondence fixes the nonconstant BPS sector and the cubic local contribution, while the remaining polynomial ambiguity and the modulus-independent constant-map sector require separate normalization. We explain why the single primitive spinless multiplet of the resolved conifold makes this identification possible, and discuss what additional charge- and spin-dependent microscopic data would be needed for an extension to more general local Calabi--Yau geometries.", "url": "https://arxiv.org/abs/2609.06075", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fengjun Xu"}], "featured_authors": [{"name": "Fengjun Xu"}], "author_count": 1}, {"id": "2609.06224", "category": "hep-th", "title": "The Wilson-line-dressed charged sector of scalar QED: superselection and the infraparticle", "abstract": "We develop a manifestly gauge and Lorentz invariant perturbative calculus to study the finite time and distance evolution of the electrically charged states created by Wilson-line-dressed scalar field operators in scalar quantum electrodynamics. By an Osterwalder-Schrader reflection and Euclidean gluing, the overlap of two dressed states is expressed as a Euclidean 2 point function of dressed operators, which is then evaluated in renormalized perturbation theory with a Stueckelberg photon mass as a gauge, BRST and Lorentz invariant infrared cutoff. This renders explicit and computable in closed form several structural features of the charged sector that have so far been accessible mainly through non-perturbative or algebraic arguments. We find that states dressed by non-parallel Wilson lines are ``cloud orthogonal\". Their overlap vanishes as a power of the infrared regulator, with an exponent that depends only on the angle between the two dressings and is an infrared analogue of the cusp anomalous dimension with the difference that it is one-loop exact whenever the charged matter is mass-gapped. Charged states are thereby superselected by the orientation of their dressing. Within a superselection sector the 2 point function is infrared finite but exhibits the infraparticle. The mass shell pole is replaced by the edge of a branch cut. As a result, the asymptotic spread of a dressed charge is a power law in proper time with a one-loop-exact computable exponent depending on the dressing and on the direction of motion. We show that although cloud orthogonality and the infraparticle are each extremely sensitive to fundamental infrared cutoffs, the infraparticle scaling law persists across a wide window of proper time.", "url": "https://arxiv.org/abs/2609.06224", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gordon W. Semenoff"}, {"name": "Conor Waterfield"}], "featured_authors": [{"name": "Gordon W. Semenoff"}, {"name": "Conor Waterfield"}], "author_count": 2}, {"id": "2609.06363", "category": "hep-th", "title": "Finite stress-tensor moment tomography of boundary-graviton coherences", "abstract": "Einstein gravity in 2+1 dimensions is a topological theory that does not admit the existence of local bulk gravitons. However, $\\mathrm{AdS}_3$ gravity with Brown-Henneaux boundary conditions does admit the existence of boundary gravitons, which are described by Virasoro descendants. An observer living on the asymptotic boundary can use finite order moments of the boundary stress tensor as a probe of these states. We fix one highest-weight module and assume that the Shapovalov forms are nondegenerate. We also assume that the unknown state the observer is probing has a known finite descendant support and that interlevel coherence is part of the unknown data. We find that, given a descendant at level $N\\geq2$, stress moment tomography at order $N$ (meaning $N$ stress moment insertions) is informationally incomplete, while tomography with stress moments of order $N+1$ is informationally complete. This is to say that, on the unitary regular locus, orthogonal pure states can have the same complete order-$N$ record. Likewise, for exact finite-window result for levels through $L\\geq2$, tomography of order $L$ is incomplete while tomography of order $L+1$ recovers every density-matrix block. Corresponding exact thresholds hold in the full left-right theory. In heavy sectors for which a semiclassical bulk interpretation exists, these thresholds say when finite-support boundary-graviton states first become distinguishable.", "url": "https://arxiv.org/abs/2609.06363", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dyuman Bhattacharya"}, {"name": "Robert B. Mann"}], "featured_authors": [{"name": "Dyuman Bhattacharya"}, {"name": "Robert B. Mann"}], "author_count": 2}, {"id": "2609.06552", "category": "hep-th", "title": "Fermionic hidden zeros", "abstract": "We uncover and prove a general class of hidden zeros in tree-level amplitudes with massless fermions. For arbitrary even numbers and arbitrary arrangements of massless real adjoint fermions and gluons, color-ordered gauge-theory amplitudes in $D=4,6,10$ vanish on general rectangular kinematic loci supplemented by species-dependent bridge conditions. The fermion--fermion bridge is governed simply by the vector current $\\chi_i\\gamma^\\mu\\chi_j$, while mixed and gluonic bridges are fixed by the corresponding gauge-covariant contractions. A worldsheet analysis proves the result at arbitrary multiplicity and traces its universality to the local fusion channels $ff\\to g$, $fg/gf\\to f$, and $gg\\to g$, with no new primitive bridge structures appearing at higher fermion multiplicity. The same mechanism extends to ten-dimensional amplitudes with gravitons and arbitrary even numbers of gravitinos in factorized gamma-traceless polarizations, and to single-trace Einstein-Yang-Mills amplitudes with adjoint gluinos and gravitons. These results expose a finite local structure underlying fermionic hidden zeros across gauge and gravitational amplitudes.", "url": "https://arxiv.org/abs/2609.06552", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yong Zhang"}, {"name": "Pengfei Zhu"}], "featured_authors": [{"name": "Yong Zhang"}, {"name": "Pengfei Zhu"}], "author_count": 2}, {"id": "2609.06711", "category": "hep-th", "title": "Constructing the Monopole Formula for $A$-Type Good Quivers via Quiver Yangians", "abstract": "Based on the conjectured (and checked for tree-type quivers) quiver Yangian/Coulomb branch algebra correspondence, we give a quiver Yangian interpretation of the monopole formulas for 3D $\\mathcal N=4$ good $A$-type quiver gauge theories, also known as the $T_\\rho(SU(N))$ theories. Using the algebra action on the $\\frac12$-BPS vortices, we reorganize the generators of the truncated shifted quiver Yangian into boundary-adapted generators, and obtain the classical relations in terms of $U(N)$ Casimirs on the Slodowy slice $\\mathcal S^{\\mathfrak{gl}_N}_\\rho$, whose coordinates are given by these boundary-adapted generators. We also show that the boundary-adapted generators and the Casimir relations have the correct fugacities as predicted by the Hall-Littlewood expression of the monopole formula for $T_\\rho(SU(N))$, hence reconstructing it as the Hilbert series of the truncated shifted quiver Yangian.", "url": "https://arxiv.org/abs/2609.06711", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tiantai Chen"}], "featured_authors": [{"name": "Tiantai Chen"}], "author_count": 1}, {"id": "2609.06995", "category": "hep-th", "title": "Dual N=1 Lagrangians for Argyres-Douglas theories", "abstract": "We find a new set of four-dimensional $\\mathcal{N}=1$ Lagrangian gauge theories that flow in the infrared to $\\mathcal{N}=2$ Argyres-Douglas theories of type $(A_1, A_{2n})$, $(A_1, A_{2n+1})$, $(A_1, D_{2n+1})$, and $(A_1, D_{2n+2})$. The new dual theories are given by $SU(2)^n$ quiver gauge theories with a number of gauge-singlet flip fields. This description provides dual theories for the previous $\\mathcal{N}=1$ Lagrangian realizations given by $Sp(n)$ or $SU(n+1)$ gauge theories, exchanging the rank and the number of nodes in a quiver diagram.", "url": "https://arxiv.org/abs/2609.06995", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Minseok Cho"}, {"name": "Jaewon Song"}], "featured_authors": [{"name": "Minseok Cho"}, {"name": "Jaewon Song"}], "author_count": 2}, {"id": "2609.07221", "category": "hep-th", "title": "Tachyon-massless couplings at order $α'$ in bosonic string theory", "abstract": "Recently, it has been proposed that the classical effective action of bosonic string theory should contain only couplings with an even number of tachyon fields. We employ the T-duality procedure to derive such couplings at order \\(\\alpha'\\) (four-derivative order) for the tachyon and massless fields. We first observe that, through higher-derivative field redefinitions of the tachyon potential term, one can choose a scheme in which, apart from the tachyon potential itself, all remaining couplings involve only covariant derivatives of the tachyon and the massless fields. We then construct a minimal basis of such couplings at four-derivative order, consisting of 14 independent terms. Imposing T-duality reduces this set to 6 nonzero couplings, expressed in terms of two unfixed parameters. One of these parameters is determined by matching to the known effective action in the zero-tachyon limit, while the other is fixed by comparison with the sphere-level S-matrix element of four tachyon vertex operators. This latter comparison also establishes that the coefficient of the \\(T^4\\) term in the tachyon potential is positive. Remarkably, the tachyon mass term and this quartic term are consistent with a potential of the form \\((2/\\alpha')(-1+\\cos T)\\), which implies that the closed string tachyon condenses to the minimum of the potential at \\(T=\\pi\\), thereby generating an Anti-de Sitter spacetime with cosmological constant \\(\\Lambda =-4/\\alpha'\\).", "url": "https://arxiv.org/abs/2609.07221", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mohammad R. Garousi"}], "featured_authors": [{"name": "Mohammad R. Garousi"}], "author_count": 1}, {"id": "2609.07514", "category": "hep-th", "title": "Can one hear the shape of a black hole singularity?", "abstract": "We compute the large overtone quasinormal frequencies $\\omega_n$ of asymptotically AdS black holes with interior near-singularity Kasner epochs. We show that the Kasner exponents can be extracted cleanly from the large $n$ behaviour of the dispersion $\\partial \\omega_n/\\partial k^2$ at $k=0$, where $k$ is a boundary momentum. We show that Kasner transitions, as occur in BKL near-singularity chaos, are audible in the quasinormal frequencies and reveal a map between overtone number $n$ and proper time to the singularity. Our results are obtained using a WKB analysis that isolates non-analytic exponents, determined by the near-singularity spacetime, from non-universal data such as the optical distance from the boundary to the singularity. We check our formulae in several numerical models.", "url": "https://arxiv.org/abs/2609.07514", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sean A. Hartnoll"}, {"name": "Alexander Zhiboedov"}], "featured_authors": [{"name": "Sean A. Hartnoll"}, {"name": "Alexander Zhiboedov"}], "author_count": 2}, {"id": "2609.07612", "category": "hep-th", "title": "Exact spin form factors and correlations at a massive Kramers-Wannier interface", "abstract": "We determine exact finite-volume spin form factors and two-point correlations for a massive Kramer--Wannier interface in the scaling Ising model, separating ordered and disordered phases. The interface admits two complementary lattice realizations: a self-dual inhomogeneous Ising chain whose continuum limit has a sign-changing Majorana mass profile, and, after exchanging Euclidean space and time, a mixed thermal average amenable to Toeplitz/Fredholm methods. Combining these descriptions, we obtain the exact Neveu-Schwarz-Ramond spin matrix elements and a factorized Fredholm determinant for the interface correlator. Defect TCSA and independent fermionic spin-chain calculations confirm the predicted spectrum and matrix elements.", "url": "https://arxiv.org/abs/2609.07612", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zoltan Bajnok"}, {"name": "Yizhuang Liu"}], "featured_authors": [{"name": "Zoltan Bajnok"}, {"name": "Yizhuang Liu"}], "author_count": 2}, {"id": "2609.07765", "category": "hep-th", "title": "(Anti-)De Sitter null strings and Carroll-Weyl symmetry", "abstract": "We construct a $dS_d$ null string in a novel way by lifting the standard tensionless string to $R^{1,d}$. Gauging worldsheet scale symmetry introduces terms in the action breaking translation invariance, but preserving the $dS_d$ symmetry $SO(1,d)$. Choosing a De Sitter symmetric gauge fixing of the scale symmetry yields a $d$ dimensional theory which we show has all the expected properties of $dS_d$ tensionless strings. The action happens to be the intriguing Carrol-Weyl symmetric string action in $R^{1,d}$, now with a clear target space interpretation in $d$ dimensions. That it does not, as recently claimed, represent a ($d+1$)-dimensional string in flat ($d+1$)-dimensional Minkowski space settles an apparent issue with the Carrol-Weyl string model. Furthermore, while there are clear obstacles for similar formulations of tensile strings in (A)dS backgrounds, our new insights are easily modified to the formulation of Anti-De Sitter tensionless strings. That our construction generates a curved geometry purely algebraically may have even wider applications.", "url": "https://arxiv.org/abs/2609.07765", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ulf Lindström"}, {"name": "Bo Sundborg"}], "featured_authors": [{"name": "Ulf Lindström"}, {"name": "Bo Sundborg"}], "author_count": 2}, {"id": "2609.07788", "category": "hep-th", "title": "Eikonal Scattering of Two D0-branes with Graviton Emission", "abstract": "We study the emission of a massless closed-string state in the scattering of two D0-branes using the boundary-state formalism. We compute the corresponding five-point amplitudes for graviton and dilaton emission in bosonic string theory and in type II superstring theory, and analyze their field-theory limit. For nonzero impact parameter, the resulting amplitudes are reproduced by an independent calculation in the worldline formulation of the corresponding low-energy theory.", "url": "https://arxiv.org/abs/2609.07788", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Paolo Di Vecchia"}, {"name": "Dawid Maskalaniec"}], "featured_authors": [{"name": "Paolo Di Vecchia"}, {"name": "Dawid Maskalaniec"}], "author_count": 2}, {"id": "2609.07801", "category": "hep-th", "title": "Logarithmic correction to the entropy of near-extremal higher-curvature black holes", "abstract": "The spherically symmetric sector of broad classes of $D$-dimensional gravitational theories can be effectively described by general two-dimensional Horndeski theories. Exploiting this correspondence, we study the low-temperature dynamics of near-extremal black hole solutions of the parent theories by deriving a universal near-horizon effective description in terms of Jackiw--Teitelboim (JT) gravity. We explicitly show that the logarithmic quantum correction to the entropy, $S_{\\rm JT}=\\frac{3}{2}\\log \\left(T/T_{\\rm breakdown} \\right)$, previously derived for near-extremal black holes in Einstein gravity coupled to matter from the one-loop exact JT partition function, is universal across all models admitting an effective two-dimensional Horndeski description. We determine the general form of the scale at which this correction becomes dominant, $T_{\\rm breakdown}$, in terms of the data of the $D$-dimensional theories. We illustrate our general results with charged black holes in Lovelock gravities and regular black holes in Quasitopological gravities.", "url": "https://arxiv.org/abs/2609.07801", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pablo Bueno"}, {"name": "Pablo A. Cano"}, {"name": "Robie A. Hennigar"}, {"name": "Javier Moreno"}, {"name": "Ángel J. Murcia"}, {"name": "Guido van der Velde"}], "featured_authors": [{"name": "Pablo Bueno"}, {"name": "Pablo A. Cano"}, {"name": "Robie A. Hennigar"}, {"name": "Javier Moreno"}, {"name": "Ángel J. Murcia"}, {"name": "Guido van der Velde"}], "author_count": 6}, {"id": "2609.07826", "category": "hep-th", "title": "SolutionsX: supergravity theories/solutions as code, with an agentic workflow for machine-verifiable physics", "abstract": "A supergravity solution in the literature is an artifact that cannot be verified without re-deriving it: conventions might not be clearly stated, papers have typos, algebra is tedious. SolutionsX is a Mathematica package that turns an xAct environment, whatever physics it may describe, into a stored, machine-verifiable record: code that replays in a fresh kernel, carries its own verification, and can later be fetched for re-use or extension. The shipped examples are supergravity theories and their solutions, but the scope is anything xAct reaches: abstract tensors, differential forms, spinors in any dimension. We follow one published solution through the entire workflow, benchmark the package's component engine against xAct's, and report on three blind runs of an agentic workflow in which an AI coding agent, given the package and a small toolkit, correctly codified a recent paper in under three hours. A database of such records is useful to researchers today and gives agents worked examples to learn from. The package acts as an internal verifier during the thought process of an agent: a claim is checked in the kernel before it is made.", "url": "https://arxiv.org/abs/2609.07826", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vasil Dimitrov"}], "featured_authors": [{"name": "Vasil Dimitrov"}], "author_count": 1}, {"id": "2609.07828", "category": "hep-th", "title": "Unitary quantum conformal Bondi-Metzner-Sachs field theories", "abstract": "We impose unitarity constraints on two-dimensional field theories whose symmetries form the quantum conformal Bondi-Metzner-Sachs algebra, which combines conformal symmetries with asymptotic symmetries of asymptotically flat spacetimes. Positivity constraints put bounds on the central charge, 0<c<2.053. Positivity of the associated vertex algebra allows only four central charges, c = 1, 3/2, 13/7, 2. Thus, only four candidates for unitary field theories remain. We calculate their spectra of primaries and show that they are compatible with BPS-like and holographic inequalities.", "url": "https://arxiv.org/abs/2609.07828", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daniel Grumiller"}, {"name": "Iva Lovrekovic"}], "featured_authors": [{"name": "Daniel Grumiller"}, {"name": "Iva Lovrekovic"}], "author_count": 2}, {"id": "2609.07829", "category": "hep-th", "title": "Diffeomorphism-invariant Approach to Asymptotically Safe Quantum Gravity", "abstract": "We provide a novel diffeomorphism-invariant approach to asymptotically safe metric quantum gravity. It is based on physics-informed renormalisation group flows with a renormalisation group kernel that guarantees diffeomorphism invariance at each renormalisation group step. Importantly, it also allows us to control and maintain the relevance counting of operators in metric quantum gravity. The resulting effective action is quantum diffeomorphism-invariant and background-independent. As a first non-trivial application, we compute the Reuter fixed point in a manifestly diffeomorphism-invariant way. This computation is augmented with a detailed discussion of regularisation dependence and a systematic estimate of the errors arising from approximations.", "url": "https://arxiv.org/abs/2609.07829", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Friederike Ihssen"}, {"name": "Benjamin Knorr"}, {"name": "Silas Mezger"}, {"name": "Jan M. Pawlowski"}, {"name": "Paul P. Sprenger"}], "featured_authors": [{"name": "Friederike Ihssen"}, {"name": "Benjamin Knorr"}, {"name": "Silas Mezger"}, {"name": "Jan M. Pawlowski"}, {"name": "Paul P. Sprenger"}], "author_count": 5}, {"id": "2609.07841", "category": "hep-th", "title": "Truncated Polyakov bootstrap for BCFTs: Neumann-Dirichlet flow and Ising special transition", "abstract": "We extend the recently proposed truncated Polyakov bootstrap to boundary conformal field theories (BCFTs). The formalism uses the analytic functional framework to find approximate solutions of BCFT crossing. We show that a generic nonperturbative solution can be identified by relating it to a family of deformations around generalized free fields (GFF) with a fixed boundary condition. We show this by tracking the flow of BCFT data from GFF with Neumann boundary condition to that with Dirichlet. The same method is then used for the 3d Ising special transition, using the perturbative Wilson-Fisher description as the deformation to identify it. The BCFT data obtained are in remarkable agreement with existing lattice results where available, and are otherwise new.", "url": "https://arxiv.org/abs/2609.07841", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kaushik Kangsabanik"}, {"name": "Apratim Kaviraj"}, {"name": "Astha Tiwari"}], "featured_authors": [{"name": "Kaushik Kangsabanik"}, {"name": "Apratim Kaviraj"}, {"name": "Astha Tiwari"}], "author_count": 3}, {"id": "2609.07845", "category": "hep-th", "title": "Scattering of Null strings - Flipped Vacuum & CHY", "abstract": "We investigate the scattering of null tensionless strings. Classical null strings, given by the ILST action, give rise to three distinct quantum theories built on different vacua and representations of the underlying 2d Conformal Carroll algebra (CCA) which form the residual gauge symmetries on the null worldsheet. In this paper, we are interested in the quantum theory built out of the so-called ``flipped'' vacuum which realises the highest weight representation of the 2d CCA. By considering a novel class of vertex operators, intimately connected to the compactified null string, we build scattering amplitudes of the theory. We show that one naturally obtains the Cachazo-He-Yuan (CHY) formulae when one considers scattering of massless states in the null ``flipped'' string.", "url": "https://arxiv.org/abs/2609.07845", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arjun Bagchi"}, {"name": "Sachin Grover"}, {"name": "Sharang Rajesh Iyer"}, {"name": "Amartya Saha"}, {"name": "Stephan Stieberger"}], "featured_authors": [{"name": "Arjun Bagchi"}, {"name": "Sachin Grover"}, {"name": "Sharang Rajesh Iyer"}, {"name": "Amartya Saha"}, {"name": "Stephan Stieberger"}], "author_count": 5}, {"id": "2609.07846", "category": "hep-th", "title": "Double Copy from the Flipped Null String", "abstract": "We study the double-copy structure of tree amplitudes of the bosonic null string in the flipped vacuum. We show that its level-one vector correlator supplies the Cachazo-He-Yuan (CHY) kinematic half-integrand of the higher-derivative $(DF)^2$ gauge theory, while distinguished compact momentum-winding sectors generate the complementary Parke-Taylor factor. For factorized level-two states, the same Carrollian world-sheet produces two kinematic half-integrands and hence the symmetric double copy to the six-derivative Weyl-cubed graviton sector. Lattice sectors with common external momenta reproduce the Bern-Carrasco-Johansson (BCJ) ordering relation and the corresponding field-theory Kawai-Lewellen-Tye (KLT) representation. These results provide a direct Carrollian world-sheet origin of the double copy and point toward a current-algebra realization of the emergent color sector compatible with the $O(d,d)$ structure of the compact lattice.", "url": "https://arxiv.org/abs/2609.07846", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arjun Bagchi"}, {"name": "Sachin Grover"}, {"name": "Sharang Rajesh Iyer"}, {"name": "Amartya Saha"}, {"name": "Stephan Stieberger"}], "featured_authors": [{"name": "Arjun Bagchi"}, {"name": "Sachin Grover"}, {"name": "Sharang Rajesh Iyer"}, {"name": "Amartya Saha"}, {"name": "Stephan Stieberger"}], "author_count": 5}, {"id": "2609.07866", "category": "hep-th", "title": "Entanglement Wedge Reconstruction Beyond the Large N Limit via the Twirled Petz Map", "abstract": "Entanglement wedge reconstruction provides the sharpest formulation of bulk locality in AdS/CFT, identifying the entanglement wedge as the largest bulk region reconstructible from a boundary subregion. While this statement is well understood at leading order in the large N expansion through both modular flow and Petz map reconstruction, its extension beyond the semiclassical regime has remained unclear. In this work, we show that quantum error correction provides the natural framework for addressing this problem. At leading order, we reproduce the known leading-order reconstruction formulas, and by employing the twirled Petz map, we obtain a systematic and explicit method for incorporating subleading 1/N corrections. Beyond the leading approximation, we have obtained an explicit bi-local correction controlled by a subleading Petz kernel. Our results establish a controlled approach to bulk reconstruction beyond large N and sharpening the role of quantum error correction in holography. This framework provides a controlled path toward understanding bulk reconstruction in fully quantum gravitational settings.", "url": "https://arxiv.org/abs/2609.07866", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arash Alipour Shahmiri"}, {"name": "Maryam Sharifian"}, {"name": "Niloofar Vardian"}], "featured_authors": [{"name": "Arash Alipour Shahmiri"}, {"name": "Maryam Sharifian"}, {"name": "Niloofar Vardian"}], "author_count": 3}, {"id": "2609.07872", "category": "hep-th", "title": "ABJM/BMN Index Matching in the Plane-Wave Limit", "abstract": "We establish coefficientwise equality between the refined supersymmetric indices of ABJM theory and the BMN matrix model in the plane-wave limit at every fixed positive Chern-Simons level k. For multi-membrane families with fixed multiplicities, and hence fixed finite ABJM gauge rank, the equality holds as all longitudinal momenta tend to infinity with their pairwise differences fixed. Scalar-dressed equal-flux ABJM monopoles correspond to BMN vacua of fuzzy-sphere membranes: multiplicities count coincident membranes, whereas flux magnitudes give the momentum per membrane along the M-theory circle. At the index level, the associated Higgs residues yield a diagonal-holonomy integral for the ABJM plane-wave contribution, whose monopole-harmonic kernel agrees with the BMN matrix-harmonic kernel up to the finite BMN upper-spin cutoff. At finite momentum, the full index difference splits into the non-plane-wave remainder and the harmonic tail above this cutoff. Increasing k shifts the former to higher fugacity grade without changing the surviving kernel or the cutoff contribution. This gives a coefficientwise, multi-membrane extension of the earlier single-membrane index relation.", "url": "https://arxiv.org/abs/2609.07872", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chi-Ming Chang"}, {"name": "Kangning Liu"}], "featured_authors": [{"name": "Chi-Ming Chang"}, {"name": "Kangning Liu"}], "author_count": 2}, {"id": "2609.07911", "category": "hep-th", "title": "Spherical DAHA as an algebra of framed BPS states", "abstract": "Line operators of 4d $\\mathcal{N}=2$ theories of class $\\mathcal{S}$ of type $A_{N-1}$ in a half Omega background provide a physical model for $SL_N$ skein algebras. In this paper we extend this correspondence to $GL_N$ skein algebras and prove that the $GL_2$ skein algebra of the punctured torus is isomorphic to the $GL_2$ spherical double affine Hecke algebra ${{\\mathbf{S}\\ddot{\\mathbf{H}}}}^{q,t}_2$. The construction is based on $\\mathfrak{q}$-nonabelianization for the $SU(2)$ $\\mathcal{N}=2^*$ gauge theory, which realizes the skein algebra as a quantum torus algebra associated with the Seiberg-Witten curve. Different regions of the Coulomb branch yield distinct presentations of ${{\\mathbf{S}\\ddot{\\mathbf{H}}}}^{q,t}_2$. These range from the Macdonald $q$-difference module in Fenchel-Nielsen (weak coupling) charts to cluster-type realizations in Fock-Goncharov (strong coupling) charts. Transitions between these descriptions are governed by the vanilla BPS spectrum of the $\\mathcal{N}=2^*$ theory via framed wall-crossing, which provides a unified physical framework for several representations of spherical DAHA.", "url": "https://arxiv.org/abs/2609.07911", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kunal Gupta"}, {"name": "Pietro Longhi"}], "featured_authors": [{"name": "Kunal Gupta"}, {"name": "Pietro Longhi"}], "author_count": 2}, {"id": "2609.07928", "category": "hep-th", "title": "Wilson loops, M2-branes and strings", "abstract": "We establish a universal approach for studying the semiclassical quantization of both probe M2-branes and fundamental strings in asymptotically AdS$_{4}$ backgrounds. On the field theory side, their partition functions are dual to the vacuum expectation value of half-BPS Wilson loops of a class of three-dimensional $\\mathcal{N}\\geq 2$ Chern-Simons-matter theories. Utilizing this universal approach we arrive at novel predictions for the semiclassical behaviour of the Wilson loop or upon availability match our results with the previously obtained expressions via supersymmetric localization. We also show that the correct choice of holographic ensemble suggests that the semiclassical quantization of probe M2-branes yields the full perturbative answer in the rank of the gauge group $N$ for the dual Wilson loop. This is a proceedings contribution to the ''Athens Workshop in Theoretical Physics: 10th Anniversary'', held at the National and Kapodistrian University of Athens on December 17-19 2025.", "url": "https://arxiv.org/abs/2609.07928", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexia Nix"}], "featured_authors": [{"name": "Alexia Nix"}], "author_count": 1}, {"id": "2609.08052", "category": "hep-th", "title": "Fortuitous ABJM Operators as Black Holes", "abstract": "Given a superconformal gauge theory at a fixed loop order, BPS states can be studied in two ways --- by enumerating cohomology classes of a nilpotent supercharge or by diagonalizing the anomalous dimension matrix. The second one allows for a deeper look at how holographic theories distinguish between operators based on whether they are dual to horizonless geometries or black holes. To this end, we carry out the diagonalization in $\\mathrm{U}(N)_k \\times \\mathrm{U}(N)_{-k}$ ABJM theory with $N$ as a formal parameter. This makes it possible to define trajectories of operators and focus on the fortuitous ones which are characterized by being BPS at only finitely many values of $N$. In contrast to $\\mathcal{N} = 4$ Super Yang-Mills, where it has been numerically prohibitive to study more than one of these, ABJM gives us access to 16 such trajectories along with their descendants. We show that they take an especially simple form at large $N$ where they agree with the predictions of integrability. We also show that many of them, as with black holes, can only be dressed by certain types of gravitons and comment on how this exercise in cohomology also has implications for properties of the full operators. Finally, we show that the gap to the first non-BPS state in ABJM theory qualitatively differs from that of $\\mathcal{N} = 4$ Super Yang-Mills in the expected way.", "url": "https://arxiv.org/abs/2609.08052", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Connor Behan"}, {"name": "Leonardo Pipolo de Gioia"}], "featured_authors": [{"name": "Connor Behan"}, {"name": "Leonardo Pipolo de Gioia"}], "author_count": 2}, {"id": "2609.08111", "category": "hep-th", "title": "Bogomol'nyi equations for Kruglov strings", "abstract": "We construct the Bogomol'nyi equations for Abelian gauge--Higgs vortices in which the Maxwell gauge sector is replaced by Kruglov nonlinear electrodynamics, a power-law family that interpolates between Maxwell theory, Born--Infeld electrodynamics, and exponential electrodynamics, characterized by a dimensionless exponent $\\sigma$. Using the stressless method, we derive a pair of first-order equations directly from the vanishing of the spatial stress tensor, without assuming the Higgs potential \\textit{a priori}. For generic $\\sigma$, the gauge and Higgs sectors are coupled through an implicit algebraic relation. We therefore introduce a constitutive map $\\Phi(Y;\\sigma)$ and analyze its monotonicity and range to determine the conditions for a smooth admissible Bogomol'nyi branch. For $\\sigma>1/2$, the constitutive map is strictly monotonic and unbounded, whereas for $0<\\sigma<1/2$ it possesses a finite maximum; the marginal case $\\sigma=1/2$ is bounded. These properties yield explicit bounds on the nonlinear parameter $\\beta$ for the latter cases. We further obtain closed-form constitutive relations, BPS potentials, and gauge-field equations for six representative values of $\\sigma$, spanning linear, quadratic, and cubic algebraic structures. The corresponding vortex profiles are then computed numerically. The resulting BPS string tension is purely topological, $\\mu_{\\rm BPS}=2\\pi n$, independent of both $\\sigma$ and $\\beta$.", "url": "https://arxiv.org/abs/2609.08111", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "I. Praseyto"}, {"name": "U. Ubaydillah"}, {"name": "H. S. Ramadhan"}], "featured_authors": [{"name": "I. Praseyto"}, {"name": "U. Ubaydillah"}, {"name": "H. S. Ramadhan"}], "author_count": 3}, {"id": "2609.08378", "category": "hep-th", "title": "Scalar Casimir Effect on a Two-Dimensional Sphere with a Wu--Yang Magnetic Monopole", "abstract": "We investigate the Casimir effect of a complex scalar field on a two-dimensional sphere threaded by a fixed Wu--Yang magnetic monopole at the center. In this background the charged scalar field is a section of a nontrivial complex line bundle over $S^2$, reflecting the monopole's nontrivial topology. We solve the Klein--Gordon equation analytically and compute the Casimir energy using a generalized Abel--Plana formula for multivalued functions. We find that the monopole can reverse the sign of the Casimir pressure, turning an attractive force into a repulsive one when the monopole strength is sufficiently large. This behavior persists across a broad range of curvature couplings and suggests that Wu--Yang monopoles may provide a source of repulsive vacuum stress, with possible implications for gravitational and cosmological settings.", "url": "https://arxiv.org/abs/2609.08378", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jun-Cheng Zhang"}, {"name": "Xiao-Yin Pan"}, {"name": "Juhao Wu"}, {"name": "Qing-hai Wang"}], "featured_authors": [{"name": "Jun-Cheng Zhang"}, {"name": "Xiao-Yin Pan"}, {"name": "Juhao Wu"}, {"name": "Qing-hai Wang"}], "author_count": 4}, {"id": "2609.08584", "category": "hep-th", "title": "Gravitational decoherence from soft-graviton $S$-matrix", "abstract": "We revisit gravitational decoherence of matter superpositions using the leading soft sector of the graviton $S$-matrix. Starting from Weinberg's soft theorem and the overlap of coherent radiation states, we derive, for branch configurations with the same total four-momentum, a gauge-invariant, nonnegative leading-soft decoherence exponent and evaluate the polarization sum and angular integrals exactly at this order. In the vacuum, coherence between branches with distinguishable soft radiation vanishes as the infrared cutoff is removed. The leading nonrelativistic term is purely quadrupolar as a consequence of energy--momentum conservation. We extend the analysis to single- and two-mode squeezed graviton states, including the two-mode case motivated by inflation. Squeezing can enhance or suppress decoherence depending on the relative phase, while phase averaging gives an enhancement governed by the graviton occupation. For a phase-averaged relic background with an approximately flat energy-density spectrum over the relevant soft frequency band, the sharp-cutoff identification of the infrared scale with the inverse observation time gives a contribution that grows with the gravitational-wave energy density and with the fourth power of the observation time. These results connect soft-graviton scattering, infrared quantum information, and decoherence in nonvacuum gravitational backgrounds.", "url": "https://arxiv.org/abs/2609.08584", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hiroki Matsui"}], "featured_authors": [{"name": "Hiroki Matsui"}], "author_count": 1}, {"id": "2609.08648", "category": "hep-th", "title": "Symplectic Chern-Simons theories dual to Abelian rank-$0$ theories", "abstract": "We propose that the 3d symplectic Chern-Simons theory $USp(2n)$ at level $k=n+\\frac12+\\ell$ with a single chiral multiplet in the fundamental representation is dual, for every pair of positive integers $(n,\\ell)$, to the Abelian rank-$0$ theory $\\mathcal{T}_{\\ell,n}$ of Creutzig, Garner and Kim. The fundamental is pseudo-real, so the level is half-integral, there is no non-Abelian flavor symmetry, and the supersymmetry is enhanced to $\\mathcal{N}=4$. Both sides have vanishing Higgs and Coulomb branches. We match the counting of supersymmetric vacua under real mass deformations for all $(n,\\ell)$, and the supersymmetric indices in a number of cases. We then study in detail the case $\\ell=1$, the minimal $USp(
