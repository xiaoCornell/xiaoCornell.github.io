tings. We first introduce the definition of TDFs with secure key leasing (TDF-SKL), which enables leasing and deleting of quantum trapdoors. We formalize TDF-SKL both with and without domain sampler, and give a construction of TDF-SKL without domain sampler based on the LWE assumption and a construction of TDF-SKL with domain sampler based on any standard PKE schemes combined with hinting pseudorandom generators [Koppula and Waters, CRYPTO 2019]. Next, we define TDFs with copy protection (TDF-CP), where the inversion functionality is copy protected by a quantum trapdoor. We establish a construction of TDF-CP assuming indistinguishability obfuscation and the LWE assumption, following a modular framework of copy protection proposed by Ananth and Behera [CRYPTO 2024]. We also present applications of TDF-SKL and TDF-CP. Existing constructions of public-key encryption with secure key leasing (PKE-SKL) and single-decryptor encryption (SDE) suffer from a critical vulnerability: quantum decryption keys may be destroyed after decrypting maliciously chosen ciphertexts. We construct PKE-SKL schemes and SDE schemes with robust quantum decryption keys that remain reusable after decrypting arbitrary ciphertexts from TDF-SKL and TDF-CP, respectively.", "url": "https://arxiv.org/abs/2609.08423", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fuyuki Kitagawa"}, {"name": "Ryo Nishimaki"}, {"name": "Yuki Shirakawa"}, {"name": "Takashi Yamakawa"}], "featured_authors": [{"name": "Fuyuki Kitagawa"}, {"name": "Ryo Nishimaki"}, {"name": "Yuki Shirakawa"}, {"name": "Takashi Yamakawa"}], "author_count": 4}, {"id": "2609.08432", "category": "quant-ph", "title": "Explicit block encodings of rate matrices for simulating polymerization kinetics on quantum computers", "abstract": "Predicting how molecular weight distribution and monomer sequence evolve during polymerization is central to polymer science, yet classical approaches face a trade-off between molecular resolution and computational cost: for copolymers, the number of distinguishable species grows exponentially with chain length. Quantum computing offers a potential alternative, provided the non-unitary rate matrices governing the kinetics can be embedded into unitary quantum circuits, a task known as block encoding. Here we construct explicit block-encoding circuits for two kinetic models of living polymerization: Model A, single-monomer polymerization, whose lower-bidiagonal rate matrix is encoded via a sparse-oracle construction and a two-term linear combination of unitaries (LCU) decomposition; and Model B, two-monomer copolymerization, where a bijective labeling of polymer species by an integer index (the m-index) yields a structured sparse matrix encoded via either a five-term LCU or a sparse-oracle construction. Numerical simulations with the sparse-oracle encodings reproduce the classical time evolution for reactivity ratios drawn from reported olefin copolymerization systems spanning near-random ($r_1 r_2 \\simeq 1$) and blocky ($r_1 r_2 > 1$) microstructures, and the LCU encodings are verified by explicit reconstruction of the encoded matrix block. Resource estimation shows that both implementations require only $O(\\log N)$ qubits in the matrix dimension $N$ (an exponential memory saving over the classical state space), with gate counts growing gradually, reaching $10^4$ to $10^5$ gates at $10^3$ system qubits. These results establish a concrete quantum circuit foundation for simulating polymerization kinetics on fault-tolerant quantum hardware, and a first step toward exploiting exponential state-space compression for high-dimensional polymer reaction networks.", "url": "https://arxiv.org/abs/2609.08432", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuhei Ikeda"}, {"name": "Hokuto Iwakiri"}, {"name": "Soichiro Nishio"}, {"name": "Kentaro Matsumoto"}], "featured_authors": [{"name": "Yuhei Ikeda"}, {"name": "Hokuto Iwakiri"}, {"name": "Soichiro Nishio"}, {"name": "Kentaro Matsumoto"}], "author_count": 4}, {"id": "2609.08453", "category": "quant-ph", "title": "The Forgotten History of Wave Function Variance Optimization and its Relevance for Neural-Network VMC", "abstract": "We revisit the almost century-old question of which functional of the local energy best optimizes a trial wave function, a problem of central importance in Variational Monte Carlo (VMC) and, more recently, in Neural-Network VMC (NN-VMC). While variance optimization dates back to the 1930s, the high statistical noise and heavy-tailed local energy distributions inherent to modern neural-network wave functions have renewed interest in this approach. We retrace its long and largely forgotten history here, showing its direct relevance to modern Neural Quantum States (NQS) frameworks. Minimizing the variance (an $L^2$ norm) implicitly assumes a Gaussian local energy distribution: an unjustified assumption. For Coulombic systems, the local energy distribution exhibits $E^{-4}$ power-law tails, causing the Central Limit Theorem to fail for the variance estimator. This instability can be mitigated by robust cost functions: the Mean Absolute Deviation (MAD, an $L^1$ norm), the Cauchy loss, or the $L_{-4}$ functional, which features a tail analytically designed to match the $E^{-4}$ exponent. We benchmark these functionals on $H_2^+$, an exactly solvable system at every internuclear distance, using the Guillemin-Zener wave function across the full potential energy curve. While energy minimization by construction yields the lowest energy, variance minimization is surpassed at every $R$ by alternative functionals: MAD proves superior in the bonding region, while $L_{-4}$ performs best in the dissociation regime.", "url": "https://arxiv.org/abs/2609.08453", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dario Bressanini"}], "featured_authors": [{"name": "Dario Bressanini"}], "author_count": 1}, {"id": "2609.08458", "category": "quant-ph", "title": "Deriving the Kijowski Arrival-Time POVM from the Schrödinger Current: Minimal Positivity and Uniqueness", "abstract": "Quantum backflow refers here to the appearance of a negative Schrödinger current for a state whose momentum support is entirely positive. We ask for the smallest modification of the free Schrödinger current that makes it nonnegative for every such state, while preserving the current of each individual momentum component. We show that the required minimal modification changes the free-particle momentum kernel according to \\[ K_{\\rm Sch}(p,p')=\\frac{p+p'}{2m} \\;\\longrightarrow\\; K_{\\min}(p,p')=\\frac{\\sqrt{pp'}}{m}. \\] The resulting current is positive and normalized and therefore defines an arrival-time POVM. Extending the directional no-backflow requirement to states containing both momentum signs forces the cross-sector kernel to vanish, \\[ K_{\\min}^{+-}=K_{\\min}^{-+}=0, \\] so that the full current is the sum of two independent directional contributions. The resulting POVM is exactly the Kijowski time-of-arrival POVM, providing a current-based physical motivation for both its directional kernels and their separation. Within the diagonal-preserving pairwise-minimal construction considered here, the result is unique. The construction itself does not impose a first-arrival condition.", "url": "https://arxiv.org/abs/2609.08458", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Avi Marchewka"}], "featured_authors": [{"name": "Avi Marchewka"}], "author_count": 1}, {"id": "2609.08555", "category": "quant-ph", "title": "Kinematic Control and Dephasing Dynamics of Quantum Resources in $e^{+}e^{-}\\toτ^{+}τ^{-}$", "abstract": "We characterize several quantum resources carried by the spins of the $\\tau^{+}\\tau^{-}$ pair produced in $e^{+}e^{-}$ annihilation. At the Belle-II energy, $\\sqrt{s}=10.579\\,\\mathrm{GeV}$, Bell nonlocality, steerability, entanglement of formation, and coherence are governed by the production angle and are largest for transverse emission, $\\vartheta=\\pi/2$. Their common kinematic origin is exposed by expressing the spin state as a velocity and angle-dependent mixture of a separable contribution and a maximally entangled component. Within the physical production domain, this representation connects the weakly correlated threshold state at $\\sqrt{s}=2m_{\\tau}$ to the Bell-state limit approached at ultrarelativistic energies. We then propagate the two-spin state through a phenomenological correlated-dephasing channel to determine how environmental memory and inter-channel classical correlations affect the available resources. Memory effects generate collapses and revivals that are absent from the monotonic Markovian evolution. The analysis therefore separates the kinematic mechanism that creates the spin correlations from the noise properties that control their subsequent survival.", "url": "https://arxiv.org/abs/2609.08555", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Elhabib Jaloum"}, {"name": "Omar Bachain"}, {"name": "Mohamed Amazioug"}, {"name": "Rachid Ahl Laamara"}], "featured_authors": [{"name": "Elhabib Jaloum"}, {"name": "Omar Bachain"}, {"name": "Mohamed Amazioug"}, {"name": "Rachid Ahl Laamara"}], "author_count": 4}, {"id": "2609.08639", "category": "quant-ph", "title": "Causal-Class Hierarchies in Coherence-Constrained Channel Transformation", "abstract": "Higher-order quantum transformations allow multiple channel uses to be combined through different causal architectures, from parallel and fixed-order sequential networks to general higher-order processes. Whether this causal freedom improves channel transformation when the higher-order operation is also constrained by a resource theory remains largely unexplored. We study this question in the dynamical resource theory of coherence using a unified semidefinite-programming framework. For two qubit amplitude-damping channels and the identity target, we prove a strict causal hierarchy at every nontrivial damping strength under both maximally incoherent superchannels (MISC) and dephasing-covariant incoherent superchannels (DISC). In contrast, mixed-Pauli channels admit a common teleportation simulation that transfers the channel dependence to Bell-diagonal program states prepared in parallel. The remaining processing can then be absorbed into a single quantum operational, so parallel, fixed-order sequential, and general higher-order strategies achieve the same optimal error for any target. These results identify free program-state parallelisation as a structural obstruction to causal enhancement.", "url": "https://arxiv.org/abs/2609.08639", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lin Zhu"}, {"name": "Benchi Zhao"}, {"name": "Xuanqiang Zhao"}, {"name": "Ranyiliu Chen"}, {"name": "Xin Wang"}, {"name": "Shenggen Zheng"}], "featured_authors": [{"name": "Lin Zhu"}, {"name": "Benchi Zhao"}, {"name": "Xuanqiang Zhao"}, {"name": "Ranyiliu Chen"}, {"name": "Xin Wang"}, {"name": "Shenggen Zheng"}], "author_count": 6}, {"id": "2609.08716", "category": "quant-ph", "title": "Closing the Loop: Non-Causal Computation, Partial Traces, & Postselected Entanglement", "abstract": "This paper gives a categorical interpretation of Baumeler \\& Wolf's logically consistent non-causal circuits, connecting them to postselected quantum teleportation. Looped feedback is represented by a trace in the category of non-negative matrices, and it is shown that the traced process is stochastic precisely when the induced loop transition matrix has trace $1$ for every external input, a condition shown to be equivalent to a unique fixed point for the loop for each input to a deterministic circuit. A classical non-causal circuit is represented by a measure-and-prepare quantum channel with an internal register utilising a maximally entangled Bell-state with postselection. The main result is that classical logical consistency is equivalent to the postselected Bell outcome having, for loop dimension $d$, probability exactly $1/d^2$ for each classical input distribution. The subsequent normalised conditional output then agrees exactly with the classical categorical trace. This work identifies a class of quantum Bell-postselection constructions whose conditional evolution maintains linear dependence on classical input distributions.", "url": "https://arxiv.org/abs/2609.08716", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mark Carney"}], "featured_authors": [{"name": "Mark Carney"}], "author_count": 1}, {"id": "2609.08745", "category": "quant-ph", "title": "Uniqueness and Cramér-Rao Efficiency of Quantum U-Statistics", "abstract": "We study unbiased estimation of scalar-valued polynomial functionals of quantum states from independent copies. We establish an equivalence between the first-order marginal of a permutation-invariant finite-copy observable and the functional gradient. We then prove that, among unbiased permutation-invariant estimators, the quantum U-statistic is the unique extension to an arbitrary number of copies. We further derive a universal variance expansion in which the leading $1/n$ term is determined by the variance of the functional gradient, while higher-order contributions are of order $O(1/n^2)$. This leading variance coincides with the multiparameter quantum Cramér-Rao limit, establishing asymptotic efficiency of quantum U-statistics. We also characterize the higher-order scaling at points where the variance of the first-order gradient vanishes. As an application, we analyze the Bures $\\chi^2$-divergence and show that a spectral lower bound on the reference state is sufficient but not necessary for bounded-variance estimation.", "url": "https://arxiv.org/abs/2609.08745", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ayanava Dasgupta"}, {"name": "Naqueeb Ahmad Warsi"}, {"name": "Premanshu Chatterjee"}], "featured_authors": [{"name": "Ayanava Dasgupta"}, {"name": "Naqueeb Ahmad Warsi"}, {"name": "Premanshu Chatterjee"}], "author_count": 3}, {"id": "2609.08752", "category": "quant-ph", "title": "Quantum speed limits based on quantifiers of quantum-state texture", "abstract": "Quantum speed limits impose intrinsic lower bounds on the shortest time scale for quantum system evolution. As an emerging paradigm in quantum resource theory, quantum-state texture has attracted research interest amid the rapid advancement of quantum theory. Herein, we investigate the interplay between quantum speed limits and quantum-state texture via several canonical quantifiers, including trace distance, state rugosity and Jensen-Shannon divergence. To demonstrate our findings, we analyze the minimum evolution time of physical systems subject to dephasing and dissipative dynamics. For the Jensen-Shannon divergence, we further explore nonunitary dynamics described by completely positive and trace-preserving maps, taking the amplitude damping channel as a typical example. In addition, we explore the tightness of these bounds in the considered dynamical models. Our results reveal that quantum speed limits derived from quantum-state texture capture the fundamental constraints on quantum evolutionary speed, with promising applications in quantum computing, quantum control and quantum metrology.", "url": "https://arxiv.org/abs/2609.08752", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuhang Xie"}, {"name": "Yanjun Chu"}, {"name": "Chenyang Cui"}, {"name": "Shao-Ming Fei"}], "featured_authors": [{"name": "Yuhang Xie"}, {"name": "Yanjun Chu"}, {"name": "Chenyang Cui"}, {"name": "Shao-Ming Fei"}], "author_count": 4}, {"id": "2609.08811", "category": "quant-ph", "title": "Dual-Trigger of Series Nanowire Detector for Event-Based Photon Number Assignment", "abstract": "Photon-number-resolving (PNR) detectors are essential components of photonic quantum technologies. However, conventional single-channel edge-triggered readout struggles to resolve the photon number $n$ in real time or to characterize how timing jitter depends on $n$. In this work, we use a dual-trigger method on a three-pixel series-connected superconducting nanowire single-photon detector (SNSPD) that triggers on both the rising and falling edges of the detection pulse. By doing so, we preserve the precise arrival time of the detection event while mapping the photon number onto the time interval between the rising and falling edges, allowing clear separation of the events. Using this technique, we assign each detection event to $n = 1, 2,$ or 3 photons with $99\\,\\%$ posterior confidence across all three classes. The timing jitter decreases as $n$ increases, reaching values below $41\\, \\text{ps}$ for $n \\geq 2$. Comparing edge-triggering with constant-fraction discrimination (CFD) for arrival-time extraction, we find that CFD yields lower jitter for single-photon events and a nearly constant mean arrival time. Altogether, our results establish dual-triggering as a robust, low-latency readout scheme for PNR detectors, while revealing a photon-number dependence of the timing jitter relevant to timing precision achievable in heralded photonic quantum applications.", "url": "https://arxiv.org/abs/2609.08811", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stefanie Grotowski"}, {"name": "Daniel Landes"}, {"name": "Fabian Wietschorke"}, {"name": "Paul Pucknus"}, {"name": "Rasmus Flaschmann"}, {"name": "Torsten Langer"}, {"name": "Torsten Krause"}, {"name": "Kai Müller"}, {"name": "Jonathan J. Finley"}], "featured_authors": [{"name": "Stefanie Grotowski"}, {"name": "Daniel Landes"}, {"name": "Fabian Wietschorke"}, {"name": "Torsten Krause"}, {"name": "Kai Müller"}, {"name": "Jonathan J. Finley"}], "author_count": 9}, {"id": "2609.08864", "category": "quant-ph", "title": "Distributed Quantum Property Testing with Quantum Carrier Pigeons", "abstract": "We introduce a framework for distributed quantum inference under communication constraints. In our model, $m$ distributed nodes each receive one copy of an unknown $d$-dimensional quantum state $\\rho$, before communicating via a constrained one-way communication channel with a central node, which aims to infer some property of $\\rho$. This framework generalizes the classical distributed inference framework introduced by Acharya, Canonne, and Tyagi [COLT 2019], by allowing quantum resources such as quantum communication and shared entanglement. Within this setting, we focus on the fundamental problem of quantum state certification: Given a complete description of some state $\\sigma$, decide whether $\\rho=\\sigma$ or $\\|\\rho-\\sigma\\|_1\\geq \\epsilon$. Additionally, we focus on the case of limited communication between distributed nodes and the central node: we assume each communication channel is limited to only $n_c$ bits and $n_q$ qubits with $n_c + n_q \\leq \\log d$. When all nodes can make use of a shared source of randomness, we show that the copy complexity of distributed state certification is $\\Theta(\\frac{d^2}{2^{n_q} 2^{n_c/2}\\epsilon^2})$. We further demonstrate that shared randomness is necessary to achieve the above complexity, by proving an $\\Omega(\\frac{d^3}{4^{n_q} 2^{n_c} \\epsilon^2})$ lower bound in the $\\textit{private-coin}$ setting. Moreover, we develop a private-coin algorithm that matches this bound up to a $\\sqrt{\\log d}$ factor, showing this complexity is near-optimal. Together, our work establishes a general framework for distributed quantum inference with communication constraints and characterizes the complexity of distributed state certification with limited communication.", "url": "https://arxiv.org/abs/2609.08864", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kenny Chen"}, {"name": "Mina Doosti"}, {"name": "Ryan Sweke"}, {"name": "Chirag Wadhwa"}], "featured_authors": [{"name": "Kenny Chen"}, {"name": "Mina Doosti"}, {"name": "Ryan Sweke"}, {"name": "Chirag Wadhwa"}], "author_count": 4}, {"id": "2609.08998", "category": "quant-ph", "title": "No information transmission through quantum channels above capacity", "abstract": "We show that the capacity of a quantum channel demarcates a phase transition: while reliable transmission below capacity is always possible, any attempt to transmit information above it fails catastrophically. Specifically, we prove exponential strong converse theorems for unassisted quantum and classical communication over arbitrary finite-dimensional memoryless quantum channels. At rates beyond the respective capacity, the entanglement-generation fidelity and the success probability for classical communication decay exponentially with the number of channel uses. This rules out transmission above capacity even when one tolerates arbitrarily large errors. Our proof follows the classical Arimoto strategy, augmented by a crucial new ingredient: integral representations of Rényi information measures that lead to asymptotic continuity bounds for Rényi capacities.", "url": "https://arxiv.org/abs/2609.08998", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hao-Chung Cheng"}, {"name": "Marco Tomamichel"}], "featured_authors": [{"name": "Hao-Chung Cheng"}, {"name": "Marco Tomamichel"}], "author_count": 2}, {"id": "2609.09019", "category": "quant-ph", "title": "Modular commutator as a robust topological invariant and approximate Markovianity", "abstract": "The modular commutator provides a bulk, local, single-wave-function probe of the chiral central charge $c_-$ for gapped ground states. Its invariance under deformations was previously established under a local quantum Markov condition---namely, the conditional mutual information $I(A:C|B)$ is zero for all tripartitions of a disk into three consecutive strips A, B, and C \\cite{Modular-commutator-Gapped}. However, the local quantum Markov condition also forces the probe to vanish, leaving open whether modular commutator remains robust in physically relevant states where the Markov property holds only approximately. In this paper, we resolve this tension for finite-dimensional Hilbert spaces: the approximate local quantum Markov property implies the change of the modular commutator under topology-preserving deformations vanishes asymptotically. We next prove trace-norm continuity of the modular commutator. Combining deformation invariance with trace-norm continuity, we establish that the modular commutator remains asymptotically invariant within gapped quantum phases connected by quasi-local unitary paths that preserve the approximate local quantum Markov condition. Conversely, by analyzing finite-time dynamics generated by modular Hamiltonians, we derive a quantitative lower bound on the conditional mutual information required for a non-zero modular commutator: $I(A:C|B)$ across such strip tripartitions cannot decay faster than exponentially with the width of B given that the state satisfies entanglement area law, extending the exact no-go theorem of \\cite{strict-J-2024} to a quantitative finite bound . Finally, we demonstrate that those conclusions apply equally to the Hall conductance estimator \\cite{FanSahayVishwanath2023}.", "url": "https://arxiv.org/abs/2609.09019", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tai Hsuan Yang"}], "featured_authors": [{"name": "Tai Hsuan Yang"}], "author_count": 1}, {"id": "2609.09035", "category": "quant-ph", "title": "Near-Optimal Quantum Lower Bounds for Convex Optimization via Fourier Rank", "abstract": "We establish a near-linear quantum query lower bound for high-accuracy convex optimization over an explicit family of $n$-dimensional ellipsoids. We focus on linear optimization with an explicitly given objective, where the feasible set is accessed through a membership oracle. We show that any algorithm that, for every unit linear objective, returns an exactly feasible point with additive objective error $\\Theta(n^{-2})$ requires $\\Omega\\!\\left(\\frac{n}{\\log n\\,\\log\\log n}\\right)$ membership queries. The same lower bound can be shown to hold if the returned point is only required to be approximately feasible, within $\\Theta(n^{-2})$ distance from the feasible set. This resolves, up to logarithmic factors, an open question posed by Chakrabarti, Childs, Li, and Wu~(\\textit{Quantum}, 2020) and by van Apeldoorn, Gilyén, Gribling, and de Wolf~(\\textit{Quantum}, 2020). Coupled with the upper bounds in these papers, the query complexity of high-accuracy convex optimization is characterized tightly up to logarithmic factors. The proof is built around a lower bound for determinant computation that is derived via a novel polynomial method based on Fourier-rank. In the continuous matrix phase-query model, computing the determinant of a real $n\\times n$ matrix requires at least $n/2$ matrix-vector product queries. The construction also yields an $\\Omega(n)$ phase-query lower bound for estimating the minimum eigenvalue of a real symmetric $n\\times n$ matrix to additive accuracy $\\Theta(n^{-2})$. These results extend the determinant and minimum-eigenvalue lower bounds of Childs, Hung, and Li~(ICALP 2021) from finite fields to the real-valued setting. Based on the same constructions, we also prove a near-optimal gradient-query lower bound for constant-accuracy optimization of smooth and strongly convex functions.", "url": "https://arxiv.org/abs/2609.09035", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Brandon Augustino"}, {"name": "Shouvanik Chakrabarti"}, {"name": "Enrico Fontana"}, {"name": "Dylan Herman"}, {"name": "Junhyung Lyle Kim"}, {"name": "Guneykan Ozgul"}, {"name": "Nadezhda Voronova"}], "featured_authors": [{"name": "Brandon Augustino"}, {"name": "Shouvanik Chakrabarti"}, {"name": "Enrico Fontana"}, {"name": "Junhyung Lyle Kim"}, {"name": "Guneykan Ozgul"},     const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
