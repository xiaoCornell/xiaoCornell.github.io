librium steady state. We derive the leading long-time asymptotics and identify persistent oscillations in densities and currents caused by multiple bound states at the junction. We argue that interactions between components lead to a linear low-temperature correction to the current, in contrast to the quadratic correction in the single-component case. At equilibrium, we obtain the M-Wright distribution of spin transfer with $t^{1/4}$ scaling.", "url": "https://arxiv.org/abs/2609.07146", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ovidiu I. Patu"}, {"name": "Oleksandr Gamayun"}, {"name": "Catalin Pascu Moca"}], "featured_authors": [{"name": "Ovidiu I. Patu"}, {"name": "Oleksandr Gamayun"}, {"name": "Catalin Pascu Moca"}], "author_count": 3}, {"id": "2609.07219", "category": "cond-mat", "title": "Atomistic origin and strain control of the finite-temperature dielectric response in BaTiO3", "abstract": "The dielectric response of BaTiO3 (BTO) varies strongly with temperature, yet its local atomic origin remains unclear. Using electric-field-coupled molecular dynamics with a machine-learning force field, we show that the permittivity tracks the field-induced angular redistribution of local Ti-O off-centering rather than its magnitude or mean polar angle. Temperature and biaxial strain modify the local structure differently, but both responses follow a common relation with the same orientational descriptor, providing a real-space counterpart to soft-mode behavior.", "url": "https://arxiv.org/abs/2609.07219", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ryotaro Sahashi"}, {"name": "Po-Yen Chen"}, {"name": "Teruyasu Mizoguchi"}], "featured_authors": [{"name": "Ryotaro Sahashi"}, {"name": "Po-Yen Chen"}, {"name": "Teruyasu Mizoguchi"}], "author_count": 3}, {"id": "2609.07220", "category": "cond-mat", "title": "Finite-rank multiplicative perturbations of rotationally invariant non-Hermitian random matrices", "abstract": "We study finite-rank multiplicative deformations of rotationally invariant non-Hermitian random matrices. More precisely, we consider models of the form $\\mathbf{A}(\\mathbf{I}+\\mathbf{T})$, where $\\mathbf{A}$ is a large rotationally invariant non-Hermitian random matrix, $\\mathbf{T}$ is a finite-rank normal perturbation, and $\\mathbf{I}$ denotes the identity matrix. We characterize the emergence of outlier eigenvalues, their fluctuations, and the associated eigenvector overlaps. Our results provide a multiplicative non-Hermitian counterpart to the classical Baik--Ben Arous--Péché framework.", "url": "https://arxiv.org/abs/2609.07220", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pierre Bousseyroux"}, {"name": "Marc Potters"}], "featured_authors": [{"name": "Pierre Bousseyroux"}, {"name": "Marc Potters"}], "author_count": 2}, {"id": "2609.07228", "category": "cond-mat", "title": "Lindbladian Phase Geometry and Hall Transport in Open Bloch Systems", "abstract": "Quantum geometry underlies a wide range of transport phenomena in Bloch systems. How quantum-geometric transport is modified when Bloch electrons are coupled to an environment, however, remains largely unexplored, even though the environment can alter both the electronic state and the physical current operator. Here we formulate dc linear response within a trace-preserving Lindblad kinetic theory by defining the physical velocity as the Liouvillian time derivative of the position operator. This construction reveals an environment-induced contribution to the current vertex whose momentum-space curl generates new Hall responses governed by the gauge-invariant phase geometry encoded by Lindblad jump amplitudes, which characterize electron-environment coupling. To leading order in the dissipative coupling, this geometry gives rise to interband shift-vector and diagonal-vorticity Hall responses arising from off-diagonal and diagonal jump amplitudes, respectively. Remarkably, both mechanisms can produce a finite Hall conductivity even when the conventional Berry-curvature anomalous Hall effect vanishes identically. Our work establishes Lindbladian phase geometry as an independent geometric origin of transverse transport in open quantum matter.", "url": "https://arxiv.org/abs/2609.07228", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhihao Jiang"}, {"name": "Longjun Xiang"}, {"name": "Jian Wang"}], "featured_authors": [{"name": "Zhihao Jiang"}, {"name": "Longjun Xiang"}, {"name": "Jian Wang"}], "author_count": 3}, {"id": "2609.07329", "category": "cond-mat", "title": "Unveiling the Scaling Potential of Drain Merge through Active (DMtA) in CFETs: Breaking the Super-Via Bottlenecks and Unlocking New PPA Boosters", "abstract": "Drain merge (DM), a super via vertically connecting the common S/D terminals of stacked n/pFETs in Complementary FETs (CFETs), blocks further parasitic optimization and cell scaling. For the first time, this work systematically investigates the state-of-the-art Drain Merge through Active (DMtA), a revolutionary technology reported recently with the DM embedded in the active region, through a comprehensive DTCO framework spanning process integration, contact-configuration-dependent (CTCD) compact modeling, standardcell design, RO evaluation and block-level PPA benchmark on a 32-bit RISC-V Ibex core. By reducing DM parasitics and enabling DM-width optimization, DMtA improves RO frequency by 11.7% over its conventional Drain Merge through field (DMtF) counterpart. Active widening and Area Borrowing, the latter first reported in [8] and exploiting spatial slack in adjacent cells to further enlarge the nanosheet width (WNS), increase the maximum Ibex-core frequency by up to 34.8%. More importantly, DMtA also enables the once GAA-exclusive Hyper-cells on CFETs by merging the active regions across adjacent cell rows, providing a further 8.7% frequency gain. A post-routing floating-output-pin-aware optimization further removes redundant S/D contacts (CTs) and reduces power by 5.3%. Finally, DMtA facilitates more area-efficient 2.5T cell scaling by preserving single-row cell compatibility, reducing post-PR core area by 25.7%.", "url": "https://arxiv.org/abs/2609.07329", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jingru Jiang"}, {"name": "Haoran Lu"}, {"name": "Kairong Guo"}, {"name": "Yibo Zhang"}, {"name": "Yifei Chen"}, {"name": "Wanyue Peng"}, {"name": "Yu Liu"}, {"name": "Jiacheng Sun"}, {"name": "Xiaoyan Xu"}, {"name": "Ming Li"}, {"name": "Yibo Lin"}, {"name": "Runsheng Wang"}, {"name": "Ru Huang"}, {"name": "Heng Wu"}], "featured_authors": [{"name": "Jingru Jiang"}, {"name": "Haoran Lu"}, {"name": "Kairong Guo"}, {"name": "Runsheng Wang"}, {"name": "Ru Huang"}, {"name": "Heng Wu"}], "author_count": 14}, {"id": "2609.07332", "category": "cond-mat", "title": "Emergent Equilibrium Structure Along a Critical Cluster Recursion", "abstract": "Critical universality does not determine the microscopic conditional structure of a probability measure. We study a bicolored cluster recursion constrained to remain critical at every generation, with no equilibrium spin measure or fixed coupling imposed. In both two and three dimensions, the resulting history-dependent sequence develops a common Ising/Fortuin--Kasteleyn (FK) compatibility structure: the second-shell dependence of a one-site conditional law is strongly suppressed, nearest-neighbor effective couplings move progressively toward one another near the critical Ising value, and cluster and interface observables organize around the corresponding FK geometry. An exact cluster-coloring factorization singles out $q=2$ as the point where the residual connectivity weight disappears from the two-color spin marginal. Thus equilibrium-compatible conditional structure can emerge along a trajectory that remains critical throughout.", "url": "https://arxiv.org/abs/2609.07332", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shuo Wei"}, {"name": "Abbas Ali Saberi"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Shuo Wei"}, {"name": "Abbas Ali Saberi"}, {"name": "Youjin Deng"}], "author_count": 3}, {"id": "2609.07341", "category": "cond-mat", "title": "Storing Infinite Dynamical Attractors in Nonreciprocal Associative Neural Networks", "abstract": "We develop a dynamical mean-field theory for nonreciprocal associative networks that store an extensive number of dynamical attractors, from limit cycles to strange attractors. Using a path integral calculation under quenched disorder, we derive self-consistent dynamical mean-field equations for pattern overlaps, autocorrelations and response functions. Memory retrieval capacity is governed by the spectral structure of the coupling matrices encoding stored patterns. When their eigenvalues are coherently aligned, retarded self-interactions and quenched noise feed back destructively: at zero eigenphase (fixed point attractors) the classical equilibrium capacity bound is recovered, while for limit cycles retrieval collapses far below it. In contrast, for uniformly distributed eigenphases, retarded self-interactions and much of the quenched noise cancels, reducing the dynamics to an effective single-spin process and amplifying capacity substantially. We validate the theory against microscopic simulations for limit-cycle and chaotic attractors, identifying eigenvalue decoherence as the mechanism enabling enhanced storage of dynamical memories.", "url": "https://arxiv.org/abs/2609.07341", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Miguel Aguilera"}, {"name": "Daniele De Martino"}], "featured_authors": [{"name": "Miguel Aguilera"}, {"name": "Daniele De Martino"}], "author_count": 2}, {"id": "2609.07342", "category": "cond-mat", "title": "Trion-mediated quantum operations on a double-dot charge qubit", "abstract": "A scheme for controlling a charge qubit on a semiconductor asymmetric double quantum dot with suppressed tunnel coupling between individual quantum dots is proposed. Laser pulses convert the logical single-electron states of the qubit into auxiliary trion states, for which the resonant tunneling condition is restored due to the compensation of structural asymmetry by the Coulomb interaction of the particles. The conditions for performing orthogonal single-qubit rotations are formulated. For a two-dimensional structure, the parameters of the qubit are calculated, and the dependence of the fidelity of the inversion operation on the parameters of the laser field and the rates of dissipative processes is obtained. It is shown that the considered algorithm is characterized by high speed and reliability.", "url": "https://arxiv.org/abs/2609.07342", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexander Tsukanov"}], "featured_authors": [{"name": "Alexander Tsukanov"}], "author_count": 1}, {"id": "2609.07396", "category": "cond-mat", "title": "Fragility from Enthalpy Fluctuations and Fictive-Temperature Dynamics", "abstract": "Fragility and fictive temperature are two central measures of glass formation, but their connection is usually expressed indirectly through structural relaxation times or cooling-rate dependence. Here we formulate this connection in terms of configurational enthalpy fluctuations. The time evolution of the fictive temperature during cooling or aging is controlled by the enthalpy--enthalpy correlation function that also determines the frequency-dependent configurational heat capacity. Fragility enters through the strong temperature dependence of the structural relaxation time and therefore controls how rapidly the corresponding enthalpy-relaxation spectrum shifts to long times near the glass transition. This leads to a direct time-domain description of the onset and growth of the fictive-temperature lag, including the Debye limit, and connects calorimetric relaxation, fragility, and nonequilibrium structural arrest within a common framework.", "url": "https://arxiv.org/abs/2609.07396", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Biman Bagchi"}], "featured_authors": [{"name": "Biman Bagchi"}], "author_count": 1}, {"id": "2609.07405", "category": "cond-mat", "title": "Spontaneous counterflow in rotating supersolids", "abstract": "Rotating supersolids challenge the conventional notion of superfluid flow: quantized vortices coexist with crystalline order arising from the system's intrinsic density modulation. Drawing on concepts developed in the context of superfluid helium, this seemingly paradoxical state is often described phenomenologically in terms of a dual response, combining superfluid flow with rigid-body-like motion. Here we show that these apparently distinct behaviors emerge from a single microscopic velocity field, globally constrained by irrotationality. By applying a Helmholtz decomposition, we disentangle a divergence-free incompressible component, which carries vortex circulation, from a curl-free compressible component generated by the intrinsic density modulation. In absence of vortices, the response is entirely encoded in the compressible field: the droplets co-rotate with the external drive, while the interstitial fluid develops an oppositely directed counterflow that preserves vanishing circulation. Above the vortex nucleation threshold, the incompressible component carries the usual quantized circulation, whereas the compressible field counteracts the vortex-induced angular momentum, reducing the total jump with respect to an unmodulated condensate. Our results recast supersolid rotation in terms of a flow-counterflow response, providing a microscopic interpretation of the phenomenological rigid/superfluid partitioning.", "url": "https://arxiv.org/abs/2609.07405", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Silvia Trabucco"}, {"name": "Elena Poli"}, {"name": "Massimo Mannarelli"}, {"name": "Francesca Ferlaino"}], "featured_authors": [{"name": "Silvia Trabucco"}, {"name": "Elena Poli"}, {"name": "Massimo Mannarelli"}, {"name": "Francesca Ferlaino"}], "author_count": 4}, {"id": "2609.07456", "category": "cond-mat", "title": "Graph neural networks and the energetic cavity method for combinatorial optimization", "abstract": "We study the use of graph neural networks (GNNs) for finding approximate ground states of Ising models. Efficiently finding these ground states is of broad significance because many combinatorial optimization problems can be formulated as an Ising model with the appropriate choice of couplings and fields. Exactly solving these problems is hard but there are many good heuristic methods. A lineage of these heuristics build from mean-field approximations: one approach uses the leading eigenvector of an appropriately defined matrix, another is the min-sum algorithm, also known as the energetic cavity method. Without modification, GNNs perform worse than both of these methods. We consider small modifications to the GNN to incorporate these heuristics and find that this considerably improves performance. While the modified approach is competitive against other deep-learning approaches, we still find that simulated annealing is reliably at least as good as deep learning methods for the same computational cost.", "url": "https://arxiv.org/abs/2609.07456", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Joe Bacchus George"}, {"name": "George T. Cantwell"}], "featured_authors": [{"name": "Joe Bacchus George"}, {"name": "George T. Cantwell"}], "author_count": 2}, {"id": "2609.07477", "category": "cond-mat", "title": "Benchmarking Universal Machine Learning Force Fields for Crystal Structure Prediction of High-Energy Molecular Systems", "abstract": "Recent developments of universal machine learning interatomic potentials (UMLIPs) offer a fast route for screening molecular crystals based on geometry relaxation and energy ranking, but their reliability across chemically diverse energetic materials remains elusive. In particular, it is unclear whether or not these UMLIPs are over-sensitive to break the desired molecular connectivity for relaxing the periodic crystals. Herein we tested the hypothesis that classical force-field pre-relaxation can provide a more suitable starting geometry for subsequent UMLIP relaxation on a large database of high energy molecular crystals. Three models (MACE, MACE-OFF and UMA) in conjunction with the General Amber Force Field (GAFF) were applied to test this hypothesis. Among them, direct MACE-OFF and UMA showed very high relaxation success and preserved the reference geometries most closely, but they still exhibit failures for some rare cases. Using GAFF pre-relaxation can systematically reduce the number of failed relaxations with lower computational costs. Our comparative failure and robustness analyses revealed distinct trade-offs among the evaluated models. Among them, MACE-OFF achieves a better compromise between potential energy surface smoothness, structural fidelity, and stress convergence, serving as a good choice to provide a reliable foundation for automated structural optimization.", "url": "https://arxiv.org/abs/2609.07477", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Musiha Mahfuza Mukta"}, {"name": "Osman Goni Ridwan"}, {"name": "Romain Perriot"}, {"name": "Qiang Zhu"}], "featured_authors": [{"name": "Musiha Mahfuza Mukta"}, {"name": "Osman Goni Ridwan"}, {"name": "Romain Perriot"}, {"name": "Qiang Zhu"}], "author_count": 4}, {"id": "2609.07496", "category": "cond-mat", "title": "Exact Hamiltonian Dynamics of Rare Events in Active Matter", "abstract": "Active systems navigate complex environments through non-equilibrium fluctuations, rendering standard equilibrium transition-rate theories inadequate. Moreover, transition rates provide only partial information on how non-equilibrium dynamics explore metastable states, whereas knowledge of the optimal paths offers deeper physical insight. Using an active Ornstein-Uhlenbeck particle as a paradigmatic model, i.e., a stochastic dynamics driven by exponentially correlated noise, we establish an exact mapping of the non-Markovian optimal path onto a higher-dimensional Hamiltonian dynamical system so that, for arbitrary force fields, optimal paths can be computed systematically by solving the corresponding Hamilton equations. Tuning the conserved energy allows us to explore diverse dynamical regimes: ranging from classical instanton trajectories strictly confined to the zero-energy surface, to closed periodic orbits that emerge only at non-zero energies, representing a distinct signature of the non-Markovian active dynamics.", "url": "https://arxiv.org/abs/2609.07496", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrea Crisanti"}, {"name": "Matteo Paoluzzi"}], "featured_authors": [{"name": "Andrea Crisanti"}, {"name": "Matteo Paoluzzi"}], "author_count": 2}, {"id": "2609.07572", "category": "cond-mat", "title": "Aggressive Phase Separation in Dense Mixtures of Passive and Active Particles", "abstract": "Using Vicsek-like self-propulsion rule, we study kinetics of liquid-liquid phase separation in mixtures of passive and active particles. For evolutions following temperature quenches of homogeneous configurations to the immiscible region of the phase diagram, we identify a remarkably strong dependence of the domain growth exponent on the choice of final state point. The singular dependence is indicative of the possibility of even an exponentially fast growth for suitable choices of system parameters. This striking observation, supported by finite-size scaling and other advanced analyses, is despite the fact that the overall mixture density is quite high that risks congestion with the prospect of slowing down particle transport. From flocking in pure biological systems to robotic swarming, these results are of much practical relevance. Theoretical pictures suitable for interpreting such high growth rates are discussed. In this regard, we discuss coarsening in the velocity field as well that describes how the density field coarsening follows the latter.", "url": "https://arxiv.org/abs/2609.07572", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Purnendu Pathak"}, {"name": "Gokul Upadhyay"}, {"name": "Subir K. Das"}], "featured_authors": [{"name": "Purnendu Pathak"}, {"name": "Gokul Upadhyay"}, {"name": "Subir K. Das"}], "author_count": 3}, {"id": "2609.07616", "category": "cond-mat", "title": "Topological Edge States and Collective Radiation in a One-Dimensional Atomic Chain", "abstract": "We investigate the topological and collective radiative properties of a one-dimensional diatomic chain of identical quantum emitters with alternating spacing, coupled to the electromagnetic vacuum. The system realizes an extended, non-Hermitian Su-Schrieffer-Heeger-type model with vacuum-mediated long-range interactions and collective dissipation. We focus on the single-excitation manifold, where the dynamics are described by an effective Hamiltonian. For an infinite chain, the complex band structure reveals subradiant modes associated with wave vectors outside the light line, as well as parameter regimes where real-part band crossings occur. The bulk topology is characterized by a complex Berry phase, which remains quantized in the presence of inversion symmetry and a spectral gap. For finite chains, using exact diagonalization, we identify superradiant, subradiant, and edge states with distinct decay rates and spatial profiles. Edge states emerge in the topologically nontrivial regime when a bulk gap in the real part of the energy spectrum is present, while subradiant states exhibit strongly suppressed decay with system-size dependence. Finally, we analyze the far-field radiation patterns associated with different classes of eigenstates and show that the emission characteristics reflect the decay properties, spatial localization, and the parity of the unit-cell amplitudes.", "url": "https://arxiv.org/abs/2609.07616", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arda Deniz İyican"}, {"name": "Ahmet Levent Subaşı"}, {"name": "Özgür Çakır"}], "featured_authors": [{"name": "Arda Deniz İyican"}, {"name": "Ahmet Levent Subaşı"}, {"name": "Özgür Çakır"}], "author_count": 3}, {"id": "2609.07620", "category": "cond-mat", "title": "Microcanonical Hamiltonian Monte Carlo and the Helmholtz Theorem", "abstract": "The recently proposed Microcanonical Hamiltonian Monte Carlo algorithm has not yet been studied in detail from a thermodynamic point of view; this work aims to fill that gap. We demonstrate how thermodynamical state variables and potentials can be derived and thereby demonstrate that the construction of the algorithm formally represents a microcanonical thermodynamic ensemble. In particular, we demonstrate (analytically and numerically) that the algorithm fulfils the Helmholtz theorem, an alternative formulation of the first law of thermodynamics. Furthermore, we construct a new sampling algorithm that extends the original to lower-dimensional inference problems. Finally, we argue that canonical Markov Chain Monte Carlo algorithms are more natural than Microcanonical Hamiltonian Monte Carlo from the thermodynamic and information-theoretic point of view.", "url": "https://arxiv.org/abs/2609.07620", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Heinrich von Campe"}, {"name": "Bjoern Malte Schaefer"}], "featured_authors": [{"name": "Heinrich von Campe"}, {"name": "Bjoern Malte Schaefer"}], "author_count": 2}, {"id": "2609.07632", "category": "cond-mat", "title": "General solution of the Dirac equation for electrons bound by a charged atomic chain", "abstract": "The system of electrons bound by a charged atom chain is studied within the Dirac theory. The general analytical solution of the Dirac equation is obtained. Analytical expression for electron energy is derived from which it follows that the principal quantum number can be introduced for electron states in such a system, similar to the case of a hydrogen atom. We prove that electrons bound by the atomic chain, are fully collectivized and the energy can be calculated as a function of the occupation number. The spectral band with the principal quantum number $n$ is shown to be split into $n$ subbands forming the fine structure. The scale of the fine structure splitting is calculated.", "url": "https://arxiv.org/abs/2609.07632", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexander Eremko"}, {"name": "Larissa Brizhik"}, {"name": "Vadim Loktev"}], "featured_authors": [{"name": "Alexander Eremko"}, {"name": "Larissa Brizhik"}, {"name": "Vadim Loktev"}], "author_count": 3}, {"id": "2609.07704", "category": "cond-mat", "title": "Metal-Insulator Coexistence and Gap-Crossing Domain-Wall Modes in an Aubry-André Model with Nonlocal Hopping", "abstract": "Nonequilibrium transport remains a central theme in modern physics, spanning from condensed matter to synthetic systems. Here, we investigate particle transport in an extended Aubry-André model with system-scale hopping, namely nonlocal hopping with a range proportional to the system size, and uncover a metal-insulator coexistence regime in real space, where metallic and insulating spatial domains coexist within the same system and are separated by sharp spatial boundaries. In the insulating region, particles exhibit flat-band-like localization in the absence of quasiperiodic potentials, while a quasiperiodic potential induces distinct multi-point localization, different from conventional exponential localization. Meanwhile, particles can freely propagate and tunnel across spatially disconnected metallic domains separated by the insulating region. Beyond this coexistence phase, we identify unconventional gap-crossing domain-wall modes with comb-like spatial profiles that mediate nonlocal, multi-point transport across separated metallic domains. Our findings reveal a rich interplay between localization, nonlocality, and transport in systems with nonlocal hopping.", "url": "https://arxiv.org/abs/2609.07704", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xiarui Zhan"}, {"name": "Mingsheng Tian"}, {"name": "Qiongyi He"}, {"name": "Kaiye Shi"}, {"name": "Wei Zhang"}], "featured_authors": [{"name": "Xiarui Zhan"}, {"name": "Mingsheng Tian"}, {"name": "Qiongyi He"}, {"name": "Kaiye Shi"}, {"name": "Wei Zhang"}], "author_count": 5}, {"id": "2609.07757", "category": "cond-mat", "title": "A Bifurcation Theory for the Equilibria of Modern Hopfield Networks", "abstract": "Modern Hopfield networks provide a unifying framework for associative memory, transformer attention, diffusion-based generative models, and biological attractor dynamics, linking these systems through a common energy-based dynamics in which states are updated toward weighted combinations of stored patterns. Across these settings, network dynamics is determined by the organization of the energy landscape and the bifurcations of its fixed points. Despite their central role, a general theory of these bifurcations has remained unavailable beyond specific architectures and idealized pattern ensembles. Here we derive stability and bifurcation criteria for the fixed points of general convex-dual Modern Hopfield networks for a general statistics of the stored patterns. Applying this framework to random, block-correlated, and infinitely hierarchical pattern ensembles, we show how memory correlations systematically organize the emergence of hierarchical attractors through successive bifurcations. We further demonstrate that these predictions quantitatively describe retrieval bifurcations in MHNs storing patterns sampled from MNIST, and recapitulate the hierarchical organization of hematopoietic cell identities. Our results establish a general bifurcation theory for Modern Hopfield networks and identify the organization of fixed points as a unifying principle underlying their computational and biological behavior.", "url": "https://arxiv.org/abs/2609.07757", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vincenzo Maria Schimmenti"}, {"name": "Matteo Ciarchi"}], "featured_authors": [{"name": "Vincenzo Maria Schimmenti"}, {"name": "Matteo Ciarchi"}], "author_count": 2}, {"id": "2609.07763", "category": "cond-mat", "title": "Topographic Disorder, Wind Coupling, and Directional Fire Spread: Critical Behavior in a Terrain-Weighted Forest Fire Model", "abstract": "We introduce the Terrain-Weighted Forest Fire Model (TFFM), a lattice model in which fire spreads on a spatially correlated Gaussian height field with the asymmetric bond probability $p_{i\\to j}=\\mathrm{clip}[e^{-\\beta+\\gamma(h_j-h_i)},0,1]$, plus an additive wind bias. Simulations up to $L=8192$ reveal a sharp active-to-inactive transition whose critical suppression threshold $\\beta_c$ is even in $\\gamma$, decreases with $|\\gamma|$, and decreases as the terrain correlation length $\\sigma_h$ is reduced: slope asymmetry acts as a suppressant because downhill bonds are penalized and fire stalls at local elevation maxima. For rough terrain and low tree density, the fire fails to percolate even at zero suppression. Finite-size scaling gives a front-velocity exponent $\\delta=0.34\\pm0.02$, identical for smooth and rough terrain and matching neither directed percolation ($\\nu_\\parallel-\\nu_\\perp\\approx0.56$) nor isotropic percolation ($\\approx0.18$). The single-seed survival probability at $\\beta_c$ is independent of $L$ and decays extremely slowly, with a running exponent falling from $\\approx0.09$ to $\\approx0.04$, excluding directed percolation and suggesting a survival probability that remains finite at criticality, consistent with the $L$-independent value $P^*\\approx0.5$ at which $P_{\\rm surv}$ drops to zero. The correlation-length exponent cannot be resolved at these sizes, consistent with slow crossover corrections from quenched correlated disorder. Wind raises $\\beta_c$ by a factor of 2--4, produces a sharp onset of downwind fire-scar drift at weak coupling, and, at high terrain coupling, decreases the burned fraction at boundary crossing---a terrain-wind competition effect absent from isotropic bond-disorder models. The model yields fire-risk thresholds and fire-scar signatures comparable to satellite burn-scar data.", "url": "https://arxiv.org/abs/2609.07763", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Juan M. Florez"}, {"name": "Eric Suárez Morell"}, {"name": "Cristian Millan"}, {"name": "J. Restrepo"}], "featured_authors": [{"name": "Juan M. Florez"}, {"name": "Eric Suárez Morell"}, {"name": "Cristian Millan"}, {"name": "J. Restrepo"}], "author_count": 4}, {"id": "2609.07764", "category": "cond-mat", "title": "Directional memory of early spectral selection during spinodal decomposition in finite systems", "abstract": "Cahn-Hilliard phase separation turns small composition fluctuations into coarsening domains. In Fourier space, the pattern forms a ring whose angular intensity favors an axis. We ask whether the axis favored early in an evolution remains related to the axis favored later in the same evolution. We analyze two-dimensional simulations with isotropic initial fluctuations and no imposed direction. We introduce $Q_2$, a normalized angular average over the Fourier spectrum, as a measure of the strength and direction of spectral anisotropy. Linear growth amplifies different wave numbers at different rates, selecting an early axis from the angular imbalances in the initial spectrum. This axis remains correlated with the late axis during coarsening. At a fixed time, shallow quenches show stronger early-late alignment. This advantage disappears when the quenches are compared at similar stages of domain growth. Adding the early $Q_2$ to a prediction based on quench depth, mean composition, and box size reduces the mean absolute error for late $Q_2$ by $3.53\\%$. This reduction disappears when only the magnitude of the early $Q_2$ is retained, or when its direction is replaced by the direction from another evolution. The early Fourier intensity therefore carries information about the later state of the same evolving field.", "url": "https://arxiv.org/abs/2609.07764", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Boliang Yu"}, {"name": "Ruixin Zhou"}, {"name": "Zheng Zhang"}], "featured_authors": [{"name": "Boliang Yu"}, {"name": "Ruixin Zhou"}, {"name": "Zheng Zhang"}], "author_count": 3}, {"id": "2609.07775", "category": "cond-mat", "title": "Simple invariants for band topology", "abstract": "Despite the exhaustive understanding gathered around non-interacting topological states of matter, there is no single method capable of systematically delivering simple, numerically efficient topological invariants that is applicable to all crystalline and non-crystalline systems alike. Here we revisit the spectral localizer operator, constructed from the Hamiltonian and position operators, and show how it can be treated it as an auxiliary zero-dimensional Hamiltonian whose topology encodes the higher dimensional phases of the parent Hamiltonian. Its classification reduces every topological invariant to a matrix signature or the sign of a Pfaffian for an appropriate localizer, both of which are simple to interpret and efficient to compute in real space. We validate this approach by deriving simple real-space invariants for weak and rotationally invariant crystalline phases that were previously beyond the grasp of the spectral localizer formalism, atomic limits that escape scattering invariants, phases that evade symmetry-based indicator methods, as well as phases that had no previously known invariant. Our work provides a systematic way to construct any non-interacting topological invariant for a crystalline or non-crystalline systems, opening avenues to classify and predict the topology of previously unexplored classes of materials.", "url": "https://arxiv.org/abs/2609.07775", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Adam Yanis Chaou"}, {"name": "Adolfo G. Grushin"}, {"name": "Peru d'Ornellas"}], "featured_authors": [{"name": "Adam Yanis Chaou"}, {"name": "Adolfo G. Grushin"}, {"name": "Peru d'Ornellas"}], "author_count": 3}, {"id": "2609.07796", "category": "cond-mat", "title": "Temperature-Dependent nonlinear optics from first-principles: Second-Harmonic Generation in few-layers MoS$_2$", "abstract": "We present a first-principles real-time approach to study non-linear response of solids at finite temperature. Finite temperature effects are included as renormalization of the quasiparticle energies and a dephasing term proportional to the quasiparticle lifetimes. We evaluate electron-phonon matrix elements from Density-Functional Perturbation Theory for lattice dynamics and then calculate quasiparticles renormalization and lifetime from the Fan and Debye-Waller terms of the electron self-energy. Electron excitations are treated at the independent particle level of approximation. We apply the approach to the second-harmonic generation (SHG) in monolayer and trilayer MoS$_2$. We observe a nontrivial temperature-dependence of the SHG due to a strong crystal-momentum dependent quasiparticle renormalization. From the phonon-mode analysis we find that the coupling with acoustic and shear modes determines the overall crystal-momentum dependence respectively in monolayer and trilayer MoS$_2$. The nontrivial temperature-dependence of the SHG can help rationalize the increase of SHG intensity with increasing temperature observed in monolayer MoS$_2$ at a given laser energy [Adv. Optical Mater. 8, 2000441 (2020)].", "url": "https://arxiv.org/abs/2609.07796", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anna Romani"}, {"name": "Claudio Attaccalite"}, {"name": "Myrta Grüning"}], "featured_authors": [{"name": "Anna Romani"}, {"name": "Claudio Attaccalite"}, {"name": "Myrta Grüning"}], "author_count": 3}, {"id": "2609.07830", "category": "cond-mat", "title": "Exact fermionic dual of the Bose-Hubbard model", "abstract": "Recent developments have established exact bosonization and fermionization with a $\\mathbb{Z}_2$ symmetry as dualities through gauging. In this work, we apply fermionic gauging, which realizes generalized Jordan-Wigner transformations, to the Bose-Hubbard (BH) model with a global $U(1)$ symmetry and derive an exact dual description in terms of fermionic composites, built from bosons and fermions. In 1D, this duality generalizes the exact mapping between the extended hard-core BH model and the spinless Fermi-Hubbard model to now cover soft-core interactions. At low energies, the mapping reduces to the well-known equivalence between the sine-Gordon model and the Thirring model. The oscillation wave vector of the fermionic composite correlation function in the gapless phase is fixed by their density, providing a novel manifestation of Luttinger's theorem. We verify the exact duality using density matrix renormalization group (DMRG) calculations and demonstrate that the gapless phase and the phase transition are governed by the compact boson conformal field theory. Our construction naturally extends to generic bosonic systems and higher dimensions, opening new avenues for studying Bose-Fermi mixtures in optical lattices and other strongly correlated quantum systems.", "url": "https://arxiv.org/abs/2609.07830", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lei Su"}, {"name": "Ivar Martin"}, {"name": "Aashish A. Clerk"}], "featured_authors": [{"name": "Lei Su"}, {"name": "Ivar Martin"}, {"name": "Aashish A. Clerk"}], "author_count": 3}, {"id": "2609.07842", "category": "cond-mat", "title": "Valency-bounding correction potential for coarse-grained molecular dynamics simulations", "abstract": "Many systems in soft and living matter bind through a limited number of bonds per particle: proteins associate via discrete surface patches, nucleic acids form one-to-one contacts, and the phase behaviour of multivalent biomolecules is governed by the number of binding sites they carry. In simulations, valency limits are typically enforced with patchy particles, whose anisotropic potentials require integration of rotational degrees of freedom and combine hard cores with narrow patches, which forces small timesteps and commits the model to a fixed binding-site geometry that is often unknown, flexible or mobile. We introduce the valency-bounding correction (VBC), a many-body modification of generic short-range pairwise potentials that smoothly suppresses attraction once the neighbour count of either interacting particle exceeds a prescribed valency. The correction carries no angular degrees of freedom, applies on top of soft repulsive cores and evaluates in two passes over the neighbour list at the cost of a standard pairwise potential. The VBC drives the coordination number to the prescribed valency with low error, while its cluster statistics depart from Wertheim and Flory-Stockmayer predictions through unrestricted ring formation. A tuned variant exchanges bonded partners through ordinary molecular dynamics, reducing bond lifetimes at high saturation by an order of magnitude. On GPUs the cost of the correction is nearly independent of valency, reaching an almost tenfold advantage over a patchy-particle reference. We illustrate large-scale applications by reproducing the reentrant aggregation of repeat-expanded RNA, and show that the VBC also remedies the Fisher-Ruelle thermodynamic instability of soft-core potentials with attraction. The VBC is available as an open-source GPU plugin for HOOMD-blue.", "url": "https://arxiv.org/abs/2609.07842", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vladimir Dmitriev"}, {"name": "Ankit Gupta"}, {"name": "Anton Goloborodko"}], "featured_authors": [{"name": "Vladimir Dmitriev"}, {"name": "Ankit Gupta"}, {"name": "Anton Goloborodko"}], "author_count": 3}, {"id": "2609.07899", "category": "cond-mat", "title": "Tensor network investigation of the monomer-dimer model on the honeycomb lattice", "abstract": "The monomer-dimer model is one of the most well-known unsolved lattice models. In this paper we study the monomer-dimer model on the honeycomb lattice using the tensor network method, in the case that the dimer and monomer activities are 1. The monomer-dimer configurations are exactly mapped into the ground states of the antiferromagnetic Ising model on the Kagomé lattice in the critical field $H_{\\rm{ex}}=4J$, and the tensor network is constructed based on the local ground states of each Ising triangle. The VUMPS approach is employed to contract the tensor network, providing a high-precision result of the monomer-dimer problem. We also revisit the edge coloring problem on the honeycomb lattice and discuss its relationship to the monomer-dimer model. Finally we formulate the monomer-dimer problem in the language of the sixteen-vertex model, and discuss the non-integrability of the general monomer-dimer model and the integrability of the pure dimer model.", "url": "https://arxiv.org/abs/2609.07899", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "De-Zhang Li"}, {"name": "Jie Liu"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "De-Zhang Li"}, {"name": "Jie Liu"}, {"name": "Xin Wang"}], "author_count": 3}, {"id": "2609.08022", "category": "cond-mat", "title": "Nonlinear Topological Orbital Responses of Antiferromagnetic Skyrmions", "abstract": "Antiferromagnetic skyrmions evade the skyrmion Hall effect, but compensation suppresses their conventional topological charge Hall signal. We predict a semiclassical nonlinear topological orbital response of an isolated skyrmion in a $\\mathcal{PT}$-symmetric hexagonal antiferromagnet without spin-orbit coupling. In the diffusive, weak-emergent-field regime, the spin-dependent emergent Lorentz force reshapes the carrier distribution, generating a local orbital Hall-current correction and a local orbital accumulation, both quadratic in the applied electric field. The current correction requires spin-asymmetric longitudinal scattering, whereas the accumulation survives spin-symmetric scattering. When the spin-diffusion length greatly exceeds the strip width, the current correction persists while the accumulation approaches zero. Both signals are even under electric-field reversal, odd under reversal of the skyrmion topological charge $Q$, and helicity independent within this model. These symmetries enable rectified detection and distinguish this mechanism from the $Q$-even quantum-regime topological orbital Hall effect.", "url": "https://arxiv.org/abs/2609.08022", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Amir N. Zarezad"}, {"name": "Arne Brataas"}, {"name": "Alireza Qaiumzadeh"}], "featured_authors": [{"name": "Amir N. Zarezad"}, {"name": "Arne Brataas"}, {"name": "Alireza Qaiumzadeh"}], "author_count": 3}, {"id": "2609.08054", "category": "cond-mat", "title": "Leveraged Learning: entropy destroyed per bit received", "abstract": "A learner holds a prior belief over boolean maps that answer a finite set of $Q$ questions, and receives answers one by one. Each answer costs surprisal and destroys uncertainty, not only about the question asked but every question still unasked. We call the ratio the leverage: table entropy destroyed per bit of surprisal received. It is unit for a uniform prior, but with an intelligent prior can be higher (not lower). Averaged over the truth prior and over the question order, the leverage is found exactly, and is generated by one sequence: the mean entropy $G_\\ell$ of the answers to $\\ell$ questions. Sending the number of input bits to infinity at fixed asked fraction $t = \\ell/Q$, the increments of that sequence become a profile $\\gamma(t)$, and initial question entropy $\\eta_0$. The leverage closes to a thermodynamic limit. $L(t) = [\\eta_0 - (1-t)\\gamma(t)]/\\int_0^t \\gamma$. Exchangeable priors, by de Finetti, all give a flat $\\gamma(t)$ and hence a hyperbolic $L(t)$, their deduction confined to a boundary layer at $t = 0$. We construct a simplicity prior that escapes this, grading Boolean maps by the degree of their polynomial over $\\mathbb{F}_2$ and budgeting weight across degree shells by a CDF $F$. Reed-Muller capacity then gives $\\gamma(t) = 1 - F(t)$ exactly, so any nonincreasing profile, and any leverage curve it generates, is realizable at macroscopic times.", "url": "https://arxiv.org/abs/2609.08054", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daniel Chernowitz"}], "featured_authors": [{"name": "Daniel Chernowitz"}], "author_count": 1}, {"id": "2609.08100", "category": "cond-mat", "title": "Electronic Orbital Angular Momentum Driven by Finite-Momentum Phonons: Beyond Chiral and Axial Phonons", "abstract": "We show that finite-momentum phonons generate electronic orbital angular momentum (OAM) even without phonon axiality or chirality, with the response controlled by the phonon wave vector $q$ and frequency $\\omega$. We develop a general gauge-field theory in which a unitary transformation absorbs the phonon displacement into emergent vector and scalar potentials acting on the electrons, providing a perturbative classification of the OAM response in $q$ and $\\omega$. We derive $q$- and $\\omega$-scaling laws for AC and DC responses. Notably, AC OAM arises even for linearly polarized phonons, with its magnitude and sign tunable by $q$. Its generation is governed by the matching between the phonon geometry and the electronic orbital texture rather than solely by the phonon angular momentum. The connection of the DC response to the electronic Berry curvature further supports that phonon angular momentum is not the only degree of freedom governing electronic OAM generation. Time-dependent tight-binding simulations under acoustic-phonon driving independently confirm the core predictions. Our results extend phonon-driven OAM beyond chiral and axial phonons and establish a wave-vector-tunable route to orbitronics, accessible with surface acoustic waves.", "url": "https://arxiv.org/abs/2609.08100", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yongho Park"}, {"name": "Jeonghun Sohn"}, {"name": "Sejoong Kim"}, {"name": "Kyoung-Whan Kim"}], "featured_authors": [{"name": "Yongho Park"}, {"name": "Jeonghun Sohn"}, {"name": "Sejoong Kim"}, {"name": "Kyoung-Whan Kim"}], "author_count": 4}, {"id": "2609.08104", "category": "cond-mat", "title": "Tunable topological narrow bands in twisted bilayer-trilayer graphene", "abstract": "We investigate the low-energy band structure and topology of twisted bilayer--trilayer graphene with four stacking configurations: AB--ABC, BA--ABC, AB--ABA, and BA--ABA. Using both tight-binding and continuum models, we first establish that the two approaches show good agreement in the band structure in low-energy regime. We then study the evolution of the flat bands and their valley Chern numbers as functions of twist angle, perpendicular electric field, and the self-consistent Hartree potential. At relatively large twist angles and under electric field, we find a topological transition between the narrow bands, with the total Chern number of the flat bands following the Chern number sum rules derived from the chiral-limit description. We also observe another type of topological transition when the flat bands hybridize with adjacent remote bands, where gap closing and reopening processes lead to Chern number and charge density transfer. By constructing topological phase diagrams in the space of twist angle and electric field, we show that the perpendicular electric field provides an efficient tuning knob for controlling the stability and transitions of the Chern bands. Finally, we find that the Hartree potential mainly induce weak band shifts and reshaping in the narrow bands. However, with a combination of Hartree potential and the electric fields, the narrow bands show rich topological phase diagram. Our results clarify the interplay between the stacking, twist angle and electric field in manipulating the narrow bands and their topology in twisted bilayer--trilayer graphene, and provide guidance for engineering topological narrow bands with tunable Chern numbers in realistic twisted multilayer graphene systems.", "url": "https://arxiv.org/abs/2609.08104", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dong Wang"}, {"name": "Federico Escudero"}, {"name": "Zhen Zhan"}, {"name": "Shengjun Yuan"}], "featured_authors": [{"name": "Dong Wang"}, {"name": "Federico Escudero"}, {"name": "Zhen Zhan"}, {"name": "Shengjun Yuan"}], "author_count": 4}, {"id": "2609.08114", "category": "cond-mat", "title": "Atomistic modeling of molecular beam epitaxy growth of SrTiO3 and Sr2TiO4 thin films", "abstract": "Molecular beam epitaxy (MBE) is renowned for its potential for atomic layer control, but unexpected growth mechanisms can potentially compromise this level of precision. In this study, we employ first-principles calculations to investigate the atomistic processes governing the MBE growth of perovskite SrTiO3 and Ruddlesden-Popper Sr2TiO4 films on a SrTiO3 substrate. We systematically explore the potential molecular species in the gas phase and their reactions and diffusion dynamics on the film surfaces and layer edges. Our analyses uncover three mechanisms of importance for understanding this type of growth. First, oxygen vacancies can be dynamically induced during surface diffusion on defect-free substrate and noticeably accelerate the diffusion processes. Second, while the SrO layer is expected to grow in a single-layer growth mode, the presence of potential TiSr defects may promote the formation of SrO islands. Lastly, adsorbed Ti atoms and TiO2 molecules on the SrO bilayer can insert into SrO bilayers, resulting in an unexpected growth sequence. These findings may have broader implications for the MBE growth of metal oxide films and provide guidance for achieving improved control over their growth processes.", "url": "https://arxiv.org/abs/2609.08114", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Guangfu Luo"}, {"name": "Dane Morgan"}], "featured_authors": [{"name": "Guangfu Luo"}, {"name": "Dane Morgan"}], "author_count": 2}, {"id": "2609.08120", "category": "cond-mat", "title": "Textures as a phase-transition probe for quantum spin chains", "abstract": "The idea of quantum texture has been recently proposed and used as a tool for quantifying coherences and for quantum gate identification. In this work we offer a study on its usage to quantum phase transitions, demonstrating the rugosity metric as a simple tool for effective phase-transition probing. We establish the link between rugosity in the computational basis and the hierarchy of spin correlators, and analyze rugosities defined in the global ground-state and in ground-states belonging to different magnetization sectors (to which we refer to as global vs symmetry-resolved rugosities) to study the phase diagram of the Heisenberg XXZ model. We find distinct rugosity signatures at both transition points. In particular, a sharp feature appears at $\\Delta=1$ already for small systems, revealing a pronounced sensitivity of the correlation hierarchy encoded by the texture to this point. Since the BKT transition coincides with the isotropic $SU(2)$ point of the XXZ model, this behavior may reflect a particular sensitivity of rugosity to the structure of the spin-correlation hierarchy at isotropy.", "url": "https://arxiv.org/abs/2609.08120", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Heitor P. Casagrande"}, {"name": "Isaac M. Carvalho"}, {"name": "William J. Munro"}, {"name": "Krissia Zawadzki"}], "featured_authors": [{"name": "Heitor P. Casagrande"}, {"name": "Isaac M. Carvalho"}, {"name": "William J. Munro"}, {"name": "Krissia Zawadzki"}], "author_count": 4}, {"id": "2609.08141", "category": "cond-mat", "title": "Successive Phase Transitions from a Composite Fermion Liquid to a Fractional Quantum Hall State at ν=3/2 Driven by In-Plane Magnetic Field", "abstract": "We report an even-denominator fractional quantum Hall state at {\\nu} = 3/2 induced entirely by in-plane magnetic field B_|| in an ultra-high-mobility GaAs quantum well. As B_|| increases, the system undergoes two successive transitions: from a composite fermion liquid to a soft-gap FQH state (B_||~12.2 T), then via a topological phase transition to a hard-gap robust FQH state (B_||~14.7 T), accompanied by a daughter state at {\\nu} = 19/13. We present systematic data, and discuss a possible scenario in interpreting these findings. Our work demonstrates that topological order may be engineered through k-space Fermi contour splitting under an in-plane magnetic field.", "url": "https://arxiv.org/abs/2609.08141", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xinghao Wang"}, {"name": "L. N. Pfeiffer"}, {"name": "A. Gupta"}, {"name": "K. W. Baldwin"}, {"name": "K. W. West"}, {"name": "Rui-Rui Du"}], "featured_authors": [{"name": "Xinghao Wang"}, {"name": "L. N. Pfeiffer"}, {"name": "A. Gupta"}, {"name": "K. W. Baldwin"}, {"name": "K. W. West"}, {"name": "Rui-Rui Du"}], "author_count": 6}, {"id": "2609.08146", "category": "cond-mat", "title": "Transport properties and topological phase transitions for a Creutz-Su-Schrieffer-Heeger ladder", "abstract": "In this work, we investigate the electronic, topological, and transport properties of a Creutz-Su-Schrieffer-Heeger (CSSH) ladder. Using a tight-binding model within the Green's function formalism, we calculate the energy spectrum, local density of states (LDOS), and electronic transmission. We first determine the energy spectrum of the CSSH ladder and analyze the different topological phases present in the system, identifying one trivial phase and three distinct nontrivial regions. We then study electronic transport and show that the transmission reproduces the different topological phases through characteristic transport signatures. Finally, we derive the conditions for the emergence of non-topological flat bands and demonstrate that these bands also provide the necessary conditions for the formation of bound states in the continuum (BICs). Our results establish a direct connection between the topological properties, flat-band formation, and electronic transport in the CSSH ladder.", "url": "https://arxiv.org/abs/2609.08146", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "K. A. González"}, {"name": "S. Bravo"}, {"name": "L. Rosales"}, {"name": "P.A. Orellana"}], "featured_authors": [{"name": "K. A. González"}, {"name": "S. Bravo"}, {"name": "L. Rosales"}, {"name": "P.A. Orellana"}], "author_count": 4}, {"id": "2609.08202", "category": "cond-mat", "title": "Viscoelasticity reshapes the frequency response of a rotating magnetic particle", "abstract": "A magnetic particle driven by a rotating magnetic field undergoes a transition from synchronous to asynchronous rotation at a critical driving frequency. The asynchronous dynamics is well understood in Newtonian fluids but remains unclear in viscoelastic media. Here, we develop a theoretical description of the asynchronous rotation of a magnetic particle in a Jeffreys-type viscoelastic fluid. The particle's time-averaged angular velocity exhibits a nontrivial frequency dependence that changes from non-monotonic to monotonic as the polymer relaxation time increases. This behavior is explained by the interplay among magnetic driving, viscoelastic relaxation, and frequency-dependent viscous dissipation. We further derive an asymptotic expression that captures the non-monotonic dependence. These results clarify how solvent and polymer contributions jointly control asynchronous rotation and provide a physical basis for guiding relevant applications in complex fluids.", "url": "https://arxiv.org/abs/2609.08202", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhiyuan Zhao"}, {"name": "Tingting Sun"}, {"name": "Han Gao"}, {"name": "Ye Xu"}, {"name": "Mingcheng Yang"}, {"name": "Masao Doi"}], "featured_authors": [{"name": "Zhiyuan Zhao"}, {"name": "Tingting Sun"}, {"name": "Han Gao"}, {"name": "Ye Xu"}, {"name": "Mingcheng Yang"}, {"name": "Masao Doi"}], "author_count": 6}, {"id": "2609.08219", "category": "cond-mat", "title": "Speed Limit for Information Acquisition in Stochastic Learning Dynamics", "abstract": "Neural networks acquire internal representations through learning. In this work, we formulate stochastic gradient descent (SGD) as a Markovian stochastic process and derive a Fisher-information flow speed limit that bounds the rate at which trainable parameters can acquire information about latent variables in the data-generating process. The resulting inequality decomposes the information flow into drift and noise contributions, thereby quantifying the roles of deterministic learning forces and SGD-induced fluctuations from an information-theoretic perspective. We verify the bound in analytically tractable basis-function linear regression, where the information budget predicted by the bound reproduces the ordering and characteristic time scales with which different latent variables are encoded in the learned parameters. These results establish Fisher-information speed limits as a quantitative framework for diagnosing when and how different aspects of the data-generating mechanism are acquired during stochastic learning.", "url": "https://arxiv.org/abs/2609.08219", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shuta Kobayashi"}, {"name": "Andreas Dechant"}], "featured_authors": [{"name": "Shuta Kobayashi"}, {"name": "Andreas Dechant"}], "author_count": 2}, {"id": "2609.08235", "category": "cond-mat", "title": "A unified description of flow-induced scission of wormlike micelles under shear and extensional flows", "abstract": "We investigate flow-induced scission of wormlike micelles under different flow kinematics using dissipative particle dynamics simulations of surfactant solutions in shear, uniaxial extensional, planar extensional, and biaxial extensional flows. The average lifetime of wormlike micelles is used to quantify the degree of scission. While flow-induced scission occurs in all flow types when the deformation rate is sufficiently high, the dependence of the average lifetime on the deformation rate differs among flow types. To provide a unified description, we introduce an effective extension rate determined by the velocity gradient tensor and micellar orientation. When expressed in terms of this effective extension rate, the average lifetimes obtained under all flow types considered collapse onto a single curve. These results demonstrate that a unified description of flow-induced scission requires not only the strength and kinematics of the imposed flow, but also the micellar orientation relative to the extensional direction.", "url": "https://arxiv.org/abs/2609.08235", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yusuke Koide"}, {"name": "Takato Ishida"}, {"name": "Takashi Uneyama"}, {"name": "Yuichi Masubuchi"}], "featured_authors": [{"name": "Yusuke Koide"}, {"name": "Takato Ishida"}, {"name": "Takashi Uneyama"}, {"name": "Yuichi Masubuchi"}], "author_count": 4}, {"id": "2609.08237", "category": "cond-mat", "title": "Magnetochiral anisotropy of thermally activated phase slips in noncentrosymmetric superconductors", "abstract": "Resistive tails of narrow superconducting wires below the critical temperature are governed by phase slips, thermally activated near the transition and quantum at lower temperatures. We develop the theory of thermally activated phase slips in wires lacking inversion symmetry, modeled microscopically as a diffusive wire formed from a two-dimensional electron gas with Rashba spin-orbit coupling in an in-plane magnetic field. The phase-slip resistance acquires magnetochiral anisotropy: at fixed current it changes upon reversal of the field, and at fixed field upon reversal of the current, while the linear-response resistance remains field symmetric as required by Onsager reciprocity. The nonreciprocity originates from an asymmetry of the phase-slip activation barrier that is odd in both current and field. It is generated by the Lifshitz invariants of the free energy, the cubic gradient term and the momentum-odd quartic vertex, together with even gradient terms promoted to odd ones by the helical ground state, precisely the combination that determines the superconducting diode effect. The barrier asymmetry is therefore fixed by the diode efficiency of the same wire through a universal numerical ratio, with no adjustable parameters. The kinetic Lifshitz invariant, which makes relaxation and noise of the order parameter nonreciprocal, affects only the fluctuation prefactor at a parametrically subleading level. Because the asymmetry resides in the activation exponent, the magnetochiral signal is amplified relative to the diode asymmetry by the ratio of barrier height to temperature, and appears as a field-antisymmetric splitting of the exponential slopes of differential-resistance traces routinely used to identify thermally activated phase slips.", "url": "https://arxiv.org/abs/2609.08237", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alex Levchenko"}], "featured_authors": [{"name": "Alex Levchenko"}], "author_count": 1}, {"id": "2609.08295", "category": "cond-mat", "title": "Flexoelectric Polarization in Wrinkled Janus Transition-Metal Dichalcogenide Monolayers", "abstract": "Strain-gradient engineering via out-of-plane wrinkling offers a powerful route to tune electronic and electromechanical properties in two-dimensional (2D) materials. Here, we systematically investigate the electronic and flexoelectric response of wrinkled Janus MoSSe/MoSeS monolayers using density functional theory (DFT) calculations coupled with continuum elastica modeling. Exploring varying wrinkle sizes and compressive strain levels ($5\\%-20\\%$), we show that the global out-of-plane polarization follows a linear behavior when parameterized by the projected aspect ratio of the nanowrinkles. On this basis, we develop a physically grounded geometric model incorporating an effective 2D flexoelectric coefficient, which accurately predicts DFT polarizations without requiring higher-order nonlinear parameters. Atom- and orbital-resolved charge density analyses reveal the microscopic origin of this behavior: while the central Mo $4d$-orbital manifold acts as a robust, linear flexoelectric core, local curvature drives continuous, chemically asymmetric charge transfer between the S $3p$ and Se $4p$ sublayer manifolds. Our findings establish clear geometric design rules for harnessing Janus-based flexoelectricity for flexible nanoelectronics and optoelectronics.", "url": "https://arxiv.org/abs/2609.08295", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stefan Velja"}, {"name": "Surender Kumar"}, {"name": "Domenico Corona"}, {"name": "Caterina Cocchi"}], "featured_authors": [{"name": "Stefan Velja"}, {"name": "Surender Kumar"}, {"name": "Domenico Corona"}, {"name": "Caterina Cocchi"}], "author_count": 4}, {"id": "2609.08326", "category": "cond-mat", "title": "$1/3$-Flux Bound States in Multicomponent Superconductor Exhibiting Non-Abelian Statistics of $\\mathbb {Z}_3$ Parafermions", "abstract": "Multicomponent superconductors (MSCs) are predicted to host magnetic flux quanta carrying arbitrary fractions of the superconducting flux quantum. Recent advances have raised the expectation that $1/3$ flux quanta may emerge in MSCs with $C_3$ rotational symmetry. Electrons bound to such fractional flux are long regarded to form anyons, yet their explicit braiding statistics remain unexplored. We propose that these 1/3-flux bound states (1/3-FBSs) exhibit the intriguing non-Abelian statistics of $\\mathbb{Z}_3$ parafermions. Under no-double-occupancy constraint, two successive braiding operations of 1/3-FBSs are equivalent to a single $\\mathbb Z_3$ parafermion braiding operation. The parafermion parity encoding the braiding outcome can be read out via the fermionic occupation number of the 1/3-FBSs. Combined with a crossed-Andreev-reflection-induced Hadamard gate, one can realize the complete set of $\\mathbb{Z}_3$ parafermion braiding operations.", "url": "https://arxiv.org/abs/2609.08326", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xing-Yu Wu"}, {"name": "Y. H. Wang"}, {"name": "X. C. Xie"}, {"name": "Yijia Wu"}], "featured_authors": [{"name": "Xing-Yu Wu"}, {"name": "Y. H. Wang"}, {"name": "X. C. Xie"}, {"name": "Yijia Wu"}], "author_count": 4}, {"id": "2609.08447", "category": "cond-mat", "title": "Impurity as a probe of Berry curvature and wavefunction winding in gapped two-band models", "abstract": "We explore the possibility of using quasiparticle interference near impurities to extract non-local properties of bands. Focusing on the minimal two-band description of a system with multiple valleys, we show that the local density of states (LDOS) induced by non-magnetic impurities can effectively probe both the Berry curvature and the wavefunction winding, locally in each valley. We analyze gapped models based on Dirac, semi-Dirac, quadratic touching, and higher-order touching energy dispersions, in presence of a point-like potential scatterer. We find that for strong enough impurity potentials the LDOS along a contour around the impurity unambiguously shows the wavefunction winding number, in contrast to the case of gapless Dirac-like dispersions where the winding can be precluded by LDOS oscillations in the radial direction. We also establish a general connection between, on the one hand, the Berry curvature as a function of momentum locally in a valley, and on the other hand, the wavefunction winding number and the energy dispersion parameters, making hence the local Berry curvature directly observable from spectroscopic LDOS information.", "url": "https://arxiv.org/abs/2609.08447", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Reda Nabil"}, {"name": "Pascal Simon"}, {"name": "Andrej Mesaros"}], "featured_authors": [{"name": "Reda Nabil"}, {"name": "Pascal Simon"}, {"name": "Andrej Mesaros"}], "author_count": 3}, {"id": "2609.08477", "category": "cond-mat", "title": "Nonequilibrium stochastic thermodynamics of boundary functionals: From Zubarev's ensemble to stochastic particle separation", "abstract": "This paper develops a generalization of Zubarev's nonequilibrium statistical operator method for the case of simultaneous inclusion of additive and nonlocal boundary functionals of trajectories. Using a unified thermodynamic approach, a three-parameter model of nonequilibrium systems is constructed, including the first-passage time, the dwell time above a given level, and the absolute extremum of the process. A correspondence is demonstrated between the maximum information entropy method for trajectories and the Donsker-Varadan large deviation formalism. Using the Doob`s h-transform, it is demonstrated that fixing extremal functionals of history induces efficient non-Markovian transport in the system with dynamic adaptation to historical records. Criteria for the applicability of the developed apparatus in the \"large time\" domain and the possibilities of its use for optimizing stochastic particle separation in periodic potentials are discussed.", "url": "https://arxiv.org/abs/2609.08477", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "V. V. Ryazanov"}], "featured_authors": [{"name": "V. V. Ryazanov"}], "author_count": 1}, {"id": "2609.08478", "category": "cond-mat", "title": "Phonon-Programmable Hidden Unconventional Magnetism in Two-Dimensional Spin-Degenerate Antiferromagnets", "abstract": "Spin-degenerate antiferromagnets can host hidden unconventional magnetism in their lattice degrees of freedom. We show that coherent phonons activate this magnetism by removing the spin-layer operations that enforce equilibrium band degeneracy without changing the collinear Néel order. The frequency and polarization of a pump electric field select a resonant \\(\\Gamma\\)-point optical phonon and, within a doublet, its coordinate direction. This choice fixes the residual spin-layer symmetry. In monolayer MnPSe$_3$, an \\(A_{2u}\\) mode produces \\(i\\)-wave splitting odd in the mass-weighted phonon coordinate $Q$, reversing sign under $Q\\to-Q$, whereas two orthogonal directions of the same doubly degenerate \\(E_u\\) doublet produce \\(d\\)- and \\(s\\)-wave splitting at a common resonance. Rotating the in-plane pump field \\(\\bm E_\\parallel\\) therefore programs both the spin-splitting texture and the thermoelectric spin current, continuously tuning the response between transverse pure-spin and longitudinal spin-polarized currents. A complete classification of two-dimensional collinear spin layer groups identifies the \\(\\Gamma\\)-point coordinates that remove the degeneracy-enforcing operations and activate such unconventional magnetism.", "url": "https://arxiv.org/abs/2609.08478", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xiaonong Shen"}, {"name": "Cheng Tang"}, {"name": "Wei Ren"}], "featured_authors": [{"name": "Xiaonong Shen"}, {"name": "Cheng Tang"}, {"name": "Wei Ren"}], "author_count": 3}, {"id": "2609.08535", "category": "cond-mat", "title": "Memory Control of Ice Growth During Non-Equilibrium Freezing of Water", "abstract": "Freezing of supercooled water is a classic non-equilibrium problem, yet the influence of thermal history on crystallization remains unclear. Using molecular dynamics simulations with the TIP4P/Ice model, we investigate how the initial temperature $T_i$ shapes freezing following rapid quenching to 250 K. By monitoring the evolution of hydrogen-bonded ring structures, we find a non-monotonic dependence of the freezing time $t_F$ on $T_i$, with the slowest crystallization occurring near 300 K. Remarkably, this means that initially hotter water can freeze faster than cooler water, a molecular-scale analogue of the Mpemba effect. A non-stationary generalized Langevin equation framework shows that two-time memory kernels retain information about the system's thermal past, directly influencing crystallization dynamics. Structural analysis further reveals that five-membered rings act as kinetic traps, while correlations among ring types regulate the accessibility of ice-like motifs. These results uncover a molecular origin of memory-driven freezing and establish structural memory as a key driver of non-equilibrium phase transitions.", "url": "https://arxiv.org/abs/2609.08535", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Abhigyan Hazarika"}, {"name": "Sudeep N. Punnathanam"}, {"name": "Biman Bagchi"}, {"name": "Prabal K. Maiti"}], "featured_authors": [{"name": "Abhigyan Hazarika"}, {"name": "Sudeep N. Punnathanam"}, {"name": "Biman Bagchi"}, {"name": "Prabal K. Maiti"}], "author_count": 4}, {"id": "2609.08548", "category": "cond-mat", "title": "Schwinger boson perturbation theory for spin-$S$ Kitaev-Heisenberg magnets: phase diagram and dynamical response near Kitaev spin liquids", "abstract": "We develop a Schwinger boson perturbative framework for the spin-$S$ Kitaev-Heisenberg model. The spin-liquid saddle point of the pure Kitaev model is used as the unperturbed state, and magnetic instabilities and dynamical spin correlations are evaluated around this saddle point. We decompose the Hamiltonian exactly into two parts by exploiting the Klein duality intrinsic to the Kitaev-Heisenberg model. We perform the random-phase approximation by taking the part invariant under the duality transformation as the unperturbed term and treating the remaining term, which changes sign under it, as the perturbation. We determine the phase boundaries separating the quantum spin-liquid regimes from the adjacent magnetically ordered phases for $S=1/2$, $1$, $3/2$, and $2$. The spin-liquid regions shrink rapidly with increasing $S$ and become very narrow at $S=2$. We also compute the spin dynamics of the spin-$S$ Kitaev-Heisenberg model, focusing on $S=1$, and find that the dressed dynamical spin structure factor retains a broad two-spinon continuum at finite energies, while the low-energy spectral weight softens at the ordering wave vectors of the adjacent magnetic phases. Our framework thus enables thermodynamic-limit calculations of spin dynamics near magnetic instabilities.", "url": "https://arxiv.org/abs/2609.08548", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daiki Sasamoto"}, {"name": "Joji Nasu"}], "featured_authors": [{"name": "Daiki Sasamoto"}, {"name": "Joji Nasu"}], "author_count": 2}, {"id": "2609.08699", "category": "cond-mat", "title": "Effective particle size governs structure and dynamics in rough hard-particle fluids", "abstract": "We numerically investigate how particle surface roughness affects the static and dynamic properties of a hard-particle fluid across a wide range of densities, rho. These simulations of a simple model of granular systems reveal that, although the amplitude and coverage of surface corrugation significantly influence the rho-dependence of system properties, the qualitative behavior of this dependence remains unchanged. These findings can be described quantitatively by introducing an effective particle size, which enables a direct mapping of the rough particle systems to equivalent hard-disk systems. Analytical calculations provide an explicit form of this mapping, and allow us to predict the static and dynamic properties of rough particles using standard liquid-state theories for hard disks.", "url": "https://arxiv.org/abs/2609.08699", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nanqing Xiao"}, {"name": "Zhen Zhang"}, {"name": "Walter Kob"}, {"name": "Yujie Wang"}], "featured_authors": [{"name": "Nanqing Xiao"}, {"name": "Zhen Zhang"}, {"name": "Walter Kob"}, {"name": "Yujie Wang"}], "author_count": 4}, {"id": "2609.08707", "category": "cond-mat", "title": "Pressure Dependence of Ferromagnetism in Uranium Hydride UH$_3$ up to 20 GPa Revealed by NV Centers Magnetometry", "abstract": "The origin of ferromagnetism in the stable $\\beta$-UH$_3$ phase is still debated. With a high Curie temperature and a short uranium-uranium interatomic distance, $\\beta$-UH$_3$ is placed outside the known systematics of uranium compounds. Pressure provides a powerful means of tuning magnetism toward its suppression, thereby offering valuable insights into its underlying mechanisms, yet the high-pressure behavior of $\\beta$-UH$_3$ has remained largely unexplored. Here, we combine in the Diamond Anvil Cell (DAC) the development of pure $\\beta$-UH$_3$ synthesis and widefield nitrogen-vacancy (NV) center magnetometry to measure the pressure dependence of the Curie temperature in $\\beta$-UH$_3$ up to about 20~GPa. We present two data analysis methods, vector magnetic field reconstruction and statistical analysis of the optically detected magnetic resonance (ODMR) response, which enable us to directly image the magnetic dipole of $\\beta$-UH$_3$ during isobaric warming. We observe a linear decrease in the Curie temperature with pressure, yielding a slope of $\\text{d}T_C/\\text{d}P=-3.86\\,(8)$~K/GPa. Ferromagnetism in $\\beta$-UH$_3$ is predicted to reach 0~K at approximately 44~GPa, where a quantum critical point may emerge.", "url": "https://arxiv.org/abs/2609.08707", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Valentin Schmidt"}, {"name": "Loïc Toraille"}, {"name": "Florent Occelli"}, {"name": "Jean-François Roch"}, {"name": "Paul Loubeyre"}], "featured_authors": [{"name": "Valentin Schmidt"}, {"name": "Loïc Toraille"}, {"name": "Florent Occelli"}, {"name": "Jean-François Roch"}, {"name": "Paul Loubeyre"}], "author_count": 5}, {"id": "2609.08768", "category": "cond-mat", "title": "Examining Convergence of Cluster Perturbation Theory and Cluster Coupled Cluster for J1-J2 Heisenberg Spin Lattices", "abstract": "In previous work, it was shown that using the cluster mean field(cMF) wavefunction as the zeroth order wavefunction for perturbation theory and coupled cluster produces a reasonable approximation for the J 1-J 2 Heisenberg model in the thermodynamic limit(TDL). However, this work was limited to cPT4 and cCCSD. The central claim of cMF is that it takes strongly correlated systems and makes them weakly correlated so that PT weakly correlated methods can be used. To confirm that this claim is true, it is important to show that the PT and CC series converge. In this paper, we extend the previous calculations to cPT7 and cCCSDTQ5 where we show that the energy is converging. We also discuss how to perform cluster based calculations efficiently in the thermodynamic limit, which is crucial for these more expensive calculations.", "url": "https://arxiv.org/abs/2609.08768", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jeffrey Keyes"}, {"name": "Carlos Jimenez-Hoyos"}], "featured_authors": [{"name": "Jeffrey Keyes"}, {"name": "Carlos Jimenez-Hoyos"}], "author_count": 2}, {"id": "2609.08820", "category": "cond-mat", "title": "When does nonreciprocity matter? Scale-dependence and nonequilibrium signatures", "abstract": "Nonreciprocity is increasingly recognized as a unifying concept linking diverse nonequilibrium phenomena found across physics, chemistry, and biology. It gives rise to distinctive behavior including run-and-chase dynamics and spatio-temporal patterns, often associated with a breaking of time-reversal symmetry. However, nonreciprocity and its nonequilibrium signatures are fundamentally scale-dependent, and may emerge or disappear under coarse-graining. A central challenge is therefore to understand when and how nonreciprocity manifests itself on different scales, for example via irreversible fluctuations or macroscopic currents. In this Perspective, we discuss the physical origin and fate of effective nonreciprocal interactions and the characteristic irreversible dynamics they give rise to across scales.", "url": "https://arxiv.org/abs/2609.08820", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sarah A.M. Loos"}, {"name": "Robert L. Jack"}], "featured_authors": [{"name": "Sarah A.M. Loos"}, {"name": "Robert L. Jack"}], "author_count": 2}, {"id": "2609.08839", "category": "cond-mat", "title": "Non-perturbative theory of valley splitting in Si qubits from variational wave function: periodic effects of shear strain and asymptotic freedom in the wiggle-well potential", "abstract": "Valley splitting sets the energy scale at which spin and valley degrees of freedom hybridize in silicon quantum-well qubits, but its sensitivity to interface structure makes it difficult to predict. Using the valleyor basis, we formulate a two-band effective-mass model for intervalley coupling in a finite quantum well and develop an analytical framework for treating non-perturbative effects of shear strain and wiggle-well potentials. For a $z$-independent coupling $V_s\\tau_2$, corresponding to uniform shear strain, we construct a variational state from the exact plane-wave va
