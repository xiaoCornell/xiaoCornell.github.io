2n)$ Chern-Simons theory at level $n+\\frac32$, whose dual is a $U(1)^{n}$ theory with a tadpole level matrix and a bare monopole superpotential.", "url": "https://arxiv.org/abs/2609.08648", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tadashi Okazaki"}, {"name": "Douglas J. Smith"}], "featured_authors": [{"name": "Tadashi Okazaki"}, {"name": "Douglas J. Smith"}], "author_count": 2}, {"id": "2609.08697", "category": "hep-th", "title": "Mass for Particles from Extra Dimensions", "abstract": "We investigate a geometric mechanism for mass generation in a codimension-two hedgehog braneworld. A massless particle propagating in the bulk acquires an effective four-dimensional mass through its motion along the compact angular extra dimension, yielding a dynamically determined Kaluza-Klein spectrum after canonical quantization. While the bosonic sector exhibits no radial confinement, extending the analysis to N = 1, 2 spinning-particle models shows that the spin-curvature coupling modifies the effective potential and introduces a level-dependent localization pattern for the Kaluza-Klein modes. The results establish a particle-mechanics realization of geometric mass generation in flux-supported codimension-two braneworlds and highlight the interplay between bulk geometry, spin, and the effective four-dimensional mass spectrum.", "url": "https://arxiv.org/abs/2609.08697", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "F.E.A. de Souza"}, {"name": "M.O. Tahim"}, {"name": "R.I. de Oliveira Junior"}, {"name": "I. M. Macêdo"}], "featured_authors": [{"name": "F.E.A. de Souza"}, {"name": "M.O. Tahim"}, {"name": "R.I. de Oliveira Junior"}, {"name": "I. M. Macêdo"}], "author_count": 4}, {"id": "2609.08831", "category": "hep-th", "title": "Splitting Dynamics of Multiply Quantized Vortices in Holographic Superfluid of Finite Temperature", "abstract": "We study the splitting dynamics of multiply quantized vortices with winding numbers $n=5,6,7$ and $8$ in a two-dimensional holographic superfluid at finite temperature, by combining linear perturbation analysis of quasinormal modes with fully nonlinear real-time numerical simulations. Three new physical phenomena are revealed. First, the number of unstable modes no longer strictly follows the $2n-3$ formula as $n$ increases. For the vortex with $n=8$, the unstable mode with $p=2(n-1)$ is absent throughout the entire temperature range, so that only $2n-4$ unstable modes exist. Second, the transition of the dominant unstable mode with increasing temperature exhibits new characteristics. For vortices with $n\\le 6$, the dominant mode changes sequentially as $p=2,3,\\dots,n$, whereas for $n\\ge 7$ jump-like transitions occur-for instance, for $n=7$ the dominant mode jumps from $p=2$ to $p=4$ at $T=0.325T_c$ and then directly to $p=7$ at $T=0.359T_c$, and for $n=8$ it jumps directly from $p=2$ to $p=8$ at $T=0.302T_c$. Third, a single splitting pattern of high-winding-number vortices can contain multiple sub-splitting patterns with distinct topological structures, as exemplified by the $l=4$ pattern of the $n=8$ vortex, which exhibits three sub-patterns at low, intermediate and high temperatures. The nonlinear simulations confirm the predictions of the linear stability analysis, and the implications of our results for cold-atom experiments are discussed.", "url": "https://arxiv.org/abs/2609.08831", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shanquan Lan"}, {"name": "Xin Li"}, {"name": "Jiexiong Mo"}, {"name": "Yu Tian"}, {"name": "Yu-Kun Yan"}, {"name": "Hongbao Zhang"}], "featured_authors": [{"name": "Shanquan Lan"}, {"name": "Xin Li"}, {"name": "Jiexiong Mo"}, {"name": "Yu Tian"}, {"name": "Yu-Kun Yan"}, {"name": "Hongbao Zhang"}], "author_count": 6}, {"id": "2609.08874", "category": "hep-th", "title": "Covariant Phase Space and Carroll-Weyl $χ$ Symmetry of Carroll Non-BPS D$_p$-branes", "abstract": "We analyze the covariant phase space of Klusoň's canonical Carroll non-BPS D\\(_p\\)-brane actions. The Carroll limit is formulated as a contraction of the canonical phase space: the canonical one-form is invariant under the scaling of conjugate pairs, while the leading Hamiltonian constraint differs between the electric-like and magnetic-like sectors. This difference controls the weak closure of the electric-like constraint algebra and the stronger closure of the magnetic-like Hamiltonian brackets. We separate the generic non-BPS sector, which carries \\(D-1\\) local phase-space degrees of freedom, from the tachyon-vacuum sector, which carries \\(D-2\\) only after imposing second-class background conditions. We also identify the rank condition for the generic electric-like sector and its strengthening in the vacuum sector. Finally, we show that the Carroll--Weyl \\(\\chi\\) transformation preserves the symplectic form and admits a charge, but is obstructed by the constraints and cannot be promoted to a first-class gauge generator except in a highly restricted global vacuum sector. This contrasts with null string theory, where a restricted \\(\\chi\\)-symmetry can be completed to an additional first-class constraint.", "url": "https://arxiv.org/abs/2609.08874", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Limin Zeng"}], "featured_authors": [{"name": "Limin Zeng"}], "author_count": 1}, {"id": "2609.08955", "category": "hep-th", "title": "Quantum spacetime and gravity from the IKKT matrix model: an invitation", "abstract": "This is a concise and compact introduction to a framework for spacetime, gravity, and fundamental physics based on the IKKT matrix model, focusing on conceptual and structural aspects. The approach rests on nontrivial vacua or matrix backgrounds, which serve as 3+1-dimensional noncommutative spacetime. We discuss a specific class of backgrounds describing expanding homogeneous and isotropic FLRW spacetime, which provide a solution of the one-loop effective action with finitely many dof per volume. Perturbations of the background give rise to fields propagating on spacetime governed by a weakly-coupled gauge theory, as well as a nonstandard description of (quantum) gravity leading to some IR modifications. Maximal supersymmetry of the model is essential to ensure effective locality.", "url": "https://arxiv.org/abs/2609.08955", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Harold C. Steinacker"}], "featured_authors": [{"name": "Harold C. Steinacker"}], "author_count": 1}, {"id": "2609.09007", "category": "hep-th", "title": "5d SCFT fixtures", "abstract": "In the context of the atomic classification of 5d SCFTs building blocks with non-simply laced global symmetries are lacking. In this work we fill this gap by introducing a new class of 5d UV fixed points (the 5d SCFT \"fixtures\"). Physically, 5d SCFTs fixtures are the result of a Higgs branch RG flow, realized geometrically by M-theory on singular threefolds which we identify explicitly. In particular, this enables the construction of 5d conformal matter SCFTs with non-simply laced flavor symmetry. Along the way, we discuss their circle reduction in relation to 4d theories of class-S type.", "url": "https://arxiv.org/abs/2609.09007", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Michele Del Zotto"}, {"name": "Andrea Sangiovanni"}], "featured_authors": [{"name": "Michele Del Zotto"}, {"name": "Andrea Sangiovanni"}], "author_count": 2}, {"id": "2609.09041", "category": "hep-th", "title": "M5 Instantons in ABJM", "abstract": "We study the existence of supersymmetric M5-brane instantons in asymptotically AdS$_4 \\times S^7/\\mathbf{Z}_k$ geometries of M-theory, dual to the ABJM theory. The supersymmetric embeddings of these instantons are determined by the M5-brane $\\kappa$-symmetry, which forces them to localise to the equivariant fixed points in the asymptotically AdS$_4$ geometry, and wrap $(S^3\\times S^3)/\\mathbf{Z}_k $. At the quantum level we find that the one-loop partition function of these instantons vanishes, suggesting that the bulk partition function is instead to be expanded in terms of supergravity modes and M2-brane instantons, in line with known results for the $S^3$ partition function of the dual ABJM theory.", "url": "https://arxiv.org/abs/2609.09041", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jieming Lin"}, {"name": "Jesse van Muiden"}, {"name": "Zihan Wang"}], "featured_authors": [{"name": "Jieming Lin"}, {"name": "Jesse van Muiden"}, {"name": "Zihan Wang"}], "author_count": 3}, {"id": "2609.05465", "category": "math-ph", "title": "Energy dissipation in linear viscoelasticity", "abstract": "We compare the specific dissipation $Q^{-1}\\left( \\omega \\right) $ for the Becker, Lomnitz, and Lambert models in linear viscoelasticity. Graphically, the specific dissipation of these models behaves similarly as $\\omega \\rightarrow 0^{+}$ and $\\omega \\rightarrow +\\infty$. Furthermore, we obtain analytic formulas for the asymptotic behavior of $Q^{-1}\\left( \\omega \\right) $ in the Becker and Lomnitz models as $\\omega \\rightarrow 0^{+}$ and $\\omega \\rightarrow +\\infty$, where the latter limit coincides with the specific dissipation of the Maxwell model. We also derive a novel closed-form expression for the specific dissipation in the generalized Becker model, $Q_{\\nu }^{-1}\\left( \\omega \\right) $, when the parameter $\\nu \\in \\left( 0,1\\right] $ is rational. When $\\nu \\rightarrow 0$, we recover the specific dissipation of the Maxwell model, whereas when $\\nu =1$, we recover that of the original Becker model. In addition, we derive two new closed-form expressions for the specific dissipation for the extended Jeffreys--Lomnitz model $Q_{\\alpha }^{-1}\\left( \\omega \\right) $, the first being valid for $\\alpha \\in \\left( 0,1\\right] $, and the second for $\\alpha \\in \\left( -\\infty ,1\\right] $. When $\\alpha \\rightarrow 0$, we recover the specific dissipation of the Lomnitz model, whereas when $\\alpha =1$, we recover that of the Maxwell model. Finally, we conclude that the asymptotic behavior of $Q_{\\alpha }^{-1}\\left( \\omega \\right) $ as $\\omega \\rightarrow +\\infty $ coincides with the specific dissipation of the Maxwell model. Keywords:", "url": "https://arxiv.org/abs/2609.05465", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Juan Luis Gonzalez-Santander"}, {"name": "Francesco Mainardi"}], "featured_authors": [{"name": "Juan Luis Gonzalez-Santander"}, {"name": "Francesco Mainardi"}], "author_count": 2}, {"id": "2609.05473", "category": "math-ph", "title": "Information Loss under Gauge Reduction of Discrete Electromagnetic Fields", "abstract": "We study relative entropy under gauge reduction in Whitney-discretized electromagnetism. The discrete Hodge decomposition separates exact gauge directions from harmonic and coexact physical degrees of freedom. For Gaussian distributions on the auxiliary potential space, relative entropy splits exactly into the relative entropy of the physical marginals and a nonnegative conditional gauge contribution. We express this contribution through Schur complements, conditional means, and physical--gauge correlations, and characterize equality between auxiliary and physical relative entropies. The physical divergence is also shown to be the minimum over all Gaussian auxiliary extensions. At the infinitesimal level, Fisher information admits an analogous decomposition. A two-variable model illustrates how statistically distinct auxiliary potentials may represent identical physical statistics. The construction provides an information-geometric interpretation of discrete gauge reduction without assigning physical significance to the eliminated gauge variables.", "url": "https://arxiv.org/abs/2609.05473", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jean-Pierre Magnot"}], "featured_authors": [{"name": "Jean-Pierre Magnot"}], "author_count": 1}, {"id": "2609.05622", "category": "math-ph", "title": "Distance Energies and Negative Type of Flat Tori", "abstract": "Let \\(T_\\Lambda=\\mathbb R^d/\\Lambda\\), \\(d\\geq2\\), be a flat torus with quotient metric \\(\\rho_\\Lambda\\), and consider the distance energies \\(I_\\alpha(\\mu)=\\iint \\rho_\\Lambda(x,y)^\\alpha\\,d\\mu(x)\\,d\\mu(y)\\) of Borel probability measures \\(\\mu\\). We prove a quantitative Fourier signature of the cut locus: for every Voronoi facet and every \\(\\alpha>0\\), there is a sequence of dual-lattice frequencies approaching the facet normal along which the Fourier coefficients of \\(\\rho_\\Lambda^\\alpha\\) are positive, with an explicit leading asymptotic determined by the facet. As direct consequences, Haar measure is not a local maximizer for any positive distance power, even among smooth densities, and every flat torus of dimension at least two has supremal negative type and generalized roundness zero. We then solve the global maximization problem for two classes of flat tori. On an orthogonal rectangular torus, the maximizers undergo a transition at \\(\\alpha=2\\): for \\(1\\leq\\alpha<2\\) they are the translated uniform measures on the two-torsion subgroup; at \\(\\alpha=2\\) all balanced couplings on translates of that subgroup are extremal; and for \\(\\alpha>2\\) only equally weighted diametral pairs remain. On the regular hexagonal torus, the maximizers are precisely the uniform measures on translates of a distinguished cyclic subgroup of order three for every \\(\\alpha\\geq1\\).", "url": "https://arxiv.org/abs/2609.05622", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ye Zhou"}], "featured_authors": [{"name": "Ye Zhou"}], "author_count": 1}, {"id": "2609.05872", "category": "math-ph", "title": "An Algebraic Proof of Gauge-Fixing Independence", "abstract": "This paper provides an algebraic proof of the gauge-fixing independence of perturbative asymptotic expansions in a finite-dimensional model of non-Abelian gauge theory. We develop an algebraic framework using the BRST formalism and perturbation theory. Our main theorem shows that under appropriate transversality conditions, normalized expectation values of observables remain unchanged under smooth deformations of the gauge-fixing conditions that preserve these assumptions.", "url": "https://arxiv.org/abs/2609.05872", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jiuhe Liu"}], "featured_authors": [{"name": "Jiuhe Liu"}], "author_count": 1}, {"id": "2609.06183", "category": "math-ph", "title": "Renormalization Group on Wiener Space: Spectral Theory and Universality", "abstract": "We develop a rigorous renormalization group (RG) formalism on Wiener space. We introduce an RG operator $\\mathcal R$ acting on probability measures over continuous paths, whose fixed point is the Wiener measure. We linearize $\\mathcal{R}$ around the Brownian fixed point and analyze the spectral structure of the resulting operator $\\mathscr{L}$. Its eigenvectors are too singular to be realized as honest measures on path space, and we therefore develop a generalized spectral theory within the framework of white noise analysis (Hida calculus). The eigenvectors of $\\mathscr{L}$ are realized as Hida distributions, satisfying $\\mathscr{L} U=\\lambda U$ in the weak sense. This analysis yields structural results such as a spectral gap and a diagonal-concentration property of the eigenvectors. Moreover, we identify a family $\\{\\mathfrak{U}_n\\}_{n \\geq 0}$ of eigenvectors with eigenvalues $\\lambda_n = 2^{1-n/2}$, consisting of Wick polynomials of white noise formally expressed as $\\mathfrak{U}_n = \\int_0^1 {:}\\dot W(t)^n{:}\\, dt$, and rigorously constructed as Hida distributions. We then use this spectral structure to uncover a finer, second layer of universality in the Donsker invariance principle: not only is the convergence of random walks towards the Brownian scaling limit universal, but the entire hierarchy of leading corrections to the Brownian limit is universal as well, governed by the eigenpairs $(\\lambda_n, \\mathfrak{U}_n)$. We also show, at a formal level, that the framework developed here extends to Gibbs-type perturbations of the Brownian fixed point, in the spirit of self-interacting quantum field theories. In particular, we recover the standard irrelevant/marginal/relevant classification, usually obtained in the physics literature by power-counting, solely from the spectral analysis of $\\mathscr{L}$.", "url": "https://arxiv.org/abs/2609.06183", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "André L. P. Considera"}, {"name": "Alexei A. Mailybaev"}], "featured_authors": [{"name": "André L. P. Considera"}, {"name": "Alexei A. Mailybaev"}], "author_count": 2}, {"id": "2609.06466", "category": "math-ph", "title": "Condensation and Collapse in the Mean-Field Limit of Rotating 2D Bose Gases with Two-Body and Three-Body Interactions", "abstract": "We consider a system of $N$ interacting bosons in a rotating harmonic trap in $\\mathbb{R}^2$, where the two-body interaction is attractive and scaled as $N^{2\\alpha}U(N^\\alpha x)$ with $0<\\alpha<1/12$, and the three-body interaction is repulsive and scaled as $N^{4\\beta}W(N^\\beta x,N^\\beta y)$ with $0<\\beta<1/24$. In the mean-field limit, the ground state energy is effectively described by a rotating cubic-quintic nonlinear Schrödinger functional. We analyze the collapse regime where the two-body coupling $a$ approaches the critical value $a_*$ and the three-body coupling $b$ tends to zero. The NLS ground states blow up with a universal profile given by the optimizer of the Gagliardo-Nirenberg inequality, and the energy satisfies $E^{\\mathrm{NLS}} = (1-\\zeta/4+o(1))\\mathcal{Q}{\\rm{pot}}\\ell_n^2$ with $\\zeta\\geqslant0$ determined by the relative rates of $a_n\\to a_*$ and $b_n\\searrow0$. From the many-body theory, we rigorously justify this effective description: the quantum ground state energy converges to the NLS energy with the same asymptotic expansion in the collapse regime, and the many-body ground states exhibit complete Bose-Einstein condensation onto the universal blow-up profile.", "url": "https://arxiv.org/abs/2609.06466", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Deke Li"}, {"name": "Yuan Li"}, {"name": "Qingxuan Wang"}], "featured_authors": [{"name": "Deke Li"}, {"name": "Yuan Li"}, {"name": "Qingxuan Wang"}], "author_count": 3}, {"id": "2609.06620", "category": "math-ph", "title": "Novel computational formulas and relations for special numbers and functions: approach to analysis of Debye functions", "abstract": "The first goal of this paper is to give a new family of special function related to the Debye functions. By using these function and generating function method, we derive many novel formulas and relations involving the Debye functions, multiple Hurwitz Lerch zeta function which interpolate the Apostol-Bernoulli numbers of higher order at negative integers. Proof method of theorems in this paper are different from those of theory of analytic numbers. The second goal of this paper is to show that special values and integral presentations of this function are closely related to unification of the Debye functions, the moment generating function for the negative binom distribution, the generating functions for the Apostol-type numbers of higher-order, and the Frobenius-Euler numbers, the Bernoulli numbers, and the Stirling numbers etc. Moreover, we give recurrence relations, Maclaurin's series expansion, and approximation formula for unification of the Debye functions. Finally, we give further remarks, observations and applications in mathematical physics on the results of this paper.", "url": "https://arxiv.org/abs/2609.06620", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yilmaz Simsek"}], "featured_authors": [{"name": "Yilmaz Simsek"}], "author_count": 1}, {"id": "2609.06932", "category": "math-ph", "title": "Commutative Factorization of Nonlinear Second-Order Differential Equations: Theory and Applications", "abstract": "This work presents a generalization of the commutative factorization framework for a broad class of second-order nonlinear ordinary differential equations. The main objective was to extend the commutative factorization procedure in order to use the Riccati-Bernoulli equation and the Bäcklund transformation. This provides a systematic route for constructing both particular and general solutions of the original second-order nonlinear equation. The theoretical development is illustrated through several nonlinear models of physical and mathematical interest, including equations arising in classical mechanics and nonlinear oscillatory systems. The results demonstrate that commutative factorization constitutes an effective analytical tool for solving nonlinear differential equations.", "url": "https://arxiv.org/abs/2609.06932", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gabriel Gonzalez"}], "featured_authors": [{"name": "Gabriel Gonzalez"}], "author_count": 1}, {"id": "2609.06987", "category": "math-ph", "title": "A Note on Extended States on the Bethe Lattice", "abstract": "We give a new proof of the existence of absolutely continuous spectrum for the weakly disordered Anderson model on the Bethe lattice. The argument follows a general cyclicity criterion for Anderson-type Hamiltonians and reduces the problem to showing that the spectral measures of two independent copies of the rooted tree are not mutually singular. This is detected by their Hellinger affinity, and the required weak-disorder estimate follows from a short harmonic and compactness argument. We also formulate an analogous quantitative cyclicity criterion for the Anderson model on $\\mathbb{Z}^d$, expressed through the Schur complement of the Poisson transform of a $2\\times2$ matrix spectral measure.", "url": "https://arxiv.org/abs/2609.06987", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vojkan Jaksic"}, {"name": "Yoram Last"}, {"name": "Simone Warzel"}], "featured_authors": [{"name": "Vojkan Jaksic"}, {"name": "Yoram Last"}, {"name": "Simone Warzel"}], "author_count": 3}, {"id": "2609.07277", "category": "math-ph", "title": "Renormalization group bounds on Araki relative entropy", "abstract": "This paper derives a multiscale Bakry-Émery criterion for an upper bound on the Araki relative entropy of perturbations of an equilibrium state in relativistic QFT. Using stochastic positivity, affiliated perturbations of the relativistic bosonic field can be put in correspondence with perturbations of the massive Euclidean free field. This gives a Feynman-Kac formula, which in turns is used to derive a probabilistic expression for the Araki relative entropy. The description of the massive Euclidean free field as an abstract Wiener space provides the infinite-dimensional framework to derive a Polchinski equation. Extending the methods of Bauerschmidt, Bodineau, and Dagallier to this context yields a probabilistic bound on the Araki relative entropy, which can be formulated entirely in operator-algebraic terms. Using the criterion, it is shown that the Lorentzian massive Sine-Gordon model in the ultraviolet finite regime satisfies the relative entropy bound.", "url": "https://arxiv.org/abs/2609.07277", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Edoardo D'Angelo"}], "featured_authors": [{"name": "Edoardo D'Angelo"}], "author_count": 1}, {"id": "2609.07308", "category": "math-ph", "title": "Big Crunch on Julia and Anti-Julia Sets in the Integrable Limit", "abstract": "The Julia set is defined by the closure of repelling periodic points in chaotic systems. Why does this structure not appear in integrable systems? In this paper, we address this question by demonstrating the existence of the closure of divergences of the periodic equations, which we designate as the \"anti-Julia set.\" We also call the sets before taking the closures the pre-Julia and pre-anti-Julia sets, respectively. We illustrate the transition mechanism by considering a complex map that interpolates between integrable and non-integrable dynamics, by introducing a real deformation parameter $a$. For $0<a\\le 1/2$, we show that the Julia set and the anti-Julia set coincide in the complex plane, although the pre-Julia and pre-anti-Julia sets remain completely disjoint. At the integrable limit $a\\to 0$, these two dual structures undergo a critical collision and subsequent annihilation, reminiscent of a cosmological Big Crunch. When $1/2<a<1$, on the other hand, the boundary of the pre-anti-Julia set includes the Julia set. We analytically characterize these phenomena, focusing in particular on the asymptotic behavior of the pre-anti-Julia set as it approaches the integrable limit, and provide numerical visualizations that elucidate the underlying mechanisms of this Big Crunch phenomenon.", "url": "https://arxiv.org/abs/2609.07308", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masatomi Iizawa"}, {"name": "Satoru Saito"}, {"name": "Yasuhito Narita"}, {"name": "Yasuyuki Maeda"}, {"name": "Hiromitsu Harada"}, {"name": "Akira Shudo"}], "featured_authors": [{"name": "Masatomi Iizawa"}, {"name": "Satoru Saito"}, {"name": "Yasuhito Narita"}, {"name": "Yasuyuki Maeda"}, {"name": "Hiromitsu Harada"}, {"name": "Akira Shudo"}], "author_count": 6}, {"id": "2609.07387", "category": "math-ph", "title": "Towards Heterogeneous Exascale CFD with a Single Fortran Code Base: OpenMP Target Acceleration of the High-Order Unstructured Solver UCNS3D", "abstract": "Heterogeneous exascale systems are reshaping computational fluid dynamics, yet rewriting mature high-order solvers for accelerators can fragment code bases and weaken reproducibility. We present a single-source OpenMP target modernisation of UCNS3D, a high-order unstructured finite-volume solver for compressible flows. The common CPU/GPU implementation preserves its numerical formulation, Fortran code base, and workflows. Rather than porting isolated kernels, we enable the complete explicit time-advancement path: high-order reconstruction, gradient evaluation, inviscid and viscous fluxes, boundary treatment, halo exchange, and solution update. The implementation uses persistent target data regions, flat run-time arrays, compile-time sizing of temporary storage, explicit local algebra, target-callable routines, and GPU-aware MPI with device-resident buffers. These choices address the irregular stencils, complex data structures, and substantial temporary storage of high-order unstructured CFD. Verification using the compressible Taylor-Green vortex shows CPU and GPU dissipation histories agreeing to machine precision on LUMI and with published reference data. A single-node run on the ARCHER2 GPU platform provides an independent portability check. End-to-end performance is evaluated on fully populated nodes using Taylor-Green vortex, LM1021 sonic-boom, and NASA high-lift CRM benchmarks. Relative to the previous production implementation, the refactored CPU path is 1.27-1.67 times faster, while GPU offload delivers same-node speed-ups of 2.71-4.05 and 84-101 percent strong-scaling efficiency. The results show that standards-based OpenMP provides portable, production-scale acceleration without sacrificing numerical fidelity, CPU performance, or software sustainability.", "url": "https://arxiv.org/abs/2609.07387", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Panagiotis Tsoutsanis"}, {"name": "Michal Uminski"}, {"name": "Christopher Day"}, {"name": "David Henty"}], "featured_authors": [{"name": "Panagiotis Tsoutsanis"}, {"name": "Michal Uminski"}, {"name": "Christopher Day"}, {"name": "David Henty"}], "author_count": 4}, {"id": "2609.07485", "category": "math-ph", "title": "Möbius Invariant Dimers and Miquel Dynamics", "abstract": "As is already known, there is a correspondence between circle patterns and the dimer model, which is invariant under Euclidean transformations. We establish a new correspondence that is invariant under the group of Möbius transformations PO(3,1), which is the natural symmetry group of circle patterns. We show that Miquel dynamics preserve the partition function, and that convexity of the t-embedding guarantees positivity of the face weights. We also show that the correspondence has a somewhat hidden symmetry group PO(3,3), which relates to the Lorentz lift of the t-embedding. Finally, we consider isoradial graphs, Doyle spirals, the once-punctured torus and isothermic circle patterns.", "url": "https://arxiv.org/abs/2609.07485", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Niklas C. Affolter"}, {"name": "Luis Mühlhoff"}], "featured_authors": [{"name": "Niklas C. Affolter"}, {"name": "Luis Mühlhoff"}], "author_count": 2}, {"id": "2609.07578", "category": "math-ph", "title": "Entropic repulsion to the middle layer", "abstract": "We consider $\\nabla\\varphi$ height functions with even and convex interaction energy $W$ on the lattice $\\mathbb{Z}^d$, which are restricted to take values in the set $\\{-S, \\ldots, S\\}$ for some integer $S \\ge 1$. We study the effect of entropic repulsion, which tends to push the spin values to the middle layer. We prove that the model has a unique Gibbs measure, with exponential decay of correlations, in the cases: (a) Dimension $d=2$ at all temperatures. (b) Dimensions $d\\ge3$ at all temperatures, for a wide class of $W$ with non-increasing second derivative, including the family $W(x)=|x|^p$ for $p\\in[1,2]$. (c) Dimensions $d\\ge 3$ at both low and high temperatures, $T\\in (0,\\frac{W(1)d}{4(\\ln d+\\ln 8)})\\cup(d W(2S),\\infty]$, with the normalization $W(0)=0$. At low temperatures, our proof provides an alternative to Pirogov--Sinai methods. Conversely, we exhibit a class of even and convex interaction energies $W$ which, in high dimensions and suitable temperature regimes, have multiple Gibbs measures. Though uniqueness may fail, we show that the magnetization of every Gibbs measure lies in $(-\\frac{1}{2},\\frac{1}{2})$. This implies the delocalization of the model restricted to take values in $\\{0,1,\\ldots\\}$ (i.e., conditioned to lie above a floor) for all dimensions, any even and convex $W$, and all temperatures. Our methods extend to additional setups: We prove that height functions taking values in the real interval $[-1,1]$ always have a unique Gibbs measure, a result previously proved only for the quadratic interaction. For height functions taking values in $\\{-S+\\frac{1}{2}, \\ldots, S-\\frac{1}{2}\\}$, $S \\ge1 $ integer, we prove that the magnetization of every Gibbs measure lies in $(-1,1)$. The special case $W(x)=x^2$ of our results addresses questions left open in the work of Bricmont--El Mellouki--Fröhlich (1986).", "url": "https://arxiv.org/abs/2609.07578", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Max Mihailescu"}, {"name": "Ron Peled"}], "featured_authors": [{"name": "Max Mihailescu"}, {"name": "Ron Peled"}], "author_count": 2}, {"id": "2609.07750", "category": "math-ph", "title": "Classification of Conformally Covariant 2-Tensors from the Kulkarni--Nomizu Product in Dimension 4", "abstract": "We classify all natural, conformally covariant, symmetric (0,2)-tensors of conformal weight -2 and differential order less than or equal to 4 in dimension 4, built from the metric, the Schouten tensor, covariant derivatives, and the Kulkarni-Nomizu product. We prove that the space of such tensors is exactly 2-dimensional, spanned by the Bach tensor (order 2) and the Eastwood-Singer tensor (order 4). The algebraic core is formally verified using Lean 4 with Mathlib. The 8x11 constraint matrix and divergence-free condition are verified computationally with exact rational arithmetic. Both English and Russian versions provided; Russian version available as ancillary.", "url": "https://arxiv.org/abs/2609.07750", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yury N. Berdinsky"}], "featured_authors": [{"name": "Yury N. Berdinsky"}], "author_count": 1}, {"id": "2609.07810", "category": "math-ph", "title": "Equation of Motion for Open Thermodynamic Systems and Its Dynamical Equivalence with Mechanical and Electrical Systems", "abstract": "Changes in the internal energy of a thermodynamic system are fundamentally described by the first law of thermodynamics. However, the first law has a highly compact form that does not explicitly reveal the dynamics of the system or provide a corresponding equation of motion. While equations of motion can be written explicitly for mechanical and electrical systems, an analogous dynamical formulation for thermodynamic systems has, to our knowledge, not been established directly from the first law. In this work, we show that, through dimensional reduction, the first law can be transformed from its compact thermodynamic form into an explicit equation of motion for an open thermodynamic system. Remarkably, the resulting equation reveals that the dynamics of the thermodynamic system is equivalent to that of a driven damped harmonic oscillator and a driven RLC electrical circuit. Detailed dimensional analyses of the derived equations and effective coefficients demonstrate the internal consistency of the resulting formulation. We further perform a systematic comparison of the mechanical, electrical, and thermodynamic systems and show that, despite their distinct physical origins, they share the same universal dynamical structure. Finally, we construct a Lagrangian formulation of the thermodynamic system and establish its correspondence with the Lagrangian descriptions of the mechanical and electrical systems. These results demonstrate that an explicit equation of motion can be generated directly from the first law of thermodynamics and reveal a common dynamical framework underlying thermodynamic, mechanical, and electrical systems.", "url": "https://arxiv.org/abs/2609.07810", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "E Aydiner"}], "featured_authors": [{"name": "E Aydiner"}], "author_count": 1}, {"id": "2609.08138", "category": "math-ph", "title": "Energy diffusion in a pinned harmonic chain with free boundary condition and interactions of increasing range", "abstract": "We consider a finite two-dimensional pinned harmonic chain with an interaction range that diverges with the system size and with conservative rotational noise. Under a joint scaling in which the interaction range diverges microscopically but vanishes macroscopically, we prove that the expected em- pirical energy measures converge to the unique measure-valued weak solution of the heat equation.", "url": "https://arxiv.org/abs/2609.08138", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yipeng Lu"}, {"name": "Wei Wang"}], "featured_authors": [{"name": "Yipeng Lu"}, {"name": "Wei Wang"}], "author_count": 2}, {"id": "2609.08257", "category": "math-ph", "title": "Asymptotics of Ground States for Helium-Like and Bosonic Atoms in a Two-Cluster Region", "abstract": "We study the asymptotic behavior of positive ground states of $N$-particle atomic Coulomb Hamiltonians in a two-cluster region. For the $N$-particle ground state $\\psi$, its one-particle density $\\rho$, and $(N-1)$-particle ground state $\\phi$, we show that for $0<\\alpha<1$, as $|x_N|\\to\\infty$, $\\psi(x_1,\\dots,x_N)/\\sqrt{\\rho(x_N)}= \\phi(x_1,\\dots,x_{N-1})+O(|x_N|^{-2+\\alpha} \\ln |x_N|)$ uniformly in the region $|x_i|\\le |x_N|^{\\alpha}$. In the region $|x_i|\\le R_0\\ln |x_N|$, the convergence rate is $O(|x_N|^{-2} (\\ln |x_N|)^2)$. We also establish an $O(|x_N|^{-2})$ bound on the squared $L^2$ error. These results hold both below the essential spectrum and at threshold.", "url": "https://arxiv.org/abs/2609.08257", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yukimi Goto"}], "featured_authors": [{"name": "Yukimi Goto"}], "author_count": 1}, {"id": "2609.08523", "category": "math-ph", "title": "Arithmetic triangular structures in the transfer-matrix of finite Kronig-Penney models", "abstract": "This work provides a complete analytical characterization of the transfer- matrix structure associated with the finite Kronig-Penney model consisting of one-dimensional arrays of Dirac delta potentials recently introduced by Figueroa et al. (2025). Although their study identified the emergence of specific transfer-matrix entries and related combinatorial coefficients, a rig- orous derivation of the corresponding closed-form expressions has not yet been established. By expressing the N th power of the unit-cell transfer ma- trix in terms of Chebyshev polynomials of the second kind, we obtain explicit closed-form representations for the global transmission and reflection ampli- tudes. The proposed formulation reveals a previously unrecognized structural correspondence between multiple quantum scattering processes, discrete con- volutional patterns, and hypercomplex combinatorial structures.", "url": "https://arxiv.org/abs/2609.08523", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lidia Aceto"}, {"name": "Pietro Antonio Grassi"}, {"name": "Helmuth Robert Malonek"}], "featured_authors": [{"name": "Lidia Aceto"}, {"name": "Pietro Antonio Grassi"}, {"name": "Helmuth Robert Malonek"}], "author_count": 3}, {"id": "2609.08525", "category": "math-ph", "title": "The phase coordinates transformation in Moyal noncommutative framework 2-dimensional harmonic oscillator and Painlevé second equation", "abstract": "This work aims to explore the physical application of Moyal noncom- mutative formalism with the the presentation of new transformations which connect the old canonical coordinates to purly noncommuting phase coordi- nates through the parameters describe the Moyal noncommutative deforma- tion. These transformations are consistent with the Moyal noncommunica- tive brackets and build sixteen components traceless anti-symmetric tensor. This formalism incorporates space-space and space-momentum noncommu- taivity rather then noncommutativity (Heisenberg quantum commutation ) only for the canonical coordinates. The transformations imply to construct noncommutative analogs of 2-dimensional harmonic oscillator with its superintegrability and Painlevé second equation. The associated deformed Hamiltonians additionally involve some extra symmetries and reveal a deep physical understanding of about the additional symmetries with noncommunicative structure. The Painlevé second noncommutative coordinates transformation are also efficiently applied to generate the first Yablonskii Vorobev polynomial with Painlevé second parameter transformation.", "url": "https://arxiv.org/abs/2609.08525", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Irfan Mahmood"}], "featured_authors": [{"name": "Irfan Mahmood"}], "author_count": 1}, {"id": "2609.08910", "category": "math-ph", "title": "On spatial decoherence in many-body systems", "abstract": "We study the dynamics of a many-body quantum system strongly interacting with a bosonic reservoir. The coupling is given by a potential operator for the system and it is linear in the field. We show that in the limit of infinite coupling strength the system undergoes instantaneous spatial decoherence. To resolve the decoherence process in time we consider large coupling strengths $\\lambda$ and short times scaling as $t\\propto \\lambda^{-\\alpha}$, with $\\alpha\\ge0$, in the limit $\\lambda\\rightarrow\\infty$. On short time scales $\\alpha>1$ the dynamics is trivial while on longer ones $0\\le\\alpha<1$ the decoherence is instantaneous. We show that the decoherence process is resolved exactly for $\\alpha=1$, defining the fine-grained time scale $\\tau=\\lambda t$. We construct an approximate effective evolution map of the many-body system with controlled error estimates. Generically, the effective dynamics is markovian, but not given by a dynamical semigroup. As a physical application we give a rigorous description of the phenomenon of localization of macroscopic quantum objects in position space.", "url": "https://arxiv.org/abs/2609.08910", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stefano Marcantoni"}, {"name": "Marco Merkli"}], "featured_authors": [{"name": "Stefano Marcantoni"}, {"name": "Marco Merkli"}], "author_count": 2}, {"id": "2609.08984", "category": "math-ph", "title": "The inverse problem of time-dependent density functional theory on the torus", "abstract": "We prove that, for any given sufficiently regular one-particle density, there exists a unique external potential for which the solution to the many-body Schrödinger equation has this prescribed density. This implies in particular that one can exactly reproduce the time-dependent density of an interacting system using non-interacting electrons, which is at the heart of time-dependent density functional theory. Our result covers the Coulomb interaction and densities arising from extended nuclei.", "url": "https://arxiv.org/abs/2609.08984", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Asbjørn Bækgaard Lauritsen"}, {"name": "Mathieu Lewin"}, {"name": "Jakob Oldenburg"}], "featured_authors": [{"name": "Asbjørn Bækgaard Lauritsen"}, {"name": "Mathieu Lewin"}, {"name": "Jakob Oldenburg"}], "author_count": 3}, {"id": "2609.05469", "category": "quant-ph", "title": "Lee-Yang zeros of modulated XY spin chains with Dzyaloshinskii-Moriya interaction: zero-contour topology and quantum phase-diagram reconstruction", "abstract": "We investigate the Lee--Yang zeros (LYZ) of inhomogeneous anisotropic XY spin chains with Dzyaloshinskii--Moriya (DM) interactions in the complex transverse-field plane, focusing on their fundamental connection to quantum phase transitions. We systematically study uniform chains, period-2 and period-3 modulated chains, and Fibonacci quasiperiodic chains of lengths 5 and 8. As the DM coupling strength $D$ increases, the LYZ exhibit qualitatively distinct topological evolutions on the complex plane: the complex zeros of the uniform chain collapse toward the real axis; periodic chains feature either bifurcation of closed zero contours before all zeros become real or a single re-emergence of complex zeros; quasiperiodic chains exhibit repeated annihilation and revival of complex zeros. Analytical derivations demonstrate that this diverse behavior originates from DM-induced shifts of folded bands and the modulation of zero positions by anisotropic pairing at particle--hole band crossings. Our results establish a direct correspondence between LYZ topology and band deformation: isolated contact points of zeros with the real axis correspond to discrete quantum critical fields, while continuous real-zero intervals directly identify gapless chiral phases. Accordingly, beyond locating phase boundaries, LYZ can distinguish characteristic phases and serve as an intuitive probe for band folding and phase diagram restructuring.", "url": "https://arxiv.org/abs/2609.05469", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hong Jiang"}, {"name": "Xiang-Ping Jiang"}, {"name": "Yan-Chao Li"}], "featured_authors": [{"name": "Hong Jiang"}, {"name": "Xiang-Ping Jiang"}, {"name": "Yan-Chao Li"}], "author_count": 3}, {"id": "2609.05471", "category": "quant-ph", "title": "Atmospheric Turbulence-Aware Optimization of Generalized Kennedy Receivers for Coherent-State BPSK Quantum Communication", "abstract": "We investigate generalized Kennedy receivers for coherent-state BPSK communication over turbulent free-space optical channels. An ergodic mutual-information framework is developed to jointly optimize the receiver displacement and input prior probabilities under Gamma--Gamma fading.", "url": "https://arxiv.org/abs/2609.05471", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Md Ashraf Hossain Ifty"}, {"name": "Rahul Bhadani"}], "featured_authors": [{"name": "Md Ashraf Hossain Ifty"}, {"name": "Rahul Bhadani"}], "author_count": 2}, {"id": "2609.05478", "category": "quant-ph", "title": "Can a Local Quantum-Mechanical Description of Physical Reality Be Considered Complete?", "abstract": "In a complete quantum theory, one would construct it based on what we can observe in a system and operationally define in our universe. This philosophy goes back to some of the original ideals of quantum theory defined by W. Heisenberg, N. Bohr, and others as part of the Copenhagen school of thought. We argue in this letter that that if one wishes to construct a complete quantum field theory, that it is most natural to construct it based on a nonlocal theory of observable principles. If this interpretation is valid, then the one-particle nonrelativistic limit that recovers quantum mechanics would as well be nonlocal. In this interpretation we derive the nonlocal Schrödinger equation. We will as well demonstrate that the canonical position--momentum commutator and the Heisenberg uncertainty principle emerge from translation covariance.", "url": "https://arxiv.org/abs/2609.05478", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "J. W. Moffat"}], "featured_authors": [{"name": "J. W. Moffat"}], "author_count": 1}, {"id": "2609.05598", "category": "quant-ph", "title": "Matrix Product Belief Propagation", "abstract": "We introduce \"matrix product belief propagation\" (MP-BP) as a controlled method for the approximate contraction of two-dimensional tensor networks and graphical models, which generically leads to a quadratic reduction of errors relative to existing methods: at similar computational effort, the number of accurate digits is asymptotically doubled. For infinite systems, MP-BP can be understood as a practical implementation of Baxter's corner-transfer-matrix method; for reflection-symmetric networks, it further coincides with the boundary matrix-product-state and corner-transfer-matrix renormalization group algorithms as conventionally implemented. In the limit of unit matrix-product rank, MP-BP is equivalent to belief propagation, and more generally, can be understood as a generalization of BP in which the \"messages\" live on surfaces and are assumed to have a matrix-product factorization. We further extend the quadratic improvement to the computation of expectation values, and numerically demonstrate the qualitatively improved convergence for a variety of classical and quantum 2D tensor network problems.", "url": "https://arxiv.org/abs/2609.05598", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gabriel Woolls"}, {"name": "Shahin Jahanbani"}, {"name": "Adarsh Pashikanti"}, {"name": "Matthew T. Fishman"}, {"name": "Joseph Tindall"}, {"name": "Michael P. Zaletel"}], "featured_authors": [{"name": "Gabriel Woolls"}, {"name": "Shahin Jahanbani"}, {"name": "Adarsh Pashikanti"}, {"name": "Matthew T. Fishman"}, {"name": "Joseph Tindall"}, {"name": "Michael P. Zaletel"}], "author_count": 6}, {"id": "2609.05644", "category": "quant-ph", "title": "$N$-dimensional discrete Fourier transform via bosonic Hamiltonian", "abstract": "The discrete Fourier transform (DFT) underpins many classical algorithms and is a fundamental unitary operator for quantum information processing. Implementing the $N$-dimensional DFT in photonic integrated circuits (PICs) is limited by the cascades of Mach-Zehnder interferometers that current architectures require. Here we propose bosonic Hamiltonians that realize the $N$-dimensional DFT through a single stage of multimode evolution, complemented only by phase shifters before and after the interaction region, in a geometry suited to 3D waveguides. Modeling the system as a graph, where edges correspond to couplings and the vertices are the waveguides, we obtain analytical solutions for complete graphs up to $N=6$ and numerical solutions up to $N=31$. For non-complete graphs, different propagation constants are required in the Hamiltonian. We report all solutions for $N\\leq 8$, partial exploration for $N=9$, and selected cases for $N=10$, together with three conjectures that guide the numerical search for $N \\geq 11$. These configurations circumvent the vanishing evanescent coupling strength imposed by the waveguide separation, and a closed-form sensitivity criterion selects those that are admissible as a waveguide layout and least sensitive to fabrication error. We also uncover the missing non-affine parameters of the $6$-dimensional DFT, and show that the scaling law for implementing the $N$-dimensional DFT with our building blocks is $\\mathcal{O}(N\\log\\log{N})$. This allows assembling the $2520$-dimensional DFT with only $2625$ interferometers, in contrast to the $\\approx 3\\times 10^6$ of Reck and Clements architectures.", "url": "https://arxiv.org/abs/2609.05644", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Edgar Barriga"}, {"name": "Camila Muñoz"}, {"name": "Alejandro Muñoz"}, {"name": "Santiago Rojas-Rojas"}, {"name": "Pablo Solano"}, {"name": "Carla Hermann-Avigliano"}, {"name": "Aldo Delgado"}], "featured_authors": [{"name": "Edgar Barriga"}, {"name": "Camila Muñoz"}, {"name": "Alejandro Muñoz"}, {"name": "Pablo Solano"}, {"name": "Carla Hermann-Avigliano"}, {"name": "Aldo Delgado"}], "author_count": 7}, {"id": "2609.05645", "category": "quant-ph", "title": "Ordered-Angle Coding for Exact Multiuser Unanimity Testing", "abstract": "We introduce ordered-angle coding for binary-unanimity testing among $n$ transformation-only users in a serial quantum architecture inherited from Loop-Back communication. User $B_i$ fixes one private sign across a logical word and applies $R(s_i\\alpha_j)$ in trial $j$. If $w$ users choose the negative sign, serial composition gives $R[(n-2w)\\alpha_j]$. We show that every fixed same-axis pulse that is deterministic for both unanimous inputs under the binary Bell readout has $\\alpha_j=q_j\\pi/(2n)$ with integer $q_j$. For a nonadaptive word $\\mathbf q=(q_1,\\ldots,q_m)$, a mixed Hamming weight imitates the unanimous signature with probability \\[ M_{\\mathbf q}(w)=\\prod_{j=1}^{m}\\cos^2\\!\\left(\\frac{\\pi q_jw}{n}\\right). \\] Within this complete deterministic-unanimity pulse family, a finite perfect word exists if and only if $n$ is a power of two. For $n=2^r$, the dyadic word $(1,2,4,\\ldots,2^{r-1})$ is exact and pulse-minimal with $m_{\\min}=r=\\log_2n$ trials. It replaces the $O(n^2\\log(1/\\varepsilon))$ worst-case burden of repeated smallest-angle tests by exact $O(\\log n)$ verification. Odd primes instead admit balanced statistical words with uniform mixed-weight imitation $2^{-(p-1)}$. For actual operations $R(s_i\\alpha_j+\\delta_{ij})$, an ideal rejecting position is lifted to $\\sin^2\\Delta_j$, where $\\Delta_j=\\sum_i\\delta_{ij}$. This yields explicit robustness bounds with angular and binary-readout errors. Bell entanglement is not required for the additive algebra, but it keeps the traveler locally maximally mixed in every honest trial. We therefore present the result as a coded multiuser relation primitive with optional raw conference-key-candidate use, not as a composably secure conference-key protocol.", "url": "https://arxiv.org/abs/2609.05645", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Luis Adrián Lizama-Pérez"}], "featured_authors": [{"name": "Luis Adrián Lizama-Pérez"}], "author_count": 1}, {"id": "2609.05657", "category": "quant-ph", "title": "Minimum Cardinalities of Multipartite Unextendible Product Bases", "abstract": "In quantum information theory, the state space of a multipartite quantum system is modeled by a tensor product. In the tensor-product space $\\mathbb C^{d_1}\\otimes\\cdots\\otimes\\mathbb C^{d_p}$, a nonzero vector is a \\emph{product state} if it can be written as $\\lvert \\varphi_1\\rangle\\otimes\\cdots\\otimes\\lvert \\varphi_p\\rangle$ with $\\lvert \\varphi_j\\rangle\\in\\mathbb C^{d_j}\\setminus\\{0\\}$. An \\emph{unextendible product basis} (UPB) is a finite family of pairwise orthogonal product states such that no nonzero product state is orthogonal to all of them. UPBs play a key role in investigating quantum entanglement and nonlocal phenomena. Finding a smallest UPB is a natural extremal problem: it asks how few pairwise orthogonal product states suffice to prevent any further product state from being added. The general minimum-size problem for UPBs has been studied for over two decades since the seminal work of Alon and Lovász. For local dimensions $d_1,\\ldots,d_p\\ge2$, let $f_m(d_1,\\ldots,d_p)$ be the minimum cardinality of a UPB and let $f_{LB}(d_1,\\ldots,d_p)=1+\\sum_{j=1}^{p}(d_j-1)$ be the natural lower bound. Alon and Lovász determined exactly when $f_m$ attains the lower bound $f_{LB}$, but the obstructed multipartite cases remained open in general. We prove a stabilization theorem: for every non-all-qubit system with $p\\ge3$, whenever parity prevents the natural lower bound $f_{LB}$ from being attained, the true minimum is exactly $f_{LB}+1$. Equivalently, if the number of even local dimensions is positive and even, and at least one local dimension is greater than two, then $f_m(d_1,\\ldots,d_p)=f_{LB}(d_1,\\ldots,d_p)+1$. The proof is built on a unified graph-theoretic framework. Our result, together with earlier work, settles the minimum-cardinality problem for UPBs in all finite quantum systems.", "url": "https://arxiv.org/abs/2609.05657", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chenhao Wang"}], "featured_authors": [{"name": "Chenhao Wang"}], "author_count": 1}, {"id": "2609.05679", "category": "quant-ph", "title": "Quantum lower bounds for convex optimization and real matrix-vector query problems", "abstract": "We (the author and the AI systems that did the heavy lifting) show that the quantum query complexity of minimizing a convex function over a convex subset of $\\mathbb{R}^n$ with evaluation and membership queries is $\\tilde\\Omega(n)$, nearly matching the best known upper bound. In particular, we show this even for quadratic minimization, which is equivalent to inverting an $n \\times n$ real matrix using matrix-vector queries. We also show linear or nearly linear lower bounds on the quantum query complexity of computing the trace, the sign of the determinant, and the magnitude of the determinant of a real matrix in the matrix-vector query model. We use a novel quantum lower bound technique, the determinantal witness method, based on identifying a witness whose Fourier transform vanishes on low-rank matrices and that correlates well with the function being computed.", "url": "https://arxiv.org/abs/2609.05679", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrew M. Childs"}], "featured_authors": [{"name": "Andrew M. Childs"}], "author_count": 1}, {"id": "2609.05702", "category": "quant-ph", "title": "Characterizing Privacy Risks of Quantum Machine Learning with Emergent Quantum-Native Access", "abstract": "Quantum Machine Learning (QML) has shown rapid advances by utilizing quantum computing for machine learning tasks. Meanwhile, the privacy risks accompanying QML is also starting to be studied, which inherit privacy leakage channels from \"classical\" ML and also quantum-unique risks. Existing work on privacy-preserving QML largely focuses on a QML-as-a-service scenario, which generally assumes that the QML model owner provides only classical bit outputs to queries, while users (and adversaries) have only classical computing abilities. However, this view is increasingly challenged in a quantum-native world of quantum-capable users/adversaries, which may have access to both quantum computing abilities and access to quantum information output from service providers. In this paper, we aim to bridge this gap by examining membership inference attacks against QML models by demonstrating that increasing quantum access and quantum computing abilities provides provable theoretical privacy leakage and empirical adversarial gain. However, the probabilistic nature of QML introduces a gap between theoretical and empirical adversarial advantage. These results show that existing research on privacy leakage on QML models underestimate privacy leakage in an emergent quantum-native access regimes, which we hope to establish a first step into examining potential privacy leakages for QML in the quantum-native this http URL results show that existing research on privacy leakage in QML models underestimates privacy leakage in emergent quantum-native access regimes, and we hope to establish a first step in examining potential privacy leakages for QML in the quantum-native world.", "url": "https://arxiv.org/abs/2609.05702", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Liou Tang"}, {"name": "James Joshi"}, {"name": "Ashish Kundu"}], "featured_authors": [{"name": "Liou Tang"}, {"name": "James Joshi"}, {"name": "Ashish Kundu"}], "author_count": 3}, {"id": "2609.05812", "category": "quant-ph", "title": "Quantum Query Algorithms for the Constructive Diagonal Ramsey Theorem", "abstract": "The constructive diagonal Ramsey problem asks, given adjacency-oracle access to an $N$-vertex graph, for a clique or independent set of the order guaranteed by Ramsey's theorem. We give a bounded-error quantum algorithm that, for every $K\\ge2$ and $N\\ge4^{K-1}$, finds and verifies a homogeneous $K$-set using $O\\!\\left(2^K K\\log\\frac K\\eta\\right)$ edge queries with failure probability at most $\\eta$. At the Ramsey scale $N=2^n$, this yields a homogeneous set of order $\\lfloor n/2\\rfloor+1$ using $O(\\sqrt N\\log N\\log(\\log N/\\eta))$ queries, improving on the $O(N)$ queries of the explicit classical recursion and giving, to our knowledge, the first sublinear worst-case algorithm for the Ramsey relation. We also derive an $\\Omega(N^{1/12})$ quantum lower bound by a reduction from collision finding. The algorithm runs the constructive recursion over implicit candidate sets. Each set is represented by a short conjunction of adjacency constraints and sampled using capped unknown-solution quantum search, and a scale-aware concentration schedule balances estimation accuracy against the increasing cost of sampling deeper sets. We complement the upper bound with an $\\Omega(N^{1-1/\\sqrt2})$ randomized lower bound, transported from the random-Painter analysis of online Ramsey numbers, which holds on the uniform distribution $G(N,1/2)$. On that distribution a greedy quantum search uses only $\\widetilde O(N^{1/4})$ queries, giving a provable polynomial quantum speedup for Ramsey search on random graphs. We also give an estimation-free size-biased recursion and extend it to every fixed number of edge colours.", "url": "https://arxiv.org/abs/2609.05812", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Cheng Xin"}], "featured_authors": [{"name": "Cheng Xin"}], "author_count": 1}, {"id": "2609.05813", "category": "quant-ph", "title": "Quantum Query Complexity of Persistence Statistics in Graph Zigzags", "abstract": "We study the query complexity of estimating scalar summaries of zigzag bar lifetimes from snapshot-adjacency bits. For graphs $G_1,\\ldots,G_m$ on $n$ labeled vertices, let $\\ell_b$ be the snapshot lifetime of a degree-one bar $b$ of the intersection zigzag. For a probability generating function $\\phi(x)=\\mathbb{E}[x^R]$, the statistic $F_\\phi=\\sum_b\\phi(\\ell_b/m)$ includes normalized degree-$r$ total persistence and the mean generalized rank over a uniform time window. An exact identity underlies our algorithm: sample $R$ uniform times; the expected generalized rank between their minimum and maximum equals $F_\\phi$. For graphs that rank is the circuit rank of an intersection graph, so a nonlinear barcode functional becomes an average of edge and component counts, and no barcode is computed. Without spectral-gap, homology-state, or QRAM assumptions, this gives a quantum estimator with additive error $\\varepsilon n$ and $\\widetilde O(\\sqrt{m(K+n)}/\\varepsilon)$ queries when a bound $K\\ge F_\\phi$ is supplied, against $\\widetilde O(m\\min\\{n^2,(K+n)/\\varepsilon^2\\})$ classically, and an adaptive quantum variant with the same instance dependence. These estimators are optimal in two regimes. For every fixed power weight $x^r$, $r\\ge2$, and for the uniform-window mean, the worst-case complexities are $\\widetilde\\Theta(n\\sqrt m/\\varepsilon)$ quantum and $\\Theta(n^2m)$ classical. On sparse instances, under an explicit split-leakage promise met by power and binomial weights of logarithmic degree and the promise $F_\\phi\\le K$, they are $\\widetilde\\Theta(\\sqrt{mK}/\\varepsilon)$ and $\\widetilde\\Theta(m\\min\\{n^2,K/\\varepsilon^2\\})$. The classical lower bounds hold against fully adaptive algorithms, and fewer than $m$ such statistics cannot determine the positive-lifetime histogram. All bounds concern snapshot access; with an explicit update stream, near-linear full-barcode algorithms are known.", "url": "https://arxiv.org/abs/2609.05813", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Cheng Xin"}], "featured_authors": [{"name": "Cheng Xin"}], "author_count": 1}, {"id": "2609.05814", "category": "quant-ph", "title": "Towards Continuous Profiling and Optimization of Quantum-Classical Pipelines", "abstract": "Quantum applications increasingly execute as multi-stage quantum-classical pipelines, interleaving QPU computation with classical stages like circuit generation, transpilation, layout mapping, quantum error mitigation (QEM), and post-processing. These stages have diverse resource requirements and exhibit stochastic behavior under drifting hardware noises, yet existing workflow frameworks treat them as static, isolated components. We present LLQM (Low-Level Quantum Machine), a profiling-driven meta-framework for quantum-classical pipelines. LLQM decomposes pipelines into fine-grained tasks and continuously profiles their CPU/GPU, memory, QPU, and queue dependencies alongside real-time hardware states. This unified runtime abstraction captures cross-stage resource dependencies and reveals how classical and quantum decisions interact, enabling characterization of their impact on fidelity and resource consumption. We evaluate LLQM using QEM as a representative pipeline stage, on IBM 156-qubit Heron r2 processors with circuits up to 100 qubits and 1e7 transpiled gates. Our results show that continuous profiling exposes runtime bottlenecks and enables hardware-, fidelity-, and workload-aware optimizations.", "url": "https://arxiv.org/abs/2609.05814", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ayush Bansal"}, {"name": "Owen Cochell"}, {"name": "Santiago Núñez-Corrales"}, {"name": "Marcos Frenkel"}, {"name": "Seetharami Seelam"}, {"name": "Apoorve Mohan"}, {"name": "Tianyin Xu"}], "featured_authors": [{"name": "Ayush Bansal"}, {"name": "Owen Cochell"}, {"name": "Santiago Núñez-Corrales"}, {"name": "Seetharami Seelam"}, {"name": "Apoorve Mohan"}, {"name": "Tianyin Xu"}], "author_count": 7}, {"id": "2609.05828", "category": "quant-ph", "title": "On the sample complexity of the generalized hidden shift problem over arbitrary finite groups", "abstract": "We formulate the generalized hidden shift problem over arbitrary finite groups and obtain upper and lower bounds for the sample complexity in terms of group theoretic data.", "url": "https://arxiv.org/abs/2609.05828", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Juntai Zhou"}], "featured_authors": [{"name": "Juntai Zhou"}], "author_count": 1}, {"id": "2609.05857", "category": "quant-ph", "title": "Quantum Message Passing Convergence and Vanishing Block-Error Probability for Random LDPC Codes", "abstract": "Belief propagation with quantum messages (BPQM) is a quantum algorithm that decodes classical codes transmitted over classical--quantum channels. It realizes optimal decoding on tree factor graphs over pure-state classical-quantum channels. However, this tree-based analysis does not ensure vanishing block-error probability for LDPC Tanner graphs with cycles. In this work, we construct a two-stage BPQM decoder for random $q$-ary LDPC codes over symmetric $q$-ary pure-state channels, where $q$ is prime, and prove that its ensemble-average block-error probability vanishes as the blocklength $N$ tends to infinity. For regular ensembles with $d_v\\geq3$, fidelity bounds yield double-exponential decay of the average symbol-error probability throughout the BPQM success region. We apply depth-$\\ell$ BPQM to coordinates with tree neighbourhoods and treat the remaining coordinates as erasures. With a suitable $\\ell=\\Theta(\\log\\log N)$, a noncommutative union bound controls the BPQM decoding errors, while the minimum-distance property guarantees erasure recovery. We also extend the analysis to finite-support irregular ensembles. These results are relevant to quantum algorithms based on Regev's reduction, where coherent decoding uncomputes a codeword register. Decoded quantum interferometry (DQI) uses a closely related Fourier-based framework that reduces sparse max-LINSAT optimization problems to LDPC decoding problems on pure-state channels. Our results justify the use of BPQM in the decoding step of DQI and of coding-theoretic algorithms based on Regev's reduction whenever the code is drawn from one of the random LDPC ensembles analyzed here and the induced memoryless symmetric pure-state channel lies in the BPQM success region.", "url": "https://arxiv.org/abs/2609.05857", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Avijit Mandal"}, {"name": "Christophe Piveteau"}, {"name": "Joseph M. Renes"}, {"name": "Henry D. Pfister"}], "featured_authors": [{"name": "Avijit Mandal"}, {"name": "Christophe Piveteau"}, {"name": "Joseph M. Renes"}, {"name": "Henry D. Pfister"}], "author_count": 4}, {"id": "2609.05866", "category": "quant-ph", "title": "Demailly's Conjecture in Quantum Language and Its Solution", "abstract": "We give an exact translation between fat-point interpolation in complex projective space and a dark-state problem for fixed-particle-number bosons. Under the unitary Fischer--Bargmann realization, homogeneous degree becomes particle number, the Veronese lift becomes a bosonic symmetric product state, and order-$m$ vanishing becomes orthogonality to all coherent jet excitations of orders below $m$. The initial degree of a symbolic power is therefore the first particle number admitting a dark state of a positive constraint Hamiltonian, and the Waldschmidt constant is the asymptotic particle cost per suppression order. After developing both sides of this dictionary from first principles, we prove a finite-scale no-dark-state amplification theorem. Frobenius amplifies the associated full-rank certificate in one good positive-characteristic fiber; a nonzero maximal minor returns it to characteristic zero. Its asymptotic consequence is Demailly's conjectured inequality. The paper is written so that the projective statement, the quantum reformulation, and the arithmetic part of the solution can be read independently and then identified exactly.", "url": "https://arxiv.org/abs/2609.05866", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Trung Hoa Dinh"}], "featured_authors": [{"name": "Trung Hoa Dinh"}], "author_count": 1}, {"id": "2609.05904", "category": "quant-ph", "title": "Boundary-Cancelled Score-Hamiltonian Sampling", "abstract": "Diffusion sampling can be viewed as imaginary-time annealing of probability densities. From a forward/backward Euclidean Schrödinger pair, we show that fixing the noising drift forces the reverse score term, and that the same logarithmic force is the one-sided imaginary-time counterdiabatic connection of a supersymmetric Score Hamiltonian. The correspondence turns score-learning error into a Hamiltonian perturbation and yields a schedule principle: if the first $r$ terminal derivatives vanish, Morita--Nishimori boundary cancellation suppresses the residual Hellinger error from $T^{-2}$ to $T^{-2r-2}$ until score or sampling floors are reached. Reverse-SDE benchmarks, including two-dimensional learned-score tests, confirm the predicted improvement.", "url": "https://arxiv.org/abs/2609.05904", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Masayuki Ohzeki"}], "author_count": 1}, {"id": "2609.06054", "category": "quant-ph", "title": "Propagating sparsely supported states with time-dependent neural quantum states", "abstract": "Neural quantum states (NQSs) have emerged as a powerful ansatz for quantum dynamics. Their high entanglement capacity promises to overcome the entanglement barrier. However, existing time-dependent NQS methods are ill-equipped to propagate sparsely supported initial states due to the inherent mismatch between the supports of such states and their time derivatives. To address this issue, we introduce the interpolation sampling method as a novel form of importance sampling, where samples are drawn from a distribution that interpolates between the wave function and its time derivative. Combined with a global-in-time variational principle, we demonstrate with the example of the two-dimensional transverse-field Ising model that interpolation sampling allows for accurate propagation of extremely peaked states that standard wave function sampling could not tackle. We further improve sampling efficiency by introducing (i) a configuration-time joint sampling scheme where spin configurations and time are both treated as random variables, and (ii) a hybrid strategy for sample proposal that incorporates the knowledge of a Krylov subspace. Our work extends the scope of time-dependent NQS methods to a wider range of physically relevant scenarios, while challenging the prevailing reliance on the Born distribution and its close variants as the default basis for sampling.", "url": "https://arxiv.org/abs/2609.06054", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lexin Ding"}, {"name": "Markus Reiher"}], "featured_authors": [{"name": "Lexin Ding"}, {"name": "Markus Reiher"}], "author_count": 2}, {"id": "2609.06104", "category": "quant-ph", "title": "Battery Locality Is Necessary in Noncommuting Quantum Charging Bounds", "abstract": "Bounds on the charging power of quantum batteries in direct charging protocols are often interpreted as charging-side constraints. Although the locality of the charging Hamiltonian is known to restrict attainable power in certain protocols, whether battery locality is itself operationally necessary has remained unresolved. Here we show that it is necessary for spin batteries whose interactions do not pairwise commute. We construct commuting and noncommuting high-locality batteries with identical interaction supports and local energy scale, driven by the same charging. The commuting battery saturates the battery-locality-independent bound, whereas the noncommuting battery exceeds it by a parametrically growing factor, demonstrating that this bound cannot apply generally. The enhanced norm of the commutator is dynamically attained from a suitable joint state supported entirely in the battery ground-energy sector, although this state may be correlated with the auxiliary fermionic degrees of freedom. Our results establish battery locality as an operational resource enabled by noncommuting battery interactions.", "url": "https://arxiv.org/abs/2609.06104", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sheryl Mathew"}], "featured_authors": [{"name": "Sheryl Mathew"}], "author_count": 1}, {"id": "2609.06177", "category": "quant-ph", "title": "Quantifying Nonstabilizerness of Quantum Codes by Removing the Inert Background", "abstract": "Nonstabilizerness (magic) is the quantum resource that, together with stabilizer operations, makes universal quantum computation possible. It appears in fault-tolerant codes and topological order. However, quantifying nonstabilizerness is difficult. The standard measure sums over exponentially many Pauli operators, and for quantum codes no quantitative theory has been available. We resolve this by a structural observation: the Clifford sector carries no magic and can be removed by a Clifford transformation, leaving an order-three object whose magic is an exactly evaluable fourth moment. Removing this inert background yields closed forms for several code families: a formula for all Dicke states, reducing a 100-qubit case from $4^{100}$ terms to a short binomial sum; a bound for cubic-phase codes (twisted quantum doubles and non-Abelian topological order), saturated only by the $D_4$ code; and a cyclic/zero criterion for group multiplication states. Together these results reduce the computation of nonstabilizerness for a broad class of codes to finite classical counting problems, and identify the maximally magical codes among them.", "url": "https://arxiv.org/abs/2609.06177", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuan Liu"}, {"name": "Ke-Mi Xu"}], "featured_authors": [{"name": "Yuan Liu"}, {"name": "Ke-Mi Xu"}], "author_count": 2}, {"id": "2609.06179", "category": "quant-ph", "title": "Quantum lattice Boltzmann method via density-matrix encoding for fluid simulation with wall boundary conditions", "abstract": "The quantum lattice Boltzmann method (QLBM) holds promise for efficient fluid simulations, yet the treatment of realistic boundary conditions, particularly solid wall boundary with arbitrary geometry, remains a critical open challenge. We propose a QLBM algorithm that incorporates wall boundaries as well as inlet/outlet velocity conditions. Building upon the existing QLBM with ensemble transformations, we adopt a density-matrix encoding that offers greater flexibility in circuit design and enables the implementation of non-unitary operations through Kraus operators. For boundary enforcement, we design a quantum implementation of the half-way bounce-back scheme and introduce a component exchange step prior to the streaming step, which naturally enforces the no-slip condition without modifying the transport operation. Inlet and outlet conditions are imposed via controlled SWAP operations combined with ancilla registers prepared in the prescribed velocity states. Our QLBM is quantitatively validated through simulations of two-dimensional flows past a backward-facing step, a cylinder, and an obstacle with complex geometry, demonstrating both accuracy and extensibility of our boundary algorithm.", "url": "https://arxiv.org/abs/2609.06179", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hao Su"}, {"name": "Boyuan Wang"}, {"name": "Yue Yang"}], "featured_authors": [{"name": "Hao Su"}, {"name": "Boyuan Wang"}, {"name": "Yue Yang"}], "author_count": 3}, {"id": "2609.06285", "category": "quant-ph", "title": "Efficient Quantum Circuits for Electronic Hamiltonian Simulation without Pauli Expansion", "abstract": "Electronic Hamiltonian simulation is commonly formulated by mapping fermionic operators to qubit operators and subsequently expanding the resulting ladder-operator products into Pauli strings. While general, this procedure obscures the higher-level fermionic structure and can hide opportunities for circuit optimization. Building on ladder-string-pair (Lasp) diagonalization originally developed for Hamiltonian simulation of partial differential equations, we construct time-evolution circuits for the second-quantized electronic Hamiltonian without performing a Pauli expansion. For the most general case of complex-valued coefficients, we present a time-evolution circuit for a two-body fermionic Lasp operator that corresponds to 16 Pauli strings in the Pauli-expansion approach but does not suffer from Trotter error at this stage. Expanding the optimization scope from a single operator to a triad of three fermionic Lasp operators sharing the same four spin-orbital indices enables systematic cancellation of CX gates, reducing the CX-gate count from 36 to 12 in the example considered, still without introducing Trotter error at this stage. For $n$ spin orbitals, further expanding the optimization scope to a sequence of $O(n)$ suitably ordered triads enables a cascade of CX-gate reductions across triad boundaries, reducing the CX-gate count from $O(n^2)$ to $O(n)$. The Lasp-based approach also naturally accommodates controlled time evolution and yields further optimizations for real-valued Hamiltonians. These results demonstrate that the Lasp-based approach enables more efficient time-evolution circuits by preserving high-level circuit structures and thereby expanding the scope of optimization, providing a systematic route toward more efficient electronic Hamiltonian simulation.", "url": "https://arxiv.org/abs/2609.06285", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tamiya Onodera"}, {"name": "Takeshi Sato"}], "featured_authors": [{"name": "Tamiya Onodera"}, {"name": "Takeshi Sato"}], "author_count": 2}, {"id": "2609.06307", "category": "quant-ph", "title": "Hierarchical Fourier Approximation for Variational Quantum Distribution Learning", "abstract": "We study variational quantum distribution learning through a hierarchy of Walsh--Fourier approximations on the Boolean cube. At each level, a selected set of target Fourier coefficients defines a spectral truncation, which is projected onto the probability simplex and used as the target of a quantum circuit Born machine. Parameters learned at one level initialize the next through a warm-start map. We prove an end-to-end expected learning guarantee where the approximation term is determined by the omitted Fourier mass, while a normalized unbiased estimator yields an explicit statistical bound for empirical truncations. We then instantiate the abstract discrepancy conditions for total variation distance and relate the resulting distributional error to quantum-state fidelity. The total-variation specialization incurs the explicit factor $2^{n-1}$ under our normalized $\\ell_2$ convention and is therefore informative only for sufficiently concentrated Fourier tails. The framework does not establish global trainability or eliminate barren plateaus; rather, it identifies the conditions under which low-to-high spectral training admits a approximation--estimation--optimization analysis.", "url": "https://arxiv.org/abs/2609.06307", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Taha Hoseinpour Asli"}, {"name": "Sajjad Hashemian"}, {"name": "Ebrahim Ardeshir-Larijani"}], "featured_authors": [{"name": "Taha Hoseinpour Asli"}, {"name": "Sajjad Hashemian"}, {"name": "Ebrahim Ardeshir-Larijani"}], "author_count": 3}, {"id": "2609.06357", "category": "quant-ph", "title": "Quantum Homotopy Perturbation Method to Solve Nonlinear Partial Differential Equations", "abstract": "Solving nonlinear partial differential equations (PDEs) is important in various scientific and engineering applications. Recently, quantum computing was introduced as an alternative computational paradigm for solving nonlinear PDEs. In this paper, a new method called the quantum homotopy perturbation method (QHPM) is proposed to improve the scalability of solving nonlinear PDEs through two aspects. First, the dimension of the Hilbert space remains the same after the
