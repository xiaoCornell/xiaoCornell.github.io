和停留时间的乘积）导致横向空间移位。将这种机制应用于没有自旋轨道耦合的交流磁体，我们表明轨道扭矩在自旋中是奇数。因此，两个自旋通道偏转到入射平面的相对侧，从而在交变磁体中产生固有的空间自旋分离。该偏移还继承了交变自旋分裂的角对称性，并且在全反射开始附近强烈增强。因此，我们的工作揭示了一种新的横向位移机制，预测了交变磁体中的新型自旋分离效应，并提供了对交变磁序的直接探测。", "authors": [{"name": "Runze Li"}, {"name": "Yugui Yao"}, {"name": "Zhi-Ming Yu"}], "featured_authors": [{"name": "Runze Li"}, {"name": "Yugui Yao"}, {"name": "Zhi-Ming Yu"}], "author_count": 3}, {"id": "2611.34780", "category": "cond-mat", "title": "Emergent Chern metal in strongly correlated moiré bilayers", "abstract": "We investigate the topological properties of a strongly correlated moiré transition metal dichalcogenide (TMD) bilayer (such as twisted $\\mathrm{MoTe}_2$ or $\\mathrm{WSe}_2$) hosting a spin-charge separated state coupled to a layer-polarized helical spin texture. Analyzing an effective low-energy Hamiltonian for mobile spinless holons moving through this non-coplanar spinon background, we reveal pronounced asymmetric band warping. This warping closes the global indirect band gap across most of the parameter space, restricting true topological insulators to fine-tuned critical trajectories. However, a finite local direct gap persists, stabilizing broad regions of a topological Chern metal ($C = \\pm 1$). Computing the Chern number and density of states, we demonstrate that this phase naturally yields a sizable, non-quantized anomalous Hall response accompanied by finite longitudinal conduction, providing a purely electronic strong-coupling mechanism for dissipative anomalous Hall states in moiré systems.", "url": "https://arxiv.org/abs/2611.34780", "type": "理论", "summary": "我们研究了强相关莫尔过渡金属二硫化物（TMD）双层（例如扭曲的 $\\mathrm{MoTe}_2$ 或 $\\mathrm{WSe}_2$）的拓扑特性，该双层具有与层偏振螺旋自旋纹理耦合的自旋电荷分离态。通过分析移动无自旋完整子穿过非共面自旋背景的有效低能哈密顿量，我们揭示了明显的不对称能带扭曲。这种扭曲关闭了大部分参数空间的全局间接带隙，将真正的拓扑绝缘体限制在微调的临界轨迹上。然而，有限的局部直接间隙仍然存在，稳定了拓扑陈金属的广泛区域（$C = \\pm 1$）。通过计算陈省身数和态密度，我们证明这一阶段自然会产生相当大的非量化反常霍尔响应，并伴有有限的纵向传导，为莫尔系统中的耗散反常霍尔态提供纯电子强耦合机制。", "authors": [{"name": "Kaushal Kumar Kesharpu"}, {"name": "Evgenii A. Kochetov"}], "featured_authors": [{"name": "Kaushal Kumar Kesharpu"}, {"name": "Evgenii A. Kochetov"}], "author_count": 2}, {"id": "2611.34853", "category": "cond-mat", "title": "Monotonic probes of asymmetry and robustness of the quantum Mpemba effect", "abstract": "Entanglement asymmetry has emerged as a powerful probe of symmetry restoration and the quantum Mpemba effect. However, its conventional Rényi generalizations, defined as differences of Rényi entropies, are not monotones in the resource-theoretic sense. Here, we investigate an alternative family of asymmetry quantifiers based on sandwiched Rényi divergences, which satisfy monotonicity under symmetry-preserving quantum channels. Developing a two-parameter replica approach, we show how these quantities can be computed from charged moments and establish a remarkable correspondence with conventional Rényi asymmetries under the inversion of the Rényi index, $\\alpha\\leftrightarrow 1/\\alpha$. This relation, exact for pure states, holds at leading order in the relevant scaling limits for homogeneous quantum quenches, including interacting integrable systems, and for Haar-random states. Applying these results to quenches from tilted ferromagnetic states, we demonstrate that the quantum Mpemba effect is remarkably robust, occurring throughout the entire family of sandwiched Rényi asymmetry monotones. We identify dynamical regimes in quenches from spatially inhomogeneous initial states where conventional Rényi asymmetries and genuine monotones exhibit qualitatively different behaviours. We also investigate a solvable toy model illustrating the possible dependence of Mpemba crossings on the Rényi index. Our findings establish a connection between conventional Rényi asymmetries and quantum resource theory, explaining their effectiveness in broad classes of nonequilibrium protocols while highlighting the additional information provided by genuine asymmetry monotones.", "url": "https://arxiv.org/abs/2611.34853", "type": "理论+数值", "summary": "纠缠不对称性已成为对称性恢复和量子姆彭巴效应的有力探针。然而，其传统的 Rényi 概括（定义为 Rényi 熵的差异）在资源理论意义上并不是单调的。在这里，我们研究了基于夹层 Rényi 散度的另一类不对称量词，它满足对称性保持量子通道下的单调性。通过开发一种双参数复制方法，我们展示了如何从带电矩计算这些量，并在 Rényi 指数的反演 $\\alpha\\leftrightarrow 1/\\alpha$ 下与传统的 Rényi 不对称性建立显着的对应关系。这种关系对于纯态来说是精确的，在同质量子猝灭（包括相互作用的可积系统）和哈尔随机态的相关标度极限中保持领先顺序。将这些结果应用于倾斜铁磁态的淬灭，我们证明量子 Mpemba 效应非常强大，发生在整个夹层 Rényi 不对称单调家族中。\n\n我们从空间不均匀的初始状态中识别淬灭的动力学机制，其中传统的 Rényi 不对称性和真正的单调表现出性质不同的行为。我们还研究了一个可解的玩具模型，说明 Mpemba 交叉点对 Rényi 指数的可能依赖性。我们的研究结果建立了传统 Rényi 不对称性和量子资源理论之间的联系，解释了它们在广泛的非平衡协议中的有效性，同时强调了真正的不对称单调提供的附加信息。", "authors": [{"name": "Riccardo Travaglino"}, {"name": "Michele Mazzoni"}, {"name": "Pasquale Calabrese"}], "featured_authors": [{"name": "Riccardo Travaglino"}, {"name": "Michele Mazzoni"}, {"name": "Pasquale Calabrese"}], "author_count": 3}, {"id": "2611.34900", "category": "cond-mat", "title": "Brightening spin- and parity-forbidden interlayer excitons through rhombohedral stacking", "abstract": "Brightened symmetry-forbidden excitons can provide critical information about the electronic structure and many-body interactions in semiconductors. Recently, interlayer atomic registry has emerged as a new way to control atomically thin layered materials in both ground and excited states. Here we show that the rhombohedral stacking in a 3R-MoS_2 homobilayer can brighten two symmetry-forbidden interlayer excitons: one is a spin-unlike 1s exciton and the other is a parity-odd 2p exciton. The nature of these interlayer excitons is revealed by their gfactors as well as the hybridization patterns observed when they are tuned to resonate with intralayer excitons. Surprisingly, the hybridized 2p exciton exhibits a constructive quantum interference between the acquired transition dipoles, revealing a hidden gauge-invariant phase contrast between the constituent electronic states. Our results establish stacking control as a powerful approach for modulating quantum phases of excitons in 2D semiconductors.", "url": "https://arxiv.org/abs/2611.34900", "type": "理论", "summary": "明亮的对称禁激激子可以提供有关半导体中电子结构和多体相互作用的关键信息。最近，层间原子登记已经成为一种控制基态和激发态原子薄层材料的新方法。在这里，我们证明了 3R-MoS_2 同双层中的菱面体堆叠可以使两个对称禁止的层间激子变亮：一个是与 1s 激子不同的自旋，另一个是宇称奇数 2p 激子。这些层间激子的性质由它们的g因子以及当它们被调谐以与层内激子共振时观察到的杂交模式揭示。令人惊讶的是，杂化的 2p 激子在获得的跃迁偶极子之间表现出相长的量子干涉，揭示了组成电子态之间隐藏的规范不变的相位对比。我们的结果表明堆叠控制是调制二维半导体中激子量子相的有效方法。", "authors": [{"name": "Haodong Hu"}, {"name": "Chih-En Hsu"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Hung-Chung Hsueh"}, {"name": "Zhenglu Li"}, {"name": "Ziliang Ye"}], "featured_authors": [{"name": "Haodong Hu"}, {"name": "Chih-En Hsu"}, {"name": "Kenji Watanabe"}, {"name": "Hung-Chung Hsueh"}, {"name": "Zhenglu Li"}, {"name": "Ziliang Ye"}], "author_count": 7}, {"id": "2611.34926", "category": "cond-mat", "title": "Magnons in solids with correlated atomic and nanoscale disorder", "abstract": "Atomic defects and disorder affect both the microscopic magnon excitations and the macroscopic physical properties of real-world magnetic materials. The rationalization of this relation has hitherto remained elusive, because of the intertwined challenges of simulating with quantum accuracy atomic- and nanoscale inhomogeneities and correlations, and their effect on the magnon spectral function determining observables such as spin stiffness. Here, we introduce a theoretical and computational framework to address these challenges. First, we develop the Coupled Optimization of SpIN Environment (COSINE) algorithm for efficiently relaxing the atomic structure and magnetic configuration of a solid with defects or disorder to a local energy minimum. Then, we discuss how to efficiently obtain exchange interactions accounting for local compositional, structural, and magnetic-moment inhomogeneities. Finally, we develop a paraunitary unfolding approach for Bogoliubov bosons, which allows us to predict the magnon spectral function in materials with any magnetic order, including systems with canting and full, partial, or no magnetic-moment compensation. We showcase our approach in a representative defective ferrimagnet for generality, and then combine it with state-of-the-art spin-informed machine-learning potentials to quantitatively predict how nonuniformities in the spatial distribution of vacancy defects control blurring of effective magnon bandstructures.", "url": "https://arxiv.org/abs/2611.34926", "type": "数值", "summary": "原子缺陷和无序会影响微观磁振子激发和现实世界磁性材料的宏观物理性质。迄今为止，这种关系的合理化仍然难以捉摸，因为以量子精度模拟原子和纳米尺度的不均匀性和相关性及其对确定自旋刚度等可观测值的磁振子谱函数的影响是相互交织的挑战。在这里，我们介绍一个理论和计算框架来应对这些挑战。首先，我们开发了 SpIN 环境耦合优化 (COSINE) 算法，用于有效地将具有缺陷或无序的固体的原子结构和磁构型放松到局部能量最小值。然后，我们讨论如何有效地获得考虑局部成分、结构和磁矩不均匀性的交换相互作用。最后，我们为博戈柳博夫玻色子开发了一种准统一展开方法，该方法使我们能够预测具有任何磁序的材料中的磁振子谱函数，包括具有倾斜和完全、部分或无磁矩补偿的系统。\n\n我们在具有代表性的缺陷亚铁磁体中展示了我们的方法，以实现通用性，然后将其与最先进的自旋信息机器学习势相结合，以定量预测空位缺陷空间分布的不均匀性如何控制有效磁振子能带结构的模糊。", "authors": [{"name": "Alex Moorhouse"}, {"name": "Joseph Barker"}, {"name": "Michele Simoncelli"}], "featured_authors": [{"name": "Alex Moorhouse"}, {"name": "Joseph Barker"}, {"name": "Michele Simoncelli"}], "author_count": 3}, {"id": "2611.33264", "category": "hep-th", "title": "Quantum critical collapse to an extremal black hole", "abstract": "It has been emphasized recently that some extremal black holes are \"critical\" solutions, lying at the threshold between gravitational collapse and dispersion. We study the effect of quantum gravity on critical solutions for the collapse of a thin shell of charged dust. We consider the Hamiltonian that generates the shell equation of motion with respect to the exterior Killing time and coincides with the ADM energy on-shell. Near criticality, this Hamiltonian is shown to be canonically equivalent to that of a Liouville theory with negative potential. After quantization, this model predicts that a collapsing shell has a non-trivial probability of undergoing a quantum mechanical bounce when its energy above extremality is comparable to the \"breakdown scale\". The bounce probability approaches unity at extremality. Hence this model predicts that the critical surface in the classical theory is thickened quantum mechanically into a \"critical layer\". The probability density function for the black hole energy is suppressed below the breakdown scale in the same way as found recently by Turiaci and Wu.", "url": "https://arxiv.org/abs/2611.33264", "type": "理论", "summary": "最近有人强调，一些极值黑洞是“临界”解，位于引力塌缩和色散之间的阈值处。我们研究量子引力对带电尘埃薄壳塌陷关键解决方案的影响。我们考虑哈密顿量，它生成关于外部消杀时间的壳运动方程，并且与壳上的 ADM 能量一致。在接近临界点时，该哈密顿量被证明与具有负势的刘维尔理论典型地等效。量化后，该模型预测，当坍缩壳的能量高于极值时，其发生量子力学反弹的概率与“击穿尺度”相当。弹跳概率在极值处接近统一。因此，该模型预测经典理论中的临界表面会通过量子力学增厚为“临界层”。黑洞能量的概率密度函数被抑制在击穿尺度以下，就像图里亚奇和吴最近发现的那样。", "authors": [{"name": "Hugo Lange"}, {"name": "Harvey S. Reall"}], "featured_authors": [{"name": "Hugo Lange"}, {"name": "Harvey S. Reall"}], "author_count": 2}, {"id": "2611.33271", "category": "hep-th", "title": "The black hole IR triangle for scalar QED", "abstract": "We construct the black hole infrared triangle of scalar QED on a stretched Schwarzschild horizon at tree level. In the covariant phase space of the near-horizon Maxwell field, the soft charge is a corner term. The memory is the zero mode of the gauge-invariant radiative field along the generators. It is conjugate to the boundary gauge mode that labels the degenerate horizon vacua, and Gauss' law fixes it by the flux of charge through the horizon. The Noether flux of the residual gauge transformation through the stretched horizon is not conserved by the scattering, because charged matter crosses the stretched horizon in both directions. The flux with its matter part removed is the soft charge, which generates the large gauge transformation. Its Ward identity is equivalent to a soft photon theorem in every radiative partial wave, which we derive from the near-horizon Feynman rules and, where these do not control the emission, from the field equations at leading order. The main difference from null infinity is that on a stretched horizon both radial branches of the field are independent boundary data. The hard charge is a radial flux. With both branches present it weights each leg by the direction of its radial motion, and the soft factor is a sign per leg. The endpoint data on the two branches give two boundary observables, the time-integrated transverse magnetic and electric fields. The field radiated by a scattering process contributes only to the first, where it cancels the change in the Coulomb memory of the charges, so that the soft charge is conserved. A charge that crosses the horizon enters both. We also discuss the infrared divergence, the dressing of the external states, and the fate of the memory in the Hartle--Hawking state, where it performs a random walk driven by the Hawking radiation.", "url": "https://arxiv.org/abs/2611.33271", "type": "理论", "summary": "我们在树级拉伸的史瓦西视界上构造了标量 QED 的黑洞红外三角形。在近地平线麦克斯韦场的协变相空间中，软电荷是角项。存储器是沿发生器的规范不变辐射场的零模式。它与标记简并视界真空的边界规范模式共轭，高斯定律通过穿过视界的电荷通量来修复它。通过拉伸视界的剩余规范变换的诺特通量不会因散射而守恒，因为带电物质在两个方向上穿过拉伸视界。除去物质部分的通量是软电荷，它产生大规范变换。它的沃德恒等式相当于每个辐射分波中的软光子定理，我们从近地平线费曼规则中推导出来，并且在这些规则不控制发射的情况下，从前导场方程中推导出来。与零无穷大的主要区别在于，在拉伸的地平线上，场的两个径向分支都是独立的边界数据。硬电荷是径向通量。\n\n当两个分支都存在时，它通过其径向运动的方向对每条腿进行加权，并且软因子是每条腿的符号。两个分支上的端点数据给出两个边界可观测量，即时间积分的横向磁场和电场。散射过程辐射的场仅对第一个过程有贡献，它抵消了电荷库仑记忆的变化，从而使软电荷守恒。穿过地平线的电荷进入两者。我们还讨论了红外发散、外部状态的修饰以及哈特尔-霍金态中存储器的命运，在哈特尔-霍金态中，存储器执行由霍金辐射驱动的随机游走。", "authors": [{"name": "Fabiano Feleppa"}, {"name": "Nava Gaddam"}, {"name": "Nico Groenenboom"}], "featured_authors": [{"name": "Fabiano Feleppa"}, {"name": "Nava Gaddam"}, {"name": "Nico Groenenboom"}], "author_count": 3}, {"id": "2611.33272", "category": "hep-th", "title": "The OPE of lines beyond CFT", "abstract": "We discuss the fusion of parallel line defects in theories defined by relevant deformations of a conformal fixed point. We propose an operator product expansion to describe this limit in terms of a Wilsonian effective action whose coefficients are computable in conformal perturbation theory around the UV. This allows one to fix, order by order, the fusion limit of correlation functions involving the defects, up to non-perturbative coefficients associated to correlation functions (condensates) on the fused defect. It thus generalizes the familiar OPE of local operators in QFT. As a non-perturbative test of our proposal, we consider the short-distance potential between two magnetic impurities in the $2d$ Ising model. We find excellent agreement between the OPE framework and DMRG extractions of the potential and condensates (the latter also computed exactly with integrability). In addition, we consider a number of solvable models to illustrate different features of the framework.", "url": "https://arxiv.org/abs/2611.33272", "type": "理论", "summary": "我们讨论由共形不动点的相关变形定义的理论中的平行线缺陷的融合。我们提出了算子乘积展开，以威尔逊有效作用来描述这一极限，其系数可以用围绕 UV 的共形微扰理论来计算。这允许人们逐个地修复涉及缺陷的相关函数的融合极限，直到与融合缺陷上的相关函数（凝聚体）相关联的非微扰系数。因此，它概括了 QFT 中本地运营商熟悉的 OPE。作为我们建议的非微扰测试，我们考虑 $2d$ Ising 模型中两个磁性杂质之间的短距离电势。我们发现 OPE 框架与势能和凝聚态的 DMRG 提取之间具有极好的一致性（后者也通过可积性进行了精确计算）。此外，我们考虑了许多可解模型来说明该框架的不同特征。", "authors": [{"name": "Jan Albert"}, {"name": "Matthew Forslund"}, {"name": "Alexandre Homrich"}], "featured_authors": [{"name": "Jan Albert"}, {"name": "Matthew Forslund"}, {"name": "Alexandre Homrich"}], "author_count": 3}, {"id": "2611.33273", "category": "hep-th", "title": "The String Theory Photinoverse", "abstract": "Type-IIB string compactifications typically give rise to a significant number of RR-photons. These are generically massless and do not possess any light charged states, making them `superhidden'. However, since supersymmetry is present at least at some high scale, corresponding `dark photinos' are also predicted. The kinetic mixing of the photons together with the SUSY breaking mass terms of the photinos makes the latter observable. We identify geometries in which the mixing is induced by Wilson lines and show that their expectation values are generically non-zero. As a result, most of the dark photinos, which are lighter than the visible sector SUSY breaking scale, mix significantly with the bino and hence couple to the Standard Model sufficiently strongly to leave potentially observable traces. In particular, volume modulus and inflaton decays generically induce a cosmological abundance of dark photinos that can explain dark matter. We find that the `natural Photinoverse dark matter parameter space' is already accessible to current experiments, notably gamma ray observations, which therefore have discovery potential in the near future.", "url": "https://arxiv.org/abs/2611.33273", "type": "理论", "summary": "IIB 型弦压缩通常会产生大量 RR 光子。它们通常是无质量的，并且不具有任何轻带电状态，这使得它们“超级隐藏”。然而，由于超对称性至少在一定的高尺度上存在，因此也预测了相应的“暗光微子”。光子的动力学混合与光子的 SUSY 断裂质量项一起使得后者可观察到。我们确定了由威尔逊线引起混合的几何形状，并表明它们的期望值通常不为零。结果，大多数比可见扇区 SUSY 断裂尺度更轻的暗光子与双子显着混合，因此与标准模型的耦合足够强，以留下潜在的可观察痕迹。特别是，体积模量和暴胀衰变通常会引起宇宙学上丰富的暗光子，这可以解释暗物质。我们发现“自然光转宇宙暗物质参数空间”已经可以用于当前的实验，特别是伽马射线观测，因此在不久的将来具有发现潜力。", "authors": [{"name": "Andreas P. Braun"}, {"name": "Thibaut Coudarchet"}, {"name": "Arthur Hebecker"}, {"name": "Joerg Jaeckel"}, {"name": "Jonathan Steiner"}], "featured_authors": [{"name": "Andreas P. Braun"}, {"name": "Thibaut Coudarchet"}, {"name": "Arthur Hebecker"}, {"name": "Joerg Jaeckel"}, {"name": "Jonathan Steiner"}], "author_count": 5}, {"id": "2611.33275", "category": "hep-th", "title": "Gauge groups of type 0 orientifolds", "abstract": "We determine the global form of the gauge groups of the orthogonal and symplectic type 0 orientifolds, using the constraints from perturbative and brane states. In the process, we correct some misprints in type 0 vacuum amplitudes that have propagated in the literature. For type 0A, our analysis reveals a parity condition on the numbers of D9-branes in the orthogonal orientifold and a puzzle concerning the decay of a tachyonic D0-brane in the symplectic orientifold.", "url": "https://arxiv.org/abs/2611.33275", "type": "理论", "summary": "我们使用微扰和膜态的约束来确定正交和辛 0 型东方褶皱规范组的全局形式。在此过程中，我们纠正了文献中传播的 0 型真空振幅的一些错误。对于 0A 型，我们的分析揭示了正交东方褶皱中 D9 膜数量的宇称条件以及有关辛东方褶皱中快子 D0 膜衰变的谜题。", "authors": [{"name": "Vittorio Larotonda"}, {"name": "Salvatore Raucci"}], "featured_authors": [{"name": "Vittorio Larotonda"}, {"name": "Salvatore Raucci"}], "author_count": 2}, {"id": "2611.33277", "category": "hep-th", "title": "Unitarization from Spin Geometry", "abstract": "We derive the dimensional reduction of 10D super Yang-Mills theory on a general closed 6D spin manifold using spectral decompositions for the higher-dimensional gauge field and gaugino, keeping the infinite towers of Kaluza-Klein (KK) modes in the lower-dimensional theory. We then calculate tree-level $2 \\rightarrow 2$ scattering amplitudes with external massive spinors and vectors in this lower-dimensional theory. By studying the high-energy behavior of these amplitudes and imposing perturbative unitarity, we derive several sum rules that involve the eigenvalues of Laplace and Dirac operators on the internal 6-manifold, together with products of cubic coupling constants of the KK modes. These give concrete realizations of the known unitarity sum rules for spontaneously broken gauge theories. We illustrate explicitly how the simplest sum rule is satisfied for flat tori and round spheres.", "url": "https://arxiv.org/abs/2611.33277", "type": "理论", "summary": "我们使用高维规范场和高吉诺的谱分解推导了一般封闭 6D 自旋流形上 10 维超杨-米尔斯理论的降维，同时在低维理论中保留了 Kaluza-Klein (KK) 模式的无限塔。然后，我们在这个低维理论中使用外部大量旋量和向量计算树级 $2 \\rightarrow 2$ 散射幅度。通过研究这些振幅的高能行为并施加微扰幺正性，我们得出了几个求和规则，其中涉及内部 6 流形上的拉普拉斯和狄拉克算子的特征值，以及 KK 模式的三次耦合常数的乘积。这些给出了自发破缺规范理论的已知幺正和规则的具体实现。我们明确地说明了如何满足扁平环面和圆形球体的最简单求和规则。", "authors": [{"name": "Francesco Bertucci"}, {"name": "James Bonifacio"}, {"name": "Andrew Schrader"}], "featured_authors": [{"name": "Francesco Bertucci"}, {"name": "James Bonifacio"}, {"name": "Andrew Schrader"}], "author_count": 3}, {"id": "2611.33281", "category": "hep-th", "title": "Neural Network Field Theory and the AdS/CFT Correspondence", "abstract": "We develop a neural realization of massive scalar field theory on Euclidean anti--de Sitter space and its holographic boundary observables within neural network field theory (NN--FT). We construct Fourier--Bessel cosine neurons whose covariance reproduces the regulated massive AdS propagator exactly at finite network width, with the Gaussian field theory recovered in the infinite-width limit. We introduce quartic interactions through two complementary approaches. The first implements a prescribed interaction by deforming the neural parameter measure, while the second generates a local quartic interaction from the statistics of auxiliary binary neurons. Applying the BDHM prescription directly to the neural ensemble, we recover the scalar bulk-to-boundary propagator, the conformal boundary two-point function, and the leading connected four-point contact Witten diagram. We further show that distinct neural architectures can reproduce the same leading boundary correlators while defining inequivalent bulk theories. These results establish a framework for studying interacting scalar holography within NN--FT and clarify the role of neural architecture in encoding bulk dynamics and boundary observables.", "url": "https://arxiv.org/abs/2611.33281", "type": "理论", "summary": "我们在神经网络场论（NN--FT）内开发了欧几里德反德西特空间及其全息边界可观测量的大规模标量场论的神经实现。我们构建了傅立叶-贝塞尔余弦神经元，其协方差在有限网络宽度上精确地再现了受调节的大规模 AdS 传播器，并在无限宽度限制中恢复了高斯场论。我们通过两种互补的方法引入四次相互作用。第一个通过使神经参数测量变形来实现规定的交互，而第二个则根据辅助二元神经元的统计数据生成局部四次交互。将 BDHM 处方直接应用于神经系综，我们恢复了标量体到边界传播器、共形边界两点函数和前导连接四点接触维滕图。我们进一步表明，不同的神经架构可以重现相同的主要边界相关器，同时定义不等价的体理论。\n\n这些结果建立了一个用于研究 NN-FT 中相互作用标量全息术的框架，并阐明了神经架构在编码体动力学和边界可观测值中的作用。", "authors": [{"name": "Dmitry S. Ageev"}, {"name": "Yulia A. Ageeva"}, {"name": "Anna S. Bernakevich"}], "featured_authors": [{"name": "Dmitry S. Ageev"}, {"name": "Yulia A. Ageeva"}, {"name": "Anna S. Bernakevich"}], "author_count": 3}, {"id": "2611.33283", "category": "hep-th", "title": "Energy plateau cascades from complex-time local quenches in thermal two-dimensional CFTs", "abstract": "In this work, we study local operator quenches in thermal two-dimensional conformal field theories with complex-time evolution, which can be viewed as an effective description of conditional dynamics in a system interacting with an environment. In contrast to quenches of the vacuum, the thermal initial state allows several conformal families to participate in the evolution. We show that their competition can produce cascades of approximately homogeneous energy plateaux, with successive plateaux approaching the energies of different primary states. Using conformal Ward identities on the cylinder and torus, we determine the local energy density and illustrate this behavior in free-field theories, the Ising model and Wess--Zumino--Witten models. We develop a cold-limit spectral description in which the dominant primary channel determines the height of each plateau, while conformal dimensions and operator matrix elements govern the transitions between them. For a fixed compact unitary CFT, we show that only finitely many primary channels can contribute to the leading plateau sequence. Finally, we discuss the large-central-charge regime, relating light-operator plateaux to few-particle sectors in thermal AdS and examining the limitations of this picture for heavy quenches.", "url": "https://arxiv.org/abs/2611.33283", "type": "理论", "summary": "在这项工作中，我们研究了具有复杂时间演化的热二维共形场论中的局域算子淬灭，这可以被视为对与环境相互作用的系统中条件动力学的有效描述。与真空淬火相反，热初始状态允许多个共形族参与演化。我们表明，它们的竞争可以产生近似均匀的能量平台的级联，连续的平台接近不同初级状态的能量。使用圆柱体和环面上的共形沃德恒等式，我们确定了局部能量密度，并在自由场理论、伊辛模型和韦斯-祖米诺-威滕模型中说明了这种行为。我们开发了一种冷极限光谱描述，其中主要通道决定每个平台的高度，而共形尺寸和算子矩阵元素控制它们之间的过渡。对于固定的紧凑酉 CFT，我们表明只有有限多个主通道可以对领先的平台序列做出贡献。\n\n最后，我们讨论了大中心电荷状态，将轻算子平台与热 AdS 中的少粒子扇区联系起来，并检查了该图对于重淬火的局限性。", "authors": [{"name": "Dmitry S. Ageev"}, {"name": "Vladimir A. Bykov"}], "featured_authors": [{"name": "Dmitry S. Ageev"}, {"name": "Vladimir A. Bykov"}], "author_count": 2}, {"id": "2611.33285", "category": "hep-th", "title": "Bounds on Love Numbers and Quasinormal Modes from the Surface Impedance", "abstract": "The surface impedance of a body is fixed by its interior alone and encodes its entire tidal response. We derive bounds on Love numbers and quasinormal modes from constraints on the impedance that follow from either of two properties of a stable body: it is lossless, meaning that it dissipates no energy, or it is passive, meaning that it never gives back more energy than it has received. For a lossless body, every dynamical Love number is bounded from above and below, exactly in general relativity, in any renormalization scheme and at any scale. Earlier bounds are exact for Newtonian stars but fail for compact stars, because they take the response to arbitrarily fast tides to be zero or non-negative, whereas in general relativity it is negative. The quasinormal modes of a lossless body are also excluded from a region of the complex frequency plane set by the mass and radius. Each known Love number enlarges the excluded region. Conversely, the quasinormal modes bound each Love number from below, given the lower ones. For a passive body of horizon scale, such as a black hole, the static Love number lies in a window that closes onto the vanishing black-hole value as the body's surface approaches the horizon.", "url": "https://arxiv.org/abs/2611.33285", "type": "理论", "summary": "物体的表面阻抗仅由其内部固定，并对其整个潮汐响应进行编码。我们从稳定体的两个属性中的任何一个所遵循的阻抗约束中推导出洛夫数和拟正规模式的界限：它是无损的，意味着它不耗散任何能量，或者它是被动的，意味着它永远不会返回比它接收到的更多的能量。对于无损物体，每个动态洛夫数都从上到下有界，这在广义相对论中、在任何重正化方案和任何尺度上都是有界的。早期的界限对于牛顿恒星来说是精确的，但对于致密恒星来说却失败了，因为它们将对任意快速潮汐的响应视为零或非负，而在广义相对论中它是负的。无损物体的准正规模式也被排除在由质量和半径设置的复频率平面的区域之外。每个已知的爱数都会扩大被排除的区域。相反，拟正规模式从下面限制每个爱数，给定较低的数。\n\n对于视界尺度的被动物体，例如黑洞，静态洛夫数位于一个窗口中，当物体表面接近地平线时，该窗口关闭到消失的黑洞值。", "authors": [{"name": "Daniel McLoughlin"}, {"name": "Mikhail P. Solon"}], "featured_authors": [{"name": "Daniel McLoughlin"}, {"name": "Mikhail P. Solon"}], "author_count": 2}, {"id": "2611.33287", "category": "hep-th", "title": "Chaotic singularities inside vacuum black holes", "abstract": "According to the conjecture of Belinski, Khalatnikov and Lifshitz, general relativity gives rise to chaotic dynamics in the vicinity of generic spacelike singularities. However, no vacuum black hole has been shown to exhibit this behaviour. Here we construct stationary, asymptotically locally AdS$_5$ black holes with regular, triaxially squashed horizons and causal exteriors, whose homogeneous interiors realize the cosmological billiard of generic five-dimensional vacuum gravity. We identify a simple algebraic condition on the horizon data that is necessary for the interior billiard to be chaotic, and show that solutions with regular horizons locally access an open set of billiard trajectories.", "url": "https://arxiv.org/abs/2611.33287", "type": "理论", "summary": "根据别林斯基、哈拉特尼科夫和利夫什茨的猜想，广义相对论在类空间奇点附近产生了混沌动力学。然而，目前还没有真空黑洞表现出这种行为。在这里，我们构造了静止的、渐近局部的 AdS$_5$ 黑洞，其具有规则的、三轴挤压的视界和因果外部，其均匀的内部实现了通用五维真空引力的宇宙台球。我们在地平线数据上确定了一个简单的代数条件，这是内部台球变得混乱所必需的，并表明具有规则地平线的解决方案可以在本地访问一组开放的台球轨迹。", "authors": [{"name": "Robie A. Hennigar"}, {"name": "Ayan K. Patra"}], "featured_authors": [{"name": "Robie A. Hennigar"}, {"name": "Ayan K. Patra"}], "author_count": 2}, {"id": "2611.33291", "category": "hep-th", "title": "RMT${}_2$: Random Spectral Correlations for CFT${}_2$ and AdS${}_3$ Gravity", "abstract": "We present the full framework of RMT${}_2$, a consistent unification of random matrix theory and modular invariance. The systematic prescription, which augments the existing construction by incorporating spin, lifts random matrix correlators to $\\text{SL}(2,\\mathbb{Z})$ Poincaré sums of their Mellin transforms, in a manner which enforces random matrix correlations near extremality in every spinning primary sector. The resulting RMT${}_2$ correlators are further expressible in terms of an orthogonal basis of Eisenstein series and Maass cusp forms. We demonstrate the construction by lifting the two-point correlators at arbitrary genus of the Airy model, in both unitary and orthogonal symmetry classes, exhibiting the modular-invariant topological expansion of RMT${}_2$; a resummation of the genus expansion shows that the modular-invariant spectral form factor preserves the ramp-plateau structure. Holographically, RMT${}_2$ provides a concrete benchmark and explicit candidate expressions for comparison with off-shell wormhole amplitudes in AdS${}_3$ gravity, with any number of torus boundaries. We explicitly compute the universal RMT${}_2$ three-point correlator, corresponding to the putative three-boundary wormhole.", "url": "https://arxiv.org/abs/2611.33291", "type": "理论", "summary": "我们提出了 RMT${}_2$ 的完整框架，这是随机矩阵理论和模不变性的一致统一。系统性的方案通过合并自旋来增强现有的结构，将随机矩阵相关器提升到梅林变换的 $\\text{SL}(2,\\mathbb{Z})$ 庞加莱和，从而在每个旋转主扇区中强制执行接近极值的随机矩阵相关性。由此产生的 RMT${}_2$ 相关器可以进一步用爱森斯坦级数和马斯尖点形式的正交基来表达。我们通过在酉对称类和正交对称类中提升艾里模型任意属处的两点相关器来演示该构造，展示 RMT${}_2$ 的模不变拓扑展开；属扩展的恢复表明模不变谱形状因子保留了斜坡-平台结构。全息地，RMT${}_2$ 提供了具体的基准和明确的候选表达式，用于与 AdS${}_3$ 重力中的离壳虫洞振幅进行比较，具有任意数量的环面边界。\n\n我们显式计算通用 RMT${}_2$ 三点相关器，对应于假定的三边界虫洞。", "authors": [{"name": "Jan Boruch"}, {"name": "Gabriele Di Ubaldo"}, {"name": "Felix M. Haehl"}, {"name": "Eric Perlmutter"}, {"name": "Moshe Rozali"}], "featured_authors": [{"name": "Jan Boruch"}, {"name": "Gabriele Di Ubaldo"}, {"name": "Felix M. Haehl"}, {"name": "Eric Perlmutter"}, {"name": "Moshe Rozali"}], "author_count": 5}, {"id": "2611.33311", "category": "hep-th", "title": "Machine Learning for Calabi--Yau Geometry and Heterotic Compactification", "abstract": "Quantitative predictions from string compactification depend on geometric data that are difficult to compute analytically. This review surveys machine learning approaches to predicting topological properties of Calabi-Yau manifolds, discusses the search for new Calabi-Yau fourfolds, as well as numerical methods for approximating Ricci-flat metrics. In the context of heterotic compactifications, we explain how bundle metrics and harmonic matter forms enter calculations of canonically normalized Yukawa couplings and axion-matter interactions. We also outline applications to flux compactifications, warped and corrected backgrounds, and geometric structures beyond the Calabi-Yau setting. Finally, we review available datasets and software, highlight connections with analytic methods, and discuss geometric constraints, numerical validation, and recent progress in rigorous error control.", "url": "https://arxiv.org/abs/2611.33311", "type": "理论", "summary": "弦紧化的定量预测取决于难以分析计算的几何数据。这篇综述调查了预测 Calabi-Yau 流形拓扑性质的机器学习方法，讨论了对新 Calabi-Yau 四重体的搜索，以及近似 Ricci 平坦度量的数值方法。在异质紧化的背景下，我们解释了束度量和调和物质形式如何进入规范归一化汤川耦合和轴子-物质相互作用的计算。我们还概述了在通量致密化、扭曲和校正背景以及卡拉比-丘设置之外的几何结构中的应用。最后，我们回顾了可用的数据集和软件，强调了与分析方法的联系，并讨论了几何约束、数值验证以及严格误差控制方面的最新进展。", "authors": [{"name": "Vishnu Jejjala"}, {"name": "Damian Mayorga Pena"}], "featured_authors": [{"name": "Vishnu Jejjala"}, {"name": "Damian Mayorga Pena"}], "author_count": 2}, {"id": "2611.33343", "category": "hep-th", "title": "On the Structure Constants of ${\\cal N}=2$ Liouville Theory", "abstract": "We show the structure constants of $\\mathcal{N}=2$ spacelike Liouville theory. The absence of self-duality under $b\\leftrightarrow b^{-1}$, where $b$ is the Liouville coupling, prevents a straightforward application of the standard bootstrap methods used in $\\mathcal{N}=0$ and $\\mathcal{N}=1$ Liouville theory. Motivated by the fermionic FZZ duality with the $SL(2,\\mathbb{R})/U(1)$ supercoset theory, we establish an algebraic correspondence between the two theories, including a matching of their null vectors. We then derive the three-point structure constants in superspace. The neutral sector structure constants are associated with the spectral-flow-preserving structure constant of the $SL(2,\\mathbb{R})$ WZW model, while the two charged sectors correspond to its spectral-flow-violating structure constants. Finally, we give the correct relative normalization between the neutral and charged sectors and test crossing symmetry numerically.", "url": "https://arxiv.org/abs/2611.33343", "type": "理论", "summary": "我们展示了 $\\mathcal{N}=2$ 类空间刘维尔理论的结构常数。 $b\\leftrightarrow b^{-1}$ 下不存在自对偶性，其中 $b$ 是刘维尔耦合，因此无法直接应用 $\\mathcal{N}=0$ 和 $\\mathcal{N}=1$ 刘维尔理论中使用的标准引导方法。受费米子 FZZ 对偶性与 $SL(2,\\mathbb{R})/U(1)$ 超陪集理论的启发，我们在两个理论之间建立了代数对应关系，包括它们的零向量的匹配。然后我们推导超空间中的三点结构常数。中性扇区结构常数与 $SL(2,\\mathbb{R})$ WZW 模型的谱流保持结构常数相关，而两个带电扇区对应于其谱流破坏结构常数。最后，我们给出中性部分和带电部分之间正确的相对归一化，并以数值方式测试交叉对称性。", "authors": [{"name": "Jingxin Tu"}], "featured_authors": [{"name": "Jingxin Tu"}], "author_count": 1}, {"id": "2611.33354", "category": "hep-th", "title": "Identifying Renormalization Group Interfaces of Massless WZW Flows $\\widehat{\\mathfrak{su}}(2)_k \\to \\widehat{\\mathfrak{su}}(2)_1$", "abstract": "A renormalization-group interface encodes how a flow relates operators at short and long distances. We identify this interface up to topological dressing for the conjectured massless $\\widehat{\\mathfrak{su}}(2)_k \\to \\widehat{\\mathfrak{su}}(2)_1$ Wess-Zumino-Witten flows at every odd level $k\\geq 3$. Global $SU(2)$ symmetry requires the interface to preserve a diagonal current algebra at level $k+1$, built from the currents on its two sides. The $\\mathbb{Z}_2$ center symmetry then selects which representation labels the interface. This identification predicts distinct patterns of low-lying interface excitations for flows to the same infrared fixed point. Spin-chain calculations reproduce these patterns for $k=3$ and $5$, providing independent evidence for both conjectured flows.", "url": "https://arxiv.org/abs/2611.33354", "type": "理论", "summary": "重整化群接口对流如何与短距离和长距离的算子进行关联进行编码。我们将这个接口识别为猜想的无质量 $\\widehat{\\mathfrak{su}}(2)_k \\to \\widehat{\\mathfrak{su}}(2)_1$ Wess-Zumino-Witten 在每个奇数级 $k\\geq 3$ 上的拓扑修饰。全局 $SU(2)$ 对称性要求接口保留 $k+1$ 层的对角电流代数，该代数由其两侧的电流构建。然后 $\\mathbb{Z}_2$ 中心对称性选择标记界面的表示形式。这种识别预测了流向同一红外固定点的低洼界面激发的不同模式。自旋链计算重现了 $k=3$ 和 $5$ 的这些模式，为这两种推测的流量提供了独立的证据。", "authors": [{"name": "Yuma Furuta"}, {"name": "Yuya Kusuki"}, {"name": "Toshiki Onagi"}, {"name": "Yin Tang"}], "featured_authors": [{"name": "Yuma Furuta"}, {"name": "Yuya Kusuki"}, {"name": "Toshiki Onagi"}, {"name": "Yin Tang"}], "author_count": 4}, {"id": "2611.33415", "category": "hep-th", "title": "An Argument for the Weak Gravity Conjecture from Constrained Wormholes", "abstract": "The gravitational path integral (GPI) computes inner products between states of open and closed universes in any low-energy effective theory. A well-defined Hilbert space requires these inner products to be positive semidefinite, but this positivity is not manifest in the effective theory. In this paper, we study the constraints that positivity imposes on Einstein--Maxwell theory coupled to charged matter in asymptotically flat space in $D\\geq 4$ dimensions. We start by constructing a new class of constrained instantons that compute multi-boundary wormhole amplitudes. We show that, under mild assumptions, if no charged particle satisfies the weak gravity conjecture (WGC), these amplitudes violate positivity of the GPI. If instead some particle satisfies the WGC, the wormholes develop an instability that allows positivity to be restored. The same argument shows that positivity can only be restored if the magnetic WGC holds and the convex hull condition applies to theories with several $\\mathrm{U}(1)$ gauge fields.", "url": "https://arxiv.org/abs/2611.33415", "type": "理论", "summary": "引力路径积分 (GPI) 计算任何低能有效理论中开放宇宙和封闭宇宙状态之间的内积。明确定义的希尔伯特空间要求这些内积是半正定的，但这种正性在有效理论中并不明显。在本文中，我们研究了正性对爱因斯坦 - 麦克斯韦理论与 $D\\geq 4$ 维度渐近平坦空间中带电物质耦合的约束。我们首先构建一类新的约束瞬时子来计算多边界虫洞振幅。我们表明，在温和的假设下，如果没有带电粒子满足弱重力猜想 (WGC)，这些振幅就会违反 GPI 的正性。相反，如果某些粒子满足 WGC，虫洞就会产生不稳定性，从而恢复积极性。同样的论点表明，只有当磁性 WGC 成立并且凸包条件适用于具有多个 $\\mathrm{U}(1)$ 规范场的理论时，才能恢复正性。", "authors": [{"name": "Gabriele Di Ubaldo"}, {"name": "Luca V. Iliesiu"}, {"name": "Dawid Maskalaniec"}], "featured_authors": [{"name": "Gabriele Di Ubaldo"}, {"name": "Luca V. Iliesiu"}, {"name": "Dawid Maskalaniec"}], "author_count": 3}, {"id": "2611.33445", "category": "hep-th", "title": "Probe branes from equivariant volumes", "abstract": "Classical Euclidean probe actions control non-perturbative weights and extended observables in holography. We present a geometric prescription for M2-branes in arbitrary BPS backgrounds and D3-branes in the five-form sector of type IIB. The framework accommodates compact and non-compact supersymmetric worldvolumes in both internal and spacetime directions, expressing their actions as relative equivariant pairings. Under stated extension and boundary assumptions, equivariant volumes evaluate these pairings without explicit background metrics and provide a regularization for non-compact probes. Examples in $\\mathrm{AdS}_4\\times SE_7$ backgrounds dual to ABJM, ADHM and flavored quiver theories reproduce and refine worldsheet-type instanton exponents and finite Wilson-loop actions. We also recover M2 giant-graviton and surface-defect actions in $\\mathrm{AdS}_7\\times S^4$. D3 probes in $SE_5$ compactifications dual to $\\mathcal{N}=4$ super Yang--Mills and Klebanov--Witten theory provide tests involving giant gravitons, black hole probes and surface defects.", "url": "https://arxiv.org/abs/2611.33445", "type": "理论", "summary": "经典欧几里得探针动作控制全息术中的非微扰权重和扩展可观测值。我们提出了任意 BPS 背景中的 M2 膜和 IIB 型五种扇区中的 D3 膜的几何处方。该框架在内部和时空方向上容纳紧凑和非紧凑的超对称世界体积，将它们的行为表达为相对等变对。在规定的扩展和边界假设下，等变体积在没有明确背景指标的情况下评估这些配对，并为非紧凑探针提供正则化。 $\\mathrm{AdS}_4\\times SE_7$ 背景中的示例与 ABJM、ADHM 和风味箭袋理论对偶，再现并完善了世界表型瞬子指数和有限威尔逊循环动作。我们还恢复了 $\\mathrm{AdS}_7\\times S^4$ 中的 M2 巨引力子和表面缺陷作用。 $SE_5$ 紧致化中的 D3 探测器与 $\\mathcal{N}=4$ 超级杨-米尔斯和克莱巴诺夫-维滕理论提供了涉及巨引力子、黑洞探测器和表面缺陷的测试。", "authors": [{"name": "Kiril Hristov"}, {"name": "Pedro Vicente Marto"}], "featured_authors": [{"name": "Kiril Hristov"}, {"name": "Pedro Vicente Marto"}], "author_count": 2}, {"id": "2611.33564", "category": "hep-th", "title": "All known supersymmetric $\\mathrm{AdS}_4 \\times S^7$ uplifts from maximal supergravity", "abstract": "The solutions of $D=4$ $\\mathcal N=8$ SO(8)-gauged supergravity uplift consistently to eleven dimensions. All known supersymmetric AdS$_4$ vacua of this theory lie in an $\\mathcal N=1$ truncation containing seven chiral multiplets. In this paper, we work out the uplift of this seven-chiral sector, providing a unified eleven-dimensional geometric description of all known supersymmetric AdS$_4$ solutions in this class. We then specialise to the $\\mathcal N=1$ vacua with U(1)$^2$ and SO(3) symmetry, obtain their new $D=11$ uplifts and bring out their internal geometries. Both of them admit a Kaluza--Klein-type description. For the U(1)$^2$ solution, this uses the global Hopf fibration of $S^7$ over $\\mathbb{CP}^3$. One U(1) acts on the fibre, while the other generates the only continuous isometry of the deformed $\\mathbb{CP}^3$ base. For the SO(3) solution, the geometry takes a local non-abelian Kaluza--Klein form, with SO(3) acting on the fibres and no residual continuous symmetry on the four-dimensional base.", "url": "https://arxiv.org/abs/2611.33564", "type": "理论", "summary": "$D=4$ $\\mathcal N=8$ SO(8) 测量的超重力隆升的解始终一致到十一维。该理论所有已知的超对称 AdS$_4$ 真空都位于包含七个手性多重态的 $\\mathcal N=1$ 截断中。在本文中，我们计算出了这个七手性扇区的提升，为此类中所有已知的超对称 AdS$_4$ 解决方案提供了统一的十一维几何描述。然后我们专门研究具有 U(1)$^2$ 和 SO(3) 对称性的 $\\mathcal N=1$ 真空，获得它们新的 $D=11$ 隆起并显示出它们的内部几何形状。他们都承认卡鲁扎——克莱因式的描述。对于 U(1)$^2$ 解，使用 $S^7$ 在 $\\mathbb{CP}^3$ 上的全局 Hopf 纤维化。一个 U(1) 作用于光纤，而另一个 U(1) 生成变形 $\\mathbb{CP}^3$ 基底的唯一连续等距。对于 SO(3) 解，几何形状采用局部非阿贝尔 Kaluza-Klein 形式，其中 SO(3) 作用于纤维，并且在四维基底上没有残余连续对称性。", "authors": [{"name": "Krzysztof Pilch"}, {"name": "Oscar Varela"}], "featured_authors": [{"name": "Krzysztof Pilch"}, {"name": "Oscar Varela"}], "author_count": 2}, {"id": "2611.33599", "category": "hep-th", "title": "Holographic probes and Krylov complexity on asymptotically Lifshitz rotating black branes", "abstract": "We study two types of holographic probes on a five-dimensional, asymptotically Lifshitz, rotating black hole. This geometry solves the field equations of Einstein gravity coupled to a dilaton, two axionic scalars, and a Maxwell doublet, supplemented by two vector doublets that enter the action through a parity-odd, Chern-Simons-like combination, as recently found in \\cite{Bravo-Gaete:2026bdq}. This spacetime provides a concrete bottom-up arena to explore the imprints of rotation on probes in non-relativistic holography. First, we compute the holographic static quark-antiquark potential following the standard prescription that relates this boundary observable to the on shell-action of a string configuration whose endpoints are anchored at the boundary. We find that the screening length decreases both when the angular momentum is increased at fixed temperature and when the temperature is increased at fixed angular momentum. The former reflects centrifugal effects on the $q\\bar{q}$ pair, whereas the latter stems from enhanced thermal fluctuations, which weaken correlations at a given separation. Second, we compute the growth rate of the Krylov complexity, using the holographic prescription that relates this observable to the momentum of a massive particle probe falling into the IR. In particular, we find that, at a given instant, the complexity grows faster as the dynamical exponent $z$ is increased.", "url": "https://arxiv.org/abs/2611.33599", "type": "理论", "summary": "我们研究了五维渐近利夫席茨旋转黑洞上的两种全息探测器。这种几何结构求解了与膨胀子、两个轴子标量和麦克斯韦双峰耦合的爱因斯坦引力场方程，并辅以两个矢量双峰，它们通过宇称奇数、类 Chern-Simons 组合进入作用，如最近在 \\cite{Bravo-Gaete:2026bdq} 中发现的那样。这个时空提供了一个具体的自下而上的舞台来探索非相对论全息中探测器上的旋转印记。首先，我们按照标准规定计算全息静态夸克-反夸克势，该标准规定将可观察到的边界与弦结构的壳作用联系起来，弦结构的端点锚定在边界处。我们发现，当角动量在固定温度下增加时以及当温度在固定角动量下增加时，筛选长度都会减小。前者反映了 $q\\bar{q}$ 对的离心效应，而后者则源于增强的热波动，这削弱了给定分离处的相关性。\n\n其次，我们使用全息处方计算克雷洛夫复杂度的增长率，该处方将这一可观测值与落入红外的大粒子探测器的动量联系起来。特别是，我们发现，在给定时刻，随着动态指数 $z$ 的增加，复杂性增长得更快。", "authors": [{"name": "Moises Bravo-Gaete"}, {"name": "Mariano Chernicoff"}, {"name": "Benjamin Mellado"}, {"name": "Julio Oliva"}, {"name": "Maria Guadalupe Olmos Andrade"}], "featured_authors": [{"name": "Moises Bravo-Gaete"}, {"name": "Mariano Chernicoff"}, {"name": "Benjamin Mellado"}, {"name": "Julio Oliva"}, {"name": "Maria Guadalupe Olmos Andrade"}], "author_count": 5}, {"id": "2611.33620", "category": "hep-th", "title": "The Dirac equation in arbitrary coordinate systems and curved spacetimes - An orthonormal frames approach", "abstract": "In this pedagogical article we discuss the Dirac equation in arbitrary coordinate systems. We explain the need for connections when dealing with spinor fields and present the practical steps needed to compute the Dirac operator in a general setting, allowing for arbitrary coordinate systems and position-dependent orthonormal gamma matrices, both of which can simplify computations in certain scenarios. The extension to include minimally coupled gravity is straightforward. Examples are provided, including constructing the Dirac equation in spherical and cylindrical symmetry (with or without gravity) and the Kerr spacetime. We also briefly comment on the advantages and disadvantages of various tetrads and orthonormal gamma matrices. This manuscript should be accessible to readers who have studied the Dirac equation at an introductory level (e.g., in Cartesian coordinates in flat spacetime with constant gamma matrices). The emphasis is on the use of orthonormal frames, since these correspond to the coordinate systems most familiar to readers when dealing with most field theories, and represent the physical frames where measurements are performed. The aim is to get the reader quickly to the point of being able to do calculations, so the presentation favors a concise, pragmatic approach over extended derivations.", "url": "https://arxiv.org/abs/2611.33620", "type": "理论", "summary": "在这篇教学文章中，我们讨论任意坐标系中的狄拉克方程。我们解释了处理旋量场时对连接的需求，并提出了在一般设置中计算狄拉克算子所需的实际步骤，允许任意坐标系和位置相关的正交伽玛矩阵，这两者都可以简化某些情况下的计算。包括最小耦合重力的扩展很简单。提供了示例，包括构造球对称和柱对称（有或没有重力）的狄拉克方程以及克尔时空。我们还简要评论了各种四分体和正交伽马矩阵的优缺点。在介绍性水平上研究过狄拉克方程（例如，在具有常数伽玛矩阵的平坦时空的笛卡尔坐标中）的读者应该可以理解这份手稿。重点是正交坐标系的使用，因为它们对应于读者在处理大多数场论时最熟悉的坐标系，并表示执行测量的物理坐标系。\n\n目的是让读者快速掌握计算能力，因此演示文稿倾向于简洁、实用的方法，而不是扩展的推导。", "authors": [{"name": "Andrew DeBenedictis"}, {"name": "Saša Ilijić"}], "featured_authors": [{"name": "Andrew DeBenedictis"}, {"name": "Saša Ilijić"}], "author_count": 2}, {"id": "2611.33744", "category": "hep-th", "title": "Late-time OTOCs in Toda conformal field theory", "abstract": "We study late-time out-of-time-order correlators (OTOCs) of semi-degenerate primary fields in two-dimensional $A_{N-1}$ Toda conformal field theory. In Liouville theory ($N=2$), we find that the OTOC decays as $t^{-3/2}$ when the continuum edge dominates, correcting a previously reported constant limit. For $N=3$, a transverse contour pinch reduces the spectral integral to one dimension. Assuming that the reduced expansion is complete, in the continuous phase the regulated edge behaves as a discrete state, and the OTOC approaches a pure braiding phase. As we check numerically, the edge block is a free-field correlator in a charge-neutral Weyl frame; this explains the pure phase and is consistent with crossing symmetry. For both $N=2$ and $N=3$, a dominant discrete residue gives a constant late-time limit. For $N\\geq4$, the same one-dimensional reduction violates a crossing bound on the lowest intermediate weight of a positive diagonal expansion. Hence the $N=2,3$ phase diagram does not extend to higher rank without additional contributions below the reduced continuum edge or outside a positive diagonal expansion.", "url": "https://arxiv.org/abs/2611.33744", "type": "理论", "summary": "我们研究二维 $A_{N-1}$ Toda 共形场论中半简并初级场的晚期乱序相关器 (OTOC)。在刘维尔理论（$N=2$）中，我们发现当连续统边缘占主导地位时，OTOC 衰减为 $t^{-3/2}$，从而纠正了先前报告的恒定极限。对于 $N=3$，横向轮廓收缩将谱积分减少到一维。假设缩减膨胀完成，在连续阶段，调节边缘表现为离散状态，并且 OTOC 接近纯编织阶段。正如我们在数值上检查的那样，边缘块是电荷中性 Weyl 框架中的自由场相关器；这解释了纯相并且与交叉对称性一致。对于 $N=2$ 和 $N=3$，占主导地位的离散残差给出了恒定的后期限制。对于 $N\\geq4$，相同的一维缩减违反了正对角展开的最低中间权重的交叉界限。因此，$N=2,3$ 相图不会扩展到更高的等级，除非在减少的连续体边缘以下或在正对角线扩展之外有额外的贡献。", "authors": [{"name": "Giwan Kim"}, {"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Giwan Kim"}, {"name": "Masahito Yamazaki"}], "author_count": 2}, {"id": "2611.34082", "category": "hep-th", "title": "Defect Correlators from Supergravity: Finding the Missing Contact Terms", "abstract": "We resolve a puzzle in the computation of holographic correlators using supergravity when defects are present. Previous direct supergravity calculations of defect two-point functions were found to differ from bootstrap results by a set of contact contributions. We show that the discrepancy arises from two effects: nonlinear Kaluza-Klein field redefinitions in the bulk, which induce additional quadratic couplings when applied consistently to localized sources, and off-shell terms in mixed bulk--defect vertices, which can collapse internal defect propagators. We demonstrate how these two mechanisms resolve the puzzle in two concrete examples in 4d $\\mathcal{N}=4$ SYM, where we consider two-point correlators in the presence of a $\\frac{1}{2}$-BPS Wilson line and on $\\mathbb{RP}^4$.", "url": "https://arxiv.org/abs/2611.34082", "type": "理论", "summary": "我们解决了存在缺陷时使用超重力计算全息相关器的难题。以前对缺陷两点函数的直接超重力计算被发现与一组接触贡献的引导结果不同。我们表明，这种差异是由两种效应引起的：体中的非线性 Kaluza-Klein 场重新定义，当一致地应用于局部源时，会引起额外的二次耦合；以及混合体缺陷顶点中的离壳项，这可能会破坏内部缺陷传播器。我们在 4d $\\mathcal{N}=4$ SYM 中的两个具体示例中演示了这两种机制如何解决这个难题，其中我们在存在 $\\frac{1}{2}$-BPS Wilson 线和 $\\mathbb{RP}^4$ 的情况下考虑两点相关器。", "authors": [{"name": "Qi Chen"}, {"name": "Xinan Zhou"}], "featured_authors": [{"name": "Qi Chen"}, {"name": "Xinan Zhou"}], "author_count": 2}, {"id": "2611.34097", "category": "hep-th", "title": "Higher derivatives and ghosts through three centuries", "abstract": "We outline the history of the research of dynamic systems including higher derivatives in the Lagrangian, The story starts in 1744 when Euler published a book where the Euler--Lagrange differential equations for a HD system were first written. The next important landmarks were the papers of Ostrogradsky (1850) and of Pais and Uhlenbeck (1950). Many articles written in the second half of the last century were influenced by a misconception that was widespread at the time --- it was believed that higher derivatives necessarily bring about a violation of unitarity. We understand today that this is not the case and there are many systems with benign ghosts where HD are present but unitarity is not violated. In this review, we present and discuss several examples of such (quantum) mechanical systems and 2D field theories. Then we will briefly discuss higher-derivative gravity theories in 4 dimensions. In that case, the question whether the ghosts there are benign or not has a special status due to the absence of a nonperturbative Hamiltonian and does not have a definite answer yet. However, if one restricts oneself to classical theory, one can argue that the ghosts {\\it are} benign (benign classical ghostly system is a system that needs an infinite time to reach a singularity, and it seems to the case both in ordinary and in HD gravity: the cosmic censorship conjecture implies that the singularities are always surrounded by horizons, and it takes an infinite time on the clocks of a distant observer to reach a horizon). Finally, I discuss supersymmetric HD theories: conformal supergravity, where the ghosts are also probably benign, and then an interesting supersymmetric HD gauge theory in 6 dimensions. It involves a dimensionless coupling constant, is renormalizable and rather beautiful. Unfortunately, it is not unitary --- ghosts are not benign there.", "url": "https://arxiv.org/abs/2611.34097", "type": "理论", "summary": "我们概述了包括拉格朗日高阶导数在内的动态系统的研究历史。故事始于 1744 年，当时欧拉出版了一本书，其中首次写出了 HD 系统的欧拉-拉格朗日微分方程。下一个重要的里程碑是 Ostrogradsky (1850) 以及 Pais 和 Uhlenbeck (1950) 的论文。上世纪下半叶写的许多文章都受到当时普遍存在的错误观念的影响——认为高阶导数必然会违反幺正性。今天我们了解到，情况并非如此，有许多系统存在良性幽灵，其中存在 HD，但不违反统一性。在这篇综述中，我们提出并讨论了此类（量子）机械系统和二维场论的几个例子。然后我们将简要讨论 4 维的高导数引力理论。在这种情况下，由于不存在非微扰哈密顿量，鬼魂是否良性的问题具有特殊地位，并且还没有明确的答案。\n\n然而，如果一个人将自己限制在经典理论中，那么我们可以说幽灵是良性的（良性的经典幽灵系统是一个需要无限时间才能到达奇点的系统，在普通引力和高清引力中似乎都是如此：宇宙审查猜想意味着奇点总是被视界包围，并且在遥远的观察者的时钟上需要无限的时间才能到达视界）。最后，我讨论超对称 HD 理论：共形超引力，其中幽灵也可能是良性的，然后是一个有趣的 6 维超对称 HD 规范理论。它涉及无量纲耦合常数，可重整化并且相当漂亮。不幸的是，它不是单一的——那里的鬼魂并不友善。", "authors": [{"name": "Andrei Smilga"}], "featured_authors": [{"name": "Andrei Smilga"}], "author_count": 1}, {"id": "2611.34129", "category": "hep-th", "title": "Reconstructing massive quivers on a defect circle", "abstract": "We study the kink and particle spectra for the massive $\\phi_{2,1}$-deformations of minimal models $\\mathcal M_{k+1,k+2}$ via truncated conformal space approach (TCSA) on a defect circle. The massive $\\phi_{2,1}$-deformation preserves a set of non-invertible symmetries, furnishing a fusion category $\\mathcal C_k\\simeq {\\rm SO}(3)_k$. These non-invertible symmetries are spontaneously broken, and thus label the vacua and organize the kinks and particles into their multiplets in terms of quiver diagrams. We employ a finite-volume truncated Hamiltonian approach on defect Hilbert spaces, $\\mathcal H_{X_i}$ for $X_i\\in\\mathcal C_k$, to study these quivers in the IR theories. The symmetry defect can then close an individual kink on a circle. We first establish the relation between states of definite fractional momentum on the defect circle and physical kink and particle states labelled by their vacuum pairs. Using form factors of local fields, we independently measure the squared amplitudes between the states of the two bases in defect TCSA. Combining these measurements with defect TCSA spectra, we reconstruct the quiver diagrams for $k=3,4,5$ without assuming them in advance. In particular, for $k=4$ we reconstruct the distinct quivers of the ordered and disordered phases. For $k=5$, we identify the quivers of both the light and heavy multiplets.", "url": "https://arxiv.org/abs/2611.34129", "type": "理论", "summary": "我们通过缺陷圆上的截断共形空间方法（TCSA）研究了最小模型 $\\mathcal M_{k+1,k+2}$ 的大规模 $\\phi_{2,1}$ 变形的扭结和粒子光谱。巨大的$\\phi_{2,1}$变形保留了一组不可逆对称性，提供了一个融合类别$\\mathcal C_k\\simeq {\\rm SO}(3)_k$。这些不可逆对称性自发破缺，因此标记了真空，并根据颤动图将扭结和粒子组织成多重态。我们在缺陷希尔伯特空间上采用有限体积截断哈密顿方法，$\\mathcal H_{X_i}$ for $X_i\\in\\mathcal C_k$，来研究 IR 理论中的这些颤动。然后，对称缺陷可以闭合圆上的单个扭结。我们首先建立缺陷圆上的确定分数动量状态与由真空对标记的物理扭结和粒子状态之间的关系。使用局部场的形状因子，我们独立测量缺陷 TCSA 中两个碱基状态之间的平方振幅。将这些测量结果与缺陷 TCSA 光谱相结合，我们重建了 $k=3,4,5$ 的颤动图，而无需提前假设。\n\n特别是，对于 $k=4$，我们重建了有序相和无序相的不同颤动。对于 $k=5$，我们识别出轻多重态和重多重态的颤动。", "authors": [{"name": "Ting-Kai Chen"}, {"name": "Jin Chen"}], "featured_authors": [{"name": "Ting-Kai Chen"}, {"name": "Jin Chen"}], "author_count": 2}, {"id": "2611.34369", "category": "hep-th", "title": "Robin--Hadamard states for unstable field in half-Minkowski spacetime", "abstract": "We investigate the quantization of a real massless scalar field in four-dimensional half-Minkowski spacetime subject to an attractive Robin boundary condition. We show that the unstable modes, required for classical spectral completeness, are also essential to recover the canonical commutation relations (CCR) of the complete quantum field. By specifying the Cauchy covariances of the unstable sector, we construct a family of positive quasifree states compatible with the conservation of total energy. Within this family, positivity is incompatible with stationarity, so that the resulting states necessarily break the time-translation symmetry of the background. We also obtain a closed position-space representation of the two-point function for the chosen stable vacuum sector, including the contribution fixed by the CCR in the unstable sector. The resulting expression exhibits the direct and reflected singularities, including Robin-dependent logarithmic terms. Since the remaining unstable contribution is smooth, all states in the constructed family share the same singularity structure, consistent with the Robin--Hadamard framework.", "url": "https://arxiv.org/abs/2611.34369", "type": "理论", "summary": "我们研究了四维半闵可夫斯基时空中真实无质量标量场的量子化，该场受到有吸引力的罗宾边界条件的影响。我们表明，经典光谱完整性所需的不稳定模式对于恢复完整量子场的正则交换关系（CCR）也至关重要。通过指定不稳定扇区的柯西协方差，我们构建了一个与总能量守恒相容的正准自由态族。在这个家族中，正性与平稳性是不相容的，因此所产生的状态必然会打破背景的时间平移对称性。我们还获得了所选稳定真空扇区的两点函数的闭合位置空间表示，包括 CCR 在不稳定扇区中固定的贡献。所得表达式展示了直接奇点和反射奇点，包括罗宾相关的对数项。由于剩余的不稳定贡献是平滑的，所构建的族中的所有状态都具有相同的奇点结构，与 Robin-Hadamard 框架一致。", "authors": [{"name": "Bruno S. Felipe"}, {"name": "João P. M. Pitelli"}, {"name": "Claudio Dappiaggi"}], "featured_authors": [{"name": "Bruno S. Felipe"}, {"name": "João P. M. Pitelli"}, {"name": "Claudio Dappiaggi"}], "author_count": 3}, {"id": "2611.34421", "category": "hep-th", "title": "Quark-Loop Corrections and Auxiliary Field-Strength Mixing in First-Order QCD", "abstract": "In the first-order formulation of Yang-Mills theory the gluon field strength is an independent auxiliary field $F$, and the only gluon self-interaction is a momentum-independent cubic vertex. We determine how quarks, which couple only to the gauge field, act on this structure. Their divergences are multiples of $f(A)\\cdot f(A)$, a term absent from the first-order Lagrangian that no rescaling can produce. Working with the background-field method in a general covariant gauge, we find that the quark sector is renormalized entirely by the mixing of the auxiliary field with the field strength known from pure Yang-Mills theory, $F_0=F+z\\,f(A)$, with quark coefficient $z=-\\alpha_sT_FN_f/(6\\pi\\bar\\epsilon)$, together with a rescaling of the gluon field and no rescaling of $F$, so that the renormalized auxiliary field runs into the gluon field strength. When a heavy quark of mass $M$ is integrated out, the same mixing survives as a finite threshold coefficient $c=(\\alpha_sT_F/6\\pi)\\ln(M^2/\\mu^2)$, whose scale dependence is exactly the heavy-quark share of the running, and the invariant combination of the couplings reproduces the decoupling of $\\alpha_s$. Below the threshold, when the leading power correction is kept as a gauge-sector operator, the auxiliary field is no longer the field strength: $F=f(A)+(g\\alpha_sT_F/15\\pi M^2)(D_\\alpha J_\\beta-D_\\beta J_\\alpha)$, with $J$ the light-quark colour current. We verify this identity against the full theory and show that it separates the long-distance gluon exchange, carried by $F$, from the short-distance heavy-quark effect, carried by a four-quark contact term.", "url": "https://arxiv.org/abs/2611.34421", "type": "理论", "summary": "在杨-米尔斯理论的一阶公式中，胶子场强是一个独立的辅助场$F$，唯一的胶子自相互作用是一个动量无关的立方顶点。我们确定仅与规范场耦合的夸克如何作用于该结构。它们的散度是 $f(A)\\cdot f(A)$ 的倍数，该项在一阶拉格朗日中不存在，无法进行重新缩放。使用一般协变规范中的背景场方法，我们发现夸克扇区完全通过将辅助场与纯杨米尔斯理论中已知的场强$F_0=F+z\\,f(A)$混合来重正化，夸克系数$z=-\\alpha_sT_FN_f/(6\\pi\\bar\\epsilon)$，同时重新调整胶子场，并且不重新调整$F$，使重整化的辅助场达到胶子场强。当质量为 $M$ 的重夸克被积分出来时，相同的混合作为有限阈值系数 $c=(\\alpha_sT_F/6\\pi)\\ln(M^2/\\mu^2)$ 存在，其尺度依赖性正是运行中的重夸克份额，并且耦合的不变组合再现了 $\\alpha_s$ 的解耦。\n\n在阈值以下，当主功率校正保持为规范扇区算子时，辅助场不再是场强：$F=f(A)+(g\\alpha_sT_F/15\\pi M^2)(D_\\alpha J_\\beta-D_\\beta J_\\alpha)$，$J$为光夸克色流。我们根据完整的理论验证了这一恒等式，并表明它将 $F$ 所承载的长距离胶子交换与四夸克接触项所承载的短距离重夸克效应分开。", "authors": [{"name": "Hasnat Mohammad Nayeem"}], "featured_authors": [{"name": "Hasnat Mohammad Nayeem"}], "author_count": 1}, {"id": "2611.34444", "category": "hep-th", "title": "Black hole entropy from angular holonomies of Sine-Gordon soliton lattices in AdS$_3$", "abstract": "We construct boundary conditions for AdS$_3$ gravity that realize Sine-Gordon dynamics. For a periodic soliton lattice at fixed winding, we relate the angular holonomy to the exact acoustic dispersion by continuing the Bloch momentum through the zero-frequency band edge associated with rigid translation of the lattice. For suitable embedding angles, the stable vacuum has a regular BTZ geometry. When only one chiral sector carries winding, we construct a family whose asymptotic region extends to a BTZ black hole. As the spectral parameter of the winding sector tends to the corresponding band edge, the black hole approaches extremality. The leading correction to the extremal entropy is linear in the Hawking temperature defined with respect to laboratory time, with a coefficient inversely proportional to the sound velocity of the lattice. The same inverse-velocity dependence appears in the low-temperature entropy of one-dimensional quantum fluids.", "url": "https://arxiv.org/abs/2611.34444", "type": "理论", "summary": "我们构建了实现 Sine-Gordon 动力学的 AdS$_3$ 重力的边界条件。对于固定缠绕的周期性孤子晶格，我们通过将布洛赫动量延续到与晶格刚性平移相关的零频带边缘，将角度完整与精确的声色散联系起来。为了获得合适的嵌入角度，稳定的真空具有规则的 BTZ 几何形状。当只有一个手性扇区带有缠绕时，我们构建了一个族，其渐近区域延伸到 BTZ 黑洞。当缠绕扇区的光谱参数趋于相应的带边缘时，黑洞接近极值。对极值熵的主要修正在相对于实验室时间定义的霍金温度中是线性的，其系数与晶格的声速成反比。同样的反速度依赖性也出现在一维量子流体的低温熵中。", "authors": [{"name": "Marcela Cárdenas"}, {"name": "Francisco Correa"}, {"name": "Nicolás Salazar"}], "featured_authors": [{"name": "Marcela Cárdenas"}, {"name": "Francisco Correa"}, {"name": "Nicolás Salazar"}], "author_count": 3}, {"id": "2611.34487", "category": "hep-th", "title": "Superconformal Index Identities for Dual Gauge Theories", "abstract": "We study superconformal index identities for three classes of dual four-dimensional gauge theories. For $\\mathcal N=4$ super-Yang--Mills theory with gauge groups $SO(2n+1)$ and $USp(2n)$, we prove at every rank the equality of flavored Schur indices predicted by $S$-duality, using Rains's diagonal trace transformation. For Kutasov--Schwimmer duality with adjoint superpotential $\\textrm{Tr} X^{k+1}$, we prove the index identity between $SU(k+1)$ and $SU(k-1)$ with two flavors at independent elliptic nomes $p,q$, in the ultraviolet assignment $R(Q)=0$. On the locus $p=q^k$, we reduce the identity to that of ordinary supersymmetric QCD whenever the specialized expressions are generically regular. Finally, we test the dualities conjectured by Cho and Song between quiver and single-group descriptions of four families of Argyres--Douglas theories. For the rank-one $H_1$ theory we prove equality of the two full flavored indices, and for each family at arbitrary rank we evaluate the generalized Coulomb index in both descriptions, obtaining the product formula conjectured by Buican and Jiang.", "url": "https://arxiv.org/abs/2611.34487", "type": "理论", "summary": "我们研究三类对偶四维规范理论的超共形指数恒等式。对于 $\\mathcal N=4$ super-Yang--Mills 理论以及规范组 $SO(2n+1)$ 和 $USp(2n)$，我们使用 Rains 的对角迹变换，在每个等级上证明了由 $S$ 对偶性预测的风味 Schur 指数的相等性。对于具有伴随超势 $\\textrm{Tr} X^{k+1}$ 的 Kutasov--Schwimmer 对偶性，我们证明了 $SU(k+1)$ 和 $SU(k-1)$ 之间的指数恒等式，在紫外赋值 $R(Q)=0$ 中，在独立椭圆节点 $p,q$ 处具有两种风格。在轨迹 $p=q^k$ 上，只要特殊表达式是一般正则的，我们就将恒等式简化为普通超对称 QCD 的恒等式。最后，我们检验了 Cho 和 Song 在阿吉尔斯-道格拉斯理论的四个家族的颤动描述和单群描述之间的对偶性猜想。对于一阶 $H_1$ 理论，我们证明了两个全风味指数的相等性，并且对于任意等级的每个族，我们评估两种描述中的广义库仑指数，获得 Buican 和 Jiang 猜想的乘积公式。", "authors": [{"name": "Min-xin Huang"}, {"name": "Gao-fu Ren"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Min-xin Huang"}, {"name": "Gao-fu Ren"}, {"name": "Xin Wang"}], "author_count": 3}, {"id": "2611.34588", "category": "hep-th", "title": "Power-law tunneling in the Razavy hyperbolic double well: Heun connection formulas and their resonances", "abstract": "We study nonperturbative level splitting in the symmetric Razavy hyperbolic double well, relating its double-confluent Heun connection problem to exact WKB and quasi-exact solvability. In the weak-coupling limit the wells separate logarithmically and approach two Morse systems. Reflection factorizes the two-ended spectral condition into separate even and odd quantization conditions. For each normalizable Morse level with noninteger decay exponent, the irregular-block connection formula yields the leading splitting with its full gamma-function coefficient, two analytic fluctuation corrections, and the leading logarithmic three-traversal contribution. The noninteger power of the coupling follows from the logarithmic growth of the barrier action. We express the classical periods in terms of complete elliptic integrals and derive the first quantum-period correction. At integer exponent, a convergent reduction onto the two resonant Floquet modes resolves the singular fixed-order expansion into two local spectral branches and reproduces the known finite-spin tunneling gap.", "url": "https://arxiv.org/abs/2611.34588", "type": "理论", "summary": "我们研究了对称 Razavy 双曲双阱中的非微扰能级分裂，将其双汇合 Heun 连接问题与精确 WKB 和准精确可解性联系起来。在弱耦合极限下，井对数分离并接近两个莫尔斯系统。反射将两端频谱条件分解为单独的偶数和奇数量化条件。对于具有非整数衰减指数的每个可归一化莫尔斯电平，不规则块连接公式产生具有完整伽玛函数系数的主导分裂、两个分析波动校正以及主导对数三遍历贡献。耦合的非整数幂来自势垒作用的对数增长。我们用完全椭圆积分来表达经典周期，并推导出第一个量子周期修正。在整数指数处，两个共振 Floquet 模式的收敛约简将奇异固定阶展开分解为两个局部谱分支，并再现已知的有限自旋隧道间隙。", "authors": [{"name": "Jie Ren"}, {"name": "Xuanzhuang Wu"}], "featured_authors": [{"name": "Jie Ren"}, {"name": "Xuanzhuang Wu"}], "author_count": 2}, {"id": "2611.34619", "category": "hep-th", "title": "The all-loop spectrum of GGK strings", "abstract": "We study the non-perturbative spectrum of the non-relativistic limit of string theory in AdS$_5\\times$S$^5$, also known as GGK theory. In light-cone gauge, we show that the bosonic spectrum on a number of vacua is described at all-loops by free massive and massless scalar fields in AdS$_2$, confirming a conjecture by de Leeuw, Fontanella and Nieto-García, arXiv:2403.09563 . In static gauge, we obtain the same result for any classical string vacuum, and including fermions. We compute the quantum correction to the classical energy, and show that it vanishes once we adopt the regularised Hurwitz series. We conclude that the quantum energy spectrum built upon any GGK string consists solely of its classical vacuum energy.", "url": "https://arxiv.org/abs/2611.34619", "type": "理论", "summary": "我们研究AdS$_5\\times$S$^5$中弦论非相对论极限的非微扰谱，也称为GGK理论。在光锥规中，我们表明，许多真空上的玻色子谱在所有环路中由 AdS$_2$ 中的自由质量和无质量标量场描述，证实了 de Leeuw、Fontanella 和 Nieto-García 的猜想，arXiv:2403.09563。在静态规范中，我们对任何经典弦真空（包括费米子）都获得了相同的结果。我们计算了经典能量的量子校正，并表明一旦我们采用正则化的赫维茨级数，它就会消失。我们得出的结论是，建立在任何 GGK 弦上的量子能谱仅由其经典真空能量组成。", "authors": [{"name": "Marius de Leeuw"}, {"name": "Andrea Fontanella"}, {"name": "Cameron Gibson"}, {"name": "Juan Miguel Nieto García"}], "featured_authors": [{"name": "Marius de Leeuw"}, {"name": "Andrea Fontanella"}, {"name": "Cameron Gibson"}, {"name": "Juan Miguel Nieto García"}], "author_count": 4}, {"id": "2611.34705", "category": "hep-th", "title": "Interfaces in Long Range CFT$_1$", "abstract": "We consider interfaces in the theory of a single free scalar in AdS$_2$ defined by adding relevant operators along portions of the boundary. We begin with Neumann/Dirichlet interfaces, computing the associated scaling dimension and $g$-factor ratio; we also explain how arbitrary interface correlators can be computed numerically efficiently. Then we move on to interfaces between generalized free field and long-range interacting theories such as long range Ising, determining many quantities in perturbation theory. Finally we setup a bootstrap problem for four-point interface correlator. We use this to find tight bounds on the $g$-factor ratio as a function of the interface scaling dimension.", "url": "https://arxiv.org/abs/2611.34705", "type": "理论", "summary": "我们考虑 AdS$_2$ 中单个自由标量理论中的接口，通过沿边界的部分添加相关运算符来定义。我们从 Neumann/Dirichlet 接口开始，计算相关的缩放维数和 $g$ 因子比率；我们还解释了如何有效地数值计算任意界面相关器。然后我们继续讨论广义自由场和长程相互作用理论（例如长程伊辛）之间的接口，确定微扰理论中的许多量。最后我们设置了四点接口相关器的引导问题。我们用它来找到 $g$ 因子比率的严格界限，作为界面缩放维度的函数。", "authors": [{"name": "Bastien Girault"}, {"name": "Miguel F. Paulos"}], "featured_authors": [{"name": "Bastien Girault"}, {"name": "Miguel F. Paulos"}], "author_count": 2}, {"id": "2611.34706", "category": "hep-th", "title": "Entanglement and HBAR entropy in a Lorentzian non-commutative black hole", "abstract": "We investigate how Lorentzian non-commutative smearing affects entanglement and horizon brightened acceleration radiation (HBAR) outside a black hole. For a massless scalar field, tracing over the interior partner gives the exterior quantum channel, its logarithmic negativity, mutual information, and Bell entanglement fidelity. At fixed mass and Killing frequency, increasing the smearing lowers the surface gravity, increases the accessible correlations, and suppresses the leading atomic emission probability. The horizon displacement begins at order $\\sqrt{\\Theta}$, while the thermal correction at infinity begins at order $\\Theta$. At fixed local frequency, the redshift introduces a term of order $\\sqrt{\\Theta}$ at fixed areal radius. Holding the proper distance fixed, it cancels this term and recovers the common Rindler response close to the horizon. For a freely falling atom, emission and absorption obey detailed balance at the Hawking temperature in the leading horizon approximation. Random atomic injection drives the selected mode from the vacuum to a thermal state with an exact relaxation law and nonnegative entropy production. Near equilibrium, we obtain $\\dot S_{\\rm HBAR}\\simeq\\dot A_p/4$ when the radiated energy is drawn from horizon heat, where $\\dot A_p$ is the positive radiative area loss. When the radiation is assigned to ADM mass loss at fixed smearing length $\\ell=4\\sqrt{\\Theta/\\pi}$, the result is $\\dot S_{\\rm HBAR}\\simeq\\dot A_p/[4(1-\\ell/r_+)]$. The mass dependence of the exterior source thus enters the entropy per unit area lost at order $\\sqrt{\\Theta}$.", "url": "https://arxiv.org/abs/2611.34706", "type": "理论", "summary": "我们研究洛伦兹非交换弥散如何影响黑洞外的纠缠和地平线增亮加速辐射（HBAR）。对于无质量标量场，追踪内部伙伴给出了外部量子通道、其对数负性、互信息和贝尔纠缠保真度。在固定质量和杀伤频率下，增加涂抹会降低表面重力，增加可访问的相关性，并抑制领先的原子发射概率。地平线位移从 $\\sqrt{\\Theta}$ 阶开始，而无穷远的热校正从 $\\Theta$ 阶开始。在固定的局部频率下，红移在固定的面半径处引入了 $\\sqrt{\\Theta}$ 阶项。保持适当的距离固定，它会取消此项并恢复接近地平线的常见 Rindler 响应。对于自由落体原子，发射和吸收在前视界近似中的霍金温度下遵循详细平衡。随机原子注入将选定的模式从真空驱动到具有精确弛豫定律和非负熵产生的热状态。\n\n接近平衡时，当辐射能量来自地平线热量时，我们得到 $\\dot S_{\\rm HBAR}\\simeq\\dot A_p/4$，其中 $\\dot A_p$ 是正辐射面积损失。当辐射分配给固定涂抹长度 $\\ell=4\\sqrt{\\Theta/\\pi}$ 的 ADM 质量损失时，结果为 $\\dot S_{\\rm HBAR}\\simeq\\dot A_p/[4(1-\\ell/r_+)]$。因此，外部源​​的质量依赖性输入单位面积损失的熵$\\sqrt{\\Theta}$。", "authors": [{"name": "A. A. Araújo Filho"}, {"name": "N. Heidari"}, {"name": "P. H. M. Barros"}, {"name": "V. B. Bezerra"}, {"name": "A. R. Queiroz"}, {"name": "A. F. Santos"}, {"name": "Ali Övgün"}], "featured_authors": [{"name": "A. A. Araújo Filho"}, {"name": "N. Heidari"}, {"name": "P. H. M. Barros"}, {"name": "A. R. Queiroz"}, {"name": "A. F. Santos"}, {"name": "Ali Övgün"}], "author_count": 7}, {"id": "2611.34715", "category": "hep-th", "title": "Rényi multi-entropy from Riemann surfaces", "abstract": "We compute vacuum tripartite Rényi multi-entropy in a two-dimensional compact-boson conformal field theory (CFT). For every integer Rényi index $n\\geq2$, we evaluate the partition function on the replica Riemann surface for disjoint intervals, obtaining the twist four-point function in terms of a ratio of theta functions. An independent calculation of the partition function on a Fermat curve yields the adjacent three-point coefficient. In the fusion limit, the Riemann surface for disjoint intervals degenerates into two Fermat curves, and the residue of the four-point function reproduces the squared three-point coefficient, as required by the operator product expansion. The genuine multi-entropy therefore approaches twice its strictly adjacent value. The CFT predictions agree with lattice calculations for the critical XXZ and Ising spin chains and a harmonic chain. We also exhibit a unitary CFT in which the canonical replica construction yields complex Rényi multi-entropy.", "url": "https://arxiv.org/abs/2611.34715", "type": "理论", "summary": "我们在二维紧致玻色子共形场论 (CFT) 中计算真空三方 Rényi 多熵。对于每个整数 Rényi 索引 $n\\geq2$，我们评估复制黎曼曲面上不相交区间的配分函数，根据 theta 函数的比率获得扭曲四点函数。费马曲线上的配分函数的独立计算产生相邻的三点系数。在融合极限下，不相交区间的黎曼曲面退化为两条费马曲线，并且四点函数的留数再现了三点系数的平方，按照算子乘积展开的要求。因此，真正的多熵接近其严格相邻值的两倍。 CFT 预测与临界 XXZ 和伊辛自旋链以及谐波链的晶格计算一致。我们还展示了一个单一的 CFT，其中规范的复制结构产生复杂的 Rényi 多熵。", "authors": [{"name": "Kenya Tasuki"}], "featured_authors": [{"name": "Kenya Tasuki"}], "author_count": 1}, {"id": "2611.34791", "category": "hep-th", "title": "Logarithmic scalar soft factorization from matching conditions", "abstract": "Logarithmic soft theorems in QED and gravity can be understood as conservation laws associated with asymptotic symmetries. In contrast, for a massless scalar, no gauge symmetry is available to organize this relation. Despite that, we show that the logarithmic soft factorization for a massless scalar coupled to massive fermions through a Yukawa interaction follows from the asymptotic field equations and matching conditions at spatial infinity. From the first subleading logarithmic fall-off, we construct a conserved surface integral whose boundary values satisfy the antipodal map between past and future null infinity. At future null infinity, the field equations relate this quantity to the $1/u$ tail of the scalar radiation, while at past null infinity, for scattering states without incoming scalar radiation, it is carried by a non-radiative logarithm of the incoming particles. We derive the classical tail from the particle trajectories and obtain the hard charge from the asymptotic Dirac current. The particular solution of the leading scalar field gives the classical contribution, while its homogeneous component gives the quantum contribution. The resulting Ward identity reproduces the logarithmic soft coefficient of the one-loop scalar emission (up to a zero mode on the sphere), including its classical and quantum parts.", "url": "https://arxiv.org/abs/2611.34791", "type": "理论", "summary": "QED 和引力中的对数软定理可以理解为与渐近对称性相关的守恒定律。相反，对于无质量标量，没有规范对称性可以用来组织这种关系。尽管如此，我们表明，通过汤川相互作用耦合到大质量费米子的无质量标量的对数软分解遵循空间无穷远的渐近场方程和匹配条件。从第一个次领先对数衰减开始，我们构造了一个守恒表面积分，其边界值满足过去和未来零无穷大之间的对映图。在未来的零无穷远，场方程将该量与标量辐射的 $1/u$ 尾部联系起来，而在过去的零无穷远，对于没有传入标量辐射的散射状态，它由传入粒子的非辐射对数承载。我们从粒子轨迹中推导出经典尾部，并从渐近狄拉克电流中获得硬电荷。前导标量场的特定解给出了经典贡献，而其齐次分量给出了量子贡献。\n\n由此产生的沃德恒等式再现了单环标量发射的对数软系数（直到球体上的零模式），包括其经典部分和量子部分。", "authors": [{"name": "Matías Briceño"}, {"name": "Hernán A. González"}, {"name": "Oriana Labrin"}], "featured_authors": [{"name": "Matías Briceño"}, {"name": "Hernán A. González"}, {"name": "Oriana Labrin"}], "author_count": 3}, {"id": "2611.34824", "category": "hep-th", "title": "A Pole-Cut Formula for Holographic Extremal Correlators", "abstract": "We show that the holographic spectral function of a neutral massless scalar on the extremal Reissner-Nordstrom black brane in $AdS_5$ admits an elegant formula in terms of the quasi-normal modes (QNMs) and branch-cut data. In the extremal case, the spectral data comprises the zeros of the boundary source function, i.e. the QNMs, as well as its phase discontinuity across the branch cut on the negative imaginary axis of the complex frequency plane. This formula neatly factorizes into an infinite product over the QNM poles and a factor encoding the branch cut discontinuity. We derive this pole-cut formula as the zero-temperature limit of the QNM product formula for holographic thermal correlators, with the branch-cut contribution arising from the coalescence of the QNMs on the negative imaginary axis. We also clarify the role of the near-horizon $AdS_2$ region in this context. Consistency with the OPE of the boundary correlator provides extremal sum-rules involving both the QNMs as well as the phase discontinuity function. We also find that this holographic consistency forces the asymptotic form of the QNMs to be related to the asymptotics of the phase discontinuity function. We verify our formula and these OPE constraints numerically. We also demonstrate that, in the time domain, the pole and cut factors each produce complex-time singularities, whose location is determined by the optical distance between the boundary and the black-brane singularity. We expect the pole-cut factorization structure of spectral functions to hold for more general fluctuations of extremal black branes.", "url": "https://arxiv.org/abs/2611.34824", "type": "理论", "summary": "我们证明，$AdS_5$ 中极值 Reissner-Nordstrom 黑膜上的中性无质量标量的全息谱函数在准正规模 (QNM) 和分支切割数据方面承认一个优雅的公式。在极值情况下，频谱数据包括边界源函数（即 QNM）的零点，以及其在复频率平面负虚轴上的分支切割上的相位不连续性。该公式巧妙地分解为 QNM 极点上的无限乘积和编码分支切割不连续性的因子。我们推导出这个极切公式作为全息热相关器 QNM 乘积公式的零温度极限，其中分支切贡献来自 QNM 在负虚轴上的合并。我们还阐明了近地平线 $AdS_2$ 区域在这种情况下的作用。与边界相关器的 OPE 的一致性提供了涉及 QNM 以及相位不连续函数的极值和规则。我们还发现，这种全息一致性迫使 QNM 的渐近形式与相位不连续函数的渐近相关。\n\n我们用数字验证我们的公式和这些 OPE 约束。我们还证明，在时域中，极点因子和切割因子各自产生复时间奇点，其位置由边界和黑膜奇点之间的光学距离决定。我们期望谱函数的极点分解结构能够适用于极值黑膜的更一般的波动。", "authors": [{"name": "Jyotirmoy Bhattacharya"}, {"name": "Amiya Mishra"}, {"name": "Aditya Sharma"}, {"name": "Sourav Singha"}], "featured_authors": [{"name": "Jyotirmoy Bhattacharya"}, {"name": "Amiya Mishra"}, {"name": "Aditya Sharma"}, {"name": "Sourav Singha"}], "author_count": 4}, {"id": "2611.34829", "category": "hep-th", "title": "Character expansion of the Itzykson-Zuber pair correlator", "abstract": "We revisit a long-standing problem of correlation functions with the Harish-Chandra-Itzykson-Zuber measure. The immediate goal is to reproduce the long-known answer for pair correlator in the form of character expansion - a sum over Schur polynomials with carefully adjusted coefficients. The infinite sum can be folded up into exponentials with the help of the Cauchy identity. What matters are the coefficients, which we express in terms of projectors, made from Cherednik operators. Development of character expansion methods for unitary integrals, which are much more difficult than the Hermitian ones, gives a hope for further generalizations - up to arbitrary correlators with non-trivial measures.", "url": "https://arxiv.org/abs/2611.34829", "type": "理论", "summary": "我们使用 Harish-Chandra-Itzykson-Zuber 测度重新审视长期存在的相关函数问题。近期目标是以字符扩展的形式重现对相关器的长期已知答案 - 具有仔细调整系数的 Schur 多项式的总和。借助柯西恒等式，无限和可以折叠成指数。重要的是系数，我们用投影仪表示，由 Cherednik 算子生成。酉积分的特征展开方法的开发比厄米特方法困难得多，这给进一步推广带来了希望——直到具有非平凡测度的任意相关器。", "authors": [{"name": "Alexei Morozov"}, {"name": "Hasib Sifat"}], "featured_authors": [{"name": "Alexei Morozov"}, {"name": "Hasib Sifat"}], "author_count": 2}, {"id": "2611.34886", "category": "hep-th", "title": "Time-weighted energy correlators are infrared unsafe in gauge theories", "abstract": "Energy correlators are infrared safe because each detector weights a parton by its energy, but a weight in the arrival time makes them infrared unsafe in gauge theories. For the state created by a scalar operator that makes two partons at lowest order in a weakly coupled conformal gauge theory, we show that the correlator of two time-weighted energy detectors (the light-ray operators $\\int\\!du\\,u\\,T_{uu}$) at separated directions diverges at two loops like the logarithm of the time window. The logarithm does not come from a single soft gluon, but from a soft parton pair with comparable energies, one parton in each detector; its coefficient is a closed-form function of the angle for any matter content. In $N=4$ super Yang-Mills theory, we recover this coefficient from the two-gluon Regge term of the known four-point function and derive a simple relation to the logarithm in the charge correlator. In the planar theory the leading logarithms resum to a power of the window, set by the BFKL intercept.", "url": "https://arxiv.org/abs/2611.34886", "type": "理论", "summary": "能量相关器是红外安全的，因为每个探测器都根据其能量对部分子进行加权，但到达时间的权重使它们在规范理论中对红外不安全。对于弱耦合共形规范理论中使两个部分子处于最低阶的标量算子创建的状态，我们证明了两个时间加权能量探测器（光线算子 $\\int\\!du\\,u\\,T_{uu}$）在不同方向上的相关器在两个环路处发散，就像时间窗口的对数一样。对数不是来自单个软胶子，而是来自具有相当能量的软部分子对，每个探测器中有一个部分子；它的系数是任何物质含量的角度的封闭函数。在 $N=4$ super Yang-Mills 理论中，我们从已知四点函数的二胶子 Regge 项中恢复该系数，并推导出与电荷相关器中对数的简单关系。在平面理论中，主导对数恢复为由 BFKL 截距设置的窗口幂。", "authors": [{"name": "Siqing Yu"}], "featured_authors": [{"name": "Siqing Yu"}], "author_count": 1}, {"id": "2611.34892", "category": "hep-th", "title": "Massive Triangle in Cosmological Correlator beyond Conformal Coupling", "abstract": "A massive scalar coupled in pairs to the inflaton generates a one-loop primordial bispectrum whose mass corrections at generic momenta have lacked closed analytic expressions beyond conformal coupling. We obtain two leading mass corrections at arbitrary external momenta in terms of multiple polylogarithms of uniform weights three and four. Auxiliary-energy dressings preserve rational time integrals, revealing unexpected simplicity despite elliptic intermediate geometry. Independent full-loop evaluations, including blinded predictions, validate the closed forms. We also determine a subleading light-field singularity and recover the heavy-mass effective theory.", "url": "https://arxiv.org/abs/2611.34892", "type": "理论", "summary": "与暴胀子成对耦合的大标量会生成单环原初双谱，其在一般动量下的质量修正缺乏共形耦合之外的封闭解析表达式。我们根据均匀权重三和四的多个多对数获得任意外部动量的两个主要质量校正。辅助能量敷料保留了合理的时间积分，尽管中间几何形状是椭圆形的，但仍显示出意想不到的简单性。独立的全循环评估（包括盲法预测）验证了封闭形式。我们还确定了次主导光场奇点并恢复了重质量有效理论。", "authors": [{"name": "Taushif Ahmed"}, {"name": "Syed Mehedi Hasan"}], "featured_authors": [{"name": "Taushif Ahmed"}, {"name": "Syed Mehedi Hasan"}], "author_count": 2}, {"id": "2611.34922", "category": "hep-th", "title": "Vacuum correlation measures as CFT partition functions", "abstract": "We show that in any $d$-dimensional CFT, the vacuum sandwiched Rényi mutual information (SRMI) of integer order $n$ between two disjoint balls maps to a CFT partition function on a manifold of topology $\\#^{n-1}(S^1 \\times S^{d-1})$, with moduli fixed by the ball configuration and single-ball modular flow. At $n=2$, it is given by the thermal partition function on $S^{d-1}$, upper-bounding the von Neumann mutual information. For $n>2$, SRMI diverges at finite separation due to a hot-spot limit of the partition function. Explicit CFT evaluations agree well with density matrix computations.", "url": "https://arxiv.org/abs/2611.34922", "type": "理论", "summary": "我们证明，在任何 $d$ 维 CFT 中，两个不相交球之间整数阶 $n$ 的真空夹层 Rényi 互信息 (SRMI) 映射到拓扑流形 $\\#^{n-1}(S^1 \\times S^{d-1})$ 上的 CFT 配分函数，模数由球配置和单球模流固定。当 $n=2$ 时，它由 $S^{d-1}$ 上的热分配函数给出，是冯·诺依曼互信息的上限。对于 $n>2$，由于配分函数的热点限制，SRMI 在有限间隔处发散。显式 CFT 评估与密度矩阵计算非常一致。", "authors": [{"name": "Hewei Frederic Jia"}], "featured_authors": [{"name": "Hewei Frederic Jia"}], "author_count": 1}, {"id": "2611.34924", "category": "hep-th", "title": "An algebraic quantization of gravity from the null cone", "abstract": "We propose a background independent quantization of vacuum general relativity on four dimensional Lorentzian spacetimes. Starting from first order gravity, we solve the gravitational constraints on intersecting null cones of a bulk subregion and obtain the reduced phase space at finite $G_N$. We promote its canonical Poisson brackets to commutation relations and use deformations of the reduced action to define an algebra of observables. Eq
