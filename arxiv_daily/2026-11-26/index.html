  <style>
    :root {

      padding: 30px;
      border: 1px solid var(--line);

    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }

  <script>
    const papers = [{"id": "2611.33274", "category": "cond-mat", "title": "Theory of Anomalous Diffusion and Superdiffusion in Integrable Spin Chains", "abstract": "Integrable systems can exhibit diffusive or Kardar--Parisi--Zhang (KPZ) scaling in two-point correlations even when their current full counting statistics (FCS) differ from those usually associated with these universality classes. We explain this separation using a multispecies particle gas that preserves the scattering structure of integrable spin chains. For anisotropy $\\Delta>1$, large particles are advected by a mobile bath. The resulting FCS has a Gaussian-mixture form and approaches the M-Wright distribution at late times, with finite-time rounding due to mobile species. At the isotropic point $\\Delta=1$, all particles are mobile, and the charge transfer by large particles is discrete. A self-consistent Poisson distribution describes the FCS, with a nearly Gaussian bulk and model-dependent, non-Gaussian tails. By contrast, two-point correlations follow from the statistics of a large tracer particle. For $\\Delta>1$, it undergoes Brownian motion, yielding Gaussian spreading. At $\\Delta=1$, we provide evidence from fluctuating hydrodynamics for the emergence of the KPZ Prähofer--Spohn scaling function in dynamical correlations and trace it to the finite coupling of the largest particles to a continuum of slower ones, with long-ranged velocity fluctuations. Our framework shows how universal dynamical two-point correlations coexist with distinct model-dependent current statistics.", "url": "https://arxiv.org/abs/2611.33274", "type": "理论", "summary": "即使可积系统当前的完整计数统计量 (FCS) 与通常与这些普遍性类别相关的统计量不同，但可积系统仍可以在两点相关性中表现出扩散或卡达尔-帕里西-张 (KPZ) 标度。我们使用多物种粒子气体来解释这种分离，该气体保留了可积自旋链的散射结构。对于各向异性 $\\Delta>1$，大颗粒由移动浴平流输送。由此产生的 FCS 具有高斯混合形式，并在后期接近 M-Wright 分布，由于移动物种而具有有限时间舍入。在各向同性点 $\\Delta=1$ 处，所有粒子都是可移动的，大粒子的电荷转移是离散的。自洽泊松分布描述了 FCS，具有接近高斯的体积和依赖于模型的非高斯尾部。相比之下，两点相关性是根据大示踪粒子的统计数据得出的。对于 $\\Delta>1$，它经历布朗运动，产生高斯扩展。\n\n在 $\\Delta=1$ 处，我们从脉动流体动力学中证明了动态关联中 KPZ Prähofer-Spohn 标度函数的出现，并将其追溯到最大粒子与较慢粒子连续体的有限耦合，并具有长程速度波动。我们的框架展示了通用动态两点相关性如何与不同的依赖于模型的当前统计数据共存。", "authors": [{"name": "Jitendra Kethepalli"}, {"name": "Andrew Urilyon"}, {"name": "Jacopo De Nardis"}], "featured_authors": [{"name": "Jitendra Kethepalli"}, {"name": "Andrew Urilyon"}, {"name": "Jacopo De Nardis"}], "author_count": 3}, {"id": "2611.33286", "category": "cond-mat", "title": "Pairing from anti-Hund's coupling under infinite Hubbard repulsion", "abstract": "Electron-phonon coupling is a natural source of superconductivity, but in strongly correlated materials the phonon-mediated interaction is often much weaker than the on-site Hubbard repulsion $U$. Whether, and how, it can still produce pairing when $U$ dominates is a basic open question. We address this question by studying a minimal model with an anti-Hund's coupling $J_A$: an on-site spin exchange between two orbitals or two valleys, mediated by optical phonons, that favors a local inter-orbital spin singlet. In the limit $U=+\\infty$, the two-orbital Hubbard model on the triangular lattice, doped away from the insulator at $n=2$ electrons per site, reduces to a four-flavor $t$-$J_A$ model. Density-matrix renormalization group calculations find robust pairing throughout $1\\le J_A/|t|\\le10$, with the largest pairing gap at $J_A\\sim|t|$. The Cooper pairs reside on bonds and do not come from a direct attraction provided by $J_A$, since infinite $U$ excludes on-site pairs from the Hilbert space. For $J_A\\gg|t|$, the normal state is a second Fermi liquid whose small Fermi surface violates the perturbative Luttinger theorem, and a strong-coupling expansion in $t/J_A$ provides a controlled effective theory of superconductivity from this unconventional metal. Our results provide strong evidence for a strongly coupled superconductor beyond BCS theory, driven by the interplay of the kinetic energy, the phonon-mediated anti-Hund's coupling, and the strong Hubbard $U$. Finally, we discuss possible applications to magic-angle twisted bilayer graphene.", "url": "https://arxiv.org/abs/2611.33286", "type": "理论+数值", "summary": "电子声子耦合是超导性的天然来源，但在强相关材料中，声子介导的相互作用通常比现场哈伯德斥力 $U$ 弱得多。当 $U$ 占主导地位时，它是否以及如何仍然能够产生配对是一个基本的悬而未决的问题。我们通过研究具有反洪德耦合 $J_A$ 的最小模型来解决这个问题：两个轨道或两个谷之间的现场自旋交换，由光学声子介导，有利于局部轨道间自旋单线态。在极限 $U=+\\infty$ 下，三角晶格上的双轨道哈伯德模型，以每个位点 $n=2$ 个电子远离绝缘体进行掺杂，简化为四味 $t$-$J_A$ 模型。密度矩阵重整化群计算在 $1\\le J_A/|t|\\le10$ 中找到了稳健的配对，其中最大的配对间隙在 $J_A\\sim|t|$ 处。库珀对存在于债券上，并非来自 $J_A$ 提供的直接吸引力，因为无限 $U$ 将现场对排除在希尔伯特空间之外。\n\n对于$J_A\\gg|t|$，正常态是第二费米液体，其小费米表面违反了微扰卢廷格定理，并且$t/J_A$中的强耦合展开提供了这种非常规金属的受控有效超导理论。我们的结果为超越 BCS 理论的强耦合超导体提供了强有力的证据，该超导体是由动能、声子介导的反洪德耦合和强哈伯德 $U$ 相互作用驱动的。最后，我们讨论了魔角扭曲双层石墨烯的可能应用。", "authors": [{"name": "Donggyu Kim"}, {"name": "Ya-Hui Zhang"}], "featured_authors": [{"name": "Donggyu Kim"}, {"name": "Ya-Hui Zhang"}], "author_count": 2}, {"id": "2611.33338", "category": "cond-mat", "title": "On the binding and stability of CeO2 molecules on low-index Au surfaces", "abstract": "Many multi-phase thin films grown by self-assembly involve co-deposition of both metallic and oxide phases that grow into the same film. Under such conditions, the oxide species may be present in stoichiometric molecular form on the surface of the metallic phase. Quantifying the stability, binding, and diffusion of such molecular oxide states on metallic surfaces is critical for understanding self-assembly. In this work, we investigate the binding and stability of CeO2 molecules on Au surfaces using spin-polarized density functional theory calculations. Specifically, we examine how the configuration of the CeO2 molecule, its binding energy and binding free energy, structural stability, effective charge, and projected electronic density of states vary among various binding sites on Au(001), Au(110), and Au(111) surfaces. Molecular CeO2 was found to be more favorable on all Au surfaces than its atomic constituents. It was also found that the bent CeO2 molecule configuration is more stable than the linear counterpart, with the Ce atom on the hollow site and the O atoms on the top sites. In addition, the configurations of the CeO2 molecule on Au surfaces with a binding energy around or weaker than -1 eV were found to have a low probability of existence above room temperature. Furthermore, the charge transfer was found to occur in such a way that the CeO2 molecule becomes polarized on all surfaces, but the polarization is stronger only for the strongly bonded states on Au(001) and Au(110) surfaces. Finally, three different cases of how the CeO2 molecule binds to Au(001), Au(110), and Au(111) were identified: case 1: chemisorption with symmetric bonds, case 2: chemisorption with asymmetric bonds, and case 3: physisorption with symmetric bonds. These three cases of CeO2 binding are present on Au(001) and Au(110), but only cases 2 and 3 occur on Au(111).", "url": "https://arxiv.org/abs/2611.33338", "type": "理论+数值", "summary": "许多通过自组装生长的多相薄膜涉及生长成同一薄膜的金属相和氧化物相的共沉积。在这样的条件下，氧化物物质可以以化学计量分子形式存在于金属相的表面上。量化金属表面上此类分子氧化物态的稳定性、结合和扩散对于理解自组装至关重要。在这项工作中，我们利用自旋极化密度泛函理论计算研究了 CeO2 分子在 Au 表面上的结合和稳定性。具体来说，我们研究了 CeO2 分子的构型、其结合能和结合自由能、结构稳定性、有效电荷和预计电子态密度在 Au(001)、Au(110) 和 Au(111) 表面上的不同结合位点之间如何变化。人们发现分子 CeO2 比其原子成分更适合所有 Au 表面。研究还发现，弯曲的CeO2分子构型比线性分子构型更稳定，Ce原子位于中空位点，O原子位于顶部位点。\n\n此外，结合能在-1 eV左右或弱于-1 eV的CeO2分子在Au表面的构型被发现在室温以上存在的可能性较低。此外，发现电荷转移的发生方式使得CeO2分子在所有表面上都极化，但仅对于Au(001)和Au(110)表面上的强键合态极化更强。最后，确定了 CeO2 分子如何与 Au(001)、Au(110) 和 Au(111) 结合的三种不同情况：情况 1：对称键的化学吸附，情况 2：不对称键的化学吸附，情况 3：对称键的物理吸附。这三种 CeO2 结合情况出现在 Au(001) 和 Au(110) 上，但只有情况 2 和 3 出现在 Au(111) 上。", "authors": [{"name": "Ying-Cheng Chen"}, {"name": "Ahmad Ahmad"}, {"name": "Anter El-Azab"}], "featured_authors": [{"name": "Ying-Cheng Chen"}, {"name": "Ahmad Ahmad"}, {"name": "Anter El-Azab"}], "author_count": 3}, {"id": "2611.33381", "category": "cond-mat", "title": "Magnetically Guided Sequential Multi-Filler Alignment Enables Anisotropic Heat Pathways in Stretchable Composites for Soft Electronics", "abstract": "Stretchable, skin-conformal electronics demand thermal interface materials that combine high through-plane heat transport with mechanical softness and lateral electrical insulation. In particle-filled composites, these requirements are typically antagonistic. Heat transport is governed not only by the intrinsic thermal conductivity of the fillers but, more critically, by thermal resistance at the interparticle interface. As the interparticle distance is reduced by increasing the particle content, mechanical reinforcement and in-plane electrical conductivity become unavoidable. The existing particle alignment processing strategies result in inefficient uncoupling of multifunctionality. Here, we present a hierarchical two-step process strategy to induce strong conductivity anisotropy in a soft composite. First, an align-before-blend process forms a scaffold of magnetically aligned nickel (Ni) microparticles in air before polymer infiltration. The absence of the viscous elastomer matrix during the particle alignment facilitates handling large amounts of particles, which assemble into highly ordered and densely packed vertical heat-conduction pathways. Second, a liquid metal (LM)/Ni mixture is infiltrated into the aligned scaffold to bridge interparticle gaps, minimizing interparticle thermal resistance. The composite reaches 7.5 W/(m K) through-plane thermal conductivity with lateral electrical conductivity below $10^{-12}$ S/m and ultrasoft mechanical compliance (approximately 160 kPa), enabling coupling layers in thermoelectric generators and finger-mounted heat-spreading pads for wearable technologies.", "url": "https://arxiv.org/abs/2611.33381", "type": "理论", "summary": "可拉伸、贴合皮肤的电子产品需要热界面材料，将高平面热传输与机械柔软性和横向电绝缘性结合起来。在颗粒填充复合材料中，这些要求通常是相互矛盾的。热传输不仅受填料固有导热率的影响，更重要的是受颗粒间界面热阻的影响。由于通过增加颗粒含量来减小颗粒间距离，因此机械增强和面内导电性变得不可避免。现有的粒子排列处理策略导致多功能性的低效解耦。在这里，我们提出了一种分层两步工艺策略，以在软复合材料中诱导强电导率各向异性。首先，在聚合物渗透之前，混合前对齐工艺在空气中形成磁性排列的镍 (Ni) 微粒支架。在颗粒排列过程中不存在粘性弹性体基质有利于处理大量颗粒，这些颗粒组装成高度有序且密集的垂直热传导路径。\n\n其次，将液态金属（LM）/镍混合物渗透到对齐的支架中以桥接颗粒间间隙，从而最大限度地减少颗粒间热阻。该复合材料的贯通面热导率达到 7.5 W/(m K)，横向电导率低于 $10^{-12}$ S/m 和超软机械柔量（约 160 kPa），可实现热电发生器中的耦合层和用于可穿戴技术的指装散热垫。", "authors": [{"name": "Altynay Kaidarova"}, {"name": "Viktor Naenen"}, {"name": "Isidro Florenciano"}, {"name": "Ruben Windey"}, {"name": "Xiaoyan Qing"}, {"name": "Laurens Snels"}, {"name": "Juhyung Park"}, {"name": "Tom Van der Donck"}, {"name": "Jeroen Soete"}, {"name": "David Seveno"}, {"name": "Francisco Molina-Lopez"}], "featured_authors": [{"name": "Altynay Kaidarova"}, {"name": "Viktor Naenen"}, {"name": "Isidro Florenciano"}, {"name": "Jeroen Soete"}, {"name": "David Seveno"}, {"name": "Francisco Molina-Lopez"}], "author_count": 11}, {"id": "2611.33422", "category": "cond-mat", "title": "Spectroscopic Signatures of Polaronic Density Wave Fluctuations in Superconducting Bismuthates", "abstract": "The bismuthate high-temperature superconductors have been identified as potential bipolaron systems, where hole pairs are bound to local breathing distortions of the BiO$_6$ octahedra in their metallic phase. However, obtaining definitive evidence for these quasiparticles and their excitations remains challenging. Here, we report on periodic modulations of the spectral intensities and scattering rates of quasiparticles on the Fermi surfaces of doped bismuthates Ba$_{1-x}$K$_x$BiO$_3$ and BaPb$_{1-y}$Bi$_y$O$_3$, which are reminiscent of ``hot spot'' patterns that have been observed in cuprate superconductors. We show that these features can be well described by a model where electrons couple to fluctuating density wave modulations with short-range coherence along a $(\\pi,\\pi,\\pi)$-oriented wavevector. The results are consistent with the existence of a two-component fluid where unpaired electrons interact with a fluctuating density wave created by residual bipolarons and their breathing distortions of the BiO$_6$ octahedra.", "url": "https://arxiv.org/abs/2611.33422", "type": "理论", "summary": "铋高温超导体已被确定为潜在的双极子系统，其中空穴对在其金属相中与 BiO$_6$ 八面体的局部呼吸变形有关。然而，获得这些准粒子及其激发的明确证据仍然具有挑战性。在这里，我们报告了掺杂铋 Ba$_{1-x}$K$_x$BiO$_3$ 和 BaPb$_{1-y}$Bi$_y$O$_3$ 费米表面上准粒子的光谱强度和散射率的周期性调制，这让人想起在铜酸盐超导体中观察到的“热点”图案。我们表明，这些特征可以通过一个模型很好地描述，其中电子沿着 $(\\pi,\\pi,\\pi)$ 方向的波矢量耦合到具有短程相干性的脉动密度波调制。结果与双组分流体的存在一致，其中不成对的电子与残余双极子及其 BiO$_6$ 八面体的呼吸扭曲产生的波动密度波相互作用。", "authors": [{"name": "Wojciech R. Pudełko"}, {"name": "Muntaser Naamneh"}, {"name": "Philip M. Dee"}, {"name": "Hang Li"}, {"name": "Eduardo B. Guedes"}, {"name": "Dariusz J. Gawryluk"}, {"name": "Anna Krztoń-Maziopa"}, {"name": "Vahid Sazgari"}, {"name": "Yona Soh"}, {"name": "Ming Shi"}, {"name": "Milan Radović"}, {"name": "Johan Chang"}, {"name": "Steven Johnston"}, {"name": "Nicholas C. Plumb"}], "featured_authors": [{"name": "Wojciech R. Pudełko"}, {"name": "Muntaser Naamneh"}, {"name": "Philip M. Dee"}, {"name": "Johan Chang"}, {"name": "Steven Johnston"}, {"name": "Nicholas C. Plumb"}], "author_count": 14}, {"id": "2611.33443", "category": "cond-mat", "title": "Extrinsic thermodynamic geometry, symmetry, and the cost of constraint", "abstract": "Driving a stochastic system in finite time costs excess work; exactly how much depends on which system parameters, and hence which paths in distribution space, a controller can access. In the friction-tensor formalism for slow driving, the space of equilibrium distributions is a Riemannian manifold and constraints on a controller define submanifolds. Whether a constrained controller is forced onto suboptimal paths is a question of the extrinsic thermodynamic geometry of the submanifold, which we develop for discrete systems. We show that submanifolds with zero extrinsic curvature can be identified from symmetries of the transition network, before any optimization. A minimum-work protocol on such a submanifold is therefore stationary in the excess work even when the constraints are lifted. The stationarity of symmetric optima holds exactly, beyond slow driving. In the slow-driving regime, we show that the ambient curvature transverse to a symmetric submanifold determines whether nearby symmetry-broken protocols have lower excess work. This curvature, which separates into independent contributions from each pattern of symmetry breaking, thus acquires an operational meaning as a measure of the thermodynamic incentive to break a given symmetry. A thermodynamic comparison theorem provides an inexpensive test of local minimality that weighs the extremal curvatures along the symmetric protocol against its excess work. There is no need for such tests under certain convexity conditions on the transition rates and control parameters, which guarantee that a symmetric optimum is a global optimum. These results certify the global optimality of a five-parameter protocol previously observed to match 15-parameter full control of a four-spin Ising system, and explain why partial symmetry breaking is optimal for the same system under local-field control.", "url": "https://arxiv.org/abs/2611.33443", "type": "理论+数值", "summary": "在有限的时间内驱动随机系统会耗费过多的工作；具体多少取决于控制器可以访问哪些系统参数，以及分配空间中的哪些路径。在慢速驾驶的摩擦张量形式中，平衡分布空间是黎曼流形，控制器上的约束定义子流形。受约束的控制器是否被迫进入次优路径是子流形的外在热力学几何问题，我们为离散系统开发了子流形。我们表明，在任何优化之前，可以根据过渡网络的对称性来识别具有零外在曲率的子流形。因此，即使解除约束，这种子歧管上的最小工作协议在过量工作中也是固定的。对称最优的平稳性在慢速驾驶之外完全成立。在慢速驾驶状态下，我们表明横向于对称子流形的环境曲率决定了附近的对称破缺协议是否具有较低的多余功。\n\n这种曲率将对称性破缺的每种模式分成独立的贡献，因此获得了操作意义，作为破坏给定对称性的热力学激励的度量。热力学比较定理提供了一种廉价的局部极小性测试，该测试将沿对称协议的极值曲率与其过量功进行权衡。在某些凸性条件下不需要对转移率和控制参数进行此类测试，这保证了对称最优是全局最优。这些结果证明了先前观察到的五参数协议的全局最优性，以匹配四自旋伊辛系统的 15 参数完全控制，并解释了为什么部分对称性破缺对于局部场控制下的同一系统是最优的。", "authors": [{"name": "Jordan R. Sawchuk"}, {"name": "David A. Sivak"}], "featured_authors": [{"name": "Jordan R. Sawchuk"}, {"name": "David A. Sivak"}], "author_count": 2}, {"id": "2611.33538", "category": "cond-mat", "title": "ILMlip: fast and universal machine-learning interatomic potentials", "abstract": "Large-scale pretrained machine-learned interatomic potentials keep growing more accurate as new models appear at a rapid pace, and more expensive: the current leader of Matbench Discovery as of November 2026 (F1 score 0.935) has $9.9\\times10^7$ parameters and took 3.6 thousand GPU-hours to train. The ILMlip potentials presented here are optimised for speed as well as zero-shot accuracy. They are equivariant, conservative message-passing potentials in which every component is arranged for throughput: little work per pair of atoms and as much as needed per atom. Through ASE on one GPU, they run molecular dynamics up to about $10^3$ times faster than state-of-the-art message-passing potentials such as MACE (medium) and up to five times faster than NEP89 and DPA-4.1C. At the same time, six sizes with $1.4\\times10^5$ to $2.8\\times10^7$ parameters, pretrained on materials, molecules and solid acids, reach F1 scores of 0.75 to 0.91 on Matbench Discovery, placing the largest within 0.03 of the current leader. They therefore suit high-throughput, large or long simulations, and, being transferable, they are strong starting points for fine-tuning. Fine-tuned to six materials, the model of size S comes close to the ab initio force errors of a fine-tuned MACE, so it reaches reference-level accuracy at about 50 ns per atom and step (Cu fcc). Their components can be adopted separately, as a starting point for architectures with even better ratios of speed to accuracy. The ILMlip implementation is available at this https URL", "url": "https://arxiv.org/abs/2611.33538", "type": "理论+数值", "summary": "随着新模型的快速出现，大规模预训练的机器学习原子间势不断变得更加准确，而且成本也越来越高：截至 2026 年 11 月，Matbench Discovery 的当前领先者（F1 得分 0.935）拥有 9.9\\times10^7$ 参数，需要 3600 个 GPU 小时进行训练。这里介绍的 ILMlip 势针对速度和零射击精度进行了优化。它们是等变的、保守的消息传递潜力，其中每个组件都按照吞吐量进行排列：每对原子的工作量很少，而每个原子所需的工作量则尽可能多。通过在一个 GPU 上运行 ASE，它们运行分子动力学的速度比 MACE（中）等最先进的消息传递潜力快约 10^3 倍，比 NEP89 和 DPA-4.1C 快五倍。与此同时，参数为 $1.4\\times10^5$ 到 $2.8\\times10^7$ 的六种尺寸，在材料、分子和固体酸上进行预训练，在 Matbench Discovery 上达到了 0.75 到 0.91 的 F1 分数，与当前领先者的最大差距在 0.03 以内。因此，它们适合高通量、大型或长时间的模拟，而且由于可转移，它们是微调的有力起点。\n\n对六种材料进行微调后，尺寸 S 的模型接近微调 MACE 的从头算力误差，因此它达到每个原子和步长 (Cu fcc) 约 50 ns 的参考级精度。它们的组件可以单独采用，作为具有更好的速度与精度比的架构的起点。 ILMlip 实现可在此 https URL 获取", "authors": [{"name": "Jonas Hänseroth"}, {"name": "Christian Dreßler"}], "featured_authors": [{"name": "Jonas Hänseroth"}, {"name": "Christian Dreßler"}], "author_count": 2}, {"id": "2611.33544", "category": "cond-mat", "title": "Machine-Learning Spin-Fermion Models for Strongly Disordered Magnets: Sb-Doped MnTe", "abstract": "Metallic altermagnets are promising for spintronics, but most altermagnets are insulating. Doping can induce metallicity, but introduces chemical and magnetic disorder that is challenging to model from first principles. Here, we introduce a machine-learning approach that renormalizes first-principles calculations onto disordered spin-fermion models. The learned models accurately reproduce first-principles magnetic and electronic properties and enable predictions of millions of inequivalent long-range exchange couplings in large disordered supercells. Applied to Sb-doped MnTe, the approach shows that altermagnetism persists up to about 25\\% Sb, and reveals disorder broadening as a new factor controlling spin selectivity. More broadly, our work opens a route to combining renormalization with machine-learned Hamiltonians for strongly disordered materials.", "url": "https://arxiv.org/abs/2611.33544", "type": "理论+数值", "summary": "金属交变磁体在自旋电子学方面很有前景，但大多数交变磁体都是绝缘的。掺杂可以诱导金属丰度，但会引入化学和磁性无序，这很难根据第一原理进行建模。在这里，我们引入了一种机器学习方法，将第一原理计算重新规范化为无序自旋费米子模型。学习的模型准确地再现了第一原理的磁和电子特性，并能够预测大型无序超级电池中数百万个不等价的远程交换耦合。应用于 Sb 掺杂 MnTe 时，该方法表明交变磁性持续高达约 25% Sb，并揭示无序展宽是控制自旋选择性的新因素。更广泛地说，我们的工作开辟了一条将重正化与机器学习的哈密顿量相结合的途径，用于强无序材料。", "authors": [{"name": "Do Hoon Kiem"}, {"name": "Parul R. Raghuvanshi"}, {"name": "David S. Parker"}, {"name": "Lucas Lindsay"}, {"name": "Valentino R. Cooper"}, {"name": "Tom Berlijn"}], "featured_authors": [{"name": "Do Hoon Kiem"}, {"name": "Parul R. Raghuvanshi"}, {"name": "David S. Parker"}, {"name": "Lucas Lindsay"}, {"name": "Valentino R. Cooper"}, {"name": "Tom Berlijn"}], "author_count": 6}, {"id": "2611.33630", "category": "cond-mat", "title": "Graphical Rules for Zero-energy Quantum-Interference Patterns in Bipartite Lattices", "abstract": "Quantum interference(QI) plays an important role in electron transport in molecules, where conductance is determined by the coherent superposition of different quantum-walk paths connecting the source and drain sites. In some systems, the pronounced even-odd conductance oscillation with the walk length can be observed; meanwhile destructive QI can lead to a dramatic suppression of conductance, resulting in a huge on/off ratio. In this paper, we extend the investigation from individual molecules to bipartite lattice systems, providing an abstract framework for exploring QI in a broad range of two-dimensional systems. We propose a simple graphical rule for predicting the QI pattern-the conductance map obtained by varying the drain site while keeping the source site fixed-in bipartite structures with arbitrary boundaries and holes. The analysis can be completed in three steps. First, a unit-cell-replicated bipartite subset is constructed by removing a subset of atoms from the input network, and its Green's function map is efficiently obtained from a local recurrence relation. Second, the removed atoms and local structural modifications are coupled back as local degrees of freedom, generating zero-mode vectors through the same Green's function map. Finally, the surviving zero-mode combinations are selected by an effective coupling matrix, whose projectors correct the reference map to yield the final QI pattern. This rule applies to finite flakes with arbitrary boundaries and holes and extends naturally to infinite lattices and vacancy defects.", "url": "https://arxiv.org/abs/2611.33630", "type": "理论", "summary": "量子干涉（QI）在分子中的电子传输中起着重要作用，其中电导由连接源极和漏极位置的不同量子行走路径的相干叠加决定。在一些系统中，可以观察到明显的奇偶电导随行走长度的振荡；同时，破坏性的 QI 会导致电导的急剧抑制，从而产生巨大的开/关比。在本文中，我们将研究范围从单个分子扩展到二分晶格系统，为探索广泛的二维系统中的量子质量提供了一个抽象框架。我们提出了一个简单的图形规则来预测 QI 模式，即通过改变漏极位置同时保持源位置固定在具有任意边界和孔的二分结构中获得的电导图。分析可以分三步完成。首先，通过从输入网络中删除原子子集来构造单位单元复制的二分子集，并从局部递归关系中有效地获得其格林函数图。\n\n其次，移除的原子和局部结构修改作为局部自由度耦合回来，通过相同的格林函数图生成零模式向量。最后，通过有效耦合矩阵选择幸存的零模式组合，其投影仪校正参考图以产生最终的 QI 模式。该规则适用于具有任意边界和孔的有限薄片，并自然延伸到无限晶格和空位缺陷。", "authors": [{"name": "Xinhao Fan"}, {"name": "Shunbo Hu"}, {"name": "Jingzhe Chen"}], "featured_authors": [{"name": "Xinhao Fan"}, {"name": "Shunbo Hu"}, {"name": "Jingzhe Chen"}], "author_count": 3}, {"id": "2611.33770", "category": "cond-mat", "title": "Solvent-Mediated Disintegration of a Vitrimer Network", "abstract": "Vitrimers are dynamic polymer networks characterized by associative bond exchange, which enables topological rearrangement while preserving the overall network connectivity. However, how this dynamic connectivity evolves in the presence of a solvent, particularly as a function of temperature, remains poorly understood. Here, we employ hybrid molecular dynamics Monte Carlo simulations to elucidate the temperature-dependent restructuring and dissociation of vitrimer networks in solution. By constructing temperature composition phase diagrams, we demonstrate that the critical temperature for network dissolution increases nonlinearly with crosslink concentration. We find that the network disintegration begins well below the critical dissolution temperature, indicating that the loss of network connectivity can occur even before the onset of macroscopic dissolution. However, the network undergoes extensive restructuring around the critical temperature for a highly crosslinked system, resulting in the formation of numerous smaller, disconnected networks. Concurrently, the number of intrachain dynamic bonds increases with temperature. Interestingly, complete disintegration into individual polymer chains is not observed; instead, the solution comprises a broad distribution of smaller network fragments. These findings reveal the complex interplay between solvent-induced network disintegration and dynamic bond redistribution, providing molecular level insights into the dissolution of vitrimer networks and their potential for solvent assisted recycling.", "url": "https://arxiv.org/abs/2611.33770", "type": "理论+数值", "summary": "Vitrimer 是动态聚合物网络，其特征是缔合键交换，可实现拓扑重排，同时保持整体网络连接性。然而，这种动态连接性在溶剂存在下如何演变，特别是作为温度的函数，仍然知之甚少。在这里，我们采用混合分子动力学蒙特卡罗模拟来阐明溶液中 vitrimer 网络的温度依赖性重组和解离。通过构建温度组成相图，我们证明网络溶解的临界温度随交联浓度非线性增加。我们发现网络解体开始于远低于临界溶解温度，这表明网络连通性的丧失甚至可能在宏观溶解开始之前发生。然而，网络在高度交联系统的临界温度附近经历广泛的重组，导致形成许多较小的、断开的网络。同时，链内动态键的数量随着温度的增加而增加。\n\n有趣的是，没有观察到完全分解成单个聚合物链；相反，该解决方案包括广泛分布的较小网络片段。这些发现揭示了溶剂诱导的网络分解和动态键重新分布之间复杂的相互作用，为 vitrimer 网络的溶解及其溶剂辅助回收的潜力提供了分子水平的见解。", "authors": [{"name": "Manoj K Patel"}, {"name": "Tarak K Patra"}], "featured_authors": [{"name": "Manoj K Patel"}, {"name": "Tarak K Patra"}], "author_count": 2}, {"id": "2611.33795", "category": "cond-mat", "title": "Exact subtraction of electron self-interaction from the Kohn-Sham equations", "abstract": "The self-interaction error (SIE) of Kohn-Sham density functional theory (KS-DFT) leads to a non-physical, non-linear dependence of an orbital's energy on its own fractional occupation [Dabo et al., Phys. Rev. B, 82:115121, 2010]. The generalized Koopmans condition (GKC) ensures an atomic orbital's eigenenergy is independent of its fractional occupation$-$ and is free of self-interaction. The constrained search of the Levy spin-density-functional theory yields orbital densities and delivers the ground-state energy to generalize the Hohenberg-Kohn theorems. In this work, the electron density of the Kohn-Sham equations is constrained to be orbital-density dependent, with a total energy functional linear with respect to variation of its orbital densities. That is, the KS multiplicative effective potential $v_{\\text{s}}[{n}]$ for an orbital $\\varphi_i[{n}]$ is constrained to a functional $v_{\\text{eff}}[{n - n_i}]$. The result complies with the generalized Koopmans condition (GKC). This approach improves LDA and GGA mean absolute errors (MAEs) in fundamental band gaps by $\\sim$ 1 eV, with respect to KS-DFT. Equations free of electron self-interaction provide the basis for improvements in the accuracy, efficiency, and simplicity of density functional theories.", "url": "https://arxiv.org/abs/2611.33795", "type": "理论+数值", "summary": "Kohn-Sham 密度泛函理论 (KS-DFT) 的自相互作用误差 (SIE) 导致轨道能量对其自身分数占据的非物理、非线性依赖性 [Dabo et al., Phys.修订版 B，82：11​​5121，2010]。广义库普曼条件 (GKC) 确保原子轨道的本征能与其分数占据 $-$ 无关，并且没有自相互作用。 Levy 自旋密度泛函理论的约束搜索产生轨道密度并提供基态能量以推广 Hohenberg-Kohn 定理。在这项工作中，Kohn-Sham 方程的电子密度被限制为与轨道密度相关，总能量相对于其轨道密度的变化呈线性函数关系。也就是说，轨道 $\\varphi_i[{n}]$ 的 KS 乘法有效势 $v_{\\text{s}}[{n}]$ 被约束为函数 $v_{\\text{eff}}[{n - n_i}]$。结果符合广义库普曼斯条件（GKC）。相对于 KS-DFT，这种方法将基本带隙中的 LDA 和 GGA 平均绝对误差 (MAE) 提高了 $\\sim$ 1 eV。\n\n没有电子自相互作用的方程为提高密度泛函理论的准确性、效率和简单性提供了基础。", "authors": [{"name": "J. E. Ingall"}, {"name": "Alister J. Page"}], "featured_authors": [{"name": "J. E. Ingall"}, {"name": "Alister J. Page"}], "author_count": 2}, {"id": "2611.33803", "category": "cond-mat", "title": "Superconductivity from a Cooper surface instability in a nodal Bose metal", "abstract": "In underdoped cuprates, the superconducting gap is largest where low-energy electron spectral weight is already depleted above the transition. How can a weak attraction drive superconductivity when the one-electron density of states vanishes? In a momentum-space \\(t\\)--\\(J\\) model, the exactly solvable normal state is a nodal Bose metal with four one-electron nodes. Along two contours called Cooper surfaces, adding or removing a spin-singlet pair of electrons with opposite momenta costs no energy. The resulting logarithmic divergence of the pair susceptibility allows an arbitrarily weak pair-transfer attraction to stabilize a correlated nodal \\(d\\)-wave superconductor. Spin-resolved coincidence photoemission could test this pairing mechanism by resolving two zero-energy pair-removal ridges above the transition and a third along the underlying Luttinger surface below it.", "url": "https://arxiv.org/abs/2611.33803", "type": "理论+数值", "summary": "在欠掺杂的铜酸盐中，超导能隙最大，其中低能电子谱权重在跃迁上方已经耗尽。当单电子态密度消失时，弱吸引力如何驱动超导？在动量空间 \\(t\\)--\\(J\\) 模型中，精确可解的正常态是具有四个单电子节点的节点玻色金属。沿着称为库珀表面的两个轮廓，添加或删除具有相反动量的自旋单线电子对不消耗能量。由此产生的对磁化率的对数散度允许任意弱的对转移吸引力来稳定相关节点\\(d\\)波超导体。自旋分辨重合光发射可以通过解析跃迁上方的两个零能量对消除脊和沿其下方的底层卢廷格表面的第三个脊来测试这种配对机制。", "authors": [{"name": "Jian-Jian Miao"}, {"name": "Cui Ding"}], "featured_authors": [{"name": "Jian-Jian Miao"}, {"name": "Cui Ding"}], "author_count": 2}, {"id": "2611.33807", "category": "cond-mat", "title": "Controlling truncation errors in loop tensor network renormalization", "abstract": "At finite bond dimension $\\chi$, tensor network renormalization (TNR) of a critical model eventually becomes gapped. For LoopTNR with $O(2)$ symmetry on the $c=1$ critical line of the six-vertex model, parametrized by the Luttinger parameter $K$, we show that the correlation length $\\xi$ of the gapped phase is set by the seed of the dimerization injected by the truncation, and depends on $\\chi$ only through it. Read from a weak-coupling window early in the same run, the seed predicts $\\xi=10^3$-$10^{16}$ via the sine-Gordon mass-coupling relation with no free parameter, to within a few percent for $K\\le1.5$ and about 10% at $K=1.75$; since the seed fluctuates strongly with $\\chi$, $\\xi$ is not monotonic in $\\chi$. An alternation of the vertex weights shifts the seed; with its sign read from a $\\pi$ twist, one short calibration predicts a counterterm that delays the breakdown in 16 of the 17 compensated groups of a campaign fixed in advance. A correction of the coarse-grained tensors, repeated during the flow, keeps the runs at $K=1$ and $1.5$ critical up to step 160, the last step computed, and exposes the marginal truncation error that remains. Our findings illustrate a systematic procedure for controlling the relevant truncation error, and thereby extending the critical window, in tensor network renormalization at finite bond dimension.", "url": "https://arxiv.org/abs/2611.33807", "type": "理论+数值", "summary": "在有限键维 $\\chi$ 下，关键模型的张量网络重整化 (TNR) 最终会出现间隙。对于在六顶点模型的 $c=1$ 临界线上具有 $O(2)$ 对称性的 LoopTNR，由 Luttinger 参数 $K$ 参数化，我们表明间隙相的相关长度 $\\xi$ 由截断注入的二聚化种子设置，并且仅通过它依赖于 $\\chi$。在同一次运行的早期从弱耦合窗口读取，种子通过没有自由参数的正弦戈登质量耦合关系预测 $\\xi=10^3$-$10^{16}$，对于 $K\\le1.5$ 预测在几个百分点之内，在 $K=1.75$ 时预测约为 10%；由于种子随 $\\chi$ 强烈波动，因此 $\\xi$ 在 $\\chi$ 中不是单调的。顶点权重的交替会改变种子；其符号是从 $\\pi$ 扭曲中读出的，一个简短的校准预测了一个反项，该反项延迟了预先确定的活动的 17 个补偿组中的 16 个组的崩溃。在流程中重复进行粗粒度张量的校正，使 $K=1$ 和 $1.5$ 的运行保持关键，直至步骤 160（计算的最后一步），并暴露剩余的边际截断误差。\n\n我们的研究结果说明了在有限键维张量网络重整化中控制相关截断误差并从而扩展临界窗口的系统过程。", "authors": [{"name": "Rikuto Fushio"}, {"name": "Kokin Cho"}, {"name": "Yuta Yamamoto"}, {"name": "Akira Otsuki"}, {"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Rikuto Fushio"}, {"name": "Kokin Cho"}, {"name": "Yuta Yamamoto"}, {"name": "Akira Otsuki"}, {"name": "Masahito Yamazaki"}], "author_count": 5}, {"id": "2611.33912", "category": "cond-mat", "title": "Phono3GPU: GPU-Accelerated Linear Tetrahedron Integration for Phonon Thermal Transport", "abstract": "Materials with high or low thermal conductivity are increasingly important for thermal management and energy technologies. Machine-learned interatomic potentials have accelerated anharmonic force-constant calculations, shifting the bottleneck toward phonon transport calculations for large materials datasets. Existing GPU solvers often rely on smearing, whose width can require material-dependent choices, while the linear tetrahedron method used in phono3py avoids this parameter but becomes costly for complex structures. Here we introduce Phono3GPU, which reformulates three-phonon scattering and linear tetrahedron integration for massively parallel GPU execution. Across benchmark crystals, Phono3GPU accelerates total calculations by up to 41 times relative to a CPU implementation, with larger gains for complex unit cells, and by 2 to 6 times relative to a recent GPU plug-in for phono3py. We further demonstrate atom-resolved scattering analysis in defective silicon supercells as an application enabled by the reduced computational cost. Phono3GPU thus lowers the cost of tetrahedron-based thermal-conductivity calculations and of detailed investigations of structure-dependent phonon transport.", "url": "https://arxiv.org/abs/2611.33912", "type": "数值", "summary": "高导热率或低导热率的材料对于热管理和能源技术越来越重要。机器学习的原子间势加速了非谐力常数计算，将瓶颈转向大型材料数据集的声子输运计算。现有的 GPU 求解器通常依赖于涂抹，其宽度可能需要根据材料进行选择，而 phono3py 中使用的线性四面体方法避免了此参数，但对于复杂结构而言成本高昂。在这里，我们介绍 Phono3GPU，它重新表述了三声子散射和线性四面体积分，以实现大规模并行 GPU 执行。在基准晶体中，Phono3GPU 相对于 CPU 实现，总计算速度提高了 41 倍，对于复杂的单位单元有更大的增益，相对于最新的 phono3py GPU 插件，提高了 2 到 6 倍。我们进一步证明了有缺陷的硅超级电池中的原子分辨散射分析是一种通过降低计算成本实现的应用。\n\n因此，Phono3GPU 降低了基于四面体的热导率计算和结构相关声子输运详细研究的成本。", "authors": [{"name": "Jinhyeong Jo"}, {"name": "Sungwoo Kang"}, {"name": "Byungju Lee"}, {"name": "Jung-Hoon Lee"}, {"name": "Seugchul Kim"}], "featured_authors": [{"name": "Jinhyeong Jo"}, {"name": "Sungwoo Kang"}, {"name": "Byungju Lee"}, {"name": "Jung-Hoon Lee"}, {"name": "Seugchul Kim"}], "author_count": 5}, {"id": "2611.33988", "category": "cond-mat", "title": "Exploring Physical Mechanisms Underlying the Emergence of Collective Order", "abstract": "Emergence of collective order from disordered constituents is a hallmark of active matter, and the Vicsek model (VM) serves as a paradigmatic system for its study. However, whether density-induced emergence in the VM differs between angular (intrinsic) and vectorial (extrinsic) noise, and what mechanisms govern the transitions, remain largely unexplored. Remarkably, we uncover that collective order emerges from a disordered state in a continuous-like manner under intrinsic noise but abruptly under extrinsic noise. Combining nonequilibrium landscape-flux theory with a coarse-grained mapping method, we show that the landscape evolves continuously from a single basin to two and back to one under intrinsic noise, but the two-basin landscape appears abruptly under extrinsic noise across the critical transition to flocking. The counterclockwise nonequilibrium flux sustains global circular motion, providing the driving force for reshaping the landscape. The mean flux and entropy production rate change steeply near the emergence threshold and exhibit pronounced peaks within the coexistence region, identifying them as the dynamical and thermodynamic origins of emergence. Our findings reveal a distinct abrupt emergence under extrinsic noise and offer deeper mechanistic insight, practical applications (e.g., locating phase boundaries and distinguishing transition types), and extensibility to other nonequilibrium collective systems.", "url": "https://arxiv.org/abs/2611.33988", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yitong Cai"}, {"name": "Ruizhe Yan"}, {"name": "Dongrun Jian"}, {"name": "Jie Su"}, {"name": "Jin Wang"}], "featured_authors": [{"name": "Yitong Cai"}, {"name": "Ruizhe Yan"}, {"name": "Dongrun Jian"}, {"name": "Jie Su"}, {"name": "Jin Wang"}], "author_count": 5}, {"id": "2611.33999", "category": "cond-mat", "title": "Rotation curves of dwarf galaxies and dark matter as a condensate of $q$-deformed bosons: reconstruction and fits of the deformation profile", "abstract": "Dark-matter-dominated dwarf galaxies are a sensitive testing ground for models in which dark matter is a self-interacting Bose-Einstein condensate (BEC). In the Thomas-Fermi limit the standard BEC halo has the density profile $\\rho\\propto\\sin(kr)/(kr)$, so that the shape of its rotation curve is fixed up to two scale parameters. Here we consider a condensate of $q$-deformed bosons. We show that, in the Thomas-Fermi limit, the deformation enters the structure of the halo only through the chemical potential of the condensate; consequently, a spatially uniform deformation parameter leaves the standard BEC profile unchanged. In every galaxy $\\chi$ is depressed in the inner region, $kr\\lesssim1$, relative to the outer halo, where it is approximately constant in most cases: the standard condensate describes the outer halo, while the core requires a weaker deformation, i.e., $q$ closer to unity. The profiles share this qualitative shape, but neither the depth nor the width of the depression is universal. Modelling the depression by a Gaussian, with two additional parameters, we fit the rotation curves with rms residuals of $0.6$--$2.6$~km\\,s$^{-1}$, against $1.6$--$8.5$~km\\,s$^{-1}$ for the standard condensate. According to the Bayesian information criterion, the deformed condensate is preferred over the standard condensate, the Navarro-Frenk-White profile, and the Burkert profile in four galaxies, is indistinguishable from the best of them in two, and is disfavoured in two. We discuss the limitations of these results, in particular the absence of error bars in the data, the neglect of baryons, and the phenomenological status of a position-dependent deformation.", "url": "https://arxiv.org/abs/2611.33999", "type": "理论", "summary": "以暗物质为主的矮星系是暗物质是自相互作用玻色-爱因斯坦凝聚体（BEC）模型的敏感试验场。在托马斯-费米极限中，标准 BEC 光环的密度分布为 $\\rho\\propto\\sin(kr)/(kr)$，因此其旋转曲线的形状最多固定为两个尺度参数。在这里，我们考虑 $q$ 变形玻色子的凝聚体。我们证明，在托马斯-费米极限下，形变仅通过凝聚态的化学势进入晕结构；因此，空间均匀的变形参数使标准 BEC 轮廓保持不变。在每个星系中，相对于外晕，$\\chi$ 在内部区域 $kr\\lesssim1$ 中凹陷，在大多数情况下它近似恒定：标准凝聚体描述了外晕，而核心需要较弱的变形，即 $q$ 更接近统一。这些轮廓都具有这种定性形状，但凹陷的深度和宽度都不是通用的。\n\n通过高斯模型，使用两个附加参数，我们拟合旋转曲线，其均方根残差为 $0.6$--$2.6$~km\\,s$^{-1}$，而标准凝析油则为 $1.6$--$8.5$~km\\,s$^{-1}$。根据贝叶斯信息准则，在四个星系中，变形凝聚体优于标准凝聚体、纳瓦罗-弗伦克-怀特剖面和伯克特剖面，在两个星系中与其中最好的无法区分，在两个星系中不受欢迎。我们讨论了这些结果的局限性，特别是数据中缺少误差线、重子的忽略以及位置相关变形的现象学状态。", "authors": [{"name": "Mahnaz Maleki"}, {"name": "Asef Kheirandish"}, {"name": "Morteza Nattagh Najafi"}, {"name": "Hosein Mohammadzadeh"}], "featured_authors": [{"name": "Mahnaz Maleki"}, {"name": "Asef Kheirandish"}, {"name": "Morteza Nattagh Najafi"}, {"name": "Hosein Mohammadzadeh"}], "author_count": 4}, {"id": "2611.34000", "category": "cond-mat", "title": "Wannier-Based Low-Energy Electronic Structure Analysis of $λ$-(STF)$_2$GaCl$_4$", "abstract": "The low-energy electronic structures of $\\lambda$-(BETS)$_2$GaCl$_4$ and $\\lambda$-(STF)$_2$GaCl$_4$ were investigated using density functional theory (DFT) and maximally localized Wannier functions (MLWFs). For $\\lambda$-(STF)$_2$GaCl$_4$, DFT-selected and directly XRD-refined structural models were compared before and after fixed-lattice relaxation. Their initially different near-Fermi-level electronic structures become similar after relaxation. Relative to BETS, relaxed STF has a narrower frontier bandwidth while retaining a substantial dimerization energy scale. Two MLWFs were constructed for each selected unrelaxed structure to represent the upper frontier bands, with total spreads of 36.708 Å$^2$ for BETS and 37.578 Å$^2$ for STF. The Wannier-derived transfer integrals show a pronounced reduction of $t_{d1}$ from 51 meV in BETS to 6.5 meV in STF, indicating selective modification of the low-energy electronic connectivity.", "url": "https://arxiv.org/abs/2611.34000", "type": "理论+数值", "summary": "使用密度泛函理论（DFT）和最大局域万尼尔函数（MLWF）研究了 $\\lambda$-(BETS)$_2$GaCl$_4$ 和 $\\lambda$-(STF)$_2$GaCl$_4$ 的低能电子结构。对于 $\\lambda$-(STF)$_2$GaCl$_4$，比较了固定晶格弛豫之前和之后的 DFT 选择和直接 XRD 细化的结构模型。它们最初不同的近费米能级电子结构在弛豫后变得相似。相对于 BETS，松弛的 STF 具有更窄的前沿带宽，同时保留了大量的二聚能尺度。为每个选定的非松弛结构构建了两个 MLWF 以代表上前沿带，BETS 的总扩散为 36.708 Å$^2$，STF 的总扩散为 37.578 Å$^2$。 Wannier 导出的传递积分显示 $t_{d1}$ 从 BETS 中的 51 meV 显着降低到 STF 中的 6.5 meV，表明低能电子连通性的选择性修改。", "authors": [{"name": "Arifa D. Agustin"}, {"name": "Aulia A. Firdaus"}, {"name": "Fathan M. Santana"}, {"name": "Shuhei Fukuoka"}, {"name": "Atsushi Kawamoto"}, {"name": "Muhammad R. Ramadhan"}, {"name": "Isao Watanabe"}, {"name": "Dita P. Sari"}, {"name": "Yasuyuki Ishii"}], "featured_authors": [{"name": "Arifa D. Agustin"}, {"name": "Aulia A. Firdaus"}, {"name": "Fathan M. Santana"}, {"name": "Isao Watanabe"}, {"name": "Dita P. Sari"}, {"name": "Yasuyuki Ishii"}], "author_count": 9}, {"id": "2611.34072", "category": "cond-mat", "title": "Frustration in system with intercalated and bilayer smectic structure", "abstract": "The dimeric mesogens exhibit an unusual variety of mesophases - nematic and smectic, with distinctly different packing schemes. The relation between molecular and mesophase structure was studied for homologue series of non-symmetric bent dimers this http URL , obtained by serial Pd- and Pt-catalyzed cross-coupling chemical reactions. The shorter homologues of the series form smectics with an intercalated structure, and longer homologues form bilayer smectics with broken up-down symmetry of molecular orientation within the layers, for intermediate homologues frustration leads to a nematic gap. The additional structure complexity arises from the tendency of bent dimers to form twisted structures, in which the azimuthal angle of tilted molecules forms both short- and long-pitch helices. Here we confirm, through resonant X-ray diffraction, that longer homologues form a helical four-layer structure of SmCTB-SH phase, along with a more complex one in which, in addition to the basic four-layer unit, an extra helix is superimposed, SmCTB-DH phase. This additional helix has a periodicity that is strongly temperature-dependent; upon cooling, it changes from 100 nm to 40 nm.", "url": "https://arxiv.org/abs/2611.34072", "type": "理论", "summary": "二聚介晶表现出不同寻常的多种中间相——向列相和近晶相，具有明显不同的堆积方案。研究了通过连续 Pd 和 Pt 催化交叉偶联化学反应获得的非对称弯曲二聚体同系物系列的分子和中间相结构之间的关系（http URL）。该系列的较短同系物形成具有插层结构的近晶族，较长同系物形成双层近晶族，其层内分子取向的上下对称性被破坏，对于中间同系物，挫败导致向列间隙。额外的结构复杂性源于弯曲二聚体形成扭曲结构的倾向，其中倾斜分子的方位角形成短螺距螺旋和长螺距螺旋。在这里，我们通过共振X射线衍射证实，较长的同系物形成了SmCTB-SH相的螺旋四层结构，以及一种更复杂的结构，其中除了基本的四层单元外，还叠加了额外的螺旋，即SmCTB-DH相。这个额外的螺旋具有强烈依赖于温度的周期性；冷却后，它从 100 nm 变为 40 nm。", "authors": [{"name": "Calum J. Gibb"}, {"name": "Claudio Flores Fernandez"}, {"name": "Magdalena M. Majewska"}, {"name": "John M. D. Storey"}, {"name": "Corrie T. Imrie"}, {"name": "Ewa Gorecka"}, {"name": "Damian Pociecha"}], "featured_authors": [{"name": "Calum J. Gibb"}, {"name": "Claudio Flores Fernandez"}, {"name": "Magdalena M. Majewska"}, {"name": "Corrie T. Imrie"}, {"name": "Ewa Gorecka"}, {"name": "Damian Pociecha"}], "author_count": 7}, {"id": "2611.34076", "category": "cond-mat", "title": "Quantum Geometric Origin of Néel-Order-Driven Magneto-Optical Response in MnTe", "abstract": "Magneto-optical (MO) responses provide a direct probe of magnetic order, yet resolving compensated antiferromagnetic order remains challenging. Here, we demonstrate in altermagnetic MnTe that the symmetry of the Néel order is imprinted on the MO response through distinct quantum-geometric contributions. Combining first-principles calculations with a Landau symmetry framework, we demonstrate that the quantum metric gives rise to a twofold optical anisotropy, with its diagonal and symmetric off-diagonal components forming an $E_{2g}$ doublet associated with the quadratic Néel-order invariants, providing a characteristic MO Voigt signature of the Néel-vector orientation. In contrast, the Berry curvature generates a complementary threefold Hall response governed by the cubic $A_{2g}$ Néel-order invariant. Although the Hall conductivity and the out-of-plane weak-ferromagnetic moment share the same symmetry and angular dependence, constraining the latter to zero leaves the optical Hall response essentially unchanged demonstrating that the Hall response originates directly from the compensated Néel order rather than the net magnetization. Our results establish quantum geometry as a direct link between Néel order and MO response, revealing distinct twofold and threefold optical signatures of Néel order in altermagnetic MnTe.", "url": "https://arxiv.org/abs/2611.34076", "type": "理论+数值", "summary": "磁光（MO）响应提供了磁序的直接探测，但解析补偿反铁磁序仍然具有挑战性。在这里，我们在交变磁 MnTe 中证明，尼尔级的对称性通过不同的量子几何贡献而印在 MO 响应上。将第一性原理计算与朗道对称框架相结合，我们证明量子度量会产生双重光学各向异性，其对角线和对称非对角线分量形成与二次尼尔阶不变量相关的 $E_{2g}$ 双峰，提供尼尔矢量方向的特征 MO Voigt 签名。相反，贝里曲率生成由三次 $A_{2g}$ Néel 阶不变量控制的互补三重霍尔响应。尽管霍尔电导率和面外弱铁磁矩具有相同的对称性和角度依赖性，但将后者限制为零使得光学霍尔响应基本不变，这表明霍尔响应直接源自补偿的尼尔阶而不是净磁化强度。\n\n我们的结果建立了量子几何作为尼尔级和 MO 响应之间的直接联系，揭示了互磁 MnTe 中尼尔级的独特的双重和三重光学特征。", "authors": [{"name": "Suman Rooj"}, {"name": "M. S. Mrudul"}, {"name": "Daegeun Jo"}, {"name": "Peter M. Oppeneer"}], "featured_authors": [{"name": "Suman Rooj"}, {"name": "M. S. Mrudul"}, {"name": "Daegeun Jo"}, {"name": "Peter M. Oppeneer"}], "author_count": 4}, {"id": "2611.34118", "category": "cond-mat", "title": "Quantum Metric Connects Bond Delocalization to Phonon Softening", "abstract": "Delocalized bonding electrons have long been associated with soft bonds and low phonon frequencies. However, a quantitative connection between electron delocalization and phonon softening remains elusive. We identify such a connection through the momentum-space quantum metric, which measures the intrinsic delocalization of the occupied electronic states. We show that a quantum geometric contribution to phonon softening is proportional to the integrated quantum metric. First-principles calculations of more than a hundred compounds demonstrate that greater quantum metric generally accompanies softer phonons. Localized Wannier orbitals reveal the bonding environments associated with this delocalization. In ferroelectric GeTe, LiBeSb, and BaTiO$_3$, polar distortion localizes the bonding orbitals, reduces quantum metric, and stabilizes the soft mode of the nonpolar structure. In PbSe, pressure-induced band inversion is accompanied by an enhanced quantum metric and phonon softening without change in crystal symmetry and bonding. These results establish a common quantum geometric interpretation of bond delocalization and phonon softening across distinct bonding environments.", "url": "https://arxiv.org/abs/2611.34118", "type": "理论+数值", "summary": "离域键合电子长期以来一直与软键和低声子频率相关。然而，电子离域和声子软化之间的定量联系仍然难以捉摸。我们通过动量空间量子度量来识别这种联系，该度量测量所占据电子态的固有离域性。我们表明，量子几何对声子软化的贡献与积分量子度量成正比。对一百多种化合物的第一原理计算表明，更大的量子度量通常伴随着更软的声子。局域万尼尔轨道揭示了与这种离域相关的成键环境。在铁电 GeTe、LiBeSb 和 BaTiO$_3$ 中，极性畸变使键合轨道局域化，降低量子度量，并稳定非极性结构的软模式。在 PbSe 中，压力引起的能带反转伴随着增强的量子度量和声子软化，而不改变晶体对称性和成键。这些结果建立了不同键合环境中键离域和声子软化的通用量子几何解释。", "authors": [{"name": "Tianqi Deng"}, {"name": "Tiejun Zhu"}], "featured_authors": [{"name": "Tianqi Deng"}, {"name": "Tiejun Zhu"}], "author_count": 2}, {"id": "2611.34194", "category": "cond-mat", "title": "Length-scales and fractal scaling in dairy gels: comparisons of the insights from ultra-small angle neutron scattering and rheology", "abstract": "A key structural parameter that dictates the textural properties of a particulate gel is the fractal dimension (Df) of the network indicating self-similarity within the spatial range defined by the correlation length (xi). In this study dairy gels are formed from reconstituted skim milk at defined CM volume fractions via two different mechanisms: acidification, and enzymatic (rennet)-induction. Oscillatory rheology is performed to obtain the gelation times, the time-scale for the maturation of mechanical properties of the gel, and the viscoelastic properties of the gel. A direct probe of gel structure is ultra-small-angle neutron scattering (USANS) examining length-scales from approximately 60 nm up to 15 microns. Structural information is extracted from USANS of matured gels by comparing the measured differential scattering cross-section with that calculated from a model constrained by the sample composition. Time-scales for structural equilibration from USANS perspective were shorter than the rheological gelation time for both gels. Rheological scaling theories are utilized to relate the microstructure to their bulk mechanical properties. We show that the fractal scaling at low-q (scattering vectors), due to aggregation of CM, extracted from the USANS at the longest timescales is described by a power-law density-density correlation function, and that rheology relates - through Shih-Wu-Morbidelli models - the local elasticity both within and between the fractal flocs formed by these particles over different size ranges to the bulk moduli of the gels. There are similar values of fractal dimensions from both techniques but different sizes attributed to the complex fractal evolution during dairy gelation, which leaves space to refinements of the models.", "url": "https://arxiv.org/abs/2611.34194", "type": "理论", "summary": "决定颗粒凝胶质地特性的关键结构参数是网络的分形维数 (Df)，指示由相关长度 (xi) 定义的空间范围内的自相似性。在这项研究中，乳制品凝胶是由复溶脱脂奶以规定的 CM 体积分数通过两种不同的机制形成的：酸化和酶促（凝乳酶）诱导。进行振荡流变学以获得凝胶化时间、凝胶机械性能成熟的时间尺度以及凝胶的粘弹性能。凝胶结构的直接探测是超小角中子散射 (USANS)，可检查从约 60 nm 到 15 微米的长度尺度。通过将测量的微分散射截面与根据样品成分约束的模型计算的截面进行比较，从成熟凝胶的 USANS 中提取结构信息。从 USANS 的角度来看，结构平衡的时间尺度比两种凝胶的流变胶凝时间短。利用流变尺度理论将微观结构与其整体机械性能联系起来。\n\n我们表明，由于在最长时间尺度上从 USANS 中提取的 CM 聚集，低 q（散射矢量）下的分形尺度由幂律密度-密度相关函数描述，并且流变学通过 Shih-Wu-Morbidelli 模型将这些不同尺寸范围的颗粒形成的分形絮凝体内部和之间的局部弹性与凝胶的体积模量相关联。两种技术的分形维数具有相似的值，但由于乳制品凝胶化过程中复杂的分形演化而导致大小不同，这为模型的改进留下了空间。", "authors": [{"name": "Koduvayur A. Ramya"}, {"name": "Liliana de Campo"}, {"name": "Markus Strobl"}, {"name": "François Boué"}, {"name": "Christopher J. Garvey"}], "featured_authors": [{"name": "Koduvayur A. Ramya"}, {"name": "Liliana de Campo"}, {"name": "Markus Strobl"}, {"name": "François Boué"}, {"name": "Christopher J. Garvey"}], "author_count": 5}, {"id": "2611.34204", "category": "cond-mat", "title": "Quantum-centric assessment of saturated ferromagnetism beyond the flat-band limit", "abstract": "Saturated ferromagnetism has been proven for every on-site repulsion $U > 0$ in Hubbard models with a flat lowest band, and the interaction required for it grows with the band width $W$ when the band becomes dispersive. We study the dispersive case at quarter filling by quantum-selected configuration interaction and sample-based quantum diagonalization with IBM Quantum's Heron processors, focusing on the quantized square of the total spin of the computed states. We treat a sawtooth chain of 16 unit cells on 64 qubits, whose full configuration space of $1.1\\times 10^{14}$ determinants exceeds that of one of the largest full configuration interaction calculations, and obtain the stability diagram of saturated ferromagnetism on the decorated square lattice in the plane of $U$ and $W$. For the chain, a subspace of only $3\\times 10^{-5}$ of the full configuration space gives a state with more than $97\\%$ of its weight in the sector of maximal spin. For the decorated square lattice of $4\\times 3$ unit cells on 48 qubits, the computed states in subspaces of less than $1\\%$ of the full configuration space switch from low-spin states to nearly fully polarized states at $U \\simeq 2W$. The calculations also give a rigorous lower bound of $1.9W$ on the critical interaction of the $4\\times 3$ lattice.", "url": "https://arxiv.org/abs/2611.34204", "type": "理论+数值", "summary": "在具有平坦最低能带的哈伯德模型中，饱和铁磁性已被证明适用于每个现场排斥 $U > 0$，并且当能带变得色散时，其所需的相互作用随着带宽 $W$ 的增加而增长。我们通过使用 IBM Quantum 的 Heron 处理器进行量子选择配置交互和基于样本的量子对角化来研究四分之一填充时的色散情况，重点关注计算状态的总自旋的量化平方。我们处理 64 个量子位上 16 个晶胞的锯齿链，其全配置空间 $1.1\\times 10^{14}$ 行列式超过了最大的全配置相互作用计算之一，并获得了 $U$ 和 $W$ 平面上装饰方晶格上饱和铁磁性的稳定性图。对于链来说，完整配置空间的仅 $3\\times 10^{-5}$ 的子空间给出了在最大自旋扇区中其权重超过 $97\\%$ 的状态。对于 48 个量子位上的 $4\\times 3$ 晶胞的装饰方格，完整配置空间的小于 $1\\%$ 的子空间中的计算状态从低自旋状态切换到 $U \\simeq 2W$ 处的几乎完全极化状态。\n\n计算还给出了 $4\\times 3$ 晶格关键相互作用的严格下限 $1.9W$。", "authors": [{"name": "Kosuke Nogaki"}, {"name": "Tomonori Shirakawa"}, {"name": "Seiji Yunoki"}, {"name": "Ryotaro Arita"}], "featured_authors": [{"name": "Kosuke Nogaki"}, {"name": "Tomonori Shirakawa"}, {"name": "Seiji Yunoki"}, {"name": "Ryotaro Arita"}], "author_count": 4}, {"id": "2611.34244", "category": "cond-mat", "title": "Patterns and correlations in time-reversal symmetry breaking", "abstract": "Time-reversal symmetry (TRS) breaking is the hallmark of non-equilibrium statistical physics. This notwithstanding, in translationally invariant systems, it is almost always treated only as a global quantity. We propose to use the local entropy production rate as a spatio-temporal field to describe extended homogeneous non-equilibrium systems. We find that this field generically displays spatial correlations, with a typical length that grows as we approach some non-equilibrium phase transitions. We also show that the correlation length associated with the local entropy production rate follows heretofore unknown scaling laws involving control parameters as well as the observation time used for trajectories. Our work paves the way to the use of the local entropy production as a powerful observable to identify the scale and source of TRS breaking in non-equilibrium systems.", "url": "https://arxiv.org/abs/2611.34244", "type": "理论", "summary": "时间反演对称性（TRS）破缺是非平衡统计物理学的标志。尽管如此，在平移不变的系统中，它几乎总是只被视为全局量。我们建议使用局部熵产生率作为时空场来描述扩展的均匀非平衡系统。我们发现该场通常显示空间相关性，其典型长度随着我们接近一些非平衡相变而增长。我们还表明，与局部熵产生率相关的相关长度遵循迄今为止未知的缩放定律，涉及控制参数以及用于轨迹的观察时间。我们的工作为使用局部熵产生作为强大的可观测值来识别非平衡系统中 TRS 破坏的规模和来源铺平了道路。", "authors": [{"name": "Ido Patish"}, {"name": "Mathias Casiulis"}, {"name": "Dov Levine"}], "featured_authors": [{"name": "Ido Patish"}, {"name": "Mathias Casiulis"}, {"name": "Dov Levine"}], "author_count": 3}, {"id": "2611.34255", "category": "cond-mat", "title": "Fractional Chern Insulator in a Finite-Range One-Band Model", "abstract": "A common route for realizing fractional Chern insulators (FCIs) is to engineer bands that mimic the physics of Landau levels, which serve as the single-particle topological background for the emergence of strongly correlated fractional quantum Hall states. Here we show that FCIs can also arise in a one-band model devoid of any single-particle quantum geometry. Through a systematic trivialization of the single-particle quantum geometry in FCI models that go beyond the Landau-level paradigm, we construct a single-band, interaction-only model on the square lattice, with all terms confined to individual plaquettes. At one-third filling, exact diagonalization and density-matrix renormalization-group calculations reveal a three-state low-energy manifold, a Hall conductance of $-2e^2/(3h)$, and fractional charge pumping without translation-symmetry breaking. We trace this behavior to nontrivial topology in the repulsive two-particle sector, offering a microscopic perspective on the strongly correlated origin of fractional quantum Hall order.", "url": "https://arxiv.org/abs/2611.34255", "type": "理论+数值", "summary": "实现分数陈绝缘体（FCI）的一个常见途径是设计模拟朗道能级物理的能带，作为强相关分数量子霍尔态出现的单粒子拓扑背景。在这里，我们证明 FCI 也可以出现在没有任何单粒子量子几何结构的单能带模型中。通过超越朗道级范式的 FCI 模型中单粒子量子几何的系统平凡化，我们在方晶格上构建了一个单能带、仅相互作用的模型，所有项都仅限于单个斑块。在三分之一填充时，精确的对角化和密度矩阵重正化群计算揭示了三态低能流形、$-2e^2/(3h)$的霍尔电导以及没有平移对称性破缺的分数电荷泵浦。我们将这种行为追溯到排斥双粒子扇区中的非平凡拓扑，为分数量子霍尔序的强相关起源提供了微观视角。", "authors": [{"name": "Tong Liu"}, {"name": "Hoi Chun Po"}], "featured_authors": [{"name": "Tong Liu"}, {"name": "Hoi Chun Po"}], "author_count": 2}, {"id": "2611.34259", "category": "cond-mat", "title": "Anisotropic magnetic-field modulation of hysteretic sheet resistance in few-layer ferroelectric WTe2", "abstract": "Ferroelectricity in few-layer WTe2, a polar semimetal, originates from interlayer sliding and can be probed through gate-dependent resistance hysteresis. Yet the role of magnetic fields in this transport signature remains largely unexplored. Here, we examine magnetic-field-induced changes in the hysteresis in exfoliated few-layer WTe2. Applying an out-of-plane magnetic field produces a pronounced hysteresis enhancement, while an in-plane field yields a negligible response. Analysis of the individual hysteresis branches reveals distinct magnetotransport responses of the two ferroelectric states, which increase their resistance separation under magnetic field. The enhancement exhibits a robust power-law field dependence and a temperature evolution closely resembling that of magnetoresistance. Our results reveal a close association between anisotropic magnetotransport and ferroelectric hysteresis, underscoring the interplay between magnetic response and ferroic order in a two-dimensional polar semimetal.", "url": "https://arxiv.org/abs/2611.34259", "type": "理论", "summary": "少层 WTe2（一种极性半金属）中的铁电性源自层间滑动，可以通过与栅极相关的电阻磁滞来探测。然而，磁场在这种传输特征中的作用在很大程度上仍未被探索。在这里，我们研究了磁场引起的剥落几层 WTe2 磁滞变化。应用平面外磁场会产生明显的磁滞增强，而平面内磁场则产生可忽略不计的响应。对各个磁滞分支的分析揭示了两种铁电态的不同磁输运响应，这增加了它们在磁场下的电阻分离。这种增强表现出强大的幂律场依赖性和与磁阻非常相似的温度演化。我们的结果揭示了各向异性磁输运和铁电磁滞之间的密切联系，强调了二维极性半金属中磁响应和铁序之间的相互作用。", "authors": [{"name": "Arpan Manna"}, {"name": "Soumik Mukhopadhyay"}], "featured_authors": [{"name": "Arpan Manna"}, {"name": "Soumik Mukhopadhyay"}], "author_count": 2}, {"id": "2611.34345", "category": "cond-mat", "title": "Intrinsically nonlinear nanomechanical resonator toward the single-phonon Kerr regime", "abstract": "Manipulating a physical system at the single-quantum level typically requires an anharmonic energy spectrum. Nanomechanical resonators, however, are commonly admitted to be linear objects in the single-phonon regime, thus motivating most efforts to employ external sources of nonlinearity at the cost of added relaxation and decoherence channels. Here, we take a radically different approach by directly exploiting strong intrinsic mechanical nonlinearities. We quantify this nonlinearity using a novel method based on the coupling between bending modes. Using this technique, we establish an upper bound of 34.0 +/- 9.7 phonons for the onset of intrinsically mechanical bistability. In addition, we highlight a new tuning mechanism based on a mechanical polarization angle of an upward-buckled nanotube resonator allowing us to reach an optimal working point. Extrapolating this level of intrinsic nonlinearity to realistically shorter resonators shows that the single-phonon Kerr regime is within reach, allowing for the realization of purely mechanical Schrödinger-cat states and highly coherent mechanical qubits.", "url": "https://arxiv.org/abs/2611.34345", "type": "理论", "summary": "在单量子水平上操纵物理系统通常需要非谐波能谱。然而，纳米机械谐振器通常被认为是单声子体系中的线性物体，因此促使大多数努力以增加弛豫和退相干通道为代价来采用外部非线性源。在这里，我们通过直接利用强大的固有机械非线性来采取完全不同的方法。我们使用基于弯曲模式之间耦合的新颖方法来量化这种非线性。使用这种技术，我们建立了 34.0 +/- 9.7 声子的上限，用于内在机械双稳态的开始。此外，我们还重点介绍了一种基于向上屈曲纳米管谐振器机械偏振角的新调谐机制，使我们能够达到最佳工作点。将这种内在非线性水平外推到实际上更短的谐振器表明单声子克尔状态是可以实现的，从而可以实现纯机械薛定谔猫状态和高度相干的机械量子位。", "authors": [{"name": "S. Klingel"}, {"name": "T. Althuon"}, {"name": "C. Wassmer"}, {"name": "C. Sürgers"}, {"name": "T. Cubaynes"}, {"name": "W. Wernsdorfer"}], "featured_authors": [{"name": "S. Klingel"}, {"name": "T. Althuon"}, {"name": "C. Wassmer"}, {"name": "C. Sürgers"}, {"name": "T. Cubaynes"}, {"name": "W. Wernsdorfer"}], "author_count": 6}, {"id": "2611.34356", "category": "cond-mat", "title": "Electronic topological modes in hexagonal NbSi$_{2}$ with a double helix", "abstract": "Chiral systems can host nontrivial topological states, including characteristic edge modes and Fermi arcs. Here, we investigate the electronic properties of hexagonal NbSi$_2$ with chiral symmetry using first-principles calculations for both bulk and slab geometries. We find that spin--orbit coupling (SOC) is relatively weak. Notably, the topological edge state originates from structural chirality rather than the SOC. From the Berry curvature analysis, we confirm the existence of Weyl points, some of which carry a Chern number of $\\pm 2$. Furthermore, we demonstrate the existence of chiral edge modes with extended Fermi arcs around high-symmetry points. Finally, we investigate the real-space localization using spatially resolved and site-dependent density of states (DOS). We demonstrate that the surface states can be exclusively associated with the chiral Si chains.", "url": "https://arxiv.org/abs/2611.34356", "type": "理论+数值", "summary": "手性系统可以承载非平凡的拓扑态，包括特征边缘模式和费米弧。在这里，我们使用块体和板坯几何形状的第一原理计算研究具有手性对称性的六方 NbSi$_2$ 的电子特性。我们发现自旋轨道耦合（SOC）相对较弱。值得注意的是，拓扑边缘态源自结构手性而不是 SOC。从贝里曲率分析中，我们证实了Weyl点的存在，其中一些点的陈数为$\\pm 2$。此外，我们证明了在高对称点周围具有扩展费米弧的手性边缘模式的存在。最后，我们使用空间解析和位点相关的态密度（DOS）研究真实空间定位。我们证明表面态可以专门与手性硅链相关。", "authors": [{"name": "Issam Mahraj"}, {"name": "Andrzej Ptok"}], "featured_authors": [{"name": "Issam Mahraj"}, {"name": "Andrzej Ptok"}], "author_count": 2}, {"id": "2611.34375", "category": "cond-mat", "title": "Spin-Orbit Coupling in Symmetry-Forbidden Reactions: A Selection Rule Tested on the Chalcogen Trimers", "abstract": "A reaction is forbidden by orbital symmetry when an occupied and an empty orbital of different symmetry change places along its path. With spin-orbit coupling orbitals become spinors, and those of two such orbitals can mix only if the orbitals differ by the symmetry of a rotation; the operator component of that symmetry couples ground state and diradical triplet. We test this rule on the ring opening of the chalcogen trimers O3 to Po3, where an in-plane and an out-of-plane orbital cross ($C_{2v}$ surfaces; NEVPT2, spin-orbit configuration interaction), by letting the operator components act separately. In Se3 and Te3 the component named by the rule alone lowers the barrier by 2.2 and 5.1 kcal/mol (complete operator: 2.2 and 5.2), the other two by 0.2 and 1.3 kcal/mol; in Po3 they contribute in second order. The triplet crosses the ground state 6.5 to 9.0 kcal/mol below the forbidden saddle. Spin-orbit coupling makes this crossing passable in O3 and S3 and, from Se3 on, merges the two states into one surface whose saddle lies 2.6, 5.5, and 13.1 kcal/mol lower. Molecular rotation obeys the same rule but is 6 to $2.8\\times 10^{3}$ times weaker, which bears on the lifetime predicted for cyclic ozone.", "url": "https://arxiv.org/abs/2611.34375", "type": "理论", "summary": "当不同对称性的占据轨道和空轨道沿其路径改变位置时，轨道对称性禁止反应。通过自旋轨道耦合，轨道变成旋量，并且只有当轨道的旋转对称性不同时，两个这样的轨道才能混合。该对称性的算子分量耦合基态和双自由基三重态。我们在硫属三聚体 O3 到 Po3 的开环上测试了这一规则，其中面内和面外轨道交叉（$C_{2v}$ 表面；NEVPT2，自旋轨道构型相互作用），通过让算子组件单独起作用。在 Se3 和 Te3 中，仅由规则命名的组分可将势垒降低 2.2 和 5.1 kcal/mol（完整运算符：2.2 和 5.2），其他两种则降低 0.2 和 1.3 kcal/mol；在 Po3 中，他们的贡献排在第二位。三重态在禁鞍以下 6.5 至 9.0 kcal/mol 处穿过基态。自旋轨道耦合使这种穿越在 O3 和 S3 中可以通过，并且从 Se3 开始，将两种状态合并到一个表面，其鞍点低 2.6、5.5 和 13.1 kcal/mol。\n\n分子旋转遵循相同的规则，但要弱 6 到 $2.8\\times 10^{3}$ 倍，这与循环臭氧的预测寿命有关。", "authors": [{"name": "Shadan Ghassemi Tabrizi"}], "featured_authors": [{"name": "Shadan Ghassemi Tabrizi"}], "author_count": 1}, {"id": "2611.34415", "category": "cond-mat", "title": "A Thermodynamically Consistent Model of a Rechargeable Salt-in-Polyelectrolyte Battery", "abstract": "We present an isothermal, thermodynamically consistent model of a salt-in-polyelectrolyte battery with intercalation and deintercalation reactions of cations occurring at the electrode-electrolyte interfaces under galvanostatic conditions. For the electrolyte, we consider polyelectrolytes, which are polyanions, with neutralizing cations (i.e., counterions) such as lithium, along with a monovalent salt containing the same cations. Models of batteries containing either a dual-ion-conductor (DIC) electrolyte (i.e., uncharged polymers with added salt) or a single-ion-conductor (SIC) electrolyte (i.e., charged polymers without added salt) emerge as limiting cases of this thermodynamically consistent model. Once the model is presented in its most general context, we make specific choices so that it captures well-known mechanisms. In particular, the governing diffusion equations recover Fick's law of diffusion, and the cation-transfer reaction rate is described by the Butler--Volmer equation. The DIC and SIC limiting cases provide a framework for comparing the corresponding batteries. One-dimensional DIC and SIC charge--discharge simulations at matched current and duration illustrate concentration redistribution, polarization, and electrode utilization. Numerical accuracy checks quantify sensitivity to discretization; distinct initial inventories qualify the comparison.", "url": "https://arxiv.org/abs/2611.34415", "type": "理论+数值", "summary": "我们提出了一种等温、热力学一致的盐包聚电解质电池模型，该模型在恒电流条件下在电极-电解质界面处发生阳离子的嵌入和脱嵌反应。对于电解质，我们考虑聚电解质，它是聚阴离子，具有中和阳离子（即抗衡离子），例如锂，以及含有相同阳离子的一价盐。包含双离子导体（DIC）电解质（即添加盐的不带电聚合物）或单离子导体（SIC）电解质（即不添加盐的带电聚合物）的电池模型是这种热力学一致模型的限制情况。一旦模型在最一般的背景下呈现，我们就会做出具体的选择，以便它捕获众所周知的机制。特别是，控制扩散方程恢复了菲克扩散定律，并且阳离子转移反应速率由巴特勒-沃尔默方程描述。 DIC 和 SIC 限制情况提供了比较相应电池的框架。\n\n在匹配电流和持续时间下的一维 DIC 和 SIC 充放电模拟说明了浓度重新分布、极化和电极利用率。数值准确性检查量化离散化的敏感性；不同的初始库存有资格进行比较。", "authors": [{"name": "Charlotte Beckford"}, {"name": "Rajeev Kumar"}, {"name": "Steven M. Wise"}], "featured_authors": [{"name": "Charlotte Beckford"}, {"name": "Rajeev Kumar"}, {"name": "Steven M. Wise"}], "author_count": 3}, {"id": "2611.34455", "category": "cond-mat", "title": "Exact Lyapunov spectrum and localization length of the multichannel disordered Schrödinger equation", "abstract": "We consider the multichannel Schrödinger equation, describing the evolution of $N$ transverse modes in a finite width wire, in the presence of a Gaussian white noise potential in the unitary symmetry class. For arbitrary energy $E$ and disorder strength $T$, we compute exactly the set of Lyapunov exponents $\\{ \\gamma_n(E,T) \\}_{1 \\leq n \\leq N}$ which define the decay rates of the wave functions. In the large energy regime, we recover that the Lyapunov exponents are equally spaced, as predicted by the so-called DMPK approach. However we show that this property breaks down at arbitrary energy, giving rise to a richer Lyapunov spectrum. We also uncover a direct relation between the localization length, given by the inverse of the smallest Lyapunov exponent, and the density of states. Our derivation relies on the analysis of matrix stochastic differential equation for a modified Riccati matrix.", "url": "https://arxiv.org/abs/2611.34455", "type": "理论", "summary": "我们考虑多通道薛定谔方程，描述在酉对称类中存在高斯白噪声势的情况下，有限宽度导线中 $N$ 横向模式的演化。对于任意能量 $E$ 和无序强度 $T$，我们精确计算定义波函数衰减率的李雅普诺夫指数 $\\{ \\gamma_n(E,T) \\}_{1 \\leq n \\leq N}$ 集合。在大能量体系中，我们发现 Lyapunov 指数是等距的，正如所谓的 DMPK 方法所预测的那样。然而，我们证明这种性质在任意能量下会分解，从而产生更丰富的李雅普诺夫谱。我们还揭示了由最小李亚普诺夫指数的倒数给出的局域长度与态密度之间的直接关系。我们的推导依赖于对修正 Riccati 矩阵的矩阵随机微分方程的分析。", "authors": [{"name": "Aurélien Grabsch"}], "featured_authors": [{"name": "Aurélien Grabsch"}], "author_count": 1}, {"id": "2611.34482", "category": "cond-mat", "title": "Seebeck and Hall effects in charge-neutral ballistic graphene as probes of electron-electron interactions", "abstract": "Electron-hole asymmetry of the Coulomb velocity renormalization is responsible for finite Seebeck and Hall coefficients in charge-neutral graphene. In the ballistic regime the thermopower is small, $0.1$--$1~\\mu$V/K, because the chemical-potential shift required by $n_e{=}n_h$ cancels its leading part. When the electron-electron scattering length falls below the sample length, the thermopower crosses over to a collision-dominated value of $4$--$10~\\mu$V/K, that is an order of magnitude larger. This crossover is a direct thermoelectric marker of the breakdown of ballistic transport and a baseline for identifying the Dirac fluid.", "url": "https://arxiv.org/abs/2611.34482", "type": "理论", "summary": "库仑速度重整化的电子空穴不对称性是电荷中性石墨烯中有限塞贝克和霍尔系数的原因。在弹道状态下，热电势很小，$0.1$--$1~\\mu$V/K，因为$n_e{=}n_h$所需的化学势移动抵消了其主导部分。当电子-电子散射长度低于样品长度时，热电势会达到 $4$--$10~\\mu$V/K 的碰撞主导值，即大一个数量级。这种交叉是弹道输运故障的直接热电标记，也是识别狄拉克流体的基线。", "authors": [{"name": "Z.Z. Alisultanov"}, {"name": "A.V. Kavokin"}], "featured_authors": [{"name": "Z.Z. Alisultanov"}, {"name": "A.V. Kavokin"}], "author_count": 2}, {"id": "2611.34500", "category": "cond-mat", "title": "LetzElPhC: an electron-phonon code for efficient exciton-phonon workflows", "abstract": "We present \\texttt{LetzElPhC}, an open-source software package that computes electron-phonon matrix elements from the output of density functional perturbation theory calculations performed with the \\texttt{Quantum ESPRESSO} code. By interfacing directly with the \\texttt{Yambo} code and exploiting crystal symmetries, \\texttt{LetzElPhC} enables a scalable workflow for evaluating exciton-phonon matrix elements while enforcing strict gauge consistency between one-electron Bloch states and Bethe-Salpeter excitonic wave functions across the full Brillouin zone. This symmetry-preserving approach avoids phase ambiguities and significantly reduces both computational costs and memory requirements. To support large-scale simulations on dense momentum grids, the package incorporates Fourier interpolation of dynamical matrices and perturbed Kohn-Sham potentials, accounting for long-range dipole and quadrupole interactions in both two- and three-dimensional materials, combined with multi-level parallelization and efficient parallel I/O. Together, these capabilities seamlessly complement the \\texttt{Yambo} code to enable first-principles simulations of phonon-assisted optical spectroscopies, which we demonstrate through applications to resonant Raman scattering in monolayer $\\text{WSe}_2$ and phonon-assisted luminescence in cubic AgBr.", "url": "https://arxiv.org/abs/2611.34500", "type": "理论+数值", "summary": "我们提出了 \\texttt{LetzElPhC}，一个开源软件包，它根据使用 \\texttt{Quantum ESPRESSO} 代码执行的密度泛函微扰理论计算的输出来计算电子声子矩阵元素。通过直接与 \\texttt{Yambo} 代码连接并利用晶体对称性，\\texttt{LetzElPhC} 实现了可扩展的工作流程，用于评估激子-声子矩阵元素，同时在整个布里渊区的单电子 Bloch 态和 Bethe-Salpeter 激子波函数之间强制执行严格的规范一致性。这种保持对称性的方法避免了相位模糊，并显着降低了计算成本和内存需求。为了支持密集动量网格上的大规模模拟，该软件包结合了动态矩阵的傅立叶插值和扰动 Kohn-Sham 势，考虑了二维和三维材料中的长程偶极子和四极子相互作用，并结合了多级并行化和高效并行 I/O。\n\n这些功能一起无缝补充了 \\texttt{Yambo} 代码，以实现声子辅助光学光谱的第一原理模拟，我们通过单层 $\\text{WSe}_2$ 中的共振拉曼散射和立方 AgBr 中的声子辅助发光的应用来演示这一点。", "authors": [{"name": "Muralidhar Nalabothula"}, {"name": "Ludger Wirtz"}], "featured_authors": [{"name": "Muralidhar Nalabothula"}, {"name": "Ludger Wirtz"}], "author_count": 2}, {"id": "2611.34532", "category": "cond-mat", "title": "Diffusion Effects on a Stochastic Amplifier Driven by the Square of a Gaussian Field: Discontinuous Transition to Intermittency", "abstract": "We study the effects of diffusion on the transition to intermittency in stochastic amplification driven by the square of a Gaussian field. The transition is characterized by an order parameter quantifying the spatial uniformity of the amplification. We consider a model in which the diffusion-amplification process is embedded in a random lattice of point absorbers in such a way that the Feynman-Kac formula is restricted to Brownian paths with a range not exceeding a finite cut-off. In this setting, with the Gaussian driving field in a wide class of physical interest, we show that diffusion-induced damping of the amplification is sufficiently strong to change the nature of the transition: from continuous in the absence of diffusion, to discontinuous in the presence of diffusion.", "url": "https://arxiv.org/abs/2611.34532", "type": "理论", "summary": "我们研究了扩散对高斯场平方驱动的随机放大向间歇性过渡的影响。该转变的特征在于量化放大的空间均匀性的阶参数。我们考虑一个模型，其中扩散放大过程嵌入点吸收体的随机晶格中，使得 Feynman-Kac 公式仅限于范围不超过有限截止的布朗路径。在这种情况下，随着高斯驱动场在广泛的物理兴趣中的应用，我们表明扩散引起的放大阻尼足够强，足以改变过渡的性质：从没有扩散时的连续，到存在扩散时的不连续。", "authors": [{"name": "Philippe Mounaix"}], "featured_authors": [{"name": "Philippe Mounaix"}], "author_count": 1}, {"id": "2611.34541", "category": "cond-mat", "title": "High-Throughput Orientation Extraction via Symmetry-Adapted Filters", "abstract": "An algorithm for finding the orientation of objects in an image that have a known rotational symmetry, the symmetry-adapted filter (SAF) algorithm, is presented. It is deterministic and training-free, which makes it fast and reproducible. A filter that encodes the known rotational symmetry and approximate peak width is centered on the symmetry center of the object of interest, masked to the region of interest, and rotated to maximize its inner product with the image. The approach is demonstrated on more than 20,000 small-angle neutron scattering images of a torque-driven skyrmion lattice. It is also demonstrated on atomically resolved real-space images, where mapping local atomic orientations enabled the identification of grains and grain boundaries and the quantification of lattice relaxation.", "url": "https://arxiv.org/abs/2611.34541", "type": "理论+数值", "summary": "提出了一种用于查找图像中具有已知旋转对称性的对象的方向的算法，即对称自适应滤波器 (SAF) 算法。它是确定性的且无需训练，这使得它快速且可重复。对已知旋转对称性和近似峰宽进行编码的滤波器以感兴趣对象的对称中心为中心，屏蔽到感兴趣区域，并旋转以最大化其与图像的内积。该方法在扭矩驱动斯格明子晶格的 20,000 多个小角度中子散射图像上进行了演示。它还在原子分辨率的真实空间图像上得到了证明，其中映射局部原子方向能够识别晶粒和晶界以及晶格弛豫的量化。", "authors": [{"name": "Caden Myers"}, {"name": "Yucong Chen"}, {"name": "Nathan Chalus"}, {"name": "Morten R. Eskildsen"}, {"name": "Tess Smidt"}, {"name": "Simon J. L. Billinge"}], "featured_authors": [{"name": "Caden Myers"}, {"name": "Yucong Chen"}, {"name": "Nathan Chalus"}, {"name": "Morten R. Eskildsen"}, {"name": "Tess Smidt"}, {"name": "Simon J. L. Billinge"}], "author_count": 6}, {"id": "2611.34551", "category": "cond-mat", "title": "EGQCA Code: automated high-throughput thermodynamic modeling of solid solutions", "abstract": "Modeling disordered systems from first principles across the full composition range is a long-standing computational challenge. We present a code package implementing the extended generalized quasichemical approximation (EGQCA), which describes solid solutions through the statistics of a finite set of clusters and enables their thermodynamic modeling at arbitrary compositions and temperatures. The package automates the complete workflow and interfaces with both DFT codes and universal machine-learned interatomic potentials (uMLIPs). We show that replacing DFT with uMLIPs reduces the cost of the cluster calculations by up to five orders of magnitude while preserving the thermodynamic predictions. To make computationally demanding properties tractable, we additionally introduce a cluster-selection algorithm that identifies the most relevant configurations. Together, these developments establish EGQCA as a fast and accurate framework for the thermodynamic modeling of solid solutions and a practical route toward high-throughput screening of disordered materials.", "url": "https://arxiv.org/abs/2611.34551", "type": "理论+数值", "summary": "根据第一原理在整个组成范围内对无序系统进行建模是一项长期存在的计算挑战。我们提出了一个实现扩展广义准化学近似（EGQCA）的代码包，它通过有限簇集的统计来描述固溶体，并使其能够在任意成分和温度下进行热力学建模。该软件包自动化了整个工作流程，并与 DFT 代码和通用机器学习原子间势 (uMLIP) 接口。我们证明，用 uMLIP 替换 DFT 可以将簇计算的成本降低多达五个数量级，同时保留热力学预测。为了使计算要求较高的属性易于处理，我们还引入了一种簇选择算法来识别最相关的配置。总之，这些进展使 EGQCA 成为固溶体热力学建模的快速、准确的框架，以及无序材料高通量筛选的实用途径。", "authors": [{"name": "Dominik Spath"}, {"name": "Luka Wibmer"}, {"name": "Kieran Bozier"}, {"name": "Ralf Meyer"}, {"name": "Eva Kogler"}, {"name": "Efisio Madeddu"}, {"name": "Chris Pickard"}, {"name": "Markus Aichhorn"}, {"name": "Simone Di Cataldo"}, {"name": "Luiz T. F. Eleno"}, {"name": "Christoph Heil"}, {"name": "Pedro N. Ferreira"}], "featured_authors": [{"name": "Dominik Spath"}, {"name": "Luka Wibmer"}, {"name": "Kieran Bozier"}, {"name": "Luiz T. F. Eleno"}, {"name": "Christoph Heil"}, {"name": "Pedro N. Ferreira"}], "author_count": 12}, {"id": "2611.34638", "category": "cond-mat", "title": "Frozen Phonons on Dense $\\mathbf{q}$-Grids Using Set Covers", "abstract": "Phonon dynamics determine a vast number of properties in the solid state, such as the heat capacity, thermal expansion, and thermal conductivity. Phonons are obtained through the dynamical matrix, which, in the frozen phonon approach, is calculated as a finite difference derivative of the analytical Hellmann-Feynman force. This approach unfortunately typically suffers from requiring very large supercells, even for modest $\\mathbf{q}$-grids. The non-diagonal supercell method remedies this issue by determining the smallest supercell commensurate with a given $\\mathbf{q}$-point, drastically reducing the supercell size, but in turn requiring a new supercell for each $\\mathbf{q}$-point on the grid. This introduces redundancy, however, since a single non-diagonal supercell may be commensurate with several $\\mathbf{q}$-points. In this work I present a method to determine a minimal set of supercells, such that every $\\mathbf{q}$-point on the grid is commensurate with at least one supercell. I present an algorithm to solve the problem and prove that it yields the optimal solution, before summarizing the algorithm using pseudocode. The scaling of the number of supercells with the density of the grid is discussed. Numerical results on a variety of systems show the significant computational advantage of the method, which increases with the density of the grid.", "url": "https://arxiv.org/abs/2611.34638", "type": "数值", "summary": "声子动力学决定了固态的大量特性，例如热容量、热膨胀和导热率。声子是通过动力学矩阵获得的，在冻结声子方法中，该矩阵被计算为解析赫尔曼-费曼力的有限差分导数。不幸的是，这种方法通常需要非常大的超级单元，即使对于适度的 $\\mathbf{q}$ 网格也是如此。非对角超晶胞方法通过确定与给定 $\\mathbf{q}$ 点相称的最小超晶胞来解决此问题，大大减小了超晶胞的大小，但反过来又需要为网格上的每个 $\\mathbf{q}$ 点创建一个新的超晶胞。然而，这引入了冗余，因为单个非对角超晶胞可能与多个 $\\mathbf{q}$ 点相当。在这项工作中，我提出了一种确定最小超单元集的方法，使得网格上的每个 $\\mathbf{q}$ 点都与至少一个超单元相称。在使用伪代码总结该算法之前，我提出了一种解决该问题的算法并证明它可以产生最佳解决方案。\n\n讨论了超级单元数量随网格密度的缩放。各种系统的数值结果显示了该方法的显着计算优势，该优势随着网格密度的增加而增加。", "authors": [{"name": "Sebastian Riis Thomsen"}], "featured_authors": [{"name": "Sebastian Riis Thomsen"}], "author_count": 1}, {"id": "2611.34665", "category": "cond-mat", "title": "Transverse Shifts Driven by Geometric Orbital Torque in Altermagnets", "abstract": "Anomalous transverse shifts in interface reflection are conventionally attributed to spin-orbit coupling or its pseudospin analogue. Here, we uncover a distinct geometric mechanism driven solely by an orbital torque arising from Fermi-surface anisotropy. During total reflection, an incident wave packet penetrates the anisotropic transmitted medium as an evanescent wave. There, the broken rotational symmetry about the interface normal exerts an orbital torque, and the accumulated angular impulse---the product of the torque and the dwell time---leads to a transverse spatial shift. Applying this mechanism to altermagnets without spin-orbit coupling, we show that the orbital torque is odd in spin. As a consequence, the two spin channels are deflected to opposite sides of the incident plane, giving an intrinsic spatial spin separation in altermagnets. The shift also inherits the angular symmetry of the altermagnetic spin splitting and is strongly enhanced near the onset of total reflection. Our work thus uncovers a new mechanism for transverse shifts, predicts a novel spin separation effect in altermagnets, and offers a direct probe of the altermagnetic order.", "url": "https://arxiv.org/abs/2611.34665", "type": "理论", "summary": "界面反射中的异常横向位移通常归因于自旋轨道耦合或其赝自旋类似物。在这里，我们发现了一种独特的几何机制，该机制仅由费米表面各向异性产生的轨道扭矩驱动。在全反射期间，入射波包作为倏逝波穿透各向异性透射介质。在那里，关于界面法线的破缺旋转对称性施加了轨道扭矩，并且累积的角脉冲（扭矩
