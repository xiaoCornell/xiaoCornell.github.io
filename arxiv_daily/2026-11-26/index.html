uipped with this, we use Gaussian wavefunctions of canonical pairs to construct a nonperturbative Hilbert space representation, for which this algebra generates a type I factor. By composing amplitudes between states prepared on null cones, we then obtain a Lorentzian path integral in which each sum over intermediate states converges absolutely. As a check, we compute the amplitude for graviton pair creation and annihilation on a null cone nonperturbatively in $G_N$ and find a finite closed form expression, even though expanding first in $G_N$ yields a logarithmic divergence. We next use diffeomorphism invariance of the path integral to show that a macroscopic causal diamond with a given maximum size has a finite dimensional Hilbert space. From the Lorentzian trace we obtain the Bekenstein Hawking entropy for marginally trapped surfaces and calculate its logarithmic correction for large Schwarzschild black holes, recovering at one loop the coefficient Sen obtained through Euclidean methods. We end by deriving the semiclassical Einstein equations to one loop as the low energy limit of this theory.", "url": "https://arxiv.org/abs/2611.34924", "type": "理论", "summary": "我们提出了四维洛伦兹时空中真空广义相对论的背景无关量子化。从一阶引力开始，我们求解块体子区域相交零锥的引力约束，并获得有限 $G_N$ 处的简化相空间。我们将其规范泊松括号推广为交换关系，并使用简化作用的变形来定义可观测量的代数。有了这个，我们使用规范对的高斯波函数来构造一个非微扰希尔伯特空间表示，该代数为此生成一个 I 型因子。通过组合零锥上准备的状态之间的幅度，我们可以获得洛伦兹路径积分，其中中间状态上的每个和绝对收敛。作为检查，我们在 $G_N$ 中非扰动地计算空锥上引力子对创建和湮灭的振幅，并找到有限封闭形式表达式，即使首先在 $G_N$ 中展开会产生对数散度。接下来，我们使用路径积分的微分同胚不变性来证明具有给定最大尺寸的宏观因果菱形具有有限维希尔伯特空间。\n\n从洛伦兹迹中，我们获得了边缘捕获表面的贝肯斯坦霍金熵，并计算了其对大型史瓦西黑洞的对数校正，在一个循环中恢复了通过欧几里得方法获得的系数 Sen。最后，我们将半经典爱因斯坦方程导出为一个循环，作为该理论的低能量极限。", "authors": [{"name": "Venkatesa Chandrasekaran"}], "featured_authors": [{"name": "Venkatesa Chandrasekaran"}], "author_count": 1}, {"id": "2611.33185", "category": "math-ph", "title": "A Coupled Thermomechanical Model with Volterra Memory: Influence of the Kernel Class on Relaxation Asymptotics", "abstract": "The aim of this study is to determine how the class and asymptotic behaviour of a Volterra memory kernel influence relaxation in a coupled thermomechanical model. The model describes the mutual interaction between an internal mechanical variable and temperature through temperature-dependent material properties and mechanical dissipation. The analysis combines a Volterra integral formulation, a spectral representation of the memory mechanism, thermodynamic decomposition of the hereditary power, local well-posedness analysis, linearization near equilibrium, and Laplace-transform asymptotic arguments. The spectral representation separates the energy stored in the relaxation modes from irreversible hereditary dissipation and establishes the thermodynamic consistency of the memory contribution. Under minimal assumptions on the constitutive functions and the kernel, local existence and uniqueness of solutions are obtained; for thermodynamically dissipative memory and a non-negative external heat source, positivity of the absolute temperature is preserved. The main result concerns the linearized dynamics near equilibrium: with the thermomechanical coupling kept unchanged, an exponential kernel produces exponential relaxation, whereas a power-law kernel with a long tail produces algebraic relaxation. A numerical comparison performed for the same set of dimensionless thermomechanical parameters illustrates these two asymptotic regimes. The results show that changing the class of the memory kernel alone can change the qualitative long-time relaxation law of the coupled system.", "url": "https://arxiv.org/abs/2611.33185", "type": "理论", "summary": "本研究的目的是确定 Volterra 内存内核的类别和渐近行为如何影响耦合热机械模型中的弛豫。该模型通过与温度相关的材料特性和机械耗散来描述内部机械变量与温度之间的相互作用。该分析结合了 Volterra 积分公式、记忆机制的谱表示、遗传力的热力学分解、局部适定性分析、接近平衡的线性化和拉普拉斯变换渐近论证。光谱表示将弛豫模式中存储的能量与不可逆遗传耗散分开，并建立了记忆贡献的热力学一致性。在本构函数和核的最小假设下，得到解的局部存在性和唯一性；对于热力学耗散记忆和非负外部热源，绝对温度的正值被保留。\n\n主要结果涉及接近平衡的线性动力学：在热机耦合保持不变的情况下，指数核产生指数弛豫，而长尾幂律核产生代数弛豫。对同一组无量纲热机械参数进行的数值比较说明了这两种渐近状态。结果表明，仅改变记忆核的类别就可以改变耦合系统的定性长时弛豫定律。", "authors": [{"name": "Andrii Siasiev"}], "featured_authors": [{"name": "Andrii Siasiev"}], "author_count": 1}, {"id": "2611.33186", "category": "math-ph", "title": "Time-reflection nonlocal equations from $\\mathcal{P}\\mathcal{T}$-symmetric oscillator pairs: physical origin and variational formulation", "abstract": "We show that every second-order differential equation with time reflection describes the $\\mathcal{P}\\mathcal{T}$-symmetric solutions of a local pair of oscillators that is invariant under exchange combined with time reversal. For linear equations the pair is built from springs, balanced gain and loss, and a gyroscopic coupling. We determine when such a pair has a regular first-order Lagrangian, and when the solutions of the equation fix its coefficients. As the main example, we consider a recently studied equation whose solutions do not depend on its velocity coupling. In the corresponding pair this coupling acts only on the conserved total momentum, which vanishes for $\\mathcal{P}\\mathcal{T}$-symmetric solutions, and each of the two conditions that single out the model places the pair at an exceptional point. When the spring and velocity couplings are both nonzero, the pair has no regular first-order Lagrangian, while the equation has one with second derivatives. We also propose an electronic realization and construct a Bateman-type Hamiltonian, from which the velocity coupling is removed by a canonical transformation.", "url": "https://arxiv.org/abs/2611.33186", "type": "理论", "summary": "我们证明，每个具有时间反射的二阶微分方程都描述了一对局部振子的 $\\mathcal{P}\\mathcal{T}$ 对称解，该解在交换和时间反转的情况下保持不变。对于线性方程，该对由弹簧、平衡增益和损耗以及陀螺仪耦合构成。我们确定这样的一对何时具有规则的一阶拉格朗日量，以及方程的解何时确定其系数。作为主要示例，我们考虑最近研究的一个方程，其解不依赖于其速度耦合。在相应的对中，这种耦合仅作用于守恒的总动量，对于 $\\mathcal{P}\\mathcal{T}$ 对称解，该总动量消失，并且挑选出模型的两个条件中的每一个都将该对置于异常点。当弹簧和速度耦合均非零时，该对不具有规则的一阶拉格朗日函数，而方程具有二阶导数。我们还提出了一种电子实现并构造了一个贝特曼型哈密顿量，通过规范变换消除了速度耦合。", "authors": [{"name": "Ilmar Gahramanov"}, {"name": "Yağızhan Şahin"}], "featured_authors": [{"name": "Ilmar Gahramanov"}, {"name": "Yağızhan Şahin"}], "author_count": 2}, {"id": "2611.33208", "category": "math-ph", "title": "A computer-assisted proof of one-cell snaking and lattice trapping for a nonlinear square lattice", "abstract": "We establish a computer-assisted proof of lattice trapping in an infinite nonlinear square lattice with interaction potential $\\phi(t)=(1-e^{-3t^2})/6$ and an antiplane crack far field $K\\sqrt{r}\\sin(\\theta/2)$. We construct a connected branch of equilibria whose single-cell segment contains exactly two nondegenerate quadratic folds, with a stability sequence of stable, Morse index one, and stable in the full energy space. The fold loads satisfy $0.45897<K_-<0.45923$ and $0.46219<K_+<0.46242$, establishing a strictly positive lattice-trapping width $K_+-K_->0.00296$. A uniqueness argument establishes exact translation closure and smooth continuation across lattice cells. The proof combines renormalized energy, Schur complement estimates, analytic infinite-tail bounds, interval arithmetic, and exact integer positivity certificates. All finite input data, verification programs, and recorded certificate outputs are provided in the accompanying certificate archive.", "url": "https://arxiv.org/abs/2611.33208", "type": "理论", "summary": "我们建立了无限非线性方晶格中晶格捕获的计算机辅助证明，其相互作用势 $\\phi(t)=(1-e^{-3t^2})/6$ 和反平面裂纹远场 $K\\sqrt{r}\\sin(\\theta/2)$。我们构建了一个平衡的连通分支，其单细胞段恰好包含两个非简并二次折叠，其稳定性序列为稳定、莫尔斯指数一和在全能量空间中稳定。折叠载荷满足 $0.45897<K_-<0.45923$ 和 $0.46219<K_+<0.46242$，建立严格正的晶格捕获宽度 $K_+-K_->0.00296$。唯一性论证建立了精确的平移闭包和跨晶格单元的平滑延续。该证明结合了重正化能量、Schur 补估计、解析无限尾界、区间算术和精确整数正性证明。所有有限输入数据、验证程序和记录的证书输出均在随附的证书档案中提供。", "authors": [{"name": "Jiangchao Qian"}], "featured_authors": [{"name": "Jiangchao Qian"}], "author_count": 1}, {"id": "2611.33224", "category": "math-ph", "title": "Bistable waves and propagation success on hexagonal lattice", "abstract": "Inspired by propagation phenomena occurring on media with hexagonal structures, we propose an idealized system of bistable reaction-diffusion equations posed on a hexagonal lattice, and investigate the existence and speed of traveling wave solutions. We establish a sharp criterion for propagation success (nonzero wave speed) and failure (zero wave speed), where the criterion is determined by an angle-dependent periodic threshold function and the ratio of two parameters in the nonlinearity. Moreover, the sign of the wave speeds is governed by the angle and the parameter ratio. Our results imply that the hexagonal structure and bistability significantly affect the propagation dynamics.", "url": "https://arxiv.org/abs/2611.33224", "type": "理论", "summary": "受六方结构介质上发生的传播现象的启发，我们提出了六方晶格上理想化的双稳态反应扩散方程组，并研究了行波解的存在性和速度。我们建立了传播成功（非零波速）和失败（零波速）的尖锐标准，其中该标准由角度相关的周期性阈值函数和非线性中两个参数的比率确定。此外，波速的符号由角度和参数比决定。我们的结果表明六方结构和双稳态显着影响传播动力学。", "authors": [{"name": "Jian Fang"}, {"name": "Yifei Li"}, {"name": "Yijun Lou"}, {"name": "Jian Wang"}], "featured_authors": [{"name": "Jian Fang"}, {"name": "Yifei Li"}, {"name": "Yijun Lou"}, {"name": "Jian Wang"}], "author_count": 4}, {"id": "2611.33570", "category": "math-ph", "title": "Equilibrium finiteness and Saari's conjecture for the planar circular restricted N-body problem", "abstract": "We establish two results for planar Newtonian centers in uniform rotation. First, the associated quadratic-plus-Newtonian amended potential has finitely many equilibria for every finite configuration of at least two distinct centers with positive masses. Second, every collision-free planar test-particle motion with constant amended potential, equivalently constant rotating-frame speed, is stationary in the rotating frame. When the centers are primary bodies in a circular relative equilibrium, this proves the amended-potential form of Saari's conjecture for the restricted \\(N\\)-body problem.", "url": "https://arxiv.org/abs/2611.33570", "type": "理论", "summary": "我们建立了匀速旋转平面牛顿中心的两个结果。首先，对于至少两个具有正质量的不同中心的每个有限配置，相关的二次加牛顿修正势具有有限多个平衡点。其次，每个具有恒定修正势（相当于恒定旋转框架速度）的无碰撞平面测试粒子运动在旋转框架中都是静止的。当中心是处于圆形相对平衡的主体时，这证明了萨里关于受限\\(N\\)体问题的猜想的修正势形式。", "authors": [{"name": "Qinglong Zhou"}], "featured_authors": [{"name": "Qinglong Zhou"}], "author_count": 1}, {"id": "2611.34033", "category": "math-ph", "title": "On the level lines of bilayer potentials with a finite number of harmonics", "abstract": "We consider ``bilayer'' potentials formed by the superposition of two periodic potentials in a plane. We assume that both potentials share the same rotational symmetry and employ an approximation involving a finite number of harmonics in their Fourier expansions. An analysis of the level lines of the resulting quasiperiodic potential (a problem posed by S.P. Novikov) near the percolation threshold makes it possible to describe the behavior of large-scale closed level lines in this limit. The results presented here can also be applied to broader classes of bilayer potentials that possess ``good'' analytical properties.", "url": "https://arxiv.org/abs/2611.34033", "type": "理论", "summary": "我们考虑由平面上两个周期性势叠加形成的“双层”势。我们假设两个势具有相同的旋转对称性，并采用涉及其傅里叶展开式中有限数量的谐波的近似。对渗流阈值附近产生的准周期势能级线（S.P.诺维科夫提出的问题）的分析使得描述该极限下大规模闭合能级线的行为成为可能。这里提出的结果也可以应用于具有“良好”分析特性的更广泛类别的双层势。", "authors": [{"name": "A.Ya. Maltsev"}], "featured_authors": [{"name": "A.Ya. Maltsev"}], "author_count": 1}, {"id": "2611.34110", "category": "math-ph", "title": "Colored Jones polynomial of figure eight knot and non-perturbative topological recursion", "abstract": "The asymptotic expansion of the colored Jones polynomial of the figure eight knot is proved to be connected with non-perturbative topological recursion on the underlying elliptic spectral curve, following the proposal of Borot and Eynard.", "url": "https://arxiv.org/abs/2611.34110", "type": "理论", "summary": "根据 Borot 和 Eynard 的建议，八字结的彩色琼斯多项式的渐近展开式被证明与基础椭圆谱曲线上的非微扰拓扑递归相关。", "authors": [{"name": "Alexander Hock"}, {"name": "Sergey Shadrin"}], "featured_authors": [{"name": "Alexander Hock"}, {"name": "Sergey Shadrin"}], "author_count": 2}, {"id": "2611.34114", "category": "math-ph", "title": "Schwinger-Dyson recursion, Gröbner elimination and graph combinatorics", "abstract": "Schwinger-Dyson equations are a cornerstone of quantum field theory (QFT). Derived using integration by parts, they capture relations between correlators of different orders, forming an open, infinite-dimensional system. In zero-dimensional QFTs with polynomial actions, which is just a physical interpretation for multivariate Gaussian integrals with polynomial insertions, conventional Gröbner elimination can be used to express all higher-order correlators (moments) in terms of a fixed basis set. One consequence is a closed finite-dimensional system of differential equations for the coupling dependence of these `master' correlators. An important application of zero-dimensional QFTs is in counting discrete geometric structures (as in simplicial approaches to quantum gravity). For the problem of counting labelled regular graphs, applying this Schwinger-Dyson closure results in a computational breakthrough relative to the existing state-of-the-art: for 9- and 10-regular graphs on $n$ vertices, a finite-depth, finite-width recursive formulation is obtained, making it possible to compute the total graph counts in $O(n)$ arithmetic operations.", "url": "https://arxiv.org/abs/2611.34114", "type": "理论", "summary": "施温格-戴森方程是量子场论 (QFT) 的基石。它们通过分部积分导出，捕获不同阶相关器之间的关系，形成一个开放的、无限维的系统。在具有多项式作用的零维 QFT 中，这只是具有多项式插入的多元高斯积分的物理解释，传统的 Gröbner 消去法可用于以固定基组表示所有高阶相关器（矩）。一个结果是这些“主”相关器的耦合依赖性的闭合有限维微分方程组。零维 QFT 的一个重要应用是计算离散几何结构（如量子引力的单纯方法）。对于标记正则图的计数问题，应用这种 Schwinger-Dyson 闭包带来了相对于现有最先进技术的计算突破：对于 $n$ 个顶点上的 9 和 10 正则图，获得了有限深度、有限宽度的递归公式，使得可以在 $O(n)$ 算术运算中计算总图计数。", "authors": [{"name": "Oleg Evnin"}], "featured_authors": [{"name": "Oleg Evnin"}], "author_count": 1}, {"id": "2611.34260", "category": "math-ph", "title": "Fundamental Symmetries in Krein Spaces", "abstract": "We study the space of fundamental symmetries of a real or complex Krein space in finite or infinite dimension. After recalling the equivalence of the associated Hilbert norms, we describe two global operator parametrizations and their relation. The space is realized as a Banach symmetric space under $m(J,J')=JJ'J$. Its canonical connection is the tangential projection of the flat derivative in the real Banach space of Krein-self-adjoint operators. This yields explicit formulas for geodesics, parallel transport, transvections, and curvature. The positive square roots $(JJ')^{1/2}$ implement both isometries between the associated Hilbert spaces and geodesic transvections. A proof of their intertwining property in an earlier publication is corrected.", "url": "https://arxiv.org/abs/2611.34260", "type": "理论", "summary": "我们研究有限或无限维实数或复数 Kerin 空间的基本对称空间。在回顾相关希尔伯特范数的等价性之后，我们描述了两个全局算子参数化及其关系。该空间在 $m(J,J')=JJ'J$ 下实现为 Banach 对称空间。其规范联系是克雷因自伴算子的实巴纳赫空间中平导数的切向投影。这产生了测地线、平行传输、横对流和曲率的明确公式。正平方根 $(JJ')^{1/2}$ 实现了关联的希尔伯特空间和测地横断面之间的等距。更正了早期出版物中它们相互交织的属性的证明。", "authors": [{"name": "Arkadiusz Jadczyk"}], "featured_authors": [{"name": "Arkadiusz Jadczyk"}], "author_count": 1}, {"id": "2611.34301", "category": "math-ph", "title": "The transverse spin-gradient approximation in noncollinear spin density functional theory", "abstract": "We prove a quantitative error bound for a fixed-axis variant of the transverse spin-gradient approximation (TSGA) in noncollinear spin density functional theory. Inspired by Eich and Gross, we use a spin-spiral wave (SSW) as the local reference for the grand-canonical Levy-Lieb energy with the Hartree term subtracted. We construct the thermodynamic limit of the electron gas with constant total density and a prescribed SSW magnetization. Its energy per unit volume $e_{\\rm SSW}$ is evaluated at the local wavevector $\\nabla\\varphi$, where $\\varphi$ is the spiral phase. When $\\varphi$ is the azimuthal angle of the magnetization $\\mathbf{m}=(m_1,m_2,m_3)$, the approximation reads \\[ E(\\rho,\\mathbf{m})\\approx\\int_{\\mathbb{R}^3}e_{\\rm SSW}\\big(\\rho(\\mathbf{x}),\\mathbf{m}(\\mathbf{x}),\\nabla\\varphi(\\mathbf{x})\\big)\\,d \\mathbf{x}. \\] Here $\\nabla\\varphi$ measures the local rotation of $\\mathbf{m}$ about the third axis. Wherever $m_1^2+m_2^2>0$, it equals $(m_1\\nabla m_2-m_2\\nabla m_1)/(m_1^2+m_2^2)$. The approximation thus depends only on the total density $\\rho$, the magnetization and its first derivatives. When the spin-polarized density in the rotating frame and the local wavevector vary on the length scale $N^{1/3}$, with $N$ the mean number of particles, we obtain an error $O(N^{5/6})$ for an energy of order $N$. Setting the phase to zero gives the noncollinear local spin density approximation (LSDA) for arbitrary magnetization directions.", "url": "https://arxiv.org/abs/2611.34301", "type": "理论", "summary": "我们证明了非共线自旋密度泛函理论中横向自旋梯度近似（TSGA）的固定轴变体的定量误差界。受 Eich 和 Gross 的启发，我们使用自旋螺旋波 (SSW) 作为减去 Hartree 项的大正则 Levy-Lieb 能量的局部参考。我们构建了具有恒定总密度和指定 SSW 磁化强度的电子气的热力学极限。其每单位体积的能量 $e_{\\rm SSW}$ 在局部波矢 $\\nabla\\varphi$ 处计算，其中 $\\varphi$ 是螺旋相位。当 $\\varphi$ 为磁化方位角 $\\mathbf{m}=(m_1,m_2,m_3)$ 时，近似值为 \\[ E(\\rho,\\mathbf{m})\\approx\\int_{\\mathbb{R}^3}e_{\\rm SSW}\\big(\\rho(\\mathbf{x}),\\mathbf{m}(\\mathbf{x}),\\nabla\\varphi(\\mathbf{x})\\big)\\,d \\mathbf{x}。 \\] 这里 $\\nabla\\varphi$ 测量 $\\mathbf{m}$ 绕第三轴的局部旋转。只要$m_1^2+m_2^2>0$，它就等于$(m_1\\nabla m_2-m_2\\nabla m_1)/(m_1^2+m_2^2)$。因此，近似值仅取决于总密度 $\\rho$、磁化强度及其一阶导数。\n\n当旋转坐标系中的自旋极化密度和局部波矢在长度尺度 $N^{1/3}$ 上变化时，其中 $N$ 是粒子的平均数量，我们会得到 $N$ 阶能量的误差 $O(N^{5/6})$。将相位设置为零可给出任意磁化方向的非共线局部自旋密度近似 (LSDA)。", "authors": [{"name": "Mihály A. Csirik"}], "featured_authors": [{"name": "Mihály A. Csirik"}], "author_count": 1}, {"id": "2611.34479", "category": "math-ph", "title": "Backpropagation as Dirac-bracket dynamics of dissipative training", "abstract": "Gradient-based training of a parametric model is the motion of a damped particle in the potential set by the loss. Using the Bateman-Galley doubling of the degrees of freedom, which gives dissipative systems an action principle, we write gradient flow, the heavy-ball method and Nesterov's accelerated gradient method as Hamiltonian systems. We show that, within this Hamiltonian description, backpropagation is Dirac evolution. The activations of a feed-forward network are treated as coordinates of phase space, and the layer equations as constraints. These constraints are second class for every architecture, and Hamilton's equations with the resulting Dirac bracket reproduce training with the exact gradient of the loss, although the Hamiltonian contains only the cost of the network output. The Dirac bracket of an activation with the momenta of the parameters is its Jacobian, the inverse of the constraint matrix contains both the forward and the reverse modes of automatic differentiation, and the errors propagated by backpropagation are the Lagrange multipliers of the layer constraints: the constraint forces of a kinematic chain under the load of the cost. These results hold in the full doubled phase space, not only in the physical limit. The network's part of the constraint algebra is the same for every optimizer, Nesterov's look-ahead adds one layer of momentum-dependent constraints that couple the two copies of the doubled system, and gradient flow is obtained by constructing the Dirac bracket in stages. We confirm these statements numerically to machine precision and train a network by integrating the Dirac flow of its constraints, with no backward pass in the computation.", "url": "https://arxiv.org/abs/2611.34479", "type": "理论", "summary": "参数模型的基于梯度的训练是阻尼粒子在由损失设置的势中的运动。利用 Bateman-Galley 自由度加倍，为耗散系统提供了作用原理，我们将梯度流、重球法和 Nesterov 加速梯度法写为哈密顿系统。我们证明，在哈密顿描述中，反向传播是狄拉克进化。前馈网络的激活被视为相空间的坐标，层方程被视为约束。这些约束对于每个架构来说都是第二类，并且哈密顿方程和由此产生的狄拉克括号再现了具有精确损失梯度的训练，尽管哈密顿量仅包含网络输出的成本。具有参数动量的激活的狄拉克括号是其雅可比行列式，约束矩阵的逆包含自动微分的正向和反向模式，反向传播传播的误差是层约束的拉格朗日乘子：运动链在成本负载下的约束力。\n\n这些结果在整个双相空间中成立，而不仅仅是在物理极限中。对于每个优化器来说，网络的约束代数部分都是相同的，Nesterov 的前瞻添加了一层动量相关约束，将双倍系统的两个副本耦合起来，并且通过分阶段构建狄拉克括号来获得梯度流。我们以数值方式确认这些陈述以达到机器精度，并通过整合其约束的狄拉克流来训练网络，而在计算中没有向后传递。", "authors": [{"name": "Nicolaus Linneu Holanda"}, {"name": "Ivan Eugenio Cunha"}], "featured_authors": [{"name": "Nicolaus Linneu Holanda"}, {"name": "Ivan Eugenio Cunha"}], "author_count": 2}, {"id": "2611.34553", "category": "math-ph", "title": "Distribution of the ratio of the two smallest eigenphases of the Jacobi unitary ensemble", "abstract": "We compute the joint distribution of the two smallest eigenvalues of the Jacobi unitary ensemble and the distribution of their ratio. We use a framework for calculating Janossy densities based on the Tracy-Widom system of ordinary differential equations. For the cases studied here, the leading finite-N correction to the ratio distribution, relative to its universal Bessel-kernel limit, is O(N^{-4}). This behaviour reflects a nontrivial cancellation of lower-order corrections present in the Jacobi kernel. Eigenphase ratios may thus reveal subtle finite-size effects in quantum-chaotic systems with particle-hole or chiral symmetry. As an exploratory arithmetic application, we compare the ratio distribution for the two lowest zeros of quadratic Dirichlet L-functions with the hard-edge limit for Sp(N). The data indicate that the N_{eff}^{-1} term vanishes, leaving an O(N_{eff}^{-2}) correction.", "url": "https://arxiv.org/abs/2611.34553", "type": "理论", "summary": "我们计算雅可比酉系综的两个最小特征值的联合分布及其比率分布。我们使用基于常微分方程 Tracy-Widom 系统的 Janossy 密度计算框架。对于此处研究的情况，相对于通用贝塞尔核极限，对比率分布的主要有限 N 修正为 O(N^{-4})。这种行为反映了雅可比核中存在的低阶校正的不平凡取消。因此，本征相比可以揭示具有粒子空穴或手性对称性的量子混沌系统中微妙的有限尺寸效应。作为探索性算术应用，我们将二次狄利克雷 L 函数的两个最低零点的比率分布与 Sp(N) 的硬边极限进行比较。数据表明 N_{eff}^{-1} 项消失，留下 O(N_{eff}^{-2}) 校正。", "authors": [{"name": "Shinsuke M. Nishigaki"}], "featured_authors": [{"name": "Shinsuke M. Nishigaki"}], "author_count": 1}, {"id": "2611.34557", "category": "math-ph", "title": "Bolognesi's Conjecture for Nonnegative-Charge Iterated Magnetic Bags", "abstract": "We establish a magnetic-bag limit for smooth $SU(2)$ Bogomolny monopoles associated with finitely many nested smooth surfaces in $\\mathbb{R}^3$. This proves Bolognesi's magnetic-bag conjecture for iterated magnetic bags with nonnegative charge density on each surface.", "url": "https://arxiv.org/abs/2611.34557", "type": "理论", "summary": "我们建立了与 $\\mathbb{R}^3$ 中有限多个嵌套光滑表面相关的光滑 $SU(2)$ Bogomolny 单极子的磁袋极限。这证明了博洛涅西的磁袋猜想，即每个表面上具有非负电荷密度的迭代磁袋。", "authors": [{"name": "Weifeng Sun"}, {"name": "Wenhan Wang"}], "featured_authors": [{"name": "Weifeng Sun"}, {"name": "Wenhan Wang"}], "author_count": 2}, {"id": "2611.34628", "category": "math-ph", "title": "The Zero Mode Constraint in the Dirac-Bergmann Analysis of Kadomtsev-Petviashvili Type Equations", "abstract": "We derive the Hamiltonian formulation of the Kadomtsev-Petviashvili (KP) equation from a singular Lagrangian by means of the Dirac-Bergmann algorithm. The Lagrangian contains an auxiliary field, which leads to an irregular secondary constraint. On the branch that reproduces the KP equation, all constraints are second class, and the Dirac brackets give the known Hamiltonian and Poisson operator. We confirm these results by the Faddeev-Jackiw method. Then, we consider fields periodic in the first spatial coordinate. In this case, the zero modes of the derivative operator lead to an additional secondary constraint on the mean of the potential. This constraint replaces the inverse derivative by its zero mean counterpart, and the resulting Hamiltonian is in accordance with the one of Reiman and Semenov-Tyan-Shanskii, up to normalization conventions. For decaying fields, the same condition is necessary for rapidly decreasing potentials to remain rapidly decreasing. We show that this constraint appears for a general class of KP-type equations. In addition, we classify the smooth solutions of the auxiliary-field action. We also relate our results to an existing quantization of the KP equation, for which the potential Lagrangian provides an action.", "url": "https://arxiv.org/abs/2611.34628", "type": "理论", "summary": "我们通过 Dirac-Bergmann 算法从奇异拉格朗日导出 Kadomtsev-Petviashvili (KP) 方程的哈密顿公式。拉格朗日包含一个辅助场，这会导致不规则的二次约束。在重现 KP 方程的分支上，所有约束都是第二类，狄拉克括号给出了已知的哈密顿算子和泊松算子。我们通过 Faddeev-Jackiw 方法确认了这些结果。然后，我们考虑第一个空间坐标中的周期性场。在这种情况下，导数算子的零模式导致对势均值的附加二次约束。该约束将逆导数替换为其零均值对应项，并且生成的哈密顿量符合 Reiman 和 Semenov-Tyan-Shanskii 的哈密顿量，符合归一化约定。对于衰减场，快速降低的电势需要相同的条件才能保持快速降低。我们证明这一约束出现在一般类 KP 型方程中。此外，我们对辅助场作用的光滑解进行了分类。\n\n我们还将我们的结果与 KP 方程的现有量化联系起来，势拉格朗日为此提供了一个作用。", "authors": [{"name": "Ali Pazarci"}], "featured_authors": [{"name": "Ali Pazarci"}], "author_count": 1}, {"id": "2611.34695", "category": "math-ph", "title": "Non-Existence of Eigenvalues and Interface States for the Schrödinger Operator with Longitudinal Interface Potentials", "abstract": "We consider the Schrödinger operator in $\\mathbb{R}^d$ with a flat interface separating two half-spaces in which the real potential varies only in the directions parallel to the interface. This problem generally possesses no shift invariance. Nevertheless, using the method of multipliers, we prove the absence of eigenvalues. In addition, in the case of periodic potentials on each side of the interface the same method shows the absence of interface states which are quasi-periodic in the directions parallel to the interface and localized in the transverse direction.", "url": "https://arxiv.org/abs/2611.34695", "type": "理论", "summary": "我们考虑 $\\mathbb{R}^d$ 中的薛定谔算子，其具有分隔两个半空间的平坦界面，其中实势仅在平行于界面的方向上变化。该问题一般不具有平移不变性。尽管如此，使用乘法器的方法，我们证明了特征值的不存在。此外，在界面每一侧都有周期性势的情况下，相同的方法表明不存在界面态，界面态在平行于界面的方向上是准周期性的并且集中在横向上。", "authors": [{"name": "Tomáš Dohnal"}, {"name": "Anton Lochmann"}], "featured_authors": [{"name": "Tomáš Dohnal"}, {"name": "Anton Lochmann"}], "author_count": 2}, {"id": "2611.34796", "category": "math-ph", "title": "Discotic columnar phase in a three-dimensional monomer-tetramer model of Heilmann and Lieb with side-to-side attraction", "abstract": "We study Model III of Heilmann--Lieb (1979), a lattice model for liquid crystals consisting of tetramers (plaquettes) on the cubic lattice at chemical potential $\\mu$, interacting via a hard-core repulsion and a lateral attraction of strength $a>0$ between coplanar, aligned tetramers. The model was conjectured to exhibit liquid-crystalline order at low temperature provided that $\\mu+2a>0$. We establish discotic columnar order throughout this regime, fully resolving the conjecture. Specifically, we prove the existence of exactly twelve extremal and periodic Gibbs measures, each breaking rotational symmetry, with one of three tetramer orientations dominant, and translational symmetry in exactly two directions, with one of four tetramer parities dominant within that orientation. Thus, the tetramers form one-dimensional columns arranged on a square lattice. This arrangement is not a priori evident from the zero-temperature picture, where energy only enforces a layered structure: each layer is fully packed and crystalline, but different layers are free to shift independently within their planes. The main novelty here lies in showing how thermal fluctuations lift this degeneracy in favor of the twelve ground states in which all tetramers share a common parity.", "url": "https://arxiv.org/abs/2611.34796", "type": "理论", "summary": "我们研究了 Heilmann--Lieb (1979) 的模型 III，这是一种液晶晶格模型，由化学势为 $\\mu$ 的立方晶格上的四聚体（斑块）组成，通过共面、对齐的四聚体之间的硬核排斥和强度 $a>0$ 的横向吸引力相互作用。据推测，只要 $\\mu+2a>0$，该模型就会在低温下表现出液晶有序性。我们在整个政权中建立了盘状柱状秩序，完全解决了这个猜想。具体来说，我们证明了恰好十二个极值和周期性吉布斯测度的存在，每个吉布斯测度都打破旋转对称性，三个四聚体方向之一占主导地位，并且在两个方向上具有平移对称性，四个四聚体宇称之一在该方向内占主导地位。因此，四聚体形成排列在方形晶格上的一维柱。这种排列在零温度图像中并不是先验明显的，在零温度图像中，能量仅强制形成层状结构：每一层都完全堆积且结晶，但不同的层可以在其平面内独立地自由移动。\n\n这里的主要新颖之处在于展示热波动如何提升这种简并性以有利于所有四聚体共享共同宇称的十二个基态。", "authors": [{"name": "Qidong He"}], "featured_authors": [{"name": "Qidong He"}], "author_count": 1}, {"id": "2611.34827", "category": "math-ph", "title": "Slow information spreading in quasi-periodic quantum spin chains", "abstract": "We investigate the suppression of information propagation in a weakly interacting quantum spin chain subject to a quasi-periodic external magnetic field. Using a finite-order normal-form construction, we establish a localized barrier in the interior of the chain that inhibits information propagation and derive a quantitative bound on the commutator of observables supported at opposite ends of the chain.", "url": "https://arxiv.org/abs/2611.34827", "type": "理论", "summary": "我们研究了准周期性外部磁场作用下弱相互作用量子自旋链中信息传播的抑制。使用有限阶范式构造，我们在链内部建立了一个局部屏障，抑制信息传播，并得出链两端支持的可观察量交换器的定量界限。", "authors": [{"name": "Yingte Sun"}], "featured_authors": [{"name": "Yingte Sun"}], "author_count": 1}, {"id": "2611.34845", "category": "math-ph", "title": "Sharp constant in 2D critical fermionic Hardy inequality", "abstract": "We study the large-$N$ behavior of the optimal constant $\\kappa_N$ in the two-dimensional fermionic many-particle Hardy inequality \\[ \\sum_{i=1}^N -\\Delta_i \\geq \\kappa_N^{(2)}\\sum_{1\\leq i<j\\leq N}\\frac{1}{|x_i-x_j|^2}, \\] understood as a quadratic-form inequality on antisymmetric wave functions. We prove that \\[ \\lim_{N\\to\\infty}(\\log N)\\kappa_N^{(2)}=4, \\] thereby proving a conjecture of Frank, Hoffmann-Ostenhof, Laptev, and Solovej. The proof combines a dyadic Fefferman-de la Llave representation of the Coulomb kernel with separate estimates for squares of low and high particle occupation. A trace inequality controls the low-occupation regime, while sums of Neumann eigenvalues yield the sharp bound in the high-occupation regime.", "url": "https://arxiv.org/abs/2611.34845", "type": "理论", "summary": "我们研究二维费米子多粒子 Hardy 不等式 \\[ \\sum_{i=1}^N -\\Delta_i \\geq \\kappa_N^{(2)}\\sum_{1\\leq i<j\\leq N}\\frac{1}{|x_i-x_j|^2}, \\] 中最优常数 $\\kappa_N$ 的大 $N$ 行为，理解为反对称波上的二次型不等式功能。我们证明了 \\[ \\lim_{N\\to\\infty}(\\log N)\\kappa_N^{(2)}=4, \\] 从而证明了 Frank、Hoffmann-Ostenhof、Laptev 和 Solovej 的猜想。该证明将库仑核的二元 Fefferman-de la Llave 表示与低粒子占据平方和高粒子占据平方的单独估计结合起来。微量不等式控制低占用状态，而诺伊曼特征值之和在高占用状态中产生锐界。", "authors": [{"name": "Marvin R. Schulz"}], "featured_authors": [{"name": "Marvin R. Schulz"}], "author_count": 1}, {"id": "2611.33270", "category": "quant-ph", "title": "Sharp one-shot bounds and optimal exponents of universal randomness extraction", "abstract": "We introduce techniques for the study of randomness extraction against quantum side information (privacy amplification) by relating this problem to variants of hypothesis testing tasks with quadratic constraints. Building also on the recently introduced measured smooth entropy approach of [Regula and Tomamichel, arXiv:2603.04493 ], we precisely determine the optimal scaling of the error of quantum privacy amplification in several regimes. Our results apply to the standard operational security criterion based on trace distance and focus in particular on universal classes of hash functions. On the technical side, our investigation reveals connections with operator space theory methods used in non-commutative Khintchine inequalities. As one application, we give a one-shot converse bound that shows the leftover hash lemma of [ arXiv:2603.04493 ] to be tight up to a constant factor for all strongly 4-universal hash functions. This allows us to evaluate the asymptotic i.i.d. error exponent of universal randomness extraction for all rates, matching the bound of [Dupuis, arXiv:2105.05342 ] and improving also earlier classical asymptotic results of [Hayashi, arXiv:1010.1358 ]. We furthermore give new one-shot achievability and converse bounds on the error in the strong converse regime, which we show to match up to a constant factor. This establishes the exact strong converse exponent of quantum privacy amplification under 2-universal hash functions, complementing the converse bound of [Shen, Gao, and Cheng, arXiv:2202.10263 ].", "url": "https://arxiv.org/abs/2611.33270", "type": "理论+数值", "summary": "我们通过将这个问题与具有二次约束的假设检验任务的变体联系起来，介绍了针对量子辅助信息（隐私放大）的随机性提取研究技术。还基于最近引入的测量平滑熵方法 [Regula 和 Tomamichel, arXiv:2603.04493]，我们精确地确定了几种情况下量子隐私放大误差的最佳缩放比例。我们的结果适用于基于跟踪距离的标准操作安全标准，并特别关注散列函数的通用类。在技​​术方面，我们的研究揭示了与非交换辛钦不等式中使用的算子空间理论方法的联系。作为一个应用程序，我们给出了一个一次性逆界，它显示了 [ arXiv:2603.04493 ] 的剩余哈希引理对于所有强 4-通用哈希函数来说都严格达到常数因子。这使我们能够评估渐近独立同分布。所有速率的通用随机性提取的误差指数，匹配 [Dupuis, arXiv:2105.05342 ] 的界限并改进 [Hayashi, arXiv:1010.1358 ] 的早期经典渐近结果。\n\n我们还给出了新的一次性可实现性和强逆机制中误差的逆界限，我们证明它与一个常数因子相匹配。这在 2-通用哈希函数下建立了量子隐私放大的精确强逆指数，补充了 [Shen、Gao 和 Cheng，arXiv:2202.10263] 的逆界。", "authors": [{"name": "Bartosz Regula"}, {"name": "Hao-Chung Cheng"}], "featured_authors": [{"name": "Bartosz Regula"}, {"name": "Hao-Chung Cheng"}], "author_count": 2}, {"id": "2611.33312", "category": "quant-ph", "title": "Gauge symmetry permits extremely low-depth random unitary circuits", "abstract": "Continuous global symmetries can obstruct logarithmic-depth symmetric unitary $k$-designs and pseudorandom unitaries (PRUs) through long-range correlations. We ask whether gauge symmetries impose analogous limitations. For $\\mathrm{U}(1)$ lattice gauge theories, we identify a randomization scale $c$, the minimum patch size needed for matter to screen every allowed boundary-flux mismatch, and a diffusive scale governing boundary-flux correlations. Glued circuits built from gauge-symmetric unitaries with subdiffusive support are efficiently distinguishable from gauge-symmetric Haar-random unitaries, whereas local controlled designs can be glued into global approximate designs when overlaps exceed the diffusive scale multiplied by a logarithmic factor. Our analysis suggests incomplete screening limits design guarantees to constant order, whereas strictly locally random systems with complete local screening ($c=1$) admit a local tensor-product description, permitting superpolynomial design orders and logarithmic-depth designs and PRUs. We construct a toy model of charged black-hole evaporation in which insufficient screening makes uninterrupted complete discharge exponentially unlikely in $c$, whereas strict local randomization removes this screening obstruction. This motivates a quantum-information analogue of the weak gravity conjecture, requiring the available charged spectrum to support complete local screening in addition to superextremality. We conjecture that this condition allows gauge-symmetric systems to scramble as rapidly as unconstrained ones and support this by constructing logarithmic-depth approximate strong designs and strong PRUs.", "url": "https://arxiv.org/abs/2611.33312", "type": "理论", "summary": "连续全局对称性可能会通过长程相关性阻碍对数深度对称酉 $k$ 设计和伪随机酉 (PRU)。我们询问规范对称性是否会施加类似的限制。对于 $\\mathrm{U}(1)$ 晶格规范理论，我们确定了一个随机化尺度 $c$，即物质筛选每个允许的边界通量不匹配所需的最小斑块大小，以及控制边界通量相关性的扩散尺度。由具有次扩散支持的规范对称幺正构建的粘合电路可以有效地与规范对称哈尔随机酉区分，而当重叠超过扩散尺度乘以对数因子时，局部控制设计可以粘合到全局近似设计中。我们的分析表明，不完全筛选将设计保证限制为恒定阶数，而具有完全局部筛选 ($c=1$) 的严格局部随机系统允许局部张量积描述，允许超多项式设计阶数和对数深度设计和 PRU。\n\n我们构建了一个带电黑洞蒸发的玩具模型，其中筛选不足使得在 $c$ 中不间断完全放电的可能性呈指数级下降，而严格的局部随机化消除了这种筛选障碍。这激发了弱引力猜想的量子信息模拟，除了超极值之外，还需要可用的带电频谱来支持完整的局部筛选。我们推测，这种条件允许规范对称系统与无约束系统一样快速地置乱，并通过构建对数深度近似强设计和强 PRU 来支持这一点。", "authors": [{"name": "Yunfei Wang"}, {"name": "Yuqing Li"}, {"name": "Junqi Wang"}, {"name": "Alexey V. Gorshkov"}, {"name": "Junyu Liu"}], "featured_authors": [{"name": "Yunfei Wang"}, {"name": "Yuqing Li"}, {"name": "Junqi Wang"}, {"name": "Alexey V. Gorshkov"}, {"name": "Junyu Liu"}], "author_count": 5}, {"id": "2611.33317", "category": "quant-ph", "title": "When does a noisy Bell pair attain the Rains bound?", "abstract": "Two entangled Bell-diagonal qubit states with the same singlet fraction have the same Rains bound. We prove that their attainable rates under operations preserving the positive partial transpose can nevertheless differ: the bound is attained if and only if one of the Bell probabilities vanishes. Every mixed entangled isotropic state, in every finite dimension, lies strictly below its bound. This refutes the attainment suggested by finite-block numerics, and places the two-way quantum capacity of the qubit depolarizing channel strictly below its relative-entropy bound.", "url": "https://arxiv.org/abs/2611.33317", "type": "理论", "summary": "具有相同单重态分数的两个纠缠贝尔对角量子位态具有相同的雷恩斯界。我们证明，在保留正部分转置的操作下，它们的可达到率仍然可以不同：当且仅当其中一个贝尔概率消失时，才达到界限。在每个有限维度中，每个混合纠缠各向同性状态都严格位于其边界以下。这反驳了有限块数值所暗示的成就，并将量子位去极化通道的双向量子容量严格置于其相对熵界限以下。", "authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "featured_authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "author_count": 2}, {"id": "2611.33340", "category": "quant-ph", "title": "Quantum Copy Complexity of Testing Monotonicity and Other Properties", "abstract": "We study the sample complexity of testing monotonicity of Boolean functions when the tester is given only copies of the quantum function state $|\\psi_f\\rangle=\\frac{1}{\\sqrt{2^n}}\\sum_{x\\in\\{0,1\\}^n}|x,f(x)\\rangle$. We give a tester with sample complexity $O\\left(\\min\\left\\{\\frac{n}{\\varepsilon^3}, \\frac{n^{3/2}}{\\varepsilon^2}\\right\\}\\right)$, improving on the previous $\\widetilde O(n^2/\\varepsilon^2)$ upper bound of [CNS26]. We also prove the first nontrivial lower bounds for monotonicity testing from quantum function states, matching our upper bounds over a broad range of $\\varepsilon$. Our upper bounds use two approaches. The first approach refines the Fourier-based tester of [CNS26] by handling high-influence functions separately, adapting an idea from [KMS18]. The second approach uses the classical path tester of [KMS18] by constructing a quantum observable whose expectation equals the path tester's violation probability. To prove the lower bounds, we place independent functions in mutually incomparable regions of the Boolean hypercube, building on the classical constructions of [BB16, CWX17]. We introduce a new argument for the quantum setting that replaces a fixed number of copies with a Poisson-distributed number of copies, allowing the contributions from different regions to be analyzed independently. This same framework also allows us to prove an $\\Omega(n^2)$ lower bound for testing union-closedness and $2$-monotonicity from quantum function states.", "url": "https://arxiv.org/abs/2611.33340", "type": "理论", "summary": "我们研究当测试人员仅获得量子函数状态 $|\\psi_f\\rangle=\\frac{1}{\\sqrt{2^n}}\\sum_{x\\in\\{0,1\\}^n}|x,f(x)\\rangle$ 的副本时，测试布尔函数单调性的样本复杂性。我们给出一个样本复杂度为 $O\\left(\\min\\left\\{\\frac{n}{\\varepsilon^3}, \\frac{n^{3/2}}{\\varepsilon^2}\\right\\}\\right)$ 的测试器，改进了之前的 [CNS26] 的 $\\widetilde O(n^2/\\varepsilon^2)$ 上限。我们还证明了量子函数态单调性测试的第一个非平凡下界，与广泛的 $\\varepsilon$ 上的上限相匹配。我们的上限使用两种方法。第一种方法通过单独处理高影响力函数来改进 [CNS26] 的基于傅里叶的测试器，采用 [KMS18] 的想法。第二种方法使用 [KMS18] 的经典路径测试器，通过构造一个量子可观测量，其期望等于路径测试器的违规概率。为了证明下界，我们在 [BB16，CWX17] 的经典结构的基础上，将独立函数放置在布尔超立方体的相互不可比较的区域中。\n\n我们为量子设置引入了一个新的论点，用泊松分布的副本数量代替固定数量的副本，从而可以独立分析不同区域的贡献。这个相同的框架还允许我们证明 $\\Omega(n^2)$ 下界，用于测试量子函数状态的联合封闭性和 $2$ 单调性。", "authors": [{"name": "Preksha Naik"}], "featured_authors": [{"name": "Preksha Naik"}], "author_count": 1}, {"id": "2611.33413", "category": "quant-ph", "title": "How Many Keys Must a Quantum Computer Break to Take Over a Blockchain? A Quantum Nakamoto Coefficient for Fifteen Proof-of-Stake Networks", "abstract": "Blockchains that run on proof of stake, among them Ethereum and Solana, are secured by a vote: a transaction becomes irreversible once computers holding two thirds of the deposited money have signed it. Each signature is made with a secret key whose public counterpart is permanently visible, and a large quantum computer could compute the secret from the public key. We ask a simple question: how many such keys would it have to break to take over the vote? We call the answer the quantum Nakamoto coefficient and measure it on live data from fifteen networks, collected on 15 November 2026. For fourteen of them, 2 to 18 keys are enough to break the network's security guarantee and 7 to 77 to control it outright; at one key every 12 minutes, the pace implied by recent resource estimates, a single quantum computer would defeat the guarantee of any of these networks in less than four hours and take full control in less than sixteen hours. Ethereum is far more robust, but a 2025 change that lets operators merge their deposits into fewer keys has cut the number of keys at its first threshold from about 465,000 to 7,682, a factor of 60. We derive a simple formula for this effect, and another for the small rotating committee on which wallets rely, and confirm both on the data. For fourteen of the fifteen networks, the first large quantum computer would be less than a day away from total control. Their validator signatures should therefore be migrated to post-quantum schemes before such a machine exists, since once it does, the time to respond is measured in hours.", "url": "https://arxiv.org/abs/2611.33413", "type": "理论", "summary": "基于权益证明运行的区块链（其中包括以太坊和 Solana）通过投票来保证安全：一旦持有三分之二存入资金的计算机签署了交易，交易就变得不可逆转。每个签名都是用一个秘密密钥制成的，其公共密钥永久可见，并且大型量子计算机可以根据公共密钥计算出秘密。我们问一个简单的问题：需要破解多少个这样的密钥才能接管投票？我们将答案称为量子中本聪系数，并根据 2026 年 11 月 15 日收集的 15 个网络的实时数据进行测量。对于其中 14 个网络，2 到 18 个密钥足以打破网络的安全保证，7 到 77 个密钥足以彻底控制它；按照最近的资源估计所暗示的速度，每 12 分钟一个密钥，一台量子计算机将在不到 4 小时的时间内击败任何这些网络的保证，并在不到 16 小时的时间内完全控制。以太坊要强大得多，但 2025 年的一项变化允许运营商将其存款合并为更少的密钥，这将第一个阈值的密钥数量从大约 465,000 个减少到 7,682 个，减少了 60 倍。\n\n我们为这种效应推导了一个简单的公式，为钱包所依赖的小型轮换委员会推导了另一个公式，并根据数据确认了这两个公式。对于 15 个网络中的 14 个，第一台大型量子计算机将在不到一天的时间内实现完全控制。因此，在这样的机器存在之前，他们的验证器签名应该迁移到后量子方案，因为一旦实现，响应时间以小时为单位。", "authors": [{"name": "Seyyed Mohammad Hassan Halataei"}], "featured_authors": [{"name": "Seyyed Mohammad Hassan Halataei"}], "author_count": 1}, {"id": "2611.33438", "category": "quant-ph", "title": "Estimating the Trotter error via phase analysis", "abstract": "Good Trotter error estimates are crucial to correctly assess the resources required to perform an approximate time evolution with a target accuracy. General bounds for finite-size quantum systems are found to be very loose in practice, and it is therefore highly desirable to improve on them. In this work, we analyze the Trotter error in terms of the spectrum of a phase operator that we construct from the Hamiltonian. In the limit of a small Trotter step size, we obtain an estimate of the Trotter error written in terms of a sum of nested commutators between terms of the Hamiltonian. The structure of this estimate allows us to naturally explain the looseness of general bounds. We show that even for a finite step size, our estimate typically remains more accurate than general bounds. Moreover, we argue that it becomes an upper bound for the Trotter error per step in the limit of a large number of steps, reflecting the destructive interference of the errors across steps. Our results provide useful practical heuristics for resource optimization in quantum simulations.", "url": "https://arxiv.org/abs/2611.33438", "type": "理论+数值", "summary": "良好的 Trotter 误差估计对于正确评估以目标精度执行近似时间演化所需的资源至关重要。在实践中发现有限尺寸量子系统的一般界限非常宽松，因此非常需要对其进行改进。在这项工作中，我们根据从哈密顿量构造的相位算子的频谱来分析 Trotter 误差。在 Trotter 步长较小的限制下，我们获得了 Trotter 误差的估计，该误差以哈密顿量项之间的嵌套换向器之和的形式表示。这个估计的结构使我们能够自然地解释一般界限的松散性。我们表明，即使对于有限的步长，我们的估计通常仍然比一般界限更准确。此外，我们认为，在大量步数的限制下，它成为每步 Trotter 误差的上限，反映了跨步误差的破坏性干扰。我们的结果为量子模拟中的资源优化提供了有用的实用启发法。", "authors": [{"name": "Maxime Dion"}, {"name": "Benjamin D'Anjou"}], "featured_authors": [{"name": "Maxime Dion"}, {"name": "Benjamin D'Anjou"}], "author_count": 2}, {"id": "2611.33454", "category": "quant-ph", "title": "A Realistic End-to-End Runtime Crossover Estimation for Quantum-Enhanced Training of Large-Scale Machine Learning Models", "abstract": "Machine Learning (ML) is one promising application domain for Quantum Computing (QC) speedups, but asymptotic complexity considerations often mask the actual engineering costs of actual end-to-end workflows. For the use case of training a linearized Neural Network with a Quantum Linear Solver, a provably favorable quantum scaling has been suggested. We present realistic resource estimates for this problem, accounting for data access, computation, and readout. Our analysis examines three increasingly complex benchmarking scenarios, under distinct sparsity-scaling assumptions, thereby enabling progressively more realistic resource estimates. We identify crossover regimes relative to classical methods and find that crossover points emerge only for very large problem sizes, long computation times, and highly restrictive output requirements. This work provides a blueprint for evaluating quantum-enhanced ML algorithms under realistic hardware constraints and help identifying the bottlenecks that must be overcome to approach industrial quantum utility.", "url": "https://arxiv.org/abs/2611.33454", "type": "理论+数值", "summary": "机器学习 (ML) 是量子计算 (QC) 加速的一个有前途的应用领域，但渐近复杂性考虑因素通常掩盖了实际端到端工作流程的实际工程成本。对于使用量子线性求解器训练线性化神经网络的用例，已经提出了一种经过证明有利的量子缩放。我们针对这个问题提出了现实的资源估计，考虑了数据访问、计算和读出。我们的分析在不同的稀疏缩放假设下检查了三种日益复杂的基准测试场景，从而实现了逐渐更加现实的资源估计。我们确定了与经典方法相关的交叉机制，并发现交叉点仅在问题规模非常大、计算时间长和输出要求高度限制的情况下出现。这项工作提供了在现实硬件限制下评估量子增强机器学习算法的蓝图，并帮助确定实现工业量子实用性必须克服的瓶颈。", "authors": [{"name": "Maximilian Alexander Wolf"}, {"name": "Alona Sakhnenko"}, {"name": "Florian Geissler"}, {"name": "Andrea Matic"}, {"name": "Jeanette Miriam Lorenz"}], "featured_authors": [{"name": "Maximilian Alexander Wolf"}, {"name": "Alona Sakhnenko"}, {"name": "Florian Geissler"}, {"name": "Andrea Matic"}, {"name": "Jeanette Miriam Lorenz"}], "author_count": 5}, {"id": "2611.33699", "category": "quant-ph", "title": "Dimensional crossover to a slow disordered spin bath below the mean spin spacing", "abstract": "How thin must a layer of spins be to act as a two-dimensional bath? For nitrogen spins around an NV$^-$ centre in diamond, a cluster expansion with flip-flopping outer spins gives a crossover near the mean spin spacing. Thin layers follow two-dimensional scaling with a prefactor six to seven times that of bulk. Without hyperfine disorder the crossover remains but the step is under three: the disorder leaves each spin almost no resonant partner. Flip-flops allow several milliseconds, so another process must set the measured 0.5 ms; nitrogen spin-lattice relaxation is consistent.", "url": "https://arxiv.org/abs/2611.33699", "type": "理论", "summary": "自旋层必须有多薄才能充当二维浴？对于围绕金刚石中 NV$^-$ 中心的氮自旋，具有翻转外自旋的簇扩展给出了接近平均自旋间距的交叉。薄层遵循二维缩放，其前置因子是块体的六到七倍。如果没有超精细无序，交叉仍然存在，但步骤低于三：无序使每个旋转几乎没有共振伙伴。触发器允许几毫秒，因此另一个进程必须设置测量的 0.5 毫秒；氮自旋晶格弛豫是一致的。", "authors": [{"name": "Chikara Shinei"}], "featured_authors": [{"name": "Chikara Shinei"}], "author_count": 1}, {"id": "2611.33730", "category": "quant-ph", "title": "Improved Quantum Algorithms for TSP and More", "abstract": "The traveling salesman problem (TSP) is a canonical NP-hard optimization problem. For general edge weights, the classical dynamic programs of Bellman and of Held and Karp solve TSP on $n$ cities in $O^*(2^n)$ time. To date, no $\\Oh(c^n)$-time classical algorithm is known for any $c<2$. Combining Grover search with the dynamic programming technique, Ambainis et al. (SODA 2019) introduced a quantum algorithm with running time $O^*(1.7274^n)$, which is still the best known quantum time bound. In this work, we improve the running time to $O^*(1.70961^n)$. The core idea of our algorithm is to combine the framework of Ambainis et al. with the extremal set-system framework, which was recently used for classical space-time tradeoffs of TSP by Jabal Ameli, Nederlof and Wang (FOCS 2026) and Dallant and Kozma (FOCS 2026). To obtain our upper bound, we decompose the optimal tour into four consecutive subpaths of different sizes, for which, based on the idea of set-systems, the optimal values are computed using dynamic programming with small success probability and use amplitude amplification. Using the same idea, we also give a new quantum space-time tradeoff for TSP, improving the previous results of Caroppo et al. (ESA 2026) and Dallant ( arXiv:2607.12374 ). Finally, we obtain the same quantum upper bounds for several other related problems.", "url": "https://arxiv.org/abs/2611.33730", "type": "理论+数值", "summary": "旅行商问题 (TSP) 是典型的 NP 难优化问题。对于一般边权重，Bellman 以及 Held 和 Karp 的经典动态程序在 $O^*(2^n)$ 时间内求解 $n$ 个城市的 TSP。迄今为止，还没有任何 $\\Oh(c^n)$ 次经典算法可用于任何 $c<2$。 Ambainis 等人将 Grover 搜索与动态规划技术相结合。 (SODA 2019) 引入了一种运行时间为 $O^*(1.7274^n)$ 的量子算法，这仍然是最著名的量子时间界限。在这项工作中，我们将运行时间提高到 $O^*(1.70961^n)$。我们算法的核心思想是结合Ambainis等人的框架。 Jabal Ameli、Nederlof 和 Wang (FOCS 2026) 以及 Dallant 和 Kozma (FOCS 2026) 最近将其用于 TSP 的经典时空权衡。为了获得上限，我们将最优路径分解为四个不同大小的连续子路径，其中，基于集合系统的思想，使用成功概率较小的动态规划来计算最优值，并使用幅度放大。\n\n使用相同的想法，我们还给出了 TSP 的新量子时空权衡，改进了 Caroppo 等人之前的结果。 (ESA 2026) 和 Dallant (arXiv:2607.12374)。最后，我们获得了其他几个相关问题的相同量子上限。", "authors": [{"name": "Masayuki Miyamoto"}], "featured_authors": [{"name": "Masayuki Miyamoto"}], "author_count": 1}, {"id": "2611.33806", "category": "quant-ph", "title": "QPAT: A Universal Quantum Machine Learning Framework for Quantum-Assisted Training and Classical Inference", "abstract": "Deep learning models often struggle with sharp local optima and overfitting in limited-data regimes, and exhibit limited capacity for capturing high-order, complex probability distributions. Quantum Machine Learning (QML) models, by operating in exponentially large Hilbert spaces, can efficiently represent such distributions and provide favorable inductive biases for learning, offering a promising pathway to overcome these limitations. However, their practical deployment in the Noisy Intermediate-Scale Quantum (NISQ) era is severely hindered by gradient coupling, barren plateaus, data-loading bottlenecks, and high inference latency. To bridge classical AI and QML, we propose QPAT (QCBM-Prior-Assisted Training), a universal framework that employs a Quantum Circuit Born Machine (QCBM) as a learnable generative prior to provide a task-aligned structured inductive bias during classical model training. The framework can be seamlessly integrated into any classical backbone, including LSTMs, CNNs, and Transformers. We introduce a decoupled fitness-based scoring mechanism and a stochastic \"Drop-Prior\" mechanism to implicitly distill quantum structural knowledge into the classical weights during training. Evaluated extensively on six benchmarks spanning time-series forecasting, computer vision, and natural language processing, our framework consistently outperforms purely classical backbones in both predictive performance and stability across random seeds; ablation studies further show that these gains are not reproduced by unstructured random priors or a classically learned generative prior. Remarkably, our approach enables completely classical inference, bypassing quantum latency while preserving quantum-enhanced accuracy, paving a highly practical path for QML deployment.", "url": "https://arxiv.org/abs/2611.33806", "type": "理论+数值", "summary": "深度学习模型通常会在有限的数据范围内遇到尖锐的局部最优和过度拟合，并且捕获高阶复杂概率分布的能力有限。量子机器学习（QML）模型通过在指数级大的希尔伯特空间中运行，可以有效地表示这种分布，并为学习提供有利的归纳偏差，为克服这些限制提供了一条有希望的途径。然而，它们在噪声中尺度量子（NISQ）时代的实际部署受到梯度耦合、贫瘠平台、数据加载瓶颈和高推理延迟的严重阻碍。为了连接经典 AI 和 QML，我们提出了 QPAT（QCBM-Prior-Assisted Training），这是一种通用框架，采用量子电路生成机（QCBM）作为可学习的生成器，在经典模型训练期间提供与任务对齐的结构化归纳偏差。该框架可以无缝集成到任何经典骨干网中，包括 LSTM、CNN 和 Transformer。\n\n我们引入了一种解耦的基于适应度的评分机制和一种随机的“Drop-Prior”机制，以在训练过程中将量子结构知识隐式地提取到经典权重中。我们的框架在涵盖时间序列预测、计算机视觉和自然语言处理的六个基准上进行了广泛评估，在随机种子的预测性能和稳定性方面始终优于纯经典骨干网；消融研究进一步表明，这些增益不能通过非结构化随机先验或经典学习的生成先验来重现。值得注意的是，我们的方法实现了完全经典的推理，绕过了量子延迟，同时保留了量子增强的准确性，为 QML 部署铺平了一条高度实用的道路。", "authors": [{"name": "Yixiong Chen"}], "featured_authors": [{"name": "Yixiong Chen"}], "author_count": 1}, {"id": "2611.33853", "category": "quant-ph", "title": "Efficient Quantum Algorithm for the Generalised Geography Game", "abstract": "The Generalized Geography Game ($GGG$) is a two-player combinatorial game played on a directed graph, where players alternately move a token along edges without revisiting previously visited vertices. In the existing literature, determining whether an arbitrary position in a graph is a winning position for either player is a well-known $PSPACE$-complete decision problem. Certain formulations of $GGG$ have been shown to fall outside the $PSPACE$-complete complexity class. While $PSPACE$-complete problems are believed to take exponential time for classical computation, quantum computation offers new possibilities. In this work, we present a bounded-error quantum polynomial-time ($BQP$) algorithm for solving the $GGG$ problem. The proposed algorithm runs in time $O(N^{2}/\\epsilon^{6})$, which is polynomial in the input size $N$, and achieves bounded error with $\\epsilon = O(1/\\mathrm{poly}(N))$. This result demonstrates the potential of quantum algorithms to efficiently solve combinatorial game problems that are traditionally considered computationally hard in the classical setting.", "url": "https://arxiv.org/abs/2611.33853", "type": "理论+数值", "summary": "广义地理游戏 ($GGG$) 是一种在有向图上进行的两人组合游戏，其中玩家沿着边缘交替移动标记，而无需重新访问之前访问过的顶点。在现有文献中，确定图中的任意位置是否是任一玩家的获胜位置是一个众所周知的 $PSPACE$ 完全决策问题。 $GGG$ 的某些公式已被证明不属于 $PSPACE$ 完全复杂性类别。虽然 $PSPACE$ 完整问题被认为对于经典计算来说需要指数时间，但量子计算提供了新的可能性。在这项工作中，我们提出了一种用于解决 $GGG$ 问题的有界误差量子多项式时间 ($BQP$) 算法。所提出的算法运行时间为 $O(N^{2}/\\epsilon^{6})$，它是输入大小 $N$ 的多项式，并通过 $\\epsilon = O(1/\\mathrm{poly}(N))$ 实现有界误差。这一结果证明了量子算法有效解决组合博弈问题的潜力，这些问题传统上在经典环境中被认为是计算困难的。", "authors": [{"name": "Mriganka Sandilya"}, {"name": "Shibdas Roy"}], "featured_authors": [{"name": "Mriganka Sandilya"}, {"name": "Shibdas Roy"}], "author_count": 2}, {"id": "2611.33854", "category": "quant-ph", "title": "Reproducible distributions of energy-relaxation times in superconducting qubits from broadband SWAP spectroscopy", "abstract": "The distribution of the qubit energy-relaxation time (T1) in a superconducting quantum processor affects its logical error rates. However, reports on qubit fabrication quality focus on the median or best-case T1 from measurements that are not reproducible due to resonant coupling to two-level system (TLS) defects whose frequencies fluctuate in time. Here, we sweep the frequency f01 of a flux-tunable qubit over several GHz with SWAP spectroscopy, quoting the quality factor Q = 2 pi f01 T1 to make T1 comparable across frequencies. We show that the cumulative distribution of Q pooled over the sweep is reproducible across four thermal cycles spanning 326 days, up to the reshuffling of strongly coupled TLSs. In contrast to repeated measurements at a single frequency, the medians of the broadband Q distributions spread by an order of magnitude less over 3 days. The distance between the cumulative distributions of repeats comes close to its sampling floor only for the broadband sweeps. The broadband Q distribution further resolves small coherence differences between identically designed qubits on two dies of the same wafer. These results establish the broadband Q distribution as a reproducible metric for qubit fabrication quality.", "url": "https://arxiv.org/abs/2611.33854", "type": "实验", "summary": "超导量子处理器中量子位能量弛豫时间 (T1) 的分布会影响其逻辑错误率。然而，有关量子位制造质量的报告重点关注测量中的中值或最佳情况 T1，由于与频率随时间波动的两能级系统 (TLS) 缺陷的共振耦合，这些测量结果不可再现。在这里，我们使用 SWAP 光谱扫描了几个 GHz 范围内的通量可调谐量子位的频率 f01，引用品质因数 Q = 2 pi f01 T1 以使 T1 在不同频率下具有可比性。我们证明了在扫描过程中汇集的 Q 的累积分布在跨越 326 天的四个热循环中是可重现的，直到强耦合 TLS 的重新洗牌。与单一频率下的重复测量相比，宽带 Q 分布的中值在 3 天内的扩展幅度小于一个数量级。仅对于宽带扫描，重复累积分布之间的距离才接近其采样底限。宽带 Q 分布进一步解决了同一晶圆的两个芯片上相同设计的量子位之间的微小相干性差异。\n\n这些结果将宽带 Q 分布确立为量子位制造质量的可重复指标。", "authors": [{"name": "Joaquin Minguzzi"}, {"name": "John Clai Owens"}, {"name": "Maximilien F. Debbas"}, {"name": "Ana Valdés-Curiel"}, {"name": "Ming-Han Chou"}, {"name": "Haifeng Qiao"}, {"name": "Shahriar Aghaeimeibodi"}, {"name": "Oskar Painter"}, {"name": "Matthew H. Matheny"}, {"name": "Loren J. Swenson"}], "featured_authors": [{"name": "Joaquin Minguzzi"}, {"name": "John Clai Owens"}, {"name": "Maximilien F. Debbas"}, {"name": "Oskar Painter"}, {"name": "Matthew H. Matheny"}, {"name": "Loren J. Swenson"}], "author_count": 10}, {"id": "2611.33888", "category": "quant-ph", "title": "Decoherent Histories from Local Spectral Dephasing in Quantum Many-Body Systems", "abstract": "We study local spectral dephasing as a mechanism for decoherent histories in isolated quantum many-body systems. We prove that vanishing projector-weighted spectral concentration is asymptotically equivalent to vanishing time-averaged local memory. With independently sampled waiting times and suitable conditions on the initial state and history weights, this local property suppresses normalized interference across complete fixed-length history families with high probability. For translation-invariant lattices, spectral estimates provide conditions under which dephasing occurs at long times. Exact diagonalization and sparse time evolution of a spin chain illustrate the results.", "url": "https://arxiv.org/abs/2611.33888", "type": "理论+数值", "summary": "我们研究局部光谱相移作为孤立量子多体系统中退相干历史的机制。我们证明，消失的投影仪加权光谱集中渐近等效于消失的时间平均本地记忆。通过独立采样的等待时间以及初始状态和历史权重的适当条件，该局部属性以高概率抑制完整的固定长度历史族之间的归一化干扰。对于平移不变晶格，谱估计提供了长时间发生相移的条件。自旋链的精确对角化和稀疏时间演化说明了结果。", "authors": [{"name": "Jie Gu"}], "featured_authors": [{"name": "Jie Gu"}], "author_count": 1}, {"id": "2611.33942", "category": "quant-ph", "title": "Empirical De-Quantization and Norm-Controlled Spectral Audit of Quantum Cognition Machine Learning in an Emerging Equity Market", "abstract": "Quantum-inspired machine learning in econophysics describes states of financial markets through matrix Hamiltonians, using ground-state expectations to predict returns and spectral gaps to identify crises. Although early work reports encouraging advances, it remains unclear whether these stem from genuine noncommutative quantum geometry or from conventional classical regularization and scale effects. We test this in a controlled audit of matrix-form Quantum Cognition Machine Learning (QCML) and variational quantum circuits on the Moscow Exchange (2020-2025), combining daily equity data with causally lagged macro news under realistic trading costs, short-selling bans, and abrupt shifts in market regimes. By using capacity-matched operator swaps -- which progressively eliminate complex Berry phases and matrix noncommutativity down to a commuting classical Gibbs radial-basis limit under scale-invariant regularization -- as well as testing spectral indicators against radial-norm null hypotheses and untrained GUE random matrices, we isolate the contribution of each quantum element. In out-of-sample data, neither complex phases, noncommutativity, nor circuit entanglement improves the ranking of returns relative to classical controls. Once feature magnitudes are normalized, apparent crisis detection from raw spectral gaps drops below chance levels. These results show that on noisy equity panels, matrix-form QCML acts as an adaptive spectrally bounded classical smoothing kernel: it reliably integrates lagged news and curbs extreme crisis forecasts without passing economic multiple-testing thresholds, while our audit provides operator-swap and random-matrix controls for evaluating future quantum-inspired financial models.", "url": "https://arxiv.org/abs/2611.33942", "type": "理论+数值", "summary": "经济物理学中受量子启发的机器学习通过矩阵哈密顿量描述金融市场的状态，使用基态期望来预测回报，并使用频谱差距来识别危机。尽管早期的工作报告了令人鼓舞的进展，但仍不清楚这些进展是源于真正的非交换量子几何还是传统的经典正则化和尺度效应。我们在莫斯科交易所（2020-2025）的矩阵形式量子认知机器学习（QCML）和变分量子电路的受控审计中对此进行了测试，将每日股票数据与现实交易成本、卖空禁令和市场制度突变下因果滞后的宏观新闻相结合。通过使用容量匹配算子交换（在尺度不变正则化下逐步消除复杂的 Berry 相和矩阵非交换性直至交换经典吉布斯径向基极限）以及针对径向范数零假设和未经训练的 GUE 随机矩阵测试谱指标，我们隔离了每个量子元素的贡献。\n\n在样本外数据中，复杂相、非交换性和电路纠缠都不会提高相对于经典控制的回报排名。一旦特征量级标准化，原始光谱间隙的明显危机检测就会下降到机会水平以下。这些结果表明，在嘈杂的股票面板上，矩阵形式的 QCML 充当自适应谱有界经典平滑内核：它可靠地整合滞后新闻并遏制极端危机预测，而无需通过经济多重测试阈值，而我们的审计提供了运算符交换和随机矩阵控制，用于评估未来量子启发的金融模型。", "authors": [{"name": "Pavel Chuklanov"}], "featured_authors": [{"name": "Pavel Chuklanov"}], "author_count": 1}, {"id": "2611.33955", "category": "quant-ph", "title": "Gaussian Is All You Need: Renyi Optimizers and Optical Channel Simulation", "abstract": "Preparing an entangled state faithfully requires an amount of resource given by its entanglement cost. With less entanglement, the best achievable fidelity is governed by the Rényi entanglement of formation of orders above one. We prove that, for any finite-energy multimode bosonic Gaussian state, all these quantities are additive and attained by a Gaussian pure-state decomposition. It follows that the closest separable state in fidelity to any Gaussian state is Gaussian, and that the strong converse exponent of entanglement dilution, which sets how fast the optimal fidelity decays below the cost, is exactly computable. For channels, we prove that pure Gaussian inputs minimize the output Rényi entropies of every multimode Gaussian channel at all orders $\\alpha\\ge1$, and we obtain the optimal fidelity of simulating pure-loss and quantum-limited amplifier channels with finite entanglement, for any number of uses.", "url": "https://arxiv.org/abs/2611.33955", "type": "理论+数值", "summary": "忠实地准备纠缠态需要由其纠缠成本给出的资源量。在纠缠较少的情况下，可实现的最佳保真度由高于一阶的 Rényi 纠缠形成。我们证明，对于任何有限能量多模玻色高斯态，所有这些量都是可加的，并且通过高斯纯态分解获得。由此可见，与任何高斯状态保真度最接近的可分离状态都是高斯状态，并且纠缠稀释的强逆指数（它设置最佳保真度衰减到成本以下的速度）是完全可计算的。对于通道，我们证明纯高斯输入可以最小化所有阶 $\\alpha\\ge1$ 下每个多模高斯通道的输出 Rényi 熵，并且我们获得了模拟具有有限纠缠的纯损耗和量子限制放大器通道的最佳保真度，适用于任意数量的用途。", "authors": [{"name": "Yuan Gao"}, {"name": "Gerardo Adesso"}], "featured_authors": [{"name": "Yuan Gao"}, {"name": "Gerardo Adesso"}], "author_count": 2}, {"id": "2611.33987", "category": "quant-ph", "title": "Unified preparation of exact and asymptotic quantum many-body scars from Dicke states", "abstract": "We propose a unified quantum algorithm for preparing exact and asymptotic quantum many-body scar (QMBS) states in the spin-1 {\\it XY}, domain-wall-conserving, and Onsager scar models. Model-dependent isometries map the exact scar states to Dicke states and the target asymptotic QMBS states to gapless magnon excitations of the spin-1/2 ferromagnetic Heisenberg chain. Exact QMBS states are prepared by applying the inverse isometries to Dicke states. For asymptotic QMBS states, block encoding first prepares the magnon excitations from Dicke states to a prescribed fidelity, after which the inverse isometries map the prepared states back to the physical chains. At fixed target fidelity, the block-encoding success probability has a positive lower bound independent of system size and scar index, implying that a constant number of amplitude amplification rounds suffices. Our algorithm enables systematic studies of nonergodic dynamics on programmable quantum simulators.", "url": "https://arxiv.org/abs/2611.33987", "type": "理论+数值", "summary": "我们提出了一种统一的量子算法，用于在 spin-1 {\\it XY}、畴壁守恒和 Onsager 疤痕模型中准备精确且渐进的量子多体疤痕 (QMBS) 态。模型相关的等距将精确的疤痕状态映射到迪克状态，并将目标渐近 QMBS 状态映射到自旋 1/2 铁磁海森堡链的无间隙磁振子激发。精确的 QMBS 状态是通过将逆等距应用于 Dicke 状态来准备的。对于渐近 QMBS 状态，块编码首先将 Dicke 状态的磁振子激励准备到规定的保真度，然后逆等距将准备好的状态映射回物理链。在固定目标保真度下，块编码成功概率具有独立于系统大小和疤痕指数的正下限，这意味着恒定数量的幅度放大轮数就足够了。我们的算法可以在可编程量子模拟器上系统地研究非遍历动力学。", "authors": [{"name": "Yuki Asari"}, {"name": "Masaya Kunimi"}, {"name": "Tetsuro Nikuni"}], "featured_authors": [{"name": "Yuki Asari"}, {"name": "Masaya Kunimi"}, {"name": "Tetsuro Nikuni"}], "author_count": 3}, {"id": "2611.34004", "category": "quant-ph", "title": "Discrete truncated Wigner approximation of the quantum phase transition in the transverse-field Ising model", "abstract": "The discrete truncated Wigner approximation (DTWA) has been a workhorse for large-scale spin dynamics, but whether it captures dynamics across a quantum phase transition has not been tested systematically. In this work, we use the transverse-field Ising model (TFIM) to study the quantum phase transition with DTWA from one to three dimensions and with all-to-all connectivity, using slow linear ramps and fast ramps. We find that DTWA cannot capture the dynamics on the one-dimensional chain, and that its behavior is consistent with classical thermalization, in which its classical spins relax toward a thermal state at a finite effective temperature that does not vanish for slow ramps, while a one-dimensional chain cannot order at any finite temperature. For square and cubic lattices, in contrast to the chain, DTWA builds order, and the order sets in close to the quantum critical point found by quantum Monte Carlo (QMC). However, its correlations do not grow with the Kibble-Zurek exponents, so DTWA captures the onset of order but not the universal dynamics of the transition. For all-to-all coupling, DTWA follows the exact growth of the order parameter along the entire ramp. Our results suggest that DTWA becomes more reliable as each spin interacts with more partners, and that beyond one dimension it can indicate where a quantum phase transition lies but cannot capture its critical scaling.", "url": "https://arxiv.org/abs/2611.34004", "type": "理论+数值", "summary": "离散截断维格纳近似（DTWA）一直是大规模自旋动力学的主力，但它是否捕获整个量子相变的动力学尚未得到系统测试。在这项工作中，我们使用横向场 Ising 模型 (TFIM) 通过慢线性斜坡和快速斜坡，通过 DTWA 从一维到三维以及全连接性来研究量子相变。我们发现 DTWA 无法捕获一维链上的动力学，并且其行为与经典热化一致，其中其经典自旋在有限有效温度下松弛到热状态，该温度不会因缓慢的斜坡而消失，而一维链不能在任何有限温度下有序。对于方晶格和立方晶格，与链相反，DTWA 构建顺序，并且顺序设置接近量子蒙特卡罗 (QMC) 发现的量子临界点。然而，它的相关性不会随着 Kibble-Zurek 指数的增长而增长，因此 DTWA 捕捉到了秩序的开始，但没有捕捉到转变的普遍动态。对于全对全耦合，DTWA 遵循阶次参数沿整个斜坡的精确增长。\n\n我们的结果表明，随着每次自旋与更多伙伴相互作用，DTWA 变得更加可靠，并且在一维之外它可以指示量子相变所在的位置，但无法捕获其关键尺度。", "authors": [{"name": "Tuan-Vu Truong"}, {"name": "Hoang-Long Nguyen"}], "featured_authors": [{"name": "Tuan-Vu Truong"}, {"name": "Hoang-Long Nguyen"}], "author_count": 2}, {"id": "2611.34040", "category": "quant-ph", "title": "Minimal input dimension for superactivation of one-shot zero-error quantum capacity", "abstract": "The one-shot zero-error quantum capacity $\\overline{Q}_0$ is studied within the framework of noncommutative graphs of quantum channels. The additivity of $\\overline{Q}_0$ is proved for an arbitrary finite collection of channels with two-dimensional input spaces. An explicit pair of noncommutative graphs $S,T\\subset M_3$ exhibiting superactivation of the one-shot zero-error quantum capacity is also constructed. Together, these results establish that the minimum input dimension for such superactivation is $3$.", "url": "https://arxiv.org/abs/2611.34040", "type": "理论", "summary": "在量子通道非交换图的框架内研究了一次性零误差量子容量$\\overline{Q}_0$。对于具有二维输入空间的任意有限通道集合，证明了 $\\overline{Q}_0$ 的可加性。还构造了一对显式非交换图 $S,T\\subset M_3$，展示了单次零误差量子容量的超激活。总之，这些结果表明这种超级激活的最小输入维度为 3 美元。", "authors": [{"name": "Andrei Shcherbakov"}], "featured_authors": [{"name": "Andrei Shcherbakov"}], "author_count": 1}, {"id": "2611.34060", "category": "quant-ph", "title": "Prethermalization of entanglement entropy in the mixed-field Ising model", "abstract": "We study how weak integrability breaking affects the dynamics of the half-chain entanglement entropy of random product states in the mixed-field Ising model. The associated Hamiltonian depends on two parameters $g$ and $h$ determining the sizes of the longitudinal and transverse fields and has two integrable limits: the classical Ising chain $(h=0)$ and the transverse-field Ising model $(g=0)$. Weak perturbations of these limits give rise to the short-range network (SRN) and long-range network (LRN) regimes, respectively. We characterize the departure from integrable dynamics and the emergence of intermediate entanglement plateaus by melting times $T_M$ at prescribed entropy thresholds and analyze their dependence on the perturbation strength. For the SRN parameters examined away from $g=2$, we find $T_M\\propto h^{-2}$ over the thresholds tested. At $g=2$, the relaxation splits into two stages: an initial departure from the integrable plateau with $T_M\\propto h^{-1}$, followed by the melting of a well-defined intermediate prethermal plateau with $T_{M_2}\\propto h^{-2}$. In the LRN regime, by contrast, the inverse of $T_M$ scales with exponents of $g$ close to either one or two, depending on the parameter values, the system size, and the entropy threshold, and no well-defined prethermal plateaus are observed. Our analysis distinguishes the melting of integrable dynamics from the subsequent decay of a prethermal plateau, which is observed in the SRN regime.", "url": "https://arxiv.org/abs/2611.34060", "type": "理论", "summary": "我们研究了弱可积破坏如何影响混合场伊辛模型中随机产物态的半链纠缠熵的动力学。相关的哈密顿量取决于两个参数 $g$ 和 $h$ 来确定纵向和横向场的大小，并具有两个可积限制：经典伊辛链 $(h=0)$ 和横向场伊辛模型 $(g=0)$。这些限制的弱扰动分别产生短程网络（SRN）和远程网络（LRN）机制。我们通过在规定的熵阈值下的熔化时间 $T_M$ 来表征可积动力学的偏离和中间纠缠平台的出现，并分析它们对扰动强度的依赖性。对于远离 $g=2$ 检查的 SRN 参数，我们发现 $T_M\\propto h^{-2}$ 超过了测试的阈值。在 $g=2$ 时，弛豫分为两个阶段：最初偏离 $T_M\\propto h^{-1}$ 可积平台，随后熔化 $T_{M_2}\\propto h^{-2}$ 明确的中间预热平台。\n\n相比之下，在 LRN 体系中，$T_M$ 的倒数与 $g$ 的指数接近 1 或 2，具体取决于参数值、系统大小和熵阈值，并且没有观察到明确定义的预热平台。我们的分析将可积动力学的熔化与随后在 SRN 体系中观察到的预热平台的衰变区分开来。", "authors": [{"name": "Miguel Gonzalez"}, {"name": "Budhaditya Bhattacharjee"}, {"name": "Alexei Andreanov"}, {"name": "Barbara Dietz"}, {"name": "Sergej Flach"}], "featured_authors": [{"name": "Miguel Gonzalez"}, {"name": "Budhaditya Bhattacharjee"}, {"name": "Alexei Andreanov"}, {"name": "Barbara Dietz"}, {"name": "Sergej Flach"}], "author_count": 5}, {"id": "2611.34066", "category": "quant-ph", "title": "A Path Integral Method with Far-Field Expansion for Open Quantum Dynamics", "abstract": "We establish a connection between the quasi-adiabatic propagator path integral (QuAPI) method and fast resummation of Dyson series (FRODS). Building on this connection, we introduce a path integral method with far-field expansion (PIFFE) for quantum systems coupled linearly to a thermal Gaussian bath. PIFFE combines QuAPI with a Taylor expansion of the far-field bath influence, keeping interactions within $r$ time steps in exponential form. The scheme has error $O(\\Delta t^2)$ at fixed final time and is free of stochastic or tensor-compression errors. Spin-boson tests show that PIFFE gives results much closer to QuAPI than FRODS does, even for small $r$, while requiring substantially less storage than QuAPI. This allows much longer bath memory lengths and simulations of multilevel systems. Truncating the bath memory and limiting the total auxiliary degree further reduce storage and computational costs.", "url": "https://arxiv.org/abs/2611.34066", "type": "数值", "summary": "我们在准绝热传播器路径积分（QuAPI）方法和戴森级数快速恢复（FRODS）之间建立了联系。在此基础上，我们引入了一种具有远场扩展（PIFFE）的路径积分方法，用于与热高斯浴线性耦合的量子系统。 PIFFE 将 QuAPI 与远场浴影响的泰勒展开相结合，以指数形式将交互保持在 $r$ 时间步长内。该方案在固定的最终时间有错误 $O(\\Delta t^2)$，并且不存在随机或张量压缩错误。自旋玻色子测试表明，PIFFE 给出的结果比 FRODS 更接近 QuAPI，即使对于较小的 $r$ 也是如此，同时所需的存储空间比 QuAPI 少得多。这允许更长的浴内存长度和多级系统的模拟。截断bath内存并限制总辅助度数进一步降低了存储和计算成本。", "authors": [{"name": "Zhenning Cai"}], "featured_authors": [{"name": "Zhenning Cai"}], "author_count": 1}, {"id": "2611.34170", "category": "quant-ph", "title": "Beyond-quantum correlations for single system in pseudo-quantum model", "abstract": "Within the standard prepare-measure framework, it has been demonstrated that certain compositions of two elementary quantum systems can produce beyond-quantum correlations and can even lead to perfect discrimination of two non-orthogonal quantum states. In this Letter, we introduce the pseudo-quantum model (PQM) for a single system that incorporates the \\emph{pseudo-states (effects)} (they satisfy all the properties of quantum states and effects except having negative eigenvalues), and yields valid probability. We consider a prepare-measure communication game known as random access code (RAC) and demonstrate that the success probability achievable within PQM exceeds the corresponding optimal quantum success probability, thereby giving rise to beyond-quantum correlations even for a single system. We then show that such correlations are unphysical as they violate the information causality (IC) principle. Moreover, we demonstrate that two non-orthogonal states can be perfectly distinguishable in PQM for a single system. Therefore, we demonstrate that for a single indivisible system (devoid of any composition), the negativity of \\emph{pseudo-states (effects)} can lead to the emergence of beyond-quantum correlations.", "url": "https://arxiv.org/abs/2611.34170", "type": "理论", "summary": "在标准的准备-测量框架内，已经证明两个基本量子系统的某些组成可以产生超量子相关性，甚至可以导致两个非正交量子态的完美区分。在这封信中，我们介绍了单个系统的伪量子模型（PQM），该系统包含 \\emph{伪状态（效应）}（它们满足量子态和效应的所有属性，除了负特征值之外），并产生有效概率。我们考虑一种称为随机访问码（RAC）的准备测量通信游戏，并证明 PQM 内可实现的成功概率超过了相应的最佳量子成功概率，从而即使对于单个系统也会产生超量子相关性。然后我们证明这种相关性是非物理的，因为它们违反了信息因果关系（IC）原则。此外，我们证明了单个系统的 PQM 中可以完全区分两个非正交状态。\n\n因此，我们证明，对于单个不可分割的系统（没有任何组成），\\emph{伪状态（效应）}的负性可以导致超量子相关性的出现。", "authors": [{"name": "Vishnu Purushothaman"}, {"name": "Akarshit Baranwal"}, {"name": "Rohit Sarma Sarkar"}, {"name": "A.K. Pan"}], "featured_authors": [{"name": "Vishnu Purushothaman"}, {"name": "Akarshit Baranwal"}, {"name": "Rohit Sarma Sarkar"}, {"name": "A.K. Pan"}], "author_count": 4}, {"id": "2611.34195", "category": "quant-ph", "title": "Scaling laws for quantum reflection of hydrogen isotopes on silicon", "abstract": "Quantum reflection is a counter-intuitive process occurring when an atom is reflected by a rapidly-varying attraction towards a surface, for example the Casimir-Polder force. The reflection probability depends on the attractive potential and on the mass of the atom. For hydrogen isotopes, the potentials are nearly identical whereas significant differences in quantum reflection come from the effect of atomic mass. We calculate the quantum reflection probability for the three isotopes H, D or T falling onto the plane surface of an intrinsic silicon bulk. We show that the results obey scaling laws determined by scattering lengths calculated from theory. Moreover the scattering lengths also obey scaling laws with respect to atomic masses of the isotopes.", "url": "https://arxiv.org/abs/2611.34195", "type": "理论", "summary": "量子反射是一种反直觉的过程，当原子被快速变化的吸引力反射到表面时，例如卡西米尔-波尔德力，就会发生这种过程。反射概率取决于吸引力势和原子质量。对于氢同位素，电势几乎相同，而量子反射的显着差异来自原子质量的影响。我们计算了三种同位素 H、D 或 T 落在本征硅体平面上的量子反射概率。我们证明结果遵循由理论计算的散射长度确定的比例定律。此外，散射长度也遵守同位素原子质量的比例定律。", "authors": [{"name": "Romain Guérout"}, {"name": "Serge Reynaud"}], "featured_authors": [{"name": "Romain Guérout"}, {"name": "Serge Reynaud"}], "author_count": 2}, {"id": "2611.34217", "category": "quant-ph", "title": "Geometry, masking and selection in Differential Evolution and SOMA on quantum state manifolds", "abstract": "Differential Evolution (DE) and the Self-Organizing Migrating Algorithm (SOMA) generate new candidates through vector arithmetic: they subtract population members, scale the difference, and mask coordinates. Many practical search spaces are not vector spaces, however. Rotation angles are periodic, normalized states lie on spheres and projective spaces, and circuit parameters are coupled through the quantum states they produce. We present a systematic study of how such geometry affects the core operations of DE and SOMA. Keeping the operators and selection rules fixed, we replace only their geometric primitives and separate the effects of difference construction, masking, and selection in a large paired numerical study covering textbook manifolds and variational quantum problems. Geometry-consistent differences make full-crossover (CR = 1) DE significantly better on 16 of 31 non-Euclidean configurations, with no significant deterioration, and the advantage persists when the measured computational cost of each variant is taken into account. The effect is largest where ordinary subtraction misrepresents distances between candidates: success on periodic synchronization rises from 44% to 100%, and on a positive-definite matrix problem from 1% to 99%. On six- qubit variational eigensolvers, shortest-path angular differences reduce the mean final loss by 90% for about 3% extra runtime. The improvements come with two contrasting diversity patterns, more effective population contraction or preserved population diversity, so higher acceptance rates do not necessarily indicate better search. Crossover masks interact with geometry: they can favor cheaper retractions and can increase the distance moved in quantum-state space when circuit parameters are coupled. These results give practical rules for designing population-based optimizers on non-Euclidean and quantum search spaces.", "url": "https://arxiv.org/abs/2611.34217", "type": "理论+数值", "summary": "差分进化 (DE) 和自组织迁移算法 (SOMA) 通过向量算术生成新的候选者：它们减去种群成员、缩放差异并掩码坐标。然而，许多实际的搜索空间不是向量空间。旋转角度是周期性的，归一化状态位于球体和射影空间上，电路参数通过它们产生的量子态进行耦合。我们对这种几何形状如何影响 DE 和 SOMA 的核心操作进行了系统研究。保持算子和选择规则固定，我们仅替换它们的几何基元，并在涵盖教科书流形和变分量子问题的大型配对数值研究中分离差异构造、掩蔽和选择的影响。几何一致的差异使得全交叉（CR = 1）DE 在 31 个非欧几里得配置中的 16 个上显着更好，并且没有显着恶化，并且当考虑到每个变体的测量计算成本时，优势仍然存在。\n\n当普通减法错误地表示候选者之间的距离时，效果最大：周期性同步的成功率从 44% 上升到 100%，正定矩阵问题的成功率从 1% 上升到 99%。在六量子位变分本征求解器上，最短路径角度差异可将平均最终损失降低 90%，并增加约 3% 的运行时间。这些改进伴随着两种截然不同的多样性模式，即更有效的种群收缩或保留的种群多样性，因此更高的接受率并不一定意味着更好的搜索。交叉掩模与几何形状相互作用：它们可以有利于更便宜的回缩，并且可以增加电路参数耦合时在量子态空间中移动的距离。这些结果为在非欧几里得和量子搜索空间上设计基于群体的优化器提供了实用规则。", "authors": [{"name": "Vojtěch Novák"}, {"name": "Ivan Zelinka"}], "featured_authors": [{"name": "Vojtěch Novák"}, {"name": "Ivan Zelinka"}], "author_count": 2}, {"id": "2611.34343", "category": "quant-ph", "title": "Squeezing-preserving coherent control in Fourier-shaped optical lattices", "abstract": "Motional squeezed states of atoms in optical lattices are affected by the anharmonicity of the trapping potential. Unequal vibrational energy spacings cause dephasing among the occupied motional-state coherences, leading to distortion of the wavepacket and a reduction in squeezing. We show numerically that adding a weak second or third spatial harmonic to a one-dimensional lattice slows the initial decay of the squeezing. Squeezed states are prepared by one or two sudden changes of the lattice depth. For each harmonic and each preparation scheme, we choose the harmonic amplitude that keeps the evolved state closest, on average over 1 ms, to its evolution in a harmonic trap. We then compare the squeezing with that in a sinusoidal lattice with the same initial squeezing and trap frequency. In all four cases studied, the successive squeezing maxima initially decay more slowly in the shaped lattice. The improvement arises because the optimal harmonic nearly equalizes the two dominant vibrational level spacings over the region occupied by the squeezed wave packet, which canceling the quartic term of the potential alone does not achieve. Because the amplitude of the added harmonic is static and can be produced with existing Fourier-synthesis techniques, lattice shaping offers a simple way to preserve motional squeezing without additional time-dependent control.", "url": "https://arxiv.org/abs/2611.34343", "type": "理论+数值", "summary": "光学晶格中原子的运动压缩态受到捕获势非谐性的影响。不相等的振动能量间隔会导致所占用的动态相干性之间的相移，从而导致波包的畸变和挤压的减少。我们通过数值证明，向一维晶格添加弱的二阶或三阶空间谐波会减慢挤压的初始衰减。压缩态是通过晶格深度的一两次突然变化来准备的。对于每个谐波和每个准备方案，我们选择谐波幅度，使演化状态最接近其在谐波陷阱中的演化，平均超过 1 ms。然后，我们将挤压与具有相同初始挤压和陷波频率的正弦晶格中的挤压进行比较。在研究的所有四种情况中，连续的挤压最大值最初在成形晶格中衰减得更慢。之所以会出现这种改进，是因为最佳谐波几乎使压缩波包占据的区域上的两个主要振动能级间距相等，而单独取消势能的四次项是无法实现的。\n\n由于添加的谐波的幅度是静态的，并且可以使用现有的傅里叶合成技术产生，因此晶格整形提供了一种简单的方法来保持运动挤压，而无需额外的时间相关控制。", "authors": [{"name": "Ko-Wei Cheng"}, {"name": "Wui Seng Leong"}, {"name": "Shau-Yu Lan"}], "featured_authors": [{"name": "Ko-Wei Cheng"}, {"name": "Wui Seng Leong"}, {"name": "Shau-Yu Lan"}], "author_count": 3}, {"id": "2611.34401", "category": "quant-ph", "title": "Planckian bounds on thermalization times of strongly coupled open quantum systems", "abstract": "We consider whether the thermalization of strongly coupled open quantum systems, whose equilibrium state is the mean-force Gibbs (MFG) state, is constrained by a fundamental Planckian time scale, $\\hbar/k_B T$. By requiring that the same process thermalizes a family of nearby system Hamiltonians, we obtain a lower bound on the thermalization time, irrespective of the specific system-bath dynamics. The bound depends only on the distinguishability of the corresponding MFG states, and can therefore be computed from equilibrium properties alone. In its simplest form, it requires only a static susceptibility and an equilibrium variance of a system observable. We characterize this bound from weak to strong coupling in exactly solvable fermionic models, in the spin-boson model, and in a spin coupled to a two-dimensional Heisenberg antiferromagnet. These models show that strong coupling can lift the Planckian constraint when the MFG state retains little information about the system Hamiltonian, while preserving it when that information is carried by system observables with substantial equilibrium fluctuations at frequencies below $k_B T/\\hbar$. The bound is complementary to open-system speed limits, since it constrains the acquisition of information rather than the prepara
