tion of the target, and can remain informative at strong coupling even when the latter become trivial.", "url": "https://arxiv.org/abs/2611.34401", "type": "理论+数值", "summary": "我们考虑强耦合开放量子系统（其平衡状态为平均力吉布斯（MFG）状态）的热化是否受到基本普朗克时间尺度 $\\hbar/k_B T$ 的约束。通过要求相同的过程热化一系列附近的系统哈密顿量，我们获得了热化时间的下限，而不管特定的系统浴动力学如何。该界限仅取决于相应 MFG 状态的可区分性，因此可以仅根据平衡属性进行计算。在其最简单的形式中，它仅需要系统可观测量的静态磁化率和平衡方差。我们在精确可解的费米子模型、自旋玻色子模型以及与二维海森堡反铁磁体的自旋耦合中描述了从弱耦合到强耦合的界限。这些模型表明，当 MFG 状态保留很少有关系统哈密顿量的信息时，强耦合可以解除普朗克约束，而当该信息由频率低于 $k_B T/\\hbar$ 且具有显着平衡波动的系统可观测量携带时，强耦合可以保留它。\n\n该界限是对开放系统速度限制的补充，因为它限制信息的获取而不是目标的准备，并且即使后者变得微不足道，也可以在强耦合下保持信息丰富。", "authors": [{"name": "Jesús Jiménez-Rodríguez"}, {"name": "John Calsamiglia"}, {"name": "Martí Perarnau-Llobet"}], "featured_authors": [{"name": "Jesús Jiménez-Rodríguez"}, {"name": "John Calsamiglia"}, {"name": "Martí Perarnau-Llobet"}], "author_count": 3}, {"id": "2611.34429", "category": "quant-ph", "title": "Native higher-order optimization with entropy quantum computing", "abstract": "Higher-order interactions are common in applied optimization: parity checks, radar-code sidelobes, portfolio skewness and kurtosis, and marketing-channel synergies all yield cubic or quartic objectives. Quantum annealers and most Ising machines accept only quadratic objectives, and gate-based quantum processors build every higher-order term from two-qubit gates. Entropy quantum computing, realized in the hybrid photonic-electronic Dirac-3S system, accepts polynomials of degree up to five with all-to-all coupling over binary, integer or simplex-constrained continuous variables. No user-supplied quadratization or circuit compilation is needed. We formulate four industrial use cases as six cubic and quartic instances, run them on Dirac-3S with 30 samples each, and score every sample against a certified optimum or a classical best-known value. We also estimate their cost on quantum annealers, superconducting grids and trapped-ion registers under standard mappings. For the two densest instances, a portfolio with about 80,000 terms and a budget allocation with 360,000 terms, the quadratized problems need embeddings far beyond current annealers, over $10^5$ physical qubits for the portfolio alone, and one phase-separation layer costs over $10^6$ two-qubit gates before optimization. Dirac-3S ran all six natively and returned feasible, distinct solutions. All samples of the binary instances are single-flip local minima. The best portfolio sample lies within 0.32% of the best-known value and the best budget sample 15% above it, but no sample reached its reference. Classical solvers reach the references within minutes at these sizes, and random starts followed by a local polish reach comparable or better values, so the advantage established here is one of expressibility and mapping cost, not of solution quality. Whether it extends to time to solution at larger sizes remains open.", "url": "https://arxiv.org/abs/2611.34429", "type": "数值", "summary": "高阶交互在应用优化中很常见：奇偶校验、雷达码旁瓣、投资组合偏度和峰度以及营销渠道协同效应都会产生三次或四次目标。量子退火器和大多数伊辛机仅接受二次目标，而基于门的量子处理器从两个量子位门构建每个高阶项。熵量子计算在混合光子电子 Dirac-3S 系统中实现，接受最多 5 次的多项式，并在二进制、整数或单纯形约束连续变量上进行全对全耦合。不需要用户提供的二次化或电路编译。我们将四个工业用例制定为六个立方和四次实例，在 Dirac-3S 上运行它们，每个样本有 30 个样本，并根据经过认证的最佳值或经典的最著名值对每个样本进行评分。我们还估计了标准映射下量子退火器、超导网格和俘获离子寄存器的成本。\n\n对于两个最密集的实例，即包含约 80,000 项的投资组合和包含 360,000 项的预算分配，二次化问题需要的嵌入远远超出当前的退火器，仅投资组合就需要超过 10^5 美元的物理量子位，并且在优化之前，一个相分离层的双量子位门的成本超过 10^6 美元。 Dirac-3S 本地运行所有六个并返回可行的、独特的解决方案。二进制实例的所有样本都是单翻转局部最小值。最佳投资组合样本位于已知值的 0.32% 范围内，最佳预算样本高于其 15%，但没有样本达到其参考值。经典求解器在几分钟内即可达到这些大小的参考值，随机启动后进行局部抛光可达到可比或更好的值，因此此处建立的优势是可表达性和映射成本之一，而不是解决方案质量。是否会延长解决更大尺寸的时间仍然悬而未决。", "authors": [{"name": "Narendra N. Hegade"}, {"name": "Pranav Chandarana"}, {"name": "Sebastian Wagner"}, {"name": "Bahman Qawami"}, {"name": "Wesley Dyk"}], "featured_authors": [{"name": "Narendra N. Hegade"}, {"name": "Pranav Chandarana"}, {"name": "Sebastian Wagner"}, {"name": "Bahman Qawami"}, {"name": "Wesley Dyk"}], "author_count": 5}, {"id": "2611.34448", "category": "quant-ph", "title": "Quantum dynamics of a charged particle on rotating curved surfaces and space curves in electromagnetic fields", "abstract": "We develop a gauge-consistent framework for a charged particle confined to a rotating curved manifold in an electromagnetic field, starting from the covariant Klein--Gordon equation. The non-relativistic reduction casts the rotational effects as effective gauge potentials while preserving the $U(1)$ symmetry, so that rotation and the external field enter alike, the geometry entering separately as the da Costa potential. The obstruction to dimensional reduction is gauge--geometry entanglement: transverse magnetic fields on a two-dimensional (2D) surface and structural torsion on a one-dimensional (1D) curve couple the tangential dynamics to the transverse degrees of freedom. We remove this entanglement by three mechanisms---a generalized transverse Poincaré gauge, the rotation-minimizing Bishop frame, and the parity of the transverse ground state, the last of which annihilates the residual first-order magnetic coupling for a single inversion-symmetric well. On a torus, an axial field generates a joint Sagnac--Aharonov--Bohm residual of tunable sign without spoiling the poloidal--azimuthal separability, whereas an in-plane field couples only through the out-of-plane extent of the structure: it breaks the axial symmetry there but leaves a planar curve unaffected to first order. The same torus shows the axial field tuning the curvature-induced localization, and a corrugated quantum ring converts periodic geometric and flux modulations into an artificial superlattice whose in-plane-field immunity follows from planarity and parity, not from the smallness of the field. Non-inertial quantum dynamics on surfaces and curves of arbitrary shape is thus reduced, within the thin-layer regime, to two ingredients: an effective gauge potential and a geometric potential.", "url": "https://arxiv.org/abs/2611.34448", "type": "理论", "summary": "我们从协变克莱因-戈登方程开始，为限制在电磁场中旋转弯曲流形内的带电粒子开发了一个规范一致的框架。非相对论性约简将旋转效应转换为有效规范势，同时保留 $U(1)$ 对称性，以便旋转和外部场输入相同，几何形状分别作为 da Costa 势输入。维度缩减的障碍是规范几何纠缠：二维 (2D) 表面上的横向磁场和一维 (1D) 曲线上的结构扭转将切向动力学与横向自由度耦合。我们通过三种机制消除这种纠缠——广义横向庞加莱规范、旋转最小化主教框架和横向基态宇称，最后一个机制消除了单个反演对称阱的残余一阶磁耦合。\n\n在环面上，轴向场产生可调谐符号的联合萨格纳克-阿哈罗诺夫-博姆残差，而不破坏极向-方位角可分离性，而面内场仅通过结构的面外范围耦合：它打破了那里的轴对称性，但留下不影响一阶的平面曲线。相同的环面显示了调整曲率引起的局域化的轴向场，并且波纹量子环将周期性几何和通量调制转换为人造超晶格，其面内场免疫性来自平面性和宇称性，而不是来自场的小度。因此，在薄层范围内，任意形状的表面和曲线上的非惯性量子动力学被简化为两个成分：有效规范势和几何势。", "authors": [{"name": "Long Du"}, {"name": "Yong-Long Wang"}], "featured_authors": [{"name": "Long Du"}, {"name": "Yong-Long Wang"}], "author_count": 2}, {"id": "2611.34468", "category": "quant-ph", "title": "Exponential Analysis for Trace-Distance Errors in Quantum Information Theory", "abstract": "We study the trace-distance error in classical-quantum soft covering, privacy amplification against quantum side information, convex splitting, and decoupling by a Haar-random unitary followed by partial trace. In the independent and identically distributed setting, we determine exact reliability functions and strong converse exponents for soft covering with independent codewords, uniform convex splitting, and Haar partial-trace decoupling. For privacy amplification, we determine the exact reliability function for independent random binning and the exact strong converse exponent for every two-universal hash ensemble. The reliability and strong converse formulas involve sandwiched and Petz-Rényi information, respectively. The proofs connect trace-distance errors to quantum hypothesis testing, using Rosenthal inequalities for sums of random matrices in the reliability analysis and conditional second-moment bounds for the strong converses.", "url": "https://arxiv.org/abs/2611.34468", "type": "理论", "summary": "我们研究了经典量子软覆盖中的迹线距离误差、针对量子辅助信息的隐私放大、凸分裂以及哈尔随机酉和部分迹线的解耦。在独立同分布的情况下，我们确定了具有独立码字、均匀凸分裂和哈尔部分迹解耦的软覆盖的精确可靠性函数和强逆指数。对于隐私放大，我们确定独立随机分箱的精确可靠性函数以及每个两个通用哈希集合的精确强逆指数。可靠性公式和强逆公式分别涉及夹层信息和 Petz-Rényi 信息。这些证明将迹距误差与量子假设检验联系起来，使用罗森塔尔不等式计算可靠性分析中的随机矩阵之和，以及强逆矩阵的条件二阶矩界限。", "authors": [{"name": "Hao-Chung Cheng"}, {"name": "Li Gao"}, {"name": "Shi-Bing Li"}, {"name": "Hongsen Qiu"}], "featured_authors": [{"name": "Hao-Chung Cheng"}, {"name": "Li Gao"}, {"name": "Shi-Bing Li"}, {"name": "Hongsen Qiu"}], "author_count": 4}, {"id": "2611.34486", "category": "quant-ph", "title": "Resource theory of pi-ordered imaginarity and its resource quantifiers", "abstract": "Conventional resource theory of quantum imaginarity takes real density matrices as free states without ordering constraints on their diagonal populations. Motivated by the role of population ordering in the incoherent ergotropy of quantum batteries and the recently proposed framework of $\\pi$-ordered coherence, we develop the resource theory of $\\pi$-ordered imaginarity. In this refined framework, free states are required to be real in the reference basis and to obey a prescribed permutation order $\\pi$ for their diagonal populations. This theory thereby identifies two independent quantum resources: complex phases and population misordering, where the latter is inaccessible within the standard imaginarity resource theory. We characterize the structure of free states using majorization and the Schur-Horn theorem, define admissible $\\pi$-ordered real operations, and examine their intersection with $\\pi$-ordered incoherent operations. We further construct resource quantifiers for the $\\pi$-ordered imaginarity based on relative entropy, fidelity and robustness, and derive inequalities relating the robustness of $\\pi$-ordered imaginarity and that of $\\pi$-ordered coherence. The present framework generalizes the standard resource theory of imaginarity to incorporate population ordering and is naturally suited for thermodynamic settings such as quantum batteries.", "url": "https://arxiv.org/abs/2611.34486", "type": "理论", "summary": "传统的量子虚数资源理论将实密度矩阵视为自由态，对其对角线总体没有排序约束。受粒子群排序在量子电池不相干逆向性中的作用以及最近提出的 $\\pi$ 有序相干性框架的启发，我们发展了 $\\pi$ 有序想象力的资源理论。在这个精炼的框架中，自由态在参考基础上必须是真实的，并且其对角线总体遵守规定的排列顺序$\\pi$。因此，该理论确定了两种独立的量子资源：复杂相和总体乱序，后者在标准想象资源理论中是无法访问的。我们使用多数化和 Schur-Horn 定理来描述自由态的结构，定义可接受的 $\\pi$ 有序实数运算，并检查它们与 $\\pi$ 有序非相干运算的交集。我们进一步基于相对熵、保真度和鲁棒性构建了$\\pi$有序想象力的资源量词，并推导了$\\pi$有序想象力的鲁棒性和$\\pi$有序相干性的鲁棒性相关的不等式。\n\n当前的框架概括了想象的标准资源理论，以纳入总体排序，并且自然适合于量子电池等热力学设置。", "authors": [{"name": "Yanjun Chu"}, {"name": "Yushan Ding"}, {"name": "Yuhang Xie"}, {"name": "Chenyang Cui"}, {"name": "Shao-Ming Fei"}], "featured_authors": [{"name": "Yanjun Chu"}, {"name": "Yushan Ding"}, {"name": "Yuhang Xie"}, {"name": "Chenyang Cui"}, {"name": "Shao-Ming Fei"}], "author_count": 5}, {"id": "2611.34520", "category": "quant-ph", "title": "Dynamics of a Charged Particle on a Conformal Helicoidal Surface", "abstract": "We study the classical and quantum motion of a charged particle on a conformal helicoidal surface embedded in four-dimensional Euclidean space. A uniform ambient magnetic field pulls back to a nonuniform surface field. The cyclic longitudinal coordinate permits an exact transverse reduction. The ordinary helicoid in the same axial field shares the effective potential and the turning points, while the conformal metric increases the physical period at matched energy and longitudinal momentum. We classify the single- and double-well regimes and obtain the exact transverse periods in the two double-well sectors. The periods diverge logarithmically at the separatrix, with twice the leading coefficient above the barrier as below it. The zero-field limit allows transverse escape, and the weak-twist limit is locally free but nonuniform across the surface. Intrinsic quantization gives an exact weighted transverse eigenvalue problem. Fixed-momentum eigenvalues test the harmonic approximation in a central well and resolve the tunneling splittings in a double well.", "url": "https://arxiv.org/abs/2611.34520", "type": "理论", "summary": "我们研究嵌入四维欧几里德空间的共形螺旋表面上带电粒子的经典运动和量子运动。均匀的环境磁场会拉回到不均匀的表面场。循环纵向坐标允许精确的横向缩小。同一轴向场中的普通螺旋线共享有效势和转折点，而共形度量则在能量和纵向动量匹配的情况下增加了物理周期。我们对单井和双井区进行分类，并获得两个双井区的精确横向周期。周期在分界线上呈对数发散，势垒上方的首项系数是势垒下方的两倍。零场限制允许横向逃逸，弱扭曲限制是局部自由的，但在整个表面上不均匀。本征量化给出了精确的加权横向特征值问题。固定动量特征值测试中心井中的谐波近似并解决双井中的隧道分裂。", "authors": [{"name": "Hassan Hassanabadi"}, {"name": "Abdullah Guvendi"}, {"name": "Georg Junker"}], "featured_authors": [{"name": "Hassan Hassanabadi"}, {"name": "Abdullah Guvendi"}, {"name": "Georg Junker"}], "author_count": 3}, {"id": "2611.34682", "category": "quant-ph", "title": "Slow mixing of Gibbs sampling for the quantum Curie-Weiss model", "abstract": "Hamiltonian evolution can spread local operators across a dense quantum magnet. We show that this global support does not remove the bottleneck to thermalization in the quantum Curie-Weiss model: at fixed low temperature and weak transverse field, the Chen-Kastoryano-Gilyen Gibbs sampler [arXiv: 2311.09207 ] has an exponentially large mixing-time lower bound. A dynamical quantum bottleneck theory that generalizes the classical notion of conductance has been proposed alongside existing frameworks that rely on spatial locality. We also give a complementary interpretation of slow mixing using an effective Fokker-Planck equation.", "url": "https://arxiv.org/abs/2611.34682", "type": "理论", "summary": "哈密​​顿演化可以将局部算子分布在密集的量子磁体上。我们表明，这种全局支持并没有消除量子 Curie-Weiss 模型中热化的瓶颈：在固定低温和弱横向场下，Chen-Kastoryano-Gilyen Gibbs 采样器 [arXiv: 2311.09207] 具有指数级大的混合时间下界。与依赖空间局部性的现有框架一起，提出了概括经典电导概念的动态量子瓶颈理论。我们还使用有效的福克-普朗克方程对缓慢混合给出了补充解释。", "authors": [{"name": "Xiaoyang Huang"}], "featured_authors": [{"name": "Xiaoyang Huang"}], "author_count": 1}, {"id": "2611.34740", "category": "quant-ph", "title": "Unitary Synthesis with a Unary Tracker", "abstract": "This manuscript studies general unitary synthesis using unary-encoded ancillary register. Our first construction focuses on the $T$-cost of unitary synthesis. We maintain a unary register that coherently tracks the computational-basis label of the data. This allows Boolean lookups to use only CNOTs and shares the precision-dependent synthesis cost across the branches of each cosine-sine decomposition (CSD) factor. For a classically specified $n$-qubit unitary with $K$ mixing branches in its CSD, we obtain $T$-count $O(K+NL)$ using $N+O(L)$ clean ancillas, where $N=2^n$ and $L=n+\\log(1/\\epsilon)$. We also give a related construction that directly applies the unitary onto a unary register to implement disjoint branches in parallel. Combining this with the quantum Shannon decomposition gives space-depth volume $O(N^2)$ using arbitrary single-qubit gates and CNOTs, which matches the asymptotically optimal bound.", "url": "https://arxiv.org/abs/2611.34740", "type": "理论", "summary": "本手稿使用一元编码的辅助寄存器研究一般的单一合成。我们的第一个构建重点是单一合成的 $T$ 成本。我们维护一个一元寄存器，它连贯地跟踪数据的计算基础标签。这允许布尔查找仅使用 CNOT，并在每个余弦-正弦分解 (CSD) 因子的分支之间共享与精度相关的综合成本。对于在其 CSD 中具有 $K$ 混合分支的经典指定的 $n$-qubit 酉，我们使用 $N+O(L)$ clean ancillas 获得 $T$-count $O(K+NL)$，其中 $N=2^n$ 和 $L=n+\\log(1/\\epsilon)$。我们还给出了一个相关的构造，直接将酉应用到一元寄存器上以并行实现不相交的分支。将其与量子香农分解相结合，使用任意单量子位门和 CNOT 给出空间深度体积 $O(N^2)$，这与渐近最优边界匹配。", "authors": [{"name": "Fred Sun"}], "featured_authors": [{"name": "Fred Sun"}], "author_count": 1}, {"id": "2611.34755", "category": "quant-ph", "title": "Fewer Parameters, Longer Runtimes: The Wall-Clock Cost of Hybrid Quantum Physics-Informed Neural Networks", "abstract": "While hybrid quantum-classical physics-informed neural networks (QCPINNs) are often described as efficient because they have fewer trainable parameters than classical PINNs, parameter count does not measure wall-clock cost. To examine this gap on a one-dimensional seawater temperature diffusion benchmark, with the quantum circuits simulated on a CPU, we time the four cumulative stages a PINN needs (the forward pass, the first- and second-order input gradients, and the PDE-loss parameter gradient) for a classical PINN, four hybrid configurations that differ in qubit count and circuit depth, and size-matched classical controls that share the hybrids' classical layers. We find that the hybrids are 14-56x slower than the classical PINN for the forward pass and 10-97x slower for the PDE-loss parameter gradient, and even against the size-matched controls, they remain 9-85x slower. Further, over the tested ranges, runtime increased approximately exponentially with qubit count, approximately linearly with circuit depth, and sub-linearly with batch size, while for the circuit-only forward pass, a second simulator backend was 10-165x slower under the same calling pattern. Although the hybrids have 38-44% fewer parameters than the classical PINN, this reduction comes from their smaller classical layers, as the quantum circuit accounts for at most 2.5% of each hybrid's parameters. Yet parameter count failed to predict runtime even among the classical networks, since the size-matched controls, despite having fewer parameters than the classical PINN, run slower than it. Our conclusion is that fewer parameters did not mean lower cost: every hybrid took at least ten times longer than the classical PINN at every stage, and the gap grew quickly with the number of qubits.", "url": "https://arxiv.org/abs/2611.34755", "type": "理论", "summary": "虽然混合量子经典物理学神经网络 (QCPINN) 通常被描述为高效的，因为它们比经典 PINN 具有更少的可训练参数，但参数计数并不能衡量挂钟成本。为了检查一维海水温度扩散基准上的这一差距，使用在 CPU 上模拟的量子电路，我们对经典 PINN 所需的 4 个累积阶段（正向传递、一阶和二阶输入梯度以及 PDE 损失参数梯度）、四种量子位计数和电路深度不同的混合配置以及共享混合经典层的尺寸匹配经典控制进行了计时。我们发现，混合模型的前向传播比经典 PINN 慢 14-56 倍，PDE 损失参数梯度慢 10-97 倍，即使与大小匹配的控件相比，它们仍然慢 9-85 倍。此外，在测试范围内，运行时间随量子位计数呈指数增长，与电路深度呈近似线性增长，与批量大小呈次线性增长，而对于仅电路前向传递，第二个模拟器后端在相同调用模式下慢了 10-165 倍。\n\n尽管混合体的参数比经典 PINN 少 38-44%，但这种减少来自于其较小的经典层，因为量子电路最多占每个混合体参数的 2.5%。然而，即使在经典网络中，参数计数也无法预测运行时间，因为尺寸匹配的控件尽管参数比经典 PINN 少，但运行速度却比经典网络慢。我们的结论是，更少的参数并不意味着更低的成本：每个混合体在每个阶段所花费的时间都比经典 PINN 长至少十倍，而且差距随着量子比特数量的增加而迅速扩大。", "authors": [{"name": "Leyan Lyu"}, {"name": "Shabnam Jabeen"}], "featured_authors": [{"name": "Leyan Lyu"}, {"name": "Shabnam Jabeen"}], "author_count": 2}, {"id": "2611.34768", "category": "quant-ph", "title": "The integrable Lie-Trotter-Suzuki decomposition for nonlinear dynamics: Efficient Hamiltonian simulation of the Stepanoff flow", "abstract": "We propose an efficient unitary numerical time integration strategy for nonlinear dynamical systems: the integrable Lie-Trotter-Suzuki decomposition (I-LTS). First, express the generator as a sum of integrable parts. Second, approximate the full evolution operator using a Lie-Trotter-Suzuki (LTS) decomposition of the desired approximation order in time step. The I-LTS construction ensures that the full evolution operator can be represented as a product of terms that each have an efficient explicit tensor product factorization that can be handled efficiently with tensor network and/or quantum block-encoding methods. Next, we apply this method to an important non-integrable point example of a dynamical system: the Stepanoff flow on the torus. First, we derive an efficient unitary quantum algorithm for simulating the Stepanoff flow that can be thought of as a unitary classical version of a quantum map. Then, we provide a detailed description of the encoding of the two-dimensional system into an efficient quantum circuit, including an efficient block-encoding for all required operators. An efficient Hamiltonian simulation algorithm is constructed using a sequence of alternating quantum Fourier transforms (QFT) and Quantum Signal Processing (QSP) circuits. Finally, the circuit is simulated using a numerical emulator of fault-tolerant quantum computers, and the results are found to be consistent with several alternative classical computational methods. While efficient, the need for Trotterization introduces fundamental complexity in requiring small enough time step for an accurate approximation and solving for the transfer operator requires one to confront the linear scaling of the advection operator with grid size.", "url": "https://arxiv.org/abs/2611.34768", "type": "理论+数值", "summary": "我们提出了一种适用于非线性动力系统的高效酉数值时间积分策略：可积 Lie-Trotter-Suzuki 分解（I-LTS）。首先，将生成器表示为可积部分的总和。其次，使用时间步长中所需近似阶数的 Lie-Trotter-Suzuki (LTS) 分解来近似完全演化算子。 I-LTS 构造确保完整的演化算子可以表示为项的乘积，每个项都具有有效的显式张量乘积分解，可以使用张量网络和/或量子块编码方法有效处理。接下来，我们将此方法应用于动力系统的一个重要的不可积点示例：环面上的 Stepanoff 流。首先，我们推导出一种有效的酉量子算法来模拟 Stepanoff 流，可以将其视为量子图的酉经典版本。然后，我们提供了将二维系统编码为高效量子电路的详细描述，包括所有所需运算符的高效块编码。\n\n使用一系列交替量子傅立叶变换 (QFT) 和量子信号处理 (QSP) 电路构建高效的哈密顿模拟算法。最后，使用容错量子计算机数值仿真器对电路进行仿真，结果发现结果与几种替代的经典计算方法一致。虽然高效，但 Trotterization 的需求引入了基本的复杂性，因为需要足够小的时间步长来进行精确的近似，并且求解传递算子需要面对平流算子与网格大小的线性缩放。", "authors": [{"name": "Ilon Joseph"}, {"name": "Ivan Novikau"}, {"name": "Michael R. Montgomery"}, {"name": "Joanna Slawinska"}, {"name": "Dimitrios Giannakis"}], "featured_authors": [{"name": "Ilon Joseph"}, {"name": "Ivan Novikau"}, {"name": "Michael R. Montgomery"}, {"name": "Joanna Slawinska"}, {"name": "Dimitrios Giannakis"}], "author_count": 5}, {"id": "2611.34792", "category": "quant-ph", "title": "Monotone Crossing Lattices for Exact Binary Optimization Encodings on Rydberg Arrays", "abstract": "Programmable Rydberg-atom arrays realize maximum-weight independent set encoding on unit-disk graphs under the ideal blockade model, but embedding nonlocal interactions requires auxiliary atoms and limits the size of tractable instances. We introduce a four-state unit-disk crossing cell that couples directly to adjacent cells, with interfaces enforcing one-sided propagation: along occupied paths directed away from the diagonal, copy bits are nondecreasing. For the maximum-weight independent set problem, uniform cell weights guarantee that every ground state of the encoded instance decodes to an optimal solution of the original problem, even when local copies disagree. For binary quadratic objectives subject to pairwise Boolean constraints, every feasible optimum yields consistent active copies and a target weight given by an explicit constant offset minus the source objective. A rectangular variant of the architecture further encodes minimum set cover problem. Prior to constraint-induced site deletions, the full layout requires $2n^2 - n$ sites, halving the leading-order site count of a fixed complete-grid reference, while activity pruning yields an exact site count set by the propagation span. Across 18 paired benchmarks with independent ordering from a shared candidate pool, the layout reduces site counts by 12.1%-54.0%.", "url": "https://arxiv.org/abs/2611.34792", "type": "理论+数值", "summary": "可编程里德堡原子阵列在理想封锁模型下实现了单位盘图上的最大权重独立集编码，但嵌入非局部相互作用需要辅助原子并限制了可处理实例的大小。我们引入了一种四状态单位盘交叉单元，它直接耦合到相邻单元，其接口强制单侧传播：沿着远离对角线的占用路径，复制位不减少。对于最大权重独立集问题，均匀的单元权重保证编码实例的每个基态解码为原始问题的最优解，即使本地副本不一致。对于受成对布尔约束的二元二次目标，每个可行的最优值都会产生一致的活动副本和由显式常量偏移减去源目标给出的目标权重。该架构的矩形变体进一步编码了最小集覆盖问题。\n\n在约束引起的站点删除之前，完整布局需要 $2n^2 - n$ 个站点，将固定完整网格参考的前序站点计数减半，而活动修剪则产生由传播跨度设置的精确站点计数。在 18 个配对基准测试中，从共享候选池中进行独立排序，该布局将站点数量减少了 12.1%-54.0%。", "authors": [{"name": "Liyin Hu"}, {"name": "Shengminjie Chen"}, {"name": "Ran Miao"}, {"name": "Zhiyi Huang"}, {"name": "Xiaohan Shan"}, {"name": "Jialin Zhang"}, {"name": "Xiaoming Sun"}], "featured_authors": [{"name": "Liyin Hu"}, {"name": "Shengminjie Chen"}, {"name": "Ran Miao"}, {"name": "Xiaohan Shan"}, {"name": "Jialin Zhang"}, {"name": "Xiaoming Sun"}], "author_count": 7}, {"id": "2611.34871", "category": "quant-ph", "title": "Simultaneous computation of multiple excited states via double bracket flows", "abstract": "Efficient computation of excited states is essential for studying strongly correlated many-body systems and molecular electronic structure. In this work, we propose a framework for simultaneously simulating multiple excited states based on dynamical flows. The main idea is to exploit a common double bracket flow that drives different pure initial states toward different target excited states without such prior information. We establish a necessary condition for convergence and a sufficient condition for exponential convergence. We further develop two scheduling strategies: Chebyshev scheduling, which achieves optimal convergence near a fixed point but requires prior spectral information, and adaptive scheduling, which achieves comparable performance in numerical simulations without spectral information. Our results enable new classical and quantum algorithms for excited-state computation without prior preparation of lower-energy eigenstates.", "url": "https://arxiv.org/abs/2611.34871", "type": "数值", "summary": "激发态的有效计算对于研究强相关多体系统和分子电子结构至关重要。在这项工作中，我们提出了一个基于动态流同时模拟多个激发态的框架。主要思想是利用常见的双括号流，在没有此类先验信息的情况下将不同的纯初始态驱动到不同的目标激发态。我们建立了收敛的必要条件和指数收敛的充分条件。我们进一步开发了两种调度策略：切比雪夫调度，它在固定点附近实现最佳收敛，但需要先验谱信息；自适应调度，它在没有谱信息的数值模拟中实现可比较的性能。我们的结果使得新的经典和量子算法能够用于激发态计算，而无需事先准备低能本征态。", "authors": [{"name": "Reyhaneh Aghaei Saem"}, {"name": "Mehrad Sahebi"}, {"name": "Zoë Holmes"}, {"name": "Yudai Suzuki"}], "featured_authors": [{"name": "Reyhaneh Aghaei Saem"}, {"name": "Mehrad Sahebi"}, {"name": "Zoë Holmes"}, {"name": "Yudai Suzuki"}], "author_count": 4}, {"id": "2611.34872", "category": "quant-ph", "title": "Bound magic in multi-qubit systems", "abstract": "Magic captures nonstabilizerness, a resource required for quantum computational speedups. We prove the existence of multi-qubit nonstabilizer states from which no pure magic can be distilled, even with arbitrarily many copies and rounds of stabilizer operations. Such bound magic states have previously been only known to exist in odd Hilbert-space dimensions, where positivity of discrete Wigner functions can be used analogously to the positive partial transpose (PPT) criterion for bound entanglement. We introduce a PPT analogue for magic in multi-qubit systems that is closed under tensor products and stabilizer operations and reduces to the stabilizer polytope for one and two qubits. This enables the proof of multi-qubit bound magic and the explicit construction of bound magic states for $n \\geq 3$ qubits.", "url": "https://arxiv.org/abs/2611.34872", "type": "理论", "summary": "Magic 捕获了非稳定性，这是量子计算加速所需的资源。我们证明了多量子位非稳定器状态的存在，即使有任意多的副本和稳定器操作轮次，也无法从中提取出纯粹的魔法。此前已知这种束缚魔态仅存在于奇数希尔伯特空间维度中，其中离散维格纳函数的正性可以类似于束缚纠缠的正部分转置（PPT）准则。我们引入了一种用于多量子位系统中魔法的 PPT 模拟，该系统在张量积和稳定器运算下闭合，并简化为一个和两个量子位的稳定器多胞体。这使得多量子位绑定魔法的证明以及 $n \\geq 3$ 量子位的绑定魔法状态的显式构造成为可能。", "authors": [{"name": "Jonas Kitzinger"}, {"name": "Jens Eisert"}, {"name": "Ravi Kunjwal"}], "featured_authors": [{"name": "Jonas Kitzinger"}, {"name": "Jens Eisert"}, {"name": "Ravi Kunjwal"}], "author_count": 3}, {"id": "2611.34883", "category": "quant-ph", "title": "Transition Path Sampling for Rare Events in Non-Markovian Open Quantum Systems", "abstract": "Rare transitions govern the dynamics of many open quantum systems, but their probabilities and rates are difficult to calculate. Transition path sampling (TPS) of quantum systems has so far been limited to Markovian, perturbative descriptions. Here, we formulate TPS for non-Markovian quantum state diffusion, which is exact for Gaussian baths, extending it to non-Markovian and strongly coupled open quantum systems. For normal-to-superradiant tunneling in the unbalanced open Dicke model, we determine probabilities down to $10^{-8}$ and rates beyond the reach of brute force.", "url": "https://arxiv.org/abs/2611.34883", "type": "理论", "summary": "罕见的跃迁控制着许多开放量子系统的动力学，但它们的概率和速率很难计算。迄今为止，量子系统的跃迁路径采样（TPS）仅限于马尔可夫的微扰描述。在这里，我们为非马尔可夫量子态扩散制定了 TPS，这对于高斯浴来说是精确的，并将其扩展到非马尔可夫和强耦合开放量子系统。对于不平衡开放 Dicke 模型中的法向至超辐射隧道效应，我们确定了低至 10^{-8}$ 的概率和超出蛮力范围的速率。", "authors": [{"name": "Ritesh Pant"}, {"name": "Kai Müller"}, {"name": "Tarun Gera"}, {"name": "Doran I. G. B. Raccah"}], "featured_authors": [{"name": "Ritesh Pant"}, {"name": "Kai Müller"}, {"name": "Tarun Gera"}, {"name": "Doran I. G. B. Raccah"}], "author_count": 4}, {"id": "2611.34889", "category": "quant-ph", "title": "The Price of Quantum Advantage in Computational Chemistry", "abstract": "As the fault-tolerant era approaches, the question shifts from ``is it possible'' to ``is it worthwhile.'' To assess practical quantum advantage against reliable classical baselines, we examine 26 benchmark instances including FeMoco, iron-sulfur clusters, cytochrome P450, and ruthenium catalysts using two selected configuration interaction solvers, SHCI and TrimCI. Comparing classical workloads with fault-tolerant resource estimates, we calculate the break-even whole-QPU hourly price. Even at an optimistic price of US\\$7{,}000 per whole-QPU hour, and with mid-range CPU clusters, classical computation remains cheaper for six of seven systems. FeMoco alone remains sensitive to the classical method and extrapolation strategy. Wavefunction analysis further reveals how orbital choice affects the determinant support required for target-state overlap in quantum phase estimation (QPE). Our results highlight the importance of reliable classical references and trial-state characterization, and quantify the economic conditions under which quantum computing can become competitive with classical alternatives.", "url": "https://arxiv.org/abs/2611.34889", "type": "理论+数值", "summary": "随着容错时代的临近，问题从“是否可能”转变为“值得”。为了根据可靠的经典基线评估实际量子优势，我们使用两个选定的配置相互作用求解器 SHCI 和 TrimCI 检查了 26 个基准实​​例，包括 FeMoco、铁硫簇、细胞色素 P450 和钌催化剂。将经典工作负载与容错资源估计进行比较，我们计算了整个 QPU 每小时的盈亏平衡价格。即使乐观的价格为每整个 QPU 小时 7{,}000 美元，并且采用中档 CPU 集群，对于七个系统中的六个来说，经典计算仍然更便宜。 FeMoco 本身对经典方法和外推策略仍然敏感。波函数分析进一步揭示了轨道选择如何影响量子相位估计（QPE）中目标态重叠所需的行列式支持。我们的结果强调了可靠的经典参考和试验状态表征的重要性，并量化了量子计算可以与经典替代方案竞争的经济条件。", "authors": [{"name": "Haejung Koh"}, {"name": "Katerina Gratsea"}, {"name": "Hao Zhang"}, {"name": "Matthew Otten"}], "featured_authors": [{"name": "Haejung Koh"}, {"name": "Katerina Gratsea"}, {"name": "Hao Zhang"}, {"name": "Matthew Otten"}], "author_count": 4}, {"id": "2611.34909", "category": "quant-ph", "title": "The thermodynamic budget of objectivity", "abstract": "An event becomes a fact when enough independent records of it exist such that no operation is possible that leaves all observers ignorant of it again. Records are physical, and creating, keeping, and destroying them have thermodynamic costs. We compute these costs exactly in a minimal broadcast model with a driven central qubit writing records into $N$ initially thermal registers, with work sources and baths at temperature $T$. The basic arguments for the operations are outlined here, with full treatment in the text. Creation of one event record at redundancy $R$ and information deficit $\\delta$ requires work $W \\ge R\\, k_\\mathrm{B}T \\ln 2\\, (1-\\delta) H(\\varepsilon)$, linear in redundancy at the Landauer coefficient. Recording in a basis misaligned by $\\theta$ with the einselecting interaction fails at a critical angle, $\\theta_c = 2\\arcsin\\sqrt{H_2^{-1}(\\delta)}$, beyond which objectivity is unreachable at any work, and below $\\theta_c$ the optimal work is a closed form in the pointer basis that minimizes the work of objectivity. Reducing objectivity is impossible at any work with access to fewer than $R - R_{\\min} + 1$ records, while work protects nothing if given access. Inter-record redundancy is extractable free energy and erasing the accessed records yields a net gain of work beyond the first copy. The second law constrains the destruction of the correlation: erasing a fact from a sector an adversary controls dissipates at least the mutual information erased, but a consolidation dissipates nothing. Records in re-thermalizing media are nonequilibrium steady states, and the minimal power to maintain a record at $(R,\\delta)$ is the known two-state driving bound evaluated at the record-quality boundary.", "url": "https://arxiv.org/abs/2611.34909", "type": "理论+数值", "summary": "当一个事件存在足够多的独立记录时，该事件就成为事实，以至于不可能进行任何操作而使所有观察者再次对它一无所知。记录是物理的，创建、保存和销毁它们都有热力学成本。我们在最小广播模型中精确计算这些成本，其中驱动的中央量子位将记录写入最初的热寄存器 $N$ 中，工作源和浴温度为 $T$。这里概述了这些操作的基本论据，并在文本中进行了全面的处理。在冗余 $R$ 和信息赤字 $\\delta$ 下创建一个事件记录需要工作 $W \\ge R\\, k_\\mathrm{B}T \\ln 2\\, (1-\\delta) H(\\varepsilon)$，与 Landauer 系数的冗余呈线性关系。在 $\\theta$ 与 einselecting 相互作用错位的基础上进行记录在临界角 $\\theta_c = 2\\arcsin\\sqrt{H_2^{-1}(\\delta)}$ 处失败，超过该角度，任何工作都无法达到客观性，而在 $\\theta_c$ 以下，最佳工作是指针基础中的封闭形式，可最大限度地减少客观性工作。在任何访问少于 $R - R_{\\min} + 1$ 记录的工作中，都不可能降低客观性，而如果授予访问权限，工作就无法保护任何内容。\n\n记录间冗余是可提取的自由能，并且擦除访问的记录会产生超出第一个副本的净工作收益。第二定律限制了相关性的破坏：从对手控制的部门中删除一个事实至少会消散被删除的相互信息，但合并不会消散任何东西。再热化介质中的记录是非平衡稳态，并且将记录维持在 $(R,δ)$ 的最小功率是在记录质量边界处评估的已知两态驱动界限。", "authors": [{"name": "Wonyong Chung"}], "featured_authors": [{"name": "Wonyong Chung"}], "author_count": 1}, {"id": "2611.34916", "category": "quant-ph", "title": "Complementary mechanisms of critical quantum metrology", "abstract": "Critical metrology conventionally exploits enhanced susceptibility to a system parameter near a phase transition. Here we identify a complementary mechanism for critically enhanced estimation of intrinsic system parameters via suppressed quantum noise rather than enhanced response. We demonstrate both mechanisms in coherently radiating spin states (CRSS)-correlated states of $N$ spin-$1/2$ particles defined as asymptotic eigenstates of the collective-spin lowering operator with complex eigenvalue $r e^{-i\\varphi}$. At the critical value $r=1$, CRSS exhibit a second-order transition. We show that near criticality, estimation of $r$ benefits from enhanced susceptibility despite increased noise, whereas estimation of $\\varphi$ benefits from suppressed quantum noise without enhanced response. Remarkably, both yield the same estimation error $\\sim N^{-2/3}$, improving over the standard quantum limit $N^{-1/2}$. For $\\varphi$, this establishes quantum-enhanced metrology of phases intrinsic to the critical system, rather than phases externally encoded by interferometry. We demonstrate these results for CRSS realizations in both dissipative (superradiant) and Hamiltonian (Ising) systems relevant to cavity QED and trapped ions, where fast preparation of CRSS is shown possible thanks to gap opening. Applications to metrology of coupling rates and phases or optical lengths are discussed.", "url": "https://arxiv.org/abs/2611.34916", "type": "理论", "summary": "临界计量通常利用对相变附近系统参数的敏感性增强。在这里，我们确定了一种补充机制，通过抑制量子噪声而不是增强响应来显着增强对固有系统参数的估计。我们在相干辐射自旋态 (CRSS) 中演示了两种机制，$N$ 自旋-$1/2$ 粒子的相关态被定义为具有复特征值 $r e^{-i\\varphi}$ 的集体自旋降低算子的渐近本征态。在临界值$r=1$处，CRSS表现出二阶转变。我们表明，在接近临界点时，尽管噪声增加，但 $r$ 的估计受益于增强的敏感性，而 $\\varphi$ 的估计受益于抑制量子噪声而不增强响应。值得注意的是，两者产生相同的估计误差 $\\sim N^{-2/3}$，优于标准量子极限 $N^{-1/2}$。对于$\\varphi$，这建立了关键系统固有相位的量子增强计量学，而不是通过干涉测量法外部编码的相位。\n\n我们在与腔 QED 和捕获离子相关的耗散（超辐射）和哈密顿（Ising）系统中展示了 CRSS 实现的这些结果，其中由于间隙打开，CRSS 的快速制备成为可能。讨论了耦合率和相位或光长度计量的应用。", "authors": [{"name": "Nikita Leppenen"}, {"name": "Shaked Levy"}, {"name": "Ephraim Shahmoon"}], "featured_authors": [{"name": "Nikita Leppenen"}, {"name": "Shaked Levy"}, {"name": "Ephraim Shahmoon"}], "author_count": 3}, {"id": "2611.34921", "category": "quant-ph", "title": "Bound Entanglement with Negative Partial Transpose Exists", "abstract": "We show that the Werner state $\\rho = (23 I - 3\\,\\mathrm{SWAP})/1448$ on $\\mathbb{C}^8 \\otimes \\mathbb{C}^8$ has a negative partial transpose and is bound entangled: no LOCC protocol can distill entanglement from any number of copies of $\\rho$, and even with separable operations the fidelity of a two-qubit output with a Bell state never exceeds $(1+\\sqrt{2})/4 \\approx 0.604$. It follows that distillable entanglement is neither additive nor convex.", "url": "https://arxiv.org/abs/2611.34921", "type": "理论", "summary": "我们证明，$\\mathbb{C}^8 \\otimes \\mathbb{C}^8$ 上的 Werner 状态 $\\rho = (23 I - 3\\,\\mathrm{SWAP})/1448$ 具有负部分转置，并且受到纠缠：没有 LOCC 协议可以从任何数量的 $\\rho$ 副本中提取纠缠，即使使用可分离操作，两个量子位输出的保真度也为贝尔状态永远不会超过 $(1+\\sqrt{2})/4 \\approx 0.604$。由此可见，可蒸馏纠缠既不是可加的，也不是凸的。", "authors": [{"name": "Islam Faisal"}], "featured_authors": [{"name": "Islam Faisal"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
