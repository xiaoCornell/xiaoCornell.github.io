 with 1-form symmetry. We interpret these quantities as first- and zeroth-dimensional simplicial homological objects, respectively, and show that the transition can be understood in terms of decoherence percolation. To resolve its local structure, we introduce quasi-local TEN (QLTEN), which visualizes the spatial distribution of local topological properties and the growth of decohered regions. We further introduce explosive percolation (EP), corresponding here to biased decoherence that suppresses the formation of large decohered clusters. As a second case study, we consider the toric code on a triangular lattice under external-field-type decoherence. Numerical results show that QLTEN faithfully captures the emergence of Higgs regions and the survival of logical qubits. Although global TEN, QLTEN clusters, and string operators are strongly correlated in both models, the color code and toric code respond differently to EP patterns. This difference indicates that a universal microscopic description of decoherence-induced topological phase transitions remains challenging even for closely related systems.", "url": "https://arxiv.org/abs/2607.26707", "type": "理论+数值", "summary": "我们研究退相干引起的拓扑有序状态之间转变的微观机制。作为第一个案例研究，我们使用拓扑纠缠负性 (TEN) 和与 1 型对称性相关的无序参数来分析颜色代码。我们将这些量分别解释为一维和零维单纯同调对象，并表明这种转变可以用退相干渗透来理解。为了解析其局部结构，我们引入了准局部 TEN (QLTEN)，它可视化局部拓扑特性的空间分布和退相干区域的增长。我们进一步引入爆炸渗滤（EP），此处对应于抑制大退相干簇形成的偏向退相干。作为第二个案例研究，我们考虑外场型退相干下三角晶格上的复曲面码。数值结果表明，QLTEN 忠实地捕捉到了希格斯区域的出现和逻辑量子位的生存。尽管全局 TEN、QLTEN 簇和字符串运算符在两个模型中都具有很强的相关性，但颜色代码和环面代码对 EP 模式的响应不同。\n\n这种差异表明，即使对于密切相关的系统，退相干引起的拓扑相变的通用微观描述仍然具有挑战性。", "authors": [{"name": "Keisuke Kataoka"}, {"name": "Ikuo Ichinose"}], "featured_authors": [{"name": "Keisuke Kataoka"}, {"name": "Ikuo Ichinose"}], "author_count": 2}, {"id": "2607.26716", "category": "quant-ph", "title": "Coherent electric field manipulation of nuclear spin qudit", "abstract": "Spins in condensed matter, especially well-isolated nuclear spins, offer attractive quantum degrees of freedom for computing, sensing, and networking because of their long coherence times. The possibility of electric-field control is an important feature for practical scalable quantum technologies, but, typically, nuclear spins couple only weakly to electric fields in conventional semiconductor hosts, limiting operation efficiency. Here we show that a choice of a highly polarizable oxide host can overcome this bottleneck. In Mn2+ doped ZnO, electric-field modulation of the spin Hamiltonian is amplified by hyperfine-coupled electron spins, and offers efficient electric-field manipulation of an I = 5/2 nuclear spin qudit, in a manner analogous to the hyperfine enhancement of conventional nuclear magnetic resonance. We demonstrate both resonant and non-resonant coherent manipulation using a single uniaxial electric field applied along the crystalline c-axis, the polarization axis of ZnO. This approach allows universal single-qudit gate operations with efficiencies comparable to or exceeding those of conventional magnetic-field driving. These results support the deployment of doped oxides as active host materials for electrically controllable spin qubits, highlighting the importance of materials design in developing scalable quantum technologies.", "url": "https://arxiv.org/abs/2607.26716", "type": "理论", "summary": "凝聚态物质中的自旋，尤其是隔离良好的核自旋，由于其相干时间长，为计算、传感和网络提供了有吸引力的量子自由度。电场控制的可能性是实用可扩展量子技术的一个重要特征，但通常核自旋仅与传统半导体主体中的电场微弱耦合，从而限制了运行效率。在这里，我们表明，选择高度可极化的氧化物主体可以克服这一瓶颈。在 Mn2+ 掺杂 ZnO 中，自旋哈密顿量的电场调制通过超精细耦合电子自旋放大，并以类似于传统核磁共振超精细增强的方式提供对 I = 5/2 核自旋量子的有效电场操纵。我们使用沿晶体 c 轴（ZnO 的极化轴）施加的单个单轴电场演示了谐振和非谐振相干操纵。这种方法允许通用的单量子门操作，其效率可与或超过传统磁场驱动的效率相当。\n\n这些结果支持将掺杂氧化物用作电控自旋量子位的活性主体材料，凸显了材料设计在开发可扩展量子技术中的重要性。", "authors": [{"name": "Sumin Lim"}, {"name": "Mikhail V. Vaganov"}, {"name": "Niccolo Fontana"}, {"name": "Junjie Liu"}, {"name": "Arzhang Ardavan"}], "featured_authors": [{"name": "Sumin Lim"}, {"name": "Mikhail V. Vaganov"}, {"name": "Niccolo Fontana"}, {"name": "Junjie Liu"}, {"name": "Arzhang Ardavan"}], "author_count": 5}, {"id": "2607.26745", "category": "quant-ph", "title": "High-fidelity multiqubit gates with Rydberg atoms via level-crossing-free Rapid adiabatic passage", "abstract": "We propose a rapid adiabatic passage (RAP) scheme based on level-crossing-free pulses for deterministic generation of multiqubit entangled states in Rydberg atom systems. Unlike conventional RAP protocols that rely on level crossings, our approach uses an antisymmetric Rabi frequency and an even-symmetric detuning, enabling robust population transfer without passing through any level crossing. By exploiting the Rydberg blockade effect, the protocol prepares entangled states directly from an initial product state. Specifically, two sequential RAP pulses separated by a pi_g pulse generate two-qubit Bell states, three-qubit W states, four-qubit GHZ states, and six-qubit honeycomb W states. Numerical simulations show that the fidelities exceed 0.9997 for the Bell and three-qubit W states, reach 0.997 for the four-qubit GHZ state, and surpass 0.9995 for the six-qubit honeycomb W state. The scheme demonstrates excellent robustness against pulse parameter fluctuations, with fidelities remaining above 0.99 under +/-5% parameter variations. This work provides a simple, efficient, and robust method for entangled-state preparation in neutral-atom quantum information processing.", "url": "https://arxiv.org/abs/2607.26745", "type": "理论+数值", "summary": "我们提出了一种基于无电平交叉脉冲的快速绝热通道（RAP）方案，用于在里德堡原子系统中确定性地生成多量子位纠缠态。与依赖平交道口的传统 RAP 协议不同，我们的方法使用反对称 Rabi 频率和偶对称失谐，无需通过任何平交道口即可实现稳健的群体转移。通过利用里德堡封锁效应，该协议直接从初始产物状态准备纠缠态。具体来说，由 pi_g 脉冲分隔的两个连续 RAP 脉冲生成两个量子位 Bell 状态、三个量子位 W 状态、四个量子位 GHZ 状态和六个量子位蜂窝 W 状态。数值模拟表明，贝尔态和三量子位 W 态的保真度超过 0.9997，四量子位 GHZ 态的保真度达到 0.997，六量子位蜂窝 W 态的保真度超过 0.9995。该方案对脉冲参数波动表现出出色的鲁棒性，在 +/-5% 参数变化下保真度保持在 0.99 以上。这项工作为中性原子量子信息处理中的纠缠态制备提供了一种简单、高效、鲁棒的方法。", "authors": [{"name": "Yichi Zhang"}, {"name": "Ximo Wang"}, {"name": "Zhenqi Bai"}, {"name": "Xu Zhao"}, {"name": "Tiecheng Wang"}], "featured_authors": [{"name": "Yichi Zhang"}, {"name": "Ximo Wang"}, {"name": "Zhenqi Bai"}, {"name": "Xu Zhao"}, {"name": "Tiecheng Wang"}], "author_count": 5}, {"id": "2607.26756", "category": "quant-ph", "title": "Label and Recover Coherent Errors: Randomized Compiling Does Not Destroy Coherent-Error Information", "abstract": "Randomized compiling (RC) is the standard technique for converting coherent (systematic) gate errors into stochastic noise. The prevailing view is that the twirl destroys coherent-error information. An exact Fisher-information conservation law shows the opposite: the coherent-error information RC removes from the averaged output is preserved in full in the twirl labels -- the per-shot random gate choices that standard RC discards. Retaining the labels and forming a label-outcome correlation recovers the coherent error parameters at the quantum Fisher-information limit, unbiased under all standard incoherent channels, at zero additional circuit cost. Two theorems are proved, the conservation law is verified to machine precision across 12 circuit families, and recovery is confirmed on a 127-qubit IBM Quantum processor (ibm_marrakesh). The labeled estimator recovers injected coherent phases to within 0.0063 rad of the true value across all depths tested, while the standard marginal estimator returns near-zero signal at every depth.", "url": "https://arxiv.org/abs/2607.26756", "type": "理论", "summary": "随机编译 (RC) 是将相干（系统）门错误转换为随机噪声的标准技术。普遍的观点是旋转破坏了相干误差信息。精确的费希尔信息守恒定律表明了相反的情况：RC 从平均输出中删除的相干误差信息完全保留在旋转标签中 - 标准 RC 丢弃的每镜头随机门选择。保留标签并形成标签-结果相关性可以在量子费希尔信息极限下恢复相干误差参数，在所有标准非相干通道下无偏，且附加电路成本为零。两个定理得到了证明，守恒定律在 12 个电路系列中得到了机器精度的验证，并且恢复在 127 量子位 IBM Quantum 处理器 (ibm_marrakesh) 上得到了确认。标记估计器将注入的相干相位恢复到所有测试深度的真实值的 0.0063 rad 以内，而标准边际估计器在每个深度返回接近零的信号。", "authors": [{"name": "Kushagra Vyas"}], "featured_authors": [{"name": "Kushagra Vyas"}], "author_count": 1}, {"id": "2607.26761", "category": "quant-ph", "title": "PhD thesis: Modes, States, and Symmetries in quantum Optics for quantum Information and Metrology", "abstract": "This thesis explores the role of modes, states, and symmetries in quantum optics, within the context of quantum information and quantum metrology. It proposes a unified framework to analyze how the modal structure of photonic fields, the statistical nature of states, and their symmetry properties determine the physical resources that can be exploited for quantum information processing and quantum parameter estimation. A first line of investigation develops a description of time-frequency degrees of freedom as continuous quantum variables, highlighting their richness for encoding and manipulating information. A second axis studies entanglement and collective variables, clarifying the link between physical resources and metrological gains, particularly in reaching ultimate precision limits. Interferometric scenarios of the Hong-Ou-Mandel type are then analyzed, and a general formalism centered on the notion of symmetry is developed. This framework enables the analysis of a broad range of situations and leads to several generalizations. Finally, the thesis examines the symmetries imposed by optical superselection rules and their consequences for the structure of quantum states and their operational performance, with the aim of providing a deeper understanding of the foundations of quantum optics.", "url": "https://arxiv.org/abs/2607.26761", "type": "理论", "summary": "本论文在量子信息和量子计量学的背景下探讨了模式、状态和对称性在量子光学中的作用。它提出了一个统一的框架来分析光子场的模态结构、态的统计性质及其对称性如何确定可用于量子信息处理和量子参数估计的物理资源。第一个研究方向将时频自由度描述为连续量子变量，强调了它们在编码和操纵信息方面的丰富性。第二个轴研究纠缠和集体变量，阐明物理资源和计量增益之间的联系，特别是在达到最终精度极限方面。然后分析了红欧曼德尔类型的干涉方案，并发展了以对称概念为中心的一般形式主义。该框架可以对广泛的情况进行分析，并得出一些概括。\n\n最后，论文研究了光学超选择规则所施加的对称性及其对量子态结构及其操作性能的影响，旨在更深入地理解量子光学的基础。", "authors": [{"name": "Éloi Descamps"}], "featured_authors": [{"name": "Éloi Descamps"}], "author_count": 1}, {"id": "2607.26771", "category": "quant-ph", "title": "Hybrid quantum-classical end-to-end pipeline for solving MILPs: a vehicle routing case study", "abstract": "We demonstrate an end-to-end hybrid quantum-classical optimisation framework based on Benders decomposition, capable of solving mixed-integer linear programming (MILP) problems. The framework builds on a previously presented hybrid quantum-classical end-to-end pipeline based on Multiple Cuts via Multiple Solutions (MCMS) Benders decomposition where the cut selection step was performed on quantum annealing hardware. We extend this with gate-based QAOA implementations for both tensor network emulators and superconducting quantum hardware. The Vehicle Routing Problem (VRP) is used as a representative case study and we run the pipeline end-to-end on 10 permutations of a standardised benchmarking instance (20 customers and 4 vehicles from QOptLib) with a classical solver performing the cut selection step. We find that for our instances, only a small fraction of the compute in classical MCMS Benders decomposition is spent on the cut selection step. For a full hybrid end-to-end assessment, we run the pipeline for a toy problem with MPS-JuliQAOA, a powerful tensor network emulator, to execute QAOA. Here, the majority of the time is spent on the cut selection step, deeming quantum advantage of this framework unlikely at problems of this size. This highlights the need for more large-scale benchmarking research when more powerful (QPU) QUBO solvers are available.", "url": "https://arxiv.org/abs/2607.26771", "type": "数值", "summary": "我们展示了一种基于 Benders 分解的端到端混合量子经典优化框架，能够解决混合整数线性规划 (MILP) 问题。该框架建立在先前提出的混合量子经典端到端管道的基础上，该管道基于通过多个解决方案进行多次切割 (MCMS) Benders 分解，其中切割选择步骤是在量子退火硬件上执行的。我们通过针对张量网络模拟器和超导量子硬件的基于门的 QAOA 实现来扩展此功能。车辆路由问题 (VRP) 用作代表性案例研究，我们在标准化基准测试实例（20 个客户和来自 QOptLib 的 4 辆车辆）的 10 个排列上端到端运行管道，并使用执行剪切选择步骤的经典求解器。我们发现，对于我们的实例，经典 MCMS Benders 分解中只有一小部分计算花费在剪切选择步骤上。对于完整的混合端到端评估，我们使用功能强大的张量网络模拟器 MPS-JuliQAOA 运行玩具问题的管道来执行 QAOA。\n\n在这里，大部分时间都花在剪切选择步骤上，认为该框架的量子优势不太可能解决这种规模的问题。这凸显了当更强大的 (QPU) QUBO 求解器可用时，需要进行更大规模的基准测试研究。", "authors": [{"name": "Camille de Valk"}, {"name": "Koen Reerink"}, {"name": "Siert Sebus"}, {"name": "Sébastian de Bon"}], "featured_authors": [{"name": "Camille de Valk"}, {"name": "Koen Reerink"}, {"name": "Siert Sebus"}, {"name": "Sébastian de Bon"}], "author_count": 4}, {"id": "2607.26856", "category": "quant-ph", "title": "Enhancing the security of coherent one-way quantum key distribution using CHSH correlations", "abstract": "The coherent one-way (COW) protocol is a quantum key distribution scheme that has attracted significant attention, leading to the development and commercialization of practical implementations. Despite this progress, the security of the COW protocol has remained a fundamental challenge since its introduction. Numerous studies have investigated its security, and several security proofs have been proposed over the years. More recently, a number of works have questioned the security of this protocol. In particular, one of the latest studies introduced an attack that severely limits the security of COW-QKD and reported a maximum secure distance of less than 20km. In this work, we introduce minimal alteration to the COW protocol that can enhance its security. Specifically, instead of monitoring the coherence between successive pulses, we propose to monitor quantum correlations through the violation of Bell inequalities. This approach enables the detection of a broader class of potential attacks. Our simulation results indicate that, by employing this method, the maximum secure distance of the protocol can be extended to approximately 259km.", "url": "https://arxiv.org/abs/2607.26856", "type": "理论+数值", "summary": "相干单向（COW）协议是一种引起了广泛关注的量子密钥分配方案，导致了实际实现的开发和商业化。尽管取得了这些进展，COW 协议的安全性自推出以来仍然是一个根本挑战。大量研究调查了其安全性，多年来提出了几种安全证明。最近，许多作品对该协议的安全性提出了质疑。特别是，最新的一项研究介绍了一种严重限制 COW-QKD 安全性的攻击，并报告最大安全距离小于 20 公里。在这项工作中，我们对 COW 协议进行了最小的修改，以增强其安全性。具体来说，我们建议通过违反贝尔不等式来监测量子相关性，而不是监测连续脉冲之间的相干性。这种方法能够检测更广泛的潜在攻击类别。我们的仿真结果表明，通过采用这种方法，协议的最大安全距离可以扩展到大约259km。", "authors": [{"name": "Mahdi Shaban"}, {"name": "Farnaz Farman"}, {"name": "Alireza Bahrampour"}], "featured_authors": [{"name": "Mahdi Shaban"}, {"name": "Farnaz Farman"}, {"name": "Alireza Bahrampour"}], "author_count": 3}, {"id": "2607.26999", "category": "quant-ph", "title": "Two-state generator extraction: property currents and a two-layer arrow of time in pre- and post-selected quantum dynamics", "abstract": "Conditioning on both past and future assigns intermediate-time properties a causal observer does not; these time-symmetric assignments obey exact symmetry theorems and are measurable from trajectories. We use two-state generator extended dynamic mode decomposition (gEDMD): because weak values obey $dA_w/dt=i\\langle[H,A]\\rangle_w$ exactly, generator extraction, with an exact-derivative baseline, applies unchanged to them. First, a reflection involution on the pre-/post-selected ensemble splits every window-fitted friction uniquely as $\\gamma_{fwd}=\\gamma_A+\\gamma_S$: $\\gamma_A$, antisymmetric about the midpoint, carries the modes' boundary-condition physics; $\\gamma_S$, symmetric, comes from the differencing scheme; both follow from the same data as $(\\gamma_{fwd}\\pm\\gamma_{bwd})/2$. At a fixed inference resolution the arrow of time has two layers: the coherent-mode arrow reverses at the midpoint, the fluctuation-level one does not, $\\gamma_S$ dominating $\\gamma_A$ at every size and class. The difference is one of degree: $\\gamma_S$ is 34 times larger there than at the mode layer, and with the exact derivative both layers reverse: immunity belongs to the inference, not the ensemble. Second, in a lattice interferometer conditioned only at its ports, the quantum Cheshire-cat structure emerges unimposed: particle and polarization obey separate continuity equations, and a local field in the polarization-carrying arm rotates that phase alone, at exactly twice the field strength, entering the generator as a rigid imaginary shift, while the particle's weak density stays invariant to machine precision. We verify the sample-level identity and the two layers from $2^8$ to $2^{20}$ dimensions: $|\\gamma_A|/\\gamma_S=0.09$ to $0.27$ across five classes; self-averaging makes it insensitive to class among those sharing a boundary modulation, removing the $2^{-N/2}$ overlap obstruction for $N$ qubits.", "url": "https://arxiv.org/abs/2607.26999", "type": "理论", "summary": "以过去和未来为条件赋予了因果观察者所没有的中间时间属性；这些时间对称分配遵循精确的对称定理，并且可以从轨迹进行测量。我们使用二态生成器扩展动态模式分解（gEDMD）：因为弱值完全服从 $dA_w/dt=i\\langle[H,A]\\rangle_w$，所以具有精确导数基线的生成器提取对它们不变。首先，前/后选择系综上的反射对合将每个窗口拟合摩擦唯一地分割为$\\gamma_{fwd}=\\gamma_A+\\gamma_S$：$\\gamma_A$，关于中点反对称，承载模式的边界条件物理； $\\gamma_S$，对称，来自差分格式；两者都来自与 $(\\gamma_{fwd}\\pm\\gamma_{bwd})/2$ 相同的数据。在固定的推理分辨率下，时间箭头有两层：相干模式箭头在中点反转，波动级别箭头则不然，$\\gamma_S$ 在每个大小和类别上都支配 $\\gamma_A$。差异是一级的：$\\gamma_S$ 比模式层大 34 倍，并且通过精确导数，两层都相反：免疫属于推理，而不是集成。\n\n其次，在仅在其端口处进行调节的晶格干涉仪中，量子柴郡猫结构是不强加的：粒子和偏振遵循单独的连续性方程，并且偏振承载臂中的局部场单独旋转该相位，其场强正好两倍，以刚性虚移的形式进入发生器，而粒子的弱密度对于机器精度保持不变。我们验证样本级身份以及从 $2^8$ 到 $2^{20}$ 维度的两个层：跨五个类别的 $|\\gamma_A|/\\gamma_S=0.09$ 到 $0.27$；自平均使其对共享边界调制的类别不敏感，从而消除了 $N$ 量子位的 $2^{-N/2}$ 重叠障碍。", "authors": [{"name": "Seiki Saito"}], "featured_authors": [{"name": "Seiki Saito"}], "author_count": 1}, {"id": "2607.27013", "category": "quant-ph", "title": "Finite size scaling of bitstring probability distributions for Rydberg arrays", "abstract": "We calculate the probabilities $p_{\\{n\\}}$ of the measured bitstrings $\\{n\\}$ for the vacuum of Rydberg ladders with $N_q$ atoms. As $N_q$ increases, the $p_{\\{n\\}}$ decrease but become more dense in the low $p$ region raising the possibility that their smallness could be compensated by their large number. The importance of the low probability states can be estimated from the cumulative probability distribution $\\Sigma(p_{\\Lambda},N_q)$, which is the probability to observe any state having a probability $p\\leq p_{\\Lambda}$. For not too large values of $p_{\\Lambda}$, it is possible to approximately collapse the $\\Sigma(p_{\\Lambda},N_q)$ for successive $N_q$ into a function resembling the Fermi function when plotted as a function of $-\\ln(p_{\\Lambda})$. We show that the number of shots necessary to reduce $\\Sigma(p_{\\Lambda},N_q)$ to some low enough value grows exponentially with $N_q$. We discuss the implications for calculating observables associated with the vacuum.", "url": "https://arxiv.org/abs/2607.27013", "type": "理论", "summary": "我们计算具有 $N_q$ 原子的里德伯阶梯真空的测量位串 $\\{n\\}$ 的概率 $p_{\\{n\\}}$。随着 $N_q$ 的增加，$p_{\\{n\\}}$ 减少，但在低 $p$ 区域变得更加密集，这增加了它们的小可以通过它们的大数量来补偿的可能性。低概率状态的重要性可以根据累积概率分布 $\\Sigma(p_{\\Lambda},N_q)$ 来估计，该分布是观察任何具有概率 $p\\leq p_{\\Lambda}$ 的状态的概率。对于不太大的 $p_{\\Lambda}$ 值，当绘制为 $-\\ln(p_{\\Lambda})$ 的函数时，可以将连续 $N_q$ 的 $\\Sigma(p_{\\Lambda},N_q)$ 近似折叠为类似于费米函数的函数。我们表明，将 $\\Sigma(p_{\\Lambda},N_q)$ 减少到足够低的值所需的射击次数随着 $N_q$ 呈指数增长。我们讨论计算与真空相关的可观测量的含义。", "authors": [{"name": "Zane Ozzello"}, {"name": "Avi Kaufman"}, {"name": "Yannick Meurice"}], "featured_authors": [{"name": "Zane Ozzello"}, {"name": "Avi Kaufman"}, {"name": "Yannick Meurice"}], "author_count": 3}, {"id": "2607.27015", "category": "quant-ph", "title": "Reliability Functions of Quantum Soft Covering and Privacy Amplification via a Mixed-Order Rényi Divergence", "abstract": "In this paper, we introduce a novel mixed-order Rényi divergence and investigate its fundamental properties. Using this divergence, we define a family of mixed-order order-two Rényi mutual information and Rényi conditional entropy. We derive exact reliability functions of quantum soft covering and privacy amplification under the sandwiched Rényi divergence with order $\\alpha\\in[2,\\infty)$. The former is jointly characterized by the sandwiched and mixed-order order-two Rényi mutual information quantities, while the latter is characterized by the corresponding conditional entropies. These results provide operational interpretations of the proposed mixed-order Rényi divergence. To the best of our knowledge, this is the first exact characterization of the reliability function for quantum soft covering.", "url": "https://arxiv.org/abs/2607.27015", "type": "理论", "summary": "在本文中，我们介绍了一种新颖的混合阶 Rényi 散度并研究了其基本属性。利用这种散度，我们定义了一族混合阶二阶 Rényi 互信息和 Rényi 条件熵。我们推导了阶数 $\\alpha\\in[2,\\infty)$ 夹层 Rényi 散度下量子软覆盖和隐私放大的精确可靠性函数。前者由夹层和混合阶二阶Rényi互信息量共同表征，后者由相应的条件熵表征。这些结果提供了对所提出的混合阶 Rényi 背离的操作解释。据我们所知，这是量子软覆盖可靠性函数的首次精确表征。", "authors": [{"name": "Shi-Bing Li"}, {"name": "Hongsen Qiu"}, {"name": "Xinyu Zhang"}], "featured_authors": [{"name": "Shi-Bing Li"}, {"name": "Hongsen Qiu"}, {"name": "Xinyu Zhang"}], "author_count": 3}, {"id": "2607.27060", "category": "quant-ph", "title": "Optimising Trotter-Suzuki Simulations of Markovian Open Quantum Systems via Classical Search", "abstract": "Simulating an open quantum system on a digital quantum computer often involves the use of Trotter-Suzuki (TS) Product Formulas (PF) to approximate the system's time evolution. Precise estimates for the required number of Trotter steps (and hence the overall gate count) can be crucial for minimising the computational cost of these methods. Building on established theoretical guarantees, we derive analytic bounds for the First- and Second-Order Deterministic and Randomised TS-PF, directly relating the number of Trotter steps to the model parameters, evolution time and precision. These bounds enable concrete resource estimation for each method. We then present a computationally efficient classical algorithm that uses diamond norm estimates of individual Liouvillian terms and a binary search to significantly reduce the Trotter steps required for a target precision. Our numerical results on two prototypical models - an XX-Spin Chain with boundary driving and local dephasing, and a Transverse-Field Ising Model - show that the theoretical (analytic) bounds are often overly conservative, whereas the empirical (optimised) bounds yield a significantly smaller number of Trotter steps for the same precision. Among the methods investigated, the Second-Order Randomised TS-PF typically achieves the lowest resource demands, especially for larger systems. These findings emphasise the significance of empirical bounding strategies in achieving more resource-efficient simulations of Markovian open quantum systems.", "url": "https://arxiv.org/abs/2607.27060", "type": "理论+数值", "summary": "在数字量子计算机上模拟开放量子系统通常涉及使用 Trotter-Suzuki (TS) 乘积公式 (PF) 来近似系统的时间演化。精确估计所需的 Trotter 步骤数（以及总门数）对于最小化这些方法的计算成本至关重要。基于已建立的理论保证，我们推导出一阶和二阶确定性和随机 TS-PF 的分析界限，将 Trotter 步数与模型参数、演化时间和精度直接相关。这些界限使得每种方法能够进行具体的资源估计。然后，我们提出了一种计算高效的经典算法，该算法使用单个刘维尔项的钻石范数估计和二分搜索来显着减少目标精度所需的 Trotter 步骤。\n\n我们对两个原型模型（具有边界驱动和局部相移的 XX-Spin Chain 以及横向场 Ising 模型）的数值结果表明，理论（分析）边界通常过于保守，而经验（优化）边界在相同精度下产生的 Trotter 步数要少得多。在所研究的方法中，二阶随机 TS-PF 通常可以实现最低的资源需求，特别是对于较大的系统。这些发现强调了经验边界策略在实现马尔可夫开放量子系统更资源有效的模拟方面的重要性。", "authors": [{"name": "S. M. Pillay"}, {"name": "I.J. David"}, {"name": "I. Sinayskiy"}, {"name": "F. Petruccione"}], "featured_authors": [{"name": "S. M. Pillay"}, {"name": "I.J. David"}, {"name": "I. Sinayskiy"}, {"name": "F. Petruccione"}], "author_count": 4}, {"id": "2607.27075", "category": "quant-ph", "title": "Adaptive Multi-Backend Simulation of Near-Clifford Quantum Circuits via Spatial Stabilizer-Frame Partitioning", "abstract": "We present an exact amplitude simulator for Clifford+T quantum circuits that combines a Feynman path sum across a balanced qubit bipartition with stabilizer-frame simulation on each half. The construction extends prior stabilizer-based Schrödinger-Feynman methods in three directions: recursive multilevel bipartition into a binary tree, automatic fallback to dense state-vector simulation when a leaf's stabilizer frame would exceed its memory ceiling, and a cost-model-driven partition selector that replaces the standard cut-count minimization heuristic. We show cut-count minimization is an unreliable proxy in practice: a globally cleaner partition can reduce cross-cut count yet increase wall-clock time, because it imbalances T-gate density across halves and inflates per-half stabilizer-frame size. Our cost model substitutes the stabilizer-frame bound 2w for the dense 2n ceiling per side and explicitly models per-amplitude readout cost; isolating that term uncovered a quadratic-asymptotic inefficiency in the leaf simulator's end-of-path amplitude extraction, fixed by replacing it with an existing O(F * s * n) single-amplitude inner product. On a structured hierarchical n=16 benchmark the recursive simulator beats monolithic stabilizer-frame simulation by 92x to 17,645x, wins by 79x per path against a dense half-state-vector baseline under an identical cut, and beats a production state-vector simulator end to end by up to 47.9x (median ~5x). On adversarial random Clifford+T circuits the dense state vector wins past a crossover near n/2 cross-cut gates -- the regime the cost model identifies. The dominant cost, the cross-cut Feynman sum, is embarrassingly parallel with constant inter-worker communication, unlike recent matrix-product-state stabilizer-tensor methods whose inner contraction loop is sequential.", "url": "https://arxiv.org/abs/2607.27075", "type": "理论+数值", "summary": "我们提出了一种用于 Clifford+T 量子电路的精确振幅模拟器，它将平衡量子位二分的费曼路径和与每一半的稳定器框架模拟相结合。该结构在三个方向上扩展了先前基于稳定器的薛定谔-费曼方法：递归多级二分到二叉树，当叶子的稳定器框架超出其内存上限时自动回退到密集状态向量模拟，以及成本模型驱动的分区选择器取代了标准的切割计数最小化启发式。我们表明，在实践中，切割计数最小化是一个不可靠的代理：全局更清洁的分区可以减少横切计数，但会增加挂钟时间，因为它使两半的 T 门密度不平衡，并增加了每半稳定器框架的大小。我们的成本模型用稳定器框架边界 2w 代替每侧密集的 2n 上限，并明确模拟每个幅度的读出成本；分离该项发现了叶子模拟器的路径末端幅度提取中的二次渐近低效率，通过将其替换为现有的 O(F * s * n) 单幅度内积来修复。\n\n在结构化分层 n=16 基准上，递归模拟器比单片稳定器框架模拟高出 92 倍到 17,645 倍，在相同切割下每条路径比密集半状态向量基线高出 79 倍，并且从头到尾比生产状态向量模拟器高出 47.9 倍（中位数约为 5 倍）。在对抗性随机 Clifford+T 电路上，密集状态向量胜过 n/2 个横切门附近的交叉——成本模型识别的状态。主要成本，即横切费曼和，与不断的工作人员间通信令人尴尬地并行，这与最近的矩阵乘积状态稳定器张量方法不同，后者的内部收缩循环是顺序的。", "authors": [{"name": "Héctor J. García"}], "featured_authors": [{"name": "Héctor J. García"}], "author_count": 1}, {"id": "2607.27111", "category": "quant-ph", "title": "Effective Hamiltonians for Predictive Quantum Control", "abstract": "High-fidelity quantum control relies on accurate models of driven dynamics. We examine this re- quirement for single-qubit gates in superconducting transmons by comparing control pulses derived from the standard Duffing approximation and from a Hamiltonian constructed by diagonalizing the transmon eigenbasis. Using the same correction-pulse construction for both models, we show that correction fields derived from the Duffing approximation can substantially reduce the gate error pre- dicted by that model while remaining less effective when combined with an independently calibrated baseline pulse in the diagonalized-transmon model. In the fast-gate regime, such transferred correc- tions can even fail to improve over the uncorrected diagonalized-transmon baseline. We show that small model-dependent differences in both the energy spectrum and the representation of the drive operator can compound during driven evolution, resulting in different predicted error generators and correction pulses. A mismatch in the accumulated AC Stark phase provides one illustrative di- agnostic of this dynamical model dependence. We further demonstrate that the model Hamiltonian informs the choice of control framework: Omitting relevant leakage pathways or higher-order error channels can lead to an overly restricted correction strategy. Including these channels motivates an extended correction framework that improves the gate performance using the same physical control resources.", "url": "https://arxiv.org/abs/2607.27111", "type": "理论", "summary": "高保真量子控制依赖于驱动动力学的精确模型。我们通过比较从标准杜芬近似和通过对角化 Transmon 特征基构造的哈密顿量得出的控制脉冲来检查超导 Transmon 中单量子位门的这一要求。对两个模型使用相同的校正脉冲结构，我们表明，从杜芬近似导出的校正场可以大大减少该模型预测的门误差，但在与对角化传输模型中的独立校准基线脉冲结合时，效果仍然较差。在快速门机制中，这种转移校正甚至无法改善未校正的对角化传输基线。我们表明，能谱和驱动算子的表示中与模型相关的微小差异可以在驱动演化过程中复合，从而导致不同的预测误差生成器和校正脉冲。累积的 AC Stark 相位的不匹配为这种动态模型依赖性提供了一种说明性的诊断。\n\n我们进一步证明，模型哈密顿量告知控制框架的选择：省略相关泄漏路径或高阶误差通道可能会导致过度受限的校正策略。包含这些通道激发了扩展的校正框架，该框架使用相同的物理控制资源来提高门性能。", "authors": [{"name": "Razvan Stanescu"}, {"name": "Hugo Ribeiro"}], "featured_authors": [{"name": "Razvan Stanescu"}, {"name": "Hugo Ribeiro"}], "author_count": 2}, {"id": "2607.27116", "category": "quant-ph", "title": "Ky Fan majorization for binary tensor products", "abstract": "We provide a short proof of a Ky Fan-type majorization relation for the singular values of a sum of binary tensor products of matrices. This generalizes Alhejji's result ( arXiv:2410.18254 ) from two summands to arbitrary sums and from positive matrices to arbitrary matrices. As an application, we show a majorization relation between the singular values of a completely positive map and those of its Kraus operators.", "url": "https://arxiv.org/abs/2607.27116", "type": "理论", "summary": "我们提供了矩阵二元张量积之和的奇异值的 Ky Fan 型主化关系的简短证明。这将 Alhejji 的结果 ( arXiv:2410.18254 ) 从两个被加数推广到任意和以及从正矩阵推广到任意矩阵。作为一个应用，我们展示了完全正映射的奇异值与其克劳斯算子的奇异值之间的主要关系。", "authors": [{"name": "Michael M. Wolf"}, {"name": "Yuanheng Zhou"}], "featured_authors": [{"name": "Michael M. Wolf"}, {"name": "Yuanheng Zhou"}], "author_count": 2}, {"id": "2607.27117", "category": "quant-ph", "title": "The Keyl-Werner algorithm is not optimal for spectrum estimation", "abstract": "We give an algorithm which, given $n = O(d^2 \\cdot (\\log\\log(d)/\\log(d))^2)$ copies of $\\rho$, estimates the eigenvalues of $\\rho$ to constant error in total variation distance. Thus, we can learn the eigenvalues of a quantum state with fewer copies than the $\\Theta(d^2)$ needed to run full state tomography. This is the first improvement to spectrum estimation over the influential Keyl-Werner algorithm, which uses $n = \\Theta(d^2)$ copies, thereby resolving a question raised by Keyl and Werner in 2001 and refuting a 2016 conjecture of Wright. Our main technical tool is a new tomography guarantee, where the error of tomography in a particular direction $|w\\rangle$ scales with $\\langle w | \\rho |w\\rangle$ for all directions simultaneously. From this stronger \"relative-error\" bound, we recover better algorithms for principal component analysis in Bures distance and tomography in $\\chi^2$-divergence as corollaries.", "url": "https://arxiv.org/abs/2607.27117", "type": "理论+数值", "summary": "我们给出一种算法，给定 $n = O(d^2 \\cdot (\\log\\log(d)/\\log(d))^2)$ $\\rho$ 副本，估计 $\\rho$ 的特征值到总变异距离中的恒定误差。因此，我们可以用比运行全状态层析成像所需的 $\\Theta(d^2)$ 更少的副本来学习量子态的特征值。这是对颇具影响力的 Keyl-Werner 算法的频谱估计的首次改进，该算法使用 $n = \\Theta(d^2)$ 副本，从而解决了 Keyl 和 Werner 在 2001 年提出的问题，并反驳了 Wright 2016 年的猜想。我们的主要技术工具是新的断层摄影保证，其中特定方向上的断层摄影误差 $|w\\rangle$ 与 $\\langle w | 成比例。 \\rho |w\\rangle$ 同时适用于所有方向。从这个更强的“相对误差”界限，我们恢复了更好的算法，用于 Bures 距离中的主成分分析和 $\\chi^2$-散度中的层析成像作为推论。", "authors": [{"name": "Angelos Pelecanos"}, {"name": "Jack Spilecki"}, {"name": "Ewin Tang"}, {"name": "John Wright"}], "featured_authors": [{"name": "Angelos Pelecanos"}, {"name": "Jack Spilecki"}, {"name": "Ewin Tang"}, {"name": "John Wright"}], "author_count": 4}, {"id": "2607.27144", "category": "quant-ph", "title": "Parity-Based Time-Bin Encoding Enabling SWAP Between Polarization and Time-Bin Qubits", "abstract": "Multi-degree-of-freedom photonic quantum processing requires routing between degree-of-freedom (DOF) qubit encodings on a single photon. A SWAP between polarization and time-bin qubits is Multi-degree-of-freedom photonic quantum processing requires routing between degree-of-freedom (DOF) qubit encodings on a single photon. A SWAP between polarization and time-bin qubits is an advantageous primitive for such architectures, however conventional early/late time-bin encoding does not support bidirectional logical time-bin flips from late to early which limits the ability to implement certain quantum operations. We introduce a parity-based time-bin encoding in which logical $\\vert 0 \\rangle_T$ and $\\vert 1 \\rangle_T$ correspond to even and odd multiples of a spacing $\\Delta t$, so that a physical delay of $\\Delta t$ implements $\\vert 0 \\rangle_T \\leftrightarrow \\vert 1 \\rangle_T$. This encoding is the enabling ingredient that makes a polarization-controlled delay line implement $\\mathrm{CNOT}_{P \\rightarrow T}$ and aligns naturally with periodic refractive index modulation for $\\mathrm{CNOT}_{T \\rightarrow P}$. Composing three such CNOT operations sequentially results in a deterministic SWAP between polarization and time-bin degrees of freedom. We analyze field-based modulation polarization-rotation error probability and timing-resolution constraints set by both EOM drive electronics and photon detection.", "url": "https://arxiv.org/abs/2607.27144", "type": "理论", "summary": "多自由度光子量子处理需要在单个光子上的自由度 (DOF) 量子位编码之间进行路由。偏振和时间仓量子位之间的交换是多自由度光子量子处理需要在单个光子上的自由度 (DOF) 量子位编码之间进行路由。极化和时间仓量子位之间的交换对于此类架构来说是一个有利的原语，但是传统的早期/晚期时间仓编码不支持从后期到早期的双向逻辑时间仓翻转，这限制了实现某些量子操作的能力。我们引入了一种基于奇偶校验的时间仓编码，其中逻辑 $\\vert 0 \\rangle_T$ 和 $\\vert 1 \\rangle_T$ 对应于间距 $\\Delta t$ 的偶数和奇数倍，因此 $\\Delta t$ 的物理延迟实现了 $\\vert 0 \\rangle_T \\leftrightarrow \\vert 1 \\rangle_T$。这种编码是使偏振控制延迟线实现 $\\mathrm{CNOT}_{P \\rightarrow T}$ 并与 $\\mathrm{CNOT}_{T \\rightarrow P}$ 的周期性折射率调制自然对齐的关键要素。\n\n按顺序组合三个这样的 CNOT 操作会导致极化和时间仓自由度之间的确定性交换。我们分析了 EOM 驱动电子设备和光子检测所设置的基于场的调制偏振旋转误差概率和定时分辨率约束。", "authors": [{"name": "Adam Sultan"}, {"name": "Connor Kupchak"}], "featured_authors": [{"name": "Adam Sultan"}, {"name": "Connor Kupchak"}], "author_count": 2}, {"id": "2607.27153", "category": "quant-ph", "title": "Improved Methods for Determining Quantum Error Correcting Code Performance and Fault Tolerance", "abstract": "One of the central challenges in quantum error correction is determining the performance of a code in the low-error regimes needed to implement utility-scale computations. While performance at these error rates is not amenable to direct Monte Carlo simulation, it can be extrapolated from simulations at higher logical error rates, assuming the logical error rate scales predictably with increasing distance or decreasing physical error rate. However, the expected scaling depends sensitively on the minimum weight of uncorrectable error patterns. In many cases, the minimum weight is unknown since it depends not only on the theoretical code distance, but also on details of the implementation. Markov chain Monte Carlo (MCMC) methods, as adapted to quantum error correction by Bravyi and Vargo, provide a way to estimate logical failure rates in these low-error regimes via simulation. While offering significant gains over Monte Carlo, the described Metropolis algorithm makes small changes to the current logical failure patterns which results in slow convergence. In this paper, we argue that typical failure patterns include a large number of easily correctable errors that coexist alongside a malignant core. This observation motivates two new approaches to better evaluate code performance. First, we describe a pruning algorithm designed to obviate these correctable errors and focus on the problematic low-weight core. Second, we develop a novel family of Metropolis-Hastings algorithms, referred to as subregion MCMC. This technique is parameterized by the fraction of the error pattern that is resampled at each step, effectively interpolating between Monte Carlo and single step MCMC. We show that a judicious choice of this parameter results in far faster convergence than prior work.", "url": "https://arxiv.org/abs/2607.27153", "type": "理论+数值", "summary": "量子纠错的核心挑战之一是确定实现公用事业规模计算所需的低错误状态下代码的性能。虽然这些错误率下的性能不适合直接蒙特卡罗模拟，但可以从较高逻辑错误率下的模拟中推断出来，假设逻辑错误率可预测地随着距离的增加或物理错误率的减少而变化。然而，预期的缩放敏感地取决于不可纠正错误模式的最小权重。在许多情况下，最小权重是未知的，因为它不仅取决于理论代码距离，还取决于实现的细节。马尔可夫链蒙特卡罗 (MCMC) 方法适用于 Bravyi 和 Vargo 的量子纠错，提供了一种通过模拟估计这些低错误状态下逻辑故障率的方法。虽然与蒙特卡罗相比提供了显着的收益，但所描述的 Metropolis 算法对当前的逻辑故障模式进行了微小的更改，从而导致收敛速度缓慢。\n\n在本文中，我们认为典型的故障模式包括大量易于纠正的错误，这些错误与恶性核心共存。这一观察激发了两种更好地评估代码性能的新方法。首先，我们描述了一种修剪算法，旨在消除这些可纠正的错误，并重点关注有问题的低权重核心。其次，我们开发了一系列新颖的 Metropolis-Hastings 算法，称为子区域 MCMC。该技术通过每一步重新采样的误差模式的分数来参数化，从而有效地在蒙特卡洛和单步 MCMC 之间进行插值。我们表明，明智地选择这个参数会比之前的工作更快地收敛。", "authors": [{"name": "Michael Mullan"}, {"name": "Matthew Weippert"}, {"name": "Winton Brown"}], "featured_authors": [{"name": "Michael Mullan"}, {"name": "Matthew Weippert"}, {"name": "Winton Brown"}], "author_count": 3}, {"id": "2607.27171", "category": "quant-ph", "title": "OQRAM: Oblivious Quantum Random Access Memory for Securing Delegated Quantum Queries", "abstract": "Quantum query is a basic subroutine in many quantum algorithms, and Quantum Random Access Memory (QRAM) provides a natural way to realize such coherent query access. In delegated settings, however, a standard QRAM query interface can expose sensitive information to the server. This paper introduces oblivious QRAM, a cryptographic abstraction for privacy-preserving delegated coherent query access. The protocol consists of an offline refresh phase and an online protected query phase. The database is stored in an encrypted and shuffled layout, and each query is protected by coherent address masking using either a quantum-secure pseudorandom permutation (qPRP) based method or a quantum one-time pad (qOTP) based method. In the adopted client model, the online protection adds only modest quantum overhead beyond the query register, avoiding the exponential quantum resources that would otherwise be required by an equivalent local QRAM construction. The qPRP-based variant also supports multi-query use by distributing database refresh across multiple queries to reduce classical communication. To address malicious servers, decoy checks are further incorporated to strengthen privacy protection and enable probabilistic tampering detection. Compared with fully blind quantum computing, this framework provides a lighter abstraction tailored to private delegated QRAM access, significantly reducing quantum resource requirements on both the client and server sides and achieving an exponential reduction in quantum communication.", "url": "https://arxiv.org/abs/2607.27171", "type": "理论+数值", "summary": "量子查询是许多量子算法中的基本子程序，而量子随机存取存储器（QRAM）提供了实现这种相干查询访问的自然方式。然而，在委托设置中，标准 QRAM 查询接口可能会将敏感信息暴露给服务器。本文介绍了不经意的 QRAM，这是一种用于保护隐私的委托一致查询访问的加密抽象。该协议由离线刷新阶段和在线保护查询阶段组成。数据库以加密和打乱的布局存储，并且每个查询都通过使用基于量子安全伪随机排列 (qPRP) 的方法或基于量子一次性填充 (qOTP) 的方法的一致地址掩码进行保护。在采用的客户端模型中，在线保护仅在查询寄存器之外添加适度的量子开销，从而避免了等效本地 QRAM 构造所需的指数量子资源。基于 qPRP 的变体还支持多查询使用，通过在多个查询之间分配数据库刷新来减少传统通信。\n\n为了应对恶意服务器，进一步结合诱饵检查来加强隐私保护并实现概率篡改检测。与全盲量子计算相比，该框架为私有委托QRAM访问提供了更轻的抽象，显着降低了客户端和服务器端的量子资源需求，实现了量子通信的指数级减少。", "authors": [{"name": "Shifan Xu"}, {"name": "Yizhuo Tan"}, {"name": "Yongshan Ding"}, {"name": "Jakub Szefer"}], "featured_authors": [{"name": "Shifan Xu"}, {"name": "Yizhuo Tan"}, {"name": "Yongshan Ding"}, {"name": "Jakub Szefer"}], "author_count": 4}, {"id": "2607.27173", "category": "quant-ph", "title": "Classical and Quantum MacWilliams Transforms as Spin Kinematics", "abstract": "Spin is the hidden engine behind the zoo of MacWilliams transforms in weight enumerator theories - not only for qubits and qudits, but even for classical codes. From nothing more than a split into trivial and nontrivial errors, we kinematically derive the MacWilliams transform as a Wigner-$D$ rotation between two canonical bases. Within each classical and quantum theory, changing the length $n$ leaves the rotation untouched: the same element simply reappears at spin $n/2$. And at fixed $n$, changing the rotation axis simply moves between the various classical and quantum theories.", "url": "https://arxiv.org/abs/2607.27173", "type": "理论", "summary": "Spin is the hidden engine behind the zoo of MacWilliams transforms in weight enumerator theories - not only for qubits and qudits, but even for classical codes. From nothing more than a split into trivial and nontrivial errors, we kinematically derive the MacWilliams transform as a Wigner-$D$ rotation between two canonical bases. Within each classical and quantum theory, changing the length $n$ leaves the rotation untouched: the same element simply reappears at spin $n/2$.在固定的 $n$ 下，改变旋转轴只是在各种经典理论和量子理论之间移动。", "authors": [{"name": "Eric Kubischta"}, {"name": "Ian Teixeira"}], "featured_authors": [{"name": "Eric Kubischta"}, {"name": "Ian Teixeira"}], "author_count": 2}, {"id": "2607.27185", "category": "quant-ph", "title": "Sharp Bounds on Ground State Energy of the SYK Model", "abstract": "We study the Sachdev-Ye-Kitaev (SYK) Hamiltonian $H_{\\operatorname{SYK}}$ on $n$ Majorana modes with $k$-body interactions, and prove that $\\mathbb{E}\\|H_{\\operatorname{SYK}}\\|_{\\operatorname{op}} = (1 - o(1))\\cdot\\sqrt{2n}/k$ for super-constant $k\\leq o(\\sqrt{n})$, where the expectation is over the disorder variables in the Hamiltonian. This confirms the predictions due to Garcia-Garcia, Jia and Verbaarschot'18 and answers a question posed in Feng, Tian and Wei'19. Our results extend to the sparse SYK Hamiltonian. As a corollary, we obtain that the dissipative quantum algorithm of Basso, Chen and Dalzell'24 provably computes the ground state energy of the SYK Hamiltonian up to an $O(1)$-multiplicative factor for all $k < \\sqrt{n}/4$. Our key technical idea is identifying an explicit, deterministic linear operator $\\mathsf{x}$ such that a fixed quadratic form of $\\mathsf{x}^{2\\ell}$ exactly equals the expected trace moments of the SYK Hamiltonian for every $n$ and $k$. This linear operator can be naturally viewed as a \\emph{twisted} model of bosons on the space of hyperedges of a hypergraph. The problem thus reduces to identifying the spectral edge of $\\mathsf{x}$, which we show is dominated by the spectrum of a natural ${n \\choose k}$-dimensional matrix from the \\emph{Johnson} scheme and is straightforward to compute using known results. To show that our bound is sharp, we construct a witness state with a large quadratic form on $\\mathsf{x}$ and transform it into a certificate of a lower bound on the largest quadratic form on $H_{\\operatorname{SYK}}$.", "url": "https://arxiv.org/abs/2607.27185", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arpon Basu"}, {"name": "Pravesh K. Kothari"}, {"name": "Siddhant Midha"}], "featured_authors": [{"name": "Arpon Basu"}, {"name": "Pravesh K. Kothari"}, {"name": "Siddhant Midha"}], "author_count": 3}, {"id": "2607.27195", "category": "quant-ph", "title": "Very Strong Irreversibility of Quantum Entanglement", "abstract": "The manipulation of quantum entanglement is fundamentally irreversible: some mixed entangled states require pure entanglement for their preparation, although no pure entanglement can be recovered from them by local operations and classical communication. This irreversibility is known to persist even under the maximal class of operations that do not generate entanglement, revealing a fundamental distinction between entanglement theory and thermodynamics. We construct cases for which any attempt to restore reversibility necessarily incurs an error that increases exponentially with the number of copies. Technically, we demonstrate a strict separation between the exponential strong-converse distillable entanglement and the exponential strong-converse entanglement cost. Our result resolves a conjecture posed by Lami and Regula (Nat. Phys. 19, 184-189 (2023)) and strengthens it by showing that the irreversibility of entanglement persists even at the level of polynomially (in the number of copies) growing error. We further derive a semidefinite-programming lower bound on the exponential strong-converse cost under non-entangling operations. Finally, for the class of completely PPT-preserving operations, we construct analytically solvable families of antisymmetric states exhibiting the exponential strong-converse irreversibility. Remarkably, to our knowledge, no analogous separation between exponential strong converse cost and the analogous distillable entanglement is currently known even under the more restrictive class of LOCC operations.", "url": "https://arxiv.org/abs/2607.27195", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tulja Varun Kondra"}, {"name": "Raphael Brinster"}, {"name": "Hermann Kampermann"}, {"name": "Dagmar Bruß"}, {"name": "Nikolai Wyderka"}], "featured_authors": [{"name": "Tulja Varun Kondra"}, {"name": "Raphael Brinster"}, {"name": "Hermann Kampermann"}, {"name": "Dagmar Bruß"}, {"name": "Nikolai Wyderka"}], "author_count": 5}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
