性。随着应变进一步增加，向上移动的 dz2 能带与 dxy 能带杂交，重建配对活性 d 轨道能带并诱导二次更强的能隙增强。总的来说，这两个阶段将超导能隙从 17.8 meV 扩大到 23.6 meV。在整个过程中，不变的费米波矢量证实增强源自能带重整化和重构，而不是载流子掺杂。我们的工作建立了一条通过应变激活电子相关性和能带工程来定制超导态的途径，并揭示了一种以前未被认识的轨道选择性配对机制，对相关多带超导体具有广泛的影响。", "authors": [{"name": "Guihao Jia"}, {"name": "Jingming Yan"}, {"name": "Yucong Peng"}, {"name": "Shendong Su"}, {"name": "Pei Ouyang"}, {"name": "Xiaopeng Hu"}, {"name": "Qi-Kun Xue"}, {"name": "Wei Li"}], "featured_authors": [{"name": "Guihao Jia"}, {"name": "Jingming Yan"}, {"name": "Yucong Peng"}, {"name": "Xiaopeng Hu"}, {"name": "Qi-Kun Xue"}, {"name": "Wei Li"}], "author_count": 8}, {"id": "2607.27112", "category": "cond-mat", "title": "Interaction-induced sign reversal of the orbital magnetic susceptibility in Chern insulators", "abstract": "It has been well established that the orbital magnetization of interacting electrons can be simply evaluated by applying the single-particle formula to self-consistent HF bands. However, we show that such procedure fails qualitatively for orbital magnetic susceptibility, especially in topological systems: in a Chern-insulating phase of twisted MoTe$_2$, the interaction-induced correction reverses the sign of the susceptibility. This result follows from an algebraic framework that solves the HF problem at finite magnetic field, where noncommuting canonical momenta obstruct a direct calculation: a \\emph{reverse Peierls substitution} maps every magnetic-translation-invariant operator to a unique bivariate function, converting the finite-field self-consistency into a function equation that can be expanded systematically in $B$. At first order, this yields a linear equation for the field-induced change $\\delta X$ of the Fock potential, leading to an intrinsically interaction-induced susceptibility in addition to a single-particle-like one. The framework reproduces the Středa formula for insulators, and an auxiliary-Hilbert-space construction carries it to periodic and moiré systems. Finite-field HF calculations in a gapped Dirac model and in the twisted-MoTe$_2$ Chern insulator confirm the theory quantitatively.", "url": "https://arxiv.org/abs/2607.27112", "type": "理论+数值", "summary": "众所周知，相互作用电子的轨道磁化强度可以通过将单粒子公式应用于自洽高频带来简单地评估。然而，我们表明，这种过程对于轨道磁化率来说在定性上是失败的，特别是在拓扑系统中：在扭曲 MoTe$_2$ 的陈绝缘相中，相互作用引起的校正反转了磁化率的符号。这个结果来自解决有限磁场下的 HF 问题的代数框架，其中非对易正则动量阻碍了直接计算：\\emph{反向 Peierls 替换}将每个磁平移不变算子映射到唯一的二元函数，将有限场自洽转换为可以在 $B$ 中系统展开的函数方程。在一阶上，这产生了 Fock 势场引起的变化 $\\delta X$ 的线性方程，除了单粒子状磁化率之外，还导致了本质上相互作用引起的磁化率。该框架重现了绝缘体的 Středa 公式，并且辅助希尔伯特空间结构将其带入周期和莫尔系统。\n\n有间隙狄拉克模型和扭曲 MoTe$_2$ Chern 绝缘体中的有限场高频计算定量地证实了该理论。", "authors": [{"name": "Ke Huang"}, {"name": "Xiao Li"}], "featured_authors": [{"name": "Ke Huang"}, {"name": "Xiao Li"}], "author_count": 2}, {"id": "2607.27156", "category": "cond-mat", "title": "Direct minimization versus iterative embedding in the ghost-Gutzwiller method: a comparative study of magnetism in Mott insulators", "abstract": "Accurately describing a hypothetical symmetry-invariant Mott insulator presents a long-standing ing challenge in iterative quantum embedding methods. We address this issue within the ghost- Gutzwiller method, which can be solved either through an iterative embedding scheme, analogous to dynamical mean-field theory, or by directly minimizing its variational energy functional. Across the Mott transition of the single-band Hubbard model, these formally equivalent approaches behave very differently: the iterative scheme is computationally efficient but fragile, necessitating ad-hoc recipes in the Mott phase that fail in a Zeeman field, leading to a discontinuous energy and a spurious fully-polarized insulator. Direct minimization avoids these artifacts, stabilizing a genuinely paramagnetic solution. Conversely, when symmetry breaking is allowed, as in an antiferromagnetic phase, the iterative scheme yields the correct solution, closely aligning with dynamical mean-field theory. Our findings delineate the conditions under which the iterative embedding can be trusted and when direct minimization is instead required.", "url": "https://arxiv.org/abs/2607.27156", "type": "理论+数值", "summary": "准确描述假设的对称不变莫特绝缘体是迭代量子嵌入方法中长期存在的挑战。我们在 Ghost-Gutzwiller 方法中解决了这个问题，该方法可以通过类似于动态平均场理论的迭代嵌入方案来解决，或者通过直接最小化其变分能量泛函来解决。在单带哈伯德模型的莫特转变中，这些形式上等效的方法表现得非常不同：迭代方案计算效率高但脆弱，需要莫特阶段的临时配方，但在塞曼场中失败，导致不连续能量和虚假的全极化绝缘体。直接最小化可以避免这些伪影，从而稳定真正的顺磁解决方案。相反，当允许对称性破缺时，如在反铁磁相中，迭代方案会产生正确的解，与动态平均场理论密切相关。我们的研究结果描述了迭代嵌入可以被信任的条件以及何时需要直接最小化。", "authors": [{"name": "Antonio Maria Tagliente"}, {"name": "Ivan Pasqua"}, {"name": "Michele Fabrizio"}], "featured_authors": [{"name": "Antonio Maria Tagliente"}, {"name": "Ivan Pasqua"}, {"name": "Michele Fabrizio"}], "author_count": 3}, {"id": "2607.26124", "category": "hep-th", "title": "Gravitational Waves from Multiple Cosmic Superstrings and the Overshoot Problem", "abstract": "Post inflationary string cosmology can feature an initial population of multiple species of cosmic superstrings whose tension is controlled by a modulus rolling over a steep potential toward a late-time minimum. We perform a full analysis of the associated dynamical system, finding that overshooting the minimum is prevented by the friction of a radiation background of gravitational waves produced from the early decay of effective strings arising from NS5- and D3-branes wrapped around internal cycles. On the other hand, fundamental strings survive longer and decay when the modulus is oscillating around the minimum and they have about $1/3$ of the total energy density. The spectrum of gravitational waves generated by the decays of these multiple cosmic superstrings, even if diluted by a late epoch of modulus domination, can still result in a high-frequency, multi-peaked signal, offering an observational signature of generic features of string theory.", "url": "https://arxiv.org/abs/2607.26124", "type": "理论", "summary": "暴涨后的弦宇宙学可以表征多种宇宙超弦的初始种群，其张力由一个模量控制，该模量在陡峭的势能上滚动到后期最小值。我们对相关动力系统进行了全面分析，发现超过最小值是通过引力波辐射背景的摩擦来防止的，引力波辐射背景是由包裹在内部循环的 NS5 和 D3 膜产生的有效弦的早期衰变产生的。另一方面，当模量在最小值附近振荡时，基本弦的寿命更长并会衰减，并且它们的能量密度约为总能量密度的 1/3$。这些多重宇宙超弦衰变产生的引力波频谱，即使被模数统治的晚期时代稀释，仍然可以产生高频、多峰信号，提供弦理论一般特征的观测特征。", "authors": [{"name": "Luca Brunelli"}, {"name": "Michele Cicoli"}, {"name": "Muhammad Hassan"}, {"name": "Seyed Ehsan Qoreishi"}, {"name": "Francisco Gil Pedro"}], "featured_authors": [{"name": "Luca Brunelli"}, {"name": "Michele Cicoli"}, {"name": "Muhammad Hassan"}, {"name": "Seyed Ehsan Qoreishi"}, {"name": "Francisco Gil Pedro"}], "author_count": 5}, {"id": "2607.26126", "category": "hep-th", "title": "Iterative Gauging is Deconstruction", "abstract": "A recent construction showed that iteratively gauging symmetries of a quantum field theory can generate an emergent extra spatial dimension. Here we identify the precise mechanism underlying this phenomenon: it is dimensional deconstruction, the procedure by which an extra dimension is encoded in the structure of a quiver gauge theory. We demonstrate this by showing that the standard deconstruction action, upon dualizing the Goldstone fields on the Higgs branch, is exactly equivalent to the action produced by iterative gauging. The dictionary is transparent: quiver nodes correspond to gauge fields, and quiver links correspond to the gauge fields introduced to couple to magnetic symmetries. We further show that starting by gauging the electric rather than the magnetic symmetry produces the deconstructed theory written in the dual variables, with all coupling constants inverted.", "url": "https://arxiv.org/abs/2607.26126", "type": "理论", "summary": "最近的一个构造表明，迭代地测量量子场论的对称性可以产生一个新的额外空间维度。在这里，我们确定了这种现象背后的精确机制：它是维度解构，即在颤动规范理论的结构中编码额外维度的过程。我们通过证明在希格斯分支上对戈德斯通场进行二元化时的标准解构作用完全等同于迭代测量产生的作用来证明这一点。字典是透明的：箭袋节点对应于规范场，箭袋链接对应于引入耦合到磁对称性的规范场。我们进一步表明，从测量电对称性而不是磁对称性开始，可以产生用双变量编写的解构理论，所有耦合常数都相反。", "authors": [{"name": "Sebastian Franco"}, {"name": "Diego Rodriguez-Gomez"}], "featured_authors": [{"name": "Sebastian Franco"}, {"name": "Diego Rodriguez-Gomez"}], "author_count": 2}, {"id": "2607.26140", "category": "hep-th", "title": "CasimirRFM: A Mathematica package for Riemann-flat compactifications with Casimir energies", "abstract": "CasimirRFM is a Mathematica package for the study of compactifications on Riemann-flat manifolds and the computation of one-loop Casimir energies in higher-dimensional field theories and supergravity. It implements an efficient numerical evaluation of lattice sums using Ewald summation, and computes both lower-dimensional Casimir potentials and local higher-dimensional Casimir energy densities, allowing for general massless spectra and twisted boundary conditions. The package provides tools for constructing and analysing the finite groups defining these manifolds, determining invariant metrics and cohomology bases, identifying compatible spin structures, and computing moduli-space metrics. Moreover, it evaluates the traces of holonomy elements in the graviton, $p$-form, spinor, and Rarita-Schwinger representations. We describe the mathematical formulation and numerical implementation of the package, and illustrate its use through a compactification of Type IIB supergravity on $T^6/\\mathbb{Z}_8$, including the computation of the Casimir potential and the visualization of localised Casimir-brane contributions.", "url": "https://arxiv.org/abs/2607.26140", "type": "理论", "summary": "CasimirRFM 是一个 Mathematica 软件包，用于研究黎曼平坦流形的紧化以及高维场论和超引力中单环卡西米尔能量的计算。它使用 Ewald 求和对晶格和进行有效的数值计算，并计算低维卡西米尔势和局部高维卡西米尔能量密度，从而考虑到一般无质量谱和扭曲边界条件。该软件包提供了用于构建和分析定义这些流形的有限群、确定不变度量和上同调基、识别兼容自旋结构以及计算模空间度量的工具。此外，它还评估了引力子、$p$-形式、旋量和 Rarita-Schwinger 表示中完整元素的踪迹。我们描述了该包的数学公式和数值实现，并通过 $T^6/\\mathbb{Z}_8$ 上 IIB 型超重力的压缩来说明其用途，包括卡西米尔势的计算和局部卡西米尔膜贡献的可视化。", "authors": [{"name": "Bruno Valeixo Bento"}], "featured_authors": [{"name": "Bruno Valeixo Bento"}], "author_count": 1}, {"id": "2607.26194", "category": "hep-th", "title": "Toward an Observable Algebra for JT-de Sitter Space: Gap Protection and Modular Dressings", "abstract": "We investigate the relation between fundamental complements and regional operator algebras in global de Sitter space. For a finite union of open arcs on the time-symmetric circle of global dS$_2$, we show that the fundamental complement is determined by the largest complementary gap: a gap contributes precisely when its angular length is at least {\\pi}, and at most one gap can do so. In higher-dimensional global de Sitter space, the corresponding criterion is containment of an open hemisphere. We then study the operator-algebraic consequences in an abstract Möbius-covariant chiral conformal net. Each regional algebra is crossed with its vacuum modular flow using a shared auxiliary clock. We derive an exact criterion for inclusions between the resulting continuous cores and show that vacuum correlations obstruct this criterion when the larger region contains an additional spacelike arc. A compatible family can nevertheless be obtained on the finite Boolean algebra generated by a fixed collection of separated arcs by using a split product state. Motivated by the holograms prescription of Bousso and Penington, we introduce a representation-dependent commutant model for regional algebras. When the protected gap overlaps a fixed reference arc, the assigned algebra is a proper von Neumann subalgebra of the reference Type-II$_1$ factor. For an explicit two-arc family, adding an arbitrarily short antipodal component removes the fundamental complement and changes the assigned algebra discontinuously to the full reference algebra.", "url": "https://arxiv.org/abs/2607.26194", "type": "理论", "summary": "我们研究了全局德西特空间中的基本补集和区域算子代数之间的关系。对于全局 dS$_2$ 的时间对称圆上的开弧有限并，我们证明了基本补集是由最大互补间隙决定的：当间隙的角长度至少为 {\\pi} 时，间隙会精确地做出贡献，并且最多一个间隙可以做到这一点。在高维全局德西特空间中，相应的准则是开放半球的包含。然后，我们研究抽象莫比乌斯协变手性共形网络中的算子代数结果。每个区域代数都使用共享辅助时钟与其真空模流交叉。我们推导了所得连续核心之间夹杂物的精确标准，并表明当较大区域包含额外的空间弧时，真空相关性会阻碍该标准。然而，通过使用分裂乘积状态，可以在由分离弧的固定集合生成的有限布尔代数上获得兼容族。\n\n受 Bousso 和 Penington 的全息图规定的启发，我们引入了区域代数的依赖于表示的交换模型。当受保护间隙与固定参考弧重叠时，分配的代数是参考 Type-II$_1$ 因子的真冯诺依曼子代数。对于显式双弧族，添加任意短的对映分量会删除基本补集，并将指定的代数不连续地更改为完整的参考代数。", "authors": [{"name": "Hassan ElSayed"}], "featured_authors": [{"name": "Hassan ElSayed"}], "author_count": 1}, {"id": "2607.26197", "category": "hep-th", "title": "Intersection Bounds for BPS Strings in Six-Dimensional Supergravity", "abstract": "In six-dimensional $\\mathcal{N}=(1,0)$ supergravity, the structure of tensor moduli space is governed by primitive BPS string charges known as BPS generators and their intersection pairing. We derive bounds on the intersection numbers of these generators from a purely effective field theory (EFT) perspective. Although gauge anomaly cancellation constrains intersections between generators supporting gauge algebras, bounds for E-strings intersecting generators with self-intersection numbers $-2$ and $-3$ have previously remained incomplete. We show that the Zariski decomposition, interpreted as the charge lattice counterpart of the attractor mechanism, together with current algebra embeddings on the E-string worldsheet theory, yields strong universal bounds on these intersection numbers. These results establish the finiteness of tensor charge intersection numbers up to duality. The underlying structure was identified through AI-guided investigation and is proven here analytically using EFT arguments.", "url": "https://arxiv.org/abs/2607.26197", "type": "理论", "summary": "在六维 $\\mathcal{N}=(1,0)$ 超引力中，张量模空间的结构由称为 BPS 生成器的原始 BPS 串电荷及其交集配对控制。我们从纯粹有效场论（EFT）的角度推导出这些生成器的交集数的界限。尽管规范异常消除限制了支持规范代数的生成器之间的交集，但与具有自交数 $-2$ 和 $-3$ 的生成器相交的 E 弦的边界以前仍然不完整。我们证明，被解释为吸引子机制的电荷晶格对应物的 Zariski 分解，与 E 弦世界表理论中当前的代数嵌入一起，在这些交集数上产生了强大的通用界限。这些结果确立了张量电荷交叉数达到对偶性的有限性。底层结构是通过人工智能引导的调查确定的，并在此处使用 EFT 参数进行分析证明。", "authors": [{"name": "Hee-Cheol Kim"}, {"name": "Kai Xu"}], "featured_authors": [{"name": "Hee-Cheol Kim"}, {"name": "Kai Xu"}], "author_count": 2}, {"id": "2607.26319", "category": "hep-th", "title": "Nucleon spectra and wave functions from holographic models with dual Einstein-dilaton and Starobinsky-dilaton gravities", "abstract": "We study the nucleon spectra in two holographic set-ups: Einstein-dilaton and Starobinsky-dilaton gravity models. The Einstein-dilaton holographic model, also known as improved holographic QCD, have been proposed some time ago to describe confinement and glueball spectra. Recently, it has been applied to the case of mesons and nucleons. In this work, we reconsider the Einstein-dilaton holographic model to discuss the nucleon spectra introducing new parameters that allow us to improve the comparison with experimental data. Then, we extend this idea to the context of Starobinsky-dilaton gravity defining another improved holographic model. We use this new holographic model to reanalyse the nucleon spectra and also compare them with soft-wall model and experimental data.", "url": "https://arxiv.org/abs/2607.26319", "type": "理论", "summary": "我们研究了两种全息装置中的核子光谱：爱因斯坦膨胀引力模型和斯塔罗宾斯基膨胀引力模型。爱因斯坦膨胀全息模型，也称为改进的全息 QCD，不久前已被提出来描述约束和胶球光谱。最近，它已应用于介子和核子的情况。在这项工作中，我们重新考虑爱因斯坦膨胀全息模型来讨论核子光谱，引入新参数，使我们能够改进与实验数据的比较。然后，我们将这个想法扩展到斯塔罗宾斯基膨胀引力的背景下，定义了另一个改进的全息模型。我们使用这种新的全息模型重新分析核子光谱，并将其与软壁模型和实验数据进行比较。", "authors": [{"name": "Adão S. da Silva Junior"}, {"name": "Juan M. Z. Pretel"}, {"name": "Henrique Boschi-Filho"}], "featured_authors": [{"name": "Adão S. da Silva Junior"}, {"name": "Juan M. Z. Pretel"}, {"name": "Henrique Boschi-Filho"}], "author_count": 3}, {"id": "2607.26343", "category": "hep-th", "title": "D-branes and nonlinear interactions in the $AdS$ pure spinor string", "abstract": "We develop a coordinate-independent algebraic description of zero-field boundary conditions for the pure spinor string on $AdS_5\\times S^5$ in the closed-string channel. The construction is organized by involutive automorphisms of $\\mathfrak{psu}(2,2|4)$ that exchange the odd sectors of the $\\mathbb Z_4$ grading. Their fixed subalgebras provide candidate half-BPS, Lorentzian D-brane geometries with vanishing background world-volume flux, consistent with the standard $AdS_2$, $AdS_3\\times S^1$, $AdS_4\\times S^2$, and related embeddings. Together, the seven representatives realize the Lorentzian zero-flux D1, D3, D5, and D7 probe sectors considered here. We then construct a local ansatz for the matter and ghost boundary interactions and derive a system of consistency equations for the tangential superconnection, transverse embedding, and four ghost-gluing couplings. The resulting system is a set of Dirac-Born-Infeld-like equations of motion on the brane world-volume.", "url": "https://arxiv.org/abs/2607.26343", "type": "理论", "summary": "我们为闭弦通道中 $AdS_5\\times S^5$ 上的纯旋量弦开发了零场边界条件的坐标无关代数描述。该构造由 $\\mathfrak{psu}(2,2|4)$ 的内合自同构组织，交换 $\\mathbb Z_4$ 分级的奇数扇区。它们的固定子代数提供了候选的 half-BPS、洛伦兹 D 膜几何形状，其背景世界体积通量消失，与标准 $AdS_2$、$AdS_3\\times S^1$、$AdS_4\\times S^2$ 和相关嵌入一致。七位代表共同实现了此处考虑的洛伦兹零通量 D1、D3、D5 和 D7 探头扇区。然后，我们为物质和鬼边界相互作用构建了一个局部拟像，并推导了切向超连接、横向嵌入和四个鬼粘合耦合的一致性方程组。由此产生的系统是膜世界体积上的一组狄拉克-玻恩-因菲尔德式运动方程。", "authors": [{"name": "Brenno Carlini Vallilo"}], "featured_authors": [{"name": "Brenno Carlini Vallilo"}], "author_count": 1}, {"id": "2607.26415", "category": "hep-th", "title": "Generalized Bergshoeff-de Roo identification in the Supergravity frame", "abstract": "The effective action of string theory has a highly constrained structure due to the numerous symmetries of the underlying theory. Recently, a method known as the Generalized Bergshoeff-de Roo identification was developed, which exploits diffeomorphism, Lorentz and gauge invariance, along with T-duality, to derive higher-derivative couplings in the effective action within the framework of Double Field Theory. This method has been revisited and further refined to generate couplings directly within the standard Supergravity framework.", "url": "https://arxiv.org/abs/2607.26415", "type": "理论", "summary": "由于基础理论的众多对称性，弦理论的有效作用具有高度受限的结构。最近，开发了一种称为广义 Bergshoeff-de Roo 辨识的方法，该方法利用微分同胚、洛伦兹和规范不变性以及 T 对偶性，在双场论框架内推导出有效作用中的高导数耦合。该方法经过重新审视并进一步完善，可直接在标准超重力框架内生成耦合。", "authors": [{"name": "Walter H. Baron"}, {"name": "Fabian A. Portilla"}], "featured_authors": [{"name": "Walter H. Baron"}, {"name": "Fabian A. Portilla"}], "author_count": 2}, {"id": "2607.26532", "category": "hep-th", "title": "Massive and massless particles in Mielke--Baekler geometries", "abstract": "The Mielke--Baekler geometries are three-dimensional reductive homogeneous spacetimes together with a choice of invariant connection which is compatible with a lorentzian metric. The spacetimes generalise Minkowski and (anti)de~Sitter spacetimes in that the invariant metric connection can have torsion, a peculiarity of three dimensions. Using coadjoint orbits and the techniques of nonlinear realisations, we construct worldline actions for massive and massless spinning particles moving in these spacetimes. We pay particular attention to the so-called teleparallel branch, in which the curvature of the invariant connection vanishes. Apart from the trivial Minkowski case, this singles out anti-de~Sitter spacetime, as the only of these lorentzian manifolds admitting an invariant Weitzenböck connection; that is, a flat connection with torsion. The introduction of a Wess--Zumino term describing spin has, as a main consequence, the appearance of dynamical sectors (denoted ``regular'' and ``critical''), with a different number of physical degrees of freedom. In particular, in the massive case, we discuss the formulation of the dynamics in terms of either the Weitzenböck or the Levi-Civita connection, and the emergence of a Papapetrou-type forcing term in the critical sector. For the massless particle we study the Noether symmetries of the action, which, for the spinless case, include the conformal transformations. For nonzero spin, only the Killing subset survives as genuine Noether transformations in the regular sector, while in the critical sector any conformal Killing contribution can be set to zero by a gauge transformation.", "url": "https://arxiv.org/abs/2607.26532", "type": "理论", "summary": "Mielke-Baekler 几何是三维还原齐次时空以及与洛伦兹度量兼容的不变连接的选择。时空概括了闵可夫斯基和（反）德西特时空，因为不变度量连接可以具有挠率，这是三维的特性。使用共伴轨道和非线性实现技术，我们为在这些时空中移动的大量和无质量的旋转粒子构建了世界线动作。我们特别关注所谓的远程平行分支，其中不变连接的曲率消失。除了微不足道的闵可夫斯基案例之外，这还挑选出反德西特时空，作为这些洛伦兹流形中唯一承认不变的魏岑博克联系的；即具有扭转的平面连接。描述自旋的韦斯-祖米诺术语的引入，作为一个主要结果，出现了具有不同数量的物理自由度的动力扇区（表示为“常规”和“临界”）。\n\n特别是，在大规模情况下，我们讨论了根据 Weitzenböck 或 Levi-Civita 连接来表述动力学，以及关键区域中 Papapetrou 型强迫项的出现。对于无质量粒子，我们研究作用的诺特对称性，对于无自旋情况，包括共形变换。对于非零自旋，只有 Killing 子集作为常规扇区中的真正诺特变换而存在，而在关键扇区中，任何共形 Killing 贡献都可以通过规范变换设置为零。", "authors": [{"name": "Carles Batlle"}, {"name": "Roberto Casalbuoni"}, {"name": "Daniele Dominici"}, {"name": "José Figueroa-O'Farrill"}, {"name": "Joaquim Gomis"}], "featured_authors": [{"name": "Carles Batlle"}, {"name": "Roberto Casalbuoni"}, {"name": "Daniele Dominici"}, {"name": "José Figueroa-O'Farrill"}, {"name": "Joaquim Gomis"}], "author_count": 5}, {"id": "2607.26535", "category": "hep-th", "title": "Static topological dilatonic black hole with multiple horizons and its thermodynamics", "abstract": "We obtain a static topological charged black hole solution within Einstein-dilaton theory with nonlinear electromagnetic field represented by an infinite series over Maxwell field invariant. In contrast with standard Einstein-Maxwell-dilaton (EMD) theory where the black hole might have no more than two horizons, the nonlinear generalization might give rise to a solution with arbitrary number of horizons. We examine energy conditions and show that for the nonlinear electromagnetic field itself all the energy conditions are fulfilled outside of the black hole, whereas for the dilaton field the only condition which is not violated outside is the Null Energy Condition (NEC). We also study thermodynamics of the black hole and show that the thermal behaviour of the solution is considerably richer than for its standard EMD cousin. To have complete description of the thermodynamics we also use the Euclidean method, which allows us to consider the so-called Grand Canonical and Canonical Ensembles. The results obtained by different approaches show their consistency. The Euclidean description naturally allowed us to consider global stability, which is shown to have some common features with standard EMD solution, or even Reissner-Nordström black hole. But there some new peculiarities caused by the nonlinear field, namely we might have additional stable phases and a triple point. To examine near critical behaviour we consider the extended phase space approach, where the cosmological constant is supposed to be a thermodynamic variable. Making use of the extended formalism we also obtain the Smarr relation.", "url": "https://arxiv.org/abs/2607.26535", "type": "理论", "summary": "我们在爱因斯坦膨胀理论中获得了静态拓扑带电黑洞解，其非线性电磁场由麦克斯韦场不变量上的无限级数表示。与黑洞可能不超过两个视界的标准爱因斯坦-麦克斯韦膨胀 (EMD) 理论相反，非线性推广可能会产生具有任意视界数的解。我们检查了能量条件并表明，对于非线性电磁场本身，所有能量条件都在黑洞外部满足，而对于膨胀场，唯一在外部不被违反的条件是零能量条件（NEC）。我们还研究了黑洞的热力学，并表明该解决方案的热行为比其标准 EMD 同类要丰富得多。为了完整地描述热力学，我们还使用欧几里得方法，这使我们能够考虑所谓的大正则系综和正则系综。不同方法得到的结果显示出它们的一致性。\n\n欧几里得描述自然使我们能够考虑全局稳定性，这与标准 EMD 解甚至 Reissner-Nordström 黑洞具有一些共同特征。但是非线性场引起了一些新的特性，即我们可能有额外的稳定相位和三相点。为了检查近临界行为，我们考虑扩展相空间方法，其中宇宙学常数被认为是热力学变量。利用扩展形式主义，我们还获得了 Smarr 关系。", "authors": [{"name": "M. M. Stetsko"}], "featured_authors": [{"name": "M. M. Stetsko"}], "author_count": 1}, {"id": "2607.26868", "category": "hep-th", "title": "World-Line Actions in Weyl Geometry", "abstract": "In this note we construct, from a gauge theory perspective, the world-line action for a particle moving on a time-like curve in Weyl geometry. The action we find is dimensionless, Weyl invariant, additive and, in general, non-local due to an open Wilson line which we have to add in order to account for a general Weyl field. In special cases, this Wilson line can be local, but the geometry becomes integrable. The action can not be used to measure the proper time as it is dimensionless and no mass parameter is allowed in the symmetric phase of the theory. We show that the usual conditions for defining proper time: affine parametrization, dimension of time and additivity supplemented by the requirement of Weyl invariance can not be fulfilled simultaneously and therefore no satisfactory notion of proper time exists in the symmetric phase. Under spontaneous symmetry breaking the particle acquires a mass, the action becomes Riemannian and the proper time can be again defined. We also construct a classically equivalent quadratic action by using an einbein on the world-line and show that the non-locality can be seen to arise from integrating out a constrained field.", "url": "https://arxiv.org/abs/2607.26868", "type": "理论", "summary": "在这篇文章中，我们从规范理论的角度构建了在韦尔几何中的类时间曲线上运动的粒子的世界线作用。我们发现的作用是无量纲的、Weyl 不变的、可加的，并且通常是非局部的，因为我们必须添加开放的 Wilson 线才能解释一般的 Weyl 场。在特殊情况下，这条威尔逊线可以是局部的，但几何形状变得可积。该作用不能用于测量本征时间，因为它是无量纲的，并且在理论的对称相中不允许有质量参数。我们证明定义固有时间的通常条件：仿射参数化、时间维度和可加性并辅以Weyl不变性的要求不能同时满足，因此在对称相位中不存在令人满意的固有时间概念。在自发对称性破缺下，粒子获得质量，作用变为黎曼式，并且可以再次定义适当的时间。我们还通过使用世界线上的 einbein 构造了一个经典的等价二次作用，并表明非局域性可以看作是通过对约束场进行积分而产生的。", "authors": [{"name": "Cezar Condeescu"}, {"name": "Andrei Micu"}], "featured_authors": [{"name": "Cezar Condeescu"}, {"name": "Andrei Micu"}], "author_count": 2}, {"id": "2607.26919", "category": "hep-th", "title": "Quantum Fisher information of the Klein--Gordon, $ϕ^4$, and Dirac vacua", "abstract": "The quantum Fisher information (QFI) of the vacuum of three quantum field theories is evaluated with respect to the mass parameter of each theory. All field theories are considered on a $(d+1)$-dimensional Euclidean spacetime. We consider the Klein-Gordon field, a quartic interaction ($\\phi^4$) field theory, and the free Dirac field. In the case of the quartic interaction theory, the QFI is given perturbatively to first order in the interaction constant. For the free KG case, we find a $m^{d-2}$ dependence of the QFI, and thus no dependence for $d=2$, in agreement with the holographic duality characterizing the theory. The introduction of a quartic interaction is shown to lead to a QFI divergence in $d=3$ and to reduce the available information in the $d=0$ system. The vacuum QFI with respect to the free Dirac field mass is shown to be UV-divergent for $d=2$ and $d=3$, mass-dependent for $d=1$, and zero for $d=0$.", "url": "https://arxiv.org/abs/2607.26919", "type": "理论", "summary": "相对于每种理论的质量参数评估了三种量子场论真空的量子费希尔信息（QFI）。所有场论均在 $(d+1)$ 维欧几里得时空上考虑。我们考虑克莱因-戈登场、四次相互作用 ($\\phi^4$) 场论和自由狄拉克场。在四次相互作用理论的情况下，QFI 被微扰地赋予相互作用常数的一阶。对于自由 KG 的情况，我们发现 QFI 存在 $m^{d-2}$ 依赖性，因此对于 $d=2$ 没有依赖性，这与表征该理论的全息对偶性一致。四次相互作用的引入被证明会导致 $d=3$ 中的 QFI 发散，并减少 $d=0$ 系统中的可用信息。相对于自由狄拉克场质量的真空 QFI 对于 $d=2$ 和 $d=3$ 是 UV 发散的，对于 $d=1$ 是质量相关的，对于 $d=0$ 是零。", "authors": [{"name": "Preslav Asenov"}, {"name": "Alessio Serafini"}], "featured_authors": [{"name": "Preslav Asenov"}, {"name": "Alessio Serafini"}], "author_count": 2}, {"id": "2607.26931", "category": "hep-th", "title": "Extended Phase Space Thermodynamics and Joule-Thomson Expansion of Regular AdS Black Holes in a String Cloud", "abstract": "We investigate the extended phase space thermodynamics of a static, spherically symmetric regular black hole immersed in a string cloud background. By identifying the negative cosmological constant as a thermodynamic pressure, our analysis indicates that the quantum-inspired regularizing core and the string cloud density significantly affect the thermal stability of the black hole. We specifically illustrate a stringent scale invariance linked to the regularizing core, while the dimensionless string cloud parameter substantially alters the universal Van der Waals critical compressibility ratio. The significant geometric inconsistencies result in computed critical exponents that align with those of mean-field theory. We specify the Joule-Thomson expansion to define the isenthalpic heating and cooling regimes, so providing a comprehensive thermodynamic characterization of this non-singular spacetime.", "url": "https://arxiv.org/abs/2607.26931", "type": "理论", "summary": "我们研究了沉浸在弦云背景中的静态球对称规则黑洞的扩展相空间热力学。通过将负宇宙学常数识别为热力学压力，我们的分析表明，量子启发的正则化核心和弦云密度显着影响黑洞的热稳定性。我们特别说明了与正则化核心相关的严格尺度不变性，而无量纲弦云参数大大改变了通用范德华临界压缩比。显着的几何不一致导致计算出的临界指数与平均场理论的临界指数一致。我们指定焦耳-汤姆逊展开式来定义等焓加热和冷却状态，从而提供该非奇异时空的全面热力学表征。", "authors": [{"name": "Y. Elaima"}, {"name": "A. Daassou"}, {"name": "H. Lekbich"}, {"name": "F. Oubbad"}], "featured_authors": [{"name": "Y. Elaima"}, {"name": "A. Daassou"}, {"name": "H. Lekbich"}, {"name": "F. Oubbad"}], "author_count": 4}, {"id": "2607.27133", "category": "hep-th", "title": "Quantum Field Theory Of Cosmological Perturbations Induced By Ultralight Dark Matter", "abstract": "The growth of primordial perturbations during the matter-dominated era is primarily driven by dark matter. Ultralight scalar fields (ULDM) are a promising candidate for this role, conventionally modeled as operating in a classical, high-occupation regime. In this work, we develop a first-principles field-theoretic framework to investigate the impact of ULDM on linear cosmological perturbations during matter domination, explicitly retaining its quantum nature. Deriving a closed equation for the graviton field dynamics, we compute and regularize its source terms for a generic Gaussian initial state of the ULDM field within the adiabatic (WKB) approximation, employing the middle-point working assumption for non-local terms. After gauge-fixing we find that, contrary to previous claims, the classical condensate of ULDM has no influence on gravitational wave propagation. However, the time-dependent graviton effective mass induced by quantum pressure of the squeezed state can drive parametric resonance in specific primordial gravitational wave modes. We demonstrate this growth is negligible for non-relativistic ULDM at matter-radiation equality under the assumption of a power-law squeezing spectrum for masses in the range $m \\sim 10^{-21}{-}10^{-24}$ eV.", "url": "https://arxiv.org/abs/2607.27133", "type": "理论", "summary": "在物质主导时代，原初扰动的增长主要是由暗物质驱动的。超轻标量场（ULDM）是这一角色的一个有前途的候选者，传统上建模为在经典的高占用状态下运行。在这项工作中，我们开发了一个第一性原理场论框架来研究 ULDM 对物质统治期间线性宇宙扰动的影响，明确保留其量子性质。推导引力子场动力学的闭合方程，我们计算并正则化绝热（WKB）近似内 ULDM 场的通用高斯初始状态的源项，采用非局部项的中点工作假设。规范固定后，我们发现，与之前的说法相反，ULDM 的经典凝聚体对引力波传播没有影响。然而，压缩态量子压力引起的时间相关引力子有效质量可以驱动特定原初引力波模式的参量共振。\n\n我们证明，在假设质量幂律压缩谱在 $m \\sim 10^{-21}{-}10^{-24}$ eV 范围内的情况下，对于物质辐射相等的非相对论 ULDM，这种增长可以忽略不计。", "authors": [{"name": "Tomislav Prokopec"}, {"name": "Marco Vecchioni"}], "featured_authors": [{"name": "Tomislav Prokopec"}, {"name": "Marco Vecchioni"}], "author_count": 2}, {"id": "2607.27190", "category": "hep-th", "title": "Quadratic Axion Couplings in String Theory", "abstract": "Axions and axion-like particles are a compelling candidate for physics beyond the standard model. While many axion searches are focused on the linear coupling to photons $\\theta F \\tilde{F}$, the possibility of a quadratic coupling to the electromagnetic kinetic term, $\\theta^2 F^2$, leads to novel phenomenology and new opportunities for testing axion-like particles. In this work we propose mechanisms for generating this coupling in string theory, which can be broadly classified as classical, perturbative, and non-perturbative. In benchmark examples, we find that both perturbative and non-perturbative quantum contributions such as instantons lead to couplings that are suppressed, $g \\ll 1$ in units of $1/f^2$ where $f$ is axion decay constant, though easily larger than analogous coupling of the QCD axion that is generated through loops of charged pions. These analyses suggest that quadratic axion couplings to gauge fields are ubiquitous in string theory, and should be taken seriously as a probe of the string theory axiverse, both of string theory candidates for dynamical axions, such as dark matter or dark energy, and for spectroscopy of the string theory axiverse.", "url": "https://arxiv.org/abs/2607.27190", "type": "理论", "summary": "轴子和类轴子粒子是超越标准模型的物理学的有力候选者。虽然许多轴子搜索都集中在与光子 $\\theta F \\tilde{F}$ 的线性耦合上，但与电磁动力学项 $\\theta^2 F^2$ 的二次耦合的可能性，带来了新颖的现象学和测试类轴子粒子的新机会。在这项工作中，我们提出了在弦理论中产生这种耦合的机制，弦理论可以大致分为经典的、微扰的和非微扰的。在基准示例中，我们发现微扰和非微扰量子贡献（例如瞬子）都会导致耦合被抑制，$g \\ll 1$ 以 $1/f^2$ 为单位，其中 $f$ 是轴子衰减常数，但很容易大于通过带电π介子环生成的 QCD 轴子的类似耦合。这些分析表明，二次轴子与规范场的耦合在弦理论中普遍存在，并且应该认真对待作为弦理论轴宇宙的探索，这两者都是动态轴子（例如暗物质或暗能量）和弦理论轴宇宙光谱学的弦理论候选者。", "authors": [{"name": "Naman Agarwal"}, {"name": "Andrew R. Frey"}, {"name": "Ratul Mahanta"}, {"name": "Evan McDonough"}], "featured_authors": [{"name": "Naman Agarwal"}, {"name": "Andrew R. Frey"}, {"name": "Ratul Mahanta"}, {"name": "Evan McDonough"}], "author_count": 4}, {"id": "2607.26262", "category": "math-ph", "title": "The boundary-driven multispecies harmonic process", "abstract": "We introduce the multispecies version of the harmonic process on a one-dimensional chain in contact with boundary reservoirs. This process is a continuous-time Markov chain where each site can host an unbounded number of colored particles. The symmetric bulk dynamics is put in contact with reservoirs, which inject and remove particles driving the system out-of-equilibrium. The Markov generator of the process is identified with the integrable Hamiltonian of an open rational Heisenberg spin chain of higher rank. We derive the underlying R- and K-matrices in operator form and construct the double-row transfer matrix following Sklyanin. Similar to the monospecies case the R-matrix factorises into two R-operators, each factor corresponding to left and right moving particles. We further define three dual models: an absorbing particle model, a hidden parameter model and a heat conduction model.", "url": "https://arxiv.org/abs/2607.26262", "type": "理论", "summary": "我们引入了与边界储层接触的一维链上的调和过程的多物种版本。这个过程是一个连续时间的马尔可夫链，其中每个位点可以容纳无限数量的有色粒子。对称体动力学与储层接触，储层注入和去除导致系统失去平衡的颗粒。该过程的马尔可夫生成器被识别为高阶开放有理海森堡自旋链的可积哈密顿量。我们以算子形式导出基础 R 和 K 矩阵，并按照 Sklyanin 构造双行传输矩阵。与单种情况类似，R 矩阵分解为两个 R 算子，每个因子对应于左右移动的粒子。我们进一步定义了三个对偶模型：吸收粒子模型、隐藏参数模型和热传导模型。", "authors": [{"name": "Francesco Casini"}, {"name": "Rouven Frassek"}, {"name": "Cristian Giardinà"}], "featured_authors": [{"name": "Francesco Casini"}, {"name": "Rouven Frassek"}, {"name": "Cristian Giardinà"}], "author_count": 3}, {"id": "2607.26331", "category": "math-ph", "title": "Quantum Turing Patterns", "abstract": "We construct quantum Turing patterns in Lindblad lattice dynamics and establish a rigorous theory of their nonlinear order and quantum fluctuations. For an explicit completely positive family with finite-range couplings, the first-moment equations undergo a supercritical instability at a nonzero wave number and admit analytic site- and bond-centered commensurate stripe branches. These branches are locally asymptotically stable in their reflection-fixed period-cell spaces, and projected coherent states exhibit extensive Bragg order on every bounded time interval in the semiclassical limit. We prove $O(N^{-1/2})$ convergence of microscopic covariances to a nonautonomous Gaussian Lyapunov flow, transferring strict partial-transpose uncertainty violations to sufficiently large $N$. In the homogeneous Gaussian sector, a single dimensionless ratio controls both the Turing stability determinant and the logarithmic negativity of opposite momenta, relating wavelength selection directly to quantum entanglement. Differential transport shifts the strongest opposite-momentum correlations from the infrared to the selected Turing scale. Numerical continuation and two-dimensional simulations display stripe, spot, and labyrinth morphologies whose Fourier modes and fluctuation spectra concentrate at the same selected wave numbers.", "url": "https://arxiv.org/abs/2607.26331", "type": "理论", "summary": "我们在 Lindblad 晶格动力学中构建了量子图灵模式，并建立了其非线性顺序和量子涨落的严格理论。对于具有有限范围耦合的显式完全正族，一阶矩方程在非零波数处经历超临界不稳定，并允许解析位点和键中心的相应条纹分支。这些分支在其反射固定周期单元空间中局部渐近稳定，并且投影相干态在半经典极限内的每个有界时间间隔上表现出广泛的布拉格阶。我们证明了微观协方差向非自治高斯李雅普诺夫流的 $O(N^{-1/2})$ 收敛性，将严格的部分转置不确定性违规转移到足够大的 $N$。在均匀高斯扇区中，单个无量纲比率控制图灵稳定性行列式和相反动量的对数负性，将波长选择直接与量子纠缠相关。差分传输将最强的相反动量相关性从红外转移到选定的图灵尺度。\n\n数值延拓和二维模拟显示了条纹、斑点和迷宫形态，其傅里叶模式和涨落谱集中在相同的选定波数处。", "authors": [{"name": "Kazuki Ikeda"}], "featured_authors": [{"name": "Kazuki Ikeda"}], "author_count": 1}, {"id": "2607.26394", "category": "math-ph", "title": "Towards First Quantisation Formalism for AKSZ Theories", "abstract": "\\noindent Given an AKSZ theory $\\mathbb{T}$ on a manifold $M$, with target a graded vector space $Y$, we formulate a 1-dimensional theory $\\mathbb{t}$ on graphs (the ``first quantisation picture for $\\mathbb{T}$''), whose partition functions reproduce the Feynman graphs of $\\mathbb{T}$. More precisely, the theory $\\mathbb{t}$ is itself a 1d AKSZ theory with the target built out of $M$, and involving a coupling to 1d supergravity. It yields a form on the space of metric graphs (with length $T$ of an edge and its de Rham differential $\\mathrm{d} T$ interpreted as the zero-modes of the graviton and gravitino, respectively); its integral yields the sum of Feynman graphs of $\\mathbb{T}$. We study the theory $\\mathbb{t}$ in the BV-BFV formalism; a gauge-fixing of $\\mathbb{T}$ corresponds to a gauge-fixing of $\\mathbb{t}$. At the classical level, $\\mathbb{t}$ assigns to vertices certain Lagrangian submanifolds $L_k$ in Cartesian powers $\\Phi^{\\times k}$ of the phase space $\\Phi$ of $\\mathbb{t}$. These submanifolds can be thought of as defining a cyclic $\\mathrm{L}_\\infty$-algebra in Weinstein's symplectic category (``dequantising'' the cohomological vector field on the target %target AKSZ dg structure of $\\mathbb{T}$). In the path integral construction of $\\mathbb{t}$, Lagrangians $L_k$ determine sewing conditions for fields on the incident edges at a $k$-valent vertex. We give examples of this paradigm, such as when $\\mathbb{t}$ on edges is the Witten-Morse supersymmetric quantum mechanics (which corresponds to a particular type of gauge-fixing for $\\mathbb{T}$ and $\\mathbb{t}$). In the example where $\\mathbb{T}$ is the non-abelian Chern--Simons theory with structure Lie algebra $\\mathfrak{su}(2)$, we describe the vertex Lagrangian $L_{\\mathrm{W}}$ (the ``Wigner Lagrangian'' ).", "url": "https://arxiv.org/abs/2607.26394", "type": "理论", "summary": "\\noindent 给定流形$M$上的AKSZ理论$\\mathbb{T}$，目标为分级向量空间$Y$，我们在图上制定一维理论$\\mathbb{t}$（“$\\mathbb{T}$的第一个量化图片”），其分区函数再现了$\\mathbb{T}$的费曼图。更准确地说，理论 $\\mathbb{t}$ 本身就是一个 1d AKSZ 理论，其目标是由 $M$ 构建的，并且涉及与 1d 超重力的耦合。它在度量图空间上产生一种形式（边的长度 $T$ 及其德拉姆微分 $\\mathrm{d} T$ 分别解释为引力子和引力子的零模式）；它的积分产生$\\mathbb{T}$的费曼图之和。我们研究BV-BFV形式主义中的理论$\\mathbb{t}$； $\\mathbb{T}$ 的规范固定对应于 $\\mathbb{t}$ 的规范固定。在经典层面，$\\mathbb{t}$ 将 $\\mathbb{t}$ 的相空间 $\\Phi$ 的笛卡尔幂 $\\Phi^{\\times k}$ 中的某些拉格朗日子流形 $L_k$ 分配给顶点。\n\n这些子流形可以被认为是定义 Weinstein 辛范畴中的循环 $\\mathrm{L}_\\infty$-代数（“去量化”$\\mathbb{T}$ 的目标 %target AKSZ dg 结构上的上同调向量场）。在 $\\mathbb{t}$ 的路径积分构造中，拉格朗日 $L_k$ 确定 $k$ 价顶点处的入射边上的场的缝合条件。我们给出了这种范式的例子，例如当边缘上的 $\\mathbb{t}$ 是 Witten-Morse 超对称量子力学时（对应于 $\\mathbb{T}$ 和 $\\mathbb{t}$ 的特定类型的规范固定）。在 $\\mathbb{T}$ 是具有结构李代数 $\\mathfrak{su}(2)$ 的非交换陈-西蒙斯理论的示例中，我们描述了顶点拉格朗日 $L_{\\mathrm{W}}$ （“维格纳拉格朗日”）。", "authors": [{"name": "Leon Menger"}, {"name": "Pavel Mnev"}], "featured_authors": [{"name": "Leon Menger"}, {"name": "Pavel Mnev"}], "author_count": 2}, {"id": "2607.26454", "category": "math-ph", "title": "From Quantum-Plane Hamiltonians to Jackson Dynamics: Dilation Representations, Normal Symbols, and Euclidean Limits", "abstract": "Formal $q$-Hamiltonian mechanics on the quantum plane is expressed through noncommuting coordinates and covariant $q$-derivatives, whereas its computable realization is usually written as an ordinary differential system involving Jackson finite differences. In this paper, we formulate the passage between these two levels through a representation--symbol correspondence. The quantum-plane coordinate algebra and its covariant differential calculus are realized by multiplication, dilation, and Jackson operators on a smooth commutative function space. Normal ordering then identifies the coordinate algebra with a polynomial symbol space endowed with an explicit associative star product. Within this framework, the formal $q$-derivatives intertwine exactly with the corresponding Jackson operators, and the formal $q$-Hamiltonian action descends to an exact star-Jackson action on symbols. For the coordinate observables, the star-product corrections vanish, so the computable Jackson coordinate equations are recovered exactly. For general observables, replacing the star product by ordinary multiplication produces a controlled first-order error. We also show that multiplication by the Hamiltonian symbol is the leading commutative approximation of the represented operator Hamiltonian. Finally, we study the resulting Euclidean Jackson vector field and establish first-order convergence of the operator, symbol, vector-field, and finite-time trajectory formulations to classical Hamiltonian dynamics as $q\\to1$. These results provide a rigorous bridge between formal quantum-plane Hamiltonian mechanics and the dynamics used in $q$-deformed Hamiltonian Monte Carlo.", "url": "https://arxiv.org/abs/2607.26454", "type": "理论", "summary": "量子平面上的形式$q$-哈密尔顿力学通过非对易坐标和协变$q$-导数来表达，而其可计算实现通常被写成涉及杰克逊有限差分的普通微分系统。在本文中，我们通过一种表示——符号对应来制定这两个层次之间的通道。量子平面坐标代数及其协变微分运算是通过光滑交换函数空间上的乘法、膨胀和Jackson算子实现的。然后，正常排序用赋予显式关联星积的多项式符号空间来识别坐标代数。在这个框架内，形式的$q$-导数与相应的杰克逊算子完全交织在一起，并且形式的$q$-哈密尔顿动作下降到符号上的精确的星形杰克逊动作。对于坐标可观测量，星积修正消失，因此可以准确地恢复可计算的 Jackson 坐标方程。对于一般可观测量，用普通乘法替换星积会产生受控的一阶误差。\n\n我们还表明，乘以哈密顿量符号是所表示的算子哈密顿量的主要交换近似。最后，我们研究所得的欧几里得杰克逊向量场，并建立算子、符号、向量场和有限时间轨迹公式到经典哈密顿动力学 $q\\to1$ 的一阶收敛。这些结果在形式量子平面哈密顿力学和 $q$ 变形哈密顿蒙特卡罗中使用的动力学之间提供了严格的桥梁。", "authors": [{"name": "Xiaomei Yang"}, {"name": "Zhiliang Deng"}], "featured_authors": [{"name": "Xiaomei Yang"}, {"name": "Zhiliang Deng"}], "author_count": 2}, {"id": "2607.26675", "category": "math-ph", "title": "Congruence of Dirac operators with applications to generalized MIT bag models", "abstract": "We highlight a simple congruence transform that shifts coupling parameters for Dirac operators with shell interactions. As one of the consequences, this leads to new observations concerning the self-adjointness and the infinite mass interpretation of generalized MIT bag models.", "url": "https://arxiv.org/abs/2607.26675", "type": "理论", "summary": "我们重点介绍一个简单的同余变换，它可以通过壳相互作用改变狄拉克算子的耦合参数。作为后果之一，这导致了关于广义麻省理工学院袋模型的自伴性和无限质量解释的新观察。", "authors": [{"name": "Joaquim Duran"}, {"name": "Konstantin Pankrashkin"}], "featured_authors": [{"name": "Joaquim Duran"}, {"name": "Konstantin Pankrashkin"}], "author_count": 2}, {"id": "2607.26975", "category": "math-ph", "title": "Lee-Yang Zeros And Particle Fluctuations", "abstract": "We consider classical particles in the continuum in the grand canonical ensemble, with a stable, tempered and lower-regular pair potential and boundary conditions of uniformly bounded density. We prove that if the Lee--Yang zeros of the grand canonical partition function in the complex fugacity plane $z = e^{\\beta\\mu}$ remain bounded away from a real point $z_0 > 0$ for all sufficiently large volumes, then along cubes the thermodynamic limit and differentiation commute at $z_0$: every derivative of the finite-volume pressure in the chemical potential converges, uniformly in a neighborhood of $z_0$, to the corresponding derivative of the limiting pressure. The limiting values of all derivatives are independent of the boundary condition; in particular, the density and the particle-number variance per unit volume converge to $\\beta^{-1}\\partial_\\mu p$ and $\\beta^{-2}\\partial^{2}_{\\mu} p$, respectively. The result extends to the unbounded boundary conditions of Procacci and Yuhjtman for super-stable potentials in addition to Ruelle's tempered boundary conditions.", "url": "https://arxiv.org/abs/2607.26975", "type": "理论", "summary": "我们考虑大正则系综中连续统中的经典粒子，具有稳定、调节和较低正则对势以及均匀有界密度的边界条件。我们证明，如果对于所有足够大的体积，复逸度平面 $z = e^{\\beta\\mu}$ 中大正则配分函数的 Lee-Yang 零点仍然远离实点 $z_0 > 0$，则热力学极限和微分沿着立方体在 $z_0$ 处交换：化学势中有限体积压力的每个导数均匀地在 $z_0$ 邻域内收敛到极限压力的相应导数。所有导数的极限值与边界条件无关；特别是，每单位体积的密度和粒子数方差分别收敛于 $\\beta^{-1}\\partial_\\mu p$ 和 $\\beta^{-2}\\partial^{2}_{\\mu} p$。除了 Ruelle 的缓和边界条件之外，结果还扩展到 Procacci 和 Yuhjtman 的超稳定势的无界边界条件。", "authors": [{"name": "Mohamed El Hedi Bahri"}, {"name": "Ian Jauslin"}, {"name": "Joel L. Lebowitz"}], "featured_authors": [{"name": "Mohamed El Hedi Bahri"}, {"name": "Ian Jauslin"}, {"name": "Joel L. Lebowitz"}], "author_count": 3}, {"id": "2607.26080", "category": "quant-ph", "title": "Quantum mechanics on the line with two origins", "abstract": "We study scalar and spinorial quantum dynamics on the standard line with two origins, \\[ \\Ltwo=(\\R_1\\sqcup\\R_2)/\\!\\sim, \\qquad (x,1)\\sim(x,2)\\quad\\text{for }x\\neq0, \\] equipped with its identity-glued smooth structure and flat metric. We first show that the ordinary scalar theory is insensitive to the doubled origin: every continuous map from \\(\\Ltwo\\) to a Hausdorff space factors through the quotient \\(q:\\Ltwo\\to\\R\\), while, for the natural measure, \\[ C^\\infty(\\Ltwo)\\cong C^\\infty(\\R), \\qquad L^2(\\Ltwo)\\cong L^2(\\R). \\] Accordingly, the natural scalar free Hamiltonian is unitarily equivalent to the free Laplacian on \\(\\R\\). The doubled origin remains visible, however, in the spinor line associated with the nontrivial spin structure. The oriented flat structure on \\(\\Ltwo\\) admits two spin structures, distinguished by the relative transition sign on the two connected components of the chart overlap. For the nontrivial structure, these signs are opposite. This forces every continuous global spinor section to vanish at both origins and every smooth section to vanish there to infinite order. The associated first-order operator \\[ -i\\,\\frac{\\mathrm d}{\\mathrm dx} \\] on compactly supported smooth twisted sections is symmetric but not essentially self-adjoint: its deficiency indices are \\((1,1)\\), and a self-adjoint first-order evolution requires an additional transmission condition at the origin. The natural positive quadratic form associated with the flat twisted structure instead yields the direct sum of two Dirichlet half-line Laplacians and hence perfect reflection. Thus the ordinary scalar theory does not detect the doubled origin, whereas the nontrivially glued spinor line does, although the spin structure alone does not determine a unique unitary transmission law.", "url": "https://arxiv.org/abs/2607.26080", "type": "理论", "summary": "我们研究具有两个原点的标准线上的标量和旋量量子动力学， \\[ \\Ltwo=(\\R_1\\sqcup\\R_2)/\\!\\sim, \\qquad (x,1)\\sim(x,2)\\quad\\text{for }x\\neq0, \\] 配备其恒等粘合平滑结构和平面度量。我们首先证明普通标量理论对双重原点不敏感：从 \\(\\Ltwo\\) 到 Hausdorff 空间因子的每个连续映射都通过商 \\(q:\\Ltwo\\to\\R\\)，而对于自然测度，\\[ C^\\infty(\\Ltwo)\\cong C^\\infty(\\R)、\\qquad L^2(\\Ltwo)\\cong L^2(\\R)。 \\] 因此，自然标量自由哈密顿量酉等价于 \\(\\R\\) 上的自由拉普拉斯算子。然而，在与非平凡自旋结构相关的旋量线中，双重原点仍然可见。 \\(\\Ltwo\\) 上的定向平面结构允许两个自旋结构，通过图表重叠的两个连接组件上的相对过渡符号来区分。对于非平凡的结构，这些符号是相反的。这迫使每个连续的全局旋量部分在两个原点处消失，并且每个平滑部分在无限阶处消失。\n\n紧支撑光滑扭曲截面上的相关一阶算子 \\[ -i\\,\\frac{\\mathrm d}{\\mathrm dx} \\] 是对称的，但本质上不是自伴的：其缺陷指数为 \\((1,1)\\)，并且自伴一阶演化需要在原点处附加传输条件。与扁平扭曲结构相关的自然正二次形式反而产生两个狄利克雷半线拉普拉斯的直接和，从而产生完美反射。因此，普通标量理论无法检测到双重原点，而非平凡的粘连旋量线却可以检测到，尽管自旋结构本身并不能确定唯一的酉传输定律。", "authors": [{"name": "Abhiram Sripat"}], "featured_authors": [{"name": "Abhiram Sripat"}], "author_count": 1}, {"id": "2607.26122", "category": "quant-ph", "title": "Qubit-qubit-qutrit quantum correlations in $H \\to f \\bar f V$", "abstract": "We perform an extensive analysis of the quantum correlations carried by the qubit-qubit-qutrit pure state arising in the decay of a massive scalar into a fermion-antifermion pair and a massive gauge boson, $H \\to f \\bar f V$, specialising to the Higgs boson decay $h \\to \\tau^- \\tau^+ Z$. Working with the exact tree-level spin state and its systematic expansion around the massless-fermion limit, we obtain analytic control over the entire phase space: the bipartite entanglement measures, the genuine $2 \\otimes 2 \\otimes 3$ entanglement structure (the Miyake classification), as well as the Bell-inequality violations and the non-stabiliserness (magic) are all mapped and reproduced by compact formulas. The bipartite measures exhibit a monogamy-like trade-off between the fermion pair and the fermion-boson pairs. The state is genuinely $2 \\otimes 2 \\otimes 3$ entangled over almost the entire phase space, most strongly in the collinear regions. We derive, for the first time, semi-analytical expressions for the tight $4 \\times 4 \\times 2$ Bell inequalities of the $2 \\otimes 2 \\otimes 3$ system, generalising the optimisation previously available only for three qubits, and find that the local-hidden-variable bound is violated over the entire phase space, reaching within a few per cent of the quantum bound at the upper endpoint of the di-tau mass spectrum. We further extend the stabiliser Rényi entropy and the non-local magic to systems with unequal local dimensions, and show that the near-endpoint state carries almost exactly one bit of non-local magic, which peaks at $\\log_2 \\frac{27}{7} \\simeq 1.95$ in the collinear regions. The differential decay rate concentrates precisely in the most nonclassical region of the phase space.", "url": "https://arxiv.org/abs/2607.26122", "type": "理论", "summary": "我们对量子位-量子位-qutrit 纯态所携带的量子相关性进行了广泛的分析，该纯态在大质量标量衰变成费米子-反费米子对和大质量规范玻色子 $H \\to f \\bar f V$ 时产生，专门研究希格斯玻色子衰变 $h \\to \\tau^- \\tau^+ Z$。利用精确的树级自旋态及其围绕无质量费米子极限的系统扩展，我们获得了对整个相空间的分析控制：二分纠缠测量、真正的 $2 \\otimes 2 \\otimes 3$ 纠缠结构（Miyake 分类），以及贝尔不等式违规和非稳定性（魔法）都通过紧凑公式映射和再现。二分测度在费米子对和费米子-玻色子对之间表现出类似一夫一妻制的权衡。该状态在几乎整个相空间上确实是 $2 \\otimes 2 \\otime 3$ 纠缠，在共线区域中最为强烈。\n\n我们首次推导了 $2 \\otimes 2 \\otimes 3$ 系统的严格 $4 \\times 4 \\times 2$ Bell 不等式的半解析表达式，概括了先前仅适用于三个量子位的优化，并发现局部隐变量界限在整个相空间上被违反，达到了 di-tau 质谱上端点处量子界限的百分之几以内。我们进一步将稳定器 Rényi 熵和非局部魔力扩展到局部维度不等的系统，并表明近端点状态几乎恰好携带一位非局部魔力，其峰值位于共线区域中的 $\\log_2 \\frac{27}{7} \\simeq 1.95$。差分衰减率精确地集中在相空间的最非经典区域。", "authors": [{"name": "Michał Banacki"}, {"name": "Misaki Ohta"}, {"name": "Abhyoudai S. Shaleena"}, {"name": "Paweł Caban"}, {"name": "Michał Eckstein"}, {"name": "Kazuki Sakurai"}, {"name": "Michael Spannowsky"}, {"name": "Paweł Horodecki"}], "featured_authors": [{"name": "Michał Banacki"}, {"name": "Misaki Ohta"}, {"name": "Abhyoudai S. Shaleena"}, {"name": "Kazuki Sakurai"}, {"name": "Michael Spannowsky"}, {"name": "Paweł Horodecki"}], "author_count": 8}, {"id": "2607.26123", "category": "quant-ph", "title": "Quantum Information Decoupling Beyond Finite Dimensions", "abstract": "Quantum information decoupling is a pillar of quantum information theory, underlying quantum communication, error correction, and information recovery. However, its existing formulations rely on random unitary operations tied to finite-dimensional assumptions on quantum systems. Here we establish a decoupling framework for arbitrary separable, possibly infinite-dimensional systems. For finite-dimensional inputs and arbitrary separable reference/output systems, we derive error bounds on one-shot decoupling for completely positive maps in terms of sandwiched Rényi conditional entropies. For partial-trace decoupling with finite-dimensional references, the error exponent is optimal up to the known critical rate. To handle infinite-dimensional inputs, we assume finite entropy of the manipulated system. We construct finite-rank projections on independent and identically distributed (IID) states to restrict randomization to a projected finite-dimensional subspace, while ensuring high success probability by including auxiliary components in the discarded subsystem at asymptotically negligible cost. This leads to an infinite-dimensional IID partial-trace decoupling protocol achieving optimal asymptotic dimension rates. As an application, we construct an infinite-dimensional quantum-state-merging protocol, a mother protocol of quantum information theory. Under finite entropy of Alice's marginal, it achieves the same quantum-communication and total-cost rates as in finite dimensions, governed by mutual information and conditional entropy. These results show that the operational interpretation of entropic quantities through these achievable rates constitutes a universal principle beyond finite dimensions. More broadly, our framework provides foundational tools for exploring quantum information regardless of whether we model the physical world using finite- or infinite-dimensional spaces.", "url": "https://arxiv.org/abs/2607.26123", "type": "理论", "summary": "量子信息解耦是量子信息理论的支柱，是量子通信、纠错和信息恢复的基础。然而，其现有的公式依赖于与量子系统的有限维假设相关的随机酉运算。在这里，我们为任意可分离的、可能无限维的系统建立了一个解耦框架。对于有限维输入和任意可分离参考/输出系统，我们根据夹层 Rényi 条件熵导出完全正映射的一次性解耦的误差界限。对于有限维参考的部分迹线解耦，误差指数在已知临界率下是最佳的。为了处理无限维输入，我们假设被操纵系统的熵有限。我们在独立同分布（IID）状态上构造有限秩投影，以将随机化限制在投影的有限维子空间中，同时通过以渐近可忽略不计的成本将辅助组件包含在废弃子系统中来确保高成功概率。\n\n这导致无限维 IID 部分迹线解耦协议实现最佳渐近维数率。作为一个应用，我们构建了一个无限维量子态合并协议，这是量子信息论的母协议。在爱丽丝边际的有限熵下，它实现了与有限维度相同的量子通信和总成本率，并受互信息和条件熵的控制。这些结果表明，通过这些可实现的速率对熵量的操作解释构成了超越有限维度的普遍原理。更广泛地说，我们的框架提供了探索量子信息的基础工具，无论我们是使用有限维空间还是无限维空间来建模物理世界。", "authors": [{"name": "Hayata Yamasaki"}], "featured_authors": [{"name": "Hayata Yamasaki"}], "author_count": 1}, {"id": "2607.26139", "category": "quant-ph", "title": "Linear Algebra of Generalized Contextuality in All Prepare-Transform-Measure Scenarios", "abstract": "Generalized contextuality is a canonical distinguishing property of nonclassical generalized probabilistic theories, in particular quantum mechanics. Methods for certification and characterization of generalized contextuality of a given generalized probabilistic theory are well developed for prepare-measure and single-stage prepare-transform-measure scenarios. In a recent work [ arXiv:2512.10000 ], a bottom-up, statistics-first linear-algebraic framework for contextuality in prepare-measure scenarios was introduced. We extend this approach to operational scenarios with sequential transformations with an arbitrary number of stages. We give a full decision procedure for contextuality of such scenarios within operational theories and analyze its computational complexity. In particular, our decision procedure has a complexity linearly exponential in the minimum generalized probabilistic theory (GPT) dimension, and polynomial in the number of procedures. We demonstrate our framework and approach through multiple examples, including Spekkens' toy theory and the 8-state single-qubit stabilizer theory. In particular, we construct an operational theory in which contextuality manifests itself only in the sequential structure of the transformations. Our findings thus shed new light on the significant role of compositional structures in the phenomenon of generalized contextuality.", "url": "https://arxiv.org/abs/2607.26139", "type": "理论", "summary": "广义上下文性是非经典广义概率理论（特别是量子力学）的典型区别属性。用于验证和表征给定广义概率理论的广义背景的方法已经针对准备-测量和单阶段准备-转换-测量场景得到了很好的发展。在最近的一项工作 [ arXiv:2512.10000 ] 中，引入了一种自下而上、统计优先的线性代数框架，用于准备测量场景中的上下文关系。我们将这种方法扩展到具有任意数量阶段的顺序转换的操作场景。我们针对操作理论中此类场景的背景给出了完整的决策程序，并分析了其计算复杂性。特别是，我们的决策过程在最小广义概率论（GPT）维度上具有线性指数复杂度，在过程数量上具有多项式复杂度。我们通过多个例子展示了我们的框架和方法，包括 Spekkens 的玩具理论和 8 态单量子位稳定器理论。\n\n特别是，我们构建了一种操作理论，其中情境性仅在转换的顺序结构中表现出来。因此，我们的研究结果为构图结构在广义语境现象中的重要作用提供了新的线索。", "authors": [{"name": "Theodoros Yianni"}, {"name": "Nyan Raess"}, {"name": "Farid Shahandeh"}], "featured_authors": [{"name": "Theodoros Yianni"}, {"name": "Nyan Raess"}, {"name": "Farid Shahandeh"}], "author_count": 3}, {"id": "2607.26145", "category": "quant-ph", "title": "Contextual advantage implies limited distinguishability in any physical theory", "abstract": "A central question in quantum information is whether a given set of states can provide an advantage in some information-processing task. We establish a universal connection between two such questions: how well a set of states can be discriminated, and whether it can power tasks whose advantage stems from generalized contextuality. Working in the framework of generalized probabilistic theories (GPTs), which includes quantum and classical systems as special cases, we show that any set of states able to provide a nonclassical advantage in a contextuality-powered task must obey nontrivial upper bounds on the success probability of every state discrimination task using the full set. Contextual advantage therefore implies limited distinguishability, exposing a trade-off between two basic operational resources. Importantly, this is more than a statement about the idealized limit: perfect distinguishability is not needed to preclude contextuality. Our thresholds lie strictly below unity, so any set whose discrimination performance exceeds them while still imperfectly distinguishable is already guaranteed to admit a noncontextual explanation. The bounds follow from a simple geometric property, linear dependence of the state set, take a closed analytical form, and depend only on the prior of the task and the convex geometry of the states. As an illustration, we apply them to generalized parity-oblivious multiplexing, where sufficiently high success in the task implies that at least one sub-ensemble of the codebook cannot power any contextual advantage.", "url": "https://arxiv.org/abs/2607.26145", "type": "理论", "summary": "量子信息的一个核心问题是一组给定的状态是否可以在某些信息处理任务中提供优势。我们在两个这样的问题之间建立了普遍的联系：一组国家的区分程度如何，以及它是否能够推动其优势源于广义背景的任务。在广义概率论（GPT）框架（包括量子和经典系统作为特例）的框架下，我们证明，任何能够在上下文驱动的任务中提供非经典优势的状态集都必须遵守使用全套状态区分任务的成功概率的非平凡上限。因此，上下文优势意味着有限的可区分性，暴露了两种基本运营资源之间的权衡。重要的是，这不仅仅是关于理想化限制的陈述：不需要完美的可区分性来排除上下文。我们的阈值严格低于统一，因此任何区分性能超过阈值但仍不完全可区分的集合都已经保证接受非上下文解释。\n\n边界遵循简单的几何属性，即状态集的线性相关性，采用封闭的分析形式，并且仅取决于任务的先验和状态的凸几何形状。作为说明，我们将它们应用于广义奇偶校验不经意的复用，其中任务中足够高的成功意味着码本的至少一个子集合不能提供任何上下文优势。", "authors": [{"name": "Roberto D. Baldijão"}, {"name": "Felipe A. Barretto"}, {"name": "Jarosław K. Korbicz"}], "featured_authors": [{"name": "Roberto D. Baldijão"}, {"name": "Felipe A. Barretto"}, {"name": "Jarosław K. Korbicz"}], "author_count": 3}, {"id": "2607.26146", "category": "quant-ph", "title": "Lindbladian quantization of mechanical systems with nonholonomic constraints", "abstract": "Nonholonomic mechanics describes systems subject to non-integrable velocity constraints, such as rolling bodies and skating motion. These systems generally lack a canonical Hamiltonian formulation, obstructing standard quantization methods. Here we quantize nonholonomic systems as Markovian open quantum systems, with the nonholonomic constraint appearing in a large-dissipation limit. We find explicit Lindblad superoperators that reproduce the classical dynamics of the Chaplygin sleigh and the Suslov problem in the semiclassical limit. The master equation is numerically simulated, and the covariance is shown to satisfy a relation predicted by the theory of metastability in open quantum systems.", "url": "https://arxiv.org/abs/2607.26146", "type": "理论+数值", "summary": "非完整力学描述了受不可积速度约束的系统，例如滚动体和滑行运动。这些系统通常缺乏规范的哈密顿公式，阻碍了标准的量化方法。在这里，我们将非完整系统量化为马尔可夫开放量子系统，非完整约束出现在大耗散极限中。我们发现了明确的 Lindblad 超级算子，可以在半经典极限下再现 Chaplygin 雪橇的经典动力学和 Suslov 问题。对主方程进行了数值模拟，并且证明协方差满足开放量子系统中亚稳态理论所预测的关系。", "authors": [{"name": "Daniel Schubring"}, {"name": "Sriram Ganeshan"}], "featured_authors": [{"name": "Daniel Schubring"}, {"name": "Sriram Ganeshan"}], "author_count": 2}, {"id": "2607.26214", "category": "quant-ph", "title": "Minimal Counterexamples of the MacWilliams Extension Theorem for Stabilizer Codes", "abstract": "The MacWilliams extension theorem fails for module alphabets with non-cyclic socle, and the label alphabet of qudit stabilizer codes, $\\F_{q^2}$ over $\\F_q$, is such an alphabet. Quantum error correction, however, only ever sees \\emph{self-orthogonal} additive codes, and whether that rigidity rescues the theorem---equivalently, whether every weight-preserving isomorphism of stabilizer groups is implemented by local Cliffords and a qudit permutation---was asked by Gluesing-Luerssen and Pllaha and answered negatively by Pllaha for particular qubit codes. We develop the negative answer systematically and at the smallest possible scales. For every prime power $q$ we construct a pair of $[[q+1,q-1]]_q$ stabilizer codes and a weight-preserving isomorphism between them extending to no monomial transformation; the codespaces are inequivalent even under arbitrary local unitaries combined with permutations, though they share Shor--Laflamme enumerators. Self-orthogonality is automatic here, by two elementary lemmas which also show that Dyshko's threshold-length counterexamples were already self-orthogonal, unremarked. For qubits we prove by exhaustive search that length $3$ is minimal and the counterexample essentially unique. Dropping the ``idle qudit'' invariant that detects these, we find the minimal full-support lengths: $4$ for a non-extendable isometry, $5$ for a weight-isometric pair that is not monomially equivalent, realized by explicit $[[5,2]]$ codes; at length $6$ all nontrivial stabilizer elements can have weight $\\ge 4$. Whether these codespaces are locally unitarily equivalent is posed as an open problem, connecting the extension problem to the LU--LC circle of questions.", "url": "https://arxiv.org/abs/2607.26214", "type": "理论", "summary": "对于具有非循环基点的模块字母表，MacWilliams 扩展定理失败，而 qudit 稳定器代码的标签字母表 $\\F_{q^2}$ over $\\F_q$ 就是这样的字母表。然而，量子纠错只能看到 \\emph{自正交} 加性代码，并且这种刚性是否可以拯救定理——同样地，稳定基团的每个保重同构是否都是由局部 Cliffords 和量子排列实现的——被 Gluesing-Luerssen 和 Pllaha 询问，并由 Pllaha 对于特定的量子位代码给出否定的回答。我们以尽可能小的规模系统地制定否定答案。对于每个质数 $q$，我们构造一对 $[[q+1,q-1]]_q$ 稳定器代码以及它们之间的保重同构，扩展到无单项式变换；尽管它们共享 Shor--Laflamme 枚举器，但即使在任意局部酉与排列相结合的情况下，代码空间也是不等价的。自正交性在这里是自动的，通过两个基本引理，这也表明戴什科的阈值长度反例已经是自正交的，没有被注意到。\n\n对于量子位，我们通过穷举搜索证明长度 $3$ 是最小的，并且反例本质上是唯一的。放弃检测这些的“idle qudit”不变量，我们找到最小的完全支持长度：$4$ 对于不可扩展的等距，$5$ 对于不单项等价的重量等距对，通过显式 $[[5,2]]$ 代码实现；长度为 $6$ 时，所有重要稳定器元素的权重为 $\\ge 4$。这些代码空间是否局部酉等价被作为一个开放问题提出，将扩展问题与 LU-LC 问题圈联系起来。", "authors": [{"name": "Ali Assem Mahmoud"}], "featured_authors": [{"name": "Ali Assem Mahmoud"}], "author_count": 1}, {"id": "2607.26225", "category": "quant-ph", "title": "Supermartingales in Quantum Resources Theories: Where do quantum resources go when you're watching?", "abstract": "We establish a connection between quantum resource theory and probability theory, under repeated application of free operations. We show that strong monotonicity of a resource measure implies that the resource is a supermartingale. We then use the optional stopping and martingale convergence theorems to derive bounds on the efficiency of post-selection, and other free adaptive strategies. We also describe the asymptotic dynamics of the conditional state, where resource fluctuations are necessarily absent, showing one of two distinct phenomena occurs: resource vanishing or resource freezing.", "url": "https://arxiv.org/abs/2607.26225", "type": "理论", "summary": "我们在自由运算的重复应用下建立了量子资源理论和概率论之间的联系。我们证明，资源度量的强单调性意味着该资源是超鞅。然后，我们使用可选的停止和鞅收敛定理来推导后选择和其他自由自适应策略的效率界限。我们还描述了条件状态的渐近动力学，其中资源波动必然不存在，这表明发生了两种不同现象之一：资源消失或资源冻结。", "authors": [{"name": "Katarzyna Macieszczak"}, {"name": "Robert L. Jack"}], "featured_authors": [{"name": "Katarzyna Macieszczak"}, {"name": "Robert L. Jack"}], "author_count": 2}, {"id": "2607.26351", "category": "quant-ph", "title": "On $R$-parastatistics I: Foundation", "abstract": "Parastatistics is an exotic type of exchange statistics beyond fermions and bosons. Paraparticles transform in higher dimensional representations of the exchange symmetry group, analogous to non-Abelian anyons, yet consistently defined in any dimension. Although paraparticles have long been proposed, they were widely believed to be physically equivalent to fermions or bosons. Nevertheless, a recent paper proposed a different theory, called $R$-parastatistics, and demonstrated that nontrivial $R$-paraparticles can emerge as quasiparticles in condensed matter systems, and are observably distinct from both fermions and bosons. This paper develops the theoretical foundation and several extensions of $R$-parastatistics, with particular emphasis on its observable consequences. Central to this paper is a general theory of local observables extending the basic family introduced before. First, we define local observables that distinguish particle types. Second, we formulate local observables at special point defects that probe the internal indices of $R$-paraparticles, crucial for observing $R$-parastatistics and for the proposed applications in quantum information. Third, we introduce local observables that create or annihilate particle-antiparticle pairs, important for building a relativistic quantum field theory for $R$-paraparticles. We further introduce generalized hidden symmetries that act on internal indices of $R$-paraparticles while preserving the local observable algebra, providing a basis for proving local indistinguishability and for connecting to a categorical description of $R$-paraparticles. This work sets a solid theoretical foundation for understanding the fundamental physical properties of $R$-paraparticles and pave the way for finding them in nature.", "url": "https://arxiv.org/abs/2607.26351", "type": "理论", "summary": "副统计是费米子和玻色子之外的一种奇异的交换统计类型。副粒子变换为交​​换对称群的高维表示，类似于非阿贝尔任意子，但在任何维度上都有一致的定义。尽管人们很早就提出了副粒子，但人们普遍认为它们在物理上等同于费米子或玻色子。尽管如此，最近的一篇论文提出了一种不同的理论，称为$R$-副统计，并证明了非平凡的$R$-副粒子可以在凝聚态物质系统中作为准粒子出现，并且明显不同于费米子和玻色子。本文发展了 $R$ 副统计的理论基础和几种扩展，特别强调其可观察的后果。本文的核心是扩展之前介绍的基本族的局部可观测量的一般理论。首先，我们定义区分粒子类型的局部可观测量。其次，我们在特殊点缺陷处制定局部可观测量，以探测 $R$ 副粒子的内部指数，这对于观察 $R$ 副统计和量子信息中的拟议应用至关重要。\n\n第三，我们引入了产生或湮灭粒子-反粒子对的局部可观测量，这对于建立 $R$-副粒子的相对论量子场论非常重要。我们进一步引入了作用于$R$-副粒子的内部索引的广义隐藏对称性，同时保留了局部可观测代数，为证明局部不可区分性和连接到$R$-副粒子的分类描述提供了基础。这项工作为理解$R$-副粒子的基本物理性质奠定了坚实的理论基础，并为在自然界中寻找它们铺平了道路。", "authors": [{"name": "Zhiyuan Wang"}, {"name": "Kaden R. A. Hazzard"}], "featured_authors": [{"name": "Zhiyuan Wang"}, {"name": "Kaden R. A. Hazzard"}], "author_count": 2}, {"id": "2607.26431", "category": "quant-ph", "title": "The Klein-Gordon-Fock theory as a one-particle relativistic quantum mechanics", "abstract": "The Klein-Gordon-Fock (KGF) theory with scalar and vector potentials is presented as a one particle relativistic quantum mechanics (QM). First, the KGF equation is written in a Hamiltonian form, in spinor space; unlike the Feshbach-Villars approach, the Hamiltonian here is strictly Hermitian. Then this equation is rewritten for a one-component wave function. Expressions for the Hamiltonian and other observables' operators acting in the space of one-component wave functions are presented. The nonrelativistic and ultrarelativistic limits of these expressions are considered. A general solution to the KGF equation describing a free particle is presented.", "url": "https://arxiv.org/abs/2607.26431", "type": "理论", "summary": "具有标量势和矢量势的克莱因-戈登-福克 (KGF) 理论被呈现为单粒子相对论量子力学 (QM)。首先，KGF 方程在旋量空间中以哈密顿量形式编写；与 Feshbach-Villars 方法不同，这里的哈密顿量是严格的埃尔米特量。然后将该方程重写为单分量波函数。给出了作用于单分量波函数空间的哈密顿算子和其他可观测量算子的表达式。考虑了这些表达式的非相对论和超相对论极限。给出了描述自由粒子的 KGF 方程的通解。", "authors": [{"name": "N. L. Chuprikov"}], "featured_authors": [{"name": "N. L. Chuprikov"}], "author_count": 1}, {"id": "2607.26438", "category": "quant-ph", "title": "Quantum Optical Reinforcement Learning via Spectrum-Resolved Hong-Ou-Mandel Interference", "abstract": "Hong-Ou-Mandel (HOM) interference-based optical neural networks can offer complexity advantages on benchmark learning tasks, but conventional readout compresses the coincidence spectrum into a single scalar, limiting its use in complex settings such as continuous-action reinforcement learning. Here we introduce a spectrum-resolved HOM (SR-HOM) architecture that promotes the photons' spectral degrees of freedom to a trainable computational resource and use it to construct a compact optical actor-critic agent. Diagonal spectral responses generate continuous actions, while higher-order spectral correlations provide nonlinear state-action features for value estimation. Across five continuous-control benchmarks, SR-HOM outperforms parameter-matched multilayer-perceptron baselines, including a \\(4.4\\times\\) improvement in sample efficiency and a \\(74.0\\%\\) increase in best 100-episode moving-average return for LunarLanderContinuous-v3. Applied to online calibration of drifted tunable-coupler CZ and iSWAP gates for transmon qubits, simulations show it restores fidelities to \\(0.9917\\) and \\(0.9952\\) respectively, exceeding \\(99.8\\%\\) of their drift-free calibrated values.", "url": "https://arxiv.org/abs/2607.26438", "type": "数值", "summary": "基于 Hong-Ou-Mandel (HOM) 干扰的光学神经网络可以在基准学习任务上提供复杂性优势，但传统的读出将重合谱压缩为单个标量，限制了其在连续动作强化学习等复杂环境中的使用。在这里，我们介绍了一种光谱解析 HOM (SR-HOM) 架构，该架构将光子的光谱自由度提升为可训练的计算资源，并使用它来构建紧凑的光学行动评论代理。对角谱响应生成连续动作，而高阶谱相关性为值估计提供非线性状态动作特征。在五个连续控制基准中，SR-HOM 的性能优于参数匹配的多层感知器基线，包括样本效率的“4.4”倍改进以及 LunarLanderContinously-v3 的最佳 100 集移动平均回报的“74.0%”增加。应用于传输量子位的漂移可调耦合器 CZ 和 iSWAP 门的在线校准，模拟表明它分别将保真度恢复到 \\(0.9917\\) 和 \\(0.9952\\)，超过其无漂移校准值的 \\(99.8\\%\\)。", "authors": [{"name": "Shaojun Wu"}, {"name": "Jiahua Xu"}, {"name": "Shan Jin"}, {"name": "Zhen Yang"}, {"name": "Yifang Xu"}, {"name": "Chenglong You"}, {"name": "Guangwei Deng"}, {"name": "Luyan Sun"}, {"name": "Chang-Ling Zou"}, {"name": "Xiaoting Wang"}], "featured_authors": [{"name": "Shaojun Wu"}, {"name": "Jiahua Xu"}, {"name": "Shan Jin"}, {"name": "Luyan Sun"}, {"name": "Chang-Ling Zou"}, {"name": "Xiaoting Wang"}], "author_count": 10}, {"id": "2607.26445", "category": "quant-ph", "title": "Lattice Quantum Chromodynamics for Quantum Simulations", "abstract": "We develop a framework for quantum simulations of lattice SU($N_c$) gauge theory with quarks. Staggered and Wilson lattice fermions are considered in two and three spatial dimensions and a theta angle is included in three dimensions. The physical, gauge-invariant Hilbert space is formulated in a representation basis, where gauge and fermionic degrees of freedom are encoded by irreducible representations of SU($N_c$) that tensor at each lattice site to contain a singlet. We discuss algorithms for simulating time evolution on quantum computers and carry out noiseless simulations of lattice quantum chromodynamics ($N_c=3$) on small lattices with up to 32 qubits, showcasing theta angle effects, hadronic states, string dynamics, and a baryon chemical potential for the first time in three spatial dimensions.", "url": "https://arxiv.org/abs/2607.26445", "type": "理论+数值", "summary": "我们开发了一个用夸克对晶格 SU($N_c$) 规范理论进行量子模拟的框架。交错和威尔逊晶格费米子在两个和三个空间维度中被考虑，并且θ角被包括在三个维度中。物理、规范不变的希尔伯特空间是在表示基础上制定的，其中规范和费米子自由度由 SU($N_c$) 的不可约表示进行编码，该表示在每个晶格位点进行张量以包含单线态。我们讨论了在量子计算机上模拟时间演化的算法，并对最多 32 个量子位的小晶格进行晶格量子色动力学 ($N_c=3$) 的无噪声模拟，首次在三个空间维度展示了 theta 角效应、强子态、弦动力学和重子化学势。", "authors": [{"name": "Luis Hidalgo"}, {"name": "Patrick Draper"}], "featured_authors": [{"name": "Luis Hidalgo"}, {"name": "Patrick Draper"}], "author_count": 2}, {"id": "2607.26477", "category": "quant-ph", "title": "Finding diagonal logical gates in CSS codes and circuits", "abstract": "Finding efficient schemes for non-Clifford logic or magic state preparation is one of the central challenges on the way to fault-tolerant quantum computation. Many of the proposed schemes rely on diagonal non-Clifford logical gates acting on CSS codes in space or decorating CSS-type syndrome-extraction circuits in spacetime. Here we propose and implement efficient algorithms to find all (spacetime) logical gates of a given CSS code (circuit) composed from a prescribed set of ansatz gates. Depending on the choice of ansatz gates, this means finding transversal gates, more general locality-preserving logical circuits, folding gates, or similar. While we focus on qubit diagonal gates in the Clifford hierarchy, we also discuss the generalization to arbitrary diagonal non-hierarchy gates, certain non-diagonal gates, as well as prime and composite-dimensional qudits. Our method works by rephrasing code-space preserving gates as the kernel of the ``pullback'' of the $X$ check matrix onto phase functions, which maps between finite abelian 2-groups. We implement a fast ``filtration'' method to find this kernel. The runtime for finding fault-tolerant logical gates in a qLDPC code with $O(n)$ qubits or a circuit with $O(n)$ gates in a naive dense implementation is $O(n^3)$, with potential for improvement making use of sparsity.", "url": "https://arxiv.org/abs/2607.26477", "type": "理论+数值", "summary": "寻找有效的非克利福德逻辑或魔态准备方案是容错量子计算的核心挑战之一。许多提出的方案依赖于对角非 Clifford 逻辑门作用于空间中的 CSS 代码或装饰时空中的 CSS 型综合症提取电路。在这里，我们提出并实现有效的算法来查找由一组规定的 ansatz 门组成的给定 CSS 代码（电路）的所有（时空）逻辑门。根据 ansatz 门的选择，这意味着寻找横向门、更通用的局部性保留逻辑电路、折叠门或类似的门。在我们关注 Clifford 层次中的量子位对角门的同时，我们还讨论了对任意对角非层次门、某些非对角门以及素数和复合维量子的推广。我们的方法的工作原理是将代码空间保留门重新表述为 $X$ 校验矩阵“回拉”到相位函数上的内核，该相位函数在有限阿贝尔 2 群之间映射。我们实现了一种快速“过滤”方法来找到这个内核。\n\n在具有 $O(n)$ 量子位的 qLDPC 代码中或在朴素密集实现中具有 $O(n)$ 门的电路中查找容错逻辑门的运行时间为 $O(n^3)$，并且有利用稀疏性进行改进的潜力。", "authors": [{"name": "Andreas Bauer"}], "featured_authors": [{"name": "Andreas Bauer"}], "author_count": 1}, {"id": "2607.26478", "category": "quant-ph", "title": "Explicit Separations for One-Query Unitary Synthesis", "abstract": "The unitary synthesis problem (Aaronson-Kuperberg, CCC 2007) asks whether every $n$-qubit unitary $U$ is computable by efficient quantum circuits relative to some classical oracle $f = f_U$ depending on $U$. Recently, Lombardi-Ma-Wright (STOC 2024) proved that Haar-random unitaries cannot be efficiently synthesized by algorithms that make 1 query (or poly$(n)$ parallel queries) to an arbitrary classical oracle. In this work, we prove several results about the hardness (and easiness!) of variants of unitary synthesis. Our results include: (1) 1-query vs. 2-query unitary synthesis: we prove 1-query lower bounds for synthesizing random permutation unitaries $P\\lvert x\\rangle = \\lvert \\pi(x)\\rangle$, as well as random alternating-basis phase unitaries $F_2 \\cdot H^{\\otimes n} \\cdot F_1$. This gives 1-query lower bounds for \"explicit\" families of unitaries that have efficient (even 2-query) synthesis algorithms. (2) Upper bound for complex phase unitaries: we also consider complex phase unitaries $\\lvert x\\rangle\\mapsto \\alpha_x \\lvert x\\rangle$, which have a clean 2-query synthesis algorithm with no obvious 1-query algorithm. In this case, we prove an upper bound: there are 1-query algorithms (relative to binary phase oracles) that constant-approximate these unitaries in diamond distance. In order to prove our lower bounds, we introduce and analyze two new cryptographic games: the oracle state search game and the oracle Choi state game. Compared to prior work, our framework is mathematically simple, more flexible in what it can prove, and more accurately captures the hardness of synthesizing unitaries that are not \"fully random\". Finally, we also use the search game to prove a new hardness-of-approximation result for quantum programs (synthesizing unitaries relative to quantum advice) for phase unitaries, giving a sharper separation between 1-query unitary synthesis and quantum programs.", "url": "https://arxiv.org/abs/2607.26478", "type": "理论+数值", "summary": "酉综合问题（Aaronson-Kuperberg，CCC 2007）询问是否每个 $n$-qubit 酉 $U$ 都可以通过相对于某些经典预言 $f = f_U$ 的有效量子电路来计算，具体取决于 $U$。最近，Lombardi-Ma-Wright (STOC 2024) 证明，对任意经典预言进行 1 次查询（或 poly$(n)$ 并行查询）的算法无法有效地合成 Haar 随机酉。在这项工作中，我们证明了关于单一合成变体的难度（和容易性！）的几个结果。我们的结果包括：（1）1-查询与2-查询酉合成：我们证明了合成随机排列酉$P\\lvert x\\rangle = \\lvert \\pi(x)\\rangle$以及随机交替基相酉$F_2 \\cdot H^{\\otimes n} \\cdot F_1$的1-查询下界。这为具有高效（甚至 2 查询）合成算法的“显式”酉族提供了 1 查询下限。 (2) 复相酉的上限：我们还考虑复相酉 $\\lvert x\\rangle\\mapsto \\alpha_x \\lvert x\\rangle$，它具有干净的 2-查询合成算法，没有明显的 1-查询算法。\n\n在这种情况下，我们证明了一个上限：存在 1-query 算法（相对于二元相位预言机），可以在菱形距离上不断逼近这些幺正。为了证明我们的下界，我们引入并分析了两种新的密码学游戏：预言机状态搜索游戏和预言机 Choi 状态游戏。与之前的工作相比，我们的框架在数学上更简单，它可以证明的内容更灵活，并且更准确地捕捉合成非“完全随机”的酉的难度。最后，我们还使用搜索游戏来证明相位酉的量子程序（相对于量子建议合成酉）的新近似硬度结果，从而在 1 查询酉合成和量子程序之间提供更清晰的分离。", "authors": [{"name": "Fangqi Dong"}, {"name": "Alex Lombardi"}, {"name": "Fermi Ma"}], "featured_authors": [{"name": "Fangqi Dong"}, {"name": "Alex Lombardi"}, {"name": "Fermi Ma"}], "author_count": 3}, {"id": "2607.26669", "category": "quant-ph", "title": "Quantum model reduction based on Oja's flow", "abstract": "We propose a novel approach to numerically derive approximate reduced dynamical models for Markovian quantum open systems without perturbative iterations, projecting the evolution to the subspace associated to their slowest degrees of freedom. The two algorithms we develop are based on Oja's continuous-time principal component flow: the first returns the optimal reduction to the slowest decaying operator-subspace, and is extended to time-dependent dynamics, while the second one is designed to reduce the dynamics on a subspace of the system's Hilbert space, and thus preserve conditional complete positivity. The methods represent a non-perturbative alternative to well-established Adiabatic Elimination (AE) methods, and the second can be used to find noise-protected subspace codes for quantum information processing. Both are tested on a paradigmatic central spin model.", "url": "https://arxiv.org/abs/2607.26669", "type": "理论+数值", "summary": "我们提出了一种新颖的方法，可以在没有微扰迭代的情况下，以数值方式导出马尔可夫量子开放系统的近似简化动力学模型，将演化投影到与其最慢自由度相关的子空间。我们开发的两种算法基于 Oja 的连续时间主成分流：第一种算法返回最慢衰减算子子空间的最优约简，并扩展到时间相关的动力学，而第二种算法旨在减少系统希尔伯特空间子空间上的动态，从而保留条件完全正性。这些方法代表了成熟的绝热消除（AE）方法的非微扰替代方法，第二种方法可用于寻找用于量子信息处理的噪声保护子空间代码。两者都在典型的中心自旋模型上进行了测试。", "authors": [{"name": "Miguel Casanova"}, {"name": "Kentaro Ohki"}, {"name": "Francesco Ticozzi"}], "featured_authors": [{"name": "Miguel Casanova"}, {"name": "Kentaro Ohki"}, {"name": "Francesco Ticozzi"}], "author_count": 3}, {"id": "2607.26672", "category": "quant-ph", "title": "Relational Quantum Causal Processes: Exact Models, Continuum Limits, and the Boundary of Emergent Gravity", "abstract": "Relational quantum causal processes formulate finite operational contexts as normal positive functionals on local completely positive maps. Response differences generate an influence algebra, and its central projections define jointly readable Boolean events. We develop this starting point through a sequence of exact and controlled models. Fresh-environment unitary collision circuits produce dephasing-exchange kinetics with an exact charge-center fixed algebra, a uniform finite-step limit at fixed response order, and graph-controlled metastable Markov dynamics. An absorbing-state model exhibits a sharp transition between non-Abelian quantum memory and Boolean records. A reversal-covariant defect dynamics generates a locally finite partial order on a restricted graph family without assuming a Lyapunov time. Conditional on a certified order, a positive additive record measure, compactness, and identifiability, we prove subsequential convergence to a Lorentzian metric-measure space, finite reconstruction bounds, and uniqueness of admissible smooth limits. Complementary finite regulators provide controlled tests of modular-to-boost response, null tomography, same-update variational identities, induced quadratic gravity, and compatible common-refinement limits. These results are exact or controlled within their stated models, but they do not yet constitute a single background-independent microscopic law that jointly generates adjacency, time, volume normalization, dimension, signature, nonlinear Einstein constraints, and quantum matter. We therefore present RQCP-QG as a theorem-indexed framework that separates established mechanisms, conditional compositions, and open assumptions.", "url": "https://arxiv.org/abs/2607.26672", "type": "理论+数值", "summary": "关系量子因果过程将有限的操作上下文表述为局部完全正映射上的正常正函数。响应差异生成影响代数，其中心投影定义了共同可读的布尔事件。我们通过一系列精确且受控的模型来开发这个起点。新鲜环境酉碰撞电路产生相移交换动力学，具有精确的电荷中心固定代数、固定响应阶数的统一有限步极限以及图控制的亚稳态马尔可夫动力学。吸收态模型表现出非阿贝尔量子存储器和布尔记录之间的急剧转变。反转协变缺陷动力学在不假设李亚普诺夫时间的情况下在受限图族上生成局部有限偏序。以经过认证的阶数、正加性记录测度、紧致性和可识别性为条件，我们证明了洛伦兹度量测度空间的后续收敛性、有限重建边界以及可接受的平滑极限的唯一性。\n\n互补的有限调节器提供模块化升压响应、零层析成像、相同更新变分恒等式、诱导二次重力和兼容的共同细化限制的受控测试。这些结果是精确的或控制在其规定的模型内，但它们尚未构成一个独立于背景的微观定律，该定律共同生成邻接、时间、体积归一化、维度、签名、非线性爱因斯坦约束和量子物质。因此，我们将 RQCP-QG 作为定理索引框架，将已建立的机制、条件组合和开放假设分开。", "authors": [{"name": "Yipeng Xu"}], "featured_authors": [{"name": "Yipeng Xu"}], "author_count": 1}, {"id": "2607.26707", "category": "quant-ph", "title": "Microscopic study of topological phase transitions: Percolation point of view", "abstract": "We investigate microscopic mechanisms underlying decoherence-induced transitions between topologically ordered states. As a first case study, we analyze the color code using topological entanglement negativity (TEN) and a disorder parameter associated
