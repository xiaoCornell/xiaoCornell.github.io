  <style>
    :root {

    body {
      margin: 0;
      font-family: var(--ui-font);

    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }

    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }

    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }

    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }

    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }

  <script>
    const papers = [{"id": "2607.26151", "category": "cond-mat", "title": "Quantum spin-glass criticality in disordered frustrated dimer magnets", "abstract": "We study quantum phase transitions of Mott insulators between spin-glass and featureless paramagnetic phases. Specifically, we consider a triangular-lattice bilayer Heisenberg model with bond disorder. The clean system has two phases, a dimer quantum paramagnet and a non-collinear antiferromagnet, separated by a quantum critical point. Bond disorder destroys the antiferromagnetic phase via the interference of dipolar textures and results in spin-glass order, such that the system features a quantum phase transition between spin-glass and dimer phases. We study the vicinity of this transition using a variant of bond-operator theory and calculate thermodynamic observables as well as excitation spectra. Bond disorder leads to strong inhomogeneities near the transition which suppresses non-collinearities and leads to anomalously weak glassiness in the near-critical quantum spin glass. We characterize the low-energy excitations which have a strong tendency towards spatial localization, and we track the behavior of the amplitude (i.e. Higgs) mode across the glass phase whose spectral weight we find to be strongly suppressed due to interference effects.", "url": "https://arxiv.org/abs/2607.26151", "type": "理论", "summary": "我们研究莫特绝缘体在自旋玻璃相和无特征顺磁相之间的量子相变。具体来说，我们考虑具有键无序的三角晶格双层海森堡模型。该清洁系统具有两个相，即二聚体量子顺磁体和非共线反铁磁体，由量子临界点分隔开。键无序通过偶极织构的干扰破坏反铁磁相并产生自旋玻璃有序，使得该系统具有自旋玻璃和二聚体相之间的量子相变。我们使用键算子理论的变体研究了这种转变的附近，并计算了热力学可观测量以及激发光谱。键无序导致过渡附近的强烈不均匀性，从而抑制非共线性并导致近临界量子自旋玻璃中异常弱的玻璃性。我们描述了具有强烈空间局域化趋势的低能激发，并跟踪了整个玻璃相的振幅（即希格斯）模式的行为，我们发现其光谱权重由于干涉效应而受到强烈抑制。", "authors": [{"name": "Darshan G. Joshi"}, {"name": "Matthias Vojta"}], "featured_authors": [{"name": "Darshan G. Joshi"}, {"name": "Matthias Vojta"}], "author_count": 2}, {"id": "2607.26162", "category": "cond-mat", "title": "Dirac Fermion Scattering and Pseudospin Polarization in Structurally Asymmetric Graphene Wormholes", "abstract": "We study the quantum transport of massless Dirac fermions through two asymptotically flat graphene sheets connected by a structurally asymmetric catenoid wormhole in $(2+1)$-dimensional curved spacetime. Analytic scattering basis functions are derived: Hankel functions of integer order (in the half-flux sector) in the flat sheets and Gauss hypergeometric functions in the curved throat. We construct a transfer matrix via piecewise numerical matching, verifying unitarity up to numerical precision. The transmission probability rises monotonically to unity at high energies. Global transmission exhibits mirror degeneracy under inversion of structural asymmetry, but local observables depend on incidence direction. The manifold's spin connection acts as a Hermitian coupling inducing an $A/B$ sublattice imbalance at the throat. Structural asymmetry induces a local pseudospin imbalance. A larger curvature radius enhances $P_z$ polarization via a larger geometric phase; abrupt incidence suppresses it. Sub-barrier modes exhibit a negative transmission phase time, compatible with Hartman-type wave-packet reshaping.", "url": "https://arxiv.org/abs/2607.26162", "type": "理论+数值", "summary": "我们研究了无质量狄拉克费米子在 $(2+1)$ 维弯曲时空中通过两个渐近平坦的石墨烯片的量子传输，石墨烯片通过结构不对称的链状虫洞连接。导出解析散射基函数：平板中的整数阶汉克尔函数（在半通量扇区中）和弯曲喉部中的高斯超几何函数。我们通过分段数值匹配构造一个传递矩阵，验证数值精度的幺正性。在高能量下传输概率单调上升至一致。全局传输在结构不对称性反转下表现出镜像简并，但局部可观测值取决于入射方向。流形的自旋连接充当厄米耦合，在喉部引起 $A/B$ 亚晶格不平衡。结构不对称会导致局部赝自旋不平衡。较大的曲率半径通过较大的几何相位增强$P_z$偏振；突然的发生会抑制它。子势垒模式表现出负传输相位时间，与哈特曼型波包整形兼容。", "authors": [{"name": "Arián Gorza"}, {"name": "Facundo Arreyes"}, {"name": "Juan Sebastián Ardenghi"}], "featured_authors": [{"name": "Arián Gorza"}, {"name": "Facundo Arreyes"}, {"name": "Juan Sebastián Ardenghi"}], "author_count": 3}, {"id": "2607.26263", "category": "cond-mat", "title": "Influence of BaTiO_3 nanoparticles on the anisotropy of the dielectric properties of nematic liquid crystal 5CB", "abstract": "This work is devoted to the mechanisms of dielectric response and electric conductivity of suspensions consisting of the nematic liquid crystal 5CB with different concentrations (from 0 to 10 wt.%) of ferroelectric BaTiO_3 nanoparticles with an average size of 24 nm. We revealed that the incorporation of nanoparticles influences significantly the dielectric permittivity magnitude and anisotropy, as well as dielectric losses of the suspension. A pronounced temperature dependence of the anisotropic dielectric permittivity of the suspensions was found at lower temperatures corresponding to the mesophase state; but it is also present at higher temperatures corresponding to the isophase. The dependence of the mesophase-isophase transition temperature on the concentration of BaTiO_3 nanoparticles appeared nonmonotonic. With increasing temperature, both the capacitance and the electrical resistance of the pure liquid crystal increase, as well as it increases in the suspensions with small concentration of BaTiO_3 nanoparticles. Due to space charge accumulation in the shells of nanoparticles, larger concentrations of BaTiO_3 nanoparticles influence strongly the ionic transport by promoting the formation of ionic-electronic screening. This effect modifies the dielectric properties and conduction mechanisms of the suspension, leading to the nonmonotonic dependence of the mesophase - isophase transition temperature versus the nanoparticle concentration.", "url": "https://arxiv.org/abs/2607.26263", "type": "理论", "summary": "这项工作致力于研究由向列液晶 5CB 和不同浓度（0 至 10 wt.%）平均尺寸为 24 nm 的铁电 BaTiO_3 纳米粒子组成的悬浮液的介电响应和电导率机制。我们发现纳米粒子的加入显着影响悬浮液的介电常数大小和各向异性以及介电损耗。在对应于中间相状态的较低温度下，发现悬浮液的各向异性介电常数具有明显的温度依赖性；但它也存在于与等相相对应的较高温度下。中间相-等相转变温度对BaTiO_3纳米颗粒浓度的依赖性呈现非单调性。随着温度的升高，纯液晶的电容和电阻均增大，在含有小浓度BaTiO_3纳米粒子的悬浮液中电容和电阻也增大。\n\n由于纳米粒子壳内空间电荷的积累，较大浓度的BaTiO_3纳米粒子通过促进离子电子屏蔽的形成强烈影响离子输运。这种效应改变了悬浮液的介电特性和传导机制，导致中间相-等相转变温度与纳米颗粒浓度的非单调依赖性。", "authors": [{"name": "Juliya M. Gudenko"}, {"name": "Oleksandr S. Pylypchuk"}, {"name": "Victor V. Vainberg"}, {"name": "Denis O. Stetsenko"}, {"name": "Igor A. Gvozdovskyy"}, {"name": "Serhii E. Ivanchenko"}, {"name": "Eugene A. Eliseev"}, {"name": "Vladimir N. Poroshin"}, {"name": "Anna N. Morozovska"}], "featured_authors": [{"name": "Juliya M. Gudenko"}, {"name": "Oleksandr S. Pylypchuk"}, {"name": "Victor V. Vainberg"}, {"name": "Eugene A. Eliseev"}, {"name": "Vladimir N. Poroshin"}, {"name": "Anna N. Morozovska"}], "author_count": 9}, {"id": "2607.26274", "category": "cond-mat", "title": "Dynamic phase-field model for brittle fracture in grounded glaciers", "abstract": "Fracture and calving of glaciers are key contributors to ice-mass loss and sea-level rise, yet predictive modeling remains challenging. Fracture in grounded glaciers is driven by gravitational forces and is typically studied within the framework of quasi-static linear elastic fracture mechanics. In this work, we show that purely quasistatic brittle fracture simulations within the phase field fracture framework under fixed self-weight can become strongly overdriven after crevasse initiation, producing unphysical thickening of the diffusive crack band and diffuse damage patterns. This pathology arises because gravity drives a growing region ahead of the crack tip beyond the strength surface. To resolve this, we show that the post-nucleation propagation is fundamentally a dynamic instability rather than a quasistatic process and propose the use of dynamic formulations of fracture. We demonstrate that accounting for inertia results in sharp, localized cracks that propagate through the ice thickness. As a second objective, this paper introduces a new dynamic formulation of the phase-field fracture model of Kumar et al. (J. Mech. Phys. Solids 2018) in which elastic, inertial, and gravitational contributions are degraded consistently in fractured regions.", "url": "https://arxiv.org/abs/2607.26274", "type": "理论+数值", "summary": "冰川的破裂和崩解是冰块损失和海平面上升的关键因素，但预测模型仍然具有挑战性。接地冰川的断裂是由重力驱动的，通常在准静态线弹性断裂力学的框架内进行研究。在这项工作中，我们表明，固定自重下相场断裂框架内的纯准静态脆性断裂模拟在裂缝萌生后可能会变得强烈超驱动，从而产生扩散裂纹带和扩散损伤模式的非物理增厚。出现这种病理现象是因为重力驱动裂纹尖端前方的区域超出强度表面。为了解决这个问题，我们证明成核后扩展从根本上来说是一种动态不稳定而不是准静态过程，并建议使用断裂的动态公式。我们证明，考虑惯性会导致尖锐的局部裂纹在冰层厚度中传播。作为第二个目标，本文介绍了 Kumar 等人的相场断裂模型的新动态公式。 （J.机械物理学。\n\nSolids 2018），其中弹性、惯性和重力的贡献在断裂区域中持续退化。", "authors": [{"name": "Aarosh Dahal"}, {"name": "Umar Khayaz"}, {"name": "Ravindra Duddu"}, {"name": "Aditya Kumar"}], "featured_authors": [{"name": "Aarosh Dahal"}, {"name": "Umar Khayaz"}, {"name": "Ravindra Duddu"}, {"name": "Aditya Kumar"}], "author_count": 4}, {"id": "2607.26282", "category": "cond-mat", "title": "Topological control of local electroneutrality in confined electrolytes", "abstract": "Topology governs finite-size violations of local electroneutrality in confined electrolytes. Within Poisson-Boltzmann theory, we show that this topological control gives rise to a universal hierarchy of deviations in spherical, cylindrical, and planar confinement. We quantify this effect through an electroneutrality deviation ratio that captures the global electrostatic constraints associated with compactness and boundary multiplicity in the three topological classes corresponding to slit, cylindrical, and spherical cavities. Although local electroneutrality is asymptotically restored in the limit of infinite cavity size, finite-size deviations follow a robust topological hierarchy, being strongest in spherical cavities, weaker in cylindrical confinement, and weakest in planar slits. These results prove that topology is the organizing principle underlying confinement-induced charge redistribution and that violations of local electroneutrality constitute a general electrostatic constraint governing overcharging, charge reversal, and long-range charge correlations. More fundamentally, they demonstrate that changing the topology modifies the global electrostatic constraints without altering the local Poisson-Boltzmann equations. As a counterintuitive manifestation of nonlinear confinement in a point-ion model, we report the existence of inside confinement charge reversal (ICCR) in charged hollow cylindrical and spherical nanoparticles. Since physically consistent, more general electrolyte theories must recover the Poisson-Boltzmann description in the appropriate limiting case, the present results establish a benchmark against which topological effects should be assessed beyond the Poisson-Boltzmann description.", "url": "https://arxiv.org/abs/2607.26282", "type": "理论", "summary": "拓扑控制着受限电解质中局部电中性的有限尺寸违反。在泊松-玻尔兹曼理论中，我们表明这种拓扑控制产生了球形、圆柱形和平面约束中的普遍偏差等级。我们通过电中性偏差比来量化这种效应，该偏差比捕获与狭缝、圆柱形和球形空腔相对应的三个拓扑类别中的致密性和边界多重性相关的全局静电约束。尽管局域电中性在无限空腔尺寸的极限下渐近恢复，但有限尺寸偏差遵循稳健的拓扑层次结构，在球形空腔中最强，在圆柱形限制中较弱，在平面狭缝中最弱。这些结果证明拓扑结构是限制引起的电荷重新分布的组织原理，并且违反局部电中性构成了控制过度充电、电荷反转和长程电荷相关性的一般静电约束。\n\n更根本的是，他们证明改变拓扑可以修改全局静电约束，而不会改变局部泊松-玻尔兹曼方程。作为点离子模型中非线性约束的反直觉表现，我们报告了带电空心圆柱形和球形纳米颗粒中存在内部约束电荷反转（ICCR）。由于物理上一致，更一般的电解质理论必须在适当的限制情况下恢复泊松-玻尔兹曼描述，因此目前的结果建立了一个基准，根据该基准评估泊松-玻尔兹曼描述之外的拓扑效应。", "authors": [{"name": "Marcelo Lozada-Cassou"}], "featured_authors": [{"name": "Marcelo Lozada-Cassou"}], "author_count": 1}, {"id": "2607.26289", "category": "cond-mat", "title": "Scale-dependent universality class crossover in magnetic skyrmion polymers", "abstract": "Dipolar magnetic skyrmions can assemble into chains with alternating helicity that act as one-dimensional polymers, yet their statistical mechanics violates the universal harmonic scaling observed in actin, DNA, and microtubules. From first principles, we compute the inter-skyrmion pair potential and find a bi-exponential form of competing interactions with two characteristic decay lengths that encode the distinct microscopic mechanisms of repulsion and attraction. Multiscale simulations reveal a power-law temperature dependence with exponent $1$ in the worm-chain limit of a single bond, and exponent $1/2$ in the three-bond limit. We find that the power-law behavior is remarkably independent of magnetic field strength, and the crossover is due to competing radial interactions responsible for the bonds, resulting in a quartic transverse confinement. We show that the precise form of the competing interactions (e.g., Morse or double-Yukawa) does not affect the temperature dependence.", "url": "https://arxiv.org/abs/2607.26289", "type": "数值", "summary": "偶极磁性斯格明子可以组装成具有交替螺旋性的链，充当一维聚合物，但它们的统计力学违反了在肌动蛋白、DNA 和微管中观察到的通用谐波标度。根据第一原理，我们计算了斯格明子间对势，并找到了一种双指数形式的竞争相互作用，其具有两个特征衰变长度，这两个特征衰变长度编码了排斥和吸引的不同微观机制。多尺度模拟揭示了幂律温度依赖性，单键蠕虫链极限中的指数为 $1$，三键极限中的指数为 $1/2$。我们发现幂律行为明显独立于磁场强度，并且交叉是由于负责键的竞争径向相互作用，导致四次横向限制。我们表明，竞争相互作用的精确形式（例如莫尔斯或双汤川）不会影响温度依赖性。", "authors": [{"name": "R. L. Silva"}, {"name": "R. C. Silva"}, {"name": "R. L. Stamps"}], "featured_authors": [{"name": "R. L. Silva"}, {"name": "R. C. Silva"}, {"name": "R. L. Stamps"}], "author_count": 3}, {"id": "2607.26308", "category": "cond-mat", "title": "Hidden symmetry at the diabolical points of a biaxial spin", "abstract": "In a rotated frame the biaxial spin Hamiltonian $k_1S_x^2+k_2S_y^2-\\mathbf{h}\\cdot\\mathbf{S}$ is a finite tight-binding chain whose hopping amplitudes are tuned by the applied field. A chain with no vanishing hopping has a nondegenerate spectrum, so a degeneracy can occur only where the field severs the chain. We show that at every point of the exact diabolical-point lattice found by Kececioglu and Garg the chain is severed twice over, in two different rotated frames and at two bonds that are fixed independently. The two severings are carried by projectors that commute with the Hamiltonian but not with each other. In that form they realize the hidden symmetry anticipated by Garg. A single operator built from them pairs the degenerate levels; its rank gives the multiplicity of every lattice point, replacing an earlier continuity and topological argument. Because the two partners of a doublet occupy disjoint stretches of the chain, an exact and manifestly negative determinant fixes the orientation of every cone. At every degeneracy of the model the lower level therefore carries Chern charge -1 in the convention used here.", "url": "https://arxiv.org/abs/2607.26308", "type": "理论", "summary": "在旋转坐标系中，双轴自旋哈密顿量 $k_1S_x^2+k_2S_y^2-\\mathbf{h}\\cdot\\mathbf{S}$ 是有限紧束缚链，其跳跃幅度由施加的场调整。没有消失跳跃的链具有非简并谱，因此仅在场切断链的地方才会发生简并。我们证明，在 Kececioglu 和 Garg 发现的精确恶魔点晶格的每个点上，链都被切断两次，在两个不同的旋转框架中和在两个独立固定的键处。这两个分支由投影仪承载，投影仪与哈密顿量交换，但彼此之间不交换。以这种形式，他们实现了加格所预期的隐藏对称性。由它们构建的单个运算符将退化级别配对；它的等级给出了每个格点的多重性，取代了早期的连续性和拓扑论证。由于双峰的两个伙伴占据了链的不相交部分，因此精确且明显负的行列式固定了每个锥体的方向。因此，在模型的每次简并中，较低能级都带有陈电荷 -1（此处使用的惯例）。", "authors": [{"name": "Shadan Ghassemi Tabrizi"}], "featured_authors": [{"name": "Shadan Ghassemi Tabrizi"}], "author_count": 1}, {"id": "2607.26406", "category": "cond-mat", "title": "Non-Hermitian Random Matrix Theory of Jamming in Active Disordered Media", "abstract": "We develop a theoretical framework for the mechanics of active jammed systems based on non-Hermitian random matrix theory. Starting from a microscopic model of active particles with non-reciprocal interactions, we formulate the linearized dynamical matrix as a non-Hermitian perturbation of a Wishart ensemble describing the passive contact network. Using Girko's Hermitization together with the self-consistent Born approximation, we derive a self-consistent equation for the low-frequency resolvent based on the full Marchenko--Pastur distribution. We show that active non-reciprocity regularizes the soft-mode divergence at the jamming transition, leading to a scaling law for the mechanical compliance. We further establish a crossover between perturbative and activity-dominated regimes and propose a corresponding scaling form near the active jamming point.", "url": "https://arxiv.org/abs/2607.26406", "type": "理论", "summary": "我们基于非厄米随机矩阵理论开发了主动干扰系统力学的理论框架。从具有非互易相互作用的活性粒子的微观模型开始，我们将线性化动力学矩阵表示为描述被动接触网络的 Wishart 系综的非厄米扰动。使用 Girko 的 Hermitization 和自洽 Born 近似，我们推导出基于完整 Marchenko-Pastur 分布的低频分解的自洽方程。我们表明，主动非互易性调节了干扰过渡时的软模式发散，从而得出机械顺应性的缩放定律。我们进一步建立了扰动和活动主导状态之间的交叉，并在有源干扰点附近提出了相应的缩放形式。", "authors": [{"name": "Hisao Hayakawa"}], "featured_authors": [{"name": "Hisao Hayakawa"}], "author_count": 1}, {"id": "2607.26422", "category": "cond-mat", "title": "Physics-informed Machine Learning Prediction of Hubbard Interaction Parameters", "abstract": "Accurate determination of Hubbard interaction parameters is essential for beyond-DFT approaches such as DFT+$U$, DFT+DMFT, and DFT+$U$+$V$ in correlated materials. In practice, however, these parameters are often chosen empirically, limiting their transferability across materials. Advanced computational approaches such as the constrained random-phase approximation (cRPA) provide a rigorous route for evaluating Hubbard interactions, but their computational cost remains a bottleneck for large-scale materials screening. Here, we present machine-learning (ML) models for predicting cRPA-derived Hubbard interaction parameters: effective on-site $U_{\\rm eff}$, inter-site $V$, and Hund's coupling $J$ for transition-metal oxides (TMOs). We combine ensemble-learning models with a regression-based brute-force search (BFS) approach to achieve both predictive accuracy and explicit analytical expressions. We construct features that capture electronic, structural, and atomic properties, including the TM-$d$ bandwidth and TM-$d$/O-$p$ band-center separation, as physically motivated descriptors of localization and screening. Our ensemble models achieve RMSEs of 0.148 eV, 0.062 eV, and 0.007 eV for $U_{\\rm eff}$, $V$, and $J$, respectively. The derived analytical forms directly relate $U_{\\rm eff}$ to electron localization and TM-$d$/O-$p$ hybridization, suggest the importance of hybridization and structural compactness in determining $V$, and indicate that $J$ is governed primarily by elemental descriptors of the TM ion. Together, the present study provides an efficient approach for predicting cRPA-derived $U_{\\rm eff}$, $V$, and $J$, while offering physical insight into the factors underlying these Hubbard interactions.", "url": "https://arxiv.org/abs/2607.26422", "type": "理论+数值", "summary": "准确确定哈伯德相互作用参数对于超 DFT 方法至关重要，例如相关材料中的 DFT+$U$、DFT+DMFT 和 DFT+$U$+$V$。然而，在实践中，这些参数通常是根据经验选择的，限制了它们在材料之间的可转移性。约束随机相位近似（cRPA）等先进计算方法为评估哈伯德相互作用提供了严格的途径，但其计算成本仍然是大规模材料筛选的瓶颈。在这里，我们提出了用于预测 cRPA 衍生的 Hubbard 相互作用参数的机器学习 (ML) 模型：过渡金属氧化物 (TMO) 的有效现场 $U_{\\rm eff}$、位点间 $V$ 和洪德耦合 $J$。我们将集成学习模型与基于回归的强力搜索（BFS）方法相结合，以实现预测准确性和明确的分析表达式。我们构建了捕获电子、结构和原子特性的特征，包括 TM-$d$ 带宽和 TM-$d$/O-$p$ 带中心分离，作为定位和筛选的物理驱动描述符。\n\n我们的集成模型对于 $U_{\\rm eff}$、$V$ 和 $J$ 的 RMSE 分别为 0.148 eV、0.062 eV 和 0.007 eV。导出的分析形式将 $U_{\\rm eff}$ 与电子定位和 TM-$d$/O-$p$ 杂交直接相关，表明杂交和结构紧凑性在确定 $V$ 中的重要性，并表明 $J$ 主要由 TM 离子的元素描述符控制。总之，本研究提供了一种有效的方法来预测 cRPA 衍生的 $U_{\\rm eff}$、$V$ 和 $J$，同时提供对这些哈伯德相互作用背后的因素的物理洞察。", "authors": [{"name": "Jiyeon Kim"}, {"name": "Indukuru Ramesh Reddy"}, {"name": "Bongjae Kim"}, {"name": "Sooran Kim"}], "featured_authors": [{"name": "Jiyeon Kim"}, {"name": "Indukuru Ramesh Reddy"}, {"name": "Bongjae Kim"}, {"name": "Sooran Kim"}], "author_count": 4}, {"id": "2607.26487", "category": "cond-mat", "title": "Same-spin Andreev reflections in the quantum Hall regime: the role of loss", "abstract": "The interfaces of superconductors and topological materials hold promise for realizing exotic states and excitations. An important example is provided by the chiral Andreev edge states (CAES), which are formed at interfaces between quantum Hall (QH) states and superconductors (SC). CAES combine electron and hole amplitudes which are hybridized via Andreev reflections. This study explores the spin properties of the CAES through selective spin filtering of the QH edge channels. We find robust evidence of spin-flips accompanying the Andreev processes: electrons can be reflected from the superconductor as holes in the same spin channel. We demonstrate that the distribution of the reflection probabilities is exponential and then use random matrix theory to account for this observation. Finally, we observe Andreev reflections in the spin-polarized {\\nu} = 1 case, which is enabled by particle loss. Our findings shed light on the mechanism underlying Andreev reflections of spin-polarized chiral states. They also demonstrate the importance of considering non-Hermiticity when constructing topological superconductors in hybrid materials.", "url": "https://arxiv.org/abs/2607.26487", "type": "理论", "summary": "超导体和拓扑材料的界面有望实现奇异态和激发。手性安德烈夫边缘态 (CAES) 就是一个重要的例子，它是在量子霍尔 (QH) 态和超导体 (SC) 之间的界面处形成的。 CAES 结合了通过 Andreev 反射杂化的电子和空穴振幅。本研究通过 QH 边缘通道的选择性自旋过滤探索 CAES 的自旋特性。我们发现了伴随安德烈夫过程的自旋翻转的有力证据：电子可以从超导体反射为同一自旋通道中的空穴。我们证明反射概率的分布是指数分布，然后使用随机矩阵理论来解释这一观察结果。最后，我们观察到自旋极化 {\\nu} = 1 情况下的安德烈夫反射，这是由粒子损失实现的。我们的发现揭示了自旋极化手性态安德烈夫反射的机制。他们还证明了在混合材料中构造拓扑超导体时考虑非厄米性的重要性。", "authors": [{"name": "Chun-Chia Chen"}, {"name": "Jordan T. McCourt"}, {"name": "John Chiles"}, {"name": "Lingfei Zhao"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "François Amet"}, {"name": "Antonio L. R. Manesco"}, {"name": "Harold U. Baranger"}, {"name": "Gleb Finkelstein"}], "featured_authors": [{"name": "Chun-Chia Chen"}, {"name": "Jordan T. McCourt"}, {"name": "John Chiles"}, {"name": "Antonio L. R. Manesco"}, {"name": "Harold U. Baranger"}, {"name": "Gleb Finkelstein"}], "author_count": 10}, {"id": "2607.26516", "category": "cond-mat", "title": "Quantum Geometry-Driven RKKY: From Flat to Dispersive Bands", "abstract": "In flat-band systems, quantum metric bounds physical observables like superfluid weight and coherence length, suggesting a single geometric scale for spatial correlations. Here, we show that the RKKY exchange in an isolated filled flat band can violate this expectation. With the intraband channel absent, the exchange proceeds via virtual interband transitions across the gap; the kernel becomes the inverse-gap-weighted trace product of the real-space flat-band projector and empty-band projectors. Because the corresponding momentum-space projectors are analytic, the kernel decays exponentially, with a decay length $\\xi_\\text{RKKY}$ set by the closest singularities of the analytically continued projectors in the complex momentum plane. Thus, this length depends on both the flat-band geometry and the band gap. Applying this formalism to Chern flat-band systems, we find that for small gaps, $\\xi_\\text{RKKY}$ depends non-monotonically on the quantum metric length: it first decreases, then increases, revealing that stronger quantum geometry can shorten the magnetic exchange range. Upon restoring dispersion, a nontrivial inversion representation can force the overlap between Bloch states at antipodal Fermi points to vanish under gate tuning, producing a $1/R^3$ RKKY tail instead of the conventional $1/R^2$---a geometric selection effect.", "url": "https://arxiv.org/abs/2607.26516", "type": "理论", "summary": "在平带系统中，量子度量限制了超流体重量和相干长度等物理可观察量，表明空间相关性的单一几何尺度。在这里，我们证明了孤立填充平带中的 RKKY 交易所可能会违反这一预期。由于不存在带内通道，交换通过跨间隙的虚拟带间转换进行；核成为实空间平带投影仪和空带投影仪的反间隙加权迹积。由于相应的动量空间投影仪是解析的，因此内核呈指数衰减，衰减长度 $\\xi_\\text{RKKY}$ 由复动量平面中分析连续投影仪的最近奇点设置。因此，该长度取决于平带几何形状和带隙。将这种形式应用于 Chern 平带系统，我们发现对于小间隙，$\\xi_\\text{RKKY}$ 非单调地依赖于量子度量长度：它首先减小，然后增加，这表明更强的量子几何可以缩短磁交换范围。\n\n恢复色散后，非平凡的反演表示可以迫使对映费米点处的布洛赫态之间的重叠在门调谐下消失，产生 $1/R^3$ RKKY 尾部，而不是传统的 $1/R^2$——几何选择效应。", "authors": [{"name": "Zhenggang Zhou"}, {"name": "Chuang Li"}, {"name": "Lun-Hui Hu"}], "featured_authors": [{"name": "Zhenggang Zhou"}, {"name": "Chuang Li"}, {"name": "Lun-Hui Hu"}], "author_count": 3}, {"id": "2607.26576", "category": "cond-mat", "title": "Mode-Resolved Light Scattering Recovers Polymer Thermodynamics in Solutions with Trace Large-Mass Scatterers", "abstract": "Light scattering provides direct access to polymer conformations and thermodynamics. However, trace large-mass scatterers such as aggregates and nanobubbles form unavoidably in polymer solutions and dominate the scattered intensity, obscuring the intrinsic polymer signal. We demonstrate that resolving the static scattering intensity by molecular mobility cleanly separates the polymer and large-scatterer contributions. Applying this mode-resolved analysis to aqueous poly(ethylene glycol) solutions, we isolate the polymer scattering even when these scatterers account for more than 90 % of the total intensity. The resolved polymer intensity recovers the universal osmotic equation of state from the dilute to the semidilute regime over 288 to 358 K. This approach establishes a reliable basis for measuring the thermodynamics of interacting macromolecules in solutions where irreproducible large-mass scatterers have precluded quantitative analysis.", "url": "https://arxiv.org/abs/2607.26576", "type": "理论+数值", "summary": "光散射提供了对聚合物构象和热力学的直接了解。然而，聚合物溶液中不可避免地会形成痕量大质量散射体（例如聚集体和纳米气泡），并主导散射强度，从而模糊了固有的聚合物信号。我们证明，通过分子迁移率解析静态散射强度可以清楚地分离聚合物和大散射体的贡献。将这种模式解析分析应用于聚乙二醇水溶液，即使这些散射体占总强度的 90% 以上，我们也能隔离聚合物散射。解析的聚合物强度恢复了 288 至 358 K 范围内从稀到半稀状态的通用渗透状态方程。这种方法为测量溶液中相互作用的大分子的热力学奠定了可靠的基础，在溶液中，不可再现的大质量散射体妨碍了定量分析。", "authors": [{"name": "Noriaki Mizumoto"}, {"name": "Takashi Yasuda"}, {"name": "Xiang Li"}], "featured_authors": [{"name": "Noriaki Mizumoto"}, {"name": "Takashi Yasuda"}, {"name": "Xiang Li"}], "author_count": 3}, {"id": "2607.26586", "category": "cond-mat", "title": "Percolating Multifractal Domains at a Polymorphic Phase Boundary", "abstract": "Giant piezoelectricity in ferroelectrics is commonly associated with phase-boundary instabilities, among which the polymorphic phase boundary (PPB) is a prominent example conventionally attributed to the coexistence of ferroelectric phases. Here, using large-scale molecular dynamics simulations of the lead-free (K,Na)NbO3-(Bi,Na)ZrO3 solid solutions, we show that the PPB hosts a percolating multifractal polar domain which governs the dielectric and piezoelectric responses. By quantifying the global fractal dimension and multifractal spectrum width of this polar network, we identify fractal connectivity and multiscale heterogeneity as microstructural order parameters for the PPB. The maximum reversible piezoelectric response occurs when the fractal-domain volume fraction approaches the three-dimensional percolation threshold, suggesting that near-critical polar connectivity enables giant reversible electromechanical coupling. In this mechanism, the fractal backbone preserves polar memory and provides the restoring force required for reversibility, while the surrounding nonfractal regions supply the polar compliance needed for large polarization rotation and strain. These results establish percolating multifractal polar domains as a microscopic mechanism for PPB-enhanced piezoelectricity and suggest fractal connectivity as a design parameter for high-performance piezoelectrics.", "url": "https://arxiv.org/abs/2607.26586", "type": "理论+数值", "summary": "铁电体中的巨压电性通常与相界不稳定性相关，其中多晶相界（PPB）是通常归因于铁电相共存的一个突出例子。在这里，通过对无铅 (K,Na)NbO3-(Bi,Na)ZrO3 固溶体进行大规模分子动力学模拟，我们表明 PPB 具有渗透多重分形极域，它控制着介电和压电响应。通过量化该极网络的全局分形维数和多重分形谱宽度，我们将分形连通性和多尺度异质性确定为 PPB 的微观结构有序参数。当分形域体积分数接近三维渗流阈值时，出现最大可逆压电响应，这表明近临界极性连通性能够实现巨大的可逆机电耦合。在这种机制中，分形主干保留了极性记忆并提供了可逆性所需的恢复力，而周围的非分形区域则提供了大偏振旋转和应变所需的极性顺应性。\n\n这些结果将渗透多重分形极域确立为 PPB 增强压电性的微观机制，并建议将分形连通性作为高性能压电材料的设计参数。", "authors": [{"name": "Yuan-Jinsheng Liu"}, {"name": "Xu Tian"}, {"name": "Jiahui Zhai"}, {"name": "Shi Liu"}], "featured_authors": [{"name": "Yuan-Jinsheng Liu"}, {"name": "Xu Tian"}, {"name": "Jiahui Zhai"}, {"name": "Shi Liu"}], "author_count": 4}, {"id": "2607.26597", "category": "cond-mat", "title": "Transient Detour and Cooperative Oxygen Exchange in the Polarization Switching of Ferroelectric Hf0.5Zr0.5O2", "abstract": "Hafnium zirconium oxide (HZO) has attracted significant attention as a core material for next-generation non-volatile memories due to its excellent ferroelectricity in the ultra-thin film regime and its CMOS process compatibility. However, the exploration of its polarization switching mechanism has predominantly relied on static energy barrier analyses, leaving the transient bond formation and cooperative dynamic mechanisms under actual electric field driving unresolved. In this study, we performed Electric-Field-Induced MD simulations on a defect-free ideal HZO lattice using a fine-tuned machine learning force field (MACEField). As a result, we successfully reproduced the P-E hysteresis loop dynamically and demonstrated that the polarization switching in HZO is driven not by conventional simple displacement models (S:N/S:T models), but by the dynamic mutual exchange of 3-coordinated oxygen (O3c) and 4-coordinated oxygen (O4c). Analysis of the oxygen atom displacement trajectories revealed that this pathway is accompanied by a unique \"detour\" behavior originating from transient cation-oxygen bond formation. Furthermore, we identified an \"internal self-compensation mechanism\" in which the local volumetric expansion and contraction accompanying the coordination number changes are effectively offset within the cell. These findings provide, from a dynamic perspective, a microscopic physical origin of for HZO's exceptional ability to sustain stable polarization switching without macroscopic strain, a property that has long distinguished HZO from conventional perovskite ferroelectrics yet lacked atomistic explanation. These findings suggest that preserving the integrity of cooperative O3c/O4c exchange pathways, rather than minimizing individual atomic displacements, is the key design principle for endurance and scalability in next-generation ferroelectric memories.", "url": "https://arxiv.org/abs/2607.26597", "type": "理论+数值", "summary": "铪锆氧化物（HZO）由于其在超薄膜体系中优异的铁电性和CMOS工艺兼容性，作为下一代非易失性存储器的核心材料引起了广泛关注。然而，对其极化切换机制的探索主要依赖于静态能垒分析，而没有解决实际电场驱动下的瞬态键形成和协同动力学机制。在这项研究中，我们使用微调的机器学习力场 (MACEField) 对无缺陷的理想 HZO 晶格进行了电场诱导 MD 模拟。结果，我们成功地动态再现了P-E磁滞回线，并证明HZO中的极化切换不是由传统的简单位移模型（S:N/S:T模型）驱动的，而是由3配位氧（O3c）和4配位氧（O4c）的动态相互交换驱动的。对氧原子位移轨迹的分析表明，该途径伴随着源自瞬时阳离子-氧键形成的独特“绕行”行为。\n\n此外，我们还确定了一种“内部自我补偿机制”，其中伴随配位数变化的局部体积膨胀和收缩在细胞内得到有效抵消。从动态角度来看，这些发现为HZO在没有宏观应变的情况下维持稳定极化切换的特殊能力提供了微观物理起源，这一特性长期以来一直将HZO与传统钙钛矿铁电体区分开来，但缺乏原子学解释。这些发现表明，保持协作 O3c/O4c 交换路径的完整性，而不是最小化单个原子位移，是下一代铁电存储器的耐用性和可扩展性的关键设计原则。", "authors": [{"name": "Ryotaro Sahashi"}, {"name": "Po-Yen Chen"}, {"name": "Teruyasu Mizoguchi"}], "featured_authors": [{"name": "Ryotaro Sahashi"}, {"name": "Po-Yen Chen"}, {"name": "Teruyasu Mizoguchi"}], "author_count": 3}, {"id": "2607.26620", "category": "cond-mat", "title": "Critical non-thermal fixed point and the dynamical condensation phase transition", "abstract": "Using a non-perturbative quantum kinetic framework, we develop a unified description of the far-from-equilibrium dynamics of three-dimensional Bose gases following cooling quenches across the Bose-Einstein condensation transition. By tracking the spatio-temporal evolution of the momentum distribution, we show that the equilibrium condensation threshold simultaneously acts as a dynamical critical point, separating distinct far-from-equilibrium universality classes governed by different non-equilibrium attractors. While quenches above the transition exhibit a single-timescale relaxation toward a thermal fixed point, quenches below the transition display a crossover from a transient weak-turbulence regime to a coarsening fixed point governed by the diffusive recombination of vortex lines. Quenches directly to the condensation threshold, finally, are controlled by a previously unidentified critical fixed point characterized by the superdiffusive spreading of critical fluctuations and a distinct set of dynamical exponents. Together, these dynamical scaling laws establish a far-from-equilibrium counterpart of the condensation phase transition, in which the equilibrium critical point also organizes the long-time non-equilibrium dynamics.", "url": "https://arxiv.org/abs/2607.26620", "type": "理论", "summary": "使用非微扰量子动力学框架，我们对玻色-爱因斯坦凝聚转变冷却猝灭后三维玻色气体的远离平衡动力学进行了统一描述。通过跟踪动量分布的时空演化，我们表明平衡凝聚阈值同时充当动力学临界点，分离由不同非平衡吸引子控制的不同的远离平衡普遍性类别。虽然转变上方的淬火表现出朝向热固定点的单时间尺度弛豫，但转变下方的淬火表现出从瞬态弱湍流状态到由涡线的扩散重组控制的粗化固定点的交叉。最后，直接淬灭到凝结阈值是由先前未识别的临界固定点控制的，该临界固定点的特征是临界波动的超扩散扩散和一组不同的动态指数。\n\n这些动力学标度定律共同建立了凝结相变的远离平衡对应物，其中平衡临界点也组织了长时间的非平衡动力学。", "authors": [{"name": "Anne-Solène Bornens"}, {"name": "Elisabeth Gliott"}, {"name": "Nicolas Cherroret"}], "featured_authors": [{"name": "Anne-Solène Bornens"}, {"name": "Elisabeth Gliott"}, {"name": "Nicolas Cherroret"}], "author_count": 3}, {"id": "2607.26660", "category": "cond-mat", "title": "Entanglement signatures of topological phase transitions in a dirty Weyl semimetal", "abstract": "Three-dimensional Weyl semimetals (WSMs) constitute paradigmatic gapless topological phases whose nodal structure is stable against weak perturbations, including disorder. Two distinct ways to destroy the topology of the Weyl nodes are through pairwise annihilation in momentum space or by sufficiently strong disorder that eliminates the quasiparticle pole, driving the system into a non-Fermi-liquid diffusive-metallic state. In this work, we study the evolution of entanglement spectrum and entanglement entropy of a dirty WSM as it undergoes these two topological transitions. In the clean limit, the WSM topology is reflected by a locus of $\\xi=1/2$ eigenvalues of the reduced correlation matrix mirroring the structure of Fermi arcs. We show that disorder broadens this feature into a finite-width distribution, which disappears either through a gradual loss of spectral weight upon node annihilation or by melting into the background at the onset of metallicity. When tuning across the disorder-driven transition, the scaling of the Rényi entropies observed for weak disorder gradually breaks down as the system approaches the critical disorder strength.", "url": "https://arxiv.org/abs/2607.26660", "type": "理论", "summary": "三维外尔半金属（WSM）构成了典型的无间隙拓扑相，其节点结构对于弱扰动（包括无序）是稳定的。破坏外尔节点拓扑的两种不同方法是通过动量空间中的成对湮灭或通过足够强的无序消除准粒子极，将系统驱动到非费米液体扩散金属态。在这项工作中，我们研究了脏 WSM 在经历这两个拓扑转变时的纠缠谱和纠缠熵的演化。在干净极限中，WSM 拓扑由反映费米弧结构的简化相关矩阵的 $\\xi=1/2$ 特征值轨迹反映。我们表明，无序性将这一特征扩展为有限宽度的分布，这种分布要么通过节点湮灭时光谱权重的逐渐损失，要么通过在金属丰度开始时融入背景而消失。当调整无序驱动的转变时，随着系统接近临界无序强度，观察到的弱无序 Rényi 熵的缩放逐渐分解。", "authors": [{"name": "Vinícius Mohr"}, {"name": "Shunji Tsuchiya"}, {"name": "Andras Szabo"}], "featured_authors": [{"name": "Vinícius Mohr"}, {"name": "Shunji Tsuchiya"}, {"name": "Andras Szabo"}], "author_count": 3}, {"id": "2607.26662", "category": "cond-mat", "title": "Interface evolution in the two-dimensional quantum Ising model", "abstract": "We consider the unitary time evolution of an interface in the regime of spontaneously broken symmetry of the two-dimensional quantum Ising model. The interface is induced by an initial condition interpolating between the two degenerate ground states in one of the spatial dimensions. The interpolation is left generic in order to investigate the dependence of the late time dynamics on the initial condition. Exploiting the basis of asymptotic quasiparticle states of the bulk theory, the order parameter is analytically determined at large times in the rough phase. The mechanism allowing the breakdown of this phase as the distance from criticality increases emerges from the theory.", "url": "https://arxiv.org/abs/2607.26662", "type": "理论", "summary": "我们考虑二维量子伊辛模型自发破缺对称性下界面的酉时间演化。该界面是由在空间维度之一的两个简并基态之间插值的初始条件引起的。插值保持通用，以便研究后期动态对初始条件的依赖性。利用体理论渐近准粒子态的基础，在粗相中多次解析地确定序参数。理论中出现了随着距临界点距离的增加而允许该阶段崩溃的机制。", "authors": [{"name": "Georgios Kampanis"}, {"name": "Marianna Sorba"}, {"name": "Gesualdo Delfino"}], "featured_authors": [{"name": "Georgios Kampanis"}, {"name": "Marianna Sorba"}, {"name": "Gesualdo Delfino"}], "author_count": 3}, {"id": "2607.26667", "category": "cond-mat", "title": "Computational Study of Water Adsorption and Dissociative Mechanisms Impacting g-C3N4's Optical and Electronic Properties", "abstract": "In the quest for sustainable energy solutions, water splitting emerges as a crucial process for generating clean hydrogen a versatile and renewable fuel essential for energy storage, emissions reduction, and achieving sustainability goals. This study employs a comprehensive computational approach, utilizing atomistic simulations to systematically investigate the effects of water absorption on the electronic and optical properties of g-C3N4 nanosheets. Our methodology integrates ab initio computations grounded in density functional theory (DFT), which allows for a detailed characterization of the nanosheet and serves as a benchmark for self-consistent charge density functional tight binding (SCC-DFTB) simulations. This approach provides valuable insights into the behavior of the nanosheet under the influence of absorbed OH and H2O molecules by considering calculated parameters for photocatalytic efficiency. Additionally, we extend our investigation to classical molecular dynamics simulations within the ReaxFF framework, modeling the emission of multiple H2O molecules and assessing the subsequent rate of H2 evolution. A key finding of our study reveals that the dissociation of H2O into HO and O molecules significantly enhances both the optical absorbance and conductance of the nanosheet compared to its pristine state. These results underscore the potential of g-C3N4 nanosheets as effective materials for water splitting applications.", "url": "https://arxiv.org/abs/2607.26667", "type": "理论+数值", "summary": "在寻求可持续能源解决方案的过程中，水分解成为产生清洁氢气的关键过程，而清洁氢气是能源存储、减少排放和实现可持续发展目标所必需的多功能可再生燃料。本研究采用综合计算方法，利用原子模拟系统地研究吸水率对 g-C3N4 纳米片电子和光学性质的影响。我们的方法集成了基于密度泛函理论 (DFT) 的从头计算，它允许对纳米片进行详细表征，并作为自洽电荷密度泛函紧密结合 (SCC-DFTB) 模拟的基准。该方法通过考虑光催化效率的计算参数，为了解纳米片在吸收的 OH 和 H2O 分子影响下的行为提供了有价值的见解。此外，我们将研究扩展到 ReaxFF 框架内的经典分子动力学模拟，对多个 H2O 分子的发射进行建模并评估随后的 H2 演化速率。\n\n我们研究的一个重要发现表明，与原始状态相比，H2O 解离成 H2O 和 O 分子显着增强了纳米片的光学吸光度和电导率。这些结果强调了 g-C3N4 纳米片作为水分解应用的有效材料的潜力。", "authors": [{"name": "Amil Aligayev"}, {"name": "Ulkar Jabbarli"}, {"name": "F. Javier Domınguez-Gutierrez"}, {"name": "Ulkar Samadova"}, {"name": "Jialin Li"}, {"name": "Stefanos Papanikolaou"}, {"name": "Qing Huang"}], "featured_authors": [{"name": "Amil Aligayev"}, {"name": "Ulkar Jabbarli"}, {"name": "F. Javier Domınguez-Gutierrez"}, {"name": "Jialin Li"}, {"name": "Stefanos Papanikolaou"}, {"name": "Qing Huang"}], "author_count": 7}, {"id": "2607.26676", "category": "cond-mat", "title": "Electronically Inactive Intercalated La$_2$NiO$_4$ Layer in Superconducting La$_5$Ni$_3$O$_{11}$", "abstract": "The recent discovery of superconductivity in La$_5$Ni$_3$O$_{11}$ extends the family of superconducting Ruddlesden--Popper nickelates beyond La$_3$Ni$_2$O$_7$. Unlike conventional members of a single Ruddlesden--Popper series, La$_5$Ni$_3$O$_{11}$ contains an intercalated La$_2$NiO$_4$ layer between La$_3$Ni$_2$O$_7$ blocks, raising the question of whether this additional layer participates in the low-energy electronic structure. Here, we combine density functional theory, Wannier-based tight-binding modeling, and rotationally invariant slave-boson calculations to investigate the electronic role of the intercalated layer. We find that realistic electronic parameters place the La$_2$NiO$_4$ layer in gapped insulating regimes rather than a paramagnetic metallic state. Furthermore, realistic interlayer hybridization fails to generate any appreciable La$_2$NiO$_4$-derived spectral weight at the Fermi level. Our results demonstrate that the low-energy electronic structure of La$_5$Ni$_3$O$_{11}$ is governed primarily by the La$_3$Ni$_2$O$_7$ block, with the intercalated La$_2$NiO$_4$ layer remaining electronically inactive. This establishes a minimal low-energy description of La$_5$Ni$_3$O$_{11}$ and provides a unified framework for understanding superconductivity in intercalated Ruddlesden--Popper nickelates.", "url": "https://arxiv.org/abs/2607.26676", "type": "理论+数值", "summary": "最近在 La$_5$Ni$_3$O$_{11}$ 中发现的超导性将超导 Ruddlesden-Popper 镍酸盐系列扩展到 La$_3$Ni$_2$O$_7$ 之外。与单个 Ruddlesden--Popper 系列的传统成员不同，La$_5$Ni$_3$O$_{11}$ 在 La$_3$Ni$_2$O$_7$ 块之间包含插入的 La$_2$NiO$_4$ 层，引发了这个附加层是否参与低能电子结构的问题。在这里，我们结合密度泛函理论、基于 Wannier 的紧束缚模型和旋转不变从玻色子计算来研究插层的电子作用。我们发现，实际的电子参数将 La$_2$NiO$_4$ 层置于有间隙的绝缘状态，而不是顺磁金属状态。此外，现实的层间杂化无法在费米能级产生任何明显的 La$_2$NiO$_4$ 衍生光谱权重。我们的结果表明，La$_5$Ni$_3$O$_{11}$ 的低能电子结构主要由 La$_3$Ni$_2$O$_7$ 块控制，插入的 La$_2$NiO$_4$ 层保持电子不活跃。\n\n这建立了 La$_5$Ni$_3$O$_{11}$ 的最小低能描述，并为理解插层 Ruddlesden-Popper 镍酸盐中的超导性提供了统一的框架。", "authors": [{"name": "Tianyang Xie"}, {"name": "Yuxin Wang"}, {"name": "Zhan Wang"}, {"name": "Kun Jiang"}, {"name": "Jiangping Hu"}], "featured_authors": [{"name": "Tianyang Xie"}, {"name": "Yuxin Wang"}, {"name": "Zhan Wang"}, {"name": "Kun Jiang"}, {"name": "Jiangping Hu"}], "author_count": 5}, {"id": "2607.26678", "category": "cond-mat", "title": "Quantum Brownian transport in a correlated Gaussian force", "abstract": "We study a classical system-bath model in which a system particle is linearly coupled to a bath of harmonic oscillators. In a system subject to white and correlated Gaussian noises, we derive an expression for the joint probability density, and the mean squared values of the system-bath particles are calculated. For white noise, the mean squared values of the system-bath particles exhibit an anomalous time dependence, which is different from that of normal diffusion. In particular, for a correlated Gaussian noise, the mean squared displacement and mean squared velocity of the bath particle show superspreading growths of $t^5$ and $t^3$ in $t{\\ll}{\\tau}$, respectively. When ${\\tau}=0$, the mean squared velocity of a quantum particle under random noise is proportional to $t$, while the mean squared velocity of a bath particle in the presence of correlated Gaussian noise increases in proportion to $t^2$. This anomalous transport phenomenon results from the mixed derivative structure of the master equation, which couples with the transport coordinates in the diffusion dynamics of the relative coordinates. This result shows that the removal of dissipation in the Caldeira-Leggett framework leads to fundamentally different transport mechanisms characterized by non-diffusive quantum diffusion.", "url": "https://arxiv.org/abs/2607.26678", "type": "理论", "summary": "我们研究了一个经典的系统浴模型，其中系统粒子线性耦合到谐振子浴。在受白噪声和相关高斯噪声影响的系统中，我们推导了联合概率密度的表达式，并计算了系统浴粒子的均方值。对于白噪声，系统浴粒子的均方值表现出反常的时间依赖性，这与正常扩散的不同。特别是，对于相关高斯噪声，浴粒子的均方位移和均方速度分别在 $t{\\ll}{\\tau}$ 中显示出 $t^5$ 和 $t^3$ 的超扩散增长。当${\\tau}=0$时，随机噪声下量子粒子的均方速度与$t$成正比，而在相关高斯噪声存在下，浴粒子的均方速度与$t^2$成正比增加。这种反常输运现象是由主方程的混合导数结构引起的，该结构与相对坐标的扩散动力学中的输运坐标耦合。\n\n这一结果表明，卡尔代拉-莱格特框架中耗散的消除导致了以非扩散量子扩散为特征的根本不同的传输机制。", "authors": [{"name": "Yun Jeong Kang"}, {"name": "Seungsik Min"}, {"name": "Sung Kyu Seo"}, {"name": "Kyungsik Kim"}], "featured_authors": [{"name": "Yun Jeong Kang"}, {"name": "Seungsik Min"}, {"name": "Sung Kyu Seo"}, {"name": "Kyungsik Kim"}], "author_count": 4}, {"id": "2607.26747", "category": "cond-mat", "title": "Fluctuation force induced by quenched random polarizations", "abstract": "We investigate the zero-temperature behavior of the fluctuation force induced by random electric dipoles that are frozen into a material and incapable of fluctuating thermally. Examples of such materials are relaxor ferroelectrics. In terms of the setup and geometry, we focus on a layered system comprising two coplanar semi-infinite slabs separated by a distance $\\ell$ as well as a system comprising a neutral atom in the vacuum located at a distance $\\ell$ above the surface of a semi-infinite slab. For both systems, we consider the cases where the quenched random dipolar disorder occurs inside the bulk as well as on the surface of the slabs. In all of these cases, we find that the bulk (surface) dipolar disorder-induced fluctuation force grows with the mean square quenched electric dipole moment per unit volume (area). The bulk (surface) dipolar disorder-induced fluctuation pressure between two semi-infinite single-layered slabs decays with $\\ell^{-3}$ ($\\ell^{-4}$), whereas the bulk (surface) dipolar disorder-induced fluctuation force on an atom in the vacuum near a slab containing the disorder decays with $\\ell^{-4}$ ($\\ell^{-5}$). We also find that the quenched dipolar disorder-induced fluctuation force between two coplanar slabs can be repulsive and serve to enhance the ``nanolevitation effect\" in a three-layered dielectric system that obeys the Dzyaloshinskii-Lifshitz-Pitaevskii condition.", "url": "https://arxiv.org/abs/2607.26747", "type": "理论", "summary": "我们研究了随机电偶极子引起的波动力的零温度行为，这些偶极子被冻结在材料中并且无法热波动。这种材料的例子是弛豫铁电体。在设置和几何形状方面，我们重点关注由两个相隔距离 $\\ell$ 的共面半无限板组成的分层系统，以及由位于半无限板表面上方距离 $\\ell$ 的真空中的中性原子组成的系统。对于这两个系统，我们考虑了淬火随机偶极无序发生在块体内以及板表面上的情况。在所有这些情况下，我们发现体（表面）偶极无序引起的波动力随着每单位体积（面积）的均方猝灭电偶极矩而增长。两个半无限单层板之间的体（表面）偶极无序引起的涨落压力随着 $\\ell^{-3}$ ($\\ell^{-4}$) 衰减，而包含无序板附近的真空中原子上的体（表面）偶极无序引起的涨落压力随着 $\\ell^{-4}$ ($\\ell^{-5}$) 衰减。\n\n我们还发现，两个共面板之间的淬灭偶极无序引起的涨落力可能是排斥的，并且有助于增强遵守 Dzyaloshinskii-Lifshitz-Pitaevskii 条件的三层介电系统中的“纳米悬浮效应”。", "authors": [{"name": "Bing-Sui Lu"}], "featured_authors": [{"name": "Bing-Sui Lu"}], "author_count": 1}, {"id": "2607.26793", "category": "cond-mat", "title": "High-dimensional theory of the glass transition revisited: hopping and local defects", "abstract": "The replicated liquid theory provides a microscopic mean-field description of the glass transition by combining the density functional theory of liquids with the replica method originally developed for spin glasses. In the conventional replica liquid theory, a glassy state is described by assuming that particles in different replicas undergo vibrational motion around common centers of mass, thereby forming molecules that contain one particle from every replica. Here we revisit this assumption by allowing each molecule to contain only a subset of replicas. This generalized formulation describes particle-level replica mismatches, which may be associated with non-vibrational motions such as particle hopping. We apply the theory to high-dimensional hard and harmonic spheres, where the mean-field description is expected to become exact. For hard spheres, replica mismatches destabilize the glassy metastable state and shift the dynamical transition to a significantly higher packing fraction, while leaving the leading thermodynamic glass transition unchanged. The resulting transition density agrees, at leading order in high dimensions, with the recent rigorous lower bound for random sphere packings obtained by Campos, Jenssen, Michelen, and Sahasrabudhe by using a discretized version of greedy Random Sequential Absorption, suggesting an algorithmic interpretation of the transition: grandcanonical dynamics is more efficient in high dimensional spaces than canonical one. For harmonic spheres at finite temperature, the glassy state contains a finite replica-mismatch fraction even at the thermodynamic ideal-glass transition, thereby shifting the transition point from that predicted by the conventional replica ansatz.", "url": "https://arxiv.org/abs/2607.26793", "type": "理论+数值", "summary": "复制液体理论通过将液体的密度泛函理论与最初为自旋玻璃开发的复制方法相结合，提供了玻璃化转变的微观平均场描述。在传统的复制液体理论中，玻璃态是通过假设不同复制品中的粒子围绕共同质心进行振动运动来描述的，从而形成包含每个复制品中的一个粒子的分子。在这里，我们通过允许每个分子仅包含复制品的子集来重新审视这一假设。这个广义公式描述了粒子级复制品失配，这可能与非振动运动（例如粒子跳跃）相关。我们将该理论应用于高维硬球和调和球，其中平均场描述预计会变得准确。对于硬球，复制失配会破坏玻璃态亚稳态的稳定性，并将动态转变转变为显着更高的堆积分数，同时保持领先的热力学玻璃化转变不变。\n\n由此产生的跃迁密度在高维的前序上与 Campos、Jenssen、Michelen 和 Sahasrabudhe 使用贪婪随机顺序吸收的离散化版本获得的随机球体堆积的最新严格下界一致，这表明对跃迁的算法解释：大正则动力学在高维空间中比正则动力学更有效。对于有限温度下的谐波球体，即使在热力学理想玻璃化转变下，玻璃态也包含有限的复制失配分数，从而使转变点偏离传统复制模拟预测的转变点。", "authors": [{"name": "Harukuni Ikeda"}, {"name": "Francesco Zamponi"}], "featured_authors": [{"name": "Harukuni Ikeda"}, {"name": "Francesco Zamponi"}], "author_count": 2}, {"id": "2607.26869", "category": "cond-mat", "title": "Microscopic Emergence of Ancilla Lattice Physics in the Emery Model", "abstract": "We derive a controlled low-energy effective theory for the three-band Emery model on the Lieb lattice near (n=2) filling. Starting from the positive charge-transfer regime, a sequence of Schrieffer--Wolff transformations rigorously establishes a direct microscopic mapping onto an ancillary lattice structure. For realistic cuprate-like parameters, this framework naturally reproduces the conventional Fermi-liquid (FL) phase at a filling shifted by one electron per site. Our analysis identifies the precise microscopic conditions required to access the exotic fractionalized Fermi-liquid (FL$^*$) phase. We show that realizing FL$^*$ requires nonstandard cuprate parameter regimes together with additional interactions that stabilize a quantum spin liquid in the background ancilla layer. These results establish a microscopic foundation for ancilla physics in multiorbital materials and clarify the conditions for realizing FL$^*$. We discuss the possibility to replicate ancilla model physics in Lieb lattice cold atom simulations.", "url": "https://arxiv.org/abs/2607.26869", "type": "理论+数值", "summary": "我们推导了接近 (n=2) 填充的 Lieb 晶格上的三能带 Emery 模型的受控低能有效理论。从正电荷转移体系开始，一系列施里弗-沃尔夫变换严格建立了到辅助晶格结构的直接微观映射。对于现实的类铜酸盐参数，该框架自然地在每个位点移动一个电子的填充处再现了传统的费米液相（FL）。我们的分析确定了获得奇异的分级费米液体 (FL$^*$) 相所需的精确微观条件。我们表明，实现 FL$^*$ 需要非标准铜酸盐参数体系以及稳定背景辅助层中的量子自旋液体的额外相互作用。这些结果为多轨道材料的辅助物理奠定了微观基础，并阐明了实现FL$^*$的条件。我们讨论了在利布晶格冷原子模拟中复制辅助模型物理的可能性。", "authors": [{"name": "Mikołaj Walicki"}, {"name": "Johannes Knolle"}, {"name": "Krzysztof Wohlfeld"}], "featured_authors": [{"name": "Mikołaj Walicki"}, {"name": "Johannes Knolle"}, {"name": "Krzysztof Wohlfeld"}], "author_count": 3}, {"id": "2607.26875", "category": "cond-mat", "title": "Squirming motion near corrugated surfaces", "abstract": "Swimming microorganisms often operate in complex confinement, where an interplay of long-ranged hydrodynamic interactions and a short-ranged repulsive interaction can give rise to interesting dynamical behaviors. Here, we theoretically investigate the trajectories of microswimmers - modeled as squirmers - in the presence of periodic boundaries. The latter modify their swimming velocity, leading to behaviors that differ qualitatively from swimming near planar walls. Using a perturbative approach based on bispherical coordinates and the Lorentz reciprocal theorem, we characterize the interaction between a squirmer and a periodic surface in the limit of small surface amplitude and systematically explore its dependence on the boundary corrugation wavelength, squirmer type, orientation, and swimmer-surface distance. Most importantly, our results reveal that pullers become trapped in the valley of the surface corrugations, in contrast to their sliding motion near planar walls. Furthermore, the near-surface dynamics of pushers display oscillations, reflecting the periodicity of the surface structure. A tilt of the swimmer orientation with respect to the surface corrugations results in a wave-length dependent drift that sorts pushers from pullers. These findings highlight the impact of hydrodynamic interactions in shaping microswimmer transport near structured boundaries with potential implications for microbiological phenomena, such as biofilm formation, and technological applications.", "url": "https://arxiv.org/abs/2607.26875", "type": "理论", "summary": "游泳的微生物通常在复杂的限制中运行，其中长程流体动力学相互作用和短程排斥相互作用的相互作用可以产生有趣的动力学行为。在这里，我们从理论上研究了在存在周期性边界的情况下微型游泳者（建模为蠕动者）的轨迹。后者改变了它们的游泳速度，导致其行为与在平面墙壁附近游泳有本质上的不同。使用基于双球坐标和洛伦兹倒数定理的微扰方法，我们在小表面振幅的限制下表征了蠕动体和周期性表面之间的相互作用，并系统地探索了其对边界波纹波长、蠕动体类型、方向和游动体-表面距离的依赖性。最重要的是，我们的结果表明，拉拔器被困在表面波纹的山谷中，这与它们在平面壁附近的滑动运动形成鲜明对比。此外，推动器的近表面动力学显示出振荡，反映了表面结构的周期性。\n\n游动器方向相对于表面波纹的倾斜会导致波长相关的漂移，从而将推动器与拉动器分类。这些发现强调了水动力相互作用对塑造微型游泳器在结构边界附近的运输的影响，对微生物现象（例如生物膜形成）和技术应用具有潜在影响。", "authors": [{"name": "Sagnik Garai"}, {"name": "Thomas G. Fai"}, {"name": "Christina Kurzthaler"}], "featured_authors": [{"name": "Sagnik Garai"}, {"name": "Thomas G. Fai"}, {"name": "Christina Kurzthaler"}], "author_count": 3}, {"id": "2607.26881", "category": "cond-mat", "title": "Crystal forming ability of amorphous refractory metals under nanoindentation: a molecular dynamics study", "abstract": "Amorphous refractory metal coatings combine high hardness with chemical inertness, yet their metastability makes them prone to mechanically induced crystallisation (devitrification) under contact loading, and how readily such a glass re-orders to its parent body centred cubic (bcc) crystal is unknown across the refractory series. We prepared amorphous V, Nb, Mo, Ta and W by melt quenching to 300 K, validated each interatomic potential against ab initio liquid radial distribution functions, and probed them by large scale molecular dynamics nanoindentation. Indentation drives a localised amorphous to bcc transformation by bulk nucleation, growth and coalescence. A crystal forming ability (CFA), the maximum slope of the sigmoidal bcc fraction versus depth curve, spans about a factor of four and decreases as V > Mo > Nb > Ta > W; it falls with indenter velocity as CFA $\\propto v^{-m}$ with a mean exponent of 1.08, so CFA$\\cdot v$ is nearly constant and the transformation rate is almost velocity independent. Transforming atoms carry excess non affine displacement and local shear strain, not hydrostatic pressure, marking a shear associated displacive pathway; the bulk driving force is largest for the most resistant element, W, so resistance tracks cohesive bond strength rather than the thermodynamic driving force. Early bcc like order sets the sharpness and depth of the transition, whereas the mechanical work to half transformation sets the persistent nucleus density. A grain population balance links nucleation, growth and coalescence to a terminal microstructure whose completeness does not follow the CFA order.", "url": "https://arxiv.org/abs/2607.26881", "type": "数值", "summary": "非晶态耐火金属涂层结合了高硬度和化学惰性，但它们的亚稳定性使它们在接触载荷下容易发生机械诱导结晶（反玻璃化），并且这种玻璃如何容易地重新排序为其母体心立方（bcc）晶体在整个耐火材料系列中尚不清楚。我们通过熔融淬火至 300 K 制备了非晶态 V、Nb、Mo、Ta 和 W，验证了每个原子间势与从头液体径向分布函数的关系，并通过大规模分子动力学纳米压痕对其进行了探测。压痕通过块体成核、生长和聚结驱动局部非晶态向体立方晶格转变。晶体形成能力 (CFA)，即 S 形 bcc 分数与深度曲线的最大斜率，跨度约为四倍，并随着 V > Mo > Nb > Ta > W 而减小；它随压头速度下降为 CFA $\\propto v^{-m}$，平均指数为 1.08，因此 CFA$\\cdot v$ 几乎恒定，并且转变速率几乎与速度无关。\n\n转变原子携带过量的非仿射位移和局部剪切应变，而不是静水压力，标志着与剪切相关的位移路径；对于最具抵抗力的元素 W，体积驱动力最大，因此抵抗力跟踪内聚粘合强度而不是热力学驱动力。早期的 bcc 样顺序设置了转变的锐度和深度，而半变换的机械功设置了持久的核密度。晶粒数量平衡将成核、生长和聚结与终端微观结构联系起来，其完整性不遵循 CFA 顺序。", "authors": [{"name": "Prashant Dwivedi"}, {"name": "Alberto Fraile"}, {"name": "Tomas Polcar"}], "featured_authors": [{"name": "Prashant Dwivedi"}, {"name": "Alberto Fraile"}, {"name": "Tomas Polcar"}], "author_count": 3}, {"id": "2607.26920", "category": "cond-mat", "title": "Boundary-Driven Anisotropic Coarsening in Conserved Phase Separation", "abstract": "Universal scaling in phase separation is typically assumed to be isotropic in systems with conserved dynamics. Here we show that boundary forcing alone can break this dynamical scaling symmetry, leading to anisotropic coarsening, with different effective global growth laws observed parallel and perpendicular to the boundary. We consider a ternary mixture with two conserved components and a passive species undergoing surface evaporation, which provides a simple setting to investigate this effect. In this case, evaporation leads to a progressive mass loss and to the formation of macroscopic concentration gradients, which, in turn, drive anisotropic coarsening, with different effective growth laws observed parallel and perpendicular to the boundary. At the same time, bulk regions appear to retain the standard Model B scaling, suggesting that the observed anisotropy is mainly induced by boundary fluxes rather than by changes in the intrinsic dynamics. Our results indicate that boundary conditions can play an important role in breaking scaling symmetry and may offer a way to influence coarsening behavior in nonequilibrium phase separation.", "url": "https://arxiv.org/abs/2607.26920", "type": "理论", "summary": "在具有守恒动力学的系统中，相分离中的通用标度通常被认为是各向同性的。在这里，我们表明，仅边界强迫就可以打破这种动态尺度对称性，导致各向异性粗化，在平行和垂直于边界的情况下观察到不同的有效全局生长定律。我们考虑具有两种保守组分和一种经历表面蒸发的被动物质的三元混合物，这为研究这种效应提供了一个简单的设置。在这种情况下，蒸发导致逐渐的质量损失并形成宏观浓度梯度，这反过来又驱动各向异性粗化，平行和垂直于边界观察到不同的有效生长规律。同时，块体区域似乎保留了标准模型 B 尺度，这表明观察到的各向异性主要是由边界通量引起的，而不是由内在动力学的变化引起的。我们的结果表明，边界条件在打破尺度对称性方面可以发挥重要作用，并且可能提供一种影响非平衡相分离中的粗化行为的方法。", "authors": [{"name": "Emilio N.M. Cirillo"}, {"name": "Nicklas Jävergård"}, {"name": "Adrian Muntean"}, {"name": "Stela Andrea Muntean"}], "featured_authors": [{"name": "Emilio N.M. Cirillo"}, {"name": "Nicklas Jävergård"}, {"name": "Adrian Muntean"}, {"name": "Stela Andrea Muntean"}], "author_count": 4}, {"id": "2607.26938", "category": "cond-mat", "title": "Symmetry-Selective Strain Control of Anisotropic Magnetic Response in a Silicon FinFET Double Quantum Dot", "abstract": "Strain naturally develops in three-dimensional quantum-dot structures such as silicon FinFETs during fabrication and cooling. Such strain becomes especially important in a double quantum dot, because the two dots can experience different local strain and therefore acquire different magnetic responses. To understand how this dot-to-dot strain difference affects coupled hole spins, we theoretically study the local \\(g\\) tensors of a silicon FinFET double quantum dot by combining a three-dimensional Poisson--Schrödinger calculation based on a six-band \\(k\\!\\cdot\\!p\\) model with configuration interaction. We find that the effect of strain depends on both its tensor component and its spatial symmetry. For the diagonal components \\(\\epsilon_{yy}\\) and \\(\\epsilon_{zz}\\), strain mainly changes the principal \\(g\\) values, with only a small opening of the maximum-response axes. In contrast, the shear component \\(\\epsilon_{yz}\\) can also change the orientation of the local magnetic response. When the strain profile preserves the transverse mirror symmetry, the shear-induced rotation is strongly suppressed. Breaking this local constraint permits a pronounced off-diagonal response and rotates the principal magnetic axes. The same component- and symmetry-selected trends appear in a Zeeman-only calculation, showing that the valence-band Zeeman coupling is sufficient to generate them, while the full Hamiltonian determines their quantitative expression. Together, these results show how the tensor component and spatial symmetry of strain can be used to control both the magnitude and orientation of the magnetic response in coupled hole-spin qubits.", "url": "https://arxiv.org/abs/2607.26938", "type": "理论+数值", "summary": "在制造和冷却过程中，硅 FinFET 等三维量子点结构中自然会产生应变。这种应变在双量子点中变得尤其重要，因为两个点可以经历不同的局部应变并因此获得不同的磁响应。为了了解点与点之间的应变差异如何影响耦合空穴自旋，我们通过将基于六能带 \\(k\\!\\cdot\\!p\\) 模型的三维泊松-薛定谔计算与构型相互作用相结合，从理论上研究了硅 FinFET 双量子点的局部 \\(g\\) 张量。我们发现应变的影响取决于其张量分量及其空间对称性。对于对角分量 \\(\\epsilon_{yy}\\) 和 \\(\\epsilon_{zz}\\)，应变主要改变主 \\(g\\) 值，仅最大响应轴有很小的开口。相反，剪切分量 \\(\\epsilon_{yz}\\) 也可以改变局部磁响应的方向。当应变分布保持横向镜像对称性时，剪切引起的旋转被强烈抑制。\n\n打破这个局部约束允许明显的非对角响应并旋转主轴。相同的分量和对称性选择趋势出现在仅塞曼计算中，表明价带塞曼耦合足以生成它们，而完整的哈密顿量决定了它们的定量表达式。这些结果共同表明了如何使用张量分量和应变的空间对称性来控制耦合空穴自旋量子位中磁响应的大小和方向。", "authors": [{"name": "Yuze Lu"}, {"name": "Xiaoyan Liu"}, {"name": "Fei Liu"}], "featured_authors": [{"name": "Yuze Lu"}, {"name": "Xiaoyan Liu"}, {"name": "Fei Liu"}], "author_count": 3}, {"id": "2607.26974", "category": "cond-mat", "title": "Two-magnon scattering in the framework of the Lippmann-Schwinger equation", "abstract": "Controlling magnetic losses requires identifying the microscopic origin of extrinsic linewidth broadening. We introduce a Lippmann--Schwinger framework for two-magnon scattering from weak defect potentials, showing that scattering is set by the overlap between the perturbation of the effective field and degenerate spin-wave states. Applied to iron garnet films, YIG/GGG(111) and YIG/GGG(110), we identify crystallographic directions along which these perturbation are elongated. This approach provides a link between the crystallography, effective field on the sample scale and two-magnon scattering.", "url": "https://arxiv.org/abs/2607.26974", "type": "理论", "summary": "控制磁损耗需要识别外在线宽展宽的微观根源。我们引入了用于弱缺陷势的双磁振子散射的李普曼-施温格框架，表明散射是由有效场扰动和简并自旋波态之间的重叠决定的。应用于铁石榴石薄膜，YIG/GGG(111) 和 YIG/GGG(110)，我们确定了这些扰动被拉长的晶体方向。这种方法提供了晶体学、样品尺度上的有效场和双磁振子散射之间的联系。", "authors": [{"name": "Jorge Marquez Chavez"}, {"name": "Ondřej Wojewoda"}, {"name": "Yixuan Song"}, {"name": "Geoffrey S. D. Beach"}, {"name": "Caroline A. Ross"}], "featured_authors": [{"name": "Jorge Marquez Chavez"}, {"name": "Ondřej Wojewoda"}, {"name": "Yixuan Song"}, {"name": "Geoffrey S. D. Beach"}, {"name": "Caroline A. Ross"}], "author_count": 5}, {"id": "2607.26986", "category": "cond-mat", "title": "Theory of phonon-magnon hybridization and angular momentum in CrI$_3$ and CrBr$_3$", "abstract": "In magnetic materials angular momentum can be mediated by different carriers, including electrons, magnons, and phonons. The magnons can interact with circularly polarized phonons which are close in energy, provided specific symmetry conditions are met. If the interaction is strong enough the phonons and magnons shift in frequency and start to mix to form hybrid magneto-elastic quasi-particles. In this paper, we develop a constrained Hamiltonian framework which incorporates hybrid stiffness matrices and Berry curvatures. We quantify the degree of hybridization between phonons and magnons (up to 8% in CrI$_3$ and 25% in CrBr$_3$) using a decomposition of the total energy, which is a generalization of the norm decomposition for atomic contributions to phonons used in the literature. We also explore how the total angular momentum is conserved but shared between the phononic and magnonic subsystems upon hybridization.", "url": "https://arxiv.org/abs/2607.26986", "type": "理论", "summary": "在磁性材料中，角动量可以由不同的载流子介导，包括电子、磁子和声子。如果满足特定的对称条件，磁振子可以与能量接近的圆偏振声子相互作用。如果相互作用足够强，声子和磁振子的频率会发生变化并开始混合形成混合磁弹性准粒子。在本文中，我们开发了一个约束哈密顿框架，其中结合了混合刚度矩阵和贝里曲率。我们使用总能量分解来量化声子和磁振子之间的杂化程度（CrI$_3$ 中高达 8%，CrBr$_3$ 中高达 25%），这是文献中使用的原子对声子贡献的范数分解的概括。我们还探讨了总角动量如何守恒，但在杂交时如何在声子和声子子系统之间共享。", "authors": [{"name": "Maxime Mignolet"}, {"name": "Miquel Royo"}, {"name": "Massimiliano Stengel"}, {"name": "Matthieu J. Verstreate"}], "featured_authors": [{"name": "Maxime Mignolet"}, {"name": "Miquel Royo"}, {"name": "Massimiliano Stengel"}, {"name": "Matthieu J. Verstreate"}], "author_count": 4}, {"id": "2607.26992", "category": "cond-mat", "title": "Generation of representative powder particle packing in 2D/3D: which tool for which application?", "abstract": "Although dense sphere packings serve as the initial state for simulations in powder metallurgy, additive manufacturing and granular physics, the choice of a packing generator is rarely guided by a systematic benchmark. A representative packing must be (i)-(ii) physically admissible (non-overlapping particles in gravitational equilibrium); (iii) faithful to the target particle size distribution (PSD); (iv) representative in relative density Phi; and (v) computationally affordable. Four open-source tools have been benchmarked, meeting (i)-(ii) by construction: the sequential DR (dropping-and-rolling) and its densified variant DR-ME, and the discrete element method (DEM) codes LAMMPS (gravity) and dp3D (isostatic compression). Across four configurations (2D/3D lognormal, 3D bimodal, and a 3D domain-size study), they are compared against an industrial MIM-grade powder, with PSD fidelity measured by the bin-width-independent Hellinger distance and Phi against the feedstock solid loading (phi_exp = 0.62, by Archimedes' method). In 3D, the DEM codes reach the densest packings but run more than three orders of magnitude slower: for approximatively 20 000 particles, DR shows a 9% phi shortfall relative to dp3D while running 1800x faster. These idealised model packings yield application-driven tool-selection guidelines.", "url": "https://arxiv.org/abs/2607.26992", "type": "理论+数值", "summary": "尽管致密球堆积是粉末冶金、增材制造和颗粒物理学中模拟的初始状态，但堆积生成器的选择很少受到系统基准的指导。代表性填料必须是 (i)-(ii) 物理上可接受的（重力平衡中颗粒不重叠）； (iii) 忠实于目标粒度分布 (PSD)； (iv) 代表相对密度 Phi； (v) 计算上负担得起。四个开源工具已经进行了基准测试，通过构造满足 (i)-(ii)：顺序 DR（掉落和滚动）及其致密变体 DR-ME，以及离散元方法 (DEM) 代码 LAMMPS（重力）和 dp3D（等静压）。在四种配置（2D/3D 对数正态、3D 双峰和 3D 域尺寸研究）中，它们与工业 MIM 级粉末进行比较，PSD 保真度通过与箱宽无关的海林格距离和 Phi 与原料固体负载进行测量（phi_exp = 0.62，通过阿基米德方法）。\n\n在 3D 中，DEM 代码达到最密集的堆积，但运行速度慢了三个数量级以上：对于大约 20 000 个粒子，DR 显示相对于 dp3D 的 phi 缺口为 9%，同时运行速度快 1800 倍。这些理想化的模型封装产生了应用驱动的工具选择指南。", "authors": [{"name": "Antoine Tainturier"}, {"name": "Louis Lemarquis"}, {"name": "Victor Szczepan"}, {"name": "Marc Bernacki"}], "featured_authors": [{"name": "Antoine Tainturier"}, {"name": "Louis Lemarquis"}, {"name": "Victor Szczepan"}, {"name": "Marc Bernacki"}], "author_count": 4}, {"id": "2607.27000", "category": "cond-mat", "title": "On the robustness of noisy solutions in non-convex neural networks", "abstract": "Optimization in non-convex neural network models is strongly influenced by the geometry of the solution space: sparse, isolated, point-like clusters are typically algorithmically inaccessible, whereas wide and flat regions can be found efficiently despite being relatively rare. At zero temperature this picture has been formalized in binary perceptrons through the overlap gap property (OGP), which limits algorithmic access to configurations with zero training error above a critical constraint density $\\alpha_{\\rm OGP}$. Here we extend this description to finite temperature, where a positive training error is allowed and statistically penalized. We first show that the frozen one-step replica-symmetry-breaking solution, dominating the zero temperature equilibrium measure, survives at any finite temperature. We furthermore derive a general criterion, based on the smoothness of the single-pattern Gibbs weight near the decision boundary, that determines when a finite-temperature relaxation of the loss removes freezing. We then extend the OGP construction to finite temperature and show that dense, algorithmically accessible regions of finite-energy configurations persist beyond $\\alpha_{\\rm OGP}$, up to a threshold $\\alpha_{\\rm OGP}(\\epsilon)$ that grows with the allowed training error $\\epsilon$. Finally, in the teacher-student setting, we show that these wide, finite-energy regions still retain good generalization. Using a finite energy message-passing algorithm, we demonstrate numerically that thermal noise enables effective generalization in the regime of constraint densities where both recovering the teacher and finding a zero temperature solution are computationally hard.", "url": "https://arxiv.org/abs/2607.27000", "type": "理论+数值", "summary": "非凸神经网络模型的优化很大程度上受到解空间几何形状的影响：稀疏、孤立、点状的簇通常在算法上无法访问，而宽而平坦的区域尽管相对罕见，但可以有效地找到。在零温度下，该图像已通过重叠间隙属性 (OGP) 在二进制感知器中形式化，该属性限制了算法对零训练误差配置的访问，高于临界约束密度 $\\alpha_{\\rm OGP}$。在这里，我们将此描述扩展到有限温度，其中允许正训练误差并在统计上受到惩罚。我们首先证明，冻结的一步复制对称破缺解在零温度平衡测量中占主导地位，在任何有限温度下都能生存。我们还基于决策边界附近单模式吉布斯权重的平滑度得出了一个通用标准，该标准确定了损失的有限温度松弛何时消除冻结。\n\n然后，我们将 OGP 构造扩展到有限温度，并表明有限能量配置的密集、算法可访问区域持续超出 $\\alpha_{\\rm OGP}$，直至达到阈值 $\\alpha_{\\rm OGP}(\\epsilon)$，该阈值随着允许的训练误差 $\\epsilon$ 而增长。最后，在师生环境中，我们表明这些宽广的、有限能量的区域仍然保留了良好的泛化能力。使用有限能量消息传递算法，我们以数值方式证明热噪声能够在约束密度范围内进行有效泛化，在该范围内恢复教师和找到零温度解在计算上都是困难的。", "authors": [{"name": "Enrico M. Malatesta"}, {"name": "Alessandra Passalacqua"}, {"name": "Riccardo Zecchina"}], "featured_authors": [{"name": "Enrico M. Malatesta"}, {"name": "Alessandra Passalacqua"}, {"name": "Riccardo Zecchina"}], "author_count": 3}, {"id": "2607.27061", "category": "cond-mat", "title": "Neural variational framework for random Young-diagram limit shapes", "abstract": "We develop a structure-preserving neural variational framework for random Young-diagram ensembles, with representations adapted to the structure and scaling of each measure. The method is validated on the Plancherel, uniform, minimal-difference, and fixed-\\(q\\) \\(q\\)-Plancherel ensembles, using known asymptotic profiles only for post-training comparison. We then study a quartically deformed hook-length ensemble without assuming an analytical saddle shape. Large-\\(n\\) neural profiles are compared with finite-size MAP profiles obtained from exact-action searches and with mean profiles obtained from corner-transfer Metropolis--Hastings sampling. Increasing the deformation suppresses the leading rows and broadens the support, while the neural, discrete, and sampled mean profiles agree at the percent level. These results provide numerical evidence for a deformation-dependent macroscopic saddle family.", "url": "https://arxiv.org/abs/2607.27061", "type": "数值", "summary": "我们为随机杨图集成开发了一个结构保持神经变分框架，其表示适应每个度量的结构和尺度。该方法在 Plancherel、均匀、最小差异和固定-\\(q\\) \\(q\\)-Plancherel 系综上进行了验证，仅使用已知的渐近剖面进行训练后比较。然后，我们研究了四次变形的钩长度系综，而不假设分析鞍形。将大型\\(n\\)神经分布与从精确动作搜索获得的有限大小MAP分布以及从角转移Metropolis-Hastings采样获得的平均分布进行比较。增加变形会抑制前导行并扩大支撑，而神经分布、离散分布和采样平均分布在百分比水平上一致。这些结果为变形相关的宏观鞍座族提供了数值证据。", "authors": [{"name": "Qian Chen"}, {"name": "Bo-Xuan Ge"}], "featured_authors": [{"name": "Qian Chen"}, {"name": "Bo-Xuan Ge"}], "author_count": 2}, {"id": "2607.27067", "category": "cond-mat", "title": "A Degenerate Singlet-Triplet Qubit with All-Electrical Orthogonal Control", "abstract": "Singlet-triplet qubits offer an attractive encoding for semiconductor quantum computing, combining ancilla-free readout, reduced sensitivity to common-mode noise, and baseband voltage control. However, the Zeeman energy difference $\\Delta E_\\mathrm{Z}$ is typically fixed by local magnetic field gradients or $g$-factor inhomogeneities, leaving the exchange interaction $J$ as the only dynamically tunable parameter. This always-on $\\Delta E_\\mathrm{Z}$ precludes orthogonal control of the qubit's rotation axes and introduces unwanted state rotations during idling. Here we demonstrate all-electrical orthogonal control of a degenerate singlet-triplet (DST) qubit formed by two hole spins in a germanium double quantum dot. Exploiting the electrically tunable anisotropic $g$-factors of the two spins, we identify a regime where both $\\Delta E_\\mathrm{Z}$ and $J$ vanish, making the $S$ and $T_0$ states degenerate at the idle point. By applying only baseband voltage pulses, we independently control both $J$ and $\\Delta E_\\mathrm{Z}$, enabling fully orthogonal $Z$- and $X$-axis rotations. Randomized benchmarking yields an average physical single-qubit gate fidelity of 99.53\\% for a gate duration of approximately 100 ns. Finally, we electrically tune the degenerate point across a wide range of magnetic field orientations, enabling operation in a regime of enhanced coherence time and offering a route towards multi-qubit scaling under a shared global magnetic field.", "url": "https://arxiv.org/abs/2607.27067", "type": "理论", "summary": "单线态-三线态量子位为半导体量子计算提供了一种有吸引力的编码，结合了无辅助读出、降低的共模噪声灵敏度和基带电压控制。然而，塞曼能量差 $\\Delta E_\\mathrm{Z}$ 通常由局部磁场梯度或 $g$ 因子不均匀性固定，从而使交换相互作用 $J$ 作为唯一动态可调参数。这种始终开启的 $\\Delta E_\\mathrm{Z}$ 排除了对量子位旋转轴的正交控制，并在空闲期间引入了不需要的状态旋转。在这里，我们演示了对由锗双量子点中的两个空穴自旋形成的简并单重态-三重态（DST）量子位的全电正交控制。利用两个自旋的电可调各向异性 $g$ 因子，我们确定了 $\\Delta E_\\mathrm{Z}$ 和 $J$ 都消失的状态，使得 $S$ 和 $T_0$ 状态在空闲点退化。通过仅施加基带电压脉冲，我们独立控制 $J$ 和 $\\Delta E_\\mathrm{Z}$，从而实现完全正交的 $Z$ 轴和 $X$ 轴旋转。\n\n随机基准测试产生的平均物理单量子位门保真度为 99.53%，门持续时间约为 100 ns。最后，我们在广泛的磁场方向上电调节简并点，从而能够在增强的相干时间范围内运行，并提供在共享全局磁场下实现多量子位缩放的途径。", "authors": [{"name": "Phuong X. Nguyen"}, {"name": "Konstantinos Tsoukalas"}, {"name": "Jann H. Ungerer"}, {"name": "Julian Santen"}, {"name": "Valentin John"}, {"name": "Stefan D. Oosterhout"}, {"name": "Lucas Stehouwer"}, {"name": "Stefano Bosco"}, {"name": "Giordano Scappucci"}, {"name": "Menno Veldhorst"}, {"name": "Amir Yacoby"}], "featured_authors": [{"name": "Phuong X. Nguyen"}, {"name": "Konstantinos Tsoukalas"}, {"name": "Jann H. Ungerer"}, {"name": "Giordano Scappucci"}, {"name": "Menno Veldhorst"}, {"name": "Amir Yacoby"}], "author_count": 11}, {"id": "2607.27079", "category": "cond-mat", "title": "Twist-driven helical flattening in nematic elastomer cylinders", "abstract": "Liquid Crystal elastomers (LCEs) deform anisotropically along a prescribed nematic director field, making them promising candidates for programmable shape change. Existing studies have primarily focused on either director patterns on flat sheets or simple patterns on curved geometries, leaving the case of a non-trivial director on a non-trivial geometry still largely unexplored. Many biological systems, however, have both complex geometries and complex helical fiber architectures. To explore the interplay between director and underlying geometry, we use a non-Euclidean plate theory for nematic elastomers with a through-thickness twisted director to develop an effective 2D model. With a fixed twist angle, our model shows an anomalous coupling between mid-surface curvature and director twist. This emergent term arises from the interplay between orientational order and elasticity, and dominates traditional bending contributions. To illustrate the general theory, we study the stability of cylindrical shapes with through-thickness twist. We find that the cylinder is unstable to a long-wavelength helical flattening mode and determine the critical parameter for the onset of instabilities.", "url": "https://arxiv.org/abs/2607.27079", "type": "理论", "summary": "液晶弹性体（LCE）沿着规定的向列导向场各向异性变形，这使得它们成为可编程形状变化的有希望的候选者。现有的研究主要集中在平板上的导向图案或弯曲几何形状上的简单图案，而在非平凡几何形状上的非平凡导向的情况在很大程度上仍未被探索。然而，许多生物系统都具有复杂的几何形状和复杂的螺旋纤维结构。为了探索导向器和底层几何形状之间的相互作用，我们使用具有全厚度扭曲导向器的向列弹性体的非欧几里得板理论来开发有效的二维模型。在固定扭转角的情况下，我们的模型显示了中面曲率和导向器扭转之间的异常耦合。这个新兴术语源于取向顺序和弹性之间的相互作用，并主导着传统的弯曲贡献。为了说明一般理论，我们研究了具有全厚度扭曲的圆柱形形状的稳定性。我们发现圆柱体对于长波长螺旋压扁模式是不稳定的，并确定了不稳定发生的关键参数。", "authors": [{"name": "Alexia Chatzitheodorou"}, {"name": "Christian D. Santangelo"}], "featured_authors": [{"name": "Alexia Chatzitheodorou"}, {"name": "Christian D. Santangelo"}], "author_count": 2}, {"id": "2607.27086", "category": "cond-mat", "title": "Angular Momentum Transfer in Magnetic Weyl Semimetal Spheres", "abstract": "In this work, we investigate the problem of electromagnetic angular momentum within the framework of topological materials, described by axion electrodynamics. Specifically, we calculate the electromagnetic angular momentum for a spherical sample of magnetic Weyl semimetal in the presence of a point charge. We then analyze how, by moving the point charge quasi-statically, the angular momentum stored in the electromagnetic field can be converted into mechanical angular momentum of the sphere. Finally, we derive analytical expressions for the resulting angular velocity and angular displacement, demonstrating that the effect is enhanced in the Weyl semimetal compared with a topological insulator.", "url": "https://arxiv.org/abs/2607.27086", "type": "理论", "summary": "在这项工作中，我们研究了拓扑材料框架内的电磁角动量问题，由轴子电动力学描述。具体来说，我们计算了存在点电荷的情况下磁性外尔半金属球形样品的电磁角动量。然后我们分析如何通过准静态移动点电荷，将电磁场中存储的角动量转换为球体的机械角动量。最后，我们推导了所得角速度和角位移的解析表达式，证明与拓扑绝缘体相比，Weyl 半金属的效果得到了增强。", "authors": [{"name": "Adriano Biondo"}, {"name": "Francesco M. D. Pellegrino"}], "featured_authors": [{"name": "Adriano Biondo"}, {"name": "Francesco M. D. Pellegrino"}], "author_count": 2}, {"id": "2607.27104", "category": "cond-mat", "title": "Dual Enhancement of Superconductivity in FeSe/SrTiO3 via Orbital and Correlation Synergy", "abstract": "In iron-based superconductors, the dz2 orbital band typically resides far below the Fermi level and has not been considered to participate in Cooper pairing. Here, using monolayer FeSe/SrTiO3 as a model system, we demonstrate that tip-induced tensile strain controllably shifts the dz2 band toward the Fermi level, driving a two-stage enhancement of superconductivity. In-plane lattice expansion first enhances electronic correlation, amplifying superconductivity in the initial stage. As strain further increases, the upward-shifted dz2 band hybridizes with the dxy band, reconstructing the pairing-active d-orbital bands and inducing a secondary, stronger gap enhancement. Collectively, these two stages enlarge the superconducting gap from 17.8 to 23.6 meV. Throughout this process, invariant Fermi wave vectors confirm that the enhancement originates from band renormalization and reconstruction rather than carrier doping. Our work establishes a route to tailor superconducting states via strain-activated electronic correlations and band engineering, and reveals a previously unrecognized orbital-selective pairing mechanism with broad implications for correlated multiband superconductors.", "url": "https://arxiv.org/abs/2607.27104", "type": "理论", "summary": "在铁基超导体中，dz2 轨道带通常远低于费米能级，并且不被认为参与库珀配对。在这里，我们使用单层 FeSe/SrTiO3 作为模型系统，证明尖端引起的拉伸应变可控制地将 dz2 能带移向费米能级，从而驱动超导性的两阶段增强。面内晶格膨胀首先增强了电子相关性，在初始阶段增强了超导
