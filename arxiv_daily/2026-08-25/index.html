 implementations, high-fidelity single-qubit gates are achieved using micromagnets, which enable the use of electric spin dipole resonance via synthetic spin-orbit coupling (s-SOC). In contrast, intrinsic spin-orbit coupling (i-SOC) in silicon is generally considered to be weak. However, in Si/SiGe heterostructures, theory predicts a substantial enhancement when the Zeeman splitting approaches the valley splitting if symmetry is reduced by an imperfect interface. Here, we demonstrate a Si/SiGe Loss-DiVincenzo qubit driven by i-SOC close to this so-called spin-valley hotspot. In particular, we characterize the Rabi frequency as a function of the energy detuning from the hotspot by sweeping both the magnetic field and quantum dot position. We observe the predicted enhancement of the Rabi frequency near the hotspot, but also find an asymmetry that deviates from existing theoretical models as well as distortions of the Chevron patterns near the hotspot. While we achieve an average single-qubit Clifford fidelity of 98.6 %, the strong variability of the valley splitting may impede the use of i-SOC-based control as a scalable operational strategy; understanding its effect is nevertheless important for reproducible high-fidelity control. Our results provide an empirical basis for refining current theoretical models of spin-valley physics in Si/SiGe heterostructures.", "url": "https://arxiv.org/abs/2608.23246", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexander Willmes"}, {"name": "Max Oberländer"}, {"name": "Max Beer"}, {"name": "Denny Dütz"}, {"name": "Jhih-Sian Tu"}, {"name": "Stefan Trellenkamp"}, {"name": "Marco Lisker"}, {"name": "Felix Reichmann"}, {"name": "Lars R. Schreiber"}, {"name": "Hendrik Bluhm"}], "featured_authors": [{"name": "Alexander Willmes"}, {"name": "Max Oberländer"}, {"name": "Max Beer"}, {"name": "Felix Reichmann"}, {"name": "Lars R. Schreiber"}, {"name": "Hendrik Bluhm"}], "author_count": 10}, {"id": "2608.23381", "category": "cond-mat", "title": "FUCrIMODo: structure recovery from atomistic descriptors via multi-stage genetic algorithms", "abstract": "Data-driven approaches to materials discovery rely on numerical representations of atomic structures as input for machine learning models. Inverting these descriptors - recovering atomic structures from their representations - is essential for most generative material design pipelines, yet it remains challenging, particularly for periodic systems. Existing inversion methods are either tailored to specific invertible descriptors or require candidate structures with similar atomic arrangements and compositions, limiting the exploration of novel regions in chemical and configurational space. Here, we propose a generalizable, similarity-driven sampling approach, powered by a novel stage-wise optimization strategy, to recover atom types, atomic positions, and unit cell shapes directly from a descriptor. Our approach requires only descriptor features and parameters as input without any prior structural knowledge. The capability of our method is demonstrated by the averaged Smooth Overlap of Atomic Positions (SOAP) descriptor.", "url": "https://arxiv.org/abs/2608.23381", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Louis Boehm"}, {"name": "Martin Kuban"}, {"name": "Claudia Draxl"}], "featured_authors": [{"name": "Louis Boehm"}, {"name": "Martin Kuban"}, {"name": "Claudia Draxl"}], "author_count": 3}, {"id": "2608.23403", "category": "cond-mat", "title": "The principle of detailed balance between electrons and phonons in presence of excitonic effects", "abstract": "Based on a many-body formulation, we derive an electron-phonon coupling including excitonic effects that preserves thermodynamic detailed balance between electronic and phononic scattering processes. We start from the microscopic electron-nucleus Hamiltonian, expand around the Born-Oppenheimer equilibrium geometry, and construct an effective action for the electronic and phononic propagators. From the same effective action, we derive both electronic and phononic self-energies in terms of a nonlocal vertex $\\mathcal G^{\\textrm{s}}$ including excitonic effects, which generalizes the usual local interaction vertex $g^{\\textrm{s}}$. When electrons and phonons are well-defined quasiparticles in the screened-exchange approximation and $\\mathcal G^{\\textrm{s}}$ is taken in its static limit, both self-energies reduce to Fermi-golden-rule expressions containing the same $\\mathcal G^{\\textrm{s}}$, thereby ensuring detailed balance. As an application, we compute electronic and phononic linewidths in graphene and illustrate this common-vertex construction. We analyze the competition between the reduced scattering phase space induced by the screened-exchange band structure and the enhancement of the electron-phonon vertex due to excitonic effects, finding that the vertex enhancement can compensate for and overcome the phase-space reduction in both electronic and phononic linewidths.", "url": "https://arxiv.org/abs/2608.23403", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alberto Guandalini"}, {"name": "Giovanni Caldarelli"}, {"name": "Francesco Mauri"}, {"name": "Francesco Macheda"}], "featured_authors": [{"name": "Alberto Guandalini"}, {"name": "Giovanni Caldarelli"}, {"name": "Francesco Mauri"}, {"name": "Francesco Macheda"}], "author_count": 4}, {"id": "2608.23442", "category": "cond-mat", "title": "Interaction-mediated Co-existence of Altermagnetism and Topology", "abstract": "We study an extended Hubbard model on Lieb lattice at electron filling 2 and 4, and demonstrate that the interactions lead to the simultaneous emergence of altermagnetic order and a topological gap. Using unrestricted Hartree-Fock theory, we evaluate both the altermagnetic and topological order parameters and show that they co-exist with an associated quantum spin Hall effect in a large region of the phase diagram, which we further support using exact diagonalization. Moreover, we demonstrate that inversion-symmetry breaking terms can also mediate second-order topological phases with associated corner modes.", "url": "https://arxiv.org/abs/2608.23442", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jasmin Bedow"}, {"name": "Nitin Kaushal"}, {"name": "Marcel Franz"}], "featured_authors": [{"name": "Jasmin Bedow"}, {"name": "Nitin Kaushal"}, {"name": "Marcel Franz"}], "author_count": 3}, {"id": "2608.23455", "category": "cond-mat", "title": "Cramer-Rao Inequality Generalizes the Equilibrium Energy Fluctuation-Response Relation to Nonequilibrium Steady States", "abstract": "Equilibrium steady states are fully characterized by the Boltzmann distribution, which depends only on the energy and the temperature. In contrast, nonequilibrium steady states, which describe a wide range of physical and biological phenomena, are generically much more complex, and their stationary distributions can depend on a zoo of kinetic parameters. A central challenge of nonequilibrium statistical mechanics is the identification of universal relations that hold for nonequilibrium steady states despite this complexity. We show here that a form of the Cramer-Rao inequality applies to arbitrary nonequilibrium steady-state distributions and contains no explicit dependence on kinetic parameters. A main original feature in our observation is that this inequality becomes a well-known fluctuation-response relation in equilibrium. The inequality involves three well-defined quantities: the fluctuations of the energy, the response given by the derivative of the average energy with respect to the inverse temperature, and the Fisher information with respect to the inverse temperature. We illustrate this inequality using three representative models: an active particle in a harmonic potential, a simple scheme for kinetic proofreading, and a one-dimensional model for heat conduction between two baths.", "url": "https://arxiv.org/abs/2608.23455", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shaofan Liu"}, {"name": "Raphael Chetrite"}, {"name": "Andre C. Barato"}], "featured_authors": [{"name": "Shaofan Liu"}, {"name": "Raphael Chetrite"}, {"name": "Andre C. Barato"}], "author_count": 3}, {"id": "2608.23510", "category": "cond-mat", "title": "Large Jahn-Teller shifts and splittings observed in halide perovskite CsPbBr3", "abstract": "Despite the fundamental role of Jahn-Teller effects of first and second order in shaping structural and electronic properties, there is hardly any observation in angle-resolved photoemission of solids. In oxide and halide perovskites, band structure replicas have occasionally been reported as fingerprints of Jahn-Teller effects, but no accompanying energy shifts or splittings that would allow a conclusion about their origin. In CsPbBr3, we uncover both key signatures: Upon cooling, orthorhombic replica bands emerge which had eluded earlier studies. This includes an extra valence band maximum at {\\Gamma} which can even be distinguished at room temperature. Most importantly, band narrowing along {\\Gamma}-M, a splitting at {\\Gamma}, and the lifting of degeneracy between nonequivalent M points, all of several 100 meV, become apparent. Temperature-dependent x-ray diffraction, used as input for band structure calculations, links these effects directly to tilts and rotations of the PbBr6 octahedra. Our results uncover a strong electron-lattice interaction which is at the heart of so-far unresolved questions concerning polaronic transport, dynamic disorder, and exciton trapping in halide perovskites.", "url": "https://arxiv.org/abs/2608.23510", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Maryam Sajedi"}, {"name": "Maxim Krivenkov"}, {"name": "Dmitry Marchenko"}, {"name": "Saleem Ayaz Khan"}, {"name": "Andrei Varykhalov"}, {"name": "Jaime Sánchez-Barriga"}, {"name": "Daniel M. Többens"}, {"name": "Thomas Unold"}, {"name": "Ján Minár"}, {"name": "Oliver Rader"}], "featured_authors": [{"name": "Maryam Sajedi"}, {"name": "Maxim Krivenkov"}, {"name": "Dmitry Marchenko"}, {"name": "Thomas Unold"}, {"name": "Ján Minár"}, {"name": "Oliver Rader"}], "author_count": 10}, {"id": "2608.23519", "category": "cond-mat", "title": "Run-and-tumble particles with preferred reorientation", "abstract": "Run-and-tumble particles (RTPs) are canonically modeled with uniform reorientation probabilities, an assumption that breaks down for many biological microswimmers. In this work, we investigate the dynamics of RTPs with arbitrary non-uniform tumble distributions. By deriving an exact Doi-Peliti field theory, we explicitly calculate a wide array of spatial and orientational observables. Notably, we demonstrate that the spatial dynamics exhibit an effective persistence and chirality governed entirely by the first Fourier modes of the tumble distribution, establishing a formal mapping to the dynamics of chiral active Brownian particles. Furthermore, our field-theoretic framework provides a systematic method to compute spatial moments to arbitrary order, allowing for the complete characterization and identification of complex tumbling dynamics. We illustrate the framework with wrapped Gaussian and bimodal Gaussian distributions, demonstrating explicit control over persistence and chirality. We further extend the field theory to $d$ dimensions, recovering the mean squared displacement in terms of a single effective tumble rate. Our results establish a direct link between the shape of the tumble distribution and the emergent dynamics, and provide a foundation for the study of interacting RTPs with non-uniform reorientation.", "url": "https://arxiv.org/abs/2608.23519", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Callum Britton"}, {"name": "Ziluo Zhang"}, {"name": "Seongjun Han"}, {"name": "Thibault Bertrand"}], "featured_authors": [{"name": "Callum Britton"}, {"name": "Ziluo Zhang"}, {"name": "Seongjun Han"}, {"name": "Thibault Bertrand"}], "author_count": 4}, {"id": "2608.23533", "category": "cond-mat", "title": "Non-Abelian Spin Counting of Ordered Stochastic Trajectories: Reentrant Finite-Time Chern Numbers", "abstract": "Conventional full counting statistics assigns commuting phases to integrated stochastic currents and therefore resolves net transport but not, in general, the temporal ordering of events associated with different cycles. We introduce a non-Abelian counting construction in which crossings of two fundamental cycles rotate an auxiliary spin about different axes. The resulting ordered trajectory statistic has an exact finite-dimensional evolution equation for its first moment. The two rotation angles form a counting torus, and whenever the mean spin is nonzero its normalized direction defines a map $\\mathbb T^2\\to\\mathbb S^2$, equivalently a complex eigenline bundle with a Chern number. Our main analytical result is a Chern--parity correspondence. Reflection symmetry equips this eigenline with a real structure and expresses $C_T\\bmod2$ through first Stiefel--Whitney classes on the circles fixed by reflection. When the transverse polarization has no additional zeros along the reflection-fixed circles, these classes reduce to ordinary current-parity statistics at the four high-symmetry counting points. For a five-state nonequilibrium figure-eight network, varying only the observation time produces four polarization-gap closings and the reentrant sequence $C_T=0\\to-1\\to0\\to-1\\to0$. Every transition occurs at $(\\pi,\\pi)$ and coincides with a sign reversal of $\\mathbb E[(-1)^{Q_1+Q_2}]$, while the full integer Chern number is obtained independently from the two-dimensional spin texture. Finite observation time can therefore organize a fixed stochastic process into distinct topological sectors of its ordered path ensemble.", "url": "https://arxiv.org/abs/2608.23533", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yangyang Du"}], "featured_authors": [{"name": "Yangyang Du"}], "author_count": 1}, {"id": "2608.23556", "category": "cond-mat", "title": "Quaternionic Hermitian Band Geometry in Four Dimensions: Realization on $S^4$ and Obstruction on $T^4$", "abstract": "We establish a realization-obstruction dichotomy for quaternionic Hermitian band geometry in four-dimensional parameter spaces: the minimal-charge lowest Landau level on $S^{4}$ provides a global realization, whereas an everywhere nondegenerate saturated realization induced by a single occupied quaternionic band is obstructed on $T^{4}$. An antiunitary symmetry $\\mathcal{J}$ satisfying $\\mathcal{J}^{2}=-1$ makes the occupied doublet a quaternionic band. Within this setting, we formulate the quaternionic Wirtinger inequality as a band-geometric bound involving the quantum metric and the second Chern density. At every nondegenerate saturation point, the canonical geometry of the quaternionic projective space pulls back to a compatible quaternionic structure on the parameter space; if these conditions hold everywhere, the parameter space acquires quaternionic Hermitian band geometry. On $S^{4}$, we express the minimal-charge states as quaternionic Perelomov coherent states and establish everywhere nondegenerate saturation, thereby realizing quaternionic Hermitian band geometry. On $T^{4}$, by contrast, a minimal four-band system saturates the inequality everywhere, but topology forces the quantum metric to become degenerate somewhere, obstructing a globally induced quaternionic structure. An explicit lattice Dirac Hamiltonian exhibits this obstruction. Adding unoccupied bands cannot remove this obstruction when the inequality is saturated everywhere, since the image of any nondegenerate saturated projector remains confined to a fixed $\\mathbb{H}P^{1}$. These results provide a symmetry-aware framework for non-Abelian band geometry and show how parameter-space topology constrains the global realization of quaternionic Hermitian band geometry.", "url": "https://arxiv.org/abs/2608.23556", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dongju Hwang"}, {"name": "Minjae Yu"}, {"name": "Gil Young Cho"}], "featured_authors": [{"name": "Dongju Hwang"}, {"name": "Minjae Yu"}, {"name": "Gil Young Cho"}], "author_count": 3}, {"id": "2608.23560", "category": "cond-mat", "title": "Spinor condensate persistent currents in an atomtronic Josephson necklace", "abstract": "The investigation of superflow in multi-junction Josephson circuits is currently a leading frontier of physics research, probing the fundamental manifestations of macroscopic phase coherence and enabling applications to quantum simulation, metrology and computing. In this work, we extensively investigate the stability and dynamics of persistent currents of a spinor atomic Bose-Einstein condensate on a ring with multiple Josephson junctions. Specifically, we examine the effects of positive and negative interspecies interactions, co- and counter-rotation, population and Manakov asymmetry, as well as Rabi coupling on the persistent currents carried by the two components. Our analysis reveals that the presence of a second species offers multiple mechanisms for unprecedented manipulation of supercurrents on the ring, including phase-slip engineering, stability control, current-inversion switching and supercurrent pumping. Our study provides a roadmap for the engineering of persistent currents in binary ring condensates in necklace potentials, with significant implications for atomtronics, matter-wave interferometry and sensing using atomic Bose gases.", "url": "https://arxiv.org/abs/2608.23560", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sayan Chatterjee"}, {"name": "Nalinikanta Pradhan"}, {"name": "Rina Kanamoto"}, {"name": "M. Bhattacharya"}, {"name": "Pankaj Kumar Mishra"}], "featured_authors": [{"name": "Sayan Chatterjee"}, {"name": "Nalinikanta Pradhan"}, {"name": "Rina Kanamoto"}, {"name": "M. Bhattacharya"}, {"name": "Pankaj Kumar Mishra"}], "author_count": 5}, {"id": "2608.21511", "category": "hep-th", "title": "String stars, small black holes, and the supersymmetric index", "abstract": "We discuss aspects of the black hole-string transition as the angular velocity approaches the supersymmetric index $\\beta \\Omega = 2\\pi i$. In this limit, the high-temperature Atick-Witten effective description breaks down. For Heterotic string theory, a new high-temperature description emerges near the index in terms of a Higgsed $SU(2)_L\\times U(1)_R$ supergravity with a magnetic field profile. The Hagedorn instability manifests in the theory as Ambjorn-Olesen W boson condensation, due to the background magnetic field. For type II, a tower of winding strings becomes light near the index, which opens up a new dimension in the T-dual picture. In both cases, a string star solution is found, similar to the Horowitz-Polchinski solution, but decouples at the index $\\beta \\Omega = 2\\pi i$. Considering charged solutions, the string star appears to interpolate between charged black holes and the free string phase. At the index, both the charged black hole and the charged string star phases decouple. This suggests a tension between a smooth black hole-string transition and the existence of a stringy BPS two-charge black hole.", "url": "https://arxiv.org/abs/2608.21511", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Erez Y. Urbach"}], "featured_authors": [{"name": "Erez Y. Urbach"}], "author_count": 1}, {"id": "2608.21518", "category": "hep-th", "title": "On flat space limits of $AdS_4$ black holes", "abstract": "With a view towards understanding flat space holography, we study the flat space limit of asymptotically $AdS_4$ black holes in gauged $\\mathcal{N}=2$ supergravity. Using holographic renormalisation, we carefully analyse the flat space limit of the on-shell action of various black holes in this setting and make explicit the states that contribute to the partition function in this limit. We find several features: large black holes lead to a divergence in the partition function which can be understood as a thermodynamic volume divergence. Meanwhile, semiclassically, small black holes reproduce the partition function of their flat space counterparts, and we clarify the mapping between BPS, (near-)extremal or non-extremal black holes on both sides for charged and rotating solutions. Finally, by studying a suitable flat limit of the BPS Kerr-Newman-$AdS_4$ black hole in M-theory, we obtain a charged BPS solution in flat space. On the dual side, we determine a Carrollian-like limit on the known ABJM partition function on $S^1\\times S^2$ at large $N$, and show that it reproduces the correct entropy of the BPS charged black hole in asymptotically flat space.", "url": "https://arxiv.org/abs/2608.21518", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pedro Vicente Marto"}, {"name": "Shradha Ramakrishnan"}, {"name": "Stefan Vandoren"}], "featured_authors": [{"name": "Pedro Vicente Marto"}, {"name": "Shradha Ramakrishnan"}, {"name": "Stefan Vandoren"}], "author_count": 3}, {"id": "2608.21523", "category": "hep-th", "title": "What Neural Network Field Theory Can and Cannot Realise on a Computer", "abstract": "One aim of neural network field theory is to put a quantum or effective field theory on a computer, with the network ensemble itself as the theory. We ask how far that aim can be pushed for a function class regular enough to be computed with. Our main result is a no-go theorem with assumptions that hold for standard network architectures. We use it to separate four versions of neural network field theory, according to whether the defining object is the finite width ensemble or its infinite width limit, and whether the target we want to compute is a quantum or an effective field theory. Neither finite width interpretation is straightforwardly consistent. For finite width ensembles with finite variance at each point, the QFT interpretation fails reflection positivity, while the EFT interpretation establishes no scale separation by which the positivity violation can be placed outside its domain of validity. Of the two limit versions, one can be simulated in full and the other only in part, as only its smeared correlators are computable with a controlled error. As such, at the level of a controlled numerical computation, the QFT and EFT versions cannot be distinguished. One dimension escapes the obstruction, yet reflection positivity is shown to still fail there at every finite width for the cosine network. Two escapes from the theorem remain, giving up either finite variance at a point or exact rotation invariance, and we discuss both of these possibilities.", "url": "https://arxiv.org/abs/2608.21523", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Thomas R. Harvey"}], "featured_authors": [{"name": "Thomas R. Harvey"}], "author_count": 1}, {"id": "2608.21588", "category": "hep-th", "title": "Neural Network Field Theory at Finite Width", "abstract": "Under mild assumptions, any quantum mechanical (QM) model or quantum field theory (QFT) admits a representation in terms of an ensemble of neural networks with countably many random parameters. We investigate the features of NN-QM and NN-FT models with finitely many parameters, such as a feedforward network of width $N < \\infty$. We find that, generically, such models must violate one of the properties of conventional Euclidean QFTs, such as reflection positivity or cluster decomposition. We present several complementary ways of understanding which features can and cannot be preserved at finite $N$, both in QM and in QFT.", "url": "https://arxiv.org/abs/2608.21588", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Christian Ferko"}, {"name": "Aaron Mutchler"}], "featured_authors": [{"name": "Christian Ferko"}, {"name": "Aaron Mutchler"}], "author_count": 2}, {"id": "2608.21613", "category": "hep-th", "title": "One-Loop Quantum Correction to the Kink Mass in a Lorentz-Violating Scalar Field Theory", "abstract": "We study the radiative correction to the mass of the $(1+1)$-dimensional $\\lambda\\phi^4$ kink in the presence of an irreducible, spacelike Lorentz-violating interaction. The Lorentz-violating operator is chosen as $-\\frac12 c\\phi^2(u\\!\\cdot\\!\\partial\\phi)^2$ with $u^\\mu=(0,1)$, which is the lowest-order single-scalar operator considered in this class of models that produces effects that cannot be removed by a linear redefinition of coordinates or the field. We perform the one-loop renormalization of the underlying quantum field theory. In contrast with Lorentz-invariant $\\lambda\\phi^4$ theory in two dimensions, the Lorentz-violating theory requires, at this order, both a modified mass counterterm and a nonzero field-strength counterterm. The corrected stability problem contains modified bound and continuum modes, while the continuum phase shift remains unchanged at $O(c)$ with the boundary-condition prescription adopted here. Finally, using the vacuum-subtracted zero-point energy and the counterterm Hamiltonian, we obtain the one-loop kink mass through first order in $c$. We give the finite coefficient in the subtraction prescription implemented in the accompanying thesis calculation, for which the Lorentz-violating contribution is numerically negative.", "url": "https://arxiv.org/abs/2608.21613", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Reza Moazzemi"}], "featured_authors": [{"name": "Reza Moazzemi"}], "author_count": 1}, {"id": "2608.21798", "category": "hep-th", "title": "Heterotic string couplings at order $α'^3$ in NS-NS sector", "abstract": "We utilize the standard T-duality procedure to derive the classical effective action of heterotic string theory at the eight-derivative order within the NS-NS sector, which comprises the metric, the \\(B\\)-field, and the dilaton. Starting from the minimal basis at this order, consisting of 872 even-parity and 477 odd-parity couplings, we perform a dimensional reduction on a circle and impose invariance under T-duality transformations, specifically the Buscher rules supplemented by higher-derivative corrections. This invariance uniquely fixes a subset of the couplings to match those of type II theory up to an overall factor, while the remaining couplings are determined in terms of the coefficients at order \\(\\alpha'\\). For these latter couplings, we adopt both the Metsaev-Tseytlin and Meissner schemes. Subsequently, through field redefinitions, we recast the action into a canonical form in which the dilaton appears solely through the overall factor \\(e^{-2\\Phi}\\). In the Meissner scheme, the pure gravity sector precisely reproduces the known S-matrix results. In both schemes, the pure gravity terms can be expressed as the double trace \\((\\Tr(R^2))^2\\), and when combined with the corresponding Yang-Mills terms \\((\\Tr(F^2))^2\\), they take the unified form \\((\\Tr(R^2-F^2))^2\\), as anticipated in the literature.", "url": "https://arxiv.org/abs/2608.21798", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alireza Pahlavan"}, {"name": "Mehdi Ameri"}, {"name": "Mohammad R. Garousi"}], "featured_authors": [{"name": "Alireza Pahlavan"}, {"name": "Mehdi Ameri"}, {"name": "Mohammad R. Garousi"}], "author_count": 3}, {"id": "2608.21865", "category": "hep-th", "title": "Characteristic-cone running from on-shell residues: Identifiability on the physical EFT quotient", "abstract": "We formulate a data-completeness test for extracting low-energy characteristic-cone running from flat-space on-shell renormalization-group residues. In four-dimensional, parity-even Einstein--scalar--Maxwell effective field theory through four derivatives and four external fields, Wilson directions are first placed on the physical EFT quotient and background propagation is represented by a traceless response on the full massless root sector. The response is identifiable from chosen amplitude coordinates precisely when the amplitude kernel lies in the response kernel. For the published opposite-helicity vector--scalar residue we find $\\beta_\\mu C_{\\gamma\\phi}^{(2)}=-55/(96\\pi^2)$ and, after an order-reduced frame translation, the contribution $\\beta_\\mu(r_T-r_\\gamma)=-55/(48\\pi^2M_{\\rm P}^4)$. A finite operator registry gives explicit rank-two incompleteness tests: independent $F^4$ directions split photon polarizations on a magnetic background, while $\\mathcal CFF$ produces an analytic splitting along a principal Weyl axis on a Petrov-I Einstein--scalar background. For the isolated scalar--photon contact, direct Schur reduction finds nonzero raw mixing but no first-order physical off-diagonal entry, by the Maxwell Ward identity. Thus the residue fixes one diagonal cone contribution but does not determine the term-complete characteristic response over the declared admissible coefficient domain.", "url": "https://arxiv.org/abs/2608.21865", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Renat Gafarov"}], "featured_authors": [{"name": "Renat Gafarov"}], "author_count": 1}, {"id": "2608.21947", "category": "hep-th", "title": "Perturbative Reconstruction of Self-Adjoint Generators from Bosonic Canonical Commutation Relations: Application to the Null-Surface Formulation", "abstract": "We study the inverse adjoint problem for a perturbative bosonic outgoing map. Within the polynomial bosonic canonical-commutation-relation (CCR) algebra, we prove a constructive integrability theorem: order-by-order preservation of the CCRs is sufficient to reconstruct recursively a formal self-adjoint generator whose exponential implements the outgoing map by adjoint conjugation. At each order, the Baker--Campbell--Hausdorff contribution determined by previously reconstructed generators is subtracted from the outgoing coefficient, and the remaining homogeneous CCR conditions determine the next generator explicitly. We apply the construction to graviton scattering in the null-surface formulation (NSF), specialized to the flat solution-space sector with Minkowski metric, null generators, affine parameter, and cone measure. The NSF outgoing map preserves the Ashtekar radiative CCRs through (\\delta a_3), corresponding to order (\\varepsilon^2). At this order, the scalar CCR sector uniquely selects the symmetric ordering (c=1) for the nontrivial interacting kernel. The associated linear contraction, generated by the same cubic kernel, cancels the double-contraction contribution from ([\\delta a_2,\\delta a_2^\\dagger]). The theorem then reconstructs the self-adjoint generators (\\delta T_1) and (\\delta T_2), providing a formal perturbative unitary implementation. The resulting canonical organization also separates the direct (2\\to2) contribution into irreducible-loop, one-particle-reducible, and factorized sectors.", "url": "https://arxiv.org/abs/2608.21947", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "C. N. Kozameh"}], "featured_authors": [{"name": "C. N. Kozameh"}], "author_count": 1}, {"id": "2608.22013", "category": "hep-th", "title": "Holographic SU(3) color superconductivity at finite baryon chemical potential", "abstract": "We present a holographic model of SU(3) color superconductivity (CSC) where a global color symmetry is spontaneously broken by a diquark condensate at finite baryon chemical potential. At $\\mu_b=0$, a systematic stability analysis over all SU(3) channels recovers the known SU(2) s+p competition. Based on that, the finite $\\mu_b$ further generalizes the s-wave order to an S1+iS2 structure. We find that $\\mu_b$ enhances the critical temperature of the S1+iS2 phase while suppressing the p-wave -- the latter vanishes beyond a certain $\\mu_b$ when backreaction is included. This opposite trend reshapes the phase diagram: with increasing $\\mu_b$, the balanced S+ phase (S1=S2) takes over the entire color-superconducting region. Our non-Abelian framework provides a concrete holographic description of global SU(3) symmetry breaking, relevant for understanding color-superconducting phases in dense QCD and may offer new insights into the physics of neutron-star interiors.", "url": "https://arxiv.org/abs/2608.22013", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xin Zhao"}, {"name": "Zhang-Yu Nie"}, {"name": "Ya-Peng Hu"}], "featured_authors": [{"name": "Xin Zhao"}, {"name": "Zhang-Yu Nie"}, {"name": "Ya-Peng Hu"}], "author_count": 3}, {"id": "2608.22469", "category": "hep-th", "title": "Thermal propagator of the bosons and fermions fields", "abstract": "In a thermodynamic environment, thermal field theory (TFT) describes a large ensemble of interacting particles. This may appear to be the same as in classical statistical mechanics. Therefore, we study the scalar propagator and fermion propagator by considering an arbitrary parameter $\\sigma$ that allows for a path integral description in real-time formalism (RTF). We constructed those propagators which allowed us to know how particles moved from one point to another point in momentum space as well as in mixed space, at finite temperature without a chemical potential.", "url": "https://arxiv.org/abs/2608.22469", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "M. A. A. Ahmed"}, {"name": "H. Zainuddin"}, {"name": "N. M. Shah"}], "featured_authors": [{"name": "M. A. A. Ahmed"}, {"name": "H. Zainuddin"}, {"name": "N. M. Shah"}], "author_count": 3}, {"id": "2608.22509", "category": "hep-th", "title": "A second rotational Killing field on gauged D=5 vector multiplet horizons", "abstract": "We study supersymmetric near-horizon geometries of gauged D=5 supergravity coupled to vector multiplets, on the branch where the canonical rotational Killing vector $\\tilde V$ of the horizon section $\\mathcal{S}$ is non-vanishing. No rotational symmetry is assumed. On a compact, connected $\\mathcal{S}$ without boundary, a second rotational Killing field, independent of $\\tilde V$, always exists on the open set where $Z$ and $W$ are linearly independent, and extends to an isometry of all of $\\mathcal{S}$, unconditionally if the moduli are constant and under a checkable extension hypothesis otherwise. With $K=Q_{IJ}C^IC^J$ vanishing exactly in the minimal theory, $K\\equiv0$ recovers the known result of Grover, Gutowski, Papadopoulos and Sabra. When $K>0$, $P=Z+W$ vanishes at every critical point of $\\|\\eta_-\\|^2$, and two sub-branches occur, both realised. On the first, $P\\equiv0$, the moduli are constant and the isometry follows by homogeneity, recovering Kunduri and Lucietti local geometries as a consequence of supersymmetry and compactness rather than an ansatz. On the second, $P\\not\\equiv0$, the moduli genuinely vary; closure of the first-order system ($dP=0$) turns the Killing equation for a vector orthogonal to $P$ into a flat rank-two system transported along $P$, solved explicitly by $U=\\|\\eta_-\\|^2(h_YN-h_NY)$. Both sub-branches are non-empty on compact $\\mathcal{S}$: known $U(1)^3$ black holes populate the first, and an explicit compact horizon from the non-static Kunduri-Lucietti family, with $P$ vanishing at two points, populates the second and verifies the extension hypothesis numerically. We also prove $K$ is identically zero or everywhere positive, exclude a hidden Killing-tensor symmetry, and leave the $S^1\\times S^2$ black-ring window $\\tfrac13\\Phi^2<\\chi^2K\\leq\\tfrac43\\Phi^2$ unexcluded on either sub-branch.", "url": "https://arxiv.org/abs/2608.22509", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Usman Kayani"}], "featured_authors": [{"name": "Usman Kayani"}], "author_count": 1}, {"id": "2608.22609", "category": "hep-th", "title": "Genus-Two Contributions to Late-Time Correlators in JT Gravity", "abstract": "In this work, we analyze the late-time two-point correlation function in Jackiw--Teitelboim gravity, focusing on the genus-two ($g=2$) contribution associated with two baby universes. Extending the analysis of the single-baby-universe ($g=1$) case, we formulate an amplitude describing the emission and absorption of two baby universes during the evolution of the Hartle--Hawking state. This formulation reduces the problem to a moduli-space integral involving the Weil--Petersson volume $V_{0,3}$. To evaluate this integral, we decompose $V_{0,3}$ into contributions from Kontsevich graphs and extend the no-shortcut condition to the relevant genus-two strip geometries. Combined with the strip approximation, this decomposition reorganizes the moduli-space integral into a finite sum of contributions associated with distinct geometric configurations. We then explicitly evaluate the strip-geometry contributions corresponding to the emission of two baby universes and determine their contribution to the genus-two late-time two-point correlation function. Our results suggest that the strip approximation, together with the no-shortcut condition, provides a useful analytic framework for studying higher-genus geometries containing multiple wormholes.", "url": "https://arxiv.org/abs/2608.22609", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masayoshi Sato"}], "featured_authors": [{"name": "Masayoshi Sato"}], "author_count": 1}, {"id": "2608.22625", "category": "hep-th", "title": "Higher-spin charges and the $L_Λ w_{1 + \\infty}$ algebra in (A)dS$_4$", "abstract": "We consider $(3+1)$-dimensional asymptotically locally (anti-)de Sitter ((A)dS$_4$) spacetimes with boundary conditions allowing for gravitational flux. We construct an infinite tower of higher-spin charges as perturbative solutions in the cosmological constant $\\Lambda$ to a hierarchy of evolution equations resulting from an asymptotic expansion of the Einstein equations. We show that these charges canonically realize the $\\Lambda$-deformed $w_{1+\\infty}$ algebra ($L_{\\Lambda} w_{1+\\infty}$) on a restricted gravitational phase space, thereby extending the higher-spin symmetry structure of asymptotically flat spacetimes to asymptotically (A)dS spacetimes. We further construct the curved-space counterparts of conformally soft gravitons directly in terms of spacetime data. We show that they are primaries with respect to an $\\mathfrak{sl}(2,\\mathbb{R})$ subalgebra of the (A)dS$_4$ isometry algebra and that their Poisson brackets with the quadratic higher-spin charges reproduce the $\\Lambda$-deformed celestial operator product expansion proposed by Taylor and Zhu. Our results establish the bulk gravitational origin of the $L_{\\Lambda}w_{1+\\infty}$ symmetry and extend the celestial bulk-boundary dictionary to asymptotically (A)dS$_4$ gravity.", "url": "https://arxiv.org/abs/2608.22625", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lorenzo Di Giacomo"}, {"name": "Maitá Micol"}, {"name": "Daniele Pranzetti"}, {"name": "Ana-Maria Raclariu"}], "featured_authors": [{"name": "Lorenzo Di Giacomo"}, {"name": "Maitá Micol"}, {"name": "Daniele Pranzetti"}, {"name": "Ana-Maria Raclariu"}], "author_count": 4}, {"id": "2608.22669", "category": "hep-th", "title": "Towards Perturbative Unimodular Poincaré Gauge Theories with Propagating Torsion", "abstract": "We study the one-loop relation between an effective-field-theory extension of Poincaré gauge theories of gravity with propagating torsion and its unimodular counterpart. In the Einstein representation, we consider two representative quadratic torsion subsectors, namely totally antisymmetric (axial) torsion and the vector component of hook-antisymmetric torsion. On maximally symmetric metric backgrounds with vanishing background torsion, the diffeomorphism-invariant and genuine unimodular theories yield identical one-loop determinants in both sectors, reproducing the same local logarithmic divergences. We further examine flat backgrounds with homogeneous axial or vector torsion, where metric-torsion mixing is present. In each case, the torsion-dependent one-loop effective action in unimodular gauge and in the genuine unimodular formulation is controlled by the same physical determinant. Thus, for the actions and backgrounds considered, the unimodular constraint does not modify local one-loop torsion dynamics. We also delineate the limitations of this equivalence and the extensions needed for generic torsionful curved backgrounds.", "url": "https://arxiv.org/abs/2608.22669", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arthur F. Vieira"}, {"name": "Antonio D. Pereira"}, {"name": "Reinhard Alkofer"}], "featured_authors": [{"name": "Arthur F. Vieira"}, {"name": "Antonio D. Pereira"}, {"name": "Reinhard Alkofer"}], "author_count": 3}, {"id": "2608.22855", "category": "hep-th", "title": "Bouncing shellworld embedded in charged AdS spacetime", "abstract": "We investigate the cosmological evolution of a spherical brane within the shellworld (dark bubble) scenario embedded in a five-dimensional charged AdS bulk spacetime. For zero or small value of the brane cosmological constant, the shellworld universe has a nonsingular bouncing and cyclic nature with the bounce induced by the charge parameter of the bulk spacetime. On large value of the brane cosmological constant, the shellworld undergoes a nonsingular bounce and expands eternally. Under certain conditions, the brane bounces outside the bulk horizons, leading to a geometrical resolution of the Cauchy horizon instability present in standard braneworld models. Furthermore, analysis of linear scalar perturbations reveals that test scalar field modes remain regular and non-divergent across the bounce. Finally, we incorporate uniformly distributed long strings in the bulk and demonstrate that the bounce still persists while avoiding the horizon instability.", "url": "https://arxiv.org/abs/2608.22855", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Karma P. Sherpa"}, {"name": "Rishi Pokhrel"}, {"name": "Indra K. P. Chettri"}, {"name": "Tanay K. Dey"}], "featured_authors": [{"name": "Karma P. Sherpa"}, {"name": "Rishi Pokhrel"}, {"name": "Indra K. P. Chettri"}, {"name": "Tanay K. Dey"}], "author_count": 4}, {"id": "2608.22952", "category": "hep-th", "title": "A pedagogical introduction to invariant theory and finite-$N$ holography", "abstract": "These lectures provide a pedagogical introduction to the study of finite-$N$ physics of the AdS/CFT correspondence. More specifically we develop the consequences of the trace relations for the space of gauge invariant operators, using powerful methods from invariant theory. Our key conclusions are \\begin{itemize} \\item that the complete set of trace relations can be solved, leaving a non-redundant set of gauge invariant operators, \\item that this non-redundant set can be generated using two types of generators, called primary and secondary invariants, and \\item that the primary invariants acquire a natural interpretation as perturbative gravitational degrees of freedom, while the secondary algebra encodes non-perturbative effects of the dual gravitational theory. \\end{itemize}", "url": "https://arxiv.org/abs/2608.22952", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Robert de Mello Koch"}, {"name": "Minkyoo Kim"}, {"name": "Augustine Larweh Mahu"}, {"name": "Anik Rudra"}], "featured_authors": [{"name": "Robert de Mello Koch"}, {"name": "Minkyoo Kim"}, {"name": "Augustine Larweh Mahu"}, {"name": "Anik Rudra"}], "author_count": 4}, {"id": "2608.23008", "category": "hep-th", "title": "A Combinatorial Origin of Locality", "abstract": "Locality and unitarity are fundamental principles of quantum field theory. For tree-level scattering amplitudes, locality determines which propagator poles may occur together, while unitarity fixes their residues through factorization. Previous uniqueness theorems have repeatedly shown that unitarity can emerge from locality combined with other physical principles. In this Letter we give the first complete all-multiplicity proof for the emergence of locality in this setting. We focus on Tr($\\phi^3$) theory and phrase locality as a problem in geometric combinatorics. Planar propagators are chords of a polygon, and a denominator is local exactly when its chords triangulate the polygon, and non-local otherwise. We show that hidden zeros---regular kinematic conditions on which the amplitude vanishes---enforce pole compatibility and therefore imply a local singularity structure. The proof rests on two ingredients: a graphical \\emph{star test} determines when a chosen zero eliminates a pole product, and a \\emph{smoothing} procedure finds such a zero. Thus, once the planar pole alphabet and denominator bound are specified, locality and unitarity emerge together from a single on-shell principle: hidden zeros. Equivalently, our proof provides a novel characterization of a familiar concept: polygon triangulations are precisely the chord configurations that evade every star test.", "url": "https://arxiv.org/abs/2608.23008", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Laurentiu Rodina"}, {"name": "Giuseppe Sellaroli"}, {"name": "Jonathan Valenzuela"}], "featured_authors": [{"name": "Laurentiu Rodina"}, {"name": "Giuseppe Sellaroli"}, {"name": "Jonathan Valenzuela"}], "author_count": 3}, {"id": "2608.23069", "category": "hep-th", "title": "Renormalization, cutoff, and gluing for a quartic model with boundary", "abstract": "In this paper, we study the renormalization of a three-dimensional quartic model on a compact connected Riemannian manifold with a boundary. We show that, in addition to the standard shift of the mass parameter, it is necessary to take into account boundary contributions involving singular coefficients. This indicates the need to extend the classical action within the framework of standard renormalization theory. The requirements of consistency regarding the gluing of manifolds lead to renormalization of an operator on the boundary.", "url": "https://arxiv.org/abs/2608.23069", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. V. Ivanov"}], "featured_authors": [{"name": "A. V. Ivanov"}], "author_count": 1}, {"id": "2608.23077", "category": "hep-th", "title": "Love at the String Scale: Tidal Deformability Across the Black Hole-String Transition", "abstract": "Tidal deformability provides a sensitive probe of the structure of compact objects, and black holes are exceptional in having vanishing static Love numbers in four-dimensional Einstein gravity. We ask what happens to this fine-tuned rigidity across the black hole-string transition, where the same states are expected to admit a weakly coupled description as a self-gravitating highly excited string, or \"string star\". We compute the static tidal Love numbers of the Horowitz-Polchinski (HP) string star for multipoles $\\ell=2,3,4$ in $D=4,5,6$. The response is non-zero in all cases, as in the available $\\alpha'$-corrected black hole results, so the zero-Love structure of four-dimensional Einstein gravity does not survive on either side of the transition. On the string side, however, the response has a distinctive multipolar structure: the Love numbers grow rapidly with $\\ell$, and we show analytically that this growth originates from the competition between the multipolar weight of the tidal field and the exponential tail of the winding condensate, with the result that the radial scale probed by the deformability grows linearly with $\\ell$ at large multipole number. This provides a direct tidal signature of the extended, surface-less nature of the string star. We discuss the comparison with $\\alpha'$-corrected black holes and the limitations of the currently available perturbative results at large $\\ell$.", "url": "https://arxiv.org/abs/2608.23077", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Roberto Emparan"}, {"name": "Luis Lehner"}, {"name": "Stefano Trezzi"}], "featured_authors": [{"name": "Roberto Emparan"}, {"name": "Luis Lehner"}, {"name": "Stefano Trezzi"}], "author_count": 3}, {"id": "2608.23111", "category": "hep-th", "title": "A Third-Quantized Description of Spacetime Wormholes in AdS/CFT", "abstract": "We propose an extension of AdS/CFT in which quantum gravitational wavefunctions of connected bulk geometries are assembled into a Fock space of universes. Splitting and joining interactions in a third-quantized Hamiltonian then provide a quantum description of changes in bulk connectivity and topology. Reduced phase-space quantization supplies the physical one-universe Hilbert space and a radial Schrödinger evolution with respect to which the topology-changing interactions are ordered. We develop the construction concretely in AdS$_3$ gravity with a torus boundary, where these ingredients can be described explicitly. The light spectrum is treated as fixed, non-normalizable background data, whereas the normalizable states above the black-hole threshold are quantized as dynamical modes. A conventional boundary theory is selected by choosing a coherent state whose universe-field expectation value, together with the fixed background contribution, yields consistent CFT data at the asymptotic boundary. Generic one-universe wavefunctions need not admit such an interpretation. This raises the possibility that CFT-realizable wavefunctions are nongeneric in the gravitational state space and are not closed under arbitrary superpositions of gravitational states. The known two-torus spacetime-wormhole amplitude, which lies at the heart of the factorization problem, provides concrete input for the topology-changing interactions of the third-quantized theory. A complementary cutting-and-gluing description yields an effective ensemble interpretation when the resulting gravitational sectors admit consistent boundary-theory interpretations, without assuming a fundamental ensemble of boundary theories. We also discuss replica wormholes and baby-universe processes within the same framework.", "url": "https://arxiv.org/abs/2608.23111", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shinji Hirano"}], "featured_authors": [{"name": "Shinji Hirano"}], "author_count": 1}, {"id": "2608.23220", "category": "hep-th", "title": "Conformal and Noncommutative Gravity from Gauge Symmetry Breaking and SO(2,16) Unification", "abstract": "Motivated by the old idea of treating gravity as a gauge theory, we review the gauge-theoretic construction of Conformal Gravity and of Noncommutative (Fuzzy) Gravity. We then outline how these gauge formulations of gravity can be unified with internal interactions described by an SO(10) Grand Unified Theory, based on the critical observation that the dimension of the tangent-space symmetry group of a curved manifold need not coincide with the spacetime dimension.", "url": "https://arxiv.org/abs/2608.23220", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stelios Stefas"}, {"name": "George Zoupanos"}], "featured_authors": [{"name": "Stelios Stefas"}, {"name": "George Zoupanos"}], "author_count": 2}, {"id": "2608.23243", "category": "hep-th", "title": "Analytical Cosmological Collider at Strong Mixing in Laplace Space", "abstract": "Primordial non-Gaussianities are at their largest when the curvature perturbation is coupled to a massive field by a mixing too strong to be treated perturbatively. We show that this regime, naturally reached in multifield inflation, is solved analytically by the Laplace-space representation we recently introduced, in which every mode becomes a superposition of plane waves weighted by a single kernel. The bispectrum then follows as a rapidly convergent series of elementary functions, in perfect agreement with independent numerical results. We find that the cosmological collider signal at strong mixing is larger than widely believed, with only half of the usual Boltzmann suppression. Its amplitude further grows with the number of time derivatives of the curvature perturbation in the interaction, singling out the most promising observational targets.", "url": "https://arxiv.org/abs/2608.23243", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}], "featured_authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}], "author_count": 3}, {"id": "2608.23298", "category": "hep-th", "title": "The ETH matrix model for DSSYK: non-perturbative corrections and intersection theory", "abstract": "At leading order in the genus expansion the ETH matrix model for DSSYK reproduces its correlators by construction, while its higher-genus corrections are conjectured to capture higher-topology contributions in the dual sine-dilaton gravity -- a correspondence established so far only for the disk and the wormhole. At fixed genus the correlators are built from discrete volumes $N_{g,n}$, polynomial in $q$-deformed zeta values $\\zeta_q(2k)$ with $q=e^{-\\lambda}$, $\\lambda$ being the DSSYK coupling. These lie in the ring of quasimodular forms generated by the Eisenstein series $E_2,E_4,E_6$, whose $S$-duality yields an exact closed form for the leading non-perturbative correction as $\\lambda\\to0$, controlled by $\\widetilde q=e^{-4\\pi^2/\\lambda}$. Known at disk level, this scale is shown here to govern the fixed-genus, higher-boundary amplitudes as well. We show that the term linear in $\\widetilde q$, at leading order in $\\lambda$, is captured entirely by the $q$-deformed Weil--Petersson volumes, and reduces to a finite sum of intersection numbers of $\\kappa$-classes on the moduli space $\\overline{\\mathcal M}_{g,n}$ of stable curves, computable without repeating the topological recursion that produced the $N_{g,n}$. We tabulate it for every $(g,n)$ whose $q$-deformed volume is known in closed form, and extend it to $(3,1),(3,2),(4,1)$, where none is available. The construction is not restricted to leading order: we work out $O(\\widetilde q^2)$ for the same cases.", "url": "https://arxiv.org/abs/2608.23298", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "featured_authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "author_count": 2}, {"id": "2608.23326", "category": "hep-th", "title": "Perturbative Anomaly Inflow on Orbifolds", "abstract": "We study perturbative anomaly inflow for effective theories supported on orbifold fixed loci of the internal geometry. Donnelly's equivariant APS theorem gives a fixed-point density, whose degree-\\((d+2)\\) component is identified as the anomaly polynomial of the \\(d\\)-dimensional effective theory. We apply the construction to six-dimensional A-type orbi-instanton theories engineered by \\(N\\) M5-branes probing a transverse \\(\\mathbb{C}^2/\\mathbb{Z}_k\\) singularity at an end-of-the-world M9-brane. For a flat \\(E_8\\) connection specified by \\(\\rho:\\mathbb{Z}_k\\to E_8\\), we compute the non-identity ALE fixed-point class on the M9 wall. Its degree-eight component agrees with the complete Kac-label-dependent remainder conjectured in \\cite{MOTZ}, including the \\(SU(2)_R\\) and tangent-bundle curvatures. Together with the known M5/Hořava--Witten and ALE/Hořava--Witten terms, this reproduces the unflavored tensor-branch anomaly polynomial. This local equality further suggests a complete M-theory corner-inflow interpretation. The same prescription also be extended to include flavor symmetries as the centralizer of \\(E_8\\).", "url": "https://arxiv.org/abs/2608.23326", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hao Y. Zhang"}], "featured_authors": [{"name": "Hao Y. Zhang"}], "author_count": 1}, {"id": "2608.23378", "category": "hep-th", "title": "Landau theory, effective temperature, and tricritical phenomena in a holographic nonequilibrium steady state", "abstract": "We investigate the critical exponents $(\\gamma,\\nu)$ at the current-driven tricritical point (TCP) associated with chiral symmetry breaking in a nonequilibrium steady state described by the D3/D7 model. In the symmetry-broken phase, we find that, unlike in the conventional Landau theory, both $\\gamma$ and $\\nu$ can take values different from those predicted by the Landau theory and depend on the path along which the TCP is approached in the phase diagram. However, when the TCP is approached with the ratio of the effective temperature to the heat bath temperature, $T_{*}/T$, held fixed, the critical exponents agree with those of the Landau theory. These results suggest that the critical phenomena at the current-driven TCP may be described by the Landau theory along the $T_{*}/T$-fixed line, whereas a nontrivial extension of the Landau theory is required for a more general description of the critical phenomena along arbitrary paths.", "url": "https://arxiv.org/abs/2608.23378", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Motohiro Kanazawa"}, {"name": "Masataka Matsumoto"}, {"name": "Shin Nakamura"}], "featured_authors": [{"name": "Motohiro Kanazawa"}, {"name": "Masataka Matsumoto"}, {"name": "Shin Nakamura"}], "author_count": 3}, {"id": "2608.23517", "category": "hep-th", "title": "Energy of toroidal M2 brane in flat 11d background", "abstract": "The supermembrane action is non-linear and a priori non-renormalizable. Still, some quantities in this theory may be free of log UV divergences and thus defined unambiguously. To explore this possibility we compute the energy of an M2 brane wrapped on a 2-torus in flat 11d space to two loops in the inverse-tension expansion. The result is free of logarithmic divergences and the same should hold also at higher loop orders. For fermions periodic around both circles the quantum corrections cancel, consistent with the BPS nature of the wrapped M2 brane state. For fermions antiperiodic around one or both circles the energy is a non-trivial function of the radii given by infinite sums of modified Bessel functions. We also compute 3-loop correction to the energy of the bosonic membrane on $\\mathbb R^2\\times S^1$. In contrast to the string case, it contains, besides powers of the 1-loop $\\zeta(3)$ coefficient, a new term proportional to $\\zeta(9)$. Summing contributions of all-loop bubble graphs leads to a simple cubic equation for the membrane energy. The analogous resummation in the Nambu or GS string t case reproduces the familiar exact square-root expression ${\\mathcal E}=\\sqrt{(2\\pi R\\,T_1)^2+m_0^2}$. We find that the bubble-graph part of the membrane energy does not vanish for any value of the radius $R_{11}$. If contributions of other non-trivial diagrams in the supermembrane case do not qualitatively change this conclusion, this would disfavour the conjectured relation between 11d theory on an antiperiodic circle and the strong-coupling limit of type 0A string theory.", "url": "https://arxiv.org/abs/2608.23517", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arkady A. Tseytlin"}, {"name": "Zihan Wang"}], "featured_authors": [{"name": "Arkady A. Tseytlin"}, {"name": "Zihan Wang"}], "author_count": 2}, {"id": "2608.21642", "category": "math-ph", "title": "How Much Geometry Does Newtonian Dynamics Fix?", "abstract": "Newtonian mechanics is usually written on a spacetime of fixed geometry. Here we build that geometry, introducing a propagator and a bilinear form only as the description demands. Within this reconstruction the Principle of Inertia emerges as a theorem rather than an independent postulate. Inertial motion is blind to the scale of the form and to the torsion the propagator defines, and that blindness is a geometric precursor of the \\emph{universality of free fall}, before gravity enters. Newton's Second Law is a compatibility between two derivatives along a curve. The force exceeds the mass times the lowered acceleration by an exact term, and the law survives arbitrary torsion. Requiring force-free motion to be inertial along curves parametrised by arc length restricts the torsion to be totally antisymmetric. The remaining torsion is a three-form which we postulate the particle carries along its worldline. Its contraction with the velocity annihilates that velocity, so the supplementary condition of spinning-particle mechanics holds identically, and we propose that contraction as a classical spin. The algebra is familiar from relativistic spin hydrodynamics; the assignment, to the best of our knowledge, has not been proposed elsewhere. Since inertial motion resolves neither the mass nor the spin, the predictive content lies in the transport law we postulate, which turns the spin against a parallel-transported frame at a rate fixed by the acceleration alone and by no coupling constant. That rate becomes a laboratory number only once the arc-length parameter is identified with a clock, which we leave open. The dynamics asks non-degeneracy of the form, so this spacetime is not Newton--Cartan's Galilean one, and gravitation lies outside the construction. We prove every mathematical result, make three constitutive postulates and one physical conjecture.", "url": "https://arxiv.org/abs/2608.21642", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "C S López-Monsalvo"}], "featured_authors": [{"name": "C S López-Monsalvo"}], "author_count": 1}, {"id": "2608.21802", "category": "math-ph", "title": "Finite-term recurrences in a generalized Bochner--Krall family", "abstract": "We classify the differential operators \\(T=z^j\\partial_z^j+z^m\\partial_z^\\ell\\), where \\(0\\le m<\\ell\\) and \\(1\\le j<\\ell\\), whose monic eigenpolynomials satisfy a finite-term recurrence relation. Writing \\(k=\\ell-m\\), such a recurrence exists if and only if \\(j=1\\) and \\(k\\mid\\ell\\). In that case we determine all recurrence coefficients in closed form and prove that the associated difference operator has order \\(\\ell\\). We also give an explicit factorization showing that every admissible operator is of Type~(2) in Conjecture~1.10 of Horozov--Shapiro--Tater; the equality of the differential and difference orders is the conclusion predicted by their Conjecture~1.9.", "url": "https://arxiv.org/abs/2608.21802", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "L.M. Anguas"}, {"name": "D. Barrios Rolanía"}, {"name": "B. Shapiro"}, {"name": "M. Tater"}], "featured_authors": [{"name": "L.M. Anguas"}, {"name": "D. Barrios Rolanía"}, {"name": "B. Shapiro"}, {"name": "M. Tater"}], "author_count": 4}, {"id": "2608.21999", "category": "math-ph", "title": "TENSKEL: A Combinatorial Observable Tensor for Structured Measurement and Reconstruction", "abstract": "Many imaging problems seek to reconstruct underlying configurations from partial observable measurements. While reconstruction algorithms operate on these measurements, the observable organization induced by the measurement process is rarely represented explicitly. We introduce TENSKEL, a combinatorial observable framework for structured measurement and reconstruction based on tensor representations defined over discrete domains. Starting from a binary latent ensemble, the framework constructs a hierarchy of tensors coupling measurement contexts to a latent Pascal organization through successive aggregation and folding operations. Each measurement context induces an observable partition of the same latent ensemble, and the resulting tensor formulation makes explicit the associated combinatorial multiplicities, shell organization, degeneracies, and induced reconstruction geometry. Rather than introducing a new reconstruction algorithm, this framework provides a mathematical representation of how latent configurations become organized under observation. The induced tensor kernel characterizes similarities between latent coordinates through their measurement-context responses, while regularized inversion provides a structured reconstruction of the latent representation from observable measurements. The binary construction further admits a natural multinomial extension to discrete simplex-supported latent representations. Connections to Pascal cellular automata and structured discrete color mappings illustrate respectively compressed and multinomial realizations of the framework. More generally, TENSKEL provides a combinatorial basis for reasoning about the organization induced by observation, with potential relevance to computational imaging, inverse problems, structured sensing, and quantum-inspired measurement formulations.", "url": "https://arxiv.org/abs/2608.21999", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yvan Richard"}], "featured_authors": [{"name": "Yvan Richard"}], "author_count": 1}, {"id": "2608.22362", "category": "math-ph", "title": "Interacting Lattice Bosons on the Concrete Buchholz Algebra -- All-Temperature Equilibrium States from Functional-Integral Local-Number Bounds", "abstract": "Interacting Bose--Hubbard dynamics is formulated on the concrete Buchholz algebra in Fock space. Under repulsive finite-range interactions and a low-activity gap, a discrete functional integral gives volume-uniform exponential local-number bounds at all temperatures. These bounds remove the local-moment hypothesis and yield finite-volume approximation and KMS accumulation states in arXiv:2505.13170 .", "url": "https://arxiv.org/abs/2608.22362", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yoshitsugu Sekine"}], "featured_authors": [{"name": "Yoshitsugu Sekine"}], "author_count": 1}, {"id": "2608.22365", "category": "math-ph", "title": "On the gauge invariant boundary condition in open XXZ chains: SoV bases, elementary blocks and overlaps", "abstract": "We consider the open XXZ spin chain with unparallel boundary fields, in the special case in which the Vertex-IRF transform of the K-matrix labelling the boundary field at site 1 is diagonal and invariant under the value of the gauge parameters, the other K-matrix being arbitrary. We discuss here several properties related to this special gauge invariant boundary condition. Such a model can be solved in the Vertex-IRF framework with arbitrary gauge parameters: we can diagonalise the transfer matrix by means of generalised Sklyanin's Separation of Variable (SoV) approach in a family of SoV bases that depend on two arbitrary gauge parameters $\\alpha$ and $\\beta$, $\\beta$ being the so-called dynamical parameter and $\\alpha$ an arbitrary shift of the spectral parameter. We show here that such SoV bases depend actually on $\\alpha$ and $\\beta$ through the difference $\\alpha-\\beta$ only. Considering the ungauged limit in which $\\alpha-\\beta$ tends to infinity, we show how to compute all elementary building blocks for the correlation functions of this model. We finally show how to compute overlaps between eigenstates of this model and eigenstates of a spin chain sharing the same boundary condition at site $N$ and in which the gauge invariant boundary condition at site 1 has been changed to a more general one.", "url": "https://arxiv.org/abs/2608.22365", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "G. Niccoli"}, {"name": "V. Terras"}], "featured_authors": [{"name": "G. Niccoli"}, {"name": "V. Terras"}], "author_count": 2}, {"id": "2608.22543", "category": "math-ph", "title": "Quantitative Furstenberg Theory for Large Random Matrices", "abstract": "We consider the $2W\\times 2W$ transfer matrices associated to the block Anderson model with GOE potential blocks. We make the classical Lyapunov exponent theory quantitative in two ways. First, we prove a quantitative limit theorem for the top Lyapunov exponent. Second, we prove every gap between Lyapunov exponents is at least $c/W$. As a corollary, this implies the localization length of this $1$d block Anderson model is at most $CW^2$. The proof uses Furstenberg type formulas for the Lyapunov exponents, and Malliavin calculus style arguments in the symplectic group to show the product of sufficiently many transfer matrices has a sufficiently smooth density. The main technical input for the latter is a least singular value estimate for a structured random matrix.", "url": "https://arxiv.org/abs/2608.22543", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Reuben Drogin"}], "featured_authors": [{"name": "Reuben Drogin"}], "author_count": 1}, {"id": "2608.22547", "category": "math-ph", "title": "Fractality of the Schrödinger Density for Rough Data", "abstract": "The observable of the Talbot effect is the intensity behind the grating: the density of the evolving field, not the field itself. Its fractality was previously known only for step data with rational jumps. We prove the general case. For arbitrary real data of bounded variation with at least one jump, the density of the free Schrödinger evolution on the torus is fractal at almost every time, with graph of upper box dimension exactly three halves. Its critical Sobolev mass diverges logarithmically, at a rate given in closed form by Wiener's jump statistic of the datum and independent of the positions and phases of the jumps. The same rate is halved along time traces and doubled for the Airy flow, so the critical mass probes the dispersion relation. Transported by the rank calculus of derangetropy operators, the theory equips every probability law with a quantum carpet: Gauss-sum revivals on quantile cells at rational times, a universal fractal at almost every other. The spectral growth rate of a single measured intensity profile returns the jump content of the grating, a prediction open to test in optical and matter-wave interferometry.", "url": "https://arxiv.org/abs/2608.22547", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masoud Ataei"}], "featured_authors": [{"name": "Masoud Ataei"}], "author_count": 1}, {"id": "2608.23177", "category": "math-ph", "title": "Correlation inequalities for transversal field models with application to quantum glasses", "abstract": "We study the class of transversal field models with pair interactions, including the quantum Curie-Weiss and the transversal field Ising model, as well as quantum spin glasses based on the Sherrington-Kirkpatrick (SK) and Edwards-Anderson models. Our main result is a general correlation inequality based on a Gaussian convolution estimate, which is derived from an extension of the Ding-Song-Sun inequality and an application of Brascamp-Lieb convexity techniques. The results apply for sufficiently strong transversal fields and, for quantum spin glasses, yield a high-field regime without replica order. Combined with the previously established low-field replica-symmetry-breaking regime, this gives distinct low- and high-field overlap phases. As a corollary of the logarithmic Sobolev inequalities for the underlying functional integrals derived here, we show the concentration of the self- and replica-overlap, and determine the high-field asymptotics of the pressure in the quantum SK model.", "url": "https://arxiv.org/abs/2608.23177", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chokri Manai"}, {"name": "Simone Warzel"}], "featured_authors": [{"name": "Chokri Manai"}, {"name": "Simone Warzel"}], "author_count": 2}, {"id": "2608.23201", "category": "math-ph", "title": "Universality of the conformal anomaly", "abstract": "We prove a universal property of local real one-dimensional modular functors, which may be thought of as central extensions of the sewing operation on the (infinite-dimensional) Segal moduli spaces. Such modular functors are characterized by one real parameter: their central charge: Our result is an analogue of ``Mumford's theorem,'' that appeared in Segal's monograph [Seg88, Seg04] in the complex case. Algebraically, the modular functors are characterized by real-valued cocycles on pairs of surfaces under sewing. We identify the disk-disk cocycle as the universal Liouville action, also known as loop Loewner energy. The guiding example is the real determinant line bundle encoding the trace anomaly of conformal field theories (CFT) and the restriction function of Schramm-Loewner evolution (SLE) loop measures. Our result thus gives a mathematical explanation for the appearance of the central charge in CFT and SLE, and proves the conjectured uniqueness of Brownian loop measureas the canonical restriction function for SLE.", "url": "https://arxiv.org/abs/2608.23201", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sid Maibach"}, {"name": "Eveliina Peltola"}], "featured_authors": [{"name": "Sid Maibach"}, {"name": "Eveliina Peltola"}], "author_count": 2}, {"id": "2608.23266", "category": "math-ph", "title": "Elements of Topology, Differential Geometry and General Relativity for Physicists: A Mathematica-based Tutorial Approach", "abstract": "This book is a self-contained, tutorial introduction to topology, differential geometry, and general relativity for students and researchers in physics. Its distinguishing feature is a Mathematica-based approach that makes abstract constructions concrete through explicit, runnable notebooks and worked examples. A key contribution is a large collection of original Mathematica notebooks, written by the authors themselves, that let readers run, verify, and extend every demonstration. The first part covers point-set topology, topological spaces, continuity of maps, homotopy, and the fundamental group with applications that highlight the role of topology in modern physics. The second and largest part develops differential geometry from the ground up: manifolds, tangent and dual spaces, vector fields, pullbacks and pushforwards, Lie brackets and Lie algebras, local flows, and the Lie derivative. It then treats tensors, differential forms, the exterior derivative, volume forms, the metric tensor, and Hodge duality, emphasizing coordinate-free formulations and their computational realization. These tools are applied to Maxwell's equations in the language of forms and the generalized Stokes theorem, while Lie groups, fiber bundles, connections, and curvature bridge geometry and gauge-theoretic physics. The final part uses this framework to present general relativity, computing curvature tensors and field equations for standard spacetimes with dedicated Mathematica packages. Throughout, the book balances mathematical rigor with hands-on computation, enabling readers both to understand the theory and to reproduce every result themselves.", "url": "https://arxiv.org/abs/2608.23266", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Balasubramanian Ananthanarayan"}, {"name": "Souvik Bera"}, {"name": "Subhasish Chakrabarty"}, {"name": "Souradeep Das"}, {"name": "Amitabha Lahiri"}, {"name": "Suhas Sheikh"}, {"name": "Sarthak Talukdar"}], "featured_authors": [{"name": "Balasubramanian Ananthanarayan"}, {"name": "Souvik Bera"}, {"name": "Subhasish Chakrabarty"}, {"name": "Amitabha Lahiri"}, {"name": "Suhas Sheikh"}, {"name": "Sarthak Talukdar"}], "author_count": 7}, {"id": "2608.23342", "category": "math-ph", "title": "Instantons in a Double-Well are Poisson Distributed", "abstract": "We give a rigorous realization of the dilute instanton picture for a semiclassical Schrödinger operator with a symmetric double-well potential on $\\mathbb{R}^n$. Using a localized Feynman--Kac representation, we decompose the heat-kernel trace according to the number of passages made by a Brownian bridge between shrinking neighborhoods of the two wells. We identify the weight of one passage with a hopping coefficient $\\rho_\\lambda$, $\\displaystyle \\rho_\\lambda = \\int_{\\partial\\Omega} \\left( \\nabla\\overline{\\varphi_{\\lambda,0}^{\\Omega}}\\, \\varphi_{\\lambda,0}^{-\\Omega} - \\overline{\\varphi_{\\lambda,0}^{\\Omega}}\\, \\nabla\\varphi_{\\lambda,0}^{-\\Omega} \\right)\\cdot\\nu. $ On the exponentially long time scale $\\beta=N/\\lvert\\rho_\\lambda\\rvert$, the number of passages converges, for every fixed $N>0$, to a Poisson random variable of mean $N$. We identify $-\\frac{1}{\\lambda}\\log\\lvert\\rho_\\lambda\\rvert\\to S(d,-d)$ and obtain $\\displaystyle E_1(\\lambda)-E_0(\\lambda) = 2\\lvert\\rho_\\lambda\\rvert\\left(1+o(1)\\right). $ Thus the familiar instanton expansion of the double-well eigenvalue splitting emerges directly from a factorization of the heat-kernel trace.", "url": "https://arxiv.org/abs/2608.23342", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jacob Shapiro"}], "featured_authors": [{"name": "Jacob Shapiro"}], "author_count": 1}, {"id": "2608.23535", "category": "math-ph", "title": "Bound States in Exactly Solvable Polaritonic Models", "abstract": "We study a one-dimensional scalar model for an effective-mass quasiparticle field coupled to a continuum of two-level atoms with at most one excitation present. We prove a general theorem on the existence of bound states under sign-definite spatially localized perturbations of constant atomic density and analyze the bound states for several exactly solvable examples.", "url": "https://arxiv.org/abs/2608.23535", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sam Johar"}, {"name": "Ryogo Katahira"}, {"name": "Joseph Kraisler"}], "featured_authors": [{"name": "Sam Johar"}, {"name": "Ryogo Katahira"}, {"name": "Joseph Kraisler"}], "author_count": 3}, {"id": "2608.21434", "category": "quant-ph", "title": "Maximal-Rank Squeezing from Rank-One Quenches: An Exact Spectral-Reachability Theorem for Gaussian Bosonic Systems", "abstract": "We prove an exact spectral-reachability theorem for multimode squeezing generated by finite-rank quadratic quenches in Gaussian bosonic systems. For a stable sign-definite stiffness quench $\\Omega^2 \\to \\Omega^2+\\varepsilon U U^T$, the kernel, range, and rank of the anomalous Bogoliubov block are determined exactly by the block-Krylov subspace generated by $\\Omega$ and $U$. In particular, $\\operatorname{rank}(\\beta_\\varepsilon)=\\sum_a \\operatorname{rank}(P_a U)$, where $P_a$ projects onto each distinct free-frequency eigenspace. Consequently, the microscopic rank of a perturbation does not bound the number of squeezing channels it can activate: for a simple spectrum, a single rank-one element with nonzero overlap with every mode produces a full-rank anomalous Bogoliubov response at every nonzero stable coupling. A signed Lyapunov-Gramian path shows that spectrally reachable directions cannot disappear through finite-coupling cancellation. The theorem also gives exact dark sectors, degeneracy bottlenecks, and actuator-position rules without computing the full Bogoliubov transformation. These results provide a direct hardware-screening principle for multimode Gaussian systems: one or a few physical elements can provide simultaneous support across many canonical squeezing channels, although algebraic rank alone does not imply strong squeezing or independent tunability.", "url": "https://arxiv.org/abs/2608.21434", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kamran Ansari"}], "featured_authors": [{"name": "Kamran Ansari"}], "author_count": 1}, {"id": "2608.21508", "category": "quant-ph", "title": "Anomalous Local Heat Capacity and Bipartite Entanglement", "abstract": "The heat capacity of a system quantifies how it energetically responds to changes in temperature at equilibrium. Whilst this quantity is positive and even additive for non-interacting systems, self-gra
