  <style>

  <script>
    const papers = [{"id": "2608.21451", "category": "cond-mat", "title": "Power Series for the Quantum Statistical Mechanics Probability with Results for the Second Virial Coefficient of Helium", "abstract": "A power series for the Wigner-Kirkwood pair commutation function for quantum statistical mechanics in classical phase space is given with terms automatically generated by recursion. The calculated second virial coefficient agrees with the measured values of helium for temperatures greater than 65 K. Prospects for a general quantum Monte Carlo algorithm are discussed.", "url": "https://arxiv.org/abs/2608.21451", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Phil Attard"}], "featured_authors": [{"name": "Phil Attard"}], "author_count": 1}, {"id": "2608.21490", "category": "cond-mat", "title": "Electrostatic lens of a charged vortex", "abstract": "We study the local electrostatic response of a charged superfluid in the presence of a cylindrically symmetric vortex, allowing both the particle density and the thermodynamic compressibility to vary with the radial coordinate. Starting from the electrostatic charge response obtained from the phase-only Popov action, we introduce a local-density extension and derive the regular near-axis expansion of the scalar potential. The constant, quadratic, and quartic coefficients are obtained explicitly in terms of the local screening response and of the leading nonuniform contribution to the vortex density profile. For a three-dimensional unitary Fermi equation of state, the density dependence of the compressibility generates a definite thermodynamic contribution to the quartic coefficient. The resulting decomposition separates this equation-of-state contribution from the ordinary constant-screening and charge-source terms that occur at the same order. This provides a compact analytical connection between vortex-core thermodynamics and the local electrostatic profile of a charged superfluid.", "url": "https://arxiv.org/abs/2608.21490", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "featured_authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "author_count": 2}, {"id": "2608.21540", "category": "cond-mat", "title": "Automated Analysis to Reveal Grain Boundary Phase Microstructures", "abstract": "We develop a method for analyzing grain boundary (GB) microstructures that identifies distinct interfacial phases and the dislocation line defects separating them. Similar to bulk materials, GBs can adopt multiple distinct interfacial phases and undergo first-order phase transitions. When these phases coexist, their spatial arrangement and phase junctions constitute a GB microstructure, characterized by variations in excess properties and line defects with associated dislocation content. Despite this intrinsic heterogeneity, our ability to quantitatively characterize GB microstructures remains limited, as it requires identification of individual GB phases, phase-resolved excess properties, and the Burgers content of phase junctions, capabilities not available in existing automated methods. Here, we present an automated tool that performs interfacial microstructure mapping for planar coincidence site lattice GBs. The method identifies the spatial distribution of GB phases, quantifies phase-specific excess properties, and estimates the Burgers content of GB phase junctions. We demonstrate the approach using three representative cases: (i) quantification of mass transport during diffusion-limited GB phase transformations; (ii) identification of structurally indistinguishable phases formed by vacancy and interstitial loops; and (iii) characterization of GB microstructures containing phase nuclei. More broadly, this framework enables quantitative studies of GB evolution processes, including spinodal decomposition and coarsening with direct implications for GB deformation, creep, and migration.", "url": "https://arxiv.org/abs/2608.21540", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "R. Daniel Moore"}, {"name": "Ian S. Winter"}, {"name": "Robert E. Rudd"}, {"name": "Fadi Abdeljawad"}, {"name": "Timofey Frolov"}], "featured_authors": [{"name": "R. Daniel Moore"}, {"name": "Ian S. Winter"}, {"name": "Robert E. Rudd"}, {"name": "Fadi Abdeljawad"}, {"name": "Timofey Frolov"}], "author_count": 5}, {"id": "2608.21617", "category": "cond-mat", "title": "Electrostatic Persistence Length Revisited. I. Theory", "abstract": "The problem of single-chain conformations of polyelectrolytes in salt-added dilute solutions, and the associated concept of the electrostatic persistence length $\\textbf{l}_\\mathrm{e}$, has remained unresolved for decades. To address this challenge, we develop a comprehensive scaling theory and corroborate it with simulations. A unified scaling diagram is constructed that encompasses both flexible and intrinsically semiflexible/stiff polyelectrolytes. Nine distinct scaling regimes are identified, each characterized by different conformational statistics. The concept of the Gaussian electrostatic blob $\\xi_\\mathrm{e}$ used in the description of flexible polyelectrolytes is extended to the semiflexible case, and the new characteristic length $\\xi_\\mathrm{e}^{|}$ referred to as the rodlike electrostatic blob is introduced. This enables delineating the important crossovers and showcasing an analogy between semiflexible and flexible chains. The concept of electrostatic excluded volume is also reconsidered and generalized. Upon increasing the salt concentration, i.e., decreasing the Debye length $r_\\mathrm{D}$, chain conformations evolve from (i) rodlike stretches to (ii) Gaussian and then (iii) swollen coils with local electrostatic stiffening characterized by $\\textbf{l}_\\mathrm{e}$, followed by (iv) swollen coils without stiffening but with electrostatic exclude volume, and finally to (v) quasi-neutral Gaussian coils. In regimes of type (ii) and (iii), the electrostatic persistence length scales quadratically with $r_\\mathrm{D}$, in agreement with the OSF and KK predictions for semiflexible and flexible chains, respectively: $\\textbf{l}_\\mathrm{\\mathrm{OSF}} \\simeq r_\\mathrm{D}^{2}/\\xi_\\mathrm{e}^{|}$ and $\\textbf{l}_\\mathrm{\\mathrm{KK}} \\simeq r_\\mathrm{D}^{2}/\\xi_\\mathrm{e}$. These asymptotic scalings are confirmed by coarse-grained simulations presented in the accompanying article.", "url": "https://arxiv.org/abs/2608.21617", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Artem M. Rumyantsev"}, {"name": "Alexey A. Gavrilov"}, {"name": "Albert Johner"}], "featured_authors": [{"name": "Artem M. Rumyantsev"}, {"name": "Alexey A. Gavrilov"}, {"name": "Albert Johner"}], "author_count": 3}, {"id": "2608.21624", "category": "cond-mat", "title": "Vibrational, structural, and chemical fingerprints of ion diffusion in crystalline solids", "abstract": "Predicting mobile-ion self-diffusivity $D^*$ from molecular dynamics (MD) simulations is essential for identifying promising solid-state electrolytes, but directly simulating ion diffusion is computationally expensive, particularly with high-accuracy machine learning interatomic potentials (MLIPs). Diffusion is a slow, emergent process that requires long trajectories to converge. Thermodynamic properties, by contrast, converge much faster: the enthalpy $h$, vibrational entropy $s_{vib}$, and 2-body, excess configurational entropy $s^{ex}_{2,config}$ can be extracted from comparatively short MD trajectories, and they encode rich information about the free energy landscape from which transport properties like self-diffusivity ultimately arise. Intuitive correlations are discussed between these thermodynamic properties and ion diffusion, motivating a data-driven approach to exploit this link. A simple neural network was trained to predict diffusivity from features computed over short MD trajectories: a vibrational fingerprint (the vibrational density of states, VDOS) and a structural fingerprint (the radial distribution function, RDF), conditioned on chemistry information encoded in the MLIP embedding. This combination allows the model to predict the converged $\\log_{10} D^*$ (cm$^2$/s) \\textemdash\\ normally obtained from significantly longer MD simulations \\textemdash\\ with a mean absolute error of 0.398 and a Spearman's rank correlation $\\rho$ of 0.844.", "url": "https://arxiv.org/abs/2608.21624", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gavin Winter"}, {"name": "Juno Nam"}, {"name": "Rafael Gómez-Bombarelli"}], "featured_authors": [{"name": "Gavin Winter"}, {"name": "Juno Nam"}, {"name": "Rafael Gómez-Bombarelli"}], "author_count": 3}, {"id": "2608.21633", "category": "cond-mat", "title": "A high-entropy form of $R$Mn$_6$Sn$_6$ with distinct magnetotransport regimes correlated to different magnetic structures", "abstract": "The kagome $R$Mn$_6$Sn$_6$ material family has attracted significant attention as high-temperature metallic magnets with a host of different magnetic orderings and anisotropy. Theoretical studies point to the rare-earth ($R$) as the determining factor for both the direction of magnetic anisotropy and the type of magnetic ordering in a given compound. This motivates studying high-entropy forms of $R$Mn$_6$Sn$_6$ to examine how the interplay of several rare-earth elements leads to different magnetic states in a single crystal. Here, we present a rare-earth mix of Tb, Dy, Ho, Er, Tm, and Lu that produces phase transitions from a paramagnet to an easy-plane ferrimagnet (FiM) below $T_{\\text{C}}$ = 380 K, then to a FiM easy-axis state at $T_{\\text{SR1}}$ = 207 K, to a canted FiM ground state below $T_{\\text{SR2}}$ = 79 K. This behavior is consistent with previously reported high-entropy $R$Mn$_6$Sn$_6$ compounds; however, uniquely, the rare-earth mix studied here exhibits a broad transition from easy-plane to easy-axis anisotropy from 270 K to 170 K, and reveals a nonmonotonic magnetoresistance. Using neutron scattering data, we found that both observations correlate with an incommensurate modulated contribution to the spin state due to competing rare-earth interactions. This magnetoresistive behavior and the correlated spin structures underscore the potential for rare-earth engineering of magnetism.", "url": "https://arxiv.org/abs/2608.21633", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kyle W. Fruhling"}, {"name": "Jonathan Gaudet"}, {"name": "William D. Ratcliff"}, {"name": "Jonathan S. White"}, {"name": "Siddharth Nandanwar"}, {"name": "Noah J. Fau"}, {"name": "Gregory T. McCandless"}, {"name": "Enrique O. González Delgado"}, {"name": "Julia Y. Chan"}, {"name": "Oksana Zaharko"}, {"name": "Michael A. Susner"}, {"name": "Fazel Tafti"}], "featured_authors": [{"name": "Kyle W. Fruhling"}, {"name": "Jonathan Gaudet"}, {"name": "William D. Ratcliff"}, {"name": "Oksana Zaharko"}, {"name": "Michael A. Susner"}, {"name": "Fazel Tafti"}], "author_count": 12}, {"id": "2608.21644", "category": "cond-mat", "title": "Charge Transport Framework for Crystalline pi-Conjugated Materials", "abstract": "Quantitative charge-transport modelling in crystalline pi-conjugated polymers requires an electronic representation that captures extended conjugation and material-specific electron-phonon interactions on equal footing. We present a Wannier-orbital-based formulation of the transient-polaron-localization (TPL) framework for quantitative charge-transport simulations in crystalline pi-conjugated polymers. By expressing all interactions directly in a Wannier representation derived from first-principles calculations, the approach avoids artificial fragmentation of polymer backbones and enables a consistent, material-specific description of electronic couplings and electron-phonon interactions. Low- and high-frequency vibrational modes are incorporated within a mode-resolved TPL formalism, yielding an effective electronic Hamiltonian that captures both dynamic disorder and polaronic renormalization. The methodology is demonstrated for the ambipolar crystalline naphthalenediimide-bithiophene copolymer, enabling a direct comparison of electron and hole transport along the polymer backbone and pi-stacking directions. The simulations reproduce key transport features, including pronounced anisotropy and higher electron than hole mobility. Additional studies on single- and bi-chain systems reveal the essential role of inter-chain coherence in supporting efficient transport along the polymer backbone. Beyond this specific system, the Wannier-orbital-based TPL framework provides a transferable route to disentangle intrinsic charge-transport mechanisms in crystalline pi-conjugated materials and establishes a foundation for future work.", "url": "https://arxiv.org/abs/2608.21644", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nisarg Trivedi"}, {"name": "Maximilian F.X. Dorfner"}, {"name": "Michel Panhans"}, {"name": "Frank Ortmann"}], "featured_authors": [{"name": "Nisarg Trivedi"}, {"name": "Maximilian F.X. Dorfner"}, {"name": "Michel Panhans"}, {"name": "Frank Ortmann"}], "author_count": 4}, {"id": "2608.21698", "category": "cond-mat", "title": "Non-uniform swelling of polyelectrolyte hydrogels: effects of charge regulation", "abstract": "We investigate the impact of charge regulation (CR) on the non-uniform swelling behavior of polyelectrolyte hydrogels. The Poisson-Boltzmann theory with electro-elastic coupling between the local polymer density and elastic deformation is considered. We investigate the spatial distributions of the elastic displacement and polymer density under different salt concentrations and compare charge-regulated gels with fixed-charge (non-CR) gels of the same net charge. Our results show that the CR induces spatially varying charge fractions, which strengthen the electro-elastic response and lead to stronger non-uniform swelling compared with non-CR gels. These findings provide a theoretical basis for understanding and controlling non-uniform swelling in responsive polyelectrolyte hydrogels.", "url": "https://arxiv.org/abs/2608.21698", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Du Chen"}, {"name": "Rudolph Podgornik"}, {"name": "David Andelman"}, {"name": "Xianghong Wang"}, {"name": "Linli He"}, {"name": "Shigeyuki Komura"}, {"name": "Bin Zheng"}], "featured_authors": [{"name": "Du Chen"}, {"name": "Rudolph Podgornik"}, {"name": "David Andelman"}, {"name": "Linli He"}, {"name": "Shigeyuki Komura"}, {"name": "Bin Zheng"}], "author_count": 7}, {"id": "2608.21753", "category": "cond-mat", "title": "High-Efficiency Ising Machine with Time-Dimensional Exchange Coupling", "abstract": "Conventional probabilistic Ising machines often suffer from inefficient exploration of configuration space, while replica-based quantum Monte Carlo methods reduce sampling bottlenecks at the cost of large hardware overhead. Here we propose a time-dimensional exchange coupling (TEC) that replaces spatial replica coupling with a temporal exchange interaction between successive spin configurations of a single p-bit network. This TEC improves sampling efficiency without duplicating replica hardware. At low temperatures, antiferromagnetic TEC expands sampling range; at high temperatures, ferromagnetic TEC stabilizes the optimal state. For MaxCut problems with up to 2000 vertices, TEC significantly accelerates convergence speed. SPICE simulations confirm hardware feasibility. TEC offers a scalable, hardware-efficient strategy to enhance combinatorial optimization on existing Ising machines.", "url": "https://arxiv.org/abs/2608.21753", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhengyu Du"}, {"name": "Haijie Xu"}, {"name": "Kaiming Cai"}, {"name": "Zhe Yuan"}, {"name": "Yue Zhang"}], "featured_authors": [{"name": "Zhengyu Du"}, {"name": "Haijie Xu"}, {"name": "Kaiming Cai"}, {"name": "Zhe Yuan"}, {"name": "Yue Zhang"}], "author_count": 5}, {"id": "2608.21759", "category": "cond-mat", "title": "Dynamic Magnetic Pair-Density Function of a One-Dimensional Ferromagnet", "abstract": "The dynamic magnetic pair-density function (DymPDF) $D_{\\rm M}(r, E)$ is derived by extending the static magnetic pair distribution function (mPDF) to finite energy transfer. The analytical DymPDF of a one-dimensional Heisenberg ferromagnet is obtained from the magnon dispersion and compared with simulations performed using {\\textsc SpinW}. Excellent agreement is achieved for energy dependence of the nearest-neighbor spin-pair correlation, demonstrating that the DymPDF changes sign at the magnon-mode transition occurring at one-half of the maximum magnon energy. The real-space DymPDF at low energy is also reproduced with a model including finite instrumental resolution, magnetic correlation length, and Fourier-termination effects. These results establish the theoretical foundation of DymPDF analysis for investigating local spin dynamics in magnetic materials.", "url": "https://arxiv.org/abs/2608.21759", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shin-ichi Shamoto"}], "featured_authors": [{"name": "Shin-ichi Shamoto"}], "author_count": 1}, {"id": "2608.21768", "category": "cond-mat", "title": "Breakdown of Aharonov-Bohm cage in Rydberg synthetic lattices: the roles of inhomogeneity and long-range exchange", "abstract": "While the interaction-induced breakdown of Aharonov-Bohm (AB) cage is typically attributed to uniform bound-pair transport, systems with inhomogeneous exchange interactions realized with Rydberg synthetic lattices exhibit more complex dynamics. Employing the evolution-path symmetry (EPS) framework developed recently, we analyze the two-particle dynamics via path interference in Fock space. We find that a homogeneous nearest-neighbor exchange interaction cannot break the AB cage, regardless of whether the long-range exchange interaction is present or not. In contrast, we demonstrate that inhomogeneous nearest-neighbor exchange interaction breaks the destructive-interference EPS, and lifts the degeneracy of many-body compact localized states, thereby generating non-local dispersive eigenstates. Consequently, the initial state gains a non-zero overlap with these dispersive states, enabling delocalized transport. Furthermore, while long-range exchange interaction alone preserves the AB cage, its coupling with nearest-neighbor inhomogeneous exchange interaction opens non-canceling pathways that alter the diffusion profile. Our work connects microscopic path interference with macroscopic spectral reorganization, offering an analytical understanding of the mechanism underlying exchange-interaction-induced transport in Rydberg synthetic lattices.", "url": "https://arxiv.org/abs/2608.21768", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Li Pan"}, {"name": "Xinlu Chen"}, {"name": "Hong Zhang"}, {"name": "Jian-Song Pan"}], "featured_authors": [{"name": "Li Pan"}, {"name": "Xinlu Chen"}, {"name": "Hong Zhang"}, {"name": "Jian-Song Pan"}], "author_count": 4}, {"id": "2608.21781", "category": "cond-mat", "title": "Nonequilibrium statistics of harmonically trapped run-and-tumble particles: An exact convolution approach", "abstract": "We study one-dimensional run-and-tumble particles confined by a harmonic potential and coupled to an equilibrium thermal bath. Exploiting the coupling of active and thermal degrees of freedom through the Ornstein-Uhlenbeck propagator, we show that the position distribution factorizes, as a convolution, into the Ornstein-Uhlenbeck distribution and the distribution of the athermal run-and-tumble problem. This yields closed-form results, correcting expressions from earlier treatments by identifying the Ornstein-Uhlenbeck propagator, rather than the free-diffusion one, as the correct kernel. Results are confirmed both in Fourier space and by direct Langevin simulation. We further focus our analysis on the stationary regime, characterized by two dimensionless parameters--the ratio of trapping to persistence length, and the ratio of thermal to active diffusion--which control the crossover from a non-Gaussian, boundary-peaked distribution to the Gaussian, equilibrium-like limit. Energy fluctuations and the Kullback-Leibler divergence from the equilibrium distribution quantify the resulting non-equilibrium character of the confined active particle.", "url": "https://arxiv.org/abs/2608.21781", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Francisco J. Sevilla"}, {"name": "Jair A. Meléndez Mora"}], "featured_authors": [{"name": "Francisco J. Sevilla"}, {"name": "Jair A. Meléndez Mora"}], "author_count": 2}, {"id": "2608.21835", "category": "cond-mat", "title": "Monitored free fermions under periodic driving", "abstract": "We investigate analytically and numerically a one-dimensional periodically driven free-fermionic system subjected to monitoring of the local particle density. Based on the analytical approach that describes the long-wavelength physics of the time-dependent Hamiltonian in the field-theoretical language using the nonlinear sigma-model (NLSM), we reveal that driving does not alter the universality class of the problem. As a consequence, the system retains the area-law behavior in the thermodynamic limit, with an intermediate diffusive regime giving rise to logarithmic growth of entanglement entropy for a small monitoring rate. At the same time, driving leads to a renormalization of the bare coupling constant of the NLSM, which controls the space-time ``conductivity'' in the diffusive regime. We derive the analytic form of this renormalization, which becomes particularly strong in the case of a ``maximally symmetric'' drive and sufficiently short driving period. In addition, we employ the Wiener-Hopf method to investigate the ballistic-diffusive crossover. These analytical predictions are corroborated by numerical simulations of the von-Neumann entanglement entropy and the density correlation function. Our numerical results clearly demonstrate that, with an increase in the system size, there are successive crossovers from ballistic to diffusive behavior and ultimately to localization. Furthermore, in the diffusive regime, we observe weak-localization corrections that are in agreement with the analytical predictions of the NLSM. Overall, our results provide a unified analytical and numerical framework for understanding the effects of monitoring in time-modulated fermionic systems, paving a way for broader investigations of driven quantum matter.", "url": "https://arxiv.org/abs/2608.21835", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Aditi Chakrabarty"}, {"name": "Alexander D. Mirlin"}, {"name": "Igor Poboiko"}], "featured_authors": [{"name": "Aditi Chakrabarty"}, {"name": "Alexander D. Mirlin"}, {"name": "Igor Poboiko"}], "author_count": 3}, {"id": "2608.21870", "category": "cond-mat", "title": "Pair Filters in an Extended Hubbard Model at Resonance", "abstract": "We investigate the dynamics of bound pairs in an extended Hubbard model at resonance. We show that a single fermion and a singlet bound pair possess identical dispersion relations and scatter off each other. In contrast, a neighboring doublon pair is dynamically pinned in the strong-interaction regime. Remarkably, a single fermion and a singlet bound pair exhibit fundamentally different scattering behaviors when encountering a pinned doublon pair acting as a scattering center. While the singlet bound pair undergoes perfect transmission, the single fermion is completely reflected. These results demonstrate that a neighboring doublon pair functions as an efficient filter that separates bound pairs from single particles. Numerical simulations fully support the analytical predictions. Our findings provide a dynamical mechanism for generating and manipulating bound-pair states.", "url": "https://arxiv.org/abs/2608.21870", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ensuo Ma"}, {"name": "Zhi Song"}], "featured_authors": [{"name": "Ensuo Ma"}, {"name": "Zhi Song"}], "author_count": 2}, {"id": "2608.21900", "category": "cond-mat", "title": "Extrinsic nonlinear spin currents in spin-orbit coupled systems: A Boltzmann transport study", "abstract": "We develop a semiclassical Boltzmann framework for second-order extrinsic spin transport in the presence of skew scattering. The conventional relaxation-time approximation reduces the full collision integral to a single phenomenological timescale and thereby neglects the angular structure of impurity scattering. While the transport relaxation time primarily characterizes the leading angular harmonic of the nonequilibrium distribution, nonlinear response is sensitive to its higher angular harmonics, which are governed by distinct components of the collision operator. We therefore retain the angular and band dependence of the scattering kernel and decompose both the collision integral and the distribution function into Fourier harmonics. The resulting coupled algebraic equations allow the symmetric and skew-scattering corrections to the distribution function to be obtained recursively order by order in the electric field. We apply this formalism to the gapped surface states of a topological insulator with spin-dependent impurity scattering and evaluate the corresponding second-order extrinsic spin-current response. Our results show that higher angular harmonics of the nonequilibrium distribution and scattering between distinct constant-energy contours play an essential role in extrinsic nonlinear spin transport beyond the single-relaxation-time approximation.", "url": "https://arxiv.org/abs/2608.21900", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jiwei Tian"}, {"name": "Huaqing Huang"}], "featured_authors": [{"name": "Jiwei Tian"}, {"name": "Huaqing Huang"}], "author_count": 2}, {"id": "2608.21990", "category": "cond-mat", "title": "Beyond second-long trajectory of the Trp-cage peptide generated using a Kinetic Monte Carlo model derived from molecular dynamics", "abstract": "We present a kinetic Monte Carlo (KMC) modeling approach to describe the stochastic dynamics of a peptide molecule spanning nanosecond to second timescales. The dynamics of protein conformational changes is interpreted at a local level in terms of dihedral transitions. Taking Trp-cage miniprotein as an example, the KMC model \"learns\" about the transitions from multiple MD trajectories. Training is based on local divide-and-conquer strategy that identifies the discretized backbone dihedral states as building blocks for the conformational space, along with associated transition rates of dihedral flips to describe the conformational state-to-state dynamics. A key feature in our approach is the incorporation of backbone correlations, such that rates are conditioned on the local environment and steric coupling. We show that with the correlations built-in, the KMC model closely matches MD. Such an approach is shown to reach second timescales in a few CPU hours on a standard desktop computer, and can easily yield multiple stochastic realizations of the conformational dynamics. Our KMC model construction scheme should be generally applicable to a wide range of proteins, and can be used for bridging local flexibility to protein-wide dynamics.", "url": "https://arxiv.org/abs/2608.21990", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Abhijit Chatterjee"}, {"name": "Rishav Deb"}, {"name": "Gauri Thapa"}, {"name": "Swati Bhattacharya"}], "featured_authors": [{"name": "Abhijit Chatterjee"}, {"name": "Rishav Deb"}, {"name": "Gauri Thapa"}, {"name": "Swati Bhattacharya"}], "author_count": 4}, {"id": "2608.22006", "category": "cond-mat", "title": "Physics-Constrained Neural Flow Maps for Long-Horizon Prediction of Spin Dynamics", "abstract": "Conventional simulation of current-driven magnetization relies on fine-step integration of the spin-transfer-torque Landau--Lifshitz--Gilbert equation, creating a computational bottleneck in parameter sweeps and control searches. In this work, we propose a physics-constrained neural flow map that learns finite-time dynamics directly on the unit sphere. The model maps the current magnetization, spin-torque strength, and requested time span to a future state in a single forward pass. Tangent-space projection and spherical retraction preserve unit magnetization during recursive, composition-consistent rollout. We validate the framework on single-spin trajectories under in-domain torques and previously unseen but stronger drive. Beyond the training horizon, it achieves an in-domain root mean square error of $0.00425$ with norm drift at the $10^{-7}$ level. The flow outperforms an adapted Long Short-Term Memory (LSTM) in in-domain accuracy and geometric stability, although the LSTM retains slightly lower out-of-distribution state error. The resulting geometry-preserving propagator reduces reliance on fine-step integration and enables physically admissible long-horizon prediction.", "url": "https://arxiv.org/abs/2608.22006", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Haoen Feng"}, {"name": "Shenglan Yuan"}, {"name": "Shirong Lin"}], "featured_authors": [{"name": "Haoen Feng"}, {"name": "Shenglan Yuan"}, {"name": "Shirong Lin"}], "author_count": 3}, {"id": "2608.22074", "category": "cond-mat", "title": "Cross-Temperature Defect Identification in Atomistic Simulations via Multi-Level Domain Alignment", "abstract": "Identifying atomic defects at elevated temperature is difficult because thermal fluctuations blur the local symmetry that both geometric heuristics and supervised classifiers rely on: trustworthy labels exist in low-temperature reference configurations, while the high-temperature regime where robust analysis matters most is effectively unlabeled. We cast this as a cross-temperature domain-shift problem and align the two domains at three levels: an equivariant denoiser at the input level, cross-temperature contrastive learning at the representation level, and a morphology-aware regularizer that steers predictions toward the compact geometry of physical defect structures. Because no atom-wise truth exists at temperature, we further introduce a label-free evaluation suite that scores predicted defect structures along five spatial and physics-based axes, enabling model assessment and selection without high-temperature labels. Near the melting point, the framework identifies vacancies and self-interstitial atoms across face-centered-cubic, body-centered-cubic, and hexagonal-close-packed iron systems with every interstitial localized and zero false detections in every vacancy system against Wigner-Seitz ground truth, with no high-temperature labels used in training. It sustains this fidelity on a million-atom, 2.5 ns trajectory, resolving single vacancy hops and complete Frenkel-pair recombination, and captures grain-boundary phase transformations in aluminum bicrystals, distinguishing two nucleation modes. Multi-level domain alignment thus offers a practical, label-efficient route to temperature-robust structural analysis of large-scale molecular dynamics.", "url": "https://arxiv.org/abs/2608.22074", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yating Fang"}, {"name": "Jungmin Kim"}, {"name": "Qian Qian Zhao"}, {"name": "Pallavi Biswas"}, {"name": "Joshua M. Gonjon"}, {"name": "Ryan B. Sills"}, {"name": "Ahmed Aziz Ezzat"}], "featured_authors": [{"name": "Yating Fang"}, {"name": "Jungmin Kim"}, {"name": "Qian Qian Zhao"}, {"name": "Joshua M. Gonjon"}, {"name": "Ryan B. Sills"}, {"name": "Ahmed Aziz Ezzat"}], "author_count": 7}, {"id": "2608.22091", "category": "cond-mat", "title": "Insight into the molecular dynamics of barocaloric molecular crystals using quasi-elastic neutron scattering", "abstract": "Barocaloric (BC) molecular crystals exhibit order-disorder phase transitions that o9er a promising basis for solid-state heating and cooling. However, rational design of these next-generation materials requires microscopic understanding of the molecular dynamics that drive the transitional entropy change. Quasi-elastic neutron scattering (QENS) techniques including inelastic fixed-window scans (IFWSs) enable the direct probing of such molecular motions throughout thermodynamic phase transitions. Here we present a QENS-IFWS global fitting methodology for systematically investigating the molecular dynamics underpinning BC performance in molecular crystals. We demonstrate this methodology on neopentyl glycol (NPG) and three derivatives spanning chemically distinct routes to dynamical perturbation. By fixing attempt frequencies across samples, we observe measurable differences in the relative activation energies and mobile fractions of hydroxymethyl and full-molecular rotations. The largest observed e9ect is on the hydroxymethyl rotation activation energies, which is closely related to hydrogen bond network stability, ranging from -3.6% to +11.1% in the derivatives compared to pure NPG. The capability of this global fitting strategy to extract subtle variations in molecular rotations highlights QENS as a versatile design tool for guiding BC molecular crystal design.", "url": "https://arxiv.org/abs/2608.22091", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Frederic Rendell-Bhatti"}, {"name": "David Boldrin"}, {"name": "Markus Appel"}, {"name": "Donald A. MacLaren"}], "featured_authors": [{"name": "Frederic Rendell-Bhatti"}, {"name": "David Boldrin"}, {"name": "Markus Appel"}, {"name": "Donald A. MacLaren"}], "author_count": 4}, {"id": "2608.22121", "category": "cond-mat", "title": "Voltage dynamics of spherical membranes from single ion channel currents", "abstract": "Ion channels and pumps drive ion-selective currents through cell membranes at localized sites, yet a cell's electrical state is routinely summarized by a single transmembrane voltage. Combining theory and numerical simulations, we resolve the spatiotemporal dynamics of charge reorganization driven by a localized current on a spherical membrane vesicle. At early times, the response is insensitive to membrane geometry: as in the case of a flat membrane ( arXiv:2407.11947 ; arXiv:2508.14001 ), the transmembrane voltage decays in a monopolar fashion, varying inversely with distance from the source, and crosses over to a dipolar tail that scales as the inverse cube of distance. Under sustained current, this monopolar response spreads outward from the source. Because the vesicle is closed, this response cannot persist indefinitely; once the monopolar front traverses the entire vesicle, the subsequent charging dynamics is dominated by a spatially uniform mode corresponding to capacitive charging of the membrane. We further decompose the bulk potentials into an electrostatic image-charge component that generates the bulk electric fields and a spatially uniform capacitive mode that can be represented as an equivalent circuit. We also derive a nonlocal cable equation governing the transmembrane voltage dynamics and show that the uniform mode is its long-time solution. This work provides a first-principles basis for the electrophysiological simplification of an electrotonically compact cell.", "url": "https://arxiv.org/abs/2608.22121", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sirui Ning"}, {"name": "Joshua B. Fernandes"}, {"name": "Karthik Shekhar"}, {"name": "Kranthi K. Mandadapu"}], "featured_authors": [{"name": "Sirui Ning"}, {"name": "Joshua B. Fernandes"}, {"name": "Karthik Shekhar"}, {"name": "Kranthi K. Mandadapu"}], "author_count": 4}, {"id": "2608.22136", "category": "cond-mat", "title": "Even-harmonic generation from topological edge states in generalized Su-Schrieffer-Heeger models", "abstract": "High-order harmonic generation (HHG) in solids has emerged as a powerful probe of symmetry and topological properties in quantum materials. In this work, we investigate the HHG response in one-dimensional solids with edge or midgap states under global and local illumination. We numerically compute the HHG spectrum for the Su-Schrieffer-Heeger (SSH) model with next-nearest-opposite sublattice hopping, dubbed the extended SSH (ESSH) model, and the Rice-Mele model, a one-dimensional system with broken inversion symmetry introduced via staggered on-site potentials. By contrasting the spectral features of the ESSH and Rice-Mele models under global illumination, our analysis reveals that although midgap states provide additional pathways for transitions, the resulting interference is destructive, leading to spectral features distinct from those of edge states. Furthermore, when a single boundary of the topological insulator is locally illuminated, the HHG spectrum of the edge states exhibits vanishing odd harmonics, leaving even harmonics dominant in the spectrum. We identify this even-harmonic selection rule as a consequence of the zero-energy character of the edge states and the particle-hole symmetry of the system, which enforces even field parity of the zero-mode response. These findings reveal that the spatial location of the laser illumination offers a route to control the symmetry of the system, thereby selectively suppressing or enhancing even- and odd-order harmonics in low-dimensional nanostructures.", "url": "https://arxiv.org/abs/2608.22136", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chi-Ting Liu"}, {"name": "J-S You"}, {"name": "Hsiu-Chuan Hsu"}], "featured_authors": [{"name": "Chi-Ting Liu"}, {"name": "J-S You"}, {"name": "Hsiu-Chuan Hsu"}], "author_count": 3}, {"id": "2608.22206", "category": "cond-mat", "title": "Unified Bonding Entropy Model for Kekulé Graphene Nanoflakes", "abstract": "The open-shell character of Kekulé graphene nanoflakes (GNFs) is conventionally rationalized by the gain of Clar aromatic $\\pi$-sextets upon electron unpairing. While this rule successfully explains many quinoidal diradicaloids, it treats only the maximum number of sextets and neglects the multiplicity and spatial distribution of resonance configurations that realize the same Clar count. Here, we identify a second route to open-shell stabilization in which the maximum Clar-sextet number remains unchanged while the number of accessible Clar resonators increases substantially. We term this mechanism \\emph{Clar-number-invariant resonance-space expansion}. By enumerating closed-shell and open-shell Clar resonators and combining this analysis with a bonding entropy model (BEM), we show that electron unpairing can release closed-shell pairing constraints, enlarge the resonance manifold, and redistribute C--C bond occupancies away from localized single- and double-bond limits. The BEM-predicted number and spatial distribution of unpaired electrons correlate strongly with density-functional-theory diradical character, local magnetic moments, optimized C--C bond lengths, and relative energies across a broad set of GNFs. The resulting framework offers a graph-based and physically transparent route for screening open-shell carbon nanostructures and for designing tunable molecular spins without requiring an increase in the maximum Clar number.", "url": "https://arxiv.org/abs/2608.22206", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chang-Chun He"}, {"name": "Yu-Jun Zhao"}, {"name": "Xiao-Bao Yang"}], "featured_authors": [{"name": "Chang-Chun He"}, {"name": "Yu-Jun Zhao"}, {"name": "Xiao-Bao Yang"}], "author_count": 3}, {"id": "2608.22239", "category": "cond-mat", "title": "Oxygen stoichiometry directs rutile-anatase phase selection through kinetic control of nucleation", "abstract": "Synthesis of a target polymorph remains more empirical than predictive because crystallization often selects the most accessible nucleation pathway rather than the thermodynamically most stable phase. Here, we show that oxygen stoichiometry converts this empirical synthesis variable into a kinetic control parameter for anatase-rutile selection in TiO$_{2-x}$. Enhanced-sampling simulations reveal that oxygen content alters the nucleation-barrier landscape, switching the relative accessibility of anatase and rutile, even while rutile remains thermodynamically favored. Molecular dynamics simulations show the presence of a diffuse intermediate shell around the nucleus, where oxygen deficiency alters Ti-O coordination and connectivity and drives shell-local motif evolution from anatase-like toward rutile-like environments. A coupled-flux model that integrates barrier competition with shell-mediated attachment/exchange yields a relative nucleation-rate map consistent with reported oxygen-dependent synthesis trends. These results establish stoichiometry-controlled intermediate-shell motif evolution as a kinetic origin of polymorph selection and provide a framework for predicting target phases in composition-coupled crystallization.", "url": "https://arxiv.org/abs/2608.22239", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Han Uk Lee"}, {"name": "Hyeon Woo Kim"}, {"name": "Ji Min Kim"}, {"name": "Dong Won Jeon"}, {"name": "Rohan Mishra"}, {"name": "Sung Beom Cho"}], "featured_authors": [{"name": "Han Uk Lee"}, {"name": "Hyeon Woo Kim"}, {"name": "Ji Min Kim"}, {"name": "Dong Won Jeon"}, {"name": "Rohan Mishra"}, {"name": "Sung Beom Cho"}], "author_count": 6}, {"id": "2608.22256", "category": "cond-mat", "title": "Coordinate transformations and matter waves cloaking", "abstract": "Transformation method provides an efficient tool to control wave propagation inside the materials. Using the coordinate transformation approach, we study invisibility cloaks with sphere, cylinder and ellipsoid structures for electronic waves propagation. The underlying physics behind this investigation is the fact that the Schrödinger equation with position-dependent mass tensor and potentials has a covariant form that follows the coordinate transformation. Using this technique we obtain the exact spatial form of the mass tensor and potentials for a variety of cloaks with different shapes.", "url": "https://arxiv.org/abs/2608.22256", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Reza G. Mohammadi"}, {"name": "Ali G. Moghaddam"}, {"name": "Ramin Mohammadkhani"}], "featured_authors": [{"name": "Reza G. Mohammadi"}, {"name": "Ali G. Moghaddam"}, {"name": "Ramin Mohammadkhani"}], "author_count": 3}, {"id": "2608.22282", "category": "cond-mat", "title": "Machine-learning-guided molecular dynamics simulations of point defect evolution in beta-Ga2O3 during ion implantation and annealing", "abstract": "In beta-gallium oxide (beta-Ga2O3), Ga-ion implantation and annealing induce abundant point defects. To overcome conventional Wigner-Seitz (WS) defect analysis limitations, a defect identification algorithm based on similarity matching and DBSCAN clustering is developed for beta-Ga2O3. It distinguishes lattice atoms from defects at high concentrations and identifies eight Ga interstitial configurations (Gaia to Gaih). Comparing SRIM and MD data highlights electronic stopping effects: neglecting them overestimates ion range and defect concentration. Across five fluences (1 to 5 x 10^14 cm-2), 1373 K is the optimal recovery temperature. Multiscale analyses using hydrostatic stress, PRDF, and defect concentration reveal defect evolution. Ga interstitials (Gai) occupy tetrahedral and octahedral sites, driving a defect-mediated phase transition from beta- to gamma-Ga2O3. Increasing fluences reduce beta-phase recovery and increase gamma-phase transformation irreversibly. Oxygen interstitial (Oi) migration is sensitive to annealing temperature, which enhances O-sublattice recrystallization.", "url": "https://arxiv.org/abs/2608.22282", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Huawen Li"}, {"name": "Mengzhi Yan"}, {"name": "Zongwei Xu"}, {"name": "Junlei Zhao"}, {"name": "Jiale Wang"}], "featured_authors": [{"name": "Huawen Li"}, {"name": "Mengzhi Yan"}, {"name": "Zongwei Xu"}, {"name": "Junlei Zhao"}, {"name": "Jiale Wang"}], "author_count": 5}, {"id": "2608.22400", "category": "cond-mat", "title": "Diagnosing and narrowing the simulation-to-real gap in powder X-ray diffraction with a wet-dry agentic loop", "abstract": "Powder X-ray diffraction (PXRD) is the routine probe of crystalline matter, yet its analysis is the rate-limiting step as laboratories automate acquisition. Deep-learning analyzers excel on simulated patterns and degrade on measured ones. This simulation-to-real gap is structural, not additive: synthetic denoising gives no measurable lift on real spectra, whereas correcting a small peak-position drift more than doubles median retrieval correlation. Real-spectrum fine-tuning, peak-aligned reranking, and recalibration narrow what remains and restore the coverage synthetic anchors lose. Xtalyst integrates these in an agent-orchestrated system spanning phase identification, refinement, and calibrated property prediction. On a frozen held-out partition (n=534) each module measured on both splits reproduces its development finding -- including the synthetic-anchor under-coverage, whose magnitude differs between the two pools -- while held-out refinement converges and preserves symmetry without reaching profile-quality fits, and on a diffractometer its wet-dry recommend-rescan-reanalyze loop flips a blinded silicon standard to a gated PASS and changes which minor phase is resolved on a multi-metal alloy.", "url": "https://arxiv.org/abs/2608.22400", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shaoguang Wang"}, {"name": "Weiyu Guo"}, {"name": "Ben Fei"}, {"name": "Xiaohong Shao"}, {"name": "Zhihui Wang"}, {"name": "Wanli Ouyang"}], "featured_authors": [{"name": "Shaoguang Wang"}, {"name": "Weiyu Guo"}, {"name": "Ben Fei"}, {"name": "Xiaohong Shao"}, {"name": "Zhihui Wang"}, {"name": "Wanli Ouyang"}], "author_count": 6}, {"id": "2608.22441", "category": "cond-mat", "title": "Flexo-Strain Engineering of Phonons and Ferrons in Thin Films of Van der Waals Ferrielectrics", "abstract": "The influence of the flexoelectric coupling on the fluctuations of electric polarization and elastic strains can lead to the principal changes of the dispersion law of soft optical and acoustic phonons and ferrons in a bulk van der Waals ferrielectrics. Since the size, gradient and strain effects determine phase diagrams and polarization behavior in thin films, it is reasonable to assume that the flexocoupling and mismatch strains should have a strong influence on the dispersion of phonons and ferrons in thin films of van der Waals ferroelectrics. Using the Landau-Ginzburg-Devonshire approach, in this work we reveal that the dispersion of soft phonons and ferrons is strongly dependent on the sign and magnitude of elastic strains, which originate from the lattice constants mismatch in thin strained films of van der Waals ferrielectric CuInP2S6. In particular, the frequency of acoustic phonons and ferrons tends to zero at nonzero wavevectors k>k_cr, where the critical value of the wavevector k_cr is determined by the mismatch strain, flexoelectric coupling strength and temperature. Zeroing of the acoustic phonon frequency, that appears with increase of tensile strains, indicates a possible emergence of a spatially modulated incommensurate polar phase induced by the flexo-strain effects. Analytical results, derived in this work, open the way for flexo-strain engineering of soft phonon and ferron dispersion in thin films of van der Waals ferrielectrics.", "url": "https://arxiv.org/abs/2608.22441", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anna N. Morozovska"}, {"name": "Eugene A. Eliseev"}, {"name": "Yujie Zhu"}, {"name": "Mykola Yelisieiev"}, {"name": "Hanna V. Shevliakova"}, {"name": "Yulian M. Vysochanskii"}, {"name": "Venkatraman Gopalan"}, {"name": "Long-Qing Chen"}, {"name": "Jia-Mian Hu"}], "featured_authors": [{"name": "Anna N. Morozovska"}, {"name": "Eugene A. Eliseev"}, {"name": "Yujie Zhu"}, {"name": "Venkatraman Gopalan"}, {"name": "Long-Qing Chen"}, {"name": "Jia-Mian Hu"}], "author_count": 9}, {"id": "2608.22489", "category": "cond-mat", "title": "Time reversal of complex evolution on a quantum computer", "abstract": "The Boltzmann-Loschmidt dispute in 1876-1877 discussed the problem of time reversal of ther- malization from time reversible classical equations of motion. Here, 150 years later, we highlight this problem in the frame of quantum computing. A quantum protocol is proposed that allows to perform a time reversal of complex evolution in the regime of many-body quantum chaos with many qubits. The system represents an evolution of qubits on a square lattice with inter-qubit next-nearest static couplings with a driven pulsed magnetic field. The system entropy grows rapidly to maximal values but returns to initial small values after time reversal. This time reversal is shown to be stable with respect to quantum gate imperfections. However, similar to the Lorenz butterfly effect, there is the butterfly effect of qubit when inversion of only one qubit breaks time reversibility of the whole system. It is argued that this protocol is accessible to nowadays quantum computers and annealers with hundreds of qubits.", "url": "https://arxiv.org/abs/2608.22489", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mahdi Kourehpaz"}, {"name": "Dima L. Shepelyansky"}], "featured_authors": [{"name": "Mahdi Kourehpaz"}, {"name": "Dima L. Shepelyansky"}], "author_count": 2}, {"id": "2608.22517", "category": "cond-mat", "title": "Anomalous dynamical energy flows via nonlinear phononics in spin-Peierls chains", "abstract": "We investigate the nonequilibrium spin-phonon dynamics and energy cascades in a strongly dimerized spin-Peierls chain using a multi-tiered nonlinear phononics architecture. To bypass linear selection rules prohibiting the direct excitation of the Raman-active dimerization mode, a terahertz laser drives an infrared mode that nonlinearly couples to the Raman lattice displacement, subsequently modulating the magnetic exchange. Employing a bond-operator formalism with a second-order cumulant expansion of the Lindblad master equation, we show that maximum energy transfer into the magnetic sector is governed by a dynamical impedance-matching condition rather than the unperturbed triplon density of states. We find that the sustained energy input of continuous-wave driving builds high excitation densities that severely back-act on the lattice, overdamping the primary phonon and smearing magnetic features via power broadening. Conversely, the small time-integrated energy of a pulse keeps the response perturbative, terminating before back-action accumulates and preserving sharp Fano-like quantum interferences. These insights establish limits for controlling dynamic magnetic states without quenching the driving lattice modes.", "url": "https://arxiv.org/abs/2608.22517", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jakob Dolgner"}, {"name": "Dirk Manske"}, {"name": "James K. Freericks"}, {"name": "Mohsen Yarmohammadi"}], "featured_authors": [{"name": "Jakob Dolgner"}, {"name": "Dirk Manske"}, {"name": "James K. Freericks"}, {"name": "Mohsen Yarmohammadi"}], "author_count": 4}, {"id": "2608.22567", "category": "cond-mat", "title": "Shapes, forces, and torques of compressed elastic fluid interfaces: beyond axisymmetric configurations", "abstract": "Inspired by the classical Plateau-Douglas problem for soap films bounded by two closed curves, we solve an analogous problem for fluid interfaces with fixed surface area and resistance to out-of-plane bending. The boundaries are planar but need not be symmetric or concentric. The equilibrium surfaces minimize the Willmore bending energy and generalize minimal surfaces such as the catenoid while also exhibiting characteristic features of confined elastic interfaces such as buckling. We systematically classify all possible buckling modes and solution branches by performing a weakly nonlinear analysis and developing a fully nonlinear spectral solver. Our mathematical framework provides insight into the forces and torques required to stabilize cellular membranes and other soft materials and shows that physically relevant asymmetric states can arise even in symmetric systems.", "url": "https://arxiv.org/abs/2608.22567", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xinyi Liu"}, {"name": "Neelesh A. Patankar"}, {"name": "Leroy L. Jia"}], "featured_authors": [{"name": "Xinyi Liu"}, {"name": "Neelesh A. Patankar"}, {"name": "Leroy L. Jia"}], "author_count": 3}, {"id": "2608.22831", "category": "cond-mat", "title": "Antidot superlattices in two-dimensional topological insulators", "abstract": "We investigate the electronic properties of a two-dimensional topological insulator patterned with an array of circular holes. The band structures of the topological insulator superlattices are calculated using the Bernevig-Hughes-Zhang model, discretized with the finite element method. The band topology is studied using the Fukui-Hatsugai-Suzuki method, exploiting the fact that topological charge is conserved when a band gap closes and reopens. We find that when the holes are close to each other and the edge states overlap significantly, the material loses its topological character and becomes a trivial insulator. The results show that patterning topological insulators changes their properties, and this can be achieved with a feature size compatible with current lithographic techniques. This shows the potential to incorporate patterned topological insulators in future electronics.", "url": "https://arxiv.org/abs/2608.22831", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Haolin Huang"}, {"name": "Jackson S. Smith"}, {"name": "Fabio Taddei"}, {"name": "Michele Governale"}, {"name": "Jared H. Cole"}], "featured_authors": [{"name": "Haolin Huang"}, {"name": "Jackson S. Smith"}, {"name": "Fabio Taddei"}, {"name": "Michele Governale"}, {"name": "Jared H. Cole"}], "author_count": 5}, {"id": "2608.22867", "category": "cond-mat", "title": "Note on Boltzmann's H-Theorem and Detailed Balance Dynamics", "abstract": "The Boltzmann H-theorem states that entropy of an ensemble of thermodynamic states increases until all states become equally probable. The evolution randomly picks one of the states in the ensemble and brings every other state to have the same probability as the selected state. Different realizations of evolution yield a distribution of selected states. We study this distribution numerically and discuss its relevance for equilibrium fluctuations in thermal as well as non thermal systems.", "url": "https://arxiv.org/abs/2608.22867", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Prabodh Shukla"}], "featured_authors": [{"name": "Prabodh Shukla"}], "author_count": 1}, {"id": "2608.22875", "category": "cond-mat", "title": "Fidelity susceptibility of Su-Schrieffer-Heeger model with further neighbour hopping term", "abstract": "In this study, topological phase transition in Su-Schrieffer-Heeger (SSH) model with a further neighbour hopping term has been studied in terms of fidelity susceptibility. Topological phase transition point in the standard SSH model has been identified before by noting the divergence of fidelity susceptibility. The same approach has been employed here where fidelity susceptibility is found to diverge at the phase transition points. Additionally, effect of staggered potential on the fidelity susceptibility has been explored. Analytic expression for fidelity susceptibility has been obtained along with its numerical estimation on finite chains by exact diagonalization. Fidelity susceptibility exhibits sharp peaks at the phase transition points in both approaches. Scaling exponent of this divergence has been obtained numerically which is found to agree to that of the standard SSH model without further neighbour terms.", "url": "https://arxiv.org/abs/2608.22875", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Surajit Mandal"}, {"name": "Asim Kumar Ghosh"}], "featured_authors": [{"name": "Surajit Mandal"}, {"name": "Asim Kumar Ghosh"}], "author_count": 2}, {"id": "2608.22878", "category": "cond-mat", "title": "Spontaneous currents determine capillary rise in active matter", "abstract": "The capillary rise of simple passive fluids in a tube is controlled by the force balance between surface tension and gravity --Jurin's law of capillary action. For fluids composed of active particles interacting via pairwise forces, mechanical surface tension is negative, but a capillary rise was nevertheless reported and remains unexplained. We establish the active form of Jurin's law from the microscopic dynamics. It includes a drag emerging from particle currents that we find responsible for capillary rise. These active currents, alongside negative surface tension, lead to complex and counterintuitive capillary action phenomena that are impossible in equilibrium. In particular the capillary rise of active fluids depends on the shape of the tube, not solely on the tube diameter.", "url": "https://arxiv.org/abs/2608.22878", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xinyi Dong"}, {"name": "Yongfeng Zhao"}], "featured_authors": [{"name": "Xinyi Dong"}, {"name": "Yongfeng Zhao"}], "author_count": 2}, {"id": "2608.22902", "category": "cond-mat", "title": "Revised symmetry rule and intrinsically time-reversal symmetry breaking pairing in multi-orbital superconductors", "abstract": "We investigate the basic symmetry rule for the particle permutation in superconducting (SC) pairing states by examining the numerical solution of the linearized Eliashberg equation for Sr$_2$RuO$_4$. We find that the general multi-band, frequency-dependent SC gap function does not simply transform to itself up to the minus sign with either orbital ($\\hat{O}$) or frequency ($\\hat{T}$) exchange between two pairing electrons, contradicting the common assumption which has been used without verification. It originates from the fact that paring interactions are not invariant under the $\\hat{O}$ or $\\hat{T}$ operation, and is demonstrated to be essential to correctly interpret and understand multi-band SC states. One of unique properties implied by our newly found symmetry rule is the possibility of the complex eigenvalue in the linearized gap equation where the corresponding gap functions $\\Delta$ always have real and imaginary components both non-zero in real frequencies, inherently breaking the time-reversal symmetry. Our numerical results suggest the possibility of this unique pairing in a real material, Sr$_2$RuO$_4$, for which the Hundness of the material is found to play a key role. The revised symmetry rule not only leads us to more comprehensive understanding of the known SC states, but also opens new possibilities into exotic and unique states.", "url": "https://arxiv.org/abs/2608.22902", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chang-Youn Moon"}], "featured_authors": [{"name": "Chang-Youn Moon"}], "author_count": 1}, {"id": "2608.22934", "category": "cond-mat", "title": "Coarse-grained kinetic scale tightens thermodynamic spectral bounds of Markov cycles", "abstract": "Thermodynamic bounds on the spectrum of a Markov cycle depend on the cycle affinity and maximum escape rate, but they ignore how the local transition rates are distributed around the cycle. In this work, we show that a single additional cycle-wide kinetic quantity, the geometric means of forward and backward rates, yields a strictly stronger bound for every nonuniform cycle. By comparing each winding sector of the eigenmode with a product-matched uniform cycle, we bound oscillation frequencies, tighten the admissible spectral region, and show that only uniform cycles can saturate the Uhl-Seifert boundary. Our results show that retaining a coarse-grained kinetic scale can sharpen thermodynamic spectral bounds without requiring knowledge of the full generator. Our method also provides a complex-analytic framework which unifies generator-specific kinetic information with established affinity-winding bounds.", "url": "https://arxiv.org/abs/2608.22934", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rongxing Xu"}, {"name": "Cuiling Meng"}], "featured_authors": [{"name": "Rongxing Xu"}, {"name": "Cuiling Meng"}], "author_count": 2}, {"id": "2608.23003", "category": "cond-mat", "title": "Displacement-field-driven reconstruction of low energy transport in few-layer PtSe2", "abstract": "In layered semiconductors, a perpendicular displacement field generates an interlayer potential difference that competes with interlayer hybridization, modifying both the band gap and the finite-density electronic states that carry current. Resolving this interplay requires a material lying close to the semiconductor-to-semimetal transition, where moderate electric fields can strongly reshape the low-energy electronic structure. Here, we investigate displacement-field-driven transport in dual-gated semiconducting PtSe2, whose pronounced thickness-dependent electronic structure provides access to this low-band-gap regime. Unlike thinner layers, the displacement-field response is strong in six-layer PtSe2, which lies at the verge of the semiconductor-to-semimetal crossover with only a small residual transport gap. Even weak displacement fields rapidly suppress this residual gap near charge neutrality, driving the system toward a band-overlap regime. At the same time, the conductivity decreases in the heavily hole-doped regime, demonstrating that the displacement field modifies not only the gap but also the conducting valence-band states. Fixed-relaxation-time Wannier transport calculations reproduce both responses, showing that they originate from field-induced band overlap together with reconstruction of the valence-band dispersion. These results establish finite-density transport as a sensitive probe of displacement-field-driven electronic structure reconstruction and extend electrical control beyond conventional band-gap engineering.", "url": "https://arxiv.org/abs/2608.23003", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xiao Liu"}, {"name": "Yaroslav Zhumagulov"}, {"name": "Yuang Jie"}, {"name": "Ahmet Enes Bozcali"}, {"name": "Johan Felisaz"}, {"name": "Qi Zhang"}, {"name": "Oldvrich Cicvarek"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Zdeněk Sofer"}, {"name": "Oleg V. Yazyev"}, {"name": "Ahmet Avsar"}], "featured_authors": [{"name": "Xiao Liu"}, {"name": "Yaroslav Zhumagulov"}, {"name": "Yuang Jie"}, {"name": "Zdeněk Sofer"}, {"name": "Oleg V. Yazyev"}, {"name": "Ahmet Avsar"}], "author_count": 12}, {"id": "2608.23080", "category": "cond-mat", "title": "X-ray driven displacive excitation of coherent phonons", "abstract": "Modulating electron-phonon coupling offers a route to control structural displacements and tune material functionality. Valence-to-conduction band transitions, however, provide limited leverage over the driving force. Here, we demonstrate coherent lattice dynamics in trigonal tellurium using free-electron laser pulses tuned to the Te N4,5-edge. Over a broad fluence range, the oscillation amplitude obeys the displacive excitation of coherent phonons framework, extended to core resonance with twice the driving efficiency of a visible pump. Ab initio calculations decompose the force into competing multiband contributions, inaccessible to optical excitation, whose balance shifts as carriers relax. Tunable extreme-ultraviolet and X-ray pulses thus open a regime in which the displacive response is set by band-dependent coupling to the lattice, not by the number and temperature of the photocarriers alone.", "url": "https://arxiv.org/abs/2608.23080", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Oleg Dogadov"}, {"name": "Remi Claude"}, {"name": "Christoph Emeis"}, {"name": "Giovanni Batignani"}, {"name": "Giuseppe Fumero"}, {"name": "Roberto Costantini"}, {"name": "Agata Azzolin"}, {"name": "Sabine Rockenstein"}, {"name": "Paolo Cattaneo"}, {"name": "Rebeca Gomez Castillo"}, {"name": "Matteo Manzi"}, {"name": "Angelo Giglia"}, {"name": "Dario De Angelis"}, {"name": "Ettore Paltanin"}, {"name": "Zeinab Ebrahimpour"}, {"name": "Marija Krstulovic"}, {"name": "Gabor Kurdi"}, {"name": "Miltcho Danailov"}, {"name": "Luca Giannessi"}, {"name": "Riccardo Mincigrucci"}, {"name": "Emiliano Principi"}, {"name": "Alberto Crepaldi"}, {"name": "Giulio Cerullo"}, {"name": "Giovanni De Ninno"}, {"name": "Claudio Masciovecchio"}, {"name": "Laura Foglia"}, {"name": "Tullio Scopigno"}, {"name": "Fabrizio Carbone"}, {"name": "Francesca Calegari"}, {"name": "Fabio Caruso"}, {"name": "Michele Puppin"}, {"name": "Oliviero Cannelli"}], "featured_authors": [{"name": "Oleg Dogadov"}, {"name": "Remi Claude"}, {"name": "Christoph Emeis"}, {"name": "Fabio Caruso"}, {"name": "Michele Puppin"}, {"name": "Oliviero Cannelli"}], "author_count": 32}, {"id": "2608.23083", "category": "cond-mat", "title": "Three-dimensional Ising superconductors designed via inversion-symmetry breaking in intercalated NbSe$_2$ and NbTe$_2$", "abstract": "Ising superconductors exhibit in-plane upper critical fields far exceeding the Pauli paramagnetic limit, a hallmark first established in two-dimensional (2D) monolayer transition-metal dichalcogenides (TMDs). This field resilience requires the coexistence of strong spin-orbit coupling (SOC) and broken inversion symmetry, yet three-dimensional (3D) bulk realizations remain scarce because equilibrium stacking typically restores inversion symmetry. Here we demonstrate that intercalation provides a practical route to break this symmetry, systematically designing 16 NbSe$_2$- and NbTe$_2$-based compounds from four intercalants (In, Sn, Pb, Bi) across two polytypes: non-centrosymmetric $P\\bar{6}m2$ and centrosymmetric $P6_3/mmc$. Four compounds in the $P\\bar{6}m2$ phase, InNbSe$_2$, SnNbSe$_2$, PbNbSe$_2$, and PbNbTe$_2$, emerge as promising 3D Ising superconductors. They exhibit SOC splittings of 80-100 meV near the Fermi level, dominant out-of-plane spin polarization, and anisotropic superconductivity with $T_c=2.6$-$5.4$ K. Notably, spin-texture analysis reveals that the efficiency of Ising protection is governed not by the magnitude of SOC splitting alone but by the out-of-plane spin purity on the Fermi surface. Bogoliubov-de Gennes (BdG) calculations predict in-plane upper critical fields reaching 4-7 times the Pauli limit. These findings establish intercalation as a promising symmetry-engineering strategy for realizing 3D Ising superconductors in TMDs.", "url": "https://arxiv.org/abs/2608.23083", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wenqian Tu"}, {"name": "Run Lv"}, {"name": "Xiaoying Li"}, {"name": "Li'e Liu"}, {"name": "Dingfu Shao"}, {"name": "Yuping Sun"}, {"name": "Wenjian Lu"}], "featured_authors": [{"name": "Wenqian Tu"}, {"name": "Run Lv"}, {"name": "Xiaoying Li"}, {"name": "Dingfu Shao"}, {"name": "Yuping Sun"}, {"name": "Wenjian Lu"}], "author_count": 7}, {"id": "2608.23112", "category": "cond-mat", "title": "Z1 oscillations and charge state in electronic stopping power from first principles", "abstract": "The energy transfer rate from a projectile nucleus to the electrons of the matter it traverses depends on the charge of that projectile, Q= e Z1. At low projectile velocities the friction coefficient is known to oscillate with atomic number Z1, since core electrons travel with the projectile screening its charge. The effective charge increases with velocity and oscillations disappear. That effect is studied here calculating electronic stopping power from first principles for O and Mg projectiles shooting through bulk Al, using real-time time-dependent density-functional theory. Both projectiles represent maximum and minimum of the first Z1 oscillation, respectively. The oscillation is found to be very sensitive to the direction of propagation, in spite of Al being quite an ideal metal for many purposes. The critical velocity for the oscillation disappearance ranges between below 0.1 a.u. and beyond 1 a.u. for the explored trajectories. The charge state is independently quantified with Hirshfeld and Voronoi analyses, offering remarkably consistent results in spite of their very different partition methods, as well as with an effective definition based on the stopping power itself. They display a gradual undressing of the projectile's core electrons with increasing velocity in qualitative accordance with expectations. However, electron density plots in real space present a richer picture in which the undressing is partly due to the electrons trailing behind the projectile, suggesting possible phenomenological descriptions correcting for the deformation of the density in terms of multipoles beyond the net charge. The plots also offer insights into dissipation by core electrons.", "url": "https://arxiv.org/abs/2608.23112", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Noor Ul Ain"}, {"name": "Emilio Artacho"}], "featured_authors": [{"name": "Noor Ul Ain"}, {"name": "Emilio Artacho"}], "author_count": 2}, {"id": "2608.23130", "category": "cond-mat", "title": "Multiscale Quasiparticle Electronic Structure and Excitonic Properties of CdSe Nanoclusters", "abstract": "Quantum confinement in stoichiometric $\\mathrm{Cd}_n\\mathrm{Se}_n$ nanoclusters dramatically attenuates electronic screening, driving a delicate, size-dependent competition between quasiparticle self-energy corrections ($\\Delta_{\\mathrm{QP}}$) and exciton binding energies ($E_b$). Here, we present a $GW$/BSE study across a representative size series ($n = 3, 6, 13, 33$) and leverage it to validate a scalable atomistic tight-binding (TB) framework derived from first principles. Our results demonstrate that 1-2 eV spectral blueshifts previously reported in the literature arise from single-particle $GW$ convergence artifacts rather than deficiencies in the electron--hole kernels. We show that the near-perfect cancellation between $\\Delta_{\\mathrm{QP}}$ and $E_b$ breaks down as cluster volume increases, driven by the rapid onset of dielectric screening attenuating $E_b$ faster than $\\Delta_{\\mathrm{QP}}$ and leading to a pronounced divergence from mean-field predictions. Spatial inverse participation ratio analysis of the electronic structure reveals that optical suppression of fundamental pre-peaks stems from a severe spatial mismatch between localized valence orbitals and delocalized conduction states. Finally, we demonstrate that the confinement-induced scaling of the quasiparticle gap and the optical onset is accurately reproduced by a scissor-corrected, DFT-parameterized TB model. As such, this work provides a quantitative multiscale roadmap for embedding effective many-body effects kernels into computationally efficient models, enabling reliable optical predictions for realistic semiconducting nanostructures containing up to thousands of atoms.", "url": "https://arxiv.org/abs/2608.23130", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Surender Kumar"}, {"name": "Martin Thümmler"}, {"name": "Alexander Croy"}, {"name": "Stefanie Gräfe"}, {"name": "Caterina Cocchi"}], "featured_authors": [{"name": "Surender Kumar"}, {"name": "Martin Thümmler"}, {"name": "Alexander Croy"}, {"name": "Stefanie Gräfe"}, {"name": "Caterina Cocchi"}], "author_count": 5}, {"id": "2608.23151", "category": "cond-mat", "title": "Impact of Carbon Contamination on the Low-Temperature Electric Conduction of the Spark-Plasma Sintered Barium Titanate Ceramics", "abstract": "The dielectric and electric conduction properties of BaTiO3 samples fabricated by the spark plasma sintering with additional contamination by different content of carbon have been investigated in the temperature range from 77 through 408 K in small non-heating electric fields and in the range of 77 - 200K under strong electric fields up to 20 kV/cm. The effective dielectric permittivity of the samples with additional carbon achieves colossal values at low frequency, up to several units per 106 at 393 K. In the low temperature range, it remains very high magnitude, 10^4 -10^5 at low frequency and is strongly dependent on the carbon content. The electric conduction in the range of 77 - 200 K bears the hopping conduction and obeys the Mott law. We also studied electric conduction and effective dielectric permittivity vs electric field strength in the range of 77 - 200 K. The results are explained within the frames of hopping conduction theory and suggestion on different constituents in polarization processes and electric conduction.", "url": "https://arxiv.org/abs/2608.23151", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Oleksandr S. Pylypchuk"}, {"name": "Taisiia O. Kuzmenko"}, {"name": "Denis O. Stetsenko"}, {"name": "Oleksyi V. Bereznykov"}, {"name": "Serhii E. Ivanchenko"}, {"name": "Ihor M. Danylenko"}, {"name": "Anna N. Morozovska"}, {"name": "Vladimir N. Poroshin"}, {"name": "Victor V. Vainberg"}], "featured_authors": [{"name": "Oleksandr S. Pylypchuk"}, {"name": "Taisiia O. Kuzmenko"}, {"name": "Denis O. Stetsenko"}, {"name": "Anna N. Morozovska"}, {"name": "Vladimir N. Poroshin"}, {"name": "Victor V. Vainberg"}], "author_count": 9}, {"id": "2608.23157", "category": "cond-mat", "title": "First-Principles Spin-Lattice Coupling from Downfolded Electron-Phonon Interaction", "abstract": "We present a method to calculate spin-phonon coupling parameters from first-principles perturbation theory by downfolding the electron-phonon coupling (EPC). We exploit the localized nature of magnetic moments and atomic displacements by working in the Wannier representation of the electronic Hamiltonian and the EPC matrix. The spin system is mapped to a classical Heisenberg Hamiltonian, whose parameters are obtained by treating local spin rotations as a perturbation within a Green's-function formalism. The spin and phonon perturbations are connected through the EPC parameters, which enter as lattice-induced perturbations to the tight-binding Hamiltonian. By combining these lattice perturbations with local spin rotations, we obtain real-space derivatives of magnetic exchange parameters without performing displaced magnetic supercell calculations. We illustrate the method on SrMnO$_3$ and show that it can be integrated directly into standard workflows.", "url": "https://arxiv.org/abs/2608.23157", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xu He"}, {"name": "Álvaro Adrián Carrasco Álvarez"}, {"name": "Gian-Marco Rignanese"}, {"name": "Eric Bousquet"}, {"name": "Samuel Poncé"}, {"name": "Matthieu J. Verstraete"}], "featured_authors": [{"name": "Xu He"}, {"name": "Álvaro Adrián Carrasco Álvarez"}, {"name": "Gian-Marco Rignanese"}, {"name": "Eric Bousquet"}, {"name": "Samuel Poncé"}, {"name": "Matthieu J. Verstraete"}], "author_count": 6}, {"id": "2608.23160", "category": "cond-mat", "title": "Quantics tensor cross interpolation for high-order strong-coupling expansions", "abstract": "Real-time impurity solvers enable the study of transport phenomena and the description of nonequilibrium lattice systems within the framework of dynamical mean-field theory (DMFT). They also provide direct access to the spectral functions of both equilibrium and nonequilibrium systems. A widely used approach is the self-consistent strong-coupling expansion, whose lowest-order implementation corresponds to the non-crossing approximation. Higher-order implementations, however, are computationally demanding because the number of diagram topologies grows factorially with expansion order, while the evaluation of self-energies and Green's functions requires increasingly high-dimensional integrations. Here, we demonstrate that the latter challenge can be mitigated by employing quantics tensor cross interpolation in a variable-separated framework. Compared with the previously used scale-separated approach, the new scheme yields substantially lower bond dimensions and capacitates self-consistent steady-state DMFT calculations up to fourth order. We illustrate its performance with representative results for both equilibrium and photo-doped systems. In addition, we analyze the convergence of the strong-coupling expansion in the challenging noninteracting limit by computing diagrams up to sixth order. At this order, the onset of the asymptotic regime of the strong-coupling expansion becomes apparent, which allows the application of extrapolation techniques.", "url": "https://arxiv.org/abs/2608.23160", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kanghyeon Kim"}, {"name": "Lei Geng"}, {"name": "Philipp Werner"}, {"name": "Aaram J. Kim"}], "featured_authors": [{"name": "Kanghyeon Kim"}, {"name": "Lei Geng"}, {"name": "Philipp Werner"}, {"name": "Aaram J. Kim"}], "author_count": 4}, {"id": "2608.23246", "category": "cond-mat", "title": "Enhanced intrinsic spin-orbit driving of a Loss-DiVincenzo qubit near the spin-valley hotspot in Si/SiGe", "abstract": "In most Si/SiGe-based spin qubit
