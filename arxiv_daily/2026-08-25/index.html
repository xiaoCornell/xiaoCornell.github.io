vitating systems such as stars or subsystems of strongly interacting quantum systems are known to have negative or anomalous specific heat capacities. In this work, we investigate how the presence of entanglement at equilibrium can influence how an interacting system responds energetically to changes in temperature. We examine the local heat capacity of interacting quantum systems providing an analytical understanding for when anomalies occur. Most interestingly, we find a connection between local heat capacity anomalies and entanglement by deriving a separability bound based on the fluctuations of local and interaction energies. We illustrate our results with two examples (i) a nearest neighbour spin-1/2 chain and (ii) two coupled quantum harmonic oscillators. Lastly, we provide an information-theoretic formula connecting mutual information and athermality to the non-additivity of the heat capacity. Our results provide model-independent thermodynamic entanglement detection bounds and insight into the relationship between quantum correlations and the heat capacity of quantum systems.", "url": "https://arxiv.org/abs/2608.21508", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jake Xuereb"}, {"name": "A. de Oliveira Junior"}], "featured_authors": [{"name": "Jake Xuereb"}, {"name": "A. de Oliveira Junior"}], "author_count": 2}, {"id": "2608.21700", "category": "quant-ph", "title": "Scalable quantum simulation of continuous-time generative models via tensor networks", "abstract": "Continuous-time flow and diffusion models are widely used across many application domains, from large-scale deployment in computer vision and protein folding to emerging adoption for modeling language, time series, and quantum states. After training, inferring statistical properties from continuous-time models is costly. Wavefunction flows target this cost by recasting learned transport as unitary evolution, whose final Born distribution approximates the target distribution. This prepares a coherent amplitude encoding (a qsample) that can be post-processed by quantum algorithms offering a quadratic advantage over Monte Carlo sampling. We present the first numerical study of these flows, in which we represent time-dependent potentials and states as tensor networks. At spatial dimension $d=8$, storage falls by $\\sim 10^7\\times$ relative to the dense grid of $N^d$ points, and evolution wall-clock time falls by $\\gtrsim 10^3\\times$ against a baseline extrapolated from the measured $d\\le 5$ scaling. We validate our pipeline by reproducing the $O(1/\\sqrt{p_{\\rm rare}})$ scaling of rare-event sampling.", "url": "https://arxiv.org/abs/2608.21700", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nathan X. Kodama"}, {"name": "L. Andrew Wray"}, {"name": "Sam Cochran"}, {"name": "Chad Rigetti"}, {"name": "Shravan Veerapaneni"}, {"name": "Michael J. Keiser"}], "featured_authors": [{"name": "Nathan X. Kodama"}, {"name": "L. Andrew Wray"}, {"name": "Sam Cochran"}, {"name": "Chad Rigetti"}, {"name": "Shravan Veerapaneni"}, {"name": "Michael J. Keiser"}], "author_count": 6}, {"id": "2608.21765", "category": "quant-ph", "title": "Markov Constraints Enhance Identifiability in Quantum Shadow Inversion", "abstract": "We study quantum shadow inversion under Markovian locality constraints for four-partite systems arranged along the chain $A$--$B$--$C$--$D$. The goal is to reproduce the expectation value of a fixed endpoint observable $O_{AD}$ after an unknown global unitary, without requiring full unitary inversion. We formulate the task using Markov-admissible supermaps and introduce the Markov-implementable centralizer to describe the remaining endpoint gauge freedom. We show that unrestricted endpoint post-processing is too broad, and impose an endpoint-local refinement. Under this condition, every implementable endpoint unitary must factorize across $A|D$, so the Markov constraint strictly reduces the centralizer-induced shadow ambiguity whenever the full centralizer contains non-product unitaries. This provides a structural mechanism by which Markov locality enhances identifiability in quantum shadow inversion.", "url": "https://arxiv.org/abs/2608.21765", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhixing Chen"}, {"name": "Lin Chen"}], "featured_authors": [{"name": "Zhixing Chen"}, {"name": "Lin Chen"}], "author_count": 2}, {"id": "2608.21842", "category": "quant-ph", "title": "Noise-Symmetry Optimization of Quantum Error-Corrected Metrology", "abstract": "Quantum error correction (QEC) codes have emerged as a powerful tool to protect quantum-enhanced metrology against noise. However, the ability to correct errors alone does not guarantee high metrological sensitivity, as the encoded states may become insensitive to the parameter of interest. Here we show that this limitation can be overcome by exploiting an intrinsic freedom of QEC codes: for a fixed set of correctable errors, the Knill-Laflamme conditions admit an equivalence class of encodings. When the correctable noise possesses unitary symmetries, these symmetries generate continuous transformations within this class, allowing systematic optimization of the encoding to increase the quantum Fisher information while preserving the correctable set of noise. Based on this observation, we develop a symmetry-based optimization approach and derive criteria identifying when such optimization can enhance metrological sensitivity. In particular, for stabilizer-sum Hamiltonians, symmetry optimization can convert a code with vanishing QFI into one achieving the standard quantum limit in general or even Heisenberg scaling in specific cases, illustrating the power of symmetry optimization for QEC-assisted quantum metrology.", "url": "https://arxiv.org/abs/2608.21842", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shuyun Su"}, {"name": "Shengshi Pang"}], "featured_authors": [{"name": "Shuyun Su"}, {"name": "Shengshi Pang"}], "author_count": 2}, {"id": "2608.21902", "category": "quant-ph", "title": "Belief Propagation-based Disentanglers for Tensor Network State Preparation", "abstract": "We develop a quantum circuit synthesis method for preparing a class of tensor network states. The scheme applies to states tractable with belief propagation (BP), a tensor network gauging scheme which recently allowed for classical simulations at large scales. The problem is reduced to independent, strictly local, classical variational optimizations: each nearest-neighbor two-qubit \"disentangler\" gate minimizes the entropy defined on an edge. Disentanglers drive the state to a product state and their Hermitian conjugate prepares the target. Each disentangling layer has depth at most $z+1$ (with $z$ the maximal number of nearest neighbors per site), the optimization has no barren plateaus, and the bond dimension stays bounded. As a demonstration, with only $3$-$5$ disentangling layers we prepare a $102$-qubit tree tensor network encoding a $17$-dimensional normal distribution and the transverse-field Ising model ground states on a $64$- to $127$-qubit heavy-hex lattice with fidelities of order $0.9-0.999$. The method opens new possibilities for quantum applications by transferring classical tensor network states onto hardware.", "url": "https://arxiv.org/abs/2608.21902", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tomasz Szołdra"}, {"name": "Peter Schmelcher"}], "featured_authors": [{"name": "Tomasz Szołdra"}, {"name": "Peter Schmelcher"}], "author_count": 2}, {"id": "2608.21904", "category": "quant-ph", "title": "How Far Can You Do Nothing On a Quantum Computer?", "abstract": "We present a route-resolved comparative assessment of Rigetti's Cepheus-1-108Q and IBM Heron-r2 processors using the established 'do-nothing' state-transfer protocol. Rather than proposing a new protocol, we use this deterministic, low-complexity task as a high-resolution spatial probe. For each evaluated initial qubit, we report two complementary quantities: the largest tested radius within which every evaluated shortest route satisfies the operational success rule, and the longest successful route identified within the evaluated route family. To achieve this, we address a deceptively simple yet foundational question: ``How far can you do-nothing on a quantum computer?'' Operationally, this do-nothing protocol serves as a fundamental state transfer protocol: we prepare an initial quantum state, route it across the physical qubits using SWAP gates, and measure the final state fidelity against the well-established classical fidelity limit for single-qubit state transfer. While this trivial state-transfer protocol serves as the most intuitive baseline, actively preserving a quantum state across a physical lattice proves to be a non-trivial task that exposes the information to cumulative relaxation, dephasing, and environmental cross-talk. In the highlighted IBM QPU case, we identify an isotropic radius of 10 and a successful path of swap distance 27, whereas the highlighted Rigetti Cepheus case exhibits an isotropic radius of 1 but selected above-threshold routes reaching swap distance 8. These results reveal a sharp distinction between uniform spatial reliability and best-route performance. The presented quantities are empirical and conditional on the evaluated route families, finite-shot decision rule, calibration state, and execution time; they are not architecture-wide constants.", "url": "https://arxiv.org/abs/2608.21904", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nitay Mayo"}, {"name": "Tal Mor"}, {"name": "Aryeh Lev Zabokritskiy"}], "featured_authors": [{"name": "Nitay Mayo"}, {"name": "Tal Mor"}, {"name": "Aryeh Lev Zabokritskiy"}], "author_count": 3}, {"id": "2608.22001", "category": "quant-ph", "title": "Finite-Resolution Limits on Quantum Uniqueness", "abstract": "The Stone-von Neumann theorem makes canonical quantization unique only after one imposes strong continuity of the Weyl translation groups. We show that this continuity assumption cannot be certified by any finite-resolution interrogation of the Weyl relations. A finite protocol probes only finitely many phase-space displacements and bounded expectation values, thereby determining a protocol algebra \\(C_S\\) generated by a finitely generated subgroup of Weyl translations, but not the regularity of an extension to the full Weyl algebra. Using the polymer representation as a canonical non-regular representation, we prove that for every regular Weyl representation, every normal state, and every finite family of bounded protocol observables, a polymer state reproduces the same expectation values to arbitrary prescribed accuracy. Thus finite agreement with Schrödinger quantum mechanics does not operationally certify the regularity hypothesis entering uniqueness. The result does not assert physical equivalence between regular and polymer quantizations, it identifies where additional input, such as Hamiltonian dynamics, energy regularity, semiclassicality, or a continuum limit, is required to distinguish or select representations. In this precise sense, non-regular polymer kinematics are not excluded by finite Weyl data alone, a point of direct relevance to quantum-gravity motivated quantizations.", "url": "https://arxiv.org/abs/2608.22001", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Seramika Ariwahjoedi"}, {"name": "Sameer Ahmad Mir"}, {"name": "Mir Faizal"}], "featured_authors": [{"name": "Seramika Ariwahjoedi"}, {"name": "Sameer Ahmad Mir"}, {"name": "Mir Faizal"}], "author_count": 3}, {"id": "2608.22017", "category": "quant-ph", "title": "Quantifying Nonstabilizerness of Codeword-Stabilized Codes", "abstract": "Fault-tolerant quantum computation requires non-Clifford gates, which stabilizer codes cannot supply transversally. Non-stabilizer codes are the natural place to look for them, yet no quantitative theory of the nonstabilizerness (or magic) carried by such a code has existed. We develop one for codeword-stabilized (CWS) codes and show that the key quantity is classical: a code's nonstabilizerness is fixed by how its codewords collide under translation, a question that belongs to additive combinatorics. We show that the most magical codes are exactly the Sidon sets whenever a Sidon set of the required size exists, whose pairwise differences are all distinct. No code carries more than twice its number of logical qubits of nonstabilizerness however large it is physically. Furthermore, the same reduction gives structural and operational results. Nonstabilizerness is unchanged by coset closure, which yields non-stabilizer codes with arbitrarily many logical qubits and constant nonstabilizerness as the number of logical qubits grows. A diagonal transversal gate with $k$ logic qubits that is non-Clifford on $t$ coordinates forces the code's nonstabilizerness to be at most $2(k-t)$; thus the nonstabilizerness also bounds the non-Clifford gates needed to build the code and the cost of classically simulating it. Finally, entire families become exactly computable, and we obtain closed-form values for the Kerdock codes. Together these results turn the search for magic-rich codes and transversal non-Clifford gates into classical counting problems, which can be approached with standard tools from additive combinatorics.", "url": "https://arxiv.org/abs/2608.22017", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuan Liu"}, {"name": "Ke-Mi Xu"}], "featured_authors": [{"name": "Yuan Liu"}, {"name": "Ke-Mi Xu"}], "author_count": 2}, {"id": "2608.22168", "category": "quant-ph", "title": "Deterministic preparation of entangled Dicke states", "abstract": "Dicke states $|J=N/2,m\\rangle$ of a collection of $N$ atoms were central to Dicke's theory of superradiance. Except for the fully polarized end states, they are entangled many-body states; in particular, the single-excitation Dicke state is the W state well known in quantum information science. However, deterministic preparation of Dicke states with a prescribed spin projection remains challenging, especially without relying on postselection or heralding. Here we present a detuning-programmed Hamiltonian protocol using atoms or qubits in a dispersive cavity subject to a coherent transverse drive. In the absence of the drive, the off-resonant cavity produces an effective collective-spin interaction. By combining this cavity-mediated interaction with the coherent drive, tuning the atom--drive detuning enables the protocol, in principle, to target any allowed Dicke state along the symmetric Dicke ladder. Starting from the transverse-drive ground state, adiabatic ground-state interpolation prepares the selected Dicke state by ramping down the drive strength while ramping up the cavity-mediated interaction. After preparation, tuning the cavity into resonance with the atoms or qubits provides a direct way to probe the collective-emission response of the prepared Dicke state. We discuss implementation with superconducting circuit QED and show that the prepared states, especially the central Dicke state with $m=0$, provide resources for quantum sensing with Heisenberg-limited scaling.", "url": "https://arxiv.org/abs/2608.22168", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hui Wang"}, {"name": "Marlan O. Scully"}, {"name": "Girish S. Agarwal"}], "featured_authors": [{"name": "Hui Wang"}, {"name": "Marlan O. Scully"}, {"name": "Girish S. Agarwal"}], "author_count": 3}, {"id": "2608.22199", "category": "quant-ph", "title": "Bloch states of an infinite one-dimensional lattice under transverse electric field", "abstract": "We consider an effectively one-dimensional periodic atomic chain subjected to a weak static electric field transverse to the chain axis. The intrinsic lattice is represented in reciprocal space by a harmonically weighted periodic pseudopotential, while the transverse field produces a weak elastic and polarizable response whose minimum-energy distribution is approximated by a periodically repeated catenary profile. Bloch reduction places both contributions in a common reciprocal-space Hamiltonian. The intrinsic lattice produces a \\ (|r-s|^ {-1} \\) hierarchy, whereas the catenary contribution is a symmetric Toeplitz correction with coefficients proportional to \\((1+\\pi^2(r-2) ^ {-1} \\) and therefore asymptotically to \\ (|r-s|^ {-2} \\). The complete nonzero reciprocal weight of the catenary contribution is absolutely convergent and sums to \\ (|V_ {\\rm c} |/e \\). At the unit-cell level, the lowest intrinsic harmonic together with the catenary term gives a Mathieu equation containing both cosine and hyperbolic-cosine modulations. A first-Brillouin-zone reduction then yields the field-dependent band energies and the corresponding hierarchy of Bragg gaps. The model isolates a simple mechanism by which a transverse electric field can reorganize the Bloch spectrum of a low-dimensional periodic system. Keywords: Bloch theory; transverse electric field; catenary potential; Mathieu equation; Brillouin zone; band structure.", "url": "https://arxiv.org/abs/2608.22199", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Anand Aruna Kumar"}], "featured_authors": [{"name": "Anand Aruna Kumar"}], "author_count": 1}, {"id": "2608.22357", "category": "quant-ph", "title": "Spinning giant optomechanical cavity with nonreciprocal self-interference", "abstract": "We study a spinning optomechanical cavity that is coupled to a meandering waveguide at multiple spatially separated points, forming a giant-cavity configuration. The resulting self-interference makes the effective optical driving, linewidth, and frequency shift strongly dependent on the propagation phase in the waveguide, while the rotation-induced Sagnac-Fizeau shift causes the clockwise (CW) and counterclockwise (CCW) cavity modes to experience distinct interference phases. Under single-tone driving, this mechanism enables phase-controlled phonon cooling and, in the presence of cavity rotation, nonreciprocal cooling, with one propagation direction approaching the mechanical ground-state regime while the opposite direction remains less efficiently cooled. Under two-tone driving, the same interference mechanism engineers a squeezed reservoir for the mechanical mode, producing steady-state squeezing that likewise becomes nonreciprocal under cavity rotation. These results establish multi-point self-interference as a versatile mechanism for phase-controlled optomechanical reservoir engineering and show that, when combined with cavity rotation, it provides a route to nonreciprocal quantum effects.", "url": "https://arxiv.org/abs/2608.22357", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yao-Tong Chen"}], "featured_authors": [{"name": "Yao-Tong Chen"}], "author_count": 1}, {"id": "2608.22384", "category": "quant-ph", "title": "Laughlin quasihole geometry from a single snapshot ensemble", "abstract": "Can a probability distribution measured in one basis determine complex quantum geometry? The answer is affirmative for a lattice Laughlin quasihole. The exact occupation law at one generic reference position, together with the known analytic quasihole factor, fixes the complete complex Gram kernel. A finite snapshot ensemble estimates this kernel without preparing another member of the family, and thereby determines finite-distance overlaps, Bargmann phases, the quantum metric, and the Berry curvature. The same analytic structure confines the family to an exact projective subspace whose dimension grows at most linearly with particle number. Exact enumeration of a Nielsen-Cirac-Sierra state demonstrates finite-shot reconstruction of both the metric and a geometric phase. Moreover, a Rényi-2 divergence sets the statistical range of the reconstruction while, at nondegenerate points, occupation readout also attains the local single-copy multiparameter information bound.", "url": "https://arxiv.org/abs/2608.22384", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kaushlendra Kumar"}], "featured_authors": [{"name": "Kaushlendra Kumar"}], "author_count": 1}, {"id": "2608.22393", "category": "quant-ph", "title": "Inclusion-Minimal local indistinguishability: a weak form of nonlocality", "abstract": "Local discrimination of quantum states is a fundamental task in distributed quantum information processing and underlies applications such as quantum communication, data hiding, and secret sharing. Here we investigate a weak form of local indistinguishability by asking how easily it can disappear when the candidate set is reduced or an additional copy of the unknown state is supplied. We introduce inclusion-minimal locally indistinguishable sets, namely, locally indistinguishable sets for which every proper subset is perfectly distinguishable by local operations and classical communication (LOCC), and show that every finite locally indistinguishable set contains such a subset. We further find that any inclusion-minimal locally indistinguishable sets becomes perfectly distinguishable by LOCC when two identical copies are available, although a single copy is insufficient. Fininally, We construct explicit inclusion-minimal locally indistinguishable product-state sets in $(\\mathbb C^d)^{\\otimes n}$ for every odd $d=2k+1$ and $n\\ge2$. These results show that local indistinguishability can be nontrivial at the single-copy level yet fragile under either the removal of candidate states or a modest increase in copy resources, providing a complementary perspective on the structure of quantum nonlocality.", "url": "https://arxiv.org/abs/2608.22393", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mao-Sheng Li"}, {"name": "Zong-Xing Xiong"}, {"name": "Zhu-Jun Zheng"}, {"name": "Yan-Ling Wang"}], "featured_authors": [{"name": "Mao-Sheng Li"}, {"name": "Zong-Xing Xiong"}, {"name": "Zhu-Jun Zheng"}, {"name": "Yan-Ling Wang"}], "author_count": 4}, {"id": "2608.22404", "category": "quant-ph", "title": "Error Propagation Theory for Variational Non-Markovian Open Quantum Dynamics", "abstract": "Variational approaches based on neural quantum states and physics-informed neural networks provide powerful paradigms for simulating non-Markovian open quantum dynamics. However, extending these methods into the strongly non-Markovian regime reveals a critical bottleneck: even minute errors in the time evolution can translate into substantial deviations in physical observables. The fundamental origin of this stringent precision requirement, as well as how non-Markovianity governs it, remains an open question. Here, we develop a theoretical framework that systematically characterizes error propagation in variational non-Markovian dynamics. By combining analytical derivations with numerical verification, we present the first quantitative description of variational error evolution over time. Our analysis uncovers an intrinsic error-backflow mechanism driven by long-lived environmental memory. This mechanism establishes a fundamental precision barrier and provides concrete guidance for designing robust variational algorithms for strongly non-Markovian quantum systems.", "url": "https://arxiv.org/abs/2608.22404", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Long Cao"}, {"name": "Daochi Zhang"}, {"name": "Yao Wang"}, {"name": "Liwei Ge"}, {"name": "Rui-Xue Xu"}, {"name": "YiJing Yan"}, {"name": "Xiao Zheng"}], "featured_authors": [{"name": "Long Cao"}, {"name": "Daochi Zhang"}, {"name": "Yao Wang"}, {"name": "Rui-Xue Xu"}, {"name": "YiJing Yan"}, {"name": "Xiao Zheng"}], "author_count": 7}, {"id": "2608.22656", "category": "quant-ph", "title": "Sharp State-Independent Uncertainty Relations for Multipartite systems", "abstract": "Uncertainty relations constrain the fluctuations of incompatible observables, but most familiar bounds depend on the quantum state. State-independent uncertainty relations instead ask how much fluctuation remains unavoidable for every quantum state. For observables generated by a continuous symmetry, sharp state-independent bounds are known when the symmetry representation is irreducible. Multipartite collective systems, however, generally appear as reducible tensor-product representations of a symmetry algebra, which raises the question of how to determine their total uncertainty. We resolve this problem for multipartite quantum systems with a compact semisimple symmetry algebra $\\mathfrak g$. Exploiting the symmetry structure, we formulate a general framework for state-independent uncertainty based on representation theory. The total variance admits an exact decomposition into intrinsic fluctuations within irreducible sectors and a nonnegative dispersion between sectors. This yields the sharp state-independent bound for the total variance $\\Delta_\\rho^2(\\mathfrak g)$ on the multipartite Hilbert space $\\mathcal H$ \\[ \\min_{\\rho}\\Delta_\\rho^2(\\mathfrak g) = \\min_{\\lambda\\in\\Lambda(\\mathcal H)} 2\\langle\\lambda,\\delta\\rangle, \\] where $\\rho$ is any density operator on $\\mathcal H$, $\\Lambda(\\mathcal H)$ is the set of highest weights $\\lambda$ labeling those sectors, and $\\delta$ is the Weyl vector. This demonstrates that the ultimate uncertainty is completely controlled by its intrinsic symmetry structure. As a special example, this result confirms our previous conjecture that the total uncertainty floor of collective spin-$1/2$ systems depends only on the parity of the particle number. We further illustrate the framework for multipartite spin-$1$ systems, demonstrating that the same symmetry-sector mechanism persists beyond spin-$1/2$.", "url": "https://arxiv.org/abs/2608.22656", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yiling Wang"}, {"name": "Naihuan Jing"}], "featured_authors": [{"name": "Yiling Wang"}, {"name": "Naihuan Jing"}], "author_count": 2}, {"id": "2608.22664", "category": "quant-ph", "title": "Time-Resolved Edge Flux on the SU(3) Triangle: A Cooperative-Decay Graph Framework with Exact Bateman Solutions", "abstract": "Cooperative emission from three-level ensembles is conventionally diagnosed through the radiated intensity alone, which cannot say which channels carry the photons at each instant. We promote every transition of the cooperative-decay graph into a time-dependent edge flux and show that node-wise conservation of this flux is an exact restatement of the Pauli master equation. Suppose the graph carries a depth function that decreases by one along every edge. Then the total cooperative rate is the descent speed of the mean graph depth, and its energy-weighted form gives the radiated intensity as $I(t)=-\\dd\\langle E\\rangle/\\dd t$ for arbitrary level spacings. The same ordering triangularizes the generator. This delivers the relaxation spectrum from the state exit rates, together with a generalized Bateman closed form for every population on an arbitrary finite directed acyclic graph, in which all exit-rate degeneracies are absorbed into a polynomial-times-exponential recursion.", "url": "https://arxiv.org/abs/2608.22664", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gombojav O Ariunbold"}, {"name": "Vaidyanathan Sivaraman"}], "featured_authors": [{"name": "Gombojav O Ariunbold"}, {"name": "Vaidyanathan Sivaraman"}], "author_count": 2}, {"id": "2608.22684", "category": "quant-ph", "title": "Quantifying Multipartite Entanglement Based on unified entropy", "abstract": "In this paper, we investigate the characterization of multipartite entanglement based on the unified $(q,s)$-entropy framework. For bipartite quantum states, we propose an entanglement measure $E_{q,s}^{A|B}(\\rho)$ based on unified entropy and derive several analytical lower bounds for it using local orthonormal observables. We demonstrate with concrete examples that our lower bounds provide tighter estimates of quantum entanglement than several existing analytical bounds. For multipartite quantum states, based on unified entropy, we propose two measures $A^k_{q,s}(\\rho)$ and $G^k_{q,s}(\\rho)$ for quantifying $k$-nonseparability, and prove that these measures satisfy several desirable properties, such as faithfulness, local unitary invariance, and convexity. Moreover, we rigorously prove that when the parameters $q$ and $s$ are in certain ranges, $A^k_{q,s}(\\rho)$ and $G^k_{q,s}(\\rho)$ also satisfy monotonicity and strong monotonicity. Furthermore, we establish the order relations of the measures $A^k_{q,s}(\\rho)$ and $G^k_{q,s}(\\rho)$ with respect to the parameters $q$ and $s$ for fixed quantum states. In addition, for fixed $q$ and $s$, we also give their order relations for any two pure states.", "url": "https://arxiv.org/abs/2608.22684", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yan Hong"}, {"name": "Tongtong Xu"}, {"name": "Limin Gao"}], "featured_authors": [{"name": "Yan Hong"}, {"name": "Tongtong Xu"}, {"name": "Limin Gao"}], "author_count": 3}, {"id": "2608.22769", "category": "quant-ph", "title": "Classical and quantum spectral density estimation under local graph access", "abstract": "We study spectral density estimation for the normalized adjacency matrix of an unweighted graph under local access model. Previously, Cohen-Steiner et al. [KDD 2018] proposed an algorithm for $\\varepsilon$-approximate spectral density estimation in the Wasserstein-1 distance, using $2^{O(1/\\varepsilon)}$ local queries to the graph. In this paper, we prove that every constant-success estimator with Wasserstein--$1$ error at most $\\eps$ requires $2^{\\Omega(1/\\eps)}$ queries, showing that the Cohen-Steiner algorithm is optimal up to constant in the exponent. This resolves the open problem left by previous researches Jin et al. [COLT 2023] and Peng et al. [COLT 2026]. We then turn to quantum local access model. We give an $\\widetilde O(\\eps^{-3})$-query algorithm estimating the spectral density with Wasserstein-1 error at most $\\eps$. Finally, we prove a $\\widetilde\\Omega(\\eps^{-4/3})$ quantum lower bound when the graph is sufficiently large. As a result, quantum local access model changes the dependence on $\\eps$ from exponential to polynomial.", "url": "https://arxiv.org/abs/2608.22769", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rong-Hua Li"}, {"name": "Meihao Liao"}, {"name": "Yichun Yang"}], "featured_authors": [{"name": "Rong-Hua Li"}, {"name": "Meihao Liao"}, {"name": "Yichun Yang"}], "author_count": 3}, {"id": "2608.22801", "category": "quant-ph", "title": "An Exactness Barrier for ZX-Calculus Optimization of Synthesized Clifford+T Circuits", "abstract": "Gate synthesis and circuit optimization are usually studied separately, and evidence on their interaction is contradictory: ZX-calculus rewriting removes a stable fraction of Solovay-Kitaev circuits, yet almost nothing from number-theoretically synthesized circuits. We show both behaviours follow from a single bound. For any optimizer that preserves the implemented element exactly--including all sound ZX rewriting with extraction--the achievable T-count is bounded below by the denominator exponent of the synthesized ring element. This exactness barrier is computable per instance and separates exact post-processing from approximation-aware resynthesis by a certified factor reaching 101x at recursion depth five. The two behaviours are then the barrier operating at different distances from the floor. For Solovay-Kitaev circuits we prove that the local ZX simplification layer (spider fusion and identity removal) computes exactly the free-product normal form of Z_2 * Z_8, giving exact per-instance compression and, under a calibrated ergodicity hypothesis, a depth-independent limit law confirmed on two independently constructed nets. For number-theoretically synthesized circuits the floor is already saturated: on single-qubit words automated ZX simplification attains it exactly, via a closed-form formula for minimal T-count in terms of phase linkage through the Z-axis normalizer. At two qubits and beyond the same valuation yields unconditional rigidity certificates, which on the quantum-Shannon-decomposition plus gridsynth pipeline certify 99.4-99.9% of the synthesized T-count as incompressible, with rigidity strengthening as accuracy tightens. This explains, and predicts the size of, the near-null optimization recently reported for that pipeline.", "url": "https://arxiv.org/abs/2608.22801", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chon-Fai Kam"}, {"name": "Anuradha Mahasinghe"}, {"name": "Kaushika De Silva"}, {"name": "Frédéric Cadet"}, {"name": "Jingbo Wang"}], "featured_authors": [{"name": "Chon-Fai Kam"}, {"name": "Anuradha Mahasinghe"}, {"name": "Kaushika De Silva"}, {"name": "Frédéric Cadet"}, {"name": "Jingbo Wang"}], "author_count": 5}, {"id": "2608.22850", "category": "quant-ph", "title": "Implementation of nonlocal multi-photon interference by mode swapping", "abstract": "Multi-photon interference can be observed using independently generated photons as input. In the most simple case, these photons meet up at a beam splitter, resulting in quantum interference between transmission and reflection of the photons. Here, we show that non-local multi-photon interference can be implemented by using a mode swap operation to generate entanglement between the photons detected in the outputs of two spatially separated interferometers. The spatial separation of the output photons makes this implementation of multi-photon interference particularly suitable for quantum protocols that distribute quantum information to different parties.", "url": "https://arxiv.org/abs/2608.22850", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Holger F. Hofmann"}, {"name": "Yuki Kodama"}, {"name": "Jonte R. Hance"}], "featured_authors": [{"name": "Holger F. Hofmann"}, {"name": "Yuki Kodama"}, {"name": "Jonte R. Hance"}], "author_count": 3}, {"id": "2608.22892", "category": "quant-ph", "title": "Deterministic Preparation of Arbitrary Spin Eigenfunctions", "abstract": "Quantum states with conserved total spins, or spin eigenfunctions, are important for studying quantum chemistry and quantum manybody physics problems. A typical class of spin eigenfunctions are Dicke states, which attain maximal spins. While we already have many efficient quantum algorithms to prepare Dicke states, it is not yet clear if we could do so for arbitrary spin eigenfunctions deterministically. Generalizing Bärtschi and Eidenbenz's elegant algorithms for Dicke state preparation, we successfully prepare arbitrary spin eigenfunctions characterized by branching paths and binary spin trees. As a byproduct, we also develop the corresponding classical algorithms to reconstruct all these spin states.", "url": "https://arxiv.org/abs/2608.22892", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wenxuan Tao"}, {"name": "Jianan Wang"}, {"name": "Fen Zuo"}], "featured_authors": [{"name": "Wenxuan Tao"}, {"name": "Jianan Wang"}, {"name": "Fen Zuo"}], "author_count": 3}, {"id": "2608.22919", "category": "quant-ph", "title": "Geometric Phases of a Driven Qubit: Comparing Berry and Uhlmann Holonomies", "abstract": "The Berry phase arises naturally from the adiabatic dynamics of a pure quantum state, whereas the Uhlmann phase is usually formulated kinematically for a prescribed path of mixed states. For a qubit subject to a uniformly gapped conical drive, we obtain the Uhlmann connection and holonomy in closed form for the equilibrium Gibbs cycle. We then solve the corresponding Lindblad equation exactly in the rotating frame and show that its steady state forms a nonequilibrium limit cycle that lags the instantaneous Gibbs cycle. As the driving becomes slow, the Uhlmann phase approaches the equilibrium Uhlmann phase, which cooling then reduces to the Berry phase: in the joint adiabatic and low-temperature limit, the dynamical Uhlmann phase therefore converges to the Berry phase. This grounds the Uhlmann--Berry correspondence in the physical dynamics of an open system. We also characterize the finite-driving corrections, together with the discontinuous $\\pi$ jump that the Uhlmann phase undergoes on the equatorial cycle as the temperature is varied. Finally, we examine an isolated transversal gap closing, where this zero-temperature correspondence can break down: the pure-state path becomes open, its closure is ambiguous, and gap-opening regularizations close it along a geodesic set by the direction of the bias field, splitting the Berry phase into a one-parameter family of values. The Gibbs path instead closes smoothly through the maximally mixed state, so the Uhlmann holonomy requires no regularization and remains unique and continuous at every finite temperature. In the low-temperature limit the Uhlmann phase selects a single member of the Berry family---the geodesic closure in the osculating plane, fixed by the velocity and acceleration of the driving field. The Uhlmann--Berry correspondence of the gapped regime thus survives the gap closing as a geodesic selection rule.", "url": "https://arxiv.org/abs/2608.22919", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hyeonseok Yang"}, {"name": "Changsuk Noh"}], "featured_authors": [{"name": "Hyeonseok Yang"}, {"name": "Changsuk Noh"}], "author_count": 2}, {"id": "2608.22939", "category": "quant-ph", "title": "Universal equilibrium magic in quantum many-body systems", "abstract": "Thermalization conventionally describes local properties of isolated many-body systems at equilibrium. Magic, or nonstabilizerness $\\unicode{x2013}$ the resource enabling universal quantum computation $\\unicode{x2013}$ is by contrast encoded in the global structure of the many-body wavefunction. We show that, despite its global nature, the magic of equilibrium pure states of chaotic many-body systems, including late-time evolved states and energy eigenstates, is universal: it is captured by the thermal Scrooge ensemble, the minimally informative ensemble of pure states consistent with the Gibbs state at the same effective temperature. Therefore, for systems with no conserved quantities other than the total energy, equilibrium magic is a function of temperature alone, independent of the initial state and other microscopic features of the equilibrium state. This yields concrete universal predictions for the stabilizer Rényi entropies (SREs). At infinite temperature, the SRE is set by Haar-like fluctuations of the Pauli spectrum, while at finite temperature energy conservation induces a volume-law thermodynamic correction controlled by the thermal Pauli spectrum. We support these predictions with analytical arguments and extensive numerical simulations. We further show that chaotic many-body systems at high temperatures possess long-range magic and entanglement that cannot be removed by finite-depth local quantum circuits. Our results establish magic as a thermodynamic property of chaotic many-body systems and suggest that Scrooge ensembles may provide a unified framework for quantum many-body resources.", "url": "https://arxiv.org/abs/2608.22939", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Soumyadeep Sarma"}, {"name": "Tobias Haug"}, {"name": "John Preskill"}, {"name": "Wai-Keong Mok"}], "featured_authors": [{"name": "Soumyadeep Sarma"}, {"name": "Tobias Haug"}, {"name": "John Preskill"}, {"name": "Wai-Keong Mok"}], "author_count": 4}, {"id": "2608.22977", "category": "quant-ph", "title": "`It from Bit': is there a second law of quantum complexity?", "abstract": "At a deeper level the principle of least action is interpreted as the law of least entropy increase consistent with Prigogine's principle of minimum entropy production, and the implications of quasistatic information quantization rule (Proc. R. Soc. A 480: 20240024), are explored for the conjectured second law of quantum complexity. It is thus shown that the conjectured second law of complexity is derivable from the information quantization rule such that long after heat-death the quantum state complexity evolves as $C(t)=C_{\\rm max}\\exp(-1/t)$, increasing with time to a saturation value $C_{\\rm max}$ that is exponential in the equilibrium entropy $S_{\\rm max}$. For the out-of-equilibrium circumstances, however, the quantum complexity can decrease with the time, asymptotically tending to a minimum determined by the distance from equilibrium.", "url": "https://arxiv.org/abs/2608.22977", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "S. Davatolhagh"}, {"name": "A. Sheykhi"}, {"name": "M.H. Zarei"}], "featured_authors": [{"name": "S. Davatolhagh"}, {"name": "A. Sheykhi"}, {"name": "M.H. Zarei"}], "author_count": 3}, {"id": "2608.23002", "category": "quant-ph", "title": "Exact and Optimal Recursive Quantum Search via Hilbert-Space Decomposition", "abstract": "Current approaches to quantum search fail to deeply exploit extant structure in the underlying Hilbert space. Decomposing the search by this structure empowers new strategies and formulations for quantum search and algorithm design. We present a new decomposition technique acting directly on this structure by recursively decomposing the Hilbert space and constructing the search operator from reflections over the resulting partition. When initial and target states factorise over this partition, dynamics reduce to a single rotation in a two-dimensional plane at each level, with angle given by a scalar recurrence. This recurrence avoids error accumulation from separately bounding success probabilities at each level, yielding an exact state description enabling treatment of the recursion as a whole. We obtain the target state deterministically and derive oracle and non-oracle costs independently of the search setting. For unstructured search, our approach attains the simultaneously optimal $\\Theta(\\sqrt{N})$ oracle and non-oracle gate counts. For spatial search on $d$-dimension grids, it recovers the $O(\\sqrt{N})$ time for $d\\geq3$ and the $O\\bigl(\\sqrt{N}(\\log N)^{3/2}\\bigr)$ bound of Aaronson and Ambainis for $d=2$. The exact description of the recursion extends over our decomposition to new subdivision structures and provides a new approach for applying and analysing recursion in quantum algorithm design.", "url": "https://arxiv.org/abs/2608.23002", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "John Burke"}, {"name": "Ciaran McGoldrick"}], "featured_authors": [{"name": "John Burke"}, {"name": "Ciaran McGoldrick"}], "author_count": 2}, {"id": "2608.23093", "category": "quant-ph", "title": "Partial-Moment PINNs for Caldeira--Leggett Parameter Learning in Quantum Brownian Motion", "abstract": "We study parameter recovery in the Caldeira--Leggett (quantum Brownian) oscillator from partial moment traces. Our model is a moment-level PINN that predicts the five first/second moments and enforces the linear CL/HPZ ODEs by automatic differentiation. Physical structure is imposed through a PSD (Cholesky) covariance head, high-temperature CL assumptions with $D_{xp}\\approx0$, and fluctuation--dissipation ties between $D_{pp}$ and $\\gamma$. On synthetic CL data with channels ${\\mu_x,\\sigma_{xx},\\sigma_{xp}}$, the constrained variant recovers $(\\omega,\\gamma)$ accurately, stabilizes $D_{pp}$, and achieves low rollout error compared to finite differences and Kalman--EM (expectation--maximization) with exact Van Loan discretization. Fisher-style checks confirm that diffusion needs at least one variance observable, and sparse $\\sigma_{pp}$ ``anchors'' restore conditioning. We also show that the same PINN can learn time-varying HPZ coefficients.", "url": "https://arxiv.org/abs/2608.23093", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Krishna Bhatia"}], "featured_authors": [{"name": "Krishna Bhatia"}], "author_count": 1}, {"id": "2608.23119", "category": "quant-ph", "title": "Quantum Reservoir Computing with Physics-Informed Correction for Reduced-Order PDE Forecasting", "abstract": "We study a hybrid proposal--correction architecture for reduced-order PDE forecasting in which a pure-state quantum reservoir computer (QRC) predicts latent coefficient dynamics and a PINN-based physics-informed corrector (PIC) refines local rollout windows. The method is evaluated on Burgers and Kuramoto--Sivashinsky (KS), with KS as the primary chaotic benchmark. On KS, QRC+PIC consistently improves over QRC alone in RMSE, NRMSE, and PDE residual, while Burgers highlights a regime in which simple baselines remain strong. These results suggest that QRC proposals with local physics-informed correction are a viable benchmark-dependent reduced-order forecasting strategy.", "url": "https://arxiv.org/abs/2608.23119", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Krishna Bhatia"}, {"name": "Harsh"}, {"name": "Shalini Devendrababu"}], "featured_authors": [{"name": "Krishna Bhatia"}, {"name": "Harsh"}, {"name": "Shalini Devendrababu"}], "author_count": 3}, {"id": "2608.23127", "category": "quant-ph", "title": "Efficient Quantum Simulation of Linearized Vlasov--Poisson Dynamics Using Trotter and THRIFT Hamiltonian Simulation Methods", "abstract": "The Vlasov--Poisson system provides the fundamental kinetic description of plasma and plays a central role in understanding collective phenomena such as Landau damping and wave--particle interactions. Efficient numerical simulation of these dynamics remains challenging because of the high dimensionality of phase space. In this work, we studied magnetized and non-magnetized plasma using a quantum simulation framework for the linearized Vlasov-Poisson equation by reformulating the discretized system as a Hermitian Hamiltonian suitable for gate-based quantum computation. The time evolution is implemented using first, second and fourth-order Trotter--Suzuki product formulas and the recently proposed Time-Resolved Interaction Framework (THRIFT). The performance of the different simulation methods is systematically evaluated through electric field evolution, state fidelity, convergence behavior, energy conservation, entanglement entropy and quantum resource requirements, including circuit depth and two-qubit gate complexity, for both magnetized and non-magnetized plasma models. To further reduce finite time step errors without increasing circuit depth, Richardson extrapolation is incorporated as a error-mitigation technique. The results provide a comprehensive comparison of Trotter and THRIFT approaches and establish practical guidelines for accurate and resource-efficient quantum simulation of plasma dynamics on gate-based quantum computers.", "url": "https://arxiv.org/abs/2608.23127", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kartick Paul"}, {"name": "Rahul V"}, {"name": "S. Aravinda"}, {"name": "Reetesh K. Gangwar"}], "featured_authors": [{"name": "Kartick Paul"}, {"name": "Rahul V"}, {"name": "S. Aravinda"}, {"name": "Reetesh K. Gangwar"}], "author_count": 4}, {"id": "2608.23191", "category": "quant-ph", "title": "Quantum observables as Fréchet sensitivity kernels", "abstract": "We present a variational--adjoint interpretation of quantum mechanics in which the interaction between forward and adjoint wavefunctions defines a general sensitivity kernel of the system. This Fréchet interaction density quantifies how perturbations in the wavefunction (or system parameters) influence a chosen observable. The familiar Born probability density appears as a special case when the adjoint wavefunction is chosen as the complex conjugate of the forward wavefunction, for which the interaction density becomes real and non-negative. Within this framework, probability is a particular positive-definite form of sensitivity described by the Fréchet interaction density. In general, the variational--adjoint interpretation also produces Fréchet sensitivity kernels associated with other quantum observables, including momentum, energy, and spin. This suggests that the Born probability density belongs to a broader class of Fréchet sensitivity kernels associated with quantum observables. The proposed interpretation also provides a connection with time-symmetric interpretations of quantum mechanics and possible future applications in quantum control and quantum metrology.", "url": "https://arxiv.org/abs/2608.23191", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rafael Abreu"}], "featured_authors": [{"name": "Rafael Abreu"}], "author_count": 1}, {"id": "2608.23232", "category": "quant-ph", "title": "Non-Hermitian Generalization of Bloch Sphere in Spacetime Algebra", "abstract": "We establish a geometric generalization of the Bloch sphere for two-level quantum systems with non-Hermitian Hamiltonians using the Spacetime Algebra (STA) formulation. By lifting the state density operator from the even subalgebra to the full STA, we show that the state space expands from the unit 2-sphere to a future light cone. The non-unitary time evolution generated by a general non-Hermitian Hamiltonian corresponds to proper orthochronous Lorentz transformations on the null vectors. We classify the Hamiltonian dynamics into four distinct geometric classes: spatial rotations (corresponding to $\\mathcal{PT}$-symmetric systems), pure boosts (anti-$\\mathcal{PT}$-symmetric systems), null rotations (exceptional points), and general mixtures. We also use this formulation to study several results from PT-symmetric quantum mechanics, including the topological features of the exceptional points.", "url": "https://arxiv.org/abs/2608.23232", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chih-Wei Wang"}], "featured_authors": [{"name": "Chih-Wei Wang"}], "author_count": 1}, {"id": "2608.23316", "category": "quant-ph", "title": "Exact Quasiprobability Hierarchy of the Double-Morse Oscillator: From Potential Geometry to Operator Ordering", "abstract": "Phase-space and quasiprobability methods play key roles across quantum technologies, characterizing localization, non-Gaussianity, nonclassical resources, and coarse-graining. We present a representation-consistent analysis of the lowest quasi-exact ground state of the symmetric double-Morse oscillator. The parameter $A$ changes the potential geometry and physical state, whereas the Cahill--Glauber ordering parameter $s$ changes only the representation and phase-space resolution of a fixed density operator. Although the potential is double-welled for $0<A<1$, the exact ground-state amplitude is single-peaked at the origin and lies above the internal barrier; as $A$ approaches unity, the merged well remains locally quartic rather than harmonic. We obtain closed expressions for the Wigner function and Weyl characteristic function. The Wigner function shows the $A$-dependent exchange between position and momentum localization and retains negative regions, certifying nonclassicality and, for this pure state, non-Gaussianity. The Weyl function gives the Fourier-dual description, generates symmetrically ordered moments and cumulants, and yields the full $s$-ordered hierarchy. For $s<0$, isotropic Gaussian smoothing suppresses fine sign-changing structure while preserving the large-scale localization envelope. The Husimi endpoint is nonnegative without implying classicality, whereas the Glauber--Sudarshan $P$ representation remains distributional and does not define a regular positive coherent-state mixture. Thus, the reduced visual extent of Wigner-negative regions as $A$ increases is not classicalization: $A$ controls the physical geometry, while $s$ controls how the same non-Gaussian, nonclassical structure appears across complementary representations. This separation provides an exact benchmark for nonlinear phase-space methods. theory.", "url": "https://arxiv.org/abs/2608.23316", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "F. Chogle"}, {"name": "B. Teklu"}, {"name": "M. F. Pereira"}], "featured_authors": [{"name": "F. Chogle"}, {"name": "B. Teklu"}, {"name": "M. F. Pereira"}], "author_count": 3}, {"id": "2608.23399", "category": "quant-ph", "title": "Quantifying the dimensionality of multiparticle entanglement via partition rank", "abstract": "The usefulness of entanglement as a resource in quantum technologies increases for larger systems, that is, if more particles or higher-dimensional quantum systems are considered. Yet, the interplay between dimensionality and multiparticle entanglement is not well understood. Only for two-particle systems an unambiguous and coherent notion of entanglement dimensionality, based on the Schmidt decomposition, is known. We introduce a concept to characterize the entanglement dimensionality of multiparticle states based on decompositions of pure states into superpositions of states without genuine multiparticle entanglement. We provide constructive methods to characterize the resulting partition rank for pure and mixed states. This allows the identification of novel maximally correlated states as well as a discrete classification of quantum states under stochastic local operations and classical communication. From a mathematical perspective, our approach can be formulated in terms of the slice rank and partition rank of tensors and our results allow to characterize these by connecting them to a generalized injective tensor norm.", "url": "https://arxiv.org/abs/2608.23399", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sophia Denker"}, {"name": "Ismaël Septembre"}, {"name": "Robin Krebs"}, {"name": "Otfried Gühne"}], "featured_authors": [{"name": "Sophia Denker"}, {"name": "Ismaël Septembre"}, {"name": "Robin Krebs"}, {"name": "Otfried Gühne"}], "author_count": 4}, {"id": "2608.23460", "category": "quant-ph", "title": "Satisfying Quantum Codes: Physics-Informed and Hardware-Aware Code Design with SAT Solvers", "abstract": "Although quantum error correction is widely believed to be necessary for impactful applications of quantum computers, the design of quantum error correction codes is largely done by hand, without respect to problem or hardware constraints. In this work, we present a highly general and flexible framework for the computational design of both physics-inspired and hardware-aware quantum codes. To do so, we formulate code design as a Boolean satisfiability (SAT) problem and show how to incorporate all required error correction criteria. We prove that code design is NP-complete, ruling out any efficient algorithm for designing codes in general. Nonetheless, we show that state-of-the-art SAT solvers are able to effectively find solutions for many practical problems. Notably, we are able to design physics-inspired codes with up to 100 physical qubits in minutes, and we design new hardware-aware codes for biased noise which have a lower logical error rate than state-of-the-art surface codes.", "url": "https://arxiv.org/abs/2608.23460", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ben DalFavero"}, {"name": "William M. Watkins"}, {"name": "Margarite L. LaBorde"}, {"name": "Vincent Russo"}, {"name": "Ethan Egger"}, {"name": "Gregory Quiroz"}, {"name": "Ryan LaRose"}], "featured_authors": [{"name": "Ben DalFavero"}, {"name": "William M. Watkins"}, {"name": "Margarite L. LaBorde"}, {"name": "Ethan Egger"}, {"name": "Gregory Quiroz"}, {"name": "Ryan LaRose"}], "author_count": 7}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
