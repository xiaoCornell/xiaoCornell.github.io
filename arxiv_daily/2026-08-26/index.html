  <script>
    const papers = [{"id": "2608.23683", "category": "cond-mat", "title": "Raman Circular Dichroism Reveals Higher-Order Quantum Geometry of Magnons", "abstract": "We develop a gauge-invariant theory of higher-order magnon quantum geometry probed by two-magnon Raman circular dichroism (RCD). The Raman operator decomposes into Berry connections, covariant derivatives, and products of Berry connections, giving rise to quantum geometric tensors beyond the quantum metric and Berry curvature. Applying this theory to a field-polarized Kitaev magnet, we show that higher-order geometric tensors govern the dichroic response. Our results establish RCD as a spectroscopic probe of generalized magnon quantum geometry.", "url": "https://arxiv.org/abs/2608.23683", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yong Chan Kim"}, {"name": "Youngsu Choi"}, {"name": "Kwang-Yong Choi"}, {"name": "Kyusung Hwang"}], "featured_authors": [{"name": "Yong Chan Kim"}, {"name": "Youngsu Choi"}, {"name": "Kwang-Yong Choi"}, {"name": "Kyusung Hwang"}], "author_count": 4}, {"id": "2608.23693", "category": "cond-mat", "title": "Reality and Complexity of $F$-symbols in $2+1$d Topological Phases", "abstract": "The $F$-symbols of an anyon theory encode the associativity of fusion and constitute some of the theory's most fundamental and, simultaneously, subtle data. Much of the subtlety lies in the gauge-dependence of the $F$-symbols. Despite their generic complexity, many braided anyon theories admit gauges in which all $F$-symbols are real, a phenomenon for which no general organising principle has been known. We identify a physical mechanism underlying this reality. For a unitary ribbon fusion category admitting an appropriate braided charge-conjugation symmetry, we show that the complex-conjugated $F$-symbols are related to the original ones by a gauge transformation. Finding a real gauge is thereby reduced to a condition on these transformations. When the charge-conjugation symmetry is suitably \"flat,'' or equivalently when the associated \"twisted'' Frobenius-Schur (or \"generalized'' Kawanaka-Matsuyama) data respects a grading, these local transformations can be trivialised and a real gauge exists. This framework unifies a broad range of previously disparate examples, including families of Chern-Simons theories whose $F$-symbols are difficult to directly compute. Finally, we exhibit a unitary ribbon category that realizes a novel obstruction to the existence of a real gauge and therefore has inherently complex $F$-symbols.", "url": "https://arxiv.org/abs/2608.23693", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthew Buican"}, {"name": "Peter Huston"}, {"name": "Jiannis K. Pachos"}], "featured_authors": [{"name": "Matthew Buican"}, {"name": "Peter Huston"}, {"name": "Jiannis K. Pachos"}], "author_count": 3}, {"id": "2608.23694", "category": "cond-mat", "title": "Universal Spin-Position Coupled Rydberg Interactions", "abstract": "Strong interactions between $s$-orbital Rydberg atoms underpin atom-array-based quantum computation and quantum simulation. Typically, the spin dependence of these interactions is negligible and plays no practical role. In this Letter, we uncover that a strong electron-spin-dependent Rydberg interaction can emerge when the principal quantum numbers of the two $s$-orbital atoms differ by a sweet-spot value. This interaction originates from the fine-structure splitting of nearby $p$ orbitals, which endows it with distinct symmetry properties such that the electron spins are coupled to the relative position of the two atoms, featuring a spatially defined anisotropy. We further demonstrate that this interaction admits a universal form, independent of the principal quantum numbers, and highlight its fundamental distinction from conventional magnetic dipolar interactions, establishing it as a new type of native magnetic interaction in nature. Our findings introduce a new element to the Rydberg quantum simulation toolbox. As a concrete application, we propose a native realization of the Kitaev-Heisenberg model, which hosts an unusual stripe phase as a quantum many-body manifestation of spin-space locking.", "url": "https://arxiv.org/abs/2608.23694", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chengshu Li"}, {"name": "Hui Zhai"}], "featured_authors": [{"name": "Chengshu Li"}, {"name": "Hui Zhai"}], "author_count": 2}, {"id": "2608.23711", "category": "cond-mat", "title": "Observation of electron spin interactions between Rydberg atoms", "abstract": "We report the observation of electron spin interactions between Rydberg atoms, which are driven by spin-orbit coupling through second-order dipole perturbation and exhibit a spatial anisotropy governed by the atomic configuration. Specifically, we observe coherent electron spin exchange dynamics, with the measured coupling strength agreeing well with both numerical calculations and theoretical models. Furthermore, we show that global microwave dressing enables active engineering and dynamical freezing of the spin exchange by introducing a differential AC Stark shift between the participating states. Additionally, we achieve tunability of the interaction by applying a stronger magnetic field, which effectively modifies the energy contributions of the underlying spin-orbit coupling channels. Finally, measuring spin dynamics in one-dimensional multi-atom chains aligned parallel or perpendicular to the magnetic field provides a self-consistent validation of the anisotropic XXZ framework. This electron spin interaction natively features spin-position coupling and enables a natural mapping onto the Heisenberg-Kitaev model. Our findings reveal a new class of electron spin-spin interactions among Rydberg atoms, expanding the scope of quantum simulation with Rydberg atom arrays.", "url": "https://arxiv.org/abs/2608.23711", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Le Ruan"}, {"name": "Ziqi Zhou"}, {"name": "Yuchen Guo"}, {"name": "Chengshu Li"}, {"name": "Cheng Chen"}], "featured_authors": [{"name": "Le Ruan"}, {"name": "Ziqi Zhou"}, {"name": "Yuchen Guo"}, {"name": "Chengshu Li"}, {"name": "Cheng Chen"}], "author_count": 5}, {"id": "2608.23757", "category": "cond-mat", "title": "Weak irreducibility as a spectral criterion for phase coexistence", "abstract": "Conventional finite-size theories describe first-order coexistence through free-energy competition and interfacial tunneling, but the distinct spectral roles of sector balance and inter-sector connectivity are not usually explicit. We show that pseudo-transitions and thermodynamic phase coexistence are governed by two spectral coordinates: sector imbalance locates balance, while connectivity determines whether that balance remains avoided. At balance, finite connectivity produces a unique dominant state with equal spectral weights in the symmetrized two-sector representation. For short-range systems with positive interface tension, interfacial costs suppress the connectivity exponentially, close the coexistence splitting, and asymptotically restore reducibility. Thus, genuine phase coexistence emerges as the singular limit of finite-size avoided coexistence, whereas one-dimensional pseudo-transitions retain finite connectivity. In a decorated bilayer Ising model, the coexistence gap at independently est", "url": "https://arxiv.org/abs/2608.23757", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Onofre Rojas"}], "featured_authors": [{"name": "Onofre Rojas"}], "author_count": 1}, {"id": "2608.23764", "category": "cond-mat", "title": "Entropy Production Bounds the Accuracy of Computation in Markov Networks", "abstract": "Biological and artificial networks compute by transforming time-dependent inputs into functional outputs. Because the internal state of a stochastic network relaxes on finite timescales, its output generally lags behind a changing environment, producing computational errors. We show that for reversible continuous-time Markov networks the error admits a universal thermodynamic bound. Decomposing the total error into representation and lag contributions, we derive an inequality relating the lag error to the entropy production rate and a memory time equal to the integrated equilibrium autocorrelation of the output observable. The bound implies that accurate dynamical computation requires either substantial dissipation or long-lived memory encoded in slowly relaxing modes. We demonstrate these principles in artificial Markov networks and in models of biochemical information processing. Our results establish a thermodynamic limit on information processing in stochastic networks and provide a quantitative framework for understanding the energetic costs of biological computation.", "url": "https://arxiv.org/abs/2608.23764", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Songela W. Chen"}, {"name": "David T. Limmer"}], "featured_authors": [{"name": "Songela W. Chen"}, {"name": "David T. Limmer"}], "author_count": 2}, {"id": "2608.23815", "category": "cond-mat", "title": "Can Strain or Anion Interchange Make an Unstable Structure Stable? Energetics, Lattice Dynamics and Strain-Tunable Band Gaps of Lithium Chalcohalide Antiperovskites (Li$_{3}$$BA$) and their Anion Interchange Variants (Li$_{3}$$AB$)", "abstract": "Lithium chalcohalide antiperovskites are a promising, non-toxic alternative to lead halide perovskites, with potential as solid electrolytes for Li-ion batteries. we computationally investigate a relatively unexplored anion-interchange mechanism by which cubic Li$_{3}$$AB$ derivatives are obtained from the parent cubic antiperovskite Li$_{3}$$BA$ ($A$ = O, S, Se, Te, Po; $B$ = F, Cl, Br, I). The calculated relative energy landscape provides a useful guide for anion-site selectivity and its role in structural stability. The energetic stability results reveal that the smaller anion inside the octahedron stabilizes the structures. The lattice-dynamic calculations confirm that Li$_{3}$F$A$ ($A$ = Te, Po) and Li$_{3}$O$B$ ($B$ = Cl, Br, I), which are the most energetically stable compounds, are dynamically stable cubic phases without imaginary phonon modes. However, Li$_{3}$FS and Li$_{3}$FSe, while energetically stable, are dynamically unstable at equilibrium and become dynamically stable under triaxial compressive strain. In addition, we report the electronic structure and density of states (DOS) of all compounds, which show a substantial change in band gap upon anion interchange. The strain engineering of the lithium chalcohalide family illustrates how a few percent of the strain can tune the electronic band gap within the electrochemical stability window for solid battery applications. This study unveils essential characteristics of the anion site-interchange mechanism and provides a foundation for the understanding and design of lithium chalcohalide antiperovskites.", "url": "https://arxiv.org/abs/2608.23815", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ismail A. Buliyaminu"}, {"name": "Ehsan Gowdini"}, {"name": "Phillip Duxbury"}, {"name": "Jose L. Mendoza-Cortes"}], "featured_authors": [{"name": "Ismail A. Buliyaminu"}, {"name": "Ehsan Gowdini"}, {"name": "Phillip Duxbury"}, {"name": "Jose L. Mendoza-Cortes"}], "author_count": 4}, {"id": "2608.23856", "category": "cond-mat", "title": "Quantum encoding of structured light into in-plane topological spin textures", "abstract": "Structured light offers a powerful means of controlling light-matter interactions through multiple tunable optical degrees of freedom. Using micromagnetic simulations, we investigate the nucleation of asymmetric bimerons and antibimerons by pulsed Laguerre-Gaussian optical vortices in chiral ferromagnetic thin films with $C_{nv}$ and $D_{2d}$ symmetries, respectively. For optical vortices with orbital angular momentum (OAM) $|m|=1$, circularly polarized beams deterministically nucleate a single bimeron or antibimeron via the interplay of spin angular momentum, OAM, and magnetic chirality, whereas linearly polarized beams produce textures whose topological charge directly follows the OAM ($Q=m$). Optical vortices with OAM $|m|>1$ nucleate clusters and other configurations composed of multiple spin textures, whose morphology and topological charge depend sensitively on the optical quantum numbers and pulse parameters. These findings reveal a route to topology-selective writing through the encoding of optical quantum numbers into distinct in-plane topological magnetic states.", "url": "https://arxiv.org/abs/2608.23856", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pavel A. Vorobyev"}, {"name": "Daichi Kurebayashi"}, {"name": "Oleg A. Tretiakov"}], "featured_authors": [{"name": "Pavel A. Vorobyev"}, {"name": "Daichi Kurebayashi"}, {"name": "Oleg A. Tretiakov"}], "author_count": 3}, {"id": "2608.23904", "category": "cond-mat", "title": "Reentrance and temperature chaos in the $p$-spin Ising spin glass", "abstract": "Reentrant transitions and temperature chaos are two unusual properties of spin glasses and had long been considered physically unrelated. We recently established a logical relation between these two phenomena [Phys. Rev. E 112, 044140 (2025)]. In the present paper, we provide an explicit example of this logical relation in the fully connected Ising $p$-spin glass with a ferromagnetic bias. By expanding the free energy around the triple point, we show analytically that the ferromagnetic--spin glass boundary is reentrant in the vicinity of the triple point throughout the examined range of finite $p>2$. It then follows from the above logical relation that there exists at least one pair of distinct temperatures in the spin glass phase for which the overlap of spin configurations vanishes. This is a necessary condition for temperature chaos, but it would be quite unusual for the overlap to vanish only for selected temperature pairs but not for others within a single spin glass phase. These results therefore strongly suggest the existence of temperature chaos in the sense that the overlaps of spin configurations vanish for all temperature pairs throughout the spin glass phase. Independent evidence for this behavior is provided by a two-temperature replica calculation.", "url": "https://arxiv.org/abs/2608.23904", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hidetoshi Nishimori"}], "featured_authors": [{"name": "Hidetoshi Nishimori"}], "author_count": 1}, {"id": "2608.23905", "category": "cond-mat", "title": "Jamming states in random sequential adsorption of diffusion-limited aggregates", "abstract": "Motivated by the ubiquity of ramified fractal deposits in nature and engineered systems, we investigate the irreversible adsorption of diffusion-limited aggregation (DLA) clusters on a square lattice. We study the role of cluster shape diversity on jamming properties of the system by systematically controlling the number of distinct shapes used across and within realizations, encompassing both monodisperse and polydisperse model variants. Our large-scale simulations over a broad range of cluster sizes $2\\leqslant k\\leqslant4096$ show that the jamming density decreases with cluster size as a power-law $p_j(k)-p_j^\\infty\\sim k^{-\\alpha}$. Both $\\alpha$ and $p_j^\\infty$ are found to depend on the degree of shape diversity, with $\\alpha$ ranging from $0.374(2)$ to $0.417(1)$. It is observed that increasing shape polydispersity promotes denser packing. Importantly, the fluctuations of the jamming density exhibit distinct scaling behavior: $\\sigma(L)\\sim1/L$ for a fixed pool of cluster shape(s), but remain $L$-independent when the pool of shape(s) is refreshed across different realizations. Furthermore, our results demonstrate that the differences between the model variants systematically diminish with increasing $k$ and are expected to vanish as $k\\to\\infty$ due to the statistical self-similarity of the DLA clusters.", "url": "https://arxiv.org/abs/2608.23905", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fahad Puthalath"}, {"name": "Dipanjan Mandal"}, {"name": "Sumanta Kundu"}], "featured_authors": [{"name": "Fahad Puthalath"}, {"name": "Dipanjan Mandal"}, {"name": "Sumanta Kundu"}], "author_count": 3}, {"id": "2608.23942", "category": "cond-mat", "title": "Collective Order Decouples Boundary Selection from Macroscopic Chirality in Confined Active Matter", "abstract": "Can a boundary determine the direction of circulation in a collectively moving active fluid? We study chiral self-propelled particles with nematic bulk alignment, confined by walls whose orientational coupling varies continuously from nematic to polar. For an isolated particle at a wall, we derive the exact parameter condition under which a stable orientation is tangent to the wall. With predominantly nematic wall coupling, however, the many-body circulation changes sign at a chirality that is nearly independent of the wall symmetry. This sign change follows a pronounced decrease in nematic order and disappears when bulk alignment is removed. As the polar wall coupling becomes dominant, opposite-handed circulation is suppressed and same-handed polar locking emerges. Thus local orientation at a wall and the direction of macroscopic circulation are selected by distinct physical processes: the wall determines the possible local orientations, whereas collective order determines whether those orientations control the global flow.", "url": "https://arxiv.org/abs/2608.23942", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Néstor Sepúlveda"}], "featured_authors": [{"name": "Néstor Sepúlveda"}], "author_count": 1}, {"id": "2608.23944", "category": "cond-mat", "title": "Bulk Phase Transition and Edge Behavior in Temporally Correlated Random Matrices", "abstract": "We study long-range correlated Wigner-type matrices built from row-independent stationary Gaussian sequences. For exponentially decaying (AR(1)) correlations, the bulk spectral density deforms from the semicircle law via an explicit combinatorial \"hub\" mechanism, yet we verify the flatness and decay hypotheses of the matrix-Dyson-equation framework (MDE), with numerical evidence supporting Tracy-Widom edge universality for every fixed $\\rho<1$ of the exponential decay correlations; the degenerate limit $\\rho\\to1^-$ reduces to a symmetrized Volterra operator, connecting to the singular-value cascade identified in a companion BBP analysis. For power-law correlations $dt\\sim t^{-\\gamma}$, we identify $\\gamma_c=1/2$ as the critical point for divergence of the bulk fourth-moment, while $\\gamma=1$ marks the breakdown of the flatness condition governing the MDE edge analysis. We prove the fourth-moment transition exactly and find numerically that the self-consistent edge varies smoothly across $\\gamma=1$, with no evidence of a kink or discontinuity.", "url": "https://arxiv.org/abs/2608.23944", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masato Hisakado"}, {"name": "Takuya Kaneko"}], "featured_authors": [{"name": "Masato Hisakado"}, {"name": "Takuya Kaneko"}], "author_count": 2}, {"id": "2608.23954", "category": "cond-mat", "title": "Tunable Mediated Interactions Near Spontaneous Symmetry Breaking: From Yukawa to Coulomb and Dzyaloshinskii--Moriya Interactions", "abstract": "We propose a realization of tunable long-range mediated interactions generated by Nambu-Goldstone (NG) modes near spontaneous symmetry breaking. An effective exchange interaction emerges between two distinguishable impurities proportional to the retarded susceptibility mediated by the bath particles. The interaction is mediated by emergent NG modes associated with symmetry breaking in systems, namely the magnon mode in a repulsive two-component Fermi or Bose gas, or the goldstino mode in a Bose-Fermi mixture. When the NG mode is gapped by explicit symmetry breaking, the interaction has a Yukawa-type short-ranged interaction, whereas the gapless limit gives a Coulomb law. Above the NG mode threshold, the Dzyaloshinskii-Moriya-like cross product coupling emerges in a long-range form. Our proposal paves a way towards the realization of a quantum simulator of spin models and polarons with controllable non-local interactions.", "url": "https://arxiv.org/abs/2608.23954", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hoshu Hiyane"}, {"name": "Hiroyuki Tajima"}], "featured_authors": [{"name": "Hoshu Hiyane"}, {"name": "Hiroyuki Tajima"}], "author_count": 2}, {"id": "2608.23990", "category": "cond-mat", "title": "Arithmetic Tuning of Dynamical Critical Exponents in Quasiperiodic Localization Transitions", "abstract": "The critical exponents and universality classes of localization transitions in quasiperiodic systems are of fundamental importance for understanding critical phenomena in aperiodic systems. Here we show that the dynamical critical behavior can be tuned without adding new terms or changing the form of the Hamiltonian, but solely by varying the incommensurate frequency of the quasiperiodic onsite potential. We construct a family of incommensurate frequencies from the limiting ratios of generalized Fibonacci sequences controlled by the parameters $(m,n)$, and use them to define the quasiperiodic onsite potential. By combining generalized fidelity susceptibility, localization-length scaling, and finite-size gap analysis, we find that the correlation-length exponent is insensitive to the choice of the incommensurate frequency and remains consistent with the correlation-length critical exponent, $\\nu \\simeq 1$, in the localization transition of the standard Aubry--Andr'e--Harper model. In contrast, the dynamical exponent extracted from the low-energy gap scaling varies systematically with the incommensurate frequency. Our results show that changing the incommensurate frequency provides a simple way to tune dynamical critical scaling in deterministic aperiodic systems. Our results suggest instead that the arithmetic structure of an irrational number can serve as a control parameter for nonequilibrium quantum dynamics, enabling the tuning of dynamical critical behavior without changing the microscopic Hamiltonian or the physical spatial dimension.", "url": "https://arxiv.org/abs/2608.23990", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tian-Cheng Yi"}, {"name": "Yi-Fan Liu"}, {"name": "Enguo Guan"}, {"name": "Wen-Long You"}], "featured_authors": [{"name": "Tian-Cheng Yi"}, {"name": "Yi-Fan Liu"}, {"name": "Enguo Guan"}, {"name": "Wen-Long You"}], "author_count": 4}, {"id": "2608.24013", "category": "cond-mat", "title": "Quantum-geometry stabilization of dilute fractional Chern insulators", "abstract": "Fractional Chern insulators have attracted broad interest as lattice analogs of fractional quantum Hall states without Landau levels. However, low-filling fractional Chern insulators are fragile because charge-ordered phases can compete strongly with the fractional topological liquid. Here, we propose a center-decorated kagome model, motivated by geometry-tunable artificial lattices, in which the center-site hopping $t_2$ provides a direct knob for the quantum geometry of an isolated $C=1$ flat band. Here quantum geometry refers to the Berry curvature and Fubini--Study metric, which determine the form factors of interactions projected into the Chern band. Exact diagonalization shows that tuning $t_2$ away from the flatness-optimized kagome limit reduces the trace-condition deviation, suppresses competing charge order, and enhances the many-body stability at both $\\nu=1/3$ and the more fragile $\\nu=1/5$ filling. At $\\nu=1/5$, this stability-enhanced window persists under nearby interaction profiles, including variations of the dominant third-neighbor repulsion and weak nearest-neighbor admixtures. Low-energy spectra, spectral flow, quasihole and entanglement counting, static structure factors, and the quantized total many-body Chern number $C_{\\mathrm{tot}}=1$ consistently support Laughlin-like fractional Chern insulators. These results identify quantum-geometry engineering as a route to stabilizing dilute fractional Chern insulators beyond band-flatness optimization alone.", "url": "https://arxiv.org/abs/2608.24013", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ying-Xing Ding"}, {"name": "Li-Min Zhang"}, {"name": "Wen-Tong Li"}, {"name": "D. L. Zhou"}, {"name": "Wu-Ming Liu"}], "featured_authors": [{"name": "Ying-Xing Ding"}, {"name": "Li-Min Zhang"}, {"name": "Wen-Tong Li"}, {"name": "D. L. Zhou"}, {"name": "Wu-Ming Liu"}], "author_count": 5}, {"id": "2608.24023", "category": "cond-mat", "title": "Scattering-Induced Magnon Layer-Hall Transport beyond Band Geometry", "abstract": "The layer Hall effect has been exclusively attributed to layer-locked Berry curvature, posing a fundamental barrier to its realization in conventional magnets. Here we report a fundamentally distinct layer Hall effect for bosonic excitations, i.e., magnons, which originates solely from non-reciprocal dipolar scattering at heterointerfaces, thereby decoupling the phenomenon from geometric-phase mechanisms. Using a microscopic scattering theory, we demonstrate that a longitudinal temperature gradient drives opposite transverse thermal Hall currents in a nanowire atop a magnetic film, with the direction fully reconfigurable by the applied magnetic field. The effect yields a significant Hall angle of $\\sim 6^{\\circ}$ in conventional magnetic heterostructures, eliminating the need for topological engineering. Our findings establish a scattering-driven paradigm for layer Hall effect, extendable to ferrons and polar phonons, and predict a Hall response that is readily detectable in conventional magnetic heterostructures.", "url": "https://arxiv.org/abs/2608.24023", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhiping Xue"}, {"name": "Zhoujian Sun"}, {"name": "Xiyin Ye"}, {"name": "Lei Zhang"}, {"name": "Tao Yu"}], "featured_authors": [{"name": "Zhiping Xue"}, {"name": "Zhoujian Sun"}, {"name": "Xiyin Ye"}, {"name": "Lei Zhang"}, {"name": "Tao Yu"}], "author_count": 5}, {"id": "2608.24149", "category": "cond-mat", "title": "Classification of Metal - Insulator Transitions: Relating characteristic Properties to Quantum Chemical Bonding Descriptors", "abstract": "Pressure induced metal insulator transitions (MIT) are classified by the evolution of characteristic optoelectronic and vibrational properties calculated with density functional theory. Three classes emerge: ionic solids metallize continuously at band-gap closure with hardening phonons; covalent solids show discontinuous changes in atomic arrangement and optical phonon frequencies; a third class exhibits complete lattice softening and drastically enhanced electron phonon coupling. A one dimensional hydrogen chain reproduces this behavior and serves as a toy model of the underlying bonding mechanism, termed metavalent. Two quantum-chemical descriptors capture the distinct bonding changes behind the three classes. In metavalent solids, competing electron localization and delocalization yield soft optical modes and Peierls distortions on the insulating side, superconductivity on the metallic side, and low lattice thermal conductivity near the MIT.", "url": "https://arxiv.org/abs/2608.24149", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tim Bartsch"}, {"name": "Carl-Friedrich Schön"}, {"name": "Dasol Kim"}, {"name": "Raagya Arora"}, {"name": "Umesh Waghmare"}, {"name": "Matthias Wuttig"}], "featured_authors": [{"name": "Tim Bartsch"}, {"name": "Carl-Friedrich Schön"}, {"name": "Dasol Kim"}, {"name": "Raagya Arora"}, {"name": "Umesh Waghmare"}, {"name": "Matthias Wuttig"}], "author_count": 6}, {"id": "2608.24158", "category": "cond-mat", "title": "Geometric Thermodynamics of Scallop Motion with Two Control Parameters", "abstract": "According to Purcell's scallop theorem, reciprocal single-degree-of-freedom shape deformations cannot achieve net propulsion in a viscous fluid. We show that this limitation is bypassed by thermal fluctuations in a two-parameter driven potential landscape. Formulating the stochastic shape dynamics via a Smoluchowski equation with position-dependent mobility $M_\\mathrm{eff}(x)$, we utilize a generalized inverse operator to evaluate the slow-driving response. Cyclic modulation of the control parameters induces a non-zero Berry-Sinitsyn-Nemenman curvature $F_{12}(\\bm{\\theta})$, resulting in directed geometric propulsion. Simultaneously, the non-adiabatic excess dissipation is dictated by a Riemannian thermodynamic metric $g_{ij}(\\bm{\\theta})$. Our results provide a unified geometric foundation that bridges hydrodynamic friction, stochastic mechanics, and thermodynamic trade-offs in micro-swimmers.", "url": "https://arxiv.org/abs/2608.24158", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hisao Hayakawa"}], "featured_authors": [{"name": "Hisao Hayakawa"}], "author_count": 1}, {"id": "2608.24172", "category": "cond-mat", "title": "Frustration-induced degenerate spin state with up-up-down-down ordering in corner-connected Heisenberg square-plaquettes", "abstract": "We investigate frustrated magnetism of a corner-connected square plaquette Heisenberg model with exchange interactions along the edges $(J_1)$, along inter-plaquette links $(J_2)$, and along square diagonals $(J_3)$. Using Luttinger--Tisza (LT) minimization of the Fourier interaction matrix $\\mathcal J(\\mathbf q)$ together with large-scale Monte Carlo (MC) simulations, we obtain a classical low-temperature magnetic phase diagram in the normalized plane $(J_1/|J_2|, J_3/|J_2|)$. The two methods play complementary roles: the LT analysis provides the zero-temperature candidate ordering wave vectors, while the MC simulations elucidate the resulting ordering tendencies under the hard-spin constraint at low but finite temperatures. Three regimes emerge at low temperatures, an antiferromagnetic phase (AF), a ferromagnetic phase (FM) and a degenerate spin state with \\textit{up-up-down-down (uudd)} ordering (DS). For the frustrated degenerate spinstate, LT exhibits line-like minima along $q_x=\\pm q_y$ in the $hk$-plane, revealing a highly degenerate spin configuration which violates the hard-spin constraint. The MC results uncover a state with quasi-two-dimensional ordering. The DS regime is intrinsically multi-$\\mathbf{q}$: the ordered texture assembles itself from symmetry-related modes on the lines, producing a ``\\textit{uudd}'' spin arrangement comprising of distinctive strong antiferromagnetic correlations on diagonals, ferromagnetic correlations on corner links, and highly suppressed correlations on the edges. The field-temperature phase diagram for a representative parameter point in the DS regime, determined by MC simulations, yields field induced distinct regions of negatively and positively correlated layers. These two regions are separated by a curve corresponding to negligible inter-layer correlations.", "url": "https://arxiv.org/abs/2608.24172", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pritam Manna"}, {"name": "A. K. Bera"}], "featured_authors": [{"name": "Pritam Manna"}, {"name": "A. K. Bera"}], "author_count": 2}, {"id": "2608.24227", "category": "cond-mat", "title": "Two Microscopic Mechanisms of Piezomagnetism in CoF$_2$ from First-Principles Calculations", "abstract": "Rutile-structured CoF$_2$ has long been recognized as a prototypical piezomagnetic material. Recently, it has attracted renewed interest as an altermagnet, exhibiting spin-split electronic bands even in the absence of spin-orbit coupling. Although the piezomagnetic response of CoF$_2$ has been extensively discussed from the viewpoint of magnetic symmetry, its microscopic origin has remained elusive. First-principles calculations reveal two distinct microscopic mechanisms of piezomagnetism in CoF$_2$. Under $xy$ shear strain, the local volumes of the CoF$_6$ octahedra surrounding the two Co sites become different, leading to unequal magnetic moments on the two sublattices and hence a net magnetization. In contrast, under $yz$ shear strain, the piezomagnetic response originates from spin canting induced by the Dzyaloshinskii--Moriya interaction through spin-orbit coupling. The presence of two distinct microscopic mechanisms may be a general feature of piezomagnetic antiferromagnets.", "url": "https://arxiv.org/abs/2608.24227", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hiroshi Katsumoto"}, {"name": "Tamio Oguchi"}, {"name": "Kunihiko Yamauchi"}], "featured_authors": [{"name": "Hiroshi Katsumoto"}, {"name": "Tamio Oguchi"}, {"name": "Kunihiko Yamauchi"}], "author_count": 3}, {"id": "2608.24234", "category": "cond-mat", "title": "Influence of Interface Energy Anisotropy on the Solid-state Instability in Ni-based Superalloy: A Multiscale Study", "abstract": "The microstructural stability of nickel-based superalloys critically depends on the morphology and evolution of $\\gamma'$-precipitates, which is governed by elastic and interfacial anisotropies at the atomic scale. Here, we present a novel quantitative multiscale framework that, for the first time, directly incorporates atomistically computed interface energy anisotropy into mesoscale phase-field simulations to elucidate morphological selection and instability in the Ni--Al system. We employ density functional theory (DFT) to accurately predict the orientation-dependent $\\gamma/\\gamma'$ interface energies for key crystallographic planes. A rigorous analytic mapping is then developed to systematically reduce the three-dimensional (3D) interface anisotropy landscape to the two-dimensional (2D) simulation plane. This enables quantitative transfer of DFT-informed anisotropy parameters into a continuum phase-field model that also accounts for elastic inhomogeneity and eigenstrain. Our simulations demonstrate that the explicit inclusion of DFT-based interface energy anisotropy fundamentally alters precipitate morphological evolution, robustly suppressing instability and faceting phenomena otherwise promoted by supersaturation and elastic effects. The framework bridges atomic- to mesoscale modeling, enabling predictive control of precipitate shapes and providing new insights into the interplay of elastic and interfacial contributions in Ni-based superalloys. This approach paves the way for quantitative microstructural design in advanced high-temperature alloys via first-principles-guided multiscale simulation.", "url": "https://arxiv.org/abs/2608.24234", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sourav Ghosh"}, {"name": "Christian Brandl"}, {"name": "Rajdip Mukherjee"}], "featured_authors": [{"name": "Sourav Ghosh"}, {"name": "Christian Brandl"}, {"name": "Rajdip Mukherjee"}], "author_count": 3}, {"id": "2608.24248", "category": "cond-mat", "title": "Critical bifurcation and deconfined quantum criticality in an interacting cluster Ising chain", "abstract": "We investigate the cluster Ising chain with an additional nearest-neighbor interaction using tensor-network methods and a weak-coupling field theory. Without the interaction, the Jordan-Wigner transformation decomposes the model into a triplet of identical Majorana chains related by an exact $O(3)$ flavor symmetry. Their common mass vanishes at the $SU(2)_2$ Wess-Zumino-Novikov-Witten critical point with central charge $c = 3/2$ separating the symmetry-protected topological cluster phase from a ferromagnet. The interaction reduces $O(3)$ to its cyclic subgroup $C_3$, splitting the triplet into a singlet and a doublet whose gaps close separately, producing a critical bifurcation into Ising ($c = 1/2$) and Gaussian ($c = 1$) critical lines. A second ferromagnetic phase opens between these critical lines for repulsive interactions and a disordered phase for attractive ones. The Gaussian line then separates two Landau-incompatible ferromagnets, realizing a deconfined quantum critical line with emergent $O(2)$ symmetry, along which our independently extracted exponents vary continuously yet satisfy the parameter-free relation $\\beta = (2\\nu - 1)/4$ of the eight-vertex weak universality class. At stronger repulsion this line opens into an extended gapless floating phase with incommensurate algebraic correlations, entered through Berezinskii-Kosterlitz-Thouless transitions. All of these phases and the transitions between them are captured by the weak-coupling theory. Beyond its regime of validity, our simulations reveal a translation-symmetry-breaking antiferromagnet reached through first-order transitions.", "url": "https://arxiv.org/abs/2608.24248", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sourabh"}, {"name": "Bachana Beradze"}, {"name": "Mikheil Tsitsishvili"}, {"name": "Alexander Nersesyan"}, {"name": "Titas Chanda"}], "featured_authors": [{"name": "Sourabh"}, {"name": "Bachana Beradze"}, {"name": "Mikheil Tsitsishvili"}, {"name": "Alexander Nersesyan"}, {"name": "Titas Chanda"}], "author_count": 5}, {"id": "2608.24337", "category": "cond-mat", "title": "Influence of the inter-orbital interaction and kinetic terms on superconductivity: a simple two-orbital Hubbard model", "abstract": "We investigate a minimal two-orbital Hubbard model with intra- and inter-orbital nearest-neighbor hopping $t$ and $\\tilde{t}$, as well as intra- and inter-orbital density-density interactions $U$ and $U'$ by means of variational ansätze based on Jastrow-Slater wave functions within quantum Monte Carlo techniques. To focus on the electronic mechanisms of superconductivity, we restrict the variational ansätze to uniform nonmagnetic states with an explicit pairing amplitude and compute the pairing correlations as a function of filling and model parameters. At $U/t=10$, superconducting correlations are highly enhanced by the presence of inter-orbital terms, $U'$ and $\\tilde{t}$. For $\\tilde{t}=0$, a finite value of $U'$ effectively screens the intra-orbital repulsion $U$, producing a shift in the superconducting dome. Consequently, inter-orbital repulsion yields a sizable increase in electron pairing compared to the single-orbital baseline. Furthermore, introducing a finite $\\tilde{t}$ provides an additional boost to superconducting correlations, an effect driven by the simultaneous presence of flat and broad bands in the electronic structure.", "url": "https://arxiv.org/abs/2608.24337", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vito Marino"}, {"name": "Diego Florez-Ablan"}, {"name": "Luca F. Tocchio"}, {"name": "Massimo Capone"}, {"name": "Federico Becca"}], "featured_authors": [{"name": "Vito Marino"}, {"name": "Diego Florez-Ablan"}, {"name": "Luca F. Tocchio"}, {"name": "Massimo Capone"}, {"name": "Federico Becca"}], "author_count": 5}, {"id": "2608.24378", "category": "cond-mat", "title": "Conformation-Mediated Kinetics of Polymer Chain Scission under Tension", "abstract": "Chain scission is a key molecular process underlying damage and fracture in polymer networks. In this Letter, we develop a statistical-mechanical framework for predicting chain-scission kinetics while accounting for three-dimensional (3D) conformational fluctuations. Within transition-state theory, scission is formulated as a multichannel first-rupture problem, with bond-specific rates governed primarily by self-consistent potentials of mean force. In the freely jointed limit, the additional 3D configurational freedom enhances rupture relative to the collinear 1D reference. Finite bending stiffness introduces orientational correlations that can reverse this enhancement and, at high stiffness, reduce rupture rates by orders of magnitude. These correlations also make rupture bond-position dependent, with higher rates near the chain ends and a common interior rate. For sufficiently long chains, the interior contribution dominates, yielding linear scaling of the chain-scission rate with chain length. These molecularly resolved rates provide physically grounded inputs for future network-scale models of polymer damage and fracture.", "url": "https://arxiv.org/abs/2608.24378", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jie Zhu"}, {"name": "Laurence Brassart"}], "featured_authors": [{"name": "Jie Zhu"}, {"name": "Laurence Brassart"}], "author_count": 2}, {"id": "2608.24382", "category": "cond-mat", "title": "Exact autoregressive sampling of planar Ising spin glasses via the Kac--Ward theory", "abstract": "Exact sampling from the Boltzmann distribution of spin glasses remains an outstanding challenge: Markov chain Monte Carlo methods suffer from critical slowing down and metastable trapping, while modern neural autoregressive samplers such as variational autoregressive networks are approximate and, in the absence of exact reference samples, cannot be rigorously benchmarked. Here we present an exact autoregressive sampling algorithm for planar Ising spin glasses based on the Kac--Ward theory. Under the chain-rule factorization, sequentially fixing spins induces boundary-localized external fields, which destroy the zero-field structure required for exact evaluation. By encoding these fields with a planarity-preserving auxiliary spin construction, the conditional partition functions are mapped to an extended zero-field Ising model and exactly evaluated using the Kac--Ward determinant formula. The method generates strictly independent and identically distributed samples with exact normalized likelihoods at a computational cost of $\\mathcal{O}(N^{5/2})$ for $N$ spins, thereby providing an exact baseline for benchmarking neural autoregressive samplers.", "url": "https://arxiv.org/abs/2608.24382", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jing Liu"}, {"name": "Tao Chen"}, {"name": "Tianrui Che"}, {"name": "Lei Wang"}, {"name": "Youjin Deng"}, {"name": "Pan Zhang"}], "featured_authors": [{"name": "Jing Liu"}, {"name": "Tao Chen"}, {"name": "Tianrui Che"}, {"name": "Lei Wang"}, {"name": "Youjin Deng"}, {"name": "Pan Zhang"}], "author_count": 6}, {"id": "2608.24408", "category": "cond-mat", "title": "Altermagnetic Anomalous Hall Effect and Spin--Edge-Locked Chiral Modes in a Modified Kane--Mele--Hubbard Model", "abstract": "We establish a correlation-driven route to the altermagnetic anomalous Hall effect (AHE) and its associated \\emph{spin--edge-locked} edge states in a modified Kane--Mele--Hubbard model. Using dynamical mean-field theory (DMFT), we show that, at half-filling, increasing the Hubbard interaction drives the system from a metallic paramagnetic phase hosting antichiral edge states into an insulating in-plane Néel-type antiferromagnetic phase, in which a residual antiunitary symmetry forbids the AHE. Hole doping induces a spin-flop transition to an out-of-plane Néel-type antiferromagnetic phase, thereby breaking this symmetry and generating a finite anomalous Hall conductivity that persists into the strongly correlated regime. Distinct from a conventional spin-polarized Hall response in ferromagnets, the altermagnetic AHE receives equal and additive contributions from the two symmetry-related spin sectors and is accompanied by spin--edge-locked chiral states. Our results demonstrate that carrier doping and spin-rotationally invariant Hubbard interactions are sufficient to realize the altermagnetic AHE, without invoking an explicitly Ising-like interaction, and provide a realistic microscopic route toward its realization in correlated transition metal dichalcogenides monolayers.", "url": "https://arxiv.org/abs/2608.24408", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mohsen Hafez-Torbati"}, {"name": "Alireza Qaiumzadeh"}], "featured_authors": [{"name": "Mohsen Hafez-Torbati"}, {"name": "Alireza Qaiumzadeh"}], "author_count": 2}, {"id": "2608.24472", "category": "cond-mat", "title": "Disorder-induced conducting edges on Kagomé lattice", "abstract": "Within a cluster extension of the coherent potential approximation, disorder averaging generates a non-local self-energy that renormalizes both diagonal and off-diagonal hopping terms of the non-interacting Kagome-lattice Hamiltonian. These renormalizations (of both nearest- and next-nearest-neighbor hopping amplitudes) drive the system between two topologically trivial insulating states through an intermediate gapless phase characterized by conducting edge modes over a broad range of impurity concentrations. Our results demonstrate that multiple-scattering effects alone can generate emergent effective spin-orbit interactions and qualitatively modify the edge spectrum of disordered Kagome systems.", "url": "https://arxiv.org/abs/2608.24472", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. Chmeruk"}, {"name": "D. Jones"}, {"name": "L. Chioncel"}], "featured_authors": [{"name": "A. Chmeruk"}, {"name": "D. Jones"}, {"name": "L. Chioncel"}], "author_count": 3}, {"id": "2608.24513", "category": "cond-mat", "title": "Structure-Agnostic Prediction of the Electronic Density of States with a Chemical Language Model", "abstract": "The electronic density of states (DOS) is conventionally computed from a relaxed crystal structure, which is unavailable for compounds that have been neither synthesized nor cataloged. Here we introduce DOSSIER ($\\textbf{D}$ensity $\\textbf{o}$f $\\textbf{S}$tates from $\\textbf{S}$to$\\textbf{i}$chiometry with $\\textbf{E}$ncoder $\\textbf{R}$epresentations), a chemical language model that maps elemental composition directly to this spectrum. The encoder is pretrained by cross-modal knowledge distillation from a universal machine-learning interatomic potential; the transfer lowers the error by 11% when only 1,000 training examples are available. On the Mat2Spec benchmark, DOSSIER reaches a mean absolute error of 3.76 states eV$^{-1}$ against 3.64 for the best structure-aware model; on an extended Materials Project dataset, the predicted spectra yield band gaps and $\\textit{d}$-band descriptors with useful accuracy. Screening 11,977 binary and 13,251 five-component high-entropy alloy compositions for a $\\textit{d}$-projected DOS resembling that of NiPt$_{3}$ places known oxygen reduction electrocatalysts near the top of the ranking.", "url": "https://arxiv.org/abs/2608.24513", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ivan D. Rubtsov"}, {"name": "Ivan V. Dudakov"}, {"name": "Vadim V. Korolev"}], "featured_authors": [{"name": "Ivan D. Rubtsov"}, {"name": "Ivan V. Dudakov"}, {"name": "Vadim V. Korolev"}], "author_count": 3}, {"id": "2608.24514", "category": "cond-mat", "title": "Dynamic quantum phase transitions in the two-leg Creutz ladder with long-range hopping", "abstract": "In this work, we investigate quantum quenches in the two-leg Creutz model with long-range hopping, where the hopping amplitudes decay with distance as a power law characterized by an exponent $\\nu$ and have a finite range $D$. We first obtain the exact solution of a generic two-band model in momentum space. This allows us to compute the Loschmidt amplitude and, consequently, the dynamical free energy $f(\\texttt{t})$ of the two-band model. We also show how to determine the Yang-Lee Fisher (YLF) zeros by solving a nonlinear equation. We demonstrate that the two-leg Creutz model in momentum space is a special case of the generic two-band model. Using these results, we identify the non-analyticities in the dynamical free energy $f(\\texttt{t})$ at critical times $\\texttt{t}_{c}$. We find that the number of nontrivial critical times $N_{s}$ depends on both $\\nu$ and $D$. In particular, we show that for small $\\nu$ and large $D$ the critical times become increasingly dense, leading, in the appropriate regime, to non-analyticities at an increasingly dense set of times---similar to what was observed by Xavier and Hoyos [Phys. Rev. B, $\\textbf{108}$, 214303 (2023)] in the Su-Schrieffer-Heeger (SSH) model with long-range hopping terms.", "url": "https://arxiv.org/abs/2608.24514", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "J. A. da Silva"}, {"name": "J. C. Xavier"}], "featured_authors": [{"name": "J. A. da Silva"}, {"name": "J. C. Xavier"}], "author_count": 2}, {"id": "2608.24533", "category": "cond-mat", "title": "Floquet engineering of spin-valley selective transport in jacutingaite", "abstract": "We study electron transport through a monolayer jacutingaite (Pt$_2$HgSe$_3$) tunnel junction in which only the barrier is irradiated by off-resonant circularly polarized light, while the leads remain undriven. In the high-frequency regime, the driven barrier reduces to an effective static Dirac Hamiltonian with a photon-dressed, valley-dependent mass term. A staggered sublattice potential $V_z$ and a substrate-induced exchange field $m_s$ provide additional tunable mass terms. Using scattering theory, we compute spin- and valley-resolved transmission and reflection, as well as the Landauer conductance. Photon dressing shifts the barrier {Dirac masses} with opposite signs in the ($\\boldsymbol{K}, \\boldsymbol{K}'$) valleys and induces a splitting of the propagation thresholds. The finite barrier then produces channel-dependent Fabry--Pérot-type interference through the phase $q_x^{\\eta s_z}L$. We find broad parameter windows with near-perfect valley filtering ($|P_v|\\simeq 100\\%$) and substantial spin polarization ($|P_s|\\sim 70\\%$). The dominant spin and valley polarizations can be switched by tuning the drive amplitude $A_0$, $V_z$, and~$m_s$.", "url": "https://arxiv.org/abs/2608.24533", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Otman Bouladiane"}, {"name": "Kamal Azaidaoui"}, {"name": "Clarence Cortes"}, {"name": "David Laroze"}, {"name": "Ahmed Jellal"}], "featured_authors": [{"name": "Otman Bouladiane"}, {"name": "Kamal Azaidaoui"}, {"name": "Clarence Cortes"}, {"name": "David Laroze"}, {"name": "Ahmed Jellal"}], "author_count": 5}, {"id": "2608.24566", "category": "cond-mat", "title": "Phoretic interactions in two-medium wedge geometries", "abstract": "We investigate the diffusiophoretic motion of a chemically isotropic active colloid in a three-dimensional wedge formed by two distinct fluid media, in the limit of vanishing Péclet and Reynolds numbers. The concentration field is obtained using the Fourier-Kontorovich-Lebedev transform, yielding an exact representation for arbitrary wedge opening angles and interfacial contrasts. We introduce the interfacial parameter $\\Gamma=(1-\\lambda\\ell)/(1+\\lambda\\ell)$, where $\\lambda$ denotes the diffusivity contrast and $\\ell$ the solute partition coefficient. For $\\Gamma=\\pm1$ and commensurate wedge angles, the solution reduces to finite image constructions, with distinct structures for even and odd commensurability. The general solution also recovers the planar-interface and semi-infinite-interface limits. The leading-order translational phoretic velocity is derived from the concentration field, revealing a strong interplay between wedge geometry and interfacial properties that governs both the magnitude and direction of particle motion. This work provides a framework for understanding and controlling phoretic transport in confined multiphase environments and offer a basis for extensions to finite-size geometries and mixed fluid--fluid and solid boundary conditions. Our results may find applications in the control of active-particle transport in confined multiphase environments, where interfacial properties and geometry can be exploited to tune phoretic motion.", "url": "https://arxiv.org/abs/2608.24566", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Abdallah Daddi-Moussa-Ider"}], "featured_authors": [{"name": "Abdallah Daddi-Moussa-Ider"}], "author_count": 1}, {"id": "2608.24581", "category": "cond-mat", "title": "Intervalley Magnetotrions Tunable by Electric and Magnetic Fields in Buckled Two-Dimensional Materials", "abstract": "We develop a theoretical framework for intervalley magnetotrions in buckled two-dimensional materials, including silicene, germanene, and stanene, subjected to perpendicular electric and magnetic fields. Within the effective-mass approximation, the three-particle Schrödinger equation is formulated with the Rytova--Keldysh interaction potential and analyzed in the high-magnetic-field regime. We demonstrate that intervalley trions with equal electron and hole effective masses constitute an exceptional case for which the center-of-mass and internal motions separate exactly. The center-of-mass motion is governed by a two-dimensional harmonic-oscillator Hamiltonian, leading to quantized Landau states whose energies form electrically tunable Landau surfaces controlled by the magnetic field and the electric-field dependence of the carrier effective masses. The internal motion is investigated by solving the three-body Schrödinger equation within the framework of the hyperspherical harmonics method. Numerical calculations reveal that the trion binding energy increases monotonically with both magnetic and electric fields owing to the combined effects of magnetic confinement and electric-field-induced enhancement of the effective masses. The strongest binding is obtained for silicene, followed by stanene and germanene. The present work provides a unified description of both the collective center-of-mass motion and the internal dynamics of magnetotrions in Xene monolayers, demonstrating that both degrees of freedom can be independently manipulated by external electric and magnetic fields.", "url": "https://arxiv.org/abs/2608.24581", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Roman Ya. Kezerashvili"}, {"name": "Shalva M. Tsiklauri"}, {"name": "Anastasia Spiridonova"}], "featured_authors": [{"name": "Roman Ya. Kezerashvili"}, {"name": "Shalva M. Tsiklauri"}, {"name": "Anastasia Spiridonova"}], "author_count": 3}, {"id": "2608.24587", "category": "cond-mat", "title": "Disorder-tuned crossing of monopole and conventional pairing instabilities in multi-Weyl semimetals", "abstract": "We study how non-magnetic impurity scattering affects the emergence and possible coexistence of pairing instabilities in a two-node multi-Weyl semimetal. Within an explicitly specified projected impurity kernel---valley diagonal and momentum independent across each Fermi pocket, the leading behaviour of non-magnetic disorder in the small-pocket window $q^{\\max}_{\\rm intra}\\xi_{\\rm dis}\\ll1\\ll|2\\mathbf Q|\\xi_{\\rm dis}$, treated at leading order in Born and Abrikosov--Gor'kov theory---quenched disorder tunes the leading pairing instability from a topologically nontrivial monopole channel to a conventional ($s$-wave) one, extending our earlier clean-system analysis into the disordered regime. A Born self-energy calculation in the chiral band basis then gives: (i) a band-isotropic conventional channel that is Anderson protected against intra-node scalar disorder ($\\eta_s=1$), introduced phenomenologically at the projected-band level; solving the competition for arbitrary $\\eta_s$ yields the crossing criterion $(1-\\eta_s)/(1-\\eta_m)<T_{c0}^{(s)}/T_{c0}^{(m)}$, so the mechanism tolerates substantial loss of conventional-channel protection; and (ii) a rank-one monopole sector fixing $f_m$ as the exact eigenfunction with $\\eta_m(J)=1/(J+2)$, exact given that kernel. The crossing location in $\\Gamma_N/T_{c0}^{(m)}$ is set by $\\eta_m(J)$, $\\eta_s$, and $r=T_{c0}^{(s)}/T_{c0}^{(m)}$. From the clean projected BdG Hamiltonian the pure monopole nodes carry Berry charge $\\pm J$, distinct from the gapped conventional solution; the clean nodal thermodynamics is charge-dependent, $N_{\\rm SC}(E)\\propto E^{2/J}$ and $C\\propto T^{1+2/J}$, and the residual density of states shows a threshold only for $J=1$. The crossing lies in the moderately metallic regime, $\\mu/\\Gamma_N\\simeq11$--$14$ for the illustrative $T_{c0}^{(m)}/\\mu=0.133$ used in the figures.", "url": "https://arxiv.org/abs/2608.24587", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Enrique Muñoz"}, {"name": "Rodrigo Soto-Garrido"}], "featured_authors": [{"name": "Enrique Muñoz"}, {"name": "Rodrigo Soto-Garrido"}], "author_count": 2}, {"id": "2608.24607", "category": "cond-mat", "title": "Interface-Controlled Defect Engineering in TiN/TaN Superlattices for Enhanced Hardness and Fracture Toughness", "abstract": "TiNTaN superlattice coatings were designed to investigate how atomic-scale interface chemistry and defect-stabilized TaN layers govern hardness and fracture toughness. Guided by first-principles predictions identifying TaN-based layers as more damage tolerant than TiN, coherent superlattices with a bilayer period of 6 nm were synthesized by reactive magnetron sputtering and interfacially doped with C, B, or Si. Structural and chemical analyses reveal coherent fcc architectures with well-defined interfaces. Si segregates preferentially to the interfaces while incorporating into both TiN and TaN, whereas C and B predominantly diffuse into the TaN layers, modifying coherency strain, bonding, and defect populations. Consequently, hardness increases from 34 GPa for the undoped superlattice to 41 GPa for the Si-doped architecture, whereas fracture toughness increases from 2.8 to 4.0 MPam0.5 for the B-doped superlattice. First-principles calculations show that vacancy-stabilized TaxNy enhances elastic compliance and elastic contrast rather than intrinsic toughness, while the additional toughening induced by B indicates localized defect-assisted energy dissipation at chemically engineered interfaces. Thus, Si maximizes interface strengthening, whereas B provides the most favourable hardness-toughness balance while preserving high hardness, 38 GPa. These findings establish interface chemistry as an additional design parameter for tailoring the mechanical performance of ceramic nitride superlattices.", "url": "https://arxiv.org/abs/2608.24607", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zecui Gaoa"}, {"name": "Qimin Wang"}, {"name": "Julian Buchinger"}, {"name": "Nikola Koutna"}, {"name": "Marcus Hans"}, {"name": "Zaoli Zhang"}, {"name": "Jochen Schneider"}, {"name": "Daniel Primetzhofer"}, {"name": "Paul Heinz Mayrhofer"}], "featured_authors": [{"name": "Zecui Gaoa"}, {"name": "Qimin Wang"}, {"name": "Julian Buchinger"}, {"name": "Jochen Schneider"}, {"name": "Daniel Primetzhofer"}, {"name": "Paul Heinz Mayrhofer"}], "author_count": 9}, {"id": "2608.24608", "category": "cond-mat", "title": "Thermal DMRG for quasi one-dimensional magnetic molecules and chains", "abstract": "Density matrix renormalization group methods or tensor network methods in general can not only be used to determine ground states but also to evaluate thermal equilibrium properties. Although convergence is superior for one-dimensional quantum spin systems with nearest neighbor exchange and open boundary conditions, the hope is that these methods can as well be employed to approximate magnetic observables of magnetic molecules with more complex interaction patterns. Here, we study the accuracy that can realistically be achieved for several archetypical quasi one-dimensional structures using the TenPy suite. In our study, we aim at systems that are too large for exact diagonalization or Krylov space methods.", "url": "https://arxiv.org/abs/2608.24608", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "L. Horstmann"}, {"name": "J. Schnack"}], "featured_authors": [{"name": "L. Horstmann"}, {"name": "J. Schnack"}], "author_count": 2}, {"id": "2608.24613", "category": "cond-mat", "title": "Transport interpretation of entanglement Hamiltonian cumulants in integrable quantum quenches", "abstract": "We study the dynamics of the cumulants of the entanglement Hamiltonian in interacting integrable models following global quantum quenches. Building on recent results based on space-time duality, we show that these cumulants are exactly given by the cumulants of currents of suitable conserved charges evaluated in the macrostate selected by the initial state. This establishes a direct connection between entanglement dynamics and transport, providing a transport counterpart to the quasiparticle picture that successfully describes the evolution of the von Neumann entropy. In the free-fermion and conformal limits, our results reduce to the difference between the current cumulants carried by right- and left-moving excitations, recovering previously known expressions. In interacting integrable models, where a decomposition into independent right and left movers is no longer meaningful at the operator level, a similar structure survives at the level of the entanglement spectrum, yielding a unified description of entanglement Hamiltonian fluctuations across free, conformal, and interacting integrable systems.", "url": "https://arxiv.org/abs/2608.24613", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Riccardo Travaglino"}, {"name": "Pasquale Calabrese"}], "featured_authors": [{"name": "Riccardo Travaglino"}, {"name": "Pasquale Calabrese"}], "author_count": 2}, {"id": "2608.24625", "category": "cond-mat", "title": "Ideal Bose-Einstein condensation in the canonical ensemble: exact asymptotic estimates from large deviations", "abstract": "In this work we present a large-deviations approach to the calculation of the canonical partition function for free bosons. Three-dimensional Bose-Einstein condensation is studied in the fixed-density ensemble as a function of the dimensionless density $\\varrho = \\rho \\lambda_T^3$, with $\\rho=N/L^3$ the standard particle density, $\\lambda_T$ the thermal wavelength, $L$ the linear size of the box and $N$ the total number of particles. A large-deviations approach in terms of the dimensionless parameter $\\ell=L/\\lambda_T$ allows us to provide exact asymptotic estimates of the canonical partition function both above and below the critical density $\\varrho_c$ for Bose-Einstein condensation. We show how this approach allows to explicitly account for finite-size effects and how it fully captures the first-order aspects of the transition, allowing us to explicitate its driving mechanism in terms of the competing probabilities of normal and condensed phases. The proposed large-deviations approach allows then to obtain in all regimes explicit and simple analytical expressions, at the leading order in the large parameter $\\ell$, for both the average fraction of particles in the ground state, the condensate fraction $\\langle n_0(\\varrho) \\rangle = \\langle N_0(\\varrho) \\rangle/N$, and for its fluctuations, $\\sigma_0(\\varrho) = \\sqrt{\\langle N_0^2(\\varrho)\\rangle - \\langle N_0(\\varrho)\\rangle^2}/N$, retrieving for instance the anomalous scaling $\\sigma_0(\\varrho)\\sim 1/V^{1/3}$ in the condensed regime, $\\varrho > \\varrho_c$. Our large-deviations asymptotic estimate, by analytically clarifying the mixed-order nature of Bose-Einstein condensation, allows then to reveal the similarity between this transition and other mixed-order transitions, as for instance the localization transition in the Discrete Non-Linear Schrödinger Equation.", "url": "https://arxiv.org/abs/2608.24625", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Giacomo Gradenigo"}, {"name": "Dario Lucente"}, {"name": "Luca Salasnich"}], "featured_authors": [{"name": "Giacomo Gradenigo"}, {"name": "Dario Lucente"}, {"name": "Luca Salasnich"}], "author_count": 3}, {"id": "2608.24663", "category": "cond-mat", "title": "Exciton fine structure in nanocrystals: effect of cuboidal and spheroidal shapes", "abstract": "We present the theory of the band-edge exciton fine structure in nanocrystals (NCs) with spheroidal and cuboidal shapes. The effects of the cubic symmetry of the crystal lattice, the cubic shape of the NC, and NC uniaxial anisotropy on the hole energy states and electron-hole exchange interactions are considered non-perturbatively. Symmetry analysis yields an effective Hamiltonian for the exciton fine structure, parameterized by one constant for hole energy splitting and five independent constants for exchange interaction. Numerical calculations reveal that in uniaxially anisotropic zinc-blende NCs, the sign of the hole ground state splitting depends on the material parameters and on the orientation of the anisotropy axis relative to the crystallographic axes. Beyond the conventional bulk cubically-symmetric contribution to the exchange interaction, which originates from Bloch-function symmetry and is typically negligible, in nanocrystals, we identify the contribution arising from the cubic symmetry of the envelope wavefunction. This cubically symmetric envelope-induced short-range exchange is non-negligible in cuboidal NCs and induces a pronounced splitting of the dark exciton states. We further analyze the influence of uniaxial anisotropy of the exchange constants on both the exciton fine structure and the oscillator strength. Special attention is paid to NCs, where the anisotropy of the exchange constants is comparable to a relatively small hole energy anisotropic splitting.", "url": "https://arxiv.org/abs/2608.24663", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "M. A. Semina"}, {"name": "O. O. Druzhinina"}, {"name": "A. A. Golovatentko"}, {"name": "A. V. Rodina"}], "featured_authors": [{"name": "M. A. Semina"}, {"name": "O. O. Druzhinina"}, {"name": "A. A. Golovatentko"}, {"name": "A. V. Rodina"}], "author_count": 4}, {"id": "2608.24694", "category": "cond-mat", "title": "Hierarchical Quantum Transport from Coupled Topological Domain-Wall States in SSH Chains", "abstract": "We investigate the transport properties of Su-Schrieffer-Heeger (SSH) chains containing multiple topological domain walls and show that their interaction generates a hierarchy of emergent spectral structures. Each domain wall contributes a localized state inside the SSH gap, and the hybridization of these states produces minibands whose signatures are directly reflected in the transmission spectra. By combining domain-wall lattices with different domain-wall separations, we construct effective SSH structures within the miniband subspace. The resulting transmission spectra reproduce the characteristic features of conventional SSH chains, including gap formation, finite-size resonances, and the correspondence between transmission spectra and band structure. The construction can be applied recursively, generating successive generations of effective SSH structures. As a consequence, effective SSH spectra repeatedly emerge within progressively narrower energy intervals, producing a self-similar hierarchy of minibands and spectral gaps. To understand the origin of this hierarchy, we develop an effective renormalized description based on successive decimation. The effective parameters exhibit a hierarchy of interlaced singularities whose number increases at each iteration. These singularities partition the energy axis into progressively finer intervals and provide a natural interpretation of the repeated fragmentation of the spectrum. Our results show that topological domain-wall states can act as emergent degrees of freedom from which multiscale transport channels, effective couplings, and hierarchical spectral structures may be engineered. More generally, the framework introduced here establishes a connection between recursive topological constructions, effective Hamiltonians, and the emergence of self-similar spectra in one-dimensional systems.", "url": "https://arxiv.org/abs/2608.24694", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alessio Palavicini"}, {"name": "César G. Galván"}, {"name": "Carlos Ramírez"}], "featured_authors": [{"name": "Alessio Palavicini"}, {"name": "César G. Galván"}, {"name": "Carlos Ramírez"}], "author_count": 3}, {"id": "2608.24733", "category": "cond-mat", "title": "Multiscale Modelling of Ferroelectrics using a Physics-Informed Neural Network Driven by Molecular Dynamics Data: Parameter Identification and Field Reconstruction", "abstract": "In multiscale modeling of ferroelectrics, combining atomistic simulation with continuum-scale phase-field models (PFM) remains a fundamental challenge. A key difficulty lies in faithfully capturing discrete atomic-level information within a continuum modeling framework, while accurately representing material behavior at the mesoscale. In this paper, a Physics-Informed Neural Network (PINN) driven by molecular dynamics (MD) data is used. The loss function of the network consists of a supervised term that fits the discrete spatial polarization distributions obtained from MD simulations of systems containing domain walls, and a physics-based term that incorporates the residuals of partial differential equations (PDEs) of steady-state PFM. To ensure stable and balanced training among the different loss components, adaptive gradient normalization (GradNorm) is used to dynamically adjust the task weights. By minimizing the total loss, the model not only reconstructs the polarization field along with the associated strain, stress, and energy landscape at the continuum scale, but also identifies critical physical parameters of the phase-field model, including the characteristic energy density, characteristic length factor, gradient energy anisotropy factor, and Landau polynomial coefficients. By using the PINN-predicted physical parameters in COMSOL Multiphysics to solve the corresponding PDEs within a finite element framework, we demonstrate that these parameters enable accurate reproduction of the ferroelectric domain structure and the associated material response, including stress/strain distributions and energy landscape. This framework provides an effective methodology for establishing multiscale connections between atomistic and continuum descriptions, and holds the potential to infer underlying physical properties directly from polarization distributions for a wide range of materials.", "url": "https://arxiv.org/abs/2608.24733", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xuejian Wang"}, {"name": "Frank Wendler"}, {"name": "Hikaru Auzuma"}, {"name": "Michael Zaiser"}, {"name": "Shuji Ogata"}, {"name": "Ryo Kobayashi"}, {"name": "Lei Zeng"}, {"name": "Xingchen Tan"}], "featured_authors": [{"name": "Xuejian Wang"}, {"name": "Frank Wendler"}, {"name": "Hikaru Auzuma"}, {"name": "Ryo Kobayashi"}, {"name": "Lei Zeng"}, {"name": "Xingchen Tan"}], "author_count": 8}, {"id": "2608.24755", "category": "cond-mat", "title": "Beyond capillary condensation: Shear-induced bridging transitions in patterned slits", "abstract": "We study the equilibrium phase behavior of a fluid confined in a slit made from two patterned walls. Shearing the walls frustrates the fluid, due to a competition between capillary condensation and interface delocalization, forcing the formation of bridging phases with different pinning properties. This leads to an unusually rich phase diagram, displaying first-order and continuous phase transitions, depending sensitively on the slit width and shear. Generalized Kelvin equations determine the phase boundaries, while the bridging phases are characterized by large correlation lengths, predictions for which are tested using a microscopic density functional model.", "url": "https://arxiv.org/abs/2608.24755", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexandr Malijevský"}, {"name": "Andrew O. Parry"}, {"name": "Jiří Janek"}], "featured_authors": [{"name": "Alexandr Malijevský"}, {"name": "Andrew O. Parry"}, {"name": "Jiří Janek"}], "author_count": 3}, {"id": "2608.24813", "category": "cond-mat", "title": "Roton Instability in Quantum Droplets with Finite-Range Soft-Core Interaction", "abstract": "We investigate the emergence of roton instability in self-bound quantum droplets interacting via a finite-range soft-core potential modeled by a Heaviside step interaction. The ground-state properties are obtained by solving the extended Gross-Pitaevskii equation including Lee-Huang-Yang corrections with a nonlocal interaction term. The collective excitation spectrum reveals the formation and progressive softening of a roton minimum as the interaction strength and range increase. When the roton energy approaches zero, the system becomes unstable, signaling the onset of density modulation. The rotonic behavior is further characterized through the static structure factor, which exhibits pronounced peaks at the roton momentum.", "url": "https://arxiv.org/abs/2608.24813", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Avra Banerjee"}], "featured_authors": [{"name": "Avra Banerjee"}], "author_count": 1}, {"id": "2608.24838", "category": "cond-mat", "title": "Accidental accuracy and vertex corrections in $GW$: Exact benchmarks for the extended Hubbard model", "abstract": "The $GW$ approximation is the standard tool for quasiparticle predictions in materials, yet its regime of validity in correlated systems remains poorly quantified, because \\textit{ab initio} vertex corrections are computationally prohibitive. Using exact diagonalization of the half-filled extended Hubbard model on finite rings as a numerically exact reference, we construct the corresponding model-space $GW$ theory on the identical Hilbert space and quantify its error as a function of local ($U$) and non-local ($V$) interaction strength. We find that the vertex correction changes character across the phase diagram: in the weak-coupling regime the effective vertex $\\Gamma_{\\rm eff} < 1$, reflecting the suppression of RPA charge fluctuations by exact short-range correlations, whereas in the Mott regime $\\Gamma_{\\rm eff}$ grows monotonically (to $\\sim 3$ for $N=6$, reflecting the local vertex required to open the Hubbard gap. Vertex corrections in the electron-hole (polarizability) channel are shown to \\emph{worsen} the gap error, indicating that the Mott gap resides in the self-energy channel. For $V=0$, static $COHSEX$ is accidentally exact at a single crossover point $U^* \\approx 3.5\\,t$; finite $V$, through non-local Fock exchange, splits this point into a double-crossover window that collapses toward weak coupling. These results yield quantitative diagnostics for the reliability of $GW$ in correlated materials.", "url": "https://arxiv.org/abs/2608.24838", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Michael O. Atambo"}], "featured_authors": [{"name": "Michael O. Atambo"}], "author_count": 1}, {"id": "2608.24867", "category": "cond-mat", "title": "Fast generation of spectrally-shaped disorder, on the sphere", "abstract": "The design of disordered point patterns with desirable properties is an exciting and ongoing research endeavor, with applications ranging from materials to computer science. A successful approach in recent years has been the optimization of point patterns through a loss function that enforces properties in their Fourier-space representation. Yet, these methods have so far strictly been limited to flat Euclidean space, precluding their use in the contexts of coatings of curved surfaces for photonics, or of sampling of curved manifolds for instance. We introduce FaSHIoNPOp, an algorithm that relies on fast non-uniform spherical harmonics transforms, to enforce pair correlations in point patterns on the sphere with an $O(N \\log N)$ complexity in $N$ the number of points. Having demonstrated its performance, we showcase applications of FaSHIoNPOp, ranging from the generation of hyperuniform structures on the sphere for sampling and physical applications, to the design of gyromorphs (disordered structures with maximal scattering power at a given frequency) on the sphere. We additionally show that FaSHIoNPOp can be combined to both global constraints like centrosymmetry, with applications to the design of more isotropic $3d$ gyromorphs, and local real-space constraints like pair repulsion. Our work paves the way for optimal sampling and coating design on curved manifolds, with many applications across physics, materials and computer science.", "url": "https://arxiv.org/abs/2608.24867", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mathias Casiulis"}, {"name": "Stefano Martiniani"}], "featured_authors": [{"name": "Mathias Casiulis"}, {"name": "Stefano Martiniani"}], "author_count": 2}, {"id": "2608.23674", "category": "hep-th", "title": "Non-perturbative news from the conformal window", "abstract": "Dynamical symmetry breaking plays a crucial role in mass and scale generation. In QCD-like theories, its dependence on the number of fermion flavours determines the phase structure and the transition to the conformal regime. In this work, we employ the functional renormalisation group and the generalised flow equation to compute non-perturbative corrections, including momentum dependencies and field invariants essential for an adequate realisation of the global symmetry. As a consequence, the critical gauge coupling required for dynamical chiral symmetry breaking acquires a strong dependence on the number of flavours and increases sharply at $N_f^\\textrm{crit}\\simeq 7.30$ for $N_c=3$. This establishes a new pic
