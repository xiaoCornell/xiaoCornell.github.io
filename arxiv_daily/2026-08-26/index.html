ture of the conformal phase transition that challenges Miransky/BKT scaling and the existence of walking regimes, favours a first-order quantum phase transition, and points towards a critical region with exotic dynamics and symmetric fermion mass gaps.", "url": "https://arxiv.org/abs/2608.23674", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Álvaro Pastor-Gutiérrez"}], "featured_authors": [{"name": "Álvaro Pastor-Gutiérrez"}], "author_count": 1}, {"id": "2608.23676", "category": "hep-th", "title": "Wilsonian Cosmology: de Sitter (in)Stability", "abstract": "We develop a (Wilsonian) functional-renormalisation-group framework for scalar cosmology in which quantum fluctuations of a scalar field are coarse-grained on cosmological spacelike hypersurfaces. Integrating out quantum fluctuations with wavelengths smaller than the Hubble radius $H(t)^{-1}$, we obtain an effective scalar potential $U(\\phi(t),H(t))$ that evolves in time. We derive a non-perturbative flow equation for this potential, together with the coupled set of (modified) Friedmann equations. We then apply this formalism to the simplest possible case of a de Sitter vacuum when the scalar field is at rest, in two situations which satisfy exactly our flow equation: $(i)$ A flat potential, for which we find that the only pure de Sitter solution is unstable and corresponds to a saddle point. $(ii)$ A quadratic potential with curvature $m^2>0$, for which we find that the presence of the mass term stabilises the system. The latter case leads to a de Sitter attractor either at the Hubble scale when the mass is larger than the Hubble scale at initial time, or by introducing a new attractor located at $H=m$ in the case the mass is smaller, which may be particularly relevant to the phenomenological study of dark energy and inflation theories.", "url": "https://arxiv.org/abs/2608.23676", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jean Alexandre"}, {"name": "Lucien Heurtier"}, {"name": "Silvia Pla"}], "featured_authors": [{"name": "Jean Alexandre"}, {"name": "Lucien Heurtier"}, {"name": "Silvia Pla"}], "author_count": 3}, {"id": "2608.23686", "category": "hep-th", "title": "Color-Kinematics Duality and the Double Copy in Curved Spacetimes", "abstract": "The double copy relates gravitational data to gauge-theory data, most sharply through color-kinematics duality for flat-space scattering amplitudes. This review surveys the extent to which this idea can be formulated beyond asymptotically flat backgrounds. After recalling the flat-space ingredients needed for comparison, we describe curved-space constructions for boundary correlators and scattering observables in AdS, dS, and other non-trivial backgrounds. We then review classical and field-level maps, including Kerr--Schild, Weyl, Cotton, twistor, and convolutional double copies. A separate part is devoted to self-dual sectors. Throughout, we emphasize both the common structures that survive from flat space and the obstructions introduced by curvature.", "url": "https://arxiv.org/abs/2608.23686", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mariana Carrillo González"}], "featured_authors": [{"name": "Mariana Carrillo González"}], "author_count": 1}, {"id": "2608.23689", "category": "hep-th", "title": "A semiclassical Hilbert space for random matrix theory", "abstract": "We study the one-sided time evolution of thermofield double (TFD) states in random matrix theory, where the Hamiltonian is taken to be a $D\\times D$ random matrix drawn from a unitarily invariant emsemble of Hermitian matrices. We argue that the Krylov basis with the maximally entangled state taken as the initial vector gives a semiclassical Hilbert space description of these TFD states in random matrix theory at any $O(1)$ temperature and time in the $D\\to \\infty$ limit, very analogous to the ``chord Hilbert space'' construction in the double-scaled SYK (DSSYK) model. We study this semiclassical description in detail for ensembles where the spectral density in the $D\\to \\infty$ limit is even, compactly supported on an interval and has square root edges. With a few more conditions on the analytic structure of the spectral density, we observe that the semiclassical Hamiltonian has the same asymptotic behavior at large Krylov depth as that of DSSYK, with the corresponding parameter $\\mathfrak{q}=e^{-\\lambda}$ being related to the location of the nearest zero of the spectral density away from the spectral cut. Furthermore, in a large class of models corresponding to ultraviolet deformations of the DSSYK spectral density, i.e., where the spectrum in the UV is modified while leaving the near-edge behavior unchanged, we show that the semiclassical effective Hamiltonian in the Krylov basis reduces to the Liouville Hamiltonian of JT gravity in a low-energy, continuum limit. This suggests that our semiclassical Hilbert space should be interpreted as the bulk Hilbert space of a dual gravity description.", "url": "https://arxiv.org/abs/2608.23689", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Abhirup Bhattacharya"}, {"name": "Onkar Parrikar"}, {"name": "Vivek Singh"}], "featured_authors": [{"name": "Abhirup Bhattacharya"}, {"name": "Onkar Parrikar"}, {"name": "Vivek Singh"}], "author_count": 3}, {"id": "2608.23692", "category": "hep-th", "title": "Exact mutual information for free massless fermions in any dimension", "abstract": "We obtain an exact expression for the Rényi mutual information (RMI) between two spherical regions for a free, massless Dirac field in $d$ spacetime dimensions and for a massless Rarita-Schwinger field in $d=4$. We identify each angular momentum mode in the spherical dimensional reduction of the parent theory with a massive Dirac fermion in two dimensional anti-de Sitter space (AdS). The RMI for each mode can be computed analytically for any Rényi index $n$ in terms of solutions of a Painlevé differential equation. We explore the long and short distance asymptotics of the result, where the sum over modes can be computed explicitly. As a result we are able to find subleading contributions to the long distance expansion in $d$ dimensions for arbitrary $n$, as well as to extract the area and logarithmic coefficients for the case $n=1$ in the short distance regime.", "url": "https://arxiv.org/abs/2608.23692", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nicolás Abate"}, {"name": "Leandro Martinek"}], "featured_authors": [{"name": "Nicolás Abate"}, {"name": "Leandro Martinek"}], "author_count": 2}, {"id": "2608.23697", "category": "hep-th", "title": "Bremsstrahlung function from Goldstone bosons in AdS$_2$", "abstract": "We study quantum field theory on the AdS$_2$ worldsheet of the fundamental string dual to the half-BPS Wilson line of $\\mathcal{N}=4$ super Yang-Mills. We consider a recently proposed gauge-fixed string fluctuation Lagrangian around the AdS$_2$ minimal surface, and focus on the nonlinearly realized $SO(6)/SO(5)$ symmetry. The boundary two-point function of the associated tilt operators, whose normalization coefficient is proportional the Bremsstrahlung function, can be related to the bulk two-point function of the broken-symmetry Noether current through the boundary operator expansion. We evaluate the one-loop diagrams contributing to the current correlator, discussing the role of dimensional regularization and recovering the known strong-coupling correction to the Bremsstrahlung function directly from AdS$_2$ worldsheet quantum field theory.", "url": "https://arxiv.org/abs/2608.23697", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Federico Castellani"}, {"name": "Lorenzo Di Pietro"}, {"name": "Valentina Forini"}, {"name": "Roman Stemplowski"}], "featured_authors": [{"name": "Federico Castellani"}, {"name": "Lorenzo Di Pietro"}, {"name": "Valentina Forini"}, {"name": "Roman Stemplowski"}], "author_count": 4}, {"id": "2608.23709", "category": "hep-th", "title": "Holographic Spread Complexity at Fixed Charge: Routhians, Branes and Strings", "abstract": "Holographic spread (Krylov) complexity relates the growth of a boundary state's complexity to the proper radial momentum of a probe falling into the bulk. Unitary evolution makes spread complexity an even function of time. We show that this requirement fails whenever a probe carries a conserved Noether charge and is described by its unreduced Lagrangian. The cure is simple and universal: passing to the Routhian of the fixed-charge sector restores the correct short-time behaviour of the complexity. We establish this prescription from first principles and test it across an extensive family of probes: charged particles, non-BPS D-branes with detuned tension and charge, branes excited along internal isometries, worldvolume gauge fields, a fluctuating D0-brane in AdS$_4\\times \\mathbb{CP}^3$ and fundamental strings combining winding with rotation in AdS$_5\\times \\mathrm{S}^5$ complemented by further examples in AdS$_3\\times \\mathrm{S}^3\\times T^4$, ABJM, and the charged Anabalón-Ross background. We then translate these results into Krylov-chain data, extracting Lanczos coefficients and Krylov-number correlators, and propose that complexity for charged, extended probes organises naturally into collective, fluctuation, charge and mixed contributions. This decomposition opens a concrete path toward a genuinely field-theoretic, multi-seed construction of holographic complexity.", "url": "https://arxiv.org/abs/2608.23709", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dimitrios Chatzis"}, {"name": "Madison Hammond"}, {"name": "Carlos Nunez"}, {"name": "Alfonso V. Ramallo"}, {"name": "Ricardo T. Santamaria"}], "featured_authors": [{"name": "Dimitrios Chatzis"}, {"name": "Madison Hammond"}, {"name": "Carlos Nunez"}, {"name": "Alfonso V. Ramallo"}, {"name": "Ricardo T. Santamaria"}], "author_count": 5}, {"id": "2608.23753", "category": "hep-th", "title": "Bell-CHSH Violation for a Massless Majorana Field in a Double Cone from Modular Localization", "abstract": "We investigate Bell-CHSH correlations for a chiral massless Majorana field localized in a double cone. The conformal modular flow of the associated light-ray interval is converted into translations by a rapidity-like coordinate, and the one-particle scalar product is derived in modular momentum space. Particular attention is paid to the fact that this scalar product carries a Fermi-Dirac weight. Requiring the modular conjugation to be antiunitary with respect to that weighted scalar product fixes the Fourier-space realization of the modular objects. The resulting Tomita-Takesaki operator and its adjoint generate Alice and twisted-dual Bob directions for which all four crossed CAR orthogonality relations follow automatically from modular localization. The Bell problem then reduces to a simple one-function functional. For a Gaussian modular-momentum profile $h_\\sigma(k)=\\exp[-k^2/(2\\sigma^2)]$ the Bell parameter is larger than the classical bound for a broad range of widths and approaches the Tsirelson value analytically, \\[ \\lim_{\\sigma\\to 0^+}{\\it B}(\\sigma)=2\\sqrt2 \\] Thus near-maximal Bell violation is obtained from an explicit sequence of smooth rapidly decreasing profiles concentrated around zero modular momentum, corresponding to the modular spectral value $\\lambda=1$.", "url": "https://arxiv.org/abs/2608.23753", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "S.P. Sorella"}], "featured_authors": [{"name": "S.P. Sorella"}], "author_count": 1}, {"id": "2608.23770", "category": "hep-th", "title": "General Construction of Time-Dependent Integrable Chiral Field Theories", "abstract": "We develop a general procedure for constructing time-dependent integrable chiral field theories from autonomous unitary difference-form $S$-matrices satisfying the Yang-Baxter equation. Spectral parameters are transported along the free right- and left-moving characteristics, defining a map from physical spacetime to spectral space on which the two-body scattering data are evaluated. Requiring spatially homogeneous right-left scattering forces the characteristic map to be affine. The inverse Cayley transform then determines the local contact interaction, while evaluation along the affine spectral trajectory fixes its time dependence. Thus, the nonautonomous interaction is determined by the autonomous scattering data together with chiral kinematics and spatial homogeneity, rather than being introduced independently. The Yang--Baxter equation supplies the factorized many-body transport, and on a spatial circle periodicity leads to quantum Knizhnik--Zamolodchikov (qKZ) equations whose compatibility defines a flat discrete transport in spectral space. Pulling the corresponding spectral-space amplitudes back to physical coordinates gives the time-dependent many-body wavefunctions. Rational $SU(N)$, trigonometric $U_q(\\widehat{\\mathfrak{sl}}_2)$, and rational $O(N)$ scattering illustrate how the same mechanism generates distinct nonautonomous interactions. The resulting framework gives a geometric route from autonomous factorized scattering data to time-dependent integrable field theories.", "url": "https://arxiv.org/abs/2608.23770", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pradip Kattel"}], "featured_authors": [{"name": "Pradip Kattel"}], "author_count": 1}, {"id": "2608.23784", "category": "hep-th", "title": "A simple construction of Heat Kernels and conformal anomalies via Fedosov deformation quantization", "abstract": "We propose a new approach to the systematic computation of the heat-kernel expansion and, in particular, of conformal anomalies, based on Fedosov deformation quantization. The approach is fully covariant, applies to differential operators of arbitrary order, is amenable to efficient implementation, and yields closed-form expressions. As applications, we compute conformal anomalies in four, six, and eight dimensions, the last being a new result.", "url": "https://arxiv.org/abs/2608.23784", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Thomas Basile"}, {"name": "Evgeny Skvortsov"}], "featured_authors": [{"name": "Thomas Basile"}, {"name": "Evgeny Skvortsov"}], "author_count": 2}, {"id": "2608.23975", "category": "hep-th", "title": "Three-Reggeon exchange in $\\mathcal{N}=4$ SYM to leading logarithmic accuracy", "abstract": "We study eight-point amplitudes in the planar $\\mathcal{N}=4$ Super Yang-Mills theory in multi-Regge kinematics in the Mandelstam region that receives contributions from both two- and three-Reggeon exchange. We use an effective field theory approach to compute the leading contribution from three-Reggeon exchange, and we explicitly evaluate the relevant diagrams up to four loops. We also propose a compact Fourier-Mellin representation for the contribution from two-Reggeon exchange in this region which involves the same ingredients as in other Mandelstam regions and can in principle be evaluated to any desired order in perturbation theory. To validate our proposal, we show that we can reproduce the multi-Regge limit of the known results for octagons up to three loops. We then combine the contributions from two- and three-Reggeon exchange to obtain novel results for octagons in MRK up to next-to-leading-logarithmic accuracy at four loops for the maximally helicity violating (MHV) configuration, and up to three loops for non-MHV contributions. We also discuss how our result can be extended to more particles, and we present the contribution from three-Reggeon exchange for three-loop MHV amplitudes with an arbitrary number of legs.", "url": "https://arxiv.org/abs/2608.23975", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Claude Duhr"}, {"name": "Zhenjie Li"}, {"name": "Chi Zhang"}], "featured_authors": [{"name": "Claude Duhr"}, {"name": "Zhenjie Li"}, {"name": "Chi Zhang"}], "author_count": 3}, {"id": "2608.24054", "category": "hep-th", "title": "Note on arithmetic structure of modulus vacua in flux compactifications", "abstract": "We study modulus stabilization by background fluxes. The supersymmetric minima satisfy a holomorphic quadratic equation. As concrete examples, we consider $T^6/(\\mathbb{Z}_2\\times\\mathbb{Z}_2')$ orientifold model and a simple Calabi-Yau compactification. The modulus values show specific patterns. For example, they show the Farey sequence. The void structure appears around modulus vacua with high degeneracies. We find a correlation between the degeneracy and the void area. The modulus vacua are related by discrete Abelian symmetries generated by the Gauss composition law, which includes the CP symmetry. Spontaneous CP violation is also discussed.", "url": "https://arxiv.org/abs/2608.24054", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yukiya Furuta"}, {"name": "Tatsuo Kobayashi"}, {"name": "Tomoyasu Kori"}, {"name": "Shuhei Miyamoto"}, {"name": "Ryusei Nishida"}, {"name": "Hajime Otsuka"}], "featured_authors": [{"name": "Yukiya Furuta"}, {"name": "Tatsuo Kobayashi"}, {"name": "Tomoyasu Kori"}, {"name": "Shuhei Miyamoto"}, {"name": "Ryusei Nishida"}, {"name": "Hajime Otsuka"}], "author_count": 6}, {"id": "2608.24064", "category": "hep-th", "title": "The fate of chiral symmetry in two-flavor matrix adjoint QC$_2$D", "abstract": "In the matrix model of two-flavor adjoint QC$_2$D, we study the low-lying states and their properties in the intermediate-to-strong (Yang-Mills) coupling regime. The model has a classical $SU(2)_R$ chiral symmetry and the eigenstates of the Hamiltonian can be organized in its irreps. We construct the energy eigenstates in presence of a chiral chemical potential $c$ using the variational techniques. We find that when $c=0$, the ground state is always a $SU(2)_R$ singlet, irrespective of the coupling strength $g$. However, as $g$ is tuned from intermediate to strong coupling, the system under goes a crossover from a unique to a doubly degenerate ground state. The degeneracy in the strong coupling regime spontaneously breaks the axial $\\mathbb{Z}_8$, while preserving the chiral symmetry. When $c \\neq 0$, we find that there can be level crossings which correspond to quantum phase transitions (QPTs). Depending on the ground state, there are three possible phases. The $SU(2)_R$ symmetry is spontaneously broken in only one of these phases, and this phase can only emerge for intermediate $g$ with moderate values of $c$. In the $g-c$ plane this phase corresponds to a narrow window, outside which $SU(2)_R$ is always preserved.", "url": "https://arxiv.org/abs/2608.24064", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nirmalendu Acharyya"}, {"name": "Prasanjit Aich"}, {"name": "Sayan Bhakta"}, {"name": "Ranita Mudi"}, {"name": "Sachindeo Vaidya"}], "featured_authors": [{"name": "Nirmalendu Acharyya"}, {"name": "Prasanjit Aich"}, {"name": "Sayan Bhakta"}, {"name": "Ranita Mudi"}, {"name": "Sachindeo Vaidya"}], "author_count": 5}, {"id": "2608.24083", "category": "hep-th", "title": "Mellin space reflections, modularity of elliptic Gamma functions and beyond", "abstract": "We study modular transformation formulas from the viewpoint of Mellin space. The basic observation is that the functional relation between the Hurwitz zeta function and the polylogarithm can be used to organize modular transformations as reflection identities of Mellin kernels, while the accompanying polynomial anomalies arise from contour deformations. We first illustrate this mechanism for the $q$-$\\theta$ function and then extend it to the elliptic Gamma function. In the latter case, independently Mellin transforming the two elliptic directions leads to a trilinear reflection identity relating the three elliptic Gamma functions appearing in the SL$(3,\\mathbb{Z})$ modular formula, while the associated contour deformation reproduces the cubic Bernoulli polynomial. Further reflection formulas lead to a weighted $q$-Pochhammer type function with a modular transformation analogous to that of the $q$-$\\theta$ function, as well as a transposed trilinear reflection identity analogous to the Mellin space structure underlying the SL$(3,\\mathbb{Z})$ transformation. Our results suggest that Mellin space reflection identities provide a useful organizing principle for constructing and studying modular special functions beyond the standard multiple elliptic Gamma hierarchy.", "url": "https://arxiv.org/abs/2608.24083", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yang Lei"}, {"name": "Taotao Li"}], "featured_authors": [{"name": "Yang Lei"}, {"name": "Taotao Li"}], "author_count": 2}, {"id": "2608.24165", "category": "hep-th", "title": "Unification of Gravity with Internal Interactions: the SO(2,16) Scheme Revisited", "abstract": "The starting point of the present work is the observation that the tangent group of a curved manifold need not have the same dimension as the manifold itself. We use this fact to construct Conformal Gravity and its noncommutative (Fuzzy) counterpart as gauge theories, and then to unify both with internal gauge interactions. Specifically, we present a scheme in which conformal gravity, based on gauging the SO(2,4) group, and fuzzy gravity, based on gauging the SO(1,5)$\\times$U(1), are unified with SO(10) internal interactions through the parent group SO(2,16), and we work through the resulting spontaneous symmetry breakings and fermion content in detail. We also discuss the low-energy phenomenology of the scheme, including cosmic-string gravitational-wave signals, and close with a brief outlook: a candidate minimal unification group, a dark-matter candidate suggested by the construction, and the ghost problem common to higher-derivative gravity theories of this type.", "url": "https://arxiv.org/abs/2608.24165", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stelios Stefas"}, {"name": "George Zoupanos"}], "featured_authors": [{"name": "Stelios Stefas"}, {"name": "George Zoupanos"}], "author_count": 2}, {"id": "2608.24266", "category": "hep-th", "title": "Geometric tool kit for higher spin gravity (part III): An introduction to the general theory of connections on fibre bundles", "abstract": "These notes provides an introduction to a wide variety of notions of connection that appear in the contemporary mathematical literature. Besides the familiar Ehresmann connections on principal bundles and Koszul connections on vector bundles, there is a large zoo of perhaps less familiar notions, most notably Cartan connections on principal bundles and their avatars on tractor bundles, which may deserve more attention for further elucidating higher-spin interactions and symmetries. This review is motivated both by the previous (explicit or implicit) use of these notions of connection in higher-spin gravity and by their potential future applications in this context. Much of the material covered here is also relevant to advanced mathematical topics in gravity, such as the rigorous treatment of conformal geometry (which is of interest for holography) and may help fill gaps left by standard textbooks (most of which typically do not address Cartan connections, tractor calculus, and related topics).", "url": "https://arxiv.org/abs/2608.24266", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xavier Bekaert"}], "featured_authors": [{"name": "Xavier Bekaert"}], "author_count": 1}, {"id": "2608.24385", "category": "hep-th", "title": "New RG flows between non-Unitary CFTs from exact massless scattering theories", "abstract": "We construct complete solutions of the massless S-matrix bootstrap equations describing a new infinite family of integrable RG flows from the higher-fusion-level minimal models M(3,2n+3;n) to the non-unitary Virasoro minimal models M(2,2n+3), including a flow from M(3,5) to the Yang--Lee CFT M(2,5) when n=1. We provide strong evidence for this identification by matching conformal perturbation theory around the UV fixed points with the small-volume expansion of the corresponding thermodynamic Bethe ansatz equations. We further show that a family of non-invertible Verlinde defect lines is preserved along the flows.", "url": "https://arxiv.org/abs/2608.24385", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Changrim Ahn"}, {"name": "Zoltan Bajnok"}, {"name": "Soma Elek"}], "featured_authors": [{"name": "Changrim Ahn"}, {"name": "Zoltan Bajnok"}, {"name": "Soma Elek"}], "author_count": 3}, {"id": "2608.24431", "category": "hep-th", "title": "Real-time thermal photon-photon interactions in the mixed space", "abstract": "Using the effective Lagrangian for the low-energy/temperature of photon-photon interaction and the lowest-order photon self-energy is calculated in the Real Time Formalism (RTF) for an arbitrary path specified by the $\\sigma$-parameter within the new basis. The causal Green's functions (without chemical potential) for the scalar field are evaluated to derive the usual thermal propagators in the mixed space. It is shown that the symmetric propagator does not depend on $\\sigma-$ parameter. Furthermore, the photon self-energy is used to calculate some electromagnetic properties, such as dielectric tensor and velocity of light from photon self-energy in the mixed space that greatly simplifies calculations in RTF. Their time dependence is investigated, and a comparison between our results and those obtained by other models is discussed.", "url": "https://arxiv.org/abs/2608.24431", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "M. A. A. Ahmed"}, {"name": "H. Zainuddin"}, {"name": "N. M. Shah"}, {"name": "M. Ladrem"}], "featured_authors": [{"name": "M. A. A. Ahmed"}, {"name": "H. Zainuddin"}, {"name": "N. M. Shah"}, {"name": "M. Ladrem"}], "author_count": 4}, {"id": "2608.24446", "category": "hep-th", "title": "Dynamical Tidal Response and Love Numbers of Massless Bosonic and Fermionic Perturbations of Kerr--Anti-de Sitter Black Holes", "abstract": "We examine the tidal response of Kerr--Anti-de Sitter black holes using the Teukolsky formalism in a vacuum background. We consider massless perturbations with spin weights $s = 0,\\ \\pm\\frac{1}{2},\\ \\pm1,\\ \\pm\\frac{3}{2},\\ \\pm2$, corresponding to scalar, fermionic, electromagnetic, and gravitational perturbations, respectively. We determine the Tidal Love number using the near-horizon approximation. For asymptotically flat black holes in general relativity, the conservative tidal response vanishes identically. In contrast, we find that the presence of a negative cosmological constant parameter in the Kerr--Anti-de Sitter black holes leads to a non-trivial tidal response, containing both conservative and dissipative contributions. We systematically study the static and dynamical tidal responses of Kerr--Anti-de Sitter black holes. In particular, we examine the behaviour of the conservative and dissipative response coefficients and investigate their dependence on the black-hole rotation parameter and the AdS curvature scale.", "url": "https://arxiv.org/abs/2608.24446", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Himanshu Buragohain"}, {"name": "Prabwal Phukon"}], "featured_authors": [{"name": "Himanshu Buragohain"}, {"name": "Prabwal Phukon"}], "author_count": 2}, {"id": "2608.24448", "category": "hep-th", "title": "Real-time thermal self-energies: In the variational bases and spaces", "abstract": "In this work, we introduce a systematic study for studying the scalar propagator and tadpole self-energy by considering an arbitrary parameter $\\sigma$ that allows for a path integral description in real-time formalism (RTF). The closed time path formalism (CTP) and Thermofield Dynamics (TFD) are two popular choices for the parameter $\\sigma$ in the Feynman rules. We have constructed a scalar propagator and a tadpole self-energy in two different bases in the momentum space as well as the mixed space. The results show that the diagonal components of self-energy in both spaces for the 1/2 basis are the same in both approaches within RTF, whereas the other off-diagonal components of self-energy are different because they depend on the path parameter. On the other hand, the diagonal components of self-energy in both spaces for the new basis are not the same in both approaches within RTF, whereas the off-diagonal components of self-energy are vanishing. That means the new basis allows one to reduce the components for the quantities studied, like self-energy or other.", "url": "https://arxiv.org/abs/2608.24448", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "M. A. A. Ahmed"}, {"name": "H. Zainuddin"}, {"name": "N. M. Shah"}], "featured_authors": [{"name": "M. A. A. Ahmed"}, {"name": "H. Zainuddin"}, {"name": "N. M. Shah"}], "author_count": 3}, {"id": "2608.24706", "category": "hep-th", "title": "Hagedorn temperature from holography: rotating and charged systems", "abstract": "Using the string/field theory correspondence as a tool, we study the dependence of the Hagedorn temperature of strongly coupled, planar gauge theories on angular velocities and chemical potentials for $U(1)$ global currents. Our results are obtained from an interplay of world-sheet semiclassical quantization methods and target space low energy effective ones. The Hagedorn temperature is given as an expansion in the inverse (large) 't Hooft coupling limit. Working to quadratic order in the fluctuations, the world-sheet analysis provides the leading, the next-to-leading and part of the next-to-next-to leading order terms. In particular, it captures the NNLO $\\log 2$ terms which are due to the contributions of non-zero modes to the zero-point energy. These modes are not accounted for by the effective approach, within which they have to be included by hand using suitable educated guesses. On the other hand, the effective methods allow to compute in a relatively easy way the missing NNLO pieces (and even further subleading corrections), which could be accounted for from the world-sheet approach only working at quartic (or higher) order in the fluctuations. We present general results and several examples in various dimensions, including both confining models and conformal field theories on spheres (such as $\\mathcal N=4$ SYM and ABJM) dual to string theories on global $AdS$ spaces.", "url": "https://arxiv.org/abs/2608.24706", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Francesco Bigazzi"}, {"name": "Tommaso Canneti"}, {"name": "Federico Castellani"}, {"name": "Aldo L. Cotrone"}], "featured_authors": [{"name": "Francesco Bigazzi"}, {"name": "Tommaso Canneti"}, {"name": "Federico Castellani"}, {"name": "Aldo L. Cotrone"}], "author_count": 4}, {"id": "2608.23667", "category": "math-ph", "title": "A Comment on Local Hypercube Inequalities", "abstract": "This comment gives dimension-independent analytic proofs of the local inequalities arising in the odd- and even-dimensional constructions of higher-dimensional partition charge functions. The prior works established these inequalities by exhaustive computation in low dimensions and tested them numerically in selected higher dimensions.", "url": "https://arxiv.org/abs/2608.23667", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Keyou Zhuo"}, {"name": "Tian-Shun Chen"}, {"name": "Kilar Zhang"}], "featured_authors": [{"name": "Keyou Zhuo"}, {"name": "Tian-Shun Chen"}, {"name": "Kilar Zhang"}], "author_count": 3}, {"id": "2608.23884", "category": "math-ph", "title": "Hartree--Fock coercivity for twisted bilayer graphene", "abstract": "We study the minimisers of the Hartree--Fock functional for flat bands in the chiral model of twisted bilayer graphene introduced by Tarnopolsky, Kruchkov, and Vishwanath. Our model is a continuous version of the discrete model considered by Becker, Lin and Stubbs in previous works and the first result is a direct analogue of main theorems of those papers: at half filling of the flat band of multiplicity two, there are exactly two minimisers, obtained by occupying either one of the two sub-bands. (A more general version of this result, stressing its topological origins, was presented in Appendix A.8 of the Lecture Notes by Tao-Zworski.) The new contribution is the strict coercivity of the Hessian of the Hartree--Fock functional at the two minimisers. It is a consequence of the difference between the Chern numbers of the component bands and can be optimistically considered as a soft version of a ``spectral gap''.", "url": "https://arxiv.org/abs/2608.23884", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kevin D. Stubbs"}, {"name": "Maciej Zworski"}], "featured_authors": [{"name": "Kevin D. Stubbs"}, {"name": "Maciej Zworski"}], "author_count": 2}, {"id": "2608.23899", "category": "math-ph", "title": "On the Dirichlet-to-Neumann conformal invariant of bounded planar domains", "abstract": "Using an analogue of Mandelstam-Giddings-Wolpert diagrams, we introduce a new canonical representative of the conformal class of a bounded domain of arbitrary connectivity in $\\mathbb{C}$ as a flat conical surface with geodesic boundary (a \"truncated light-cone diagram\", simply LC-diagram in the sequel). The space of these diagrams can be provided with natural coordinates. We derive variational formulas for the determinant of the Dirichlet boundary problem on a LC-diagram with respect to these coordinates. Then passing to the Schottky double of the LC-diagram, making use of the Burghelea-Friedlander-Kappeler formula and the known variational formulas for determinants of Laplacians on the moduli space of holomorphic differentials lead to an explicit computation of the Dirichlet-to-Neumann (DN) conformal invariant $\\frac{{\\rm det}\\Lambda}{|\\Gamma|}$ (here $\\Lambda$ is the DN operator on the boundary, $\\Gamma$, of a multi-connected domain and $|\\Gamma|$ is the length of the boundary). The resulting formula (which uses the periods of the Schottky double of the domain only) presents a conspicuously elementary counterpart to the formulas of Guillarmou and Guillopé who had expressed the DN invariant through the Ruelle and Selberg zeta-functions. Our formula agrees with the recent result of Wentworth on the asymptotics of the DN invariant as all the boundary components except one shrink, we have used this result to fix the undetermined constant of integration in our formula.", "url": "https://arxiv.org/abs/2608.23899", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexey Kokotov"}, {"name": "Dmitrii Korikov"}, {"name": "Marina Nenasheva"}], "featured_authors": [{"name": "Alexey Kokotov"}, {"name": "Dmitrii Korikov"}, {"name": "Marina Nenasheva"}], "author_count": 3}, {"id": "2608.24100", "category": "math-ph", "title": "Non-equilibrium modelling of polyatomic gases: generic framework and 11-moment model", "abstract": "In this study, we present a thermodynamically consistent framework for modelling polyatomic gases by integrating the \\textit{general equation for non-equilibrium reversible-irreversible coupling} (GENERIC) with an 11-moment description. Our formulation unifies \\textit{rational irreversible thermodynamics} (RIT) and \\textit{extended irreversible thermodynamics} (EIT) into a single GENERIC-compatible structure that guarantees compliance with the second law of thermodynamics through the explicit construction of Poisson and friction matrices. By including translational and internal temperatures, as well as a temperature tensor, the model offers a well-structured and physically meaningful representation of non-equilibrium behavior in polyatomic gases. The entropy production is inherently non-negative, and all closure relations emerge naturally from thermodynamic principles. As a test of applicability, we compute the shock wave structure in nitrogen gas, validating the framework against Direct Simulation Monte Carlo (DSMC) simulations and experiments up to moderate Mach numbers.", "url": "https://arxiv.org/abs/2608.24100", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masrakain Ahmad"}, {"name": "Anil Kumar"}, {"name": "Anirudh Singh Rana"}], "featured_authors": [{"name": "Masrakain Ahmad"}, {"name": "Anil Kumar"}, {"name": "Anirudh Singh Rana"}], "author_count": 3}, {"id": "2608.24261", "category": "math-ph", "title": "Boundary Free Energies, Quenched Mixing, and Gibbs-State Selection in Disordered Ising Models", "abstract": "We study boundary free energies and half-space responses in nearest-neighbor disordered Ising models. First, we prove the existence of fixed-depth tangential pressure and identify its derivative almost everywhere with the limiting boundary response. Second, under quenched exponential boundary-response mixing, we prove Gibbs-state selection independence and exponential convergence of finite-depth pressures. We further show that uniform one-spin mixing yields DLR uniqueness and Gaussian normal localization, and verify the required mixing conditions whenever $(2d-1)\\mathbb E\\tanh(\\beta\\vert{}J\\vert{})<1$. Finally, we establish an all-face surface limit in the bounded Dobrushin regime and provide counterexamples that delimit general surface and stiffness claims.", "url": "https://arxiv.org/abs/2608.24261", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mauris Chueng"}, {"name": "Hexiang Wang"}, {"name": "Keheng Zhu"}], "featured_authors": [{"name": "Mauris Chueng"}, {"name": "Hexiang Wang"}, {"name": "Keheng Zhu"}], "author_count": 3}, {"id": "2608.24423", "category": "math-ph", "title": "Joint moments of characteristic polynomials in the circular Jacobi ensemble and Painlevé equations", "abstract": "In this paper, we establish a connection between joint moments of characteristic polynomials and their derivatives in the Circular Jacobi Ensemble, a generalisation of the Circular Unitary Ensemble, and solutions of nonlinear Painlevé equations. For finite $N$, we show that these joint moments are characterised by a solution of the $\\sigma$-Painlevé V equation for all real moment exponents in their admissible range. Under an appropriate large-$N$ scaling limit, we further prove that the limiting joint moments admit a representation in terms of a solution of the $\\sigma$-Painlevé III$'$ equation for a certain range of moment exponents. As applications, we answer a question posed by Assiotis et al. in [Math. Physics. Anal. Geom. 25 (2022), no.2, Paper No. 15, 24pp, Remark 1.7] by showing that the characteristic function of a distinguished random variable is connected with the $\\sigma$-Painlevé III$'$ equation for complex parameters. Furthermore, we investigate joint moments involving higher-order derivatives of characteristic polynomials in the Circular Jacobi Ensemble. As a consequence, we extend a result of Assiotis et al. in [Comm. Pure Appl. Math. 79 (2026), no. 7, 1771-1827, Theorem 1.11] concerning the joint moments of a sequence of random variables arising from the ergodic decomposition of Hua-Pickrell measures, from real parameters to complex parameters.", "url": "https://arxiv.org/abs/2608.24423", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Thomas Bothner"}, {"name": "Fei Wei"}], "featured_authors": [{"name": "Thomas Bothner"}, {"name": "Fei Wei"}], "author_count": 2}, {"id": "2608.24508", "category": "math-ph", "title": "Bound State Analysis of Rank-One Delta Interactions Supported by Deformed Hyperspheres", "abstract": "We study rank-one delta interactions supported by small normal deformations of an \\(n\\)-dimensional hypersphere \\(S_R^n\\subset\\mathbb{R}^{n+1}\\). The interaction is defined by the normalized surface measure on the support and therefore corresponds to the rotationally invariant sector of the hyperspherical shell problem. For the undeformed hypersphere, we derive the bound-state equation for \\(E=-\\nu^2\\) in terms of the modified Bessel product \\[ I_{\\frac{n-1}{2}}(\\nu R)K_{\\frac{n-1}{2}}(\\nu R). \\] We then consider an inward normal deformation \\[ X_\\varepsilon(\\omega)=(R-\\varepsilon h(\\omega))\\omega, \\qquad \\omega\\in S^n, \\qquad 0<\\varepsilon\\ll1. \\] Our main result is that, to first order in \\(\\varepsilon\\), the bound-state energy depends only on the average normal displacement \\[ \\langle h\\rangle = \\frac1{|S^n|}\\int_{S^n}h(\\omega)\\,d\\Omega_n(\\omega). \\] Equivalently, the deformed hypersphere is spectrally equivalent, up to \\(O(\\varepsilon^2)\\), to a round hypersphere with effective radius \\(R-\\varepsilon\\langle h\\rangle\\). In particular, mean-zero deformations do not change the rank-one bound-state energy at first order.", "url": "https://arxiv.org/abs/2608.24508", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hilal Demirdöğen"}, {"name": "Fatih Erman"}, {"name": "Merve Nur Sayar"}], "featured_authors": [{"name": "Hilal Demirdöğen"}, {"name": "Fatih Erman"}, {"name": "Merve Nur Sayar"}], "author_count": 3}, {"id": "2608.23669", "category": "quant-ph", "title": "Single-shot online sequence classification with unbounded quantum memory advantage", "abstract": "An agent monitors a complex environment, receiving one observation at each time step and eventually deciding how to label the resulting sequence. Does the sequence indicate an anomaly, and if so, of what type? Does it signal market instability, and to what degree? This is the setting of online multi-class classification: the input arrives sequentially, the full history is never available at once, and the agent must retain any past information relevant to the eventual decision. As the environment becomes more complex, the memory needed to track this information can grow rapidly without bound. Here, we introduce families of such multi-class classification games and show that any exact classical agent requires memory that grows without bound, whereas exact quantum agents can solve all tasks in the family with bounded memory. This separation is sharp: any classical agent using less than the required memory, under suitable input distributions, performs arbitrarily close to random guessing. Moreover, our quantum constructions are provably memory minimal, allowing us to derive the exact classical and quantum memory complexities to perform such tasks. In doing so, we establish an unbounded separation between classical and quantum memory cost for online multi-class classification.", "url": "https://arxiv.org/abs/2608.23669", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Keith K. Ng"}, {"name": "Haochen Jay Li"}, {"name": "Mile Gu"}, {"name": "Jayne Thompson"}], "featured_authors": [{"name": "Keith K. Ng"}, {"name": "Haochen Jay Li"}, {"name": "Mile Gu"}, {"name": "Jayne Thompson"}], "author_count": 4}, {"id": "2608.23698", "category": "quant-ph", "title": "Compositionality in quantum reference frame perspectives", "abstract": "Understanding a composite system through its constituents is a fundamental practice in physics. In the context of quantum reference frames (QRFs), however, combining the usual quantum-theoretic notion of composition with QRF perspectives gives rise to subtle issues, such as the 'paradox of the third particle'. Here we study in depth how to compose subsystems in QRF perspectives, building on a recent formalism for QRFs [E$.$Castro-Ruiz and O$.$Oreshkov, 2025]. We first show how the frames of external observers can be internalised and treated within the framework. This establishes a consistent hierarchy of QRF perspectives, which we use to define the adding and removing of subsystems. We then explain how, owing to the so-called 'extra-particle' degrees of freedom, the formalism gives a consistent treatment of subsystems, avoiding any paradoxes by construction. Consistency then implies that composing subsystems in a QRF perspective differs from, and generalises, the standard quantum-theoretic case. In particular, not every state can be appended in tensor-product form relative to a QRF, and we characterise the set of compatible states. Finally, we introduce 'classicalisation', a procedure that recovers a classical-like perspective from a general QRF. This procedure circumvents the aforementioned state restrictions but carries a different operational meaning, which we study through a concrete example.", "url": "https://arxiv.org/abs/2608.23698", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bruna Sahdo"}, {"name": "Esteban Castro-Ruiz"}], "featured_authors": [{"name": "Bruna Sahdo"}, {"name": "Esteban Castro-Ruiz"}], "author_count": 2}, {"id": "2608.23929", "category": "quant-ph", "title": "Quantum Algorithms and Hardness for Point-Count Approximation over Finite Fields", "abstract": "We study the approximation of the number of solutions of Laurent polynomials over finite fields. For a Laurent polynomial \\[f(x)=\\sum_{j=1}^{s}a_jx^{u_j}\\in \\mathbb{F}_q[x_1^{\\pm1},\\ldots,x_n^{\\pm1}], \\] let $U$ be its augmented support matrix whose columns are $(1,u_j)$ with rank $\\rho$ and $N(f) := \\# \\{x\\in (\\mathbb{F}_q^\\times)^n \\mid f(x)=0\\}$ be its torus point count. Our first main result is a quantum algorithm that outputs $\\widehat{N}(f)$ satisfying \\[ |\\widehat{N}(f) - N(f)| \\le \\varepsilon q^{n+s/2-\\rho} \\] with success probability $1-\\delta$. Provided that $\\rho$ and $\\|U\\|_\\infty$ are bounded, the algorithm runs in both classical bit and quantum gate complexity $\\mathrm{poly}(n, s, \\log q, 1/\\varepsilon, \\log(1/\\delta))$. It provides finer resolution than relative-error approximations in general settings. To the best of our knowledge, in the explicit finite-field input model considered here, no previous algorithm achieves this additive accuracy with running time polynomial in $\\log q$. Van Dam ( arXiv:quant-ph/0405081 ) conjectured the existence of such an algorithm under the assumption of an oracle reflecting the algebraic properties of the polynomial. In contrast, by exploiting a point-counting formula derived from character sums over finite fields, we develop an alternative approach that efficiently approximates the number of points without assuming the existence of such an oracle. As a second main result, we prove that the same approximation problem becomes $\\#$P-hard under randomized polynomial-time Turing reductions when the support matrix $U$ varies freely as part of the input. Thus, taken together, our results clarify how the effectiveness of the quantum approach depends on the tradeoff between the accuracy scale and the support parameters of the input polynomial.", "url": "https://arxiv.org/abs/2608.23929", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yota Maeda"}, {"name": "Hiroshi Yano"}], "featured_authors": [{"name": "Yota Maeda"}, {"name": "Hiroshi Yano"}], "author_count": 2}, {"id": "2608.23935", "category": "quant-ph", "title": "A Categorical Framework for Wave-Particle Complementarity: Continuous Observable Structures and Fourier-Pontryagin Duality", "abstract": "We present a formulation wave-particle complementarity and the de Broglie relation $\\lambda=h/p$ within the framework of categorical quantum mechanics on rigged Hilbert spaces. Position and momentum are represented by continuous dagger-Frobenius structures associated with the locally compact abelian group $\\mathbb{R}$ and its Pontryagin dual. The Fourier transform is the unitary implementation of Pontryagin duality and relates the two observable structures. We show that a general character pairing $\\chi_p^{(\\alpha)}(x)=\\exp(ipx/\\alpha)$ yields a one-parameter family of unitarily equivalent Fourier transforms. Pontryagin duality therefore determines the structural form of the complementarity, but not the numerical value of Planck's constant. The identification $\\alpha=\\hbar$ is a physical input fixed by the Weyl commutation relations. With this input, the spatial period of the character yields $\\lambda=h/p$.", "url": "https://arxiv.org/abs/2608.23935", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Samuel B. Soltau"}], "featured_authors": [{"name": "Samuel B. Soltau"}], "author_count": 1}, {"id": "2608.24000", "category": "quant-ph", "title": "Improved Quantum Codes with Transversal T Gates", "abstract": "In this work, we study quantum CSS codes with transversal $T$ gates. Here, $T$ gate transversality is meant in the strongest sense; the application of physical $T$ to every physical qubit yields logical $T$ on every logical qubit, without Clifford corrections. Despite the importance of the $T$ gate in fault-tolerant quantum computation, the parameters of asymptotic families of such codes have not been improved since the work of Hastings and Haah in 2017, and Haah in 2018. In this work, we significantly broaden the achievable parameters of quantum code families with transversal $T$ gates, both expanding the regime of achievable polynomial rate and distance, and constructing such codes with constant rate and growing distance; this is the first time the latter has been achieved, even when allowing Clifford corrections after the transversal $T$ gate. These are also the first codes achieving $\\gamma \\to 0$ for a code with a transversal $T$ gate, where $\\gamma$ is the overhead exponent of magic state distillation. To do this, we develop a framework of divisible decreasing monomial codes, punctured at a downward-closed set on the Boolean hypercube to create logical qubits. We prove a closed-form expression for the distance of such a code punctured at such a set, which may be of independent interest. We first instantiate this with an explicit construction based on weighted Reed-Muller codes, puncturing at low Hamming-weight points, and then with a randomised construction, where a small random set of points is protected from the puncturing to save quantum code distance, achieving improved parameters.", "url": "https://arxiv.org/abs/2608.24000", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Adam Wills"}], "featured_authors": [{"name": "Adam Wills"}], "author_count": 1}, {"id": "2608.24032", "category": "quant-ph", "title": "Time-Dependent Tunneling in the Thin-Barrier Limit", "abstract": "The usual WKB analysis for quantum tunneling applies when the tunneling action is large, as it is for tall, wide potential barriers. In contrast we analyze tunneling when the action is small, as it is for tunneling across a tall, thin barrier. We develop a perturbative analysis where the control parameter is the inverse of the area under the potential barrier and apply our technique to several examples in $1+1$ dimensions. In resonant situations for bound particles we find that the tunneling probability grows with time as $\\propto t^2$, while in non-resonant situations it grows linearly with time. We evaluate not only the tunneling probability but also the time-dependent tunneling wavefunction for a particle that escapes to infinity, {\\it i.e.} from a quasi-bound state to the continuum.", "url": "https://arxiv.org/abs/2608.24032", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tanmay Vachaspati"}, {"name": "Frank Wilczek"}, {"name": "Zara Yu"}], "featured_authors": [{"name": "Tanmay Vachaspati"}, {"name": "Frank Wilczek"}, {"name": "Zara Yu"}], "author_count": 3}, {"id": "2608.24061", "category": "quant-ph", "title": "Rank and Range Criteria for Mixed-State Determination from Local Marginals", "abstract": "Determining whether a mixed quantum state is uniquely determined among all states by its k-body marginals (k-UDA) is a fundamental problem in quantum system certification. We develop a range-based approach to this problem by analyzing the structure of the range of the global state. For three-qubit states, we show that states with GHZ-SLOCC-free ranges are 2-UDA at ranks one, three, and four. We derive a necessary and sufficient range criterion for rank-two 2-UDA states and reduce it to a finite quadratic-form test. To cover the remaining range configurations, we formulate an exact range-restricted semidefinite programming criterion and extend it to arbitrary finite-dimensional tripartite states. We also show that every three-qubit state of rank at least five is not 2-UDA, and further extend high-rank obstructions to multipartite systems. For a channel-based multipartite family, we characterize exactly when a state is $(n-1)$-UDA and show that lower-order marginals never suffice. Finally, we apply these results to the certification of genuine multipartite entanglement.", "url": "https://arxiv.org/abs/2608.24061", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xinyu Qiu"}, {"name": "Minglong Qin"}, {"name": "Caohan Cheng"}, {"name": "Lin Chen"}, {"name": "Delin Chu"}], "featured_authors": [{"name": "Xinyu Qiu"}, {"name": "Minglong Qin"}, {"name": "Caohan Cheng"}, {"name": "Lin Chen"}, {"name": "Delin Chu"}], "author_count": 5}, {"id": "2608.24084", "category": "quant-ph", "title": "Lifting connectivity bottlenecks in superconducting quantum processors via enriched native two-qubit gates", "abstract": "Limited qubit connectivity is a central architectural constraint in superconducting quantum processors, whose planar layouts require additional gates to mediate interactions between distant qubits. Here, we use the AshN control scheme, where rich two-qubit control on every nearest-neighbour pair allows a logical interaction and the required qubit routing to be merged into a single native operation, effectively transforming a sparse hardware graph into a more connected computational architecture. For the benchmark instances studied, the resulting synthesis capability enables reliable execution on constrained one- and two-dimensional lattices, with compiled two-qubit gate counts approaching those of an all-to-all-connected reference. Across seven benchmark circuits on one- and two-dimensional topologies, the AshN-based implementation achieves geometric-mean reductions of $45.2\\%$ and $43.7\\%$ in two-qubit gate count compared with controlled-Z-based compilation, respectively. Using AshN gates, we prepare an eight-qubit two-excitation Dicke state with a fidelity of $0.736$ and certify its genuine multipartite entanglement using a fully positive-partial-transpose witness, whereas the same witness does not certify entanglement for the CZ-based implementation. The state fidelity and entanglement certification remain robust across the tested lattice configurations, including those with up to three connectivity defects. Our work establishes native-gate engineering as a practical approach to mitigating connectivity constraints.", "url": "https://arxiv.org/abs/2608.24084", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hanyi Wang"}, {"name": "Jingzhe Guo"}, {"name": "Lijun Sun"}, {"name": "Zhaohui Yang"}, {"name": "Weizhi Tao"}, {"name": "Xingye Yuan"}, {"name": "Qiankun Wang"}, {"name": "Bihao Guo"}, {"name": "Chunwang Liu"}, {"name": "Rui Yang"}, {"name": "Yang Li"}, {"name": "Yu Fan"}, {"name": "Jiasheng Hu"}, {"name": "Junhe Wang"}, {"name": "Shuyue Zheng"}, {"name": "Shengbin Wang"}, {"name": "Xinfang Zhang"}, {"name": "Feng Wu"}, {"name": "Hantao Sun"}, {"name": "Jianxin Chen"}], "featured_authors": [{"name": "Hanyi Wang"}, {"name": "Jingzhe Guo"}, {"name": "Lijun Sun"}, {"name": "Feng Wu"}, {"name": "Hantao Sun"}, {"name": "Jianxin Chen"}], "author_count": 20}, {"id": "2608.24152", "category": "quant-ph", "title": "A Dynamic-Kernel/QPacket Executable for Quantum Repeater Chains in Q2NS/ns-3", "abstract": "The Quantum Internet operates on entanglement, a non-local, non-copyable, stateful network resource, which motivates protocol organization beyond classical layering. We present a first executable specialization of the Dynamic Kernel/QPacket logic from the beyond-layering protocol suite, targeting entanglement distribution over a linear quantum repeater chain. The implementation builds on Q2NS, an ns-3-based quantum-network simulation module available through the ns-3 App Store. It realizes QPacket meta-headers with service intent and append-only action-commit stamps processed by node-local Dynamic Kernels organized as a Planner--Executor--Engine pipeline, while being deliberately scoped to an analytically verifiable service and policy. Within this scoped setting, we study node heterogeneity through a link-preparation policy that accounts for pre-distributed entanglement and uneven entanglement-generation support across nodes, including delegation via QPacket forwarding. Simulations verify analytical link-resolvability models and expose signaling load, forwarding behavior, and QPacket meta-header growth. Results show that QPacket overhead is shaped by more than just encoding, including policy choices and available network resources. Overall, this study demonstrates how the Q2NS/ns-3 substrate can support reproducible, policy-specific evaluation of quantum-native protocol-suite concepts.", "url": "https://arxiv.org/abs/2608.24152", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Adam Pearson"}, {"name": "Marcello Caleffi"}, {"name": "Angela Sara Cacciapuoti"}], "featured_authors": [{"name": "Adam Pearson"}, {"name": "Marcello Caleffi"}, {"name": "Angela Sara Cacciapuoti"}], "author_count": 3}, {"id": "2608.24299", "category": "quant-ph", "title": "Distributed Resource Theory of Entanglement and Magic", "abstract": "In distributed fault-tolerant quantum computing, entanglement and magic are essential resources for quantum communication and universal fault-tolerant computation, respectively. Although they are usually treated as distinct resource currencies, whether they admit a unified resource-theoretic description remains an open question. Here, we introduce the distributed resource theory of entanglement and magic (DREAM). In this framework, the free states are convex mixtures of product local stabilizer states, and the free operations are local stabilizer circuits assisted by classical communication (LSCC). We show that DREAM contains nontrivial resource states that are neither entanglement nor magic, so it is strictly richer than treating the two resources independently. Surprisingly, such resources can enable the teleportation of magic states between distant parties without consuming entanglement, revealing a counterintuitive form of resource teleportation mediated entirely by separable states. We further generalize this result to quantum networks and investigate general quantum-state teleportation under LSCC. We show that the shared resource under DREAM is closely related to the teleportation capability, quantified by the magic of the teleported state. Our work establish a systematic framework for studying distributed quantum resources and uncover intrinsic relations among distinct resources within a unified resource theory.", "url": "https://arxiv.org/abs/2608.24299", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xiao Yuan"}, {"name": "Wenhao Zhang"}, {"name": "Qiming Ding"}, {"name": "You Zhou"}], "featured_authors": [{"name": "Xiao Yuan"}, {"name": "Wenhao Zhang"}, {"name": "Qiming Ding"}, {"name": "You Zhou"}], "author_count": 4}, {"id": "2608.24345", "category": "quant-ph", "title": "Essentially optimal gate teleportation", "abstract": "Gate teleportation allows us to implement a nonlocal unitary using local operations, classical communication (LOCC), and a shared entangled state. Known deterministic teleportation protocols consume at least one full ebit and achieve optimal entanglement consumption only for Clifford gates. Here, we present a deterministic LOCC protocol for implementing the two-qubit controlled-phase gate $U_{\\phi}=\\mathrm{diag}(1,1,1,e^{i \\phi})$ with $\\phi \\in [0,\\pi]$ whose entanglement consumption is close to optimal for every $\\phi$. In particular, vanishing rotation angles require vanishing entanglement.", "url": "https://arxiv.org/abs/2608.24345", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Lukas Schmitt"}, {"name": "David Sutter"}], "featured_authors": [{"name": "Lukas Schmitt"}, {"name": "David Sutter"}], "author_count": 2}, {"id": "2608.24370", "category": "quant-ph", "title": "ABSTRACTS: Amsterdam Benchmark Suite for the Time and Resource Analysis of Clifford+T Simulators", "abstract": "Recent years have seen a rapid growth in literature presenting new methods for simulating non-Clifford quantum circuits with classical hardware. These methods span a range of approaches, including stabiliser decomposition and tensor contraction techniques, varying in efficiency depending on circuit class, depth, non-Clifford gate count, and other metrics. A notable limitation of this literature is the lack of a standardised approach to benchmarking, with each new paper outlining its own specification, simulating its own set of circuits on the authors' own hardware. This paper seeks to address this issue by presenting a standardised and canonical benchmark suite and infrastructure for quantifying the efficiency of non-Clifford classical simulators, with a consistent dataset of circuits and providing consistent (virtual) hardware, thereby enabling a fair comparison of results.", "url": "https://arxiv.org/abs/2608.24370", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthew Sutcliffe"}, {"name": "John van de Wetering"}], "featured_authors": [{"name": "Matthew Sutcliffe"}, {"name": "John van de Wetering"}], "author_count": 2}, {"id": "2608.24484", "category": "quant-ph", "title": "Optimal copy complexity of quantum state cloning", "abstract": "Quantum state cloning is the task of approximately producing additional copies of an unknown quantum state from a finite number of input copies. The optimal cloning fidelity is known exactly for pure states, but no comparable characterization is known for general mixed states. We determine the optimal asymptotic copy complexity for $d$-dimensional states of rank at most $r$: producing $M$ additional copies with worst-case fidelity at least $1-\\varepsilon$ requires and is achievable with $N=\\Theta(Mrd/\\varepsilon)$ input copies. Remarkably, the lower bound already holds for a family of states with a fixed flat spectrum, while the matching upper bound is achieved by random purification followed by optimal pure-state cloning. For $M=1$, we further show that high-fidelity tomography can be coherently converted into cloning with comparable error, revealing an operational origin of the matching cloning and tomography complexities.", "url": "https://arxiv.org/abs/2608.24484", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sangwoo Jeon"}, {"name": "Vaughn Sohn"}, {"name": "Changhun Oh"}], "featured_authors": [{"name": "Sangwoo Jeon"}, {"name": "Vaughn Sohn"}, {"name": "Changhun Oh"}], "author_count": 3}, {"id": "2608.24493", "category": "quant-ph", "title": "Optimal Lower Bound for Ground-State Energy Estimation with a Guiding State", "abstract": "The guided Hamiltonian problem is the following: given access to the unitary $U=e^{i H}$ for some Hamiltonian $H$, and given access to a unitary that prepares a guiding state promised to have overlap at least $\\gamma >0$ with the ground space of $H$, estimate the ground-state energy of $H$ within additive error $\\delta > 0$ and success probability at least $1-\\varepsilon $, $\\varepsilon>0$. How many applications of $U$ and its inverse $U^{-1}$ are necessary and sufficient? An upper bound $O(\\log(1/\\varepsilon)\\log(1/\\gamma)/\\gamma\\delta)$ was known, and was improved to $O(\\log(1/\\varepsilon)/\\gamma\\delta)$ very recently [JW26]. A matching lower bound was known whenever one of the three parameters $\\delta,\\gamma,\\varepsilon$ was held constant [MdW26]. In this paper we prove the joint lower bound $\\Omega(\\log(1/\\varepsilon)/\\gamma\\delta)$ with the tight $\\varepsilon$-dependence provided the dimension of $H$ is at least $\\log(1/\\varepsilon)/\\gamma^2$. Furthermore, we show that this same lower bound (with slightly larger dimension) holds for both the special case in which the ground state is guaranteed to be unique and $H$ has a gap of $\\delta$ between its first and second eigenvalue; and for ground-state preparation, where $\\delta$ denotes the spectral gap and $\\varepsilon$ now is the approximation error. The lower bounds also apply when the Hamiltonian can be accessed via its block-encoding, and when fractional powers of $U$ are allowed, as in continuous-time Hamiltonian simulation. Lastly, improved upper bounds are known when $H$ is nonnegative and presented as a sum of squares; and our results imply the lower bound $\\Omega(\\log(1/\\varepsilon)/\\gamma\\sqrt{\\delta})$ for this case.", "url": "https://arxiv.org/abs/2608.24493", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rolando D. Somma"}, {"name": "Ronald de Wolf"}], "featured_authors": [{"name": "Rolando D. Somma"}, {"name": "Ronald de Wolf"}], "author_count": 2}, {"id": "2608.24494", "category": "quant-ph", "title": "Optimal Quantum Algorithm for Ground-State Energy Estimation with a Guiding State", "abstract": "In the problem of ground-state energy estimation, one aims to estimate the smallest eigenvalue of a Hamiltonian, often given a guiding state, with some promised overlap $\\gamma$ with the ground space. The main approach to this problem is to simulate its evolution, and estimate the smallest (or equivalently, largest) eigenphase of the resulting unitary $U$. We give a quantum algorithm that estimates the largest eigenphase of a unitary $U$ in this guided setting using a factor of $\\log\\frac{1}{\\gamma}$ fewer queries to $U$ than the previous best approach. The result matches an existing lower bound, and answers an open question from Mande and de Wolf. The algorithm is based on transducers, which often allow composition of quantum algorithms without overhead from error reduction.", "url": "https://arxiv.org/abs/2608.24494", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Stacey Jeffery"}, {"name": "Freek Witteveen"}], "featured_authors": [{"name": "Stacey Jeffery"}, {"name": "Freek Witteveen"}], "author_count": 2}, {"id": "2608.24527", "category": "quant-ph", "title": "Provable Quantum--Classical Separation for Continuous Gibbs Sampling", "abstract": "We prove the first quantum--classical separation for a sampling problem over a continuous domain. For a class of Gibbs states $p\\propto e^{-\\beta E}$ on the torus $\\mathbb{T}^d$ with smooth ($s$-Gevrey) potential and barrier amplitude $\\alpha=e^{\\beta\\Delta}$, where $\\Delta = \\max E-\\min E$, every classical algorithm---querying the value, gradient, or any higher-order derivatives of the log-density---requires $\\Omega(\\alpha)$ queries to sample at constant accuracy in total variation distance, while a quantum algorithm based on quantum singular value thresholding and temperature annealing samples with $\\tilde{O}\\left(\\sqrt{\\alpha}\\right)$ queries to an oracle for the gradient. The advantage is quadratic in the barrier amplitude, which becomes exponential in the dimension, $e^{\\Omega(d)}$, at low temperature. The classical bound is information-theoretic, holding for every classical algorithm with query access to the Gibbs potential and its derivatives at any order.", "url": "https://arxiv.org/abs/2608.24527", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Enrico Olivucci"}, {"name": "Mariia Sobchuk"}, {"name": "Sehmimul Hoque"}, {"name": "Jeffrey Hnybida"}, {"name": "Kyungho W. Kim"}, {"name": "Ala Shayeghi"}, {"name": "Pooya Ronagh"}], "featured_authors": [{"name": "Enrico Olivucci"}, {"name": "Mariia Sobchuk"}, {"name": "Sehmimul Hoque"}, {"name": "Kyungho W. Kim"}, {"name": "Ala Shayeghi"}, {"name": "Pooya Ronagh"}], "author_count": 7}, {"id": "2608.24711", "category": "quant-ph", "title": "Towards Optimal Quantum Estimators for State Frame Potential", "abstract": "The state frame potential is a standard diagnostic of how closely a quantum state ensemble approximates Haar randomness. In this work, we study the problem of estimating the state frame potential of order $t$ to within additive error $\\varepsilon$ under three progressively weaker access models: (i) query access to a multi-state-preparation oracle, (ii) general sample access, and (iii) single-copy sample access. In the query model, we establish a near-optimal query complexity of $\\widetilde{\\Theta}(\\sqrt{t}/\\varepsilon)$, yielding a quadratic improvement in the dependence on $t$ over the previous best result of Nakata, Takeuchi, Kliesch, and Darmawan (PRX Quantum 2025). In the general sample model, we establish the optimal sample complexity $\\Theta(t/\\varepsilon^2)$. In the single-copy sample model, we present a store-and-estimate approach whose sample complexity depends on the Rényi entropy of the ensemble weights. As an application, we use the single-copy algorithm to assess the randomness of projected state ensembles, where the entropy term becomes the observational Rényi entropy associated with measuring one subsystem.", "url": "https://arxiv.org/abs/2608.24711", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jinge Bao"}, {"name": "Wang Fang"}, {"name": "Yoshifumi Nakata"}, {"name": "Qisheng Wang"}], "featured_authors": [{"name": "Jinge Bao"}, {"name": "Wang Fang"}, {"name": "Yoshifumi Nakata"}, {"name": "Qisheng Wang"}], "author_count": 4}, {"id": "2608.24770", "category": "quant-ph", "title": "Geometry-controlled correlated electric-field noise in enclosed ion traps from billiard return spectra", "abstract": "We ask how passive conducting geometry determines the spatial structure of electric-field noise seen by trapped ions. From a boundary-potential covariance and the Dirichlet Green function we construct the $N$-ion electric-field cross-spectral matrix and its blockwise motional Kossakowski generator. In a parallel slab, billiard unfolding turns the electrostatic response into a return-depth measure and yields an exact return-pair functional for arbitrary stationary surface spectra. For every finite equal-height ion array, the passive cover increases the normal-field covariance matrix in the positive-semidefinite ordering and decreases the tangential-field covariance matrix in the same ordering: all collective normal-field coordinates acquire more absolute noise, while all collective tangential coordinates acquire less. At $h=2d$ the local-noise single-ion ratios are exactly $\\zeta(3)$ and $\\eta(3)$. Diagonalizing the equal-frequency covariance identifies collective environmental noise eigenchannels and a geometry-dependent noise rank; within a degenerate frequency block these become the Lindblad jump channels. In a ten-ion example, closing the cover to $h=2d$ lowers the participation rank from 5.61 to 5.11 while increasing the leading channel's share from 23.7% to 28.6%; a primitive Mølmer-Sørensen calculation shows how the projected covariance sets the weak-heating gate exposure. Beyond parallel walls, specular paths emerge as large-$q_z$ saddles of the screened boundary operator. Across 16 curved covers, the fitted electrostatic decay exponent correlates at 0.9991 with the independently computed shortest specular excess length, while separate tests resolve focusing and competing saddles.", "url": "https://arxiv.org/abs/2608.24770", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ayush Nadiger"}], "f     const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {

        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>

          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;

      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });

  </script>
