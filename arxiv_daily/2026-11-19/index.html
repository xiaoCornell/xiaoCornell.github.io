trace produces a term with the index structure of a vector potential in every dimensionality; it enters with an imaginary factor i and is precisely the term that keeps the operator Hermitian when the Fermi velocity depends on position. The totally antisymmetric contraction produces an object that depends on the number of indices available to the Levi-Civita symbol: a trace on a line, a pseudoscalar mass on a surface, and an axial vector potential in a volume. Neither contraction is invariant under local rotations of the frame, and we give the transformation laws. On a surface, the curl of the trace term can always be removed by a frame rotation, while its divergence is proportional to the Gaussian curvature. We apply the correspondence to a Gaussian bump, where the local density of states at the center falls below its flat value and obeys a closed form at low energy; to a wire, where a nonuniform lapse binds states inside the gap and a nonuniform velocity cannot; to stationary frames on a surface, where a circulating drag shifts the Dirac mass locally with either sign; and to twisted and rotating frames in a volume, where the axial term takes the form of a chiral chemical potential produced by the frame alone, or separates Weyl nodes in a rotating sample. We separate the geometric contribution from the lattice pseudogauge field that dominates the response of strained samples", "url": "https://arxiv.org/abs/2611.24878", "type": "理论", "summary": "弯曲背景上的狄拉克方程可以重写为平坦空间方程，其中几何形状表现为张量费米速度和一组背景场。我们从单个克利福德代数恒等式中推导出这种对应关系，并通过一维、二维和三维空间来追踪它。一旦自旋连接被写成里奇旋转系数，就只能发生两次收缩。该迹产生一个项，该项具有每个维度的矢量势的索引结构；它以虚数因子 i 进入，并且正是当费米速度取决于位置时保持算子埃尔米特式的项。完全反对称收缩产生的对象取决于列维-奇维塔符号可用的索引数量：线上的迹线、表面上的赝标量质量以及体积中的轴向矢量势。在框架的局部旋转下，这两种收缩都不是不变的，我们给出了变换定律。在表面上，迹项的旋度总是可以通过坐标系旋转来消除，而其散度与高斯曲率成正比。\n\n我们将对应关系应用于高斯凹凸，其中中心的局部态密度低于其平坦值并遵循低能量的封闭形式；到一根电线，其中不均匀的失效会束缚间隙内的状态，而不均匀的速度则不能；到表面上的固定框架，其中循环阻力以任一符号局部移动狄拉克质量；以及体积中扭曲和旋转的框架，其中轴向项采用框架单独产生的手性化学势的形式，或分隔旋转样本中的韦尔节点。我们将几何贡献与主导应变样本响应的晶格赝规范场分开", "authors": [{"name": "David Valenzuela"}, {"name": "Alfredo Raya"}], "featured_authors": [{"name": "David Valenzuela"}, {"name": "Alfredo Raya"}], "author_count": 2}, {"id": "2611.24898", "category": "cond-mat", "title": "When Time-Reversible Sensor Records Require Hidden Dissipation", "abstract": "A binary sensor record can be time reversible yet require dissipation in every compatible finite-state Markov model. For a four-state sensor with correlated dwell times, two observed switching statistics give an exact equilibrium criterion and, when equilibrium is excluded, a positive lower bound on entropy production independent of hidden-state number. An explicit four-state construction provides an upper bound on the minimum dissipation. For a noisy Poisson sensor, the bounds differ by less than a factor of two and vanish at a kinetic matching point while the sensor remains dissipative.", "url": "https://arxiv.org/abs/2611.24898", "type": "理论", "summary": "二进制传感器记录可以是时间可逆的，但在每个兼容的有限状态马尔可夫模型中都需要耗散。对于具有相关停留时间的四状态传感器，两个观察到的切换统计数据给出了精确的平衡标准，并且当排除平衡时，熵产生的正下限与隐藏状态数无关。明确的四态结构提供了最小耗散的上限。对于嘈杂的泊松传感器，界限相差不到两倍，并且在动力学匹配点处消失，而传感器仍然是耗散的。", "authors": [{"name": "Andrey V. Dobrynin"}, {"name": "Anastasia Stroujkova"}], "featured_authors": [{"name": "Andrey V. Dobrynin"}, {"name": "Anastasia Stroujkova"}], "author_count": 2}, {"id": "2611.24935", "category": "cond-mat", "title": "Exact Parent Hamiltonians for Partially Magnetized Chiral Spin Liquids", "abstract": "Chiral spin liquids (CSLs) are paradigmatic fractionalized phases, yet simple exact parent Hamiltonians for them remain scarce. In this work, we construct exact spin parent Hamiltonians for partially magnetized CSLs realizing various bosonic topological orders. Our construction relies on an exact Hubbard-type parent Hamiltonian for bosonic lattice fractional quantum Hall (FQH) states, valid at arbitrary repulsive interaction strengths. Taking the on-site repulsion to infinity and applying local boson-spin mappings yields exact parent Hamiltonians for the CSLs. Our two-spin construction generalizes the Kalmeyer-Laughlin spin Hamiltonian to a broader class of bosonic FQH model states, including Abelian states and non-Abelian parton states. We derive controlled microscopic realizations of these two-spin Hamiltonians via second-order superexchange in generalized spinful Hofstadter-Hubbard models with tailored hoppings and interactions. With more general local constraints and interactions, boson-spin mappings yield exact higher-spin and multispin parent Hamiltonians for partially magnetized CSLs.", "url": "https://arxiv.org/abs/2611.24935", "type": "理论", "summary": "手性自旋液体（CSL）是典型的分馏相，但它们的简单精确母哈密顿量仍然很少。在这项工作中，我们为部分磁化的 CSL 构造了精确的自旋母哈密顿量，实现了各种玻色子拓扑序。我们的构造依赖于玻色晶格分数量子霍尔（FQH）态的精确哈伯德型父哈伯德量，在任意排斥相互作用强度下有效。将现场斥力设为无穷大并应用局部玻色子自旋映射可产生 CSL 的精确父哈密顿量。我们的双自旋构造将 Kalmeyer-Laughlin 自旋哈密顿量推广到更广泛的玻色 FQH 模型状态，包括阿贝尔状态和非阿贝尔部分子状态。我们通过具有定制跳跃和相互作用的广义自旋 Hofstadter-Hubbard 模型中的二阶超交换，推导出这些双自旋哈密顿量的受控微观实现。通过更一般的局部约束和相互作用，玻色子自旋映射为部分磁化的 CSL 产生精确的高自旋和多自旋父哈密顿量。", "authors": [{"name": "Xin Shen"}, {"name": "Guangyue Ji"}, {"name": "Jie Wang"}], "featured_authors": [{"name": "Xin Shen"}, {"name": "Guangyue Ji"}, {"name": "Jie Wang"}], "author_count": 3}, {"id": "2611.23237", "category": "hep-th", "title": "Commuting integrals of motion for free bosonic CFTs revisited: certified densities, spectral rigidity, and an exact identification at the c=1 branch point", "abstract": "We revisit the commuting local integrals of motion for free bosonic CFTs constructed in hep-th/0404195 as input data for integrable boundary states, using exact-arithmetic operator-product engines. A bootstrap lemma reduces its overdetermined bilinear commutativity systems to a distinguished odd charge D plus linear kernel problems -- conditionally on even-spin vacancy, a machine-verified but finite-range input. For the Z_2 x Z_2 \"paperclip\" family we publish the spin-7 density P_8, prove [I_3,I_5]=[I_3,I_7]=[I_5,I_7]=0 identically in n, and verify the Lukyanov-Vitchev-Zamolodchikov four-screening characterization at spins 7 and 9 at sampled n. For the A_2^(2) family we give an exact Coulomb-gas dictionary to the dual Phi_{1,2}/Phi_{2,1} perturbations (that identification itself being classical, Zamolodchikov; Smirnov), whence the infinite hierarchy at all spins 6n+-1 follows by the Feigin-Frenkel affine-Toda theorem; our contribution is the certified dictionary, not a new all-spin construction. At c=1 the tower's defining charges are exactly quantum KdV at c_{1,4}=-25/2 -- the all-odd sector of the Freeman-Hornfeck-West family: the hierarchy embeds at every odd spin, equality verified through spin 15, all-spin multiplicity one open. We exclude or disfavor the named non-KdV candidates at the tested loci and identify the self-dual degeneracy as L(1,0). Through spin 11, the generic centralizer of I_3 is, for all three Z_2 x O(N) \"cylindrical\" families, one-dimensional at odd and zero at even spins, with Q(t)-symbolic charges at spins 7, 9, 11 and an explained fiber jump at N=-2. We certify the published 2004 low-spin formulas and record five corrections (one presumed). All-spin statements are made only where proved, finite-range otherwise. We close with a corank-character conjecture linking the rank deficiencies of the bilinear systems to characters of screening kernels.", "url": "https://arxiv.org/abs/2611.23237", "type": "理论", "summary": "我们使用精确算术算子乘积引擎，重新审视了在 hep-th/0404195 中构建的自由玻色子 CFT 的通勤局部运动积分，作为可积边界态的输入数据。自举引理将其超定双线性交换系统简化为显着的奇数电荷 D 加上线性内核问题——条件是偶自旋空位，即机器验证但范围有限的输入。对于 Z_2 x Z_2“回形针”族，我们发布了自旋 7 密度 P_8，证明 [I_3,I_5]=[I_3,I_7]=[I_5,I_7]=0 在 n 中相同，并验证采样 n 处自旋 7 和 9 处的 Lukyanov-Vitchev-Zamolodchikov 四筛选表征。对于 A_2^(2) 系列，我们为对偶 Phi_{1,2}/Phi_{2,1} 扰动提供精确的库仑气体字典（该识别本身是经典的，Zamolodchikov；Smirnov），因此所有自旋 6n+-1 处的无限层次结构遵循 Feigin-Frenkel 仿射-Toda 定理；我们的贡献是经过认证的词典，而不是新的全旋转结构。\n\n在 c=1 处，塔的定义电荷恰好是 c_{1,4}=-25/2 处的量子 KdV——Freeman-Hornfeck-West 系列的全奇扇区：层次结构嵌入在每个奇数自旋中，通过自旋 15 验证相等性，全自旋重数为一开。我们排除或不喜欢测试位点上指定的非 KdV 候选者，并将自对偶简并性识别为 L(1,0)。通过自旋 11，对于所有三个 Z_2 x O(N)“圆柱”族，I_3 的通用中心化器在奇数自旋处为一维，在偶数自旋处为零，在自旋 7、9、11 处具有 Q(t) 符号电荷，并在 N=-2 处解释光纤跳跃。我们验证了 2004 年发布的低自旋公式，并记录了五次更正（推测之一）。仅在经过验证的情况下才进行全自旋陈述，否则是有限范围的。我们以将双线性系统的秩缺陷与筛选核的特征联系起来的科兰克特征猜想作为结束。", "authors": [{"name": "Evgueniy Vitchev"}], "featured_authors": [{"name": "Evgueniy Vitchev"}], "author_count": 1}, {"id": "2611.23366", "category": "hep-th", "title": "Exact Solutions to Matrix Models and String Theories: The Global Construction", "abstract": "Exact nonperturbative solutions to matrix models and string theories are obtained in closed-form via a discrete-Fourier/Zak-transform representation of their partition-function resurgent-transseries. Examples include all hermitian one-matrix models (paired with their topological string duals) alongside all their multicritical and minimal-string double-scaling limits. The resulting structure is resonant, necessarily including both eigenvalues (D-branes) and anti-eigenvalues (negative-tension-branes). In a complementary preceding paper these solutions were extensively verified at the local level. In order to study them globally across their phase diagrams, complete non-linear Stokes data (and corresponding connection formulae) are still needed -- all of which are obtained herein. This involves a careful study of (anti-) eigenvalue tunneling across the complete multi-sheeted structure of their associated spectral-curves, and how the result descends from multi-cut smooth-curves to single-cut singular-curves -- all of which are extensively checked via large-order analysis and matrix-integral computations. Making use of the resulting exact Stokes automorphisms, nonperturbative solutions can be fully tested, from weak-to-strong 't Hooft coupling, as well as from large-to-small N, and for any complex-values of all parameters, by correctly implementing Stokes-transitions at the crossing of all possible Stokes-lines. Several analytical and numerical tests are carried through in diverse examples covering from matrix models through non-critical strings, which produce very sharp numerical matches fully validating our exact analytical expressions. Anti-eigenvalues or negative-tension D-branes are an absolutely essential part of the story in order to find such precise agreements.", "url": "https://arxiv.org/abs/2611.23366", "type": "理论", "summary": "矩阵模型和弦理论的精确非微扰解可以通过其配分函数复兴变换序列的离散傅里叶/扎克变换表示以封闭形式获得。示例包括所有埃尔米特单矩阵模型（与其拓扑弦对偶配对）以及所有多临界和最小弦双尺度限制。由此产生的结构是共振的，必然包括特征值（D-膜）和反特征值（负张力膜）。在之前的补充论文中，这些解决方案在地方层面得到了广泛验证。为了通过相图对它们进行全局研究，仍然需要完整的非线性斯托克斯数据（以及相应的连接公式）——所有这些数据都在本文中获得。这涉及到仔细研究跨其相关光谱曲线的完整多片结构的（反）特征值隧道效应，以及结果如何从多切割平滑曲线下降到单切割奇异曲线——所有这些都通过大阶分析和矩阵积分计算进行广泛检查。\n\n利用所得到的精确斯托克斯自同构，通过在所有可能的斯托克斯线的交叉处正确实现斯托克斯变换，可以对非微扰解进行全面测试，从弱到强的 t Hooft 耦合，以及从大到小的 N，以及所有参数的任何复数值。在从矩阵模型到非关键字符串的不同示例中进行了一些分析和数值测试，这些测试产生了非常清晰的数值匹配，完全验证了我们精确的分析表达式。为了找到如此精确的一致性，反特征值或负张力 D 膜是故事中绝对重要的部分。", "authors": [{"name": "Jasper Kager"}, {"name": "João Rodrigues"}, {"name": "Ricardo Schiappa"}, {"name": "Maximilian Schwick"}, {"name": "Noam Tamarin"}], "featured_authors": [{"name": "Jasper Kager"}, {"name": "João Rodrigues"}, {"name": "Ricardo Schiappa"}, {"name": "Maximilian Schwick"}, {"name": "Noam Tamarin"}], "author_count": 5}, {"id": "2611.23369", "category": "hep-th", "title": "Localizing the M-Theory Path Integral: Membrane Instantons", "abstract": "We propose a formula for M2-instanton contributions to the M-theory path integral, incorporating quantum corrections to all orders in the Planck length. The M2-brane action is determined by relative equivariant localization, while an equivariant Dolbeault character computes the one-loop determinant. Continuous families of M2-branes are treated by equivariant localization on their moduli spaces. For M-theory backgrounds dual to ABJM theory, we compute single instanton contributions from linear holomorphic fillings to the sphere partition function and the topologically twisted index associated with supersymmetric $AdS_4$ black holes. Our results reproduce known field theory instanton coefficients and give new analytic predictions for mass and squashing deformations at all Chern-Simons levels. For the $V^{5,2}$ theory, we compute new instanton contributions and establish an exact relation between its partition function at special squashing and that of ABJM theory on the round three-sphere.", "url": "https://arxiv.org/abs/2611.23369", "type": "理论", "summary": "我们提出了一个 M2 瞬时对 M 理论路径积分贡献的公式，其中结合了对普朗克长度中所有阶次的量子校正。 M2 膜作用由相对等变定位确定，而等变 Dolbeault 特征计算单循环行列式。 M2 膜的连续族通过其模空间上的等变定位来处理。对于与 ABJM 理论对偶的 M 理论背景，我们计算线性全纯填充对球体配分函数的单瞬子贡献以及与超对称 $AdS_4$ 黑洞相关的拓扑扭曲指数。我们的结果再现了已知的场论瞬子系数，并对所有 Chern-Simons 能级的质量和挤压变形给出了新的分析预测。对于$V^{5,2}$理论，我们计算了新的瞬子贡献，并在特殊挤压时的配分函数与圆形三球体上的ABJM理论的配分函数之间建立了精确的关系。", "authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Jerome P. Gauntlett"}, {"name": "Jaeha Park"}, {"name": "James Sparks"}], "featured_authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Jerome P. Gauntlett"}, {"name": "Jaeha Park"}, {"name": "James Sparks"}], "author_count": 4}, {"id": "2611.23370", "category": "hep-th", "title": "A Positive Metric on Four-Dimensional QFTs", "abstract": "A natural metric on the space of four-dimensional quantum field theories was introduced by Jack and Osborn in classic work on the local renormalization group. In perturbation theory, the Jack-Osborn metric determines the flow of the $a$-anomaly, and positivity implies the $a$-theorem. We derive a non-perturbative generalization of the Jack-Osborn metric and show that it is non-negative by the averaged null energy condition (ANEC). Consequently, the ANEC implies the strong $a$-theorem, and provides the monotonic function along the flow. The method is based on spectral analysis of the three-point function $\\langle \\mathcal{O}_I \\mathcal{E} \\mathcal{O}_J\\rangle$, where the $\\mathcal{O}_I$ are relevant operators and $\\mathcal{E}$ is the averaged null energy. This three-point function is decomposed under the spectrum of null rotations that fix the light ray, leading to a positivity condition at each impact parameter.", "url": "https://arxiv.org/abs/2611.23370", "type": "理论", "summary": "杰克和奥斯本在局部重正化群的经典著作中引入了四维量子场论空间的自然度量。在微扰理论中，杰克-奥斯本度量决定了$a$异常的流动，正性意味着$a$定理。我们推导出杰克-奥斯本度量的非微扰概括，并通过平均零能量条件 (ANEC) 证明它是非负的。因此，ANEC 隐含了强 $a$ 定理，并提供了沿流的单调函数。该方法基于三点函数 $\\langle \\mathcal{O}_I \\mathcal{E} \\mathcal{O}_J\\rangle$ 的谱分析，其中 $\\mathcal{O}_I$ 是相关算子，$\\mathcal{E}$ 是平均零能量。该三点函数在固定光线的零旋转光谱下进行分解，从而在每个影响参数处产生正条件。", "authors": [{"name": "Thomas Hartman"}, {"name": "Grégoire Mathys"}, {"name": "Andreas Stergiou"}], "featured_authors": [{"name": "Thomas Hartman"}, {"name": "Grégoire Mathys"}, {"name": "Andreas Stergiou"}], "author_count": 3}, {"id": "2611.23376", "category": "hep-th", "title": "Horizon kinematics and the fine structure induced by finite-energy Hawking radiation", "abstract": "Hawking radiation can modify the horizon structure of a black hole through the loss of mass and global charges. Investigating this process through quantum tunneling, we develop a systematic strategy to reconstruct horizon displacements under finite-energy emission, even when their radii are not explicitly known. Inversion of the horizon condition allows to follow roots's displacements along sequences of static geometries. As a concrete realization, we consider a nonlinearly charged extension of the Bañados--Teitelboim--Zanelli (BTZ) family, whose horizon structure offers an ideal setup to explore this process. Of particular interest is an initial configuration with a double inner horizon coexisting with a simple event horizon. We show that neutral emission necessarily splits the inner root into two simple ones, revealing a horizon fine structure. For charged emission, the dependence of extracted charge on emitted energy determines the separation law and allows that preservation or later restore the degeneracy. We construct such channels connecting the same initial and final states through distinct internal histories sharing the same leading semiclassical factor. As emission continues, the larger of the newly separated inner horizons can coalesce with the event horizon, driving the sequence towards extremality with a vanishing temperature but finite tunneling probability. We find that zero temperature cannot be attained in finite boundary time while uniform adiabaticity bounds hold. We also establish a regime where the geometric expansion and the canonical thermal approximation remain controlled near this endpoint. Finally, applying this analysis to the sector reproducing a quantum-backreacted BTZ geometry reveals how the leading semiclassical corrections raise the temperature and enhance the neutral-probe horizon emission factor relative to classical BTZ.", "url": "https://arxiv.org/abs/2611.23376", "type": "理论", "summary": "霍金辐射可以通过质量和全局电荷的损失来改变黑洞的视界结构。通过量子隧道效应研究这一过程，我们开发了一种系统策略来重建有限能量发射下的地平线位移，即使它们的半径未知。地平线条件的反演允许沿着静态几何序列跟踪根的位移。作为具体实现，我们考虑 Bañados-Teitelboim-Zanelli (BTZ) 系列的非线性带电扩展，其视界结构为探索这一过程提供了理想的设置。特别令人感兴趣的是具有双内视界与简单事件视界共存的初始配置。我们表明，中性发射必然将内根分成两个简单的根，揭示了水平精细结构。对于带电发射，提取的电荷对发射能量的依赖性决定了分离定律，并允许保存或稍后恢复简并性。我们通过共享相同的主导半经典因素的不同内部历史来构建连接相同初始状态和最终状态的通道。\n\n随着发射的继续，新分离的内部视界中较大的一个可以与事件视界合并，将序列推向极端，温度消失但隧道概率有限。我们发现，在均匀绝热界限成立的情况下，在有限边界时间内无法达到零温度。我们还建立了一种制度，其中几何膨胀和规范热近似在该端点附近保持受控。最后，将此分析应用于再现量子反反应 BTZ 几何形状的扇区，揭示了领先的半经典校正如何相对于经典 BTZ 提高温度并增强中性探针视界发射因子。", "authors": [{"name": "M. A. Aguirre Cortés"}, {"name": "Moisés Bravo-Gaete"}, {"name": "Julio A. Méndez-Zavaleta"}, {"name": "Efraín Rojas Marcial"}], "featured_authors": [{"name": "M. A. Aguirre Cortés"}, {"name": "Moisés Bravo-Gaete"}, {"name": "Julio A. Méndez-Zavaleta"}, {"name": "Efraín Rojas Marcial"}], "author_count": 4}, {"id": "2611.23377", "category": "hep-th", "title": "The Holomorphic-Topological Poisson Sigma Model and Quantization of Affine W-algebras", "abstract": "We construct explicit deformation quantizations of classical principal affine $W$-algebras for every simple Lie algebra $\\mathfrak g$ using the holomorphic-topological Poisson sigma model of A. Khan and K. Zeng. A linear differential-graded presentation identifies the universal bulk with Chern--Simons theory near a principal nilpotent background, where holomorphic gauge gives a finite, 1-loop exact quantization. The quantum oper boundary observables form the principal affine $W$-algebra at level $k-h^\\vee\\hbar$; we also obtain this level shift directly for affine current algebras. For $\\mathfrak{sl}_2$, we prove a perturbative quantum equivalence between Chern--Simons theory and three-dimensional chiral gravity, including their oper and Dirichlet boundary conditions, and determine the quantum relation between their parameters.", "url": "https://arxiv.org/abs/2611.23377", "type": "理论", "summary": "我们使用 A. Khan 和 K. Zeng 的全纯拓扑泊松西格玛模型为每个简单李代数 $\\mathfrak g$ 构造经典主仿射 $W$ 代数的显式变形量化。线性微分分级表示用陈-西蒙斯理论在主幂零背景附近识别了通用体积，其中全纯规范给出了有限的、1 环精确量化。量子操作边界可观测量在 $k-h^\\vee\\hbar$ 层形成主仿射 $W$-代数；我们还可以直接获得仿射流代数的能级移动。对于$\\mathfrak{sl}_2$，我们证明了陈-西蒙斯理论和三维手性引力之间的微扰量子等价，包括它们的操作边界条件和狄利克雷边界条件，并确定了它们参数之间的量子关系。", "authors": [{"name": "Niklas Garner"}, {"name": "Brian R. Williams"}, {"name": "Paul-Hermann Balduf"}], "featured_authors": [{"name": "Niklas Garner"}, {"name": "Brian R. Williams"}, {"name": "Paul-Hermann Balduf"}], "author_count": 3}, {"id": "2611.23379", "category": "hep-th", "title": "Melvin-type Electromagnetized Kerr Black Hole in Kaluza-Klein and Einstein-Maxwell-dilaton-axion Theories", "abstract": "A naive application of solution-generating techniques to construct Melvin-type rotating black holes in the Kaluza-Klein (KK) theory in the presence of both electric and magnetic external fields generically introduces an undesirable Taub-swirling twist term. We investigate its origin and modify the electromagnetization procedure, thereby constructing an exact solution of the Melvin-type electromagnetized Kerr black hole in the KK theory without the swirling term. We also obtain the analogous solution in the Einstein-Maxwell-dilaton-axion (EMDA) theory. The modified solution-generating techniques allow one to introduce both the dyonic charges and external electromagnetic fields independently into Ricci-flat seed metrics in both theories, without generating either Taub-NUT or Taub-swirling twists.", "url": "https://arxiv.org/abs/2611.23379", "type": "理论", "summary": "在存在电场和磁场的情况下，在卡鲁扎-克莱因 (KK) 理论中简单地应用解生成技术来构造梅尔文型旋转黑洞，通常会引入不受欢迎的陶布旋转扭曲项。我们研究了它的起源并修改了电磁化过程，从而在KK理论中构造了梅尔文型电磁化克尔黑洞的精确解，而无需旋转项。我们还在爱因斯坦-麦克斯韦膨胀轴子（EMDA）理论中得到了类似的解。改进的解决方案生成技术允许人们将双子电荷和外部电磁场独立地引入到两种理论中的 Ricci 平坦种子度量中，而不会产生 Taub-NUT 或 Taub-swirling 扭曲。", "authors": [{"name": "Liang Ma"}, {"name": "Zhi-Chao Li"}, {"name": "H. Lu"}], "featured_authors": [{"name": "Liang Ma"}, {"name": "Zhi-Chao Li"}, {"name": "H. Lu"}], "author_count": 3}, {"id": "2611.23381", "category": "hep-th", "title": "Non-Perturbative Moduli Stabilization with Sp$(4,\\mathbb Z)$ Modular Symmetry", "abstract": "We study the stabilization of the three complex moduli associated with Sp$(4,\\mathbb Z)$ modular symmetry by gaugino condensation in $\\mathcal N=1$ supergravity models from heterotic string theory, where one-loop threshold corrections fix both the modular weight and the singularity structure of the superpotential. We determine, for each threshold class, the complete parametrization of the consistent superpotential relying on Sp$(4,\\mathbb Z)$ basic modular-invariant ratios and their syzygies, generalizing the insufficient SL$(2,\\mathbb Z)$-inspired techniques based solely on polynomials of its absolute invariants. This structure supports a rich landscape of supersymmetric Minkowski vacua. Unlike in the SL$(2,\\mathbb Z)$ case, higher-order zeros produce continuous surfaces and curves of supersymmetric Minkowski vacua, while, among the six isolated fixed points, only those with $S_4$ and $D_{12}$ residual symmetries can stabilize all three moduli. We also construct isolated vacua away from fixed points, some of which lie at the moduli values preferred by genus-two modular flavor fits, and examine the suppression of the geometric moduli masses near an enhanced-symmetry point.", "url": "https://arxiv.org/abs/2611.23381", "type": "理论", "summary": "我们研究了异质弦理论 $\\mathcal N=1$ 超引力模型中通过高吉诺凝聚与 Sp$(4,\\mathbb Z)$ 模对称性相关的三个复模的稳定性，其中单环阈值修正固定了模权重和超势的奇点结构。对于每个阈值类别，我们依赖于 Sp$(4,\\mathbb Z)$ 基本模不变比及其 syzygies 确定一致超势的完整参数化，概括了仅基于其绝对不变量多项式的不充分的 SL$(2,\\mathbb Z)$ 启发技术。这种结构支持丰富的超对称闵可夫斯基真空景观。与 SL$(2,\\mathbb Z)$ 情况不同，高阶零点产生超对称 Minkowski 真空的连续曲面和曲线，而在六个孤立的不动点中，只有那些具有 $S_4$ 和 $D_{12}$ 残差对称性的点才能稳定所有三个模。我们还构造远离固定点的孤立真空，其中一些点位于属二模风味拟合首选的模值处，并检查增强对称点附近几何模量质量的抑制。", "authors": [{"name": "Miguel Hernandez-Segura"}, {"name": "Xiang-Gan Liu"}, {"name": "Hans Peter Nilles"}, {"name": "Saul Ramos-Sanchez"}], "featured_authors": [{"name": "Miguel Hernandez-Segura"}, {"name": "Xiang-Gan Liu"}, {"name": "Hans Peter Nilles"}, {"name": "Saul Ramos-Sanchez"}], "author_count": 4}, {"id": "2611.23392", "category": "hep-th", "title": "Scalar/axion Wormholes and Boundary Conditions in Gravitational Path Integrals", "abstract": "Recent work noted that whether or not a given class of spacetime wormholes contributes to the gravitational path integral can depend strongly on the choice of boundary conditions. In particular, for asymptotically-AdS scalar/axion wormholes with spherical boundaries it was suggested that there are regimes where the same wormhole contributes to a Euclidean low-energy effective field theory computation of the partition function $Z_N$ defined by imposing Neumann boundary conditions on the scalar/axion field, while it fails to contribute to a corresponding partition function $Z_D$ defined by imposing Dirichlet boundary conditions on this field. Here we investigate toy models of related wormholes associated with JT gravity coupled to a scalar field, asymptotically-AdS gravity coupled to an axion/scalar with toroidal boundary conditions, and asymptotically flat gravity coupled to an axion/scalar. In all cases we compare $Z_D$ and $Z_N$ as computed in a truncated low-energy effective theory by an appropriate integral over constrained wormholes. In each case we find that, even though $Z_D$ and $Z_N$ are related by an integral transform, the two generally receive contributions from differing sets of saddles. Along the way, we uncover a variety of additional interesting subtleties associated with semiclassical contributions to our $Z_D$ and $Z_N$.", "url": "https://arxiv.org/abs/2611.23392", "type": "理论", "summary": "最近的工作指出，给定类别的时空虫洞是否对引力路径积分有贡献，很大程度上取决于边界条件的选择。特别是，对于具有球形边界的渐近 AdS 标量/轴子虫洞，有人提出，在某些情况下，同一虫洞有助于通过在标量/轴子场上施加诺伊曼边界条件来定义的分配函数 $Z_N$ 的欧几里德低能有效场理论计算，但它无法对通过在该场上施加狄利克雷边界条件来定义的相应分配函数 $Z_D$ 做出贡献。在这里，我们研究与耦合到标量场的 JT 重力、耦合到具有环形边界条件的轴子/标量的渐近 AdS 重力以及耦合到轴子/标量的渐近平坦重力相关的相关虫洞玩具模型。在所有情况下，我们都比较 $Z_D$ 和 $Z_N$ 在截断低能有效理论中通过约束虫洞上的适当积分计算得出的结果。\n\n在每种情况下，我们发现，即使 $Z_D$ 和 $Z_N$ 通过积分变换相关，但这两者通常会收到来自不同鞍座组的贡献。在此过程中，我们发现了与 $Z_D$ 和 $Z_N$ 的半古典贡献相关的各种其他有趣的微妙之处。", "authors": [{"name": "Jason Hallsten"}, {"name": "Jesse Held"}, {"name": "Zhenyu Heng"}, {"name": "Donald Marolf"}, {"name": "Zhencheng Wang"}], "featured_authors": [{"name": "Jason Hallsten"}, {"name": "Jesse Held"}, {"name": "Zhenyu Heng"}, {"name": "Donald Marolf"}, {"name": "Zhencheng Wang"}], "author_count": 5}, {"id": "2611.23396", "category": "hep-th", "title": "ER=EPR and IMP wormholes in quantum gravity", "abstract": "We analyze and refine the ER=EPR conjecture by studying IMP (Isenberg, Mazzeo and Pollack \\cite{Isenberg:2001qe}) wormholes in QFT and quantum gravity, in the AdS/CFT context. IMP wormholes are solutions to the Einstein equations constructed from another general solution of Einstein's equations by gluing a handle on a Cauchy slice with a constant mean curvature, so that the initial data on the slice does not change in the regions away from the handle. This is made possible by using what is called the conformal method. This same method also enables one to recover a well defined perturbation theory in quantum gravity, and particularly for asymptotically AdS spacetimes \\cite{Witten:2022xxp}. Thus we construct the perturbation theory on these backgrounds in addition to exploring ER=EPR when $G_{N}=0$, in the limit it is perturbatively small and beyond perturbation theory.", "url": "https://arxiv.org/abs/2611.23396", "type": "理论", "summary": "我们通过在 AdS/CFT 背景下研究 QFT 和量子引力中的 IMP（Isenberg、Mazzeo 和 Pollack \\cite{Isenberg:2001qe}）虫洞来分析和完善 ER=EPR 猜想。 IMP 虫洞是爱因斯坦方程的解，通过将手柄粘合在具有恒定平均曲率的柯西切片上，从爱因斯坦方程的另一个通解构造而成，以便切片上的初始数据在远离手柄的区域中不会发生变化。这是通过使用所谓的保形方法来实现的。同样的方法还使人们能够恢复量子引力中明确定义的微扰理论，特别是对于渐近 AdS 时空 \\cite{Witten:2022xxp}。因此，我们在这些背景下构建了微扰理论，除了探索$G_{N}=0$时的ER=EPR，在极限情况下它是微扰的，超出了微扰理论。", "authors": [{"name": "Eyoab Bahiru"}], "featured_authors": [{"name": "Eyoab Bahiru"}], "author_count": 1}, {"id": "2611.23453", "category": "hep-th", "title": "Folded out-of-time-order correlators in double-scaled SYK", "abstract": "Harlow and Zhao arXiv:2607.14215 have identified ``anti-scrambling'' as a characteristic signature of cosmological horizons in de Sitter space, and proposed that it can be realized in a quantum system with bounded energy by Euclidean time ``folding\" of out-of-time-order correlators (OTOCs). We implement this prescription in the DSSYK model. We use arXiv:2303.03474 to define an infinite-temperature ($\\beta=0$) DSSYK OTOC that in the semiclassical limit of small values of the double-scaling parameter $\\lambda$ reproduces the usual AdS eikonal shockwave behavior with its characteristic time delay, and then apply the Harlow-Zhao fold with the ``fake'' DSSYK inverse temperature $\\beta_f$ playing the role of $\\beta$. We demonstrate both numerically and analytically that the resulting folded OTOC displays anti-scrambling. The exact DSSYK evaluation tracks the semiclassical de Sitter eikonal formula in the scrambling regime, including a time advance instead of a time this http URL direction of the fold selects the side from which the continued eikonal amplitude approaches its branch cut. We show how our results are consistent with recent ``no-go\" constraints. We compare the folded correlator with the two-shell analysis of arXiv:2607.14215 : the growing term of the two-shell dilaton invariant appears in DSSYK with the same exponent, but as an imaginary part, while its real part, which would signal the backreaction that ends in a crunch, only moves by $O(\\lambda)$ for thermal-scale probes. We also generalize to finite $\\beta$; we find reasonable agreement with the de Sitter eikonal form for sufficiently high temperatures, but at lower temperatures the folded correlator is dominated by a pair of complex conjugate saddles, an anti-Stokes crossover that prevents retrieval of the eikonal behavior from the folded OTOC.", "url": "https://arxiv.org/abs/2611.23453", "type": "理论", "summary": "Harlow和Zhao arXiv:2607.14215已经将“反扰乱”识别为德西特空间中宇宙视界的特征签名，并提出它可以通过乱序相关器（OTOC）的欧几里德时间“折叠”在具有有限能量的量子系统中实现。我们在DSSYK模型中实现了这个规定。我们使用arXiv:2303.03474 定义无限温度 ($\\beta=0$) DSSYK OTOC，在双尺度参数 $\\lambda$ 的小值的半经典极限下，通过其特征时间延迟再现通常的 AdS eikonal 冲击波行为，然后应用 Harlow-Zhao 折叠和“假”DSSYK 逆温度 $\\beta_f$ 扮演 $\\beta$ 的角色。并分析得出，最终的折叠 OTOC 显示出反扰乱。精确的 DSSYK 评估跟踪扰乱机制中的半经典 de Sitter 征象公式，包括时间提前而不是时间。该折叠的 http URL 方向选择连续征象幅度接近其分支切割的一侧。我们展示了我们的结果如何与最近的“不可行”约束一致。\n\n我们将折叠相关器与 arXiv:2607.14215 的双壳分析进行比较：双壳膨胀不变量的增长项出现在 DSSYK 中，具有相同的指数，但作为虚部，而其实部（表示以紧缩结束的反反应）对于热尺度探针仅移动 $O(\\lambda)$。我们还推广到有限的$\\beta$；我们发现在足够高的温度下与德西特征公形式有合理的一致性，但在较低温度下，折叠相关器由一对复杂的共轭鞍支配，这是一种反斯托克斯交叉，阻止从折叠的 OTOC 中检索征公行为。", "authors": [{"name": "Joseph D. Lykken"}, {"name": "Madeline Mooney"}, {"name": "Maria Spiropulu"}], "featured_authors": [{"name": "Joseph D. Lykken"}, {"name": "Madeline Mooney"}, {"name": "Maria Spiropulu"}], "author_count": 3}, {"id": "2611.24160", "category": "hep-th", "title": "Holomorphic Feynman diagrams in four dimensions and the quantum BPS ring", "abstract": "We compute, at all loop orders, the kernels of the holomorphic Feynman graphs that carry the loop corrections to supersymmetry transformations and to regularized products of local operators in the holomorphic twist of four-dimensional $\\mathcal N=1$ supersymmetric gauge theories. The current equations of these holomorphic graph integrals are those of an electrical network. Schwinger parameters are resistances and holomorphic momenta are injected currents. Iterating series, parallel and star--triangle reductions on Schwinger space gives the fan, spider and cubic product-forest kernels at all loop orders. Assuming that twisting commutes with quantization for these composite operators, we identify the twisted differential with their loop-corrected supersymmetry transformation. We give every perturbative correction to the supersymmetry transformation in $\\mathcal N=4$ Yang--Mills theory, including its action on operators with arbitrary holomorphic derivatives. Using the marked higher operations of Gaiotto, Kulp and Wu, we also construct and compute the quantum product of operators and prove that, on $\\mathbf Q$-cohomology, it is associative, graded commutative and unital, supplying the multiplication of the quantum BPS ring. Every multi-graviton operator thus has an explicit finite completion to a cocycle of the full quantum supercharge. Our computer census finds new fortuitous classes and one-loop lifts in $\\mathcal N=4$ Yang--Mills theory with several gauge groups. We have found no two-loop lift in the sectors tested. We also find two-loop lifts in the Leigh--Strassler and $\\beta$-deformations of $\\mathcal N=4$ Yang--Mills theory. In other theories, we find two-, three- and four-loop lifts in abelian gauge theories, and two- and three-loop lifts in $\\mathcal N=2$ $SU(2)$ and $SU(3)$ gauge theories and their singlet deformations.", "url": "https://arxiv.org/abs/2611.24160", "type": "理论", "summary": "我们在所有循环阶数下计算全纯费曼图的核，该核对超对称变换和四维 $\\mathcal N=1$ 超对称规范理论的全纯扭曲中的局部算子的正则化乘积进行循环修正。这些全纯图积分的当前方程是电网的方程。施温格参数是电阻，全纯动量是注入电流。施温格空间上的迭代级数、并联和星三角约简给出了所有循环阶数的扇形、蜘蛛形和立方积森林核。假设这些复合算子的扭曲与量化相通，我们用它们的循环校正超对称变换来识别扭曲微分。我们对 $\\mathcal N=4$ Yang--Mills 理论中的超对称变换进行每一个微扰修正，包括它对具有任意全纯导数的算子的作用。\n\n利用 Gaiotto、Kulp 和 Wu 的显着高级运算，我们还构造并计算了算子的量子乘积，并证明在 $\\mathbf Q$-上同调上，它是结合律、分级交换律和单位律，提供了量子 BPS 环的乘法。因此，每个多引力子算子对于全量子增压的余循环都有显式的有限完成。我们的计算机普查在具有多个规范组的 $\\mathcal N=4$ Yang--Mills 理论中发现了新的偶然类和单环提升。我们在测试的区域中没有发现二环升力。我们还在 Leigh--Strassler 和 $\\mathcal N=4$ Yang--Mills 理论的 $\\beta$ 变形中发现了双环升力。在其他理论中，我们在阿贝尔规范理论中发现了二环、三环和四环升力，在 $\\mathcal N=2$ $SU(2)$ 和 $SU(3)$ 规范理论及其单重态变形中发现了二环和三环升力。", "authors": [{"name": "Botao Li"}, {"name": "Kangning Liu"}, {"name": "Chi-Ming Chang"}], "featured_authors": [{"name": "Botao Li"}, {"name": "Kangning Liu"}, {"name": "Chi-Ming Chang"}], "author_count": 3}, {"id": "2611.24250", "category": "hep-th", "title": "Grade Restriction Rule For D-Brane Transport In Non-Abelian Gauged Linear Sigma Models", "abstract": "We study the low energy behaviour of B-type D-branes in non-Abelian gauged linear sigma models. The main problem is to determine the grade restriction rule for D-brane transport from one phase to another along paths. We analyze the convergence condition of the integral for the hemisphere partition function. We perform a thorough analysis in a particular model with two phases, one weakly coupled and one strongly coupled, both corresponding to Calabi-Yau threefolds. General methods are developed in this study and are applied to other models successfully. The integrals for a set of special Chan-Paton representations exhibit critical behaviour around each singular point on the phase boundary. From each of these points emanate ``no entry zones'' where a convergent contour is lost or is forced to traverse Gamma function poles. Knowledge of the special representations and no entry zones is strong enough to uniquely determine the grade restriction rule. In the course of this study, we encounter a problem in Weyl invariance of convergent contours, which forces us to modify the grade restriction criterion. The special representations play an important rôle in the monodromy around the singular point. We also obtain exact results on boundary conditions in supersymmetric QCDs and apply them to understand the low energy behaviour of D-branes in the strong coupling phase.", "url": "https://arxiv.org/abs/2611.24250", "type": "理论", "summary": "我们研究了非阿贝尔规范线性西格玛模型中 B 型 D 膜的低能行为。主要问题是确定 D 膜沿路径从一个相传输到另一相的等级限制规则。我们分析了半球配分函数积分的收敛条件。我们在一个具有两个阶段的特定模型中进行了彻底的分析，一个阶段是弱耦合阶段，一个是强耦合阶段，两者都对应于 Calabi-Yau 三重。本研究开发了通用方法，并成功应用于其他模型。一组特殊 Chan-Paton 表示的积分在相边界上的每个奇异点周围表现出临界行为。从这些点中的每一个都发出“禁止进入区域”，其中会聚轮廓丢失或被迫穿过伽玛函数极点。对特殊表示和禁止进入区域的了解足以唯一地确定等级限制规则。在本研究过程中，我们遇到了收敛轮廓的Weyl不变性问题，这迫使我们修改等级限制准则。\n\n特殊表征在围绕奇点的单一性中发挥着重要作用。我们还获得了超对称 QCD 边界条件的精确结果，并将其应用于理解 D 膜在强耦合相中的低能行为。", "authors": [{"name": "Richard Eager"}, {"name": "Kentaro Hori"}, {"name": "Johanna Knapp"}, {"name": "Mauricio Romo"}], "featured_authors": [{"name": "Richard Eager"}, {"name": "Kentaro Hori"}, {"name": "Johanna Knapp"}, {"name": "Mauricio Romo"}], "author_count": 4}, {"id": "2611.24320", "category": "hep-th", "title": "Only the disk: topological obstructions for warped AdS$_6\\times S^2$ in Type IIB", "abstract": "Supersymmetric AdS$_6\\times S^2$ solutions of Type IIB supergravity are warped products over a Riemann surface $\\Sigma$. They are determined by two holomorphic differentials on $\\Sigma$, with five-branes at poles on its boundary. We derive restrictions on the genus and the number of boundary components of $\\Sigma$. Without seven-branes or orientifolds, the differentials are taken to be single-valued on $\\Sigma$. Regularity implies that the number of interior zeros of one differential equals the total rotation of the phase of the ratio of the two differentials along the boundary. It also bounds this rotation on each boundary component by the number of poles on that component. Combined with the known count of zeros on the double of $\\Sigma$, these two statements force $\\Sigma$ to be a disk. With mutually local seven-branes and orientifolds as interior punctures, the same conclusion follows under additional assumptions on the global structure of the differentials and on their behavior at the punctures. The disk then admits at most one orientifold puncture. On a disk without punctures, the bound applied between successive poles also recovers the known cyclic ordering of the five-brane charges along the boundary.", "url": "https://arxiv.org/abs/2611.24320", "type": "理论", "summary": "IIB 型超重力的超对称 AdS$_6\\times S^2$ 解是黎曼曲面 $\\Sigma$ 上的翘曲积。它们由 $\\Sigma$ 上的两个全纯微分决定，其边界上的极点有五个膜。我们得出对 $\\Sigma$ 的属和边界分量数量的限制。如果没有七膜或东方褶皱，则 $\\Sigma$ 上的微分被视为单值。规律性意味着一个微分的内部零点的数量等于两个微分之比沿边界的相位总旋转。它还通过每个边界组件上的极数来限制该旋转。结合 $\\Sigma$ 的双精度数上已知的零计数，这两个语句强制 $\\Sigma$ 成为磁盘。使用相互局部的七膜和东方褶皱作为内部穿孔，在对微分的全局结构及其在穿孔处的行为的附加假设下，可以得出相同的结论。然后，该盘最多允许一个东方褶皱穿孔。\n\n在没有穿孔的圆盘上，连续极点之间应用的边界也恢复了沿边界的五膜电荷的已知循环排序。", "authors": [{"name": "Nakwoo Kim"}], "featured_authors": [{"name": "Nakwoo Kim"}], "author_count": 1}, {"id": "2611.24396", "category": "hep-th", "title": "Cohomological Foundations of Entropic Monotonicity: The Relative Cyclic Complex, the Transgression Map, and the Entropic $c$-Theorem in $d = 2$", "abstract": "We develop a cohomological framework for the entropic $c$-theorem in two dimensions, based on the relative cyclic complex of a pair of von Neumann algebras and on the transgression map associated with a faithful normal state. The framework identifies the positivity underlying the entropic proof as Borchers positivity of the zero-frequency component of the relative modular cocycle, which is the operator-algebraic origin of the quantum null energy condition (QNEC). The positivity results are dimension-independent: they depend only on the split property, modular $p$-nuclearity, and the half-sided modular inclusion structure. The main results of the paper are: (i) the identification of the entanglement cohomology with the kernel of the restriction map (Theorem 2.6); (ii) Borchers positivity of the relative modular cocycle (Proposition 3.8}); (iii) the finite-dimensional positivity of the entropy flux (Corollary 3.9); and (iv) the entropic $c$-theorem in $d = 2$ (Theorem 4.3), which follows from (iii) and the one-variable analysis. The $c$-theorem proof uses no ultraviolet regulator at any intermediate step. We also formulate two open problems: the cochain-level positivity of the transgression (Conjecture 3.5) and the cohomological interpretation of the QNEC (Conjecture 3.11). Both are stated as research directions, not as results of the paper; in particular, the $c$-theorem proof does not depend on either of them. The extension of the framework to the $F$-theorem in $d = 3$ and the general-$d$ program is the subject of the companion paper \\cite{Rashkov:2026b}.", "url": "https://arxiv.org/abs/2611.24396", "type": "理论", "summary": "我们基于一对冯诺依曼代数的相对循环复形以及与忠实正常状态相关的海侵图，为二维熵 $c$ 定理开发了一个上同调框架。该框架将熵证明背后的正性确定为相对模余循环的零频率分量的 Borchers 正性，这是量子零能量条件 (QNEC) 的算子代数起源。正性结果与维度无关：它们仅取决于分裂属性、模块化 $p$-核性和半边模块化包含结构。论文的主要成果有：（i）用限制图核识别纠缠上同调（定理2.6）； (ii) Borchers 对相关模余循环的积极性（命题 3.8}）； (iii) 熵通量的有限维正性（推论 3.9）； (iv) $d = 2$ 中的熵 $c$ 定理（定理 4.3），由 (iii) 和一变量分析得出。 $c$ 定理证明在任何中间步骤均不使用紫外线调节器。\n\n我们还提出了两个开放问题：越界的上链级正性（猜想 3.5）和 QNEC 的上同调解释（猜想 3.11）。两者都被表述为研究方向，而不是论文结果；特别是，$c$定理证明不依赖于它们中的任何一个。将框架扩展到 $d = 3$ 中的 $F$ 定理和通用 $d$ 程序是配套论文 \\cite{Rashkov:2026b} 的主题。", "authors": [{"name": "R. C. Rashkov"}], "featured_authors": [{"name": "R. C. Rashkov"}], "author_count": 1}, {"id": "2611.24510", "category": "hep-th", "title": "Localization of a 3-form gauge field in a braneworld", "abstract": "The localization of a $3$-form gauge field is investigated in a extra dimension attached to an AdS metric in $4+1$ dimensions. We propose the study of a model for the scalar field and a $3$-form gauge field coupled to the gravitational field in $5D$. The spacetime is set by an AdS metric whose geometry introduces a warped function of the fifth spatial coordinate. Considering that the scalar field also depends only on the extra coordinate, we obtain the equation of motions for the set of fields of the model. Using the technique of variable separation in the $3$-rank gauge sector, we explore the localization of the dynamical in terms of the warped function. We also extend the initial model for a complex scalar field that couples minimally with the dual strength field tensor associated with the $3$-rank gauge field. Thus, the coupling constant has a fundamental role in the localization of new $p$-form gauge field on the brane domain.", "url": "https://arxiv.org/abs/2611.24510", "type": "理论", "summary": "$3$ 形式的仪表字段的本地化在附加到 $4+1$ 维度中的 AdS 指标的额外维度中进行研究。我们建议研究标量场和与 $5D$ 引力场耦合的 $3$ 形式规范场的模型。时空由 AdS 度量设置，其几何形状引入了第五个空间坐标的扭曲函数。考虑到标量场也仅​​取决于额外的坐标，我们获得了模型场集的运动方程。使用 3$ 级规范扇区中的变量分离技术，我们探索了扭曲函数方面的动力学局部化。我们还扩展了复杂标量场的初始模型，该模型与与 3$ 阶规范场相关的双强度场张量最小耦合。因此，耦合常数在膜域上新的$p$形式规范场的定位中具有基本作用。", "authors": [{"name": "Pratik Chattopadhyay"}, {"name": "M. J. Neves"}], "featured_authors": [{"name": "Pratik Chattopadhyay"}, {"name": "M. J. Neves"}], "author_count": 2}, {"id": "2611.24531", "category": "hep-th", "title": "$1/N$ corrections to $\\langle TJJ\\rangle$ and $\\langle TTT\\rangle$ in QED$_3$, QED$_3$--GNY and scalar QED$_3$", "abstract": "Three-dimensional Abelian gauge theories have broad applications in deconfined quantum criticality, Dirac spin liquids and cuprate superconductivity. Correlation functions of conserved currents $J$ and the stress tensor $T$ carry fundamental information about these theories. We compute the first subleading large-flavor corrections to the parity-even three-point functions $\\langle TJJ\\rangle$ and $\\langle TTT\\rangle$ in QED$_3$, QED$_3$--Gross--Neveu--Yukawa, and critical scalar QED$_3$. For $\\langle TJJ\\rangle$, we study both global flavor currents and the topological $U(1)$ current, which measures the magnetic flux of the dynamical gauge field. We evaluate the flat-space energy flux in directions where the leading free-field profile vanishes. At first subleading order the flux in these directions is determined by four-particle production, yielding analytic corrections to the conformal collider parameters. We reproduce the corrections independently from squashed-sphere free-energy derivatives. Together with known two-point normalizations, the collider parameters fix the coefficients of both independent tensor structures in each correlator. Our results are useful for studying conductivity and shear response near quantum critical points and for conformal bootstrap studies of conserved-current and stress-tensor correlators in strongly coupled gauge theories.", "url": "https://arxiv.org/abs/2611.24531", "type": "理论", "summary": "三维阿贝尔规范理论在解禁量子临界性、狄拉克自旋液体和铜酸盐超导方面有着广泛的应用。守恒电流 $J$ 和应力张量 $T$ 的相关函数携带了这些理论的基本信息。我们计算 QED$_3$、QED$_3$--Gross--Neveu--Yukawa 和临界标量 QED$_3$ 中奇偶偶数三点函数 $\\langle TJJ\\rangle$ 和 $\\langle TTT\\rangle$ 的第一个次领先大风味校正。对于$\\langle TJJ\\rangle$，我们研究了全局风味电流和拓扑$U(1)$电流，后者测量动态规范场的磁通量。我们评估领先自由场轮廓消失的方向上的平坦空间能量通量。首先，这些方向上的通量由四粒子产生确定，从而对共形对撞机参数进行分析校正。我们独立于压扁球自由能导数来重现校正。与已知的两点归一化一起，对撞机参数固定每个相关器中两个独立张量结构的系数。\n\n我们的结果对于研究量子临界点附近的电导率和剪切响应以及强耦合规范理论中守恒电流和应力张量相关器的共形自举研究非常有用。", "authors": [{"name": "Yongwei Guo"}, {"name": "Zhijin Li"}, {"name": "Ke Ren"}], "featured_authors": [{"name": "Yongwei Guo"}, {"name": "Zhijin Li"}, {"name": "Ke Ren"}], "author_count": 3}, {"id": "2611.24666", "category": "hep-th", "title": "Deep learning spacetime from entanglement dynamics", "abstract": "In the eternal AdS black hole, the entanglement of the thermofield double state is geometrically realised by the Einstein--Rosen bridge, in line with the ER=EPR conjecture. Hartman--Maldacena surfaces threading this bridge pass behind the event horizon, so the time-dependent entanglement entropy $S(t)$ of a pair of half-lines, one on each boundary, probes the black hole interior. We turn this relation around and ask how much of the bulk spacetime can be reconstructed from $S(t)$, using a neural ordinary differential equation that learns the metric directly from the entanglement data. We show that $S(t)$ depends on the geometry only through a single function, the local surface gravity expressed in terms of the timelike Killing norm. This is enough to fix a metric with one unknown function: for charged BTZ black holes, the network reconstructs it throughout the region probed by the surfaces, including part of the interior, and the learned metric also yields the Hawking temperature and the location of the critical surface that bounds the accessible interior. With two unknown functions, however, it is not: physically distinct geometries whose two-dimensional $(t,z)$ sectors are related by diffeomorphisms produce the same $S(t)$. Finally, although the null energy condition is not imposed, the network reproduces data obeying the causal bound $v_E\\le 1$ on the entanglement velocity, but not data that violate it. Our results thus offer a data-driven perspective on how spacetime, including the black hole interior, emerges from quantum entanglement, and delineate which features of the geometry entanglement alone can determine.", "url": "https://arxiv.org/abs/2611.24666", "type": "理论", "summary": "在永恒的AdS黑洞中，热场双态的纠缠在几何上是通过爱因斯坦-罗森桥实现的，符合ER=EPR猜想。哈特曼——穿过这座桥的 Maldacena 表面穿过事件视界后面，因此一对半线（每个边界各有一个）的时间相关纠缠熵 $S(t)$ 探测黑洞内部。我们扭转这种关系，并询问可以使用直接从纠缠数据学习度量的神经常微分方程从 $S(t)$ 重建多少体积时空。我们证明 $S(t)$ 仅通过一个函数依赖于几何形状，即以类时 Killing 范数表示的局部表面重力。这足以修复具有一个未知函数的度量：对于带电 BTZ 黑洞，网络在整个表面探测的区域（包括内部的一部分）重建它，并且学习的度量还产生霍金温度和限制可访问内部的临界表面的位置。\n\n然而，对于两个未知函数，情况并非如此：物理上不同的几何形状，其二维 $(t,z)$ 扇区通过微分同胚相关，产生相同的 $S(t)$。最后，虽然没有强加零能量条件，但网络会再现遵守纠缠速度因果界限 $v_E\\le 1$ 的数据，但不会再现违反它的数据。因此，我们的结果为时空（包括黑洞内部）如何从量子纠缠中出现提供了数据驱动的视角，并描述了几何纠缠本身可以确定的哪些特征。", "authors": [{"name": "Hyun-Sik Jeong"}, {"name": "Keun-Young Kim"}, {"name": "Gaya Yun"}, {"name": "Kwan Yun"}], "featured_authors": [{"name": "Hyun-Sik Jeong"}, {"name": "Keun-Young Kim"}, {"name": "Gaya Yun"}, {"name": "Kwan Yun"}], "author_count": 4}, {"id": "2611.24691", "category": "hep-th", "title": "Regge Dilaton Gravity from Feynman Diagrams", "abstract": "Baratin and Freidel showed that closed Feynman diagrams in three and four Euclidean dimensions can be expressed as expectation values of observables in a Regge-type topological model \\cite{baratin_hidden_2007, baratin_hidden_2007-1}. We extend their analysis to two dimensions with spherical, flat, or hyperbolic background geometry. Specifically, we show that the reduced Feynman amplitude of any closed (planar) scalar graph can be represented as an observable insertion in the partition function of either a discretized BF theory, whose gauge group is the isometry group of the background, or a homogeneous Regge discretization of linear dilaton gravity.", "url": "https://arxiv.org/abs/2611.24691", "type": "理论", "summary": "Baratin 和 Freidel 表明，三维和四维欧几里得维度的闭合费曼图可以表示为 Regge 型拓扑模型中可观测量的期望值 \\cite{baratin_hidden_​​2007, baratin_hidden_​​2007-1}。我们将他们的分析扩展到具有球形、平面或双曲背景几何形状的二维。具体来说，我们表明任何闭合（平面）标量图的约化费曼振幅可以表示为离散 BF 理论（其规范群是背景的等距群）或线性膨胀引力的齐次 Regge 离散化的配分函数中的可观察插入。", "authors": [{"name": "Florian Girelli"}, {"name": "Christopher Pollack"}], "featured_authors": [{"name": "Florian Girelli"}, {"name": "Christopher Pollack"}], "author_count": 2}, {"id": "2611.24752", "category": "hep-th", "title": "Learning the Anyon Atlas", "abstract": "We extend our previous search for the modular data of topological quantum field theories in 2+1 dimensions from 22 to 42 anyons, identifying 150,679 new modular data. We do so by adding to our algorithm three rejection gates, two of them based on logistic regression, that discard representations of $SL(2,\\mathbb{Z})$ unlikely to yield modular data. We estimate that roughly 80% of the modular data between ranks 23 and 42 has been identified after closing under known constructions. With this data, we find counterexamples to a conjecture of Geiko and Moore that the reality of the higher Gauss sums suffices for time-reversal symmetry in Chern-Simons theories, and propose a refined criterion. We demonstrate the scalability of this gated implementation by identifying prime modular data at rank 100 that is not realized by any Chern-Simons theory. The identified data through rank 42 has been made available at this https URL , to which further data will be added as it is found.", "url": "https://arxiv.org/abs/2611.24752", "type": "理论", "summary": "我们将之前对 2+1 维度拓扑量子场论模块化数据的搜索从 22 个任意子扩展到 42 个任意子，识别出 150,679 个新的模块化数据。我们通过在算法中添加三个拒绝门来实现这一点，其中两个基于逻辑回归，丢弃不太可能产生模块化数据的 $SL(2,\\mathbb{Z})$ 表示。我们估计，在已知结构下关闭后，大约 80% 的 23 到 42 级之间的模块化数据已被识别。利用这些数据，我们找到了 Geiko 和 Moore 的猜想的反例，即更高的高斯和的现实足以满足 Chern-Simons 理论中的时间反转对称性，并提出了一个改进的标准。我们通过识别任何 Chern-Simons 理论都无法实现的 100 级素数模块化数据来证明这种门控实现的可扩展性。排名 42 的已识别数据已在此 https URL 上提供，发现更多数据后将添加到该 URL。", "authors": [{"name": "Jonah Berean-Dutcher"}, {"name": "Clay Cordova"}, {"name": "Julio Parra-Martinez"}, {"name": "Richard Tuddenham"}, {"name": "Zekai Zhu"}], "featured_authors": [{"name": "Jonah Berean-Dutcher"}, {"name": "Clay Cordova"}, {"name": "Julio Parra-Martinez"}, {"name": "Richard Tuddenham"}, {"name": "Zekai Zhu"}], "author_count": 5}, {"id": "2611.24753", "category": "hep-th", "title": "Computing $F$-Symbols from Modular Data", "abstract": "We present a strategy for computing the $F$-symbols of unitary modular categories with a self-dual simple generator, starting from their modular data, which almost entirely avoids the non-linear solution of the pentagon equations. The algorithm climbs a ladder of braid group representations on successively more strands of the generator until enough $F$-symbols have been determined to propagate them to a complete solution. The strategy presented is successful in difficult cases through ranks 11 and 12, including $\\operatorname{Z}(\\mathrm{Haagerup}_3)$, and does not require the category to be multiplicity-free. Although the algorithm is implemented numerically, we describe a reliable means of recovering the exact $F$-symbols, assuming that in some gauge they lie in a given number field, and of certifying every pentagon and hexagon equation exactly. The exotic rank-11 anisotropic modular category B11-00119 ( this https URL ), with largest fusion coefficient 4, is used as a motivating example, for which the solve takes roughly 10 minutes on a laptop. We will continue to add $F$-symbol solutions to this https URL as they are completed.", "url": "https://arxiv.org/abs/2611.24753", "type": "理论", "summary": "我们提出了一种用自对偶简单生成器从模数据开始计算酉模类别的 $F$ 符号的策略，这几乎完全避免了五边形方程的非线性解。该算法在生成器的连续更多股上爬上编织组表示的阶梯，直到确定足够的 $F$ 符号将它们传播到完整的解决方案。所提出的策略在排名 11 和 12 的困难情况下是成功的，包括 $\\operatorname{Z}(\\mathrm{Haagerup}_3)$，并且不要求类别是无重数的。尽管该算法是通过数字实现的，但我们描述了一种可靠的方法来恢复精确的 $F$ 符号，假设在某些规范中它们位于给定的数域中，并精确地证明每个五边形和六边形方程。奇异的 11 级各向异性模块类别 B11-00119（此 https URL ）具有最大融合系数 4，用作激励示例，在笔记本电脑上求解该问题大约需要 10 分钟。完成后，我们将继续向此 https URL 添加 $F$ 符号解决方案。", "authors": [{"name": "Jonah Berean-Dutcher"}, {"name": "Clay Cordova"}, {"name": "Julio Parra-Martinez"}, {"name": "Richard Tuddenham"}], "featured_authors": [{"name": "Jonah Berean-Dutcher"}, {"name": "Clay Cordova"}, {"name": "Julio Parra-Martinez"}, {"name": "Richard Tuddenham"}], "author_count": 4}, {"id": "2611.24779", "category": "hep-th", "title": "Holography at finite resolution: zero-point length in AdS/CFT", "abstract": "We explore the zero-point length $l_0$ of T-duality-inspired effective field theory in holography, distinguishing two readings. As a boundary resolution scale, $l_0$ filters the source of a bulk scalar in anti-de Sitter space and yields an exactly solvable boundary response that is ultraviolet finite without a hard cutoff and inherits the power-law tails of the zero-point-length kernel. We show that this filter is the source-normalized bulk-to-boundary transfer function of a $\\nu=1$ scalar evaluated at radial depth $z=l_0$. Anchoring Ryu-Takayanagi surfaces on the same radial surface gives finite entanglement entropies that retain the perimeter law and the universal sphere free energy. For two intervals in AdS$_3$, the prescription yields the mutual-information connectivity transition in closed form for arbitrary interval lengths; equal intervals maximize the connectivity window at fixed total length, and in the subresolution regime the critical separation exhibits a universal scaling law with a rescaled mutual information collapsing onto a piecewise-linear profile. As an AdS-invariant bulk proper length, $l_0$ renders the one-loop tadpole finite while preserving the conformal form of boundary two-point functions. Its exact Källén-Lehmann decomposition, however, has negative continuum weight beginning at threshold, obstructing a unitary interpretation of this propagator. The ratio $L/l_0$ identifies a crossover scale of the form factor rather than a derived spectrum of a unitary completion.", "url": "https://arxiv.org/abs/2611.24779", "type": "理论", "summary": "我们探索全息中受 T 对偶启发的有效场论的零点长度 $l_0$，区分两个读数。作为边界分辨率尺度，$l_0$ 过滤反德西特空间中的体标量源，并产生完全可解的边界响应，该响应是紫外有限的，没有硬截止，并继承了零点长度内核的幂律尾部。我们证明该滤波器是在径向深度 $z=l_0$ 处评估的 $\\nu=1$ 标量的源归一化批量到边界传递函数。将 Ryu-Takayanagi 表面锚定在同一径向表面上会产生有限的纠缠熵，从而保留了周长定律和通用球体自由能。对于 AdS$_3$ 中的两个区间，该规定针对任意区间长度产生封闭形式的互信息连接转换；等间隔最大化固定总长度下的连接窗口，并且在亚分辨率状态下，临界分离表现出通用缩放定律，其中重新缩放的互信息折叠到分段线性轮廓上。\n\n作为 AdS 不变的整体真长，$l_0$ 使单环蝌蚪有限，同时保留边界两点函数的共形形式。然而，其精确的 Källén-Lehmann 分解从阈值开始具有负连续权重，阻碍了对该传播器的统一解释。比率 $L/l_0$ 标识了形状因子的交叉比例，而不是单一完成的派生频谱。", "authors": [{"name": "Ankit Anand"}, {"name": "Kimet Jusufi"}, {"name": "Amir A. Khodahami"}, {"name": "Adrinil Paul"}, {"name": "Ahmad Sheykhi"}], "featured_authors": [{"name": "Ankit Anand"}, {"name": "Kimet Jusufi"}, {"name": "Amir A. Khodahami"}, {"name": "Adrinil Paul"}, {"name": "Ahmad Sheykhi"}], "author_count": 5}, {"id": "2611.24874", "category": "hep-th", "title": "Rotating black hole thermodynamics at NNLO in higher-curvature gravity", "abstract": "We investigate higher-curvature corrections to black-hole thermodynamics in quasitopological gravity using perturbative Euclidean-action methods. Static, spherically symmetric black holes provide a benchmark for the action expansion, while our main application concerns five-dimensional, asymptotically flat, rotating black holes with equal angular momenta. For Einstein gravity supplemented by Gauss--Bonnet and cubic quasitopological interactions, we compute the Gibbs free energy through next-to-next-to-leading order, retaining both quadratic and cubic corrections. The result retains the full dependence on the background spin parameter, without a slow-rotation expansion, and extends to arbitrary couplings of quadratic and cubic curvature invariants. We derive the corrected mass, entropy and angular momenta, and show how rotation affects the size and sign of the corrections.", "url": "https://arxiv.org/abs/2611.24874", "type": "理论", "summary": "我们使用微扰欧几里德作用方法研究准拓扑引力中黑洞热力学的更高曲率修正。静态、球对称黑洞为作用展开提供了基准，而我们的主要应用涉及具有相等角动量的五维、渐近平坦、旋转黑洞。对于由高斯-邦尼特和三次准拓扑相互作用补充的爱因斯坦引力，我们通过倒数第二顺序计算吉布斯自由能，保留二次和三次修正。结果保留了对背景自旋参数的完全依赖性，没有慢速旋转展开，并且扩展到二次和三次曲率不变量的任意耦合。我们推导出校正后的质量、熵和角动量，并展示旋转如何影响校正的大小和符号。", "authors": [{"name": "Cristobal Laporte"}], "featured_authors": [{"name": "Cristobal Laporte"}], "author_count": 1}, {"id": "2611.24897", "category": "hep-th", "title": "Beyond hidden zeros and uniqueness in Tr$(ϕ^3)$: Block and rod zeros in any Tr$(ϕ^m)$", "abstract": "Hidden zeros have proven powerful tools for reconstructing amplitudes in Tr$(\\phi^3)$, a theory of colored scalars with cubic interactions. We show that these structures extend to any Tr$(\\phi^m)$ theory. For odd $m$, we construct \\emph{block zeros} from orthogonal sums of consecutive momenta, generalizing the original cubic hidden zeros. For every $m\\geq4$, including even $m$, we describe a second family of nonlinear \\emph{rod zeros} through a rod packing problem. In Tr$(\\phi^4)$ this construction reduces to a simple rank-one condition on a matrix of momentum contractions. We connect this new zero to the classic threshold nullification zeros of Voloshin, where certain amplitudes in massive $\\phi^4$ theory vanish when all produced particles are at rest. Finally, we demonstrate the reconstruction power of these zeros. Assuming locality, we prove that the rod zeros uniquely fix all Tr$(\\phi^m)$ tree amplitudes for $m\\geq4$ up to normalization. We also conjecture that the block zeros enforce both locality and unitarity for any Tr$(\\phi^m)$ theory with odd $m$.", "url": "https://arxiv.org/abs/2611.24897", "type": "理论", "summary": "隐藏零点已被证明是重建 Tr$(\\phi^3)$ 中振幅的强大工具，Tr$(\\phi^3)$ 是一种具有三次相互作用的彩色标量理论。我们证明这些结构可以扩展到任何 Tr$(\\phi^m)$ 理论。对于奇数$m$，我们从连续动量的正交和构造\\emph{块零}，概括原始的三次隐藏零。对于每个$m\\geq4$，甚至包括$m$，我们通过杆堆积问题描述第二个非线性\\emph{杆零点}族。在 Tr$(\\phi^4)$ 中，这种构造简化为动量收缩矩阵上的简单秩一条件。我们将这个新的零与沃洛辛的经典阈值无效零联系起来，其中当所有产生的粒子处于静止状态时，大规模 $\\phi^4$ 理论中的某些振幅消失。最后，我们展示了这些零点的重建能力。假设局部性，我们证明杆零点唯一地固定 $m\\geq4$ 的所有 Tr$(\\phi^m)$ 树振幅直至归一化。我们还推测，块零对任何具有奇数 $m$ 的 Tr$(\\phi^m)$ 理论强制执行局部性和幺正性。", "authors": [{"name": "Laurentiu Rodina"}], "featured_authors": [{"name": "Laurentiu Rodina"}], "author_count": 1}, {"id": "2611.23475", "category": "math-ph", "title": "Formalizing local gauge freedom via bi-equivariant groupoid algebras", "abstract": "Gauge degrees of freedom appear in many different contexts. Here, we describe their emergence in the context of architected metamaterials built from self-coupling blocks with internal symmetries. Quantifying the dynamics requires choices of local frames and the many available options constitute the local gauge degrees of freedom of the problem. In the absence of internal symmetries, the dynamical matrices generating the dynamics are all built from the left regular representation of a groupoid C*-algebra canonically associated to the architecture. If the resonators display internal symmetries, we show that the mentioned groupoid C*-algebra accepts a natural 2-action by the group of internal symmetries and that the local gauge freedom can be encoded in a bi-equivariant sub-groupoid algebra generated from the mentioned 2-action. The latter is shown to be the smallest C*-algebra containing all dynamical matrices that can be engineered in a laboratory, for a given architecture and discrete group of internal symmetries.", "url": "https://arxiv.org/abs/2611.23475", "type": "理论", "summary": "测量自由度出现在许多不同的环境中。在这里，我们描述了它们在由具有内部对称性的自耦合块构建的架构超材料背景下的出现。量化动力学需要选择局部框架，许多可用选项构成了问题的局部规范自由度。在缺乏内部对称性的情况下，生成动力学的动力学矩阵都是根据与体系结构规范相关的群形 C* 代数的左正则表示构建的。如果谐振器显示内部对称性，我们表明上述群形 C* 代数接受内部对称性群的自然 2-作用，并且局部规范自由度可以编码为由上述 2-作用生成的双等变子群形代数。后者被证明是最小的 C* 代数，包含可以在实验室中针对给定架构和离散内部对称组设计的所有动态矩阵。", "authors": [{"name": "Emil Prodan"}], "featured_authors": [{"name": "Emil Prodan"}], "author_count": 1}, {"id": "2611.23493", "category": "math-ph", "title": "Norm Approximation with Linear Growth of Error for Bosonic Dynamics in the Mean-Field Regime", "abstract": "We consider the quantum many-body dynamics of a homogeneous confined Bose gas in three dimensions in the mean-field scaling regime. We study the Cauchy problem for a class of initial data describing finitely many excitations over a Bose-Einstein condensate. Using a rigorous version of Bogolyubov's theory, we prove that the many-body evolution can be approximated in Fock space norm by a quasifree evolution of the excitations with an error which grows linearly in time. In distinction from earlier results, the slow growth in time holds even though the effective equation is not dispersive.", "url": "https://arxiv.org/abs/2611.23493", "type": "理论", "summary": "我们在平均场尺度范围内考虑三维均质受限玻色气体的量子多体动力学。我们研究一类初始数据的柯西问题，该数据描述了玻色-爱因斯坦凝聚体上的有限多个激励。使用 Bogolyubov 理论的严格版本，我们证明多体演化可以在 Fock 空间范数中通过激励的准自由演化来近似，误差随时间线性增长。与早期的结果不同，即使有效方程不是离散的，时间上的缓慢增长仍然成立。", "authors": [{"name": "Niels Benedikter"}, {"name": "Chiara Boccato"}, {"name": "Umberto Morellini"}], "featured_authors": [{"name": "Niels Benedikter"}, {"name": "Chiara Boccato"}, {"name": "Umberto Morellini"}], "author_count": 3}, {"id": "2611.23758", "category": "math-ph", "title": "Charged Schrödinger blocks in $1+1$ dimensions from the quartic Casimir and endpoint equations", "abstract": "We construct charge-two Schrödinger conformal blocks in one spatial dimension, independently of any dynamical realization. We consider ordered vacuum four-point functions of fundamental fields of dimension $1/2$, with homogeneous Schrödinger equations at the earliest and latest insertions and interactions allowed in the intermediate two-particle interval. For reduced blocks analytic in signed spatial coordinates and even under simultaneous spatial inversion, two functions of the time cross-ratio determine the full spatial dependence: the collinear value and a rescaled mixed spatial derivative. An exact Kummer lift, built from confluent hypergeometric functions, gives this reconstruction. An operator identity reduces the quartic Casimir equation, modulo the endpoint equations, to an equivalent coupled system for this pair. At generic exchanged dimension, OPE conditions select a unique block up to normalization for each primary parity. We obtain collinear ${}_4F_3$ functions and sums of Kummer products, including the shadow branches. The blocks depend on the relative sign of the signed coordinates, distinguishing piecewise linear worldlines with an inflection from those with monotone segment velocities. In the Calogero model, we recover the previously derived bosonic four-point function and obtain its fermionic counterpart, with an independent integral check. At the diffusion-limited fixed point of $A+B\\to\\emptyset$, two blocks of opposite primary parity give the same collinear unlike-species response. Nonnegativity for all positions and ordered times selects the even family, thereby establishing that the response summed over species contains the even shadow pair with dimensions $\\Delta=1,2$. The nonnegativity argument demonstrates a concrete constraint for a Schrödinger bootstrap beyond collinear data.", "url": "https://arxiv.org/abs/2611.23758", "type": "理论", "summary": "我们在一个空间维度上构造电荷二薛定谔共形块，独立于任何动力学实现。我们考虑维度为 $1/2$ 的基本场的有序真空四点函数，在中间两粒子区间允许的最早和最晚插入和相互作用处具有齐次薛定谔方程。对于在符号空间坐标中甚至在同时空间反演下分析的简化块，时间交叉比的两个函数确定完全空间依赖性：共线值和重新缩放的混合空间导数。由汇合超几何函数构建的精确库默升力可以实现这种重建。算子恒等式将四次卡西米尔方程（以端点方程为模）简化为该对的等效耦合系统。在通用交换维度，OPE 条件选择一个唯一的块，直到每个主奇偶校验的标准化。我们获得共线 ${}_4F_3$ 函数和 Kummer 乘积之和，包括影子分支。\n\n这些块取决于有符号坐标的相对符号，区分具有拐点的分段线性世界线和具有单调线段速度的世界线。在Calogero模型中，我们通过独立的积分检查恢复了先前导出的玻色四点函数并获得了其对应的费米子函数。在 $A+B\\to\\emptyset$ 的扩散限制固定点，两个具有相反主奇偶性的块给出相同的共线异种响应。所有位置和有序时间的非负性选择偶数族，从而确定对物种求和的响应包含维度 $\\Delta=1,2$ 的偶数阴影对。非负性论证证明了薛定谔引导程序在共线数据之外的具体约束。", "authors": [{"name": "Hirohiko Shimada"}], "featured_authors": [{"name": "Hirohiko Shimada"}], "author_count": 1}, {"id": "2611.23957", "category": "math-ph", "title": "Spectrum of the parity operator for parafermions and parabosons from character formulas", "abstract": "In a recent paper [J. Phys. A: Math. Theor. 59 175201 (2026)] Green's triple relations for parafermions and parabosons were extended by including a new operator $P$, referred to as the parity operator. The spectrum of $P$ in Fock space representations was computed, making use of the action of parafermion (resp.\\ paraboson) creation and annihilation operators. In the current paper, we adopt a different method to compute the spectrum of $P$, namely using character formulas. For a set of $n$ parafermions, the action of $P$ is deduced from character formulas of $so(2n+2)$. For a set of $n$ parabosons, the known spectrum of $P$ yields new character formulas of particular $osp(2|2n)$ representations.", "url": "https://arxiv.org/abs/2611.23957", "type": "理论", "summary": "在最近的一篇论文中[J.物理。答：数学。理论。 59 175201 (2026)] 格林的对费米子和抛玻色子的三重关系通过引入一个新的算子 $P$（称为宇称算子）而得以扩展。利用parafermion（resp.\\paraboson）产生和湮灭算子的作用，计算了福克空间表示中$P$的谱。在本文中，我们采用不同的方法来计算$P$的谱，即使用特征公式。对于一组 $n$ 副费米子，$P$ 的作用是从 $so(2n+2)$ 的字符公式推导出来的。对于一组 $n$ 抛物子，$P$ 的已知谱产生特定 $osp(2|2n)$ 表示的新字符公式。", "authors": [{"name": "N.I. Stoilova"}, {"name": "J. Van der Jeugt"}], "featured_authors": [{"name": "N.I. Stoilova"}, {"name": "J. Van der Jeugt"}], "author_count": 2}, {"id": "2611.23981", "category": "math-ph", "title": "Free energy distribution for two non-crossing directed polymers on the cylinder", "abstract": "We consider the partition sum $Z_L(t)$ of two non-crossing continuum directed polymers of length $t$, in a common random medium with the geometry of a cylinder of circumference length $L$. In the limit $t \\to +\\infty$, the $k$-th cumulant of (minus) the free energy $\\log Z_L(t)$, grows as $c_k(L) t$, and we compute the amplitudes $c_k(L)$. To this aim we first study the integer moments $\\langle Z_L(t)^n \\rangle$, whose long-time behavior is determined by the ground-state energy of the one-dimensional attractive Lieb--Liniger model in the symmetry sector associated with the Young diagram $(n,n)$ (a two-component bosonic nested Bethe ansatz). This ground state energy is obtained using the nested Bethe-Ansatz involving $2n$ physical rapidities and $n$ auxiliary rapidities. The analytic continuation in the replica number $n$, which yields the cumulants $c_k(L)$, is performed through a non-trivial generalization of the method developed by Brunet and Derrida for a single polymer on the cylinder. We obtain fully explicit formulas for the mean $c_1(L)$ and the variance $c_2(L)$, and construct a systematic scheme for computing all higher cumulants $c_k(L)$. Finally, taking $L\\to+\\infty$ and $n\\to0$ with $nL^{1/2}$ fixed, we derive a universal scaling function which characterizes the large-deviation statistics of the two-polymer free energy and is expected to be universal within the one-dimensional two-layer periodic SHE/KPZ class. The two tails of the large-deviation function are obtained analytically, revealing different roles of the non-crossing constraint in favorable and unfavorable fluctuations of the common disorder.", "url": "https://arxiv.org/abs/2611.23981", "type": "理论", "summary": "我们考虑两个长度为 $t$ 的非交叉连续介质定向聚合物的分配和 $Z_L(t)$，在具有圆周长度 $L$ 的圆柱体几何形状的常见随机介质中。在限制 $t \\to +\\infty$ 下，（减去）自由能 $\\log Z_L(​​t)$ 的第 $k$ 累积量增长为 $c_k(L) t$，我们计算振幅 $c_k(L)$。为此，我们首先研究整数矩 $\\langle Z_L(​​t)^n \\rangle$，其长期行为由与杨图 $(n,n)$（二元玻色子嵌套 Bethe ansatz）相关的对称扇区中一维吸引 Lieb-Liniger 模型的基态能量决定。该基态能量是使用嵌套的 Bethe-Ansatz 获得的，涉及 $2n$ 物理速度和 $n$ 辅助速度。复制品编号 $n$ 中的解析延拓产生累积量 $c_k(L)$，是通过 Brunet 和 Derrida 针对圆柱体上的单一聚合物开发的方法的重要推广来执行的。我们获得了均值 $c_1(L)$ 和方差 $c_2(L)$ 的完全明确的公式，并构建了一个用于计算所有较高累积量 $c_k(L)$ 的系统方案。\n\n最后，将 $L\\to+\\infty$ 和 $n\\to0$ 与 $nL^{1/2}$ 固定，我们推导出一个通用标度函数，该函数表征了二聚合物自由能的大偏差统计量，并且预计在一维两层周期 SHE/KPZ 类中具有通用性。解析得出大偏差函数的两条尾部，揭示了非交叉约束在共同紊乱的有利和不利波动中的不同作用。", "authors": [{"name": "Andrea De Luca"}, {"name": "Pierre Le Doussal"}], "featured_authors": [{"name": "Andrea De Luca"}, {"name": "Pierre Le Doussal"}], "author_count": 2}, {"id": "2611.24407", "category": "math-ph", "title": "Multiplicity criteria for the absolutely continuous spectrum of finite hopping Hermitian operators", "abstract": "We consider locally finite-hopping Hermitian operators that admit radial-type transfer matrix sets in the sense of Sadel. We extend his spectral averaging formula from scalar spectral measures to matrix-valued spectral measures associated to a root matrix. This extension yields criteria for lower bounds on the multiplicity of absolutely continuous spectrum. As applications, we consider random decaying shell-matrix potentials on stair-like graphs with increasing-width wires and operators on the Bethe lattice. In both cases, we establish that absolutely continuous spectrum has almost surely infinite multiplicity.", "url": "https://arxiv.org/abs/2611.24407", "type": "理论", "summary": "我们考虑局部有限跳跃埃尔米特算子，它允许萨德尔意义上的径向型传输矩阵集。我们将他的谱平均公式从标量谱测量扩展到与根矩阵相关的矩阵值谱测量。这种扩展产生了绝对连续谱的多重性下界的标准。作为应用，我们考虑在 Bethe 晶格上具有宽度不断增加的线和算子的阶梯图上的随机衰减壳矩阵势。在这两种情况下，我们都确定绝对连续谱几乎肯定具有无限的多重性。", "authors": [{"name": "Boris Bermúdez-Cárdenas"}, {"name": "Christian Sadel"}, {"name": "Amal Taarabt"}], "featured_authors": [{"name": "Boris Bermúdez-Cárdenas"}, {"name": "Christian Sadel"}, {"name": "Amal Taarabt"}], "author_count": 3}, {"id": "2611.24414", "category": "math-ph", "title": "On the thermal behavior of composites embedding extended general interfaces", "abstract": "In heterogeneous materials, surface roughness, chemical incompatibility, mechanical mismatch or manufacturing defects result in imperfect bonding between the constituents. Such imperfections introduce a finite-thickness interphase zone between the constituents that possess a graded or inhomogeneous micro-structure. It is virtually impossible to resolve the behavior of such interphases. Instead, a well-established approach is to replace the interphase by a zero-thickness interface endowed with its own energetic structure. Conventional interface models define the interface temperature as an average of the temperatures of the surrounding bulk phases. However, this assumption is only adequate to represent uniform homogeneous interphases and it fails to accurately capture the behavior of graded or inhomogeneous interphases. In this work, we address this limitation by allowing for unequal contributions of the surrounding bulk phases to the interface temperature. We systematically revisit the resulting balance equations and present the computational framework for the finite element implementation of the model. We further incorporate the proposed model within the homogenization framework and derive closed-form analytical expressions for the effective thermal conductivity of fiber- and particle-reinforced composites, accouting for the influence of the extended general interface. Finally, through a series of numerical examples, we demonstrate the capabilities of the proposed model and investigate the influence of its parameters on the size-dependent thermal behavior of composites.", "url": "https://arxiv.org/abs/2611.24414", "type": "理论", "summary": "在异质材料中，表面粗糙度、化学不相容性、机械不匹配或制造缺陷会导致成分之间的粘合不完美。这种缺陷在具有分级或不均匀微观结构的成分之间引入了有限厚度的界面区。解决这种界面的行为实际上是不可能的。相反，一种行之有效的方法是用具有自身能量结构的零厚度界面代替界面。传统的界面模型将界面温度定义为周围体相温度的平均值。然而，这种假设仅足以表示均匀的均匀界面相，并且无法准确捕获分级或不均匀界面相的行为。在这项工作中，我们通过允许周围体相对界面温度的不等贡献来解决这一限制。我们系统地重新审视所得到的平衡方程，并提出模型有限元实现的计算框架。\n\n我们进一步将所提出的模型纳入均质化框架内，并推导了纤维和颗粒增强复合材料有效导热率的封闭式解析表达式，并考虑了扩展通用界面的影响。最后，通过一系列数值例子，我们展示了所提出模型的功能，并研究了其参数对复合材料尺寸相关热行为的影响。", "authors": [{"name": "Soheil Firooz"}, {"name": "Kashish Veda Eluri"}, {"name": "Ali Javili"}, {"name": "Paul Steinmann"}], "featured_authors": [{"name": "Soheil Firooz"}, {"name": "Kashish Veda Eluri"}, {"name": "Ali Javili"}, {"name": "Paul Steinmann"}], "author_count": 4}, {"id": "2611.23269", "category": "quant-ph", "title": "The Bapat-Sunder eigenvalue conjecture fails over the reals", "abstract": "In 1986 Bapat and Sunder asked whether $\\operatorname{per}(A)$ is the largest eigenvalue of $F_A=[a_{i,j}\\operatorname{per}(A(i,j))]$ for every positive semidefinite Hermitian $A$, where $A(i,j)$ deletes row $i$ and column $j$. Drury disproved this over the complex field in 2018 and conjectured that the property holds for real positive semidefinite matrices. We disprove Drury's conjecture with a rank-$4$, $32\\times32$ integer Gram matrix and an integer vector whose Rayleigh quotient exceeds $\\operatorname{per}(A)$; verification uses integer arithmetic. Together, the two counterexamples resolve the Bapat-Sunder eigenvalue conjecture negatively over both fields. Counterexamples exist of every order $n\\ge32$. As an application to quantum optics, the violation yields a $36$-mode orthogonal interferometer and a direction of relative arrival-time delays among $32$ photons with identical-variance Gaussian wave packets along which every sufficiently small nonzero delay increases the probability that all photons are detected within four designated output modes.", "url": "https://arxiv.org/abs/2611.23269", "type": "理论", "summary": "1986 年，Bapat 和 Sunder 询问 $\\operatorname{per}(A)$ 是否是每个正半定 Hermitian $A$ 的 $F_A=[a_{i,j}\\operatorname{per}(A(i,j))]$ 的最大特征值，其中 $A(i,j)$ 删除行 $i$ 和列 $j$。 Drury 在 2018 年在复数域上反驳了这一点，并推测该性质对于实正半定矩阵成立。我们用一个rank-$4$、$32\\times32$整数Gram矩阵和一个瑞利商超过$\\operatorname{per}(A)$的整数向量反驳了Drury的猜想；验证使用整数运算。这两个反例共同解决了两个域上的 Bapat-Sunder 特征值猜想。每个阶 $n\\ge32$ 都存在反例。作为量子光学的应用，该违规产生了 36 美元模式正交干涉仪和具有相同方差高斯波包的 32 美元光子之间的相对到达时间延迟方向，沿着该方向，每个足够小的非零延迟都会增加在四种指定输出模式下检测到所有光子的概率。", "authors": [{"name": "Logan R. Chalmers"}], "featured_authors": [{"name": "Logan R. Chalmers"}], "author_count": 1}, {"id": "2611.23378", "category": "quant-ph", "title": "Scrambling leads to entanglement cost in NLQC", "abstract": "In a non-local quantum computation (NLQC), shared entanglement along with a single simultaneous round of quantum communication is used to implement a joint channel. NLQC has many applications, most of which benefit from an understanding of lower bounds on the entanglement needed to implement a given channel as an NLQC. However, the properties of a channel that lead to it having an entanglement cost in NLQC have remained unclear, with most lower bounds only applying to specially constructed examples. Here, we give a new lower bound technique for unitaries based on scrambling: we find that a unitary has zero entanglement cost if and only if it does not scramble. Further, we find that the tripartite mutual information, an entropic object that quantifies the degree of scrambling, provides a quantitative lower bound on entanglement cost in NLQC. This is the first known lower bound on entanglement cost for unitaries in NLQC which is faithful. Our results also relate scrambling and NLQC for the first time. Leveraging the faithful scrambling based bound, we then show that the controllable correlation, an earlier studied quantity, is also a faithful lower bound, resolving an earlier conjecture of Cleve and May.", "url": "https://arxiv.org/abs/2611.23378", "type": "理论", "summary": "在非局域量子计算（NLQC）中，共享纠缠以及单轮同步量子通信用于实现联合信道。 NLQC 有许多应用，其中大多数受益于对实现给定通道作为 NLQC 所需的纠缠下限的理解。然而，导致其在 NLQC 中具有纠缠成本的通道属性仍不清楚，大多数下限仅适用于特殊构造的示例。在这里，我们给出了一种基于置乱的酉式的新下界技术：我们发现，当且仅当它不进行置乱时，酉式的纠缠成本为零。此外，我们发现三方互信息（一种量化置乱程度的熵对象）为 NLQC 中的纠缠成本提供了定量下界。这是第一个已知的 NLQC 酉系纠缠成本下界，它是可靠的。我们的结果还首次将加扰和 NLQC 联系起来。\n\n利用基于可信置乱的界限，我们证明了早期研究的可控相关性也是一个可信的下界，解决了 Cleve 和 May 的早期猜想。", "authors": [{"name": "Atsuya Hasegawa"}, {"name": "Alex May"}], "featured_authors": [{"name": "Atsuya Hasegawa"}, {"name": "Alex May"}], "author_count": 2}, {"id": "2611.23387", "category": "quant-ph", "title": "Optimal Joint Bounds for Sparse Ground-State Energy Estimation and Ground-State Preparation", "abstract": "Ground-state energy estimation (GSEE) and ground-state preparation (GSP) are fundamental problems in quantum computing. Given a Hamiltonian $H$ with $\\|H\\|\\le1$ and a guiding state $|\\psi\\rangle$ with overlap at least $\\gamma>0$ with the ground space of $H$, the goal in GSEE is to estimate the ground-state energy of $H$ to additive error $\\delta$ with failure probability at most $\\varepsilon$, while in GSP it is to prepare a state with ground-space weight at least $1-\\varepsilon$, given a gap lower bound $\\Delta$. Their costs are measured by quantum query complexity, i.e., the number of oracle calls needed to access $H$. Recent work proved optimal bounds $\\Theta(\\log(1/\\varepsilon)/(\\gamma\\delta))$ for GSEE and $\\Theta(\\log(1/\\varepsilon)/(\\gamma\\Delta))$ for GSP in the time-evolution and block-encoding models. However, these models do not directly account for the sparsity of $H$, measured by the maximum number $s$ of nonzero entries in any row or column. In the sparse-access model, oracles instead return the locations and values of these entries. This introduces the additional parameter $s$, and it remained open how query complexity depends jointly on $s$, $\\gamma$, $\\delta$ or $\\Delta$, and $\\varepsilon$. We resolve this by proving sparse-query lower bounds $\\Omega(\\sqrt{s}\\log(1/\\varepsilon)/(\\gamma\\delta))$ for GSEE and $\\Omega(\\sqrt{s}\\log(1/\\varepsilon)/(\\gamma\\Delta))$ for GSP, even for stoquastic Hamiltonians. We also show that these constructions recover the earlier time-evolution and block-encoding lower-bound scalings. We then give matching upper-bound algorithms in the reversible in-place sparse-location model. Thus, we obtain $\\Theta(\\sqrt{s}\\log(1/\\varepsilon)/(\\gamma\\delta))$ for GSEE and $\\Theta(\\sqrt{s}\\log(1/\\varepsilon)/(\\gamma\\Delta))$ for GSP, showing that $\\sqrt{s}$ is necessary and sufficient and completing the joint dependence on all problem parameters.", "url": "https://arxiv.org/abs/2611.23387", "type": "理论+数值", "summary": "基态能量估计（GSEE）和基态准备（GSP）是量子计算中的基本问题。给定一个带有 $\\|H\\|\\le1$ 的哈密顿量 $H$ 和一个引导状态 $|\\psi\\rangle$，与 $H$ 的地面空间重叠至少 $\\gamma>0$，GSEE 中的目标是估计 $H$ 的基态能量到加性误差 $\\delta$，失败概率最大为 $\\varepsilon$，而在 GSP 中，它是准备一个地面空间权重至少为 $1-\\varepsilon$ 的状态，给定缺口下限$\\Delta$。它们的成本通过量子查询复杂性来衡量，即访问 $H$ 所需的预言机调用数量。最近的工作证明了时间演化和块编码模型中 GSEE 的最佳边界 $\\Theta(\\log(1/\\varepsilon)/(\\gamma\\delta))$ 和 GSP 的 $\\Theta(\\log(1/\\varepsilon)/(\\gamma\\Delta))$ 。然而，这些模型并不直接考虑 $H$ 的稀疏性，通过任何行或列中非零条目的最大数量 $s$ 来衡量。在稀疏访问模型中，预言机返回这些条目的位置和值。\n\n这引入了附加参数 $s$，并且查询复杂性如何共同取决于 $s$、$\\gamma$、$\\delta$ 或 $\\Delta$ 和 $\\varepsilon$ 仍处于开放状态。我们通过证明 GSEE 的稀疏查询下界 $\\Omega(\\sqrt{s}\\log(1/\\varepsilon)/(\\gamma\\delta))$ 和 GSP 的 $\\Omega(\\sqrt{s}\\log(1/\\varepsilon)/(\\gamma\\Delta))$ 来解决这个问题，即使对于随机哈密顿量也是如此。我们还表明，这些结构恢复了早期的时间演化和块编码下界缩放。然后，我们在可逆就地稀疏位置模型中给出匹配的上限算法。由此，我们得到 GSEE 的 $\\Theta(\\sqrt{s}\\log(1/\\varepsilon)/(\\gamma\\delta))$ 和 GSP 的 $\\Theta(\\sqrt{s}\\log(1/\\varepsilon)/(\\gamma\\Delta))$，表明 $\\sqrt{s}$ 是必要且充分的，完成了对所有问题参数的联合依赖。", "authors": [{"name": "Dhrumil Patel"}], "featured_authors": [{"name": "Dhrumil Patel"}], "author_count": 1}, {"id": "2611.23408", "category": "quant-ph", "title": "Qubit-qumode simulation of molecular torsion in photoisomerization", "abstract": "Photochemical reactions driven by large nuclear motion, such as the photoisomerization of retinal, depend strongly on both the global anharmonic forces of the potential and the periodic topology of molecular torsion. In this work, we develop a hybrid discrete (qubit) and continuous variable (qumode) quantum simulation framework for photochemical reactions that maps electronic states to qubits, vibrations to qumodes, and the periodic torsion to a compact qumode encoding. Applying this approach to the two-mode Hahn-Stock and three-mode PSB3 models of retinal photoisomerization, we compare i) local vibronic approximations, ii) the full trigonometric potential on the noncompact line, and iii) the same potential on the compact circle, which matches the molecular torsion topology. We numerically show that the topological description can significantly alter relevant observables. We realize the compact torsion via both a wrapped Gottesman-Kitaev-Preskill (GKP) encoding and a two-qumode circle encoding and introduce two methods that reduce the hardware resources of both encodings. Spreading an encoded coordinate over several qumodes lowers the average occupation number of each mode, and adding counterterms to the Hamiltonian reduces the required squeezing amount. We expect that these methods make percent-level simulations of the considered molecules promising targets for hybrid qubit-qumode hardware. For more complex molecules, each additional nuclear coordinate is represented directly as a single qumode or an encoded register using the same native operations, so the framework extends naturally to larger systems.", "url": "https://arxiv.org/abs/2611.23408", "type": "理论+数值", "summary": "由大核运动驱动的光化学反应，例如视网膜的光异构化，强烈依赖于势的全局非谐力和分子扭转的周期性拓扑。在这项工作中，我们开发了一种用于光化学反应的混合离散（量子位）和连续变量（qumode）量子模拟框架，将电子态映射到量子位，将振动映射到量子模式，并将周期扭转映射到紧凑的量子模式编码。将此方法应用于视网膜光异构化的二模 Hahn-Stock 和三模 PSB3 模型，我们比较了 i) 局部电子振动近似，ii) 非紧线上的完整三角势，以及 iii) 紧圆上的相同势，这与分子扭转拓扑相匹配。我们用数字表明拓扑描述可以显着改变相关的可观测值。我们通过包裹的 Gottesman-Kitaev-Preskill (GKP) 编码和双 qumode 圆编码实现紧凑扭转，并引入两种减少两种编码硬件资源的方法。\n\n将编码坐标分布在多个 qumode 上会降低每种模式的平均占用数，并且向哈密顿量添加反项会减少所需的压缩量。我们期望这些方法对所考虑的分子进行百分比水平的模拟，有望成为混合量子位-量子模式硬件的目标。对于更复杂的分子，每个附加的核坐标都使用相同的本机操作直接表示为单个 qumode 或编码寄存器，因此该框架自然地扩展到更大的系统。", "authors": [{"name": "Dimitrios Athanasakos"}, {"name": "Florian Hechenberger"}, {"name": "Tommaso Rainaldi"}, {"name": "Felix Ringer"}, {"name": "George Siopsis"}], "featured_authors": [{"name": "Dimitrios Athanasakos"}, {"name": "Florian Hechenberger"}, {"name": "Tommaso Rainaldi"}, {"name": "Felix Ringer"}, {"name": "George Siopsis"}], "author_count": 5}, {"id": "2611.23462", "category": "quant-ph", "title": "Quantum Monge-Kantorovich optimal transport in spacetime through spatiotemporal Kirkwood-Dirac distri
