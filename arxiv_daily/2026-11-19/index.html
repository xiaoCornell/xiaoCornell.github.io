  <style>

      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;

    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }

  <script>
    const papers = [{"id": "2611.23400", "category": "cond-mat", "title": "Nonlinear optical response with relaxation in the velocity gauge", "abstract": "We develop a framework for the evaluation of the nonlinear optical conductivity of electrons in crystals, driven by homogeneous optical fields, taking into account dissipation effects within the relaxation time approximation (RTA). The present formalism is based on Hamiltonians with minimal light-matter coupling within the velocity gauge, where the electric field is expressed in terms of a vector potential. The nonlinear conductivities are obtained by perturbatively solving the equation of motion for the single-particle reduced density matrix, which includes dissipative effects via the relaxation time approximation. We present a perturbative method to evaluate the reference equilibrium density matrix, towards which dissipation relaxes the system, which in the velocity gauge adiabatically follows the applied vector potential, and is also broadened by dissipative effects. Comparing with previous formulations based on the length gauge, the present approach has the benefit of avoiding the cumbersome evaluation of derivatives of Bloch states with respect to momentum. We test the presented method against length-gauge results, and calculate second- and third-order responses in a graphene-like tight-binding model with a staggered sublattice potential and a periodic modulation. We find that the relaxation time approximation gives results that deviate both quantitatively and qualitatively from the simple inclusion of an imaginary damping term in the frequencies, referred to as adiabatic switching. At equal relaxation parameter, the leading above-gap injection contribution differs by a factor of two; below the gap, the numerical results indicate a finite imaginary dc response in the small-relaxation limit of the relaxation-time calculation. These results show that adiabatic switching does not generally reproduce relaxation through the equation of motion, even in the small-relaxation limit.", "url": "https://arxiv.org/abs/2611.23400", "type": "理论+数值", "summary": "我们开发了一个框架，用于评估由均匀光场驱动的晶体中电子的非线性光学电导率，并考虑弛豫时间近似（RTA）内的耗散效应。目前的形式主义基于速度计内具有最小光-物质耦合的哈密顿量，其中电场以矢量势表示。非线性电导率是通过微扰求解单粒子约简密度矩阵的运动方程获得的，其中包括通过弛豫时间近似产生的耗散效应。我们提出了一种微扰方法来评估参考平衡密度矩阵，耗散使系统松弛，在速度计中绝热地遵循所施加的矢量势，并且也通过耗散效应而变宽。与之前基于长度规范的公式相比，本方法的优点是避免了布洛赫态关于动量的导数的繁琐评估。\n\n我们根据长度测量结果测试了所提出的方法，并计算具有交错亚晶格势和周期性调制的类石墨烯紧束缚模型中的二阶和三阶响应。我们发现，弛豫时间近似给出的结果在数量和质量上都偏离了在频率中简单包含虚数阻尼项（称为绝热切换）。在相同的弛豫参数下，领先的间隙上方注入贡献相差两倍；在间隙之下，数值结果表明在弛豫时间计算的小弛豫极限中存在有限虚数直流响应。这些结果表明，绝热切换通常不会通过运动方程再现弛豫，即使在小弛豫极限下也是如此。", "authors": [{"name": "Carlos M. Pedrosa"}, {"name": "João P. C. Ferreira"}, {"name": "João Pinho"}, {"name": "Yu. V. Bludov"}, {"name": "B. Amorim"}, {"name": "João M. Viana Parente Lopes"}], "featured_authors": [{"name": "Carlos M. Pedrosa"}, {"name": "João P. C. Ferreira"}, {"name": "João Pinho"}, {"name": "Yu. V. Bludov"}, {"name": "B. Amorim"}, {"name": "João M. Viana Parente Lopes"}], "author_count": 6}, {"id": "2611.23404", "category": "cond-mat", "title": "Real-Space Theory of Nonequilibrium Orbital Magnetization in Inhomogeneous Solids", "abstract": "We put forward a real-space linear-response theory of orbital magnetization induced by a dc electric field in bulk materials lacking translation invariance. Starting from the current response to a slowly varying electromagnetic field, we show that the linear-in-wavevector conductivity tensor of non-interacting electrons in terms of single-particle Green's functions and the velocity and position operators. This provides a gauge-invariant real-space formulation of the long-wavelength non-equilibrium orbital magnetization of both perfect crystals and disordered systems. In the translationally invariant limit, the formalism recovers the established Bloch picture of orbital magneto-electric effects. We implement the formalism using large-scale Chebyshev expansions and illustrate its capabilities on a Haldane model in the presence of spatially uncorrelated disorder.", "url": "https://arxiv.org/abs/2611.23404", "type": "理论", "summary": "我们提出了一种由直流电场在缺乏平移不变性的块体材料中引起的轨道磁化强度的实空间线性响应理论。从电流对缓慢变化的电磁场的响应开始，我们根据单粒子格林函数以及速度和位置算子证明了非相互作用电子的线性波矢量电导率张量。这提供了完美晶体和无序系统的长波长非平衡轨道磁化强度的规范不变的实空间公式。在平移不变极限下，形式主义恢复了轨道磁电效应的布洛赫图。我们使用大规模切比雪夫展开来实现形式主义，并在存在空间不相关无序的情况下在 Haldane 模型上说明其功能。", "authors": [{"name": "João M. Alendouro Pinho"}, {"name": "Henrique P. Veiga"}, {"name": "Alessandro Veneri"}, {"name": "Daniel Passos"}, {"name": "Ivo Souza"}, {"name": "Bruno Amorim"}, {"name": "João M. Viana Parente Lopes"}, {"name": "Aires Ferreira"}], "featured_authors": [{"name": "João M. Alendouro Pinho"}, {"name": "Henrique P. Veiga"}, {"name": "Alessandro Veneri"}, {"name": "Bruno Amorim"}, {"name": "João M. Viana Parente Lopes"}, {"name": "Aires Ferreira"}], "author_count": 8}, {"id": "2611.23409", "category": "cond-mat", "title": "Analytical Interacting Tight-binding Model for Fractional Chern Insulators", "abstract": "We construct a two-dimensional 2-band tight-binding model with two-body interactions and without magnetic lattice translation, in which both the hopping and interaction are exponentially local (with Gaussian decay) in real space. The interaction is built from pair annihilation operators whose coefficients are hopping amplitudes divided by positive powers of relative distance. Without any band projection, the ground states at $1/3$ filling are exactly fractional Chern insulator (FCI) states (and thus have nonzero gap) for any finite lattice size with any periodic/twist boundary conditions. The FCI ground states are analogous to the discretized version of the Laughlin-like states in the continuum Chern-ideal band, though our FCI states do not require the onsite spinor structure that is necessary in the continuum. We further show analytically that, after adding one unit cell while keeping electron number fixed, the anyonic one-quasihole states are zero-energy ground states of the full Hamiltonian for any finite system size and any quasihole position, analogous to Laughlin quasiholes under the Haldane $V_1$ pseudopotential. Numerical evidence is provided for the possible nonzero gap of the FCI states at $1/3$ filling in the thermodynamic limit, when interaction strength is much smaller than the single-particle band gap.", "url": "https://arxiv.org/abs/2611.23409", "type": "理论+数值", "summary": "我们构建了一个具有二体相互作用且没有磁晶格平移的二维 2 能带紧束缚模型，其中跳跃和相互作用在真实空间中都是指数局部的（具有高斯衰减）。相互作用是由成对湮灭算子构建的，其系数是跳跃幅度除以相对距离的正幂。在没有任何能带投影的情况下，对于具有任何周期/扭曲边界条件的任何有限晶格尺寸，$1/3$ 填充处的基态恰好是分数陈绝缘体 (FCI) 状态（因此具有非零间隙）。 FCI 基态类似于连续统陈理想带中类 Laughlin 态的离散版本，尽管我们的 FCI 态不需要连续统中必需的现场旋量结构。我们进一步分析表明，在保持电子数固定的情况下添加一个晶胞后，对于任何有限系统尺寸和任何准空穴位置，任意子一准空穴态都是完整哈密顿量的零能量基态，类似于 Haldane $V_1$ 赝势下的 Laughlin 准空穴。\n\n当相互作用强度远小于单粒子带隙时，提供了数值证据，证明 FCI 态在 $1/3$ 处可能存在非零带隙，填充了热力学极限。", "authors": [{"name": "Lexu Zhao"}, {"name": "Jayden S. Chang"}, {"name": "Awwab A. Azam"}, {"name": "Jiabin Yu"}], "featured_authors": [{"name": "Lexu Zhao"}, {"name": "Jayden S. Chang"}, {"name": "Awwab A. Azam"}, {"name": "Jiabin Yu"}], "author_count": 4}, {"id": "2611.23535", "category": "cond-mat", "title": "Application of Pretrained Universal Machine Learning Force-Fields for Phase Transitions Prediction in ZrO2", "abstract": "Pretrained universal machine-learning force fields can reduce the cost of finite-temperature molecular dynamics relative to density functional theory. However, most benchmarks test only static properties and do not assess whether these models reproduce the correct phase-transition sequence. Here, we benchmark ten open-source universal machine-learning force fields for zirconia (ZrO$_2$) using phonon dispersion calculations and variable-cell isothermal-isobaric molecular dynamics. Zirconia is a useful test because it has three thermodynamically stable crystalline phases prior to melting, following the sequence monoclinic-tetragonal-cubic. Four models reproduce this sequence: 7net-l3i5, MatterSim-v1.0.0-1M, MACE-mpa, and MACE-D3. Models with orthorhombic-tetragonal energy errors above about 10 meV/atom (7net-0, CHGNet, and MACE) instead produce an orthorhombic intermediate and predict monoclinic-orthorhombic-tetragonal-cubic-liquid upon heating. ORB-based models fail to sustain stable variable-cell dynamics because their phonon frequencies are compressed by 30-60% relative to the density functional theory reference. Across all ten models, two ground-state diagnostics predict finite-temperature behavior. Relative polymorph energetics should agree with the matched density functional theory reference within about 6 meV/atom, and the phonon spectrum should not show systematic softening. These diagnostics are practical screening metrics for assessing pretrained force fields for phase-transition predictions.", "url": "https://arxiv.org/abs/2611.23535", "type": "理论+数值", "summary": "相对于密度泛函理论，预训练的通用机器学习力场可以降低有限温度分子动力学的成本。然而，大多数基准测试仅测试静态属性，并且不评估这些模型是否再现了正确的相变序列。在这里，我们使用声子色散计算和可变单元等温等压分子动力学对氧化锆 (ZrO$_2$) 的十个开源通用机器学习力场进行基准测试。氧化锆是一种有用的测试，因为它在熔化前具有三个热力学稳定的结晶相，遵循单斜晶系-四方晶系-立方晶系的顺序。四个模型重现了此序列：7net-l3i5、MatterSim-v1.0.0-1M、MACE-mpa 和 MACE-D3。正交四方能量误差高于约 10 meV/原子的模型（7net-0、CHGNet 和 MACE）反而会产生正交中间体，并预测加热后单斜方四方立方液体。基于 ORB 的模型无法维持稳定的可变晶胞动力学，因为它们的声子频率相对于密度泛函理论参考压缩了 30-60%。\n\n在所有十个模型中，两种基态诊断预测有限温度行为。相对多晶型能量学应与匹配的密度泛函理论参考一致在约 6 meV/原子内，并且声子谱不应显示系统软化。这些诊断是评估相变预测的预训练力场的实用筛选指标。", "authors": [{"name": "Rajan Khadka"}, {"name": "Axel van de Walle"}, {"name": "Patrick Tepesch"}], "featured_authors": [{"name": "Rajan Khadka"}, {"name": "Axel van de Walle"}, {"name": "Patrick Tepesch"}], "author_count": 3}, {"id": "2611.23586", "category": "cond-mat", "title": "Topological signatures of criticality: the Ising case", "abstract": "Topological properties of microscopic configurations may provide additional insight into phase transitions beyond conventional thermodynamic observables. We investigate this idea in the two-dimensional Ising model on square and triangular lattices by associating cell complexes with the positive and negative spin domains and constructing an Euler-characteristic observable from their difference. We provide the expression relating this quantity to conventional observables of the Ising model. This derivation allows us to understand its expected behavior physically. As a byproduct, we show that at any finite positive temperature the expectation of the Euler characteristic exceeds a positive, lattice-size-independent bound, hence disproving a previously suggested conjecture. Monte Carlo simulations combined with multihistogram reweighting show that this spin-odd topological observable exhibits order-parameter-like behavior near the ferromagnetic transition. Finite-size scaling of its susceptibility yields pseudocritical temperatures that converge to the known critical temperature for both lattice geometries. On the square lattice, the leading-order estimate of the critical exponent obtained from the topological observable depends more strongly on the fitting range than the magnetization estimate. This behavior is consistent with stronger subleading finite-size corrections, as supported by fits including an additional correction term. On the triangular lattice, the corresponding estimate remains consistent with the theoretical Ising value. Our study suggests that topologically defined quantities such as the Euler characteristic can provide an alternative way to locate order-disorder phase transitions in the systems considered here. Since the definition of these observables is purely geometrical, they can provide useful insights in cases in which order parameters cannot be constructed.", "url": "https://arxiv.org/abs/2611.23586", "type": "理论+数值", "summary": "微观结构的拓扑性质可以为传统热力学可观测值之外的相变提供额外的见解。我们通过将细胞复合体与正自旋域和负自旋域相关联，并根据它们的差异构建欧拉特征可观测量，在方形和三角形晶格的二维伊辛模型中研究了这一想法。我们提供了将该量与伊辛模型的常规可观测量相关的表达式。这种推导使我们能够从物理上理解其预期行为。作为副产品，我们表明在任何有限的正温度下，欧拉特征的期望超过了与晶格尺寸无关的正界限，因此反驳了之前提出的猜想。蒙特卡洛模拟与多直方图重新加权相结合表明，这种自旋奇数拓扑可观测量在铁磁转变附近表现出类似有序参数的行为。其磁化率的有限尺寸缩放产生伪临界温度，该温度收敛到两种晶格几何形状的已知临界温度。\n\n在方晶格上，从拓扑可观测量获得的临界指数的前序估计比磁化强度估计更依赖于拟合范围。此行为与更强的次领先有限尺寸校正一致，如包含附加校正项的拟合所支持。在三角晶格上，相应的估计与理论 Ising 值保持一致。我们的研究表明，拓扑定义的量（例如欧拉特征）可以提供另一种方法来定位此处考虑的系统中的有序-无序相变。由于这些可观测量的定义纯粹是几何的，因此它们可以在无法构造顺序参数的情况下提供有用的见解。", "authors": [{"name": "Tak-Shing Chan"}, {"name": "Paweł Dłotko"}, {"name": "Jacek Gulgowski"}, {"name": "Biagio Lucini"}, {"name": "Mateusz Masłowski"}, {"name": "Davide Vadacchino"}], "featured_authors": [{"name": "Tak-Shing Chan"}, {"name": "Paweł Dłotko"}, {"name": "Jacek Gulgowski"}, {"name": "Biagio Lucini"}, {"name": "Mateusz Masłowski"}, {"name": "Davide Vadacchino"}], "author_count": 6}, {"id": "2611.23595", "category": "cond-mat", "title": "Layer-dependent $s^{\\pm}$ superconducting pairing and influence of incipient bands in La$_3$Ni$_2$O$_7$ thin films on real LaSrAlO$_4$ substrate", "abstract": "Motivated by recent advances in ambient-pressure superconducting La$_3$Ni$_2$O$_7$ (LNO) thin films, we theoretically investigate these films by explicitly incorporating the realistic LaSrAlO$_4$ (LSAO) substrate. The Fermi-surface topology of the nickelate thin film closely resembles that of the high-pressure bulk phase, with similar $\\alpha$ and $\\beta$ sheets and a small hole-like $\\gamma$ pocket originating from the surface bilayer (BL3). The bonding $d_{3z^2-r^2}$ state of the interfacial bilayer (BL1, adjacent to the LSAO substrate) lies only $\\sim 5$ meV below the Fermi level, giving rise to an incipient $\\gamma$ band, while for the middle bilayer (BL2) its energy is much lower ($\\sim 95$ meV). Remarkably, no significant spontaneous charge transfer from the LSAO substrate to the LNO film is found. Instead, {\\it symmetry-allowed charge disproportionation} occurs between the BLs, with hole doping in BL3 and electron doping in BL1 and BL2. Via the weak-coupling Random Phase Approximation, we find a strong $s^{\\pm}$-wave superconducting pairing instability in BL3, while $d_{x^2-y^2}$ and $s^{\\pm}$ are nearly degenerate in the other bilayers BL1 and BL2. Including the incipient $\\gamma$ band via the Dynamical Cluster Approximation beyond weak coupling, robust $s^{\\pm}$-wave pairing is observed in all three layers", "url": "https://arxiv.org/abs/2611.23595", "type": "理论", "summary": "受环境压力超导 La$_3$Ni$_2$O$_7$ (LNO) 薄膜最新进展的推动，我们通过明确结合现实的 LaSrAlO$_4$ (LSAO) 基板从理论上研究这些薄膜。镍酸盐薄膜的费米表面拓扑结构与高压体相的费米表面拓扑结构非常相似，具有相似的 $\\alpha$ 和 $\\beta$ 片层以及源自表面双层 (BL3) 的小孔状 $\\gamma$ 袋。界面双层（BL1，邻近 LSAO 基底）的键合 $d_{3z^2-r^2}$ 态仅位于费米能级以下 $\\sim 5$ meV，产生了一个初始 $\\gamma$ 能带，而对于中间双层 (BL2)，其能量要低得多 ($\\sim 95$ meV)。值得注意的是，没有发现从 LSAO 基底到 LNO 薄膜的明显自发电荷转移。相反，{\\it 对称允许的电荷歧化}发生在 BL 之间，其中 BL3 中掺杂空穴，BL1 和 BL2 中掺杂电子。通过弱耦合随机相位近似，我们发现 BL3 中存在强 $s^{\\pm}$ 波超导配对不稳定性，而 $d_{x^2-y^2}$ 和 $s^{\\pm}$ 在其他双层 BL1 和 BL2 中几乎退化。\n\n通过弱耦合之外的动态簇近似包括初始的 $\\gamma$ 频带，在所有三层中都观察到稳健的 $s^{\\pm}$ 波配对", "authors": [{"name": "Yang Zhang"}, {"name": "Philip M. Dee"}, {"name": "Ling-Fang Lin"}, {"name": "Adriana Moreo"}, {"name": "Thomas A. Maier"}, {"name": "Elbio Dagotto"}], "featured_authors": [{"name": "Yang Zhang"}, {"name": "Philip M. Dee"}, {"name": "Ling-Fang Lin"}, {"name": "Adriana Moreo"}, {"name": "Thomas A. Maier"}, {"name": "Elbio Dagotto"}], "author_count": 6}, {"id": "2611.23605", "category": "cond-mat", "title": "Persistent Hydration and Ionic Mobility: When the Ion Is Not the Only Transported Species", "abstract": "Small-ion transport in water remains only partially understood despite more than a century of theoretical work. The difficulty is especially acute for strongly hydrated ions such as Li$^{+}$, Mg$^{2+}$, and Ca$^{2+}$, whose first hydration shells can persist on timescales comparable to or longer than translational motion. We develop a molecular framework in which the ion, its first hydration shell, and the outer solvent are treated as dynamically coupled components. Local hydration structure and exchange are represented through a potential of mean force and coordination dynamics, while collective solvent response is described through molecular memory functions. The theory clarifies why hydration cannot generally be represented by an additive friction or a single enlarged radius, and provides a route beyond conventional continuum and molecular descriptions.", "url": "https://arxiv.org/abs/2611.23605", "type": "理论", "summary": "尽管进行了一个多世纪的理论工作，但对水中小离子传输的了解仍然只有部分。对于 Li$^{+}$、Mg$^{2+}$ 和 Ca$^{2+}$ 等强水合离子来说，困难尤其严重，它们的第一个水合壳层可以在与平移运动相当或更长的时间尺度上持续存在。我们开发了一种分子框架，其中离子、其第一个水合壳和外部溶剂被视为动态耦合组件。局部水合结构和交换通过平均力和配位动力学的潜力来表示，而集体溶剂响应通过分子记忆功能来描述。该理论阐明了为什么水合作用通常不能用附加摩擦力或单个放大半径来表示，并提供了一条超越传统连续体和分子描述的途径。", "authors": [{"name": "Biman Bagchi"}], "featured_authors": [{"name": "Biman Bagchi"}], "author_count": 1}, {"id": "2611.23635", "category": "cond-mat", "title": "Kinetic theory of dry granular particles under simple shear: steady flows and relaxation dynamics", "abstract": "We develop a kinetic theory for dry granular particles under simple shear flow using the Enskog approximation combined with Grad's moment method for moderately dense granular gases with the volume fraction $\\varphi\\le 0.5$. The collisional moments and stresses are expressed in terms of generalized hypergeometric functions, retaining all orders in the dimensionless shear-rate parameter within the adopted Grad closure. Within this framework, we derive a complete set of equations governing the kinetic stress and the collisional contribution to the stress tensor. The steady-state solutions reproduce the shear viscosity over a broad parameter range and improve the predictions of the kinetic temperature relative to the anisotropic Gaussian theory at the parameter values examined. Temperature still shows appreciable deviations under strongly inelastic conditions. Additionally, the theory captures the overall trends of the normal stress differences, while their quantitative accuracy depends on density and restitution coefficient. We further examine relaxation following an instantaneous reduction in $\\varphi$ from $0.35$ to $0.20$ at a restitution coefficient of $0.90$. The theory reproduces the temperature and viscosity relaxation for this protocol.", "url": "https://arxiv.org/abs/2611.23635", "type": "理论", "summary": "我们使用 Enskog 近似结合 Grad 矩方法，针对体积分数 $\\varphi\\le 0.5$ 的中等密度颗粒气体，开发了简单剪切流下干燥颗粒的动力学理论。碰撞力矩和应力以广义超几何函数的形式表示，在采用的 Grad 闭包内保留无量纲剪切率参数的所有阶数。在这个框架内，我们推导了一套完整的方程来控制动应力和碰撞对应力张量的贡献。稳态解在较宽的参数范围内再现了剪切粘度，并在所检查的参数值下改进了相对于各向异性高斯理论的动力学温度的预测。在强非弹性条件下，温度仍然表现出明显的偏差。此外，该理论捕捉了正应力差的总体趋势，而其定量精度取决于密度和恢复系数。我们进一步检查 $\\varphi$ 从 $0.35$ 瞬时减少到 $0.20$，恢复系数为 $0.90$ 后的松弛情况。\n\n该理论重现了该协议的温度和粘度松弛。", "authors": [{"name": "Shunsuke Iizuka"}, {"name": "Satoshi Takada"}, {"name": "Hisao Hayakawa"}], "featured_authors": [{"name": "Shunsuke Iizuka"}, {"name": "Satoshi Takada"}, {"name": "Hisao Hayakawa"}], "author_count": 3}, {"id": "2611.23790", "category": "cond-mat", "title": "Finite-time stochastic resetting in bounded domains: competing targets, energetic cost, and optimal search strategies", "abstract": "We investigate the first-passage dynamics and energetic cost of a Brownian particle subject to finite-time stochastic resetting in a bounded one-dimensional domain with two absorbing boundaries. Unlike conventional instantaneous resetting, the particle is returned to a prescribed resetting position through a finite-duration process driven by a linear trapping potential. By solving the corresponding backward equations, we derive analytical expressions for the mean global first-passage time and the splitting probabilities. Our results show that the finite duration of the return process can substantially modify the dependence of the mean global first-passage time on the resetting rate. In particular, we identify a critical trapping strength above which resetting can accelerate the search process, and characterize how the range of favorable resetting positions depends on the trapping strength. We further characterize the energetic cost of resetting by deriving the generating function of the total work and obtaining an analytical expression for its mean value. For the linear trapping potential considered here, we establish an exact relation between the mean total work and the mean cumulative return time. This relation allows us to establish a quantitative trade-off between the mean global first-passage time and the energetic expenditure, revealing how the finite duration of the return process affects search efficiency. Brownian dynamics simulations confirm our theoretical predictions.", "url": "https://arxiv.org/abs/2611.23790", "type": "理论+数值", "summary": "我们研究了在具有两个吸收边界的有界一维域中受到有限时间随机重置的布朗粒子的第一通道动力学和能量成本。与传统的瞬时重置不同，粒子通过线性捕获势驱动的有限持续时间过程返回到规定的重置位置。通过求解相应的后向方程，我们推导了平均全局首次通过时间和分裂概率的解析表达式。我们的结果表明，返回过程的有限持续时间可以显着改变平均全局首次通过时间对重置率的依赖性。特别是，我们确定了一个临界捕获强度，高于该强度的重置可以加速搜索过程，并描述了有利重置位置的范围如何取决于捕获强度。我们通过推导总功的生成函数并获得其平均值的解析表达式来进一步表征重置的能量成本。\n\n对于这里考虑的线性捕获势，我们在平均总功和平均累积返回时间之间建立了精确的关系。这种关系使我们能够在平均全局首次通过时间和能量消耗之间建立定量权衡，揭示返回过程的有限持续时间如何影响搜索效率。布朗动力学模拟证实了我们的理论预测。", "authors": [{"name": "Hanshuang Chen"}, {"name": "Chongyao Tang"}, {"name": "Guofeng Li"}], "featured_authors": [{"name": "Hanshuang Chen"}, {"name": "Chongyao Tang"}, {"name": "Guofeng Li"}], "author_count": 3}, {"id": "2611.23796", "category": "cond-mat", "title": "Critical--localized reentry under periodic spacer control", "abstract": "Tracking a fixed fraction of a quasiperiodic spectrum tests whether repeated critical--localized alternation extends over a nonzero spectral weight. We find such alternation in a matched-dimer chain by varying only the spacer on-site energies and following a fixed interval of integrated-density-of-states (IDS) labels. An exact Bloch-determinant identity links the physical transfer discriminant to the bands of a periodic reference operator. For the golden cell frequency, we prove that, on a common full-measure set of phases and for every finite value of the spacer control, the physical spectrum in the open reference bands is critical, with purely singular-continuous spectrum and zero Lyapunov exponent, while the spectrum strictly outside the bands is pure point, with exponentially decaying eigenfunctions. Validated IDS bounds certify repeated critical--localized alternation of the same fixed spectral fraction at successive spacer controls. Spacer shifts move the physical levels and reference-band edges at different rates, allowing us to reshape finite-chain return windows and place their endpoints at prescribed controls. An affine recalibration relocates the control family exactly.", "url": "https://arxiv.org/abs/2611.23796", "type": "理论", "summary": "跟踪准周期频谱的固定部分可以测试重复的临界局部交替是否延伸到非零频谱权重。我们通过仅改变间隔基的现场能量并遵循积分状态密度（IDS）标签的固定间隔，在匹配的二聚体链中发现了这种交替。精确的布洛赫行列式恒等式将物理传输判别式与周期性参考算子的频带联系起来。对于黄金单元频率，我们证明，在公共的全测量相位集上，对于间隔控制的每个有限值，开放参考带中的物理频谱是关键的，具有纯奇异连续频谱和零李雅普诺夫指数，而严格带外的频谱是纯点，具有指数衰减的本征函数。经验证的 IDS 范围可证明在连续的间隔控制中相同固定光谱分数的重复关键局部交替。间隔移位以不同的速率移动物理水平和参考带边缘，使我们能够重塑有限链返回窗口并将其端点放置在规定的控制处。仿射重新校准可以准确地重新定位控制族。", "authors": [{"name": "Xin Wang"}, {"name": "Pei-Jie Chang"}, {"name": "Dong Ruan"}, {"name": "Gui-Lu Long"}], "featured_authors": [{"name": "Xin Wang"}, {"name": "Pei-Jie Chang"}, {"name": "Dong Ruan"}, {"name": "Gui-Lu Long"}], "author_count": 4}, {"id": "2611.23837", "category": "cond-mat", "title": "Materials representations organize transferable supervision for chemical extrapolation", "abstract": "Materials discovery often requires chemical extrapolation beyond labeled data. When target compounds contain elements absent from training, which compounds of other elements provide transferable supervision remains unclear. Here we show that, without target-property labels, materials representations rank other elements by the supervision their compounds provide. Engineered descriptors rank them largely by elemental-property similarity, whereas a pretrained crystal-graph encoder ranks them by the geometry of its learned representation. At fixed training-set size, excluding the compounds of the encoder's six top-ranked elements raises formation-energy and bandgap errors by 100-110 meV per atom and 42-85 meV, versus little change for six lower-ranked elements. The rankings hold across properties, regressors and datasets. The encoder's ranking outperforms elemental-property similarity and periodic groups, suggesting that it captures how elements behave within compounds. Materials representations thus organize transferable supervision, which can be identified before model training, informing dataset assessment and label acquisition.", "url": "https://arxiv.org/abs/2611.23837", "type": "理论", "summary": "材料发现通常需要超出标记数据的化学外推。当目标化合物含有训练中缺少的元素时，其他元素的哪些化合物提供可转移的监督仍不清楚。在这里，我们表明，在没有目标属性标签的情况下，材料表示通过其化合物提供的监督对其他元素进行排序。工程描述符主要根据元素属性相似性对它们进行排序，而预训练的晶体图编码器则根据其学习表示的几何形状对它们进行排序。在固定的训练集大小下，排除编码器的六个排名靠前的元素的化合物会使形成能量和带隙误差增加每个原子 100-110 meV 和 42-85 meV，而六个排名较低的元素几乎没有变化。该排名适用于属性、回归量和数据集。编码器的排名优于元素属性相似性和周期组，这表明它捕获了元素在化合物内的行为方式。因此，材料表示组织可转移的监督，可以在模型训练之前进行识别，为数据集评估和标签获取提供信息。", "authors": [{"name": "Enda Xiao"}, {"name": "Terumasa Tadano"}], "featured_authors": [{"name": "Enda Xiao"}, {"name": "Terumasa Tadano"}], "author_count": 2}, {"id": "2611.23842", "category": "cond-mat", "title": "Implementation of LDA+Gutzwiller with Newton's method", "abstract": "In order to calculate the electronic structure of correlated materials, we propose implementation of the LDA+Gutzwiller method with Newton's method. The self-consistence process, efficiency and convergence of calculation are improved dramatically by using Newton's method with golden section search and other improvement approaches. We compare the calculated results by applying the previous linear mix method and Newton's method. We have applied our code to study the electronic structure of several typical strong correlated materials, including SrVO$_3$, LaCoO$_3$, and La$_2$O$_3$Fe$_2$Se$_2$. Our results fit quite well with the previous studies.", "url": "https://arxiv.org/abs/2611.23842", "type": "数值", "summary": "为了计算相关材料的电子结构，我们提出用牛顿法实现LDA+Gutzwiller方法。采用牛顿法结合黄金分割搜索等改进方法，极大地提高了计算的自洽过程、效率和收敛性。我们比较了应用之前的线性混合方法和牛顿方法的计算结果。我们应用我们的代码研究了几种典型的强相关材料的电子结构，包括SrVO$_3$、LaCoO$_3$和La$_2$O$_3$Fe$_2$Se$_2$。我们的结果与之前的研究非常吻合。", "authors": [{"name": "Jian Zhang"}, {"name": "Ming-Feng Tian"}, {"name": "Guang-Xi Jin"}, {"name": "Yuan-Feng Xu"}, {"name": "Xi Dai"}], "featured_authors": [{"name": "Jian Zhang"}, {"name": "Ming-Feng Tian"}, {"name": "Guang-Xi Jin"}, {"name": "Yuan-Feng Xu"}, {"name": "Xi Dai"}], "author_count": 5}, {"id": "2611.23882", "category": "cond-mat", "title": "Local spin constraints and symmetry in single-$Q$ spiral magnets", "abstract": "The Luttinger--Tisza (LT) method provides a lower bound on the energy of classical spin models but relaxes the local spin-length constraints. For a generic incommensurate single-$Q$ spiral, fixed spin length requires circular polarization on every magnetic sublattice, a condition not guaranteed by equal sublattice weights in the lowest LT eigenmode. We develop a constrained formulation for general bilinear classical spin Hamiltonians with one or two magnetic sublattices. For one sublattice, minimization reduces to a secular equation for the spiral-plane normal. For two sublattices, exact elimination of the relative phase gives a frame-independent energy on the space of two unit normals. We derive symmetry constraints by distinguishing operations that preserve or reverse the Fourier arm and those that preserve or exchange sublattices. For a model with symmetric anisotropy, numerical optimization over both spiral-plane normals yields a lower energy than either constrained pure exchange-sector state, despite the block diagonalization of the linear Hamiltonian. A separate anisotropic two-sublattice benchmark demonstrates that enforcing local circularity can shift the preferred ordering wave vector even when the lowest LT eigenmode has equal sublattice weights.", "url": "https://arxiv.org/abs/2611.23882", "type": "理论+数值", "summary": "Luttinger-Tisza (LT) 方法提供了经典自旋模型能量的下限，但放宽了局部自旋长度约束。对于一般的不相称单 $Q$ 螺旋，固定自旋长度需要每个磁性子晶格上都有圆极化，而最低 LT 本征模中的相等子晶格权重不能保证这一条件。我们为具有一个或两个磁性子晶格的一般双线性经典自旋哈密顿量开发了一种约束公式。对于一个子晶格，最小化可简化为螺旋平面法线的长期方程。对于两个子晶格，精确消除相对相位会在两个单位法线的空间上给出与框架无关的能量。我们通过区分保留或反转傅立叶臂的操作和保留或交换子晶格的操作来导出对称约束。对于具有对称各向异性的模型，尽管线性哈密顿量是块对角化的，但两个螺旋平面法线的数值优化产生的能量比任一受约束的纯交换扇区状态都要低。\n\n单独的各向异性双子晶格基准表明，即使最低 LT 本征模具有相等的子晶格权重，强制局部圆性也可以改变首选有序波矢量。", "authors": [{"name": "Lasin Thaivalappil"}, {"name": "Shin-Ming Huang"}], "featured_authors": [{"name": "Lasin Thaivalappil"}, {"name": "Shin-Ming Huang"}], "author_count": 2}, {"id": "2611.23918", "category": "cond-mat", "title": "Molecular Kondo Ball Based on an Endohedral Fullerene", "abstract": "We theoretically predict a molecular Kondo ball in TiSc$_2$N@C$_{80}$/Al(111), where a Ti-centered $S = 1/2$ local moment is encapsulated within a closed fullerene $\\pi$ cage that serves as an itinerant-like electronic reservoir for Kondo screening. First-principles calculations show that intermediate molecule--substrate hybridization broadens the discrete C$_{80}$ molecular levels into itinerant-like electronic states while preserving the Ti local moment, with similar electronic conditions found for Cd(0001) and In(101).Hierarchical equations of motion (HEOM) simulations reveal a temperature-dependent Fano resonance with a Kondo temperature of about 60 this http URL key electronic characteristics underlying the Kondo state remain robust against adsorption orientation, demonstrating that the closed cage geometry provides an orientation-tolerant molecular architecture for Kondo screening.", "url": "https://arxiv.org/abs/2611.23918", "type": "理论+数值", "summary": "我们从理论上预测了 TiSc$_2$N@C$_{80}$/Al(111) 中的近藤分子球，其中以 Ti 为中心的 $S = 1/2$ 局部矩被封装在封闭的富勒烯 $\\pi$ 笼内，该笼充当用于近藤筛选的类似巡回电子库。第一性原理计算表明，中间分子-基质杂化将离散的 C$_{80}$ 分子能级拓宽为类似巡回的电子态，同时保留 Ti 局域矩，Cd(0001) 和 In(101) 具有类似的电子条件。分层运动方程 (HEOM) 模拟揭示了温度依赖性 Fano 共振，Kondo 温度约为 60 该 http URL 近藤态下的关键电子特征对吸附仍然具有鲁棒性方向，证明封闭的笼式几何形状为近藤筛选提供了一种耐方向的分子结构。", "authors": [{"name": "Xiangyang Li"}, {"name": "Xiao Zheng"}, {"name": "Bing Wang"}, {"name": "Jinlong Yang"}], "featured_authors": [{"name": "Xiangyang Li"}, {"name": "Xiao Zheng"}, {"name": "Bing Wang"}, {"name": "Jinlong Yang"}], "author_count": 4}, {"id": "2611.23960", "category": "cond-mat", "title": "Blanket theory for dense networks", "abstract": "We show how Blanket theory provides a constructive method for calculating cavity functionals in dense spin networks. Building on the description through interfaces and magnetization shells, we develop the calculation from the low-temperature fluctuations around the ground state. In this regime, dilute defects reveal the mechanism of random energy model (REM) universality for linear energies, while their sharing and renewal across layers organize the energies and Gibbs weights into a hierarchy. Because the same configurations determine the covariances of the fresh cavity fields, this construction identifies the fields and weights with an Aizenman-Sims-Starr random overlap structure. The cavity contributions can then be evaluated through recursive fractional means, yielding an explicit free-energy functional parametrized by layer magnetizations and hierarchical exponents, with coefficients determined by the interaction variances and the network normalization. Under the stated moment and normalization conditions, comparison of pressures transfers the limiting mean pressure from the Gaussian representative to networks with independent centered non-Gaussian couplings having the same variances. We illustrate the method with the deterministic Curie-Weiss model, recover the Parisi functional for the Sherrington-Kirkpatrick model, and derive the functionals for restricted and deep Boltzmann machines, including the full replica symmetry breaking (fullRSB) limit.", "url": "https://arxiv.org/abs/2611.23960", "type": "理论+数值", "summary": "我们展示了毯子理论如何提供一种计算密集自旋网络中的空腔泛函的建设性方法。基于界面和磁化壳的描述，我们根据基态周围的低温波动进行了计算。在这种情况下，稀释缺陷揭示了线性能量的随机能量模型（REM）普遍性的机制，而它们跨层的共享和更新将能量和吉布斯权重组织成一个层次结构。由于相同的配置决定了新鲜空腔场的协方差，因此该结构使用 Aizenman-Sims-Starr 随机重叠结构来识别场和权重。然后可以通过递归分数均值来评估空腔贡献，产生由层磁化强度和分层指数参数化的显式自由能函数，其系数由相互作用方差和网络归一化确定。\n\n在规定的力矩和归一化条件下，压力比较将极限平均压力从高斯代表转移到具有相同方差的独立中心非高斯耦合的网络。我们用确定性 Curie-Weiss 模型说明该方法，恢复 Sherrington-Kirkpatrick 模型的 Parisi 泛函，并导出受限玻尔兹曼机和深度玻尔兹曼机的泛函，包括完全复制对称破缺 (fullRSB) 极限。", "authors": [{"name": "Simone Franchini"}], "featured_authors": [{"name": "Simone Franchini"}], "author_count": 1}, {"id": "2611.24024", "category": "cond-mat", "title": "Geometric Decomposition of Entropy Production Based on General $f$-Divergences", "abstract": "We construct a general class of excess--housekeeping decompositions of entropy production based on $f$-divergences for overdamped Langevin systems. The excess entropy production rate equals the relaxation rate of the $f$-divergence toward a relaxation target and also admits an optimal-transport representation, while the housekeeping velocity preserves the same relaxation target. Our framework recovers the Hatano--Sasa and Maes--Neto{č}n{ý} decompositions as special cases, and unifies their relaxational and optimal-transport aspects within a common structure. Moreover, our framework yields physically meaningful decompositions beyond these two by taking a desired distribution as the relaxation target.", "url": "https://arxiv.org/abs/2611.24024", "type": "理论", "summary": "我们基于过阻尼朗之万系统的 $f$ 散度构建了一类一般的超额-熵产生的内务分解。过剩熵产生率等于 $f$ 散度向松弛目标的松弛率，并且还允许最优传输表示，而内务速度保持相同的松弛目标。我们的框架将 Hatano--Sasa 和 Maes--Neto{č}n{ý} 分解恢复为特殊情况，并将它们的松弛和最优传输方面统一在一个共同的结构中。此外，我们的框架通过将期望的分布作为松弛目标，产生了超出这两者的物理上有意义的分解。", "authors": [{"name": "Rihito Nagase"}, {"name": "Shoki Sugimoto"}, {"name": "Takahiro Sagawa"}], "featured_authors": [{"name": "Rihito Nagase"}, {"name": "Shoki Sugimoto"}, {"name": "Takahiro Sagawa"}], "author_count": 3}, {"id": "2611.24045", "category": "cond-mat", "title": "Two-Color Coherent Control of the Spin Photovoltaic Effect in Centrosymmetric Crystals", "abstract": "Spatial inversion forbids the conventional electric-dipole second-order bulk charge and spin photovoltaic responses in centrosymmetric crystals. Here we show that a phase-coherent two-color field at frequencies $\\omega$ and $2\\omega$ can generate symmetry-selected charge and spin photocurrents through an inversion-even third-order dc response. More importantly, the polarization direction and relative phase of the two-color field provide direct control over the current direction and can isolate transport channels in which the charge current vanishes while a finite spin current remains. A systematic symmetry analysis of centrosymmetric magnetic point groups and collinear antiferromagnetic spin point groups shows that pure-spin channels are allowed in a broad class of such systems under appropriate two-color driving. Furthermore, the relative optical phase governs both the magnitude and sign of the response. Our calculations on inversion-stacked bilayer 2H-MoS$_2$ and a centrosymmetric collinear altermagnet demonstrate resonantly enhanced, phase-tunable spin photocurrents in these complementary systems with strong and weak spin-orbit coupling, respectively. Our results establish the polarization direction and phase of coherent two-color light as active control parameters for spin transport in centrosymmetric materials.", "url": "https://arxiv.org/abs/2611.24045", "type": "理论+数值", "summary": "空间反转禁止中心对称晶体中传统的电偶极子二阶体电荷和自旋光伏响应。在这里，我们证明频率 $\\omega$ 和 $2\\omega$ 的相位相干双色场可以通过反转甚至三阶直流响应产生对称选择的电荷和自旋光电流。更重要的是，双色场的偏振方向和相对相位提供了对电流方向的直接控制，并且可以隔离传输通道，其中电荷电流消失，而有限的自旋电流仍然存在。对中心对称磁点组和共线反铁磁自旋点组的系统对称分析表明，在适当的双色驱动下，在广泛的此类系统中允许存在纯自旋通道。此外，相对光学相位控制响应的幅度和符号。我们对反转堆叠双层 2H-MoS$_2$ 和中心对称共线交替磁体的计算表明，在这些具有强自旋轨道耦合和弱自旋轨道耦合的互补系统中，分别具有共振增强、相位可调的自旋光电流。\n\n我们的结果将相干双色光的偏振方向和相位确立为中心对称材料中自旋输运的主动控制参数。", "authors": [{"name": "Songmin Liu"}, {"name": "Pan Zhou"}, {"name": "Lizhong Sun"}], "featured_authors": [{"name": "Songmin Liu"}, {"name": "Pan Zhou"}, {"name": "Lizhong Sun"}], "author_count": 3}, {"id": "2611.24088", "category": "cond-mat", "title": "A GPU-Native Nested Sampling Framework for Finite-Temperature Materials Modelling with Machine-Learned Interatomic Potentials", "abstract": "Modern equivariant machine-learned interatomic potentials (MLIPs) have dramatically improved the accuracy of and the scales accessible to atomistic simulation, yet the thermodynamic sampling methods needed to turn those potentials into finite-temperature phase stability predictions have not kept pace computationally. We present the GPU-native, massively parallel nested sampling framework JAXRENS, implemented on top of JAX, which removes the practical bottlenecks preventing atomistic nested sampling from being combined with state-of-the-art MLIPs. The framework provides distributed multi-GPU execution, vectorised ensembles of walkers, and direct interoperability with modern force fields. We demonstrate the highly beneficial scaling of JAXRENS on hardware accelerators, and apply it to the simulation of the ZnS phase diagram based on a MACE foundation model, a procedure previously computationally inaccessible. Despite requiring in the order of 10^10 model evaluations, the final converged simulation completed within six days on four GPUs, marking an important step towards routine, first-principles-quality predictions of finite-temperature phase stability using machine-learned interatomic potentials.", "url": "https://arxiv.org/abs/2611.24088", "type": "理论+数值", "summary": "现代等变机器学习原子间势（MLIP）极大地提高了原子模拟的准确性和可达到的尺度，但将这些势转化为有限温度相稳定性预测所需的热力学采样方法在计算方面却未能跟上。我们提出了 GPU 原生的大规模并行嵌套采样框架 JAXRENS，它在 JAX 之上实现，消除了阻止原子嵌套采样与最先进的 MLIP 相结合的实际瓶颈。该框架提供分布式多 GPU 执行、步行者矢量化集合以及与现代力场的直接互操作性。我们展示了 JAXRENS 在硬件加速器上的非常有益的扩展，并将其应用于基于 MACE 基础模型的 ZnS 相图模拟，这是以前无法通过计算实现的过程。\n\n尽管需要进行 10^10 次模型评估，最终的收敛模拟还是在 4 个 GPU 上于六天内完成，这标志着使用机器学习原子间势对有限温度相稳定性进行常规、第一原理质量预测迈出了重要一步。", "authors": [{"name": "Nico Unglert"}, {"name": "Alessandro Serafini"}, {"name": "Jesús Carrete"}, {"name": "Georg K. H. Madsen"}], "featured_authors": [{"name": "Nico Unglert"}, {"name": "Alessandro Serafini"}, {"name": "Jesús Carrete"}, {"name": "Georg K. H. Madsen"}], "author_count": 4}, {"id": "2611.24097", "category": "cond-mat", "title": "Uncovering the Structural, Electronic, and Electrostatic Landscapes of SrTiO$_3$ Grain Boundaries via Grand Canonical Monte Carlo with a Machine-Learning Interatomic Potential", "abstract": "Grain boundaries in perovskites exhibit a rich variety of electronic, polar and magnetic properties, yet identifying their atomic structures and compositions remains challenging. Here, we combine the Grand Canonical Monte Carlo (GCMC) method with a universal machine-learning interatomic potential to explore the coupled compositional and structural phase space of $\\Sigma$5(310)[001] SrTiO$_3$ grain boundaries. The resulting chemical potential phase diagram identifies ten stable structures belonging to four motif families: large Sr kite, small Sr kite, incomplete Sr large kite, and Ti-rich structures. Extending the GCMC method to the Sigma5(210)[001] and Sigma17(410)[001] grain boundaries reveals how grain boundary plane and inclination angle influence the competition between small- and large-kite motifs. Density functional theory calculations of the predicted Sigma5(310)[001] grain boundaries show that the composition and atomic structure strongly govern the spatial distribution of conduction and valence band edge states, interfacial band alignment, and carrier localization. Four distinct electronic regimes emerge: localized electron-doped, delocalized electron-doped, insulating, and hole-attracting states. Our electrostatics analysis reveals the coexistence of the short-range electric fields at the reconstructed GB core associated with local atomic density and bonding, and the longer-range fields outside the core arising from the space charge. These fields can also couple to local polar distortions and generate composition-dependent polarization patterns. These results establish an efficient framework for exploring oxide perovskite grain boundary structures and reveal how stoichiometry and atomic reconstruction couple to electronic structure, electrostatics, and local polarization, providing a route toward predictive grain boundary engineering in functional perovskites.", "url": "https://arxiv.org/abs/2611.24097", "type": "理论+数值", "summary": "钙钛矿的晶界表现出丰富的电子、极性和磁性特性，但识别其原子结构和成分仍然具有挑战性。在这里，我们将大正则蒙特卡罗（GCMC）方法与通用机器学习原子间势相结合，探索 $\\Sigma$5(310)[001] SrTiO$_3$ 晶界的耦合成分和结构相空间。由此产生的化学势相图确定了属于四个基序家族的十个稳定结构：大型 Sr 风筝、小型 Sr 风筝、不完整的 Sr 大风筝和富钛结构。将 GCMC 方法扩展到 Sigma5(210)[001] 和 Sigma17(410)[001] 晶界，揭示了晶界平面和倾角如何影响小型和大型风筝图案之间的竞争。预测的 Sigma5(310)[001] 晶界的密度泛函理论计算表明，成分和原子结构强烈控制导带和价带边缘态的空间分布、界面带排列和载流子局域化。\n\n出现了四种不同的电子状态：局域电子掺杂态、离域电子掺杂态、绝缘态和空穴吸引态。我们的静电学分析揭示了与局部原子密度和键合相关的重建 GB 核心的短程电场以及由空间电荷产生的核心外部的较长程场的共存。这些场还可以耦合到局部极性畸变并生成与成分相关的偏振图案。这些结果为探索氧化物钙钛矿晶界结构建立了一个有效的框架，并揭示了化学计量和原子重构如何与电子结构、静电和局部极化耦合，为功能钙钛矿的预测晶界工程提供了一条途径。", "authors": [{"name": "Xing He"}, {"name": "Kairi Masuda"}, {"name": "Aaron M. Schankler"}, {"name": "Songsong Zhou"}, {"name": "Andrew M. Rappe"}], "featured_authors": [{"name": "Xing He"}, {"name": "Kairi Masuda"}, {"name": "Aaron M. Schankler"}, {"name": "Songsong Zhou"}, {"name": "Andrew M. Rappe"}], "author_count": 5}, {"id": "2611.24103", "category": "cond-mat", "title": "Electrostatic and Quantum Transport Engineering of Multilayer Ferroelectric Tunnel Junctions for Improved TER and RA Trade off", "abstract": "Ferroelectric tunnel junctions (FTJs) are promising for non-volatile memory and neuromorphic computing, but achieving a high tunnel electroresistance ratio (TER) with a low resistance-area (RA) product remains challenging. In this work, TiN/Hf$_{0.5}$Zr$_{0.5}$O$_2$ (HZO)-based FTJs containing zero to three TiO$_2$ and IGZO-based quantum wells (QWs) are analyzed using the Miller ferroelectric (FE) polarization model integrated with the non-equilibrium Green's function (NEGF) formalism to examine the effects of QW material and thickness on polarization and transport. TiO$_2$-based structures exhibit higher polarization and TER than IGZO-based structures. At a read bias of 0.1 V, the uniform TiO$_2$ double-QW structure, with 1-nm-thick QW and insulating layer (IL) layers, gives a TER of $2.71\\times10^{10}\\%$ and an RA product of $5\\times10^4~\\Omega\\cdot\\text{cm}^2$, compared with $5.95\\times10^7\\%$ and $2\\times10^5~\\Omega\\cdot\\text{cm}^2$, respectively, for IGZO. Both uniform and non-uniform TiO$_2$ double-QW structures exhibit resonant tunneling (RT) and negative differential resistance (NDR) associated with QW-confined states. Increasing the first QW thickness to 1.38 nm, while keeping the second QW and both IL layers at 1 nm, shifts the confined-state energies and modifies resonant transport. The selected non-uniform structure achieves a TER of $2.95\\times10^{11}\\%$ and an RA product of $1.25\\times10^3~\\Omega\\cdot\\text{cm}^2$ at a read bias of 0.1 V. Elastic scattering changes the amplitude and width of QW resonant-transmission peaks, with a stronger effect on the low resistance state (LRS) than on the high resistance state (HRS). These results show that QW material and thickness optimization can improve the TER--RA trade-off, while electrode screening and elastic scattering further influence polarization-dependent transport in multilayer FTJs.", "url": "https://arxiv.org/abs/2611.24103", "type": "理论+数值", "summary": "铁电隧道结 (FTJ) 在非易失性存储器和神经形态计算方面很有前景，但利用低电阻面积 (RA) 产品实现高隧道电阻比 (TER) 仍然具有挑战性。在这项工作中，使用与非平衡格林函数 (NEGF) 形式相结合的米勒铁电 (FE) 极化模型来分析包含零到三个 TiO$_2$ 的基于 TiN/Hf$_{0.5}$Zr$_{0.5}$O$_2$ (HZO) 的 FTJ 和基于 IGZO 的量子阱 (QW)，以检查 QW 材料和厚度对极化和传输的影响。 TiO$_2$ 基结构比 IGZO 基结构表现出更高的极化和 TER。在读取偏压为 0.1 V 时，具有 1 nm 厚 QW 和绝缘层 (IL) 层的均匀 TiO$_2$ 双 QW 结构的 TER 为 $2.71\\times10^{10}\\%$，RA 乘积为 $5\\times10^4~\\Omega\\cdot\\text{cm}^2$，相比之下，$5.95\\times10^7\\%$ 和IGZO 分别为 $2\\times10^5~\\Omega\\cdot\\text{cm}^2$。均匀和非均匀 TiO$_2$ 双 QW 结构均表现出与 QW 限制态相关的谐振隧道 (RT) 和负微分电阻 (NDR)。\n\n将第一个 QW 厚度增加到 1.38 nm，同时将第二个 QW 和两个 IL 层保持在 1 nm，从而改变约束态能量并修改谐振传输。所选的非均匀结构在 0.1 V 的读取偏置下实现了 $2.95\\times10^{11}\\%$ 的 TER 和 $1.25\\times10^3~\\Omega\\cdot\\text{cm}^2$ 的 RA 乘积。弹性散射改变了 QW 谐振传输峰的幅度和宽度，对低电阻状态 (LRS) 的影响比对高电阻状态的影响更强（HRS）。这些结果表明，QW 材料和厚度优化可以改善 TER--RA 权衡，而电极屏蔽和弹性散射进一步影响多层 FTJ 中的偏振相关传输。", "authors": [{"name": "Balram Khattar"}, {"name": "Manish Anand"}, {"name": "Abhishek Sharma"}], "featured_authors": [{"name": "Balram Khattar"}, {"name": "Manish Anand"}, {"name": "Abhishek Sharma"}], "author_count": 3}, {"id": "2611.24105", "category": "cond-mat", "title": "Stabilizer models of achiral abelian topological orders", "abstract": "We construct continuous-variable stabilizer codes realizing every achiral 2D abelian topological order, both bosonic and fermionic. Starting from an arbitrary signature-zero integer $K$-matrix, we show that the corresponding topological order can be obtained by condensing a lattice of dyons with trivial pairwise mutual braiding in an $\\mathbb{R}^N$ gauge theory. We implement this condensation microscopically by gauging a non-on-site 1-form symmetry of the $\\mathbb{R}^N$ toric code.", "url": "https://arxiv.org/abs/2611.24105", "type": "理论", "summary": "我们构造连续变量稳定器代码，实现每个非手性二维阿贝尔拓扑序，包括玻色子和费米子。从任意签名零整数 $K$ 矩阵开始，我们证明了可以通过在 $\\mathbb{R}^N$ 规范理论中压缩具有平凡成对相互编织的动力子晶格来获得相应的拓扑顺序。我们通过测量 $\\mathbb{R}^N$ 环面码的非现场 1 型对称性来在微观上实现这种凝聚。", "authors": [{"name": "Marvin Qi"}, {"name": "Wilbur Shirley"}], "featured_authors": [{"name": "Marvin Qi"}, {"name": "Wilbur Shirley"}], "author_count": 2}, {"id": "2611.24130", "category": "cond-mat", "title": "A Universal Diffusion Model for the Quantum Position Operator", "abstract": "The quantum position operator and its response to perturbations underpin the functional properties of insulating materials. In the modern theory of polarization, Wannier charge centres encode Berry-phase polarization, while their structural derivatives determine key response functions. Here we introduce a universal diffusion model based on E(3)-equivariant graph neural networks for moments of the position operator, with the first moment defining Wannier centres and the second central moment their real-space localization. We demonstrate the framework for liquid water, amorphous silicon and crystalline BaTiO$_3$, and train a universal model that generalizes to 100 unseen crystals spanning a 67-species chemical space. The predicted centres reproduce infrared spectra in large liquid and amorphous cells beyond routine first-principles reach and enable finite-difference calculations of Born effective charges and piezoelectric tensors. This framework provides a scalable route to electronic polarization and localization in complex materials, supporting high-throughput screening and finite-temperature simulations.", "url": "https://arxiv.org/abs/2611.24130", "type": "理论+数值", "summary": "量子位置算子及其对扰动的响应支撑着绝缘材料的功能特性。在现代极化理论中，万尼尔电荷中心编码贝里相极化，而它们的结构导数决定了关键的响应函数。在这里，我们介绍了一种基于 E(3) 等变图神经网络的位置算子矩的通用扩散模型，其中第一个矩定义了 Wannier 中心，第二个中心矩定义了它们的真实空间定位。我们展示了液态水、非晶硅和晶体 BaTiO$_3$ 的框架，并训练了一个通用模型，该模型可推广到跨越 67 种化学空间的 100 种看不见的晶体。预测的中心在大型液体和非晶电池中再现了超出常规第一原理所能达到的红外光谱，并能够对玻恩有效电荷和压电张量进行有限差分计算。该框架提供了复杂材料中电子极化和定位的可扩展途径，支持高通量筛选和有限温度模拟。", "authors": [{"name": "Ransell D'Souza"}, {"name": "Austin Zadoks"}, {"name": "Riccardo Dal Molin"}, {"name": "Nataliia Manko"}, {"name": "Junfeng Qiao"}, {"name": "Nicola Marzari"}, {"name": "Antimo Marrazzo"}], "featured_authors": [{"name": "Ransell D'Souza"}, {"name": "Austin Zadoks"}, {"name": "Riccardo Dal Molin"}, {"name": "Junfeng Qiao"}, {"name": "Nicola Marzari"}, {"name": "Antimo Marrazzo"}], "author_count": 7}, {"id": "2611.24134", "category": "cond-mat", "title": "Non-Abelian Hall Effects of Flavor-Waves in $\\mathbb{CP}^{2}$ Skyrmions", "abstract": "We investigate the collective excitations of isolated and crystalline $\\mathbb{CP}^{2}$ skyrmions in a two-dimensional triangular-lattice spin-1 magnet. Within an $\\mathrm{SU}(3)$ coherent-state framework, fluctuations of the magnetic dipole and quadrupole moments are described by two coupled bosonic flavors. In a uniform spin-polarized state, these flavors can be identified with single-spin-flip and double-spin-flip excitations, whereas a nonuniform $\\mathbb{CP}^{2}$ texture mixes their character. We formulate the corresponding bosonic Bogoliubov--de Gennes problem and examine the matrix-valued gauge connection governing flavor-wave propagation. For isolated skyrmions, the calculated spectrum contains localized modes, and the scattering dynamics exhibit transverse deflection accompanied by isospin precession. For a numerically relaxed skyrmion crystal, we obtain collective-mode bands with nonzero Chern numbers and calculate the associated thermal Hall response. These findings illustrate how projective magnetic textures couple multipolar excitations to non-Abelian transport and topological band phenomena.", "url": "https://arxiv.org/abs/2611.24134", "type": "理论+数值", "summary": "我们研究了二维三角晶格自旋 1 磁体中孤立和晶体 $\\mathbb{CP}^{2}$ 斯格明子的集体激发。在 $\\mathrm{SU}(3)$ 相干态框架内，磁偶极子和四极矩的波动由两个耦合的玻色子风味来描述。在均匀的自旋极化状态下，这些味道可以通过单自旋翻转和双自旋翻转激发来识别，而不均匀的 $\\mathbb{CP}^{2}$ 纹理混合了它们的特性。我们制定了相应的玻色子 Bogoliubov-de Gennes 问题，并检查了控制味道波传播的矩阵值规范连接。对于孤立的斯格明子，计算的光谱包含局域模式，并且散射动力学表现出伴随同位旋进动的横向偏转。对于数值松弛的斯格明子晶体，我们获得具有非零陈数的集体模带并计算相关的热霍尔响应。这些发现说明了投影磁纹理如何将多极激励与非阿贝尔输运和拓扑带现象耦合起来。", "authors": [{"name": "Carlos Saji"}, {"name": "Eduardo Saavedra"}, {"name": "Alvaro S. Nunez"}, {"name": "Roberto E. Troncoso"}], "featured_authors": [{"name": "Carlos Saji"}, {"name": "Eduardo Saavedra"}, {"name": "Alvaro S. Nunez"}, {"name": "Roberto E. Troncoso"}], "author_count": 4}, {"id": "2611.24141", "category": "cond-mat", "title": "From dynamic strain aging to Alessandro--Beatrice--Bertotti--Montorsi dynamics of propagating Portevin--Le Chatelier bands", "abstract": "Type-A Portevin--Le Chatelier bands are propagating strain localizations whose velocity exhibits strong intermittent fluctuations. We derive a coarse-grained connection between the dynamic-strain-aging model of Hähner and Rizzi and the Alessandro--Beatrice--Bertotti--Montorsi (ABBM) mean-field model of avalanche dynamics. A propagating band is reduced to a single phase coordinate while retaining the elastic feedback of the tensile machine. This feedback generates the increasing drive and restoring terms of the ABBM description. A finite-time adjoint calculation determines the stress mobility of the band and is checked independently by direct stress continuation. The mobility is approximately proportional to the hardening parameter, whereas the band speed scales approximately as its square root. Short-range heterogeneity in the plastic strain deposited by the band is converted by the global machine feedback into a Brownian effective force. The resulting reduction provides a microscopic route from dynamic strain aging to ABBM-like avalanche dynamics of propagating PLC bands.", "url": "https://arxiv.org/abs/2611.24141", "type": "理论+数值", "summary": "A 型 Portevin-Le Chatelier 带正在传播应变局部化，其速度表现出强烈的间歇波动。我们推导了 Hähner 和 Rizzi 的动态应变时效模型与雪崩动力学的 Alessandro-Beatrice-Bertotti-Montorsi (ABBM) 平均场模型之间的粗粒度联系。传播带被简化为单相坐标，同时保留拉伸机的弹性反馈。这种反馈产生了 ABBM 描述的增加驱动力和恢复项。有限时间伴随计算确定带的应力迁移率，并通过直接应力连续进行独立检查。迁移率大约与硬化参数成正比，而带速度大约与其平方根成比例。带沉积的塑性应变的短程不均匀性通过全局机器反馈转换为布朗有效力。由此产生的减少提供了从动态应变老化到传播 PLC 带的类似 ABBM 雪崩动力学的微观途径。", "authors": [{"name": "Tero Mäkinen"}, {"name": "Mikko J. Alava"}], "featured_authors": [{"name": "Tero Mäkinen"}, {"name": "Mikko J. Alava"}], "author_count": 2}, {"id": "2611.24252", "category": "cond-mat", "title": "Neither graphs nor hypergraphs: structural moments of higher-order interactions determine stochastic social-impact dynamics", "abstract": "Whether higher-order interactions can be reduced to simpler representations is a question about the dynamics they drive, not only about their structure: what can be discarded is whatever the dynamics does not see. We make this precise for binary-state stochastic dynamics in which each agent, when updated, interacts with a randomly selected group and changes state according to the fraction of disagreeing members, as in generalized voter and social-impact models on hypergraphs. We ask which statistics of the group-interaction process determine the resulting Markov dynamics. For response functions that are polynomials of degree $q$, the answer is a hierarchy of size-weighted inclusion moments, which we call structural moments, involving at most $q$ neighbors at a time, regardless of how large the groups are. These moments are not only sufficient but also necessary: two interaction structures produce identical dynamics for all such rules if and only if their moments coincide. More generally, each class of rules selects its own minimal structural description, ranging from weighted pairwise links for linear rules to the full distribution of co-membership by group size for arbitrary rules. For voter-type rules, the same moments also reconstruct exact pairwise copying representations of these dynamics.", "url": "https://arxiv.org/abs/2611.24252", "type": "理论", "summary": "高阶相互作用是否可以简化为更简单的表示，这是一个关于它们驱动的动力学的问题，而不仅仅是关于它们的结构的问题：可以丢弃的是动力学看不到的东西。我们将其精确用于二元状态随机动力学，其中每个代理在更新时与随机选择的组交互，并根据不同成员的比例改变状态，就像超图上的广义选民和社会影响模型一样。我们询问群体互动过程的哪些统计数据决定了所得的马尔可夫动态。对于 $q$ 次多项式的响应函数，答案是大小加权包含矩的层次结构，我们称之为结构矩，一次最多涉及 $q$ 个邻居，无论组有多大。这些矩不仅是充分的，而且是必要的：当且仅当它们的矩重合时，两个相互作用结构才能为所有这些规则产生相同的动力学。\n\n更一般地说，每一类规则选择自己的最小结构描述，范围从线性规则的加权成对链接到任意规则的按组大小的共同成员资格的完整分布。对于选民类型的规则，相同的时刻还可以重建这些动态的精确的成对复制表示。", "authors": [{"name": "Emanuele Cozzo"}], "featured_authors": [{"name": "Emanuele Cozzo"}], "author_count": 1}, {"id": "2611.24288", "category": "cond-mat", "title": "Reconciling Models for Infinite-Layer Nickelate Superconductors: Role of Interstitial-$s$ Band or $A$-Pocket", "abstract": "Understanding the minimal model that captures the essential physics of infinite-layer nickelate superconductors remains a central challenge. Using first-principles density-functional theory combined with dynamical mean-field theory (DFT+DMFT), we compute and compare the strongly correlated electronic structures and optical spectra of various effective models for the infinite-layer nickelate LaNiO$_2$, ranging from a $d_{x^2-y^2}$ 1-band model to a full 6-band model with all Ni-$3d$ plus an interstitial-$s$ orbital. The results demonstrate that Ni-$3d$ 5-band models overestimate the Hundness picture, whereas 6-band models, which explicitly include the interstitial-$s$ band and have an $A$-pocket, recover the characteristic Mottness physics. Importantly, the influence of the interstitial-$s$ band on the correlations of the $d_{x^2-y^2}$ band is negligible. Thus, superconductivity in infinite-layer nickelates can be reliably described within a single-band Hubbard framework, while the accurate description of inter-orbital properties such as (optical) conductivities requires the inclusion of at least the interstitial-$s$ band.", "url": "https://arxiv.org/abs/2611.24288", "type": "理论+数值", "summary": "了解捕捉无限层镍酸盐超导体基本物理性质的最小模型仍然是一个核心挑战。利用第一原理密度泛函理论与动态平均场理论 (DFT+DMFT) 相结合，我们计算并比较了无限层镍盐 LaNiO$_2$ 的各种有效模型的强相关电子结构和光谱，范围从 $d_{x^2-y^2}$ 1 能带模型到全 Ni-$3d$ 加上间隙-$s$ 轨道的完整 6 能带模型。结果表明，Ni-$3d$ 5 波段模型高估了 Hundness 图像，而明确包含间隙-$s$ 波段并具有 $A$ 口袋的 6 波段模型恢复了特征莫特尼斯物理现象。重要的是，间隙-$s$ 波段对 $d_{x^2-y^2}$ 波段相关性的影响可以忽略不计。因此，无限层镍酸盐中的超导性可以在单能带哈伯德框架内可靠地描述，而轨道间特性（例如（光学）电导率）的准确描述需要至少包含间隙-$s$能带。", "authors": [{"name": "Ao Zhang"}, {"name": "Chao Deng"}, {"name": "Leonard M. Verhoff"}, {"name": "Mi Jiang"}, {"name": "Run Yang"}, {"name": "Zhixiang Shi"}, {"name": "Karsten Held"}, {"name": "Liang Si"}], "featured_authors": [{"name": "Ao Zhang"}, {"name": "Chao Deng"}, {"name": "Leonard M. Verhoff"}, {"name": "Zhixiang Shi"}, {"name": "Karsten Held"}, {"name": "Liang Si"}], "author_count": 8}, {"id": "2611.24312", "category": "cond-mat", "title": "Conformal defects in a quasi-one-dimensional Kitaev chain: an exactly parametrized Ising defect line and a relevant vacancy", "abstract": "The quasi-one-dimensional Kitaev chain of coupled hexagonal plaquettes recently introduced by Majumder is exactly solvable in terms of free Majorana fermions and undergoes a topological transition at the exchange anisotropy $J_x=\\sqrt{2}\\,J$. By eliminating the two-coordinated sites of each plaquette we reduce the zero-energy problem to a uniform Majorana chain, which yields the critical point, a single Majorana cone at $k=0$ (hence an Ising critical point with central charge $c=\\tfrac12$), and closed forms for every defect quantity that follows. A weakened inter-plaquette bond $\\lambda J_x$ is an exactly marginal defect with transmission $T=4\\lambda^2/(1+\\lambda^2)^2$ at low energy, that is, $T=\\sin^2 2\\phi$ with $\\tan\\phi=\\lambda$: the bond traverses the ferromagnetic defect line of the Ising conformal field theory from the transparent point to the cut chain, and we give its exact energy dependence on the lattice. The intra-plaquette bonds land on the same line with different parametrizations: a $y$ or $z$ bond has $\\tan\\phi=(1+\\lambda)/2$ and covers only $T\\in[0.64,1]$, because the plaquette provides a parallel path, whereas an $x$ bond has $\\tan\\phi=(1+\\lambda)/2\\lambda$ and covers the strong-link half of the line, $\\phi\\in(\\pi/4,\\pi/2)$. The identification is closed by an independent observable: the coefficient of $\\ln L$ in the entanglement entropy across the defect follows the conformal-field-theory function $\\sigma(\\sqrt T)/2$ of Brehm and Brunner to within $0.4\\%$ along the whole line, with no adjustable parameter. A vacancy behaves in the opposite way. It never binds a plaquette flux, because plaquettes share no sites, but it leaves its singly bonded neighbor as a conserved classical spin whose dangling Majorana is a zero-energy resonance.", "url": "https://arxiv.org/abs/2611.24312", "type": "理论", "summary": "Majumder 最近提出的准一维 Kitaev 链耦合六边形斑块完全可以用自由马约拉纳费米子来求解，并且在交换各向异性 $J_x=\\sqrt{2}\\,J$ 处经历拓扑转变。通过消除每个斑块的两个配位位点，我们将零能量问题简化为均匀的马约拉纳链，从而产生临界点，即 $k=0$ 处的单个马约拉纳锥体（因此具有中心电荷 $c=\\tfrac12$ 的伊辛临界点），以及随后的每个缺陷量的闭合形式。弱化的板间键 $\\lambda J_x$ 是一个精确的边缘缺陷，在低能量下传输 $T=4\\lambda^2/(1+\\lambda^2)^2$，即 $T=\\sin^2 2\\phi$ 和 $\\tan\\phi=\\lambda$：该键从透明点到切割链穿过伊辛共形场理论的铁磁缺陷线，我们给出了其对晶格的精确能量依赖性。\n\n板内键落在具有不同参数化的同一条线上： $y$ 或 $z$ 键具有 $\\tan\\phi=(1+\\lambda)/2$ 且仅覆盖 $T\\in[0.64,1]$，因为板提供平行路径，而 $x$ 键具有 $\\tan\\phi=(1+\\lambda)/2\\lambda$ 并覆盖线的强链接一半， $\\phi\\in(\\pi/4,\\pi/2)$。识别由一个独立的可观测量完成：缺陷上纠缠熵中的 $\\ln L$ 系数遵循 Brehm 和 Brunner 的共形场理论函数 $\\sigma(\\sqrt T)/2$ ，沿整条线在 $0.4\\%$ 范围内，没有可调参数。空缺的表现则相反。它从不结合小片通量，因为小片通量不共享位点，但它留下其单键邻居作为保守的经典自旋，其悬挂的马约拉纳是零能量共振。", "authors": [{"name": "R. L. Silva. R. C. Silva"}, {"name": "A. R. Pereira"}], "featured_authors": [{"name": "R. L. Silva. R. C. Silva"}, {"name": "A. R. Pereira"}], "author_count": 2}, {"id": "2611.24346", "category": "cond-mat", "title": "Spin dynamics in disordered systems with generic spin-momentum couplings: A matrix-rational formulation", "abstract": "We develop a microscopic framework for the disorder-averaged density-matrix dynamics of pseudospin-$1/2$ systems with anisotropic and nonlinear spin-momentum couplings. Starting from the Diffuson, we introduce a matrix-valued rational approximation for its frequency dependence that does not rely on a low-frequency or weak-coupling expansion. The resulting pole equation is recast as a quadratic eigenvalue problem, from which the real-time evolution of the disorder-averaged density matrix is constructed. We apply the formulation to a two-dimensional electron gas with Rashba and linear and cubic Dresselhaus couplings, a $d$-wave altermagnet with Rashba coupling, and a three-dimensional double-Weyl model. Comparisons with direct numerical simulations demonstrate quantitative agreement for both the post-quench spin dynamics and spin relaxation times across a broad range of coupling strengths, extending beyond the diffusive regime. The matrix-rational formulation provides a unified description of ultrafast spin dynamics and long-time relaxation.", "url": "https://arxiv.org/abs/2611.24346", "type": "理论+数值", "summary": "我们开发了一个微观框架，用于具有各向异性和非线性自旋动量耦合的赝自旋 $1/2$ 系统的无序平均密度矩阵动力学。从扩散子开始，我们引入了一种矩阵值有理近似来描述其频率依赖性，该近似不依赖于低频或弱耦合扩展。由此产生的极方程被改写为二次特征值问题，从中构造无序平均密度矩阵的实时演化。我们将该公式应用于具有 Rashba 和线性和立方 Dresselhaus 耦合的二维电子气、具有 Rashba 耦合的 $d$ 波交替磁体以及三维双 Weyl 模型。与直接数值模拟的比较表明，在广泛的耦合强度范围内，淬火后自旋动力学和自旋弛豫时间都具有定量一致性，超出了扩散范围。矩阵有理公式提供了超快自旋动力学和长时间弛豫的统一描述。", "authors": [{"name": "Masataka Kakoi"}], "featured_authors": [{"name": "Masataka Kakoi"}], "author_count": 1}, {"id": "2611.24390", "category": "cond-mat", "title": "Numerical integration of non-local master equations for renewal shot noise with drift and state-dependent amplitude", "abstract": "The probability density of a system driven by a drift and a renewal train of kicks with state-dependent amplitude obeys a master equation that is non-local in space, because the kick operator $\\hat{p}(i\\partial_x I(x))$ is of infinite order, and, for non-exponential waiting times, non-local in time, with a memory kernel containing the propagator of the drift. Its solutions contain quasi-singular components, the never-kicked mass, which collapse onto the attractors of the drift. We present an accurate numerical method for such equations. The kick operator is a push-forward along the Marcus flow; in the Lamperti variable it becomes a translation, whose exact cell-to-cell weights follow from the cumulative distribution of the kicks, without quadrature. The drift is integrated by a conservative semi-Lagrangian step exact in time. The memory is represented by a sum of exponentials whose auxiliary fields are advected by the drift, at a cost linear in the number of steps. The never-kicked mass is transported exactly. For each ingredient we quantify the errors of simpler alternatives. The method is verified against exact solutions and event-driven Monte Carlo simulations with exact flow maps, from which it is statistically indistinguishable with $10^8$ trajectories. Parameters tuned for Gaussian kicks carry over unchanged to other kick distributions, and near a zero of the coupling, where the density vanishes faster than any power, the solution follows the known asymptotic law down to densities of order $10^{-37}$, far beyond Monte Carlo reach. As an application we compare the exact equation with its local and Poissonian approximations: in the range explored, the local equation deviates by up to 8% of the density width, also for waiting times with finite mean, consistently with an error estimate predicting larger deviations for slow drifts at long times. A Fortran implementation is available.", "url": "https://arxiv.org/abs/2611.24390", "type": "理论+数值", "summary": "由漂移和状态相关幅度的冲击更新序列驱动的系统的概率密度遵循空间上非局部的主方程，因为冲击算子 $\\hat{p}(i\\partial_x I(x))$ 具有无限阶，并且对于非指数等待时间，时间上非局部，具有包含漂移传播器的内存内核。它的解包含准奇异分量，即从未踢动的质量，它会塌陷到漂移的吸引子上。我们为此类方程提出了一种精确的数值方法。踢操作符是沿着马库斯流向前推进；在 Lamperti 变量中，它变成了一个平移，其精确的单元间权重来自踢球的累积分布，没有正交。通过时间精确的保守半拉格朗日步骤对漂移进行积分。存储器由指数之和表示，其辅助场通过漂移进行平流，其成本与步数呈线性关系。从未被踢过的质量被精确地传输。对于每种成分，我们都会量化更简单的替代品的误差。\n\n该方法通过精确的解决方案和事件驱动的蒙特卡罗模拟与精确的流图进行验证，从统计上来说，它与 $10^8$ 的轨迹无法区分。针对高斯冲击调整的参数不变地延续到其他冲击分布，并且在耦合接近零时，密度比任何幂消失得更快，解决方案遵循已知的渐近定律，密度可达 $10^{-37}$ 量级，远远超出了蒙特卡罗的范围。作为应用，我们将精确方程与其局部近似和泊松近似进行比较：在探索的范围内，局部方程偏差高达密度宽度的 8%，对于具有有限平均值的等待时间也是如此，这与预测长时间缓慢漂移的较大偏差的误差估计一致。 Fortran 实现可用。", "authors": [{"name": "Marco Bianucci"}, {"name": "Riccardo Mannella"}], "featured_authors": [{"name": "Marco Bianucci"}, {"name": "Riccardo Mannella"}], "author_count": 2}, {"id": "2611.24483", "category": "cond-mat", "title": "A Bose-Hubbard quantum thermal machine", "abstract": "This work proposes a quantum thermal machine comprised of interacting ultracold bosons confined in a one-dimensional optical lattice and modeled by the Bose-Hubbard Hamiltonian. We consider an Otto-inspired cycle with strokes that change the interaction strength between bosons, in addition to standard thermalization and compression/expansion strokes. We find that these interaction changes can be manipulated to enhance the performance of the thermal machine, outperforming non-interacting cycles. In particular, when operating as a heat engine, the cycle can achieve its largest work output and near-Carnot efficiency by compressing the medium at strong repulsion into a Mott insulator state. Additionally, we find that decreasing interactions after the compression stroke favors and enhances the engine operation, whereas increasing interactions favors refrigeration cycles. The findings of this work further show that controlling the interactions across quantum phases of matter can be harnessed as a useful thermodynamic resource.", "url": "https://arxiv.org/abs/2611.24483", "type": "理论", "summary": "这项工作提出了一种量子热机，由限制在一维光学晶格中的相互作用的超冷玻色子组成，并由玻色-哈伯德哈密顿量建模。除了标准的热化和压缩/膨胀冲程之外，我们还考虑了一种受奥托启发的循环，其冲程改变了玻色子之间的相互作用强度。我们发现，可以操纵这些相互作用的变化来提高热机的性能，优于非相互作用的循环。特别是，当作为热机运行时，循环可以通过在强斥力下将介质压缩成莫特绝缘体状态来实现其最大的功输出和接近卡诺的效率。此外，我们发现压缩冲程后减少相互作用有利于并增强发动机的运行，而增加相互作用有利于制冷循环。这项工作的发现进一步表明，控制物质量子相之间的相互作用可以作为一种有用的热力学资源。", "authors": [{"name": "Felipe Isaule"}, {"name": "Juan E. Bernate"}, {"name": "Francisco J. Peña"}, {"name": "Patricio Vargas"}, {"name": "Thomás Fogarty"}], "featured_authors": [{"name": "Felipe Isaule"}, {"name": "Juan E. Bernate"}, {"name": "Francisco J. Peña"}, {"name": "Patricio Vargas"}, {"name": "Thomás Fogarty"}], "author_count": 5}, {"id": "2611.24515", "category": "cond-mat", "title": "Wegner model in high dimension: singular continuous spectrum from U(1) symmetry breaking and AAT self-consistency", "abstract": "We analyze the energy-spectral decomposition of the Wegner one-orbital model in high lattice dimension using ideas from field theory and statistical mechanics. Most notably, we identify a local spectral measure of singular continuous type for the disordered model at the Anderson transition. The key mechanism that leads to a singular continuous spectrum is a novel scenario of spontaneous symmetry breaking, intimately connected to the non-compactness of the global symmetry group of the field theory. While that symmetry breaks down to a compact subgroup in the metallic phase, it spontaneously breaks down to a nilpotent subgroup at criticality. We describe the symmetry-breaking extremal states approximately, by applying the self-consistent theory of localization due to Abou-Chacra, Anderson, and Thouless. The thrust of our work is to provide a field-theoretical foundation for disorder phenomena associated with singular continuous spectra.", "url": "https://arxiv.org/abs/2611.24515", "type": "理论", "summary": "我们利用场论和统计力学的思想分析了高维格纳单轨道模型的能谱分解。最值得注意的是，我们为安德森转变处的无序模型确定了奇异连续类型的局部光谱测量。导致奇异连续谱的关键机制是自发对称破缺的新情况，与场论全局对称群的非紧性密切相关。虽然这种对称性在金属相中分解为致密子群，但在临界点它会自发分解为幂零子群。我们通过应用 Abou-Chacra、Anderson 和 Thouless 提出的自洽定域理论来近似描述对称破缺的极值态。我们工作的主旨是为与奇异连续光谱相关的无序现象提供场论基础。", "authors": [{"name": "Julian Arenz"}, {"name": "Martin R. Zirnbauer"}], "featured_authors": [{"name": "Julian Arenz"}, {"name": "Martin R. Zirnbauer"}], "author_count": 2}, {"id": "2611.24525", "category": "cond-mat", "title": "Machine-learned potentials for iron oxides at extreme conditions", "abstract": "Reliable phase stability requires accurate relative free energies, which small force errors alone do not guarantee. We develop atomic-cluster-expansion potentials for five iron oxides from Fe$_2$O to Fe$_2$O$_3$, covering crystalline and liquid states at 140--260\\,GPa and 1000--11000\\,K, with electronic and ionic temperatures matched. Force-dominated training leaves systematic energy offsets between structure families of up to 41\\,meV/atom that persist despite additional training data. Stronger energy weighting and weaker regularization largely remove these offsets, while converged k-point sampling prevents further composition-dependent biases. The final potentials achieve held-out energy errors of 2.0--5.5\\,meV/atom and first-order free-energy errors within 3.4\\,meV/atom for liquids at 5000--9000\\,K. However, an untrained NiAs-type FeO phase exhibits a free-energy error of 57\\,meV/atom despite a low extrapolation grade. These results show that reliable phase-diagram calculations require control of relative energy offsets and explicit free-energy validation of every competing phase.", "url": "https://arxiv.org/abs/2611.24525", "type": "数值", "summary": "可靠的相位稳定性需要精确的相对自由能，仅靠较小的力误差并不能保证这一点。我们开发了从 Fe$_2$O 到 Fe$_2$O$_3$ 的五种铁氧化物的原子团簇膨胀势，涵盖 140--260\\,GPa 和 1000--11000\\,K 下的晶态和液态，电子和离子温度匹配。力主导的训练在结构族之间留下了高达 41meV/原子的系统能量偏移，尽管有额外的训练数据，但这种能量偏移仍然存在。更强的能量加权和更弱的正则化在很大程度上消除了这些偏移，而收敛的 k 点采样可以防止进一步的与成分相关的偏差。对于 5000--9000\\,K 的液体，最终势能实现 2.0--5.5\\,meV/atom 的保留能量误差和 3.4\\,meV/atom 以内的一阶自由能误差。然而，尽管外推等级较低，但未经训练的 NiAs 型 FeO 相仍表现出 57meV/原子的自由能误差。这些结果表明，可靠的相图计算需要控制相对能量偏移并对每个竞争相进行明确的自由能验证。", "authors": [{"name": "S. Azadi"}, {"name": "S. M. Vinko"}, {"name": "T. D. Kühne"}, {"name": "A. Principi"}, {"name": "M. S. Bahramy"}], "featured_authors": [{"name": "S. Azadi"}, {"name": "S. M. Vinko"}, {"name": "T. D. Kühne"}, {"name": "A. Principi"}, {"name": "M. S. Bahramy"}], "author_count": 5}, {"id": "2611.24560", "category": "cond-mat", "title": "A Monte Carlo study of closely packed two-patch particles with frustrated interactions", "abstract": "Recently it was found that closely packed two-patch particles exhibit rich orientational ordering behaviors, e.g., nonmonotonic changes of the nematic order parameter and double BKT phase transitions [ arXiv:2509.03981 ]. In this work, we show that, with repulsive patch-patch, attractive patch-nonpatch and intermediate nonpatch-nonpatch interactions, there exist frustrations in the system of closely packed two-patch particles. To investigate the ground states of the system, we design a Markov Chain Monte Carlo algorithm with single-defect propagation. The simulation results show that the ground states are disordered and the correlation functions decay exponentially with the distance. These results demonstrate that in 2D close packing one could design patchy particles to explore orientationally disordered systems.", "url": "https://arxiv.org/abs/2611.24560", "type": "理论+数值", "summary": "最近发现，紧密堆积的两片粒子表现出丰富的取向有序行为，例如向列有序参数的非单调变化和双 BKT 相变 [arXiv:2509.03981]。在这项工作中，我们表明，通过排斥的补丁-补丁、吸引的补丁-非补丁和中间的非补丁-非补丁相互作用，紧密堆积的两补丁粒子系统中存在挫败感。为了研究系统的基态，我们设计了具有单缺陷传播的马尔可夫链蒙特卡罗算法。模拟结果表明，基态是无序的，相关函数随距离呈指数衰减。这些结果表明，在二维密堆积中，人们可以设计片状粒子来探索定向无序系统。", "authors": [{"name": "Rui Ding"}, {"name": "Yan-Wei Li"}, {"name": "Hao Hu"}], "featured_authors": [{"name": "Rui Ding"}, {"name": "Yan-Wei Li"}, {"name": "Hao Hu"}], "author_count": 3}, {"id": "2611.24629", "category": "cond-mat", "title": "Unified Theory for Momentum-Space Nonsymmorphic Symmetry of Spin Space Groups", "abstract": "Projective crystal symmetry provides a route to nonsymmorphic symmetry structures in momentum space, but a general theory for their realization in spin space groups has been lacking. We show that a nonsymmorphic momentum-space action is possible only when the unitary translation subgroup is combined with rotations about a common axis for a coplanar or noncoplanar spin space group of spin-$1/2$ systems. Its factor system originates entirely from the double cover $\\mathrm{Spin}(2)\\to SO(2)$, yielding a general formula for the fractional reciprocal-lattice translations and hence for the point-group action on the Brillouin zone. We further prove that a momentum-space nonsymmorphic group is realizable by a spin space group if and only if its Brillouin-zone action contains a two-point orbit. Consequently, 842 of the 1,357 nonsymmorphic magnetic space groups are realizable by spin space groups. Applying this theory, we construct a database covering all 67,475 SSGs that can be queried bidirectionally: from an SSG to its momentum-space magnetic group, or from a given momentum-space magnetic group to all SSGs that realize it. Together, these results establish the momentum-space symmetry foundation for a systematic band theory of SSGs in spin-$1/2$ systems.", "url": "https://arxiv.org/abs/2611.24629", "type": "理论", "summary": "射影晶体对称性为动量空间中的非对称对称结构提供了一条途径，但一直缺乏在自旋空间群中实现非对称对称结构的一般理论。我们表明，只有当酉平移子群与自旋 $1/2$ 系统的共面或非共面自旋空间群绕公共轴的旋转相结合时，非对称动量空间作用才有可能。它的因子系统完全源自双重覆盖 $\\mathrm{Spin}(2)\\ 到 SO(2)$，产生分数倒易格平移的通用公式，从而产生布里渊区上的点群作用。我们进一步证明，当且仅当其布里渊区作用包含两点轨道时，动量空间非对称群可以通过自旋空间群实现。因此，1,357 个非对称磁空间群中的 842 个可以通过自旋空间群来实现。应用这一理论，我们构建了一个涵盖所有 67,475 个 SSG 的数据库，这些 SSG 可以双向查询：从 SSG 到其动量空间磁组，或从给定的动量空间磁组到实现它的所有 SSG。\n\n总之，这些结果为自旋 $1/2$ 系统中 SSG 的系统能带理论奠定了动量空间对称性基础。", "authors": [{"name": "Peiyuan Wang"}, {"name": "Zheng Zhang"}, {"name": "Y. X. Zhao"}], "featured_authors": [{"name": "Peiyuan Wang"}, {"name": "Zheng Zhang"}, {"name": "Y. X. Zhao"}], "author_count": 3}, {"id": "2611.24707", "category": "cond-mat", "title": "The Long and Winding Pore: Tuning Porosity in Templated Nanoporous Carbons", "abstract": "Disordered materials pose a recurring challenge for molecular simulation: realistic structural models are often generated through thermal protocols in which several structural descriptors emerge simultaneously and cannot easily be varied independently. Nanoporous carbons constitute a particularly relevant example: pore size, wall order, curvature, and network tortuosity generally emerge as outcomes of the thermal preparation protocol, rather than being independently prescribed structural parameters. Moreover, for practical applications, models of porous materials should ideally exhibit a percolating pore network, capable of supporting end-to-end transport of adsorbed species through the material. To this end, here we introduce a hierarchy of templating strategies, built around a common melt-quench-anneal protocol driven by a machine-learned interatomic potential for carbon, that progressively separates these variables. A rigid cylindrical template interacting with the environment through a tunable Lennard-Jones potential provides independent control over pore size and local wall organization, while leaving the structural disorder of the surrounding carbon matrix essentially unchanged. Generalizing the template to a spring-connected, tortuous backbone further allows pore geometry and curvature to be prescribed without qualitatively altering the local templating mechanism established for the straight pore. Finally, making the template mobile lets the growing carbon network reshape it in turn, which sharpens pore boundaries and allows sub-nanometer pore sizes to be targeted precisely, as needed for applications such as supercapacitor electrodes. Ultimately, this approach enables systematic studies of structure-property relationships in porous materials for applications such as energy storage, desalination and gas capture.", "url": "https://arxiv.org/abs/2611.24707", "type": "理论+数值", "summary": "无序材料对分子模拟提出了反复出现的挑战：真实的结构模型通常是通过热协议生成的，其中多个结构描述符同时出现，并且不能轻易地独立变化。纳米多孔碳构成了一个特别相关的例子：孔径、壁序、曲率和网络弯曲度通常作为热制备方案的结果出现，而不是独立规定的结构参数。此外，对于实际应用，多孔材料模型应该理想地表现出渗透孔网络，能够支持吸附物质通过材料的端到端传输。为此，我们在这里引入了模板策略的层次结构，该策略围绕由机器学习的碳原子间势驱动的通用熔化淬火退火协议构建，逐步分离这些变量。\n\n刚性圆柱形模板通过可调的伦纳德-琼斯势与环境相互作用，提供对孔径和局部壁组织的独立控制，同时使周围碳基质的结构无序基本不变。将模板推广到弹簧连接的曲折骨架进一步允许指定孔的几何形状和曲率，而无需定性地改变为直孔建立的局部模板机制。最后，使模板可移动，让不断增长的碳网络反过来重塑它，从而锐化孔隙边界，并允许精确定位亚纳米孔径，以满足超级电容器电极等应用的需要。最终，这种方法能够系统地研究多孔材料的结构-性能关系，用于储能、海水淡化和气体捕获等应用。", "authors": [{"name": "Zacharie Waysenson"}, {"name": "Baptiste Barthe-Gold"}, {"name": "Arthur France-Lanord"}, {"name": "Mathieu Salanne"}, {"name": "A. Marco Saitta"}], "featured_authors": [{"name": "Zacharie Waysenson"}, {"name": "Baptiste Barthe-Gold"}, {"name": "Arthur France-Lanord"}, {"name": "Mathieu Salanne"}, {"name": "A. Marco Saitta"}], "author_count": 5}, {"id": "2611.24730", "category": "cond-mat", "title": "Finite-temperature effects on the single-particle Green's function of a mobile impurity in a Luttinger liquid", "abstract": "We consider the problem of a quadratically-dispersing quantum impurity interacting through a contact density-density term with a one-dimensional (1D) superfluid described by Luttinger liquid theory. By means of a field-theoretical approach based on the linked-cluster expansion, we quantitatively address the effects of a finite temperature of the 1D bath on the momentum-space single-particle Green's function. Through a careful identification of the resonant phonon-impurity scattering processes, we obtain asymptotic large-time estimates for the thermally-induced exponential damping of the zero-temperature signal both in the $\\textit{quasiparticle}$ regime, dominated by the presence of a finite lifetime for the host impurity, and in the $\\textit{infrared-dominated}$ regime, where the impurity causes a Anderson's orthogonality catastrophe of the 1D bath. In both cases, we identify a temperature-induced coherence time that sets the characteristic timescale of the exponentially-decaying finite-temperature correction to the amplitude of the zero-temperature single-particle Green's function. Moreover, we draw connections between the aforesaid thermal timescale and the microscopic parameters of the Lieb-Liniger model, which admits an effective Luttinger-liquid description, highlighting the dependence of the inverse coherence time on the intra-bath interactions across the different dynamical regimes of the impurity.", "url": "https://arxiv.org/abs/2611.24730", "type": "理论", "summary": "我们考虑二次色散量子杂质通过接触密度-密度项与 Luttinger 液体理论描述的一维 (1D) 超流体相互作用的问题。通过基于联簇展开的场论方法，我们定量地解决了一维浴的有限温度对动量空间单粒子格林函数的影响。通过仔细识别共振声子杂质散射过程，我们获得了零温度信号热致指数阻尼的渐近大时间估计，无论是在$\\textit{准粒子}$区域（由主体杂质的有限寿命的存在主导）还是在$\\textit{红外主导}$区域（其中杂质导致一维浴的安德森正交灾难）。在这两种情况下，我们都确定了温度引起的相干时间，它将指数衰减有限温度校正的特征时间尺度设置为零温度单粒子格林函数的振幅。\n\n此外，我们在上述热时间尺度和 Lieb-Liniger 模型的微观参数之间建立了联系，该模型允许有效的 Luttinger 液体描述，突出了反相干时间对不同杂质动态状态的浴内相互作用的依赖性。", "authors": [{"name": "Lorenzo Gotta"}, {"name": "Thierry Giamarchi"}], "featured_authors": [{"name": "Lorenzo Gotta"}, {"name": "Thierry Giamarchi"}], "author_count": 2}, {"id": "2611.24878", "category": "cond-mat", "title": "From geometric curvature to effective backgrounds: a dictionary for Dirac fermions in one, two and three spatial dimensions", "abstract": "Dirac equation on curved backgrounds can be rewritten as a flat-space equation in which geometry appears as a tensorial Fermi velocity together with a set of background fields. We derive this correspondence from a single Clifford-algebra identity and follow it through one, two, and three spatial dimensions. Once the spin connection is written in terms of Ricci rotation coefficients, only two contractions can occur. The
