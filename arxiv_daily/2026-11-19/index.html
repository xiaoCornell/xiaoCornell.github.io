butions and spatiotemporal states", "abstract": "Monge-Kantorovich optimal transport is a mathematical framework that determines the most efficient way to transform one probability distribution into another while minimizing a given cost function. Its central constructions include the Wasserstein distances, which quantify the space of probability distributions, and dual formulations that link to convex analysis. Its standard quantum generalization replaces probability distributions with density operators and cost function with positive semidefinite cost operator, which should be regarded as spatial quantum optimal transport. In this work, we propose the quantum optimal transport problem in spacetime through the spatiotemporal phase-space Kirkwood-Dirac quasiprobability distribution and spatiotemporal states and through spatiotemporal state. We show that the two formalisms are equivalent and related via spatiotemporal operator frames. In the Kirkwood-Dirac phase-space formalism, the spatiotemporal distribution and the cost function are complex-valued, and the spatiotemporal couplings are Kirkwood-Dirac quasiprobability distributions that yield the correct marginals for the local states. In the spatiotemporal state formalism, the cost operators are generally non-Hermitian, and the spatiotemporal couplings are generally non-Hermitian and yield the correct reduced local states. The Margenau-Hill phase-space distribution gives rise to a real-valued optimal transport in spatiotemporal phase space; in the spatiotemporal state formalism, this corresponds to a Hermitian spatiotemporal coupling state. We give a rigorous definitions and a careful discussion of its duality. We also introduce a spatiotemporal quantum Wasserstein metric based on a metric in spatiotemporal phase spaces and show that it satisfies the metric axioms.", "url": "https://arxiv.org/abs/2611.23462", "type": "理论", "summary": "Monge-Kantorovich 最优传输是一个数学框架，它确定将一种概率分布转换为另一种概率分布的最有效方法，同时最小化给定的成本函数。其核心结构包括量化概率分布空间的 Wasserstein 距离，以及与凸分析相关的对偶公式。它的标准量子泛化用密度算子代替了概率分布，用正半定成本算子代替了成本函数，这应该被视为空间量子最优传输。在这项工作中，我们通过时空相空间柯克伍德-狄拉克准概率分布和时空状态以及时空状态提出了时空中的量子最优输运问题。我们通过时空算子框架证明这两种形式是等价且相关的。在柯克伍德-狄拉克相空间形式主义中，时空分布和成本函数是复值的，时空耦合是柯克伍德-狄拉克准概率分布，可为局部状态产生正确的边际。\n\n在时空状态形式中，成本算子通常是非厄米式的，并且时空耦合通常是非厄米式的并产生正确的简化局部状态。 Margenau-Hill 相空间分布产生时空相空间中的实值最优输运；在时空状态形式主义中，这对应于埃尔米特时空耦合状态。我们给出了严格的定义并对其二元性进行了仔细的讨论。我们还引入了基于时空相空间度量的时空量子 Wasserstein 度量，并证明它满足度量公理。", "authors": [{"name": "Zhian Jia"}], "featured_authors": [{"name": "Zhian Jia"}], "author_count": 1}, {"id": "2611.23505", "category": "quant-ph", "title": "Degree and normalization frontiers for bounded QSVT inversion", "abstract": "Quantum singular value transformation (QSVT) implements matrix inversion using bounded polynomials. Increasing polynomial degree can improve normalization and reduce amplified query cost, with savings that depend on the error criterion. However, existing bounded methods either fix the normalization or work far below the condition numbers of fault-tolerant resource estimates. We therefore analyze this trade-off for absolute reciprocal error, which controls inverse-operator accuracy, and for residual error, which suffices for normalized linear solves. For absolute reciprocal error, we establish a scaling limit to a constrained least-norm problem for entire functions and characterize its high-accuracy frontier using elliptic integrals. Constructions built from near-optimal limiting functions achieve certified query-cost savings over the rescaled minimax baseline of at least 11.8 percent at condition number ten thousand with error one millionth, and at least 22.8 percent at one million with error one ten-billionth. A simpler two-term rule also has certified savings, and its phase factors at condition number ten thousand pass numerical checks at selected points. For residual error, a sparse Chebyshev construction achieves certified savings over the residual-minimax baseline of at least 8.7 percent at condition number ten thousand with normalized-state error at most one hundred-millionth, and at least 13.1 percent at one million with error at most one ten-billionth. These results quantify the saving that a joint choice of degree and normalization gives beyond the minimax baselines.", "url": "https://arxiv.org/abs/2611.23505", "type": "理论+数值", "summary": "量子奇异值变换 (QSVT) 使用有界多项式实现矩阵求逆。增加多项式次数可以改善规范化并降低放大的查询成本，节省的成本取决于错误标准。然而，现有的有界方法要么修复标准化，要么远远低于容错资源估计的条件数。因此，我们分析了绝对倒数误差（控制逆算子精度）和残差误差（足以满足归一化线性求解）的权衡。对于绝对倒数误差，我们为整个函数的约束最小范数问题建立了缩放限制，并使用椭圆积分来表征其高精度边界。由接近最优的限制函数构建的构造在条件数为一万且误差为百万分之一时，与重新调整的极小极大基线相比，可实现经认证的查询成本节省至少 11.8%，在条件数为一百万且误差为十亿分之一时至少节省 22.8%。更简单的两项规则也具有经过认证的节省，并且其条件数为一万的相位因子通过了选定点的数值检查。\n\n对于残差误差，稀疏切比雪夫结构在条件数为一万且归一化状态误差最多为一亿分之一时，在残差最小最大基线上实现了至少 8.7% 的节省，在条件数为一百万且误差最多为十亿分之一时至少节省了 13.1%。这些结果量化了联合选择程度和归一化所带来的超出极小极大基线的节省。", "authors": [{"name": "Hongyu Wu"}], "featured_authors": [{"name": "Hongyu Wu"}], "author_count": 1}, {"id": "2611.23514", "category": "quant-ph", "title": "Quantum resources and the onset of the quantum Monte Carlo sign problem", "abstract": "The Monte Carlo sign problem poses a fundamental obstacle to classical simulation of quantum many-body systems, yet its connection to quantum resources remains poorly understood. We probe this connection by systematically tuning the degree of nonstoquasticity in random k-local Hamiltonians. In numerical tensor-network studies, we find the sign complexity and the quantum resources of entanglement and nonstabilizerness of the ground state to be strongly suppressed in a broad regime up to substantial nonstoquasticity. As nonstoquasticity is further increased, the considered quantum resources experience sharp crossovers into a regime where they are strongly enhanced. Surprisingly, numerical quantum Monte Carlo (QMC) simulations drastically deteriorate in the same region, even though the Hamiltonian is already considerably nonstoquastic well before it, indicating that the failure of ground-state QMC is correlated more with the resource content of the state than the sign structure of the Hamiltonian. We corroborate these findings analytically by constructing an approximate ground state of k-local Hamiltonians in the stoquastic limit. Moreover, we identify a distinct behaviour in graph states. Their nonstabilizerness always vanishes, but, as we demonstrate analytically, on bipartite graphs the sign can be easily cured while in multipartite graph states it cannot. Our results thus shed light on the highly subtle interplay between quantum resources and the computational difficulty encountered by QMC methods.", "url": "https://arxiv.org/abs/2611.23514", "type": "理论+数值", "summary": "蒙特卡罗符号问题对量子多体系统的经典模拟构成了根本障碍，但其与量子资源的联系仍然知之甚少。我们通过系统地调整随机 k 局部哈密顿量的非随机性程度来探讨这种联系。在数值张量网络研究中，我们发现基态的符号复杂性以及纠缠和非稳定性的量子资源在高达非随机性的广泛范围内受到强烈抑制。随着非随机性的进一步增加，所考虑的量子资源经历了急剧的交叉，进入了它们被强烈增强的状态。令人惊讶的是，数值量子蒙特卡罗（QMC）模拟在同一区域急剧恶化，尽管哈密顿量早在它之前就已经相当非随机，这表明基态 QMC 的失败与状态的资源含量的相关性大于与哈密顿量的符号结构的相关性。我们通过在随机极限内构建 k 局部哈密顿量的近似基态来分析证实这些发现。\n\n此外，我们还发现了图状态中的独特行为。它们的非稳定性总是消失，但是，正如我们分析证明的那样，在二分图上，符号可以很容易地被治愈，而在多分图上却不能。因此，我们的结果揭示了量子资源与 QMC 方法遇到的计算困难之间高度微妙的相互作用。", "authors": [{"name": "Naga Dileep Varikuti"}, {"name": "Leela Ganesh Chandra Lakkaraju"}, {"name": "Philipp Hauke"}], "featured_authors": [{"name": "Naga Dileep Varikuti"}, {"name": "Leela Ganesh Chandra Lakkaraju"}, {"name": "Philipp Hauke"}], "author_count": 3}, {"id": "2611.23550", "category": "quant-ph", "title": "Fe$^{2+}$:forsterite Qubit System", "abstract": "Quantum Computing uses quantum mechanical phenomena, such as superposition and entanglement of quantum bits (qubits), to represent and manipulate information in multidimensional state spaces. This approach allows complex mathematical functions to be executed simultaneously rather than sequentially, making them much more efficient than classical computers. However, current quantum computers suffer from quantum decoherence, where small changes to their environment, such as thermal fluctuations and vibrations, affect the systems' fragile states. The goal of this study is to discuss the functionality of a proposed Fe$^{2+}$:forsterite qubit system by solving the unitary time-evolution of a quantum state vector for the system's Hamiltonian, using known axial and traverse anisotropy terms at temperatures up to 10 K. The system can effectively transfer population between its two lowest states at rates predicted by the Rabi half-period, with 99.9% fidelity. Additionally, it can hold the population at a desired state without docohering. The results remained consistent for temperatures up to 10 K, meaning, unlike many common qubit systems, the proposed qubit system could function without a dilution fridge and is not fragile to thermal noise.", "url": "https://arxiv.org/abs/2611.23550", "type": "理论", "summary": "量子计算利用量子力学现象，例如量子比特（qubit）的叠加和纠缠，来表示和操纵多维状态空间中的信息。这种方法允许同时而不是顺序执行复杂的数学函数，使它们比传统计算机更加高效。然而，当前的量子计算机存在量子退相干问题，其中环境的微小变化（例如热波动和振动）会影响系统的脆弱状态。本研究的目的是讨论所提出的 Fe$^{2+}$:镁橄榄石量子位系统的功能，方法是使用温度高达 10 K 的已知轴向和横向各向异性项，求解系统哈密顿量的量子状态向量的酉时间演化。该系统可以以拉比半周期预测的速率在两个最低状态之间有效地转移粒子数，保真度为 99.9%。此外，它可以将群体保持在所需的状态而不发生凝聚。\n\n在高达 10 K 的温度下，结果保持一致，这意味着，与许多常见的量子位系统不同，所提出的量子位系统可以在没有稀释冰箱的情况下运行，并且不易受到热噪声的影响。", "authors": [{"name": "Dishaanth S. Pillai"}, {"name": "G. M. Wysin"}], "featured_authors": [{"name": "Dishaanth S. Pillai"}, {"name": "G. M. Wysin"}], "author_count": 2}, {"id": "2611.23556", "category": "quant-ph", "title": "Spectral Disks for Quantum Markov Generators", "abstract": "Spectral bounds for Markov generators require a choice of time scale. In quantum dynamics, a rate read off from a jump representation, the escape rate from a pure state and the smallest spectral disk need not agree. We prove that the spectrum of every GKLS generator written without a Hamiltonian lies in a disk tangent to the imaginary axis, with radius given by the norm of the operator $\\Phi^\\dagger(I)$ built from the jump map $\\Phi$. This settles the first two scaling conjectures of \"Corralling spectra of generators of time-continuous Markov evolution (both classical and quantum)\", J. Phys. A: Math. Theor. {59}, 175202 (2026). The third, escape-rate conjecture fails for a qutrit with a single normal jump. Nevertheless, twice the escape rate bounds every decay rate of any positive trace-preserving semigroup For GKLS generators with vanishing canonical Hamiltonian, four times the escape rate always supplies a spectral disk, and the factor four is optimal uniformly in dimension. We compare these bounds with classical Cassini ovals and thermodynamic ellipses, explain the obstacles to their quantum extensions, and formulate optimization over completely positive jump-map representations as a semidefinite program.", "url": "https://arxiv.org/abs/2611.23556", "type": "理论+数值", "summary": "马尔可夫生成器的谱界需要选择时间尺度。在量子动力学中，从跳跃表示中读出的速率、纯态的逃逸速率和最小谱盘不需要一致。我们证明，每个不使用哈密顿量编写的 GKLS 生成器的频谱都位于与虚轴相切的圆盘中，其半径由根据跳跃映射 $\\Phi$ 构建的算子 $\\Phi^\\dagger(I)$ 的范数给出。这解决了“时间连续马尔可夫进化（经典和量子）生成器的聚集谱”的前两个标度猜想，J. Phys。答：数学。理论。 {59}，175202（2026）。第三个，逃逸率猜想对于具有单次正常跳跃的 qutrit 来说是失败的。然而，两倍的逃逸率限制了任何正迹保留半群的每个衰减率。对于具有消失正则哈密顿量的 GKLS 生成器，四倍的逃逸率总是提供一个谱盘，并且因子 4 在维数上是一致最优的。\n\n我们将这些边界与经典的卡西尼椭圆和热力学椭圆进行比较，解释其量子扩展的障碍，并将完全正跳跃图表示的优化制定为半定程序。", "authors": [{"name": "Dariusz Chruściński"}, {"name": "Sergey Denisov"}, {"name": "Wojciech Tarnowski"}, {"name": "Karol Życzkowski"}], "featured_authors": [{"name": "Dariusz Chruściński"}, {"name": "Sergey Denisov"}, {"name": "Wojciech Tarnowski"}, {"name": "Karol Życzkowski"}], "author_count": 4}, {"id": "2611.23604", "category": "quant-ph", "title": "Uniformly Convergent Perturbation Theory for Open Quantum Systems at, near, and away from Exceptional Points", "abstract": "Near a Liouvillian exceptional point, spectral perturbation theory becomes ill-conditioned, yet the observable dynamics of a finite-dimensional open system remains regular in the perturbation. Using a Dyson expansion, which requires no diagonalization of the perturbed generator, we analyze the scaling, stability, and convergence of the perturbative corrections at, near and away from exceptional points. We derive scaling laws showing that nonperipheral Jordan blocks raise the degree of the polynomial-in-time factors multiplying decaying exponentials, which are present for any generator as resonances, and we quantify this excess. We further establish a uniform-in-time error estimate for the perturbative series, valid for any relaxing finite-dimensional Lindbladian and controlled by a parameter $q = |\\varepsilon|R$, where $\\varepsilon$ is the perturbation strength and $R$ is a constant built from unperturbed data. All constants of the bound remain continuous through an exceptional point when the coalescing eigenvalues are kept in one spectral cluster. The estimate extends to the frequency domain via the Laplace transform, and to time-dependent perturbations. We test it in a driven two-level system with a Liouvillian exceptional point, including perturbations that break its symmetry.", "url": "https://arxiv.org/abs/2611.23604", "type": "理论+数值", "summary": "在刘维尔异常点附近，谱微扰理论变得病态，但有限维开放系统的可观测动力学在微扰中仍然保持规则。使用不需要扰动发生器对角化的戴森展开式，我们分析了异常点处、附近和远离异常点的扰动校正的缩放、稳定性和收敛性。我们推导出的比例定律表明，非外围乔丹块提高了多项式时间因子乘以衰减指数的程度，这对于任何发电机都以共振的形式存在，并且我们量化了这种过量。我们进一步建立了扰动序列的统一时间误差估计，对任何松弛有限维 Lindbladian 有效，并由参数 $q = |\\varepsilon|R$ 控制，其中 $\\varepsilon$ 是扰动强度，$R$ 是根据未扰动数据构建的常数。当合并特征值保持在一个谱簇中时，边界的所有常数在一个异常点上保持连续。该估计通过拉普拉斯变换扩展到频域，并扩展到与时间相关的扰动。\n\n我们在具有刘维尔异常点的驱动两级系统中对其进行测试，包括破坏其对称性的扰动。", "authors": [{"name": "Pedro Linck"}], "featured_authors": [{"name": "Pedro Linck"}], "author_count": 1}, {"id": "2611.23645", "category": "quant-ph", "title": "Parisi Energy before Parisi Geometry in the Quantum Approximate Optimization Algorithm", "abstract": "The fractured low-energy landscape of spin glasses presents a notorious barrier to optimization. While high-depth calculations indicate that the Quantum Approximate Optimization Algorithm (QAOA) can approach the Parisi ground-state energy of the Sherrington-Kirkpatrick spin glass, how it does so remains elusive. Here, we treat the QAOA distribution as a statistical-physics object and probe its geometry directly in the thermodynamic limit. We draw two independent bitstrings from the same problem instance and couple them through their macroscopic similarity. We find that typical QAOA samples remain macroscopically uncorrelated, even as their sensitivity to this coupling grows with circuit depth $p$. By contrast, the low-energy tail shows a much stronger tendency to overlap and reveals a Parisi-like phase with the same critical behavior as the thermal spin-glass transition. The onset of this organization moves toward the typical output as the circuit deepens, consistent with the separation vanishing only as $p\\to\\infty$. Together, these findings suggest a route distinct from structure-exploiting classical algorithms and thermal sampling, one in which the QAOA approaches the Parisi energy before Parisi geometry becomes typical.", "url": "https://arxiv.org/abs/2611.23645", "type": "理论+数值", "summary": "自旋玻璃破碎的低能景观给优化带来了臭名昭著的障碍。虽然深度计算表明量子近似优化算法 (QAOA) 可以接近谢林顿-柯克帕特里克自旋玻璃的 Parisi 基态能量，但它是如何做到的仍然难以捉摸。在这里，我们将 QAOA 分布视为统计物理对象，并直接在热力学极限下探测其几何形状。我们从同一问题实例中提取两个独立的位串，并通过它们的宏观相似性将它们耦合起来。我们发现，典型的 QAOA 样本在宏观上仍然不相关，即使它们对这种耦合的敏感性随着电路深度 $p$ 的增加而增长。相比之下，低能尾部表现出更强的重叠趋势，并显示出类帕里西相，其临界行为与热自旋玻璃转变相同。随着电路加深，该组织的开始向典型输出移动，与仅随着 $p\\to\\infty$ 消失的分离一致。\n\n总之，这些发现提出了一条不同于结构利用经典算法和热采样的路线，其中 QAOA 在 Parisi 几何变得典型之前接近 Parisi 能量。", "authors": [{"name": "Maxime Dupont"}, {"name": "Bhuvanesh Sundar"}], "featured_authors": [{"name": "Maxime Dupont"}, {"name": "Bhuvanesh Sundar"}], "author_count": 2}, {"id": "2611.23649", "category": "quant-ph", "title": "Renormalization and exact Bloch bands: the trigonometric Rosen-Morse model", "abstract": "We study the trigonometric Rosen-Morse potential as an isolated singular well and as an exactly solvable periodic lattice. The potential combines inverse-square singularities with Coulomb terms of opposite signs. In the strongly attractive regime, independent renormalization at the two endpoints gives a two-parameter family of spectra. Deep negative-energy levels form two asymptotic sequences with the same Efimov-like scaling and opposite first-order Coulomb corrections. In the weak-medium regime, self-adjoint matching conditions allow transmission between neighboring cells. We obtain the exact Bloch dispersion relation and determine the band widths, gaps, and electron and hole effective masses. At fixed band index, the bandwidth becomes exponentially small in the limit of large Coulomb coupling.", "url": "https://arxiv.org/abs/2611.23649", "type": "理论", "summary": "我们将三角罗森-莫尔斯势作为孤立的奇阱和精确可解的周期晶格来研究。该势将平方反比奇点与符号相反的库仑项结合起来。在强吸引状态下，两个端点的独立重整化给出了双参数谱族。深负能级形成两个渐近序列，具有相同的类 Efimov 标度和相反的一阶库仑校正。在弱介质状态下，自伴随匹配条件允许相邻小区之间的传输。我们获得了精确的布洛赫色散关系，并确定了带宽、能隙以及电子和空穴的有效质量。在固定带指数下，带宽在大库仑耦合的限制下呈指数级减小。", "authors": [{"name": "Ulysses Camara da Silva"}, {"name": "H. G. Vianna"}], "featured_authors": [{"name": "Ulysses Camara da Silva"}, {"name": "H. G. Vianna"}], "author_count": 2}, {"id": "2611.23693", "category": "quant-ph", "title": "Separating QMA from the QCMA Hierarchy via a Switching Lemma for Polynomials", "abstract": "We construct a classical oracle relative to which QMA is not contained in the QCMA hierarchy. Our main technical contribution is a switching lemma for bounded polynomials, which provides a new conceptual viewpoint on earlier sampler-based arguments separating QMA and QCMA. Crucially, the parameters of this switching lemma are independent of the number of input variables. The separation builds on the code intersection subset size problem of Bostanci, Huang, and Vaikuntanathan (FOCS 2026). We also construct a classical oracle relative to which QCMA collapses to P but QMA does not, and another relative to which QMA collapses to P but PP does not.", "url": "https://arxiv.org/abs/2611.23693", "type": "理论", "summary": "我们构建了一个经典的预言机，相对于此，QMA 不包含在 QCMA 层次结构中。我们的主要技术贡献是有界多项式的切换引理，它为区分 QMA 和 QCMA 的早期基于采样器的参数提供了新的概念观点。至关重要的是，该切换引理的参数与输入变量的数量无关。这种分离建立在 Bostanci、Huang 和 Vaikuntanathan 的代码交叉子集大小问题的基础上 (FOCS 2026)。我们还构建了一个相对于 QCMA 折叠为 P 但 QMA 不折叠的经典预言，以及另一个相对于 QMA 折叠为 P 但 PP 不折叠的经典预言。", "authors": [{"name": "Yiming Wang"}], "featured_authors": [{"name": "Yiming Wang"}], "author_count": 1}, {"id": "2611.23712", "category": "quant-ph", "title": "Chirp-stabilized charging of a two-level quantum battery", "abstract": "Resonantly driven two-level quantum batteries (QBs) suffer from strong pulse-area dependence and energy backflow inherent to Rabi oscillations. To address this limitation, we propose charging of a two-level QB with chirped pulses. We investigate four charging protocols formed by pairing hyperbolic secant (sech) or Gaussian pulse envelopes with linear or hyperbolic-tangent (tanh) frequency sweeps. We show that sufficiently strong chirp modulation converts the charging mechanism from pulse-area-governed Rabi rotation to adiabatic rapid passage. We analyze the underlying adiabatic dynamics and derive the criteria for robust chirped charging, which incorporate the sweep bandwidth, nonadiabatic transitions, and dissipative effects. Under strong chirp modulation, the final stored energy and ergotropy converge to stable plateaus that are nearly insensitive to the pulse area across an extended parameter window. Of the four schemes, the sech pulse with tanh chirp delivers the widest ergotropy plateau and the weakest pulse area sensitivity. Compared with counterdiabatic driving, the sech tanh protocol attains stable charging performance without demanding an extra drive quadrature. Furthermore, this chirp-enabled charging is resilient to static detuning and weak-to-moderate dissipation. This work establishes a practical route toward robust charging of quantum batteries using chirped pulse control.", "url": "https://arxiv.org/abs/2611.23712", "type": "理论", "summary": "谐振驱动的两级量子电池（QB）遭受强烈的脉冲面积依赖性和拉比振荡固有的能量回流的影响。为了解决这一限制，我们建议使用啁啾脉冲对两级 QB 进行充电。我们研究了通过将双曲正割 (sech) 或高斯脉冲包络与线性或双曲正切 (tanh) 频率扫描配对而形成的四种充电协议。我们表明，足够强的线性调频调制将充电机制从脉冲区域控制的拉比旋转转换为绝热快速通道。我们分析了潜在的绝热动力学，并得出了稳健的线性调频充电的标准，其中包括扫描带宽、非绝热跃迁和耗散效应。在强线性调频调制下，最终存储的能量和各向异性收敛到稳定的平台，该平台对扩展参数窗口上的脉冲区域几乎不敏感。在这四种方案中，具有 tanh chirp 的 sech 脉冲可提供最宽的各向异性平台和最弱的脉冲面积灵敏度。与反向驱动相比，sech tanh 协议无需额外的驱动正交即可获得稳定的充电性能。\n\n此外，这种支持线性调频脉冲的充电对于静态失谐和弱到中度耗散具有弹性。这项工作建立了一条使用啁啾脉冲控制对量子电池进行稳健充电的实用途径。", "authors": [{"name": "Yang-Yang Yuan"}, {"name": "Xian-Li Yin"}, {"name": "Jin-Feng Huang"}, {"name": "Jie-Qiao Liao"}], "featured_authors": [{"name": "Yang-Yang Yuan"}, {"name": "Xian-Li Yin"}, {"name": "Jin-Feng Huang"}, {"name": "Jie-Qiao Liao"}], "author_count": 4}, {"id": "2611.23759", "category": "quant-ph", "title": "Parity Push Post-Selection with Soft Parity Constraints for Quantum LDPC Codes", "abstract": "Post-selection lowers the logical error rate of a quantum error-correcting code by rejecting unreliable shots. For a code with $K$ logical observables, the logical gap, a standard post-selection criterion, involves $2^K$ logical classes, and existing approximations to it suffer from a non-convergence error floor or a shielding effect. We introduce a decoder-agnostic post-selection strategy for quantum low-density parity-check (qLDPC) codes, called parity push post-selection (PPPS), which re-decodes a shot once per logical observable with a push toward the opposite parity. Each push adds one check node and one variable node to the Tanner graph of the detector error model, and we accept a shot only when every re-decoding returns a solution in the original logical class. We show that, with degenerate maximum-likelihood decoding, PPPS accepts a shot exactly when the logical gap exceeds the push strength $\\lambda$. Applied with the Relay-BP decoder to the [[72,12,6]] bivariate bicycle code at $p=10^{-3}$ and the [[144,12,12]] code at $p=3\\times10^{-3}$ under circuit-level depolarizing noise, PPPS lowers the logical error rate by factors of about 50 and 75, respectively, at rejection rates near 1%. We observe that PPPS rejects failures that prior post-selection strategies cannot reject, and thus shows improved performance.", "url": "https://arxiv.org/abs/2611.23759", "type": "理论", "summary": "后选择通过拒绝不可靠的镜头来降低量子纠错码的逻辑错误率。对于具有 $K$ 逻辑可观察量的代码，逻辑间隙（标准后选择标准）涉及 $2^K$ 逻辑类，并且现有的近似值会受到非收敛错误底或屏蔽效应的影响。我们为量子低密度奇偶校验（qLDPC）码引入了一种与解码器无关的后选择策略，称为奇偶校验推送后选择（PPPS），它对每个逻辑可观察值重新解码一次，并推动相反的奇偶校验。每次推送都会向检测器误差模型的 Tanner 图添加一个检查节点和一个变量节点，并且仅当每次重新解码返回原始逻辑类中的解决方案时我们才接受射击。我们证明，通过退化最大似然解码，PPPS 在逻辑间隙超过推送强度 $\\lambda$ 时准确地接受镜头。\n\n将 Relay-BP 解码器应用于电路级去极化噪声下 $p=10^{-3}$ 处的 [[72,12,6]] 双变量自行车代码和 $p=3\\times10^{-3}$ 处的 [[144,12,12]] 代码，PPPS 将逻辑错误率分别降低了约 50 和 75 倍，拒绝率接近 1%。我们观察到 PPPS 拒绝了先前的后选择策略无法拒绝的失败，因此表现出改进的性能。", "authors": [{"name": "Hong Jun Kim"}, {"name": "Gun Sik Min"}, {"name": "Seok-Hyung Lee"}, {"name": "Jun Heo"}], "featured_authors": [{"name": "Hong Jun Kim"}, {"name": "Gun Sik Min"}, {"name": "Seok-Hyung Lee"}, {"name": "Jun Heo"}], "author_count": 4}, {"id": "2611.23762", "category": "quant-ph", "title": "Addressable transversal CCZ gates on almost good quantum LDPC codes and nearly optimal magic state protocols", "abstract": "Assuming uniform subfield product expansion, we construct quantum low-density parity-check (qLDPC) codes with distances $\\Omega_\\epsilon(N/\\log^2N)$ and at least $N^{1-\\epsilon}$ individually addressable logical CCZ gates on pairwise disjoint triples of logical qubits, for every fixed $0<\\epsilon<1$. With all logical qubits outside these triples initialized to $|0\\rangle$, any subset of the corresponding logical CCZ gates can be implemented with a transversal physical CCZ circuit. As applications, we obtain two nearly optimal magic state protocols: CCZ distillation with arbitrarily small overhead exponent $\\gamma \\rightarrow 0$ and error suppression of nearly linear order, and a magic state fountain that directly prepares $N^{1-\\epsilon}$ encoded CCZ magic states with nearly linear distance $\\Omega_\\epsilon(N/\\log^2N)$. The construction uses balanced products of expanding graph covers. The assumption concerns Reed--Solomon codes on three subfields of characteristic two and pairwise coprime extension degrees, a local hypothesis studied in a companion manuscript. We design the expanding graph covers to admit many common classical codewords, which yield logical operators whose pairings select the logical CCZ gates independently. Without the product expansion assumption, the graph covers also yield classical LDPC codes over a fixed field with almost linear dimension and linear distance that satisfy a multiplication property: the coordinatewise product of any three codewords lies in a second LDPC code of linear distance.", "url": "https://arxiv.org/abs/2611.23762", "type": "理论", "summary": "假设统一子域乘积展开，对于每个固定的 $0<\\epsilon<1$，我们在逻辑量子位的成对不相交三元组上构建距离 $\\Omega_\\epsilon(N/\\log^2N)$ 和至少 $N^{1-\\epsilon}$ 可单独寻址的逻辑 CCZ 门的量子低密度奇偶校验 (qLDPC) 代码。将这些三元组之外的所有逻辑量子位初始化为 $|0\\rangle$ 后，相应逻辑 CCZ 门的任何子集都可以使用横向物理 CCZ 电路来实现。作为应用，我们获得了两个近乎最优的魔法状态协议：具有任意小开销指数 $\\gamma \\rightarrow 0$ 和近线性阶误差抑制的 CCZ 蒸馏，以及直接准备 $N^{1-\\epsilon}$ 编码的具有近线性距离 $\\Omega_\\epsilon(N/\\log^2N)$ 的 CCZ 魔法状态的魔法状态喷泉。该结构使用扩展图形覆盖的平衡产品。该假设涉及特征二和成对互质扩展度的三个子域上的里德-所罗门编码，这是在配套手稿中研究的局部假设。\n\n我们设计扩展图覆盖来接纳许多常见的经典码字，这些码字产生逻辑运算符，其配对独立地选择逻辑 CCZ 门。在没有乘积展开假设的情况下，图覆盖也可以在具有几乎线性维度和线性距离的固定域上产生满足乘法性质的经典LDPC码：任何三个码字的坐标乘积位于线性距离的第二LDPC码中。", "authors": [{"name": "Shi Jie Samuel Tan"}, {"name": "Guanyu Zhu"}], "featured_authors": [{"name": "Shi Jie Samuel Tan"}, {"name": "Guanyu Zhu"}], "author_count": 2}, {"id": "2611.23784", "category": "quant-ph", "title": "Subsystem evolution in the history state formalism", "abstract": "We present a relational framework for characterizing the evolution of quantum composite systems, based on the correlations within a history state describing the whole evolution relative to a quantum reference clock. While total system-clock entanglement entropy consistently measures the unitary evolution of the closed global system, a different picture emerges for the reduced state of an open subsystem, whose evolution is generally non-unitary due to environmental coupling. We introduce a general formalism that quantifies open-subsystem dynamics using a subsystem-clock mutual information derived from the history state. We demonstrate that this quantity serves as a consistent quantifier of subsystem evolution with respect to a given clock basis, can be applied to arbitrary dynamics, and reduces to system-time entanglement entropy in the global limit. Furthermore, maximizing this measure over all clock bases yields a basis-independent bound on the maximum evolution achievable relative to the clock, directly linked to the difference between the subsystem's entanglement with the rest of the history state and its entanglement with the environment. Finally, we derive analytical expressions for qubit clocks, illustrate our results using spin 1/2 and spin 1 quantum walks, and present a full matrix formalism of Kraus operators for describing the most general subsystem evolution.", "url": "https://arxiv.org/abs/2611.23784", "type": "理论", "summary": "我们提出了一个关系框架，用于表征量子复合系统的演化，基于描述相对于量子参考时钟的整个演化的历史状态内的相关性。虽然总系统时钟纠缠熵始终测量封闭全局系统的单一演化，但开放子系统的简化状态却出现了不同的情况，由于环境耦合，其演化通常是非单一的。我们引入了一种通用形式主义，它使用从历史状态导出的子系统时钟互信息来量化开放子系统动态。我们证明，这个量可以作为子系统演化相对于给定时钟基础的一致量词，可以应用于任意动态，并在全局限制下减少到系统时间纠缠熵。此外，在所有时钟基础上最大化此测量结果会产生相对于时钟可实现的最大演化的独立于基础的界限，该界限与子系统与其余历史状态的纠缠及其与环境的纠缠之间的差异直接相关。\n\n最后，我们推导了量子位时钟的解析表达式，使用自旋 1/2 和自旋 1 量子行走说明了我们的结果，并提出了克劳斯算子的完整矩阵形式来描述最一般的子系统演化。", "authors": [{"name": "A. Boette"}, {"name": "F. Lomoc"}, {"name": "N. Canosa"}, {"name": "R. Rossignoli"}], "featured_authors": [{"name": "A. Boette"}, {"name": "F. Lomoc"}, {"name": "N. Canosa"}, {"name": "R. Rossignoli"}], "author_count": 4}, {"id": "2611.23789", "category": "quant-ph", "title": "Spectral Engineering of Charge Localization and Work Reliability in Collective Quantum Batteries", "abstract": "The performance of a quantum battery depends not only on how much energy it stores, but also on how rapidly useful charge can be restored after work extraction. We show how engineering the reservoir spectrum connects these properties in an interacting collective-spin battery. Interactions separate the Dicke transition frequencies, allowing frequency-selective pumping and loss to control where excitation accumulates and how populations move along the ladder. Analytical results relate the pump-to-loss ratio to charge localization, fluctuations, and extractable work. Two reservoirs producing the same mean charge can nevertheless exhibit markedly different localization and charging times. Under repeated extraction, finite-time recharging also generates correlations between successive work outputs. At matched mean work, these correlations can reverse the ordering of single-cycle and long-time fluctuations: a protocol with larger fluctuations in individual strokes can deliver more reliable accumulated work. An exact counting relation connects these statistics to net charging-energy transfer, while relaxation modes distinguish recovery of the stationary state from recovery of useful work. Finally, local dephasing redistributes population among collective-spin sectors, leading to an exact stationary symmetry-dilution law and a finite operating window for work extraction under a collective transverse controller.", "url": "https://arxiv.org/abs/2611.23789", "type": "理论", "summary": "量子电池的性能不仅取决于它存储的能量多少，还取决于功提取后恢复有用电荷的速度。我们展示了如何设计储库光谱将这些特性连接到相互作用的集体自旋电池中。相互作用将迪克跃迁频率分开，从而允许频率选择性泵浦和损耗来控制激发积累的位置以及群体如何沿着阶梯移动。分析结果将泵浦损耗比与电荷定位、波动和可提取功联系起来。然而，产生相同平均电荷的两个储层可能表现出明显不同的定位和充电时间。在重复提取的情况下，有限时间的充电也会在连续的工作输出之间产生相关性。在匹配的平均功中，这些相关性可以颠倒单周期和长期波动的顺序：单个冲程波动较大的协议可以提供更可靠的累积功。精确的计数关系将这些统计数据与净充电能量转移联系起来，而松弛模式则区分静止状态的恢复和有用功的恢复。\n\n最后，局部相移在集体自旋扇区之间重新分配人口，从而产生精确的平稳对称稀释定律和集体横向控制器下功提取的有限操作窗口。", "authors": [{"name": "He-Guang Xu"}, {"name": "G. D. de Moraes Neto"}], "featured_authors": [{"name": "He-Guang Xu"}, {"name": "G. D. de Moraes Neto"}], "author_count": 2}, {"id": "2611.23861", "category": "quant-ph", "title": "Aharonov-Bohm blockade of complete reversal in coupled Rabi cavities", "abstract": "When a common bias reverses two bistable fields, the system can pass through either of two single-reversal configurations on its way to the favored state. We show that interference between these two orders of reversal can block the final step. In a dimer of coupled quantum Rabi cavities, the four field configurations form a loop, and a complex photon-hopping amplitude threads it with an Aharonov-Bohm flux. Near half a flux quantum, the two paths to complete reversal interfere destructively: in microscopic simulations, a slow uniform sweep reverses one field with probability 0.998, although the final bias favors reversing both. A four-state model calibrated at zero bias predicts how the window of this Aharonov-Bohm blockade narrows with sweep time. The blocked state remains coherent. A differential pulse followed by a return sweep converts the relative phase of the two single-reversal configurations into a fringe in the joint field signs, with contrast 0.95. In a trimer, a phase gradient imprinted between sweeps determines whether the next sweep adds or removes a reversed field: reversing the second of two gradients changes the most probable outcome from three reversed fields to one.", "url": "https://arxiv.org/abs/2611.23861", "type": "理论+数值", "summary": "当公共偏置反转两个双稳态场时，系统可以通过两个单反转配置中的任何一个来达到所需的状态。我们证明这两个反转顺序之间的干扰可以阻止最后一步。在耦合量子拉比腔的二聚体中，四个场配置形成一个环，并且复杂的光子跳跃幅度将其与阿哈罗诺夫-玻姆通量相连接。接近半个通量量子时，完成反转的两条路径会产生破坏性干扰：在微观模拟中，缓慢的均匀扫描以 0.998 的概率反转一个场，尽管最终的偏置有利于反转两者。在零偏置下校准的四态模型可以预测阿哈罗诺夫-玻姆封锁的窗口如何随着扫描时间而变窄。阻塞状态保持一致。差分脉冲后进行返回扫描，将两个单反转配置的相对相位转换为联合场符号中的条纹，对比度为 0.95。\n\n在三聚体中，扫描之间印记的相位梯度决定下一次扫描是否添加或删除反向场：反转两个梯度中的第二个会将最可能的结果从三个反向场更改为一个。", "authors": [{"name": "Shu He"}, {"name": "Liwei Duan"}], "featured_authors": [{"name": "Shu He"}, {"name": "Liwei Duan"}], "author_count": 2}, {"id": "2611.23956", "category": "quant-ph", "title": "Faster than square-root run-time in adiabatic quantum algorithms for Exact Cover 3", "abstract": "By intertwining ideas from sequential and adiabatic quantum computing, we propose a quantum algorithm for the problem class Exact Cover 3, which is a sub-class of 3-satisfiability (3-SAT) problems and NP (nondeterministic polynomial time) complete. We find a quantum run-time which is significantly faster than the square-root run-time $N\\to N^{1/2}$ of the Grover algorithm. Depending on the structure of the problem (e.g., connectivity of clauses), the run-time scaling may range from approximately third root $N\\to N^{1/3}$ to nearly fourth root $N\\to N^{1/4}$, possibly even faster.", "url": "https://arxiv.org/abs/2611.23956", "type": "数值", "summary": "通过将顺序量子计算和绝热量子计算的思想交织在一起，我们提出了一种针对问题类 Exact Cover 3 的量子算法，该问题是 3 可满足性 (3-SAT) 问题和 NP（非确定性多项式时间）完全问题的子类。我们发现量子运行时间明显快于 Grover 算法的平方根运行时间 $N\\to N^{1/2}$。根据问题的结构（例如子句的连通性），运行时缩放范围可能从大约第三根 $N\\to N^{1/3}$ 到接近第四根 $N\\to N^{1/4}$，甚至可能更快。", "authors": [{"name": "Gernot Schaller"}, {"name": "Ralf Schützhold"}], "featured_authors": [{"name": "Gernot Schaller"}, {"name": "Ralf Schützhold"}], "author_count": 2}, {"id": "2611.23971", "category": "quant-ph", "title": "Quantum Mpemba effect in a driven-dissipative atom-waveguide coupled system", "abstract": "The quantum Mpemba effect (QME) describes the counterintuitive phenomenon in which a more strongly perturbed quantum system relaxes toward its steady state faster than a less perturbed one. Here, we investigate the QME in a weakly driven-dissipative atomic array coupled to a one-dimensional chiral waveguide. Starting from the steady state, we introduce a local quench by resetting a single atom to its ground state and examine the subsequent relaxation dynamics. We find that quenching atoms near the array boundaries induces faster initial relaxation through enhanced coupling to superradiant modes and direct photon emission into the waveguide, giving rise to an edge-enhanced QME. Strong directional decay further amplifies this effect by promoting the spatial accumulation of superradiant modes near the preferred boundary, leading to a skin-enhanced QME. At later times, relaxation is increasingly governed by long-lived subradiant modes localized predominantly in the bulk of the array. By coupling two atomic arrays with different interparticle spacings, we further demonstrate an interface-induced QME, where quenching an atom near the interface makes the system relax more slowly at early times but approach its steady state faster at later times, owing to weak participation in both superradiant and subradiant modes. Our findings reveal how the spatial structure of collective decay modes and directional dissipation jointly govern anomalous quantum relaxation, offering potential routes toward accelerated steady-state preparation in waveguide QED systems.", "url": "https://arxiv.org/abs/2611.23971", "type": "理论", "summary": "量子姆彭巴效应 (QME) 描述了一种违反直觉的现象，其中扰动较强的量子系统比扰动较小的量子系统更快地松弛到稳态。在这里，我们研究了耦合到一维手性波导的弱驱动耗散原子阵列中的 QME。从稳态开始，我们通过将单个原子重置为其基态来引入局部淬灭，并检查随后的弛豫动力学。我们发现，阵列边界附近的淬灭原子通过增强与超辐射模式的耦合和直接光子发射到波导中来诱导更快的初始弛豫，从而产生边缘增强的 QME。强方向衰减通过促进首选边界附近超辐射模式的空间积累进一步放大了这种效应，从而导致趋肤增强的 QME。后来，弛豫越来越受到主要集中在阵列主体中的长寿命次辐射模式的控制。\n\n通过耦合具有不同粒子间间距的两个原子阵列，我们进一步证明了界面诱导的 QME，其中界面附近的原子淬火使得系统在早期松弛得更慢，但由于对超辐射和次辐射模式的参与较弱，因此在后期更快地接近其稳态。我们的研究结果揭示了集体衰变模式和定向耗散的空间结构如何共同控制反常量子弛豫，为波导 QED 系统中加速稳态制备提供了潜在途径。", "authors": [{"name": "Hao-Kai Chi"}, {"name": "H. H. Jen"}], "featured_authors": [{"name": "Hao-Kai Chi"}, {"name": "H. H. Jen"}], "author_count": 2}, {"id": "2611.24035", "category": "quant-ph", "title": "Vanilla Adiabatic Quantum Optimization Can Have Subexponential Advantage", "abstract": "We construct a family of objective functions $f \\colon \\{0,1\\}^n \\to \\mathbb{R}$ for which vanilla adiabatic quantum optimization along $H(s) = -(1-s)\\sum_{i=1}^n X_i + s\\sum_x f(x)\\lvert x\\rangle\\!\\langle x\\rvert$ finds the global minimizer in $\\operatorname{poly}(n)$ time, whereas any classical algorithm requires $\\exp(n^{\\Omega(1)})$ time to do so in the black-box model. Our result is achieved by replacing the linearization technique in an earlier work of Leng et al. ( arXiv:2504.14841 ), which establishes a similar subexponential quantum speedup using a transverse field Ising mixer rather than $-\\sum_{i=1}^n X_i$.", "url": "https://arxiv.org/abs/2611.24035", "type": "理论+数值", "summary": "我们构建了一系列目标函数 $f \\colon \\{0,1\\}^n \\to \\mathbb{R}$，其中沿着 $H(s) = -(1-s)\\sum_{i=1}^n X_i + s\\sum_x f(x)\\lvert x\\rangle\\!\\langle x\\rvert$ 的普通绝热量子优化在 $\\operatorname{poly}(n)$ 时间内找到全局最小化器，而任何经典算法在黑盒模型中需要 $\\exp(n^{\\Omega(1)})$ 时间来完成此操作。我们的结果是通过替换 Leng 等人早期工作中的线性化技术来实现的。 ( arXiv:2504.14841 )，它使用横向场伊辛混合器而不是 $-\\sum_{i=1}^n X_i$ 建立了类似的次指数量子加速。", "authors": [{"name": "Yufan Zheng"}], "featured_authors": [{"name": "Yufan Zheng"}], "author_count": 1}, {"id": "2611.24053", "category": "quant-ph", "title": "Odd-Even Effects on Liouvillian Spectra and Relaxation Dynamics in Boundary-Driven Spin Chains", "abstract": "We investigate odd-even effects on Liouvillian spectra and relaxation dynamics in boundary-driven XY and cluster chains. With the bulk couplings and boundary dissipation rule fixed, the parity of chain length determines whether non-decaying oscillatory modes exist. Consequently, odd- and even-sized chains exhibit qualitatively different dynamical behaviors. We trace this mechanism to the coupling between bulk Majorana paths and the boundary jump operators. An isolated path supports undamped modes, and products of an even number of its Majorana operators span a non?decaying subspace of even operators. This structure yields nonzero purely imaginary eigenvalues of the Liouvillian and persistent contributions to bond correlations or magnetization after preparation in product states. The mechanism extends to cluster interactions of even range under a fixed boundary dissipation rule. The existence and frequencies of the persistent modes are independent of the magnitudes of the positive boundary dissipation rates. Our results unveil how chain parity controls the existence of persistent dynamics.", "url": "https://arxiv.org/abs/2611.24053", "type": "理论", "summary": "我们研究了边界驱动 XY 和簇链中刘维尔光谱和弛豫动力学的奇偶效应。在体耦合和边界耗散规则固定的情况下，链长度的奇偶性决定是否存在非衰减振荡模式。因此，奇数和偶数大小的链表现出性质不同的动力学行为。我们将这种机制追溯到批量马约拉纳路径和边界跳跃算子之间的耦合。孤立路径支持无阻尼模式，并且偶数个马约拉纳算子的乘积跨越偶数算子的非衰变子空间。该结构产生刘维尔的非零纯虚数特征值以及在产物状态中制备后对键相关性或磁化强度的持续贡献。该机制扩展到固定边界耗散规则下偶数范围的簇相互作用。持续模式的存在和频率与正边界耗散率的大小无关。我们的结果揭示了链奇偶校验如何控制持久动态的存在。", "authors": [{"name": "Zhen-Yu Zheng"}, {"name": "Shu Chen"}], "featured_authors": [{"name": "Zhen-Yu Zheng"}, {"name": "Shu Chen"}], "author_count": 2}, {"id": "2611.24054", "category": "quant-ph", "title": "Reliability of quantum communication over erasure channels", "abstract": "Quantum information can be reliably transmitted at rates below the quantum capacity with an error that vanishes as the number of channel uses grows. The reliability function characterizes the optimal exponential decay rate of this error. For quantum erasure channels with a prime input dimension, we determine the reliability function exactly at all positive communication rates below capacity that meet or exceed an explicit critical rate. Notably, stabilizer coding strategies attain this optimal reliability throughout this regime.", "url": "https://arxiv.org/abs/2611.24054", "type": "理论", "summary": "量子信息可以以低于量子容量的速率可靠地传输，并且随着信道使用数量的增加，误差消失。可靠性函数表征了该误差的最佳指数衰减率。对于具有主要输入维度的量子擦除通道，我们在低于满足或超过明确临界速率的容量的所有正通信速率下精确确定可靠性函数。值得注意的是，稳定器编码策略在整个范围内实现了最佳可靠性。", "authors": [{"name": "Hongyu Mao"}, {"name": "Kun Fang"}], "featured_authors": [{"name": "Hongyu Mao"}, {"name": "Kun Fang"}], "author_count": 2}, {"id": "2611.24089", "category": "quant-ph", "title": "Quantum Annealing with a Quantum Neural Network: Width of Annealing Matters", "abstract": "Quantum annealing is a promising quantum algorithm for dealing with computationally hard optimization problems. Currently available hardware can implement the algorithm for a significant class of Hamiltonian problems. However, its performance is especially limited in discontinuous quantum phase transitions, where the energy gap shrinks exponentially with system size. In this paper, we introduce an extension of quantum annealing to a quantum neural network and study its performance in a number of prototypical optimization problems. In particular, we observe that already a random quantum annealing network of width W = 2 can exponentially reduce the number of evolution layers or depth of the annealing process in the quantum search problem. By tuning the network parameters the search problem can be solved with exponentially small errors by a quantum perceptron of depth L = 1 and width W = 2. The findings show that width of a quantum annealing network is critical to enhance the success probability of the algorithm by providing a larger and learnable evolution space for the annealing process.", "url": "https://arxiv.org/abs/2611.24089", "type": "理论+数值", "summary": "量子退火是一种很有前途的量子算法，用于处理计算困难的优化问题。当前可用的硬件可以实现针对一类重要的哈密顿问题的算法。然而，它的性能在不连续量子相变中尤其受到限制，其中能隙随着系统尺寸呈指数级缩小。在本文中，我们将量子退火引入到量子神经网络中，并研究了其在许多原型优化问题中的性能。特别是，我们观察到宽度 W = 2 的随机量子退火网络可以指数级减少量子搜索问题中的演化层数或退火过程的深度。通过调整网络参数，可以通过深度 L = 1 和宽度 W = 2 的量子感知器以指数级小误差解决搜索问题。研究结果表明，量子退火网络的宽度对于通过为退火过程提供更大且可学习的演化空间来提高算法的成功概率至关重要。", "authors": [{"name": "Mojtaba Asadollahi"}, {"name": "Danial Khajehzadeh"}, {"name": "Abolfazl Ramezanpour"}], "featured_authors": [{"name": "Mojtaba Asadollahi"}, {"name": "Danial Khajehzadeh"}, {"name": "Abolfazl Ramezanpour"}], "author_count": 3}, {"id": "2611.24174", "category": "quant-ph", "title": "Gradient Blindness in Adaptive Architecture Search for IQP Born Machines", "abstract": "Instantaneous quantum polynomial (IQP) Born machines learn a probability distribution from data with a circuit of commuting gates that a classical computer trains at hundreds of qubits. Adaptive algorithms grow a sparse circuit from a small seed by adding in every round the candidate gates with the largest loss gradient. Such algorithms never add a candidate whose gradient vanishes, so the choice of seed decides which circuits they can reach. Here we show that a candidate gate has a nonzero gradient for some angles of the circuit exactly when its generator is the sum of an odd number of linearly independent generators already in the circuit. The common seed of one-qubit gates therefore never adds a gate on an even number of qubits, which exact gradients on 12 qubits confirm. A seed of one-qubit gates plus the edges of the Chow-Liu tree sees every candidate, and its circuits match the full circuits on 12 and 16 qubits with 10 to 13 percent of their parameters. At 484 qubits, a heredity pool keeps the search over higher-order gates feasible, and the circuits grown from this seed reach a lower test loss than the dense two-body circuit with 6 percent of its parameters, although the higher-order gates add no gain.", "url": "https://arxiv.org/abs/2611.24174", "type": "数值", "summary": "瞬时量子多项式 (IQP) 机器通过传统计算机在数百个量子位上训练的交换门电路从数据中学习概率分布。自适应算法通过在每一轮中添加具有最大损失梯度的候选门，从一个小种子中成长出一个稀疏电路。此类算法永远不会添加梯度消失的候选者，因此种子的选择决定了它们可以到达哪些电路。在这里，我们表明，当候选门的生成器是电路中已有的奇数个线性独立生成器的总和时，候选门对于电路的某些角度具有非零梯度。因此，单量子位门的公共种子永远不会在偶数个量子位上添加门，这由 12 个量子位上的精确梯度所证实。单量子位门的种子加上 Chow-Liu 树的边缘可以看到每个候选者，其电路与 12 和 16 量子位上的完整电路相匹配，其参数为 10% 到 13%。\n\n在 484 个量子位上，遗传池使对高阶门的搜索变得可行，并且从该种子生成的电路比参数为 6% 的密集二体电路达到了更低的测试损失，尽管高阶门没有增加任何增益。", "authors": [{"name": "Sebastian Wölckert"}, {"name": "Gerhard Stenzel"}, {"name": "Michael Poppel"}, {"name": "Claudia Linnhoff-Popien"}, {"name": "Jonas Stein"}], "featured_authors": [{"name": "Sebastian Wölckert"}, {"name": "Gerhard Stenzel"}, {"name": "Michael Poppel"}, {"name": "Claudia Linnhoff-Popien"}, {"name": "Jonas Stein"}], "author_count": 5}, {"id": "2611.24311", "category": "quant-ph", "title": "A Convex-Roof Affinity-Square Measure of Quantum Imaginarity", "abstract": "Quantum imaginarity characterizes the part of a quantum state that cannot be represented by real density matrices in a fixed reference basis. We study an affinity-square measure of imaginarity for pure states and its convex-roof extension to mixed states. The pure state quantity is defined by minimizing the affinity-square measure over the convex set of real states. This optimization admits a closed expression determined by the modulus of the conjugation overlap between a state and its complex conjugate. The measure vanishes precisely when the state is real up to a global phase. We prove that the convex-roof extension is faithful, convex, monotone under real operations, and nonincreasing on average under selective real operations. For arbitrary single-qubit mixed states, we evaluate the convex roof exactly and express it in terms of the imaginary component of the off-diagonal density-matrix element. We also compare pure-state imaginarity with an auxiliary affinity-square coherence functional and give the corresponding phase weights.", "url": "https://arxiv.org/abs/2611.24311", "type": "理论+数值", "summary": "量子虚数表征了量子态中无法用固定参考基础中的实密度矩阵表示的部分。我们研究了纯态虚数的亲和平方度量及其对混合态的凸顶扩展。纯状态量是通过最小化凸实状态集上的亲和平方测度来定义的。该优化允许由状态与其复共轭之间的共轭重叠模确定的闭合表达式。当国家真正达到全球阶段时，这一措施就会消失。我们证明了凸顶延拓在实数运算下是忠实的、凸的、单调的，并且在选择性实数运算下平均不增。对于任意单量子位混合态，我们精确地评估凸屋顶并用非对角密度矩阵元素的虚部来表达它。我们还将纯态虚数与辅助亲和平方相干函数进行比较，并给出相应的相位权重。", "authors": [{"name": "Nan-Nan Guan"}, {"name": "Meng-Li Guo"}, {"name": "Xue-Na Zhu"}, {"name": "Zhi-Xiang Jin"}, {"name": "Yan-Hui Zhou"}], "featured_authors": [{"name": "Nan-Nan Guan"}, {"name": "Meng-Li Guo"}, {"name": "Xue-Na Zhu"}, {"name": "Zhi-Xiang Jin"}, {"name": "Yan-Hui Zhou"}], "author_count": 5}, {"id": "2611.24411", "category": "quant-ph", "title": "Long-distance continuous variable entanglement distribution over deployed fibre", "abstract": "Continuous-variable (CV) entanglement offers deterministic generation and room-temperature coherent detection for quantum networks, but distributing it over deployed fibre has been hindered by the need to stabilise optical phase, polarisation, and timing at remote receivers. Here we demonstrate, to our knowledge, the first distribution of CV entanglement over deployed metropolitan fibre using independent coherent receivers. The two modes of a two-mode squeezed vacuum state are delivered to remote nodes through 23 km ($\\approx 7$ dB loss) and 450 m ($\\approx 1$ dB loss) deployed fibre links. Each node uses its own free-running laser and polarisation-diverse coherent receiver. Co-propagating pilot tones enable digital recovery of timing, phase and polarisation, while inter-mode correlations fix the quadrature alignment. We certify entanglement with a Simon-Duan value of $1.915\\pm 0.013$, below the separability bound of 2 and a logarithmic negativity of $0.067\\pm0.011$. By replacing optical stabilisation with digital reconstruction, our approach offers a practical route towards scalable CV quantum networks.", "url": "https://arxiv.org/abs/2611.24411", "type": "理论", "summary": "连续变量（CV）纠缠为量子网络提供了确定性生成和室温相干检测，但由于需要稳定远程接收器的光相位、偏振和定时，因此在部署的光纤上分布它受到了阻碍。在这里，据我们所知，我们使用独立的相干接收器展示了部署的城域光纤上的 CV 纠缠的第一个分布。双模压缩真空状态的两种模式通过 23 km（$\\约 7$ dB 损耗）和 450 m（$\\约 1$ dB 损耗）部署的光纤链路传送到远程节点。每个节点都使用自己的自由运行的激光器和偏振分集相干接收器。共同传播的导频音可以实现定时、相位和偏振的数字恢复，而模式间相关则可以修复正交对准。我们证明纠缠的 Simon-Duan 值为 $1.915\\pm 0.013$，低于可分离性界限 2，对数负值为 $0.067\\pm0.011$。通过用数字重建取代光学稳定，我们的方法为可扩展的 CV 量子网络提供了一条实用的途径。", "authors": [{"name": "Huy Q. Nguyen"}, {"name": "Benjamin L. Larsen"}, {"name": "Luiz C. C. P. Filho"}, {"name": "Yijian Meng"}, {"name": "Mikael Ø. Lassen"}, {"name": "Jonas S. Neergaard-Nielsen"}, {"name": "Tobias Gehring"}, {"name": "Ulrik L. Andersen"}, {"name": "Adnan A. E. Hajomer"}], "featured_authors": [{"name": "Huy Q. Nguyen"}, {"name": "Benjamin L. Larsen"}, {"name": "Luiz C. C. P. Filho"}, {"name": "Tobias Gehring"}, {"name": "Ulrik L. Andersen"}, {"name": "Adnan A. E. Hajomer"}], "author_count": 9}, {"id": "2611.24444", "category": "quant-ph", "title": "Efficient simulation of variational quantum circuits: representation, accuracy and CPU/GPU allocation", "abstract": "Classical circuit simulation supports quantum software development and verification and provides a baseline for assessing quantum advantage. We compare gate-based statevector simulation, direct Pauli evolution and matrix product states for molecular and spin Variational Hamiltonian Ansatze and hardware-efficient ansatze on CPU/GPU systems, varying width, depth, precision and resource allocation. In the tested implementations, direct Pauli evolution benefits complex molecular VHA, whereas GPUs accelerate wider spin and hardware efficient circuits. Matrix product state is useful when limited entanglement permits accurate compression; corrected CPU FP32 can meet the tested tolerance while costing more than FP64. Workload size, startup, worker memory and task-specific profiling can change the preferred allocation. Matched NumPy Pauli updates accelerate two-layer full LiH by 3.45-fold; the GPU gives approximately 30-fold acceleration over 18-thread Aer for 28-qubit, four-layer TFIM, both in FP64. We provide a procedure for choosing representation, precision and worker allocation jointly, comparing the cost of complete energy evaluations under accuracy, memory and core constraints.", "url": "https://arxiv.org/abs/2611.24444", "type": "理论+数值", "summary": "经典电路仿真支持量子软件开发和验证，并为评估量子优势提供基线。我们比较了分子和自旋变分哈密顿量 Ansatze 的基于门的状态向量模拟、直接泡利演化和矩阵乘积状态以及 CPU/GPU 系统上的硬件高效 ansatze，以及不同的宽度、深度、精度和资源分配。在测试的实现中，直接泡利演化有利于复杂的分子 VHA，而 GPU 则加速更广泛的自旋和硬件高效电路。当有限的纠缠允许精确压缩时，矩阵积态非常有用；修正后的CPU FP32可以满足测试的容差，但成本高于FP64。工作负载大小、启动、工作内存和特定于任务的分析可以更改首选分配。匹配的 NumPy Pauli 更新将两层全 LiH 加速 3.45 倍；对于 28 量子位、四层 TFIM（均采用 FP64），GPU 比 18 线程 Aer 提供大约 30 倍的加速。我们提供了一个联合选择表示、精度和工人分配的程序，比较在准确性、内存和核心约束下完成能源评估的成本。", "authors": [{"name": "Vojtěch Novák"}, {"name": "Radovan Rečka"}, {"name": "Ondřej Knebl"}, {"name": "Ivan Zelinka"}], "featured_authors": [{"name": "Vojtěch Novák"}, {"name": "Radovan Rečka"}, {"name": "Ondřej Knebl"}, {"name": "Ivan Zelinka"}], "author_count": 4}, {"id": "2611.24446", "category": "quant-ph", "title": "A unified approach to the time-dependent quantum harmonic oscillator via point transformations and Lie symmetries", "abstract": "We revisit the time-dependent harmonic oscillator (TDHO) in quantum mechanics based on the notion of equivalence transformations and Lie point symmetries. Within this framework, we give the most general point transformations depending on seven parameters which map from the TDHO to the usual harmonic oscillator (HO) and the other way around. As a byproduct we reconstruct the Schrödinger propagator (Mehler's kernel) for the time-independent harmonic oscillator. We demonstrate, without recourse to the Lewis--Riesenwert (LR) invariant, how Lie algebraic methods enable alternative derivation of the normalized wave functions of the TDHO by constructing solutions invariant under some specific subgroup of $\\SL(2,\\mathbb{R})$ combined with the gauge group. We further show that, on the relevant $\\SL(2,\\mathbb{R})$-invariant solution family, the Lewis--Riesenfeld operator defines a compatible second-order differential constraint, thereby clarifying its relation to the Lie symmetry structure of the TDHO.", "url": "https://arxiv.org/abs/2611.24446", "type": "理论+数值", "summary": "我们基于等价变换和李点对称性的概念重新审视量子力学中的瞬态谐振子（TDHO）。在此框架内，我们根据七个参数给出最一般的点变换，这些参数从 TDHO 映射到通常的谐振子 (HO)，反之亦然。作为副产品，我们重建了与时间无关的谐振子的薛定谔传播器（梅勒内核）。我们证明，在不求助于 Lewis-Riesenwert (LR) 不变量的情况下，李代数方法如何通过在 $\\SL(2,\\mathbb{R})$ 的某些特定子群与规范群结合下构建解不变量来实现 TDHO 归一化波函数的替代推导。我们进一步证明，在相关的$\\SL(2,\\mathbb{R})$不变解族上，Lewis--Riesenfeld算子定义了一个兼容的二阶微分约束，从而阐明了它与TDHO的李对称结构的关系。", "authors": [{"name": "F. Güngör"}, {"name": "J. Negro"}], "featured_authors": [{"name": "F. Güngör"}, {"name": "J. Negro"}], "author_count": 2}, {"id": "2611.24473", "category": "quant-ph", "title": "Bound entanglement as a trigonometric moment problem", "abstract": "Entangled states that are positive under partial transposition (PPT) are the main obstruction to a simple description of entanglement. We study three basic questions about them within a class of multiqubit states, the mixtures, with real but possibly negative weights, of products of equatorial spin coherent states of several groups of qubits: which PPT entangled states belong to the class, how robust their entanglement is to white noise, and how small their rank can be. In this class each question becomes a question about a truncated trigonometric moment problem. Every such state is PPT across every bipartition, and it is fully separable exactly when an associated multi-level Toeplitz matrix is the moment matrix of a positive measure on the torus. We answer the three questions exactly in the following cases. For three qubits, every rank-four PPT entangled state with nonzero Lorentz invariant belongs to the class after invertible local operators, which proves a working hypothesis of Garberg, Irgens and Myrheim and yields a complete set of invariants for this seven-dimensional family; among the states with vanishing invariant, exactly a one-parameter family belongs to it. For every three-qubit state built from an unextendible product basis, the white-noise threshold for full separability is $\\lambda^*=1-2/(1+\\sqrt{1+s})$ with a local-unitary invariant $s\\in(0,1]$, and $\\lambda^*=3-2\\sqrt2$ for the Shifts basis; a witness in closed form detects every entangled state of this family with eight local Pauli settings. For two groups of qubits we construct extremal states of minimal rank, and for three groups we determine the minimal rank of entanglement within the class in several configurations.", "url": "https://arxiv.org/abs/2611.24473", "type": "理论", "summary": "在部分转置（PPT）下为正的纠缠态是简单描述纠缠的主要障碍。我们研究一类多量子位态中关于它们的三个基本问题，即几组量子位的赤道自旋相干态乘积的具有实数但可能为负权重的混合：哪些 PPT 纠缠态属于该类，它们的纠缠对白噪声的鲁棒性如何，以及它们的等级可以有多小。在本课程中，每个问题都成为有关截断三角矩问题的问题。每个这样的状态都是跨每个二分的 PPT，并且当关联的多级托普利茨矩阵是环面上正测度的矩矩阵时，它是完全可分离的。我们在以下情况下准确回答这三个问题。对于三个量子位，每个具有非零洛伦兹不变量的四阶 PPT 纠缠态都属于可逆局部算子之后的类，这证明了 Garberg、Irgens 和 Myrheim 的工作假设，并为这个七维族提供了完整的不变量集；在具有消失不变量的状态中，恰好有一个单参数族属于它。\n\n对于从不可扩展的乘积基础构建的每个三量子位状态，完全可分离性的白噪声阈值是 $\\lambda^*=1-2/(1+\\sqrt{1+s})$，具有局部酉不变量 $s\\in(0,1]$，对于 Shifts 基础是 $\\lambda^*=3-2\\sqrt2$；封闭形式的见证人用八个局部泡利检测该族的每个纠缠态对于两组量子位，我们构建最小等级的极值状态，对于三组，我们确定几种配置中类内纠缠的最小等级。", "authors": [{"name": "Lilong Qian"}, {"name": "Teng Zhang"}], "featured_authors": [{"name": "Lilong Qian"}, {"name": "Teng Zhang"}], "author_count": 2}, {"id": "2611.24500", "category": "quant-ph", "title": "Sharp rank thresholds and cubic support in PPT extensions of completely symmetric states", "abstract": "For completely symmetric states on $d\\ge3$ parties of actual local rank $N\\ge3$, the least rank of an entangled state passing any prescribed finite positive level of the PPT extension hierarchy is $3d+N-3$. At equality, the two- and three-party marginals recover a ternary plane cubic shared by every extension. On this cubic the hierarchy becomes exact at a finite level precisely when every singularity outside the zero locus of the contraction quadratic is a split real node. We give the first exact level or an exact feasibility test for it, independent of $d$. On a smooth cubic the thresholds along the specified paths to the square of a flex tangent reduce to elliptic division and have unique rank-two Gram matrices. On reflection-invariant paths we obtain a quartic formula and the leading asymptotic constant. The least rank for entanglement itself is $3d+N-5$, and we classify equality. An explicit rational rank-nine three-qutrit state on a smooth cubic passes the first extension level and fails the second.", "url": "https://arxiv.org/abs/2611.24500", "type": "理论", "summary": "对于实际局部等级 $N\\ge3$ 的 $d\\ge3$ 方的完全对称状态，通过 PPT 扩展层次结构的任何规定的有限正级别的纠缠态的最低等级是 $3d+N-3$。在相等的情况下，两方和三方边际恢复了每个扩展共享的三元平面立方体。在这个三次方上，当收缩二次方的零轨迹之外的每个奇点都是分裂实数节点时，层次结构在有限级别上变得精确。我们给出第一个精确水平或精确的可行性测试，与 $d$ 无关。在平滑三次方上，沿指定路径到弯曲切线平方的阈值减少为椭圆除法，并具有唯一的二阶 Gram 矩阵。在反射不变路径上，我们获得四次公式和首渐近常数。纠缠本身的最低等级是$3d+N-5$，我们将相等分类。光滑立方体上的显式有理九阶三四态通过第一个扩展级别，但未通过第二个扩展级别。", "authors": [{"name": "Qian Lilong"}, {"name": "Teng Zhang"}], "featured_authors": [{"name": "Qian Lilong"}, {"name": "Teng Zhang"}], "author_count": 2}, {"id": "2611.24502", "category": "quant-ph", "title": "A Relativistic Quantum Mechanical Formulation of Wu-Shaknov Entanglements", "abstract": "It is suggested that a spontaneous formation of quantum mechanical entanglements does actually occur between spin, helicity and polarization states involved in creation-annihilation processes. A framework built up earlier that presumably affords a unified relativistic quantum mechanical description of free particle-antiparticle pairs of any spin is used to propose a comprehensive formulation of Wu-Shaknov entanglements. Explicit relationships between amplitudes and Born-like probabilities associated to incoming and outgoing states are obtained thereafter on the basis of certain theoretical assumptions. The behaviours of these relationships under the action of a dynamical group which is taken to supply observational correlations for different frames in spacetime are then specified. It appears that a modified version of some of the conventional conservation laws may afford a set of general selection rules for the formation of relativistic entanglements.", "url": "https://arxiv.org/abs/2611.24502", "type": "理论", "summary": "有人认为，量子力学纠缠的自发形成实际上确实发生在参与创造-湮灭过程的自旋、螺旋和偏振态之间。之前建立的框架可能为任何自旋的自由粒子-反粒子对提供统一的相对论量子力学描述，该框架被用来提出吴-沙克诺夫纠缠的综合公式。此后，基于某些理论假设，获得了与传入和传出状态相关的振幅和玻恩式概率之间的显式关系。然后指定这些关系在动态群作用下的行为，该动态群用于为时空中的不同框架提供观测相关性。一些传统守恒定律的修改版本似乎可以为相对论纠缠的形成提供一套一般选择规则。", "authors": [{"name": "J. G. Cardoso"}], "featured_authors": [{"name": "J. G. Cardoso"}], "author_count": 1}, {"id": "2611.24603", "category": "quant-ph", "title": "No-Go Theorems for Ordered Universal Entanglement Purification", "abstract": "Entanglement purification is a fundamental tool for obtaining high-fidelity entangled states used in various quantum technologies. It aims to increase the fidelity of noisy shared entangled states with a fixed maximally entangled state through LOCC. In distributed quantum systems, such as networks employing quantum repeaters, limited memory, probabilistic entanglement generation, and unequal storage times can leave a finite collection of nonidentical pairs. Their states may remain incompletely characterized even when calibrated preparation and storage records establish their fidelity ordering. Recent work has investigated whether fidelity ordering permits nontrivial universal purification. A nontrivial universal $n$-to-1 protocol must, conditioned on success, never lower the highest input fidelity and strictly increase it for at least one allowed joint input. Although no-go results have been established for a restricted class of LOCC protocols, the corresponding question for general LOCC has remained unresolved. Here, we study ordered universal purification under separable operations. Specifically, for every fixed finite $n\\ge2$, we prove that when independently prepared two-qubit pairs range over the full family of states above a fixed fidelity threshold $0\\le F_*<1$, any separable success map that never lowers the highest input fidelity on the allowed ordered inputs must preserve that fidelity exactly whenever it succeeds. This excludes nontrivial universal LOCC purification even for arbitrarily high input fidelities, without imposing a positive lower bound on success probability. ...", "url": "https://arxiv.org/abs/2611.24603", "type": "理论+数值", "summary": "纠缠纯化是获得各种量子技术中使用的高保真纠缠态的基本工具。它的目的是通过 LOCC 提高具有固定最大纠缠态的噪声共享纠缠态的保真度。在分布式量子系统中，例如采用量子中继器的网络，有限的内存、概率纠缠生成和不相等的存储时间可能会留下一组有限的不相同的对。即使校准的制备和存储记录建立了它们的保真度排序，它们的状态也可能仍然不完全表征。最近的工作研究了保真排序是否允许非平凡的通用纯化。一个非平凡的通用 $n$-to-1 协议必须以成功为条件，决不降低最高输入保真度，并严格提高至少一个允许的联合输入的保真度。尽管已经针对有限类别的 LOCC 协议确定了禁止结果，但一般 LOCC 的相应问题仍未解决。在这里，我们研究了可分离操作下的有序通用纯化。\n\n具体来说，对于每个固定的有限 $n\\ge2$，我们证明，当独立准备的两个量子位对在高于固定保真度阈值 $0\\le F_*<1$ 的整个状态族范围内时，任何从不降低允许的有序输入上的最高输入保真度的可分离成功映射必须在成功时准确地保留该保真度。即使对于任意高的输入保真度，这也排除了非平凡的通用 LOCC 纯化，而不对成功概率施加正的下限。 ...", "authors": [{"name": "C. L. Liu"}], "featured_authors": [{"name": "C. L. Liu"}], "author_count": 1}, {"id": "2611.24624", "category": "quant-ph", "title": "Instanton tunnelling as a verifiable benchmark for digital quantum simulation: circuit structure, classical simulability and hardware reproducibility", "abstract": "We use instanton-mediated tunnelling in the quartic double well as a benchmark for digital quantum simulation that is checkable against an exact answer at every step. The instanton enters through the classical analysis; the hardware tests the dynamics of the lattice model. A unary (single-excitation) encoding maps N lattice sites to N qubits, with the single-excitation dynamics as a reference that remains classically cheap at any N. For a second-order Trotter circuit with adjacent, equal-angle XX/YY pairs on each bond, we prove that the Schmidt rank across any cut is at most four at every gate boundary and at most two after each pair, independently of N. Matrix-product-state simulations of this gate list reproduce the exact splitting up to N = 48. For this bond-wise formula the admissible Trotter step shrinks roughly as N^-2, so one tunnelling period costs about N^3.3 two-qubit gates; a kinetic/potential splitting keeps the step near 0.065 up to N=128, so this scaling belongs to splitting the kinetic term bond by bond. At a coarser, separately bounded step we measure the full transfer at N=8 on two superconducting processors, recovering the lattice splitting to a few percent and its dependence on the barrier height, which at this resolution is set by the lattice rather than by the instanton. Over 9 repetitions, runs taken minutes apart agree to shot noise, while runs hours to weeks apart differ by up to 6.1%, also on a fixed set of qubits; with sessions as the sampling unit, the processors differ in the damping, while a difference in the splitting is not established. Normalising by the measured single-excitation population extends the usable depth about 4-fold but does not improve the splitting. A Gaussian start state, which needs no diagonalisation, reproduces the splitting of the eigenvector-based start to within 1.6 percentage points.", "url": "https://arxiv.org/abs/2611.24624", "type": "理论+数值", "summary": "我们使用四次双阱中的瞬子介导的隧道效应作为数字量子模拟的基准，可以在每一步中根据精确答案进行检查。瞬子通过经典分析进入；硬件测试晶格模型的动力学。一元（单激发）编码将 N 个晶格位点映射到 N 个量子位，以单激发动力学作为参考，在任何 N 下仍然保持经典便宜。对于每个键上具有相邻等角 XX/YY 对的二阶 Trotter 电路，我们证明任何切割的施密特等级在每个门边界处最多为 4，每对之后最多为 2，与 N 无关。此门列表的矩阵乘积状态模拟再现了高达 N 的精确分裂= 48。对于这个键式公式，允许的 Trotter 步骤大约收缩为 N^-2，因此一个隧道周期大约需要 N^3.3 个双量子位门；动力学/势能分裂使步长保持在 0.065 附近，直到 N=128，因此这种缩放属于将动力学项键逐键分裂。\n\n在更粗略的、单独有界的步骤中，我们在两个超导处理器上测量 N=8 处的完全传输，将晶格分裂恢复到百分之几及其对势垒高度的依赖性，在此分辨率下，势垒高度是由晶格而不是瞬子设置的。在 9 次重复中，间隔几分钟的运行与散粒噪声一致，而间隔数小时到几周的运行差异高达 6.1%，同样是在一组固定的量子位上；以会话为采样单位，处理器的阻尼不同，而分裂的差异不存在。通过测量的单激发群体进行归一化可将可用深度扩展约 4 倍，但不会改善分裂。高斯起始状态不需要对角化，可将基于特征向量的起始分裂再现到 1.6 个百分点以内。", "authors": [{"name": "Gerhard Hellstern"}, {"name": "Marc Maussner"}], "featured_authors": [{"name": "Gerhard Hellstern"}, {"name": "Marc Maussner"}], "author_count": 2}, {"id": "2611.24710", "category": "quant-ph", "title": "The magical memory cost of entanglement spectrum compression", "abstract": "How much quantum memory is needed to faithfully retain the entanglement spectrum of a bipartite pure state after separating out Bell pairs through local unitaries? We derive the exact tradeoff between Bell-pair yield, residual memory, and reconstruction fidelity under local unitaries, defining an operational measure of entanglement-spectrum complexity. Smoothed entanglement spread bounds this memory cost from below, while diverging nonlocal magic forces unbounded memory at any fixed positive fidelity. Chaotic circuit dynamics exhibit a transient memory peak whose height increases with system size, followed by declining cost despite continued entropy growth. A large typical Haar-random state requires only an accuracy-dependent memory, whereas stationary fermionic Gaussian states retain a growing cost with size. In the circuits studied, the multiscale spectral structure associated with entanglement catalysis also has a practical consequence for matrix product state compression, yielding a multiplicative overhead not captured by the conventional entropy-based bond dimension estimate.", "url": "https://arxiv.org/abs/2611.24710", "type": "理论", "summary": "通过局域酉分离出贝尔对后，需要多少量子存储器才能忠实地保留二分纯态的纠缠谱？我们得出了局部幺正下贝尔对产量、剩余记忆和重建保真度之间的精确权衡，定义了纠缠谱复杂性的操作度量。平滑的纠缠扩散从下方限制了内存成本，而发散的非局部魔法则在任何固定的正保真度下强制无限的内存。混沌电路动态表现出瞬态存储峰值，其高度随着系统尺寸的增加而增加，尽管熵持续增长，但成本却不断下降。大型典型哈尔随机状态仅需要依赖于精度的存储器，而固定费米子高斯状态则随着尺寸的增大而保留不断增长的成本。在所研究的电路中，与纠缠催化相关的多尺度谱结构也对矩阵乘积状态压缩具有实际影响，产生传统基于熵的键维估计无法捕获的乘法开销。", "authors": [{"name": "Matias Karjula"}, {"name": "Vilma Nieminen"}, {"name": "Teemu Ojanen"}, {"name": "Tapio Ala-Nissila"}, {"name": "Moein N. Ivaki"}], "featured_authors": [{"name": "Matias Karjula"}, {"name": "Vilma Nieminen"}, {"name": "Teemu Ojanen"}, {"name": "Tapio Ala-Nissila"}, {"name": "Moein N. Ivaki"}], "author_count": 5}, {"id": "2611.24783", "category": "quant-ph", "title": "Environment-assisted imaginary time evolution in feedback-based quantum algorithms", "abstract": "The Feedback-based Algorithm for Quantum Optimization (FALQON) prepares ground states without classical parameter optimization, but requires deep circuits and can stagnate away from the ground state as a consequence of barren plateaus and symmetry protection. In order to avoid stagnation, imaginary time evolution (ITE) layers can be incorporated into FALQON layers, enhancing FALQON convergence. However, applying a non-unitary ITE layer in a closed quantum system is not possible, and approximations must be made to use ITE on real hardware; using an open quantum system formulation to incorporate ITE into FALQON represents a better approach. We describe ITE as a quantum operation induced by an environment, and combine it with the FALQON feedback law. In simulations of a frustrated Ising chain (ANNNI) and of MaxCut, the resulting algorithm prepares the ground state starting from any initial state, where FALQON can fail, and needs fewer layers on average when the initial state is fixed for the two investigated problems. The CITE-FALQON advantage strongly depends on the system phase for the ANNNI chain, and on the graph weights for the MaxCut problem.", "url": "https://arxiv.org/abs/2611.24783", "type": "理论+数值", "summary": "基于反馈的量子优化算法（FALQON）无需经典参数优化即可准备基态，但需要深层电路，并且可能由于贫瘠平台和对称性保护而在远离基态时停滞不前。为了避免停滞，可以将虚时间演化（ITE）层合并到 FALQON 层中，从而增强 FALQON 收敛。然而，在封闭量子系统中应用非单一 ITE 层是不可能的，必须进行近似才能在真实硬件上使用 ITE；使用开放量子系统公式将 ITE 纳入 FALQON 是一种更好的方法。我们将 ITE 描述为由环境引起的量子操作，并将其与 FALQON 反馈定律相结合。在受挫伊辛链 (ANNNI) 和 MaxCut 的模拟中，所得算法从任何初始状态开始准备基态，其中 FALQON 可能会失败，并且当两个研究问题的初始状态固定时，平均需要更少的层。 CITE-FALQON 的优势很大程度上取决于 ANNNI 链的系统阶段以及 MaxCut 问题的图权重。", "authors": [{"name": "J. C. Bellizotti Souza"}, {"name": "M. C. de Oliveira"}], "featured_authors": [{"name": "J. C. Bellizotti Souza"}, {"name": "M. C. de Oliveira"}], "author_count": 2}, {"id": "2611.24798", "category": "quant-ph", "title": "Soft Mixture of Quantum Experts for Hybrid Quantum-Classical Learning", "abstract": "Quantum Machine Learning (QML) has attracted increasing interest as a possible route to construct feature representations that are difficult to reproduce with classical models. However, near-term QML architectures based on trainable parametrized quantum circuits remain affected by limited hardware resources, noise, and severe optimization difficulties such as barren plateaus. In this work we propose Soft-MoQE, a Soft Mixture of Quantum Experts architecture that replaces variational quantum training with the input-dependent selection and combination of fixed quantum feature maps. The model is composed of a heterogeneous pool of non-trainable quantum circuits, each defining a distinct embedding, and a classical gating network that learns how to weight these embeddings for each data point. We benchmark Soft-MoQE on three PCA-reduced tasks: MNIST parity, MNIST 10-class, and FashionMNIST. Soft-MoQE outperforms the single best expert, the uniform average of all experts and a linear baseline, achieving task-dependent performance comparable to that of a trainable quantum neural network, without optimizing any quantum parameter and with a quantum training cost that is lower by orders of magnitude. The analysis of the class- conditioned expert usage shows that the learned routing combines a few experts for each input, with a selection that depends on the class. These results support the learned routing among fixed quantum circuits as a trainability-aware design principle for hybrid QML.", "url": "https://arxiv.org/abs/2611.24798", "type": "理论+数值", "summary": "量子机器学习（QML）作为构建经典模型难以重现的特征表示的可能途径，引起了越来越多的兴趣。然而，基于可训练参数化量子电路的近期 QML 架构仍然受到有限的硬件资源、噪声和严重的优化困难（例如贫瘠平台）的影响。在这项工作中，我们提出了 Soft-MoQE，一种量子专家架构的软混合，它用依赖于输入的选择和固定量子特征图的组合来代替变分量子训练。该模型由不可训练的量子电路的异构池组成，每个池定义了不同的嵌入，以及学习如何对每个数据点的这些嵌入进行加权的经典门网络。我们在三个 PCA 简化任务上对 Soft-MoQE 进行基准测试：MNIST parity、MNIST 10-class 和 FashionMNIST。\n\nSoft-MoQE 优于单个最佳专家、所有专家的统一平均值和线性基线，实现了与可训练量子神经网络相当的任务相关性能，无需优化任何量子参数，并且量子训练成本低了几个数量级。对类条件专家使用情况的分析表明，学习路由为每个输入组合了一些专家，并根据类进行选择。这些结果支持固定量子电路之间的学习路由作为混合 QML 的可训练感知设计原则。", "authors": [{"name": "Valeria Repetto"}, {"name": "Romina D'Aurizio"}, {"name": "Piero Farinelli"}], "featured_authors": [{"name": "Valeria Repetto"}, {"name": "Romina D'Aurizio"}, {"name": "Piero Farinelli"}], "author_count": 3}, {"id": "2611.24852", "category": "quant-ph", "title": "The limits of magic-state cultivation", "abstract": "Fault tolerance is understood through Pauli algebra, which fails at non-Clifford gates. Circuits such as magic-state cultivation, which checks an encoded T state with physical T gates, have therefore lacked an exact theory of which faults are harmful. We develop such a theory and show that, for any circuit that prepares a magic state with non-Clifford gates and postselection, one stabilizer code on the non-Clifford gates decides which faults are harmful. This ties cultivation to distillation, bounds its T-count from below and gives an exact test. For a single check on an ideally encoded state, the fault distance reduces to Pauli algebra on the code. As a use case, we analyze the S gates that have stood in for T gates in the design of cultivation. We show that this proxy can only overstate the fault distance of such a check, and that the checks in use, on color and surface codes, tolerate at most half as many faults as their code allows. The theory also yields nearest-neighbor checks that keep the full distance, certified up to code distance nine.", "url": "https://arxiv.org/abs/2611.24852", "type": "理论", "summary": "容错是通过泡利代数来理解的，泡利代数在非克利福德门上失败。因此，诸如魔法状态培养之类的电路（通过物理 T 门检查编码的 T 状态）缺乏关于哪些故障是有害的确切理论。我们发展了这样一种理论，并表明，对于任何使用非克利福德门和后选择准备神奇状态的电路，非克利福德门上的一个稳定器代码决定哪些故障是有害的。这将栽培与蒸馏联系起来，从下面限制了它的 T 计数并给出了精确的测试。对于理想编码状态的单次检查，故障距离减少为代码上的泡利代数。作为一个用例，我们分析了在栽培设计中替代 T 门的 S 门。我们表明，该代理只能夸大此类检查的故障距离，并且正在使用的颜色和表面代码检查最多可以容忍其代码允许的故障数量的一半。该理论还产生了保持完整距离的最近邻检查，经认证可达代码距离九。", "authors": [{"name": "Llorenç Balada Gaggioli"}, {"name": "Jakub Mareček"}], "featured_authors": [{"name": "Llorenç Balada Gaggioli"}, {"name": "Jakub Mareček"}], "author_count": 2}, {"id": "2611.24885", "category": "quant-ph", "title": "Quantum Simulation of First-Quantised Chemistry with a Sum-of-Squares Representation", "abstract": "Calculating molecular energies is expected to be an important application of quantum computers, but the most efficient algorithms to achieve this typically have significant space requirements. Scaling quantum processors to thousands of logical qubits is a daunting engineering challenge, so developing algorithms that run with reduced qubit requirements is of particular importance. Moreover, most algorithms are benchmarked on active spaces with about as many orbitals as electrons, missing dynamical correlation which is necessary to describe real chemistry. Capturing this correlation requires several times more orbitals than electrons, even in compact atomic-orbital basis sets. This low-filling regime favours first quantisation, where each electron is represented by a number of qubits that grows only logarithmically with the number of orbitals. Whether this approach translates into a practical advantage in orbital basis sets of realistic size, however, has been unclear. Here, we develop a first-quantised phase estimation algorithm for generic orbital basis sets, based on a non-convex sum-of-squares representation of the Hamiltonian and spectral-gap amplification. We compare it with the state-of-the-art second-quantised algorithm, compiling both with the same techniques at the logical level. For six molecules with 4 to 24 electrons in 5 to 14 times as many orbitals, our first-quantised method needs up to 16 times fewer Toffoli gates than the second-quantised algorithm in the low-qubit regime, where only a few hundred logical qubits are available. It stays cheaper up to between several hundred and about 1\\,400 qubits, and its smallest qubit count is 1.4 to 2 times lower than in second quantisation. In the low-qubit and low-filling regime, our algorithm is therefore the method of choice for chemistry in orbital basis sets.", "url": "https://arxiv.org/abs/2611.24885", "type": "理论+数值", "summary": "计算分子能量预计将成为量子计算机的一个重要应用，但实现这一目标的最有效算法通常需要大量空间。将量子处理器扩展到数千个逻辑量子位是一项艰巨的工程挑战，因此开发以减少的量子位要求运行的算法尤为重要。此外，大多数算法都是在活性空间上进行基准测试，其轨道数量与电子差不多，缺少描述真实化学所必需的动态相关性。即使在紧凑的原子轨道基组中，捕获这种相关性也需要比电子多几倍的轨道。这种低填充状态有利于第一次量子化，其中每个电子由多个量子位表示，这些量子位仅随轨道数量呈对数增长。然而，这种方法是否转化为实际尺寸的轨道基组的实际优势尚不清楚。在这里，我们基于哈密顿量和谱间隙放大的非凸平方和表示，为通用轨道基组开发了一种第一量化相位估计算法。\n\n我们将其与最先进的第二量化算法进行比较，在逻辑级别上使用相同的技术进行编译。对于在 5 到 14 倍轨道上具有 4 到 24 个电子的 6 个分子，我们的第一量化方法需要的 Toffoli 门比低量子位体系中的第二量化算法少 16 倍，低量子位体系中只有几百个逻辑量子位可用。它在数百至约 1\\,400 个量子位之间保持更便宜，并且其最小量子位计数比第二量化低 1.4 至 2 倍。因此，在低量子位和低填充状态下，我们的算法是轨道基组化学的首选方法。", "authors": [{"name": "Aleksei V. Ivanov"}, {"name": "Christoph Sünderhauf"}, {"name": "Jon Kunjummen"}, {"name": "Nick S. Blunt"}, {"name": "Róbert Izsák"}], "featured_authors": [{"name": "Aleksei V. Ivanov"}, {"name": "Christoph Sünderhauf"}, {"name": "Jon Kunjummen"}, {"name": "Nick S. Blunt"}, {"name": "Róbert Izsák"}], "author_count": 5}, {"id": "2611.24890", "category": "quant-ph", "title": "Residual-Algebraic Design of Symmetry-Preserving Variational Quantum Circuits", "abstract": "Symmetry-preserving (SP) variational quantum circuits restrict evolution to physically relevant sectors of Hilbert space, but symmetry preservation alone does not guarantee accessibility within those sectors. We show that a restricted generator set can possess a residual dynamical Lie algebra whose commutant further decomposes the target symmetry sector into invariant blocks. The associated block populations are conserved and impose a kinematic upper bound on the fidelity with a target state. We then invert this diagnostic into a circuit-design principle: candidate SP generators can be screened before variational optimization by asking whether they break the residual commutant, which invariant blocks they couple, and what adjoint module they generate under the residual algebra. For two orthogonal residual blocks we prove that a single elementary real inter-block rotation generates the full orthogonal algebra. We further derive a complex escape criterion: if the real and imaginary parts of an inter-block seed are independent over the residual intertwiner algebra, the generated module is the full complex coupling space and the enlarged algebra becomes special unitary. A connected residual-block graph yields a natural multi-block generalization and suggests minimum-cost spanning-tree circuit design. We demonstrate this design principle in the XXZ and Hubbard models, where residual-algebra screening identifies SP circuit extensions that remove the relevant accessibility obstructions. These examples establish a unified route from residual-symmetry diagnosis and fidelity bounds to predictive quantum circuit design.", "url": "https://arxiv.org/abs/2611.24890", "type": "理论+数值", "summary": "保对称（SP）变分量子电路将演化限制在希尔伯特空间的物理相关部分，但仅保对称性并不能保证这些部分内的可访问性。我们证明，受限生成器集可以拥有残差动态李代数，其交换子进一步将目标对称扇区分解为不变块。相关的块群是保守的，并对目标状态的保真度施加运动学上限。然后，我们将此诊断转化为电路设计原则：可以在变分优化之前通过询问候选 SP 生成器是否破坏剩余交换子、它们耦合哪些不变块以及它们在剩余代数下生成什么伴随模块来筛选。对于两个正交残差块，我们证明单个基本实块间旋转生成完整的正交代数。我们进一步推导了一个复数逃逸准则：如果块间种子的实部和虚部独立于剩余交织代数，则生成的模块是完整的复耦合空间，并且放大的代数变得特殊酉。\n\n连接的残差块图产生自然的多块泛化，并建议最小成本的生成树电路设计。我们在 XXZ 和 Hubbard 模型中演示了这一设计原理，其中残差代数筛选识别出 SP 电路扩展，从而消除了相关的可访问性障碍。这些示例建立了从残差对称性诊断和保真度界限到预测量子电路设计的统一路线。", "authors": [{"name": "Sahinur Reja"}], "featured_authors": [{"name": "Sahinur Reja"}], "author_count": 1}, {"id": "2611.24911", "category": "quant-ph", "title": "A Nonsecular Quantum Master Equation with Detailed Balance and Second-order Error Bound", "abstract": "An effective theory of open quantum systems should preserve the detailed balance structure inherited from microscopic reversibility and remain accurate throughout relaxation. Meeting both requirements is particularly challenging in quantum many-body systems, where dense spectra can invalidate the secular approximation even at weak coupling. Here we construct a nonsecular quantum master equation that satisfies time-reversal Kubo-Martin-Schwinger (TR-KMS) detailed balance. Under suitable conditions, we prove a time-uniform $O(\\lambda^2)$ bound on the difference between the predicted and exact reduced density matrices, where $\\lambda$ is the system-bath coupling strength. Our construction completes the Redfield generator by imposing detailed balance while matching its dissipative and coherent coefficients at resonance. In this approach, TR-KMS detailed balance is compatible with resonance matching, whereas its counterpart without time reversal is not. In a benchmark against the exact microscopic dynamics of two coupled oscillators, our equation maintains $O(\\lambda^2)$ accuracy across secular and nonsecular regimes, outperforming the existing detailed-balance equations tested. These results provide a systematic route from microscopic models to thermodynamically consistent descriptions of open quantum dynamics beyond the secular approximation.", "url": "https://arxiv.org/abs/2611.24911", "type": "理论", "summary": "开放量子系统的有效理论应该保留从微观可逆性继承的详细平衡结构，并在整个弛豫过程中保持准确。在量子多体系统中满足这两个要求尤其具有挑战性，即使在弱耦合情况下，密集的光谱也会使长期近似失效。在这里，我们构建了一个满足时间反转 Kubo-Martin-Schwinger (TR-KMS) 详细平衡的非世俗量子主方程。在适当的条件下，我们证明了预测和精确的约简密度矩阵之间的差异存在时间均匀 $O(\\lambda^2)$ 界限，其中 $\\lambda$ 是系统浴耦合强度。我们的结构通过施加详细的平衡，同时匹配谐振时的耗散系数和相干系数，完成了雷德菲尔德发生器。在这种方法中，TR-KMS 详细平衡与共振匹配兼容，而没有时间反转的平衡则不兼容。在针对两个耦合振荡器的精确微观动力学的基准中，我们的方程在长期和非长期状态下保持 $O(\\lambda^2)$ 精度，优于测试的现有详细平衡方程。\n\n这些结果提供了一条从微观模型到超越长期近似的开放量子动力学的热力学一致描述的系统途径。", "authors": [{"name": "Ji-Hui Pei"}, {"name": "Jin-Fu Chen"}], "featured_authors": [{"name": "Ji-Hui Pei"}, {"name": "Jin-Fu Chen"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
