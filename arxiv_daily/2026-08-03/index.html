  <style>

  <script>
    const papers = [{"id": "2607.28719", "category": "cond-mat", "title": "Anomalous Boundary Modes in a Floquet Hyperbolic System", "abstract": "We construct an anomalous Floquet topological phase on a negatively curved hyperbolic lattice. The model is a tight-binding Hamiltonian with a periodically repeated four-color edge-hopping sequence and a sublattice-staggered onsite potential step. The topological regime is reached near the limit in which a single hopping step transfers amplitude completely across an active edge, while the trivial regime is reached near the point where two full hops occur along an active edge during a single hopping step, returning the amplitude to its starting site. In finite open patches, the topological regime is characterized by bulk quasienergy gaps at $0$ and $\\pi$ that are populated by in-gap states, in contrast to a trivial regime where these gaps remain empty. Using compact periodic lattices, we map the bulk $0$ and $\\pi$ quasienergy gaps and identify the gapped regions connected to the trivial and anomalous open-boundary spectra. We diagnose the in-gap states as chiral boundary modes by their real-space dynamics. Finally, we introduce a small-boundary spectral-flow diagnostic based on punctured periodic hyperbolic lattices, which avoids the ambiguity associated with the extensive outer boundary of finite hyperbolic patches. This puncture-based diagnostic should be useful for studying other topological hyperbolic systems.", "url": "https://arxiv.org/abs/2607.28719", "type": "理论", "summary": "我们在负弯曲双曲晶格上构建了反常 Floquet 拓扑相。该模型是一个紧束缚哈密顿量，具有周期性重复的四色跳边序列和亚晶格交错的现场势步。拓扑状态接近极限，其中单个跳频步骤将幅度完全跨过活动边缘传输，而平凡状态则达到在单个跳变步骤期间沿着活动边缘发生两次完整跳跃的点附近，将幅度返回到其起始位置。在有限开放斑块中，拓扑状态的特征是 $0$ 和 $\\pi$ 处存在大量准能隙，其中充满了带内状态，与这些间隙保持为空的平凡状态相反。使用紧凑的周期晶格，我们绘制了块体 $0$ 和 $\\pi$ 准能隙，并识别了与平凡和异常开放边界谱连接的有隙区域。我们通过真实空间动力学将带隙内态诊断为手性边界模式。\n\n最后，我们引入了一种基于刺穿周期双曲格的小边界谱流诊断，它避免了与有限双曲面片的广泛外边界相关的模糊性。这种基于穿刺的诊断对于研究其他拓扑双曲系统应该很有用。", "authors": [{"name": "Ali Fahimniya"}, {"name": "Hossein Dehghani"}, {"name": "Alicia J. Kollár"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Ali Fahimniya"}, {"name": "Hossein Dehghani"}, {"name": "Alicia J. Kollár"}, {"name": "Alexey V. Gorshkov"}], "author_count": 4}, {"id": "2607.28740", "category": "cond-mat", "title": "Gapped Parent Hamiltonians for the Strongly Deformed Toric Code", "abstract": "Local non-unitary deformations of topologically ordered wavefunctions can drive transitions into peculiar states that challenge modern perspectives on gapped quantum matter. The strongly deformed toric code offers a curious case, hosting $m$ anyon condensation alongside perimeter-law scaling of Wilson loops charged under an exact 1-form symmetry---properties that typically do not coexist in gapped ground states. Nevertheless, we rigorously construct local gapped parent Hamiltonians for these strongly deformed toric code states. The Hamiltonians we construct are not strictly finite-range, but contain sums of Wilson loop operators whose coefficients decay exponentially in their diameter. If one adopts standard locality bounds used to define gapped phases---which allow for such exponentially decaying terms---our construction shows that these states realize a trivial gapped phase. Within this locality class, we demonstrate that perimeter-law scaling of Wilson loops does not imply a spontaneously broken 1-form symmetry, and from a dual perspective, that long-range ferromagnetic order and perimeter-law disorder parameter correlations can coexist in a 2D gapped ground state. We evade a recent no-go theorem [Sahay et al., arXiv:2503.01977 ] by relaxing its assumptions in a manner that we quantify as benign in the thermodynamic limit. More broadly, our results highlight that stronger notions of locality are necessary for prohibiting these counterintuitive properties within a gapped phase.", "url": "https://arxiv.org/abs/2607.28740", "type": "理论", "summary": "拓扑有序波函数的局部非统一变形可以驱动转变到特殊的状态，挑战现代对有隙量子物质的看法。强烈变形的环面代码提供了一个奇怪的情况，在精确的 1 型对称性下，承载 $m$ 任意子凝聚以及威尔逊环的周长定律缩放——这些特性通常不会在有隙基态中共存。尽管如此，我们还是为这些强烈变形的环面码状态严格构造了局部有间隙的父哈密顿量。我们构造的哈密顿量不是严格有限范围的，而是包含威尔逊循环算子的和，其系数在其直径上呈指数衰减。如果采用标准局部性边界来定义间隙相（允许这种指数衰减项），我们的构造表明这些状态实现了一个微不足道的间隙相。在这个局域性类中，我们证明威尔逊环的周长定律标度并不意味着自发破缺的1-形式对称性，并且从双重角度来看，长程铁磁有序和周长定律无序参数相关性可以在二维有隙基态中共存。\n\n我们通过以我们在热力学极限中量化为良性的方式放松其假设来规避最近的不可行定理 [Sahay 等人，arXiv:2503.01977]。更广泛地说，我们的结果强调，为了在间隙相中禁止这些违反直觉的特性，需要更强的局部性概念。", "authors": [{"name": "Nandagopal Manoj"}, {"name": "Zack Weinstein"}, {"name": "Jason Alicea"}], "featured_authors": [{"name": "Nandagopal Manoj"}, {"name": "Zack Weinstein"}, {"name": "Jason Alicea"}], "author_count": 3}, {"id": "2607.28744", "category": "cond-mat", "title": "Intrinsic Orbital Hall Effect in Degenerate Spin-3/2 Systems driven by the quantum metric", "abstract": "We show that in rotationally invariant spin-$3/2$ systems the orbital Hall effect originates from interband matrix elements of the orbital magnetic moment. The resulting Hall response is governed by the quantum metric, rather than by the Berry curvature, revealing a purely geometric transport mechanism. Conventional intraband contributions associated with the orbital magnetic moment and Berry curvature are shown to vanish identically in degenerate systems. These results identify the quantum metric as the key geometric quantity controlling orbital Hall transport in degenerate multiband systems.", "url": "https://arxiv.org/abs/2607.28744", "type": "理论", "summary": "我们证明，在旋转不变的自旋 $3/2$ 系统中，轨道霍尔效应源自轨道磁矩的带间矩阵元素。由此产生的霍尔响应由量子度量控制，而不是由贝里曲率控制，揭示了纯粹的几何传输机制。与轨道磁矩和贝里曲率相关的传统带内贡献在简并系统中同样消失。这些结果将量子度量确定为控制简并多带系统中轨道霍尔传输的关键几何量。", "authors": [{"name": "Rhonald Burgos Atencia"}], "featured_authors": [{"name": "Rhonald Burgos Atencia"}], "author_count": 1}, {"id": "2607.28745", "category": "cond-mat", "title": "Symmetry Rules for Cavity Materials Engineering with Linearly Polarized Vacuum Fields", "abstract": "Cavity materials engineering, aiming to manipulate material properties by coupling to vacuum fluctuations inside a cavity, is a rapidly advancing field. Despite significant progress, most studies to date have focused on specific materials and cavity configurations. Here, through a comprehensive group-theoretical analysis, we establish general symmetry rules for cavity materials engineering with linearly polarized cavity photon modes. By analyzing the symmetry of the effective photon-free quantum-electrodynamics Hamiltonian, we provide a complete classification of the symmetry-breaking patterns induced by cavity modes for all crystallographic point groups. The power of this framework is then demonstrated by quantum-electrodynamical density functional theory calculations. In particular, we explain the distinct cavity-induced lifting of band degeneracies in cubic BaTiO$_3$ for different cavity mode configurations, and the cavity-modified infrared and Raman spectra of monolayer MoS$_2$ due to symmetry breaking. Our results highlight the central role of symmetry in cavity materials engineering and provide general guidelines for future studies in this field.", "url": "https://arxiv.org/abs/2607.28745", "type": "理论+数值", "summary": "空腔材料工程是一个快速发展的领域，旨在通过耦合空腔内的真空波动来操纵材料特性。尽管取得了重大进展，但迄今为止大多数研究都集中在特定材料和腔体配置上。在这里，通过全面的群论分析，我们建立了具有线偏振腔光子模式的腔材料工程的一般对称规则。通过分析有效无光子量子电动力学哈密顿量的对称性，我们提供了所有晶体点群由腔模式引起的对称破缺模式的完整分类。然后通过量子电动力学密度泛函理论计算证明了该框架的强大功能。特别是，我们解释了不同腔模式配置下立方 BaTiO$_3$ 中明显的腔引起的能带简并提升，以及由于对称性破缺而导致的单层 MoS$_2$ 的腔修改红外和拉曼光谱。我们的结果强调了对称性在空腔材料工程中的核心作用，并为该领域的未来研究提供了一般指导。", "authors": [{"name": "Jingkai Quan"}, {"name": "Chongxiao Fan"}, {"name": "Benshu Fan"}, {"name": "I-Te Lu"}, {"name": "Dante M. Kennes"}, {"name": "Angel Rubio"}], "featured_authors": [{"name": "Jingkai Quan"}, {"name": "Chongxiao Fan"}, {"name": "Benshu Fan"}, {"name": "I-Te Lu"}, {"name": "Dante M. Kennes"}, {"name": "Angel Rubio"}], "author_count": 6}, {"id": "2607.28765", "category": "cond-mat", "title": "Deriving the second law of thermodynamics and exploring its boundaries", "abstract": "The second law of thermodynamics still lacks a general proof applicable to both classical and quantum systems across broad ranges of time scales, interactions, and degrees of nonequilibrium. In this paper, we show that when the macrostate-level probability $f$ of an isolated system increases monotonically with the number of possible microstates $\\Omega$ (i.e., $\\partial f/\\partial \\Omega > 0$), the second law emerges naturally from the continuity equation of $f$ in phase space; a special case of $\\partial f/\\partial \\Omega > 0$ is Boltzmann's assumption of equal a priori equilibrium probabilities. Based on this finding, the second law can be readily derived for fully chaotic systems. The derivation does not rely on dynamical details, highlighting the statistical nature of entropy increase. In contrast, for a locally nonchaotic system, the positive correlation between $f$ and $\\Omega$ may break down (i.e., $\\partial f/\\partial \\Omega \\leq 0$). Consequently, the conventional framework of thermodynamics does not apply, and entropy can decrease spontaneously without any energetic penalty.", "url": "https://arxiv.org/abs/2607.28765", "type": "理论", "summary": "热力学第二定律仍然缺乏适用于跨广泛时间尺度、相互作用和非平衡程度的经典系统和量子系统的一般证明。在本文中，我们证明，当孤立系统的宏观状态级概率 $f$ 随着可能的微观状态 $\\Omega$ 的数量单调增加（即 $\\partial f/\\partial \\Omega > 0$）时，第二定律自然地从相空间 $f$ 的连续性方程中得出； $\\partial f/\\partial \\Omega > 0$ 的一个特例是玻尔兹曼的先验平衡概率相等的假设。基于这一发现，可以很容易地推导出完全混沌系统的第二定律。该推导不依赖于动力学细节，突出了熵增加的统计性质。相反，对于局部非混沌系统，$f$ 和 $\\Omega$ 之间的正相关性可能会被打破（即 $\\partial f/\\partial \\Omega \\leq 0$）。因此，传统的热力学框架不适用，熵可以自发减少，而不会产生任何能量损失。", "authors": [{"name": "Yu Qiao"}], "featured_authors": [{"name": "Yu Qiao"}], "author_count": 1}, {"id": "2607.28781", "category": "cond-mat", "title": "Disorder induced time crystal in athermal random field Ising model with non-reciprocal interactions", "abstract": "A two species random field Ising model with non-reciprocal interactions between the species is studied using the greedy Glauber dynamics. By solving the dynamics exactly on a complete graph, we obtain the phase diagram of the model as a function of the non-reciprocal interaction ($K$) and the variance ($\\sigma$) of the quenched random field distribution. The model exhibits a rich phase diagram with the presence of a chaotic time-oscillatory phase for intermediate values of $K$ and $\\sigma$. The chaotic phase has stable time oscillations along with the autocorrelation time that diverges with system size on a complete graph and also in three dimensions. We find that the random field disorder along with non-reciprocal interaction alone can produce a time crystal without an external driving. In two dimensions the autocorrelation time does not increase with the system size and the time crystal phase is absent.", "url": "https://arxiv.org/abs/2607.28781", "type": "理论+数值", "summary": "使用贪婪 Glauber 动力学研究了物种之间具有非互易相互作用的两个物种随机场 Ising 模型。通过在完整的图上精确求解动力学，我们获得了模型的相图，作为非互易相互作用 ($K$) 和淬灭随机场分布的方差 ($\\sigma$) 的函数。该模型展示了丰富的相图，其中 $K$ 和 $\\sigma$ 的中间值存在混沌时间振荡相。混沌相位具有稳定的时间振荡以及自相关时间，该自相关时间在完整图和三个维度上随系统大小而发散。我们发现，仅随机场无序和非互易相互作用就可以在没有外部驱动的情况下产生时间晶体。在二维中，自相关时间不会随着系统尺寸的增加而增加，并且不存在时间晶相。", "authors": [{"name": "Aldrin B E"}, {"name": "Sumedha"}], "featured_authors": [{"name": "Aldrin B E"}, {"name": "Sumedha"}], "author_count": 2}, {"id": "2607.28786", "category": "cond-mat", "title": "Statistical Gauge Theory of Structural Glasses: Equilibrium Scenarios and Glass-Forming Ability", "abstract": "The model primarily concerns structural glasses described by systems of topological defects. We explore the scope of this approach and investigate equilibrium behavior within the mean-field approximation. Our analysis reveals three possible equilibrium scenarios, only one of which exhibits a strong glass-forming ability. These scenarios allow for the phenomenological selection of model parameters based on equilibrium behavior, which can then be used to study dynamics during quenching. We identify an upper temperature limit beyond which quenching into the glassy state becomes impossible.", "url": "https://arxiv.org/abs/2607.28786", "type": "理论", "summary": "该模型主要涉及由拓扑缺陷系统描述的结构玻璃。我们探索了这种方法的范围，并研究了平均场近似内的平衡行为。我们的分析揭示了三种可能的平衡情景，其中只有一种表现出很强的玻璃形成能力。这些场景允许基于平衡行为对模型参数进行现象学选择，然后可用于研究淬火过程中的动力学。我们确定了一个温度上限，超过该温度上限就不可能淬火成玻璃态。", "authors": [{"name": "L.D.Son"}, {"name": "M.G.Vasin"}], "featured_authors": [{"name": "L.D.Son"}, {"name": "M.G.Vasin"}], "author_count": 2}, {"id": "2607.28805", "category": "cond-mat", "title": "Symmetry-assisted computation of the magnetic field at the site of a point dipole", "abstract": "In this paper, we revisit this concept of the magnetic field at the site of a magnetic dipole using symmetry arguments that are mathematically rigorous yet intuitive enough to be well-suited for upper-level undergraduate courses in electrodynamics and quantum mechanics. Furthermore, we present symmetry-based results that go beyond those discussed in the standard literature, which are directly relevant to fundamental problems in two-dimensional physics.", "url": "https://arxiv.org/abs/2607.28805", "type": "理论", "summary": "在本文中，我们使用对称论证重新审视磁偶极子处的磁场概念，这些对称论证在数学上严谨但足够直观，非常适合电动力学和量子力学的高年级本科课程。此外，我们提出了基于对称性的结果，超出了标准文献中讨论的结果，这些结果与二维物理学的基本问题直接相关。", "authors": [{"name": "D. Pescia"}], "featured_authors": [{"name": "D. Pescia"}], "author_count": 1}, {"id": "2607.28905", "category": "cond-mat", "title": "Knudsen-Controlled Switching of Thermal Conductivity Response by Targeted Phonon Excitation", "abstract": "Targeted phonon excitation offers a route to dynamically control heat conduction, yet no general principle predicts whether a spectrally selective nonequilibrium phonon population will enhance or suppress thermal transport. A Knudsen-controlled competition between the increased contribution of long-mean-free-path phonons and excitation-enhanced intrinsic scattering governs the sign of the thermal-conductivity response. First-principles three-phonon scattering rates combined with phonon-tracking Monte Carlo simulations are used to examine Ge, Si, and 3C--SiC from bulk crystals to confined nanofilms. In bulk systems, excitation-enhanced scattering dominates and thermal conductivity is predominantly suppressed. In nanofilms, by contrast, low-frequency excitation can increase the contribution of quasi-ballistic heat-carrying channels and enhance thermal conductivity, whereas higher-frequency excitation is predominantly suppressive. At fixed background temperature and excitation strength, these opposite responses are organized in a frequency--Knudsen map based on the normalized target frequency, $\\omega_{\\mathrm t}/\\omega_{\\mathrm D}$, and the Knudsen number, $\\mathrm{Kn}$. The resulting framework provides a general physical basis for controlling nonequilibrium heat transport beyond static phonon engineering.", "url": "https://arxiv.org/abs/2607.28905", "type": "数值", "summary": "定向声子激发提供了动态控制热传导的途径，但没有一般原理预测光谱选择性非平衡声子群是否会增强或抑制热传输。长平均自由程声子的贡献增加与激发增强的本征散射之间的克努森控制的竞争控制着热导响应的符号。第一原理三声子散射率与声子跟踪蒙特卡罗模拟相结合，用于检查从块状晶体到受限纳米薄膜的 Ge、Si 和 3C-SiC。在体系统中，激发增强散射占主导地位，热导率主要受到抑制。相比之下，在纳米薄膜中，低频激发可以增加准弹道载热通道的贡献并增强导热性，而高频激发则主要是抑制性的。在固定的背景温度和激励强度下，这些相反的响应被组织在基于归一化目标频率 $\\omega_{\\mathrm t}/\\omega_{\\mathrm D}$ 和克努森数 $\\mathrm{Kn}$ 的频率克努森图中。\n\n由此产生的框架为控制静态声子工程之外的非平衡热传输提供了通用的物理基础。", "authors": [{"name": "Shixian Liu"}, {"name": "Tianhao Li"}, {"name": "Fei Yin"}, {"name": "Yu He"}, {"name": "Alexander A. Barinov"}, {"name": "Han Meng"}, {"name": "Nuo Yang"}], "featured_authors": [{"name": "Shixian Liu"}, {"name": "Tianhao Li"}, {"name": "Fei Yin"}, {"name": "Alexander A. Barinov"}, {"name": "Han Meng"}, {"name": "Nuo Yang"}], "author_count": 7}, {"id": "2607.28927", "category": "cond-mat", "title": "Symmetry selection rule for the band-edge shift current in two dimensions", "abstract": "The shift current is the intrinsic bulk photovoltaic response of a crystal without an inversion center. In graphene multilayers, recent calculations report large band-edge shift currents that reverse sign under a gate or displacement field, a behavior that neither the quantum metric nor the Berry curvature captures. We show that this behavior follows from a symmetry principle: at the absorption edge of an inversion-broken, two-dimensional gapped Dirac-like system, an emergent low-energy rotational symmetry forbids the response, and the trigonal warping, which reduces this emergent symmetry to the lattice's three-fold rotation, switches the current on linearly in its strength. We formulate this as an exact angular selection rule that unifies the band-edge responses of multilayer graphene and of the kagome lattice. In the multiband structures, the released current is governed by a signed, detuning-weighted three-point Bargmann invariant of the Bloch states: the optical amplitude remains fixed while the sign alignment of the Bargmann triangles grows with the warping, a phase-coherence effect captured by a bounded coherence factor and invisible to any positive-definite figure of merit, the quantum metric included. In bilayer and trilayer graphene, a gate voltage alone drives the sign reversal, making the band-edge shift current a parameter-free, gate-switchable bulk photovoltaic response.", "url": "https://arxiv.org/abs/2607.28927", "type": "理论+数值", "summary": "移位电流是没有反转中心的晶体的固有体光伏响应。在石墨烯多层中，最近的计算报告了在栅极或位移场下反转符号的大带边位移电流，这是量子度量和贝里曲率都无法捕获的行为。我们证明这种行为遵循对称原理：在反演破缺的二维有隙狄拉克系统的吸收边，出现的低能旋转对称性禁止响应，而三角翘曲将这种出现的对称性降低到晶格的三倍旋转，从而线性地开启电流的强度。我们将其表述为精确的角度选择规则，该规则统一了多层石墨烯和 kagome 晶格的带边响应。\n\n在多带结构中，释放的电流由布洛赫态的带符号、失谐加权三点巴格曼不变量控制：光学振幅保持固定，而巴格曼三角形的符号排列随着扭曲而增长，由有界相干因子捕获的相位相干效应，对任何正定品质因数（包括量子度量）都是不可见的。在双层和三层石墨烯中，栅极电压单独驱动符号反转，使带边移位电流成为无参数、栅极可切换的体光伏响应。", "authors": [{"name": "Felipe Pérez Riffo"}, {"name": "Matías Castro"}, {"name": "Leonor Chico"}, {"name": "L.E.F. Foa Torres. Eric Suárez Morell"}], "featured_authors": [{"name": "Felipe Pérez Riffo"}, {"name": "Matías Castro"}, {"name": "Leonor Chico"}, {"name": "L.E.F. Foa Torres. Eric Suárez Morell"}], "author_count": 4}, {"id": "2607.28938", "category": "cond-mat", "title": "Covariance-Driven Momentum Rectification at Liquid-Vapor Interfaces Near Wetting Transitions", "abstract": "Zero-mean forcing can generate directed transport when a medium responds in a spatially structured way and the relevant symmetries are broken. Liquid-vapor interfaces are a useful setting for this problem because surface-tension gradients, wetting dynamics, vapor exchange, capillary and acoustic waves, electro-ionic screening, thermal noise, and boundary compliance can all carry momentum. We develop a conservative continuum model in which the central object is the covariance between a local response field and a zero-mean tangential drive, $\\langle Mf\\rangle-\\langle M\\rangle\\langle f\\rangle$, embedded in an explicit momentum ledger. In a minimal diffuse-interface realization, this covariance gives the phase-selective drift law $U\\propto\\epsilon_h\\Theta\\sin\\varphi$ for a Marangoni-driven liquid-vapor interface above a structured wall, with exact nulls when the symmetry is restored. Wetting susceptibility then acts as a bounded gain factor: first-order spinodal conditions provide the useful amplification regime, critical wetting saturates because interfacial unbinding removes the short-range drive, and bulk criticality suppresses the channel as the interface disappears. Additional reservoirs - phase change, waves, thermal transport, electro-ionic coupling, compliance, and fluctuations - are treated as compensating channels to be isolated by sign reversals, scaling laws, and budget closure. The result is neither a new microscopic force nor an apparatus-level claim, but a symmetry-constrained accounting scheme for rectified momentum transfer in water-based interfacial systems. Reduced numerical calculations illustrate the phase-selection rules, bounded spinodal gain, momentum-budget closure, transverse chirality, and grid convergence.", "url": "https://arxiv.org/abs/2607.28938", "type": "理论+数值", "summary": "当介质以空间结构化方式响应并且相关对称性被破坏时，零均值强迫可以产生定向传输。液-汽界面是解决该问题的有用设置，因为表面张力梯度、润湿动力学、蒸汽交换、毛细管波和声波、电离子屏蔽、热噪声和边界柔量都可以携带动量。我们开发了一个保守的连续体模型，其中的中心对象是嵌入在显式动量分类账中的局部响应场和零均值切向驱动 $\\langle Mf\\rangle-\\langle M\\rangle\\langle f\\rangle$ 之间的协方差。在最小扩散界面实现中，此协方差给出了结构壁上方 Marangoni 驱动的液-汽界面的相选择漂移定律 $U\\propto\\epsilon_h\\Theta\\sin\\varphi$，当对称性恢复时具有精确的零值。然后，润湿敏感性充当有界增益因子：一阶旋节线条件提供了有用的放大机制，临界润湿饱和，因为界面解绑消除了短程驱动，并且随着界面消失，体积临界性抑制了通道。\n\n其他储层——相变、波、热传输、电离子耦合、顺应性和波动——被视为补偿通道，通过符号反转、缩放定律和预算收敛来隔离。结果既不是新的微观力，也不是装置级的主张，而是水基界面系统中修正动量传递的对称约束计算方案。简化的数值计算说明了相选择规则、有界旋节线增益、动量预算闭合、横向手性和网格收敛。", "authors": [{"name": "Nelson Bolívar"}, {"name": "Gabriel Abellán"}, {"name": "Ivaylo Vasilev"}], "featured_authors": [{"name": "Nelson Bolívar"}, {"name": "Gabriel Abellán"}, {"name": "Ivaylo Vasilev"}], "author_count": 3}, {"id": "2607.28983", "category": "cond-mat", "title": "Generalized Holstein-Primakoff transformation with optimizable bosonic truncation", "abstract": "Spin-wave theory provides a quasiparticle description of excitation spectra in quantum spin systems. In this theory, the spin operators are usually bosonized by the Holstein-Primakoff transformation or the Dyson-Maleev transformation. In practical calculations, the bosonized Hamiltonian has to be truncated, and thus the resulting excitation spectra depend on the choice of bosonic representation. Here, we introduce a generalized Holstein-Primakoff transformation that continuously interpolates between the conventional Holstein-Primakoff and Dyson-Maleev transformations through a single parameter. The formulation naturally extends to the SU(N) algebra and provides a flexible framework for optimizing bosonic truncations beyond harmonic order. As an application, we investigate the spin-1 bilinear-biquadratic model on the square lattice. By combining the generalized Holstein-Primakoff transformation with continuous similarity transformations, we obtain excitation spectra in excellent agreement with tensor-network calculations. Our results demonstrate that optimizing the bosonic representation substantially reduces truncation errors and provides quantitatively reliable descriptions of both quasiparticle dispersions and multi-boson continua.", "url": "https://arxiv.org/abs/2607.28983", "type": "理论+数值", "summary": "自旋波理论提供了量子自旋系统中激发光谱的准粒子描述。在该理论中，自旋算子通常通过 Holstein-Primakoff 变换或 Dyson-Maleev 变换进行玻色化。在实际计算中，玻色哈密顿量必须被截断，因此所得的激发光谱取决于玻色表示的选择。在这里，我们引入了一种广义的 Holstein-Primakoff 变换，它通过单个参数在传统的 Holstein-Primakoff 和 Dyson-Maleev 变换之间连续插值。该公式自然地扩展到 SU(N) 代数，并提供了一个灵活的框架来优化超出谐波阶的玻色子截断。作为一个应用，我们研究了方晶格上的 spin-1 双线性双二次模型。通过将广义 Holstein-Primakoff 变换与连续相似变换相结合，我们获得了与张量网络计算非常一致的激发谱。\n\n我们的结果表明，优化玻色子表示可以大大减少截断误差，并为准粒子色散和多玻色子连续体提供定量可靠的描述。", "authors": [{"name": "Yang Liu"}, {"name": "Jia-Wei Mei"}, {"name": "Rong Yu"}, {"name": "Z. Y. Xie"}, {"name": "Hong-Gang Luo"}, {"name": "Jize Zhao"}], "featured_authors": [{"name": "Yang Liu"}, {"name": "Jia-Wei Mei"}, {"name": "Rong Yu"}, {"name": "Z. Y. Xie"}, {"name": "Hong-Gang Luo"}, {"name": "Jize Zhao"}], "author_count": 6}, {"id": "2607.29006", "category": "cond-mat", "title": "Critical Phases of the extended isotropic $XY$ chain with four-spin interaction", "abstract": "Using the Jordan-Wigner transformation we calculate exactly the ground state and low-temperature thermodynamic properties of the spin $S=1/2$ isotropic $XX$ chain with four spin interaction. In terms of the equivalent spinless fermion (SF) representation the system is viewed as a lattice fermion gas with nearest-neighbor ($J$) and next-next-next-neighbor ($J^{\\ast}/4$) hopping. It is shown that with the increase of four spin coupling, at $J^{\\ast}_{c} = 4J/3$ the system experiences the Lifshitz type topological phase transition characterized by the tripling of Fermi points. The quantum phase transition (QPT) point marks transition from a gapless spin-liquid phase of standard $XX$ chain into again a gapless spin-liquid phase with different character of power-low decay of spin correlations. At the transition point the free fermion dispersion relation shows flattering at Fermi points, what determines singular character of density of states $\\rho(\\omega)\\sim (\\omega/J)^{-2/3}$ and as a consequence unconventional temperature dependence of heat capacity of the system $C\\sim (T/J^{\\ast})^{1/3}$, and singular magnetic susceptibility of the system $\\chi(H)\\sim (H/J^{\\ast})^{-2/3}$. In the case of alternating magnetic field the system is characterized by the rich ground state phase diagram which contains fully polarized (ferromagnetic), gapped antiferromagnetic (AFM) and spin liquid phases. At the transition point from the gapped AFM phase into the gapless polarized spin liquid phase the system shows rapid increase of magnetization $m\\sim(H-H_c)^{1/6}$ and magnetic susceptibility a singular behavior as $\\chi(H)\\sim (H-H_c)^{-5/6}$.", "url": "https://arxiv.org/abs/2607.29006", "type": "理论+数值", "summary": "使用 Jordan-Wigner 变换，我们精确计算具有四个自旋相互作用的自旋 $S=1/2$ 各向同性 $XX$ 链的基态和低温热力学性质。就等效无自旋费米子 (SF) 表示而言，系统被视为具有最近邻 ($J$) 和下下下下下邻 ($J^{\\ast}/4$) 跳跃的晶格费米子气体。结果表明，随着四次自旋耦合的增加，在$J^{\\ast}_{c} = 4J/3$时，系统经历以费米点增加三倍为特征的Lifshitz型拓扑相变。量子相变 (QPT) 点标志着从标准 $XX$ 链的无间隙自旋液相再次转变为具有不同的自旋相关性功率低衰减特征的无间隙自旋液相。在转变点，自由费米子色散关系在费米点表现出平坦，这决定了态密度 $\\rho(\\omega)\\sim (\\omega/J)^{-2/3}$ 的奇异特征，并因此决定了系统 $C\\sim (T/J^{\\ast})^{1/3}$ 热容量的非常规温度依赖性，以及系统 $\\chi(H)\\sim 的奇异磁化率(H/J^{\\ast})^{-2/3}$。\n\n在交变磁场的情况下，系统的特征是丰富的基态相图，其中包含完全极化（铁磁）、带隙反铁磁（AFM）和自旋液相。在从有间隙 AFM 相到无间隙极化自旋液相的转变点，系统显示出磁化强度 $m\\sim(H-H_c)^{1/6}$ 的快速增加，磁化率呈奇异行为 $\\chi(H)\\sim (H-H_c)^{-5/6}$。", "authors": [{"name": "Nika Kurdadze"}, {"name": "Giorgi Gogabedashvili"}, {"name": "G.I. Japaridze"}], "featured_authors": [{"name": "Nika Kurdadze"}, {"name": "Giorgi Gogabedashvili"}, {"name": "G.I. Japaridze"}], "author_count": 3}, {"id": "2607.29015", "category": "cond-mat", "title": "Charge discreteness and the energy efficiency of information erasure in dynamic random-access memory cells", "abstract": "A dynamic random-access memory (DRAM) cell stores information as an integer number of electrons on a capacitor, and whether this discreteness is thermodynamically relevant depends on the competition between the charging energy and thermal fluctuations. This competition is quantified by the ratio $\\kappa$ of the single-electron charging energy to the thermal energy, and here we investigate how $\\kappa$ affects the energy efficiency of information erasure in a DRAM cell. Using a stochastic-thermodynamic model of a DRAM cell, we show that the nonquasistatic heat released during the discharge step is suppressed as $\\kappa$ increases, whereas the quasistatic heat of the charge step approaches the Landauer cost. As a result, the energy efficiency increases monotonically with $\\kappa$ and approaches the Landauer limit where the effect of charge discreteness is maximal and the cell is effectively reduced to two charge states. The parameter $\\kappa$ thus connects two thermodynamic regimes: a multilevel single-well memory, whose nonequilibrium initial state prevents quasistatic erasure, and an effective two-level memory that can attain the Landauer limit. These results identify $\\kappa$ as the parameter that controls the fundamental efficiency ceiling of transistor--capacitor memory circuits.", "url": "https://arxiv.org/abs/2607.29015", "type": "理论", "summary": "动态随机存取存储器（DRAM）单元将信息存储为电容器上的整数个电子，这种离散性是否与热力学相关取决于充电能量和热波动之间的竞争。这种竞争通过单电子充电能量与热能的比率 $\\kappa$ 来量化，在这里我们研究 $\\kappa$ 如何影响 DRAM 单元中信息擦除的能量效率。使用 DRAM 单元的随机热力学模型，我们发现放电步骤中释放的非准静态热量随着 $\\kappa$ 的增加而受到抑制，而充电步骤的准静态热量接近兰道尔成本。因此，能量效率随着 $\\kappa$ 单调增加，并接近兰道尔极限，其中电荷离散性的影响最大，并且电池有效地减少到两种电荷状态。因此，参数 $\\kappa$ 连接了两个热力学状态：一个多级单阱存储器，其非平衡初始状态防止准静态擦除，以及一个可以达到兰道尔极限的有效两级存储器。\n\n这些结果将 $\\kappa$ 确定为控制晶体管电容器存储电路基本效率上限的参数。", "authors": [{"name": "Takase Shimizu"}, {"name": "Kouki Yamamoto"}, {"name": "Kensaku Chida"}, {"name": "Gento Yamahata"}, {"name": "Katsuhiko Nishiguchi"}], "featured_authors": [{"name": "Takase Shimizu"}, {"name": "Kouki Yamamoto"}, {"name": "Kensaku Chida"}, {"name": "Gento Yamahata"}, {"name": "Katsuhiko Nishiguchi"}], "author_count": 5}, {"id": "2607.29030", "category": "cond-mat", "title": "First-principles carrier mobility and optical absorption of strained ZnO with self-consistent Hubbard interactions", "abstract": "Carrier mobility and optical absorption are key performance parameters of oxide semiconductors in transparent and flexible displays. We use a newly developed density-functional perturbation theory with a self-consistent Hubbard correction (DFPT+U) to study phonon-limited electron transport and phonon-assisted optical absorption in strained zinc oxide (ZnO). This parameter-free approach accounts for electron-phonon interactions and on-site correlation effects simultaneously. Electronic structures and phonon dispersions are computed under three distinct uniaxial strain directions. Uniaxial tensile strain up to 4.8% along [\\bar110] is found to increase the room-temperature electron mobility by 19% while leaving visible-range optical absorption essentially unchanged. These results demonstrate that moderate strain can selectively enhance carrier transport without degrading optical transparency, and establish DFPT+U as an effective framework for predicting strain-dependent transport and optical properties in wide-band-gap oxides with implications for strain-engineered display and optoelectronic applications.", "url": "https://arxiv.org/abs/2607.29030", "type": "理论+数值", "summary": "载流子迁移率和光吸收是透明和柔性显示器中氧化物半导体的关键性能参数。我们使用新开发的密度泛函微扰理论和自洽哈伯德校正（DFPT+U）来研究应变氧化锌（ZnO）中的声子限制电子传输和声子辅助光吸收。这种无参数方法同时考虑了电子-声子相互作用和现场相关效应。在三个不同的单轴应变方向下计算电子结构和声子色散。研究发现，沿 [\\bar110] 的单轴拉伸应变高达 4.8%，可将室温电子迁移率提高 19%，同时使可见光范围的光学吸收基本不变。这些结果表明，适度的应变可以选择性地增强载流子传输而不降低光学透明度，并将 DFPT+U 建立为预测宽带隙氧化物中应变相关传输和光学特性的有效框架，对应变工程显示和光电应用具有影响。", "authors": [{"name": "Hong-Guk Min"}, {"name": "Wooil Yang"}, {"name": "Sabyasachi Tiwari"}, {"name": "Feliciano Giustino"}, {"name": "Young-Woo Son"}], "featured_authors": [{"name": "Hong-Guk Min"}, {"name": "Wooil Yang"}, {"name": "Sabyasachi Tiwari"}, {"name": "Feliciano Giustino"}, {"name": "Young-Woo Son"}], "author_count": 5}, {"id": "2607.29084", "category": "cond-mat", "title": "Charge-Density-Wave Phase Selection by Janus-Induced Intrinsic Strain in Monolayer NbSSiAs$_2$", "abstract": "Controlling phase selection among competing charge-density-wave (CDW) instabilities remains challenging in two-dimensional materials. Here, first-principles calculations show that Janus-induced intrinsic tensile strain redirects the off-M soft-mode tendency of NbS$_2$ to the M point in NbSSiAs$_2$, selecting a $2\\times2$ CDW reconstruction. Electron-phonon coupling analysis identifies momentum-selective coupling between Nb-derived states and a longitudinal acoustic mode as the origin of the M-point instability. The reconstructed phase hosts two nearly degenerate Nb-trimerized configurations whose relative stability is tuned by biaxial strain. Both configurations retain phonon-mediated superconductivity on the 6-7 K scale, indicating the coexistence of CDW order and superconductivity. Compressive strain favors the 1+3-hollow configuration and induces a band-inverted, $Z_2$-nontrivial state while preserving superconductivity. Together, these results identify Janus-induced intrinsic strain as an internal structural route for CDW phase selection, whereas external strain provides access to a regime in which CDW order, topology, and superconductivity coexist.", "url": "https://arxiv.org/abs/2607.29084", "type": "数值", "summary": "在二维材料中，控制竞争电荷密度波 (CDW) 不稳定性之间的相选择仍然具有挑战性。在这里，第一性原理计算表明，Janus 引起的固有拉伸应变将 NbS$_2$ 的 Off-M 软模式趋势重定向到 NbSSiAs$_2$ 中的 M 点，选择 $2\\times2$ CDW 重建。电子声子耦合分析将 Nb 衍生态与纵向声模之间的动量选择性耦合确定为 M 点不稳定性的根源。重建相具有两种近简并的铌三聚构型，其相对稳定性通过双轴应变调节。两种配置都在 6-7 K 尺度上保留了声子介导的超导性，表明 CDW 有序性和超导性共存。压缩应变有利于 1+3-空心构型，并诱导能带反转、$Z_2$-非平凡状态，同时保持超导性。总之，这些结果将 Janus 引起的内在应变确定为 CDW 相选择的内部结构途径，而外部应变提供了进入 CDW 有序、拓扑和超导共存的状态的途径。", "authors": [{"name": "Chun-Jie Zhang"}, {"name": "Bing Zhang"}, {"name": "Dongliang Mao"}, {"name": "Yapeng Wu"}, {"name": "Xiao-Ping Li"}, {"name": "Lei Wang"}], "featured_authors": [{"name": "Chun-Jie Zhang"}, {"name": "Bing Zhang"}, {"name": "Dongliang Mao"}, {"name": "Yapeng Wu"}, {"name": "Xiao-Ping Li"}, {"name": "Lei Wang"}], "author_count": 6}, {"id": "2607.29151", "category": "cond-mat", "title": "Successive Electronic Topological Transitions in the Antiferromagnet UPd$_2$Al$_3$", "abstract": "We report successive anomalies at low temperature in the magnetic field dependence of the thermoelectric signal in the heavy fermion compound UPd$_{2}$Al$_{3}$ inside the antiferromagnetic state up to the metamagnetic transition at $H_\\text{M} =18$~T. Based on renormalisation perturbation theory and the partitioning of the $f$ orbitals into localized and delocalized parts, our analysis attributes these anomalies to complex topological changes of the Fermi surface driven by Zeeman effect. The observation of a sudden change of sign both in the thermoelectric power and in the Hall coefficient at $H_\\text{M}$ in addition to the appearance of large quantum oscillations in the thermoelectric power above $H_\\text{M}$ indicate a strong Fermi surface reconstruction at the metamagnetic transition due to the unfolding of the electronic bands.", "url": "https://arxiv.org/abs/2607.29151", "type": "理论", "summary": "我们报告了在反铁磁态内的重费米子化合物 UPd$_{2}$Al$_{3}$ 中的热电信号在低温下的磁场依赖性的连续异常，直到 $H_\\text{M} =18$~T 的变磁转变。基于重正化微扰理论和将 $f$ 轨道划分为局域和离域部分，我们的分析将这些异常归因于塞曼效应驱动的费米表面的复杂拓扑变化。除了在 $H_\\text{M}$ 以上的热电势中出现大量子振荡之外，在 $H_\\text{M}$ 处观察到热电势和霍尔系数的符号突然变化，表明由于电子带的展开，在变磁跃迁处出现了强烈的费米表面重构。", "authors": [{"name": "Adrien Gourgout"}, {"name": "Gaël Bastien"}, {"name": "Dai Aoki"}, {"name": "Gabriel Seyfarth"}, {"name": "Ilya Sheikin"}, {"name": "Andrey Varlamov"}, {"name": "Gertrud Zwicknagl"}, {"name": "Jacques Flouquet"}, {"name": "Georg Knebel"}, {"name": "Alexandre Pourret"}], "featured_authors": [{"name": "Adrien Gourgout"}, {"name": "Gaël Bastien"}, {"name": "Dai Aoki"}, {"name": "Jacques Flouquet"}, {"name": "Georg Knebel"}, {"name": "Alexandre Pourret"}], "author_count": 10}, {"id": "2607.29157", "category": "cond-mat", "title": "Strength-degradation phase-field regularization of cohesive fracture: the antiplane case", "abstract": "Phase-field approaches to fracture, initially designed as regularization of the Griffith model of brittle fracture, are now commonly viewed as gradient-damage models whose regularization length becomes a material property driving crack nucleation. One weakness of this approach is that the strength surface cannot be arbitrary: its shape is dictated by the elastic energy, and its magnitude by the regularization length. We focus on the antiplane version of the model introduced by Bourdin, Marigo, Maurini and Zolesi ( arXiv:2506.22558 ), which handles crack propagation along unknown paths and nucleation governed by an arbitrary convex strength surface by degrading the strength instead of the stiffness. It can be interpreted as a regularization of softening plasticity in which localization bands obey an equivalent cohesive law set by the strength domain and the toughness, while the role of the regularization length, when small compared to the elasto-cohesive length, is purely numerical. Strength, stiffness, and toughness thus become independent material data, and limit analysis, perfect plasticity, cohesive fracture, and brittle fracture merge into a single variational framework. We derive closed-form solutions for a simple shear problem, propose a numerical scheme combining alternate minimization and conic programming, and numerically verify the equivalent cohesive law, its independence of the regularization, and the size effect governed by the elasto-cohesive length. A \"surfing\" simulation highlights the structure of the propagating crack while a re-entrant V-notch is used to show how the model bridges small-scale yielding, cohesive fracture, and brittle fracture without a priori hypotheses.", "url": "https://arxiv.org/abs/2607.29157", "type": "理论+数值", "summary": "相场断裂方法最初被设计为脆性断裂格里菲斯模型的正则化，现在通常被视为梯度损伤模型，其正则化长度成为驱动裂纹形核的材料属性。这种方法的一个缺点是强度表面不能是任意的：其形状由弹性能决定，其大小由正则化长度决定。我们重点关注 Bourdin、Marigo、Maurini 和 Zolesi ( arXiv:2506.22558 ) 引入的模型的反平面版本，该模型通过降低强度而不是刚度来处理沿未知路径的裂纹扩展和由任意凸强度表面控制的成核。它可以解释为软化塑性的正则化，其中局部带服从由强度域和韧性设定的等效内聚定律，而正则化长度的作用（当与弹内聚长度相比较小时）是纯数值的。因此，强度、刚度和韧性成为独立的材料数据，极限分析、完美塑性、内聚断裂和脆性断裂合并到一个单一的变分框架中。\n\n我们推导了简单剪切问题的闭式解，提出了一种结合交替最小化和圆锥规划的数值方案，并数值验证了等效内聚定律、其正则化的独立性以及由弹内聚长度控制的尺寸效应。 “冲浪”模拟突出显示了扩展裂纹的结构，同时使用凹口 V 形切口来展示模型如何在没有先验假设的情况下桥接小规模屈服、内聚断裂和脆性断裂。", "authors": [{"name": "Blaise Bourdin"}, {"name": "Corrado Maurini"}], "featured_authors": [{"name": "Blaise Bourdin"}, {"name": "Corrado Maurini"}], "author_count": 2}, {"id": "2607.29170", "category": "cond-mat", "title": "Scalar curvature density as a new invariant in thermodynamic geometry: metric dependence and critical exponents", "abstract": "We compare two Ruppeiner metrics constructed under fixed volume and fixed particle number conditions ($g_{_V}$ and $g_{_V}$) by analyzing the scalar curvature $R$ and introducing the scalar curvature density $\\mathcal{R} = \\sqrt{|g|}\\,R$ as a complementary geometric invariant. Three fluid models of increasing physical realism are considered: van der Waals, Lennard-Jones, and argon described by a multiparameter equation of state that correctly reproduces non-mean-field critical behavior consistent with the Ising universality class. We find that $R$ and $\\mathcal{R}$ exhibit distinct critical scaling: $R \\sim t^{-d\\nu}$ is governed by the correlation length exponent, whereas $\\mathcal{R} \\sim t^{-(1+\\beta)}$ scales solely with the order parameter exponent $\\beta$, a result that follows analytically from hyperscaling and the Rushbrooke relation independently of the universality class. The $N$-metric consistently outperforms the $V$-metric in reconstructing the vapor-liquid coexistence curve away from criticality, and the four Widom lines defined by the minima of $R_{_V}$, $R_{_N}$, $\\mathcal{R}_{_V}$, and $\\mathcal{R}_{_N}$ display a characteristic fourfold structure reproduced across all three models. The loci where both representations yield identical geometric descriptions define two new objects: the Curvature Equality Curve (CEC, $R_{_V} = R_{_N}$) and the Curvature-Density Equality Curve (CDEC, $\\mathcal{R}_{_V} = \\mathcal{R}_{_N}$), with the CDEC enclosing a substantially larger region of the phase diagram in all cases. These results establish $\\mathcal{R}$ as a meaningful complement to $R$ in thermodynamic geometry and highlight the nontrivial role of metric choice in the description of phase transitions and supercritical behavior.", "url": "https://arxiv.org/abs/2607.29170", "type": "理论+数值", "summary": "我们通过分析标量曲率 $R$ 并引入标量曲率密度 $\\mathcal{R} = \\sqrt{|g|}\\,R$ 作为互补几何不变量，比较在固定体积和固定粒子数条件下构造的两个 Ruppeiner 度量（$g_{_V}$ 和 $g_{_V}$）。考虑了增加物理真实性的三种流体模型：范德华、伦纳德-琼斯和由多参数状态方程描述的氩，该模型正确地再现了与伊辛普适性类一致的非平均场临界行为。我们发现 $R$ 和 $\\mathcal{R}$ 表现出不同的临界标度：$R \\sim t^{-d\\nu}$ 由相关长度指数控制，而 $\\mathcal{R} \\sim t^{-(1+\\beta)}$ 仅与阶参数指数 $\\beta$ 标度，这是根据超标度和 Rushbrooke 关系分析得出的结果，与通用性类别无关。\n\n$N$ 度量在重建远离临界点的汽液共存曲线方面始终优于 $V$ 度量，并且由 $R_{_V}$、$R_{_N}$、$\\mathcal{R}_{_V}$ 和 $\\mathcal{R}_{_N}$ 的最小值定义的四个 Widom 线显示了在所有三个模型中重现的特征四重结构。两种表示产生相同几何描述的位点定义了两个新对象：曲率等式曲线（CEC，$R_{_V} = R_{_N}$）和曲率-密度等式曲线（CDEC，$\\mathcal{R}_{_V} = \\mathcal{R}_{_N}$），在所有情况下，CDEC 都包围相图的更大区域。这些结果将 $\\mathcal{R}$ 确立为热力学几何中 $R$ 的有意义的补充，并强调了度量选择在相变和超临界行为描述中的重要作用。", "authors": [{"name": "José Torres-Arenas"}, {"name": "Jaime Jaramillo-Gutiérrez"}, {"name": "Juan Becerra-Zamudio"}], "featured_authors": [{"name": "José Torres-Arenas"}, {"name": "Jaime Jaramillo-Gutiérrez"}, {"name": "Juan Becerra-Zamudio"}], "author_count": 3}, {"id": "2607.29171", "category": "cond-mat", "title": "Polariton-Assisted Inelastic Tunneling through a Quantum Well", "abstract": "We investigate electronic transport through a doped quantum well strongly interacting with a photonic mode confined in a double-metal cavity. Using a nonequilibrium Green's function formalism, we derive compact expressions for the current valid for arbitrary collective light--matter coupling strengths exceeding the relevant loss rates. We show that cavity polaritons leave observable transport signatures when the carrier injection rate is smaller than the cavity-induced electronic broadening. In this regime, the current--voltage characteristics exhibit inelastic sidebands associated with resonant and anti-resonant polariton emission, which are strongly enhanced under resonant illumination. Our results provide a realistic route to detecting cavity-induced modifications of charge transport in semiconductor heterostructures.", "url": "https://arxiv.org/abs/2607.29171", "type": "理论", "summary": "我们研究了通过掺杂量子阱的电子传输，该量子阱与限制在双金属腔中的光子模式强烈相互作用。使用非平衡格林函数形式，我们推导出对于任意集体光-物质耦合强度超过相关损失率有效的电流的紧凑表达式。我们表明，当载流子注入速率小于空腔引起的电子展宽时，空腔极化子会留下可观察到的传输特征。在这种情况下，电流-电压特性表现出与谐振和反谐振极化子发射相关的非弹性边带，这些边带在谐振照明下强烈增强。我们的结果为检测半导体异质结构中空腔引起的电荷传输变化提供了一条现实的途径。", "authors": [{"name": "Théophile Seck"}, {"name": "Yanko Todorov"}, {"name": "Guido Pupillo"}, {"name": "David Hagenmüller"}], "featured_authors": [{"name": "Théophile Seck"}, {"name": "Yanko Todorov"}, {"name": "Guido Pupillo"}, {"name": "David Hagenmüller"}], "author_count": 4}, {"id": "2607.29174", "category": "cond-mat", "title": "Curvature-amplified angular localization of radially localized states", "abstract": "We study a continuum Schrödinger particle on a surface of constant curvature subject to a radial random potential and a weaker angle-dependent perturbation. Exact angular-momentum decomposition reduces the rotationally symmetric problem to independent one-dimensional random radial channels. A positive radial Lyapunov exponent distinguishes radial Anderson localization from the circular probability profile imposed by symmetry. Projection of a narrow radial mode produces a disordered one-dimensional ring. For angular disorder that is stationary in physical arc length, the ring localization length grows as the inverse square of the perturbation amplitude. Equating this length with the geodesic circumference yields a shell-breaking radius that grows algebraically in flat space but as $2a\\ln(1/\\varepsilon)+O(1)$ on a hyperbolic surface of curvature radius $a$ and angular-disorder amplitude $\\varepsilon$. Transfer-matrix and finite-ring calculations determine the crossover coefficient. Direct polar-grid calculations at the same angular energy as the ring model use unbiased tracking of the degenerate angular-momentum subspace across six independent radial-disorder realizations and quantify the validity of the single-mode projection. The noncommuting weak-disorder and flat-curvature limits establish a curvature-amplified crossover for this deliberately anisotropic disorder ensemble, rather than a generic metal--insulator transition on the hyperbolic plane.", "url": "https://arxiv.org/abs/2607.29174", "type": "理论+数值", "summary": "我们研究了恒定曲率表面上的连续薛定谔粒子，该粒子受到径向随机势和较弱的角度相关扰动。精确的角动量分解将旋转对称问题简化为独立的一维随机径向通道。正径向 Lyapunov 指数将径向安德森定位与对称性施加的圆形概率分布区分开来。窄径向模式的投影产生无序的一维环。对于物理弧长固定的角度无序，环定位长度随着扰动幅度的平方反比增长。将此长度与测地线周长相等，得出破壳半径，该半径在平坦空间中以代数方式增长，但在曲率半径为 $a$ 且角紊乱幅度为 $\\varepsilon$ 的双曲曲面上为 $2a\\ln(1/\\varepsilon)+O(1)$。传递矩阵和有限环计算确定交叉系数。\n\n与环模型相同角能量的直接极网格计算使用跨越六个独立径向无序实现的简并角动量子空间的无偏跟踪，并量化单模投影的有效性。非交换弱无序和平曲率极限为这种故意的各向异性无序系综建立了曲率放大的交叉，而不是双曲平面上的一般金属-绝缘体转变。", "authors": [{"name": "Hiroyuki Shima"}], "featured_authors": [{"name": "Hiroyuki Shima"}], "author_count": 1}, {"id": "2607.29201", "category": "cond-mat", "title": "Coalescence-induced alignment of anisotropic particles in drying sessile droplets", "abstract": "Alignment of anisotropic particles strongly governs the functional properties of printed materials, yet most studies have focused on particle alignment in single evaporating droplets. In droplet- based printing, however, neighboring droplets can coalesce, generating rapid capillary flows that redistribute material and markedly affect the final morphology. Here, we use mesoscale simulations to investigate how droplet coalescence and subsequent evaporation jointly determine alignment and redistribution in sessile droplets with different contact angles and volumes. During the early stages of coalescence, the mean nematic order along the coalescence direction increases for all combinations of contact-angle and volume asymmetries of the droplets. At later times, the mean nematic order either continues to increase or decreases, depending on the droplet geometry. We derive a geometric scaling based on curvature and volume asymmetry and show that the simulation results collapse onto a master curve, identifying an effective geometric asymmetry parameter that governs the mean nematic order at the end of coalescence. During evaporation, the contact angle strongly influences how the coalescence-induced orientational structure is transferred to the final deposit. For small contact angles, the contact line remains pinned for a longer duration, better preserving alignment. In contrast, larger contact angles promote contact-line motion, which weakens alignment, as reflected by a reduced mean nematic order, while simultaneously generating stronger concentration gradients in the final deposit.", "url": "https://arxiv.org/abs/2607.29201", "type": "理论+数值", "summary": "各向异性颗粒的排列强烈控制着印刷材料的功能特性，但大多数研究都集中在单个蒸发液滴中的颗粒排列。然而，在基于液滴的打印中，相邻的液滴可以合并，产生快速的毛细管流，从而重新分布材料并显着影响最终的形态。在这里，我们使用介观模拟来研究液滴聚结和随后的蒸发如何共同确定具有不同接触角和体积的固着液滴的排列和重新分布。在聚结的早期阶段，对于液滴的接触角和体积不对称性的所有组合，沿着聚结方向的平均向列顺序增加。随后，平均向列序继续增加或减少，具体取决于液滴的几何形状。我们推导出基于曲率和体积不对称性的几何缩放，并表明模拟结果折叠到主曲线上，识别出控制合并结束时的平均向列顺序的有效几何不对称参数。\n\n在蒸发过程中，接触角强烈影响聚结引起的定向结构如何转移到最终沉积物。对于小接触角，接触线保持固定的时间较长，从而更好地保持对齐。相反，较大的接触角会促进接触线运动，从而削弱排列，正如平均向列序减少所反映的那样，同时在最终沉积物中产生更强的浓度梯度。", "authors": [{"name": "Johannes Schöttner"}, {"name": "Qingguang Xie"}, {"name": "Jens Harting"}], "featured_authors": [{"name": "Johannes Schöttner"}, {"name": "Qingguang Xie"}, {"name": "Jens Harting"}], "author_count": 3}, {"id": "2607.29230", "category": "cond-mat", "title": "Weak-electrolyte diffusiophoresis for rigid colloids", "abstract": "We develop a model for the diffusiophoresis of a chemically inert, rigid spherical colloid with fixed surface charge in a monovalent weak electrolyte, in which a neutral solute reversibly dissociates into ions. A weak far-field gradient is imposed in the neutral-species concentration. In the fast-reaction limit, local mass action and bulk electroneutrality determine the far-field ionic gradients, while the bulk zero-current condition determines the diffusion-potential gradient. We solve the coupled Nernst-Planck, Poisson and Stokes equations for arbitrary double-layer thickness, linearising in the gradient strength while retaining the nonlinear Poisson-Boltzmann equilibrium. In the Debye-Hückel limit, the mobility consists of one half of the matched fully dissociated response and a finite-double-layer correction due to neutral-ion coupling; the correction vanishes in both the Hückel and Smoluchowski limits. Beyond this limit, numerical solutions for the representative systems reveal a branch-selective response as the surface potential magnitude increases. When the counterion is slower than the co-ion, dissociation-association weakens a retarding concentration-polarisation layer, allowing the mobility to exceed the fully dissociated value. When the counterion is faster, the response remains close to the one-half scaling set by mass action. This reaction-polarisation coupling cannot be reproduced by adjusting only the bulk ionic strength, and hence the Debye length, in a fully dissociated model.", "url": "https://arxiv.org/abs/2607.29230", "type": "理论+数值", "summary": "我们开发了一种在一价弱电解质中具有固定表面电荷的化学惰性、刚性球形胶体的扩散电泳模型，其中中性溶质可逆地解离成离子。在中性物质浓度中施加弱远场梯度。在快反应极限下，局部质量作用和体电中性决定远场离子梯度，而体零电流条件决定扩散势梯度。我们求解任意双层厚度的耦合能斯特-普朗克、泊松和斯托克斯方程，线性化梯度强度，同时保留非线性泊松-玻尔兹曼平衡。在 Debye-Hückel 极限中，迁移率由匹配的完全解离响应的一半和中性离子耦合引起的有限双层校正组成；修正在 Hückel 和 Smoluchowski 极限中消失。超过这个限制，代表性系统的数值解揭示了随着表面电势大小增加的分支选择性响应。\n\n当抗衡离子比共离子慢时，解离-缔合会削弱阻滞浓差极化层，使迁移率超过完全解离值。当反离子速度更快时，响应保持接近质量作用设定的二分之一缩放比例。在完全解离的模型中，这种反应-极化耦合不能通过仅调整本体离子强度以及德拜长度来重现。", "authors": [{"name": "Subrata Majhi"}, {"name": "Huanshu Tan"}], "featured_authors": [{"name": "Subrata Majhi"}, {"name": "Huanshu Tan"}], "author_count": 2}, {"id": "2607.29249", "category": "cond-mat", "title": "Beyond Stoner-Wohlfarth: Machine-Learning Models and Symbolic Regression of Hard-Magnet Properties", "abstract": "Predicting the extrinsic properties from hysteresis loops of a magnetic grain, namely the coercive field, remanent magnetisation, and maximum energy product, from its intrinsic micromagnetic parameters is a central problem in permanent-magnet modelling. Established analytical models provide useful estimates but often neglect nonuniform magnetisation processes, whereas direct micromagnetic simulations are computationally expensive. In this work, we train machine-learning models on 12012 micromagnetic simulations of an idealised cubic grain, spanning broad ranges of the saturation magnetisation, exchange constant, and uniaxial anisotropy constant. Benchmarked against the analytical models on identical held-out data, the machine-learning models predict all three extrinsic properties with substantially lower errors. Symbolic regression recovers the Kronmüller form of the coercive field, with an effective demagnetising factor that depends on the material, and finds new closed-form expressions for the remanence and maximum energy product. Each law contains at most two fitted constants yet approaches the accuracy of the machine-learning models. We also investigate the inverse problem of recovering the intrinsic parameters from the three extrinsic properties. The saturation magnetisation and anisotropy constant are recovered accurately, whereas the exchange constant is not, because it influences the extrinsic properties only weakly. The trained models are released through the mammos-ai Python package, enabling thousands of candidate parameter sets to be screened in seconds rather than the hours or days required by direct micromagnetic simulation.", "url": "https://arxiv.org/abs/2607.29249", "type": "理论+数值", "summary": "根据磁性颗粒的磁滞回线预测其外在特性，即矫顽场、剩磁和最大磁能积，以及其内在微磁参数，是永磁体建模的核心问题。已建立的分析模型提供了有用的估计，但经常忽略不均匀磁化过程，而直接微磁模拟的计算成本很高。在这项工作中，我们在理想化立方晶粒的 12012 个微磁模拟上训练机器学习模型，涵盖饱和磁化强度、交换常数和单轴各向异性常数的广泛范围。以相同保留数据的分析模型为基准，机器学习模型以显着较低的错误预测所有三个外在属性。符号回归恢复了矫顽场的 Kronmüller 形式，并具有取决于材料的有效退磁因子，并找到了剩磁和最大磁能积的新封闭式表达式。每个定律最多包含两个拟合常数，但接近机器学习模型的准确性。\n\n我们还研究了从三个外在属性恢复内在参数的逆问题。饱和磁化强度和各向异性常数可以准确恢复，而交换常数则不能，因为它对外在性质的影响很弱。经过训练的模型通过 mammos-ai Python 包发布，可以在几秒钟内筛选出数千个候选参数集，而不是直接微磁模拟所需的数小时或数天。", "authors": [{"name": "Samuel J. R. Holt"}, {"name": "Christina Winkler"}, {"name": "Timoteo Colnaghi"}, {"name": "Martin Lang"}, {"name": "Swapneel A. Pathak"}, {"name": "Andrea Petrocchi"}, {"name": "Michael Adams"}, {"name": "Thomas Schrefl"}, {"name": "Andreas Marek"}, {"name": "Hans Fangohr"}], "featured_authors": [{"name": "Samuel J. R. Holt"}, {"name": "Christina Winkler"}, {"name": "Timoteo Colnaghi"}, {"name": "Thomas Schrefl"}, {"name": "Andreas Marek"}, {"name": "Hans Fangohr"}], "author_count": 10}, {"id": "2607.29259", "category": "cond-mat", "title": "Mechanical isotropy of heterogeneous octahedral materials", "abstract": "An octahedral network has been widely used as a fundamental building block for diverse architected materials. Here, we demonstrate that heterogeneous octahedral materials can achieve complete elastic isotropy at a critical constituent volume fraction, nearly independent of the constituent stiffness ratio. The anisotropy ratio, a, transitions from a > 1 to a < 1 at the critical constituent volume fraction, due to a change in the dominant deformation modes. Microstructural analysis reveals that the geometry and connectivity of the heterogeneous octahedral materials are very similar to those of heterogeneous materials constructed on combined simple cubic (SC) and body-centered cubic (BCC) lattices exhibiting opposite elastic anisotropy. More importantly, we demonstrate that varying the constituent volume fractions in the octahedral materials governs elastic anisotropy, similarly to tuning the BCC-to-SC composition ratio in the SC-BCC materials widely employed for designing mechanically isotropic architected materials. The mechanical isotropy of the heterogeneous octahedral materials is further assessed using 3D-printed prototypes.", "url": "https://arxiv.org/abs/2607.29259", "type": "理论", "summary": "八面体网络已被广泛用作各种建筑材料的基本构建块。在这里，我们证明异质八面体材料可以在临界成分体积分数下实现完全的弹性各向同性，几乎与成分刚度比无关。由于主要变形模式的变化，各向异性比 a 在临界成分体积分数处从 a > 1 转变为 a < 1。微观结构分析表明，异质八面体材料的几何形状和连通性与在简单立方（SC）和体心立方（BCC）组合晶格上构建的异质材料非常相似，表现出相反的弹性各向异性。更重要的是，我们证明改变八面体材料中的组成体积分数可以控制弹性各向异性，类似于调整广泛用于设计机械各向同性建筑材料的 SC-BCC 材料中的 BCC 与 SC 组成比。使用 3D 打印原型进一步评估异质八面体材料的机械各向同性。", "authors": [{"name": "Jehoon Moon"}, {"name": "Seunghwan Lee"}, {"name": "Gisoo Lee"}, {"name": "Jeongun Lee"}, {"name": "Hansohl Cho"}], "featured_authors": [{"name": "Jehoon Moon"}, {"name": "Seunghwan Lee"}, {"name": "Gisoo Lee"}, {"name": "Jeongun Lee"}, {"name": "Hansohl Cho"}], "author_count": 5}, {"id": "2607.29292", "category": "cond-mat", "title": "Potential-defect-driven collective modes of one-dimensional two-component quantum droplets", "abstract": "We examine a one-dimensional binary mixture of ultradilute quantum droplets in the presence of a central potential defect. The properties of the potential strength and the number of atoms exhibit distinct polarization transitions and low-lying ollective excitation spectra. The balance of (attractive) Lee-Huang-Yang quantum fluctuations and repulsive mean-field interactions results in a self-bound quantum droplet in a potential well. However, the potential barrier causes the polarization transition with the number of atoms, which is reflected in the excitation spectrum as a discontinuity and softening of the quasiparticle modes. We reveal that the critical number of atoms for the transition decreases as the attractive intercomponent interaction increases. Finally, the quench time dynamics of the interaction in potential barrier and well show the localization and diffusive fragmented droplets of two-component systems.", "url": "https://arxiv.org/abs/2607.29292", "type": "理论", "summary": "我们在存在中心电位缺陷的情况下检查超稀量子液滴的一维二元混合物。势强和原子数量的特性表现出明显的偏振跃迁和低位集体激发光谱。 （有吸引力的）李黄杨量子涨落和排斥平均场相互作用的平衡导致势阱中的自束缚量子液滴。然而，势垒引起随原子数量的极化跃迁，这在激发光谱中反映为准粒子模式的不连续性和软化。我们发现，随着组分间吸引力相互作用的增加，转变的临界原子数会减少。最后，势垒和相互作用的淬灭时间动力学很好地显示了双组分体系的局部化和扩散碎片液滴。", "authors": [{"name": "Harsimranjit Kaur"}, {"name": "Kuldeep Suthar"}], "featured_authors": [{"name": "Harsimranjit Kaur"}, {"name": "Kuldeep Suthar"}], "author_count": 2}, {"id": "2607.29309", "category": "cond-mat", "title": "Quasiparticle modes across soliton transition with density-dependent gauge field in optical lattices", "abstract": "Tunneling of ultracold bosons confined in a one-dimensional optical lattice results in a nontrivial gauge field depending on density-difference between the sites involved. The density dependent tunneling (DDT) causes a first-order quantum phase transition from the Bose-Einstein condensate to the localized soliton. Here, we examine the low-lying quasiparticle mode evolution across the transition in the weakly-interacting limit. To this end, we employ the discrete Bogoliubov theory and dispersion curves to reveal an increase in the quasiparticle energies of dipole (and higher) excitations with DDT in the soliton phase while preserving the zero-energy mode. This is due to the decrease in effective tunneling, resulting in a larger energy cost to move the soliton, and causes faster dipole oscillations. The repulsive on-site atomic interaction further shifts the critical gauge field of DDT to a larger value by stabilizing the lattice soliton. The latter is corroborated by a phase diagram in the complex gauge field plane and mode energy gap of quasiparticles. We further show that the soliton does not exhibit Bloch oscillations as the effective momentum becomes density-dependent and deforms its internal structure. The dynamical response of the trap quench does not excite the width of localized wave-packet, and the breathing oscillations are suppressed. The latter two dynamical properties of the condensate uniquely contrast the soliton state due to the density-dependent gauge field.", "url": "https://arxiv.org/abs/2607.29309", "type": "理论+数值", "summary": "限制在一维光学晶格中的超冷玻色子的隧道效应会产生一个不平凡的规范场，具体取决于所涉及的位点之间的密度差。密度相关隧道效应 (DDT) 导致从玻色-爱因斯坦凝聚体到局域孤子的一阶量子相变。在这里，我们研究了弱相互作用极限过渡期间的低准粒子模式演化。为此，我们采用离散 Bogoliubov 理论和色散曲线来揭示孤子相中 DDT 偶极子（和更高）激发的准粒子能量的增加，同时保留零能量模式。这是由于有效隧道效应的减少，导致移动孤子的能量成本更大，并导致更快的偶极子振荡。排斥的现场原子相互作用通过稳定晶格孤子进一步将DDT的临界规范场移动到更大的值。后者由复规范场平面中的相图和准粒子的模式能隙证实。\n\n我们进一步表明，当有效动量变得依赖于密度并使其内部结构变形时，孤子不会表现出布洛赫振荡。陷阱猝灭的动态响应不会激发局域波包的宽度，并且呼吸振荡被抑制。由于依赖于密度的规范场，凝聚体的后两个动力学特性与孤子态形成了独特的对比。", "authors": [{"name": "Poorava Kumar Meena"}, {"name": "Kuldeep Suthar"}], "featured_authors": [{"name": "Poorava Kumar Meena"}, {"name": "Kuldeep Suthar"}], "author_count": 2}, {"id": "2607.29392", "category": "cond-mat", "title": "Sound attenuation and velocity shift in antiferromagnetic spin-1/2 chains", "abstract": "We investigate ultrasound attenuation and sound velocity shift in antiferromagnetic spin-1/2 XXZ chains in magnetic field. We relate the sound velocity shift to derivatives of the free energy with respect to exchange interactions, permitting its calculation with integrability techniques at any temperature. Using bosonization, we predict the sound velocity shift exhibits a quadratic temperature correction at low temperatures in the Tomonaga-Luttinger liquid phase. Close to the fully polarized phase, a universal behavior associated with z=2 quantum criticality is found. In the Tomonaga-Luttinger liquid phase, ultrasound attenuation obeys a scaling law as a function of wavelength and temperature. An enhancement of attenuation is obtained near the fully polarized phase.", "url": "https://arxiv.org/abs/2607.29392", "type": "理论+数值", "summary": "我们研究了磁场中反铁磁自旋 1/2 XXZ 链的超声衰减和声速偏移。我们将声速变化与交换相互作用的自由能导数联系起来，从而允许在任何温度下使用可积技术进行计算。利用玻色子化，我们预测声速变化在 Tomonaga-Luttinger 液相的低温下表现出二次温度校正。接近完全极化相位时，发现了与 z=2 量子临界性相关的普遍行为。在 Tomonaga-Luttinger 液相中，超声衰减遵循作为波长和温度函数的缩放定律。在完全偏振相位附近获得了衰减的增强。", "authors": [{"name": "Edmond Orignac"}, {"name": "Emeric Caprani"}, {"name": "Roberta Citro"}], "featured_authors": [{"name": "Edmond Orignac"}, {"name": "Emeric Caprani"}, {"name": "Roberta Citro"}], "author_count": 3}, {"id": "2607.29434", "category": "cond-mat", "title": "Entropy production of active matter systems as indicator for computing performance", "abstract": "Physical systems can process information through their natural dynamics, offering alternatives to conventional digital computing. Reservoir computing offers a basic framework by using a nonlinear substrate to map inputs into rich dynamical states read out by a simple linear layer. Active matter substrates are striking examples; they continuously consume energy and produce entropy. Theoretically, entropy production (EP) can describe the irreversibility and distance from equilibrium. But it remains unclear whether it can track computational capabilities. We address this conceptual gap by analyzing a driven swarm reservoir model. The system EP is computed from phase-space contraction and the bath EP from heat flow, separately, and put in direct association to prediction performance on a Lorenz-63 task. Via force parameter scans, we show that dynamical regimes with the strongest response to a driver as well as dissipation coincide with peak performance. Therein, the dynamical discrepancy between innate (minimal dissipation) and driven transferred heat (maximal dissipation) is sharpest. Generally, driver work and relative differences of driven and undriven EP closely mirror the performance landscape. The system EP, derived from a generalized Liouville-equation estimator, and heat flow provide complementary diagnostics and metrics, which are most robust in the best-performing regime. These results extend prior expectations that dissipation matters for computation by identifying when and how it becomes predictive. They also relate inference power to innate dynamics, pointing to generic principles for physical computing and where EP offers a screening metric for reservoirs and other base substrates.", "url": "https://arxiv.org/abs/2607.29434", "type": "理论+数值", "summary": "物理系统可以通过其自然动力学处理信息，提供传统数字计算的替代方案。油藏计算提供了一个基本框架，通过使用非线性基底将输入映射到由简单线性层读出的丰富动态状态。活性物质基质就是引人注目的例子；它们不断消耗能量并产生熵。理论上，熵产生（EP）可以描述不可逆性和距平衡的距离。但目前尚不清楚它是否可以跟踪计算能力。我们通过分析驱动群水库模型来解决这个概念上的差距。系统 EP 是根据相空间收缩计算的，浴 EP 是根据热流计算的，并与 Lorenz-63 任务的预测性能直接相关。通过力参数扫描，我们表明对驱动器和耗散具有最强响应的动态状态与峰值性能一致。其中，固有热量（最小耗散）和驱动传递热量（最大耗散）之间的动态差异最为明显。\n\n一般来说，驾驶员工作以及驱动和非驱动 EP 的相对差异密切反映了性能状况。系统 EP 源自广义刘维尔方程估计器，而热流提供了补充诊断和指标，在最佳性能状态下最为稳健。这些结果通过确定耗散何时以及如何变得具有预测性，扩展了先前的预期，即耗散对于计算很重要。他们还将推理能力与固有动力学联系起来，指出了物理计算的通用原理，以及 EP 为储层和其他基础基质提供筛选指标的地方。", "authors": [{"name": "Patrick Egenlauf"}, {"name": "Hannes A. Kröninger"}, {"name": "Arnulf Kung"}, {"name": "Mario U. Gaimann"}, {"name": "Miriam Klopotek"}], "featured_authors": [{"name": "Patrick Egenlauf"}, {"name": "Hannes A. Kröninger"}, {"name": "Arnulf Kung"}, {"name": "Mario U. Gaimann"}, {"name": "Miriam Klopotek"}], "author_count": 5}, {"id": "2607.29450", "category": "cond-mat", "title": "Optimal Navigation on Simplicial Complexes", "abstract": "The navigation time and optimal search strategies deriving from random dynamical processes on binary graphs have been extensively explored and analyzed, being of prominent interest in the network science field. In this work, we study an extension of these topological measures for simplicial complexes: a specific type of geometric and algebraic structures that encapsulates higher-order interactions. Here, the explorability analysis of simplicial complexes has been conducted in terms of the mean first passage times between nodes, i.e. the 0th-order simplices, with the inclusion of a long-range stochastic teleportation term modulated with respect to the local random walk hopping across the various dimensions. We also provide a perturbative approximation scheme recovering the modulation parameter between pure random walk and teleportation mode (for higher-order setting) acting as the expansion parameter.", "url": "https://arxiv.org/abs/2607.29450", "type": "理论", "summary": "由二元图上的随机动态过程得出的导航时间和最优搜索策略已被广泛探索和分析，在网络科学领域引起了广泛的兴趣。在这项工作中，我们研究了单纯复形的拓扑度量的扩展：封装高阶相互作用的特定类型的几何和代数结构。在这里，单纯形复形的可探索性分析是根据节点之间的平均首次通过时间（即 0 阶单纯形）进行的，其中包含根据跨各个维度的局部随机游走跳跃调制的远程随机隐形传态项。我们还提供了一种微扰近似方案，恢复纯随机游走和隐形传态模式（对于高阶设置）之间的调制参数，作为扩展参数。", "authors": [{"name": "Diego Febbe"}, {"name": "Duccio Fanelli"}, {"name": "Gianluca Peri"}, {"name": "Timoteo Carletti"}], "featured_authors": [{"name": "Diego Febbe"}, {"name": "Duccio Fanelli"}, {"name": "Gianluca Peri"}, {"name": "Timoteo Carletti"}], "author_count": 4}, {"id": "2607.29452", "category": "cond-mat", "title": "A Unified Symmetry Framework For In-plane Anomalous Hall effect", "abstract": "The in-plane anomalous Hall effect (IPAHE), driven by an in-plane net magnetization or an applied magnetic field, challenges the conventional anomalous Hall paradigm. Despite growing interest, a unified symmetry principle governing these phenomena has remained elusive. Here, we establish a comprehensive symmetry framework that bridges the spin space group, which dictates the magnetic geometry, with the magnetic space group, which governs the anomalous Hall response. We show that spontaneous IPAHE can emerge in ferromagnets when spin-orbit-coupling-induced spin-group symmetry breaking permits additional net magnetization directions. For field-induced IPAHE, we analyze how an applied magnetic field reduces the symmetries of all 122 magnetic point groups and identify 54 groups that support IPAHE. Our framework naturally predicts IPAHE in a broad class of unconventional magnets, including altermagnets and odd-parity magnets. In particular, symmetry analysis reveals characteristic one-, two-, or three-fold angular harmonics of the Hall conductance under an in-plane rotating field, providing a symmetry-resolved fingerprint for unconventional magnetism. Using this framework, we screen the MAGNDATA database and identify candidate materials supporting spontaneous or field-induced IPAHE, encompassing ferromagnets, antiferromagnets, and unconventional magnets. Finally, we validate the symmetry predictions through first-principles calculations for two representative materials.", "url": "https://arxiv.org/abs/2607.29452", "type": "理论+数值", "summary": "由面内净磁化强度或外加磁场驱动的面内反常霍尔效应（IPAHE）挑战了传统的反常霍尔范式。尽管人们的兴趣日益浓厚，但控制这些现象的统一对称原理仍然难以捉摸。在这里，我们建立了一个全面的对称框架，将决定磁几何形状的自旋空间群与控制反常霍尔响应的磁空间群联系起来。我们证明，当自旋轨道耦合引起的自旋群对称性破缺允许额外的净磁化方向时，铁磁体中会出现自发的 IPAHE。对于场感应 IPAHE，我们分析了所施加的磁场如何降低所有 122 个磁点组的对称性，并确定了支持 IPAHE 的 54 个组。我们的框架自然地预测了广泛的非常规磁体中的 IPAHE，包括交流磁体和奇宇称磁体。特别是，对称性分析揭示了面内旋转场下霍尔电导的特征一倍、二倍或三倍角谐波，为非常规磁性提供了对称解析的指纹。\n\n使用这个框架，我们筛选 MAGNDATA 数据库并确定支持自发或场感应 IPAHE 的候选材料，包括铁磁体、反铁磁体和非常规磁体。最后，我们通过两种代表性材料的第一性原理计算验证了对称性预测。", "authors": [{"name": "Xun-Jiang Luo"}, {"name": "Yong-Ting Shi"}, {"name": "Ding-Fu Shao"}, {"name": "Ping Zhang"}, {"name": "Ning Hao"}, {"name": "Mingliang Tian"}], "featured_authors": [{"name": "Xun-Jiang Luo"}, {"name": "Yong-Ting Shi"}, {"name": "Ding-Fu Shao"}, {"name": "Ping Zhang"}, {"name": "Ning Hao"}, {"name": "Mingliang Tian"}], "author_count": 6}, {"id": "2607.29475", "category": "cond-mat", "title": "Dissipation-enhanced vortex clustering in a compressible quantum fluid", "abstract": "Vortex clustering is commonly associated with conservative two-dimensional quantum-fluid dynamics. Therefore, particle loss is mainly expected to limit clustering by shortening the time available for vortex correlations to develop. Here we show instead that particle loss can enhance transient vortex clustering beyond the conservative evolution. We numerically study freely decaying, confined two-dimensional condensates initialized with random distributions of vortices and antivortices, and find a pronounced nonmonotonic dependence of the maximum clustering on particle lifetime. The enhancement is strongest at intermediate particle-loss rates, where loss-induced background rarefaction and incompressible kinetic energy relaxation occur on comparable timescales. Our results identify a finite dynamical window, selected by linear particle loss, in which a confined compressible quantum fluid develops stronger same-sign vortex correlations than in the conservative limit.", "url": "https://arxiv.org/abs/2607.29475", "type": "理论+数值", "summary": "涡旋聚类通常与保守的二维量子流体动力学相关。因此，粒子损失主要通过缩短涡旋相关性发展的时间来限制聚类。在这里，我们证明粒子损失可以增强瞬态涡旋聚类，超越保守进化。我们对自由衰变、受限二维凝聚体进行数值研究，这些凝聚体以涡旋和反涡旋的随机分布初始化，并发现最大聚类对粒子寿命的显着非单调依赖性。这种增强在中等粒子损失率下最强，其中损失引起的背景稀疏和不可压缩动能弛豫发生在可比较的时间尺度上。我们的结果确定了一个由线性粒子损失选择的有限动力学窗口，其中受限可压缩量子流体产生比保守极限更强的同号涡旋相关性。", "authors": [{"name": "P. Comaron"}, {"name": "M. Matuszewski"}, {"name": "D. Sanvitto"}, {"name": "D. Ballarini"}, {"name": "A. S. Lanotte"}], "featured_authors": [{"name": "P. Comaron"}, {"name": "M. Matuszewski"}, {"name": "D. Sanvitto"}, {"name": "D. Ballarini"}, {"name": "A. S. Lanotte"}], "author_count": 5}, {"id": "2607.29486", "category": "cond-mat", "title": "Valley- and Orbital-Controlled 2D Chern Insulators Without Spin-orbit Interaction", "abstract": "We present a theoretical study of orbital-induced topological phase transitions in a two-dimensional lattice model with staggered potential $(\\Delta)$ and orbital coupling $(\\lambda)$ competing with the hopping strength. By tuning these parameters, two gap-closing mechanisms emerge: valley closure at $\\mathbf{K}$ and $\\mathbf{K'}$ for $\\lambda=\\pm\\Delta$, and a $\\mathbf{\\Gamma}$-point closure at $\\lambda=\\pm\\sqrt{\\Delta^2+9t_0^{2}}$. Their interplay defines a topological window in which the Berry curvature localizes near a single valley, yielding a quantized anomalous Hall conductivity ($\\sigma_{xy}=e^{2}/h$) and Chern number ($C=1$). These results demonstrate orbital-driven Chern insulating behavior without spin-orbit coupling. The resulting phase diagram captures the transition from trivial to topological phases and suggests practical routes for orbital engineering in tunable lattice systems.", "url": "https://arxiv.org/abs/2607.29486", "type": "理论+数值", "summary": "我们提出了二维晶格模型中轨道引起的拓扑相变的理论研究，其中交错势 $(\\Delta)$ 和轨道耦合 $(\\lambda)$ 与跳跃强度竞争。通过调整这些参数，出现了两种间隙闭合机制：$\\lambda=\\pm\\Delta$ 处的 $\\mathbf{K}$ 和 $\\mathbf{K'}$ 处的山谷闭合，以及 $\\lambda=\\pm\\sqrt{\\Delta^2+9t_0^{2}}$ 处的 $\\mathbf{\\Gamma}$ 点闭合。它们的相互作用定义了一个拓扑窗口，其中贝里曲率位于单个谷附近，产生量子化的反常霍尔电导率 ($\\sigma_{xy}=e^{2}/h$) 和陈数 ($C=1$)。这些结果证明了轨道驱动的陈绝缘行为，无需自旋轨道耦合。由此产生的相图捕获了从平凡相到拓扑相的转变，并为可调谐晶格系统中的轨道工程提出了实用路线。", "authors": [{"name": "J. Benkaida"}, {"name": "O. Benhaida"}, {"name": "L. B. Drissi"}, {"name": "E. H. Saidi"}], "featured_authors": [{"name": "J. Benkaida"}, {"name": "O. Benhaida"}, {"name": "L. B. Drissi"}, {"name": "E. H. Saidi"}], "author_count": 4}, {"id": "2607.29510", "category": "cond-mat", "title": "Ordered-to-disordered transfer learning with graph neural networks for formation-energy and HOMO-LUMO gap prediction in high-entropy perovskite oxides", "abstract": "High-entropy perovskite oxides (HEPOs) represent a chemically complex class of materials with promising functional properties, yet their vast compositional space and, chemical/structural disorder pose significant challenge for accurate property prediction. Graph neural networks (GNNs) enable rapid exploration of materials space but are often limited by the availability of representative training data. Here, we investigate ordered-to-disordered transfer learning using GNNs for formation-energy and HOMO-LUMO gap prediction in HEPOs by transferring knowledge learned from chemically ordered perovskites. Four representative GNN models, including CGCNN, GATGNN, ALIGNN and M3GNet are evaluated to understand the role of structural representations, spanning pairwise two-body and angular three-body interactions in transfer performance. We find strong property-dependent transfer behavior: formation-energy prediction transfers effectively to disordered HEPOs, whereas HOMO-LUMO gap prediction shows limited transferability due to its sensitivity to local chemical environments. Incorporating a small HEPO-specific training dataset substantially improves HOMO-LUMO gap prediction. Representation-level analysis using UMAP further highlights the importance of encoding three-body geometric information such as in ALIGNN for capturing complex structure-property relationships and improving transferability.", "url": "https://arxiv.org/abs/2607.29510", "type": "理论+数值", "summary": "高熵钙钛矿氧化物（HEPO）代表了一类化学复杂的材料，具有良好的功能特性，但其巨大的组成空间和化学/结构无序对准确的特性预测提出了重大挑战。图神经网络 (GNN) 能够快速探索材料空间，但通常受到代表性训练数据可用性的限制。在这里，我们通过转移从化学有序钙钛矿中学到的知识，研究使用 GNN 进行有序到无序的迁移学习，以进行 HEPO 中的形成能量和 HOMO-LUMO 间隙预测。对四种代表性的 GNN 模型（包括 CGCNN、GATGNN、ALIGNN 和 M3GNet）进行了评估，以了解结构表示的作用，跨越成对二体和有角度的三体交互在传输性能中的作用。我们发现了强烈的属性依赖转移行为：形成能预测有效地转移到无序的 HEPO，而 HOMO-LUMO 间隙预测由于其对局部化学环境的敏感性而显示出有限的可转移性。结合小型 HEPO 特定训练数据集可显着改善 HOMO-LUMO 间隙预测。\n\n使用 UMAP 的表示级分析进一步强调了编码三体几何信息（例如在 ALIGNN 中）对于捕获复杂的结构-属性关系和提高可转移性的重要性。", "authors": [{"name": "Panupol Untarabut"}, {"name": "Narjes Jomaa"}, {"name": "Sylvian Cadars"}, {"name": "Olivier Masson"}, {"name": "Samuel Bernard"}, {"name": "Assil Bouzid"}, {"name": "Santanu Saha"}], "featured_authors": [{"name": "Panupol Untarabut"}, {"name": "Narjes Jomaa"}, {"name": "Sylvian Cadars"}, {"name": "Samuel Bernard"}, {"name": "Assil Bouzid"}, {"name": "Santanu Saha"}], "author_count": 7}, {"id": "2607.29521", "category": "cond-mat", "title": "Elastodynamics from Eulerian Poisson-bracket formalism: application to chiral odd solids", "abstract": "The Poisson-bracket (PB) formalism is widely used to derive dynamics of coarse-grained (CG) fields to capture large-scale physics, extending the role of PBs in classical particle mechanics to macroscopic fields. It has been applied to fluctuations in critical phenomena, hydrodynamics of liquid crystals, liquid crystal elastomers, tissues, and the emergence of odd viscosity from spinning particles. The PB formalism can be formulated in either the Lagrangian framework, using reference space, or the Eulerian framework, using real space. Conventionally, the Lagrangian formulation is used for elastic solids, and the Eulerian one for fluids. However, growing interest in Eulerian descriptions of solids has emerged for phenomena naturally defined in real space, such as viscoelastic responses, moving interfaces, and field-induced structural changes in particles. Here we develop a systematic formulation for applying the Eulerian PB formalism to elastic systems with potentials typically written in Lagrangian space, and clarify its consistency with the Lagrangian counterpart. We show that the Eulerian formulation generates additional nonlinearities absent in the Lagrangian framework. Such nonlinearities originate from CG volume changes under coordinate transformation and from particle flow across neighboring CG volumes. They must be retained when nonlinear effects are important. To illustrate, we study chiral active solids of finite-sized particles, where active torques drive internal particle rotations and generate geometric nonlinearities. These nonlinearities give rise to the odd elastic modulus, which non-reciprocally couples two different shear modes in stress-strain response. By recovering this modulus directly from the Eulerian PB formalism, we demonstrate its ability to capture emergent nonlinear elastic behavior in driven active solids, whose stresses are naturally measured in real space.", "url": "https://arxiv.org/abs/2607.29521", "type": "理论", "summary": "泊松括号 (PB) 形式被广泛用于推导粗粒度 (CG) 场的动力学，以捕捉大尺度物理现象，将 PB 在经典粒子力学中的作用扩展到宏观领域。它已被应用于临界现象的波动、液晶的流体动力学、液晶弹性体、组织以及旋转颗粒的奇怪粘度的出现。 PB 形式可以在拉格朗日框架（使用参考空间）或欧拉框架（使用实空间）中表述。通常，拉格朗日公式用于弹性固体，欧拉公式用于流体。然而，对于真实空间中自然定义的现象，例如粘弹性响应、移动界面和粒子中场引起的结构变化，人们对固体的欧拉描述越来越感兴趣。在这里，我们开发了一种系统公式，用于将欧拉 PB 形式主义应用于具有通常在拉格朗日空间中书写的势的弹性系统，并阐明其与拉格朗日对应物的一致性。我们证明欧拉公式会产生拉格朗日框架中不存在的额外非线性。\n\n这种非线性源于坐标变换下的 CG 体积变化以及相邻 CG 体积上的粒子流。当非线性效应很重要时，必须保留它们。为了说明这一点，我们研究了有限尺寸粒子的手性活性固体，其中活性扭矩驱动内部粒子旋转并产生几何非线性。这些非线性产生了奇数弹性模量，它在应力-应变响应中非交互地耦合了两种不同的剪切模式。通过直接从欧拉 PB 形式恢复该模量，我们证明了其捕获驱动活性固体中的突现非线性弹性行为的能力，其应力在真实空间中自然测量。", "authors": [{"name": "Cheng-Tai Lee"}, {"name": "Tomer Markovich"}], "featured_authors": [{"name": "Cheng-Tai Lee"}, {"name": "Tomer Markovich"}], "author_count": 2}, {"id": "2607.29554", "category": "cond-mat", "title": "Exponential Capacity in Multilayer Hetero-Associative Neural Networks", "abstract": "Exponential Hopfield networks store a number of patterns that grows exponentially with the number of neurons, and in their classical formulation they are auto-associative: they complete a corrupted copy of a memory into the memory itself. Many of the tasks one wants such a network to perform are instead hetero-associative, mapping a cue to a different target. We introduce and analyse an exponential neural network of $L$ layers of $N$ binary neurons, each layer carrying its own dataset, whose energy is an exponential of the product of the per-layer Mattis overlaps, so that it is minimised precisely when every layer retrieves the pattern of the same index; the stored association must be a surjective function of the cue, and we show why nothing else can be stored at all. A cavity/signal-to-noise analysis, made exact at leading order by a large-deviation evaluation of the noise, shows that the aligned hetero-associative state is a fixed point of the zero-temperature dynamics up to a number of stored patterns $P_c\\sim e^{N\\rho_L}$, exponential in the layer size, with an explicit rate $\\rho_L$ that grows like $L\\log 2$; enlarging the basins of attraction lowers the rate but never destroys its exponential character. Comparing the theory with structured data we find that the exponential capacity and the predicted basins survive correlated, many-to-one patterns: the network is a near-perfect content-addressable memory. The same closed forms describe, without refitting, a synthetic manifold, real T-cell-receptor/epitope triples and natural-language intent data, so the mechanism is domain-universal. Generalisation to unseen cues, though significantly above chance, stays below memorisation, and it is the geometry of the encoding, rather than the data domain, that sets how far above chance it reaches. In this family, exponential storage and strong generalisation are distinct capabilities.", "url": "https://arxiv.org/abs/2607.29554", "type": "理论", "summary": "指数 Hopfield 网络存储许多随着神经元数量呈指数增长的模式，在其经典公式中，它们是自动关联的：它们将损坏的内存副本完成到内存本身。人们希望这样的网络执行的许多任务都是异联想的，将线索映射到不同的目标。我们介绍并分析了一个由$L$层的$N$二元神经元组成的指数神经网络，每层都有自己的数据集，其能量是每层Mattis重叠乘积的指数，这样当每层检索相同索引的模式时，它就精确地最小化；存储的关联必定是提示的满射函数，并且我们展示了为什么根本不能存储其他任何东西。\n\n通过对噪声进行大偏差评估，以前导顺序进行精确的腔/信号噪声分析，表明对齐的异质缔合态是零温度动态的固定点，最多可达多个存储模式 $P_c\\sim e^{N\\rho_L}$，层大小呈指数关系，具有显式速率 $\\rho_L$，其增长方式为 $L\\log 2$；扩大吸引力盆地会降低速率，但不会破坏其指数特征。将该理论与结构化数据进行比较，我们发现指数容量和预测的盆地存在相关的多对一模式：网络是一个近乎完美的内容可寻址存储器。相同的封闭形式无需重新拟合即可描述合成流形、真实的 T 细胞受体/表位三元组和自然语言意图数据，因此该机制是领域通用的。对看不见的线索的概括，虽然明显高于偶然性，但仍然低于记忆，并且是编码的几何结构，而不是数据域，决定了它达到高于偶然性的程度。在这个系列中，指数存储和强泛化是不同的功能。", "authors": [{"name": "Elena Agliari"}, {"name": "Adriano Barra"}, {"name": "Andrea Ladiana"}, {"name": "Andrea Lepre"}], "featured_authors": [{"name": "Elena Agliari"}, {"name": "Adriano Barra"}, {"name": "Andrea Ladiana"}, {"name": "Andrea Lepre"}], "author_count": 4}, {"id": "2607.29573", "category": "cond-mat", "title": "Hidden chiral signatures in ferroaxial K2Zr(PO4)2", "abstract": "We use first-principles calculations and multipole analyses to demonstrate the relationship between ferroaxiality and chirality in the prototypical ferroaxial material K2Zr(PO4)2. Using the atomic-site electric toroidal monopole as a measure of electronic chirality in real space, we show that, while the paraxial phase of K2Zr(PO4)2 is non-chiral, the ferroaxial phase is antiferro-chiral. By applying an electric field, we induce a ferri-chiral state with net electronic chirality which is opposite for opposite underlying ferroaxial domains and can be tuned by the direction and strength of the electric field. Assoc
