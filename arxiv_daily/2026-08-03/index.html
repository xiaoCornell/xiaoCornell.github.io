iated with the real-space induced chirality, we find a distinct response in momentum space, with induced non-zero components in the Berry curvature dipole tensor that switch sign between opposite ferri-chiral domains. Our findings therefore reveal hidden chirality in ferroaxial materials in both real and momentum space.", "url": "https://arxiv.org/abs/2607.29573", "type": "数值", "summary": "我们使用第一性原理计算和多极分析来证明原型铁轴材料 K2Zr(PO4)2 中铁轴性和手性之间的关系。使用原子位电环形单极子作为实空间中电子手性的量度，我们发现，虽然 K2Zr(PO4)2 的近轴相是非手性的，但铁轴相是反铁手性的。通过施加电场，我们诱导出具有净电子手性的铁手性态，这与相反的底层铁轴磁畴相反，并且可以通过电场的方向和强度进行调节。与真实空间诱导的手性相关，我们发现动量空间中存在明显的响应，贝里曲率偶极子张量中诱导的非零分量在相反的铁手性域之间切换符号。因此，我们的研究结果揭示了铁轴材料在实空间和动量空间中隐藏的手性。", "authors": [{"name": "Nora Taufertshöfer"}, {"name": "Awadhesh Narayan"}, {"name": "Nicola A. Spaldin"}], "featured_authors": [{"name": "Nora Taufertshöfer"}, {"name": "Awadhesh Narayan"}, {"name": "Nicola A. Spaldin"}], "author_count": 3}, {"id": "2607.29590", "category": "cond-mat", "title": "Spindrift: Learning quantum degeneracy from thermal purity in restricted path integral Monte Carlo", "abstract": "Restricted path integral Monte Carlo (RPIMC) sidesteps the fluctuating Fermion sign problem by confining paths within nodal pockets of a trial density matrix, thereby recovering polynomial scaling. However, this nodal surface must be provided from elsewhere; unless it is exact, it introduces a fixed-node energy error. Here we introduce \\textsc{Spindrift}, a Variational Density Matrix approach that learns the many-body Fermionic density matrix from a regularised Bloch residual, evaluated on samples drawn by a restricted Worm algorithm. Motivated by the observation of the `purity' of quantum mechanics at high temperature (where kinetic energy dominates), we train the density matrix along a temperature (imaginary time) curriculum, learning increasingly large \\emph{corrections} to the initial free-particle reference. We parametrise our model with a permutation-equivariant continuous normalising flow to generate quasi-particle backflow trajectories, modulated by a symmetric Jastrow factor. This architecture guarantees exact Fermionic antisymmetry and spatial symmetry throughout training. Simulating $N=3$ interacting Fermions in a two-dimensional harmonic trap, we demonstrate stable curriculum training. The learnt velocity field smoothly deforms the nodal structure away from the free-particle reference. Open-Worm G-sector trapping provides a natural diagnostic for nodal accuracy. Although the current lack of a nodal action in our estimator precludes absolute benchmarking, \\textsc{Spindrift} lowers the restricted thermodynamic energy relative to the free-particle reference at each temperature, establishing a stable, physics-informed framework for finite-temperature quantum Monte Carlo where the nodal structure is learnt self-consistently.", "url": "https://arxiv.org/abs/2607.29590", "type": "理论+数值", "summary": "受限路径积分蒙特卡罗 (RPIMC) 通过将路径限制在试验密度矩阵的节点袋内，从而回避波动费米子符号问题，从而恢复多项式缩放。然而，这个节点表面必须从其他地方提供；除非它是精确的，否则它会引入固定节点能量误差。在这里，我们介绍 \\textsc{Spindrift}，一种变分密度矩阵方法，它从正则化的布洛赫残差中学习多体费米子密度矩阵，并根据受限蠕虫算法绘制的样本进行评估。受高温（动能占主导地位）量子力学“纯度”观察的启发，我们沿着温度（虚时间）课程训练密度矩阵，学习对初始自由粒子参考的越来越大的\\emph{校正}。我们使用排列等变连续归一化流对模型进行参数化，以生成由对称贾斯特罗因子调制的准粒子回流轨迹。该架构保证了整个训练过程中精确的费米子反对称性和空间对称性。\n\n模拟二维​​谐波陷阱中 $N=3$ 相互作用的费米子，我们展示了稳定的课程训练。学习到的速度场使节点结构平滑地变形，远离自由粒子参考。 Open-Worm G 扇区捕获提供了节点精度的自然诊断。尽管目前我们的估计器中缺乏节点作用，无法进行绝对基准测试，但 \\textsc{Spindrift} 降低了每个温度下相对于自由粒子参考的受限热力学能量，为有限温度量子蒙特卡罗建立了一个稳定的、基于物理的框架，其中节点结构是自洽学习的。", "authors": [{"name": "Jarvist Moore Frost"}], "featured_authors": [{"name": "Jarvist Moore Frost"}], "author_count": 1}, {"id": "2607.29599", "category": "cond-mat", "title": "Superselectivity as a Receptor-Fluctuation Response", "abstract": "Superselective multivalent binding enables sharp receptor-density discrimination in targeting and sensing, but what its logarithmic response measures microscopically remains unclear. Here, we derive an exact response decomposition of the selectivity into receptor-state reweighting and a direct occupation response. In the dilute quenched Poisson limit, the direct term vanishes and selectivity is exactly the mean receptor excess beneath bound particles, which can be measured at a single density from a sufficiently large co-registered receptor-particle image. Beyond Poisson statistics, the excess is normalized by the Fano factor for a linear count response, while changes in distribution shape require the full count-resolved response. Lattice simulations verify these relations across distinct receptor statistics, while off-lattice simulations show that particle crowding enters through the direct term. These results establish a fluctuation-response framework linking multivalent selectivity to the local receptor fluctuations preferentially sampled by adsorption.", "url": "https://arxiv.org/abs/2607.29599", "type": "理论+数值", "summary": "超选择性多价结合能够在靶向和传感中实现敏锐的受体密度辨别，但其对数响应在微观上的测量结果仍不清楚。在这里，我们将选择性的精确响应分解为受体状态重新加权和直接占据响应。在稀淬灭泊松极限中，直接项消失，选择性恰好是结合颗粒下方的平均受体过量，这可以从足够大的共同配准的受体-颗粒图像中以单一密度进行测量。除了泊松统计之外，多余的部分还通过线性计数响应的 Fano 因子进行归一化，而分布形状的变化则需要完整的计数解析响应。晶格模拟验证了不同受体统计数据之间的这些关系，而晶格外模拟表明粒子拥挤通过直接项进入。这些结果建立了一个波动响应框架，将多价选择性与优先通过吸附采样的局部受体波动联系起来。", "authors": [{"name": "Xiuyang Xia"}], "featured_authors": [{"name": "Xiuyang Xia"}], "author_count": 1}, {"id": "2607.29608", "category": "cond-mat", "title": "Nonlinear Meissner States, Vortex Sheets, and Laminar Structures in Extreme Type-II Superconductors", "abstract": "A recently derived nonlinear velocity theory of extreme type-II superconductors is shown to possess an exactly solvable one-dimensional sector. Its solutions include nonlinear Meissner states exhibiting universal tails, vortex sheets, and periodic laminar structures. The thermodynamic critical field emerges from a marginal Meissner profile equivalent to the normal-superconducting boundary and may be viewed as a half-soliton. The vortex sheet is a soliton characterized by a discontinuity of the velocity field, a continuous and localized magnetic field and vanishing superconducting density at its center, and may be interpreted as the coarse-grained limit of a dense row of Abrikosov vortices. Periodic solutions describe laminar states that may be interpreted as coarse-grained rectangular vortex lattices.", "url": "https://arxiv.org/abs/2607.29608", "type": "理论", "summary": "最近导出的极端 II 型超导体的非线性速度理论被证明具有精确可解的一维扇区。其解决方案包括具有通用尾部、涡片和周期性层状结构的非线性迈斯纳态。热力学临界场出现在相当于正常超导边界的边缘迈斯纳分布中，并且可以被视为半孤子。涡旋片是一种孤子，其特征在于速度场的不连续性、连续的局部磁场以及其中心的超导密度消失，并且可以解释为密集的阿布里科索夫涡旋行的粗粒度极限。周期解描述了可以解释为粗粒矩形涡旋晶格的层流态。", "authors": [{"name": "Eugene B. Kolomeisky"}], "featured_authors": [{"name": "Eugene B. Kolomeisky"}], "author_count": 1}, {"id": "2607.29615", "category": "cond-mat", "title": "Unwithered Majorana fermions in the bulk of a quantum chain", "abstract": "The proposal is to probe Majorana modes in the system when its parameters are tuned to bring it into a disentangled ground state, which occur on the parametric curves known as disorder lines (DL). In such state certain correlation functions do not depend on separation. The exact results are presented for the XY spin chain in transverse field, also called the Kitaev chain in the Majorana representation. The single Majorana modes are shown to be localized near the ends of the chain, as in the states off the DL, while the disentangled $n$-particle Majorana modes ($n \\geq 2$) penetrate into the bulk without attenuation. The predicted bulk-edge effects can be detected in the specially engineered optical chains and lattices.", "url": "https://arxiv.org/abs/2607.29615", "type": "理论", "summary": "该提议是在调整系统参数使其进入解缠结基态时探测系统中的马约拉纳模式，这种状态发生在称为无序线（DL）的参数曲线上。在这种状态下，某些相关函数不依赖于分离。给出了横向场中 XY 自旋链（在马约拉纳表示中也称为 Kitaev 链）的精确结果。单个马约拉纳模式被证明位于链末端附近，如在 DL 之外的状态中，而解开的 $n$ 粒子马约拉纳模式 ($n \\geq 2$) 穿透到主体中而没有衰减。可以在专门设计的光学链和晶格中检测到预测的体边缘效应。", "authors": [{"name": "Gennady Y. Chitov"}], "featured_authors": [{"name": "Gennady Y. Chitov"}], "author_count": 1}, {"id": "2607.29620", "category": "cond-mat", "title": "Pairing near the boundary of a box-shaped trap in the BEC-BCS crossover", "abstract": "We study pairing of attractively interacting fermions confined to a box-shaped trap. In contrast to the infinite translationally-invariant case, where the local pairing order is spatially uniform and undergoes the Bose-Einstein Condensate to Bardeen-Cooper-Schrieffer (BEC-BCS) crossover as interactions are varied, in this case the local pairing is expected to vary rapidly near the edge of the box. We address this problem in the limit of a semi-infinite superfluid, finding that the nature of the edge pairing depends sensitively on the coupling. The local pairing exhibits Friedel-like oscillations in the weak coupling BCS regime that are suppressed with increasing coupling strength towards the BEC regime.", "url": "https://arxiv.org/abs/2607.29620", "type": "理论", "summary": "我们研究了限制在盒形陷阱中的相互作用的费米子的配对。与无限平移不变的情况相反，在这种情况下，局部配对顺序在空间上是均匀的，并且随着相互作用的变化而经历玻色-爱因斯坦凝聚到巴丁-库珀-施里弗（BEC-BCS）交叉，在这种情况下，局部配对预计会在盒子边缘附近快速变化。我们在半无限超流体的极限下解决了这个问题，发现边缘配对的性质敏感地取决于耦合。局部配对在弱耦合 BCS 状态下表现出类弗里德尔振荡，随着 BEC 状态耦合强度的增加，这种振荡受到抑制。", "authors": [{"name": "Kelly R. Patton"}, {"name": "Daniel E. Sheehy"}], "featured_authors": [{"name": "Kelly R. Patton"}, {"name": "Daniel E. Sheehy"}], "author_count": 2}, {"id": "2607.29639", "category": "cond-mat", "title": "Structure, Diffusion, and Relaxation in a Charge-Neutral ProTalpha-Histone H1 Condensate", "abstract": "Condensates formed by oppositely charged intrinsically disordered proteins provide model systems for understanding how transient electrostatic interactions govern structure and dynamics in biomolecular assemblies. Here we investigate a nearly charge-neutral condensate composed of 50 Prothymosin alpha (ProTalpha) and 40 Histone H1 molecules using a single-bead-per-residue coarse-grained model combining the HPS hydropathy model for disordered regions with a Go model for the globular domain of Histone H1 under NPT conditions at pressures from 2 to 12 bar. We find that chain dimensions, including the radius of gyration (Rg), end-to-end distance (Ree), and their ratio R, are insensitive to pressure, indicating that chain conformations remain largely unchanged over the pressure range studied. Histone H1 exhibits systematically larger values of R than ProTalpha because of its globular-core plus disordered-tail architecture. Translational diffusion coefficients decrease monotonically with pressure, from approximately 0.22 to 0.06 nm^2/ns, with substantial chain-to-chain heterogeneity comparable to the mean diffusion coefficient. Chain relaxation follows a stretched exponential with beta less than 1 that decreases with pressure. ProTalpha relaxation times of approximately 12 to 40 ns obey Rouse scaling, whereas Histone H1 deviates because of the internal constraint imposed by its globular domain. ProTalpha-Histone H1 contact lifetimes of approximately 0.43 to 0.56 ns are much shorter than the Rouse relaxation time, placing the system firmly in the fast-exchange regime where transient electrostatic contacts renormalize chain friction rather than acting as permanent cross-links, consistent with the moderate stretching exponent beta of approximately 0.55 to 0.70 observed across all pressures.", "url": "https://arxiv.org/abs/2607.29639", "type": "理论", "summary": "由带相反电荷的本质无序蛋白质形成的凝聚物提供了模型系统，用于理解瞬态静电相互作用如何控制生物分子组装体中的结构和动力学。在这里，我们使用每残基单珠粗粒模型研究了由 50 个胸腺肽原 α (ProTalpha) 和 40 个组蛋白 H1 分子组成的几乎电中性的冷凝物，该模型将无序区域的 HPS 水病模型与组蛋白 H1 球状结构域的 Go 模型相结合，在 NPT 条件下、压力为 2 至 12 bar 下。我们发现链尺寸，包括回转半径 (Rg)、端到端距离 (Ree) 及其比率 R，对压力不敏感，表明链构象在研究的压力范围内基本保持不变。由于其球状核心加无序尾部结构，组蛋白 H1 表现出比 ProTalpha 更大的 R 值。平移扩散系数随压力单调减小，从大约 0.22 到 0.06 nm^2/ns，链间异质性与平均扩散系数相当。\n\n链松弛遵循 beta 小于 1 的拉伸指数，随压力而减小。 ProTalpha 弛豫时间约为 12 至 40 ns，遵循劳斯标度，而组蛋白 H1 由于其球状结构域施加的内部约束而有所偏差。 ProTalpha-Histone H1 接触寿命约为 0.43 至 0.56 ns，比劳斯弛豫时间短得多，使系统牢固地处于快速交换状态，其中瞬态静电接触使链摩擦重新正常化，而不是充当永久交联，这与在所有压力下观察到的约 0.55 至 0.70 的适度拉伸指数 beta 一致。", "authors": [{"name": "Aniket Bhattacharya"}], "featured_authors": [{"name": "Aniket Bhattacharya"}], "author_count": 1}, {"id": "2607.29646", "category": "cond-mat", "title": "Study of the Anomalous Hall effect by tuning the spin orientation in the Altermagnetic material CrSb", "abstract": "Recent development in the field of altermagnetism, and increased demand for the search of applications of anomalous hall effect have ushered in a new era for novel quantum phases in materials. Quantum materials previously anticipated to be scientifically predictable have unfolded novel properties that brought them into the spotlight. These manifestations have led us to rethink our understanding of existing classification of magnetic materials and preexisting notions about anomalous hall effect in the light of topologically nontrivial phases of matter. One such recent de- velopment lies in the novel class of alter-magnetic materials with prospect for quantum computing. In this article, we delineate the spin and orbital resolved electronic spectrum, mode-decomposed phonon dispersion relations, geometrical berry curvature and topological surface states and their implications on anomalous Hall conductivity in the promising altermagnetic compound CrSb. We further utilize first principles calculations coupled with computationally efficient maximally localized wannier states of numerous magnetic configurations of the altermagnet to simulate the effect of external fields and elucidate the fact that the linear behaviour of anomalous hall conductivity with magnetization does not necessarily hold true for all magnetic classes, such as altermagnets.", "url": "https://arxiv.org/abs/2607.29646", "type": "理论+数值", "summary": "交变磁性领域的最新发展以及对反常霍尔效应应用的需求不断增加，开创了材料中新型量子相的新时代。以前预计可以科学预测的量子材料已经展现出新颖的特性，使它们成为人们关注的焦点。这些表现使我们根据物质的拓扑非平凡相重新思考对磁性材料现有分类的理解以及关于反常霍尔效应的现有概念。最近的一项进展在于具有量子计算前景的新型变磁材料。在本文中，我们描述了自旋和轨道分辨电子谱、模式分解声子色散关系、几何浆果曲率和拓扑表面态及其对有前景的互磁化合物 CrSb 中反常霍尔电导率的影响。\n\n我们进一步利用第一性原理计算，结合交流磁体众多磁性配置的计算效率最大局部万尼尔态来模拟外部场的影响，并阐明反常霍尔电导率与磁化强度的线性行为并不一定适用于所有磁性类别（例如交流磁体）。", "authors": [{"name": "Sreedevi Chintalapudi"}, {"name": "Upasana Agrawal"}, {"name": "Suvadip Das"}], "featured_authors": [{"name": "Sreedevi Chintalapudi"}, {"name": "Upasana Agrawal"}, {"name": "Suvadip Das"}], "author_count": 3}, {"id": "2607.29651", "category": "cond-mat", "title": "Non-reciprocal torques guide self-assembly of active particles into clusters with controllable function", "abstract": "Self-assembly of constituents determines structure formation in the microscopic world. Attractive forces can assemble active particles into colloidal machines, but they do not fix the particles' orientations, which limits control over the machine's function. We demonstrate that non-reciprocal turn-towards torques not only assemble active particles into clusters, without requiring attractive forces, but also link particle orientations to the cluster configuration. Symmetry then dictates whether the cluster is static, rotates, or translates. In small systems, the particle number uniquely determines the stable configuration and function. In larger systems, there are multiple stable configurations with distinct functions, and tuning the torque strength allows us to bias towards the desired function, such as a run-and-tumble motion. Because the interactions driving assembly can be switched on and off, the clusters self-assemble when needed. For such a \"just-in-time\" self-assembly to be practical, fast assembly is necessary. We show that stochastic resetting, implemented by briefly turning off propulsion and torque, significantly speeds up self-assembly by avoiding slow pathways. Together, our findings demonstrate that non-reciprocal torques can rapidly assemble active particles into colloidal micromachines with controllable function.", "url": "https://arxiv.org/abs/2607.29651", "type": "理论", "summary": "成分的自组装决定了微观世界的结构形成。吸引力可以将活性粒子组装成胶体机器，但它们不能固定粒子的方向，这限制了对机器功能的控制。我们证明，不可逆转向扭矩不仅可以将活性粒子组装成簇，而不需要吸引力，而且还将粒子方向与簇配置联系起来。对称性决定了簇是静止的、旋转的还是平移的。在小系统中，粒子数唯一决定稳定的构型和功能。在较大的系统中，存在多种具有不同功能的稳定配置，调整扭矩强度使我们能够偏向所需的功能，例如运行和翻滚运动。由于驱动组装的交互可以打开和关闭，因此集群可以在需要时进行自组装。为了使这种“及时”自组装切实可行，快速组装是必要的。我们表明，通过短暂关闭推进力和扭矩来实现的随机重置可以通过避免缓慢的路径来显着加快自组装速度。\n\n总之，我们的研究结果表明，不可逆扭矩可以快速将活性颗粒组装成具有可控功能的胶体微型机器。", "authors": [{"name": "Till Welker"}, {"name": "Yukino Fujiya"}, {"name": "Holger Stark"}], "featured_authors": [{"name": "Till Welker"}, {"name": "Yukino Fujiya"}, {"name": "Holger Stark"}], "author_count": 3}, {"id": "2607.28718", "category": "hep-th", "title": "Infinite Symmetry Algebras in Four-Dimensional Conformal Field Theories", "abstract": "In generic interacting four-dimensional Lorentzian conformal field theories, an infinite set of universal light-ray operators constructed from the stress tensor is shown to generate the wedge subalgebra of the loop algebra of ${\\rm w}_{1+\\infty}$. This algebra was recently identified among the asymptotic symmetries of asymptotically flat spacetimes. The one-point functions of the ${\\rm w}_{1+\\infty}$ generators in scalar states (also known as one-point event shapes) are explicitly demonstrated to be finite and are precisely related to universal soft factors in the infinite tower of soft graviton theorems. A second universal class of light-ray operators that generates the ''$S$ algebra,'' the gauge-theoretic analog of ${\\rm w}_{1+\\infty}$, is also constructed and shown to have finite one-point functions in four-dimensional conformal field theories with a spin-one conserved current. Along with the details of these results, this paper presents a general classification of stress-tensor and conserved current light-ray operators by scaling dimension and Lorentz ${\\rm SL}(2,\\mathbb{C})$ weights, a general technique for computing commutators by Poincaré recursion, results for other light-ray operator algebras including a local version of the four-dimensional conformal symmetry algebra, and examples for free scalar fields.", "url": "https://arxiv.org/abs/2607.28718", "type": "理论", "summary": "在通用相互作用四维洛伦兹共形场论中，由应力张量构造的无限组通用光线算子被证明可以生成 ${\\rm w}_{1+\\infty}$ 环代数的楔子代数。这个代数最近在渐近平坦时空的渐近对称性中被确定。标量态下 ${\\rm w}_{1+\\infty}$ 生成器的单点函数（也称为单点事件形状）被明确证明是有限的，并且与软引力子定理无限塔中的通用软因子精确相关。生成“$S$代数”的第二个通用类光线算子，即${\\rm w}_{1+\\infty}$的规范理论模拟，也被构造并证明在具有自旋一守恒电流的四维共形场论中具有有限单点函数。\n\n除了这些结果的详细信息之外，本文还介绍了通过缩放维数和洛伦兹 ${\\rm SL}(2,\\mathbb{C})$ 权重对应力张量和守恒电流光线算子的一般分类、通过庞加莱递归计算交换子的通用技术、其他光线算子代数的结果（包括四维共角对称代数的局部版本）以及自由标量场的示例。", "authors": [{"name": "Elizabeth Himwich"}, {"name": "Monica Pate"}], "featured_authors": [{"name": "Elizabeth Himwich"}, {"name": "Monica Pate"}], "author_count": 2}, {"id": "2607.28726", "category": "hep-th", "title": "Towers of Operators in CFTs and Convexity Bounds at Large Charge", "abstract": "In arXiv:2406.19441 , it was shown that for 3d CFTs with a moduli space along which a $U(1)$ symmetry is spontaneously broken, the minimum scaling dimension at large charge $Q$ scales as $\\Delta_{\\min}(Q)=\\alpha_1 Q+\\alpha_0+O(1/Q)$. Motivated by the holographic swampland program, we study possible bounds on the coefficients $\\alpha_i$. For $\\alpha_0$, the weak gravity conjecture motivates the CFT charge convexity conjecture, which requires the bound $\\alpha_0\\leq 0$. Using the moduli space EFT we prove this bound for the $\\textit{projected}$ $\\Delta_{\\min}(Q)$, obtained by fixing a single charge $Q$ and minimizing the dimension while allowing all other charges to vary. This provides a WGC-motivated bound that is explicitly provable using CFT methods. On the other hand, we show that $\\alpha_1$ admits no universal bound apart from the trivial bound $\\alpha_1\\geq 0$. We also compute $\\alpha_1$ and $\\alpha_0$ in several new 3d $\\mathcal{N}=1$ theories via the $\\epsilon$-expansion and large-$N$ methods.", "url": "https://arxiv.org/abs/2607.28726", "type": "理论", "summary": "在 arXiv:2406.19441 中，表明对于具有 $U(1)$ 对称性自发破缺的模空间的 3d CFT，大电荷 $Q$ 处的最小缩放尺寸为 $\\Delta_{\\min}(Q)=\\alpha_1 Q+\\alpha_0+O(1/Q)$。受全息沼泽计划的推动，我们研究了系数 $\\alpha_i$ 的可能界限。对于$\\alpha_0$，弱引力猜想激发了CFT电荷凸性猜想，这需要边界$\\alpha_0\\leq 0$。使用模空间 EFT，我们证明了 $\\textit{projected}$ $\\Delta_{\\min}(Q)$ 的界限，这是通过固定单个电荷 $Q$ 并最小化维度同时允许所有其他电荷变化而获得的。这提供了一个 WGC 驱动的界限，可以使用 CFT 方法明确证明。另一方面，我们证明除了平凡界限 $\\alpha_1\\geq 0$ 之外，$\\alpha_1$ 不承认任何通用界限。我们还通过 $\\epsilon$-expansion 和 large-$N$ 方法在几个新的 3d $\\mathcal{N}=1$ 理论中计算 $\\alpha_1$ 和 $\\alpha_0$。", "authors": [{"name": "Fedor K. Popov"}, {"name": "Adar Sharon"}], "featured_authors": [{"name": "Fedor K. Popov"}, {"name": "Adar Sharon"}], "author_count": 2}, {"id": "2607.28746", "category": "hep-th", "title": "From Horizon Microstates to the Black Hole Membrane", "abstract": "The membrane paradigm represents a black-hole horizon by a fictitious conducting surface. We derive a microscopic electromagnetic membrane from black-hole matrix quantum mechanics. The fuzzy-sphere horizon carries a Berry monopole, placing its fundamental fermionic partons in lowest-Landau-level states with Ohmic and Hall responses. Off-diagonal bifundamental modes connecting the horizon and exterior matrix blocks become tachyonic near the horizon and condense, dynamically coupling the horizon gauge field to the exterior Maxwell field. In the low-frequency regime $\\omega R\\ll1$, the fixed-parton transport description predicts frequency- and helicity-dependent reflectivity. At larger frequency, real parton excitations require a black-hole $S$-matrix. Ohm's law then fixes the inclusive absorption probability; unitarity bounds the local absorption cross section by the horizon area, with the classical conductivity $1/4\\pi$ saturating this maximal-absorption bound.", "url": "https://arxiv.org/abs/2607.28746", "type": "理论", "summary": "膜范例通过虚构的导电表面代表黑洞视界。我们从黑洞矩阵量子力学中推导出微观电磁膜。模糊球视界带有贝里单极子，将其基本费米子部分子置于具有欧姆和霍尔响应的最低朗道能级状态。连接地平线和外部矩阵块的非对角双基模在地平线附近变成快子并凝结，动态地将地平线规范场耦合到外部麦克斯韦场。在低频状态 $\\omega R\\ll1$ 中，固定部分传输描述预测频率和螺旋度相关的反射率。在较高频率下，实部子激励需要黑洞 $S$ 矩阵。然后欧姆定律确定了包含吸收概率；幺正性将局部吸收截面限制为地平线区域，经典电导率 $1/4\\pi$ 使该最大吸收边界饱和。", "authors": [{"name": "Chong-Sun Chu"}], "featured_authors": [{"name": "Chong-Sun Chu"}], "author_count": 1}, {"id": "2607.28975", "category": "hep-th", "title": "Chiral symmetry and curvature bounds in de Sitter spacetime", "abstract": "We study chiral symmetry breaking in the Nambu-Jona-Lasinio model on a de Sitter background, treating it as a non-renormalizable effective field theory with a physical ultraviolet cutoff. Using exponential proper-time regularization, we obtain an exact solution for the constituent fermion mass in the strong-curvature regime via the Lambert $W$ function. The consistency condition for real-valued solutions leads to an upper bound on the cosmological constant, indicating a limitation of the mean-field description rather than a fundamental physical constraint on the spacetime geometry.", "url": "https://arxiv.org/abs/2607.28975", "type": "理论", "summary": "我们研究德西特背景下的 Nambu-Jona-Lasinio 模型中的手性对称性破缺，将其视为具有物理紫外线截止的不可重整化有效场论。使用指数原时正则化，我们通过兰伯特 $W$ 函数获得强曲率状态下费米子质量的精确解。实值解的一致性条件导致宇宙学常数的上限，表明平均场描述的限制而不是时空几何的基本物理约束。", "authors": [{"name": "L. G. Barbosa"}], "featured_authors": [{"name": "L. G. Barbosa"}], "author_count": 1}, {"id": "2607.29028", "category": "hep-th", "title": "Quantum Scattering in Schwarzschild Spacetime: Hawking Radiation and Black Hole Atmospheres", "abstract": "In this paper, we investigate scattering of a scalar field near a Schwarzschild black hole through its $S$-matrix. Within this framework, we obtain a novel derivation of Hawking radiation by computing the emission rate, which yields a Bose--Einstein distribution with temperature $T_H=(8\\pi GM)^{-1}$, the Hawking temperature. In addition to Hawking radiation, the S-matrix exhibits antibound states, corresponding to excitations at the threshold of becoming scattering (bound) states if the potential is decreased (increased). We interpret these excitations as constituents of the black-hole quantum atmosphere: a thermalised region outside of the event horizon, which is the source of the Hawking radiation. Using the spectrum of antibound states, we found the atmospheric radius, $r_{\\text{Atm}} \\approx 2.77 r_{s}$, which is in good agreement with previous results in the literature obtained through other methods. Our results indicate that, at the macroscopic level, the quantum atmosphere behaves like an ordinary thermalised gas at the Hawking temperature.", "url": "https://arxiv.org/abs/2607.29028", "type": "理论", "summary": "在本文中，我们研究了史瓦西黑洞附近的标量场通过 $S$ 矩阵的散射。在此框架内，我们通过计算发射率获得霍金辐射的新颖推导，从而产生温度为霍金温度 $T_H=(8\\pi GM)^{-1}$ 的玻色-爱因斯坦分布。除了霍金辐射之外，S 矩阵还表现出反束缚态，对应于如果电势降低（增加）则变为散射（束缚）态的阈值处的激发。我们将这些激发解释为黑洞量子大气的组成部分：事件视界之外的热化区域，这是霍金辐射的来源。利用反束缚态谱，我们发现了大气半径$r_{\\text{Atm}} \\approx 2.77 r_{s}$，这与之前通过其他方法获得的文献结果非常吻合。我们的结果表明，在宏观层面上，量子大气的行为就像霍金温度下的普通热化气体一样。", "authors": [{"name": "Victor H. Alencar"}, {"name": "Gabriel Picanço"}, {"name": "Carlos A.D. Zarro"}], "featured_authors": [{"name": "Victor H. Alencar"}, {"name": "Gabriel Picanço"}, {"name": "Carlos A.D. Zarro"}], "author_count": 3}, {"id": "2607.29067", "category": "hep-th", "title": "Line operator indices of S-fold theories", "abstract": "We study superconformal indices in the presence of line operators in S-fold theories. We consider two types of lines, realized by fundamental strings and fivebranes, respectively, in AdS$_5 \\times S^5/\\mathbb{Z}_k$. For fundamental lines, we analyze the corresponding indices including finite-$N$ corrections arising from giant graviton configurations. For $k=2$, we compare the holographic results with line operator indices in $\\mathcal{N}=4$ super Yang-Mills theories with orthogonal gauge groups. For $k=3,4$ and $6$, we focus on the rank $2$ case, in which the supersymmetry is enhanced to ${\\cal N}=4$, and compare them with the corresponding Wilson-'t Hooft line operator indices. In both cases, we find improved agreement once giant graviton contributions are included. For line operators realized by fivebranes, after confirming agreement for $k=2$, we construct BPS configurations for $k\\geq 3$ explicitly using fivebrane junctions and derive the indices in the large $N$ limit by the mode analysis on the fivebrane junctions.", "url": "https://arxiv.org/abs/2607.29067", "type": "理论", "summary": "我们研究 S 折理论中存在线算子的情况下的超共形指数。我们考虑两种类型的线，分别由基本字符串和五膜实现，在 AdS$_5 \\times S^5/\\mathbb{Z}_k$ 中。对于基本线，我们分析了相应的指数，包括由巨型引力子配置引起的有限 $N$ 修正。对于 $k=2$，我们将全息结果与具有正交规范组的 $\\mathcal{N}=4$ super Yang-Mills 理论中的线算子索引进行比较。对于$k=3,4$和$6$，我们关注等级$2$的情况，其中超对称性增强到${\\cal N}=4$，并将它们与相应的Wilson-'t Hooft线算子索引进行比较。在这两种情况下，一旦考虑到巨大的引力子贡献，我们发现协议得到了改善。对于由五膜实现的线算子，在确认 $k=2$ 一致后，我们显式地使用五膜结点构建 $k\\geq 3$ 的 BPS 配置，并通过对五膜结点的模态分析导出大 $N$ 限制中的索引。", "authors": [{"name": "Yosuke Imamura"}, {"name": "Masato Inoue"}, {"name": "Akihiro Sei"}], "featured_authors": [{"name": "Yosuke Imamura"}, {"name": "Masato Inoue"}, {"name": "Akihiro Sei"}], "author_count": 3}, {"id": "2607.29234", "category": "hep-th", "title": "A Toy Model for Topological Entanglement Features in 1+1D Integrable Quantum Field Theory", "abstract": "In this paper we investigate an entanglement measure, the Rényi entropy, in a 1+1D integrable quantum field theory known as the Federbush model. This is a deformation of the theory of two massive Dirac fermions by means of a bilinear term in the $U(1)$ currents that couples the two fermion species. This deformation gives rise to $S$-matrix elements which are coupling-dependent phases, distinct from $- 1$. These non-trivial phases can be seen as encoding anyon-like statistics. From this viewpoint, the Federbush model is a toy model for topological features of entanglement in one space dimension. In this paper we show that, for an infinite system, these topological features play no role when computing many known measures of entanglement at equilibrium in the ground state. This conclusion applies also to the post-quench dynamics after a small quench of the topological parameter.", "url": "https://arxiv.org/abs/2607.29234", "type": "理论", "summary": "在本文中，我们研究了 1+1D 可积量子场论（称为 Federbush 模型）中的纠缠度量，即 Rényi 熵。这是两个大质量狄拉克费米子理论的变形，通过耦合两个费米子的 $U(1)$ 电流中的双线性项实现。这种变形产生 $S$ 矩阵元素，它们是耦合相关相，与 $- 1$ 不同。这些重要的阶段可以看作是对类似任意统计量的编码。从这个角度来看，费德布什模型是一个针对一维纠缠拓扑特征的玩具模型。在本文中，我们表明，对于无限系统，这些拓扑特征在计算许多已知的基态平衡纠缠度量时不起作用。这一结论也适用于拓扑参数小幅淬火后的淬火后动力学。", "authors": [{"name": "Emmalise J. H. Aalbers"}, {"name": "Olalla A. Castro-Alvaredo"}], "featured_authors": [{"name": "Emmalise J. H. Aalbers"}, {"name": "Olalla A. Castro-Alvaredo"}], "author_count": 2}, {"id": "2607.29432", "category": "hep-th", "title": "First Law of Proto-Area Entropy from Modular Spectral Geometry", "abstract": "We derive a first law of proto-area entropy in the CCKLP--Witten framework for approximate holographic entanglement wedge reconstruction. The central spectral function admits a modular Hamiltonian representation with kernel $L(x)=x\\coth(x/2)$. For near-maximally-mixed bulk states, and within the unstructured Gaussian-unitary-ensemble (GUE) model of the encoding perturbation, the ensemble-averaged proto-area entropy varies linearly with bulk entropy to leading order, with a response coefficient containing a universal factor~$1/3$, traced to $L''(0)/2=1/6$ and independent of the bulk spectrum's detailed shape within this model. Imposing the gravitational-scaling condition required for nonzero backreaction, the first-law coefficient is $O(1)$, parametrically matching the semi-classical relation $\\delta({\\rm Area}/4G_N)=\\delta S_{\\rm bulk}$.", "url": "https://arxiv.org/abs/2607.29432", "type": "理论", "summary": "我们在 CCKLP-Witten 框架中推导了用于近似全息纠缠楔重建的原面积熵第一定律。中心谱函数允许采用内核 $L(x)=x\\coth(x/2)$ 的模块化哈密顿表示。对于接近最大混合体状态，在编码扰动的非结构化高斯酉系综 (GUE) 模型中，系综平均原区域熵随体熵线性变化到前导阶，响应系数包含通用因子 ~$1/3$，追踪到 $L''(0)/2=1/6$，并且与该模型中体谱的详细形状无关。施加非零反反应所需的重力缩放条件，第一定律系数为$O(1)$，参数匹配半经典关系$\\delta({\\rm Area}/4G_N)=\\delta S_{\\rmbulk}$。", "authors": [{"name": "Ling-Zheng Xia"}, {"name": "Lixin Xu"}], "featured_authors": [{"name": "Ling-Zheng Xia"}, {"name": "Lixin Xu"}], "author_count": 2}, {"id": "2607.29451", "category": "hep-th", "title": "BPS Invariants for Generalized Toric Calabi-Yau Threefolds", "abstract": "We apply topological vertex techniques to Calabi-Yau threefolds dual to brane webs where several 5-branes can end on the same 7-brane. In this context, we determine how topological string partition functions transform under Hanany-Witten transitions and flops, which allows us to track curves and the associated invariants under such transitions. The contributions of parallel external branes form a universal sector invisible to the 5d SCFT; once it is removed, invariants can be transported between different geometries engineering the same theory. This yields an efficient technique to compute Gopakumar-Vafa invariants at any degree and genus. We illustrate this with local Hirzebruch and del Pezzo surfaces, including $dP_4$, whose invariants we obtain at high degree for the first time.", "url": "https://arxiv.org/abs/2607.29451", "type": "理论", "summary": "我们将拓扑顶点技术应用于 Calabi-Yau 三重对偶膜网，其中多个 5 膜可以终止于同一个 7 膜上。在这种情况下，我们确定拓扑串划分函数在 Hanany-Witten 转换和触发器下如何变换，这使我们能够跟踪此类转换下的曲线和相关的不变量。平行外部膜的贡献形成了 5d SCFT 不可见的通用部分；一旦它被移除，不变量就可以在设计相同理论的不同几何结构之间传输。这产生了一种计算任何度和属的 Gopakumar-Vafa 不变量的有效技术。我们用局部 Hirzebruch 和 del Pezzo 曲面来说明这一点，包括 $dP_4$，我们首次获得了高度的不变量。", "authors": [{"name": "Antoine Bourget"}, {"name": "Peng Cheng"}, {"name": "Quentin Lamouret"}], "featured_authors": [{"name": "Antoine Bourget"}, {"name": "Peng Cheng"}, {"name": "Quentin Lamouret"}], "author_count": 3}, {"id": "2607.29635", "category": "hep-th", "title": "A Holographic Map from AdS$_3$ to CFT$_2$", "abstract": "We propose a holographic map from the semiclassical Hilbert space of pure general relativity in $\\text{AdS}_{3}$ to that of $\\text{CFT}_{2}$. We define the bulk Hilbert space by semiclassically quantising the phase space in the basis of a fixed-area network on a Cauchy slice $\\Sigma$. A fixed-area network is a maximal non-intersecting set of geodesics on $\\Sigma$ whose lengths and angular momenta have been fixed. Our holographic map differentiates between `external' geodesics that are homotopic to a connected component of $\\partial \\Sigma$, and `internal' geodesics which are not. The lengths and angular momenta of external geodesics become conformal weights of primaries in the Hilbert space of the CFT living on the corresponding component of $\\partial \\Sigma$. The fixed-area network determines the wave function, which is given by a network of OPE coefficients of primaries whose weights are determined by the corresponding lengths. For sufficiently semiclassical states, there is an agreement between bulk and boundary inner products. We apply this proposal to various physics questions. The boundary dual of a bulk gauge turns out to be an emergent basis for sufficiently semiclassical states. We also define boundary operators that measure the lengths of geodesics behind the horizon, again in semiclassical states. Finally, we apply our map to closed universes and find a failure of semiclassicality in simple cases, which can be partially alleviated by the addition of a massive probe.", "url": "https://arxiv.org/abs/2607.29635", "type": "理论", "summary": "我们提出了从 $\\text{AdS}_{3}$ 中的纯广义相对论半经典希尔伯特空间到 $\\text{CFT}_{2}$ 的全息映射。我们通过在柯西切片 $\\Sigma$ 上的固定区域网络的基础上半经典量化相空间来定义体希尔伯特空间。固定区域网络是 $\\Sigma$ 上的最大不相交测地线集，其长度和角动量已固定。我们的全息图区分了“外部”测地线和“内部”测地线，“外部”测地线与 $\\partial \\Sigma$ 的连通分量同伦，而“内部”测地线则不然。外部测地线的长度和角动量成为 CFT 希尔伯特空间中初级的共形权重，位于 $\\partial \\Sigma$ 的相应分量上。固定区域网络确定波函数，波函数由原色 OPE 系数网络给出，其权重由相应长度确定。对于足够的半经典状态，体内积和边界内积之间存在一致性。我们将此建议应用于各种物理问题。\n\n体积规的边界对偶被证明是足够半经典状态的新兴基础。我们还定义了边界算子，用于测量地平线后面的测地线长度，同样是在半经典状态下。最后，我们将我们的地图应用于封闭宇宙，并发现简单情况下半经典性的失败，这可以通过添加大型探测器来部分缓解。", "authors": [{"name": "Manish Ramchander"}, {"name": "Ronak M Soni"}], "featured_authors": [{"name": "Manish Ramchander"}, {"name": "Ronak M Soni"}], "author_count": 2}, {"id": "2607.29653", "category": "hep-th", "title": "Tensionless limit of M5-brane and conformal symmetry of its bosonic body", "abstract": "We obtain a tensionless limit of the M-theory 5-brane action and discuss its properties. The consistency of this limit requires that the field strength of the worldvolume 2-form gauge field on the M5 brane worldvolume is non-degenerate and never vanishes. Also the induced $6d$ worldvolume metric of this theory is non-degenerate in contrast to conventional tensionless (null) $p$-branes. We find that the tensionless M5-brane action is invariant under a super-Weyl symmetry acting on the bulk supergeometry, while in the purely bosonic case the action is invariant under an 11D target-space conformal symmetry, a property which is characteristic for the tensionless bosonic branes. Upon imposing a static gauge, which fixes worldvolume diffeomorphisms, this 11D conformal symmetry becomes a deformed 6d worldovolume conformal symmetry whose action on the worldvolume coordinates involves field dependent terms. When the transversal fluctuations of the 5-brane in the bulk are zero, the model reduces to the conformal non-linear chiral 2-form electrodynamics considered earlier by Gibbons and West, and by Townsend.", "url": "https://arxiv.org/abs/2607.29653", "type": "理论", "summary": "我们获得了 M 理论 5 膜作用的无张力极限并讨论了其性质。这个极限的一致性要求M5膜世界体积上的世界体积2型规范场的场强是非简并的并且永远不会消失。此外，与传统的无张力（空）$p$-膜相比，该理论的诱导 $6d$ 世界体积度量是非退化的。我们发现，无张力 M5 膜作用在作用于体超几何的超外尔对称下是不变的，而在纯玻色子情况下，作用在 11 维目标空间共形对称下是不变的，这是无张力玻色膜的特征。在施加固定世界体积微分同胚的静态规范后，此 11D 共形对称性变为变形的 6d 世界体积共角对称性，其对世界体积坐标的作用涉及场相关项。当整体 5 膜的横向波动为零时，模型简化为 Gibbons 和 West 以及 Townsend 先前考虑的共形非线性手性 2 型电动力学。", "authors": [{"name": "Igor Bandos"}, {"name": "Kurt Lechner"}, {"name": "Dmitri P. Sorokin"}], "featured_authors": [{"name": "Igor Bandos"}, {"name": "Kurt Lechner"}, {"name": "Dmitri P. Sorokin"}], "author_count": 3}, {"id": "2607.29662", "category": "hep-th", "title": "Holographic timelike complexity for de Sitter", "abstract": "We investigate the recent proposal of holographic volume complexity for timelike subregions \\cite{Alishahiha:2025xml} in the framework of static patch holography for de Sitter spacetime. Using the stretched-horizon prescription, we compute the timelike subregion complexity as a function of the subregion duration for pure de Sitter and Schwarzschild de Sitter geometries. In pure de Sitter spacetime, the timelike subregion complexity displays exponential growth for short durations, and hyperfast growth near a maximal duration, paralleling the features of spacelike volume complexity \\cite{Jorstad:2022mls}. For Schwarzschild de Sitter, when the stretched horizon is near the cosmological horizon, the behavior broadly remains similar to pure de Sitter. However, when the stretched horizon is near the black hole horizon, the hyperfast growth for long durations is replaced by nonlinear growth regime. Along the way, we also compute the corresponding timelike holographic entanglement entropy for de Sitter and Schwarzschild de Sitter.", "url": "https://arxiv.org/abs/2607.29662", "type": "理论", "summary": "我们研究了最近在德西特时空静态贴片全息框架中提出的类时子区域的全息体积复杂性\\cite{Alishahiha:2025xml}。使用拉伸范围规定，我们计算了纯德西特和史瓦西德西特几何的类时子区域复杂度作为子区域持续时间的函数。在纯德西特时空中，类时子区域复杂度在短时间内呈现指数增长，并在最大持续时间附近呈现超快增长，与类空体积复杂度的特征相似\\cite{Jorstad:2022mls}。对于史瓦西德西特来说，当拉伸视界接近宇宙视界时，其行为大致与纯德西特相似。然而，当拉伸视界接近黑洞视界时，长时间的超快增长被非线性增长机制所取代。在此过程中，我们还计算了德西特和史瓦西德西特相应的类时全息纠缠熵。", "authors": [{"name": "Arpan Bhattacharyya"}, {"name": "Md Khalid Hossain"}, {"name": "Sanhita Parihar"}, {"name": "Shubho R. Roy"}], "featured_authors": [{"name": "Arpan Bhattacharyya"}, {"name": "Md Khalid Hossain"}, {"name": "Sanhita Parihar"}, {"name": "Shubho R. Roy"}], "author_count": 4}, {"id": "2607.29668", "category": "hep-th", "title": "A-type Sigma Models from Differential Poisson Geometry", "abstract": "We study the differential Poisson sigma model (DPSM) in the symplectic case and show that its classical reduction defines a distinguished class of A-type models on symplectic targets, not necessarily Kähler. The DPSM is a covariant first-order sigma model whose graded target is the parity-shifted tangent bundle $T[1]M$ of a Poisson manifold $M$. Its graded Poisson tensor encodes a differential Poisson bracket on $C(T[1]M)\\cong\\Omega^\\bullet(M)$, written covariantly in terms of a connection $\\Gamma$ and its transpose $\\widetilde\\Gamma$. In the nondegenerate case, the Jacobi identities force $\\Gamma$ to be flat, while the quartic coupling of the reduced action is given by the curvature of $\\widetilde\\Gamma$, induced by the torsion of $\\Gamma$. Thus, the DPSM selects a symplectic class in which the A-model curvature coupling acquires a first-order Poisson origin. We describe this class through examples and obstructions; $\\mathbb{CP}^n$ and K3 surfaces are excluded, while affine symplectic targets, symplectic tori, and the Kodaira--Thurston manifold furnish explicit examples. The graded parent geometry on $T[1]M$ equips $\\Omega^\\bullet(M)$ with a differential Poisson bracket and $\\Omega^\\bullet(M)[1]$ with a strict $L_\\infty$-algebra structure, equipping the observable complex with a natural chain-level differential Poisson structure that is not manifest in the usual Kähler formulation of the A-model.", "url": "https://arxiv.org/abs/2607.29668", "type": "理论", "summary": "我们研究了辛情况下的微分泊松西格玛模型 (DPSM)，并表明其经典简化定义了辛目标上的一类杰出的 A 型模型，不一定是凯勒模型。 DPSM 是协变一阶 sigma 模型，其分级目标是泊松流形 $M$ 的奇偶平移切丛 $T[1]M$。其分级泊松张量在 $C(T[1]M)\\cong\\Omega^\\bullet(M)$ 上编码微分泊松括号，根据连接 $\\Gamma$ 及其转置 $\\widetilde\\Gamma$ 协变编写。在非简并情况下，雅可比恒等式迫使 $\\Gamma$ 平坦，而简化作用的四次耦合由 $\\widetilde\\Gamma$ 的曲率给出，由 $\\Gamma$ 的扭转引起。因此，DPSM 选择一个辛类，其中 A 模型曲率耦合获得一阶泊松原点。我们通过例子和障碍来描述这个类； $\\mathbb{CP}^n$ 和 K3 曲面被排除在外，而仿射辛目标、辛环面和 Kodaira--Thurston 流形提供了明确的示例。\n\n$T[1]M$ 上的分级父几何体为 $\\Omega^\\bullet(M)$ 配备了微分泊松括号，为 $\\Omega^\\bullet(M)[1]$ 配备了严格的 $L_\\infty$ 代数结构，为可观测复合体配备了自然链级微分泊松结构，这在 A 模型的通常 Kähler 公式中并不明显。", "authors": [{"name": "Cesar Arias"}, {"name": "Per Sundell"}], "featured_authors": [{"name": "Cesar Arias"}, {"name": "Per Sundell"}], "author_count": 2}, {"id": "2607.28660", "category": "math-ph", "title": "Entropy Geometry and Normalized Means on Infinite-Dimensional Hamiltonian Manifolds", "abstract": "We propose a geometric--analytic framework for equilibrium statistical mechanics on infinite-dimensional Hamiltonian systems. In situations where no suitable $\\sigma$-additive invariant measure is available, we use \\emph{normalized means}, which generalize probability measures and normalized integrals. This construction yields entropy and free-energy functionals on weak symplectic Fréchet manifolds and gives existence and uniqueness of exponential-family equilibrium states under explicit admissibility and separation assumptions. These states are stationary under Hamiltonian flows preserving both the reference mean and the equilibrium weight, and satisfy a classical Poisson--KMS identity when the reference mean is Poisson invariant. Under a local exponential regularity assumption, the logarithmic partition functional is smooth and convex, with Hessian given by the covariance form. It is strictly convex modulo thermodynamically null directions and, through Legendre--Fenchel duality, induces a concave entropy on the domain of extensive variables. We illustrate the framework with $H^s$-geodesic equations on current groups $\\operatorname{Map}(M,G)$ and diffeomorphism groups $\\operatorname{Diff}(M)$, including hydrodynamic and field-theoretic examples.", "url": "https://arxiv.org/abs/2607.28660", "type": "理论", "summary": "我们提出了无限维哈密顿系统上平衡统计力学的几何分析框架。在没有合适的 $\\sigma$ 加性不变测度可用的情况下，我们使用 \\emph{归一化均值}，它概括了概率测度和归一化积分。这种构造在弱辛 Fréchet 流形上产生熵和自由能泛函，并在明确的容许性和分离假设下给出指数族平衡状态的存在性和唯一性。这些状态在哈密顿流下是平稳的，保留了参考均值和平衡权重，并且当参考均值是泊松不变量时满足经典的泊松-KMS恒等式。在局部指数正则性假设下，对数配分函数是光滑且凸的，Hessian 函数由协方差形式给出。它是严格凸模热力学零方向，并且通过勒让德-芬切尔对偶性，在广泛变量的域上引入凹熵。\n\n我们使用当前群 $\\operatorname{Map}(M,G)$ 和微分同胚群 $\\operatorname{Diff}(M)$ 上的 $H^s$-测地线方程来说明该框架，包括流体动力学和场论示例。", "authors": [{"name": "Jean-Pierre Magnot"}], "featured_authors": [{"name": "Jean-Pierre Magnot"}], "author_count": 1}, {"id": "2607.28811", "category": "math-ph", "title": "Free to Interacting Map for Crystalline SPT Phases: Equivariance vs Crystalline Equivalence", "abstract": "Freed and Hopkins developed an ansatz for classifying interacting SPT phases using invertible field theories with a natural Free to Interacting (FTI) map from free fermion phases. This ansatz has been generalized to include crystalline phases and a crystalline equivalence principle (CEP). However, motivated by failure of the CEP for weak free fermions and the FTI, here we generalize the original Freed and Hopkins ansatz to a fully equivariant version for symmorphic crystallographic symmetries and show there is a natural equivariant FTI map from symmorphic crystalline weak free fermions. We further discuss why this equivariant ansatz is both mathematically and physically more natural than the spatial symmetry extension by Freed and Hopkins and why full equivariance should hold over the CEP.", "url": "https://arxiv.org/abs/2607.28811", "type": "理论", "summary": "Freed 和 Hopkins 开发了一个 ansatz，用于使用可逆场论和自由费米子相的自然自由相互作用 (FTI) 图对相互作用的 SPT 相进行分类。该拟定已被概括为包括结晶相和结晶等效原理（CEP）。然而，由于弱自由费米子的 CEP 和 FTI 的失败，在这里我们将原始的 Freed 和 Hopkins ansatz 推广到同形晶体对称性的完全等变版本，并表明存在来自同形晶体弱自由费米子的自然等变 FTI 图。我们进一步讨论为什么这种等变 ansatz 在数学上和物理上都比 Freed 和 Hopkins 的空间对称扩展更自然，以及为什么 CEP 应该保持完全等变。", "authors": [{"name": "Daniel Sheinbaum"}, {"name": "Omar Antolín-Camarena"}], "featured_authors": [{"name": "Daniel Sheinbaum"}, {"name": "Omar Antolín-Camarena"}], "author_count": 2}, {"id": "2607.29146", "category": "math-ph", "title": "Topology in One Point Interaction Problem on Extended Non-Local Star Graphs and its Eigenvalues", "abstract": "The author studies the inverse spectral problem of Sturm-Liouville operator on a star-like metric graph. At the vertex of this star-like graph, there are attached $m$ edges that imposed with non-local Sturm-Liouville operator satisfying some suitable non-local boundary conditions. At the vertex, we consider one point interaction condition to model a metric graph that fixed on the end of edges of the graph. This models the vibration or flux that changes over time that monitored at the vertex which serves as certain control/regulation center. The author shows that the system is solvable under very necessary conditions. It is crucial to recover the topology of the network/metric graph which the topology is given. To begin the analysis, one constructs the special solution fixed on one end of edges while maintaining continuous at the vertex. This models a string that is vibrating vertically at the vertex according to certain frequencies. The non-local characteristic function plays a role, and then, one tries to find a non-trivial non-local eigenvalue.", "url": "https://arxiv.org/abs/2607.29146", "type": "理论", "summary": "作者研究了类星度量图上的Sturm-Liouville算子的逆谱问题。在这个星形图的顶点处，附加了 $m$ 边，这些边是由非局部 Sturm-Liouville 算子强加的，满足一些合适的非局部边界条件。在顶点，我们考虑一点交互条件来建模固定在图边末端的度量图。该模型模拟了在作为特定控制/调节中心的顶点处监测的随时间变化的振动或通量。作者证明了该系统在非常必要的条件下是可解的。恢复给定拓扑的网络/度量图的拓扑至关重要。为了开始分析，我们构建固定在边一端的特殊解，同时在顶点保持连续。该模型模拟了一根根据特定频率在顶点垂直振动的弦。非局部特征函数发挥作用，然后，我们试图找到一个非平凡的非局部特征值。", "authors": [{"name": "Lung-Hui Chen"}], "featured_authors": [{"name": "Lung-Hui Chen"}], "author_count": 1}, {"id": "2607.29358", "category": "math-ph", "title": "Realization embeddings of the rank two Racah algebra into the rank two Jacobi algebra", "abstract": "We construct an explicit embedding of the rank two Racah algebra $\\mathfrak{R}_2$ into the rank two Jacobi algebra $\\mathfrak{J}_2$. Working in the differential model of $\\mathfrak{J}_2$ on the triangle, we recall that the subalgebra structure of $\\mathfrak{J}_2$ is organized by a pentagon whose four upper edges carry rank one Jacobi algebras and whose base carries a rank one Racah algebra. Promoting the two multiplication operators to Racah type generators by tridiagonalization turns every edge of the pentagon into a rank one Racah algebra and realizes $\\mathfrak{R}_2$ inside $\\mathfrak{J}_2$. We determine the common eigenfunctions of different commuting pairs explicitly as products of Gauss hypergeometric functions and Jacobi polynomials. Different overlap coefficients are computed involving univariate Wilson polynomials as well as, for one pair of bases, bivariate Racah polynomials of Tratnik type. We also recall how $\\mathfrak{J}_2$ arises as a contraction of the rank two Racah algebra $\\mathfrak{R}_2$.", "url": "https://arxiv.org/abs/2607.29358", "type": "理论", "summary": "我们将二阶拉卡代数 $\\mathfrak{R}_2$ 构造为二阶雅可比代数 $\\mathfrak{J}_2$ 的显式嵌入。在三角形 $\\mathfrak{J}_2$ 的微分模型中，我们回想起 $\\mathfrak{J}_2$ 的子代数结构是由一个五边形组织的，该五边形的四个上边带有一级雅可比代数，其底边带有一级拉卡代数。通过三对角化将两个乘法运算符提升为 Racah 型生成器，将五边形的每条边都变成一级 Racah 代数，并在 $\\mathfrak{J}_2$ 中实现 $\\mathfrak{R}_2$。我们将不同通勤对的共同特征函数明确确定为高斯超几何函数和雅可比多项式的乘积。不同的重叠系数的计算涉及单变量威尔逊多项式以及一对碱基的 Tratnik 类型的双变量 Racah 多项式。我们还记得 $\\mathfrak{J}_2$ 是如何作为二阶 Racah 代数 $\\mathfrak{R}_2$ 的收缩而出现的。", "authors": [{"name": "Nicolas Crampé"}, {"name": "Sarah Post"}, {"name": "Luc Vinet"}], "featured_authors": [{"name": "Nicolas Crampé"}, {"name": "Sarah Post"}, {"name": "Luc Vinet"}], "author_count": 3}, {"id": "2607.29373", "category": "math-ph", "title": "Haantjes torsion and integrability: a proof of Bolsinov-Konyaev-Matveev's conjecture", "abstract": "We prove a conjecture formulated by Bolsinov, Konyaev and Matveev in [7] stating that, integrability of a system of hydrodynamic type ${\\bf u}_t=A({\\bf u}) {\\bf u}_x$ with $\\mathfrak{gl}$-regular $A$ at a point $p$ implies the vanishing of the Haantjes tensor of $A$ and of all its symmetries in a neighborhood of $p$. As a consequence, leveraging on the result of [8], in a neighbourhood of an algebraically generic point, any integrable system of hydrodynamic type defined by a $\\mathfrak{gl}$-regular operator field can be written as ${\\bf u}_t=X({\\bf u})\\circ {\\bf u}_x$ where $X$ is a vector field and $\\circ$ is a commutative associative product satisfying Hertling-Manin conditions.", "url": "https://arxiv.org/abs/2607.29373", "type": "理论", "summary": "我们证明了 Bolsinov、Konyaev 和 Matveev 在 [7] 中提出的猜想，指出流体动力学类型 ${\\bf u}_t=A({\\bf u}) {\\bf u}_x$ 与 $\\mathfrak{gl}$-正则 $A$ 在点 $p$ 处的可积性意味着 $A$ 的 Haantjes 张量及其在邻域中的所有对称性消失$p$。因此，利用[8]的结果，在代数泛点的邻域中，任何由 $\\mathfrak{gl}$-正则算子场定义的流体动力类型可积系统都可以写为 ${\\bfu u}_t=X({\\bfu u})\\circ {\\bfu}_x$，其中 $X$ 是向量场，$\\circ$ 是满足 Herdling-Manin 的交换关联积条件。", "authors": [{"name": "Alessandro Arsie"}, {"name": "Paolo Lorenzoni"}], "featured_authors": [{"name": "Alessandro Arsie"}, {"name": "Paolo Lorenzoni"}], "author_count": 2}, {"id": "2607.29485", "category": "math-ph", "title": "On the Emergence of Exponential Decay from Discrete Spectra for Friedrichs Hamiltonians", "abstract": "We study a class of Friedrichs Hamiltonians, that is, operators describing an excited state coupled to a bath through a rank-one perturbation, in the case where the bath Hamiltonian has purely discrete spectrum. We consider sequences of such Hamiltonians for which the spectral measures associated to the coupling functions by the bath Hamiltonians converge weakly to a limiting measure that is absolutely continuous with a Hölder continuous density near the excited energy. Under this assumption, we show that the survival probability of the excited state decays in an approximately exponential manner on suitable time scales and under favourable conditions, with a decay rate given by Fermi's golden rule for the limiting measure. The error is estimated in terms of the coupling strength and the Lévy distance between the discrete spectral measures and the limiting measure. As an application, we treat a two-level atom coupled to a massless bosonic field confined to a large cavity in the rotating-wave approximation.", "url": "https://arxiv.org/abs/2607.29485", "type": "理论", "summary": "我们研究一类弗里德里希哈密顿量，即在浴哈密顿量具有纯离散谱的情况下，通过一阶扰动描述与浴耦合的激发态的算子。我们考虑这样的哈密顿量序列，其中与浴哈密顿量的耦合函数相关的光谱测量弱地收敛到与激发能量附近的霍尔德连续密度绝对连续的极限测量。在这个假设下，我们证明了激发态的生存概率在适当的时间尺度和有利的条件下以近似指数的方式衰减，衰减率由费米黄金法则给出的限制措施给出。误差根据耦合强度以及离散谱测量和限制测量之间的 Lévy 距离来估计。作为一种应用，我们在旋转波近似中处理与限制在大空腔内的无质量玻色子场耦合的二能级原子。", "authors": [{"name": "Tamim Al-Qaiwani"}, {"name": "Sören Petrat"}], "featured_authors": [{"name": "Tamim Al-Qaiwani"}, {"name": "Sören Petrat"}], "author_count": 2}, {"id": "2607.29526", "category": "math-ph", "title": "Spectral Analysis of a Soft Quantum Waveguide Coupled to a Massive Quantum Scalar Field", "abstract": "We study a Nelson-type Hamiltonian describing a massive spinless non-relativistic particle moving in a planar soft quantum waveguide and linearly coupled to a massive scalar bosonic field. Our spectral analysis relies on comparing the curved waveguide with its straight counterpart. For the straight Hamiltonian, longitudinal translation invariance yields a fiber decomposition, and we prove that its spectrum is purely essential and gapless. For the curved Hamiltonian, we establish an HVZ-type formula for the bottom of the essential spectrum, involving that of the straight system and the one-boson threshold. We also derive a sufficient condition for the existence of non-empty discrete spectrum in the curved case, expressed in terms of an effective one-dimensional Schrödinger operator.", "url": "https://arxiv.org/abs/2607.29526", "type": "理论", "summary": "我们研究了纳尔逊型哈密顿量，描述了在平面软量子波导中移动的巨大无自旋非相对论粒子，并线性耦合到巨大的标量玻色子场。我们的光谱分析依赖于将弯曲波导与其直波导进行比较。对于直哈密顿量，纵向平移不变性产生纤维分解，并且我们证明其谱是纯粹必要的且无间隙的。对于弯曲哈密顿量，我们建立了基本谱底部的HVZ型公式，涉及直系统和单玻色子阈值。我们还推导了弯曲情况下非空离散谱存在的充分条件，用有效的一维薛定谔算子表示。", "authors": [{"name": "Benjamin Alvarez"}, {"name": "Hugo Gouttenegre"}], "featured_authors": [{"name": "Benjamin Alvarez"}, {"name": "Hugo Gouttenegre"}], "author_count": 2}, {"id": "2607.28716", "category": "quant-ph", "title": "Cascading amplifiers can create exponentially large coherence", "abstract": "A standard laser beam has photon degeneracy, or coherence, $\\mathfrak{C}$, of at most $8\\mu^2$, where $\\mu$ is the number of photons in the laser itself. Even quantum-engineered lasers, if required to produce a beam with the standard statistical properties, have limited coherence, scaling as $\\mu^4$. Moreover, such lasers (still unrealised) require very unconventional gain and output-coupling mechanisms. Here, we propose a different path to increasing $\\mathfrak{C}$: cascaded linear amplifiers, with conventional couplings. By dropping the requirement on the beam's properties, this approach can, in theory, achieve $\\mathfrak{C}$ scaling exponentially in $\\mu$. Here $\\mu$ is the total source excitation number, across all the amplifiers. Two amplifiers suffice to surpass the standard $\\mu^2$ scaling.", "url": "https://arxiv.org/abs/2607.28716", "type": "理论", "summary": "标准激光束的光子简并性或相干性 $\\mathfrak{C}$ 最多为 $8\\mu^2$，其中 $\\mu$ 是激光器本身的光子数。即使是量子工程激光器，如果需要产生具有标准统计特性的光束，相干性也有限，缩放比例为 $\\mu^4$。此外，这种激光器（尚未实现）需要非常规的增益和输出耦合机制。在这里，我们提出了一种增加 $\\mathfrak{C}$ 的不同途径：使用传统耦合的级联线性放大器。通过降低对梁属性的要求，理论上，这种方法可以在 $\\mu$ 中实现 $\\mathfrak{C}$ 指数缩放。这里 $\\mu$ 是所有放大器的总源激励数。两个放大器足以超越标准 $\\mu^2$ 缩放。", "authors": [{"name": "Lucas A. Ostrowski"}, {"name": "Giacomo Pantaleoni"}, {"name": "Howard M. Wiseman"}, {"name": "Dominic W. Berry"}], "featured_authors": [{"name": "Lucas A. Ostrowski"}, {"name": "Giacomo Pantaleoni"}, {"name": "Howard M. Wiseman"}, {"name": "Dominic W. Berry"}], "author_count": 4}, {"id": "2607.28730", "category": "quant-ph", "title": "Quantum Resources in Disorder-Free Localization Dynamics of Gauge Theories", "abstract": "Quantum-state complexity diagnostics provide valuable insight into many-body dynamics, information scrambling, and quantum computation. Here, we investigate the real-time dynamics of quantum complexity in $1+1$-dimensional Abelian U(1) and non-Abelian SU(2) lattice gauge theories (LGTs), focusing on the disorder-free localization (DFL) regime. Using stabilizer Rényi entropy, participation Rényi entropy, and fermionic non-Gaussianity as measures of complexity, we observe, for both theories, two main behaviors as a function of the gauge coupling: at intermediate values, a power-law relaxation towards saturation, consistent with observations in many-body localization, and, at sufficiently large values, an ultraslow double-logarithmic growth, which we substantiate with a configuration-space bound verified by exact counting. Our results not only provide deeper insight into the dynamics of DFL but also highlight the role of gauge invariance in constraining quantum resources and are relevant to recent quantum simulations of LGTs.", "url": "https://arxiv.org/abs/2607.28730", "type": "理论+数值", "summary": "量子态复杂性诊断为多体动力学、信息置乱和量子计算提供了宝贵的见解。在这里，我们研究了 1+1$ 维阿贝尔 U(1) 和非阿贝尔 SU(2) 晶格规范理论 (LGT) 中量子复杂性的实时动态，重点关注无序局域化 (DFL) 机制。使用稳定器 Rényi 熵、参与 Rényi 熵和费米子非高斯性作为复杂性的度量，对于这两种理论，我们观察到作为规范耦合函数的两个主要行为：在中间值处，幂律松弛趋于饱和，与多体定位中的观察结果一致；在足够大的值处，超慢的双对数增长，我们用通过精确计数验证的配置空间界限来证实这一点。我们的结果不仅提供了对 DFL 动力学的更深入的了解，而且还强调了规范不变性在约束量子资源中的作用，并且与最近 LGT 的量子模拟相关。", "authors": [{"name": "Devendra Singh Bhakuni"}, {"name": "Giovanni Cataldi"}, {"name": "Jad C. Halimeh"}, {"name": "Emanuele Tirrito"}], "featured_authors": [{"name": "Devendra Singh Bhakuni"}, {"name": "Giovanni Cataldi"}, {"name": "Jad C. Halimeh"}, {"name": "Emanuele Tirrito"}], "author_count": 4}, {"id": "2607.28749", "category": "quant-ph", "title": "Detection-resolution limits of large-momentum-transfer atom gravimetry", "abstract": "Large momentum transfer (LMT) enhances the gravitational phase of a light-pulse atom interferometer by a factor $n$, while mirrorless operation with momentum-resolved detection can quadruple the phase-carrying quantum Fisher information. These gains compete in practice because the momentum-space fringe period scales as $1/n$, making the fringe signal increasingly vulnerable to finite detector resolution. We analyze this trade-off in a solvable model with instantaneous lossless $n$-photon pulses, a Gaussian source, and Gaussian detection blur, allowing continuous interpolation between Kasevich--Chu and mirrorless geometries. Closed-form expressions for the blurred output distributions and classical Fisher information are obtained, with a fringe-phase averaging approximation whose error is exponentially suppressed and agrees with numerical simulations at the $10^{-8}$ level. We find that mirrorless operation surpasses a conventional interferometer with the same momentum transfer only when $\\sigma_p < 0.91\\,m/(n k_0 T)$. Fringe-based readout exhibits an optimal momentum transfer $n^* \\simeq 0.93\\,m/(\\sigma_p k_0 T)$ and a resolution-limited sensitivity floor $\\Delta g \\simeq 4.4\\,\\sigma_p/(mT\\sqrt{N})$, independent of photon momentum. When this criterion is not satisfied, partial mirror asymmetry can recover part of the enhancement, whereas population-based readout remains insensitive to detector blur and ultimately favors the conventional sequence at sufficiently large $n$. Estimates for $^{87}$Rb sensors show that the mirrorless advantage is primarily restricted to short-baseline instruments.", "url": "https://arxiv.org/abs/2607.28749", "type": "理论+数值", "summary": "大动量转移 (LMT) 将光脉冲原子干涉仪的引力相位增强了 $n$ 倍，而具有动量分辨检测功能的无反光镜操作可以将携带相位的量子费希尔信息增加四倍。这些增益在实践中相互竞争，因为动量空间边缘周期的缩放比例为 1/n$，使得边缘信号越来越容易受到有限探测器分辨率的影响。我们在可解模型中分析了这种权衡，该模型具有瞬时无损 $n$ 光子脉冲、高斯源和高斯检测模糊，允许 Kasevich--Chu 和无反光镜几何结构之间的连续插值。获得了模糊输出分布和经典费舍尔信息的闭合形式表达式，具有边缘相位平均近似，其误差被指数抑制并且与$10^{-8}$水平上的数值模拟一致。我们发现，仅当 $\\sigma_p < 0.91\\,m/(n k_0 T)$ 时，无反光镜操作才超越具有相同动量传递的传统干涉仪。\n\n基于条纹的读出表现出最佳动量转移 $n^* \\simeq 0.93\\,m/(\\sigma_p k_0 T)$ 和分辨率有限的灵敏度下限 $\\Delta g \\simeq 4.4\\,\\sigma_p/(mT\\sqrt{N})$，与光子动量无关。当不满足此标准时，部分镜像不对称可以恢复部分增强，而基于群体的读出仍然对探测器模糊不敏感，并最终在足够大的$n$下有利于传统序列。对 $^{87}$Rb 传感器的估计表明，无反光镜的优势主要限于短基线仪器。", "authors": [{"name": "Asad Ali"}, {"name": "Saif Al-Kuwari"}], "featured_authors": [{"name": "Asad Ali"}, {"name": "Saif Al-Kuwari"}], "author_count": 2}, {"id": "2607.28753", "category": "quant-ph", "title": "Gaussian-augmented bosonic matrix-product states: theory and applications", "abstract": "We propose and analyze the structure of a family of bosonic quantum many-body states that have the following features: (i) they include all pure Gaussian states and finite-dimensional matrix-product states as subclasses; (ii) their expectation values can be efficiently computed, allowing them to be used, among other things, for variational calculations; (iii) they admit exact parent Hamiltonians expressed as simple functions of the bosonic creation and annihilation operators.", "url": "https://arxiv.org/abs/2607.28753", "type": "理论+数值", "summary": "我们提出并分析了具有以下特征的玻色子量子多体态族的结构：（i）它们包括所有纯高斯态和有限维矩阵乘积态作为子类； (ii) 可以有效地计算它们的期望值，从而可以将它们用于变分计算等； (iii) 他们承认精确的父哈密顿量被表示为玻色子创造和湮没算子的简单函数。", "authors": [{"name": "Erickson Tjoa"}, {"name": "J. Ignacio Cirac"}], "featured_authors": [{"name": "Erickson Tjoa"}, {"name": "J. Ignacio Cirac"}], "author_count": 2}, {"id": "2607.28866", "category": "quant-ph", "title": "Generative IQP Circuit Learning with Physics-Informed Latent Initialization", "abstract": "Quantum generative learning based on instantaneous quantum polynomial-time (IQP) circuits can benefit from efficient classical training strategies. A recent latent adaptation framework for IQP-based generative modeling transfers shared circuit parameters across instances of the same task with different hyperparameters while adapting only a low-dimensional latent variable for each new instance. However, existing approaches initialize this latent variable randomly, which can limit optimization efficiency and performance. In this work, we introduce a physics-informed latent initialization scheme for IQP generative learning to improve upon existing random initialization schemes. Motivated by the platonic representation hypothesis, we use latent representations extracted from a classical physics-informed neural network (PINN) surrogate to initialize the latent variables of the quantum model for the solution of the Burgers' equation. The initialized IQP model is then adapted on a higher-resolution solution domain. We find that this structured initialization consistently outperforms random latent initialization, yielding improved adaptation behavior and stronger generative accuracy across multiple viscosity settings. These results show that classical surrogate representations can provide useful inductive bias for quantum generative models and offer a practical route to improved initialization in IQP-based learning.", "url": "https://arxiv.org/abs/2607.28866", "type": "理论+数值", "summary": "基于瞬时量子多项式时间（IQP）电路的量子生成学习可以受益于高效的经典训练策略。最近基于 IQP 的生成建模的潜在适应框架在具有不同超参数的同一任务的实例之间传输共享电路参数，同时为每个新实例仅适应低维潜在变量。然而，现有方法随机初始化该潜在变量，这会限制优化效率和性能。在这项工作中，我们引入了一种用于 IQP 生成学习的物理信息潜在初始化方案，以改进现有的随机初始化方案。受柏拉图表示假说的启发，我们使用从经典物理信息神经网络（PINN）代理中提取的潜在表示来初始化量子模型的潜在变量，以求解伯格斯方程。然后将初始化的 IQP 模型适应更高分辨率的解域。\n\n我们发现这种结构化初始化始终优于随机潜在初始化，从而在多个粘度设置下产生改进的适应行为和更强的生成准确性。这些结果表明，经典代理表示可以为量子生成模型提供有用的归纳偏差，并为改进基于 IQP 的学习中的初始化提供实用途径。", "authors": [{"name": "Chen-Yu Liu"}, {"name": "Leonardo Placidi"}, {"name": "Marco Ballarin"}, {"name": "Enrico Rinaldi"}], "featured_authors": [{"name": "Chen-Yu Liu"}, {"name": "Leonardo Placidi"}, {"name": "Marco Ballarin"}, {"name": "Enrico Rinaldi"}], "author_count": 4}, {"id": "2607.28922", "category": "quant-ph", "title": "Error-Generator-Level Compression for Fast Quantum Gates", "abstract": "Fast quantum gates in multilevel systems require suppressing many coherent-error channels using pulses that remain simple to implement. We introduce error-generator-level compression, a Magnus-based control principle that minimizes the complete projected error generator at a chosen perturbative order while restricting the implemented waveform to a few independently adjustable coefficients. This construction preserves all modeled computational and leakage errors rather than truncating the pulse by error channel, while its generator-level objective directly penalizes residual eigenphases that can signal departure from the perturbative regime. For fast transmon gates, a three-parameter pulse suppresses errors by orders of magnitude, outperforms grid-optimized leading- order DRAG over the gate-time range studied, and approaches a fully parameterized 17-parameter Magnus correction. The compressed pulse is also substantially less sensitive to the illustrative finite-bandwidth filtering model considered here.", "url": "https://arxiv.org/abs/2607.28922", "type": "理论+数值", "summary": "多级系统中的快速量子门需要使用易于实现的脉冲来抑制许多相干误差通道。我们引入了误差发生器级压缩，这是一种基于马格努斯的控制原理，可在选定的扰动阶数下最小化完整的投影误差发生器，同时将实现的波形限制为几个独立可调的系数。这种结构保留了所有建模的计算和泄漏误差，而不是通过误差通道截断脉冲，而其发生器级目标直接惩罚可能发出偏离微扰状态信号的残余本征相。对于快速传输门，三参数脉冲可将误差抑制几个数量级，在研究的门时间范围内优于网格优化的前阶 DRAG，并接近完全参数化的 17 参数马格努斯校正。压缩脉冲对于这里考虑的示例性有限带宽滤波模型也基本上不太敏感。", "authors": [{"name": "Razvan Stanescu"}, {"name": "Hugo Ribeiro"}], "featured_authors": [{"name": "Razvan Stanescu"}, {"name": "Hugo Ribeiro"}], "author_count": 2}, {"id": "2607.28998", "category": "quant-ph", "title": "Construction of Sets of Orthogonal Quantum States with Minimal Nonlocality in Bipartite and Tripartite Systems of Unequal Local Dimensions", "abstract": "The research on minimal nonlocality aims to determine the minimal cardinality of nonlocal sets of quantum states. However, the construction of a nonlocal set of states in bipartite or tripartite quantum systems with unequal local dimensions remains unsolved. In this paper, we first give a method to construct a set of orthogonal quantum states with minimal nonlocality in $\\mathbb{C}^{4} \\otimes \\mathbb{C}^{7}$ quantum system. Then we give a general method to construct a set of orthogonal quantum states with minimal nonlocality in a bipartite quantum system with unequal local dimensions. Furthermore, we generalize the construction method to tripartite quantum system with unequal local dimensions, and construct a set of orthogonal quantum states with minimal nonlocality in $\\mathbb C^{d_1} \\otimes \\mathbb C^{d_2}\\otimes \\mathbb C^{d_3}$ quantum system for $5\\le d_1 < d_2 < d_3$. Our work settles the construction problem of a set of orthogonal states with minimal nonlocality in both bipartite and tripartite systems with unequal local dimensions.", "url": "https://arxiv.org/abs/2607.28998", "type": "数值", "summary": "最小非定域性的研究旨在确定非定域量子态集的最小基数。然而，在局域维度不等的二分或三分量子系统中构造非局域态集仍然悬而未决。在本文中，我们首先给出了一种在 $\\mathbb{C}^{4} \\otimes \\mathbb{C}^{7}$ 量子系统中构造一组具有最小非定域性的正交量子态的方法。然后我们给出了在局域维度不等的二分量子系统中构造一组具有最小非局域性的正交量子态的通用方法。此外，我们将构造方法推广到局域维度不等的三方量子系统，并在$\\mathbb C^{d_1} \\otimes \\mathbb C^{d_2}\\otimes \\mathbb C^{d_3}$量子系统中构造一组具有最小非局域性的正交量子态，$5\\le d_1 < d_2 < d_3$。我们的工作解决了局部维度不等的二分系统和三分系统中具有最小非局域性的一组正交状态的构造问题。", "authors": [{"name": "Ben-Hao Zhao"}, {"name": "Dong-Huan Jiang"}, {"name": "Yu-Guang Yang"}, {"name": "Guang-Bao Xu"}], "featured_authors": [{"name": "Ben-Hao Zhao"}, {"name": "Dong-Huan Jiang"}, {"name": "Yu-Guang Yang"}, {"name": "Guang-Bao Xu"}], "author_count": 4}, {"id": "2607.29054", "category": "quant-ph", "title": "Optimal complex conjugation of unknown isometry channels", "abstract": "Access to the complex conjugate of an unknown quantum channel is a useful resource in quantum oracle problems, motivating the question of how such access can be simulated using only a limited number of calls to the original channel. We determine the optimal deterministic protocol for approximately implementing the complex conjugate isometry $\\overline{V}$ from $n$ uses of an unknown isometry channel $V: \\mathbb{C}^d\\to\\mathbb{C}^D$. We derive a closed-form expression for the optimal fidelity and prove that a parallel protocol is optimal even among general quantum superchannels, including adaptive and indefinite-causal-order strategies. The formula implies a query complexity $n=\\Theta(d[(D-d)/\\epsilon+1])$ for achieving infidelity $\\epsilon$. We also present a circuit construction based on the quantum Schur transform and the dual Clebsch--Gordan transform, with circuit complexity $O(\\mathrm{poly}(D,1/\\epsilon))$. This task is extended to the multi-copy case $V^{\\otimes n}\\mapsto \\overline{V}^{\\otimes k}$. For fixed $d<D$ and $k$, we show that the optimal fidelity for the multi-copy case is $1-kd(D-d)/n+o(n^{-1})$, and that this value is asymptotically attained by a parallel estimation-based protocol. Finally, combining the isometry protocol with random Stinespring dilations yields a protocol for complex conjugation of unknown rank-$r$ quantum channels whose query complexity is optimal up to a constant factor if the Kraus rank $r$ is constant.", "url": "https://arxiv.org/abs/2607.29054", "type": "理论", "summary": "对未知量子通道的复共轭的访问是量子预言问题中的有用资源，引发了如何仅使用对原始通道的有限数量的调用来模拟这种访问的问题。我们通过使用未知等距通道 $V 来确定近似实现复共轭等距 $\\overline{V}$ 的最佳确定性协议：\\mathbb{C}^d\\to\\mathbb{C}^D$。我们推导出最佳保真度的封闭式表达式，并证明即使在通用量子超级通道（包括自适应和不定因果顺序策略）中，并行协议也是最佳的。该公式意味着实现不忠 $\\epsilon$ 的查询复杂度 $n=\\Theta(d[(D-d)/\\epsilon+1])$。我们还提出了一种基于量子 Schur 变换和对偶 Clebsch-Gordan 变换的电路构造，电路复杂度为 $O(\\mathrm{poly}(D,1/\\epsilon))$。此任务扩展到多副本情况 $V^{\\otimes n}\\mapsto \\overline{V}^{\\otimes k}$。\n\n对于固定的 $d<D$ 和 $k$，我们表明多副本情况的最佳保真度是 $1-kd(D-d)/n+o(n^{-1})$，并且该值是通过基于并行估计的协议渐近获得的。最后，将等距协议与随机 Stinespring 膨胀相结合，产生一个用于未知秩 $r$ 量子通道的复杂共轭的协议，如果 Kraus 秩 $r$ 恒定，则其查询复杂度在恒定因子下是最佳的。", "authors": [{"name": "Satoshi Yoshida"}, {"name": "Mio Murao"}], "featured_authors": [{"name": "Satoshi Yoshida"}, {"name": "Mio Murao"}], "author_count": 2}, {"id": "2607.29145", "category": "quant-ph", "title": "Transpiler Autotuning with Predictive Models for Quantum Circuit Optimization", "abstract": "Quantum software engineering is an emerging research field focusing on efficiently embedding the quantum programming paradigm into existing software ecosystems. A key aspect of this field is the realization of quantum algorithms using gate-based programming and the subsequent low-level optimization of the resulting quantum circuits, a process that is commonly performed by so-called transpilation pipelines. One significant challenge in these pipelines is determining which optimizations to apply to a given circuit. This decision is usually based on fixed default configurations that are uniformly applied to all circuits, frequently resulting in missed opportunities for more aggressive circuit optimization. In this work, we tackle this challenge by applying autotuning with supervised machine learning to develop an automated method for selection of transpiler passes. To train our machine-learning models, we employ feature-model based sampling to generate a representative dataset that examines how different combinations of Qiskit transpiler passes perform across thousands of circuits drawn from the state-of-the-art benchmarking suite MQT Bench. Using these data, we build a predictive model extension for the Qiskit transpilation pipeline that uses a machine learning model to automatically select combinations of transpiler passes aiming to achieve a maximum reduction in two-qubit gates. Our empirical evaluation shows that the combinations selected by our model are never outperformed by Qiskit's optimization levels, achieve on average an additional 19.1$\\%$ - 32.4$\\%$ reduction in two-qubit gates, and for some circuits finds reductions of up to $95.8\\%$ in cases where Qiskit achieves no reduction at all.", "url": "https://arxiv.org/abs/2607.29145", "type": "理论+数值", "summary": "量子软件工程是一个新兴的研究领域，专注于将量子编程范式有效地嵌入到现有的软件生态系统中。该领域的一个关键方面是使用基于门的编程实现量子算法以及随后对所得量子电路进行低级优化，该过程通常由所谓的转译管道执行。这些流程中的一个重大挑战是确定对给定电路应用哪些优化。该决定通常基于统一应用于所有电路的固定默认配置，经常导致错失更积极的电路优化的机会。在这项工作中，我们通过应用自动调整和监督机器学习来解决这一挑战，开发一种选择转译器通道的自动化方法。为了训练我们的机器学习模型，我们采用基于特征模型的采样来生成代表性数据集，该数据集检查 Qiskit 转译器通道的不同组合在从最先进的基准测试套件 MQT Bench 中抽取的数千个电路中的执行情况。\n\n使用这些数据，我们为 Qiskit 转译管道构建了一个预测模型扩展，该扩展使用机器学习模型自动选择转译器通道的组合，旨在最大程度地减少两个量子位门。我们的实证评估表明，我们的模型选择的组合从未被 Qiskit 的优化水平所超越，在两个量子位门中平均实现了 19.1$\\%$ - 32.4$\\%$ 的额外减少，并且对于某些电路，在 Qiskit 根本没有实现任何减少的情况下，发现减少高达 $95.8\\%$。", "authors": [{"name": "Piotr Malkowski"}, {"name": "Domenik Eichhorn"}, {"name": "Joshua Ammermann"}, {"name": "Rinor Kelmendi"}, {"name": "Nick Poser"}, {"name": "Patrick Hopf"}, {"name": "Ina Schaefer"}], "featured_authors": [{"name": "Piotr Malkowski"}, {"name": "Domenik Eichhorn"}, {"name": "Joshua Ammermann"}, {"name": "Nick Poser"}, {"name": "Patrick Hopf"}, {"name": "Ina Schaefer"}], "author_count": 7}, {"id": "2607.29165", "category": "quant-ph", "title": "Entanglement in bipartite systems with symmetry: coupled chaotic kicked Bose-Hubbard systems", "abstract": "We investigate the average eigenstate entanglement in a bipartite many-body system which exhibits a breaking of two local conservation laws into a global conserved quantity. Such a setting is realized by the particle number conservation in Bose-Hubbard systems. We devise a corresponding random matrix model which captures the universal features of this symmetry breaking and allows for applying powerful random matrix methods. By combining the concept of symmetry resolved entanglement with perturbation theory for quantum chaotic systems we obtain a universal entanglement transition depending on a single fundamental parameter. Furthermore, the symmetry resolved entanglement allows for separating the genuine entanglement from the part which originates from the conserved quantity. This latter contribution is quantified by the number entropy. For this it is shown that the symmetry breaking generates a localization of the eigenstates due to a banded structure of the time-evolution operator. By extrapolating the results beyond the perturbative regime we obtain an analytic description of the full transition.", "url": "https://arxiv.org/abs/2607.29165", "type": "理论+数值", "summary": "我们研究了二分多体系统中的平均本征态纠缠，该系统表现出两个局部守恒定律被打破为全局守恒量。这种设置是通过 Bose-Hubbard 系统中的粒子数守恒来实现的。我们设计了一个相应的随机矩阵模型，它捕获了这种对称性破缺的普遍特征，并允许应用强大的随机矩阵方法。通过将对称解析纠缠的概念与量子混沌系统的微扰理论相结合，我们获得了取决于单个基本参数的通用纠缠跃迁。此外，对称解决的纠缠允许将真正的纠缠与源自守恒量的部分分开。后者的贡献通过数熵来量化。为此，结果表明，由于时间演化算子的​​带状结构，对称性破缺会产生本征态的局域化。通过将结果推断到扰动状态之外，我们获得了完整转变的分析描述。", "authors": [{"name": "J. Himmelsbach"}, {"name": "M. F. I. Kieler"}, {"name": "A. Bäcker"}], "featured_authors": [{"name": "J. Himmelsbach"}, {"name": "M. F. I. Kieler"}, {"name": "A. Bäcker"}], "author_count": 3}, {"id": "2607.29186", "category": "quant-ph", "title": "Towards the Characterization of Logical Errors in Distributed Lattice Surgery", "abstract": "Distributed quantum computing offers a scalable alternative to monolithic quantum processors by networking smaller quantum modules through shared entangled pairs. A central challenge in this setting is that inter-module quantum operations are typically noisier than intra-module local gates, which introduces additional noise into the system. In this work, we analyze distributed lattice surgery under heterogeneous noise conditions, focusing in particular on the merge operation as one of its fundamental subroutines. Specifically, we discuss the XX merge operation between two rotated surface-code patches hosted on two different quantum processors. We characterize logical errors in the resulting H-shaped spacetime diagram and estimate thresholds using a minimum-weight perfect matching (MWPM) decoder. We use a phenomenological noise model and derive distinct bulk and seam error rates to approximate a circuit-level noise model that includes contributions from local CNOT gates, noisy entangled pairs, idle errors, and readout errors. Our results provide practical insights into selecting the optimal surface-code distance, establishing target local-gate fidelities, and determining the tolerable entangled-pair fidelity required for logical operations in a distributed architecture.", "url": "https://arxiv.org/abs/2607.29186", "type": "理论", "summary": "分布式量子计算通过共享纠缠对将较小的量子模块联网，为单片量子处理器提供了可扩展的替代方案。这种设置中的一个主要挑战是模块间量子操作通常比模块内本地门噪声更大，这会给系统带来额外的噪声。在这项工作中，我们分析了异构噪声条件下的分布式晶格手术，特别关注合并操作作为其基本子程序之一。具体来说，我们讨论托管在两个不同量子处理器上的两个旋转表面代码补丁之间的 XX 合并操作。我们描述了生成的 H 形时空图中的逻辑错误，并使用最小权重完美匹配 (MWPM) 解码器估计阈值。我们使用唯象噪声模型并推导出不同的体错误率和接缝错误率来近似电路级噪声模型，其中包括本地 CNOT 门、噪声纠缠对、空闲错误和读出错误的贡献。\n\n我们的结果为选择最佳表面代码距离、建立目标本地门保真度以及确定分布式架构中逻辑操作所需的可容忍纠缠对保真度提供了实用的见解。", "authors": [{"name": "Nitish Kumar Chandra"}, {"name": "Reza Nejabati"}, {"name": "Eneet Kaur"}], "featured_authors": [{"name": "Nitish Kumar Chandra"}, {"name": "Reza Nejabati"}, {"name": "Eneet Kaur"}], "author_count": 3}, {"id": "2607.29339", "category": "quant-ph", "title": "Charging and Discharging a Hubbard-Holstein Quantum Battery: Specific Mechanisms and General Insights", "abstract": "A Hubbard-Holstein dimer functions as a correlation-driven quantum battery, with ergotropy robustly stored, under some conditions, even in the presence of dissipation. We find that, although optimal work extraction can in principle recover all the stored energy, it requires unrealistically fine-tuned couplings. By contrast, a physically realizable protocol based on spectral matching between the battery and the load achieves substantial, albeit suboptimal, energy extraction. Our results identify a mechanism for quantum energy storage, provide a realistic route to work extraction that is amenable to machine-learning-based theoretical exploration, and suggest that quantum batteries may not be universally deployable: the microscopic mechanism responsible for storing energy can constrain the classes of systems able to efficiently extract it.", "url": "https://arxiv.org/abs/2607.29339", "type": "数值", "summary": "哈伯德-荷斯坦二聚体充当相关驱动的量子电池，在某些条件下，甚至在存在耗散的情况下，也能稳健地存储各向异性。我们发现，虽然最佳功提取原则上可以恢复所有存储的能量，但它需要不切实际的微调耦合。相比之下，基于电池和负载之间的光谱匹配的物理上可实现的协议可实现大量（尽管不是最理想的）能量提取。我们的研究结果确定了一种量子能量存储机制，提供了一种现实的工作提取途径，适合基于机器学习的理论探索，并表明量子电池可能无法普遍部署：负责存储能量的微观机制可能会限制能够有效提取能量的系统类别。", "authors": [{"name": "Emil Östberg"}, {"name": "Arvid Steen"}, {"name": "Najmeh Abiri"}, {"name": "Irene D'Amico"}, {"name": "Claudio Verdozzi"}], "featured_authors": [{"name": "Emil Östberg"}, {"name": "Arvid Steen"}, {"name": "Najmeh Abiri"}, {"name": "Irene D'Amico"}, {"name": "Claudio Verdozzi"}], "author_count": 5}, {"id": "2607.29382", "category": "quant-ph", "title": "Algebraic Speedups for Exact Inversion of Hamiltonian Evolutions", "abstract": "Deterministic exact inversion of an arbitrary $d$-dimensional unitary requires {$\\Theta(d^2)$} coherent forward calls in the worst case. We ask how this cost changes for Hamiltonian evolution $U(x)=\\exp(i\\sum_j x_jH_j)$ when the generators are known but the parameters are hidden. For one-parameter families with a fixed eigenbasis, we show that additive relations among the distinct eigenvalues determine the optimal query number exactly, and we construct the corresponding inversion protocol. For general families, we prove that repeated symmetry sectors do not affect the exact query complexity and give an automatic construction for combining inverses from inequivalent active sectors. We also give a sufficient phase-alignment condition under which family-specific structure can reduce the query number. These results establish structure-dependent bounds for reversing the unknown dynamics arising in Tavis-Cummings out-of-time-order correlator protocols, collective-spin echo verification, and passive multimode links, without requiring prior knowledge or explicit estimation of the underlying coupling strengths.", "url": "https://arxiv.org/abs/2607.29382", "type": "理论", "summary": "在最坏的情况下，任意 $d$ 维酉的确定性精确反转需要 {$\\Theta(d^2)$} 相干前向调用。我们问当生成器已知但参数隐藏时，哈密顿演化 $U(x)=\\exp(i\\sum_j x_jH_j)$ 的成本如何变化。对于具有固定特征基的单参数族，我们证明不同特征值之间的加性关系准确地确定了最佳查询数，并构造了相应的反演协议。对于一般族，我们证明重复的对称扇区不会影响确切的查询复杂性，并给出了用于组合来自不等的活动扇区的逆的自动构造。我们还给出了足够的相位对齐条件，在该条件下，族特定结构可以减少查询数量。这些结果建立了结构相关的边界，用于反转 Tavis-Cummings 乱序相关器协议、集体自旋回波验证和无源多模链路中出现的未知动态，而不需要先验知识或对底层耦合强度的明确估计。", "authors": [{"name": "Jizhe Lai"}, {"name": "Mingrui Jing"}, {"name": "Erdong Huang"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Jizhe Lai"}, {"name": "Mingrui Jing"}, {"name": "Erdong Huang"}, {"name": "Xin Wang"}], "author_count": 4}, {"id": "2607.29418", "category": "quant-ph", "title": "A Variational Framework for Time-Dependent Quantum Systems with Applications to Floquet Hamiltonians", "abstract": "We introduce a variational framework for approximating the time-evolution operator $\\hat{U}(t)$ within a physically motivated operator manifold, reformulating quantum dynamics as a tractable problem in operator space using stationary action principle. For periodically driven systems, the resulting approximate evolution operator directly yields an effective Floquet Hamiltonian, offering a non-perturbative alternative to conventional expansion-based methods. The framework is systematically improvable by enlarging the operator pool and naturally incorporates symmetries and physical constraints. When the operator manifold is chosen from the terms of a truncated Magnus expansion, the variational procedure effectively resums the Magnus series within the restricted space, significantly enhancing accuracy. We benchmark the approach on the driven Rabi model, the driven Lipkin-Meshkov-Glick model, and the one-dimensional driven Ising chain, yielding effective Floquet Hamiltonians that are systematically more accurate than low-order Magnus expansions, particularly in regimes where the latter converge poorly, and illustrating applicability to systems with exponentially large Hilbert spaces. Although we focus here on Floquet systems, the formalism applies equally to generic time-dependent Hamiltonians, providing a versatile tool for non-equilibrium quantum dynamics.", "url": "https://arxiv.org/abs/2607.29418", "type": "理论+数值", "summary": "我们引入了一个变分框架，用于在物理驱动的算子流形内逼近时间演化算子 $\\hat{U}(t)$，使用稳态作用原理将量子动力学重新表述为算子空间中的一个可处理问题。对于周期性驱动系统，所得的近似演化算子直接产生有效的 Floquet 哈密顿量，为传统的基于展开的方法提供了非微扰替代方案。该框架可以通过扩大算子池来系统地改进，并自然地融入对称性和物理约束。当从截断马格努斯展开项中选择算子流形时，变分过程有效地恢复受限空间内的马格努斯级数，从而显着提高精度。我们在驱动 Rabi 模型、驱动 Lipkin-Meshkov-Glick 模型和一维驱动 Ising 链上对该方法进行了基准测试，产生了有效的 Floquet Hamiltonian，其系统性比低阶马格努斯展开更准确，特别是在后者收敛性较差的情况下，并说明了对具有指数级大希尔伯特空间的系统的适用性。\n\n尽管我们在这里关注的是 Floquet 系统，但该形式同样适用于一般的时间相关哈密顿量，为非平衡量子动力​​学提供了一种通用工具。", "authors": [{"name": "Ibsal Assi"}, {"name": "Meenu Kumari"}, {"name": "J. P. F. LeBlanc"}], "featured_authors": [{"name": "Ibsal Assi"}, {"name": "Meenu Kumari"}, {"name": "J. P. F. LeBlanc"}], "author_count": 3}, {"id": "2607.29453", "category": "quant-ph", "title": "Quantum Algorithms for Modular Factorials", "abstract": "We give a bounded-error quantum algorithm that, given a prime $p$, a divisor $q\\mid(p-1)$, and an integer $0<n<p$, computes $n!\\bmod p$ in expected time $\\widetilde{O}(q^c+\\sqrt{p/q})$ for some absolute c
