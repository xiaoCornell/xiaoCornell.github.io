onstant $c\\ge 1$. When $p-1$ has a divisor of size $q\\approx p^{1/(2c+1)}$, this gives the exponent $c/(2c+1)<1/2$. To our knowledge, this is the first algorithm to break the exponent $1/2$ barrier for modular factorials under such a divisor promise. The main technical ingredient is a quantum algorithm that reconstructs the relevant Jacobi sum exactly in compact algebraic form, with polynomial dependence on $q$ and $\\log p$. We further extend the same asymptotic bound to the computation of $n!\\bmod p^2$, uniformly over $0\\le n<p^2$. At $n=p-1$, this determines the Wilson quotient $\\frac{(p-1)!+1}{p}\\pmod p$. We conjecture that the condition $q\\mid(p-1)$ is a technical limitation of the present method rather than an inherent obstruction, and that a uniform quantum algorithm exists for all primes.", "url": "https://arxiv.org/abs/2607.29453", "type": "理论+数值", "summary": "我们给出一个有界误差量子算法，给定一个素数 $p$、一个除数 $q\\mid(p-1)$ 和一个整数 $0<n<p$，对于某个绝对常数 $c\\ge 1$，在预期时间 $\\widetilde{O}(q^c+\\sqrt{p/q})$ 内计算 $n!\\bmod p$。当 $p-1$ 的除数大小为 $q\\approx p^{1/(2c+1)}$ 时，给出指数 $c/(2c+1)<1/2$。据我们所知，这是第一个在除数承诺下打破模阶乘指数 $1/2$ 障碍的算法。主要技术成分是一种量子算法，它以紧凑代数形式精确地重建相关雅可比和，多项式依赖于 $q$ 和 $\\log p$。我们进一步将相同的渐近界限扩展到 $n!\\bmod p^2$ 的计算，均匀地超过 $0\\le n<p^2$。在 $n=p-1$ 时，这确定了威尔逊商 $\\frac{(p-1)!+1}{p}\\pmod p$。我们推测条件 $q\\mid(p-1)$ 是本方法的技术限制而不是固有的障碍，并且对于所有素数都存在统一的量子算法。", "authors": [{"name": "Yann Tal"}], "featured_authors": [{"name": "Yann Tal"}], "author_count": 1}, {"id": "2607.29467", "category": "quant-ph", "title": "A spectral viewpoint on the single defect tight-binding chain", "abstract": "We analyze the time evolution of the nearest-neighbour tight-binding chain in the presence of a single onsite defect. Such a defect was shown to generate non-trivial transport behavior recently in the article \\textit{Acharya et al J. Stat. Mech. (2026) 043102}. The authors have used a defect technique inspired by classical random walk methods to obtain exact analytical expressions for the occupation probability and subsequently the mean and mean-squared displacement (MSD). Here we derive the same results using a spectral decomposition approach. Starting from the secular equation, we obtain the self-consistency condition for the eigenvalues and construct the corresponding normalized eigenvectors. This approach naturally separates the Hilbert space into dark subspace, whose states have zero amplitude at the defect site and remain unaffected, and bright subspaces, whose states get modified because of the defect. Using this eigenvalue decomposition, we provide a spectral origin of non-monotonicity in the MSD. Numerical calculations for finite chains show that the analytically estimated critical defect strength is in excellent agreement with the defect strength that minimizes the MSD.", "url": "https://arxiv.org/abs/2607.29467", "type": "理论+数值", "summary": "我们分析了在存在单个现场缺陷的情况下最近邻紧束缚链的时间演化。最近在文章 \\textit{Acharya et al J. Stat. 中，这种缺陷被证明会产生不平凡的传输行为。机甲。 （2026）043102}。作者使用受经典随机游走方法启发的缺陷技术来获得占用概率的精确解析表达式，以及随后的均值和均方位移 (MSD)。在这里，我们使用谱分解方法得出相同的结果。从世俗方程出发，得到特征值的自洽条件，并构造相应的归一化特征向量。这种方法自然地将希尔伯特空间分为暗子空间和亮子空间，暗子空间的状态在缺陷位置处具有零幅度并且保持不受影响，而亮子空间的状态由于缺陷而被修改。使用这种特征值分解，我们提供了 MSD 中非单调性的谱原点。有限链的数值计算表明，分析估计的临界缺陷强度与最小化 MSD 的缺陷强度非常一致。", "authors": [{"name": "Sayan Roy"}], "featured_authors": [{"name": "Sayan Roy"}], "author_count": 1}, {"id": "2607.29551", "category": "quant-ph", "title": "iSWAP maximises the second-moment spectral gap in random quantum circuits", "abstract": "We prove that the $\\mathrm{iSWAP}$ gate maximises the spectral gap of the Hermitian second-moment operator on every connected graph with at least three vertices, among all two-local unitary circuit ensembles. We further prove that the polyhedral cone defined by asymmetric four-point inequalities is invariant under the transpose of the $\\mathrm{iSWAP}$ semigroup, yielding a componentwise comparison certificate for its positive Perron--Frobenius eigenvector. These results resolve a conjecture of Kong, Li, and Liu.", "url": "https://arxiv.org/abs/2607.29551", "type": "理论", "summary": "我们证明，在所有双局部酉电路系综中，$\\mathrm{iSWAP}$ 门在每个具有至少三个顶点的连通图上最大化埃尔米特二阶矩算子的谱间隙。我们进一步证明了由不对称四点不等式定义的多面锥体在 $\\mathrm{iSWAP}$ 半群的转置下是不变的，从而为其正 Perron--Frobenius 特征向量产生了分量比较证书。这些结果解决了孔、李和刘的猜想。", "authors": [{"name": "Yanying Liang"}, {"name": "Haoran Zhu"}], "featured_authors": [{"name": "Yanying Liang"}, {"name": "Haoran Zhu"}], "author_count": 2}, {"id": "2607.29556", "category": "quant-ph", "title": "Comparison of Spatial Entanglement between dissociated atom and ion : molecular ion photo-dissociated by sequential two-photon absorption and correlated two-photon absorption", "abstract": "We have studied the fidelity of spatial entanglement between dissociated atom and ion from two photon dissociation of hydrogen molecular ion H 2 + . Two processes for two photon dissociation of molecular ion have been considered (i) sequential two photon (STP) absorption and (ii) correlated two photon (CTP) absorption by the molecular ion. We compared the results for fidelity of spatial entanglement (FSE) between dissociated atom and ion for these two types of dissociation. In a previous study in our group [1] we have shown that when an atom interact with nonlocal mode of electromagnetic field (which has been derived field theoretically), simultaneous phase-correlated two pho1 ton absorption by the atom occurs within a very short time {\\delta}t << {\\omega} , where {\\omega} is the laser frequency, and the rate of this correlated two photon absorption is linear in intensity. This will happen when the photon flux in the interaction region is high i.e. laser intensity is higher than 10 10 W/cm 2 . In this work we have extended this formalism to study the correlated two photon dissociation of molecular ion and to explore the effect of correlation between two simultaneous photo-absorption processes on the fidelity for spatial entanglement of dissociated atom and ion. Dependence of fidelity for spatial entanglement on the photon frequency has been studied for both the STP and CTP dissociation, to show that photon frequency can be used as control parameter to achieve maximum fidelity. Saturation of fidelity with the increase in time at which fidelity was calculated shows the robustness of the processes considered here. A scheme for detection of spatial entanglement between ion and atom has been suggested.", "url": "https://arxiv.org/abs/2607.29556", "type": "理论", "summary": "我们通过氢分子离子H 2 + 的两个光子解离研究了解离原子和离子之间空间纠缠的保真度。已经考虑了分子离子的双光子解离的两个过程（i）连续双光子（STP）吸收和（ii）分子离子的相关双光子（CTP）吸收。我们比较了这两种离解类型的离解原子和离子之间的空间纠缠 (FSE) 保真度结果。在我们小组之前的一项研究中[1]，我们已经表明，当原子与电磁场的非局域模式（理论上已导出场）相互作用时，原子在很短的时间内同时发生相位相关的两个光子吸收，其中{\\omega}是激光频率，并且这种相关的两个光子吸收的速率在强度上是线性的。当相互作用区域中的光子通量较高时，即激光强度高于 10 10 W/cm 2 时，就会发生这种情况。\n\n在这项工作中，我们扩展了这种形式来研究分子离子的相关两个光子解离，并探索两个同时光吸收过程之间的相关性对解离原子和离子空间纠缠保真度的影响。针对 STP 和 CTP 解离，研究了空间纠缠保真度对光子频率的依赖性，以表明光子频率可以用作控制参数来实现最大保真度。随着保真度计算时间的增加，保真度饱和度显示了此处考虑的过程的稳健性。提出了一种检测离子和原子之间空间纠缠的方案。", "authors": [{"name": "Krishna Rai Dastidar"}], "featured_authors": [{"name": "Krishna Rai Dastidar"}], "author_count": 1}, {"id": "2607.29582", "category": "quant-ph", "title": "Quantum computing-based solver for interacting power grids", "abstract": "The proliferation of power electronics in multi-terminal transmission grids has increasingly led to harmonic distortions and dynamic instabilities. While Resonance Mode Analysis (RMA) provides deep insights into these system resonances, evaluating the critical modes of large-scale grids presents a severe computational bottleneck. Classical iterative techniques must continuously diagonalize massively high-dimensional, non-Hermitian admittance matrices across a wide frequency spectrum, a process that rapidly exhausts classical memory and processing limits. To overcome this scaling barrier, we propose a novel quantum-classical hybrid methodology that natively maps the transmission grid's admittance matrix onto a Quantum Processing Unit (QPU). Because the grid's matrix is non-Hermitian, standard quantum eigensolvers are insufficient; thus, we employ the Real Variance-based Variational Quantum Eigensolver (RVVQE) algorithm to accurately extract the complex eigenvalues that represent the system's modes. Validated against a standard 5-bus transmission system, the quantum-derived critical-resonance modal impedances demonstrate near-perfect alignment with the exact classical frequency responses. Crucially, by encoding the grid's state logarithmically into quantum memory, this methodology bypasses classical RAM limitations. The successful implementation of the RVVQE framework not only bridges the mathematical topologies of dissipative electrical grids and open quantum systems but also provides a profoundly scalable architecture capable of diagnosing resonance instabilities in massive, continental-scale networks that currently exceed classical computational boundaries.", "url": "https://arxiv.org/abs/2607.29582", "type": "理论+数值", "summary": "电力电子在多端输电网中的激增日益导致谐波畸变和动态不稳定。虽然谐振模式分析 (RMA) 可以深入了解这些系统谐振，但评估大规模网格的关键模式却存在严重的计算瓶颈。经典迭代技术必须在宽频谱上连续对大量高维非厄米导纳矩阵进行对角化，这一过程会迅速耗尽经典内存和处理限制。为了克服这种扩展障碍，我们提出了一种新颖的量子经典混合方法，该方法将传输网格的导纳矩阵本地映射到量子处理单元（QPU）上。由于网格矩阵是非厄米矩阵，标准量子本征求解器是不够的；因此，我们采用基于实方差的变分量子特征求解器（RVVQE）算法来准确提取代表系统模式的复杂特征值。\n\n通过标准 5 总线传输系统的验证，量子衍生的临界谐振模态阻抗表现出与精确的经典频率响应近乎完美的对齐。至关重要的是，通过将网格状态以对数方式编码到量子存储器中，这种方法绕过了经典 RAM 的限制。 RVVQE 框架的成功实施不仅弥合了耗散电网和开放量子系统的数学拓扑，而且还提供了一种高度可扩展的架构，能够诊断目前超出经典计算边界的大规模大陆规模网络中的共振不稳定性。", "authors": [{"name": "Ankit Kumar Das"}, {"name": "Durgesh Pandey"}, {"name": "P. Arumugam"}], "featured_authors": [{"name": "Ankit Kumar Das"}, {"name": "Durgesh Pandey"}, {"name": "P. Arumugam"}], "author_count": 3}, {"id": "2607.29623", "category": "quant-ph", "title": "Quantum geometric potential induced conformational transitions in elastic helical nanoribbons", "abstract": "We consider an {\\em elastic} helical nanoribbon that can take on various conformations, and study the effect of placing a quantum particle on its curved surface. Using a modified Canham-Helfrich model for the elastic energy, we write down the local elastic potential for the ribbon in terms of its bending rigidity, mean curvature $M$ and Gaussian curvature $K$. The Schrödinger equation of a particle confined to a {\\em rigid} curved surface is found using da Costa's formulation. It has a purely quantum geometric potential which depends on $M$ and $K$. The Schrödinger equation of a particle on an {\\em elastic } curved surface will therefore have a total potential comprising quantum and elastic potentials. We compute $M$ and $K$ for a helical ribbon and derive the total potential which depends on the conformation and is thus geometric in nature. Defining a dimensionless quantity $R_H$, we study the behavior of the total geometric potential as $R_H$ is varied. In the absence of an electron, the elastic potential is positive and has a single positive maximum for all conformations. Further, a binormal helical ribbon conformation has the lowest potential, while the normal ribbon has the highest, with those of the intermediate ribbons lying in between these. Intriguingly, when a quantum particle is placed on the elastic ribbon, above a certain critical value of $R_H$, the presence of the quantum geometric potential {\\em reverses} this order. But localized states for the particle are not supported. Only above a second critical value of $R_H$, localized states appear for all conformations. The injection of an electron on {\\it any} given conformation of the elastic ribbon will induce a conformational transition to the normal ribbon conformation.", "url": "https://arxiv.org/abs/2607.29623", "type": "理论", "summary": "我们考虑一种可以呈现各种构象的{\\em弹性}螺旋纳米带，并研究将量子粒子放置在其曲面上的效果。使用改进的 Canham-Helfrich 弹性能模型，我们根据带材的弯曲刚度、平均曲率 $M$ 和高斯曲率 $K$ 写出带材的局部弹性势。使用 da Costa 的公式可以找到限制在{\\em 刚性}曲面上的粒子的薛定谔方程。它具有纯粹的量子几何势，取决于 $M$ 和 $K$。因此，{\\em 弹性} 曲面上的粒子的薛定谔方程将具有包含量子势和弹性势的总势。我们计算螺旋带的 $M$ 和 $K$ 并得出取决于构象的总电势，因此本质上是几何电势。定义无量纲量 $R_H$，我们研究当 $R_H$ 变化时总几何势的行为。在没有电子的情况下，弹性势为正，并且对于所有构象都有一个正最大值。\n\n此外，双正常螺旋带构象具有最低的电势，而正常带具有最高的电势，中间带的电势位于它们之间。有趣的是，当量子粒子被放置在弹性带上，高于 $R_H$ 的某个临界值时，量子几何势的存在{\\em 反转}了这个顺序。但不支持粒子的局部状态。仅高于第二个临界值 $R_H$，所有构象都会出现局部状态。在弹性带的给定构象上注入电子将引起向正常带构象的构象转变。", "authors": [{"name": "Radha Balakrishnan"}, {"name": "Rossen Dandoloff"}, {"name": "Avadh Saxena"}], "featured_authors": [{"name": "Radha Balakrishnan"}, {"name": "Rossen Dandoloff"}, {"name": "Avadh Saxena"}], "author_count": 3}, {"id": "2607.29680", "category": "quant-ph", "title": "Spectrum Estimation is Almost as Hard as Tomography", "abstract": "We study the sample complexity of estimating and testing fundamental unitarily invariant properties of unknown quantum states; namely, the tasks of spectrum estimation, von Neumann entropy estimation, and rank-testing. For $d$-dimensional states, and for every $\\gamma>0$, we prove a sample complexity lower bound of $\\Omega(d^{2-\\gamma})$ for spectrum estimation to constant sorted total-variation error, entropy estimation to constant additive error, and rank-testing to constant trace distance. Our hard instances are constructed from sandwiched products of Haar-random projectors, suitably normalized using a novel technique that lets us derive explicit expressions for high-order tensor moments of the resultant states. These moments can be expressed as symmetric functions of Jucys--Murphy elements of the symmetric group algebra. To show that two such mixtures are indistinguishable, we analyze the log-likelihood ratio and perform moment-matching, i.e., we set its low-order Jucys--Murphy components to zero. Indistinguishability is then obtained by bounding an $f$-divergence through the high-order components; the non-zero high-order terms and concentration of functions of Haar-random unitaries also imply separations in typical spectra, entropies, and ranks, proving all our lower bounds.", "url": "https://arxiv.org/abs/2607.29680", "type": "理论", "summary": "我们研究估计和测试未知量子态的基本酉不变性质的样本复杂性；即谱估计、冯·诺依曼熵估计和秩检验的任务。对于 $d$ 维状态，对于每个 $\\gamma>0$，我们证明了 $\\Omega(d^{2-\\gamma})$ 的样本复杂度下界，用于常数排序总变差误差的谱估计、常数加性误差的熵估计以及常数跟踪距离的排名测试。我们的硬实例是由哈尔随机投影仪的夹层产品构建的，并使用一种新技术进行适当归一化，使我们能够导出结果状态的高阶张量矩的显式表达式。这些矩可以表示为对称群代数的 Jucys-Murphy 元素的对称函数。为了证明两个这样的混合物是无法区分的，我们分析了对数似然比并执行矩匹配，即将其低阶 Jucys-Murphy 分量设置为零。\n\n然后通过高阶分量限制 $f$ 散度来获得不可区分性；哈尔随机酉函数的非零高阶项和集中也意味着典型谱、熵和秩的分离，证明了我们所有的下界。", "authors": [{"name": "Marco Fanizza"}, {"name": "Ryan O'Donnell"}, {"name": "Chirag Wadhwa"}], "featured_authors": [{"name": "Marco Fanizza"}, {"name": "Ryan O'Donnell"}, {"name": "Chirag Wadhwa"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
