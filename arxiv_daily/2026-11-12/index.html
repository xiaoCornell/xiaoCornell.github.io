实用途径。", "authors": [{"name": "M. Emre Sahin"}, {"name": "Cenk Tüysüz"}, {"name": "David Galvin"}, {"name": "Oscar Wallis"}, {"name": "Alex Gregory"}, {"name": "Paul Edwards"}, {"name": "Christa Zoufal"}], "featured_authors": [{"name": "M. Emre Sahin"}, {"name": "Cenk Tüysüz"}, {"name": "David Galvin"}, {"name": "Alex Gregory"}, {"name": "Paul Edwards"}, {"name": "Christa Zoufal"}], "author_count": 7}, {"id": "2611.13111", "category": "quant-ph", "title": "FusionQ: A Generic and Optimal Decoding Framework for Ultra-Low-Latency Quantum Error Correction", "abstract": "Quantum error correction (QEC) decoding has traditionally been organized around fixed decoding instances: a monolithic space-time detector error model (DEM), or a predetermined temporal window, is handed to a backend decoder after enough syndrome data has arrived. This paper presents FusionQ, a fusion decoding framework that changes this paradigm by deriving local decoding tasks from the observed syndrome and then fusing their results into a single global correction. Instead of forcing every shot through the same global or windowed problem, FusionQ builds open-boundary local DEMs around fired detector clusters and expands the corresponding footprints only when a local optimum uses virtual boundary errors. FusionQ is generic in the decoder backend: the scheduler requires only a local solution and a boundary-use flag, so exact solvers, matching-style decoders on graphlike DEMs, and heuristic decoders can share the same runtime. We prove a compositional optimality theorem: with an exact minimum-weight local backend and boundary-free publication, fusing the published local decoding results yields a global most-likely error (MLE) solution of the original DEM. Our evaluation shows that, with an exact backend, FusionQ matches the monolithic MLE result on every shot. Across decoder backends, FusionQ substantially reduces decoding latency by overlapping local decoding with hardware syndrome acquisition.", "url": "https://arxiv.org/abs/2611.13111", "type": "理论+数值", "summary": "量子纠错（QEC）解码传统上是围绕固定解码实例进行组织的：在足够的校正子数据到达后，将单片时空检测器错误模型（DEM）或预定时间窗口交给后端解码器。本文提出了 FusionQ，这是一种融合解码框架，它通过从观察到的综合症中导出局部解码任务，然后将其结果融合到单个全局校正中来改变这种范式。 FusionQ 不是强制每次射击都通过相同的全局或窗口问题，而是围绕发射的探测器集群构建开放边界局部 DEM，并仅在局部最优使用虚拟边界误差时扩展相应的覆盖范围。 FusionQ 在解码器后端是通用的：调度程序只需要本地解决方案和边界使用标志，因此精确求解器、图形 DEM 上的匹配式解码器和启发式解码器可以共享相同的运行时。我们证明了组合最优性定理：通过精确的最小权重本地后端和无边界发布，融合发布的本地解码结果产生原始 DEM 的全局最可能误差 (MLE) 解。\n\n我们的评估表明，通过精确的后端，FusionQ 在每次拍摄时都能匹配整体 MLE 结果。在解码器后端，FusionQ 通过将本地解码与硬件综合症采集重叠来显着减少解码延迟。", "authors": [{"name": "Junyu Zhou"}, {"name": "Sean Garner"}, {"name": "Aarthi Sundaram"}, {"name": "Gushu Li"}, {"name": "Yue Wu"}], "featured_authors": [{"name": "Junyu Zhou"}, {"name": "Sean Garner"}, {"name": "Aarthi Sundaram"}, {"name": "Gushu Li"}, {"name": "Yue Wu"}], "author_count": 5}, {"id": "2611.13174", "category": "quant-ph", "title": "How wide must an eavesdropper be? Leakage of a toric-code logical bit to a strip and the Nishimori point", "abstract": "Fault-tolerant quantum computers hand pieces of each logical qubit to separate decoder modules and shared readout lines. How much does a piece reveal? We prove that for any region and any Pauli noise, including correlated noise, an observer's optimal advantage in learning a logical bit is exactly 1 - 2 P_fail, where P_fail is the failure probability of maximum-likelihood decoding confined to that region. Two lessons follow. Geometry, not noise, provides the protection: a region that misses a single column of the code learns exactly nothing at any noise level, while a region that spans the code is protected by noise only at impractical distances (d > 350 for one row at a 10^-3 flip rate). And width is a poor guide to risk: under i.i.d. noise a two-row strip learns exactly as little as one row, yet below threshold an eavesdropper needs a width growing only as ln d. Through the identity, the strip's operational threshold is the Nishimori point of the random-bond Ising model, and a Walsh-Hadamard transfer matrix up to width 16 locates it to within a few thousandths. On two IBM Heron processors (d = 3, 5), an emulated strip adversary shows the predicted jump at width three, and non-uniform qubit errors let a trained attacker profit from the second row that uniform noise makes useless. We turn these results into design rules for partitioned decoding and multiplexed readout. Code and data are included.", "url": "https://arxiv.org/abs/2611.13174", "type": "理论", "summary": "容错量子计算机将每个逻辑量子位的各个部分传递给单独的解码器模块和共享读出线。一件作品揭示了多少？我们证明，对于任何区域和任何泡利噪声（包括相关噪声），观察者在学习逻辑位时的最佳优势恰好是 1 - 2 P_fail，其中 P_fail 是仅限于该区域的最大似然解码的失败概率。接下来是两个教训。提供保护的是几何结构，而不是噪声：错过代码单列的区域在任何噪声水平下都不会学到任何东西，而跨越代码的区域仅在不切实际的距离（对于 10^-3 翻转率下的一行，d > 350）才受到噪声保护。宽度对于风险来说是一个糟糕的指导：在独立同分布下。两行条带学习到的噪声与一行的噪声一样少，但低于阈值，窃听者只需要宽度随 ln d 的增长而增长。通过恒等式，条带的操作阈值是随机键伊辛模型的西森点，宽度为 16 的 Walsh-Hadamard 传输矩阵将其定位在千分之几以内。\n\n在两个 IBM Heron 处理器 (d = 3, 5) 上，模拟的条带对手显示了宽度为 3 的预测跳跃，并且非均匀量子位错误让训练有素的攻击者可以从第二行中获利，而均匀噪声使第二行变得毫无用处。我们将这些结果转化为分区解码和多路复用读出的设计规则。包括代码和数据。", "authors": [{"name": "Konstantinos Karagiannis"}], "featured_authors": [{"name": "Konstantinos Karagiannis"}], "author_count": 1}, {"id": "2611.13221", "category": "quant-ph", "title": "Exceptional points in non-Markovian quantum-state diffusion: From coefficient dynamics to state signatures", "abstract": "An exceptional point of a memory-coefficient equation need not have the same signature in every quantum-state observable. We examine this relation within exact non-Markovian quantum-state diffusion (NMQSD), following the same operator closure from its coefficient dynamics to the non-Markovian master equation obtained by noise averaging. A finite homogeneous lift identifies the Jordan chains reached by the causal initialization, while state reconstruction determines which contributions survive in a specified readout. Two models expose the distinction. For common-bath qubits restricted to zero and one excitation, a noise-independent lowering-form $O$ operator gives a closed master equation. Every defective decaying mode transfers its full pole order to a suitable unconditional excitation--reference coherence. A known third-order configuration illustrates both a quadratic--exponential coherence and cancellation of its highest-order term in another quadrature. For a position-coupled oscillator in a fixed-photon-number optomechanical sector, the exact closure contains a scalar noise-history term. On the regular normalizable branch studied for bath decay rates below the oscillator frequency, two second-order coefficient blocks lead to a double pole in the conditional displacement response to the NMQSD noise history, at long preparation age and fixed lag. The purely algebraic coefficient tail cancels from the conditional Gaussian width. Complete noise averaging changes the master-equation coefficients and combines conditional width with the weighted spread of state centers. Together, the models show how causal preparation, state reconstruction, and averaging give coefficient exceptional points a precise, readout-dependent meaning.", "url": "https://arxiv.org/abs/2611.13221", "type": "理论", "summary": "记忆系数方程的异常点不需要在每个量子态可观察值中具有相同的签名。我们在精确的非马尔可夫量子态扩散（NMQSD）中检查这种关系，遵循从其系数动态到通过噪声平均获得的非马尔可夫主方程的相同算子闭包。有限齐次提升识别因果初始化所达到的乔丹链，而状态重建确定哪些贡献在指定的读出中保留。两个模型揭示了这种区别。对于仅限于零和一次激发的共浴量子位，与噪声无关的降低形式 $O$ 运算符给出了一个封闭的主方程。每个有缺陷的衰减模式都会将其全极阶转换为合适的无条件激励——参考相干性。已知的三阶配置说明了二次指数相干性以及其最高阶项在另一个正交中的抵消。对于固定光子数光机械部分中的位置耦合振荡器，精确闭包包含标量噪声历史项。\n\n在研究低于振荡器频率的浴槽衰减率的常规可归一化分支上，两个二阶系数块在长准备寿命和固定滞后下导致对 NMQSD 噪声历史的条件位移响应中出现双极点。纯代数系数尾部与条件高斯宽度相抵消。完全噪声平均改变了主方程系数，并将条件宽度与状态中心的加权分布相结合。这些模型共同展示了因果准备、状态重建和平均如何为系数异常点提供精确的、依赖于读数的含义。", "authors": [{"name": "Yusui Chen"}, {"name": "Hang Liu"}, {"name": "Kaiqi Xiong"}, {"name": "Quanzhen Ding"}, {"name": "Eric Guo"}], "featured_authors": [{"name": "Yusui Chen"}, {"name": "Hang Liu"}, {"name": "Kaiqi Xiong"}, {"name": "Quanzhen Ding"}, {"name": "Eric Guo"}], "author_count": 5}, {"id": "2611.13301", "category": "quant-ph", "title": "A Compiler for Fault Tolerant Quantum Computing", "abstract": "Fault-tolerant quantum computing (FTQC) needs compiler intermediate representations (IRs) that preserve error-correcting-code choices, syndrome information, and non-Clifford resource requirements through analysis, simulation, and hardware lowering. We report practical experience building FTQC, an open-source Multi-Level Intermediate Representation (MLIR) dialect that makes logical qubits, syndromes, magic states, and Pauli frames typed static single assignment (SSA) values. Its error-correction-aware type system, two-level lowering design, and IR-resident resource analysis provide one inspectable pipeline to Open Quantum Assembly Language~3 (OpenQASM~3), the Quantum Intermediate Representation (QIR), Stim, and IQM hardware. Case studies across three code families show that typed metadata makes code-specific decisions verifiable and retargetable: on the 20-qubit Pathfinder at Oak Ridge National Laboratory, decoding reduced logical readout error by 3.3 times. They also expose hidden architectural costs: for a three-qubit Quantum Fourier Transform (QFT-3), a magic-state factory requires five times the peak qubits of the encoded circuit. These experiences demonstrate a practical foundation for developing and evaluating fault-tolerant compiler transformations across software and hardware targets.", "url": "https://arxiv.org/abs/2611.13301", "type": "理论+数值", "summary": "容错量子计算 (FTQC) 需要编译器中间表示 (IR)，通过分析、模拟和硬件降低来保留纠错代码选择、综合症信息和非 Clifford 资源需求。我们报告了构建 FTQC 的实践经验，FTQC 是一种开源多级中间表示 (MLIR) 方言，可将逻辑量子位、综合症、魔法状态和泡利框架类型化为静态单赋值 (SSA) 值。其纠错感知类型系统、两级降低设计和 IR 驻留资源分析为开放量子汇编语言~3 (OpenQASM~3)、量子中间表示 (QIR)、Stim 和 IQM 硬件提供了一个可检查的管道。跨三个代码系列的案例研究表明，类型化元数据使特定于代码的决策可验证和可重定向：在橡树岭国家实验室的 20 量子位探路者上，解码将逻辑读出错误减少了 3.3 倍。他们还暴露了隐藏的架构成本：对于三量子位量子傅里叶变换（QFT-3），魔态工厂需要编码电路峰值量子位的五倍。\n\n这些经验为开发和评估跨软件和硬件目标的容错编译器转换奠定了实践基础。", "authors": [{"name": "Narasinga Rao Miniskar"}, {"name": "Elaine Wong"}, {"name": "Seyong Lee"}, {"name": "Vicente Leyton-Ortega"}, {"name": "Jeffrey S. Vetter"}, {"name": "Travis S. Humble"}], "featured_authors": [{"name": "Narasinga Rao Miniskar"}, {"name": "Elaine Wong"}, {"name": "Seyong Lee"}, {"name": "Vicente Leyton-Ortega"}, {"name": "Jeffrey S. Vetter"}, {"name": "Travis S. Humble"}], "author_count": 6}, {"id": "2611.13315", "category": "quant-ph", "title": "Early State Exclusion for $5\\times5$ Jacobi Matrices", "abstract": "In this paper, we present a problem that arose from quantum computing, when the quantum state to be transferred completely vanishes before the first occurrence of the perfect state transfer. It was posed as an open problem for 1D quantum chains with $n$ of qubits, where $n>4$ is an odd number. We present the solution for $n=5$. The proofs are accessible to students who studied trigonometry and calculus. As for the set-up the knowledge of eigentheory and inner products from linear algebra is needed.", "url": "https://arxiv.org/abs/2611.13315", "type": "理论", "summary": "在本文中，我们提出了一个由量子计算引起的问题，即要转移的量子态在第一次发生完美状态转移之前完全消失。它被提出为具有 $n$ 量子位的一维量子链的开放问题，其中 $n>4$ 是奇数。我们提出$n=5$ 的解决方案。学习三角学和微积分的学生可以使用这些证明。至于设置，需要线性代数的本征论和内积知识。", "authors": [{"name": "Jasmin G. Enriquez"}, {"name": "Anastasiia Minenkova"}], "featured_authors": [{"name": "Jasmin G. Enriquez"}, {"name": "Anastasiia Minenkova"}], "author_count": 2}, {"id": "2611.13320", "category": "quant-ph", "title": "The wave equation and two-electron atomic wavefunctions", "abstract": "Axisymmetric solutions of the classical wave equation in three spatial dimensions are shown to be in one-to-one correspondence to functions which annihilate the two-electron kinetic energy operator expressed in coordinates relative to a fixed nucleus.", "url": "https://arxiv.org/abs/2611.13320", "type": "理论", "summary": "三个空间维度中经典波动方程的轴对称解被证明与消除以相对于固定核的坐标表示的二电子动能算子的函数一一对应。", "authors": [{"name": "John Lekner"}], "featured_authors": [{"name": "John Lekner"}], "author_count": 1}, {"id": "2611.13373", "category": "quant-ph", "title": "PriorTilt: Decoding quantum LDPC codes with sparse perturbations of belief propagation priors", "abstract": "Although belief propagation (BP) is a widely adopted decoder for classical low-density parity-check (LDPC) codes, its accuracy is limited in the quantum setting. We introduce \\PriorTilt{}, a variant of BP obtained by selectively perturbing a small fraction of its prior log-likelihood ratios using offsets determined by recent posterior and outgoing-message statistics, while preserving the same message-passing rules. We compare \\PriorTilt{} with Relay-BP and beam search decoders for circuit-level decoding of three benchmark codes. \\PriorTilt{} achieves a lower logical error rate (LER) than both baselines at every tested data point. For the $[[144,12,12]]$ Gross code BB144 at noise rate $p=10^{-3}$, the LER reductions reach $4.3\\times$ relative to Relay-BP and $3.1\\times$ relative to the beam search decoder. At $p=10^{-3}$, \\PriorTilt{} has lower mean decoding times than Relay-BP on all three codes and achieves mean decoding speedups of approximately $2.6\\times$--$3.0\\times$ over the beam search decoder. For BB144 at $p=10^{-3}$, \\PriorTilt{} achieves an LER approximately $610\\times$ lower than the standard min-sum BP decoder with the same iteration budget, while perturbing fewer than $0.5\\%$ of its priors per round on average.", "url": "https://arxiv.org/abs/2611.13373", "type": "理论", "summary": "尽管置信传播（BP）是经典低密度奇偶校验（LDPC）码广泛采用的解码器，但其准确性在量子设置中受到限制。我们引入 \\PriorTilt{}，这是 BP 的一种变体，通过使用由最近的后验和传出消息统计数据确定的偏移量选择性地扰动其先验对数似然比的一小部分而获得，同时保留相同的消息传递规则。我们将 \\PriorTilt{} 与 Relay-BP 和波束搜索解码器进行比较，以对三个基准代码进行电路级解码。 \\PriorTilt{} 在每个测试数据点上实现了比两个基线更低的逻辑错误率 (LER)。对于噪声率为 $p=10^{-3}$ 的 $[[144,12,12]]$ 总代码 BB144，LER 相对于 Relay-BP 降低达到 $4.3\\times$，相对于波束搜索解码器达到 $3.1\\times$。在 $p=10^{-3}$ 时，\\PriorTilt{} 在所有三个代码上的平均解码时间均低于 Relay-BP，并且比波束搜索解码器实现约 $2.6\\times$--$3.0\\times$ 的平均解码加速。\n\n对于 $p=10^{-3}$ 的 BB144，\\PriorTilt{} 实现的 LER 比具有相同迭代预算的标准最小和 BP 解码器低大约 $610\\times$，同时平均每轮扰动不到 $0.5\\%$ 的先验。", "authors": [{"name": "Min Ye"}, {"name": "Nicolas Delfosse"}], "featured_authors": [{"name": "Min Ye"}, {"name": "Nicolas Delfosse"}], "author_count": 2}, {"id": "2611.13658", "category": "quant-ph", "title": "An Efficient Quantum Algorithm for Preparing Uniform Superpositions over Arbitrary Integer Intervals", "abstract": "We consider exact preparation of the uniform quantum state supported on an arbitrary nonempty interval of integer labels in an $n$-qubit register. For every $0\\leq a<a+M\\leq2^n$, we give an ancilla-free circuit using only one-qubit gates and singly controlled one-qubit gates. In the logical gate model specified in the paper, the direct construction has exact worst-case gate count $5n-9$ for $n\\geq3$; its exact maxima for $n=1$ and $n=2$ are $1$ and $3$, respectively. A worst-case lower bound of $\\Omega(n)$ establishes asymptotic optimality in the register width. In addition, the gate complexity admits an instance-dependent bound $O(\\log_2 M+\\epsilon)$, where $\\epsilon$ is an offset-dependent parameter defined in terms of binary Hamming weights. We also derive a reflected construction and a classical procedure that selects the lower-count exact circuit. The direct construction admits an $O(n)$ logical-depth upper bound. We also treat bitwise-XOR images of intervals and arithmetic progressions with power-of-two spacing.", "url": "https://arxiv.org/abs/2611.13658", "type": "理论+数值", "summary": "我们考虑在 $n$-qubit 寄存器中整数标签的任意非空区间上精确准备支持的统一量子态。对于每个 $0\\leq a<a+M\\leq2^n$，我们给出一个仅使用单量子位门和单独控制的单量子位门的无辅助电路。在论文中指定的逻辑门模型中，直接构造对于$n\\geq3$具有精确的最坏情况门数$5n-9$； $n=1$ 和 $n=2$ 的确切最大值分别为 $1$ 和 $3$。最坏情况下限 $\\Omega(n)$ 建立了寄存器宽度的渐近最优性。此外，门复杂度允许与实例相关的边界$O(\\log_2 M+\\epsilon)$，其中$\\epsilon$是根据二进制汉明权重定义的与偏移相关的参数。我们还推导了反射结构和选择较低计数精确电路的经典程序。直接构造允许 $O(n)$ 逻辑深度上限。我们还使用二次方间距来处理间隔和算术级数的按位异或图像。", "authors": [{"name": "Alok Shukla"}, {"name": "Prakash Vedula"}], "featured_authors": [{"name": "Alok Shukla"}, {"name": "Prakash Vedula"}], "author_count": 2}, {"id": "2611.13665", "category": "quant-ph", "title": "Observation of strong electric dipole-dipole interactions between two atoms", "abstract": "We have prepared pairs of atoms at densities exceeding $ 10^{16}/\\rm{cm}^3$ corresponding to $n\\lambdabar^3>10$ and studied how they interact with light. In this regime, the coherent part of the electric dipole-dipole interaction is larger than the dissipative part, and a single photon emission can transfer large momenta (larger than ten times the single photon recoil) to the atoms. For off-resonant laser light, the atoms are dressed with an electric dipole moment of $\\approx$ 1 Debye and interact coherently. This light-induced dipole-dipole interaction has been previously observed only in the far-field mean-field regime. For two atoms, the resonance is shifted by the two-body Lamb shift which is dominated by the near-field part of the dipolar interaction. Dipolar resonance shifts have been observed before only for many atoms interacting with the far-field part of the dipolar interaction. Our work sheds new light on photoassociation processes and paves the way for studying driven quantum systems with strong electric dipole-dipole interactions.", "url": "https://arxiv.org/abs/2611.13665", "type": "理论", "summary": "我们准备了密度超过 $10^{16}/\\rm{cm}^3$（相当于 $n\\lambdabar^3>10$）的原子对，并研究了它们如何与光相互作用。在这种情况下，电偶极子-偶极子相互作用的相干部分大于耗散部分，并且单光子发射可以将大动量（大于单光子反冲力的十倍）传递给原子。对于非共振激光，原子具有大约 1 德拜的电偶极矩，并且相干地相互作用。这种光诱导的偶极子-偶极子相互作用以前仅在远场平均场区域中观察到。对于两个原子，共振通过双体兰姆位移发生位移，该位移由偶极相互作用的近场部分主导。之前仅针对与偶极相互作用的远场部分相互作用的许多原子观察到偶极共振位移。我们的工作为光缔合过程提供了新的线索，并为研究具有强电偶极子相互作用的驱动量子系统铺平了道路。", "authors": [{"name": "Yu-Kun Lu"}, {"name": "Jiahao Lyu"}, {"name": "Wolfgang Ketterle"}], "featured_authors": [{"name": "Yu-Kun Lu"}, {"name": "Jiahao Lyu"}, {"name": "Wolfgang Ketterle"}], "author_count": 3}, {"id": "2611.13671", "category": "quant-ph", "title": "Quantum-Assisted Generative Anomaly Detection: A Dimension-Controlled Study of Latent Refinement", "abstract": "Anomaly-based malware detectors learn what benign files look like and flag deviations. Generative approaches to this problem can make use of a \"latent\" or \"prior\" data representation, which is often chosen to be a Gaussian distribution. We ask whether the choice of prior distribution matters, and whether one produced by quantum hardware behaves differently from a classical one. Building on SAGEGAN, a style-based detector trained only on benign data, we compare three latent distributions: the original 512-dimensional Gaussian, a 48-dimensional Gaussian, and a 48-dimensional distribution sampled from an ORCA Computing PT-2 photonic quantum processor. We then refine each trained model's frozen representation using greedy and reinforcement-learning methods. Across ten random seeds, the quantum-derived model shows richer internal structure with better effective rank and latent similarity. It also benefits most from refinement. Though final detection accuracy is similar to that of the refined Gaussian latent, these findings show differences in latent geometry and refinement behavior between the trained configurations.", "url": "https://arxiv.org/abs/2611.13671", "type": "理论", "summary": "基于异常的恶意软件检测器了解良性文件的外观并标记偏差。解决这个问题的生成方法可以利用“潜在”或“先验”数据表示，通常选择高斯分布。我们询问先验分布的选择是否重要，以及由量子硬件产生的先验分布的行为是否与经典分布不同。基于 SAGEGAN（一种仅对良性数据进行训练的基于样式的检测器），我们比较了三种潜在分布：原始 512 维高斯分布、48 维高斯分布以及从 ORCA 计算 PT-2 光子量子处理器采样的 48 维分布。然后，我们使用贪婪和强化学习方法细化每个训练模型的冻结表示。在十个随机种子中，量子衍生模型显示出更丰富的内部结构，具有更好的有效等级和潜在相似性。它也从细化中受益最多。尽管最终的检测精度与精化高斯潜伏的检测精度相似，但这些发现显示了训练配置之间潜伏几何和精化行为的差异。", "authors": [{"name": "Thesath Wijayasiri"}, {"name": "Omar Bacarreza"}, {"name": "William Clements"}, {"name": "Kar Wai Fok"}, {"name": "Vrizlynn L. L. Thing"}], "featured_authors": [{"name": "Thesath Wijayasiri"}, {"name": "Omar Bacarreza"}, {"name": "William Clements"}, {"name": "Kar Wai Fok"}, {"name": "Vrizlynn L. L. Thing"}], "author_count": 5}, {"id": "2611.13778", "category": "quant-ph", "title": "Polynomial Quantum Recurrent Channels for Matrix Inverse Actions: Deferred-Reset Dynamics and Chebyshev Filtering", "abstract": "We develop completely positive, trace-preserving polynomial recurrent channels for quantum solution-state preparation and derive fixed-point and time-varying tracking bounds. Across 2,880 synthetic configurations, resident Chebyshev recurrence improves accuracy-passing snapshot counts in 608 cases, ties in 2,271, and loses in one. A separate 360-scenario cost study shows that fresh recurrence is cheaper in all 184 jointly feasible scenarios (median resident-to-fresh cost ratio: 3.12), while resident recurrence uniquely satisfies accuracy requirements in 74 cases. At a logical noise rate of $10^-4$, neither recurrent method qualifies. Based on exact reduced-density simulations and assumed cost models, our results demonstrate conditional tracking advantages but no general end-to-end speedup or total-cost benefit.", "url": "https://arxiv.org/abs/2611.13778", "type": "理论+数值", "summary": "我们开发了完全正的、保迹多项式循环通道，用于量子解状态准备，并导出定点和时变跟踪边界。在 2,880 个合成配置中，驻留切比雪夫递归在 608 个案例中提高了准确度通过快照计数，在 2,271 个案例中平局，在 1 个案例中失败。一项单独的 360 场景成本研究表明，在所有 184 个联合可行场景中，新鲜复发的成本较低（中位居民与新鲜成本比率：3.12），而居民复发在 74 种情况下唯一满足准确性要求。在逻辑噪声率为 $10^-4$ 时，两种循环方法都不合格。基于精确的降低密度模拟和假设的成本模型，我们的结果展示了条件跟踪优势，但没有一般的端到端加速或总成本优势。", "authors": [{"name": "Vahid Tavakkoli"}, {"name": "Kabeh Mohsenzadegan"}, {"name": "Kyandoghere Kyamakya"}], "featured_authors": [{"name": "Vahid Tavakkoli"}, {"name": "Kabeh Mohsenzadegan"}, {"name": "Kyandoghere Kyamakya"}], "author_count": 3}, {"id": "2611.13796", "category": "quant-ph", "title": "Analog quantum approximate optimization algorithm for solving the weighted MaxCut problem on three-dimensional single-atom Rydberg array", "abstract": "We theoretically investigate an analog implementation of the quantum approximate optimization algorithm (QAOA) for the weighted maximum cut problem (MaxCut) problem. The protocol uses a three-dimensional array of individually trapped Rydberg atoms driven by globally addressed laser pulses, with site-dependent detunings applied near the Rydberg resonance. As benchmarks, we consider twenty randomly weighted 3-regular graphs with 12 vertices each. Problem weights are encoded directly in the interatomic interaction energies by choosing appropriate three-dimensional atom positions. We compare two parameter-optimization strategies: discretized quantum annealing and warm-start initialization using a graph neural network (GNN). The combined optimization strategy creates a portfolio that outperforms the Goemans-Williamson (GW) rounding almost in all instances in the noiseless case. We analyze the sampling statistics and the total pulse-time cost of both approaches. Finally, we emulate the performance of the optimized schedules on quantum trajectories using a realistic error model of the Aquila neutral-atom quantum processor.", "url": "https://arxiv.org/abs/2611.13796", "type": "理论+数值", "summary": "我们从理论上研究了加权最大切割问题 (MaxCut) 问题的量子近似优化算法 (QAOA) 的模拟实现。该协议使用由全局寻址激光脉冲驱动的单独捕获的里德伯原子的三维阵列，并在里德伯共振附近应用依赖于位点的失谐。作为基准，我们考虑 20 个随机加权的 3-正则图，每个图有 12 个顶点。通过选择适当的三维原子位置，问题权重直接编码在原子间相互作用能量中。我们比较了两种参数优化策略：离散量子退火和使用图神经网络（GNN）的热启动初始化。组合优化策略创建的投资组合几乎在无噪声情况下的所有情况下都优于 Goemans-Williamson (GW) 舍入。我们分析了两种方法的采样统计数据和总脉冲时间成本。最后，我们使用 Aquila 中性原子量子处理器的真实误差模型来模拟量子轨迹上优化调度的性能。", "authors": [{"name": "Junxi Chen"}, {"name": "I. I. Beterov"}], "featured_authors": [{"name": "Junxi Chen"}, {"name": "I. I. Beterov"}], "author_count": 2}, {"id": "2611.13934", "category": "quant-ph", "title": "Reservoir-induced Quantum Phase Transitions in spin ensembles", "abstract": "In this work, we present a comprehensive analysis of an open quantum system consisting of a collection of N two-level atoms in the thermodynamic limit coupled to bosonic reservoirs. Our results demonstrate that, when the system-bath interactions lacks a metastable minimum, as in the counterterm-free case, the system can undergo a quantum phase transition set by the reservoir structure rather than by coherent internal dynamics. Using exact quantum Langevin equations, valid even in the overdamped regime near criticality, where the loss rates can exceed the resonance frequency of the softening mode, we locate the critical point via the complex excitation spectrum and obtain closed-form reflection and transmission spectra that display the mode softening and an increasingly asymmetric lineshape near the transition.", "url": "https://arxiv.org/abs/2611.13934", "type": "理论", "summary": "在这项工作中，我们对一个开放量子系统进行了全面分析，该系统由热力学极限内的 N 个两能级原子与玻色子库耦合组成。我们的结果表明，当系统-浴相互作用缺乏亚稳态最小值时，如在无反项的情况下，系统可以经历由储层结构而不是相干内部动力学设定的量子相变。使用精确的量子朗之万方程，即使在接近临界点的过阻尼状态下也有效，其中损耗率可能超过软化模式的共振频率，我们通过复杂的激发光谱定位临界点，并获得封闭形式的反射和透射光谱，显示模式软化和过渡附近日益不对称的线形。", "authors": [{"name": "Giuseppe Musolino"}, {"name": "Daniele Lamberto"}, {"name": "Gabriele Orlando"}, {"name": "Omar Di Stefano"}, {"name": "Salvatore Savasta"}], "featured_authors": [{"name": "Giuseppe Musolino"}, {"name": "Daniele Lamberto"}, {"name": "Gabriele Orlando"}, {"name": "Omar Di Stefano"}, {"name": "Salvatore Savasta"}], "author_count": 5}, {"id": "2611.13981", "category": "quant-ph", "title": "Maximal Violation of Mermin Inequality for Commuting von Neumann Algebras and Multipartite Vacuum Entanglement in QFT", "abstract": "Summers and Werner proved that Bell inequalities are violated maximally and generically in the vacuum of a relativistic quantum field theory in [S. J. Summers and R. Werner, Commun. Math. Phys. 110 (1987), 247-259]. Their criterion concerns two-party case, that is, there are two algebras of quantum observables: one algebra and its commutant. In this case, the maximal CHSH value is converged to in every normal state exactly when the algebra is strongly stable. In the paper, we study the corresponding question for three and more mutually commuting von Neumann algebras. We focus on the multipartite Mermin inequalities instead of CHSH ones. For the tripartite Mermin functional we show that maximal violation in every normal state is equivalent to the existence of a common sequence of asymptotic GHZ stabilizers. Strong stability of each local factor is an necessary condition for maximal violation, and a joint embedding of an infinite GHZ tensor product is sufficient. Counterexamples show that strong stability and type III_1 of the individual algebras, even together with tripartite duality, do not suffice to arrive at the maximal violation. The results are also extended to n>=3 parties.", "url": "https://arxiv.org/abs/2611.13981", "type": "理论", "summary": "Summers 和 Werner 在 [S. J. Summers 和 R. Werner，《Commun》。数学。物理。 110（1987），247-259]。他们的标准涉及两方情况，即存在两个量子可观测量的代数：一个代数及其交换子。在这种情况下，当代数强稳定时，最大 CHSH 值就收敛到每个正常状态。在本文中，我们研究了三个及更多互通冯诺依曼代数的相应问题。我们关注的是多部分 Mermin 不等式而不是 CHSH 不等式。对于三重 Mermin 泛函，我们证明每个正常状态下的最大违背相当于渐近 GHZ 稳定器的共同序列的存在。每个局部因子的强稳定性是最大违规的必要条件，并且无限GHZ张量积的联合嵌入就足够了。反例表明，个体代数的强稳定性和 III_1 型，即使与三重对偶性一起，也不足以达到最大破坏。结果也扩展到 n>=3 方。", "authors": [{"name": "Kan He"}, {"name": "Jinchuan Hou"}, {"name": "Shuyuan Yang"}, {"name": "Bingke Zheng"}], "featured_authors": [{"name": "Kan He"}, {"name": "Jinchuan Hou"}, {"name": "Shuyuan Yang"}, {"name": "Bingke Zheng"}], "author_count": 4}, {"id": "2611.13998", "category": "quant-ph", "title": "Pool-free, residual-triggered ansatz growth for variational imaginary-time evolution: when a fixed operator order beats adaptive screening", "abstract": "Adaptive variational algorithms such as ADAPT-VQE and AVQITE screen an operator pool at every growth step, and ADAPT-VQE also re-optimizes all parameters. We study a pool-free alternative for variational imaginary-time evolution (VITE). The layers are fixed in advance by nested commutators of the Hamiltonian, grouped by symmetry and particle number, and the next layer is appended when the relative McLachlan residual exceeds a threshold. On five non-integrable systems (the mixed-field Ising chain and tori, and stretched H$_4$), this dynamic VITE reaches a relative error of $10^{-4}$ with 1.6-5.4 times fewer circuits than the cheapest of six to eight adaptive variants, including single-Pauli-string and qubit-excitation pools and batched ADAPT-VQE. On the chain the advantage persists from 8 to 16 sites. Screening and re-optimization account for most of the adaptive methods' cost. On the spin models, a longitudinal-field scan shows that the advantage requires broken integrability, which makes adaptive screening expensive. The advantage is lost on transverse-field Ising models, at tight targets (relative error $10^{-6}$) and where the schedule front-loads weak layers.", "url": "https://arxiv.org/abs/2611.13998", "type": "理论+数值", "summary": "ADAPT-VQE 和 AVQITE 等自适应变分算法会在每个增长步骤筛选算子池，并且 ADAPT-VQE 还会重新优化所有参数。我们研究了变分虚时间演化（VITE）的无池替代方案。这些层预先由哈密顿量的嵌套交换子固定，按对称性和粒子数分组，当相对麦克拉克伦残差超过阈值时，附加下一层。在五个不可积系统（混合场 Ising 链和 tori，以及拉伸 H$_4$）上，这种动态 VITE 达到了 $10^{-4}$ 的相对误差，其电路数量比最便宜的六到八个自适应变体（包括单保利弦和量子位激励池以及批量 ADAPT-VQE）少了 1.6-5.4 倍。在链上，8 到 16 个站点的优势仍然存在。筛选和重新优化占自适应方法成本的大部分。在自旋模型上，纵向场扫描表明，这种优势需要破坏可积性，这使得自适应筛选变得昂贵。在横向场 Ising 模型上，在严格目标（相对误差 $10^{-6}$）以及调度前加载弱层的情况下，优势消失了。", "authors": [{"name": "Yu-Hao Chen"}, {"name": "Renata Wong"}], "featured_authors": [{"name": "Yu-Hao Chen"}, {"name": "Renata Wong"}], "author_count": 2}, {"id": "2611.14006", "category": "quant-ph", "title": "Normalizing Flows for Classical Simulation of Quantum Circuits in Phase Space", "abstract": "We present a novel framework to learn a representation of quantum circuits based on the phase space formulation of many-body systems. Given that $N$-qubit states can be represented as probability distributions on a smooth $2N$-dimensional manifold, we show how unitary gates can be parameterized as normalizing flows between these distributions, opening a new avenue for quantum circuit simulation using generative models. We evaluate our method on three common families of quantum circuits, and show that its accuracy exceeds that of current state-of-the-art neural network methods for large system sizes.", "url": "https://arxiv.org/abs/2611.14006", "type": "理论+数值", "summary": "我们提出了一种新颖的框架来学习基于多体系统的相空间公式的量子电路的表示。鉴于 $N$ 量子位状态可以表示为平滑 $2N$ 维流形上的概率分布，我们展示了如何将酉门参数化为这些分布之间的归一化流，为使用生成模型进行量子电路模拟开辟了一条新途径。我们在三个常见的量子电路系列上评估了我们的方法，并表明其准确性超过了当前最先进的大型系统规模的神经网络方法。", "authors": [{"name": "Edward Jiang"}, {"name": "Timothy Heightman"}, {"name": "Marcin Płodzień"}], "featured_authors": [{"name": "Edward Jiang"}, {"name": "Timothy Heightman"}, {"name": "Marcin Płodzień"}], "author_count": 3}, {"id": "2611.14023", "category": "quant-ph", "title": "PINNverse meets Jordan--Wigner: learning the Hamiltonian of long spin chains", "abstract": "Inverse physics-informed neural networks (PINNverse) learn the parameters of a quantum Hamiltonian from measured expectation values, but the network output grows as $4^N$ with the number of qubits $N$. We show that, for spin chains with nearest-neighbor exchange interactions, the Jordan-Wigner transformation removes this exponential cost: the dynamics closes on an $N\\times N$ one-body density matrix, so the network needs only $N^2$ outputs and the data are local observables measured in five global settings. Parasitic $ZZ$ couplings (crosstalk) are included through a time-dependent Hartree--Fock closure. With synthetic data, the same network first solves the equation of motion and then recovers the Hamiltonian parameters of chains of up to $50$ qubits, with couplings learned to better than $0.1\\%$. Errors in the local frequencies of long chains are removed by a direct least-squares fit started from the network estimate.", "url": "https://arxiv.org/abs/2611.14023", "type": "理论+数值", "summary": "逆物理信息神经网络 (PINNverse) 从测量的期望值中学习量子哈密顿量的参数，但网络输出随着量子位数量 $N$ 的增加而增长 $4^N$。我们表明，对于具有最近邻交换相互作用的自旋链，Jordan-Wigner 变换消除了这种指数成本：动力学在 $N\\times N$ 单体密度矩阵上闭合，因此网络仅需要 $N^2$ 输出，并且数据是在五个全局设置中测量的局部可观测值。寄生 $ZZ$ 耦合（串扰）通过时间相关的 Hartree--Fock 闭包包含在内。利用合成数据，同一网络首先求解运动方程，然后恢复高达 50$ 量子位的链的哈密顿参数，耦合学习效果优于 $0.1\\%$。通过从网络估计开始的直接最小二乘拟合来消除长链的局部频率中的误差。", "authors": [{"name": "Gubio G De Lima"}], "featured_authors": [{"name": "Gubio G De Lima"}], "author_count": 1}, {"id": "2611.14044", "category": "quant-ph", "title": "CV-TF-QKD", "abstract": "We introduce a continuous-variable version of twin-field quantum key distribution, using independent Gaussian-modulated coherent states and an untrusted single-photon relay. Full-record reconciliation and a binary phase-disclosure protocol achieve nearly equal asymptotic key rates against collective attacks. At fixed weak input-referred excess noise per arm, both rates per relay use scale as $\\sqrt{\\eta}$, where $\\eta$ is the end-to-end transmissivity. For phase disclosure, we establish composable security against general coherent attacks using a bounded test of preparation intensities and sign-parity complementarity. For specified apparatus parameters, finite-key calculations incorporating detector inefficiency, dark counts, phase fluctuations, and reference overhead predict rates exceeding the pure-loss and matched thermal-loss repeaterless bounds. These results extend the twin-field advantage to Gaussian-modulated continuous-variable quantum cryptography.", "url": "https://arxiv.org/abs/2611.14044", "type": "理论+数值", "summary": "我们引入了双场量子密钥分布的连续变量版本，使用独立的高斯调制相干态和不可信的单光子中继。全记录协调和二进制阶段披露协议针对集体攻击实现了几乎相同的渐近密钥率。在每臂固定的弱输入参考过量噪声下，每个继电器的两个速率都使用 $\\sqrt{\\eta}$ 标度，其中 $\\eta$ 是端到端传输率。对于阶段披露，我们使用准备强度和符号奇偶互补性的有界测试来建立针对一般相干攻击的可组合安全性。对于指定的设备参数，结合探测器效率低下、暗计数、相位波动和参考开销的有限关键计算预测超出纯损耗和匹配热损耗无中继器界限的速率。这些结果将双场优势扩展到高斯调制连续变量量子密码学。", "authors": [{"name": "Stefano Pirandola"}], "featured_authors": [{"name": "Stefano Pirandola"}], "author_count": 1}, {"id": "2611.14142", "category": "quant-ph", "title": "Multiparticle entanglement in a time-dependent electron--ion--photon system", "abstract": "Photoionization provides a natural setting for entanglement transfer in the time domain: an outgoing electron can become entangled with the residual ion, while subsequent spontaneous emission may transfer these correlations to an emitted photon. We quantify the entanglement dynamics of the composite electron--ion--photon system using the von Neumann entropy of the one-versus-rest bipartitions, showing that the initially entangled electron--ion system evolves through a genuinely multiparticle-entangled state before approaching an entangled electron--photon state. Logarithmic negativity further resolves the pairwise entanglement, revealing in particular transient ion--photon entanglement. Further, its enhanced sensitivity to weakly populated Schmidt modes additionally exposes high-dimensional entanglement associated with the photon-energy continuum.", "url": "https://arxiv.org/abs/2611.14142", "type": "理论+数值", "summary": "光电离为时域中的纠缠转移提供了自然的设置：传出的电子可以与残留离子纠缠，而随后的自发发射可以将这些相关性转移到发射的光子。我们使用一对一二分的冯诺依曼熵来量化复合电子-离子-光子系统的纠缠动力学，表明最初纠缠的电子-离子系统在接近纠缠电子-光子状态之前通过真正的多粒子纠缠态演化。对数负性进一步解决了成对纠缠，特别揭示了瞬态离子-光子纠缠。此外，它对弱分布施密特模式的增强敏感性还暴露了与光子能量连续体相关的高维纠缠。", "authors": [{"name": "Axel Stenquist"}, {"name": "Jan Marcus Dahlström"}], "featured_authors": [{"name": "Axel Stenquist"}, {"name": "Jan Marcus Dahlström"}], "author_count": 2}, {"id": "2611.14180", "category": "quant-ph", "title": "Quantum-Informed Graph Decomposition", "abstract": "The Quantum Approximate Optimization Algorithm (QAOA) is a near-term quantum algorithm for solving combinatorial optimization problems, but its accuracy and resource requirements may scale poorly with problem size or structure, reducing its utility in practice. Approaches such as the Graph Decomposition for Optimization Algorithm (GDOA) seek to address this by iteratively reducing an input problem until it reaches a size where it can be solved using QAOA while maintaining the same optimal solution. This algorithm, however, requires solving integer programs that have exponentially many variables, and can result in suboptimal solutions, as the integer programs may contain slack terms. In this work, we propose a heuristic called the Quantum Enhanced Graph Decomposition (QEGD) algorithm. Its novelty lies in its use of QAOA as a subroutine for sparsifying a graph through local vertex-merging. The algorithm, when used to sparsify MaxCut problems that are then solved using QAOA, achieves higher approximation ratios across all tested graphs than GDOA for random 5-regular and 6-regular graphs. We then compare the time-to-solution and approximation ratio of QEGD to other QAOA variants a collection of Erdös-Rényi graphs. QEGD has higher approximation ratios on average than QAOA$^2$ and ParaQAOA on all tested graphs. It also results in higher average approximation ratios than DC-QAOA on sparse Erdös-Rényi graphs and comparable average approximation ratio on denser Erdös-Rényi graphs. However, its average wall-clock time is between 0.4\\% and 5\\% of the average DC-QAOA wall-clock time.", "url": "https://arxiv.org/abs/2611.14180", "type": "数值", "summary": "量子近似优化算法（QAOA）是一种用于解决组合优化问题的近期量子算法，但其准确性和资源需求可能会随着问题规模或结构的变化而变化，从而降低其在实践中的效用。诸如图分解优化算法 (GDOA) 之类的方法试图通过迭代地减少输入问题来解决这个问题，直到它达到可以使用 QAOA 解决的大小，同时保持相同的最佳解决方案。然而，该算法需要求解具有指数级多个变量的整数程序，并且可能导致次优解，因为整数程序可能包含松弛项。在这项工作中，我们提出了一种称为量子增强图分解（QEGD）算法的启发式算法。它的新颖之处在于使用 QAOA 作为通过局部顶点合并来稀疏图的子例程。该算法在用于稀疏 MaxCut 问题（然后使用 QAOA 解决）时，对于随机 5 正则图和 6 正则图，在所有测试图上实现了比 GDOA 更高的近似率。\n\n然后，我们将 QEGD 的求解时间和近似率与其他 QAOA 变体（Erdös-Rényi 图的集合）进行比较。在所有测试图上，QEGD 的平均近似率高于 QAOA$^2$ 和 ParaQAOA。它还在稀疏 Erdös-Rényi 图上产生比 DC-QAOA 更高的平均逼近比，在更密集的 Erdös-Rényi 图上产生类似的平均逼近比。然而，其平均挂钟时间介于平均 DC-QAOA 挂钟时间的 0.4% 到 5% 之间。", "authors": [{"name": "Matthew Brunet"}, {"name": "Leah Prepchuk"}, {"name": "Rebekah Herrman"}], "featured_authors": [{"name": "Matthew Brunet"}, {"name": "Leah Prepchuk"}, {"name": "Rebekah Herrman"}], "author_count": 3}, {"id": "2611.14182", "category": "quant-ph", "title": "Quantum-Assisted Counterfactual Regret Minimization for Bounded-Payoff Imperfect-Information Games", "abstract": "Imperfect-information games with a graded-reward structure present significant computational challenges for equilibrium computation, since the payoff expectations must be estimated across exponentially large strategy spaces. Counterfactual Regret Minimization over the years has proven effective for approximating Nash equilibria, but Monte Carlo variants create a large overhead of sampling costs when the counterfactual values are estimated from sampled game-tree trajectories. We propose a novel Quantum-Assisted Counterfactual Regret Minimization, a framework that uses Quantum Amplitude Estimation to reduce the computational complexity of the regret updates in bounded-payoff imperfect-information games, while preserving the convergence of its classical counterpart. We give a theoretical analysis of the resulting exploitability bound, discuss NISQ-compatible amplitude-estimation variants, the structure of their resource requirements, and outline what is needed to validate the potential advantage empirically.", "url": "https://arxiv.org/abs/2611.14182", "type": "理论+数值", "summary": "具有分级奖励结构的不完美信息博弈对均衡计算提出了重大的计算挑战，因为必须在指数级大的策略空间中估计收益期望。多年来，反事实遗憾最小化已被证明对于近似纳什均衡是有效的，但是当从采样的博弈树轨迹估计反事实值时，蒙特卡洛变体会产生大量的采样成本开销。我们提出了一种新颖的量子辅助反事实遗憾最小化，该框架使用量子振幅估计来降低有界回报不完美信息游戏中遗憾更新的计算复杂性，同时保持其经典对应物的收敛性。我们对由此产生的可利用性界限进行了理论分析，讨论了 NISQ 兼容的幅度估计变体、其资源需求的结构，并概述了从经验上验证潜在优势所需的内容。", "authors": [{"name": "Gabriel Maresch"}, {"name": "Erik Schulze"}, {"name": "Jnan Yalla"}], "featured_authors": [{"name": "Gabriel Maresch"}, {"name": "Erik Schulze"}, {"name": "Jnan Yalla"}], "author_count": 3}, {"id": "2611.14188", "category": "quant-ph", "title": "Low-energy spectral-window truncation for compact U(1) lattice gauge theory", "abstract": "We prove a nonasymptotic electric-flux truncation bound for the entire vacuum-relative low-energy window of the original pure compact $U(1)$ lattice Hamiltonian. On a three-dimensional periodic cubic lattice with $N\\geq3$ sites per direction at $\\theta=0$, in the gauge-invariant zero-global-flux sector, the factorial-squared tail-norm estimate holds for every normalized vector in the window, without physical eigenvalue-isolation, window-edge gap, or nondegeneracy assumptions and without a window-dimension factor. It controls finite-time hard-wall evolution from the normalized projection of the same initial state. An analytic finite-volume strong-coupling example in this model certifies a nonvacuum band and an order-one plaquette signal change preserved by a specified finite cutoff. The same estimate yields precision-dependent sufficient cutoffs, an alternative linear isometric encoding by polar decomposition for reference-entangled inputs, and local electric-square readout bounds. At fixed positive bare coupling, physical volume, window width, and duration, cutoffs scaling as $\\beta\\log N/\\log\\log N$ with $\\beta>2$ make state and bounded-readout truncation errors vanish under lattice refinement.", "url": "https://arxiv.org/abs/2611.14188", "type": "理论", "summary": "我们证明了原始纯紧致 $U(1)$ 晶格哈密顿量的整个真空相对低能窗口的非渐近电通量截断界限。在 $\\theta=0$ 处每个方向有 $N\\geq3$ 位点的三维周期立方晶格上，在规范不变的零全局通量扇区中，阶乘平方尾范数估计适用于窗口中的每个归一化向量，没有物理特征值隔离、窗口边缘间隙或非简并假设，也没有窗口维度因子。它控制来自相同初始状态的归一化投影的有限时间硬墙演化。该模型中的解析有限体积强耦合示例证明了由指定的有限截止值保留的非真空带和一阶斑块信号变化。相同的估计产生依赖于精度的足够截止、通过参考纠缠输入的极分解的替代线性等距编码以及局部电平方读出界限。\n\n在固定的正裸耦合、物理体积、窗口宽度和持续时间下，截止缩放为 $\\beta\\log N/\\log\\log N$ 且 $\\beta>2$ 使得状态和有界读出截断误差在晶格细化下消失。", "authors": [{"name": "Yi Liang"}], "featured_authors": [{"name": "Yi Liang"}], "author_count": 1}, {"id": "2611.14214", "category": "quant-ph", "title": "Classical phase unwrapping enables large-time-step unitary quantum Krylov subspace diagonalization", "abstract": "For computing molecular energies on early fault-tolerant hardware, unitary quantum Krylov subspace diagonalization (UQKSD) avoids both the deep circuits of quantum phase estimation and the Pauli-term sampling of variational methods by extracting the energies from a projected real-time propagator. At a small time step $\\tau$, nearly linearly dependent Krylov vectors make the overlap matrix ill-conditioned. Our tests at fixed total evolution time show that additional Krylov vectors then add no accuracy, while the thresholded energy becomes increasingly sensitive to the choice of cutoff. A larger time step improves the conditioning and reduces the Krylov dimension $M$ needed for a target accuracy, but the energies are then known only modulo $2\\pi/\\tau$. We present Classical Unwrapping for Resolving Eigenvalues (CURE-QKSD), a classical post-processing method that leaves the UQKSD circuits and generalized eigenvalue problem unchanged and recovers the missing multiples of $2\\pi/\\tau$ from phase-consistency landscapes of one or, when needed, two UQKSD runs. In noiseless tests on six molecules with 12--20 qubits, all 28 targeted energies are recovered in their aliased regimes with final errors of at most $1.1\\times10^{-7}$~Ha. Under Gaussian noise with $\\sigma=10^{-4}$, the median error of the ground or first excited state reaches chemical accuracy at large aliased time steps with $M=20$--$65$, whereas uncorrected principal-branch energies are off by $0.7$--$115$~Ha. CURE-QKSD therefore makes aliased time steps usable for UQKSD calculations with smaller, better-conditioned Krylov bases.", "url": "https://arxiv.org/abs/2611.14214", "type": "数值", "summary": "为了在早期容错硬件上计算分子能量，酉量子 Krylov 子空间对角化 (UQKSD) 通过从投影实时传播器提取能量，避免了量子相位估计的深层电路和变分方法的泡利项采样。在小时间步 $\\tau$ 处，几乎线性相关的 Krylov 向量使重叠矩阵病态。我们在固定总进化时间下的测试表明，额外的克雷洛夫向量不会增加准确性，而阈值能量对截止的选择变得越来越敏感。较大的时间步长可以改善调节并减少目标精度所需的 Krylov 维数 $M$，但能量只能以 $2\\pi/\\tau$ 为模。我们提出了求解特征值的经典展开（CURE-QKSD），这是一种经典的后处理方法，它使 UQKSD 电路和广义特征值问题保持不变，并从一次或两次 UQKSD 运行的相位一致性景观中恢复 $2\\pi/\\tau$ 缺失的倍数。\n\n在对具有 12--20 个量子位的 6 个分子进行的无噪声测试中，所有 28 个目标能量都在其别名状态下恢复，最终误差最多为 $1.1\\times10^{-7}$~Ha。在 $\\sigma=10^{-4}$ 的高斯噪声下，基态或第一激发态的中值误差在 $M=20$--$65$ 的大混叠时间步长处达到化学精度，而未校正的主枝能量则偏离 $0.7$--$115$~Ha。因此，CURE-QKSD 使别名时间步可用于具有更小、条件更好的 Krylov 基的 UQKSD 计算。", "authors": [{"name": "Tushar Kumar Jain"}, {"name": "Rahul Maitra"}, {"name": "Nicholas J. Mayhall"}], "featured_authors": [{"name": "Tushar Kumar Jain"}, {"name": "Rahul Maitra"}, {"name": "Nicholas J. Mayhall"}], "author_count": 3}, {"id": "2611.14339", "category": "quant-ph", "title": "Dynamical Casimir emission from Floquet-driven Landau polaritons: Gauge invariance forbids a superradiant phase transition", "abstract": "Ultrastrong light--matter coupling of linear systems, such as Landau polaritons formed by a two-dimensional electron gas in a terahertz cavity, is described by the bosonic Hopfield model, and gauge invariance forbids a superradiant phase transition (SRPT). Modulating the magnetic field alone has been predicted to enhance the cycle-averaged coupling and induce a Floquet SRPT. We develop an exact theory of periodically driven Landau polaritons. Including the electric field induced by the modulated flux (Faraday's law), the problem reduces exactly, by Kohn's theorem, to the electronic center-of-mass mode coupled to the cavity, whose Hamiltonian is a sum of squares at every instant. A theorem of Krein then guarantees stability to all orders above a computable drive frequency, the Krein frequency, for which we give a self-contained proof. Below it, the system is stable except within resonance tongues where the drive creates pairs from the vacuum, the dynamical Casimir effect. At high drive frequency the electrons experience the mean field plus a ponderomotive trap (the Fock--Darwin problem), not an enhanced coupling. A gauge theorem excludes a Floquet photon condensate for any band structure, including Kane nonparabolicity, for which we derive a generalized Thomas--Reiche--Kuhn (TRK) sum rule. The predicted transition arises from averaging the coupling in a fixed Landau-level basis, which yields an effective model that violates the TRK sum rule; under driving, gauge invariance also requires the induced Faraday field. The rule to modulate and average the minimal-coupling Hamiltonian, not the parameters of its projection, applies to any linear, minimally coupled system. Instead of an SRPT, magnetic modulation produces dynamical Casimir emission: Faraday-driven polariton--magnetoplasmon pairs at low threshold, and two-color photon pairs with up to 5--10~dB of two-mode squeezing.", "url": "https://arxiv.org/abs/2611.14339", "type": "理论", "summary": "线性系统的超强光-物质耦合，例如太赫兹腔中二维电子气形成的朗道极化子，由玻色霍普菲尔德模型描述，并且规范不变性禁止超辐射相变（SRPT）。据预测，单独调制磁场可以增强循环平均耦合并引发 Floquet SRPT。我们开发了周期性驱动朗道极化子的精确理论。包括调制通量（法拉第定律）感应的电场，根据科恩定理，问题精确地简化为耦合到腔的电子质心模式，其哈密顿量是每个时刻的平方和。 Kerin 定理保证了所有高于可计算驱动频率（即 Kerin 频率）的阶次的稳定性，对此我们给出了独立的证明。在它之下，除了在共振舌内，系统是稳定的，在共振舌内，驱动器从真空中产生对，即动态卡西米尔效应。在高驱动频率下，电子经历平均场加上有质动力陷阱（福克-达尔文问题），而不是增强耦合。\n\n规范定理排除了任何能带结构的 Floquet 光子凝聚，包括凯恩非抛物线性，为此我们推导出广义的 Thomas-Reiche-Kuhn (TRK) 求和规则。预测的转变是通过在固定的朗道级基础上对耦合进行平均而产生的，这会产生一个违反 TRK 求和规则的有效模型；在驱动下，规范不变性也需要感应法拉第场。调制和平均最小耦合哈密顿量的规则，而不是其投影的参数，适用于任何线性、最小耦合系统。磁调制代替 SRPT，产生动态卡西米尔发射：法拉第驱动的极化子 - 低阈值的磁等离子对，以及具有高达 5--10~dB 的双模压缩的双色光子对。", "authors": [{"name": "S. Hughes"}], "featured_authors": [{"name": "S. Hughes"}], "author_count": 1}, {"id": "2611.14358", "category": "quant-ph", "title": "High-Speed Control of a Fluxonium Qubit via Picosecond Pulses from Josephson Digital Circuits", "abstract": "We develop a control strategy for fluxonium qubits based on picosecond single-flux-quantum (SFQ) pulses generated by Josephson digital circuits. A major challenge is that SFQ protocols originally designed for transmon control become inefficient for low-frequency fluxonium. In this regime, the asymmetry of flux and charge couplings leads either to excessive leakage or excessively long gate times. We show that this limitation can be overcome by two complementary protocols. The first protocol employs high-frequency SFQ pulse packets applied through the flux channel, offering a simple, analytically transparent, and robust approach for high-fidelity single-qubit control. The second protocol combines phase-shifted flux and charge pulse sequences to enhance the resonant drive and reduce the gate duration. Multilevel simulations demonstrate single-qubit gate fidelities above $99.99\\%$; the simpler protocol remains robust under moderate variations of qubit parameters and flux bias, while the combined protocol preserves high fidelity while substantially accelerating the gate. These results establish SFQ-based cryogenic control as a realistic route to fast, accurate, and scalable manipulation of fluxonium qubits.", "url": "https://arxiv.org/abs/2611.14358", "type": "理论+数值", "summary": "我们开发了一种基于约瑟夫森数字电路生成的皮秒单通量量子 (SFQ) 脉冲的 Fluxium 量子位控制策略。一个主要挑战是，最初为传输控制而设计的 SFQ 协议对于低频 Fluxium 来说变得低效。在这种情况下，磁通和电荷耦合的不对称会导致泄漏过多或栅极时间过长。我们证明这种限制可以通过两种互补协议来克服。第一个协议采用通过通量通道施加的高频 SFQ 脉冲包，为高保真单量子位控制提供简单、分析透明且稳健的方法。第二个协议结合了相移磁通和电荷脉冲序列，以增强谐振驱动并减少栅极持续时间。多级模拟证明单量子位门保真度高于 $99.99\\%$；更简单的协议在量子位参数和通量偏差的适度变化下仍然保持鲁棒性，而组合协议在大幅加速门的同时保持高保真度。\n\n这些结果确立了基于 SFQ 的低温控制作为快速、准确和可扩展地操纵 Fluxium 量子位的现实途径。", "authors": [{"name": "M. V. Bastrakova"}, {"name": "D. S. Pashin"}, {"name": "V. A. Vozhakov"}, {"name": "N. V. Klenov"}, {"name": "I. I. Soloviev"}], "featured_authors": [{"name": "M. V. Bastrakova"}, {"name": "D. S. Pashin"}, {"name": "V. A. Vozhakov"}, {"name": "N. V. Klenov"}, {"name": "I. I. Soloviev"}], "author_count": 5}, {"id": "2611.14368", "category": "quant-ph", "title": "Invariance can prevent overfitting and shortcut learning in Quantum Neural Networks", "abstract": "Many image classification tasks have labels that are unchanged by rotations and reflections. Equivariant quantum neural networks incorporate such symmetries by design, but the specific benefit of symmetry is difficult to isolate. Equivariant quantum circuits are usually compared with architectures that also differ in gates, structure or size. Here, we investigate the role of invariance in a controlled setting, classifying images whose labels are invariant under the dihedral group $D_4$. We compare four eight-qubit models with identical encoding, circuit structure and number of trainable parameters, and equivalent dynamical Lie algebras, and benchmark invariant implementations against non-invariant ones in terms of generalization error, robustness to shortcut learning and resilience to a realistic noise model. On four binary tasks, including MNIST and two scientific data sets of galaxies and red blood cells, the invariant models trained on a few tens of images show better generalization than non-invariant ones. Invariance also makes the models immune to orientation shortcuts: when trained with a class-dependent corner watermark, the non-invariant models learn the watermark and often drop to chance level when it is moved. We show that the gain in accuracy of invariant models persists also under a realistic noise model.", "url": "https://arxiv.org/abs/2611.14368", "type": "理论", "summary": "许多图像分类任务的标签不会因旋转和反射而改变。等变量子神经网络在设计上就包含了这种对称性，但对称性的具体好处很难分离。等变量子电路通常与门、结构或尺寸也不同的体系结构进行比较。在这里，我们研究了受控设置中不变性的作用，对二面体组 $D_4$ 下标签不变的图像进行分类。我们比较了具有相同编码、电路结构和可训练参数数量的四个八量子位模型，以及等效的动态李代数，并在泛化误差、快捷学习的鲁棒性和对现实噪声模型的弹性方面对不变实现与非不变实现进行了基准测试。在包括 MNIST 和两个星系和红细胞科学数据集在内的四个二元任务中，在数十张图像上训练的不变模型比非不变模型表现出更好的泛化能力。\n\n不变性还使模型不受方向捷径的影响：当使用依赖于类的角水印进行训练时，非不变模型会学习水印，并且在移动时通常会下降到机会水平。我们表明，在现实噪声模型下，不变模型的准确性仍然保持不变。", "authors": [{"name": "Giuseppe D'Ambruoso"}, {"name": "Giovanni Gramegna"}, {"name": "Domenico Pomarico"}, {"name": "Giuseppe Magnifico"}, {"name": "Cosmo Lupo"}], "featured_authors": [{"name": "Giuseppe D'Ambruoso"}, {"name": "Giovanni Gramegna"}, {"name": "Domenico Pomarico"}, {"name": "Giuseppe Magnifico"}, {"name": "Cosmo Lupo"}], "author_count": 5}, {"id": "2611.14376", "category": "quant-ph", "title": "Operational limits of reference renewal for retained quantum-service results", "abstract": "We implement reference renewal to reconsider retained physical quantum-service results under a prespecified protocol. Twelve transitions retained six results each; ten completed renewal, eight met the prespecified endpoint, and five succeeded using retained results alone. The exact one-sided p=0.0546875 does not establish the recovery hypothesis. Incomplete references, binding failures and sequential waits expose operational limits. Offline reconstruction recovers decisions from preserved counts. Retrospective binding-plus-oracle checking accepts all 60 usable-transition results without renewal. With the exact oracle also supplying calibration scores, the study does not demonstrate incremental numerical-correctness utility of renewal.", "url": "https://arxiv.org/abs/2611.14376", "type": "数值", "summary": "我们实施参考更新，以重新考虑在预先指定的协议下保留的物理量子服务结果。十二次转换每次保留六个结果； 10 名完成了更新，8 名达到了预定终点，5 名仅使用保留结果取得了成功。确切的单边 p=0.0546875 并不能建立恢复假设。不完整的引用、绑定失败和顺序等待暴露了操作限制。离线重建从保留的计数中恢复决策。回顾性绑定加预言机检查接受所有 60 个可用转换结果，无需更新。由于精确的预言机还提供校准分数，因此该研究并未证明更新的增量数值正确性效用。", "authors": [{"name": "Roberto Fernández-Barrios"}, {"name": "Iker Pastor-López"}, {"name": "Amaia Pikatza-Huerga"}, {"name": "Pablo García Bringas"}], "featured_authors": [{"name": "Roberto Fernández-Barrios"}, {"name": "Iker Pastor-López"}, {"name": "Amaia Pikatza-Huerga"}, {"name": "Pablo García Bringas"}], "author_count": 4}, {"id": "2611.14406", "category": "quant-ph", "title": "Multidimensional Quantum Block Turbo Codes", "abstract": "The theory of turbo iterative decoding was brought into the quantum coding framework through the development of quantum serial turbo codes and quantum block turbo codes. In this paper, we present a theory for multidimensional quantum block turbo codes, a turbo decoding technique for multi layer product codes. We describe its algorithm and simulate the performance for the 3D case on a depolarizing channel.", "url": "https://arxiv.org/abs/2611.14406", "type": "理论+数值", "summary": "通过量子串行Turbo码和量子块Turbo码的发展，Turbo迭代译码理论被引入到量子编码框架中。在本文中，我们提出了多维量子块 Turbo 码的理论，这是一种用于多层乘积码的 Turbo 解码技术。我们描述了它的算法并模拟了去偏振通道上 3D 情况的性能。", "authors": [{"name": "Khaled Jebari"}, {"name": "Luiz Anet Neto"}, {"name": "Ramesh Pyndiah"}, {"name": "Jean-Louis de Bougrenet de la Tocnaye"}], "featured_authors": [{"name": "Khaled Jebari"}, {"name": "Luiz Anet Neto"}, {"name": "Ramesh Pyndiah"}, {"name": "Jean-Louis de Bougrenet de la Tocnaye"}], "author_count": 4}, {"id": "2611.14422", "category": "quant-ph", "title": "The energetic cost of loading classical data in quantum computers", "abstract": "Quantum algorithms for machine learning, chemistry, and cryptanalysis often assume coherent access to classical data at negligible physical cost. We instead treat data loading as a hardware process and quantify the dynamic energetic cost of a quantum random access memory (QRAM) query on a superconducting processor. Using the metric-noise-resource framework, we relate query fidelity and power to gate duration, relative two-qubit drive strength, and the distribution of attenuation across a multi-stage refrigerator, while accounting for thermal photons and gate errors. We analyze the linear-depth multiplexer and the noise-resilient bucket-brigade architectures, adapting the latter to a native superconducting gate set and refining its fidelity analysis using the fully decomposed gate schedule. For a representative bucket-brigade QRAM query with a $12$-qubit address register we obtain a query fidelity of $0.969$. The query consumes $3.51\\times10^{-4}\\,\\mathrm{J}$ of dynamic energy, corresponding to an average dynamic power of $4.38\\,\\mathrm{W}$ and a peak of $64.4\\,\\mathrm{W}$. Our optimization shows that, at fixed target fidelity, the operating point and attenuation profile can change the average power by a factor of two or more.", "url": "https://arxiv.org/abs/2611.14422", "type": "数值", "summary": "用于机器学习、化学和密码分析的量子算法通常假设以可忽略的物理成本对经典数据进行一致访问。相反，我们将数据加载视为硬件过程，并量化超导处理器上量子随机存取存储器 (QRAM) 查询的动态能量成本。使用度量噪声资源框架，我们将查询保真度和功率与门持续时间、相对两量子位驱动强度以及多级制冷机上的衰减分布联系起来，同时考虑热光子和门错误。我们分析了线性深度多路复用器和抗噪声桶旅架构，使后者适应本地超导门组，并使用完全分解的门调度细化其保真度分析。对于具有 12 美元量子位地址寄存器的代表性桶旅 QRAM 查询，我们获得的查询保真度为 0.969 美元。该查询消耗 $3.51\\times10^{-4}\\,\\mathrm{J}$ 的动态能量，对应于平均动态功率 $4.38\\,\\mathrm{W}$ 和峰值 $64.4\\,\\mathrm{W}$。\n\n我们的优化表明，在固定目标保真度下，工作点和衰减曲线可以将平均功率改变两倍或更多。", "authors": [{"name": "Joao F. Doriguello"}, {"name": "Alessandro Luongo"}, {"name": "Harshit Verma"}], "featured_authors": [{"name": "Joao F. Doriguello"}, {"name": "Alessandro Luongo"}, {"name": "Harshit Verma"}], "author_count": 3}, {"id": "2611.14461", "category": "quant-ph", "title": "Finite-Key Readiness and Authentication-Key Replenishment in QKD-Assisted UAV Edge Computing", "abstract": "A service that needs fresh quantum keys must wait for key release, and may be denied it, before protected computation starts. We quantify this cost for a trusted stationary UAV serving two ground gateways, each obtaining its keys from one finite-key decoy-state BB84 attempt with parameters fixed in advance. A count-level Monte Carlo model, reproduced by a semi-analytic model, links key acceptance to protected upload, computation, and download, including failed attempts and hover energy. At 26~dB effective optical loss, with authentication hashing at its proxy-benchmarked, near-zero cost, fresh keys raise the 95th-percentile completion time of both tasks from 10.37 to 28.65~s; hover energy grows in proportion. The scalar rate models evaluated here miss the deadline limit on the block size. The pulse budget lies in a window bounded below by authentication-key replenishment and above by the deadline; for a fixed source, channel, and acceptance model, the authentication debit shifts the floor, whereas hashing cost does not. At a 35-s deadline the largest tested loss with a non-empty window is 27~dB at 1\\% misalignment and 22~dB at 2\\%; at 3\\% no tested setting has one. Conditional on the assumed acquisition probability, the selected configurations meet this deadline with simultaneous lower confidence bounds of 96.9--97.3\\% on held-out trials, at 26~dB and at 18--20~dB with 2\\% misalignment. A high-cost stress reference that charges hashing in full narrows the window and lowers these loss limits to 26 and 20~dB at the reference processing capacity. A small rise in error rate or loss pushes the deadline probability well below its target and drains authentication keys, while the protocol's security parameter is unchanged.", "url": "https://arxiv.org/abs/2611.14461", "type": "理论+数值", "summary": "在受保护的计算开始之前，需要新量子密钥的服务必须等待密钥释放，并且可能会被拒绝。我们量化了为两个地面网关提供服务的可信固定无人机的成本，每个网关从一次有限密钥诱饵状态 BB84 尝试中获取其密钥，并预先固定参数。由半解析模型再现的计数级蒙特卡罗模型将密钥接受与受保护的上传、计算和下载联系起来，包括失败的尝试和悬停能量。在 26dB 有效光损耗下，以代理基准进行身份验证散列，成本接近于零，新密钥将两项任务的 95% 完成时间从 10.37 秒提高到 28.65 秒；悬停能量成比例增长。这里评估的标量速率模型错过了块大小的最后期限限制。脉冲预算位于一个窗口内，该窗口的边界以下是身份验证密钥补充，上面的边界是最后期限；对于固定来源、渠道和接受模型，身份验证借方会改变底线，而哈希成本则不会。在 35 秒期限内，非空窗口的最大测试损耗在 1\\% 失准时为 27~dB，在 2\\% 失准时为 22~dB；在 3\\% 时，没有经过测试的设置。\n\n以假定的捕获概率为条件，所选配置满足此最后期限，在 26~dB 和 18--20~dB 且 2% 错位的情况下，在保留试验中同时置信下限为 96.9--97.3\\%。完全收费散列的高成本压力参考缩小了窗口，并将参考处理能力下的这些损耗限制降低到 26 和 20~dB。错误率或丢失的小幅上升会使截止概率远低于其目标，并耗尽身份验证密钥，而协议的安全参数却保持不变。", "authors": [{"name": "Dang H. Le"}, {"name": "Ban Q. Tran"}, {"name": "Susan Mengel"}], "featured_authors": [{"name": "Dang H. Le"}, {"name": "Ban Q. Tran"}, {"name": "Susan Mengel"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
