  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);

    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }

    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2611.12946", "category": "cond-mat", "title": "Goldstone-Mediated Chiral Superconductivity in Self-Doped Electron Crystals", "abstract": "Motivated by the observation of superconductivity in rhombohedral graphene in the proximity of electronic crystalline phases, we study the possibility of pairing mediated by electronic phonons. We focus on the vicinity of the phase boundary between trivial and topological electron crystals, where self-doping generically gives rise to a small Fermi sea of carriers with Dirac dispersion. We compute the Goldstone phonon spectra of the self-doped crystal (SDC) using a self-consistent approach, and subsequently derive the effective electronic-phonon-mediated interaction between itinerant carriers at the Fermi surface. Remarkably, we find that the Coulomb repulsion can be overscreened by the Goldstone phonons, leading to a chiral topological superconductor with an unpaired Majorana edge mode. Our conclusions are robust across the $\\lambda$-jellium model and a simplified model of rhombohedral graphene, and we propose characteristic non-linear I-V signals as a test of our prediction. More generally, our results outline an intriguing route for unconventional superconductivity where both electronic correlations and topology play key roles.", "url": "https://arxiv.org/abs/2611.12946", "type": "理论", "summary": "受电子晶相附近菱面体石墨烯超导性观察的启发，我们研究了电子声子介导的配对的可能性。我们关注平凡电子晶体和拓扑电子晶体之间的相界附近，其中自掺杂通常会产生具有狄拉克色散的小型费米载流子海。我们使用自洽方法计算了自掺杂晶体（SDC）的戈德斯通声子谱，随后推导了费米表面流动载流子之间有效的电子声子介导的相互作用。值得注意的是，我们发现库仑斥力可以被戈德斯通声子过度屏蔽，从而产生具有不成对的马约拉纳边缘模式的手性拓扑超导体。我们的结论在 $\\lambda$-jellium 模型和菱面体石墨烯的简化模型中都是稳健的，并且我们提出特征非线性 I-V 信号作为我们预测的测试。更一般地说，我们的结果概述了非常规超导的有趣途径，其中电子关联和拓扑都发挥着关键作用。", "authors": [{"name": "Shuchen Zhang"}, {"name": "Zhihuan Dong"}, {"name": "Zhaoyu Han"}, {"name": "Shubhayu Chatterjee"}], "featured_authors": [{"name": "Shuchen Zhang"}, {"name": "Zhihuan Dong"}, {"name": "Zhaoyu Han"}, {"name": "Shubhayu Chatterjee"}], "author_count": 4}, {"id": "2611.12947", "category": "cond-mat", "title": "Borrowed Planckian dissipation in magic-angle twisted graphene", "abstract": "In strange metals, the ratio of the coefficients producing signature linear-in-$T$ resistivity and the logarithmic specific heat is free of the coupling between the electrons and whatever scatters them. In the materials studied so far that coupling is fixed by chemistry. Magic-angle twisted trilayer graphene provides a dial with a displacement field $D$ that breaks the mirror symmetry separating a light Dirac cone from the flat bands, and the Dirac carriers borrow the Planckian self-energy of the flat band with a weight proportional to $D^2+D_0^2$. Resistance curves taken at eight fields are consistent with the field acting on the scattering rate rather than on the number of carriers. The slope in temperature follows $a(1+D^2/D_0^2)$ without the quartic term that a depleting Dirac pocket adds, and the elastic part varies by less than 5\\% between 0.20 and 0.30~V/nm while the inelastic part grows 2.5-fold up to 0.38~V/nm. The thermally averaged Kubo formula favors flat-band weight placed symmetrically about the Fermi level over a single level. Borrowed dissipation keeps the bath exponent and transport prefactor of the flat band's own electrons but carries exactly twice their entropy per unit of borrowed coupling whenever the bath has dynamics of its own, so the field-differential ratio is $2\\pi^3/21\\zeta(3)\\approx2.46$ for a conformal flat band and, in a numerical search, at most 2.73 for monotonic bath spectra without a high-energy rate floor. The discriminating test is the entropy measured in steps of $D$.", "url": "https://arxiv.org/abs/2611.12947", "type": "理论+数值", "summary": "在奇怪的金属中，产生特征性 T$ 线性电阻率和对数比热的系数之比不受电子与散射它们的任何物质之间的耦合影响。在迄今为止研究的材料中，耦合是通过化学固定的。魔角扭曲三层石墨烯提供了一个带有位移场 $D$ 的表盘，该位移场打破了将光狄拉克锥体与平带分开的镜面对称性，并且狄拉克载流子借用了平带的普朗克自能，其重量与 $D^2+D_0^2$ 成比例。在八个场上取得的电阻曲线与作用于散射率而不是载流子数量的场一致。温度斜率遵循 $a(1+D^2/D_0^2)$，没有耗尽狄拉克口袋添加的四次项，弹性部分在 0.20 和 0.30~V/nm 之间变化小于 5\\%，而非弹性部分则增长 2.5 倍，达到 0.38~V/nm。热平均 Kubo 公式有利于将平带权重放置在单个能级上关于费米能级对称的位置。\n\n借来的耗散保留了平带自身电子的浴指数和输运先因子，但每当浴具有其自身的动力学时，每单位借用耦合的熵恰好是其两倍，因此对于共形平带，场微分比为 $2\\pi^3/21\\zeta(3)\\approx2.46$，在数值搜索中，对于没有高能率下限的单调浴光谱，场微分比最多为 2.73。判别测试是以 $D$ 为步长测量的熵。", "authors": [{"name": "Dino Škrgić"}, {"name": "Dejan Stojkovic"}], "featured_authors": [{"name": "Dino Škrgić"}, {"name": "Dejan Stojkovic"}], "author_count": 2}, {"id": "2611.13032", "category": "cond-mat", "title": "Universal Fold Caustics in Anharmonic Matter-wave Lenses", "abstract": "Caustics provide a universal connection between classical ray focusing and structured wave patterns. We theoretically investigate this connection in non-linear matter waves focused by a short-duration anharmonic lens acting on a Bose-Einstein condensate. A semi-classical description shows how the leading cubic aberration transforms the harmonic focal point into a fold caustic, whose local wave field is described by an Airy canonical integral. Three-dimensional Gross-Pitaevskii simulations show that mean-field interactions modify the near-focus density and longitudinal momentum distribution, producing a secondary momentum-space feature absent from the non-interacting evolution. We quantify the information about the effective interaction strength carried by the $1D$ distribution using classical Fisher information and maximum-likelihood estimation. We obtain a relative uncertainty of $2.7\\times10^{-3}$ for a sample of $10^5$ detected points along $z$. These results establish a framework for studying interaction-driven departures from single-particle caustic universality and promote matter-wave lenses as a sensitive probe of mean-field interactions.", "url": "https://arxiv.org/abs/2611.13032", "type": "理论+数值", "summary": "焦散提供了经典射线聚焦和结构化波形之间的通用连接。我们从理论上研究了作用在玻色-爱因斯坦凝聚态上的短时非谐透镜聚焦的非线性物质波中的这种联系。半经典描述显示了主导立方像差如何将谐波焦点转换为折叠焦散，其局部波场由艾里正则积分描述。三维 Gross-Pitaevskii 模拟表明，平均场相互作用改变了近焦点密度和纵向动量分布，产生了非相互作用演化中不存在的次级动量空间特征。我们使用经典费舍尔信息和最大似然估计来量化 $1D$ 分布所携带的有效相互作用强度的信息。对于沿 $z$ 检测到的 $10^5$ 个点的样本，我们获得 $2.7\\times10^{-3}$ 的相对不确定性。这些结果建立了一个框架，用于研究相互作用驱动的单粒子腐蚀性普遍性的偏离，并促进物质波透镜作为平均场相互作用的敏感探针。", "authors": [{"name": "Joachim Guyomard"}, {"name": "Julia Pahl"}, {"name": "Ernst Rasel"}, {"name": "Naceur Gaaloul"}], "featured_authors": [{"name": "Joachim Guyomard"}, {"name": "Julia Pahl"}, {"name": "Ernst Rasel"}, {"name": "Naceur Gaaloul"}], "author_count": 4}, {"id": "2611.13081", "category": "cond-mat", "title": "Planckian Charge Equilibration in Fast Scramblers", "abstract": "The Planckian time, $\\tau_{\\rm Pl}=\\hbar/(k_BT)$, is conjectured to set a lower limit on thermal relaxation times in strongly interacting quantum matter. Rigorous bounds limit both how rapidly quantum information can scramble and how soon hydrodynamics can emerge, yet the relation between the scrambling and equilibration rates remains unclear. We address this question by studying the relaxation of a charge imbalance between two subsystems of the complex Sachdev--Ye--Kitaev model and its Yukawa generalizations, which exhibit maximal scrambling. In the low-temperature conformal regime, we find through a linear response analysis that the slowest decay of this imbalance occurs at rate $\\Gamma=2\\pi(2\\Delta-d)k_BT/\\hbar$, where $\\Delta$ is the fermion scaling dimension and $d=0,1$ is the spatial dimension. These results establish Planckian charge equilibration in maximally scrambling systems and show that maximal scrambling alone does not fix its dimensionless prefactor.", "url": "https://arxiv.org/abs/2611.13081", "type": "理论", "summary": "据推测，普朗克时间 $\\tau_{\\rm Pl}=\\hbar/(k_BT)$ 为强相互作用量子物质中的热弛豫时间设置了下限。严格的界限限制了量子信息的扰乱速度和流体动力学的出现速度，但扰乱率和平衡率之间的关系仍不清楚。我们通过研究复杂的 Sachdev--Ye--Kitaev 模型及其 Yukawa 推广的两个子系统之间电荷不平衡的松弛来解决这个问题，该模型表现出最大扰乱。在低温共形状态下，我们通过线性响应分析发现，这种不平衡的衰减最慢的速率为 $\\Gamma=2\\pi(2\\Delta-d)k_BT/\\hbar$，其中 $\\Delta$ 是费米子标度维度，$d=0,1$ 是空间维度。这些结果在最大扰乱系统中建立了普朗克电荷平衡，并表明单独的最大扰乱并不能修复其无量纲前因子。", "authors": [{"name": "Jaewon Kim"}, {"name": "Eduardo Fradkin"}], "featured_authors": [{"name": "Jaewon Kim"}, {"name": "Eduardo Fradkin"}], "author_count": 2}, {"id": "2611.13091", "category": "cond-mat", "title": "Chiral Superconductivity Indifferent to Parent Topology in the Square-Lattice Hofstadter-Hubbard Model", "abstract": "We study a $\\pi$-flux square-lattice $t$-$t'$ Hofstadter-Hubbard model proposed to be realizable in twisted moiré bilayers. By tuning $U$ and $t'$ at half filling, ground-state density-matrix renormalization group simulations (DMRG) and a parton analysis identify an integer quantum Hall (IQH) phase, a chiral spin liquid (CSL), and an antiferromagnet (AFM) in the phase diagram, while charge and spin fluctuations from finite-temperature determinant quantum Monte Carlo (DQMC) suggest a closing charge gap but an open spin gap at the IQH-CSL boundary, consistent with the topological criticality expected there. This model therefore produces a phase diagram hosting weakly correlated band topology (IQH), intrinsic topological order (CSL), and conventional symmetry breaking (AFM) side by side. Upon doping any of these three parent phases, a single chiral topological superconductor with spin Chern number $C_s=-2$ occupies nearly the entire phase diagram. DMRG, DQMC, and weak-coupling perturbation theory agree on its pairing symmetry. This shows that doping the topological band of our model robustly induces the same paired state throughout the phase diagram regardless of the character of the underlying correlated half-filled state and its magnetic fluctuations, whether an IQH, a spin liquid or a weakly fluctuating AFM.", "url": "https://arxiv.org/abs/2611.13091", "type": "理论+数值", "summary": "我们研究了 $\\pi$-通量方格 $t$-$t'$ Hofstadter-Hubbard 模型，该模型建议在扭曲莫尔双层中实现。通过在半填充时调整 $U$ 和 $t'$，基态密度矩阵重整化群模拟 (DMRG) 和部分子分析识别出相图中的整数量子霍尔 (IQH) 相、手性自旋液体 (CSL) 和反铁磁体 (AFM)，而有限温度行列式量子蒙特卡罗 (DQMC) 的电荷和自旋涨落表明电荷能隙闭合，但 IQH-CSL 边界处存在开放的自旋能隙，与那里预期的拓扑临界性。因此，该模型会生成一个相图，其中并排包含弱相关能带拓扑 (IQH)、本征拓扑序 (CSL) 和传统对称破缺 (AFM)。在掺杂这三个母相中的任何一个后，具有自旋陈数 $C_s=-2$ 的单个手性拓扑超导体几乎占据了整个相图。 DMRG、DQMC 和弱耦合微扰理论都同意其配对对称性。\n\n这表明，无论底层相关半填充态的特征及其磁波动如何，无论是 IQH、自旋液体还是弱波动 AFM，掺杂我们模型的拓扑带都会在整个相图中稳健地诱导相同的配对态。", "authors": [{"name": "Jia-Xin Zhang"}, {"name": "Wen O. Wang"}, {"name": "Leon Balents"}, {"name": "Lucile Savary"}, {"name": "D. N. Sheng"}], "featured_authors": [{"name": "Jia-Xin Zhang"}, {"name": "Wen O. Wang"}, {"name": "Leon Balents"}, {"name": "Lucile Savary"}, {"name": "D. N. Sheng"}], "author_count": 5}, {"id": "2611.13101", "category": "cond-mat", "title": "Quantum Control Geometry as a Metric of Chaos", "abstract": "Quantum-chaotic systems share the same coarse-grained features characteristic of random matrices, such as Wigner-Dyson level-spacing statistics, yet can exhibit strikingly different eigenstate structure and many-body dynamics, including relaxation, transport, scrambling, and entanglement growth. This raises the fundamental question of whether these finer-grained features probe genuinely distinct aspects of quantum chaos or, instead, reflect different manifestations of a common underlying structure---and whether such structure provides a meaningful basis for regarding one many-body quantum system as \"more chaotic\" than another. Here, we address this question by introducing a quantum geometric framework that quantifies the susceptibility of many-body eigenstates to physically allowed deformations of the Hamiltonian, as constrained by spatial locality, symmetries, and conservation laws. The resulting geometric susceptibility is quantitative, providing a metric of chaos beyond traditional binary diagnostics; intrinsic, as it depends on the manifold of allowed Hamiltonian deformations rather than on the way the system is probed; and unifying, as it directly connects eigenstate structure with dynamics. For canonical models of quantum chaos, we find that minimal geometric susceptibility, maximal eigenstate randomness, broad spectral response of local operators, and the suppression of nonhydrodynamic slow structure coalesce in the same region of Hamiltonian control space. This suggests that these seemingly distinct signatures of chaos are different manifestations of a common underlying geometric structure. Our framework provides a route toward understanding the limits of relaxation and scrambling under physical constraints; in applications, it offers a means to engineer strongly chaotic regimes in programmable quantum systems with restricted controls.", "url": "https://arxiv.org/abs/2611.13101", "type": "理论", "summary": "量子混沌系统具有与随机矩阵相同的粗粒度特征，例如维格纳-戴森能级间距统计，但可以表现出截然不同的本征态结构和多体动力学，包括弛豫、传输、加扰和纠缠增长。这就提出了一个基本问题：这些更细粒度的特征是否真正探测了量子混沌的不同方面，或者相反，反映了共同底层结构的不同表现——以及这种结构是否为将一个多体量子系统视为比另一个多体量子系统“更混乱”提供了有意义的基础。在这里，我们通过引入一个量子几何框架来解决这个问题，该框架量化了多体本征态对物理允许的哈密顿量变形的敏感性，受到空间局域性、对称性和守恒定律的约束。\n\n由此产生的几何敏感性是定量的，提供了超越传统二元诊断的混沌度量；内在的，因为它取决于允许的哈密顿变形的流形，而不是探测系统的方式；并且统一，因为它直接将本征态结构与动力学联系起来。对于量子混沌的规范模型，我们发现最小几何磁化率、最大本征态随机性、局部算子的宽谱响应以及非流体动力学慢结构的抑制在哈密顿控制空间的同一区域中合并。这表明这些看似不同的混沌特征是共同的基础几何结构的不同表现。我们的框架提供了一条了解物理约束下放松和加扰的极限的途径；在应用中，它提供了一种在控制受限的可编程量子系统中设计强混沌状态的方法。", "authors": [{"name": "Mahmoud Abdelshafy"}, {"name": "Joaquin F. Rodriguez-Nieva"}], "featured_authors": [{"name": "Mahmoud Abdelshafy"}, {"name": "Joaquin F. Rodriguez-Nieva"}], "author_count": 2}, {"id": "2611.13141", "category": "cond-mat", "title": "Dynamics of Rényi entanglement entropies and Eigenstate Thermalization", "abstract": "How is entanglement dynamics encoded in the eigenstates of the time-evolution operator? We address this question by focusing on Rényi entropy dynamics in deterministic chaotic Floquet models in arbitrary dimensions. Inspired by the eigenstate thermalization hypothesis (ETH), we employ spectral representations of reduced density matrix moments (purity and its higher-order generalizations) whose decay through spectral dephasing captures nonequilibrium entanglement growth. These representations closely resemble those governing local-observable dynamics, but involve eigenstates in a replicated Hilbert space and observables are replaced by subsystem permutation operators, such as the swap operator for Rényi-2. Focusing on Rényi-2, we combine exact random matrix theory calculations, established ETH results and numerical tests in 1D to formulate ETH-like ansätze for subsystem swap matrix elements in the replicated eigenbasis and their cross-correlations with initial-state overlap statistics. In the thermodynamic limit, purity dynamics is entirely determined by smooth slowly varying functions that emerge from such statistics, paralleling generalized ETH formulations in a single replica. In the limit of large subsystems, these functions exhibit a striking structural simplification: locality of the dynamics together with bulk spectral dephasing reduce their functional dependence to a single fundamental frequency. Our formalism provides a setting where ETH-like statements naturally coexist for both arbitrarily small and large subsystem sizes. We discuss extensions of our results to higher Rényi entropies. Beyond clarifying the spectral foundations of entanglement dynamics, these results lay some of the groundwork for future applications of spectral filter methods to the computation of Rényi evolution in deterministic systems.", "url": "https://arxiv.org/abs/2611.13141", "type": "理论+数值", "summary": "纠缠动力学如何编码在时间演化算子的​​本征态中？我们通过关注任意维度的确定性混沌 Floquet 模型中的 Rényi 熵动力学来解决这个问题。受本征态热化假说（ETH）的启发，我们采用约化密度矩阵矩（纯度及其高阶概括）的谱表示，其通过谱相移的衰减捕获非平衡纠缠增长。这些表示与控制局部可观测动力学的表示非常相似，但涉及复制的希尔伯特空间中的本征态，并且可观测值被子系统置换算子取代，例如 Rényi-2 的交换算子。针对 Rényi-2，我们结合精确的随机矩阵理论计算、建立的 ETH 结果和一维数值测试，为复制特征基中的子系统交换矩阵元素及其与初始状态重叠统计的互相关制定类似 ETH 的 ansätze。在热力学极限下，纯度动力学完全由此类统计数据中出现的平滑缓慢变化的函数决定，与单个副本中的广义 ETH 公式平行。\n\n在大型子系统的限制下，这些功能表现出惊人的结构简化：动力学的局部性与整体频谱相移一起减少了它们对单个基频的功能依赖性。我们的形式主义提供了一种设置，让类似 ETH 的语句可以自然地共存于任意大小的子系统中。我们讨论将我们的结果扩展到更高的 Rényi 熵。除了阐明纠缠动力学的谱基础之外，这些结果还为未来谱滤波器方法在确定性系统中 Rényi 演化计算中的应用奠定了一些基础。", "authors": [{"name": "Riccardo Senese"}, {"name": "Pasquale Calabrese"}], "featured_authors": [{"name": "Riccardo Senese"}, {"name": "Pasquale Calabrese"}], "author_count": 2}, {"id": "2611.13148", "category": "cond-mat", "title": "After equilibration", "abstract": "`Complexity' measures the exploration of state space by the dynamics at a finer level of detail than that required for the equilibration of standard extensive observables , and therefore continues to grow long after these observables have equilibrated. In a recent paper, we proposed that this exploration may be quantified by the large deviations attained over time, or, equivalently, by the time taken for `rare' observables -- such as, for example the exponential of the magnetization -- to equilibrate. It turns out that the evolution of complexity can then be naturally mapped onto a standard model of glassy dynamics, the \"Trap Model\" , which exhibits aging and effective temperatures. Under this mapping, the exploration of increasingly fine details of phase-space corresponds to the discovery of progressively deeper minima in the glassy model.", "url": "https://arxiv.org/abs/2611.13148", "type": "理论", "summary": "“复杂性”通过比标准广泛可观测量的平衡所需的更精细的细节水平来衡量状态空间的探索，因此在这些可观测量平衡后很长一段时间内继续增长。在最近的一篇论文中，我们提出，这种探索可以通过随时间推移获得的大偏差来量化，或者等效地，通过“稀有”可观测值（例如磁化指数）达到平衡所需的时间来量化。事实证明，复杂性的演变可以自然地映射到玻璃动力学的标准模型，即“陷阱模型”，该模型表现出老化和有效温度。在这种映射下，对相空间越来越精细的细节的探索对应于玻璃模型中逐渐更深的最小值的发现。", "authors": [{"name": "Jorge Kurchan"}], "featured_authors": [{"name": "Jorge Kurchan"}], "author_count": 1}, {"id": "2611.13157", "category": "cond-mat", "title": "Mimicking the zero-field Josephson diode effect with remanent magnetization and self-field", "abstract": "A Josephson junction whose critical current is larger in one direction than in the other is a diode. With a magnetized barrier, a junction can be a diode at zero applied field, and this is commonly attributed to an intrinsic Josephson diode effect, in which the magnetic barrier breaks time-reversal symmetry. Here we show that the same signatures arise from two ordinary ingredients: the magnetic field of the bias current in the electrodes and the remanent magnetization of the barrier. In cross-type Nb/Pd$_{89}$Ni$_{11}$/Nb junctions, the self-field displaces the interference patterns of the two current polarities in opposite directions. An in-plane remanent magnetization translates the pattern and brings the resulting asymmetry to zero field, where the junction mimics a nonvolatile diode with an asymmetry of 10 to 12% and a polarity set by the magnetization direction. Reversing the current or the field cannot distinguish this mimic from an intrinsic effect, but the wiring can: moving the current lead to the other arm of the electrode across the field reverses the self-field diode, in applied field and at zero field alike, whereas an intrinsic diode would be unchanged. This gives a simple dc test for Josephson diodes in the current-perpendicular-to-plane geometry.", "url": "https://arxiv.org/abs/2611.13157", "type": "理论", "summary": "一个方向上的临界电流大于另一个方向上的临界电流的约瑟夫森结是二极管。有了磁化势垒，结可以是零外加磁场下的二极管，这通常归因于固有的约瑟夫森二极管效应，其中磁势垒打破了时间反转对称性。在这里，我们表明相同的特征来自两个普通成分：电极中偏置电流的磁场和势垒的剩磁。在交叉型 Nb/Pd$_{89}$Ni$_{11}$/Nb 结中，自场使两个电流极性的干涉图案沿相反方向移动。面内剩磁会平移该图案，并将由此产生的不对称性降至零场，其中结模拟非易失性二极管，其不对称性为 10% 至 12%，极性由磁化方向设定。反转电流或场无法将这种模拟与固有效应区分开来，但接线可以：将电流引线移动到场上电极的另一臂，会反转自场二极管，在施加场和零场下都是如此，而本征二极管将保持不变。\n\n这为电流垂直于平面几何形状的约瑟夫森二极管提供了简单的直流测试。", "authors": [{"name": "Nathan Satchell"}, {"name": "Arjun Sapkota"}, {"name": "Pukar Sedai"}, {"name": "Kurt Lorenzen"}, {"name": "Juan Gomez"}], "featured_authors": [{"name": "Nathan Satchell"}, {"name": "Arjun Sapkota"}, {"name": "Pukar Sedai"}, {"name": "Kurt Lorenzen"}, {"name": "Juan Gomez"}], "author_count": 5}, {"id": "2611.13166", "category": "cond-mat", "title": "Study of the frustrated SU(3) Heisenberg chain with SU(3)-symmetric matrix product states", "abstract": "We study the SU(3) Heisenberg chain with nearest- and next-nearest-neighbor antiferromagnetic exchange $J_1$ and $J_2$. Field theory predicts that the trimerized valence-bond solid of this chain has a finite extent in $\\alpha=J_2/J_1$, followed by a gapless SU(3)$_1$ phase, but earlier numerical estimates of the upper boundary range from $\\alpha\\approx2.1$ (exact diagonalization) to $\\alpha\\approx3.8$ (iDMRG). We use the variational uniform matrix product state (VUMPS) algorithm with the full non-Abelian SU(3) symmetry imposed on the virtual bonds, reaching bond dimensions up to $D\\approx8000$, and locate the phase boundaries by finite-entanglement scaling. Resolving the transfer-matrix spectrum and the entanglement spectrum by SU(3) irreducible representation, we find that the trimerized phase extends to $\\alpha_{c2}\\gtrsim3.5$ and end below $\\alpha\\approx5$, excluding a boundary near $\\alpha\\approx2$. At larger $\\alpha$ our numerical analysis of the effective central charge is consistent with the predicted massless flow from SU(3)$_2$ to SU(3)$_1$.", "url": "https://arxiv.org/abs/2611.13166", "type": "理论+数值", "summary": "我们研究具有最近邻和次近邻反铁磁交换 $J_1$ 和 $J_2$ 的 SU(3) 海森堡链。场论预测该链的三聚化价键固体在 $\\alpha=J_2/J_1$ 中具有有限范围，随后是无间隙 SU(3)$_1$ 相，但早期数值估计的上边界范围从 $\\alpha\\approx2.1$ （精确对角化）到 $\\alpha\\approx3.8$ (iDMRG)。我们使用变分均匀矩阵积态 (VUMPS) 算法，对虚拟键施加完全非阿贝尔 SU(3) 对称性，键维达到 $D\\approx8000$，并通过有限纠缠缩放来定位相边界。通过 SU(3) 不可约表示解析转移矩阵谱和纠缠谱，我们发现三聚相延伸到 $\\alpha_{c2}\\gtrsim3.5$ 并结束于 $\\alpha\\approx5$ 以下，不包括 $\\alpha\\approx2$ 附近的边界。在较大的 $\\alpha$ 下，我们对有效中心电荷的数值分析与从 SU(3)$_2$ 到 SU(3)$_1$ 的预测无质量流一致。", "authors": [{"name": "O. R. Hryniv"}, {"name": "I. V. Lukin"}, {"name": "A. G. Sotnikov"}], "featured_authors": [{"name": "O. R. Hryniv"}, {"name": "I. V. Lukin"}, {"name": "A. G. Sotnikov"}], "author_count": 3}, {"id": "2611.13235", "category": "cond-mat", "title": "Neutron Scattering studies of the density dependence of One-dimensional Quantum Fluids", "abstract": "In previous work, we demonstrated that $^4$He confined within a templated porous material preplated with a noble gas to enhance dimensional reduction exhibits one-dimensional behavior. Neutron scattering revealed that the excitations in confined $^4$He are qualitatively distinct from those in two- and three-dimensional superfluid helium, aligning with quantum Monte Carlo calculations. These simulations suggest that three solid layers form, with a one-dimensional liquid located at the center of the pore. Here, we present neutron scattering results as the filling fraction of the one-dimensional core is varied. We observe that the one-dimensional liquid always forms with a fixed density, even as the pore filling increases. We posit that this is due to the growth of the one dimensional extent of the liquid as the filling is increased, but its density remains unchanged.", "url": "https://arxiv.org/abs/2611.13235", "type": "理论+数值", "summary": "在之前的工作中，我们证明了 $^4$He 被限制在预先镀有惰性气体的模板化多孔材料中以增强降维，表现出一维行为。中子散射表明，受限 $^4$He 中的激发在质量上与二维和三维超流氦中的激发不同，这与量子蒙特卡罗计算一致。这些模拟表明形成了三个固体层，一维液体位于孔隙的中心。在这里，我们展示了随着一维核心的填充分数变化而产生的中子散射结果。我们观察到，即使孔隙填充增加，一维液体也总是以固定的密度形成。我们假设这是由于随着填充量的增加液体的一维范围增加，但其密度保持不变。", "authors": [{"name": "Sutirtha Paul"}, {"name": "Rahul Soni"}, {"name": "Garfield Warren"}, {"name": "Adrian Del Maestro"}, {"name": "Paul E. Sokol"}], "featured_authors": [{"name": "Sutirtha Paul"}, {"name": "Rahul Soni"}, {"name": "Garfield Warren"}, {"name": "Adrian Del Maestro"}, {"name": "Paul E. Sokol"}], "author_count": 5}, {"id": "2611.13264", "category": "cond-mat", "title": "Hybridization-brightened interlayer excitons in multilayer WSe2 controlled by sliding ferroelectricity", "abstract": "Interlayer excitons (IXs) combine spatially separated electron and hole wavefunctions with electrically tunable dipole moments, but their reduced wavefunction overlap generally limits optical emission, particularly for high-energy states. Here we report a bright, spectrally narrow high-energy interlayer exciton (h-IX) near 2.23 eV in few-layer WSe2 and investigate how its optical activity evolves with layer number and sliding-ferroelectric polarization. In pristine 2H-WSe2, we observe thickness-dependent brightening of high-energy exciton emission. GW-BSE calculations reveal mixed intralayer and interlayer configurations with enhanced optical weight, suggesting that multilayer hybridization contributes to the observed brightening. In parallel-stacked 3L/3L WSe2 containing a sliding-ferroelectric interface, the h-IX exhibits polarization-dependent energies and Stark responses that distinguish Pup and Pdown domains. Electric-field-driven domain-wall motion produces hysteretic transfer of spectral weight between the two h-IX branches, enabling optical tracking of ferroelectric switching. These results establish multilayer hybridization as a route to optically active high-energy interlayer excitons and sliding ferroelectricity as a complementary degree of freedom for controlling their energy, dipole and emission.", "url": "https://arxiv.org/abs/2611.13264", "type": "数值", "summary": "层间激子（IX）将空间分离的电子和空穴波函数与电可调偶极矩结合在一起，但它们减少的波函数重叠通常会限制光发射，特别是对于高能态。在这里，我们报告了少层 WSe2 中接近 2.23 eV 的明亮、光谱窄的高能层间激子 (h-IX)，并研究了其光学活性如何随层数和滑动铁电极化而演变。在原始 2H-WSe2 中，我们观察到高能激子发射的厚度依赖性增亮。 GW-BSE 计算揭示了混合的层内和层间结构，具有增强的光学重量，表明多层杂化有助于观察到的增亮。在包含滑动铁电界面的平行堆叠 3L/3L WSe2 中，h-IX 表现出偏振相关能量和区分 Pup 和 Pdown 域的 Stark 响应。电场驱动的畴壁运动在两个 h-IX 分支之间产生光谱权重的滞后转移，从而实现铁电切换的光学跟踪。\n\n这些结果将多层杂化确立为光学活性高能层间激子的途径，并将滑动铁电性作为控制其能量、偶极子和发射的互补自由度。", "authors": [{"name": "Youngki Yeo"}, {"name": "Idan Kizel"}, {"name": "Dror Hershkovitz"}, {"name": "Omri Meron"}, {"name": "Iva Plutnarova"}, {"name": "Zdenek Sofer"}, {"name": "Watanabe Kenji"}, {"name": "Takashi Taniguchi"}, {"name": "Elad Katash"}, {"name": "Dan Oron"}, {"name": "Haim Suchowski"}, {"name": "Jing-Yang You"}, {"name": "Moshe Ben Shalom"}], "featured_authors": [{"name": "Youngki Yeo"}, {"name": "Idan Kizel"}, {"name": "Dror Hershkovitz"}, {"name": "Haim Suchowski"}, {"name": "Jing-Yang You"}, {"name": "Moshe Ben Shalom"}], "author_count": 13}, {"id": "2611.13438", "category": "cond-mat", "title": "Geometry-Selective Higher-order topological insulators induced by $d_{xy}$ altermagnet", "abstract": "We show that proximity to a $d_{xy}$-wave altermagnet provides an effective route to engineering boundary-geometry-dependent higher-order topological phases. The boundary geometry plays a crucial role in determining the topological properties: axis-aligned edge states remain gapless, whereas diagonal edges acquire effective masses with alternating signs, giving rise to four corner modes localized at the mass domain walls. By projecting onto the edge-state subspace, we derive the effective edge Hamiltonians for different boundary geometries. Furthermore, $\\pi$-flux defects introduced under periodic boundary conditions yield zero-energy bound states localized at the flux cores, providing complementary evidence for nontrivial topology without physical boundaries. The interplay between the Zeeman field and the altermagnetic order drives a topological transition through the closing and reopening of the edge gap, while the bulk gap remains open. These findings highlight the crucial role of boundary geometry in higher-order topology and establish proximity-induced $d_{xy}$-wave altermagnetism as a route to engineering higher-order topological phases.", "url": "https://arxiv.org/abs/2611.13438", "type": "理论", "summary": "我们表明，接近 $d_{xy}$ 波交变磁体为工程边界几何相关的高阶拓扑相提供了有效的途径。边界几何形状在确定拓扑特性中起着至关重要的作用：轴对齐的边缘状态保持无间隙，而对角边缘获得具有交替符号的有效质量，从而产生位于质量域壁处的四个角模式。通过投影到边缘状态子空间，我们得出不同边界几何形状的有效边缘哈密顿量。此外，在周期性边界条件下引入的$\\pi$-磁通缺陷产生位于磁通核心处的零能量束缚态，为没有物理边界的非平凡拓扑提供了补充证据。塞曼场和交变磁序之间的相互作用通过边缘间隙的关闭和重新打开驱动拓扑转变，而体间隙保持打开。这些发现强调了边界几何在高阶拓扑中的关键作用，并建立了邻近感应 $d_{xy}$ 波交变磁性作为设计高阶拓扑相的途径。", "authors": [{"name": "Siyuan Cheng"}, {"name": "Yuee Xie"}, {"name": "Xiaosen Yang"}, {"name": "Yuanping Chen"}], "featured_authors": [{"name": "Siyuan Cheng"}, {"name": "Yuee Xie"}, {"name": "Xiaosen Yang"}, {"name": "Yuanping Chen"}], "author_count": 4}, {"id": "2611.13526", "category": "cond-mat", "title": "A new representation of effective diffusion in fluctuating periodic potentials through stochastic duality", "abstract": "We revisit the classical problem of effective diffusion in fluctuating periodic force fields by combining homogenization with stochastic duality. We consider a specific class of fluctuations in which the internal state of the force field is independently redrawn from a fixed distribution at Poisson-distributed times. In the homogenization framework, the effective diffusion coefficient \\(D_{\\rm eff}\\) is expressed in terms of a corrector function satisfying a backward Kolmogorov equation. For the redraw dynamics considered here, the equation governing the spatial derivative of the corrector can be reinterpreted as the stationary forward equation of a dual system obtained by reversing the force field, \\(F\\to-F\\). This relation eliminates the corrector and yields a representation of \\(D_{\\rm eff}\\) entirely in terms of stationary densities and probability currents of the physical and dual systems. We further introduce an auxiliary function \\(Q(x)\\) whose spatial variation is determined by the stationary current. When this current vanishes, \\(Q(x)\\) becomes independent of position and the effective diffusion coefficient reduces to the local relation \\( D_{\\rm eff}=L^2Q. \\) This result generalizes the classical Lifson--Jackson relation to fluctuating periodic force fields. We verify the theory using analytical calculations, numerical solutions of the stationary equations, and direct simulations of the long-time particle displacement, including a driven system with nonzero stationary current.", "url": "https://arxiv.org/abs/2611.13526", "type": "理论+数值", "summary": "我们通过将均质化与随机对偶性相结合，重新审视波动周期力场中有效扩散的经典问题。我们考虑一类特定的波动，其中力场的内部状态是在泊松分布时间上从固定分布独立地重新绘制的。在均质化框架中，有效扩散系数 \\(D_{\\rm eff}\\) 用满足后向柯尔莫哥洛夫方程的校正函数来表示。对于这里考虑的重绘动力学，控制校正器空间导数的方程可以重新解释为通过反转力场 \\(F\\to-F\\) 获得的对偶系统的稳态正向方程。这种关系消除了校正器，并完全根据物理系统和对偶系统的稳态密度和概率流产生了 \\(D_{\\rm eff}\\) 的表示。我们进一步引入一个辅助函数\\(Q(x)\\)，其空间变化由稳态电流决定。当该电流消失时，\\(Q(x)\\) 变得与位置无关，有效扩散系数减小为局部关系 \\( D_{\\rm eff}=L^2Q。\n\n\\) 这个结果概括了经典的 Lifson-Jackson 关系与波动周期力场。我们使用分析计算、稳态方程的数值解以及长期粒子位移的直接模拟（包括具有非零稳态电流的驱动系统）来验证该理论。", "authors": [{"name": "Derek Frydel"}], "featured_authors": [{"name": "Derek Frydel"}], "author_count": 1}, {"id": "2611.13553", "category": "cond-mat", "title": "Pair localization in one-dimensional quasicrystals with spin-dependent hopping", "abstract": "We investigate the quantum localization of two interacting particles moving in a one-dimensional quasicrystal with unequal hopping amplitudes. Using a two-body Green's function approach, we determine the localization phase diagram of attractively and repulsively bound pairs, showing that increasing the hopping amplitude of one constituent while keeping the other fixed raises the critical quasiperiodic strength, promoting pair delocalization. The localization threshold nevertheless remains bounded above by the Aubry-André critical point of the slower constituent. Effective analytical descriptions capture pair localization in the limits of strong hopping imbalance and strong interactions. The dynamics of an initially on-site pair provides signatures of delocalization induced by unequal hopping amplitudes. In particular, the effective spreading exponent of the root-mean-square width of a pair distribution reveals a progression from localized to subdiffusive and eventually superdiffusive behavior as the hopping ratio increases. Our results establish unequal hopping amplitudes as a means of tuning the transport properties of interacting pairs in quasiperiodic lattices, with direct relevance to ultracold atoms in optical lattices.", "url": "https://arxiv.org/abs/2611.13553", "type": "理论+数值", "summary": "我们研究了在具有不等跳跃幅度的一维准晶体中移动的两个相互作用粒子的量子局域化。使用二体格林函数方法，我们确定了吸引和排斥束缚对的局域相图，表明增加一种成分的跳跃幅度同时保持另一种成分固定会提高临界准周期强度，从而促进对离域。然而，本地化阈值仍然受到较慢成分的奥布里-安德烈临界点的限制。有效的分析描述在强跳跃不平衡和强相互作用的限制下捕获对定位。最初现场对的动态提供了由不相等的跳跃幅度引起的离域的特征。特别是，对分布的均方根宽度的有效扩散指数揭示了随着跳频比的增加，从局部到次扩散并最终到超扩散行为的进展。\n\n我们的结果建立了不等的跳跃幅度作为调整准周期晶格中相互作用对的传输特性的手段，与光学晶格中的超冷原子直接相关。", "authors": [{"name": "Carlos Rosas"}, {"name": "U. A. Díaz-Reynoso"}, {"name": "Francisco Mireles"}, {"name": "G. A. Domínguez-Castro"}], "featured_authors": [{"name": "Carlos Rosas"}, {"name": "U. A. Díaz-Reynoso"}, {"name": "Francisco Mireles"}, {"name": "G. A. Domínguez-Castro"}], "author_count": 4}, {"id": "2611.13591", "category": "cond-mat", "title": "Topological flat bands from nonlinear periodic motion", "abstract": "We use the Lax formulation of classical integrable systems to characterize the topology of nonlinear periodic orbits. For a Hamiltonian system with one degree of freedom, we express the chiral-symmetric Lax operator along a periodic orbit in a frequency basis. Energy conservation makes both bands of the resulting tight-binding model exactly flat. The harmonic oscillator corresponds to a fully dimerized topological Su-Schrieffer-Heeger model, while nonlinearity generates long-range hopping through higher harmonics. In the symmetric double well, the winding number changes as intrawell periodic orbits give way to an orbit spanning both wells, and the zero-energy edge mode of the semi-infinite chain disappears. We derive the edge-mode profile and show that its localization length diverges logarithmically as the separatrix is approached. At the separatrix, the period and the hopping decay length diverge while the band gap remains finite; this singular limit of the periodic motion allows the winding number of the infinite frequency chain to change. Canonical quantization of the Lax operator also connects the chiral winding numbers to supersymmetric quantum mechanics: for a bound system on the real line with simple turning points, their sum over all periodic orbits at a common positive energy equals the Witten index. We also apply the construction to periodic nonlinear waves through traveling-wave reductions. The finite-period winding number becomes undefined in their solitary-wave limits.", "url": "https://arxiv.org/abs/2611.13591", "type": "理论", "summary": "我们使用经典可积系统的 Lax 公式来表征非线性周期轨道的拓扑。对于一个自由度的哈密顿系统，我们以频率为基础表达沿周期轨道的手性对称 Lax 算子。能量守恒使得所得紧束缚模型的两个能带都完全平坦。谐振子对应于完全二聚化的拓扑 Su-Schrieffer-Heeger 模型，而非线性则通过高次谐波产生长程跳变。在对称双阱中，随着阱内周期轨道让位于跨越两个阱的轨道，缠绕数发生变化，并且半无限链的零能量边缘模式消失。我们推导了边缘模式轮廓，并表明当接近分界线时，其定位长度呈对数发散。在分界线处，周期和跳频衰减长度发散，而带隙保持有限；周期性运动的奇异极限允许无限频率链的缠绕数发生变化。\n\nLax算子的规范量子化还将手性缠绕数与超对称量子力学联系起来：对于实线上具有简单转折点的束缚系统，它们在共同正能量下的所有周期轨道上的总和等于维滕指数。我们还通过行波衰减将该结构应用于周期性非线性波。有限周期绕组数在其孤波极限中变得不确定。", "authors": [{"name": "Urei Miura"}, {"name": "Hisao Hayakawa"}], "featured_authors": [{"name": "Urei Miura"}, {"name": "Hisao Hayakawa"}], "author_count": 2}, {"id": "2611.13611", "category": "cond-mat", "title": "How anion composition governs structural frameworks and Li-ion transport in oxychloride solid-state electrolytes", "abstract": "Mixed-anion lithium oxychlorides exhibit high Li conductivity, but the relationship between oxygen content, structural framework, and Li-ion transport remains unclear. Here, crystal structure prediction and molecular dynamics simulations with machine-learning interatomic potentials are used to examine $\\mathrm{Li}_yM\\mathrm{O}_x\\mathrm{Cl}_{6-2x}$ ($M$ = Nb and Ta [Group 5] and $M$ = Ti, Zr, and Hf [Group 4]). Increasing oxygen content changes isolated chloride-rich polyhedra into one-dimensional chains and subsequently more highly connected two- and three-dimensional frameworks. In the Group 5 series, fast Li diffusion occurs over $x \\approx 0.67$--1.5, where the Li sites form a three-dimensional percolating network. Potential of mean force maps and nudged elastic band calculations reveal that fast Li-ion transport requires a low-dimensional framework supporting long-range migration through undercoordinated Li sites with low barriers, together with similar energies across Li sites. Finally, we perform fine-grid compositional search, which identifies $\\mathrm{LiNbO}_{0.67}\\mathrm{Cl}_{4.67}$, $\\mathrm{LiTaO}_{0.75}\\mathrm{Cl}_{4.5}$, $\\mathrm{LiNbO}_{1.5}\\mathrm{Cl}_3$, and $\\mathrm{LiTaO}_{1.5}\\mathrm{Cl}_3$ as stable candidates with predicted room-temperature self-diffusivities of up to $\\sim 10^{-6}\\,\\mathrm{cm}^2/\\mathrm{s}$. These findings establish how oxygen content controls framework and Li-ion transport, guiding the design of lithium oxyhalide electrolytes.", "url": "https://arxiv.org/abs/2611.13611", "type": "数值", "summary": "混合阴离子氯氧化锂表现出高锂电导率，但氧含量、结构框架和锂离子传输之间的关系仍不清楚。在这里，使用机器学习原子间势的晶体结构预测和分子动力学模拟来检查 $\\mathrm{Li}_yM\\mathrm{O}_x\\mathrm{Cl}_{6-2x}$ （$M$ = Nb 和 Ta [第 5 组] 和 $M$ = Ti、Zr 和 Hf [第 4 组]）。增加氧含量将孤立的富含氯化物的多面体转变为一维链，随后转变为更加高度连接的二维和三维框架。在第 5 组系列中，快速 Li 扩散发生在 $x \\约 0.67$--1.5 范围内，其中 Li 位点形成三维渗透网络。平均力图和微推弹性带计算的潜力表明，快速锂离子传输需要一个低维框架，支持通过低势垒的欠配位锂位点进行长距离迁移，以及跨锂位点的类似能量。\n\n最后，我们执行细网格组合搜索，识别 $\\mathrm{LiNbO}_{0.67}\\mathrm{Cl}_{4.67}$、$\\mathrm{LiTaO}_{0.75}\\mathrm{Cl}_{4.5}$、$\\mathrm{LiNbO}_{1.5}\\mathrm{Cl}_3$ 和$\\mathrm{LiTaO}_{1.5}\\mathrm{Cl}_3$ 作为稳定的候选者，预测室温自扩散率高达 $\\sim 10^{-6}\\,\\mathrm{cm}^2/\\mathrm{s}$。这些发现确定了氧含量如何控制框架和锂离子传输，指导卤氧化锂电解质的设计。", "authors": [{"name": "Jiho Lee"}, {"name": "Seungwoo Hwang"}, {"name": "Seungwu Han"}, {"name": "Jisu Jung"}, {"name": "Youngho Kang"}, {"name": "Sungwoo Kang"}], "featured_authors": [{"name": "Jiho Lee"}, {"name": "Seungwoo Hwang"}, {"name": "Seungwu Han"}, {"name": "Jisu Jung"}, {"name": "Youngho Kang"}, {"name": "Sungwoo Kang"}], "author_count": 6}, {"id": "2611.13622", "category": "cond-mat", "title": "Stochastic evolution of interacting directed strings", "abstract": "We study the stochastic dynamics of a system of $N$ polymer rings on an infinite cylinder with only excluded volume interaction, using simulations and also analytically. The strings can diffuse in the transverse direction by local Rouse-like moves where an up-kink changes to a down -kink, or vice versa. The motion is biased if the rates of flip are not equal. In the initial state, we start with a step initial condition: all the sites with a positive $y$ coordinate are empty, and the sites with $y \\leq 0$ are occupied with a uniform density. We study the scaling form of the density profile in the hydrodynamic limit. The scaling form is a function of $y/\\sqrt{t}$ in the unbiased case, and a function of $y/t$ in the biased case. In the unbiased case, in the steady state on a torus, the marginal probability distribution of the positions of the strings on a line with fixed $x$-coordinate is exactly same as that in the ground state of quantum-mechanical spin-less fermions on a line. The biased problem is equivalent to a growing surface in $2+1$ dimension, which is expected to be in the Kardar-Parisi-Zhang universality class.", "url": "https://arxiv.org/abs/2611.13622", "type": "理论+数值", "summary": "我们通过模拟和分析研究了无限圆柱体上仅排除体积相互作用的 $N$ 聚合物环系统的随机动力学。弦可以通过局部劳斯式移动在横向上扩散，其中上扭结变为下扭结，反之亦然。如果翻转速率不相等，则运动会出现偏差。在初始状态下，我们从一步初始条件开始：所有具有正 $y$ 坐标的位点都是空的，并且 $y \\leq 0$ 的位点被均匀密度占据。我们研究了流体力学极限下密度分布的缩放形式。在无偏情况下，缩放形式是 $y/\\sqrt{t}$ 的函数，在有偏情况下是 $y/t$ 的函数。在无偏情况下，在圆环上的稳定状态下，具有固定$x$坐标的线上弦位置的边际概率分布与线上量子力学无自旋费米子的基态下的边际概率分布完全相同。有偏问题相当于 $2+1$ 维度的生长曲面，预计属于 Kardar-Parisi-Zhang 普适性类。", "authors": [{"name": "S. S. Manna"}, {"name": "Deepak Dhar"}], "featured_authors": [{"name": "S. S. Manna"}, {"name": "Deepak Dhar"}], "author_count": 2}, {"id": "2611.13683", "category": "cond-mat", "title": "Non-Gaussian limit distributions of giant-component sizes in inhomogeneous networks", "abstract": "We demonstrate that the size distribution of giant components in percolation and epidemic spreading models on highly inhomogeneous networks often fails to converge to a Gaussian distribution in the thermodynamic limit. Instead, when appropriately scaled, the distribution converges to a non-Gaussian limit distribution (NGLD). This scaling behavior aligns with the generalized central limit theorem (GCLT), which governs sums of random variables following heavy-tailed distributions. For scale-free networks, the scaling exponent is determined solely by the degree exponent of the network, independently of the control parameter. In contrast, on the Farey graph, a deterministic hierarchical small-world network, the scaling exponent varies continuously with the control parameter.", "url": "https://arxiv.org/abs/2611.13683", "type": "理论", "summary": "我们证明，高度不均匀网络上的渗透和流行病传播模型中巨型组件的尺寸分布通常无法收敛到热力学极限的高斯分布。相反，当适当缩放时，分布会收敛到非高斯极限分布 (NGLD)。这种缩放行为与广义中心极限定理 (GCLT) 一致，该定理控制遵循重尾分布的随机变量之和。对于无标度网络，标度指数仅由网络的度指数决定，与控制参数无关。相反，在 Farey 图（确定性分层小世界网络）上，缩放指数随控制参数连续变化。", "authors": [{"name": "Tomoaki Nogawa"}, {"name": "Takehisa Hasegawa"}], "featured_authors": [{"name": "Tomoaki Nogawa"}, {"name": "Takehisa Hasegawa"}], "author_count": 2}, {"id": "2611.13695", "category": "cond-mat", "title": "Emergent Quantized Zak Phases without Dimerization in a Multicomponent Fermionic Extended Hubbard Model", "abstract": "Quantized Zak phases are commonly associated with dimerized systems, such as the noninteracting Su--Schrieffer--Heeger (SSH) model. In interacting systems, however, interactions can induce effective dimerization of particle clusters even in the absence of explicit dimerization in the underlying lattice. In this work, we study a one-dimensional multicomponent fermionic extended Hubbard model under a resonance condition between the on-site and nearest-neighbor interactions. We find that quantized Zak phases emerge for odd fermion numbers $n\\geqslant 3$, protected by the inversion symmetry of the effective Hamiltonian. Furthermore, in the presence of a tilted field, fermion clusters exhibit Bloch oscillations, during which their Zak phases can be extracted from the evolution of a Gaussian wave packet over one Bloch period. Our results reveal an interaction-induced mechanism for realizing quantized Zak phases in multicomponent fermionic systems without explicit lattice dimerization.", "url": "https://arxiv.org/abs/2611.13695", "type": "理论", "summary": "量子化 Zak 相通常与二聚系统相关，例如非相互作用的 Su--Schrieffer--Heeger (SSH) 模型。然而，在相互作用的系统中，即使在底层晶格中不存在显式二聚化的情况下，相互作用也可以诱导粒子簇的有效二聚化。在这项工作中，我们研究了现场相互作用和最近邻相互作用之间共振条件下的一维多分量费米子扩展哈伯德模型。我们发现奇数费米子数 $n\\geqslant 3$ 出现量化的 Zak 相位，受到有效哈密顿量的反演对称性的保护。此外，在存在倾斜场的情况下，费米子簇表现出布洛赫振荡，在此期间，可以从一个布洛赫周期内高斯波包的演化中提取它们的 Zak 相位。我们的结果揭示了一种相互作用诱导机制，可在多组分费米子系统中实现量子化 Zak 相，而无需显式晶格二聚化。", "authors": [{"name": "F. X. Liu"}, {"name": "Z. Song"}], "featured_authors": [{"name": "F. X. Liu"}, {"name": "Z. Song"}], "author_count": 2}, {"id": "2611.13783", "category": "cond-mat", "title": "Critical geometry of triconnected clusters in percolation", "abstract": "We investigate the critical geometry of triconnected clusters in percolation, which remain connected after the removal of any two sites. By combining biconnected-component decomposition with the SPQR decomposition of graphs, we develop an efficient algorithm for identifying triconnected clusters in large systems. Extensive Monte Carlo simulations yield estimates of the fractal dimension $d_3=1.2308(3)$, $1.083(2)$, and $0.77(2)$ in dimensions $d=2$, $3$, and $4$, respectively, revealing a systematic decrease of $d_3$ with increasing $d$. In dimension $d=6$, the largest triconnected cluster grows logarithmically with system size, whereas on complete graphs, corresponding to $d=\\infty$, it approaches a finite size. Both behaviors indicate a vanishing fractal dimension, $d_3=0$, for $d\\geq6$. Furthermore, the singular contribution to the susceptibility-like quantity associated with the second moment of the triconnected-cluster size distribution scales as $\\chi\\sim L^{2d_3-d}$. Consequently, it vanishes for $d\\geq3$, leaving a finite asymptotic susceptibility, in contrast to the divergent behavior observed in standard percolation.", "url": "https://arxiv.org/abs/2611.13783", "type": "理论+数值", "summary": "我们研究了渗透中三联簇的关键几何形状，在去除任意两个位点后，三联簇仍保持连接。通过将双连通分量分解与图的 SPQR 分解相结合，我们开发了一种有效的算法来识别大型系统中的三连通簇。广泛的蒙特卡洛模拟分别对维度 $d=2$、$3$ 和 $4$ 的分形维度 $d_3=1.2308(3)$、$1.083(2)$ 和 $0.77(2)$ 进行估计，揭示了 $d_3$ 随着 $d$ 的增加而系统性减少。在维度 $d=6$ 中，最大的三连通簇随着系统大小呈对数增长，而在完整图上，对应于 $d=\\infty$，它接近有限大小。这两种行为都表明分形维数消失，$d_3=0$，对于 $d\\geq6$。此外，与三连通簇大小分布的二阶矩相关的类磁化率量的奇异贡献按 $\\chi\\sim L^{2d_3-d}$ 缩放。因此，它在 $d\\geq3$ 中消失，留下有限的渐近磁化率，与标准渗流中观察到的发散行为相反。", "authors": [{"name": "Qi Wang"}, {"name": "Youjin Deng"}, {"name": "Ming Li"}], "featured_authors": [{"name": "Qi Wang"}, {"name": "Youjin Deng"}, {"name": "Ming Li"}], "author_count": 3}, {"id": "2611.13798", "category": "cond-mat", "title": "Electronic Origin of Contrasting Li and Na Clustering on Graphene", "abstract": "The electrochemical performance of anode materials is often defined by the ability of metal ions (e.g., Li and Na) to be effectively stored within the host material over a specific range of chemical potentials. This is particularly true for adsorbed Li and Na atoms on carbon surfaces (e.g., graphite or pore surfaces in hard carbon), where the interplay between ionic and metallic bonding often takes place - while metal atoms act as ionic species, in a finite concentration limit, they tend to form metallic bonding when they approach each other. What makes the case special is that, despite similar chemical identities, Li and Na atoms exhibit distinct tendencies for cluster formation; for example, the formation of Li metallic clusters on a graphene surface is only thermodynamically favorable after reaching a finite metal-ion concentration. Motivated by this, herein, we use first-principles calculations on graphene to examine the electronic origin of Li and Na clustering. Specifically, we demonstrate that the separated adsorbed atoms donate electrons to graphene, shifting the Fermi level to higher energies; however, the formation of metal clusters can result in the formation of lower-energy orbitals that are specifically associated with metal-metal bonding, thus lowering the Fermi level (and hence total energies). Importantly, while the process is somewhat similar for Na and Li atoms, the energy levels of the newly formed metallic states govern the difference in metallic cluster formation between Li and Na.", "url": "https://arxiv.org/abs/2611.13798", "type": "理论+数值", "summary": "阳极材料的电化学性能通常由金属离子（例如Li和Na）在特定化学势范围内有效储存在主体材料内的能力来定义。对于碳表面（例如石墨或硬碳中的孔隙表面）上吸附的锂和钠原子来说尤其如此，其中离子键和金属键之间经常发生相互作用 - 虽然金属原子充当离子物种，但在有限的浓度限制下，它们在彼此接近时往往会形成金属键。该案例的特殊之处在于，尽管化学特性相似，Li 和 Na 原子却表现出不同的簇形成倾向。例如，只有在达到有限的金属离子浓度后，石墨烯表面上锂金属簇的形成才在热力学上有利。受此启发，我们在本文中使用石墨烯的第一性原理计算来研究Li和Na聚集的电子起源。\n\n具体来说，我们证明了分离的吸附原子向石墨烯提供电子，将费米能级转移到更高的能量；然而，金属簇的形成可能导致形成与金属-金属键合相关的低能轨道，从而降低费米能级（从而降低总能量）。重要的是，虽然钠和锂原子的过程有些相似，但新形成的金属态的能级决定了锂和钠之间金属簇形成的差异。", "authors": [{"name": "G. Kuderowicz"}, {"name": "O. I. Malyi"}], "featured_authors": [{"name": "G. Kuderowicz"}, {"name": "O. I. Malyi"}], "author_count": 2}, {"id": "2611.13839", "category": "cond-mat", "title": "Hierarchical Topological Protection and Subsymmetry-Driven Edge-State Switching", "abstract": "We reveal a hierarchy of topological protection in which multiple symmetries and their reduced forms provide distinct mechanisms for protecting topological edge states. In Hermitian Hamiltonians obtained by doubling chiral non-Hermitian systems, a structural and an inherited chiral symmetry provide complementary channels of topological protection. By selectively breaking either symmetry, we demonstrate their distinct roles in protecting edge zero modes, establishing different levels of protection under symmetry reduction. Remarkably, even when both full chiral symmetries are broken, fixed subsymmetry constraints allow the protected zero-mode configurations to switch between opposite edges and change in number across the topological phase boundaries of the symmetry-unbroken system. Our results establish a hierarchical framework for topological protection, revealing a route to controlling edge-state configurations via reduced symmetry constraints.", "url": "https://arxiv.org/abs/2611.13839", "type": "理论", "summary": "我们揭示了拓扑保护的层次结构，其中多重对称性及其简化形式为保护拓扑边缘状态提供了独特的机制。在通过加倍手性非厄米系统获得的厄米哈密顿量中，结构对称性和继承的手性对称性提供了拓扑保护的互补通道。通过选择性地破坏任一对称性，我们展示了它们在保护边缘零模式、在对称性降低下建立不同级别的保护方面的独特作用。值得注意的是，即使当两个完全手性对称性都被破坏时，固定的亚对称约束也允许受保护的零模式配置在相对边缘之间切换，并在对称性未破坏系统的拓扑相边界上改变数量。我们的结果建立了拓扑保护的分层框架，揭示了通过减少对称约束来控制边缘状态配置的途径。", "authors": [{"name": "Shu Long"}, {"name": "Rijia Lin"}, {"name": "Hui-Qiang Liang"}, {"name": "Linhu Li"}], "featured_authors": [{"name": "Shu Long"}, {"name": "Rijia Lin"}, {"name": "Hui-Qiang Liang"}, {"name": "Linhu Li"}], "author_count": 4}, {"id": "2611.13895", "category": "cond-mat", "title": "Thermodynamic Properties of the S=1/2 Zigzag Spin Ladder", "abstract": "We investigate finite-temperature properties of the spin-1/2 zigzag Heisenberg ladder with an anisotropic off-diagonal $\\Gamma$ interaction. Thermal states are calculated by an infinite time-evolving block decimation method combined with purification, while exact diagonalization is used to analyze low-lying excitations. The entropy is strongly suppressed at low temperatures inside the gapped phases, whereas it remains enhanced near several ground-state phase boundaries. For the Néel phase at $J_2/J_1=0$, the model can be mapped by spin rotations onto the exactly solvable XYZ chain. The thermal gap extracted from the low-temperature specific heat agrees with the exact one-spinon gap, while the finite-size excitation gap obtained by exact diagonalization is consistent with a two-spinon excitation.", "url": "https://arxiv.org/abs/2611.13895", "type": "理论+数值", "summary": "我们研究了具有各向异性非对角 $\\Gamma$ 相互作用的自旋 1/2 锯齿形海森堡梯的有限温度特性。热态通过无限时间演化的块抽取方法与纯化相结合来计算，而精确对角化用于分析低位激发。在低温下，带隙相内部的熵受到强烈抑制，而在几个基态相边界附近，熵仍然增强。对于 $J_2/J_1=0$ 处的 Néel 相，可以通过自旋旋转将模型映射到精确可解的 XYZ 链上。从低温比热中提取的热间隙与精确的一旋子激发间隙一致，而通过精确对角化获得的有限尺寸激发间隙与二旋子激发一致。", "authors": [{"name": "Nobuya Maeshima"}, {"name": "Toshiya Hikihara"}, {"name": "Kouichi Okunishi"}], "featured_authors": [{"name": "Nobuya Maeshima"}, {"name": "Toshiya Hikihara"}, {"name": "Kouichi Okunishi"}], "author_count": 3}, {"id": "2611.13902", "category": "cond-mat", "title": "A phase-field model of viscous surfaces in fluids", "abstract": "Viscous surfaces play a crucial role in biological and industrial multiphase flows, yet their simulation remains challenging due to complex rheology and topological changes. We present a thermodynamically consistent phase-field model for viscous surfaces in incompressible Navier-Stokes fluids, incorporating surface shear and dilatational viscosities via the Boussinesq-Scriven constitutive law. The diffuse-interface formulation is derived from a sharp-interface model and rigorously validated through matched asymptotic analysis, confirming recovery of the correct sharp-interface limit. We develop an unconditionally energy-dissipative time discretization, ensuring numerical stability. The model is validated through a quantitative benchmark against analytical solutions for surface flows on a rigid sphere, and a simulation of vesicle fusion showing preservation of energy dissipation across topological transitions. These results demonstrate that the framework enables robust, physically consistent simulations of complex surface dynamics, including large deformations and topological changes, without explicit surface tracking.", "url": "https://arxiv.org/abs/2611.13902", "type": "理论+数值", "summary": "粘性表面在生物和工业多相流中发挥着至关重要的作用，但由于复杂的流变学和拓扑变化，其模拟仍然具有挑战性。我们提出了不可压缩纳维-斯托克斯流体中粘性表面的热力学一致相场模型，通过 Boussinesq-Scriven 本构定律结合了表面剪切和膨胀粘度。扩散界面公式源自锐界面模型，并通过匹配渐近分析进行严格验证，确认恢复了正确的锐界面极限。我们开发了无条件能量耗散时间离散，确保数值稳定性。该模型通过针对刚性球体表面流动分析解决方案的定量基准以及显示拓扑转变期间能量耗散保留的囊泡融合模拟进行了验证。这些结果表明，该框架能够对复杂的表面动力学（包括大变形和拓扑变化）进行稳健、物理一致的模拟，而无需明确的表面跟踪。", "authors": [{"name": "Maximilian Kloppe"}, {"name": "Sebastian Aland"}], "featured_authors": [{"name": "Maximilian Kloppe"}, {"name": "Sebastian Aland"}], "author_count": 2}, {"id": "2611.13937", "category": "cond-mat", "title": "Chiral magnon Kerr interaction from linear and nonlinear Meissner screening in ferromagnet--superconductor bilayers", "abstract": "Magnon Kerr interaction showing a dependence of magnon dispersion frequency on its population is a useful functionality for nonlinear and quantum magnonics; its strength and sign depend on magnetic anisotropy, bias, and mode geometry. We here propose to use a superconducting gate to tune the Kerr interaction of magnons in ferromagnetic insulators. Even when the superconductor responds linearly, the frequency shift induced by its reflected dipolar field depends on the longitudinal magnetization. The decrease of this magnetization with increasing precession amplitude therefore produces a Kerr contribution. We go beyond this linear Meissner-screening regime by showing that at finite excitation amplitude, the significant Meissner screening currents reduce the superfluid stiffness, thus enhancing the effective magnetic-field penetration and rendering the Meissner backaction amplitude dependent. This superflow-induced pair breaking adds a second Kerr contribution, controlled by the interfacial superflow relative to the nonlinear screening scale. For yttrium iron garnet gated by dirty niobium, we predict a significant renormalization of the Kerr effect by superconductors, with the resulting Kerr contribution strongly chiral in the Damon--Eshbach configuration. By showing that the linear and nonlinear Meissner screening to the Kerr interaction can be distinguished by varying temperature, our work establishes a route to directional control of magnon nonlinear interactions.", "url": "https://arxiv.org/abs/2611.13937", "type": "理论", "summary": "磁振子克尔相互作用显示磁振子色散频率与其布居数的相关性，对于非线性和量子磁振子学来说是一个有用的功能；其强度和符号取决于磁各向异性、偏置和模式几何形状。我们在这里建议使用超导门来调节铁磁绝缘体中磁振子的克尔相互作用。即使超导体线性响应，其反射偶极场引起的频移也取决于纵向磁化强度。因此，随着进动幅度的增加，磁化强度会降低，从而产生克尔贡献。我们超越了这种线性迈斯纳屏蔽机制，表明在有限的激励幅度下，显着的迈斯纳屏蔽电流降低了超流体刚度，从而增强了有效磁场穿透并使迈斯纳反作用幅度依赖。这种超流引起的对断裂增加了第二个克尔贡献，该贡献由相对于非线性筛选尺度的界面超流控制。\n\n对于由脏铌门控的钇铁石榴石，我们预测超导体对克尔效应的显着重整化，由此产生的克尔贡献在达蒙-埃什巴赫配置中具有强手性。通过证明克尔相互作用的线性和非线性迈斯纳筛选可以通过改变温度来区分，我们的工作建立了磁振子非线性相互作用的定向控制途径。", "authors": [{"name": "Hanchen Wang"}, {"name": "Tao Yu"}], "featured_authors": [{"name": "Hanchen Wang"}, {"name": "Tao Yu"}], "author_count": 2}, {"id": "2611.13979", "category": "cond-mat", "title": "Frequency Comb as a Probe of Fluctuation Mechanisms in Nanomechanical Systems", "abstract": "Frequency combs are indispensable in metrology. We show that a frequency comb also probes frequency fluctuations of the system. In our nanomechanical resonator, the comb arises from self-sustained vibrations of a resonantly driven nonlinear mode. The comb lineshapes reveal exponentially correlated (Ornstein--Uhlenbeck) frequency noise. Its correlation time agrees with the independently measured relaxation time of the vibrations. The noise leads to anomalous phase diffusion. Its mechanism is generic: like the comb itself, it stems from the strong nonlinearity of the self-sustained vibrations.", "url": "https://arxiv.org/abs/2611.13979", "type": "理论", "summary": "频率梳在计量学中是不可或缺的。我们证明频率梳还可以探测系统的频率波动。在我们的纳米机械谐振器中，梳子由谐振驱动的非线性模式的自持振动产生。梳状线形揭示了指数相关（Ornstein--Uhlenbeck）频率噪声。其相关时间与独立测量的振动弛豫时间一致。噪声导致反常相扩散。它的机制是通用的：就像梳子本身一样，它源于自持振动的强非线性。", "authors": [{"name": "Maria Kallergi"}, {"name": "Daniel K.J. Boneß"}, {"name": "Maximilian Seitner"}, {"name": "Wolfgang Belzig"}, {"name": "Mark I. Dykman"}, {"name": "Eva M. Weig"}], "featured_authors": [{"name": "Maria Kallergi"}, {"name": "Daniel K.J. Boneß"}, {"name": "Maximilian Seitner"}, {"name": "Wolfgang Belzig"}, {"name": "Mark I. Dykman"}, {"name": "Eva M. Weig"}], "author_count": 6}, {"id": "2611.14039", "category": "cond-mat", "title": "Thermodynamics of words", "abstract": "We introduce the word thermalization hypothesis according to which in a literary work there are effective interactions between words that drive them to thermalization where their word frequency distribution is the same as for the phenomenon of Rayleigh-Jeans (RJ) thermalization and condensation. In this concept, the different words play a role of classical oscillators (particles) and their word frequencies, or related tokens, are analogous to certain filling factors over energy state levels. The thermalization process is characterized by the conservation of total system energy, or total number of words/tokens, and total probability norm, or total number of different words. We apply this approach to analyze 16 literary works, including Bible, complete works of Shakespeare, and data from American National Corpus. We show that for these cases the effective system energy is very low and thus there is the RJ condensation phenomenon with a big fraction of total probability concentrated at the lowest energy states corresponding to a big fraction of rare words appearing only once or twice in the whole text. Such a RJ condensation is observed for light propagation in multimode optical fibers and other physical systems. We relate the thermalization of words to the recently proposed wealth thermalization for households in world countries. The economy concepts of Lorenz and Pareto curves, and also Zipf curves, are applied to the word frequency distributions of the selected 16 cases and it is shown that the thermalization theory gives a strikingly good description of real data.", "url": "https://arxiv.org/abs/2611.14039", "type": "理论", "summary": "我们引入了单词热化假说，根据该假说，在文学作品中，单词之间存在有效的相互作用，促使它们热化，其词频分布与瑞利-金斯（RJ）热化和凝结现象相同。在这个概念中，不同的单词扮演着经典振荡器（粒子）的角色，它们的单词频率或相关标记类似于能态水平上的某些填充因子。热化过程的特征在于总系统能量（或单词/令牌的总数）和总概率范数（或不同单词的总数）的守恒。我们应用这种方法分析了 16 部文学作品，包括《圣经》、莎士比亚全集和美国国家语料库的数据。我们表明，在这些情况下，有效系统能量非常低，因此存在 RJ 凝聚现象，总概率的很大一部分集中在最低能量状态，对应于整个文本中只出现一次或两次的大部分罕见单词。\n\n在多模光纤和其他物理系统中的光传播中可以观察到这种 RJ 凝聚。我们将词语热化与最近提出的世界各国家庭财富热化联系起来。将 Lorenz 和 Pareto 曲线以及 Zipf 曲线的经济概念应用于所选 16 个案例的词频分布，结果表明热化理论对实际数据给出了非常好的描述。", "authors": [{"name": "Klaus M. Frahm"}, {"name": "Dima L. Shepelyansky"}], "featured_authors": [{"name": "Klaus M. Frahm"}, {"name": "Dima L. Shepelyansky"}], "author_count": 2}, {"id": "2611.14108", "category": "cond-mat", "title": "Memory of Initial States in Long-Time Dynamics Revealed by Non-Gaussianity", "abstract": "In quantum dynamics of few-body observables in quadratic systems, information about the initial state is retained in long-time averages, as captured by the generalized Gibbs ensemble. Here, we show that this memory extends beyond the averages to temporal fluctuations around them. By generating a manifold of non-Gaussian initial states and quantifying their non-Gaussianity via the corresponding entropy, we find that the magnitude of temporal fluctuations is a smooth function of the initial-state non-Gaussianity. This relation explains the qualitatively different scaling of fluctuations observed after quantum quenches: exponentially small fluctuations for non-Gaussian initial states and polynomially small fluctuations for Gaussian initial states. Therefore, our results identify non-Gaussianity as a key to uncovering initial-state memory beyond long-time averages.", "url": "https://arxiv.org/abs/2611.14108", "type": "理论", "summary": "在二次系统中少体可观测量的量子动力学中，有关初始状态的信息保留在长期平均值中，如广义吉布斯系综所捕获的那样。在这里，我们表明这种记忆超出了平均值，延伸到了它们周围的时间波动。通过生成流形的非高斯初始状态并通过相应的熵量化它们的非高斯性，我们发现时间波动的幅度是初始状态非高斯性的平滑函数。这种关系解释了量子淬灭后观察到的波动的定性不同尺度：非高斯初始状态的指数小波动和高斯初始状态的多项式小波动。因此，我们的结果将非高斯性确定为揭示超出长期平均值的初始状态记忆的关键。", "authors": [{"name": "Julia Koczorowska"}, {"name": "Lev Vidmar"}, {"name": "Patrycja Łydżba"}], "featured_authors": [{"name": "Julia Koczorowska"}, {"name": "Lev Vidmar"}, {"name": "Patrycja Łydżba"}], "author_count": 3}, {"id": "2611.14109", "category": "cond-mat", "title": "Spin-glass order in a field requires magnetic-field chaos in XY gauge glasses for $d\\leq 4$", "abstract": "The XY gauge-glass model is believed to exhibit a spin-glass phase in dimensions $d\\geq 3$. In this paper, we prove that, in dimensions $d\\leq 4$ and at any finite temperature, a magnetic field applied in a fixed direction, with amplitudes that fluctuate from site to site according to the Rayleigh distribution, must either induce magnetic-field chaos in the spin-glass phase or destroy spin-glass order altogether, whenever a spin-glass phase exists at zero field. In particular, if a spin-glass phase persists under such a field, as predicted by the replica-symmetry-breaking (RSB) picture, it must exhibit magnetic-field chaos. This conclusion follows from our proof that, for any fixed nonzero field strength, the disorder average of the squared overlap between equilibrium spin configurations at zero field and those at nonzero field vanishes in the thermodynamic limit. By gauge transformations, the overlap statistics are identical to the magnetization statistics of an XY gauge glass with correlated bond disorder in a Gaussian random field. Our proof combines this exact identity with quantitative estimates on the suppression of ferromagnetic order by random fields in continuous-spin systems, due to Dario, Harel, and Peled [Commun. Math. Phys. 405, 212 (2024)] and building on the work of Imry and Ma [Phys. Rev. Lett. 35, 1399 (1975)] and of Aizenman and Wehr [Phys. Rev. Lett. 62, 2503 (1989); Commun. Math. Phys. 130, 489 (1990)]. We extend these estimates to bond-dependent interactions. Although our result provides a rare rigorous constraint on the nature of spin-glass phases in finite-dimensional systems, it does not determine whether spin-glass order survives in a field, and therefore does not distinguish between the droplet and RSB pictures. The case of a strictly uniform field remains open.", "url": "https://arxiv.org/abs/2611.14109", "type": "理论", "summary": "XY 仪表玻璃模型被认为表现出尺寸为 $d\\geq 3$ 的自旋玻璃相。在本文中，我们证明，在维度 $d\\leq 4$ 和任何有限温度下，当自旋玻璃相存在于零场时，在固定方向上施加的磁场（其振幅根据瑞利分布在不同位置波动）必须在自旋玻璃相中引起磁场混沌或完全破坏自旋玻璃有序。特别是，如果自旋玻璃相在这样的场下持续存在，正如复制对称破缺（RSB）图所预测的那样，它一定会表现出磁场混沌。这个结论来自我们的证明，即对于任何固定的非零场强，零场和非零场的平衡自旋构型之间的平方重叠的无序平均值在热力学极限中消失。通过规范变换，重叠统计量与高斯随机场中具有相关键无序的 XY 规范玻璃的磁化强度统计量相同。\n\n我们的证明将这种精确的同一性与连续自旋系统中随机场对铁磁有序的抑制的定量估计结合起来，这归功于 Dario、Harel 和 Peled [Commun.数学。物理。 405, 212 (2024)] 并以 Imry 和 Ma 的工作为基础 [Phys. 405, 212 (2024)]莱特牧师。 35, 1399 (1975)] 以及 Aizenman 和 Wehr [Phys.莱特牧师。 62、2503（1989）；交流。数学。物理。 130, 489 (1990)]。我们将这些估计扩展到依赖键的相互作用。尽管我们的结果对有限维系统中自旋玻璃相的性质提供了罕见的严格约束，但它并不能确定自旋玻璃序是否在场中存在，因此不能区分液滴和RSB图片。严格统一场的情况仍然悬而未决。", "authors": [{"name": "Manaka Okuyama"}, {"name": "Masayuki Ohzeki"}, {"name": "Hidetoshi Nishimori"}], "featured_authors": [{"name": "Manaka Okuyama"}, {"name": "Masayuki Ohzeki"}, {"name": "Hidetoshi Nishimori"}], "author_count": 3}, {"id": "2611.14200", "category": "cond-mat", "title": "Disorder-Induced Logarithmic Spreading and Localization of Quantum Fluctuations", "abstract": "Disorder can localize quantum particles, even in the presence of interactions, but its influence on quantum fluctuations beyond mean--field dynamics remains poorly understood. Here, we investigate the propagation of quantum fluctuations in weakly interacting disordered bosonic systems by comparing the Bose--Hubbard model with the Gross--Pitaevskii equation. We find that, in contrast to ballistic spreading in the disorder--free system, quantum fluctuations exhibit logarithmic spreading at intermediate times under both random and quasiperiodic disorder, before eventually saturating. The spreading rate decreases algebraically with increasing disorder strength, and this behavior persists across different particle numbers and extends to two dimensions. Using a time--dependent Bogoliubov--de Gennes framework, we identify the localized mean--field wavefunction as a time--dependent pairing background that generates quantum fluctuations. The exponential suppression of fluctuation--generation rates with distance provides a physical mechanism for the logarithmically advancing fluctuation front. Our results reveal a distinct regime of disorder--controlled quantum--fluctuation dynamics and establish disorder as a means of controlling their spreading.", "url": "https://arxiv.org/abs/2611.14200", "type": "理论", "summary": "即使存在相互作用，无序也可以定位量子粒子，但它对平均场动力学之外的量子涨落的影响仍然知之甚少。在这里，我们通过比较 Bose--Hubbard 模型与 Gross--Pitaevskii 方程来研究弱相互作用无序玻色子系统中量子涨落的传播。我们发现，与无序系统中的弹道扩散相反，量子涨落在随机和准周期无序下的中间时间表现出对数扩散，然后最终饱和。随着无序强度的增加，铺展率以代数方式下降，并且这种行为在不同的粒子数量上持续存在并延伸到二维。使用时间相关的 Bogoliubov-de Gennes 框架，我们将局域平均场波函数识别为产生量子涨落的时间相关配对背景。波动发生率随距离的指数抑制为对数前进的波动前沿提供了物理机制。\n\n我们的结果揭示了一种独特的无序控制量子涨落动力学机制，并将无序作为控制其扩散的一种手段。", "authors": [{"name": "Ang Yang"}, {"name": "Jingxuan Zhang"}, {"name": "Lei Ying"}], "featured_authors": [{"name": "Ang Yang"}, {"name": "Jingxuan Zhang"}, {"name": "Lei Ying"}], "author_count": 3}, {"id": "2611.14230", "category": "cond-mat", "title": "The Multiscale Principle in phase transition: Geometric structure, thermodynamic entropy, and dynamical instability", "abstract": "Scaling and multi-scaling are two guiding principles for understanding nature or even commerce and industrial outcome. In the realm of critical phenomena, scaling laws describe the behavior of physical quantities near a continuous phase transition. This is a complex phenomena where systems exhibit critical fluctuations and long-range correlations, challenging classical formulations such as the fluctuation-dissipation theorem (FDT). In particular, near critical points, the divergence of the correlation length and the emergence of fractal geometry in spin clusters suggest the need for alternative frameworks. In this work, we explore the connection between critical exponents, fractal dimensions, and the thermodynamic formalism known as the Principium Luxuriae. By linking the thermodynamic fractal dimension D to the correlation length and entropy variations, we reinterpret energy dissipation in terms of multiscale processes. This approach allows us to reproduce effective scaling tendencies associated with the critical behavior of the 2d Ising model and provides new insight into how systems redistribute energy macroscopically during phase transitions. Furthermore, we demonstrate that the decrease in D near the critical temperature marks a transition toward macroscopic coherence, where the system begins to dissipate energy across its entire scale. This unified behavior, however, induces a heightened sensitivity to perturbations, where local fluctuations are transmitted globally through the fractal network. This mechanism establishes a direct bridge between geometric structure, thermodynamic entropy, and the onset of dynamical instability (chaos) as the system approaches criticality.", "url": "https://arxiv.org/abs/2611.14230", "type": "理论", "summary": "尺度化和多尺度化是理解自然甚至商业和工业成果的两个指导原则。在临界现象领域，标度定律描述了连续相变附近物理量的行为。这是一种复杂的现象，系统表现出临界波动和长程相关性，对波动耗散定理 (FDT) 等经典公式提出了挑战。特别是，在临界点附近，相关长度的发散以及自旋簇中分形几何的出现表明需要替代框架。在这项工作中，我们探索了临界指数、分形维数和被称为“奢华原理”的热力学形式之间的联系。通过将热力学分形维数 D 与相关长度和熵变化联系起来，我们重新解释了多尺度过程的能量耗散。这种方法使我们能够重现与 2d Ising 模型的关键行为相关的有效缩放趋势，并为系统在相变期间如何宏观地重新分配能量提供新的见解。\n\n此外，我们证明，接近临界温度时 D 的降低标志着向宏观相干性的转变，系统开始在整个尺度上耗散能量。然而，这种统一的行为导致了对扰动的高度敏感，其中局部波动通过分形网络在全球范围内传播。当系统接近临界时，这种机制在几何结构、热力学熵和动力学不稳定（混沌）的发生之间建立了直接的桥梁。", "authors": [{"name": "Patricio Venegas-Aravena"}, {"name": "Fernando A. Oliveira"}], "featured_authors": [{"name": "Patricio Venegas-Aravena"}, {"name": "Fernando A. Oliveira"}], "author_count": 2}, {"id": "2611.14235", "category": "cond-mat", "title": "Banding instabilities in poroelastic media under flow-driven compaction", "abstract": "When cross-linked poroelastic media are subjected to a hydrostatic pressure difference, they compact, remaining fully swollen on their uppermost surface and becoming increasingly compressed with depth. A critical unexplored effect of cross-linking and resistance to shear deformation is investigated, which is not seen in classical models of poroelastic media treated as free elastic spheres, and resists the kind of compressive compaction that characterises these systems. Eventually, a steady-state profile dependent on osmotic, shear and transport properties is reached, supporting a uniform interstitial flow wherein the medium acts like a passive filter. In this paper, we show how these steady-state profiles are not necessarily stable, and propose a mechanism for the formation of instabilities, wherein some regions of the medium swell and others compact, forming distinctive horizontal or vertical banding patterns. In the latter case, these bands appear qualitatively to be higher-permeability conduits or channels, similar to wormholes or tunnels seen in granular media. It is possible to quantify the effect of changing the pressure head on the growth rate of instabilities and the separation lengthscale in this channelisation case, and how material properties like shear stiffness and dependence of permeability on porosity affect the dynamics of instability. Critically, it is shown that these instabilities are a fluid-mechanical effect, with an entirely new mechanism based on the porosity--permeability relationship and not on elastic effects. With an understanding of these mechanisms, we can derive insight into channelisation in poroelastic systems in geophysics, human biology and industry.", "url": "https://arxiv.org/abs/2611.14235", "type": "理论", "summary": "当交联的多孔弹性介质受到静水压力差时，它们会压缩，在其最上表面保持完全膨胀，并随着深度的增加而逐渐压缩。研究了交联和抗剪切变形的关键的未探索效应，这在被视为自由弹性球的多孔弹性介质的经典模型中是看不到的，并且抵抗了这些系统所特有的压缩压实类型。最终，达到取决于渗透、剪切和传输特性的稳态分布，支持均匀的间隙流，其中介质充当被动过滤器。在本文中，我们展示了这些稳态剖面如何不一定稳定，并提出了一种形成不稳定性的机制，其中介质的某些区域膨胀而其他区域紧凑，形成独特的水平或垂直带状图案。在后一种情况下，这些带在性质上看起来是渗透率较高的导管或通道，类似于颗粒介质中看到的虫洞或隧道。\n\n在这种通道化情况下，可以量化改变压头对不稳定性增长率和分离长度尺度的影响，以及诸如剪切刚度和渗透率对孔隙率的依赖性等材料特性如何影响不稳定性的动态。重要的是，研究表明这些不稳定性是一种流体力学效应，具有基于孔隙度-渗透率关系而不是弹性效应的全新机制。通过了解这些机制，我们可以深入了解地球物理学、人类生物学和工业中多孔弹性系统的通道化。", "authors": [{"name": "Joseph J. Webber"}], "featured_authors": [{"name": "Joseph J. Webber"}], "author_count": 1}, {"id": "2611.14271", "category": "cond-mat", "title": "Edge quantum weight of finite Chern flakes and its topological floor", "abstract": "The zero-point energy of a circuit measures the polarization fluctuation of an insulator coupled to it. In a crystal this is the bulk quantum weight $K_\\mathrm{bulk}$, which the Chern number $C$ bounds below by $|C|$. We show that a finite Chern flake adds an edge term that survives as the flake grows. The low-frequency transitions of its chiral edge carry a dipole weight, the sum of their squared dipole matrix elements, $K_\\mathrm{edge}\\geq|C|$ per unit area, a floor that follows from the positive absorption of both circular polarizations by every transition and the known cancellation of circular dichroism between edge and bulk. A weakly coupled circuit slower than the edge modes therefore reads $K_\\mathrm{bulk}+K_\\mathrm{edge}$, averaged over two field directions, while a faster one below the bulk gap approaches $K_\\mathrm{bulk}$, so which quantum weight is measured depends on whether the flake is made large or the circuit slow first. Exact free-fermion calculations on lattice flakes bear out the floor and this dependence on the circuit frequency. The result holds at weak coupling, which a growing flake at fixed coupling eventually leaves. Above the floor, the edge weight of one channel is a number fixed by the shape of the boundary and the edge velocities, which square and rectangular lattice flakes follow to within 0.003. Each further edge channel adds its own such number, while the circular dichroism of the edge counts only the net chirality.", "url": "https://arxiv.org/abs/2611.14271", "type": "理论+数值", "summary": "电路的零点能量测量与其耦合的绝缘体的极化波动。在晶体中，这是体积量子重量 $K_\\mathrm{bulk}$，陈数 $C$ 的边界是 $|C|$。我们证明，有限的陈氏薄片添加了一个边缘项，该边缘项随着薄片的生长而保留下来。其手性边缘的低频跃迁带有偶极子权重，即其平方偶极子矩阵元素的总和，每单位面积 $K_\\mathrm{edge}\\geq|C|$ ，这是由每个跃迁对圆偏振的正吸收以及边缘和体之间已知的圆二色性抵消得出的下限。因此，比边缘模式慢的弱耦合电路读取 $K_\\mathrm{bulk}+K_\\mathrm{edge}$，在两个场方向上取平均值，而低于体间隙的较快的电路则接近 $K_\\mathrm{bulk}$，因此测量哪个量子权取决于首先使薄片变大还是先使电路变慢。对晶格片的精确自由费米子计算证实了底线以及这种对电路频率的依赖性。该结果在弱耦合下成立，固定耦合下不断生长的薄片最终会离开。\n\n在地板上方，一个通道的边缘权重是由边界形状和边缘速度确定的一个数字，正方形和矩形晶格片遵循的值在 0.003 以内。每个进一步的边缘通道都会添加自己的此类数字，而边缘的圆二色性仅计算净手性。", "authors": [{"name": "Rohit Narula"}], "featured_authors": [{"name": "Rohit Narula"}], "author_count": 1}, {"id": "2611.14375", "category": "cond-mat", "title": "From Distribution of Extremes With Degradation to the Stress Redundancy Principle", "abstract": "How a degradation source affects the statistics of the first among many identical independent stochastic particles to successfully reach a narrow target remains unclear. Here, we investigate the impact of degradation on the distributions of first-passage times and exit locations by exploiting the time-dependent fluxes associated with the corresponding Fok
