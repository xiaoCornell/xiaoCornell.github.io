ker-Planck equation. We also compute the escape probability by solving a mixed boundary value problem. In the large initial population $N_0$ limit, we derive an asymptotic formula for the mean first passage time associated with the fastest particle, revealing how the killing field modifies the classical $1/\\log(N_0)$ scaling. However, when considering the population size at the time of the first exit, we obtain a specific dependency with respect to degradation, a phenomenon that we call the stress redundancy principle. For a degradation field restricted to a narrow subregion, we use an optimal control approach to derive the optimal trajectory where the fastest escape particles will be concentrated: interestingly, we report here that the optimal trajectories avoid the degradation area depending on killing intensity. Finally, we obtain analytical expressions for the distribution of first exit points along a narrow absorbing arc in two-dimensional regular domains. In addition, for a killing subregion tangent to the target boundary, our computations reveal how geometrical parameters influence the exit distribution. In summary, a killing source can significantly affect the statistics of the fastest diffusing particles, relevant for defining cellular and molecular time scales.", "url": "https://arxiv.org/abs/2611.14375", "type": "理论+数值", "summary": "降解源如何影响许多相同的独立随机粒子中的第一个粒子成功达到狭窄目标的统计数据仍不清楚。在这里，我们通过利用与相应的福克-普朗克方程相关的时间相关通量来研究退化对首次通过时间和出口位置分布的影响。我们还通过解决混合边值问题来计算逃逸概率。在较大的初始种群 $N_0$ 限制下，我们推导出与最快粒子相关的平均首次通过时间的渐近公式，揭示了杀伤场如何修改经典的 $1/\\log(N_0)$ 缩放。然而，当考虑第一次退出时的人口规模时，我们获得了对退化的特定依赖性，这种现象我们称之为压力冗余原理。对于仅限于狭窄子区域的降解场，我们使用最优控制方法来推导最快逃逸粒子将集中的最佳轨迹：有趣的是，我们在此报告最佳轨迹根据杀伤强度避开降解区域。\n\n最后，我们获得了二维正则域中第一出口点沿窄吸收弧分布的解析表达式。此外，对于与目标边界相切的杀伤子区域，我们的计算揭示了几何参数如何影响出口分布。总之，杀伤源可以显着影响最快扩散粒子的统计数据，这与定义细胞和分子时间尺度相关。", "authors": [{"name": "Frédéric Paquin-Lefebvre"}, {"name": "Élisa Delbreil"}, {"name": "David Holcman"}], "featured_authors": [{"name": "Frédéric Paquin-Lefebvre"}, {"name": "Élisa Delbreil"}, {"name": "David Holcman"}], "author_count": 3}, {"id": "2611.14446", "category": "cond-mat", "title": "The active chiral random walk", "abstract": "We introduce a minimal and intuitive lattice model for an active chiral particle which exhibits persistence, reversal, and chirality in its dynamics. It is fully defined by a small set of microscopic parameters that provide transparent control over the resulting dynamics. By coarse-graining, we extract continuum equations and closed-form expressions for the velocity autocorrelation, off-diagonal directional correlation, mean-squared displacement, and long-time diffusion and odd diffusion coefficients. The complex parameter $\\lambda=q_p+\\mathrm{i}q_c$ thereby encodes the microscopic information on persistence ($q_p$) and chirality ($q_c$) of the walker. In a weak-turning limit, microscopically realized by infrequent reorientation events, the continuum description can be mapped onto well-established models of active matter. Outside this limit the discrete model exhibits finite-step dynamics, such as anti-persistent motion, that are not captured by a smooth angular-diffusion description. The model therefore provides a compact, exactly solvable, and readily tunable framework in which a small number of transparent microscopic parameters control chiral active transport.", "url": "https://arxiv.org/abs/2611.14446", "type": "理论", "summary": "我们为活性手性粒子引入了一个最小且直观的晶格模型，该模型在其动力学中表现出持久性、反转性和手性。它完全由一小组微观参数定义，这些参数提供对结果动态的透明控制。通过粗粒度，我们提取了速度自相关、非对角方向相关、均方位移以及长时间扩散和奇扩散系数的连续方程和封闭式表达式。复杂参数 $\\lambda=q_p+\\mathrm{i}q_c$ 从而对步行者的持久性（$q_p$）和手性（$q_c$）的微观信息进行编码。在弱转动极限下，通过不频繁的重定向事件在微观上实现，连续统描述可以映射到已建立的活性物质模型上。在此限制之外，离散模型表现出有限步动力学，例如反持续运动，而平滑的角扩散描述无法捕获这些动力学。因此，该模型提供了一个紧凑、可精确求解且易于调节的框架，其中少量透明的微观参数控制手性主动传输。", "authors": [{"name": "Nir Sherf"}, {"name": "Joshua Uhlig"}, {"name": "Jan Wójcik"}, {"name": "Ralf Metzler"}, {"name": "Yael Roichman"}, {"name": "Erik Kalz"}], "featured_authors": [{"name": "Nir Sherf"}, {"name": "Joshua Uhlig"}, {"name": "Jan Wójcik"}, {"name": "Ralf Metzler"}, {"name": "Yael Roichman"}, {"name": "Erik Kalz"}], "author_count": 6}, {"id": "2611.14501", "category": "cond-mat", "title": "Mutual Linearity in Nonlinear Population Dynamics", "abstract": "Mutual Linearity in Nonlinear Population DynamicsMutual linearity, the persistence of affine relations among stationary observables under arbitrarily strong changes of one transition rate, is known for Markov jump processes and chemical reaction networks. We show that generalized Lotka--Volterra dynamics form a new class of mutually linear systems, even though species can go extinct and attractors can be chaotic. Any change to one species' equation acts on the others as one effective press and keeps all abundances affinely related: piecewise across extinctions, and as time averages on chaotic attractors.", "url": "https://arxiv.org/abs/2611.14501", "type": "理论", "summary": "非线性总体动力学中的互线性互线性，即在一种跃迁速率的任意强烈变化下，固定可观测量之间仿射关系的持续性，以马尔可夫跳跃过程和化学反应网络而闻名。我们证明了广义的 Lotka-Volterra 动力学形成了一类新的互线性系统，尽管物种可能灭绝并且吸引子可能是混乱的。一个物种方程的任何变化都会作为一种有效的压力作用于其他物种，并使所有丰度保持密切相关：在灭绝过程中分段，以及混沌吸引子的时间平均值。", "authors": [{"name": "Shiling Liang"}], "featured_authors": [{"name": "Shiling Liang"}], "author_count": 1}, {"id": "2611.13071", "category": "hep-th", "title": "Tripartite nonlocal magic from reflected and negativity spectra", "abstract": "A tripartite pure state is local-unitary equivalent to a stabilizer state if and only if its marginal, reflected, and negativity spectra (up to signs) are flat. These conditions are quantified using anti-flatness, giving a diagnostic of tripartite nonlocal magic that is computable and experimentally measurable using randomized measurements. In non-abelian quantum doubles, it appears only when the triple points of the tripartition lie on plaquettes. In random tensor networks, it appears exactly when the entanglement wedge of two boundary regions connects.", "url": "https://arxiv.org/abs/2611.13071", "type": "理论", "summary": "当且仅当其边缘谱、反射谱和负谱（直至符号）平坦时，三方纯态才与稳定态等效。这些条件使用反平坦度进行量化，从而对三方非局部魔力进行诊断，该诊断可使用随机测量进行计算和实验测量。在非阿贝尔量子双打中，只有当三分的三相点位于斑块上时，它才会出现。在随机张量网络中，它恰好出现在两个边界区域的纠缠楔连接时。", "authors": [{"name": "Sriram Akella"}], "featured_authors": [{"name": "Sriram Akella"}], "author_count": 1}, {"id": "2611.13074", "category": "hep-th", "title": "Four-charge Rotating AdS Black Holes in Gauged STU Supergravity", "abstract": "We present an exact solutions for non-extremal rotating AdS black holes with four independent charges in four-dimensional gauged STU supergravity. The scalar potential introduced by gauging breaks the hidden symmetry underlying solution-generating methods in the ungauged theory, making the construction of such solutions a longstanding challenge. We analyse the global properties of the solution and derive its thermodynamic quantities. We further take the BPS limit and show that the resulting entropy agrees with the known microscopic result obtained from the dual conformal field theory.", "url": "https://arxiv.org/abs/2611.13074", "type": "理论", "summary": "我们提出了四维测量 STU 超重力中具有四个独立电荷的非极值旋转 AdS 黑洞的精确解。计量引入的标量势打破了非计量理论中解决方案生成方法背后隐藏的对称性，使得此类解决方案的构建成为长期的挑战。我们分析溶液的整体性质并推导其热力学量。我们进一步采用 BPS 极限并表明所得熵与从双共形场理论获得的已知微观结果一致。", "authors": [{"name": "Liang Ma"}, {"name": "H. Lu"}], "featured_authors": [{"name": "Liang Ma"}, {"name": "H. Lu"}], "author_count": 2}, {"id": "2611.13078", "category": "hep-th", "title": "More physics at the entangling surface: boundary conditions and entanglement in 2d TQFT", "abstract": "We present a systematic treatment of entanglement in two-dimensional topological quantum field theories (TQFTs). Our approach clarifies the sensitivity of entanglement measures to the cutting maps that implement Hilbert space factorization. Such maps embed the TQFT Hilbert space into a description with potentially more degrees of freedom, and for entanglement to be well defined they must be isometric, i.e., they must preserve the norms of all states. We show that the naïve cutting map based solely upon path integration subject to boundary conditions is not isometric for generic TQFTs. For any 2d TQFT, we give a prescription to construct isometric cutting maps by dressing path integration with suitable edge operators. This allows us to compute entanglement for any state, any bipartition, and any boundary condition. As a consequence, we find a non-integer \"ground-state degeneracy\" à la Affleck-Ludwig, despite all boundary conditions being gapped. We further show how to reconstruct the partition function of the TQFT at arbitrary genus from the multi-interval Rényi entropies of a single state. For theories with (possibly non-invertible) symmetries, we show that the entanglement entropy of the symmetric ground state can distinguish gapped phases with the same symmetry, without any further knowledge of their vacua, while the entanglement asymmetry of the vacua entropically detects symmetry breaking. We illustrate our formalism with a range of applications, from finite gauge theories to Haagerup gapped phases and infrared phases of adjoint QCD$_2$.", "url": "https://arxiv.org/abs/2611.13078", "type": "理论", "summary": "我们提出了二维拓扑量子场论（TQFT）中纠缠的系统处理。我们的方法阐明了纠缠测量对实现希尔伯特空间分解的切割图的敏感性。此类映射将 TQFT 希尔伯特空间嵌入到具有潜在更多自由度的描述中，并且为了很好地定义纠缠，它们必须是等距的，即它们必须保留所有状态的规范。我们表明，仅基于受边界条件影响的路径积分的朴素切割图对于通用 TQFT 来说不是等距的。对于任何 2d TQFT，我们给出了通过与合适的边缘算子进行修整路径集成来构建等距切割图的处方。这使我们能够计算任何状态、任何二分和任何边界条件的纠缠。因此，尽管所有边界条件都有缺口，我们还是发现了阿弗莱克-路德维希那样的非整数“基态简并”。我们进一步展示了如何从单个状态的多区间 Rényi 熵重建任意属处的 TQFT 配分函数。\n\n对于具有（可能不可逆）对称性的理论，我们证明对称基态的纠缠熵可以区分具有相同对称性的带隙相，而无需进一步了解它们的真空，而真空熵的纠缠不对称性可以检测对称性破缺。我们通过一系列应用来说明我们的形式主义，从有限规范理论到 Haagerup 有隙相和伴随 QCD$_2$ 的红外相。", "authors": [{"name": "Jackson R. Fliss"}, {"name": "Alan Rios Fukelman"}, {"name": "Stathis Vitouladitis"}], "featured_authors": [{"name": "Jackson R. Fliss"}, {"name": "Alan Rios Fukelman"}, {"name": "Stathis Vitouladitis"}], "author_count": 3}, {"id": "2611.13086", "category": "hep-th", "title": "Type IIB instanton corrections from pure modular unfolding", "abstract": "We study the reconstruction of instanton corrections to type IIB higher-derivative interactions from their low Fourier modes using modular symmetry, without invoking supersymmetry differential equations. This provides a framework for studying non-BPS interactions through their modular coefficient functions. For the $D^6R^4$ coefficient, Rankin-Selberg unfolding determines the continuous spectral overlap from the complete zero mode. Assuming the conjectured simplicity of the even cusp spectrum, we extract the cusp amplitudes from Mellin residues of the complete first mode. We combine both contributions to reconstruct all higher Fourier modes, using Hecke relations for the cusp contribution. Using the Kuznetsov trace formula and bounds on the spectral tail, we derive the $g_s^{-1/2}$ and constant terms in the weak-coupling instanton prefactor at every fixed positive charge. The leading term arises collectively from the infinite cusp sum, and both coefficients agree with the known expansion. With incomplete low-mode data, we construct modular ambiguities and give sufficient conditions for the stability of leading higher-charge coefficients. Applied to the supplied $D^8R^4$ data, these results identify the additional information needed for higher-charge predictions.", "url": "https://arxiv.org/abs/2611.13086", "type": "理论", "summary": "我们研究使用模对称性从低傅里叶模式重建 IIB 型高导数相互作用的瞬子校正，而不调用超对称微分方程。这提供了一个通过模系数函数研究非 BPS 相互作用的框架。对于 $D^6R^4$ 系数，Rankin-Selberg 展开确定了完全零模式的连续光谱重叠。假设均匀尖点频谱的推测简单，我们从完整第一模式的梅林残数中提取尖点幅度。我们结合这两种贡献来重建所有更高的傅里叶模式，使用赫克关系作为尖点贡献。使用库兹涅佐夫迹公式和谱尾上的界限，我们推导出每个固定正电荷处弱耦合瞬子前因子中的 $g_s^{-1/2}$ 和常数项。首项由无限尖点和共同产生，并且两个系数都与已知展开式一致。利用不完整的低模数据，我们构建了模模糊度，并为领先的高电荷系数的稳定性提供了充分的条件。\n\n应用于提供的 $D^8R^4$ 数据，这些结果确定了更高电荷预测所需的附加信息。", "authors": [{"name": "Amineh Mohseni"}], "featured_authors": [{"name": "Amineh Mohseni"}], "author_count": 1}, {"id": "2611.13088", "category": "hep-th", "title": "Holographic Drag Force and the Entanglement Membrane: Geometric Reconstruction and Information Spreading", "abstract": "A central question in holography is how different boundary observables encode and reconstruct the geometry of the gravitational dual. In this work, we uncover an exact geometric correspondence between two seemingly distinct aspects of strongly coupled dynamics: the dissipative drag force experienced by a moving heavy particle(quark) and the entanglement membrane governing the propagation of quantum information. We show that both constructions retain the same underlying structure of the geometry, leading to an invertible transformation between the finite-velocity drag force and the geometric membrane tension. This correspondence reveals that nonlinear momentum loss encodes detailed information about entanglement dynamics: the leading nonlinear correction determines the butterfly velocity, while higher-order terms successively probe the local geometry of the membrane near the horizon. We further connect this hierarchy to scalar pole-skipping, establishing an all-order relation between nonlinear dissipation and near-horizon spectral data. The shared geometric structure also has implications for quantum information recovery, with the quintic drag coefficient determining the leading dependence of information velocity on initial entanglement. Conversely, the complete information-velocity curve provides a reconstruction of the reduced bulk geometry along the physical interior membrane branch, complementing the exterior reconstruction from drag. We show that stochastic momentum broadening supplies the additional radial information needed to reconstruct the complete exterior metric up to an overall scale. Our results thus reveal how dissipation, entanglement dynamics, and spectral properties provide complementary access to holographic geometry, establishing a unified framework for understanding the geometric information encoded in distinct boundary observables.", "url": "https://arxiv.org/abs/2611.13088", "type": "理论", "summary": "全息术的一个中心问题是不同的边界可观测量如何编码和重建引力对偶的几何形状。在这项工作中，我们揭示了强耦合动力学的两个看似不同的方面之间的精确几何对应关系：运动的重粒子（夸克）所经历的耗散阻力和控制量子信息传播的纠缠膜。我们表明，两种结构都保留了相同的几何基础结构，导致有限速度拖曳力和几何膜张力之间的可逆转换。这种对应关系揭示了非线性动量损失编码了有关纠缠动力学的详细信息：领先的非线性校正决定了蝴蝶速度，而高阶项则相继探测地平线附近膜的局部几何形状。我们进一步将这种层次结构与标量极点跳跃联系起来，在非线性耗散和近地平线光谱数据之间建立全阶关系。\n\n共享的几何结构也对量子信息恢复有影响，五次阻力系数决定了信息速度对初始纠缠的主要依赖性。相反，完整的信息速度曲线提供了沿着物理内部膜分支的减少的体积几何形状的重建，补充了阻力的外部重建。我们表明，随机动量展宽提供了在整体尺度上重建完整的外部度量所需的额外径向信息。因此，我们的结果揭示了耗散、纠缠动力学和光谱特性如何提供对全息几何的补充访问，建立一个统一的框架来理解不同边界可观测量中编码的几何信息。", "authors": [{"name": "Dmitry S. Ageev"}], "featured_authors": [{"name": "Dmitry S. Ageev"}], "author_count": 1}, {"id": "2611.13092", "category": "hep-th", "title": "Moduli spaces in CFT: vortex defects", "abstract": "We construct and study a class of codimension-two conformal defects in CFTs with spontaneously broken conformal symmetry, assuming that a continuous global symmetry is also broken on the moduli space. Our construction can be viewed as an analytic continuation of the saddle point describing large charge operators and generalizes known BPS defects in supersymmetric theories, such as Gukov-Witten surface operators in $\\mathcal{N}=4$ SYM and vortex loops in ABJM theory, but does not rely on supersymmetry. These defects are characterized by continuous, unbounded parameters controlling the expectation values of operators parametrizing the moduli space, and interpolate between a quantum regime and a semiclassical regime in which the local physics approaches that of the symmetry-breaking vacuum. This connection allows us to derive exact results from the effective description of the broken phase. In particular, our results for Gukov-Witten surface operators agree with localization, and we compute the $g$-function for a broad class of $1/2$-BPS vortex loops in ABJM theory. Finally, we relate the spectrum of defect operators, in a suitable scaling limit, to the spectrum of massive particles in the symmetry-breaking vacuum.", "url": "https://arxiv.org/abs/2611.13092", "type": "理论", "summary": "我们构建并研究了 CFT 中的一类余维二共形缺陷，其共形对称性自发破缺，假设连续的全局对称性在模空间上也被破缺。我们的构造可以被视为描述大电荷算子的鞍点的解析延续，并概括了超对称理论中已知的 BPS 缺陷，例如 $\\mathcal{N}=4$ SYM 中的 Gukov-Witten 表面算子和 ABJM 理论中的涡环，但不依赖于超对称性。这些缺陷的特征是连续的、无界的参数，控制参数化模空间的算子的期望值，并在量子态和半经典态之间进行插值，其中局部物理接近对称破缺真空。这种联系使我们能够从破碎相的有效描述中得出准确的结果。特别是，我们对 Gukov-Witten 表面算子的结果与定位一致，并且我们在 ABJM 理论中计算了广泛类别的 $1/2$-BPS 涡旋环的 $g$ 函数。\n\n最后，我们将在适当的尺度限制下的缺陷算子的光谱与对称破缺真空中的大质量粒子的光谱联系起来。", "authors": [{"name": "Gabriel Cuomo"}, {"name": "Adar Sharon"}], "featured_authors": [{"name": "Gabriel Cuomo"}, {"name": "Adar Sharon"}], "author_count": 2}, {"id": "2611.13093", "category": "hep-th", "title": "Categorical RMT", "abstract": "Random matrix theory (RMT) describes the level statistics of chaotic systems one symmetry sector at a time. We propose its analogue for local quantum systems on a circle with ordinary or non-invertible symmetries. Symmetry defects define twisted Hilbert spaces, and the symmetry sectors are irreducible representations of the tube algebra, which acts within and between these spaces. Under our proposal, the symmetry fixes exact degeneracies and identifications among sectors, and ordinary RMT describes the rest, with unrelated blocks treated as statistically independent. We call this categorical RMT. For a non-invertible symmetry it goes beyond ordinary RMT, since Hilbert spaces with different twists can share a sector, and so part of their spectrum, though no invertible symmetry relates them. We confirm this in a chaotic Fibonacci anyon chain, and check the framework in chaotic $S_3$ chains. We extend categorical RMT to primary states at fixed spin in 1+1-dimensional CFTs, where modular covariance requires additional correlations. For continuous symmetries, the Sugawara construction and spectral flow isolate a neutral spectrum, which can have symplectic statistics even in a bosonic theory. In holographic CFTs, torus wormholes decorated by the SymTFT or by Chern--Simons theory realize the predicted ramp and its modular completion.", "url": "https://arxiv.org/abs/2611.13093", "type": "理论", "summary": "随机矩阵理论（RMT）描述了一次一个对称扇区的混沌系统的水平统计。我们提出了具有普通或不可逆对称性的圆上局域量子系统的模拟。对称缺陷定义了扭曲的希尔伯特空间，而对称扇区是管代数的不可约表示，它在这些空间之内和之间起作用。根据我们的建议，对称性修复了扇区之间的精确简并和标识，普通 RMT 描述了其余部分，不相关的块被视为统计上独立的。我们称之为绝对 RMT。对于不可逆对称性，它超出了普通的 RMT，因为具有不同扭曲的希尔伯特空间可以共享一个扇区，因此可以共享其频谱的一部分，尽管没有可逆对称性将它们关联起来。我们在混沌斐波那契任意子链中确认了这一点，并检查了混沌 $S_3$ 链中的框架。我们将分类 RMT 扩展到 1+1 维 CFT 中固定自旋的主要状态，其中模协方差需要额外的相关性。\n\n对于连续对称性，菅原构造和谱流分离出中性谱，即使在玻色子理论中也可以具有辛统计量。在全息 CFT 中，由 SymTFT 或 Chern-Simons 理论装饰的环面虫洞实现了预测的斜坡及其模块化完成。", "authors": [{"name": "Chuanxin Cui"}, {"name": "Kristan Jensen"}, {"name": "Sridip Pal"}, {"name": "Moshe Rozali"}], "featured_authors": [{"name": "Chuanxin Cui"}, {"name": "Kristan Jensen"}, {"name": "Sridip Pal"}, {"name": "Moshe Rozali"}], "author_count": 4}, {"id": "2611.13097", "category": "hep-th", "title": "BPS Bootstrap", "abstract": "We apply the large $N$ matrix bootstrap technique to constrain expectation values of simple operators in heavy BPS states that are dual to classical geometries. For states dual to horizonless geometries, their explicit moduli give rise to large allowable regions in the bootstrap, while for black holes, a converging bootstrap should find islands. We explore this method in $\\mathcal{N}=4$ $SU(N)$ super Yang-Mills theory at large $N$, working at weak coupling and focusing on BPS states with scaling dimensions of order $N^2$. For the $1/2$, $1/4$, and $1/8$-BPS sectors, the bootstrap finds large regions, in agreement with an eigenvalue description of such states in the limit of large charges. We also present preliminary results for a BMN truncation of the $1/16$-BPS sector, which contains states dual to both horizonless geometries and black holes. Isolating the black hole states in the bootstrap remains a challenge.", "url": "https://arxiv.org/abs/2611.13097", "type": "理论", "summary": "我们应用大型 $N$ 矩阵引导技术来约束简单算子在与经典几何对偶的重 BPS 状态下的期望值。对于对偶到无地平线几何形状的状态，它们的显式模量会在引导带中产生较大的允许区域，而对于黑洞，收敛引导带应该找到岛屿。我们在$\\mathcal{N}=4$ $SU(N)$ super Yang-Mills理论中探索了这种方法，在大$N$上，工作在弱耦合，并关注具有$N^2$阶尺度维度的BPS状态。对于 $1/2$、$1/4$ 和 $1/8$-BPS 扇区，引导程序找到大区域，与大费用限制下此类状态的特征值描述一致。我们还提供了 $1/16$-BPS 扇区的 BMN 截断的初步结果，其中包含无地平几何和黑洞的双重状态。在引导程序中隔离黑洞状态仍然是一个挑战。", "authors": [{"name": "Yiming Chen"}], "featured_authors": [{"name": "Yiming Chen"}], "author_count": 1}, {"id": "2611.13102", "category": "hep-th", "title": "Effective scalar-fluid description of thermal first-order phase transitions and their spinodal instabilities", "abstract": "We formulate an improved scalar-fluid effective description of first-order phase transitions in relativistic theories, and test it against a microscopic calculation in a holographic model. The effective theory shows that the nature of the spinodal instability is linked to thermodynamic stability, determined by the sign of the specific heat. When the specific heat is positive, the sound modes are stable and there is a non-hydrodynamic instability. When it is negative, a sound mode becomes unstable instead. The holographic calculation confirms the validity of the effective description at long wavelengths, improving on the purely hydrodynamic description. We also identify a friction coefficient that governs the bubble wall velocity and can be extracted from a holographic correlator.", "url": "https://arxiv.org/abs/2611.13102", "type": "理论", "summary": "我们在相对论理论中制定了一种改进的标量流体对一阶相变的有效描述，并根据全息模型中的微观计算对其进行了测试。有效的理论表明，旋节线不稳定性的本质与热力学稳定性有关，由比热的符号决定。当比热为正时，声模稳定并且存在非流体动力学不稳定性。当它为负时，声音模式反而变得不稳定。全息计算证实了长波长有效描述的有效性，改进了纯流体动力学描述。我们还确定了控制气泡壁速度的摩擦系数，并且可以从全息相关器中提取。", "authors": [{"name": "Alessio Caddeo"}, {"name": "Oscar Henriksson"}, {"name": "Carlos Hoyos"}, {"name": "Mikel Sanchez-Garitaonandia"}, {"name": "Pedro Tarancón-Álvarez"}], "featured_authors": [{"name": "Alessio Caddeo"}, {"name": "Oscar Henriksson"}, {"name": "Carlos Hoyos"}, {"name": "Mikel Sanchez-Garitaonandia"}, {"name": "Pedro Tarancón-Álvarez"}], "author_count": 5}, {"id": "2611.13112", "category": "hep-th", "title": "Resummations In Higher-Curvature Modifications Of Starobinsky Inflation", "abstract": "We study higher-curvature corrections to Starobinsky inflation, which are expected to be generated at the quantum level. When treated perturbatively in the couplings $\\gamma$ of the higher-dimensional operators, these terms produce inverse powers of the slow-roll parameter $\\alpha$, casting doubt on the reliability of the slow-roll expansion. If instead $\\gamma$ is kept exact, the expansion fails to reproduce the Starobinsky model smoothly as $\\gamma\\to 0$. We show that this problem is solved by resumming certain series in the ratio $\\alpha/\\gamma$. The resulting ``improved'' slow-roll expansion is regular in the limit $\\gamma\\to 0$ and gives the same result whether one expands first in $\\gamma$ or in $\\alpha$. We illustrate this explicitly for an $R^3$ term, obtain the power spectra, spectral indices and tensor-to-scalar ratio at next-to-leading order in the improved expansion, and show that results in the recent literature are recovered as the first-order Taylor expansion of ours. Comparing with the latest ACT, Planck and SPT data, we find that the resummed and first-order results differ appreciably only for values of $n_s$ outside the favored regions. Finally, we comment on the origin of higher-curvature operators in UV-complete theories, such as renormalizable quantum gravity, where the predictions of the Starobinsky model are stable.", "url": "https://arxiv.org/abs/2611.13112", "type": "理论", "summary": "我们研究斯塔罗宾斯基暴胀的更高曲率修正，预计将在量子水平上产生。当在高维算子的耦合 $\\gamma$ 中进行扰动处理时，这些项会产生慢滚参数 $\\alpha$ 的反幂，从而对慢滚展开的可靠性产生怀疑。相反，如果 $\\gamma$ 保持精确，则展开无法将 Starobinsky 模型平滑地再现为 $\\gamma\\to 0$。我们证明这个问题可以通过以 $\\alpha/\\gamma$ 的比率恢复某些序列来解决。由此产生的“改进的”慢滚动扩展在 $\\gamma\\ 到 0$ 的限制内是有规律的，并且无论先在 $\\gamma$ 还是在 $\\alpha$ 中扩展，都会给出相同的结果。我们针对 $R^3$ 项明确地说明了这一点，获得了改进展开式中次前阶的功率谱、谱指数和张量标量比，并表明最近文献中的结果被恢复为我们的一阶泰勒展开式。与最新的 ACT、Planck 和 SPT 数据相比，我们发现恢复结果和一阶结果仅对于有利区域之外的 $n_s$ 值存在明显差异。\n\n最后，我们评论了 UV 完全理论中高曲率算子的起源，例如可重整量子引力，其中 Starobinsky 模型的预测是稳定的。", "authors": [{"name": "Marco Piva"}], "featured_authors": [{"name": "Marco Piva"}], "author_count": 1}, {"id": "2611.13122", "category": "hep-th", "title": "Rotational instability and quadrupolar order in BFSS matrix theory", "abstract": "We study the effect of angular momentum on thermal states of the BFSS matrix theory in its gravitational and high-temperature classical regimes. We focus on ensembles with only one non-zero angular momentum. On the gravity side, the rotating ensemble is described by the singly-spinning D$0$ black hole. Beyond a critical rotation, we find that this solution becomes unstable to a non-axisymmetric quadrupolar perturbation. Following this mode non-linearly, we find a new branch of non-axisymmetric rotating black holes that is thermodynamically favoured over the axisymmetric branch in both the microcanonical and canonical ensembles. On the other hand, in the classical matrix limit, we find no evidence for such collective quadrupolar order over the matrix sizes and angular momenta studied. Instead, rotation accelerates the separation of a single D$0$-brane from the clump of branes initially prepared. The separated brane carries a large fraction of the angular momentum by orbiting the rest of the clump at a large in-plane radius. Both the angular momentum share and the orbital radius relative to the clump size increase with the matrix size. These results distinguish a collective quadrupolar deformation in the gravity limit from angular-momentum transfer to a single brane in the classical matrix limit.", "url": "https://arxiv.org/abs/2611.13122", "type": "理论", "summary": "我们研究了角动量对 BFSS 矩阵理论在引力和高温经典状态下的热状态的影响。我们专注于只有一个非零角动量的系综。在引力方面，旋转系综由单旋转 D$0$ 黑洞描述。除了临界旋转之外，我们发现该解对于非轴对称四极扰动变得不稳定。遵循这种非线性模式，我们发现了一个新的非轴对称旋转黑洞分支，在微正则系综和正则系综中，它在热力学上都优于轴对称分支。另一方面，在经典矩阵极限中，我们在所研究的矩阵大小和角动量上没有发现这种集体四极阶的证据。相反，旋转加速了单个 D$0$-膜从最初准备的膜团中的分离。分离的膜通过以大的面内半径绕团块的其余部分运行而携带大部分角动量。相对于团块尺寸的角动量份额和轨道半径都随着基质尺寸的增加而增加。\n\n这些结果将重力极限中的集体四极变形与经典矩阵极限中的角动量转移到单个膜区分开来。", "authors": [{"name": "Jun Liu"}, {"name": "Jorge E. Santos"}], "featured_authors": [{"name": "Jun Liu"}, {"name": "Jorge E. Santos"}], "author_count": 2}, {"id": "2611.13130", "category": "hep-th", "title": "Scale separation and partial supersymmetry breaking", "abstract": "We propose new candidate string theory vacua in which partial supersymmetry breaking occurs within the lower-dimensional effective theory in anti-de Sitter space, parametrically below the Kaluza--Klein scale. These vacua solve the equations of motion of massless type IIA supergravity in the smeared approximation and exhibit parametric scale separation, at both weak and strong string coupling. They are reproduced as $\\mathcal N=1$ supersymmetric phases of a three-dimensional $\\mathcal N=2$ gauged supergravity. Should these vacua be solutions of string theory, they would provide explicit setups in which partial supersymmetry breaking can be studied at energies parametrically below the compactification scale. In addition, we further comment on our previously proposed solution with scale separation and extended supersymmetry.", "url": "https://arxiv.org/abs/2611.13130", "type": "理论", "summary": "我们提出了新的候选弦理论真空，其中部分超对称破缺发生在反德西特空间的低维有效理论内，参数低于卡鲁扎-克莱因尺度。这些真空以弥散近似求解无质量 IIA 型超重力的运动方程，并在弱弦耦合和强弦耦合下表现出参数尺度分离。它们被再现为三维 $\\mathcal N=2$ 测量超重力的 $\\mathcal N=1$ 超对称相。如果这些真空是弦理论的解，它们将提供明确的设置，其中可以在参数化低于致密尺度的能量下研究部分超对称破缺。此外，我们进一步评论了我们之前提出的具有尺度分离和扩展超对称性的解决方案。", "authors": [{"name": "Niccolò Cribiori"}, {"name": "Fotis Farakos"}, {"name": "Alexandros Zarafonitis"}], "featured_authors": [{"name": "Niccolò Cribiori"}, {"name": "Fotis Farakos"}, {"name": "Alexandros Zarafonitis"}], "author_count": 3}, {"id": "2611.13151", "category": "hep-th", "title": "General non-extremal rotating charged AdS black hole solutions with four independent charge parameters in $D=4$, STU gauged supergravity", "abstract": "We present an exact solution for generic non-extremal rotating, charged black holes with a negative cosmological constant in four-dimensional $\\mathcal{N}=2, U(1)^4$ gauged supergravity. This general non-extremal solution contains seven independent parameters related to the mass, rotation, two electric and two magnetic charges, as well as a nonzero cosmological constant. It generalizes the four-dimensional Cvetič-Youm black hole solution to the gauged supergravity case. We anticipate that this is the only regular black hole solution in four-dimensional gauged STU model without any Misner string singularity and/or C-metric-like conical defect on the symmetry axes. We also investigate its thermodynamic property and give the Killing-Stäckel tensor responsible for the separability of Hamilton-Jacobi and massless Klein-Gordon equations. Various special cases related to the known solution are discussed, and its BPS limit is also analyzed. Our solution provides a new background to test the AdS$_4$/CFT$_3$ correspondence and to study the microscopic entropy via extremization of the BPS index.", "url": "https://arxiv.org/abs/2611.13151", "type": "理论", "summary": "我们为四维 $\\mathcal{N}=2, U(1)^4$ 计量超重力中具有负宇宙学常数的通用非极值旋转带电黑洞提出了精确解。这个一般的非极值解包含与质量、旋转、两个电荷和两个磁荷相关的七个独立参数，以及一个非零宇宙常数。它将四维 Cvetič-Youm 黑洞解推广到了测量超重力情况。我们预计这是四维测量 STU 模型中唯一的常规黑洞解，对称轴上没有任何米斯纳弦奇点和/或类似 C 度量的圆锥形缺陷。我们还研究了它的热力学性质，并给出了负责 Hamilton-Jacobi 和无质量 Klein-Gordon 方程可分离性的 Killing-Stäckel 张量。讨论了与已知解决方案相关的各种特殊情况，并分析了其 BPS 限制。我们的解决方案提供了一个新的背景来测试 AdS$_4$/CFT$_3$ 对应关系并通过 BPS 指数的极端化来研究微观熵。", "authors": [{"name": "Di Wu"}, {"name": "Shuang-Qing Wu"}], "featured_authors": [{"name": "Di Wu"}, {"name": "Shuang-Qing Wu"}], "author_count": 2}, {"id": "2611.13152", "category": "hep-th", "title": "Nuclear geometry under external magnetic field in the Skyrme-Maxwell model", "abstract": "We find static solutions of the U(1) gauged Skyrme-Maxwell model in a constant external magnetic field, for baryon numbers $B \\leq 6$. The field acts as an isospin-breaking source, stretching the skyrmion along its direction, while its size grows and then shrinks as the induction increases. We obtain the energy minimizers with a GPU implementation of the arrested Newton flow (ANF) algorithm. Gauged skyrmions have less energy and are more strongly bound than their ungauged counterpart. At weak magnetic field, the solutions are small deformations of the ungauged skyrmions, including regions of negative baryon density in sectors $B = 3, 5, 6$. For intermediate field, novel geometries appear, notably a $(B-1)$-toroidal chain. High field values lead to axially symmetric toroidal structures for all $B$.", "url": "https://arxiv.org/abs/2611.13152", "type": "理论", "summary": "我们找到了 U(1) 测量的 Skyrme-Maxwell 模型在恒定外部磁场中的静态解，重子数为 $B \\leq 6$。该场充当同位旋破坏源，沿其方向拉伸斯格明子，而其尺寸随着感应强度的增加而先增大后缩小。我们通过 GPU 实现捕获牛顿流 (ANF) 算法获得能量最小化器。与未测量的斯格明子相比，测量的斯格明子的能量更少，束缚也更强。在弱磁场下，解决方案是未测量的斯格明子的小变形，包括扇区 $B = 3, 5, 6$ 中的负重子密度区域。对于中间场，出现了新颖的几何形状，特别是$(B-1)$-环形链。高场值导致所有 $B$ 都是轴对称环形结构。", "authors": [{"name": "Christoph Adam"}, {"name": "Andrés R. Anadón"}, {"name": "Carlos Naya"}, {"name": "Thomas Winyard"}], "featured_authors": [{"name": "Christoph Adam"}, {"name": "Andrés R. Anadón"}, {"name": "Carlos Naya"}, {"name": "Thomas Winyard"}], "author_count": 4}, {"id": "2611.13261", "category": "hep-th", "title": "Expiscating the black hole singularity in holography", "abstract": "We argue that the leading exponential rate in the high frequency asymptotics of holographic thermal two-point functions is independent of the conformal dimension and spin (held fixed) of the operator. We analyze the leading universal WKB spectral curve governing the asymptotics at non-vanishing momentum scaling with frequency. We show that its classical action governs time domain signatures of the bouncing geodesic singularity, highly damped quasinormal modes, and the asymptotics of multi-stress tensor OPE coefficients. Beyond the leading order, we examine linear and dimension-dependent sublinear scalings of momentum with frequency. In both regimes, we derive the connection matrix between the boundary and the horizon using exact-WKB techniques. The results show a factorization of the spectral function into a perturbative part controlled by the OPE and a non-perturbative part governed by WKB transport. For linear scaling at fixed $k/\\omega$ in the timelike regime, the turning points controlling physical transport remain separated from the curvature singularity. Nevertheless, a singularity-anchored representative of the same transport homology class determines the leading WKB action. In the sublinear regime, the relevant turning points approach the singularity. We match an exact solution of the near-singularity scaled equation to the exterior WKB solution to determine the connection matrix and spectral function. Our results clarify how the black hole curvature singularity is encoded in dual field theory observables at leading order in the planar expansion.", "url": "https://arxiv.org/abs/2611.13261", "type": "理论", "summary": "我们认为，全息热两点函数的高频渐近的领先指数率与算子的共形尺寸和自旋（保持固定）无关。我们分析了领先的通用 WKB 谱曲线，该曲线控制着随频率变化的非零动量缩放的渐进性。我们证明了它的经典作用控制着弹跳测地奇点、高阻尼准正则模式和多应力张量 OPE 系数的渐近性的时域特征。除了主阶之外，我们还研究了动量随频率的线性和尺寸相关的次线性缩放。在这两种情况下，我们都使用精确 WKB 技术导出边界和地平线之间的连接矩阵。结果表明，谱函数分解为由 OPE 控制的微扰部分和由 WKB 传输控制的非微扰部分。对于类时机制中固定 $k/\\omega$ 的线性缩放，控制物理传输的转折点与曲率奇点保持分离。然而，相同传输同源类的奇点锚定代表决定了主要的 WKB 行为。\n\n在次线性区域中，相关转折点接近奇点。我们将近奇异性缩放方程的精确解与外部 WKB 解相匹配，以确定连接矩阵和谱函数。我们的结果阐明了黑洞曲率奇点是如何在平面膨胀的前导阶上编码在双场论可观测量中的。", "authors": [{"name": "Hewei Frederic Jia"}, {"name": "Mukund Rangamani"}], "featured_authors": [{"name": "Hewei Frederic Jia"}, {"name": "Mukund Rangamani"}], "author_count": 2}, {"id": "2611.13444", "category": "hep-th", "title": "Giant Graviton Correlators: From Non-maximal to Dual, Bootstrap and Hidden Symmetry", "abstract": "We compute four-point functions of two light $\\frac{1}{2}$-BPS operators and two heavy giant graviton operators in $\\mathcal{N}=4$ super Yang--Mills theory at large $N$ and infinite 't Hooft coupling. Using bootstrap techniques, we determine the correlators for arbitrary light-operator dimensions and arbitrary allowed sizes of non-maximal sphere and dual giant gravitons. We show that these correlators exhibit a hidden ten-dimensional conformal symmetry, allowing them to be organized into compact generating functions. Remarkably, the generating functions for both types of giant gravitons can be obtained from the maximal giant case through $SO(2,10)$ rotations in the embedding space.", "url": "https://arxiv.org/abs/2611.13444", "type": "理论", "summary": "我们在 $\\mathcal{N}=4$ super Yang--Mills 理论中计算两个轻 $\\frac{1}{2}$-BPS 算子和两个重巨引力子算子在大 $N$ 和无限 't Hooft 耦合下的四点函数。使用引导技术，我们确定任意光算子维度和非最大球体和双巨引力子的任意允许大小的相关器。我们证明这些相关器表现出隐藏的十维共形对称性，使它们能够被组织成紧凑的生成函数。值得注意的是，两种巨引力子的生成函数都可以通过嵌入空间中的 $SO(2,10)$ 旋转从最大巨情况获得。", "authors": [{"name": "Qi Chen"}, {"name": "Zhongjie Huang"}, {"name": "Yunfeng Jiang"}, {"name": "Xinan Zhou"}], "featured_authors": [{"name": "Qi Chen"}, {"name": "Zhongjie Huang"}, {"name": "Yunfeng Jiang"}, {"name": "Xinan Zhou"}], "author_count": 4}, {"id": "2611.13484", "category": "hep-th", "title": "Boundary dualities of symplectic Chern-Simons theories and minimal models", "abstract": "We propose that a Neumann-type boundary condition of the 3d $\\mathcal{N}=2$ $USp(2n)$ Chern-Simons theory at the level $-(n+\\frac32)$ with a fundamental chiral multiplet is dual to a Dirichlet-type boundary condition of an Abelian rank-$0$ theory. In a topological twist we propose that it supports the affine vertex operator algebra (VOA) $L_n(\\mathfrak{osp}(1|2))$. With the corresponding specialization of the fugacities, the line defect half-indices of the antisymmetric Wilson lines give, up to monomials, the supercharacters of all its modules, which coincide up to signs with the characters of the Virasoro minimal model $M(2,2n+3)$. We extend the duality to the level $-(n+\\ell+\\frac12)$ and propose that the boundary VOA is $L_n(\\mathfrak{osp}(1|2\\ell))$. Together with the Giveon-Kutasov type duality and the mirror symmetry, the proposed dualities form a web of dualities of the boundary conditions and the line operators. For other gauge groups with real matter we propose that the boundary VOA in the holomorphic twist is the commutant of the gauge currents in free real fermions, which is the Ising model for $Spin(7)$ with the spinor and the $\\mathcal N=1$ superconformal minimal model $SM(3,5)$ for $G_2$ with $\\mathbf7$.", "url": "https://arxiv.org/abs/2611.13484", "type": "理论", "summary": "我们提出，具有基本手性多重态的 3d $\\mathcal{N}=2$ $USp(2n)$ Chern-Simons 理论在 $-(n+\\frac32)$ 水平上的诺伊曼型边界条件与阿贝尔秩 -$0$ 理论的狄利克雷型边界条件是对偶的。在拓扑扭曲中，我们建议它支持仿射顶点算子代数（VOA）$L_n(\\mathfrak{osp}(1|2))$。通过相应的逸度专门化，反对称 Wilson 线的线缺陷半指数给出了其所有模块的超字符（直至单项式），这些超字符与 Virasoro 最小模型 $M(2,2n+3)$ 的符号一致。我们将对偶性扩展到 $-(n+\\ell+\\frac12)$ 级别，并提出边界 VOA 为 $L_n(\\mathfrak{osp}(1|2\\ell))$。与吉文-库塔索夫型对偶性和镜像对称性一起，所提出的对偶性形成了边界条件和线算子的对偶性网络。\n\n对于其他具有真实物质的规范组，我们建议全纯扭曲中的边界 VOA 是自由实费米子中规范电流的交换子，它是带有旋量的 $Spin(7)$ 的伊辛模型和带有 $\\mathbf7$ 的 $G_2$ 的 $\\mathcal N=1$ 超共形最小模型 $SM(3,5)$。", "authors": [{"name": "Yu Nakayama"}, {"name": "Tadashi Okazaki"}], "featured_authors": [{"name": "Yu Nakayama"}, {"name": "Tadashi Okazaki"}], "author_count": 2}, {"id": "2611.13554", "category": "hep-th", "title": "Bions and infrared renormalons in Kähler sigma models with $U(1)$ isotropy", "abstract": "We study semiclassical bion contributions to the vacuum energy of Kähler sigma models with two-dimensional target spaces on $\\mathbb{R} \\times S^1$ with twisted boundary conditions. This is first illustrated in the deformed $\\mathbb{CP}^1$ model, where explicit real and complex bion solutions are constructed in a manner analogous to that used in its quantum-mechanical reduction [1]. Evaluating the bosonic and fermionic fluctuations at one loop, we obtain the effective action with both the coupling constant and the elongation parameter properly renormalized. Integration over the bion quasi-moduli space using Lefschetz thimbles then gives the leading nonperturbative contribution, which the real and complex bion contributions cancel at the supersymmetric point, while the first imaginary ambiguity appears when deviating from the supersymmetric point. Requiring its cancellation against the perturbative ambiguity allows us to infer the corresponding infrared-renormalon pole. This is an explicit example generalizing the resurgent structure of the $\\mathbb{CP}^1$ model in [2] from one coupling to two renormalized parameters. The calculation further extends to Kähler targets of one complex dimension with a $U(1)$ symmetry. At leading dilute one-loop order, the target dependence enters through the moment-map difference and the metric normalizations at the two fixed points. The ambiguity structure and infrared scaling of the bion weight are common to these targets, while the inferred pole position depends on the target metric.", "url": "https://arxiv.org/abs/2611.13554", "type": "理论", "summary": "我们研究了半经典生物对 Kähler sigma 模型真空能的贡献，该模型具有扭曲边界条件的 $\\mathbb{R} \\times S^1$ 上的二维目标空间。这首先在变形的 $\\mathbb{CP}^1$ 模型中得到说明，其中显式实数和复数仿生子解的构造方式类似于其量子力学还原 [1] 中使用的方式。通过评估一个回路中的玻色子和费米子涨落，我们获得了耦合常数和伸长参数适当重整化后的有效作用。使用 Lefschetz 顶针对生物子拟模空间进行积分，然后给出领先的非微扰贡献，实数和复数生物子贡献在超对称点处抵消，而当偏离超对称点时，出现第一个虚模糊性。要求其消除微扰模糊度使我们能够推断出相应的红外重整极点。这是一个明确的例子，概括了[2]中 $\\mathbb{CP}^1$ 模型的复兴结构，从一个耦合到两个重整化参数。\n\n该计算进一步扩展到具有 $U(1)$ 对称性的一个复维度的 Kähler 目标。在领先的稀释单环阶中，目标依赖性通过矩图差异和两个固定点处的度量归一化进入。生物体权重的模糊结构和红外缩放对于这些目标来说是常见的，而推断的极位置取决于目标度量。", "authors": [{"name": "Chao-Hsiang Sheu"}], "featured_authors": [{"name": "Chao-Hsiang Sheu"}], "author_count": 1}, {"id": "2611.13639", "category": "hep-th", "title": "Quantum Langlands correspondence for Painlevé II", "abstract": "We construct an irregular KZ-BPZ correspondence for quantum Painlevé II from a rank-three Wakimoto-Whittaker module. The irregular KZ equation and the quantum isomonodromy equation form a joint affine system whose Drinfeld-Sokolov reduction yields scalar BPZ equations. We obtain matrix-integral solutions of this system for one fundamental insertion. An exact quantum Langlands duality exchanges the fundamental insertion with the zero of the dual Whittaker differential and allows affine solutions to be reconstructed from the BPZ equations. This duality interchanges the classical and Nekrasov-Shatashvili limits, which yield the Painlevé II Lax connection and an irregular Gaudin oper, respectively.", "url": "https://arxiv.org/abs/2611.13639", "type": "理论", "summary": "我们从三阶 Wakimoto-Whittaker 模块构建了量子 Painlevé II 的不规则 KZ-BPZ 对应关系。不规则KZ方程和量子等单方程构成联合仿射系统，其Drinfeld-Sokolov约简得到标量BPZ方程。我们通过一次基本插入获得了该系统的矩阵积分解。精确的量子朗兰兹对偶性将基本插入与对偶惠特克微分的零交换，并允许从 BPZ 方程重建仿射解。这种二元性互换了古典极限和涅克拉索夫-沙塔什维利极限，分别产生了 Painlevé II Lax 连接和不规则高丁歌剧。", "authors": [{"name": "Sibasish Banerjee"}, {"name": "Babak Haghighat"}, {"name": "Jie Sun"}], "featured_authors": [{"name": "Sibasish Banerjee"}, {"name": "Babak Haghighat"}, {"name": "Jie Sun"}], "author_count": 3}, {"id": "2611.13670", "category": "hep-th", "title": "Geometry of Gauge-invariant Quantum Fields", "abstract": "Gauge-invariant representatives of massless gauge fields generally involve inverse differential operators. We trace this non-locality to the homotopy contracting the free gauge complex and replace it, at field level, by a local map using an independent scalar and a differential constraint. We discuss the BRST completion needed to preserve the physical content and the relation to the Stückelberg theory. We finally comment on the extension of this approach to non-Abelian gauge groups via the extension to interactions through $L_\\infty$ homotopy transfer.", "url": "https://arxiv.org/abs/2611.13670", "type": "理论", "summary": "无质量规范场的规范不变表示通常涉及反微分算子。我们将这种非局域性追踪到收缩自由规范复形的同伦性，并在场级别将其替换为使用独立标量和微分约束的局部映射。我们讨论了保留物理内容所需的 BRST 补全以及与 Stückelberg 理论的关系。最后，我们通过 $L_\\infty$ 同伦传递对相互作用的扩展来评论这种方法对非阿贝尔规范群的扩展。", "authors": [{"name": "Andrea Quadri"}], "featured_authors": [{"name": "Andrea Quadri"}], "author_count": 1}, {"id": "2611.13864", "category": "hep-th", "title": "Gravitational Particle Production and Locality of the Wavefunction-Squared", "abstract": "We show that no particle production due to the background geometry implies the locality of the wavefunction-squared for free heavy masses on expanding cosmologies. On global de Sitter of odd dimensions these two stem from the same identity, whereas in the Poincare patch neither occur under any condition. These two phenomena both depend on the behaviour of the out modes at far future and we show that they almost always come together for systems with an out mode that has a phase with separated time and momentum dependency at far future. This will be true for most expanding cosmologies. We comment on how the discussion can be connected to Green's functions and on some previous results in the literature that are seemingly contrary to our conclusions.", "url": "https://arxiv.org/abs/2611.13864", "type": "理论", "summary": "我们证明，由于背景几何形状而没有产生粒子，这意味着膨胀宇宙学上自由重质量的波函数平方的局域性。在奇数维的全局德西特上，这两者源于相同的身份，而在庞加莱补丁中，在任何条件下都不会出现。这两种现象都取决于遥远未来的输出模式的行为，并且我们表明，对于具有输出模式的系统，它们几乎总是在一起，该系统在遥远的未来具有具有独立的时间和动量依赖性的相位。对于大多数膨胀的宇宙学来说都是如此。我们评论了如何将讨论与格林函数联系起来，以及文献中一些看似与我们的结论相反的先前结果。", "authors": [{"name": "Emine Şeyma Kutluk"}], "featured_authors": [{"name": "Emine Şeyma Kutluk"}], "author_count": 1}, {"id": "2611.14022", "category": "hep-th", "title": "Tunneling from an oscillating state in quantum field theory", "abstract": "How does a scalar field oscillating about a metastable minimum decay? For a coherent state with $\\langle q(t) \\rangle = a \\cos mt$ we find two results. When $mR \\ll 1$, with $m$ the mass and $R$ the bubble radius, the decay at time $t$ is a Coleman bubble in the frozen potential $U_t(\\eta) = U(\\langle q \\rangle +\\eta)-U(\\langle q \\rangle)-U'(\\langle q \\rangle)\\eta$, for any amplitude. At small amplitude but any $mR$, $B(t)=B_0 - a \\mathcal{M} \\cos mt+O(a^2)$, with $\\mathcal{M}$ set by the tail of the vacuum bounce; for a thin wall $\\mathcal{M} \\propto e^{mR}$, so exponentially small oscillations change the rate significantly. Both results follow from a Euclidean source construction. The same method computes the tunneling rate of a field slowly rolling in one direction and metastable in another.", "url": "https://arxiv.org/abs/2611.14022", "type": "理论", "summary": "标量场如何围绕亚稳态最小衰减振荡？对于 $\\langle q(t) \\rangle = a \\cos mt$ 的相干态，我们发现两个结果。当 $mR \\ll 1$ 时，以 $m$ 为质量，$R$ 为气泡半径，对于任何振幅，$t$ 时刻的衰减是冻结势 $U_t(\\eta) = U(\\langle q \\rangle +\\eta)-U(\\langle q \\rangle)-U'(\\langle q \\rangle)\\eta$ 中的科尔曼气泡。在小振幅但任何 $mR$ 下，$B(t)=B_0 - a \\mathcal{M} \\cos mt+O(a^2)$，其中 $\\mathcal{M}$ 由真空反弹的尾部设置；对于薄壁 $\\mathcal{M} \\propto e^{mR}$，因此指数级的小振荡会显着改变速率。这两个结果均来自欧几里得源构造。同样的方法可以计算在一个方向上缓慢滚动并在另一个方向上亚稳态的场的隧道率。", "authors": [{"name": "Oliver Janssen"}, {"name": "Matthew Kleban"}, {"name": "Mehrdad Mirbabayi"}, {"name": "Cameron Norton"}], "featured_authors": [{"name": "Oliver Janssen"}, {"name": "Matthew Kleban"}, {"name": "Mehrdad Mirbabayi"}, {"name": "Cameron Norton"}], "author_count": 4}, {"id": "2611.14075", "category": "hep-th", "title": "Landau Theory of Black-Brane Phase Transitions from Kasner Singularities", "abstract": "We develop a Landau theory of a continuous black-brane phase transition using the geometry of the black-hole interior. The normal phase has a Reissner--Nordström Cauchy horizon, whereas the scalarized phase ends at a Kasner singularity. A conserved radial charge determines the grand potential from either endpoint and permits a direct phase comparison. At the critical point, we show analytically that the quadratic correction to the conserved radial charge vanishes. Using the inverse Kasner scalar velocity as an interior order parameter, we then construct a Landau potential whose coefficients are determined entirely from the terminal singularity. The Iyer--Wald first law relates this potential to the conventional boundary Landau theory and fixes its quartic coefficient. For two models with different scalar self-interactions, the resulting theory predicts the critical scaling of the Kasner order parameter and the grand-potential difference between the phases, in agreement with fully backreacted numerical solutions.", "url": "https://arxiv.org/abs/2611.14075", "type": "理论", "summary": "我们利用黑洞内部的几何结构发展了连续黑膜相变的朗道理论。正态相具有 Reissner-Nordström Cauchy 视界，而标量化相则以 Kasner 奇点结束。守恒的径向电荷决定了任一端点的巨大电势，并允许直接进行相位比较。在临界点，我们分析表明，对守恒径向电荷的二次校正消失了。然后，我们使用逆 Kasner 标量速度作为内序参数，构造一个朗道势，其系数完全由终端奇点确定。 Iyer-Wald 第一定律将此势与传统边界朗道理论联系起来，并确定了其四次系数。对于具有不同标量自相互作用的两个模型，所得理论预测了 Kasner 阶次参数的临界标度和相之间的大势差，与完全反作用的数值解一致。", "authors": [{"name": "Hong-Da Lyu"}], "featured_authors": [{"name": "Hong-Da Lyu"}], "author_count": 1}, {"id": "2611.14172", "category": "hep-th", "title": "Generalizations of Courant brackets in the T-dual description of a weakly curved string background", "abstract": "When T-duality is realized as a canonical transformation, the standard Courant bracket is T-dual invariant, while the $B$- and $\\theta$-twisted Courant brackets are exchanged. We determine how these relations are modified for a closed bosonic string moving in a weakly curved background with a constant metric and a Kalb-Ramond field with linear coordinate dependence. We work to first order in its constant field strength. The T-dual background fields depend on a line integral of auxiliary worldsheet gauge fields, making the dual description nonlocal. We construct generalized charges whose parameters depend on this line integral and calculate their Poisson bracket algebra using the T-duality transformation laws and the canonical brackets of the initial theory. The resulting algebra yields a weakly curved generalization of the Courant bracket and its associated Courant algebroid. We establish an explicit isomorphism with the standard Courant algebroid by transporting the bracket, pairing, and anchor. Applying $B$- and $\\theta$-shifts to the dual currents, we obtain weakly curved generalizations of the respective twisted Courant brackets. We show that these brackets provide the T-dual realizations of the initial $\\theta$- and $B$-twisted Courant brackets, respectively, and identify the corresponding Courant algebroid isomorphisms.", "url": "https://arxiv.org/abs/2611.14172", "type": "理论", "summary": "当T-对偶性被实现为规范变换时，标准库兰括号是T-对偶不变量，而$B$-和$\\theta$-扭曲的库兰括号被交换。我们确定如何针对在具有恒定度量的弱弯曲背景中移动的闭合玻色弦和具有线性坐标依赖性的卡尔布-拉蒙德场来修改这些关系。我们在其恒定的场强下工作第一。 T-对偶背景场依赖于辅助世界表规范场的线积分，使得对偶描述非局部。我们构造了参数取决于该线积分的广义电荷，并使用 T 对偶变换定律和初始理论的规范括号来计算其泊松括号代数。由此产生的代数产生了库朗括号及其相关的库朗代数体的弱弯曲概括。我们通过传输括号、配对和锚点与标准库朗代数体建立显式同构。将 $B$- 和 $\\theta$-shifts 应用于对偶电流，我们获得了各自扭曲的库朗括号的弱弯曲概括。\n\n我们证明这些括号分别提供了初始$\\theta$-和$B$-扭曲的Courant括号的T-对偶实现，并确定了相应的Courant代数体同构。", "authors": [{"name": "Ilija Ivanišević"}], "featured_authors": [{"name": "Ilija Ivanišević"}], "author_count": 1}, {"id": "2611.14206", "category": "hep-th", "title": "Yang-Lee edge singularity at $\\mathcal{O}(\\partial^4)$ from the functional renormalization group: revised analysis", "abstract": "We determine the critical exponents of the Yang-Lee edge singularity as continuous functions of dimension using the functional renormalization group, retaining all operators at second and fourth order in the derivative expansion. At fourth order, we obtain $\\eta=-0.153(7)$, $-0.352(9)$ and $-0.575(9)$ in $d=5$, $4$ and $3$, respectively, in agreement with the six-loop $\\epsilon$ expansion. In three dimensions, these results give $\\sigma=0.076$ and $\\nu_c=0.359$. We locate the zero of the edge exponent at $d_\\sigma=2.65(1)$, also consistent with the six-loop estimate. Continuing the fixed point through $d_\\sigma$, we obtain $\\eta=-0.795(21)$ and $\\omega=1.90(6)$ in $d=2$, compared with the exact values $-4/5$ and $2$. For the complex Yang-Lee fixed point, convergence of the field expansion depends crucially on its reference point. Expansions about $\\phi=0$ fail to converge with the smooth regulator used here, whereas expansions about the running imaginary field value at which the mass vanishes converge down to $d=1.3$. This representation preserves the exact relation between the thermal eigenvalue and the field dimension, and hence the hyperscaling identity $\\theta_h+\\theta_t=d$, at every field-truncation order. We trace the large violations reported in earlier works to the omission of the expansion-point motion when linearizing the flow, rather than to the truncation itself.", "url": "https://arxiv.org/abs/2611.14206", "type": "理论", "summary": "我们使用函数重正化群将 Yang-Lee 边缘奇点的临界指数确定为维度的连续函数，并在导数展开中保留二阶和四阶的所有算子。在四阶，我们在$d=5$、$4$和$3$中分别得到$\\eta=-0.153(7)$、$-0.352(9)$和$-0.575(9)$，与六循环$\\epsilon$展开一致。在三个维度中，这些结果给出 $\\sigma=0.076$ 和 $\\nu_c=0.359$。我们将边缘指数的零定位在 $d_\\sigma=2.65(1)$ 处，也与六循环估计一致。通过$d_\\sigma$继续不动点，与精确值$-4/5$和$2$相比，在$d=2$中得到$\\eta=-0.795(21)$和$\\omega=1.90(6)$。对于复杂的 Yang-Lee 不动点，场展开的收敛很大程度上取决于其参考点。关于 $\\phi=0$ 的扩展无法与此处使用的平滑调节器收敛，而关于质量消失时的运行虚场值的扩展收敛到 $d=1.3$。\n\n这种表示保留了热特征值和场维数之间的精确关系，因此在每个场截断阶上都保留了超尺度恒等式 $\\theta_h+\\theta_t=d$。我们将早期作品中报告的大型违规行为归因于线性化流动时省略展开点运动，而不是截断本身。", "authors": [{"name": "Konrad Kockler"}, {"name": "Jan M. Pawlowski"}, {"name": "Vladimir V. Skokov"}], "featured_authors": [{"name": "Konrad Kockler"}, {"name": "Jan M. Pawlowski"}, {"name": "Vladimir V. Skokov"}], "author_count": 3}, {"id": "2611.14270", "category": "hep-th", "title": "Reducing Massive Scattering Amplitudes to Normal Form", "abstract": "Local amplitude reduction is a crucial tool in effective field theory (EFT) calculations. While polynomial normal forms reproduce the massless y-basis, massive amplitudes require reduction rules that preserve little-group tensor contractions. We generalize Gröbner-basis reduction to covariant tensor identities, determining leading monomials in their contraction contexts and generating the higher-degree rules induced by mass determinants. Using three-, four-, and five-point replacement catalogs, we demonstrate symbolic-mass amplitude reductions and reproduce the independent three- and four-vector operator bases, providing traceable normal-form reductions for local EFT matching and syzygy analysis.", "url": "https://arxiv.org/abs/2611.14270", "type": "理论", "summary": "局部振幅减小是有效场论 (EFT) 计算中的重要工具。 While polynomial normal forms reproduce the massless y-basis, massive amplitudes require reduction rules that preserve little-group tensor contractions. We generalize Gröbner-basis reduction to covariant tensor identities, determining leading monomials in their contraction contexts and generating the higher-degree rules induced by mass determinants. Using three-, four-, and five-point replacement catalogs, we demonstrate symbolic-mass amplitude reductions and reproduce the independent three- and four-vector operator bases, providing traceable normal-form reductions for local EFT matching and syzygy analysis.", "authors": [{"name": "Ming-Lei Xiao"}], "featured_authors": [{"name": "Ming-Lei Xiao"}], "author_count": 1}, {"id": "2611.14359", "category": "hep-th", "title": "Multiloop Unitarity from Airy Zeros", "abstract": "Hidden zeros are non-trivial cancellations that make amplitudes or integrands vanish on specific kinematic loci away from propagator poles. They have been shown to uniquely determine tree amplitudes and one-loop surface integrands in $\\Tr(\\phi^3)$ theory, without assuming factorization. Here we extend both the zeros and the uniqueness results to two, three and four loops at arbitrary multiplicity. We show that two types of zeros naturally enter the all-loop problem. First, tree-level zeros extend to all loop orders and fix relative weights within families of subgraphs attached to vacuum ``loop cores.'' We then show that Kontsevich's matrix Airy function can be used to generate a rich structure of loop level zeros that fix the relative weights of the loop cores themselves. The relative factorization and cut data required by unitarity therefore follow from the combination of tree and Airy loop zeros. These results bring within reach the emergence of unitarity to all orders in perturbation theory.", "url": "https://arxiv.org/abs/2611.14359", "type": "理论", "summary": "隐藏零点是重要的抵消，它使振幅或被积函数在远离传播极的特定运动学轨迹上消失。它们已被证明可以在 $\\Tr(\\phi^3)$ 理论中唯一地确定树振幅和单环表面被积函数，而无需假设因式分解。在这里，我们将零和唯一性结果扩展到任意重数的两个、三个和四个循环。我们证明了两种类型的零自然地进入全循环问题。首先，树级零扩展到所有循环阶，并固定附加到真空“循环核心”的子图族内的相对权重。然后，我们证明 Kontsevich 的矩阵 Airy 函数可用于生成丰富的循环级零结构，从而固定循环核心本身的相对权重。因此，幺正性所需的相对分解和切割数据来自树和艾里循环零点的组合。这些结果使微扰理论中所有阶的幺正性的出现成为可能。", "authors": [{"name": "Laurentiu Rodina"}], "featured_authors": [{"name": "Laurentiu Rodina"}], "author_count": 1}, {"id": "2611.14512", "category": "hep-th", "title": "Solving the SU(2) BFSS model", "abstract": "We numerically solve the ground state wavefunction of SU(2) BFSS matrix quantum mechanics. We compare ground correlators against islands obtained using the matrix bootstrap and find agreement up to five significant figures. The power law tail of this wavefunction determines the three-point amplitude, which agrees with the computation of Herderschee and Maldacena. Beyond the ground state, we extract the non-perturbative four-point scattering amplitude using Lüscher's method. In the appropriate regime, we find agreement with the Born-Oppenheimer approximation that yields the well-known $v^4/r^7$ interaction. We also find explicit bound states with positive energies in various SO(9) irreps. These are closely related to the bound states whose existence was recently discovered by OpenAI. Finally, we identify metastable resonances in the spectrum.", "url": "https://arxiv.org/abs/2611.14512", "type": "理论", "summary": "我们数值求解了 SU(2) BFSS 矩阵量子力学的基态波函数。我们将地面相关器与使用矩阵引导程序获得的岛屿进行比较，并发现最多五个有效数字的一致性。该波函数的幂律尾部决定了三点振幅，这与 Herderschee 和 Maldacena 的计算一致。在基态之外，我们使用 Lüscher 方法提取非微扰四点散射振幅。在适当的情况下，我们发现与 Born-Oppenheimer 近似一致，产生众所周知的 $v^4/r^7$ 相互作用。我们还在各种 SO(9) 不可表示中发现了具有正能量的显式束缚态。这些与 OpenAI 最近发现的束缚态密切相关。最后，我们确定了光谱中的亚稳态共振。", "authors": [{"name": "Kabir Bajaj"}, {"name": "Henry W. Lin"}], "featured_authors": [{"name": "Kabir Bajaj"}, {"name": "Henry W. Lin"}], "author_count": 2}, {"id": "2611.13068", "category": "math-ph", "title": "The Supercritical Ten Martini Problem", "abstract": "We solve the ten martini problem for the positive-Lyapunov part of the spectrum of any nonconstant real analytic one-frequency Schrödinger operator. The proof uses the intrinsic symplectic structure of the dual center of Ge--Jitomirskaya [28] and extends the Kotani--almost-reducibility strategy of Ge--Jitomirskaya--You [30] from two-dimensional centers to arbitrary finite center dimension.", "url": "https://arxiv.org/abs/2611.13068", "type": "理论", "summary": "我们解决了任何非常数实数解析单频薛定谔算子谱的正李亚普诺夫部分的十马提尼问题。该证明利用Ge-Jitomirskaya [28]的对偶中心的内在辛结构，并将Ge-Jitomirskaya-You [30]的Kotani-几乎可约化策略从二维中心扩展到任意有限中心维度。", "authors": [{"name": "Lingrui Ge"}, {"name": "Svetlana Jitomirskaya"}, {"name": "Jiangong You"}], "featured_authors": [{"name": "Lingrui Ge"}, {"name": "Svetlana Jitomirskaya"}, {"name": "Jiangong You"}], "author_count": 3}, {"id": "2611.13124", "category": "math-ph", "title": "Microscopic derivation of the classical KMS condition for one-dimensional Bose gases", "abstract": "The Kubo--Martin--Schwinger (KMS) condition provides an intrinsic characterization of thermal equilibrium, both in quantum and classical statistical mechanics. In this work, we establish stability of the KMS condition through the quantum-to-classical limit for one-dimensional defocusing Bose gases. More precisely, we consider scaled quantum KMS states in the (mean-field) semiclassical regime and prove that every associated Wigner measure satisfies the classical KMS condition corresponding to the nonlinear Schrödinger Hamiltonian. This result extends to an infinite-dimensional setting an earlier derivation of the classical KMS condition for finite-dimensional Bose--Hubbard systems. It also provides a complementary perspective on the derivation of nonlinear Gibbs measures from many-body quantum statistical mechanics.", "url": "https://arxiv.org/abs/2611.13124", "type": "理论", "summary": "Kubo--Martin--Schwinger (KMS) 条件提供了量子力学和经典统计力学中热平衡的内在表征。在这项工作中，我们通过一维散焦玻色气体的量子到经典极限建立了 KMS 条件的稳定性。更准确地说，我们考虑（平均场）半经典体系中的缩放量子 KMS 状态，并证明每个相关的维格纳测度满足与非线性薛定谔哈密顿量相对应的经典 KMS 条件。这一结果扩展到无限维设置，这是有限维 Bose-Hubbard 系统经典 KMS 条件的早期推导。它还为从多体量子统计力学推导出非线性吉布斯测度提供了补充视角。", "authors": [{"name": "Zied Ammari"}, {"name": "Shahnaz Farhat"}, {"name": "Sören Petrat"}, {"name": "Andrew Rout"}], "featured_authors": [{"name": "Zied Ammari"}, {"name": "Shahnaz Farhat"}, {"name": "Sören Petrat"}, {"name": "Andrew Rout"}], "author_count": 4}, {"id": "2611.13803", "category": "math-ph", "title": "Elliptic hypergeometric sum/integrals for orthogonal groups and Seiberg duality on the lens space", "abstract": "We derive new transformation formulas for elliptic hypergeometric sum/integrals associated with the orthogonal groups $\\mathrm{SO}(N)$. The sum/integrals are written in terms of the lens elliptic gamma function, which depends on an integer $r\\geq 1$ in addition to the usual complex variables, and they reduce to the elliptic hypergeometric integrals of Spiridonov and Vartanov for $r=1$. The derivation uses the $BC_n\\leftrightarrow BC_{\\tilde n}$ transformation formula proven in our previous paper, together with a duplication formula for the lens elliptic gamma function proven here. The duplication formula takes a different form depending on whether $r$ is even or odd. Physically, the new transformations show that the supersymmetric lens indices on $S^1\\times S^3/\\mathbb{Z}_r$ of the 4d $\\mathcal{N}=1$ $\\mathrm{SO}(N)$ and $\\mathrm{SO}(N_f-N+4)$ gauge theories related by Seiberg duality are equal for odd $r$. For even $r$, where the lens index depends on the global form of the gauge group, they show the equality of the contributions from flat connections whose holonomies lie in a common maximal torus. The $BC_n$ formula itself gives the corresponding statement for the symplectic groups.", "url": "https://arxiv.org/abs/2611.13803", "type": "理论", "summary": "我们推导出与正交群 $\\mathrm{SO}(N)$ 相关的椭圆超几何和/积分的新变换公式。总和/积分以透镜椭圆伽玛函数的形式编写，除了通常的复变量之外，它还取决于整数 $r\\geq 1$，并且当 $r=1$ 时，它们可简化为 Spiridonov 和 Vartanov 的椭圆超几何积分。推导使用我们之前论文中证明的 $BC_n\\leftrightarrow BC_{\\tilde n}$ 变换公式，以及此处证明的透镜椭圆伽玛函数的复制公式。根据 $r$ 是偶数还是奇数，重复公式采用不同的形式。物理上，新的变换表明，由 Seiberg 对偶性相关的 4d $\\mathcal{N}=1$ $\\mathrm{SO}(N)$ 和 $\\mathrm{SO}(N_f-N+4)$ 规范理论的 $S^1\\times S^3/\\mathbb{Z}_r$ 上的超对称透镜指数对于奇数 $r$ 是相等的。即使对于 $r$，其中透镜指数取决于规范组的全局形式，它们也显示了平坦连接的贡献相等，这些平坦连接的完整性位于共同的最大环面中。\n\n$BC_n$ 公式本身给出了辛群的相应陈述。", "authors": [{"name": "Andrew P. Kels"}, {"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Andrew P. Kels"}, {"name": "Masahito Yamazaki"}], "author_count": 2}, {"id": "2611.13908", "category": "math-ph", "title": "Connectivity and the equilibration of Boltzmann-type equations on dense graphs", "abstract": "We investigate the equilibration of solutions to a homogeneous Boltzmann-type equation whose collision kernel is given by a graphon encoding the connectivity structure of interacting agents. For a broad class of Lipschitz-continuous binary interaction rules, we show that, under suitable conditions relating the interaction parameters to the connectivity properties of the graphon, solutions converge exponentially fast towards those of the classical homogeneous Boltzmann-type equation without preferential connections, and hence towards its equilibrium distributions. We then consider in detail compromise-diffusion interaction rules and establish a quasi-invariant limit leading to a Fokker-Planck-type equation parametrised by the graphon connectivity. This limiting equation allows us to characterise explicitly both connectivity-independent and connectivity-dependent equilibrium distributions.", "url": "https://arxiv.org/abs/2611.13908", "type": "理论", "summary": "我们研究齐次玻尔兹曼型方程解的平衡，其碰撞核由编码相互作用主体的连接结构的图子给出。对于一大类 Lipschitz 连续二元相互作用规则，我们表明，在将相互作用参数与图子的连通性相关联的适当条件下，解以指数方式快速收敛到没有优先连接的经典齐次玻尔兹曼型方程的解，从而收敛到其平衡分布。然后，我们详细考虑折衷扩散相互作用规则，并建立准不变极限，得出由图子连通性参数化的福克-普朗克型方程。这个极限方程使我们能够明确地表征连通性独立和连通性依赖的平衡分布。", "authors": [{"name": "Andrea Tosin"}], "featured_authors": [{"name": "Andrea Tosin"}], "author_count": 1}, {"id": "2611.14091", "category": "math-ph", "title": "Numerical investigation of a MST conjecture for random Haar matrices", "abstract": "The state-to-state control time of finite-dimensional conservative bilinear quantum systems is bounded by the weight of minimum spanning trees (MST) derived from the drift matrices. For a spectrum scaling as k^3/2 , determining whether the control time vanishes as the dimension d tends to infinity remains an open problem due to the global correlations imposed by the Haar measure. We formulate two conjectures regarding the asymptotic behavior of the MST weight\\,: a general decay to zero, and a scaling in 1/sqrt(ln d) derived from an independent Gaussian surrogate model. Numerical investigations up to dimension d = 18101 validate the general decay, confirm that the exact Haar model and the independent surrogate are statistically indistinguishable in mean at all tested dimensions, and extract the thermodynamic limit $\\alpha$ = 10/3, which both models approach from below once the scaling variable 1/ ln d is adopted.", "url": "https://arxiv.org/abs/2611.14091", "type": "理论", "summary": "有限维保守双线性量子系统的状态到状态控制时间受到从漂移矩阵导出的最小生成树（MST）权重的限制。对于 k^3/2 的频谱缩放，由于 Haar 度量施加的全局相关性，确定控制时间是否随着维度 d 趋于无穷大而消失仍然是​​一个悬而未决的问题。我们对 MST 权重的渐近行为提出了两个猜想：一般衰减到零，以及从独立高斯代理模型导出的 1/sqrt(ln d) 缩放。直到维度 d = 18101 的数值研究验证了一般衰减，确认精确的 Haar 模型和独立代理在所有测试维度的平均值上在统计上无法区分，并提取热力学极限 $\\alpha$ = 10/3，一旦采用缩放变量 1/ ln d，两个模型都会从下面接近。", "authors": [{"name": "Thomas Chambrion"}, {"name": "Cristian Mendico"}], "featured_authors": [{"name": "Thomas Chambrion"}, {"name": "Cristian Mendico"}], "author_count": 2}, {"id": "2611.14265", "category": "math-ph", "title": "The Isoperimetric Flow and Synthetic Scalar Curvature for Causal Variational Principles", "abstract": "An isoperimetric flow is introduced in the setting of causal variational principles. Describing the whole space by the support of a minimizing measure, we define an area functional on subsets by a surface layer integral. Mean curvature is defined via the first variation of this area functional. Using the method of minimizing movement, the isoperimetric flow is constructed as a Lipschitz curve of measures with prescribed volume change. As illustrating examples, we introduce and analyze ``smeared variants'' of the mean curvature flow in Euclidean space and on a Riemannian manifold. In these examples, it is shown that our area functional coincides with the usual area up to specified curvature corrections. As an application of our general results, by analyzing the volume and area of small isoperimetric balls, we introduce notions of local dimension and synthetic scalar curvature.", "url": "https://arxiv.org/abs/2611.14265", "type": "理论", "summary": "在因果变分原理的设置中引入了等周流。通过最小化度量的支持来描述整个空间，我们通过表面层积分定义了子集上的函数区域。平均曲率是通过该面积泛函的第一个变体定义的。使用最小化运动的方法，等周流被构造为具有指定体积变化的测量的 Lipschitz 曲线。作为示例，我们介绍并分析了欧几里得空间和黎曼流形上的平均曲率流的“弥散变体”。在这些示例中，表明我们的面积函数在指定的曲率校正范围内与通常的面积一致。作为我们一般结果的应用，通过分析小等周球的体积和面积，我们引入了局部尺寸和合成标量曲率的概念。", "authors": [{"name": "Felix Finster"}, {"name": "Franz Gmeineder"}, {"name": "Margarita Kraus"}], "featured_authors": [{"name": "Felix Finster"}, {"name": "Franz Gmeineder"}, {"name": "Margarita Kraus"}], "author_count": 3}, {"id": "2611.14497", "category": "math-ph", "title": "Excess charge in the Engel-Dreizler model of atoms and molecules", "abstract": "We prove an explicit excess-charge bound for the exchange-free Engel--Dreizler functional of atoms and molecules. If $\\alpha\\lambda\\le1/1233$ and $\\alpha^3Z_k^2\\le1/137$ for each nucleus, every finite-mass electronic minimizer whose total energy, including nuclear repulsion, is nonpositive satisfies $N-\\sum_kZ_k<(5913/1000)\\lambda^{3/2}K$. For the gradient coefficient $\\lambda=1/9$, this gives $N-\\sum_kZ_k<0.219K$. The energy hypothesis holds automatically for atoms and for local minima of the Born--Oppenheimer energy at which the electronic infimum is attained. The proof uses no symmetry of the density, restriction on the total nuclear charge, or minimum nuclear separation. We combine molecular Sommerfeld estimates with a convex nonlinear comparison in the variable $F(p)$. The failure of the latter comparison at very high density is represented by a nonnegative Newton potential. A quartic coercivity estimate, obtained from nuclear repulsion and a signed localized Hardy inequality, controls the total mass of this source. The chemical potential is retained throughout. Exact covariance yields the invariant parameter domain, and all finite numerical inequalities are reduced to rational arithmetic.", "url": "https://arxiv.org/abs/2611.14497", "type": "理论", "summary": "我们证明了原子和分子的无交换恩格尔-德雷兹勒泛函的显式过剩电荷界。如果每个原子核都有 $\\alpha\\lambda\\le1/1233$ 和 $\\alpha^3Z_k^2\\le1/137$，则每个有限质量电子最小化器的总能量（包括核斥力）为非正值，满足 $N-\\sum_kZ_k<(5913/1000)\\lambda^{3/2}K$。对于梯度系数 $\\lambda=1/9$，这给出 $N-\\sum_kZ_k<0.219K$。能量假说对于原子和达到电子下确界的玻恩-奥本海默能量的局部最小值自动成立。该证明不使用密度的对称性、总核电荷的限制或最小核分离。我们将分子索末菲估计与变量 $F(p)$ 中的凸非线性比较相结合。后一种比较在非常高密度下的失败由非负牛顿势表示。从核排斥力和带符号的局部哈代不等式获得的四次矫顽力估计控制着该源的总质量。化学势始终保留。\n\n精确的协方差产生不变的参数域，并且所有有限数值不等式都被简化为有理算术。", "authors": [{"name": "Rafael Benguria"}, {"name": "Heinz Siedentop"}], "featured_authors": [{"name": "Rafael Benguria"}, {"name": "Heinz Siedentop"}], "author_count": 2}, {"id": "2611.12971", "category": "quant-ph", "title": "Time Running Backwards, and Where It Stops: Superoscillations of Proper Time and the Memory of the Environment", "abstract": "A quantum system prepared in a superposition of proper times - a clock whose worldline is superposed, or a clock at rest in a superposed gravitational potential - evolves, in each branch, by the same dynamics for a different duration. Post-selecting the control that sets the proper time turns the superposition into a superoscillation of the time-dilation factor: the system is found to have evolved for a proper time $\\alpha_w t$, where the weak value $\\alpha_w$ may exceed unity, vanish, or be negative - the quantum time-translation machine of Aharonov, Anandan, Popescu and Vaidman. We ask how far back such a machine can run an irreversible process. The test system is a sealed cell - excited atoms, the radiation field they emit into, and the absorbing walls, carried as one quantum object - and the witness is projective: atoms that had begun to decay before the run are found, in the post-selected sub-ensemble, more excited than when inserted. The answer is exact and depends only on the atoms' survival amplitude. With two branches the witness holds only while the decay is younger than the memory time of the environment, after which the emission becomes Markovian. Beyond it, the post-selection amplifies the minute difference between the contents of the cell in the two branches, set by the full energy spread of the atoms and their field rather than by the linewidth, and the witness fails. Reversing a decay past the memory time requires many branches, an environment with a strictly bounded spectrum, and a post-selection probability that falls exponentially with the number of environmental oscillations to be undone. The obstacle to reversal is therefore not entropy but bandwidth - the same bandwidth that makes the emission irreversible in the first place. We give four ways to superpose a clock rate, from hollow massive shells to inertial velocities.", "url": "https://arxiv.org/abs/2611.12971", "type": "理论", "summary": "一个在适当时间的叠加中准备好的量子系统——一个世界线叠加的时钟，或者一个在叠加的引力势中静止的时钟——在每个分支中，在不同的持续时间内通过相同的动力学演化。后选择设置适当时间的控制将叠加变成时间膨胀因子的超振荡：发现系统已经演化了适当时间 $\\alpha_w t$，其中弱值 $\\alpha_w$ 可能超过统一、消失或为负 - Aharonov、Anandan、Popescu 和 Vaidman 的量子时间翻译机。我们问这样的机器可以运行多久以前的不可逆过程。测试系统是一个密封的单元——激发的原子、它们发射到的辐射场以及吸收壁，作为一个量子物体携带——目击者是投影的：在运行之前已经开始衰变的原子在后选择的子系综中被发现，比插入时更加激发。答案是准确的，仅取决于原子的生存幅度。对于两个分支，见证人仅在衰变比环境的记忆时间更年轻时才保持不变，之后发射变为马尔可夫。\n\n除此之外，后选择放大了两个分支中细胞内容之间的微小差异，这是由原子及其场的全部能量分布而不是线宽决定的，并且见证失败。逆转超过记忆时间的衰减需要许多分支、具有严格限制频谱的环境，以及随着要撤销的环境振荡数量呈指数下降的后选择概率。因此，逆转的障碍不是熵，而是带宽——同样的带宽首先使发射不可逆。我们给出了四种叠加时钟速率的方法，从空心大壳到惯性速度。", "authors": [{"name": "Yakir Aharonov"}, {"name": "Avshalom C. Elitzur"}], "featured_authors": [{"name": "Yakir Aharonov"}, {"name": "Avshalom C. Elitzur"}], "author_count": 2}, {"id": "2611.12993", "category": "quant-ph", "title": "Second-level termination of the PPT entanglement-cost hierarchy for two qutrits", "abstract": "We prove that for arbitrary two-qutrit quantum states, the semidefinite programming lower-bound hierarchy for the PPT entanglement cost terminates at the second level. Therefore, under operations preserving positive partial transpose, its zero-error asymptotic entanglement cost can be obtained by a semidefinite program involving only three Hermitian matrix variables. The key to the proof is to shorten the feasible dual chain by one level; to this end, we combine finite certificates verified by exact rational arithmetic with analytic estimates near the boundary of the parameter domain. This result shows that a unified terminating level exists for two-qutrit systems, whereas no unified terminating level exists for all dimensions.", "url": "https://arxiv.org/abs/2611.12993", "type": "理论", "summary": "我们证明，对于任意双量子态，PPT 纠缠成本的半定规划下界层次结构终止于第二级。因此，在保留正部分转置的操作下，其零误差渐近纠缠成本可以通过仅涉及三个埃尔米特矩阵变量的半定规划获得。证明的关键是将可行双链缩短一级；为此，我们将通过精确有理算术验证的有限证书与参数域边界附近的分析估计结合起来。该结果表明，对于二元系统，存在统一的终止水平，而对于所有维度，不存在统一的终止水平。", "authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}, {"name": "Ming Yang"}], "featured_authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}, {"name": "Ming Yang"}], "author_count": 3}, {"id": "2611.13079", "category": "quant-ph", "title": "Quantum simulation of real-time bosonic dynamics with binary and unary position encodings on superconducting and trapped-ion processors", "abstract": "Simulating a bosonic degree of freedom on qubit hardware requires discretizing its position space, and the qubit encoding of the resulting lattice determines the circuits that realize its real-time dynamics. We compare binary and unary encodings of a position lattice on superconducting (IBM) and trapped-ion (IonQ) processors. Binary encoding applies the kinetic term through the quantum Fourier transform; unary encoding uses one qubit per site, single-qubit rotations for the potential and excitation-conserving exchange gates for the kinetic term. For a single degree of freedom the unary dynamics is a free-fermion problem, and its product formula compresses exactly into a nearest-neighbor circuit of fixed size. With about two hundred two-qubit gates, these circuits resolve tunneling in a symmetric double well on both processors, with the right-well probability falling from 0.97 to 0.06 on IBM and from 0.96 to 0.12 on IonQ, whereas binary product-formula circuits with several thousand two-qubit gates do not reproduce the transfer. Noiseless emulation indicates that this contrast reflects the compilation as well as the encoding: without the fixed-size optimization, a unary product formula that captures the transfer also requires several thousand two-qubit gates. Post-selection on the single-excitation subspace removes leakage, and because every energy eigenstate of the symmetric grid populates both wells equally, the measured population reversal bounds the coherence between energy eigenstates from below. Coupled-oscillator benchmarks, where inter-register interactions prevent this exact compression, show that the preferred encoding depends on the grid size and the evolution time.", "url": "https://arxiv.org/abs/2611.13079", "type": "理论+数值", "summary": "在量子位硬件上模拟玻色子自由度需要离散其位置空间，并且所得晶格的量子位编码决定了实现其实时动态的电路。我们比较超导 (IBM) 和俘获离子 (IonQ) 处理器上位置晶格的二进制和一元编码。二进制编码通过量子傅里叶变换应用动力学项；一元编码每个位点使用一个量子位，势能使用单量子位旋转，动力学项使用激发守恒交换门。对于单自由度，一元动力学是一个自由费米子问题，其乘积公式精确地压缩为固定大小的最近邻电路。这些电路具有大约 200 个双量子位门，可在两个处理器上解决对称双阱中的隧道效应，IBM 上的右阱概率从 0.97 下降到 0.06，IonQ 上从 0.96 下降到 0.12，而具有数千个双量子位门的二元乘积公式电路无法重现传输。\n\n无噪声仿真表明，这种对比反映了编译和编码：如果没有固定大小的优化，捕获传输的一元乘积公式也需要数千个双量子位门。单激发子空间上的后选择消除了泄漏，并且由于对称网格的每个能量本征态平等地填充两个井，因此测量的布居反转限制了下方能量本征态之间的相干性。耦合振荡器基准测试（其中寄存器间交互阻止了这种精确压缩）表明，首选编码取决于网格大小和演化时间。", "authors": [{"name": "Masanori Hanada"}, {"name": "Jiwoo Seo"}, {"name": "Seok-Kyun Son"}, {"name": "Junggi Yoon"}], "featured_authors": [{"name": "Masanori Hanada"}, {"name": "Jiwoo Seo"}, {"name": "Seok-Kyun Son"}, {"name": "Junggi Yoon"}], "author_count": 4}, {"id": "2611.13085", "category": "quant-ph", "title": "Time Direction Entanglement Entropy of Free Fermion Ground States", "abstract": "While the entanglement entropy of a spatial subregion has been extensively studied, a properly defined entanglement entropy of quantum states in a time direction interval remains underexplored. We investigate the scaling behaviors of the recently defined time direction entanglement entropy (TDEE) for free fermion quantum states, which is computed from the reduced density matrix of a sub-Hilbert space that minimally supports all the time-evolved operators in the time direction interval. Based on the Fisher--Hartwig conjecture for Toeplitz matrices, we develop an analytical framework for understanding the TDEE in a time interval with discrete time step $\\tau$. For disorderless one-dimensional (1D) systems (gapless fermions or band insulators), in different regimes of gap, bandwidth and $\\tau$, we find the TDEE can exhibit area law (for nonzero gap), logarithmic law or volume law in the length of time. For 1D Anderson insulators, we numerically find the TDEE shows a Page-curve like behavior, growing at short time, and decaying in power-law at long time exceeding the crossover time determined by localization. In the continuum time limit $\\tau\\rightarrow 0$, the TDEE of disorderless gapless fermions, band insulators and Anderson insulators exhibit logarithmic law, area law and sub-area law, respectively. We also show that the sub-Hilbert space of a time-direction interval stabilizes in the $\\tau\\rightarrow 0$ limit, which is understandable as a subspace of the Hilbert space of the Lieb-Robinson causal diamond.", "url": "https://arxiv.org/abs/2611.13085", "type": "理论+数值", "summary": "虽然空间子区域的纠缠熵已被广泛研究，但时间方向间隔中量子态的正确定义的纠缠熵仍未得到充分探索。我们研究了最近定义的自由费米子量子态的时间方向纠缠熵（TDEE）的缩放行为，该熵是根据子希尔伯特空间的约简密度矩阵计算得出的，该空间最低限度地支持时间方向间隔中的所有时间演化算子。基于 Toeplitz 矩阵的 Fisher--Hartwig 猜想，我们开发了一个分析框架，用于理解具有离散时间步 $\\tau$ 的时间间隔内的 TDEE。对于无序一维（1D）系统（无间隙费米子或带状绝缘体），在不同的间隙、带宽和$\\tau$范围内，我们发现TDEE在时间长度上可以表现出面积定律（对于非零间隙）、对数定律或体积定律。对于一维安德森绝缘体，我们在数值上发现 TDEE 显示出类似页面曲线的行为，在短时间内增长，并在超过本地化确定的交叉时间的长时间内按幂律衰减。\n\n在连续时限$\\tau\\rightarrow 0$内，无序无间隙费米子、带状绝缘体和安德森绝缘体的TDEE分别表现出对数定律、面积定律和分区定律。我们还表明，时间方向区间的子希尔伯特空间稳定在 $\\tau\\rightarrow 0$ 极限内，这可以理解为李布-罗宾逊因果菱形的希尔伯特空间的子空间。", "authors": [{"name": "Xinyu Sun"}, {"name": "Bowei Liu"}, {"name": "Joshua Yi"}, {"name": "Biao Lian"}], "featured_authors": [{"name": "Xinyu Sun"}, {"name": "Bowei Liu"}, {"name": "Joshua Yi"}, {"name": "Biao Lian"}], "author_count": 4}, {"id": "2611.13089", "category": "quant-ph", "title": "Kinematic Quantum Geometry", "abstract": "Kinematic quantum geometry describes fast degrees of freedom (DOFs) that adiabatically follow states parametrized by both the coordinates and the velocities of slow DOFs. It extends Born-Oppenheimer geometry, which depends on coordinates alone, introduces mixed Berry curvatures, and modifies the effective theory governing the slow DOFs. We test its predictions in two setups: spinful particles moving in magnetic textures, and Dirac electrons in graphene coupled to an LC circuit. In the first, kinematic quantum geometry produces a velocity-dependent effective mass tensor and generates a Lorentz-like force nonlinear in velocity that can arise even in coplanar textures. In the second, it renormalizes the circuit capacitance and generates a Hall current nonlinear in the electric field. For small velocities, it reproduces recent results for electronic dynamics in external electromagnetic fields and in pseudospin textures. However, the framework can remain valid at large velocities beyond the perturbative regime, provided the kinematic states are sufficiently slowly varying.", "url": "https://arxiv.org/abs/2611.13089", "type": "理论", "summary": "运动量子几何描述了快速自由度 (DOF)，该自由度绝热地遵循由慢速自由度的坐标和速度参数化的状态。它扩展了仅依赖于坐标的玻恩-奥本海默几何，引入了混合贝里曲率，并修改了控制慢自由度的有效理论。我们在两种设置中测试其预测：在磁性纹理中移动的旋转粒子，以及与 LC 电路耦合的石墨烯中的狄拉克电子。首先，运动量子几何产生与速度相关的有效质量张量，并产生速度非线性的类洛伦兹力，即使在共面纹理中也可能出现。在第二个过程中，它重新规范化电路电容并在电场中产生非线性霍尔电流。对于小速度，它再现了外部电磁场和赝自旋纹理中电子动力学的最新结果。然而，只要运动状态变化足够缓慢，该框架就可以在超出微扰状态的大速度下保持有效。", "authors": [{"name": "Bernardo Barrera"}, {"name": "Nishchhal Verma"}, {"name": "Raquel Queiroz"}, {"name": "Anatoli Polkovnikov"}, {"name": "Anushya Chandran"}], "featured_authors": [{"name": "Bernardo Barrera"}, {"name": "Nishchhal Verma"}, {"name": "Raquel Queiroz"}, {"name": "Anatoli Polkovnikov"}, {"name": "Anushya Chandran"}], "author_count": 5}, {"id": "2611.13103", "category": "quant-ph", "title": "Which data samples matter when training a quantum model?", "abstract": "The expressivity, loss landscapes, and generalization behavior of quantum machine learning models have been studied extensively, yet mainly from a model-centric point of view. Little is known about the compatibility of particular quantum models with specific datasets. In this work, we study quantum machine learning models with a data-dependent focus by establishing a quantum-compatible form of the V-usable information. This metric quantifies the information a model can extract from a dataset, enabling a direct, data-centric comparison of different models. We employ this metric to study which data points contribute most significantly to a model's learning process. This enables us to develop an informed preselection strategy for data subsets that can significantly improve the data efficiency of the training pipeline. This work establishes the V-usable information as a powerful diagnostic tool for learning dynamics and a practical route to data-efficient quantum machine learning.", "url": "https://arxiv.org/abs/2611.13103", "type": "理论+数值", "summary": "量子机器学习模型的表现力、损失景观和泛化行为已被广泛研究，但主要是从以模型为中心的角度进行的。对于特定量子模型与特定数据集的兼容性知之甚少。在这项工作中，我们通过建立 V 可用信息的量子兼容形式来研究以数据相关为重点的量子机器学习模型。该指标量化了模型可以从数据集中提取的信息，从而能够对不同模型进行直接、以数据为中心的比较。我们利用这个指标来研究哪些数据点对模型的学习过程贡献最大。这使我们能够为数据子集制定明智的预选策略，从而显着提高训练管道的数据效率。这项工作将 V 可用信息确立为学习动态的强大诊断工具和数据高效量子机器学习的
