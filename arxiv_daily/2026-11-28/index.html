hotons together with the SUSY breaking mass terms of the photinos makes the latter observable. We identify geometries in which the mixing is induced by Wilson lines and show that their expectation values are generically non-zero. As a result, most of the dark photinos, which are lighter than the visible sector SUSY breaking scale, mix significantly with the bino and hence couple to the Standard Model sufficiently strongly to leave potentially observable traces. In particular, volume modulus and inflaton decays generically induce a cosmological abundance of dark photinos that can explain dark matter. We find that the `natural Photinoverse dark matter parameter space' is already accessible to current experiments, notably gamma ray observations, which therefore have discovery potential in the near future.", "url": "https://arxiv.org/abs/2611.33273", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andreas P. Braun"}, {"name": "Thibaut Coudarchet"}, {"name": "Arthur Hebecker"}, {"name": "Joerg Jaeckel"}, {"name": "Jonathan Steiner"}], "featured_authors": [{"name": "Andreas P. Braun"}, {"name": "Thibaut Coudarchet"}, {"name": "Arthur Hebecker"}, {"name": "Joerg Jaeckel"}, {"name": "Jonathan Steiner"}], "author_count": 5}, {"id": "2611.33275", "category": "hep-th", "title": "Gauge groups of type 0 orientifolds", "abstract": "We determine the global form of the gauge groups of the orthogonal and symplectic type 0 orientifolds, using the constraints from perturbative and brane states. In the process, we correct some misprints in type 0 vacuum amplitudes that have propagated in the literature. For type 0A, our analysis reveals a parity condition on the numbers of D9-branes in the orthogonal orientifold and a puzzle concerning the decay of a tachyonic D0-brane in the symplectic orientifold.", "url": "https://arxiv.org/abs/2611.33275", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vittorio Larotonda"}, {"name": "Salvatore Raucci"}], "featured_authors": [{"name": "Vittorio Larotonda"}, {"name": "Salvatore Raucci"}], "author_count": 2}, {"id": "2611.33277", "category": "hep-th", "title": "Unitarization from Spin Geometry", "abstract": "We derive the dimensional reduction of 10D super Yang-Mills theory on a general closed 6D spin manifold using spectral decompositions for the higher-dimensional gauge field and gaugino, keeping the infinite towers of Kaluza-Klein (KK) modes in the lower-dimensional theory. We then calculate tree-level $2 \\rightarrow 2$ scattering amplitudes with external massive spinors and vectors in this lower-dimensional theory. By studying the high-energy behavior of these amplitudes and imposing perturbative unitarity, we derive several sum rules that involve the eigenvalues of Laplace and Dirac operators on the internal 6-manifold, together with products of cubic coupling constants of the KK modes. These give concrete realizations of the known unitarity sum rules for spontaneously broken gauge theories. We illustrate explicitly how the simplest sum rule is satisfied for flat tori and round spheres.", "url": "https://arxiv.org/abs/2611.33277", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Francesco Bertucci"}, {"name": "James Bonifacio"}, {"name": "Andrew Schrader"}], "featured_authors": [{"name": "Francesco Bertucci"}, {"name": "James Bonifacio"}, {"name": "Andrew Schrader"}], "author_count": 3}, {"id": "2611.33281", "category": "hep-th", "title": "Neural Network Field Theory and the AdS/CFT Correspondence", "abstract": "We develop a neural realization of massive scalar field theory on Euclidean anti--de Sitter space and its holographic boundary observables within neural network field theory (NN--FT). We construct Fourier--Bessel cosine neurons whose covariance reproduces the regulated massive AdS propagator exactly at finite network width, with the Gaussian field theory recovered in the infinite-width limit. We introduce quartic interactions through two complementary approaches. The first implements a prescribed interaction by deforming the neural parameter measure, while the second generates a local quartic interaction from the statistics of auxiliary binary neurons. Applying the BDHM prescription directly to the neural ensemble, we recover the scalar bulk-to-boundary propagator, the conformal boundary two-point function, and the leading connected four-point contact Witten diagram. We further show that distinct neural architectures can reproduce the same leading boundary correlators while defining inequivalent bulk theories. These results establish a framework for studying interacting scalar holography within NN--FT and clarify the role of neural architecture in encoding bulk dynamics and boundary observables.", "url": "https://arxiv.org/abs/2611.33281", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dmitry S. Ageev"}, {"name": "Yulia A. Ageeva"}, {"name": "Anna S. Bernakevich"}], "featured_authors": [{"name": "Dmitry S. Ageev"}, {"name": "Yulia A. Ageeva"}, {"name": "Anna S. Bernakevich"}], "author_count": 3}, {"id": "2611.33283", "category": "hep-th", "title": "Energy plateau cascades from complex-time local quenches in thermal two-dimensional CFTs", "abstract": "In this work, we study local operator quenches in thermal two-dimensional conformal field theories with complex-time evolution, which can be viewed as an effective description of conditional dynamics in a system interacting with an environment. In contrast to quenches of the vacuum, the thermal initial state allows several conformal families to participate in the evolution. We show that their competition can produce cascades of approximately homogeneous energy plateaux, with successive plateaux approaching the energies of different primary states. Using conformal Ward identities on the cylinder and torus, we determine the local energy density and illustrate this behavior in free-field theories, the Ising model and Wess--Zumino--Witten models. We develop a cold-limit spectral description in which the dominant primary channel determines the height of each plateau, while conformal dimensions and operator matrix elements govern the transitions between them. For a fixed compact unitary CFT, we show that only finitely many primary channels can contribute to the leading plateau sequence. Finally, we discuss the large-central-charge regime, relating light-operator plateaux to few-particle sectors in thermal AdS and examining the limitations of this picture for heavy quenches.", "url": "https://arxiv.org/abs/2611.33283", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dmitry S. Ageev"}, {"name": "Vladimir A. Bykov"}], "featured_authors": [{"name": "Dmitry S. Ageev"}, {"name": "Vladimir A. Bykov"}], "author_count": 2}, {"id": "2611.33285", "category": "hep-th", "title": "Bounds on Love Numbers and Quasinormal Modes from the Surface Impedance", "abstract": "The surface impedance of a body is fixed by its interior alone and encodes its entire tidal response. We derive bounds on Love numbers and quasinormal modes from constraints on the impedance that follow from either of two properties of a stable body: it is lossless, meaning that it dissipates no energy, or it is passive, meaning that it never gives back more energy than it has received. For a lossless body, every dynamical Love number is bounded from above and below, exactly in general relativity, in any renormalization scheme and at any scale. Earlier bounds are exact for Newtonian stars but fail for compact stars, because they take the response to arbitrarily fast tides to be zero or non-negative, whereas in general relativity it is negative. The quasinormal modes of a lossless body are also excluded from a region of the complex frequency plane set by the mass and radius. Each known Love number enlarges the excluded region. Conversely, the quasinormal modes bound each Love number from below, given the lower ones. For a passive body of horizon scale, such as a black hole, the static Love number lies in a window that closes onto the vanishing black-hole value as the body's surface approaches the horizon.", "url": "https://arxiv.org/abs/2611.33285", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Daniel McLoughlin"}, {"name": "Mikhail P. Solon"}], "featured_authors": [{"name": "Daniel McLoughlin"}, {"name": "Mikhail P. Solon"}], "author_count": 2}, {"id": "2611.33287", "category": "hep-th", "title": "Chaotic singularities inside vacuum black holes", "abstract": "According to the conjecture of Belinski, Khalatnikov and Lifshitz, general relativity gives rise to chaotic dynamics in the vicinity of generic spacelike singularities. However, no vacuum black hole has been shown to exhibit this behaviour. Here we construct stationary, asymptotically locally AdS$_5$ black holes with regular, triaxially squashed horizons and causal exteriors, whose homogeneous interiors realize the cosmological billiard of generic five-dimensional vacuum gravity. We identify a simple algebraic condition on the horizon data that is necessary for the interior billiard to be chaotic, and show that solutions with regular horizons locally access an open set of billiard trajectories.", "url": "https://arxiv.org/abs/2611.33287", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Robie A. Hennigar"}, {"name": "Ayan K. Patra"}], "featured_authors": [{"name": "Robie A. Hennigar"}, {"name": "Ayan K. Patra"}], "author_count": 2}, {"id": "2611.33291", "category": "hep-th", "title": "RMT${}_2$: Random Spectral Correlations for CFT${}_2$ and AdS${}_3$ Gravity", "abstract": "We present the full framework of RMT${}_2$, a consistent unification of random matrix theory and modular invariance. The systematic prescription, which augments the existing construction by incorporating spin, lifts random matrix correlators to $\\text{SL}(2,\\mathbb{Z})$ Poincaré sums of their Mellin transforms, in a manner which enforces random matrix correlations near extremality in every spinning primary sector. The resulting RMT${}_2$ correlators are further expressible in terms of an orthogonal basis of Eisenstein series and Maass cusp forms. We demonstrate the construction by lifting the two-point correlators at arbitrary genus of the Airy model, in both unitary and orthogonal symmetry classes, exhibiting the modular-invariant topological expansion of RMT${}_2$; a resummation of the genus expansion shows that the modular-invariant spectral form factor preserves the ramp-plateau structure. Holographically, RMT${}_2$ provides a concrete benchmark and explicit candidate expressions for comparison with off-shell wormhole amplitudes in AdS${}_3$ gravity, with any number of torus boundaries. We explicitly compute the universal RMT${}_2$ three-point correlator, corresponding to the putative three-boundary wormhole.", "url": "https://arxiv.org/abs/2611.33291", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jan Boruch"}, {"name": "Gabriele Di Ubaldo"}, {"name": "Felix M. Haehl"}, {"name": "Eric Perlmutter"}, {"name": "Moshe Rozali"}], "featured_authors": [{"name": "Jan Boruch"}, {"name": "Gabriele Di Ubaldo"}, {"name": "Felix M. Haehl"}, {"name": "Eric Perlmutter"}, {"name": "Moshe Rozali"}], "author_count": 5}, {"id": "2611.33311", "category": "hep-th", "title": "Machine Learning for Calabi--Yau Geometry and Heterotic Compactification", "abstract": "Quantitative predictions from string compactification depend on geometric data that are difficult to compute analytically. This review surveys machine learning approaches to predicting topological properties of Calabi-Yau manifolds, discusses the search for new Calabi-Yau fourfolds, as well as numerical methods for approximating Ricci-flat metrics. In the context of heterotic compactifications, we explain how bundle metrics and harmonic matter forms enter calculations of canonically normalized Yukawa couplings and axion-matter interactions. We also outline applications to flux compactifications, warped and corrected backgrounds, and geometric structures beyond the Calabi-Yau setting. Finally, we review available datasets and software, highlight connections with analytic methods, and discuss geometric constraints, numerical validation, and recent progress in rigorous error control.", "url": "https://arxiv.org/abs/2611.33311", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vishnu Jejjala"}, {"name": "Damian Mayorga Pena"}], "featured_authors": [{"name": "Vishnu Jejjala"}, {"name": "Damian Mayorga Pena"}], "author_count": 2}, {"id": "2611.33343", "category": "hep-th", "title": "On the Structure Constants of ${\\cal N}=2$ Liouville Theory", "abstract": "We show the structure constants of $\\mathcal{N}=2$ spacelike Liouville theory. The absence of self-duality under $b\\leftrightarrow b^{-1}$, where $b$ is the Liouville coupling, prevents a straightforward application of the standard bootstrap methods used in $\\mathcal{N}=0$ and $\\mathcal{N}=1$ Liouville theory. Motivated by the fermionic FZZ duality with the $SL(2,\\mathbb{R})/U(1)$ supercoset theory, we establish an algebraic correspondence between the two theories, including a matching of their null vectors. We then derive the three-point structure constants in superspace. The neutral sector structure constants are associated with the spectral-flow-preserving structure constant of the $SL(2,\\mathbb{R})$ WZW model, while the two charged sectors correspond to its spectral-flow-violating structure constants. Finally, we give the correct relative normalization between the neutral and charged sectors and test crossing symmetry numerically.", "url": "https://arxiv.org/abs/2611.33343", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jingxin Tu"}], "featured_authors": [{"name": "Jingxin Tu"}], "author_count": 1}, {"id": "2611.33354", "category": "hep-th", "title": "Identifying Renormalization Group Interfaces of Massless WZW Flows $\\widehat{\\mathfrak{su}}(2)_k \\to \\widehat{\\mathfrak{su}}(2)_1$", "abstract": "A renormalization-group interface encodes how a flow relates operators at short and long distances. We identify this interface up to topological dressing for the conjectured massless $\\widehat{\\mathfrak{su}}(2)_k \\to \\widehat{\\mathfrak{su}}(2)_1$ Wess-Zumino-Witten flows at every odd level $k\\geq 3$. Global $SU(2)$ symmetry requires the interface to preserve a diagonal current algebra at level $k+1$, built from the currents on its two sides. The $\\mathbb{Z}_2$ center symmetry then selects which representation labels the interface. This identification predicts distinct patterns of low-lying interface excitations for flows to the same infrared fixed point. Spin-chain calculations reproduce these patterns for $k=3$ and $5$, providing independent evidence for both conjectured flows.", "url": "https://arxiv.org/abs/2611.33354", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuma Furuta"}, {"name": "Yuya Kusuki"}, {"name": "Toshiki Onagi"}, {"name": "Yin Tang"}], "featured_authors": [{"name": "Yuma Furuta"}, {"name": "Yuya Kusuki"}, {"name": "Toshiki Onagi"}, {"name": "Yin Tang"}], "author_count": 4}, {"id": "2611.33415", "category": "hep-th", "title": "An Argument for the Weak Gravity Conjecture from Constrained Wormholes", "abstract": "The gravitational path integral (GPI) computes inner products between states of open and closed universes in any low-energy effective theory. A well-defined Hilbert space requires these inner products to be positive semidefinite, but this positivity is not manifest in the effective theory. In this paper, we study the constraints that positivity imposes on Einstein--Maxwell theory coupled to charged matter in asymptotically flat space in $D\\geq 4$ dimensions. We start by constructing a new class of constrained instantons that compute multi-boundary wormhole amplitudes. We show that, under mild assumptions, if no charged particle satisfies the weak gravity conjecture (WGC), these amplitudes violate positivity of the GPI. If instead some particle satisfies the WGC, the wormholes develop an instability that allows positivity to be restored. The same argument shows that positivity can only be restored if the magnetic WGC holds and the convex hull condition applies to theories with several $\\mathrm{U}(1)$ gauge fields.", "url": "https://arxiv.org/abs/2611.33415", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Gabriele Di Ubaldo"}, {"name": "Luca V. Iliesiu"}, {"name": "Dawid Maskalaniec"}], "featured_authors": [{"name": "Gabriele Di Ubaldo"}, {"name": "Luca V. Iliesiu"}, {"name": "Dawid Maskalaniec"}], "author_count": 3}, {"id": "2611.33445", "category": "hep-th", "title": "Probe branes from equivariant volumes", "abstract": "Classical Euclidean probe actions control non-perturbative weights and extended observables in holography. We present a geometric prescription for M2-branes in arbitrary BPS backgrounds and D3-branes in the five-form sector of type IIB. The framework accommodates compact and non-compact supersymmetric worldvolumes in both internal and spacetime directions, expressing their actions as relative equivariant pairings. Under stated extension and boundary assumptions, equivariant volumes evaluate these pairings without explicit background metrics and provide a regularization for non-compact probes. Examples in $\\mathrm{AdS}_4\\times SE_7$ backgrounds dual to ABJM, ADHM and flavored quiver theories reproduce and refine worldsheet-type instanton exponents and finite Wilson-loop actions. We also recover M2 giant-graviton and surface-defect actions in $\\mathrm{AdS}_7\\times S^4$. D3 probes in $SE_5$ compactifications dual to $\\mathcal{N}=4$ super Yang--Mills and Klebanov--Witten theory provide tests involving giant gravitons, black hole probes and surface defects.", "url": "https://arxiv.org/abs/2611.33445", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kiril Hristov"}, {"name": "Pedro Vicente Marto"}], "featured_authors": [{"name": "Kiril Hristov"}, {"name": "Pedro Vicente Marto"}], "author_count": 2}, {"id": "2611.33564", "category": "hep-th", "title": "All known supersymmetric $\\mathrm{AdS}_4 \\times S^7$ uplifts from maximal supergravity", "abstract": "The solutions of $D=4$ $\\mathcal N=8$ SO(8)-gauged supergravity uplift consistently to eleven dimensions. All known supersymmetric AdS$_4$ vacua of this theory lie in an $\\mathcal N=1$ truncation containing seven chiral multiplets. In this paper, we work out the uplift of this seven-chiral sector, providing a unified eleven-dimensional geometric description of all known supersymmetric AdS$_4$ solutions in this class. We then specialise to the $\\mathcal N=1$ vacua with U(1)$^2$ and SO(3) symmetry, obtain their new $D=11$ uplifts and bring out their internal geometries. Both of them admit a Kaluza--Klein-type description. For the U(1)$^2$ solution, this uses the global Hopf fibration of $S^7$ over $\\mathbb{CP}^3$. One U(1) acts on the fibre, while the other generates the only continuous isometry of the deformed $\\mathbb{CP}^3$ base. For the SO(3) solution, the geometry takes a local non-abelian Kaluza--Klein form, with SO(3) acting on the fibres and no residual continuous symmetry on the four-dimensional base.", "url": "https://arxiv.org/abs/2611.33564", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Krzysztof Pilch"}, {"name": "Oscar Varela"}], "featured_authors": [{"name": "Krzysztof Pilch"}, {"name": "Oscar Varela"}], "author_count": 2}, {"id": "2611.33599", "category": "hep-th", "title": "Holographic probes and Krylov complexity on asymptotically Lifshitz rotating black branes", "abstract": "We study two types of holographic probes on a five-dimensional, asymptotically Lifshitz, rotating black hole. This geometry solves the field equations of Einstein gravity coupled to a dilaton, two axionic scalars, and a Maxwell doublet, supplemented by two vector doublets that enter the action through a parity-odd, Chern-Simons-like combination, as recently found in \\cite{Bravo-Gaete:2026bdq}. This spacetime provides a concrete bottom-up arena to explore the imprints of rotation on probes in non-relativistic holography. First, we compute the holographic static quark-antiquark potential following the standard prescription that relates this boundary observable to the on shell-action of a string configuration whose endpoints are anchored at the boundary. We find that the screening length decreases both when the angular momentum is increased at fixed temperature and when the temperature is increased at fixed angular momentum. The former reflects centrifugal effects on the $q\\bar{q}$ pair, whereas the latter stems from enhanced thermal fluctuations, which weaken correlations at a given separation. Second, we compute the growth rate of the Krylov complexity, using the holographic prescription that relates this observable to the momentum of a massive particle probe falling into the IR. In particular, we find that, at a given instant, the complexity grows faster as the dynamical exponent $z$ is increased.", "url": "https://arxiv.org/abs/2611.33599", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Moises Bravo-Gaete"}, {"name": "Mariano Chernicoff"}, {"name": "Benjamin Mellado"}, {"name": "Julio Oliva"}, {"name": "Maria Guadalupe Olmos Andrade"}], "featured_authors": [{"name": "Moises Bravo-Gaete"}, {"name": "Mariano Chernicoff"}, {"name": "Benjamin Mellado"}, {"name": "Julio Oliva"}, {"name": "Maria Guadalupe Olmos Andrade"}], "author_count": 5}, {"id": "2611.33620", "category": "hep-th", "title": "The Dirac equation in arbitrary coordinate systems and curved spacetimes - An orthonormal frames approach", "abstract": "In this pedagogical article we discuss the Dirac equation in arbitrary coordinate systems. We explain the need for connections when dealing with spinor fields and present the practical steps needed to compute the Dirac operator in a general setting, allowing for arbitrary coordinate systems and position-dependent orthonormal gamma matrices, both of which can simplify computations in certain scenarios. The extension to include minimally coupled gravity is straightforward. Examples are provided, including constructing the Dirac equation in spherical and cylindrical symmetry (with or without gravity) and the Kerr spacetime. We also briefly comment on the advantages and disadvantages of various tetrads and orthonormal gamma matrices. This manuscript should be accessible to readers who have studied the Dirac equation at an introductory level (e.g., in Cartesian coordinates in flat spacetime with constant gamma matrices). The emphasis is on the use of orthonormal frames, since these correspond to the coordinate systems most familiar to readers when dealing with most field theories, and represent the physical frames where measurements are performed. The aim is to get the reader quickly to the point of being able to do calculations, so the presentation favors a concise, pragmatic approach over extended derivations.", "url": "https://arxiv.org/abs/2611.33620", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrew DeBenedictis"}, {"name": "Saša Ilijić"}], "featured_authors": [{"name": "Andrew DeBenedictis"}, {"name": "Saša Ilijić"}], "author_count": 2}, {"id": "2611.33744", "category": "hep-th", "title": "Late-time OTOCs in Toda conformal field theory", "abstract": "We study late-time out-of-time-order correlators (OTOCs) of semi-degenerate primary fields in two-dimensional $A_{N-1}$ Toda conformal field theory. In Liouville theory ($N=2$), we find that the OTOC decays as $t^{-3/2}$ when the continuum edge dominates, correcting a previously reported constant limit. For $N=3$, a transverse contour pinch reduces the spectral integral to one dimension. Assuming that the reduced expansion is complete, in the continuous phase the regulated edge behaves as a discrete state, and the OTOC approaches a pure braiding phase. As we check numerically, the edge block is a free-field correlator in a charge-neutral Weyl frame; this explains the pure phase and is consistent with crossing symmetry. For both $N=2$ and $N=3$, a dominant discrete residue gives a constant late-time limit. For $N\\geq4$, the same one-dimensional reduction violates a crossing bound on the lowest intermediate weight of a positive diagonal expansion. Hence the $N=2,3$ phase diagram does not extend to higher rank without additional contributions below the reduced continuum edge or outside a positive diagonal expansion.", "url": "https://arxiv.org/abs/2611.33744", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Giwan Kim"}, {"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Giwan Kim"}, {"name": "Masahito Yamazaki"}], "author_count": 2}, {"id": "2611.34082", "category": "hep-th", "title": "Defect Correlators from Supergravity: Finding the Missing Contact Terms", "abstract": "We resolve a puzzle in the computation of holographic correlators using supergravity when defects are present. Previous direct supergravity calculations of defect two-point functions were found to differ from bootstrap results by a set of contact contributions. We show that the discrepancy arises from two effects: nonlinear Kaluza-Klein field redefinitions in the bulk, which induce additional quadratic couplings when applied consistently to localized sources, and off-shell terms in mixed bulk--defect vertices, which can collapse internal defect propagators. We demonstrate how these two mechanisms resolve the puzzle in two concrete examples in 4d $\\mathcal{N}=4$ SYM, where we consider two-point correlators in the presence of a $\\frac{1}{2}$-BPS Wilson line and on $\\mathbb{RP}^4$.", "url": "https://arxiv.org/abs/2611.34082", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Qi Chen"}, {"name": "Xinan Zhou"}], "featured_authors": [{"name": "Qi Chen"}, {"name": "Xinan Zhou"}], "author_count": 2}, {"id": "2611.34097", "category": "hep-th", "title": "Higher derivatives and ghosts through three centuries", "abstract": "We outline the history of the research of dynamic systems including higher derivatives in the Lagrangian, The story starts in 1744 when Euler published a book where the Euler--Lagrange differential equations for a HD system were first written. The next important landmarks were the papers of Ostrogradsky (1850) and of Pais and Uhlenbeck (1950). Many articles written in the second half of the last century were influenced by a misconception that was widespread at the time --- it was believed that higher derivatives necessarily bring about a violation of unitarity. We understand today that this is not the case and there are many systems with benign ghosts where HD are present but unitarity is not violated. In this review, we present and discuss several examples of such (quantum) mechanical systems and 2D field theories. Then we will briefly discuss higher-derivative gravity theories in 4 dimensions. In that case, the question whether the ghosts there are benign or not has a special status due to the absence of a nonperturbative Hamiltonian and does not have a definite answer yet. However, if one restricts oneself to classical theory, one can argue that the ghosts {\\it are} benign (benign classical ghostly system is a system that needs an infinite time to reach a singularity, and it seems to the case both in ordinary and in HD gravity: the cosmic censorship conjecture implies that the singularities are always surrounded by horizons, and it takes an infinite time on the clocks of a distant observer to reach a horizon). Finally, I discuss supersymmetric HD theories: conformal supergravity, where the ghosts are also probably benign, and then an interesting supersymmetric HD gauge theory in 6 dimensions. It involves a dimensionless coupling constant, is renormalizable and rather beautiful. Unfortunately, it is not unitary --- ghosts are not benign there.", "url": "https://arxiv.org/abs/2611.34097", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrei Smilga"}], "featured_authors": [{"name": "Andrei Smilga"}], "author_count": 1}, {"id": "2611.34129", "category": "hep-th", "title": "Reconstructing massive quivers on a defect circle", "abstract": "We study the kink and particle spectra for the massive $\\phi_{2,1}$-deformations of minimal models $\\mathcal M_{k+1,k+2}$ via truncated conformal space approach (TCSA) on a defect circle. The massive $\\phi_{2,1}$-deformation preserves a set of non-invertible symmetries, furnishing a fusion category $\\mathcal C_k\\simeq {\\rm SO}(3)_k$. These non-invertible symmetries are spontaneously broken, and thus label the vacua and organize the kinks and particles into their multiplets in terms of quiver diagrams. We employ a finite-volume truncated Hamiltonian approach on defect Hilbert spaces, $\\mathcal H_{X_i}$ for $X_i\\in\\mathcal C_k$, to study these quivers in the IR theories. The symmetry defect can then close an individual kink on a circle. We first establish the relation between states of definite fractional momentum on the defect circle and physical kink and particle states labelled by their vacuum pairs. Using form factors of local fields, we independently measure the squared amplitudes between the states of the two bases in defect TCSA. Combining these measurements with defect TCSA spectra, we reconstruct the quiver diagrams for $k=3,4,5$ without assuming them in advance. In particular, for $k=4$ we reconstruct the distinct quivers of the ordered and disordered phases. For $k=5$, we identify the quivers of both the light and heavy multiplets.", "url": "https://arxiv.org/abs/2611.34129", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ting-Kai Chen"}, {"name": "Jin Chen"}], "featured_authors": [{"name": "Ting-Kai Chen"}, {"name": "Jin Chen"}], "author_count": 2}, {"id": "2611.34369", "category": "hep-th", "title": "Robin--Hadamard states for unstable field in half-Minkowski spacetime", "abstract": "We investigate the quantization of a real massless scalar field in four-dimensional half-Minkowski spacetime subject to an attractive Robin boundary condition. We show that the unstable modes, required for classical spectral completeness, are also essential to recover the canonical commutation relations (CCR) of the complete quantum field. By specifying the Cauchy covariances of the unstable sector, we construct a family of positive quasifree states compatible with the conservation of total energy. Within this family, positivity is incompatible with stationarity, so that the resulting states necessarily break the time-translation symmetry of the background. We also obtain a closed position-space representation of the two-point function for the chosen stable vacuum sector, including the contribution fixed by the CCR in the unstable sector. The resulting expression exhibits the direct and reflected singularities, including Robin-dependent logarithmic terms. Since the remaining unstable contribution is smooth, all states in the constructed family share the same singularity structure, consistent with the Robin--Hadamard framework.", "url": "https://arxiv.org/abs/2611.34369", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bruno S. Felipe"}, {"name": "João P. M. Pitelli"}, {"name": "Claudio Dappiaggi"}], "featured_authors": [{"name": "Bruno S. Felipe"}, {"name": "João P. M. Pitelli"}, {"name": "Claudio Dappiaggi"}], "author_count": 3}, {"id": "2611.34421", "category": "hep-th", "title": "Quark-Loop Corrections and Auxiliary Field-Strength Mixing in First-Order QCD", "abstract": "In the first-order formulation of Yang-Mills theory the gluon field strength is an independent auxiliary field $F$, and the only gluon self-interaction is a momentum-independent cubic vertex. We determine how quarks, which couple only to the gauge field, act on this structure. Their divergences are multiples of $f(A)\\cdot f(A)$, a term absent from the first-order Lagrangian that no rescaling can produce. Working with the background-field method in a general covariant gauge, we find that the quark sector is renormalized entirely by the mixing of the auxiliary field with the field strength known from pure Yang-Mills theory, $F_0=F+z\\,f(A)$, with quark coefficient $z=-\\alpha_sT_FN_f/(6\\pi\\bar\\epsilon)$, together with a rescaling of the gluon field and no rescaling of $F$, so that the renormalized auxiliary field runs into the gluon field strength. When a heavy quark of mass $M$ is integrated out, the same mixing survives as a finite threshold coefficient $c=(\\alpha_sT_F/6\\pi)\\ln(M^2/\\mu^2)$, whose scale dependence is exactly the heavy-quark share of the running, and the invariant combination of the couplings reproduces the decoupling of $\\alpha_s$. Below the threshold, when the leading power correction is kept as a gauge-sector operator, the auxiliary field is no longer the field strength: $F=f(A)+(g\\alpha_sT_F/15\\pi M^2)(D_\\alpha J_\\beta-D_\\beta J_\\alpha)$, with $J$ the light-quark colour current. We verify this identity against the full theory and show that it separates the long-distance gluon exchange, carried by $F$, from the short-distance heavy-quark effect, carried by a four-quark contact term.", "url": "https://arxiv.org/abs/2611.34421", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hasnat Mohammad Nayeem"}], "featured_authors": [{"name": "Hasnat Mohammad Nayeem"}], "author_count": 1}, {"id": "2611.34444", "category": "hep-th", "title": "Black hole entropy from angular holonomies of Sine-Gordon soliton lattices in AdS$_3$", "abstract": "We construct boundary conditions for AdS$_3$ gravity that realize Sine-Gordon dynamics. For a periodic soliton lattice at fixed winding, we relate the angular holonomy to the exact acoustic dispersion by continuing the Bloch momentum through the zero-frequency band edge associated with rigid translation of the lattice. For suitable embedding angles, the stable vacuum has a regular BTZ geometry. When only one chiral sector carries winding, we construct a family whose asymptotic region extends to a BTZ black hole. As the spectral parameter of the winding sector tends to the corresponding band edge, the black hole approaches extremality. The leading correction to the extremal entropy is linear in the Hawking temperature defined with respect to laboratory time, with a coefficient inversely proportional to the sound velocity of the lattice. The same inverse-velocity dependence appears in the low-temperature entropy of one-dimensional quantum fluids.", "url": "https://arxiv.org/abs/2611.34444", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Marcela Cárdenas"}, {"name": "Francisco Correa"}, {"name": "Nicolás Salazar"}], "featured_authors": [{"name": "Marcela Cárdenas"}, {"name": "Francisco Correa"}, {"name": "Nicolás Salazar"}], "author_count": 3}, {"id": "2611.34487", "category": "hep-th", "title": "Superconformal Index Identities for Dual Gauge Theories", "abstract": "We study superconformal index identities for three classes of dual four-dimensional gauge theories. For $\\mathcal N=4$ super-Yang--Mills theory with gauge groups $SO(2n+1)$ and $USp(2n)$, we prove at every rank the equality of flavored Schur indices predicted by $S$-duality, using Rains's diagonal trace transformation. For Kutasov--Schwimmer duality with adjoint superpotential $\\textrm{Tr} X^{k+1}$, we prove the index identity between $SU(k+1)$ and $SU(k-1)$ with two flavors at independent elliptic nomes $p,q$, in the ultraviolet assignment $R(Q)=0$. On the locus $p=q^k$, we reduce the identity to that of ordinary supersymmetric QCD whenever the specialized expressions are generically regular. Finally, we test the dualities conjectured by Cho and Song between quiver and single-group descriptions of four families of Argyres--Douglas theories. For the rank-one $H_1$ theory we prove equality of the two full flavored indices, and for each family at arbitrary rank we evaluate the generalized Coulomb index in both descriptions, obtaining the product formula conjectured by Buican and Jiang.", "url": "https://arxiv.org/abs/2611.34487", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Min-xin Huang"}, {"name": "Gao-fu Ren"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Min-xin Huang"}, {"name": "Gao-fu Ren"}, {"name": "Xin Wang"}], "author_count": 3}, {"id": "2611.34588", "category": "hep-th", "title": "Power-law tunneling in the Razavy hyperbolic double well: Heun connection formulas and their resonances", "abstract": "We study nonperturbative level splitting in the symmetric Razavy hyperbolic double well, relating its double-confluent Heun connection problem to exact WKB and quasi-exact solvability. In the weak-coupling limit the wells separate logarithmically and approach two Morse systems. Reflection factorizes the two-ended spectral condition into separate even and odd quantization conditions. For each normalizable Morse level with noninteger decay exponent, the irregular-block connection formula yields the leading splitting with its full gamma-function coefficient, two analytic fluctuation corrections, and the leading logarithmic three-traversal contribution. The noninteger power of the coupling follows from the logarithmic growth of the barrier action. We express the classical periods in terms of complete elliptic integrals and derive the first quantum-period correction. At integer exponent, a convergent reduction onto the two resonant Floquet modes resolves the singular fixed-order expansion into two local spectral branches and reproduces the known finite-spin tunneling gap.", "url": "https://arxiv.org/abs/2611.34588", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jie Ren"}, {"name": "Xuanzhuang Wu"}], "featured_authors": [{"name": "Jie Ren"}, {"name": "Xuanzhuang Wu"}], "author_count": 2}, {"id": "2611.34619", "category": "hep-th", "title": "The all-loop spectrum of GGK strings", "abstract": "We study the non-perturbative spectrum of the non-relativistic limit of string theory in AdS$_5\\times$S$^5$, also known as GGK theory. In light-cone gauge, we show that the bosonic spectrum on a number of vacua is described at all-loops by free massive and massless scalar fields in AdS$_2$, confirming a conjecture by de Leeuw, Fontanella and Nieto-García, arXiv:2403.09563 . In static gauge, we obtain the same result for any classical string vacuum, and including fermions. We compute the quantum correction to the classical energy, and show that it vanishes once we adopt the regularised Hurwitz series. We conclude that the quantum energy spectrum built upon any GGK string consists solely of its classical vacuum energy.", "url": "https://arxiv.org/abs/2611.34619", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Marius de Leeuw"}, {"name": "Andrea Fontanella"}, {"name": "Cameron Gibson"}, {"name": "Juan Miguel Nieto García"}], "featured_authors": [{"name": "Marius de Leeuw"}, {"name": "Andrea Fontanella"}, {"name": "Cameron Gibson"}, {"name": "Juan Miguel Nieto García"}], "author_count": 4}, {"id": "2611.34705", "category": "hep-th", "title": "Interfaces in Long Range CFT$_1$", "abstract": "We consider interfaces in the theory of a single free scalar in AdS$_2$ defined by adding relevant operators along portions of the boundary. We begin with Neumann/Dirichlet interfaces, computing the associated scaling dimension and $g$-factor ratio; we also explain how arbitrary interface correlators can be computed numerically efficiently. Then we move on to interfaces between generalized free field and long-range interacting theories such as long range Ising, determining many quantities in perturbation theory. Finally we setup a bootstrap problem for four-point interface correlator. We use this to find tight bounds on the $g$-factor ratio as a function of the interface scaling dimension.", "url": "https://arxiv.org/abs/2611.34705", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bastien Girault"}, {"name": "Miguel F. Paulos"}], "featured_authors": [{"name": "Bastien Girault"}, {"name": "Miguel F. Paulos"}], "author_count": 2}, {"id": "2611.34706", "category": "hep-th", "title": "Entanglement and HBAR entropy in a Lorentzian non-commutative black hole", "abstract": "We investigate how Lorentzian non-commutative smearing affects entanglement and horizon brightened acceleration radiation (HBAR) outside a black hole. For a massless scalar field, tracing over the interior partner gives the exterior quantum channel, its logarithmic negativity, mutual information, and Bell entanglement fidelity. At fixed mass and Killing frequency, increasing the smearing lowers the surface gravity, increases the accessible correlations, and suppresses the leading atomic emission probability. The horizon displacement begins at order $\\sqrt{\\Theta}$, while the thermal correction at infinity begins at order $\\Theta$. At fixed local frequency, the redshift introduces a term of order $\\sqrt{\\Theta}$ at fixed areal radius. Holding the proper distance fixed, it cancels this term and recovers the common Rindler response close to the horizon. For a freely falling atom, emission and absorption obey detailed balance at the Hawking temperature in the leading horizon approximation. Random atomic injection drives the selected mode from the vacuum to a thermal state with an exact relaxation law and nonnegative entropy production. Near equilibrium, we obtain $\\dot S_{\\rm HBAR}\\simeq\\dot A_p/4$ when the radiated energy is drawn from horizon heat, where $\\dot A_p$ is the positive radiative area loss. When the radiation is assigned to ADM mass loss at fixed smearing length $\\ell=4\\sqrt{\\Theta/\\pi}$, the result is $\\dot S_{\\rm HBAR}\\simeq\\dot A_p/[4(1-\\ell/r_+)]$. The mass dependence of the exterior source thus enters the entropy per unit area lost at order $\\sqrt{\\Theta}$.", "url": "https://arxiv.org/abs/2611.34706", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A. A. Araújo Filho"}, {"name": "N. Heidari"}, {"name": "P. H. M. Barros"}, {"name": "V. B. Bezerra"}, {"name": "A. R. Queiroz"}, {"name": "A. F. Santos"}, {"name": "Ali Övgün"}], "featured_authors": [{"name": "A. A. Araújo Filho"}, {"name": "N. Heidari"}, {"name": "P. H. M. Barros"}, {"name": "A. R. Queiroz"}, {"name": "A. F. Santos"}, {"name": "Ali Övgün"}], "author_count": 7}, {"id": "2611.34715", "category": "hep-th", "title": "Rényi multi-entropy from Riemann surfaces", "abstract": "We compute vacuum tripartite Rényi multi-entropy in a two-dimensional compact-boson conformal field theory (CFT). For every integer Rényi index $n\\geq2$, we evaluate the partition function on the replica Riemann surface for disjoint intervals, obtaining the twist four-point function in terms of a ratio of theta functions. An independent calculation of the partition function on a Fermat curve yields the adjacent three-point coefficient. In the fusion limit, the Riemann surface for disjoint intervals degenerates into two Fermat curves, and the residue of the four-point function reproduces the squared three-point coefficient, as required by the operator product expansion. The genuine multi-entropy therefore approaches twice its strictly adjacent value. The CFT predictions agree with lattice calculations for the critical XXZ and Ising spin chains and a harmonic chain. We also exhibit a unitary CFT in which the canonical replica construction yields complex Rényi multi-entropy.", "url": "https://arxiv.org/abs/2611.34715", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kenya Tasuki"}], "featured_authors": [{"name": "Kenya Tasuki"}], "author_count": 1}, {"id": "2611.34791", "category": "hep-th", "title": "Logarithmic scalar soft factorization from matching conditions", "abstract": "Logarithmic soft theorems in QED and gravity can be understood as conservation laws associated with asymptotic symmetries. In contrast, for a massless scalar, no gauge symmetry is available to organize this relation. Despite that, we show that the logarithmic soft factorization for a massless scalar coupled to massive fermions through a Yukawa interaction follows from the asymptotic field equations and matching conditions at spatial infinity. From the first subleading logarithmic fall-off, we construct a conserved surface integral whose boundary values satisfy the antipodal map between past and future null infinity. At future null infinity, the field equations relate this quantity to the $1/u$ tail of the scalar radiation, while at past null infinity, for scattering states without incoming scalar radiation, it is carried by a non-radiative logarithm of the incoming particles. We derive the classical tail from the particle trajectories and obtain the hard charge from the asymptotic Dirac current. The particular solution of the leading scalar field gives the classical contribution, while its homogeneous component gives the quantum contribution. The resulting Ward identity reproduces the logarithmic soft coefficient of the one-loop scalar emission (up to a zero mode on the sphere), including its classical and quantum parts.", "url": "https://arxiv.org/abs/2611.34791", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matías Briceño"}, {"name": "Hernán A. González"}, {"name": "Oriana Labrin"}], "featured_authors": [{"name": "Matías Briceño"}, {"name": "Hernán A. González"}, {"name": "Oriana Labrin"}], "author_count": 3}, {"id": "2611.34824", "category": "hep-th", "title": "A Pole-Cut Formula for Holographic Extremal Correlators", "abstract": "We show that the holographic spectral function of a neutral massless scalar on the extremal Reissner-Nordstrom black brane in $AdS_5$ admits an elegant formula in terms of the quasi-normal modes (QNMs) and branch-cut data. In the extremal case, the spectral data comprises the zeros of the boundary source function, i.e. the QNMs, as well as its phase discontinuity across the branch cut on the negative imaginary axis of the complex frequency plane. This formula neatly factorizes into an infinite product over the QNM poles and a factor encoding the branch cut discontinuity. We derive this pole-cut formula as the zero-temperature limit of the QNM product formula for holographic thermal correlators, with the branch-cut contribution arising from the coalescence of the QNMs on the negative imaginary axis. We also clarify the role of the near-horizon $AdS_2$ region in this context. Consistency with the OPE of the boundary correlator provides extremal sum-rules involving both the QNMs as well as the phase discontinuity function. We also find that this holographic consistency forces the asymptotic form of the QNMs to be related to the asymptotics of the phase discontinuity function. We verify our formula and these OPE constraints numerically. We also demonstrate that, in the time domain, the pole and cut factors each produce complex-time singularities, whose location is determined by the optical distance between the boundary and the black-brane singularity. We expect the pole-cut factorization structure of spectral functions to hold for more general fluctuations of extremal black branes.", "url": "https://arxiv.org/abs/2611.34824", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jyotirmoy Bhattacharya"}, {"name": "Amiya Mishra"}, {"name": "Aditya Sharma"}, {"name": "Sourav Singha"}], "featured_authors": [{"name": "Jyotirmoy Bhattacharya"}, {"name": "Amiya Mishra"}, {"name": "Aditya Sharma"}, {"name": "Sourav Singha"}], "author_count": 4}, {"id": "2611.34829", "category": "hep-th", "title": "Character expansion of the Itzykson-Zuber pair correlator", "abstract": "We revisit a long-standing problem of correlation functions with the Harish-Chandra-Itzykson-Zuber measure. The immediate goal is to reproduce the long-known answer for pair correlator in the form of character expansion - a sum over Schur polynomials with carefully adjusted coefficients. The infinite sum can be folded up into exponentials with the help of the Cauchy identity. What matters are the coefficients, which we express in terms of projectors, made from Cherednik operators. Development of character expansion methods for unitary integrals, which are much more difficult than the Hermitian ones, gives a hope for further generalizations - up to arbitrary correlators with non-trivial measures.", "url": "https://arxiv.org/abs/2611.34829", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexei Morozov"}, {"name": "Hasib Sifat"}], "featured_authors": [{"name": "Alexei Morozov"}, {"name": "Hasib Sifat"}], "author_count": 2}, {"id": "2611.34886", "category": "hep-th", "title": "Time-weighted energy correlators are infrared unsafe in gauge theories", "abstract": "Energy correlators are infrared safe because each detector weights a parton by its energy, but a weight in the arrival time makes them infrared unsafe in gauge theories. For the state created by a scalar operator that makes two partons at lowest order in a weakly coupled conformal gauge theory, we show that the correlator of two time-weighted energy detectors (the light-ray operators $\\int\\!du\\,u\\,T_{uu}$) at separated directions diverges at two loops like the logarithm of the time window. The logarithm does not come from a single soft gluon, but from a soft parton pair with comparable energies, one parton in each detector; its coefficient is a closed-form function of the angle for any matter content. In $N=4$ super Yang-Mills theory, we recover this coefficient from the two-gluon Regge term of the known four-point function and derive a simple relation to the logarithm in the charge correlator. In the planar theory the leading logarithms resum to a power of the window, set by the BFKL intercept.", "url": "https://arxiv.org/abs/2611.34886", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Siqing Yu"}], "featured_authors": [{"name": "Siqing Yu"}], "author_count": 1}, {"id": "2611.34892", "category": "hep-th", "title": "Massive Triangle in Cosmological Correlator beyond Conformal Coupling", "abstract": "A massive scalar coupled in pairs to the inflaton generates a one-loop primordial bispectrum whose mass corrections at generic momenta have lacked closed analytic expressions beyond conformal coupling. We obtain two leading mass corrections at arbitrary external momenta in terms of multiple polylogarithms of uniform weights three and four. Auxiliary-energy dressings preserve rational time integrals, revealing unexpected simplicity despite elliptic intermediate geometry. Independent full-loop evaluations, including blinded predictions, validate the closed forms. We also determine a subleading light-field singularity and recover the heavy-mass effective theory.", "url": "https://arxiv.org/abs/2611.34892", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Taushif Ahmed"}, {"name": "Syed Mehedi Hasan"}], "featured_authors": [{"name": "Taushif Ahmed"}, {"name": "Syed Mehedi Hasan"}], "author_count": 2}, {"id": "2611.34922", "category": "hep-th", "title": "Vacuum correlation measures as CFT partition functions", "abstract": "We show that in any $d$-dimensional CFT, the vacuum sandwiched Rényi mutual information (SRMI) of integer order $n$ between two disjoint balls maps to a CFT partition function on a manifold of topology $\\#^{n-1}(S^1 \\times S^{d-1})$, with moduli fixed by the ball configuration and single-ball modular flow. At $n=2$, it is given by the thermal partition function on $S^{d-1}$, upper-bounding the von Neumann mutual information. For $n>2$, SRMI diverges at finite separation due to a hot-spot limit of the partition function. Explicit CFT evaluations agree well with density matrix computations.", "url": "https://arxiv.org/abs/2611.34922", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hewei Frederic Jia"}], "featured_authors": [{"name": "Hewei Frederic Jia"}], "author_count": 1}, {"id": "2611.34924", "category": "hep-th", "title": "An algebraic quantization of gravity from the null cone", "abstract": "We propose a background independent quantization of vacuum general relativity on four dimensional Lorentzian spacetimes. Starting from first order gravity, we solve the gravitational constraints on intersecting null cones of a bulk subregion and obtain the reduced phase space at finite $G_N$. We promote its canonical Poisson brackets to commutation relations and use deformations of the reduced action to define an algebra of observables. Equipped with this, we use Gaussian wavefunctions of canonical pairs to construct a nonperturbative Hilbert space representation, for which this algebra generates a type I factor. By composing amplitudes between states prepared on null cones, we then obtain a Lorentzian path integral in which each sum over intermediate states converges absolutely. As a check, we compute the amplitude for graviton pair creation and annihilation on a null cone nonperturbatively in $G_N$ and find a finite closed form expression, even though expanding first in $G_N$ yields a logarithmic divergence. We next use diffeomorphism invariance of the path integral to show that a macroscopic causal diamond with a given maximum size has a finite dimensional Hilbert space. From the Lorentzian trace we obtain the Bekenstein Hawking entropy for marginally trapped surfaces and calculate its logarithmic correction for large Schwarzschild black holes, recovering at one loop the coefficient Sen obtained through Euclidean methods. We end by deriving the semiclassical Einstein equations to one loop as the low energy limit of this theory.", "url": "https://arxiv.org/abs/2611.34924", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Venkatesa Chandrasekaran"}], "featured_authors": [{"name": "Venkatesa Chandrasekaran"}], "author_count": 1}, {"id": "2611.33185", "category": "math-ph", "title": "A Coupled Thermomechanical Model with Volterra Memory: Influence of the Kernel Class on Relaxation Asymptotics", "abstract": "The aim of this study is to determine how the class and asymptotic behaviour of a Volterra memory kernel influence relaxation in a coupled thermomechanical model. The model describes the mutual interaction between an internal mechanical variable and temperature through temperature-dependent material properties and mechanical dissipation. The analysis combines a Volterra integral formulation, a spectral representation of the memory mechanism, thermodynamic decomposition of the hereditary power, local well-posedness analysis, linearization near equilibrium, and Laplace-transform asymptotic arguments. The spectral representation separates the energy stored in the relaxation modes from irreversible hereditary dissipation and establishes the thermodynamic consistency of the memory contribution. Under minimal assumptions on the constitutive functions and the kernel, local existence and uniqueness of solutions are obtained; for thermodynamically dissipative memory and a non-negative external heat source, positivity of the absolute temperature is preserved. The main result concerns the linearized dynamics near equilibrium: with the thermomechanical coupling kept unchanged, an exponential kernel produces exponential relaxation, whereas a power-law kernel with a long tail produces algebraic relaxation. A numerical comparison performed for the same set of dimensionless thermomechanical parameters illustrates these two asymptotic regimes. The results show that changing the class of the memory kernel alone can change the qualitative long-time relaxation law of the coupled system.", "url": "https://arxiv.org/abs/2611.33185", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrii Siasiev"}], "featured_authors": [{"name": "Andrii Siasiev"}], "author_count": 1}, {"id": "2611.33186", "category": "math-ph", "title": "Time-reflection nonlocal equations from $\\mathcal{P}\\mathcal{T}$-symmetric oscillator pairs: physical origin and variational formulation", "abstract": "We show that every second-order differential equation with time reflection describes the $\\mathcal{P}\\mathcal{T}$-symmetric solutions of a local pair of oscillators that is invariant under exchange combined with time reversal. For linear equations the pair is built from springs, balanced gain and loss, and a gyroscopic coupling. We determine when such a pair has a regular first-order Lagrangian, and when the solutions of the equation fix its coefficients. As the main example, we consider a recently studied equation whose solutions do not depend on its velocity coupling. In the corresponding pair this coupling acts only on the conserved total momentum, which vanishes for $\\mathcal{P}\\mathcal{T}$-symmetric solutions, and each of the two conditions that single out the model places the pair at an exceptional point. When the spring and velocity couplings are both nonzero, the pair has no regular first-order Lagrangian, while the equation has one with second derivatives. We also propose an electronic realization and construct a Bateman-type Hamiltonian, from which the velocity coupling is removed by a canonical transformation.", "url": "https://arxiv.org/abs/2611.33186", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ilmar Gahramanov"}, {"name": "Yağızhan Şahin"}], "featured_authors": [{"name": "Ilmar Gahramanov"}, {"name": "Yağızhan Şahin"}], "author_count": 2}, {"id": "2611.33208", "category": "math-ph", "title": "A computer-assisted proof of one-cell snaking and lattice trapping for a nonlinear square lattice", "abstract": "We establish a computer-assisted proof of lattice trapping in an infinite nonlinear square lattice with interaction potential $\\phi(t)=(1-e^{-3t^2})/6$ and an antiplane crack far field $K\\sqrt{r}\\sin(\\theta/2)$. We construct a connected branch of equilibria whose single-cell segment contains exactly two nondegenerate quadratic folds, with a stability sequence of stable, Morse index one, and stable in the full energy space. The fold loads satisfy $0.45897<K_-<0.45923$ and $0.46219<K_+<0.46242$, establishing a strictly positive lattice-trapping width $K_+-K_->0.00296$. A uniqueness argument establishes exact translation closure and smooth continuation across lattice cells. The proof combines renormalized energy, Schur complement estimates, analytic infinite-tail bounds, interval arithmetic, and exact integer positivity certificates. All finite input data, verification programs, and recorded certificate outputs are provided in the accompanying certificate archive.", "url": "https://arxiv.org/abs/2611.33208", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jiangchao Qian"}], "featured_authors": [{"name": "Jiangchao Qian"}], "author_count": 1}, {"id": "2611.33224", "category": "math-ph", "title": "Bistable waves and propagation success on hexagonal lattice", "abstract": "Inspired by propagation phenomena occurring on media with hexagonal structures, we propose an idealized system of bistable reaction-diffusion equations posed on a hexagonal lattice, and investigate the existence and speed of traveling wave solutions. We establish a sharp criterion for propagation success (nonzero wave speed) and failure (zero wave speed), where the criterion is determined by an angle-dependent periodic threshold function and the ratio of two parameters in the nonlinearity. Moreover, the sign of the wave speeds is governed by the angle and the parameter ratio. Our results imply that the hexagonal structure and bistability significantly affect the propagation dynamics.", "url": "https://arxiv.org/abs/2611.33224", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jian Fang"}, {"name": "Yifei Li"}, {"name": "Yijun Lou"}, {"name": "Jian Wang"}], "featured_authors": [{"name": "Jian Fang"}, {"name": "Yifei Li"}, {"name": "Yijun Lou"}, {"name": "Jian Wang"}], "author_count": 4}, {"id": "2611.33570", "category": "math-ph", "title": "Equilibrium finiteness and Saari's conjecture for the planar circular restricted N-body problem", "abstract": "We establish two results for planar Newtonian centers in uniform rotation. First, the associated quadratic-plus-Newtonian amended potential has finitely many equilibria for every finite configuration of at least two distinct centers with positive masses. Second, every collision-free planar test-particle motion with constant amended potential, equivalently constant rotating-frame speed, is stationary in the rotating frame. When the centers are primary bodies in a circular relative equilibrium, this proves the amended-potential form of Saari's conjecture for the restricted \\(N\\)-body problem.", "url": "https://arxiv.org/abs/2611.33570", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Qinglong Zhou"}], "featured_authors": [{"name": "Qinglong Zhou"}], "author_count": 1}, {"id": "2611.34033", "category": "math-ph", "title": "On the level lines of bilayer potentials with a finite number of harmonics", "abstract": "We consider ``bilayer'' potentials formed by the superposition of two periodic potentials in a plane. We assume that both potentials share the same rotational symmetry and employ an approximation involving a finite number of harmonics in their Fourier expansions. An analysis of the level lines of the resulting quasiperiodic potential (a problem posed by S.P. Novikov) near the percolation threshold makes it possible to describe the behavior of large-scale closed level lines in this limit. The results presented here can also be applied to broader classes of bilayer potentials that possess ``good'' analytical properties.", "url": "https://arxiv.org/abs/2611.34033", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "A.Ya. Maltsev"}], "featured_authors": [{"name": "A.Ya. Maltsev"}], "author_count": 1}, {"id": "2611.34110", "category": "math-ph", "title": "Colored Jones polynomial of figure eight knot and non-perturbative topological recursion", "abstract": "The asymptotic expansion of the colored Jones polynomial of the figure eight knot is proved to be connected with non-perturbative topological recursion on the underlying elliptic spectral curve, following the proposal of Borot and Eynard.", "url": "https://arxiv.org/abs/2611.34110", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alexander Hock"}, {"name": "Sergey Shadrin"}], "featured_authors": [{"name": "Alexander Hock"}, {"name": "Sergey Shadrin"}], "author_count": 2}, {"id": "2611.34114", "category": "math-ph", "title": "Schwinger-Dyson recursion, Gröbner elimination and graph combinatorics", "abstract": "Schwinger-Dyson equations are a cornerstone of quantum field theory (QFT). Derived using integration by parts, they capture relations between correlators of different orders, forming an open, infinite-dimensional system. In zero-dimensional QFTs with polynomial actions, which is just a physical interpretation for multivariate Gaussian integrals with polynomial insertions, conventional Gröbner elimination can be used to express all higher-order correlators (moments) in terms of a fixed basis set. One consequence is a closed finite-dimensional system of differential equations for the coupling dependence of these `master' correlators. An important application of zero-dimensional QFTs is in counting discrete geometric structures (as in simplicial approaches to quantum gravity). For the problem of counting labelled regular graphs, applying this Schwinger-Dyson closure results in a computational breakthrough relative to the existing state-of-the-art: for 9- and 10-regular graphs on $n$ vertices, a finite-depth, finite-width recursive formulation is obtained, making it possible to compute the total graph counts in $O(n)$ arithmetic operations.", "url": "https://arxiv.org/abs/2611.34114", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Oleg Evnin"}], "featured_authors": [{"name": "Oleg Evnin"}], "author_count": 1}, {"id": "2611.34260", "category": "math-ph", "title": "Fundamental Symmetries in Krein Spaces", "abstract": "We study the space of fundamental symmetries of a real or complex Krein space in finite or infinite dimension. After recalling the equivalence of the associated Hilbert norms, we describe two global operator parametrizations and their relation. The space is realized as a Banach symmetric space under $m(J,J')=JJ'J$. Its canonical connection is the tangential projection of the flat derivative in the real Banach space of Krein-self-adjoint operators. This yields explicit formulas for geodesics, parallel transport, transvections, and curvature. The positive square roots $(JJ')^{1/2}$ implement both isometries between the associated Hilbert spaces and geodesic transvections. A proof of their intertwining property in an earlier publication is corrected.", "url": "https://arxiv.org/abs/2611.34260", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arkadiusz Jadczyk"}], "featured_authors": [{"name": "Arkadiusz Jadczyk"}], "author_count": 1}, {"id": "2611.34301", "category": "math-ph", "title": "The transverse spin-gradient approximation in noncollinear spin density functional theory", "abstract": "We prove a quantitative error bound for a fixed-axis variant of the transverse spin-gradient approximation (TSGA) in noncollinear spin density functional theory. Inspired by Eich and Gross, we use a spin-spiral wave (SSW) as the local reference for the grand-canonical Levy-Lieb energy with the Hartree term subtracted. We construct the thermodynamic limit of the electron gas with constant total density and a prescribed SSW magnetization. Its energy per unit volume $e_{\\rm SSW}$ is evaluated at the local wavevector $\\nabla\\varphi$, where $\\varphi$ is the spiral phase. When $\\varphi$ is the azimuthal angle of the magnetization $\\mathbf{m}=(m_1,m_2,m_3)$, the approximation reads \\[ E(\\rho,\\mathbf{m})\\approx\\int_{\\mathbb{R}^3}e_{\\rm SSW}\\big(\\rho(\\mathbf{x}),\\mathbf{m}(\\mathbf{x}),\\nabla\\varphi(\\mathbf{x})\\big)\\,d \\mathbf{x}. \\] Here $\\nabla\\varphi$ measures the local rotation of $\\mathbf{m}$ about the third axis. Wherever $m_1^2+m_2^2>0$, it equals $(m_1\\nabla m_2-m_2\\nabla m_1)/(m_1^2+m_2^2)$. The approximation thus depends only on the total density $\\rho$, the magnetization and its first derivatives. When the spin-polarized density in the rotating frame and the local wavevector vary on the length scale $N^{1/3}$, with $N$ the mean number of particles, we obtain an error $O(N^{5/6})$ for an energy of order $N$. Setting the phase to zero gives the noncollinear local spin density approximation (LSDA) for arbitrary magnetization directions.", "url": "https://arxiv.org/abs/2611.34301", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mihály A. Csirik"}], "featured_authors": [{"name": "Mihály A. Csirik"}], "author_count": 1}, {"id": "2611.34479", "category": "math-ph", "title": "Backpropagation as Dirac-bracket dynamics of dissipative training", "abstract": "Gradient-based training of a parametric model is the motion of a damped particle in the potential set by the loss. Using the Bateman-Galley doubling of the degrees of freedom, which gives dissipative systems an action principle, we write gradient flow, the heavy-ball method and Nesterov's accelerated gradient method as Hamiltonian systems. We show that, within this Hamiltonian description, backpropagation is Dirac evolution. The activations of a feed-forward network are treated as coordinates of phase space, and the layer equations as constraints. These constraints are second class for every architecture, and Hamilton's equations with the resulting Dirac bracket reproduce training with the exact gradient of the loss, although the Hamiltonian contains only the cost of the network output. The Dirac bracket of an activation with the momenta of the parameters is its Jacobian, the inverse of the constraint matrix contains both the forward and the reverse modes of automatic differentiation, and the errors propagated by backpropagation are the Lagrange multipliers of the layer constraints: the constraint forces of a kinematic chain under the load of the cost. These results hold in the full doubled phase space, not only in the physical limit. The network's part of the constraint algebra is the same for every optimizer, Nesterov's look-ahead adds one layer of momentum-dependent constraints that couple the two copies of the doubled system, and gradient flow is obtained by constructing the Dirac bracket in stages. We confirm these statements numerically to machine precision and train a network by integrating the Dirac flow of its constraints, with no backward pass in the computation.", "url": "https://arxiv.org/abs/2611.34479", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nicolaus Linneu Holanda"}, {"name": "Ivan Eugenio Cunha"}], "featured_authors": [{"name": "Nicolaus Linneu Holanda"}, {"name": "Ivan Eugenio Cunha"}], "author_count": 2}, {"id": "2611.34553", "category": "math-ph", "title": "Distribution of the ratio of the two smallest eigenphases of the Jacobi unitary ensemble", "abstract": "We compute the joint distribution of the two smallest eigenvalues of the Jacobi unitary ensemble and the distribution of their ratio. We use a framework for calculating Janossy densities based on the Tracy-Widom system of ordinary differential equations. For the cases studied here, the leading finite-N correction to the ratio distribution, relative to its universal Bessel-kernel limit, is O(N^{-4}). This behaviour reflects a nontrivial cancellation of lower-order corrections present in the Jacobi kernel. Eigenphase ratios may thus reveal subtle finite-size effects in quantum-chaotic systems with particle-hole or chiral symmetry. As an exploratory arithmetic application, we compare the ratio distribution for the two lowest zeros of quadratic Dirichlet L-functions with the hard-edge limit for Sp(N). The data indicate that the N_{eff}^{-1} term vanishes, leaving an O(N_{eff}^{-2}) correction.", "url": "https://arxiv.org/abs/2611.34553", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shinsuke M. Nishigaki"}], "featured_authors": [{"name": "Shinsuke M. Nishigaki"}], "author_count": 1}, {"id": "2611.34557", "category": "math-ph", "title": "Bolognesi's Conjecture for Nonnegative-Charge Iterated Magnetic Bags", "abstract": "We establish a magnetic-bag limit for smooth $SU(2)$ Bogomolny monopoles associated with finitely many nested smooth surfaces in $\\mathbb{R}^3$. This proves Bolognesi's magnetic-bag conjecture for iterated magnetic bags with nonnegative charge density on each surface.", "url": "https://arxiv.org/abs/2611.34557", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Weifeng Sun"}, {"name": "Wenhan Wang"}], "featured_authors": [{"name": "Weifeng Sun"}, {"name": "Wenhan Wang"}], "author_count": 2}, {"id": "2611.34628", "category": "math-ph", "title": "The Zero Mode Constraint in the Dirac-Bergmann Analysis of Kadomtsev-Petviashvili Type Equations", "abstract": "We derive the Hamiltonian formulation of the Kadomtsev-Petviashvili (KP) equation from a singular Lagrangian by means of the Dirac-Bergmann algorithm. The Lagrangian contains an auxiliary field, which leads to an irregular secondary constraint. On the branch that reproduces the KP equation, all constraints are second class, and the Dirac brackets give the known Hamiltonian and Poisson operator. We confirm these results by the Faddeev-Jackiw method. Then, we consider fields periodic in the first spatial coordinate. In this case, the zero modes of the derivative operator lead to an additional secondary constraint on the mean of the potential. This constraint replaces the inverse derivative by its zero mean counterpart, and the resulting Hamiltonian is in accordance with the one of Reiman and Semenov-Tyan-Shanskii, up to normalization conventions. For decaying fields, the same condition is necessary for rapidly decreasing potentials to remain rapidly decreasing. We show that this constraint appears for a general class of KP-type equations. In addition, we classify the smooth solutions of the auxiliary-field action. We also relate our results to an existing quantization of the KP equation, for which the potential Lagrangian provides an action.", "url": "https://arxiv.org/abs/2611.34628", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ali Pazarci"}], "featured_authors": [{"name": "Ali Pazarci"}], "author_count": 1}, {"id": "2611.34695", "category": "math-ph", "title": "Non-Existence of Eigenvalues and Interface States for the Schrödinger Operator with Longitudinal Interface Potentials", "abstract": "We consider the Schrödinger operator in $\\mathbb{R}^d$ with a flat interface separating two half-spaces in which the real potential varies only in the directions parallel to the interface. This problem generally possesses no shift invariance. Nevertheless, using the method of multipliers, we prove the absence of eigenvalues. In addition, in the case of periodic potentials on each side of the interface the same method shows the absence of interface states which are quasi-periodic in the directions parallel to the interface and localized in the transverse direction.", "url": "https://arxiv.org/abs/2611.34695", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tomáš Dohnal"}, {"name": "Anton Lochmann"}], "featured_authors": [{"name": "Tomáš Dohnal"}, {"name": "Anton Lochmann"}], "author_count": 2}, {"id": "2611.34796", "category": "math-ph", "title": "Discotic columnar phase in a three-dimensional monomer-tetramer model of Heilmann and Lieb with side-to-side attraction", "abstract": "We study Model III of Heilmann--Lieb (1979), a lattice model for liquid crystals consisting of tetramers (plaquettes) on the cubic lattice at chemical potential $\\mu$, interacting via a hard-core repulsion and a lateral attraction of strength $a>0$ between coplanar, aligned tetramers. The model was conjectured to exhibit liquid-crystalline order at low temperature provided that $\\mu+2a>0$. We establish discotic columnar order throughout this regime, fully resolving the conjecture. Specifically, we prove the existence of exactly twelve extremal and periodic Gibbs measures, each breaking rotational symmetry, with one of three tetramer orientations dominant, and translational symmetry in exactly two directions, with one of four tetramer parities dominant within that orientation. Thus, the tetramers form one-dimensional columns arranged on a square lattice. This arrangement is not a priori evident from the zero-temperature picture, where energy only enforces a layered structure: each layer is fully packed and crystalline, but different layers are free to shift independently within their planes. The main novelty here lies in showing how thermal fluctuations lift this degeneracy in favor of the twelve ground states in which all tetramers share a common parity.", "url": "https://arxiv.org/abs/2611.34796", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Qidong He"}], "featured_authors": [{"name": "Qidong He"}], "author_count": 1}, {"id": "2611.34827", "category": "math-ph", "title": "Slow information spreading in quasi-periodic quantum spin chains", "abstract": "We investigate the suppression of information propagation in a weakly interacting quantum spin chain subject to a quasi-periodic external magnetic field. Using a finite-order normal-form construction, we establish a localized barrier in the interior of the chain that inhibits information propagation and derive a quantitative bound on the commutator of observables supported at opposite ends of the chain.", "url": "https://arxiv.org/abs/2611.34827", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yingte Sun"}], "featured_authors": [{"name": "Yingte Sun"}], "author_count": 1}, {"id": "2611.34845", "category": "math-ph", "title": "Sharp constant in 2D critical fermionic Hardy inequality", "abstract": "We study the large-$N$ behavior of the optimal constant $\\kappa_N$ in the two-dimensional fermionic many-particle Hardy inequality \\[ \\sum_{i=1}^N -\\Delta_i \\geq \\kappa_N^{(2)}\\sum_{1\\leq i<j\\leq N}\\frac{1}{|x_i-x_j|^2}, \\] understood as a quadratic-form inequality on antisymmetric wave functions. We prove that \\[ \\lim_{N\\to\\infty}(\\log N)\\kappa_N^{(2)}=4, \\] thereby proving a conjecture of Frank, Hoffmann-Ostenhof, Laptev, and Solovej. The proof combines a dyadic Fefferman-de la Llave representation of the Coulomb kernel with separate estimates for squares of low and high particle occupation. A trace inequality controls the low-occupation regime, while sums of Neumann eigenvalues yield the sharp bound in the high-occupation regime.", "url": "https://arxiv.org/abs/2611.34845", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Marvin R. Schulz"}], "featured_authors": [{"name": "Marvin R. Schulz"}], "author_count": 1}, {"id": "2611.33270", "category": "quant-ph", "title": "Sharp one-shot bounds and optimal exponents of universal randomness extraction", "abstract": "We introduce techniques for the study of randomness extraction against quantum side information (privacy amplification) by relating this problem to variants of hypothesis testing tasks with quadratic constraints. Building also on the recently introduced measured smooth entropy approach of [Regula and Tomamichel, arXiv:2603.04493 ], we precisely determine the optimal scaling of the error of quantum privacy amplification in several regimes. Our results apply to the standard operational security criterion based on trace distance and focus in particular on universal classes of hash functions. On the technical side, our investigation reveals connections with operator space theory methods used in non-commutative Khintchine inequalities. As one application, we give a one-shot converse bound that shows the leftover hash lemma of [ arXiv:2603.04493 ] to be tight up to a constant factor for all strongly 4-universal hash functions. This allows us to evaluate the asymptotic i.i.d. error exponent of universal randomness extraction for all rates, matching the bound of [Dupuis, arXiv:2105.05342 ] and improving also earlier classical asymptotic results of [Hayashi, arXiv:1010.1358 ]. We furthermore give new one-shot achievability and converse bounds on the error in the strong converse regime, which we show to match up to a constant factor. This establishes the exact strong converse exponent of quantum privacy amplification under 2-universal hash functions, complementing the converse bound of [Shen, Gao, and Cheng, arXiv:2202.10263 ].", "url": "https://arxiv.org/abs/2611.33270", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Bartosz Regula"}, {"name": "Hao-Chung Cheng"}], "featured_authors": [{"name": "Bartosz Regula"}, {"name": "Hao-Chung Cheng"}], "author_count": 2}, {"id": "2611.33312", "category": "quant-ph", "title": "Gauge symmetry permits extremely low-depth random unitary circuits", "abstract": "Continuous global symmetries can obstruct logarithmic-depth symmetric unitary $k$-designs and pseudorandom unitaries (PRUs) through long-range correlations. We ask whether gauge symmetries impose analog
