  <script>
    const papers = [{"id": "2611.33274", "category": "cond-mat", "title": "Theory of Anomalous Diffusion and Superdiffusion in Integrable Spin Chains", "abstract": "Integrable systems can exhibit diffusive or Kardar--Parisi--Zhang (KPZ) scaling in two-point correlations even when their current full counting statistics (FCS) differ from those usually associated with these universality classes. We explain this separation using a multispecies particle gas that preserves the scattering structure of integrable spin chains. For anisotropy $\\Delta>1$, large particles are advected by a mobile bath. The resulting FCS has a Gaussian-mixture form and approaches the M-Wright distribution at late times, with finite-time rounding due to mobile species. At the isotropic point $\\Delta=1$, all particles are mobile, and the charge transfer by large particles is discrete. A self-consistent Poisson distribution describes the FCS, with a nearly Gaussian bulk and model-dependent, non-Gaussian tails. By contrast, two-point correlations follow from the statistics of a large tracer particle. For $\\Delta>1$, it undergoes Brownian motion, yielding Gaussian spreading. At $\\Delta=1$, we provide evidence from fluctuating hydrodynamics for the emergence of the KPZ Prähofer--Spohn scaling function in dynamical correlations and trace it to the finite coupling of the largest particles to a continuum of slower ones, with long-ranged velocity fluctuations. Our framework shows how universal dynamical two-point correlations coexist with distinct model-dependent current statistics.", "url": "https://arxiv.org/abs/2611.33274", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jitendra Kethepalli"}, {"name": "Andrew Urilyon"}, {"name": "Jacopo De Nardis"}], "featured_authors": [{"name": "Jitendra Kethepalli"}, {"name": "Andrew Urilyon"}, {"name": "Jacopo De Nardis"}], "author_count": 3}, {"id": "2611.33286", "category": "cond-mat", "title": "Pairing from anti-Hund's coupling under infinite Hubbard repulsion", "abstract": "Electron-phonon coupling is a natural source of superconductivity, but in strongly correlated materials the phonon-mediated interaction is often much weaker than the on-site Hubbard repulsion $U$. Whether, and how, it can still produce pairing when $U$ dominates is a basic open question. We address this question by studying a minimal model with an anti-Hund's coupling $J_A$: an on-site spin exchange between two orbitals or two valleys, mediated by optical phonons, that favors a local inter-orbital spin singlet. In the limit $U=+\\infty$, the two-orbital Hubbard model on the triangular lattice, doped away from the insulator at $n=2$ electrons per site, reduces to a four-flavor $t$-$J_A$ model. Density-matrix renormalization group calculations find robust pairing throughout $1\\le J_A/|t|\\le10$, with the largest pairing gap at $J_A\\sim|t|$. The Cooper pairs reside on bonds and do not come from a direct attraction provided by $J_A$, since infinite $U$ excludes on-site pairs from the Hilbert space. For $J_A\\gg|t|$, the normal state is a second Fermi liquid whose small Fermi surface violates the perturbative Luttinger theorem, and a strong-coupling expansion in $t/J_A$ provides a controlled effective theory of superconductivity from this unconventional metal. Our results provide strong evidence for a strongly coupled superconductor beyond BCS theory, driven by the interplay of the kinetic energy, the phonon-mediated anti-Hund's coupling, and the strong Hubbard $U$. Finally, we discuss possible applications to magic-angle twisted bilayer graphene.", "url": "https://arxiv.org/abs/2611.33286", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Donggyu Kim"}, {"name": "Ya-Hui Zhang"}], "featured_authors": [{"name": "Donggyu Kim"}, {"name": "Ya-Hui Zhang"}], "author_count": 2}, {"id": "2611.33338", "category": "cond-mat", "title": "On the binding and stability of CeO2 molecules on low-index Au surfaces", "abstract": "Many multi-phase thin films grown by self-assembly involve co-deposition of both metallic and oxide phases that grow into the same film. Under such conditions, the oxide species may be present in stoichiometric molecular form on the surface of the metallic phase. Quantifying the stability, binding, and diffusion of such molecular oxide states on metallic surfaces is critical for understanding self-assembly. In this work, we investigate the binding and stability of CeO2 molecules on Au surfaces using spin-polarized density functional theory calculations. Specifically, we examine how the configuration of the CeO2 molecule, its binding energy and binding free energy, structural stability, effective charge, and projected electronic density of states vary among various binding sites on Au(001), Au(110), and Au(111) surfaces. Molecular CeO2 was found to be more favorable on all Au surfaces than its atomic constituents. It was also found that the bent CeO2 molecule configuration is more stable than the linear counterpart, with the Ce atom on the hollow site and the O atoms on the top sites. In addition, the configurations of the CeO2 molecule on Au surfaces with a binding energy around or weaker than -1 eV were found to have a low probability of existence above room temperature. Furthermore, the charge transfer was found to occur in such a way that the CeO2 molecule becomes polarized on all surfaces, but the polarization is stronger only for the strongly bonded states on Au(001) and Au(110) surfaces. Finally, three different cases of how the CeO2 molecule binds to Au(001), Au(110), and Au(111) were identified: case 1: chemisorption with symmetric bonds, case 2: chemisorption with asymmetric bonds, and case 3: physisorption with symmetric bonds. These three cases of CeO2 binding are present on Au(001) and Au(110), but only cases 2 and 3 occur on Au(111).", "url": "https://arxiv.org/abs/2611.33338", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ying-Cheng Chen"}, {"name": "Ahmad Ahmad"}, {"name": "Anter El-Azab"}], "featured_authors": [{"name": "Ying-Cheng Chen"}, {"name": "Ahmad Ahmad"}, {"name": "Anter El-Azab"}], "author_count": 3}, {"id": "2611.33381", "category": "cond-mat", "title": "Magnetically Guided Sequential Multi-Filler Alignment Enables Anisotropic Heat Pathways in Stretchable Composites for Soft Electronics", "abstract": "Stretchable, skin-conformal electronics demand thermal interface materials that combine high through-plane heat transport with mechanical softness and lateral electrical insulation. In particle-filled composites, these requirements are typically antagonistic. Heat transport is governed not only by the intrinsic thermal conductivity of the fillers but, more critically, by thermal resistance at the interparticle interface. As the interparticle distance is reduced by increasing the particle content, mechanical reinforcement and in-plane electrical conductivity become unavoidable. The existing particle alignment processing strategies result in inefficient uncoupling of multifunctionality. Here, we present a hierarchical two-step process strategy to induce strong conductivity anisotropy in a soft composite. First, an align-before-blend process forms a scaffold of magnetically aligned nickel (Ni) microparticles in air before polymer infiltration. The absence of the viscous elastomer matrix during the particle alignment facilitates handling large amounts of particles, which assemble into highly ordered and densely packed vertical heat-conduction pathways. Second, a liquid metal (LM)/Ni mixture is infiltrated into the aligned scaffold to bridge interparticle gaps, minimizing interparticle thermal resistance. The composite reaches 7.5 W/(m K) through-plane thermal conductivity with lateral electrical conductivity below $10^{-12}$ S/m and ultrasoft mechanical compliance (approximately 160 kPa), enabling coupling layers in thermoelectric generators and finger-mounted heat-spreading pads for wearable technologies.", "url": "https://arxiv.org/abs/2611.33381", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Altynay Kaidarova"}, {"name": "Viktor Naenen"}, {"name": "Isidro Florenciano"}, {"name": "Ruben Windey"}, {"name": "Xiaoyan Qing"}, {"name": "Laurens Snels"}, {"name": "Juhyung Park"}, {"name": "Tom Van der Donck"}, {"name": "Jeroen Soete"}, {"name": "David Seveno"}, {"name": "Francisco Molina-Lopez"}], "featured_authors": [{"name": "Altynay Kaidarova"}, {"name": "Viktor Naenen"}, {"name": "Isidro Florenciano"}, {"name": "Jeroen Soete"}, {"name": "David Seveno"}, {"name": "Francisco Molina-Lopez"}], "author_count": 11}, {"id": "2611.33422", "category": "cond-mat", "title": "Spectroscopic Signatures of Polaronic Density Wave Fluctuations in Superconducting Bismuthates", "abstract": "The bismuthate high-temperature superconductors have been identified as potential bipolaron systems, where hole pairs are bound to local breathing distortions of the BiO$_6$ octahedra in their metallic phase. However, obtaining definitive evidence for these quasiparticles and their excitations remains challenging. Here, we report on periodic modulations of the spectral intensities and scattering rates of quasiparticles on the Fermi surfaces of doped bismuthates Ba$_{1-x}$K$_x$BiO$_3$ and BaPb$_{1-y}$Bi$_y$O$_3$, which are reminiscent of ``hot spot'' patterns that have been observed in cuprate superconductors. We show that these features can be well described by a model where electrons couple to fluctuating density wave modulations with short-range coherence along a $(\\pi,\\pi,\\pi)$-oriented wavevector. The results are consistent with the existence of a two-component fluid where unpaired electrons interact with a fluctuating density wave created by residual bipolarons and their breathing distortions of the BiO$_6$ octahedra.", "url": "https://arxiv.org/abs/2611.33422", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wojciech R. Pudełko"}, {"name": "Muntaser Naamneh"}, {"name": "Philip M. Dee"}, {"name": "Hang Li"}, {"name": "Eduardo B. Guedes"}, {"name": "Dariusz J. Gawryluk"}, {"name": "Anna Krztoń-Maziopa"}, {"name": "Vahid Sazgari"}, {"name": "Yona Soh"}, {"name": "Ming Shi"}, {"name": "Milan Radović"}, {"name": "Johan Chang"}, {"name": "Steven Johnston"}, {"name": "Nicholas C. Plumb"}], "featured_authors": [{"name": "Wojciech R. Pudełko"}, {"name": "Muntaser Naamneh"}, {"name": "Philip M. Dee"}, {"name": "Johan Chang"}, {"name": "Steven Johnston"}, {"name": "Nicholas C. Plumb"}], "author_count": 14}, {"id": "2611.33443", "category": "cond-mat", "title": "Extrinsic thermodynamic geometry, symmetry, and the cost of constraint", "abstract": "Driving a stochastic system in finite time costs excess work; exactly how much depends on which system parameters, and hence which paths in distribution space, a controller can access. In the friction-tensor formalism for slow driving, the space of equilibrium distributions is a Riemannian manifold and constraints on a controller define submanifolds. Whether a constrained controller is forced onto suboptimal paths is a question of the extrinsic thermodynamic geometry of the submanifold, which we develop for discrete systems. We show that submanifolds with zero extrinsic curvature can be identified from symmetries of the transition network, before any optimization. A minimum-work protocol on such a submanifold is therefore stationary in the excess work even when the constraints are lifted. The stationarity of symmetric optima holds exactly, beyond slow driving. In the slow-driving regime, we show that the ambient curvature transverse to a symmetric submanifold determines whether nearby symmetry-broken protocols have lower excess work. This curvature, which separates into independent contributions from each pattern of symmetry breaking, thus acquires an operational meaning as a measure of the thermodynamic incentive to break a given symmetry. A thermodynamic comparison theorem provides an inexpensive test of local minimality that weighs the extremal curvatures along the symmetric protocol against its excess work. There is no need for such tests under certain convexity conditions on the transition rates and control parameters, which guarantee that a symmetric optimum is a global optimum. These results certify the global optimality of a five-parameter protocol previously observed to match 15-parameter full control of a four-spin Ising system, and explain why partial symmetry breaking is optimal for the same system under local-field control.", "url": "https://arxiv.org/abs/2611.33443", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jordan R. Sawchuk"}, {"name": "David A. Sivak"}], "featured_authors": [{"name": "Jordan R. Sawchuk"}, {"name": "David A. Sivak"}], "author_count": 2}, {"id": "2611.33538", "category": "cond-mat", "title": "ILMlip: fast and universal machine-learning interatomic potentials", "abstract": "Large-scale pretrained machine-learned interatomic potentials keep growing more accurate as new models appear at a rapid pace, and more expensive: the current leader of Matbench Discovery as of November 2026 (F1 score 0.935) has $9.9\\times10^7$ parameters and took 3.6 thousand GPU-hours to train. The ILMlip potentials presented here are optimised for speed as well as zero-shot accuracy. They are equivariant, conservative message-passing potentials in which every component is arranged for throughput: little work per pair of atoms and as much as needed per atom. Through ASE on one GPU, they run molecular dynamics up to about $10^3$ times faster than state-of-the-art message-passing potentials such as MACE (medium) and up to five times faster than NEP89 and DPA-4.1C. At the same time, six sizes with $1.4\\times10^5$ to $2.8\\times10^7$ parameters, pretrained on materials, molecules and solid acids, reach F1 scores of 0.75 to 0.91 on Matbench Discovery, placing the largest within 0.03 of the current leader. They therefore suit high-throughput, large or long simulations, and, being transferable, they are strong starting points for fine-tuning. Fine-tuned to six materials, the model of size S comes close to the ab initio force errors of a fine-tuned MACE, so it reaches reference-level accuracy at about 50 ns per atom and step (Cu fcc). Their components can be adopted separately, as a starting point for architectures with even better ratios of speed to accuracy. The ILMlip implementation is available at this https URL", "url": "https://arxiv.org/abs/2611.33538", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jonas Hänseroth"}, {"name": "Christian Dreßler"}], "featured_authors": [{"name": "Jonas Hänseroth"}, {"name": "Christian Dreßler"}], "author_count": 2}, {"id": "2611.33544", "category": "cond-mat", "title": "Machine-Learning Spin-Fermion Models for Strongly Disordered Magnets: Sb-Doped MnTe", "abstract": "Metallic altermagnets are promising for spintronics, but most altermagnets are insulating. Doping can induce metallicity, but introduces chemical and magnetic disorder that is challenging to model from first principles. Here, we introduce a machine-learning approach that renormalizes first-principles calculations onto disordered spin-fermion models. The learned models accurately reproduce first-principles magnetic and electronic properties and enable predictions of millions of inequivalent long-range exchange couplings in large disordered supercells. Applied to Sb-doped MnTe, the approach shows that altermagnetism persists up to about 25\\% Sb, and reveals disorder broadening as a new factor controlling spin selectivity. More broadly, our work opens a route to combining renormalization with machine-learned Hamiltonians for strongly disordered materials.", "url": "https://arxiv.org/abs/2611.33544", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Do Hoon Kiem"}, {"name": "Parul R. Raghuvanshi"}, {"name": "David S. Parker"}, {"name": "Lucas Lindsay"}, {"name": "Valentino R. Cooper"}, {"name": "Tom Berlijn"}], "featured_authors": [{"name": "Do Hoon Kiem"}, {"name": "Parul R. Raghuvanshi"}, {"name": "David S. Parker"}, {"name": "Lucas Lindsay"}, {"name": "Valentino R. Cooper"}, {"name": "Tom Berlijn"}], "author_count": 6}, {"id": "2611.33630", "category": "cond-mat", "title": "Graphical Rules for Zero-energy Quantum-Interference Patterns in Bipartite Lattices", "abstract": "Quantum interference(QI) plays an important role in electron transport in molecules, where conductance is determined by the coherent superposition of different quantum-walk paths connecting the source and drain sites. In some systems, the pronounced even-odd conductance oscillation with the walk length can be observed; meanwhile destructive QI can lead to a dramatic suppression of conductance, resulting in a huge on/off ratio. In this paper, we extend the investigation from individual molecules to bipartite lattice systems, providing an abstract framework for exploring QI in a broad range of two-dimensional systems. We propose a simple graphical rule for predicting the QI pattern-the conductance map obtained by varying the drain site while keeping the source site fixed-in bipartite structures with arbitrary boundaries and holes. The analysis can be completed in three steps. First, a unit-cell-replicated bipartite subset is constructed by removing a subset of atoms from the input network, and its Green's function map is efficiently obtained from a local recurrence relation. Second, the removed atoms and local structural modifications are coupled back as local degrees of freedom, generating zero-mode vectors through the same Green's function map. Finally, the surviving zero-mode combinations are selected by an effective coupling matrix, whose projectors correct the reference map to yield the final QI pattern. This rule applies to finite flakes with arbitrary boundaries and holes and extends naturally to infinite lattices and vacancy defects.", "url": "https://arxiv.org/abs/2611.33630", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xinhao Fan"}, {"name": "Shunbo Hu"}, {"name": "Jingzhe Chen"}], "featured_authors": [{"name": "Xinhao Fan"}, {"name": "Shunbo Hu"}, {"name": "Jingzhe Chen"}], "author_count": 3}, {"id": "2611.33770", "category": "cond-mat", "title": "Solvent-Mediated Disintegration of a Vitrimer Network", "abstract": "Vitrimers are dynamic polymer networks characterized by associative bond exchange, which enables topological rearrangement while preserving the overall network connectivity. However, how this dynamic connectivity evolves in the presence of a solvent, particularly as a function of temperature, remains poorly understood. Here, we employ hybrid molecular dynamics Monte Carlo simulations to elucidate the temperature-dependent restructuring and dissociation of vitrimer networks in solution. By constructing temperature composition phase diagrams, we demonstrate that the critical temperature for network dissolution increases nonlinearly with crosslink concentration. We find that the network disintegration begins well below the critical dissolution temperature, indicating that the loss of network connectivity can occur even before the onset of macroscopic dissolution. However, the network undergoes extensive restructuring around the critical temperature for a highly crosslinked system, resulting in the formation of numerous smaller, disconnected networks. Concurrently, the number of intrachain dynamic bonds increases with temperature. Interestingly, complete disintegration into individual polymer chains is not observed; instead, the solution comprises a broad distribution of smaller network fragments. These findings reveal the complex interplay between solvent-induced network disintegration and dynamic bond redistribution, providing molecular level insights into the dissolution of vitrimer networks and their potential for solvent assisted recycling.", "url": "https://arxiv.org/abs/2611.33770", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Manoj K Patel"}, {"name": "Tarak K Patra"}], "featured_authors": [{"name": "Manoj K Patel"}, {"name": "Tarak K Patra"}], "author_count": 2}, {"id": "2611.33795", "category": "cond-mat", "title": "Exact subtraction of electron self-interaction from the Kohn-Sham equations", "abstract": "The self-interaction error (SIE) of Kohn-Sham density functional theory (KS-DFT) leads to a non-physical, non-linear dependence of an orbital's energy on its own fractional occupation [Dabo et al., Phys. Rev. B, 82:115121, 2010]. The generalized Koopmans condition (GKC) ensures an atomic orbital's eigenenergy is independent of its fractional occupation$-$ and is free of self-interaction. The constrained search of the Levy spin-density-functional theory yields orbital densities and delivers the ground-state energy to generalize the Hohenberg-Kohn theorems. In this work, the electron density of the Kohn-Sham equations is constrained to be orbital-density dependent, with a total energy functional linear with respect to variation of its orbital densities. That is, the KS multiplicative effective potential $v_{\\text{s}}[{n}]$ for an orbital $\\varphi_i[{n}]$ is constrained to a functional $v_{\\text{eff}}[{n - n_i}]$. The result complies with the generalized Koopmans condition (GKC). This approach improves LDA and GGA mean absolute errors (MAEs) in fundamental band gaps by $\\sim$ 1 eV, with respect to KS-DFT. Equations free of electron self-interaction provide the basis for improvements in the accuracy, efficiency, and simplicity of density functional theories.", "url": "https://arxiv.org/abs/2611.33795", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "J. E. Ingall"}, {"name": "Alister J. Page"}], "featured_authors": [{"name": "J. E. Ingall"}, {"name": "Alister J. Page"}], "author_count": 2}, {"id": "2611.33803", "category": "cond-mat", "title": "Superconductivity from a Cooper surface instability in a nodal Bose metal", "abstract": "In underdoped cuprates, the superconducting gap is largest where low-energy electron spectral weight is already depleted above the transition. How can a weak attraction drive superconductivity when the one-electron density of states vanishes? In a momentum-space \\(t\\)--\\(J\\) model, the exactly solvable normal state is a nodal Bose metal with four one-electron nodes. Along two contours called Cooper surfaces, adding or removing a spin-singlet pair of electrons with opposite momenta costs no energy. The resulting logarithmic divergence of the pair susceptibility allows an arbitrarily weak pair-transfer attraction to stabilize a correlated nodal \\(d\\)-wave superconductor. Spin-resolved coincidence photoemission could test this pairing mechanism by resolving two zero-energy pair-removal ridges above the transition and a third along the underlying Luttinger surface below it.", "url": "https://arxiv.org/abs/2611.33803", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jian-Jian Miao"}, {"name": "Cui Ding"}], "featured_authors": [{"name": "Jian-Jian Miao"}, {"name": "Cui Ding"}], "author_count": 2}, {"id": "2611.33807", "category": "cond-mat", "title": "Controlling truncation errors in loop tensor network renormalization", "abstract": "At finite bond dimension $\\chi$, tensor network renormalization (TNR) of a critical model eventually becomes gapped. For LoopTNR with $O(2)$ symmetry on the $c=1$ critical line of the six-vertex model, parametrized by the Luttinger parameter $K$, we show that the correlation length $\\xi$ of the gapped phase is set by the seed of the dimerization injected by the truncation, and depends on $\\chi$ only through it. Read from a weak-coupling window early in the same run, the seed predicts $\\xi=10^3$-$10^{16}$ via the sine-Gordon mass-coupling relation with no free parameter, to within a few percent for $K\\le1.5$ and about 10% at $K=1.75$; since the seed fluctuates strongly with $\\chi$, $\\xi$ is not monotonic in $\\chi$. An alternation of the vertex weights shifts the seed; with its sign read from a $\\pi$ twist, one short calibration predicts a counterterm that delays the breakdown in 16 of the 17 compensated groups of a campaign fixed in advance. A correction of the coarse-grained tensors, repeated during the flow, keeps the runs at $K=1$ and $1.5$ critical up to step 160, the last step computed, and exposes the marginal truncation error that remains. Our findings illustrate a systematic procedure for controlling the relevant truncation error, and thereby extending the critical window, in tensor network renormalization at finite bond dimension.", "url": "https://arxiv.org/abs/2611.33807", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Rikuto Fushio"}, {"name": "Kokin Cho"}, {"name": "Yuta Yamamoto"}, {"name": "Akira Otsuki"}, {"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Rikuto Fushio"}, {"name": "Kokin Cho"}, {"name": "Yuta Yamamoto"}, {"name": "Akira Otsuki"}, {"name": "Masahito Yamazaki"}], "author_count": 5}, {"id": "2611.33912", "category": "cond-mat", "title": "Phono3GPU: GPU-Accelerated Linear Tetrahedron Integration for Phonon Thermal Transport", "abstract": "Materials with high or low thermal conductivity are increasingly important for thermal management and energy technologies. Machine-learned interatomic potentials have accelerated anharmonic force-constant calculations, shifting the bottleneck toward phonon transport calculations for large materials datasets. Existing GPU solvers often rely on smearing, whose width can require material-dependent choices, while the linear tetrahedron method used in phono3py avoids this parameter but becomes costly for complex structures. Here we introduce Phono3GPU, which reformulates three-phonon scattering and linear tetrahedron integration for massively parallel GPU execution. Across benchmark crystals, Phono3GPU accelerates total calculations by up to 41 times relative to a CPU implementation, with larger gains for complex unit cells, and by 2 to 6 times relative to a recent GPU plug-in for phono3py. We further demonstrate atom-resolved scattering analysis in defective silicon supercells as an application enabled by the reduced computational cost. Phono3GPU thus lowers the cost of tetrahedron-based thermal-conductivity calculations and of detailed investigations of structure-dependent phonon transport.", "url": "https://arxiv.org/abs/2611.33912", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jinhyeong Jo"}, {"name": "Sungwoo Kang"}, {"name": "Byungju Lee"}, {"name": "Jung-Hoon Lee"}, {"name": "Seugchul Kim"}], "featured_authors": [{"name": "Jinhyeong Jo"}, {"name": "Sungwoo Kang"}, {"name": "Byungju Lee"}, {"name": "Jung-Hoon Lee"}, {"name": "Seugchul Kim"}], "author_count": 5}, {"id": "2611.33988", "category": "cond-mat", "title": "Exploring Physical Mechanisms Underlying the Emergence of Collective Order", "abstract": "Emergence of collective order from disordered constituents is a hallmark of active matter, and the Vicsek model (VM) serves as a paradigmatic system for its study. However, whether density-induced emergence in the VM differs between angular (intrinsic) and vectorial (extrinsic) noise, and what mechanisms govern the transitions, remain largely unexplored. Remarkably, we uncover that collective order emerges from a disordered state in a continuous-like manner under intrinsic noise but abruptly under extrinsic noise. Combining nonequilibrium landscape-flux theory with a coarse-grained mapping method, we show that the landscape evolves continuously from a single basin to two and back to one under intrinsic noise, but the two-basin landscape appears abruptly under extrinsic noise across the critical transition to flocking. The counterclockwise nonequilibrium flux sustains global circular motion, providing the driving force for reshaping the landscape. The mean flux and entropy production rate change steeply near the emergence threshold and exhibit pronounced peaks within the coexistence region, identifying them as the dynamical and thermodynamic origins of emergence. Our findings reveal a distinct abrupt emergence under extrinsic noise and offer deeper mechanistic insight, practical applications (e.g., locating phase boundaries and distinguishing transition types), and extensibility to other nonequilibrium collective systems.", "url": "https://arxiv.org/abs/2611.33988", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yitong Cai"}, {"name": "Ruizhe Yan"}, {"name": "Dongrun Jian"}, {"name": "Jie Su"}, {"name": "Jin Wang"}], "featured_authors": [{"name": "Yitong Cai"}, {"name": "Ruizhe Yan"}, {"name": "Dongrun Jian"}, {"name": "Jie Su"}, {"name": "Jin Wang"}], "author_count": 5}, {"id": "2611.33999", "category": "cond-mat", "title": "Rotation curves of dwarf galaxies and dark matter as a condensate of $q$-deformed bosons: reconstruction and fits of the deformation profile", "abstract": "Dark-matter-dominated dwarf galaxies are a sensitive testing ground for models in which dark matter is a self-interacting Bose-Einstein condensate (BEC). In the Thomas-Fermi limit the standard BEC halo has the density profile $\\rho\\propto\\sin(kr)/(kr)$, so that the shape of its rotation curve is fixed up to two scale parameters. Here we consider a condensate of $q$-deformed bosons. We show that, in the Thomas-Fermi limit, the deformation enters the structure of the halo only through the chemical potential of the condensate; consequently, a spatially uniform deformation parameter leaves the standard BEC profile unchanged. In every galaxy $\\chi$ is depressed in the inner region, $kr\\lesssim1$, relative to the outer halo, where it is approximately constant in most cases: the standard condensate describes the outer halo, while the core requires a weaker deformation, i.e., $q$ closer to unity. The profiles share this qualitative shape, but neither the depth nor the width of the depression is universal. Modelling the depression by a Gaussian, with two additional parameters, we fit the rotation curves with rms residuals of $0.6$--$2.6$~km\\,s$^{-1}$, against $1.6$--$8.5$~km\\,s$^{-1}$ for the standard condensate. According to the Bayesian information criterion, the deformed condensate is preferred over the standard condensate, the Navarro-Frenk-White profile, and the Burkert profile in four galaxies, is indistinguishable from the best of them in two, and is disfavoured in two. We discuss the limitations of these results, in particular the absence of error bars in the data, the neglect of baryons, and the phenomenological status of a position-dependent deformation.", "url": "https://arxiv.org/abs/2611.33999", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mahnaz Maleki"}, {"name": "Asef Kheirandish"}, {"name": "Morteza Nattagh Najafi"}, {"name": "Hosein Mohammadzadeh"}], "featured_authors": [{"name": "Mahnaz Maleki"}, {"name": "Asef Kheirandish"}, {"name": "Morteza Nattagh Najafi"}, {"name": "Hosein Mohammadzadeh"}], "author_count": 4}, {"id": "2611.34000", "category": "cond-mat", "title": "Wannier-Based Low-Energy Electronic Structure Analysis of $λ$-(STF)$_2$GaCl$_4$", "abstract": "The low-energy electronic structures of $\\lambda$-(BETS)$_2$GaCl$_4$ and $\\lambda$-(STF)$_2$GaCl$_4$ were investigated using density functional theory (DFT) and maximally localized Wannier functions (MLWFs). For $\\lambda$-(STF)$_2$GaCl$_4$, DFT-selected and directly XRD-refined structural models were compared before and after fixed-lattice relaxation. Their initially different near-Fermi-level electronic structures become similar after relaxation. Relative to BETS, relaxed STF has a narrower frontier bandwidth while retaining a substantial dimerization energy scale. Two MLWFs were constructed for each selected unrelaxed structure to represent the upper frontier bands, with total spreads of 36.708 Å$^2$ for BETS and 37.578 Å$^2$ for STF. The Wannier-derived transfer integrals show a pronounced reduction of $t_{d1}$ from 51 meV in BETS to 6.5 meV in STF, indicating selective modification of the low-energy electronic connectivity.", "url": "https://arxiv.org/abs/2611.34000", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arifa D. Agustin"}, {"name": "Aulia A. Firdaus"}, {"name": "Fathan M. Santana"}, {"name": "Shuhei Fukuoka"}, {"name": "Atsushi Kawamoto"}, {"name": "Muhammad R. Ramadhan"}, {"name": "Isao Watanabe"}, {"name": "Dita P. Sari"}, {"name": "Yasuyuki Ishii"}], "featured_authors": [{"name": "Arifa D. Agustin"}, {"name": "Aulia A. Firdaus"}, {"name": "Fathan M. Santana"}, {"name": "Isao Watanabe"}, {"name": "Dita P. Sari"}, {"name": "Yasuyuki Ishii"}], "author_count": 9}, {"id": "2611.34072", "category": "cond-mat", "title": "Frustration in system with intercalated and bilayer smectic structure", "abstract": "The dimeric mesogens exhibit an unusual variety of mesophases - nematic and smectic, with distinctly different packing schemes. The relation between molecular and mesophase structure was studied for homologue series of non-symmetric bent dimers this http URL , obtained by serial Pd- and Pt-catalyzed cross-coupling chemical reactions. The shorter homologues of the series form smectics with an intercalated structure, and longer homologues form bilayer smectics with broken up-down symmetry of molecular orientation within the layers, for intermediate homologues frustration leads to a nematic gap. The additional structure complexity arises from the tendency of bent dimers to form twisted structures, in which the azimuthal angle of tilted molecules forms both short- and long-pitch helices. Here we confirm, through resonant X-ray diffraction, that longer homologues form a helical four-layer structure of SmCTB-SH phase, along with a more complex one in which, in addition to the basic four-layer unit, an extra helix is superimposed, SmCTB-DH phase. This additional helix has a periodicity that is strongly temperature-dependent; upon cooling, it changes from 100 nm to 40 nm.", "url": "https://arxiv.org/abs/2611.34072", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Calum J. Gibb"}, {"name": "Claudio Flores Fernandez"}, {"name": "Magdalena M. Majewska"}, {"name": "John M. D. Storey"}, {"name": "Corrie T. Imrie"}, {"name": "Ewa Gorecka"}, {"name": "Damian Pociecha"}], "featured_authors": [{"name": "Calum J. Gibb"}, {"name": "Claudio Flores Fernandez"}, {"name": "Magdalena M. Majewska"}, {"name": "Corrie T. Imrie"}, {"name": "Ewa Gorecka"}, {"name": "Damian Pociecha"}], "author_count": 7}, {"id": "2611.34076", "category": "cond-mat", "title": "Quantum Geometric Origin of Néel-Order-Driven Magneto-Optical Response in MnTe", "abstract": "Magneto-optical (MO) responses provide a direct probe of magnetic order, yet resolving compensated antiferromagnetic order remains challenging. Here, we demonstrate in altermagnetic MnTe that the symmetry of the Néel order is imprinted on the MO response through distinct quantum-geometric contributions. Combining first-principles calculations with a Landau symmetry framework, we demonstrate that the quantum metric gives rise to a twofold optical anisotropy, with its diagonal and symmetric off-diagonal components forming an $E_{2g}$ doublet associated with the quadratic Néel-order invariants, providing a characteristic MO Voigt signature of the Néel-vector orientation. In contrast, the Berry curvature generates a complementary threefold Hall response governed by the cubic $A_{2g}$ Néel-order invariant. Although the Hall conductivity and the out-of-plane weak-ferromagnetic moment share the same symmetry and angular dependence, constraining the latter to zero leaves the optical Hall response essentially unchanged demonstrating that the Hall response originates directly from the compensated Néel order rather than the net magnetization. Our results establish quantum geometry as a direct link between Néel order and MO response, revealing distinct twofold and threefold optical signatures of Néel order in altermagnetic MnTe.", "url": "https://arxiv.org/abs/2611.34076", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Suman Rooj"}, {"name": "M. S. Mrudul"}, {"name": "Daegeun Jo"}, {"name": "Peter M. Oppeneer"}], "featured_authors": [{"name": "Suman Rooj"}, {"name": "M. S. Mrudul"}, {"name": "Daegeun Jo"}, {"name": "Peter M. Oppeneer"}], "author_count": 4}, {"id": "2611.34118", "category": "cond-mat", "title": "Quantum Metric Connects Bond Delocalization to Phonon Softening", "abstract": "Delocalized bonding electrons have long been associated with soft bonds and low phonon frequencies. However, a quantitative connection between electron delocalization and phonon softening remains elusive. We identify such a connection through the momentum-space quantum metric, which measures the intrinsic delocalization of the occupied electronic states. We show that a quantum geometric contribution to phonon softening is proportional to the integrated quantum metric. First-principles calculations of more than a hundred compounds demonstrate that greater quantum metric generally accompanies softer phonons. Localized Wannier orbitals reveal the bonding environments associated with this delocalization. In ferroelectric GeTe, LiBeSb, and BaTiO$_3$, polar distortion localizes the bonding orbitals, reduces quantum metric, and stabilizes the soft mode of the nonpolar structure. In PbSe, pressure-induced band inversion is accompanied by an enhanced quantum metric and phonon softening without change in crystal symmetry and bonding. These results establish a common quantum geometric interpretation of bond delocalization and phonon softening across distinct bonding environments.", "url": "https://arxiv.org/abs/2611.34118", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tianqi Deng"}, {"name": "Tiejun Zhu"}], "featured_authors": [{"name": "Tianqi Deng"}, {"name": "Tiejun Zhu"}], "author_count": 2}, {"id": "2611.34194", "category": "cond-mat", "title": "Length-scales and fractal scaling in dairy gels: comparisons of the insights from ultra-small angle neutron scattering and rheology", "abstract": "A key structural parameter that dictates the textural properties of a particulate gel is the fractal dimension (Df) of the network indicating self-similarity within the spatial range defined by the correlation length (xi). In this study dairy gels are formed from reconstituted skim milk at defined CM volume fractions via two different mechanisms: acidification, and enzymatic (rennet)-induction. Oscillatory rheology is performed to obtain the gelation times, the time-scale for the maturation of mechanical properties of the gel, and the viscoelastic properties of the gel. A direct probe of gel structure is ultra-small-angle neutron scattering (USANS) examining length-scales from approximately 60 nm up to 15 microns. Structural information is extracted from USANS of matured gels by comparing the measured differential scattering cross-section with that calculated from a model constrained by the sample composition. Time-scales for structural equilibration from USANS perspective were shorter than the rheological gelation time for both gels. Rheological scaling theories are utilized to relate the microstructure to their bulk mechanical properties. We show that the fractal scaling at low-q (scattering vectors), due to aggregation of CM, extracted from the USANS at the longest timescales is described by a power-law density-density correlation function, and that rheology relates - through Shih-Wu-Morbidelli models - the local elasticity both within and between the fractal flocs formed by these particles over different size ranges to the bulk moduli of the gels. There are similar values of fractal dimensions from both techniques but different sizes attributed to the complex fractal evolution during dairy gelation, which leaves space to refinements of the models.", "url": "https://arxiv.org/abs/2611.34194", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Koduvayur A. Ramya"}, {"name": "Liliana de Campo"}, {"name": "Markus Strobl"}, {"name": "François Boué"}, {"name": "Christopher J. Garvey"}], "featured_authors": [{"name": "Koduvayur A. Ramya"}, {"name": "Liliana de Campo"}, {"name": "Markus Strobl"}, {"name": "François Boué"}, {"name": "Christopher J. Garvey"}], "author_count": 5}, {"id": "2611.34204", "category": "cond-mat", "title": "Quantum-centric assessment of saturated ferromagnetism beyond the flat-band limit", "abstract": "Saturated ferromagnetism has been proven for every on-site repulsion $U > 0$ in Hubbard models with a flat lowest band, and the interaction required for it grows with the band width $W$ when the band becomes dispersive. We study the dispersive case at quarter filling by quantum-selected configuration interaction and sample-based quantum diagonalization with IBM Quantum's Heron processors, focusing on the quantized square of the total spin of the computed states. We treat a sawtooth chain of 16 unit cells on 64 qubits, whose full configuration space of $1.1\\times 10^{14}$ determinants exceeds that of one of the largest full configuration interaction calculations, and obtain the stability diagram of saturated ferromagnetism on the decorated square lattice in the plane of $U$ and $W$. For the chain, a subspace of only $3\\times 10^{-5}$ of the full configuration space gives a state with more than $97\\%$ of its weight in the sector of maximal spin. For the decorated square lattice of $4\\times 3$ unit cells on 48 qubits, the computed states in subspaces of less than $1\\%$ of the full configuration space switch from low-spin states to nearly fully polarized states at $U \\simeq 2W$. The calculations also give a rigorous lower bound of $1.9W$ on the critical interaction of the $4\\times 3$ lattice.", "url": "https://arxiv.org/abs/2611.34204", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kosuke Nogaki"}, {"name": "Tomonori Shirakawa"}, {"name": "Seiji Yunoki"}, {"name": "Ryotaro Arita"}], "featured_authors": [{"name": "Kosuke Nogaki"}, {"name": "Tomonori Shirakawa"}, {"name": "Seiji Yunoki"}, {"name": "Ryotaro Arita"}], "author_count": 4}, {"id": "2611.34244", "category": "cond-mat", "title": "Patterns and correlations in time-reversal symmetry breaking", "abstract": "Time-reversal symmetry (TRS) breaking is the hallmark of non-equilibrium statistical physics. This notwithstanding, in translationally invariant systems, it is almost always treated only as a global quantity. We propose to use the local entropy production rate as a spatio-temporal field to describe extended homogeneous non-equilibrium systems. We find that this field generically displays spatial correlations, with a typical length that grows as we approach some non-equilibrium phase transitions. We also show that the correlation length associated with the local entropy production rate follows heretofore unknown scaling laws involving control parameters as well as the observation time used for trajectories. Our work paves the way to the use of the local entropy production as a powerful observable to identify the scale and source of TRS breaking in non-equilibrium systems.", "url": "https://arxiv.org/abs/2611.34244", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ido Patish"}, {"name": "Mathias Casiulis"}, {"name": "Dov Levine"}], "featured_authors": [{"name": "Ido Patish"}, {"name": "Mathias Casiulis"}, {"name": "Dov Levine"}], "author_count": 3}, {"id": "2611.34255", "category": "cond-mat", "title": "Fractional Chern Insulator in a Finite-Range One-Band Model", "abstract": "A common route for realizing fractional Chern insulators (FCIs) is to engineer bands that mimic the physics of Landau levels, which serve as the single-particle topological background for the emergence of strongly correlated fractional quantum Hall states. Here we show that FCIs can also arise in a one-band model devoid of any single-particle quantum geometry. Through a systematic trivialization of the single-particle quantum geometry in FCI models that go beyond the Landau-level paradigm, we construct a single-band, interaction-only model on the square lattice, with all terms confined to individual plaquettes. At one-third filling, exact diagonalization and density-matrix renormalization-group calculations reveal a three-state low-energy manifold, a Hall conductance of $-2e^2/(3h)$, and fractional charge pumping without translation-symmetry breaking. We trace this behavior to nontrivial topology in the repulsive two-particle sector, offering a microscopic perspective on the strongly correlated origin of fractional quantum Hall order.", "url": "https://arxiv.org/abs/2611.34255", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tong Liu"}, {"name": "Hoi Chun Po"}], "featured_authors": [{"name": "Tong Liu"}, {"name": "Hoi Chun Po"}], "author_count": 2}, {"id": "2611.34259", "category": "cond-mat", "title": "Anisotropic magnetic-field modulation of hysteretic sheet resistance in few-layer ferroelectric WTe2", "abstract": "Ferroelectricity in few-layer WTe2, a polar semimetal, originates from interlayer sliding and can be probed through gate-dependent resistance hysteresis. Yet the role of magnetic fields in this transport signature remains largely unexplored. Here, we examine magnetic-field-induced changes in the hysteresis in exfoliated few-layer WTe2. Applying an out-of-plane magnetic field produces a pronounced hysteresis enhancement, while an in-plane field yields a negligible response. Analysis of the individual hysteresis branches reveals distinct magnetotransport responses of the two ferroelectric states, which increase their resistance separation under magnetic field. The enhancement exhibits a robust power-law field dependence and a temperature evolution closely resembling that of magnetoresistance. Our results reveal a close association between anisotropic magnetotransport and ferroelectric hysteresis, underscoring the interplay between magnetic response and ferroic order in a two-dimensional polar semimetal.", "url": "https://arxiv.org/abs/2611.34259", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Arpan Manna"}, {"name": "Soumik Mukhopadhyay"}], "featured_authors": [{"name": "Arpan Manna"}, {"name": "Soumik Mukhopadhyay"}], "author_count": 2}, {"id": "2611.34345", "category": "cond-mat", "title": "Intrinsically nonlinear nanomechanical resonator toward the single-phonon Kerr regime", "abstract": "Manipulating a physical system at the single-quantum level typically requires an anharmonic energy spectrum. Nanomechanical resonators, however, are commonly admitted to be linear objects in the single-phonon regime, thus motivating most efforts to employ external sources of nonlinearity at the cost of added relaxation and decoherence channels. Here, we take a radically different approach by directly exploiting strong intrinsic mechanical nonlinearities. We quantify this nonlinearity using a novel method based on the coupling between bending modes. Using this technique, we establish an upper bound of 34.0 +/- 9.7 phonons for the onset of intrinsically mechanical bistability. In addition, we highlight a new tuning mechanism based on a mechanical polarization angle of an upward-buckled nanotube resonator allowing us to reach an optimal working point. Extrapolating this level of intrinsic nonlinearity to realistically shorter resonators shows that the single-phonon Kerr regime is within reach, allowing for the realization of purely mechanical Schrödinger-cat states and highly coherent mechanical qubits.", "url": "https://arxiv.org/abs/2611.34345", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "S. Klingel"}, {"name": "T. Althuon"}, {"name": "C. Wassmer"}, {"name": "C. Sürgers"}, {"name": "T. Cubaynes"}, {"name": "W. Wernsdorfer"}], "featured_authors": [{"name": "S. Klingel"}, {"name": "T. Althuon"}, {"name": "C. Wassmer"}, {"name": "C. Sürgers"}, {"name": "T. Cubaynes"}, {"name": "W. Wernsdorfer"}], "author_count": 6}, {"id": "2611.34356", "category": "cond-mat", "title": "Electronic topological modes in hexagonal NbSi$_{2}$ with a double helix", "abstract": "Chiral systems can host nontrivial topological states, including characteristic edge modes and Fermi arcs. Here, we investigate the electronic properties of hexagonal NbSi$_2$ with chiral symmetry using first-principles calculations for both bulk and slab geometries. We find that spin--orbit coupling (SOC) is relatively weak. Notably, the topological edge state originates from structural chirality rather than the SOC. From the Berry curvature analysis, we confirm the existence of Weyl points, some of which carry a Chern number of $\\pm 2$. Furthermore, we demonstrate the existence of chiral edge modes with extended Fermi arcs around high-symmetry points. Finally, we investigate the real-space localization using spatially resolved and site-dependent density of states (DOS). We demonstrate that the surface states can be exclusively associated with the chiral Si chains.", "url": "https://arxiv.org/abs/2611.34356", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Issam Mahraj"}, {"name": "Andrzej Ptok"}], "featured_authors": [{"name": "Issam Mahraj"}, {"name": "Andrzej Ptok"}], "author_count": 2}, {"id": "2611.34375", "category": "cond-mat", "title": "Spin-Orbit Coupling in Symmetry-Forbidden Reactions: A Selection Rule Tested on the Chalcogen Trimers", "abstract": "A reaction is forbidden by orbital symmetry when an occupied and an empty orbital of different symmetry change places along its path. With spin-orbit coupling orbitals become spinors, and those of two such orbitals can mix only if the orbitals differ by the symmetry of a rotation; the operator component of that symmetry couples ground state and diradical triplet. We test this rule on the ring opening of the chalcogen trimers O3 to Po3, where an in-plane and an out-of-plane orbital cross ($C_{2v}$ surfaces; NEVPT2, spin-orbit configuration interaction), by letting the operator components act separately. In Se3 and Te3 the component named by the rule alone lowers the barrier by 2.2 and 5.1 kcal/mol (complete operator: 2.2 and 5.2), the other two by 0.2 and 1.3 kcal/mol; in Po3 they contribute in second order. The triplet crosses the ground state 6.5 to 9.0 kcal/mol below the forbidden saddle. Spin-orbit coupling makes this crossing passable in O3 and S3 and, from Se3 on, merges the two states into one surface whose saddle lies 2.6, 5.5, and 13.1 kcal/mol lower. Molecular rotation obeys the same rule but is 6 to $2.8\\times 10^{3}$ times weaker, which bears on the lifetime predicted for cyclic ozone.", "url": "https://arxiv.org/abs/2611.34375", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Shadan Ghassemi Tabrizi"}], "featured_authors": [{"name": "Shadan Ghassemi Tabrizi"}], "author_count": 1}, {"id": "2611.34415", "category": "cond-mat", "title": "A Thermodynamically Consistent Model of a Rechargeable Salt-in-Polyelectrolyte Battery", "abstract": "We present an isothermal, thermodynamically consistent model of a salt-in-polyelectrolyte battery with intercalation and deintercalation reactions of cations occurring at the electrode-electrolyte interfaces under galvanostatic conditions. For the electrolyte, we consider polyelectrolytes, which are polyanions, with neutralizing cations (i.e., counterions) such as lithium, along with a monovalent salt containing the same cations. Models of batteries containing either a dual-ion-conductor (DIC) electrolyte (i.e., uncharged polymers with added salt) or a single-ion-conductor (SIC) electrolyte (i.e., charged polymers without added salt) emerge as limiting cases of this thermodynamically consistent model. Once the model is presented in its most general context, we make specific choices so that it captures well-known mechanisms. In particular, the governing diffusion equations recover Fick's law of diffusion, and the cation-transfer reaction rate is described by the Butler--Volmer equation. The DIC and SIC limiting cases provide a framework for comparing the corresponding batteries. One-dimensional DIC and SIC charge--discharge simulations at matched current and duration illustrate concentration redistribution, polarization, and electrode utilization. Numerical accuracy checks quantify sensitivity to discretization; distinct initial inventories qualify the comparison.", "url": "https://arxiv.org/abs/2611.34415", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Charlotte Beckford"}, {"name": "Rajeev Kumar"}, {"name": "Steven M. Wise"}], "featured_authors": [{"name": "Charlotte Beckford"}, {"name": "Rajeev Kumar"}, {"name": "Steven M. Wise"}], "author_count": 3}, {"id": "2611.34455", "category": "cond-mat", "title": "Exact Lyapunov spectrum and localization length of the multichannel disordered Schrödinger equation", "abstract": "We consider the multichannel Schrödinger equation, describing the evolution of $N$ transverse modes in a finite width wire, in the presence of a Gaussian white noise potential in the unitary symmetry class. For arbitrary energy $E$ and disorder strength $T$, we compute exactly the set of Lyapunov exponents $\\{ \\gamma_n(E,T) \\}_{1 \\leq n \\leq N}$ which define the decay rates of the wave functions. In the large energy regime, we recover that the Lyapunov exponents are equally spaced, as predicted by the so-called DMPK approach. However we show that this property breaks down at arbitrary energy, giving rise to a richer Lyapunov spectrum. We also uncover a direct relation between the localization length, given by the inverse of the smallest Lyapunov exponent, and the density of states. Our derivation relies on the analysis of matrix stochastic differential equation for a modified Riccati matrix.", "url": "https://arxiv.org/abs/2611.34455", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Aurélien Grabsch"}], "featured_authors": [{"name": "Aurélien Grabsch"}], "author_count": 1}, {"id": "2611.34482", "category": "cond-mat", "title": "Seebeck and Hall effects in charge-neutral ballistic graphene as probes of electron-electron interactions", "abstract": "Electron-hole asymmetry of the Coulomb velocity renormalization is responsible for finite Seebeck and Hall coefficients in charge-neutral graphene. In the ballistic regime the thermopower is small, $0.1$--$1~\\mu$V/K, because the chemical-potential shift required by $n_e{=}n_h$ cancels its leading part. When the electron-electron scattering length falls below the sample length, the thermopower crosses over to a collision-dominated value of $4$--$10~\\mu$V/K, that is an order of magnitude larger. This crossover is a direct thermoelectric marker of the breakdown of ballistic transport and a baseline for identifying the Dirac fluid.", "url": "https://arxiv.org/abs/2611.34482", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Z.Z. Alisultanov"}, {"name": "A.V. Kavokin"}], "featured_authors": [{"name": "Z.Z. Alisultanov"}, {"name": "A.V. Kavokin"}], "author_count": 2}, {"id": "2611.34500", "category": "cond-mat", "title": "LetzElPhC: an electron-phonon code for efficient exciton-phonon workflows", "abstract": "We present \\texttt{LetzElPhC}, an open-source software package that computes electron-phonon matrix elements from the output of density functional perturbation theory calculations performed with the \\texttt{Quantum ESPRESSO} code. By interfacing directly with the \\texttt{Yambo} code and exploiting crystal symmetries, \\texttt{LetzElPhC} enables a scalable workflow for evaluating exciton-phonon matrix elements while enforcing strict gauge consistency between one-electron Bloch states and Bethe-Salpeter excitonic wave functions across the full Brillouin zone. This symmetry-preserving approach avoids phase ambiguities and significantly reduces both computational costs and memory requirements. To support large-scale simulations on dense momentum grids, the package incorporates Fourier interpolation of dynamical matrices and perturbed Kohn-Sham potentials, accounting for long-range dipole and quadrupole interactions in both two- and three-dimensional materials, combined with multi-level parallelization and efficient parallel I/O. Together, these capabilities seamlessly complement the \\texttt{Yambo} code to enable first-principles simulations of phonon-assisted optical spectroscopies, which we demonstrate through applications to resonant Raman scattering in monolayer $\\text{WSe}_2$ and phonon-assisted luminescence in cubic AgBr.", "url": "https://arxiv.org/abs/2611.34500", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Muralidhar Nalabothula"}, {"name": "Ludger Wirtz"}], "featured_authors": [{"name": "Muralidhar Nalabothula"}, {"name": "Ludger Wirtz"}], "author_count": 2}, {"id": "2611.34532", "category": "cond-mat", "title": "Diffusion Effects on a Stochastic Amplifier Driven by the Square of a Gaussian Field: Discontinuous Transition to Intermittency", "abstract": "We study the effects of diffusion on the transition to intermittency in stochastic amplification driven by the square of a Gaussian field. The transition is characterized by an order parameter quantifying the spatial uniformity of the amplification. We consider a model in which the diffusion-amplification process is embedded in a random lattice of point absorbers in such a way that the Feynman-Kac formula is restricted to Brownian paths with a range not exceeding a finite cut-off. In this setting, with the Gaussian driving field in a wide class of physical interest, we show that diffusion-induced damping of the amplification is sufficiently strong to change the nature of the transition: from continuous in the absence of diffusion, to discontinuous in the presence of diffusion.", "url": "https://arxiv.org/abs/2611.34532", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Philippe Mounaix"}], "featured_authors": [{"name": "Philippe Mounaix"}], "author_count": 1}, {"id": "2611.34541", "category": "cond-mat", "title": "High-Throughput Orientation Extraction via Symmetry-Adapted Filters", "abstract": "An algorithm for finding the orientation of objects in an image that have a known rotational symmetry, the symmetry-adapted filter (SAF) algorithm, is presented. It is deterministic and training-free, which makes it fast and reproducible. A filter that encodes the known rotational symmetry and approximate peak width is centered on the symmetry center of the object of interest, masked to the region of interest, and rotated to maximize its inner product with the image. The approach is demonstrated on more than 20,000 small-angle neutron scattering images of a torque-driven skyrmion lattice. It is also demonstrated on atomically resolved real-space images, where mapping local atomic orientations enabled the identification of grains and grain boundaries and the quantification of lattice relaxation.", "url": "https://arxiv.org/abs/2611.34541", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Caden Myers"}, {"name": "Yucong Chen"}, {"name": "Nathan Chalus"}, {"name": "Morten R. Eskildsen"}, {"name": "Tess Smidt"}, {"name": "Simon J. L. Billinge"}], "featured_authors": [{"name": "Caden Myers"}, {"name": "Yucong Chen"}, {"name": "Nathan Chalus"}, {"name": "Morten R. Eskildsen"}, {"name": "Tess Smidt"}, {"name": "Simon J. L. Billinge"}], "author_count": 6}, {"id": "2611.34551", "category": "cond-mat", "title": "EGQCA Code: automated high-throughput thermodynamic modeling of solid solutions", "abstract": "Modeling disordered systems from first principles across the full composition range is a long-standing computational challenge. We present a code package implementing the extended generalized quasichemical approximation (EGQCA), which describes solid solutions through the statistics of a finite set of clusters and enables their thermodynamic modeling at arbitrary compositions and temperatures. The package automates the complete workflow and interfaces with both DFT codes and universal machine-learned interatomic potentials (uMLIPs). We show that replacing DFT with uMLIPs reduces the cost of the cluster calculations by up to five orders of magnitude while preserving the thermodynamic predictions. To make computationally demanding properties tractable, we additionally introduce a cluster-selection algorithm that identifies the most relevant configurations. Together, these developments establish EGQCA as a fast and accurate framework for the thermodynamic modeling of solid solutions and a practical route toward high-throughput screening of disordered materials.", "url": "https://arxiv.org/abs/2611.34551", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Dominik Spath"}, {"name": "Luka Wibmer"}, {"name": "Kieran Bozier"}, {"name": "Ralf Meyer"}, {"name": "Eva Kogler"}, {"name": "Efisio Madeddu"}, {"name": "Chris Pickard"}, {"name": "Markus Aichhorn"}, {"name": "Simone Di Cataldo"}, {"name": "Luiz T. F. Eleno"}, {"name": "Christoph Heil"}, {"name": "Pedro N. Ferreira"}], "featured_authors": [{"name": "Dominik Spath"}, {"name": "Luka Wibmer"}, {"name": "Kieran Bozier"}, {"name": "Luiz T. F. Eleno"}, {"name": "Christoph Heil"}, {"name": "Pedro N. Ferreira"}], "author_count": 12}, {"id": "2611.34638", "category": "cond-mat", "title": "Frozen Phonons on Dense $\\mathbf{q}$-Grids Using Set Covers", "abstract": "Phonon dynamics determine a vast number of properties in the solid state, such as the heat capacity, thermal expansion, and thermal conductivity. Phonons are obtained through the dynamical matrix, which, in the frozen phonon approach, is calculated as a finite difference derivative of the analytical Hellmann-Feynman force. This approach unfortunately typically suffers from requiring very large supercells, even for modest $\\mathbf{q}$-grids. The non-diagonal supercell method remedies this issue by determining the smallest supercell commensurate with a given $\\mathbf{q}$-point, drastically reducing the supercell size, but in turn requiring a new supercell for each $\\mathbf{q}$-point on the grid. This introduces redundancy, however, since a single non-diagonal supercell may be commensurate with several $\\mathbf{q}$-points. In this work I present a method to determine a minimal set of supercells, such that every $\\mathbf{q}$-point on the grid is commensurate with at least one supercell. I present an algorithm to solve the problem and prove that it yields the optimal solution, before summarizing the algorithm using pseudocode. The scaling of the number of supercells with the density of the grid is discussed. Numerical results on a variety of systems show the significant computational advantage of the method, which increases with the density of the grid.", "url": "https://arxiv.org/abs/2611.34638", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Sebastian Riis Thomsen"}], "featured_authors": [{"name": "Sebastian Riis Thomsen"}], "author_count": 1}, {"id": "2611.34665", "category": "cond-mat", "title": "Transverse Shifts Driven by Geometric Orbital Torque in Altermagnets", "abstract": "Anomalous transverse shifts in interface reflection are conventionally attributed to spin-orbit coupling or its pseudospin analogue. Here, we uncover a distinct geometric mechanism driven solely by an orbital torque arising from Fermi-surface anisotropy. During total reflection, an incident wave packet penetrates the anisotropic transmitted medium as an evanescent wave. There, the broken rotational symmetry about the interface normal exerts an orbital torque, and the accumulated angular impulse---the product of the torque and the dwell time---leads to a transverse spatial shift. Applying this mechanism to altermagnets without spin-orbit coupling, we show that the orbital torque is odd in spin. As a consequence, the two spin channels are deflected to opposite sides of the incident plane, giving an intrinsic spatial spin separation in altermagnets. The shift also inherits the angular symmetry of the altermagnetic spin splitting and is strongly enhanced near the onset of total reflection. Our work thus uncovers a new mechanism for transverse shifts, predicts a novel spin separation effect in altermagnets, and offers a direct probe of the altermagnetic order.", "url": "https://arxiv.org/abs/2611.34665", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Runze Li"}, {"name": "Yugui Yao"}, {"name": "Zhi-Ming Yu"}], "featured_authors": [{"name": "Runze Li"}, {"name": "Yugui Yao"}, {"name": "Zhi-Ming Yu"}], "author_count": 3}, {"id": "2611.34780", "category": "cond-mat", "title": "Emergent Chern metal in strongly correlated moiré bilayers", "abstract": "We investigate the topological properties of a strongly correlated moiré transition metal dichalcogenide (TMD) bilayer (such as twisted $\\mathrm{MoTe}_2$ or $\\mathrm{WSe}_2$) hosting a spin-charge separated state coupled to a layer-polarized helical spin texture. Analyzing an effective low-energy Hamiltonian for mobile spinless holons moving through this non-coplanar spinon background, we reveal pronounced asymmetric band warping. This warping closes the global indirect band gap across most of the parameter space, restricting true topological insulators to fine-tuned critical trajectories. However, a finite local direct gap persists, stabilizing broad regions of a topological Chern metal ($C = \\pm 1$). Computing the Chern number and density of states, we demonstrate that this phase naturally yields a sizable, non-quantized anomalous Hall response accompanied by finite longitudinal conduction, providing a purely electronic strong-coupling mechanism for dissipative anomalous Hall states in moiré systems.", "url": "https://arxiv.org/abs/2611.34780", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Kaushal Kumar Kesharpu"}, {"name": "Evgenii A. Kochetov"}], "featured_authors": [{"name": "Kaushal Kumar Kesharpu"}, {"name": "Evgenii A. Kochetov"}], "author_count": 2}, {"id": "2611.34853", "category": "cond-mat", "title": "Monotonic probes of asymmetry and robustness of the quantum Mpemba effect", "abstract": "Entanglement asymmetry has emerged as a powerful probe of symmetry restoration and the quantum Mpemba effect. However, its conventional Rényi generalizations, defined as differences of Rényi entropies, are not monotones in the resource-theoretic sense. Here, we investigate an alternative family of asymmetry quantifiers based on sandwiched Rényi divergences, which satisfy monotonicity under symmetry-preserving quantum channels. Developing a two-parameter replica approach, we show how these quantities can be computed from charged moments and establish a remarkable correspondence with conventional Rényi asymmetries under the inversion of the Rényi index, $\\alpha\\leftrightarrow 1/\\alpha$. This relation, exact for pure states, holds at leading order in the relevant scaling limits for homogeneous quantum quenches, including interacting integrable systems, and for Haar-random states. Applying these results to quenches from tilted ferromagnetic states, we demonstrate that the quantum Mpemba effect is remarkably robust, occurring throughout the entire family of sandwiched Rényi asymmetry monotones. We identify dynamical regimes in quenches from spatially inhomogeneous initial states where conventional Rényi asymmetries and genuine monotones exhibit qualitatively different behaviours. We also investigate a solvable toy model illustrating the possible dependence of Mpemba crossings on the Rényi index. Our findings establish a connection between conventional Rényi asymmetries and quantum resource theory, explaining their effectiveness in broad classes of nonequilibrium protocols while highlighting the additional information provided by genuine asymmetry monotones.", "url": "https://arxiv.org/abs/2611.34853", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Riccardo Travaglino"}, {"name": "Michele Mazzoni"}, {"name": "Pasquale Calabrese"}], "featured_authors": [{"name": "Riccardo Travaglino"}, {"name": "Michele Mazzoni"}, {"name": "Pasquale Calabrese"}], "author_count": 3}, {"id": "2611.34900", "category": "cond-mat", "title": "Brightening spin- and parity-forbidden interlayer excitons through rhombohedral stacking", "abstract": "Brightened symmetry-forbidden excitons can provide critical information about the electronic structure and many-body interactions in semiconductors. Recently, interlayer atomic registry has emerged as a new way to control atomically thin layered materials in both ground and excited states. Here we show that the rhombohedral stacking in a 3R-MoS_2 homobilayer can brighten two symmetry-forbidden interlayer excitons: one is a spin-unlike 1s exciton and the other is a parity-odd 2p exciton. The nature of these interlayer excitons is revealed by their gfactors as well as the hybridization patterns observed when they are tuned to resonate with intralayer excitons. Surprisingly, the hybridized 2p exciton exhibits a constructive quantum interference between the acquired transition dipoles, revealing a hidden gauge-invariant phase contrast between the constituent electronic states. Our results establish stacking control as a powerful approach for modulating quantum phases of excitons in 2D semiconductors.", "url": "https://arxiv.org/abs/2611.34900", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Haodong Hu"}, {"name": "Chih-En Hsu"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Hung-Chung Hsueh"}, {"name": "Zhenglu Li"}, {"name": "Ziliang Ye"}], "featured_authors": [{"name": "Haodong Hu"}, {"name": "Chih-En Hsu"}, {"name": "Kenji Watanabe"}, {"name": "Hung-Chung Hsueh"}, {"name": "Zhenglu Li"}, {"name": "Ziliang Ye"}], "author_count": 7}, {"id": "2611.34926", "category": "cond-mat", "title": "Magnons in solids with correlated atomic and nanoscale disorder", "abstract": "Atomic defects and disorder affect both the microscopic magnon excitations and the macroscopic physical properties of real-world magnetic materials. The rationalization of this relation has hitherto remained elusive, because of the intertwined challenges of simulating with quantum accuracy atomic- and nanoscale inhomogeneities and correlations, and their effect on the magnon spectral function determining observables such as spin stiffness. Here, we introduce a theoretical and computational framework to address these challenges. First, we develop the Coupled Optimization of SpIN Environment (COSINE) algorithm for efficiently relaxing the atomic structure and magnetic configuration of a solid with defects or disorder to a local energy minimum. Then, we discuss how to efficiently obtain exchange interactions accounting for local compositional, structural, and magnetic-moment inhomogeneities. Finally, we develop a paraunitary unfolding approach for Bogoliubov bosons, which allows us to predict the magnon spectral function in materials with any magnetic order, including systems with canting and full, partial, or no magnetic-moment compensation. We showcase our approach in a representative defective ferrimagnet for generality, and then combine it with state-of-the-art spin-informed machine-learning potentials to quantitatively predict how nonuniformities in the spatial distribution of vacancy defects control blurring of effective magnon bandstructures.", "url": "https://arxiv.org/abs/2611.34926", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Alex Moorhouse"}, {"name": "Joseph Barker"}, {"name": "Michele Simoncelli"}], "featured_authors": [{"name": "Alex Moorhouse"}, {"name": "Joseph Barker"}, {"name": "Michele Simoncelli"}], "author_count": 3}, {"id": "2611.33264", "category": "hep-th", "title": "Quantum critical collapse to an extremal black hole", "abstract": "It has been emphasized recently that some extremal black holes are \"critical\" solutions, lying at the threshold between gravitational collapse and dispersion. We study the effect of quantum gravity on critical solutions for the collapse of a thin shell of charged dust. We consider the Hamiltonian that generates the shell equation of motion with respect to the exterior Killing time and coincides with the ADM energy on-shell. Near criticality, this Hamiltonian is shown to be canonically equivalent to that of a Liouville theory with negative potential. After quantization, this model predicts that a collapsing shell has a non-trivial probability of undergoing a quantum mechanical bounce when its energy above extremality is comparable to the \"breakdown scale\". The bounce probability approaches unity at extremality. Hence this model predicts that the critical surface in the classical theory is thickened quantum mechanically into a \"critical layer\". The probability density function for the black hole energy is suppressed below the breakdown scale in the same way as found recently by Turiaci and Wu.", "url": "https://arxiv.org/abs/2611.33264", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hugo Lange"}, {"name": "Harvey S. Reall"}], "featured_authors": [{"name": "Hugo Lange"}, {"name": "Harvey S. Reall"}], "author_count": 2}, {"id": "2611.33271", "category": "hep-th", "title": "The black hole IR triangle for scalar QED", "abstract": "We construct the black hole infrared triangle of scalar QED on a stretched Schwarzschild horizon at tree level. In the covariant phase space of the near-horizon Maxwell field, the soft charge is a corner term. The memory is the zero mode of the gauge-invariant radiative field along the generators. It is conjugate to the boundary gauge mode that labels the degenerate horizon vacua, and Gauss' law fixes it by the flux of charge through the horizon. The Noether flux of the residual gauge transformation through the stretched horizon is not conserved by the scattering, because charged matter crosses the stretched horizon in both directions. The flux with its matter part removed is the soft charge, which generates the large gauge transformation. Its Ward identity is equivalent to a soft photon theorem in every radiative partial wave, which we derive from the near-horizon Feynman rules and, where these do not control the emission, from the field equations at leading order. The main difference from null infinity is that on a stretched horizon both radial branches of the field are independent boundary data. The hard charge is a radial flux. With both branches present it weights each leg by the direction of its radial motion, and the soft factor is a sign per leg. The endpoint data on the two branches give two boundary observables, the time-integrated transverse magnetic and electric fields. The field radiated by a scattering process contributes only to the first, where it cancels the change in the Coulomb memory of the charges, so that the soft charge is conserved. A charge that crosses the horizon enters both. We also discuss the infrared divergence, the dressing of the external states, and the fate of the memory in the Hartle--Hawking state, where it performs a random walk driven by the Hawking radiation.", "url": "https://arxiv.org/abs/2611.33271", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fabiano Feleppa"}, {"name": "Nava Gaddam"}, {"name": "Nico Groenenboom"}], "featured_authors": [{"name": "Fabiano Feleppa"}, {"name": "Nava Gaddam"}, {"name": "Nico Groenenboom"}], "author_count": 3}, {"id": "2611.33272", "category": "hep-th", "title": "The OPE of lines beyond CFT", "abstract": "We discuss the fusion of parallel line defects in theories defined by relevant deformations of a conformal fixed point. We propose an operator product expansion to describe this limit in terms of a Wilsonian effective action whose coefficients are computable in conformal perturbation theory around the UV. This allows one to fix, order by order, the fusion limit of correlation functions involving the defects, up to non-perturbative coefficients associated to correlation functions (condensates) on the fused defect. It thus generalizes the familiar OPE of local operators in QFT. As a non-perturbative test of our proposal, we consider the short-distance potential between two magnetic impurities in the $2d$ Ising model. We find excellent agreement between the OPE framework and DMRG extractions of the potential and condensates (the latter also computed exactly with integrability). In addition, we consider a number of solvable models to illustrate different features of the framework.", "url": "https://arxiv.org/abs/2611.33272", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jan Albert"}, {"name": "Matthew Forslund"}, {"name": "Alexandre Homrich"}], "featured_authors": [{"name": "Jan Albert"}, {"name": "Matthew Forslund"}, {"name": "Alexandre Homrich"}], "author_count": 3}, {"id": "2611.33273", "category": "hep-th", "title": "The String Theory Photinoverse", "abstract": "Type-IIB string compactifications typically give rise to a significant number of RR-photons. These are generically massless and do not possess any light charged states, making them `superhidden'. However, since supersymmetry is present at least at some high scale, corresponding `dark photinos' are also predicted. The kinetic mixing of the p
