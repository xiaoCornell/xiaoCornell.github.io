ous limitations. For $\\mathrm{U}(1)$ lattice gauge theories, we identify a randomization scale $c$, the minimum patch size needed for matter to screen every allowed boundary-flux mismatch, and a diffusive scale governing boundary-flux correlations. Glued circuits built from gauge-symmetric unitaries with subdiffusive support are efficiently distinguishable from gauge-symmetric Haar-random unitaries, whereas local controlled designs can be glued into global approximate designs when overlaps exceed the diffusive scale multiplied by a logarithmic factor. Our analysis suggests incomplete screening limits design guarantees to constant order, whereas strictly locally random systems with complete local screening ($c=1$) admit a local tensor-product description, permitting superpolynomial design orders and logarithmic-depth designs and PRUs. We construct a toy model of charged black-hole evaporation in which insufficient screening makes uninterrupted complete discharge exponentially unlikely in $c$, whereas strict local randomization removes this screening obstruction. This motivates a quantum-information analogue of the weak gravity conjecture, requiring the available charged spectrum to support complete local screening in addition to superextremality. We conjecture that this condition allows gauge-symmetric systems to scramble as rapidly as unconstrained ones and support this by constructing logarithmic-depth approximate strong designs and strong PRUs.", "url": "https://arxiv.org/abs/2611.33312", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yunfei Wang"}, {"name": "Yuqing Li"}, {"name": "Junqi Wang"}, {"name": "Alexey V. Gorshkov"}, {"name": "Junyu Liu"}], "featured_authors": [{"name": "Yunfei Wang"}, {"name": "Yuqing Li"}, {"name": "Junqi Wang"}, {"name": "Alexey V. Gorshkov"}, {"name": "Junyu Liu"}], "author_count": 5}, {"id": "2611.33317", "category": "quant-ph", "title": "When does a noisy Bell pair attain the Rains bound?", "abstract": "Two entangled Bell-diagonal qubit states with the same singlet fraction have the same Rains bound. We prove that their attainable rates under operations preserving the positive partial transpose can nevertheless differ: the bound is attained if and only if one of the Bell probabilities vanishes. Every mixed entangled isotropic state, in every finite dimension, lies strictly below its bound. This refutes the attainment suggested by finite-block numerics, and places the two-way quantum capacity of the qubit depolarizing channel strictly below its relative-entropy bound.", "url": "https://arxiv.org/abs/2611.33317", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "featured_authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "author_count": 2}, {"id": "2611.33340", "category": "quant-ph", "title": "Quantum Copy Complexity of Testing Monotonicity and Other Properties", "abstract": "We study the sample complexity of testing monotonicity of Boolean functions when the tester is given only copies of the quantum function state $|\\psi_f\\rangle=\\frac{1}{\\sqrt{2^n}}\\sum_{x\\in\\{0,1\\}^n}|x,f(x)\\rangle$. We give a tester with sample complexity $O\\left(\\min\\left\\{\\frac{n}{\\varepsilon^3}, \\frac{n^{3/2}}{\\varepsilon^2}\\right\\}\\right)$, improving on the previous $\\widetilde O(n^2/\\varepsilon^2)$ upper bound of [CNS26]. We also prove the first nontrivial lower bounds for monotonicity testing from quantum function states, matching our upper bounds over a broad range of $\\varepsilon$. Our upper bounds use two approaches. The first approach refines the Fourier-based tester of [CNS26] by handling high-influence functions separately, adapting an idea from [KMS18]. The second approach uses the classical path tester of [KMS18] by constructing a quantum observable whose expectation equals the path tester's violation probability. To prove the lower bounds, we place independent functions in mutually incomparable regions of the Boolean hypercube, building on the classical constructions of [BB16, CWX17]. We introduce a new argument for the quantum setting that replaces a fixed number of copies with a Poisson-distributed number of copies, allowing the contributions from different regions to be analyzed independently. This same framework also allows us to prove an $\\Omega(n^2)$ lower bound for testing union-closedness and $2$-monotonicity from quantum function states.", "url": "https://arxiv.org/abs/2611.33340", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Preksha Naik"}], "featured_authors": [{"name": "Preksha Naik"}], "author_count": 1}, {"id": "2611.33413", "category": "quant-ph", "title": "How Many Keys Must a Quantum Computer Break to Take Over a Blockchain? A Quantum Nakamoto Coefficient for Fifteen Proof-of-Stake Networks", "abstract": "Blockchains that run on proof of stake, among them Ethereum and Solana, are secured by a vote: a transaction becomes irreversible once computers holding two thirds of the deposited money have signed it. Each signature is made with a secret key whose public counterpart is permanently visible, and a large quantum computer could compute the secret from the public key. We ask a simple question: how many such keys would it have to break to take over the vote? We call the answer the quantum Nakamoto coefficient and measure it on live data from fifteen networks, collected on 15 November 2026. For fourteen of them, 2 to 18 keys are enough to break the network's security guarantee and 7 to 77 to control it outright; at one key every 12 minutes, the pace implied by recent resource estimates, a single quantum computer would defeat the guarantee of any of these networks in less than four hours and take full control in less than sixteen hours. Ethereum is far more robust, but a 2025 change that lets operators merge their deposits into fewer keys has cut the number of keys at its first threshold from about 465,000 to 7,682, a factor of 60. We derive a simple formula for this effect, and another for the small rotating committee on which wallets rely, and confirm both on the data. For fourteen of the fifteen networks, the first large quantum computer would be less than a day away from total control. Their validator signatures should therefore be migrated to post-quantum schemes before such a machine exists, since once it does, the time to respond is measured in hours.", "url": "https://arxiv.org/abs/2611.33413", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Seyyed Mohammad Hassan Halataei"}], "featured_authors": [{"name": "Seyyed Mohammad Hassan Halataei"}], "author_count": 1}, {"id": "2611.33438", "category": "quant-ph", "title": "Estimating the Trotter error via phase analysis", "abstract": "Good Trotter error estimates are crucial to correctly assess the resources required to perform an approximate time evolution with a target accuracy. General bounds for finite-size quantum systems are found to be very loose in practice, and it is therefore highly desirable to improve on them. In this work, we analyze the Trotter error in terms of the spectrum of a phase operator that we construct from the Hamiltonian. In the limit of a small Trotter step size, we obtain an estimate of the Trotter error written in terms of a sum of nested commutators between terms of the Hamiltonian. The structure of this estimate allows us to naturally explain the looseness of general bounds. We show that even for a finite step size, our estimate typically remains more accurate than general bounds. Moreover, we argue that it becomes an upper bound for the Trotter error per step in the limit of a large number of steps, reflecting the destructive interference of the errors across steps. Our results provide useful practical heuristics for resource optimization in quantum simulations.", "url": "https://arxiv.org/abs/2611.33438", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Maxime Dion"}, {"name": "Benjamin D'Anjou"}], "featured_authors": [{"name": "Maxime Dion"}, {"name": "Benjamin D'Anjou"}], "author_count": 2}, {"id": "2611.33454", "category": "quant-ph", "title": "A Realistic End-to-End Runtime Crossover Estimation for Quantum-Enhanced Training of Large-Scale Machine Learning Models", "abstract": "Machine Learning (ML) is one promising application domain for Quantum Computing (QC) speedups, but asymptotic complexity considerations often mask the actual engineering costs of actual end-to-end workflows. For the use case of training a linearized Neural Network with a Quantum Linear Solver, a provably favorable quantum scaling has been suggested. We present realistic resource estimates for this problem, accounting for data access, computation, and readout. Our analysis examines three increasingly complex benchmarking scenarios, under distinct sparsity-scaling assumptions, thereby enabling progressively more realistic resource estimates. We identify crossover regimes relative to classical methods and find that crossover points emerge only for very large problem sizes, long computation times, and highly restrictive output requirements. This work provides a blueprint for evaluating quantum-enhanced ML algorithms under realistic hardware constraints and help identifying the bottlenecks that must be overcome to approach industrial quantum utility.", "url": "https://arxiv.org/abs/2611.33454", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Maximilian Alexander Wolf"}, {"name": "Alona Sakhnenko"}, {"name": "Florian Geissler"}, {"name": "Andrea Matic"}, {"name": "Jeanette Miriam Lorenz"}], "featured_authors": [{"name": "Maximilian Alexander Wolf"}, {"name": "Alona Sakhnenko"}, {"name": "Florian Geissler"}, {"name": "Andrea Matic"}, {"name": "Jeanette Miriam Lorenz"}], "author_count": 5}, {"id": "2611.33699", "category": "quant-ph", "title": "Dimensional crossover to a slow disordered spin bath below the mean spin spacing", "abstract": "How thin must a layer of spins be to act as a two-dimensional bath? For nitrogen spins around an NV$^-$ centre in diamond, a cluster expansion with flip-flopping outer spins gives a crossover near the mean spin spacing. Thin layers follow two-dimensional scaling with a prefactor six to seven times that of bulk. Without hyperfine disorder the crossover remains but the step is under three: the disorder leaves each spin almost no resonant partner. Flip-flops allow several milliseconds, so another process must set the measured 0.5 ms; nitrogen spin-lattice relaxation is consistent.", "url": "https://arxiv.org/abs/2611.33699", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Chikara Shinei"}], "featured_authors": [{"name": "Chikara Shinei"}], "author_count": 1}, {"id": "2611.33730", "category": "quant-ph", "title": "Improved Quantum Algorithms for TSP and More", "abstract": "The traveling salesman problem (TSP) is a canonical NP-hard optimization problem. For general edge weights, the classical dynamic programs of Bellman and of Held and Karp solve TSP on $n$ cities in $O^*(2^n)$ time. To date, no $\\Oh(c^n)$-time classical algorithm is known for any $c<2$. Combining Grover search with the dynamic programming technique, Ambainis et al. (SODA 2019) introduced a quantum algorithm with running time $O^*(1.7274^n)$, which is still the best known quantum time bound. In this work, we improve the running time to $O^*(1.70961^n)$. The core idea of our algorithm is to combine the framework of Ambainis et al. with the extremal set-system framework, which was recently used for classical space-time tradeoffs of TSP by Jabal Ameli, Nederlof and Wang (FOCS 2026) and Dallant and Kozma (FOCS 2026). To obtain our upper bound, we decompose the optimal tour into four consecutive subpaths of different sizes, for which, based on the idea of set-systems, the optimal values are computed using dynamic programming with small success probability and use amplitude amplification. Using the same idea, we also give a new quantum space-time tradeoff for TSP, improving the previous results of Caroppo et al. (ESA 2026) and Dallant ( arXiv:2607.12374 ). Finally, we obtain the same quantum upper bounds for several other related problems.", "url": "https://arxiv.org/abs/2611.33730", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Masayuki Miyamoto"}], "featured_authors": [{"name": "Masayuki Miyamoto"}], "author_count": 1}, {"id": "2611.33806", "category": "quant-ph", "title": "QPAT: A Universal Quantum Machine Learning Framework for Quantum-Assisted Training and Classical Inference", "abstract": "Deep learning models often struggle with sharp local optima and overfitting in limited-data regimes, and exhibit limited capacity for capturing high-order, complex probability distributions. Quantum Machine Learning (QML) models, by operating in exponentially large Hilbert spaces, can efficiently represent such distributions and provide favorable inductive biases for learning, offering a promising pathway to overcome these limitations. However, their practical deployment in the Noisy Intermediate-Scale Quantum (NISQ) era is severely hindered by gradient coupling, barren plateaus, data-loading bottlenecks, and high inference latency. To bridge classical AI and QML, we propose QPAT (QCBM-Prior-Assisted Training), a universal framework that employs a Quantum Circuit Born Machine (QCBM) as a learnable generative prior to provide a task-aligned structured inductive bias during classical model training. The framework can be seamlessly integrated into any classical backbone, including LSTMs, CNNs, and Transformers. We introduce a decoupled fitness-based scoring mechanism and a stochastic \"Drop-Prior\" mechanism to implicitly distill quantum structural knowledge into the classical weights during training. Evaluated extensively on six benchmarks spanning time-series forecasting, computer vision, and natural language processing, our framework consistently outperforms purely classical backbones in both predictive performance and stability across random seeds; ablation studies further show that these gains are not reproduced by unstructured random priors or a classically learned generative prior. Remarkably, our approach enables completely classical inference, bypassing quantum latency while preserving quantum-enhanced accuracy, paving a highly practical path for QML deployment.", "url": "https://arxiv.org/abs/2611.33806", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yixiong Chen"}], "featured_authors": [{"name": "Yixiong Chen"}], "author_count": 1}, {"id": "2611.33853", "category": "quant-ph", "title": "Efficient Quantum Algorithm for the Generalised Geography Game", "abstract": "The Generalized Geography Game ($GGG$) is a two-player combinatorial game played on a directed graph, where players alternately move a token along edges without revisiting previously visited vertices. In the existing literature, determining whether an arbitrary position in a graph is a winning position for either player is a well-known $PSPACE$-complete decision problem. Certain formulations of $GGG$ have been shown to fall outside the $PSPACE$-complete complexity class. While $PSPACE$-complete problems are believed to take exponential time for classical computation, quantum computation offers new possibilities. In this work, we present a bounded-error quantum polynomial-time ($BQP$) algorithm for solving the $GGG$ problem. The proposed algorithm runs in time $O(N^{2}/\\epsilon^{6})$, which is polynomial in the input size $N$, and achieves bounded error with $\\epsilon = O(1/\\mathrm{poly}(N))$. This result demonstrates the potential of quantum algorithms to efficiently solve combinatorial game problems that are traditionally considered computationally hard in the classical setting.", "url": "https://arxiv.org/abs/2611.33853", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Mriganka Sandilya"}, {"name": "Shibdas Roy"}], "featured_authors": [{"name": "Mriganka Sandilya"}, {"name": "Shibdas Roy"}], "author_count": 2}, {"id": "2611.33854", "category": "quant-ph", "title": "Reproducible distributions of energy-relaxation times in superconducting qubits from broadband SWAP spectroscopy", "abstract": "The distribution of the qubit energy-relaxation time (T1) in a superconducting quantum processor affects its logical error rates. However, reports on qubit fabrication quality focus on the median or best-case T1 from measurements that are not reproducible due to resonant coupling to two-level system (TLS) defects whose frequencies fluctuate in time. Here, we sweep the frequency f01 of a flux-tunable qubit over several GHz with SWAP spectroscopy, quoting the quality factor Q = 2 pi f01 T1 to make T1 comparable across frequencies. We show that the cumulative distribution of Q pooled over the sweep is reproducible across four thermal cycles spanning 326 days, up to the reshuffling of strongly coupled TLSs. In contrast to repeated measurements at a single frequency, the medians of the broadband Q distributions spread by an order of magnitude less over 3 days. The distance between the cumulative distributions of repeats comes close to its sampling floor only for the broadband sweeps. The broadband Q distribution further resolves small coherence differences between identically designed qubits on two dies of the same wafer. These results establish the broadband Q distribution as a reproducible metric for qubit fabrication quality.", "url": "https://arxiv.org/abs/2611.33854", "type": "实验", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Joaquin Minguzzi"}, {"name": "John Clai Owens"}, {"name": "Maximilien F. Debbas"}, {"name": "Ana Valdés-Curiel"}, {"name": "Ming-Han Chou"}, {"name": "Haifeng Qiao"}, {"name": "Shahriar Aghaeimeibodi"}, {"name": "Oskar Painter"}, {"name": "Matthew H. Matheny"}, {"name": "Loren J. Swenson"}], "featured_authors": [{"name": "Joaquin Minguzzi"}, {"name": "John Clai Owens"}, {"name": "Maximilien F. Debbas"}, {"name": "Oskar Painter"}, {"name": "Matthew H. Matheny"}, {"name": "Loren J. Swenson"}], "author_count": 10}, {"id": "2611.33888", "category": "quant-ph", "title": "Decoherent Histories from Local Spectral Dephasing in Quantum Many-Body Systems", "abstract": "We study local spectral dephasing as a mechanism for decoherent histories in isolated quantum many-body systems. We prove that vanishing projector-weighted spectral concentration is asymptotically equivalent to vanishing time-averaged local memory. With independently sampled waiting times and suitable conditions on the initial state and history weights, this local property suppresses normalized interference across complete fixed-length history families with high probability. For translation-invariant lattices, spectral estimates provide conditions under which dephasing occurs at long times. Exact diagonalization and sparse time evolution of a spin chain illustrate the results.", "url": "https://arxiv.org/abs/2611.33888", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jie Gu"}], "featured_authors": [{"name": "Jie Gu"}], "author_count": 1}, {"id": "2611.33942", "category": "quant-ph", "title": "Empirical De-Quantization and Norm-Controlled Spectral Audit of Quantum Cognition Machine Learning in an Emerging Equity Market", "abstract": "Quantum-inspired machine learning in econophysics describes states of financial markets through matrix Hamiltonians, using ground-state expectations to predict returns and spectral gaps to identify crises. Although early work reports encouraging advances, it remains unclear whether these stem from genuine noncommutative quantum geometry or from conventional classical regularization and scale effects. We test this in a controlled audit of matrix-form Quantum Cognition Machine Learning (QCML) and variational quantum circuits on the Moscow Exchange (2020-2025), combining daily equity data with causally lagged macro news under realistic trading costs, short-selling bans, and abrupt shifts in market regimes. By using capacity-matched operator swaps -- which progressively eliminate complex Berry phases and matrix noncommutativity down to a commuting classical Gibbs radial-basis limit under scale-invariant regularization -- as well as testing spectral indicators against radial-norm null hypotheses and untrained GUE random matrices, we isolate the contribution of each quantum element. In out-of-sample data, neither complex phases, noncommutativity, nor circuit entanglement improves the ranking of returns relative to classical controls. Once feature magnitudes are normalized, apparent crisis detection from raw spectral gaps drops below chance levels. These results show that on noisy equity panels, matrix-form QCML acts as an adaptive spectrally bounded classical smoothing kernel: it reliably integrates lagged news and curbs extreme crisis forecasts without passing economic multiple-testing thresholds, while our audit provides operator-swap and random-matrix controls for evaluating future quantum-inspired financial models.", "url": "https://arxiv.org/abs/2611.33942", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Pavel Chuklanov"}], "featured_authors": [{"name": "Pavel Chuklanov"}], "author_count": 1}, {"id": "2611.33955", "category": "quant-ph", "title": "Gaussian Is All You Need: Renyi Optimizers and Optical Channel Simulation", "abstract": "Preparing an entangled state faithfully requires an amount of resource given by its entanglement cost. With less entanglement, the best achievable fidelity is governed by the Rényi entanglement of formation of orders above one. We prove that, for any finite-energy multimode bosonic Gaussian state, all these quantities are additive and attained by a Gaussian pure-state decomposition. It follows that the closest separable state in fidelity to any Gaussian state is Gaussian, and that the strong converse exponent of entanglement dilution, which sets how fast the optimal fidelity decays below the cost, is exactly computable. For channels, we prove that pure Gaussian inputs minimize the output Rényi entropies of every multimode Gaussian channel at all orders $\\alpha\\ge1$, and we obtain the optimal fidelity of simulating pure-loss and quantum-limited amplifier channels with finite entanglement, for any number of uses.", "url": "https://arxiv.org/abs/2611.33955", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuan Gao"}, {"name": "Gerardo Adesso"}], "featured_authors": [{"name": "Yuan Gao"}, {"name": "Gerardo Adesso"}], "author_count": 2}, {"id": "2611.33987", "category": "quant-ph", "title": "Unified preparation of exact and asymptotic quantum many-body scars from Dicke states", "abstract": "We propose a unified quantum algorithm for preparing exact and asymptotic quantum many-body scar (QMBS) states in the spin-1 {\\it XY}, domain-wall-conserving, and Onsager scar models. Model-dependent isometries map the exact scar states to Dicke states and the target asymptotic QMBS states to gapless magnon excitations of the spin-1/2 ferromagnetic Heisenberg chain. Exact QMBS states are prepared by applying the inverse isometries to Dicke states. For asymptotic QMBS states, block encoding first prepares the magnon excitations from Dicke states to a prescribed fidelity, after which the inverse isometries map the prepared states back to the physical chains. At fixed target fidelity, the block-encoding success probability has a positive lower bound independent of system size and scar index, implying that a constant number of amplitude amplification rounds suffices. Our algorithm enables systematic studies of nonergodic dynamics on programmable quantum simulators.", "url": "https://arxiv.org/abs/2611.33987", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yuki Asari"}, {"name": "Masaya Kunimi"}, {"name": "Tetsuro Nikuni"}], "featured_authors": [{"name": "Yuki Asari"}, {"name": "Masaya Kunimi"}, {"name": "Tetsuro Nikuni"}], "author_count": 3}, {"id": "2611.34004", "category": "quant-ph", "title": "Discrete truncated Wigner approximation of the quantum phase transition in the transverse-field Ising model", "abstract": "The discrete truncated Wigner approximation (DTWA) has been a workhorse for large-scale spin dynamics, but whether it captures dynamics across a quantum phase transition has not been tested systematically. In this work, we use the transverse-field Ising model (TFIM) to study the quantum phase transition with DTWA from one to three dimensions and with all-to-all connectivity, using slow linear ramps and fast ramps. We find that DTWA cannot capture the dynamics on the one-dimensional chain, and that its behavior is consistent with classical thermalization, in which its classical spins relax toward a thermal state at a finite effective temperature that does not vanish for slow ramps, while a one-dimensional chain cannot order at any finite temperature. For square and cubic lattices, in contrast to the chain, DTWA builds order, and the order sets in close to the quantum critical point found by quantum Monte Carlo (QMC). However, its correlations do not grow with the Kibble-Zurek exponents, so DTWA captures the onset of order but not the universal dynamics of the transition. For all-to-all coupling, DTWA follows the exact growth of the order parameter along the entire ramp. Our results suggest that DTWA becomes more reliable as each spin interacts with more partners, and that beyond one dimension it can indicate where a quantum phase transition lies but cannot capture its critical scaling.", "url": "https://arxiv.org/abs/2611.34004", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Tuan-Vu Truong"}, {"name": "Hoang-Long Nguyen"}], "featured_authors": [{"name": "Tuan-Vu Truong"}, {"name": "Hoang-Long Nguyen"}], "author_count": 2}, {"id": "2611.34040", "category": "quant-ph", "title": "Minimal input dimension for superactivation of one-shot zero-error quantum capacity", "abstract": "The one-shot zero-error quantum capacity $\\overline{Q}_0$ is studied within the framework of noncommutative graphs of quantum channels. The additivity of $\\overline{Q}_0$ is proved for an arbitrary finite collection of channels with two-dimensional input spaces. An explicit pair of noncommutative graphs $S,T\\subset M_3$ exhibiting superactivation of the one-shot zero-error quantum capacity is also constructed. Together, these results establish that the minimum input dimension for such superactivation is $3$.", "url": "https://arxiv.org/abs/2611.34040", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Andrei Shcherbakov"}], "featured_authors": [{"name": "Andrei Shcherbakov"}], "author_count": 1}, {"id": "2611.34060", "category": "quant-ph", "title": "Prethermalization of entanglement entropy in the mixed-field Ising model", "abstract": "We study how weak integrability breaking affects the dynamics of the half-chain entanglement entropy of random product states in the mixed-field Ising model. The associated Hamiltonian depends on two parameters $g$ and $h$ determining the sizes of the longitudinal and transverse fields and has two integrable limits: the classical Ising chain $(h=0)$ and the transverse-field Ising model $(g=0)$. Weak perturbations of these limits give rise to the short-range network (SRN) and long-range network (LRN) regimes, respectively. We characterize the departure from integrable dynamics and the emergence of intermediate entanglement plateaus by melting times $T_M$ at prescribed entropy thresholds and analyze their dependence on the perturbation strength. For the SRN parameters examined away from $g=2$, we find $T_M\\propto h^{-2}$ over the thresholds tested. At $g=2$, the relaxation splits into two stages: an initial departure from the integrable plateau with $T_M\\propto h^{-1}$, followed by the melting of a well-defined intermediate prethermal plateau with $T_{M_2}\\propto h^{-2}$. In the LRN regime, by contrast, the inverse of $T_M$ scales with exponents of $g$ close to either one or two, depending on the parameter values, the system size, and the entropy threshold, and no well-defined prethermal plateaus are observed. Our analysis distinguishes the melting of integrable dynamics from the subsequent decay of a prethermal plateau, which is observed in the SRN regime.", "url": "https://arxiv.org/abs/2611.34060", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Miguel Gonzalez"}, {"name": "Budhaditya Bhattacharjee"}, {"name": "Alexei Andreanov"}, {"name": "Barbara Dietz"}, {"name": "Sergej Flach"}], "featured_authors": [{"name": "Miguel Gonzalez"}, {"name": "Budhaditya Bhattacharjee"}, {"name": "Alexei Andreanov"}, {"name": "Barbara Dietz"}, {"name": "Sergej Flach"}], "author_count": 5}, {"id": "2611.34066", "category": "quant-ph", "title": "A Path Integral Method with Far-Field Expansion for Open Quantum Dynamics", "abstract": "We establish a connection between the quasi-adiabatic propagator path integral (QuAPI) method and fast resummation of Dyson series (FRODS). Building on this connection, we introduce a path integral method with far-field expansion (PIFFE) for quantum systems coupled linearly to a thermal Gaussian bath. PIFFE combines QuAPI with a Taylor expansion of the far-field bath influence, keeping interactions within $r$ time steps in exponential form. The scheme has error $O(\\Delta t^2)$ at fixed final time and is free of stochastic or tensor-compression errors. Spin-boson tests show that PIFFE gives results much closer to QuAPI than FRODS does, even for small $r$, while requiring substantially less storage than QuAPI. This allows much longer bath memory lengths and simulations of multilevel systems. Truncating the bath memory and limiting the total auxiliary degree further reduce storage and computational costs.", "url": "https://arxiv.org/abs/2611.34066", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Zhenning Cai"}], "featured_authors": [{"name": "Zhenning Cai"}], "author_count": 1}, {"id": "2611.34170", "category": "quant-ph", "title": "Beyond-quantum correlations for single system in pseudo-quantum model", "abstract": "Within the standard prepare-measure framework, it has been demonstrated that certain compositions of two elementary quantum systems can produce beyond-quantum correlations and can even lead to perfect discrimination of two non-orthogonal quantum states. In this Letter, we introduce the pseudo-quantum model (PQM) for a single system that incorporates the \\emph{pseudo-states (effects)} (they satisfy all the properties of quantum states and effects except having negative eigenvalues), and yields valid probability. We consider a prepare-measure communication game known as random access code (RAC) and demonstrate that the success probability achievable within PQM exceeds the corresponding optimal quantum success probability, thereby giving rise to beyond-quantum correlations even for a single system. We then show that such correlations are unphysical as they violate the information causality (IC) principle. Moreover, we demonstrate that two non-orthogonal states can be perfectly distinguishable in PQM for a single system. Therefore, we demonstrate that for a single indivisible system (devoid of any composition), the negativity of \\emph{pseudo-states (effects)} can lead to the emergence of beyond-quantum correlations.", "url": "https://arxiv.org/abs/2611.34170", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vishnu Purushothaman"}, {"name": "Akarshit Baranwal"}, {"name": "Rohit Sarma Sarkar"}, {"name": "A.K. Pan"}], "featured_authors": [{"name": "Vishnu Purushothaman"}, {"name": "Akarshit Baranwal"}, {"name": "Rohit Sarma Sarkar"}, {"name": "A.K. Pan"}], "author_count": 4}, {"id": "2611.34195", "category": "quant-ph", "title": "Scaling laws for quantum reflection of hydrogen isotopes on silicon", "abstract": "Quantum reflection is a counter-intuitive process occurring when an atom is reflected by a rapidly-varying attraction towards a surface, for example the Casimir-Polder force. The reflection probability depends on the attractive potential and on the mass of the atom. For hydrogen isotopes, the potentials are nearly identical whereas significant differences in quantum reflection come from the effect of atomic mass. We calculate the quantum reflection probability for the three isotopes H, D or T falling onto the plane surface of an intrinsic silicon bulk. We show that the results obey scaling laws determined by scattering lengths calculated from theory. Moreover the scattering lengths also obey scaling laws with respect to atomic masses of the isotopes.", "url": "https://arxiv.org/abs/2611.34195", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Romain Guérout"}, {"name": "Serge Reynaud"}], "featured_authors": [{"name": "Romain Guérout"}, {"name": "Serge Reynaud"}], "author_count": 2}, {"id": "2611.34217", "category": "quant-ph", "title": "Geometry, masking and selection in Differential Evolution and SOMA on quantum state manifolds", "abstract": "Differential Evolution (DE) and the Self-Organizing Migrating Algorithm (SOMA) generate new candidates through vector arithmetic: they subtract population members, scale the difference, and mask coordinates. Many practical search spaces are not vector spaces, however. Rotation angles are periodic, normalized states lie on spheres and projective spaces, and circuit parameters are coupled through the quantum states they produce. We present a systematic study of how such geometry affects the core operations of DE and SOMA. Keeping the operators and selection rules fixed, we replace only their geometric primitives and separate the effects of difference construction, masking, and selection in a large paired numerical study covering textbook manifolds and variational quantum problems. Geometry-consistent differences make full-crossover (CR = 1) DE significantly better on 16 of 31 non-Euclidean configurations, with no significant deterioration, and the advantage persists when the measured computational cost of each variant is taken into account. The effect is largest where ordinary subtraction misrepresents distances between candidates: success on periodic synchronization rises from 44% to 100%, and on a positive-definite matrix problem from 1% to 99%. On six- qubit variational eigensolvers, shortest-path angular differences reduce the mean final loss by 90% for about 3% extra runtime. The improvements come with two contrasting diversity patterns, more effective population contraction or preserved population diversity, so higher acceptance rates do not necessarily indicate better search. Crossover masks interact with geometry: they can favor cheaper retractions and can increase the distance moved in quantum-state space when circuit parameters are coupled. These results give practical rules for designing population-based optimizers on non-Euclidean and quantum search spaces.", "url": "https://arxiv.org/abs/2611.34217", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Vojtěch Novák"}, {"name": "Ivan Zelinka"}], "featured_authors": [{"name": "Vojtěch Novák"}, {"name": "Ivan Zelinka"}], "author_count": 2}, {"id": "2611.34343", "category": "quant-ph", "title": "Squeezing-preserving coherent control in Fourier-shaped optical lattices", "abstract": "Motional squeezed states of atoms in optical lattices are affected by the anharmonicity of the trapping potential. Unequal vibrational energy spacings cause dephasing among the occupied motional-state coherences, leading to distortion of the wavepacket and a reduction in squeezing. We show numerically that adding a weak second or third spatial harmonic to a one-dimensional lattice slows the initial decay of the squeezing. Squeezed states are prepared by one or two sudden changes of the lattice depth. For each harmonic and each preparation scheme, we choose the harmonic amplitude that keeps the evolved state closest, on average over 1 ms, to its evolution in a harmonic trap. We then compare the squeezing with that in a sinusoidal lattice with the same initial squeezing and trap frequency. In all four cases studied, the successive squeezing maxima initially decay more slowly in the shaped lattice. The improvement arises because the optimal harmonic nearly equalizes the two dominant vibrational level spacings over the region occupied by the squeezed wave packet, which canceling the quartic term of the potential alone does not achieve. Because the amplitude of the added harmonic is static and can be produced with existing Fourier-synthesis techniques, lattice shaping offers a simple way to preserve motional squeezing without additional time-dependent control.", "url": "https://arxiv.org/abs/2611.34343", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ko-Wei Cheng"}, {"name": "Wui Seng Leong"}, {"name": "Shau-Yu Lan"}], "featured_authors": [{"name": "Ko-Wei Cheng"}, {"name": "Wui Seng Leong"}, {"name": "Shau-Yu Lan"}], "author_count": 3}, {"id": "2611.34401", "category": "quant-ph", "title": "Planckian bounds on thermalization times of strongly coupled open quantum systems", "abstract": "We consider whether the thermalization of strongly coupled open quantum systems, whose equilibrium state is the mean-force Gibbs (MFG) state, is constrained by a fundamental Planckian time scale, $\\hbar/k_B T$. By requiring that the same process thermalizes a family of nearby system Hamiltonians, we obtain a lower bound on the thermalization time, irrespective of the specific system-bath dynamics. The bound depends only on the distinguishability of the corresponding MFG states, and can therefore be computed from equilibrium properties alone. In its simplest form, it requires only a static susceptibility and an equilibrium variance of a system observable. We characterize this bound from weak to strong coupling in exactly solvable fermionic models, in the spin-boson model, and in a spin coupled to a two-dimensional Heisenberg antiferromagnet. These models show that strong coupling can lift the Planckian constraint when the MFG state retains little information about the system Hamiltonian, while preserving it when that information is carried by system observables with substantial equilibrium fluctuations at frequencies below $k_B T/\\hbar$. The bound is complementary to open-system speed limits, since it constrains the acquisition of information rather than the preparation of the target, and can remain informative at strong coupling even when the latter become trivial.", "url": "https://arxiv.org/abs/2611.34401", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jesús Jiménez-Rodríguez"}, {"name": "John Calsamiglia"}, {"name": "Martí Perarnau-Llobet"}], "featured_authors": [{"name": "Jesús Jiménez-Rodríguez"}, {"name": "John Calsamiglia"}, {"name": "Martí Perarnau-Llobet"}], "author_count": 3}, {"id": "2611.34429", "category": "quant-ph", "title": "Native higher-order optimization with entropy quantum computing", "abstract": "Higher-order interactions are common in applied optimization: parity checks, radar-code sidelobes, portfolio skewness and kurtosis, and marketing-channel synergies all yield cubic or quartic objectives. Quantum annealers and most Ising machines accept only quadratic objectives, and gate-based quantum processors build every higher-order term from two-qubit gates. Entropy quantum computing, realized in the hybrid photonic-electronic Dirac-3S system, accepts polynomials of degree up to five with all-to-all coupling over binary, integer or simplex-constrained continuous variables. No user-supplied quadratization or circuit compilation is needed. We formulate four industrial use cases as six cubic and quartic instances, run them on Dirac-3S with 30 samples each, and score every sample against a certified optimum or a classical best-known value. We also estimate their cost on quantum annealers, superconducting grids and trapped-ion registers under standard mappings. For the two densest instances, a portfolio with about 80,000 terms and a budget allocation with 360,000 terms, the quadratized problems need embeddings far beyond current annealers, over $10^5$ physical qubits for the portfolio alone, and one phase-separation layer costs over $10^6$ two-qubit gates before optimization. Dirac-3S ran all six natively and returned feasible, distinct solutions. All samples of the binary instances are single-flip local minima. The best portfolio sample lies within 0.32% of the best-known value and the best budget sample 15% above it, but no sample reached its reference. Classical solvers reach the references within minutes at these sizes, and random starts followed by a local polish reach comparable or better values, so the advantage established here is one of expressibility and mapping cost, not of solution quality. Whether it extends to time to solution at larger sizes remains open.", "url": "https://arxiv.org/abs/2611.34429", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Narendra N. Hegade"}, {"name": "Pranav Chandarana"}, {"name": "Sebastian Wagner"}, {"name": "Bahman Qawami"}, {"name": "Wesley Dyk"}], "featured_authors": [{"name": "Narendra N. Hegade"}, {"name": "Pranav Chandarana"}, {"name": "Sebastian Wagner"}, {"name": "Bahman Qawami"}, {"name": "Wesley Dyk"}], "author_count": 5}, {"id": "2611.34448", "category": "quant-ph", "title": "Quantum dynamics of a charged particle on rotating curved surfaces and space curves in electromagnetic fields", "abstract": "We develop a gauge-consistent framework for a charged particle confined to a rotating curved manifold in an electromagnetic field, starting from the covariant Klein--Gordon equation. The non-relativistic reduction casts the rotational effects as effective gauge potentials while preserving the $U(1)$ symmetry, so that rotation and the external field enter alike, the geometry entering separately as the da Costa potential. The obstruction to dimensional reduction is gauge--geometry entanglement: transverse magnetic fields on a two-dimensional (2D) surface and structural torsion on a one-dimensional (1D) curve couple the tangential dynamics to the transverse degrees of freedom. We remove this entanglement by three mechanisms---a generalized transverse Poincaré gauge, the rotation-minimizing Bishop frame, and the parity of the transverse ground state, the last of which annihilates the residual first-order magnetic coupling for a single inversion-symmetric well. On a torus, an axial field generates a joint Sagnac--Aharonov--Bohm residual of tunable sign without spoiling the poloidal--azimuthal separability, whereas an in-plane field couples only through the out-of-plane extent of the structure: it breaks the axial symmetry there but leaves a planar curve unaffected to first order. The same torus shows the axial field tuning the curvature-induced localization, and a corrugated quantum ring converts periodic geometric and flux modulations into an artificial superlattice whose in-plane-field immunity follows from planarity and parity, not from the smallness of the field. Non-inertial quantum dynamics on surfaces and curves of arbitrary shape is thus reduced, within the thin-layer regime, to two ingredients: an effective gauge potential and a geometric potential.", "url": "https://arxiv.org/abs/2611.34448", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Long Du"}, {"name": "Yong-Long Wang"}], "featured_authors": [{"name": "Long Du"}, {"name": "Yong-Long Wang"}], "author_count": 2}, {"id": "2611.34468", "category": "quant-ph", "title": "Exponential Analysis for Trace-Distance Errors in Quantum Information Theory", "abstract": "We study the trace-distance error in classical-quantum soft covering, privacy amplification against quantum side information, convex splitting, and decoupling by a Haar-random unitary followed by partial trace. In the independent and identically distributed setting, we determine exact reliability functions and strong converse exponents for soft covering with independent codewords, uniform convex splitting, and Haar partial-trace decoupling. For privacy amplification, we determine the exact reliability function for independent random binning and the exact strong converse exponent for every two-universal hash ensemble. The reliability and strong converse formulas involve sandwiched and Petz-Rényi information, respectively. The proofs connect trace-distance errors to quantum hypothesis testing, using Rosenthal inequalities for sums of random matrices in the reliability analysis and conditional second-moment bounds for the strong converses.", "url": "https://arxiv.org/abs/2611.34468", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hao-Chung Cheng"}, {"name": "Li Gao"}, {"name": "Shi-Bing Li"}, {"name": "Hongsen Qiu"}], "featured_authors": [{"name": "Hao-Chung Cheng"}, {"name": "Li Gao"}, {"name": "Shi-Bing Li"}, {"name": "Hongsen Qiu"}], "author_count": 4}, {"id": "2611.34486", "category": "quant-ph", "title": "Resource theory of pi-ordered imaginarity and its resource quantifiers", "abstract": "Conventional resource theory of quantum imaginarity takes real density matrices as free states without ordering constraints on their diagonal populations. Motivated by the role of population ordering in the incoherent ergotropy of quantum batteries and the recently proposed framework of $\\pi$-ordered coherence, we develop the resource theory of $\\pi$-ordered imaginarity. In this refined framework, free states are required to be real in the reference basis and to obey a prescribed permutation order $\\pi$ for their diagonal populations. This theory thereby identifies two independent quantum resources: complex phases and population misordering, where the latter is inaccessible within the standard imaginarity resource theory. We characterize the structure of free states using majorization and the Schur-Horn theorem, define admissible $\\pi$-ordered real operations, and examine their intersection with $\\pi$-ordered incoherent operations. We further construct resource quantifiers for the $\\pi$-ordered imaginarity based on relative entropy, fidelity and robustness, and derive inequalities relating the robustness of $\\pi$-ordered imaginarity and that of $\\pi$-ordered coherence. The present framework generalizes the standard resource theory of imaginarity to incorporate population ordering and is naturally suited for thermodynamic settings such as quantum batteries.", "url": "https://arxiv.org/abs/2611.34486", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Yanjun Chu"}, {"name": "Yushan Ding"}, {"name": "Yuhang Xie"}, {"name": "Chenyang Cui"}, {"name": "Shao-Ming Fei"}], "featured_authors": [{"name": "Yanjun Chu"}, {"name": "Yushan Ding"}, {"name": "Yuhang Xie"}, {"name": "Chenyang Cui"}, {"name": "Shao-Ming Fei"}], "author_count": 5}, {"id": "2611.34520", "category": "quant-ph", "title": "Dynamics of a Charged Particle on a Conformal Helicoidal Surface", "abstract": "We study the classical and quantum motion of a charged particle on a conformal helicoidal surface embedded in four-dimensional Euclidean space. A uniform ambient magnetic field pulls back to a nonuniform surface field. The cyclic longitudinal coordinate permits an exact transverse reduction. The ordinary helicoid in the same axial field shares the effective potential and the turning points, while the conformal metric increases the physical period at matched energy and longitudinal momentum. We classify the single- and double-well regimes and obtain the exact transverse periods in the two double-well sectors. The periods diverge logarithmically at the separatrix, with twice the leading coefficient above the barrier as below it. The zero-field limit allows transverse escape, and the weak-twist limit is locally free but nonuniform across the surface. Intrinsic quantization gives an exact weighted transverse eigenvalue problem. Fixed-momentum eigenvalues test the harmonic approximation in a central well and resolve the tunneling splittings in a double well.", "url": "https://arxiv.org/abs/2611.34520", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Hassan Hassanabadi"}, {"name": "Abdullah Guvendi"}, {"name": "Georg Junker"}], "featured_authors": [{"name": "Hassan Hassanabadi"}, {"name": "Abdullah Guvendi"}, {"name": "Georg Junker"}], "author_count": 3}, {"id": "2611.34682", "category": "quant-ph", "title": "Slow mixing of Gibbs sampling for the quantum Curie-Weiss model", "abstract": "Hamiltonian evolution can spread local operators across a dense quantum magnet. We show that this global support does not remove the bottleneck to thermalization in the quantum Curie-Weiss model: at fixed low temperature and weak transverse field, the Chen-Kastoryano-Gilyen Gibbs sampler [arXiv: 2311.09207 ] has an exponentially large mixing-time lower bound. A dynamical quantum bottleneck theory that generalizes the classical notion of conductance has been proposed alongside existing frameworks that rely on spatial locality. We also give a complementary interpretation of slow mixing using an effective Fokker-Planck equation.", "url": "https://arxiv.org/abs/2611.34682", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Xiaoyang Huang"}], "featured_authors": [{"name": "Xiaoyang Huang"}], "author_count": 1}, {"id": "2611.34740", "category": "quant-ph", "title": "Unitary Synthesis with a Unary Tracker", "abstract": "This manuscript studies general unitary synthesis using unary-encoded ancillary register. Our first construction focuses on the $T$-cost of unitary synthesis. We maintain a unary register that coherently tracks the computational-basis label of the data. This allows Boolean lookups to use only CNOTs and shares the precision-dependent synthesis cost across the branches of each cosine-sine decomposition (CSD) factor. For a classically specified $n$-qubit unitary with $K$ mixing branches in its CSD, we obtain $T$-count $O(K+NL)$ using $N+O(L)$ clean ancillas, where $N=2^n$ and $L=n+\\log(1/\\epsilon)$. We also give a related construction that directly applies the unitary onto a unary register to implement disjoint branches in parallel. Combining this with the quantum Shannon decomposition gives space-depth volume $O(N^2)$ using arbitrary single-qubit gates and CNOTs, which matches the asymptotically optimal bound.", "url": "https://arxiv.org/abs/2611.34740", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Fred Sun"}], "featured_authors": [{"name": "Fred Sun"}], "author_count": 1}, {"id": "2611.34755", "category": "quant-ph", "title": "Fewer Parameters, Longer Runtimes: The Wall-Clock Cost of Hybrid Quantum Physics-Informed Neural Networks", "abstract": "While hybrid quantum-classical physics-informed neural networks (QCPINNs) are often described as efficient because they have fewer trainable parameters than classical PINNs, parameter count does not measure wall-clock cost. To examine this gap on a one-dimensional seawater temperature diffusion benchmark, with the quantum circuits simulated on a CPU, we time the four cumulative stages a PINN needs (the forward pass, the first- and second-order input gradients, and the PDE-loss parameter gradient) for a classical PINN, four hybrid configurations that differ in qubit count and circuit depth, and size-matched classical controls that share the hybrids' classical layers. We find that the hybrids are 14-56x slower than the classical PINN for the forward pass and 10-97x slower for the PDE-loss parameter gradient, and even against the size-matched controls, they remain 9-85x slower. Further, over the tested ranges, runtime increased approximately exponentially with qubit count, approximately linearly with circuit depth, and sub-linearly with batch size, while for the circuit-only forward pass, a second simulator backend was 10-165x slower under the same calling pattern. Although the hybrids have 38-44% fewer parameters than the classical PINN, this reduction comes from their smaller classical layers, as the quantum circuit accounts for at most 2.5% of each hybrid's parameters. Yet parameter count failed to predict runtime even among the classical networks, since the size-matched controls, despite having fewer parameters than the classical PINN, run slower than it. Our conclusion is that fewer parameters did not mean lower cost: every hybrid took at least ten times longer than the classical PINN at every stage, and the gap grew quickly with the number of qubits.", "url": "https://arxiv.org/abs/2611.34755", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Leyan Lyu"}, {"name": "Shabnam Jabeen"}], "featured_authors": [{"name": "Leyan Lyu"}, {"name": "Shabnam Jabeen"}], "author_count": 2}, {"id": "2611.34768", "category": "quant-ph", "title": "The integrable Lie-Trotter-Suzuki decomposition for nonlinear dynamics: Efficient Hamiltonian simulation of the Stepanoff flow", "abstract": "We propose an efficient unitary numerical time integration strategy for nonlinear dynamical systems: the integrable Lie-Trotter-Suzuki decomposition (I-LTS). First, express the generator as a sum of integrable parts. Second, approximate the full evolution operator using a Lie-Trotter-Suzuki (LTS) decomposition of the desired approximation order in time step. The I-LTS construction ensures that the full evolution operator can be represented as a product of terms that each have an efficient explicit tensor product factorization that can be handled efficiently with tensor network and/or quantum block-encoding methods. Next, we apply this method to an important non-integrable point example of a dynamical system: the Stepanoff flow on the torus. First, we derive an efficient unitary quantum algorithm for simulating the Stepanoff flow that can be thought of as a unitary classical version of a quantum map. Then, we provide a detailed description of the encoding of the two-dimensional system into an efficient quantum circuit, including an efficient block-encoding for all required operators. An efficient Hamiltonian simulation algorithm is constructed using a sequence of alternating quantum Fourier transforms (QFT) and Quantum Signal Processing (QSP) circuits. Finally, the circuit is simulated using a numerical emulator of fault-tolerant quantum computers, and the results are found to be consistent with several alternative classical computational methods. While efficient, the need for Trotterization introduces fundamental complexity in requiring small enough time step for an accurate approximation and solving for the transfer operator requires one to confront the linear scaling of the advection operator with grid size.", "url": "https://arxiv.org/abs/2611.34768", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ilon Joseph"}, {"name": "Ivan Novikau"}, {"name": "Michael R. Montgomery"}, {"name": "Joanna Slawinska"}, {"name": "Dimitrios Giannakis"}], "featured_authors": [{"name": "Ilon Joseph"}, {"name": "Ivan Novikau"}, {"name": "Michael R. Montgomery"}, {"name": "Joanna Slawinska"}, {"name": "Dimitrios Giannakis"}], "author_count": 5}, {"id": "2611.34792", "category": "quant-ph", "title": "Monotone Crossing Lattices for Exact Binary Optimization Encodings on Rydberg Arrays", "abstract": "Programmable Rydberg-atom arrays realize maximum-weight independent set encoding on unit-disk graphs under the ideal blockade model, but embedding nonlocal interactions requires auxiliary atoms and limits the size of tractable instances. We introduce a four-state unit-disk crossing cell that couples directly to adjacent cells, with interfaces enforcing one-sided propagation: along occupied paths directed away from the diagonal, copy bits are nondecreasing. For the maximum-weight independent set problem, uniform cell weights guarantee that every ground state of the encoded instance decodes to an optimal solution of the original problem, even when local copies disagree. For binary quadratic objectives subject to pairwise Boolean constraints, every feasible optimum yields consistent active copies and a target weight given by an explicit constant offset minus the source objective. A rectangular variant of the architecture further encodes minimum set cover problem. Prior to constraint-induced site deletions, the full layout requires $2n^2 - n$ sites, halving the leading-order site count of a fixed complete-grid reference, while activity pruning yields an exact site count set by the propagation span. Across 18 paired benchmarks with independent ordering from a shared candidate pool, the layout reduces site counts by 12.1%-54.0%.", "url": "https://arxiv.org/abs/2611.34792", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Liyin Hu"}, {"name": "Shengminjie Chen"}, {"name": "Ran Miao"}, {"name": "Zhiyi Huang"}, {"name": "Xiaohan Shan"}, {"name": "Jialin Zhang"}, {"name": "Xiaoming Sun"}], "featured_authors": [{"name": "Liyin Hu"}, {"name": "Shengminjie Chen"}, {"name": "Ran Miao"}, {"name": "Xiaohan Shan"}, {"name": "Jialin Zhang"}, {"name": "Xiaoming Sun"}], "author_count": 7}, {"id": "2611.34871", "category": "quant-ph", "title": "Simultaneous computation of multiple excited states via double bracket flows", "abstract": "Efficient computation of excited states is essential for studying strongly correlated many-body systems and molecular electronic structure. In this work, we propose a framework for simultaneously simulating multiple excited states based on dynamical flows. The main idea is to exploit a common double bracket flow that drives different pure initial states toward different target excited states without such prior information. We establish a necessary condition for convergence and a sufficient condition for exponential convergence. We further develop two scheduling strategies: Chebyshev scheduling, which achieves optimal convergence near a fixed point but requires prior spectral information, and adaptive scheduling, which achieves comparable performance in numerical simulations without spectral information. Our results enable new classical and quantum algorithms for excited-state computation without prior preparation of lower-energy eigenstates.", "url": "https://arxiv.org/abs/2611.34871", "type": "数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Reyhaneh Aghaei Saem"}, {"name": "Mehrad Sahebi"}, {"name": "Zoë Holmes"}, {"name": "Yudai Suzuki"}], "featured_authors": [{"name": "Reyhaneh Aghaei Saem"}, {"name": "Mehrad Sahebi"}, {"name": "Zoë Holmes"}, {"name": "Yudai Suzuki"}], "author_count": 4}, {"id": "2611.34872", "category": "quant-ph", "title": "Bound magic in multi-qubit systems", "abstract": "Magic captures nonstabilizerness, a resource required for quantum computational speedups. We prove the existence of multi-qubit nonstabilizer states from which no pure magic can be distilled, even with arbitrarily many copies and rounds of stabilizer operations. Such bound magic states have previously been only known to exist in odd Hilbert-space dimensions, where positivity of discrete Wigner functions can be used analogously to the positive partial transpose (PPT) criterion for bound entanglement. We introduce a PPT analogue for magic in multi-qubit systems that is closed under tensor products and stabilizer operations and reduces to the stabilizer polytope for one and two qubits. This enables the proof of multi-qubit bound magic and the explicit construction of bound magic states for $n \\geq 3$ qubits.", "url": "https://arxiv.org/abs/2611.34872", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Jonas Kitzinger"}, {"name": "Jens Eisert"}, {"name": "Ravi Kunjwal"}], "featured_authors": [{"name": "Jonas Kitzinger"}, {"name": "Jens Eisert"}, {"name": "Ravi Kunjwal"}], "author_count": 3}, {"id": "2611.34883", "category": "quant-ph", "title": "Transition Path Sampling for Rare Events in Non-Markovian Open Quantum Systems", "abstract": "Rare transitions govern the dynamics of many open quantum systems, but their probabilities and rates are difficult to calculate. Transition path sampling (TPS) of quantum systems has so far been limited to Markovian, perturbative descriptions. Here, we formulate TPS for non-Markovian quantum state diffusion, which is exact for Gaussian baths, extending it to non-Markovian and strongly coupled open quantum systems. For normal-to-superradiant tunneling in the unbalanced open Dicke model, we determine probabilities down to $10^{-8}$ and rates beyond the reach of brute force.", "url": "https://arxiv.org/abs/2611.34883", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Ritesh Pant"}, {"name": "Kai Müller"}, {"name": "Tarun Gera"}, {"name": "Doran I. G. B. Raccah"}], "featured_authors": [{"name": "Ritesh Pant"}, {"name": "Kai Müller"}, {"name": "Tarun Gera"}, {"name": "Doran I. G. B. Raccah"}], "author_count": 4}, {"id": "2611.34889", "category": "quant-ph", "title": "The Price of Quantum Advantage in Computational Chemistry", "abstract": "As the fault-tolerant era approaches, the question shifts from ``is it possible'' to ``is it worthwhile.'' To assess practical quantum advantage against reliable classical baselines, we examine 26 benchmark instances including FeMoco, iron-sulfur clusters, cytochrome P450, and ruthenium catalysts using two selected configuration interaction solvers, SHCI and TrimCI. Comparing classical workloads with fault-tolerant resource estimates, we calculate the break-even whole-QPU hourly price. Even at an optimistic price of US\\$7{,}000 per whole-QPU hour, and with mid-range CPU clusters, classical computation remains cheaper for six of seven systems. FeMoco alone remains sensitive to the classical method and extrapolation strategy. Wavefunction analysis further reveals how orbital choice affects the determinant support required for target-state overlap in quantum phase estimation (QPE). Our results highlight the importance of reliable classical references and trial-state characterization, and quantify the economic conditions under which quantum computing can become competitive with classical alternatives.", "url": "https://arxiv.org/abs/2611.34889", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Haejung Koh"}, {"name": "Katerina Gratsea"}, {"name": "Hao Zhang"}, {"name": "Matthew Otten"}], "featured_authors": [{"name": "Haejung Koh"}, {"name": "Katerina Gratsea"}, {"name": "Hao Zhang"}, {"name": "Matthew Otten"}], "author_count": 4}, {"id": "2611.34909", "category": "quant-ph", "title": "The thermodynamic budget of objectivity", "abstract": "An event becomes a fact when enough independent records of it exist such that no operation is possible that leaves all observers ignorant of it again. Records are physical, and creating, keeping, and destroying them have thermodynamic costs. We compute these costs exactly in a minimal broadcast model with a driven central qubit writing records into $N$ initially thermal registers, with work sources and baths at temperature $T$. The basic arguments for the operations are outlined here, with full treatment in the text. Creation of one event record at redundancy $R$ and information deficit $\\delta$ requires work $W \\ge R\\, k_\\mathrm{B}T \\ln 2\\, (1-\\delta) H(\\varepsilon)$, linear in redundancy at the Landauer coefficient. Recording in a basis misaligned by $\\theta$ with the einselecting interaction fails at a critical angle, $\\theta_c = 2\\arcsin\\sqrt{H_2^{-1}(\\delta)}$, beyond which objectivity is unreachable at any work, and below $\\theta_c$ the optimal work is a closed form in the pointer basis that minimizes the work of objectivity. Reducing objectivity is impossible at any work with access to fewer than $R - R_{\\min} + 1$ records, while work protects nothing if given access. Inter-record redundancy is extractable free energy and erasing the accessed records yields a net gain of work beyond the first copy. The second law constrains the destruction of the correlation: erasing a fact from a sector an adversary controls dissipates at least the mutual information erased, but a consolidation dissipates nothing. Records in re-thermalizing media are nonequilibrium steady states, and the minimal power to maintain a record at $(R,\\delta)$ is the known two-state driving bound evaluated at the record-quality boundary.", "url": "https://arxiv.org/abs/2611.34909", "type": "理论+数值", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Wonyong Chung"}], "featured_authors": [{"name": "Wonyong Chung"}], "author_count": 1}, {"id": "2611.34916", "category": "quant-ph", "title": "Complementary mechanisms of critical quantum metrology", "abstract": "Critical metrology conventionally exploits enhanced susceptibility to a system parameter near a phase transition. Here we identify a complementary mechanism for critically enhanced estimation of intrinsic system parameters via suppressed quantum noise rather than enhanced response. We demonstrate both mechanisms in coherently radiating spin states (CRSS)-correlated states of $N$ spin-$1/2$ particles defined as asymptotic eigenstates of the collective-spin lowering operator with complex eigenvalue $r e^{-i\\varphi}$. At the critical value $r=1$, CRSS exhibit a second-order transition. We show that near criticality, estimation of $r$ benefits from enhanced susceptibility despite increased noise, whereas estimation of $\\varphi$ benefits from suppressed quantum noise without enhanced response. Remarkably, both yield the same estimation error $\\sim N^{-2/3}$, improving over the standard quantum limit $N^{-1/2}$. For $\\varphi$, this establishes quantum-enhanced metrology of phases intrinsic to the critical system, rather than phases externally encoded by interferometry. We demonstrate these results for CRSS realizations in both dissipative (superradiant) and Hamiltonian (Ising) systems relevant to cavity QED and trapped ions, where fast preparation of CRSS is shown possible thanks to gap opening. Applications to metrology of coupling rates and phases or optical lengths are discussed.", "url": "https://arxiv.org/abs/2611.34916", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Nikita Leppenen"}, {"name": "Shaked Levy"}, {"name": "Ephraim Shahmoon"}], "featured_authors": [{"name": "Nikita Leppenen"}, {"name": "Shaked Levy"}, {"name": "Ephraim Shahmoon"}], "author_count": 3}, {"id": "2611.34921", "category": "quant-ph", "title": "Bound Entanglement with Negative Partial Transpose Exists", "abstract": "We show that the Werner state $\\rho = (23 I - 3\\,\\mathrm{SWAP})/1448$ on $\\mathbb{C}^8 \\otimes \\mathbb{C}^8$ has a negative partial transpose and is bound entangled: no LOCC protocol can distill entanglement from any number of copies of $\\rho$, and even with separable operations the fidelity of a two-qubit output with a Bell state never exceeds $(1+\\sqrt{2})/4 \\approx 0.604$. It follows that distillable entanglement is neither additive nor convex.", "url": "https://arxiv.org/abs/2611.34921", "type": "理论", "summary": "中文摘要自动翻译失败，请展开查看英文原文。", "authors": [{"name": "Islam Faisal"}], "featured_authors": [{"name": "Islam Faisal"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
