esults imply similar obstructions for quantum error correction for erasure channels.", "url": "https://arxiv.org/abs/2610.00441", "type": "理论", "summary": "秘密共享在整个密码学中无处不在。所有可能的访问结构在经典上都是可行的，并且在阈值访问结构的情况下，协议甚至非常有效。然而，当转移到量子环境时，不可克隆定理表明许多访问结构是不可能的。事实上，不可克隆准确地表征了可行性：对于阈值，当且仅当阈值 $t$ 严格大于 $n/2$ 时，量子秘密共享才是可能的。在这项工作中，我们提出了一种量子秘密共享（QSS）的变体，其中提供了两个或多个相同的输入状态副本，但只需要输出来恢复一个副本。这一概念规避了简单的单拷贝非克隆障碍，尽管自然的 $k$ 拷贝泛化仍然会带来更温和的障碍。对于使用 $k$ 副本的阈值，无克隆意味着每当 $t\\leq n/(k+1)$ 时 QSS 是不可能的。人们很容易假设，非克隆仍然是多拷贝案例的确切特征。然而，我们表明事实并非如此。\n\n我们给出了积极的结果，表明多个副本允许稍微超出单副本阻塞：对于阈值，只要$t>(n-k+1)/2$，我们就构建 QSS。另一方面，我们给出了一种新的障碍，称为“团路径障碍”，它适用于任意访问结构。对于阈值，它表明只要 $t\\leq (n-1)/k$，QSS 是不可能的。我们的上限和下限完全匹配 $k=2$。我们的两个结果都利用了与从访问结构派生的某些图的 $k$-可着色性的连接。我们将缩小 $k\\geq 3$ 副本的差距作为未来工作的一个令人着迷的方向。秘密共享与纠错密切相关，在多副本设置中也可以考虑这一点。我们的结果意味着擦除通道的量子纠错存在类似的障碍。", "authors": [{"name": "Steven Chien"}, {"name": "Ishani Mukherjee"}, {"name": "Mark Zhandry"}], "featured_authors": [{"name": "Steven Chien"}, {"name": "Ishani Mukherjee"}, {"name": "Mark Zhandry"}], "author_count": 3}, {"id": "2610.00442", "category": "quant-ph", "title": "Robust classical and quantum communication over almost-iid channels", "abstract": "The independent and identically distributed (iid) paradigm for asymptotic communication through quantum channels describes $n$ uses of a channel $\\Phi$ by $\\Phi^{\\otimes n}$. Since exact tensor-power behaviour is an idealization, we ask whether the asymptotic capacities of $\\Phi$ remain achievable for channel sequences that are almost-iid along $\\Phi$. We consider sequences of Choi-almost-iid channels whose normalized Choi states are Mazzola-Sutter-Renner (MSR) almost-iid along the normalized Choi state of $\\Phi$, with defect parameters $r_n=o(n)$. In Renner's exponential de Finetti theorem for quantum states, almost-iid states appear in the approximating mixture and motivate the MSR almost-iid class. Choi-almost-iid channels play the corresponding role in an exponential de Finetti theorem for quantum channels established in a companion paper. In this paper, we prove that the universal unassisted classical and quantum capacities of the class of Choi-almost-iid channels along $\\Phi$ equal those of the channel $\\Phi$. Here universality is within this class: for each rate below the relevant capacity, a code sequence depending on $\\Phi$ and the rate, but not on the particular channel sequence, achieves vanishing error for every sequence in the class.", "url": "https://arxiv.org/abs/2610.00442", "type": "理论", "summary": "通过量子通道进行渐近通信的独立同分布 (iid) 范式描述了 $n$ 对通道 $\\Phi$ 的使用，$\\Phi^{\\otimes n}$。由于精确的张量幂行为是一种理想化，我们询问对于沿着 $\\Phi$ 几乎独立同分布的通道序列，$\\Phi$ 的渐近能力是否仍然可以实现。我们考虑 Choi 几乎独立同分布通道的序列，其归一化 Choi 状态为 Mazzola-Sutter-Renner (MSR) 几乎独立同分布，沿着归一化 Choi 状态 $\\Phi$，缺陷参数为 $r_n=o(n)$。在 Renner 量子态指数 de Finetti 定理中，近似独立同分布状态出现在近似混合物中，并激发了 MSR 近似独立同分布类。 Choi 几乎独立同分布通道在另一篇论文中建立的量子通道指数 de Finetti 定理中发挥着相应的作用。在本文中，我们证明沿 $\\Phi$ 的 Choi 几乎独立同分布通道类的通用无辅助经典和量子容量等于通道 $\\Phi$ 的通用容量。\n\n这里，通用性在此类中：对于低于相关容量的每个速率，依赖于$\\Phi$和速率而不是特定信道序列的代码序列实现了该类中每个序列的误差消失。", "authors": [{"name": "Liuhang Ye"}, {"name": "Bjarne Bergh"}, {"name": "Nilanjana Datta"}], "featured_authors": [{"name": "Liuhang Ye"}, {"name": "Bjarne Bergh"}, {"name": "Nilanjana Datta"}], "author_count": 3}, {"id": "2610.00464", "category": "quant-ph", "title": "Clifford-hierarchy stabilizer formalism with applications to twisted quantum doubles", "abstract": "Recent work has shown that quantum double models can be used to circumvent the Bravyi-Koenig bound. In particular, this is achieved through code-switching protocols in which non-Pauli stabilizer phases appear as intermediate codes. We introduce the $X\\mathcal C^{(k)}_d$ stabilizer formalism, which generalizes the Pauli stabilizer formalism by combining Pauli-$X$ operators with diagonal operators drawn from a fixed level $k$ of the Clifford hierarchy on prime-dimensional qudits. This yields a natural class of beyond-Pauli stabilizer models, including many twisted quantum double phases. We classify a large class of these $X\\mathcal C^{(k)}_d$ stabilizer states, showing that they are uniform superpositions over affine-linear subspaces with diagonal phases. In particular, when the stabilizers of a state require operators from level $k$ of the Clifford hierarchy, we show that the diagonal gates required to produce the phases in the wavefunction sit one level higher. We further show that every 2D twisted quantum double ${\\cal D}^\\omega(\\mathbb{Z}_p^n)$ with $\\omega$ a product of type-III cocycles and $p$ an odd prime admits a realization using only Clifford ($k=2$) stabilizers, and we conjecture that phases where $\\omega$ contains a type-I or type-II cocycle require level-$p$ Clifford-hierarchy stabilizers for $p$-dimensional qudits. Finally, we demonstrate that a pair of qudit toric codes may be deterministically prepared in a logical magic state by measuring $X\\mathcal C^{(k)}_d$ stabilizers. Together, these results provide a concrete stabilizer framework for topological codes beyond Pauli stabilizer models and their logical gates.", "url": "https://arxiv.org/abs/2610.00464", "type": "理论", "summary": "最近的工作表明，量子双模型可以用来规避 Bravyi-Koenig 界限。特别是，这是通过代码转换协议来实现的，其中非保利稳定相作为中间代码出现。我们引入了 $X\\mathcal C^{(k)}_d$ 稳定器形式主义，它通过将 Pauli-$X$ 运算符与从素数维量子点上的 Clifford 层次结构的固定级别 $k$ 中提取的对角运算符相结合来推广泡利稳定器形式主义。这产生了一类自然的超泡利稳定器模型，包括许多扭曲的量子双相。我们对一大类 $X\\mathcal C^{(k)}_d$ 稳定器状态进行分类，表明它们是具有对角相位的仿射线性子空间的均匀叠加。特别是，当状态的稳定器需要 Clifford 层次结构 $k$ 级别的运算符时，我们表明产生波函数中的相位所需的对角门位于更高的级别。\n\n我们进一步表明，每个二维扭曲量子双 ${\\cal D}^\\omega(\\mathbb{Z}_p^n)$ 以及 $\\omega$ 是 III 型余环的乘积，$p$ 是奇素数，都承认仅使用 Clifford ($k=2$) 稳定器即可实现，并且我们推测 $\\omega$ 包含 I 型或 II 型余环的相需要级别 $p$ Clifford 层次稳定器$p$维量子。最后，我们证明通过测量 $X\\mathcal C^{(k)}_d$ 稳定器，可以在逻辑魔法状态下确定性地准备一对 qudit toric 代码。总之，这些结果为泡利稳定器模型及其逻辑门之外的拓扑代码提供了一个具体的稳定器框架。", "authors": [{"name": "Christopher Fechisin"}, {"name": "Kieran Cooney"}, {"name": "Mathi Raja"}, {"name": "Victor V. Albert"}, {"name": "Dominic J. Williamson"}, {"name": "Kyle Kawagoe"}, {"name": "Seth Musser"}], "featured_authors": [{"name": "Christopher Fechisin"}, {"name": "Kieran Cooney"}, {"name": "Mathi Raja"}, {"name": "Dominic J. Williamson"}, {"name": "Kyle Kawagoe"}, {"name": "Seth Musser"}], "author_count": 7}, {"id": "2610.00469", "category": "quant-ph", "title": "Factor Code Networks", "abstract": "For a quantum code defined by an isometry $T:H_{\\rm code} \\to H_{\\rm phys}$, an operator map is a *-homomorphism $\\varphi: B(H_{\\rm code}) \\to B(H_{\\rm phys})$ from the space of operators on the logical Hilbert space to the space of operators on the physical Hilbert space satisfying $\\varphi({\\cal O}) T = T {\\cal O}$ for every operator ${\\cal O}$ on $H_{\\rm code}$. This can additionally be taken to be unital $\\varphi(I_{code}) = I_{phys}$ if and only if $\\dim H_{\\rm code}$ divides $\\dim H_{\\rm phys}$. In this case, $\\varphi(B(H_{\\rm code})$ is a von Neumann factor subalgebra of $B(H_{\\rm phys})$ and we call the pair $(T,\\varphi)$ a {\\it factor code}. A code network is a family of Hilbert spaces $\\{{\\cal H}_i\\}$ indexed by a partially ordered set with isometries $T_{ji}:{\\cal H}_i \\to {\\cal H}_j$ for $i < j$ satisfying $T_{kj} T_{ji} = T_{ki}$ for $i < j < k$. In this paper, we ask when this can be promoted to a {\\it factor code network} by defining unital operator maps $\\varphi_{ji}$ so that $(T_{ji}, \\varphi_{ji})$ is a factor code and $\\varphi_{kj} \\varphi_{ji} = \\varphi_{ki}$. We show that the divisibility conditions on Hilbert space dimensions are sufficient for any code network with a tree structure but not in general. For a diamond-shaped network, we show that promotion is possible if and only if the principle angles between $T_{42} H_2$ and $T_{43} H_3$ all have multiplicity divisible by $H_1$. For incomparable $i_1,i_2 < j$, we characterize when $\\varphi_{j i_1} (B(H_{i_1}))$ and $\\varphi_{j i_2} (B(H_{i_2}))$ commute, when they generate all of $B(H_j)$, and when they intersect only on multiples of the identity. For $i < j_1,j_2 < k$, we characterize when $\\varphi_{k j_1} (B(H_{j_1})) \\cap \\varphi_{k j_2} (B(H_{j_2})) = \\varphi_{k i} (B(H_{i}))$ and when these algebras together with $B(H_k)$ form a nondegenerate commuting square.", "url": "https://arxiv.org/abs/2610.00469", "type": "理论", "summary": "对于由等距 $T:H_{\\rm code} \\to H_{\\rm phys}$ 定义的量子码，算子映射是 *-同态 $\\varphi: B(H_{\\rm code}) \\to B(H_{\\rm phys})$ 从逻辑希尔伯特空间上的算子空间到物理希尔伯特空间上的算子空间，满足 $\\varphi({\\cal O}) T = T {\\cal O}$ 对于 $H_{\\rm 代码}$ 上的每个运算符 ${\\cal O}$。当且仅当 $\\dim H_{\\rm code}$ 除以 $\\dim H_{\\rm phys}$ 时，这还可以被视为单位 $\\varphi(I_{code}) = I_{phys}$。在这种情况下，$\\varphi(B(H_{\\rm code})$ 是 $B(H_{\\rm phys})$ 的冯诺依曼因子子代数，我们将一对 $(T,\\varphi)$ 称为 {\\it 因子代码}。代码网络是一系列希尔伯特空间 $\\{{\\cal H}_i\\}$，由具有等距 $T_{ji}:{\\cal 的偏序集索引H}_i \\to {\\cal H}_j$ for $i < j$ 满足 $T_{kj} T_{ji} = T_{ki}$ for $i < j < k$ 在本文中，我们询问何时可以通过定义单位算子映射 $\\varphi_{ji}$ 将其提升为 {\\it 因子代码网络}，使得 $(T_{ji}, \\varphi_{ji})$ 是因子代码，而 $\\varphi_{kj} 。 \\varphi_{ji} = \\varphi_{ki}$。\n\n我们证明，希尔伯特空间维度上的可分性条件对于任何具有树结构的代码网络来说是足够的，但一般情况下是不够的。对于菱形网络，我们证明当且仅当 $T_{42} H_2$ 和 $T_{43} H_3$ 之间的主角都具有可被 $H_1$ 整除的重数时，提升才是可能的。对于不可比较的 $i_1,i_2 < j$，我们表征 $\\varphi_{j i_1} (B(H_{i_1}))$ 和 $\\varphi_{j i_2} (B(H_{i_2}))$ 通勤、何时生成所有 $B(H_j)$ 以及何时仅在恒等的倍数上相交。对于 $i < j_1,j_2 < k$，我们描述何时 $\\varphi_{k j_1} (B(H_{j_1})) \\cap \\varphi_{k j_2} (B(H_{j_2})) = \\varphi_{k i} (B(H_{i}))$ 以及何时这些代数与 $B(H_k)$ 一起形成非简并交换正方形。", "authors": [{"name": "Abhisek Sahu"}, {"name": "Jeremy van der Heijden"}, {"name": "Mark Van Raamsdonk"}, {"name": "Rana Zibakhsh"}], "featured_authors": [{"name": "Abhisek Sahu"}, {"name": "Jeremy van der Heijden"}, {"name": "Mark Van Raamsdonk"}, {"name": "Rana Zibakhsh"}], "author_count": 4}, {"id": "2610.00494", "category": "quant-ph", "title": "Causal Trade-Offs in Superluminal Extensions of Relativity. A no-go theorem", "abstract": "Extensions of relativity that include superluminal reference frames have recently been proposed by Dragan and Ekert as a way to reconcile relativistic symmetry with quantum uncertainty. In this work, we develop a causal modelling framework to formally study this proposal and prove a no-go theorem demonstrating that a theory permitting superluminal reference frames can avoid superluminal signalling only if it severely constrains which spacetime regions are accessible to operational protocols, if the choice of reference frame has observable consequences or if free variables do not exist or their existence depends on the reference frame. Crucially, our result goes beyond the familiar intuition that superluminal transformations may lead to superluminal signalling; our no-go result shows that Dragan and Ekert's proposal of introducing objective uncertainty does not, by itself, eliminate this conflict. In fact, because superluminal signalling might instead be avoided by relaxing other fundamental assumptions in the presence of superluminal reference frames, the proposed objective uncertainty may not be necessary at all. Our results clarify the limitations of uncertainty-based resolutions and the causal trade-offs faced by superluminal extensions of relativity.", "url": "https://arxiv.org/abs/2610.00494", "type": "理论", "summary": "德拉甘和埃克特最近提出了包括超光速参考系在内的相对论扩展，作为调和相对论对称性与量子不确定性的一种方法。在这项工作中，我们开发了一个因果建模框架来正式研究这一提议，并证明一个不可行定理，证明允许超光速参考系的理论只有在严格限制操作协议可访问的时空区域、参考系的选择具有可观察的后果或者自由变量不存在或其存在依赖于参考系的情况下才能避免超光速信号。至关重要的是，我们的结果超越了人们熟悉的直觉，即超光速转变可能会导致超光速信号传递。我们的失败结果表明，德拉甘和埃克特引入客观不确定性的提议本身并不能消除这种冲突。事实上，因为在超光速参考系存在的情况下，可以通过放宽其他基本假设来避免超光速信号，所以所提出的客观不确定性可能根本没有必要。\n\n我们的结果阐明了基于不确定性的解决方案的局限性以及相对论的超光速扩展所面临的因果权衡。", "authors": [{"name": "Amrapali Sen"}, {"name": "Matthias Salzger"}, {"name": "V. Vilasini"}], "featured_authors": [{"name": "Amrapali Sen"}, {"name": "Matthias Salzger"}, {"name": "V. Vilasini"}], "author_count": 3}, {"id": "2610.00502", "category": "quant-ph", "title": "Quantum Algorithms for OPI Variants Beyond Locality and Classical Decodability", "abstract": "Regev's reduction is a quantum algorithmic framework for finding codewords satisfying nonlinear constraints by decoding the dual code. To date, applications that have not been dequantized have relied on efficient classical decoders and coordinate-wise constraints specifying a set of allowed values for each coordinate. We push past these two restrictions separately via two separate contributions. Our first contribution uses a quantum decoder to find solutions $\\mathbf{y}\\in(\\mathbb{F}_q\\setminus\\{0\\})^m$ to $\\mathbf{B}\\mathbf{y}=0$, where $\\mathbf{B}\\in\\mathbb{F}_q^{n\\times m}$. For fixed prime $q>2$, Chen, Liu, and Zhandry (Eurocrypt 2022) solve this problem for random matrices with $m=\\Omega(n^2)$, a regime now covered by classical algorithms. We adapt their template to codes (spanned by the rows of $\\mathbf{B}$) with a ``two-fold multiplication property'': the coordinate-wise products of pairs of codewords span a space of dimension much smaller than $m$. Our second contribution retains classical decoding but allows global constraints on symbol frequencies. We study ``histogram-local'' constraints, which specify the allowed numbers of occurrences of each symbol. For broad families of these constraints, we show that a uniformly random satisfying vector remains satisfying with constant probability after resampling a uniformly random coordinate. This stability provides sufficient Fourier mass at decodable Hamming weights, yielding efficient quantum algorithms for variants of optimal polynomial intersection (OPI).", "url": "https://arxiv.org/abs/2610.00502", "type": "理论+数值", "summary": "Regev 的约简是一种量子算法框架，用于通过解码对偶码来查找满足非线性约束的码字。迄今为止，尚未反量化的应用程序依赖于高效的经典解码器和为每个坐标指定一组允许值的坐标约束。我们通过两个单独的贡献分别突破这两个限制。我们的第一个贡献使用量子解码器来找到 $\\mathbf{y}\\in(\\mathbb{F}_q\\setminus\\{0\\})^m$ 到 $\\mathbf{B}\\mathbf{y}=0$ 的解，其中 $\\mathbf{B}\\in\\mathbb{F}_q^{n\\times m}$。对于固定素数 $q>2$，Chen、Liu 和 Zhandry (Eurocrypt 2022) 使用 $m=\\Omega(n^2)$ 解决随机矩阵的问题，该机制现在已被经典算法涵盖。我们将他们的模板调整为具有“两倍乘法属性”的代码（由 $\\mathbf{B}$ 的行跨越）：码字对的坐标乘积跨越的维度远小于 $m$ 的空间。我们的第二个贡献保留了经典解码，但允许对符号频率进行全局限制。我们研究“直方图局部”约束，它指定每个符号允许出现的次数。\n\n对于这些约束的广泛族，我们表明，在对均匀随机坐标进行重新采样后，均匀随机满足向量仍然满足恒定概率。这种稳定性在可解码的汉明权重下提供了足够的傅里叶质量，从而为最优多项式交集 (OPI) 的变体产生高效的量子算法。", "authors": [{"name": "Seyoon Ragavan"}, {"name": "Noah Shutty"}], "featured_authors": [{"name": "Seyoon Ragavan"}, {"name": "Noah Shutty"}], "author_count": 2}, {"id": "2610.00504", "category": "quant-ph", "title": "Graph Neural Post-selection for Quantum Error Correction", "abstract": "Post-selection improves the logical reliability of quantum computation by rejecting shots which are likely to result in logical failure. We introduce graph neural networks that predict decoder failure without additional decoder executions, using only syndromes, and for high-rate quantum low-density parity-check (qLDPC) codes, existing belief-propagation posteriors. We evaluate rotated surface and bivariate bicycle (BB) code memories under uniform depolarising circuit-level noise. Retaining 90% of shots gives approximately 3700x and 740x reductions in logical error rates for [[72,12,6]] and [[144,12,12]] BB codes at realistic physical error rates. For the distance 5 surface code at physical noise p=0.003, our neural post-selector achieves logical error suppression comparable to the leading complementary gap method without running the decoder.", "url": "https://arxiv.org/abs/2610.00504", "type": "数值", "summary": "后选择通过拒绝可能导致逻辑失败的镜头来提高量子计算的逻辑可靠性。我们引入了图神经网络，无需额外的解码器执行，仅使用综合症，并且对于高速量子低密度奇偶校验（qLDPC）码，可以使用现有的置信传播后验来预测解码器故障。我们在均匀去极化电路级噪声下评估旋转表面和双变量自行车（BB）代码存储器。在实际物理错误率下，保留 90% 的镜头可将 [[72,12,6]] 和 [[144,12,12]] BB 代码的逻辑错误率降低约 3700 倍和 740 倍。对于物理噪声 p=0.003 的距离 5 表面代码，我们的神经后选择器在不运行解码器的情况下实现了与领先的互补间隙方法相当的逻辑错误抑制。", "authors": [{"name": "Conor Carty"}, {"name": "Tamas Noszko"}, {"name": "Joschka Roffe"}, {"name": "Roberto Bondesan"}], "featured_authors": [{"name": "Conor Carty"}, {"name": "Tamas Noszko"}, {"name": "Joschka Roffe"}, {"name": "Roberto Bondesan"}], "author_count": 4}, {"id": "2610.00505", "category": "quant-ph", "title": "Walshness: an intrinsic neural-network representability metric for quantum states", "abstract": "Neural quantum states (NQS) have emerged as powerful representations of quantum states with rapidly expanding applications across quantum many-body physics. Yet our understanding of when neural networks can efficiently represent physical quantum states remains limited, in part due to the nonlinear parameterization of NQS, the intricate sign structure of quantum states, and the sensitive dependence on basis choice. We introduce Walshness, a complexity metric of a quantum state which quantifies whether it admits a compact neural-network representation. We rigorously prove that a general quantum many-body state admits an efficient NQS representation if and only if it has bounded Walshness for various NQS architectures. We provide an algorithm for finding the optimal basis by minimizing the energy of a corresponding classical spin model. This allows us to empirically improve the learnability of various physical quantum states, including ground states of the transverse-field Ising model and mixed-field toric code, often reducing infidelity by orders of magnitude, and recovers and generalizes the basis choice given by the well-known Marshall sign rule in frustrated antiferromagnets. Our results provide an intrinsic complexity metric for quantum states with provable connections to their neural-network representability.", "url": "https://arxiv.org/abs/2610.00505", "type": "理论+数值", "summary": "神经量子态（NQS）已经成为量子态的强大表示，在量子多体物理领域的应用迅速扩展。然而，我们对神经网络何时能够有效表示物理量子态的理解仍然有限，部分原因是 NQS 的非线性参数化、量子态复杂的符号结构以及对基选择的敏感依赖性。我们引入了 Walshness，一种量子态的复杂性度量，用于量化它是否接受紧凑的神经网络表示。我们严格证明，当且仅当通用量子多体态对于各种 NQS 架构具有限制 Walshness 时，它才允许有效的 NQS 表示。我们提供了一种通过最小化相应经典自旋模型的能量来找到最佳基础的算法。这使我们能够凭经验提高各种物理量子态的可学习性，包括横向场伊辛模型和混合场环面码的基态，通常可以将不忠实性减少几个数量级，并恢复和推广受挫反铁磁体中著名的马歇尔符号规则给出的基础选择。\n\n我们的结果提供了量子态的内在复杂性度量，并与其神经网络可表示性有可证明的联系。", "authors": [{"name": "Nisarga Paul"}, {"name": "Kehuang Chen"}, {"name": "Jessica K. Jiang"}, {"name": "Haimeng Zhao"}, {"name": "Di Luo"}], "featured_authors": [{"name": "Nisarga Paul"}, {"name": "Kehuang Chen"}, {"name": "Jessica K. Jiang"}, {"name": "Haimeng Zhao"}, {"name": "Di Luo"}], "author_count": 5}, {"id": "2610.00506", "category": "quant-ph", "title": "Noisy Quantum Query Complexity via Fractional Block Sensitivity", "abstract": "We study quantum query complexity under several models of imperfect oracle access, and develop lower bounds through a common framework based on fractional block sensitivity (\\(\\fbs\\)). For a negligent oracle that applies the correct query with probability \\(1-p\\), we prove a lower bound in terms of \\(\\fbs(f,0^n)\\). We also show, perhaps surprisingly, that negligence need not destroy quantum speedups: any function \\(f\\) can be transformed into a partial function \\(f'\\) whose negligent query complexity essentially preserves the quantum query complexity of \\(f\\). This gives partial functions with exponential quantum speedups even under negligent queries, and in particular rules out a general lower bound in terms of \\(\\fbs(f)\\) for partial functions in this model. For two other models, we obtain general lower bounds in terms of \\(\\fbs(f)\\) for all Boolean functions. For hybrid algorithms using \\(Q\\) coherent and \\(C\\) classical queries, we prove the tradeoff \\(C+Q^2=\\Omega(\\fbs(f))\\). For an IID dephasing noisy model where each query dephases the query-index register at rate \\(p\\) independently, we prove \\(\\Omega\\!\\left(p\\,\\fbs(f)\\right)\\) queries are necessary. Finally, we introduce a broader family of time-varying dephasing models and identify a variational resource that is always lower bounded by \\(\\fbs(f)\\). Computing this resource reduces to a convex optimization problem, providing a simple way to derive lower bounds for new noise schedules. As applications, we recover the hybrid and IID dephasing bounds and determine the query complexity of unstructured search when the dephasing rate grows over time.", "url": "https://arxiv.org/abs/2610.00506", "type": "理论+数值", "summary": "我们研究了几种不完美预言机访问模型下的量子查询复杂性，并通过基于分数块敏感性 (\\(\\fbs\\)) 的通用框架开发下界。对于以概率 \\(1-p\\) 应用正确查询的疏忽预言机，我们用 \\(\\fbs(f,0^n)\\) 证明了下限。也许令人惊讶的是，我们还表明，疏忽不必破坏量子加速：任何函数 \\(f\\) 都可以转换为部分函数 \\(f'\\)，其疏忽的查询复杂性本质上保留了 \\(f\\) 的量子查询复杂性。即使在疏忽的查询下，这也为偏函数提供了指数量子加速，特别是排除了该模型中偏函数的一般下界 \\(\\fbs(f)\\) 。对于另外两个模型，我们获得所有布尔函数的一般下界 \\(\\fbs(f)\\)。对于使用\\(Q\\)相干查询和\\(C\\)经典查询的混合算法，我们证明了\\(C+Q^2=\\Omega(\\fbs(f))\\)的权衡。对于 IID 移相噪声模型，其中每个查询以 \\(p\\) 速率独立地移相查询索引寄存器，我们证明 \\(\\Omega\\!\\left(p\\,\\fbs(f)\\right)\\) 查询是必要的。\n\n最后，我们引入了更广泛的时变移相模型系列，并确定了始终以 \\(\\fbs(f)\\) 为下限的变分资源。计算此资源可简化为凸优化问题，提供一种简单的方法来导出新噪声调度的下限。作为应用，我们恢复混合和 IID 移相界限，并确定当移相率随时间增长时非结构化搜索的查询复杂性。", "authors": [{"name": "Mehil Agarwal"}, {"name": "Shravas Rao"}, {"name": "Fang Song"}], "featured_authors": [{"name": "Mehil Agarwal"}, {"name": "Shravas Rao"}, {"name": "Fang Song"}], "author_count": 3}, {"id": "2610.00517", "category": "quant-ph", "title": "Blind Unforgeability implies Plus-One Unforgeability", "abstract": "We prove that quantum blind-unforgeability implies quantum plus-one unforgeability, settling an open question in the literature. Since plus-one unforgeability is known not to imply blind-unforgeability, our result establishes that blind-unforgeability is \\emph{strictly stronger} than plus-one unforgeability in the quantum setting. The implication is proven using a new \\emph{smoothing} technique that coherently rescales the query histories of a quantum-query algorithm in a black-box manner. This enables us to transform any successful plus-one attacker into a blind-unforgeability attacker with only inverse-polynomial loss. Our proof represents a conceptual shift from merely extracting a useful query history as in earlier attempts, which we show inevitably fails in general, to first coherently reshaping how query histories interfere.", "url": "https://arxiv.org/abs/2610.00517", "type": "理论+数值", "summary": "我们证明量子盲不可伪造性意味着量子加一不可伪造性，解决了文献中的一个悬而未决的问题。由于已知加一不可伪造性并不意味着盲目不可伪造性，因此我们的结果表明，在量子环境中，盲目不可伪造性比加一不可伪造性\\emph{严格更强}。使用新的 \\emph{smoothing} 技术证明了这一含义，该技术以黑盒方式连贯地重新调整量子查询算法的查询历史。这使我们能够将任何成功的加一攻击者转变为仅具有逆多项式损失的盲目不可伪造性攻击者。我们的证明代表了一种概念上的转变，从像早期的尝试那样仅仅提取有用的查询历史记录（我们表明这些尝试通常不可避免地会失败），到首先连贯地重塑查询历史记录的干扰方式。", "authors": [{"name": "Mehil Agarwal"}, {"name": "Calliope S. Reimann"}, {"name": "Fang Song"}], "featured_authors": [{"name": "Mehil Agarwal"}, {"name": "Calliope S. Reimann"}, {"name": "Fang Song"}], "author_count": 3}, {"id": "2610.00520", "category": "quant-ph", "title": "Near-Optimal Ground-State Preparation without Controlled Hamiltonian Evolutions", "abstract": "Ground-state preparation, energy estimation, and property estimation are fundamental tasks in quantum simulation. Existing ground-state preparation algorithms achieve near-optimal complexity using block encodings or controlled Hamiltonian evolution, raising a natural question: is controlled Hamiltonian evolution necessary, or can the same scaling be attained in the weaker access model that provides access to only uncontrolled Hamiltonian evolution? We resolve this question by giving two algorithms that access the input Hamiltonian $H$ only through queries to $U_H$ and its inverse $U_H^\\dagger$, where $\\|H\\|\\le\\alpha_H$ and $\\tau=\\Theta(1/\\alpha_H)$. Given an input state with ground-state weight at least $\\eta$ and a spectral gap of $H$ of at least $\\gamma$, our first algorithm uses fresh copies of the input state and requires $\\widetilde O(\\alpha_H/(\\gamma\\eta))$ queries to $U_H$ and $U_H^\\dagger$, while our second algorithm uses coherent access to the input-state preparation unitary and its inverse to improve this complexity to $\\widetilde O(\\alpha_H/(\\gamma\\sqrt{\\eta}))$. The latter bound matches the known lower bound up to logarithmic factors, showing that algorithms with additional access to controlled Hamiltonian evolution cannot improve the query complexity for ground-state preparation beyond logarithmic factors. Both algorithms are based on a simple mechanism that we call the spectral descent principle, in which the algorithm starts from the input state $|\\psi\\rangle$ and progressively descends through the energy spectrum, moving closer to the ground state until the desired fidelity is reached. We also extend this framework to ground-state property and energy estimation and give explicit complexity guarantees for both tasks.", "url": "https://arxiv.org/abs/2610.00520", "type": "理论+数值", "summary": "基态准备、能量估计和性质估计是量子模拟中的基本任务。现有的基态准备算法使用块编码或受控哈密顿演化来实现接近最优的复杂性，这就提出了一个自然的问题：受控哈密顿演化是否必要，或者是否可以在仅提供对不受控哈密顿演化的访问的较弱访问模型中实现相同的缩放？我们通过给出两种算法来解决这个问题，它们仅通过查询 $U_H$ 及其逆 $U_H^\\dagger$ 来访问输入哈密顿量 $H$，其中 $\\|H\\|\\le\\alpha_H$ 和 $\\tau=\\Theta(1/\\alpha_H)$。给定基态权重至少为 $\\eta$ 且 $H$ 的谱间隙至少为 $\\gamma$ 的输入状态，我们的第一个算法使用输入状态的新副本，并需要 $\\widetilde O(\\alpha_H/(\\gamma\\eta))$ 对 $U_H$ 和 $U_H^\\dagger$ 进行查询，而我们的第二个算法使用对输入状态准备酉及其逆的相干访问，将复杂度提高到 $\\widetilde O(\\alpha_H/(\\gamma\\sqrt{\\eta}))$。\n\n后一个界限与已知的对数因子下限相匹配，表明具有额外访问受控哈密顿演化的算法无法将基态准备的查询复杂性提高到对数因子之外。这两种算法都基于一种简单的机制，我们称之为谱下降原理，其中算法从输入状态 $|\\psi\\rangle$ 开始，在能谱中逐渐下降，逐渐接近基态，直到达到所需的保真度。我们还将这个框架扩展到基态属性和能量估计，并为这两项任务提供了明确的复杂性保证。", "authors": [{"name": "Dhrumil Patel"}, {"name": "Steven T. Flammia"}, {"name": "Raul Garcia-Patron"}], "featured_authors": [{"name": "Dhrumil Patel"}, {"name": "Steven T. Flammia"}, {"name": "Raul Garcia-Patron"}], "author_count": 3}, {"id": "2610.00521", "category": "quant-ph", "title": "First-quantized quantum simulation with non-local potentials by matrix-product-state encoding", "abstract": "Quantum simulations based on first-quantized approaches can offer lower space and gate complexities than second-quantized approaches. The gate requirements for these simulations can be further reduced by employing pseudopotentials, a technique widely used in classical quantum chemistry calculations to decrease the number of simulated electrons. However, implementing pseudopotentials in quantum circuits remains challenging due to their non-local nature. In this study, we proposed a method to efficiently implement non-local potentials using matrix product state (MPS) encoding. MPS encoding allows us to efficiently implement a Trotter step operator with a circuit depth of $O(\\mathrm{deg}(V_{\\mathrm{loc}}) n^{\\mathrm{deg}(V_{\\mathrm{loc}})} + 8Lnn_{\\mathrm{atom}}\\chi^2 + 2n^2)$, where $\\mathrm{deg}(V_{\\mathrm{loc}})$ is the degree of the polynomial local potential, $n_{\\mathrm{atom}}$ is the number of atoms in the system, $L$ is the maximum number of projector functions across all atoms, and $n$ is the number of qubits used to represent the binary-encoded wave function in one-dimensional space. We demonstrated the effectiveness of this approach by applying it to a model of the ionization of a one-dimensional hydrogen atom driven by an ultrashort laser pulse. Our results showed that MPS encoding significantly reduces the required circuit depth compared to a direct unitary decomposition, providing a pathway for practical first-quantized simulations.", "url": "https://arxiv.org/abs/2610.00521", "type": "理论+数值", "summary": "基于第一量化方法的量子模拟可以提供比第二量化方法更低的空间和门复杂性。通过采用赝势可以进一步降低这些模拟的门要求，赝势是一种广泛用于经典量子化学计算中以减少模拟电子数量的技术。然而，由于赝势的非局部性质，在量子电路中实现赝势仍然具有挑战性。在本研究中，我们提出了一种使用矩阵乘积状态（MPS）编码有效实现非局部势的方法。 MPS 编码允许我们高效地实现电路深度为 $O(\\mathrm{deg}(V_{\\mathrm{loc}}) n^{\\mathrm{deg}(V_{\\mathrm{loc}})} + 8Lnn_{\\mathrm{atom}}\\chi^2 + 2n^2)$ 的 Trotter 步算子，其中 $\\mathrm{deg}(V_{\\mathrm{loc}})$ 是多项式局域势的次数，$n_{\\mathrm{atom}}$是系统中原子的数量，$L$是所有原子上投影函数的最大数量，$n$是用于表示一维空间中二进制编码波函数的量子位数量。\n\n我们通过将其应用于超短激光脉冲驱动的一维氢原子电离模型来证明该方法的有效性。我们的结果表明，与直接酉分解相比，MPS 编码显着减少了所需的电路深度，为实际的首次量化模拟提供了途径。", "authors": [{"name": "Kazuki Tsuoka"}, {"name": "Taichi Kosugi"}, {"name": "Masari Watanabe"}, {"name": "Hirofumi Nishi"}, {"name": "Yu-ichiro Matsushita"}], "featured_authors": [{"name": "Kazuki Tsuoka"}, {"name": "Taichi Kosugi"}, {"name": "Masari Watanabe"}, {"name": "Hirofumi Nishi"}, {"name": "Yu-ichiro Matsushita"}], "author_count": 5}, {"id": "2610.00525", "category": "quant-ph", "title": "Good Quantum Locally Testable Codes from Lossless Cubical Complexes", "abstract": "Sipser and Spielman constructed LDPC codes from either bipartite \\emph{spectral} expanders or one-sided \\emph{lossless} expanders. In higher dimensions, \\emph{spectral} expansion similarly played a central role in the constructions of asymptotically good classical LTCs and qLDPC codes by Dinur, Evra, Livne, Lubotzky, and Mozes and by Panteleev and Kalachev. Alternatively, Lin and Hsieh constructed classical LTCs and qLDPC codes from two-dimensional \\emph{lossless} cubical complexes. In this work we develop the higher-dimensional \\emph{lossless} approach. We do not construct the required high-dimensional lossless cubical complexes; rather, we investigate what their existence would imply. We associate with a high-dimensional cubical complex a \\emph{level chain complex}, whose chain groups are supported on the level sets of the Boolean cube rather than on its cells. Our main technical contribution is a clean local-to-global theorem for this structure: suitable one-dimensional lossless expansion in the directional graphs implies small-set coboundary expansion of the global level complex. As a consequence, sufficiently imbalanced, two-sided lossless four-dimensional cubical complexes give rise to asymptotically good quantum locally testable codes. We expect the local-to-global principle developed here to have further applications.", "url": "https://arxiv.org/abs/2610.00525", "type": "理论", "summary": "Sipser 和 Spielman 从二分 \\emph{spectral} 扩展器或单侧 \\emph{lossless} 扩展器构建了 LDPC 码。在更高维度中，\\emph{谱}展开同样在 Dinur、Evra、Livne、Lubotzky 和 ​​Mozes 以及 Panteleev 和 Kalachev 构造渐近良好的经典 LTC 和 qLDPC 码中发挥了核心作用。另外，Lin 和 Hsieh 从二维 \\emph{lossless} 立方复合体构建了经典的 LTC 和 qLDPC 码。在这项工作中，我们开发了更高维的 \\emph{lossless} 方法。我们不构造所需的高维无损立方复合体；相反，我们调查它们的存在意味着什么。我们将高维立方复合体与 \\emph{水平链复合体} 联系起来，其链组由布尔立方体的水平集而不是其单元支持。我们的主要技术贡献是针对该结构的一个清晰的局部到全局定理：有向图中合适的一维无损扩展意味着全局水平复合体的小集共边界扩展。\n\n因此，充分不平衡的两侧无损四维立方复合体产生了渐近良好的量子局部可测试代码。我们期望这里开发的局部到全局原则能够得到进一步的应用。", "authors": [{"name": "Itay Cohen"}, {"name": "Itai Leigh"}, {"name": "Assaf Reiner"}, {"name": "Amnon Ta-Shma"}, {"name": "Elad Tzalik"}], "featured_authors": [{"name": "Itay Cohen"}, {"name": "Itai Leigh"}, {"name": "Assaf Reiner"}, {"name": "Amnon Ta-Shma"}, {"name": "Elad Tzalik"}], "author_count": 5}, {"id": "2610.00527", "category": "quant-ph", "title": "Polynomial-time local-unitary equivalence of graph states", "abstract": "Local-unitary (LU) equivalence asks whether two quantum states differ only by independent changes of basis on their qubits. For graph states, whether this relation can be decided in polynomial time has remained open for over a decade. We give a deterministic algorithm that decides LU equivalence for graphs on $n$ labelled vertices in $\\widetilde O(n^{6.38})$ bit operations and constructs exact single-qubit unitaries whenever the states are equivalent. Building on Claudet and Perdrix's quasipolynomial algorithm, we replace the enumeration of vertex subsets by a compact system of constraints generated from pairs and triples. The remaining graph transformation is found by solving linear equations over the binary field. These new steps cost $\\widetilde O(n^5)$ bit operations; the inherited graph preprocessing sets the overall bound. We also count the local-Clifford (LC) classes of graph states within any LU class: their number is a power of two, computable within the same bound. For any given graph state, this decides whether single-qubit Clifford gates reach every graph state in its LU class, and supplies a counterexample when they do not. The method also decides LU equivalence of stabilizer codes encoding one logical qubit.", "url": "https://arxiv.org/abs/2610.00527", "type": "理论+数值", "summary": "局域酉 (LU) 等价询问两个量子态是否仅通过其量子位的基础的独立变化而有所不同。对于图状态，这种关系是否可以在多项式时间内决定，十多年来一直悬而未决。我们给出了一种确定性算法，可以在 $\\widetilde O(n^{6.38})$ 位运算中确定 $n$ 标记顶点上的图的 LU 等价性，并在状态相等时构造精确的单量子位酉。在 Claudet 和 Perdrix 的拟多项式算法的基础上，我们用由对和三元组生成的紧凑约束系统取代了顶点子集的枚举。剩下的图变换是通过求解二元域上的线性方程来找到的。这些新步骤花费 $\\widetilde O(n^5)$ 位运算；继承的图预处理设置了总体界限。我们还计算任何 LU 类中图状态的局部克利福德 (LC) 类：它们的数量是 2 的幂，可在同一范围内计算。对于任何给定的图状态，这决定单量子位 Clifford 门是否到达其 LU 类中的每个图状态，并在未到达时提供反例。\n\n该方法还决定编码一个逻辑量子位的稳定器代码的 LU 等价性。", "authors": [{"name": "Yuxuan Zhang"}], "featured_authors": [{"name": "Yuxuan Zhang"}], "author_count": 1}, {"id": "2610.00547", "category": "quant-ph", "title": "Unifying and Extending Strong Simulation of Quantum Circuits", "abstract": "We establish functional aggregate queries (FAQs) as a unifying language for exact classical simulation of quantum circuits. A circuit becomes a sum-product query: factors encode gates, internal wire variables are aggregated, and free boundary variables index transition amplitudes. The central insight is that distinct sources of simulation tractability can be exploited within the same InsideOut evaluation scheme. The query specifies what is computed; the evaluation plan, semiring, and representation of intermediate factors determine the cost. This view unifies structural and algebraic simulation guarantees. With explicit factor representations, FAQ evaluation recovers the treewidth bound for tensor-network contraction and yields finer sparsity-sensitive bounds via fractional covers. Over a formal phase semiring, compressed intermediate factors recover rank-width-based simulation for compatible quadratic phase representations. For Clifford circuits, affine-quadratic factors are closed under multiplication and marginalization and remain polynomial in size, yielding polynomial-time exact amplitude computation without any bounded-width assumption. Beyond these recoveries, the framework yields a new tractability criterion: tensor layout symmetry width. This parameter combines local cut-rank with separator symmetry through exact tree-tensor representations. We give a constructive evaluation bound and exhibit a circuit family with bounded tensor layout symmetry width but unbounded phase-graph rank-width and circuit line-graph treewidth. These results establish representation-aware FAQ evaluation as a common algorithmic foundation for classical simulation and a systematic route to new tractable regimes.", "url": "https://arxiv.org/abs/2610.00547", "type": "理论+数值", "summary": "我们建立功能聚合查询（FAQ）作为量子电路精确经典模拟的统一语言。电路变成了和积查询：因子对门进行编码，内部线变量被聚合，自由边界变量对转换幅度进行索引。核心观点是，可以在相同的 InsideOut 评估方案中利用不同的模拟易处理性来源。查询指定计算什么；评估计划、半环和中间因素的表示决定了成本。这种观点统一了结构和代数模拟保证。通过显式因子表示，FAQ 评估可以恢复张量网络收缩的树宽界限，并通过分数覆盖产生更精细的稀疏性敏感界限。在正式的相位半环上，压缩的中间因子恢复基于秩宽度的模拟，以实现兼容的二次相位表示。对于 Clifford 电路，仿射二次因子在乘法和边缘化下闭合，并且在大小上保持多项式，从而在没有任何有界宽度假设的情况下产生多项式时间精确幅度计算。\n\n除了这些恢复之外，该框架还产生了一个新的可处理性标准：张量布局对称宽度。该参数通过精确的树张量表示将局部割秩与分隔符对称性结合起来。我们给出了一个建设性的评估界限，并展示了一个具有有界张量布局对称宽度但无界相图秩宽度和电路线图树宽度的电路族。这些结果将表征感知常见问题解答评估确立为经典模拟的通用算法基础和新的易处理机制的系统途径。", "authors": [{"name": "Floris Geerts"}, {"name": "Rihan Hai"}, {"name": "Matthias Lanzinger"}, {"name": "Reinhard Pichler"}, {"name": "Emanuel Sallinger"}, {"name": "Daniel Unterberger"}], "featured_authors": [{"name": "Floris Geerts"}, {"name": "Rihan Hai"}, {"name": "Matthias Lanzinger"}, {"name": "Reinhard Pichler"}, {"name": "Emanuel Sallinger"}, {"name": "Daniel Unterberger"}], "author_count": 6}, {"id": "2610.00548", "category": "quant-ph", "title": "A polynomial-time classical sampler for noisy quantum circuits from statistical mechanics", "abstract": "Developing classical simulation algorithms for noisy quantum circuits is essential to delineating the limits of quantum advantage. Existing classical sampling approaches for general circuits require circuit depths to grow logarithmically with system size, so that noise drives the global output state close to a trivial state. Here we show that local accumulation of noise at a depth independent of system size is already sufficient. Specifically, we prove that any geometrically local circuit composed of unital operations and interspersed with single-qubit depolarizing noise of strength $p$ after $\\Omega(p^{-1} \\log p^{-1})$ depth can be approximately sampled from a polynomial-time classical computer. Our proof maps the output state of the circuit to a polymer model in statistical mechanics, and combines a convergent cluster expansion with hypercontractivity of the depolarizing channel.", "url": "https://arxiv.org/abs/2610.00548", "type": "理论+数值", "summary": "开发用于噪声量子电路的经典模拟算法对于描绘量子优势的极限至关重要。通用电路的现有经典采样方法要求电路深度随着系统尺寸呈对数增长，因此噪声驱动全局输出状态接近平凡状态。在这里，我们表明，与系统尺寸无关的深度处的噪声局部积累已经足够了。具体来说，我们证明了任何由单位运算组成的几何局部电路，并在 $\\Omega(p^{-1} \\log p^{-1})$ 深度后散布有强度为 $p$ 的单量子位去极化噪声，都可以从多项式时间经典计算机中近似采样。我们的证明将电路的输出状态映射到统计力学中的聚合物模型，并将收敛簇扩展与去极化通道的超收缩性相结合。", "authors": [{"name": "Jon Nelson"}, {"name": "Joel Rajakumar"}, {"name": "Chao Yin"}, {"name": "Yifan F. Zhang"}, {"name": "Michael J. Gullans"}], "featured_authors": [{"name": "Jon Nelson"}, {"name": "Joel Rajakumar"}, {"name": "Chao Yin"}, {"name": "Yifan F. Zhang"}, {"name": "Michael J. Gullans"}], "author_count": 5}, {"id": "2610.00561", "category": "quant-ph", "title": "Optimal two-mode bosonic loss codes from finite group symmetry", "abstract": "Photon loss is a dominant noise process in bosonic quantum hardware, including superconducting cavities. Fixed-total-photon-number qubit encodings in two bosonic modes retain the loss-detection advantage of dual-rail qubits while supporting photon loss correction. Optimizing entanglement fidelity in this setting for $4\\leq n\\leq25$ over arbitrary encoders and decoders reveals finite-group structure in every best-found code: 11 correspond to two-dimensional irreducible representations and 11 to reducible ones. Motivated by this emergence, we derive the necessary-and-sufficient Knill-Laflamme conditions for arbitrary finite-group-invariant codes, reducing their construction to equations on representation multiplicity spaces. For every finite subgroup of $SU(2)$ and every tensor rank, we explicitly construct the minimum number of operators required to impose all corresponding loss-correction constraints. These results produce analytic counterparts to most numerical codes and predict constructions missed by the initial search. Exact MacWilliams-Farkas certificates show that our codes achieve the maximum possible loss distance in 21 of the 22 sectors, and we prove that the resulting distance bound is monotone in total photon number. Beyond the scan, we identify a binary-polyhedral sequence with photon number $n_d=\\lceil(3d^2+1)/4\\rceil$ and construct each corresponding code through distance $d=10$. To our knowledge, the constructed $(n,d)=(28,6),(49,8),(76,10)$ codes give the smallest reported $n$ for their respective distances; all members through $d=9$ attain the fixed-$n$ LP distance bound. Together, these constructions, certificates, and a symmetry-reduced constraint count provide evidence for an infinite code family conjectured to attain every distance at the minimum photon number.", "url": "https://arxiv.org/abs/2610.00561", "type": "理论+数值", "summary": "光子损失是玻色子量子硬件（包括超导腔）中的主要噪声过程。两种玻色子模式下的固定总光子数量子位编码保留了双轨量子位的丢失检测优势，同时支持光子丢失校正。在此设置中，在任意编码器和解码器上优化纠缠保真度为 $4\\leq n\\leq25$ 揭示了每个最佳找到的代码中的有限群结构：11 对应于二维不可约表示，11 对应于可约表示。受这一现象的推动，我们推导了任意有限群不变码的充分必要 Knill-Laflamme 条件，将其构造简化为表示多重空间上的方程。对于 $SU(2)$ 的每个有限子组和每个张量秩，我们显式构造施加所有相应损失校正约束所需的最小运算符数。这些结果产生大多数数字代码的分析对应物，并预测初始搜索遗漏的结构。\n\n精确的 MacWilliams-Farkas 证书表明，我们的代码在 22 个扇区中的 21 个扇区中实现了最大可能的损失距离，并且我们证明所得到的距离界限在总光子数上是单调的。除了扫描之外，我们还识别出光子数 $n_d=\\lceil(3d^2+1)/4\\rceil$ 的二元多面体序列，并通过距离 $d=10$ 构造每个相应的代码。据我们所知，构造的 $(n,d)=(28,6),(49,8),(76,10)$ 代码给出了各自距离的最小报告 $n$；通过 $d=9$ 的所有成员都达到固定的 $n$ LP 距离界限。这些构造、证书和对称性减少的约束计数共同为推测以最小光子数达到每个距离的无限代码族提供了证据。", "authors": [{"name": "Argyris Giannisis Manes"}, {"name": "Mahadevan Subramanian"}, {"name": "Liang Jiang"}], "featured_authors": [{"name": "Argyris Giannisis Manes"}, {"name": "Mahadevan Subramanian"}, {"name": "Liang Jiang"}], "author_count": 3}, {"id": "2610.00579", "category": "quant-ph", "title": "Characterizing unitaries via quasi-process functions", "abstract": "It is well-known that every n-qubit unitary can be decomposed into a product of controlled single-qubit unitaries. We show that the control conditions in such a decomposition naturally define a quasi-process function, an object that originally came up in the study of indefinite causal order. Here quasi-process functions yield a representation of every n-qubit unitary in a canonical form, namely, as a quasi-process function unitary (qPFU). We use this representation to show how quantum nonlocality without entanglement (QNLWE) can be understood in terms of unitaries that encode the trade-off between causal order and locality noted in R. Kunjwal and Ä. Baumeler, arXiv:2202.00440 . Specifically, we obtain two sufficient (but not necessary) criteria---mutual exclusivity of control conditions (MECC) and Unambiguity---for a unitary to be a process function unitary (PFU), i.e., it admits a qPFU representation where the quasi-process function is a process function, an object that can model paradox-free classical causal loops. We also show the inequivalence of these criteria, neither implying the other. We then show that the circuit depth of MECC unitaries admits a characterization in terms of clique-partitioning problems on Hamming graphs and use this correspondence to provide bounds on the circuit depth of n-qubit MECC unitaries. Finally, we show how MECC unitaries provide a recipe for constructing a unitary purification of the associated process function, thereby providing a large class of unitary processes of interest in quantum causality. The generality of this causality-inspired representation of unitaries makes it a versatile tool for analyzing the structure of quantum circuits in other domains.", "url": "https://arxiv.org/abs/2610.00579", "type": "理论", "summary": "众所周知，每个 n 量子位酉都可以分解为受控单量子位酉的乘积。我们证明，这种分解中的控制条件自然地定义了一个准过程函数，这个对象最初是在不定因果顺序的研究中出现的。这里，准过程函数以规范形式产生每个 n 量子位酉的表示，即作为准过程函数酉 (qPFU)。我们使用这种表示来展示如何用酉法来理解无纠缠的量子非定域性（QNLWE），该酉式编码 R. Kunjwal 和 ä 中提到的因果顺序和局域性之间的权衡。鲍梅尔，arXiv：2202.00440。具体来说，我们获得了两个充分（但不是必要）的标准——控制条件的互斥性（MECC）和明确性——使酉成为过程函数酉（PFU），即，它承认 qPFU 表示，其中准过程函数是过程函数，是一个可以建模无悖论经典因果循环的对象。我们还表明了这些标准的不等价性，但并不暗示另一个标准。\n\n然后，我们证明 MECC 酉系统的电路深度承认汉明图上的集团划分问题的特征，并使用这种对应关系来提供 n 量子位 MECC 酉系统的电路深度的界限。最后，我们展示了 MECC 幺正如何提供构建相关过程函数的幺正纯化的方法，从而提供一大类量子因果关系中感兴趣的幺正过程。这种受因果关系启发的幺正表示的通用性使其成为分析其他领域量子电路结构的通用工具。", "authors": [{"name": "Nasra Daher Ahmed"}, {"name": "Ravi Kunjwal"}], "featured_authors": [{"name": "Nasra Daher Ahmed"}, {"name": "Ravi Kunjwal"}], "author_count": 2}, {"id": "2610.00635", "category": "quant-ph", "title": "Engineering non-ergodic properties in two dimensional quantum many-body systems", "abstract": "Non-ergodic quantum many-body dynamics offers a route to persistent quantum coherence far from equilibrium, beyond the conventional expectations of thermalizing statistical mechanics. Most known examples have been identified through intuition, analogy, or numerical search, rather than by systematic Hamiltonian design. This leaves few general methods for engineering robust non-ergodic dynamics in disorder-free interacting quantum many-body systems, especially in higher dimensions where enhanced connectivity generally disfavors ergodicity breaking. Here, we use an eigenstate-to-Hamiltonian construction approach to systematically engineer two-dimensional quantum spin Hamiltonians with tunable non-ergodic properties. Starting from a common parent model and input eigenstate, we construct two target Hamiltonians on the square lattice that differ in their interaction geometry: axial versus diagonal. We show that the resulting interaction geometry and coupling pattern control the Hilbert-space structure and dynamics. The axial model forms a connected Hilbert-space network and exhibits an anisotropy-driven crossover from ergodic to non-ergodic behavior through the suppression of resonances. In contrast, the diagonal model exhibits Hilbert-space fragmentation and, within its largest irreducible sector, signatures of quantum many-body scar dynamics including towers of highly localized, low-entanglement eigenstates, and long-lived coherent revivals. These results establish a direct link between Hamiltonian design, Hilbert-space network structure, and emergent non-ergodic dynamics.", "url": "https://arxiv.org/abs/2610.00635", "type": "理论+数值", "summary": "非遍历量子多体动力学提供了一条远离平衡态的持久量子相干性的途径，超出了热化统计力学的传统预期。大多数已知的例子都是通过直觉、类比或数值搜索来识别的，而不是通过系统的哈密顿设计。这使得在无序相互作用的量子多体系统中设计鲁棒的非遍历动力学的通用方法很少，特别是在更高的维度中，增强的连通性通常不利于遍历性破坏。在这里，我们使用本征态到哈密尔顿构造方法来系统地设计具有可调非遍历特性的二维量子自旋哈密顿量。从共同的父模型和输入本征态开始，我们在方晶格上构建了两个目标哈密顿量，它们的相互作用几何形状不同：轴向与对角线。我们表明，由此产生的相互作用几何和耦合模式控制希尔伯特空间结构和动力学。轴向模型形成一个连接的希尔伯特空间网络，并通过抑制共振表现出各向异性驱动的从遍历行为到非遍历行为的交叉。\n\n相比之下，对角线模型表现出希尔伯特空间碎片，并且在其最大的不可约扇区中表现出量子多体疤痕动力学的特征，包括高度局域化、低纠缠本征态塔和长寿命相干复兴。这些结果在哈密顿设计、希尔伯特空间网络结构和新兴非遍历动力学之间建立了直接联系。", "authors": [{"name": "Nyayabanta Swain"}, {"name": "Gabriel Lemarié"}, {"name": "Shaffique Adam"}], "featured_authors": [{"name": "Nyayabanta Swain"}, {"name": "Gabriel Lemarié"}, {"name": "Shaffique Adam"}], "author_count": 3}, {"id": "2610.00667", "category": "quant-ph", "title": "Operator-language Feynman rules for driven-dissipative quantum systems: from mean field to non-Gaussian photon correlations", "abstract": "We construct Feynman rules for Lindblad master equations in the operator language of quantum optics: a fixed algebra of elementary operator moves and closed-form propagators for perturbation theory about an exactly solvable, in most cases Gaussian, generator. The expansion separates into a kinematic part (the shift algebra on the Wick-ordered eigenoperators $O_{mn}=:(c^\\dagger)^m c^n:$, from which the vertex table for a specified interaction is assembled) and a dynamical part that enters only through the resolvent of the unperturbed generator, diagonal and additive for any stable, diagonalizable Gaussian $L_0$, including thermal and squeezed reservoirs and correlated decay, and equally available for a two-level emitter, driven or undriven. In the driven Kerr cavity the loop expansion is the semiclassical expansion and the series is asymptotic. In a strongly driven two-level atom, dressed lines replace a series of finite radius by one accurate deep into saturation, one line per Mollow component. For Kerr rings and chains the cost is polynomial in the number of sites at fixed perturbative order. On a three-site ring the diagrams recover the non-Gaussian part of the three-photon correlation that the Gaussian cumulant closure lacks; carried to tenth order they give the smallest $g^{(3)}$ error of the methods compared for $U\\leq0.25\\kappa$ at a cost below that of a fourth-order closure, and third- and fourth-order closures are more accurate at moderate coupling. The same rules, extended to the counting-field-tilted generator, give the photon-counting cumulants of a disordered eight-site chain beyond direct diagonalization; quantum-jump trajectories at three couplings agree with them to within $1.6$ standard errors, within one at the strongest coupling, where they place the third cumulant six standard errors above the Gaussian value.", "url": "https://arxiv.org/abs/2610.00667", "type": "理论", "summary": "我们用量子光学的算子语言构建 Lindblad 主方程的费曼规则：基本算子移动的固定代数和闭式传播子，用于关于精确可解（在大多数情况下为高斯）生成器的微扰理论。展开式分为运动学部分（Wick 有序本征算子 $O_{mn}=:(c^\\dagger)^m c^n:$ 上的移位代数，从中组装指定相互作用的顶点表）和动力学部分，该部分仅通过未受扰动的生成器、任何稳定的可对角化高斯 $L_0$ 的对角线和加法的求解进入，包括热和压缩储层以及相关衰减，并且同样适用于驱动或非驱动的两级发射器。在驱动克尔腔中，环展开式是半经典展开式，并且级数是渐近的。在强驱动的两能级原子中，修饰线用一个精确的深度饱和线代替一系列有限半径，每个莫洛分量一条线。对于克尔环和克尔链，成本是固定扰动阶数的位点数量的多项式。\n\n在三站点环上，这些图恢复了高斯累积量闭合所缺乏的三光子相关性的非高斯部分；进行到十阶时，与 $U\\leq0.25\\kappa$ 相比，它们给出了最小的 $g^{(3)}$ 方法误差，其成本低于四阶闭包，并且三阶和四阶闭包在中等耦合下更准确。同样的规则，扩展到计数场倾斜发生器，给出了超越直接对角化的无序八位点链的光子计数累积量；三个耦合处的量子跃迁轨迹与它们一致，在 1.6 美元标准误差以内，在最强耦合处的一个标准误差内，它们将第三个累积量的六个标准误差置于高斯值之上。", "authors": [{"name": "Peter Ehlers"}, {"name": "Phi Hung Nguyen"}, {"name": "Daniel Soh"}], "featured_authors": [{"name": "Peter Ehlers"}, {"name": "Phi Hung Nguyen"}, {"name": "Daniel Soh"}], "author_count": 3}, {"id": "2610.00669", "category": "quant-ph", "title": "Quantum Circuit Pruning: From NISQ Architectures to Fault-Tolerant Operations", "abstract": "We present a routing-aware pruning strategy for quantum circuits that selectively removes parametric two-qubit gates whose computational contribution is outweighed by the fidelity cost of their execution, and assess it across both Noisy Intermediate-Scale Quantum (NISQ) and fault-tolerant quantum computing (FTQC) architectures. Each two-qubit gate of a circuit is evaluated by comparing an architecture-independent lower bound on the fidelity cost of omitting the gate against a hardware-specific model for the routing execution cost in each setting. We additionally provide an analytical characterization of the pruning boundary as a function of rotation angle, qubit distance, and hardware noise. Simulations on benchmark circuits demonstrate gate count reductions of up to 48.6% and fidelity improvements of up to 47.7% in the NISQ regime, while a feasibility analysis on FT hardware indicates that pruning is expected to remain relevant across a range of code distances and physical error rates. These results establish routing-aware pruning as a practical and unified compilation strategy across the quantum computing stack.", "url": "https://arxiv.org/abs/2610.00669", "type": "理论+数值", "summary": "我们提出了一种用于量子电路的路由感知修剪策略，该策略选择性地删除参数化的双量子位门，其计算贡献被其执行的保真度成本所抵消，并在噪声中尺度量子（NISQ）和容错量子计算（FTQC）架构中对其进行评估。通过将省略门的保真度成本的独立于架构的下限与每种设置中路由执行成本的硬件特定模型进行比较来评估电路的每个两量子位门。我们还提供了修剪边界作为旋转角度、量子位距离和硬件噪声函数的分析特征。对基准电路的仿真表明，在 NISQ 体系中，门数减少了高达 48.6%，保真度提高了高达 47.7%，而对 FT 硬件的可行性分析表明，修剪预计将在一系列代码距离和物理错误率中保持相关性。这些结果将路由感知修剪确立为跨量子计算堆栈的实用且统一的编译策略。", "authors": [{"name": "Pau Escofet"}, {"name": "Carmen G. Almudéver"}, {"name": "Sergi Abadal"}, {"name": "Eduard Alarcón"}], "featured_authors": [{"name": "Pau Escofet"}, {"name": "Carmen G. Almudéver"}, {"name": "Sergi Abadal"}, {"name": "Eduard Alarcón"}], "author_count": 4}, {"id": "2610.00736", "category": "quant-ph", "title": "Beyond Feasibility: Finite-Depth Accessibility in Constrained QAOA", "abstract": "Constraint-preserving mixers keep QAOA within a feasible subspace, but feasibility and global mixer connectivity do not determine which feasible configurations are available to a particular shallow circuit. We study constrained QAOA at the level of the circuit actually executed: a specified feasible initial state, finite depth, and finite schedule of mixer interactions. We define the finite-depth accessible set $R_p(M,x_0)$ and show that the computational-basis support of the ideal QAOA circuit is contained within it. This gives a parameter-independent objective ceiling $f_R^\\star=\\max_{x\\in R_p}f(x)$ and a normalized reachable-quality diagnostic $Q_R$, separating accessible volume from the objective quality contained within it. We evaluate this framework using resource-matched block-local XY mixer schedules for constrained portfolio optimization and synthetic block-constrained quadratic problems. Across 207 favorable-tail CVaR QAOA configurations, $Q_R$ shows the strongest association with realized shallow-QAOA performance among the structural diagnostics considered, with Pearson and Spearman correlations of $0.7003$ and $0.8057$; the relationship remains positive under controlled and dependence-aware analyses. The distinction persists across changes in feasible initialization, portfolio size, and objective family. A compilation-only study further shows that, for the dense portfolio Hamiltonians considered here, phase-separator routing dominates the compiled two-qubit resource scale, while mixer schedules with comparable compiled two-qubit cost can exhibit markedly different finite-depth accessible quality. These results motivate objective-relevant finite-depth accessibility as a complementary diagnostic for resource-bounded constrained QAOA.", "url": "https://arxiv.org/abs/2610.00736", "type": "理论+数值", "summary": "保留约束的混频器将 QAOA 保持在可行子空间内，但可行性和全局混频器连接性并不能确定哪些可行配置可用于特定的浅层电路。我们在实际执行的电路级别上研究约束 QAOA：指定的可行初始状态、有限深度和混合器交互的有限时间表。我们定义了有限深度可访问集 $R_p(M,x_0)$ 并表明其中包含理想 QAOA 电路的计算基础支持。这给出了一个与参数无关的目标上限 $f_R^\\star=\\max_{x\\in R_p}f(x)$ 和一个标准化的可达质量诊断 $Q_R$，将可访问量与其包含的客观质量分开。我们使用资源匹配的块本地 XY 混合器调度来评估该框架，以实现约束投资组合优化和合成块约束二次问题。\n\n在 207 个有利尾部 CVaR QAOA 配置中，$Q_R$ 显示出与所考虑的结构诊断中已实现的浅层 QAOA 性能的最强关联，Pearson 和 Spearman 相关性为 $0.7003$ 和 $0.8057$；在受控和依赖意识分析下，这种关系仍然是积极的。这种区别在可行的初始化、投资组合规模和目标系列的变化中仍然存在。仅编译的研究进一步表明，对于此处考虑的密集组合哈密顿量，相分离器路由在编译的两量子位资源规模中占主导地位，而具有可比编译的两量子位成本的混合器调度可以表现出明显不同的有限深度可访问质量。这些结果激发了与目标相关的有限深度可访问性，作为资源有限的受限 QAOA 的补充诊断。", "authors": [{"name": "Rushikesh Ubale"}, {"name": "Gregory T. Byrd"}, {"name": "Yasar Mulani"}, {"name": "Sangram Deshpande"}], "featured_authors": [{"name": "Rushikesh Ubale"}, {"name": "Gregory T. Byrd"}, {"name": "Yasar Mulani"}, {"name": "Sangram Deshpande"}], "author_count": 4}, {"id": "2610.00772", "category": "quant-ph", "title": "Conditioning on Subalgebras - Entropy Duality and Generalized Quantum Stein's Lemma in von Neumann Algebras", "abstract": "We establish duality relations for conditional entropies relative to subalgebras of arbitrary von Neumann algebras, including the Umegaki relative entropy as well as the sandwiched- and Petz-Rényi divergences. Even in finite dimensions, these results extend the familiar dualities for conditional entropies from tensor-product subsystems to general subalgebras, while also lifting the framework to the fully infinite-dimensional setting. As an application, we establish an infinite-dimensional extension of quantum Stein's lemma when the alternative hypothesis is the state space of a finite-index subalgebra, which gives an operational interpretation of the relative entropy to a subalgebra as the optimal asymptotic error exponent in composite quantum hypothesis testing-the first beyond finite dimensions.", "url": "https://arxiv.org/abs/2610.00772", "type": "理论", "summary": "我们建立了条件熵相对于任意冯诺依曼代数子代数的对偶关系，包括 Umegaki 相对熵以及夹心散度和 Petz-Rényi 散度。即使在有限维中，这些结果也将熟悉的条件熵对偶性从张量积子系统扩展到一般子代数，同时还将框架提升到完全无限维设置。作为一个应用，当备择假设是有限索引子代数的状态空间时，我们建立了量子斯坦因引理的无限维扩展，它给出了子代数的相对熵的操作解释，作为复合量子假设检验中的最佳渐近误差指数——第一个超越有限维度的检验。", "authors": [{"name": "Bjarne Bergh"}, {"name": "Li Gao"}, {"name": "Mizanur Rahaman"}], "featured_authors": [{"name": "Bjarne Bergh"}, {"name": "Li Gao"}, {"name": "Mizanur Rahaman"}], "author_count": 3}, {"id": "2610.00783", "category": "quant-ph", "title": "Real-Time Adaptive Filtering and the Boxcar Limit in Superconducting Qubit Readout", "abstract": "In dispersive readout of superconducting qubits, the common baseline is a boxcar averager: a uniformly weighted average over a fixed window followed by threshold-based state assignment. We ask when additional digital processing improves fidelity. We evaluated an adaptive finite-impulse-response (FIR) filter trained in real time by the least-mean-squares (LMS) algorithm on an FPGA quantum controller, and analyzed measured readout shots offline to compare the frozen filter with boxcar averaging and to test per-sample weighting and sequential detection. For the fixed FIR filters tested, summing the filtered samples gives the boxcar sum multiplied by one complex number, apart from a small edge correction (the kernel collapse). This scales state separation and noise equally, so discrimination cannot improve (the boxcar limit). The frozen LMS filter reduces trace noise without a resolved fidelity improvement at the tested readout lengths. Replayed on the same shots offline, each filtered shot carries 99.4% of the boxcar shot's discrimination signal-to-noise ratio at the 8 $\\mu$s operating point of the 2D transmon qubit (Q1). On Q1, optimizing the readout window's start and duration improves contrast readout fidelity by +2.4% to +5.6% across four readout lengths. Per-sample weighting adds up to +3.0% over full-window integration, and only +0.33% beyond the tuned window at 8 $\\mu$s. Remaining results are from a 3D ancilla qubit (Q2), which sits above the early-decision crossover that Q1 sits below. Hardware sweeps locate the crossover window near 1 $\\mu$s. Offline, the sequential test decided most shots early, with fidelity within 0.5 percentage points of the boxcar. About 30 labeled shots per class build a matched-filter template nearly as good as one from hundreds. The results form an operating-point record that separates waveform denoising from decision improvement.", "url": "https://arxiv.org/abs/2610.00783", "type": "数值", "summary": "在超导量子位的分散读出中，公共基线是 Boxcar 平均器：固定窗口上的均匀加权平均值，然后是基于阈值的状态分配。我们询问额外的数字处理何时可以提高保真度。我们评估了在 FPGA 量子控制器上通过最小均方 (LMS) 算法实时训练的自适应有限脉冲响应 (FIR) 滤波器，并离线分析测量的读数镜头，以将冻结滤波器与 Boxcar 平均进行比较，并测试每个样本的加权和顺序检测。对于测试的固定 FIR 滤波器，除了小的边缘校正（内核崩溃）之外，对滤波后的样本求和得到的是 Boxcar 总和乘以一个复数。这会平等地缩放状态分离和噪声，因此辨别力无法改善（棚车限制）。冻结的 LMS 滤波器可降低迹线噪声，但不会在测试的读出长度上提高保真度。离线重播相同的镜头，每个过滤后的镜头在 2D transmon 量子位 (Q1) 的 8 $\\mu$s 操作点上具有 99.4% 的 Boxcar 镜头辨别信噪比。\n\n在第一季度，优化读出窗口的开始和持续时间将四个读出长度的对比度读出保真度提高了 +2.4% 至 +5.6%。与全窗口积分相比，每个样本的权重总计增加了 +3.0%，而在 8 $\\mu$s 的调整窗口之外仅增加了 +0.33%。其余结果来自 3D 辅助量子位 (Q2)，它位于 Q1 下方的早期决策交叉之上。硬件扫描将交叉窗口定位在 1 $\\mu$s 附近。离线时，顺序测试提前决定了大多数镜头，其保真度与棚车的误差在 0.5 个百分点以内。每类大约 30 个标记镜头构建的匹配滤镜模板几乎与数百个中的一个一样好。结果形成一个工作点记录，将波形去噪与决策改进分开。", "authors": [{"name": "Hans Johnson"}, {"name": "Tanay Roy"}, {"name": "Leonardo Bove"}, {"name": "David van Zanten"}, {"name": "Silvia Zorzetti"}, {"name": "Jafar Saniie"}], "featured_authors": [{"name": "Hans Johnson"}, {"name": "Tanay Roy"}, {"name": "Leonardo Bove"}, {"name": "David van Zanten"}, {"name": "Silvia Zorzetti"}, {"name": "Jafar Saniie"}], "author_count": 6}, {"id": "2610.00841", "category": "quant-ph", "title": "Neural Fourier Surrogates for Data Reuploading Quantum Neural Networks", "abstract": "For quantum machine learning, the exact boundary between classical and quantum advantage is still poorly understood. Direct comparison between quantum neural networks (QNNs) and existing classical models, which encompass fundamentally different function classes, often fails to provide broader insight into the difference between the two. Inspired by the techniques of Neural Quantum States and Random Fourier Features, this work introduces Neural Fourier Surrogates (NFS), a stochastic classical neural network architecture for efficiently learning coefficients over the same finite Fourier series support as quantum neural networks. Testing on a selection of tabular benchmark datasets, we find that NFS is an effective classifier architecture broadly competitive with established classical baselines, including a comparable Random Fourier Features model, and possessing comparable performance to data-reuploading QNNs; combined with additional analysis comparing the learned Fourier spectra of QNNs and NFS on synthetic data, these results establish NFS as a natural classical baseline for evaluating QNN performance.", "url": "https://arxiv.org/abs/2610.00841", "type": "理论+数值", "summary": "对于量子机器学习，经典优势和量子优势之间的确切界限仍然知之甚少。量子神经网络 (QNN) 与现有经典模型（包含根本不同的函数类别）之间的直接比较通常无法更广泛地了解两者之间的差异。受神经量子态和随机傅里叶特征技术的启发，这项工作引入了神经傅里叶代理（NFS），这是一种随机经典神经网络架构，用于在与量子神经网络相同的有限傅里叶级数支持上有效学习系数。通过对选定的表格基准数据集进行测试，我们发现 NFS 是一种有效的分类器架构，与已建立的经典基线具有广泛的竞争力，包括可比较的随机傅里叶特征模型，并且具有与数据重新上传 QNN 相当的性能；结合在合成数据上比较 QNN 和 NFS 的学习傅里叶谱的额外分析，这些结果将 NFS 确立为评估 QNN 性能的自然经典基线。", "authors": [{"name": "Oliver Knitter"}, {"name": "Jonathan Mei"}, {"name": "Sang Hyub Kim"}, {"name": "Chi Chen"}, {"name": "Masako Yamada"}, {"name": "Martin Roetteler"}], "featured_authors": [{"name": "Oliver Knitter"}, {"name": "Jonathan Mei"}, {"name": "Sang Hyub Kim"}, {"name": "Chi Chen"}, {"name": "Masako Yamada"}, {"name": "Martin Roetteler"}], "author_count": 6}, {"id": "2610.00847", "category": "quant-ph", "title": "Beyond IP = PSPACE and QIP = PSPACE: Interactive Proofs in Arbitrary Physical Theories", "abstract": "The equalities IP = PSPACE and QIP = PSPACE, the latter achievable with three messages, raise a basic question: how much of an interactive proof's power comes from the underlying physical theory? We study interactive proofs in general probabilistic theories, which include classical and quantum theory. The answer depends on what the prover and verifier exchange and how the theory specifies efficient operations. When they exchange only classical messages, protocols in every theory satisfying our standard assumptions decide exactly PSPACE. For protocols with a quantum verifier and quantum messages, allowing a prover to use any theory containing quantum theory does not increase the maximum acceptance probability. Thus, the three-message PSPACE result remains valid against such provers. When messages may be arbitrary systems, the interactive-proof class can strictly exceed PSPACE.", "url": "https://arxiv.org/abs/2610.00847", "type": "理论", "summary": "等式 IP = PSPACE 和 QIP = PSPACE（后者可以通过三个消息实现）提出了一个基本问题：交互式证明的力量有多少来自底层物理理论？我们研究一般概率理论中的交互式证明，包括经典理论和量子理论。答案取决于证明者和验证者交换的内容以及理论如何指定有效的操作。当它们仅交换经典消息时，满足我们标准假设的每个理论中的协议都准确地决定 PSPACE。对于具有量子验证器和量子消息的协议，允许证明者使用任何包含量子理论的理论不会增加最大接受概率。因此，三消息 PSPACE 结果对于此类证明者仍然有效。当消息可能是任意系统时，交互证明类别可以严格超过PSPACE。", "authors": [{"name": "Kishor Bharti"}], "featured_authors": [{"name": "Kishor Bharti"}], "author_count": 1}, {"id": "2610.00865", "category": "quant-ph", "title": "From Steane to A7: Quantum Codes from Invariant States", "abstract": "We construct a two-parameter family of single-error-correcting seven-ququart codes with transversal $\\tilde{A_7}$ symmetry, realizing the finite component of a two-qubit super-golden gate set. These $((7,4,3))_4$ codes encode two logical qubits and support non-Clifford operations by applying the same gate to each physical ququart. Our method constructs invariant parent states rather than searching directly for a codespace. For $n$ systems of local dimension $q$, suppose the local symmetry is a unitary $t$-group and the permutation symmetry is $t$-transitive. Maximal mixing of all marginals on at most $t$ sites is then equivalent to linear equations in Schur--Weyl sector weights. Every feasible solution yields parents of pure distance at least $t+1$; puncturing one site produces a $q$-dimensional code of distance at least $t$ with the prescribed local symmetry acting transversally. Steane and the nonstabilizer Fake Steane code reveal why the construction leaves continuous freedom. They share the same prescribed transversal Clifford and permutation symmetries, and their eight-qubit purifications lie on a circle: error correction fixes two invariant-sector norms but leaves the relative phase free. Keeping the same permutation group and replacing Clifford symmetry by $\\tilde{A_7}$ $\\leq SU(4)$ gives three fixed sector norms and two free relative phases, producing the new ququart family.", "url": "https://arxiv.org/abs/2610.00865", "type": "理论", "summary": "我们构建了具有横向 $\\tilde{A_7}$ 对称性的单纠错七夸夸特码的二参数族，实现了两个量子位超金门集的有限分量。这些 $((7,4,3))_4$ 代码对两个逻辑量子位进行编码，并通过将相同的门应用于每个物理 ququart 来支持非 Clifford 操作。我们的方法构造不变的父状态，而不是直接搜索代码空间。对于局部维度 $q$ 的 $n$ 系统，假设局部对称性是酉 $t$ 群，排列对称性是 $t$ 传递的。最多 $t$ 站点上所有边际的最大混合相当于 Schur-Weyl 扇区权重中的线性方程。每个可行的解决方案都会产生至少 $t+1$ 的纯距离父项；刺穿一个位点会产生一个距离至少为 $t$ 的 $q$ 维代码，并具有横向作用的规定局部对称性。 Steane 和非稳定器 Fake Steane 代码揭示了为什么该结构留下了连续的自由度。\n\n它们具有相同的横向 Clifford 对称性和排列对称性，并且它们的八量子位纯化位于一个圆上：纠错修复了两个不变扇区范数，但保持相对相位自由。保持相同的置换群并用 $\\tilde{A_7}$ $\\leq SU(4)$ 替换 Clifford 对称性给出三个固定扇区范数和两个自由相对相位，产生新的 ququart 系列。", "authors": [{"name": "Ian Teixeira"}], "featured_authors": [{"name": "Ian Teixeira"}], "author_count": 1}, {"id": "2610.00887", "category": "quant-ph", "title": "A Gate-Based Quantum Computing Framework for Codon Optimization", "abstract": "Codon optimization is a challenging combinatorial optimization problem with important applications in synthetic biology, protein expression, and biotechnology. While quantum annealing has previously been explored for this problem, the application of gate-based quantum algorithms remains largely unexplored. In this work, we present a gate-based quantum computing framework for codon optimization by formulating the optimization objective as an Ising Hamiltonian and expressing it in terms of Pauli operators suitable for gate-based quantum processors. The proposed framework is investigated using the Variational Quantum Eigensolver (VQE), Sampling Variational Quantum Eigensolver (SVQE), and the Quantum Approximate Optimization Algorithm (QAOA), with benchmarking against exact diagonalization, classical optimization, and quantum annealing. Using a three-amino-acid benchmark, the proposed implementations successfully reproduce the exact ground-state solutions while identifying optimized ansatz selections, optimization strategies, initialization schemes, and hardware execution settings that provide reproducible performance on current noisy quantum hardware. Hardware demonstrations are performed on IBM Quantum processors to evaluate the practical implementation of the proposed workflow. As a work in progress, this study establishes a reproducible computational framework for gate-based quantum codon optimization and provides the foundation for future investigations of larger protein sequences as quantum hardware and algorithms continue to advance.", "url": "https://arxiv.org/abs/2610.00887", "type": "理论+数值", "summary": "密码子优化是一个具有挑战性的组合优化问题，在合成生物学、蛋白质表达和生物技术中具有重要应用。虽然之前已经探索过量子退火来解决这个问题，但基于门的量子算法的应用在很大程度上仍未得到探索。在这项工作中，我们提出了一种基于门的量子计算框架，用于密码子优化，将优化目标表述为伊辛哈密顿量，并用适合基于门的量子处理器的泡利算子来表达。使用变分量子本征求解器 (VQE)、采样变分量子本征求解器 (SVQE) 和量子近似优化算法 (QAOA) 对所提出的框架进行了研究，并以精确对角化、经典优化和量子退火为基准。使用三个氨基酸基准，所提出的实现成功地重现了精确的基态解决方案，同时确定了优化的 ansatz 选择、优化策略、初始化方案和硬件执行设置，这些设置在当前噪声量子硬件上提供了可重现的性能。\n\n在 IBM Quantum 处理器上进行硬件演示，以评估所提议工作流程的实际实施情况。作为一项正在进行的工作，这项研究为基于门的量子密码子优化建立了一个可重复的计算框架，并为未来随着量子硬件和算法的不断进步而研究更大的蛋白质序列奠定了基础。", "authors": [{"name": "Fatemeh Ghasemi"}, {"name": "Kion Kim"}], "featured_authors": [{"name": "Fatemeh Ghasemi"}, {"name": "Kion Kim"}], "author_count": 2}, {"id": "2610.00945", "category": "quant-ph", "title": "TATVA: A Reinforcement Learning Framework for Quantum Circuit Synthesis", "abstract": "One of the most important initial steps in quantum computing is high-fidelity quantum state preparation, because errors in it can affect the final computational result. Therefore, one of the major challenges is to design a quantum circuit that can achieve the desired target state accurately with a smaller number of gates. Traditionally, circuits are designed using predefined rules and mathematical decompositions, but this makes it difficult to design circuits for different and complex target states. This paper presents TATVA, a reinforcement learning (RL) system for synthesizing quantum circuits. TATVA views circuit synthesis as a sequential decision problem in which the agents select one gate at a time and calculate the fidelity after each applied gate, with the gate producing the highest fidelity selected for the circuit. The system introduces a parallel architecture that uses two RL agents, Deep Q-Network (DQN) and Proximal Policy Optimization (PPO), along with Qiskit's statevector simulator. The system can synthesize up to 5 qubits while achieving a fidelity of 0.999999 and producing compact circuits. After achieving the desired fidelity, it performs a post-hoc optimization step that reduces the circuit depth while preserving the achieved fidelity. The circuit is finalized using fidelity, success rate, gate count, and circuit depth. Target states that are not used during training are used to test whether the system has learned effectively and can generalize beyond the training states. This approach aims to enable automatic quantum circuit synthesis with high fidelity using reinforcement learning.", "url": "https://arxiv.org/abs/2610.00945", "type": "数值", "summary": "量子计算中最重要的初始步骤之一是高保真量子态准备，因为其中的错误会影响最终的计算结果。因此，主要挑战之一是设计一种可以用较少数量的门准确实现所需目标状态的量子电路。传统上，电路是使用预定义规则和数学分解来设计的，但这使得为不同且复杂的目标状态设计电路变得困难。本文提出了 TATVA，一种用于合成量子电路的强化学习 (RL) 系统。 TATVA 将电路综合视为一个顺序决策问题，其中代理一次选择一个门，并在每个应用门之后计算保真度，其中门产生为电路选择的最高保真度。该系统引入了一个并行架构，该架构使用两个 RL 代理、深度 Q 网络 (DQN) 和近端策略优化 (PPO)，以及 Qiskit 的状态向量模拟器。该系统可以合成多达 5 个量子位，同时实现 0.999999 的保真度并生成紧凑的电路。\n\n达到所需的保真度后，它会执行事后优化步骤，减少电路深度，同时保持所达到的保真度。根据保真度、成功率、门数和电路深度最终确定电路。训练期间未使用的目标状态用于测试系统是否有效学习并可以泛化到训练状态之外。这种方法旨在利用强化学习实现高保真度的自动量子电路合成。", "authors": [{"name": "Om Bhamare"}, {"name": "Aryan Jadhav"}, {"name": "Manas Shinde"}, {"name": "Prithvi Shinde"}], "featured_authors": [{"name": "Om Bhamare"}, {"name": "Aryan Jadhav"}, {"name": "Manas Shinde"}, {"name": "Prithvi Shinde"}], "author_count": 4}, {"id": "2610.00950", "category": "quant-ph", "title": "Sublinear-depth Quantum Simulation of Electrons with Atomic Orbitals", "abstract": "Discretizing electronic degrees of freedom into atomic orbitals is the default choice to accurately model electrons in molecules in a compact and flexible way. We consider the task of simulating such electronic structure models on a quantum computer for $N$ orbitals, keeping the number of orbitals per atom constant. Atomic orbitals give rise to Hamiltonians with potentially up to $\\mathcal{O}(N^4)$ terms and little structure, which made it challenging to match the complexity of methods based on plane waves and real-space grids. In this work, we show that a Trotter step for atomic orbitals can be implemented in depth $\\mathcal{O}(\\mathrm{polylog}(N))$ without ancillas by combining a rigorous treatment of orbital localization, a hierarchical Hamiltonian decomposition based on the Fast Multipole Method, and shallow quantum Fourier arithmetic circuits. By bounding the Trotter error, we obtain sublinear simulation depth, and our total gate count $N^{5/3 + o(1)}$ matches the best scaling known for any basis.", "url": "https://arxiv.org/abs/2610.00950", "type": "理论+数值", "summary": "将电子自由度离散化为原子轨道是以紧凑灵活的方式精确模拟分子中电子的默认选择。我们考虑在量子计算机上模拟 $N$ 轨道的电子结构模型的任务，保持每个原子的轨道数量恒定。原子轨道产生的哈密顿量可能高达 $\\mathcal{O}(N^4)$ 项且结构很少，这使得匹配基于平面波和实空间网格的方法的复杂性变得具有挑战性。在这项工作中，我们证明，通过结合严格的轨道定位处理、基于快速多极子方法的分层哈密顿分解和浅量子傅立叶运算电路，可以在没有辅助的情况下深度实现原子轨道的 Trotter 步骤。通过限制 Trotter 误差，我们获得了次线性模拟深度，并且我们的总门数 $N^{5/3 + o(1)}$ 与任何基础已知的最佳缩放比例相匹配。", "authors": [{"name": "Jakob Günther"}, {"name": "Aram W. Harrow"}], "featured_authors": [{"name": "Jakob Günther"}, {"name": "Aram W. Harrow"}], "author_count": 2}, {"id": "2610.01024", "category": "quant-ph", "title": "Exact $T$-counts of Toffoli layers from an isotropy bound", "abstract": "The $T$-count is the dominant cost of fault-tolerant Clifford+$T$ computation. We prove that a layer of $m$ disjoint CCZ gates, the diagonal core of a parallel Toffoli layer, needs exactly $6m+1$ $T$ gates in every Hadamard-free Clifford+$T$ circuit with clean ancillas. Campbell and Howard gave the matching construction. To our knowledge this is the first proof that it is optimal for general $m$ (for $m=1$ the value $7$ is classical, and Campbell and Howard state the value $13$ at $m=2$). On every controlled unitary the same floor comes within one of their exact count, and it recovers their $4m+3$ for a fan-out of $m$ Toffolis from one control. The proof rests on an isotropy constraint: for a pure-cubic phase, the vectors recording which $T$ gates touch each qubit span a totally isotropic subspace. In general the constraint gives the isotropy floor $\\delta\\ge2(n-d^{\\ast})-r$ for every diagonal level-three gate, computed from the phase polynomial in polynomial time. The floor is never below stabilizer nullity $\\nu$, which equals $n-d^{\\ast}$ on this class, and a separate parity argument raises it to $2\\nu+1$ on non-Clifford pure-cubic gates. On the output of the TODD optimizer for the $24$ benchmark circuits it completes, the floor certifies $193$ of its $311$ merged phase-polynomial blocks optimal for their Hadamard layering ($186$ to $193$ across five optimizer seeds), against $113$ for nullity. The floor also holds, under stated conditions, for circuits whose only internal Hadamards form unitarily uncomputed temporary AND blocks, while under adaptive feedforward only $t\\ge\\nu$ is proved.", "url": "https://arxiv.org/abs/2610.01024", "type": "理论+数值", "summary": "$T$ 计数是容错 Clifford+$T$ 计算的主要成本。我们证明，一层 $m$ 不相交的 CCZ 门，即并行 Toffoli 层的对角线核心，在每个具有干净辅助的无 Hadamard Clifford+$T$ 电路中恰好需要 $6m+1$ $T$ 门。坎贝尔和霍华德给出了匹配的结构。据我们所知，这是第一个证明它对于一般 $m$ 是最优的（对于 $m=1$，值 $7$ 是经典的，坎贝尔和霍华德在 $m=2$ 时指出值 $13$）。在每个受控单元上，同一楼层都在其精确计数范围内，并且它会从一个控制中收回 400 万美元+3$ 的扇出 $m$ Tofffolis。证明基于各向同性约束：对于纯立方相，记录哪些 $T$ 门接触每个量子位的向量跨越一个完全各向同性的子空间。一般来说，约束给出每个对角三级门的各向同性下限$\\delta\\ge2(n-d^{\\ast})-r$，由多项式时间内的相位多项式计算得出。下限永远不会低于稳定器无效 $\\nu$，在此类上等于 $n-d^{\\ast}$，并且在非 Clifford 纯立方门上，一个单独的奇偶校验参数将其提高到 $2\\nu+1$。\n\n在 TODD 优化器针对其完成的 24 美元基准电路的输出中，该层验证了其 311 美元合并相位多项式块中的 193 美元对于哈达玛分层而言是最佳的（五个优化器种子的 186 美元到 193 美元），而无效的 113 美元。在规定条件下，对于仅内部哈达马形成统一未计算的临时 AND 块的电路，该下限也成立，而在自适应前馈下，仅证明 $t\\ge\\nu$。", "authors": [{"name": "Arul Rhik Mazumder"}], "featured_authors": [{"name": "Arul Rhik Mazumder"}], "author_count": 1}, {"id": "2610.01038", "category": "quant-ph", "title": "Function-like pseudorandom unitaries generate pseudorandom quantum processes", "abstract": "Haar-random unitaries provide a canonical model of generic random quantum evolution, but they typically have exponential description and circuit complexity. Although pseudorandom unitaries efficiently emulate a single Haar-random unitary, many tasks require an entire reusable family of independently random-looking operations. We introduce pseudorandom function-like unitaries (PRFU), which generate such a family indexed by public labels using only a single short key. We distinguish classical- and coherent-label access and establish security under adaptive quantum queries. For classical labels, we provide a generic construction from a post-quantum pseudorandom function and a pseudorandom unitary. For coherent labels, we use an indexed path-recording framework to analyze interference across labels and prove security of a construction based on quantum-secure function and permutation primitives. We further show that PRFUs generate pseudorandom channels and quantum combs with private memory, which are secure against adaptive interventions and concurrent sessions. Combining PRFUs with unitary gluing yields a one-key family of pseudorandom unitaries whose supported register widths can be chosen after key generation. Further applications include nonce-resolved quantum authentication, coherently masked QRAM queries, and efficient emulation of random multi-time dynamics. Our results extend quantum pseudorandomness from individual operations to efficiently generated families of random-looking quantum dynamics.", "url": "https://arxiv.org/abs/2610.01038", "type": "理论+数值", "summary": "哈尔随机酉提供了通用随机量子演化的规范模型，但它们通常具有指数描述和电路复杂性。尽管伪随机酉有效地模拟了单个哈尔随机酉，但许多任务需要整个可重用的独立随机操作系列。我们引入了伪随机类函数酉（PRFU），它仅使用单个短密钥生成由公共标签索引的这样一个族。我们区分经典标签访问和相干标签访问，并在自适应量子查询下建立安全性。对于经典标签，我们提供了后量子伪随机函数和伪随机酉的通用构造。对于相干标签，我们使用索引路径记录框架来分析标签之间的干扰，并证明基于量子安全函数和排列原语的构造的安全性。我们进一步表明，PRFU 生成具有私有内存的伪随机通道和量子梳，这些通道和量子梳对于自适应干预和并发会话是安全的。\n\n将 PRFU 与酉粘合相结合会产生伪随机酉的一键系列，其支持的寄存器宽度可以在密钥生成后选择。进一步的应用包括随机数解析的量子身份验证、相干屏蔽 QRAM 查询以及随机多次动态的高效仿真。我们的结果将量子伪随机性从单独的操作扩展到有效生成的随机量子动力学族。", "authors": [{"name": "Zitai Xu"}, {"name": "Rahul Arvind"}, {"name": "Kishor Bharti"}, {"name": "Tobias Haug"}, {"name": "Dax Enshan Koh"}, {"name": "Wai-Keong Mok"}, {"name": "Andrew Tanggara"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Zitai Xu"}, {"name": "Rahul Arvind"}, {"name": "Kishor Bharti"}, {"name": "Wai-Keong Mok"}, {"name": "Andrew Tanggara"}, {"name": "Alexey V. Gorshkov"}], "author_count": 8}, {"id": "2610.01068", "category": "quant-ph", "title": "Learned Parallel Bit-Flipping Sequential Belief Propagation Decoding of Quantum LDPC Codes", "abstract": "Quantum low-density parity-check (QLDPC) codes are promising candidates for low-overhead fault-tolerant quantum computation, but their practical use requires fast, low-complexity, and reliable decoders. Belief propagation (BP) is attractive because of its local message-passing structure, yet standard flooding BP often suffers from convergence failures on QLDPC codes due to short cycles, degeneracy, and symmetric decoding trajectories. Learned sequential BP improves convergence by using a reinforcement-learning policy to choose variable-node update orders, but a single learned trajectory can still be sensitive to unfavorable local Pauli decisions. We propose a learned parallel bit-flipping sequential BP decoder with a new quaternary score combining syndrome gain, a quantized Pauli log-likelihood penalty, and Q-table lookahead at hypothetical post-flip states. Our decoder first runs learned sequential BP for a fixed number of iterations. If the syndrome is not satisfied, it constructs quaternary bit-flipping candidates, each corresponding to changing the current Pauli decision of one qubit. The selected candidates initialize independent learned sequential BP continuations from the same decoder state. Since these continuations are independent, they can be executed in parallel, so testing several candidates mainly increases parallel hardware resources rather than sequential decoding latency. Simulations on representative QLDPC codes over the depolarizing channel show that the proposed decoder improves the reliability of learned sequential BP while having a parallel low-latency structure.", "url": "https://arxiv.org/abs/2610.01068", "type": "数值", "summary": "量子低密度奇偶校验（QLDPC）码是低开销容错量子计算的有希望的候选者，但它们的实际使用需要快速、低复杂性和可靠的解码器。置信传播 (BP) 因其局部消息传递结构而颇具吸引力，但标准泛洪 BP 经常因短周期、简并性和对称解码轨迹而在 QLDPC 码上出现收敛失败的问题。学习顺序 BP 通过使用强化学习策略来选择变量节点更新顺序来提高收敛性，但单个学习轨迹仍然对不利的局部泡利决策敏感。我们提出了一种学习并行位翻转顺序 BP 解码器，该解码器具有新的四元分数，结合了校正子增益、量化泡利对数似然惩罚和假设翻转后状态的 Q 表前瞻。我们的解码器首先运行学习的顺序 BP 进行固定次数的迭代。如果不满足校正子，它会构造四元位翻转候选者，每个候选者对应于改变一个量子位的当前泡利决策。\n\n选定的候选者从相同的解码器状态初始化独立学习的顺序 BP 延续。由于这些延续是独立的，因此它们可以并行执行，因此测试多个候选主要会增加并行硬件资源，而不是顺序解码延迟。对去极化通道上代表性 QLDPC 码的仿真表明，所提出的解码器提高了学习顺序 BP 的可靠性，同时具有并行低延迟结构。", "authors": [{"name": "Mohsen Moradi"}, {"name": "Taejoon Kim"}, {"name": "Remi A. Chou"}], "featured_authors": [{"name": "Mohsen Moradi"}, {"name": "Taejoon Kim"}, {"name": "Remi A. Chou"}], "author_count": 3}, {"id": "2610.01074", "category": "quant-ph", "title": "The stationarity test: a framework for learning quantum many-body systems from their thermal states", "abstract": "The task of learning the Hamiltonian interactions governing a quantum system, given samples of its thermal (or 'Gibbs') states, is a foundational question at the intersection of quantum learning theory and many-body physics. In this paper, we draw connections to the quantum Gibbs sampling literature to introduce a natural learning algorithm we call the stationarity test: which simply \"guesses\" the Hamiltonian, and measures the rate-of-change of local observables, under the associated detailed-balanced quantum Markov chain [CKG23]. We leverage the stationarity test to address the following applications: 1. To give the first learning algorithm for the underlying interaction graph, i.e. structure learning, of lattice Hamiltonians at all temperatures, given copies of their Gibbs states. 2. To give the first learning algorithm for the coefficients of a lattice Hamiltonian, given only copies of its thermal metastable states, modeled as the \"local minima\" of the free energy. 3. In addition, we present a refinement to the recent area law for thermal metastable states [BCV25], which holds in the thermodynamic limit. Our learning algorithms are rigorous, time-efficient, and nearly sample-optimal in system size and accuracy. At a technical level, our arguments are based on new approximate locality and convexity properties for the quantum Fisher information of these Gibbs sampling algorithms.", "url": "https://arxiv.org/abs/2610.01074", "type": "理论+数值", "summary": "在给定热态（或“吉布斯”）态样本的情况下，学习控制量子系统的哈密顿相互作用的任务是量子学习理论和多体物理学交叉点的一个基本问题。在本文中，我们与量子吉布斯采样文献联系起来，介绍了一种我们称为平稳性测试的自然学习算法：它简单地“猜测”哈密顿量，并在相关的详细平衡量子马尔可夫链 [CKG23] 下测量局部可观测值的变化率。我们利用平稳性测试来解决以下应用： 1. 给出所有温度下晶格哈密顿量的底层交互图的第一个学习算法，即结构学习，给定其吉布斯状态的副本。 2. 给出晶格哈密顿量系数的第一个学习算法，仅给出其热亚稳态的副本，建模为自由能的“局部最小值”。 3. 此外，我们还对热亚稳态面积定律 [BCV25] 进行了改进，该定律在热力学极限内成立。\n\n我们的学习算法严谨、高效，并且在系统规模和准确性方面接近样本最优。在技​​术层面上，我们的论点基于这些吉布斯采样算法的量子费希尔信息的新近似局部性和凸性属性。", "authors": [{"name": "Thiago Bergamaschi"}], "featured_authors": [{"name": "Thiago Bergamaschi"}], "author_count": 1}, {"id": "2610.01094", "category": "quant-ph", "title": "Quantum synchronization in atom-cavity coupled sys
