tems", "abstract": "We consider a cavity quantum electrodynamics (CQED) setup where an ensemble of spin-1 atoms driven by a classical field interacts with two driven cavity field modes. We show that the two sub-systems - the atoms and the two-mode cavity field, exhibit limit-cycle or quantum synchronization depending on the cavity drive strengths and other system parameters. In order to visualize the limit cycle and synchronization in the field, we introduce generalized two-mode field Husimi-Q function using SU(2) coherent states. For atomic spin states, we make use of spin-1 Husimi-Q function to visualize the same. We further corroborate the occurrence of field synchronization and limit cycle by analyzing $U(1)$ symmetry breaking, Wigner quasi-probability distribution, coherence properties of reduced field density matrix. Our results reveal intriguing interplay between the limit-cycle and quantum synchronization behavior, highlighting emergent quantum phenomena in driven dissipative interacting quantum systems. Additionally, we calculate Wehrl mutual information between the two modes and find that the field synchronization and Wehrl mutual information are mutually exclusive. Our study would be important to extract quantum advantages in quantum metrology using coupled atom-cavity systems.", "url": "https://arxiv.org/abs/2610.01094", "type": "理论", "summary": "我们考虑一种空腔量子电动力学 (CQED) 设置，其中由经典场驱动的自旋 1 原子集合与两个驱动空腔场模式相互作用。我们证明，两个子系统 - 原子和双模腔场，根据腔驱动强度和其他系统参数表现出极限环或量子同步。为了可视化场中的极限环和同步，我们引入了使用 SU(2) 相干态的广义二模场 Husimi-Q 函数。对于原子自旋态，我们利用 spin-1 Husimi-Q 函数对其进行可视化。通过分析$U(1)$对称性破缺、维格纳准概率分布、约简场密度矩阵的相干性质，进一步证实了场同步和极限环的出现。我们的结果揭示了极限环和量子同步行为之间有趣的相互作用，突出了驱动耗散相互作用量子系统中出现的量子现象。另外，我们计算了两种模式之间的Wehrl互信息，发现场同步和Wehrl互信息是互斥的。\n\n我们的研究对于使用耦合原子腔系统提取量子计量学中的量子优势非常重要。", "authors": [{"name": "Katha Haldar"}, {"name": "Anushree Dey"}, {"name": "Saikat Ghosh"}, {"name": "Bimalendu Deb"}], "featured_authors": [{"name": "Katha Haldar"}, {"name": "Anushree Dey"}, {"name": "Saikat Ghosh"}, {"name": "Bimalendu Deb"}], "author_count": 4}, {"id": "2610.01112", "category": "quant-ph", "title": "Dissipation-Sensitivity Trade-Off in Dissipative Bosonic Systems", "abstract": "We discover a universal trade-off between the dissipation required to maintain a quantum state more sensitive than a thermal one and the sensitivity gain for a driven single-mode bosonic system under a thermal environment. Specifically, for Gaussian states, we rigorously derive a lower bound on the entropy production rate in the steady state in terms of the quantum Fisher information gain relative to a thermal reference state. Numerical investigations of Kerr nonlinearities further support that these bounds can hold beyond the Gaussian regime. Our results establish a new connection between steady-state thermodynamics and quantum metrological performance.", "url": "https://arxiv.org/abs/2610.01112", "type": "理论+数值", "summary": "我们发现了维持比热态更敏感的量子态所需的耗散与热环境下驱动单模玻色子系统的灵敏度增益之间的普遍权衡。具体来说，对于高斯态，我们根据相对于热参考态的量子费希尔信息增益严格推导稳态熵产生率的下限。对克尔非线性的数值研究进一步证明这些界限可以超出高斯体系。我们的结果在稳态热力学和量子计量性能之间建立了新的联系。", "authors": [{"name": "Kohei Yoshimura"}, {"name": "Ryusuke Hamazaki"}], "featured_authors": [{"name": "Kohei Yoshimura"}, {"name": "Ryusuke Hamazaki"}], "author_count": 2}, {"id": "2610.01125", "category": "quant-ph", "title": "Multivariate Quantum Signal Processing", "abstract": "We develop Multivariate Quantum Signal Processing for designing matrix-valued transformations of multiple noncommuting nonnormal block-encoded matrices. Our framework equips quantum transducers with the analytic structure of multiport Infinite-Impulse-Response (IIR) filters and establishes a transfer-function methodology for designing quantum query algorithms. Efficiently computable analytic bounds that hold uniformly across the oracle promise yield efficient quantum circuits with logarithmic error dependence and near-unity success probability, paralleling the approximation-theoretic guarantees of univariate QSP/QSVT. We provide a complete characterization of achievable transfer functions and a principled library of analytic IIR components. Our modular designs greatly improve or resolve the per-oracle query complexity of open multi-oracle problems: (1) Hamiltonian simulation under $H=\\sum_j H_j$ with weighted quasinorm cost $\\approx t\\langle\\vec\\lambda,\\vec C\\rangle_{1/2}+\\mathcal{O}(\\|\\vec C\\|_1\\log(1/\\epsilon))$ for block-encoding normalizations $\\vec\\lambda$ and costs $\\vec C$; (2) sparse simulation with optimal time--norm $\\Theta(\\sqrt{d}\\|H\\|_{\\rm 1\\to2}t)$ and additive error dependence; (3) solving linear systems and (4) differential equations under minimal matrix assumptions with optimal weighted state-preparation and multi-term cost; (5) ground-state preparation and energy estimation; (6) generalized eigenvalue problems. We apply these to exactly simulate downfolded Hamiltonians with leading cost $t\\langle\\vec\\lambda_{\\rm eff},\\vec C_{\\rm eff}\\rangle_{1/2}$ further reduced by fractional dynamic correlation energy contributions from coarse-grained Hamiltonians, and show similar classical-data-input-reduction results for multiscale graph classification via Kron reduction. We also show the online generalization with anisotropic Kalman filtering of streaming quantum data.", "url": "https://arxiv.org/abs/2610.01125", "type": "理论+数值", "summary": "我们开发多元量子信号处理来设计多个非交换非正态块编码矩阵的矩阵值变换。我们的框架为量子传感器配备了多端口无限脉冲响应（IIR）滤波器的分析结构，并建立了用于设计量子查询算法的传递函数方法。有效计算的分析界限在整个预言中保持一致，有望产生具有对数误差依赖性和接近统一成功概率的高效量子电路，与单变量 QSP/QSVT 的近似理论保证并行。我们提供可实现的传递函数的完整表征以及分析 IIR 组件的原理库。\n\n我们的模块化设计极大地改善或解决了开放式多预言机问题的每预言机查询复杂性：（1）$H=\\sum_j H_j$ 下的哈密顿模拟，加权准范数成本为$\\approx t\\langle\\vec\\lambda,\\vec C\\rangle_{1/2}+\\mathcal{O}(\\|\\vec C\\|_1\\log(1/\\epsilon))$，用于块编码归一化$\\vec\\lambda$ 和成本 $\\vec C$; (2) 最优时间范数$\\Theta(\\sqrt{d}\\|H\\|_{\\rm 1\\to2}t)$和加性误差依赖性的稀疏模拟； (3) 在具有最佳加权状态准备和多项成本的最小矩阵假设下求解线性系统和 (4) 微分方程； (5)基态准备和能量估算； (6)广义特征值问题。我们应用这些来精确模拟下折叠哈密顿量，其主要成本 $t\\langle\\vec\\lambda_{\\rm eff},\\vec C_{\\rm eff}\\rangle_{1/2}$ 通过粗粒度哈密顿量的分数动态相关能量贡献进一步降低，并通过 Kron 约简显示了多尺度图分类的类似经典数据输入约简结果。我们还展示了流量子数据的各向异性卡尔曼滤波的在线概括。", "authors": [{"name": "Guang Hao Low"}], "featured_authors": [{"name": "Guang Hao Low"}], "author_count": 1}, {"id": "2610.01141", "category": "quant-ph", "title": "Classical Hardness of Learning Functions of Hamiltonians", "abstract": "Morohoshi, Nakayama, Manabe, and Mitarai proposed a physically motivated quantum machine learning problem in which the goal is to predict quantities of the form $\\operatorname{Tr}[f(H)\\rho]$ from classical descriptions of a Hamiltonian $H$ and a quantum state $\\rho$, where $f$ is an unknown function. We call this problem Hamiltonian function learning in this paper. They constructed an efficient quantum learning algorithm under suitable conditions, while leaving a rigorous proof of average-case classical hardness open. In this paper, we rigorously prove the average-case classical hardness for two distribution-specific Hamiltonian function learning problems for $f_{\\cos,\\pi}(\\lambda)=\\cos(\\pi\\lambda)$ and $f_{\\exp,\\beta}(\\lambda)=e^{-\\beta\\lambda}$ discussed in the paper of Morohoshi et al. under the assumption of the average-case hardness of factoring random RSA moduli. More specifically, we show that an efficient classical randomized learner under squared loss whose output hypotheses are evaluable in classical polynomial time for either problem would yield a classical randomized polynomial-time algorithm for factoring random RSA moduli.", "url": "https://arxiv.org/abs/2610.01141", "type": "理论+数值", "summary": "Morohoshi、Nakayama、Manabe 和 Mitarai 提出了一个物理驱动的量子机器学习问题，其目标是根据哈密顿量 $H$ 和量子态 $\\rho$ 的经典描述来预测 $\\operatorname{Tr}[f(H)\\rho]$ 形式的量，其中 $f$ 是未知函数。我们在本文中将这个问题称为哈密顿函数学习。他们在适当的条件下构建了一种高效的量子学习算法，同时保留了平均情况经典难度的严格证明。在本文中，我们严格证明了 Morohoshi 等人的论文中讨论的 $f_{\\cos,\\pi}(\\lambda)=\\cos(\\pi\\lambda)$ 和 $f_{\\exp,\\beta}(\\lambda)=e^{-\\beta\\lambda}$ 的两个特定分布哈密顿函数学习问题的平均情况经典难度。假设分解随机 RSA 模数的平均情况硬度。更具体地说，我们表明，在平方损失下的高效经典随机学习器（其输出假设对于任一问题都可以在经典多项式时间内评估）将产生用于因式分解随机 RSA 模的经典随机多项式时间算法。", "authors": [{"name": "Sota Hashimoto"}, {"name": "Akinori Kawachi"}], "featured_authors": [{"name": "Sota Hashimoto"}, {"name": "Akinori Kawachi"}], "author_count": 2}, {"id": "2610.01163", "category": "quant-ph", "title": "Robustness hierarchy of bipartite quantum correlations under noisy dynamics", "abstract": "Quantum correlations are fragile under noise, motivating quantitative measures that track not only their presence but also their degradation during physical evolution. We develop a robustness framework for the hierarchy of Bell nonlocality, EPR steering, and entanglement, establishing an ordering of the corresponding robustness measures and relating robustness to noise-induced transition times. We further formulate the instantaneous robustness decay along Lindblad dynamics as a directional derivative determined by both the evolution and the robustness functional. Applications to isotropic depolarizing noise and amplitude damping illustrate, respectively, the resulting resource transition times and the directional dependence of steering robustness. The framework provides an approach to characterizing the degradation and lifetime of bipartite quantum correlations under noisy dynamics.", "url": "https://arxiv.org/abs/2610.01163", "type": "理论", "summary": "量子相关性在噪声下是脆弱的，这激发了定量测量，不仅追踪它们的存在，而且追踪它们在物理进化过程中的退化。我们为贝尔非局域性、EPR 转向和纠缠的层次结构开发了一个鲁棒性框架，建立了相应鲁棒性测量的顺序，并将鲁棒性与噪声引起的过渡时间相关联。我们进一步将沿 Lindblad 动力学的瞬时鲁棒性衰减公式化为由演化函数和鲁棒性函数共同确定的方向导数。各向同性去极化噪声和振幅阻尼的应用分别说明了所产生的资源转换时间和转向鲁棒性的方向依赖性。该框架提供了一种表征噪声动力学下二分量子相关性的退化和寿命的方法。", "authors": [{"name": "Shakib Daryanoosh"}], "featured_authors": [{"name": "Shakib Daryanoosh"}], "author_count": 1}, {"id": "2610.01167", "category": "quant-ph", "title": "Vector chiral order and dynamical quantum phase transitions in an Ising chain with dimerized anisotropic Gamma interaction", "abstract": "We investigate a transverse-field Ising chain with dimerized anisotropic Gamma interactions and demonstrate that, both in the absence and presence of Ising interactions, the competition between Gamma anisotropy and the transverse field gives rise to vector chiral order and dynamical quantum phase transitions. The phase diagram comprises positive and negative vector chiral phases and a paramagnetic phase, characterized by the vector spin chirality and the vector chiral order parameter. In the absence of Ising interactions, we identify a gapless critical line that exhibits no finite-size drift, along which the spin-spin correlations and subsystem entanglement entropy display behavior distinct from that of Ising criticality. Furthermore, we find that the critical times of dynamical quantum phase transitions form periodic or aperiodic sequences, depending on the quench path. Our findings highlight how dimerized off-diagonal exchange enriches both equilibrium ordering and dynamical critical behavior in a quantum Ising chain.", "url": "https://arxiv.org/abs/2610.01167", "type": "理论+数值", "summary": "我们研究了具有二聚化各向异性伽马相互作用的横向场伊辛链，并证明，无论是否存在伊辛相互作用，伽马各向异性和横向场之间的竞争都会引起矢量手性有序和动态量子相变。该相图包括正、负矢量手性相和顺磁相，其特征在于矢量自旋手性和矢量手性序参数。在没有伊辛相互作用的情况下，我们确定了一条无间隙临界线，它不表现出有限尺寸的漂移，沿着这条线，自旋-自旋相关性和子系统纠缠熵表现出与伊辛临界性不同的行为。此外，我们发现动态量子相变的临界时间形成周期性或非周期性序列，具体取决于淬灭路径。我们的研究结果强调了二聚化非对角交换如何丰富量子伊辛链中的平衡有序和动态临界行为。", "authors": [{"name": "Yu-Hong Yan"}, {"name": "Shi-Qiao Wu"}, {"name": "Kun-Liang Zhang"}], "featured_authors": [{"name": "Yu-Hong Yan"}, {"name": "Shi-Qiao Wu"}, {"name": "Kun-Liang Zhang"}], "author_count": 3}, {"id": "2610.01190", "category": "quant-ph", "title": "Rapid mixing of quantum spin chains at any finite temperature", "abstract": "We prove that a quasi-local quantum Gibbs sampler rapidly mixes to the Gibbs state of any 1D finite-range Hamiltonian at all finite temperatures in $\\mathcal{O}\\left(\\log (n/\\varepsilon)\\right)$ time. Each update traces out a contiguous block of constant length and reconstructs it using the Petz recovery map, following early proposals for quantum heat-bath Gibbs samplers by Kastoryano and Brandão~\\cite{kastoryano2016quantum}. Our proof directly bounds the distance between the updated state and the target Gibbs state using quantum Wasserstein distance of order $1$. We further provide $\\mathcal{O}(\\text{polylog}(n/\\varepsilon))$ depth of quantum circuits to prepare these Gibbs states. We hope these techniques will facilitate the analysis and design of other Gibbs samplers.", "url": "https://arxiv.org/abs/2610.01190", "type": "理论", "summary": "我们证明准局域量子吉布斯采样器在所有有限温度下在 $\\mathcal{O}\\left(\\log (n/\\varepsilon)\\right)$ 时间内快速混合到任何一维有限范围哈密顿量的吉布斯状态。每次更新都会追踪出一个恒定长度的连续块，并使用 Petz 恢复图重建它，遵循 Kastoryano 和 Brandão~\\cite{kastoryano2016quantum} 提出的量子热浴吉布斯采样器。我们的证明使用 $1$ 量级的量子 Wasserstein 距离直接限制更新状态和目标吉布斯状态之间的距离。我们进一步提供 $\\mathcal{O}(\\text{polylog}(n/\\varepsilon))$ 量子电路深度来准备这些吉布斯态。我们希望这些技术能够促进其他吉布斯采样器的分析和设计。", "authors": [{"name": "Leeseok Kim"}], "featured_authors": [{"name": "Leeseok Kim"}], "author_count": 1}, {"id": "2610.01209", "category": "quant-ph", "title": "Fermionic Gaussian Scrooge Ensembles in Deep Thermalization", "abstract": "Measuring part of a many-body wave function generates a projected ensemble of pure quantum states on the unmeasured subsystem. Recent advances in deep thermalization have shown that, in chaotic systems, this ensemble universally converges to the maximally random ensemble compatible with its average density matrix, known as the Scrooge ensemble. By contrast, free-fermion systems are nonchaotic, and their quantum states are constrained to remain Gaussian. Motivated by this distinction, we introduce the fermionic Gaussian Scrooge ensemble to describe deep thermalization in generic free-fermion systems. This ensemble is defined as a distortion of the Gaussian Haar ensemble by the average density matrix, and its moments reveal an enlarged symmetry of Gaussian states in the replicated Hilbert space. We demonstrate the emergence of the fermionic Gaussian Scrooge ensemble in two complementary settings: (1) we analytically prove that the projected ensemble of the SYK$_2$ model follows the fermionic Gaussian Scrooge ensemble at arbitrary evolution times; (2) we provide numerical evidence that it emerges at sufficiently long times in random Gaussian circuits with charge conservation. Our results establish the fermionic Gaussian Scrooge ensemble as a universal description of deep thermalization in free-fermion systems.", "url": "https://arxiv.org/abs/2610.01209", "type": "理论+数值", "summary": "多体波函数的测量部分会在未测量的子系统上生成纯量子态的投影系综。深度热化的最新进展表明，在混沌系统中，该系综普遍收敛于与其平均密度矩阵兼容的最大随机系综，称为 Scrooge 系综。相比之下，自由费米子系统是非混沌的，它们的量子态被限制为保持高斯态。受这种区别的启发，我们引入费米子高斯斯克鲁奇系综来描述通用自由费米子系统中的深度热化。该系综被定义为平均密度矩阵对高斯哈尔系综的扭曲，其矩揭示了复制希尔伯特空间中高斯态的放大对称性。我们在两个互补的设置中证明了费米高斯斯克鲁奇系综的出现：（1）我们分析证明了 SYK$_2$ 模型的投影系综在任意演化时间都遵循费米高斯斯克鲁奇系综； （2）我们提供了数值证据，证明它在电荷守恒的随机高斯电路中出现了足够长的时间。\n\n我们的结果将费米子高斯斯克鲁奇系综确立为自由费米子系统中深度热化的通用描述。", "authors": [{"name": "Ning Sun"}, {"name": "Pengfei Zhang"}], "featured_authors": [{"name": "Ning Sun"}, {"name": "Pengfei Zhang"}], "author_count": 2}, {"id": "2610.01277", "category": "quant-ph", "title": "Linear-Time Encodable Quantum Codes near the CSS GV Bound", "abstract": "We construct quantum CSS codes with rate-distance tradeoff approaching the CSS GV bound, which can be encoded by a quantum circuit of logarithmic depth and a linear number of gates. Our construction is heavily inspired by a work of Brehm and Resch and can be viewed as a quantum analogue of classical repeat multiple accumulate codes. The encoder has a particularly simple structure, consisting of a single constant depth outer quantum circuit followed by several classical accumulation and inverse-accumulation layers.", "url": "https://arxiv.org/abs/2610.01277", "type": "理论", "summary": "我们构建了接近 CSS GV 界限的速率-距离权衡的量子 CSS 代码，该代码可以通过对数深度和线性门数的量子电路进行编码。我们的构造很大程度上受到 Brehm 和 Resch 的工作的启发，可以被视为经典重复多重累加码的量子模拟。该编码器具有特别简单的结构，由单个恒定深度的外部量子电路组成，后面是几个经典的累加和逆累加层。", "authors": [{"name": "Rachel Yun Zhang"}], "featured_authors": [{"name": "Rachel Yun Zhang"}], "author_count": 1}, {"id": "2610.01394", "category": "quant-ph", "title": "Vacuum entanglement in a time-dependent electric field", "abstract": "We analyze the correlations of the vacuum state of a charged scalar field by constructing localized observables in two disjoint regions. We consider a time-dependent homogeneous electric field and examine the time evolution of correlations by relating it with the particle-antiparticle creation through the Schwinger effect. Our results show that the electric field increases the mixedness of the states and enhances total correlations, while the distillable entanglement among the regions decreases, vanishing at a finite time for sufficiently intense pulses within the non-perturbative pair-production regime. We also discuss the effect of anisotropy induced by the external background, showing that the distribution of correlations acquires a nontrivial directional dependence.", "url": "https://arxiv.org/abs/2610.01394", "type": "理论+数值", "summary": "我们通过在两个不相交区域构造局部可观测量来分析带电标量场的真空态的相关性。我们考虑随时间变化的均匀电场，并通过施温格效应将其与粒子反粒子的产生联系起来，研究相关性的时间演化。我们的结果表明，电场增加了状态的混合性并增强了总相关性，而区域之间的可蒸馏纠缠减少了，在非微扰对产生范围内足够强的脉冲的有限时间内消失。我们还讨论了外部背景引起的各向异性的影响，表明相关性的分布具有非平凡的方向依赖性。", "authors": [{"name": "Álvaro Álvarez-Dom\\'ınguez"}, {"name": "Luis J. Garay"}, {"name": "Mercedes Mart\\'ın-Benito"}, {"name": "Iker Sanz-González"}], "featured_authors": [{"name": "Álvaro Álvarez-Dom\\'ınguez"}, {"name": "Luis J. Garay"}, {"name": "Mercedes Mart\\'ın-Benito"}, {"name": "Iker Sanz-González"}], "author_count": 4}, {"id": "2610.01521", "category": "quant-ph", "title": "Continuous-Process Randomized Compilation for Quantum Process Tensors", "abstract": "Traditional discrete randomized compiling (RC) tailors errors with random control frames at logical-gate boundaries, but fails to capture intra-instrument control evolution or persistent system-environment coupling. In memory-bearing environments, errors correlate across times, not just single gates. We build continuous-process randomized compilation (CPRC) in the continuous process tensor (cPT) framework, unifying random unitary control trajectories, pointwise-covariant finite-duration instruments, and environmental dynamics on one time axis. We study four protocols: fixed Pauli refresh, bounded Cayley paths, unitary Brownian motion, Ornstein-Uhlenbeck driving. We obtain three key results: (1) Pointwise covariance ensures each trajectory exactly reproduces the target logic without system-environment coupling; a closed-frame counterexample proves endpoint-only compensation causes first-order instrument errors. (2) Independent Pauli conjugations over full intervals diagonalize error histories at boundaries, but classical labels retain environment-induced correlations, confirmed by an exact static-bath solution. (3) We derive a total-variation error bound for full adaptive output records under bounded centered coupling and mixing conditions. We prove convergence of trajectory-averaged cPT coefficients in fixed particle sectors for finite non-Gaussian environments and Gaussian baths with time-integrable covariance, including the uncut Drude spectrum. We numerically validate the theory in a qubit model via output probabilities, operator conditional mutual information, and all two-particle coefficients for both qubit and thermal Drude baths. This work extends RC from discrete circuits to continuous-time memory-bearing quantum processes, offering a unified framework, quantitative tools, implementable schemes, and benchmarks for non-Markovian error tailoring.", "url": "https://arxiv.org/abs/2610.01521", "type": "理论+数值", "summary": "传统的离散随机编译（RC）在逻辑门边界处使用随机控制帧来调整错误，但无法捕获仪器内控制演化或持久的系统环境耦合。在承载内存的环境中，错误与时间相关，而不仅仅是与单个门相关。我们在连续过程张量 (cPT) 框架中构建连续过程随机编译 (CPRC)，将随机单一控制轨迹、逐点协变有限持续时间工具和环境动力学统一在一个时间轴上。我们研究四种协议：固定泡利刷新、有界凯莱路径、酉布朗运动、奥恩斯坦-乌伦贝克驱动。我们获得了三个关键结果：（1）逐点协方差确保每个轨迹准确地再现目标逻辑，而无需系统环境耦合；闭框反例证明仅端点补偿会导致一阶仪器误差。 (2) 整个区间上的独立泡利共轭对边界处的误差历史进行对角化，但经典标签保留了环境引起的相关性，这由精确的静态浴解证实。\n\n(3) 我们推导出在有界中心耦合和混合条件下完全自适应输出记录的总变差误差界。我们证明了有限非高斯环境和具有时间可积协方差的高斯浴的固定粒子扇区中轨迹平均 cPT 系数的收敛性，包括未切割的德鲁德谱。我们通过输出概率、算子条件互信息以及量子位和热德鲁德浴的所有双粒子系数在量子位模型中对理论进行数值验证。这项工作将 RC 从离散电路扩展到连续时间记忆量子过程，为非马尔可夫误差裁剪提供了统一的框架、定量工具、可实现的方案和基准。", "authors": [{"name": "He Wang"}], "featured_authors": [{"name": "He Wang"}], "author_count": 1}, {"id": "2610.01574", "category": "quant-ph", "title": "Adversarial Robustness in Fake Quantum Simulators", "abstract": "This paper investigates the performance scalability and adversarial robustness of Quantum Machine Learning (QML) models deployed on noise-model-based fake simulators. We conduct a dual-phased study, first benchmarking the computational throughput of Qiskit's Aer simulation engine across varying hardware architectures, and second, evaluating the effectiveness of Projected Gradient Descent (PGD) attacks and adversarial retraining strategies under realistic noise conditions. Our results quantify the runtime tradeoffs and scaling behavior for medium-scale simulations (projected up to 8 qubits) and demonstrate that high adversarial-to-benign retraining ratios (50/50) are essential for achieving practical model robustness for 4-qubit classifiers under realistic noise conditions.", "url": "https://arxiv.org/abs/2610.01574", "type": "理论+数值", "summary": "本文研究了部署在基于噪声模型的假模拟器上的量子机器学习（QML）模型的性能可扩展性和对抗鲁棒性。我们进行了双阶段研究，首先对 Qiskit 的 Aer 模拟引擎在不同硬件架构上的计算吞吐量进行基准测试，其次评估投影梯度下降 (PGD) 攻击和对抗性再训练策略在现实噪声条件下的有效性。我们的结果量化了中等规模模拟（预计最多 8 个量子位）的运行时权衡和扩展行为，并证明高对抗性与良性再训练比率 (50/50) 对于在现实噪声条件下实现 4 量子位分类器的实际模型鲁棒性至关重要。", "authors": [{"name": "Marc Maußner"}, {"name": "Volker Reers"}], "featured_authors": [{"name": "Marc Maußner"}, {"name": "Volker Reers"}], "author_count": 2}, {"id": "2610.01669", "category": "quant-ph", "title": "Dissipation-Enabled Operator-Norm Locality Bounds for Bose-Hubbard Hamiltonians", "abstract": "Closed bosonic lattice systems do not generally admit operator norm Lieb--Robinson bounds uniformly in the initial state. The reason is that the information propagation velocity can grow with the local boson occupancy, which can be macroscopically large. Here, we show that local dissipation restores an operator-norm Lieb--Robinson bound. We consider the dissipative Bose--Hubbard model described by a Lindbladian operator with on-site $\\ell$-photon loss, $\\ell>2$ and, for our main result, we establish an almost-ballistic Lieb-Robinson bound. Dissipation rapidly depletes highly occupied sites, thus regularizing the state on the Sobolev-type scale of local particle moments. The resulting moment bounds diverge as time approaches zero but remain integrable near zero at sufficiently low orders. We extend these ideas to treat cat-code dissipation and, for initial states in the code space, we prove a local adiabatic approximation uniform in the total volume. Further consequences include local channel approximation, a thermodynamic limit, and efficient digital quantum simulation. The point is that these applications are now available \\textit{uniformly in the input state}, as for quantum spin systems, but in contrast to closed Bose--Hubbard systems.", "url": "https://arxiv.org/abs/2610.01669", "type": "理论+数值", "summary": "闭合玻色子晶格系统通常不允许算子范数 Lieb-Robinson 在初始状态下均匀有界。原因是信息传播速度会随着局部玻色子占有率的增加而增长，而局部玻色子占有率在宏观上可能很大。在这里，我们证明局部耗散恢复算子范数 Lieb-Robinson 界。我们考虑 Lindbladian 算子描述的耗散 Bose--Hubbard 模型，具有现场 $\\ell$-光子损失，$\\ell>2$，并且对于我们的主要结果，我们建立了一个几乎弹道的 Lieb-Robinson 界。耗散迅速耗尽高度占据的位点，从而规范局部粒子矩的索博列夫型尺度上的状态。随着时间接近零，所得的矩边界发散，但在足够低的阶数下仍可在零附近积分。我们将这些想法扩展到处理猫代码耗散，并且对于代码空间中的初始状态，我们证明了总体积中的局部绝热近似均匀。进一步的结果包括局部通道近似、热力学极限和高效的数字量子模拟。\n\n关键是，对于量子自旋系统，这些应用程序现在可以\\textit{在输入状态下一致}使用，但与封闭的玻色-哈伯德系统相反。", "authors": [{"name": "Marius Lemm"}, {"name": "Tim Möbus"}], "featured_authors": [{"name": "Marius Lemm"}, {"name": "Tim Möbus"}], "author_count": 2}, {"id": "2610.01683", "category": "quant-ph", "title": "A Code-Agnostic Graph Neural Network Decoder from the Detection Error Model", "abstract": "We present POLYMECHANON, a graph neural network (GNN) decoder for quantum error correction whose only input is the detection error model (DEM) of a quantum code under a given noise model. We represent the DEM as a tripartite graph of detectors, error mechanisms and logical observables, where every input feature is computed by using the quantum code as data rather than design choice. In this way, the same architecture decodes in principle any stabiliser code, under any noise model that can be expressed as a detection error model, once trained on the DEM. We test this approach along four directions. Firstly, on the rotated surface code the decoder outperforms correlated MWPM under both phenomenological and circuit-level noise, with up to $25\\%$ fewer logical failures. Secondly, on a family of high-rate qLDPC codes it matches BP+OSD on the smaller codes and surpasses it on the larger ones, with up to $16\\%$ fewer logical failures on $[\\![130,4,6]\\!]$. Thirdly, its decoding time does not depend on the physical error rate, whereas that of BP+OSD grows with it: on $[\\![130,4,6]\\!]$ its effective cost per shot is of the order of a few ms on a single GPU against a few tens of milliseconds for BP+OSD on a single CPU core, and its fixed computational graph makes it a candidate for real-time decoding on neutral-atom processors. Finally, a single model trained across codes of different families outperforms uncorrelated MWPM on the graph-like codes seen during training and stays within $10\\%$ of BP+OSD on the others, while it tends to fail to generalize to unseen codes, particularly larger ones. Its probabilistic output enables confidence-based post-selection, lowering the logical error rate by more than an order of magnitude on the surface code while keeping more than $90\\%$ of the shots. Since only the DEM changes, new codes and noise models can be decoded without redesigning the decoder.", "url": "https://arxiv.org/abs/2610.01683", "type": "理论+数值", "summary": "我们提出了 POLYMECHANON，一种用于量子纠错的图神经网络 (GNN) 解码器，其唯一输入是给定噪声模型下量子代码的检测误差模型 (DEM)。我们将 DEM 表示为检测器、错误机制和逻辑可观察量的三方图，其中每个输入特征都是通过使用量子代码作为数据而不是设计选择来计算的。这样，一旦在 DEM 上训练，相同的架构原则上可以在任何可以表示为检测误差模型的噪声模型下解码任何稳定器代码。我们沿着四个方向测试这种方法。首先，在旋转表面代码上，在现象学和电路级噪声下，解码器的性能优于相关 MWPM，逻辑故障减少高达 $25\\%$。其次，在一系列高速率 qLDPC 代码上，它在较小的代码上与 BP+OSD 相匹配，并在较大的代码上超越它，$[\\![130,4,6]\\!]$ 上的逻辑故障减少高达 $16\\%$。\n\n第三，它的解码时间不依赖于物理错误率，而 BP+OSD 的解码时间随之增长：在 $[\\![130,4,6]\\!]$ 上，其每次拍摄的有效成本在单个 GPU 上约为几毫秒，而 BP+OSD 在单个 CPU 核心上为几十毫秒，并且其固定的计算图使其成为中性原子处理器上实时解码的候选者。最后，在不同系列的代码上训练的单一模型在训练期间看到的类图代码上优于不相关的 MWPM，并且在其他代码上保持在 BP+OSD 的 10\\%$ 以内，而它往往无法泛化到未见过的代码，尤其是较大的代码。其概率输出支持基于置信度的后选择，将表面代码上的逻辑错误率降低一个数量级以上，同时保留超过 90\\%$ 的镜头。由于仅 DEM 发生变化，因此无需重新设计解码器即可解码新的代码和噪声模型。", "authors": [{"name": "Federico Alberto Astolfi"}, {"name": "Guido Pupillo"}], "featured_authors": [{"name": "Federico Alberto Astolfi"}, {"name": "Guido Pupillo"}], "author_count": 2}, {"id": "2610.01684", "category": "quant-ph", "title": "Mentor-Initiated Asymmetric Bidirectional Quantum Teleportation Protocol for Arbitrary Qubit States", "abstract": "In this paper, a mentor-initiated bidirectional asymmetric quantum teleportation protocol is proposed. Unlike existing schemes that restrict the two-qubit state transmitted from Bob to Alice to a Bell-like form $\\alpha|00\\rangle+\\beta|11\\rangle$, our protocol allows an arbitrary two-qubit state to be teleported from Bob to Alice within the mentor-initiated framework. The required entangled resources are constructed using standard quantum gates, and the protocol is illustrated through its quantum-circuit implementation in Qiskit.", "url": "https://arxiv.org/abs/2610.01684", "type": "理论", "summary": "在本文中，提出了一种由导师发起的双向非对称量子隐形传态协议。与现有方案将从 Bob 传输到 Alice 的二量子位状态限制为类似于 Bell 的形式 $\\alpha|00\\rangle+\\beta|11\\rangle$ 不同，我们的协议允许在导师发起的框架内将任意二量子位状态从 Bob 传送到 Alice。所需的纠缠资源是使用标准量子门构建的，并且该协议通过 Qiskit 中的量子电路实现进行了说明。", "authors": [{"name": "Sugata Adhya"}, {"name": "Benchao Yang"}], "featured_authors": [{"name": "Sugata Adhya"}, {"name": "Benchao Yang"}], "author_count": 2}, {"id": "2610.01693", "category": "quant-ph", "title": "Predicting electric-field noise in ion traps using fluctuation electrodynamics", "abstract": "Electric-field noise in microfabricated surface ion traps contributes to gate errors in trapped-ion quantum computers, but this noise has been challenging to predict. Here, we present a method to predict the electric-field noise arising from fluctuations in the bulk of dielectric and metallic materials. The method is valid for arbitrary trap geometries, and the only relevant material property is energy loss. We apply it to an ion trap with an electrically floating electrode and find the contribution from dielectrics to be dominant. Our model predicts the observed noise for this trap within a factor of four. In addition, we apply our model to typical surface trap designs and analyze how the electrode structures shield the noise.", "url": "https://arxiv.org/abs/2610.01693", "type": "理论", "summary": "微加工表面离子陷阱中的电场噪声会导致捕获离子量子计算机中的门错误，但这种噪声很难预测。在这里，我们提出了一种预测由大量介电和金属材料波动引起的电场噪声的方法。该方法对于任意陷阱几何形状都有效，唯一相关的材料属性是能量损失。我们将其应用于具有电浮动电极的离子阱，并发现电介质的贡献占主导地位。我们的模型将观察到的该陷阱噪声的预测值控制在四倍以内。此外，我们将我们的模型应用于典型的表面陷阱设计，并分析电极结构如何屏蔽噪声。", "authors": [{"name": "Markus Teller"}, {"name": "Da An"}, {"name": "Alberto M. Alonso"}, {"name": "Philip C. Holz"}, {"name": "Philipp Schindler"}, {"name": "Hartmut Häffner"}, {"name": "Tracy E. Northup"}], "featured_authors": [{"name": "Markus Teller"}, {"name": "Da An"}, {"name": "Alberto M. Alonso"}, {"name": "Philipp Schindler"}, {"name": "Hartmut Häffner"}, {"name": "Tracy E. Northup"}], "author_count": 7}, {"id": "2610.01752", "category": "quant-ph", "title": "Near-optimal quantum query lower bounds on bipartiteness and expansion testing in the bounded-degree graph model", "abstract": "In this work, we study bipartiteness and expansion testing, two canonical problems in graph property testing in the bounded-degree model through the lens of quantum query complexity. In the classical setting, it is known that $\\widetilde{\\Theta}(\\sqrt{N})$ queries are necessary and sufficient for both these testing problems (Goldreich and Ron, 1999, 2000 & 2002), where $N$ denotes the number of vertices of the input graph. Due to their significance, (Ambainis, Childs, and Liu, 2011) initiated the study of these problems in the quantum setting and designed quantum algorithms for bipartiteness and expansion testing that perform $\\widetilde{O}(N^{1/3})$ queries, showing a polynomial speedup. They also proved that $\\widetilde{\\Omega}(N^{1/4})$ queries are necessary for expansion testing, but the possibility of an exponential quantum advantage for bipartiteness testing remained open. Despite significant effort, there has been no improvement in these results in the last decade and a half. In this work, we prove essentially tight $\\widetilde{\\Omega}(N^{1/3})$ quantum query lower bounds for both bipartiteness and expansion testing, thereby completely characterizing the quantum query complexity of these problems up to polylogarithmic factors. While our proofs use the polynomial method similarly to Ambainis, Childs, and Liu, we use intermediate problems that we relate to the main problems via reductions, and perform a more precise analysis of the resulting polynomials, leading to the near-optimal lower bounds.", "url": "https://arxiv.org/abs/2610.01752", "type": "理论+数值", "summary": "在这项工作中，我们从量子查询复杂性的角度研究二分性和扩展测试，这是有界度模型中图属性测试的两个典型问题。在经典设置中，已知 $\\widetilde{\\Theta}(\\sqrt{N})$ 查询对于这两个测试问题都是必要且充分的（Goldreich and Ron, 1999, 2000 & 2002），其中 $N$ 表示输入图的顶点数。由于它们的重要性，（Ambainis、Childs 和 Liu，2011）开始在量子环境中研究这些问题，并设计了用于执行 $\\widetilde{O}(N^{1/3})$ 查询的二分性和扩展测试的量子算法，显示出多项式加速。他们还证明了 $\\widetilde{\\Omega}(N^{1/4})$ 查询对于扩展测试是必要的，但二分性测试的指数量子优势的可能性仍然存在。尽管付出了巨大的努力，但在过去十五年里这些结果并没有任何改善。\n\n在这项工作中，我们证明了二分性和扩展测试的本质上严格的 $\\widetilde{\\Omega}(N^{1/3})$ 量子查询下界，从而完全表征了这些问题的量子查询复杂性达到多对数因子。虽然我们的证明使用与 Ambainis、Childs 和 Liu 类似的多项式方法，但我们使用通过归约与主要问题相关的中间问题，并对所得多项式进行更精确的分析，从而得到接近最优的下界。", "authors": [{"name": "Chandrima Kayal"}, {"name": "Sayantan Sen"}, {"name": "Dániel Szabó"}], "featured_authors": [{"name": "Chandrima Kayal"}, {"name": "Sayantan Sen"}, {"name": "Dániel Szabó"}], "author_count": 3}, {"id": "2610.01814", "category": "quant-ph", "title": "Collision models: Markovian and Non-Markovian impurity models", "abstract": "Collision models provide a flexible framework for studying open quantum systems and introducing non-Markovianity. We present a novel class of collision models, which we term Markovian impurity models, motivated by physical scenarios in which information backflow is periodically blocked. Using the Breuer-Laine-Piilo (BLP) measure of non-Markovianity, we show that if a $p$-impurity model is non-Markovian, then the corresponding $(p+1)$-impurity model is also non-Markovian, implying the existence of a critical $p$ at which the process transitions from Markovian to non-Markovian. Numerical simulations are used to investigate how this critical parameter depends on the system-ancilla and ancilla-ancilla interaction strengths. We find that, altough exceptions exist, increasing either interaction strength generally lowers the critical $p$, while sufficiently weak ancilla-ancilla interactions lead to a regime in which the dynamics remain Markovian even in the absence of impurities. Finally, we briefly introduce the complementary non-Markovian impurity model.", "url": "https://arxiv.org/abs/2610.01814", "type": "理论+数值", "summary": "碰撞模型为研究开放量子系统和引入非马尔可夫性提供了灵活的框架。我们提出了一类新颖的碰撞模型，我们将其称为马尔可夫杂质模型，其动机是信息回流被周期性阻止的物理场景。使用非马尔可夫性的 Breuer-Laine-Piilo (BLP) 度量，我们表明，如果 $p$-杂质模型是非马尔可夫模型，则相应的 $(p+1)$-杂质模型也是非马尔可夫模型，这意味着存在一个临界 $p$，在此过程从马尔可夫转变为非马尔可夫。数值模拟用于研究这个关键参数如何取决于系统-辅助和辅助-辅助相互作用强度。我们发现，尽管存在例外，但增加任一相互作用强度通常会降低临界 $p$，而足够弱的辅助-辅助相互作用会导致即使在不存在杂质的情况下动力学仍保持马尔可夫的状态。最后，我们简要介绍了互补的非马尔可夫杂质模型。", "authors": [{"name": "Jacob Werner"}], "featured_authors": [{"name": "Jacob Werner"}], "author_count": 1}, {"id": "2610.01824", "category": "quant-ph", "title": "QPI-DeepONet-MAC: A Scalable and Stable Hybrid Classical-Quantum Architecture for Physics-Informed Deep Operator Networks", "abstract": "General operator learning for parametric partial differential equations (PDEs) is a fundamental challenge at the intersection of artificial intelligence and physics-based modeling. Physics-informed Deep Operator Networks (PI-DeepONets) incorporate governing equations into learning, but face optimization difficulties in high dimensions. Quantum extensions offer additional representational capacity, yet their trainability can be hindered by barren plateaus. Here, we introduce QPI-DeepONet-MAC, a hybrid quantum-classical architecture that integrates parameterized quantum circuits into PI-DeepONets through a multiplicative-and-additive coupling (MAC) of classical representations and quantum expectation values. We prove analytically that the proposed architecture retains universal operator approximation capabilities. Furthermore, we derive bounds on quantum parameter gradients, establishing explicit conditions to avoid barren plateaus alongside a scaling criterion for trainability. Additionally, we derive a lower bound on the number of sensors required for a target accuracy, directly linking sampling requirements to input function regularity, domain dimension, and PDE dynamical growth. Finally, we propose an informational regularization scheme based on quantum coherence and state fidelity dynamics to prevent coherence loss and preserve quantum structure during training. Together, these results establish a theoretical foundation for quantum-enhanced physics-informed operator learning and position QPI-DeepONet-MAC as a scalable, stable framework for solving parametric PDEs.", "url": "https://arxiv.org/abs/2610.01824", "type": "理论+数值", "summary": "参数偏微分方程 (PDE) 的通用算子学习是人工智能和基于物理的建模交叉领域的一项基本挑战。物理信息深度算子网络（PI-DeepONets）将控制方程纳入学习中，但面临高维优化困难。量子扩展提供了额外的表征能力，但它们的可训练性可能会受到贫瘠平台的阻碍。在这里，我们介绍 QPI-DeepONet-MAC，这是一种混合量子经典架构，通过经典表示和量子期望值的乘加耦合 (MAC) 将参数化量子电路集成到 PI-DeepONet 中。我们通过分析证明所提出的架构保留了通用算子逼近功能。此外，我们推导出量子参数梯度的界限，建立明确的条件以避免贫瘠的高原以及可训练性的缩放标准。此外，我们得出了目标精度所需的传感器数量的下限，将采样要求与输入函数规律性、域维度和 PDE 动态增长直接联系起来。\n\n最后，我们提出了一种基于量子相干性和状态保真度动力学的信息正则化方案，以防止相干性损失并在训练过程中保留量子结构。这些结果共同为量子增强物理信息算子学习奠定了理论基础，并将 QPI-DeepONet-MAC 定位为求解参数偏微分方程的可扩展、稳定的框架。", "authors": [{"name": "Said Lantigua"}, {"name": "José Valencia"}, {"name": "Gilson Giraldi"}, {"name": "Renato Portugal"}, {"name": "Jonas Maziero"}], "featured_authors": [{"name": "Said Lantigua"}, {"name": "José Valencia"}, {"name": "Gilson Giraldi"}, {"name": "Renato Portugal"}, {"name": "Jonas Maziero"}], "author_count": 5}, {"id": "2610.01839", "category": "quant-ph", "title": "Toward Optimal Circuit Depth for Geometrically Local Hamiltonian Simulation", "abstract": "Understanding the dynamics of interacting quantum systems is a central goal of quantum simulation. For geometrically local Hamiltonians, locality suggests that digital simulation should retain much of the parallelism of the underlying dynamics. For a target accuracy $\\epsilon$, we construct a nearest-neighbor quantum circuit that simulates the dynamics of an $n$-qubit, time-independent, finite-range Hamiltonian with normalized local interaction strength on a fixed-dimensional lattice for time $T\\ge1$, with circuit depth $O(T\\log(nT/\\epsilon))$ and gate count $O(nT\\log(nT/\\epsilon))$. This reduces the polylogarithmic overhead of Haah, Hastings, Kothari, and Low to a single logarithm. On logarithmic-scale blocks from the Lieb--Robinson decomposition, a shallow but highly accurate implementation is essential for reducing the circuit depth. Our key observation is that spatial localization also controls the cost of high precision. In each block, the error of a constant-order product formula is compensated for by a correction, yielding exponential accuracy. The correction can be implemented with depth proportional to the block diameter, introducing no additional asymptotic depth scale beyond that required by spatial localization. Furthermore, we prove an unconditional circuit-depth lower bound for uniform XXZ Hamiltonians: at fixed evolution time $T$ in the stated regime and sufficiently small fixed error $\\epsilon$, any nearest-neighbor quantum circuit simulating these dynamics requires depth $\\Omega(\\log n/\\log\\log n)$. This matches our $O(\\log n)$ upper bound up to a doubly logarithmic factor, establishing near-optimal circuit depth for lattice Hamiltonian simulation in this regime. Together, these results clarify the role of locality and precision in determining the circuit complexity of quantum dynamics and suggest broader principles for spatially constrained quantum computation.", "url": "https://arxiv.org/abs/2610.01839", "type": "理论+数值", "summary": "了解相互作用的量子系统的动力学是量子模拟的核心目标。对于几何局部哈密顿量，局部性表明数字模拟应该保留基础动力学的大部分并行性。对于目标精度$\\epsilon$，我们构建了一个最近邻量子电路，该电路模拟$n$量子位、与时间无关、有限范围哈密顿量的动力学，在时间$T\\ge1$的固定维晶格上具有归一化局部相互作用强度，电路深度为$O(T\\log(nT/\\epsilon))$和门数$O(nT\\log(nT/\\epsilon))$。这会将 Haah、Hastings、Kothari 和 Low 的多对数开销减少到单个对数。在 Lieb-Robinson 分解的对数尺度块上，浅层但高精度的实现对于减少电路深度至关重要。我们的主要观察是，空间定位还控制着高精度的成本。在每个块中，常量阶乘积公式的误差通过校正来补偿，从而产生指数精度。\n\n可以利用与块直径成比例的深度来实现校正，除了空间定位所需的深度之外，不会引入额外的渐近深度尺度。此外，我们证明了均匀 XXZ 哈密顿量的无条件电路深度下界：在规定状态下的固定演化时间 $T$ 和足够小的固定误差 $\\epsilon$ 下，任何模拟这些动力学的最近邻量子电路都需要深度 $\\Omega(\\log n/\\log\\log n)$。这与我们的 $O(\\log n)$ 上限与双对数因子相匹配，从而为该状态下的晶格哈密顿模拟建立了近乎最佳的电路深度。总之，这些结果阐明了局域性和精度在确定量子动力学电路复杂性中的作用，并为空间约束量子计算提出了更广泛的原理。", "authors": [{"name": "Zhenyu Shen"}, {"name": "Yusen Wu"}, {"name": "Penghui Yao"}, {"name": "Xiao Yuan"}, {"name": "Yukun Zhang"}], "featured_authors": [{"name": "Zhenyu Shen"}, {"name": "Yusen Wu"}, {"name": "Penghui Yao"}, {"name": "Xiao Yuan"}, {"name": "Yukun Zhang"}], "author_count": 5}, {"id": "2610.01848", "category": "quant-ph", "title": "Trapdoored Clifford Operators and Applications", "abstract": "Random Clifford operators have numerous applications in quantum computing, including randomized benchmarking, classical shadows, and quantum authentication. However, sampling and implementing uniformly random $n$-qubit Clifford incur near-quadratic complexity due to the size of Clifford group. We introduce a cryptographic way to overcome these barriers: trapdoored Clifford operator distributions whose samples are computationally indistinguishable from uniformly random Cliffords, yet implementing them can be much faster given the trapdoor. We construct a distribution of trapdoored Clifford operators whose elements can be sampled and implemented in near-linear time under a variant of the learning parity with noise assumption. Our constructions allow fast tableau action on Pauli labels for classical simulation, and also can be optimized to admit polylogarithmic-depth implementation. Along the way, we construct trapdoored matrices over finite fields that support efficient multiplication by both a matrix and its inverse, resolving an open question left by Vaikuntanathan and Zamir [SODA'26]. We use these constructions to obtain faster protocols based on random Cliffords. We also explore their applications to the worst-case to average-case reductions for matrix and Clifford problems including the iterated matrix multiplication and Clifford circuit synthesis. In particular, we show the hardness of batching Clifford circuits: synthesizing circuits that apply the same Clifford to multiple registers is at least as hard as worst-case matrix multiplication, even when synthesis succeeds on a small constant fraction of random Cliffords. This extends to approximate implementations by general quantum circuits.", "url": "https://arxiv.org/abs/2610.01848", "type": "数值", "summary": "随机 Clifford 算子在量子计算中有许多应用，包括随机基准测试、经典阴影和量子身份验证。然而，由于 Clifford 群的规模，采样和实现均匀随机 $n$-qubit Clifford 会产生接近二次方的复杂性。我们引入了一种加密方法来克服这些障碍：陷门 Clifford 算子分布，其样本在计算上与均匀随机的 Clifford 分布无法区分，但考虑到陷门，实现它们可以更快。我们构建了陷门 Clifford 算子的分布，其元素可以在带有噪声假设的学习奇偶校验的变体下以近线性时间进行采样和实现。我们的结构允许在泡利标签上进行快速的画面动作以进行经典模拟，并且还可以进行优化以允许多对数深度实现。在此过程中，我们在有限域上构造了陷门矩阵，支持矩阵及其逆矩阵的有效乘法，解决了 Vaikuntanathan 和 Zamir [SODA'26] 留下的悬而未决的问题。我们使用这些结构来获得基于随机 Cliffords 的更快协议。\n\n我们还探讨了它们在矩阵和 Clifford 问题的最坏情况到平均情况简化方面的应用，包括迭代矩阵乘法和 Clifford 电路综合。特别是，我们展示了批处理 Clifford 电路的难度：将相同 Clifford 应用于多个寄存器的合成电路至少与最坏情况矩阵乘法一样困难，即使在随机 Clifford 的小常数部分上合成成功时也是如此。这扩展到通用量子电路的近似实现。", "authors": [{"name": "Minki Hhan"}, {"name": "Hojune Lee"}], "featured_authors": [{"name": "Minki Hhan"}, {"name": "Hojune Lee"}], "author_count": 2}, {"id": "2610.01855", "category": "quant-ph", "title": "Quantum Optimal Transport Barycenters: Existence, Duality, and Gaussian Rigidity", "abstract": "We develop a Quantum Optimal Transport (QOT) barycenter framework for quantum states, as an analog of Wasserstein barycenters~\\cite{AguCar}, and establish existence and duality results for a broad class of possibly unbounded transport costs on separable Hilbert spaces. Our framework provides, in particular, a unified treatment of $2$-quantum Wasserstein (QW) barycenters in both the quantum-state and quantum-channel formulations by specializing to the canonical quadratic cost operators associated with the $2$-quantum Wasserstein distances of Caglioti--Golse--Mouhot--Paul~\\cite{caglioti2021towards,Golse-Mouhot-Paul:2016} and De Palma--Trevisan~\\cite{DPaTre19}. The central results concern Gaussian input states and, in particular, Gaussian rigidity: whether Gaussian input states force the 2-QW barycenter itself to be Gaussian and uniquely determined when the minimization is taken over all quantum states. We first show that the barycenter problem admits a Gaussian minimizer and reduces to a finite-dimensional convex optimization problem over covariance matrices. The main difficulty is that uniqueness of the optimal covariance does not, in general, imply uniqueness of the underlying quantum state. We bridge this gap through a state-reconstruction principle under covariance complementary slackness that upgrades uniqueness of the optimal covariance to uniqueness of the full quantum state, and thereby prove a global rigidity theorem: if at least one Gaussian input is faithful, then the barycenter is unique among all quantum states and is necessarily Gaussian. Faithfulness is sufficient but not necessary: families of pure inputs still determine a unique barycenter, whereas partially pure nonfaithful Gaussian inputs may admit multiple barycenters.", "url": "https://arxiv.org/abs/2610.01855", "type": "理论+数值", "summary": "我们为量子态开发了一个量子最优输运（QOT）重心框架，作为 Wasserstein 重心的类似物~\\cite{AguCar}，并为可分离希尔伯特空间上的一类可能无界的输运成本建立了存在性和对偶性结果。特别是，我们的框架通过专门研究与 Caglioti--Golse--Mouhot--Paul~\\cite{caglioti2021towards,Golse-Mouhot-Paul:2016} 和 De 的 2$-量子 Wasserstein 距离相关的规范二次成本算子，在量子态和量子通道公式中提供了对 2$-量子 Wasserstein (QW) 重心的统一处理帕尔马--特雷维桑~\\cite{DPaTre19}。中心结果涉及高斯输入状态，特别是高斯刚性：高斯输入状态是否迫使 2-QW 质心本身呈高斯分布，并且在对所有量子态进行最小化时唯一确定。我们首先证明重心问题允许高斯最小化并简化为协方差矩阵上的有限维凸优化问题。\n\n主要困难在于，最优协方差的唯一性通常并不意味着底层量子态的唯一性。我们通过协方差互补松弛下的状态重建原理来弥补这一差距，将最优协方差的唯一性升级为全量子态的唯一性，从而证明全局刚性定理：如果至少一个高斯输入是忠实的，那么重心在所有量子态中是唯一的，并且必然是高斯的。忠实度是足够的，但不是必要的：纯输入族仍然确定唯一的重心，而部分纯的非忠实高斯输入可能会承认多个重心。", "authors": [{"name": "Augusto Gerolin"}, {"name": "Zhiyi Lin"}], "featured_authors": [{"name": "Augusto Gerolin"}, {"name": "Zhiyi Lin"}], "author_count": 2}, {"id": "2610.01860", "category": "quant-ph", "title": "Approximation theorems for fermionic Gaussian states", "abstract": "A recurring principle in many-body physics is that sufficiently distributed interactions or correlations lead to an effectively mean-field description. For fermionic Gaussian states, we establish a quantitative version of this principle directly at the level of Majorana covariance matrices. The main observation is that the admissibility condition for fermionic covariance matrices imposes a quantitative monogamy constraint on two-point correlations: a fixed region has only a bounded covariance budget to distribute among many disjoint regions. We use this principle in three directions. First, for quadratic fermionic Hamiltonians on finite simple graphs of high degree, we obtain product-state approximations to both the ground-state energy and the finite-temperature free energy, with error of order \\(D^{-1/2}\\) for \\(D\\)-regular graphs. Second, we prove a finite fermionic Gaussian de Finetti theorem: a \\(k\\)-copy Gaussian state that is \\(n\\)-exchangeable under graded fermionic copy permutations is \\(O(k/n)\\)-close in trace norm to the product of its one-copy marginal. In particular, infinite exchangeability within the Gaussian class implies exact product structure. Third, for spatial fermionic Gaussian states with exponentially clustering mutual information, we prove that the conditional mutual information across a separating buffer decays as \\(O(r^{-1})\\), and hence, by recoverability, the state admits an \\(O(r^{-1/2})\\) trace-norm approximation by a recovered state. These results show that product and de Finetti approximations and recoverability estimates for fermionic Gaussian systems can all be derived directly from covariance-level structure.", "url": "https://arxiv.org/abs/2610.01860", "type": "理论", "summary": "多体物理学中的一个反复出现的原理是，充分分布的相互作用或相关性可以产生有效的平均场描述。对于费米子高斯态，我们直接在马约拉纳协方差矩阵层面建立了该原理的定量版本。主要观察结果是，费米子协方差矩阵的可接受条件对两点相关性施加了定量的一夫一妻制约束：固定区域仅具有有界协方差预算来分布在许多不相交的区域之间。我们在三个方向上运用这一原则。首先，对于高次有限简单图上的二次费米子哈密顿量，我们获得基态能量和有限温度自由能的乘积态近似，对于\\(D\\)-正则图，误差为\\(D^{-1/2}\\)。其次，我们证明了有限费米高斯 de Finetti 定理：在分级费米子副本排列下可交换的 k 副本高斯状态是 O(k/n) ，其迹范数接近于其单副本边际的乘积。特别是，高斯类内的无限可交换性意味着精确的乘积结构。\n\n第三，对于具有指数聚类互信息的空间费米子高斯状态，我们证明了分离缓冲区上的条件互信息衰减为\\(O(r^{-1})\\)，因此，通过可恢复性，状态允许恢复状态的\\(O(r^{-1/2})\\)迹范数近似。这些结果表明，费米高斯系统的乘积和 de Finetti 近似以及可恢复性估计都可以直接从协方差级别结构中导出。", "authors": [{"name": "Amir-Reza Negari"}, {"name": "Farzin Salek"}, {"name": "Zoltán Zimborás"}, {"name": "Aram Harrow"}, {"name": "Patrick Hayden"}, {"name": "Jens Eisert"}], "featured_authors": [{"name": "Amir-Reza Negari"}, {"name": "Farzin Salek"}, {"name": "Zoltán Zimborás"}, {"name": "Aram Harrow"}, {"name": "Patrick Hayden"}, {"name": "Jens Eisert"}], "author_count": 6}, {"id": "2610.01874", "category": "quant-ph", "title": "Fourier Symmetrization for Geometric Quantum Machine Learning", "abstract": "Geometric quantum machine learning incorporates symmetry into quantum models, but how symmetry shapes their expressivity and guides effective model design remains insufficiently understood. We address this question through the Fourier representation of quantum Fourier models (QFMs). Symmetry organizes the frequency spectrum into orbits and sums the Fourier coefficients within each orbit into a symmetrized coefficient. When QFM trainable layers form independent exact 2-designs, the variance of each symmetrized coefficient equals the sum of the coefficient variances in its orbit. For single-layer QFMs with $\\varepsilon$-approximate 2-design trainable layers, we bound the deviation from this identity. The resulting bound for individual Fourier coefficients can be exponentially tighter than an existing bound. The hyperoctahedral group provides an example of orbit growth that can mitigate vanishing expressivity of the symmetrized coefficients. Symmetrization of QFMs over an elementary abelian 2-group also yields pure multivariate Chebyshev polynomial basis functions. We introduce randomized encoding, which implements invariant models without ancilla qubits or the additional circuit depth for quantum twirling. We evaluate the models as quantum physics-informed neural networks (QPINNs) on two-dimensional screened Poisson and stationary viscous Hamilton-Jacobi equations. Under hard boundary constraints, QPINNs using exact symmetrization and randomized encoding achieve the lowest mean errors in the two benchmarks, respectively.", "url": "https://arxiv.org/abs/2610.01874", "type": "理论+数值", "summary": "几何量子机器学习将对称性融入到量子模型中，但对称性如何塑造其表现力并指导有效的模型设计仍然没有得到充分理解。我们通过量子傅里叶模型（QFM）的傅里叶表示来解决这个问题。对称性将频谱组织成轨道，并将每个轨道内的傅里叶系数求和为对称系数。当 QFM 可训练层形成独立的精确 2 设计时，每个对称系数的方差等于其轨道上的系数方差之和。对于具有 $\\varepsilon$ 近似 2 设计可训练层的单层 QFM，我们限制了与此恒等式的偏差。单个傅里叶系数的所得界限可能比现有界限呈指数形式紧。超八面体群提供了轨道增长的示例，可以减轻对称系数的表达性消失。 QFM 在基本阿贝尔 2 群上的对称化也产生纯多元切比雪夫多项式基函数。\n\n我们引入了随机编码，它无需辅助量子位或量子旋转的额外电路深度即可实现不变模型。我们在二维筛选泊松方程和稳态粘性汉密尔顿-雅可比方程上将模型评估为基于量子物理的神经网络 (QPINN)。在硬边界约束下，使用精确对称化和随机编码的 QPINN 分别在两个基准测试中实现了最低的平均误差。", "authors": [{"name": "Letao Wang"}, {"name": "Abdel Lisser"}, {"name": "Sreejith Sreekumar"}, {"name": "Zeno Toffano"}], "featured_authors": [{"name": "Letao Wang"}, {"name": "Abdel Lisser"}, {"name": "Sreejith Sreekumar"}, {"name": "Zeno Toffano"}], "author_count": 4}, {"id": "2610.01878", "category": "quant-ph", "title": "Floquet-Universal Hamiltonian Simulation", "abstract": "Analogue and digital Hamiltonian simulation represent two distinct approaches to making one quantum system replicate the physical properties of another, with consequences ranging from practical applications to complexity theory and quantum gravity. They are rooted in two distinct regimes of quantum dynamics: time-independent Hamiltonians for the former; fully controllable time-dependent quantum circuits in the latter. Time-periodic Hamiltonians represent an intermediate regime. In this work, we establish a theory of Floquet simulation where we use periodically driven Hamiltonians to synthesise time-independent ones. We show that a set of interactions $S$ can Floquet-simulate every Hamiltonian in the Lie algebra $\\mathrm{Lie}(S)$, and consequently we give a complete and constructive characterisation of Floquet-universal Hamiltonians that are able to produce any target Hamiltonian. Notably, our construction uses only $O(1)$ local interaction strengths and ratios thereof, avoiding the impractical multi-scale local interaction strengths often required in analogue simulation via time-independent Hamiltonians. Instead, the construction requires a range of driving frequencies which scales polynomially with system size for important classes such as $k$-local lattice Hamiltonians. This has immediate complexity-theoretic implications, including numerous BQP-completeness and QMA-hardness results for natural physical properties and quantities studied in Floquet physics.", "url": "https://arxiv.org/abs/2610.01878", "type": "理论+数值", "summary": "模拟和数字哈密顿模拟代表了两种不同的方法，使一个量子系统复制另一个量子系统的物理特性，其后果从实际应用到复杂性理论和量子引力。它们植根于两种不同的量子动力学体系：前者是与时间无关的哈密顿量；后者是与时间无关的哈密顿量。后者是完全可控的时间相关量子电路。时间周期哈密顿量代表中间状态。在这项工作中，我们建立了 Floquet 模拟理论，其中我们使用周期性驱动的哈密顿量来合成与时间无关的哈密顿量。我们证明了一组相互作用 $S$ 可以对李代数 $\\mathrm{Lie}(S)$ 中的每个哈密顿量进行 Floquet 模拟，因此我们给出了能够产生任何目标哈密顿量的 Floquet 通用哈密顿量的完整且有建设性的表征。值得注意的是，我们的构造仅使用 $O(1)$ 局部相互作用强度及其比率，避免了通过时间无关的哈密顿量在模拟模拟中经常需要的不切实际的多尺度局部相互作用强度。\n\n相反，该结构需要一系列驱动频率，这些频率与重要类别（例如 $k$ 局部晶格哈密顿量）的系统大小呈多项式缩放。这具有直接的复杂性理论含义，包括自然物理性质和 Floquet 物理学中研究的数量的大量 BQP 完整性和 QMA 硬度结果。", "authors": [{"name": "Emilio Onorati"}, {"name": "Harriet Apel"}, {"name": "Michael M. Wolf"}, {"name": "Toby Cubitt"}], "featured_authors": [{"name": "Emilio Onorati"}, {"name": "Harriet Apel"}, {"name": "Michael M. Wolf"}, {"name": "Toby Cubitt"}], "author_count": 4}, {"id": "2610.01902", "category": "quant-ph", "title": "Exponential quantum advantages for decoded quantum interferometry in the streaming setting", "abstract": "Decoded quantum interferometry (DQI) is a polynomial-time quantum algorithm introduced by Jordan et al. (Nature 2025). For a natural optimization problem, known as optimal polynomial intersection (OPI), it achieves approximation guarantees in regimes where all known classical algorithms require exponential time. Besides time, space is another central resource: storing and manipulating a massive input can be very challenging, especially when logical qubits carry substantial fault-tolerant implementation overhead. This motivates the following question: does DQI yield quantum advantages in memory, and can we prove it unconditionally? We give an affirmative answer to this question in the streaming setting. In particular, we consider a natural generalization of OPI using Hermite interpolation and Hasse derivatives, which asks for a low-degree polynomial satisfying as many constraints on its values and derivatives as possible. As a concrete example, we show [Quantum efficiency.] An adaptation of the DQI algorithm produces a polynomial satisfying $93\\%$ of the constraints; moreover, it only reads the input stream in one pass, uses polylogarithmic space, and has polylogarithmic computation time per stream entry. [Classical hardness.] Any classical algorithm that produces an answer satisfying just $76\\%$ of the constraints requires polynomial space, even if it can read the input stream with polynomially many passes and can use unlimited time. Our result provides a complete tradeoff curve for the tunable parameters, and implies that DQI has provable quantum advantages for the original OPI problem.", "url": "https://arxiv.org/abs/2610.01902", "type": "理论+数值", "summary": "解码量子干涉测量（DQI）是 Jordan 等人提出的一种多项式时间量子算法。 （《自然》2025）。对于称为最优多项式交集 (OPI) 的自然优化问题，它在所有已知经典算法都需要指数时间的情况下实现了近似保证。除了时间之外，空间是另一个核心资源：存储和操作大量输入可能非常具有挑战性，特别是当逻辑量子位承载大量容错实现开销时。这就引发了以下问题：DQI 是否会在内存中产生量子优势，我们能否无条件地证明这一点？我们在流媒体设置中对这个问题给出了肯定的答案。特别是，我们考虑使用 Hermite 插值和 Hasse 导数对 OPI 进行自然推广，这要求低次多项式满足对其值和导数尽可能多的约束。\n\n作为一个具体的例子，我们展示了[量子效率]。DQI 算法的改编产生了一个满足 $93\\%$ 约束的多项式；此外，它仅一次性读取输入流，使用多对数空间，并且每个流条目具有多对数计算时间。 [经典难度。] 任何产生仅满足 $76\\%$ 约束的答案的经典算法都需要多项式空间，即使它可以通过多项式多次读取输入流并且可以使用无限的时间。我们的结果提供了可调参数的完整权衡曲线，并且意味着 DQI 对于原始 OPI 问题具有可证明的量子优势。", "authors": [{"name": "Kewen Wu"}, {"name": "Guangxu Yang"}], "featured_authors": [{"name": "Kewen Wu"}, {"name": "Guangxu Yang"}], "author_count": 2}, {"id": "2610.01932", "category": "quant-ph", "title": "Avoiding Exponentially Large Groups with Open Quantum System Technology", "abstract": "We propose a novel approach to state preparation by embracing the full power of open quantum systems. Instead of working with the whole unitary group in $n$ qubits, we identify a small Lie group $G$ in $(n+3)$ qubits. The dimension of its Lie algebra is $\\text{poly}(n)$. Every state can be approximated starting from any fixed input state by repeatedly using partial trace and state preparation in the environment alongside group operations. Moreover, we also identify a single (open system magic) interaction Hamiltonian whose unitary group can be combined with open system quantum technology mentioned above to achieve transitivity on the space of all densities. Similarly, we show that all channels on $n$ qubits can be approximated by using a larger environment, achieving channel universality. The interesting small groups we identify are derived from Lie algebras of local Pauli strings and lead to a new landscape of cheap and expensive states, densities, and channels.", "url": "https://arxiv.org/abs/2610.01932", "type": "理论", "summary": "我们提出了一种利用开放量子系统的全部功能来进行状态准备的新方法。我们不是使用 $n$ 量子位中的整个酉群，而是在 $(n+3)$ 量子位中识别一个小李群 $G$。其李代数的维数为$\\text{poly}(n)$。通过在环境中重复使用部分跟踪和状态准备以及组操作，可以从任何固定输入状态开始近似每个状态。此外，我们还确定了一个单一（开放系统魔法）相互作用哈密顿量，其酉群可以与上述开放系统量子技术相结合，实现所有密度空间上的传递性。类似地，我们表明，$n$ 个量子比特上的所有通道都可以通过使用更大的环境来近似，从而实现通道通用性。我们确定的有趣的小群源自局部泡利弦的李代数，并导致了廉价和昂贵状态、密度和通道的新景观。", "authors": [{"name": "Jihong Cai"}, {"name": "Advith Govindarajan"}, {"name": "Marius Junge"}], "featured_authors": [{"name": "Jihong Cai"}, {"name": "Advith Govindarajan"}, {"name": "Marius Junge"}], "author_count": 3}, {"id": "2610.01940", "category": "quant-ph", "title": "Optimal query complexity for fractional quantum evolution", "abstract": "Given oracle access to an unknown unitary $U=e^{iH}$ , the fractional query problem asks how many queries are required to implement a noninteger power $U^t=e^{itH}$, $0<t<1$, when the spectrum is separated from the branch cut by a gap $\\delta$. Quantum singular value transformation gives an upper bound of $O\\!\\left(\\frac{1}{\\delta}\\log\\frac{1}{\\varepsilon}\\right)$ queries for approximation error $\\varepsilon$. We prove a matching lower bound for arbitrary query algorithms. Our argument reduces any $N$-query circuit to the approximation of $e^{it\\theta}$ by a trigonometric polynomial with degree bounded by $O(N)$, together with Remez inequality. This allows us to establish the lower bound of $\\Omega_\\tau\\!\\left(\\frac{1}{\\delta}\\log\\frac{1}{\\varepsilon}\\right)$. Consequently, the optimal query complexity for fractional query problem is $\\Theta_{\\tau}\\!\\left(\\frac{1}{\\delta}\\log\\frac{1}{\\varepsilon}\\right)$, showing that the known QSVT construction is asymptotically optimal. We also give an alternative lower bound proof based on constructing a linear functional that annihilates the approximant space, yielding a $\\Omega_{\\tau}\\!\\left(\\log\\frac{1}{\\varepsilon}\\right)$ bound uniform to $\\delta$.", "url": "https://arxiv.org/abs/2610.01940", "type": "理论+数值", "summary": "给定预言机访问未知的酉 $U=e^{iH}$ ，分数查询问题询问当频谱与分支切割之间有间隙 $\\delta$ 时，需要多少个查询来实现非整数幂 $U^t=e^{itH}$, $0<t<1$。量子奇异值变换给出上限 $O\\!\\left(\\frac{1}{\\delta}\\log\\frac{1}{\\varepsilon}\\right)$ 查询近似误差 $\\varepsilon$。我们证明了任意查询算法的匹配下界。我们的论点通过次数以 $O(N)$ 为界的三角多项式以及 Remez 不等式将任何 $N$ 查询电路简化为 $e^{it\\theta}$ 的近似值。这使我们能够建立 $\\Omega_\\tau\\!\\left(\\frac{1}{\\delta}\\log\\frac{1}{\\varepsilon}\\right)$ 的下限。因此，分数查询问题的最优查询复杂度为 $\\Theta_{\\tau}\\!\\left(\\frac{1}{\\delta}\\log\\frac{1}{\\varepsilon}\\right)$，表明已知的 QSVT 构造是渐近最优的。\n\n我们还给出了另一种下界证明，基于构造一个消除近似空间的线性函数，产生 $\\Omega_{\\tau}\\!\\left(\\log\\frac{1}{\\varepsilon}\\right)$ 统一绑定到 $\\delta$。", "authors": [{"name": "Anthony Yuezhang Liu"}, {"name": "Adam Wesołowski"}, {"name": "Jayne Thompson"}, {"name": "Mile Gu"}, {"name": "Lirandë Pira"}], "featured_authors": [{"name": "Anthony Yuezhang Liu"}, {"name": "Adam Wesołowski"}, {"name": "Jayne Thompson"}, {"name": "Mile Gu"}, {"name": "Lirandë Pira"}], "author_count": 5}, {"id": "2610.01941", "category": "quant-ph", "title": "Universality Sacrifices Reliability in Classical-Quantum Channel Coding", "abstract": "Universal channel coding enables communication without a complete description of the channel. For classical channels, universal codes can attain both capacity and the optimal high-rate reliability. We show that this compatibility fails for classical-quantum channels in general; that is, the optimal reliability in the channel-aware scenario is not always achievable with universal coding due to the ignorance of the unitary rotation of the output system. We exhibit a family of classical-quantum channels for which one cannot achieve the channel-aware optimal reliability by a fixed coding scheme. We further derive a converse bound on the reliability for unitary-invariant decoders, a natural assumption for the universal coding scheme, that can be strictly smaller than the optimal channel-aware error exponent. Conversely, we construct a channel-independent encoder-decoder pair and establish a universally achievable bound on the reliability that matches this converse bound in the high-rate regime, thereby characterizing the optimal universal reliability. Specifically, the channel-aware and universal exponents are governed by the Petz and sandwiched Rényi divergences, respectively. These divergences coincide for commuting outputs but differ for noncommuting ones, explaining why universality preserves optimal reliability classically but can reduce it quantumly. Our results showcase the fundamental reliability cost of performing the classical-quantum channel coding task universally.", "url": "https://arxiv.org/abs/2610.01941", "type": "理论", "summary": "通用信道编码无需信道的完整描述即可进行通信。对于经典信道，通用码可以同时获得容量和最佳的高速率可靠性。我们证明这种兼容性对于一般的经典量子通道来说是失败的。也就是说，由于忽略了输出系统的单位旋转，通用编码并不总是能够实现通道感知场景中的最佳可靠性。我们展示了一系列经典量子通道，无法通过固定编码方案实现通道感知的最佳可靠性。我们进一步推导了酉不变解码器可靠性的逆界，这是通用编码方案的自然假设，它可以严格小于最佳通道感知误差指数。相反，我们构建了一个与通道无关的编码器-解码器对，并在可靠性上建立了一个普遍可实现的界限，该界限与高速率状态下的相反界限相匹配，从而表征了最佳的普遍可靠性。具体来说，通道感知指数和通用指数分别由 Petz 散度和夹心 Rényi 散度控制。\n\n这些分歧对于通勤输出来说是一致的，但对于非通勤输出来说是不同的，这解释了为什么普遍性在经典上保留了最佳可靠性，但可以量子地减少它。我们的结果展示了普遍执行经典量子信道编码任务的基本可靠性成本。", "authors": [{"name": "Kaito Watanabe"}, {"name": "Masahito Hayashi"}, {"name": "Takaya Matsuura"}, {"name": "Hao-Chung Cheng"}], "featured_authors": [{"name": "Kaito Watanabe"}, {"name": "Masahito Hayashi"}, {"name": "Takaya Matsuura"}, {"name": "Hao-Chung Cheng"}], "author_count": 4}, {"id": "2610.01954", "category": "quant-ph", "title": "Hardware-Efficient Ground-State Preparation using Variational Imaginary-Time Majorana Evolution", "abstract": "Compact ground-state preparation circuits are essential for early fault-tolerant quantum chemistry. We introduce Variational Imaginary-time Majorana Evolution (VIME), a classical pre-training algorithm that extends operator-projected variational quantum imaginary-time evolution (OVQITE) to molecular electronic structure using a single compiled Majorana-propagation (MP) surrogate graph. We pair VIME with a compressed tiled Unitary Product State (c-tUPS) ansatz that we develop to reduce both classical simulation and quantum state-preparation costs. In the strongly correlated ruthenium complex TLD-1411, active-space calculations requiring up to 52 qubits achieve chemical precision against DMRG reference energies, with energy errors approximately $400\\times$ smaller than those from ADAPT-VQE-based variational Majorana-propagation (ADAPT-VMPE). Across the strongly multireference acene series up to heptacene (60 qubits), VIME matches or improves on the MP-reported energy accuracy of the ADAPT-VMPE comparison points with up to $26\\times$ fewer CNOTs and $167\\times$ lower two-qubit depth. These results establish imaginary-time classical pre-training of compressed variational ansätze as a promising route to resource-efficient molecular ground-state preparation.", "url": "https://arxiv.org/abs/2610.01954", "type": "数值", "summary": "紧凑的基态制备电路对于早期容错量子化学至关重要。我们引入了变分虚时间马约拉纳演化 (VIME)，这是一种经典的预训练算法，它使用单个编译的马约拉纳传播 (MP) 代理图将算子投影的变分量子虚时间演化 (OVQITE) 扩展到分子电子结构。我们将 VIME 与我们开发的压缩平铺单一产品状态 (c-tUPS) ansatz 配对，以降低经典模拟和量子状态准备成本。在强相关钌络合物 TLD-1411 中，需要多达 52 个量子位的主动空间计算可实现针对 DMRG 参考能量的化学精度，能量误差比基于 ADAPT-VQE 的变分马约拉纳传播 (ADAPT-VMPE) 的能量误差小约 400 倍。在强多参考并苯系列直至庚苯（60 个量子位）中，VIME 匹配或改进了 ADAPT-VMPE 比较点的 MP 报告的能量精度，CNOT 减少了 26 倍，两个量子位深度降低了 167 倍。\n\n这些结果确立了压缩变分 ansätze 的虚时间经典预训练作为资源高效的分子基态制备的一条有前途的途径。", "authors": [{"name": "Federico Santona"}, {"name": "Manuel G. Algaba"}, {"name": "Aeishah Ameera Anuar"}, {"name": "Anna M. Wernbacher"}, {"name": "Prachi Sharma"}, {"name": "Fedor Šimkovic IV"}], "featured_authors": [{"name": "Federico Santona"}, {"name": "Manuel G. Algaba"}, {"name": "Aeishah Ameera Anuar"}, {"name": "Anna M. Wernbacher"}, {"name": "Prachi Sharma"}, {"name": "Fedor Šimkovic IV"}], "author_count": 6}, {"id": "2610.01979", "category": "quant-ph", "title": "Fully tolerant product state testing and closest product state learning", "abstract": "We address the problem of testing whether an unknown $n$-qudit state $\\rho$ is $a$-close to a product state or $b$-far away from any product state, as measured in terms of state overlap. We provide a time-efficient algorithm to solve this problem that requires an $n$-independent number of copies of the unknown state. Our random coloring argument shows that for any unknown state there always exists a partition of $[n]$ into $q$ parts such that the square of the overlap with the closest product state with respect to this partition is only an additive factor $O(1/q)$ larger. This reduces the problem to tolerant testing of $q$ parties, with potentially growing local dimensions. Combining this insight with blockwise spectral projection arguments we can show that the natural $k$-copy generalization of Harrow & Montanaro's product state test provides an efficient tolerant tester. We use the same random coloring and blockwise spectral projection techniques to obtain a substantially improved algorithm for closest product state learning. In particular we give an algorithm that takes in $\\widetilde{O}\\big((nd)^2\\big)\\, 2^{\\widetilde{O}(1/\\varepsilon^8)}$ copies of the unknown state and produces an $\\varepsilon$-approximately optimal product state. The key technical components of this learner are a qudit variant of the Bakshi et al. high-fidelity product state learning algorithm and a sampling technique based on Werner's optimal cloning channel.", "url": "https://arxiv.org/abs/2610.01979", "type": "数值", "summary": "我们解决了测试未知的 $n$-qudit 状态 $\\rho$ 是否 $a$- 接近产品状态或 $b$- 远离任何产品状态的问题，根据状态重叠来衡量。我们提供了一种省时的算法来解决这个问题，该算法需要独立于 $n$ 数量的未知状态副本。我们的随机着色参数表明，对于任何未知状态，始终存在将 $[n]$ 划分为 $q$ 个部分，使得与该划分最接近的产品状态重叠的平方仅大一个加法因子 $O(1/q)$。这将问题减少到对 $q$ 各方进行宽容测试，并且可能会增加本地规模。将这一见解与分块光谱投影参数相结合，我们可以证明 Harrow & Montanaro 的产品状态测试的自然 $k$ 复制泛化提供了一个高效的容错测试器。我们使用相同的随机着色和分块光谱投影技术来获得用于最接近产品状态学习的显着改进的算法。\n\n特别是，我们给出了一种算法，它接受未知状态的 $\\widetilde{O}\\big((nd)^2\\big)\\, 2^{\\widetilde{O}(1/\\varepsilon^8)}$ 副本，并产生 $\\varepsilon$ 近似最优的乘积状态。该学习器的关键技术组件是 Bakshi 等人的 qdit 变体。高保真产品状态学习算法和基于维尔纳最优克隆通道的采样技术。", "authors": [{"name": "Zongbo Bao"}, {"name": "Jonas Helsen"}, {"name": "Tuyen Nguyen"}], "featured_authors": [{"name": "Zongbo Bao"}, {"name": "Jonas Helsen"}, {"name": "Tuyen Nguyen"}], "author_count": 3}, {"id": "2610.01987", "category": "quant-ph", "title": "On the Metastability of the Mean-Field Interchange Model for Local Dimension $\\geq 3$", "abstract": "Many quantum systems are believed to thermalize slowly at low temperatures due to the existence of metastable phases. However, there are cases where further cooling can restore polynomial-time thermalization: we demonstrate that the Davies dynamics of the mean-field interchange model with local dimension $d\\geq 3$ and single-site generalized Pauli couplings exhibits this behavior. The dynamical phase diagram is beholden to two distinguished inverse temperatures, $\\beta_{\\mathrm{min}}(d)$ and $\\beta=d$, with the static first-order phase transition lying between them. At low and high temperatures surrounding the interval $(\\beta_{\\mathrm{min}}(d),d)$, the spectral gap of the Davies generator is bounded below by an inverse polynomial in system size $n$. Meanwhile, in this interval, the gap vanishes exponentially in $n$, indicating metastability. The proof uses Schur-Weyl duality to decompose the Davies generator into a classical Markov generator on Young diagrams, and the restriction to the remaining symmetry sectors whose gap is $\\Omega(n^{-1})$. Thus, exponential slowdown arises entirely from the Young diagram chain.", "url": "https://arxiv.org/abs/2610.01987", "type": "理论+数值", "summary": "由于亚稳态相的存在，许多量子系统被认为在低温下缓慢热化。然而，在某些情况下，进一步冷却可以恢复多项式时间热化：我们证明了具有局部尺寸 $d\\geq 3$ 的平均场交换模型的戴维斯动力学和单点广义泡利耦合表现出这种行为。动态相图取决于两个不同的逆温度，$\\beta_{\\mathrm{min}}(d)$ 和 $\\beta=d$，静态一阶相变位于它们之间。在区间 $(\\beta_{\\mathrm{min}}(d),d)$ 周围的低温和高温下，戴维斯发生器的光谱间隙受到系统大小 $n$ 中的逆多项式的限制。同时，在这个区间内，差距在$n$中呈指数消失，表明亚稳态。证明使用 Schur-Weyl 对偶性将 Davies 生成器分解为杨图上的经典马尔可夫生成器，并限制间隙为 $\\Omega(n^{-1})$ 的剩余对称扇区。因此，指数减速完全是由杨图链引起的。", "authors": [{"name": "Sergio Escobar"}, {"name": "Lin Lin"}, {"name": "Michael Ragone"}, {"name": "Kevin D. Stubbs"}], "featured_authors": [{"name": "Sergio Escobar"}, {"name": "Lin Lin"}, {"name": "Michael Ragone"}, {"name": "Kevin D. Stubbs"}], "author_count": 4}, {"id": "2610.01992", "category": "quant-ph", "title": "Geometry of Knill-Laflamme Coefficients for Pauli Error Detection", "abstract": "Knill-Laflamme coefficients characterize exact quantum error detection through scalar compressions of error operators to the code space. For prescribed Pauli observables and a fixed code dimension, attainable coefficient vectors form a joint higher-rank numerical range, whose Euclidean norm image is the signature spectrum. We study how operator representation, code dimension, and detection constraints govern this geometry. Our main theorem identifies representation multiplicity as sufficient to lift active expectation data to exact scalar compressions: a lift exists whenever each occupied block has multiplicity at least the code dimension times the rank of the corresponding active state. When multiplicity suffices to realize all active states, the coefficient range is the full active expectation body and is therefore convex and connected, with a closed interval as its signature spectrum. This framework unifies commuting Pauli families, where sufficient common-eigenspace degeneracy yields polytopes, and subsystem stabilizer codes, where protected logical subsystems supply multiplicity spaces for noncommuting gauge observables. Explicit examples show how increasing the code dimension can make a range shrink, collapse, or become empty, while increasing multiplicity can turn a Bloch sphere into a filled ball. In the subsystem setting, parent-Hamiltonian constructions realize exact detecting codes as degenerate ground spaces, selecting distinguished vectors and continuous paths within these ranges. A final three-qubit example shows additional noncommuting detection constraints reduce a tetrahedral range to its barycenter and four vertices, producing a disconnected signature spectrum. The results provide a structural framework for Knill-Laflamme coefficient geometry and motivate sharper criteria for connected coefficient ranges and interval signature spectra under structured error models.", "url": "https://arxiv.org/abs/2610.01992", "type": "理论+数值", "summary": "Knill-Laflamme 系数通过将错误算子标量压缩到代码空间来表征精确的量子错误检测。对于规定的泡利可观测量和固定的码维，可获得的系数向量形成联合的高阶数值范围，其欧几里德范数图像是签名谱。我们研究算子表示、代码维度和检测约束如何控制该几何形状。我们的主要定理认为表示多重性足以将活动期望数据提升到精确的标量压缩：每当每个占用的块具有至少代码维度乘以相应活动状态的等级的多重性时，就存在提升。当重数足以实现所有主动状态时，系数范围是完整的主动期望体，因此是凸连通的，并以闭区间作为其特征谱。该框架统一了通勤泡利族（其中足够的公共本征空间简并性产生多面体）和子系统稳定器代码（其中受保护的逻辑子系统为非通勤规范可观测量提供多重空间）。\n\n明确的示例展示了增加代码维度如何使范围缩小、折叠或变空，而增加多重性如何将布洛赫球体变成填充球。在子系统设置中，父哈密尔顿构造实现了作为退化地面空间的精确检测代码，在这些范围内选择不同的向量和连续路径。最后的三量子位示例显示额外的非交换检测约束将四面体范围缩小到其重心和四个顶点，从而产生断开的特征谱。结果为 Knill-Laflamme 系数几何提供了结构框架，并激发了在结构化误差模型下连接系数范围和区间特征谱的更清晰的标准。", "authors": [{"name": "Baisong Sun"}, {"name": "Ningping Cao"}, {"name": "Yiu Tung Poon"}, {"name": "Bei Zeng"}], "featured_authors": [{"name": "Baisong Sun"}, {"name": "Ningping Cao"}, {"name": "Yiu Tung Poon"}, {"name": "Bei Zeng"}], "author_count": 4}, {"id": "2610.02029", "category": "quant-ph", "title": "(A Variant of) Clifford Circuit Synthesis is NP-Complete", "abstract": "Optimal circuit synthesis is the problem of finding the shortest-depth circuit representation of a given functionality with respect to a pre-specified elementary gate set. This is a central problem in both quantum and classical hardware design. While the classical version is very well understood -- both in terms of heuristics and rigorous hardness assertions -- much less is known about optimal quantum circuit synthesis. We focus on optimal Clifford circuit synthesis, for which various heuristics are known, e.g. via reduction to 3-SAT. Our main result supplies a matching hardness result: a variant of optimal Clifford synthesis is NP-hard. The proof proceeds in two parts: (i) reduce 3-edge colorability on 3-regular graphs to a circuit synthesis problem that only involves CZ gates, (ii) prove that the availability of additional elementary Clifford gates -- most notably: Hadamard, phase and CNOT -- cannot lead to further improvements of the optimal circuit depth. Our work sharpens the complexity-theoretic understanding of Clifford circuits: simulation and equivalence checking are in P, whereas deciding whether a Clifford unitary admits an implementation within a prescribed depth is NP-complete.", "url": "https://arxiv.org/abs/2610.02029", "type": "理论+数值", "summary": "最佳电路综合是寻找给定功能相对于预先指定的基本门集的最短深度电路表示的问题。这是量子和经典硬件设计的中心问题。虽然经典版本在启发式和严格的硬度断言方面都很好理解，但对于最佳量子电路合成却知之甚少。我们专注于最佳 Clifford 电路综合，对此有各种启发式方法，例如通过还原为3-SAT。我们的主要结果提供了匹配的硬度结果：最佳 Clifford 合成的变体是 NP 困难的。证明分为两部分：(i) 将 3 正则图上的 3 边可着色性降低为仅涉及 CZ 门的电路综合问题，(ii) 证明附加基本 Clifford 门的可用性（最显着的是：Hadamard、相位和 CNOT）不能导致最佳电路深度的进一步改进。\n\n我们的工作加深了对 Clifford 电路的复杂性理论理解：模拟和等价性检查在 P 中，而决定 Clifford 酉是否承认在规定深度内实现是 NP 完全的。", "authors": [{"name": "Luna Lima Keller"}, {"name": "Richard Kueng"}], "featured_authors": [{"name": "Luna Lima Keller"}, {"name": "Richard Kueng"}], "author_count": 2}, {"id": "2610.02030", "category": "quant-ph", "title": "Sparse Hamiltonian simulation with optimal dependence on the maximum column Euclidean norm", "abstract": "We give a quantum algorithm for simulating a $d$-sparse Hermitian Hamiltonian $H$, assuming a known upper bound $\\Lambda$ on its maximum column Euclidean norm $\\|H\\|_{1\\to2}$. For $t\\Lambda\\ge1/2$, simulation with operator-norm error $\\epsilon$ uses \\[ O\\!\\left(t\\Lambda\\sqrt d+\\sqrt d\\log(2/\\epsilon)\\right) \\] sparse-oracle queries. This removes the subpolynomial overhead in Low's algorithm [STOC 2019], replacing it with an additive logarithmic precision term. For $d>1$ and $t\\Lambda\\ge\\log(2/\\epsilon)$, the bound matches the worst-case lower bound. A known spectral-norm upper bound may also be used in place of $\\Lambda$. The number of 1- and 2-qubit gates is linear in the query scale, up to oracle costs and polynomial overhead in the input bit lengths and logarithmic precision parameters. As applications, we obtain $O(\\kappa\\sqrt d\\,\\mathrm{polylog}(\\kappa/\\epsilon))$ queries for solving $d$-sparse quantum linear systems with $\\|A\\|\\le1$ and $\\|A^{-1}\\|\\le\\kappa$, under standard sparse and state-preparation access. We also give a gate-efficient implementation of black-box unitaries with at most $d$ nonzero entries per row and column using $O(\\sqrt d\\log(2/\\epsilon))$ queries, given sparse access to the unitary and its adjoint. At constant error, the query bound is optimal and yields $\\Theta(\\sqrt N)$ queries for arbitrary $N\\times N$ unitaries, resolving the open question on black-box unitary implementation posed by Berry and Childs [QIC 2012].", "url": "https://arxiv.org/abs/2610.02030", "type": "理论+数值", "summary": "我们给出了一个量子算法，用于模拟 $d$ 稀疏埃尔米特哈密顿量 $H$，假设其最大列欧几里得范数 $\\|H\\|_{1\\to2}$ 上有已知的上限 $\\Lambda$。对于 $t\\Lambda\\ge1/2$，具有运算符范数错误 $\\epsilon$ 的模拟使用 \\[ O\\!\\left(t\\Lambda\\sqrt d+\\sqrt d\\log(2/\\epsilon)\\right) \\] 稀疏预言查询。这消除了 Low 算法 [STOC 2019] 中的次多项式开销，代之以加性对数精度项。对于 $d>1$ 和 $t\\Lambda\\ge\\log(2/\\epsilon)$，界限与最坏情况下限匹配。已知的谱范数上限也可以用来代替 $\\Lambda$。 1 量子位门和 2 量子位门的数量在查询范围内呈线性关系，直至预言机成本以及输入位长度和对数精度参数的多项式开销。作为应用程序，我们获得 $O(\\kappa\\sqrt d\\,\\mathrm{polylog}(\\kappa/\\epsilon))$ 查询，用于在标准稀疏和状态准备访问下使用 $\\|A\\|\\le1$ 和 $\\|A^{-1}\\|\\le\\kappa$ 求解 $d$ 稀疏量子线性系统。\n\n我们还使用 $O(\\sqrt d\\log(2/\\epsilon))$ 查询给出黑盒幺正的门高效实现，每行和每列最多有 $d$ 个非零条目，并给出对酉及其伴随的稀疏访问。在恒定误差下，查询界限是最优的，并产生任意 $N\\times N$ 酉的 $\\Theta(\\sqrt N)$ 查询，解决了 Berry 和 Childs 提出的关于黑盒酉实现的悬而未决的问题 [QIC 2012]。", "authors": [{"name": "Zecheng Li"}, {"name": "Chunhao Wang"}], "featured_authors": [{"name": "Zecheng Li"}, {"name": "Chunhao Wang"}], "author_count": 2}, {"id": "2610.02037", "category": "quant-ph", "title": "Complexity and Applications of Nearest Stabilizer Product State Problems", "abstract": "Consider the following optimization problem over stabilizer product states: given an $n$-qubit stabilizer state $\\left|\\psi\\right\\rangle$ and a set of single-qubit stabilizer states $S$, maximize $\\left|\\langle \\psi | \\phi_1, \\ldots, \\phi_n \\rangle\\right|^2$ over single-qubit stabilizer states $\\left|\\phi_i\\right\\rangle \\in S$. By varying the set $S$, we show that solutions to this problem can be useful in a variety of settings: tighter runtime bounds for certain classical simulation algorithms; measures of entanglement; and the complexity of low-rank matrix completion. Moreover, we give a complete complexity classification of this nearest stabilizer product state problem. After accounting for the symmetries in the Clifford group, there are $9$ distinct possible sets $S$, and we show that all but the two simplest of these are $\\NP$-complete.", "url": "https://arxiv.org/abs/2610.02037", "type": "理论+数值", "summary": "考虑以下关于稳定器乘积状态的优化问题：给定 $n$ 个量子位稳定器状态 $\\left|\\psi\\right\\rangle$ 和一组单量子位稳定器状态 $S$，最大化 $\\left|\\langle \\psi | \\phi_1, \\ldots, \\phi_n \\rangle\\right|^2$ 超过单量子位稳定器状态 $\\left|\\phi_i\\right\\rangle \\in S$。通过改变 $S$ 集合，我们表明该问题的解决方案在各种设置中都是有用的：某些经典模拟算法的运行时间范围更严格；纠缠措施；以及低秩矩阵完成的复杂性。此外，我们给出了这个最近稳定器产品状态问题的完整复杂性分类。在考虑了 Clifford 群的对称性之后，有 $9$ 个不同的可能集合 $S$，并且我们证明除了两个最简单的集合之外，所有这些集合都是 $\\NP$ 完全的。", "authors": [{"name": "Daniel Grier"}, {"name": "Hakop Pashayan"}, {"name": "Luke Schaeffer"}], "featured_authors": [{"name": "Daniel Grier"}, {"name": "Hakop Pashayan"}, {"name": "Luke Schaeffer"}], "author_count": 3}, {"id": "2610.02079", "category": "quant-ph", "title": "A computational phase diagram for the transverse field Ising model", "abstract": "We study the transverse field Ising model, defined by the Hamiltonian $H =\\frac{1}{2}\\sum_{i, j\\in [n]} J_{ij} Z_i Z_j +\\sum_{i=1}^n h_i^z Z_i + \\eta\\sum_{i} X_i$ where $J $ is the symmetric interaction matrix, and $\\eta$ is the transverse field strength. Let $\\Delta(J)=\\lambda_{\\max}(J)-\\lambda_{\\min}(J)$ be the spectral width of $J.$ When the inverse temperature $\\beta\\geq0$ satisfies $\\Delta(J)\\cdot\\frac{\\tanh(\\beta\\eta)}{\\eta}\\leq1$, we give a randomized classical algorithm that approximates the partition function $Z(\\beta)=\\operatorname{Tr}(e^{-\\beta H})$ to a given relative error $\\epsilon\\in(0,1)$ in time polynomial in $n$, $\\beta$, the model parameters, and $\\epsilon^{-1}$. When $ \\Delta(J) \\cdot \\frac{\\tanh(\\beta \\eta)}{\\eta} > 1 ,$ we show that approximating $ Z(\\beta)$ within an $\\exp(o(n))$-multiplicative factor is $\\textbf{NP}$-hard, and thus unlikely to admit an efficient classical or quantum algorithms under standard complexity theoretic assumptions. Furthermore, in the regime $\\Delta (J)\\cdot \\frac{\\tanh(\\beta \\eta)}{\\eta}\\leq 1,$ we provide an efficient randomized classical algorithm that approximates Pauli string observables of the Gibbs state $ \\rho_\\beta = \\frac{e^{-\\beta H}}{\\operatorname{Tr}(e^{-\\beta H})}$ within an arbitrarily small additive error. In the special case when the observable is also diagonal in the $X$-basis, i.e. $P \\in \\{I, X\\}^{\\otimes n}$, the algorithm further achieves arbitrarily small relative error.", "url": "https://arxiv.org/abs/2610.02079", "type": "理论+数值", "summary": "我们研究横向场 Ising 模型，由哈密顿量 $H =\\frac{1}{2}\\sum_{i, j\\in [n]} J_{ij} Z_i Z_j +\\sum_{i=1}^n h_i^z Z_i + \\eta\\sum_{i} X_i$ 定义，其中 $J $ 是对称相互作用矩阵，$\\eta$ 是横向场强。设$\\Delta(J)=\\lambda_{\\max}(J)-\\lambda_{\\min}(J)$为$J的谱宽。$当逆温度$\\beta\\geq0$满足$\\Delta(J)\\cdot\\frac{\\tanh(\\beta\\eta)}{\\eta}\\leq1$时，我们给出一个近似配分函数的随机经典算法$Z(\\
