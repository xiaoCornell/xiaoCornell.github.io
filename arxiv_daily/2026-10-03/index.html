屏蔽是面内偏振薄膜中的主要发射机制，在多域薄膜中通过畴壁处的强内置场得到增强，而面外偏振则有利于体光伏电流。我们的结果将铁电域配置确立为设计参数，设定光驱动太赫兹发射的强度和微观起源。", "authors": [{"name": "Z. Abdul Hadi"}, {"name": "N. Rezi"}, {"name": "M. Monti"}, {"name": "G. Vaudel"}, {"name": "A. Abdelsamie"}, {"name": "C. Carrétéro"}, {"name": "D. Sando"}, {"name": "M. Viret"}, {"name": "V. Garcia"}, {"name": "S. Fusil"}, {"name": "M. C. Weber"}, {"name": "P. Ruello"}, {"name": "V. Juvé"}], "featured_authors": [{"name": "Z. Abdul Hadi"}, {"name": "N. Rezi"}, {"name": "M. Monti"}, {"name": "M. C. Weber"}, {"name": "P. Ruello"}, {"name": "V. Juvé"}], "author_count": 13}, {"id": "2610.01370", "category": "cond-mat", "title": "Benchmarking average atom potentials derived from atomic cluster expansions", "abstract": "Average atom (A-atom) potentials provide a mean-field description of a chemically disordered alloy and are used to predict the properties of solid solutions without short-range order. Such potentials are usually averaged from an existing interatomic potential and are therefore only as accurate as the parent model. Accurate interatomic potentials are themselves difficult to parameterize and can require large training datasets. Here we benchmark a recently developed formalism that computes an exact A-atom potential directly from a linear atomic cluster expansion (ACE). We first fit a linear ACE to Fe-W data generated with an embedded atom method (EAM) potential. The resulting A-atom potential reproduces the properties of the disordered phase computed from an explicit random supercell and from a conventional A-atom potential averaged from the same EAM potential. We then fit a linear ACE to energies and forces computed from electronic structure calculations for about 1500 small Mo-Nb structures with an average of 7 atoms per structure. The A-atom potential derived from this ACE reproduces the DFT elastic constants, lattice parameter, mixing enthalpy, and Bain path of special quasirandom structures. Of the three chemical site bases, only the occupation basis also reproduces the DFT surface energies of the alloy. For Mo-Nb, the A-atom potential also predicts that the ideal solution entropy outweighs the destabilizing vibrational contribution to the finite-temperature free energy of the disordered phase. These benchmarks show that the properties of disordered alloys can be recovered from small training datasets when the chemical site basis is chosen carefully.", "url": "https://arxiv.org/abs/2610.01370", "type": "理论+数值", "summary": "平均原子（A 原子）势提供了化学无序合金的平均场描述，并用于预测没有短程有序的固溶体的特性。此类势通常是现有原子间势的平均值，因此仅与父模型一样准确。准确的原子间势本身很难参数化，并且可能需要大量的训练数据集。在这里，我们对最近开发的形式主义进行了基准测试，该形式主义直接从线性原子簇展开（ACE）计算精确的原子势。我们首先将线性 ACE 拟合到使用嵌入式原子方法 (EAM) 势生成的 Fe-W 数据。所得的 A 原子势再现了从显式随机超晶胞和从相同 EAM 势平均得到的常规 A 原子势计算得出的无序相的特性。然后，我们将线性 ACE 拟合到通过电子结构计算计算出的能量和力，这些能量和力针对大约 1500 个小型 Mo-Nb 结构（每个结构平均有 7 个原子）进行计算。\n\n从此 ACE 导出的 A 原子势再现了特殊准随机结构的 DFT 弹性常数、晶格参数、混合焓和贝恩路径。在三个化学位点基础中，只有占据基础也再现了合金的 DFT 表面能。对于 Mo-Nb，A 原子势还预测理想溶液熵超过对无序相的有限温度自由能的不稳定振动贡献。这些基准表明，当仔细选择化学位点基础时，可以从小型训练数据集中恢复无序合金的性能。", "authors": [{"name": "Deepak Somani"}, {"name": "Lorenzo Piersante"}, {"name": "Anirudh Raju Natarajan"}], "featured_authors": [{"name": "Deepak Somani"}, {"name": "Lorenzo Piersante"}, {"name": "Anirudh Raju Natarajan"}], "author_count": 3}, {"id": "2610.01402", "category": "cond-mat", "title": "Transport theory for a generic two-arm co-propagating Majorana interferometer with Majorana fermion and edge vortex tunneling", "abstract": "Co-propagating chiral Majorana edge modes are predicted to exist in proximity-coupled quantum anomalous Hall systems. They combine the exciting prospects of edge vortices as flying non-Abelian Ising anyons, with their fully electrical detection through anyon fusion processes. In this setup, electrical transport arises from the interference of a pair of Majorana edge states. By bosonizing the model with an additional replica sector, we generalize previous treatments to fully asymmetric configurations. We analyze a Mach-Zehnder interferometer and show that while the DC conductance does not exhibit signatures of edge-vortex interference, at low frequencies, this interference manifests as an effective capacitance. This quantity is sensitive to the non-Abelian anyon statistics of edge vortices and, in particular, carries signatures of their topological spin and nontrivial conformal dimension. We demonstrate that the thermal length $l_T = \\hbar v/(\\pi k_B T)$ is the relevant scale at low temperatures $T$, analogous to quasiparticle transport in conventional quantum Hall edge states with velocity $v$. As long as the interferometer arm lengths match within this length scale, transport signatures of the non-Abelian statistics of edge vortices remain visible.", "url": "https://arxiv.org/abs/2610.01402", "type": "理论", "summary": "预计邻近耦合量子反常霍尔系统中存在共传播手性马约拉纳边缘模式。它们将边缘涡旋作为飞行的非阿贝尔伊辛任意子的令人兴奋的前景与通过任意子融合过程进行的完全电检测结合起来。在这种设置中，电传输是由一对马约拉纳边缘态的干扰产生的。通过使用额外的复制扇区对模型进行玻色化，我们将之前的处理方法推广到完全不对称的配置。我们分析了马赫-曾德干涉仪，结果表明，虽然直流电导没有表现出边缘涡旋干扰的特征，但在低频下，这种干扰表现为有效电容。这个量对边缘涡旋的非阿贝尔任意子统计很敏感，特别是带有其拓扑自旋和非平凡共形维数的特征。我们证明热长度 $l_T = \\hbar v/(\\pi k_B T)$ 是低温 $T$ 下的相关尺度，类似于传统量子霍尔边缘态中速度 $v$ 的准粒子输运。\n\n只要干涉仪臂长在此长度范围内匹配，边缘涡旋的非阿贝尔统计的传输特征仍然可见。", "authors": [{"name": "Domenico Giuliano"}, {"name": "Andrea Nava"}, {"name": "Fabian Hassler"}, {"name": "Reinhold Egger"}], "featured_authors": [{"name": "Domenico Giuliano"}, {"name": "Andrea Nava"}, {"name": "Fabian Hassler"}, {"name": "Reinhold Egger"}], "author_count": 4}, {"id": "2610.01414", "category": "cond-mat", "title": "On thermalization in random free fermions: Statistical origins and energy-dependent ETH structure", "abstract": "We study the thermalization in the random free fermion model by a detailed random-matrix analysis. By computing the ensemble average and fluctuations of $\\operatorname{Tr}(A\\rho(t))$ for a single-particle observable $A$, we derive the thermalization function $g^2(t/\\tau_\\lambda)$ with $\\tau_\\lambda = \\hbar/(2\\eta\\sqrt{N})$, prove its $|t|^{-3}$ asymptotic decay, and show that the variance of the fluctuations vanishes as $O(1/N)$ in the thermodynamic this http URL number conservation is also incorporated into the model, by which we further study the energy-shell eigenstate statistics and prove a factorization theorem of the eigenstate statistics. We further show that under a controlled eigenvector-eigenvalue correlation deformation, the diagonal energy-resolved slope and the off-diagonal eigenstate thermalization hypothesis spectral function acquire an energy this http URL , we compute the fluctuations of correlation functions and compare the fluctuation scales with those of a fully chaotic system, revealing quantitative differences rooted in the Gaussian nature of the this http URL work establishes the random free fermion model as an analytically solvable realization of weak eigenstate thermalization hypothesis type self-averaging, and as a controllable setting in which eigenbasis chaos can be separated from spectral chaos.", "url": "https://arxiv.org/abs/2610.01414", "type": "理论+数值", "summary": "我们通过详细的随机矩阵分析研究随机自由费米子模型中的热化。通过计算单粒子可观测$A$的系综平均值和$\\operatorname{Tr}(A\\rho(t))$的波动，我们推导出热化函数$g^2(t/\\tau_\\lambda)$，其中$\\tau_\\lambda = \\hbar/(2\\eta\\sqrt{N})$，证明其$|t|^{-3}$渐近衰减，并表明波动的方差在热力学中消失为$O(1/N)$，这个http URL数守恒也被纳入模型中，通过该模型我们进一步研究了能量壳本征态统计并证明了本征态统计的因式分解定理。\n\n我们进一步表明，在受控的特征向量-特征值相关变形下，对角能量分辨斜率和非对角本征态热化假设谱函数获得了该http URL的能量，我们计算了相关函数的波动并将波动尺度与完全混沌系统的波动尺度进行了比较，揭示了植根于该http URL的高斯性质的定量差异工作建立了随机自由费米子模型作为弱本征态的解析可解实现热化假设类型自平均，并且作为一种可控设置，其中特征基混沌可以与谱混沌分开。", "authors": [{"name": "Xiao-Kan Guo"}, {"name": "Zhiqiang Huang"}], "featured_authors": [{"name": "Xiao-Kan Guo"}, {"name": "Zhiqiang Huang"}], "author_count": 2}, {"id": "2610.01432", "category": "cond-mat", "title": "Learning ab initio phase-field models", "abstract": "Simulating microstructure evolution requires quantum-mechanical accuracy and mesoscopic reach in length and time scales, a combination that no current method achieves. Classical phase-field models provide this reach, but their accuracy is limited by phenomenological free energies and mobilities. Here we develop a framework for learning ab initio phase-field models, where the mesoscopic equation is not postulated but derived from a Mori-Zwanzig projection of molecular dynamics onto species-density fields under explicit assumptions. The nonlocal free energy and mobility left unspecified by this equation are parametrized by neural networks and learned from short molecular dynamics trajectories generated with machine-learning interatomic potentials of ab initio accuracy. We demonstrate the framework on an iron-boron melt and on hydrogen-helium mixtures under planetary conditions. For iron-boron, the model shows that the melt at the FeB$_4$ composition is spinodally unstable at ambient pressure but stabilized at 10 GPa, offering a thermodynamic rationale for why FeB$_4$ has been synthesized only under high pressure. For hydrogen-helium, the model predicts the immiscibility boundary and captures droplet nucleation and growth in helium-rain simulations of a column corresponding to 2.2 million atoms, far beyond the scale of atomistic modeling at comparable accuracy. Trained across compositions and conditions, such models could provide a mesoscopic counterpart to ab initio molecular dynamics.", "url": "https://arxiv.org/abs/2610.01432", "type": "理论+数值", "summary": "模拟微观结构演化需要量子力学精度以及长度和时间尺度的介观范围，这是当前方法无法实现的组合。经典相场模型提供了这种范围，但其准确性受到唯象自由能和迁移率的限制。在这里，我们开发了一个从头开始学习相场模型的框架，其中介观方程不是假设的，而是在明确的假设下从分子动力学到物种密度场的 Mori-Zwanzig 投影导出的。该方程未指定的非局域自由能和迁移率由神经网络参数化，并从从头精度的机器学习原子间势生成的短分子动力学轨迹中学习。我们展示了行星条件下铁硼熔体和氢氦混合物的框架。对于铁硼，该模型显示 FeB$_4$ 成分的熔体在环境压力下是旋节线不稳定的，但在 10 GPa 下稳定，这为为什么 FeB$_4$ 仅在高压下合成提供了热力学原理。\n\n对于氢-氦，该模型预测了不混溶边界，并在对应于 220 万个原子的柱的氦雨模拟中捕获了液滴成核和生长，远远超出了原子模型在相当精度下的规模。经过不同成分和条件的训练，这些模型可以提供从头算分子动力学的介观对应物。", "authors": [{"name": "Mengyi Chen"}, {"name": "Peichen Zhong"}, {"name": "Zihan Zhang"}, {"name": "Qianxiao Li"}], "featured_authors": [{"name": "Mengyi Chen"}, {"name": "Peichen Zhong"}, {"name": "Zihan Zhang"}, {"name": "Qianxiao Li"}], "author_count": 4}, {"id": "2610.01486", "category": "cond-mat", "title": "Parafermions in fractional Chern insulator-superconductor heterostructures: the role of spin polarization", "abstract": "Most proposals for $Z_3$ parafermions in fractional quantum Hall-superconductor structures used the spin-unpolarized $\\nu = 2/3$ Halperin $(1,1,2)$ state. The fractional quantum anomalous Hall (FQAH) states of twisted MoTe$_2$ and rhombohedral graphene are believed to be spin- and valley-polarized Jain states, with the same topological order but a different spin structure. We analyze a trench between two polarized $\\nu = 2/3$ edges. Among the pairing and tunneling bilinears of the edge-mode electrons, exactly two of each have zero conformal spin. Pairing is compatible only with the neutral-mode superconductivity channel and tunneling only with neutral-mode backscattering, whereas in the unpolarized state singlet pairing and tunneling select the same channel. Since the two channels condense the same neutral anyon up to a local operator, the domain walls carry $Z_3$ parafermions, with 3 protected states per pair, whether or not the neutral channel changes between regions; fixing the fermion parity does not enlarge this count. Before the neutral gap forms, pairing is at best marginal for repulsive inter-edge coupling unless an attractive neutral coupling favors its channel; once the gap has formed, both charge terms are relevant for an inter-edge Coulomb coupling below 7/25 of the intra-edge one. The superconductor must supply even-frequency, equal-spin, intravalley pairing, which an s-wave singlet superconductor with only Ising spin-orbit coupling does not provide at leading order, whereas chiral $p+ip$ and $f+if$ states do. The $Z_3$ label is carried by a quasiparticle of the FQAH state, so no process confined to a junction whose tunneling segments are not FQAH can change it, and we expect a $6\\pi$-periodic Josephson current with or without fixed fermion parity.", "url": "https://arxiv.org/abs/2610.01486", "type": "理论", "summary": "大多数关于分数量子霍尔超导结构中 $Z_3$ 帕费米子的提案都使用自旋非极化 $\\nu = 2/3$ Halperin $(1,1,2)$ 态。扭曲MoTe$_2$和菱面体石墨烯的分数量子反常霍尔（FQAH）态被认为是自旋和谷极化Jain态，具有相同的拓扑顺序但不同的自旋结构。我们分析两个极化 $\\nu = 2/3$ 边缘之间的沟槽。在边缘模式电子的配对和隧道双线性中，恰好有两个具有零共形自旋。配对仅与中性模式超导通道兼容，而隧道仅与中性模式反向散射兼容，而在非偏振状态下，单重态配对和隧道选择相同的通道。由于两个通道将相同的中性任意子压缩到局部算子，因此畴壁携带 $Z_3$ 平费米子，每对有 3 个保护状态，无论中性通道在区域之间是否变化；修复费米子奇偶校验并不会增加这个计数。\n\n在中性间隙形成之前，配对对于排斥边缘间耦合来说至多是边缘的，除非有吸引力的中性耦合有利于其通道；一旦间隙形成，两个电荷项都与边缘间库仑耦合相关，低于边缘内库仑耦合的 7/25。超导体必须提供偶频、等自旋、谷内配对，仅具有伊辛自旋轨道耦合的 s 波单线态​​超导体无法在前导阶上提供这种配对，而手性 $p+ip$ 和 $f+if$ 态则可以。 $Z_3$ 标签由 FQAH 态的准粒子携带，因此仅限于隧道段不是 FQAH 的结的任何过程都无法更改它，并且我们期望具有或不具有固定费米子宇称的 $6\\pi$ 周期性约瑟夫森电流。", "authors": [{"name": "Aaron Amire"}], "featured_authors": [{"name": "Aaron Amire"}], "author_count": 1}, {"id": "2610.01534", "category": "cond-mat", "title": "Gate Control Improves Routing Efficiency for Periodic Traffic", "abstract": "Traffic movement on highways and data packet transmission across the Internet serve as prototypical examples of collective dynamical behavior in complex systems. Although enhancing traffic flow in complex networks has been extensively investigated, most existing studies focus on single-queue models. In this paper, we introduce a simple yet effective two-queue scheme with gate control that regulates vehicle entry and integrates it with the routing protocol. When vehicles arrive at a on-ramp gate, they first join a waiting queue and are permitted to enter the main flowing queue once it has emptied. This two-queue strategy is especially advantageous when highway inflow varies periodically with large fluctuations, as is commonly observed in real traffic. Moreover, it modifies the system's failure characteristics, replacing sudden, discontinuous jamming transitions with gradual, continuous ones. The approach is based on a simple rule using only local queue information, making it easy to implement and widely applicable. Beyond the specific setup studied here, it can be applied to other transportation networks under different conditions or extended to other queuing systems, such as Internet data packet routing.", "url": "https://arxiv.org/abs/2610.01534", "type": "理论", "summary": "高速公路上的交通移动和互联网上的数据包传输是复杂系统中集体动态行为的典型例子。尽管增强复杂网络中的流量已被广泛研究，但大多数现有研究都集中在单队列模型上。在本文中，我们介绍了一种简单而有效的带门控的双队列方案，用于调节车辆进入并将其与路由协议集成。当车辆到达入口匝道门时，它们首先加入等待队列，并在主流队列空后被允许进入主流队列。当高速公路流量周期性变化且波动较大时，这种两队列策略尤其有利，正如在实际交通中常见的那样。此外，它还修改了系统的故障特征，用渐进的、连续的干扰转变取代了突然的、不连续的干扰转变。该方法基于仅使用本地队列信息的简单规则，使其易于实现且广泛适用。\n\n除了这里研究的具体设置之外，它还可以应用于不同条件下的其他运输网络或扩展到其他排队系统，例如互联网数据包路由。", "authors": [{"name": "Hyunwook Song"}, {"name": "Hoyun Choi"}, {"name": "B. Kahng"}], "featured_authors": [{"name": "Hyunwook Song"}, {"name": "Hoyun Choi"}, {"name": "B. Kahng"}], "author_count": 3}, {"id": "2610.01594", "category": "cond-mat", "title": "Mass-asymmetry-controlled exciton dressing and dissociation in a quantum lattice model", "abstract": "In a polar material, a neutral exciton couples to phonons through the sum of the electron and hole deformation potentials. Because the total source vanishes by charge neutrality, the elastic exciton-phonon vertex is regularized by electron-hole interference. Here we determine the non-perturbative fate of this interference by exact diagonalization of a Holstein-exciton model. By parameterizing the mass asymmetry to decouple it from the small-polaron atomic limit, we map a regime map comprising an internal dressing crossover and a dissociation boundary. We prove analytically and verify numerically that for equal masses, the symmetric exciton ground state is protected from phonon dressing by an exact exchange selection rule, provided the phonon source is odd under electron-hole exchange (the neutral case). As mass asymmetry increases, this selection rule is broken and the exciton acquires a strong local polaronic cloud. We show that the dissociation boundary, conversely, is set by a global energy balance between Coulomb binding and polaronic stabilization, and is nearly independent of the internal dressing. Paradoxically, the very symmetry that protects the exciton from dressing denies it polaronic stabilization, driving it toward dissociation at strong coupling. We discuss these results in the context of lattice exciton-polaron models and their implications for sharp versus broad excitonic lines in mass-symmetric versus mass-asymmetric polar semiconductors.", "url": "https://arxiv.org/abs/2610.01594", "type": "理论+数值", "summary": "在极性材料中，中性激子通过电子和空穴变形电势之和与声子耦合。由于总源因电荷中性而消失，因此弹性激子-声子顶点通过电子-空穴干涉而规则化。在这里，我们通过荷斯坦激子模型的精确对角化来确定这种干扰的非微扰命运。通过参数化质量不对称性以将其与小极化子原子极限解耦，我们绘制了包含内部敷料交叉和解离边界的状态图。我们通过分析证明并通过数值验证，对于相同的质量，只要声子源在电子-空穴交换（中性情况）下为奇数，对称激子基态就可以通过精确的交换选择规则来防止声子修饰。随着质量不对称性的增加，这种选择规则被打破，激子获得强大的局部极化云。相反，我们表明解离边界是由库仑结合和极化稳定之间的全局能量平衡决定的，并且几乎独立于内部敷料。\n\n矛盾的是，保护激子免于磨损的对称性却否认了它的极化稳定性，驱使它在强耦合下解离。我们在晶格激子极化子模型的背景下讨论这些结果及其对质量对称与质量不对称极性半导体中尖锐与宽激子线的影响。", "authors": [{"name": "Michael O. Atambo"}], "featured_authors": [{"name": "Michael O. Atambo"}], "author_count": 1}, {"id": "2610.01600", "category": "cond-mat", "title": "Why polar excitons stay sharp: parity protection of the center-of-mass recoil channel in exciton-phonon scattering", "abstract": "In polar semiconductors the Fröhlich interaction is the dominant electron--phonon coupling, yet excitonic resonances in materials such as halide perovskites remain anomalously sharp. We show that standard frozen-center-of-mass treatments of the exciton--phonon problem miss the decisive kinematic degree of freedom: restoring the exact center-of-mass (COM) recoil reveals a universally open, parameter-free $1s\\to1s$ absorption channel at recoil momentum $q_*=\\sqrt{2M_{\\rm ex}\\hbar\\omega_{\\rm LO}}/\\hbar$, whose rate scales as $N_{\\rm LO}(T)$. We prove that this recoil channel is controlled by destructive electron--hole interference: the recoil linewidth vanishes with the mass asymmetry as $\\gamma_{\\rm LO}^{\\rm recoil}\\propto\\mathcal{F}_{1s,1s}(q_*)^2$, and the elastic dressing obeys the exact suppression law $S_X/S_{\\rm ind}=\\eta^2(6-\\eta^2)/5$ within the hydrogenic Fröhlich model. The theory establishes a hierarchy of scattering regimes. In mass-asymmetric materials (GaAs, $\\eta=-0.74$) the recoil channel is active ($\\gamma_{\\rm LO}^{\\rm recoil}=2.2$~meV); in mass-symmetric materials (FAPbI$_3$, $\\eta=0$; MAPbI$_3$, $\\eta=-0.11$) it is killed by interference (0.00 and 0.12 meV), showing that the observed 27--40 meV perovskite linewidths cannot be accounted for by COM recoil and therefore require internal-state-changing and other inelastic channels, of which the constructive, $\\eta$-robust $1s\\to np$ resonance is the leading candidate within the present model. The Fröhlich constant $\\alpha$ alone is therefore insufficient as a figure of merit: after projection onto the correlated exciton, the controlling parameters are $\\eta$, $q_*a_X$, and the Rydberg detuning.", "url": "https://arxiv.org/abs/2610.01600", "type": "理论", "summary": "在极性半导体中，Fröhlich 相互作用是主要的电子-声子耦合，但卤化物钙钛矿等材料中的激子共振仍然异常尖锐。我们表明，激子-声子问题的标准冻结质心处理错过了决定性的运动学自由度：恢复精确的质心（COM）反冲揭示了反冲动量$q_*=\\sqrt{2M_{\\rm ex}\\hbar\\omega_{\\rm LO}}/\\hbar$处的普遍开放、无参数$1s\\to1s$吸收通道，其速率缩放为$N_{\\rm LO}(T)$。我们证明了这个反冲通道是由破坏性的电子-空穴干涉控制的：反冲线宽随着质量不对称性的$\\gamma_{\\rm LO}^{\\rm recoil}\\propto\\mathcal{F}_{1s,1s}(q_*)^2$而消失，并且弹性敷料在氢 Fröhlich 模型。该理论建立了散射机制的层次结构。\n\n在质量不对称材料（GaAs，$\\eta=-0.74$）中，反冲通道处于活动状态（$\\gamma_{\\rm LO}^{\\rm recoil}=2.2$~meV）；在质量对称材料（FAPbI$_3$，$\\eta=0$；MAPbI$_3$，$\\eta=-0.11$）中，它被干扰（0.00和0.12 meV）杀死，表明观察到的27--40 meV钙钛矿线宽不能用COM反冲来解释，因此需要内部状态改变和其他非弹性通道，其中相长， $\\eta$-稳健的$1s\\to np$共振是当前模型中的主要候选者。因此，单独的 Fröhlich 常数 $\\alpha$ 不足以作为品质因数：投影到相关激子上后，控制参数为 $\\eta$、$q_*a_X$ 和里德堡失谐。", "authors": [{"name": "Michael O. Atambo"}], "featured_authors": [{"name": "Michael O. Atambo"}], "author_count": 1}, {"id": "2610.01621", "category": "cond-mat", "title": "Learning to Classify Threading in Melts of Rings", "abstract": "Dense melts of nonconcatenated ring polymers exhibit anomalous dynamics and nonlinear rheology, in some cases linked to long-lived inter-ring threading entanglement. Detecting these geometric constraints remains computationally demanding, with different methods being based on different geometric features tuned to specific models. Here, we introduce a machine-learning framework that detects threading directly from the writhe of ring conformations and we demonstrate its broad generalisability. Trained on simulations of isolated, distance-constrained pairs of short rings, a one-dimensional convolutional neural network (CNN1D) operating on the writhe profile classifies threading states with over 98% accuracy on held-out ring pairs. Remarkably, this model generalises without retraining to equilibrium dense melts spanning a wide range of densities and chain lengths (N = 100 to 1600), maintaining true-positive rates above 91% with false-positive rates near zero. Misclassified conformations are limited to physically ambiguous, shallow threading events which are arguably not impacting the dynamics of the rings. Effectively, writhe captures the interaction between the two rings, allowing writhe-based classifiers to improve the topological analysis of large ring-polymer systems with a 3-fold speed-up over the state-of-the-art minimal-surface detection. These results establish the writhe-trained neural networks as an accurate, scalable tool for characterising entanglement in ring polymer melts.", "url": "https://arxiv.org/abs/2610.01621", "type": "理论+数值", "summary": "非串联环聚合物的致密熔体表现出异常动力学和非线性流变学，在某些情况下与长寿命的环间螺纹缠结有关。检测这些几何约束仍然需要大量的计算，不同的方法基于针对特定模型调整的不同几何特征。在这里，我们介绍了一种机器学习框架，可以直接从环构象的扭曲中检测线程，并证明其广泛的通用性。经过对孤立的、距离受限的短环对的模拟训练，在扭动轮廓上运行的一维卷积神经网络 (CNN1D) 对保持环对的线程状态进行分类，准确率超过 98%。值得注意的是，该模型无需重新训练即可在广泛的密度和链长度（N = 100 至 1600）范围内达到平衡致密熔体，从而将真阳性率保持在 91% 以上，假阳性率接近于零。错误分类的构象仅限于物理上不明确的浅螺纹事件，这些事件可以说不会影响环的动力学。\n\n扭动有效地捕获了两个环之间的相互作用，使基于扭动的分类器能够改进大型环聚合物系统的拓扑分析，其速度比最先进的最小表面检测提高了 3 倍。这些结果将扭曲训练的神经网络确立为一种准确、可扩展的工具，用于表征环形聚合物熔体中的缠结。", "authors": [{"name": "Filippo Conforto"}, {"name": "Roman Staňo"}, {"name": "Jan Smrek"}, {"name": "Davide Michieletto"}], "featured_authors": [{"name": "Filippo Conforto"}, {"name": "Roman Staňo"}, {"name": "Jan Smrek"}, {"name": "Davide Michieletto"}], "author_count": 4}, {"id": "2610.01659", "category": "cond-mat", "title": "Optimal sampling strategies in event-chain Monte Carlo", "abstract": "Event-chain Monte Carlo (ECMC) has revolutionised computational sampling over recent years, providing a powerful alternative to the molecular-dynamics (MD) and Hamiltonian Monte Carlo (HMC) algorithms. Each method outperforms the ubiquitous random-walk Metropolis algorithm by advancing particles along deterministic trajectories, but ECMC achieves this without being constrained by Newtonian dynamics. Recent advances exploited this dynamical freedom to induce a collective particle dynamics that relax local density variations on fast timescales. In a foundational model of $N$ pairwise-interacting particles on the 1D torus, this led to an $O(N^{3/4})$ improvement on the industry-leading computational efficiency of MD and HMC - but with an impractically small prefactor at low/high mean particle density for general attractive/repulsive interactions. Here we present a universal framework that generalises this high-efficiency sampling strategy to all translationally symmetric pairwise models on the torus - creating the potential to surpass MD and HMC as the state of the art. We also numerically elucidate the collective particle dynamics and discuss broad impact across the physical sciences and computational statistics.", "url": "https://arxiv.org/abs/2610.01659", "type": "理论+数值", "summary": "近年来，事件链蒙特卡罗 (ECMC) 彻底改变了计算采样，为分子动力学 (MD) 和哈密顿蒙特卡罗 (HMC) 算法提供了强大的替代方案。每种方法都通过沿着确定性轨迹推进粒子来优于普遍存在的随机游走 Metropolis 算法，但 ECMC 实现了这一目标，而不受牛顿动力学的约束。最近的进展利用这种动态自由度来诱导集体粒子动力学，从而在快速时间尺度上放松局部密度变化。在 1D 环面上 $N$ 成对相互作用粒子的基础模型中，这导致行业领先的 MD 和 HMC 计算效率提高 $O(N^{3/4})$，但在低/高平均粒子密度下，对于一般的吸引/排斥相互作用，前因子小得不切实际。在这里，我们提出了一个通用框架，将这种高效采样策略推广到环面上的所有平移对称成对模型 - 创造了超越 MD 和 HMC 的潜力，成为最先进的技术。\n\n我们还从数字上阐明了集体粒子动力学，并讨论了物理科学和计算统计学的广泛影响。", "authors": [{"name": "James Gulliford"}, {"name": "Gareth O. Roberts"}, {"name": "Michael F. Faulkner"}], "featured_authors": [{"name": "James Gulliford"}, {"name": "Gareth O. Roberts"}, {"name": "Michael F. Faulkner"}], "author_count": 3}, {"id": "2610.01672", "category": "cond-mat", "title": "Scalar field theory for (chiral) active Brownian particles: bottom-up derivation revisited", "abstract": "The active Brownian particle (ABP) model is one of the most widely used particle-based models in studies of scalar active fluids. A collection of interacting ABPs is known to exhibit intriguing phenomena that are absent in equilibrium counterparts. A prominent example is spontaneous phase separation, known as motility-induced phase separation (MIPS), which occurs even in the absence of explicit attractive interactions. In parallel, the large-scale behavior of scalar active fluids is often modeled using continuum descriptions, namely, scalar field theories. Such scalar active field theories are usually formulated in a top-down manner, and establishing their connections to particle-based models remains challenging, with these connections not yet fully understood. To advance the microscopic derivation of scalar active field theories, we revisit the connection between ABPs interacting via a two-body potential in two dimensions and scalar field theories that include all possible terms up to fourth order in spatial gradients. Our approach is based on a pressure expansion and the renormalization group (RG) method in the context of singular perturbation theory. The RG method provides a systematic way to eliminate fast variables and identify the dynamics on the slow invariant manifold. Within this framework, scalar field theories can be obtained as RG flow equations. We also apply this method to a chiral variant of the ABP model, the chiral ABP (cABP) model, in which a constant torque biases particle rotation to the left or right. We show that the scalar field theory corresponding to the cABP model contains two ``odd'' terms in addition to those present in the scalar field theory for ABPs. The method developed here may also be useful for deriving hydrodynamic descriptions of other types of active matter systems.", "url": "https://arxiv.org/abs/2610.01672", "type": "理论", "summary": "活性布朗粒子（ABP）模型是标量活性流体研究中使用最广泛的基于粒子的模型之一。已知相互作用的 ABP 的集合表现出平衡对应物中不存在的有趣现象。一个突出的例子是自发相分离，称为运动诱导相分离（MIPS），即使在没有明确的吸引相互作用的情况下也会发生。与此同时，标量活动流体的大规模行为通常使用连续介质描述（即标量场论）进行建模。这种标量活性场论通常以自上而下的方式制定，建立它们与基于粒子的模型的联系仍然具有挑战性，因为这些联系尚未完全理解。为了推进标量活动场论的微观推导，我们重新审视通过二维二体势相互作用的 ABP 与标量场论之间的联系，标量场论包括空间梯度中高达四阶的所有可能项。我们的方法基于奇异摄动理论背景下的压力展开和重正化群（RG）方法。\n\nRG 方法提供了一种系统方法来消除快速变量并识别慢速不变流形上的动力学。在此框架内，标量场论可以作为 RG 流动方程获得。我们还将这种方法应用于 ABP 模型的手性变体，即手性 ABP (cABP) 模型，其中恒定扭矩使粒子向左或向右旋转。我们表明，除了 ABP 标量场理论中存在的项之外，与 cABP 模型相对应的标量场论还包含两个“奇”项。这里开发的方法也可用于导出其他类型的活性物质系统的流体动力学描述。", "authors": [{"name": "Yuta Kuroda"}, {"name": "Thomas Speck"}], "featured_authors": [{"name": "Yuta Kuroda"}, {"name": "Thomas Speck"}], "author_count": 2}, {"id": "2610.01714", "category": "cond-mat", "title": "Complex magnetic phase diagrams in Tb$_2$IrAl$_4$Ge$_2$ and Er$_2$IrAl$_4$Ge$_2$", "abstract": "We report the synthesis and comprehensive investigation of single-crystalline Tb$_2$IrAl$_4$Ge$_2$ and Er$_2$IrAl$_4$Ge$_2$, the first Ir-based members of the $Ln_2M$Al$_4$Ge$_2$ family. Both compounds crystallize in the tetragonal Tb$_2$NiAl$_4$Ge$_2$-type structure (space group $I4/mmm$) and exhibit easy-axis magnetic anisotropy with the crystallographic $c$ axis as the preferred magnetization direction. Tb$_2$IrAl$_4$Ge$_2$ undergoes antiferromagnetic ordering below $T_N = 25$ K and develops a sequence of field-induced metamagnetic transitions accompanied by pronounced magnetotransport anomalies, including a nonlinear Hall response. In contrast, Er$_2$IrAl$_4$Ge$_2$ exhibits three successive zero-field magnetic transitions and a substantially richer low-temperature magnetic phase diagram comprising multiple competing field-induced phases confined to relatively modest magnetic fields. The differences between the Tb- and Er-based compounds demonstrate the wide range of magnetic behavior that can be realized within the \\ce{Tb2NiAl4Ge2}-type structure. More broadly, the successful realization of Ir-based $Ln_2M$Al$_4$Ge$_2$ compounds considerably expands the accessible chemical space of this family and opens a route toward the exploration of related $4d$- and $5d$-based aluminogermanides.", "url": "https://arxiv.org/abs/2610.01714", "type": "数值", "summary": "我们报告了单晶 Tb$_2$IrAl$_4$Ge$_2$ 和 Er$_2$IrAl$_4$Ge$_2$ 的合成和综合研究，它们是 $Ln_2M$Al$_4$Ge$_2$ 家族的第一个 Ir 基成员。两种化合物均以四方 Tb$_2$NiAl$_4$Ge$_2$ 型结构（空间群 $I4/mmm$）结晶，并表现出易轴磁各向异性，晶体学 $c$ 轴为首选磁化方向。 Tb$_2$IrAl$_4$Ge$_2$ 经历低于 $T_N = 25$ K 的反铁磁排序，并产生一系列场诱发的变磁转变，伴随着明显的磁输运异常，包括非线性霍尔响应。相比之下，Er$_2$IrAl$_4$Ge$_2$ 表现出三个连续的零场磁转变和明显更丰富的低温磁相图，包括限制在相对适度的磁场中的多个竞争场感应相。 Tb 基化合物和 Er 基化合物之间的差异表明，可以在 \\ce{Tb2NiAl4Ge2} 型结构中实现广泛的磁性行为。\n\n更广泛地说，基于 Ir 的 $Ln_2M$Al$_4$Ge$_2$ 化合物的成功实现极大地扩展了该家族的可利用化学空间，并为探索相关的 $4d$ 和 $5d$ 基铝锗化物开辟了道路。", "authors": [{"name": "Karolina Gornicka"}, {"name": "Matthew S. Cook"}, {"name": "Brenden R. Ortiz"}, {"name": "Andrew D. Christianson"}, {"name": "Andrew F. May"}], "featured_authors": [{"name": "Karolina Gornicka"}, {"name": "Matthew S. Cook"}, {"name": "Brenden R. Ortiz"}, {"name": "Andrew D. Christianson"}, {"name": "Andrew F. May"}], "author_count": 5}, {"id": "2610.01722", "category": "cond-mat", "title": "Decoding Thermal Stability: In situ Insights into Phase Controlled Phosphine-free Colloidal Bi-Te Nanosheets", "abstract": "Bismuth telluride (Bi2Te3) is a prototypical V-VI semiconductor of interest for both thermoelectric and topological applications; however, phase-selective synthesis and thermal stability across the bismuth-telluride homologous series remain poorly understood. We report a facile and phosphine-free colloidal synthesis approach for a phase-selective synthesis of Bi2Te3, BiTe, and Bi4Te5 nanosheets with well-defined hexagonal morphology. By controlling precursor chemistry and reaction temperature, we achieved the selective formation of different phases within the (Bi2)m(Bi2Te3)n homologous series. Based on in situ heating studies, BiTe and Bi4Te5 nanosheets transform into Bi2Te3 at about 340 degree C, followed by preferential Te sublimation under vacuum or oxidation in air at higher temperatures. We discuss plausible mechanisms for these phase transformations. EDS analysis and FFT analysis of STEM images provide direct evidence for the temperature-dependent compositional and structural changes and highlight the close thermal relationship among these phases. These results not only advance fundamental understanding of phase stability and thermal behavior in bismuth-tellurides at the nanoscale but also establish a framework for understanding structural evolution in related homologous series, providing insights into their potential future applications in thermoelectric, spintronic, and topological systems.", "url": "https://arxiv.org/abs/2610.01722", "type": "理论", "summary": "碲化铋 (Bi2Te3) 是一种典型的 V-VI 半导体，可用于热电和拓扑应用；然而，碲化铋同系物的相选择性合成和热稳定性仍然知之甚少。我们报告了一种简便且无磷的胶体合成方法，用于相选择性合成具有明确六边形形态的 Bi2Te3、BiTe 和 Bi4Te5 纳米片。通过控制前驱体化学和反应温度，我们实现了(Bi2)m(Bi2Te3)n同系物中不同相的选择性形成。基于原位加热研究，BiTe 和 Bi4Te5 纳米片在约 340 摄氏度时转变为 Bi2Te3，然后在真空下优先升华或在更高温度下在空气中氧化。我们讨论这些相变的合理机制。 STEM 图像的 EDS 分析和 FFT 分析为温度依赖性成分和结构变化提供了直接证据，并强调了这些相之间密切的热关系。\n\n这些结果不仅促进了对纳米尺度碲化铋相稳定性和热行为的基本理解，而且还建立了理解相关同系系列结构演化的框架，为它们在热电、自旋电子和拓扑系统中的潜在未来应用提供了见解。", "authors": [{"name": "Fagui He"}, {"name": "Kevin Oldenburg"}, {"name": "Rostyslav Lesyuk"}, {"name": "Christian Klinke"}], "featured_authors": [{"name": "Fagui He"}, {"name": "Kevin Oldenburg"}, {"name": "Rostyslav Lesyuk"}, {"name": "Christian Klinke"}], "author_count": 4}, {"id": "2610.01732", "category": "cond-mat", "title": "Theory of Chirality-Induced Spin Selectivity in Trefoil-knot Molecules", "abstract": "The origin of chirality-induced spin selectivity (CISS) remains elusive, and ultrahigh spin polarization (SP) in topologically knotted molecules is unexplained. We develop a discrete geometric spin-orbit coupling (SOC) framework for molecular junctions, resolving site-specific curvature and current-partition effects beyond continuous models. For trefoil-knot molecules, it quantifies site-resolved geometric SOC, reaching $\\sim$120 meV, nearly two orders of magnitude larger than intrinsic SOC of light atoms. The substrate-coupled benzene unit, carrying the largest current and remarkable geometric SOC, dominates the CISS effect. The framework quantitatively reproduces measured SP, temperature-dependent magnetoresistance (MR) and $\\Delta$MR trends, establishing discrete geometric SOC as a predictive tool for CISS in topologically knotted molecules.", "url": "https://arxiv.org/abs/2610.01732", "type": "理论+数值", "summary": "手性诱导的自旋选择性（CISS）的起源仍然难以捉摸，拓扑结分子中的超高自旋极化（SP）也无法解释。我们开发了一种用于分子连接的离散几何自旋轨道耦合（SOC）框架，解决了连续模型之外的特定位点曲率和电流分配效应。对于三叶结分子，它量化了位点分辨的几何 SOC，达到 $\\sim$120 meV，比轻原子的固有 SOC 大近两个数量级。底物耦合苯单元具有最大的电流和显着的几何 SOC，在 CISS 效应中占主导地位。该框架定量再现了测得的 SP、温度相关磁阻 (MR) 和 $\\Delta$MR 趋势，将离散几何 SOC 建立为拓扑打结分子中 CISS 的预测工具。", "authors": [{"name": "Xi Sun"}, {"name": "Shu-Zheng Zhou"}, {"name": "Kai-Yuan Zhang"}, {"name": "Hua-Hua Fu"}], "featured_authors": [{"name": "Xi Sun"}, {"name": "Shu-Zheng Zhou"}, {"name": "Kai-Yuan Zhang"}, {"name": "Hua-Hua Fu"}], "author_count": 4}, {"id": "2610.01755", "category": "cond-mat", "title": "Structured-Light Control of Goniopolar Thermoelectricity in NaSn\\texorpdfstring{$_2$}{2}As\\texorpdfstring{$_2$}{2}", "abstract": "Goniopolar metals exhibit opposite thermoelectric polarities along different crystallographic directions, enabling zero-field transverse thermoelectricity but offering few means for external control. Here we show that a spatially structured Laguerre--Gaussian vector potential can programmably reconstruct the goniopolar phase space of NaSn$_2$As$_2$. First-principles-derived Wannier transport with bond-dependent Peierls coupling reveals two OAM-dependent spatial scaling laws: the radial response follows the Laguerre--Gaussian radius $r_{\\max}\\propto\\sqrt{|\\ell|}$, while calculations for $|\\ell|=2$--5 yield a dominant angular harmonic $m_{\\mathrm{dom}}=2|\\ell|$, encoding the optical winding in a frequency-doubled thermoelectric response. Increasing $|\\ell|$ simultaneously reconstructs pre-existing goniopolar windows, enhancing a representative window by approximately 17\\% at $|\\ell|=5$. By contrast, reversing $\\ell$ at fixed polarization produces only a small correction that approximately interchanges upon polarization reversal. Energy-resolved transport reveals that the structured field redistributes in-plane and cross-plane electronic velocities, shifting the directional Seebeck-zero boundaries that define the goniopolar state. These results establish vortex position and OAM magnitude as programmable control coordinates for goniopolar thermoelectricity.", "url": "https://arxiv.org/abs/2610.01755", "type": "理论+数值", "summary": "角极性金属沿着不同的晶体方向表现出相反的热电极性，从而实现零场横向热电，但提供的外部控制手段很少。在这里，我们证明了空间结构的拉盖尔-高斯矢量势可以可编程地重建 NaSn$_2$As$_2$ 的角极相空间。基于第一原理的 Wannier 输运和键相关 Peierls 耦合揭示了两个 OAM 相关的空间尺度定律：径向响应遵循拉盖尔高斯半径 $r_{\\max}\\propto\\sqrt{|\\ell|}$，而 $|\\ell|=2$--5 的计算产生主要角谐波 $m_{\\mathrm{dom}}=2|\\ell|$，将光学绕组编码为倍频热电响应。增加 $|\\ell|$ 同时重建预先存在的角极窗口，在 $|\\ell|=5$ 处将代表性窗口增强约 17\\%。相比之下，在固定偏振下反转 $\\ell$ 仅产生一个小的校正，该校正在偏振反转时近似互换。\n\n能量分辨输运揭示了结构化场重新分布面内和跨面电子速度，从而改变了定义角极态的定向塞贝克零边界。这些结果将涡旋位置和 OAM 幅度建立为角极热电的可编程控制坐标。", "authors": [{"name": "Atoumane Ndiaye"}, {"name": "Edwin Fohtung"}], "featured_authors": [{"name": "Atoumane Ndiaye"}, {"name": "Edwin Fohtung"}], "author_count": 2}, {"id": "2610.01757", "category": "cond-mat", "title": "Selective suppression of electronic orders via interlayer coupling in superconducting bilayer nickelate thin films", "abstract": "The discovery of spin-density-wave (SDW) order in bilayer nickelates has intensified interest in its interplay with superconductivity. Unlike cuprates, where doping rapidly suppresses the Néel temperature, the SDW transition temperature ($T_{\\mathrm{SDW}}$) in bilayer nickelates is robust against oxygen annealing and even increases under pressure. Here, we combine oxygen annealing with isovalent rare-earth ($A$-site) substitution to effectively apply $c$-axis uniaxial pressure, realizing superconducting bilayer nickelate films with $T_{\\mathrm{SDW}}$ suppressed from 150 K to 70 K. Notably, while SDW order is weakened but remains, a second charge-like anisotropy order is completely eliminated in the superconducting state. Polarization-resolved O $K$-edge X-ray absorption and electronic structure calculations show that strengthened interlayer coupling reconstructs the Fermi surface and weakens the SDW. These findings, consistent with a spin-spinless stripe ground state, provide new insight into the mechanism of density wave formation and their interplay with superconductivity.", "url": "https://arxiv.org/abs/2610.01757", "type": "数值", "summary": "双层镍酸盐中自旋密度波（SDW）有序的发现增强了人们对其与超导性相互作用的兴趣。与铜酸盐不同，铜酸盐的掺杂会迅速抑制尼尔温度，双层镍酸盐中的 SDW 转变温度 ($T_{\\mathrm{SDW}}$) 对氧退火具有很强的抵抗力，甚至在压力下会升高。在这里，我们将氧退火与等价稀土（$A$位点）取代相结合，有效地施加$c$轴单轴压力，实现了$T_{\\mathrm{SDW}}$从150 K抑制到70 K的超导双层镍酸盐薄膜。值得注意的是，虽然SDW阶次减弱但仍然存在，但在超导状态下，第二个类电荷各向异性阶次被完全消除。偏振分辨O$K$边缘X射线吸收和电子结构计算表明，加强的层间耦合重建了费米表面并削弱了SDW。这些发现与自旋-无自旋条纹基态一致，为密度波形成机制及其与超导性的相互作用提供了新的见解。", "authors": [{"name": "Ziao Han"}, {"name": "Lifen Xiang"}, {"name": "Tianren Wang"}, {"name": "Congcong Le"}, {"name": "Jun Zhan"}, {"name": "Siyi Lei"}, {"name": "Sonia Francoual"}, {"name": "Qisi Wang"}, {"name": "Jiangping Hu"}, {"name": "Tao Xiang"}, {"name": "Ronny Sutarto"}, {"name": "Xianxin Wu"}, {"name": "X. J. Zhou"}, {"name": "Zhihai Zhu"}], "featured_authors": [{"name": "Ziao Han"}, {"name": "Lifen Xiang"}, {"name": "Tianren Wang"}, {"name": "Xianxin Wu"}, {"name": "X. J. Zhou"}, {"name": "Zhihai Zhu"}], "author_count": 14}, {"id": "2610.01830", "category": "cond-mat", "title": "Flux- and tunnel-parity-controlled Josephson nonreciprocity from singlet-triplet competition in a parallel double quantum dot", "abstract": "Nonreciprocal supercurrents in interacting nanostructures can arise when the positive and negative critical currents probe inequivalent portions of a phase-dependent many-body spectrum. We study this mechanism in a parallel double-quantum-dot Josephson junction with strong intradot Coulomb repulsion, where local and non-local Cooper-pair transfer coexist. Using exact diagonalization of a zero-bandwidth Hamiltonian with explicit superconducting orbitals, we show that orbital flux and the gauge-invariant tunnel-sign parity control the interference between local Josephson processes and non-local exchange. For detuned dots, this produces flux-tunable singlet, triplet, and doublet ground-state spectral branches and two rectification regimes. Near the boundaries of the charge sector with singly occupied dots [(1,1) sector], doublet branches compete with singlet or triplet branches, yielding diode efficiencies approaching 40%. Within the triplet-dominated (1,1) sector, nearby singlet crossings asymmetrically reshape the ground-state envelope even when both critical-current extrema lie on the triplet-like branch, producing a broader response of order 10-15%. Finite temperature generally suppresses charge-crossover rectification, however, for intermediate temperatures we find an enhancement of both the normalized efficiency and the absolute critical-current asymmetry in the triplet regime. These results establish phase-dependent many-body branch competition as a gate-, flux-, and tunnel-parity-sensitive source of Josephson nonreciprocity.", "url": "https://arxiv.org/abs/2610.01830", "type": "理论+数值", "summary": "当正和负临界电流探测相位相关多体光谱的不等部分时，相互作用的纳米结构中会出现不可逆超电流。我们在具有强点内库仑斥力的平行双量子点约瑟夫森结中研究了这种机制，其中局部和非局部库珀对转移共存。使用具有显式超导轨道的零带宽哈密顿量的精确对角化，我们证明轨道通量和规范不变隧道符号宇称控制局部约瑟夫森过程和非局部交换之间的干扰。对于失谐点，这会产生通量可调的单线态、三线态和双线基态光谱分支和两个整流机制。在具有单占据点 [(1,1) 扇区] 的电荷扇区边界附近，双态分支与单态或三态分支竞争，产生接近 40% 的二极管效率。在三重态主导的 (1,1) 扇区内，即使两个临界电流极值都位于类三重态分支上，附近的单重态交叉也会不对称地重塑基态包络，从而产生 10-15% 量级的更广泛响应。\n\n有限温度通常会抑制电荷交叉整流，然而，对于中间温度，我们发现三线态中归一化效率和绝对临界电流不对称性都有所增强。这些结果将相位相关的多体分支竞争确立为约瑟夫森非互易性的门、通量和隧道奇偶校验敏感源。", "authors": [{"name": "Debika Debnath"}, {"name": "Fernando Dominguez"}, {"name": "Patrik Recher"}], "featured_authors": [{"name": "Debika Debnath"}, {"name": "Fernando Dominguez"}, {"name": "Patrik Recher"}], "author_count": 3}, {"id": "2610.01898", "category": "cond-mat", "title": "GEODE: Symmetry-Preserving Cartesian Diffusion for Crystal Generation", "abstract": "Most known inorganic crystals exhibit symmetric atomic arrangements, yet generative models often fail to reproduce them. Explicitly enforcing these symmetries has so far yielded fewer stable and novel structures than unconstrained generation. We introduce Generative Equivariant Orbit Diffusion Engine (GEODE), to our knowledge the first model to combine coordinate and lattice diffusion in Cartesian space. GEODE first samples symmetry templates, then jointly generates the lattice, atomic coordinates and atom types while preserving the specified symmetry with a novel Wyckoff-constrained loss. Cartesian diffusion gives coordinate noise a consistent physical scale that we empirically demonstrate improves performance. Unconditional generation achieves a metastable, unique and novel (mSUN) rate of 11.9%, compared with 7.7% for the next best symmetry-aware model. We also introduce sampling time template filtering, which increases mSUN by ~6% without retraining, making GEODE competitive with leading symmetry-agnostic models. Template selection also enables joint symmetry and property guidance, which we demonstrate through classifier-free guidance of permittivity.", "url": "https://arxiv.org/abs/2610.01898", "type": "理论", "summary": "大多数已知的无机晶体表现出对称的原子排列，但生成模型通常无法重现它们。迄今为止，与不受约束的生成相比，明确强制执行这些对称性产生的稳定和新颖的结构较少。我们引入了生成等变轨道扩散引擎（GEODE），据我们所知，这是第一个在笛卡尔空间中结合坐标和晶格扩散的模型。 GEODE ​​首先对对称模板进行采样，然后联合生成晶格、原子坐标和原子类型，同时通过新颖的威科夫约束损失保留指定的对称性。笛卡尔扩散为坐标噪声提供了一致的物理尺度，我们根据经验证明可以提高性能。无条件生成实现了 11.9% 的亚稳态、独特和新颖 (mSUN) 率，而第二个最佳对称感知模型的这一比率为 7.7%。我们还引入了采样时间模板过滤，无需重新训练即可将 mSUN 增加约 6%，使 GEODE ​​能够与领先的对称不可知模型竞争。模板选择还可以实现联合对称性和属性指导，我们通过无分类器的介电常数指导来证明这一点。", "authors": [{"name": "Yuchen Lou"}, {"name": "Alex M. Ganose"}], "featured_authors": [{"name": "Yuchen Lou"}, {"name": "Alex M. Ganose"}], "author_count": 2}, {"id": "2610.01990", "category": "cond-mat", "title": "Frustration-induced multiferroicity in hauerite MnS2", "abstract": "Pyrite-type mineral hauerite MnS$_2$ is a magnetic insulator with localized $S=\\frac52$ moments. Below 48 K, it develops a collinear antiferromagnetic order, accompanied by unit-cell doubling and breaking the inversion symmetry. We demonstrate that the latter gives rise to a ferroelectric polarization of up to 360 $\\mu$C/m$^2$ rendering MnS$_2$ a type-II multiferroic. Microscopically, the electronic polarization originates from S$_2$ dimers that acquire a dipole moment induced by the frustrated magnetic ordering of neighboring Mn sites. We show that time-reversal symmetry leaves ferroelectric domains intact, and that domain switching necessitates overcoming a high energy barrier set by the magnetic exchange energy scale.", "url": "https://arxiv.org/abs/2610.01990", "type": "理论", "summary": "黄铁矿型矿物金铁矿 MnS$_2$ 是一种具有局部 $S=\\frac52$ 矩的磁绝缘体。低于 48 K，它会形成共线反铁磁序，伴随着晶胞倍增并打破反演对称性。我们证明后者产生高达 360 $\\mu$C/m$^2$ 的铁电极化，使 MnS$_2$ 成为 II 型多铁性。微观上，电子极化源自 S$_2$ 二聚体，该二聚体获得由相邻 Mn 位点的受挫磁序引起的偶极矩。我们表明，时间反转对称性使铁电域保持完整，并且域切换需要克服由磁交换能量尺度设置的高能垒。", "authors": [{"name": "Vilmos Kocsis"}, {"name": "Harish K. Singh"}, {"name": "Kranthi K. Bestha"}, {"name": "Yaqian Guo"}, {"name": "Maxim Mostovoy"}, {"name": "Jeroen van den Brink"}, {"name": "Oleg Janson"}], "featured_authors": [{"name": "Vilmos Kocsis"}, {"name": "Harish K. Singh"}, {"name": "Kranthi K. Bestha"}, {"name": "Maxim Mostovoy"}, {"name": "Jeroen van den Brink"}, {"name": "Oleg Janson"}], "author_count": 7}, {"id": "2610.02003", "category": "cond-mat", "title": "Microscopic origin of the chiral pressure in a two-dimensional fluid", "abstract": "We show that a two-dimensional chiral fluid supports an antisymmetric contribution to the pressure, and determine its microscopic expression. Its origin lies outside the standard kinetic and collisional channels of the normal pressure tensor, stemming instead from the average of a parity-breaking pseudo-scalar. This chiral pressure is set by the rotational (vortex) viscosity of micropolar hydrodynamics, whose kinetic value for rough disks we compute here, to Gaussian order. Crucially, both the chiral pressure and the rotational viscosity survive at zeroth order in the gradients, meaning they persist even in the fully homogeneous fluid -- which we show is not only well defined but steady (the Quiescent Chiral State, QCS). Since this averaged pseudo-scalar does not vanish in a chiral fluid, any expansion of its distribution function must contain terms in this pseudo-scalar variable.", "url": "https://arxiv.org/abs/2610.02003", "type": "理论", "summary": "我们证明了二维手性流体支持对压力的反对称贡献，并确定了其微观表达。它的起源位于正常压力张量的标准动力学和碰撞通道之外，而是源于宇称破缺伪标量的平均值。该手性压力由微极流体动力学的旋转（涡旋）粘度设定，我们在这里计算其粗糙盘的动力学值，达到高斯阶。至关重要的是，手性压力和旋转粘度都在梯度中保持在零阶，这意味着它们甚至在完全均质的流体中也存在——我们证明这不仅是明确定义的而且是稳定的（静态手性状态，QCS）。由于该平均伪标量在手性流体中不会消失，因此其分布函数的任何展开都必须包含该伪标量变量中的项。", "authors": [{"name": "Francisco Vega Reyes"}], "featured_authors": [{"name": "Francisco Vega Reyes"}], "author_count": 1}, {"id": "2610.02192", "category": "cond-mat", "title": "Hyperbolic lattices with mass disorder: Phases and phase transitions", "abstract": "Nearest-neighbor (NN) tight-binding models (TBMs) on plaquette-centered $\\{ 10,3\\}$ (Schläfli symbol), $\\{ 8,3\\}$, and $\\{ 8,4\\}$ hyperbolic lattices on a Poincaré disk with open boundary conditions display a vanishing, a finite, and a diverging density of states (DOS) near zero energy (band center), respectively, yielding a Dirac liquid, a Fermi liquid, and a flat band. Emergent bipartite nature of these lattices within the framework of NN-TBMs, allows us to scrutinize the impact of mass disorder on the electronic states and DOS therein. From extensive numerical calculations of the average and typical DOS using the kernel polynomial method, we show that hyperbolic Dirac liquid remains stable against weak mass disorder, undergoing a semimetal-to-metal quantum phase transition at moderate disorder, followed by an Anderson metal-to-insulator transition at even stronger disorder. The remaining two systems display only the latter transition. Critical exponents near all these transitions are found to be close to the ones mediated by on-site potential disorder.", "url": "https://arxiv.org/abs/2610.02192", "type": "理论+数值", "summary": "具有开放边界条件的庞加莱圆盘上以斑块为中心的 $\\{ 10,3\\}$ （Schläfli 符号）、$\\{ 8,3\\}$ 和 $\\{ 8,4\\}$ 双曲晶格上的最近邻 (NN) 紧束缚模型 (TBM) 分别显示接近零能量（能带中心）的消失态密度 (DOS)、有限态密度和发散态密度 (DOS)，从而产生狄拉克液体，费米液体和平带。 NN-TBM 框架内这些晶格的新兴二分性质使我们能够仔细研究质量无序对其中电子态和 DOS 的影响。通过使用核多项式方法对平均和典型 DOS 进行广泛的数值计算，我们表明双曲狄拉克液体在弱质量无序下保持稳定，在中度无序下经历半金属到金属的量子相变，然后在更强的无序下经历安德森金属到绝缘体的转变。其余两个系统仅显示后一种转换。发现所有这些转变附近的临界指数都接近由现场潜在紊乱介导的指数。", "authors": [{"name": "Sheersh Sen"}, {"name": "Christopher A. Leong"}, {"name": "Bitan Roy"}], "featured_authors": [{"name": "Sheersh Sen"}, {"name": "Christopher A. Leong"}, {"name": "Bitan Roy"}], "author_count": 3}, {"id": "2610.00342", "category": "hep-th", "title": "Spontaneous symmetry breaking as a mechanism for the Gribov scale in a BRST-invariant formulation", "abstract": "We propose a BRST-invariant formulation of the Gribov--Zwanziger model in the Landau gauge, in which the Gribov scale is produced by the spontaneous breaking of a scalar quartet symmetry, rather than through the explicit breaking term of the conventional construction. We show that the resulting action preserves the ghost equation of the Landau gauge and reproduces the characteristic Gribov-type gauge propagator of the original Gribov scenario, a BRST-invariant mass term of the refined type being accommodated by the same mechanism. We establish the renormalizability of the model to all orders by means of algebraic renormalization techniques, no counterterm being required outside those already present in the classical action. We further show that the condensation of the quartet leaves unchanged the cohomology through which the observables are characterized, the operator realized in the displaced vacuum having the same cohomology as that of the symmetric phase, so that the mass scale is produced at no cost in the physical content of the theory, and the construction of genuine gauge-invariant observables in the Gribov--Zwanziger setting is thereby left open to the usual cohomological methods.", "url": "https://arxiv.org/abs/2610.00342", "type": "理论", "summary": "我们提出了朗道规范中 Gribov-Zwanziger 模型的 BRST 不变公式，其中 Gribov 尺度是通过标量四重对称性的自发破缺产生的，而不是通过传统构造的显式破缺项产生的。我们表明，由此产生的作用保留了朗道规范的幽灵方程，并再现了原始 Gribov 场景的特征 Gribov 型规范传播器，这是由相同机制容纳的精制类型的 BRST 不变质量项。我们通过代数重整化技术建立模型对所有阶的重整性，除了经典作用中已经存在的反项之外不需要反项。\n\n我们进一步表明，四重奏的凝聚保持了表征可观测量的上同调不变，算子在位移真空中实现了与对称相具有相同的上同调，因此质量尺度在理论的物理内容中免费产生，并且在Gribov-Zwanziger设置中构建真正的规范不变可观测量因此对通常的上同调方法开放。", "authors": [{"name": "M.A.L.Capri"}, {"name": "V. E. R. Lemes"}], "featured_authors": [{"name": "M.A.L.Capri"}, {"name": "V. E. R. Lemes"}], "author_count": 2}, {"id": "2610.00401", "category": "hep-th", "title": "From the Old to the New Starobinsky Inflation", "abstract": "Starobinsky's original model of inflation, driven by the trace anomaly of conformal fields, and its $R+R^2$ (scalaron) formulation are often treated separately. The original anomaly-driven evolution connects an early de Sitter phase supported by the Euler anomaly to a scalaron regime, where the observable modes leave the horizon. Building on this known background connection, we compute the scalar and tensor spectra on the exact background and find that the anomaly corrections are controlled by $aN_*/(18b)$, where $a$ and $b$ are the Euler-anomaly and $R^2$ coefficients and $N_*$ the number of e-folds after the pivot exits the horizon; scalaron inflation is recovered as this parameter vanishes. The observed tilt at $N_*=60$ then requires only $b/a\\simeq35$, rather than the $b/a\\gtrsim10^9$ of early realizations. At this benchmark the scalar spectrum is redder than in scalaron inflation at fixed $N_*$, and the tensor-to-scalar ratio is about 17% lower at fixed tilt, a quantitative signature of the anomaly. For minimal gravitational reheating, $N_*\\simeq53$, the tilt remains within $1\\sigma$ of the Planck value for $b/a\\gtrsim35$. In the de Sitter analysis, a finite range of the Weyl coupling excludes an extra real spin-two pole and keeps the causal response decaying. A companion paper gives the full analysis.", "url": "https://arxiv.org/abs/2610.00401", "type": "理论", "summary": "Starobinsky 的原始暴胀模型（由共形场的迹异常驱动）及其 $R+R^2$（标量）公式通常被单独处理。最初的异常驱动演化将欧拉异常支持的早期德西特阶段与标量区域联系起来，其中可观测模式离开了视界。在此已知背景连接的基础上，我们计算精确背景上的标量谱和张量谱，发现异常校正由 $aN_*/(18b)$ 控制，其中 $a$ 和 $b$ 是欧拉异常和 $R^2$ 系数，$N_*$ 是枢轴退出地平线后的 e 折叠数；当该参数消失时，标量膨胀就会恢复。那么在 $N_*=60$ 处观察到的倾斜仅需要 $b/a\\simeq35$，而不是早期实现的 $b/a\\gtrsim10^9$。在此基准上，标量谱比固定 $N_*$ 下的标量膨胀更红，并且固定倾斜下的张量与标量之比低约 17%，这是异常的定量特征。对于最小重力再加热，$N_*\\simeq53$，倾斜度保持在 $b/a\\gtrsim35$ 普朗克值的 $1\\sigma$ 范围内。\n\n在德西特分析中，外尔耦合的有限范围排除了额外的真实自旋二极点，并保持因果响应衰减。配套论文给出了完整的分析。", "authors": [{"name": "Shinji Hirano"}], "featured_authors": [{"name": "Shinji Hirano"}], "author_count": 1}, {"id": "2610.00435", "category": "hep-th", "title": "How AI Agents Discover Scientific Equations: From Hydrotope Rediscovery to New Water-Wave Amplitudes", "abstract": "We study how AI agents discover and validate scientific formulas using a controlled case study of the hydrotope, a recently discovered geometric formula that combines the different polynomial pieces of nonlinear surface-wave scattering into one global expression. This problem is deceptively difficult: simple formulas can hold within individual frequency regions, but the global result must identify their boundaries and combine exponentially many potentially active terms. We reconstruct how the formula was originally discovered through human--agent collaboration and analyze 18 single-prompt rediscovery runs under no hint and two forms of human guidance: a false hint representing an incorrect prior and a true hint representing domain-informed insight. Only four recover the formula across all kinematic chambers (i.e., regions in which a single polynomial form applies), while most unsuccessful runs find correct chamber polynomials but fail to combine them or test their full domain. Conventional and LLM-assisted symbolic regression and standard machine-learning regressors likewise fail to recover the global formula in our experiments. Guided by these failure modes, we test a PI$+$two-student workflow in which a coordinating lead agent assigns complementary analytic and numerical tasks to two research agents and independently evaluates their results. The PI$+$two-student team successfully rediscovers the complete hydrotope formula, while the same workflow applied to the harder three negative wavenumber problem discovers a new independent verified analytic expression for the six-point amplitude $A_6$.", "url": "https://arxiv.org/abs/2610.00435", "type": "理论", "summary": "我们研究人工智能代理如何使用水溶土的受控案例研究来发现和验证科学公式，水溶土是一种最近发现的几何公式​​，它将非线性表面波散射的不同多项式部分组合成一个全局表达式。这个问题看似困难：简单的公式可以在各个频率区域内成立，但全局结果必须确定它们的边界并以指数方式组合许多潜在的活跃项。我们重建了该公式最初是如何通过人与智能体协作发现的，并分析了 18 个在无提示和两种形式的人类指导下运行的单提示重新发现：代表错误先验的错误提示和代表领域知情洞察的真实提示。只有四个恢复了所有运动室（即应用单个多项式形式的区域）的公式，而大多数不成功的运行找到了正确的室多项式，但未能将它们组合或测试其完整域。在我们的实验中，传统和法学硕士辅助的符号回归以及标准机器学习回归器同样无法恢复全局公式。\n\n在这些失败模式的指导下，我们测试了 PI$+$ 两名学生的工作流程，其中协调主导代理将互补的分析和数值任务分配给两名研究代理，并独立评估他们的结果。 PI$+$ 两名学生团队成功地重新发现了完整的水溶助长公式，而应用于更难的三负波数问题的相同工作流程则发现了六点振幅 $A_6$ 的新的独立验证解析表达式。", "authors": [{"name": "Zihan Zhou"}, {"name": "Digvijay Wadekar"}, {"name": "Matias Zaldarriaga"}], "featured_authors": [{"name": "Zihan Zhou"}, {"name": "Digvijay Wadekar"}, {"name": "Matias Zaldarriaga"}], "author_count": 3}, {"id": "2610.00439", "category": "hep-th", "title": "No-signaling-in-time condition for three-flavor neutrino oscillations", "abstract": "Macrorealism is a fundamental concept in quantum foundations, capturing basic features of our everyday experience. Among the main tools introduced to test violations of macrorealism are the Leggett-Garg inequalities. These inequalities provide necessary and sufficient conditions for a certain data set including the correlators measured in a number of different experimental runs (weak version of macrorealism). Leggett-Garg inequalities have proved useful for detecting violations of macrorealism in neutrino oscillation experiments. However, it is interesting to investigate a set of necessary and sufficient conditions for strong macrorealism - no-signaling-in-time and arrow-of-time conditions - in order to obtain a more complete characterization of macrorealism in the context of neutrino oscillations. In particular, here we extend previous study of the no-signaling-in-time condition to the case of three-flavor neutrino oscillations, including the CP-violating phase of the Pontecorvo-Maki-Nakagawa-Sakata matrix.", "url": "https://arxiv.org/abs/2610.00439", "type": "理论", "summary": "宏观现实主义是量子基础中的一个基本概念，捕捉了我们日常经验的基本特征。 Leggett-Garg 不等式是用于检验是否违反宏观现实主义的主要工具之一。这些不等式为特定数据集提供了必要和充分的条件，包括在许多不同的实验运行中测量的相关器（宏观现实主义的弱版本）。 Leggett-Garg 不等式已被证明对于检测中微子振荡实验中宏观现实主义的违反非常有用。然而，研究强宏观现实主义的一组必要和充分条件 - 时间无信号和时间箭头条件 - 以便在中微子振荡的背景下获得宏观现实主义的更完整的表征是很有趣的。特别是，在这里我们将之前对无及时信号条件的研究扩展到三味中微子振荡的情况，包括 Pontecorvo-Maki-Nakakawa-Sakata 矩阵的 CP 破坏相。", "authors": [{"name": "Massimo Blasone"}, {"name": "Fabrizio Illuminati"}, {"name": "Luciano Petruzziello"}, {"name": "Kyrylo Simonov"}, {"name": "Luca Smaldone"}], "featured_authors": [{"name": "Massimo Blasone"}, {"name": "Fabrizio Illuminati"}, {"name": "Luciano Petruzziello"}, {"name": "Kyrylo Simonov"}, {"name": "Luca Smaldone"}], "author_count": 5}, {"id": "2610.00453", "category": "hep-th", "title": "Constructive Neural Network Field Theory: $ϕ_2^4$ in Finite Volume", "abstract": "Neural network field theory specifies a Euclidean field theory by a network architecture and a density on its parameters, so that correlation functions are integrals over those parameters. We introduce constructive neural network field theory and use it to realize finite-volume scalar $\\phi^4_2$ as a limit of network measures. For each dyadic momentum shell of the free propagator, the field is given a separate set of neurons with Gaussian coefficients, uniform phases, and frequencies drawn from the shell's spectrum. Once the frequencies and phases are fixed, integrating out one shell's coefficients is a finite-dimensional integral against a Gaussian density reweighted by the Wick-ordered quartic interaction. At any coupling in two and three dimensions, the reweighted density is uniformly log-concave for every shell above a threshold, and the fluctuations of those shell fields are held to the free-field scale. In two dimensions, for almost every draw of the frequencies and phases, an induction over scales shows that shell $j$ contributes $O(2^{-2j}j^3)$ to the log partition function, and the total-variation distance between marginals at successive cutoffs is of the same order. Because these contributions are summable, the ultraviolet cutoff can be removed for any fixed sequence of widths that grows fast enough with the shell index. Almost surely, the ultraviolet and infinite-width limits commute, and in either order the joint laws of finitely many smeared fields converge to those of the standard finite-volume $\\phi^4_2$ measure. The method of parametrizing a field via a network organized into momentum shells and integrating out one shell at a time is not specific to $\\phi^4_2$, so we expect it to extend to other theories.", "url": "https://arxiv.org/abs/2610.00453", "type": "理论", "summary": "神经网络场论通过网络架构和其参数的密度指定了欧几里得场论，因此相关函数是这些参数的积分。我们引入了构造性神经网络场论，并用它来实现有限体积标量 $\\phi^4_2$ 作为网络测度的限制。对于自由传播器的每个二元动量壳，该场被赋予一组单独的神经元，其具有从壳的频谱中提取的高斯系数、均匀相位和频率。一旦频率和相位固定，对一个壳的系数进行积分就是针对由 Wick 有序四次相互作用重新加权的高斯密度的有限维积分。在任何二维和三维耦合中，对于高于阈值的每个壳，重加权密度都是均匀对数凹的，并且这些壳场的波动保持在自由场尺度。在二维中，对于频率和相位的几乎每次绘制，尺度归纳表明壳 $j$ 为对数配分函数贡献 $O(2^{-2j}j^3)$，并且连续截止处的边际之间的总变化距离具有相同的数量级。\n\n由于这些贡献是可求和的，因此对于随壳指数增长得足够快的任何固定宽度序列，可以消除紫外线截止。几乎可以肯定的是，紫外线和无限宽度限制了交换，并且无论哪种顺序，有限多个涂抹场的联合定律都会收敛到标准有限体积 $\\phi^4_2$ 测度的联合定律。通过组织成动量壳的网络对场进行参数化并一次积分一个壳的方法并不特定于 $\\phi^4_2$，因此我们希望它能够扩展到其他理论。", "authors": [{"name": "Samuel Frank"}], "featured_authors": [{"name": "Samuel Frank"}], "author_count": 1}, {"id": "2610.00468", "category": "hep-th", "title": "${\\mathcal{N}}=3$ supersymmetric AdS$_4$ solutions in $d=11$ supergravity", "abstract": "We derive the necessary and sufficient conditions for AdS$_4$ solutions of $d=11$ supergravity to preserve ${\\mathcal{N}} \\leq 3$ supersymmetry. We use our setup to first impose ${\\mathcal{N}}=2$ supersymmetry, recovering a previously known class of solutions, providing a non-trivial consistency of our equations. We then focus on the ${\\mathcal{N}} = 3 $ case, first deriving the Tri-Sasaki class and then proving its uniqueness as the only ${\\mathcal{N}} = 3$ AdS$_4$ class in eleven dimensional supergravity. Our work proves that all supersymmetric AdS$_4$ solutions preserving ${\\mathcal{N}} > 2 $ supersymmetry are necessarily of Tri-Sasaki type.", "url": "https://arxiv.org/abs/2610.00468", "type": "理论", "summary": "我们推导出 $d=11$ 超引力的 AdS$_4$ 解的充分必要条件，以保持 ${\\mathcal{N}} \\leq 3$ 超对称性。我们使用我们的设置首先施加 ${\\mathcal{N}}=2$ 超对称性，恢复先前已知的一类解，为我们的方程提供非平凡的一致性。然后我们关注 ${\\mathcal{N}} = 3 $ 的情况，首先推导 Tri-Sasaki 类，然后证明其作为十一维超引力中唯一 ${\\mathcal{N}} = 3$ AdS$_4$ 类的唯一性。我们的工作证明，所有保持 ${\\mathcal{N}} > 2 $ 超对称性的超对称 AdS$_4$ 解都必然是 Tri-Sasaki 类型。", "authors": [{"name": "Andrea Conti"}], "featured_authors": [{"name": "Andrea Conti"}], "author_count": 1}, {"id": "2610.00470", "category": "hep-th", "title": "No Shortcuts to Infinity: Weil-Petersson Distance in Calabi-Yau Complex Structure Moduli Space", "abstract": "Infinite-distance limits play a central role in the Swampland program, but understanding their behaviour at intersections of boundary divisors is subtle, as it requires control over simultaneous limits of several moduli. To address this, we establish a necessary and sufficient criterion for a boundary stratum of arbitrary codimension in the complex-structure moduli space of Calabi-Yau manifolds to lie at infinite Weil-Petersson distance. In particular, intersections of infinite-distance boundary divisors necessarily remain at infinite distance. The result holds for the full Weil-Petersson metric and arbitrary trajectories, including those with unrestricted hierarchies in the saxions and axion winding. In compactifications of Type IIB string theory on Calabi-Yau threefolds, our proof is based on an inequality relating the Weil-Petersson length of a trajectory to the BPS mass associated with an auxiliary charge vector. If this mass tends to zero while the charge-to-mass ratio remains uniformly bounded, every trajectory approaching the limit has infinite length. Using asymptotic Hodge theory, we construct an auxiliary charge vector satisfying these conditions and derive the criterion directly from the limiting mixed Hodge structure associated with the degeneration. More generally, our result applies to polarized variations of Hodge structure of Calabi-Yau type. In particular, we prove Wang's conjecture on finite Weil-Petersson distance for degenerations over higher-dimensional bases.", "url": "https://arxiv.org/abs/2610.00470", "type": "理论", "summary": "无限距离限制在 Swampland 程序中发挥着核心作用，但理解它们在边界因子相交处的行为是微妙的，因为它需要控制多个模数的同时限制。为了解决这个问题，我们建立了卡拉比-丘流形复结构模空间中任意余维边界层位于无限韦尔-彼得森距离处的充要准则。特别是，无限距离边界因子的交点必然保持在无限距离处。结果适用于完整的 Weil-Petersson 度量和任意轨迹，包括那些在萨克子和轴子缠绕中具有不受限制的层次结构的轨迹。在 Calabi-Yau 三重的 IIB 型弦理论的紧凑化中，我们的证明基于轨迹的 Weil-Petersson 长度与与辅助电荷矢量相关的 BPS 质量相关的不等式。如果该质量趋于零，而荷质比保持一致，则每条接近极限的轨迹都具有无限长度。\n\n使用渐近 Hodge 理论，我们构造了满足这些条件的辅助电荷矢量，并直接从与简并相关的极限混合 Hodge 结构导出准则。更一般地说，我们的结果适用于 Calabi-Yau 型 Hodge 结构的极化变化。特别是，我们证明了王关于高维基退化的有限 Weil-Petersson 距离的猜想。", "authors": [{"name": "Jeroen Monnee"}], "featured_authors": [{"name": "Jeroen Monnee"}], "author_count": 1}, {"id": "2610.00476", "category": "hep-th", "title": "Supersymmetric quantum mechanics on a Kähler space", "abstract": "We prove that the classical part of the Nicolai map for a supersymmetric free nonrelativistic particle moving on a Kähler manifold is linear in the Kähler metric and local for its velocity. Moreover, we give an exact expression for the one-loop correction of the map in terms of the Kähler potential and point out a direct way to higher loop order. This provides another example for the rare cases of exact Nicolai maps, and the first all-order one-loop result. As a check we have verified the Nicolai-map conditions to zero and one-loop order (free-action and determinant-matching). A graphical representation is given as well.", "url": "https://arxiv.org/abs/2610.00476", "type": "理论", "summary": "我们证明，在凯勒流形上运动的超对称自由非相对论粒子的尼古拉映射的经典部分在凯勒度量中是线性的，并且其速度是局部的。此外，我们根据卡勒势给出了图的单环校正的精确表达式，并指出了获得更高环阶的直接方法。这为精确尼古拉映射的罕见情况和第一个全阶单循环结果提供了另一个例子。作为检查，我们已验证尼古拉映射条件为零和单循环顺序（自由动作和行列式匹配）。还给出了图形表示。", "authors": [{"name": "Olaf Lechtenfeld"}, {"name": "Fin Müller"}], "featured_authors": [{"name": "Olaf Lechtenfeld"}, {"name": "Fin Müller"}], "author_count": 2}, {"id": "2610.00478", "category": "hep-th", "title": "Algebraic structure in holographic tensor networks", "abstract": "In a previous work 2511.21852 , we explored the hypothesis that in general theories of quantum gravity, spacetime regions known as generalized entanglement wedges (introduced by Bousso and Penington) have an associated subalgebra of observables in a semiclassical limit. We defined an entropy associated with these subalgebras that obeys the same monotonicity and strong subadditivity properties as the generalized gravitational entropy of generalized entanglement wedges. Here, we test aspects of these ideas making use of tensor network toy models for holography. In this context, the analog of a generalized entanglement wedge is a region for which no region containing it has a smaller number of boundary legs. In the limit of large bond dimension (analogous to the semiclassical limit), we argue that each such region has a canonically associated subalgebra of the full algebra of observables on the boundary Hilbert space, as well as a family of unitarily related von Neumann factor subalgebras. We investigate in detail how various algebraic operations on these subalgebras (e.g. their intersections, joins, and commutants) are related to corresponding geometrical operations on the tensor network regions. We study to what extent the monotonicity and strong subadditivity properties of generalized entropy for generalized entanglement wedges follow from properties of our algebraic entropy. We also introduce an alternative entropic quantity $S(\\omega || \\omega \\circ E_{\\mathcal{A}'})$ associated with a subalgebra $\\mathcal{A}$ that also obeys monotonicity and strong subadditivity properties with suitable conditions. Finally, we explain how to define a type $II_1$ von Neumann algebra based on an infinite family of random tensor networks with increasing bond dimension such that the regions corresponding to generalized entanglement wedges can be associated with exact subalgebras of this full algebra.", "url": "https://arxiv.org/abs/2610.00478", "type": "理论", "summary": "在之前的工作 2511.21852 中，我们探讨了这样的假设：在量子引力的一般理论中，被称为广义纠缠楔的时空区域（由 Bousso 和 Penington 引入）在半经典极限内具有相关的可观测量子代数。我们定义了与这些子代数相关的熵，它遵循与广义纠缠楔的广义引力熵相同的单调性和强次可加性性质。在这里，我们利用张量网络全息玩具模型来测试这些想法的各个方面。在这种情况下，广义纠缠楔的类似物是这样一个区域，其中包含它的任何区域都没有较少数量的边界腿。在大键维数的极限（类似于半经典极限）中，我们认为每个这样的区域都具有边界希尔伯特空间上可观测量的完整代数的规范关联子代数，以及酉相关的冯诺依曼因子子代数族。我们详细研究了这些子代数上的各种代数运算（例如\n\n它们的交集、连接和交换）与张量网络区域上相应的几何运算相关。我们研究了广义纠缠楔的广义熵的单调性和强次可加性性质在多大程度上遵循代数熵的性质。我们还引入了与子代数 $\\mathcal{A}$ 相关的替代熵量 $S(\\omega || \\omega \\circ E_{\\mathcal{A}'})$，该子代数在适当的条件下也遵循单调性和强次可加性。最后，我们解释如何基于键维数递增的无限随机张量网络族来定义类型 $II_1$ 冯诺依曼代数，使得对应于广义纠缠楔的区域可以与该全代数的精确子代数相关联。", "authors": [{"name": "Abhisek Sahu"}, {"name": "Jeremy van der Heijden"}, {"name": "Mark Van Raamsdonk"}, {"name": "Rana Zibakhsh"}], "featured_authors": [{"name": "Abhisek Sahu"}, {"name": "Jeremy van der Heijden"}, {"name": "Mark Van Raamsdonk"}, {"name": "Rana Zibakhsh"}], "author_count": 4}, {"id": "2610.00482", "category": "hep-th", "title": "Twisted BPS decoupling limits and AdS/CFT", "abstract": "BPS decoupling limits of string and M-theory have led to profound insights into gravity and non-perturbative quantum theory, most notably with the AdS/CFT correspondence. In this paper, we initiate the study of twisted BPS decoupling limits, in which the relevant BPS states carry momentum along circle fibers geometrically twisted over a base space. Prime examples are found in type IIB string theory on AdS$_5\\times S^5$, for which the twisted limits involve the BPS states of the global symmetry algebra PSU$(2,2|4)$. In general, string fluctuations in a twisted BPS decoupling limit are described by non-relativistic sigma-models on emergent non-Lorentzian target spaces with a natural symplectic structure. This further supports the broader connection between BPS limits and non-Lorentzian geometry. We introduce analogous limits of D-branes as well, probing the same symplectic structure as the string. For AdS$_5\\times S^5$, twisted BPS decoupling limits are dual to Spin Matrix theory limits of $\\mathcal{N}=4$ supersymmetric Yang-Mills theory, providing tractable and explicit quantum-mechanical descriptions of non-perturbative regimes of AdS/CFT.", "url": "https://arxiv.org/abs/2610.00482", "type": "理论", "summary": "BPS 弦和 M 理论的解耦限制带来了对引力和非微扰量子理论的深刻见解，尤其是 AdS/CFT 对应关系。在本文中，我们启动了扭曲 BPS 解耦极限的研究，其中相关的 BPS 状态沿着在基础空间上几何扭曲的圆形纤维携带动量。在 AdS$_5\\times S^5$ 上的 IIB 型弦理论中可以找到主要的例子，其中扭曲极限涉及全局对称代数 PSU$(2,2|4)$ 的 BPS 状态。一般来说，扭曲 BPS 解耦极限中的弦涨落是通过具有自然辛结构的新兴非洛伦兹目标空间上的非相对论西格玛模型来描述的。这进一步支持了 BPS 极限和非洛伦兹几何之间更广泛的联系。我们还引入了 D 膜的类似极限，探测与弦相同的辛结构。对于 AdS$_5\\times S^5$，扭曲的 BPS 解耦极限与 $\\mathcal{N}=4$ 超对称 Yang-Mills 理论的自旋矩阵理论极限是对偶的，为 AdS/CFT 的非微扰状态提供了易于处理和明确的量子力学描述。", "authors": [{"name": "Troels Harmark"}], "featured_authors": [{"name": "Troels Harmark"}], "author_count": 1}, {"id": "2610.00486", "category": "hep-th", "title": "Gaugino condensates in $\\mathcal{N}=1$ super-Yang-Mills Theory on Eguchi-Hanson space", "abstract": "We study gaugino condensates in $\\mathcal{N}=1$ $SU(N)$ super-Yang--Mills theory on Eguchi--Hanson space using instanton methods. Fractional topological charge and the spectral asymmetry of the asymptotic $\\mathbb{RP}^3$ boundary modify the instanton calculus. A charge-$\\frac12$ instanton carries only two adjoint gaugino zero modes and can therefore contribute directly to the bilinear. Because the Eguchi--Hanson path integral prepares a boundary state on $\\mathbb{RP}^3$, the observables are boundary-sector-projected amplitudes. Moreover, supersymmetric Ward identities ensure that chiral correlators are independent of insertion points and the Eguchi--Hanson resolution parameter. For $SU(2)$ instanton, with central holonomy, the full collective-coordinate integral gives $\\langle\\operatorname{tr}(\\lambda\\lambda)\\rangle=16\\pi^2\\Lambda^3$ for a specified boundary projection, reproducing the flat-space value. For a single $SU(2)$-block embedding in $SU(N>2)$, the noncentral holonomy requires a continuum determinant for renormalization-group invariance, so zero modes alone do not determine the bilinear. We also study a charge-$1$ $SU(4)$ two-block saddle with central holonomy, $16$ bosonic moduli, and $8$ adjoint zero modes. Its collective-coordinate integral gives $\\langle\\prod_{i=1}^4\\operatorname{tr}(\\lambda\\lambda)(x_i)\\rangle=\\frac16(16\\pi^2\\Lambda^3)^4$. Under the assumptions required for position independence and clustering, this result determines the fourth power of the bilinear condensate in the corresponding boundary sector. Since no independent bilinear calculation is available in the same sector, the factor $1/6$ does not by itself constitute a clustering puzzle.", "url": "https://arxiv.org/abs/2610.00486", "type": "理论", "summary": "我们使用瞬子方法研究了 $\\mathcal{N}=1$ $SU(N)$ 上 Eguchi--Hanson 空间上的超杨--米尔斯理论中的高吉诺凝聚态。分数拓扑电荷和渐进 $\\mathbb{RP}^3$ 边界的谱不对称性修改了瞬子微积分。电荷 $\\frac12$ 瞬子仅携带两个伴随高吉诺零模式，因此可以直接对双线性做出贡献。因为 Eguchi--Hanson 路径积分在 $\\mathbb{RP}^3$ 上准备了边界状态，所以可观测量是边界扇区投影幅度。此外，超对称沃德恒等式确保手性相关器独立于插入点和 Eguchi-Hanson 分辨率参数。对于具有中心完整的 $SU(2)$ 瞬子，完整的集体坐标积分给出指定边界投影的 $\\langle\\operatorname{tr}(\\lambda\\lambda)\\rangle=16\\pi^2\\Lambda^3$ ，再现平坦空间值。对于嵌入 $SU(N>2)$ 中的单个 $SU(2)$ 块，非中心完整性需要重正化群不变性的连续行列式，因此仅零模态并不能确定双线性。\n\n我们还研究了具有中心完整、$16$ 玻色模和 $8$ 伴随零模式的电荷-$1$$SU(4)$ 两块鞍。其集体坐标积分给出 $\\langle\\prod_{i=1}^4\\operatorname{tr}(\\lambda\\lambda)(x_i)\\rangle=\\frac16(16\\pi^2\\Lambda^3)^4$。在位置独立和聚类所需的假设下，该结果确定了相应边界扇区中双线性凝聚的四次方。由于在同一扇区中没有独立的双线性计算可用，因此因子 $1/6$ 本身并不构成聚类难题。", "authors": [{"name": "Mohamed M. Anber"}], "featured_authors": [{"name": "Mohamed M. Anber"}], "author_count": 1}, {"id": "2610.00516", "category": "hep-th", "title": "Mock Modularity, Resurgence, and Dual False Theta Functions", "abstract": "The $\\hat{Z}$ invariant of a three-manifold $M_{3}$, a half-index of the $3d$ $\\mathcal{N}=2$ theory $T[M_{3}]$, is well understood for negative-definite plumbed three-manifolds. For orientation-reversed manifolds, however, the known formulas fail to produce $q$-series, and making sense of the operation $q \\rightarrow q^{-1}$ remains a central open problem. Seifert manifolds, whose $\\hat{Z}$ invariants are built from false theta functions, offer a natural testing ground. We study ``dual false theta functions'', the objects that should replace false theta functions under orientation reversal. Two characterizations of these duals exist in the literature: a modular one, based on mock modularity with a prescribed shadow, and a resurgent one, based on Borel--Mordell integrals and transseries. We prove that the two characterizations are equivalent. We construct a new family of dual false theta functions for values of positive integer $p$ satisfying a Pell-equation condition. Its members are built from Zwegers' indefinite theta functions, have integer coefficients, and have effective central charge $c_{\\text{eff}} \\leq 1$. We also show that the mock theta functions of Li and Schwagenscheidt satisfy these characterizations and arise from a natural regularization of the divergent product $\\eta^{3}(\\tau)\\psi_{p, a}(- \\tau)$.", "url": "https://arxiv.org/abs/2610.00516", "type": "理论", "summary": "三流形 $M_{3}$ 的 $\\hat{Z}$ 不变量是 $3d$ $\\mathcal{N}=2$ 理论 $T[M_{3}]$ 的半指数，对于负定垂线三流形来说是很好理解的。然而，对于方向反转流形，已知的公式无法产生 $q$ 级数，并且理解 $q \\rightarrow q^{-1}$ 运算仍然是一个中心开放问题。 Seifert 流形的 $\\hat{Z}$ 不变量是由错误的 theta 函数构建的，提供了一个天然的测试场地。我们研究“双假西塔函数”，即在方向反转下应该替换假西塔函数的对象。文献中存在这些对偶的两个特征：一种是模块化的，基于具有规定阴影的模拟模块化；另一种是基于 Borel-Mordell 积分和跨级数的复兴特征。我们证明这两个特征是等价的。我们为满足佩尔方程条件的正整数 $p$ 的值构造了一个新的双假 theta 函数族。其成员由 Zwegers 的不定 theta 函数构建，具有整数系数，并具有有效中心电荷 $c_{\\text{eff}} \\leq 1$。\n\n我们还表明，Li 和 Schwagenscheidt 的模拟 theta 函数满足这些特征，并且源自发散积 $\\eta^{3}(\\tau)\\psi_{p, a}(- \\tau)$ 的自然正则化。", "authors": [{"name": "Mrunmay Jagadale"}], "featured_authors": [{"name": "Mrunmay Jagadale"}], "author_count": 1}, {"id": "2610.00556", "category": "hep-th", "title": "Hamiltonian formalism for a 5-D brane cosmolgy", "abstract": "In this work we explores the dynamic solutions of a brane system in a five dimensional space-time under the Hamiltonian perspective, using the De Donner Weyl formalism. We obtain the dynamic equations for the scale factors, and obtain the Friedmann-like equations in general way. We present the solutions of the scale factors as a function of the extra coordinate, $y$, we show that the geometry is related to the matter-energy component in the brane. Finally, we develop the ADM formalism in the brane point of view with the foliation of the 3-dimensional space which is embedded in a 5-dimensional manifold.", "url": "https://arxiv.org/abs/2610.00556", "type": "理论", "summary": "在这项工作中，我们使用德唐纳外尔形式主义，在哈密顿观点下探索五维时空膜系统的动态解。我们得到了尺度因子的动力学方程，并以一般的方式得到了类Friedmann方程。我们将比例因子的解呈现为额外坐标 $y$ 的函数，我们表明几何形状与膜中的物质能量分量有关。最后，我们从膜的角度发展了ADM形式主义，其中3维空间的叶状结构嵌入到5维流形中。", "authors": [{"name": "José Socorro García"}, {"name": "Juan Luis Pérez"}], "featured_authors": [{"name": "José Socorro García"}, {"name": "Juan Luis Pérez"}], "author_count": 2}, {"id": "2610.00670", "category": "hep-th", "title": "Monogamous quantum corrections to holographic mutual information", "abstract": "We construct an extensive model of bulk mutual information (MI) in anti-de Sitter spacetime and use it to describe the leading quantum corrections to the MI of certain holographic theories. The equivalence between bulk and boundary MI follows from the Faulkner--Lewkowycz--Maldacena prescription. We show that the extensivity of the bulk MI is sufficient for the quantum-corrected boundary entropy vector to satisfy monogamy of MI and all other holographic entropy cone inequalities. Our model is built from a covariantly conserved current-current kernel in AdS and is realized explicitly by a free massive Dirac fermion, whose boundary MI at long distances is that of a fermionic generalized free field (GFF). The construction also reproduces the expected short-distance divergence structure of a GFF, and the current-current correlator defines a positive and monotonically decreasing function along the renormalization-group flow. We illustrate this explicitly for disjoint half-disks at the conformal fixed point of the model in AdS$_3$, where we present the exact result.", "url": "https://arxiv.org/abs/2610.00670", "type": "理论", "summary": "我们构建了反德西特时空中体互信息（MI）的广泛模型，并用它来描述某些全息理论的 MI 的主要量子修正。体积 MI 和边界 MI 之间的等价性源自 Faulkner--Lewkowycz--Maldacena 处方。我们证明，体 MI 的广延性足以使量子校正边界熵向量满足 MI 的一夫一妻制和所有其他全息熵锥不等式。我们的模型是根据 AdS 中的协变守恒电流-电流核构建的，并由自由大质量狄拉克费米子显式实现，其远距离边界 MI 是费米子广义自由场 (GFF) 的边界。该结构还再现了 GFF 的预期短距离发散结构，并且电流-电流相关器定义了沿着重正化群流的正单调递减函数。我们在 AdS$_3$ 模型的保形不动点处明确地说明了不相交半盘的情况，并在其中给出了准确的结果。", "authors": [{"name": "César A. Agón"}, {"name": "Javier Molina-Vilaplana"}, {"name": "Javier Moreno"}], "featured_authors": [{"name": "César A. Agón"}, {"name": "Javier Molina-Vilaplana"}, {"name": "Javier Moreno"}], "author_count": 3}, {"id": "2610.00745", "category": "hep-th", "title": "Absence of Continuous Spin Particles in Superstring Theory", "abstract": "The study of continuous spin particles, as general low-energy implications of relativity and quantum mechanics, has intensified in recent years with potential experimental signatures. In this note we show that these particles are absent in perturbative super-string theories, generalising a result in arXiv:1302.4771 to the supersymmetric case. This stands out as a general low-energy prediction of all perturbative superstring constructions.", "url": "https://arxiv.org/abs/2610.00745", "type": "理论", "summary": "作为相对论和量子力学的一般低能含义，对连续自旋粒子的研究近年来不断加强，并具有潜在的实验特征。在这篇文章中，我们证明这些粒子在微扰超弦理论中不存在，将 arXiv:1302.4771 中的结果推广到超对称情况。这是所有微扰超弦结构的一般低能量预测。", "authors": [{"name": "Arwa Alabbasi"}, {"name": "Fernando Quevedo"}], "featured_authors": [{"name": "Arwa Alabbasi"}, {"name": "Fernando Quevedo"}], "author_count": 2}, {"id": "2610.00803", "category": "hep-th", "title": "Antipodal Self-Duality for Generalized Fishnets from Integrability", "abstract": "Antipodal self-duality (ASD) is a remarkable property that relates an amplitude to itself, after performing a suitable kinematic map and reversing the letters of the symbol (more precisely, acting with the antipode of the Hopf algebra of multiple polylogarithms). ASD has been seen in only one process in planar $\\mathcal{N}=4$ super-Yang-Mills theory, and its physical origin is unknown, motivating a search for ASD in other contexts. Recently, ASD was found to hold for square fishnet integrals in a strongly-deformed version of planar $\\mathcal{N}=4$. In this paper, we investigate the properties of polynomials in ladder integrals under the ASD transformation that leaves the square fishnet invariant. Our basic building blocks are determinants of certain matrices of ladder integrals, that are labeled by partitions or Young diagrams, and automatically obey the Steinmann relations. We employ integrability-based representations of such determinants, which are essentially matrix-model integrals, and the theory of symmetric polynomials to find many more ASD quantities -- linear combinations of determinants whose coefficients are expressed using the combinatorics of partitions. As a byproduct, we provide an alternate proof that square fishnet integrals obey ASD.", "url": "https://arxiv.org/abs/2610.00803", "type": "理论", "summary": "对映体自对偶性 (ASD) 是一个显着的特性，在执行适当的运动图并反转符号的字母（更准确地说，与多个多对数的 Hopf 代数的对映体一起作用）后，它将振幅与其自身相关联。 ASD 只出现在平面 $\\mathcal{N}=4$ super-Yang-Mills 理论中的一个过程中，并且其物理起源未知，这激发了在其他情况下寻找 ASD 的兴趣。最近，ASD被发现适用于平面 $\\mathcal{N}=4$ 的强变形版本中的方形渔网积分。在本文中，我们研究了 ASD 变换下梯形积分中多项式的性质，该变换使方形渔网保持不变。我们的基本构建块是某些阶梯积分矩阵的行列式，这些矩阵由分区或杨图标记，并自动服从斯坦曼关系。我们采用这些行列式的基于可积性的表示（本质上是矩阵模型积分）和对称多项式理论来找到更多的 ASD 量 - 行列式的线性组合，其系数使用分区组合来表示。\n\n作为副产品，我们提供了方形渔网积分服从 ASD 的替代证明。", "authors": [{"name": "Lance J. Dixon"}, {"name": "Claude Duhr"}, {"name": "Francesca C. Fernandes"}, {"name": "Victor Mishnyakov"}], "featured_authors": [{"name": "Lance J. Dixon"}, {"name": "Claude Duhr"}, {"name": "Francesca C. Fernandes"}, {"name": "Victor Mishnyakov"}], "author_count": 4}, {"id": "2610.00844", "category": "hep-th", "title": "Complexity study of the Hartle-Hawking state in JT gravity", "abstract": "The negativity of the Wigner function gives an operationally meaningful measure of the complexity of simulating a quantum state on a classical computer. We study its growth for the Hartle-Hawking state under time evolution in Jackiw-Teitelboim gravity, in the length basis. At the disk level, and to leading order in the semiclassical parameter $\\beta$, the Hartle-Hawking state is a minimum-uncertainty Gaussian wavepacket at rest at the turning point of the Liouville wall, centred at $x=2\\log(2\\beta/\\pi)
