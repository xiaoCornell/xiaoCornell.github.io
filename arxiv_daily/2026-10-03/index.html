$ with $\\langle p^2\\rangle=\\pi^2/8\\beta$. Its Wigner function is positive, so its negativity is $1+o(1)$ for all sub-exponential times; it is even in $t$ by time-reversal symmetry, and exactly frozen once the reflected packet decouples from the wall, because free evolution is a Clifford shear. At late times the negativity saturates close to its upper bound, at $\\sqrt{2/\\pi}\\sqrt{d_{\\rm eff}(\\beta)}$ with $d_{\\rm eff}(\\beta)=Z(\\beta)^2/Z(2\\beta)$, a value that requires the discrete spectrum. Unlike the spectral form factor, the negativity displays no ramp: the two-boundary wormhole contribution is suppressed by $e^{-2S_0}$ relative to a disk term that, unlike that of the spectral form factor, does not decay. The exact survival amplitude $Z(\\beta+it)/Z(\\beta)$ gives the spread complexity growing as $\\sigma_E^2t^2$, and the seed-normalised negativity is, at the disk level, the inverse of the exact survival probability. We take this as evidence that the length basis is ideally suited for a dual, semi-classical effective description of chaotic quantum dynamics for large $e^{S_0}$ at sub-exponential times.", "url": "https://arxiv.org/abs/2610.00844", "type": "理论", "summary": "维格纳函数的负性给出了在经典计算机上模拟量子态的复杂性的具有操作意义的度量。我们研究了哈特尔-霍金态在 Jackiw-Teitelboim 引力的时间演化下以长度为基础的增长。在盘层面，对于半经典参数 $\\beta$ 的前序，Hartle-Hawking 状态是在刘维尔壁转折点处静止的最小不确定性高斯波包，以 $x=2\\log(2\\beta/\\pi)$ 为中心，$\\langle p^2\\rangle=\\pi^2/8\\beta$。它的维格纳函数是正的，所以它的负函数对于所有次指数时间都是$1+o(1)$；通过时间反转对称性，它甚至处于 $t$ 中，并且一旦反射的数据包与墙解耦，它就会完全冻结，因为自由演化是克利福德剪切。在后期，负值接近其上限，在 $\\sqrt{2/\\pi}\\sqrt{d_{\\rm eff}(\\beta)}$ 处饱和，其中 $d_{\\rm eff}(\\beta)=Z(\\beta)^2/Z(2\\beta)$ 是一个需要离散谱的值。\n\n与谱形状因子不同，负性不显示斜坡：相对于盘项，两边界虫洞贡献被 $e^{-2S_0}$ 抑制，与谱形状因子不同，盘项不会衰减。精确的生存幅度 $Z(\\beta+it)/Z(\\beta)$ 给出了扩展复杂度随着 $\\sigma_E^2t^2$ 的增长而增长，并且种子归一化负性在磁盘级别是精确生存概率的倒数。我们以此作为证据，证明长度基础非常适合对次指数时间的大 $e^{S_0}$ 混沌量子动力学进行对偶、半经典有效描述。", "authors": [{"name": "Ritam Basu"}], "featured_authors": [{"name": "Ritam Basu"}], "author_count": 1}, {"id": "2610.01101", "category": "hep-th", "title": "Analytic Dual Resonance and the String Bootstrap", "abstract": "Dual resonance reconstructs a scattering amplitude from pole expansions in different channels. We propose analytic dual resonance (ADR), requiring that the complete leading pole sum at an integer resonance admit an absolutely convergent local contour integral. ADR yields one-dimensional pairing relations between residues in arbitrary triangulations. Together with an integer planar spectrum, a joint crossing-spin bound, and complex Regge decay permitting unsubtracted reconstruction, these relations uniquely fix the scalar string amplitude for every $n\\ge5$. ADR also predicts higher-dimensional pinch relations, which we examine at five and six points. These results connect the analytic structure of dual resonance to the uniqueness of string interactions.", "url": "https://arxiv.org/abs/2610.01101", "type": "理论", "summary": "双共振根据不同通道中的极扩展重建散射幅度。我们提出解析对偶谐振（ADR），要求整数谐振处的完整主极点和允许绝对收敛的局部轮廓积分。 ADR 产生任意三角剖分中残基之间的一维配对关系。与整数平面谱、联合交叉自旋界限和允许未减重建的复杂 Regge 衰减一起，这些关系唯一地固定了每个 $n\\ge5$ 的标量弦振幅。 ADR 还预测高维夹点关系，我们在五个和六个点上进行检查。这些结果将双共振的分析结构与弦相互作用的独特性联系起来。", "authors": [{"name": "Qu Cao"}], "featured_authors": [{"name": "Qu Cao"}], "author_count": 1}, {"id": "2610.01152", "category": "hep-th", "title": "The Love for Three Logarithms: Universal Running of Dynamical Love Numbers", "abstract": "The static tidal Love numbers of black holes vanish in general relativity (GR), but are generically non-zero, and in fact 'run' logarithmically with scale, in more general theories or beyond the static limit. We expose a model-agnostic framework for the running of Love numbers at the dynamical level, valid for any tidal perturbation on any static, spherically symmetric, asymptotically flat background, based on the near-zone expansion in powers of the frequency $\\omega$ and on the monodromy at spatial infinity. A master recurrence formula determines the monodromy generator to all orders in $\\omega^2$, whose three independent entries fully encode the running of the Love numbers. This structure explains the quadratic nature of the renormalization group equation, here proved to all orders and for any type of Love number. We discuss the scheme dependence of the logarithmic coefficients, which is made transparent by the monodromy form. In particular, this clarifies that the anomalous exponents of the tidal field, the so-called 'renormalized angular momentum' of the Mano-Suzuki-Takasugi formalism, are scheme-invariant and directly computable on any spacetime, without need of explicit solutions. We discuss several applications to black holes, including the derivation of a closed-form formula for the leading dynamical running of axial Love numbers of Reissner-Nordström black holes, proving in particular that it vanishes in the extremal limit. For generic black holes beyond GR, we prove that dynamical running probes deformations of the metric at lower multipoles than the static one, and we illustrate the power of the method by deriving some exact results for the Hayward and Bardeen regular black holes.", "url": "https://arxiv.org/abs/2610.01152", "type": "理论", "summary": "黑洞的静态潮汐乐夫数在广义相对论（GR）中消失，但通常不为零，并且实际上在更一般的理论中或超出静态极限时与尺度呈对数“运行”。我们基于频率 $\\omega$ 幂的近区展开和空间无穷大的单向性，提出了一个在动态层面上运行 Love 数的与模型无关的框架，该框架对于任何静态、球对称、渐近平坦背景上的任何潮汐扰动都有效。主递推公式确定了 $\\omega^2$ 中所有阶的单性生成器，其三个独立条目完全编码了 Love 数的运行。这种结构解释了重整化群方程的二次性质，这里证明了所有阶数和任何类型的洛夫数。我们讨论对数系数的格式依赖性，这通过单峰形式变得透明。\n\n特别是，这阐明了潮汐场的反常指数，即所谓的 Mano-Suzuki-Takasugi 形式主义的“重整化角动量”，是格式不变的，并且可以在任何时空上直接计算，而不需要明确的解决方案。我们讨论了黑洞的几种应用，包括推导 Reissner-Nordström 黑洞轴向 Love 数的主导动态运行的封闭式公式，特别证明它在极值极限中消失。对于广义相对论之外的一般黑洞，我们证明了动态运行在比静态运行更低的多极点处探测了度量的变形，并且我们通过推导海沃德和巴丁规则黑洞的一些精确结果来说明该方法的威力。", "authors": [{"name": "Sebastian Garcia-Saenz"}], "featured_authors": [{"name": "Sebastian Garcia-Saenz"}], "author_count": 1}, {"id": "2610.01292", "category": "hep-th", "title": "Gravity and generalised geometry from a Lie 2-algebroid perspective", "abstract": "We revisit the problem of defining natural torsion and curvature tensors for generalised connections and of using them to reconstruct the effective action for the massless modes of the closed string from generalised geometry. The starting point is the description of a Courant algebroid as a differential graded (dg) symplectic manifold. A systematic procedure for split dg manifolds singles out a generalised Lie bracket as part of a larger Lie 2-algebroid structure, with the right properties to unambiguously define torsion and Riemann curvature tensors together with their corresponding Bianchi identities. This framework eliminates the structural circularity and ambiguity problems of previous approaches in the literature. We show that a unique generalised metric compatible generalised connection with fixed (con)torsion exists for any choice of ordinary connection that splits the dg manifold, while at the same time all Lie 2-algebroids obtained in this way are equivalent up to $L_{\\infty}$ quasi-isomorphisms. For a given Lie 2-algebroid we demonstrate that the unique compatible generalised connection reproduces the effective closed string action from a geometric action based on the new generalised Ricci tensor upon making a canonical choice of torsion.", "url": "https://arxiv.org/abs/2610.01292", "type": "理论", "summary": "我们重新审视定义广义连接的自然扭转和曲率张量的问题，并使用它们从广义几何中重建闭弦无质量模式的有效作用。起点是将库朗代数体描述为微分分级 (dg) 辛流形。分裂 dg 流形的系统过程挑选出广义李括号作为更大的李 2 代数体结构的一部分，具有明确定义挠率和黎曼曲率张量及其相应的比安奇恒等式的正确属性。该框架消除了文献中先前方法的结构循环和模糊性问题。我们证明，对于分裂 dg 流形的普通连接的任何选择，都存在具有固定（con）扭力的唯一广义度量兼容广义连接，同时以这种方式获得的所有李 2-代数体等效于 $L_{\\infty}$ 准同构。\n\n对于给定的李 2 代数体，我们证明了独特的兼容广义连接在做出规范的扭转选择时，可以根据新的广义 Ricci 张量从几何作用再现有效的闭弦作用。", "authors": [{"name": "Athanasios Chatzistavrakidis"}, {"name": "Chris Hull"}, {"name": "Larisa Jonke"}, {"name": "Sylvain Lavau"}, {"name": "Peter Schupp"}], "featured_authors": [{"name": "Athanasios Chatzistavrakidis"}, {"name": "Chris Hull"}, {"name": "Larisa Jonke"}, {"name": "Sylvain Lavau"}, {"name": "Peter Schupp"}], "author_count": 5}, {"id": "2610.01366", "category": "hep-th", "title": "A celestial viewpoint on infrared divergences in QCD", "abstract": "Non-abelian infrared radiation can be seen as both a practical ingredient for QCD phenomenology and a window on the long-distance structure of gauge theories. During the last decade, a novel viewpoint was developed on infrared phenomena: soft currents are seen as arising from asymptotic symmetries realised on the celestial sphere, and soft colour correlations similarly emerge from a two-dimensional conformal field theory on the sphere. In this contribution, we briefly review the status of this approach. We begin with the standard bulk picture, presenting the infrared factorisation of massless scattering amplitudes, and then we show how universal infrared information gets mapped to marked points on the celestial sphere. In particular, soft colour-dipole singularities are reproduced to all orders by a correlator of vertex operators in a free-boson theory on the sphere. We then proceed to study soft-gluon currents, and show how bulk results constrain the structure of the celestial theory beyond the free-field limit. For single emission, we note that all logarithms in dipole-like loop contributions can be absorbed into the choice of scale for the strong coupling. For multiple emission, we show how the emerging mixed-helicity celestial operator product expansion must be weighted by energy fractions, breaking holomorphic factorisation and obstructing associativity under successive collinear limits. These results illustrate a remarkable connection between the familiar physics of infrared QCD and the dynamics of a two-dimensional theory on the celestial sphere.", "url": "https://arxiv.org/abs/2610.01366", "type": "理论", "summary": "非阿贝尔红外辐射既可以被视为 QCD 现象学的实用成分，又可以被视为规范理论长距离结构的窗口。在过去的十年中，人们对红外现象提出了一种新的观点：软电流被认为是由天球上实现的渐近对称性产生的，而软颜色相关性同样是从球体上的二维共形场论中出现的。在本文中，我们简要回顾了这种方法的现状。我们从标准的整体图片开始，展示无质量散射振幅的红外因式分解，然后展示通用红外信息如何映射到天球上的标记点。特别是，在球体上的自由玻色子理论中，软颜色偶极子奇点由顶点算子的相关器再现到所有阶。然后，我们继续研究软胶子电流，并展示批量结果如何将天体理论的结构限制在自由场极限之外。对于单次发射，我们注意到类偶极子环贡献中的所有对数都可以被吸收到强耦合尺度的选择中。\n\n对于多次发射，我们展示了新兴的混合螺旋天体算子乘积展开必须如何通过能量分数进行加权，打破全纯分解并阻碍连续共线限制下的关联性。这些结果说明了熟悉的红外 QCD 物理学与天球二维理论动力学之间的显着联系。", "authors": [{"name": "Lorenzo Magnea"}, {"name": "Enrico Zunino"}], "featured_authors": [{"name": "Lorenzo Magnea"}, {"name": "Enrico Zunino"}], "author_count": 2}, {"id": "2610.01455", "category": "hep-th", "title": "From Modal Memory to Topological Relaxation in a Driven Holographic Superfluid", "abstract": "We study how driving history affects the nonlinear topological relaxation of a holographic superfluid. Different histories are constructed to reach the same present driving conditions and then follow the same future protocol. Although they relax to the same final winding sector, their late-time dynamics remain strongly history-dependent: the residence time of the penultimate winding sector changes by about a factor of \\(3.7\\). This variation is organised by the modal imbalance carried into the common amplification stage. Histories with different shapes but matched modal imbalance produce nearly identical relaxation times. The same qualitative behaviour is found for a second pair of competing modes.", "url": "https://arxiv.org/abs/2610.01455", "type": "理论", "summary": "我们研究驾驶历史如何影响全息超流体的非线性拓扑弛豫。构建不同的历史来达到相同的当前驾驶条件，然后遵循相同的未来协议。尽管它们放松到相同的最终缠绕扇区，但它们的后期动态仍然强烈依赖于历史：倒数第二个缠绕扇区的停留时间变化约\\(3.7\\)。这种变化是由公共放大级中的模态不平衡造成的。具有不同形状但匹配模态不平衡的历史产生几乎相同的弛豫时间。对于第二对竞争模式也发现了相同的定性行为。", "authors": [{"name": "Yan Peng"}, {"name": "Bo-Xuan Ge"}], "featured_authors": [{"name": "Yan Peng"}, {"name": "Bo-Xuan Ge"}], "author_count": 2}, {"id": "2610.01571", "category": "hep-th", "title": "On-shell renormalization of sine-Gordon by the quantum inverse scattering method", "abstract": "In the quantum inverse scattering method, the sine-Gordon model is solved on a lattice, and its continuum and infinite-volume limits become uniform only after the length of the box is rescaled. We show that this rescaling, supplemented by an on-shell condition, defines a renormalization scheme. The whole dependence on the cut-off is absorbed into a factor $Z_L$ multiplying the length of the box, with an exponent fixed by the scaling dimension of the vertex operator; neither the field nor the coupling $\\beta$ is renormalized, no subtraction scale is introduced, and the mass parameter receives a finite renormalization, fixed by requiring that the lightest breather has the mass of the boson in the linearized theory. The soliton and breather masses follow from the eigenvalues of the monodromy operator as functions of parameters that do not run, and reduce to the classical and semiclassical results as $\\beta\\rightarrow0$. In particular, the mass ratios are produced directly from the regularized construction, while the relation between the lattice parameters and the physical scale is absorbed into $Z_L$ and never needs to be computed. The scheme is a reparameterization of the theory which makes explicit the interplay between integrability and renormalization. We compare it with Coleman's normal ordering and with conformal perturbation theory, and we argue that it extends to ultralocal integrable theories with a massive spectrum, possibly including asymptotically free models that admit an ultralocal lattice regularization.", "url": "https://arxiv.org/abs/2610.01571", "type": "理论", "summary": "在量子逆散射方法中，正弦戈登模型在晶格上求解，只有在重新调整盒子的长度后，其连续体和无限体积极限才变得均匀。我们证明，这种重新缩放，辅以壳内条件，定义了重整化方案。对截止的全部依赖被吸收到一个因子 $Z_L$ 乘以盒子的长度，指数由顶点算子的缩放维度固定；场和耦合 $\\beta$ 都没有被重整化，没有引入减法尺度，并且质量参数接受有限的重整化，通过要求最轻的呼吸者具有线性化理论中玻色子的质量来固定。孤子和呼吸质量由单向算子的特征值得出，作为不运行的参数的函数，并简化为经典和半经典结果 $\\beta\\rightarrow0$。特别是，质量比直接从正则化结构中产生，而晶格参数和物理尺度之间的关系被吸收到$Z_L$中并且不需要计算。\n\n该方案是理论的重新参数化，它明确了可积性和重整化之间的相互作用。我们将其与科尔曼的正常排序和共形微扰理论进行比较，并且我们认为它扩展到具有大量谱的超局域可积理论，可能包括允许超局域晶格正则化的渐近自由模型。", "authors": [{"name": "Francesco Beccarini"}, {"name": "Claudio Conti"}], "featured_authors": [{"name": "Francesco Beccarini"}, {"name": "Claudio Conti"}], "author_count": 2}, {"id": "2610.01665", "category": "hep-th", "title": "Einstein-Gauss-Bonnet quintessential inflation: From super-inflation to emergent warm inflation", "abstract": "This work presents a unified inflationary and late-time cosmology, developed within Einstein-Gauss-Bonnet gravity coupled to three scalar fields, governed by a single potential and coupling function throughout cosmic history. Permitting the Gauss-Bonnet coupling to depend on the field content, rather than assigning it arbitrarily, produces a two-phase inflationary scenario: the higher-curvature term initially drives expansion and later becomes a subdominant. The initial super-inflationary stage ends dynamically when the geometrically induced stabilization of the waterfall field fails, at a field value determined by the combination $(n-1)Q$. Coherent oscillations of the waterfall condensate serve as the initial radiation source, replacing conventional reheating and establishing the thermal bath necessary for the subsequent warm phase. Utilizing a two-stage dissipation mechanism with $\\Gamma_\\phi\\propto T^3$, the scalar and tensor spectra are derived while retaining Gauss-Bonnet contributions, demonstrating that the growth of inflaton fluctuations is regulated by the shear viscosity of the bath, which is essential for model viability. A quartic potential, previously excluded in the cold scenario, becomes viable, with $n_s$ within the Planck $1\\sigma$ band and $r$ suppressed. Agreement with the spectral index is generic, while internal consistency confines the model to a narrow band in $(n-1)Q$. Finally, the release of the third scalar near matter-radiation equality transforms a very small mass scale into a very large coupling by a logic inverse to the seesaw mechanism. At late times, the inflaton persists as dark energy.", "url": "https://arxiv.org/abs/2610.01665", "type": "理论", "summary": "这项工作提出了一种统一的暴胀和晚期宇宙学，它是在爱因斯坦-高斯-博内引力耦合到三个标量场的情况下发展起来的，在整个宇宙历史中由单一势能和耦合函数控制。允许高斯-博内耦合取决于场内容，而不是任意分配它，会产生两阶段膨胀场景：较高曲率项最初驱动膨胀，后来成为次主导。当几何诱导的瀑布场稳定性失效时，初始超级暴胀阶段动态结束，场值由组合 $(n-1)Q$ 确定。瀑布凝结水的相干振荡作为初始辐射源，取代了传统的再加热并建立了后续暖阶段所需的热浴。利用 $\\Gamma_\\phi\\propto T^3$ 的两级耗散机制，在保留高斯-邦尼特贡献的同时导出标量和张量谱，证明暴胀涨落的增长受到浴液剪切粘度的调节，这对于模型的可行性至关重要。\n\n先前在冷场景中排除的四次势变得可行，其中 $n_s$ 在普朗克 $1\\sigma$ 频带内并且 $r$ 受到抑制。与光谱指数的一致性是通用的，而内部一致性将模型限制在 $(n-1)Q$ 的窄带内。最后，接近物质辐射相等的第三个标量的释放通过与跷跷板机制相反的逻辑将非常小的质量尺度转变为非常大的耦合。在后期，暴胀子以暗能量的形式持续存在。", "authors": [{"name": "Omar Chahboun"}, {"name": "Rachid Ahl Laamara"}, {"name": "El Hassan Saidi"}], "featured_authors": [{"name": "Omar Chahboun"}, {"name": "Rachid Ahl Laamara"}, {"name": "El Hassan Saidi"}], "author_count": 3}, {"id": "2610.01760", "category": "hep-th", "title": "Tree-Level Interaction Vertices in the Linear Sigma Model with Quarks under Global Rotation", "abstract": "We derive the tree-level interaction vertices of the linear sigma model with quarks in the presence of global rotation. Starting from the scalar and fermionic field solutions in a rotating background, we construct the corresponding spectral representations and use them to evaluate the mesonic self-interactions and Yukawa couplings of the model. We show that rotation modifies the usual momentum-space structure of the interaction vertices: conservation of longitudinal momentum is accompanied by angular-momentum selection rules, while the transverse dynamics is encoded in rotation-induced radial form factors involving products of Bessel functions. The resulting expressions provide a set of interaction rules adapted to the symmetries and finite geometry of the rotating system. Although derived within the linear sigma model with quarks, the structures obtained for scalar self-interactions and scalar-fermion couplings can be extended to a broader class of quantum field theories under global rotation. These results provide the building blocks for perturbative calculations and contribute toward a microscopic quantum-field-theoretical description of interacting matter in rotating environments.", "url": "https://arxiv.org/abs/2610.01760", "type": "理论", "summary": "我们在存在全局旋转的情况下推导了线性西格玛模型与夸克的树级相互作用顶点。从旋转背景下的标量场和费米子场解开始，我们构造了相应的谱表示，并用它们来评估模型的介子自相互作用和汤川耦合。我们证明旋转改变了相互作用顶点的通常动量空间结构：纵向动量守恒伴随着角动量选择规则，而横向动力学被编码在涉及贝塞尔函数乘积的旋转引起的径向形状因子中。由此产生的表达式提供了一组适合旋转系统的对称性和有限几何形状的相互作用规则。尽管是在带有夸克的线性西格玛模型中导出的，但标量自相互作用和标量-费米子耦合获得的结构可以扩展到全局旋转下更广泛的量子场论。\n\n这些结果为微扰计算提供了基础，并有助于对旋转环境中相互作用的物质进行微观量子场理论描述。", "authors": [{"name": "Luis A. Hernández"}, {"name": "Eduardo Lazcano"}, {"name": "R. Zamora"}], "featured_authors": [{"name": "Luis A. Hernández"}, {"name": "Eduardo Lazcano"}, {"name": "R. Zamora"}], "author_count": 3}, {"id": "2610.01775", "category": "hep-th", "title": "From Hidden Zeros to Exact Splittings and New Zeros", "abstract": "Hidden zeros impose constraints on scattering amplitudes beyond their familiar factorization properties. We explore their structure in two related directions. We first promote hidden zeros to explicit splitting formulas that organize full amplitudes at generic kinematics. Ordered $\\mathrm{Tr}(\\phi^3)$ amplitudes, nonlinear sigma model (NLSM) amplitudes, and cosmological wavefunctions share the same defining exact splitting structure $\\mathcal A=\\sum_\\alpha R_\\alpha\\, {\\mathcal J}_{\\alpha,L}{\\mathcal J}_{\\alpha,R} {\\mathcal J}_{\\alpha,\\mathrm{out}}$, adapted to any hidden zero. Each prefactor $R_\\alpha$ is a condition of the hidden zero locus, so this decomposition manifests the hidden vanishing term by term. The remaining factors are lower point amplitudes or currents. Using these representations, we can systematically find new zero loci beyond the usual ones. In particular, we obtain five new all-multiplicity zero families. We also find continuous families of zeros: the coefficients of their defining equations can vary continuously while the amplitude remains zero.", "url": "https://arxiv.org/abs/2610.01775", "type": "理论", "summary": "隐藏零点对散射振幅施加了超出其熟悉的因式分解特性的限制。我们在两个相关的方向探索它们的结构。我们首先将隐藏零提升为显式分裂公式，在通用运动学上组织全振幅。有序 $\\mathrm{Tr}(\\phi^3)$ 振幅、非线性 sigma 模型 (NLSM) 振幅和宇宙波函数共享相同定义的精确分裂结构 $\\mathcal A=\\sum_\\alpha R_\\alpha\\, {\\mathcal J}_{\\alpha,L}{\\mathcal J}_{\\alpha,R} {\\mathcal J}_{\\alpha,\\mathrm{out}}$，已调整到任何隐藏的零。每个前因子 $R_\\alpha$ 都是隐藏零轨迹的条件，因此这种分解逐项显示隐藏的消失项。其余因素是较低点幅度或电流。使用这些表示，我们可以系统地找到超出通常零位点的新零位点。特别是，我们获得了五个新的全重数零族。我们还发现了连续的零族：它们的定义方程的系数可以连续变化，而幅度保持为零。", "authors": [{"name": "Yang Li"}, {"name": "Laurentiu Rodina"}], "featured_authors": [{"name": "Yang Li"}, {"name": "Laurentiu Rodina"}], "author_count": 2}, {"id": "2610.01790", "category": "hep-th", "title": "DSSYK, open ASEP/TASEP and 2d dilaton gravity at strong coupling", "abstract": "We discuss the triality between stochastic growth models in the KPZ universality class, the DSSYK model, and low dimensional dilaton gravity. The TASEP model, which will be our primary focus, is identified with the strong-coupling limit of two-dimensional quantum gravity. The Hamiltonian of DSSYK and the transfer matrix of ASEP coincide up to an additive constant, and we derive the exact expression for the resolvent of the corresponding transfer matrix in ASEP on a finite interval. We also mention the relation of cumulants with the Tutte polynomial $T(1,q)$ of the crossing graph dual to the chord diagram, which implies the relationship of the models considered with the $Q=0$ Potts model coupled with gravity. We further exploit the realization of all these models in terms of different versions of discrete and continuous random walks on two-dimensional manifolds, which parameterize the Hilbert spaces of the respective theories. The representation of TASEP as the growth model of heaps provides new insight into strong-coupling gravity, suggesting its interpretation as an emerging phenomenon. The new dualities between ASEP and q-TASEP models and heap models providing a useful growth interpretation have been developed.", "url": "https://arxiv.org/abs/2610.01790", "type": "理论", "summary": "我们讨论了 KPZ 普适类中的随机增长模型、DSSYK 模型和低维膨胀引力模型之间的试验。 TASEP 模型将成为我们的主要关注点，它被认为具有二维量子引力的强耦合极限。 DSSYK 的哈密顿量与 ASEP 的传递矩阵在加性常数范围内重合，并推导了 ASEP 中相应传递矩阵在有限区间上求解的精确表达式。我们还提到了累积量与对偶弦图交叉图的 Tutte 多项式 $T(1,q)$ 的关系，这意味着使用与重力耦合的 $Q=0$ Potts 模型考虑的模型的关系。我们进一步利用二维流形上离散和连续随机游走的不同版本来实现所有这些模型，这些模型参数化了各自理论的希尔伯特空间。 TASEP 作为堆增长模型的表示提供了对强耦合引力的新见解，表明它是一种新兴现象的解释。\n\nASEP 和 q-TASEP 模型以及提供有用增长解释的堆模型之间的新对偶性已经开发出来。", "authors": [{"name": "Alexander Gorsky"}, {"name": "Elizaveta Kovalenko"}, {"name": "Sergei Nechaev"}], "featured_authors": [{"name": "Alexander Gorsky"}, {"name": "Elizaveta Kovalenko"}, {"name": "Sergei Nechaev"}], "author_count": 3}, {"id": "2610.01862", "category": "hep-th", "title": "Coherent Release Fronts in Krylov Chains and Thermal AdS$_2$ Response", "abstract": "We study coherent release from a finite serial Krylov sector into an exact conformal tail with asymptotically linear Lanczos coefficients. We derive an exact finite-cut occupation kernel and its locally uniform moving-cut limit, whose derivative is the squared modulus of a filtered boundary-emission amplitude. The tail sets the filtering kernel and logarithmic transit scale, while the release profile also depends on the finite sector. Its early edge records the number of serial steps before emission, whereas its late edge reflects slow resonances, interference, and logarithmic enhancements from merged poles. A one- and two-site family can share the same leading continued-fraction pole while exhibiting inequivalent profiles. We further consider a thermal AdS$_2$ realization in which, in the weak-coupling limit, the dressed oscillator measure approaches a two-site shallow sector followed by the conformal tail, with the leading complex pole reproduced through second order.", "url": "https://arxiv.org/abs/2610.01862", "type": "理论", "summary": "我们研究从有限序列 Krylov 扇区到具有渐近线性 Lanczos 系数的精确共形尾部的相干释放。我们推导出精确的有限切割占用核及其局部均匀移动切割极限，其导数是滤波边界发射幅度的平方模数。尾部设置过滤内核和对数传输尺度，而释放曲线也取决于有限扇区。其早期边缘记录发射前的串行步骤数，而其晚期边缘反映缓慢共振、干扰和合并极点的对数增强。一站点和两站点族可以共享相同的领先连续分数极，同时表现出不相等的轮廓。我们进一步考虑热 AdS$_2$ 实现，其中在弱耦合极限下，修饰振荡器测量接近双位点浅扇区，后跟共形尾部，并通过二阶再现领先的复数极点。", "authors": [{"name": "Mohsen Alishahiha"}], "featured_authors": [{"name": "Mohsen Alishahiha"}], "author_count": 1}, {"id": "2610.01909", "category": "hep-th", "title": "Super Liouville theory on the torus: bootstrap and the super Virasoro minimal string", "abstract": "Motivated by applications to low-dimensional worldsheet string constructions, we analyze $\\mathcal{N} = 1$ super Liouville theory on the torus. Specifically, we re-examine the recursive representations of the torus one-point super Virasoro blocks that have been constructed in the literature and correct several of their ingredients. In the process we identify a new block in the odd spin structure, associated with a privileged superdescendant whose torus one-point function transforms like that of a Virasoro primary. We then demonstrate that the structure constants for both spacelike and timelike super Liouville theory satisfy modular crossing. Furthermore, we use a bootstrap argument to construct modular crossing kernels for all four spin structure sectors, valid for central charges $c \\in \\mathbb{C}\\setminus(-\\infty,\\tfrac{3}{2}]$, and verify that they correctly implement the crossing transformations of the blocks. As a concrete application of the technology, we analyze the super Virasoro minimal string. There are four such theories, $\\mathrm{0A}^{\\pm}$ and $\\mathrm{0B}^{\\pm}$, which are distinguished by the GSO projection together with the choice of worldsheet supercharge. The resulting NS-sector sphere three-point and torus one-point amplitudes are shown to agree with topological recursion on the spectral curves of the dual matrix integrals, which were recently derived from 3d supergravity. Notably, the one-point function of the privileged superdescendant plays an essential role in the contribution of the odd spin structure to the torus amplitude via a careful treatment of the picture changing operator. We also identify an exceptional zero-momentum Ramond insertion in the $\\mathrm{0A}^{-}$ theory that we interpret geometrically as a Ramond puncture, and match its mixed sphere three-point amplitude to the corresponding intersection theory prediction.", "url": "https://arxiv.org/abs/2610.01909", "type": "理论", "summary": "受低维世界表字符串构造应用的启发，我们分析了圆环上的 $\\mathcal{N} = 1$ super Liouville 理论。具体来说，我们重新检查了文献中构建的环面单点超级 Virasoro 块的递归表示，并纠正了其中的一些成分。在此过程中，我们在奇数自旋结构中识别出一个新块，该块与特权超后代相关联，其环面单点函数像 Virasoro 主函数一样进行变换。然后我们证明了类空和类时超刘维尔理论的结构常数满足模交叉。此外，我们使用自举参数为所有四个自旋结构扇区构建模块化交叉核，对中心电荷 $c \\in \\mathbb{C}\\setminus(-\\infty,\\tfrac{3}{2}]$ 有效，并验证它们是否正确实现了块的交叉变换。作为该技术的具体应用，我们分析了超级 Virasoro 最小串。有四种这样的理论，$\\mathrm{0A}^{\\pm}$ 和$\\mathrm{0B}^{\\pm}$，它们通过 GSO 投影以及世界表增压的选择来区分。\n\n由此产生的 NS 扇形球体三点和环面单点振幅与最近从 3d 超重力导出的对偶矩阵积分谱曲线上的拓扑递归一致。值得注意的是，通过仔细处理图像改变算子，特权超后代的单点函数在奇自旋结构对环面振幅的贡献中发挥着重要作用。我们还在 $\\mathrm{0A}^{-}$ 理论中识别出异常的零动量拉蒙德插入，我们将其在几何上解释为拉蒙德穿刺，并将其混合球三点振幅与相应的相交理论预测相匹配。", "authors": [{"name": "Scott Collier"}, {"name": "Beatrix Mühlmann"}, {"name": "Mukund Rangamani"}, {"name": "Ioannis Tsiares"}, {"name": "Jianming Zheng"}], "featured_authors": [{"name": "Scott Collier"}, {"name": "Beatrix Mühlmann"}, {"name": "Mukund Rangamani"}, {"name": "Ioannis Tsiares"}, {"name": "Jianming Zheng"}], "author_count": 5}, {"id": "2610.01957", "category": "hep-th", "title": "An Algorithm for Generating All Berglund-Hubsch-Type Calabi-Yau Orbifolds and Their Mirrors. Classification of Maximal Admissible Groups", "abstract": "In this paper, we present an algorithm for constructing all Calabi-Yau orbifolds and their mirror pairs associated with an arbitrary Berglund-Hubsch-type model, and prove its correctness. In particular, the proposed method yields explicit generators for the groups defining the corresponding orbifolds. The method for classifying maximal admissible groups is proposed. We illustrate the application of the classification approach to an arbitrary Fermat-type Calabi-Yau manifold. In addition, as an illustrative example, we classify all maximal admissible groups of Fermat-type Calabi-Yau threefolds.", "url": "https://arxiv.org/abs/2610.01957", "type": "理论", "summary": "在本文中，我们提出了一种构造所有 Calabi-Yau 轨道折叠及其与任意 Berglund-Hubsch 型模型相关的镜像对的算法，并证明了其正确性。特别是，所提出的方法为定义相应轨道折叠的组生成显式生成器。提出了最大容许组的分类方法。我们说明了分类方法在任意 Fermat 型 Calabi-Yau 流形上的应用。此外，作为说明性示例，我们将费马型 Calabi-Yau 的所有最大可容许群分类为三重。", "authors": [{"name": "Sergei Aleshin"}], "featured_authors": [{"name": "Sergei Aleshin"}], "author_count": 1}, {"id": "2610.01976", "category": "hep-th", "title": "Trinity of Carrollian Gravity: Dynamically Equivalent Formulations of Magnetic Carrollian Gravity", "abstract": "In this paper, we extend the paradigm of the Geometrical Trinity of Gravity to the Carrollian geometry to construct a comprehensive framework of dynamically equivalent theories for Magnetic Carrollian gravity. Utilizing the inherent ambiguities and freedoms of affine connections on degenerate metrics, we systematically relax the metric-compatibility and zero-torsion constraints of the rigid magnetic sector. By imposing global flatness on these modified connections, we prove that the curvature of a Magnetic Carrollian universe can be dynamically traded for isolated kinetic energy densities of torsion and non-metricity. Unlike the Lorentzian Trinity which maps gravity to alternative gravitational frameworks, the Carrollian equivalences can also map spacetime geometry to non-gravitational theories. Specifically, we demonstrate that intrinsic torsion recovers Electric Carrollian gravity as the Teleparallel equivalent of Magnetic Carroll gravity; purely spatial torsion reproduces kinetic terms stracturally similar to the magnetic Hamiltonian of scalar-charge Fracton gauge theory; and temporal torsion sectors map independently to $U(1)$ Maxwell electric fields and Carroll-Weyl conformal dilaton theories. Finally, by formulating a Symmetric Teleparallel Carroll connection with minimal non-metricity, we show that the Magnetic Carrollian Lagrangian is dynamically equivalent to an ultralocal, isotropic Electric Carrollian gravity upon exploiting the present freedoms in connection. These results establish a geometric dictionary translating Carrollian gravitational dynamics into the language of tensor gauge theories, electromagnetism, and dilaton theory.", "url": "https://arxiv.org/abs/2610.01976", "type": "理论", "summary": "在本文中，我们将几何引力三位一体的范式扩展到卡罗尔几何，构建了磁卡罗尔引力动态等效理论的综合框架。利用简并度量上仿射连接固有的模糊性和自由度，我们系统地放松了刚性磁扇区的度量兼容性和零扭转约束。通过对这些修改后的连接施加全局平坦度，我们证明了磁卡罗尔宇宙的曲率可以动态地换取挠率和非度量的孤立动能密度。与将引力映射到替代引力框架的洛伦兹三位一体不同，卡罗尔等价也可以将时空几何映射到非引力理论。\n\n具体来说，我们证明了内在扭转将电卡罗尔引力恢复为磁卡罗尔引力的远程平行等效物；纯空间扭转再现了在结构上类似于标量电荷分形规范理论的磁哈密顿量的动力学项；和时间扭转扇区独立映射到 $U(1)$ 麦克斯韦电场和卡罗尔-韦尔共形膨胀理论。最后，通过制定具有最小非度量性的对称远程平行卡罗尔连接，我们表明，在利用现有的连接自由度时，磁卡罗尔拉格朗日在动态上等效于超局域、各向同性的电卡罗尔引力。这些结果建立了一个几何词典，将卡罗尔引力动力学翻译成张量规范理论、电磁学和膨胀理论的语言。", "authors": [{"name": "Mehdi Ahmadi-Jahmani"}, {"name": "Aliasghar Parvizi"}], "featured_authors": [{"name": "Mehdi Ahmadi-Jahmani"}, {"name": "Aliasghar Parvizi"}], "author_count": 2}, {"id": "2610.02063", "category": "hep-th", "title": "Rotation and Anisotropic Scaling in Axionic Holographic Superconductors: AdS$_4$ versus Lifshitz$_5$", "abstract": "An outstanding question in holographic superconductivity is how rotation and non-relativistic scaling symmetries compete to modify the onset of condensation. We address this by comparing the probe superconductor sectors of two exact rotating axionic black holes: a four-dimensional asymptotically anti-de Sitter solution dressed by a non-minimally coupled scalar, and a five-dimensional asymptotically Lifshitz solution with $z \\in (2,3)$. Writing both metrics in a common stationary form yields a master scalar equation in which rotation enters through the co-rotating potential $A_t-N^xA_x$. This equation explains why the temporal and spatial components of the probe gauge field cannot be treated independently. The numerical profiles reported in [1,2] indicate that the correlated deformation associated with rotation reduces the condensate amplitude in both backgrounds, whereas increasing the dynamical exponent at fixed $J$ enhances the Lifshitz condensate. Since the parameters $\\alpha$ and $J$ also modify the matter fields supporting the corresponding exact geometries, these trends should be interpreted as properties of complete correlated families rather than as universal effects of mechanical rotation alone.", "url": "https://arxiv.org/abs/2610.02063", "type": "理论", "summary": "全息超导中的一个突出问题是旋转和非相对论标度对称性如何竞争来改变凝聚的开始。我们通过比较两个精确旋转轴子黑洞的探测超导扇区来解决这个问题：一个由非最小耦合标量修饰的四维渐近反德西特解，以及一个带有 $z \\in (2,3)$ 的五维渐近 Lifshitz 解。以共同的平稳形式编写这两个度量会产生一个主标量方程，其中旋转通过同向旋转势 $A_t-N^xA_x$ 进入。该方程解释了为什么探针规范场的时间和空间分量不能独立处理。 [1,2] 中报告的数值分布表明，与旋转相关的相关变形降低了两种背景中的凝析油振幅，而增加固定 $J$ 处的动态指数则增强了 Lifshitz 凝析油。\n\n由于参数 $\\alpha$ 和 $J$ 也会修改支持相应精确几何形状的物质场，因此这些趋势应被解释为完整相关族的属性，而不是单独机械旋转的普遍效应。", "authors": [{"name": "Moisés Bravo-Gaete"}], "featured_authors": [{"name": "Moisés Bravo-Gaete"}], "author_count": 1}, {"id": "2610.02124", "category": "hep-th", "title": "Infrared Consistency and the Uniqueness of String Amplitudes", "abstract": "Recent work has shown that maximal supersymmetry, combined with a particular scalar-parity condition at six points, imposes nonlinear constraints on four-point effective field theory amplitudes. Numerical bootstrap studies incorporating unitarity provide evidence for the Veneziano amplitude in maximally supersymmetric Yang--Mills theory and for the Virasoro--Shapiro amplitude, together with infinite-spin alternatives, in supergravity. In this paper, we establish these constraints to all orders in the low-energy expansion. The derivation uses a collinear limit in which three three-particle factorization channels, or six in gravity, simultaneously go on shell. A scalar-parity projection and a single discrete R-symmetry eliminate the unknown six-point remainder, leaving three-term master equations determined entirely by four-point factorization. Solving these equations proves the conjectured exponential forms and provides a map that reconstructs the full amplitude from its regular forward limit. Under explicit analytic and positive dispersive assumptions, the fixed reflection-even part of the gauge-theory exponential determines the forward spectral measure and uniquely selects the Veneziano amplitude, with finite-spin residues emerging as a consequence. In gravity, the exponential leaves the forward measure undetermined: a measure supported at a single massive level reconstructs an amplitude with infinitely many exchanged spins at that mass. Finite-spin support at the lowest massive pole is therefore an additional assumption required to select the Virasoro--Shapiro amplitude within the stated ultraviolet framework.", "url": "https://arxiv.org/abs/2610.02124", "type": "理论", "summary": "最近的工作表明，最大超对称性与六点处的特定标量宇称条件相结合，对四点有效场理论振幅施加了非线性约束。结合幺正性的数值引导研究为最大超对称杨-米尔斯理论中的韦内齐亚诺振幅和超重力中的维拉索罗-夏皮罗振幅以及无限自旋替代方案提供了证据。在本文中，我们对低能扩张中的所有阶次建立了这些约束。该推导使用共线极限，其中三个三粒子分解通道（或重力中的六个通道）同时在壳上进行。标量宇称投影和单个离散 R 对称性消除了未知的六点余数，留下完全由四点分解确定的三项主方程。求解这些方程证明了猜想的指数形式，并提供了从其常规前向极限重建全振幅的图。\n\n在明确的解析和正色散假设下，规范理论指数的固定反射均匀部分决定了前向光谱测量并唯一选择 Veneziano 振幅，从而出现有限自旋留数。在引力中，指数使前向测量未确定：在单个质量水平上支持的测量重建了在该质量下具有无限多个交换自旋的振幅。因此，最低质量极处的有限自旋支持是在规定的紫外线框架内选择 Virasoro-Shapiro 振幅所需的附加假设。", "authors": [{"name": "Yu-tin Huang"}, {"name": "Shi-Lin Wan"}, {"name": "Zhuo-Hui Wang"}, {"name": "Shuang-Yong Zhou"}], "featured_authors": [{"name": "Yu-tin Huang"}, {"name": "Shi-Lin Wan"}, {"name": "Zhuo-Hui Wang"}, {"name": "Shuang-Yong Zhou"}], "author_count": 4}, {"id": "2610.02168", "category": "hep-th", "title": "A baby universe from a large family: booklet cosmology states and quantum error correction", "abstract": "We propose an extension of the cosmological-state construction of Antonini, Sasieta and Swingle (AS$^2$) to three or more holographic CFTs. Each CFT resides on the asymptotic boundary of an AdS page, and all pages are glued along a common interface by imposing the multiway junction conditions. The associated states are prepared by Euclidean evolution with a multilinear insertion. In appropriate heavy insertion limit the bulk geometry develop a closed universe in the center and we refer the state in this limit as a booklet cosmological state. Extending the effective Gaussian assumption used in AS$^2$, we model the three-page insertion by a circular complex Gaussian random tensor, yielding a tripartite Haar state in flat energy windows. In this Gaussian model of the cosmology-to-boundary map, each arm is a network branch associated with one boundary CFT. In the simplest example of three pages with three equal output Hilbert-space dimension $b$, we show that a prescribed code of dimension $K$ is approximately recoverable from any two arms, with vanishing error and high probability as $K/b\\to0$.", "url": "https://arxiv.org/abs/2610.02168", "type": "理论", "summary": "我们建议将 Antonini、Sasieta 和 Swingle (AS$^2$) 的宇宙态构造扩展到三个或更多全息 CFT。每个 CFT 驻留在 AdS 页面的渐近边界上，并且所有页面通过施加多路结点条件沿着公共界面粘合。相关状态是通过具有多线性插入的欧几里得演化来准备的。在适当的重插入极限下，体几何在中心形成一个封闭的宇宙，我们将该极限下的状态称为小册子宇宙学状态。扩展 AS$^2$ 中使用的有效高斯假设，我们通过圆形复高斯随机张量对三页插入进行建模，在平坦能量窗口中产生三方哈尔状态。在这个宇宙学到边界图的高斯模型中，每个臂都是与一个边界 CFT 关联的网络分支。在具有三个相等输出希尔伯特空间维度 $b$ 的三页的最简单示例中，我们表明维度 $K$ 的规定代码大约可以从任何两个臂恢复，误差消失且概率为 $K/b\\to0$。", "authors": [{"name": "Jingshu Dai"}, {"name": "Binye Dong"}, {"name": "Cheng Peng"}], "featured_authors": [{"name": "Jingshu Dai"}, {"name": "Binye Dong"}, {"name": "Cheng Peng"}], "author_count": 3}, {"id": "2610.02209", "category": "hep-th", "title": "Leading gravitational dressing of operators and states in de Sitter space", "abstract": "We describe construction of gravitationally dressed observables in de Sitter (dS) space, to leading non-trivial order in Newton's constant. We show that for an underlying field theory observable to be \"gravitationally dressable,\" it must be dS invariant. If it satisfies this condition, its gravitational dressing can be constructed in terms of certain Green functions, by solving the condition that the dressed observable commute with the constraints. We provide a construction of the Green functions relevant for dressing observables lying on a time-symmetric slice. A simple example of a dS invariant observable is an operator creating a two-particle state of scalars. In the large mass limit, the particles are shown to be antipodally located, and the dressing of this operator (or corresponding state) can be explicitly constructed. Its behavior is diagnosed by certain correlators involving this state, and we check explicitly that these correlators then reproduce a linearized version of the Schwarzschild-dS solution. The underlying dS-invariant observables may be thought of as relational, and we argue can be generalized to include systems with properties of observers, which then could be likewise gravitationally dressed. We also briefly describe how such dressed observables can be related to alpha vacua, and discuss other questions regarding a more complete construction and role of such operators.", "url": "https://arxiv.org/abs/2610.02209", "type": "理论", "summary": "我们描述了德西特（dS）空间中引力修饰的可观测量的构造，以得出牛顿常数中的非平凡阶。我们表明，对于可观测的基础场论来说，它必须是“引力可修饰”的，它必须是 dS 不变的。如果满足这个条件，则通过解决穿戴的可观测量在约束下交换的条件，可以根据某些格林函数来构造其引力穿戴。我们提供了与修饰位于时间对称切片上的可观测量相关的格林函数的构造。 dS 不变可观测量的一个简单示例是创建标量的双粒子状态的算子。在大质量限制下，粒子显示为对映位置，并且可以明确构造该算子（或相应状态）的敷料。它的行为是由涉及该状态的某些相关器来诊断的，并且我们明确地检查这些相关器是否再现了 Schwarzschild-dS 解的线性化版本。\n\n潜在的 dS 不变可观测量可以被认为是相关的，我们认为可以概括为包括具有观察者属性的系统，然后这些系统也可以同样受到引力影响。我们还简要描述了这些经过修饰的可观测量如何与阿尔法真空相关，并讨论了有关此类算子的更完整构造和作用的其他问题。", "authors": [{"name": "Steven B. Giddings"}, {"name": "Zi-Yue Wang"}], "featured_authors": [{"name": "Steven B. Giddings"}, {"name": "Zi-Yue Wang"}], "author_count": 2}, {"id": "2610.00036", "category": "math-ph", "title": "Closed-form evaluation of the cyclic four-electron atomic correlation integral", "abstract": "For positive exponents $\\alpha_1,\\ldots,\\alpha_4$ we evaluate the cyclic four-electron Slater integral, the topology recorded as case V in Bonham's 1965 classification, in a finite real expression of weight at most three. The general answer is an explicit sum of eighteen blocks involving only logarithms, dilogarithms and trilogarithms of rational functions of the exponents; all logarithm arguments are positive and all nonconstant polylogarithm arguments may be placed in $(-1,1)$, so no radical, generalized polylogarithm, contour prescription or unevaluated limit is required. At equal exponents the value collapses to $I(\\lambda,\\lambda,\\lambda,\\lambda)=(4\\pi)^4\\lambda^{-4}[\\mathrm{Li}_3(1/4)/2-7\\zeta(3)/24+\\pi^2\\log 2/12-2\\log^3 2/3]$, a weight-three period over $\\mathbb{Q}$ ramified only at 2 and 3. Three independently implemented numerical routes agree at four exponent tuples to at least 32 decimal places, an exact-dyadic evaluation of the classical formula gives eight 100-place certificates, and three published four-electron calibration values are reproduced to every printed digit. We also prove the small- and large-exponent limit laws with closed-form coefficients, dihedral symmetry, and a strict rearrangement law for the three inequivalent cyclic placements of four exponents. The formula applies to the four-cycle and does not evaluate the two chorded topologies.", "url": "https://arxiv.org/abs/2610.00036", "type": "理论", "summary": "对于正指数 $\\alpha_1,\\ldots,\\alpha_4$，我们以权重最多为 3 的有限实数表达式计算循环四电子 Slater 积分，该拓扑在 Bonham 的 1965 年分类中记录为情况 V。一般答案是十八个块的显式和，仅涉及指数有理函数的对数、二对数和三对数；所有对数参数都是正数，并且所有非常数多对数参数都可以放在 $(-1,1)$ 中，因此不需要根式、广义多对数、轮廓规定或未评估的极限。在相同的指数下，该值折叠为 $I(\\lambda,\\lambda,\\lambda,\\lambda)=(4\\pi)^4\\lambda^{-4}[\\mathrm{Li}_3(1/4)/2-7\\zeta(3)/24+\\pi^2\\log 2/12-2\\log^3 2/3]$，一个权重为 3 的周期在 $\\mathbb{Q}$ 上仅在 2 处分支，并且3. 三个独立实现的数值路线在四个指数元组上一致到至少 32 位小数，经典公式的精确二元评估给出了八个 100 位证书，并且三个已发布的四电子校准值被复制到每个打印数字。\n\n我们还证明了具有闭式系数、二面对称性和四个指数的三个不等循环放置的严格重排定律的小指数和大指数极限定律。该公式适用于四周期，不评估两个弦拓扑。", "authors": [{"name": "Jonas Matuzas"}], "featured_authors": [{"name": "Jonas Matuzas"}], "author_count": 1}, {"id": "2610.00242", "category": "math-ph", "title": "Quantum Reverse Hypercontractivity for KMS-Symmetric Quantum Markov Semigroups", "abstract": "In this paper, we construct primitive KMS-symmetric quantum Markov semigroups for which the $p$-logarithmic Sobolev constant vanishes at $p=1/2$ and a correlated graph-based example for which the $p$-logarithmic Sobolev constant tends to $-\\infty$ as $p\\to 0^+$. These examples obstruct a positive uniform reverse-hypercontractivity rate on $(0,1)$. By contrast, we show that every primitive KMS-symmetric quantum Markov semigroup satisfies quantum reverse hypercontractivity for $1/2< p\\leq q < 1$ with explicit sufficient times. For each fixed $\\delta>0$, a sufficiently strong dephasing perturbation satisfies a uniform positive logarithmic Sobolev inequality on $[\\delta, 1]$ and hence quantum reverse hypercontractivity for $\\delta< p\\leq q<1$ with fixed $0<\\delta<1/2$. Furthermore, we establish reverse hypercontractivity for graph-based KMS-symmetric quantum Markov semigroups for $\\delta< p\\leq q< 1$ with fixed $0<\\delta<1$ for connected graphs when $n \\geq 3$.", "url": "https://arxiv.org/abs/2610.00242", "type": "理论", "summary": "在本文中，我们构造了原始 KMS 对称量子马尔可夫半群，其中 $p$-对数 Sobolev 常数在 $p=1/2$ 处消失，并构建了一个基于相关图的示例，其中 $p$-对数 Sobolev 常数趋于 $-\\infty$，因为 $p\\to 0^+$。这些例子阻碍了 $(0,1)$ 上的正统一反向超收缩率。相比之下，我们证明每个本原 KMS 对称量子马尔可夫半群都满足 $1/2< p\\leq q < 1$ 的量子逆超收缩性，并且具有显式的足够时间。对于每个固定的 $\\delta>0$，足够强的相移扰动满足 $[\\delta, 1]$ 上的均匀正对数 Sobolev 不等式，因此满足 $\\delta< p\\leq q<1$ 与固定 $0<\\delta<1/2$ 的量子逆超收缩性。此外，我们为 $\\delta< p\\leq q< 1$ 建立基于图的 KMS 对称量子马尔可夫半群的反向超收缩性，当 $n \\geq 3$ 时，对于连通图固定 $0<\\delta<1$。", "authors": [{"name": "Jinsong Wu"}], "featured_authors": [{"name": "Jinsong Wu"}], "author_count": 1}, {"id": "2610.00396", "category": "math-ph", "title": "Complete Factorial Asymptotics and Integrable Structure of Generalized Charlier Recurrence Coefficients", "abstract": "We study the monic recurrence coefficients of the generalized Charlier polynomials associated with the discrete weight \\[ \\rho_\\mu(k) = \\frac{\\mu^k}{(k!)^2}, \\qquad k\\in\\mathbb N_0, \\qquad \\mu>0. \\] We establish complete factorial asymptotics for the deviations $\\beta_n-n$ and $\\mu-\\gamma_n$, proving that they are beyond all algebraic orders and appear at the scale $\\mu^{n}/(n!)^2$. The key step is a parametrization $\\beta_n-n=\\sqrt{\\mu}\\,c_nc_{n+1}$, $\\gamma_n=\\mu(1-c_n^2)$, which reduces the problem to a positive sequence $(c_n)$ satisfying a discrete Painlevé II equation. Linearization around $c_n=0$ yields a discrete Bessel equation whose recessive solution is $J_n(2\\sqrt{\\mu})$. We prove that the ratio $c_n/J_n(2\\sqrt{\\mu})$ converges to a finite limit $L(\\mu)$, which we identify exactly as $L(\\mu)=1$ by combining Bessel comparison with a global analysis based on the sector decomposition of the associated Hankel determinant. This yields the exact connection formula \\[ c_n \\sim J_n(2\\sqrt{\\mu}), \\qquad n\\to\\infty, \\] and consequently the precise asymptotics \\[ \\beta_n-n\\sim \\frac{\\mu^{n+1}}{n!(n+1)!}, \\qquad \\mu-\\gamma_n\\sim \\frac{\\mu^{n+1}}{(n!)^2}. \\] We further develop a complementary approach based on Hankel determinants interpreted as a discrete logarithmic gas. We show that the Hankel determinant factorizes as $\\Delta_n(\\mu)=\\mu^{n(n-1)/2}T_n(\\mu)$ and admits a sector decomposition $T_n(\\mu)=1+\\sum_{q=1}^{n}S_q(\\mu)$ with sector contributions independent of $n$. We establish $S_q(\\mu)\\sim e^\\mu\\mu^q/(q!)^2$, providing an independent derivation of the factorial corrections. Together, the Bessel comparison and sector decomposition reveal a rich integrable structure linking discrete Painlevé dynamics, Toda deformations, and Hankel--partition representations.", "url": "https://arxiv.org/abs/2610.00396", "type": "理论", "summary": "我们研究与离散权重 \\[ \\rho_\\mu(k) = \\frac{\\mu^k}{(k!)^2}, \\qquad k\\in\\mathbb N_0, \\qquad \\mu>0 相关的广义 Charlier 多项式的一子递推系数。 \\] 我们为偏差 $\\beta_n-n$ 和 $\\mu-\\gamma_n$ 建立完全阶乘渐近，证明它们超出所有代数阶并出现在 $\\mu^{n}/(n!)^2$ 尺度上。关键步骤是参数化 $\\beta_n-n=\\sqrt{\\mu}\\,c_nc_{n+1}$, $\\gamma_n=\\mu(1-c_n^2)$，将问题简化为满足离散 Painlevé II 方程的正序列 $(c_n)$。 $c_n=0$ 附近的线性化产生一个离散贝塞尔方程，其隐性解为 $J_n(2\\sqrt{\\mu})$。我们证明比率 $c_n/J_n(2\\sqrt{\\mu})$ 收敛到有限极限 $L(\\mu)$，通过将贝塞尔比较与基于相关 Hankel 行列式扇形分解的全局分析相结合，我们将其精确地识别为 $L(\\mu)=1$。这会产生精确的连接公式 \\[ c_n \\sim J_n(2\\sqrt{\\mu}), \\qquad n\\to\\infty, \\] 以及精确的渐近方程 \\[ \\beta_n-n\\sim \\frac{\\mu^{n+1}}{n!(n+1)!}, \\qquad \\mu-\\gamma_n\\sim \\frac{\\mu^{n+1}}{(n!)^2}。\n\n\\] 我们进一步开发了一种基于解释为离散对数气体的汉克尔行列式的补充方法。我们证明汉克尔行列式因式分解为 $\\Delta_n(\\mu)=\\mu^{n(n-1)/2}T_n(\\mu)$ 并允许扇区分解 $T_n(\\mu)=1+\\sum_{q=1}^{n}S_q(\\mu)$，扇区贡献独立于 $n$。我们建立 $S_q(\\mu)\\sim e^\\mu\\mu^q/(q!)^2$，提供阶乘校正的独立推导。贝塞尔比较和扇形分解共同揭示了连接离散 Painlevé 动力学、Toda 变形和 Hankel 分区表示的丰富可积结构。", "authors": [{"name": "Mahouton Norbert Hounkonnou"}], "featured_authors": [{"name": "Mahouton Norbert Hounkonnou"}], "author_count": 1}, {"id": "2610.00879", "category": "math-ph", "title": "On spectrum of the harmonic Kronig-Penney model", "abstract": "We study the spectral properties of the harmonic modification of the quantum mechanical Kronig-Penney model motivated by the theory of the dressing chain. In particular, we show that in the special cases the corresponding ground states can be given explicitly and all spectral gaps have the same length with the ends expressed as zeros of the corresponding Weber-Hermite functions.", "url": "https://arxiv.org/abs/2610.00879", "type": "理论", "summary": "我们研究了受修整链理论启发的量子力学 Kronig-Penney 模型的谐波修正的光谱特性。特别是，我们表明，在特殊情况下，可以明确给出相应的基态，并且所有谱间隙具有相同的长度，其末端表示为相应的 Weber-Hermite 函数的零。", "authors": [{"name": "J. Gibbons"}, {"name": "A.P. Veselov"}], "featured_authors": [{"name": "J. Gibbons"}, {"name": "A.P. Veselov"}], "author_count": 2}, {"id": "2610.01622", "category": "math-ph", "title": "The Buchholz Algebra from the Universal Resolvent Algebra--Particle Structure, Gibbs States, and Closed-Path Expansions without Fock Representations", "abstract": "We construct the Buchholz algebra without a Fock representation, as the bounded inverse limit of intrinsic particle-cutoff quotients of the gauge-fixed resolvent algebra, with isometric particle-degree coordinates. Its finite matrix corners carry canonical traces, KMS states, and trace-norm product formulas, together with closed-path expansions that lay the groundwork for path-integral representations. The known Fock-space description and a proper quasilocal subalgebra arise as realizations.", "url": "https://arxiv.org/abs/2610.01622", "type": "理论", "summary": "我们构造了没有 Fock 表示的布赫霍尔兹代数，作为规范固定解析代数的内在粒子截止商的有界逆极限，具有等距粒子度坐标。它的有限矩阵角包含规范轨迹、KMS 状态和轨迹范数乘积公式，以及为路径积分表示奠定基础的闭路径展开。已知的福克空间描述和适当的拟局域子代数作为实现而出现。", "authors": [{"name": "Yoshitsugu Sekine"}], "featured_authors": [{"name": "Yoshitsugu Sekine"}], "author_count": 1}, {"id": "2610.01841", "category": "math-ph", "title": "Quantum hierarchies of the ILW and BO equations and the DR cycles on the moduli spaces of curves", "abstract": "In an earlier paper of P. Rossi and the first author, a construction of a wide class of quantum hierarchies was presented, with the input data given by an arbitrary cohomological field theory. A crucial role in the construction is played by the double ramification (DR) cycles on the moduli spaces of stable curves. As a special case, one gets a quantization of the hierarchy of the Intermediate Long Wave (ILW) equation. The ILW equation has two famous limits: the Korteweg--de Vries equation and the Benjamin--Ono (BO) equation, and for the latter one a quantum hierarchy was constructed by Nazarov and Sklyanin. In our paper, we propose a conjecture describing a relation between a limit of the quantum ILW hierarchy and the Nazarov--Sklyanin hierarchy and present various checks to support it.", "url": "https://arxiv.org/abs/2610.01841", "type": "理论", "summary": "在 P. Rossi 和第一作者的早期论文中，提出了一种广泛的量子层次结构的构造，输入数据由任意上同调场论给出。稳定曲线模空间上的双分支（DR）循环在构造中发挥着至关重要的作用。作为一种特殊情况，我们可以得到中长波 (ILW) 方程层次结构的量化。 ILW 方程有两个著名的极限：Korteweg--de Vries 方程和 Benjamin-Ono (BO) 方程，对于后者，Nazarov 和 Sklyanin 构建了一个量子层次结构。在我们的论文中，我们提出了一个猜想，描述了量子 ILW 层次结构的极限与 Nazarov-Sklyanin 层次结构之间的关系，并提出了各种检查来支持它。", "authors": [{"name": "Alexandr Buryak"}, {"name": "Abner Hernandez Rodriguez"}], "featured_authors": [{"name": "Alexandr Buryak"}, {"name": "Abner Hernandez Rodriguez"}], "author_count": 2}, {"id": "2610.01869", "category": "math-ph", "title": "Quadratic symmetry algebras and Sturm algebraization of superintegrable systems with magnetic fields", "abstract": "We study two three-dimensional quantum superintegrable systems in nonvanishing axially symmetric magnetic fields. For each model the integrals generate a quadratic algebra with a Casimir, and finite-dimensional deformed-oscillator representations yield algebraic spectra. The same spectra are recovered by separation of variables. In circular parabolic coordinates the separated equations are sextic biconfluent-Heun equations with finite polynomial sectors. We formulate them as Sturm eigenvalue problems with the physical energy as a parameter and the separation constant diagonalized. After gauge transformation, each equation admits an $sl(2)$ algebraization and reduces to a finite tridiagonal matrix. We also construct a pre-separation Sturm representation of each complete Hamiltonian, taking the inverse-square coupling as the Sturm eigenvalue. The transformed integrals remain commuting and, after fixing the axial integral, changing variables and gauge rotating, the two-variable Sturm Hamiltonian and its non-central integrals belong to the universal enveloping algebra $U(sl(3))$. We thus obtain three complementary algebraic descriptions: the quadratic-algebra/deformed-oscillator representation of the original Hamiltonian, the $sl(2)$ algebraization after parabolic separation, and the $sl(3)$ algebraization of the complete Sturm problem before separation. Although the two magnetic Hamiltonians are distinct in the original classification, fixing the axial integral reduces them to the same singular 2:1 oscillator normal form with different effective parameter embeddings. This explains the common $sl(3)$ structure without implying equivalence of the original magnetic systems. These results show how distinct hidden algebraic structures and exact or quasi-exact solvability can emerge at different stages of a multiseparable superintegrable system.", "url": "https://arxiv.org/abs/2610.01869", "type": "理论", "summary": "我们研究非零轴对称磁场中的两个三维量子超可积系统。对于每个模型，积分生成带有卡西米尔的二次代数，有限维变形振荡器表示生成代数谱。通过变量分离恢复相同的光谱。在圆抛物线坐标中，分离方程是具有有限多项式扇区的六次双汇流赫恩方程。我们将它们表述为 Sturm 特征值问题，其中物理能量为参数，分离常数对角化。规范变换后，每个方程都接受 $sl(2)$ 代数化并简化为有限三对角矩阵。我们还构建了每个完整哈密顿量的预分离 Sturm 表示，将平方反比耦合作为 Sturm 特征值。变换后的积分保持可交换性，固定轴向积分、改变变量和规范旋转后，二变量Sturm哈密顿量及其非中心积分属于通用包络代数$U(sl(3))$。\n\n因此，我们获得了三个互补的代数描述：原始哈密顿量的二次代数/变形振荡器表示、抛物线分离后的 $sl(2)$ 代数、以及分离前完整 Sturm 问题的 $sl(3)$ 代数。尽管这两个磁哈密顿量在原始分类中是不同的，但是固定轴向积分将它们简化为具有不同有效参数嵌入的相同奇异 2:1 振荡器范式。这解释了常见的 $sl(3)$ 结构，但并不意味着原始磁系统的等效性。这些结果表明，在多重可分超可积系统的不同阶段，如何出现不同的隐藏代数结构和精确或准精确可解性。", "authors": [{"name": "Shams Ara"}, {"name": "Md Fazlul Hoque"}, {"name": "Ian Marquette"}], "featured_authors": [{"name": "Shams Ara"}, {"name": "Md Fazlul Hoque"}, {"name": "Ian Marquette"}], "author_count": 3}, {"id": "2610.01901", "category": "math-ph", "title": "Superintegrability of a resonant ghostly tri-Hamiltonian model: polynomial first integrals and transcendental completion", "abstract": "We study classical and quantum superintegrability of a resonant three-dimensional Hamiltonian with indefinite kinetic energy and three Poisson descriptions of the same flow. Besides three commuting quadratic Hamiltonians, the polynomial first-integral ring contains two primitive degree-four generators, $I_4^{\\rm o}$ and $I_4^{\\rm e}$, of odd and even momentum parity. A single octic relation leaves the polynomial invariant ring with transcendence degree four. Solving the complete first-integral equation shows that every rational first integral is a rational function of $H_1,H_2,H_3,I_4^{\\rm o}$, so that the rational invariant field likewise has generic functional rank four. A branch-free transcendental invariant raises the generic smooth functional rank to five on the invariant open set $\\Delta>0$. The system is therefore minimally superintegrable in the polynomial and rational classes and maximally superintegrable on this invariant domain when transcendental integrals are admitted. Weyl quantisation yields exact higher-order differential symmetries in all three Poisson realisations. The branch-free fifth classical invariant also admits a densely defined nonlocal quantum counterpart, providing a concrete quantum realisation of the transcendental completion.", "url": "https://arxiv.org/abs/2610.01901", "type": "理论", "summary": "我们研究具有不定动能的共振三维哈密顿量的经典和量子超可积性以及同一流动的三种泊松描述。除了三个可交换二次哈密顿量之外，多项式一阶积分环还包含两个具有奇数和偶数动量宇称的原始四次生成器 $I_4^{\\rm o}$ 和 $I_4^{\\rm e}$。单一八次关系使多项式不变环的超越度为四。求解完整的一阶积分方程表明，每个有理一阶积分都是 $H_1,H_2,H_3,I_4^{\\rm o}$ 的有理函数，因此有理不变域同样具有泛函四阶。无分支超越不变量将不变开集 $\\Delta>0$ 上的通用平滑函数等级提高到 5。因此，当承认超越积分时，系统在多项式和有理类中是最小超可积的，并且在这个不变域上是最大超可积的。外尔量化在所有三个泊松实现中产生精确的高阶微分对称性。\n\n无分支第五经典不变量也承认一个密集定义的非定域量子对应物，提供了超越完成的具体量子实现。", "authors": [{"name": "Andreas Fring"}, {"name": "Ian Marquette"}], "featured_authors": [{"name": "Andreas Fring"}, {"name": "Ian Marquette"}], "author_count": 2}, {"id": "2610.00046", "category": "quant-ph", "title": "Beyond Lie Algebras: Lie-Wedge Stratification and Pure-State Stabilizability in Single-Channel Qubit Control", "abstract": "Lie algebras describe how control generators combine, but in open systems they erase the distinction between reversible control and irreversible dissipation. Lie wedges retain this information. We study drift-free single-qubit systems with bidirectional Hamiltonian controls and at most one independently actuated dissipator generated by a traceless jump operator. In this work, we prove that they fall into thirteen structural strata defined by the generated algebra and its Lie-wedge geometry. The control algebra and four channel properties determine the stratum; in each wedge, the reversible directions are precisely the coherent controls. We then use the stratification to determine whether a wedge contains a generator with a unique globally attractive pure state. In five strata, stabilizability depends on additional channel data. In one exceptional stratum, no single control-rotated dissipative direction suffices, but averaging two such directions in the wedge yields stabilization. Lie wedges therefore reveal control capabilities that the generated Lie algebra misses.", "url": "https://arxiv.org/abs/2610.00046", "type": "理论", "summary": "李代数描述了控制生成器如何组合，但在开放系统中，它们消除了可逆控制和不可逆耗散之间的区别。谎言楔子保留此信息。我们研究具有双向哈密顿控制和至多一个由无痕跳跃算子生成的独立驱动耗散器的无漂移单量子位系统。在这项工作中，我们证明它们属于由生成的代数及其李楔几何定义的十三个结构层。控制代数和四个通道属性决定了层；在每个楔形中，可逆方向正是相干控制。然后，我们使用分层来确定楔形是否包含具有独特的全局吸引力纯态的生成器。在五个层中，稳定性取决于附加通道数据。在一个特殊的层中，没有单一的控制旋转耗散方向足够，但在楔形中平均两个这样的方向可以产生稳定性。因此，李楔揭示了生成的李代数所遗漏的控制能力。", "authors": [{"name": "Yibin Wang"}], "featured_authors": [{"name": "Yibin Wang"}], "author_count": 1}, {"id": "2610.00080", "category": "quant-ph", "title": "Sharp Target-Domain Certificates for Quantum-Kernel Advantage under Distribution Shift", "abstract": "Quantum predictive advantage under shift usually requires known target labels. We derive the assumption-free sharp identified interval for the finite-batch advantage of a fixed candidate over the best member of a prespecified fixed classical-kernel family under any bounded loss and unrestricted completions of the unaudited labels; zero-one accuracy has exact closed-form partial-label updates. Across eight security shifts, zero-label upper endpoints against 115 classical kernels span 0.002-0.088. Retrospective auditing reduces every endpoint to 0.010 with 0-33 of 500 labels, including entangling-ZZ models. Prospective corroboration on two eligible tasks met predefined criteria: four task-classifier medians require 0-3 labels (overall median 0; maximum 76), and all 20 realized effects are negative; a third task fails its feature gate. Protocol controls reverse an apparent advantage, while finite-shot noise can increase predictive distinctness without useful advantage. The framework separates protocol validity, target predictive indispensability, and quantum relevance.", "url": "https://arxiv.org/abs/2610.00080", "type": "理论", "summary": "转变下的量子预测优势通常需要已知的目标标签。我们推导了在任何有界损失和未经审核标签的无限制完成情况下，固定候选者相对于预先指定的固定经典内核家族的最佳成员的有限批次优势的无假设尖锐识别区间；零一精度具有精确的封闭形式部分标签更新。在 8 个安全转变中，针对 115 个经典内核的零标签上限跨度为 0.002-0.088。回顾性审核将 500 个标签中的 0-33 个标签（包括缠结 ZZ 模型）的每个端点降低至 0.010。对两项符合条件的任务的前瞻性证实满足预定义的标准：四个任务分类器中值需要 0-3 个标签（总体中值 0；最多 76），并且所有 20 个实现的效果都是负的；第三个任务未能通过其功能门。协议控制扭转了明显的优势，而有限样本噪声可以增加预测的清晰度，但没有任何有用的优势。该框架将协议有效性、目标预测的必要性和量子相关性分开。", "authors": [{"name": "Roberto Fernández-Barrios"}, {"name": "Iker Pastor-López"}, {"name": "Asier González-Santocildes"}, {"name": "Pablo García Bringas"}], "featured_authors": [{"name": "Roberto Fernández-Barrios"}, {"name": "Iker Pastor-López"}, {"name": "Asier González-Santocildes"}, {"name": "Pablo García Bringas"}], "author_count": 4}, {"id": "2610.00129", "category": "quant-ph", "title": "Global and nonlocal magic of quantum many-body scars", "abstract": "Nonergodic features of chaotic quantum many-body systems are commonly characterized through local observables, fidelity, and entanglement entropy. Here, using global and nonlocal measures of nonstabilizerness (magic), we study quantum many-body scars near infinite temperature in $(1+1)$-dimensional Abelian $\\mathbb{Z}_2$ and U$(1)$ lattice gauge theories, both analytically and numerically. We derive an exact closed-form expression for the nonlocal trace distance magic solely from the Schmidt spectrum, reducing the optimization over local unitaries to a finite maximization over stabilizer-compatible Schmidt ranks. We find that scar eigenstates can exhibit extensive global magic despite their anomalously low entanglement, while retaining anomalously large nonlocal magic compared with ergodic states. We further show that constrained Hilbert spaces can generate irreducible nonlocal magic through stabilizer-incompatible Schmidt ranks, even for a flat entanglement spectrum.", "url": "https://arxiv.org/abs/2610.00129", "type": "理论+数值", "summary": "混沌量子多体系统的非遍历特征通常通过局部可观测量、保真度和纠缠熵来表征。在这里，使用全局和非局部的非稳定性测量（魔法），我们在 $(1+1)$ 维阿贝尔 $\\mathbb{Z}_2$ 和 U$(1)$ 晶格规范理论中研究无限温度附近的量子多体疤痕，包括分析和数值。我们仅从施密特谱导出非局部迹距离魔法的精确封闭式表达式，将局部幺正的优化减少到稳定器兼容的施密特等级上的有限最大化。我们发现，疤痕本征态可以表现出广泛的全局魔力，尽管它们的纠缠度异常低，同时与遍历态相比，保留了异常大的非局域魔力。我们进一步表明，即使对于平坦的纠缠谱，受约束的希尔伯特空间也可以通过与稳定器不兼容的施密特等级产生不可约的非局部魔力。", "authors": [{"name": "Lukas Ebner"}, {"name": "Giovanni Cataldi"}, {"name": "Kaidi Xu"}, {"name": "Jad C. Halimeh"}, {"name": "Emanuele Tirrito"}], "featured_authors": [{"name": "Lukas Ebner"}, {"name": "Giovanni Cataldi"}, {"name": "Kaidi Xu"}, {"name": "Jad C. Halimeh"}, {"name": "Emanuele Tirrito"}], "author_count": 5}, {"id": "2610.00133", "category": "quant-ph", "title": "Stellar rank under the contraction of SU(1,1) to the Heisenberg-Weyl group", "abstract": "Under the contraction of $SU(1,1)$ to the Heisenberg-Weyl group, the zeros of the Husimi function of a state redistribute according to a single scale, and we determine which of them survive. The stellar rank of a single-mode bosonic pure state, the number of these zeros, characterises the Gaussian states on the plane through the vanishing of the rank. On the Poincaré disk, where the same construction applies to the discrete series of $SU(1,1)$, it does not, because the zero set leaves a zero-free factor undetermined. We therefore ask how the zero structure behaves in the contraction limit rather than how it should be classified at fixed Bargmann index. The entire difference between the two Hilbert spaces reduces to one weight sequence $w_k(m)=(2k)^m/(2k)_m$, whose monotonicity in $k$ drives every estimate below. The rescaled states form a normal family, every nonzero limit point lies in the Segal-Bargmann space, and those with finitely many zeros are exactly the finite-rank Fock states. The rank is upper semicontinuous, with equality precisely when all zeros scale as $O(1/\\sqrt{2k})$, the scale of the coherent-state labels. A two-sided Harnack estimate pins the profile on compact sets. Separately, a family of rank $r$ degenerates if and only if the amplitudes on the lowest $r+1$ weight vectors tend to zero. Mass escapes at the edge of the rescaled disk instead, by a first-order transition of the semiclassical Husimi potential at an explicit critical coupling. Finally, the contraction limit retains exactly the lowest $2r+3$ amplitudes, and this number cannot be lowered.", "url": "https://arxiv.org/abs/2610.00133", "type": "理论", "summary": "在 $SU(1,1)$ 收缩到 Heisenberg-Weyl 群的情况下，状态的 Husimi 函数的零点根据单一尺度重新分布，我们可以确定哪些零点幸存。单模玻色子纯态的恒星等级，即这些零的数量，通过等级的消失来表征平面上的高斯态。在庞加莱圆盘上，相同的构造适用于 $SU(1,1)$ 的离散级数，但事实并非如此，因为零集留下了一个未确定的无零因子。因此，我们询问零结构在收缩极限下的表现如何，而不是在固定巴格曼指数下应如何对其进行分类。两个希尔伯特空间之间的全部差异减少为一个权重序列 $w_k(m)=(2k)^m/(2k)_m$，其 $k$ 中的单调性驱动下面的每个估计。重新缩放的状态形成一个正规族，每个非零极限点都位于 Segal-Bargmann 空间中，并且那些具有有限多个零的状态正是有限秩 Fock 状态。秩是上半连续的，当所有零缩放为相干状态标签的缩放 $O(1/\\sqrt{2k})$ 时，精确地相等。\n\n两侧 Harnack 估计将轮廓固定在紧凑集上。另外，当且仅当最低 $r+1$ 权重向量的幅度趋于零时，秩 $r$ 族才会退化。相反，通过半经典 Husimi 势在显式临界耦合下的一阶跃迁，质量在重新缩放的圆盘边缘逸出。最后，收缩极限恰好保留了最低的$2r+3$幅度，并且这个数字不能降低。", "authors": [{"name": "Chon-Fai Kam"}], "featured_authors": [{"name": "Chon-Fai Kam"}], "author_count": 1}, {"id": "2610.00169", "category": "quant-ph", "title": "Projector Form of the Quantum Brachistochrone and Its Relation to Two-Boundary Quantum Algorithm Design", "abstract": "We clarify the relation between the time-optimal quantum evolution of Carlini et al. and the coherent two-boundary optimal-control formulation recently proposed for quantum algorithm design.", "url": "https://arxiv.org/abs/2610.00169", "type": "理论+数值", "summary": "我们阐明了 Carlini 等人的时间最优量子演化之间的关系。以及最近提出的用于量子算法设计的相干二边界最优控制公式。", "authors": [{"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Masayuki Ohzeki"}], "author_count": 1}, {"id": "2610.00187", "category": "quant-ph", "title": "Entanglement cost of quantum depolarization", "abstract": "Entanglement cost is the asymptotic rate of Bell pairs required to prepare a quantum state. Its regularized definition has made exact evaluation difficult, even for isotropic states (i.e., depolarized maximally entangled states). In this work, we determine the entanglement cost of every qubit isotropic state and, more generally, every two-qubit Bell-diagonal state. Our proof uses a family of suitably tuned qubit semigroups to transform a general log-Sobolev entropy bound into supporting lines of Wootters' function. A recent exact tensorization theorem of Dong et al. [ arXiv:2606.17729 ] extends these bounds to arbitrarily many copies, yielding a general lower bound on entanglement cost. Matching this bound with the entanglement of formation also determines the exact cost for a broader class of two-qubit states. For qudit isotropic states, we derive another general lower bound from the full depolarizing $2\\to 3$ norm. This bound substantially improves on the PPT-relative entropy of entanglement and nearly matches the entanglement of formation, leaving a gap of at most $2\\%$ of $\\log d$ that vanishes as $d$ grows. Finally, the exact qubit results and qudit bounds extend to the entanglement cost of preparing quantum depolarizing channels under both parallel and sequential strategies.", "url": "https://arxiv.org/abs/2610.00187", "type": "理论", "summary": "纠缠成本是准备量子态所需的贝尔对的渐近率。其正则化定义使得精确评估变得困难，即使对于各向同性态（即去极化最大纠缠态）也是如此。在这项工作中，我们确定了每个量子位各向同性态的纠缠成本，更一般地说，确定了每个两个量子位贝尔对角态的纠缠成本。我们的证明使用一系列经过适当调整的量子位半群将一般的对数索博列夫熵界转换为伍特斯函数的支持线。 Dong 等人最近提出的精确张量化定理。 [ arXiv:2606.17729 ] 将这些界限扩展到任意多个副本，从而产生纠缠成本的一般下限。将这一界限与形成的纠缠相匹配也决定了更广泛的两量子位状态类别的确切成本。对于 qudit 各向同性态，我们从完全去极化 $2\\to 3$ 范数中得出另一个一般下界。这个界限大大改善了纠缠的 PPT 相对熵，并且几乎匹配形成的纠缠，留下 $\\log d$ 的最多 $2\\%$ 的间隙，随着 $d$ 的增长而消失。\n\n最后，精确的量子位结果和量子界限延伸到在并行和顺序策略下准备量子去极化通道的纠缠成本。", "authors": [{"name": "Kun Fang"}], "featured_authors": [{"name": "Kun Fang"}], "author_count": 1}, {"id": "2610.00246", "category": "quant-ph", "title": "Physical-Work Fluctuation Relations from Accessible Quantum Macrostates", "abstract": "Jarzynski's equality recovers an equilibrium free-energy difference from nonequilibrium work trajectories, but its exponential average can converge very slowly because rare trajectories carry large weight. We show that coarse thermodynamic information measured at the nonequilibrium endpoint can reduce this sampling burden while keeping the same microscopic trajectories and the same free-energy target. The endpoint mean energy and a coarse spatial record define a maximum-entropy state and select one member of an exact family of fluctuation relations. That physically selected member provides an exact statistical control for the ordinary Jarzynski estimator, even when the final energy and retained record do not commute. In a finite Bose--Hubbard system, this control substantially lowers the finite-confidence sampling cost, while a small controlled departure from exact endpoint matching produces a square-root information--sampling tradeoff.", "url": "https://arxiv.org/abs/2610.00246", "type": "理论", "summary": "Jarzynski 方程从非平衡工作轨迹中恢复了平衡自由能差，但其指数平均值收敛速度非常慢，因为稀有轨迹具有较大的权重。我们表明，在非平衡端点测量的粗略热力学信息可以减轻这种采样负担，同时保持相同的微观轨迹和相同的自由能目标。端点平均能量和粗略空间记录定义最大熵状态并选择精确的涨落关系族中的一个成员。即使最终能量和保留记录不交换，物理选择的成员也可以为普通 Jarzynski 估计器提供精确的统计控制。在有限的 Bose-Hubbard 系统中，这种控制大大降低了有限置信度采样成本，而与精确端点匹配的微小受控偏离会产生平方根信息采样权衡。", "authors": [{"name": "Borhan Ahmadi"}], "featured_authors": [{"name": "Borhan Ahmadi"}], "author_count": 1}, {"id": "2610.00261", "category": "quant-ph", "title": "Exact replica-sector hierarchy of multi-resolvent correlations in random free fermions", "abstract": "The spectral weight with which a many-body eigenstate contributes to a given channel is not fixed by the smooth one-point ETH envelope, and its higher-order correlations---the connected cumulants of three and more channel-resolved spectral functions---have lacked a systematic organization. We construct one. In random free fermions, where every channel overlap is a squared Slater minor of a Haar-orthogonal one-body eigenvector matrix, the $r$-resolvent moment admits an exact replica-sector decomposition: a sum over the double-coset sectors of the orthogonal Weingarten algebra, in which the permutation sectors are the replica contraction classes and each sector value is determined by the overlap pattern of the channels and of the eigenstates. The sector coefficients follow from an exact occupancy-matrix assembly---a signed convolution over the slot permutations, a decomposition into connected blocks, and a finite-state chain transfer matrix whose local transition rules are independent of $r$ and $k$---so the sector theorem holds at arbitrary finite multiplicity, realized exactly at $r=3$ ($k=2,3,4$), $r=4$ and $r=5$ ($k=2$). The structure carries the physical hierarchy: the fully coincident sector is the projection that yields the Selberg moment ratios $q_r$, the levels are nested by exact marginalization, and the sectors are the multi-energy spectral cumulants behind the resolvent cumulants, with the irreducible self-energy vertices of the Feshbach ladder as the connected kernel. The multi-resolvent correlations of random free fermions are therefore organized, level by level, by one replica-sector algebra---an exact microscopic benchmark for the higher-order fluctuation sector of eigenstate thermalization, with its microscopic sector geometry made explicit.", "url": "https://arxiv.org/abs/2610.00261", "type": "理论+数值", "summary": "多体本征态对给定通道的谱权重不是由平滑的单点 ETH 包络固定的，其高阶相关性（三个及更多通道解析谱函数的连接累积量）缺乏系统的组织。我们建造一个。在随机自由费米子中，每个通道重叠都是 Haar 正交单体特征向量矩阵的平方 Slater 小数，$r$ 解析矩允许精确的副本扇区分解：正交 Weingarten 代数的双陪集扇区的和，其中排列扇区是副本收缩类，每个扇区值由通道和本征态的重叠模式确定。扇区系数源自精确的占用矩阵组合——槽排列上的带符号卷积、分解为连通块以及局部转移规则独立于$r$和$k$的有限状态链转移矩阵——因此扇区定理在任意有限重数下成立，精确地在$r=3$($k=2,3,4$)、$r=4$和$r=5$($k=2$)处实现。\n\n该结构承载物理层次结构：完全重合的扇区是产生塞尔伯格矩比 $q_r$ 的投影，各层通过精确边缘化嵌套，扇区是解析累积量后面的多能谱累积量，以费什巴赫梯子的不可约自能顶点作为连接核。因此，随机自由费米子的多解析相关性是由一个复制扇形代数逐级组织的——本征态热化的高阶涨落扇形的精确微观基准，其微观扇形几何形状明确。", "authors": [{"name": "Zhiqiang Huang"}], "featured_authors": [{"name": "Zhiqiang Huang"}], "author_count": 1}, {"id": "2610.00274", "category": "quant-ph", "title": "Frame dependence of Kochen-Specker contextuality for relativistic spin systems", "abstract": "We ask whether Kochen-Specker contextuality is Lorentz invariant. On the full Hilbert space, it is, since boosts act unitarily. Restricted to spin, it is not: momentum acts as an environment applying momentum-dependent Wigner rotations, leaving spin observables unsharp and breaking the operator identities behind state-independent contextuality. For spin $1/2$ one scalar governs the loss, the packet average $\\Delta$ of $\\sin^2(\\theta_W/2)$ (where $\\theta_W$ is the Wigner angle); for any spin, a ray degrades at a rate set by its spin variance transverse to the boost. In the spin-only account, the Free Will Theorem's SPIN axiom fails for every $\\Delta>0$; the Yu-Oh set loses contextuality between $\\Delta\\approx0.008$ and $0.016$, with state independence going first; the Peres-Mermin square loses contextuality at $\\Delta\\approx0.059$ or $0.074$ by orientation; singlet CHSH loses nonlocality for $\\Delta\\geq0.159$; and a GHZ-state OR gate loses Raussendorf's contextuality certificate at $\\Delta\\approx0.206$. A $q$-plate implements the channel exactly on photon polarisation, with a retardation in place of the rapidity, so the nonlocality, GHZ and aimed-source results are testable without motion.", "url": "https://arxiv.org/abs/2610.00274", "type": "理论", "summary": "我们询问 Kochen-Specker 上下文关系是否是洛伦兹不变的。在完整的希尔伯特空间上，确实如此，因为增强作用是统一的。仅限于自旋，但它不是：动量充当应用动量相关维格纳旋转的环境，使自旋可观测值不清晰，并打破与状态无关的上下文背后的算子身份。对于旋转 $1/2$，一个标量控制损失，$\\sin^2(\\theta_W/2)$ 的数据包平均值 $\\Delta$（其中 $\\theta_W$ 是维格纳角）；对于任何自旋，射线都会以其横向于增强的自旋方差设定的速率退化。在仅自旋账户中，自由意志定理的 SPIN 公理对于每个 $\\Delta>0$ 都失败； Yu-Oh 集失去了 $\\Delta\\approx0.008$ 和 $0.016$ 之间的上下文关系，国家独立性优先； Peres-Mermin 方阵在 $\\Delta\\approx0.059$ 或 $0.074$ 方向上失去了上下文关系；单线态 CHSH 失去 $\\Delta\\geq0.159$ 的非定域性；并且 GHZ 状态 OR 门在 $\\Delta\\approx0.206$ 处丢失 Raussendorf 的上下文证书。\n\n$q$ 板精确地在光子偏振上实现通道，并用延迟代替速度，因此非定域性、GHZ 和目标源结果无需运动即可测试。", "authors": [{"name": "Jonte R. Hance"}, {"name": "Ruben Campos Delgado"}], "featured_authors": [{"name": "Jonte R. Hance"}, {"name": "Ruben Campos Delgado"}], "author_count": 2}, {"id": "2610.00293", "category": "quant-ph", "title": "Quantum gates from the middle convolution of twisted Burau representations", "abstract": "We study braid representations obtained from character-twisted Burau inputs by the Katz-Long-Moody (KLM) construction, which corresponds to multiplicative middle convolution for KZ-type equations. For $n\\ge2$, let $q=e^{2\\pi ia}$, $\\tau=e^{2\\pi ic}$, where $a,c>0$ and $nc+(n+1)a<1$. Known form and signature results give a positive-definite invariant form for $\\lambda=e^{2\\pi il}$, $0<l<1-nc-(n+1)a$. For fixed input, unitary realizations are unique up to simultaneous unitary conjugation. We address two questions. First, we determine spectra and invariant summands of the $M=n(n+1)$-dimensional output. The generator spectrum recovers $(q,\\tau)$. The output decomposes into two trivial and two reduced Burau summands, and an $n(n-1)$-dimensional summand isomorphic to Long's reduced construction, generically irreducible for $n=3,4$. If $a$ or $c$ is irrational, every generator is non-Clifford in every finite-dimensional Weyl-Heisenberg frame; if $1,a,c$ are linearly independent over $\\mathbb{Q}$, every generator is entangling for every nontrivial bipartition. The full braid image is not projectively dense. For general positive-definite unitary inputs, irreducibility of the full braid output at a nonexceptional parameter forces the free-group input operators to commute. Second, we construct one orthonormal basis giving each generator one block of size $2(n+1)$, $n-2$ blocks of size two, and identity elsewhere. Each generator is a product of $2n$ rank-one phase reflections and, in a fixed binary encoding, an $O(M)$-length word in one-qubit unitaries and CNOTs, without auxiliary qubits and including direction preparation and its inverse. We give finite-alphabet approximation, conditioning and error bounds, and a matched-resource comparison with a Quantum Shannon reference compiler. The gate bound is exponential in the encoded qubit count and excludes classical preprocessing.", "url": "https://arxiv.org/abs/2610.00293", "type": "理论", "summary": "我们研究通过 Katz-Long-Moody (KLM) 结构从字符扭曲的 Burau 输入获得的辫子表示，这对应于 KZ 型方程的乘法中间卷积。对于$n\\ge2$，设$q=e^{2\\pi ia}$，$\\tau=e^{2\\pi ic}$，其中$a,c>0$且$nc+(n+1)a<1$。已知形式和签名结果给出 $\\lambda=e^{2\\pi il}$, $0<l<1-nc-(n+1)a$ 的正定不变形式。对于固定输入，酉实现对于同时酉共轭而言是唯一的。我们解决两个问题。首先，我们确定$M=n(n+1)$维输出的谱和不变被加数。发生器频谱恢复$(q,\\tau)$。输出分解为两个平凡的和两个简化的 Burau 被加数，以及一个与 Long 的简化构造同构的 $n(n-1)$ 维被加数，对于 $n=3,4$ 通常不可约。如果 $a$ 或 $c$ 是无理数，则每个生成器在每个有限维 Weyl-Heisenberg 框架中都是非 Clifford 的；如果 $1,a,c$ 与 $\\mathbb{Q}$ 线性无关，则每个生成器对于每个非平凡二分都是纠缠的。完整的辫子图像投影并不密集。\n\n对于一般正定酉输入，非异常参数下全编织输出的不可约性迫使自由群输入算子进行交换。其次，我们构建一个正交基，为每个生成器提供一个大小为 $2(n+1)$ 的块、大小为 2 的 $n-2$ 块，并在其他位置提供恒等式。每个生成器都是 $2n$ 一级相位反射的乘积，并且在固定的二进制编码中，是单量子位酉和 CNOT 中的 $O(M)$ 长度的字，没有辅助量子位，并且包括方向准备及其逆。我们给出了有限字母近似、调节和误差界限，以及与量子香农参考编译器的匹配资源比较。门界在编码的量子位计数中呈指数增长，并且不包括经典的预处理。", "authors": [{"name": "Haru Negami"}], "featured_authors": [{"name": "Haru Negami"}], "author_count": 1}, {"id": "2610.00440", "category": "quant-ph", "title": "Finite-blocklength classical communication over the quantum erasure channel with and without classical feedback", "abstract": "We determine the optimal success probability for transmitting a fixed number of classical messages through a finite number of uses of the quantum erasure channel, assisted by noiseless classical feedback and without initial shared entanglement. For an input dimension $d$, an erasure probability $p$, a blocklength $n$, and $M$ equiprobable messages, the optimal success probability is equal to $E[\\min\\{1,d^K/M\\}]$, where $K$ is binomial with parameters $n$ and $1-p$. The converse allows arbitrary adaptive quantum encoders, quantum memories, and receiver instruments. Its main ingredient is an elementary dimension bound for noiseless quantum communication with classical feedback, proved by fixing the classical controls without conditioning the sender's state on the observed transcript. A classical protocol that transmits the base-$d$ digits of an integer representing the message, repeating each digit until the receiver acknowledges its reception or the prescribed blocklength is reached, attains the bound for every integer $M$. We also establish a relative-majorization property of erasure-channel outputs and exactly evaluate a hypothesis-testing converse, recovering the same numerical bound without feedback. That converse need not be achievable without feedback: four uses of the qubit erasure channel and four messages give a strict gap. A product-state code employing tetrahedral qubit states nevertheless outperforms every classical binary erasure code with these parameters. We give an explicit message-size formula and show that the bounded-remainder normal approximation and the average-success strong-converse exponent are unchanged without feedback. We also determine the feedback-assisted error exponent below capacity, prove that it agrees with the no-feedback exponent above a critical rate, and give no-feedback bounds at lower rates.", "url": "https://arxiv.org/abs/2610.00440", "type": "理论+数值", "summary": "我们确定了通过有限次数使用量子擦除通道传输固定数量经典消息的最佳成功概率，并辅以无噪声经典反馈且没有初始共享纠缠。对于输入维度 $d$、擦除概率 $p$、块长度 $n$ 和 $M$ 等概率消息，最佳成功概率等于 $E[\\min\\{1,d^K/M\\}]$，其中 $K$ 是参数 $n$ 和 $1-p$ 的二项式。反之则允许任意自适应量子编码器、量子存储器和接收器仪器。它的主要成分是具有经典反馈的无噪声量子通信的基本维度，通过固定经典控制而不根据观察到的转录本调节发送者的状态来证明。传输表示消息的整数的基 $d$ 数字的经典协议，重复每个数字直到接收者确认其接收或达到规定的块长度，达到每个整数 $M$ 的界限。\n\n我们还建立了擦除通道输出的相对多数化属性，并准确评估假设检验的逆过程，在没有反馈的情况下恢复相同的数值范围。如果没有反馈，这一过程就不可能实现：量子位擦除通道的四次使用和四条消息会产生严格的间隙。然而，采用四面体量子位状态的产品状态代码的性能优于具有这些参数的每个经典二进制擦除代码。我们给出了一个明确的消息大小公式，并表明有界余数正态近似和平均成功强逆指数在没有反馈的情况下保持不变。我们还确定低于容量的反馈辅助误差指数，证明它与高于临界速率的无反馈指数一致，并给出较低速率下的无反馈界限。", "authors": [{"name": "Mark M. Wilde"}], "featured_authors": [{"name": "Mark M. Wilde"}], "author_count": 1}, {"id": "2610.00441", "category": "quant-ph", "title": "Quantum Secret Sharing and Error Correction vs No-Cloning", "abstract": "Secret sharing is ubiquitous throughout cryptography. All possible access structures are classically feasible, and in the case of threshold access structures, the protocols are even very efficient. However, when moving to the quantum setting, the no-cloning theorem shows that many access structures are impossible. In fact, no-cloning exactly characterizes feasibility: for thresholds, quantum secret sharing is possible if and only if the threshold $t$ is strictly more than $n/2$. In this work, we propose a variant of quantum secret sharing (QSS) where two or more identical copies of the input state are provided, but the output is only required to recover one copy. This notion circumvents the simple one-copy no-cloning obstruction, though the natural $k$-copy generalization still gives much milder obstructions. For thresholds using $k$ copies, no-cloning implies that QSS is impossible whenever $t\\leq n/(k+1)$. It is tempting to hypothesize that no-cloning continues to exactly characterize the many-copy case. However, we show that this is not the case. We give positive results showing that multiple copies allow for going slightly beyond the single-copy obstruction: for thresholds, we construct QSS whenever $t>(n-k+1)/2$. On the other hand, we give a novel obstruction we call the Clique Path obstruction, which applies to arbitrary access structures. For thresholds, it shows that QSS is impossible whenever $t\\leq (n-1)/k$. Our upper and lower bounds exactly match for $k=2$. Both our results leverage connections to the $k$-colorability of certain graphs derived from the access structure. We leave closing the gap for $k\\geq 3$ copies as a fascinating direction for future work. Secret sharing is closely related to error correction, which can also be considered in the many-copy setting. Our r
