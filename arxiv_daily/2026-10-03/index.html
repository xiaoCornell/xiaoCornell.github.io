  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);

      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }

    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }

    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }

    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }

    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2610.00100", "category": "cond-mat", "title": "Transferable Graph Neural Network Surrogates for Molecular Dynamics Across Crystal Symmetries", "abstract": "We present a transferable graph neural network (GNN) surrogate framework for molecular dynamics (MD) that directly predicts atomic displacements and propagates atomistic configurations without explicit force evaluation or numerical time integration. The central objective of this work is to establish whether a common GNN formulation can represent atomic dynamics across materials with fundamentally different crystal symmetries and coordination environments. The same network architecture, feature representation, graph construction, and training protocol are applied without symmetry-specific modification to face-centered cubic (FCC) aluminum, body-centered cubic (BCC) iron, and hexagonal close-packed (HCP) magnesium. Across these distinct elemental and crystallographic systems, the framework achieves position-prediction errors on the order of 10^-4 Angstrom^2 and supports stable autoregressive propagation to nanosecond time scales. The predicted trajectories preserve thermodynamic stability, characteristic coordination-shell structure in the radial distribution functions, and temperature-dependent mean-squared-displacement behavior. In particular, the framework captures the closely spaced coordination shells of BCC iron and the anisotropic coordination environment of HCP magnesium without introducing lattice-specific representations. These results demonstrate that direct GNN-based atomic propagation can be formulated as a transferable framework across different elements, lattice symmetries, and coordination geometries, providing a pathway toward generalizable surrogate models for accelerated molecular dynamics.", "url": "https://arxiv.org/abs/2610.00100", "type": "理论+数值", "summary": "我们提出了一种用于分子动力学（MD）的可转移图神经网络（GNN）代理框架，它可以直接预测原子位移并传播原子构型，而无需明确的力评估或数值时间积分。这项工作的中心目标是确定一个通用的 GNN 公式是否可以代表具有根本不同的晶体对称性和配位环境的材料的原子动力学。相同的网络架构、特征表示、图形构建和训练协议适用于面心立方 (FCC) 铝、体心立方 (BCC) 铁和六方密堆积 (HCP) 镁，无需进行特定于对称性的修改。在这些不同的元素和晶体系统中，该框架实现了 10^-4 Angstrom^2 量级的位置预测误差，并支持纳秒时间尺度的稳定自回归传播。预测的轨迹保留了热力学稳定性、径向分布函数中的特征配位壳结构以及与温度相关的均方位移行为。\n\n特别是，该框架捕获了 BCC 铁的紧密排列的配位壳和 HCP 镁的各向异性配位环境，而无需引入晶格特定的表示。这些结果表明，直接基于 GNN 的原子传播可以被表述为跨不同元素、晶格对称性和配位几何的可转移框架，为加速分子动力学的通用替代模型提供了一条途径。", "authors": [{"name": "Judah Immanuel"}, {"name": "Avik Mahata"}, {"name": "Aniruddha Maiti"}], "featured_authors": [{"name": "Judah Immanuel"}, {"name": "Avik Mahata"}, {"name": "Aniruddha Maiti"}], "author_count": 3}, {"id": "2610.00110", "category": "cond-mat", "title": "Emergence of electronic modes and triplet pairing from spin-1 antiferromagnetic insulators in the Kanamori-Hubbard model", "abstract": "The electronic band structures of conventional band insulators generally remain unchanged under doping via chemical-potential shifts or increasing temperature. However, in Mott and Kondo insulators described by models such as the Hubbard and Kondo lattice models, distinct electronic modes with momentum-shifted magnetic dispersion relations have been shown to emerge from band edges into the gap. Here, by investigating the two-orbital Kanamori-Hubbard model, this study elucidates how and why the band structures of spin-1 antiferromagnetic insulators change with doping and temperature, revealing emergent spectral features characteristic of orbitally degenerate systems. The nature of the emergent electronic modes is clarified using weak-hopping effective theory, selection-rule analysis, and numerical calculations. In a typical parameter regime, the doping-induced modes in each orbital reflect distinct types of spin modes, while the temperature-induced modes primarily reflect the low-energy spin mode in both orbitals; in both cases, the emergent modes exhibit momentum-shifted spin-mode dispersion relations. The momentum regimes of these emergent modes can differ between orbitals if signs of the hopping parameters differ. For small inter-orbital repulsion, onsite spin-triplet pairs can form after doping, leading to a pair-breaking gap, while the temperature-induced electronic modes continue to reflect the low-energy spin mode without a pair-breaking gap. Moreover, the emergence and characteristics of electronic modes in nonequilibrium states by spin or charge perturbations are elucidated. These findings provide a comprehensive understanding of how the interplay among the spin, charge, and orbital degrees of freedom in large-spin antiferromagnetic insulators leads to emergent electronic modes, opening avenues for exploring unconventional quantum phenomena in strongly correlated systems.", "url": "https://arxiv.org/abs/2610.00110", "type": "理论+数值", "summary": "传统能带绝缘体的电子能带结构在通过化学势变化或温度升高进行掺杂的情况下通常保持不变。然而，在哈伯德和近藤晶格模型等模型描述的莫特和近藤绝缘体中，具有动量偏移磁色散关系的不同电子模式已被证明从带边缘出现到间隙中。在这里，通过研究双轨道 Kanamori-Hubbard 模型，本研究阐明了自旋 1 反铁磁绝缘体的能带结构如何以及为何随掺杂和温度而变化，揭示了轨道简并系统的新兴光谱特征。利用弱跳变有效理论、选择规则分析和数值计算阐明了新兴电子模式的性质。在典型的参数范围内，每个轨道中的掺杂诱导模式反映了不同类型的自旋模式，而温度诱导模式主要反映了两个轨道中的低能自旋模式；在这两种情况下，涌现模式都表现出动量转移的自旋模式色散关系。\n\n如果跳跃参数的符号不同，则这些涌现模式的动量状态在轨道之间可能不同。对于较小的轨道间排斥力，掺杂后可以形成现场自旋三重态对，从而导致断对间隙，而温度诱导的电子模式继续反映低能自旋模式，而没有断对间隙。此外，还阐明了自旋或电荷扰动导致的非平衡态电子模式的出现和特征。这些发现提供了对大自旋反铁磁绝缘体中自旋、电荷和轨道自由度之间的相互作用如何导致涌现电子模式的全面理解，为探索强相关系统中的非常规量子现象开辟了途径。", "authors": [{"name": "Masanori Kohno"}], "featured_authors": [{"name": "Masanori Kohno"}], "author_count": 1}, {"id": "2610.00124", "category": "cond-mat", "title": "Loading history and window geometry bound compact-state slip ranking during granular shear startup", "abstract": "Granular slip forecasting can conflate material state, loading progress, and the geometry of event-centered sampling. We separated these contributions in slowly sheared two-dimensional frictional disks using a compact neural score of stress, pressure, coordination, non-affine motion, and force-network observables. The model was developed on 36 trajectories and frozen efore testing on 18 new trajectories under two nested stress-drop definitions. Inspection of held-out results revealed post-event sampling asymmetry; recovery-aware analyses are therefore descriptive. With trajectories weighted equally, the compact score ranked near-slip windows above both prevalence and within-trajectory circular-phase controls under both definitions (representative average precision 0.310 versus prevalence 0.173; phase-null upper bound 0.257). Loading-history coordinates ranked more strongly, reaching 0.534 for causal elapsed strain. The recovery-aware rule retained 78.4\\% of activity-gated events and preferentially selected longer preceding intervals; ranking by time since the previous catalogued event remained compatible with a count-conditioned geometry null. Compact observables thus contain temporally aligned slip information, but stronger loading-history baselines and window-geometry sensitivity bound that evidence. These startup data do not isolate a state-specific short-horizon precursor beyond loading history or support a renewal interpretation of elapsed-strain ranking.", "url": "https://arxiv.org/abs/2610.00124", "type": "理论", "summary": "粒度滑移预测可以合并材料状态、加载进度和以事件为中心的采样的几何形状。我们使用应力、压力、协调、非仿射运动和力网络可观察量的紧凑神经评分将这些贡献分离到缓慢剪切的二维摩擦盘中。该模型是在 36 条轨迹上开发的，并在两个嵌套应力降定义下测试 18 条新轨迹之前冻结。对保留结果的检查显示事后抽样不对称；因此，恢复感知分析是描述性的。在轨迹加权相同的情况下，紧凑分数将近滑移窗口排在两种定义下的流行度和轨迹内循环相位控制之上（代表性平均精度 0.310 对比流行度 0.173；零相位上限 0.257）。加载历史坐标排名更强，因果经过应变达到 0.534。恢复感知规则保留了 78.4% 的活动门控事件，并优先选择较长的先前间隔；自上次编目事件以来按时间排名仍然与计数条件几何空值兼容。\n\n因此，紧凑的可观测值包含时间上对齐的滑动信息，但更强的加载历史基线和窗口几何敏感性限制了该证据。这些启动数据不会隔离加载历史之外的特定于状态的短期前兆，也不会支持对经过应变排名的更新解释。", "authors": [{"name": "Ruixin Zhou"}, {"name": "Boliang Yu"}], "featured_authors": [{"name": "Ruixin Zhou"}, {"name": "Boliang Yu"}], "author_count": 2}, {"id": "2610.00152", "category": "cond-mat", "title": "Quasi-static loading of granular media as a linear complementarity problem", "abstract": "The discrete quasi-static response of rate-independent dissipative granular media is addressed. Granular systems are conventionally simulated with methods that are intrinsically dynamic, such as the discrete element (DEM) and discontinuous deformation (DDA) methods, with the particles' accelerations and damping being essential aspects. In contrast, quasi-static methods derive from the static stiffness relationships among the particles. With frictional contacts, an assembly's stiffness is incrementally non-linear and dependent on the direction of loading. The paper resolves this difficulty by casting the response as a linear complementarity problem (LCP). The approach benefits from a foundation of past research on existence, uniqueness, and stability of LCP solutions, which are expounded in a concise set of rules. The LCP of a granular system is derived, accounting for geometric effects that arise from curvatures of particles at their contacts, frictional contact stiffnesses, and displacement constraints on the particles. The paper describes eight aberrant conditions (pathologies) of granular systems, in the forms of various bifurcations and instabilities. When placed in the context of an LCP, the eight conditions are unambiguously defined. These pathologies include three types of bifurcation: discrete, continuous-bounded (not yet reported in the literature), and continuous-unbounded. Not yet reported in the literature is an abrupt discontinuous change in movements upon a continuous change of the data. Methods and results are illustrated with examples of granular systems. Results show that instability and bifurcation are pervasive conditions near failure; that failure and softening are sensitive to the geometric contours of the particles at contacts; and that quasi-static systems can encounter states that require a dynamic transition to resolve a lack of paths consistent with loading.", "url": "https://arxiv.org/abs/2610.00152", "type": "理论", "summary": "解决了与速率无关的耗散颗粒介质的离散准静态响应。颗粒系统通常使用本质上动态的方法进行模拟，例如离散元 (DEM) 和不连续变形 (DDA) 方法，其中粒子的加速度和阻尼是重要方面。相反，准静态方法源自粒子之间的静态刚度关系。对于摩擦接触，组件的刚度逐渐非线性，并且取决于载荷方向。本文通过将响应转化为线性互补问题（LCP）来解决这一难题。该方法受益于过去对 LCP 解决方案的存在性、唯一性和稳定性的研究基础，这些解决方案以一组简洁的规则进行了阐述。推导了颗粒系统的 LCP，考虑了颗粒接触处的曲率、摩擦接触刚度和颗粒的位移约束所产生的几何效应。该论文以各种分叉和不稳定性的形式描述了颗粒系统的八种异常状况（病理学）。\n\n当置于 LCP 环境中时，这八个条件被明确定义。这些病理包括三种类型的分叉：离散分叉、连续有界分叉（文献中尚未报道）和连续无界分叉。文献中尚未报道数据连续变化时运动的突然不连续变化。方法和结果用粒状系统的例子来说明。结果表明，不稳定和分叉是接近失效的普遍情况；失效和软化对接触处颗粒的几何轮廓很敏感；并且准静态系统可能会遇到需要动态转换的状态，以解决缺乏与加载一致的路径的问题。", "authors": [{"name": "Matthew R. Kuhn"}], "featured_authors": [{"name": "Matthew R. Kuhn"}], "author_count": 1}, {"id": "2610.00192", "category": "cond-mat", "title": "Migration Flows: Population Scaling and Heavy Tails", "abstract": "We show how migration between counties in different cities can explain both the population scaling of mean intercity flows and heavy-tailed intercity net-flow distributions. Density-dependent departure and arrival activities determine how mean flows scale with the populations of the origin and destination cities. We assume Gaussian county-pair net flows with standard deviations proportional to their mean directional flows. At a fixed correlation between county-pair net flows, their sum is Gaussian. Averaging this conditional Gaussian density over the correlation distribution can produce an intermediate power law with a Gaussian cutoff. We also present a stochastic model that generates the variance distribution used in this mixture.", "url": "https://arxiv.org/abs/2610.00192", "type": "理论", "summary": "我们展示了不同城市的县之间的人口迁移如何解释平均城际流量的人口规模和重尾城际净流量分布。与密度相关的出发和到达活动决定了平均流量如何随出发地和目的地城市的人口变化。我们假设高斯县对净流量的标准差与其平均方向流量成正比。在县对净流量之间存在固定相关性时，它们的总和呈高斯分布。对相关分布上的条件高斯密度进行平均可以产生具有高斯截止的中间幂律。我们还提出了一个随机模型，用于生成该混合物中使用的方差分布。", "authors": [{"name": "Cook Hyun Kim"}, {"name": "Sangjoon Park"}, {"name": "Seoyoung Jin"}, {"name": "Jaiyong Lee"}], "featured_authors": [{"name": "Cook Hyun Kim"}, {"name": "Sangjoon Park"}, {"name": "Seoyoung Jin"}, {"name": "Jaiyong Lee"}], "author_count": 4}, {"id": "2610.00324", "category": "cond-mat", "title": "Causality violations in cluster GW+DMFT: Exact Lehmann moments and the necessity of non-local vertex corrections", "abstract": "The $GW$ approximation is known to violate causality, yielding self-energies with unphysical poles in the upper half of the complex frequency plane. The combined $GW$+DMFT approach attempts to cure this by injecting the exact local self-energy. Using exact diagonalization on minimal Hubbard clusters, we rigorously benchmark the analytic structure of the $GW$ and $GW$+DMFT self-energies. We demonstrate a ``dimer anomaly'': on the two-site dimer, inversion symmetry forces the non-local self-energy to be purely real, masking the causality violation. Moving to the non-bipartite three-site Hubbard ring, where hopping frustration yields a finite imaginary part in the non-local self-energy, we prove that both $GW$ and $GW$+DMFT violate the Matsubara causality condition. By analytically evaluating the exact Lehmann moments, we derive a closed-form expression for the high-frequency tail of the self-energy, $C = U^2\\,\\mathrm{Var}(d)\\,I$, and show that standard methods fail to capture the exact equal-time two-particle correlators required to enforce it. The equal-time correlators that govern this tail are precisely those encoded in the high-frequency asymptotics of the fully irreducible vertex $\\Lambda$; nevertheless, our intermediate-frequency analysis demonstrates that the local-only truncation of $\\Lambda$ in $GW$+DMFT leaves non-local RPA resonances uncorrected. The two diagnostics are logically independent: $GW$+DMFT satisfies the necessary high-frequency condition $C\\succeq0$ yet still violates the Matsubara sign condition at finite frequencies. Taking the interpolation-free real-axis evaluation of the exact self-energy as the primary causality certificate, with rational continuation as supporting evidence, we establish a rigorous benchmark demonstrating that local self-energy corrections are insufficient to guarantee a causal analytic structure on frustrated clusters.", "url": "https://arxiv.org/abs/2610.00324", "type": "理论+数值", "summary": "众所周知，$GW$ 近似违反了因果关系，在复杂频率平面的上半部分产生具有非物理极点的自能。 $GW$+DMFT 组合方法试图通过注入精确的局部自能来解决这个问题。使用最小 Hubbard 簇上的精确对角化，我们严格对 $GW$ 和 $GW$+DMFT 自能的分析结构进行基准测试。我们证明了“二聚体异常”：在双位点二聚体上，反演对称性迫使非局域自能成为纯粹真实的，掩盖了因果关系的违反。转向非二分三点哈伯德环，其中跳跃挫折在非局部自能中产生有限虚部，我们证明 $GW$ 和 $GW$+DMFT 都违反松原因果条件。通过分析评估精确的莱曼矩，我们推导出自能高频尾部的封闭式表达式 $C = U^2\\,\\mathrm{Var}(d)\\,I$，并表明标准方法无法捕获执行它所需的精确等时双粒子相关器。\n\n控制这条尾部的等时相关器正是那些在完全不可约顶点 $\\Lambda$ 的高频渐近中编码的相关器；然而，我们的中频分析表明，$GW$+DMFT 中 $\\Lambda$ 的仅局部截断使得非局部 RPA 共振未得到校正。这两个诊断在逻辑上是独立的：$GW$+DMFT 满足必要的高频条件 $C\\succeq0$，但在有限频率下仍然违反松原符号条件。以精确自能的无插值实轴评估作为主要因果关系证明，以理性延续作为支持证据，我们建立了严格的基准，证明局部自能校正不足以保证受挫簇上的因果分析结构。", "authors": [{"name": "Michael O. Atambo"}], "featured_authors": [{"name": "Michael O. Atambo"}], "author_count": 1}, {"id": "2610.00351", "category": "cond-mat", "title": "Thermodynamic origins of multimode spinodal decomposition in multicomponent alloys", "abstract": "In a binary alloy, spinodal decomposition has one composition direction in which the free energy can fall. A multicomponent alloy has more directions available, yet its elements usually separate together in a single, pseudobinary mode. Why does this happen, and what would allow two independent directions to become unstable? We examine these questions using binary interaction parameters and the composition-constrained curvature of the regular-solution free energy. Across equimolar BCC quaternaries, one unstable mode is the most common outcome at 500 K, while 15.2% have at least two. The tendency of unlike elements to mix helps explain the preference for one mode. We then show how particular arrangements of interactions, including a balanced repulsive triangle and an attractive-repulsive pair, guarantee two downhill directions. When those directions have similar strengths, simplified phase-field models produce a broad texture of locally different solid solutions rather than two chemical blocks. A phase-specific screen identifies five provisional alloys with nearly balanced modes, with Cu-In-Ir-Ti providing an example of this possibility. Thus, we establish a theoretical framework for engineering microstructures via spinodal decomposition derived from basic binary interaction tendencies.", "url": "https://arxiv.org/abs/2610.00351", "type": "理论", "summary": "在二元合金中，旋节线分解具有自由能可下降的一个组成方向。多元合金有更多可用方向，但其元素通常以单一的伪二元模式分离在一起。为什么会发生这种情况，什么会导致两个独立的方向变得不稳定？我们使用二元相互作用参数和正则解自由能的成分约束曲率来研究这些问题。在等摩尔 BCC 四元化合物中，一种不稳定模式是 500 K 时最常见的结果，而 15.2% 的不稳定模式至少有两种。不同元素混合的趋势有助于解释对一种模式的偏好。然后，我们展示了相互作用的特殊安排，包括平衡的排斥三角形和吸引-排斥对，如何保证两个下坡方向。当这些方向具有相似的强度时，简化的相场模型会产生局部不同固溶体的广泛结构，而不是两个化学块。特定相屏幕识别出五种具有接近平衡模式的临时合金，其中 Cu-In-Ir-Ti 提供了这种可能性的一个例子。\n\n因此，我们通过从基本二元相互作用趋势导出的旋节线分解建立了工程微观结构的理论框架。", "authors": [{"name": "Pravan Omprakash"}], "featured_authors": [{"name": "Pravan Omprakash"}], "author_count": 1}, {"id": "2610.00452", "category": "cond-mat", "title": "Anyon Proliferation and Anyon Superconductivity in Higgsing Transitions via Conformal Embeddings", "abstract": "We discuss (2+1)d Chern-Simons Higgsing transitions based on conformal embeddings and their relation to the proliferation of anyons. These transitions preserve or enlarge the intrinsic topological order despite reducing the gauge group. When the topological order is enlarged, the two phases differ by anyon condensation, and the transition takes an Abelian topological order to a non-Abelian one. In the $SO(N)_{2} \\hookrightarrow SU(N)_{1}$ family with $N \\geq 3$, the two semiclassical regimes have equivalent intrinsic topological orders but distinct realizations of a global $U(1)$ symmetry. For odd $N$, these are non-Abelian realizations of transitions from fermionic $1/N$ Laughlin states to charge-$2e$ anyon superconductivity coexisting with the same chiral $\\mathbb{Z}_{N}$ topological order. The scalar representations are always non-integrable with respect to the UV Chern-Simons level and therefore do not directly label anyons of the un-Higgsed phase, despite defining Wilson lines in the UV. Using heuristic adjoint screening, we propose candidate anyons in the un-Higgsed phase, while branching under the Higgs subgroup reveals channels corresponding to condensable anyons of the Higgs phase. We further construct a $\\mathrm{Spin}(16)_{1} \\to \\mathrm{Spin}(9)_{2}$ transition admitting a condensable algebra that contains a non-Abelian anyon but not all of the allowed gaugable channels in its self-fusion.", "url": "https://arxiv.org/abs/2610.00452", "type": "理论", "summary": "我们讨论基于共形嵌入的 (2+1)d Chern-Simons Higgsing 跃迁及其与任意子扩散的关系。尽管减少了规范组，这些转变仍保留或扩大了内在的拓扑顺序。当拓扑序放大时，两个相因任意子凝聚而不同，并且过渡从阿贝尔拓扑序到非阿贝尔拓扑序。在具有 $N \\geq 3$ 的 $SO(N)_{2} \\hookrightarrow SU(N)_{1}$ 系列中，两个半经典体系具有相同的内在拓扑顺序，但全局 $U(1)$ 对称性的实现不同。对于奇数 $N$，这些是从费​​米子 $1/N$ Laughlin 态到电荷 $2e$ 任意子超导性跃迁的非阿贝尔实现，并与相同的手性 $\\mathbb{Z}_{N}$ 拓扑序共存。标量表示对于 UV Chern-Simons 能级始终是不可积的，因此尽管在 UV 中定义了 Wilson 线，但不会直接标记非 Higgsed 相的任何子。\n\n使用启发式伴随筛选，我们提出了非希格斯相中的候选任意子，而希格斯子群下的分支揭示了与希格斯相的可凝聚任意子相对应的通道。我们进一步构造一个 $\\mathrm{Spin}(16)_{1} \\to \\mathrm{Spin}(9)_{2}$ 过渡，允许可压缩代数包含非阿贝尔任意子，但并非其自融合中所有允许的可测量通道。", "authors": [{"name": "Diego García-Sepúlveda"}, {"name": "Da-Chuan Lu"}], "featured_authors": [{"name": "Diego García-Sepúlveda"}, {"name": "Da-Chuan Lu"}], "author_count": 2}, {"id": "2610.00474", "category": "cond-mat", "title": "Algebraic Relaxation of Strong-to-Weak Symmetry-Breaking Order via Charge-Sector Broadening", "abstract": "Strong-to-weak spontaneous symmetry breaking (SW-SSB) is a distinctive phenomenon of mixed quantum states, characterized by nonlinear long-range order associated with strong symmetry. In realistic open quantum systems, however, strong symmetry is macroscopically fragile and can be explicitly reduced to weak symmetry through local charge exchange with the environment. In this paper, we investigate how the SW-SSB order decays under such strong-symmetry-breaking Liouvillian dynamics. For discrete $\\mathbb{Z}_2$ symmetry, a local symmetry-breaking perturbation drives an exponential decay of the Rényi-1 long-range correlator, revealing the fragility of discrete SW-SSB order. By contrast, for continuous $U(1)$ symmetry, local charge exchange broadens the distribution over symmetry-charge sectors and leads to parametrically slower algebraic relaxation. We establish a rigorous algebraic lower bound on the connected Rényi-1 long-range correlation, demonstrating the robustness of this slow relaxation. In the thermodynamic limit, we further uncover a two-stage dynamical scaling: $\\tilde{R}_1\\sim t^{-1}$ at early times and $\\tilde{R}_1\\sim t^{-1/z}$ at long times, with $z$ set by the underlying hydrodynamic dynamics. As a numerical verification, we consider fermionic chains with $z=2$ and $z=4$, which are excellent agreement with the theoretical predictions.", "url": "https://arxiv.org/abs/2610.00474", "type": "理论+数值", "summary": "强弱自发对称破缺（SW-SSB）是混合量子态的一种独特现象，其特征是与强对称性相关的非线性长程有序。然而，在现实的开放量子系统中，强对称性在宏观上是脆弱的，并且可以通过与环境的局部电荷交换明确地降低为弱对称性。在本文中，我们研究了 SW-SSB 阶数在这种强对称性破缺的刘维尔动力学下如何衰减。对于离散 $\\mathbb{Z}_2$ 对称性，局部对称性破缺扰动驱动 Rényi-1 长程相关器的指数衰减，揭示了离散 SW-SSB 阶的脆弱性。相比之下，对于连续 $U(1)$ 对称性，局部电荷交换拓宽了对称电荷扇区的分布，并导致参数上较慢的代数松弛。我们在相连的 Rényi-1 长程相关性上建立了严格的代数下界，证明了这种缓慢松弛的稳健性。\n\n在热力学极限中，我们进一步揭示了一个两阶段的动力学尺度：早期的 $\\tilde{R}_1\\sim t^{-1}$ 和长时间的 $\\tilde{R}_1\\sim t^{-1/z}$，其中 $z$ 由底层流体动力学动力学设置。作为数值验证，我们考虑 $z=2$ 和 $z=4$ 的费米子链，这与理论预测非常吻合。", "authors": [{"name": "Zi-Xi Fang"}, {"name": "Kai Zhang"}], "featured_authors": [{"name": "Zi-Xi Fang"}, {"name": "Kai Zhang"}], "author_count": 2}, {"id": "2610.00489", "category": "cond-mat", "title": "Electronic structure and two-orbital model of the quadlayer La$_5$Ni$_4$O$_{13}$", "abstract": "The discovery of pressure-induced superconductivity in Ruddlesden--Popper (RP) nickelates has stimulated extensive interest in high-T$_c$ superconductors. Here, we systematically study the electronic properties of the quadlayer RP nickelate La$_5$Ni$_4$O$_{13}$ under ambient pressure, 5% isotropic compressive strain, and 4% $c$-axis uniaxial strain using density functional theory (DFT) and random phase approximation (RPA) calculations. DFT calculations show that isotropic strain broadens the Ni-$e_g$ bands and induces charge transfer from O-$p$ to Ni-$d$ orbitals, whereas $c$-axis uniaxial strain selectively shifts the $d_{z^2}$-derived bonding1 band upward while leaving the $d_{x^2-y^2}$ dispersion nearly unchanged. From Wannier downfolding, we construct a quadlayer two-orbital model that reproduces the low-energy Ni-$e_g$ bands. Our model reveals that under ambient pressure and 5% isotropic strain, the Fermi surface consists of two electron pockets ($\\alpha$ and $\\delta$) and three hole pockets ($\\beta$, $\\beta^{\\prime}$, and $\\beta^{\\prime \\prime}$), while under uniaxial strain, a $\\gamma$ hole pocket with $d_{z^2}$ orbital character emerges. RPA calculations reveal that the leading spin response shifts from $\\mathbf{q}\\approx(2\\pi/3,2\\pi/3)$ at ambient pressure to $\\mathbf{q}\\approx(\\pi,\\pi)$ under both strain conditions and is enhanced under $c$-axis compression. These results suggest that $c$-axis compression may provide a favorable route to superconductivity in the quadlayer nickelate analogous to that in bilayer and trilayer nickelates.", "url": "https://arxiv.org/abs/2610.00489", "type": "理论+数值", "summary": "Ruddlesden-Popper (RP) 镍酸盐中压力诱导超导性的发现激发了人们对高 T$_c$ 超导体的广泛兴趣。在这里，我们使用密度泛函理论（DFT）和随机相位近似（RPA）计算系统地研究了四层RP镍酸盐La$_5$Ni$_4$O$_{13}$在环境压力、5%各向同性压缩应变和4%$c$轴单轴应变下的电子特性。 DFT 计算表明，各向同性应变拓宽了 Ni-$e_g$ 能带，并诱导电荷从 O-$p$ 转移到 Ni-$d$ 轨道，而 $c$ 轴单轴应变选择性地将 $d_{z^2}$ 衍生的 bond1 能带向上移动，同时使 $d_{x^2-y^2}$ 色散几乎保持不变。从 Wannier 向下折叠，我们构建了一个四层双轨道模型，可以重现低能 Ni-$e_g$ 能带。我们的模型表明，在环境压力和 5% 各向同性应变下，费米表面由两个电子袋（$\\alpha$ 和 $\\delta$）和三个空穴袋（$\\beta$、$\\beta^{\\prime}$ 和 $\\beta^{\\prime \\prime}$）组成，而在单轴应变下，出现具有 $d_{z^2}$ 轨道特征的 $\\gamma$ 空穴袋。\n\nRPA 计算表明，主导自旋响应从环境压力下的 $\\mathbf{q}\\approx(2\\pi/3,2\\pi/3)$ 转移到两种应变条件下的 $\\mathbf{q}\\approx(\\pi,\\pi)$，并在 $c$ 轴压缩下增强。这些结果表明，$c$ 轴压缩可能为四层镍酸盐中的超导性提供有利的途径，类似于双层和三层镍酸盐中的超导性。", "authors": [{"name": "Jian-Xiang Sun"}, {"name": "Haokan Xiao"}, {"name": "Cui-Qun Chen"}, {"name": "Dao-Xin Yao"}], "featured_authors": [{"name": "Jian-Xiang Sun"}, {"name": "Haokan Xiao"}, {"name": "Cui-Qun Chen"}, {"name": "Dao-Xin Yao"}], "author_count": 4}, {"id": "2610.00496", "category": "cond-mat", "title": "Orbital angular momentum in crystalline solids: non-equilibrium theory", "abstract": "We develop a general operator theory of orbital angular momentum (OAM) in periodic solids that applies equally to equilibrium and coherently driven states. Employing the crystal momentum representation of Adams and Blount, we construct a periodic-solid OAM operator exactly corresponding to the symmetrized $\\hat{\\mathbf r}\\times\\hat{\\mathbf v}$ observable, and show that it separates into local circulation (LC) and itinerant circulation (IC) sectors that are Hermitian and $U(1)$, and more generally $U(N)$, gauge covariant. In equilibrium, the LC and IC sectors reduce to the established modern theory of orbital magnetism; out of equilibrium, the same operator structure exposes new contributions generated by laser-written momentum-space textures and interband coherence. Applied to gapped graphene, we uncover a rich phenomenology of ultrafast non-equilibrium orbital angular momentum, including a quasi-stationary light-induced OAM. This latter finding, underpinned by a close connection between band-manifold phase texture and nonequilibrium OAM, points towards new possibilities for light control over OAM in solids as well as a potentially rich role for topological band structures in designed OAM materials.", "url": "https://arxiv.org/abs/2610.00496", "type": "理论", "summary": "我们开发了周期性固体中轨道角动量（OAM）的一般算子理论，该理论同样适用于平衡态和相干驱动态。利用 Adams 和 Blount 的晶体动量表示，我们构造了一个与对称 $\\hat{\\mathbf r}\\times\\hat{\\mathbf v}$ 可观测量完全对应的周期固体 OAM 算子，并表明它分为局部环流 (LC) 和流动环流 (IC) 扇区，它们是埃尔米特扇区和 $U(1)$，更一般的是 $U(N)$，规范协变扇区。在平衡状态下，LC 和 IC 部分简化为已建立的现代轨道磁性理论；失去平衡时，相同的算子结构揭示了激光写入动量空间纹理和带间相干性产生的新贡献。应用于有隙石墨烯，我们发现了超快非平衡轨道角动量的丰富现象，包括准稳态光诱导的 OAM。\n\n后一个发现以能带流形相结构与非平衡 OAM 之间的密切联系为基础，指出了固体中 OAM 光控制的新可能性，以及拓扑能带结构在设计的 OAM 材料中潜在的丰富作用。", "authors": [{"name": "Sangeeta Sharma"}, {"name": "Peter Elliott"}, {"name": "Samuel Shallcross"}], "featured_authors": [{"name": "Sangeeta Sharma"}, {"name": "Peter Elliott"}, {"name": "Samuel Shallcross"}], "author_count": 3}, {"id": "2610.00585", "category": "cond-mat", "title": "Reference-free certification of machine-learning interatomic potentials", "abstract": "Universal machine-learning interatomic potentials now reach held-out energy and force errors so small that they no longer predict how a model behaves in simulation. Here we show that a potential can be graded without any reference calculation, against properties the exact Born-Oppenheimer surface satisfies by mathematical or physical necessity. We organise these properties into four families, symmetry and invariance, self-consistency and integrability, statistical-mechanical equilibrium and regularity, and turn them into fourteen inexpensive probes, each certifying against a target that is exact and independent of chemistry and reference method. Every probe therefore returns an absolute, architecture-comparable score from the energies, forces and stresses a potential already exposes, and reveals failures a fixed test set cannot. Applied to 64 pretrained potentials, the suite resolves two orders of magnitude of certified quality at comparable reported accuracy, and flags a fine-tuned potential whose reference errors improve while its surface degrades until molecular dynamics fails. An interactive leaderboard of all 64 models is available at this https URL .", "url": "https://arxiv.org/abs/2610.00585", "type": "理论+数值", "summary": "通用机器学习原子间势现在达到了非常小的保留能量和力误差，以至于它们不再预测模型在模拟中的行为。在这里，我们表明，可以根据数学或物理必要性精确的玻恩-奥本海默曲面满足的属性，在没有任何参考计算的情况下对势进行分级。我们将这些性质分为四个系列：对称性和不变性、自洽性和可积性、统计力学平衡和规律性，并将它们变成十四个廉价的探针，每个探针都针对一个精确且独立于化学和参考方法的目标进行认证。因此，每个探测器都会从潜在已经暴露的能量、力和应力中返回一个绝对的、与架构可比的分数，并揭示固定测试集​​无法揭示的故障。该套件应用于 64 个预训练电位，以可比的报告精度解析了两个数量级的认证质量，并标记了一个微调电位，其参考误差得到改善，而其表面退化，直到分子动力学失效。在此 https URL 上可以找到所有 64 个模型的交互式排行榜。", "authors": [{"name": "Jonas Hänseroth"}, {"name": "Christian Dreßler"}], "featured_authors": [{"name": "Jonas Hänseroth"}, {"name": "Christian Dreßler"}], "author_count": 2}, {"id": "2610.00624", "category": "cond-mat", "title": "The Ericson Transition in Time-Reversal Invariant Systems: Symplectically Invariant Hamiltonians", "abstract": "We investigate the distributions of off-diagonal scattering matrix elements and cross-sections in the Ericson regime for time-reversal invariant systems with odd spin. Within the universal Heidelberg approach we prove that Gaussian and exponential behavior is found as the leading-order term of an asymptotic expansion of the aforementioned distributions. Furthermore, the subleading-order term is derived and compared with numerical simulations.", "url": "https://arxiv.org/abs/2610.00624", "type": "理论+数值", "summary": "我们研究了具有奇自旋的时间反演不变系统的 Ericson 体系中非对角散射矩阵元素和横截面的分布。在通用海德堡方法中，我们证明高斯和指数行为被发现是上述分布的渐近展开的首项。此外，还推导了次导阶项并与数值模拟进行了比较。", "authors": [{"name": "Simon Köhnes"}, {"name": "Thomas Guhr"}], "featured_authors": [{"name": "Simon Köhnes"}, {"name": "Thomas Guhr"}], "author_count": 2}, {"id": "2610.00631", "category": "cond-mat", "title": "CTMRG as a tensor-network message-passing algorithm", "abstract": "We formulate the corner transfer matrix equations, and the corner transfer matrix renormalization group built on them, as a set of local equations on general planar graphs. These equations depend only on the local subgraphs of the planar graph and are glued together consistently to describe the whole graph. Solving them yields message tensors and corner matrices, which can be used to construct an MPS environment for any connected subgraph. We test the proposed equations on the ferromagnetic Ising model, on a variety of infinite lattices (including hyperbolic ones) and on finite graphs, and find systematic improvement over belief propagation.", "url": "https://arxiv.org/abs/2610.00631", "type": "理论+数值", "summary": "我们将角传递矩阵方程和基于它们的角传递矩阵重整化群表示为一般平面图上的一组局部方程。这些方程仅取决于平面图的局部子图，并且一致地粘合在一起以描述整个图。求解它们会产生消息张量和角矩阵，可用于为任何连通子图构建 MPS 环境。我们在铁磁伊辛模型、各种无限晶格（包括双曲晶格）和有限图上测试了所提出的方程，并发现了对置信传播的系统改进。", "authors": [{"name": "Illia Lukin"}, {"name": "Andrii Sotnikov"}], "featured_authors": [{"name": "Illia Lukin"}, {"name": "Andrii Sotnikov"}], "author_count": 2}, {"id": "2610.00655", "category": "cond-mat", "title": "Fatigue failure in two-dimensional glasses under cyclic shear deformation", "abstract": "We investigate fatigue failure in two-dimensional (2D) model glasses under cyclic shear deformation using atomistic simulations. We find that the number of cycles to failure diverges as a power law as the strain amplitude approaches the fatigue limit, with an exponent close to $-1$, in contrast to the exponent of $-2$ reported in three dimensions (3D). A failure exponent of $-1$ has also recently been observed in a 2D elastoplastic model, suggesting an interesting dependence on spatial dimensionality that needs to be rationalized. Measures of accumulated plastic activity, including dissipated work and non-affine displacements, exhibit scaling with the failure time that is consistent with results in 3D, and indicate a robust connection between damage accumulation and failure. To probe the origins of the variability of failure times, we perform isoconfigurational {\\it seeded} simulations in which a localized soft region is introduced. While such seeding constrains the spatial location of failure, the distribution of failure times remains broad. These findings extend recent results in 3D concerning fatigue failure times to 2D glasses, including their relation to accumulated plasticity and apparent stochasticity, while also revealing a key difference, namely the exponent describing the divergence of the failure times.", "url": "https://arxiv.org/abs/2610.00655", "type": "理论+数值", "summary": "我们使用原子模拟研究循环剪切变形下二维 (2D) 模型玻璃的疲劳失效。我们发现，当应变幅度接近疲劳极限时，失效周期数呈幂律分布，指数接近 $-1$，而在三维 (3D) 中报告的指数为 $-2$。最近在二维弹塑性模型中也观察到了 $-1$ 的失效指数，这表明对空间维度的有趣依赖需要合理化。累积塑性活动的测量（包括耗散功和非仿射位移）随失效时间的变化而变化，与 3D 结果一致，并表明损伤累积与失效之间存在牢固的联系。为了探究故障时间变异性的根源，我们进行了等配置模拟，其中引入了局部软区域。虽然这种播种限制了故障的空间位置，但故障时间的分布仍然很广泛。\n\n这些发现将最近关于疲劳失效时间的 3D 结果扩展到 2D 玻璃，包括它们与累积塑性和表观随机性的关系，同时还揭示了一个关键差异，即描述失效时间差异的指数。", "authors": [{"name": "Himangsu Bhaumik"}, {"name": "Srikanth Sastry"}], "featured_authors": [{"name": "Himangsu Bhaumik"}, {"name": "Srikanth Sastry"}], "author_count": 2}, {"id": "2610.00681", "category": "cond-mat", "title": "The half-filled optical Su-Schrieffer-Heeger-Hubbard model with uniaxial strain", "abstract": "Strain offers a direct route to control electronic phases by altering bond lengths, hopping amplitudes, and lattice symmetries. These aspects make electron-phonon (e-ph) coupled systems a natural setting to study strain-induced effects. The Su-Schrieffer-Heeger (SSH) Hamiltonian describes the coupling between itinerant electrons and lattice degrees of freedom that modulate hopping and is thus expected to be strongly affected by strain fields. At half-filling and on a bipartite lattice, the SSH interactions drive dominant bond-order-wave (BOW) correlations at low- temperature in which short bonds with high kinetic energy alternate with long bonds with low kinetic energy along four possible patterns. We model uniaxial strain through anisotropic hopping, which breaks the $90^\\circ$ rotational symmetry and reduces the BOW phase degeneracy to two. We also include an on-site Hubbard U that promotes antiferromagnetic correlations that are also (weakly) driven by the SSH interaction itself. We map out the half-filled phase diagram in the plane of the e-ph and Hubbard couplings, and determine the critical temperature of BOW formation. Using analytic continuation, we also evaluate the spectral function and demonstrate directionally dependent gap formation in the BOW phase", "url": "https://arxiv.org/abs/2610.00681", "type": "理论+数值", "summary": "应变提供了通过改变键长、跳跃幅度和晶格对称性来控制电子相位的直接途径。这些方面使电子声子 (e-ph) 耦合系统成为研究应变诱导效应的自然环境。 Su-Schrieffer-Heeger (SSH) 哈密顿量描述了流动电子与调制跳跃的晶格自由度之间的耦合，因此预计会受到应变场的强烈影响。在半填充和二分晶格上，SSH 相互作用在低温下驱动主要的键序波（BOW）相关性，其中高动能的短键与低动能的长键沿着四种可能的模式交替。我们通过各向异性跳跃对单轴应变进行建模，这打破了 $90^\\circ$ 旋转对称性并将 BOW 相简并度降低到二。我们还包括一个现场 Hubbard U，它促进反铁磁相关性，这些相关性也由 SSH 交互本身（弱）驱动。我们在 e-ph 和 Hubbard 耦合平面上绘制了半填充相图，并确定了 BOW 形成的临界温度。\n\n使用解析延拓，我们还评估了谱函数并证明了 BOW 相中方向相关的间隙形成", "authors": [{"name": "Jonah Huang"}, {"name": "James Neuhaus"}, {"name": "Benjamin Cohen-Stead"}, {"name": "Steven Johnston"}, {"name": "Richard Scalettar"}], "featured_authors": [{"name": "Jonah Huang"}, {"name": "James Neuhaus"}, {"name": "Benjamin Cohen-Stead"}, {"name": "Steven Johnston"}, {"name": "Richard Scalettar"}], "author_count": 5}, {"id": "2610.00768", "category": "cond-mat", "title": "Tunable Electron Quantum Optics in Graphene Slit Junctions", "abstract": "A graphene slit junction is investigated as a compact geometry for directional electron-beam formation, coherent interference, and symmetry-controlled spin filtering. Atomistic tight-binding calculations combined with the nonequilibrium Green's function formalism show that trigonal warping in monolayer graphene produces strongly directional electron beams near E~2.7eV. Boundary reflections redirect these beams toward a common drain, where the transmission exhibits magnetic flux-dependent oscillations consistent with an h/e Aharonov-Bohm period, whose modulation is characterized by Fourier analysis and harmonic fitting. A local electrostatic gate provides additional control of the interference phase. In separate self-consistent mean-field Hubbard calculations, the pristine antiferromagnetic ground state is shown to have spin-degenerate transmission, whereas structural or electrostatic breaking of the left-right symmetry enables spin filtering. Complementary valley-resolved calculations using a four-band continuum model demonstrate analogous beam formation in bilayer graphene at E = 50meV. The results identify the slit junction as a common geometry for electron-optical and spin-dependent transport and motivate further investigation of low-energy bilayer implementations.", "url": "https://arxiv.org/abs/2610.00768", "type": "理论+数值", "summary": "研究石墨烯狭缝结作为一种紧凑的几何结构，用于定向电子束形成、相干干涉和对称控制的自旋过滤。原子紧束缚计算结合非平衡格林函数形式表明单层石墨烯中的三角翘曲会产生E~2.7eV附近的强定向电子束。边界反射将这些光束重定向到公共漏极，其中传输表现出与 h/e 阿哈罗诺夫-玻姆周期一致的磁通量相关振荡，其调制通过傅里叶分析和谐波拟合来表征。局部静电门提供对干扰阶段的额外控制。在单独的自洽平均场哈伯德计算中，原始反铁磁基态被证明具有自旋简并传输，而左右对称性的结构或静电破坏使得自旋过滤成为可能。使用四能带连续谱模型的互补谷分辨计算证明了双层石墨烯在 E = 50meV 时的类似光束形成。\n\n结果表明，狭缝结是电子光学和自旋相关传输的常见几何形状，并激发了对低能双层实现的进一步研究。", "authors": [{"name": "Mohamed Amine Rhanbouri"}, {"name": "Wojciech Julian Pasek"}, {"name": "Abdelouahed El Fatimy"}], "featured_authors": [{"name": "Mohamed Amine Rhanbouri"}, {"name": "Wojciech Julian Pasek"}, {"name": "Abdelouahed El Fatimy"}], "author_count": 3}, {"id": "2610.00794", "category": "cond-mat", "title": "Long-Range Machine Learning Interatomic Potentials for Defect Energetics in SrTiO$_3$", "abstract": "Machine learning interatomic potentials (MLIPs) have advanced rapidly in recent years, yet the majority of models remain semilocal in nature and neglect long-range electrostatic interactions. A growing number of long-range models have emerged to address this limitation, but systematic benchmarks comparing their performance on physically realistic systems remain scarce. In this work, we assess three long-range MLIPs -- MACE-POLAR, MACE-LES, and LOREM, against a short-range baseline MACE model, on their ability to capture long-range Coulombic interactions, progressing from idealised synthetic point-charge systems to first-principles data on realistic crystal structures. This progression allows us to isolate model's capability to learn electrostatic interactions from the many competing energy contributions, such as dielectric screening and exchange-correlation, that are present in DFT total energies. As a physically motivated benchmark system, we focus on strontium titanate SrTiO$_3$ with Sr--O Schottky vacancy pairs, a material in which long-range charge interactions play a central role and which serves as a natural stepping stone towards the study of charged polarons and other electronic and optical properties. Building on this benchmark, we further examine oxygen vacancy migration in the presence of the Sr--O Schottky pair, using climbing-image nudged elastic band calculations and molecular dynamics to obtain activation barriers as a function of the vacancy pair separation, providing further extrapolation test of each model's ability to capture the electrostatic effects that govern defect transport.", "url": "https://arxiv.org/abs/2610.00794", "type": "理论+数值", "summary": "机器学习原子间势（MLIP）近年来发展迅速，但大多数模型本质上仍然是半局域的，并且忽略了长程静电相互作用。为了解决这一限制，出现了越来越多的远程模型，但比较它们在物理现实系统上的性能的系统基准仍然很少。在这项工作中，我们根据短程基线 MACE 模型评估了三种远程 MLIP——MACE-POLAR、MACE-LES 和 LOREM，评估它们捕获长程库仑相互作用的能力，从理想化的合成点电荷系统发展到现实晶体结构的第一原理数据。这一进展使我们能够将模型学习静电相互作用的能力与 DFT 总能量中存在的许多竞争能量贡献（例如介电屏蔽和交换相关）隔离开来。\n\n作为物理驱动的基准系统，我们重点关注具有 Sr--O 肖特基空位对的钛酸锶 SrTiO$_3$，这种材料中长程电荷相互作用发挥着核心作用，并且是研究带电极化子和其他电子和光学特性的天然垫脚石。在此基准的基础上，我们进一步检查了 Sr-O 肖特基对存在下的氧空位迁移，使用爬升图像微移弹性带计算和分子动力学来获得激活势垒作为空位对分离的函数，为每个模型捕获控制缺陷传输的静电效应的能力提供进一步的外推测试。", "authors": [{"name": "Yee Chit Wong"}, {"name": "Marcel F. Langer"}, {"name": "Reinhard J. Maurer"}, {"name": "Nicholas D. M. Hine"}], "featured_authors": [{"name": "Yee Chit Wong"}, {"name": "Marcel F. Langer"}, {"name": "Reinhard J. Maurer"}, {"name": "Nicholas D. M. Hine"}], "author_count": 4}, {"id": "2610.00826", "category": "cond-mat", "title": "Thermal entanglement transitions from strong $\\textrm{SU}(2)$ symmetry", "abstract": "We study mixed-state entanglement in Gibbs states with strong $\\mathrm{SU}(2)$ symmetry, focusing on locally interacting spin systems with ferromagnetic interactions. Our main result is to show that finite-temperature ordering transitions are associated with entanglement transitions, and therefore the steady state of strongly symmetric Lindbladians can exhibit entanglement transitions. While in the paramagnetic phase it is known that the distillable entanglement and logarithmic entanglement negativity between two halves of a large system grow logarithmically with the square root of the number of spins, we show that in ferromagnetic phases these quantities grow parametrically faster with system size. To arrive at this result we first establish relations between these mixed-state entanglement measures and spin correlations in states that are singlets under global $\\rm{SU}(2)$ symmetry transformations. We then introduce a semiclassical theory for $\\rm{SU}(2)$ singlet thermal states. While the global singlet constraint generally enters this theory as a complicated function of the full semiclassical spin configuration, we show that in large $S$ limit it simplifies drastically to a Gaussian suppression of total magnetization in disordered phases as well as in ordered phases in the vicinity of continuous thermal phase transitions. This leads us to a field theory describing spin correlations in the singlet sector. Using this we determine the behavior of various probes of mixed-state entanglement at low and at high temperatures, supporting our analytical results using numerical Monte Carlo simulations of a three-dimensional lattice realization of our semiclassical theory. We also use exact numerics in one-dimensional spin-$1/2$ systems to confirm our predictions for the scaling of mixed-state entanglement with correlation length and system size in the paramagnetic phase.", "url": "https://arxiv.org/abs/2610.00826", "type": "理论+数值", "summary": "我们研究具有强 $\\mathrm{SU}(2)$ 对称性的吉布斯态混合态纠缠，重点关注具有铁磁相互作用的局部相互作用的自旋系统。我们的主要结果是证明有限温度有序跃迁与纠缠跃迁相关，因此强对称 Lindbladians 的稳态可以表现出纠缠跃迁。虽然在顺磁相中，已知大系统两半之间的可蒸馏纠缠和对数纠缠负性随着自旋数量的平方根呈对数增长，但我们表明，在铁磁相中，这些量随着系统尺寸的变化而参数增长得更快。为了得到这个结果，我们首先在全局 $\\rm{SU}(2)$ 对称变换下建立这些混合态纠缠测量和单态自旋相关性之间的关系。然后我们引入 $\\rm{SU}(2)$ 单线态热态的半经典理论。\n\n虽然全局单重态约束通常作为完整半经典自旋构型的复杂函数进入该理论，但我们表明，在大$S$限制下，它大大简化为无序相以及连续热相变附近的有序相中总磁化强度的高斯抑制。这使我们得出描述单线态扇区中自旋相关性的场论。利用这一点，我们确定了混合态纠缠的各种探针在低温和高温下的行为，支持我们使用半经典理论的三维晶格实现的数值蒙特卡罗模拟的分析结果。我们还使用一维自旋 $1/2$ 系统中的精确数值来证实我们对顺磁相中混合态纠缠与相关长度和系统尺寸的缩放比例的预测。", "authors": [{"name": "Siqi Mo"}, {"name": "Ehud Altman"}, {"name": "Samuel J. Garratt"}], "featured_authors": [{"name": "Siqi Mo"}, {"name": "Ehud Altman"}, {"name": "Samuel J. Garratt"}], "author_count": 3}, {"id": "2610.00892", "category": "cond-mat", "title": "Polymer viscoelasticity from an orientational closure with implicit stretch", "abstract": "We propose a deviatoric-stress constitutive equation derived from orientational kinetics, while implicitly retaining contributions from conformational stretch. Starting from the dumbbell model, we show that conformational stretch affects orientational dynamics through an effective stress scale and rotational diffusivity, which determine an effective relaxation time. The orientation-based equation is derived by assuming an approximate relation between orientational anisotropy and the stretch state. Within the proposed framework, constant effective coefficients yield steady-oscillatory shear correspondences closely related to the empirical Cox-Merz and Gleissle-Osaki relations. For model-specific effective coefficients, the upper-convected Maxwell model is characterized by a constant relaxation time and an increasing modulus under steady shear, whereas finite extensibility with Peterlin preaveraging shortens the relaxation time and suppresses the modulus increase. With coefficients determined from steady-shear states, the proposed equation successfully reproduces stress responses under transient shear, large-amplitude oscillatory shear, and uniaxial extension. These results show that the effects of conformational stretch on orientational kinetics can be retained implicitly, providing a constitutive description based on a deviatoric-stress state reconstructable from standard rheometry and a physical interpretation of how stretch enters polymer viscoelasticity.", "url": "https://arxiv.org/abs/2610.00892", "type": "理论", "summary": "我们提出了一个从取向动力学导出的偏应力本构方程，同时隐式保留了构象拉伸的贡献。从哑铃模型开始，我们表明构象拉伸通过有效应力尺度和旋转扩散率影响取向动力学，这决定了有效松弛时间。基于取向的方程是通过假设取向各向异性和拉伸状态之间的近似关系而导出的。在所提出的框架内，恒定有效系数产生与经验 Cox-Merz 和 Gleissle-Osaki 关系密切相关的稳态振荡剪切对应关系。对于模型特定的有效系数，上对流麦克斯韦模型的特点是在稳定剪切下具有恒定的弛豫时间和不断增加的模量，而采用 Peterlin 预平均的有限可扩展性缩短了弛豫时间并抑制了模量的增加。利用从稳态剪切状态确定的系数，所提出的方程成功地再现了瞬态剪切、大振幅振荡剪切和单轴延伸下的应力响应。\n\n这些结果表明，构象拉伸对取向动力学的影响可以隐式保留，提供基于可从标准流变测量中重建的偏应力状态的本构描述以及拉伸如何进入聚合物粘弹性的物理解释。", "authors": [{"name": "Souta Miyamoto"}, {"name": "Takeshi Sato"}, {"name": "Wanxiang Jin"}, {"name": "Katsuaki Tanabe"}, {"name": "John J. Molina"}, {"name": "Takashi Taniguchi"}], "featured_authors": [{"name": "Souta Miyamoto"}, {"name": "Takeshi Sato"}, {"name": "Wanxiang Jin"}, {"name": "Katsuaki Tanabe"}, {"name": "John J. Molina"}, {"name": "Takashi Taniguchi"}], "author_count": 6}, {"id": "2610.00931", "category": "cond-mat", "title": "Nucleation and phase transition of spherical crystals and quasicrystals", "abstract": "We investigated the nucleation, growth, and solid-to-solid phase transition processes of spherical six-fold symmetric crystals (C6) and ten-fold symmetric quasicrystals (DQC) using the Lifshitz-Petrich model. By combining the spherical-harmonic pseudospectral method with a nullspace-preserving saddle-point search technique, we resolved the critical nucleus structures and phase transition pathways. Although both transitions from the homogeneous state to the ordered state involve the formation of localized critical nuclei, their subsequent growth processes exhibit distinct modes of accommodating geometric mismatch: C6 forms branched domain structures and persistent line defects associated with orientation and phase mismatches, whereas DQC relaxes collision-induced defects through local coordination rearrangements. The resolved DQC-to-C6 pathway proceeds through a series of metastable intermediates that progressively connect these distinct modes of mismatch accommodation. Its multi-step character reflects the coupled adjustment of local coordination and compatibility between the emerging C6 domains. These results reveal the intrinsic link between the multi-step nature of the phase transition and the distinct structural requirements for accommodating geometric mismatch.", "url": "https://arxiv.org/abs/2610.00931", "type": "理论+数值", "summary": "我们使用 Lifshitz-Petrich 模型研究了球形六重对称晶体 (C6) 和十重对称准晶体 (DQC) 的成核、生长和固相转变过程。通过将球谐赝谱方法与保留零空间的鞍点搜索技术相结合，我们解决了关键的核结构和相变路径。尽管从均质态到有序态的转变都涉及局部临界核的形成，但它们随后的生长过程表现出不同的适应几何失配的模式：C6形成分支域结构和与取向和相位失配相关的持续线缺陷，而DQC通过局部配位重排来缓解碰撞引起的缺陷。解析后的 DQC 至 C6 途径通过一系列亚稳态中间体进行，这些中间体逐渐连接这些不同的错配调节模式。其多步性体现了新兴C6域之间局部协调与兼容的耦合调整。\n\n这些结果揭示了相变的多步性质与适应几何失配的独特结构要求之间的内在联系。", "authors": [{"name": "Tiejun Zhou"}, {"name": "Aibei Xie"}, {"name": "Gang Cui"}, {"name": "Xianbo Huang"}, {"name": "Li Peng"}, {"name": "Kai Jiang"}], "featured_authors": [{"name": "Tiejun Zhou"}, {"name": "Aibei Xie"}, {"name": "Gang Cui"}, {"name": "Xianbo Huang"}, {"name": "Li Peng"}, {"name": "Kai Jiang"}], "author_count": 6}, {"id": "2610.00963", "category": "cond-mat", "title": "Topological robustness of thermally disordered lattices: From average structures to ensemble electronic properties", "abstract": "Band topology is usually assigned to a single crystal structure, yet at finite temperature a crystal is an ensemble of thermally disordered configurations with a fluctuating band gap. We ask whether the thermally averaged structure is a faithful proxy for this ensemble, taking Bi$_2$Se$_3$ as a representative topological insulator and classifying band ordering in each ab initio molecular dynamics snapshot by scaling the spin-orbit coupling. The averaged structure fails in two ways: it misses the Rashba-like spin splitting that instantaneous symmetry breaking produces in individual configurations, and it substantially underestimates the band-gap renormalization, whereas a small ensemble of harmonic Monte Carlo configurations reproduces both the mean and the spread of the gap. Using a band-inversion survival probability, we find that the band inversion of Bi$_2$Se$_3$ holds in every sampled configuration up to 600 K, above which individual configurations cross into normal band ordering well before the average gap closes. Topological robustness at finite temperature is thus a property of the distribution over configurations rather than of any single structure.", "url": "https://arxiv.org/abs/2610.00963", "type": "理论+数值", "summary": "能带拓扑通常分配给单晶体结构，但在有限温度下，晶体是具有波动带隙的热无序配置的集合。我们询问热平均结构是否是该系综的忠实代表，将 Bi$_2$Se$_3$ 作为代表性拓扑绝缘体，并通过缩放自旋轨道耦合对每个从头开始分子动力学快照中的能带排序进行分类。平均结构在两个方面失败了：它错过了瞬时对称破缺在各个配置中产生的类似 Rashba 的自旋分裂，并且它大大低估了带隙重正化，而谐波蒙特卡罗配置的小集合再现了带隙的平均值和扩展。使用能带反转生存概率，我们发现 Bi$_2$Se$_3$ 的能带反转在高达 600 K 的每个采样配置中都成立，高于该值，各个配置在平均间隙关闭之前就进入正常的能带排序。因此，有限温度下的拓扑鲁棒性是配置分布的属性，而不是任何单一结构的属性。", "authors": [{"name": "Oleg Rubel"}, {"name": "Karekin Sadikian"}], "featured_authors": [{"name": "Oleg Rubel"}, {"name": "Karekin Sadikian"}], "author_count": 2}, {"id": "2610.01011", "category": "cond-mat", "title": "Highly anisotropic collective modes of altermagnetic superconductors with Bogoliubov Fermi surfaces", "abstract": "We investigate collective modes in charge-neutral altermagnetic superconductors with $d$-wave spin-split bands, focusing on the impact of emergent Bogoliubov Fermi surfaces. In the absence of a magnetic field, the BCS state supports collective modes that inherit the underlying $d$-wave symmetry, resulting in pronounced momentum-space anisotropy. The broken time-reversal symmetry further couples these modes to spin-density fluctuations, allowing their signatures to emerge in the spin dynamical structure factor. Upon applying a magnetic field, Bogoliubov Fermi surfaces emerge and qualitatively reshape the collective-mode dynamics through gapless particle-hole excitations and strongly anisotropic Landau damping. The damping is strongest along the momentum-space diagonal, where it can suppress the low-energy phonon mode at small momenta. Remarkably, the suppressed phonon is accompanied by the emergence of an in-gap structure in the Higgs mode and an associated pronounced enhancement of the spin response. These results establish Bogoliubov Fermi surfaces as a mechanism for generating highly anisotropic collective-mode dynamics and identify spin response as a sensitive probe of in-gap Higgs excitations in altermagnetic superconductors.", "url": "https://arxiv.org/abs/2610.01011", "type": "理论", "summary": "我们研究了具有 $d$ 波自旋分裂带的电荷中性交变磁超导体中的集体模式，重点关注新兴的 Bogoliubov 费米面的影响。在没有磁场的情况下，BCS 状态支持继承底层 $d$ 波对称性的集体模式，从而导致明显的动量空间各向异性。打破的时间反转对称性进一步将这些模式与自旋密度涨落耦合起来，使它们的特征出现在自旋动力学结构因子中。施加磁场后，Bogoliubov 费米面就会出现，并通过无间隙粒子孔激发和强各向异性朗道阻尼定性地重塑集体模式动力学。沿动量空间对角线的阻尼最强，可以抑制小动量下的低能声子模式。值得注意的是，受抑制的声子伴随着希格斯模式中带隙内结构的出现以及相关的自旋响应的显着增强。\n\n这些结果确立了 Bogoliubov 费米面作为产生高度各向异性集体模式动力学的机制，并将自旋响应确定为交磁超导体中带隙内希格斯激发的敏感探针。", "authors": [{"name": "Huaisong Zhao"}, {"name": "Peng Zou"}, {"name": "Xia-Ji Liu"}, {"name": "Hui Hu"}], "featured_authors": [{"name": "Huaisong Zhao"}, {"name": "Peng Zou"}, {"name": "Xia-Ji Liu"}, {"name": "Hui Hu"}], "author_count": 4}, {"id": "2610.01051", "category": "cond-mat", "title": "Anisotropic medium-range order uncovers dynamic crossovers in glass-forming liquids", "abstract": "On cooling liquids towards their glass-transition temperature, the dramatic increase of their relaxation times is accompanied by changes in particle dynamics at two distinct temperatures: A high-T crossover, where particles become temporarily caged by their neighbors, and a low-T crossover, where the cage escape mechanism changes. While there is some evidence that the former is associated with a change in local particle arrangement, no structural modification has so far been detected across the low-T crossover, fueling scepticism about the relevance of structure for glassy dynamics. Here, we introduce a novel four-point correlation function which allows to determine a structural length scale characterizing cage anisotropy. Extensive molecular dynamics simulations reveal that this scale, as well as the mean structural length scale of the glass-former, extends into the medium range, i.e., significantly exceeds the particle size. Strikingly, the difference between these two scales - a measure of the degree of cage anisotropy - peaks at both crossover temperatures. We discuss how the presence of these peaks enables understanding the nature of the change in the microscopic transport mechanism at the two temperatures, thereby linking both dynamical crossovers to a single structural observable, the anisotropic medium-range order. This fundamental insight demonstrates that structure, extending well-beyond the local cage, is an essential ingredient for understanding the relaxation dynamics of deeply supercooled liquids.", "url": "https://arxiv.org/abs/2610.01051", "type": "数值", "summary": "当将液体冷却至玻璃化转变温度时，弛豫时间的急剧增加伴随着两种不同温度下粒子动力学的变化：高 T 交叉，其中粒子暂时被邻近的笼子包围；以及低 T 交叉，其中笼逃逸机制发生变化。虽然有一些证据表明前者与局部粒子排列的变化有关，但迄今为止在低 T 交叉中尚未检测到结构改变，这加剧了人们对结构与玻璃态动力学相关性的怀疑。在这里，我们引入了一种新颖的四点相关函数，它可以确定表征笼各向异性的结构长度尺度。广泛的分子动力学模拟表明，该尺度以及玻璃形成体的平均结构长度尺度延伸到中等范围，即显着超过颗粒尺寸。引人注目的是，这两个尺度之间的差异（笼各向异性程度的度量）在两个交叉温度处达到峰值。\n\n我们讨论这些峰的存在如何能够理解两个温度下微观输运机制变化的本质，从而将两个动态交叉与单个结构可观察的各向异性中程有序联系起来。这一基本见解表明，远远超出局部笼的结构是理解深度过冷液体的弛豫动力学的重要组成部分。", "authors": [{"name": "Kamlesh Mishra"}, {"name": "Rajesh Ganapathy"}, {"name": "Walter Kob"}], "featured_authors": [{"name": "Kamlesh Mishra"}, {"name": "Rajesh Ganapathy"}, {"name": "Walter Kob"}], "author_count": 3}, {"id": "2610.01070", "category": "cond-mat", "title": "Topo-Spectral Percolation Descriptors for Mechanistic Ion Transport Pathways from Static Crystal Structures", "abstract": "Ion transport controls the macroscopic performance of solid electrolytes, battery electrodes, ion-selective membranes, electrolysis ceramics, mixed conductors, porous sorbents, and biological channels. In each case, ion transport is determined by structural characteristics, namely the available diffusion pathways and the specific bottleneck atoms that limit the ionic jumps. These are intrinsic properties of the crystalline framework, whereas temperature, carrier concentration, and correlated motion govern the transport rate. Ab initio molecular dynamics (AIMD) resolves the mechanism directly but is too costly for materials screening, and most surrogate models give only a single transport number. Here we present a calibration-free method for determining the mechanism, based on Topo-Spectral Percolation Descriptors (TSPD). TSPD obtains the transport mechanism from a single static structure in seconds. It constructs a periodic migration network whose edge barriers are computed from physics-based energetics. We then analyze the barrier-threshold topology of this network and the spectrum of its barrier-weighted graph Laplacian. To establish its validity for computational solid-state ionics, we test TSPD against AIMD ion densities and neutron diffraction data for eight materials, including cathodes and solid electrolytes, whose transport ranges from one- to three-dimensional. TSPD reproduces the established mechanism in every case and correctly identifies structures in which geometric openness does not imply viable ion percolation. The method is most informative for pathway-limited, direction-dependent transport, and it complements full dynamical simulations for strongly cooperative or nearly isotropic transport.", "url": "https://arxiv.org/abs/2610.01070", "type": "理论+数值", "summary": "离子输运控制着固体电解质、电池电极、离子选择性膜、电解陶瓷、混合导体、多孔吸附剂和生物通道的宏观性能。在每种情况下，离子传输由结构特征决定，即可用的扩散路径和限制离子跳跃的特定瓶颈原子。这些是晶体框架的固有特性，而温度、载流子浓度和相关运动控制着传输速率。从头算分子动力学（AIMD）直接解决了该机制，但对于材料筛选来说成本太高，并且大多数替代模型仅给出单个传输数。在这里，我们提出了一种基于拓扑谱渗流描述符（TSPD）的免校准方法来确定机制。 TSPD 在几秒钟内从单个静态结构中获取传输机制。它构建了一个周期性迁移网络，其边缘障碍是根据基于物理的能量学计算的。然后，我们分析该网络的障碍阈值拓扑及其障碍加权图拉普拉斯的频谱。\n\n为了确定其在计算固态离子学中的有效性，我们根据 AIMD 离子密度和八种材料的中子衍射数据测试了 TSPD，其中包括阴极和固体电解质，其输运范围从一维到三维。 TSPD 在每种情况下都重现了已建立的机制，并正确识别了几何开放性并不意味着可行的离子渗透的结构。该方法对于路径限制、方向依赖的运输来说信息量最大，并且它补充了强合作或近各向同性运输的完整动态模拟。", "authors": [{"name": "Diptendu Roy"}, {"name": "Chiku Parida"}, {"name": "Juan María García-Lastra"}, {"name": "Arghya Bhowmik"}], "featured_authors": [{"name": "Diptendu Roy"}, {"name": "Chiku Parida"}, {"name": "Juan María García-Lastra"}, {"name": "Arghya Bhowmik"}], "author_count": 4}, {"id": "2610.01089", "category": "cond-mat", "title": "Charge and spin dynamics in spintronic THz emitters from Time-Dependent Density Functional Theory", "abstract": "Spintronic terahertz (THz) emitters based on ferromagnet/heavy-metal heterostructures provide efficient broadband sources of THz radiation, yet the microscopic relation between ultrafast spin transport and charge redistribution remains incompletely understood. Here, we employ time-dependent density functional theory to resolve the coupled charge, spin, and magnetization dynamics of Co/Pt and Co/W bilayers in real time and space. Despite qualitatively similar interlayer spin-current dynamics, the two heterostructures exhibit markedly different interlayer charge transfer: Co/Pt shows a relatively small and partially reversed transfer from Pt to Co, whereas Co/W exhibits a larger and persistent transfer from Co to W. We trace these differences to the material-dependent ground-state electronic structure and the spin- and orbital-resolved phase space accessible to photoexcited carriers. Spin-resolved dynamics further reveal coexisting spin-orbit-mediated redistribution and optically induced intersite spin transfer, including a delayed minority-spin transfer from the heavy metal to Co common to both systems. While net electronic spin angular momentum is transferred between the layers, we find no corresponding net transfer of electronic orbital angular momentum. In Co/W, the persistent redistribution of electronic density from interstitial to atom-centered states additionally provides strong evidence for light-induced electronic localization. These results demonstrate that ultrafast spin transport does not uniquely determine charge or angular-momentum redistribution in spintronic THz emitters, which instead depends critically on the material-specific electronic phase space.", "url": "https://arxiv.org/abs/2610.01089", "type": "理论+数值", "summary": "基于铁磁体/重金属异质结构的自旋电子太赫兹（THz）发射器提供了高效的宽带太赫兹辐射源，但超快自旋输运和电荷重新分布之间的微观关系仍未完全了解。在这里，我们采用瞬态密度泛函理论来实时和空间地解析 Co/Pt 和 Co/W 双层的耦合电荷、自旋和磁化动力学。尽管层间自旋电流动力学性质相似，但这两种异质结构表现出明显不同的层间电荷转移：Co/Pt 显示出从 Pt 到 Co 的相对较小且部分反向的转移，而 Co/W 表现出从 Co 到 W 的较大且持续的转移。我们将这些差异追溯到材料相关的基态电子结构以及光激发载流子可访问的自旋和轨道分辨相空间。自旋分辨动力学进一步揭示了共存的自旋轨道介导的重新分布和光诱导位点间自旋转移，包括两个系统共有的从重金属到Co的延迟少数自旋转移。\n\n虽然净电子自旋角动量在层之间转移，但我们没有发现相应的电子轨道角动量净转移。在Co/W中，电子密度从间隙态到原子中心态的持续重新分布还为光诱导电子局域化提供了强有力的证据。这些结果表明，超快自旋输运并不能唯一地决定自旋电子太赫兹发射器中的电荷或角动量重新分布，而是关键取决于材料特定的电子相空间。", "authors": [{"name": "Ali Kefayati"}], "featured_authors": [{"name": "Ali Kefayati"}], "author_count": 1}, {"id": "2610.01090", "category": "cond-mat", "title": "Effects of on-site Gaussian disorder in the ferromagnetic Blume Capel model", "abstract": "We conduct a numerical study of a generalization of the Blume-Capel model in which the crystal field $D_i$, which controls the local vacancy density, is site dependent rather than uniform. We employ Markov Chain Monte Carlo to compute the shifted phase transition line $T_c$ as a function of the width $\\sigma$ of a gaussian distribution $P(D_i) \\sim \\exp( -(D_i - \\bar{D})^2/2 \\sigma^2)$ at fixed $\\bar{D}$. We characterize how the presence of this on-site Gaussian disorder reduces $T_c$ across the second order transition line, and discuss how our results suggest that $T_c$ remains finite even at large values of $\\sigma$. We also determine the effects of disorder on the tricritical point of the conventional, uniform, Blume-Capel model, finding that it significantly suppresses the first-order phase transition, eliminating it entirely at large values of $\\sigma$.", "url": "https://arxiv.org/abs/2610.01090", "type": "理论+数值", "summary": "我们对 Blume-Capel 模型的推广进行了数值研究，其中控制局部空位密度的晶体场 $D_i$ 是位置相关的而不是均匀的。我们采用马尔可夫链蒙特卡罗来计算平移相变线 $T_c$ 作为固定 $\\bar{D}$ 处高斯分布 $P(D_i) \\sim \\exp( -(D_i - \\bar{D})^2/2 \\sigma^2)$ 宽度 $\\sigma$ 的函数。我们描述了这种现场高斯无序的存在如何减少二阶过渡线上的 $T_c$，并讨论我们的结果如何表明即使在 $\\sigma$ 值较大时 $T_c$ 仍然有限。我们还确定了无序对传统均匀 Blume-Capel 模型三临界点的影响，发现它显着抑制了一阶相变，在 $\\sigma$ 大值时完全消除它。", "authors": [{"name": "Kimberly J. Silverman"}, {"name": "Daria Lhommedieu"}, {"name": "Alykhan Rajan"}, {"name": "Kathryn A. Cooper"}, {"name": "Richard T. Scalettar"}, {"name": "Eduardo Ibarra-García-Padilla"}], "featured_authors": [{"name": "Kimberly J. Silverman"}, {"name": "Daria Lhommedieu"}, {"name": "Alykhan Rajan"}, {"name": "Kathryn A. Cooper"}, {"name": "Richard T. Scalettar"}, {"name": "Eduardo Ibarra-García-Padilla"}], "author_count": 6}, {"id": "2610.01164", "category": "cond-mat", "title": "Nutational Spin Pumping and Dissipation", "abstract": "At terahertz drive frequencies, magnetization dynamics enter an inertial regime beyond the scope of standard Landau-Lifshitz-Gilbert (LLG) theory. We reveal a nutational damping torque comprising a bulk term and an interfacial contribution that describes spin emission into adjacent metals. The interfacial term generates nutational spin pumping: a dc spin current that scales quadratically with the drive frequency. Using a scattering approach, we relate this effect to microscopic material parameters and predict pronounced enhancements in ultrathin films and low-Fermi-energy conductors. Nutational spin pumping can be detected directly via the inverse spin Hall effect or indirectly via thickness-dependent renormalization of nutational damping.", "url": "https://arxiv.org/abs/2610.01164", "type": "理论", "summary": "在太赫兹驱动频率下，磁化动力学进入超出标准 Landau-Lifshitz-Gilbert (LLG) 理论范围的惯性状态。我们揭示了章动阻尼扭矩，包括体项和描述相邻金属的自旋发射的界面贡献。界面项产生章动自旋泵浦：与驱动频率成二次方关系的直流自旋电流。使用散射方法，我们将这种效应与微观材料参数联系起来，并预测超薄膜和低费米能导体的显着增强。章动自旋泵浦可以通过逆自旋霍尔效应直接检测，或者通过章动阻尼的厚度相关重正化间接检测。", "authors": [{"name": "Hans Gløckner Giil"}, {"name": "Arne Brataas"}], "featured_authors": [{"name": "Hans Gløckner Giil"}, {"name": "Arne Brataas"}], "author_count": 2}, {"id": "2610.01176", "category": "cond-mat", "title": "Dynamical Critical Properties of the Random-Bond three-state Potts Model", "abstract": "We study the dynamic critical behavior of the two-dimensional random-bond three-state Potts model using large-scale Monte Carlo simulations with the Wolff and Swendsen--Wang cluster algorithms. At the disorder-dependent critical temperature, we compute integrated and exponential autocorrelation times and extract the dynamic critical exponent $z$ via finite-size scaling. Critical slowing down is significantly weakened by bond randomness, with the dynamic exponent decreasing from $z \\approx 0.54$ in the pure system to $z \\approx 0.24$ at strong disorder. From the finite-size scaling of the Wolff cluster size, we obtain $\\gamma/\\nu \\approx 1.73$, where $\\gamma$ and $\\nu$ are the susceptibility and correlation-length exponents, respectively, consistent with the universality class of the two-dimensional three-state Potts model. These results indicate that bond randomness strongly affects the critical dynamics but leaves the underlying static universality class unchanged. Furthermore, both static and dynamic observables, including the specific heat and the autocorrelation times, show a lack of self-averaging.", "url": "https://arxiv.org/abs/2610.01176", "type": "理论+数值", "summary": "我们使用 Wolff 和 Swendsen--Wang 聚类算法进行大规模蒙特卡罗模拟，研究了二维随机键三态 Potts 模型的动态临界行为。在与无序相关的临界温度下，我们计算积分自相关时间和指数自相关时间，并通过有限尺寸缩放提取动态临界指数 $z$。键随机性显着削弱了临界减速，动态指数从纯系统中的 $z \\approx 0.54$ 降低到强无序状态下的 $z \\approx 0.24$。从 Wolff 簇大小的有限尺寸缩放中，我们得到 $\\gamma/\\nu \\approx 1.73$，其中 $\\gamma$ 和 $\\nu$ 分别是敏感性和相关长度指数，与二维三态 Potts 模型的普遍性类别一致。这些结果表明，键随机性强烈影响临界动态，但使潜在的静态普遍性类别保持不变。此外，静态和动态可观测值（包括比热和自相关时间）都显示出缺乏自平均。", "authors": [{"name": "Zeynep Demir Vatansever"}, {"name": "Ulvi Kanbur"}, {"name": "Mohammed Sadra Najafi"}, {"name": "Muktish Acharyya"}, {"name": "Erol Vatansever"}], "featured_authors": [{"name": "Zeynep Demir Vatansever"}, {"name": "Ulvi Kanbur"}, {"name": "Mohammed Sadra Najafi"}, {"name": "Muktish Acharyya"}, {"name": "Erol Vatansever"}], "author_count": 5}, {"id": "2610.01183", "category": "cond-mat", "title": "Additive solid immersion lenses for enhanced collection efficiency of shallow NV centers by pulsed laser deposition and structurization of high-k amorphous oxides", "abstract": "The negatively charged nitrogen-vacancy ($\\mathrm{NV}^-$) defect in diamond can be used for quantum information processing via the readout of the radiative decay of the excited state into the ground state. The large refractive index mismatch of diamond and air causes low photon extraction efficiency due to total internal reflection losses. Here, we investigate the photon extraction numerically and report additive solid immersion lenses (SILs) consisting of the high-k dielectric yttria-stabilized-zirconia (YSZ) for surface modification and enhanced light extraction of shallow implanted nitrogen-vacancy centers. We demonstrate an average increase of 63% in saturation intensity using a scalable bottum up room temperature pulsed laser deposition and photolithography structurization process. The average necessary laser intensity for saturation is reduced by 33% by the SILs.", "url": "https://arxiv.org/abs/2610.01183", "type": "数值", "summary": "金刚石中带负电的氮空位 ($\\mathrm{NV}^-$) 缺陷可通过读出激发态到基态的辐射衰变来进行量子信息处理。金刚石和空气的折射率失配较大，由于全内反射损耗，导致光子提取效率低。在这里，我们对光子提取进行了数值研究，并报告了由高 k 电介质氧化钇稳定氧化锆 (YSZ) 组成的附加固体浸没透镜 (SIL)，用于表面改性和增强浅注入氮空位中心的光提取。我们证明，使用可扩展的自下而上室温脉冲激光沉积和光刻结构化工艺，饱和强度平均增加 63%。 SIL 使饱和所需的平均激光强度降低了 33%。", "authors": [{"name": "Michael S. Bar"}, {"name": "Nicole Raatz"}, {"name": "Max Kneiss"}, {"name": "Andreas Koenig"}, {"name": "Marius Grundmann"}, {"name": "Holger von Wenckstern"}], "featured_authors": [{"name": "Michael S. Bar"}, {"name": "Nicole Raatz"}, {"name": "Max Kneiss"}, {"name": "Andreas Koenig"}, {"name": "Marius Grundmann"}, {"name": "Holger von Wenckstern"}], "author_count": 6}, {"id": "2610.01217", "category": "cond-mat", "title": "Composite fermions in ideal Chern bands", "abstract": "The composite-fermion framework maps the strongly correlated fractional quantum Hall state onto a weakly interacting integer quantum Hall state in a reduced effective magnetic field. We ask how this framework is modified for fractional Chern insulators, where the role of a uniform magnetic field is replaced by the nonuniform Berry curvature of a Chern band. Specifically, we construct composite-fermion wave functions for Jain states and their quasiparticles and quasiholes in Aharonov-Casher bands, a widely used model for ideal Chern bands. We find that these states overlap closely with exact eigenstates over a broad range of field modulation. Using these wave functions, we demonstrate that the emergent composite-fermion band structure goes beyond the conventional picture of effective Landau levels, correctly capturing the quasiparticle dispersion. Remarkably, we find that an isolated quasiparticle band carries a total Berry flux that is different from a Landau level. These results establish a composite-fermion description for mobile fractional Chern insulator anyons and provide a framework to understand their stability.", "url": "https://arxiv.org/abs/2610.01217", "type": "理论", "summary": "复合费米子框架将强相关的分数量子霍尔态映射到减小的有效磁场中的弱相互作用的整数量子霍尔态。我们询问如何针对分数陈绝缘体修改该框架，其中均匀磁场的作用被陈带的不均匀贝里曲率取代。具体来说，我们为 Jain 态及其在 Aharonov-Casher 能带中的准粒子和准空穴构造了复合费米子波函数，Aharonov-Casher 能带是理想陈能带的广泛使用的模型。我们发现这些状态在广泛的场调制范围内与精确的本征态紧密重叠。利用这些波函数，我们证明了新出现的复合费米子能带结构超越了有效朗道能级的传统图像，正确地捕获了准粒子色散。值得注意的是，我们发现孤立的准粒子带携带的总贝里通量不同于朗道能级。这些结果建立了移动分数陈绝缘体任意子的复合费米子描述，并提供了理解其稳定性的框架。", "authors": [{"name": "Songyang Pu"}, {"name": "Liangtao Peng"}, {"name": "Shaffique Adam"}], "featured_authors": [{"name": "Songyang Pu"}, {"name": "Liangtao Peng"}, {"name": "Shaffique Adam"}], "author_count": 3}, {"id": "2610.01281", "category": "cond-mat", "title": "Inclined surfaces bias bacterial swarming expansion and edge organization", "abstract": "Bacterial swarming is the collective expansion of dense populations of motile cells across hydrated soft surfaces, yet gravity is usually treated as a fixed background condition in standard horizontal assays. We used surface inclination to examine how agar-surface orientation relative to gravity affects the expansion of Enterobacter sp. SM3 swarms. Colony expansion depended non-monotonically on inclination, with the strongest spreading at intermediate inclinations and weaker expansion under shallow or near-inverted conditions. Paired up-facing acute and down-facing obtuse configurations with the same tilt magnitude showed different expansion responses, suggesting that swarm expansion depended on both tilt magnitude and which side of the agar surface faced upward relative to gravity. Inclination also produced downhill-biased colony morphologies. PIV analysis showed generally lower mean activity under inclination than in the flat references, with a non-monotonic angular response and inward increases in speed and spatial velocity-correlation length. The downhill tip showed slower motion, shorter spatial correlations and smaller vortex cores than the upper region. To interpret the macroscopic trends, we extended a two-phase thin-film model by introducing an effective gravity coupling projected normal and tangential to the agar surface. Simulations suggest that the surface-tangential component mainly drives lateral redistribution, whereas the surface-normal component modifies film pressure and thereby pressure-dependent water replenishment, helping distinguish up-facing from down-facing configurations.", "url": "https://arxiv.org/abs/2610.01281", "type": "理论+数值", "summary": "细菌群聚是密集的运动细胞群在水合柔软表面上的集体扩张，但在标准水平测定中，重力通常被视为固定的背景条件。我们使用表面倾斜度来检查琼脂表面相对于重力的方向如何影响肠杆菌属的扩张。 SM3蜂拥而至。菌落扩张非单调地依赖于倾斜度，在中等倾斜度下扩张最强，而在浅层或接近倒置的条件下扩张较弱。具有相同倾斜幅度的成对的朝上的锐角和朝下的钝角配置显示出不同的扩张响应，表明群体扩张取决于倾斜幅度以及琼脂表面的哪一侧相对于重力朝上。倾斜度也产生了偏向下坡的菌落形态。 PIV 分析显示，倾斜下的平均活动通常低于平坦参考下的平均活动，具有非单调的角度响应以及速度和空间速度相关长度的向内增加。与上部区域相比，下坡尖端显示出运动更慢、空间相关性更短和涡核更小。\n\n为了解释宏观趋势，我们通过引入投影法向和切向于琼脂表面的有效重力耦合来扩展两相薄膜模型。模拟表明，表面切向分量主要驱动横向重新分布，而表面法线分量改变膜压力，从而改变压力相关的水补充，有助于区分向上和向下的配置。", "authors": [{"name": "Pengxi Gu"}, {"name": "Zixiang Lin"}, {"name": "Hui Ren"}, {"name": "Jin Zhu"}, {"name": "Anqi Li"}, {"name": "Omar Said"}, {"name": "Weijie Chen"}, {"name": "Zijie Qu"}], "featured_authors": [{"name": "Pengxi Gu"}, {"name": "Zixiang Lin"}, {"name": "Hui Ren"}, {"name": "Omar Said"}, {"name": "Weijie Chen"}, {"name": "Zijie Qu"}], "author_count": 8}, {"id": "2610.01287", "category": "cond-mat", "title": "Ideal gas of active particles in a box", "abstract": "Extending a fundamental concept of thermodynamics to the nonequilibrium realm of active matter, we derive an ideal gas law for a suspension of noninteracting active particles confined to a finite rectangular box. The law is exact for run-and-tumble particles (RTPs) in one dimension and established by a systematic analytical expansion of the steady-state probability density for active Ornstein-Uhlenbeck particles in any dimension. It also agrees well with numerical results for active Brownian particles and RTPs in higher dimensions and recovers previously known relations for the limit of large system sizes. Together, these results demonstrate the applicability of the ideal active gas law to the three most widely studied theoretical models of colloidal active matter. As an application, we analyze thermodynamic processes involving active matter on a macroscopic level, without recourse to microscopic particle trajectories or self-propulsion fluctuations.", "url": "https://arxiv.org/abs/2610.01287", "type": "理论+数值", "summary": "将热力学的基本概念扩展到活性物质的非平衡领域，我们推导出限制在有限矩形盒子内的非相互作用活性粒子悬浮液的理想气体定律。该定律对于一维中的运行翻滚粒子 (RTP) 是精确的，并且是通过对任意维中的活性 Ornstein-Uhlenbeck 粒子的稳态概率密度进行系统分析扩展而建立的。它还与高维活跃布朗粒子和 RTP 的数值结果非常吻合，并恢复了先前已知的大系统尺寸限制关系。总之，这些结果证明了理想活性气体定律对三种最广泛研究的胶体活性物质理论模型的适用性。作为一种应用，我们在宏观层面上分析涉及活性物质的热力学过程，而不依赖于微观粒子轨迹或自推进波动。", "authors": [{"name": "Siran Li"}, {"name": "Ralf Eichhorn"}, {"name": "Lennart Dabelow"}], "featured_authors": [{"name": "Siran Li"}, {"name": "Ralf Eichhorn"}, {"name": "Lennart Dabelow"}], "author_count": 3}, {"id": "2610.01357", "category": "cond-mat", "title": "Domain-engineered ferroelectric BiFeO$_3$ thin films for efficient bias-free THz emission", "abstract": "Ultrashort light pulses can drive transient photocurrents in solids, the basis of modern terahertz (THz) emitters. Ferroelectrics have recently emerged in this context as sources that require neither the bias voltage of photoconductive antennas nor the magnetic field of spintronic emitters, yet the ultrafast photocurrent generating the emission has remained debated. Here, we resolve this question in epitaxial BiFeO$_3$ thin films with engineered ferroelectric domain configurations, from single-domain to periodic stripe patterns. The stripe-domain film emits a THz field four times stronger than the single-domain configurations, reaching about half the output of a metallic spintronic reference emitter while remaining unsaturated at our highest excitation fluences. Resolving the emitted THz field in amplitude and phase as a function of the pump light polarization and the crystal orientation, we separate the coexisting photocurrents by their symmetry. This identifies the ultrafast screening of the ferroelectric polarization by photocarriers as the dominant emission mechanism in the in-plane-polarized films, enhanced in multidomain films by the strong built-in fields at the domain walls, while an out-of-plane polarization favors the bulk photovoltaic current. Our results establish the ferroelectric domain configuration as a design parameter setting both the strength and the microscopic origin of light-driven THz emission.", "url": "https://arxiv.org/abs/2610.01357", "type": "理论", "summary": "超短光脉冲可以驱动固体中的瞬态光电流，这是现代太赫兹（THz）发射器的基础。铁电体最近在这种背景下出现，作为既不需要光电导天线的偏置电压也不需要自旋电子发射器的磁场的源，但产生发射的超快光电流仍然存在争议。在这里，我们在外延 BiFeO$_3$ 薄膜中解决了这个问题，该薄膜具有从单域到周期性条纹图案的工程铁电域配置。条带域薄膜发射的太赫兹场比单域配置强四倍，达到金属自旋电子参考发射器输出的大约一半，同时在最高激发通量下保持不饱和。将发射的太赫兹场的振幅和相位解析为泵浦光偏振和晶体方向的函数，我们通过共存的光电流的对称性来分离它们。\n\n这表明光载流子对铁电极化的超快
