beta)=\\operatorname{Tr}(e^{-\\beta H})$ 到 $n$、$\\beta$、模型参数和 $\\epsilon^{-1}$ 中时间多项式中给定的相对误差 $\\epsilon\\in(0,1)$。当 $ \\Delta(J) \\cdot \\frac{\\tanh(\\beta \\eta)}{\\eta} > 1 时，$ 我们证明在 $\\exp(o(n))$ 乘法因子内逼近 $ Z(\\beta)$ 是 $\\textbf{NP}$ 困难的，因此不太可能在标准复杂性理论假设下承认有效的经典或量子算法。\n\n此外，在 $\\Delta (J)\\cdot \\frac{\\tanh(\\beta \\eta)}{\\eta}\\leq 1,$ 体系中，我们提供了一种高效的随机经典算法，可以在任意小的加性误差内逼近吉布斯状态 $ \\rho_\\beta = \\frac{e^{-\\beta H}}{\\operatorname{Tr}(e^{-\\beta H})}$ 的泡利弦可观测量。在特殊情况下，当可观测量也在 $X$ 基上对角线时，即 $P \\in \\{I, X\\}^{\\otimes n}$ 时，该算法进一步实现了任意小的相对误差。", "authors": [{"name": "Thuy-Duong Vuong"}], "featured_authors": [{"name": "Thuy-Duong Vuong"}], "author_count": 1}, {"id": "2610.02082", "category": "quant-ph", "title": "Strong Simulation of 1D Quantum Circuits via Reduced Transition Matrices", "abstract": "Tensor networks are powerful tools for simulating quantum many-body systems, but the growth of spatial entanglement severely limits the direct evolution of pure states under chaotic unitary circuits. Here we consider a more targeted task: the approximate strong simulation of a specified output probability of a 1D chaotic brick-wall circuit at finite relative precision. Given input and output bit strings $\\by$ and $\\bx$, we evaluate $p(\\bx|\\by)=|\\bra{\\bx}U(T)\\ket{\\by}|^2$ using the Sweeping RTM algorithm, a transverse tensor-network contraction based on reduced transition matrices (RTMs). The algorithm compresses the left and right temporal boundary states jointly, seeking an output probability that converges across spatial cuts and as the bond dimension is increased. For chaotic one-dimensional brick-wall circuits at a fixed relative target precision, we find numerical evidence that the bond dimension required to obtain stable estimates grows subexponentially over the accessible time window. Our findings open a direct route to classical probability queries for chaotic quantum circuits, with potential applications to benchmarking and learning tasks.", "url": "https://arxiv.org/abs/2610.02082", "type": "理论+数值", "summary": "张量网络是模拟量子多体系统的强大工具，但空间纠缠的增长严重限制了混沌酉电路下纯态的直接演化。在这里，我们考虑一个更有针对性的任务：以有限相对精度对一维混沌砖墙电路的指定输出概率进行近似强模拟。给定输入和输出位字符串 $\\by$ 和 $\\bx$，我们使用 Sweeping RTM 算法评估 $p(\\bx|\\by)=|\\bra{\\bx}U(T)\\ket{\\by}|^2$，这是一种基于简化转移矩阵 (RTM) 的横向张量网络收缩。该算法联合压缩左右时间边界状态，寻求在空间切割上以及随着键维数增加而收敛的输出概率。对于固定相对目标精度的混沌一维砖墙电路，我们发现了数值证据，表明获得稳定估计所需的键维数在可访问的时间窗口内呈次指数增长。我们的研究结果为混沌量子电路的经典概率查询开辟了一条直接途径，并具有在基准测试和学习任务中的潜在应用。", "authors": [{"name": "Matilde Grassi"}, {"name": "Stefano Carignano"}, {"name": "Luca Tagliacozzo"}, {"name": "Jacopo De Nardis"}], "featured_authors": [{"name": "Matilde Grassi"}, {"name": "Stefano Carignano"}, {"name": "Luca Tagliacozzo"}, {"name": "Jacopo De Nardis"}], "author_count": 4}, {"id": "2610.02090", "category": "quant-ph", "title": "Stationarity as a One-Mode Constraint on Quantum Correlation", "abstract": "A stationary quantum state has one dynamical phase factor and one scalar energy even when its internal response spans a large Hilbert space. Our argument concerns not the value or observability of an absolute phase, but the one-ness of stationary time evolution. In regularized Hartree--Fock (reg-HF), the connection to the stationary mean field is established before any one-mode reduction: the primitive-product relative-coordinate Gaussian measure induced by the Gaussian HF representation fixes a covariance and, at that covariance, is simultaneously the minimum-Fisher-information and maximum-Shannon-differential-entropy distribution and the equality case of the Stam bound. The Coulomb operator admits a compatible Gaussian scale resolution, and virial completion converts the resulting regularized pair displacement into a stationary-compatible response. Stationarity motivates a one-mode constraint on the terminal scalar correlation response. The decisive reg-HF hypothesis is a one-mode exclusion axiom: covariance carried by response components orthogonal to the retained pair mode is excluded from the terminal scalar energy property, without asserting that the unrestricted response is one dimensional. Helium provides the minimal nontrivial test. The parameter-free retained Coulomb carrier $-\\delta/e$ and finite-$Z$ insertion $8\\delta/9$ closely reproduce independent He-like coefficients and energies, while an explicit Bethe--Goldstone calculation displays a broad non-single-denominator return spectrum even though its scalar energy is exactly moment-compressible. The result separates microscopic spectral complexity from one-mode energetic sufficiency.", "url": "https://arxiv.org/abs/2610.02090", "type": "理论+数值", "summary": "即使其内部响应跨越很大的希尔伯特空间，静止量子态也具有一个动态相位因子和一个标量能量。我们的论点涉及的不是绝对相位的值或可观测性，而是稳态时间演化的单一性。在正则化 Hartree-Fock (reg-HF) 中，与平稳平均场的连接是在任何单模约简之前建立的：由高斯 HF 表示引起的本原乘积相对坐标高斯测度固定协方差，并且在该协方差处同时是最小费舍尔信息和最大香农微分熵分布以及 Stam 界的相等情况。库仑算子承认兼容的高斯尺度分辨率，并且维里完成将所得的正则化对位移转换为平稳兼容响应。平稳性激发了对终端标量相关响应的单模约束。\n\n决定性的 reg-HF 假设是单模排除公理：与保留对模式正交的响应分量所携带的协方差被排除在终端标量能量属性之外，而不断言无限制响应是一维的。氦气提供了最小的重要测试。无参数保留库仑载流子 $-\\delta/e$ 和有限 $Z$ 插入 $8\\delta/9$ 紧密地再现了独立的 He-like 系数和能量，而显式 Bethe-Goldstone 计算显示了广泛的非单分母返回谱，即使其标量能量完全是矩可压缩的。结果将微观光谱复杂性与单模能量充足性区分开来。", "authors": [{"name": "Itai Panas"}], "featured_authors": [{"name": "Itai Panas"}], "author_count": 1}, {"id": "2610.02094", "category": "quant-ph", "title": "Quantum state preparation for weighted d-DNNF", "abstract": "The quantum state preparation problem is to, given a description of a quantum state, efficiently generate a quantum circuit computing the state. We show that for quantum states described by weighted d-DNNF (deterministic, decomposable pseudo-Boolean circuits) a quantum circuit computing the state can be obtained in linear time up to complex arithmetic.", "url": "https://arxiv.org/abs/2610.02094", "type": "理论", "summary": "量子态准备问题是在给定量子态描述的情况下，有效地生成计算该状态的量子电路。我们证明，对于由加权 d-DNNF（确定性、可分解伪布尔电路）描述的量子态，计算状态的量子电路可以在线性时间内获得复杂的算术。", "authors": [{"name": "Steef Hegeman"}, {"name": "Joon Hyung Lee"}, {"name": "Alfons Laarman"}], "featured_authors": [{"name": "Steef Hegeman"}, {"name": "Joon Hyung Lee"}, {"name": "Alfons Laarman"}], "author_count": 3}, {"id": "2610.02097", "category": "quant-ph", "title": "A No-Go Theorem for Order-Two Clifford Electric-Magnetic Duality", "abstract": "Electromagnetic duality in the toric code has order two at the level of anyon types and acts as a Hadamard-type logical transformation on the encoded quantum information. Here, we ask whether it can likewise be realized microscopically as an order-two Clifford operation. For the $\\mathbb{Z}_2$ toric code, we prove that any locality-preserving Clifford realization of electric-magnetic exchange cannot have order two. Our proof is fully general and requires neither translation symmetry with restricted families of system sizes nor a fixed pairing between vertex and plaquette stabilizers. Geometrically, the proof locally emulates the unavoidable crossing between electric and magnetic strings, similar to a cross-cap in a non-orientable manifold. Extending the problem to the $\\mathbb{Z}_N$ toric code, we find that an order-two Clifford realization exists for odd $N$, whereas it is impossible for even $N$. Our results show that the group law of an emergent electromagnetic duality need not lift faithfully to its microscopic Clifford realization.", "url": "https://arxiv.org/abs/2610.02097", "type": "理论", "summary": "环面码中的电磁对偶性在任意子类型级别具有二阶，并且充当编码量子信息的哈达玛型逻辑变换。在这里，我们询问是否可以同样在微观上将其实现为二阶 Clifford 运算。对于 $\\mathbb{Z}_2$ 复曲面码，我们证明任何电磁交换的局部性保持 Clifford 实现都不可能有二阶。我们的证明是完全通用的，既不需要系统尺寸受限系列的平移对称性，也不需要顶点稳定器和斑块稳定器之间的固定配对。从几何角度来看，证明局部模拟了电弦和磁弦之间不可避免的交叉，类似于不可定向流形中的交叉帽。将问题扩展到 $\\mathbb{Z}_N$ 环面码，我们发现奇数 $N$ 存在二阶 Clifford 实现，而偶数 $N$ 则不可能。我们的结果表明，新兴电磁二象性的群定律不需要忠实地提升到其微观克利福德实现。", "authors": [{"name": "Shunta Takahashi"}, {"name": "Zhi Li"}, {"name": "Beni Yoshida"}], "featured_authors": [{"name": "Shunta Takahashi"}, {"name": "Zhi Li"}, {"name": "Beni Yoshida"}], "author_count": 3}, {"id": "2610.02099", "category": "quant-ph", "title": "An exponential separation between entanglement-assisted and unassisted one-way quantum communication", "abstract": "A longstanding question in quantum communication complexity is whether some task can be accomplished with a small amount of communication in the presence of entanglement, yet require much more quantum communication in the absence of entanglement. Separations of this nature were previously known for relational problems and, in the simultaneous message passing model, for partial functions. But it has remained unresolved whether any such separation exists for a total Boolean function. We resolve this question with an exponential separation in the one-way setting: we exhibit a family of total Boolean functions $f_n\\colon \\{0,1\\}^n \\times \\{0,1\\}^n \\to \\{0,1\\}$ that can be computed with $O(\\log n)$ bits of one-way classical communication given prior entanglement, but that require $\\Omega(n^{1/3})$ qubits of one-way quantum communication without entanglement. Our function is a special case of the subgroup membership problem, first studied in the communication setting by Aaronson, Le Gall, Russell, and Tani.", "url": "https://arxiv.org/abs/2610.02099", "type": "理论+数值", "summary": "量子通信复杂性中一个长期存在的问题是，某些任务是否可以在存在纠缠的情况下通过少量通信来完成，但在没有纠缠的情况下需要更多的量子通信。这种性质的分离以前已知用于关系问题，并且在同步消息传递模型中用于部分功能。但对于一个完整的布尔函数是否存在这样的分离仍然悬而未决。我们通过单向设置中的指数分离来解决这个问题：我们展示了一系列总布尔函数$f_n\\colon \\{0,1\\}^n \\times \\{0,1\\}^n \\to \\{0,1\\}$，可以使用给定先前纠缠的$O(\\log n)$位单向经典通信来计算，但这需要$\\Omega(n^{1/3})$单向量子的量子位沟通无纠缠。我们的函数是子群成员资格问题的一个特例，首先由 Aaronson、Le Gall、Russell 和 Tani 在通信环境中进行研究。", "authors": [{"name": "Ryan Anselm"}, {"name": "Srijita Kundu"}, {"name": "Olivier Lalonde"}, {"name": "Ashwin Nayak"}], "featured_authors": [{"name": "Ryan Anselm"}, {"name": "Srijita Kundu"}, {"name": "Olivier Lalonde"}, {"name": "Ashwin Nayak"}], "author_count": 4}, {"id": "2610.02101", "category": "quant-ph", "title": "Time-space lower bounds for breaking quantum cryptography", "abstract": "We prove near-optimal time-space lower bounds for breaking quantum cryptography in the random oracle model. Specifically, we show that a $T$-query adversary with $S$ qubits of non-uniform advice can recover a random key $k$ from the $n$-qubit binary phase state $|\\psi_k\\rangle \\propto \\sum_{x} R(k,x) |x\\rangle$ with probability at most $O(\\frac{T^2 + \\sqrt{ST}}{N})$ for $N=2^n$. In contrast, the best known bound for post-quantum one-way functions is $O(\\frac{T^2 + ST}{N})$, with a trivial attack at $S = N$. This demonstrates a new advantage of quantum cryptography over classical cryptography: $n$ qubits of communication suffice for security against preprocessing attacks with space up to $N^2$ rather than $N$. Our methodology is simple: express the optimal preprocessing attack as the operator norm of a random matrix, and bound this value in expectation over the random oracle via the trace-moment method. These trace moments have a natural interpretation using compressed oracles [Zhandry, Crypto 2019], which we then analyze. This can be viewed as a simplification and generalization of the approach of Liu [Eurocrypt 2023] for proving time-space tradeoffs for breaking post-quantum cryptography. We also prove the following results: (1) We tighten Liu's analysis of post-quantum PRGs in QROM, achieving a distinguishing advantage bound of $O(\\frac{T^2}N + \\sqrt{\\frac{ST}N})$. (2) For unitary synthesis, we extend the one-query lower bound of Lombardi-Ma-Wright [STOC 2024] to hold against adversaries that can make one arbitrary function query along with polynomially many (adaptive) queries to the random oracle, either before or after the function query. This also interprets the original LMW24 result in terms of compressed oracles. (3) Finally, we prove a tight $O(\\frac{\\sqrt{S}}N)$ bound for the pseudorandomness of random binary phase states against space $S$ distinguishers.", "url": "https://arxiv.org/abs/2610.02101", "type": "理论", "summary": "我们证明了随机预言模型中打破量子密码学的接近最优的时空下界。具体来说，我们表明，具有非均匀建议的 $S$ 量子位的 $T$-query 对手可以从 $n$-qubit 二元相状态 $|\\psi_k\\rangle \\propto \\sum_{x} R(k,x) |x\\rangle$ 恢复随机密钥 $k$，对于 $N=2^n$，概率最大为 $O(\\frac{T^2 + \\sqrt{ST}}{N})$。相比之下，后量子单向函数的最著名界限是 $O(\\frac{T^2 + ST}{N})$，在 $S = N$ 处进行简单攻击。这证明了量子密码学相对于经典密码学的新优势：$n$ 个通信量子位足以抵御空间高达 $N^2$ 而不是 $N$ 的预处理攻击。我们的方法很简单：将最佳预处理攻击表示为随机矩阵的算子范数，并通过迹矩方法将该值限制在随机预言的期望中。这些迹矩使用压缩预言 [Zhandry, Crypto 2019] 进行自然解释，然后我们对其进行分析。\n\n这可以被视为 Liu [Eurocrypt 2023] 证明打破后量子密码学的时空权衡方法的简化和概括。我们还证明了以下结果：（1）我们加强了Liu对QROM中后量子PRG的分析，实现了$O(\\frac{T^2}N + \\sqrt{\\frac{ST}N})$的显着优势界限。 (2) 对于酉综合，我们扩展了 Lombardi-Ma-Wright [STOC 2024] 的单查询下界，以防止对手可以在函数查询之前或之后对随机预言机进行一个任意函数查询以及多项式多项（自适应）查询。这也从压缩预言的角度解释了原始 LMW24 结果。 (3) 最后，我们证明了随机二元相态与空间 $S$ 区分器的伪随机性的严格 $O(\\frac{\\sqrt{S}}N)$ 界限。", "authors": [{"name": "Fangqi Dong"}, {"name": "Alex Lombardi"}], "featured_authors": [{"name": "Fangqi Dong"}, {"name": "Alex Lombardi"}], "author_count": 2}, {"id": "2610.02130", "category": "quant-ph", "title": "Quantum impurity models: easy at equilibrium, universal in motion", "abstract": "A quantum impurity model describes a small interacting subsystem embedded into a large bath of free fermions. Here we study the computational complexity of calculating the ground energy, thermal equilibrium, and dynamical properties of these models. Our work reveals a sharp contrast: equilibrium properties can be efficiently approximated by classical means, whereas time evolution can implement a universal quantum computation. More precisely, let $H$ be the Hamiltonian of an impurity model with $n$ fermionic modes and a constant-size impurity. We show that: (1) the ground energy of $H$ can be approximated to additive error $\\varepsilon$ by a classical algorithm with runtime $\\textsf{poly}(n,1/\\varepsilon)$, improving on the quasi-polynomial runtime of the best previously known algorithm; (2) at inverse temperature $\\beta$, the Helmholtz free energy and a classical description of the thermofield double state can be computed to precision $\\varepsilon$ in time $\\textsf{poly}(n,\\beta,1/\\varepsilon)$; (3) simulating the time evolution $e^{-iHt}$ is $\\textsf{BQP}$-complete, for $H$ that is time-independent and has a fixed, constant impurity size. Our algorithms exploit exponential suppression of multi-particle bath excitations in a basis organized by energy scale and Krylov depth. Our universality construction realizes a stationary quantum processor whose program arrives in a stream of freely propagating fermions.", "url": "https://arxiv.org/abs/2610.02130", "type": "理论+数值", "summary": "量子杂质模型描述了嵌入大量自由费米子中的小型相互作用子系统。在这里，我们研究计算这些模型的地面能量、热平衡和动力学特性的计算复杂性。我们的工作揭示了一个鲜明的对比：平衡性质可以通过经典方法有效地近似，而时间演化可以实现通用的量子计算。更准确地说，令 $H$ 为具有 $n$ 费米子模式和恒定尺寸杂质的杂质模型的哈密顿量。我们证明：（1）$H$的地面能量可以通过运行时间为$\\textsf{poly}(n,1/\\varepsilon)$的经典算法近似为加性误差$\\varepsilon$，改进了先前已知算法的拟多项式运行时间； (2) 在反温度 $\\beta$ 下，亥姆霍兹自由能和热场双态的经典描述可以在时间 $\\textsf{poly}(n,\\beta,1/\\varepsilon)$ 上精确计算 $\\varepsilon$； (3) 模拟时间演化 $e^{-iHt}$ 是 $\\textsf{BQP}$ 完全的，因为 $H$ 与时间无关并且具有固定的、恒定的杂质大小。\n\n我们的算法在由能量尺度和克雷洛夫深度组织的基础上利用多粒子浴激发的指数抑制。我们的通用性结构实现了一个固定的量子处理器，其程序到达自由传播的费米子流。", "authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Sergey Bravyi"}, {"name": "Anirban Chowdhury"}, {"name": "Arkopal Dutt"}, {"name": "Alexandru Gheorghiu"}, {"name": "Zhi Li"}], "featured_authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Sergey Bravyi"}, {"name": "Anirban Chowdhury"}, {"name": "Arkopal Dutt"}, {"name": "Alexandru Gheorghiu"}, {"name": "Zhi Li"}], "author_count": 6}, {"id": "2610.02134", "category": "quant-ph", "title": "A Generalized quantum Stein lemma on von Neumann algebras", "abstract": "We prove a generalized quantum Stein lemma for i.i.d. normal states against convex, tensor-stable families on arbitrary von Neumann algebras. Assuming the existence of an alternative state with finite relative entropy from the null state, we show that, at every type-I error tolerance $\\varepsilon\\in (0,1)$, the worst case type-II error exponent is achieved with the regularized relative entropy with a strong converse. The proof combines the integral representation of relative entropy by hockey-stick divergences, a modular testing bound, and convex minimax argument.", "url": "https://arxiv.org/abs/2610.02134", "type": "理论", "summary": "我们证明了独立同分布的广义量子斯坦因引理。任意冯诺依曼代数上凸张量稳定族的正常态。假设存在从零状态开始具有有限相对熵的替代状态，我们表明，在每个 I 型误差容限 $\\varepsilon\\in (0,1)$ 处，最坏情况的 II 型误差指数是通过具有强逆的正则化相对熵实现的。该证明结合了曲棍球棒散度的相对熵的积分表示、模块化测试界限和凸极小极大论证。", "authors": [{"name": "Li Gao"}], "featured_authors": [{"name": "Li Gao"}], "author_count": 1}, {"id": "2610.02135", "category": "quant-ph", "title": "Random Quantum Circuits Beyond Moment Matching", "abstract": "Random quantum circuits aim to efficiently reproduce the statistical properties of ideal random quantum evolution. One approach is to construct approximate unitary designs, which match the moments of Haar-random unitaries up to a prescribed order with controlled error. In this work, we establish quantitative guarantees for how accurately these designs reproduce the full distributions of individual output probabilities. We show that, for every strong $\\varepsilon$-approximate unitary $k$-design on $n$ qubits, the distribution of each individual output probability is within $O\\left(\\sqrt{\\frac{2^n}{k(k+2^n)}}+\\varepsilon\\right)$ in Kolmogorov distance of the finite-dimensional Porter-Thomas distribution, a beta distribution with parameters $1$ and $2^n-1$. This bound is optimal up to constant factors, implying that a substantially better uniform bound requires additional structure. We further show that local invariance yields an exponential improvement in the dependence on $k$, with guarantees also in the stronger metric of total variation: every strong $\\varepsilon$-approximate unitary $k$-design invariant under unitary translations acting on $\\log k+O(1)$ qubits achieves error $2^{-\\Omega(k)}+O(\\varepsilon)$ in Kolmogorov distance and $2^{-\\Omega(k)}+O(\\varepsilon\\log(2/\\varepsilon))$ in total variation distance. These results identify both the distributional accuracy guaranteed by moment matching and the additional structure that substantially improves it. As an application, we show that if the marginal distribution of each output probability of a strong approximate design is within Kolmogorov distance $\\eta$ of its Haar counterpart, then the expected Shannon entropy of the output distribution differs from its Haar value by $O(\\sqrt{\\eta})$.", "url": "https://arxiv.org/abs/2610.02135", "type": "理论", "summary": "随机量子电路旨在有效地再现理想随机量子演化的统计特性。一种方法是构建近似酉设计，将哈尔随机酉矩与误差受控的规定阶数相匹配。在这项工作中，我们为这些设计如何准确地再现单个输出概率的完整分布建立了定量保证。我们证明，对于 $n$ 量子位上的每个强 $\\varepsilon$ 近似酉 $k$ 设计，每个单独输出概率的分布在有限维 Porter-Thomas 分布（参数为 $1$ 的 beta 分布）的 Kolmogorov 距离中的 $O\\left(\\sqrt{\\frac{2^n}{k(k+2^n)}}+\\varepsilon\\right)$ 范围内$2^n-1$。该界限在常数因子下是最佳的，这意味着更好的均匀界限需要额外的结构。\n\n我们进一步表明，局部不变性在对 $k$ 的依赖性方面产生了指数级的改善，同时也保证了更强的总变差度量：在酉平移作用下作用于 $\\log k+O(1)$ 量子位的每个强 $\\varepsilon$-近似酉 $k$-设计不变量在 Kolmogorov 距离中实现了错误 $2^{-\\Omega(k)}+O(\\varepsilon)$ ，并且总变化距离为 $2^{-\\Omega(k)}+O(\\varepsilon\\log(2/\\varepsilon))$。这些结果既确定了矩匹配所保证的分布精度，也确定了显着提高分布精度的附加结构。作为一个应用，我们证明，如果强近似设计的每个输出概率的边际分布在其对应的 Haar 对应的 Kolmogorov 距离 $\\eta$ 内，则输出分布的预期香农熵与其 Haar 值相差 $O(\\sqrt{\\eta})$。", "authors": [{"name": "Shih-Han Hung"}], "featured_authors": [{"name": "Shih-Han Hung"}], "author_count": 1}, {"id": "2610.02145", "category": "quant-ph", "title": "A provable quantum advantage for approximate optimization via decoded quantum interferometry", "abstract": "Decoded quantum interferometry (DQI) is a novel paradigm for tackling approximate optimization problems on quantum computers. This framework comes with strong performance guarantees and exploits a well-established duality between optimization and coding theory. A central question, however, is whether DQI can actually provably outperform all polynomial-time classical algorithms. In this work, we establish such an advantage in an oracle setting: we consider an optimization task called folded optimal polynomial intersection (folded OPI), where the acceptance sets are chosen randomly and accessed through membership oracles. We establish a strict gap between the approximation ratio achievable by any polynomial-time classical algorithm and the approximation ratio achieved by the DQI algorithm. Our proof builds on Jordan et al.'s DQI framework for approximate optimization and extends the classical lower-bound method underlying Yamakawa and Zhandry's exact-search oracle separation to approximation. Building on recent developments by Sun and Wootters, Horinaga and Yamakawa, and Jo, we further show that a modified version of the DQI algorithm achieves a strictly larger gap on the folded OPI problem, yielding an even stronger quantum separation. As a concrete example, for code rate $0.3$, DQI and the modified algorithm achieve expected scores of approximately $0.85$ and $0.95$, respectively. In contrast, exceeding the classical threshold of $0.65$ by any fixed amount with constant probability on sampled instances requires super-polynomially many classical membership queries.", "url": "https://arxiv.org/abs/2610.02145", "type": "理论+数值", "summary": "解码量子干涉测量（DQI）是一种用于解决量子计算机上近似优化问题的新颖范例。该框架具有强大的性能保证，并利用了优化和编码理论之间既定的二元性。然而，一个核心问题是 DQI 是否真的可以证明优于所有多项式时间经典算法。在这项工作中，我们在预言机设置中建立了这样的优势：我们考虑一种称为折叠最优多项式交集（折叠 OPI）的优化任务，其中随机选择接受集并通过成员资格预言机访问。我们在任何多项式时间经典算法可实现的近似率与 DQI 算法实现的近似率之间建立了严格的差距。我们的证明建立在 Jordan 等人的 DQI 近似优化框架之上，并将 Yamakawa 和 Zhandry 的精确搜索预言分离的经典下界方法扩展到近似。\n\n基于 Sun 和 Wootters、Horinaga 和 Yamakawa 以及 Jo 的最新进展，我们进一步证明了 DQI 算法的修改版本在折叠 OPI 问题上实现了更大的差距，从而产生了更强的量子分离。作为一个具体示例，对于码率 $0.3$，DQI 和修改后的算法分别达到约 $0.85$ 和 $0.95$ 的预期分数。相比之下，在采样实例上以恒定概率超过 0.65 美元的经典阈值需要超多项式许多经典成员资格查询。", "authors": [{"name": "Maximilian J. Kramer"}, {"name": "Elies Gil-Fuster"}, {"name": "Benjamin D. M. Jones"}, {"name": "Jens Eisert"}, {"name": "Franz J. Schreiber"}], "featured_authors": [{"name": "Maximilian J. Kramer"}, {"name": "Elies Gil-Fuster"}, {"name": "Benjamin D. M. Jones"}, {"name": "Jens Eisert"}, {"name": "Franz J. Schreiber"}], "author_count": 5}, {"id": "2610.02146", "category": "quant-ph", "title": "Polynomial-time additive-error estimation of output probabilities for shallow quantum circuits", "abstract": "We give a deterministic classical algorithm that estimates $|\\langle x|U|0^n\\rangle|^2$ to additive error $\\varepsilon$ in $\\mathrm{poly}(n, 1/\\varepsilon)$ time, where $U$ is a constant-depth quantum circuit comprised of gates with bounded fan-in and arbitrary connectivity, and $x$ is an arbitrary $n$-bit output string. This improves over prior state-of-the-art algorithms that takes $n^{O(log(n))}$ time for the same task, $n^{O(log(log(n))}$ when $U$ is geometrically local, and $n^{O(1)}$ for 2D geometrically-local circuits.", "url": "https://arxiv.org/abs/2610.02146", "type": "理论+数值", "summary": "我们给出了一种确定性经典算法，该算法在 $\\mathrm{poly}(n, 1/\\varepsilon)$ 时间内估计 $|\\langle x|U|0^n\\rangle|^2$ 到加性误差 $\\varepsilon$，其中 $U$ 是由具有有界扇入和任意连接的门组成的恒定深度量子电路，$x$ 是任意 $n$ 位输出字符串。这比之前最先进的算法有所改进，该算法需要 $n^{O(log(n))}$ 时间来完成同一任务，$n^{O(log(log(n))}$（当 $U$ 是几何局部时），以及 $n^{O(1)}$（对于 2D 几何局部电路）。", "authors": [{"name": "Matthew Coudron"}, {"name": "Michael J. Gullans"}, {"name": "Jon Nelson"}, {"name": "Joel Rajakumar"}, {"name": "Shi Jie Samuel Tan"}], "featured_authors": [{"name": "Matthew Coudron"}, {"name": "Michael J. Gullans"}, {"name": "Jon Nelson"}, {"name": "Joel Rajakumar"}, {"name": "Shi Jie Samuel Tan"}], "author_count": 5}, {"id": "2610.02166", "category": "quant-ph", "title": "Beyond Light Cones: State Preparation Complexity in Quantum Spin Glasses", "abstract": "We introduce a method for studying state preparation complexity in dense quantum $p$-spin Hamiltonians on $n$ qubits, going beyond bounds based only on circuit lightcones. The key input is the class's effective profile complexity, which is derived from the metric entropy of its Pauli profiles. These profiles record expectations of all Pauli operators supported on exactly $p$ qubits. Classes with uniformly bounded quadratic effective profile complexity remain separated from the ground-state energy by a positive multiple of $\\sqrt n$ for sufficiently large fixed $p$. At subquadratic effective profile complexity, the class cannot outperform a suitable benchmark class at leading order, with product states providing a universal benchmark. The proof combines an adaptation of a nonsymmetric quantum de Finetti theorem of Berta et al. ( arXiv:1810.12197 ) with Gaussian process entropy bounds. Applying this framework, we show that attaining near-ground-state energy requires $\\Omega(n^2/\\log n)$ one- and two-qubit gates, even with arbitrary discardable ancillas. We also obtain depth-width tradeoffs, entanglement-depth and matrix product state bond-dimension lower bounds, and obstructions for both orientations at every fixed level of Parham's magic hierarchy ( arXiv:2504.19966 ), with total circuit width $O(n)$. In first-level reverse magic, a shallow circuit is followed by an unrestricted Clifford circuit. The latter can spread local observables across the system, preventing a direct application of small-lightcone bounds. For this first-level class, our bounds also allow arbitrarily many clean ancillas at fixed shallow-circuit depth. A sharper benchmark shows that Clifford+$T$ circuits with $o(n)$ $T$-gates have no leading-order energy advantage over product stabilizer states, even with unrestricted Clifford operations and arbitrary discardable ancillas.", "url": "https://arxiv.org/abs/2610.02166", "type": "理论", "summary": "我们引入了一种研究 $n$ 量子位上密集量子 $p$-自旋哈密顿量的状态准备复杂性的方法，超越了仅基于电路光锥的界限。关键输入是类的有效轮廓复杂度，它源自其泡利轮廓的度量熵。这些配置文件记录了所有在 $p$ 量子位上支持的泡利算子的期望。对于足够大的固定 $p$，具有统一有界二次有效剖面复杂度的类仍然与基态能量分离 $\\sqrt n$ 的正倍数。在次二次有效轮廓复杂度下，该类无法超越领先顺序的合适基准类，而产品状态提供了通用基准。该证明结合了 Berta 等人的非对称量子 de Finetti 定理的改编。 ( arXiv:1810.12197 ) 具有高斯过程熵界限。应用这个框架，我们表明获得近基态能量需要 $\\Omega(n^2/\\log n)$ 一量子位门和二量子位门，即使有任意可丢弃的辅助装置。\n\n我们还获得了深度-宽度权衡、纠缠深度和矩阵积态键维下界，以及 Parham 魔法层次结构 ( arXiv:2504.19966 ) 每个固定级别的两个方向的障碍物，总电路宽度为 $O(n)$。在第一级反向魔术中，浅层电路后面是无限制的克利福德电路。后者可以将局部可观测值传播到整个系统，从而防止直接应用小光锥边界。对于这个第一级类，我们的边界还允许在固定的浅电路深度上任意许多干净的辅助设备。更清晰的基准表明，即使具有不受限制的 Clifford 操作和任意可丢弃的辅助设备，具有 $o(n)$ $T$ 门的 Clifford+$T$ 电路与产品稳定器状态相比也没有前序能量优势。", "authors": [{"name": "Omar Al-Ghattas"}, {"name": "David Gamarnik"}, {"name": "Bobak T Kiani"}], "featured_authors": [{"name": "Omar Al-Ghattas"}, {"name": "David Gamarnik"}, {"name": "Bobak T Kiani"}], "author_count": 3}, {"id": "2610.02167", "category": "quant-ph", "title": "Polynomial-time classical and quantum simulation of quantum impurity models", "abstract": "Quantum impurity models are paradigmatic models of interacting quantum matter, as well as key computational primitives for modern electronic-structure methods. They describe a small subsystem of interacting fermions coupled to a large, noninteracting bath. We perform a comprehensive study of the computational complexity of simulating impurity models, delineating the boundary between classical and quantum tractability for this class of problems. Our main finding is that static properties of quantum impurity models can be calculated efficiently on a classical computer. Specifically, we give classical algorithms that (1) estimate the ground-state energy to additive precision $\\delta$ in time $\\mathrm{poly}(n,\\delta^{-1})$, and (2) estimate the partition function at inverse temperature $\\beta$ to relative precision $\\delta$ in time $\\mathrm{poly}(n,\\beta,\\delta^{-1})$, where $n$ is the system size. These results improve the previous best-known complexity for ground-state energy estimation from quasipolynomial to polynomial time, while establishing for the first time rigorous polynomial-time guarantees for simulating impurity models in thermal equilibrium. On the other hand, we find that simulating dynamical properties of impurity models is hard for classical computers but easy on a quantum computer. As a canonical example, we show that computing their nonequilibrium Green's functions captures the full power of quantum computation, even at finite temperature. Taken together, our results rule out superpolynomial quantum speedups for computing static properties, but provide an avenue for quantum advantage in simulating impurity physics out of equilibrium.", "url": "https://arxiv.org/abs/2610.02167", "type": "理论+数值", "summary": "量子杂质模型是相互作用的量子物质的范例模型，也是现代电子结构方法的关键计算基元。他们描述了一个由相互作用的费米子组成的小型子系统，与一个大型的非相互作用浴相耦合。我们对模拟杂质模型的计算复杂性进行了全面的研究，描绘了此类问题的经典和量子可处理性之间的界限。我们的主要发现是，量子杂质模型的静态特性可以在经典计算机上有效计算。具体来说，我们给出了经典算法：(1) 在 $\\mathrm{poly}(n,\\delta^{-1})$ 时间内将基态能量估计到加性精度 $\\delta$，(2) 在 $\\mathrm{poly}(n,\\beta,\\delta^{-1})$ 时间内将逆温 $\\beta$ 下的配分函数估计到相对精度 $\\delta$，其中 $n$ 是系统大小。这些结果将之前众所周知的基态能量估计的复杂性从拟多项式改进为多项式时间，同时首次为模拟热平衡中的杂质模型建立了严格的多项式时间保证。\n\n另一方面，我们发现模拟杂质模型的动力学特性对于经典计算机来说很难，但对于量子计算机来说很容易。作为一个典型的例子，我们证明，即使在有限的温度下，计算它们的非平衡格林函数也能发挥量子计算的全部能力。总而言之，我们的结果排除了计算静态属性的超多项式量子加速，但为模拟不平衡的杂质物理提供了量子优势的途径。", "authors": [{"name": "Jiaqing Jiang"}, {"name": "Nathan Ju"}, {"name": "Ojas Parekh"}, {"name": "Chaithanya Rayudu"}, {"name": "Andrew Zhao"}], "featured_authors": [{"name": "Jiaqing Jiang"}, {"name": "Nathan Ju"}, {"name": "Ojas Parekh"}, {"name": "Chaithanya Rayudu"}, {"name": "Andrew Zhao"}], "author_count": 5}, {"id": "2610.02172", "category": "quant-ph", "title": "Robust exponential lower bounds for fermionic and bosonic Gaussian ranks", "abstract": "The power and limitations of classical simulation are central to understanding quantum computational advantages. A leading simulation paradigm is based on coherent decomposition into classically tractable free states where the decomposition rank determines the simulation complexity. Proving strong lower bounds on this number is a notoriously difficult and mathematically rich problem, as exemplified by the qubit stabilizer rank problem. Here, we study the Gaussian version of this problem in both bosonic and fermionic systems and establish robust exponential lower bounds on Gaussian rank. In particular, we prove that for every pure non-Gaussian state on finitely many modes, with definite parity in the fermionic case, the approximate border Gaussian rank of its tensor powers grows at least exponentially at any fixed norm error below one. Our proofs combine reduction to four modes with Majorana spectral bounds for fermions, and Gaussian postselection with an entropy-based rank bound for bosons. As concrete examples, we derive explicit exponential lower bounds for the four-mode fermionic GHZ state and the bosonic single-photon state. The bosonic results require no assumption on the energy of the target state. Our results show that non-Gaussianity universally entails exponential Gaussian decomposition complexity, setting fundamental limitations on decomposition-based classical simulation of bosonic and fermionic systems.", "url": "https://arxiv.org/abs/2610.02172", "type": "理论+数值", "summary": "经典模拟的能力和局限性对于理解量子计算优势至关重要。领先的模拟范例基于对经典易处理自由态的相干分解，其中分解等级决定模拟复杂性。证明这个数字的强下界是一个众所周知的困难且数学丰富的问题​​，量子位稳定器秩问题就是一个例子。在这里，我们研究了玻色子和费米子系统中该问题的高斯版本，并在高斯秩上建立了稳健的指数下界。特别是，我们证明，对于有限多个模式上的每个纯非高斯状态，在费米子情况下具有确定的奇偶性，其张量幂的近似边界高斯秩在任何低于 1 的固定范数误差下至少呈指数增长。我们的证明将费米子的四种模式与马约拉纳谱界结合起来，将高斯后选择与玻色子的基于熵的秩界结合起来。作为具体例子，我们推导了四模费米子 GHZ 态和玻色子单光子态的显式指数下界。\n\n玻色子结果不需要对目标态的能量进行假设。我们的结果表明，非高斯性普遍需要指数高斯分解复杂性，为玻色子和费米子系统基于分解的经典模拟设置了基本限制。", "authors": [{"name": "Fuchuan Wei"}, {"name": "Kong-Wing Wu"}, {"name": "Zhengwei Liu"}, {"name": "Zi-Wen Liu"}], "featured_authors": [{"name": "Fuchuan Wei"}, {"name": "Kong-Wing Wu"}, {"name": "Zhengwei Liu"}, {"name": "Zi-Wen Liu"}], "author_count": 4}, {"id": "2610.02176", "category": "quant-ph", "title": "From Permutation Symmetry to Communication Bounds and Additivity", "abstract": "Correlations across channel uses can improve quantum communication rates, making optimization over arbitrarily large blocks a central difficulty in determining quantum capacity. We show how full permutation invariance limits this advantage for every finite-dimensional memoryless channel. The optimized coherent information per use converges to the single-use maximum and consequently attains its supremum at a finite block length. Thus finite-block superadditivity remains possible, while the asymptotic optimization reduces to a single channel use. We also establish a strong converse for pure-source entanglement generation with permutation-invariant inputs: at any fixed rate above the single-use coherent-information maximum, the fidelity tends to zero. Beyond these communication bounds, we identify a common structure underlying completely bounded norms and the sandwiched Rényi channel quantities governing discrimination against a replacer and entanglement-assisted communication. De Finetti reduction and permutation covariance yield systematic alternative proofs of their known multiplicativity and additivity results within a shared variational framework. We further show that, for permutation-invariant inputs, correlations cannot sustain an asymptotic reduction in output entropy per use below the single-use minimum. This entropy limit holds for Rényi orders greater than one and for the von Neumann entropy, extending the role of symmetry from communication bounds to the control of output entropy.", "url": "https://arxiv.org/abs/2610.02176", "type": "理论+数值", "summary": "跨通道使用的相关性可以提高量子通信速率，从而使任意大块的优化成为确定量子容量的中心难点。我们展示了完全排列不变性如何限制每个有限维无记忆通道的这一优势。每次使用的优化相干信息收敛到单次使用最大值，从而在有限块长度处达到其最高值。因此，有限块超可加性仍然是可能的，而渐近优化则减少到单通道使用。我们还建立了具有排列不变输入的纯源纠缠生成的强逆：在高于一次性相干信息最大值的任何固定速率下，保真度趋于零。除了这些通信界限之外，我们还确定了完全有界规范背后的共同结构以及控制对替代者和纠缠辅助通信的歧视的夹层 Rényi 通道量。 De Finetti 约简和排列协方差在共享变分框架内为其已知的乘性和加性结果提供了系统的替代证明。\n\n我们进一步表明，对于排列不变的输入，相关性不能维持每次使用的输出熵渐近降低到单次使用最小值以下。该熵极限适用于大于 1 的 Rényi 阶和冯诺依曼熵，将对称性的作用从通信边界扩展到输出熵的控制。", "authors": [{"name": "Zahra Baghali Khanian"}, {"name": "Debbie Leung"}, {"name": "Graeme Smith"}], "featured_authors": [{"name": "Zahra Baghali Khanian"}, {"name": "Debbie Leung"}, {"name": "Graeme Smith"}], "author_count": 3}, {"id": "2610.02178", "category": "quant-ph", "title": "Learning SYK Hamiltonians", "abstract": "We study the problem of learning the dense Sachdev--Ye--Kitaev (SYK) Hamiltonian from copies of its Gibbs state. Existing algorithms for Hamiltonian learning typically rely on geometric locality or bounded interaction degree and therefore do not apply to SYK, where each quartic interaction overlaps with $\\Theta(n^3)$ others. We show that this obstruction can be overcome by exploiting the random mean-field structure of the model. At any constant temperature, we prove that with high probability over the SYK couplings, the entire Hamiltonian can be learned to inverse-polynomial accuracy using polynomially many samples. Furthermore, when the inverse temperature is restricted to be a sufficiently small constant, we construct a quasipolynomial-time learning algorithm which is qualitatively different from the sample-efficient algorithm.", "url": "https://arxiv.org/abs/2610.02178", "type": "理论+数值", "summary": "我们研究了从吉布斯态的副本中学习稠密 Sachdev--Ye-Kitaev (SYK) 哈密顿量的问题。现有的哈密顿学习算法通常依赖于几何局部性或有界相互作用度，因此不适用于 SYK，其中每个四次相互作用与 $\\Theta(n^3)$ 其他相互作用重叠。我们表明，可以通过利用模型的随机平均场结构来克服这种障碍。在任何恒定温度下，我们证明在 SYK 耦合上，整个哈密顿量可以使用多项式多个样本学习到逆多项式精度。此外，当逆温度被限制为足够小的常数时，我们构造了一种与样本有效算法有质的不同的拟多项式时间学习算法。", "authors": [{"name": "Anurag Anshu"}, {"name": "Srinivasan Arunachalam"}, {"name": "Sitan Chen"}, {"name": "Yeongwoo Hwang"}], "featured_authors": [{"name": "Anurag Anshu"}, {"name": "Srinivasan Arunachalam"}, {"name": "Sitan Chen"}, {"name": "Yeongwoo Hwang"}], "author_count": 4}, {"id": "2610.02183", "category": "quant-ph", "title": "Single-Particle Spectral Estimation", "abstract": "We study Hamiltonian learning in a novel setting, where we are promised a physical structure that is obfuscated by a global unitary. In particular, we consider the task of learning the weights $E_i$ of a Hamiltonian $H=U^{\\dagger}(\\sum_{i \\in I} E_i n_i + H_O)U$ comprised of a set of non-interacting modes $I$ and an arbitrary ``spectator'' $H_O$ acting on a disjoint set of modes $O$. The non-interacting structure is hidden by an unknown global unitary $U$, and our goal is to recover the $E_i$ without reconstructing $U$. Such Hamiltonians are well-motivated in the setting of materials modeling, where they find application for classical methods such as mean-field theory, Green's functions, and density functional theory. We show that this problem is DQC1-hard, despite the apparent simplification given by the non-interacting structure. We then introduce SPICES (single-particle inference via contour estimators), which combines a Hadamard test with a novel classical postprocessing procedure to efficiently recover the spectral distribution in Wasserstein distance under certain natural assumptions. The method exploits the correspondence between single-particle energies of the individual quasiparticles and the Fourier frequencies governing zeros of the partition function at complex inverse temperature. As quasiparticle spectra feature ubiquitously in downstream materials calculations, and with SPICES being simple and practical to execute, we expect that SPICES is a promising route to quantum applications in materials simulation.", "url": "https://arxiv.org/abs/2610.02183", "type": "理论+数值", "summary": "我们在一个新颖的环境中研究哈密顿学习，在那里我们被承诺了一个被全局统一所混淆的物理结构。特别是，我们考虑学习哈密顿量 $H=U^{\\dagger}(\\sum_{i \\in I} E_i n_i + H_O)U$ 的权重 $E_i$ 的任务，该哈密顿量由一组非交互模式 $I$ 和作用于一组不相交模式 $O$ 的任意“旁观者”$H_O$ 组成。非交互结构被未知的全局酉$U$隐藏，我们的目标是在不重建$U$的情况下恢复$E_i$。这些哈密顿主义者在材料建模领域有着良好的动机，他们在其中找到了平均场理论、格林函数和密度泛函理论等经典方法的应用。我们证明这个问题是 DQC1 难的，尽管非交互结构给出了明显的简化。然后，我们引入 SPICES（通过轮廓估计器进行单粒子推理），它将 Hadamard 测试与新颖的经典后处理程序相结合，以在某些自然假设下有效地恢复 Wasserstein 距离的光谱分布。\n\n该方法利用了单个准粒子的单粒子能量与控制复数逆温度下配分函数零点的傅立叶频率之间的对应关系。由于准粒子光谱在下游材料计算中无处不在，并且 SPICES 执行起来简单实用，我们预计 SPICES 是材料模拟中量子应用的一条有前途的途径。", "authors": [{"name": "Adrian Chapman"}, {"name": "Charles Derby"}, {"name": "Steven T. Flammia"}, {"name": "Yeongwoo Hwang"}, {"name": "Joel Klassen"}, {"name": "Calum McCartney"}], "featured_authors": [{"name": "Adrian Chapman"}, {"name": "Charles Derby"}, {"name": "Steven T. Flammia"}, {"name": "Yeongwoo Hwang"}, {"name": "Joel Klassen"}, {"name": "Calum McCartney"}], "author_count": 6}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
