name": "Mrityunjay Kothari"}, {"name": "Sayaka Kochiyama"}, {"name": "Haneesh Kesari"}], "featured_authors": [{"name": "Mrityunjay Kothari"}, {"name": "Sayaka Kochiyama"}, {"name": "Haneesh Kesari"}], "author_count": 3}, {"id": "2610.13885", "category": "cond-mat", "title": "Necessary conditions for benchmarking next-generation AI in materials discovery", "abstract": "Current AI predicts materials by speeding up energy minimisation and training on large databases. However, scaling data generation prevents manual analysis by domain experts. If novelty is evaluated by chemical compositions or traditional representations in Crystallographic Information Files, or standard structure matchers based on manually chosen thresholds, one can easily generate millions of ``new'' compositions or files without discovering truly novel materials. This paper uses a hierarchy of crystal invariants to continuously trace and quantify structural novelty based on the new mathematical definition of a crystal structure and asymptotic guarantees for invariant descriptors. The invariant-based analysis through cascade computations on a modest computer exposes the unexpected scale of duplication in the world's largest materials databases, shown here in the high-profile case of GNoME datasets. To prevent current ``embarrassment of over-prediction'', we propose necessary conditions for next-generation AI that should be automatically enforced before claiming any new materials.", "url": "https://arxiv.org/abs/2610.13885", "type": "理论+数值", "summary": "当前的人工智能通过加速能量最小化和大型数据库训练来预测材料。然而，扩展数据生成阻碍了领域专家的手动分析。如果通过晶体学信息文件中的化学成分或传统表示，或基于手动选择的阈值的标准结构匹配器来评估新颖性，那么人们可以轻松地生成数百万个“新”成分或文件，而无需发现真正新颖的材料。本文基于晶体结构的新数学定义和不变量描述符的渐近保证，使用晶体不变量的层次结构来连续追踪和量化结构新颖性。在一台普通计算机上通过级联计算进行的基于不变性的分析揭示了世界上最大的材料数据库中意想不到的重复规模，这在备受瞩目的 GNoME 数据集案例中得到了体现。为了防止当前“过度预测的尴尬”，我们提出了下一代人工智能的必要条件，这些条件应该在声明任何新材料之前自动执行。", "authors": [{"name": "Daniel E Widdowson"}, {"name": "Tatiana V Kurlina"}, {"name": "Olga D Anosova"}, {"name": "Vitaliy A Kurlin"}], "featured_authors": [{"name": "Daniel E Widdowson"}, {"name": "Tatiana V Kurlina"}, {"name": "Olga D Anosova"}, {"name": "Vitaliy A Kurlin"}], "author_count": 4}, {"id": "2610.12547", "category": "hep-th", "title": "Lattice Monte Carlo of $λϕ^4$ on Euclidean de Sitter", "abstract": "We report the first Monte Carlo simulation of quantum field theory on Euclidean de Sitter space, $S^4$. Rather than discretizing space, we use a spectral lattice based on spherical harmonics, keeping all symmetries exact at finite cutoff. For a massless $\\lambda\\phi^4$ theory, the zero-mode distribution reproduces the Starobinsky-Yokoyama equilibrium at weak coupling, and deviations closely follow the one-loop renormalization of $\\lambda$. At strong bare coupling, the renormalized quartic coupling saturates near the ceiling of the one-loop renormalization-group flow. This saturation is the de Sitter counterpart of the triviality mechanism that bounds the Higgs mass in flat space. Our results confirm nonperturbatively that the infrared divergences of light scalars in de Sitter are correctly resummed by the stochastic formalism. More broadly, this work opens up de Sitter space to lattice Monte Carlo methods.", "url": "https://arxiv.org/abs/2610.12547", "type": "理论", "summary": "我们报告了欧几里得德西特空间 $S^4$ 上量子场论的首次蒙特卡罗模拟。我们没有离散空间，而是使用基于球谐函数的谱晶格，使所有对称性在有限截止条件下保持精确。对于无质量 $\\lambda\\phi^4$ 理论，零模分布再现了弱耦合下的 Starobinsky-Yokoyama 平衡，并且偏差紧密遵循 $\\lambda$ 的单环重整化。在强裸耦合下，重正化四次耦合在单环重正化群流的上限附近饱和。这种饱和度是限制平坦空间中希格斯质量的平凡机制的德西特对应物。我们的结果无扰地证实了德西特中光标量的红外发散可以通过随机形式正确恢复。更广泛地说，这项工作为格子蒙特卡罗方法开辟了德西特空间。", "authors": [{"name": "Angelo Caravano"}], "featured_authors": [{"name": "Angelo Caravano"}], "author_count": 1}, {"id": "2610.12550", "category": "hep-th", "title": "Proving the OSV conjecture with the gravitational path integral", "abstract": "The OSV conjecture relates the helicity supertrace of black holes in $4d$ $\\mathcal{N}=2$ supergravity obtained through a Calabi--Yau compactification of Type IIA string theory to the modulus squared of the topological string partition function evaluated at the attractor point in moduli space for a given set of magnetic black hole charges and electric chemical potentials. We find Euclidean black hole saddles that compute this index to all orders in the 4d supergravity derivative expansion and calculate their action using equivariant localization. The gravitational on-shell action localizes entirely to the north and south poles of each black hole, with the two contributions determined by the holomorphic and anti-holomorphic topological string free energies, respectively, evaluated at the attractor values of the moduli. For single-center black hole saddles, this provides a proof of the OSV conjecture to all orders in the topological string coupling. The same localization formula also applies to all saddles that contribute to the helicity supertrace, such as multi-center black holes, which leads to a non-perturbative refinement of the conjecture.", "url": "https://arxiv.org/abs/2610.12550", "type": "理论", "summary": "OSV猜想将通过IIA型弦理论的卡拉比-丘紧致化获得的$4d$$\\mathcal{N}=2$超引力中的黑洞螺旋性超迹与给定一组磁性黑洞电荷和电化学势在模空间中吸引子点处评估的拓扑弦分区函数的模平方相关。我们发现欧几里得黑洞鞍可以计算 4d 超引力导数展开中所有阶的索引，并使用等变定位来计算它们的作用。壳上引力作用完全定位于每个黑洞的北极和南极，这两个贡献分别由全纯和反全纯拓扑弦自由能决定，并在模的吸引子值处进行评估。对于单中心黑洞鞍座，这提供了拓扑弦耦合中所有阶的 OSV 猜想的证明。相同的定位公式也适用于所有对螺旋超迹有贡献的鞍，例如多中心黑洞，这导致了猜想的非微扰细化。", "authors": [{"name": "Nikolay Bobev"}, {"name": "Jan Boruch"}, {"name": "Luca V. Iliesiu"}, {"name": "Dawid Maskalaniec"}], "featured_authors": [{"name": "Nikolay Bobev"}, {"name": "Jan Boruch"}, {"name": "Luca V. Iliesiu"}, {"name": "Dawid Maskalaniec"}], "author_count": 4}, {"id": "2610.12554", "category": "hep-th", "title": "GLSMs for non-polynomial deformations and generalized complete intersection Calabi-Yau manifolds", "abstract": "Gauged Linear Sigma Models (GLSMs) have long been a key tool in understanding Calabi-Yau compactifications of string theory. While descriptions of complete intersections of polynomial defining equations have long been understood in this context, a full treatment of non-polynomial complex structure deformations has been absent from the literature. Likewise, the somewhat more exotic generalized complete intersection Calabi-Yau construction has resisted a GLSM description. In this paper we resolve both of these omissions using completely standard GLSMs with polynomial superpotentials. The non-polynomial structure seen in the geometric constructions only arises in the associated GLSM upon restriction to the vacuum space of the theory. This feature enables the construction to avoid singularities in field space that could have arisen if non-polynomial structure were incorporated directly into the GLSM superpotential.", "url": "https://arxiv.org/abs/2610.12554", "type": "理论", "summary": "测量线性西格玛模型 (GLSM) 长期以来一直是理解弦理论 Calabi-Yau 紧致化的关键工具。虽然在这方面早已理解多项式定义方程的完全交集的描述，但文献中却缺乏对非多项式复杂结构变形的全面处理。同样，更奇特的广义完全交叉 Calabi-Yau 构造也抵制了 GLSM 描述。在本文中，我们使用具有多项式超势的完全标准 GLSM 解决了这两个遗漏问题。几何构造中看到的非多项式结构仅在理论真空空间的限制下出现在相关的 GLSM 中。此功能使构造能够避免场空间中的奇点，如果将非多项式结构直接合并到 GLSM 超势中，可能会出现奇点。", "authors": [{"name": "Lara B. Anderson"}, {"name": "James Gray"}, {"name": "Eric Sharpe"}, {"name": "Albert Haochen Zhang"}], "featured_authors": [{"name": "Lara B. Anderson"}, {"name": "James Gray"}, {"name": "Eric Sharpe"}, {"name": "Albert Haochen Zhang"}], "author_count": 4}, {"id": "2610.12560", "category": "hep-th", "title": "Quantum limit to transparency", "abstract": "We argue that no material can be made completely transparent to light as long as it has a nontrivial index of refraction. The quantum decay of photons into phonons is an ineliminable source of attenuation. This survives even once all other excitations have been gapped away, impurities have been removed, and the temperature has been set to zero. Restricting for simplicity to the case of a superfluid, we determine via effective field theory methods the corresponding low-frequency contribution to the imaginary part of the index of refraction. This scales as $\\omega^4$ and induces a nonanalyticity of the real part for $\\omega \\rightarrow 0$. We also extend our result to large coherent electromagnetic fields, such as those of a laser, showing that the effect can receive strong nonlinear enhancements. Our result is a genuine quantum lower bound to the transparency of a medium.", "url": "https://arxiv.org/abs/2610.12560", "type": "理论", "summary": "我们认为，只要具有不平凡的折射率，就不可能使任何材料对光完全透明。光子到声子的量子衰变是不可消除的衰减源。即使所有其他激发都被消除、杂质被去除并且温度被设置为零，这种情况仍然存在。为了简单起见，仅限于超流体的情况，我们通过有效场论方法确定对折射率虚部的相应低频贡献。该比例为 $\\omega^4$ 并导致 $\\omega \\rightarrow 0$ 实部的非解析性。我们还将我们的结果扩展到大的相干电磁场，例如激光场，表明该效应可以得到强烈的非线性增强。我们的结果是介质透明度的真正量子下界。", "authors": [{"name": "Angelo Esposito"}, {"name": "Alberto Nicolis"}, {"name": "Federico Piazza"}], "featured_authors": [{"name": "Angelo Esposito"}, {"name": "Alberto Nicolis"}, {"name": "Federico Piazza"}], "author_count": 3}, {"id": "2610.12615", "category": "hep-th", "title": "The Real EFThedron: A Moment Geometry for the Nonperturbative S-Matrix", "abstract": "The S-matrix bootstrap restricts low-energy interactions through unitarity, analyticity and crossing symmetry. For effective field theory couplings, positivity bounds have a natural geometric formulation, the EFThedron, in which the allowed couplings form the classical positive moment problem. We show that this geometry extends to full nonlinear unitarity. Multiplying the amplitude by fractional powers of the energy turns its real part into a moment as well, so that unitarity becomes a bounded complex moment problem. Analyticity becomes a set of linear constraints requiring different kernels to reconstruct the same couplings, analogous to the null constraints imposed by crossing symmetry. In two dimensions the problem can be solved exactly, leading to Castillejo--Dalitz--Dyson amplitudes as extremal measures of the moment problem. In four dimensions we obtain closed-form and semi-analytic bounds for the massless EFThedron model and for massive scalar scattering. For massive scalars, the analyticity constraints improve on published dual bounds, reducing the gap to the primal region. By placing the real and imaginary parts of amplitudes on an equal footing, the Real EFThedron provides a powerful framework combining unitarity, analyticity and crossing, opening a new route to mapping the space of consistent quantum field theories.", "url": "https://arxiv.org/abs/2610.12615", "type": "理论", "summary": "S 矩阵自举通过幺正性、解析性和交叉对称性限制低能相互作用。对于有效的场论耦合，正界有一个自然的几何公式​​，即 EFThedron，其中允许的耦合形成经典的正矩问题。我们证明这种几何可以扩展到完全非线性幺正性。将振幅乘以能量的分数次幂也会将其实部变成矩，从而幺正性变成有界复矩问题。解析性成为一组线性约束，需要不同的内核来重建相同的耦合，类似于交叉对称性施加的零约束。在二维中，这个问题可以被精确地解决，从而导致卡斯蒂列霍-达利茨-戴森振幅作为力矩问题的极值测量。在四个维度中，我们获得了无质量 EFThedron 模型和大规模标量散射的封闭形式和半解析边界。对于大量标量，分析性约束在已发布的对偶边界上得到改进，减少了与原始区域的差距。\n\n通过将振幅的实部和虚部放在同等的基础上，Real EFThedron 提供了一个结合了幺正性、解析性和交叉性的强大框架，为映射一致量子场论的空间开辟了一条新途径。", "authors": [{"name": "Laurentiu Rodina"}, {"name": "Anna Tokareva"}, {"name": "Yongjun Xu"}], "featured_authors": [{"name": "Laurentiu Rodina"}, {"name": "Anna Tokareva"}, {"name": "Yongjun Xu"}], "author_count": 3}, {"id": "2610.12653", "category": "hep-th", "title": "Tropical QFT and the sine-Gordon model", "abstract": "A tropical quantum field theory is an exactly solvable deformation limit of an ordinary QFT, governed by a non-linear partial differential equation. We use the integrable two-dimensional sine-Gordon theory as a testbench to compare the exact features of an undeformed model with its tropical counterpart. We classify scale-invariant tropical QFTs in $D=2$ and leverage functional renormalization group methods to demonstrate that all scale-invariant theories with periodic effective actions are infrared fixed points of flows originating from sine-Gordon Lagrangians. For the tropical sine-Gordon model, we compute the $\\beta$-functions exactly, solve the renormalized theory both via a convergent expansion and numerically for all admissible couplings, and illustrate the complete renormalization group flow from the Gaussian to the IR fixed point. Finally, we study the large-order behaviour of the loop expansion and relate it to the Hamilton-Jacobi equation, whose solutions we interpret as tropical instantons.", "url": "https://arxiv.org/abs/2610.12653", "type": "理论", "summary": "热带量子场论是普通 QFT 的精确可解变形极限，由非线性偏微分方程控制。我们使用可积二维正弦戈登理论作为测试平台来比较未变形模型与其热带模型的确切特征。我们将尺度不变的热带 QFT 分类为 $D=2$，并利用函数重正化群方法来证明所有具有周期性有效作用的尺度不变理论都是源自正弦戈登拉格朗日量的红外不动点。对于热带正弦戈登模型，我们精确计算 $\\beta$ 函数，通过收敛展开和数值求解所有允许耦合的重正化理论，并说明从高斯到 IR 固定点的完整重正化群流。最后，我们研究了环展开的大阶行为，并将其与哈密尔顿-雅可比方程联系起来，我们将其解解释为热带瞬时子。", "authors": [{"name": "Michael Borinsky"}, {"name": "Jury Radkovski"}, {"name": "Suriyah Rajalingam Kannagi"}], "featured_authors": [{"name": "Michael Borinsky"}, {"name": "Jury Radkovski"}, {"name": "Suriyah Rajalingam Kannagi"}], "author_count": 3}, {"id": "2610.12672", "category": "hep-th", "title": "Could four-dimensional $ϕ^4$ theory exist beyond the usual triviality arguments?", "abstract": "Do lattice triviality, suspected Borel non-summability and the perturbative Landau pole exclude an interacting four-dimensional theory satisfying the Osterwalder--Schrader axioms and reproducing every renormalized coefficient of positive-coupling $O(N)$ $\\phi^4$ theory? An example involving one real function separates vanishing cutoff limits along its allowed bare trajectories from a nonzero result obtained by renormalizing the coefficients first; an exponentially small correction preserves its expansion and removes the pole in its running coupling. For the massless two-point expansion of the singlet composite $\\Phi_a\\Phi_a$ at leading order in $1/N$, ordinary Borel summation fails even for Gaussian smearing. The arithmetic mean of two Borel integrals along opposite imaginary rays defines a real distribution on every four-dimensional Schwartz momentum or position test, with finite-order remainder bounds uniform on bounded test sets. Two alternative covariances with nonnegative mass spectral weights remove the Euclidean pole and construct generalized free fields. After a fixed contact subtraction, their Euclidean extensions preserve every coefficient of the collective correlations obtained by Wick pairing. The interacting finite-$N$ family remains open. We also state a conditional interacting route through the physical scalar correlations of a larger theory (the parent) with heavy particles. A concrete $N=1$ gauge--Higgs--fermion candidate has a tuned one-loop trajectory on which all interaction couplings tend to zero in the ultraviolet, and a stable tree vacuum with additional masses comparable to the heavy scale. Constructing the parent and its corrected ultraviolet trajectory, and proving coefficient decoupling and the exact remainder bounds as the quartic coupling tends to zero and the family's heavy masses grow, remain open.", "url": "https://arxiv.org/abs/2610.12672", "type": "理论", "summary": "格子平凡性、可疑的 Borel 不可求和性和微扰朗道极点是否排除了满足 Osterwalder-Schrader 公理并再现正耦合 $O(N)$ $\\phi^4$ 理论的每个重整化系数的相互作用的四维理论？涉及一个实函数的示例将沿其允许的裸轨迹的消失截止极限与首先对系数进行重新归一化获得的非零结果分开；指数级的小修正可保持其膨胀并消除其运行耦合中的极点。对于 $1/N$ 中前导单重态复合 $\\Phi_a\\Phi_a$ 的无质量两点展开，即使对于高斯涂抹，普通 Borel 求和也会失败。沿相反虚射线的两个 Borel 积分的算术平均值定义了每个四维 Schwartz 动量或位置测试的实分布，有限阶余数边界在有界测试集上均匀。具有非负质谱权重的两个替代协方差消除了欧几里德极点并构造了广义自由场。\n\n经过固定接触减法后，它们的欧几里得扩展保留了通过威克配对获得的集体相关性的每个系数。相互作用的有限-$N$ 家族仍然开放。我们还通过更大的理论（母体）与重粒子的物理标量相关性来陈述条件相互作用路径。一个具体的$N=1$规范——希格斯——费米子候选者具有调谐的单环轨迹，在该轨迹上，所有相互作用耦合在紫外线中趋于零，并且具有与重尺度相当的额外质量的稳定的树真空。构建母体及其校正的紫外线轨迹，并证明系数解耦和随着四次耦合趋于零且家庭的重质量增长的精确余数界限，仍然是开放的。", "authors": [{"name": "Anton Ragin"}], "featured_authors": [{"name": "Anton Ragin"}], "author_count": 1}, {"id": "2610.12825", "category": "hep-th", "title": "Brane space localization and genus-0 T-duality with $H$-flux", "abstract": "We construct a geometric theory on the brane space $S^2M=C^\\infty(S^2,M)$ associated to a gerbe with connection on $M$. Normalized logarithmic holonomy around the latitude circles defines an average holonomy line bundle on the brane space, whose connection and averaged flux give an equivariantly flat superconnection. We prove that the completed periodic exotic twisted cohomology defined by this superconnection localizes to the twisted cohomology of $M$. This {\\bf brane space localization} happens in two stages: circle localization lands on the free path space of $M$, and contracting the paths, after a correction of the twisting form, brings us back to $M$. Parallel transport along the meridians lets us average gerbe module connections, after which the circular iterated-integral construction applies. The resulting {\\bf twisted brane Bismut-Chern forms} restrict to the twisted Chern forms on $M$; their variation is described by {\\bf twisted brane Bismut-Chern-Simons forms.} For a T-dual pair, transporting the classical Hori morphisms through localization yields {\\bf graded genus-0 T-duality} on brane cohomology. The composite of each morphism with its dual is minus the Euler operator in the level variable, so these morphisms are isomorphisms at every nonzero level. At level one these morphisms are compatible with the brane character and twisted $K$-theory T-duality.", "url": "https://arxiv.org/abs/2610.12825", "type": "理论", "summary": "我们在膜空间 $S^2M=C^\\infty(S^2,M)$ 上构建了一个几何理论，该膜空间与与 $M$ 连接的非洲菊相关联。纬度圆周围的归一化对数完整线定义了膜空间上的平均完整线束，其连接和平均通量给出了等变平坦的超连接。我们证明由该超连接定义的完整周期奇异扭曲上同调局部化于 $M$ 的扭曲上同调。这种{\\bf膜空间定位}发生在两个阶段：圆定位落在$M$的自由路径空间上，并且在修正扭曲形式之后收缩路径，使我们回到$M$。沿着经络的并行传输让我们可以平均 gerbe 模块连接，然后应用循环迭代积分构造。由此产生的{\\bf 扭曲膜 Bismut-Chern 形式} 仅限于 $M$ 上的扭曲 Chern 形式；它们的变化由{\\bf 扭曲膜 Bismut-Chern-Simons 形式描述。}对于 T-对偶，通过局部化传输经典 Hori 态射会在膜上同调上产生 {\\bf 分级 genus-0 T-对偶性}。\n\n每个态射与其对偶的复合减去级别变量中的欧拉算子，因此这些态射在每个非零级别都是同构的。在第一级，这些态射与膜特征和扭曲的 $K$ 理论 T 对偶性兼容。", "authors": [{"name": "Fei Han"}, {"name": "Varghese Mathai"}], "featured_authors": [{"name": "Fei Han"}, {"name": "Varghese Mathai"}], "author_count": 2}, {"id": "2610.13016", "category": "hep-th", "title": "Distinguishing Flat and Warped Extra Dimensions with Unruh-DeWitt Detectors", "abstract": "We examine the response of a two level Unruh-DeWitt (UD) detector interacting with the Kaluza-Klein (KK) mass modes of a bulk scalar field in extra dimensional models. Considering two of the promising extra dimensional models with distinct compactifications, such as large, flat extra dimensions in the Arkani Hamed, Dimopoulos \\& Dvali (ADD) framework and warped extra dimensions in the Randall-Sundrum (RS) scenario, we compute the profile function of the detector. We extend this computation to the 6 dimensional doubly compactified spacetime geometry. The profile function of the detector has been examined as a function of the energy gap of the detector, the compactification radius of the extra dimension, and the dimensionality of spacetime, requiring the chosen parameter space appropriately such that the gauge hierarchy problem is duly addressed. We find that the pattern of the profile function is dictated by the spacing of the KK mass spectrum and the resolution of the detector. For ADD model, the spacing between successive KK modes decreases with the increasing compactification radius, yielding a smoothly increasing continuum pattern in the profile function. Whereas for the RS warped geometry model, a tiny deviation in the radius of the extra dimension produces a large change in the same, resulting a sharp increment. The resolvability of the KK mode structure is sensitive to the underlying geometry of the spacetime, providing a qualitative distinction between flat and warped extra dimensional scenarios within the UD detector framework.", "url": "https://arxiv.org/abs/2610.13016", "type": "理论", "summary": "我们检查了两级 Unruh-DeWitt (UD) 探测器与超维模型中体标量场的 Kaluza-Klein (KK) 质量模式相互作用的响应。考虑到两个有前途的具有明显压缩性的额外维度模型，例如 Arkani Hamed、Dimopoulos & Dvali (ADD) 框架中的大而平坦的额外维度以及 Randall-Sundrum (RS) 场景中的扭曲额外维度，我们计算了检测器的轮廓函数。我们将此计算扩展到 6 维双重紧致时空几何。探测器的轮廓函数已被检查为探测器能隙、额外维度的压缩半径和时空维数的函数，需要适当选择参数空间，以便适当解决规范层次问题。我们发现轮廓函数的模式由 KK 质谱的间距和探测器的分辨率决定。对于 ADD 模型，连续 KK 模式之间的间距随着压实半径的增加而减小，在剖面函数中产生平滑增加的连续模式。\n\n而对于RS扭曲几何模型，额外维度半径的微小偏差会产生很大的变化，从而导致急剧的增量。 KK 模式结构的分辨率对时空的基本几何结构很敏感，从而在 UD 探测器框架内对平坦和扭曲的超维场景进行定性区分。", "authors": [{"name": "Ashmita Das"}, {"name": "Anjana Krishnan"}, {"name": "Soumitra Sengupta"}], "featured_authors": [{"name": "Ashmita Das"}, {"name": "Anjana Krishnan"}, {"name": "Soumitra Sengupta"}], "author_count": 3}, {"id": "2610.13150", "category": "hep-th", "title": "Disformal Closure Selects 3D Scalar-Tensor Gravity without Local Bulk Modes", "abstract": "Three-dimensional Einstein gravity has no local degrees of freedom, yet retains rich global and black-hole physics. Adding a scalar normally spoils this. We show that closure of three-dimensional Horndeski gravity under disformal field redefinitions selects a square-root curvature interaction. A nonlinear analysis finds no local bulk modes on regular branches, while an independent Hamiltonian analysis confirms the result on the timelike-gradient branch. This extends the no-local-bulk-dynamics paradigm beyond pure Einstein gravity and motivates studying its boundary and global sectors.", "url": "https://arxiv.org/abs/2610.13150", "type": "理论", "summary": "三维爱因斯坦引力没有局部自由度，但保留了丰富的全局和黑洞物理学。添加标量通常会破坏这一点。我们证明，在不规则场重定义下三维 Horndeski 引力的闭合选择了平方根曲率相互作用。非线性分析在规则分支上没有发现局部体模式，而独立的哈密顿分析证实了类时梯度分支上的结果。这将非局域体积动力学范式扩展到纯爱因斯坦引力之外，并激发了研究其边界和全局部分的动力。", "authors": [{"name": "M. Shams Nejati"}, {"name": "M.H. Vahidinia"}], "featured_authors": [{"name": "M. Shams Nejati"}, {"name": "M.H. Vahidinia"}], "author_count": 2}, {"id": "2610.13191", "category": "hep-th", "title": "Dirac-Born-Infeld action from inequivalent representations of open strings", "abstract": "We study open strings in a constant magnetic field from the viewpoint of universal canonical variables. Using a conserved Klein-Gordon-type pairing, we show that the canonical commutation relations remain background independent in the distributional sense, while the background dependence is encoded in the mode representation. The Bogoliubov transformation between different magnetic backgrounds is not unitarily implementable, so that the corresponding Fock representations are inequivalent. Nevertheless, the transformation determines the relative normalization of the vacua. We show that the resulting relative vacuum normalization precisely reproduces the relative boundary $g$-function, or equivalently the magnetic-field-dependent part of the disk amplitude, and yields the Dirac-Born-Infeld factor. Thus the disk normalization is encoded directly in the transformation between inequivalent representations of universal open-string variables.", "url": "https://arxiv.org/abs/2610.13191", "type": "理论", "summary": "我们从通用正则变量的角度研究恒定磁场中的开弦。使用保守的克莱因-戈登型配对，我们表明规范交换关系在分布意义上保持背景独立，而背景依赖性被编码在模式表示中。不同磁背景之间的Bogoliubov变换不能统一实现，因此相应的Fock表示是不等价的。然而，这种转变决定了真空的相对标准化。我们表明，由此产生的相对真空归一化精确地再现了相对边界 $g$ 函数，或者等效地磁盘振幅的磁场相关部分，并产生了狄拉克-玻恩-因菲尔德因子。因此，磁盘标准化直接编码在通用开串变量的不等价表示之间的转换中。", "authors": [{"name": "Isao Kishimoto"}, {"name": "Tomohiko Takahashi"}, {"name": "Ayane Tezuka"}], "featured_authors": [{"name": "Isao Kishimoto"}, {"name": "Tomohiko Takahashi"}, {"name": "Ayane Tezuka"}], "author_count": 3}, {"id": "2610.13240", "category": "hep-th", "title": "The origin of amplitude chaos and strings", "abstract": "We analytically study the peak statistics of an amplitude ensemble to identify the local mechanism responsible for peak repulsion. Our analytical approaches show that a smooth, nondegenerate ensemble of sufficiently differentiable amplitudes exhibits quartic nearest-neighbor repulsion, $p_{\\rm nn}(S)\\sim S^4$, where $S$ is the spacing between adjacent peaks. We verify this prediction numerically for the tree-level highly excited string scattering amplitudes. Interestingly, we find the quartic repulsion to be robust by varying both the underlying ensemble and the amplitude functions, whereas a tunable cusp model shows that weakening differentiability changes the strength of the repulsion. Peak repulsion therefore defines a local universality class that is not unique to string theory and may occur in amplitude ensembles in other theories.", "url": "https://arxiv.org/abs/2610.13240", "type": "理论", "summary": "我们分析研究振幅系综的峰值统计数据，以确定导致峰值排斥的局部机制。我们的分析方法表明，具有足够可微幅度的平滑、非简并系综表现出四次最近邻排斥，$p_{\\rm nn}(S)\\sim S^4$，其中 $S$ 是相邻峰值之间的间距。我们对树级高度激发弦散射振幅的这一预测进行了数值验证。有趣的是，我们发现通过改变基础系综和振幅函数，四次斥力变得鲁棒，而可调尖点模型表明，减弱可微性会改变斥力的强度。因此，峰值斥力定义了一个局部普遍性类别，该类别并非弦理论所独有，并且可能出现在其他理论中的振幅系综中。", "authors": [{"name": "Pallab Basu"}, {"name": "Anurag Sarkar"}], "featured_authors": [{"name": "Pallab Basu"}, {"name": "Anurag Sarkar"}], "author_count": 2}, {"id": "2610.13284", "category": "hep-th", "title": "The Casimir energy in Maxwell-Chern-Simons electrodynamics with various perfect electric or magnetic boundary condition combinations", "abstract": "We investigate the Casimir effect between two parallel wires in $(2+1)D$ Maxwell-Chern-Simons (MCS) electrodynamics under different boundary conditions and separated by a distance $L$. Using a functional approach in which the boundary constraints are implemented by auxiliary fields localized on the wires, we integrate out the gauge field and derive an effective boundary theory whose functional determinant allows us to compute the Casimir energy. We consider perfect electric conductor (PEC), perfect magnetic conductor (PMC), and infinitely permeable (PMC2) boundary conditions. For two PEC wires, we recover the known MCS result and show that it coincides with the result obtained in the Abelian limit of the Curci-Ferrari (CF) model, implying that the Casimir effect in this case probes the photon mass $\\mu$ but not its origin. The same energy is obtained for two PMC2 wires. In sharp contrast, the Casimir energy vanishes identically for the covariant PMC condition in MCS theory, both for PMC-PMC and PEC-PMC. Since this cancellation does not occur in the CF model, it could provide a signature of the topological origin of the photon mass in $(2+1)D$. Finally, the PEC-PMC2 case yields a non-vanishing Casimir force and reproduces the known result for a perfectly conducting wire facing an infinitely permeable one. Interestingly enough, we show that for PEC-PMC2, the Casimir force in the MCS theory is smaller than the one of the CF model for any $L,\\mu >0$. Our results thus show that, depending on the boundary conditions, the Casimir effect could probe not only the photon mass but also reveal signatures of its origin.", "url": "https://arxiv.org/abs/2610.13284", "type": "理论", "summary": "我们研究了不同边界条件下 $(2+1)D$ Maxwell-Chern-Simons (MCS) 电动力学中两条平行线之间的卡西米尔效应，且两条平行线之间的距离为 $L$。使用一种函数方法，其中边界约束是由位于导线上的辅助场实现的，我们对规范场进行积分并导出有效的边界理论，其函数行列式允许我们计算卡西米尔能量。我们考虑完美电导体 (PEC)、完美磁导体 (PMC) 和无限磁导 (PMC2) 边界条件。对于两根 PEC 线，我们恢复了已知的 MCS 结果，并表明它与 Curci-Ferrari (CF) 模型的阿贝尔极限中获得的结果一致，这意味着在这种情况下卡西米尔效应探测的是光子质量 $\\mu$，而不是其起源。两条 PMC2 线获得相同的能量。与此形成鲜明对比的是，对于 PMC-PMC 和 PEC-PMC，MCS 理论中的协变 PMC 条件下卡西米尔能量同样消失。由于这种抵消不会在 CF 模型中发生，因此它可以在 $(2+1)D$ 中提供光子质量的拓扑起源的签名。\n\n最后，PEC-PMC2 案例产生不消失的卡西米尔力，并再现了完美导线面对无限导磁导线的已知结果。有趣的是，我们表明，对于 PEC-PMC2，MCS 理论中的卡西米尔力小于 CF 模型中任意 $L,\\mu >0$ 的卡西米尔力。因此，我们的结果表明，根据边界条件，卡西米尔效应不仅可以探测光子质量，还可以揭示其起源的特征。", "authors": [{"name": "Philipe De Fabritiis"}, {"name": "Wellisson B. De Lima"}, {"name": "David Dudal"}], "featured_authors": [{"name": "Philipe De Fabritiis"}, {"name": "Wellisson B. De Lima"}, {"name": "David Dudal"}], "author_count": 3}, {"id": "2610.13286", "category": "hep-th", "title": "Confining Random Potential Quantum Mechanics for Jackiw-Teitelboim Gravity", "abstract": "We formulate perturbative Jackiw-Teitelboim gravity as an ensemble of ordinary one-dimensional Hamiltonians with a confining random potential. The leading profile reproduces the disk density of states, while connected cumulants of a single master field encode the topological expansion. After formulating the cumulant power counting required by the topological expansion, we show that the cumulants reproduce all genus-zero multi-boundary amplitudes $\\mathcal Z_{0,n}$. At higher genus, we show that a renormalization scheme can be chosen consistently order by order so that imposing one-boundary polynomiality recursively reproduces the perturbative JT string equation and yields the standard JT one-boundary amplitudes $\\mathcal Z_{g,1}$. The framework provides a self-contained finite-$S_0$ quantum dynamics with a discrete spectrum and unitary real time evolution, beyond a mere rewriting of the matrix integral. The same confining dynamics also underlies late-time saturation and the dynamical avoidance of the would-be black hole singularity, as shown in our earlier work.", "url": "https://arxiv.org/abs/2610.13286", "type": "理论", "summary": "我们将微扰 Jackiw-Teitelboim 引力公式化为具有有限随机势的普通一维哈密顿量的集合。引导轮廓再现了状态的盘密度，而单个主场的连接累积量编码了拓扑扩展。在制定拓扑展开所需的累积功率计数后，我们表明累积量再现了所有属零多边界振幅 $\\mathcal Z_{0,n}$。在更高的属下，我们表明可以一致地按顺序选择重整化方案，以便施加一边界多项式递归地再现微扰 JT 弦方程并产生标准 JT 一边界振幅 $\\mathcal Z_{g,1}$。该框架提供了一个独立的有限$S_0$量子动力学，具有离散谱和酉实时演化，而不仅仅是矩阵积分的重写。正如我们早期的工作所示，同样的限制动力学也是后期饱和和潜在黑洞奇点的动力学避免的基础。", "authors": [{"name": "Dongsu Bak"}, {"name": "Chanju Kim"}, {"name": "Sang-Heon Yi"}], "featured_authors": [{"name": "Dongsu Bak"}, {"name": "Chanju Kim"}, {"name": "Sang-Heon Yi"}], "author_count": 3}, {"id": "2610.13289", "category": "hep-th", "title": "Codimension-Zero Holographic Complexity and Spectral Three-Point Correlators", "abstract": "Holographic complexity is expected to capture the linear growth of black hole interiors, with quantum corrections ultimately leading to a late-time saturation. We develop a spectral formulation of holographic complexity measures associated with codimension-zero bulk regions in the framework of the complexity=anything proposal. The corresponding generating function of complexity is governed by three-point correlation functions of the density of states, establishing a direct connection between bulk geometric observables and nonperturbative Euclidean spacetime wormholes. We find that the codimension-zero holographic complexity reduces to the sum of two codimension-one contributions and exhibits a universal time evolution, characterized by an exponentially long regime of linear growth followed by saturation at the Heisenberg time. The late-time plateau is a direct result of the spectral level repulsion, a generic feature of quantum chaotic systems, thereby providing a universal mechanism for the saturation of holographic complexity. We also develop a complementary operator interpretation, in which Euclidean wormhole corrections render the semiclassical basis of fixed-complexity states overcomplete. Constructing a complete orthonormal basis then yields well-defined holographic complexity operators that reproduce the same universal time evolution. Our results establish a unified connection among black hole interiors, chaotic spectral statistics, and Euclidean wormholes in quantum gravity.", "url": "https://arxiv.org/abs/2610.13289", "type": "理论", "summary": "全息复杂性预计将捕获黑洞内部的线性增长，并通过量子校正最终导致后期饱和。我们在复杂性=任何提议的框架中开发了与余维零块区域相关的全息复杂性度量的光谱公式。相应的复杂度生成函数由状态密度的三点相关函数控制，在体几何可观测量和非微扰欧几里德时空虫洞之间建立直接联系。我们发现零维全息复杂性降低到两个余维一贡献的总和，并表现出普遍时间演化，其特征是指数长的线性增长状态，然后在海森堡时间饱和。后期平台是光谱级排斥的直接结果，这是量子混沌系统的一般特征，从而为全息复杂性的饱和提供了通用机制。\n\n我们还开发了一种补充算子解释，其中欧几里得虫洞修正使固定复杂度状态的半经典基础变得过于完整。构建完整的正交基然后产生定义良好的全息复杂性算子，再现相同的通用时间演化。我们的结果在黑洞内部、混沌光谱统计和量子引力中的欧几里德虫洞之间建立了统一的联系。", "authors": [{"name": "Masamichi Miyaji"}, {"name": "Shan-Ming Ruan"}, {"name": "Shono Shibuya"}, {"name": "Kazuyoshi Yano"}], "featured_authors": [{"name": "Masamichi Miyaji"}, {"name": "Shan-Ming Ruan"}, {"name": "Shono Shibuya"}, {"name": "Kazuyoshi Yano"}], "author_count": 4}, {"id": "2610.13323", "category": "hep-th", "title": "General relativity and its modifications as effective field theories of $GL(4)$ breaking", "abstract": "We discuss General Relativity and some of its modifications as effective field theories of the breaking of the affine general linear group using the coset approach and the Maurer-Cartan form. While the ultimate goal is to break the symmetry down to the Lorentz subgroup, we argue that there are three interesting breaking cascades in which the affine general linear group is first broken to a larger subgroup that contains the Lorentz group. In all cases, the breaking of translations always generates Goldstone modes that can be interpreted as metric degrees of freedom. We argue that the effective field theories that emerge as a result of the different breaking patterns are all dynamically equivalent at the lowest order of the derivative expansion, e.g., using Einstein-Hilbert-like actions, but can differ beyond the leading order.", "url": "https://arxiv.org/abs/2610.13323", "type": "理论", "summary": "我们讨论广义相对论及其一些修改，作为使用陪集方法和毛雷尔-嘉当形式破除仿射广义线性群的有效场论。虽然最终目标是将对称性分解为洛伦兹群，但我们认为存在三个有趣的分解级联，其中仿射一般线性群首先被分解为包含洛伦兹群的更大子群。在所有情况下，平移的破坏总是会产生可以解释为公制自由度的戈德斯通模式。我们认为，由于不同断裂模式而出现的有效场论在导数展开的最低阶上都是动态等效的，例如，使用类似爱因斯坦-希尔伯特的作用，但可以在主导阶之外有所不同。", "authors": [{"name": "Tommaso Viacava"}, {"name": "Omar Zanusso"}], "featured_authors": [{"name": "Tommaso Viacava"}, {"name": "Omar Zanusso"}], "author_count": 2}, {"id": "2610.13377", "category": "hep-th", "title": "On the quantum statistical relation and the covariant phase space Hamiltonian", "abstract": "We show how the covariant phase space Hamiltonian can be constructed in theories in which some of the fields have gauge freedoms. The addition to the action of boundary terms that guarantee the well-posedness of a variational principle and its exact gauge invariance for the prescribed boundary conditions turn out to be essential in this construction. The same ingredients are essential in the use of the action in the framework of Gibbons and Hawking's Euclidean approach to Quantum Gravity and we show how the on-shell action constructed with a Lagrangian with those properties can be expressed in terms of the covariant phase space Hamiltonian. We compute the Hamiltonian of several theories, one of which has Chern--Simons terms, using our prescription and show that, in black-hole backgrounds, the Hamiltonian gives directly the quantum statistical relation including terms related to non-gravitational charges and chemical potentials, as expected.", "url": "https://arxiv.org/abs/2610.13377", "type": "理论", "summary": "我们展示了如何在某些场具有规范自由度的理论中构造协变相空间哈密顿量。添加边界项的作用，保证变分原理的适定性及其在规定边界条件下的精确规范不变性，在这种构造中至关重要。在吉本斯和霍金的量子引力欧几里得方法框架中使用作用时，相同的成分是必不可少的，我们展示了如何用具有这些属性的拉格朗日构造的壳上作用可以用协变相空间哈密顿量来表达。我们使用我们的处方计算了几种理论的哈密顿量，其中之一具有陈-西蒙斯项，并表明，在黑洞背景中，哈密顿量直接给出了量子统计关系，包括与非引力电荷和化学势相关的项，正如预期的那样。", "authors": [{"name": "José Luis V. Cerdeira"}, {"name": "Tomás Ortín"}], "featured_authors": [{"name": "José Luis V. Cerdeira"}, {"name": "Tomás Ortín"}], "author_count": 2}, {"id": "2610.13389", "category": "hep-th", "title": "Dualities, symmetries and the elliptic genus of 2d (0,2) SCFTs", "abstract": "While naively simpler than its higher dimensional cousins, 2d physics still has its own share of puzzles. An example of this is instances of dualities of $(0,2)$ theories, passing all consistency checks save for a mismatch in global symmetry. This is common when said duality can be motivated by dimensional reduction of a duality of 4d $\\mathcal{N}=1$ theories where said symmetry emerges in 2d, often from an anomalous 4d symmetry. It is commonly believed that these symmetries are broken in the 2d theory, though often the mechanism for such breaking is not understood. We examine various appearances of this phenomenon and show that in these cases the elliptic genus shows signs of the presence of marginal operators that can break these symmetries. Interestingly, these operators do not appear perturbatively but emerge from the calculation, raising the question of what operators the $(0,2)$ elliptic genus actually counts. This provides a potential mechanism to overcome the discrepancy in symmetry, though we point out some potential subtleties.", "url": "https://arxiv.org/abs/2610.13389", "type": "理论", "summary": "虽然二维物理学比它的高维同类简单得多，但它仍然有自己的难题。这方面的一个例子是 $(0,2)$ 理论的对偶性实例，通过了除全局对称性不匹配之外的所有一致性检查。当所述对偶性可以通过 4d $\\mathcal{N}=1$ 理论的对偶性降维来激发时，这种情况很常见，其中所述对称性出现在 2d 中，通常来自反常的 4d 对称性。人们普遍认为，这些对称性在二维理论中被破坏，尽管这种破坏的机制常常不被理解。我们检查了这种现象的各种表现，并表明在这些情况下，椭圆亏格显示出可以打破这些对称性的边际算子存在的迹象。有趣的是，这些运算符并不是扰动地出现，而是从计算中出现，这就提出了 $(0,2)$ 椭圆属实际上算什么运算符的问题。尽管我们指出了一些潜在的微妙之处，但这提供了克服对称性差异的潜在机制。", "authors": [{"name": "Salomon Malka"}, {"name": "Gabi Zafrir"}], "featured_authors": [{"name": "Salomon Malka"}, {"name": "Gabi Zafrir"}], "author_count": 2}, {"id": "2610.13501", "category": "hep-th", "title": "Integrable auxiliary field sigma model and the metric approach to $T\\bar{T}$-like deformations", "abstract": "We describe a family of two-dimensional metric deformations that preserve integrability. The seeds are (classically) conformal integrable field theories and the deformations are directly related to different classes of auxiliary field sigma models. We introduce a master action connecting deformations by Lie-algebra-valued auxiliary fields, the so-called $\\nu$-frame, to deformations by two Lorentz-charged scalars. These auxiliary scalar fields can be identified as Beltrami differentials of an auxiliary two-dimensional metric, providing a direct connection with the metric approach to $T\\bar{T}$-like deformations. For Weyl-invariant seed matter theories, the auxiliary metric sector is described by a reduced gravitational potential. We show that the resulting framework preserves classical Lax integrability whenever the seed matter theory admits a Lax representation of its equations of motion on a generic curved two-dimensional spacetime. Finally, within the Lorentz-invariant family and the zweibein deformations of conformal matter theories considered here, we identify $T\\bar{T}$ as the only deformation that can be interpreted as a field-dependent coordinate transformation.", "url": "https://arxiv.org/abs/2610.13501", "type": "理论", "summary": "我们描述了一系列保持可积性的二维度量变形。种子是（经典的）共形可积场论，变形与不同类别的辅助场西格玛模型直接相关。我们引入了一个主动作，将李代数辅助场（所谓的 $\\nu$ 框架）的变形与两个洛伦兹荷电标量的变形连接起来。这些辅助标量场可以被识别为辅助二维度量的贝尔特拉米微分，提供与$T\\bar{T}$类变形的度量方法的直接连接。对于韦尔不变种子物质理论，辅助度量扇区由减小的引力势来描述。我们表明，只要种子物质理论承认其运动方程在通用弯曲二维时空上的 Lax 表示，所得框架就保留了经典的 Lax 可积性。最后，在洛伦兹不变族和这里考虑的共形物质理论的 zweibein 变形中，我们将 $T\\bar{T}$ 确定为唯一可以解释为场相关坐标变换的变形。", "authors": [{"name": "Nicola Baglioni"}, {"name": "Daniele Bielli"}, {"name": "Parita Shah"}, {"name": "Gabriele Tartaglino-Mazzucchelli"}], "featured_authors": [{"name": "Nicola Baglioni"}, {"name": "Daniele Bielli"}, {"name": "Parita Shah"}, {"name": "Gabriele Tartaglino-Mazzucchelli"}], "author_count": 4}, {"id": "2610.13555", "category": "hep-th", "title": "Holographic Krylov complexity in confining backgrounds: particle, string, and frames", "abstract": "We investigate holographic Krylov complexity in bottom-up holographic QCD models describing the confined phase, using the recently proposed correspondence between the growth rate of Krylov complexity and the proper radial momentum of probes, such as particles and strings, falling in the bulk spacetime. As representative confining backgrounds, we consider two horizonless geometries, namely the dilaton-deformed AdS-soliton and the deformed thermal-AdS spacetime, both arising as solutions of an Einstein-dilaton gravity system. We find that the Krylov complexity associated with a massive particle exhibits qualitatively distinct behavior in these two backgrounds when analyzed in the Einstein frame. In the deformed AdS-soliton geometry, the complexity undergoes periodic oscillations, with both the oscillation period and amplitude depending on the parameters of the model. In contrast, in the deformed thermal-AdS geometry, the complexity grows exponentially at late times and does not display oscillatory behavior. We then investigate string dynamics in the string frame and find that the Krylov complexity exhibits oscillatory behavior in both confining backgrounds. This behavior is traced to the emergence of an additional turning point in the deep infrared of the string-frame geometry. Motivated by this observation, we further analyze massive-particle dynamics in the string frame, where we find qualitatively similar behavior in the two confining backgrounds. Our results demonstrate that the Krylov complexity of confined holographic systems depends sensitively on the choice of probe and frame, while also revealing a closer correspondence between the two confining geometries in the string-frame description.", "url": "https://arxiv.org/abs/2610.13555", "type": "理论", "summary": "我们利用最近提出的克雷洛夫复杂度的增长率与落入大体积时空中的探针（例如粒子和弦）的适当径向动量之间的对应关系，研究了描述受限相的自下而上的全息 QCD 模型中的全息克雷洛夫复杂度。作为代表性的限制背景，我们考虑两种无水平几何，即膨胀变形的 AdS 孤子和变形的热 AdS 时空，它们都是作为爱因斯坦膨胀引力系统的解而出现的。我们发现，在爱因斯坦框架中进行分析时，与大质量粒子相关的克雷洛夫复杂度在这两个背景下表现出性质不同的行为。在变形的 AdS 孤子几何结构中，复杂性经历周期性振荡，振荡周期和振幅都取决于模型的参数。相比之下，在变形的热 AdS 几何结构中，复杂性在后期呈指数增长，并且不表现出振荡行为。然后，我们研究了弦框架中的弦动力学，发现克雷洛夫复杂度在两个限制背景下都表现出振荡行为。\n\n这种行为可以追溯到弦框架几何结构的深红外区域中另一个转折点的出现。受这一观察的启发，我们进一步分析了弦框架中的大粒子动力学，我们发现两个限制背景中的性质相似的行为。我们的结果表明，受限全息系统的克雷洛夫复杂度敏感地取决于探针和框架的选择，同时也揭示了弦框架描述中两个受限几何形状之间更紧密的对应关系。", "authors": [{"name": "Jasper Nongmaithem"}, {"name": "Deepak Kumar Kar"}, {"name": "Ayush Kumar"}, {"name": "Shreeya Rajesh Parab"}, {"name": "David Dudal"}, {"name": "Subhash Mahapatra"}], "featured_authors": [{"name": "Jasper Nongmaithem"}, {"name": "Deepak Kumar Kar"}, {"name": "Ayush Kumar"}, {"name": "Shreeya Rajesh Parab"}, {"name": "David Dudal"}, {"name": "Subhash Mahapatra"}], "author_count": 6}, {"id": "2610.13566", "category": "hep-th", "title": "Robustness of exact $SU(N)$ Einstein-Skyrme solutions: black holes, wormholes and cosmologies", "abstract": "The $SU(2)$ Skyrme model admits exact solutions when coupled to General Relativity in four spacetime dimensions. Here, we demonstrate that relevant gravitational configurations, such as black holes, wormholes, and cosmologies, are robust under the extension to $SU(N)$ with an arbitrary number of flavors. We show that key physical features, such as the thermodynamic properties, the baryon number of the configurations, and the geometry, are crucially determined by the number of flavors as well as the coupling constants of the theory. In particular: first, we prove that an increase in the matter content favors the local thermal stability of spherically symmetric black holes. Second, for cosmological solutions, we demonstrate analytically that as the hadronic matter content increases, the scale factor grows more slowly due to enhanced gravitational attraction, while the expansion rate (measured by the Hubble parameter) increases as a consequence of the higher energy density. Third, we find that the throat of traversable wormhole solutions can be enlarged by increasing the number of flavors, since the energy density required to keep the throat open does not grow indefinitely but rather saturates at a finite value.", "url": "https://arxiv.org/abs/2610.13566", "type": "理论", "summary": "当与四个时空维度的广义相对论耦合时，$SU(2)$ Skyrme 模型承认精确解。在这里，我们证明了相关的引力构型，例如黑洞、虫洞和宇宙学，在任意数量的 $SU(N)$ 的扩展下是鲁棒的。我们表明，关键的物理特征，例如热力学性质、构型的重子数和几何形状，在很大程度上取决于味道的数量以及理论的耦合常数。特别是：首先，我们证明物质含量的增加有利于球对称黑洞的局部热稳定性。其次，对于宇宙学解决方案，我们通过分析证明，随着强子物质含量的增加，由于引力的增强，尺度因子增长得更慢，而膨胀率（通过哈勃参数测量）由于能量密度的提高而增加。\n\n第三，我们发现可穿越虫洞解决方案的喉咙可以通过增加味道的数量来扩大，因为保持喉咙打开所需的能量密度不会无限期地增长，而是在有限值处饱和。", "authors": [{"name": "Carla Henríquez-Baez"}, {"name": "Perla Medina"}, {"name": "Pablo Rodríguez"}, {"name": "Aldo Vera"}], "featured_authors": [{"name": "Carla Henríquez-Baez"}, {"name": "Perla Medina"}, {"name": "Pablo Rodríguez"}, {"name": "Aldo Vera"}], "author_count": 4}, {"id": "2610.13575", "category": "hep-th", "title": "Dynamical symmetry breaking in a non-polynomial four-fermion model", "abstract": "We present a new four-fermion model with a strongly non-polynomial coupling. To eliminate these non-polynomialities, we introduce two auxiliary vector fields and show that the dynamical Lorentz symmetry breaking is possible in our theory, as revealed by the effective potential generated for these vector fields. We explicitly calculate the low-energy effective action for these fields, which is given by the sum of three Maxwell terms (one for each field and a mixed one) plus a potential term displaying nontrivial minima.", "url": "https://arxiv.org/abs/2610.13575", "type": "理论", "summary": "我们提出了一种具有强非多项式耦合的新四费米子模型。为了消除这些非多项式，我们引入了两个辅助向量场，并表明在我们的理论中动态洛伦兹对称性破缺是可能的，正如这些向量场生成的有效势所揭示的那样。我们明确计算这些场的低能有效作用，该作用由三个麦克斯韦项（每个场一个，一个混合项）加上一个显示非平凡最小值的势项之和给出。", "authors": [{"name": "J. F. Assunção"}, {"name": "T. Mariz"}, {"name": "A. Yu. Petrov"}, {"name": "V. Prata"}], "featured_authors": [{"name": "J. F. Assunção"}, {"name": "T. Mariz"}, {"name": "A. Yu. Petrov"}, {"name": "V. Prata"}], "author_count": 4}, {"id": "2610.13586", "category": "hep-th", "title": "G2 resolutions and backtracking in scale-separated AdS$_3$", "abstract": "We study scale-separated AdS$_3$ models with full moduli stabilization in massive IIA supergravity on G2 orientifolds. In addition to constructing new examples, we investigate the properties of these models once the singularities of the G2 toroidal orbifold are resolved. The blow-up moduli are shown to be stabilized using fluxes in a parametric regime that preserves scale separation and control under the supergravity approximation. We further show that the apparent orientifold intersections in the singular orbifold description do not exist on such resolved spaces. Finally, we analyze the brane dual picture of such models using flux backtracking. We highlight several interesting features from such analysis such as a finite interval solution of the resulting flow equations in some of the models and the desirable low-energy decoupling of brane modes.", "url": "https://arxiv.org/abs/2610.13586", "type": "理论", "summary": "我们研究了在 G2 东方褶皱上的大规模 IIA 超重力下具有完全模量稳定性的尺度分离 AdS$_3$ 模型。除了构建新的例子之外，一旦解决了 G2 环形轨道的奇点，我们就会研究这些模型的属性。结果表明，使用参数状态下的通量可以稳定爆炸模量，从而在超重力近似下保持尺度分离和控制。我们进一步表明，奇异轨道描述中明显的东方交叉点在这样的解析空间上不存在。最后，我们使用通量回溯分析此类模型的膜对偶图。我们强调了此类分析中的几个有趣的特征，例如某些模型中所得流动方程的有限区间解以及膜模式的理想低能量解耦。", "authors": [{"name": "Aviral Aggarwal"}, {"name": "Fien Apers"}, {"name": "Fotis Farakos"}], "featured_authors": [{"name": "Aviral Aggarwal"}, {"name": "Fien Apers"}, {"name": "Fotis Farakos"}], "author_count": 3}, {"id": "2610.13612", "category": "hep-th", "title": "The Gregory-Laflamme Instability of five-dimensional Black Strings in Einstein-Gauss-Bonnet Gravity", "abstract": "We complement and extend our recent study of the non-linear evolution of the Gregory-Laflamme instability of black strings in Einstein-Gauss-Bonnet gravity in five spacetime dimensions. First, we study time-dependent perturbations of uniform black strings in Einstein-Gauss-Bonnet theory and determine the growth rates as a function of the coupling. We find that for positive Gauss-Bonnet couplings, the black strings are more unstable than in general relativity in the sense that the growth rates are larger and shorter wavelengths are unstable. In the second part of the paper we show that the hyperbolicity of the equation of motion of Einstein-Gauss-Bonnet theory is determined by an effective metric when the dynamics is restricted to spherical symmetry in the asymptotically flat directions. When the effective field theory becomes strongly coupled, as it happens near the endpoint of the Gregory-Laflamme instability of the black string, this effective metric becomes degenerate and the Cauchy evolution breaks down. Applying this criterion to uniform black strings, we find that for any positive Gauss-Bonnet coupling there is an open set of regular solutions (including the one of minimal thickness) on which the effective metric degenerates in a neighbourhood of the horizon. Therefore, we argue that these solutions cannot be attained from weakly coupled initial data by Cauchy evolution and the solutions of the linearized equations around them cannot be interpreted as approximations to nearby non-linear evolutions. We provide further evidence for this picture with non-linear simulations of the Gregory-Laflamme instability. The non-linear simulations terminate through a loss of hyperbolicity of the Tricomi or Keldysh type, depending on the sign of the Gauss-Bonnet coupling.", "url": "https://arxiv.org/abs/2610.13612", "type": "理论", "summary": "我们补充并扩展了我们最近对五个时空维度中爱因斯坦-高斯-博内引力中黑弦格雷戈里-拉弗拉姆不稳定性非线性演化的研究。首先，我们研究爱因斯坦-高斯-博内特理论中均匀黑弦的时间相关扰动，并确定增长率作为耦合的函数。我们发现，对于正高斯-博内耦合，黑弦比广义相对论中的更不稳定，因为增长率更大并且较短的波长不稳定。在论文的第二部分中，我们证明了当动力学被限制在渐近平坦方向上的球对称性时，爱因斯坦-高斯-博内特理论运动方程的双曲性是由有效度量确定的。当有效场论变得强耦合时，当它发生在黑弦的格雷戈里-拉弗拉姆不稳定性的端点附近时，这个有效度量就会退化，柯西演化就会崩溃。\n\n将此准则应用于均匀黑弦，我们发现对于任何正高斯-邦内耦合，都存在一组开放的正则解（包括最小厚度的解），在该正则解上，有效度量在地平线的邻域内退化。因此，我们认为这些解不能通过柯西演化从弱耦合初始数据中获得，并且它们周围的线性化方程的解不能解释为附近非线性演化的近似。我们通过格雷戈里-拉弗拉姆不稳定性的非线性模拟为这幅图提供了进一步的证据。非线性模拟通过 Tricomi 或 Keldysh 类型的双曲性损失而终止，具体取决于高斯-博内耦合的符号。", "authors": [{"name": "Pau Figueras"}, {"name": "Áron D. Kovács"}, {"name": "Shunhui Yao"}], "featured_authors": [{"name": "Pau Figueras"}, {"name": "Áron D. Kovács"}, {"name": "Shunhui Yao"}], "author_count": 3}, {"id": "2610.13667", "category": "hep-th", "title": "A discrete analogue of $\\mathscr{N}=2$ super Weil-Petersson volumes", "abstract": "We introduce a discrete spectral curve from $\\mathscr{N}=2$ double-scaled SYK whose topological recursion defines quasi-polynomial volumes in integer boundary lengths. The curve has two edge theories: a local $\\mathscr{N}=2$ theory at the lower edge and a bosonic theory at the upper edge. Focusing on the local $\\mathscr{N}=2$ theory, we compute its finite-$q$ volumes and independently check the first few using the string equation. In the $q\\rightarrow 1$ continuum limit, these recover the super Weil-Petersson volumes of Turiaci and Witten. Finally, we give an all-genus intersection-theoretic interpretation of these local volumes on the moduli space of stable marked curves, in terms of a deformed spin class with a gap-dependent $\\kappa$-class dressing.", "url": "https://arxiv.org/abs/2610.13667", "type": "理论", "summary": "我们从 $\\mathscr{N}=2$ 双尺度 SYK 引入离散谱曲线，其拓扑递归定义了整数边界长度的拟多项式体积。该曲线有两个边缘理论：下边缘的局部 $\\mathscr{N}=2$ 理论和上边缘的玻色子理论。着眼于局部 $\\mathscr{N}=2$ 理论，我们计算其有限 $q$ 体积并使用弦方程独立检查前几个。在 $q\\rightarrow 1$ 连续统极限中，这些恢复了 Turiaci 和 Witten 的超级 Weil-Petersson 体积。最后，我们根据具有间隙相关 $\\kappa$ 类敷料的变形自旋类，对这些局部体积在稳定标记曲线的模空间上给出了全属相交理论解释。", "authors": [{"name": "Wasif Ahmed"}, {"name": "Joydeep Naskar"}], "featured_authors": [{"name": "Wasif Ahmed"}, {"name": "Joydeep Naskar"}], "author_count": 2}, {"id": "2610.13727", "category": "hep-th", "title": "Anomaly induced transport in holographic superconductors", "abstract": "We investigate the anomaly-induced transport properties of a holographic superconductor exhibiting spontaneous symmetry breaking. The holographic model incorporates vector and axial gauge fields, an additional non-anomalous $U(1)$ symmetry, and a charged scalar field that drives the phase transition. Working in the probe limit, we numerically construct the superconducting background under two alternative scalar field quantizations, corresponding to operators with scaling dimensions $\\Delta=1$ and $\\Delta=3$ (denoted as the $O_1$ and $O_2$ theories, respectively). Using Kubo formulae, we compute the chiral magnetic conductivities and examine their response to the scalar condensate. Our findings demonstrate that spontaneous symmetry breaking allows anomaly-induced transport to extend beyond anomalous currents, significantly impacting the non-anomalous sector as well. Remarkably, this effect appears in both theories, indicating that the influence on the non-anomalous sector is independent of the chosen quantization. The comparison of our numerical results with the analytical limits for $O_i \\to 0$ and $O_i \\to \\infty$ $(i=1,2)$ reveals consistent behavior across both theories.", "url": "https://arxiv.org/abs/2610.13727", "type": "理论", "summary": "我们研究了表现出自发对称破缺的全息超导体的异常诱导输运特性。全息模型包含矢量和轴向规范场、附加的非异常 $U(1)$ 对称性以及驱动相变的带电标量场。在探测极限下工作，我们在两个替代标量场量化下以数值方式构造超导背景，对应于缩放维度 $\\Delta=1$ 和 $\\Delta=3$ 的算子（分别表示为 $O_1$ 和 $O_2$ 理论）。使用 Kubo 公式，我们计算手性磁导率并检查它们对标量凝聚的响应。我们的研究结果表明，自发对称性破缺使得异常引起的传输能够扩展到异常电流之外，从而对非异常区域产生重大影响。值得注意的是，这种效应出现在两种理论中，表明对非异常部分的影响与所选的量化无关。我们的数值结果与 $O_i \\to 0$ 和 $O_i \\to \\infty$ $(i=1,2)$ 的分析极限的比较揭示了两种理论的一致行为。", "authors": [{"name": "Ashis Tamang"}, {"name": "Nishal Rai"}, {"name": "Javier Esteban"}, {"name": "Eugenio Megias"}], "featured_authors": [{"name": "Ashis Tamang"}, {"name": "Nishal Rai"}, {"name": "Javier Esteban"}, {"name": "Eugenio Megias"}], "author_count": 4}, {"id": "2610.13824", "category": "hep-th", "title": "The Quasiparticle Ansatz for Relativistic Continuous Matrix Product States", "abstract": "The Relativistic Continuous Matrix Product State (RCMPS) ansatz introduced in arXiv:2102.07741 is a translation-invariant variational ansatz intended to approximate the ground states of gapped one-dimensional relativistic Quantum Field Theories directly in the continuum limit and in infinite volume. In this work, we develop an ansatz, referred to as the Relativistic Quasiparticle (RQP) ansatz, for the low-lying one-particle excitations of the RCMPS vacuum, as well as for solitons interpolating between two distinct degenerate vacua. The corresponding energies of these states can be obtained as the eigenvalues of an effective Hamiltonian. The RQP ansatz generalizes constructions used in the Matrix Product State and Continuous Matrix Product State literature. We apply the RQP ansatz to the sine-Gordon model and find good agreement with results from integrability for both the soliton and breather masses. We also apply the RQP ansatz to the $\\phi^4$ theory, in both its $\\mathbb Z_2$-preserving and $\\mathbb{Z}_2$-broken phases, and determine the spectrum of particles and solitons. This enables us to determine the parameter regime for which multiple stable particles exist.", "url": "https://arxiv.org/abs/2610.13824", "type": "理论", "summary": "arXiv:2102.07741 中引入的相对论连续矩阵积态 (RCMPS) ansatz 是一种平移不变变分 ansatz，旨在直接在连续极限和无限体积中近似有隙一维相对论量子场论的基态。在这项工作中，我们开发了一种 ansatz，称为相对论准粒子 (RQP) ansatz，用于 RCMPS 真空的低位单粒子激发，以及用于在两个不同的简并真空之间插值的孤子。这些状态对应的能量可以作为有效哈密顿量的特征值获得。 RQP ansatz 概括了矩阵乘积状态和连续矩阵乘积状态文献中使用的结构。我们将 RQP ansatz 应用于正弦戈登模型，并发现与孤子和呼吸质量的可积性结果非常一致。我们还将 RQP ansatz 应用于 $\\phi^4$ 理论，在其 $\\mathbb Z_2$ 保留相和 $\\mathbb{Z}_2$ 破碎相中，并确定粒子和孤子的谱。这使我们能够确定多个稳定粒子存在的参数范围。", "authors": [{"name": "Silviu S. Pufu"}, {"name": "Benjamin T. Søgaard"}, {"name": "Spyros Terlemes"}], "featured_authors": [{"name": "Silviu S. Pufu"}, {"name": "Benjamin T. Søgaard"}, {"name": "Spyros Terlemes"}], "author_count": 3}, {"id": "2610.13875", "category": "hep-th", "title": "Modular Properties of Generalised Gibbs Ensembles: The Deformed KdV Hierarchy", "abstract": "We construct a set of conserved charges which are deformations of quantum KdV charges. They are associated with the modular transformation of a GGE with the spin-$\\sigma$ KdV charge inserted with chemical potential $\\alpha_\\sigma$. The charges are formal power series in the chemical potential, with coefficients given by local integrals of motion. We define local recursion relations and equivalent flow equations, prove commutativity to all orders, and establish uniqueness of the currents modulo total derivatives for a fixed generating series. We show that the eigenvalues of these deformed charges can be obtained from the thermodynamic Bethe Ansatz in two models. In the $c=1/2$ free fermion theory, the deformed charges reduce to explicit linear combinations of undeformed KdV charges, and their ground-state eigenvalues agree with the TBA expansion to all orders. In the Lee-Yang model, we find numerical agreement through cubic order in the spin-$5$ deformation for the first few charges evaluated on low-lying states.", "url": "https://arxiv.org/abs/2610.13875", "type": "理论", "summary": "我们构建了一组守恒电荷，它们是量子 KdV 电荷的变形。它们与插入化学势 $\\alpha_\\sigma$ 的自旋 $\\sigma$ KdV 电荷的 GGE 的模变换相关。电荷是化学势的形式幂级数，其系数由局部运动积分给出。我们定义局部递归关系和等效流动方程，证明所有阶的交换性，并建立固定生成级数的电流模全导数的唯一性。我们证明这些变形电荷的特征值可以从两个模型中的热力学 Bethe Ansatz 获得。在 $c=1/2$ 自由费米子理论中，变形电荷简化为未变形 KdV 电荷的显式线性组合，并且它们的基态特征值与所有阶的 TBA 展开一致。在 Lee-Yang 模型中，我们发现在低洼态上评估的前几个电荷的自旋 5 美元变形中通过立方阶的数值一致。", "authors": [{"name": "Faisal Karimi"}], "featured_authors": [{"name": "Faisal Karimi"}], "author_count": 1}, {"id": "2610.13899", "category": "hep-th", "title": "$q$-deformed Weil-Petersson Volumes from the Spectral Edge of DSSYK and Supersymmetric Extensions", "abstract": "The $q$-deformed Weil-Petersson volumes of Do and Norbury are the top-degree parts of Okuyama's discrete volumes, which are defined by topological recursion on the spectral curve of the double-scaled SYK (DSSYK) model. We show that the same q-deformed volumes can be obtained from a double-scaled matrix model whose disk density is found by zooming in on the soft edges of the DSSYK density. Applying the same procedure to the hard edge of $\\mathcal{N}=1$ DSSYK, we obtain candidate $q$-deformed $\\mathcal{N}=1$ super Weil-Petersson volumes. They are polynomials of fixed degree, and they reduce to the $\\mathcal{N}=1$ super Weil-Petersson volumes in a scaled $q\\to1$ limit. These candidate volumes differ from the $\\mathcal{N}=1$ volumes of Do and Norbury in ( arXiv:2510.12431 ) up to what we call \"irrelevant\" contributions which exactly vanish in the scaled $q\\to 1$ limit. Together, these results demonstrate how q-deformed volumes can be naturally associated to the spectral edges of various DSSYK models and provides an intuitive way to construct them in supersymmetric contexts.", "url": "https://arxiv.org/abs/2610.13899", "type": "理论", "summary": "Do 和 Norbury 的 $q$ 变形 Weil-Petersson 体积是 Okuyama 离散体积的顶级部分，由双尺度 SYK (DSSYK) 模型谱曲线上的拓扑递归定义。我们证明，可以从双尺度矩阵模型获得相同的 q 变形体积，该模型的圆盘密度是通过放大 DSSYK 密度的软边缘来找到的。对 $\\mathcal{N}=1$ DSSYK 的硬边应用相同的过程，我们获得候选 $q$ 变形 $\\mathcal{N}=1$ 超级 Weil-Petersson 体积。它们是固定次数的多项式，并且在缩放的 $q\\to1$ 极限内减少到 $\\mathcal{N}=1$ 超级 Weil-Petersson 体积。这些候选卷与 Do 和 Norbury 在 ( arXiv:2510.12431 ) 中的 $\\mathcal{N}=1$ 卷不同，直到我们所谓的“不相关”贡献，这些贡献在缩放后的 $q\\to 1$ 限制中完全消失。总之，这些结果证明了 q 变形体积如何自然地与各种 DSSYK 模型的光谱边缘相关联，并提供了一种在超对称环境中构建它们的直观方法。", "authors": [{"name": "Wasif Ahmed"}, {"name": "Joydeep Naskar"}, {"name": "Krishan Saraswat"}], "featured_authors": [{"name": "Wasif Ahmed"}, {"name": "Joydeep Naskar"}, {"name": "Krishan Saraswat"}], "author_count": 3}, {"id": "2610.13900", "category": "hep-th", "title": "Reflected entropy and islands in JT gravity from partial dimensional reduction", "abstract": "We study how mixed-state correlations reorganize across island transitions in Jackiw-Teitelboim gravity coupled to a non-gravitating bath. Using the partial-dimensional-reduction realization of double holography, we compute reflected entropy for adjacent and disjoint radiation regions in the vacuum and in the thermofield-double state of an eternal black hole. Reflected entropy probes the internal partition of the entanglement wedge and therefore resolves structure that is invisible to the ordinary Page curve: its dominant saddle can change even when the entropy saddle of the union remains fixed, and it vanishes at leading order when the entanglement wedge disconnects. We show that the lower-dimensional reflected-island description agrees, to leading order in the dynamical brane fluctuation, with the higher-dimensional defect-extremal-surface picture. The finite-angle comparison further suggests a projection-covariant identification of island and brane endpoints at linear order. The resulting Page-like curves and Markov gaps provide a geometric probe of the reorganization of the purification and of non-Markovian, multipartite correlation structure during island transitions.", "url": "https://arxiv.org/abs/2610.13900", "type": "理论", "summary": "我们研究了混合态相关性如何在 Jackiw-Teitelboim 重力与非重力浴耦合的岛跃迁中重新组织。利用双全息术的部分降维实现，我们计算了真空中和永恒黑洞的热场双态中相邻和不相交辐射区域的反射熵。反射熵探测纠缠楔的内部分区，因此解析了普通佩奇曲线不可见的结构：即使并集的熵鞍保持固定，其主导鞍也会发生变化，并且当纠缠楔断开时，它会以前导顺序消失。我们表明，低维反射岛描述与高维缺陷极值表面图像在动态膜涨落中的主导顺序上是一致的。有限角度比较进一步表明岛和膜端点以线性顺序进行投影协变识别。由此产生的类页曲线和马尔可夫间隙提供了岛转换期间纯化和非马尔可夫多部分相关结构重组的几何探针。", "authors": [{"name": "Debarshi Basu"}, {"name": "Himanshu Chourasiya"}], "featured_authors": [{"name": "Debarshi Basu"}, {"name": "Himanshu Chourasiya"}], "author_count": 2}, {"id": "2610.13938", "category": "hep-th", "title": "A universal sector of $\\mathcal{N}=1$ class $\\mathcal{S}$ spectra", "abstract": "We determine a universal sector of the spectrum of light operators in four-dimensional $\\mathcal{N}=1$ class $\\mathcal{S}$ superconformal field theories arising from M5-branes wrapped on a compact hyperbolic Riemann surface $\\Sigma_2$. We work at large $N$, analysing Kaluza--Klein fluctuations about the dual Bah--Beem--Bobev--Wecht anti-de Sitter backgrounds for general values of the twist parameter $z$. To obtain these spectra, we specialise recently derived mass operators to modes that are constant on $\\Sigma_2$ by imposing a suitable $z$-dependent generalised $G$-structure. We then organise the resulting eigenstates into long and protected $\\mathcal{N}=1$ supermultiplets with definite flavour quantum numbers. As $z$ varies, rich patterns emerge in the spectrum, including both isolated multiplets and infinite towers of multiplets, which we characterise analytically.", "url": "https://arxiv.org/abs/2610.13938", "type": "理论", "summary": "我们确定了四维 $\\mathcal{N}=1$ 类 $\\mathcal{S}$ 超共形场论中光算子光谱的通用扇区，这些超共形场论源自包裹在紧凑双曲黎曼曲面 $\\Sigma_2$ 上的 M5 膜。我们在大$N$上工作，分析关于双Bah-Beem-Bobev-Wecht反德西特背景的Kaluza-Klein波动，以获得扭曲参数$z$的一般值。为了获得这些光谱，我们通过施加合适的 $z$ 相关广义 $G$ 结构，将最近导出的质量算子专门化为 $\\Sigma_2$ 上恒定的模式。然后，我们将得到的本征态组织成长且受保护的 $\\mathcal{N}=1$ 超多重态，具有确定的味道量子数。随着 $z$ 的变化，光谱中会出现丰富的模式，包括孤立的多重峰和无限的多重峰塔，我们对其进行了分析表征。", "authors": [{"name": "Ritabrata Bhattacharya"}, {"name": "Abhay Katyal"}, {"name": "Oscar Varela"}], "featured_authors": [{"name": "Ritabrata Bhattacharya"}, {"name": "Abhay Katyal"}, {"name": "Oscar Varela"}], "author_count": 3}, {"id": "2610.12724", "category": "math-ph", "title": "An elementary approach to the Szegő theorems", "abstract": "The strong Szegő theorem and the Fisher-Hartwig formula describe the asymptotic behavior of determinants obtained by restricting translationally invariant operators to large finite regions. In particular, Szegő's theorem states that, beyond the leading extensive contribution to such a determinant, there is a universal finite correction, $\\sum_{r>0} rV_rV_{-r}$ where $V_r$ are the Fourier coefficients of the logarithm of the symbol. Although this formula appears throughout analysis and mathematical physics, the origin of its quadratic form and of the weight $r$ is often obscured in its standard analytic derivations. We develop an elementary picture in which the strong Szegő term arises from boundary leakage: paths contributing to the matrix exponential leave the finite interval and subsequently return. Counting the shortest such excursions immediately produces the factor $r$. We then show that an isolated boundary contributes exactly one half of the strong Szegő correction, while the two boundaries of a long interval decouple. For finite-range matrices this gives a rigorous and intuitive elementary derivation of the asymptotics, with extensions to sufficiently rapidly decaying interactions. A complementary free-fermion argument provides a physical interpretation of the same cancellation mechanism. Numerical examples illustrate the asymtotics in the well controlled regime, the Fisher Hartwig logarithmic correction. The boundary formulation does not itself require translation invariance and therefore suggests natural extensions to disordered systems, higher dimensions, and symbols with internal matrix structure. To illustrate this we numerically go beyond the formal applicability region of the Szegő formula, considering slow decay and disordered cases, and showing in some cases a robustness of the approach even for slowly decaying but disordered potentials.", "url": "https://arxiv.org/abs/2610.12724", "type": "理论", "summary": "强 Szegő 定理和 Fisher-Hartwig 公式描述了通过将平移不变算子限制在大的有限区域而获得的行列式的渐近行为。特别是，Szegő 定理指出，除了对行列式的主要广泛贡献之外，还存在通用有限修正 $\\sum_{r>0} rV_rV_{-r}$，其中 $V_r$ 是符号对数的傅里叶系数。尽管这个公式出现在整个分析和数学物理中，但其二次形式和权重 $r$ 的起源常常在其标准分析推导中被掩盖。我们开发了一个基本图像，其中强 Szegő 项源自边界泄漏：对矩阵指数做出贡献的路径离开有限间隔并随后返回。计算最短的此类偏移会立即产生因子 $r$。然后我们证明，一个孤立的边界恰好贡献了强 Szegő 校正的一半，而长间隔的两个边界则解耦。\n\n对于有限范围矩阵，这给出了渐进的严格且直观的基本推导，并扩展到足够快速衰减的相互作用。互补的自由费米子论证提供了相同抵消机制的物理解释。数值例子说明了良好控制状态下的渐近性，即 Fisher Hartwig 对数校正。边界公式本身不需要平移不变性，因此建议对无序系统、更高维度和具有内部矩阵结构的符号进行自然扩展。为了说明这一点，我们在数字上超出了 Szegő 公式的正式适用范围，考虑缓慢衰减和无序情况，并在某些情况下显示该方法的稳健性，即使对于缓慢衰减但无序的势也是如此。", "authors": [{"name": "Israel Klich"}, {"name": "Ravisankar Rajagopal"}], "featured_authors": [{"name": "Israel Klich"}, {"name": "Ravisankar Rajagopal"}], "author_count": 2}, {"id": "2610.12731", "category": "math-ph", "title": "Lieb-Robinson bounds for irreversible dynamics via adaptive Dyson expansion", "abstract": "In this note, we study a broad class of time-dependent and irreversible dynamics for quantum spin systems in both finite and infinite volume. We develop a simple and flexible strategy for expanding commutators of the form $[A,\\tau_{s,t} \\, B]$ in terms of self-avoiding paths of sets, where $A$ and $B$ are local operators and $\\tau_{s,t}$ is the Heisenberg time evolution. This adaptive Dyson expansion requires no backwards time evolution and is thus also applicable to irreversible dynamics. Furthermore, we discuss how such an expansion directly implies Lieb-Robinson bounds. A central feature of our result is that the obtained Lieb-Robinson bounds are independent of any Hamiltonian and dissipative on-site terms of the generator.", "url": "https://arxiv.org/abs/2610.12731", "type": "理论", "summary": "在这篇文章中，我们研究了有限和无限体积中量子自旋系统的一类与时间相关且不可逆的动力学。我们开发了一种简单而灵活的策略，用于根据集合的自回避路径来扩展 $[A,\\tau_{s,t} \\, B]$ 形式的交换子，其中 $A$ 和 $B$ 是局部运算符，$\\tau_{s,t}$ 是海森堡时间演化。这种自适应戴森展开不需要向后时间演化，因此也适用于不可逆动力学。此外，我们讨论这样的展开如何直接暗示利布-罗宾逊界限。我们结果的一个中心特征是，获得的李布-罗宾逊界限独立于发电机的任何哈密顿量和耗散现场项。", "authors": [{"name": "Carla Rubiliani"}, {"name": "Marius Wesle"}, {"name": "Tom Wessel"}], "featured_authors": [{"name": "Carla Rubiliani"}, {"name": "Marius Wesle"}, {"name": "Tom Wessel"}], "author_count": 3}, {"id": "2610.12805", "category": "math-ph", "title": "A Sklar-Type Decomposition for Positive Binary Distributions and a Gibbs Interpretation", "abstract": "We study strictly positive multivariate binary distributions by separating one-body marginals from dependence. Local positive reweighting defines a dependence nucleus, completely characterized by the higher-order Walsh log-linear coefficients $J_S$, $|S|\\ge2$. Any such nucleus and any strictly positive one-body marginals determine a unique joint distribution. In finite-spin Gibbs systems, these coefficients are the many-body interaction couplings.", "url": "https://arxiv.org/abs/2610.12805", "type": "理论", "summary": "我们通过将单体边缘与依赖性分开来研究严格的正多元二元分布。局部正重加权定义了一个依赖核，完全由高阶 Walsh 对数线性系数 $J_S$、$|S|\\ge2$ 表征。任何这样的核和任何严格正的一体边缘决定了独特的联合分布。在有限自旋吉布斯系统中，这些系数是多体相互作用耦合。", "authors": [{"name": "Yi-Yu Lin"}], "featured_authors": [{"name": "Yi-Yu Lin"}], "author_count": 1}, {"id": "2610.13705", "category": "math-ph", "title": "Critical Ising model as the $M(4,3)$ minimal model of conformal field theory", "abstract": "We construct a linear map from the space of spin polynomials in the critical Ising model on a lattice to the state space of the $M(4,3)$ minimal model of conformal field theory. The kernel of the map consists precisely of null fields, i.e., spin polynomials that vanish in all correlations. For a polynomial $\\Op$ which is not a null field, we define its scaling dimension $\\Delta_{\\Op}\\in\\Z_{\\geq0}\\cup(\\Z_{\\geq0}+\\frac{1}{8}),$ to be the lowest $\\Loper{0}+\\Loperbar{0}$ eigenvalue in the decomposition of its image into homogeneous components. We show that as the mesh size $\\delta$ goes to zero, the rescaled field $\\delta^{-\\Delta_{\\Op}}\\Op$ has a non-trivial scaling limit, when inserted in correlations with other such fields. Moreover, all these limits can be expressed in terms of correlations of primary fields of $M(4,3)$ and the Virasoro action in the continuum. The highest weight vectors of $M(4,3)$, the joint eigenvectors of $\\Loper{0}$ and $\\Loperbar{0}$ with the same eigenvalues $0,1/16,1/2$ for both, are the images of the constant $1$, the spin at a single lattice vertex, and the energy at a single lattice edge, respectively. For the proof, we construct a map from a larger lattice field space, accommodating also fermion and disorder insertions, to a direct sum of two fermionic Fock spaces. This direct sum contains contains the state spaces of both the $M(4,3)$ and the free fermion CFT. The main technical ingredient of the proof is a new version of the exact fermionic current action on the space of lattice local fields due to C. Hongler, K.K. and F. Viklund, combined with some new advances in discrete complex analysis. Our results are valid on arbitrary isoradial graphs.", "url": "https://arxiv.org/abs/2610.13705", "type": "理论", "summary": "我们构建了从格上临界伊辛模型中的自旋多项式空间到共形场论 $M(4,3)$ 最小模型的状态空间的线性映射。映射的核心恰好由空域组成，即在所有相关性中消失的自旋多项式。对于非空域的多项式 $\\Op$，我们将其缩放维 $\\Delta_{\\Op}\\in\\Z_{\\geq0}\\cup(\\Z_{\\geq0}+\\frac{1}{8}),$ 定义为其图像分解为齐次分量时的最低 $\\Loper{0}+\\Loperbar{0}$ 特征值。我们表明，当网格大小 $\\delta$ 趋于零时，当插入与其他此类字段的相关性时，重新缩放的字段 $\\delta^{-\\Delta_{\\Op}}\\Op$ 具有不平凡的缩放限制。此外，所有这些限制都可以用 $M(4,3)$ 的主场与连续统中 Virasoro 作用的相关性来表示。 $M(4,3)$的最高权向量、$\\Loper{0}$和$\\Loperbar{0}$的联合特征向量（两者具有相同的特征值$0,1/16,1/2$）分别是常数$1$、单个晶格顶点的自旋和单个晶格边缘的能量的图像。\n\n为了证明，我们构建了一个从更大的晶格场空间（也容纳费米子和无序插入）到两个费米子福克空间的直接和的映射。该直和包含 $M(4,3)$ 和自由费米子 CFT 的状态空间。该证明的主要技术成分是由 C. Hongler, K.K. 提出的关于晶格局域场空间的精确费米子电流作用的新版本。和 F. Viklund，结合离散复分析的一些新进展。我们的结果在任意等径图上都有效。", "authors": [{"name": "Dmitry Chelkak"}, {"name": "Konstantin Izyurov"}, {"name": "Kalle Kytölä"}], "featured_authors": [{"name": "Dmitry Chelkak"}, {"name": "Konstantin Izyurov"}, {"name": "Kalle Kytölä"}], "author_count": 3}, {"id": "2610.13743", "category": "math-ph", "title": "Perturbed isotropic oscillators with inversion symmetry", "abstract": "We consider the normal form of a 1:1 detuned resonance that can be related, via a double averaging process, to the three body problem of celestial mechanics. In view of the symmetry in the gravitational coupling between the planets, the obtained normal form exhibits inversion symmetry. We provide an analytical prediction of the possible bifurcations in terms of the detunings and the other physical parameters of the system. We show that the bifurcation scenario is rich. It includes bifurcation sequences where the unstable orbit appearing after a saddle-node bifurcation can have a reversed pitchfork bifurcation, where it turns into stability with the birth of two unstable orbits, which eventually reconnect with one of the two quasi-normal modes. Furthermore, another scenario shows a standard pitchfork in which one of the quasi-normal modes becomes unstable, giving rise to a pair of stable periodic orbits. By introducing coupling and asymmetry parameters, we provide an effective way to discern all the possible sequences of bifurcations.", "url": "https://arxiv.org/abs/2610.13743", "type": "理论", "summary": "我们考虑 1:1 失谐共振的正常形式，它可以通过双平均过程与天体力学的三体问题相关联。鉴于行星间引力耦合的对称性，所得到的范式表现出反演对称性。我们根据系统的失谐和其他物理参数对可能的分岔进行分析预测。我们表明分叉场景是丰富的。它包括分岔序列，其中鞍结分岔后出现的不稳定轨道可以发生反向干草叉分岔，随着两个不稳定轨道的诞生而变得稳定，最终与两个准正常模式之一重新连接。此外，另一种情况显示了一个标准干草叉，其中一个准正常模式变得不稳定，从而产生一对稳定的周期轨道。通过引入耦合和不对称参数，我们提供了一种有效的方法来辨别所有可能的分叉序列。", "authors": [{"name": "Antonella Marchesiello"}, {"name": "Rita Mastroianni"}, {"name": "Giuseppe Pucacco"}], "featured_authors": [{"name": "Antonella Marchesiello"}, {"name": "Rita Mastroianni"}, {"name": "Giuseppe Pucacco"}], "author_count": 3}, {"id": "2610.13892", "category": "math-ph", "title": "Unifying spherical convolutions through lifting", "abstract": "We develop a unified description of convolution on the sphere by lifting to the rotation group. A number of definitions of spherical convolution have been proposed, differing in whether the kernel is axisymmetric or directional, whether the output is on the sphere or the rotation group, whether the signals carry spin, and in their computational cost. No unified treatment exists. Regarding the sphere as the homogeneous space $S^2 \\cong \\text{SO(3)}/\\text{SO(2)}$, we lift a spin $s$ field to the rotation group, convolve on $\\text{SO(3)}$, and project back to the sphere through the adjoint of the lift for a potentially different spin $s'$. We recover every rotation-equivariant convolution considered previously through constraints on the kernel, spin choices and inclusion or omission of the lift and projection. For maps between fields of fixed input and output spin, we prove that directional kernels, output on the sphere and equivariance cannot be achieved simultaneously. We make explicit that spin fields are sections of associated line bundles, linking the physics and bundle literatures, and express the spin rotation phase as the character of the twist of the section. We present harmonic-space algorithms for the exact and efficient computation of lifted spherical convolutions of band-limited fields by appealing to sampling theorems on the sphere and rotation group. All operators are implemented in the open-source s2conv code, and numerical experiments confirm the reductions and the equivariance of the operators to machine precision. Finally, we illustrate the operators on fields measured on the Earth and on the celestial sky.", "url": "https://arxiv.org/abs/2610.13892", "type": "理论", "summary": "我们通过提升到旋转组来开发球体上卷积的统一描述。球面卷积的许多定义已经被提出，不同之处在于核是轴对称的还是有方向的、输出是在球体上还是旋转群上、信号是否携带自旋以及它们的计算成本。不存在统一的治疗方法。将球体视为齐次空间 $S^2 \\cong \\text{SO(3)}/\\text{SO(2)}$，我们将自旋 $s$ 场提升到旋转群，在 $\\text{SO(3)}$ 上进行卷积，并通过提升的伴随物投影回球体，以获得可能不同的自旋 $s'$。我们通过对内核、自旋选择以及升力和投影的包含或省略的约束来恢复之前考虑的每个旋转等变卷积。对于固定输入和输出自旋场之间的映射，我们证明了方向核、球体上的输出和等方差不能同时实现。我们明确指出自旋场是相关线束的截面，将物理学和束文献联系起来，并将自旋旋转相位表示为截面扭曲的特征。\n\n我们通过利用球体和旋转群上的采样定理，提出调和空间算法，用于精确有效地计算带限场的提升球面卷积。所有算子均在开源 s2conv 代码中实现，数值实验证实了算子对机器精度的约简和等方差。最后，我们说明了在地球和天空上测量的场的算子。", "authors": [{"name": "J. D. McEwen"}], "featured_authors": [{"name": "J. D. McEwen"}], "author_count": 1}, {"id": "2610.12597", "category": "quant-ph", "title": "Error correction and quantum information spreading on sparse random graphs", "abstract": "Quantum error-correcting codes on graph geometries beyond regular euclidean lattices have emerged as a promising route toward robust quantum information processing. A major challenge in quantum error correction is the trade-off between favorable properties of codes constructed in high dimensionality and the need for locality in practical implementations on near-term hardware. Sparse intermediate geometries may combine the advantages of both, but how their structure governs quantum information dynamics and code performance remains unclear. Here we show that the spectral dimension $d_s$, defined from the low-energy spectrum of the graph Laplacian, is the universal parameter connecting these properties. Using Floquet random Clifford circuits on two distinct sparse graph architectures with tunable spectral dimension, we find that $d_s$ governs both quantum information spreading and the scaling of the resulting quantum error-correcting code distance. We identify a geometry-induced entanglement phase transition from localized area-law to ergodic volume-law, whose universality is determined by $d_s$ and exhibits long-range percolation criticality. In the ergodic phase, the circuit acts as a CSS code encoder whose code distance is set by the competition between two logical sectors --- the cost of severing the graph and the length of its shortest winding cycle --- which connectivity pushes in opposite directions. The spectral dimension organizes this trade-off, highlighting a maximum at intermediate $d_s$ retaining sparse connectivity and physical realizability.", "url": "https://arxiv.org/abs/2610.12597", "type": "理论", "summary": "超出常规欧几里德晶格的图几何形状的量子纠错码已成为实现鲁棒量子信息处理的一条有希望的途径。量子纠错的一个主要挑战是在高维构建的代码的有利特性与近期硬件上的实际实现中对局部性的需求之间进行权衡。稀疏中间几何结构可能结合了两者的优点，但它们的结构如何控制量子信息动力学和代码性能仍不清楚。在这里，我们表明，从图拉普拉斯算子的低能谱定义的谱维 $d_s$ 是连接这些属性的通用参数。在两个具有可调光谱维度的不同稀疏图架构上使用 Floquet 随机 Clifford 电路，我们发现 $d_s$ 控制着量子信息传播和由此产生的量子纠错码距离的缩放。我们确定了从局域面积定律到遍历体积定律的几何诱导的纠缠相变，其普遍性由 $d_s$ 决定，并表现出长程渗流临界性。\n\n在遍历阶段，该电路充当 CSS 代码编码器，其代码距离由两个逻辑扇区之间的竞争决定——切断图形的成本及其最短缠绕周期的长度——连接性推动相反的方向。谱维度组织了这种权衡，突出了中间 $d_s$ 处的最大值，保留了稀疏连接性和物理可实现性。", "authors": [{"name": "Giovanni Cemin"}, {"name": "Marin Bukov"}, {"name": "Andrea Solfanelli"}], "featured_authors": [{"name": "Giovanni Cemin"}, {"name": "Marin Bukov"}, {"name": "Andrea Solfanelli"}], "author_count": 3}, {"id": "2610.12607", "category": "quant-ph", "title": "Dissipative Majorana Chain---Anomalies and Non-Invertible Symmetries", "abstract": "We study symmetries and anomalies of dissipative Majorana chains described by Lindblad dynamics. Using the operator-state mapping, we represent the Lindbladian as a non-Hermitian operator on a doubled Hilbert space. In this formulation, the ket and bra contours admit strong fermion parities and strong translations, while their diagonal combinations define weak symmetries. For even and odd chain lengths, we diagnose anomalies by comparing symmetry algebras with and without weak fermion-parity defects. These algebras retain the lattice precursor of the modulo-$8$ anomaly of the closed Majorana chain and exhibit projective relations between strong fermion parity and weak translation, as well as between weak fermion parity and strong translation, which are intrinsic to open quantum systems. We establish the IR correspondence between the lattice symmetry algebras and those of the doubled Majorana CFT in four spin sectors, identifying chiral fermion parities emanated from the lattice translations. Finally, we develop the lattice bosonization of the dissipative chain. For even length with collective energy dephasing, combining the defect and no-defect sectors and imposing GSO projections gives rise to an Ising Lindbladian with non-invertible Kramers--Wannier symmetries descending from the anomalous strong translation and fermion parity of the Majorana chain. For odd length, constructing mutually commuting ket- and bra-sector spin operators instead yields an Ising Lindbladian with a Kramers--Wannier duality defect. Our results provide a controlled framework for extending lattice anomalies and non-invertible symmetries to open quantum systems.", "url": "https://arxiv.org/abs/2610.12607", "type": "理论", "summary": "我们研究 Lindblad 动力学描述的耗散马约拉纳链的对称性和异常性。使用算子状态映射，我们将 Lindbladian 表示为双希尔伯特空间上的非厄米算子。在这个公式中，ket 和 bra 轮廓允许强费米子宇称和平移，而它们的对角线组合定义弱对称性。对于偶数和奇数链长度，我们通过比较具有和不具有弱费米子宇称缺陷的对称代数来诊断异常。这些代数保留了闭合马约拉纳链模 8$ 异常的晶格前体，并表现出强费米子宇称与弱平移之间以及弱费米子宇称与强平移之间的射影关系，这是开放量子系统所固有的。我们在四个自旋扇区中建立了晶格对称代数与双马约拉纳 CFT 之间的 IR 对应关系，识别了源自晶格平移的手性费米子宇称。最后，我们开发了耗散链的晶格玻色化。\n\n对于具有集体能量相移的均匀长度，结合缺陷和无缺陷扇区并施加 GSO 投影，产生了具有不可逆 Kramers-Wannier 对称性的 Ising Lindbladian，该对称性源自马约拉纳链的异常强平移和费米子宇称。对于奇数长度，构造相互交换的 ket 和 bra 扇区自旋算子反而会产生具有 Kramers-Wannier 对偶缺陷的 Ising Lindbladian。我们的结果提供了一个受控框架，用于将晶格异常和不可逆对称性扩展到开放量子系统。", "authors": [{"name": "Hung-Hsuan Teh"}, {"name": "Tokiro Numasawa"}], "featured_authors": [{"name": "Hung-Hsuan Teh"}, {"name": "Tokiro Numasawa"}], "author_count": 2}, {"id": "2610.12646", "category": "quant-ph", "title": "Optimal linear-optical interferometers for unitary t-designs in a multi-photon Fock space", "abstract": "We investigate the construction of unitary $t$-designs in a multi-photon Fock space on programmable linear-optical interferometers. Using the frame potential as the optimization objective, we identify architectures that realize approximate unitary 1- and 2-designs with considerably fewer controllable parameters than required for universal linear optics. For example, we find numerical evidence suggesting that for unitary 1-designs, the required number of programmable parameters scales empirically as $2d$ with the number of modes $d$, instead of $O(d^2)$. We benchmark the resulting ensembles using single-photon transition probabilities and average channel fidelities. Furthermore, as a practical result, we develop a photon-number estimation protocol for multi-photon Fock states that leverages these optimized 1- and 2-designs. Our findings demonstrate that shallow interferometers can accurately reproduce Haar-averaged first moments, while second-moment-sensitive observables provide a considerably stricter test for app
