  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2610.12511", "category": "cond-mat", "title": "Spinodal-controlled freeze-out and nucleation at the first-order superfluid-supersolid transition of a dipolar gas", "abstract": "Dipolar quantum gases in elongated traps become supersolid through a transition that is continuous at intermediate density but first order at low and high density; at the continuous point, ramps of the scattering length follow Kibble--Zurek scaling. We study ramps across the first-order superfluid--supersolid transition of $^{164}$Dy in an infinite tube using the three-dimensional extended Gross--Pitaevskii equation with truncated-Wigner noise. With quantum noise only, the uniform superfluid survives the metastable window and transforms after its spinodal, where the roton softens. For onsets occurring during the linear ramp, the delay measured from this spinodal has a fitted exponent $\\zeta = 0.36 \\pm 0.02$, close to the continuous-transition result and the mean-field value $1/3$. The quoted uncertainty combines statistical and systematic sensitivities. Reverse ramps show a comparable delay beyond the fold of the crystal branch, producing dynamical hysteresis. Initial thermal noise with nominal temperatures of 2.5--10 nK produces crystalline regions inside the metastable window during holds, with faster nucleation closer to the spinodal and at higher initial temperature. Without a heat bath these effective rates depend on preparation: ramps crossing the window at the same rate nucleate early in 2 of 32 or 11 of 16 realizations depending on their starting point. A crossover time inferred from hold rates is therefore an estimate, not a measured boundary for the ramp protocol. At low density, slower ramps select larger spacings in a crystal of separated droplets, and droplets survive far above the transition on reverse ramps.", "url": "https://arxiv.org/abs/2610.12511", "type": "理论", "summary": "细长陷阱中的偶极量子气体通过在中等密度下连续但在低密度和高密度下为一阶的转变而变成超固体；在连续点，散射长度的斜坡遵循 Kibble-Zurek 缩放比例。我们使用带有截断维格纳噪声的三维扩展 Gross--Pitaevskii 方程研究无限管中 $^{164}$Dy 的一阶超流体-超固体转变的斜坡。仅在量子噪声的情况下，均匀超流体能够在亚稳窗口中幸存下来，并在旋节线后发生转变，旋子在旋节线处软化。对于线性斜坡期间发生的起始点，从该旋节线测量的延迟具有拟合指数 $\\zeta = 0.36 \\pm 0.02$，接近连续过渡结果和平均场值 $1/3$。所引用的不确定性结合了统计和系统敏感性。反向斜坡显示超出晶体分支折叠的类似延迟，产生动态滞后。标称温度为 2.5--10 nK 的初始热噪声在保持期间会在亚稳窗口内产生结晶区域，在更接近旋节线且初始温度更高的情况下，成核速度更快。\n\n如果没有热浴，这些有效速率取决于准备工作：以相同速率穿过窗口的斜坡在 32 次中的 2 次或 16 次中的 11 次实现中早期成核，具体取决于其起点。因此，从保持率推断出的交叉时间是估计值，而不是斜坡协议的测量边界。在低密度下，较慢的斜坡在分离的液滴晶体中选择较大的间距，并且液滴在反向斜坡上远高于过渡区。", "authors": [{"name": "Wai Kui Wong"}], "featured_authors": [{"name": "Wai Kui Wong"}], "author_count": 1}, {"id": "2610.12563", "category": "cond-mat", "title": "Enhanced Coulomb pseudopotentials in high-pressure hydrides from first principles", "abstract": "In the Eliashberg theory of superconductivity, Coulomb interactions oppose the phonon-mediated attraction and suppress the superconducting critical temperature $T_{\\mathrm{c}}$. However, most first-principles predictions continue to treat this repulsion with an empirical Coulomb pseudopotential $\\mu^*_{\\text{ME}}$ in the range 0.1-0.15. Here we present first-principles calculations of the Coulomb parameter $\\mu$ and pseudopotential $\\mu^*_{\\text{ME}}$ in superconducting hydrides across a range of pressures. The screened Coulomb interaction is evaluated at the random phase approximation level with the Mantel code. We demonstrate that several hydride systems, including H$_3$S, YSbH$_6$ and Mg$_2$IrH$_6$, have strong Coulomb repulsions driven by a large density of states at the Fermi energy, $N_{\\mathrm{F}}$. For Mg$_2$IrH$_6$ we obtain $\\mu=0.62$ and $\\mu^*_{\\text{ME}}\\approx0.39$, leading to a 40 K suppression in $T_{\\mathrm{c}}$ relative to a standard $\\mu^*_{\\text{ME}}=0.16$. Our obtained $\\mu^*_{\\text{ME}}$ is far above the conventional range and, accounting for the energy dependence of the density of states, resolves the factor-of-two discrepancy between $T_{\\mathrm{c}}$ estimates of previous studies. Across all systems and pressures studied, we find that $\\mu$ closely tracks $N_{\\mathrm{F}}$, suggesting that commonly used $\\mu^*_{\\text{ME}}$ values lead to overestimated $T_{\\mathrm{c}}$ in materials where the density of states at the Fermi energy is large.", "url": "https://arxiv.org/abs/2610.12563", "type": "理论+数值", "summary": "在 Eliashberg 超导理论中，库仑相互作用对抗声子介导的吸引力并抑制超导临界温度 $T_{\\mathrm{c}}$。然而，大多数第一性原理预测继续用 0.1-0.15 范围内的经验库仑赝势 $\\mu^*_{\\text{ME}}$ 来处理这种排斥。在这里，我们提出了超导氢化物在一定压力范围内的库仑参数 $\\mu$ 和赝势 $\\mu^*_{\\text{ME}}$ 的第一性原理计算。使用 Mantel 代码在随机相位近似水平上评估筛选的库仑相互作用。我们证明了几种氢化物系统，包括 H$_3$S、YSbH$_6$ 和 Mg$_2$IrH$_6$，在费米能级 $N_{\\mathrm{F}}$ 处具有由大密度态驱动的强库仑斥力。对于 Mg$_2$IrH$_6$，我们得到 $\\mu=0.62$ 和 $\\mu^*_{\\text{ME}}\\approx0.39$，相对于标准 $\\mu^*_{\\text{ME}}=0.16$，导致 $T_{\\mathrm{c}}$ 中的 40 K 抑制。\n\n我们获得的 $\\mu^*_{\\text{ME}}$ 远远高于常规范围，并且考虑到状态密度的能量依赖性，解决了先前研究的 $T_{\\mathrm{c}}$ 估计值之间的两倍差异。在研究的所有系统和压力中，我们发现$\\mu$密切跟踪$N_{\\mathrm{F}}$，这表明常用的$\\mu^*_{\\text{ME}}$值会导致在费米能态密度较大的材料中高估$T_{\\mathrm{c}}$。", "authors": [{"name": "Kieran Bozier"}, {"name": "Chris J. Pickard"}], "featured_authors": [{"name": "Kieran Bozier"}, {"name": "Chris J. Pickard"}], "author_count": 2}, {"id": "2610.12635", "category": "cond-mat", "title": "Entropic-ordered superfluid", "abstract": "We present a minimal classical lattice model of superfluidity at arbitrarily high temperatures, using a modified three-dimensional XY model with ``soft\" rotors. The global U(1) symmetry is spontaneously broken above a positive critical temperature due to entropic order. We study hydrodynamics in this high-temperature regime and verify consistency with the fluctuation-dissipation theorem, explaining how the large noise variance at very high temperatures is not sufficient to destroy superfluidity or the long lifetime of Goldstone modes.", "url": "https://arxiv.org/abs/2610.12635", "type": "理论", "summary": "我们提出了任意高温下超流性的最小经典晶格模型，使用带有“软”转子的改进的三维 XY 模型。由于熵序，全局 U(1) 对称性在正临界温度以上自发破缺。我们研究了这种高温状态下的流体动力学，并验证了与波动耗散定理的一致性，解释了在非常高的温度下大的噪声方差如何不足以破坏超流性或戈德斯通模式的长寿命。", "authors": [{"name": "Isabella Zane"}, {"name": "Andrew Lucas"}], "featured_authors": [{"name": "Isabella Zane"}, {"name": "Andrew Lucas"}], "author_count": 2}, {"id": "2610.12652", "category": "cond-mat", "title": "Entropy Production in Mesoscopic Electronic Transport Beyond Weak-Coupling", "abstract": "We investigate the full statistics of entropy production in coherent mesoscopic conductors beyond the weak-coupling regime. Using the inside-outside perspective and the Landauer-Büttiker scattering framework, we relate entropy production to the full counting statistics of particle transport and show that the corresponding cumulant-generating function satisfies the fluctuation symmetry independently of the coupling strength. We obtain closed analytical expressions for the cumulant-generating function in the weak- and strong-coupling limits, enabling a detailed characterization of entropy production distributions and higher-order cumulants. These cumulants reveal distinct signatures of resonant transport and coherent fermionic partitioning. While coupling-induced broadening substantially modifies the transport statistics, the fluctuation symmetry imposed by microscopic reversibility remains preserved in the long-time limit.", "url": "https://arxiv.org/abs/2610.12652", "type": "理论", "summary": "我们研究了弱耦合范围之外的相干介观导体中熵产生的完整统计数据。使用内外视角和 Landauer-Büttiker 散射框架，我们将熵产生与粒子输运的完整计数统计联系起来，并表明相应的累积量生成函数满足涨落对称性，与耦合强度无关。我们在弱耦合和强耦合极限下获得了累积量生成函数的闭合解析表达式，从而能够详细表征熵产生分布和高阶累积量。这些累积量揭示了共振传输和相干费米子分配的独特特征。虽然耦合引起的展宽极大地改变了输运统计数据，但微观可逆性所施加的涨落对称性在长期限制内仍然保留。", "authors": [{"name": "Ivana R. A. C. Lucena"}, {"name": "Caio H. Lewenkopf"}, {"name": "Alexandre R. Rocha"}], "featured_authors": [{"name": "Ivana R. A. C. Lucena"}, {"name": "Caio H. Lewenkopf"}, {"name": "Alexandre R. Rocha"}], "author_count": 3}, {"id": "2610.12663", "category": "cond-mat", "title": "Spectral optimization of spherical lattices and applications to classical and quantum interacting spin systems", "abstract": "We develop an optimization algorithm for spherical lattice discretizations based on the spectrum of the discretized Laplace operator. Starting from refined icosahedral lattices, we minimize the splitting of the $(2\\ell+1)$, $\\ell=0,1,2,\\dots$, continuum multiplets expected from $\\mathrm{SO}(3)$ symmetry via gradient descent. This approach simultaneously produces lattices based on triangles with nearly uniform circumradii and perimeters. Although the optimization uses only the free-particle spectrum, we show that the resulting lattices carry over to interacting models. On the optimized lattices, rotational symmetry is restored for the critical Ising and Potts models and primary scaling dimensions are accurately reproduced for the three-dimensional Ising conformal field theory, when appropriate geometry-dependent interaction strengths are used. Higher-angular-momentum descendant states reveal weak residual symmetry breaking beyond the sectors protected by the underlying icosahedral symmetry.", "url": "https://arxiv.org/abs/2610.12663", "type": "理论+数值", "summary": "我们开发了一种基于离散拉普拉斯算子谱的球格离散化优化算法。从精炼的二十面体晶格开始，我们通过梯度下降最小化 $(2\\ell+1)$、$\\ell=0,1,2,\\dots$、$\\mathrm{SO}(3)$ 对称性所期望的连续多重态的分裂。这种方法同时生成基于具有几乎一致的外接半径和周长的三角形的晶格。尽管优化仅使用自由粒子谱，但我们表明所得到的晶格可以延续到相互作用模型中。在优化晶格上，当使用适当的依赖于几何形状的相互作用强度时，临界伊辛和波茨模型的旋转对称性得到恢复，并且三维伊辛共形场理论的主要尺度尺寸得到准确再现。更高角动量的后代态揭示了弱剩余对称性，突破了底层二十面体对称性保护的扇区。", "authors": [{"name": "Jonas Völler"}, {"name": "Grigorios Makris"}, {"name": "Fabian Hassler"}, {"name": "Stefan Wessel"}], "featured_authors": [{"name": "Jonas Völler"}, {"name": "Grigorios Makris"}, {"name": "Fabian Hassler"}, {"name": "Stefan Wessel"}], "author_count": 4}, {"id": "2610.12700", "category": "cond-mat", "title": "Improving the lower bound on the Laughlin gap: An SDP search", "abstract": "A recent preprint by OpenAI resolved the spherical fermionic Laughlin spectral-gap conjecture for the full $V_1$ interaction by a Fock-space inequality: $H_Q^2\\ge \\gamma H_Q$ on the lowest-Landau-level Fock space for all large flux $Q$ and every $\\gamma$ below $0.0461673\\ldots$, so that the gap above the Laughlin state at filling $1/3$ is at least $1/25$. That proof, with its original constant, has also been formalized in Lean. We show that the same argument supports a much larger constant. Two sharper estimates, a product-twirl bound for the three-body tail and a staircase price for the four-body allowance, raise the constant above $0.0601$ without changing the original certificate. Treating the auxiliary operators as the variables of a semidefinite program (SDP) and enlarging the finite set of orbital modes on which they act then gives $H_Q^2\\ge\\gamma H_Q$ for every $\\gamma<\\gamma_*=0.2190037845063196\\ldots$, certified by exact rational arithmetic. Consequently the gap above the Laughlin state is at least $1/5$ for all sufficiently large spheres, and the untruncated planar $V_1$ Hamiltonian has positive spectrum bounded below by $\\gamma_*$, uniformly in particle number and angular momentum. A heuristic extrapolation of the SDP optima suggests that auxiliary operators of the present form can give at most about $0.222$, while exact diagonalization of finite systems places the true gap near $0.4$. A larger family of auxiliary operators could push the bound further towards the true gap, and the SDP formulation makes such families easy to test. The proof of the improvement and the SDP search were completed by the AI model Claude Opus 5.5 (Anthropic) under the author's direction.", "url": "https://arxiv.org/abs/2610.12700", "type": "理论+数值", "summary": "OpenAI 最近的预印本通过福克空间不等式解决了完整 $V_1$ 相互作用的球面费米子劳克林谱间隙猜想：对于所有大通量 $Q$ 和低于 $0.0461673\\ldots$ 的每个 $\\gamma$，在最低朗道级福克空间上的 $H_Q^2\\ge \\gamma H_Q$ ，使得填充时劳克林态之上的间隙$1/3$ 至少为 $1/25$。该证明及其原始常数也已在精益中形式化。我们表明，相同的论点支持更大的常数。两个更尖锐的估计，即三体尾部的产品旋转和四体津贴的阶梯价格，在不改变原始证书的情况下将常数提高到 0.0601 美元以上。将辅助算子视为半定程序（SDP）的变量并扩大它们作用的有限轨道模式集，然后对于每个 $\\gamma<\\gamma_*=0.2190037845063196\\ldots$ 给出 $H_Q^2\\ge\\gamma H_Q$，并通过精确有理算术证明。\n\n因此，对于所有足够大的球体，劳克林态上方的间隙至少为 $1/5$，并且未截断的平面 $V_1$ 哈密顿量具有以下由 $\\gamma_*$ 界定的正谱，粒子数和角动量一致。 SDP 最优值的启发式外推表明，当前形式的辅助算子最多可以给出约 0.222 美元，而有限系统的精确对角化使真实差距接近 0.4 美元。更大的辅助算子系列可以将界限进一步推向真正的差距，并且 SDP 公式使这些系列易于测试。改进的证明和SDP搜索是在作者的指导下由AI模型Claude Opus 5.5（Anthropic）完成的。", "authors": [{"name": "Qiang Gao"}], "featured_authors": [{"name": "Qiang Gao"}], "author_count": 1}, {"id": "2610.12714", "category": "cond-mat", "title": "Electron binding by charge disorder surrounding gapped bilayer graphene", "abstract": "Bilayer graphene (BLG) is a unique electronic material offering electrostatic tunability of its band gap. Here, we study how charge disorder in the dielectric environment modifies band-edge states by binding electrons and holes to Coulomb centres, taking into account the in- and out-of-plane dielectric response of Bernal bilayers. We apply this framework to (a) hBN-encapsulated medium-size-gap BLG used for gate-defined quantum dots, and (b) BLG under double n/p ionic gating. In hBN/BLG/hBN, we find that single remote charges produce only weakly bound states, with binding energies generally small compared with the BLG gap. Under ionic gating, we find that the bound states are too large to be trapped by individual ions -- localisation arises from fluctuations in the ion density, whose magnitude is limited by Coulomb charging energy at the freezing temperature $T_f$ of the ionic configuration. Thus, in both regimes, charge disorder does not produce deep midgap states, with the bound states remaining closer to the conduction and valence band edges.", "url": "https://arxiv.org/abs/2610.12714", "type": "理论", "summary": "双层石墨烯（BLG）是一种独特的电子材料，其带隙具有静电可调性。在这里，我们研究介电环境中的电荷无序如何通过将电子和空穴结合到库仑中心来改变带边状态，同时考虑伯纳尔双层的面内和面外介电响应。我们将此框架应用于（a）用于门定义量子点的 hBN 封装的中等尺寸带隙 BLG，以及（b）双 n/p 离子门控下的 BLG。在 hBN/BLG/hBN 中，我们发现单个远程电荷仅产生弱束缚态，与 BLG 能隙相比，束缚能通常较小。在离子门控下，我们发现束缚态太大而无法被单个离子捕获——局域化是由离子密度的波动引起的，其大小受到离子构型冻结温度$T_f$下库仑充电能量的限制。因此，在这两种情况下，电荷无序不会产生深的中带隙态，束缚态仍然更接近导带和价带边缘。", "authors": [{"name": "Jude McClay"}, {"name": "Angelika Knothe"}, {"name": "Igor Rozhansky"}, {"name": "Vladimir Fal'ko"}], "featured_authors": [{"name": "Jude McClay"}, {"name": "Angelika Knothe"}, {"name": "Igor Rozhansky"}, {"name": "Vladimir Fal'ko"}], "author_count": 4}, {"id": "2610.12746", "category": "cond-mat", "title": "The quantum geometry of the chemical bond", "abstract": "Electronic properties of materials depend both on band energies and quantum geometry of electronic states. We relate bonding indices to the quantum geometric tensor (QGT), showing how chemical bonding dictates the momentum-space texture of bands, bridging chemical and physical descriptions of solids. We show the QGT decomposed into the three center bond index, weighted by their oriented area. Resolving these contributions by orbital pair reveals the donor--acceptor character that distinguish ionic, covalent, hypervalent, and metavalent bonding. We identify the bonding pattern for topology in materials: noncollinear three center bonds, which are the source of Berry curvature in solids. Bond fluctuation can be directly linked to electromagnetic response by resolving their energy spectrum, opening a quantitative route towards the design of physical properties of materials from bonding motifs.", "url": "https://arxiv.org/abs/2610.12746", "type": "理论", "summary": "材料的电子特性取决于电子态的能带能量和量子几何形状。我们将键合指数与量子几何张量（QGT）联系起来，展示了化学键如何决定能带的动量空间结构，桥接固体的化学和物理描述。我们将 QGT 分解为三个中心债券指数，并按其定向面积加权。通过轨道对解决这些贡献揭示了区分离子键、共价键、超价键和元价键的供体-受体特征。我们确定了材料中拓扑的键合模式：非共线三中心键，这是固体中贝里曲率的来源。通过解析其能谱，键涨落可以直接与电磁响应联系起来，为从键合图案设计材料的物理性能开辟了一条定量途径。", "authors": [{"name": "Gabrielle Carrel"}, {"name": "Nishchhal Verma"}, {"name": "Fatmagül Katmer"}, {"name": "Leslie M. Schoop"}, {"name": "Raquel Queiroz"}], "featured_authors": [{"name": "Gabrielle Carrel"}, {"name": "Nishchhal Verma"}, {"name": "Fatmagül Katmer"}, {"name": "Leslie M. Schoop"}, {"name": "Raquel Queiroz"}], "author_count": 5}, {"id": "2610.12749", "category": "cond-mat", "title": "Corrugated Niobene: Stability, Mechanical and Electronic Properties from First-Principles Calculations", "abstract": "The growing diversity of two-dimensional (2D) materials has expanded opportunities in electronics, energy technologies, catalysis, and optical applications. Within this landscape, understanding how corrugated architectures accommodate metallic bonding and influence the stability and properties of monoelemental niobium sheets remains an open research direction. Here, we propose a corrugated niobene nanosheet, denoted c-Nb, and investigate its structural, energetic, vibrational, mechanical, electronic, and optical properties using density functional theory simulations. The optimized structure adopts a centrosymmetric P-3m1 symmetry, with six atoms per primitive cell and a geometrical thickness of 4.279 Angstrom. Its cohesive energy of -6.03 eV/atom indicates strong binding relative to isolated atoms, although bulk BCC Nb remains energetically favored by 2.49 eV/atom. The absence of imaginary phonon frequencies along the investigated high-symmetry path and the positive-definite in-plane stiffness matrix support dynamical and mechanical structural stability. Despite its pronounced corrugation, the nanosheet exhibits isotropic in-plane elasticity, with Young's and shear moduli of 43.66 N/m and 13.66 N/m, respectively, and a Poisson's ratio of 0.598. Electronic states near the Fermi level are dominated by Nb 4d orbitals, establishing multiband metallicity. These findings identify a corrugated structural candidate that combines strong cohesion, elastic compliance, and metallic electronic behavior, extending the structural diversity of monoelemental 2D metals and providing a basis for further exploration of niobium nanosheets in electronic and ultraviolet-responsive systems.", "url": "https://arxiv.org/abs/2610.12749", "type": "理论+数值", "summary": "二维 (2D) 材料日益多样化，扩大了电子、能源技术、催化和光学应用领域的机会。在这种情况下，了解波纹结构如何适应金属键合并影响单元素铌片的稳定性和性能仍然是一个开放的研究方向。在这里，我们提出了一种波纹铌烯纳米片，表示为 c-Nb，并使用密度泛函理论模拟研究其结构、能量、振动、机械、电子和光学特性。优化后的结构采用中心对称P-3m1对称性，每个原胞有6个原子，几何厚度为4.279埃。其内聚能为 -6.03 eV/原子，表明相对于孤立原子具有较强的结合力，尽管块状 BCC Nb 仍然受到 2.49 eV/原子的能量青睐。沿着所研究的高对称性路径不存在虚声子频率，并且正定面内刚度矩阵支持动态和机械结构稳定性。\n\n尽管具有明显的波纹，纳米片仍表现出各向同性的面内弹性，杨氏模量和剪切模量分别为 43.66 N/m 和 13.66 N/m，泊松比为 0.598。费米能级附近的电子态以 Nb 4d 轨道为主，建立了多带金属丰度。这些发现确定了一种波纹结构候选物，它结合了强内聚力、弹性柔量和金属电子行为，扩展了单元素二维金属的结构多样性，并为进一步探索电子和紫外线响应系统中的铌纳米片提供了基础。", "authors": [{"name": "Willian O. Santos"}, {"name": "José A. S. Laranjeira"}, {"name": "Kleuton A. L. Lima"}, {"name": "Douglas S. Galvão"}, {"name": "David L. Azevedo"}], "featured_authors": [{"name": "Willian O. Santos"}, {"name": "José A. S. Laranjeira"}, {"name": "Kleuton A. L. Lima"}, {"name": "Douglas S. Galvão"}, {"name": "David L. Azevedo"}], "author_count": 5}, {"id": "2610.12798", "category": "cond-mat", "title": "Quadratic XY-anisotropy correction to the spontaneous staggered magnetization of the gapped XYZ spin-$1/2$ chain", "abstract": "The staggered order parameter of the gapped XYZ spin-$1/2$ chain follows from the eight-vertex solution, but in elliptic variables that fix the Hamiltonian couplings only implicitly. We derive a closed form for the coefficient governing the leading quadratic response of the spontaneous staggered magnetization to the XY anisotropy at fixed longitudinal anisotropy in the gapped antiferromagnetic regime. Starting from the Baxter--Kelland--Jimbo--Miwa--Nakayashiki polarization formula, we show that at fixed longitudinal anisotropy both the modular nome and the crossing-parameter variable of the formula move with the XY anisotropy, and that the motion of the crossing-parameter variable reverses the sign of the expansion at fixed elliptic variables. The coefficient is a rational term plus a Lambert series. It is strictly negative and bounded above by a rational function of the longitudinal anisotropy, to which it is asymptotic in the Ising limit. At the isotropic point it diverges as the inverse five-halves power of the distance to that point, and since the Lambert sum has an asymptotic expansion with exponentially small remainder, the subleading terms of the divergence also follow in closed form. When the XY anisotropy vanishes as the five-fourths power of the distance to the isotropic point, the ratio of the perturbed to the unperturbed order parameter tends to a Gaussian in the scaling variable, and the quadratic truncation is controlled when that variable is small. A fourth-order perturbative calculation in the spin chain, with no input from the eight-vertex solution, reproduces the leading strong-coupling behaviour, and infinite-DMRG calculations at four anisotropies in the gapped regime are consistent with the closed form.", "url": "https://arxiv.org/abs/2610.12798", "type": "理论+数值", "summary": "有间隙的 XYZ 自旋 $1/2$ 链的交错序参数来自八顶点解，但在椭圆变量中仅隐式地固定哈密顿耦合。我们推导了控制自发交错磁化对带隙反铁磁区域中固定纵向各向异性的 XY 各向异性的主导二次响应的系数的封闭形式。从Baxter--Kelland--Jimbo--Miwa--Nakayashiki偏振公式出发，我们证明了在固定纵向各向异性下，公式的模节点和交叉参数变量都随XY各向异性移动，并且交叉参数变量的运动与固定椭圆变量处的膨胀符号相反。该系数是有理项加上朗伯级数。它是严格负的，并且以纵向各向异性的有理函数为界，在伊辛极限上渐近。\n\n在各向同性点，它发散为到该点的距离的倒五次幂，并且由于兰伯特和具有指数小余数的渐近展开式，因此发散的次主导项也遵循封闭形式。当 XY 各向异性随着到各向同性点的距离的四分之五次方消失时，扰动与未扰动的阶次参数之比在尺度变量中趋于高斯，并且当该变量较小时，二次截断受到控制。自旋链中的四阶微扰计算，在没有来自八顶点解的输入的情况下，再现了主要的强耦合行为，并且在带隙区域中的四个各向异性处的无限DMRG计算与闭合形式一致。", "authors": [{"name": "Felipe Taha Sant'Ana"}], "featured_authors": [{"name": "Felipe Taha Sant'Ana"}], "author_count": 1}, {"id": "2610.12956", "category": "cond-mat", "title": "Vacuum-field-mediated Landau-level reconstruction in a cavity-coupled two-dimensional electron gas", "abstract": "We study a two-dimensional electron gas in the integer quantum Hall regime coupled to a single spatially modulated cavity mode in the static off-resonant limit. Retaining both paramagnetic and diamagnetic contributions on equal footing, we derive a gauge complete single-particle Hamiltonian in which virtual photon exchange generates a periodic kinetic renormalization and a diamagnetic scalar potential. Both terms transfer momentum by $2k_0$ and displace guiding centers by $\\Delta X=2k_0\\ell_B^2$, forming a finite-$k_0$ momentum ladder. Diagonalizing the strip Hamiltonian, we find that the ladder reconstructs the Landau-level band structure and redistributes, rather than multiplies, the associated chiral edge states. Occupied-subspace Chern numbers remain $C_\\nu=\\nu$ for $\\nu=1,2,3$ throughout $0\\le\\lambda_{\\mathrm{cav}}\\le 0.5$, while the bulk gaps decrease without closing. Strip Kubo responses show cavity-induced displacements of the Hall-step energies; at finite width the plateau heights are noninteger and approach the integers as $L_x$ increases. The ladder is spectrally resolved at $k_0\\ell_B=0.5$ and collapses at $k_0\\ell_B=0.1$. These results isolate a spatially local, finite-$k_0$ momentum ladder as a clean-system mechanism by which a structured vacuum field reconstructs quantum Hall spectra and strip transport without changing the integer topology, complementary to cavity-mediated all-to-all hopping.", "url": "https://arxiv.org/abs/2610.12956", "type": "理论+数值", "summary": "我们研究了整数量子霍尔体系中的二维电子气与静态非谐振极限中的单个空间调制腔模式的耦合。在同等基础上保留顺磁和抗磁贡献，我们推导出一个规范完整的单粒子哈密顿量，其中虚拟光子交换产生周期性动力学重正化和抗磁标量势。两项均将动量转移 $2k_0$ 并将引导中心移动 $\\Delta X=2k_0\\ell_B^2$，形成有限 $k_0$ 动量梯。对哈密顿量进行对角化，我们发现梯子重建了朗道能带结构并重新分布而不是相乘相关的手性边缘态。占用子空间陈数在 $0\\le\\lambda_{\\mathrm{cav}}\\le 0.5$ 范围内保持为 $C_\\nu=\\nu$（对于 $\\nu=1,2,3$），而块间隙减小但未闭合。带状 Kubo 响应显示了空腔引起的霍尔阶跃能量位移；在有限宽度下，平台高度不是整数，并且随着 $L_x$ 的增加而接近整数。阶梯在 $k_0\\ell_B=0.5$ 处进行光谱解析，并在 $k_0\\ell_B=0.1$ 处崩溃。\n\n这些结果将空间局部的、有限的$k_0$动量梯隔离为一种清洁系统机制，通过该机制，结构化真空场可以在不改变整数拓扑的情况下重建量子霍尔光谱和带状输运，与腔介导的全对全跳变互补。", "authors": [{"name": "Zi-Heng Zhu"}, {"name": "Yu Chen"}], "featured_authors": [{"name": "Zi-Heng Zhu"}, {"name": "Yu Chen"}], "author_count": 2}, {"id": "2610.12996", "category": "cond-mat", "title": "Real-Time Relaxation Dynamics of Dark Excitons in Mirror-Symmetric Monolayers", "abstract": "Symmetry governs which exciton-phonon (\\textit{exc-ph}) scattering channels \\textit{can} exist, but not which a relaxing exciton actually uses. Combining group theory with \\textit{ab initio} many-body perturbation theory, we derive the mirror parity $\\sigma_h$, of finite-momentum excitons in planar $D_{3h}$ monolayers, and form exact \\textit{exc-ph} selection rules that hold across the whole Brillouin zone. The parity of the lowest exciton band changes across a closed contour. The even phonons connect states of the same parity, while odd phonons connect states of opposite parity. We use these rules to compute exciton linewidths and we solve the real-time Boltzmann transport equation for monolayer GaN as the test case and benchmark it against monolayer \\textit{h}BN.", "url": "https://arxiv.org/abs/2610.12996", "type": "理论+数值", "summary": "对称性决定了哪些激子-声子 (\\textit{exc-ph}) 散射通道 \\textit{可以} 存在，但不决定松弛激子实际使用哪些通道。将群论与 \\textit{ab initio} 多体微扰理论相结合，我们推导了平面 $D_{3h}$ 单层中有限动量激子的镜像宇称 $\\sigma_h$，并形成了适用于整个布里渊区的精确 \\textit{exc-ph} 选择规则。最低激子带的奇偶性在闭合轮廓上变化。偶数声子连接相同宇称的状态，而奇数声子连接相反宇称的状态。我们使用这些规则来计算激子线宽，并求解单层 GaN 的实时玻尔兹曼输运方程作为测试用例，并将其与单层 \\textit{h}BN 进行基准测试。", "authors": [{"name": "Rishabh Saraswat"}, {"name": "Mantasha Ansari"}, {"name": "Rekha Verma"}, {"name": "Sitangshu Bhattacharya"}], "featured_authors": [{"name": "Rishabh Saraswat"}, {"name": "Mantasha Ansari"}, {"name": "Rekha Verma"}, {"name": "Sitangshu Bhattacharya"}], "author_count": 4}, {"id": "2610.13009", "category": "cond-mat", "title": "Odd-Parity Crystalline Electric Field and Multipoles in Icosahedral Quasicrystal and Approximant: Magnetic Toroidal and Electric Dipoles in Ce-Based Systems", "abstract": "Quasicrystals (QCs) lack periodic arrangement of atoms but possess unique structural order distinct from periodic crystals and random systems. The electronic property is far from complete understanding. Here we have formulated not only even-parity but also odd-parity crystalline electric field (CEF) in the Ce-based icosahedral QC and approximant crystal (AC) on the basis of the point charge model. Under the odd-parity CEF due to local-inversion symmetry breaking at the Ce site, the hybrid wavefunction of 4f and 5d states at Ce is shown to give rise to the odd-parity multipoles such as electric dipole and magnetic toroidal (MT) dipole. We have found that the vortex order in the 1/1 AC where the magnetic moments on each icosahedron swirl is characterized by the cluster-type MT moment. The ferroic alignment of the cluster MT moments in the vortex order gives rise to the electro-magnetic effect. The cluster-MT moment is shown to be resonated with the MT dipole moments in each icosahedron by tuning the 4f energy level and 5d energy level so as to approach. We have revealed a noncollinear magnetic structure is stabilized in the ground state of the icosahedral QC cluster, behind which there exists underlying mechanism to prefer the ferroic interaction for the net MT dipole moments between the icosahedrons. We point out that the 4f and 5d energy levels can be made approach at the valence transition or the valence crossover, which is ubiquitous in the rare-earth based ACs and QCs.", "url": "https://arxiv.org/abs/2610.13009", "type": "理论", "summary": "准晶体（QC）缺乏原子的周期性排列，但具有不同于周期性晶体和随机系统的独特结构顺序。电子属性还远未完全了解。在这里，我们基于点电荷模型，在 Ce 基二十面体 QC 和近似晶体 (AC) 中不仅制定了偶宇称晶体电场 (CEF)，还制定了奇宇称晶体电场 (CEF)。在由于 Ce 位点局域反演对称性破缺而产生的奇宇称 CEF 下，Ce 处 4f 和 5d 态的混合波函数被证明会产生奇宇称多极子，例如电偶极子和磁环形（MT）偶极子。我们发现，在1/1 AC 中，每个二十面体涡流上的磁矩以簇型MT 矩为特征。簇 MT 矩按涡序排列的铁性排列会产生电磁效应。通过调整4f能级和5d能级，簇-MT矩被证明与每个二十面体中的MT偶极矩共振以接近。\n\n我们揭示了在二十面体 QC 团簇的基态下稳定的非共线磁结构，其背后存在潜在机制，倾向于二十面体之间的净 MT 偶极矩的铁相互作用。我们指出，4f 和 5d 能级可以在价态跃迁或价态交叉处接近，这在稀土基 AC 和 QC 中普遍存在。", "authors": [{"name": "Shinji Watanabe"}, {"name": "Syunta Furuya"}, {"name": "Mitsuaki Kawamura"}], "featured_authors": [{"name": "Shinji Watanabe"}, {"name": "Syunta Furuya"}, {"name": "Mitsuaki Kawamura"}], "author_count": 3}, {"id": "2610.13017", "category": "cond-mat", "title": "Parity-Anomalous Hall Response of Chiral Lifshitz Fermions", "abstract": "The parity anomaly of a single massless Dirac fermion is manifested as a half-quantized Hall response once the required parity-breaking regularization is supplied. We study the corresponding response for two-dimensional chiral Lifshitz fermions. For a node with low-energy coupling (qx +iqy)^N, the Fermi-loop winding number W = N gives an anomalous Hall response {\\sigma}xy^anom = (W/2)e^2/h. We examine this mechanism in chiral multilayer Haldane models tuned to a valley-selective critical line, where a single gapless chiral Lifshitz fermion remains at the K valley. For the AB, ABC, and ABCA stacks, the projected pseudospin textures give W = 2, 3, 4, while Kubo calculations yield {\\sigma}xy = (1, 3/2, 2)e^2/h; integrated equilibrium boundary currents reproduce the same W/2 sequence. Six-terminal simulations with dephasing further show that the Hall conductivity is quantized at W/2 while the longitudinal conductivity remains finite. These results identify gapless chiral Lifshitz fermions as a higher-order, winding-controlled generalization of the parity-anomalous Hall response, distinct from a quantum anomalous Hall insulating state even when W/2 is an integer.", "url": "https://arxiv.org/abs/2610.13017", "type": "理论+数值", "summary": "一旦提供了所需的宇称破缺正则化，单个无质量狄拉克费米子的宇称异常就会表现为半量子化霍尔响应。我们研究了二维手性 Lifshitz 费米子的相应响应。对于具有低能量耦合的节点 (qx +iqy)^N，费米环绕组数 W = N 给出反常霍尔响应 {\\sigma}xy^anom = (W/2)e^2/h。我们在调整到谷选择性临界线的手性多层 Haldane 模型中研究了这种机制，其中单个无间隙手性 Lifshitz 费米子保留在 K 谷处。对于 AB、ABC 和 ABCA 堆栈，投影赝自旋纹理给出 W = 2, 3, 4，而 Kubo 计算得出 {\\sigma}xy = (1, 3/2, 2)e^2/h；积分平衡边界电流再现相同的 W/2 序列。具有移相功能的六端模拟进一步表明，霍尔电导率以 W/2 量化，而纵向电导率仍然有限。这些结果将无带隙手性 Lifshitz 费米子识别为奇偶校验反常霍尔响应的高阶、绕线控制推广，与量子反常霍尔绝缘态不同，即使 W/2 是整数也是如此。", "authors": [{"name": "Yanmiao Han"}, {"name": "Rundong Zhao"}, {"name": "Yu-Hao Wan"}], "featured_authors": [{"name": "Yanmiao Han"}, {"name": "Rundong Zhao"}, {"name": "Yu-Hao Wan"}], "author_count": 3}, {"id": "2610.13169", "category": "cond-mat", "title": "Imbibition dynamics under dissolution-driven fluid thickening", "abstract": "The imbibition of milk into a biscuit provides an example of a broader class of processes in which a liquid invades a porous material, dissolving components of the solid and thereby modifying its own rheology. This coupling between imbibition, dissolution, and evolving fluid rheology also occurs in food processing, filtration, and reactive porous media. While the resulting changes in fluid viscosity are known to affect imbibition, a quantitative description of how this evolving rheology determines the imbibition dynamics is still lacking. Here, we establish such a description for dissolution-driven fluid thickening. For a capillary tube in the well-mixed limit, we derive a generalized Washburn law showing that the evolving viscosity can be incorporated through a rescaled time given by the accumulated inverse viscosity. This predicts a collapse of the imbibition dynamics for different dissolution rates, which we confirm numerically using coupled free-surface and solute-transport simulations. When diffusion is slower, concentration and viscosity become spatially heterogeneous, resulting in a weaker retardation of the advancing liquid than predicted by the well-mixed theory. We then consider disordered porous media and quantify how dissolution-driven thickening and variations in pore geometry affect the dynamics. Our results extend the classical Washburn description to imbibition with evolving fluid properties and provide a quantitative basis for understanding fluid uptake when interactions with the solid progressively modify the rheology of the invading liquid.", "url": "https://arxiv.org/abs/2610.13169", "type": "理论+数值", "summary": "将牛奶吸入饼干中提供了更广泛的过程的一个例子，其中液体侵入多孔材料，溶解固体成分，从而改变其自身的流变学。吸入、溶解和演变的流体流变学之间的这种耦合也发生在食品加工、过滤和反应性多孔介质中。虽然已知由此产生的流体粘度变化会影响吸吸，但仍然缺乏这种不断变化的流变学如何决定吸吸动力学的定量描述。在这里，我们对溶解驱动的流体增稠建立了这样的描述。对于处于充分混合极限的毛细管，我们推导出广义沃什伯恩定律，表明可以通过累积反粘度给出的重新调整时间来合并不断变化的粘度。这预测了不同溶解速率下的吸入动力学的崩溃，我们使用耦合自由表面和溶质传输模拟在数值上证实了这一点。当扩散较慢时，浓度和粘度在空间上变得不均匀，导致前进液体的延迟比充分混合理论预测的要弱。\n\n然后，我们考虑无序多孔介质，并量化溶解驱动的增稠和孔隙几何形状的变化如何影响动力学。我们的研究结果将经典的沃什伯恩描述扩展到具有不断变化的流体特性的吸入，并为理解当与固体相互作用逐渐改变入侵液体的流变学时流体的吸收提供了定量基础。", "authors": [{"name": "H. W. Almeida"}, {"name": "A. F. V. Matias"}, {"name": "R. C. V. Coelho"}, {"name": "N. A. M. Araujo"}], "featured_authors": [{"name": "H. W. Almeida"}, {"name": "A. F. V. Matias"}, {"name": "R. C. V. Coelho"}, {"name": "N. A. M. Araujo"}], "author_count": 4}, {"id": "2610.13251", "category": "cond-mat", "title": "Ultrafast laser-stimulated field emission from a metal: a non-equilibrium Green's functions approach", "abstract": "Ultrafast laser-assisted field emission from metallic nanotips is a promising route for generating coherent electron pulses. However, existing theoretical models often neglect many-body strong correlation effects in the emitter's electronic structure and its response to the optical field. In this work, we propose a theoretical framework based on the non-equilibrium Green's function formalism to simulate the out-of-equilibrium electron dynamics across a strongly driven matter-vacuum interface, in a one-dimensional model. Treating the tip-vacuum coupling perturbatively, we find that the interplay between strong-field emission and multi-photon emission regimes can be described in terms of a filtering of the emitter's local density of occupied states through field-dressed vacuum propagators. By including electron-electron interactions via the second-Born approximation, we show that correlation-induced modifications in the electronic structure are directly transferred to the far-field spectrum. Finally, by self-consistently solving the Dyson equation at the interface, we uncover a dynamic back-action regime driven by the optical field, characterized by a periodic polarization of the emitter, which reshapes the far-field spectrum. This shows that the non-equilibrium Green's functions approach provides a versatile framework for exploring and analyzing field emission of correlated electrons.", "url": "https://arxiv.org/abs/2610.13251", "type": "理论", "summary": "金属纳米尖端的超快激光辅助场发射是产生相干电子脉冲的有前途的途径。然而，现有的理论模型往往忽略了发射体电子结构及其对光场响应的多体强相关效应。在这项工作中，我们提出了一个基于非平衡格林函数形式主义的理论框架，在一维模型中模拟强驱动物质-真空界面上的非平衡电子动力学。微扰地处理尖端真空耦合，我们发现强场发射和多光子发射机制之间的相互作用可以用通过场修饰真空传播器过滤发射器占据态的局部密度来描述。通过二次玻恩近似包含电子-电子相互作用，我们表明电子结构中相关引起的修改直接转移到远场光谱。\n\n最后，通过自洽求解界面处的戴森方程，我们发现了由光场驱动的动态反作用机制，其特征是发射器的周期性偏振，从而重塑了远场光谱。这表明非平衡格林函数方法为探索和分析相关电子的场发射提供了一个通用框架。", "authors": [{"name": "Luciano Jacopo D'Onofrio"}, {"name": "Adolfo Avella"}, {"name": "Martin Eckstein"}], "featured_authors": [{"name": "Luciano Jacopo D'Onofrio"}, {"name": "Adolfo Avella"}, {"name": "Martin Eckstein"}], "author_count": 3}, {"id": "2610.13400", "category": "cond-mat", "title": "Quantitative Eshelby stability: local and finite-shape theory through AI-assisted mechanics", "abstract": "How can human researchers use artificial intelligence (AI) to make progress on difficult mechanics problems while retaining control of physical significance, mathematical rigor, and validation? We explore this opportunity through a quantitative stability problem rooted in the Eshelby conjecture. For a uniform dilatational eigenstrain in a homogeneous isotropic solid, we establish a nonlinear two-sided relation between whole-interior strain heterogeneity and a geometry-only distance from the ellipsoid family, with half-order Sobolev scaling that captures morphological length scale. We then develop a complementary finite-shape theory: ellipsoidal subtraction yields an exact residual-field budget from which systematically convergent upper and lower bounds are obtained for a prescribed geometry. Applied to protruded, indented, and necked inclusions, the bounds agree with independent displacement-based finite-element calculations. The study also documents a human-led, AI-assisted research process in which researchers select consequential problems, shape targets, audit arguments, require independent checks, and interpret mechanics, while AI broadens analytical exploration and supports computation. This experience also led us to develop Open Problems in Mechanics, a versioned community-facing map that makes selected mechanics questions, their known/open boundaries, and criteria for progress explicit.", "url": "https://arxiv.org/abs/2610.13400", "type": "理论+数值", "summary": "人类研究人员如何利用人工智能 (AI) 在困难的力学问题上取得进展，同时保持对物理意义、数学严谨性和验证的控制？我们通过源于埃谢尔比猜想的定量稳定性问题来探索这个机会。对于均匀各向同性固体中的均匀膨胀本征应变，我们在整个内部应变异质性和距椭球体族的仅几何距离之间建立了非线性双边关系，并使用半阶 Sobolev 缩放来捕获形态长度尺度。然后，我们开发了一种互补的有限形状理论：椭圆体减法产生精确的剩余场预算，从中系统地获得指定几何形状的收敛上限和下限。应用于突出、锯齿和颈缩的夹杂物时，边界与基于独立位移的有限元计算一致。\n\n该研究还记录了一个由人类主导、人工智能辅助的研究过程，其中研究人员选择相应的问题、制定目标、审计论点、要求独立检查并解释力学，而人工智能则扩大了分析探索并支持计算。这一经验还促使我们开发了力学中的开放问题，这是一个面向社区的版本化地图，使选定的力学问题、其已知/开放边界以及进展标准变得明确。", "authors": [{"name": "Bo Ni"}], "featured_authors": [{"name": "Bo Ni"}], "author_count": 1}, {"id": "2610.13401", "category": "cond-mat", "title": "Temperature evolution of spin dynamics in extended Kitaev models within an Abrikosov fermion theory beyond mean field", "abstract": "The $S=1/2$ Kitaev model provides an exactly solvable setting in which spin fractionalization produces itinerant Majorana fermions coupled to an emergent $\\mathbb{Z}_2$ gauge field. In realistic Kitaev magnets, however, non-Kitaev interactions break integrability and make their finite-temperature dynamics difficult to calculate. We develop a finite-temperature parton mean-field theory based on the Abrikosov-fermion representation and incorporate the effects of exchange interactions through the random phase approximation to calculate the dynamical spin structure factor. For the pure Kitaev model, the method reproduces a strong, nearly dispersionless peak at a finite low energy together with a broad continuum at higher energies. It also reproduces the momentum dependence of the dynamical spin structure factor and its temperature evolution, including the downward shift of the low-energy spectral weight, in qualitative agreement with continuous-time quantum Monte Carlo calculations. Within the present theory, the contraction of the continuum is traced to the temperature-induced reduction of the bond amplitudes, which narrows the parton bands and compresses the two-parton phase space. For ferromagnetic Kitaev coupling, the energy of the low-energy peak is minimized at the $\\Gamma$ point for a ferromagnetic Heisenberg interaction and maximized there for an antiferromagnetic interaction. In the ferromagnetic Kitaev-$\\Gamma$ model, the static response develops a finite-momentum softening, indicating an instability toward the period-three magnetic order reported in numerical studies. For uniform-ferromagnetic states selected by a $[111]$ magnetic field, we find that a broad parton continuum coexists with magnonlike dispersive structures, producing spectral features consistent with a spinon-to-magnon crossover.", "url": "https://arxiv.org/abs/2610.13401", "type": "理论+数值", "summary": "$S=1/2$ Kitaev 模型提供了一个完全可解的设置，其中自旋细分产生与新兴 $\\mathbb{Z}_2$ 规范场耦合的流动马约拉纳费米子。然而，在现实的基塔耶夫磁体中，非基塔耶夫相互作用破坏了可积性，并使它们的有限温度动力学难以计算。我们开发了基于阿布里科索夫费米子表示的有限温度部分子平均场理论，并通过随机相位近似结合交换相互作用的影响来计算动态自旋结构因子。对于纯基塔耶夫模型，该方法在有限的低能量下再现了强的、几乎无色散的峰，并在较高能量下再现了宽连续谱。它还再现了动态自旋结构因子的动量依赖性及其温度演化，包括低能谱权重的向下移动，与连续时间量子蒙特卡罗计算定性一致。在本理论中，连续体的收缩可追溯到温度引起的键振幅的减小，这使部分子带变窄并压缩两部分子相空间。\n\n对于铁磁基塔耶夫耦合，对于铁磁海森堡相互作用，低能峰的能量在 $\\Gamma$ 点处最小化，而对于反铁磁相互作用，低能峰的能量在 $\\Gamma$ 点处最大化。在铁磁 Kitaev-$\\Gamma$ 模型中，静态响应产生有限动量软化，表明数值研究中报告的三周期磁序不稳定。对于$[111]$磁场选择的均匀铁磁态，我们发现宽的部分子连续体与类磁振子色散结构共存，产生与自旋子到磁振子交叉一致的光谱特征。", "authors": [{"name": "Daiki Sasamoto"}, {"name": "Joji Nasu"}], "featured_authors": [{"name": "Daiki Sasamoto"}, {"name": "Joji Nasu"}], "author_count": 2}, {"id": "2610.13410", "category": "cond-mat", "title": "The Stone-Wales trefoil: a new topological defect in graphene", "abstract": "Specific heat of graphite at high temperatures demonstrates significant deviation from the ``3R'' Dulong-Petite law. It can be explained by accumulation of defects with formation energy as low as 1.45 eV. Based on the density functional theory calculations, we propose a possible candidate of topological defects, whose energy is comparable to the growth activation energy.", "url": "https://arxiv.org/abs/2610.13410", "type": "理论+数值", "summary": "石墨在高温下的比热显示出与“3R”Dulong-Petite 定律的显着偏差。这可以用形成能低至 1.45 eV 的缺陷积累来解释。基于密度泛函理论计算，我们提出了一种可能的拓扑缺陷候选者，其能量与生长激活能相当。", "authors": [{"name": "M.V. Kondrin"}, {"name": "Y.B. Lebed"}, {"name": "V.V. Brazhkin"}], "featured_authors": [{"name": "M.V. Kondrin"}, {"name": "Y.B. Lebed"}, {"name": "V.V. Brazhkin"}], "author_count": 3}, {"id": "2610.13418", "category": "cond-mat", "title": "VN-GraphGG: von Neumann--Mullins--based graph grain growth simulation", "abstract": "Efficient simulations of grain growth are essential for investigating the process-structure-property relationships in polycrystalline materials. We introduce a two-dimensional von Neumann-Mullins-based graph grain growth simulation (VN-GraphGG), which couples the grain-scale kinetics with microstructure reconstruction. The polycrystalline microstructure is represented as a graph with grain and junction nodes. The grain-area evolution on the grain graph is governed by the von Neumann--Mullins (VN) law, while a graph neural network is trained to reconstruct the microstructure from the graph. This separation allows kinetic coefficients to be varied without retraining the neural reconstruction model. Topological changes during grain growth such as disappearance of grains and changes in neighbor relations are handled straightforwardly through reconstruction and postprocessing. Simulations demonstrate accurate predictions of VN kinetics and coarsening statistics, and significant speedup over the phase-field simulations. The proposed method provides a foundation for efficient grain growth simulation based on grain-scale kinetics, opening the way to incorporate a broader range of physical mechanisms. An application example is presented for abnormal grain growth, in which kinetic heterogeneity significantly influences the grain microstructure evolution.", "url": "https://arxiv.org/abs/2610.13418", "type": "理论+数值", "summary": "晶粒生长的有效模拟对于研究多晶材料的过程-结构-性能关系至关重要。我们引入了基于冯·诺依曼-穆林斯的二维图晶粒生长模拟（VN-GraphGG），它将晶粒尺度动力学与微观结构重建结合起来。多晶微观结构表示为带有晶粒和结点的图表。晶粒图上的晶粒面积演化受冯·诺依曼-穆林斯 (VN) 定律支配，而图神经网络则经过训练以从图中重建微观结构。这种分离允许改变动力学系数，而无需重新训练神经重建模型。晶粒生长过程中的拓扑变化，例如晶粒消失和相邻关系的变化，可以通过重建和后处理直接处理。仿真证明了 VN 动力学和粗化统计数据的准确预测，以及相场仿真的显着加速。\n\n所提出的方法为基于晶粒尺度动力学的有效晶粒生长模拟奠定了基础，为整合更广泛的物理机制开辟了道路。提出了异常晶粒生长的应用示例，其中动力学不均匀性显着影响晶粒微观结构的演变。", "authors": [{"name": "Yuntong Huang"}, {"name": "Zhihao Li"}, {"name": "Shuyang Dai"}, {"name": "Chang Ma"}, {"name": "Yang Xiang"}], "featured_authors": [{"name": "Yuntong Huang"}, {"name": "Zhihao Li"}, {"name": "Shuyang Dai"}, {"name": "Chang Ma"}, {"name": "Yang Xiang"}], "author_count": 5}, {"id": "2610.13420", "category": "cond-mat", "title": "Predicting Nanofabrication Variance: A Conditional Diffusion Model", "abstract": "Micro- and nanostructures fabricated by focused ion beam (FIB) milling invariably deviate from input designs due to systematic and stochastic effects such as ablation-rate fluctuations, and redeposition. As such, nominally identical iterations of a given process yield a distribution of non-identical fabrication outcomes, leading to variations in the physical (optical, mechanical) properties of fabricated structures. Existing models of the milling process typically predict a single deterministic fabrication result, neglecting this variability. Here we present a conditional diffusion model that learns the statistical distribution of process outcomes conditioned on input design, enabling it to predict a realistic distribution of possible output sample structures. These predictions accurately reproduce edge morphology, linewidth variations, and defect probabilities observed in fabricated samples, enabling statistical analysis of milling performance and the identification of dominant structural and process parameter-dependent deformation modes. The work establishes a probabilistic modelling framework for fabrication variability analysis and fabrication-aware design optimization.", "url": "https://arxiv.org/abs/2610.13420", "type": "理论+数值", "summary": "由于烧蚀率波动和再沉积等系统性和随机效应，通过聚焦离子束 (FIB) 铣削制造的微米和纳米结构总是会偏离输入设计。因此，给定过程的名义上相同的迭代会产生不同的制造结果的分布，从而导致制造结构的物理（光学、机械）特性的变化。现有的铣削过程模型通常预测单个确定性的制造结果，而忽略了这种可变性。在这里，我们提出了一个条件扩散模型，该模型可以学习以输入设计为条件的过程结果的统计分布，使其能够预测可能的输出样本结构的实际分布。这些预测准确地再现了在制造样品中观察到的边缘形态、线宽变化和缺陷概率，从而能够对铣削性能进行统计分析并识别主要结构和工艺参数相关的变形模式。这项工作为制造变异性分析和制造感知设计优化建立了概率建模框架。", "authors": [{"name": "Wenhan Zhang"}, {"name": "Ben Mills"}, {"name": "Oleksandr Buchnev"}, {"name": "Kevin F. MacDonald"}], "featured_authors": [{"name": "Wenhan Zhang"}, {"name": "Ben Mills"}, {"name": "Oleksandr Buchnev"}, {"name": "Kevin F. MacDonald"}], "author_count": 4}, {"id": "2610.13505", "category": "cond-mat", "title": "Graph-theoretic framework for semi-Markov networks: transient and stationary occupation probabilities, hitting times and weak ergodicity breaking", "abstract": "Semi-Markov networks provide a natural framework for describing stochastic transitions between coarse-grained states with non-exponential dwell times, with applications ranging from biophysics and neuroscience to epidemiology and finance. Here, it is shown that finite semi-Markov networks admit explicit combinatorial representations of their Laplace-transformed occupation probabilities and hitting-time distributions as sums over weighted spanning trees and forests of an augmented graph. These representations yield asymptotic results, including a generalization of the Markov Chain Tree Theorem to semi-Markov networks, in which the rate constants replaced by pseudo-rates given by the inverse mean sojourn time weighted by the exit probability through this channel, as well as the long-time scaling of hitting-time survival probabilities in the presence of infinite-mean sojourn times. They also extend recently derived combinatorial formulas for hitting-time moments to the semi-Markov setting. In particular, the mean hitting-time formula coincides with that of a Markov network with the corresponding pseudo-rates, which also yields a short proof of the constancy of Kemeny's constant for finite-mean semi-Markov networks. Finally, we use the same framework to show that weak ergodicity breaking occurs generically for time-additive state observables that are nonconstant on the support of the limiting distribution in heavy-tailed semi-Markov networks.", "url": "https://arxiv.org/abs/2610.13505", "type": "理论", "summary": "半马尔可夫网络提供了一个自然的框架，用于描述具有非指数停留时间的粗粒度状态之间的随机转换，其应用范围从生物物理学和神经科学到流行病学和金融学。这里表明，有限半马尔可夫网络承认其拉普拉斯变换占用概率和命中时间分布的显式组合表示为增强图的加权生成树和森林的总和。这些表示产生渐近结果，包括将马尔可夫链树定理推广到半马尔可夫网络，其中速率常数被替换为伪速率，该伪速率由通过该通道的退出概率加权的逆平均停留时间给出，以及在存在无限平均停留时间的情况下命中时间生存概率的长期缩放。他们还将最近导出的击球时刻的组合公式扩展到半马尔可夫设置。\n\n特别是，平均命中时间公式与具有相应伪速率的马尔可夫网络的公式一致，这也给出了有限均值半马尔可夫网络的 Kemeny 常数的恒定性的简短证明。最后，我们使用相同的框架来表明弱遍历性破坏通常发生在重尾半马尔可夫网络中限制分布的支持上非常数的时间可加状态可观测量中。", "authors": [{"name": "Julian Voits"}], "featured_authors": [{"name": "Julian Voits"}], "author_count": 1}, {"id": "2610.13519", "category": "cond-mat", "title": "Latin squares as a model of perfect mixing of high-entropy alloys", "abstract": "The structure of high-entropy alloys, which include 5 or more components in equimolar proportions, is proposed to be described in the mathematical language of Latin squares. This model is fundamentally discrete and allows for a quantitative description of ideal mixing, in which any given alloy element is guaranteed not to have an identical element as its nearest neighbor. For the two-dimensional case, the model possesses four axes of translational symmetry, which makes it possible to tile the plane with a single Latin square and, based on the properties of this square, describe the properties of macroscopic material samples. The model makes it possible to make quantitative estimates of the suitability of a particular atomic structure (configuration) for implementation in a perfectly mixed high-entropy alloy with maximum mixing entropy. A condition has been obtained for acceptable fluctuations in the concentration of components at which the thermodynamic stability of the alloy is maintained. The possibility of identifying superstructures in high-entropy alloys based on group theory, as applied to the description and construction of Latin squares, is discussed. Based on the proposed model, the probability of forming a multicomponent alloy with ideal mixing is estimated. For a five-component alloy, this probability is no more than 2.6*10^{-10}.", "url": "https://arxiv.org/abs/2610.13519", "type": "理论", "summary": "高熵合金的结构由5种或更多等摩尔比例的成分组成，建议用拉丁方的数学语言来描述。该模型基本上是离散的，并且允许对理想混合进行定量描述，其中保证任何给定的合金元素与其最近的邻居不具有相同的元素。对于二维情况，该模型具有四个平移对称轴，这使得可以用单个拉丁方平铺平面，并根据该方的属性来描述宏观材料样本的属性。该模型可以定量估计特定原子结构（配置）在具有最大混合熵的完美混合高熵合金中的适用性。已经获得了维持合金热力学稳定性的组分浓度可接受的波动的条件。讨论了基于群论识别高熵合金中超结构的可能性，应用于拉丁方的描述和构造。\n\n基于所提出的模型，估计了形成理想混合的多元合金的概率。对于五元合金，这个概率不超过2.6*10^{-10}。", "authors": [{"name": "P.S. Grinchuk"}], "featured_authors": [{"name": "P.S. Grinchuk"}], "author_count": 1}, {"id": "2610.13523", "category": "cond-mat", "title": "How Fluctuations Control Chiral Symmetry Breaking in Reacting Mixtures of Chiral Molecules", "abstract": "The pronounced chiral asymmetry of biomolecules is a defining feature of living systems, yet the mechanisms by which such asymmetry emerged remain unresolved. Chiral symmetry breaking may have occurred under prebiotic conditions in systems with sufficiently small molecular populations for intrinsic fluctuations to play an important role. Here, we investigate how finite-population fluctuations affect chiral-state selection, the characteristic time for symmetry breaking, and stochastic switching between chiral states in a system driven by autocatalysis and mutual antagonism. We determine how these dynamical processes scale with particle number and derive an analytical expression for the probability of selecting either chiral state as a function of the initial enantiomeric bias. We further calculate the mean selection time for different initial biases and show that, for weak mutual antagonism, fluctuations can induce transitions between opposite chiral states. These results characterize how finite-population fluctuations control both the emergence and stability of molecular chirality in autocatalytic chemical systems.", "url": "https://arxiv.org/abs/2610.13523", "type": "理论+数值", "summary": "生物分子明显的手性不对称性是生命系统的一个决定性特征，但这种不对称性出现的机制仍未解决。手性对称性破缺可能发生在生命起源之前的条件下，在分子群足够小的系统中，内在波动能够发挥重要作用。在这里，我们研究了有限总体波动如何影响手性态选择、对称性破缺的特征时间以及由自催化和相互拮抗驱动的系统中手性态之间的随机切换。我们确定这些动力学过程如何随粒子数缩放，并导出选择任一手性状态的概率作为初始对映体偏差的函数的解析表达式。我们进一步计算了不同初始偏差的平均选择时间，并表明，对于弱的相互拮抗作用，波动可以引起相反手性态之间的转变。这些结果描述了有限总体波动如何控制自催化化学系统中分子手性的出现和稳定性。", "authors": [{"name": "Leonardo Silva-Dias"}, {"name": "Christoph A. Weber"}], "featured_authors": [{"name": "Leonardo Silva-Dias"}, {"name": "Christoph A. Weber"}], "author_count": 2}, {"id": "2610.13542", "category": "cond-mat", "title": "Giant geometric nonlinear transport in inhomogeneously strained Bi$_2$Se$_3$ single crystalline slabs", "abstract": "Electrical transport in non-centrosymmetric materials exhibits a nonlinear conductivity tensor component that generates second-harmonic voltages in response to applied electric fields. Harnessing this effect is essential for developing zero-threshold electromagnetic energy harvesters and broadband frequency upconverters, both of which require maximizing the nonlinear responsivity. Here, we demonstrate that inhomogeneously strained macroscopic slabs of the topological insulator Bi$_2$Se$_3$ achieve a record-high nonlinear responsivity of $10^4\\,\\mu$m/V: a six orders of magnitude boost compared to its thin-film counterparts. We attribute this giant enhancement to a classical geometric nonlinear transport effect, which is driven by complex strain gradients within the bulk material. Notably, a similar geometric mechanism known as geometric nonlinear Hall was previously observed only in microscale-patterned structures. Our findings establish macroscopic strain engineering as a powerful route to enhance nonlinear transport, with immediate relevance to a broad class of layered systems, including transition metal dichalcogenides and moiré heterostructures.", "url": "https://arxiv.org/abs/2610.13542", "type": "理论", "summary": "非中心对称材料中的电传输表现出非线性电导率张量分量，该分量响应于施加的电场而产生二次谐波电压。利用这种效应对于开发零阈值电磁能量收集器和宽带频率上变频器至关重要，这两者都需要最大化非线性响应率。在这里，我们证明了拓扑绝缘体 Bi$_2$Se$_3$ 的非均匀应变宏观板实现了 $10^4\\,\\mu$m/V 的创纪录高非线性响应率：与薄膜对应物相比，提高了六个数量级。我们将这种巨大的增强归因于经典的几何非线性输运效应，该效应是由散装材料内的复杂应变梯度驱动的。值得注意的是，以前仅在微尺度图案结构中观察到一种被称为几何非线性霍尔的类似几何机制。我们的研究结果确立了宏观应变工程作为增强非线性传输的强大途径，与广泛的层状系统直接相关，包括过渡金属二硫属化物和莫尔异质结构。", "authors": [{"name": "Igor Veremchuk"}, {"name": "Pavlo Makushko"}, {"name": "Anita Guarino"}, {"name": "Muhammad Waqee Ur Rehman"}, {"name": "Rosalba Tatiana Fittipaldi"}, {"name": "Tobias Kosub"}, {"name": "Alexej Pashkin"}, {"name": "Fabian Ganss"}, {"name": "Oleg A. Petrenko"}, {"name": "Proloy T. Das"}, {"name": "Rui Xu"}, {"name": "Rhonald Burgos Atencia"}, {"name": "Debottam Mandal"}, {"name": "Antonio Vecchione"}, {"name": "Carmine Ortix"}, {"name": "Denys Makarov"}], "featured_authors": [{"name": "Igor Veremchuk"}, {"name": "Pavlo Makushko"}, {"name": "Anita Guarino"}, {"name": "Antonio Vecchione"}, {"name": "Carmine Ortix"}, {"name": "Denys Makarov"}], "author_count": 16}, {"id": "2610.13584", "category": "cond-mat", "title": "Altermagnetic Control of Charge-4e Superconductivity", "abstract": "We present, to our knowledge, the first theoretical realization of an independent charge-4e phase in a two-dimensional classical array of conventional superconductors coupled through altermagnetic junctions. Tuning the altermagnetic splitting suppresses the leading single-pair tunneling harmonic while retaining strong double-pair coupling, producing a finite charge-4e region between staggered and uniform charge-2e states. Using the complete temperature-dependent microscopic Josephson spectrum, we find short-range ordinary pair correlations alongside algebraic coherence of pairs of Cooper pairs. Berezinskii--Kosterlitz--Thouless scaling and a half-flux response further identify the charge-4e phase. Our results establish altermagnetism as a microscopic means to select between ordinary and composite superconducting coherence.", "url": "https://arxiv.org/abs/2610.13584", "type": "理论", "summary": "据我们所知，我们首次在理论上实现了通过交变磁结耦合的传统超导体的二维经典阵列中的独立电荷 4e 相。调节交变磁分裂可以抑制主要的单对隧道谐波，同时保留强双对耦合，从而在交错和均匀电荷 2e 状态之间产生有限的电荷 4e 区域。使用完整的温度相关微观约瑟夫森谱，我们发现了短程普通对相关性以及库珀对的代数相干性。 Berezinskii--Kosterlitz--Thouless 缩放和半通量响应进一步确定了 charge-4e 相。我们的结果将交变磁力确立为一种在普通超导相干性和复合超导相干性之间进行选择的微观手段。", "authors": [{"name": "Yan-Guang Yue"}, {"name": "Jie Lou"}, {"name": "Yan Chen"}], "featured_authors": [{"name": "Yan-Guang Yue"}, {"name": "Jie Lou"}, {"name": "Yan Chen"}], "author_count": 3}, {"id": "2610.13619", "category": "cond-mat", "title": "Ferroelectric Domain-Wall Motion, Stability, and Frequency Responses under Different Screening-Charge Conservation Laws", "abstract": "We analyze ferroelectric domain wall motion, shape, and internal structure arising from coupling between polarization and screening charge. Universal cases are organized by electrical boundary conditions, charge conservation and dynamics, and polarization free energy. We consider exposed surfaces, interfaces beneath a dielectric layer and top electrode, and interfaces with a blocking mixed ionic-electronic conductor. Screening occurs through local exchange, exchange with lateral transport, or strictly conserved redistribution. Analytical derivations and finite-depth calculations establish screening drag, velocity branches, and conditions for spatial instability. For an isolated wall joining differently compensated domains, strict surface conservation and zero far-field current exclude steady translation of the screening profile, while allowing transient displacement, finite-sample arrest, and charge-balanced structural changes. Conservation also constrains long-distance transport around a moving junction in an adjoining conductor. Large-field simulations in the top-electrode geometry reveal nonlinear corrugation, transfer toward longer wavelengths, and coupled polarization rotation. First-order polarization energetics allow two interphase fronts enclosing a paraelectric core; multiaxial polarization permits wall rotation and competing intermediate ferroelectric domains. A driven structural-screening reduction supports stable periodic behavior. Reduced-variable diagrams summarize motion and structural regimes, while BaTiO3 and BiFeO3 examples connect them to material thermodynamics. Small-signal analysis distinguishes displacement, polarization, and electrostatic response functions. These results provide a framework for wall dynamics and structural transitions under different driving and screening conditions.", "url": "https://arxiv.org/abs/2610.13619", "type": "理论+数值", "summary": "我们分析了极化和屏蔽电荷之间耦合产生的铁电畴壁运动、形状和内部结构。通用情况按电边界条件、电荷守恒和动力学以及极化自由能进行组织。我们考虑暴露的表面、介电层和顶部电极下方的界面以及与阻挡混合离子电子导体的界面。筛选通过局部交换、横向运输交换或严格保守的再分配进行。分析推导和有限深度计算确定了筛选阻力、速度分支和空间不稳定的条件。对于连接不同补偿域的隔离壁，严格的表面守恒和零远场电流排除了屏蔽轮廓的稳定平移，同时允许瞬态位移、有限样本停止和电荷平衡结构变化。保护还限制了相邻导体中移动连接点周围的长距离运输。\n\n顶部电极几何形状的大场模拟揭示了非线性波纹、向更长波长的传输以及耦合偏振旋转。一阶偏振能量学允许两个相间前沿包围顺电核心；多轴极化允许壁旋转和竞争中间铁电域。驱动结构筛选减少支持稳定的周期性行为。减变量图总结了运动和结构状态，而 BaTiO3 和 BiFeO3 示例将它们与材料热力学联系起来。小信号分析区分位移、极化和静电响应函数。这些结果为不同驱动和筛选条件下的壁动力学和结构转变提供了框架。", "authors": [{"name": "Sergei V. Kalinin"}], "featured_authors": [{"name": "Sergei V. Kalinin"}], "author_count": 1}, {"id": "2610.13666", "category": "cond-mat", "title": "A new approach to the Kondo effect: sophomore's dream function and Lee-Yang zeros", "abstract": "We develop an analytical approach to the Kondo problem based on an effective partition function that generalizes the sophomore's dream integral. The Kondo crossover is represented as a passage through an approximately equidistant ladder of its Lee-Yang zeros in the complex plane, rather than as a singularity on the real axis. Summation over this ladder yields the Gamma function $\\Gamma(\\alpha + T_K/(2 \\pi T))$ as the universal crossover backbone, where the offset $\\alpha =1/2$ is fixed by the Friedel sum rule. The Euler-Maclaurin expansion connects the discrete zero structure to the Nozieres Fermi-liquid theory through Bernoulli numbers. A two-cutoff formula provides a compact, essentially one-parameter description of the full crossover in terms of a temperature-space Fano lineshape which is a thermal average of the energy-space Fano resonance observed in STM. Drift corrections are treated. The approach extends to $\\mathrm{SU}(N)$ Coqblin-Schrieffer, underscreened and Anderson impurity models, and Kondo lattices.", "url": "https://arxiv.org/abs/2610.13666", "type": "理论", "summary": "我们开发了一种基于有效配分函数的近藤问题分析方法，该函数概括了二年级学生的梦积分。近藤交叉被表示为通过复平面中的李-杨零点的近似等距阶梯的通道，而不是实轴上的奇点。对该阶梯求和产生 Gamma 函数 $\\Gamma(\\alpha + T_K/(2 \\pi T))$ 作为通用交叉主干，其中偏移量 $\\alpha =1/2$ 由 Friedel 求和规则固定。欧拉-麦克劳林展开式通过伯努利数将离散零结构与诺齐埃费米液体理论联系起来。两个截止公式根据温度空间 Fano 线形提供了完整交叉的紧凑的、本质上是单参数的描述，该线形是在 STM 中观察到的能量空间 Fano 共振的热平均值。进行漂移校正。该方法扩展到 $\\mathrm{SU}(N)$ Coqblin-Schrieffer、欠屏蔽模型和 Anderson 杂质模型以及 Kondo 晶格。", "authors": [{"name": "V. Yu. Irkhin"}], "featured_authors": [{"name": "V. Yu. Irkhin"}], "author_count": 1}, {"id": "2610.13729", "category": "cond-mat", "title": "Shear-driven arrest of dip-coating film entrainment", "abstract": "A plate withdrawn from a bath of partially wetting liquid entrains a film above a critical velocity. Here, we show that this critical threshold can be substantially increased by the presence of a laminar gas flow opposed to the plate velocity that exerts a tangential shear stress on the liquid-gas interface. Using two-phase immiscible Navier-Stokes simulations and confining the gas to a narrow channel, we derive a closed-form expression for the interfacial stress, which combined with lubrication theory relates the thickness of the film and the contact line velocity to the applied shear stress. As the gas velocity is increased, the film thins and the contact line velocity slows down, until the imposed shear overcomes the drag of the moving plate and entrainment is arrested. As in the quiescent case, the velocity mismatch between plate and contact line is independent of the plate velocity and is set by the applied shear alone. We find that one set of varying gas flow simulations, with constant critical plate velocity, therefore determines the critical gas flow for every smaller plate velocity.", "url": "https://arxiv.org/abs/2610.13729", "type": "理论+数值", "summary": "从部分润湿液体浴中取出的板在高于临界速度时夹带薄膜。在这里，我们表明，与在液-气界面上施加切向剪切应力的板速度相反的层流气流的存在可以大大增加这个临界阈值。使用两相不混溶的纳维-斯托克斯模拟并将气体限制在狭窄的通道中，我们得出了界面应力的封闭式表达式，该表达式与润滑理论相结合，将薄膜的厚度和接触线速度与所施加的剪切应力联系起来。随着气体速度增加，薄膜变薄并且接触线速度减慢，直到施加的剪切力克服移动板的阻力并且夹带被阻止。与静止情况一样，板与接触线之间的速度失配与板速度无关，并且仅由所施加的剪切力决定。我们发现，一组变化的气流模拟具有恒定的临界板速度，因此可以确定每个较小板速度的临界气流。", "authors": [{"name": "Theo Witkamp"}, {"name": "Stéphane Zaleski"}, {"name": "Federico Toschi"}], "featured_authors": [{"name": "Theo Witkamp"}, {"name": "Stéphane Zaleski"}, {"name": "Federico Toschi"}], "author_count": 3}, {"id": "2610.13748", "category": "cond-mat", "title": "Arrested phase separation and amorphous patterns in charged binary fluids", "abstract": "Frustration generated by competing interactions can stabilise patterns with tunable lengthscales which evade indefinite coarsening and macroscopic phase separation. Here we investigate a charged binary fluid in which the tendency toward phase separation is opposed by screened electrostatic repulsion. Combining analytics and numerical simulations, we identify a regime of arrested phase separation characterised by finite-wavelength instability. The resulting states include droplet and labyrinthine phases in two dimensions, and droplets, concentric shells and tubular structures in three dimensions. Surprisingly, some of these structures are amorphous morphologies that emerge reproducibly from different initial conditions. Free-energy estimates suggest that these disordered structures may be thermodynamically stabilised by frustration, rather than being kinetically trapped. Our results identify a simple mechanism through which the competition between phase separation and screened electrostatics can generate equilibrium amorphous microphases with glassy features.", "url": "https://arxiv.org/abs/2610.13748", "type": "数值", "summary": "竞争相互作用产生的挫败感可以稳定具有可调长度尺度的图案，从而避免无限粗化和宏观相分离。在这里，我们研究了带电二元流体，其中相分离的趋势与屏蔽静电斥力相反。结合分析和数值模拟，我们确定了一种以有限波长不稳定性为特征的阻滞相分离机制。所得状态包括二维的液滴和迷宫相，以及三维的液滴、同心壳和管状结构。令人惊讶的是，其中一些结构是无定形形态，可以从不同的初始条件中重复出现。自由能估计表明，这些无序结构可能会因受挫而在热力学上稳定下来，而不是在动力学上被捕获。我们的结果确定了一种简单的机制，通过该机制，相分离和屏蔽静电之间的竞争可以产生具有玻璃态特征的平衡非晶微相。", "authors": [{"name": "Logan H. Grant"}, {"name": "Ana Bensabat"}, {"name": "Eva Pospivsilova"}, {"name": "Joost de Graaf"}, {"name": "Alexander Morozov"}, {"name": "Giuseppe Negro"}, {"name": "Ciprian G. Pruteanu"}, {"name": "Tyler N. Shendruk"}, {"name": "Davide Marenduzzo"}], "featured_authors": [{"name": "Logan H. Grant"}, {"name": "Ana Bensabat"}, {"name": "Eva Pospivsilova"}, {"name": "Ciprian G. Pruteanu"}, {"name": "Tyler N. Shendruk"}, {"name": "Davide Marenduzzo"}], "author_count": 9}, {"id": "2610.13782", "category": "cond-mat", "title": "Scalene Yang-Baxter triples realize all nearest-neighbour Hamiltonians with global additive symmetries", "abstract": "We establish that bond Hamiltonian densities, up to local difference terms whose sum vanishes under periodic boundary conditions, lying in the commutant of bond operators, $w_j\\pm w_{j+1}$, is a necessary and sufficient condition for a one-dimensional nearest-neighbour Hamiltonian to conserve a uniform or staggered sum of the one-site operators $w_j$. Starting from these local commutants, we show that every such Hamiltonian and its conserved charge can be obtained from monodromy matrices constructed using regular and non-regular members of scalene Yang-Baxter triples. The results hold on periodic chains of length $L\\geq3$, with even length required in the staggered case. The results do not require translation invariance, and hence the interaction on each bond can be chosen independently from the full corresponding commutant. Our representation-independent construction applies in arbitrary finite local dimension and exhausts the Hamiltonians with either prescribed additive symmetry, without requiring ordinary Yang-Baxter integrability. We illustrate the construction with spin-$\\tfrac12$ and spin-1 systems and discuss its relation to the double-commutant theorem. Classifying the one-site generators $w$ and their associated bond commutants provides a route to classifying such Hamiltonians with additive conserved charges.", "url": "https://arxiv.org/abs/2610.13782", "type": "理论", "summary": "我们建立了键哈密顿密度，直到局部差分项，其总和在周期性边界条件下消失，位于键算子的交换子 $w_j\\pm w_{j+1}$ 中，是一维最近邻哈密顿量保存单点算子 $w_j$ 的均匀或交错和的充分必要条件。从这些局部交换子开始，我们证明了每个这样的哈密顿量及其守恒电荷都可以从使用不等边斜角杨-巴克斯特三元组的规则和非常规成员构造的单向矩阵中获得。结果在长度为 $L\\geq3$ 的周期链上成立，在交错情况下需要偶数长度。结果不需要平移不变性，因此每个键上的相互作用可以独立于完全相应的交换子进行选择。我们的与表示无关的构造适用于任意有限局部维度，并用任一规定的加性对称性耗尽哈密顿量，而不需要普通的杨-巴克斯特可积性。我们用 spin-$\\tfrac12$ 和 spin-1 系统说明了构造，并讨论了它与双交换定理的关系。\n\n对单点生成元 $w$ 及其相关的键交换子进行分类，提供了一种对具有加性守恒电荷的哈密顿量进行分类的途径。", "authors": [{"name": "Pramod Padmanabhan"}, {"name": "Somnath Maity"}, {"name": "Akash Sinha"}, {"name": "Vladimir Korepin"}], "featured_authors": [{"name": "Pramod Padmanabhan"}, {"name": "Somnath Maity"}, {"name": "Akash Sinha"}, {"name": "Vladimir Korepin"}], "author_count": 4}, {"id": "2610.13795", "category": "cond-mat", "title": "Improved screening of doped ZrO$_2$ catalysts for CO$_2$ hydrogenation from graph-based machine learning", "abstract": "Dopants can tune the activity of zirconia-based CO$_2$ hydrogenation catalysts through changes in adsorbate and transition-state (TS) energetics. Computing these quantities with density functional theory (DFT) becomes expensive when several dopants, reaction intermediates, and TSs must be screened. Here, we further develop the graph-based machine learning method Wasserstein Weisfeiler-Lehman Gaussian Process Regression (WWL-GPR): we introduce additional electronic-structure and local-environment features relevant for oxide surfaces and use the resulting model to predict adsorption and TS energies on ZrO$_2$(101) surfaces doped with Al$^{3+}$, Cd$^{2+}$, Ga$^{3+}$, In$^{3+}$, and Zn$^{2+}$. Adsorbate-surface structures are represented as attributed graphs that combine bonds connectivity and features. We benchmark WWL-GPR against thermodynamic scaling relations (TSR) for reaction intermediates and Bronsted-Evans-Polanyi relations (BEP) for TSs, and then propagate the predicted energies to microkinetic CH$_3$OH-yield estimates. WWL-GPR consistently improves the prediction of reaction intermediate energetics relative to linear scaling approaches and provides TS estimates that are competitive with BEP-based models. These improvements become especially relevant when the predicted energetics are propagated through the reaction network. Microkinetic calculations show that WWL-GPR-derived energies give CH$_3$OH yields closer to DFT-derived yields than the linear-relation workflow. Degree-of-rate-control analysis links the activity errors to dopant-dependent rate-controlling steps, including HCOO* formation, H$_2$COOH* dissociation, and H$_3$CO* formation. These results support WWL-GPR as a data-efficient surrogate for connecting atomistic energetics with catalyst-screening observables on doped oxide surfaces.", "url": "https://arxiv.org/abs/2610.13795", "type": "理论+数值", "summary": "掺杂剂可以通过吸附质和过渡态 (TS) 能量的变化来调节氧化锆基 CO$_2$ 加氢催化剂的活性。当必须筛选多种掺杂剂、反应中间体和 TS 时，使用密度泛函理论 (DFT) 计算这些量变得昂贵。在这里，我们进一步开发了基于图的机器学习方法 Wasserstein Weisfeiler-Lehman 高斯过程回归 (WWL-GPR)：我们引入了与氧化物表面相关的附加电子结构和局域环境特征，并使用所得模型来预测掺杂 Al$^{3+}$、Cd$^{2+}$、Ga$^{3+}$ 的 ZrO$_2$(101) 表面上的吸附和 TS 能量，在$^{3+}$和Zn$^{2+}$中。吸附物表面结构表示为结合了键连接性和特征的属性图。我们将 WWL-GPR 与反应中间体的热力学标度关系 (TSR) 和 TS 的布朗斯台德-埃文斯-波兰尼关系 (BEP) 进行基准比较，然后将预测的能量传播到微动力学 CH$_3$OH 产率估计。\n\n相对于线性标度方法，WWL-GPR 持续改进了反应中间体能量学的预测，并提供了与基于 BEP 的模型相媲美的 TS 估计。当预测的能量通过反应网络传播时，这些改进变得尤其重要。微动力学计算表明，与线性关系工作流程相比，WWL-GPR 衍生的能量使 CH$_3$OH 产率更接近 DFT 衍生的产率。速率控制程度分析将活动误差与掺杂剂相关的速率控制步骤联系起来，包括 HCOO* 形成、H$_2$COOH* 解离和 H$_3$CO* 形成。这些结果支持 WWL-GPR 作为一种数据高效的替代品，用于将原子能量学与掺杂氧化物表面上的催化剂筛选可观测值联系起来。", "authors": [{"name": "Karsten Walz Jensen"}, {"name": "Mie Andersen"}, {"name": "Raffaele Cheula"}], "featured_authors": [{"name": "Karsten Walz Jensen"}, {"name": "Mie Andersen"}, {"name": "Raffaele Cheula"}], "author_count": 3}, {"id": "2610.13842", "category": "cond-mat", "title": "Robust Golden Ratio universality as a consequence of a circulant symmetry", "abstract": "We find a robust scenario for the emergence of the Golden Ratio (GR) dynamical universality class, characterized by the dynamical exponent $z \\equiv \\varphi=\\frac{1}{2}(1+\\sqrt{5})$. Previously, its emergence required fine-tuning of system parameters. Here, the GR universality class appears generically in a wide class of Markov processes as a consequence of a global, circulant symmetry of the flux Jacobian. This symmetry leads to GR universality in systems where the total number of conservation laws is odd and larger than three. We introduce a multilane exclusion process with Bernoulli stationary measure as a minimal, parameter-free model, which features GR universality for all conserved modes, most of which are doubly degenerate. Our predictions, based on mode-coupling theory generalized to treat degenerate conserved modes, are corroborated by large-scale Monte Carlo simulations.", "url": "https://arxiv.org/abs/2610.13842", "type": "理论+数值", "summary": "我们发现了黄金比例（GR）动态普遍性类出现的一个强有力的场景，其特征是动态指数 $z \\equiv \\varphi=\\frac{1}{2}(1+\\sqrt{5})$。此前，它的出现需要对系统参数进行微调。在这里，GR 普遍性类一般出现在一大类马尔可夫过程中，这是通量雅可比行列式的全局循环对称性的结果。这种对称性导致守恒定律总数为奇数且大于 3 的系统中的广义相对论普遍性。我们引入了一种多车道排除过程，将伯努利平稳测度作为最小无参数模型，其特点是对所有保守模式（其中大多数是双重简并模式）具有 GR 普适性。我们的预测基于广义用于处理简并守恒模式的模式耦合理论，并得到大规模蒙特卡罗模拟的证实。", "authors": [{"name": "Luka Paljk"}, {"name": "Johannes Schmidt"}, {"name": "Vladislav Popkov"}], "featured_authors": [{"name": "Luka Paljk"}, {"name": "Johannes Schmidt"}, {"name": "Vladislav Popkov"}], "author_count": 3}, {"id": "2610.13874", "category": "cond-mat", "title": "Potential energy release rate for solids with bounded domains during evolutions involving changes to boundaries and boundary data", "abstract": "We investigate the rate of change of equilibrium potential energy for nonlinear elastic solids undergoing evolutions that may involve changes in body geometry, material properties, applied tractions, and prescribed displacements. We represent such an evolution by a one-parameter family of variational problems and identify a class of these families for which the potential-energy release rate is well defined. Particular attention is given to the formulation of the potential energy at each evolution state: each constituent variational problem must yield the appropriate equilibrium state, while its equilibrium value must also correctly represent the physical change in potential energy between states. Within this framework, we derive a closed-form expression for the potential-energy release rate for solids with bounded domains, allowing for spatially nonuniform material evolution, sharp material interfaces, and evolving boundary geometry and prescribed boundary data. The expression is determined entirely by the equilibrium solution at the state under consideration and by the quantities prescribing the local evolution, so neighboring equilibrium problems need not be solved. Finally, we apply the result to the extension of a notch in a two-dimensional elastic body and show that the resulting potential-energy release rate reduces to the classical $J$-integral.", "url": "https://arxiv.org/abs/2610.13874", "type": "理论+数值", "summary": "我们研究非线性弹性固体在演化过程中平衡势能的变化率，这些演化可能涉及物体几何形状、材料特性、施加的牵引力和规定位移的变化。我们用单参数变分问题族来表示这种演化，并确定了这些族中的一类，其势能释放率被明确定义。特别注意每个演化状态下势能的公式：每个组成变分问题必须产生适当的平衡状态，而其平衡值也必须正确表示状态之间势能的物理变化。在此框架内，我们推导出具有有界域的固体势能释放率的封闭式表达式，允许空间上不均匀的材料演化、尖锐的材料界面以及不断演化的边界几何形状和规定的边界数据。该表达式完全由所考虑状态的平衡解和规定局部演化的量决定，因此不需要求解邻近的平衡问题。\n\n最后，我们将结果应用于二维弹性体中凹口的延伸，并表明由此产生的势能释放率降低到经典的 $J$ 积分。", "authors": [{"
