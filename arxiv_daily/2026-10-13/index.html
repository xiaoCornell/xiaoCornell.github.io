roximate unitary 2-designs.", "url": "https://arxiv.org/abs/2610.12646", "type": "数值", "summary": "我们研究了可编程线性光学干涉仪上多光子福克空间中单一 $t$ 设计的构造。使用框架势作为优化目标，我们确定了实现近似单一 1 和 2 设计的架构，其可控参数比通用线性光学所需的要少得多。例如，我们发现数字证据表明，对于单一 1-设计，所需的可编程参数数量根据经验缩放为 $2d$，模式数量为 $d$，而不是 $O(d^2)$。我们使用单光子跃迁概率和平均通道保真度对所得集合进行基准测试。此外，作为一个实际结果，我们开发了一种用于多光子 Fock 态的光子数估计协议，该协议利用了这些优化的 1 和 2 设计。我们的研究结果表明，浅干涉仪可以准确地再现哈尔平均一阶矩，而二阶矩敏感可观测量为近似酉 2 设计提供了相当严格的测试。", "authors": [{"name": "Robert A. Grinshtein"}, {"name": "Ivan V. Dyakonov"}, {"name": "Stanislav S. Straupe"}], "featured_authors": [{"name": "Robert A. Grinshtein"}, {"name": "Ivan V. Dyakonov"}, {"name": "Stanislav S. Straupe"}], "author_count": 3}, {"id": "2610.12664", "category": "quant-ph", "title": "A Catalytic Algorithm for Transposing Unknown Qutrit Unitaries with Tight Query Bounds", "abstract": "We construct exact deterministic circuits for transposing and inverting an unknown qutrit unitary $U\\in\\mathrm{SU}(3)$ using only forward queries. Three queries prepare a catalyst independently of the input state. Four further queries implement transposition while returning the catalyst unchanged and uncorrelated with the output. Two uses within an antisymmetric encoding implement inversion with eight processing queries and return the same catalyst. Reusing the catalyst implements $m$ transpositions or inversions with $3+4m$ or $3+8m$ total queries, respectively. More generally, we prove that exact transposition and inversion of an unknown $U\\in\\mathrm{SU}(d)$, $d\\ge2$, require at least $d+1$ and $d^2-1$ processing queries, respectively, in fixed causal order. These processing bounds hold for any program state prepared independently of the input state using finitely many forward queries, even if that state is consumed during processing. Both our catalytic qutrit algorithms attain their respective bounds. Moreover, exact qutrit transposition with four processing queries requires at least three preparation queries, and our construction attains this bound.", "url": "https://arxiv.org/abs/2610.12664", "type": "理论+数值", "summary": "我们仅使用前向查询构建精确的确定性电路，用于转置和反转未知的 qutrit 酉 $U\\in\\mathrm{SU}(3)$。三个查询独立于输入状态准备催化剂。另外四个查询实现转置，同时返回催化剂不变且与输出不相关。反对称编码中的两种用途通过八个处理查询实现反转并返回相同的催化剂。重用催化剂可实现 $m$ 转置或反转，总查询量分别为 $3+4m$ 或 $3+8m$。更一般地说，我们证明未知 $U\\in\\mathrm{SU}(d)$、$d\\ge2$ 的精确转置和反转，分别需要至少 $d+1$ 和 $d^2-1$ 以固定因果顺序处理查询。这些处理界限适用于使用有限多个前向查询独立于输入状态准备的任何程序状态，即使该状态在处理期间被消耗。我们的两种催化 qutrit 算法都达到了各自的界限。此外，具有四个处理查询的精确 qutrit 转置需要至少三个准备查询，并且我们的构造达到了这个界限。", "authors": [{"name": "Yu-Ao Chen"}], "featured_authors": [{"name": "Yu-Ao Chen"}], "author_count": 1}, {"id": "2610.12782", "category": "quant-ph", "title": "Coset Lifted Product Codes: Constructing Quantum LDPC Codes from Non-Normal Subgroup Actions", "abstract": "We introduce coset lifted product (CLP) codes, a family of quantum LDPC codes that combine the protograph structure of lifted product codes with the coset action of Aydin, Tamo, and Barg \\cite{AydinTamoBarg2026}. Given a finite group $G$, a subgroup $H \\le G$ that need not be normal, a protograph $A$ over $\\mathbb F_2[G]$, and a protograph $B$ over $\\mathbb F_2[N_G(H)]$, the two protographs act on the cosets $G/H$ from the left and from the right to produce quantum CSS codes. Further, for groups of odd order, we give an explicit formula for the dimension as a sum over the irreducible representations $\\rho$ of $G$ of hypergraph product dimensions. A search over $14,843$ pairs $(G,H)$ with $H$ restricted to be non-normal and $120 \\le n \\le 400$ yields certified codes that exceed the best published value of $Q=kd^2/n$ at check weights $6,7$ and $9$, i.e., we obtain $[[360,20,20]]$ at $w=6$, a $[[360,24,20]]$ code at $w=7$, and codes $[[252,16,18]]$ and $[[288,16,20]]$ at $w=9$. Our search also produce high-distance codes with parameters $[[168,10,14]], [[240,8,20]]$ at $w=6$ and $[[216,8,18]]$ at $w=7$.", "url": "https://arxiv.org/abs/2610.12782", "type": "理论", "summary": "我们引入了陪集提升积（CLP）码，这是​​一系列量子 LDPC 码，它将提升积码的原形结构与 Aydin、Tamo 和 Barg 的陪集作用相结合\\cite{AydinTamoBarg2026}。给定一个有限群 $G$、一个不需要正规的子群 $H \\le G$、$\\mathbb F_2[G]$ 上的原图 $A$ 和 $\\mathbb F_2[N_G(H)]$ 上的原图 $B$，这两个原图从左到右作用于陪集 $G/H$ 来产生量子 CSS 代码。此外，对于奇数阶的群，我们给出了一个显式的维度公式，作为超图乘积维度 $G$ 的不可约表示 $\\rho$ 的总和。超过 $14,843$ 的搜索对 $(G,H)$ 进行，其中 $H$ 限制为非正态，$120 \\le n \\le 400$ 产生的认证代码超出了在检查权重 $6,7$ 和 $9$ 处 $Q=kd^2/n$ 的最佳发布值，即，我们在 $w=6$ 处获得 $[[360,20,20]]$，a $[[360,24,20]]$在$w=7$处编码，$[[252,16,18]]$和$[[288,16,20]]$在$w=9$处编码。我们的搜索还产生参数为$[[168,10,14]]、[[240,8,20]]$（位于$w=6$）和$[[216,8,18]]$（位于$w=7$）​​的高距离代码。", "authors": [{"name": "Rajendra Prasad Rajpurohit"}, {"name": "V. Lalitha"}, {"name": "Shayan Srinivasa Garani"}], "featured_authors": [{"name": "Rajendra Prasad Rajpurohit"}, {"name": "V. Lalitha"}, {"name": "Shayan Srinivasa Garani"}], "author_count": 3}, {"id": "2610.12844", "category": "quant-ph", "title": "Improved classical optimization of fermionic Hamiltonians beyond Gaussian states", "abstract": "We give a polynomial-time randomized classical algorithm that approximates the largest eigenvalue $\\lambda_{\\max}$ of a traceless quartic fermionic Hamiltonian $H$ on $n$ modes. The algorithm achieves energy at least $\\lambda_{\\max}/O(\\sqrt n)$ and outputs either a fermionic Gaussian state or a polynomially sparse state in the Fock basis. This is achieved through a new upper bound on $\\lambda_{\\max}$ in terms of the maximum energy of a Gaussian state and $\\sqrt{2^{-n}\\operatorname{Tr}(H^2)}$.", "url": "https://arxiv.org/abs/2610.12844", "type": "理论+数值", "summary": "我们给出了一种多项式时间随机经典算法，该算法可逼近 $n$ 模式上无痕四次费米子哈密顿量 $H$ 的最大特征值 $\\lambda_{\\max}$。该算法获得至少 $\\lambda_{\\max}/O(\\sqrt n)$ 的能量，并在 Fock 基上输出费米子高斯状态或多项式稀疏状态。这是通过 $\\lambda_{\\max}$ 上高斯态最大能量和 $\\sqrt{2^{-n}\\operatorname{Tr}(H^2)}$ 的新上限来实现的。", "authors": [{"name": "Ojas Parekh"}], "featured_authors": [{"name": "Ojas Parekh"}], "author_count": 1}, {"id": "2610.12908", "category": "quant-ph", "title": "Classification of bipartite observables II: NIP observables and the Todorcevic trichotomy", "abstract": "A bipartite observable is stable when its idealized responses are continuous. We show that it is NIP exactly when they are of the first Baire class. They then form a Rosenthal compactum, and the dividing lines of Shelah in model theory, together with the classification of Rosenthal compacta of Todorčević, acquire a physical meaning. For observables, mixtures of states make every hereditarily separable compactum of idealized responses metrizable, and the Todorčević trichotomy becomes a classification into three classes. Each class contains a physical order: the comparison of photon numbers, the comparison of positions, and the causal order of spacetime, whose idealized responses are not first countable because a light cone can shrink to a point; the comparison of two phases on a circle joins it there. Each of the seven minimal families of the heptachotomy, which Argyros, Dodos and Kanellopoulos extracted from the methods of Todorčević, is realized by a tree of preparations of photons, of a particle in a box, or of a spin chain read by a probe; the spin chain also shows that NIP, unlike its uniform version, is not symmetric between the two parties. Finally, for the Ising model in a transverse field we show that, in the ordered phase, the responses of the two pure phases form split pairs whose midpoints, the responses of the symmetric state, form an uncountable discrete set; the proof uses a Lee--Yang theorem for this model.", "url": "https://arxiv.org/abs/2610.12908", "type": "理论", "summary": "当二分可观测量的理想化响应连续时，它是稳定的。我们证明，当他们属于第一级贝尔时，它就是 NIP。然后它们形成了罗森塔尔密体，模型理论中Shelah的分界线与托多尔切维奇的罗森塔尔密体分类一起获得了物理意义。对于可观察量，状态的混合使得理想化反应的每一个遗传性可分离的紧凑体都可度量，并且托多尔切维奇三分法成为三类的分类。每个类都包含一个物理顺序：光子数的比较、位置的比较以及时空的因果顺序，其理想化响应首先不是可数的，因为光锥可以缩小到一个点；圆上两个相位的比较将其连接在那里。 Argyros、Dodos 和 Kanellopoulos 从 Todorčević 的方法中提取的七分法的七个最小家族中的每一个都是通过光子准备树、盒子中的粒子或由探针读取的自旋链来实现的；自旋链还表明，NIP 与其统一版本不同，在双方之间不对称。\n\n最后，对于横向场中的伊辛模型，我们表明，在有序相中，两个纯相的响应形成分裂对，其中点（对称态的响应）形成不可数的离散集；该模型的证明使用 Lee-Yang 定理。", "authors": [{"name": "Eduardo Dueñez"}, {"name": "José Iovino"}], "featured_authors": [{"name": "Eduardo Dueñez"}, {"name": "José Iovino"}], "author_count": 2}, {"id": "2610.12929", "category": "quant-ph", "title": "An Instability of the Quantum Markov Length", "abstract": "The Markov length, the length scale governing the exponential decay of conditional mutual information (CMI) in a quantum many-body state, has proven useful for characterizing mixed-state phases of matter. Nevertheless, we show that a state's Markov length is not generally stable under weak local channels. The failure of stability occurs already at a pure product state. We demonstrate this explicitly in a one-dimensional fermionic chain, where a fine-tuned depth-two circuit of nearest-neighbor Gaussian channels maps the vacuum to a state whose CMI decays \\emph{algebraically} and whose Markov length is therefore infinite, even when the channels are taken arbitrarily close to the identity. The algebraic decay is rooted in the nonanalyticity of the von Neumann entropy at rank-deficient density operators. We exhibit an analogous instability on an ordinary qubit chain. More generally, we show that the Markov length is unstable in any translation-invariant state with even a single rank-deficient reduced density operator. These results pose a challenge to recent definitions of mixed-state phase equivalence based on the Markov length.", "url": "https://arxiv.org/abs/2610.12929", "type": "理论", "summary": "马尔可夫长度是控制量子多体态条件互信息 (CMI) 指数衰减的长度尺度，已被证明对于表征物质的混合态相非常有用。然而，我们表明，在弱局部渠道下，状态的马尔可夫长度通常不稳定。在纯产品状态下已经出现稳定性失效。我们在一维费米子链中明确地证明了这一点，其中最近邻高斯通道的微调深度二回路将真空映射到 CMI 衰减 \\emph{代数} 的状态，因此其马尔可夫长度是无限的，即使通道被任意接近于恒等式。代数衰减的根源在于冯诺依曼熵在秩亏密度算子上的非解析性。我们在普通的量子比特链上表现出类似的不稳定性。更一般地，我们表明马尔可夫长度在任何平移不变状态下都是不稳定的，即使是单个秩不足的降低密度算子。这些结果对最近基于马尔可夫长度的混合状态相位等价的定义提出了挑战。", "authors": [{"name": "David C. Newsom"}, {"name": "Michael Levin"}], "featured_authors": [{"name": "David C. Newsom"}, {"name": "Michael Levin"}], "author_count": 2}, {"id": "2610.12949", "category": "quant-ph", "title": "Quantum-assisted rendezvous on hypercubes: a quantum Bernoulli noise approach", "abstract": "We study quantum-assisted balanced rendezvous on the $d$-dimensional hypercube in a one-step two-agent quantum-walk framework, where the two agents move the same Hamming distance and meet at a common midpoint. The key structure is a projective $t$-sphere resolution, which governs exact finite-dimensional quantum attainment. Its scalar analogue recovers the corresponding classical characterization. We characterize finite-dimensional quantum attainment of the no-signalling benchmark, construct quantum strategies from projective sphere resolutions, and establish a rigidity theorem for optimal finite-dimensional strategies. A marked difference appears between nearest-neighbor and higher-cardinality updates: quantum advantage can occur in the former, whereas in the latter the geometry of the relevant Hamming spheres rules out exact finite-dimensional attainment of the no-signalling value. Together, these results connect quantum-walk dynamics, Hamming-sphere geometry, and quantum rendezvous within the quantum Bernoulli noises (QBN) framework.", "url": "https://arxiv.org/abs/2610.12949", "type": "理论", "summary": "我们在一步二智能体量子行走框架中研究 $d$ 维超立方体上的量子辅助平衡交会，其中两个智能体移动相同的汉明距离并在公共中点相遇。关键结构是投影$t$球体分辨率，它控制着精确的有限维量子实现。它的标量类似物恢复了相应的经典特征。我们描述了无信号基准的有限维量子实现，从射影球分辨率构建量子策略，并建立了最优有限维策略的刚性定理。最近邻更新和更高基数更新之间存在显着差异：前者可能出现量子优势，而后者相关汉明球的几何形状排除了无信号值的精确有限维实现。这些结果将量子行走动力学、汉明球几何和量子伯努利噪声 (QBN) 框架内的量子交会联系起来。", "authors": [{"name": "Ce Wang"}], "featured_authors": [{"name": "Ce Wang"}], "author_count": 1}, {"id": "2610.13033", "category": "quant-ph", "title": "When irrelevance governs: dissipation-regression scaling in open quantum criticality", "abstract": "The real-time dynamics of quantum phase transitions in open systems coupled to finite-temperature environments sits at the heart of contemporary condensed-matter and quantum-information science. Here, invoking a Schwinger-Keldysh formalism, we uncover that, within the coherence-dominated regime of critical real-time evolution, a dissipative coupling deemed naively irrelevant determines, counterintuitively, the longest timescale that holds sway. Possessing a well-defined temporal scaling dimension, it engenders a novel dissipation-regression scaling that systematically reproduces the unusual Kibble-Zurek scaling and relaxation observed in recent numerical studies. By contrast, dissipation-dominated dynamics behaves qualitatively differently. There, furthermore, we show that the discretized and diagonalized formulations of the same open quantum Ising chain realize distinct universality classes.", "url": "https://arxiv.org/abs/2610.13033", "type": "理论+数值", "summary": "与有限温度环境耦合的开放系统中量子相变的实时动力学是当代凝聚态物质和量子信息科学的核心。在这里，我们援引施温格-凯尔迪什形式主义，发现在关键实时演化的相干性主导的体制内，一种被认为天真的不相关的耗散耦合决定了，违反直觉的是，占据主导地位的最长时间尺度。它具有明确定义的时间尺度维度，产生了一种新颖的耗散回归尺度，系统地再现了最近数值研究中观察到的不寻常的 Kibble-Zurek 尺度和松弛。相比之下，耗散主导的动力学行为在性质上有所不同。此外，我们还表明，同一开放量子伊辛链的离散化和对角化公式实现了不同的普遍性类别。", "authors": [{"name": "Fan Zhong"}], "featured_authors": [{"name": "Fan Zhong"}], "author_count": 1}, {"id": "2610.13038", "category": "quant-ph", "title": "Error Mitigation by Zero-Noise Extrapolation (ZNE) in Indirect-Control System", "abstract": "The indirect-control paradigm offers a scalable approach to quantum computation by restricting external operations to a small subset of qubits, whereas the entire system evolves under its intrinsic many-body Hamiltonian. This framework reduces hardware complexity and limits the noise introduced through control channels. Recently, Anan et al. proposed an implementation of the variational quantum eigensolver (VQE) within this indirect-control architecture. However, the impact and integration of quantum error mitigation techniques in such a setting remain largely unexplored. In particular, zero-noise extrapolation (ZNE), a widely used error mitigation strategy, has not yet been systematically adapted to indirect-control VQE. A key requirement of ZNE is the controlled amplification of noise, which is commonly achieved through circuit-level techniques such as unitary folding. In the indirect-control framework, however, quantum operations are largely governed by continuous time-evolution under the system Hamiltonian, making the construction of physically realizable inverse operations non-trivial. In this study, we investigate the feasibility of implementing ZNE within the this http URL address the challenges associated with unitary folding in the presence of time-evolution operators and, with a minimal relaxation of the indirect-control constraint, we propose a ZNE-based error-mitigation strategy that exploits the symmetry of the one-dimensional XY spin chain.", "url": "https://arxiv.org/abs/2610.13038", "type": "理论+数值", "summary": "间接控制范式通过将外部操作限制在一小部分量子位上，提供了一种可扩展的量子计算方法，而整个系统则在其固有的多体哈密顿量下演化。该框架降低了硬件复杂性并限制了通过控制通道引入的噪声。最近，阿南等人。提出了在这种间接控制架构中变分量子本征求解器（VQE）的实现。然而，量子误差缓解技术在这种情况下的影响和集成在很大程度上仍未得到探索。特别是，零噪声外推（ZNE）这种广泛使用的误差缓解策略尚未系统地适应间接控制 VQE。 ZNE 的一个关键要求是噪声的受控放大，这通常通过单一折叠等电路级技术来实现。然而，在间接控制框架中，量子运算很大程度上受哈密顿系统下的连续时间演化控制，使得物理上可实现的逆运算的构造变得非常重要。\n\n在本研究中，我们研究了在该 http URL 中实现 ZNE 的可行性，解决了在存在时间演化算子的​​情况下与酉折叠相关的挑战，并且在最小程度地放松间接控制约束的情况下，我们提出了一种基于 ZNE 的错误缓解策略，该策略利用一维 XY 自旋链的对称性。", "authors": [{"name": "Arijit Das"}, {"name": "Masaki Owari"}], "featured_authors": [{"name": "Arijit Das"}, {"name": "Masaki Owari"}], "author_count": 2}, {"id": "2610.13135", "category": "quant-ph", "title": "Pulsed control of an entanglement-breaking index: thermal valleys, a certified valve, and its open-close asymmetry", "abstract": "The entanglement-breaking index of a channel is the number of self-compositions after which all entanglement with a reference system is destroyed. In a thermal qubit collision loop whose round is affine in the bath polarisation p, some circuits have thermal valleys: on an interior window of p the index falls below its infinite-temperature value. Rounds at different p compose exactly, so every schedule of polarisations defines a composite channel whose entanglement-breaking status can be certified in ball arithmetic. A gated search of 33 million random circuits finds no valley with contrast above about 3e-3, with an interior maximum near index 90, and yields six certified targets. At the reference target, held inside its window for 88 rounds, a centred excursion to p = 0.05 restores entanglement at exactly eight rounds: every shorter centred pulse certifiably fails, and so do the same eight rounds at the start. A 53-round pulse certifiably beats the static protocol, a depth-three valley is walked down its staircase by pulse duration, and a 1.2 per cent coherent tilt of the ancilla opens the switch at fixed population. Closing the switch costs 21 to 35 rounds. The asymmetry is not one of local rates, which agree to within about two per cent at matched circuit positions (certified). It is one of distance and response: closing must remove an entanglement margin 2.2 times larger, and while hot rounds added to a window hold act almost independently, window rounds added to a hot hold act collectively. Near the crossing, the lever of the log-margin is that of a linear approach to the entanglement-breaking boundary, with no free parameter. At the reference target, depolarising noise of about $4\\nu/n$ per round kills a signature of size $\\nu$ read after $n$ rounds: 1.3e-4 for the static signal, 6.5e-6 for the eight-round switch.", "url": "https://arxiv.org/abs/2610.13135", "type": "理论", "summary": "通道的纠缠破坏指数是与参考系统的所有纠缠被破坏后的自组合数。在热量子位碰撞环路中，其圆在浴极化 p 中仿射，一些电路具有热谷：在 p 的内部窗口上，指数低于其无限温度值。不同 p 的回合完全组成，因此每个极化时间表定义了一个复合通道，其纠缠破坏状态可以在球算术中得到证明。对 3300 万个随机电路的门控搜索没有发现对比度高于约 3e-3 的谷值，内部最大值接近指数 90，并产生了 6 个经认证的目标。在参考目标处，在其窗口内保持 88 轮，中心偏移到 p = 0.05 恰好在八轮时恢复纠缠：每个较短的中心脉冲都可以证明失败，并且在开始时相同的八轮也是如此。 53 轮脉冲确实击败了静态协议，深度三谷按脉冲持续时间走下楼梯，并且辅助的 1.2% 相干倾斜在固定人口处打开开关。关闭开关需要 21 到 35 轮。\n\n这种不对称性并非本地费率之一，本地费率在匹配电路位置上的误差约为百分之二（已认证）。它是距离和响应之一：关闭必须消除 2.2 倍大的纠缠余量，虽然添加到窗口保持的热弹几乎独立起作用，但添加到热保持的窗口弹集体起作用。在交叉点附近，对数边际的杠杆是接近纠缠破坏边界的线性方法，没有自由参数。在参考目标处，每轮约 $4\\nu/n$ 的去极化噪声会杀死 $n$ 轮后读取的大小为 $\\nu$ 的签名：静态信号为 1.3e-4，八轮开关为 6.5e-6。", "authors": [{"name": "Eran Kopel"}], "featured_authors": [{"name": "Eran Kopel"}], "author_count": 1}, {"id": "2610.13211", "category": "quant-ph", "title": "Verifiable Sampling for Delegated Generative Quantum Machine Learning", "abstract": "Generative machine learning has shown remarkable results across a wide range of interdisciplinary tasks, motivating significant efforts toward Quantum Generative Models as a path to beyond-classical performance, given their capability of generating classically intractable distributions. However, comparatively little attention has been paid to securely delegating such computations to a powerful remote quantum server. In this work, we propose a blind and verifiable protocol for sampling that can be used for the inference phase of such quantum models. Such a protocol inherits blindness from Universal Blind Quantum Computing and achieves verifiability by exploiting known approaches based on trapification schemes. Alongside, to delegate the training phase, we discuss an extension of the previously proposed verifiable end-to-end Delegated Variational Quantum Algorithms (Inajetovic et al., Phys. Rev. Research, 2026). Beyond the usual Accept/Abort outcome characterizing verification protocols, the sampling protocol for inference also provides, even against a malicious server, an estimation of the amount of corrupted generated samples, i.e., a fine-grained feature describing the quality of the outcome connecting verification protocols and application-level benchmarking.", "url": "https://arxiv.org/abs/2610.13211", "type": "理论+数值", "summary": "生成式机器学习在广泛的跨学科任务中表现出了显着的成果，鉴于量子生成模型能够生成经典的难以处理的分布，因此激发了人们对量子生成模型的巨大努力，将其作为超越经典性能的途径。然而，相对较少的关注是将此类计算安全地委托给强大的远程量子服务器。在这项工作中，我们提出了一种盲目且可验证的采样协议，可用于此类量子模型的推理阶段。这样的协议继承了通用盲量子计算的盲目性，并通过利用基于陷阱方案的已知方法来实现可验证性。除此之外，为了委托训练阶段，我们讨论了先前提出的可验证端到端委托变分量子算法的扩展（Inajetovic 等人，Phys. Rev. Research，2026）。\n\n除了通常的接受/中止结果表征验证协议之外，即使针对恶意服务器，用于推理的采样协议也提供了对损坏的生成样本数量的估计，即描述连接验证协议和应用程序级基准测试的结果质量的细粒度特征。", "authors": [{"name": "Matteo Inajetovic"}, {"name": "Anna Pappa"}, {"name": "Petros Wallden"}], "featured_authors": [{"name": "Matteo Inajetovic"}, {"name": "Anna Pappa"}, {"name": "Petros Wallden"}], "author_count": 3}, {"id": "2610.13228", "category": "quant-ph", "title": "Block encoding of semiseparable matrices via their generators", "abstract": "We present an explicit quantum circuit that constructs a block encoding of a generator-representable semiseparable (one-pair) matrix directly from its two generators. For an $N\\times N$ semiseparable matrix with $N=2^{n}$, the circuit uses $2n+2$ ancilla qubits and has $O({\\rm polylog} N)$ depth, and it realizes a $(2\\sqrt{N},\\,2n+2,\\,2 \\sqrt{2}\\ \\varepsilon)$-block encoding, where $\\varepsilon$ is controlled by the accuracy of the state-preparation routines that load the generators. The building blocks of the circuit are cyclic shifts, swaps, and Hadamard gates, each admitting an efficient implementation through the binary decomposition of the relevant indices.", "url": "https://arxiv.org/abs/2610.13228", "type": "理论", "summary": "我们提出了一种显式量子电路，直接从其两个生成器构造生成器可表示的半可分离（一对）矩阵的块编码。对于 $N=2^{n}$ 的 $N\\times N$ 半可分离矩阵，电路使用 $2n+2$ 辅助量子位并具有 $O({\\rm polylog} N)$ 深度，并实现 $(2\\sqrt{N},\\,2n+2,\\,2 \\sqrt{2}\\ \\varepsilon)$ 块编码，其中 $\\varepsilon$ 由加载发电机的状态准备例程。该电路的构建块是循环移位、交换和哈达玛门，每个门都通过相关索引的二进制分解来实现有效的实现。", "authors": [{"name": "Giacomo Antonioli"}, {"name": "Gianna M. Del Corso"}, {"name": "Roel Van Beeumen"}], "featured_authors": [{"name": "Giacomo Antonioli"}, {"name": "Gianna M. Del Corso"}, {"name": "Roel Van Beeumen"}], "author_count": 3}, {"id": "2610.13233", "category": "quant-ph", "title": "Percolation of Data Constraints and Reorganization of Boolean Function States in Parity Learning", "abstract": "We study how a neural network reorganizes its learned function as training proceeds and as previously unseen parity data accumulate. The trained model is itself a Boolean function on binary strings of finite length. We then evaluate it on all data, inside and outside the training set, and read off its complete sign table. Its $\\pm1$ entries are the amplitudes of a normalized state, dubbed the function-state, whose inverse subsystem purity $K_f=1/\\textrm{Tr}(\\rho_A^2)$ is an effective Schmidt rank. We find that small data additions broaden the Schmidt spectrum, whereas larger additions reconcentrate it in the target mode. The former is called differentiation because the model distinguishes inputs more sharply. The latter is called target-selective recoherence, where the model settles on the single rule shared by the added data. As the dataset grows, the connectivity of the constraint graph defined by the training set increases monotonically, whereas the learned inverse purity changes nonmonotonically. On a fixed connected dataset, as learning proceeds, the Schmidt spectrum begins to reorganize, followed by gains in target alignment and later by improvement in predictive accuracy. This ordering distinguishes three aspects of learning: constraint identifiability, function-state organization, and predictive accuracy. At fixed data size, a function that has already been learned can re-differentiate, an event we call retreat, without changing graph connectivity. Recovery reconcentrates the Schmidt spectrum in a similar target-selective pattern, without exact recurrence of the Boolean state. Thus the percolation of data constraints fixes the identifiable support, while the reduced state produced by training continues to reorganize even after that support stops changing.", "url": "https://arxiv.org/abs/2610.13233", "type": "理论+数值", "summary": "我们研究神经网络如何随着训练的进行和以前未见过的奇偶校验数据的积累而重新组织其学习功能。训练后的模型本身就是有限长度二进制字符串上的布尔函数。然后，我们对训练集内部和外部的所有数据进行评估，并读取其完整的符号表。它的 $\\pm1$ 条目是归一化状态的幅度，称为函数状态，其逆子系统纯度 $K_f=1/\\textrm{Tr}(\\rho_A^2)$ 是有效的施密特等级。我们发现，少量的数据添加会拓宽施密特谱，而大量的添加会使其重新集中在目标模式中。前者称为差异化，因为该模型更清晰地区分输入。后者称为目标选择性重新一致性，其中模型取决于添加的数据共享的单个规则。随着数据集的增长，训练集定义的约束图的连通性单调增加，而学习到的逆纯度则非单调变化。在固定的连接数据集上，随着学习的进行，施密特谱开始重新组织，随后目标对齐得到改善，随后预测准确性得到提高。\n\n这种顺序区分了学习的三个方面：约束可识别性、功能状态组织和预测准确性。在固定的数据大小下，已经学习的函数可以重新微分，我们称之为撤退的事件，而不改变图的连接性。恢复以类似的目标选择模式重新集中施密特谱，而不会精确重现布尔状态。因此，数据约束的渗透修复了可识别的支持，而即使在支持停止变化之后，训练产生的简化状态也会继续重组。", "authors": [{"name": "Han Ma"}], "featured_authors": [{"name": "Han Ma"}], "author_count": 1}, {"id": "2610.13250", "category": "quant-ph", "title": "Zak Phase Quantization without Global Symmetry through Destructive Interference", "abstract": "The Zak phase provides a fundamental geometric characterization of one-dimensional band structures and, when quantized by symmetry, serves as a bulk indicator of polarization and boundary phenomena. Conventionally, its exact quantization is tied to a global symmetry of the Bloch Hamiltonian, such as inversion or reflection symmetry. Here, we demonstrate a distinct mechanism by which the Zak phase remains exactly quantized even when the corresponding protecting symmetry is explicitly broken at the level of the full Hamiltonian. The mechanism is based on local support symmetry and destructive interference: symmetry-breaking degrees of freedom are coupled to a topological parent system in such a way that the relevant Bloch states cannot leak into them. The preserved states therefore retain their parent wave functions and inherit their quantized Zak phase exactly, despite the absence of the protecting global symmetry. We establish this mechanism for general one-dimensional insulators and demonstrate it in an inversion-broken minimal model and a reflection-broken armchair nanoribbon, where a quantized $\\pi$ Zak phase and associated boundary-localized states persist. We further show that perturbations violating the exact destructive-interference condition continuously dequantize the Zak phase, while a finite regime with a near-$\\pi$ Zak phase and boundary response can survive. Our results establish wave-function support, rather than global symmetry alone, as a mechanism for protecting quantized quantum geometry in one-dimensional systems.", "url": "https://arxiv.org/abs/2610.13250", "type": "理论", "summary": "Zak 相提供了一维能带结构的基本几何特征，并且当通过对称性量化时，可用作偏振和边界现象的体指示剂。传统上，其精确量化与布洛赫哈密顿量的全局对称性相关，例如反演或反射对称性。在这里，我们证明了一种独特的机制，即使相应的保护对称性在完整哈密顿量的水平上被明确破缺，Zak 相位也能保持精确的量子化。该机制基于局部支持对称性和破坏性干涉：对称破缺自由度以相关布洛赫态无法泄漏到其中的方式耦合到拓扑父系统。因此，尽管缺乏保护全局对称性，保留的态仍保留其父波函数并准确继承其量化的 Zak 相位。我们为一般一维绝缘体建立了这种机制，并在反演破坏最小模型和反射破坏扶手椅纳米带中进行了演示，其中量化的 $\\pi$ Zak 相和相关的边界局域态持续存在。\n\n我们进一步表明，违反精确破坏性干扰条件的扰动会不断使 Zak 相位反量化，而具有近 $\\pi$ Zak 相位和边界响应的有限状态可以生存。我们的结果建立了波函数支持，而不仅仅是全局对称性，作为保护一维系统中量子几何的机制。", "authors": [{"name": "Geonwoo Hwang"}, {"name": "Jun-Won Rhim"}], "featured_authors": [{"name": "Geonwoo Hwang"}, {"name": "Jun-Won Rhim"}], "author_count": 2}, {"id": "2610.13283", "category": "quant-ph", "title": "Circuit Design Problems in Binary Polynomial Quantum Optimization", "abstract": "Solving combinatorial optimization problems on near-term quantum computers mainly relies on their quadratic unconstrained binary formulation. Lately, binary polynomial formulations start to take the center stage, having a better scaling with respect to the number of used qubits. However, while quadratic forms are straightforward to implement on quantum circuits, polynomial forms of degree $d$ incur in circuit depth overheads, due to the lack of $d$-qubit gates, for $d\\geq 3$, on current hardware. In this paper, we study the problem of designing the shallowest quantum circuit for a given polynomial form. We formulate it as a classical binary linear problem and we prove the \\textsf{NP}-completeness of a variant of it. On the algorithmic side, we offer a scalable and performant heuristic method to tackle it, Tempura, as well as faster binary linear problem formulations, which offer computational feasibility while sacrificing optimality. Our performance evaluation shows that the algorithms yield far shorter circuits than the state-of-the-art approaches, and Tempura is mostly comparable with them in terms of runtime.", "url": "https://arxiv.org/abs/2610.13283", "type": "理论+数值", "summary": "解决近期量子计算机上的组合优化问题主要依赖于其二次无约束二进制公式。最近，二元多项式公式开始占据中心舞台，在使用的量子位数量方面具有更好的缩放比例。然而，虽然二次形式在量子电路上很容易实现，但由于当前硬件上缺乏 $d$ 量子位门（对于 $d\\geq 3$），$d$ 次的多项式形式会产生电路深度开销。在本文中，我们研究了为给定多项式形式设计最浅量子电路的问题。我们将其表述为经典的二元线性问题，并证明其变体的 \\textsf{NP} 完整性。在算法方面，我们提供了一种可扩展且高性能的启发式方法来解决它，Tempura，以及更快的二元线性问题公式，这些公式在牺牲最优性的同时提供了计算可行性。我们的性能评估表明，这些算法产生的电路比最先进的方法短得多，并且 Tempura 在运行时间方面基本上与它们相当。", "authors": [{"name": "Dylan Laplace Mermoud"}, {"name": "Dimitri Watel"}, {"name": "Sourour Elloumi"}, {"name": "Andrea Simonetto"}], "featured_authors": [{"name": "Dylan Laplace Mermoud"}, {"name": "Dimitri Watel"}, {"name": "Sourour Elloumi"}, {"name": "Andrea Simonetto"}], "author_count": 4}, {"id": "2610.13349", "category": "quant-ph", "title": "A General Method for Extending Isoscattering Non-Isospectral Quantum Graphs", "abstract": "The present paper sets out a general method for extending the isoscattering, non-isospectral quantum graphs. The methodology is illustrated by considering two graphs, denoted by $\\Gamma_1$ and $\\Gamma_2$, which have the same total metric length but different topologies. It is demonstrated that, despite the fact that their scattering matrices are identical, their eigenvalues, denoted by $k_n$, and Euler characteristics differ from one another. The next step in the process is to extend both graphs by affixing the same star graph to each of them. Utilising the Titchmarsh-Weyl M-function formalism, it is proven that the newly constructed, extended graphs are also isoscattering and non-isospectral.", "url": "https://arxiv.org/abs/2610.13349", "type": "理论", "summary": "本文提出了扩展等散射、非等谱量子图的通用方法。该方法通过考虑两个图来说明，分别表示为 $\\Gamma_1$ 和 $\\Gamma_2$，它们具有相同的总度量长度但不同的拓扑。结果表明，尽管它们的散射矩阵相同，但它们的特征值（用 $k_n$ 表示）和欧拉特征彼此不同。该过程的下一步是通过将相同的星图附加到每个图来扩展两个图。利用 Titchmarsh-Weyl M 函数形式，证明了新构造的扩展图也是等散射和非等谱的。", "authors": [{"name": "Omer Farooq"}, {"name": "Michal Lawniczak"}, {"name": "Leszek Sirko"}], "featured_authors": [{"name": "Omer Farooq"}, {"name": "Michal Lawniczak"}, {"name": "Leszek Sirko"}], "author_count": 3}, {"id": "2610.13359", "category": "quant-ph", "title": "System-Design Optimization of a Single-Transmitter, Single-Fiber QKD-based ITS Communication Link", "abstract": "Deploying QKD-based secure communication at scale requires reducing duplicated optical hardware while preserving the rate of protected user data. Earlier studies established the physical feasibility of carrying CV-QKD and classical signals over shared infrastructure, motivating a quantitative comparison between optical hardware savings and the OTP-encrypted rate. We perform this comparison by defining the secure communication rate (SCR) as the rate jointly supported by secret-key generation and classical transport, and using it to optimize a shared discrete-modulation CV-QKD link. The model combines a binomial 64-QAM security bound with a trusted receiver, protocol traffic, spectral leakage - optical power leaking into the quantum receive band - and Raman scattering. At 25 km, the asymptotic model gives an optimized SCR of 12.079 Mbps, compared with 12.095 Mbps for a separated-link reference, while reducing the transmitter and fiber counts from two to one each in the modeled direction. Increasing channel separation suppresses spectral leakage, but the resulting SCR gain diminishes once receiver bandwidth limits the rate. Under the adopted receiver-noise law, increasing the bandwidth budget from 350 to 750 MHz raises the projected 25-km SCR to 24.535 Mbps despite higher trusted electronic noise. For the studied metropolitan link, sharing saves optical resources with little rate loss, while receiver-bandwidth improvements provide greater benefit than further spectral separation. Together, these results suggest an integration path: share the transmitter and fiber, limit unwanted classical power in the quantum receive band, and increase usable receiver bandwidth where the noise budget permits.", "url": "https://arxiv.org/abs/2610.13359", "type": "理论+数值", "summary": "大规模部署基于 QKD 的安全通信需要减少重复的光学硬件，同时保持受保护的用户数据的速率。早期的研究确立了通过共享基础设施传输 CV-QKD 和经典信号的物理可行性，从而激发了光学硬件节省与 OTP 加密率之间的定量比较。我们通过将安全通信速率 (SCR) 定义为密钥生成和经典传输共同支持的速率来进行此比较，并使用它来优化共享离散调制 CV-QKD 链路。该模型将二项式 64-QAM 安全绑定与可信接收器、协议流量、频谱泄漏（泄漏到量子接收频带的光功率）和拉曼散射结合在一起。在 25 公里处，渐近模型给出的优化 SCR 为 12.079 Mbps，而分离链路参考为 12.095 Mbps，同时将建模方向上的发射器和光纤数量从 2 个减少到 1 个。增加通道间隔可以抑制频谱泄漏，但一旦接收器带宽限制速率，由此产生的 SCR 增益就会减小。\n\n根据所采用的接收机噪声法，尽管可信电子噪声更高，但将带宽预算从 350 MHz 增加到 750 MHz 将使预计 25 公里 SCR 的速率提高到 24.535 Mbps。对于所研究的城域链路，共享可以节省光学资源，而速率损失很小，而接收器带宽的改进比进一步的频谱分离提供了更大的好处。总之，这些结果表明了一条集成路径：共享发射机和光纤，限制量子接收频段中不需要的经典功率，并在噪声预算允许的情况下增加可用的接收机带宽。", "authors": [{"name": "Shivang Srivastava"}, {"name": "Guillaume Ricard"}, {"name": "Yves Jaouën"}, {"name": "Matteo Schiavon"}, {"name": "Romain Alléaume"}], "featured_authors": [{"name": "Shivang Srivastava"}, {"name": "Guillaume Ricard"}, {"name": "Yves Jaouën"}, {"name": "Matteo Schiavon"}, {"name": "Romain Alléaume"}], "author_count": 5}, {"id": "2610.13417", "category": "quant-ph", "title": "Modelling Josephson Junctions with Boundary Conditions: Towards High-Fidelity Models for Superconducting Qubits", "abstract": "Josephson junctions are the central nonlinear element of superconducting qubits, yet their standard description is reached through a chain of approximations. We propose a purely quantum-mechanical model of the junction, formulated directly in Hilbert space: a charged particle moves on a one-dimensional loop, and the junction is a point at which the wave function obeys self-adjoint boundary conditions, labelled by a coupling strength $\\lambda$, which controls the transparency of the junction, and a phase jump $\\delta$, which plays the role of the superconducting phase difference. For a loop with a single junction we solve the spectral problem and show that the ground-state momentum expectation, identified with the supercurrent, factorises exactly as $\\langle\\hat{p}_0\\rangle = I_c(\\delta,\\lambda)\\sin\\delta$. For opaque junctions $I_c$ becomes independent of $\\delta$ and the first Josephson relation $I=I_c\\sin\\delta$ is recovered; for strongly attractive coupling, where the ground state is bound to the junction, the $\\sin\\delta$ law is also recovered, but with an exponentially suppressed amplitude. For more transparent junctions, however, the model \\emph{predicts} deviations from the pure $\\sin\\delta$ law: $I_c$ acquires a dependence on $\\delta$ already at order $\\lambda^{-2}$, compatible with the higher Josephson harmonics recently found necessary to describe superconducting qubit spectra, and a fully transparent contact yields a current linear in $\\delta$. When the phase varies in time, a gauge transformation shows that the voltage drop across the junction is proportional to $\\dot\\delta$, so that the second Josephson relation emerges without being imposed. The boundary-condition approach thus reproduces both Josephson relations from first principles and predicts corrections to them, offering a route towards higher-fidelity models of superconducting qubits.", "url": "https://arxiv.org/abs/2610.13417", "type": "理论", "summary": "约瑟夫森结是超导量子位的中心非线性元件，但它们的标准描述是通过一系列近似来实现的。我们提出了一个纯粹的结的量子力学模型，直接在希尔伯特空间中表述：带电粒子在一维环上运动，结是波函数服从自伴边界条件的点，由耦合强度$\\lambda$标记，它控制结的透明度，以及相位跳跃$\\delta$，它起到超导相位差的作用。对于具有单结点的环路，我们解决了谱问题，并表明用超电流识别的基态动量期望完全分解为 $\\langle\\hat{p}_0\\rangle = I_c(\\delta,\\lambda)\\sin\\delta$。对于不透明连接点，$I_c$ 变得独立于 $\\delta$，并且恢复第一个约瑟夫森关系 $I=I_c\\sin\\delta$；对于强吸引力耦合，其中基态绑定到结，$\\sin\\delta$ 定律也被恢复，但幅度呈指数抑制。\n\n然而，对于更透明的结，模型 \\emph{预测} 偏离纯粹的 $\\sin\\delta$ 定律：$I_c$ 已经在 $\\lambda^{-2}$ 阶上获得了对 $\\delta$ 的依赖性，与最近发现描述超导量子位谱所必需的更高约瑟夫森谐波兼容，并且完全透明的接触产生了 $\\delta$ 中的线性电流。当相位随时间变化时，规范变换显示结点上的电压降与 $\\dot\\delta$ 成正比，因此第二个约瑟夫森关系在不强加的情况下出现。因此，边界条件方法再现了第一原理中的约瑟夫森关系，并预测了对它们的修正，为超导量子位的更高保真度模型提供了一条途径。", "authors": [{"name": "Luis Bueno Blanco"}, {"name": "Juan Manuel Pérez-Pardo"}], "featured_authors": [{"name": "Luis Bueno Blanco"}, {"name": "Juan Manuel Pérez-Pardo"}], "author_count": 2}, {"id": "2610.13477", "category": "quant-ph", "title": "Harmonic analysis and circuit approximation of Sobolev functions on quantum input spaces", "abstract": "We derive approximation rates for Sobolev functions defined on the complex unit sphere and complex projective space, representing quantum states, and on the special and projective unitary groups, representing quantum unitary operations. By using harmonic analysis on compact groups and compact homogeneous spaces, we characterize the corresponding Peter--Weyl decompositions and Sobolev spaces via irreducible representations and the Laplace--Beltrami operator. Combining spectral truncation with finite-depth quantum-circuit approximation, invoking the Solovay--Kitaev theorem, we establish quantitative rates that separate the spectral truncation error from the circuit approximation error.", "url": "https://arxiv.org/abs/2610.13477", "type": "理论", "summary": "我们推导出在代表量子态的复单位球面和复射影空间上定义的 Sobolev 函数的近似率，以及在代表量子酉运算的特殊射影酉群上定义的 Sobolev 函数的近似率。通过对紧群和紧齐次空间的调和分析，我们通过不可约表示和Laplace--Beltrami算子刻画了相应的Peter--Weyl分解和Sobolev空间。将谱截断与有限深度量子电路近似相结合，调用 Solovay-Kitaev 定理，我们建立了将谱截断误差与电路近似误差分开的定量比率。", "authors": [{"name": "Philipp Schmocker"}], "featured_authors": [{"name": "Philipp Schmocker"}], "author_count": 1}, {"id": "2610.13512", "category": "quant-ph", "title": "Construction of isoscattering non-isospectral quantum graphs using the concept of a germ graph", "abstract": "The recently developed concept of germ graphs (P. Kurasov {\\it et al.}, Phys. Rev. Research {\\bf 7}, L022071 (2025)) is employed to construct families of isocattering, non-isospectral graphs that exhibit dissipation. More specifically, a new pair of isoscattering non-isospectral graphs is constructed by connecting the existing isoscattering non-isospectral graphs, so called attachments, to the different contact vertices of the germ graph. The existing isoscattering non-isospectral graphs contained a two-loop graph labelled $\\Gamma_{A2}$ and a three-loop graph labelled $\\Gamma_{A3}$. These graphs have an equal total metric length, but different topologies. The resulting graphs $\\Gamma_3$ and $\\Gamma_4$ are verified as non-isospectral using their Euler characteristics, while their isoscattering properties are investigated by calculating the one-port scattering matrices numerically.", "url": "https://arxiv.org/abs/2610.13512", "type": "数值", "summary": "最近开发的细菌图概念（P. Kurasov {\\it et al.}, Phys. Rev. Research {\\bf 7}, L022071 (2025)）用于构建表现出耗散的等散射、非等谱图族。更具体地说，通过将现有的等散射非等谱图（所谓的附件）连接到胚芽图的不同接触顶点来构造一对新的等散射非等谱图。现有的等散射非等谱图包含标记为 $\\Gamma_{A2}$ 的二环图和标记为 $\\Gamma_{A3}$ 的三环图。这些图具有相同的总公制长度，但拓扑不同。使用欧拉特性验证生成的图 $\\Gamma_3$ 和 $\\Gamma_4$ 是否为非等谱图，同时通过数值计算单端口散射矩阵来研究它们的等散射特性。", "authors": [{"name": "Omer Farooq"}, {"name": "Michał Ławniczak"}, {"name": "Leszek Sirko"}], "featured_authors": [{"name": "Omer Farooq"}, {"name": "Michał Ławniczak"}, {"name": "Leszek Sirko"}], "author_count": 3}, {"id": "2610.13589", "category": "quant-ph", "title": "Decoder- and Noise-Aware Optimization Framework for Clifford-Deformed Quantum Error-Correcting Codes", "abstract": "Practical fault-tolerant quantum computing requires qubit-efficient quantum error correction (QEC). Clifford deformations (CDs) modify the stabilizers of a QEC code to lower its logical error rate at no additional resource cost. However, the number of possible CDs grows exponentially with the number of qubits, making exhaustive search infeasible beyond small codes. In this work, we further show that under circuit level noise the optimal CD depends strongly on both the noise model and decoder. To make systematic CD optimization possible, we introduce Evolution-Based Best-arm Identification (EBBI), a shot-efficient search algorithm that treats the circuit, noise model and decoder as a black box. We benchmark EBBI's performance on the rotated surface code, under two strongly $Z$-biased circuit-level noise models with the PyMatching decoder. At distance 3, EBBI finds the optimal CD using up to $\\sim 1100\\times$ fewer shots than random search. At distance 5, when run at the target error rate, the median EBBI run converges to the CDs we believe to be optimal, while random search never converges. Under a $Z$-biased SI1000-like noise model, EBBI discovers a new CD, the B-XZZX code, which we generalized to larger distances. It differs from XZZX on only a fraction $\\mathcal{O}(d^{-1})$ of the qubits at code distance $d$, yet its relative advantage grows from $\\approx 5\\%$ at $d = 3$ to $\\approx 12\\%$ at $d = 11$. We thus show that the B-XZZX pattern found by EBBI can be systematically scaled to larger code distances. Our work represents a first step towards scalable CD optimization for general QEC codes.", "url": "https://arxiv.org/abs/2610.13589", "type": "理论+数值", "summary": "实用的容错量子计算需要量子位高效的量子纠错（QEC）。 Clifford 变形 (CD) 修改 QEC 代码的稳定器，以降低其逻辑错误率，而无需额外的资源成本。然而，可能的 CD 数量随着量子位数量呈指数增长，使得穷举搜索在小代码之外变得不可行。在这项工作中，我们进一步表明，在电路级噪声下，最佳 CD 很大程度上取决于噪声模型和解码器。为了使系统 CD 优化成为可能，我们引入了基于进化的最佳臂识别 (EBBI)，这是一种高效的搜索算法，将电路、噪声模型和解码器视为黑匣子。我们使用 PyMatching 解码器在两个强 $Z$ 偏置的电路级噪声模型下对旋转表面代码上的 EBBI 性能进行基准测试。在距离 3 处，EBBI 使用比随机搜索少 $\\sim 1100\\times$ 的镜头找到最佳 CD。在距离 5 处，当以目标错误率运行时，EBBI 运行中值收敛到我们认为最佳的 CD，而随机搜索永远不会收敛。\n\n在类似 $Z$ 的 SI1000 噪声模型下，EBBI 发现了一种新的 CD，即 B-XZZX 代码，我们将其推广到更大的距离。它与 XZZX 的区别仅在于代码距离 $d$ 处量子位的一小部分 $\\mathcal{O}(d^{-1})$，但其相对优势从 $d = 3$ 处的 $\\approx 5\\%$ 增长到 $d = 11$ 处的 $\\approx 12\\%$。因此，我们表明 EBBI 发现的 B-XZZX 模式可以系统地缩放到更大的代码距离。我们的工作代表了通用 QEC 代码的可扩展 CD 优化的第一步。", "authors": [{"name": "Julius Rye Bønnelykke"}, {"name": "Benjamin Joecker"}, {"name": "Peter Krogstrup"}, {"name": "Vincent Philippe Michal"}, {"name": "Mark Kamper Svendsen"}], "featured_authors": [{"name": "Julius Rye Bønnelykke"}, {"name": "Benjamin Joecker"}, {"name": "Peter Krogstrup"}, {"name": "Vincent Philippe Michal"}, {"name": "Mark Kamper Svendsen"}], "author_count": 5}, {"id": "2610.13602", "category": "quant-ph", "title": "Entanglement Catalysis Beyond the Asymptotic Rate", "abstract": "Quantum entanglement is a fundamental resource in quantum information science, commonly consumed to perform tasks like quantum teleportation and quantum key distribution. Entanglement concentration converts partially entangled pure states into nearly perfect Bell pairs. While its efficiency is well understood in the asymptotic limit, practical protocols must operate with finite systems. In this finite regime, and at the low error levels relevant in practice, performance is penalized by corrections that reduce the achievable yield. We investigate whether this fundamental finite-size penalty can be mitigated by an entanglement catalyst: an auxiliary state that aids the transformation but is returned exactly and uncorrupted. Although such a catalyst cannot increase the leading-order asymptotic yield, we show that it fundamentally alters the finite-size scaling. For every bipartite pure state with nonuniform Schmidt coefficients, we exactly determine the optimal second-order correction to the yield and show that catalysis completely overcomes this finite-size penalty.", "url": "https://arxiv.org/abs/2610.13602", "type": "理论+数值", "summary": "量子纠缠是量子信息科学中的基本资源，通常用于执行量子隐形传态和量子密钥分发等任务。纠缠浓度将部分纠缠的纯态转化为近乎完美的贝尔对。虽然其效率在渐进极限下得到了很好的理解，但实际协议必须在有限系统下运行。在这种有限的情况下，并且在实践中相关的低误差水平下，性能会因降低可实现良率的修正而受到惩罚。我们研究是否可以通过纠缠催化剂来减轻这种基本的有限尺寸惩罚：一种有助于转换但准确返回且未损坏的辅助状态。尽管这样的催化剂不能增加前导渐近产量，但我们证明它从根本上改变了有限尺寸缩放。对于每个具有非均匀施密特系数的二分纯态，我们精确地确定了对产率的最佳二阶修正，并表明催化完全克服了这种有限尺寸的惩罚。", "authors": [{"name": "Alexander Streltsov"}], "featured_authors": [{"name": "Alexander Streltsov"}], "author_count": 1}, {"id": "2610.13621", "category": "quant-ph", "title": "Encoding Matters: A Qubit-Efficient Reformulation for Quantum Resilient Routing", "abstract": "Qubits are powerful computational resources because each additional qubit doubles the size of the accessible state space. This expressive power comes at a cost: adding qubits also increases circuit size, constraint overhead, and exposure to hardware noise. These limitations are especially critical for near-term quantum computers, making the number of qubits required to formulate a problem a central practical concern. In this work, we present a method for efficiently mapping logistics and routing problems onto qubits through structure-aware encoding reduction. We demonstrate the method on a benchmark problem of latency-resilient routing under dual-link failures. For this benchmark, the reduced formulation substantially lowers both the qubit count and the compiled circuit complexity while preserving the original optimization task. By running the reduced model on the same trapped-ion quantum computer as the benchmark, we obtain a 100X improvement in the success probability. This finding shows how careful problem formulation can make current quantum hardware substantially more effective for practical optimization.", "url": "https://arxiv.org/abs/2610.13621", "type": "理论+数值", "summary": "量子位是强大的计算资源，因为每个额外的量子位都会使可访问状态空间的大小加倍。这种表达能力是有代价的：添加量子位还会增加电路尺寸、约束开销以及硬件噪声的暴露。这些限制对于近期的量子计算机尤其重要，使得解决问题所需的量子比特数量成为实际问题的核心。在这项工作中，我们提出了一种通过结构感知编码减少有效地将物流和路由问题映射到量子位上的方法。我们在双链路故障下的延迟弹性路由基准问题上演示了该方法。对于该基准测试，简化的公式大大降低了量子位计数和编译电路的复杂性，同时保留了原始的优化任务。通过在与基准相同的俘获离子量子计算机上运行简化模型，我们的成功概率提高了 100 倍。这一发现表明，仔细的问题表述可以如何使当前的量子硬件在实际优化方面更加有效。", "authors": [{"name": "Emanuele G. Dalla Torre"}, {"name": "Bat-El Friedman"}, {"name": "Daniel Porat"}], "featured_authors": [{"name": "Emanuele G. Dalla Torre"}, {"name": "Bat-El Friedman"}, {"name": "Daniel Porat"}], "author_count": 3}, {"id": "2610.13652", "category": "quant-ph", "title": "Finite-Size Limits of Adaptive Pauli Prediction", "abstract": "Can quantum data reliably answer questions chosen from earlier results? We prove that $M$ adaptive Pauli predictions on $n$ qubits require $\\Omega(\\sqrt{\\min\\{n,M\\}})$ copies at fixed accuracy. Published upper bounds make this tight for $M\\le n$. Thus $n$ adaptive predictions cost $\\Theta(\\sqrt n)$ copies, whereas a fixed list costs only $O(\\log n)$. The lower bound uses diagonal states and commuting observables, identifying a statistical cost of adaptation. We also quantify how this cost increases with precision.", "url": "https://arxiv.org/abs/2610.13652", "type": "理论", "summary": "量子数据能否可靠地回答从早期结果中选择的问题？我们证明，对 $n$ 量子位的 $M$ 自适应泡利预测需要以固定精度进行 $\\Omega(\\sqrt{\\min\\{n,M\\}})$ 副本。已发布的上限使得 $M\\le n$ 的范围变得很紧。因此，$n$ 自适应预测成本 $\\Theta(\\sqrt n)$ 副本，而固定列表仅成本 $O(\\log n)$。下限使用对角线状态和通勤可观测值，确定适应的统计成本。我们还精确地量化了这种成本如何增加。", "authors": [{"name": "Luofei Wang"}, {"name": "Boyu Liu"}, {"name": "Zihe Wang"}, {"name": "Zhangqi Yin"}], "featured_authors": [{"name": "Luofei Wang"}, {"name": "Boyu Liu"}, {"name": "Zihe Wang"}, {"name": "Zhangqi Yin"}], "author_count": 4}, {"id": "2610.13709", "category": "quant-ph", "title": "Dynamical Lie Algebras for Fixed-Gate Quantum Ansätze", "abstract": "Parameterized Quantum Circuits have emerged as a central framework for variational quantum algorithms in the NISQ regime, with major applications in quantum simulation, combinatorial optimization, and, more recently, quantum machine learning (QML). By developing a new approach for computing dynamical Lie algebras associated with quantum circuits combining parametrized gates and non-parametrized entangling gates, we aim to extend the applicability of recent algebraic results to architectures that are actually used in quantum machine learning.", "url": "https://arxiv.org/abs/2610.13709", "type": "数值", "summary": "参数化量子电路已成为 NISQ 体系中变分量子算法的中心框架，主要应用于量子模拟、组合优化以及最近的量子机器学习 (QML)。通过开发一种新方法来计算与结合参数化门和非参数化纠缠门的量子电路相关的动态李代数，我们的目标是将最新代数结果的适用性扩展到实际用于量子机器学习的体系结构。", "authors": [{"name": "Orlane Zang"}, {"name": "Daniel Juteau"}, {"name": "Tony Quertier"}, {"name": "Grégoire Barrué"}], "featured_authors": [{"name": "Orlane Zang"}, {"name": "Daniel Juteau"}, {"name": "Tony Quertier"}, {"name": "Grégoire Barrué"}], "author_count": 4}, {"id": "2610.13784", "category": "quant-ph", "title": "Locality-Preparation Time Tradeoffs in Dissipative Quantum Systems", "abstract": "Dissipative state preparation engineers quantum many-body states as steady states of an open-system dynamics. The spatial range of the required dissipation sets both the feasibility of analog implementations and the connectivity and control complexity of digital ones. Yet how this locality quantitatively constrains preparation times remains largely unknown. Here, we establish an exact locality-preparation time relation for quadratic fermionic systems and develop a construction that optimizes the locality of the dissipative dynamics while preserving the target state. Applied to the Kitaev chain, our framework reveals sharply different locality-preparation time tradeoffs in critical and gapped regimes. At criticality, suppressing the algebraic tails of the jump operators necessarily forces the preparation time to grow algebraically with system size. By contrast, both trivial and topological gapped phases admit exponentially localized dissipation with a finite preparation time in the thermodynamic limit. Our results identify when fast dissipative preparation is compatible with local control and when criticality imposes an unavoidable dynamical cost.", "url": "https://arxiv.org/abs/2610.13784", "type": "理论+数值", "summary": "耗散态制备工程师将多体态量子化为开放系统动力学的稳态。所需耗散的空间范围决定了模拟实现的可行性以及数字实现的连接性和控制复杂性。然而，这个地方如何在数量上限制准备时间仍然很大程度上未知。在这里，我们为二次费米子系统建立了精确的局部性-准备时间关系，并开发了一种在保留目标状态的同时优化耗散动力学局部性的结构。应用于 Kitaev 链，我们的框架揭示了关键和缺口制度中截然不同的地点-准备时间权衡。在关键时刻，抑制跳跃算子的代数尾部必然迫使准备时间随着系统规模的代数增长。相比之下，平凡相和拓扑有隙相都允许在热力学极限内以有限的准备时间进行指数局部耗散。我们的结果确定了快速耗散准备何时与局部控制兼容以及临界性何时施加了不可避免的动态成本。", "authors": [{"name": "Philipp Westhoff"}, {"name": "Sara Murciano"}, {"name": "Mattia Moroder"}], "featured_authors": [{"name": "Philipp Westhoff"}, {"name": "Sara Murciano"}, {"name": "Mattia Moroder"}], "author_count": 3}, {"id": "2610.13854", "category": "quant-ph", "title": "No advantage from classical assistance for energy-constrained bosonic dephasing channels", "abstract": "We prove that four capacities of single-mode bosonic dephasing channels coincide under an average photon-number constraint: the unassisted quantum capacity, the unassisted private capacity, the two-way classically assisted quantum capacity, and the two-way public-classically assisted private capacity. The assistance may be interactive: the parties can exchange classical messages between channel uses and choose subsequent inputs based on earlier outcomes. For every finite value of the constraint, their common value is the coherent information optimized over Fock-diagonal input states satisfying the constraint. The proof uses a relative entropy comparison with the completely dephasing channel to derive chain rules for the Rains relative entropy and the relative entropy of entanglement. These chain rules give an upper bound on the rates achievable by adaptive protocols whose mean input photon number is constrained on average over all channel uses. We also show that both chain rules are attained by canonical purifications of finite-energy Fock-diagonal states.", "url": "https://arxiv.org/abs/2610.13854", "type": "理论+数值", "summary": "我们证明了单模玻色相移通道的四种容量在平均光子数约束下重合：无辅助量子容量、无辅助专用容量、双向经典辅助量子容量和双向公共经典辅助专用容量。这种帮助可以是交互式的：各方可以在通道使用之间交换经典消息，并根据早期结果选择后续输入。对于约束的每个有限值，它们的共同值是在满足约束的 Fock 对角输入状态上优化的相干信息。该证明使用相对熵与完全相移通道的比较来推导 Rains 相对熵和纠缠相对熵的链规则。这些链规则给出了自适应协议可实现的速率的上限，其平均输入光子数在所有通道使用上平均受到限制。我们还表明，这两条链规则都是通过有限能量福克对角态的规范纯化来获得的。", "authors": [{"name": "Amir Arqand"}, {"name": "Graeme Smith"}], "featured_authors": [{"name": "Amir Arqand"}, {"name": "Graeme Smith"}], "author_count": 2}, {"id": "2610.13879", "category": "quant-ph", "title": "GPU-Based Parallel BP Decoding for Quantum LDPC Memory", "abstract": "Quantum low-density parity-check (qLDPC) decoding requires reliable corrections and low latency over long syndrome histories. We extend BP-SF, an oscillation-guided belief-propagation (BP) decoder with independent syndrome-flip trials, by introducing windowed and streaming operations. Our CUDA implementation combines disordered-memory retries, sliding windows, correlation-aware graphs, and layered scheduling. Circuit-level simulations test fixed-basis memory and complete logical Pauli-frame recovery. On the [[144,12,12]] bivariate bicycle code at physical error rate p = 0.002, parallel BP-SF reduces 99.9th-percentile call latency by a factor of 13.15 relative to an eight-chain Relay-BP GPU baseline on 100,000 matched samples for which every tested method's initial BP stage fails within 80 iterations. Windowed BP-SF maintains a flat logical error rate and nearly constant per-round compute time through 512 rounds, reaching a 17.1-fold speedup over monolithic decoding. In 512-round full-frame streaming decoding with 2.97-ms syndrome arrivals, layered BP-SF on a transformed joint graph with 20 retries reduces 99.9th-percentile correction-release age from 166.29 to 36.25 ms relative to the joint graph with flooding updates and 100 retries. These results connect parallel BP post-processing to lower decoding costs and earlier correction release in streaming quantum memory.", "url": "https://arxiv.org/abs/2610.13879", "type": "数值", "summary": "量子低密度奇偶校验 (qLDPC) 解码需要在较长的综合症历史上实现可靠的校正和低延迟。我们通过引入窗口和流操作来扩展 BP-SF，这是一种具有独立校正子翻转试验的振荡引导置信传播 (BP) 解码器。我们的 CUDA 实现结合了无序内存重试、滑动窗口、相关感知图和分层调度。电路级仿真测试固定基内存和完整的逻辑泡利帧恢复。在物理错误率 p = 0.002 的 [[144,12,12]] 双变量自行车代码上，并行 BP-SF 相对于 100,000 个匹配样本（每个测试方法的初始 BP 阶段在 80 次迭代内失败）的八链 Relay-BP GPU 基线，将 99.9% 的调用延迟减少了 13.15 倍。窗口 BP-SF 在 512 轮中保持平坦的逻辑错误率和几乎恒定的每轮计算时间，比单片解码实现了 17.1 倍的加速。\n\n在具有 2.97 毫秒综合症到达的 512 轮全帧流解码中，相对于具有洪泛更新和 100 次重试的联合图，在经过 20 次重试的变换联合图上分层 BP-SF 将 99.9% 的校正释放年龄从 166.29 毫秒减少到 36.25 毫秒。这些结果将并行 BP 后处理与流量子存储器中更低的解码成本和更早的校正释放联系起来。", "authors": [{"name": "Ming Wang"}, {"name": "Yanbo Zhao"}, {"name": "Ang Li"}, {"name": "Frank Mueller"}], "featured_authors": [{"name": "Ming Wang"}, {"name": "Yanbo Zhao"}, {"name": "Ang Li"}, {"name": "Frank Mueller"}], "author_count": 4}, {"id": "2610.13903", "category": "quant-ph", "title": "Maximally antiflat fixed-particle-number fermionic states", "abstract": "Fermionic Gaussian states are completely characterized by their two-point correlations, making the covariance matrix a natural reference for quantifying non-Gaussian structure. Motivated by fermionic antiflatness, we study its extremal form for pure number-conserving states and ask which states can be maximally antiflat and how they can be constructed. We show that, at fixed particle number, maximal first antiflatness is equivalent to a completely flat one-body reduced density matrix, and we obtain a complete existence classification together with explicit block and cyclic-orbit constructions of all allowed sectors. We then investigate the structure that appears beyond the covariance level. Maximally antiflat states with identical one-body data can exhibit distinct connected four-point correlations, which we characterize through the four-point Majorana Wick error and, equivalently, the connected two-body reduced density matrix cumulant. We show that this quartic structure is necessarily nonzero and formulate its extremization as a two-body reduced density matrix (2RDM) purity problem. Combining this framework with a Hilbert--Schmidt estimate of Christiansen for truncated two-body correlations, we obtain an upper bound on the connected quartic structure in terms of first antiflatness. Our results establish both a complete characterization of maximal fermionic antiflatness at fixed particle number and a constrained hierarchy linking covariance-level flatness to higher-order non-Gaussian correlations.", "url": "https://arxiv.org/abs/2610.13903", "type": "理论", "summary": "费米子高斯态完全由其两点相关性表征，使得协方差矩阵成为量化非高斯结构的自然参考。受费米子反平坦性的启发，我们研究了纯数守恒态的极值形式，并询问哪些状态可以最大程度地反平坦以及如何构造它们。我们证明，在固定粒子数下，最大第一反平坦性相当于完全平坦的单体约简密度矩阵，并且我们获得了完整的存在分类以及所有允许扇区的显式块和循环轨道结构。然后我们研究超出协方差水平的结构。具有相同单体数据的最大反平坦态可以表现出不同的连接四点相关性，我们通过四点马约拉纳威克误差和等效的连接两体约化密度矩阵累积量来表征。我们证明了这种四次结构必然是非零的，并将其极值化为二体约化密度矩阵（2RDM）纯度问题。\n\n将此框架与截断二体相关性的 Christiansen 的希尔伯特-施密特估计相结合，我们获得了连通四次结构在第一反平坦性方面的上限。我们的结果既建立了固定粒子数下最大费米子反平坦性的完整表征，又建立了将协方差水平平坦性与高阶非高斯相关性联系起来的约束层次结构。", "authors": [{"name": "Rahul Gupta"}, {"name": "Arya Haghighian"}, {"name": "James D. Whitfield"}], "featured_authors": [{"name": "Rahul Gupta"}, {"name": "Arya Haghighian"}, {"name": "James D. Whitfield"}], "author_count": 3}, {"id": "2610.13906", "category": "quant-ph", "title": "Quantum Query Complexity of Maximum Degree and its Generalizations", "abstract": "We study the quantum query complexity of several basic graph problems. 1) We prove a tight $\\Theta(n^{3/2})$ bound for finding a maximum-out-degree vertex in an $n$-vertex tournament, resolving a conjecture of Mande, Paraashar, and Saurabh [FSTTCS'23]. 2) Using the same proof idea, we give a direct proof that finding a maximum-degree vertex in an $n$-vertex undirected graph requires $\\Theta(n^{3/2})$ quantum queries, a bound implicit in the work of Apers and Lee [CCC'21]. Both lower bounds above hold even for computing only the maximum degree or maximum out-degree. 3) We also study Maximum $(k,n-k)$-Cut, which asks for the largest cut with one side of size $k$. For every constant $k\\geq 1$, we give an $O(n^{2-1/(k+1)})$-query quantum algorithm. 4) We establish a reduction to Maximum $(k,n-k)$-Cut involving $k$-Graph Collision, which asks whether the marked vertices of a known graph contain a $k$-clique. For $k\\geq 3$, this yields unconditional lower bounds with exponents strictly larger than $3/2$, showing that this problem is strictly harder than computing maximum degree. Additionally, under a conjecture we propose for $k$-Graph Collision, the reduction yields a lower bound matching our upper bound above.", "url": "https://arxiv.org/abs/2610.13906", "type": "理论+数值", "summary": "我们研究了几个基本图问题的量子查询复杂性。 1) 我们证明了在 $n$ 顶点锦标赛中寻找最大出度顶点的严格 $\\Theta(n^{3/2})$ 界限，解决了 Mande、Paraashar 和 Saurabh 的猜想 [FSTTCS'23]。 2) 使用相同的证明思想，我们给出了一个直接证明，即在 $n$ 顶点无向图中找到最大度顶点需要 $\\Theta(n^{3/2})$ 量子查询，这是 Apers 和 Lee [CCC'21] 工作中隐含的界限。即使仅计算最大度或最大出度，上述两个下限也成立。 3）我们还研究了最大$(k,n-k)$-Cut，它要求一侧尺寸为$k$的最大切割。对于每个常数 $k\\geq 1$，我们给出一个 $O(n^{2-1/(k+1)})$ 查询量子算法。 4）我们建立了涉及$k$-图碰撞的最大$(k,n-k)$-Cut的约简，它询问已知图的标记顶点是否包含$k$-clique。对于 $k\\geq 3$，这会产生指数严格大于 $3/2$ 的无条件下界，表明这个问题比计算最大次数严格上更难。\n\n此外，根据我们提出的 $k$-图碰撞的猜想，减少会产生与上面的上限相匹配的下限。", "authors": [{"name": "Amin Shiraz Gilani"}, {"name": "Nikhil S. Mande"}, {"name": "Subhasree Patro"}, {"name": "Nithish Raja"}], "featured_authors": [{"name": "Amin Shiraz Gilani"}, {"name": "Nikhil S. Mande"}, {"name": "Subhasree Patro"}, {"name": "Nithish Raja"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
