  <style>

  <script>
    const papers = [{"id": "2609.31672", "category": "cond-mat", "title": "From a three-fluid junction to Young's law: Constitutive and rigid-support limits of wetting", "abstract": "Young's law on a rigid solid and the Neumann balance at a three-fluid junction describe different admissible motions. We connect them through an ordered continuum construction. An affine viscoelastic third phase first acquires permanent deformation memory in the no-relaxation limit at fixed modulus. Independently specified material-surface laws distinguish surface free energy from mechanical surface stress. On the deformable support, displacement of solid material and migration of the wet-dry partition give separate equilibrium conditions. Stiffening an anchored support suppresses displacement at a fixed macroscopic observation distance but leaves reversible migration possible. The surviving variation gives Young's law; the constrained mechanics remains as a reaction carrying normal and, in general, tangential capillary loads. Two complementary results substantiate this reduction. A clamped finite-strain model with circular liquid interfaces yields uniform convergence of reduced energies and recovery of the spatial Young angle for global almost minimisers. A separate quadratic half-space model gives convergence of stationary migration derivatives and a nonzero limiting traction distribution. The results explain how a local Neumann-like ridge can coexist with a Young angle measured against the distant wall, while distinguishing geometric convergence from the control of migration and reaction forces.", "url": "https://arxiv.org/abs/2609.31672", "type": "理论", "summary": "刚性固体的杨氏定律和三流体连接处的诺伊曼平衡描述了不同的允许运动。我们通过有序的连续体结构将它们连接起来。仿射粘弹性第三相首先在固定模量的无松弛极限下获得永久变形记忆。独立指定的材料表面定律区分表面自由能和机械表面应力。在可变形支撑上，固体材料的位移和干湿分区的迁移给出了单独的平衡条件。加固锚固支撑可以抑制固定宏观观察距离处的位移，但可以实现可逆迁移。剩下的变体给出了杨氏定律；受约束的力学仍然是一种带有正常的、通常是切向毛细管载荷的反应。两个互补的结果证实了这种减少。具有圆形液体界面的夹紧有限应变模型可产生约化能量的均匀收敛和全局几乎极小化器的空间杨氏角的恢复。\n\n单独的二次半空间模型给出了平稳迁移导数的收敛性和非零极限牵引力分布。结果解释了局部类诺依曼山脊如何与对远处墙壁测量的杨氏角共存，同时区分几何收敛与迁移和反作用力的控制。", "authors": [{"name": "Dieter Bothe"}], "featured_authors": [{"name": "Dieter Bothe"}], "author_count": 1}, {"id": "2609.31707", "category": "cond-mat", "title": "Blockwise friction heterogeneity redistributes stretching in a 2D Gaussian polymer under Batchelor-Kraichnan random flow", "abstract": "We study a two-dimensional Gaussian Rouse chain divided into two contiguous blocks with different local friction coefficients but identical Hookean elasticity. In quiescent conditions, friction heterogeneity leaves the continuous-time equilibrium Gaussian conformation unchanged while producing distinct block mobilities and a modified generalized relaxation spectrum. The exact friction-weighted translational diffusion coefficient retains the scaling $D_\\gamma\\propto N^{-1}$, with a friction-dependent prefactor; the corresponding diffusion law and generalized-mode formulation extend beyond the diblock to more general local friction profiles. We then place the chain in an incompressible Batchelor-Kraichnan random flow. Under a common external flow, the high-friction block becomes more extended than the low-friction block. The deformation asymmetry strengthens with friction contrast and develops across the weak- to moderate-flow regime, remaining clearly visible at the strongest finite-time conditions. It also persists when the chain-specific longest-mode Weissenberg number is matched across friction ratios, showing that, within the same finite-time protocol, the effect is not accounted for solely by a shift of the global relaxation timescale. In generalized-mode coordinates, the smooth random strain does not directly mix mode indices and preferentially amplifies the slowest mode. At larger flow strengths, extension distributions broaden markedly and exhibit pronounced temporal drift over the simulated time window. Since all simulated chain-specific longest-mode Weissenberg numbers remain below unity, this drift is interpreted as slow convergence toward the broad, power-law-tailed stationary Hookean regime near the coil-stretch threshold. Overall, friction heterogeneity alone is sufficient to redistribute deformation along an otherwise mechanically uniform polymer.", "url": "https://arxiv.org/abs/2609.31707", "type": "理论", "summary": "我们研究了一个二维高斯劳斯链，该链分为两个相邻的块，具有不同的局部摩擦系数但具有相同的胡克弹性。在静态条件下，摩擦异质性使连续时间平衡高斯构象保持不变，同时产生不同的块迁移率和修改后的广义弛豫谱。精确的摩擦加权平移扩散系数保留缩放 $D_\\gamma\\propto N^{-1}$，并具有依赖于摩擦的前置因子；相应的扩散定律和广义模式公式超出了二嵌段到更一般的局部摩擦曲线。然后，我们将链置于不可压缩的 Batchelor-Kraichnan 随机流中。在共同的外部流动下，高摩擦块比低摩擦块延伸得更多。变形不对称性随着摩擦力的对比而增强，并在弱流到中等流态中发展，在最强的有限时间条件下仍然清晰可见。\n\n当特定于链的最长模式韦森伯格数在摩擦比上匹配时，它也仍然存在，这表明，在相同的有限时间协议内，该效应不仅仅由全局弛豫时间尺度的变化来解释。在广义模态坐标中，平滑随机应变不直接混合模态索引，而是优先放大最慢的模态。在较大的流动强度下，延伸分布显着变宽，并在模拟时间窗口内表现出明显的时间漂移​​。由于所有模拟链特定的最长模式韦森伯格数仍然低于统一，因此这种漂移被解释为在线圈拉伸阈值附近缓慢收敛到广泛的幂律尾稳态胡克状态。总体而言，仅摩擦不均匀性就足以沿着机械均匀的聚合物重新分布变形。", "authors": [{"name": "Arpan Dey"}], "featured_authors": [{"name": "Arpan Dey"}], "author_count": 1}, {"id": "2609.31730", "category": "cond-mat", "title": "R-transforms for non-Hermitian block random matrices: a spherical integral approach", "abstract": "We extend the spherical-integral approach to $\\mathcal{R}$-transforms of non-Hermitian random matrices to random matrices with a fixed $K \\times K$ block structure. We introduce a rank-$K$ spherical integral defining a scalar $H$-transform on $2K \\times 2K$ overlap matrices and an associated matrix-valued $\\mathcal{R}$-transform encoding the joint block structure. Using the replica method, we derive a conjectural subordination relation for sums of independent block matrices. This framework provides a method for determining the spectral boundaries of large non-Hermitian random matrices with a fixed block structure.", "url": "https://arxiv.org/abs/2609.31730", "type": "理论", "summary": "我们将球积分方法扩展到 $\\mathcal{R}$ - 将非埃尔米特随机矩阵转换为具有固定 $K \\times K$ 块结构的随机矩阵。我们引入了一个rank-$K$球面积分，定义了$2K \\times 2K$重叠矩阵上的标量$H$变换，以及编码联合块结构的相关矩阵值$\\mathcal{R}$变换。使用复制方法，我们推导出独立分块矩阵之和的推测从属关系。该框架提供了一种确定具有固定块结构的大型非厄米随机矩阵的谱边界的方法。", "authors": [{"name": "Pierre Bousseyroux"}], "featured_authors": [{"name": "Pierre Bousseyroux"}], "author_count": 1}, {"id": "2609.31761", "category": "cond-mat", "title": "A Robust \"Shrink-and-wrap\" Piecewise Construction Transforms 3-Dimensional Mesh Structures into Mechanical Metamaterials", "abstract": "Mechanical metamaterials are materials that, by virtue of their microstructural architectures, exhibit mechanical properties not often found in nature: for example, auxetic mechanical metamaterials are materials that possess a negative Poisson's ratio in response to deforming forces. However, outside of relatively simple crystalline, lattice-based, or repeating-pattern architectures composed of mostly identical unit cells, mechanical metamaterials like auxetics are notoriously difficult to design, particularly across all three dimensions. Here we show that, for any structure that can be decomposed into triangular or tetrahedral meshes, those structures can be subjected to a simple transformation that that creates conditions within those triangular or tetrahedral simplexes that, regardless of their individual geometries, introduces a counter-rotating polygon/polyhedron mechanism that both guarantees a negative Poisson ratio and allows locally programmable mechanical properties. We apply this \"shrink-and-wrap\" construction to generate mechanical metamaterials from increasingly complex 3D structures, first from simple (convex) polyhedrons; then, to designs with arbitrarily large numbers of vertices and designed using constructive solid geometry (CSG) and 3D scanning; and, ultimately to 3D objects generated from videos captured by mobile phone camera -- making potentially any object or geometric structure designed or found in the real world transformable into a mechanical metamaterial. We show that these monolithic auxetic constructions remain readily 3D-printable via additive manufacturing techniques. We expect this piecewise approach to designing arbitrarily complex mechanical metamaterial structures can enable numerous potential applications where programmable internal reconfigurations and/or force redirection are required across and throughout their 3D geometries.", "url": "https://arxiv.org/abs/2609.31761", "type": "理论", "summary": "机械超材料是由于其微观结构而表现出自然界中不常见的机械特性的材料：例如，拉胀机械超材料是响应变形力而具有负泊松比的材料。然而，除了由几乎相同的晶胞组成的相对简单的晶体、基于晶格或重复图案的架构之外，像拉胀材料这样的机械超材料非常难以设计，特别是在所有三个维度上。在这里，我们表明，对于任何可以分解为三角形或四面体网格的结构，这些结构都可以进行简单的变换，从而在这些三角形或四面体单纯形内创建条件，无论其各自的几何形状如何，都会引入反向旋转的多边形/多面体机制，该机制既保证了负泊松比，又允许本地可编程的机械性能。\n\n我们应用这种“收缩包裹”结构从日益复杂的 3D 结构生成机械超材料，首先是简单的（凸）多面体；然后，使用任意数量的顶点进行设计，并使用构造实体几何 (CSG) 和 3D 扫描进行设计；最终，从手机摄像头拍摄的视频中生成 3D 对象，使现实世界中设计或发现的任何对象或几何结构都可以转化为机械超材料。我们证明，这些整体式拉胀结构仍然可以通过增材制造技术轻松进行 3D 打印。我们预计这种设计任意复杂机械超材料结构的分段方法可以实现许多潜在的应用，在这些应用中，需要在整个 3D 几何形状中进行可编程内部重新配置和/或力重定向。", "authors": [{"name": "Fnu Braminder"}, {"name": "Issac Varghese"}, {"name": "Noah Kim"}, {"name": "Alyssa Thomas DeCruz"}, {"name": "Eric A. Josephs"}], "featured_authors": [{"name": "Fnu Braminder"}, {"name": "Issac Varghese"}, {"name": "Noah Kim"}, {"name": "Alyssa Thomas DeCruz"}, {"name": "Eric A. Josephs"}], "author_count": 5}, {"id": "2609.31831", "category": "cond-mat", "title": "Emergent low-energy many-body Hilbert spaces in Chern bands", "abstract": "We show that in Landau levels and more generic Chern bands, the most relevant many-body subspace selected by realistic two-body interactions alone (e.g., in the limit of vanishing bandwidth and band gap) depends strongly on the particle density and can be constructed systematically. Using the well-defined hierarchical structure of conformal Hilbert spaces (CHS), each with a highest-density vacuum state, we compute, for both fermionic and bosonic systems, the many-body quantum metric that quantifies the interaction energy scales of these subspaces. For a large family of short-range, Coulomb-based interactions, particles preferentially occupy the many-body states in the smallest accommodating CHS. This allows us to describe the low-energy physics of the interacting system in terms of the appropriate anyonic degrees of freedom. Our results also explain why, in any Chern band (in lattice or continuum systems), band mixing tends to be suppressed even in the limit of strong interaction; this suppression is stronger when the band deviates less from the ideal trace condition and when the two-body interaction is shorter-ranged.", "url": "https://arxiv.org/abs/2609.31831", "type": "理论", "summary": "我们表明，在朗道能级和更通用的陈能带中，仅通过现实的二体相互作用（例如，在带宽和带隙消失的限制下）选择的最相关的多体子空间在很大程度上取决于粒子密度，并且可以系统地构建。使用共形希尔伯特空间（CHS）的明确定义的层次结构（每个空间都具有最高密度的真空态），我们为费米子和玻色子系统计算了量化这些子空间的相互作用能尺度的多体量子度量。对于一大类基于库仑的短程相互作用，粒子优先占据最小可容纳 CHS 中的多体态。这使我们能够用适当的任意子自由度来描述相互作用系统的低能物理。我们的结果还解释了为什么在任何陈能带（晶格或连续系统）中，即使在强相互作用的极限下，能带混合也往往会受到抑制；当能带偏离理想迹线条件较小且两体相互作用范围较短时，这种抑制会更强。", "authors": [{"name": "Chen-Xin Jiang"}, {"name": "Zi-Xiang Hu"}, {"name": "Bo Yang"}], "featured_authors": [{"name": "Chen-Xin Jiang"}, {"name": "Zi-Xiang Hu"}, {"name": "Bo Yang"}], "author_count": 3}, {"id": "2609.31839", "category": "cond-mat", "title": "Zoology of chiral superconductors in Chern bands", "abstract": "Evidence for chiral superconductivity has recently been observed in several van der Waals systems including rhombohedral multilayer graphene and twisted bilayer MoTe$_2$. In the latter, superconductivity emerges at carrier densities near a fractional Chern insulator. This raises the question of what kinds of superconductors may emerge in a system of electrons in a topological band with strong repulsive interactions. Here, we adapt the target-phase optimization method to search for chiral superconductors in a minimal model of interacting electrons in a Chern band. We construct a differentiable loss function for superconductors from the sign oscillation of the pair-binding energy and combine gradient-based optimization with a rigorous screening procedure to identify and characterize superconductors. Applying this framework within exact diagonalization to spinless electrons in periodically modulated Landau levels with screened Coulomb interactions, we uncover a broad family of chiral superconducting phases. At filling $\\nu=2/3$, we recover the previously identified $f-\\mathrm{i} f$ hole superconductors and find additional $p\\pm \\mathrm{i} p$ and $f+\\mathrm{i} f$ superconductors of both electrons and holes, occurring near and far from the limit of ideal quantum geometry. At $\\nu=1/2$, we identify $p- \\mathrm{i} p$ electron and $f-\\mathrm{i} f$ hole superconductors and find, for the first time, a direct transition between chiral superconductors and composite Fermi liquids. Our results reveal that chiral superconductivity in Chern bands comprises a diverse landscape of competing pairing instabilities and establish target-phase optimization as a general strategy for searching for quantum phases in complex interacting systems.", "url": "https://arxiv.org/abs/2609.31839", "type": "理论+数值", "summary": "最近在几种范德华系统中观察到了手性超导的证据，包括菱面体多层石墨烯和扭曲双层 MoTe$_2$。在后者中，超导性在分数陈绝缘体附近的载流子密度下出现。这就提出了一个问题：在具有强排斥相互作用的拓扑带中的电子系统中可能会出现什么样的超导体。在这里，我们采用目标相优化方法在陈能带相互作用电子的最小模型中搜索手性超导体。我们根据对结合能的符号振荡构建了超导体的可微损失函数，并将基于梯度的优化与严格的筛选程序相结合来识别和表征超导体。将这个框架应用到具有屏蔽库仑相互作用的周期性调制朗道能级中的无自旋电子的精确对角化中，我们发现了一系列广泛的手性超导相。\n\n在填充 $\\nu=2/3$ 时，我们恢复了先前识别的 $f-\\mathrm{i} f$ 空穴超导体，并找到了电子和空穴的附加 $p\\pm \\mathrm{i} p$ 和 $f+\\mathrm{i} f$ 超导体，这些超导体出现在接近和远离理想量子几何极限的地方。在$\\nu=1/2$处，我们识别出$p- \\mathrm{i} p$电子和$f-\\mathrm{i} f$空穴超导体，并首次发现手性超导体和复合费米液体之间的直接跃迁。我们的结果表明，陈能带中的手性超导性包含竞争配对不稳定性的多样化景观，并将目标相优化建立为在复杂相互作用系统中搜索量子相的一般策略。", "authors": [{"name": "André Grossi Fonseca"}, {"name": "Aidan Reddy"}, {"name": "Ahmed Abouelkomsan"}, {"name": "Liang Fu"}, {"name": "Marin Soljačić"}], "featured_authors": [{"name": "André Grossi Fonseca"}, {"name": "Aidan Reddy"}, {"name": "Ahmed Abouelkomsan"}, {"name": "Liang Fu"}, {"name": "Marin Soljačić"}], "author_count": 5}, {"id": "2609.31872", "category": "cond-mat", "title": "Connecting finite-size scaling and renormalization-group flows in Anderson localization on random graphs", "abstract": "We investigate the relation between two complementary descriptions of the Anderson transition on small-world random graphs: finite-size scaling of eigenfunction moments and renormalization-group (RG) flows of multifractal dimensions $D_q$. The RG flows recover the qualitative structure previously reported for the information dimension $D_1$, while their extension to other $D_q$ with smaller moment orders $q<1/2$ confirms the strongly multifractal nature of the localized phase characterized by a clear separation between multifractal and localized behaviors at strong disorder. On the other hand, we show that we can construct another beta function characterizing the flow of eigenfunction moments, whose collapse onto a single function across different disorder strengths provides a clear confirmation of single-parameter scaling property. These results indicate that the family of RG trajectories observed for the information dimension $D_1$ need not imply two-parameter scaling and Kosterlitz-Thouless like critical behavior. To characterize these properties, one should consider different observables, such as large $q>1/2$ and small $q<1/2$ eigenfunction moments, which are associated with distinct critical behaviors, in particular different critical exponents.", "url": "https://arxiv.org/abs/2609.31872", "type": "理论+数值", "summary": "我们研究了小世界随机图上安德森转变的两种互补描述之间的关系：本征函数矩的有限尺寸缩放和多重分形维度 $D_q$ 的重正化群 (RG) 流。 RG 流恢复了先前报告的信息维度 $D_1$ 的定性结构，而它们扩展到具有较小矩阶 $q<1/2$ 的其他 $D_q$ 证实了局部相的强多重分形性质，其特征在于多重分形和强无序下的局部行为之间的明显分离。另一方面，我们证明我们可以构造另一个表征特征函数矩流的 beta 函数，其在不同无序强度下崩溃到单个函数上，为单参数缩放特性提供了明确的确认。这些结果表明，针对信息维度 $D_1$ 观察到的 RG 轨迹系列不一定意味着二参数缩放和 Kosterlitz-Thouless 等关键行为。\n\n为了表征这些属性，应该考虑不同的可观察量，例如大的 $q>1/2$ 和小的 $q<1/2$ 特征函数矩，它们与不同的关键行为相关，特别是不同的关键指数。", "authors": [{"name": "Ignacio García-Mata"}, {"name": "Weitao Chen"}, {"name": "John Martin"}, {"name": "Bertrand Georgeot"}, {"name": "Gabriel Lemarié"}], "featured_authors": [{"name": "Ignacio García-Mata"}, {"name": "Weitao Chen"}, {"name": "John Martin"}, {"name": "Bertrand Georgeot"}, {"name": "Gabriel Lemarié"}], "author_count": 5}, {"id": "2609.31895", "category": "cond-mat", "title": "The Young-E(3) Tensor Product Decomposition for Rotation and Permutation Equivariant Cluster Expansions", "abstract": "A generalization of fixed-lattice cluster expansions (CE) and atomic cluster expansions (ACE) is presented that expresses both rotation and permutation symmetries. By performing Schur--Weyl decomposition in Young subgroup-stabilized carriers, followed by joint coupling of rotation and permutation representations, arbitrary $S_N\\times SO(3)$ tensor product carriers are generated. This allows us to resolve complete, orthonormal joint rotation and permutation-adapted bases for arbitrary tensor product ranks and arbitrary angular and radial tensor product content. We show that this very general Young--E(3) (YE3T) tensor product basis contains the ACE basis as a subset, corresponding to the special case where permutation symmetry character is restricted to the fully symmetric carrier. Rather than constructing an overcomplete rotation and permutation-invariant basis and reducing it \\textit{a posteriori}, Barthelemy \\textit{et al.} recently demonstrated scaling benefits by not constructing an overcomplete basis. YE3T directly produces a complete orthonormal basis without an overcomplete step and rigorously extends to permutation characters beyond permutation-symmetric features. The YE3T decomposition yields new joint irreducible rotation- and permutation-equivariant basis sets that surpass existing rotation-adapted expansions in both speed and accuracy, defining a new Pareto front for machine-learned interatomic potentials. We show that the tunability of the permutation symmetry character makes the basis useful for both atomistic and electronic-structure simulations.", "url": "https://arxiv.org/abs/2609.31895", "type": "理论+数值", "summary": "提出了固定晶格簇展开（CE）和原子簇展开（ACE）的推广，表达了旋转和排列对称性。通过在Young子群稳定载流子中进行Schur--Weyl分解，然后联合耦合旋转和置换表示，生成任意$S_N\\times SO(3)$张量积载流子。这使我们能够解析任意张量积等级以及任意角度和径向张量积内容的完整的、正交的联合旋转和置换适应基。我们证明了这个非常通用的 Young--E(3) (YE3T) 张量积基包含 ACE 基作为子集，对应于排列对称性仅限于完全对称载波的特殊情况。 Barthelemy \\textit{et al.} 最近证明了通过不构造一个过完备的基础来实现扩展的好处，而不是构建一个过完备的旋转和排列不变的基础并减少它 \\textit{a 后验}。 YE3T 直接生成完整的正交基，无需超完备步骤，并严格扩展到排列对称特征之外的排列字符。\n\nYE3T 分解产生了新的联合不可约旋转和排列等变基组，在速度和精度上都超越了现有的旋转自适应展开，为机器学习的原子间势定义了新的帕累托前沿。我们证明了排列对称性的可调性使得该基础对于原子和电子结构模拟都很有用。", "authors": [{"name": "James M. Goff"}, {"name": "Aidan P. Thompson"}], "featured_authors": [{"name": "James M. Goff"}, {"name": "Aidan P. Thompson"}], "author_count": 2}, {"id": "2609.32059", "category": "cond-mat", "title": "Magnetic Q-balls", "abstract": "We study charged soliton branches in quasi-one-dimensional chiral magnetic systems with Dzyaloshinskii--Moriya (DM) interaction, easy-axis anisotropy, and Zeeman coupling. The same static magnetic functional is equipped with two different dynamical completions: an antiferromagnetic model with second-order time derivatives and a ferromagnetic model with Berry-phase dynamics. On the helical branch selected by the static DM interaction, the problem reduces to an analytically tractable one-dimensional system for the polar angle of the order parameter. We derive the existence conditions for polar Q-balls from the curvature of the reduced effective potential and the presence of a nonzero turning point. In the antiferromagnetic case, the allowed frequency window is symmetric and can be completely closed by the combined effect of the DM coupling and the Zeeman field. At zero Zeeman field, the same reduction also supports antiferromagnetic Q-kinks, for which we obtain explicit profiles, charges, energies, and reduced-sector fission criteria. In the ferromagnetic case, the Berry phase makes the rotation frequency act as a shifted Zeeman field. As a result, north- and south-pole charged droplets are selected by opposite signs of the shifted rotation. We also show that a formal pole-to-pole solution of the ferromagnetic mechanical problem does not generally correspond to a finite-energy magnetic soliton, because the Berry term does not renormalize the physical Hamiltonian. These results clarify how charged-soliton mechanisms depend on the underlying magnetic dynamics, even when the static chiral energy is the same.", "url": "https://arxiv.org/abs/2609.32059", "type": "理论", "summary": "我们利用 Dzyaloshinskii-Moriya (DM) 相互作用、易轴各向异性和塞曼耦合研究准一维手性磁系统中的带电孤子分支。相同的静磁泛函配备了两种不同的动力学完成：具有二阶时间导数的反铁磁模型和具有贝里相动力学的铁磁模型。在静态 DM 相互作用选择的螺旋分支上，问题简化为有序参数极角的可分析处理的一维系统。我们从有效电势降低的曲率和非零转折点的存在推导出极性 Q 球的存在条件。在反铁磁情况下，允许的频率窗口是对称的，并且可以通过DM耦合和塞曼场的综合作用完全关闭。在零塞曼场下，同样的简化还支持反铁磁 Q 扭结，为此我们获得了明确的剖面、电荷、能量和简化扇区裂变准则。在铁磁情况下，贝里相使旋转频率充当移位的塞曼场。\n\n结果，北极和南极带电液滴通过旋转移动的相反符号被选择。我们还表明，铁磁机械问题的形式极对极解通常不对应于有限能量磁孤子，因为贝里项不会重整物理哈密顿量。这些结果阐明了带电孤子机制如何依赖于潜在的磁动力学，即使静态手性能量相同。", "authors": [{"name": "A.J. Balseyro Sebastian"}, {"name": "Keisuke Ohashi"}, {"name": "Muneto Nitta"}], "featured_authors": [{"name": "A.J. Balseyro Sebastian"}, {"name": "Keisuke Ohashi"}, {"name": "Muneto Nitta"}], "author_count": 3}, {"id": "2609.32080", "category": "cond-mat", "title": "Odd stochastic density functional theory", "abstract": "Stochastic density functional theory (SDFT) provides a powerful framework for studying the dynamics of many-body systems both in and out of equilibrium. In its standard form, it can be viewed as a density-based formulation of coupled Langevin equations with white noise. Here, we extend SDFT to a class of systems, ranging from magnetized electrolytes to chiral active matter, that possess a chiral overdamped limit in which a relaxation timescale and an oscillation period are simultaneously taken to zero. We derive this formulation, which we dub ``odd SDFT\", by taking the overdamped limit of a fluctuating hydrodynamic description of underdamped particles subject to a Lorentz force. We establish the validity and utility of the resulting framework by calculating the collective mobility tensor of interacting particles using both direct linear response and a Green-Kubo relation. We then apply the theory to the Hall conductivity of electrolytes in magnetic fields. Going beyond mean-field theory and using two distinct Green-Kubo relations, we derive the full conductivity tensor, extending the relaxation part of the Debye-Hückel-Onsager theory to the case of finite magnetic fields.", "url": "https://arxiv.org/abs/2609.32080", "type": "理论+数值", "summary": "随机密度泛函理论 (SDFT) 为研究平衡态和非平衡态多体系统的动力学提供了强大的框架。在其标准形式中，它可以被视为具有白噪声的耦合朗之万方程的基于密度的公式。在这里，我们将 SDFT 扩展到一类系统，从磁化电解质到手性活性物质，这些系统具有手性过阻尼极限，其中弛豫时间尺度和振荡周期同时为零。我们通过采用受洛伦兹力影响的欠阻尼粒子的波动流体动力学描述的过阻尼极限，推导出了这个公式，我们将其称为“奇 SDFT”。我们通过使用直接线性响应和 Green-Kubo 关系计算相互作用粒子的集体迁移率张量，建立了所得框架的有效性和实用性。然后，我们将该理论应用于磁场中电解质的霍尔电导率。超越平均场理论并使用两种不同的 Green-Kubo 关系，我们推导出完整的电导率张量，将 Debye-Hückel-Onsager 理论的弛豫部分扩展到有限磁场的情况。", "authors": [{"name": "Yael Avni"}, {"name": "Michel Fruchart"}, {"name": "David Martin"}, {"name": "Tali Khain"}, {"name": "Vincenzo Vitelli"}], "featured_authors": [{"name": "Yael Avni"}, {"name": "Michel Fruchart"}, {"name": "David Martin"}, {"name": "Tali Khain"}, {"name": "Vincenzo Vitelli"}], "author_count": 5}, {"id": "2609.32266", "category": "cond-mat", "title": "Symmetry-permuting entanglers for non-invertible symmetry-protected topological phases", "abstract": "1+1D symmetry-protected topological (SPT) phases with invertible symmetry can be characterized by the symmetric entanglers: globally symmetric finite-depth local unitary circuits that generate representative ground states from a product state. For non-invertible symmetries, however, distinct SPT phases, such as the three $\\mathrm{Rep}(D_8)$ SPT phases, may not be connected by any symmetric entangler. We show that the three $\\mathrm{Rep}(D_8)$ SPT phases can nevertheless be connected by \\emph{symmetry-permuting} finite-depth local unitary circuits, realizing dualities predicted by topological quantum field theory (TQFT). We construct an explicit matrix product unitary connecting two of the $\\mathrm{Rep}(D_8)$ SPT phases, and show that its action on string order parameters reproduces the anyon permutation predicted by the TQFT duality.", "url": "https://arxiv.org/abs/2609.32266", "type": "理论", "summary": "具有可逆对称性的 1+1D 对称保护拓扑 (SPT) 相可以通过对称纠缠器来表征：全局对称的有限深度局部酉电路，从乘积态生成代表性基态。然而，对于不可逆对称性，不同的 SPT 相，例如三个 $\\mathrm{Rep}(D_8)$ SPT 相，可能不会由任何对称纠缠器连接。我们证明，三个 $\\mathrm{Rep}(D_8)$ SPT 相仍然可以通过 \\emph{symmetry-permuting} 有限深度局部酉电路连接，实现拓扑量子场论（TQFT）预测的对偶性。我们构建了一个连接两个 $\\mathrm{Rep}(D_8)$ SPT 相的显式矩阵乘积酉，并表明其对串序参数的作用再现了 TQFT 对偶性预测的任意子排列。", "authors": [{"name": "Minyoung You"}], "featured_authors": [{"name": "Minyoung You"}], "author_count": 1}, {"id": "2609.32314", "category": "cond-mat", "title": "Continuously varying exponents in the distribution of waiting times in the symmetric exclusion process on a percolation cluster", "abstract": "We study the waiting-time distribution of hard-core interacting particles in the symmetric exclusion process on one- and two-dimensional lattices with side branches attached to each lattice site in the steady state. We use numerical simulations together with an approximate analytical treatment of particles trapped in side branches in the steady state. Such a two-dimensional carpet serves as a simplified model for trapping of a supercritical percolation cluster. At high particle densities, the system exhibits strong dynamical heterogeneity, with the distribution of logarithms of waiting times developing well-separated peaks corresponding to particles trapped at different depths from the backbone. We show that the probability that a tagged particle occupies the same position at time $t_0+t$ as at time $t_0$ decays algebraically as $t^{-\\omega}$, where the exponent $\\omega$ varies continuously with particle density for densities above a threshold value $\\rho^*<1$. We also investigate the correlations between successive waiting times along the trajectory of a tagged particle.", "url": "https://arxiv.org/abs/2609.32314", "type": "理论+数值", "summary": "我们研究了一维和二维晶格的对称排斥过程中硬核相互作用粒子的等待时间分布，在稳态下，侧枝附着在每个晶格位置上。我们使用数值模拟以及对稳态下被困在侧枝中的粒子进行近似分析处理。这种二维地毯用作捕获超临界渗滤簇的简化模型。在高颗粒密度下，系统表现出很强的动态异质性，等待时间的对数分布形成了与主干不同深度处捕获的颗粒相对应的分离良好的峰值。我们表明，标记粒子在时间 $t_0+t$ 与时间 $t_0$ 占据相同位置的概率以代数方式衰减为 $t^{-\\omega}$，其中指数 $\\omega$ 随粒子密度连续变化，密度高于阈值 $\\rho^*<1$。我们还研究了沿着标记粒子轨迹的连续等待时间之间的相关性。", "authors": [{"name": "Arpan Chatterjee"}, {"name": "Kabir Ramola"}, {"name": "Deepak Dhar"}], "featured_authors": [{"name": "Arpan Chatterjee"}, {"name": "Kabir Ramola"}, {"name": "Deepak Dhar"}], "author_count": 3}, {"id": "2609.32372", "category": "cond-mat", "title": "Helicity-Controlled Hall Transport in Hybrid Topological Magnetic Textures", "abstract": "Topological magnetic textures can serve as information carriers driven by spin currents. However, their motion is generally accompanied by a Hall effect that deflects them from the current direction, limiting transport efficiency and controllability. We develop a unified spin-space transformation framework enabling a systematic study of hybrid spin textures with different helicities, such as skyrmions, antiskyrmions, bimerons, and antibimerons. Combining analytical theory with micromagnetic simulations, we establish the relation between helicity and current-driven transport. An analytical solution of the generalized Thiele equation identifies helicity as a geometric control parameter and yields a simple expression for the Hall angle, enabling its continuous tuning, complete suppression, and deterministic steering along arbitrary in-plane directions. Micromagnetic simulations confirm that the generated spin textures remain stable under Landau--Lifshitz--Gilbert dynamics and validate the analytical predictions. These results establish helicity as a versatile control parameter for programmable transport of topological magnetic textures.", "url": "https://arxiv.org/abs/2609.32372", "type": "理论+数值", "summary": "拓扑磁性纹理可以作为自旋电流驱动的信息载体。然而，它们的运动通常伴随着霍尔效应，使它们偏离当前方向，限制了传输效率和可控性。我们开发了一个统一的自旋空间变换框架，能够系统地研究具有不同螺旋度的混合自旋纹理，例如斯格明子、反斯格明子、双聚体和反双聚体。将分析理论与微磁模拟相结合，我们建立了螺旋度与电流驱动输运之间的关系。广义蒂勒方程的解析解将螺旋度识别为几何控制参数，并生成霍尔角的简单表达式，从而实现其沿任意面内方向的连续调谐、完全抑制和确定性转向。微磁模拟证实，生成的自旋纹理在朗道-利夫希茨-吉尔伯特动力学下保持稳定，并验证了分析预测。这些结果将螺旋度确立为拓扑磁性纹理可编程传输的通用控制参数。", "authors": [{"name": "Anton V. Hlushchenko"}, {"name": "Julia Kharlan"}, {"name": "Mykhailo I. Bratchenko"}, {"name": "Aleksei V. Chechkin"}, {"name": "Jarosław W. Kłos"}, {"name": "Oleg A. Tretiakov"}], "featured_authors": [{"name": "Anton V. Hlushchenko"}, {"name": "Julia Kharlan"}, {"name": "Mykhailo I. Bratchenko"}, {"name": "Aleksei V. Chechkin"}, {"name": "Jarosław W. Kłos"}, {"name": "Oleg A. Tretiakov"}], "author_count": 6}, {"id": "2609.32392", "category": "cond-mat", "title": "Electrically switchable one-dimensional quadrupolar excitons in lateral double heterojunctions", "abstract": "Two neighboring lateral interfaces provide a spatial degree of freedom for controlling one-dimensional charge-transfer excitons within a single semiconductor monolayer. We investigate a type-II WS2-MoS2-WS2 double heterojunction using an effective-mass two-particle Hamiltonian with a screened Coulomb interaction. For equivalent left and right interfaces at zero electric field,inter-interface coupling produces energetically split even- and odd-parity exciton states, each with zero permanent dipole. An electric field perpendicular to the interfaces continuously converts the lower state from a quadrupolar superposition with a quadratic Stark shift into a predominantly single-interface dipolar exciton with an approximately linear shift. The spatially resolved calculation gives binding energies of approximately 104 and 100 meV, a doublet splitting of 4.6 meV, and a crossover field of 0.87 V/um for a representative 1.5-nm MoS2 strip. Projection tests show that the lowest doublet controls the response near this crossover. Strip width tunes the coupling much more strongly than the binding energy, providing geometric control of the low-field Stark sensitivity. These results establish a continuum-model route to electrically reconfigurable one-dimensional quadrupolar excitons.", "url": "https://arxiv.org/abs/2609.32392", "type": "理论+数值", "summary": "两个相邻的横向界面提供了用于控制单个半导体单层内的一维电荷转移激子的空间自由度。我们使用具有屏蔽库仑相互作用的有效质量双粒子哈密顿量研究 II 型 WS2-MoS2-WS2 双异质结。对于零电场下等效的左右界面，界面间耦合产生能量分裂的偶奇偶校验激子态，每个激子态具有零永久偶极子。垂直于界面的电场连续地将较低态从具有二次斯塔克位移的四极叠加转变为具有近似线性位移的主要单界面偶极激子。空间分辨计算得出代表性 1.5 nm MoS2 条带的结合能约为 104 和 100 meV，双峰分裂为 4.6 meV，交叉场为 0.87 V/um。投影测试表明最低的双峰控制该交叉附近的响应。带宽度对耦合的调节比对结合能的调节要强得多，从而提供低场斯塔克灵敏度的几何控制。\n\n这些结果建立了电可重构一维四极激子的连续介质模型路线。", "authors": [{"name": "Ryo Kitaura"}], "featured_authors": [{"name": "Ryo Kitaura"}], "author_count": 1}, {"id": "2609.32605", "category": "cond-mat", "title": "Dense auto-hetero associative memories applied to noisy communication channels", "abstract": "Networks of interacting Hebbian networks have recently been shown to perform a task beyond associative memory, namely \\emph{pattern disentanglement}: when fed with a spurious mixture of stored patterns, the different modules spontaneously specialize on, and retrieve, the different constituents of the mixture. So far, this capability has only been established for pairwise interactions, which limits the number of patterns that can be handled. Here we introduce a dense extension of these modular networks, in which both the auto-associative couplings within each module and the hetero-associative couplings among modules are promoted to higher-order Hebbian interactions. We show that, with a suitable choice of the interaction orders, the network disentangles mixtures while storing a number of patterns that scales linearly with the module size, a regime where its pairwise counterpart fails. Through a statistical-mechanical analysis based on Guerra's interpolation, we derive the self-consistency equations for the order parameters and draw the phase diagrams identifying the region where disentanglement is achieved; these predictions are confirmed by Monte Carlo simulations. Finally, we show that disentanglement provides a natural decoding primitive, and we illustrate it with two applications: the explicit reconstruction of all the hidden patterns from the Hebbian tensors and a stream of unlabeled mixtures, and a proof-of-concept communication protocol in which each message token is transmitted as a masked mixture of hidden patterns and decoded by the network dynamics. Owing to its attractor-based decoding, the protocol degrades gracefully under strong channel corruption, where conventional secure-transmission pipelines fail abruptly.", "url": "https://arxiv.org/abs/2609.32605", "type": "理论+数值", "summary": "相互作用的赫布网络最近被证明可以执行超出联想记忆的任务，即 \\emph{模式解缠}：当输入存储模式的虚假混合物时，不同的模块会自发地专门研究并检索该混合物的不同成分。到目前为止，此功能仅针对成对交互建立，这限制了可以处理的模式数量。在这里，我们引入了这些模块化网络的密集扩展，其中每个模块内的自关联耦合和模块之间的异关联耦合都被提升为高阶赫布交互。我们表明，通过选择合适的交互顺序，网络可以解开混合物，同时存储大量随模块大小线性缩放的模式，而在这种情况下，其成对对应物会失败。通过基于 Guerra 插值的统计力学分析，我们推导出序参数的自洽方程，并绘制相图来识别实现解缠结的区域；这些预测得到了蒙特卡罗模拟的证实。\n\n最后，我们证明解缠结提供了一种自然解码原语，并用两个应用来说明它：从赫布张量和未标记混合物流中显式重建所有隐藏模式，以及概念验证通信协议，其中每个消息令牌作为隐藏模式的屏蔽混合进行传输并由网络动态进行解码。由于其基于吸引子的解码，该协议在严重的通道损坏（传统的安全传输管道突然失败）下会优雅地降级。", "authors": [{"name": "Elena Agliari"}, {"name": "Andrea Alessandrelli"}, {"name": "Adriano Barra"}, {"name": "Alberto Fachechi"}], "featured_authors": [{"name": "Elena Agliari"}, {"name": "Andrea Alessandrelli"}, {"name": "Adriano Barra"}, {"name": "Alberto Fachechi"}], "author_count": 4}, {"id": "2609.32633", "category": "cond-mat", "title": "GEM: An implementation of the ghost-Gutzwiller approximation for simulating interacting quantum systems", "abstract": "We present GEM (Ghost Embedding Method) from the title here, an open-source software package written in Python for computing equilibrium properties of strongly correlated electronic systems within the ghost-Gutzwiller approximation method. GEM provides a computationally efficient framework for studying multi-orbital lattice models. It supports zero- and finite-temperature calculations and symmetry broken phases. It is integrated with the TRIQS ecosystem, providing tools for model construction, self-consistent solution, and evaluation of physical observables. We first detail the method's theoretical formulation, then we present the software architecture, and finally we introduce some practical workflow, which also validates the implementation against established results. In particular, we illustrate the capabilities of GEM through multiorbital and finite-temperature applications and discuss its computational cost relative to more demanding quantum embedding approaches.", "url": "https://arxiv.org/abs/2609.32633", "type": "理论+数值", "summary": "我们从这里的标题中介绍 GEM（幽灵嵌入方法），这是一个用 Python 编写的开源软件包，用于在幽灵-古茨威勒近似方法中计算强相关电子系统的平衡特性。 GEM 为研究多轨道晶格模型提供了一个计算高效的框架。它支持零温度和有限温度计算以及对称破缺相位。它与 TRIQS 生态系统集成，提供模型构建、自洽解决方案和物理可观测值评估的工具。我们首先详细介绍该方法的理论公式，然后介绍软件架构，最后介绍一些实际的工作流程，这也根据既定结果验证了实施。特别是，我们通过多轨道和有限温度应用说明了 GEM 的功能，并讨论了其相对于要求更高的量子嵌入方法的计算成本。", "authors": [{"name": "Samuele Giuli"}, {"name": "Tsung-Han Lee"}, {"name": "Yong-Xin Yao"}, {"name": "Ina Park"}, {"name": "Harrison LaBollita"}, {"name": "Ivan Pasqua"}, {"name": "Nicola Lanatà"}, {"name": "Olivier Gingras"}], "featured_authors": [{"name": "Samuele Giuli"}, {"name": "Tsung-Han Lee"}, {"name": "Yong-Xin Yao"}, {"name": "Ivan Pasqua"}, {"name": "Nicola Lanatà"}, {"name": "Olivier Gingras"}], "author_count": 8}, {"id": "2609.32768", "category": "cond-mat", "title": "Trimers, pairs and localisation on disordered random graphs", "abstract": "Higher-order networks take group interactions as given. I ask what happens when a group interaction is made by pairwise dynamics on a graph, and follow it through the transition that decides whether it matters at large scale, Anderson localisation. An emergent hyperedge is a $k$-body bound state of a Hamiltonian whose terms live on the vertices and edges of the graph, Borromean when none of its $(k-1)$-body faces is bound, detected on a finite graph by a $k$-fold coincidence that survives the thermodynamic limit while the $(k-1)$-fold ones vanish. Sparse random graphs produce one from the simplest pairwise dynamics: three distinguishable particles with on-site attraction $U$ and hopping $t$ bind into a trimer before any pair binds. The thresholds are obtained on the Bethe lattice, in closed form for the pair, in both sectors that an expander graph has and a lattice lacks, the one a condensate sees and the one a Fermi liquid sees. On a disordered graph the emergent hyperedges nucleate on rare deep sites and localise before their parts: the compact trimer, with a narrow band and a threefold sensitivity to site energies, undergoes the Anderson transition at a disorder of $1.6t$, against $17t$ for a single particle and $4t$ for a pair, and the Fermi liquid of trimers is a glass above a line between $1.5t$ and $1.7t$, where a liquid of single particles at the same density needs $15t$ to $16t$. The transition is the single-particle cavity transition with the composite's hopping and effective disorder. A group interaction made by pairwise dynamics is an order of magnitude more fragile to heterogeneity than the network that makes it.", "url": "https://arxiv.org/abs/2609.32768", "type": "理论", "summary": "高阶网络将群体交互视为给定的。我问当群体互动是通过图表上的成对动力学进行时会发生什么，并通过决定它在大规模上是否重要的​​转变（安德森本地化）来跟踪它。紧急超边是哈密顿量的 $k$ 体束缚状态，其项存在于图的顶点和边上，当其 $(k-1)$ 体面都没有被束缚时，博罗米安在有限图上通过 $k$ 重合检测到，该巧合在热力学极限下幸存下来，而 $(k-1)$ 重合消失。稀疏随机图从最简单的成对动力学中产生一个：三个具有现场吸引力 $U$ 和跳跃 $t$ 的可区分粒子在任何对结合之前结合成三聚体。阈值是在贝特晶格上以封闭形式获得的，在扩展图具有而晶格缺乏的两个扇区中，即凝聚态看到的扇区和费米液体看到的扇区。\n\n在无序图上，新兴的超边在罕见的深位点上成核，并在其部分之前定位：紧凑的三聚体，具有窄带和对位点能量的三倍敏感性，在 $1.6t$ 的无序度下经历安德森跃迁，单个粒子为 $17t$，一对为 $4t$，三聚体的费米液体是 $1.5t$ 和 $1.7t$ 之间线上方的玻璃，其中单粒子液体在相同的密度需要$15t$到$16t$。该转变是单粒子空腔转变，具有复合材料的跳跃和有效无序。由成对动力学产生的群体相互作用比产生这种相互作用的网络更容易受到异质性的影响。", "authors": [{"name": "Alexei Vazquez"}], "featured_authors": [{"name": "Alexei Vazquez"}], "author_count": 1}, {"id": "2609.32858", "category": "cond-mat", "title": "Improved Learning of Molecular Energetics Through an Electron-Wise Joint Charge Density and Energy Objective", "abstract": "We present a graph neural network-based learning framework trained to jointly predict electron densities and molecular energies. The model is trained to predict electron densities calculated with a Generalized Gradient Approximation (GGA) functional while simultaneously learning to predict molecular energies obtained with hybrid functional calculations at the B3LYP level of theory. Our results indicate that the rich spatial information in electron density distribution can be used to improve and accelerate the learning of accurate energies. By sharing an equivariant molecular representation across density and energy prediction heads, the model learns complementary molecular quantities within a unified framework. This provides a new promising route for practical use cases of many recent charge density learning frameworks for atomic scale simulations.", "url": "https://arxiv.org/abs/2609.32858", "type": "理论+数值", "summary": "我们提出了一种基于图神经网络的学习框架，经过训练可以联合预测电子密度和分子能量。该模型经过训练，可以预测使用广义梯度近似 (GGA) 泛函计算的电子密度，同时学习预测在 B3LYP 理论水平上通过混合泛函计算获得的分子能量。我们的结果表明，电子密度分布中丰富的空间信息可用于改进和加速准确能量的学习。通过在密度和能量预测头之间共享等变的分子表示，该模型可以在统一的框架内学习互补的分子数量。这为许多最近用于原子尺度模拟的电荷密度学习框架的实际用例提供了一条新的有前途的途径。", "authors": [{"name": "Vadim Ionas"}, {"name": "Jonas Elsborg"}, {"name": "Felix Ærtebjerg"}, {"name": "Arghya Bhowmik"}], "featured_authors": [{"name": "Vadim Ionas"}, {"name": "Jonas Elsborg"}, {"name": "Felix Ærtebjerg"}, {"name": "Arghya Bhowmik"}], "author_count": 4}, {"id": "2609.32894", "category": "cond-mat", "title": "Composition-Driven Metal-to-Semiconductor Transition and Enhanced Phonon Transport in B-C substituted Clathrate", "abstract": "Establishing chemical design rules that simultaneously control the electronic structure and thermal transport is a long-sought goal for heat-management and energy materials. Here, we demonstrate that a single B-to-C substitution changes the electron count and simultaneously reconstructs the bonding network and crystal structure, driving a metal-to-semiconductor transition while concurrently enhancing the lattice thermal conductivity. Using density-functional theory (DFT) and machine-learned interatomic potentials (MLIPs), we investigate the electronic structure, lattice dynamics, and phonon thermal transport in cubic BaB3C3 and its B-to-C-substituted tetragonal BaB2C4 structure. The substitution donates one electron per formula unit to the B-C framework, thereby triggering the formation of strong C-C bonds and opening a bandgap of 0.33 eV. The Message Passing Atomic Cluster Expansion (MACE) model reproduces DFT energies and forces, yielding phonon dispersion and lattice thermal conductivity in excellent agreement with DFT benchmarks. Thermodynamically stable cubic BaB3C3 possesses an isotropic lattice thermal conductivity of 7.6 W/mK at 300 K. Substituting B with C hardens the phonon dispersion (evidenced by a frequency upshift from ~800 to ~900 cm^-1) and simultaneously boosts both phonon group velocities and lifetimes. Consequently, the lattice thermal conductivity surges to 18.7 W/mK, representing a remarkable ~2.5-fold enhancement of the in-plane component and a transformation from isotropic to anisotropic behavior, characterized by kappa_x = kappa_y > kappa_z. Our results demonstrate that minimal B-to-C substitution provides a viable strategy to modulate the electronic structure, thereby transforming the crystal from a metal to a semiconductor and concomitantly enhancing phonon thermal transport.", "url": "https://arxiv.org/abs/2609.32894", "type": "理论+数值", "summary": "建立同时控制电子结构和热传输的化学设计规则是热管理和能源材料长期追求的目标。在这里，我们证明了单个 B 到 C 的取代改变了电子数，同时重建了键合网络和晶体结构，驱动金属到半导体的转变，同时增强了晶格热导率。利用密度泛函理论 (DFT) 和机器学习原子间势 (MLIP)，我们研究了立方 BaB3C3 及其 B 到 C 取代的四方 BaB2C4 结构中的电子结构、晶格动力学和声子热传输。该取代将每个分子式单元提供一个电子至 B-C 框架，从而引发强 C-C 键的形成并打开 0.33 eV 的带隙。消息传递原子团簇展开 (MACE) 模型再现了 DFT 能量和力，产生与 DFT 基准完全一致的声子色散和晶格热导率。热力学稳定的立方 BaB3C3 在 300 K 时具有 7.6 W/mK 的各向同性晶格热导率。\n\n用 C 代替 B 会强化声子色散（频率从 ~800 cm^-1 上移到 ~900 cm^-1 证明），同时提高声子群速度和寿命。因此，晶格热导率飙升至 18.7 W/mK，代表面内分量显着增强了约 2.5 倍，并且从各向同性行为转变为各向异性行为，其特征为 kappa_x = kappa_y > kappa_z。我们的结果表明，最小的 B 到 C 的取代提供了一种可行的策略来调制电子结构，从而将晶体从金属转变为半导体，同时增强声子热传输。", "authors": [{"name": "Ghulam Hussain"}, {"name": "Dario Massa"}, {"name": "Rajibul Islam"}, {"name": "Magdalena Birowska"}, {"name": "Carmine Autieri"}, {"name": "Xiaoguang Li"}], "featured_authors": [{"name": "Ghulam Hussain"}, {"name": "Dario Massa"}, {"name": "Rajibul Islam"}, {"name": "Magdalena Birowska"}, {"name": "Carmine Autieri"}, {"name": "Xiaoguang Li"}], "author_count": 6}, {"id": "2609.32909", "category": "cond-mat", "title": "Parity-selected Bethe-Salpeter equation: symmetry-adapted regularization of the exciton-phonon self-energy in polar semiconductors", "abstract": "Finite-temperature Bethe-Salpeter calculations of exciton-phonon self-energies in polar materials are bottlenecked by the Fröhlich divergence of the intra-1s scattering vertex. We show that for a bound electron-hole pair this divergence is analytically eliminated by electron-hole interference: the intra-1s vertex admits the exact factorization $V_{\\mathrm{el}}(q)=q\\,\\mathcal G(q)$ with $\\mathcal G(0)\\propto(m_h-m_e)/(m_h+m_e)$, vanishing identically for equal masses (parity protection). A multipole interference factor $\\mathcal I_n=\\beta_e^{\\,n}-(-\\beta_h)^{n}$ determines where the singularity survives-only in dipole-allowed inter-state channels. We formulate a parity-selected truncation of the exciton-phonon self-energy in which the intra-1s channel is evaluated exactly at negligible cost, converging with $10^2$-$10^3$ fewer $q$-points. We find that the regularized intra-1s channel, previously obscured by numerical cutoffs, controls the temperature-dependent exciton shift in mass-asymmetric polar semiconductors.", "url": "https://arxiv.org/abs/2609.32909", "type": "理论+数值", "summary": "极性材料中激子-声子自能的有限温度 Bethe-Salpeter 计算受到 1s 内散射顶点的 Fröhlich 发散的瓶颈。我们证明，对于束缚电子空穴对，这种发散通过电子空穴干扰在分析上被消除：1s内顶点允许精确分解 $V_{\\mathrm{el}}(q)=q\\,\\mathcal G(q)$ 和 $\\mathcal G(0)\\propto(m_h-m_e)/(m_h+m_e)$，对于相等质量同样消失（宇称保护）。多极干扰因子 $\\mathcal I_n=\\beta_e^{\\,n}-(-\\beta_h)^{n}$ 决定奇点仅存在于偶极子允许的状态间信道中。我们制定了激子-声子自能的奇偶选择截断，其中 1s 内通道以可忽略不计的成本精确评估，收敛 $10^2$-$10^3$ 少 $q$ 点。我们发现，之前被数值截止所掩盖的正则化 1s 通道控制着质量不对称极性半导体中与温度相关的激子位移。", "authors": [{"name": "Michael O. Atambo"}], "featured_authors": [{"name": "Michael O. Atambo"}], "author_count": 1}, {"id": "2609.32947", "category": "cond-mat", "title": "Spin pumping reveals vortex-mediated angular-momentum dissipation at the superconducting transition", "abstract": "Spin pumping into superconductors is generally expected to become less efficient below the critical temperature $T_\\textrm{c}$ because quasiparticle transport freezes out. Here we report a pronounced enhancement of the spin pumping-induced magnetic damping in Py/Nb heterostructures, confined to a narrow temperature interval immediately below the superconducting transition. The damping exceeds its normal-state value and therefore cannot be explained within the conventional quasiparticle picture of spin transport. The enhancement coincides with the finite-resistance vortex-creep regime of the Nb layers and disappears upon cooling into the pinned vortex state, indicating that mobile Abrikosov vortices provide an additional channel for spin-angular-momentum dissipation. These results establish ferromagnetic resonance as a sensitive probe of dissipative vortex dynamics in superconductors.", "url": "https://arxiv.org/abs/2609.32947", "type": "理论", "summary": "通常预计进入超导体的自旋泵浦在低于临界温度 $T_\\textrm{c}$ 时效率会降低，因为准粒子传输会冻结。在这里，我们报告了 Py/Nb 异质结构中自旋泵浦引起的磁阻尼的显着增强，仅限于紧邻超导转变下方的狭窄温度区间。阻尼超过其正常状态值，因此无法在自旋输运的传统准粒子图像中进行解释。这种增强与 Nb 层的有限阻力涡旋蠕变状态一致，并在冷却到固定涡旋状态时消失，表明移动阿布里科索夫涡旋为自旋角动量耗散提供了额外的通道。这些结果确立了铁磁共振作为超导体耗散涡动力学的敏感探针。", "authors": [{"name": "Maximilian Mangold"}, {"name": "Alex Burg"}, {"name": "Franz Weidenhiller"}, {"name": "Thomas N.G. Meier"}, {"name": "Hiroto Adachi"}, {"name": "Lin Chen"}, {"name": "Christian Back"}], "featured_authors": [{"name": "Maximilian Mangold"}, {"name": "Alex Burg"}, {"name": "Franz Weidenhiller"}, {"name": "Hiroto Adachi"}, {"name": "Lin Chen"}, {"name": "Christian Back"}], "author_count": 7}, {"id": "2609.32951", "category": "cond-mat", "title": "Domain growth in lipid membranes and the budding instability", "abstract": "We investigate the growth of a circular domain in a phase-separating lipid membrane and its relation to the budding instability. We describe the in-plane dynamics with a conserved, time-dependent Ginzburg-Landau model under radial symmetry. Numerical solutions show a crossover of the domain size $D$ as a function of time $t$ from $D\\sim t^{1/3}$ at early times to $D\\sim t^{1/2}$ at later times, followed by saturation due to finite system size. The time-dependent line tension $\\sigma(t)$, evaluated from the evolving concentration profile, rises rapidly before approaching the planar-interface value. This behavior distinguishes an early line-tension-dominated regime from a later domain-size-dominated regime. To estimate the budding instability, we combine $D(t)$ and $\\sigma(t)$ with a quasistatic criterion for the loss of stability of a partially budded domain. The budding-instability time decreases with increasing membrane spontaneous curvature and increases near the critical point. Thus, the evolution of both domain size and line tension is essential for determining the time required for the budding instability.", "url": "https://arxiv.org/abs/2609.32951", "type": "理论+数值", "summary": "我们研究了相分离脂质膜中圆形结构域的生长及其与出芽不稳定性的关系。我们使用径向对称下的守恒、时间相关的 Ginzburg-Landau 模型来描述面内​​动力学。数值解显示域大小 $D$ 作为时间 $t$ 的函数从早期的 $D\\sim t^{1/3}$ 到后期的 $D\\sim t^{1/2}$ 交叉，随后由于系统大小有限而饱和。根据不断变化的浓度分布评估的与时间相关的线张力 $\\sigma(t)$ 在接近平面界面值之前迅速上升。这种行为将早期的线张力主导的机制与后来的域大小主导的机制区分开来。为了估计出芽的不稳定性，我们将 $D(t)$ 和 $\\sigma(t)$ 与部分出芽域稳定性损失的准静态标准结合起来。出芽不稳定时间随着膜自发曲率的增加而减少，并在临界点附近增加。因此，域尺寸和线张力的演变对于确定萌芽不稳定所需的时间至关重要。", "authors": [{"name": "Jean Wolff"}, {"name": "Fabrice Thalmann"}, {"name": "Carlos Marques"}, {"name": "David Andelman"}, {"name": "Haim Diamant"}, {"name": "Shigeyuki Komura"}], "featured_authors": [{"name": "Jean Wolff"}, {"name": "Fabrice Thalmann"}, {"name": "Carlos Marques"}, {"name": "David Andelman"}, {"name": "Haim Diamant"}, {"name": "Shigeyuki Komura"}], "author_count": 6}, {"id": "2609.32954", "category": "cond-mat", "title": "Impact of Phonon-Magnon Scattering on Thermal Transport across Antiferromagnetic and Ferromagnetic Oxides", "abstract": "Phonon--magnon coupling has been extensively studied in ferromagnets, whereas its microscopic mechanisms in antiferromagnets remain less understood. Here, we combine first-principles calculations with spin--lattice dynamics to investigate phonon--magnon interactions and their impact on thermal transport in antiferromagnetic NiO and MnO, which are put in contrast to the ferromagnetic EuO with an identical crystal structure. Green--Kubo and spectral energy density analyses show that spin dynamics reduce phonon thermal conductivity and lifetimes, with the strongest effects in MnO. Comparison of the excitation spectra indicates that spin-induced phonon scattering depends sensitively on the relative phonon and magnon energy scales, while the contrasting behavior of MnO and EuO further highlights the role of magnetic order. A simplified phase-space model further illustrates that, for comparable phonon and magnon energy scales, the antiferromagnetic case can support a larger phonon--magnon scattering phase space than the ferromagnetic case, suggesting a greater number of kinematically allowed scattering channels. These results identify excitation energy scales and magnetic order as key factors governing phonon--magnon scattering in magnetic materials.", "url": "https://arxiv.org/abs/2609.32954", "type": "理论+数值", "summary": "声子-磁振子耦合已在铁磁体中得到广泛研究，但其在反铁磁体中的微观机制仍知之甚少。在这里，我们将第一性原理计算与自旋晶格动力学相结合，研究声子-磁振子相互作用及其对反铁磁性 NiO 和 MnO 中热传输的影响，与具有相同晶体结构的铁磁性 EuO 进行对比。 Green--Kubo 和光谱能量密度分析表明，自旋动力学会降低声子热导率和寿命，其中对 MnO 的影响最强。激发光谱的比较表明，自旋引起的声子散射敏感地依赖于相对声子和磁振子的能量尺度，而MnO和EuO的对比行为进一步凸显了磁序的作用。简化的相空间模型进一步说明，对于可比的声子和磁振子能量尺度，反铁磁情况可以支持比铁磁情况更大的声子-磁振子散射相空间，这表明运动学上允许的散射通道的数量更多。\n\n这些结果将激发能尺度和磁序确定为控制磁性材料中声子-磁振子散射的关键因素。", "authors": [{"name": "Zeyu Xiang"}, {"name": "Bolin Liao"}], "featured_authors": [{"name": "Zeyu Xiang"}, {"name": "Bolin Liao"}], "author_count": 2}, {"id": "2609.32974", "category": "cond-mat", "title": "Physics-based logarithmic description of electrostatic field enhancement in hemisphere-on-cylindrical-post structures for high-field applications", "abstract": "Electrostatic (ES) field enhancement at sharp conducting structures plays a central role in lightning protection, corona discharge, electrical breakdown in vacuum (for example in particle accelerators), and more generally in technological applications of field electron emitters. A canonical geometry for studying this ES effect is the hemisphere-on-cylindrical-post (HCP) model, in the regime where the structure stands on a planar conductor of large lateral extent, and a large gap exists between the structure and the counter-electrode. A parameter of major interest is the apex field enhancement factor (AFEF) (apex-ES-field/background-ES-field). For this (and other) structures, a formula for the AFEF can be written in the form AFEF = ASC x ASR, where the apex sharpness ratio (ASR) is given by the ratio (post-height/apex-radius-of-curvature), and the apex sharpness coefficient (ASC) depends on the post shape. For the HCP model, no exact analytical formulas for the ASC or the AFEF are currently known. (Quite possibly none exist.) This paper develops a compact analytical approximation for the ASC and hence for the AFEF. This compact formula has a logarithmic-style structure, rather than the power-style structure used in previous approximations. When compared with precise finite-element analyses of the HCP model, over the computationally accessible range 1 to 1000 for the ASR, this logarithmic-style formula has a maximum error-magnitude of 0.15 percent, which is significantly better than older approximations.", "url": "https://arxiv.org/abs/2609.32974", "type": "理论", "summary": "尖锐导电结构上的静电 (ES) 场增强在防雷、电晕放电、真空电击穿（例如在粒子加速器中）以及更普遍的场电子发射器技术应用中发挥着核心作用。研究这种 ES 效应的标准几何结构是半球柱柱 (HCP) 模型，在该模型中，结构位于大横向范围的平面导体上，并且结构和反电极之间存在较大间隙。主要关注的参数是顶点场增强因子 (AFEF)（顶点-ES-场/背景-ES-场）。对于这种（和其他）结构，AFEF 的公式可以写成 AFEF = ASC x ASR 的形式，其中顶点锐度比 (ASR) 由比率（柱高度/顶点曲率半径）给出，顶点锐度系数 (ASC) 取决于柱形状。对于 HCP 模型，目前尚无 ASC 或 AFEF 的精确解析公式。 （很可能不存在。）本文为 ASC 以及 AFEF 开发了一种紧凑的分析近似。\n\n这个紧凑的公式具有对数式结构，而不是先前近似中使用的幂式结构。与 HCP 模型的精确有限元分析相比，在 ASR 的计算可访问范围 1 到 1000 内，这种对数式公式的最大误差幅度为 0.15%，这明显优于旧的近似值。", "authors": [{"name": "Thiago A. de Assis"}, {"name": "Fernando F. Dall-Agnol"}, {"name": "Richard G. Forbes"}], "featured_authors": [{"name": "Thiago A. de Assis"}, {"name": "Fernando F. Dall-Agnol"}, {"name": "Richard G. Forbes"}], "author_count": 3}, {"id": "2609.33006", "category": "cond-mat", "title": "Periodically modulated traveling waves in integrate-and-fire networks: recursive speed law and propagation failure", "abstract": "Traveling waves of activity in neural tissue can be halted by spatial inhomogeneity in synaptic coupling. We study an integrate-and-fire network in which each neuron fires once and the coupling decays exponentially. For this model the leading-edge firing map reduces exactly to a scalar equation for the wave speed in space, with a slow unstable and a fast stable homogeneous speed, $c_1$ and $c_2$, and a periodic modulation of the coupling enters this equation pointwise. Positive periodic waves terminate in folds. For slowly varying modulation the fold amplitude approaches a plateau set by the trough of the modulation, where the local bottleneck speed is $\\sqrt{c_1 c_2}$; the approach to the plateau is set by the local geometry of the trough. For rapidly varying modulation the fold amplitude grows linearly with frequency, with a slope given by a full-amplitude average over the integrated modulation profile; a weak-ripple truncation of that average overestimates the slope about 2.5-fold at the default coupling. A perturbative recursion in the amplitude gives the speed profile explicitly. We distinguish loss of the periodic wave from failure of a particular launch, and the excitatory regime $\\epsilon\\le 1$ from its sign-changing extension. The results are checked against direct integration of the reduced equation and first-spike firing-map simulations of the network.", "url": "https://arxiv.org/abs/2609.33006", "type": "理论+数值", "summary": "神经组织中活动的行波可以通过突触耦合的空间不均匀性来停止。我们研究了一个集成激发网络，其中每个神经元激发一次，耦合呈指数衰减。对于该模型，前沿发射图精确地简化为空间波速的标量方程，具有缓慢的不稳定和快速稳定的均匀速度 $c_1$ 和 $c_2$，并且耦合的周期性调制逐点进入该方程。正周期波终止于褶皱。对于缓慢变化的调制，折叠幅度接近由调制波谷设置的平台，其中局部瓶颈速度为 $\\sqrt{c_1 c_2}$；通往高原的路径是由槽的局部几何形状决定的。对于快速变化的调制，折叠幅度随频率线性增长，斜率由积分调制曲线上的全幅度平均值给出；该平均值的弱波纹截断会高估默认耦合时的斜率约 2.5 倍。振幅的微扰递归明确地给出了速度曲线。\n\n我们将周期波的损失与特定发射的失败区分开来，并将兴奋状态$\\epsilon\\le 1$与其符号变化的扩展区分开来。结果通过简化方程的直接积分和网络的第一尖峰发射图模拟进行检查。", "authors": [{"name": "Jie Nissel"}, {"name": "Ricardo Erazo-Toscano"}, {"name": "Rosahn Bhattarai"}, {"name": "Marius Osan"}, {"name": "Mandeep Chauhan"}, {"name": "Remus Osan"}], "featured_authors": [{"name": "Jie Nissel"}, {"name": "Ricardo Erazo-Toscano"}, {"name": "Rosahn Bhattarai"}, {"name": "Marius Osan"}, {"name": "Mandeep Chauhan"}, {"name": "Remus Osan"}], "author_count": 6}, {"id": "2609.33026", "category": "cond-mat", "title": "Piezo-Hall effect in $\\mathrm{RbCr_2Se_2O}$", "abstract": "The anomalous Hall effect (AHE) is of fundamental importance for understanding spin-orbit coupling and magnetic transport in magnetic materials. Meanwhile, strain can significantly modify material properties, and the piezoelectric effect stands as a well-known representative. The piezo-Hall effect combines the two physical ingredients of AHE and strain. Specifically, the piezo-Hall effect describes a physical process in which the magnetic space group (MSG) of a magnetic material prohibits a net magnetic moment and suppresses the AHE in the pristine state but transforms into a new MSG upon strain application that permits a net magnetic moment, thereby enabling the emergence of the AHE. The underlying mechanisms cover strain-induced magnetic electronic state transition and strain tuning of magnetization direction. We take the $d$-wave altermagnetic metal as an example to analyze the piezo-Hall effect in detail, with first-principles calculations carried out on the specific material $\\mathrm{RbCr_2Se_2O}$ to verify this scenario. A notable result is that under identical uniaxial strain applied along the $x$ and $y$ directions, the anomalous Hall conductivity exhibits opposite signs but equal magnitudes. Similarly, the piezo-magneto-optical effect can also be proposed, and if strain tuning is replaced by electric-field modulation, the electro-Hall effect and electro-magneto-optical effect can be also put forward accordingly. Even temperature can serve as an external field to introduce the temperature Hall effect. Our work advances the understanding of the coupling between strain and physical properties.", "url": "https://arxiv.org/abs/2609.33026", "type": "数值", "summary": "反常霍尔效应（AHE）对于理解磁性材料中的自旋轨道耦合和磁输运至关重要。同时，应变可以显着改变材料性能，压电效应就是众所周知的代表。压电霍尔效应结合了 AHE 和应变这两种物理成分。具体来说，压电霍尔效应描述了一种物理过程，其中磁性材料的磁空间群（MSG）在原始状态下抑制净磁矩并抑制AHE，但在施加应变时转变为新的MSG，允许净磁矩，从而使AHE出现。其基本机制包括应变感应磁电子态转变和磁化方向的应变调谐。我们以$d$波交磁金属为例详细分析压电霍尔效应，并通过对特定材料$\\mathrm{RbCr_2Se_2O}$进行第一性原理计算来验证这一情况。\n\n一个值得注意的结果是，在沿 $x$ 和 $y$ 方向施加相同的单轴应变的情况下，反常霍尔电导率表现出相反的符号但大小相等。类似地，也可以提出压电磁光效应，如果用电场调制代替应变调谐，也可以相应地提出电霍尔效应和电磁光效应。甚至温度也可以作为外场引入温度霍尔效应。我们的工作增进了对应变与物理特性之间耦合的理解。", "authors": [{"name": "San-Dong Guo"}, {"name": "Shi-Hao Zhang"}, {"name": "Feng-Ren Fan"}], "featured_authors": [{"name": "San-Dong Guo"}, {"name": "Shi-Hao Zhang"}, {"name": "Feng-Ren Fan"}], "author_count": 3}, {"id": "2609.33275", "category": "cond-mat", "title": "Mobile-impurity dynamics in a non-Hermitian Stark-localised bath", "abstract": "We investigate the dynamics of a clean mobile impurity coupled to a bath subjected to a linear Stark potential as well as asymmetric hopping in one dimension. The impurity mediates resonant tunnelling in the bath whenever the interaction strength matches the Stark potential and leads to loss in the memory of the initial state of the bath particles. The non-Hermitian asymmetry does not shift these resonances but reshapes them directionally, and it destroys the bath's Stark-induced memory through the non-Hermitian skin effect. On the other hand, we find that the impurity is localised only within an intermediate range of Stark potential. At very weak tilt strengths the bath offers no potential to trap the impurity, while at strong tilt the bath freezes into a nearly periodic charge density wave that pushes the impurity towards partial localisation. Counterintuitively, the impurity localises in the intermediate regime where the bath's initial-state memory is strongly suppressed, yet a spatially inhomogeneous density profile persists. The interaction amplifies these density fluctuations, dressing the impurity with an effective disordered potential that traps it. Since the skin effect degrades this intermediate density distribution, the impurity localisation window shifts toward stronger tilt in the non-Hermitian regime.", "url": "https://arxiv.org/abs/2609.33275", "type": "理论", "summary": "我们研究了与受到线性斯塔克势以及一维不对称跳跃的浴耦合的清洁移动杂质的动力学。每当相互作用强度与斯塔克势相匹配时，杂质就会介导浴中的共振隧道效应，并导致浴颗粒初始状态的记忆丧失。非厄米不对称性不会改变这些共振，而是定向重塑它们，并且通过非厄米集肤效应破坏浴的斯塔克诱导记忆。另一方面，我们发现杂质仅定位在斯塔克势的中间范围内。在非常弱的倾斜强度下，浴没有提供捕获杂质的潜力，而在强倾斜下，浴冻结成几乎周期性的电荷密度波，将杂质推向部分局部化。与直觉相反，杂质位于中间区域，其中浴的初始状态记忆被强烈抑制，但空间不均匀的密度分布仍然存在。这种相互作用放大了这些密度波动，用有效的无序势来捕获杂质。\n\n由于集肤效应降低了这种中间密度分布，因此杂质定位窗口在非厄米体系中向更强的倾斜方向移动。", "authors": [{"name": "Muhammad S. Hasan"}, {"name": "Hsiang-Hua Jen"}, {"name": "Jhih-Shih You"}], "featured_authors": [{"name": "Muhammad S. Hasan"}, {"name": "Hsiang-Hua Jen"}, {"name": "Jhih-Shih You"}], "author_count": 3}, {"id": "2609.33361", "category": "cond-mat", "title": "Criticality without Temperature in an Ising Spin System", "abstract": "Criticality in the Ising model is conventionally generated by Hamiltonian dynamics and controlled by temperature. Here we show that critical like behavior can emerge in an Ising system whose dynamics is completely independent of the Ising Hamiltonian and contains no temperature like parameter. We introduce an adaptive cluster dynamics in which spin connectivity is controlled by a local quiet time variable, the time elapsed since a spin was last updated. The Ising Hamiltonian enters only as an observable characterizing the resulting configurations. As the parameter $\\alpha$, controlling the connectivity strength, is varied, the system undergoes spontaneous symmetry breaking accompanied by strong collective fluctuations. The cluster size distribution develops an extended power law regime, terminated by a small finite size hump at the largest scales, while the Ising energy exhibits a singular response to the variation of $\\alpha$. These results show that memory dependent connectivity alone can generate collective critical behavior, revealing a route to nonequilibrium criticality without energy based dynamics.", "url": "https://arxiv.org/abs/2609.33361", "type": "理论", "summary": "伊辛模型中的临界点通常由哈密顿动力学产生并由温度控制。在这里，我们证明了类似临界的行为可以出现在伊辛系统中，其动力学完全独立于伊辛哈密顿量并且不包含类似温度的参数。我们引入了一种自适应集群动力学，其中自旋连接性由本地安静时间变量（自上次更新自旋以来经过的时间）控制。伊辛哈密顿量仅作为表征所得配置的可观察量输入。随着控制连通强度的参数 $\\alpha$ 的变化，系统会经历自发的对称性破缺，并伴有强烈的集体涨落。簇尺寸分布形成了一个扩展的幂律体系，在最大尺度上以一个小的有限尺寸驼峰终止，而伊辛能量对 $\\alpha$ 的变化表现出奇异的响应。这些结果表明，仅依赖于记忆的连接就可以产生集体临界行为，揭示了在没有基于能量的动力学的情况下达到非平衡临界性的途径。", "authors": [{"name": "Christos Kakalis"}, {"name": "Fotios K. Diakonos"}], "featured_authors": [{"name": "Christos Kakalis"}, {"name": "Fotios K. Diakonos"}], "author_count": 2}, {"id": "2609.33407", "category": "cond-mat", "title": "Let CSP Be Your ANCHOR: Adaptive Crystal Search over Frozen Structure Priors", "abstract": "De novo crystal generation (DNG) models decide where to search in composition space and how to generate structures with one set of weights. We argue that discovery is better served by separating the two. A crystal structure prediction (CSP) model is a physical prior that should be improved by likelihood training, while rewards, including novelty measured against the search's own history, should act on a search over compositions. We introduce ANCHOR, a GRPO composition policy trained with multi-objective rewards around a frozen CSP model, and continuous adaptive novelty (CAN), a graded novelty score against known structures and a growing discovery history. Using the frozen CSP model as a fixed ruler under one evaluator, we test where adaptation should act. Replacing DNG compositions with ANCHOR's policy on the same CSP backbone raises MSUN from 11.4% to 47.6% and SUN from 1.1% to 22.1% at 99.9% formula uniqueness. Fine-tuning DNG models directly on the same rewards instead moves their composition marginal without raising their on-hull fraction. We show that KL-regularized fine-tuning of a DNG model can only reweight chemistry the pretrained model already supports by a bounded factor, while unregularized DNG fine-tunes move toward known or less stable chemistry. Even a stability-only reward routed into ANCHOR's CSP backbone roughly halves SUN relative to the frozen backbone, whereas likelihood training on structures found during search can improve a CSP backbone. Under MatterGen's evaluation pipeline, ANCHOR raises state-of-the-art MSUN from 29.2% to 41.3%, transfers without retraining to two further CSP backbones, and reaches 47.1% after distillation into Crystalite-CSP. As with any model optimised against a potential, its on-hull rate depends on that potential.", "url": "https://arxiv.org/abs/2609.33407", "type": "理论", "summary": "从头晶体生成 (DNG) 模型决定在成分空间中搜索的位置以及如何生成具有一组权重的结构。我们认为，将两者分开可以更好地促进发现。晶体结构预测（CSP）模型是一种物理先验，应该通过似然训练来改进，而奖励（包括根据搜索自身历史衡量的新颖性）应该作用于对成分的搜索。我们引入了 ANCHOR，一种围绕冻结 CSP 模型进行多目标奖励训练的 GRPO 组合策略，以及连续自适应新颖性 (CAN)，一种针对已知结构和不断增长的发现历史的分级新颖性评分。使用冻结的 CSP 模型作为一个评估者的固定标尺，我们测试适应应该在哪里发挥作用。在同一 CSP 主干上用 ANCHOR 策略替换 DNG 组合物可将 MSUN 从 11.4% 提高到 47.6%，将 SUN 从 1.1% 提高到 22.1%，配方独特性达到 99.9%。直接在相同的奖励上微调 DNG 模型，而不是在不提高其在船体分数的情况下移动其组成边际。\n\n我们表明，DNG 模型的 KL 正则化微调只能重新加权预训练模型已经通过有界因子支持的化学成分，而未正则化的 DNG 微调则朝着已知或不太稳定的化学方向发展。即使仅稳定性奖励路由到 ANCHOR 的 CSP 主干，相对于冻结的主干，SUN 也大致减半，而对搜索过程中发现的结构进行似然训练可以改善 CSP 主干。根据 MatterGen 的评估流程，ANCHOR 将最先进的 MSUN 从 29.2% 提高到 41.3%，无需再训练即可转移到另外两个 CSP 主干网，并在蒸馏到 Crystalite-CSP 后达到 47.1%。与任何针对潜力进行优化的模型一样，其在船率取决于该潜力。", "authors": [{"name": "Emma Lei Hovmand"}, {"name": "Jonas Elsborg"}, {"name": "Melih Kandemir"}, {"name": "Arghya Bhowmik"}], "featured_authors": [{"name": "Emma Lei Hovmand"}, {"name": "Jonas Elsborg"}, {"name": "Melih Kandemir"}, {"name": "Arghya Bhowmik"}], "author_count": 4}, {"id": "2609.33454", "category": "cond-mat", "title": "Kitaev-Heisenberg model on the square-hexagon-dodecagon lattice", "abstract": "We study the spin-$1/2$ Kitaev-Heisenberg model on the square-hexagon-dodecagon lattice with a symmetry-preserving tri-coloring of the Kitaev exchanges. We focus on two cases: (i) the pure Kitaev model with anisotropic exchanges and (ii) the Kitaev-Heisenberg model with isotropic Kitaev exchange. In the absence of Heisenberg interactions, we use the standard mapping of the Kitaev model onto a quadratic Majorana-fermion problem in a $\\mathbb{Z}_2$ gauge field. We find a gapped energy spectrum throughout the positive-coupling phase diagram, except at a single point where the twofold-degenerate energy bands form a Dirac cone. This unique gapped region corresponds to a toric code phase. However, depending on the couplings, vortex excitations on square, hexagonal, and dodecagonal plaquettes realize three distinct relative assignments to the $e$ and $m$ anyons. We determine these relative assignments from the physical fermion parity of the vortex sectors and locate their boundaries by tracking zero crossings of vortex-bound Majorana levels. For the isotropic Kitaev-Heisenberg model, we combine graph-based projected entangled-pair-state calculations, exact diagonalizations, and linear spin-wave theory to study the entire phase diagram. Apart from the toric code topological phases that are robust around the Kitaev limits, we obtain four collinear magnetically ordered phases that can be characterized by their local and relative orderings of hexagonal plaquettes. We also identify a special point at which the ground state is a product state.", "url": "https://arxiv.org/abs/2609.33454", "type": "理论+数值", "summary": "我们研究了正方形六边形十二边形晶格上的自旋 $1/2$ Kitaev-Heisenberg 模型，并具有基塔耶夫交换的对称性保持三色。我们关注两种情况：（i）具有各向异性交换的纯 Kitaev 模型和（ii）具有各向同性 Kitaev 交换的 Kitaev-Heisenberg 模型。在没有海森堡相互作用的情况下，我们使用 Kitaev 模型到 $\\mathbb{Z}_2$ 规范场中的二次马约拉纳费米子问题的标准映射。我们在整个正耦合相图中发现了一个有间隙的能谱，除了在双重简并能带形成狄拉克锥的单个点处。这个独特的间隙区域对应于环面码相位。然而，根据耦合情况，方形、六边形和十二边形小板上的涡旋激发实现了对 $e$ 和 $m$ 任意子的三种不同的相对分配。我们根据涡旋扇区的物理费米子宇称确定这些相对分配，并通过跟踪涡旋束缚马约拉纳能级的零交叉来定位它们的边界。\n\n对于各向同性 Kitaev-Heisenberg 模型，我们结合基于图的投影纠缠对态计算、精确对角化和线性自旋波理论来研究整个相图。除了在基塔耶夫极限附近稳健的环面码拓扑相之外，我们还获得了四个共线磁有序相，这些相可以通过六边形板的局部和相对顺序来表征。我们还确定了一个特殊点，在该点处基态是产物状态。", "authors": [{"name": "Saeed Barari"}, {"name": "Yasir Iqbal"}, {"name": "Ganapathy Baskaran"}, {"name": "Saeed S. Jahromi"}, {"name": "Chunxiao Liu"}, {"name": "Julien Vidal"}], "featured_authors": [{"name": "Saeed Barari"}, {"name": "Yasir Iqbal"}, {"name": "Ganapathy Baskaran"}, {"name": "Saeed S. Jahromi"}, {"name": "Chunxiao Liu"}, {"name": "Julien Vidal"}], "author_count": 6}, {"id": "2609.33568", "category": "cond-mat", "title": "Generalized η-pairing eigenstates in three-component Hubbard models under a transverse field", "abstract": "We investigate three-component Hubbard models on a bipartite lattice in the presence of a trans?verse field. Unlike the two-component Hubbard model, where the {\\eta}-pairing symmetry survives the transverse field, the three-component model possesses neither {\\eta}-pairing symmetry nor conservation of the particle number of each component. We introduce a generalized {\\eta}-pairing operator, formed as a hybridization of three types of two-component pairing operators, and employ the restricted spectrum-generating algebra to construct a family of exact eigenstates. These eigenstates exhibit off-diagonal long-range order. Furthermore, we construct an exact tensor-product state whose co?herent periodic dynamics provide an exact realization of quantum many-body scar dynamics while simultaneously exhibiting long-range magnetic order. We also propose three protocols for preparing this state via quench dynamics, and verify their effectiveness through numerical simulations.", "url": "https://arxiv.org/abs/2609.33568", "type": "理论+数值", "summary": "我们研究了存在横向场的二分晶格上的三分量哈伯德模型。与二分量哈伯德模型不同，其中 {\\eta} 配对对称性在横向场中存在，三分量模型既不具有 {\\eta} 配对对称性，也不具有每个分量的粒子数守恒。我们引入了一种广义的 {\\eta}-配对算子，它由三种类型的二分量配对算子混合而成，并采用受限谱生成代数来构造精确本征态族。这些本征态表现出非对角长程有序。此外，我们构建了一个精确的张量积状态，其相干周期动力学提供了量子多体疤痕动力学的精确实现，同时表现出长程磁序。我们还提出了三种通过淬火动力学准备这种状态的协议，并通过数值模拟验证其有效性。", "authors": [{"name": "F. X. Liu"}, {"name": "Z. Song"}], "featured_authors": [{"name": "F. X. Liu"}, {"name": "Z. Song"}], "author_count": 2}, {"id": "2609.33621", "category": "cond-mat", "title": "Boolean Cumulants and Exact Reduced Descriptions of Renewal-Driven Systems", "abstract": "Reduced descriptions of unresolved fluctuations are commonly based on Gaussian processes, despite the fact that many realistic forcings possess finite correlation times and a renewal structure. For memoryless step (Kubo-Anderson) noise, we show that the reduced dynamics admit two exact and complementary descriptions: a kernel representation governed by the Boolean cumulants of the jump distribution, and a frozen-noise representation for stationary probability densities. For exponentially distributed waiting times, the totally time-ordered $G$-cumulants coincide exactly with the Boolean cumulants of the jump law, leading to an exact resummation of the memory kernel. The resulting kernel is expressed through the Boolean generator $\\eta$ evaluated on a resolvent operator. Within this hierarchy, second-order closure is exact if and only if the jump distribution is symmetric Bernoulli. For general jump laws, the leading closure error is controlled by the universal combination $(b4/b2)\\lambda^2$. Unlike classical cumulant expansions, however, the Boolean hierarchy acts on the reduced kernel rather than directly on the stationary measure. A complementary exact description is provided by the frozen-noise representation. For the linear system with linear multiplicative interaction (LIMI/CAM) model, it reduces the dynamics to a random affine recursion and yields exact expressions for stationary densities and Kesten tail indices. The analysis reveals that rates, moments, and closure errors are governed by the Boolean hierarchy, whereas stationary-density properties are determined by the geometry of the jump distribution through the frozen dynamics. Finite-correlation reductions are therefore controlled not only by the variance and correlation time of the forcing, but also by the underlying combinatorial structure of the renewal process. For memoryless renewal noise, that structure is Boolean.", "url": "https://arxiv.org/abs/2609.33621", "type": "理论+数值", "summary": "尽管许多现实强迫具有有限的相关时间和更新结构，但对未解决的波动的简化描述通常基于高斯过程。对于无记忆阶跃（Kubo-Anderson）噪声，我们表明，简化的动力学允许两种精确且互补的描述：由跳跃分布的布尔累积量控制的内核表示，以及稳态概率密度的冻结噪声表示。对于指数分布的等待时间，完全按时间排序的 $G$ 累积量与跳跃定律的布尔累积量完全一致，从而导致内存内核的精确恢复。生成的内核通过在解析运算符上计算的布尔生成器 $\\eta$ 来表达。在这个层次结构中，当且仅当跳跃分布是对称伯努利分布时，二阶闭包才是精确的。对于一般的跳跃定律，前导闭合误差由通用组合 $(b4/b2)\\lambda^2$ 控制。然而，与经典累积量展开不同的是，布尔层次结构作用于简化核，而不是直接作用于平稳测度。\n\n冻结噪声表示提供了补充的精确描述。对于具有线性乘法相互作用 (LIMI/CAM) 模型的线性系统，它将动力学简化为随机仿射递归，并生成平稳密度和 Kesten 尾指数的精确表达式。分析表明，速率、力矩和闭合误差由布尔层次结构控制，而稳态密度属性则由通过冻结动力学的跳跃分布的几何形状决定。因此，有限相关性降低不仅受到强迫的方差和相关时间的控制，而且还受到更新过程的基础组合结构的控制。对于无记忆的更新噪音，该结构是布尔型的。", "authors": [{"name": "Marco Bianucci"}, {"name": "Riccardo Mannella"}], "featured_authors": [{"name": "Marco Bianucci"}, {"name": "Riccardo Mannella"}], "author_count": 2}, {"id": "2609.33631", "category": "cond-mat", "title": "Computational symmetry hierarchy of time-reversal-even and -odd spin Hall conductivity tensors in altermagnets", "abstract": "Predicting the full spin Hall conductivity tensor of a magnetic crystal is difficult because crystallographic and magnetic symmetries do not constrain all parts of the response in the same way. Here, we separate the spin Hall conductivity of altermagnets into time-reversal-even and time-reversal-odd channels and combine symmetry analysis with first-principles calculations for six representative compounds spanning distinct crystallographic classes. The even channel follows crystallographic selection rules consistent with its Berry-curvature Fermi-sea origin. The odd channel is set by magnetic symmetry and can be reshaped by antiunitary operations whose spatial parts originate from screw or glide symmetries. Momentum-resolved analysis further links the even response to spin-orbit-driven avoided crossings and the odd response to anisotropic near-Fermi-level spin-current response textures. By converting crystallographic and magnetic symmetry operations into linear constraints on the full 27-component SHC tensor, this framework provides a computational prescreening route for identifying symmetry-allowed spin Hall channels before dense first-principles transport calculations. Extending the same analysis to 62 spin-split collinear antiferromagnets yields a magnetic-point-group tensor atlas, identifying design limits such as the complete 13/14tensor partition in CuF2 and the one-parameter time-odd tensor compression in MnSe.", "url": "https://arxiv.org/abs/2609.33631", "type": "理论+数值", "summary": "预测磁性晶体的全自旋霍尔电导率张量很困难，因为晶体学和磁对称性不会以相同的方式约束响应的所有部分。在这里，我们将交替磁体的自旋霍尔电导率分为时间反转偶通道和时间反转奇通道，并将对称分析与第一性原理计算结合起来，对跨越不同晶体类别的六种代表性化合物进行计算。均匀通道遵循与其贝里曲率费米海起源一致的晶体学选择规则。奇数通道由磁对称性设置，并且可以通过空间部分源自螺旋或滑移对称性的反酉运算来重塑。动量解析分析进一步将偶响应与自旋轨道驱动的避免交叉联系起来，并将奇响应与各向异性近费米级自旋电流响应纹理联系起来。通过将晶体学和磁对称操作转换为对完整 27 分量 SHC 张量的线性约束，该框架提供了一种计算预筛选路线，用于在密集的第一原理输运计算之前识别对称性允许的自旋霍尔通道。\n\n将相同的分析扩展到 62 个自旋分裂共线反铁磁体，生成磁点群张量图集，确定设计限制，例如 CuF2 中的完整 13/14 张量分区和 MnSe 中的单参数时间奇数张量压缩。", "authors": [{"name": "Dameul Jeong"}, {"name": "Seoung-Hun Kang"}, {"name": "Young-Kyun Kwon"}], "featured_authors": [{"name": "Dameul Jeong"}, {"name": "Seoung-Hun Kang"}, {"name": "Young-Kyun Kwon"}], "author_count": 3}, {"id": "2609.33714", "category": "cond-mat", "title": "Placement-driven reversal of preferred spin alignment in monolayer hBN vacancy pairs", "abstract": "The negatively charged boron vacancy is an optically addressable spin centre in hexagonal boron nitride (hBN), but bringing two vacancies together introduces electronic interactions absent from the isolated-defect picture. Here we use density-functional theory at total charge q = -2 to show that atomic-scale placement reverses the preferred collinear spin alignment in monolayer hBN. Among seven configurations, the closest pair, separated by 4.3 angstrom, favours parallel alignment by 27.6 meV within the semilocal approximation. Moving one vacancy by a single lattice vector reverses the preference, and a 7.5 angstrom pair favours antiparallel alignment by 50.7 meV. Numerical controls change these two reference splittings by less than 1 meV; hybrid-functional calculations retain their signs while substantially changing their magnitudes. Local distortions connect the antiparallel preference at 7.5 angstrom to changes in vacancy-state hybridization along an intervening atomic chain. The closest pair instead exhibits a contact-localized spin-density contrast and constrained angular energies that depart from the bilinear Heisenberg form. These results identify a placement-sensitive regime of interacting defects and provide a microscopic foundation for investigating coupled spin centres in atomically thin materials.", "url": "https://arxiv.org/abs/2609.33714", "type": "理论+数值", "summary": "带负电的硼空位是六方氮化硼（hBN）中的光学可寻址自旋中心，但将两个空位放在一起会引入孤立缺陷图片中不存在的电子相互作用。在这里，我们使用总电荷 q = -2 时的密度泛函理论来证明原子尺度的布局反转了单层六方氮化硼中首选的共线自旋排列。在七种配置中，最接近的一对（相距 4.3 埃）有利于在半局部近似内平行对齐 27.6 meV。通过单个晶格向量移动一个空位会反转该偏好，并且 7.5 埃对有利于 50.7 meV 的反平行排列。数字控制将这两个参考分裂改变小于 1 meV；混合函数计算保留其符号，同时显着改变其大小。局部扭曲将 7.5 埃处的反平行偏好与沿中间原子链的空位态杂化的变化联系起来。相反，最接近的一对表现出接触局部自旋密度对比和与双线性海森堡形式不同的受限角能。\n\n这些结果确定了相互作用缺陷的位置敏感机制，并为研究原子薄材料中的耦合自旋中心提供了微观基础。", "authors": [{"name": "Daniel Hashemi"}], "featured_authors": [{"name": "Daniel Hashemi"}], "author_count": 1}, {"id": "2609.33724", "category": "cond-mat", "title": "Quantum Dynamics of Full Counting Statistics in Fermionic Lattices with Localized Gain", "abstract": "We investigate the dynamics of full counting statistics (FCS) of the growth of the total number of fermions in a one-dimensional non-interacting lattice subjected to a localized particle gain (source) at one edge. The dynamics of the setup is modeled by the Gorini--Kossakowski--Sudarshan--Lindblad (GKSL) quantum master equation. We recast the counting problem that involves counting particle number at every lattice site to a problem where only the local injected site is involved. We employ the Schwinger-Keldysh path integral formalism within the GKSL framework and derive an analytical expression for the cumulant generating function at arbitrary times and obtain a Levitov-Lesovik type formula in the long-time limit, earlier derived for boundary driven setups in the steady-state. For clean lattices with either short- or long-range hopping, supporting single-particle delocalized eigenstates, we show that all cumulants grow linearly with time in the asymptotic regime. Our analytical results are in excellent agreement with direct numerical simulations. These findings establish a general framework for characterizing FCS and quantum fluctuations in driven open fermionic systems with localized particle injection.", "url": "https://arxiv.org/abs/2609.33724", "type": "理论+数值", "summary": "我们研究了一维非相互作用晶格中费米子总数增长的全计数统计（FCS）动态，该晶格在一个边缘受到局部粒子增益（源）的影响。该装置的动力学通过 Gorini--Kossakowski--Sudarshan--Lindblad (GKSL) 量子主方程进行建模。我们将涉及计算每个晶格位置处的粒子数的计数问题改写为仅涉及局部注入位置的问题。我们在 GKS
