未旋转 Petz 图）上建立恢复边界，并在相对熵损失中具有最佳平方根缩放。\n\n前因子取决于不同的特征值计数或对数谱量，改进了对先前边界中的小特征值的逆幂依赖性。", "authors": [{"name": "Tai-Hsuan Yang"}], "featured_authors": [{"name": "Tai-Hsuan Yang"}], "author_count": 1}, {"id": "2609.33837", "category": "quant-ph", "title": "Dynamic Sculpting of Photon Statistics in a Raman-Coupled Cavity QED System", "abstract": "Controlling photon statistics is pivotal to many applications in classical and quantum photonics. While steady-state photon statistics have been widely studied, dynamically manipulating these statistical properties in time remains elusive. Herein, we propose a scheme to actively control photon statistics between bunching and antibunching regimes through quantum interference. Our approach relies on a Raman-coupled cavity-atom system with parametric amplification, where time modulating the detuning of the intermediate state allows us to either deepen the photon blockade or enhance photon bunching. Simultaneous modulation of the cavity and intermediate-state detunings produces antibunching that cannot be achieved under static conditions or by modulating either detuning alone. Because the modulation is periodic, the antibunching reappears at regular time intervals, enabling time-gated photon antibunching under continuous-wave operation at a repetition rate determined by the modulation frequency. These results show a versatile mechanism based on Raman-assisted quantum interference for dynamically engineering photon correlations.", "url": "https://arxiv.org/abs/2609.33837", "type": "理论", "summary": "控制光子统计对于经典光子学和量子光子学的许多应用至关重要。虽然稳态光子统计已被广泛研究，但及时动态操纵这些统计特性仍然难以实现。在这里，我们提出了一种通过量子干涉主动控制聚束和反聚束状态之间的光子统计的方案。我们的方法依赖于具有参量放大的拉曼耦合腔原子系统，其中时间调制中间态的失谐使我们能够加深光子封锁或增强光子聚束。空腔和中间态失谐的同时调制会产生反聚束，而这种反聚束在静态条件下或单独调制任一失谐都无法实现。由于调制是周期性的，因此反聚束会以规则的时间间隔重新出现，从而在连续波操作下以由调制频率确定的重复率实现时间选通光子反聚束。这些结果展示了一种基于拉曼辅助量子干涉的通用机制，用于动态设计光子相关性。", "authors": [{"name": "Amir Rahmani"}, {"name": "Alireza Dehghani"}], "featured_authors": [{"name": "Amir Rahmani"}, {"name": "Alireza Dehghani"}], "author_count": 2}, {"id": "2609.33934", "category": "quant-ph", "title": "Quantum-Computing Self-Consistent Kohn-Sham DFT: Plane-Wave-Orthonormalized Orbitals with a Dual-Basis Quantum Eigensolver", "abstract": "We present a first-quantization, all-electron, full-potential Kohn-Sham density functional theory method for quantum computers, based on a classically optimized quantum-circuit eigensolver for the self-consistent field (SCF) eigenproblems in any orthonormal basis. The plane-wave-orthonormalized-orbital (PWOO) basis combines plane waves with atomic orbitals (AOs) orthonormalized against them and one another. The eigensolver has a dual-basis form: after full-basis bootstrap steps, it solves each SCF step in a contracted basis of $K$ functions ($\\lceil\\log_2 K\\rceil$ qubits), updated in the full basis when the residual outside it exceeds a threshold. For an H$_8$ chain (SVWN, $K=8$), the state-vector-emulated SCF agrees with classical calculations within 0.02 mHa for 32768 plane waves and PWOO bases up to cc-pVTZ; contraction changes these PWOO energies by at most 5.7 $\\mu$Ha. With emulated shot noise, the STO-3G PWOO SCF converges near the noise-free fixed point. On IonQ Forte-1, three-qubit-register readout reproduces the noise-free PWOO-AO energy difference within one standard deviation.", "url": "https://arxiv.org/abs/2609.33934", "type": "理论+数值", "summary": "我们提出了一种用于量子计算机的第一量子化、全电子、全势 Kohn-Sham 密度泛函理论方法，该方法基于经典优化的量子电路本征求解器，用于解决任何正交基下的自洽场 (SCF) 本征问题。平面波正交归一化轨道 (PWOO) 基础将平面波与对它们和彼此进行正交归一化的原子轨道 (AO) 结合起来。特征求解器具有双基形式：在全基引导步骤之后，它在 $K$ 函数（$\\lceil\\log_2 K\\rceil$ 量子位）的契约基中求解每个 SCF 步骤，当其外部的残差超过阈值时，在全基中更新。对于 H$_8$ 链（SVWN，$K=8$），对于 32768 个平面波和高达 cc-pVTZ 的 PWOO 基数，状态向量模拟的 SCF 与 0.02 mHa 范围内的经典计算一致；收缩使这些 PWOO 能量最多改变 5.7 $\\mu$Ha。通过仿真散粒噪声，STO-3G PWOO SCF 收敛于无噪声固定点附近。在 IonQ Forte-1 上，三量子位寄存器读数再现了一个标准偏差内的无噪声 PWOO-AO 能量差。", "authors": [{"name": "Lazaro Calderin"}], "featured_authors": [{"name": "Lazaro Calderin"}], "author_count": 1}, {"id": "2609.33956", "category": "quant-ph", "title": "Hardness of Approximating Quantum Code Distance Beyond $\\sqrt{N}$", "abstract": "We study the computational complexity of approximating the minimum distance of a stabilizer code. Classically, the minimum distance problem is NP-hard to approximate even to within an additive gap linear in the block length. For quantum codes, however, the reductions of Kapshikar and Kundu and of Grigorescu, Jha and Samperton reach only an additive $O(\\sqrt{N})$ gap in the block length $N$. We close this gap and, in a separate direction, initiate the fine-grained study of the problem. We show that no randomized algorithm approximates the distance to within an additive $\\alpha N$, for a constant $\\alpha > 0$, unless $\\mathsf{NP} \\subseteq \\mathsf{coRP}$. In the fine-grained setting, for every $\\varepsilon > 0$, no randomized $2^{(1-\\varepsilon)\\kappa}\\,\\mathrm{poly}(N)$-time algorithm computes the distance of a code with $\\kappa$ logical qubits unless SETH falls; and no randomized $2^{o(N)}$-time algorithm approximates the distance to within a linear additive gap, on instances where block length, number of logical qubits, and gap are simultaneously linear, unless non-uniform Gap-ETH falls.", "url": "https://arxiv.org/abs/2609.33956", "type": "数值", "summary": "我们研究了近似稳定器代码的最小距离的计算复杂性。传统上，最小距离问题是 NP 困难的，甚至在与块长度呈线性关系的加性间隙内也难以近似。然而，对于量子代码，Kapshikar 和 Kundu 以及 Grigorescu、Jha 和 Samperton 的减少仅在块长度 $N$ 中达到附加的 $O(\\sqrt{N})$ 差距。我们缩小了这一差距，并在一个单独的方向上开始对该问题进行细粒度的研究。我们表明，对于常数 $\\alpha > 0$，没有随机算法可以近似加法 $\\alpha N$ 内的距离，除非 $\\mathsf{NP} \\subseteq \\mathsf{coRP}$。在细粒度设置中，对于每个 $\\varepsilon > 0$，没有随机的 $2^{(1-\\varepsilon)\\kappa}\\,\\mathrm{poly}(N)$ 时间算法计算具有 $\\kappa$ 逻辑量子位的代码的距离，除非 SETH 下跌；在块长度、逻辑量子位数量和间隙同时呈线性的情况下，没有随机的 $2^{o(N)}$ 时间算法可以近似线性加性间隙内的距离，除非非均匀间隙-ETH 下降。", "authors": [{"name": "Upendra Kapshikar"}], "featured_authors": [{"name": "Upendra Kapshikar"}], "author_count": 1}, {"id": "2609.33975", "category": "quant-ph", "title": "Swapping Quantum Annealing Errors into a Cavity", "abstract": "Quantum annealing is a promising form of quantum computation, but it slows down at a small energy gap $\\Delta$ during the anneal, and the errors it makes there remain undetected. We introduce cavity quantum annealing, in which a cavity mode of frequency $O(1)\\gg\\Delta$, coupled mid-schedule, swaps these errors into photons. In the $p$-spin model, this reduces the annealing time to nearly the square root of that required without the cavity. Moreover, counting the photons certifies the result: high-photon runs, with an $O(1)$ yield, reach a ground-state fidelity above $99.99\\%$ orders of magnitude sooner, a gain that grows exponentially with system size. A pre-loaded photon instead runs the swap in reverse, preparing an excited state. More broadly, our work shows that cavities can enhance computations performed with qubits, paving the way toward high-fidelity quantum state preparation by quantum annealing.", "url": "https://arxiv.org/abs/2609.33975", "type": "理论", "summary": "量子退火是一种很有前景的量子计算形式，但它在退火过程中会因小能隙$\\Delta$而减慢速度，并且它所产生的错误仍然未被检测到。我们引入了腔量子退火，其中频率为 $O(1)\\gg\\Delta$ 的腔模式耦合在时间表中，将这些误差交换为光子。在$p$-自旋模型中，这将退火时间减少到几乎没有空腔所需时间的平方根。此外，对光子的计数证明了结果：高光子运行的产率为 $O(1)$，更快地达到高于 $99.99\\%$ 数量级的基态保真度，这种增益随着系统尺寸呈指数级增长。相反，预加载的光子反向运行交换，准备激发态。更广泛地说，我们的工作表明，空腔可以增强量子位执行的计算，为通过量子退火进行高保真量子态制备铺平道路。", "authors": [{"name": "Hao Zhang"}], "featured_authors": [{"name": "Hao Zhang"}], "author_count": 1}, {"id": "2609.33997", "category": "quant-ph", "title": "QBX: A Compiler for 2-local Qubit Hamiltonian Simulation on Quantum Chiplets", "abstract": "2-local qubit Hamiltonian simulation, a fundamental task in quantum computing, is widely applied in various applications. This paper presents QBX, the first quantum compiler designed for 2-local qubit Hamiltonian simulation on quantum chiplet architectures. Existing general-purpose quantum compilers for chiplet architectures target quantum programs at the gate level and miss optimizations requiring high-level semantics of Hamiltonian simulation. Conversely, existing domain-specific compilers for Hamiltonian simulation are designed for monolithic architectures, and their limited scalability and inability to adapt to the heterogeneity of chiplet architectures lead to sub-optimal circuit outputs. QBX implements a scalable hierarchical approach to reduce both the amount and distance of cross-chiplet communications. It integrates the highway mechanism, a chiplet-oriented solution for efficient long-range qubit communication, to diminish cross-chiplet interaction costs. Furthermore, QBX efficiently aggregates 2-local Pauli strings into multi-target controlled gates, harnessing highways for deep optimization. Our evaluations show that QBX markedly outperforms both general-purpose and domain-specific compilers in circuit depth and operation count, while scaling to much larger 2-local Hamiltonian simulations.", "url": "https://arxiv.org/abs/2609.33997", "type": "理论+数值", "summary": "2-局部量子位哈密顿模拟是量子计算中的一项基本任务，广泛应用于各种应用中。本文介绍了 QBX，这是第一个专为量子小芯片架构上的 2 局部量子位哈密顿模拟而设计的量子编译器。现有用于小芯片架构的通用量子编译器以门级量子程序为目标，并且错过了需要哈密顿模拟高级语义的优化。相反，现有的用于哈密顿模拟的特定领域编译器是为单片架构设计的，其可扩展性有限且无法适应小芯片架构的异构性，导致电路输出次优。 QBX 实现了可扩展的分层方法，以减少跨芯片通信的数量和距离。它集成了高速公路机制，这是一种面向小芯片的解决方案，用于高效的远程量子位通信，以降低跨小芯片交互成本。此外，QBX 有效地将 2 个本地泡利字符串聚合成多目标控制门，利用高速公路进行深度优化。\n\n我们的评估表明，QBX 在电路深度和操作计数方面明显优于通用和特定领域编译器，同时可扩展到更大的 2 局部哈密顿量模拟。", "authors": [{"name": "Zikun Li"}, {"name": "Zhuoming Chen"}, {"name": "Zhihao Jia"}], "featured_authors": [{"name": "Zikun Li"}, {"name": "Zhuoming Chen"}, {"name": "Zhihao Jia"}], "author_count": 3}, {"id": "2609.34200", "category": "quant-ph", "title": "Nakayama's reduction of quantum topos and Bayesian quantum computing", "abstract": "Nakayama found the way to limit the contexts in the Döring-Isham topos quantum theory and unified such limitation and the definition of probability as a single choice of topology. We explain how this unification supports the Bayesian perspective where the probability changes as data is obtained. We describe this change as a local shift of the applicability of a predictive theory and apply it to quantum computing.", "url": "https://arxiv.org/abs/2609.34200", "type": "理论", "summary": "中山找到了限制 Döring-Isham 拓扑量子理论中的上下文的方法，并将这种限制和概率的定义统一为拓扑的单一选择。我们解释了这种统一如何支持贝叶斯观点，其中概率随着数据的获取而变化。我们将这种变化描述为预测理论适用性的局部转变，并将其应用于量子计算。", "authors": [{"name": "Atsuhide Mori"}], "featured_authors": [{"name": "Atsuhide Mori"}], "author_count": 1}, {"id": "2609.34201", "category": "quant-ph", "title": "Quantum memory in an effective $Λ$-type system using dynamic detuning control of a superconducting qubit pair", "abstract": "We theoretically investigate quantum-light storage in an effective $\\Lambda$-type system formed by a pair of tunable superconducting qubits coupled to a semi-infinite transmission line and separated by half a wavelength. The frequency detuning between the qubits directly couples the superradiant excited state and the subradiant metastable state. By adjusting the qubit detuning, the system exhibits a controllable spectral response accompanied by slow-light behavior. Dynamically controlling the detuning enables an incident quantum field to be mapped onto the subradiant collective state, stored as a long-lived excitation, and subsequently retrieved on demand. Our results establish the proposed system as a minimal and tunable quantum-memory architecture for scalable superconducting quantum networks.", "url": "https://arxiv.org/abs/2609.34201", "type": "理论", "summary": "我们从理论上研究了有效的 $\\Lambda$ 型系统中的量子光存储，该系统由耦合到半无限传输线并相隔半个波长的一对可调谐超导量子位形成。量子位之间的频率失谐直接耦合超辐射激发态和次辐射亚稳态。通过调整量子位失谐，系统表现出可控的光谱响应以及慢光行为。动态控制失谐使入射量子场能够映射到次辐射集体状态，作为长期激发存储，并随后根据需要检索。我们的结果将所提出的系统确立为可扩展超导量子网络的最小且可调谐的量子存储架构。", "authors": [{"name": "Hsin Chang"}, {"name": "Kai-I Chu"}, {"name": "Ite A. Yu"}, {"name": "Yen-Hsiang Lin"}, {"name": "Yung-Fu Chen"}], "featured_authors": [{"name": "Hsin Chang"}, {"name": "Kai-I Chu"}, {"name": "Ite A. Yu"}, {"name": "Yen-Hsiang Lin"}, {"name": "Yung-Fu Chen"}], "author_count": 5}, {"id": "2609.34213", "category": "quant-ph", "title": "Monotonicity of the Rényi channel capacity under non-signaling assisted channel simulation", "abstract": "We ask whether non-signaling correlations shared between the sender and receiver can increase the Rényi capacity of a classical channel. Non-signaling boxes form a strictly larger class than that of encoder and decoder pairs assisted by shared randomness, so the usual argument based on independent preprocessing and postprocessing is insufficient, and the constraints defining such boxes are linear in the box, while the Rényi capacity depends on the channel nonlinearly. We resolve this mismatch with a variational approach based on the Legendre transform, which recasts the capacity as an extremum over a family of affine functionals in which the channel appears linearly. Combining this method with separate arguments for the Shannon capacity and endpoint orders, we prove that no non-signaling box can raise the Rényi capacity at any order, from order zero through the Shannon capacity to the limiting order at infinity. Consequently, non-signaling simulation cannot increase the random-coding or sphere-packing exponent below capacity, or decrease the strong-converse exponent above capacity.", "url": "https://arxiv.org/abs/2609.34213", "type": "数值", "summary": "我们询问发送者和接收者之间共享的非信令相关性是否可以增加经典信道的 Rényi 容量。非信令盒形成的类别比由共享随机性辅助的编码器和解码器对严格更大，因此基于独立预处理和后处理的通常论点是不够的，并且定义此类盒的约束在盒中是线性的，而Rényi容量非线性地依赖于通道。我们通过基于勒让德变换的变分方法解决了这种不匹配问题，该方法将容量重新定义为一系列仿射泛函的极值，其中通道呈线性。将此方法与香农容量和端点阶数的单独参数相结合，我们证明没有非信令盒可以在任何阶上提高 Rényi 容量，从零阶到香农容量到无穷大的极限阶。因此，非信令模拟不能增加容量以下的随机编码或球填充指数，或减少容量以上的强逆指数。", "authors": [{"name": "Tina Shariat"}, {"name": "Matt Hoogsteder-Riera"}, {"name": "Marco Tomamichel"}], "featured_authors": [{"name": "Tina Shariat"}, {"name": "Matt Hoogsteder-Riera"}, {"name": "Marco Tomamichel"}], "author_count": 3}, {"id": "2609.34255", "category": "quant-ph", "title": "A threshold for maximal Schmidt number from spectrum", "abstract": "The Schmidt number quantifies the dimensionality of entanglement in bipartite quantum states. We investigate when the spectrum of a state on $\\mathbb{C}^d \\otimes \\mathbb{C}^d$ alone guarantees that its Schmidt number is not maximal. By deriving spectral bounds for $(d-1)$-block positive operators, we prove that $\\mathrm{LS}_p\\subseteq \\mathrm{ASN}_{d-1}$ for $p\\leq \\lfloor d^2/2\\rfloor$, where $\\mathrm{LS}_p$ denotes the set of states whose largest eigenvalue does not exceed the sum of their $p$ smallest eigenvalues, and $\\mathrm{ASN}_{d-1}$ denotes the set of states whose Schmidt number remains at most $d-1$ under all global unitaries. This also yields a simple sufficient condition involving only the largest eigenvalue. As an application, we show that states satisfying the reduction criterion under arbitrary global unitaries belong to $\\mathrm{ASN}_{d-1}$ in every dimension. This subsumes the earlier result that absolutely positive partial transpose states belong to $\\mathrm{ASN}_{d-1}$. The global unitary requirement is nevertheless essential: for every $d\\geq3$, we construct states of maximal Schmidt number satisfying the reduction criterion on both subsystems.", "url": "https://arxiv.org/abs/2609.34255", "type": "理论", "summary": "施密特数量化了二分量子态中纠缠的维数。我们研究 $\\mathbb{C}^d \\otimes \\mathbb{C}^d$ 上的状态谱何时单独保证其施密特数不是最大。通过推导 $(d-1)$ 块正算子的谱界，我们证明 $p\\leq \\lfloor d^2/2\\rfloor$ 的 $\\mathrm{LS}_p\\subseteq \\mathrm{ASN}_{d-1}$，其中 $\\mathrm{LS}_p$ 表示最大特征值不超过 $p$ 最小特征值总和的状态集， $\\mathrm{ASN}_{d-1}$ 表示在所有全球酉制下施密特数最多保持为 $d-1$ 的状态集。这也产生了仅涉及最大特征值的简单充分条件。作为一个应用，我们证明满足任意全局酉下的归约准则的状态在每个维度上都属于$\\mathrm{ASN}_{d-1}$。这包含了先前的结果，即绝对正的部分转置状态属于 $\\mathrm{ASN}_{d-1}$。尽管如此，全局统一要求仍然是必要的：对于每个 $d\\geq3$，我们构造满足两个子系统的约简准则的最大施密特数状态。", "authors": [{"name": "Junhyeong An"}, {"name": "Soojoon Lee"}], "featured_authors": [{"name": "Junhyeong An"}, {"name": "Soojoon Lee"}], "author_count": 2}, {"id": "2609.34293", "category": "quant-ph", "title": "Optimal Quantum Algorithms for Ordered Search", "abstract": "Ordered search is the problem of locating a target element in a sorted list of size $n$ using comparison queries. Classically, binary search requires $\\lceil \\log_2 n\\rceil$ queries, which is optimal. Quantum algorithms offer a constant-factor speedup, but the precise constant has been a longstanding open question. We close this gap by exhibiting two new quantum algorithms for ordered search, each using the optimal $\\frac{1}{\\pi}\\ln n+o(\\log n)$ queries. The first, discovered by Claude Fable 5, is a simple zero-error algorithm derived from a continuum relaxation of the problem. The second, discovered by GPT-5.6-Sol (informed by Claude's zero-error algorithm), is an exact algorithm based on an analytic solution of the polynomial program of Farhi, Goldstone, Gutmann, and Sipser.", "url": "https://arxiv.org/abs/2609.34293", "type": "数值", "summary": "有序搜索是使用比较查询在大小为 $n$ 的排序列表中定位目标元素的问题。传统上，二分查找需要 $\\lceil \\log_2 n\\rceil$ 查询，这是最优的。量子算法提供常数因子加速，但精确常数一直是一个长期悬而未决的问题。我们通过展示两种用于有序搜索的新量子算法来缩小这一差距，每种算法都使用最佳的 $\\frac{1}{\\pi}\\ln n+o(\\log n)$ 查询。第一个由 Claude Fable 5 发现，是一种简单的零误差算法，源自问题的连续松弛。第二种是由 GPT-5.6-Sol 发现的（由 Claude 的零误差算法提供），是一种基于 Farhi、Goldstone、Gutmann 和 Sipser 多项式规划的解析解的精确算法。", "authors": [{"name": "Joseph Carolan"}, {"name": "Andrew M. Childs"}], "featured_authors": [{"name": "Joseph Carolan"}, {"name": "Andrew M. Childs"}], "author_count": 2}, {"id": "2609.34332", "category": "quant-ph", "title": "Observation of a topological edge state among localized bulk states in the anisotropic quantum Rabi model", "abstract": "Topological phases are governed by discrete symmetries that protect boundary modes against local perturbations. When translational periodicity is absent, the bulk states also become localized, so that a topological edge state can no longer be distinguished from them by spatial localization alone. Here, we investigate the topological edge state (TES) and bulk eigenstates of the anisotropic quantum Rabi model (AQRM) in a trapped-ion quantum simulator. The AQRM hosts a topological phase in a one-dimensional synthetic lattice, whose translational symmetry is broken by the non-uniform couplings scaling with the site index. While both the TES and bulk states show localized distributions, we find that the TES exhibits well-defined chirality and near-complete spin--boson separability as signatures of the topological phase, in contrast to the bulk states. Phase-space tomography further reveals that the bosonic component of the TES is a squeezed vacuum state, with squeezing up to 6.45 dB. These results identify the TES through its intrinsic topological signatures and establish eigenstate-level characterization as a route to probing topological phenomena.", "url": "https://arxiv.org/abs/2609.34332", "type": "理论", "summary": "拓扑相由离散对称性控制，可保护边界模式免受局部扰动。当平移周期性不存在时，体态也会变得局域化，因此拓扑边缘态不能再仅通过空间局域化来与它们区分开来。在这里，我们研究了俘获离子量子模拟器中各向异性量子拉比模型 (AQRM) 的拓扑边缘态 (TES) 和体本征态。 AQRM在一维合成晶格中存在一个拓扑相，其平移对称性被与位点索引缩放的非均匀耦合所打破。虽然 TES 和体态都显示出局域分布，但我们发现，与体态相比，TES 表现出明确的手性和近乎完全的自旋玻色子可分离性，作为拓扑相的特征。相空间断层扫描进一步揭示，TES 的玻色子分量是压缩真空态，压缩高达 6.45 dB。这些结果通过其内在拓扑特征识别 TES，并建立本征态级表征作为探测拓扑现象的途径。", "authors": [{"name": "Sungjoo Lim"}, {"name": "Chanyang Im"}, {"name": "Christopher G. Yale"}, {"name": "Brian K. McFarland"}, {"name": "Edward C. Tortorici"}, {"name": "Daniel S. Lobser"}, {"name": "Melissa C. Revelle"}, {"name": "Susan M. Clark"}, {"name": "Mahn-Soo Choi"}, {"name": "Junki Kim"}], "featured_authors": [{"name": "Sungjoo Lim"}, {"name": "Chanyang Im"}, {"name": "Christopher G. Yale"}, {"name": "Susan M. Clark"}, {"name": "Mahn-Soo Choi"}, {"name": "Junki Kim"}], "author_count": 10}, {"id": "2609.34413", "category": "quant-ph", "title": "Quantum Security of XOR of Permutations via Fourier Analysis", "abstract": "The XOR of two or more independent random permutations (XoP) is the prototypical pseudorandom function built from permutations achieving security beyond the birthday bound. The classical security of the XoP construction is well established, but its security against quantum attacks that query XoP in superposition has remained widely open. We prove that the XOR of $r\\ge 2$ random permutations over $\\{0,1\\}^n$ is indistinguishable from a random function by any $q$-query quantum algorithm with advantage \\[O\\left(\\min\\left\\{\\frac{q^3}{2^{rn}},\\frac{q^{1.5}}{2^{(r-0.5)n}},\\frac{1}{2^{(r-1.5)n}}\\right\\}\\right)\\] for all $q\\ll 2^n$. In particular, XoP remains secure throughout the entire query range, far beyond the $2^{n/3}$ bound due to quantum collision finding attacks. This is the first construction from permutations that achieves the quantum version of the beyond birthday bound security. We also present several heuristic attacks suggesting the tightness of our bounds in ranges $q\\le 2^{n/2}$ and $\\approx 2^n$. We use a Fourier-analytic variant of the polynomial method: the advantage of any $q$-query quantum algorithm is controlled by the Fourier components of degree at most $2q$, or by $2q$ input-output data of the construction. The norms of most components are bounded well, proving the bound $2^{-(r-3/2)n}$. The norm of low-degree components turn out to be too large for the bounds $q^3/2^{rn}$ and $q^{1.5}/2^{(r-0.5)n}$. We reinterpret these low-degree components as (sums of) advantages of the other problems. For example, the degree-2 and degree-4 terms are interpreted as the advantages against random functions with and without \\emph{planted collisions}, which in turn are bounded using Zhandry's small-range distributions. Along the way, we prove a new bound for the small-range indistinguishability for (ironically) large ranges, which is of independent interest.", "url": "https://arxiv.org/abs/2609.34413", "type": "理论+数值", "summary": "两个或多个独立随机排列 (XoP) 的 XOR 是根据实现超出生日界限的安全性的排列构建的原型伪随机函数。 XoP 构造的经典安全性已得到很好的确立，但其针对叠加查询 XoP 的量子攻击的安全性仍然广泛开放。我们证明，$\\{0,1\\}^n$ 上的 $r\\ge 2$ 随机排列的 XOR 与任何 $q$ 查询量子算法的随机函数都无法区分，具有优势\\[O\\left(\\min\\left\\{\\frac{q^3}{2^{rn}},\\frac{q^{1.5}}{2^{(r-0.5)n}},\\frac{1}{2^{(r-1.5)n}}\\right\\}\\right)\\] 对于所有 $q\\ll 2^n$。特别是，XoP 在整个查询范围内保持安全，远远超出了由于量子碰撞发现攻击而导致的 $2^{n/3}$ 界限。这是第一个实现超越生日限制安全性的量子版本的排列构造。我们还提出了几种启发式攻击，表明我们在 $q\\le 2^{n/2}$ 和 $\\approx 2^n$ 范围内的边界的紧密性。\n\n我们使用多项式方法的傅里叶分析变体：任何 $q$ 查询量子算法的优势都由最多 $2q$ 的傅里叶分量控制，或者由构造的 $2q$ 输入输出数据控制。大多数组件的范数都有很好的界限，证明了界限$2^{-(r-3/2)n}$。低次分量的范数对于边界 $q^3/2^{rn}$ 和 $q^{1.5}/2^{(r-0.5)n}$ 来说太大。我们将这些低度成分重新解释为其他问题的优点（总和）。例如，2 度和 4 度项被解释为相对于有或没有 \\emph{植入碰撞} 的随机函数的优势，而随机函数又使用 Zhandry 的小范围分布进行限制。一路上，我们证明了（讽刺的是）大范围的小范围不可区分性的新界限，这是独立的兴趣。", "authors": [{"name": "Wonseok Choi"}, {"name": "Minki Hhan"}, {"name": "Junyoung Jang"}], "featured_authors": [{"name": "Wonseok Choi"}, {"name": "Minki Hhan"}, {"name": "Junyoung Jang"}], "author_count": 3}, {"id": "2609.34416", "category": "quant-ph", "title": "Excitation Gap of a Confined Chiral Mode Measures Critical Zero-Point Fluctuations", "abstract": "Where uniform and chiral superradiant boundaries meet in a quantum Rabi ring, the quadratic theory leaves a degenerate chiral ladder with finite radial width. We show that adding one chiral quantum widens the ladder's radial wave function; the quartic coupling then raises the uniform quadratic coefficient. The resulting gap is proportional to the uniform zero-point variance divided by the atomic-to-cavity frequency ratio $\\eta$: it closes as $\\eta^{-2/3}$ while the variance grows as $\\eta^{1/3}$. A quartic Schrödinger equation fixes both observables and the first correction to their ratio, as confirmed by full spin-photon diagonalization. A triangle of collective spins with Dzyaloshinskii-Moriya exchange obeys the same relation, with a different coefficient and a correction of opposite sign. The ring's three-coordinate spectrum connects this gap to the neighboring $\\eta^{-1}$ and $\\eta^{-1/3}$ laws and to photon-number saturation.", "url": "https://arxiv.org/abs/2609.34416", "type": "理论", "summary": "当均匀和手性超辐射边界在量子拉比环中相遇时，二次理论留下了具有有限径向宽度的简并手性阶梯。我们证明，添加一个手性量子可以拓宽梯子的径向波函数；然后四次耦合会提高均匀二次系数。产生的间隙与均匀零点方差除以原子与腔频率比 $\\eta$ 成正比：它以 $\\eta^{-2/3}$ 闭合，而方差以 $\\eta^{1/3}$ 增长。正如全自旋光子对角化所证实的那样，四次薛定谔方程修复了可观测量和对其比率的第一次校正。具有 Dzyaloshinskii-Moriya 交换的集体自旋三角形遵循相同的关系，但具有不同的系数和相反符号的校正。环的三坐标谱将这个间隙与邻近的 $\\eta^{-1}$ 和 $\\eta^{-1/3}$ 定律以及光子数饱和度联系起来。", "authors": [{"name": "Shu He"}, {"name": "Liwei Duan"}], "featured_authors": [{"name": "Shu He"}, {"name": "Liwei Duan"}], "author_count": 2}, {"id": "2609.34532", "category": "quant-ph", "title": "Near-Optimal Bounds on the Density of Low-Energy States of $k$-Local Hamiltonians and Faster Quantum Algorithms", "abstract": "Low-energy estimation and state preparation for general $k$-local Hamiltonians are fundamental challenges in quantum complexity theory. Buhrman et al.~ [BGLGST, PRL 2025] recently broke the natural Grover bound $O^\\ast(2^{n/2})$ for both problems, with the improvement depending on the relative accuracy $\\varepsilon$ and the locality $k$. In this work, we present faster exponential quantum algorithms for these problems, where the binary entropy function governs the runtime exponent. For sufficiently small $\\varepsilon/k$, our algorithms improve the exponent by a factor of $\\log(k/\\varepsilon)$ over [BGLGST, PRL 2025]. Our main technical result is an entropy-governed lower bound on the dimension of the Hamiltonian's low-energy subspace, obtained by depolarizing its ground state. For fixed $k$, this bound is optimal up to constant factors in the exponent. The same framework yields tighter bounds for Heisenberg, $XY$, and Ising models on arbitrary interaction graphs.", "url": "https://arxiv.org/abs/2609.34532", "type": "理论+数值", "summary": "一般$k$局部哈密顿量的低能量估计和状态准备是量子复杂性理论中的基本挑战。 Buhrman 等人~ [BGLGST, PRL 2025] 最近打破了这两个问题的自然 Grover 界限 $O^\\ast(2^{n/2})$，其改进取决于相对精度 $\\varepsilon$ 和局部性 $k$。在这项工作中，我们针对这些问题提出了更快的指数量子算法，其中二元熵函数控制运行时指数。对于足够小的 $\\varepsilon/k$，我们的算法将指数比 [BGLGST, PRL 2025] 提高了 $\\log(k/\\varepsilon)$ 倍。我们的主要技术成果是哈密顿量低能子空间维度的熵控制下界，通过去极化其基态获得。对于固定的 $k$，此界限在指数中的常数因子范围内是最佳的。相同的框架为任意交互图上的 Heisenberg、$XY$ 和 Ising 模型提供了更严格的界限。", "authors": [{"name": "Sevag Gharibian"}, {"name": "François Le Gall"}, {"name": "Ranitha Mataraarachchi"}, {"name": "Suguru Tamaki"}], "featured_authors": [{"name": "Sevag Gharibian"}, {"name": "François Le Gall"}, {"name": "Ranitha Mataraarachchi"}, {"name": "Suguru Tamaki"}], "author_count": 4}, {"id": "2609.34617", "category": "quant-ph", "title": "Quantum Entanglement in Variational Quantum Classification for Breast Cancer Diagnosis", "abstract": "This study looks at how the entangling structure of a variational quantum classifier (VQC) relates to its performance in breast cancer diagnosis, using the Wisconsin Diagnostic Breast Cancer (WDBC) dataset. We tested three three-qubit configurations that share the same EfficientSU2 ansatz, COBYLA optimizer, and stratified five-fold cross-validation, but differ in their entangling structure: a single- repetition Ising-type coupling (A), a two-repetition linear Ising-type coupling (B), and a fully connected Heisenberg-type coupling (C). Entanglement was measured with the von Neumann entropy and the Wootters concurrence. From A to C, the mean entropy rose from 0.40 to 0.71, accuracy rose from 92.98% to 93.68%, and F1-score rose from 90.32% to 91.28%. Configuration C was also the most stable across folds. However, the fold-level correlations between entanglement and performance were weak and not significant. Richer topologies also increase circuit expressivity, so the two effects cannot be fully separated. These results show an association, not a proven causal link, between entangling structure and VQC performance.", "url": "https://arxiv.org/abs/2609.34617", "type": "理论+数值", "summary": "本研究使用威斯康星州诊断乳腺癌 (WDBC) 数据集，探讨变分量子分类器 (VQC) 的纠缠结构与其在乳腺癌诊断中的性能之间的关系。我们测试了三种三量子位配置，它们共享相同的 EfficientSU2 ansatz、COBYLA 优化器和分层五重交叉验证，但其纠缠结构不同：单重复伊辛型耦合 (A)、两次重复线性伊辛型耦合 (B) 和完全连接的海森堡型耦合 (C)。纠缠是用冯·诺依曼熵和伍特斯并发来测量的。从A到C，平均熵从0.40上升到0.71，准确率从92.98%上升到93.68%，F1-score从90.32%上升到91.28%。配置 C 也是跨折叠最稳定的。然而，纠缠和性能之间的倍数相关性很弱且不显着。更丰富的拓扑也增加了电路表现力，因此这两种效果不能完全分开。这些结果表明，缠结结构和 VQC 性能之间存在关联，而非经过证实的因果关系。", "authors": [{"name": "Zineb Hazmoun"}, {"name": "Zoubida Sakhi"}, {"name": "Mohamed Bennai"}], "featured_authors": [{"name": "Zineb Hazmoun"}, {"name": "Zoubida Sakhi"}, {"name": "Mohamed Bennai"}], "author_count": 3}, {"id": "2609.34659", "category": "quant-ph", "title": "Depth-Optimal Quantum Compilation", "abstract": "We achieve the first constant-depth circuit for arbitrary single-qubit gate synthesis. Unlike prior approaches, the construction is fully unitary and requires no pre-supplied catalyst. For any constant $\\delta>0$, it $\\varepsilon$-approximates an arbitrary single-qubit gate using $O(\\log^{1+\\delta}(1/\\varepsilon))$ clean ancillae, Hadamard and $T$ single-qubit gates, $O(\\log(1/\\varepsilon))$-width generalized Toffoli gates, and sublogarithmic-width Fan-Out gates. We further eliminate Fan-Out entirely, showing that Hadamard, $T$, and generalized Toffoli gates alone suffice for constant-depth synthesis. When restricted to the standard bounded-width gate model, our construction has depth $O(\\log\\log(1/\\varepsilon))$, and we prove a matching $\\Omega(\\log\\log(1/\\varepsilon))$-depth lower bound. Overall, we establish that $\\Theta(\\log\\log(1/\\varepsilon))$-depth is unavoidable with only bounded-width gates, yet allowing even logarithmic-width multi-qubit gates suffices to achieve constant-depth synthesis. These results also reveal new structure in shallow quantum circuit complexity. We give a depth-preserving real simulation of bounded-error decision computation, showing that every depth-$d$ QAC circuit can be simulated in depth $O(d)$ using only Hadamard, $X$, and generalized Toffoli gates. Thus arbitrary single-qubit rotations and complex amplitudes do not increase the bounded-error decision power of QAC, even at constant depth. In particular, this reduces the long-standing conjecture Parity$\\notin$QAC$^0$ to proving a Parity lower bound against circuits consisting only of Hadamard, $X$, and generalized Toffoli gates. More generally, this real normal form exposes a direct correspondence between the standard shallow-depth quantum circuit hierarchy and a hierarchy of Forrelation circuits with restricted oracle families.", "url": "https://arxiv.org/abs/2609.34659", "type": "理论+数值", "summary": "我们实现了第一个用于任意单量子位门合成的恒定深度电路。与之前的方法不同，该结构是完全统一的，不需要预先提供催化剂。对于任何常数 $\\delta>0$，它 $\\varepsilon$ 使用 $O(\\log^{1+\\delta}(1/\\varepsilon))$ clean ancillae、Hadamard 和 $T$ 单量子位门、$O(\\log(1/\\varepsilon))$-宽度广义 Toffoli 门和亚对数宽度扇出门来逼近任意单量子位门。我们进一步完全消除了扇出，表明仅 Hadamard、$T$ 和广义 Toffoli 门就足以进行恒定深度综合。当限制于标准有界宽度门模型时，我们的构造具有深度 $O(\\log\\log(1/\\varepsilon))$，并且我们证明了匹配的 $\\Omega(\\log\\log(1/\\varepsilon))$ 深度下界。总的来说，我们确定 $\\Theta(\\log\\log(1/\\varepsilon))$ 深度对于仅有界宽度的门是不可避免的，但即使是对数宽度的多量子位门也足以实现恒定深度的合成。这些结果还揭示了浅量子电路复杂性的新结构。\n\n我们给出了有界误差决策计算的保留深度的真实模拟，表明每个深度 $d$ QAC 电路都可以仅使用 Hadamard、$X$ 和广义 Toffoli 门在深度 $O(d)$ 中进行模拟。因此，即使在恒定深度下，任意单量子位旋转和复振幅也不会增加 QAC 的有界误差决策能力。特别是，这将长期存在的猜想 Parity$\\notin$QAC$^0$ 简化为证明针对仅由 Hadamard、$X$ 和广义 Toffoli 门组成的电路的 Parity 下界。更一般地，这种实范式揭示了标准浅深度量子电路层次结构和具有受限预言系列的 Forrelation 电路层次结构之间的直接对应关系。", "authors": [{"name": "Francisca Vasconcelos"}], "featured_authors": [{"name": "Francisca Vasconcelos"}], "author_count": 1}, {"id": "2609.34699", "category": "quant-ph", "title": "Log-Euclidean Rényi Conditional Mutual Information", "abstract": "Quantum conditional mutual information (QCMI) is a fundamental measure of conditional independence, with central applications throughout quantum information theory and many-body physics. Despite its importance, finding a fully quantum Rényi generalization that satisfies all desirable structural properties has remained an open question. In this work, we introduce a quantum Rényi conditional mutual information possessing these desirable properties: it is monotone under local quantum channels, additive under tensor products, monotone in the Rényi parameter, and converges to the QCMI in the limit $\\alpha \\to 1$. We establish bounds on this quantity in terms of relative entropies to the Petz-recovered state, showing that it provides a distinct measure of approximate conditional independence. As a consequence, we derive recovery-based upper and lower bounds on the QCMI in terms of quantum generalizations of the Kullback-Leibler divergence, improving upon the best known results in certain regimes. Finally, we establish bounds in terms of relative entropies to the sets of Markov and separable states and derive Rényi chain rules, which appear to be novel even in the classical setting.", "url": "https://arxiv.org/abs/2609.34699", "type": "理论", "summary": "量子条件互信息 (QCMI) 是条件独立性的基本度量，在整个量子信息理论和多体物理学中具有核心应用。尽管它很重要，但找到满足所有理想结构特性的完全量子 Rényi 推广仍然是一个悬而未决的问题。在这项工作中，我们引入了一种量子 Rényi 条件互信息，它具有这些理想的特性：它在局部量子通道下是单调的，在张量积下是可加的，在 Rényi 参数中是单调的，并且在 $\\alpha \\to 1$ 的极限下收敛到 QCMI。我们根据 Petz 恢复状态的相对熵建立了这个量的界限，表明它提供了近似条件独立性的独特度量。因此，我们根据 Kullback-Leibler 散度的量子概括得出了 QCMI 上基于恢复的上限和下限，改进了某些机制中最著名的结果。最后，我们根据马尔可夫和可分离状态集的相对熵建立界限，并推导出 Rényi 链规则，即使在经典环境中，这似乎也是新颖的。", "authors": [{"name": "Roberto Rubboli"}, {"name": "Amir Arqand"}, {"name": "Mark M. Wilde"}], "featured_authors": [{"name": "Roberto Rubboli"}, {"name": "Amir Arqand"}, {"name": "Mark M. Wilde"}], "author_count": 3}, {"id": "2609.34859", "category": "quant-ph", "title": "Correlation measure for statistical systems", "abstract": "A measure of correlations for statistical systems is advanced, called correlation index. The measure is general, being applicable to quantum and classical, equilibrium and nonequilibrium statistical systems. After formulating the general notion of correlation indices for arbitrary trace-class operators, the calculation of the correlation indices are illustrated by several examples of density operators and reduced density matrices. The computation of the correlation indices for equilibrium systems is exemplified for bosonic systems with the Bose-Einstein condensate, superconducting systems, and for spin systems. Correlation indices for nonequilibrium systems are considered for nonlinear dynamics of spin and pseudospin systems.", "url": "https://arxiv.org/abs/2609.34859", "type": "理论+数值", "summary": "统计系统的相关性度量是先进的，称为相关指数。该度量是通用的，适用于量子和经典、平衡和非平衡统计系统。在制定了任意迹类算子的相关指数的一般概念之后，通过密度算子和简化密度矩阵的几个例子来说明相关指数的计算。平衡系统相关指数的计算以具有玻色-爱因斯坦凝聚的玻色子系统、超导系统和自旋系统为例。对于自旋和赝自旋系统的非线性动力学，考虑非平衡系统的相关指数。", "authors": [{"name": "V.I. Yukalov"}, {"name": "E.P. Yukalova"}], "featured_authors": [{"name": "V.I. Yukalov"}, {"name": "E.P. Yukalova"}], "author_count": 2}, {"id": "2609.34885", "category": "quant-ph", "title": "Directional pumping of a two-level system by a fluctuation-regulated quantum source", "abstract": "A resonant classical field drives a two-level system coherently and, with ordinary relaxation, produces saturation rather than directional population transfer. Here we show that directionality emerges when the excitation source is retained as a quantum subsystem and subsequently traced out. We model the source as a single-excitation degree of freedom, or equivalently a stream of two-level ancillas, exchange-coupled to a target two-level system. The source first moment generates the usual coherent drive, while its second moments produce upward and downward dissipative channels. For a number-diagonal, fully excited source, the first moment vanishes and only the upward channel remains, yielding monotonic pumping of the target. The same structure follows from both an exact collision map and a fluctuation-regulated second-order quantum master equation. For exponentially decaying source correlations, the pumping rate shows a Lorentzian detuning dependence governed by the correlation time $\\tau_c$, accompanied by a dispersive frequency shift. In the presence of thermal relaxation, the steady-state excited-state population can exceed the resonantly driven optical-Bloch limit of one half. Within the fluctuation-regulated master equation, this directional pumping arises as a drive-induced dissipative contribution whose strength and spectral response are controlled by $\\tau_c$.", "url": "https://arxiv.org/abs/2609.34885", "type": "理论", "summary": "共振经典场连贯地驱动二能级系统，并且在普通弛豫下产生饱和而不是定向种群转移。在这里，我们表明，当激发源被保留为量子子系统并随后被追踪时，就会出现方向性。我们将源建模为单激发自由度，或者等效地为两能级辅助流，交换耦合到目标两能级系统。源第一矩产生通常的相干驱动，而其第二矩产生向上和向下耗散通道。对于数对角完全激发源，一阶矩消失，仅保留向上通道，从而产生目标的单调泵浦。精确的碰撞图和涨落调节的二阶量子主方程都得出相同的结构。对于指数衰减的源相关性，泵浦速率显示出由相关时间 $\\tau_c$ 控制的洛伦兹失谐依赖性，并伴有色散频移。在存在热弛豫的情况下，稳态激发态布居数可以超过共振驱动光学布洛赫极限的一半。\n\n在波动调节主方程中，这种定向泵浦作为驱动引起的耗散贡献而出现，其强度和光谱响应由$\\tau_c$控制。", "authors": [{"name": "Sarfraj Fency"}, {"name": "Rangeet Bhattacharyya"}], "featured_authors": [{"name": "Sarfraj Fency"}, {"name": "Rangeet Bhattacharyya"}], "author_count": 2}, {"id": "2609.34935", "category": "quant-ph", "title": "Classical simulation of amplitude-damped bucket-brigade quantum random access memories via predictable branch evolution", "abstract": "Classical simulation of quantum random access memory (QRAM) under noise can be accelerated dramatically by branch pruning: noise histories are sampled as trajectory ensembles, and good branches, whose routing paths avoid every sampled fault, need not be evolved because their final states are analytically predictable. Under amplitude damping this predictability is not automatic, because the no-jump operator $K_0$ acts on every branch at every time slice. Here we give a complete account of damping-channel predictability in bucket-brigade QRAM simulation, for both qutrit and qubit encodings. For the qutrit encoding, $K_0$ is diagonal in the node basis, and the wait state $|W\\rangle$ is its fixed point, so a good branch follows the noiseless orbit up to a scalar attenuation. In the qubit encoding, phase-kickback memory fetching between two Hadamard walls makes $K_0$ no longer diagonal, yet the resulting structure is exactly solvable in closed form. Conditional on no jump, the in-branch infidelity of a good branch is second order in the damping rate $\\gamma$, with coherent leakage $\\sim n^2\\gamma^2/4$ per data qubit, and the closed form captures it without approximation. We also revise the pruning criterion for the qubit encoding. The resulting algorithm evolves only the bad branches plus one reference branch and shares every other cost with the full evolution it replaces. It is validated by end-to-end benchmarks with pruned-over-full speedups up to $285\\times$ and by trajectory-level tests confirming every closed form to machine precision.", "url": "https://arxiv.org/abs/2609.34935", "type": "理论+数值", "summary": "噪声下量子随机存取存储器（QRAM）的经典模拟可以通过分支修剪来显着加速：噪声历史被采样为轨迹集合，而好的分支（其路由路径避免了每个采样的错误）不需要进化，因为它们的最终状态是可分析预测的。在振幅阻尼下，这种可预测性不是自动的，因为无跳转运算符 $K_0$ 作用于每个时间片的每个分支。在这里，我们对 qutrit 和 qubit 编码的桶旅 QRAM 模拟中的阻尼通道可预测性进行了完整的说明。对于 qutrit 编码，$K_0$ 在节点基础上是对角线，等待状态 $|W\\rangle$ 是其固定点，因此一个好的分支遵循无噪声轨道直至标量衰减。在量子位编码中，两个 Hadamard 墙之间的相位回冲内存获取使 $K_0$ 不再是对角线，但所得结构在封闭形式下完全可解。在无跳跃的条件下，好分支的分支内不保真度在阻尼率 $\\gamma$ 中是二阶，每个数据量子位具有相干泄漏 $\\sim n^2\\gamma^2/4$，并且闭合形式无需近似即可捕获它。\n\n我们还修改了量子位编码的修剪标准。由此产生的算法仅进化坏分支加上一个参考分支，并与其替换的完整进化分担所有其他成本。它通过端到端基准测试进行了验证，修剪过度加速高达 $285\\times$，并通过轨迹级测试确认每个封闭形式的机器精度。", "authors": [{"name": "Zhao-Yun Chen"}, {"name": "Ming-Yang Tan"}, {"name": "Sheng Zhang"}, {"name": "Peng Wang"}, {"name": "Yun-Jie Wang"}, {"name": "Guo-Ping Guo"}], "featured_authors": [{"name": "Zhao-Yun Chen"}, {"name": "Ming-Yang Tan"}, {"name": "Sheng Zhang"}, {"name": "Peng Wang"}, {"name": "Yun-Jie Wang"}, {"name": "Guo-Ping Guo"}], "author_count": 6}, {"id": "2609.34996", "category": "quant-ph", "title": "Cyclotomic Cosets: Hidden Subgroup and Quantum Sieving Algorithm for Prime-Power Moduli", "abstract": "The Learning With Errors (LWE) problem is a fundamental assumption in post-quantum cryptography. Regev established a quantum reduction from LWE to the Dihedral Coset Problem (DCP). Later, Brakerski et al. introduced the Extrapolated Dihedral Coset Problem (EDCP), proving its equivalence to LWE. However, unlike DCP, EDCP no longer admits a coset structure. This limits the direct application of techniques for hidden subgroup problems. In this work, we introduce the Cyclotomic Coset Problem (CCP), a cyclotomic generalization of DCP that preserves an exact hidden-subgroup structure. Let $\\zeta_p$ be a primitive $p$-th root of unity, let $\\pi=\\zeta_p-1$, and write $q=p^t$ and $L=t(p-1)$. We work over $R_q=\\mathbb Z_q[\\zeta_p] \\cong \\mathbb Z[\\zeta_p]/(\\pi^L)$, where the isomorphism follows from the total ramification identity $(p)=(\\pi)^{p-1}$. We exploit the resulting $\\pi$-adic ideal chain to construct a quantum sieve that successively reduces phase states modulo $\\pi^{L},\\pi^{L-1},\\ldots,\\pi$. For every fixed prime $p$ and modulus $q=p^t$, our algorithm solves the CCP in time and sample complexity $2^{O_p(\\log n\\log q)}$, using polynomial quantum space. The sieve also applies to uniform EDCP and Gaussian S|LWE>, yielding quasi-polynomial time algorithms for all the above problems when $q=\\text{poly}(n)$. This extends the power-of-two EDCP sieve of Bai et al. (CRYPTO 2025) to a cyclotomic setting. However, we emphasize that our result does not, by itself, yield a quasi-polynomial-time algorithm for standard LWE, because the currently known reduction produces only a limited number of approximate CCP states.", "url": "https://arxiv.org/abs/2609.34996", "type": "理论+数值", "summary": "带错误学习（LWE）问题是后量子密码学的基本假设。 Regev 建立了从 LWE 到二面陪集问题 (DCP) 的量子约简。后来，布雷克斯基等人。引入了外推二面陪集问题（EDCP），证明了其与 LWE 的等价性。然而，与 DCP 不同，EDCP 不再承认陪集结构。这限制了隐藏子群问题技术的直接应用。在这项工作中，我们介绍了分圆陪集问题（CCP），这是 DCP 的分圆概括，保留了精确的隐藏子群结构。设$\\zeta_p$为原$p$次单位根，设$\\pi=\\zeta_p-1$，并写为$q=p^t$和$L=t(p-1)$。我们研究 $R_q=\\mathbb Z_q[\\zeta_p] \\cong \\mathbb Z[\\zeta_p]/(\\pi^L)$，其中同构来自总分支恒等式 $(p)=(\\pi)^{p-1}$。我们利用由此产生的 $\\pi$-adic 理想链来构造一个量子筛，该量子筛依次以 $\\pi^{L},\\pi^{L-1},\\ldots,\\pi$ 为模减少相态。对于每个固定素数 $p$ 和模 $q=p^t$，我们的算法使用多项式量子空间在时间和样本复杂度 $2^{O_p(\\log n\\log q)}$ 上求解 CCP。\n\n该筛法也适用于均匀 EDCP 和高斯 S|LWE>，当 $q=\\text{poly}(n)$ 时，为所有上述问题产生拟多项式时间算法。这扩展了 Bai 等人的 2 次方 EDCP 筛。 （CRYPTO 2025）到分圆设置。然而，我们强调，我们的结果本身并不能产生标准 LWE 的拟多项式时间算法，因为当前已知的约简仅产生有限数量的近似 CCP 状态。", "authors": [{"name": "Mathias Boucher"}, {"name": "Pierre-Alain Fouque"}, {"name": "Yixin Shen"}], "featured_authors": [{"name": "Mathias Boucher"}, {"name": "Pierre-Alain Fouque"}, {"name": "Yixin Shen"}], "author_count": 3}, {"id": "2609.35016", "category": "quant-ph", "title": "Experimental quantum-computing-enhanced sensing using Grover's algorithm", "abstract": "The combination of quantum sensing with quantum computing to provide an enhancement over conventional quantum sensing has recently emerged as a promising potential application of quantum computing that could give advantages without needing large-scale or fault-tolerant hardware. In this work, we report an experimental demonstration of a recent theoretical proposal to repurpose Grover's search algorithm to improve the ability to detect signals with unknown frequency within a large detection bandwidth. Our experiments were based on a system comprising a single superconducting qubit coupled to a single superconducting cavity, highlighting the modest hardware requirements for realizing the protocol. We found that Grover-based sensing was able to outperform the natural non-Grover baseline for our experimental platform for detection bandwidths $>$10~MHz, with an advantage that empirically grew superlinearly with the bandwidth beyond that break-even point. The use of the Grover-based protocol reduced the amount of signal that needed to be sensed to make an accurate detection decision by more than 10$\\times$ for choices of larger detection bandwidth and higher desired detection accuracy. Our results provide a proof-of-principle validation that Grover-based quantum computational sensing can be realized in near-term hardware and provide a metrological advantage well beyond break-even in spite of the additional protocol complexity.", "url": "https://arxiv.org/abs/2609.35016", "type": "实验", "summary": "量子传感与量子计算的结合，提供了对传统量子传感的增强，最近已成为量子计算的一个有前途的潜在应用，它可以在不需要大规模或容错硬件的情况下提供优势。在这项工作中，我们报告了最近的理论建议的实验演示，该建议旨在重新调整 Grover 的搜索算法，以提高在大检测带宽内检测未知频率信号的能力。我们的实验基于一个包含单个超导量子位与单个超导腔耦合的系统，突出了实现该协议的适度硬件要求。我们发现，基于 Grover 的传感能够超越我们实验平台的自然非 Grover 基线，检测带宽为 $>$10~MHz，其优势在于，根据经验，随着带宽超出盈亏平衡点，其优势会呈超线性增长。使用基于 Grover 的协议将做出准确检测决策所需感测的信号量减少了 10 倍以上，从而选择更大的检测带宽和更高的所需检测精度。\n\n我们的结果提供了原理验证，证明基于 Grover 的量子计算传感可以在近期硬件中实现，并提供远远超出收支平衡的计量优势，尽管协议复杂性增加。", "authors": [{"name": "Mathieu Ouellet"}, {"name": "Purnendu Sen"}, {"name": "Xiangqin Wang"}, {"name": "Saswata Roy"}, {"name": "Xingrui Song"}, {"name": "Vladimir Kremenetski"}, {"name": "Sridhar Prabhu"}, {"name": "Valla Fatemi"}, {"name": "Peter L. McMahon"}], "featured_authors": [{"name": "Mathieu Ouellet"}, {"name": "Purnendu Sen"}, {"name": "Xiangqin Wang"}, {"name": "Sridhar Prabhu"}, {"name": "Valla Fatemi"}, {"name": "Peter L. McMahon"}], "author_count": 9}, {"id": "2609.35101", "category": "quant-ph", "title": "From Simple Sources to Quantum Advantage: Homomorphic Polynomial Transduction via Relative Decoding", "abstract": "Decoded quantum interferometry (DQI) and its Hamiltonian extension (HDQI) prepare states whose amplitudes are low-degree polynomials of an objective, using Fourier transforms and coherent decoding. We recast this approach as quantum state transduction through algebra homomorphisms. We transfer an efficiently preparable operator state of a degree-$D$ polynomial in a source Hamiltonian $H_A$ to the corresponding polynomial state of a target Hamiltonian $H_B=\\pi(H_A)$, where $\\pi$ is a unital $*$-homomorphism between the finite-dimensional source and target $C^*$-algebras. The transduction uses operator Fourier transforms and relative decoding to recover source operators rather than individual term-selection labels. The relative distance $d_{\\mathrm{rel}}$ is the first degree at which source and target traces disagree. We prove that $2D<d_{\\mathrm{rel}}$ is equivalent to preserving all inner products between degree-$D$ polynomials. Moreover, $d_{\\mathrm{rel}}\\ge d_{\\mathrm{ord}}$, where $d_{\\mathrm{ord}}$ is the ordinary distance used in (H)DQI, and we give families with $d_{\\mathrm{ord}}=O(1)$ but $d_{\\mathrm{rel}}=\\Theta(n)$ and efficient decoders. Our framework replaces the complicated pilot state preparation by the more modular task of preparing a source polynomial state. DQI and HDQI arise as relation-free special cases. The framework accommodates nonuniform coefficients and noncommuting interactions and extends to fermionic, qudit, and bosonic systems, with applications to approximate optimization and Gibbs sampling. As evidence of advantages, for a nonlinear pairwise variant of optimal polynomial intersection where constant $d_{\\mathrm{ord}}$ limits DQI-style preparations, relative decoding yields an ideal quantum score of 0.643 versus 0.606 for the best tested classical heuristic, a gap exceeding 3 percentage points.", "url": "https://arxiv.org/abs/2609.35101", "type": "理论+数值", "summary": "解码量子干涉测量 (DQI) 及其哈密顿扩展 (HDQI) 使用傅立叶变换和相干解码准备振幅为物镜低次多项式的状态。我们将这种方法重新定义为通过代数同态进行量子态转换。我们将源哈密顿量 $H_A$ 中的 $D$ 次多项式的有效可准备算子状态转移到目标哈密顿量 $H_B=\\pi(H_A)$ 的相应多项式状态，其中 $\\pi$ 是有限维源和目标 $C^*$ 代数之间的单位 $*$ 同态。转换使用算子傅立叶变换和相对解码来恢复源算子而不是单独的术语选择标签。相对距离 $d_{\\mathrm{rel}}$ 是源迹线和目标迹线不一致的第一度。我们证明 $2D<d_{\\mathrm{rel}}$ 相当于保留 $D$ 次多项式之间的所有内积。此外，$d_{\\mathrm{rel}}\\ge d_{\\mathrm{ord}}$，其中$d_{\\mathrm{ord}}$是(H)DQI中使用的普通距离，我们给出$d_{\\mathrm{ord}}=O(1)$但$d_{\\mathrm{rel}}=\\Theta(n)$和高效解码器的族。\n\n我们的框架通过准备源多项式状态的更加模块化的任务取代了复杂的试点状态准备。 DQI 和 HDQI 作为无关系的特殊情况出现。该框架适应非均匀系数和非交换相互作用，并扩展到费米子、量子和玻色子系统，并应用于近似优化和吉布斯采样。作为优势的证据，对于最佳多项式交集的非线性成对变体，其中常数 $d_{\\mathrm{ord}}$ 限制 DQI 式准备，相对解码产生的理想量子分数为 0.643，而最佳测试的经典启发式为 0.606，差距超过 3 个百分点。", "authors": [{"name": "Zhong-Xia Shang"}, {"name": "Daniel Stilck França"}], "featured_authors": [{"name": "Zhong-Xia Shang"}, {"name": "Daniel Stilck França"}], "author_count": 2}, {"id": "2609.35112", "category": "quant-ph", "title": "From Quantum to Classical Dissipative Spin Dynamics", "abstract": "The Landau-Lifshitz-Gilbert (LLG) equation provides the fundamental description of dissipative magnetization dynamics. A recently proposed quantum analog, the quantum Landau-Lifshitz-Gilbert (QLLG) equation, extends this framework to quantum spin systems. However, whether the QLLG equation recovers the LLG equation in the classical large-spin limit for interacting spin systems remains an open question. Here, we demonstrate this connection by deriving the LLG equation as the classical large-spin limit of the QLLG equation. We establish this correspondence analytically and verify it numerically for an interacting spin system. These results provide a quantum-to-classical description of dissipative spin dynamics, offering a microscopic foundation for the LLG equation. From numerical calculations provided here, we also conclude that quantum effects become much less noticeable for systems with larger number of spins in the Hamiltonian.", "url": "https://arxiv.org/abs/2609.35112", "type": "理论+数值", "summary": "Landau-Lifshitz-Gilbert (LLG) 方程提供了耗散磁化动力学的基本描述。最近提出的量子模拟，量子朗道-利夫希茨-吉尔伯特（QLLG）方程，将该框架扩展到量子自旋系统。然而，QLLG 方程能否恢复相互作用自旋系统经典大自旋极限下的 LLG 方程仍然是一个悬而未决的问题。在这里，我们通过推导 LLG 方程作为 QLLG 方程的经典大自旋极限来证明这种联系。我们通过分析建立了这种对应关系，并针对相互作用的自旋系统进行了数值验证。这些结果提供了耗散自旋动力学的量子到经典的描述，为 LLG 方程提供了微观基础。根据此处提供的数值计算，我们还得出结论，对于哈密顿量中自旋数量较多的系统，量子效应变得不那么明显。", "authors": [{"name": "Alireza Ataei"}, {"name": "Leila Ataei"}, {"name": "Olle Eriksson"}, {"name": "Vahid Azimi Mousolou"}], "featured_authors": [{"name": "Alireza Ataei"}, {"name": "Leila Ataei"}, {"name": "Olle Eriksson"}, {"name": "Vahid Azimi Mousolou"}], "author_count": 4}, {"id": "2609.35114", "category": "quant-ph", "title": "Accurate and bounded approximation of quantum correlation functions", "abstract": "The exact classical simulation of non-integrable quantum systems rapidly becomes intractable beyond small system sizes, yet its role is central to predicting many-body dynamics. Approximate methods alleviate this cost but typically lack rigorous guarantees on their deviation from the exact result. For the infinite-temperature correlation function, we derive a rigorous error bound for approximating the full dynamics within a computable finite-sized region. Applied to autocorrelations, this finite-region approach is especially accurate across one-dimensional systems and beyond, and can further provide rigorous error bounds for other approximate methods, demonstrated here for matrix-product-operator simulations.", "url": "https://arxiv.org/abs/2609.35114", "type": "理论+数值", "summary": "不可积量子系统的精确经典模拟在小系统尺寸之外很快变得棘手，但它的作用对于预测多体动力学至关重要。近似方法可以减轻这种成本，但通常缺乏对其与准确结果的偏差的严格保证。对于无限温度相关函数，我们推导了严格的误差界，用于近似可计算的有限大小区域内的完整动态。应用于自相关时，这种有限区域方法在一维系统及其他系统中特别准确，并且可以进一步为其他近似方法提供严格的误差界限，此处针对矩阵乘积算子模拟进行了演示。", "authors": [{"name": "Alexander van Lomwel"}, {"name": "Florian Mintert"}], "featured_authors": [{"name": "Alexander van Lomwel"}, {"name": "Florian Mintert"}], "author_count": 2}, {"id": "2609.35129", "category": "quant-ph", "title": "Asymptotically Good Quantum Codes with Addressable Transversal T Gates", "abstract": "Designing quantum codes with both transversal non-Clifford gates and good error-correcting parameters is an important goal in fault-tolerant quantum computation. Here, we construct an explicit family of binary CSS codes with constant rate and linear distance that admit fully addressable transversal $T$ gates. Specifically, any prescribed tensor product of logical powers of $T$ is implemented by a tensor product of physical powers of $T$, without any subsequent correction. Our construction combines algebraic-geometry codes with suitable binary embedding to obtain generalized divisibility of binary codes. This divisibility then enables fully addressable transversal $T$ gates. Furthermore, we formulate the minimum binary embedding length problem as a minimum-weight problem over an affine space and numerically improve the constants in the asymptotic rate and relative-distance bounds.", "url": "https://arxiv.org/abs/2609.35129", "type": "理论+数值", "summary": "设计具有横向非克利福德门和良好纠错参数的量子代码是容错量子计算的一个重要目标。在这里，我们构建了一个具有恒定速率和线性距离的显式二进制 CSS 代码族，允许完全可寻址的横向 $T$ 门。具体来说，任何规定的 $T$ 逻辑幂的张量积都由 $T$ 物理幂的张量积来实现，无需任何后续修正。我们的构造将代数几何代码与适当的二进制嵌入相结合，以获得二进制代码的广义整除性。这种可分性使得完全可寻址的横向 $T$ 门成为可能。此外，我们将最小二元嵌入长度问题表述为仿射空间上的最小权重问题，并在数值上改进渐近率和相对距离界限中的常数。", "authors": [{"name": "Tongyin Lin"}, {"name": "Bujiao Wu"}, {"name": "Bin Cheng"}], "featured_authors": [{"name": "Tongyin Lin"}, {"name": "Bujiao Wu"}, {"name": "Bin Cheng"}], "author_count": 3}, {"id": "2609.35131", "category": "quant-ph", "title": "The Overlap Gap Property: Separating Quantum and Quantum-Inspired Approximate Optimization Algorithms", "abstract": "In this paper, we prove that the Mean-Field Approximate Optimization Algorithm (MF-AOA), a quantum-inspired classical algorithm of the Quantum Approximate Optimization Algorithm (QAOA), is unable to give arbitrary near optimal solution for problems exhibiting the Overlap Gap Property (OGP). We show this by relating the MF-AOA to finite-memory Approximate Message Passing (AMP) algorithms, which are known to be limited in performance by the OGP. Thus, our paper argues that problems exhibiting the OGP are one such instance where the QAOA can outperform the MF-AOA and AMP algorithms in general. We supplement this by numerically simulating the performance of the QAOA on instances of Max-$4$-XORSAT that exhibit the OGP and find that the QAOA is able to surpass the barrier, while our finite-size scaling analysis favors a super-polynomial over a polynomial depth dependence. In addition, we observe a non-differentiable point in the performance of the QAOA near by the OGP barrier, where the optimal QAOA parameters change from an adiabatic to a non-adiabatic schedule.", "url": "https://arxiv.org/abs/2609.35131", "type": "数值", "summary": "在本文中，我们证明平均场近似优化算法（MF-AOA）是量子近似优化算法（QAOA）的量子启发经典算法，无法对表现出重叠间隙性质（OGP）的问题给出任意近最优解。我们通过将 MF-AOA 与有限内存近似消息传递 (AMP) 算法联系起来来展示这一点，已知该算法的性能受到 OGP 的限制。因此，我们的论文认为，展示 OGP 的问题就是 QAOA 总体上优于 MF-AOA 和 AMP 算法的例子。我们通过在呈现 OGP 的 Max-$4$-XORSAT 实例上对 QAOA 的性能进行数值模拟来补充这一点，并发现 QAOA 能够超越障碍，而我们的有限尺寸缩放分析更倾向于超多项式而不是多项式深度依赖性。此外，我们在 OGP 势垒附近观察到 QAOA 性能的不可微分点，其中最佳 QAOA 参数从绝热方案变为非绝热方案。", "authors": [{"name": "Mark Goh"}, {"name": "Thorge Müller"}], "featured_authors": [{"name": "Mark Goh"}, {"name": "Thorge Müller"}], "author_count": 2}, {"id": "2609.35159", "category": "quant-ph", "title": "Weakly interacting fermionic Gibbs states are Gaussian mixtures and classically simulable", "abstract": "Identifying regimes in which interacting fermionic systems admit efficient classical simulation is a crucial task in quantum many-body physics. In this work, we rigorously establish the Gaussianity and classical simulability of sufficiently weakly interacting fermions. For the Gibbs state of a local interacting fermionic Hamiltonian $H=H_0+V$ at any finite temperature and in any spatial dimension, where $H_0$ is quadratic and $V$ is the interaction term, we show that there exists a positive interaction strength below which the Gibbs state is a convex mixture of fermionic Gaussian states. Moreover, based on this structure, we construct a polynomial-time classical sampler for the Gibbs state via Metropolis updates on a tree whose leaves are Gaussian states.", "url": "https://arxiv.org/abs/2609.35159", "type": "理论+数值", "summary": "识别相互作用的费米子系统允许有效经典模拟的机制是量子多体物理学中的一项关键任务。在这项工作中，我们严格建立了足够弱相互作用的费米子的高斯性和经典可模拟性。对于任何有限温度和任何空间维度下局部相互作用费米子哈密顿量 $H=H_0+V$ 的吉布斯态，其中 $H_0$ 是二次项，$V$ 是相互作用项，我们证明存在正相互作用强度，低于该强度吉布斯态是费米高斯态的凸混合。此外，基于这种结构，我们通过对叶子为高斯状态的树进行Metropolis更新，构建了吉布斯状态的多项式时间经典采样器。", "authors": [{"name": "Zhengyi Han"}, {"name": "Yuanchen Zhao"}, {"name": "Zi-Wen Liu"}], "featured_authors": [{"name": "Zhengyi Han"}, {"name": "Yuanchen Zhao"}, {"name": "Zi-Wen Liu"}], "author_count": 3}, {"id": "2609.35237", "category": "quant-ph", "title": "A technological capability scale for civilizations from the Kardashev and Barrow scales", "abstract": "We introduce a technological capability scale that ranks civilizations by the control operations they can perform per second. A control operation is defined as setting one binary degree of freedom of matter to a specified value, whatever its previous state. Building on constructor theory, we sort them into construction and its special cases on information media, namely processing, storage and transfer. The index $\\Xi = K + B$ adds to the Kardashev index $K$ an efficiency index $B$ of energy per operation, measured from the thermal floor at the microwave background temperature. The Kardashev scale gives the ceiling for resets of thermally random bits with heat radiated into the present sky, and the Barrow scale gives the floor, which for such a reset is the thermal floor at the heat-rejection temperature at every level. Since 1950 the energy per logic operation has fallen 11.7 orders of magnitude, around 5 through miniaturization. Humanity, at $K = 0.73$, computes with CMOS logic gates at $B = -0.78$ in primary energy. We describe the ultimate technology, at $\\Xi = 7.58$, which would dissipate the conjectured largest power $c^5/4G$ into an uncharged, non-rotating black hole near its largest mass in de Sitter space.", "url": "https://arxiv.org/abs/2609.35237", "type": "理论", "summary": "我们引入了一种技术能力等级，根据文明每秒可以执行的控制操作对文明进行排名。控制操作被定义为将物质的一个二元自由度设置为指定值，无论其先前状态如何。基于建构子理论，我们将它们分为建构及其在信息媒体上的特例，即处理、存储和传输。指数 $\\Xi = K + B$ 在卡尔达舍夫指数 $K$ 的基础上添加了每次操作的能量效率指数 $B$，该效率指数是在微波背景温度下从热地板测量的。卡尔达肖夫尺度给出了热随机位重置的上限，其中热量辐射到当前天空中，而巴罗尺度给出了下限，对于这种重置来说，下限是每个级别的热排斥温度下的热下限。自 1950 年以来，通过小型化，每个逻辑操作的能量下降了 11.7 个数量级，约为 5 个数量级。人类在 $K = 0.73$ 时，使用 CMOS 逻辑门在 $B = -0.78$ 的初级能源中进行计算。\n\n我们描述了终极技术，$\\Xi = 7.58$，它将把推测的最大功率 $c^5/4G$ 耗散到德西特空间中接近其最大质量的不带电、非旋转黑洞中。", "authors": [{"name": "Volkan Gurses"}], "featured_authors": [{"name": "Volkan Gurses"}], "author_count": 1}, {"id": "2609.35239", "category": "quant-ph", "title": "Computational Complexity of Clifford Template Compilation: Are Quantum Computers Useful for Compiling Quantum Circuits?", "abstract": "A Clifford template is a finite ordered family of repeatable Clifford operations, and an instantiation specifies how many times each operation is applied. The Clifford template compilation problem asks how to choose these repetition numbers so that the template realizes a target transformation of Pauli operators. This problem arises, for example, when searching for logical operations in quantum error correction using only Clifford operations permitted by physical or fault-tolerance constraints. Although forward Clifford dynamics is efficiently classically simulable, this inverse problem has sharp complexity transitions. For commuting templates with unrestricted integer exponents, feasibility lies in $\\mathrm{NP}\\cap\\mathrm{BQP}$ and a constructive quantum algorithm returns a particular solution together with the full exponent-relation lattice; already at $k=1$, recovering the repetition number contains finite-field discrete logarithm over $\\mathbb{F}_{2^r}^{\\times}$. In general, restricting every exponent to $\\{0,1\\}$ removes the Abelian-group closure and makes feasibility NP-complete for variable $k$, even for exactly commuting CNOT-only operations and X-type Paulis. For commuting self-inverse Clifford actions, both binary feasibility and recovery of one solution are classically polynomial-time solvable, but imposing a bound on the total repetition count is NP-complete, even for CNOT-only operations. These results reveal a rich complexity landscape within Clifford template compilation, spanning classically tractable cases, problems admitting quantum polynomial-time algorithms, and NP-complete variants.", "url": "https://arxiv.org/abs/2609.35239", "type": "理论+数值", "summary": "Clifford 模板是可重复 Clifford 操作的有限有序族，实例化指定每个操作应用的次数。 Clifford模板编译问题问的是如何选择这些重复数，使得模板实现Pauli算子的目标变换。例如，当仅使用物理或容错约束允许的 Clifford 运算来搜索量子纠错中的逻辑运算时，就会出现此问题。尽管正向克利福德动力学可以有效地进行经典模拟，但这个反问题具有急剧的复杂性转变。对于具有不受限制的整数指数的交换模板，可行性在于 $\\mathrm{NP}\\cap\\mathrm{BQP}$ 并且构造性量子算法返回特定的解决方案以及完整的指数关系格；已经在 $k=1$ 处，恢复重复次数包含 $\\mathbb{F}_{2^r}^{\\times}$ 上的有限域离散对数。一般来说，将每个指数限制为 $\\{0,1\\}$ 会删除阿贝尔群闭包，并使变量 $k$ 的可行性 NP 完全，即使对于精确交换仅 CNOT 操作和 X 型 Paulis 也是如此。\n\n对于交换自反 Clifford 动作，一个解的二元可行性和恢复都是经典的多项式时间可解的，但对总重复计数施加限制是 NP 完全的，即使对于仅 CNOT 操作也是如此。这些结果揭示了 Clifford 模板编译中丰富的复杂性景观，涵盖经典可处理的情况、承认量子多项式时间算法的问题和 NP 完全变体。", "authors": [{"name": "Keisuke Fujii"}], "featured_authors": [{"name": "Keisuke Fujii"}], "author_count": 1}, {"id": "2609.35271", "category": "quant-ph", "title": "Generalized LIMDDs: Succinctness and Canonicity for Decision Diagrams Modulo a Group", "abstract": "A reduced ordered decision diagram is the minimal automaton of a function on words of fixed length: its nodes are the residuals, and reduction is the Myhill--Nerode quotient. We study what happens when that quotient is coarsened by a group. Fix a group $G$ acting on residuals, merge two nodes when their residuals lie in one $G$-orbit, and record the group element on the edge. For functions $\\{0,1\\}^n\\to\\mathbb{C}$ and $G$ the Pauli group this is the Local Invertible Map Decision Diagram. We take $G$ from the two-parameter family generated by $C^{\\leq k}R_q$, the phase rotation of order $q$ with up to $k$ control qubits, with and without the bit flip $X$. We show that this gives exponential succinctness improvements compared to Pauli-LIMDD, and we determine the succinctness order of the family completely. The separating objects are hypergraph states, which can always be efficiently represented by some member of the family. We settle the tractability of five queries and eight transformations, which is invariant across the family, and shows the same behavior as Pauli-LIMDD. We give a five-rule reduction system whose normal forms are unique for every member of the family, and we show that this canonical form is computable in polynomial time in the size of the LIMDD. We show that, when coarsening beyond the (anti-)diagonal groups, the calculation of a minimal sized normal form turns out to be non-local and it might to rebuild the whole diagram.", "url": "https://arxiv.org/abs/2609.35271", "type": "理论+数值", "summary": "降序决策图是固定长度词上函数的最小自动机：它的节点是残差，约简是 Myhill--Nerode 商。我们研究当这个商被一个群体粗化时会发生什么。固定一组作用于残差的$G$，当两个节点的残差位于一个$G$轨道上时合并两个节点，并记录边上的组元素。对于函数 $\\{0,1\\}^n\\to\\mathbb{C}$ 和 $G$ 泡利群，这是局部可逆映射决策图。我们从 $C^{\\leq k}R_q$ 生成的二参数族中取出 $G$，$q$ 阶的相位旋转，最多 $k$ 个控制量子位，有或没有位翻转 $X$。我们证明，与 Pauli-LIMDD 相比，这给出了指数简洁性改进，并且我们完全确定了族的简洁性顺序。分离的对象是超图状态，它们总是可以由家族的某些成员有效地表示。我们解决了五个查询和八个转换的易处理性，这在整个系列中是不变的，并且表现出与 Pauli-LIMDD 相同的行为。\n\n我们给出了一个五规则归约系统，其范式对于家庭中的每个成员都是唯一的，并且我们证明了这种规范形式可以在 LIMDD 大小的多项式时间内计算。我们表明，当粗化超出（反对）对角组时，最小尺寸范式的计算结果是非局部的，并且可能会重建整个图。", "authors": [{"name": "Arend-Jan Quist"}, {"name": "Alexis de Colnet"}, {"name": "Thomas Reps"}, {"name": "Alfons Laarman"}], "featured_authors": [{"name": "Arend-Jan Quist"}, {"name": "Alexis de Colnet"}, {"name": "Thomas Reps"}, {"name": "Alfons Laarman"}], "author_count": 4}, {"id": "2609.35282", "category": "quant-ph", "title": "Circuit-level benchmarks of GKP-concatenated qLDPC Codes", "abstract": "Scalable fault-tolerant quantum error correction based on Gottesman-Kitaev-Preskill (GKP) codes requires finite-rate outer codes that can exploit analog GKP information under realistic circuit noise. However, quantum low-density parity-check (qLDPC) outer codes have not been systematically compared as candidates for circuit-level GKP concatenation. Here, we benchmark BB and tricycle codes using a unified simulation framework that progresses from code-capacity noise to repeated noisy syndrome extraction and schedule-resolved displacement propagation. Across all three noise models, analog-informed belief-propagation with ordered-statistics decoding (BP-OSD) yields higher finite-size crossing estimates than hard-decision decoding. In the full circuit model, the analog-informed crossings are \\(\\sigma_{\\mathrm{th}}\\simeq0.212\\) for the selected BB sequence and \\(0.142\\) for the tricycle sequence, corresponding to squeezing requirements of approximately \\(10.46\\,\\mathrm{dB}\\) and \\(13.94\\,\\mathrm{dB}\\), respectively. These results show that analog GKP information continues to improve decoding under circuit-level noise. Under the common simulation assumptions used here, the selected BB sequence also yields a higher finite-size crossing estimate than the selected tricycle sequence.", "url": "https://arxiv.org/abs/2609.35282", "type": "理论+数值", "summary": "基于 Gottesman-Kitaev-Preskill (GKP) 码的可扩展容错量子纠错需要有限速率的外部码，该外部码可以在实际电路噪声下利用模拟 GKP 信息。然而，量子低密度奇偶校验（qLDPC）外码尚未作为电路级 GKP 级联的候选码进行系统比较。在这里，我们使用统一的模拟框架对 BB 和三轮车代码进行基准测试，该框架从代码容量噪声发展到重复噪声综合症提取和调度解析的位移传播。在所有三种噪声模型中，具有有序统计解码（BP-OSD）的模拟信息置信传播比硬决策解码产生更高的有限大小交叉估计。在完整电路模型中，所选 BB 序列的模拟通知交叉点为 \\(\\sigma_{\\mathrm{th}}\\simeq0.212\\)，三轮序列的模拟交叉点为 \\(0.142\\)，分别对应于大约 \\(10.46\\,\\mathrm{dB}\\) 和 \\(13.94\\,\\mathrm{dB}\\) 的压缩要求。这些结果表明，模拟 GKP 信息在电路级噪声下继续改进解码。\n\n在此处使用的常见模拟假设下，所选的 BB 序列还比所选的三轮车序列产生更高的有限大小交叉估计。", "authors": [{"name": "Yuan Yao"}, {"name": "Ruipeng Xing"}, {"name": "Jianshuo Gao"}, {"name": "Xiao Yuan"}], "featured_authors": [{"name": "Yuan Yao"}, {"name": "Ruipeng Xing"}, {"name": "Jianshuo Gao"}, {"name": "Xiao Yuan"}], "author_count": 4}, {"id": "2609.35327", "category": "quant-ph", "title": "Distributional Variants of the Aaronson-Ambainis Conjecture", "abstract": "A longstanding conjecture in quantum complexity theory asserts that, under the uniform input distribution, quantum query algorithms can be polynomially simulated by classical query algorithms. More precisely, the acceptance probability of any quantum query algorithm can be approximated, on average over uniformly random inputs, by a classical query algorithm, with only polynomial query overhead. The conjecture is central to understanding whether exponential quantum advantages for decision problems necessarily rely on additional structure. We study analogues of this conjecture under other natural input distributions and prove that they are all equivalent to the original uniform-distribution conjecture. We first consider the product distribution $\\mu_p$, where the input bits are independent Bernoulli variables with fixed bias $p$. We show that for every fixed $p \\in (0, 1)$, quantum query algorithms under the $\\mu_p$ distribution admit polynomial-overhead classical simulations if and only if the same holds under the uniform distribution. Second, we consider the distribution $\\nu_p$ that is uniform over the slice of strings with Hamming weight $\\lfloor pn \\rfloor$ and prove a similar equivalence for the $\\nu_p$ distribution and the uniform distribution. The Aaronson-Ambainis conjecture is a stronger statement that implies the above-mentioned conjecture and is formulated in terms of bounded low-degree polynomials on the Boolean hypercube. It asserts that under the uniform distribution, any such polynomial with nonnegligible variance must have an influential variable. We formulate analogues of this conjecture, where the underlying distribution is a biased product distribution or a uniform distribution over a slice, and prove that all these variants are equivalent to the original Aaronson-Ambainis conjecture.", "url": "https://arxiv.org/abs/2609.35327", "type": "理论+数值", "summary": "量子复杂性理论中的一个长期猜想认为，在均匀输入分布下，量子查询算法可以通过经典查询算法进行多项式模拟。更准确地说，任何量子查询算法的接受概率都可以通过经典查询算法在均匀随机输入的平均上进行近似，仅需要多项式查询开销。该猜想对于理解决策问题的指数量子优势是否必然依赖于额外的结构至关重要。我们研究了其他自然输入分布下该猜想的类似情况，并证明它们都等价于原始均匀分布猜想。我们首先考虑乘积分布 $\\mu_p$，其中输入位是具有固定偏差 $p$ 的独立伯努利变量。我们证明，对于每个固定的 $p \\in (0, 1)$，当且仅当在均匀分布下同样成立时，$\\mu_p$ 分布下的量子查询算法才允许多项式开销经典模拟。\n\n其次，我们考虑在汉明权重 $\\lfloor pn \\rfloor$ 的字符串切片上均匀分布 $\\nu_p$ ，并证明 $\\nu_p$ 分布和均匀分布的类似等价性。 Aaronson-Ambainis 猜想是一个更强的陈述，暗示了上述猜想，并且是用布尔超立方体上的有界低次多项式来表述的。它断言，在均匀分布下，任何具有不可忽略方差的多项式都必须有一个有影响力的变量。我们制定了该猜想的类似物，其中基础分布是有偏乘积分布或切片上的均匀分布，并证明所有这些变体等价于原始的 Aaronson-Ambainis 猜想。", "authors": [{"name": "Uma Girish"}, {"name": "Kunal Mittal"}, {"name": "Barak Nehoran"}, {"name": "Ran Raz"}], "featured_authors": [{"name": "Uma Girish"}, {"name": "Kunal Mittal"}, {"name": "Barak Nehoran"}, {"name": "Ran Raz"}], "author_count": 4}, {"id": "2609.35339", "category": "quant-ph", "title": "Zero Knowledge Proofs in Quantum Networks", "abstract": "Zero-knowledge proofs (ZKPs) enable the verification of a statement without revealing any information beyond its validity and constitute a fundamental primitive in cryptography and information theory. However, existing constructions rely on computational assumptions and are predominantly confined to bipartite settings, leaving their information-theoretic realization in bipartite or network scenarios largely unexplored. Here we develop a framework for zero-knowledge verification based on the indistinguishability of quantum states under operational constraints. Exploiting the fundamental limitations imposed by local operations, we show that a verifier is inherently restricted from extracting information about the underlying state while retaining the ability to verify correctness. We construct explicit protocols for multiparty quantum networks that achieve information-theoretic security, ensuring that no subset of collaborating parties can gain knowledge beyond the validity of the statement, independent of their joint computational power.", "url": "https://arxiv.org/abs/2609.35339", "type": "理论", "summary": "零知识证明（ZKP）可以验证声明，而不会泄露超出其有效性的任何信息，并构成密码学和信息论的基本原语。然而，现有的结构依赖于计算假设，并且主要局限于二分设置，使得它们在二分或网络场景中的信息论实现很大程度上未被探索。在这里，我们基于操作约束下量子态的不可区分性，开发了一个零知识验证框架。利用本地操作所施加的基本限制，我们表明验证者在提取有关底层状态的信息时受到本质限制，同时保留验证正确性的能力。我们为多方量子网络构建显式协议，以实现信息论安全，确保合作方的任何子集都无法获得超出声明有效性的知识，而与他们的联合计算能力无关。", "authors": [{"name": "Tuhin Paul"}, {"name": "Srijani Das"}, {"name": "Manasi Patra"}, {"name": "Ramij Rahaman"}], "featured_authors": [{"name": "Tuhin Paul"}, {"name": "Srijani Das"}, {"name": "Manasi Patra"}, {"name": "Ramij Rahaman"}], "author_count": 4}, {"id": "2609.35399", "category": "quant-ph", "title": "Heuristic lower bounds on real Grothendieck constants of finite and infinite order", "abstract": "We propose candidate lower bounds on the real Grothendieck constants $K_{\\mathrm G}(d)$ and their infinite-dimensional limit $K_{\\mathrm G}$ using rotationally invariant cubic kernels. For the continuous construction, we identify an explicit threshold above which hemispherical binary strategies are unstable under cubic boundary deformations. Supported by numerical evidence, we conjecture that hemispherical strategies are globally optimal at this threshold. This conjecture would imply $K_{\\mathrm G}\\geq9\\pi/16\\simeq1.767146$, improving the rigorous lower bound $6\\pi/11\\simeq1.713596$. We also construct finite symmetric coefficient matrices from unit vectors in dimensions up to $24$. Large-scale see-saw optimization supports the continuous predictions and suggests improved lower bounds on $K_{\\mathrm G}(d)$ in the studied dimensions from $4$ to $24$, conditional on the conjectured binary optima being exact. Selected matrices also yield finite-setting candidate dimension witnesses when interpreted as bipartite correlation Bell functionals. If the corresponding binary upper bounds hold, these witnesses would certify a local Hilbert-space dimension of at least five for each party.", "url": "https://arxiv.org/abs/2609.35399", "type": "理论+数值", "summary": "我们使用旋转不变立方核提出实格罗滕迪克常数 $K_{\\mathrm G}(d)$ 及其无限维极限 $K_{\\mathrm G}$ 的候选下界。对于连续构造，我们确定了一个明确的阈值，高于该阈值半球形二元策略在立方边界变形下不稳定。在数值证据的支持下，我们推测半球策略在此阈值下是全局最优的。这个猜想意味着 $K_{\\mathrm G}\\geq9\\pi/16\\simeq1.767146$，改进了严格的下限 $6\\pi/11\\simeq1.713596$。我们还从维度高达 24 美元的单位向量构造有限对称系数矩阵。大规模跷跷板优化支持连续预测，并建议在 $4$ 到 $24$ 的研究维度中改进 $K_{\\mathrm G}(d)$ 的下限，条件是推测的二元最优值准确。当解释为二部相关贝尔泛函时，选定的矩阵也会产生有限设置的候选维度见证。如果相应的二进制上限成立，这些见证人将证明各方的局部希尔伯特空间维度至少为 5。", "authors": [{"name": "Erika Bene"}, {"name": "Tamás Vértesi"}], "featured_authors": [{"name": "Erika Bene"}, {"name": "Tamás Vértesi"}], "author_count": 2}, {"id": "2609.35403", "category": "quant-ph", "title": "Dilation theorem for continuum quantum stochastic processes", "abstract": "Connecting mathematical formalism in open quantum systems to its underlying physics necessitates the notion of a dilation, a way to bridge stochastic dynamics with deterministic Schrödinger evolution on a larger space. Although dilations are well known in the literature for states, channels, and quantum combs, there is a substantial gap when it comes to the fully general setting of non-Markovian dynamics on a continuous interval. In an accompanying work, we introduce a continuous process tensor (cPT) framework wherein these processes are represented by vectors in multi-species bosonic Fock spaces of $L^2$ functions. This accommodates all multi-time statistics of a quantum system on an interval. Here, we present a corresponding dilation theorem and show that all cPTs can be approximated arbitrarily well by an explicit closed description with system and environment coupled by a bounded Hamiltonian. As well as its physical appeal and demonstrating completeness of the framework, we show that such regular representations actually underpin the formalism, defining a dense subspace of all cPTs that is easy to handle. This leads to a continuum-suitable version of Choi duality, and permits the rigorous treatment of continuum controls.", "url": "https://arxiv.org/abs/2609.35403", "type": "理论", "summary": "将开放量子系统中的数学形式主义与其基础物理联系起来需要膨胀的概念，这是一种在更大的空间上连接随机动力学与确定性薛定谔演化的方法。尽管膨胀在状态、通道和量子梳的文献中是众所周知的，但当涉及到连续区间上的非马尔可夫动力学的完全一般设置时，还存在很大的差距。在随附的工作中，我们引入了连续过程张量（cPT）框架，其中这些过程由 $L^2$ 函数的多物种玻色 Fock 空间中的向量表示。这容纳了量子系统在某个时间间隔上的所有多时间统计数据。在这里，我们提出了相应的膨胀定理，并表明所有 cPT 都可以通过系统和环境由有界哈密顿量耦合的显式封闭描述来任意近似。除了它的物理吸引力和展示框架的完整性之外，我们还表明这种正则表示实际上支撑了形式主义，定义了所有易于处理的 cPT 的密集子空间。\n\n这导致了 Choi 对偶性的连续体适用版本，并允许严格处理连续体控制。", "authors": [{"name": "Jonáš Fuksa"}, {"name": "Clara Wassner"}, {"name": "Jens Eisert"}, {"name": "Gregory A. L. White"}], "featured_authors": [{"name": "Jonáš Fuksa"}, {"name": "Clara Wassner"}, {"name": "Jens Eisert"}, {"name": "Gregory A. L. White"}], "author_count": 4}, {"id": "2609.35446", "category": "quant-ph", "title": "Fixed-Time Gaussian State Transfer via Collective Dissipation in a Fully Static Architecture", "abstract": "We establish a fully static, dissipation-only primitive for Gaussian state transfer in which collective coupling to a shared environment fixes a single transfer time without coherent transport or time-dependent control. The dynamics close in a bright--dark decomposition, yielding an analytic transfer time $t^{*} = \\pi / g_{a}$ and a real interference factor that eliminates dynamical phase accumulation, so that all phase sensitivity arises solely from the Gaussian fidelity metric. This defines a fixed-time Gaussian communication channel in which dissipation mediates information transfer without active control. Ensemble analysis shows that channel performance remains robust to amplitude-level asymmetries, which act as uniform-rate dressing, whereas phase-level system detuning disrupts the fixed-time mechanism via dynamical phase winding and produces revival behavior. Incorporating finite Ornstein--Uhlenbeck memory via a zeroth-order O-operator expansion yields only rate and phase renormalization without introducing new dynamical pathways. In the fast-memory regime, environmental correlations are rapidly suppressed, rendering the channel insensitive to environmental detuning and restoring the Markovian limit. These results show that collective dissipation alone is sufficient to support fixed-time Gaussian state transfer, challenging the assumption that coherent transport or active control are required for continuous-variable communication.", "url": "https://arxiv.org/abs/2609.35446", "type": "理论+数值", "summary": "我们为高斯状态转移建立了一个完全静态的、仅耗散的原语，其中与共享环境的集体耦合固定了单个转移时间，而无需相干传输或时间相关控制。动态在明暗分解中接近，产生解析传输时间 $t^{*} = \\pi / g_{a}$ 和消除动态相位累积的实际干扰因子，以便所有相位灵敏度仅由高斯保真度度量产生。这定义了一个固定时间高斯通信信道，其中耗散在没有主动控制的情况下介导信息传输。集成分析表明，通道性能对于幅度级不对称仍然具有鲁棒性，这起到均匀速率修整的作用，而相位级系统失谐通过动态相位缠绕破坏固定时间机制并产生恢复行为。通过零阶 O 算子展开结合有限的 Ornstein--Uhlenbeck 存储器，仅产生速率和相位重正化，而无需引入新的动力学路径。\n\n在快速记忆机制中，环境相关性被迅速抑制，使通道对环境失谐不敏感并恢复马尔可夫极限。这些结果表明，仅集体耗散就足以支持固定时间高斯状态转移，挑战了连续变量通信需要相干传输或主动控制的假设。", "authors": [{"name": "Austen Couvertier"}, {"name": "Ting Yu"}], "featured_authors": [{"name": "Austen Couvertier"}, {"name": "Ting Yu"}], "author_count": 2}, {"id": "2609.35447", "category": "quant-ph", "title": "Efficient classical algorithm for estimating linear statistics of Boson Sampling", "abstract": "Boson Sampling is a prominent candidate for the demonstration of quantum computational advantage but it remains unclear whether a large-scale boson sampler can find useful computational applications. The challenge is that to use a boson sampler to estimate, for example, a physical observable, it is necessary to coarse grain the outcome distribution, owing to the exponential size of the outcome space and the anti-concentration properties of the Boson Sampling distribution. In this work, we analyse the complexity of a specific type of coarse-graining of Boson Sampling distributions based on linear functions of the output photon occupation numbers, which we refer to as linear statistics. We present an efficient classical algorithm for approximating linear statistics of boson samplers within additive error for different kinds of input states, such as Fock states and squeezed states. This allows us to unify in the same framework recent results on efficient quantum-inspired classical algorithms for simulating molecular vibronic spectra, or efficient classical approximations of coarse-grained distributions based on detector binning. Additionally, we show how our algorithm can be used to classically evaluate a proposed one-way function based on Boson Sampling, while other proposals for cryptographic applications escape our classical simulation techniques. We leave open the question of classical simulability of non-linear statistics and connect it to the problem of computing transition amplitudes of linear-optical circuits with one layer of interactions.", "url": "https://arxiv.org/abs/2609.35447", "type": "数值", "summary": "玻色子采样是展示量子计算优势的一个重要候选者，但目前尚不清楚大规模玻色子采样器是否可以找到有用的计算应用。挑战在于，要使用玻色子采样器来估计物理可观测值等，由于结果空间的指数大小和玻色子采样分布的反集中特性，有必要对结果分布进行粗粒度化。在这项工作中，我们基于输出光子占用数的线性函数（我们将其称为线性统计）来分析特定类型的粗粒度玻色子采样分布的复杂性。我们提出了一种有效的经典算法，用于在不同类型的输入状态（例如福克状态和压缩状态）的加性误差内近似玻色子采样器的线性统计。这使我们能够在同一框架中统一用于模拟分子振动光谱的有效量子启发经典算法的最新结果，或基于探测器分箱的粗粒度分布的有效经典近似。\n\n此外，我们还展示了如何使用我们的算法来经典评估基于玻色子采样的单向函数，而密码应用的其他建议则逃脱了我们的经典模拟技术。我们保留了非线性统计的经典可模拟性问题，并将其与计算具有一层相互作用的线性光学电路的跃迁幅度的问题联系起来。", "authors": [{"name": "Benoit Seron"}, {"name": "Hugo Thomas"}, {"name": "Eduardo Araujo"}, {"name": "Alex Arkhipov"}, {"name": "Changhun Oh"}, {"name": "Leonardo Novo"}], "featured_authors": [{"name": "Benoit Seron"}, {"name": "Hugo Thomas"}, {"name": "Eduardo Araujo"}, {"name": "Alex Arkhipov"}, {"name": "Changhun Oh"}, {"name": "Leonardo Novo"}], "author_count": 6}, {"id": "2609.35484", "category": "quant-ph", "title": "Improving the Stability of the Hierarchical Equations of Motion for Open Quantum Systems with Strong Coupling to Structured Bosonic Baths", "abstract": "The hierarchical equations of motion (HEOM) approach is one of the most powerful methods avail- able to simulate the dynamics of open quantum systems. Although the HEOM approach has been shown to be stable and efficient in many parameter regimes and physical scenarios, it is also well known that the unavoidable finite truncation of the hierarchy can lead to fundamental numeri- cal instabilities for bosonic environments. In this work, we apply recently developed techniques to analyze these issues. We use an auxiliary Fock-space picture of the hierarchy to first identify the unbalanced hierarchy-raising terms responsible for the strong transient amplification associated with the non-normal algebraic structure of the HEOM generator. We then apply a non-unitary similarity transformation that converts these terms into balanced combinations of hierarchy-raising and hierarchy-lowering terms, thereby suppressing their numerical impact. We first demonstrate the efficacy of this approach via a spin-boson model with a simple Brownian oscillator spectral den- sity and subsequently extend the analysis to a
