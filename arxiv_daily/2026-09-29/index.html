L 框架内采用 Schwinger-Keldysh 路径积分形式，推导出任意时间的累积生成函数的解析表达式，并获得长期极限下的 Levitov-Lesovik 型公式，该公式是先前为稳态下的边界驱动设置推导的。对于具有短程或长程跳跃的干净晶格，支持单粒子离域本征态，我们表明所有累积量在渐进状态下随时间线性增长。我们的分析结果与直接数值模拟非常吻合。\n\n这些发现建立了一个通用框架，用于表征具有局部粒子注入的驱动开放费米子系统中的 FCS 和量子涨落。", "authors": [{"name": "Bijay Kumar Agarwalla"}, {"name": "Manas Kulkarni"}], "featured_authors": [{"name": "Bijay Kumar Agarwalla"}, {"name": "Manas Kulkarni"}], "author_count": 2}, {"id": "2609.33751", "category": "cond-mat", "title": "Non-stationary Statistics and Energetics of Brownian Motion under Stochastic Harmonic Confinement", "abstract": "We investigate the positional statistics and thermodynamic properties of a Brownian particle confined in a Harmonic trap. The stiffness of the particle fluctuates in time as the square of the Brownian process. First, in the absence of a thermal bath, we investigate the probability density function of the position of the particle at time $t$. Then, we provide an expression to compute the $n$th positional moment. We evaluate the first four positional moments and discuss their asymptotic behavior in the long-time limit. In contrast to previously studied models of fluctuating stiffness, the current model describes a non-stationary process. Furthermore, we provide the exact expression for the average work performed on the system and the average heat exchanged by the particle with the bath. Their long time behavior again reflects the non-stationary nature of the process. Our theoretical predictions are supported by numerical simulations.", "url": "https://arxiv.org/abs/2609.33751", "type": "理论+数值", "summary": "我们研究了谐波陷阱中布朗粒子的位置统计和热力学性质。粒子的刚度随时间波动为布朗过程的平方。首先，在没有热水浴的情况下，我们研究粒子在时间 $t$ 时位置的概率密度函数。然后，我们提供一个表达式来计算第 $n$ 个位置矩。我们评估前四个位置矩并讨论它们在长时间限制下的渐近行为。与之前研究的脉动刚度模型相比，当前模型描述了非平稳过程。此外，我们还提供了系统上执行的平均功以及颗粒与浴槽交换的平均热量的精确表达式。它们的长时间行为再次反映了过程的非平稳性质。我们的理论预测得到了数值模拟的支持。", "authors": [{"name": "Deepak Gupta"}, {"name": "Sabine H. L. Klapp"}], "featured_authors": [{"name": "Deepak Gupta"}, {"name": "Sabine H. L. Klapp"}], "author_count": 2}, {"id": "2609.33777", "category": "cond-mat", "title": "Scaling Theory for Learning Low-Energy Quantum Subspaces", "abstract": "Phase diagrams and energy surfaces require low-energy states across a family of Hamiltonians, but solving each parameter point independently is prohibitively expensive. An important question is not how a single labeled eigenstate behaves under parameter variation, but how much information about the low-energy sector is contained in a small set of reference wavefunctions. We show that the physically relevant object is the isolated low-energy subspace itself: it remains well defined through degeneracies and level crossings, and it can be learned efficiently from nearby sampled states. Working in this subspace, we prove that a sampling pattern cancelling the first $q$ nonconstant response orders yields an energy-density error bounded by $d^{2(q+1)}$ for every retained level, where $d$ is the parameter-space sampling distance. For a gapped local ground state on $n$ sites, locality sharpens this to $d^2(nd^2)^q$, identifying $nd^2$ as the natural scaling variable governing the effectiveness of higher-order information from sampled wavefunctions. In a local analytic regime this gives a sampling cost $K=\\mathcal{O}([\\log(1/\\varepsilon)]^D)$ at fixed parameter dimension $D$. Numerical results on Heisenberg and transverse-field Ising chains confirm the distance scaling law and the $nd^2$ collapse. Beyond characterizing learnability, the scaling behavior further provides a finite-size probe of phase transitions near criticality.", "url": "https://arxiv.org/abs/2609.33777", "type": "理论+数值", "summary": "相图和能量面需要一系列哈密顿量的低能态，但独立求解每个参数点的成本却极其昂贵。一个重要的问题不是单个标记本征态在参数变化下的行为，而是一小组参考波函数中包含多少有关低能部分的信息。我们证明，物理相关对象是孤立的低能子空间本身：它通过简并和能级交叉保持良好的定义，并且可以从附近的采样状态有效地学习。在这个子空间中，我们证明取消前 $q$ 个非常量响应顺序的采样模式会产生每个保留级别的能量密度误差，其边界为 $d^{2(q+1)}$，其中 $d$ 是参数空间采样距离。对于 $n$ 位点上的有间隙局部基态，局部性将其锐化为 $d^2(nd^2)^q$，将 $nd^2$ 识别为自然标度变量，控制来自采样波函数的高阶信息的有效性。在局部分析体系中，这给出了固定参数维度 $D$ 处的采样成本 $K=\\mathcal{O}([\\log(1/\\varepsilon)]^D)$。\n\n海森堡和横向场伊辛链的数值结果证实了距离缩放定律和 $nd^2$ 崩溃。除了表征可学习性之外，缩放行为还提供了接近临界点的相变的有限尺寸探测。", "authors": [{"name": "Guijing Duan"}, {"name": "Chen Mo"}, {"name": "Di Luo"}], "featured_authors": [{"name": "Guijing Duan"}, {"name": "Chen Mo"}, {"name": "Di Luo"}], "author_count": 3}, {"id": "2609.33784", "category": "cond-mat", "title": "On mechanistically accessible copolymer sequences", "abstract": "Structural observations in polymer chemistry are often rationalized through underlying mechanistic insights. The study of families of mechanisms - and the phenomenology and lawlike behavior that can accompany them - is less common. Here we construct a theory that links a mechanistic feature - the number of nearest neighbors $k$ that influence monomer incorporation - with the accessible copolymer sequence space. We find that the reaction mechanisms can be mapped 1-to-1 to a regular de Bruijn graph of degree $k$. We calculate the periodic copolymer sequences as function of neighbor index $k$, and number of monomers $s$. We show that the number of periodic sequences grows explosively with $s,k$, bounded from below by $s!^{s^{k-1}}/s^k$. We find that periodic k-polymerization is governed by several simple laws describing allowed sequences, number of specific reactions, repeating unit length and the allowed and disallowed sequence coexistence in block copolymers. We formulate Simple Assembly Rules (SAR) that capture commonly observed behavior and design of literature systems, and characterize the possible k-polymerizations they are allowed to access ($k\\leq2$) as function of symmetries and illustrate our findings with reported examples from the coordination chemistry and supramolecular chemistry literature. We discuss chemical-structural contributions by which nontrivial ($k>1$) sequences are formed, highlighting the importance steric hindrance, long-range interactions and degrees of freedom.", "url": "https://arxiv.org/abs/2609.33784", "type": "理论", "summary": "聚合物化学中的结构观察通常通过潜在的机理见解来合理化。对一系列机制以及与之相伴随的现象学和规律行为的研究并不常见。在这里，我们构建了一个理论，将机械特征（影响单体掺入的最近邻居 $k$ 的数量）与可访问的共聚物序列空间联系起来。我们发现反应机制可以一对一映射到 $k$ 度的常规 de Bruijn 图。我们计算周期性共聚物序列作为邻居索引 $k$ 和单体数量 $s$ 的函数。我们表明，周期序列的数量随着 $s,k$ 爆炸性增长，从下面以 $s!^{s^{k-1}}/s^k$ 为界。我们发现周期性 k 聚合受几个简单定律的控制，这些定律描述了嵌段共聚物中允许的序列、特定反应的数量、重复单元长度以及允许和不允许的序列共存。\n\n我们制定了简单组装规则（SAR），捕获常见的观察行为和文献系统的设计，并将它们允许访问的可能的 k 聚合（$k\\leq2$）表征为对称性函数，并用配位化学和超分子化学文献中报告的示例说明我们的发现。我们讨论了形成非平凡（$k>1$）序列的化学结构贡献，强调了空间位阻、长程相互作用和自由度的重要性。", "authors": [{"name": "Richard Golnik"}, {"name": "Nicola Vassena"}, {"name": "Alex Blokhuis"}], "featured_authors": [{"name": "Richard Golnik"}, {"name": "Nicola Vassena"}, {"name": "Alex Blokhuis"}], "author_count": 3}, {"id": "2609.33793", "category": "cond-mat", "title": "Charge Regulation Mediated Interaction of Amphoteric Nanoparticle Surfaces", "abstract": "Charge regulation refers to the ability of ionizable biomolecules and their counterparts to adjust their ionization state in response to external perturbations, including changes in pH, ionic strength, or electrostatic interactions with neighboring charged species. Here, we use explicit-ion molecular dynamics / charge-regulation Monte Carlo simulations to compute the interaction force between two spherical, charge-regulated nanoparticles as a function of separation, and compare symmetric (chemically identical) and asymmetric (chemically complementary) surface configurations against the constant charge approximation. We find that charge regulation produces up to an order-of-magnitude stronger short-range attraction than constant charge for asymmetric nanoparticle pairs, particularly at low electrolyte concentration, and that charge regulation qualitatively alters the interaction between symmetric, chemically identical nanoparticles, driving a crossover from net repulsion to net weak-attraction as ionic strength decreases. This transition is not observed under the constant charge assumption which shows that charge regulation is not a minor correction but can change both the strength and the sign of nanoscale electrostatic interactions, with implications for the assembly and stability of charge-regulated colloidal systems", "url": "https://arxiv.org/abs/2609.33793", "type": "数值", "summary": "电荷调节是指可电离生物分子及其对应物响应外部扰动调整其电离状态的能力，包括 pH 值、离子强度或与邻近带电物质的静电相互作用的变化。在这里，我们使用显式离子分子动力学/电荷调节蒙特卡罗模拟来计算两个球形、电荷调节纳米粒子之间的相互作用力作为分离的函数，并将对称（化学相同）和不对称（化学互补）表面构型与恒定电荷近似进行比较。我们发现，对于不对称纳米颗粒对，电荷调节产生的短程吸引力比恒定电荷强一个数量级，特别是在低电解质浓度下，并且电荷调节定性地改变了对称、化学相同的纳米颗粒之间的相互作用，随着离子强度的降低，驱动从净排斥到净弱吸引力的交叉。\n\n在恒定电荷假设下没有观察到这种转变，这表明电荷调节不是一个微小的修正，而是可以改变纳米级静电相互作用的强度和符号，对电荷调节胶体系统的组装和稳定性产生影响", "authors": [{"name": "Saurav Tyagi"}, {"name": "Kamal Tripathi"}, {"name": "Saikat Chakraborty"}, {"name": "Sunita Kumari"}], "featured_authors": [{"name": "Saurav Tyagi"}, {"name": "Kamal Tripathi"}, {"name": "Saikat Chakraborty"}, {"name": "Sunita Kumari"}], "author_count": 4}, {"id": "2609.33806", "category": "cond-mat", "title": "Superconducting Pairing Symmetry on Geometric-Algebra Foundations via the Scalar-Projection Method", "abstract": "We formulate the low-energy theory of superconducting pairing in the geometric algebra $Cl_{3,0}$. Conventional BCS mean-field theory and its extensions ($s$-, $p$-, $d$-wave, etc.) have algebraic counterparts in an eight-dimensional real multivector space. The construction is a two-level projection: matrix blocks are represented as Clifford multivectors, and their grade-0 projected geometric products extract the scalar blocks from which Hamiltonians are built. The result is an algebraic reconstruction, physically equivalent to the standard complex-matrix formulation. In this reconstruction, the dichotomy of pairing channels acquires an algebraic root: it follows from the fermionic identity $B^\\dagger(V)=-B^\\dagger(V^{\\mathsf T})$, and the Fierz rearrangement is realized by the map $\\Phi:G\\mapsto Ge_{31}$ (with $e_{31}^2=-1$). This yields a kernel/matrix dictionary: at the effective-kernel level grades $0\\oplus3$ correspond to spin singlets and grades $1\\oplus2$ to triplets; at the pairing-matrix level the singlet plane is $\\mathrm{span}\\{e_2,e_{31}\\}$. The BCS limit has a double grade identity: kernel grade 0 (scalar glue) and vertex grade 2, a bivector ($i\\sigma_2\\leftrightarrow e_{31}$). We state three algebraic results: (i) a decomposition theorem for BdG quantum geometry with a null-texture criterion, applied to the chiral-state controversy in CsV$_3$Sb$_5$; (ii) a Fierz sign duality in the four-dimensional Minkowski algebra, with a chirality-reversal extension to two-node Weyl-semimetal models; (iii) an error bound and condition-number structure for tomographic reconstruction under a linear-response probe model. Illustrations include a glue-generation mechanism, a one-loop algebraic renormalization flow whose feeding constant coincides in magnitude with the $\\mathfrak{su}(2)$ Casimir, closed-form $\\mu=0$ inter-node spectra, and a UTe$_2$ two-phase analysis.", "url": "https://arxiv.org/abs/2609.33806", "type": "理论", "summary": "我们在几何代数 $Cl_{3,0}$ 中制定了超导配对的低能理论。传统的 BCS 平均场理论及其扩展（$s$-、$p$-、$d$-波等）在八维实多向量空间中具有代数对应物。该构造是一个两级投影：矩阵块表示为 Clifford 多重向量，它们的 0 级投影几何乘积提取用于构建哈密顿量的标量块。结果是代数重建，物理上等同于标准复数矩阵公式。在此重构中，配对通道的二分法获得代数根：它由费米子恒等式 $B^\\dagger(V)=-B^\\dagger(V^{\\mathsf T})$ 得出，Fierz 重排通过映射 $\\Phi:G\\mapsto Ge_{31}$ （其中 $e_{31}^2=-1$）实现。这产生了一个内核/矩阵字典：在有效内核级别，等级 $0\\oplus3$ 对应于自旋单峰，等级 $1\\oplus2$ 对应于三元组；在配对矩阵级别，单重平面为 $\\mathrm{span}\\{e_2,e_{31}\\}$。\n\nBCS 极限具有双等级标识：内核等级 0（标量胶合）和顶点等级 2，双向量 ($i\\sigma_2\\leftrightarrow e_{31}$)。我们陈述三个代数结果：（i）具有空纹理准则的 BdG 量子几何的分解定理，应用于 CsV$_3$Sb$_5$ 中的手性态争议； (ii) 四维 Minkowski 代数中的 Fierz 符号对偶性，以及双节点 Weyl 半金属模型的手性反转扩展； （iii）线性响应探针模型下断层摄影重建的误差界限和条件数结构。插图包括胶水生成机制、单环代数重正化流（其馈送常数在大小上与 $\\mathfrak{su}(2)$ 卡西米尔一致）、闭合形式 $\\mu=0$ 节点间谱以及 UTe$_2$ 两相分析。", "authors": [{"name": "Youping Dai"}], "featured_authors": [{"name": "Youping Dai"}], "author_count": 1}, {"id": "2609.34000", "category": "cond-mat", "title": "Topological chiral edge modes in the continuum of a trivial bulk", "abstract": "Chiral edge modes in topological states of matter are routinely found inside band gaps, which may be deformed and shifted as a function of the lattice momentum. Here we show that they can exist inside a bulk band instead, i.e., in the continuum. These chiral edge modes in the continuum (CEMICs) are induced by introducing an imaginary magnetic flux to an otherwise topologically trivial two-dimensional system, realized by imposing asymmetric couplings along the edge. While the stronger couplings provide a preferred circulation direction, we find that the edge localization of CEMICs does \\textit{not} originate from the non-Hermitian skin effect, which is typically associated with systems featuring asymmetric couplings and the open boundary condition. Instead, this edge localization is due to the energy exchange between the system and the environment at the asymmetric coupling junctions, which leads to a parity-time (PT) transition in the Brillouin zone. Intriguingly, the onset of CEMICs is independent of the system size in the macroscopic limit, which is given by the golden ratio between the asymmetric couplings and their geometric average.", "url": "https://arxiv.org/abs/2609.34000", "type": "理论", "summary": "物质拓扑态中的手性边缘模式通常在带隙内发现，带隙可能会随着晶格动量的函数而变形和移动。在这里，我们证明它们可以存在于块带内，即连续体中。这些连续体中的手性边缘模式 (CEMIC) 是通过向拓扑平凡的二维系统引入虚磁通量而诱发的，通过沿边缘施加不对称耦合来实现。虽然较强的耦合提供了首选的循环方向，但我们发现 CEMIC 的边缘局域化并非源于非厄米趋肤效应，该效应通常与具有不对称耦合和开放边界条件的系统相关。相反，这种边缘局域化是由于系统与环境在不对称耦合结处的能量交换造成的，这导致了布里渊区的宇称时间（PT）跃迁。有趣的是，CEMIC 的出现在宏观极限下与系统尺寸无关，这是由不对称耦合与其几何平均值之间的黄金比例给出的。", "authors": [{"name": "Li Ge"}], "featured_authors": [{"name": "Li Ge"}], "author_count": 1}, {"id": "2609.34008", "category": "cond-mat", "title": "Correlation Between Dopant Atom Evaporation Field and Measured Site Preference in Atom Probe Tomography", "abstract": "Complex oxides possess a wide range of electric, magnetic, and optical properties that can be precisely tuned by chemical doping. The atomic-scale analysis of the property-controlling dopants, however, becomes increasingly difficult towards low doping levels. Atom probe tomography (APT) offers chemical sensitivity and spatial resolution to image individual dopant atoms down to a few parts per million. To reliably extract such information, detailed knowledge about the atom-specific field evaporation processes is required. Here we demonstrate a first insight into the APT-measured atomic position of dopant atoms and the field evaporation conditions, using Zr-doped ErMnO3 as a model system. Our analysis reveals a substantial preferential retention of both matrix and dopant atoms which strongly affects the dopant site determination and can lead to an incorrect interpretation. The retention effect is determined by intrinsic and extrinsic parameters, such as the dopant's evaporation field and concentration and the analysis temperature, respectively, as we explain based on field-evaporation simulations. Our results are important for the APT-based analysis of individual dopant atoms in solid systems and the understanding of field evaporation dynamics at the atomic level in general.", "url": "https://arxiv.org/abs/2609.34008", "type": "理论+数值", "summary": "复杂氧化物具有广泛的电、磁和光学特性，可以通过化学掺杂进行精确调节。然而，对于低掺杂水平，性能控制掺杂剂的原子尺度分析变得越来越困难。原子探针断层扫描 (APT) 提供化学灵敏度和空间分辨率，可对低至百万分之几的单个掺杂原子进行成像。为了可靠地提取此类信息，需要有关原子特定场蒸发过程的详细知识。在这里，我们使用 Zr 掺杂的 ErMnO3 作为模型系统，首次深入了解 APT 测量的掺杂剂原子的原子位置和场蒸发条件。我们的分析揭示了基体和掺杂剂原子的显着优先保留，这强烈影响掺杂剂位点的确定并可能导致错误的解释。保留效应由内在和外在参数决定，例如掺杂剂的蒸发场和浓度以及分析温度，正如我们基于场蒸发模拟所解释的那样。\n\n我们的结果对于基于 APT 的固体系统中单个掺杂剂原子的分析以及对原子水平上场蒸发动力学的理解非常重要。", "authors": [{"name": "Kasper A. Hunnestad"}, {"name": "Constantinos Hatzoglou"}, {"name": "Frida H. Danmo"}, {"name": "Zewu Yan"}, {"name": "Edith Bourret"}, {"name": "Francois Vurpillot"}, {"name": "Antonius T. J. van Helvoort"}, {"name": "Sverre Selbach"}, {"name": "Dennis Meier"}], "featured_authors": [{"name": "Kasper A. Hunnestad"}, {"name": "Constantinos Hatzoglou"}, {"name": "Frida H. Danmo"}, {"name": "Antonius T. J. van Helvoort"}, {"name": "Sverre Selbach"}, {"name": "Dennis Meier"}], "author_count": 9}, {"id": "2609.34022", "category": "cond-mat", "title": "Mobility-network topology carries incremental, softness-orthogonal information about future aging dynamics in a glass-forming liquid", "abstract": "Does the spatial organization of particle mobility in a glass predict future motion beyond what local structure knows? In leakage-free simulations of an aging Kob--Andersen liquid ($N=2028$; 200 trajectories; three temperatures), mobility-network topology raises the out-of-fold $R^2$ by $\\dRtwo=0.0049$--$0.0122$, monotonically with quench depth, retaining $\\ge 98\\%$ atop softness-class baselines. Giant mobile components are dense hotspots whose members subsequently quiet down: exhaustion zones of cooperative motion --- a spatial anticorrelation channel invisible to single-particle descriptors.", "url": "https://arxiv.org/abs/2609.34022", "type": "数值", "summary": "玻璃中粒子迁移率的空间组织是否可以预测超出局部结构所知的未来运动？在老化 Kob-Andersen 液体（$N=2028$；200 个轨迹；三个温度）的无泄漏模拟中，移动网络拓扑将折叠 $R^2$ 提高了 $\\dRtwo=0.0049$--$0.0122$，与淬火深度单调，将 $\\ge 98\\%$ 保留在柔软度基线之上。巨大的移动组件是密集的热点，其成员随后安静下来：协作运动的耗尽区——单粒子描述符不可见的空间反相关通道。", "authors": [{"name": "Zhenpeng Li"}], "featured_authors": [{"name": "Zhenpeng Li"}], "author_count": 1}, {"id": "2609.34128", "category": "cond-mat", "title": "Bogoliubov coupled-cluster theory for su(2) Hamiltonians", "abstract": "Coupled-cluster theory is the method of choice for weakly correlated systems, but in strongly correlated systems where the mean-field reference is qualitatively poor, it can break down badly. These failures can be ameliorated by using symmetry-broken mean-field references. For systems that spontaneously break spin symmetry, we might favor an unrestricted reference. In systems that instead break number symmetry, we turn to Bogoliubov coupled cluster theory. In this work, we apply Bogoliubov coupled-cluster to Hamiltonians with an underlying su(2) algebra to study the pairing Hamiltonian and the spin XXZ and J1-J2 models by exploiting the correspondence between fermionic-pair operators and spin-1/2 operators. For the pairing problem, the reference is the usual Bardeen--Cooper--Schrieffer (BCS) quasiparticle vacuum, while for spin systems we use the analogous spin-BCS reference, which breaks Sz symmetry and provides a flexible starting point for strongly correlated regimes. Correlation is incorporated through a hierarchy of coupled-cluster approximations. Beyond energies, we compute the response density matrices for the evaluation of spin--spin correlation functions for the XXZ and J1-J2 Heisenberg models, and the pairing parameter and particle-number variance for the pairing Hamiltonian. We also derive the corresponding relaxed density matrices, including the effects of orbital relaxation. Benchmark calculations for the half-filled pairing Hamiltonian and spin models demonstrate that Bogoliubov coupled cluster provides a systematically improvable wave-function-based approach for su(2) Hamiltonians, including geometrically frustrated spin systems requiring complex and noncollinear BCS references.", "url": "https://arxiv.org/abs/2609.34128", "type": "理论+数值", "summary": "耦合簇理论是弱相关系统的首选方法，但在平均场参考质量较差的强相关系统中，它可能会严重崩溃。通过使用对称破缺的平均场参考可以改善这些故障。对于自发破坏自旋对称性的系统，我们可能倾向于无限制的参考。在打破数对称性的系统中，我们转向博戈柳博夫耦合簇理论。在这项工作中，我们将 Bogoliubov 耦合簇应用于具有底层 su(2) 代数的哈密顿量，通过利用费米子对算子和自旋 1/2 算子之间的对应关系来研究配对哈密顿量以及自旋 XXZ 和 J1-J2 模型。对于配对问题，参考是通常的 Bardeen-Cooper-Schrieffer (BCS) 准粒子真空，而对于自旋系统，我们使用类似的自旋 BCS 参考，它打破了 Sz 对称性并为强相关体系提供了灵活的起点。相关性是通过耦合簇近似的层次结构来合并的。\n\n除了能量之外，我们还计算用于评估 XXZ 和 J1-J2 海森堡模型的自旋-自旋相关函数的响应密度矩阵，以及配对哈密顿量的配对参数和粒子数方差。我们还推导了相应的弛豫密度矩阵，包括轨道弛豫的影响。半填充配对哈密顿量和自旋模型的基准计算表明，Bogoliubov 耦合簇为 su(2) 哈密顿量提供了一种可系统改进的基于波函数的方法，包括需要复杂且非共线 BCS 参考的几何受挫自旋系统。", "authors": [{"name": "Swarnamoy Ghosh"}, {"name": "Thomas M. Henderson"}, {"name": "Gustavo E. Scuseria"}], "featured_authors": [{"name": "Swarnamoy Ghosh"}, {"name": "Thomas M. Henderson"}, {"name": "Gustavo E. Scuseria"}], "author_count": 3}, {"id": "2609.34131", "category": "cond-mat", "title": "Finite-temperature grain boundary phases, transformations, and diagrams in alloys", "abstract": "Current understanding of alloy grain boundaries is limited by the incompleteness of atomistic simulation techniques, which either neglect entropy or artificially constrain the atomic density. This study introduces Monte Carlo simulations that simultaneously sample all the microscopic degrees of freedom in complex interfaces: position, configuration, and atom number. The method enables rigorous predictions of finite-temperature grain boundary structures, phase transformations, and diagrams in multicomponent materials. Simulations of W-V alloys demonstrate the necessity of the approach by uncovering a range of previously inaccessible phase transitions including condensation of interstitial solutes and transformation of dislocation structure.", "url": "https://arxiv.org/abs/2609.34131", "type": "理论+数值", "summary": "目前对合金晶界的理解受到原子模拟技术不完整的限制，这些技术要么忽略熵，要么人为地限制原子密度。这项研究引入了蒙特卡罗模拟，它可以同时对复杂界面中的所有微观自由度进行采样：位置、构型和原子数。该方法能够严格预测多组分材料的有限温度晶界结构、相变和图表。 W-V 合金的模拟通过揭示一系列以前无法实现的相变（包括间隙溶质的凝结和位错结构的转变）证明了该方法的必要性。", "authors": [{"name": "Flynn Walsh"}, {"name": "Timofey Frolov"}], "featured_authors": [{"name": "Flynn Walsh"}, {"name": "Timofey Frolov"}], "author_count": 2}, {"id": "2609.34352", "category": "cond-mat", "title": "Second largest eigenvalue does not bound stationary entropy production", "abstract": "We examine the spectral dissipation-coherence trade-off inequality conjectured by Oberreiter {\\it et al}. [Phys. Rev. E 106, 014106 (2022)], stating that the coherent number, defined from the second largest eigenvalue, provides a lower bound on the stationary entropy production per unit oscillation. We disprove this conjecture by explicitly constructing a counterexample, which accompanies finite coherent number with vanishing stationary entropy production. This model also excludes a wide class of thermodynamic bound with the real and imaginary parts of the second largest eigenvalue of the transition rate matrix. Our result implies that the second largest eigenvalue does not necessarily characterize the degree of coherent oscillation.", "url": "https://arxiv.org/abs/2609.34352", "type": "理论", "summary": "我们研究了 Oberreiter {\\it 等人}推测的光谱耗散-相干权衡不等式。 [物理。 Rev. E 106, 014106 (2022)]，指出从第二大特征值定义的相干数提供了每单位振荡的稳态熵产生的下界。我们通过明确构造一个反例来反驳这个猜想，该反例伴随着有限相干数和消失的平稳熵产生。该模型还排除了与跃迁率矩阵的第二大特征值的实部和虚部相关的一类热力学界限。我们的结果意味着第二大特征值不一定表征相干振荡的程度。", "authors": [{"name": "Naoto Shiraishi"}], "featured_authors": [{"name": "Naoto Shiraishi"}], "author_count": 1}, {"id": "2609.34468", "category": "cond-mat", "title": "Fluctuations and multifractality in stochastic models of interface growth and population dynamics", "abstract": "This thesis studies how disorder and fluctuations shape large-scale growth phenomena in three related settings: fluctuating interfaces, random spring chains, and random multiplicative growth. The first part concerns interface growth and a phenomenon denoted anomalous scaling, where local and global exponents this http URL clarify its origin, we study two models in which this mismatch has different causes. The first is a heterogeneous elastic line, where we show that the apparent anomaly is a purely statistical effect. The second is the stochastic porous medium equation, a strongly nonlinear model in which the anomaly is genuine. The second part concerns Anderson localization, which appears here through the spectral properties of the heterogeneous elastic lines. We study chains with both random masses and random spring constants, with particular emphasis on the strong-disorder regime, where standard weak-disorder expansions break down. We develop a new combinatorial method to probe this regime. The last part concerns random multiplicative growth with redistribution. In such models, changes in wealth, population, or mass, for instance, are proportional to the amount already present, so that small differences are amplified over time. This naturally generates broad distributions and provides a simple mechanism for the emergence of inequality and concentration, with applications to population dynamics, wealth distribution, city growth, and ecology. We in particular study models in which each site has its own quenched growth rate, representing a persistent advantage or disadvantage, and is also subject to transient fluctuations. Redistribution competes with these mechanisms by homogenizing the system. This competition leads to rich phase diagrams.", "url": "https://arxiv.org/abs/2609.34468", "type": "理论+数值", "summary": "本论文研究了在三种相关环境中无序和波动如何塑造大规模生长现象：波动界面、随机弹簧链和随机乘法增长。第一部分涉及界面增长和异常缩放现象，其中局部和全局指数此 http URL 澄清了其起源，我们研究了两种模型，其中这种不匹配有不同的原因。第一个是异质弹性线，我们表明明显的异常纯粹是统计效应。第二个是随机多孔介质方程，这是一个强非线性模型，其中的异常是真实存在的。第二部分涉及安德森定位，它通过异质弹性线的光谱特性出现。我们研究具有随机质量和随机弹簧常数的链，特别强调强无序状态，其中标准弱无序扩张会崩溃。我们开发了一种新的组合方法来探索这种机制。最后一部分涉及重新分配的随机乘法增长。\n\n例如，在此类模型中，财富、人口或质量的变化与已经存在的数量成正比，因此随着时间的推移，微小的差异会被放大。这自然会产生广泛的分布，并为不平等和集中的出现提供一个简单的机制，并应用于人口动态、财富分配、城市增长和生态。我们特别研究了模型，其中每个站点都有自己的抑制增长率，代表持续的优势或劣势，并且也会受到短暂波动的影响。再分配通过使系统同质化来与这些机制竞争。这次竞赛产生了丰富的相图。", "authors": [{"name": "Maximilien Bernard"}], "featured_authors": [{"name": "Maximilien Bernard"}], "author_count": 1}, {"id": "2609.34569", "category": "cond-mat", "title": "Enhanced sliding in the coexisting Charge Density Wave phase of strained TbTe3", "abstract": "In the last years, the application of mechanical tensile stress has been shown to trigger unconventional phases in quantum materials. Recently, an orientational transition of the charge density wave (CDW) of TbTe3 was reported under the application of moderate uniaxial tensile stress, associated to the in-plane a/c lattice anisotropy. This leads to the disappearance of the pristine c-oriented CDW (CDWc) and to the appearance of the orthogonal a-oriented one (CDWa). A coexistence phase with a superposition of CDWa and CDWc appears when a=c. Here, we probe the sliding dynamics of both CDWc and CDWa as a function of applied tensile stress, i.e. in the pure CDWc, pure CDWa and coexistence phases, by measuring current-voltage characteristics and associated differential resistances. If the pristine CDWc has been known to display non-linear dynamics and thus sliding for several years, we show here that the strain-induced CDWa phase also displays the same characteristics, proving its incommensurate nature. Moreover, we show that sliding also takes place both for CDWc and CDWa, with reduced threshold currents, in the coexistence phase, which questions the microstructure of these coexisting orthogonal CDWs in real space. Finally, the linearity of the threshold fields is kept for all deformation states, with finite threshold fields at Tc, which is discussed in terms of commensurability and pinning potentials. This work opens new questions for the theoretical description of sliding CDWs in quasi-2D systems.", "url": "https://arxiv.org/abs/2609.34569", "type": "理论", "summary": "近年来，机械拉伸应力的应用已被证明可以触发量子材料中的非常规相。最近，报道了在中等单轴拉伸应力的作用下 TbTe3 的电荷密度波 (CDW) 的取向转变，这与面内 a/c 晶格各向异性相关。这导致原始 c 取向 CDW (CDWc) 的消失，并导致正交 a 取向 CDW (CDWa) 的出现。当a=c时，出现CDWa和CDWc叠加的共存相。在这里，我们通过测量电流-电压特性和相关的微分电阻，探讨 CDWc 和 CDWa 的滑动动力学作为施加拉应力的函数，即在纯 CDWc、纯 CDWa 和共存阶段。如果已知原始 CDWc 表现出非线性动力学并因此滑动数年，那么我们在此表明​​应变诱导的 CDWa 相也表现出相同的特征，证明了其不相称的性质。\n\n此外，我们发现在共存阶段，CDWc 和 CDWa 也会发生滑动，阈值电流降低，这对真实空间中这些共存的正交 CDW 的微观结构提出了质疑。最后，所有变形状态都保持阈值场的线性，在 Tc 处具有有限的阈值场，这在可通约性和钉扎势方面进行了讨论。这项工作为准二维系统中滑动 CDW 的理论描述提出了新的问题。", "authors": [{"name": "Antoine Gallo Frantz"}, {"name": "Aleksander Sinchenko"}, {"name": "Luc Ortega"}, {"name": "Abdellali Hadj Azzem"}, {"name": "Jose Emilio Lorenzo"}, {"name": "Pierre Monceau"}, {"name": "David Le Bolloch"}, {"name": "Vincent Jacques"}], "featured_authors": [{"name": "Antoine Gallo Frantz"}, {"name": "Aleksander Sinchenko"}, {"name": "Luc Ortega"}, {"name": "Pierre Monceau"}, {"name": "David Le Bolloch"}, {"name": "Vincent Jacques"}], "author_count": 8}, {"id": "2609.34607", "category": "cond-mat", "title": "Quantum-Geometric Amplification of Nonperturbative Interaction Scales", "abstract": "Weak interactions at a two-dimensional quadratic band touching (QBT) can generate an exponentially small symmetry-breaking gap, $m\\sim e^{-A/V_1}$, that cannot be captured by every finite order of perturbation theory. We show that the singular quantum geometry of the gapped QBT converts this beyond-all-orders scale into an algebraically enhanced response. The quantum metric develops a momentum-space hot spot whose Brillouin-zone integral diverges logarithmically, and therefore grows algebraically when the gap is dynamically generated by interactions. Through the inverse-frequency Souza--Wilkens--Martin optical sum rule, the same amplification appears in the negative-first longitudinal optical moment, even though the ordinary optical conductivity remains $O(e^2/\\hbar)$ and its absorption threshold is exponentially small. We establish these results analytically for a massive QBT and verify them microscopically in an interacting kagome lattice model known to develop a spontaneous quantum anomalous Hall mass at its QBT from loop currents order. Our results identify quantum geometry as an asymptotic amplifier of nonperturbative interaction scales.", "url": "https://arxiv.org/abs/2609.34607", "type": "理论", "summary": "二维二次带接触 (QBT) 处的弱相互作用会产生指数级小的对称破缺间隙 $m\\sim e^{-A/V_1}$，而该间隙无法用每个有限阶的微扰理论来捕获。我们证明了带隙 QBT 的奇异量子几何结构将这种超全阶尺度转换为代数增强响应。量子度量形成了一个动量空间热点，其布里渊区积分呈对数发散，因此当间隙由相互作用动态产生时，其代数增长。通过反频 Souza--Wilkens--Martin 光学和法则，即使普通光导率仍为 $O(e^2/\\hbar)$ 并且其吸收阈值呈指数级小，但在负第一纵向光矩中也会出现相同的放大。我们针对大规模 QBT 分析建立了这些结果，并在相互作用的 Kagome 晶格模型中进行微观验证，该模型已知根据环路电流顺序在其 QBT 处形成自发量子反常霍尔质量。我们的结果将量子几何确定为非微扰相互作用尺度的渐近放大器。", "authors": [{"name": "Stefano Bilamour"}, {"name": "René Meyer"}, {"name": "Johanna Erdmenger"}, {"name": "Domenico Di Sante"}], "featured_authors": [{"name": "Stefano Bilamour"}, {"name": "René Meyer"}, {"name": "Johanna Erdmenger"}, {"name": "Domenico Di Sante"}], "author_count": 4}, {"id": "2609.34631", "category": "cond-mat", "title": "Cell division sets a universal flow geometry in cell layers", "abstract": "Collective flows in epithelial tissues contain a geometric backbone of vortical interfaces whose statistics exhibit hallmarks of critical percolation and conformal invariance. Yet how fundamental cellular processes govern the breakdown of such symmetry-rich flow geometry remains unclear. Here we show that cell division plays a central physical role in regulating this universal flow organization by controlling both the geometric and mechanical flexibility of the cell-cell network. Using pharmacological perturbations, we find that when proliferation is suppressed through two independent interventions, coherent flows persist but neighbor exchanges decline and conformally invariant geometry is lost. Blocking apoptosis does not affect universality, isolating division as the key control. A vertex model with tunable division quantitatively reproduces these effects and restores conformal invariance when division is allowed. We further trace this effect to changes in both the geometric and mechanical organization of the cell layer: Divisions act as intermittent topological renewals that loosen constraints, preserving the network's flexibility and capacity to rearrange across scales. Thus, beyond its canonical role in growth, cell division acts as a structural and mechanical regulator of collective self-organization. These findings establish a direct connection between fundamental biological processes and emergent physical symmetries.", "url": "https://arxiv.org/abs/2609.34631", "type": "理论", "summary": "上皮组织中的集体流动包含涡旋界面的几何主干，其统计数据表现出临界渗透和保形不变性的特征。然而，基本的细胞过程如何控制这种富含对称性的流动几何结构的破坏仍不清楚。在这里，我们表明细胞分裂通过控制细胞-细胞网络的几何和机械灵活性在调节这种普遍流动组织中发挥着核心物理作用。利用药理学扰动，我们发现当通过两种独立的干预措施抑制增殖时，相干流持续存在，但邻近交换下降并且保形不变几何形状丢失。阻断细胞凋亡并不影响普遍性，隔离分裂是关键控制。具有可调除法的顶点模型可以定量地再现这些效应，并在允许除法时恢复共形不变性。我们进一步将这种效应追溯到细胞层的几何和机械组织的变化：分裂充当间歇性拓扑更新，放松约束，保持网络的灵活性和跨尺度重新排列的能力。\n\n因此，除了其在生长中的典型作用之外，细胞分裂还充当集体自组织的结构和机械调节器。这些发现在基本生物过程和新兴物理对称性之间建立了直接联系。", "authors": [{"name": "Tianxiang Ma"}, {"name": "Lasse Bonn"}, {"name": "Valeriia Grudtsyna"}, {"name": "Nigar Abbasova"}, {"name": "Martin Cramer Pedersen"}, {"name": "Nuno A. M. Araujo"}, {"name": "Amin Doostmohammadi"}], "featured_authors": [{"name": "Tianxiang Ma"}, {"name": "Lasse Bonn"}, {"name": "Valeriia Grudtsyna"}, {"name": "Martin Cramer Pedersen"}, {"name": "Nuno A. M. Araujo"}, {"name": "Amin Doostmohammadi"}], "author_count": 7}, {"id": "2609.34706", "category": "cond-mat", "title": "Sub-20 nm spin textures with arbitrary topological charge stabilized by higher-order interactions", "abstract": "Topological magnetization textures play a central role in modern magnetism. For many applications, spin textures with different topological charges $Q$ in the same system are particularly attractive. Although the coexistence of skyrmions and antiskyrmions ($|Q| = 1$) has been reported in inversion-symmetric magnets, extending this to high-$Q$ ($|Q| > 1$) textures with arbitrary charge remains elusive. Here, using an atomistic spin model parameterized from first-principles calculations, we predict the emergence of sub-20 nm high-$Q$ textures in Janus monolayers, van der Waals magnets of growing interest. We explore skyrmion and antiskyrmion rings as well as skyrmion bags with $|Q|$ up to 5, and characterize their nucleation mechanisms, thermal stability, and collapse pathways. We find that higher-order spin interactions (HOI), which extend the conventional bilinear-exchange Hamiltonian, are essential for stabilizing these high-$Q$ spin textures. The rings remain thermally stable at zero magnetic field. HOI substantially enhance their energy barriers while leaving their size nearly unchanged and stabilize them even in the absence of Dzyaloshinskii-Moriya interaction. Skyrmion bags, in contrast, nucleate only in the presence of HOI. In particular, the four-spin three-site interaction is the key ingredient preventing high-$Q$ textures from collapsing into the ferromagnetic state. Finally, we identify previously unreported parity-dependent collapse mechanisms for high-$Q$ textures. Our results establish HOI as an overlooked mechanism for high-$Q$ nucleation.", "url": "https://arxiv.org/abs/2609.34706", "type": "理论+数值", "summary": "拓扑磁化纹理在现代磁学中发挥着核心作用。对于许多应用来说，同一系统中具有不同拓扑电荷 $Q$ 的自旋纹理特别有吸引力。尽管斯格明子和反斯格明子 ($|Q| = 1$) 的共存已在反演对称磁体中被报道，但将其扩展到具有任意电荷的高 $Q$ ($|Q| > 1$) 纹理仍然难以捉摸。在这里，使用根据第一原理计算参数化的原子自旋模型，我们预测 Janus 单层（人们越来越感兴趣的范德华磁体）中会出现亚 20 nm 高 $Q$ 纹理。我们探索了斯格明子环和反斯格明子环以及 $|Q|$ 最多 5 的斯格明子袋，并表征了它们的成核机制、热稳定性和塌陷路径。我们发现，高阶自旋相互作用（HOI）扩展了传统的双线性交换哈密顿量，对于稳定这些高 $Q$ 自旋纹理至关重要。这些环在零磁场下保持热稳定。 HOI 显着增强了它们的能量势垒，同时保持它们的尺寸几乎不变，并且即使在没有 Dzyaloshinskii-Moriya 相互作用的情况下也能稳定它们。\n\n相比之下，斯格明子袋仅在 HOI 存在时才成核。特别是，四自旋三位点相互作用是防止高 $Q$ 纹理塌陷到铁磁态的关键因素。最后，我们确定了先前未报告的高 $Q$ 纹理的奇偶相关崩溃机制。我们的结果表明 HOI 是一种被忽视的高 $Q$ 成核机制。", "authors": [{"name": "Zhen Sun"}, {"name": "Shiwei Zhu"}, {"name": "Moritz A. Goerzen"}, {"name": "Megha Arya"}, {"name": "Changsheng Song"}, {"name": "Dongzhe Li"}], "featured_authors": [{"name": "Zhen Sun"}, {"name": "Shiwei Zhu"}, {"name": "Moritz A. Goerzen"}, {"name": "Megha Arya"}, {"name": "Changsheng Song"}, {"name": "Dongzhe Li"}], "author_count": 6}, {"id": "2609.34723", "category": "cond-mat", "title": "Effects of chain stiffness on the breakdown of the Cox-Merz rule in linear and ring polymer melts", "abstract": "The Cox-Merz rule is an empirical relation between the magnitude of the complex viscosity, $\\lvert\\eta^*(\\omega)\\rvert$, obtained from linear viscoelasticity, and the steady-shear viscosity, $\\eta(\\dot{\\gamma})$. In this study, we performed molecular dynamics simulations of coarse-grained polymer melts using the Kremer-Grest model and systematically examined the validity of the Cox-Merz rule as a function of chain length and chain stiffness for linear and ring polymers. For short chains and, more generally, for flexible chains, $\\lvert\\eta^*(\\omega)\\rvert$ and $\\eta(\\dot{\\gamma})$ show good agreement at corresponding values of angular frequency $\\omega$ and shear rate $\\dot{\\gamma}$. For linear polymers, however, the discrepancy between the two viscosities becomes increasingly pronounced with increasing chain length and chain stiffness, with $\\lvert\\eta^*(\\omega)\\rvert$ exceeding $\\eta(\\dot{\\gamma})$ at high corresponding values of $\\omega$ and $\\dot{\\gamma}$. This deviation is associated with the pronounced nonlinear response under strong steady shear, where flow-induced chain extension and alignment can modify the entanglement constraints that govern relaxation near equilibrium. In contrast, ring polymers retain substantially better agreement between $\\lvert\\eta^*(\\omega)\\rvert$ and $\\eta(\\dot{\\gamma})$ with increasing chain length and stiffness within the range examined here, indicating a weaker breakdown of the Cox-Merz rule. These results demonstrate that the applicability of the Cox-Merz rule depends strongly on chain length, chain stiffness, and molecular architecture. When the molecular response under steady shear deviates substantially from the relaxation behavior characterized by linear viscoelasticity near equilibrium, the complex viscosity can no longer accurately predict the steady-shear viscosity, resulting in a pronounced breakdown of the Cox-Merz rule.", "url": "https://arxiv.org/abs/2609.34723", "type": "理论+数值", "summary": "Cox-Merz 规则是从线性粘弹性获得的复数粘度 $\\lvert\\eta^*(\\omega)\\rvert$ 与稳态剪切粘度 $\\eta(\\dot{\\gamma})$ 之间的经验关系。在本研究中，我们使用 Kremer-Grest 模型对粗粒聚合物熔体进行了分子动力学模拟，并系统地检验了 Cox-Merz 规则作为线性和环状聚合物链长和链刚度函数的有效性。对于短链，更一般地，对于柔性链，$\\lvert\\eta^*(\\omega)\\rvert$ 和 $\\eta(\\dot{\\gamma})$ 在角频率 $\\omega$ 和剪切速率 $\\dot{\\gamma}$ 的相应值上表现出良好的一致性。然而，对于线性聚合物，随着链长度和链刚度的增加，两种粘度之间的差异变得越来越明显，在 $\\omega$ 和 $\\dot{\\gamma}$ 的高相应值下，$\\lvert\\eta^*(\\omega)\\rvert$ 超过 $\\eta(\\dot{\\gamma})$。这种偏差与强稳态剪切下明显的非线性响应相关，其中流动引起的链延伸和排列可以修改控制平衡附近松弛的缠结约束。\n\n相比之下，随着链长度和刚度的增加，环聚合物在 $\\lvert\\eta^*(\\omega)\\rvert$ 和 $\\eta(\\dot{\\gamma})$ 之间保持了更好的一致性，这表明对 Cox-Merz 规则的破坏较弱。这些结果表明，Cox-Merz 规则的适用性在很大程度上取决于链长、链刚度和分子结构。当稳态剪切下的分子响应显着偏离以接近平衡的线性粘弹性为特征的弛豫行为时，复数粘度不再能够准确预测稳态剪切粘度，导致 Cox-Merz 规则明显崩溃。", "authors": [{"name": "Keishin Tsujino"}, {"name": "Yuhi Sakamaki"}, {"name": "Shota Goto"}, {"name": "Kang Kim"}, {"name": "Nobuyuki Matubayasi"}], "featured_authors": [{"name": "Keishin Tsujino"}, {"name": "Yuhi Sakamaki"}, {"name": "Shota Goto"}, {"name": "Kang Kim"}, {"name": "Nobuyuki Matubayasi"}], "author_count": 5}, {"id": "2609.34767", "category": "cond-mat", "title": "Localization in tight-binding models with power-law distributed couplings", "abstract": "We study the localization properties of 1D and 2D tight-binding models with power-law distributed couplings by comparing the spectrum and the localization properties of the eigenmodes of the Laplacian and the adjacency matrix, using numerical diagonalization of these matrices for different system sizes and connectivities. These two matrices are relevant for different types of dynamical processes. While all eigenmodes of the adjacency matrix are localized for sufficiently large system sizes, the Laplacian matrix always leads to a small proportion of system-spanning modes due to a conservation law, and therefore to power-law tails in the probability distribution of the participation ratio and its relation to the eigenvalues. In one dimension, the exponent of these power laws change continuously with the exponent that characterizes the distribution of couplings. In two dimensions, the modes with the largest relaxation times change from system-spanning to localized when the exponent of the distribution of couplings becomes larger than 0.75. We provide phenomenological explanations for all these findings.", "url": "https://arxiv.org/abs/2609.34767", "type": "理论+数值", "summary": "我们通过比较拉普拉斯和邻接矩阵的本征模的频谱和局域特性，并使用不同系统尺寸和连通性的这些矩阵的数值对角化，研究具有幂律分布耦合的一维和二维紧束缚模型的局域特性。这两个矩阵与不同类型的动态过程相关。虽然邻接矩阵的所有本征模态都针对足够大的系统规模进行了局域化，但由于守恒定律，拉普拉斯矩阵总是导致系统跨越模态的一小部分，因此导致参与比的概率分布及其与特征值的关系中的幂律尾部。在一维中，这些幂律的指数随着表征耦合分布的指数而不断变化。在二维中，当耦合分布的指数大于 0.75 时，具有最大弛豫时间的模式从系统跨度变为局部模式。我们为所有这些发现提供了现象学解释。", "authors": [{"name": "Maximilian Weigmann"}, {"name": "Luca Schaefer"}, {"name": "Barbara Drossel"}], "featured_authors": [{"name": "Maximilian Weigmann"}, {"name": "Luca Schaefer"}, {"name": "Barbara Drossel"}], "author_count": 3}, {"id": "2609.34796", "category": "cond-mat", "title": "Phase compositions of Si oxynitride: A comprehensive thermodynamic modeling study", "abstract": "In this work, a comprehensive thermodynamic description of the formation of phases in amorphous SiOxNy (0 <= x <= 2, 0 <= y <= 4/3) films as a function of the film chemical composition and fabrication temperature is presented. Two possible phase states, namely homogeneous single-phase Si oxynitride and two-phase mixture of Si oxide and Si nitride phases, are analyzed in terms of the lowest values of the Gibbs free energy. The characters of the modification of the phase composition upon changing the SiOxNy stoichiometry indices and fabrication temperature are determined. Moreover, characteristic features of the chemical composition of the Si oxide and Si nitride phases in two-phase Si oxynitrides are revealed. Particular attention is given to the thermodynamic origin of the boundaries between different phase states of the SiOxNy films and to determining the critical stoichiometry values separating them. A comprehensive phase diagram indicating single- and two-phase SiOxNy regions as functions of the fabrication temperature is constructed. The peculiarities of the transitions between different SiOxNy phase states, along with underlying mechanisms, are discussed with reference to this phase diagram. The obtained results extend our understanding of the fundamental properties of Si oxynitride films and their dependence on the film fabrication conditions, and may be used for tailoring SiOxNy characteristics for practical applications.", "url": "https://arxiv.org/abs/2609.34796", "type": "理论+数值", "summary": "在这项工作中，对非晶 SiOxNy (0 <= x <= 2, 0 <= y <= 4/3) 薄膜中相的形成作为薄膜化学成分和制造温度的函数进行了全面的热力学描述。根据吉布斯自由能的最低值分析了两种可能的相态，即均质单相氮氧化硅和氧化硅和氮化硅相的两相混合物。确定了改变SiOxNy化学计量指数和制造温度时相组成变化的特征。此外，还揭示了两相氮氧化硅中氧化硅和氮化硅相的化学组成特征。特别关注 SiOxNy 薄膜不同相态之间边界的热力学起源，并确定分隔它们的临界化学计量值。构建了一个综合相图，表明单相和两相 SiOxNy 区域作为制造温度的函数。\n\n参考该相图讨论了不同 SiOxNy 相状态之间转变的特性以及潜在机制。所获得的结果扩展了我们对氮氧化硅薄膜的基本性质及其对薄膜制造条件的依赖性的理解，并且可用于为实际应用定制SiOxNy特性。", "authors": [{"name": "Andrey Sarikov"}, {"name": "Mariia Babiichuk"}, {"name": "Mariia Voitovych"}, {"name": "Sergii V. Mamykin1"}], "featured_authors": [{"name": "Andrey Sarikov"}, {"name": "Mariia Babiichuk"}, {"name": "Mariia Voitovych"}, {"name": "Sergii V. Mamykin1"}], "author_count": 4}, {"id": "2609.34869", "category": "cond-mat", "title": "Chemical site bases and average-atom potentials for the atomic cluster expansion", "abstract": "Interatomic potentials are central tools in the atomistic modeling of materials. The atomic cluster expansion (ACE) parameterizes such potentials from ab initio data, conventionally encoding the chemical degrees of freedom with a one-hot representation that yields chemically stratified models. The alternative chemical representations used in on-lattice configurational cluster expansions have not been assessed for interatomic potentials. Here we revisit the multicomponent ACE for an arbitrary chemical site basis. We then establish an exact analytical mapping between a fitted linear ACE and the average-atom potential that describes a perfectly random alloy. We benchmark potentials built on the occupational, Chebyshev, and conventional ACE bases against solute binding and vacancy formation energies in Mg-Nd, and against the mixing enthalpies of the Mo-Nb and Cr-W solid solutions. When training data are scarce, the occupational basis converges fastest and offers the best control over targeted material properties, while the conventional and Chebyshev bases face challenges in reproducing these properties. The occupational basis likewise yields the most reliable average-atom description of disordered alloy thermodynamics. In the large-data limit the three bases perform identically. The chemical basis is therefore a design choice that governs data efficiency. Its explicit treatment opens a route to average-atom potentials for the thermodynamic, mechanical, and kinetic properties of concentrated alloys.", "url": "https://arxiv.org/abs/2609.34869", "type": "理论+数值", "summary": "原子间势是材料原子建模的核心工具。原子簇扩展（ACE）从头开始数据参数化这种势，通常用产生化学分层模型的单热表示来编码化学自由度。晶格构型簇扩展中使用的替代化学表示尚未评估原子间势。在这里，我们重新审视基于任意化学位点的多组分 ACE。然后，我们在拟合的线性 ACE 和描述完全随机合金的平均原子势之间建立精确的分析映射。我们根据 Mg-Nd 中的溶质结合能和空位形成能，以及 Mo-Nb 和 Cr-W 固溶体的混合焓，对建立在职业、切比雪夫和传统 ACE 基础上的势进行基准测试。当训练数据稀缺时，职业基础收敛速度最快，并对目标材料特性提供最佳控制，而传统基础和切比雪夫基础在重现这些特性方面面临挑战。\n\n职业基础同样产生了无序合金热力学最可靠的平均原子描述。在大数据限制下，三个碱基的表现相同。因此，化学基础是控制数据效率的设计选择。其显式处理为浓缩合金的热力学、机械和动力学性能的平均原子势开辟了一条途径。", "authors": [{"name": "Lorenzo Piersante"}, {"name": "Anirudh Raju Natarajan"}], "featured_authors": [{"name": "Lorenzo Piersante"}, {"name": "Anirudh Raju Natarajan"}], "author_count": 2}, {"id": "2609.34914", "category": "cond-mat", "title": "A Unified Rational-Function Approximation for Square-Well, Square-Shoulder, and Nonadditive Hard-Sphere Mixtures", "abstract": "We develop a rational-function approximation for the structural properties of multicomponent fluids with narrow square-well and square-shoulder interactions, together with weakly nonadditive hard-sphere mixtures. The theory is obtained by reformulating the analytical Percus--Yevick solution for additive sticky hard-sphere mixtures so as to account for finite interaction widths, leading to a unified semianalytical framework for these classes of fluids. The approximation satisfies the exact low-density limit and preserves the continuity of the cavity functions; a simple local correction restores the continuity of their first derivatives. Comparison with Monte Carlo simulations for binary mixtures shows that the theory accurately describes both the radial distribution functions and their Fourier transforms for narrow wells and shoulders and for weak nonadditivity. The proposed formulation extends previous sticky-hard-sphere-based approaches while retaining their analytical simplicity.", "url": "https://arxiv.org/abs/2609.34914", "type": "理论+数值", "summary": "我们为具有窄方井和方肩相互作用的多组分流体以及弱非加性硬球混合物的结构特性开发了有理函数近似。该理论是通过重新公式化添加剂粘性硬球混合物的解析 Percus-Yevick 解来获得的，以考虑有限的相互作用宽度，从而为这些类别的流体提供统一的半解析框架。该近似满足精确的低密度极限并保持腔函数的连续性；简单的局部校正可以恢复其一阶导数的连续性。与二元混合物的蒙特卡罗模拟比较表明，该理论准确地描述了窄井和台肩以及弱非可加性的径向分布函数及其傅里叶变换。所提出的公式扩展了先前基于粘性硬球的方法，同时保留了其分析简单性。", "authors": [{"name": "Andrés Santos"}, {"name": "Santos B. Yuste"}, {"name": "Ana M. Montero"}, {"name": "Mariano López de Haro"}], "featured_authors": [{"name": "Andrés Santos"}, {"name": "Santos B. Yuste"}, {"name": "Ana M. Montero"}, {"name": "Mariano López de Haro"}], "author_count": 4}, {"id": "2609.34926", "category": "cond-mat", "title": "Spontaneous breaking of continuous scale invariance and Efimovian-like dynamics in a driven-dissipative harmonic oscillator", "abstract": "The Efimov effect manifests discrete scale invariance through a geometric series of three-body bound states. Analogous discrete scale symmetry has been observed in the Efimovian expansion of scale-invariant strongly interacting Fermi gases. However, it is unclear whether strong correlation is necessary. Here we investigate the spontaneous breaking of continuous scale invariance in a simple driven-dissipative harmonic oscillator whose driving and dissipation parameters scale as $1/t$. By transforming to logarithmic time, we show that the dynamics is governed by a non-Hermitian superoperator whose spectral decomposition reveals the emergence of a pair of eigenmodes with opposite real parts and equal imaginary parts. This signals the spontaneous breaking of continuous scale invariance and gives rise to Efimovian-like oscillations: log-periodic decay oscillations obeying discrete scaling laws. The onset of oscillations coincides with a PT-symmetry breaking transition in logarithmic time. The Efimovian-like oscillations are robust against weak nonlinear interactions and perturbations. Our work implies that the spontaneous breaking of continuous temporal scale symmetry and the emergence of Efimovian-like dynamics can even be observed in a simple driven-dissipative system without many-body interactions.", "url": "https://arxiv.org/abs/2609.34926", "type": "理论", "summary": "Efimov 效应通过三体束缚态的几何序列表现出离散尺度不变性。在尺度不变的强相互作用费米气体的埃菲莫夫展开式中也观察到了类似的离散尺度对称性。然而，尚不清楚是否需要强相关性。在这里，我们研究了一个简单的驱动耗散谐振子中连续尺度不变性的自发破坏，其驱动和耗散参数的比例为 1/t$。通过转换为对数时间，我们表明动力学是由非厄米特超算子控制的，其谱分解揭示了一对具有相反实部和相等虚部的本征模的出现。这标志着连续尺度不变性的自发破坏，并引起类埃菲莫夫振荡：服从离散尺度定律的对数周期衰减振荡。振荡的开始与对数时间内 PT 对称性破缺转变一致。类埃菲莫夫振荡对于弱非线性相互作用和扰动具有鲁棒性。\n\n我们的工作意味着连续时间尺度对称性的自发破缺和类埃菲莫夫动力学的出现甚至可以在没有多体相互作用的简单驱动耗散系统中观察到。", "authors": [{"name": "Zehui Wu"}, {"name": "Jian Yu"}, {"name": "Jian-Song Pan"}], "featured_authors": [{"name": "Zehui Wu"}, {"name": "Jian Yu"}, {"name": "Jian-Song Pan"}], "author_count": 3}, {"id": "2609.35004", "category": "cond-mat", "title": "Unconventional superconductivity in locally non-centrosymmetric CeNi$_2$As$_2$", "abstract": "Recent years have seen intense research on heavy fermion superconductivity, inspired by the discovery of multiple superconducting phases in UTe$_\\text{2}$ and CeRh$_\\text{2}$As$_\\text{2}$. In the latter material, two superconducting phases observed under applied magnetic field oriented along the crystallographic $\\textit{c}$ direction are associated with local inversion symmetry breaking. To advance understanding of these phenomena, it is highly desirable to find further examples of heavy fermion superconductivity in materials with locally non-centrosymmetric structure. We have succeeded in this quest, by growing single crystals of the CaBe$_\\text{2}$Ge$_\\text{2}$ isomorph of CeNi$_\\text{2}$As$_\\text{2}$. The resulting superconductivity brings more than we had foreseen. In addition to providing the opportunity to compare and contrast with that of CeRh$_\\text{2}$As$_\\text{2}$, the condensation occurs from an incoherent normal state quantitatively similar to that of UBe$_\\text{13}$. Our findings therefore raise profound questions not just about superconductivity in the locally non-centrosymmetric structures, but about unconventional superconductivity itself.", "url": "https://arxiv.org/abs/2609.35004", "type": "理论", "summary": "近年来，受到 UTe$_\\text{2}$ 和 CeRh$_\\text{2}$As$_\\text{2}$ 中多个超导相的发现的启发，人们对重费米子超导性进行了深入的研究。在后一种材料中，在沿晶体 $\\textit{c}$ 方向取向的外加磁场下观察到的两个超导相与局部反演对称性破缺相关。为了加深对这些现象的理解，非常需要在具有局部非中心对称结构的材料中找到重费米子超导性的更多例子。通过生长 CaBe$_\\text{2}$Ge$_\\text{2}$ 同晶型 CeNi$_\\text{2}$As$_\\text{2}$ 的单晶，我们成功地完成了这一任务。由此产生的超导性带来的效果超出了我们的预见。除了提供与 CeRh$_\\text{2}$As$_\\text{2}$ 进行比较和对比的机会之外，凝结发生在与 UBe$_\\text{13}$ 定量相似的不相干正常状态。因此，我们的研究结果不仅提出了关于局部非中心对称结构中的超导性的深刻问题，而且还提出了关于非常规超导性本身的深刻问题。", "authors": [{"name": "Félix Morineau"}, {"name": "Jan Knapp"}, {"name": "Javier Landaeta"}, {"name": "Thomas Lühmann"}, {"name": "Lea Richter"}, {"name": "Petra Knappova"}, {"name": "Soumen Ash"}, {"name": "Sushma Lakshmi Ravi Sankar"}, {"name": "Konstantin Semeniuk"}, {"name": "Elena Hassinger"}, {"name": "Christoph Geibel"}, {"name": "Manuel Brando"}, {"name": "Daniel F. Agterberg"}, {"name": "Andrew P. Mackenzie"}, {"name": "Seunghyun Khim"}], "featured_authors": [{"name": "Félix Morineau"}, {"name": "Jan Knapp"}, {"name": "Javier Landaeta"}, {"name": "Daniel F. Agterberg"}, {"name": "Andrew P. Mackenzie"}, {"name": "Seunghyun Khim"}], "author_count": 15}, {"id": "2609.35085", "category": "cond-mat", "title": "Quorum sensing with density-enhanced motility and size regulation", "abstract": "Motivated by biological systems and my previous studies of quorum sensing with density-enhanced motility, I study a model of density-enhanced size and motility, in which both particle size and motility increase when the local density (over a lengthscale larger than particle diameter) exceeds the global density. The emergent structures along different size ratios are spots, holes, bands and labyrinths controlled by several distinct observations. First, the characteristic pattern length scale is controlled by the sensing radius and remains approximately independent of the size ratio. Second, the total area occupied by the particles decreases with increasing size ratio. Third, the active fraction barely depends on the size ratio. These results demonstrate how both particle size and motility can couple microscopic regulation to large-scale pattern formation. I conclude by discussing possible extensions of the model.", "url": "https://arxiv.org/abs/2609.35085", "type": "理论", "summary": "受生物系统和我之前对密度增强运动性群体感应研究的启发，我研究了密度增强尺寸和运动性模型，其中当局部密度（在大于颗粒直径的长度尺度上）超过全局密度时，颗粒尺寸和运动性都会增加。沿着不同尺寸比例出现的结构是由几个不同的观察控制的点、孔、带和迷宫。首先，特征图案长度尺度由感测半径控制，并且大致与尺寸比无关。其次，颗粒占据的总面积随着尺寸比的增加而减小。第三，活性分数几乎不依赖于尺寸比。这些结果证明了颗粒尺寸和运动性如何将微观调控与大规模图案形成结合起来。最后我讨论了模型的可能扩展。", "authors": [{"name": "Itay Azizi"}], "featured_authors": [{"name": "Itay Azizi"}], "author_count": 1}, {"id": "2609.35127", "category": "cond-mat", "title": "Landau-de Gennes corrections to the Oseen-Frank limit: Anchoring-induced tilt modes", "abstract": "An asymptotic analysis of the Landau--de Gennes framework is performed to compute higher-order corrections to the Oseen--Frank limit in a bounded three-dimensional domain under appropriately scaled surface anchoring energy. A systematic decomposition of the $\\mathbf{Q}$-tensor into three mutually orthogonal subspaces-the uniaxial scalar, geometric tilt vector, and transverse anisotropy tensor-reveals that the leading $\\mathcal{O}(\\varepsilon)$ correction to the Oseen--Frank director field $\\mathbf{n}_0(\\mathbf{x})$ is dominated by a non-vanishing tilt field $\\mathbf{p}_1(\\mathbf{x})$, where $\\varepsilon$ represents the ratio of the nematic coherence length to the characteristic domain size. This macroscopic variation constitutes a soft mode released from the boundary once the surface anchoring energy is retained at its physical scaling rather than driven to an infinite strength. We show that this tilt field is governed by the linear Jacobi equation, $\\mathcal{J}_{\\mathbf{n}_0}(\\mathbf{p}_1)=\\mathbf{0}$, subject to a non-trivial, anchoring-driven Dirichlet boundary condition, where $\\mathcal{J}_{\\mathbf{n}_0}$ is the on-shell Jacobi operator of the harmonic map $\\mathbf{n}_0$ on $\\mathbb{S}^2$. The two fields are accompanied at $\\mathcal{O}(\\varepsilon^2)$ by an off-shell correction to both the uniaxial scalar and the transverse anisotropy tensor, passively induced by the elastic non-uniformity $(\\nabla\\mathbf{n}_0\\neq\\mathbf{0})$ and the boundary-driven tilt $(\\mathbf{p}_1\\neq\\mathbf{0})$. Through $\\mathcal{O}(\\varepsilon^2)$, the tilt enters the energy only through surface terms, not the bulk, providing a pathway for the system to lower its energy . Under the conventional benchmark of rigid Dirichlet conditions, this response is annihilated outright, demonstrating that corrections built upon infinite energy barriers obscure the underlying physics of anchoring-driven tilt modes.", "url": "https://arxiv.org/abs/2609.35127", "type": "理论", "summary": "对 Landau-de Gennes 框架进行渐近分析，以在适当缩放的表面锚定能下计算有界三维域中 Oseen-Frank 极限的高阶修正。将 $\\mathbf{Q}$ 张量系统分解为三个相互正交的子空间（单轴标量、几何倾斜矢量和横向各向异性张量），揭示了对 Oseen--Frank 指向场 $\\mathbf{n}_0(\\mathbf{x})$ 的领先 $\\mathcal{O}(\\varepsilon)$ 校正由非消失倾斜场主导$\\mathbf{p}_1(\\mathbf{x})$，其中$\\varepsilon$表示向列相干长度与特征域大小的比率。一旦表面锚定能保持在其物理尺度而不是被驱动到无限强度，这种宏观变化就构成了从边界释放的软模式。\n\n我们表明，该倾斜场由线性雅可比方程 $\\mathcal{J}_{\\mathbf{n}_0}(\\mathbf{p}_1)=\\mathbf{0}$ 控制，并受到非平凡的、锚定驱动的狄利克雷边界条件的影响，其中 $\\mathcal{J}_{\\mathbf{n}_0}$ 是调和映射的壳上雅可比算子$\\mathbf{n}_0$ 于 $\\mathbb{S}^2$。这两个场在 $\\mathcal{O}(\\varepsilon^2)$ 处伴随着对单轴标量和横向各向异性张量的离壳校正，由弹性不均匀性 $(\\nabla\\mathbf{n}_0\\neq\\mathbf{0})$ 和边界驱动倾斜被动引起$(\\mathbf{p}_1\\neq\\mathbf{0})$。通过$\\mathcal{O}(\\varepsilon^2)$，倾斜仅通过表面项而不是体积项进入能量，为系统降低能量提供了途径。在刚性狄利克雷条件的传统基准下，这种响应被彻底消除，这表明基于无限能量势垒的修正掩盖了锚定驱动倾斜模式的基本物理原理。", "authors": [{"name": "Prabakaran Rajamanickam"}], "featured_authors": [{"name": "Prabakaran Rajamanickam"}], "author_count": 1}, {"id": "2609.35169", "category": "cond-mat", "title": "Improving the critical current density of the $\\mathrm{V}_{0.59}\\mathrm{Ti}_{0.40}\\mathrm{Ce}_{0.01}$ alloy superconductor through successive cold-working and annealing at different temperatures", "abstract": "The critical current density ($J_c$) of V-Ti alloy superconductors is strongly influenced by the size and distribution of microstructural defects that pin magnetic flux lines. In this work, the effect of successive cold working and annealing (SCA) at 550°C on the microstructure, superconducting properties, and flux-pinning behaviour of the V$_{0.59}$Ti$_{0.40}$Ce$_{0.01}$ alloy is investigated and compared with the previously reported SCA at 450 and 650°C. During SCA at 550°C, the superconducting transition temperature increases gradually with successive processing steps. The first annealing after cold rolling to 50% thickness produces a significant enhancement in $J_c$ over the measured field range, whereas subsequent SCA cycles result in only marginal changes. The $J_c$ remains relatively weakly dependent on magnetic field over wide magnetic-field range, and the final cold-worked sample exhibits a finite $J_c$ up to 8.5 T. Pinning force density analysis shows that grain boundaries dominate flux pinning in low magnetic fields, whereas dislocations and $\\beta$-$\\alpha'$ interfaces become the dominant pinning centres in higher fields. Comparison of the different SCA temperatures shows that 650°C provides the highest low-field $J_c$, whereas 450°C gives the best high-field performance. In contrast, SCA at 550°C provides most balanced field dependence and the largest enhancement in $J_c$ relative to the corresponding as-cast alloy. Although the highest absolute $J_c$ in the high-field regime is achieved after the third SCA cycle at 450°C, a comparable value is obtained after only the first annealing at 550°C. These results demonstrate that the intermediate annealing temperature of 550°C provides an effective balance between defect generation, phase evolution, and recovery, resulting in enhanced flux pinning over a wide magnetic-field range.", "url": "https://arxiv.org/abs/2609.35169", "type": "理论", "summary": "V-Ti 合金超导体的临界电流密度 ($J_c$) 受到固定磁通线的微观结构缺陷的尺寸和分布的强烈影响。在这项工作中，研究了 550°C 的连续冷加工和退火 (SCA) 对 V$_{0.59}$Ti$_{0.40}$Ce$_{0.01}$ 合金的微观结构、超导性能和磁通钉扎行为的影响，并与之前报道的 450 和 650°C 的 SCA 进行了比较。在 550°C 的 SCA 过程中，超导转变温度随着连续的处理步骤逐渐升高。冷轧至 50% 厚度后的第一次退火在测量的场范围内产生 $J_c$ 的显着增强，而随后的 SCA 循环仅导致边际变化。在较宽的磁场范围内，$J_c$ 对磁场的依赖性相对较弱，最终的冷加工样品表现出高达 8.5 T 的有限 $J_c$。钉扎力密度分析表明，晶界在低磁场中主导磁通钉扎，而位错和 $\\beta$-$\\alpha'$ 界面成为较高磁场中的主要钉扎中心。\n\n不同 SCA 温度的比较表明，650°C 提供最高的低场 $J_c$，而 450°C 则提供最佳的高场性能。相比之下，550°C 下的 SCA 相对于相应的铸态合金提供了最平衡的场依赖性和最大的 $J_c$ 增强。尽管在 450°C 的第三次 SCA 循环后实现了高场状态下的最高绝对 $J_c$，但仅在 550°C 的第一次退火后才获得了可比较的值。这些结果表明，550°C 的中间退火温度在缺陷产生、相演化和恢复之间提供了有效的平衡，从而在宽磁场范围内增强了磁通钉扎。", "authors": [{"name": "Asi Khandelwal"}, {"name": "SK. Ramjan"}, {"name": "Basudev Padhi"}, {"name": "L. S. Sharath Chandra"}, {"name": "Archna Sagdeo"}, {"name": "Kranti Kumar"}, {"name": "Sudip Pal"}, {"name": "M. K. Chattopadhyay"}], "featured_authors": [{"name": "Asi Khandelwal"}, {"name": "SK. Ramjan"}, {"name": "Basudev Padhi"}, {"name": "Kranti Kumar"}, {"name": "Sudip Pal"}, {"name": "M. K. Chattopadhyay"}], "author_count": 8}, {"id": "2609.35178", "category": "cond-mat", "title": "t-J model at 50", "abstract": "I briefly overview the original formulation of the t-J model starting from Hubbard model, as well as stress its unique features, i.e., advantages and shortcomings when discussing its physical properties. Particular emphasis is put on a brief characterization of connection between magnetism, unconventional superconductivity, and the Mott-Hubbard localization of the correlated carriers in a narrow band. In the second part I summarize the model generalization to the three--orbital situation. The main purpose is to list some basic features of the physics associated with t--J model.", "url": "https://arxiv.org/abs/2609.35178", "type": "理论", "summary": "我简要概述了从 Hubbard 模型开始的 t-J 模型的原始表述，并在讨论其物理性质时强调了其独特之处，即优点和缺点。特别强调了磁性、非常规超导性和窄带中相关载流子的莫特-哈伯德局域化之间联系的简要表征。在第二部分中我总结了模型对三轨道情况的推广。主要目的是列出与 t--J 模型相关的物理学的一些基本特征。", "authors": [{"name": "Józef Spałek"}], "featured_authors": [{"name": "Józef Spałek"}], "author_count": 1}, {"id": "2609.35230", "category": "cond-mat", "title": "Exact probability distributions of complex spacing ratios in non-Hermitian random matrices", "abstract": "The complex spacing ratio is the complex displacement from a reference eigenvalue to its nearest neighbor divided by the corresponding displacement to its next-to-nearest neighbor. Its statistics provide a useful diagnostic of spectral correlations and nonintegrability in open quantum systems. Here, starting from the exact joint eigenvalue probability densities, we derive finite-$N$ complex-spacing-ratio distributions for the Gaussian ensembles of non-Hermitian random matrices in classes AI$^†$ and AII$^†$, realized by complex symmetric and complex self-dual random matrices, respectively. In class AII$^†$, we obtain an exact algebraic expression for arbitrary $N$ and explicitly evaluate the distributions and representative moments for $N=3, 4, 5, 6$. In class AI$^†$, although the joint density retains a noncompact integral over nonunitary eigenvector degrees of freedom, we analytically derive a normalized one-dimensional integral representation for $N=3$ and determine the asymptotic behavior, including a logarithmic correction to the cubic level repulsion and a nonanalytic contribution to the angular density. We further confirm these analytical results through direct numerical diagonalization of non-Hermitian random matrices.", "url": "https://arxiv.org/abs/2609.35230", "type": "理论+数值", "summary": "复间距比是从参考特征值到其最近邻的复位移除以到其次近邻的相应位移。它的统计数据为开放量子系统中的光谱相关性和不可积性提供了有用的诊断。在这里，从精确的联合特征值概率密度开始，我们推导出 AI$^†$ 类和 AII$^†$ 类中非埃尔米特随机矩阵高斯系综的有限 $N$ 复间距比分布，分别通过复对称和复自对偶随机矩阵实现。在 AII$^†$ 类中，我们获得任意 $N$ 的精确代数表达式，并显式评估 $N=3, 4, 5, 6$ 的分布和代表矩。在 AI$^†$ 类中，虽然联合密度在非酉特征向量自由度上保留了非紧积分，但我们分析推导了 $N=3$ 的归一化一维积分表示并确定渐近行为，包括对立方级排斥力的对数校正和对角密度的非解析贡献。\n\n我们通过非厄米随机矩阵的直接数值对角化进一步证实了这些分析结果。", "authors": [{"name": "Kohei Kawabata"}], "featured_authors": [{"name": "Kohei Kawabata"}], "author_count": 1}, {"id": "2609.35270", "category": "cond-mat", "title": "Attraction-controlled torque organization and rotational states in frictional granular matter", "abstract": "In this study, we numerically investigate how interparticle attraction affects stress transmission, torque organization, and particle rotation in a two-dimensional frictional granular material. Although the attraction is a central force and exerts no direct torque on the particles, it strongly modifies the contact network and particle rotation. Attraction produces a low-rate stress state and selects the high-stress state near the shear-thickening regime of the dry system, while leaving the high-rate thickened state almost unchanged. By decomposing the shear stress, we find that the direct attractive contribution accounts for only a fraction of the total stress, while the repulsive contribution is strongly enhanced. Attraction increases the coordination number and torque amplitude and can reverse the local torque-sign correlation. At low packing fractions and intermediate shear rates, a stress-collapse state emerges with strongly suppressed torque and rotation despite a finite contact network. These results show that attraction controls macroscopic rheology through reorganization of the frictional contact network.", "url": "https://arxiv.org/abs/2609.35270", "type": "数值", "summary": "在这项研究中，我们通过数值研究了颗粒间吸引力如何影响二维摩擦颗粒材料中的应力传递、扭矩组织和颗粒旋转。尽管吸引力是中心力并且不对颗粒施加直接扭矩，但它强烈地改变了接触网络和颗粒旋转。吸引力产生低速率应力状态并选择接近干燥系统的剪切增稠状态的高应力状态，同时使高速率增稠状态几乎不变。通过分解剪应力，我们发现直接吸引贡献仅占总应力的一小部分，而排斥贡献则大大增强。吸引力增加了协调数和扭矩幅度，并且可以反转局部扭矩-符号相关性。在低填充分数和中等剪切速率下，尽管接触网络有限，但仍会出现应力塌陷状态，并且扭矩和旋转受到强烈抑制。这些结果表明，吸引力通过摩擦接触网络的重组来控制宏观流变。", "authors": [{"name": "Kiwamu Yoshii"}], "featured_authors": [{"name": "Kiwamu Yoshii"}], "author_count": 1}, {"id": "2609.35346", "category": "cond-mat", "title": "Machine-learning-guided exploration of domain walls in the hybrid improper ferroelectric Ca3Ti2O7", "abstract": "Ruddlesden-Popper phases are highly tunable and naturally layered structures, in which polarization can arise via a hybrid improper ferroelectric mechanism. This enables a complex domain wall (DW) structure where multiple order parameters, like octahedral rotations, polar distortions and strain, interact. In this work, we explore the rich set of DW structures in prototypical Ca3Ti2O7, mapping out the DWs in the {100}, {110} and {001} pseudo-tetragonal planes using group theory and machine-learned interatomic potentials (MLIPs). The trained potential reproduces the density functional theory (DFT) order parameter and polarization profiles for all wall types and orientations considered. A charge-aware training framework combined with reference Born effective charges reduces the prediction errors for the DW formation energies by 70%, revealing the importance of including long-range electrostatics to model symmetry-broken interfaces. Finally, the MLIP is used to identify minimum energy pathways at the atomic scale with nearly the precision of DFT calculations, revealing a low-energy antipolar configuration for polarization switching.", "url": "https://arxiv.org/abs/2609.35346", "type": "理论+数值", "summary": "Ruddlesden-Popper 相是高度可调的自然分层结构，其中极化可以通过混合不正确的铁电机制产生。这使得复杂的畴壁 (DW) 结构成为可能，其中多个有序参数（如八面体旋转、极性扭曲和应变）相互作用。在这项工作中，我们探索了原型 Ca3Ti2O7 中丰富的 DW 结构，使用群论和机器学习原子间势 (MLIP) 绘制了 {100}、{110} 和 {001} 伪四方平面中的 DW。训练后的势能再现所有考虑的壁类型和方向的密度泛函理论 (DFT) 阶参数和偏振剖面。电荷感知训练框架与参考 Born 有效电荷相结合，可将 DW 形成能量的预测误差降低 70%，揭示了将远程静电纳入对称破缺界面模型中的重要性。最后，MLIP 用于识别原子尺度上的最小能量路径，其精度接近 DFT 计算，揭示了用于偏振切换的低能反极性配置。", "authors": [{"name": "Ida C. Skogvoll"}, {"name": "Erik Fransson"}, {"name": "Leo Ö. Westin"}, {"name": "Benjamin A. D. Williamson"}, {"name": "Nicholas C. Bristowe"}, {"name": "Sverre M. Selbach"}, {"name": "Paul Erhart"}], "featured_authors": [{"name": "Ida C. Skogvoll"}, {"name": "Erik Fransson"}, {"name": "Leo Ö. Westin"}, {"name": "Nicholas C. Bristowe"}, {"name": "Sverre M. Selbach"}, {"name": "Paul Erhart"}], "author_count": 7}, {"id": "2609.35373", "category": "cond-mat", "title": "Plasmon modes in three-dimensional nodal-ring semimetals: tilt and gap effects", "abstract": "We study plasmon modes in three-dimensional nodal-ring semimetals, considering both the gapless $\\mathcal{PT}$-symmetric nodal ring (PTNR) and its gapped counterpart (GNR). Working in the low-doping regime where the linearised Hamiltonian is valid, we compute the non-interacting density-density response function, the Drude weight, and the plasmon dispersion within the random-phase approximation. We treat the untilted configuration as well as in-plane tilt along $k_x$ and axial tilt along $k_z$. For the in-plane tilted GNR, a strong-enough tilt or a small enough chemical potential pushes part of the ring into a partially-gapped regime. Only part of the Fermi surface survives there. We obtain closed-form results for this regime in two limits: a small tilt and a small gap. The small-gap limit produces a fractional-power correction to the Drude weight and the plasmon frequency. For the axially-tilted GNR, the partially-gapped window has a double-valued local Fermi surface for which we obtain the density-of-states and the Drude weights in closed forms. We analyse how the tilt and the mass-gap affect the plasmon dispersion and the anisotropy between axial and in-plane directions. Our results provide a systematic comparison between the gapless and gapped cases and between different tilt directions.", "url": "https://arxiv.org/abs/2609.35373", "type": "理论", "summary": "我们研究了三维节环半金属中的等离激元模式，考虑了无间隙 $\\mathcal{PT}$ 对称节环（PTNR）及其有间隙对应物（GNR）。在线性化哈密顿量有效的低掺杂状态下工作，我们计算了随机相位近似内的非相互作用密度-密度响应函数、德鲁德权重和等离激元色散。我们处理倾斜配置以及沿 $k_x$ 的面内倾斜和沿 $k_z$ 的轴向倾斜。对于面内倾斜的 GNR，足够强的倾斜或足够小的化学势会将环的一部分推入部分带隙状态。那里只有部分费米面幸存下来。我们在两个限制下获得了该状态的封闭形式结果：小倾斜和小间隙。小间隙限制对德鲁德重量和等离子体频率产生分数功率校正。对于轴向倾斜的 GNR，部分间隙窗口具有双值局部费米面，我们可以通过它获得闭合形式的态密度和 Drude 权重。我们分析了倾斜和质量间隙如何影响等离激元色散以及轴向和面内方向之间的各向异性。\n\n我们的结果提供了无间隙和有间隙情况以及不同倾斜方向之间的系统比较。", "authors": [{"name": "Ipsita Mandal"}], "featured_authors": [{"name": "Ipsita Mandal"}], "author_count": 1}, {"id": "2609.35485", "category": "cond-mat", "title": "Out-of-equilibrium finite-time percolation transitions and spinodal-like behaviors after quenches across magnetic first-order transitions of Ising systems", "abstract": "We analyze the out-of-equilibrium relaxational dynamics of ferromagnetic Ising-like systems driven across their low-temperature magnetic first-order transition (FOT) line, by sudden and slow variations of an external homogenous magnetic field $h$. As a paradigmatic example, we consider a two-dimensional Ising system driven across its low-temperature FOT line by suddently quenching $h$ from $h_i<0$ to $h>0$, inducing a transition from the negatively to the positively magnetized phase. We show the emergence of a dynamic percolation transition at a finite critical time $t_c(h)$ along the post-quench evolution for finite (sufficiently small) values of $h$, which is marked by the percolation of the largest positive-spin cluster and the antipercolation of the largest negative-spin cluster. This out-of-equilibrium percolation transition displays a finite-size scaling behavior as in the standard random-percolation case. However, while the fractal dimension of the percolating clusters is consistent with the random-percolation value, the exponent controlling the approach to criticality differs and depends on $h$. We also show that the percolation transition marks the passage from the metastable negatively-magnetized phase to the stable positively-magnetized one. Therefore, in the small-$h$ limit, the percolation critical behavior is related to the spinodal-like behavior of the magnetization, implying that the percolation time $t_c(h)$ exhibits a spinodal-like exponential dependence on $h$. The existence of percolation transitions is likely a generic phenomenon at magnetic Ising-like FOTs. For example, we observe an analogous behavior in dynamic (Kibble-Zurek-like) protocols entailing slow variations of the magnetic field driving the crossing of the FOT line.", "url": "https://arxiv.org/abs/2609.35485", "type": "理论+数值", "summary": "我们分析了通过外部均匀磁场 $h$ 的突然和缓慢变化驱动的铁磁类伊辛系统穿过其低温磁一阶转变 (FOT) 线的不平衡弛豫动力学。作为一个典型的例子，我们考虑一个二维 Ising 系统，通过将 $h$ 从 $h_i<0$ 突然淬火到 $h>0$ 来驱动穿过其低温 FOT 线，从而诱导从负磁化相到正磁化相的转变。我们展示了在有限临界时间$t_c(h)$沿着淬火后演化对于$h$的有限（足够小）值出现动态渗流转变，其特征是最大正自旋簇的渗流和最大负自旋簇的反渗流。这种不平衡渗流转变显示出与标准随机渗流情况一样的有限尺寸缩放行为。然而，虽然渗滤簇的分形维数与随机渗滤值一致，但控制关键性方法的指数不同并且取决于 $h$。\n\n我们还表明，渗流转变标志着从亚稳态负磁化相到稳定正磁化相的转变。因此，在小 $h$ 极限下，渗流临界行为与磁化强度的旋节线行为相关，这意味着渗流时间 $t_c(h)$ 对 $h$ 表现出类旋节线指数依赖性。渗流跃迁的存在可能是类伊辛 FOT 中的普遍现象。例如，我们在动态（类似 Kibble-Zurek）协议中观察到类似的行为，该协议需要驱动 FOT 线交叉的磁场缓慢变化。", "authors": [{"name": "Andrea Pelissetto"}, {"name": "Davide Rossini"}, {"name": "Ettore Vicari"}], "featured_authors": [{"name": "Andrea Pelissetto"}, {"name": "Davide Rossini"}, {"name": "Ettore Vicari"}], "author_count": 3}, {"id": "2609.35492", "category": "cond-mat", "title": "Dynamical transition in non-Hermitian Chern insulator", "abstract": "We unveil a peculiar dynamical transition for the propagation of wave packets in non-Hermitian Chern insulators, where the evolution of the topological wave packets at the edge is not solely determined by the topological Chern number. Unlike the Hermitian Chern insulator, where a wave packet initiated at the edge propagates along the system boundary, here it may instead penetrate into the bulk. This behavior is attributed to the competition between the localization induced by conventional topology and the non-Hermitian skin effect. Specifically, when the former dominant, the wave packet will evolve along the boundary; otherwise, it will spread into the bulk. These features demonstrate that while the generalized-Brillouin zone framework reliably predicts topological phase transitions, it does not on its own specify the dynamical transitions.", "url": "https://arxiv.org/abs/2609.35492", "type": "理论", "summary": "我们揭示了非厄米陈绝缘体中波包传播的特殊动态转变，其中边缘拓扑波包的演化不仅仅由拓扑陈数决定。与厄米陈绝缘体不同的是，在厄米陈绝缘体中，波包从边缘开始沿着系统边界传播，但在这里它可能会穿透到主体中。这种行为归因于传统拓扑引起的局域化与非厄米集肤效应之间的竞争。具体来说，当前者占主导地位时，波包将沿边界演化；当前者占主导地位时，波包将沿边界演化。否则，它会扩散到大块中。这些特征表明，虽然广义布里渊区框架可靠地预测了拓扑相变，但它本身并不能指定动态转变。", "authors": [{"name": "Zhi-Qiang Zhang"}, {"name": "Yuan-Hang Ren"}, {"name": "Ming Lu"}, {"name": "Hua Jiang"}], "featured_authors": [{"name": "Zhi-Qiang Zhang"}, {"name": "Yuan-Hang Ren"}, {"name": "Ming Lu"}, {"name": "Hua Jiang"}], "author_count": 4}, {"id": "2609.35572", "category": "cond-mat", "title": "Density functional perturbation theory of meta-generalized gradient approximations using algorithmic differentiation", "abstract": "Density functional perturbation theory (DFPT) is an established framework for the computation of derivatives in plane-wave density functional theory. We present an implementation of DFPT for exchange-correlation (XC) functionals $E_\\mathrm{xc}(\\rho,\\tau)$ that incorporate an explicit dependence on both the density $\\rho$ and the kinetic energy density $\\tau$. This covers the popular class of semilocal meta-generalized gradient approximations (meta-GGAs) as well as broader nonlocal parametrizations. We sidestep the derivation of cumbersome XC second energy derivative expressions by recasting these derivatives as a Jacobian-vector product of the XC potentials, which we evaluate with algorithmic differentiation (AD) techniques. Integration with our previously developed AD-DFPT framework [N. F. Schmitz et al., npj Comput. Mater. 12, 6 (2026)] provides access to derivatives of arbitrary ground state quantities with respect to arbitrary perturbations. We employ AD-DFPT to compute a range of response properties for ZnO and BaTiO3, and find that the recent r2SCAN01 meta-GGA functional generally outperforms LDA and PBE. Finally, we showcase the optimization of a neural-network meta-GGA to self-consistently reproduce hybrid-DFT reference densities of bulk silicon, using AD-DFPT gradients. Overall, these results establish AD-DFPT as a versatile route for computing DFT derivatives at the meta-GGA level, be they common response properties or the unusual derivatives required for the gradient-based training of novel XC functionals.", "url": "https://arxiv.org/abs/2609.35572", "type": "理论+数值", "summary": "密度泛函微扰理论 (DFPT) 是平面波密度泛函理论导数计算的既定框架。我们提出了交换相关 (XC) 函数 $E_\\mathrm{xc}(\\rho,\\tau)$ 的 DFPT 实现，它包含对密度 $\\rho$ 和动能密度 $\\tau$ 的显式依赖。这涵盖了流行的半局部元广义梯度近似（meta-GGA）以及更广泛的非局部参数化。我们通过将这些导数重新转换为 XC 势的雅可比向量乘积来避开繁琐的 XC 二阶能量导数表达式的推导，并使用算法微分 (AD) 技术对其进行评估。与我们之前开发的 AD-DFPT 框架集成 [N. F. Schmitz 等人，npj Comput。马特。 12, 6 (2026)] 提供了对任意扰动的任意基态量的导数的访问。我们采用 AD-DFPT 计算 ZnO 和 BaTiO3 的一系列响应特性，发现最近的 r2SCAN01 meta-GGA 泛函通常优于 LDA 和 PBE。\n\n最后，我们展示了神经网络元 GGA 的优化，以使用 AD-DFPT 梯度自洽地再现体硅的混合 DFT 参考密度。总体而言，这些结果将 AD-DFPT 确立为在元 GGA 级别计算 DFT 导数的通用途径，无论是常见的响应属性还是基于梯度的新型 XC 泛函训练所需的不寻常导数。", "authors": [{"name": "Bruno Ploumhans"}, {"name": "Niklas Frederik Schmitz"}, {"name": "Michael F. Herbst"}], "featured_authors": [{"name": "Bruno Ploumhans"}, {"name": "Niklas Frederik Schmitz"}, {"name": "Michael F. Herbst"}], "author_count": 3}, {"id": "2609.35582", "category": "cond-mat", "title": "Periodic Trends and a Physics-Based Multistage Search for High-$T_c$ Hydride Superconductors", "abstract": "Hydrogen-rich materials under pressure are candidates for conventional phonon-mediated superconductivity, but first-principles electron--phonon-coupling (EPC) calculations are computationally demanding. We develop an interpretable multistage workflow for prioritizing binary hydride superconductors before full EPC calculations. Using controlled cubic $X_m$H$_n$ prototypes at 200~GPa, we introduce the spectral moment $A_1$ as an intermediate measure of electron--phonon perturbation strength. In its linewidth-based construction, $A_1$ remains finite as harmonic phonons soften, allowing related structures with imaginary harmonic modes to be screened; it does not establish superconductivity or physical realizability for unstable structures. For dynamically stable cubic systems, $A_1$ correlates strongly with the H-$1s$ density-of-states fraction at the Fermi level, $\\alpha$, a projected Fermi-surface descriptor, $\\beta$, and atomic number density, $\\rho$. These trends are summarized heuristically by $A_1\\approx h\\alpha\\beta\\rho$, where $h$ is framework- and pressure-dependent; the descriptor is used for ranking, not as a universal $T_c$ predictor. We incorporate $\\alpha\\beta\\rho$ and enthalpic competitiveness into a three-stage evolutionary search comprising multiobjective structural screening, harmonic-phonon stability filtering, and coarse density-functional perturbation-theory (DFPT) EPC calculations. Application to more than 100,000 binary hydride structures at 50 and 200~GPa identifies candidates and prioritizes NaH$_6$ structural families. Higher-accuracy calculations show that $Pm\\bar{3}m$ NaH$_6$ is dynamically stable down to 50~GPa and has a harmonic Allen--Dynes estimate of $T_c\\approx230$~K. The framework combines electronic descriptors with progressively more expensive stability and EPC calculations for scalable hydride exploration.", "url": "https://arxiv.org/abs/2609.35582", "type": "理论+数值", "summary": "压力下的富氢材料是传统声子介导超导的候选材料，但第一原理电子声子耦合（EPC）计算的计算要求很高。我们开发了一个可解释的多级工作流程，用于在完整的 EPC 计算之前优先考虑二元氢化物超导体。使用 200~GPa 下的受控立方 $X_m$H$_n$ 原型，我们引入谱矩 $A_1​​$ 作为电子-声子扰动强度的中间度量。在基于线宽的结构中，随着谐波声子软化，$A_1$ 仍然是有限的，从而允许筛选具有虚谐波模式的相关结构；它没有建立不稳定结构的超导性或物理可实现性。对于动态稳定的立方系统，$A_1$ 与费米能级的 H-$1s$ 态密度分数 $\\alpha$、投影费米面描述符 $\\beta$ 和原子序数密度 $\\rho$ 密切相关。这些趋势由 $A_1​​\\approx h\\alpha\\beta\\rho$ 启发式总结，其中 $h$ 依赖于框架和压力；该描述符用于排名，而不是作为通用的 $T_c$ 预测器。\n\n我们将 $\\alpha\\beta\\rho$ 和焓竞争力纳入三阶段进化搜索，包括多目标结构筛选、谐波声子稳定性过滤和粗密度泛函扰动理论 (DFPT) EPC 计算。对 50 和 200~GPa 下超过 100,000 个二元氢化物结构的应用可识别候选结构并优先考虑 NaH$_6$ 结构族。更高精度的计算表明，$Pm\\bar{3}m$ NaH$_6$ 在低至 50~GPa 时动态稳定，并且具有 $T_c\\approx230$~K 的谐波 Allen-Dynes 估计值。该框架将电子描述符与日益昂贵的稳定性和 EPC 计算相结合，以实现可扩展的氢化物勘探。", "authors": [{"name": "Tianran Chen"}, {"name": "Taner Yildirim"}], "featured_authors": [{"name": "Tianran Chen"}, {"name": "Taner Yildirim"}], "author_count": 2}, {"id": "2609.35687", "category": "cond-mat", "title": "Speed-Fisher Information: Chaos and Irreversibility in Classical and Quantum Dynamics", "abstract": "We propose a unified perspective on classical and quantum chaos based on the sensitivity of a system's stationary states to slow driving. We probe this sensitivity via the system's susceptibility to the average protocol speed, which we call the ``speed-Fisher information,\" and relate it to irreversible entropy production in the system. We show that chaotic dynamics manifests as a divergence of the speed-Fisher information with the protocol time, and that this response is controlled by the perturbation's low-frequency spectral weight. This approach to chaos applies to both classical and quantum Hamiltonian systems, and naturally extends to non-Hamiltonian classical flows. Additionally, we identify a quantum regime at times shorter than the Planckian timescale, in which the speed-Fisher information exhibits a uniquely quantum scaling. We illustrate this framework with simple classical and quantum examples", "url": "https://arxiv.org/abs/2609.35687", "type": "理论", "summary": "我们基于系统稳态对慢速驾驶的敏感性，提出了经典混沌和量子混沌的统一观点。我们通过系统对平均协议速度的敏感性（我们称之为“速度费舍尔信息”）来探测这种敏感性，并将其与系统中不可逆的熵产生联系起来。我们表明，混沌动力学表现为速度费舍尔信息与协议时间的发散，并且这种响应由扰动的低频谱权重控制。这种混沌方法适用于经典和量子哈密顿系统，并且自然地扩展到此外，我们还确定了一个比普朗克时间尺度短的量子状态，其中速度费希尔信息表现出独特的量子尺度。", "authors": [{"name": "Nachiket Karve"}, {"name": "Nathan Rose"}, {"name": "David Campbell"}, {"name": "Anatoli Polkovnikov"}], "featured_authors": [{"name": "Nachiket Karve"}, {"name": "Nathan Rose"}, {"name": "David Campbell"}, {"name": "Anatoli Polkovnikov"}], "author_count": 4}, {"id": "2609.35696", "category": "cond-mat", "title":
