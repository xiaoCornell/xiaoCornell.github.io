 structured spectral density, showing for both cases that the transformed HEOM approach allows simulations of much larger system-bath coupling than would otherwise be possible.", "url": "https://arxiv.org/abs/2609.35484", "type": "理论+数值", "summary": "层次运动方程（HEOM）方法是可用于模拟开放量子系统动力学的最强大方法之一。尽管 HEOM 方法已被证明在许多参数体系和物理场景中稳定且高效，但众所周知，不可避免的层次结构有限截断可能会导致玻色子环境的基本数值不稳定。在这项工作中，我们应用最近开发的技术来分析这些问题。我们使用层次结构的辅助福克空间图首先识别不平衡的层次提升项，这些项负责与 HEOM 生成器的非正态代数结构相关的强瞬态放大。然后，我们应用非统一相似性变换，将这些术语转换为层次结构提升和层次结构降低术语的平衡组合，从而抑制它们的数值影响。\n\n我们首先通过具有简单布朗振荡器谱密度的自旋玻色子模型证明了这种方法的有效性，随后将分析扩展到结构化谱密度，表明对于这两种情况，转换后的 HEOM 方法允许模拟比其他方式更大的系统浴耦合。", "authors": [{"name": "Salvatore Gatto"}, {"name": "Samuel L. Rudge"}, {"name": "Bokang Hou"}, {"name": "Eran Rabani"}, {"name": "Michael Thoss"}], "featured_authors": [{"name": "Salvatore Gatto"}, {"name": "Samuel L. Rudge"}, {"name": "Bokang Hou"}, {"name": "Eran Rabani"}, {"name": "Michael Thoss"}], "author_count": 5}, {"id": "2609.35488", "category": "quant-ph", "title": "Temporal trade-offs in high-dimensional entanglement: a comprehensive noise model for optimal time-bin QKD protocols", "abstract": "High-dimensional time-bin entanglement is known for having high potential for quantum key distribution (QKD) applications, being easily implementable, robust and may offer better keyrates than simple qubit protocols. The temporal encoding, combined with limited clock resolution, however, implies a trade-off: Is it better to send more low-dimensionally encoded photons or few high-dimensional ones? Answering this question presents a hard challenge as it depends on the entire context of the protocol, including the production rates, losses, dark counts, timing jitters and many more. We answer this question for single Franson based interferometers and asymptotic key rate and shared entanglement as main figures of merit. We present a flexible noise model incorporating all relevant parameters and find that there are indeed regions where high-dimensional encoding still outperforms any qubit based version when the pair arrival rate is limited, for instance through loss or limited pump power.", "url": "https://arxiv.org/abs/2609.35488", "type": "理论", "summary": "高维时间段纠缠因在量子密钥分发 (QKD) 应用中具有巨大潜力而​​闻名，易于实现、鲁棒性强，并且可以提供比简单量子位协议更好的密钥速率。然而，时间编码与有限的时钟分辨率相结合意味着一种权衡：发送更多低维编码光子还是发送少量高维编码光子更好？回答这个问题是一个艰巨的挑战，因为它取决于协议的整个背景，包括生产率、损失、暗计数、定时抖动等等。我们针对基于单弗兰森干涉仪和渐近关键速率和共享纠缠作为主要品质因数来回答这个问题。我们提出了一种包含所有相关参数的灵活噪声模型，并发现当对到达率受到限制（例如通过损耗或有限的泵浦功率）时，确实存在一些区域，高维编码仍然优于任何基于量子位的版本。", "authors": [{"name": "Alexandra E. Bergmayr-Mann"}, {"name": "Gláucia Murta"}, {"name": "Marcus Huber"}], "featured_authors": [{"name": "Alexandra E. Bergmayr-Mann"}, {"name": "Gláucia Murta"}, {"name": "Marcus Huber"}], "author_count": 3}, {"id": "2609.35489", "category": "quant-ph", "title": "Fourier-Geometric Circuit Design for Gate and Entanglement Placement in Quantum Neural Networks", "abstract": "The output of a parameterized quantum circuit (PQC) can be expressed as a finite Fourier series whose accessible frequencies are fixed by the data-encoding gates. While the encoder determines which frequencies can appear, the corresponding Fourier coefficients depend on how the trainable and entangling gates are arranged. Although existing studies provide metrics for characterizing how gate structure affects Fourier coefficients, they do not translate these analyses into an explicit design criterion specifying how gates should be arranged to make a target coefficient reachable. In this paper, we provide such a criterion. Using the adjoint action of the encoding generator, we decompose operator space into two-dimensional invariant planes indexed by frequency and show that each Fourier coefficient is exactly a sum of bilinear projections of the effective state and observable onto the planes at that frequency. Because, for Pauli encodings, high-frequency planes are spanned by mixed multi-qubit Pauli strings, a target coefficient can contribute to the output only when local rotations and entangling layers are arranged so that both the effective state and observable acquire support on one of its planes. For Pauli readouts and commuting two-qubit entanglers, this yields a circuit design rule that specifies, for a given interaction graph, a placement of local rotations and entangling layers that makes a target Fourier coefficient reachable. Using a single encoding layer, we validate the proposed design through a placement ablation, regression tasks from PDEBench and physics-informed Maxwell field modeling, and further demonstrate its robustness to moderate simulated gate noise and damping.", "url": "https://arxiv.org/abs/2609.35489", "type": "理论", "summary": "参数化量子电路 (PQC) 的输出可以表示为有限傅立叶级数，其可访问频率由数据编码门固定。虽然编码器确定哪些频率可以出现，但相应的傅里叶系数取决于可训练门和纠缠门的排列方式。尽管现有的研究提供了表征门结构如何影响傅里叶系数的指标，但它们并没有将这些分析转化为明确的设计标准，指定应如何排列门以使目标系数可达。在本文中，我们提供了这样一个标准。利用编码生成器的伴随作用，我们将算子空间分解为按频率索引的二维不变平面，并表明每个傅立叶系数恰好是有效状态和可观测到该频率平面上的双线性投影之和。\n\n因为，对于泡利编码，高频平面由混合的多量子位泡利串跨越，因此只有在安排局部旋转和纠缠层以使有效状态和可观测值都在其平面之一上获得支持时，目标系数才能对输出做出贡献。对于泡利读出和交换两个量子位纠缠器，这产生了一个电路设计规则，该规则指定对于给定的交互图，局部旋转和纠缠层的放置，使目标傅立叶系数可达。使用单个编码层，我们通过放置消融、PDEBench 的回归任务和基于物理的麦克斯韦场建模来验证所提出的设计，并进一步证明其对调节模拟栅极噪声和阻尼的鲁棒性。", "authors": [{"name": "Seungcheol Oh"}, {"name": "Chaemoon Im"}, {"name": "Daeyeun Kim"}, {"name": "Soohyun Park"}, {"name": "Vaneet Aggarwal"}, {"name": "Mohsen Heidari"}, {"name": "Joongheon Kim"}], "featured_authors": [{"name": "Seungcheol Oh"}, {"name": "Chaemoon Im"}, {"name": "Daeyeun Kim"}, {"name": "Vaneet Aggarwal"}, {"name": "Mohsen Heidari"}, {"name": "Joongheon Kim"}], "author_count": 7}, {"id": "2609.35523", "category": "quant-ph", "title": "Induced Coherence in Quantum and Classical Interferometry: Origin and Control", "abstract": "The wave-particle duality that manifests in the Young's double-slit interferometry satisfying the well known Englert-Greenberger-Yasin inequality has recently been shown to obey a universal triality relation involving coherence, predictability and rather surprisingly entanglement. In the present work, we explicitly demonstrate the persistence of the triality relation in the quantum induced coherence interferometer and the classical configuration recovers the well known duality inequality. Furthermore, we explore the origin of coherence and entanglement, in the induced coherence interferometer, and means to control them. We show that path indistinguishability (or intrinsic indistinguishability of the sources) in our setup plays a complementary role in influencing both interference and entanglement. We bring out manifestly the nature of coherence in both classical and quantum versions of induced coherence interferometers.", "url": "https://arxiv.org/abs/2609.35523", "type": "理论", "summary": "满足众所周知的恩格勒特-格林伯格-亚辛不等式的杨氏双缝干涉测量中所体现的波粒二象性最近被证明遵循涉及相干性、可预测性和相当令人惊讶的纠缠的普遍三重性关系。在目前的工作中，我们明确证明了量子诱导相干干涉仪中三重关系的持久性，并且经典配置恢复了众所周知的对偶不等式。此外，我们探索了诱导相干干涉仪中相干和纠缠的起源以及控制它们的方法。我们表明，我们的设置中的路径不可区分性（或源的内在不可区分性）在影响干扰和纠缠方面发挥着补充作用。我们清楚地揭示了经典和量子版本的诱导相干干涉仪中相干性的本质。", "authors": [{"name": "Balakrishnan Viswanathan"}, {"name": "Ravi Kamal Pandey"}, {"name": "Devendra Kumar Mishra"}, {"name": "Sibasish Ghosh"}, {"name": "Prasanta K. Panigrahi"}], "featured_authors": [{"name": "Balakrishnan Viswanathan"}, {"name": "Ravi Kamal Pandey"}, {"name": "Devendra Kumar Mishra"}, {"name": "Sibasish Ghosh"}, {"name": "Prasanta K. Panigrahi"}], "author_count": 5}, {"id": "2609.35580", "category": "quant-ph", "title": "Quantum Query Complexity Beyond the Worst Case", "abstract": "Smoothed analysis is a central framework in classical algorithms for explaining the performance of algorithms beyond the worst case, often explaining why algorithms perform well in practice. We initiate a systematic study of its quantum counterpart and show the following results. $(1)$ We show that there is a total function whose smoothed quantum query complexity is exponentially smaller than its classical query complexity. $(2)$ We give near-tight characterizations of smoothed randomized and quantum query complexities for symmetric Boolean functions, unifying the worst-case complexity results of [Beals et al, FOCS'98] and average-case complexity results of [Ambainis and de Wolf, STACS'00]. $(3)$ We study string problems such as pattern matching and edit distance and, in various regimes, give polynomial to superpolynomial quantum speedups. Our main technical ingredients include a near-tight quantum algorithm for $\\varepsilon$-approximating the number of collisions between two non-repetitive strings, improving the result of Le Gall and Ng [QIC'22]. Together, our results show that smoothing can reveal larger quantum speedups than worst-case analysis suggests, opening a path towards quantum advantage on more realistic inputs.", "url": "https://arxiv.org/abs/2609.35580", "type": "理论+数值", "summary": "平滑分析是经典算法中的一个核心框架，用于解释算法超越最坏情况的性能，通常解释为什么算法在实践中表现良好。我们对其量子对应物进行了系统研究，并得出了以下结果。 $(1)$ 我们证明存在一个总函数，其平滑量子查询复杂度指数小于其经典查询复杂度。 $(2)$ 我们给出了对称布尔函数的平滑随机和量子查询复杂性的近乎严格的表征，统一了 [Beals et al, FOCS'98] 的最坏情况复杂性结果和 [Ambainis 和 de Wolf, STACS'00] 的平均情况复杂性结果。 $(3)$ 我们研究诸如模式匹配和编辑距离之类的字符串问题，并在各种机制中给出多项式到超多项式的量子加速。我们的主要技术成分包括 $\\varepsilon$ 的近紧量子算法 - 近似两个非重复字符串之间的碰撞次数，改进 Le Gall 和 Ng [QIC'22] 的结果。\n\n总之，我们的结果表明，平滑可以揭示比最坏情况分析显示的更大的量子加速，从而为在更现实的输入上实现量子优势开辟了道路。", "authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Yanlin Chen"}, {"name": "Amin Shiraz Gilani"}], "featured_authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Yanlin Chen"}, {"name": "Amin Shiraz Gilani"}], "author_count": 3}, {"id": "2609.35592", "category": "quant-ph", "title": "Exponential lower bounds for low-degree strategies in position-based quantum cryptography", "abstract": "Non-local quantum computation (NLQC) consists on the implementation of a bipartite unitary $U_{AB}$ by two cooperating distant players by means of a two-round protocol with a single intermediate round of simultaneous communication. It is a major open question to know whether there exists a unitary $U_{AB}$ whose implementation in NLQC requires extra quantum systems with dimensions ${\\rm exp}(n^{\\Omega(1)})$, where $n$ is the dimension of systems $A$ and $B$. This type of exponential lower bound is essential for security of position-based quantum cryptography, since the capabilities of the adversaries are precisely described by NLQC. It has also been connected to many other problems, such as the optimality of universal quantum simulators, or the expected properties of holographic quantum gravity. Currently the best lower bounds are only sublinear in $n$. In this paper we consider the family of diagonal ${\\pm 1}$ valued unitaries $U_{\\varepsilon}$, indexed by an element of the Boolean hypercube $\\varepsilon \\in \\{\\pm 1\\}^{n^2}$, i.e. $U_{\\varepsilon}|i\\rangle_A|j\\rangle_B =\\varepsilon_{ij} |i\\rangle_A|j\\rangle_B$. We show that if $U_{\\varepsilon}$ can be implemented in NLQC with constant accuracy for all $\\varepsilon$, and the dependency on $\\varepsilon$ in the first round of the associated strategy is a polynomial of degree $O(n^{\\frac{1}{4}-\\delta})$, then the implementation of at least one $U_{\\varepsilon}$ in NLQC requires resources scaling as $\\exp\\left(\\Omega\\left(\\frac{n^{2\\delta}}{(\\log n)^2}\\right)\\right)$. The proof is based on geometric properties of particular Banach spaces, namely their type constants, together with random estimates of Boolean functions valued on them.", "url": "https://arxiv.org/abs/2609.35592", "type": "理论", "summary": "非局部量子计算 (NLQC) 包括由两个合作的远程参与者通过两轮协议和单个中间轮同时通信来实现二分单元 $U_{AB}$。是否存在酉 $U_{AB}$ 是一个主要的悬而未决的问题，其在 NLQC 中的实现需要额外的维度为 ${\\rm exp}(n^{\\Omega(1)})$ 的量子系统，其中 $n$ 是系统 $A$ 和 $B$ 的维度。这种类型的指数下限对于基于位置的量子密码学的安全性至关重要，因为 NLQC 精确描述了对手的能力。它还与许多其他问题有关，例如通用量子模拟器的最优性，或全息量子引力的预期特性。目前，最佳下界仅在 $n$ 中是次线性的。在本文中，我们考虑对角 ${\\pm 1}$ 值酉 $U_{\\varepsilon}$ 族，由布尔超立方体 $\\varepsilon \\in \\{\\pm 1\\}^{n^2}$ 中的一个元素索引，即 $U_{\\varepsilon}|i\\rangle_A|j\\rangle_B =\\varepsilon_{ij} |i\\rangle_A|j\\rangle_B$。\n\n我们证明，如果 $U_{\\varepsilon}$ 可以在 NLQC 中以恒定的精度实现所有 $\\varepsilon$，并且第一轮相关策略中对 $\\varepsilon$ 的依赖是一个 $O(n^{\\frac{1}{4}-\\delta})$ 次多项式，那么在 NLQC 中实现至少一个 $U_{\\varepsilon}$ 需要资源扩展为$\\exp\\left(\\Omega\\left(\\frac{n^{2\\delta}}}{(\\log n)^2}\\right)\\right)$。该证明基于特定巴拿赫空间的几何性质，即它们的类型常数，以及对它们进行评估的布尔函数的随机估计。", "authors": [{"name": "Isabel M. Moreno-Cuadrado"}, {"name": "David Perez-Garcia"}, {"name": "Carlos Palazuelos"}], "featured_authors": [{"name": "Isabel M. Moreno-Cuadrado"}, {"name": "David Perez-Garcia"}, {"name": "Carlos Palazuelos"}], "author_count": 3}, {"id": "2609.35633", "category": "quant-ph", "title": "Succinct Arguments for QMA from Collapsing Hash Functions", "abstract": "We prove the existence of succinct arguments for QMA, assuming only the existence of collapsing hash functions. This is the first scheme that relies only on unstructured ``Minicrypt'' assumptions, which are not known to imply public-key encryption. Our main technical contribution is a quantum-succinct \\emph{claw-state generation} protocol that allows us to bootstrap a small number of quantum correlations into an arbitrarily large number of claw-state correlations, using classical communication only. This improves upon the work of [Zhang, STOC 2021], having better round complexity, a proof in the standard model, and being overall much simpler. This yields a quantum-succinct blind delegation of quantum computation protocol from one-way functions, which we plug into the communication-compression compiler of [Bartusek, Liu, and Malavolta, EUROCRYPT 2026] to obtain succinct arguments for QMA.", "url": "https://arxiv.org/abs/2609.35633", "type": "理论", "summary": "我们证明了 QMA 简洁论证的存在，假设仅存在折叠哈希函数。这是第一个仅依赖于非结构化“Minicrypt”假设的方案，这些假设并不意味着公钥加密。我们的主要技术贡献是量子简洁的 \\emph{爪态生成} 协议，该协议允许我们仅使用经典通信将少量量子相关性引导为任意大量的爪态相关性。这改进了 [Zhang, STOC 2021] 的工作，具有更好的轮复杂度，标准模型中的证明，并且总体上更简单。这从单向函数产生了量子计算协议的量子简洁盲委托，我们将其插入 [Bartusek、Liu 和 Malavolta，EUROCRYPT 2026] 的通信压缩编译器中，以获得 QMA 的简洁参数。", "authors": [{"name": "James Bartusek"}, {"name": "Giulio Malavolta"}], "featured_authors": [{"name": "James Bartusek"}, {"name": "Giulio Malavolta"}], "author_count": 2}, {"id": "2609.35655", "category": "quant-ph", "title": "Optimal performance in a chaotic Floquet quantum battery", "abstract": "We study a quantum battery consisting of $N$ qubits interacting uniformly with each other. Starting from its ground state, the battery is charged by introducing periodic kicks in the transverse direction along with adding disorder in the interaction direction. Although the battery Hamiltonian along with the initial state preserves the permutation symmetry, the dynamics in presence of disorder during the charging phase takes the system out of the permutation symmetric subspace, resulting to a larger amount of stored energy as compared to that without disorder. In the limit of large disorder, this interplay brings in a possibility of a chaotic charging phase when stored energy can be exactly calculated using random matrix theory. More importantly, we also find that the energy fluctuations decrease and become negligible in the limit of large disorder, which is also when the energy stored is maximum, a condition highly desirable for the optimum functioning of the battery. We complete the battery cycle by considering the storage phase in the presence of dephasing noise. We find that for larger disorder strengths, the ergotropy remains close to the stored energy, indicating nearly complete energy extractability with an efficiency approaching unity.", "url": "https://arxiv.org/abs/2609.35655", "type": "理论", "summary": "我们研究了一种由 $N$ 个量子位组成的量子电池，这些量子位之间均匀地相互作用。从基态开始，电池通过在横向引入周期性冲击并在相互作用方向增加无序来充电。尽管电池哈密顿量以及初始状态保留了排列对称性，但充电阶段存在无序的动力学使系统脱离排列对称子空间，从而导致与无序相比储存更多的能量。在大无序的限制下，当可以使用随机矩阵理论精确计算存储的能量时，这种相互作用可能会导致混沌充电阶段。更重要的是，我们还发现，在大无序的极限下，能量波动减小并变得可以忽略不计，这也是当存储的能量最大时，这是电池最佳运行的非常理想的条件。我们通过考虑存在相移噪声的存储阶段来完成电池周期。\n\n我们发现，对于较大的无序强度，各向异性仍然接近存储的能量，表明几乎完全的能量可提取性，效率接近统一。", "authors": [{"name": "Lakshmija N K"}, {"name": "Uma Divakaran"}], "featured_authors": [{"name": "Lakshmija N K"}, {"name": "Uma Divakaran"}], "author_count": 2}, {"id": "2609.35660", "category": "quant-ph", "title": "An Optimal Quantum Linear Systems Algorithm", "abstract": "In the quantum linear systems problem (QLSP), we are given query access to a $d$-sparse $N\\times N$ matrix $A$ with condition number $\\kappa$, and the ability to prepare a quantum state proportional to a vector $\\vec b$. The goal is to output an $\\epsilon$-approximation to the quantum state proportional to the solution $\\vec x$ of $A\\vec{x}=\\vec{b}$. Following a long line of work, the best previously known quantum algorithms for the QLSP had query complexities $O(\\kappa d\\log(1/\\epsilon))$ and $\\kappa\\sqrt d(\\kappa d/\\epsilon)^{o(1)}$, while the best known lower bounds were $\\Omega(\\kappa\\log(1/\\epsilon))$ and $\\Omega(\\kappa\\sqrt d)$. We improve these bounds and show that the complexity of the QLSP is $\\Theta(\\kappa\\sqrt d\\log(1/\\epsilon))$. We also resolve an open problem of Berry and Childs by showing that any $N\\times N$ unitary can be implemented with bounded error using $O(\\sqrt N)$ queries to its matrix entries.", "url": "https://arxiv.org/abs/2609.35660", "type": "理论+数值", "summary": "在量子线性系统问题 (QLSP) 中，我们可以查询访问 $d$ 稀疏的 $N\\times N$ 矩阵 $A$，条件数为 $\\kappa$，并且能够准备与向量 $\\vec b$ 成比例的量子态。目标是输出与 $A\\vec{x}=\\vec{b}$ 的解 $\\vec x$ 成正比的量子态 $\\epsilon$ 近似值。经过长时间的工作，QLSP 之前最知名的量子算法的查询复杂度为 $O(\\kappa d\\log(1/\\epsilon))$ 和 $\\kappa\\sqrt d(\\kappa d/\\epsilon)^{o(1)}$，而最著名的下界是 $\\Omega(\\kappa\\log(1/\\epsilon))$ 和$\\Omega(\\kappa\\sqrt d)$。我们改进了这些界限并表明 QLSP 的复杂度为 $\\Theta(\\kappa\\sqrt d\\log(1/\\epsilon))$。我们还解决了 Berry 和 Childs 的开放问题，表明任何 $N\\times N$ 单一矩阵都可以使用对其矩阵条目的 $O(\\sqrt N)$ 查询来实现有界误差。", "authors": [{"name": "Carlos Bravo-Prieto"}, {"name": "Aram W. Harrow"}, {"name": "Robin Kothari"}], "featured_authors": [{"name": "Carlos Bravo-Prieto"}, {"name": "Aram W. Harrow"}, {"name": "Robin Kothari"}], "author_count": 3}, {"id": "2609.35668", "category": "quant-ph", "title": "Optimal Query Complexity for Ground-State Preparation", "abstract": "We determine the optimal query complexity of ground-state preparation to trace-distance error $\\varepsilon$ when an energy threshold in the spectral gap is known. Let $U_H$ be an $\\alpha$-block-encoding of a Hamiltonian with unique ground state $|\\psi_0\\rangle$, and suppose $|\\langle\\psi_0|U_I|0\\rangle|\\ge\\gamma$ for a state-preparation oracle $U_I$. The threshold lies at least $\\Delta/2$ above the ground-state energy and at least $\\Delta/2$ below every excited-state energy. We give two algorithms that prepare a state within trace distance $\\varepsilon$ of the ground state. One uses $O((\\alpha/\\Delta)(\\gamma^{-1}+\\log(1/\\varepsilon)))$ calls to $U_H$ in expectation; the other uses $O((\\alpha/(\\gamma\\Delta))\\log(1/\\varepsilon))$ calls to $U_H$ in the worst case. We prove a lower bound matching the expected query count; the corresponding worst-case lower bound follows from Somma and de Wolf [SdW26]. The respective bounds on calls to $U_I$ are $O(1/\\gamma)$ in expectation and $O(\\gamma^{-1}\\log(1/\\varepsilon))$ in the worst case. On $(N+1)$-dimensional systems, these $U_I$ bounds are also optimal when the expected or worst-case count of $U_H$ calls, respectively, is $o((\\alpha/\\Delta)\\sqrt N)$. Both algorithms use a constant-accuracy spectral filter to construct a purifier, which we then sequentially compose during amplitude amplification to prepare a state with constant overlap with the ground state. The expected-query algorithm repeats the preparation followed by one high-accuracy spectral filter until success. The worst-case algorithm uses filters of increasing accuracy and limits the total number of queries.", "url": "https://arxiv.org/abs/2609.35668", "type": "理论+数值", "summary": "当光谱间隙中的能量阈值已知时，我们确定基态准备对迹线距离误差 $\\varepsilon$ 的最佳查询复杂度。令 $U_H$ 为具有唯一基态 $|\\psi_0\\rangle$ 的哈密顿量的 $\\alpha$ 块编码，并假设 $|\\langle\\psi_0|U_I|0\\rangle|\\ge\\gamma$ 为状态准备预言机 $U_I$。该阈值至少高于基态能量$\\Delta/2$，并且至少低于每个激发态能量$\\Delta/2$。我们给出了两种在基态迹线距离 $\\varepsilon$ 内准备状态的算法。一种使用 $O((\\alpha/\\Delta)(\\gamma^{-1}+\\log(1/\\varepsilon)))$ 调用 $U_H$ 进行期望；另一个在最坏的情况下使用 $O((\\alpha/(\\gamma\\Delta))\\log(1/\\varepsilon))$ 调用 $U_H$ 。我们证明了与预期查询计数相匹配的下限；相应的最坏情况下界来自 Somma 和 de Wolf [SdW26]。调用 $U_I$ 的相应界限在预期情况下为 $O(1/\\gamma)$，在最坏情况下为 $O(\\gamma^{-1}\\log(1/\\varepsilon))$。\n\n在 $(N+1)$ 维系统上，当 $U_H$ 调用的预期或最坏情况计数分别为 $o((\\alpha/\\Delta)\\sqrt N)$ 时，这些 $U_I$ 边界也是最佳的。两种算法都使用恒定精度的光谱滤波器来构建净化器，然后我们在幅度放大过程中顺序组合该净化器，以准备与基态恒定重叠的状态。预期查询算法重复准备工作，然后使用一个高精度光谱滤波器，直到成功。最坏情况的算法使用提高精度的过滤器并限制查询总数。", "authors": [{"name": "Boyang Chen"}, {"name": "Minbo Gao"}, {"name": "Xinzhao Wang"}, {"name": "Shuo Zhou"}], "featured_authors": [{"name": "Boyang Chen"}, {"name": "Minbo Gao"}, {"name": "Xinzhao Wang"}, {"name": "Shuo Zhou"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
