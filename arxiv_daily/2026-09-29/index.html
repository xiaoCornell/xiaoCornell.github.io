"Structure and Dynamics of Bose Polarons across the Mott-Insulator to Superfluid Transition", "abstract": "A mobile impurity particle immersed in a quantum degenerate gas leads to the formation of a quasiparticle, which can serve as a sensor for its environment. Here, we develop a unified wave function description of an impurity in a two-dimensional Bose-Hubbard model across the Mott-insulator to superfluid transition. Using a multi-mode variational ansatz based on the quantum Gutzwiller approach, we show that the impurity can form several kinds of polaronic and molecular states. In addition to their spectral properties, the wave function provides direct access to the microscopic structure of these states, and we demonstrate that strong correlations in the critical regime of the quantum phase transition give rise to several non-analytic features in the polaron properties. Increasing the impurity-boson interaction leads to transitions between polaron and molecular ground states, and the number of bosons in the impurity dressing cloud grows rapidly at the quantum critical point as the bath modes soften. We furthermore reveal qualitatively distinct non-equilibrium many-body dynamics after the injection of the impurity in the different phases of the Bose-Hubbard model. Our spectral, real space, and dynamical predictions describe complementary properties of polarons in a strongly correlated bosonic bath, which can be observed using current techniques with atoms in optical lattices.", "url": "https://arxiv.org/abs/2609.35696", "type": "理论+数值", "summary": "浸入量子简并气体中的移动杂质粒子会形成准粒子，该准粒子可以用作其环境的传感器。在这里，我们开发了二维 Bose-Hubbard 模型中从莫特绝缘体到超流体转变过程中杂质的统一波函数描述。使用基于量子 Gutzwiller 方法的多模变分拟似方法，我们证明杂质可以形成多种极化态和分子态。除了它们的光谱特性之外，波函数还提供了对这些状态的微观结构的直接访问，并且我们证明了量子相变临界状态中的强相关性导致了极化子特性中的一些非解析特征。增加杂质-玻色子相互作用会导致极化子和分子基态之间的转变，并且随着浴模式软化，杂质修饰云中的玻色子数量在量子临界点快速增长。我们还揭示了在 Bose-Hubbard 模型的不同相中注入杂质后，定性上明显不同的非平衡多体动力学。\n\n我们的光谱、实空间和动力学预测描述了强相关玻色浴中极化子的互补特性，可以使用当前技术对光学晶格中的原子进行观察。", "authors": [{"name": "Ragheed Alhyder"}, {"name": "Alessio Recati"}, {"name": "Georg M. Bruun"}], "featured_authors": [{"name": "Ragheed Alhyder"}, {"name": "Alessio Recati"}, {"name": "Georg M. Bruun"}], "author_count": 3}, {"id": "2609.35754", "category": "cond-mat", "title": "Perfect Born Sampling of Symmetric Thermal Tensor Network for Quantum Lattice Models", "abstract": "Accurate calculations of quantum lattice models at low temperatures constitute a major challenge in many-body physics. Stochastic sampling of tensor-network states offers a promising route to tackle this problem; however, existing schemes have long faced a fundamental dilemma---sampling efficiency and symmetry acceleration \\textit{cannot} be achieved simultaneously. Here we propose a perfect Born sampling approach for thermal tensor networks, which performs importance sampling directly from the purified density matrix via the Born rule and incorporates Abelian and non-Abelian symmetries by sampling symmetry quantum numbers. We benchmark the method, realized as both stochastic matrix product states (stoMPS) and stochastic projected entangled pair states (stoPEPS), on large-scale quantum lattice models. Using stoMPS, we accurately simulate the square-lattice Hubbard model on cylinders up to width $W=10$, and study the triangular-lattice Hubbard model down to $T/t = 1/64$, revealing scalar chiral order at half filling and kinetic ferromagnetism upon electron doping. We further extend the stoMPS method to compute finite-temperature quantum dynamics, as demonstrated by the optical conductivity of the Hubbard model, and generalize it to stoPEPS, as showcased on the $20\\times20$ square-lattice quantum Ising model at its quantum critical point. Our method combines high sampling efficiency with full symmetry acceleration, and can be used as a state-of-the-art framework for studying both equilibrium and dynamical properties down to ultralow temperatures.", "url": "https://arxiv.org/abs/2609.35754", "type": "理论+数值", "summary": "低温下量子晶格模型的精确计算是多体物理学的重大挑战。张量网络状态的随机采样为解决这个问题提供了一条有希望的途径；然而，现有的方案长期以来面临着一个根本性的困境——采样效率和对称加速\\textit{无法同时实现}。在这里，我们提出了一种用于热张量网络的完美玻恩采样方法，该方法通过玻恩规则直接从纯化的密度矩阵进行重要性采样，并通过采样对称量子数来合并阿贝尔和非阿贝尔对称性。我们在大规模量子晶格模型上对该方法进行了基准测试，该方法以随机矩阵乘积态 (stoMPS) 和随机投影纠缠对态 (stoPEPS) 的形式实现。使用stoMPS，我们准确地模拟了宽度达$W=10$的圆柱体上的方晶格哈伯德模型，并研究了低至$T/t = 1/64$的三角晶格哈伯德模型，揭示了半填充时的标量手性序和电子掺杂时的动力学铁磁性。\n\n我们进一步扩展 stoMPS 方法来计算有限温度量子动力学，如 Hubbard 模型的光导率所证明的那样，并将其推广到 stoPEPS，如 $20\\times20$ 方晶格量子 Ising 模型在其量子临界点处所展示的那样。我们的方法将高采样效率与全对称加速相结合，可用作研究超低温下的平衡和动态特性的最先进框架。", "authors": [{"name": "Jianxin Gao"}, {"name": "Qiaoyi Li"}, {"name": "Yuan Gao"}, {"name": "Chuanshu Xu"}, {"name": "Guoliang Wu"}, {"name": "Su Yi"}, {"name": "Bin-Bin Chen"}, {"name": "Wei Li"}], "featured_authors": [{"name": "Jianxin Gao"}, {"name": "Qiaoyi Li"}, {"name": "Yuan Gao"}, {"name": "Su Yi"}, {"name": "Bin-Bin Chen"}, {"name": "Wei Li"}], "author_count": 8}, {"id": "2609.31825", "category": "hep-th", "title": "Cardy random matrix theory", "abstract": "We construct and study a ``Cardy random matrix model'': a random matrix theory whose only input, in a maximal-ignorance prescription, is the constraint of $\\mathbb{S}$-modular invariance. We regularize this constraint by coarse-graining over energy windows of fixed width, and obtain a potential for a single random matrix whose eigenvalues play the role of the scaling dimensions of primaries in a 2d CFT. The potential drives the coarse-grained density of states to the Cardy profile above a gap at the black hole threshold. We perform Monte Carlo simulations to confirm this behavior and find good agreement for the coarse-grained density of states, while at the same time revealing GUE statistics for nearby eigenvalues. We identify the scaling limit in which these phenomena emerge. In this limit, the model realizes a hierarchy of scales: at the macroscopic scale given by the window size, the occupations are frozen and the bootstrap constraint rigidly fixes the spectrum to the Cardy profile, while at the mesoscopic scale (inside a window) the Vandermonde repulsion rearranges the eigenvalues as in a random matrix theory. It is only at the microscopic scale of the mean level spacing that the individual levels are resolved. Accordingly, our random matrix model displays an effective Thouless time, set by the inverse energy width of the coarse-graining window. Our model provides a first step towards solving the matrix/tensor model dual to 3D quantum gravity on a computer.", "url": "https://arxiv.org/abs/2609.31825", "type": "理论", "summary": "我们构建并研究了“Cardy 随机矩阵模型”：一种随机矩阵理论，在最大无知规定中，其唯一输入是 $\\mathbb{S}$ 模不变性的约束。我们通过对固定宽度的能量窗进行粗粒度化来正则化该约束，并获得单个随机矩阵的潜力，该矩阵的特征值在 2d CFT 中起到原色缩放维度的作用。该势将粗粒态密度驱动到黑洞阈值间隙上方的卡迪分布。我们进行蒙特卡罗模拟来确认这种行为，并找到粗粒度状态密度的良好一致性，同时揭示附近特征值的 GUE 统计数据。我们确定了这些现象出现的尺度限制。在此限制下，该模型实现了尺度层次结构：在窗口大小给定的宏观尺度上，占据被冻结，自举约束将频谱严格固定在 Cardy 轮廓上，而在介观尺度（窗口内），范德蒙排斥力重新排列特征值，如随机矩阵理论中那样。\n\n只有在平均能级间距的微观尺度上才能解析各个能级。因此，我们的随机矩阵模型显示了有效的 Thouless 时间，由粗粒度窗口的逆能量宽度设置。我们的模型为在计算机上求解 3D 量子引力对偶矩阵/张量模型提供了第一步。", "authors": [{"name": "Marco Ambrosini"}, {"name": "Alexandre Belin"}, {"name": "Jan de Boer"}, {"name": "Julian Sonner"}], "featured_authors": [{"name": "Marco Ambrosini"}, {"name": "Alexandre Belin"}, {"name": "Jan de Boer"}, {"name": "Julian Sonner"}], "author_count": 4}, {"id": "2609.31829", "category": "hep-th", "title": "Localizing the M-Theory Path Integral", "abstract": "We propose a supersymmetric localization formula for the local perturbative contribution to the M-theory path integral, reducing it to an integral over equivariant flux data. Relative equivariant extensions of the eleven-dimensional Chern--Simons couplings determine the localized action, while for M2-brane backgrounds a tangent-cotangent character computes the one-loop determinant. This gives the first closed form expression for the complete perturbative ABJM partition function at general squashing and chemical potentials, and new analytic results for the ABJM topologically twisted index describing black holes. Applied to the non-toric $V^{5,2}$ theory, the same prescription yields a closed analytic Airy constant previously known only numerically. Our formulas reproduce all available independent field theory results, and provide analytic predictions at general parameters where no field theory answer is currently known. We derive an all-genus result for the Type IIA expansion which is an equivariant form of the usual topological string constant map result, and also extract integrated correlators.", "url": "https://arxiv.org/abs/2609.31829", "type": "理论", "summary": "我们针对 M 理论路径积分的局部微扰贡献提出了一个超对称局部化公式，将其简化为等变通量数据上的积分。十一维 Chern-Simons 耦合的相对等变扩展决定了局部作用，而对于 M2 膜背景，正切-余切特征计算单环行列式。这给出了在一般挤压和化学势下完整的微扰 ABJM 配分函数的第一个闭合形式表达式，以及描述黑洞的 ABJM 拓扑扭曲指数的新分析结果。应用于非复曲面 $V^{5,2}$ 理论，相同的处方产生了以前仅在数值上已知的封闭解析艾里常数。我们的公式再现了所有可用的独立场论结果，并在目前尚不知道场论答案的情况下提供一般参数的分析预测。我们导出了 IIA 型展开的全属结果，它是通常的拓扑弦常数映射结果的等变形式，并且还提取了积分相关器。", "authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Florian Gaar"}, {"name": "Jerome P. Gauntlett"}, {"name": "Jaeha Park"}, {"name": "James Sparks"}], "featured_authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Florian Gaar"}, {"name": "Jerome P. Gauntlett"}, {"name": "Jaeha Park"}, {"name": "James Sparks"}], "author_count": 5}, {"id": "2609.31845", "category": "hep-th", "title": "Nonlinear electroweak sphaleron clouds around Kerr black holes", "abstract": "Kerr black holes and electroweak sphalerons are remarkable solutions of two pillars of modern physics: General Relativity and the Standard Model of particle physics, respectively. In this work, we investigate their interplay by constructing nonlinear sphaleron clouds around Schwarzschild and Kerr black holes in the probe limit. We first revisit static and spinning (multi-)sphalerons in flat spacetime, using the measured electroweak parameters. We then explore the domain of existence and physical properties of the corresponding black-hole configurations, revealing a rich branch structure. Remarkably, the sphaleron clouds retain a finite mass gap and do not approach linear clouds within the families studied, distinguishing them from the familiar clouds associated with the onset of superradiant instabilities. We also obtain a closed-form leading-order Higgs solution on an exact Yang-Mills configuration in a Schwarzschild background.", "url": "https://arxiv.org/abs/2609.31845", "type": "理论", "summary": "克尔黑洞和电弱狮面子分别是现代物理学两大支柱：广义相对论和粒子物理学标准模型的杰出解决方案。在这项工作中，我们通过在探测极限内的史瓦西黑洞和克尔黑洞周围构建非线性球面子云来研究它们的相互作用。我们首先使用测量的电弱参数重新审视平坦时空中的静态和旋转（多）球体。然后，我们探索相应黑洞构型的存在域和物理性质，揭示丰富的分支结构。值得注意的是，球面云保留了有限的质量间隙，并且不接近所研究的家族中的线性云，这将它们与与超辐射不稳定性的出现相关的熟悉的云区分开来。我们还在史瓦西背景下的精确杨-米尔斯配置上获得了闭式前导希格斯解。", "authors": [{"name": "Carlos Herdeiro"}, {"name": "Jutta Kunz"}, {"name": "Hendrik Mennenga"}, {"name": "Eugen Radu"}], "featured_authors": [{"name": "Carlos Herdeiro"}, {"name": "Jutta Kunz"}, {"name": "Hendrik Mennenga"}, {"name": "Eugen Radu"}], "author_count": 4}, {"id": "2609.31866", "category": "hep-th", "title": "Quantum vacuum interaction between semitransparent plates in a Pöschl-Teller background: an exact relative TGTG formula", "abstract": "We derive an exact background-dressed TGTG formula for the one-loop quantum vacuum inter- action between two semitransparent Dirac-delta plates in the one-soliton Pöchl-Teller background. The interaction is defined through a relative determinant in which the two isolated one-plate contributions are subtracted in the same background. As a result, the energy depends on the individual plate positions as well as on their separation. For repulsive plates, the normalizable zero mode does not induce an infrared divergence in the relative interaction energy. We also extend the construction to planar plates and analyze the corresponding position-dependent interaction forces.", "url": "https://arxiv.org/abs/2609.31866", "type": "理论", "summary": "我们推导出一个精确的背景修饰 TGTG 公式，用于单孤子 Pöchl-Teller 背景中两个半透明狄拉克-δ 板之间的单环量子真空相互作用。相互作用是通过相对行列式定义的，其中在相同背景下减去两个孤立的单板贡献。因此，能量取决于各个板的位置以及它们的间隔。对于排斥板，可归一化零模式不会引起相对相互作用能的红外发散。我们还将该结构扩展到平板并分析相应的位置相关相互作用力。", "authors": [{"name": "Jose M. Muñoz-Castañeda"}, {"name": "Inés Cavero-Peláez"}, {"name": "Gonzalo Sancho-Garrido"}], "featured_authors": [{"name": "Jose M. Muñoz-Castañeda"}, {"name": "Inés Cavero-Peláez"}, {"name": "Gonzalo Sancho-Garrido"}], "author_count": 3}, {"id": "2609.31867", "category": "hep-th", "title": "Spread Complexity for Local Operator Quenches with Conserved Momentum", "abstract": "We study a family of locally excited states in two-dimensional conformal field theories in different setups, defined on the plane, on the cylinder, or at finite temperature. These states are constructed by assigning independent chiral and anti-chiral regulators to a local primary operator, leading to excitations carrying net momentum. We analytically calculate the first few Lanczos coefficients and the early time behaviour of the spread complexity associated with these states. Then, using numerical methods, we obtain the coefficients reaching larger Krylov indices and find the associated spread complexity for a longer range of time evolution. We also compare the rate of change of the resulting spread complexity with the proposed holographic dual quantity, related to the proper momentum of an infalling particle in the dual bulk, but we observe a mismatch.", "url": "https://arxiv.org/abs/2609.31867", "type": "理论", "summary": "我们在不同的设置下研究二维共形场论中的一系列局部激发态，定义在平面上、圆柱上或有限温度下。这些状态是通过将独立的手性和反手性调节器分配给本地主要算子来构建的，从而产生携带净动量的激励。我们分析计算了前几个 Lanczos 系数以及与这些状态相关的扩展复杂性的早期行为。然后，使用数值方法，我们获得达到更大 Krylov 指数的系数，并找到更长范围时间演化的相关扩展复杂度。我们还将所得到的扩散复杂性的变化率与所提出的全息对偶量进行了比较，该变化率与对偶体中落入粒子的适当动量相关，但我们观察到不匹配。", "authors": [{"name": "Ali Fatemiabhari"}], "featured_authors": [{"name": "Ali Fatemiabhari"}], "author_count": 1}, {"id": "2609.31884", "category": "hep-th", "title": "Transient Coherence and Multiscale Spectral Structure after a Mass Quench in a 1+1-Dimensional Scalar Field", "abstract": "A mass quench generates anomalous pair correlations that are absent from the final particle occupations. For a free real scalar field in $1+1$ dimensions, we define a bilocal observable by smearing the statistical Keldysh correlator with a Morlet kernel on the finite post-quench relative-time interval. Its excess over the dephased correlator gives a dimensionless relative coherence weight. At fixed momentum, this weight is exactly independent of the initial temperature for Gaussian thermal states evolved with the same free Hamiltonian: the common thermal amplitude cancels between numerator and denominator. The cancellation is not a purity criterion and is not exclusive to wavelets. We derive the finite-window response and show that the anomalous signal depends essentially on the observation window; an admissible zero-mean wavelet annihilates the relative-time-constant anomalous term on the full line. We compare this response with the signed finite-time Wigner spectrum and derive a distinct Gaussian-extension positivity bound. Exact smooth-quench occupations provide an independent dynamical reference. Finally, we formulate a renormalized Hartree extension and delimit the oscillatory and nonoscillatory regimes of a scalar mode on a fixed two-dimensional de Sitter background.", "url": "https://arxiv.org/abs/2609.31884", "type": "理论", "summary": "质量淬灭会产生最终粒子占据中不存在的异常对相关性。对于 $1+1$ 维度的自由实标量场，我们通过在有限的淬火后相对时间间隔上使用 Morlet 核涂抹统计 Keldysh 相关器来定义双局部可观测量。它超过失相相关器的部分给出了无量纲相对相干权重。在固定动量下，该权重完全独立于使用相同自由哈密顿量演化的高斯热态的初始温度：分子和分母之间的共同热振幅相互抵消。消除不是纯度标准并且不是小波所独有的。我们推导了有限窗口响应，并表明异常信号本质上取决于观察窗口；允许的零均值小波消除了整线上的相对时间常数反常项。我们将此响应与带符号的有限时间维格纳谱进行比较，并得出独特的高斯扩展正性界限。精确的平滑淬火占据提供了独立的动态参考。\n\n最后，我们制定了重正化 Hartree 扩展，并在固定的二维德西特背景上界定了标量模式的振荡和非振荡区域。", "authors": [{"name": "Gabriel Abellán"}, {"name": "Nelson Bolívar"}], "featured_authors": [{"name": "Gabriel Abellán"}, {"name": "Nelson Bolívar"}], "author_count": 2}, {"id": "2609.31928", "category": "hep-th", "title": "General Relativity with Finite Boundaries", "abstract": "In this thesis, we consider general relativity on a manifold with a timelike boundary of finite size, across all signs of the cosmological constant $\\Lambda$. We impose conformal boundary conditions, whereby the conformal class of the induced metric and the trace of the extrinsic curvature $K$ are fixed at the boundary. In Lorentzian signature, we analyse the linearised Einstein equations about Minkowski, de Sitter (dS), and anti-de Sitter (AdS) space for a variety of boundaries, employing the Kodama-Ishibashi formalism adapted to manifolds with a boundary. In Euclidean signature, we study the thermodynamics of black hole and cosmological horizons enclosed by the boundary, computing the leading semiclassical approximation of the gravitational path integral, for which the boundary data define a conformal canonical ensemble of fixed conformal temperature and $K$.", "url": "https://arxiv.org/abs/2609.31928", "type": "理论", "summary": "在本文中，我们考虑在具有有限大小的类时边界的流形上的广义相对论，跨越宇宙常数 $\\Lambda$ 的所有符号。我们施加共形边界条件，由此导出度量的共形类和外在曲率 $K$ 的迹在边界处固定。在洛伦兹签名中，我们采用适用于具有边界的流形的 Kodama-Ishibashi 形式主义，分析了关于各种边界的 Minkowski、de Sitter (dS) 和反 de Sitter (AdS) 空间的线性化爱因斯坦方程。在欧几里得签名中，我们研究了边界所包围的黑洞和宇宙视界的热力学，计算了引力路径积分的主要半经典近似，其中边界数据定义了固定共形温度和$K$的共形正则系综。", "authors": [{"name": "Chawakorn Maneerat"}], "featured_authors": [{"name": "Chawakorn Maneerat"}], "author_count": 1}, {"id": "2609.32063", "category": "hep-th", "title": "Wormhole fragmentation and the axion Weak Gravity Conjecture", "abstract": "We derive the axion Weak Gravity Conjecture (aWGC) from the nonperturbative fragmentation of Euclidean wormholes into charged defects. Requiring fragmentation to lower the Euclidean action fixes the axion action-to-charge bound and its order-one coefficient. Without additional scalars, this coefficient coincides with that of the Imaginary Distance Bound (IDB), while additional scalars strengthen the bound. The aWGC in the presence of multiple axio-dilaton pairs is discussed, leading to geometric representations. Axions satisfying the aWGC render the corresponding wormholes unstable, potentially suppressing their proliferation and resolving associated factorization problems.", "url": "https://arxiv.org/abs/2609.32063", "type": "理论", "summary": "我们从欧几里得虫洞非微扰分裂成带电缺陷中推导出轴子弱重力猜想（aWGC）。需要碎片化来降低欧几里得作用，从而修复了轴子作用到电荷的界限及其一阶系数。如果没有附加标量，该系数与虚距离界限 (IDB) 的系数一致，而附加标量会加强该界限。讨论了存在多个轴膨胀对的 aWGC，从而得出几何表示。满足 aWGC 的轴子使相应的虫洞不稳定，可能抑制其增殖并解决相关的分解问题。", "authors": [{"name": "Puxin Lin"}, {"name": "Gary Shiu"}], "featured_authors": [{"name": "Puxin Lin"}, {"name": "Gary Shiu"}], "author_count": 2}, {"id": "2609.32071", "category": "hep-th", "title": "A backreacted bouncing geodesic in 2D", "abstract": "In holography, analytically continued finite temperature correlation functions $G(t)$ exhibit signatures of the black hole singularity. These take the form of singularities at certain values of $t$ whose bulk origin is a null geodesic worldline \"bouncing off\" the black hole singularity. We study certain quantum corrections to this effect in 2D dilaton gravity that are captured by gravitational backreaction of the worldline onto the black hole geometry. These corrections smooth out the bouncing geodesic singularities. By following the backreacted geodesic saddle in a steepest descent analysis we find instead that the black hole singularity physics gets encoded in a subtle way involving a Stokes phenomenon near the coincident point singularity of $G(t)$ at $t=0$ (and its thermal image). We point out a parallel between the structure of Stokes lines uncovered in this analysis and the structure present in the analysis of forbidden singularities in large $c$ 2D conformal blocks. Finally we make some preliminary remarks about the significance of quantum corrections in these models beyond backreaction.", "url": "https://arxiv.org/abs/2609.32071", "type": "理论", "summary": "在全息术中，分析上连续的有限温度相关函数 $G(t)$ 表现出黑洞奇点的特征。这些在 $t$ 的某些值处采取奇点的形式，其整体起源是从黑洞奇点“反弹”的零测地线世界线。我们研究了二维膨胀引力中这种效应的某些量子修正，这些修正是通过世界线对黑洞几何结构的引力反作用捕获的。这些修正平滑了弹跳测地奇点。通过在最速下降分析中跟踪反作用测地鞍，我们发现黑洞奇点物理以一种微妙的方式编码，涉及 $t=0$ 处 $G(t)$ 重合点奇点附近的斯托克斯现象（及其热图像）。我们指出本分析中发现的斯托克斯线结构与大型 $c$ 二维共形块中禁止奇点分析中存在的结构之间的相似之处。最后，我们对这些模型中除了反反应之外的量子校正的重要性做了一些初步的评论。", "authors": [{"name": "Gauri Batra"}, {"name": "Adam Levine"}, {"name": "Stephen H. Shenker"}], "featured_authors": [{"name": "Gauri Batra"}, {"name": "Adam Levine"}, {"name": "Stephen H. Shenker"}], "author_count": 3}, {"id": "2609.32096", "category": "hep-th", "title": "Learning Scattering Amplitudes with Transformer Reinforcement Learning", "abstract": "We introduce a transformer reinforcement learning algorithm that learns to solve high loop-level scattering amplitudes in planar N = 4 Super Yang-Mills theory. Our algorithm improves on previous transformer-only results by incorporating previously derived symmetries and relationships into the learning algorithm. This results in a greatly decreased fraction of the solution that needs to be known a priori to solve the entire problem. An additional benefit is that our algorithm also ensures that every output obeys the set of known relationships. Rather than predicting all coefficients independently, the model proposes assignments that are propagated through exact linear relations, while MCTS searches over assignments when propagation alone is insufficient. This is crucial to the generalization of machine learning approaches to higher loops, as without this, there is no way to overcome the factorially scaling of state sizes and compare to results derived via other methods. Using the symbology representation of the form factor, we frame the problem as learning a mapping between discrete sequences and integer coefficients.", "url": "https://arxiv.org/abs/2609.32096", "type": "理论", "summary": "我们引入了一种变压器强化学习算法，该算法学习解决平面 N = 4 Super Yang-Mills 理论中的高环路级散射振幅。我们的算法通过将先前导出的对称性和关系合并到学习算法中，改进了先前仅使用变压器的结果。这导致解决整个问题所需先验知识的解决方案的比例大大减少。另一个好处是我们的算法还确保每个输出都遵循一组已知关系。该模型不是独立预测所有系数，而是提出通过精确线性关系传播的分配，而 MCTS 在单独传播不足时搜索分配。这对于将机器学习方法推广到更高的循环至关重要，因为如果没有这一点，就无法克服状态大小的阶乘缩放并与通过其他方法得出的结果进行比较。使用形状因子的符号表示，我们将问题描述为学习离散序列和整数系数之间的映射。", "authors": [{"name": "Philip Velie"}, {"name": "Tianji Cai"}, {"name": "Piyush Jha"}, {"name": "Vijay Ganesh"}, {"name": "Aishik Ghosh"}], "featured_authors": [{"name": "Philip Velie"}, {"name": "Tianji Cai"}, {"name": "Piyush Jha"}, {"name": "Vijay Ganesh"}, {"name": "Aishik Ghosh"}], "author_count": 5}, {"id": "2609.32139", "category": "hep-th", "title": "Hairy Taub-NUT solution in gauged supergravity", "abstract": "We present and study a family of exact Taub-NUT-AdS solutions with scalar hair in four-dimensional ${\\cal N}=2$ gauged supergravity. The solutions are supported solely by a nontrivial scalar field and its self-interaction potential, with all gauge fields switched off. We determine the conditions under which Killing horizons exist and demonstrate that the spacetime admits at most one Killing horizon, and whenever it exists it is necessarily nondegenerate. In particular, the NUT deformation can give rise to a horizon in a branch whose static limit is horizonless. We also establish that the solutions with nontrivial scalar hair admit no Killing spinors. As in ordinary Taub-NUT-AdS spacetime, the global structure is afflicted by closed timelike curves. We compute the conserved mass using the covariant phase space method and formulate a restricted first law with the NUT parameter held fixed. Finally, we study the Euclidean sector, including an exceptional family specific to Euclidean signature, and determine the regularity conditions for bolts and nuts.", "url": "https://arxiv.org/abs/2609.32139", "type": "理论", "summary": "我们提出并研究了一系列精确的 Taub-NUT-AdS 解决方案，在四维 ${\\cal N}=2$ 计量超重力下具有标量毛发。该解决方案仅由非平凡标量场及其自相互作用势支持，所有规范场均关闭。我们确定了杀戮视界存在的条件，并证明时空最多允许一个杀戮视界，并且只要它存在，它就必然是非简并的。特别是，NUT 变形可以在静态极限为无水平的分支中产生水平。我们还确定，具有非平凡标量头发的解决方案不允许杀死旋量。与普通 Taub-NUT-AdS 时空一样，全局结构受到闭合类时曲线的影响。我们使用协变相空间方法计算守恒质量，并在 NUT 参数保持固定的情况下制定限制第一定律。最后，我们研究欧几里得扇形，包括特定于欧几里得签名的特殊族，并确定螺栓和螺母的正则条件。", "authors": [{"name": "Masato Nozawa"}], "featured_authors": [{"name": "Masato Nozawa"}], "author_count": 1}, {"id": "2609.32212", "category": "hep-th", "title": "Higher-Form Description of Chiral Soliton Lattice", "abstract": "The chiral soliton lattice (CSL) is conventionally described as a periodic winding configuration of a compact scalar field. In this paper, we formulate the CSL in a higher-form framework based on a Stückelberg coupling between a two-form gauge field $C_2$ and a three-form gauge field $A_3$, in which strings and walls can be treated directly as extended sources. Higher-form gauge invariance requires the string worldsheet to be the boundary of the wall worldvolume. In the quadratic dual effective theory, exchange of the massive higher-form mode generates a repulsive Yukawa interaction between parallel walls. With its coefficient fixed by duality, the resulting CSL lattice spacing agrees well with the exact Sine--Gordon result without parameter fitting. We then extend the description to a nonlinear, multi-branch higher-form theory. It reproduces the exact dilute wall--wall interaction coefficient, the periodic CSL and its energy-minimization condition, as well as the gapless CSL phonon. The phonon is identified as a collective displacement of the periodic higher-form background, while scalar winding is reinterpreted as branch flow of the nonlinear higher-form theory.", "url": "https://arxiv.org/abs/2609.32212", "type": "理论", "summary": "手性孤子晶格（CSL）通常被描述为紧致标量场的周期性缠绕配置。在本文中，我们在基于两种形式规范场 $C_2$ 和三种形式规范场 $A_3$ 之间的 Stückelberg 耦合的更高形式框架中制定了 CSL，其中弦和墙可以直接视为扩展源。更高形式的规范不变性要求弦世界表是墙世界体的边界。在二次对偶有效理论中，大规模高级模式的交换会在平行壁之间产生排斥性汤川相互作用。由于其系数由对偶性固定，所得的 CSL 晶格间距与无需参数拟合的精确 Sine--Gordon 结果非常吻合。然后，我们将描述扩展到非线性、多分支的更高形式的理论。它再现了精确的稀壁-壁相互作用系数、周期性 CSL 及其能量最小化条件，以及无间隙 CSL 声子。声子被认为是周期性高形式背景的集体位移，而标量缠绕被重新解释为非线性高形式理论的分支流。", "authors": [{"name": "Yutaka Ookouchi"}], "featured_authors": [{"name": "Yutaka Ookouchi"}], "author_count": 1}, {"id": "2609.32497", "category": "hep-th", "title": "Rational Probes of Spectral Geometry in Hermitian Matrix Models", "abstract": "The planar loop equations of a Hermitian one-matrix model leave finitely many low moments undetermined. Hankel positivity constrains these moments but does not reveal how a fixed multicut family is embedded in moment space. We introduce a finite-plane diagnostic using the Cauchy kernels $f_n(x)=(z_n-x)^{-1}$ which we use as spectral probes. Their Gram matrix is the positive-semidefinite Pick matrix $P_{mn}$, whose positivity defines a finite-node bootstrap analogous to the Hankel bootstrap. For a fixed regular multicut topology, the nonbranching double zeros of the spectral discriminant, which we call \\emph{dressed saddles}, impose transverse constraints on the corresponding moment-space locus, while its remaining directions are filling fractions. Writing $z=E+i\\eta$, $E$ selects a spectral region and $\\eta>0$ sets a continuous resolution scale. We use $P(z,z)$ as a finite-plane spectral response and interpret $\\nabla_{\\mathbf m}P(z,z)$ as a moment-space susceptibility. Near a regular real dressed saddle, this susceptibility is enhanced as $\\eta^{-2}$ and aligns with a conormal to the filling-fraction manifold, whereas the leading enhancement cancels along tangent deformations. Responses near several independent saddles can therefore reconstruct the conormal space and, through their common kernel, its tangent space. Combining Pick positivity with reality and analyticity of the resolvent, we obtain alternative analytic derivations of known planar results in quartic and sextic models. The asymmetric quartic makes the one-dimensional filling-fraction geometry explicit, while sextic models exhibit independent conormal directions. These results clarify how local consistency conditions constrain the low moments before global period matching and the equilibrium variational inequality select the equilibrium measure.", "url": "https://arxiv.org/abs/2609.32497", "type": "理论", "summary": "埃尔米特单矩阵模型的平面环方程留下有限多个低矩未确定。汉克尔的积极性限制了这些时刻，但没有揭示固定的多切割族是如何嵌入时刻空间的。我们使用柯西核 $f_n(x)=(z_n-x)^{-1}$ 引入有限平面诊断，我们将其用作谱探针。它们的 Gram 矩阵是正半定 Pick 矩阵 $P_{mn}$，其正性定义了类似于 Hankel bootstrap 的有限节点 bootstrap。对于固定的规则多切割拓扑，谱判别式的非分支双零（我们称为 \\emph{dressed Saddles}）对相应的矩空间轨迹施加横向约束，而其剩余方向是填充分数。写入 $z=E+i\\eta$，$E$ 选择光谱区域，$\\eta>0$ 设置连续分辨率范围。我们使用 $P(z,z)$ 作为有限平面光谱响应，并将 $\\nabla_{\\mathbf m}P(z,z)$ 解释为矩空间磁化率。接近常规真实修饰的鞍座，这种敏感性以 $\\eta^{-2}$ 的形式增强，并与填充分数流形的共线对齐，而领先的增强沿切线变形抵消。\n\n因此，几个独立鞍点附近的响应可以重建共法空间，并通过它们的共同核重建其切线空间。将 Pick 正性与解的现实性和分析性相结合，我们获得了四次和六次模型中已知平面结果的替代分析推导。非对称四次使得一维填充分数几何变得明确，而六次模型则表现出独立的共法方向。这些结果阐明了局部一致性条件如何在全局周期匹配和均衡变分不等式选择均衡测度之前限制低矩。", "authors": [{"name": "Ali Nassar"}], "featured_authors": [{"name": "Ali Nassar"}], "author_count": 1}, {"id": "2609.32702", "category": "hep-th", "title": "Greybody Factors and Hawking Spectra of Quantum-Corrected Black Holes", "abstract": "We investigate Hawking radiation of a quantum-corrected Schwarzschild black hole with vacuum polarization and conformal anomaly effects. The corrected geometry has two horizons, a non-monotonic Hawking temperature that vanishes at a critical mass, and a logarithmic entropy correction. We compute greybody factors, spectra, and emission rates for massless bosonic fields of various spins and angular momenta. Quantum corrections suppress low-energy greybody factors and enhance high-energy ones. During late evaporation, where quantum influences become significant, the decreasing temperature strongly suppresses emission. In this case, the higher-spin modes become negligible, and the scalar $s=l=0$ mode dominates. The black hole lifetime is greatly extended as it asymptotically approaches a stable extremal remnant.", "url": "https://arxiv.org/abs/2609.32702", "type": "理论", "summary": "我们研究了具有真空偏振和共形异常效应的量子校正史瓦西黑洞的霍金辐射。校正后的几何结构有两个视野，一个在临界质量处消失的非单调霍金温度，以及一个对数熵校正。我们计算各种自旋和角动量的无质量玻色子场的灰体因子、光谱和发射率。量子校正抑制低能灰体因子并增强高能灰体因子。在蒸发后期，量子影响变得显着，降低的温度强烈抑制发射。在这种情况下，高自旋模式可以忽略不计，标量 $s=l=0$ 模式占主导地位。当黑洞逐渐接近稳定的极值残余时，黑洞的寿命大大延长。", "authors": [{"name": "Moslem Shafiee"}, {"name": "Ahmad Sheykhi"}], "featured_authors": [{"name": "Moslem Shafiee"}, {"name": "Ahmad Sheykhi"}], "author_count": 2}, {"id": "2609.32748", "category": "hep-th", "title": "Nonlinear pole topology of slow currents in holographic probe-brane metals", "abstract": "Low-frequency Drude response does not by itself determine which nearly conserved sector carries an electric current. We classify the leading cubic retarded response of an isolated, inversion-symmetric slow vector by its pole topology. Constitutive nonlinearity produces only incoming-frequency poles, whereas nonlinear relaxation adds a propagator at the emitted frequency; coupling to a second scalar slow mode generates pair-frequency poles. We then compute the full complex third-harmonic response of finite-density Dirac--Born--Infeld probe branes in Lifshitz black-brane backgrounds. In the marginal $z=2$ theory, the dense infrared response approaches the relaxation topology, with a signed infrared weight $p_{\\rm IR}=0.994\\pm0.002$ and a normalization-independent zero at $\\omega_\\times/\\Gamma_J=0.2918$. Nonmarginal $z=1$ and $z=3/2$ backgrounds instead realize mixed constitutive--relaxation weights, demonstrating that the topology is selected dynamically rather than imposed by the DBI square root. The exact nonlinear dc solution further yields a parameter-free dense-limit scaling function and a crossover field $E_{\\rm nl}\\propto T^{3/2}$ at $z=2$. These results connect emergent higher-form slow currents, nonlinear response theory, and holographic transport, while the two-mode extension identifies the additional pole structures expected when energy or deformation modes remain slow.", "url": "https://arxiv.org/abs/2609.32748", "type": "理论", "summary": "低频德鲁德响应本身并不能确定哪个几乎保守的扇区携带电流。我们根据极点拓扑对孤立的、反演对称慢矢量的主导立方延迟响应进行分类。本构非线性仅产生输入频率极点，而非线性松弛在发射频率处添加传播器；耦合到第二标量慢模式会产生频率对极点。然后，我们计算 Lifshitz 黑膜背景中有限密度 Dirac-Born-Infeld 探针膜的完整复数三次谐波响应。在边际 $z=2$ 理论中，密集红外响应接近弛豫拓扑，具有符号红外权重 $p_{\\rm IR}=0.994\\pm0.002$ 和与归一化无关的零 $\\omega_\\times/\\Gamma_J=0.2918$。非边缘 $z=1$ 和 $z=3/2$ 背景实现了混合本构松弛权重，表明拓扑是动态选择的，而不是由 DBI 平方根强加的。精确的非线性直流解进一步产生无参数稠密极限缩放函数和 $z=2$ 处的交叉场 $E_{\\rm nl}\\propto T^{3/2}$。\n\n这些结果将新出现的更高形式的慢电流、非线性响应理论和全息输运联系起来，而双模式扩展确定了当能量或变形模式保持缓慢时预期的额外极结构。", "authors": [{"name": "Yan Han"}, {"name": "Xiang-Qian Li"}], "featured_authors": [{"name": "Yan Han"}, {"name": "Xiang-Qian Li"}], "author_count": 2}, {"id": "2609.32866", "category": "hep-th", "title": "3d Lovelock gravity and the holographic c-theorem: Proof at all orders and resummation", "abstract": "We prove that 3d Lovelock gravity, the Horndeski theory obtained from the regularized Lovelock invariants in three dimensions, admits a holographic c-theorem at all orders and for arbitrary values of the couplings. In the minisuperspace of domain wall solutions, the equation of the Horndeski scalar is a total derivative at every order, which locks the derivative of the scalar to that of the warp factor along the flows we consider and allows the null energy condition to be integrated into a monotonic c-function. The linear scalar profile of the resulting vacuum breaks the special conformal transformations, so the dual theory is scale-invariant but not conformal, and the central charge is defined as the coefficient of the logarithmic divergence of the on-shell action on the sphere. We compute it exactly for the Gauss-Bonnet case and asymptotically for the full tower, and find that it is linear in the couplings and matches the UV value of the c-function. Since all results depend on the couplings only through two generating functions, we give the resummed Lagrangians, c-functions and central charges in closed form for the choices of couplings that lead to regular black holes, and classify the resummed theories by the positivity of the effective Newton constant on the vacuum and the uniqueness of the vacuum with a non-trivial scalar.", "url": "https://arxiv.org/abs/2609.32866", "type": "理论", "summary": "我们证明了 3d Lovelock 引力，即从三维正则化 Lovelock 不变量获得的 Horndeski 理论，在所有阶数和耦合的任意值下都承认全息 c 定理。在磁畴壁解的微型超空间中，Horndeski 标量方程是每个阶的全导数，它将标量的导数锁定为沿我们考虑的流动的扭曲因子的导数，并允许将零能量条件集成到单调 c 函数中。由此产生的真空的线性标量轮廓打破了特殊的共形变换，因此对偶理论是尺度不变的但不是共形的，并且中心电荷被定义为球体上壳作用的对数发散系数。我们针对 Gauss-Bonnet 情况精确计算它，并针对整个塔进行渐近计算，发现它在耦合中是线性的，并且与 c 函数的 UV 值匹配。\n\n由于所有结果仅取决于通过两个生成函数的耦合，因此我们以闭合形式给出了恢复的拉格朗日量、c函数和中心电荷，用于选择导致规则黑洞的耦合，并根据真空上有效牛顿常数的正性和具有非平凡标量的真空的唯一性对恢复的理论进行分类。", "authors": [{"name": "Gokhan Alkac"}, {"name": "Luis Guajardo"}, {"name": "Hikmet Ozsahin"}], "featured_authors": [{"name": "Gokhan Alkac"}, {"name": "Luis Guajardo"}, {"name": "Hikmet Ozsahin"}], "author_count": 3}, {"id": "2609.32878", "category": "hep-th", "title": "Charged regular AdS$_3$ black holes in a scalar-vector-tensor theory coupled to Born-Infeld electrodynamics", "abstract": "We construct exact, static, circularly symmetric charged regular AdS$_3$ black hole solutions in a three-dimensional scalar-vector-tensor theory obtained from regularized Gauss-Bonnet couplings. While the Maxwell-charged counterpart of this theory suffers from a logarithmic curvature singularity at the origin, we demonstrate that coupling the action to non-linear Born-Infeld electrodynamics cures this pathology. We obtain the metric function and show explicitly the regularity of the core. Depending on the choice of parameters, the solution exhibits various horizon structures, including single-horizon, double-horizon, extremal black holes, and horizonless regular geometries. Finally, we discuss the significance of this regular spacetime as a testbed for microscopic entropy calculations in singularity-free setups.", "url": "https://arxiv.org/abs/2609.32878", "type": "理论", "summary": "我们在从正则化高斯-邦内耦合获得的三维标量-矢量-张量理论中构造了精确的、静态的、循环对称的带电正则 AdS$_3$ 黑洞解。虽然该理论的麦克斯韦带电对应物在原点处存在对数曲率奇点，但我们证明，将作用与非线性玻恩-因菲尔德电动力学耦合可以治愈这种病态。我们获得了度量函数并明确地显示了核心的规律性。根据参数的选择，该解表现出各种视界结构，包括单视界、双视界、极值黑洞和无视界规则几何结构。最后，我们讨论了这个规则时空作为无奇点设置中微观熵计算测试平台的重要性。", "authors": [{"name": "Gokhan Alkac"}], "featured_authors": [{"name": "Gokhan Alkac"}], "author_count": 1}, {"id": "2609.33029", "category": "hep-th", "title": "Accelerating systems as probes of Lorentz violation", "abstract": "We investigate the Fulling-Davies-Unruh effect in a local Lorentz-violating effective field theory, focusing on the quantum-field response of accelerated detectors. We canonically quantize a real scalar field exactly in the coefficients for Lorentz violation. The dispersion relation, Hamiltonian, and massless and massive Wightman functions are obtained. We determine the conditions under which the scalar dynamics preserves boost symmetry and distinguish these from the weaker conditions required for stationarity along a single accelerated worldline. The Wightman functions are used to construct the finite-time Unruh-DeWitt response for a uniformly accelerated detector. For generic coefficients the response is nonstationary and depends on both the duration and temporal location of the measurement. The spectrum, which is the resulting excitation rate as a function of the energy level difference in the detector, is obtained numerically. It shows discernable differences with the usual massive thermal spectrum for dimensionless coefficients on the order of $10^{-7}$. Experimental implications of the result are discussed. As an alternative viewpoint, we place Lorentz violation in the point-particle sector, derive the exact trajectory generated by a constant electric field, and study the proper-time Fourier response of a conventional scalar wave along the modified trajectory.", "url": "https://arxiv.org/abs/2609.33029", "type": "理论", "summary": "我们研究局部洛伦兹破坏有效场理论中的 Fulling-Davies-Unruh 效应，重点关注加速探测器的量子场响应。我们精确地在洛伦兹违规的系​​数中规范地量化实标量场。得到了色散关系、哈密顿函数、无质量和重质量怀特曼函数。我们确定了标量动力学保持增强对称性的条件，并将这些条件与沿着单一加速世界线的平稳性所需的较弱条件区分开来。 Wightman 函数用于构造匀加速探测器的有限时间 Unruh-DeWitt 响应。对于通用系数，响应是非平稳的并且取决于测量的持续时间和时间位置。光谱是通过数字方式获得的，它是作为检测器中能级差的函数的最终激发速率。它显示出与通常的无量纲系数的大规模热谱的明显差异，其数量级为 10^{-7}$。讨论了结果的实验​​意义。\n\n作为另一种观点，我们将洛伦兹破坏置于点粒子扇区中，推导恒定电场产生的精确轨迹，并研究传统标量波沿修改轨迹的原时傅立叶响应。", "authors": [{"name": "Quentin G. Bailey"}, {"name": "Nils A. Nilsson"}, {"name": "Sawyer J. Star"}], "featured_authors": [{"name": "Quentin G. Bailey"}, {"name": "Nils A. Nilsson"}, {"name": "Sawyer J. Star"}], "author_count": 3}, {"id": "2609.33690", "category": "hep-th", "title": "Extrinsic Renormalization of New Massive Gravity", "abstract": "The renormalization of asymptotically AdS spacetimes in New Massive Gravity is studied using boundary terms constructed with the extrinsic curvature. For generic values of the theory couplings, a single extrinsic boundary term produces a consistent holographic description, as the variation of the total action is finite and expressible in terms of the holographic source. This prescription applies to constant-curvature geometries and non-Einstein solutions with Brown-Henneaux asymptotic conditions. A suitable asymptotic expansion shows the agreement of the resulting holographic stress tensor with the one obtained from the auxiliary-field formulation. At the degenerate point, where the two maximally symmetric vacua coalesce, the Fefferman-Graham expansion admits an additional mode associated with relaxed AdS boundary conditions. A quadratic extrinsic counterterm removes the new divergences and leads naturally to a holographic picture with two independent sources. The corresponding responses obey a modified holographic Ward identity and determine finite conserved charges. Finally, the proper use of the Noether-Wald formalism reproduces the correct charges of the BTZ black hole, non-Einstein AdS waves, and the rotating hairy black hole.", "url": "https://arxiv.org/abs/2609.33690", "type": "理论", "summary": "使用外在曲率构造的边界项研究了新大引力中渐近 AdS 时空的重正化。对于理论耦合的通用值，单个外在边界项产生一致的全息描述，因为总作用的变化是有限的并且可以用全息源来表达。该规定适用于常曲率几何和具有 Brown-Henneaux 渐近条件的非爱因斯坦解。适当的渐近展开显示了所得的全息应力张量与从辅助场公式获得的全息应力张量的一致性。在简并点，即两个最大对称真空合并的地方，Fefferman-Graham 展开式允许与宽松的 AdS 边界条件相关的附加模式。二次外在反项消除了新的分歧，并自然地导致具有两个独立来源的全息图。相应的响应遵循修改后的全息 Ward 恒等式并确定有限的守恒电荷。\n\n最后，正确使用Noether-Wald形式主义再现了BTZ黑洞、非爱因斯坦AdS波和旋转毛状黑洞的正确电荷。", "authors": [{"name": "Cristóbal Corral"}, {"name": "Rodrigo Olea"}, {"name": "Leonardo Sanhueza"}], "featured_authors": [{"name": "Cristóbal Corral"}, {"name": "Rodrigo Olea"}, {"name": "Leonardo Sanhueza"}], "author_count": 3}, {"id": "2609.33825", "category": "hep-th", "title": "Quantization of the electroweak Volkov-Proca theory", "abstract": "We quantize the charged sector of the electroweak theory in an external electromagnetic plane-wave background after spontaneous symmetry breaking, which we refer to as the electroweak Volkov-Proca theory, and analyze its global $U(1)$ symmetry and continuous residual translation subgroup together with the associated conserved charges and momentum components that label the states. We further derive the completeness and orthonormality relations for the Volkov-Proca states in Ritus form, and construct the off-shell and on-shell propagators, including their representation in terms of the scalar Volkov propagator. Finally, we derive the Källén-Lehmann spectral representation and the LSZ reduction formula for the Volkov-Proca states.", "url": "https://arxiv.org/abs/2609.33825", "type": "理论", "summary": "我们在自发对称破缺后对外部电磁平面波背景中的电弱理论的带电扇区进行量化，我们将其称为电弱沃尔科夫-普罗卡理论，并分析其全局 $U(1)$ 对称性和连续残差平移子群以及标记状态的相关守恒电荷和动量分量。我们进一步推导了 Ritus 形式的 Volkov-Proca 态的完整性和正交性关系，并构造了壳外和壳内传播子，包括它们用标量 Volkov 传播子表示。最后，我们推导了 Volkov-Proca 态的 Källén-Lehmann 谱表示和 LSZ 约简公式。", "authors": [{"name": "Tudor Pătuleanu"}], "featured_authors": [{"name": "Tudor Pătuleanu"}], "author_count": 1}, {"id": "2609.33942", "category": "hep-th", "title": "Vacuum polarization by charged matter fields in AdS spacetime in the presence of a cosmic string", "abstract": "In this paper we revisited the analyse the vacuum polarizations effect associated wit charged matter fields in a higher-dimensional anti de-Sitter (AdS) spacetime in the presence of an idealized cosmic string carrying magnetic flux running along its core. Specifically we will consider, separately, charged bosonic and fermionic fields propagating in this manifold. Our main objective is to calculate the vacuum expectation values (VEV) of the energy-momentum tensor, $\\langle T^\\mu_\\nu\\rangle$, associated with both matters fields. As will see, these VEVs are even function of the magnetic flux running along the string's core, with period equal to the quantum flux $\\Phi_0=\\frac{2\\pi}{e}$. Because the results obtained are expressed in terms of special functions, and a clear behavior for them are not very enlightening, we provide some graphs exhibiting their behavior as function of the distance to the string considering different values for the parameters presented in the model considered.", "url": "https://arxiv.org/abs/2609.33942", "type": "理论", "summary": "在本文中，我们重新分析了在存在沿着其核心运行的携带磁通量的理想化宇宙弦的情况下，在高维反去西特（AdS）时空中与带电物质场相关的真空极化效应。具体来说，我们将分别考虑在该流形中传播的带电玻色子场和费米子场。我们的主要目标是计算与两个物质场相关的能量动量张量 $\\langle T^\\mu_\\nu\\rangle$ 的真空期望值 (VEV)。正如我们将看到的，这些 VEV 甚至是沿着弦核心运行的磁通量的函数，其周期等于量子通量 $\\Phi_0=\\frac{2\\pi}{e}$。由于获得的结果是用特殊函数来表示的，并且它们的清晰行为并不是很有启发性，因此我们提供了一些图表，将它们的行为展示为到字符串的距离的函数，考虑到所考虑的模型中呈现的参数的不同值。", "authors": [{"name": "E. R. Bezerra de Mello"}], "featured_authors": [{"name": "E. R. Bezerra de Mello"}], "author_count": 1}, {"id": "2609.34073", "category": "hep-th", "title": "dS/CFT Holography including Fermionic Fields", "abstract": "We investigate some aspects of holography in de Sitter space, pertaining to the proposal for the dual theory residing on the late-time boundary [ arXiv:astro-ph/0210603v5 ], including a Fermionic field that satisfies the Dirac equation. The modes of the solutions near the boundary are found to possess equal and oscillatory fall-off, similar to the scalar field belonging to the principal series representation of the isometry group of de Sitter space. We evaluate, by suitably adding a boundary term to the Dirac action, the wavefunctional of the Bunch Davies vacuum in path integral formalism in terms of the projections of the field on the eigenspaces of the time-like ${\\gamma}$-matrix. We validate our path-integral construction of the wavefunctional by reproducing the two-point function between the field operators in the vacuum state as computed in the canonical formalism. By appropriately identifying the boundary sources in terms of the projected components of the bulk field, we find that a single Dirac field in the bulk corresponds to a pair of primary spinor fields in the boundary theory and show that the resulting wavefunction coefficients satisfy the conformal Ward identities. We check the robustness of our holographic map under the addition of a Yukawa interaction considering the two cases where the scalar field in the interaction term belongs to the complementary series and the principal series representations of the isometry group of de Sitter space respectively.", "url": "https://arxiv.org/abs/2609.34073", "type": "理论", "summary": "我们研究了德西特空间中全息术的一些方面，涉及驻留在晚期边界上的对偶理论的提议[arXiv:astro-ph/0210603v5]，包括满足狄拉克方程的费米子场。发现边界附近的解的模式具有相等的振荡衰减，类似于属于德西特空间等距群的主级数表示的标量场。通过在狄拉克作用中适当添加边界项，我们根据场在类时 ${\\gamma}$-矩阵的本征空间上的投影来评估路径积分形式主义中的 Bunch Davies 真空的波函数。我们通过再现真空状态下场算子之间的两点函数（如规范形式主义中计算的那样）来验证波函数的路径积分构造。通过根据体场的投影分量适当地识别边界源，我们发现体体中的单个狄拉克场对应于边界理论中的一对初级旋量场，并表明所得的波函数系数满足共角沃德恒等式。\n\n考虑到相互作用项中的标量场分别属于德西特空间等距群的互补级数和主级数表示的两种情况，我们检查了添加汤川相互作用下全息图的鲁棒性。", "authors": [{"name": "Akashdeep Roy"}], "featured_authors": [{"name": "Akashdeep Roy"}], "author_count": 1}, {"id": "2609.34248", "category": "hep-th", "title": "RG Limit Cycles in BKT Flows $\\equiv$ Periodic Real-Time Dynamics in the Current-Current Perturbed $SU(2)_1$ WZW Model", "abstract": "We establish an exact correspondence between renormalization-group (RG) evolution and real-time quantum dynamics in the anisotropic current-current perturbed $SU(2)_1$ Wess-Zumino-Witten (WZW) model. Using its integrable fermionic representation, we construct the exact time-dependent many-body wavefunction by means of the generalized Bethe ansatz and show that periodic boundary conditions lead to quantum Knizhnik-Zamolodchikov equations associated with the XXZ trigonometric $R$-matrix, which corresponds to the quantum affine algebra $\\mathcal{U}_q(\\widehat{\\mathfrak{sl}_2})$ evaluated in its spin-$1/2$ evaluation representation. Consistency of these equations constrains the temporal evolution of the longitudinal and transverse interaction strengths. In the universal regime, these integrability conditions are exactly equivalent to the Berezinskii-Kosterlitz-Thouless RG flow equations upon identifying physical time with the logarithmic RG scale. Consequently, the RG limit cycles of the anisotropic current-current perturbed $SU(2)_1$ WZW model are realized as periodic real-time evolution of its interaction strengths. Our results provide an exact dynamical realization of RG limit cycles and establish a direct connection between cyclic RG flows, quantum integrability, and periodically driven interacting quantum field theories.", "url": "https://arxiv.org/abs/2609.34248", "type": "理论", "summary": "我们在各向异性电流-电流扰动 $SU(2)_1$ Wess-Zumino-Witten (WZW) 模型中建立了重正化群 (RG) 演化与实时量子动力学之间的精确对应关系。利用其可积费米子表示，我们通过广义 Bethe ansatz 构造了精确的时间相关多体波函数，并表明周期性边界条件导致与 XXZ 三角 $R$-矩阵相关的量子 Knizhnik-Zamolodchikov 方程，该方程对应于在其计算中评估的量子仿射代数 $\\mathcal{U}_q(\\widehat{\\mathfrak{sl}_2})$ spin-$1/2$ 评估表示。这些方程的一致性限制了纵向和横向相互作用强度的时间演变。在通用体系中，这些可积条件与使用对数 RG 尺度识别物理时间时的 Berezinskii-Kosterlitz-Thouless RG 流方程完全等效。因此，各向异性电流-电流扰动$SU(2)_1$ WZW模型的RG极限环被实现为其相互作用强度的周期性实时演化。\n\n我们的结果提供了 RG 极限环的精确动态实现，并在循环 RG 流、量子可积性和周期性驱动的相互作用量子场论之间建立了直接联系。", "authors": [{"name": "Parameshwar R. Pasnoori"}], "featured_authors": [{"name": "Parameshwar R. Pasnoori"}], "author_count": 1}, {"id": "2609.34323", "category": "hep-th", "title": "Three-loop anomalous dimensions of leading-twist operators in the Gross-Neveu-Yukawa model", "abstract": "We compute the anomalous dimensions of the leading-twist operators at three-loop level in the $\\overline{\\text{MS}}$ scheme in the Gross-Neveu-Yukawa model. Calculations are done for a number of low-spin operators using computer algebra systems, and the analytical form is reconstructed by solving a set of Diophantine equations. Calculations are optimized using the emergent supersymmetry of the corresponding generalized theory. For the obtained results, we perform a comprehensive analysis at the critical point, including a comparison with the $1/N$ expansion, a check of the generalized Gribov-Lipatov reciprocity, and an analysis of the behavior next to the rightmost singularity. The latter allows us to extract the values of Regge intercepts for all the leading-twist trajectories in the form of an $\\epsilon$ expansion.", "url": "https://arxiv.org/abs/2609.34323", "type": "理论", "summary": "我们在 Gross-Neveu-Yukawa 模型中的 $\\overline{\\text{MS}}$ 方案中计算三循环级别的前导扭转算子的异常维度。使用计算机代数系统对许多低自旋算子进行计算，并通过求解一组丢番图方程来重建解析形式。使用相应广义理论的新兴超对称性来优化计算。对于获得的结果，我们在关键点进行了全面的分析，包括与 $1/N$ 展开式的比较、广义 Gribov-Lipatov 互易性的检查以及最右侧奇点旁边的行为分析。后者允许我们以 $\\epsilon$ 展开的形式提取所有前旋轨迹的 Regge 截距值。", "authors": [{"name": "Mrigankamauli Chakraborty"}, {"name": "Leonid A. Shumilov"}], "featured_authors": [{"name": "Mrigankamauli Chakraborty"}, {"name": "Leonid A. Shumilov"}], "author_count": 2}, {"id": "2609.34529", "category": "hep-th", "title": "Cylinder Defect Casimir Energy and Weyl Anomalies", "abstract": "We distinguish two Casimir observables associated with a conformal surface defect. A circular cylinder embedded in flat space has a logarithmic contribution to its Casimir energy, $-d_1\\log(R/\\epsilon)/(24R)$, fixed by the displacement anomaly. A great cylinder obtained by radial quantization of the ambient theory instead has Casimir energy $-b/(12R)$ in the conformal defect vacuum with a fixed local anomaly convention. Free-field and holographic calculations provide checks of the proposed relations in both embeddings.", "url": "https://arxiv.org/abs/2609.34529", "type": "理论", "summary": "我们区分了与共形表面缺陷相关的两个卡西米尔可观测量。嵌入平坦空间的圆柱体对其卡西米尔能量具有对数贡献 $-d_1\\log(R/\\epsilon)/(24R)$，由位移异常固定。通过环境理论的径向量子化获得的大圆柱体在具有固定局部异常约定的共形缺陷真空中具有卡西米尔能量 $-b/(12R)$。自由场和全息计算提供了对两种嵌入中所提出的关系的检查。", "authors": [{"name": "Yang Zhou"}], "featured_authors": [{"name": "Yang Zhou"}], "author_count": 1}, {"id": "2609.34777", "category": "hep-th", "title": "M2 brane $S^3/\\mathbb Z_k$ instanton partition function in ${\\rm AdS}_4\\times S^7/\\mathbb Z_k$: 2-loop correction", "abstract": "As was shown in arXiv:2609.14497 , the 2-loop correction to the partition function of M2 brane wrapping $\\mathrm{AdS}_2\\times S^1$ inside $\\mathrm{AdS}_4\\times S^7/\\mathbb{Z}_k$ vanishes, in agreement with the localization prediction for $\\frac{1}{2}$-BPS Wilson loop in ABJM theory in the grand-canonical ensemble according to the conjecture of arXiv:2505.21633 . Here we study the 2-loop correction in the case of the M2 brane instanton $S^3/\\mathbb Z_k\\subset S^7/\\mathbb Z_k$ dual to non-perturbative large $N$ contribution to ABJM free energy on 3-sphere. The 1-loop instanton contribution was shown in arXiv:2307.14112 to match the localization prediction. The 2-loop computation is complicated by the presence of bosonic and fermionic zero modes, which require using projected Green's functions and accounting for the collective-coordinate Jacobian. The Jacobian provides a non-trivial 2-loop contribution in addition to the one of the 4-vertex in the M2 brane action. We find that for $k>2$ the transcendental $k$-dependence of the 4-vertex contribution is cancelled by the Jacobian for any choice of the separation of the fermionic zero modes from the quantum fields. The residual rational term vanishes for the separation selected by the supersymmetry, under which the collective coordinates and the quantum fields form separate supermultiplets. We conjecture that the remaining integral over the collective coordinates contributes only to an overall normalization of the partition function, so it is 1-loop exact. For $k=1$ the quartic vertex contribution reduces to equation-of-motion terms as in the case of ${\\rm AdS}_3 \\subset { \\rm AdS}_7 \\times S^4$ in arXiv:2511.22306 related to $S^3 \\subset {\\rm AdS}_4 \\times S^7$ case by a formal analytic continuation.", "url": "https://arxiv.org/abs/2609.34777", "type": "理论", "summary": "如 arXiv:2609.14497 所示，对 $\\mathrm{AdS}_2\\times S^1$ 内部 $\\mathrm{AdS}_4\\times S^7/\\mathbb{Z}_k$ 的 M2 膜包裹 $\\mathrm{AdS}_2\\times S^1$ 的配分函数的 2 环修正消失，与 ABJM 理论中 $\\frac{1}{2}$-BPS Wilson 环的本地化预测一致。根据 arXiv:2505.21633 的猜想的大规范系综。在这里，我们研究 M2 膜瞬子 $S^3/\\mathbb Z_k\\subset S^7/\\mathbb Z_k$ 对偶非微扰大 $N$ 对 3 球上 ABJM 自由能贡献的情况下的 2 环校正。 arXiv:2307.14112 中显示了 1 环瞬时子贡献，以匹配本地化预测。由于玻色子和费米子零模式的存在，二环计算变得复杂，这需要使用投影格林函数并考虑集体坐标雅可比行列式。除了 M2 膜作用中的 4 顶点之一之外，雅可比行列式还提供了重要的 2 环贡献。我们发现，对于 $k>2$，对于费米子零模式与量子场的分离的任何选择，雅可比行列式都消除了 4 顶点贡献的先验 $k$ 依赖性。\n\n对于超对称性选择的分离，剩余有理项消失，在这种分离下，集体坐标和量子场形成单独的超多重态。我们推测集体坐标上的剩余积分仅有助于配分函数的整体归一化，因此它是单循环精确的。对于 $k=1$，四次顶点贡献减少为运动方程项，如 arXiv:2511.22306 中 ${\\rm AdS}_3 \\subset { \\rm AdS}_7 \\times S^4$ 的情况，通过形式分析延拓与 $S^3 \\subset {\\rm AdS}_4 \\times S^7$ 情况相关。", "authors": [{"name": "Arkady A. Tseytlin"}], "featured_authors": [{"name": "Arkady A. Tseytlin"}], "author_count": 1}, {"id": "2609.34811", "category": "hep-th", "title": "Semiclassical Liouville Theory on the Real Projective Plane: A Complex Interpretation of the Bootstrap", "abstract": "The exact one-point function of Liouville theory on the real projective plane was derived long ago from the bootstrap, yet it has never been verified against a semiclassical path-integral computation. The check is less straightforward than one might expect. On the real projective plane every constant-curvature metric is positively curved, whereas classical Liouville theory produces metrics of constant negative curvature, so no real classical solution exists. Instead, as we show, the semiclassical path integral receives contributions from infinitely many complex saddles with a negative-definite metric. Once the integration contour is chosen so that the path integral converges, these saddles reproduce the exact one-point function. Complex saddles arise in the same way in timelike Liouville theory and in two-dimensional de~Sitter gravity, and the example treated here offers a rare opportunity to test their use against a known exact answer. \\end{abstract", "url": "https://arxiv.org/abs/2609.34811", "type": "理论", "summary": "刘维尔理论在实射影平面上的精确单点函数很久以前就从自举法中导出，但从未通过半经典路径积分计算得到验证。这项检查并不像人们想象的那么简单。在实射影平面上，每个常曲率度量都是正弯曲的，而经典刘维尔理论产生常负曲率的度量，因此不存在真正的经典解。相反，正如我们所展示的，半经典路径积分接收来自无限多个具有负定度量的复杂鞍的贡献。一旦选择了积分轮廓以使路径积分收敛，这些鞍点就会再现精确的单点函数。复杂鞍点在类时刘维尔理论和二维解西特引力中以同样的方式出现，这里处理的例子提供了一个难得的机会来测试它们在已知的精确答案上的使用。 \\结束{摘要", "authors": [{"name": "Yu Nakayama"}], "featured_authors": [{"name": "Yu Nakayama"}], "author_count": 1}, {"id": "2609.34909", "category": "hep-th", "title": "Holography for integrable field theories", "abstract": "We develop a holographic dual to the integrable field theories built from $4d$ Chern-Simons theory. The dual theory is a topological string on a generalized Calabi-Yau manifold, which is entirely encoded in a geometric object we call a planar spectral curve. We describe the RG flow for a planar integrable field theory as a geometric flow on the moduli of planar spectral curves. This description is valid at all orders in the 't Hooft coupling. We compute this flow explicitly up to two loops in many examples, and find an exact match with known field theory results. At one loop this includes a wide class of models. At two loops we reproduce the RG flow for the principal chiral model with WZ term, and for a class of integrable $\\sigma$-models with target $U(N) \\times U(N)$.", "url": "https://arxiv.org/abs/2609.34909", "type": "理论", "summary": "我们开发了基于 $4d$ Chern-Simons 理论构建的可积场论的全息对偶。对偶理论是广义卡拉比-丘流形上的拓扑串，它完全编码在我们称为平面谱曲线的几何对象中。我们将平面可积场论的 RG 流描述为平面谱曲线模上的几何流。此描述对于 't Hooft 联轴器中的所有订单均有效。在许多例子中，我们明确地计算这个流最多两个循环，并找到与已知场论结果的精确匹配。在一个循环中，这包括一类广泛的模型。在两个循环中，我们重现了具有 WZ 项的主要手性模型的 RG 流，以及具有目标 $U(N) \\times U(N)$ 的一类可积 $\\sigma$ 模型的 RG 流。", "authors": [{"name": "Kevin Costello"}, {"name": "Joaquin Liniado"}], "featured_authors": [{"name": "Kevin Costello"}, {"name": "Joaquin Liniado"}], "author_count": 2}, {"id": "2609.34945", "category": "hep-th", "title": "Black holes with axion hair from cubic Riemann interactions", "abstract": "An effective field theory (EFT) of gravity with a cubic Riemann invariant coupled to an axion-like field is investigated and shown to propagate no additional independent low-energy degrees of freedom. This interaction generates a curvature-induced scalar profile around black holes, characterised by a secondary axion charge fixed by regularity of the axion field at the horizon, while the requirement of a regular event horizon constrains the asymptotic axion background. We construct the corresponding black hole solutions and show that the backreaction of the axion field could affect the metric only at subleading order in the EFT expansion. The modified geometry impacts black hole thermodynamics and Hawking evaporation, thus providing a controlled realisation of black holes with higher-curvature contributions and secondary axion hair motivated by ultraviolet physics. The modified Hawking temperature allows for the existence of black hole remnants at the end of the evaporation within the regime of validity of the EFT.", "url": "https://arxiv.org/abs/2609.34945", "type": "理论", "summary": "研究了具有与类轴子场耦合的三次黎曼不变量的重力有效场论 (EFT)，并证明其不会传播额外的独立低能自由度。这种相互作用在黑洞周围产生曲率引起的标量分布，其特征是由地平线处轴子场的规律性固定的二次轴子电荷，而规则事件视界的要求限制了渐近轴子背景。我们构建了相应的黑洞解，并表明轴子场的反作用只能在 EFT 展开中的次导阶上影响度量。修改后的几何形状会影响黑洞热力学和霍金蒸发，从而提供受紫外线物理驱动的具有更高曲率贡献和次级轴子毛的黑洞的受控实现。修改后的霍金温度允许在 EFT 有效范围内蒸发结束时存在黑洞残余物。", "authors": [{"name": "Roberto Casadio"}, {"name": "Roldao da Rocha"}], "featured_authors": [{"name": "Roberto Casadio"}, {"name": "Roldao da Rocha"}], "author_count": 2}, {"id": "2609.35253", "category": "hep-th", "title": "Exotic gravity theory in topologically non-trivial spacetimes", "abstract": "An exotic linearised theory of superconformal gravity in $D=6, (4,0)$ superspace has been proposed by C.M. Hull. In this note we discuss the bosonic sector of this model in topologically non-trivial spaces. Roughly speaking, Hull's model can be thought of as a square of the $H=dB$ theory, although not all Hull fields can be so presented. We also briefly discuss the form sector of $D=11$ supergravity.", "url": "https://arxiv.org/abs/2609.35253", "type": "理论", "summary": "C.M. 提出了 $D=6, (4,0)$ 超空间中超共形引力的奇异线性化理论。船体。在这篇文章中，我们讨论了该模型在拓扑非平凡空间中的玻色子部分。粗略地说，赫尔模型可以被认为是 $H=dB$ 理论的平方，尽管并非所有赫尔场都可以这样表示。我们还简要讨论了 $D=11$ 超重力的形态扇区。", "authors": [{"name": "P.S. Howe"}, {"name": "U. Lindström"}], "featured_authors": [{"name": "P.S. Howe"}, {"name": "U. Lindström"}], "author_count": 2}, {"id": "2609.35452", "category": "hep-th", "title": "A gravitational realization of Courant-Hilbert deformations", "abstract": "Courant-Hilbert (CH) deformations unify broad classes of solvable stress-tensor flows including $T\\bar{T}$ and root-$T\\bar{T}$. However, a gravitational action that systematically yields such general deformations has remained unknown. In this Letter, we construct a two-dimensional massive gravity theory whose on-shell action reproduces the complete CH deformation. The gravity sector is defined via an arbitrary function of the eigenvalue ratio $y$ of the relative zweibein. To bypass the technical difficulty of directly eliminating the auxiliary zweibein, we reformulate the matter sector using a $2 \\times 2$ spectral decomposition involving $y$ and a rank-one projector $K$. Sequentially solving the equations of motion--first for $K$ and subsequently for $y$--naturally maps the system onto the Russo-Townsend form of the CH flow. Our work extends Tolley's massive gravity formulation of $T\\bar{T}$ flows to the CH landscape, providing a clear geometric mechanism for solvable stress-tensor flows.", "url": "https://arxiv.org/abs/2609.35452", "type": "理论", "summary": "Courant-Hilbert (CH) 变形统一了广泛类别的可解应力张量流，包括 $T\\bar{T}$ 和 root-$T\\bar{T}$。然而，系统地产生这种普遍变形的引力作用仍然未知。在这封信中，我们构建了一个二维质量引力理论，其壳上作用再现了完整的 CH 变形。重力扇区是通过相对 zweibein 的特征值比 $y$ 的任意函数来定义的。为了绕过直接消除辅助 zweibein 的技术困难，我们使用涉及 $y$ 和一级投影仪 $K$ 的 $2 \\times 2$ 光谱分解来重新表述物质扇区。依次求解运动方程（首先求解 $K$，然后求解 $y$）自然地将系统映射到 CH 流的 Russo-Townsend 形式。我们的工作将托利的 $T\\bar{T}$ 流的大规模重力公式扩展到 CH 景观，为可解的应力张量流提供了清晰的几何机制。", "authors": [{"name": "Osamu Fukushima"}, {"name": "Miyabi Kurihara"}, {"name": "Takaki Matsumoto"}, {"name": "Kentaroh Yoshida"}], "featured_authors": [{"name": "Osamu Fukushima"}, {"name": "Miyabi Kurihara"}, {"name": "Takaki Matsumoto"}, {"name": "Kentaroh Yoshida"}], "author_count": 4}, {"id": "2609.35455", "category": "hep-th", "title": "Regge in Wonderland", "abstract": "We study the asymptotic behavior of large-spin operators in conformal field theories by placing the theory on a pp-wave background. In this setting, three-point coefficients involving two large-spin operators and a light operator are mapped to thermal one-point functions on the pp-wave. We predict these one-point functions in the two complementary regimes of high- and low-temperature respectively, corresponding to a limit in which the twist scales with an appropriate power of the spin and the spin is parametrically larger than the twist, respectively. In particular, at high temperature we derive their asymptotic behavior using thermal effective field theory while at low temperature we obtain results that can be matched directly to predictions from the analytic bootstrap. We test these general results in free scalar theories. Finally, we solve the large-$N$ $\\mathrm{O}(N)$ model numerically on the pp-wave, finding agreement with our predictions for both the one-point function and the free energy in the high- and low-temperature regimes.", "url": "https://arxiv.org/abs/2609.35455", "type": "理论", "summary": "我们通过将理论置于 pp 波背景上来研究共形场论中大自旋算子的渐近行为。在此设置中，涉及两个大自旋算子和一个光算子的三点系数被映射到 pp 波上的热单点函数。我们分别预测了高温和低温两种互补状态下的这些单点函数，对应于扭曲与适当的自旋幂成比例的极限，并且自旋分别在参数上大于扭曲。特别是，在高温下，我们使用热有效场理论推导出它们的渐近行为，而在低温下，我们获得的结果可以直接与分析自举的预测相匹配。我们在自由标量理论中测试这些一般结果。最后，我们在 pp 波上数值求解大 $N$ $\\mathrm{O}(N)$ 模型，发现与我们对高温和低温状态下的单点函数和自由能的预测一致。", "authors": [{"name": "Alessio Miscioscia"}, {"name": "Dmitrii Pavshinkin"}, {"name": "Fedor K. Popov"}], "featured_authors": [{"name": "Alessio Miscioscia"}, {"name": "Dmitrii Pavshinkin"}, {"name": "Fedor K. Popov"}], "author_count": 3}, {"id": "2609.35495", "category": "hep-th", "title": "Knizhnik-Zamolodchikov equations and the analytic structure of strings in AdS$_3$", "abstract": "The pole structure of string correlators in AdS$_3$ encodes essential information about the AdS$_3$/CFT$_2$ duality. The corresponding residues for spectrally flowed three-point functions have been extracted from their exact expressions and shown to match the predictions of the holographic CFT. Away from the tensionless point, the latter is defined perturbatively in terms of a deformed symmetric orbifold. For $n$-point functions, this has so far only been achieved for a specific subset of poles and employing free-field techniques. Here we develop an alternative approach. We show that, starting from the localization properties of worldsheet correlators, one can solve the KZ equations on the corresponding locus and perform the integration over worldsheet moduli explicitly for any $n$ and for arbitrary values of the spectral flow charges. This provides a systematic framework for computing the remaining residues and, ultimately, for determining the full analytic structure of string amplitudes in AdS$_3$.", "url": "https://arxiv.org/abs/2609.35495", "type": "理论", "summary": "AdS$_3$ 中串相关器的极点结构编码有关 AdS$_3$/CFT$_2$ 对偶性的基本信息。谱流三点函数的相应留数已从其精确表达式中提取出来，并显示与全息 CFT 的预测相匹配。远离无张力点，后者是根据变形的对称轨道折叠来微扰地定义的。对于 $n$ 点函数，迄今为止仅针对特定的极点子集并采用自由场技术实现了这一点。在这里，我们开发了一种替代方法。我们证明，从世界表相关器的定位属性开始，我们可以求解相应轨迹上的 KZ 方程，并对任何 $n$ 和谱流电荷的任意值显式地对世界表模进行积分。这提供了一个系统框架，用于计算剩余的残差，并最终确定 AdS$_3$ 中弦振幅的完整分析结构。", "authors": [{"name": "Sergio Iguri"}, {"name": "Nicolas Kovensky"}, {"name": "Julian H. Toro"}], "featured_authors": [{"name": "Sergio Iguri"}, {"name": "Nicolas Kovensky"}, {"name": "Julian H. Toro"}], "author_count": 3}, {"id": "2609.35604", "category": "hep-th", "title": "Symmetric Amplituhedra I: Spinor Helicity", "abstract": "For every pair of integers $0\\leq k\\leq N,$ and and every subgroup of $D_N\\times\\mathbb{Z}_2$, we construct the nonnegative symmetric Grassmannian, which is the subspace of the nonnegative Grassmannian fixed under that group, where the dihedral part acts on columns (with a sign correction to keep nonnegativity) and the $\\mathbb{Z}_2$ factor exchanges a space with its orthocomplement (again, with a sign correction). This construction generalizes the earlier constructions of \\cite{Karpman2018,Fraser2020,Shevchenko2025}. We study the geometry of this space. Then, when $k$ is further restricted to the range $[2,N-2]$ we also define a symmetric amplituhedron. We analyze its basic properties and its conjectural BCFW decomposition. The ABJM and reflected Lagrangian amplituhedra are the special cases corresponding to the groups $\\{1\\}\\times\\mathbb{Z}_2,$ and the group generated by a reflection combined with the exchange,", "url": "https://arxiv.org/abs/2609.35604", "type": "理论", "summary": "对于每对整数 $0\\leq k\\leq N,$ 以及 $D_N\\times\\mathbb{Z}_2$ 的每个子群，我们构造非负对称格拉斯曼矩阵，它是该群下固定的非负格拉斯曼矩阵的子空间，其中二面体部分作用于列（通过符号校正以保持非负性），并且 $\\mathbb{Z}_2$ 因子与其交换一个空间正交补码（再次进行符号修正）。这种构造概括了 \\cite{Karpman2018,Fraser2020,Shevchenko2025} 的早期构造。我们研究这个空间的几何形状。然后，当 $k$ 进一步限制在 $[2,N-2]$ 范围内时，我们还定义了一个对称振幅面体。我们分析了它的基本性质及其推测的 BCFW 分解。 ABJM 和反射拉格朗日振幅面是对应于群 $\\{1\\}\\times\\mathbb{Z}_2,$ 以及反射与交换结合生成的群的特例，", "authors": [{"name": "Ran J. Tessler"}], "featured_authors": [{"name": "Ran J. Tessler"}], "author_count": 1}, {"id": "2609.35688", "category": "hep-th", "title": "Microscopic Organization of BPS Black-Hole States in the D1--D5--P CFT", "abstract": "We study BPS states in the D1--D5 CFT through their fortuity, cycle structure, and probe response. Explicit fortuitous states with both long- and short-string geometries show that the cycle partition does not determine fortuity state by state. At large $N$, fixed-charge counting nevertheless selects a long string. In the open uncondensed region, an entropy-carrying exact non-graviton subspace concentrates on one cycle of winding $N-O(1)$. Assuming subexponential monotone dimension, the same holds for the harmonic fortuitous complement. Beyond the critical line, the free ensemble develops a short-string condensate. To test how this cycle structure appears in observables, we study finite-winding probes. The long-cycle scalar correlator approaches the extremal-BTZ response at fixed time, while finite winding is resolved at \\(t=O(\\sqrt N)\\), the exact circle recurs at \\(t=O(N)\\), and states with the same cycle geometry remain distinguishable by their spectral weights.", "url": "https://arxiv.org/abs/2609.35688", "type": "理论", "summary": "我们通过其偶然性、循环结构和探测响应来研究 D1--D5 CFT 中的 BPS 状态。具有长弦和短弦几何形状的显式偶然状态表明，循环划分不能逐个状态确定偶然状态。对于较大的 $N$，固定电荷计数仍然会选择一个长字符串。在开放的非凝聚区域中，一个携带熵的精确非引力子子空间集中在一个缠绕周期$N-O(1)$上。假设次指数单调维数，这同样适用于调和偶然补数。在临界线之外，自由合奏会产生短弦凝聚。为了测试这种循环结构如何出现在可观测量中，我们研究了有限缠绕探针。长周期标量相关器在固定时间接近极值 BTZ 响应，而有限缠绕在 \\(t=O(\\sqrt N)\\) 处解析，精确的圆在 \\(t=O(N)\\) 处重现，并且具有相同周期几何形状的状态仍然可以通过其谱权重来区分。", "authors": [{"name": "Ji-Seong Chae"}], "featured_authors": [{"name": "Ji-Seong Chae"}], "author_count": 1}, {"id": "2609.35705", "category": "hep-th", "title": "Journey to the Center of a Black Hole", "abstract": "An infalling two-point function of a scalar field in a three-dimensional BTZ black hole, with one operator inserted in the exterior and the other inserted along a timelike geodesic, diverges when the infalling insertion point reaches the black hole singularity. In the boundary description, this divergence comes entirely from the exchange of double-twist operators, rather than from the multi-stress-tensor sector that encodes the curvature singularities in higher dimensions. We show that the inclusion of a tower of massive particles with Hagedorn growth gives rise to loop corrections that become important near the singularity, where they trigger a Hagedorn transition that renders the tree-level divergence untrustworthy. In the boundary theory, the corresponding tower of primary operators leads to a breakdown of the generalized free field description of the probe operator in the black hole state. In a large black hole, these corrections become important only near the singularity and remain exponentially suppressed at the horizon. The region where these corrections dominate is therefore parametrically separated from the horizon, as anticipated by the principle of black hole complementarity.", "url": "https://arxiv.org/abs/2609.35705", "type": "理论", "summary": "三维 BTZ 黑洞中标量场的内落两点函数，其中一个算子插入外部，另一个算子沿类时测地线插入，当内落插入点到达黑洞奇点时，该函数会发散。在边界描述中，这种发散完全来自于双扭曲算子的交换，而不是来自于对更高维度的曲率奇点进行编码的多应力张量扇区。我们证明，包含哈格多恩生长的大量粒子塔会引起环路修正，这些修正在奇点附近变得很重要，它们会触发哈格多恩转变，从而使树级散度变得不可信。在边界理论中，相应的主算子塔导致了黑洞态下探测算子的广义自由场描述的崩溃。在大黑洞中，这些修正仅在奇点附近变得重要，并在视界处保持指数抑制。\n\n因此，正如黑洞互补性原理所预期的那样，这些校正占主导地位的区域在参数上与视界分开。", "authors": [{"name": "Vyshnav Mohan"}], "featured_authors": [{"name": "Vyshnav Mohan"}], "author_count": 1}, {"id": "2609.31858", "category": "math-ph", "title": "Locality of KMS states for infinite fermionic lattice systems", "abstract": "We study how thermal equilibrium states of infinite fermionic lattices respond to perturbations of the Hamiltonian. Our main result concerns extensive perturbations of a chosen KMS state. We show that exponential decay of correlations and exponential local indistinguishability under the extensive perturbation yield stretched-exponential decay of correlations for the perturbed state. Neither the initial nor the perturbed state is required to be unique, allowing stability to be studied in the presence of phase coexistence. Our approach uses Quantum Belief Propagation (QBP), which we establish directly on the underlying $C^*$-algebra. Combining QBP with Lieb--Robinson bounds, we show implications between decay of correlations, the principle that local perturbations perturb locally, and local indistinguishability, closing the cycle for perturbations of the tracial state under the stated decay, support and uniformity assumptions. For extensive perturbations under uniform clustering conditions, we also obtain a differentiable path of local equilibrium expectations and bound their change linearly in the interaction norm of the perturbation.", "url": "https://arxiv.org/abs/2609.31858", "type": "理论", "summary": "我们研究无限费米子晶格的热平衡态如何响应哈密顿量的扰动。我们的主要结果涉及所选 KMS 状态的广泛扰动。 We show that exponential decay of correlations and exponential local indistinguishability under the extensive perturbation yield stretched-exponential decay of correlations for the perturbed state.初始状态和扰动状态都不需要是唯一的，从而允许在相共存的情况下研究稳定性。我们的方法使用量子信念传播（QBP），我们直接在底层 $C^*$-代数上建立它。 Combining QBP with Lieb--Robinson bounds, we show implications between decay of correlations, the principle that local perturbations perturb locally, and local indistinguishability, closing the cycle for perturbations of the tracial state under the stated decay, support and uniformity assumptions. For extensive perturbations under uniform clustering conditions, we also obtain a differentiable path of local equilibrium expectations and bound their change linearly in the interaction norm of the perturbation.", "authors": [{"name": "Lennart Becker"}], "featured_authors": [{"name": "Lennart Becker"}], "author_count": 1}, {"id": "2609.32095", "category": "math-ph", "title": "Local Determinant Defects and Low-Energy Subspace Stability in Semifinite von Neumann Algebras", "abstract": "We give a finite-temperature test for the stability of low-energy spectral subspaces. The test uses a local determinant defect for the alpha-z Renyi kernel of two Gibbs states and bounds the tracial L2 distance between their low-energy projections. The main tool is a spectral-flattening principle for bounded positive injective operators in a semifinite von Neumann algebra. It reduces the local product defect to an exact two-projection formula. The thermal result applies to lower-bounded affiliated Hamiltonians with trace-class Gibbs operators and does not require the Hamiltonians to be close in operator norm. We give an infinite-level example with unbounded Hamiltonians. For matrices, the result gives a sum of principal-angle remainders. For qubits, the defect and the thermal gaps determine the ground-state overlap exactly. The same estimate gives a uniform error bound for bounded observables in an effective low-energy model. We also prove the determinant inequalities, their equality cases, and z-monotonicity in matrix, finite, and semifinite settings.", "url": "https://arxiv.org/abs/2609.32095", "type": "理论", "summary": "我们对低能谱子空间的稳定性进行了有限温度测试。 The test uses a local determinant defect for the alpha-z Renyi kernel of two Gibbs states and bounds the tracial L2 distance between their low-energy projections.主要工具是半有限冯诺依曼代数中有界正单射算子的谱平坦原理。它将局部产品缺陷减少到精确的二次投影公式。 The thermal result applies to lower-bounded affiliated Hamiltonians with trace-class Gibbs operators and does not require the Hamiltonians to be close in operator norm.我们给出一个具有无界哈密顿量的无限级示例。对于矩阵，结果给出主角余数之和。对于量子位，缺陷和热间隙准确地确定了基态重叠。同样的估计给出了有效低能量模型中有界可观测量的统一误差界限。我们还证明了行列式不等式、它们的等式情况以及矩阵、有限和半有限设置中的 z 单调性。", "authors": [{"name": "Seyed Mahmoud Manjegani"}], "featured_authors": [{"name": "Seyed Mahmoud Manjegani"}], "author_count": 1}, {"id": "2609.32218", "category": "math-ph", "title": "The Hamilton--Jacobi and Symplectic Analysis for Extended Hořava Gravity", "abstract": "The Hamilton-Jacobi [HJ] analysis and the Faddeev-Jackiw [FJ] quantization for the linearized, non-projectable $\\lambda R$ model, extended by the lowest-order term of Blas, Pujolàs, and Sibiryakov and the higher-order term involving the square of the Cotton tensor, were carried out. The cases $\\lambda \\neq \\frac{1}{3}$ and $\\lambda = \\frac{1}{3}$ are analyzed. Within the Hamilton-Jacobi framework, we obtain the complete set of Hamiltonians, generalized brackets, fundamental differential, characteristic equations, and gauge transformations of the theory. In the Faddeev-Jackiw framework, a symplectic tensor is constructed from which the fundamental brackets are identified. The HJ and FJ brackets coincide, and from the symplectic tensor, the measure for the quantum path integral is calculated. The differences between the cases $\\lambda \\neq \\frac{1}{3}$ and $\\lambda = \\frac{1}{3}$ at the quantum path integral are discussed.", "url": "https://arxiv.org/abs/2609.32218", "type": "理论", "summary": "对线性化、不可投影 $\\lambda R$ 模型进行 Hamilton-Jacobi [HJ] 分析和 Faddeev-Jackiw [FJ] 量化，该模型由 Blas、Pujolàs 和 Sibiryakov 的最低阶项以及涉及 Cotton 张量平方的高阶项扩展。分析$\\lambda \\neq \\frac{1}{3}$ 和$\\lambda = \\frac{1}{3}$ 情况。在哈密尔顿-雅可比框架内，我们获得了理论的完整哈密顿量、广义括号、基本微分、特征方程和规范变换。在 Faddeev-Jackiw 框架中，构造了一个辛张量，并根据该张量确定了基本括号。 HJ 和 FJ 括号重合，并根据辛张量计算量子路径积分的度量。讨论了量子路径积分中 $\\lambda \\neq \\frac{1}{3}$ 和 $\\lambda = \\frac{1}{3}$ 情况之间的差异。", "authors": [{"name": "Diana Vanessa Castro-Luna"}, {"name": "Alberto Escalante"}], "featured_authors": [{"name": "Diana Vanessa Castro-Luna"}, {"name": "Alberto Escalante"}], "author_count": 2}, {"id": "2609.32442", "category": "math-ph", "title": "Absolute and relative invariants for low-dimensional topological insulators", "abstract": "[An extended abstract is provided in-text] Motivated by topological insulators, this paper analyzes classification schemes for projection-valued maps on $d$-dimensional tori, $d \\le 2$, subject to Altland-Zirnbauer-Cartan (AZC) symmetries (time-reversal, particle-hole, and chiral). The main objective is to compare three notions of equivalence for these maps: Murray-von Neumann, unitary, and homotopy equivalence. The analysis relies on constructing symmetric bases for the projection ranges under a pseudo-periodicity constraint, where select basis vectors pick up a phase when looped around the torus. If $d=1$, fully periodic symmetric bases exist across all AZC classes. If $d=2$, topological obstructions appear as non-trivial phases characterized by $\\mathbb{Z}$ (Chern number) or $\\mathbb{Z}_2$ (Fu-Kane-Mele) invariants. These serve as absolute invariants that classify both Murray-von Neumann and unitary equivalences. For homotopy equivalence, the behavior depends on the ambient Hilbert space: if this has non-minimal dimension, homotopy equivalence reduces directly to unitary equivalence, while in minimal ambient spaces additional relative homotopy invariants emerge. Their precise values change under unitary conjugation, leaving only relative topological phases between maps well-defined. Ultimately, this provides a unified geometric framework for gapped quantum systems in low dimensions, demonstrating how distinct equivalence relations generate specific absolute and relative topological invariants.", "url": "https://arxiv.org/abs/2609.32442", "type": "理论", "summary": "[文中提供了扩展摘要]受拓扑绝缘体的启发，本文分析了 $d$ 维环面、$d\\le 2$ 上的投影值映射的分类方案，并遵循 Altland-Zirnbauer-Cartan (AZC) 对称性（时间反转、粒子孔和手性）。主要目标是比较这些映射的三种等价概念：Murray-von Neumann、幺正和同伦等价。该分析依赖于在伪周期性约束下构建投影范围的对称基，其中选择的基向量在围绕环面循环时拾取相位。如果$d=1$，则所有 AZC 类都存在完全周期性对称基。如果$d=2$，拓扑障碍表现为非平凡相，其特征为$\\mathbb{Z}$（陈数）或$\\mathbb{Z}_2$（Fu-Kane-Mele）不变量。这些作为绝对不变量对默里-冯·诺依曼和酉等价进行分类。对于同伦等价，其行为取决于环境希尔伯特空间：如果其具有非最小维数，则同伦等价直接简化为酉等价，而在最小环境空间中会出现额外的相对同伦不变量。\n\n它们的精确值在酉共轭下发生变化，只留下地图之间明确定义的相对拓扑相位。最终，这为低维有隙量子系统提供了一个统一的几何框架，展示了不同的等价关系如何产生特定的绝对和相对拓扑不变量。", "authors": [{"name": "Federico Manzoni"}, {"name": "Domenico Monaco"}, {"name": "Gabriele Peluso"}], "featured_authors": [{"name": "Federico Manzoni"}, {"name": "Domenico Monaco"}, {"name": "Gabriele Peluso"}], "author_count": 3}, {"id": "2609.33084", "category": "math-ph", "title": "Poisson eigenvalue statistics and dynamical delocalization for fractional and long-range Anderson models", "abstract": "We study local eigenvalue statistics and dynamical (de)-localization properties for long-range Anderson models, including the fractional Anderson model. These systems are random Anderson-type perturbations of operators with long-range (non random) hopping terms of the form $|T(n,m)| \\sim \\|n-m\\|^{-(d+2\\beta)}$ for $\\beta>0$, on the $d$-dimensional lattice. In the presence of a strong enough random potential, these models exhibit dense pure point spectrum with polynomially decaying eigenvectors, almost surely. We show that in this strong disorder regime, and for $\\beta>d/2$, the local eigenvalue statistics centered at any $E$ in the deterministic spectrum is a Poisson point process with intensity given by the density of states function $n(E)$. Moreover, we prove that, at strong disorder, there is no dynamical localization for these models, verifying a conjecture of Disertori et al. We achieve this by establishing explicit, sharp lower bounds on the Green's functions fractional moments which imply that large moments of the position operator are infinite. Hence, these models exhibit Poisson eigenvalue statistics and dynamical delocalization, that is, the absence of dynamical localization. In particular, this shows that in dimension $d=1$, the fractional Anderson model, a random perturbation of the fractional Laplacian $(-\\Delta)^\\alpha$ with $\\alpha\\in (0,1)$, exhibits Poisson eigenvalue statistics and dynamical delocalization if the disorder is strong and the exponent $\\frac{1}{2}<\\alpha<1$. This is in stark contrast with what is known for the usual Anderson model that has only nearest-neighbor hopping.", "url": "https://arxiv.org/abs/2609.33084", "type": "理论", "summary": "我们研究远程安德森模型（包括分数安德森模型）的局部特征值统计和动态（去）局部化特性。这些系统是算子的随机安德森型扰动，具有 $|T(n,m)| 形式的长程（非随机）跳跃项。 \\sim \\|n-m\\|^{-(d+2\\beta)}$ 对于 $\\beta>0$，在 $d$ 维晶格上。在存在足够强的随机势的情况下，这些模型几乎可以肯定地表现出具有多项式衰减特征向量的密集纯点谱。我们证明，在这种强无序状态下，对于 $\\beta>d/2$，以确定性谱中任何 $E$ 为中心的局部特征值统计是一个泊松点过程，其强度由状态密度函数 $n(E)$ 给出。此外，我们证明，在强无序情况下，这些模型不存在动态定位，验证了 Disertori 等人的猜想。我们通过在格林函数分数矩上建立明确的、尖锐的下界来实现这一点，这意味着位置算子的大矩是无限的。\n\n因此，这些模型表现出泊松特征值统计和动态离域，即缺乏动态定位。特别是，这表明在维度 $d=1$ 中，分数式安德森模型（分数拉普拉斯 $(-\\Delta)^\\alpha$ 与 $\\alpha\\in (0,1)$ 的随机扰动），如果无序性很强并且指数 $\\frac{1}{2}<\\alpha<1$，则表现出泊松特征值统计和动态离域。这与仅具有最近邻跳跃的通常的安德森模型形成鲜明对比。"
