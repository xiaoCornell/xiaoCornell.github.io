, "authors": [{"name": "Peter D. Hislop"}, {"name": "Rodrigo Matos"}, {"name": "Constanza Rojas-Molina"}], "featured_authors": [{"name": "Peter D. Hislop"}, {"name": "Rodrigo Matos"}, {"name": "Constanza Rojas-Molina"}], "author_count": 3}, {"id": "2609.33498", "category": "math-ph", "title": "Minimal output entropy for the channels that add or remove a box of a Young diagram, and a Pauli principle for every permutation symmetry", "abstract": "Two irreducible representations of $U(d)$ whose Young diagrams differ by a single box are connected by four covariant quantum channels: the box can be removed or added, and one keeps either the new diagram or the box ($\\mathbb{C}^d$ or its dual). We prove that for each of these channels the output of a coherent state majorizes every other output, so that coherent states minimize the output entropy, and we compute the optimal output explicitly in terms of hook lengths. For the two channels that keep the box we also determine all minimizers; these need not be coherent, even when they are pure. As an application we consider $N$ particles with a given permutation symmetry and find sharp bounds on the spectrum of the reduced density matrix of a single particle, as well as the exact set of spectra that mixed states can reach (for fermions these are the Pauli principle and Coleman's theorem).", "url": "https://arxiv.org/abs/2609.33498", "type": "理论", "summary": "$U(d)$ 的两个不可约表示，其杨氏图仅由一个盒子不同，通过四个协变量子通道连接：盒子可以被删除或添加，一个保留新图或盒子（$\\mathbb{C}^d$ 或其对偶）。我们证明，对于每个通道，相干态的输出大于所有其他输出，因此相干态使输出熵最小化，并且我们根据钩长度显式计算最佳输出。对于保留盒子的两个通道，我们还确定所有最小化器；即使它们是纯粹的，它们也不必是连贯的。作为一个应用，我们考虑具有给定排列对称性的 $N$ 粒子，并在单个粒子的约化密度矩阵谱上找到锐界，以及混合态可以达到的精确谱集（对于费米子，这些是泡利原理和科尔曼定理）。", "authors": [{"name": "Robin Reuvers"}], "featured_authors": [{"name": "Robin Reuvers"}], "author_count": 1}, {"id": "2609.33576", "category": "math-ph", "title": "Effective atom-dimer bands of three-body lattice systems at strong coupling: exact critical mass ratios and a statistics-quasimomentum duality", "abstract": "We study three particles on the square lattice with contact interactions of infinite strength, for all total quasimomenta, for three statistics: three identical bosons, two identical fermions plus a third particle, and two identical bosons plus a third particle. Previous work treated only the trimer and zero quasimomentum. Here the atom-dimer sector is analyzed on the whole Brillouin zone. A Feshbach-Schur reduction onto the infinitely degenerate eigenvalue 1 of the pair-contact operator gives explicit effective Hamiltonians with proved first-order error. The threshold problem reduces to a 4x4 Hermitian matrix criterion built from the two-point resistances of the square lattice, and hence to a quartic polynomial. This yields the complete atom-dimer zone and the critical mass ratio on the Brillouin zone, with bound between 1 and pi/(pi-2), and closed forms at all symmetry points. We prove: the zones in closed form; the critical mass ratio with exact value pi/(pi-2) at zero quasimomentum, reproducing a numerical value; at most two atom-dimer states for every quasimomentum and mass ratio; the onset laws, an essential singularity on the zone boundary and a linear-over-logarithm onset in the pure p-wave; two exact dualities showing that a change of statistics is equivalent to a shift of quasimomentum by pi; and the global range of the second fermionic threshold. The onset laws admit a renormalization-group reading: the inverse lattice Green function is a marginal s-wave coupling, binding energies arise by dimensional transmutation with lattice scale 16, and the zone boundary is of marginal (BCS/Kondo) type rather than of Berezinskii-Kosterlitz-Thouless type. All constants are verified independently by lattice quadrature, computer algebra, exact diagonalisation, and infinite-lattice solvers.", "url": "https://arxiv.org/abs/2609.33576", "type": "理论", "summary": "我们研究了方晶格上具有无限强度接触相互作用的三个粒子，对于所有总准门，用于三个统计：三个相同的玻色子，两个相同的费米子加第三个粒子，以及两个相同的玻色子加第三个粒子。以前的工作仅处理三聚体和零准动量。这里对整个布里渊区的原子二聚体部分进行分析。对接触算子的无限简并特征值 1 的 Feshbach-Schur 约简给出了显式有效的哈密顿量，并证明了一阶误差。阈值问题简化为根据方晶格的两点电阻构建的 4x4 埃尔米特矩阵准则，从而简化为四次多项式。这产生了完整的原子二聚体区和布里渊区的临界质量比，其界限在 1 和 pi/(pi-2) 之间，并且在所有对称点处都有闭合形式。\n\n我们证明： 封闭形式的区域；准动量为零时具有精确值 pi/(pi-2) 的临界质量比，再现数值；对于每个准动量和质量比，至多有两个原子二聚体状态；起始定律、区域边界上的本质奇点和纯 p 波中的线性对数起始；两个精确的对偶性表明统计量的变化相当于准动量按 pi 的变化；以及第二费米子阈值的全局范围。起始定律允许重正化群解读：逆晶格格林函数是边缘 s 波耦合，结合能由晶格尺度 16 的维度嬗变产生，并且区域边界是边缘（BCS/Kondo）类型而不是 Berezinskii-Kosterlitz-Thouless 类型。所有常数均通过晶格求积、计算机代数、精确对角化和无限晶格求解器独立验证。", "authors": [{"name": "Mikhail V. Dolgopolov"}], "featured_authors": [{"name": "Mikhail V. Dolgopolov"}], "author_count": 1}, {"id": "2609.33660", "category": "math-ph", "title": "$p$-adic spectral zeta functions via the inverse Stieltjes transform", "abstract": "Spectral zeta functions provide a standard tool for regularizing determinants of differential operators in quantum physics. In a previous paper (J. Math. Phys. 66: 083505, 2025), we introduced a $p$-adic spectral zeta function for discrete spectra via a locally analytic interpolation function. In this paper we extend the framework to continuous spectra using the inverse Stieltjes transform. Starting from the resolvent of a bounded operator, we construct a generalized distribution, called the $p$-adic spectral distribution, and define bosonic and fermionic zeta functions and functional determinants. We establish their analytic properties, special value formulas, and Stirling expansions, and show that our previous framework is embedded into the present one in the discrete case. In this approach, the bosonic and fermionic cases exhibit an interesting symmetry. As an application, we consider the position operator in $p$-adic quantum mechanics on an arbitrary compact subset of $\\mathbb{C}_{p}$.", "url": "https://arxiv.org/abs/2609.33660", "type": "理论", "summary": "谱 zeta 函数为量子物理学中微分算子的行列式正则化提供了标准工具。在之前的论文 (J. Math. Phys. 66: 083505, 2025) 中，我们通过局部解析插值函数引入了用于离散光谱的 $p$-adic 光谱 zeta 函数。在本文中，我们使用 Stieltjes 逆变换将框架扩展到连续光谱。从有界算子的求解开始，我们构造了一个广义分布，称为 $p$-adic 谱分布，并定义了玻色子和费米子 zeta 函数和函数行列式。我们建立了它们的解析性质、特殊值公式和斯特林展开式，并表明我们之前的框架已嵌入到离散情况下的当前框架中。在这种方法中，玻色子和费米子情况表现出有趣的对称性。作为一个应用，我们考虑 $p$-adic 量子力学中 $\\mathbb{C}_{p}$ 的任意紧凑子集上的位置算子。", "authors": [{"name": "Su Hu"}, {"name": "Min-Soo Kim"}], "featured_authors": [{"name": "Su Hu"}, {"name": "Min-Soo Kim"}], "author_count": 2}, {"id": "2609.33907", "category": "math-ph", "title": "Homogenized graphs with spectrally embedded defect states", "abstract": "By homogenizing high-contrast periodic metric graphs, we create continuous media that admit bound states produced by local defects at energies embedded in the continuous spectrum. This is achieved by fitting two copies of a lattice graph simultaneously into space and coupling them by connecting edges. The homogenization of an ODE on a graph to a PDE in space is achieved by representing the associated operators in a common functional space through interpolation by Fourier analysis. The two coupled graphs result in an effective medium with internal degrees of freedom that allow a decomposition into two orthogonal spaces of hybrid states. Critical high contrast retains microscopic resonances in the effective medium and allows a spectral band of one hybrid state space to overlap a spectral gap of the other. This serves as the mechanism for creating bound states at frequencies embedded in the continuous spectrum of the effective medium. These bound states in the continuum persist for $\\varepsilon$-scale metric graphs due to $O(\\varepsilon)$ operator-norm estimates for reduced resolvents on the defect region.", "url": "https://arxiv.org/abs/2609.33907", "type": "理论", "summary": "通过均匀化高对比度周期度量图，我们创建了连续介质，该介质允许由嵌入连续光谱中的能量的局部缺陷产生的束缚态。这是通过将点阵图的两个副本同时拟合到空间中并通过连接边将它们耦合来实现的。图上的 ODE 到空间中的 PDE 的同质化是通过傅里叶分析插值在公共函数空间中表示相关算子来实现的。这两个耦合图产生了具有内部自由度的有效介质，允许分解为混合状态的两个正交空间。临界高对比度保留了有效介质中的微观共振，并允许一个混合态空间的光谱带与另一个混合态空间的光谱间隙重叠。这是在有效介质的连续频谱中嵌入的频率上创建束缚态的机制。由于缺陷区域上减少的解析的 $O(\\varepsilon)$ 算子范数估计，连续体中的这些束缚态在 $\\varepsilon$ 规模的度量图中持续存在。", "authors": [{"name": "Kirill D. Cherednichenko"}, {"name": "Stephen P. Shipman"}], "featured_authors": [{"name": "Kirill D. Cherednichenko"}, {"name": "Stephen P. Shipman"}], "author_count": 2}, {"id": "2609.34119", "category": "math-ph", "title": "The equivalence of topological indices for $\\mathrm{U}(1)\\rtimes\\mathbb{Z}_2$-symmetric quantum spin chains", "abstract": "Symmetry-protected topological (SPT) phases in quantum spin chains are distinguished by topological indices. Ogata's operator-algebraic indices apply to a broad range of symmetry classes without requiring continuous symmetry, whereas the elementary twist index of Tasaki requires $\\mathrm{U}(1)$ symmetry. We prove their equivalence in the common setting of integer-spin chains with on-site $\\mathrm{U}(1)\\rtimes\\mathbb{Z}_2$ symmetry and a symmetric locally-unique gapped ground state, without assuming translation invariance or a matrix product representation. A charge-fluctuation estimate yields a strong-limit construction of half-chain rotations with their phases fixed. An exact group commutator identity then identifies the Ogata index with the limit of local twist expectations and gives an explicit error bound. This provides a computable formula when a lower bound on the gap and the relevant ground-state expectations are available. As an application, a previous twist-index calculation determines the Ogata index to be $(-1)^S$ for the antiferromagnetic Heisenberg chain under explicit uniqueness and boundary-field gap assumptions. The author formulated the problem and proposed the basic strategy, while ChatGPT made substantial contributions to the development of the proof.", "url": "https://arxiv.org/abs/2609.34119", "type": "理论", "summary": "量子自旋链中的对称保护拓扑（SPT）相通过拓扑指数来区分。 Ogata 的算子代数指数适用于广泛的对称类，而不需要连续对称性，而 Tasaki 的基本扭曲指数则需要 $\\mathrm{U}(1)$ 对称性。我们证明了它们在具有现场 $\\mathrm{U}(1)\\rtimes\\mathbb{Z}_2$ 对称性和对称局部唯一带隙基态的整数自旋链的常见设置中的等价性，而不假设平移不变性或矩阵乘积表示。电荷波动估计产生了相位固定的半链旋转的强极限结构。然后，精确的群换向器恒等式将 Ogata 索引与局部扭曲期望的限制一起识别，并给出明确的误差界限。当间隙下限和相关基态期望可用时，这提供了一个可计算的公式。作为一个应用，在明确的唯一性和边界场间隙假设下，先前的扭曲指数计算确定反铁磁海森堡链的 Ogata 指数为 $(-1)^S$。\n\n作者阐述了问题并提出了基本策略，而ChatGPT则为证明的发展做出了实质性贡献。", "authors": [{"name": "Hal Tasaki"}], "featured_authors": [{"name": "Hal Tasaki"}], "author_count": 1}, {"id": "2609.34402", "category": "math-ph", "title": "Discontinuity of Continuum Fermion Dynamics", "abstract": "We study the Heisenberg dynamics of continuum fermions in $\\IR^d$ interacting through a pair potential. For a large class of nonconstant pair potentials and under suitable assumptions on the dispersion relation and external potential, we prove that the dynamics fails to be pointwise-norm continuous even on the gauge-invariant CAR algebra. An automatic-continuity argument then shows that neither the CAR algebra nor its gauge-invariant subalgebra is invariant under the dynamics, with non-invariance occurring for almost all times.", "url": "https://arxiv.org/abs/2609.34402", "type": "理论", "summary": "我们研究 $\\IR^d$ 中通过一对势相互作用的连续谱费米子的海森堡动力学。对于一大类非常数对势，在色散关系和外部势的适当假设下，我们证明即使在规范不变的 CAR 代数上，动力学也不能是点范数连续的。自动连续性论证表明，CAR 代数及其规范不变子代数在动力学下都不是不变的，几乎所有时间都存在非不变性。", "authors": [{"name": "Oliver Siebert"}], "featured_authors": [{"name": "Oliver Siebert"}], "author_count": 1}, {"id": "2609.34533", "category": "math-ph", "title": "Classical BV Pushforward", "abstract": "We define the classical BV pushforward and establish its two main properties. First, we prove that it maps solutions of the classical master equation (CME) on the total space to solutions of the CME on the smaller space. Second, we prove that, for isolated critical points, it maps BV canonically equivalent solutions to BV canonically equivalent solutions. We illustrate the construction with examples and discuss its applications.", "url": "https://arxiv.org/abs/2609.34533", "type": "理论", "summary": "我们定义了经典的 BV 前推并建立了它的两个主要属性。首先，我们证明它将经典主方程（CME）在整个空间上的解映射到较小空间​​上的 CME 解。其次，我们证明，对于孤立的临界点，它将 BV 规范等效解映射到 BV 规范等效解。我们用例子来说明这个结构并讨论它的应用。", "authors": [{"name": "Xin Geng"}, {"name": "Andrey Losev"}, {"name": "Vyacheslav Lysov"}], "featured_authors": [{"name": "Xin Geng"}, {"name": "Andrey Losev"}, {"name": "Vyacheslav Lysov"}], "author_count": 3}, {"id": "2609.34721", "category": "math-ph", "title": "Scattering Measures and Information Geometry", "abstract": "We formulate scattering experiments in terms of parameterized finite measures on outcome spaces and develop the associated information geometry defined by the Fisher metric. The decomposition of a scattering measure into total mass and normalized shape separates Fisher information into contributions from changes in overall scattering strength and redistribution among outcomes. Measurement processes are represented by probability or sub-probability kernels acting on the scattering measure. Such kernels contract Fisher information, placing a broad class of experimental operations within a common information-theoretic framework. This formulation connects scattering experiments to the theory of optimal experimental design through the Fisher geometry of scattering measures. The same finite-measure structure arises naturally in quantum measurements with incomplete detection, clarifying its place in the hierarchy from quantum measurement to classical outcome statistics.", "url": "https://arxiv.org/abs/2609.34721", "type": "理论", "summary": "我们根据结果空间的参数化有限测量来制定散射实验，并开发由费舍尔度量定义的相关信息几何。将散射测量分解为总质量和归一化形状，将费舍尔信息分为总体散射强度变化和结果之间重新分布的贡献。测量过程由作用于散射测量的概率或子概率核表示。这样的内核收缩费舍尔信息，将广泛的实验操作置于一个共同的信息理论框架内。该公式通过散射测量的费希尔几何将散射实验与最佳实验设计理论联系起来。同样的有限测量结构自然出现在不完全检测的量子测量中，澄清了它在从量子测量到经典结果统计的层次结构中的位置。", "authors": [{"name": "Tatsuro Oda"}], "featured_authors": [{"name": "Tatsuro Oda"}], "author_count": 1}, {"id": "2609.34766", "category": "math-ph", "title": "Notes on Magnetostatic Interactions in $\\mathbb R^3$", "abstract": "A compact formulation of magnetostatics is presented. Without using constitutive relations, including the aether relations, an expression is proposed for the potential energy of a region carrying a distribution of magnetic dipoles under a vector potential field, where the dipole distribution is specified by a current density potential field. Assuming that during a virtual motion of the dipole distribution the virtual work expended by the field is equal to minus the time derivative of the potential energy, an expression for the mechanical force functional is derived. In addition to the Lorentz and Kelvin force densities, the force functional contains an asymmetric active stress field, the skew-symmetric part of which is the mechanical couple density, and a pressure term.", "url": "https://arxiv.org/abs/2609.34766", "type": "理论", "summary": "提出了静磁学的紧凑公式。在不使用包括以太关系在内的本构关系的情况下，提出了在矢量势场下携带磁偶极子分布的区域的势能表达式，其中偶极子分布由电流密度势场指定。假设在偶极分布的虚运动期间，场消耗的​​虚功等于减去势能的时间导数，则导出机械力泛函的表达式。除了洛伦兹力密度和开尔文力密度之外，力泛函还包含不对称主动应力场，其斜对称部分是机械偶密度和压力项。", "authors": [{"name": "Vladimir Gol'dshtein"}, {"name": "Wolfgang H. Müller"}, {"name": "Reuven Segev"}], "featured_authors": [{"name": "Vladimir Gol'dshtein"}, {"name": "Wolfgang H. Müller"}, {"name": "Reuven Segev"}], "author_count": 3}, {"id": "2609.34980", "category": "math-ph", "title": "A renormalized Lee Model: resolvent and spectral analysis", "abstract": "We construct and analyze a renormalized three-dimensional massive Lee model; its renormalized Hamiltonian is defined intrinsically through an abstract construction which explicitly provides the operator domain, action and a Kre\\uın-like resolvent formula. Conservation of the total excitation number reduces the spectral analysis of the full Hamiltonian to a sector-wise study of the spectral profile of an explicit operator pencil, playing the role of an operator-valued Weyl function. We construct essential spectrum components in a sector generated by lower excitation sectors and obtain the inclusion in the expected sector-wise HVZ type formula; the full formula is proved in the first two sectors and, under explicit conditions, in every sector. Below the free or one-excitation threshold, the point spectrum in every higher sector is described by a bounded self-adjoint nonnegative Birman--Schwinger operator. In every sector with at least two excitations we prove absence of sub-threshold spectrum for arbitrary coupling when the renormalized gap is not smaller than the boson mass, and under an explicit weak-coupling condition when it is smaller. In the latter case we also derive a sufficient condition for the existence of a simple bound state in the two-excitation sector.", "url": "https://arxiv.org/abs/2609.34980", "type": "理论", "summary": "我们构建并分析了重正化三维大规模 Lee 模型；它的重正化哈密顿量本质上是通过抽象构造来定义的，该抽象构造显式地提供了算子域、动作和类似 Kre\\uın 的解析公式。总激发数守恒将完整哈密顿量的谱分析简化为显式算子铅笔的谱剖面的扇区研究，扮演算子值 Weyl 函数的角色。我们在由较低激励扇区生成的扇区中构造基本频谱分量，并将其包含在预期的扇区 HVZ 类型公式中；完整的公式在前两个部分得到证明，并且在明确的条件下，在每个部分得到证明。在自由或单激励阈值以下，每个较高扇区中的点谱由有界自伴非负 Birman-Schwinger 算子描述。在每个具有至少两个激励的扇区中，当重正化间隙不小于玻色子质量时，以及当它更小时，在显式弱耦合条件下，我们证明不存在任意耦合的亚阈值谱。\n\n在后一种情况下，我们还推导了双激发扇区中存在简单束缚态的充分条件。", "authors": [{"name": "Claudio Cacciapuoti"}, {"name": "Federica Muscolino"}, {"name": "Diego Noja"}, {"name": "Andrea Posilicano"}], "featured_authors": [{"name": "Claudio Cacciapuoti"}, {"name": "Federica Muscolino"}, {"name": "Diego Noja"}, {"name": "Andrea Posilicano"}], "author_count": 4}, {"id": "2609.35006", "category": "math-ph", "title": "GR-FM: Geometrically Regularized Flow Matching for SDF-Based Medical Image Segmentation", "abstract": "Medical image segmentation remains challenging in terms of accurate boundary localization and complex-structure preservation, as target regions often exhibit weak boundaries, fine-grained structures, and irregular shapes, while high-quality images and precise annotations are usually limited. Existing generative segmentation approaches based on Flow Matching mainly learn velocity fields in the state space but lack explicit constraints on the spatial regularity and distance-field properties of the recovered representation. This limitation may lead to spatial oscillations, boundary displacement, and discontinuities in fine structures. To address these issues, we propose an image-conditioned Geometrically Regularized Flow Matching framework, termed GR-FM, which formulates segmentation as a continuous probability transport process from an initial distribution to a target implicit representation distribution. Instead of directly modeling binary masks, GR-FM adopts the SDF to describe the target structure, where each pixel is represented by its signed distance to the object boundary, resulting in a continuous geometric field. Flow Matching and ordinary differential equations are then employed to achieve deterministic and efficient distribution transport. The training objective further incorporates a biharmonic regularization term and an Eikonal constraint to enhance the spatial smoothness, structural consistency, and distance-field characteristics of the recovered representation. Moreover, we analyze the continuous transport process under geometric constraints and investigate the evolution of the zero level set. Experiments conducted on the MoNuSeg, GlaS, and DRIVE datasets demonstrate that GR-FM achieves competitive performance in both region overlap and boundary accuracy, reduces performance variation, and maintains stable segmentation results with only a small number of integration steps.", "url": "https://arxiv.org/abs/2609.35006", "type": "理论", "summary": "医学图像分割在精确的边界定位和复杂结构保存方面仍然具有挑战性，因为目标区域通常表现出弱边界、细粒度结构和不规则形状，而高质量图像和精确注释通常受到限制。现有的基于流匹配的生成分割方法主要学习状态空间中的速度场，但缺乏对恢复表示的空间规律性和距离场属性的明确约束。这种限制可能导致空间振荡、边界位移和精细结构的不连续性。为了解决这些问题，我们提出了一种图像条件几何正则化流匹配框架，称为 GR-FM，它将分割制定为从初始分布到目标隐式表示分布的连续概率传输过程。 GR-FM不是直接建模二值掩模，而是采用SDF来描述目标结构，其中每个像素由其到目标边界的有符号距离表示，从而产生连续的几何场。\n\n然后采用流量匹配和常微分方程来实现确定性和高效的分配运输。训练目标进一步结合了双调和正则化项和 Eikonal 约束，以增强恢复表示的空间平滑度、结构一致性和距离场特征。此外，我们分析了几何约束下的连续传输过程并研究了零水平集的演化。在 MoNuSeg、GlaS 和 DRIVE 数据集上进行的实验表明，GR-FM 在区域重叠和边界精度方面都实现了有竞争力的性能，减少了性能变化，并仅通过少量的集成步骤即可保持稳定的分割结果。", "authors": [{"name": "Yuxin Ai"}, {"name": "Zhichang Guo"}, {"name": "Fanghui Song"}, {"name": "Dazhi Zhang"}], "featured_authors": [{"name": "Yuxin Ai"}, {"name": "Zhichang Guo"}, {"name": "Fanghui Song"}, {"name": "Dazhi Zhang"}], "author_count": 4}, {"id": "2609.31841", "category": "quant-ph", "title": "A Universal Budget for Entanglement and Nonlocal Non-Stabilizerness", "abstract": "Entanglement and nonlocal non-stabilizerness are distinct quantum resources encoded in the Schmidt spectrum of a bipartite pure state. For qubit systems, we establish a universal quadratic constraint on their simultaneous allocation, governed by the minimum number of logical qubits required on each side to encode the occupied Schmidt support. Additional spectral constraints reveal a strong asymmetry in their allocation with the Entanglement that can exhaust the logical capacity, whereas the maximal nonlocal non-stabilizerness grows only logarithmically with it. For a tensor-network cut crossed by a single separating virtual edge, the logical capacity is determined by the occupied bond dimension. We further derive a one-sided certificate for the resources of the untruncated state from a retained Schmidt spectrum and its discarded weight. For small discarded weight, the resulting corrections are linear in that weight. These results connect a universal resource budget to resource-aware control of tensor-network truncations.", "url": "https://arxiv.org/abs/2609.31841", "type": "理论+数值", "summary": "纠缠和非局域非稳定剂是编码在二分纯态施密特谱中的不同量子资源。对于量子位系统，我们对其同时分配建立了通用二次约束，该约束由每侧编码占用的施密特支持所需的逻辑量子位的最小数量控制。额外的谱约束揭示了它们与纠缠的分配的强烈不对称性，这可能会耗尽逻辑容量，而最大非局部非稳定器仅随其呈对数增长。对于由单个分离虚拟边交叉的张量网络切割，逻辑容量由占用的键维数决定。我们进一步从保留的施密特谱及其丢弃的权重中得出未截断态资源的单方面证明。对于较小的丢弃重量，所得校正与该重量呈线性关系。这些结果将通用资源预算与张量网络截断的资源感知控制联系起来。", "authors": [{"name": "Salvatore Marco Giampaolo"}], "featured_authors": [{"name": "Salvatore Marco Giampaolo"}], "author_count": 1}, {"id": "2609.31853", "category": "quant-ph", "title": "Quantum Fisher Information as the Speed Limit for Multipartite Entanglement", "abstract": "We derive a universal upper bound on the speed of multipartite entanglement generation. For arbitrary differentiable pure multipartite states undergoing parameter-dependent evolution, we prove that the rate of change of generalized concurrence is bounded by the square root of the quantum Fisher information (QFI). The proof follows directly from the symmetric logarithmic derivative formalism, revealing the bound as a consequence of quantum estimation theory, while a complementary Schmidt-spectrum analysis identifies the conditions for saturation and yields a tighter bound for rank-two bipartitions. We illustrate these results in interacting many-body spin models and investigate their behavior across the quantum phase transition of the transverse-field Ising model. At the critical point, we find that the QFI can be strongly enhanced while the generalized concurrence is nearly stationary and its sensitivity to the coupling is suppressed. This demonstrates that the enhanced parameter sensitivity associated with quantum criticality need not arise from rapid changes in the magnitude of multipartite entanglement.", "url": "https://arxiv.org/abs/2609.31853", "type": "理论", "summary": "我们推导出多部分纠缠生成速度的通用上限。对于经历参数相关演化的任意可微的纯多部分态，我们证明广义并发的变化率受量子费希尔信息（QFI）的平方根的限制。证明直接来自对称对数导数形式主义，揭示了作为量子估计理论结果的界限，而互补的施密特谱分析确定了饱和条件并产生了二阶二分的更严格的界限。我们在相互作用的多体自旋模型中说明了这些结果，并研究了它们在横向场伊辛模型的量子相变中的行为。在临界点，我们发现 QFI 可以得到强烈增强，而广义并发几乎是平稳的，并且其对耦合的敏感性被抑制。这表明与量子临界性相关的参数敏感性的增强不一定是由多部分纠缠程度的快速变化引起的。", "authors": [{"name": "Zain H. Saleem"}, {"name": "Da-Wei Luo"}, {"name": "Anjala M. Babu"}, {"name": "Ting Yu"}, {"name": "Stephen K. Gray"}, {"name": "Anil Shaji"}], "featured_authors": [{"name": "Zain H. Saleem"}, {"name": "Da-Wei Luo"}, {"name": "Anjala M. Babu"}, {"name": "Ting Yu"}, {"name": "Stephen K. Gray"}, {"name": "Anil Shaji"}], "author_count": 6}, {"id": "2609.31863", "category": "quant-ph", "title": "Indefinite causal order with output-signalling instruments", "abstract": "Quantum processes can exhibit indefinite causal order, allowing coherent superpositions of distinct orderings of events. Whether such processes generate genuinely noncausal statistics, however, depends not only on their global causal structure but also on the local operations available to the parties. Here, we restrict communication to the classical outcomes of local operations, yielding a causal polytope with new causal inequalities that can be violated using measure-and-reprepare, entanglement-breaking instruments requiring no coherent transmission through the laboratories. Using a semidefinite-programming framework, we bound the achievable violations and reveal noncausal correlations that satisfy all conventional input-signalling inequalities, demonstrating that restricting the information available for communication can uncover forms of indefinite causal order inaccessible under less restrictive operational assumptions.", "url": "https://arxiv.org/abs/2609.31863", "type": "理论", "summary": "量子过程可以表现出不确定的因果顺序，从而允许不同事件顺序的相干叠加。然而，这些过程是否产生真正的非因果统计数据不仅取决于其全球因果结构，还取决于各方可用的本地操作。在这里，我们将通信限制在本地操作的经典结果上，从而产生具有新因果不平等的因果多面体，这些不平等可以使用不需要通过实验室进行相干传输的测量和重新准备、纠缠破坏仪器来违反。使用半定编程框架，我们限制了可实现的违规行为，并揭示了满足所有传统输入信号不等式的非因果相关性，证明限制可用于通信的信息可以揭示在限制较少的操作假设下无法访问的不确定因果顺序的形式。", "authors": [{"name": "Ricardo Silveira"}, {"name": "Patrick Andriolo"}, {"name": "Davide Poderini"}, {"name": "Dmitry Melnikov"}, {"name": "Rafael Chaves"}], "featured_authors": [{"name": "Ricardo Silveira"}, {"name": "Patrick Andriolo"}, {"name": "Davide Poderini"}, {"name": "Dmitry Melnikov"}, {"name": "Rafael Chaves"}], "author_count": 5}, {"id": "2609.31889", "category": "quant-ph", "title": "Scattering amplitudes from quantum hardware a la RESOs", "abstract": "We report the first quantum-hardware implementation of Real-time Estimators for Scattering Observables (RESOs). The physical model is a one-dimensional lattice theory of non-relativistic spin-1/2 fermions with a single contact interaction. The lattice sizes studied are up to $N_x=54$ lattice sites and up to $20$ time steps. Spacetime correlation functions were computed on IBM's quantum computers, using $109$ qubits with $10,806$ CZ gates applied, reaching a two-qubit gate depth of $246$. We demonstrate how to study bound states and extract scattering amplitudes from these correlation functions.", "url": "https://arxiv.org/abs/2609.31889", "type": "理论+数值", "summary": "我们报告了散射可观测量实时估计器（RESO）的第一个量子硬件实现。物理模型是具有单接触相互作用的非相对论自旋 1/2 费米子的一维晶格理论。研究的晶格尺寸高达 $N_x=54$ 晶格位点和高达 $20$ 时间步长。时空相关函数是在 IBM 的量子计算机上计算的，使用 109 美元的量子位和 10,806 美元的 CZ 门，达到了 246 美元的两个量子位门深度。我们演示了如何研究束缚态并从这些相关函数中提取散射幅度。", "authors": [{"name": "Raul A Briceno"}, {"name": "Ivan M Burbano"}, {"name": "Anthony N Ciavarella"}, {"name": "Ermal Rrapaj"}, {"name": "Thomas R Richardson"}, {"name": "Andre Walker-Loud"}], "featured_authors": [{"name": "Raul A Briceno"}, {"name": "Ivan M Burbano"}, {"name": "Anthony N Ciavarella"}, {"name": "Ermal Rrapaj"}, {"name": "Thomas R Richardson"}, {"name": "Andre Walker-Loud"}], "author_count": 6}, {"id": "2609.31902", "category": "quant-ph", "title": "Quantum Encoding Agents: A Natural Language Interface for Data Embedding Strategy Selection in Quantum Machine Learning", "abstract": "Selecting a data encoding is a central and poorly tooled decision in quantum machine learning. The feature map fixes the geometry of the Hilbert space, the expressibility of quantum kernels, and whether the circuit can run on near-term hardware. This paper presents Quantum Encoding Agents, an open-source system that turns encoding selection into a natural-language interaction. Given a dataset and an optional task description, it profiles the data, applies a hardware-aware policy using the gate-error threshold p* approximately 10^{-3}, returns a copyable Qiskit circuit with a justification in Portuguese or English, and scores the quantum kernel by Kernel-Target Alignment (KTA). When a numerical matrix is available, it estimates the correlation fractal dimension D_2 and selects original columns with FD-ASE, using q* = max(2, ceil(D_2)) as a qubit budget so that angle and IQP maps are not proposed at a width where the fidelity kernel has collapsed. The service implements seven encoding families: amplitude, angle, dense angle, IQP, basis, data re-uploading, and custom feature map. On benchmark datasets, KTA separates these encodings under realistic NISQ constraints.", "url": "https://arxiv.org/abs/2609.31902", "type": "理论+数值", "summary": "选择数据编码是量子机器学习中一个核心且工具不足的决策。特征图修复了希尔伯特空间的几何形状、量子内核的可表达性以及电路是否可以在近期硬件上运行。本文介绍了量子编码代理，这是一个将编码选择转变为自然语言交互的开源系统。给定数据集和可选任务描述，它会分析数据，使用大约 10^{-3} 的门错误阈值 p* 应用硬件感知策略，返回带有葡萄牙语或英语理由的可复制 Qiskit 电路，并通过内核目标对齐 (KTA) 对量子内核进行评分。当数值矩阵可用时，它估计相关分形维数 D_2 并使用 FD-ASE 选择原始列，使用 q* = max(2, ceil(D_2)) 作为量子位预算，以便在保真度内核崩溃的宽度处不会提出角度和 IQP 映射。该服务实现了七个编码系列：幅度、角度、密集角度、IQP、基础、数据重新上传和自定义特征图。在基准数据集上，KTA 在实际 NISQ 约束下分离这些编码。", "authors": [{"name": "Ana Paula Appel"}], "featured_authors": [{"name": "Ana Paula Appel"}], "author_count": 1}, {"id": "2609.31913", "category": "quant-ph", "title": "Gate Synthesis in Dephasing-Limited Nitrogen-Vacancy Ensembles", "abstract": "Ensemble nitrogen-vacancy (NV) centers are widely used for quantum sensing and magnetometry, where performance depends on the accurate implementation of microwave pulse sequences. In these systems, inhomogeneous broadening and short coherence times limit reliable multi-pulse control, while hardware imperfections and off-resonant excitation distort implemented rotations, making direct calibration of arbitrary gates tedious. To address this, we implement a control framework with a ZXZXZ gate decomposition which uses fixed-angle, phase-parameterized pulses, enabling universal single-qubit control from a single calibrated $ \\pi/2$ primitive ($X_{\\pi/2}$) along with virtual Z operations. We compare a standard pulse with a composite pulse designed for high-power operation in a regime where the Rabi frequency is comparable to the hyperfine splitting, leading to non-uniform evolution across hyperfine levels. Using pre-determined combinations of $\\pi/2$ pulse sequences, we observe that standard pulses rapidly deviate from ideal behavior under repeated application, while the composite pulse suppresses this error accumulation by more than 70$\\%$ for longer sequences despite its longer duration. In contrast, randomized benchmarking yields similar decay factors for both implementations, highlighting its limited sensitivity to coherent control errors. These results establish a practical route to robust control in short-coherence ensemble systems and emphasize the importance of pulse-level characterization.", "url": "https://arxiv.org/abs/2609.31913", "type": "理论", "summary": "系综氮空位（NV）中心广泛用于量子传感和磁力测量，其性能取决于微波脉冲序列的准确实现。在这些系统中，不均匀的展宽和短相干时间限制了可靠的多脉冲控制，而硬件缺陷和非谐振激励扭曲了所实现的旋转，使得任意门的直接校准变得繁琐。为了解决这个问题，我们实现了一个具有 ZXZXZ 门分解的控制框架，该框架使用固定角度、相位参数化脉冲，从而能够从单个校准的 $ \\pi/2$ 原语 ($X_{\\pi/2}$) 以及虚拟 Z 操作进行通用单量子位控制。我们将标准脉冲与设计用于高功率操作的复合脉冲进行比较，其中拉比频率与超精细分裂相当，导致超精细水平上的不均匀演化。\n\n使用 $\\pi/2$ 脉冲序列的预定组合，我们观察到标准脉冲在重复应用下会迅速偏离理想行为，而复合脉冲尽管持续时间较长，但对于较长序列，可将这种误差累积抑制超过 70$\\%$。相比之下，随机基准测试对于两种实现都产生相似的衰减因子，突出了其对相干控制误差的有限敏感性。这些结果建立了短相干系综系统鲁棒控制的实用途径，并强调了脉冲电平表征的重要性。", "authors": [{"name": "Ankita Chakravarty"}, {"name": "Arnaud Carignan-Dugas"}, {"name": "Eva Dupont-Ferrier"}, {"name": "Yves Bérubé-Lauzière"}], "featured_authors": [{"name": "Ankita Chakravarty"}, {"name": "Arnaud Carignan-Dugas"}, {"name": "Eva Dupont-Ferrier"}, {"name": "Yves Bérubé-Lauzière"}], "author_count": 4}, {"id": "2609.31977", "category": "quant-ph", "title": "Learning Trotter Orderings for Heisenberg Hamiltonians with a Ranking Transformer", "abstract": "Trotterization approximates quantum time evolution by sequentially applying Hamiltonian terms. Because noncommuting terms introduce ordering-dependent errors, selecting an optimal term ordering is a combinatorial problem over a factorial search space. Prior approaches rely on fixed heuristics or on selection among predefined structured orderings, both of which require simulating candidates before choosing among them. For 1D and 2D Heisenberg-style Hamiltonians, we instead learn the ordering directly with a physics-aware ranking transformer that assigns a scalar score to each Hamiltonian term and predicts an ordering by sorting these scores. Physical structure enters through commutator-biased attention and an anticommutation-weighted ranking loss, and the models are trained on simulated-annealing (SA) reference orderings. We train separate models for first- and second-order Trotterization, each jointly on chains up to 14 qubits and lattices up to 12 qubits, and evaluate them on unseen chains with 16-20 qubits and lattices with 16 and 20 qubits. Predicted orderings are evaluated by the median gap in simulation fidelity to the SA reference. At first order, the model reaches a pooled gap below 10^-4 on chains, 0.0144 and 0.0088 on triangular lattices, and 0.0948 and 0.0823 on rectangular lattices at 16 and 20 qubits; at second order, the gaps are 0.0114, 0.0364 and 0.0244, and 0.1348 and 0.1239. The prediction exceeds the SA reference on 34% of first-order and 8% of second-order chain instances and can match its fidelity even when the two sequences differ because commuting terms may be rearranged without changing the Trotter unitary. The learned models generalize to larger systems across all three geometries, performing best on chains and triangular lattices, and produce an ordering in one forward pass without candidate enumeration, simulated annealing, or fidelity evaluation.", "url": "https://arxiv.org/abs/2609.31977", "type": "理论+数值", "summary": "Trotterization 通过顺序应用哈密顿项来近似量子时间演化。由于非交换项会引入与排序相关的错误，因此选择最佳项排序是阶乘搜索空间上的组合问题。先前的方法依赖于固定启发法或在预定义的结构化排序中进行选择，这两种方法都需要在选择候选者之前模拟候选者。对于一维和二维海森堡式哈密顿量，我们直接使用物理感知排序转换器来学习排序，该转换器为每个哈密顿量项分配标量分数，并通过对这些分数进行排序来预测排序。物理结构通过换向器偏向注意力和反换向加权排名损失进入，并且模型在模拟退火（SA）参考排序上进行训练。我们为一阶和二阶 Trotterization 训练单独的模型，每个模型在最多 14 个量子位的链和最多 12 个量子位的晶格上联合训练，并在具有 16-20 个量子位的看不见的链和具有 16 和 20 个量子位的晶格上评估它们。预测的排序是通过模拟保真度与 SA 参考的中值差距来评估的。\n\n在一阶，模型在 16 和 20 个量子位上达到链上低于 10^-4 的池化间隙，在三角形晶格上达到 0.0144 和 0.0088，在矩形晶格上达到 0.0948 和 0.0823；在二阶上，间隙为 0.0114、0.0364 和 0.0244，以及 0.1348 和 0.1239。该预测在 34% 的一阶链实例和 8% 的二阶链实例上超过了 SA 参考，并且即使两个序列不同，也可以匹配其保真度，因为通勤条件可以在不改变 Trotter 酉的情况下重新排列。学习到的模型可推广到跨越所有三种几何形状的更大系统，在链和三角晶格上表现最佳，并在一次前向传递中产生排序，无需候选枚举、模拟退火或保真度评估。", "authors": [{"name": "Shamminuj Aktar"}, {"name": "Reuben Tate"}, {"name": "Stephan Eidenbenz"}], "featured_authors": [{"name": "Shamminuj Aktar"}, {"name": "Reuben Tate"}, {"name": "Stephan Eidenbenz"}], "author_count": 3}, {"id": "2609.32025", "category": "quant-ph", "title": "Nonstabilizerness of the entangling layer in quantum circuit Born machines", "abstract": "The entangling layer of a quantum circuit Born machine can supply both entanglement and nonstabilizerness. In this work we show that the entangling layer can be a Clifford circuit, which supplies no nonstabilizerness. We use an architecture in which a fixed, non-trainable entangler is reused in every layer and only single-qubit rotations are optimized. There, a Clifford entangler reaches the same Kullback--Leibler divergence as a near-Haar one at sufficient circuit depth, and entanglers spanning zero to Haar-typical nonstabilizerness reach the same loss, up to a small offset for a free-fermion matchgate entangler. A doping control that raises the entangler's nonstabilizerness while leaving the entangling power of every gate unchanged leaves the loss flat. With a Clifford entangler the nonstabilizerness of the trained state comes entirely from the rotations, which take the trained circuit outside the stabilizer formalism. We also show that, among all pure states whose Born distribution is a given target, the one whose amplitudes are the positive square roots of the probabilities has the smallest stabilizer Rényi entropy, so this minimum can be computed without training.", "url": "https://arxiv.org/abs/2609.32025", "type": "理论+数值", "summary": "量子电路玻恩机的纠缠层可以提供纠缠和非稳定化。在这项工作中，我们证明纠缠层可以是克利福德电路，它不提供非稳定器。我们使用的架构中，每个层都重复使用固定的、不可训练的纠缠器，并且仅优化单量子位旋转。在那里，克利福德纠缠器在足够的电路深度下达到与近哈尔纠缠器相同的库尔贝克-莱布勒散度，并且跨越零到哈尔典型非稳定器的纠缠器达到相同的损耗，直到自由费米子匹配门纠缠器的小偏移。掺杂控制可以提高纠缠器的非稳定性，同时保持每个门的纠缠能力不变，从而使损耗保持平稳。对于 Clifford 纠缠器，训练状态的非稳定性完全来自于旋转，这将训练电路置于稳定器形式体系之外。我们还表明，在所有以 Born 分布为给定目标的纯状态中，幅度为概率的正平方根的状态具有最小的稳定器 Rényi 熵，因此无需训练即可计算该最小值。", "authors": [{"name": "Marcin Płodzień"}], "featured_authors": [{"name": "Marcin Płodzień"}], "author_count": 1}, {"id": "2609.32262", "category": "quant-ph", "title": "Contour-integral and Fourier transform based multivariable quantum eigenvalue transformation for commuting matrices", "abstract": "We study the problem of implementing multivariable matrix-valued functions on a quantum computer and propose two quantum algorithms for multivariable matrix eigenvalue transformations acting on tuples of pairwise commuting matrices. The first algorithm is based on multivariable contour integrals and applies to arbitrary holomorphic functions on $\\mathbb{C}^n$. The second algorithm is based on high-dimensional Fourier transforms and designed for smooth functions of commuting Hermitian matrices. For both algorithms, we discuss and analyze the complexity of their quantum implementation leveraging quantum singular value transformation, compression gadgets, and linear combination of unitaries. We additionally study their hybrid quantum--classical variants that reduce the number of required ancilla qubits to logarithmic dependence on the number of variables, at the cost of increased query complexity. As an application, we show that multivariable matrix polynomials can be implemented with no additional explicit degree dependence, depending only on global properties of the polynomials.", "url": "https://arxiv.org/abs/2609.32262", "type": "数值", "summary": "我们研究了在量子计算机上实现多变量矩阵值函数的问题，并提出了两种作用于成对交换矩阵元组的多变量矩阵特征值变换的量子算法。第一种算法基于多变量轮廓积分，适用于 $\\mathbb{C}^n$ 上的任意全纯函数。第二种算法基于高维傅立叶变换，专为交换埃尔米特矩阵的平滑函数而设计。对于这两种算法，我们讨论并分析了利用量子奇异值变换、压缩小工具和酉线性组合的量子实现的复杂性。我们还研究了它们的混合量子经典变体，这些变体将所需的辅助量子位的数量减少到对变量数量的对数依赖性，但代价是增加了查询复杂性。作为一个应用，我们表明多变量矩阵多项式可以在没有额外的显式度依赖的情况下实现，仅取决于多项式的全局属性。", "authors": [{"name": "Shan Jiang"}, {"name": "Dong An"}], "featured_authors": [{"name": "Shan Jiang"}, {"name": "Dong An"}], "author_count": 2}, {"id": "2609.32310", "category": "quant-ph", "title": "Conserved and relaxing modes enable polynomial-success coherent Carleman lattice Boltzmann evolution", "abstract": "Carleman linearization represents nonlinear lattice Boltzmann collision dynamics in a form amenable to quantum block encoding, but low postselection probabilities in existing population-space encodings make coherent multi-step evolution exponentially unlikely to succeed. We present a quantum Carleman lattice Boltzmann scheme based on the multi-relaxation-time collision operator in a weighted Hermite moment basis. In this basis, the lifted collision operator separates into small coupled blocks whose norm exceeds unity because of the coupling between conserved and relaxing modes. This block structure enables a norm-attaining block encoding with a single-step success probability close to unity. Crucially, scaling the pair sector for a prescribed evolution horizon makes the combined encoding and sector-selection overhead grow polynomially rather than exponentially with the number of steps. For a hundred-step evolution, the resulting complete-run success probability exceeds that of population-space encodings by orders of magnitude. Over horizons of several tens of steps, the truncated dynamics reproduces the nonlinearly generated modes of a benchmark flow to within a few percent. We verify the combined preparation, evolution and readout protocol as a single unitary circuit and give a complete gate-level resource estimate for extracting a nonlinear observable of the benchmark flow from a coherent Carleman evolution. The block structure of conserved and relaxing modes holds equally on three-dimensional lattices and provides a constructive route to norm-attaining encodings for lattice Boltzmann models with quadratic equilibria.", "url": "https://arxiv.org/abs/2609.32310", "type": "理论", "summary": "卡尔曼线性化以适合量子块编码的形式表示非线性格子玻尔兹曼碰撞动力学，但现有群体空间编码中的低后选择概率使得相干多步演化以指数方式不太可能成功。我们提出了一种基于加权埃尔米特矩基础上的多弛豫时间碰撞算子的量子卡尔曼格玻尔兹曼方案。在此基础上，由于保守模式和松弛模式之间的耦合，提升碰撞算子分离成范数超过统一的小耦合块。这种块结构能够实现达到规范的块编码，其单步成功概率接近于一。至关重要的是，在规定的演化范围内缩放对扇区使得组合的编码和扇区选择开销随着步数呈多项式增长，而不是呈指数增长。对于一百步进化，所得的完整运行成功概率超过群体空间编码的数量级。在几十步的范围内，截断的动力学将基准流的非线性生成模式再现到百分之几的范围内。\n\n我们将组合的准备、演化和读出协议验证为单个单一电路，并给出完整的门级资源估计，用于从相干卡尔曼演化中提取基准流的非线性可观测值。守恒模式和松弛模式的块结构在三维晶格上同样成立，并为具有二次平衡的格子玻尔兹曼模型的规范获得编码提供了建设性的途径。", "authors": [{"name": "Hua-Dong Yao"}, {"name": "Sauro Succi"}], "featured_authors": [{"name": "Hua-Dong Yao"}, {"name": "Sauro Succi"}], "author_count": 2}, {"id": "2609.32329", "category": "quant-ph", "title": "Exact High-Temperature Quantum Area Law", "abstract": "We prove a $\\beta^{2}$ area law for the quantum mutual information of thermal states of local lattice Hamiltonians: for any bipartitioning $A|B$ and all inverse temperatures $\\beta$ below a critical value $\\beta^{*}$, we show $\\mathcal{I}_{\\beta}(A,B) \\leqslant \\tilde{f}(\\beta)\\, \\beta^{2}\\,|\\partial_{AB}|$, where $|\\partial_{AB}|$ denotes the size of the boundary region and $\\tilde{f}(\\beta)$ remains finite as $\\beta \\to 0$. This quadratic scaling improves the relationship between high-temperature correlations and macroscopic thermodynamics. While a linear area law implicitly permits a loose, temperature-independent upper bound on extractable work and binding energy, the quadratic scaling ensures that the nonequilibrium free energy available after decoupling regions and the total energy of the interface both are proportional to the area of the interface of $A|B$ and vanish as $\\beta$ at high temperatures. These results show that the high-temperature mutual information and correlation are suppressed, respectively, quadratically and linearly in inverse temperature, which are consistent with the expected thermal decoupling in macroscopic thermodynamic quantities.", "url": "https://arxiv.org/abs/2609.32329", "type": "理论", "summary": "我们证明局域晶格哈密顿量的热态量子互信息的 $\\beta^{2}$ 面积定律：对于任何二分 $A|B$ 和低于临界值 $\\beta^{*}$ 的所有逆温度 $\\beta$，我们显示 $\\mathcal{I}_{\\beta}(A,B) \\leqslant \\tilde{f}(\\beta)\\, \\beta^{2}\\,|\\partial_{AB}|$，其中$|\\partial_{AB}|$ 表示边界区域的大小，$\\tilde{f}(\\beta)$ 保持有限，$\\beta \\to 0$。这种二次标度改善了高温相关性和宏观热力学之间的关系。虽然线性面积定律隐含地允许可提取功和结合能有一个松散的、与温度无关的上限，但二次标度确保了解耦区域后可用的非平衡自由能和界面的总能量都与 $A|B$ 界面的面积成正比，并在高温下以 $\\beta$ 形式消失。这些结果表明，高温互信息和相关性在逆温度下分别被二次抑制和线性抑制，这与宏观热力学量中预期的热解耦一致。", "authors": [{"name": "Ahmad Yousefi"}, {"name": "Ali T. Rezakhani"}], "featured_authors": [{"name": "Ahmad Yousefi"}, {"name": "Ali T. Rezakhani"}], "author_count": 2}, {"id": "2609.32348", "category": "quant-ph", "title": "A Quantum Framework for K Coloring of Graphs", "abstract": "Graph coloring is a well-known NP-complete problem with applications in scheduling, register allocation, frequency assignment, and network optimization. Quantum computing offers the potential for polynomial or even super-polynomial speedups in certain problem instances, yet practical quantum graph coloring methods must carefully balance qubit resources, circuit depth, and constraint enforcement. We proposed a solver agnostic quantum framework for $K$-coloring. Along with a novel encoding and efficient constraint implementation for its exact coloring exploiting Grover search and almost optimal coloring by the Quantum Approximate Optimization Algorithm \\emph{(QAOA)}, and \\emph{Quantum Annealing}. Unlike using $O(NK)$ qubits as in \\emph{SOTA}, we reduced the qubit requirements to $O(N \\log_2 K)$, along with optimized comparator circuits enforcing adjacency constraints. Further symmetry-based graph reduction is incorporated as an optional preprocessing step to further reduce the instance size before quantum execution.", "url": "https://arxiv.org/abs/2609.32348", "type": "理论+数值", "summary": "图着色是一个众所周知的 NP 完全问题，在调度、寄存器分配、频率分配和网络优化中都有应用。量子计算在某些问题实例中提供了多项式甚至超多项式加速的潜力，但实用的量子图着色方法必须仔细平衡量子位资源、电路深度和约束执行。我们提出了一个与求解器无关的 $K$ 着色量子框架。连同新颖的编码和有效的约束实现，利用 Grover 搜索实现精确着色，并通过量子近似优化算法 \\emph{(QAOA)} 和 \\emph{量子退火} 实现几乎最佳的着色。与 \\emph{SOTA} 中使用 $O(NK)$ 量子位不同，我们将量子位要求降低至 $O(N \\log_2 K)$，并优化了比较器电路以强制执行邻接约束。进一步基于对称性的图缩减被纳入作为可选的预处理步骤，以在量子执行之前进一步减小实例大小。", "authors": [{"name": "Lord Sen"}, {"name": "Shyamapada Mukherjee"}], "featured_authors": [{"name": "Lord Sen"}, {"name": "Shyamapada Mukherjee"}], "author_count": 2}, {"id": "2609.32515", "category": "quant-ph", "title": "An exponential strong converse for private communication over degradable quantum channels", "abstract": "We prove an exponential strong converse for the unassisted private capacity of every finite-dimensional degradable quantum channel. We use a single error criterion: the infidelity between the actual message-estimate-environment state and an ideal state consisting of uniformly distributed, perfectly correlated messages that are independent of the environment. At every rate strictly above the channel's maximum coherent information, the optimized fidelity to this ideal state decays exponentially in the number of channel uses. The same bound holds when the ideal environment state is fixed to the actual environment marginal. The proof applies to arbitrary mixed-state encoders and arbitrary collective decoders. Its main operator ingredient is an overlap bound for privacy tests: two receiver placements with a common subsystem of dimension $d_C$ have overlap at most $d_C/M$, where $M$ is the key size, independently of both shield dimensions. We combine this bound with the signed averaging construction presented in arXiv:2608.01308 and a single-filter reduction to symmetric states. A Gaussian filter replaces the common receiver subsystem by a system of controlled dimension from which the original correlations can be approximately recovered using quantum side information. The filter preserves exact exchange symmetry, and a uniform smooth-entropy estimate bounds its output dimension for arbitrary correlated channel inputs. We also obtain an exponential strong converse at zero for antidegradable channels under the same joint criterion and, consequently, for the private capacity of the quantum erasure channel throughout its parameter range.", "url": "https://arxiv.org/abs/2609.32515", "type": "理论+数值", "summary": "我们证明了每个有限维可降解量子通道的独立私有容量的指数强逆。我们使用单一错误标准：实际消息估计环境状态与由均匀分布、完全相关的独立于环境的消息组成的理想状态之间的不忠实。在严格高于信道最大相干信息的每个速率下，该理想状态的优化保真度随着信道使用的数量呈指数衰减。当理想环境状态固定为实际环境边际时，同样的界限成立。该证明适用于任意混合状态编码器和任意集体解码器。其主要操作要素是隐私测试的重叠界限：具有维度 $d_C$ 的公共子系统的两个接收器放置最多重叠 $d_C/M$，其中 $M$ 是密钥大小，与两个屏蔽维度无关。我们将此界限与 arXiv:2608.01308 中提出的带符号平均结构以及单滤波器简化为对称状态相结合。\n\n高斯滤波器用受控维度的系统取代了常见的接收器子系统，可以使用量子辅助信息从该系统中近似恢复原始相关性。该滤波器保留了精确的交换对称性，并且均匀的平滑熵估计限制了任意相关通道输入的输出维度。我们还在相同的联合标准下获得了抗退化通道在零处的指数强逆，因此，量子擦除通道在其整个参数范围内的私有容量也获得了指数强逆。", "authors": [{"name": "Mark M. Wilde"}], "featured_authors": [{"name": "Mark M. Wilde"}], "author_count": 1}, {"id": "2609.32580", "category": "quant-ph", "title": "Stable Long-Range Charging and Boundary-Mediated Thresholds in a Waveguide Quantum Battery", "abstract": "The waveguide-integrated architecture holds promise for scalable on-chip integration of a charger, a transmission channel, and a quantum battery in a modular, independently optimizable design. We investigate a minimal charging configuration consisting of two emitters coupled to a semi-infinite waveguide and identify the optimal charging mechanism, wherein non-Markovian dynamics driven by out-of-band bound states give rise to single-frequency oscillations of the stored energy. We show that near-unity charging efficiency is achievable at weak to moderate coupling strengths via detuning control, provided that the battery-to-boundary separation $n$ is less than three times the charger-to-boundary separation $m$ ($n<3m$)---a constraint imposed by the mirror-induced feedback---while the average charging power decays exponentially with the spatial separation $n-m$. These findings offer useful insights for monolithic solid-state quantum energy storage and transport.", "url": "https://arxiv.org/abs/2609.32580", "type": "理论+数值", "summary": "波导集成架构有望在模块化、独立优化的设计中实现充电器、传输通道和量子电池的可扩展片上集成。我们研究了由两个耦合到半无限波导的发射器组成的最小充电配置，并确定了最佳充电机制，其中由带外束缚态驱动的非马尔可夫动力学引起所存储能量的单频振荡。我们表明，通过失谐控制，在弱到中等耦合强度下可以实现接近统一的充电效率，前提是电池到边界的间距 $n$ 小于充电器到边界间距 $m$ 的三倍（$n<3m$）（镜面感应反馈施加的约束），而平均充电功率随着空间间距 $n-m$ 呈指数衰减。这些发现为单片固态量子能量存储和传输提供了有用的见解。", "authors": [{"name": "Li-Hong Yu"}, {"name": "Zhuo-Yu Zhang"}, {"name": "Yu Wang"}, {"name": "Xin Li"}], "featured_authors": [{"name": "Li-Hong Yu"}, {"name": "Zhuo-Yu Zhang"}, {"name": "Yu Wang"}, {"name": "Xin Li"}], "author_count": 4}, {"id": "2609.32603", "category": "quant-ph", "title": "Beyond NISQ Assumptions: One-time Memory in the Classically Accessible Random-Oracle Model", "abstract": "Quantum information enables many cryptographic primitives that are impossible in the classical world. A line of works has developed cryptographic protocol under the assumption that quantum adversaries are restricted to noisy intermediate-scale quantum (NISQ) computing power, enabling strong one-time functionalities. But the advent of early fault-tolerant quantum computers eras will allow deeper logical quantum circuits, calling into questions the applicability of these NISQ-based assumptions. In this work, we adapt the classically accessible random oracle model (CAROM) as in [BDF+11] and [AK22], in which adversaries are only allowed to classically query the random oracle. The restriction is well motivated for NISQ quantum adversaries and may remain plausible in the presence of early fault-tolerant quantum computers. Then, we show that an efficient simulation-secure one-time memory (OTM) is possible under CAROM. Our protocol uses only BB84 states and has quadratic communication: for a $\\lambda$-bit message and integer-valued parameters $n=n(\\lambda)$ and $\\ell=\\ell(\\lambda)$, the construction uses $n\\ell$ qubits and $(n+2)\\lambda$ classical bits, and for any quantum adversary with at most $2^{\\ell/2-1}-1$ classical queries to the random oracle, its simulation advantage is at most $(n+3)\\left(\\frac{3}{4}\\right)^n.$ Hence exponentially small simulation advantage in $n$.", "url": "https://arxiv.org/abs/2609.32603", "type": "理论+数值", "summary": "量子信息使许多密码学原语成为可能，这在经典世界中是不可能的。一系列工作在假设量子对手仅限于嘈杂的中级量子（NISQ）计算能力的情况下开发了加密协议，从而实现了强大的一次性功能。但早期容错量子计算机时代的出现将允许更深层次的逻辑量子电路，从而使人们对这些基于 NISQ 的假设的适用性产生疑问。在这项工作中，我们采用了经典可访问的随机预言模型（CAROM），如[BDF+11]和[AK22]，其中对手只允许经典地查询随机预言。该限制对于 NISQ 量子对手来说是有充分动机的，并且在早期容错量子计算机存在的情况下可能仍然合理。然后，我们证明了在 CAROM 下可以实现一种高效的仿真安全一次性存储器 (OTM)。\n\n我们的协议仅使用 BB84 状态并具有二次通信：对于 $\\lambda$ 位消息和整数值参数 $n=n(\\lambda)$ 和 $\\ell=\\ell(\\lambda)$，该构造使用 $n\\ell$ 量子位和 $(n+2)\\lambda$ 经典位，并且对于任何对随机预言机进行最多 $2^{\\ell/2-1}-1$ 经典查询的量子对手，其模拟优势最多为$(n+3)\\left(\\frac{3}{4}\\right)^n.$ 因此，$n$ 中的模拟优势呈指数级小。", "authors": [{"name": "Boyang Chen"}, {"name": "Tianren Liu"}, {"name": "Luojian Wei"}], "featured_authors": [{"name": "Boyang Chen"}, {"name": "Tianren Liu"}, {"name": "Luojian Wei"}], "author_count": 3}, {"id": "2609.32845", "category": "quant-ph", "title": "Generation of arbitrary quantum states in cavity-atom systems with a three-level ancilla", "abstract": "We generalized the seminal work of Law & Eberly, and propose a protocol to generate arbitrary quantum states with a three-level atom as an ancilla in a more efficient manner. This protocol moves two excitations in parallel in each control step, thus reducing the number of evolution steps by half. Full analytical expressions for the control field strengths and timings are derived. The system dynamics is exposed to less chance of error accumulation in the timing and amplitudes of the control fields, and quantitative study in the context of the quantum speed limit is also considered.", "url": "https://arxiv.org/abs/2609.32845", "type": "理论", "summary": "我们概括了 Law 和 Eberly 的开创性工作，并提出了一种协议，以更有效的方式生成以三能级原子作为辅助的任意量子态。该协议在每个控制步骤中并行移动两个激励，从而将进化步骤的数量减少一半。导出了控制场强和时序的完整解析表达式。系统动力学在控制场的时间和幅度方面的误差累积机会较小，并且还考虑了量子速度极限背景下的定量研究。", "authors": [{"name": "Da-Wei Luo"}, {"name": "Ting Yu"}], "featured_authors": [{"name": "Da-Wei Luo"}, {"name": "Ting Yu"}], "author_count": 2}, {"id": "2609.32943", "category": "quant-ph", "title": "The wiring sets a phase-blind quantum memory's gap, the weight caps its coherence", "abstract": "Engineered dissipation corrects errors, yet a memory's phase decays. What the memory's gap measures is not settled. Here we show that when each jump resets one basis state, the wiring can set the gap time while the phase keeps its rate. Under dephasing the gap time spans two orders across wirings; the phase does not. In this class, a contrast on two or more qubits fades faster than a bare qubit at any distance; no such pump power substitutes. The ceiling is two over the qubits the contrast spans. A two-branch pump can escape it at distance three; a two-clock test runs on published data.", "url": "https://arxiv.org/abs/2609.32943", "type": "理论", "summary": "工程耗散可以纠正错误，但存储器的相位会衰减。内存间隙的衡量标准尚未确定。在这里，我们展示了当每次跳转重置一个基本状态时，接线可以设置间隙时间，同时相位保持其速率。在移相的情况下，间隙时间跨越布线的两个数量级；相位没有。在这一类中，两个或多个量子位上的对比度在任何距离上都比裸量子位消退得更快；没有这样的泵动力替代品。上限是对比度跨度的量子位的两倍。两支泵可以在距离三处逃脱；对已发布的数据进行两个时钟测试。", "authors": [{"name": "Ruini Qian"}, {"name": "Zhaobin Lyu"}, {"name": "Zelong Yin"}, {"name": "Jingjing Hu"}, {"name": "Dengfeng Li"}, {"name": "Shuoming An"}], "featured_authors": [{"name": "Ruini Qian"}, {"name": "Zhaobin Lyu"}, {"name": "Zelong Yin"}, {"name": "Jingjing Hu"}, {"name": "Dengfeng Li"}, {"name": "Shuoming An"}], "author_count": 6}, {"id": "2609.32979", "category": "quant-ph", "title": "Toroidal-Core Certificates for PPT-Squared Diagonal Orthogonal Covariant Channels", "abstract": "The positive-partial-transpose-squared (PPT-squared) conjecture asks whether the composition of two positive-partial-transpose (PPT) quantum channels must be entanglement breaking (EB). The problem remains open in general and, within the diagonal orthogonal covariant (DOC) class, the first unresolved deterministic dimension is four. A sufficient condition for PPT-squared composition is derived for DOC maps in arbitrary finite dimension. The proof isolates the quantum coherence data into two correlation matrices, mixes each with the identity until it lies in the convex hull of rank-one correlation matrices, and converts the resulting objects into an explicit triplewise completely positive (TCP) core. The remaining contribution is purely classical and is TCP whenever a simple entrywise mixing inequality is satisfied. For PPT DOC maps $\\Phi_{A,B,C}$ and $\\Phi_{D,E,F}$ on $M_d$, the entrywise bound $(AD)_{ij}\\ge 2\\lfloor\\sqrt{d}\\rfloor\\sqrt{A_{ii}A_{jj}D_{ii}D_{jj}}$ for all $i,j$ guarantees that $\\Phi_{A,B,C}\\circ\\Phi_{D,E,F}$ is EB. In dimension four the universal coefficient becomes four. A continuous family of bistochastic PPT channels is then constructed; every member with $a\\ne1$ is not EB, while every pairwise composition within the family is proved to be EB. A rank-sensitive refinement shows explicitly how low coherence rank can improve the universal coefficient. The resulting certificate is sufficient rather than necessary and is complementary to factor-width and semidefinite-hierarchy approaches.", "url": "https://arxiv.org/abs/2609.32979", "type": "理论+数值", "summary": "正偏转置平方（PPT-squared）猜想询问两个正偏转置（PPT）量子通道的组合是否一定是纠缠破坏（EB）。这个问题总体上仍然悬而未决，在对角正交协变 (DOC) 类中，第一个未解决的确定性维度是四。导出了任意有限维 DOC 图的 PPT 平方合成的充分条件。该证明将量子相干数据隔离为两个相关矩阵，将每个矩阵与恒等式混合，直到其位于一级相关矩阵的凸包中，并将所得对象转换为显式三重完全正 (TCP) 核心。剩下的贡献是纯粹的经典贡献，只要满足简单的逐项混合不等式，就是 TCP。对于 $M_d$ 上的 PPT DOC 映射 $\\Phi_{A,B,C}$ 和 $\\Phi_{D,E,F}$，所有 $i,j$ 的条目边界 $(AD)_{ij}\\ge 2\\lfloor\\sqrt{d}\\rfloor\\sqrt{A_{ii}A_{jj}D_{ii}D_{jj}}$ 保证$\\Phi_{A,B,C}\\circ\\Phi_{D,E,F}$ 是 EB。在四维中，通用系数变为四。\n\n然后构建一个连续的双随机 PPT 通道族；每个具有 $a\\ne1$ 的成员都不是 EB，而家族中的每个成对组合都被证明是 EB。等级敏感的细化明确地显示了低相干等级可以如何提高通用系数。生成的证书是充分的而不是必需的，并且是对因子宽度和半定层次方法的补充。", "authors": [{"name": "Samuel Marquez Gonzalez"}], "featured_authors": [{"name": "Samuel Marquez Gonzalez"}], "author_count": 1}, {"id": "2609.33094", "category": "quant-ph", "title": "Loss-Resilient Quantum Networking with Dicke Entanglement", "abstract": "Multipartite entanglement can endow a quantum network with capabilities unavailable classically, yet their evolution under progressively reduced physical and informational access remains largely unexplored. Here we realize the first eight-photon half-excitation Dicke state, with a fidelity of 0.922(11), and use it to implement two distinct network tasks: open-destination teleportation and quantum telecloning. An unknown state can be teleported from one agent to any of seven remote agents with fidelities of 0.926(7)-0.941(6), while seven approximate clones are distributed with a fidelity of 0.713(3), close to the optimal value of 5/7. The protocol remains above the classical limit under imperfect photon detection, transmission loss and missing information from participating agents, and outperforms the corresponding GHZ benchmarks. As fewer agents contribute, the teleportation fidelity falls through a stepwise hierarchy whose two extremes recover open-destination teleportation and optimal telecloning, connecting both tasks within a single operational framework. These results establish Dicke entanglement as a promising architecture for loss-resilient quantum networks, opening a route towards quantum technologies that retain useful functionality under realistic operating conditions.", "url": "https://arxiv.org/abs/2609.33094", "type": "理论", "summary": "多部分纠缠可以赋予量子网络传统上无法获得的功能，但它们在物理和信息访问逐渐减少的情况下的演化在很大程度上仍未被探索。在这里，我们实现了第一个八光子半激发迪克态，保真度为0.922(11)，并用它来实现两个不同的网络任务：开放目的地隐形传态和量子远程克隆。未知状态可以从一个代理传送到七个远程代理中的任何一个，保真度为 0.926(7)-0.941(6)，而七个近似克隆的保真度为 0.713(3)，接近最佳值 5/7。该协议在不完美的光子检测、传输损失和参与代理的信息丢失的情况下仍然高于经典极限，并且优于相应的 GHZ 基准。随着贡献的代理减少，隐形传态保真度会通过逐步层次结构下降，其两个极端恢复开放目的地隐形传态和最佳远程克隆，将这两个任务连接到单个操作框架内。\n\n这些结果使迪克纠缠成为一种有前景的抗损耗量子网络架构，为在实际操作条件下保留有用功能的量子技术开辟了一条道路。", "authors": [{"name": "Bowen Wang"}, {"name": "Hongyu Yang"}, {"name": "Jiacheng Sun"}, {"name": "Wanping Zhou"}, {"name": "Jizhou Wu"}, {"name": "Yunlong Xiao"}, {"name": "Dian Wu"}, {"name": "Jian Wu"}], "featured_authors": [{"name": "Bowen Wang"}, {"name": "Hongyu Yang"}, {"name": "Jiacheng Sun"}, {"name": "Yunlong Xiao"}, {"name": "Dian Wu"}, {"name": "Jian Wu"}], "author_count": 8}, {"id": "2609.33098", "category": "quant-ph", "title": "The Breakdown of Classical Minicrypt Equivalences in the Quantum-Computation Classical-Communication Model", "abstract": "Classically, it is well-known that several fundamental cryptographic primitives, including one-way functions, pseudorandom number generators, commitments, and signatures, characterize the same cryptographic world, which is known as \"Minicrypt\". In this paper, we investigate to what extent this picture persists in the quantum-computation classical-communication (QCCC) setting, where parties may perform quantum local computation, but communicate through only classical messages. We demonstrate that the classical Minicrypt landscape breaks down in the QCCC model by oracle separations. We construct two oracle worlds where efficiently verifiable one-way puzzles (EV-OWPuzz) exist. By a known equivalence, QCCC one-time signatures also exist in both worlds. In the first, one-way functions do not exist, even if we allow quantum pseudodeterministic evaluation. In the second, QCCC bit commitments do not exist. Thus, the classical Minicrypt reductions from signatures to one-way functions and bit commitments have no fully black-box counterparts in the QCCC setting. Our proofs develop techniques for analyzing the random phase states, including a concentration theorem and an LOCC decoupling theorem, which may be of independent interest.", "url": "https://arxiv.org/abs/2609.33098", "type": "理论", "summary": "传统上，众所周知，几个基本的密码原语，包括单向函数、伪随机数生成器、承诺和签名，表征了同一个密码世界，称为“Minicrypt”。在本文中，我们研究了这种情况在量子计算经典通信（QCCC）环境中的持续程度，其中各方可以执行量子本地计算，但仅通过经典消息进行通信。我们证明了经典的 Minicrypt 景观在 QCCC 模型中通过预言机分离而崩溃。我们构建了两个预言世界，其中存在有效可验证的单向谜题（EV-OWPuzz）。根据已知的等价性，QCCC 一次性签名在两个世界中也都存在。在第一种情况下，即使我们允许量子伪确定性评估，单向函数也不存在。在第二种情况下，QCCC 比特承诺不存在。因此，经典的 Minicrypt 从签名简化为单向函数和位承诺，在 QCCC 设置中没有完全黑盒的对应物。\n\n我们的证明开发了分析随机相态的技术，包括浓度定理和 LOCC 解耦定理，这些定理可能具有独立的意义。", "authors": [{"name": "Boyang Chen"}, {"name": "Yiming Wang"}, {"name": "Ziyi Xie"}], "featured_authors": [{"name": "Boyang Chen"}, {"name": "Yiming Wang"}, {"name": "Ziyi Xie"}], "author_count": 3}, {"id": "2609.33229", "category": "quant-ph", "title": "In-plane optimal qubit operation with control fidelities exceeding 99 %", "abstract": "Hole spin qubits based on semiconductor quantum dots are promising for building future large-scale quantum computers owing to their all-electrical manipulation. However, abundant physical mechanisms of valence band holes lead to anisotropic qubit properties. There is an opportunity to prolong the coherence time and achieve high-fidelity qubit manipulations. Here, we report a single-hole spin qubit in a planar germanium quantum dot and investigate its anisotropic susceptibility to charge noise under an in-plane magnetic field. By correlating the longitudinal spin-electric susceptibility with qubit coherence and control performance, we identify an optimal operating point where the sensitivity to charge noise is minimized. We find that optimizing the magnetic-field orientation reduces the spin-electric susceptibility, resulting in a five-fold enhancement of the Hahn-echo coherence time and a nearly tenfold suppression of control infidelity. At the optimal operating point, gate set tomography demonstrates the maximum gate fidelity of 99.82 %. Our finding enhances the prospects of hole spin qubits for scalable quantum information processing.", "url": "https://arxiv.org/abs/2609.33229", "type": "理论+数值", "summary": "基于半导体量子点的空穴自旋量子位由于其全电操纵而有望用于构建未来的大规模量子计算机。然而，丰富的价带空穴物理机制导致了各向异性的量子位特性。有机会延长相干时间并实现高保真量子位操作。在这里，我们报告了平面锗量子点中的单孔自旋量子位，并研究了其在面内磁场下对电荷噪声的各向异性敏感性。通过将纵向自旋电磁化率与量子位相干性和控制性能相关联，我们确定了一个最佳工作点，其中对电荷噪声的敏感性最小化。我们发现，优化磁场方向可以降低自旋电敏感性，从而使哈恩回波相干时间延长五倍，并抑制控制不真实性近十倍。在最佳工作点，门组断层扫描显示最大门保真度为 99.82%。我们的发现增强了空穴自旋量子位用于可扩展量子信息处理的前景。", "authors": [{"name": "Yu-Chen Zhou"}, {"name": "Zhenzhen Kong"}, {"name": "Rong-Long Ma"}, {"name": "Hao-Tian Jiang"}, {"name": "Ao-Ran Li"}, {"name": "Yang Zhong"}, {"name": "Zhi-Tao Wu"}, {"name": "Rui Zheng"}, {"name": "Gui-Lei Wang"}, {"name": "Gang Cao"}, {"name": "Hai-Ou Li"}, {"name": "Guo-Ping Guo"}], "featured_authors": [{"name": "Yu-Chen Zhou"}, {"name": "Zhenzhen Kong"}, {"name": "Rong-Long Ma"}, {"name": "Gang Cao"}, {"name": "Hai-Ou Li"}, {"name": "Guo-Ping Guo"}], "author_count": 12}, {"id": "2609.33251", "category": "quant-ph", "title": "High-fidelity geometric quantum gates exceeding 99.9% in germanium quantum dots", "abstract": "Achieving high-fidelity and robust qubit manipulations is a crucial requirement for realizing faulttolerant quantum computation. Here, we demonstrate a single-hole spin qubit in a germanium quantum dot and characterize its control fidelity using gate set tomography. The maximum control fidelities reach 97.48%, 99.81%, 99.88% for the I, X/2 and Y /2 gate, respectively. These results reveal that off-resonance noise during consecutive I gates in gate set tomography sequences severely limits qubit performance. Therefore, we introduce geometric quantum computation to realize noiseresilient qubit manipulation. The geometric gate control fidelities remain above 99% across a wide range of Rabi frequencies. The maximum fidelity surpasses 99.9%. Furthermore, the fidelities of geometric X/2 and Y /2 (I) gates exceed 99% even when detuning the microwave frequency by +-2.5 MHz (+-1.2 MHz), highlighting the noise-resilient feature. These results demonstrate that geometric quantum computation is a potential method for achieving high-fidelity qubit manipulation reproducibly in semiconductor quantum computation.", "url": "https://arxiv.org/abs/2609.33251", "type": "理论", "summary": "实现高保真和鲁棒的量子位操作是实现容错量子计算的关键要求。在这里，我们演示了锗量子点中的单孔自旋量子位，并使用门组断层扫描表征其控制保真度。 I、X/2、Y/2门的最大控制保真度分别达到97.48%、99.81%、99.88%。这些结果表明，门组断层扫描序列中连续 I 门期间的偏共振噪声严重限制了量子位性能。因此，我们引入几何量子计算来实现抗噪声量子位操作。在很宽的 Rabi 频率范围内，几何门控制保真度保持在 99% 以上。最高保真度超过99.9%。此外，即使微波频率失谐+-2.5 MHz（+-1.2 MHz），几何X/2和Y /2 (I)门的保真度也超过99%，突出了抗噪声特性。这些结果表明，几何量子计算是在半导体量子计算中可重复地实现高保真量子位操作的潜在方法。", "authors": [{"name": "Yu-Chen Zhou"}, {"name": "Rong-Long Ma"}, {"name": "Zhenzhen Kong"}, {"name": "Ao-Ran Li"}, {"name": "Chengxian Zhang"}, {"name": "Xin Zhang"}, {"name": "Yang Liu"}, {"name": "Hao-Tian Jiang"}, {"name": "Zhi-Tao Wu"}, {"name": "Gui-Lei Wang"}, {"name": "Gang Cao"}, {"name": "Guang-Can Guo"}, {"name": "Hai-Ou Li"}, {"name": "Guo-Ping Guo"}], "featured_authors": [{"name": "Yu-Chen Zhou"}, {"name": "Rong-Long Ma"}, {"name": "Zhenzhen Kong"}, {"name": "Guang-Can Guo"}, {"name": "Hai-Ou Li"}, {"name": "Guo-Ping Guo"}], "author_count": 14}, {"id": "2609.33389", "category": "quant-ph", "title": "Temperature--Hamiltonian Ambiguity in Strong-Coupling Quantum Equilibrium", "abstract": "Strong coupling generally drives a subsystem away from the Gibbs state of its bare Hamiltonian at the bath temperature. We formulate a temperature--Hamiltonian ambiguity: the reduced equilibrium state fixes the dimensionless Gibbs generator, but does not by itself uniquely determine the local Hamiltonian and temperature entering a Gibbs representation. We propose an operational resolution in which the local Hamiltonian is identified from physical information independent of the stationary Gibbs parametrization. Whenever the exact reduced state is compatible with the Gibbs family generated by that independently identified Hamiltonian, it then determines a unique local temperature. An exactly solvable two-level-system--oscillator model makes the ambiguity explicit through state-equivalent descriptions based on temperature renormalization relative to a specified local Hamiltonian and Hamiltonian-of-mean-force level renormalization at the bath temperature. An exact bosonic model provides the complementary case in which retarded dynamics independently fixes a renormalized local excitation scale and thereby specifies the local Hamiltonian before the stationary populations determine the temperature. These results distinguish state representation from thermodynamic assignment and provide an operational framework for local thermodynamics beyond weak coupling.", "url": "https://arxiv.org/abs/2609.33389", "type": "理论", "summary": "强耦合通常会使子系统在浴温下远离其裸哈密顿量的吉布斯状态。我们制定了温度-哈密顿模糊性：减少的平衡状态固定了无量纲吉布斯生成器，但其本身并不能唯一地确定进入吉布斯表示的局部哈密顿量和温度。我们提出了一种操作解决方案，其中局部哈密顿量是根据独立于平稳吉布斯参数化的物理信息来识别的。每当精确的还原态与独立识别的哈密顿量生成的吉布斯族兼容时，它就会确定一个独特的局部温度。精确可解的二能级系统振荡器模型通过基于相对于指定局部哈密顿量和平均力哈密顿量水平重整化的温度重整化的状态等效描述来明确模糊性。\n\n精确的玻色子模型提供了补充情况，其中延迟动力学独立地固定重整化的局部激发尺度，从而在静止总体确定温度之前指定局部哈密顿量。这些结果将状态表示与热力学分配区分开来，并为弱耦合之外的局部热力学提供了一个操作框架。", "authors": [{"name": "Jinshuang Jin"}], "featured_authors": [{"name": "Jinshuang Jin"}], "author_count": 1}, {"id": "2609.33453", "category": "quant-ph", "title": "Local Many Worlds in Spacetime: Deutsch-Hayden Descriptors and Local Wavefunctions", "abstract": "Bell's theorem establishes that a local and spatially separable physical theory with no superdeterminism or retrocausality must be a theory of many local worlds. The local many worlds formalism of quantum mechanics is a transparent separable physical theory in spacetime with a Lorentz covariant causal structure. Unlike the Everett many worlds interpretation, there is no nonseparable universal wavefunction in configuration space, but like Everett, there is only local unitary evolution which conserves probability (fluid) current, and no wavefunction collapse. Each event in spacetime has its own local wavefunction which is built up using only the local wavefunctions and local unitary evolution operators within its past light cone, and which is entirely disconnected from spacelike separated local wavefunctions. We call this the local Schrödinger picture. Local many worlds can also be described in the Heisenberg picture by ascribing Deutsch-Hayden (DH) descriptors to each individual system, each of which evolves under local unitary operations. Both the local wavefunctions and DH descriptors contain records of past interactions, and while the local wavefunctions provide a clear and intuitive physical narrative, the descriptors contain all of the same information in a much more compact form. Unfortunately, the compact form is also somewhat cryptic, which has made the local Heisenberg picture relatively inaccessible. The purpose of this article is to show that the local wavefunctions for any $N$-qubit system can always be constructed directly from the DH descriptors, allowing us to combine the benefits of both pictures.", "url": "https://arxiv.org/abs/2609.33453", "type": "理论", "summary": "贝尔定理指出，不存在超决定论或逆因果关系的局域和空间可分离的物理理论必定是许多局域世界的理论。量子力学的局域多世界形式主义是时空中透明的可分离物理理论，具有洛伦兹协变因果结构。与埃弗雷特多世界解释不同，配置空间中不存在不可分离的通用波函数，但与埃弗雷特一样，仅存在概率（流体）流守恒的局域酉演化，并且没有波函数崩溃。时空中的每个事件都有自己的局部波函数，该波函数仅使用其过去光锥内的局部波函数和局部酉演化算子建立起来，并且与空间分离的局部波函数完全无关。我们称之为局部薛定谔图。局部多世界也可以在海森堡图中通过将 Deutsch-Hayden (DH) 描述符归属于每个单独的系统来描述，每个系统都在局部酉运算下演化。\n\n局部波函数和 DH 描述符都包含过去相互作用的记录，虽然局部波函数提供了清晰直观的物理叙述，但描述符以更紧凑的形式包含所有相同的信息。不幸的是，紧凑的形式也有些神秘，这使得当地的海森堡图片相对难以接近。本文的目的是表明任何 $N$ 量子位系统的局部波函数始终可以直接从 DH 描述符构造，从而使我们能够结合这两种图像的优点。", "authors": [{"name": "Mordecai Waegell"}], "featured_authors": [{"name": "Mordecai Waegell"}], "author_count": 1}, {"id": "2609.33475", "category": "quant-ph", "title": "How many photons can a molecule scatter before its coherence is lost?", "abstract": "Molecular qubits held in conservative optical traps may lose coherence when they scatter photons from the trapping lasers. The rate for this process has two parts, one equal to the mean Raman scattering rate of the two qubit states, and the other proportional to the square of the difference in their Rayleigh scattering amplitudes. This paper calculates the decoherence rate, expressing results in terms of the vector and tensor parts of the molecular polarizability, $\\alpha_1$ and $\\alpha_2$. While the decoherence rate is generally much larger for molecules than for atoms, it is suppressed at wavelengths where $\\alpha_1$ and $\\alpha_2$ are both small. The wavelengths where this occurs are identified for CaF molecules.", "url": "https://arxiv.org/abs/2609.33475", "type": "理论", "summary": "当保守光陷阱中的分子量子位散射来自捕获激光器的光子时，它们可能会失去相干性。该过程的速率有两部分，一部分等于两个量子位态的平均拉曼散射速率，另一部分与它们的瑞利散射幅度之差的平方成正比。本文计算退相干率，用分子极化率 $\\alpha_1$ 和 $\\alpha_2$ 的矢量和张量部分表示结果。虽然分子的退相干率通常比原子的退相干率大得多，但在 $\\alpha_1$ 和 $\\alpha_2$ 都较小的波长处，退相干率受到抑制。发生这种情况的波长被确定为 CaF 分子。", "authors": [{"name": "M. R. Tarbutt"}], "featured_authors": [{"name": "M. R. Tarbutt"}], "author_count": 1}, {"id": "2609.33574", "category": "quant-ph", "title": "Interactions Protect Periodically Driven Time Crystals Against Dephasing but Destabilise Multipolar-Driven Order", "abstract": "We show that stronger interactions protect periodically driven time-crystal order against dephasing but destabilise order under random multipolar drives, and that coordination matters beyond the total interaction strength. We studied a disordered kicked Ising model of $N=12$ and $16$ spins with imperfect $\\pi$ pulses and per-site dephasing by exact diagonalisation, comparing a periodic drive, random multipolar drives of order $n=0,1,2$ and the Thue-Morse sequence, and separated coupling strength from coordination by comparing a grid with a ring at equal total interaction strength $zJ$. For the periodic drive the coherence time scales approximately as $1/\\gamma$, and stronger coupling reduces the transverse tilt on which dephasing acts. For multipolar drives of order $n\\ge1$, doubling the coupling on a ring shortens the coherence time to $0.54$ ($n=1$), $0.37$ ($n=2$) and $0.44$ (Thue-Morse) at $N=16$, while random signs ($n=0$) are unaffected. A disorder scan supports a toggling-frame picture in which interactions spoil the block cancellation of the pulse error. At equal $zJ$ the grid outlives the ring by $2.15$ ($N=12$) and $2.78$ ($N=16$) for the periodic drive despite an identical transverse tilt, a coordination effect beyond this picture. All ratios hold under three definitions of the coherence time.", "url": "https://arxiv.org/abs/2609.33574", "type": "理论", "summary": "我们表明，更强的相互作用可以保护周期性驱动的时间晶体秩序免于失相，但会在随机多极驱动下破坏秩序的稳定，并且协调的重要性超出了总相互作用强度。我们研究了 $N=12$ 和 $16$ 自旋的无序踢伊辛模型，具有不完美的 $\\pi$ 脉冲和通过精确对角化进行逐位相移，比较周期性驱动、$n=0,1,2$ 阶的随机多极驱动和 Thue-Morse 序列，并通过比较网格与总相互作用强度 $zJ$ 的环来将耦合强度与协调分开。对于周期性驱动，相干时间尺度大约为$1/\\gamma$，更强的耦合减少了相移作用的横向倾斜。对于 $n\\ge1$ 阶的多极驱动器，在环上加倍耦合可将 $N=16$ 处的相干时间缩短至 $0.54$ ($n=1$)、$0.37$ ($n=2$) 和 $0.44$ (Thue-Morse)，而随机符号 ($n=0$) 不受影响。无序扫描支持切换帧图像，其中交互破坏了脉冲误差的块消除。\n\n在相同的 $zJ$ 下，尽管有相同的横向倾斜，但对于周期性驱动，网格的寿命比环长 $2.15$ ($N=12$) 和 $2.78$ ($N=16$)，协调效应超出了这张图片。所有比率都适用于相干时间的三种定义。", "authors": [{"name": "Karthikeya Machiraju"}, {"name": "Kaustav Bhowmick"}], "featured_authors": [{"name": "Karthikeya Machiraju"}, {"name": "Kaustav Bhowmick"}], "author_count": 2}, {"id": "2609.33686", "category": "quant-ph", "title": "Simultaneously Query-Optimal Quantum Linear-System Algorithm", "abstract": "Quantum linear-system algorithms access the coefficient matrix through a block-encoding oracle $U_A$ and the right-hand side through a state-preparation oracle $U_b$. The optimal query complexities of these two oracles are known separately: $O(\\kappa\\log(1/\\varepsilon))$ queries to $U_A$ and $O(\\kappa/s)$ queries to $U_b$, where $s=\\alpha\\|A^{-1}b\\|$. Whether a single algorithm can achieve both bounds simultaneously has remained open. We resolve this question affirmatively. Given a constant-factor estimate of $s$, we give a quantum linear-system algorithm that prepares the normalized solution to error $\\varepsilon$ using simultaneously $ O\\left(\\kappa\\log\\frac1\\varepsilon\\right)$ queries to $U_A$ and $O\\left({\\kappa}/{s}\\right)$ queries to $U_b$. The algorithm separates state preparation from precision refinement, so only the matrix-query count depends on the target accuracy. We also prove a matching same-instance worst-case lower bound: for every quantum linear-system algorithm and every solution-norm scale, there exists a single Hermitian instance on which that algorithm requires both $\\Omega(\\kappa\\log(1/\\varepsilon))$ matrix queries and $\\Omega(\\kappa/s)$ state-preparation queries. Thus the two oracle complexities can be optimized simultaneously, and the resulting bounds are jointly optimal.", "url": "https://arxiv.org/abs/2609.33686", "type": "理论+数值", "summary": "量子线性系统算法通过块编码预言机 $U_A$ 访问系数矩阵，并通过状态准备预言机 $U_b$ 访问右侧。这两个预言机的最佳查询复杂度分别已知：对 $U_A$ 的 $O(\\kappa\\log(1/\\varepsilon))$ 查询和对 $U_b$ 的 $O(\\kappa/s)$ 查询，其中 $s=\\alpha\\|A^{-1}b\\|$。单一算法是否可以同时实现这两个界限仍然悬而未决。我们肯定地解决这个问题。给定 $s$ 的常数因子估计，我们给出一个量子线性系统算法，该算法使用对 $U_A$ 的 $O\\left(\\kappa\\log\\frac1\\varepsilon\\right)$ 查询和对 $U_b$ 的 $O\\left({\\kappa}/{s}\\right)$ 查询同时准备误差 $\\varepsilon$ 的归一化解。该算法将状态准备与精度细化分开，因此只有矩阵查询计数取决于目标精度。\n\n我们还证明了匹配的相同实例最坏情况下界：对于每个量子线性系统算法和每个解范数尺度，都存在一个厄米特实例，该算法需要 $\\Omega(\\kappa\\log(1/\\varepsilon))$ 矩阵查询和 $\\Omega(\\kappa/s)$ 状态准备查询。因此，两个预言复杂度可以同时优化，并且得到的边界是联合最优的。", "authors": [{"name": "Minbo Gao"}, {"name": "Zhengfeng Ji"}, {"name": "Chenghua Liu"}], "featured_authors": [{"name": "Minbo Gao"}, {"name": "Zhengfeng Ji"}, {"name": "Chenghua Liu"}], "author_count": 3}, {"id": "2609.33700", "category": "quant-ph", "title": "On Embedding Design in Quantum Physics-Informed Neural Networks", "abstract": "Quantum physics-informed neural networks (QPINNs) solve partial differential equations (PDEs) by training parameterized quantum circuits against physics-based residuals, yet the role of the embedding that maps coordinates into quantum states remains insufficiently understood. In this research, we introduce a unified embedding framework that formulates embedding as a functional transformation shaping the feature representation available to the variational circuit, and we propose two embeddings within it. The Linear Quantum Neural Network Trainable Embedding QPINN (LQNN-TE-QPINN) generates data-dependent features with an auxiliary quantum circuit and adds them to the input coordinates, instead of multiplying them as in our previous formulation. The adaptive-frequency QPINN (AdaFreq-QPINN) promotes the frequency-scaling factors of an arccos-Chebyshev encoding to trainable parameters. We evaluate both against direct and fixed analytical frequency encodings and alternative hybrid architectures on one- and two-dimensional Burgers equations. In one dimension, LQNN-TE-QPINN achieves a relative $L_2$ error of 0.0916 with 720 trainable parameters, compared with 0.4501 for direct-encoding QPINN and 0.1233 for a locally adaptive classical physics-informed neural network with approximately eleven times more parameters, while AdaFreq-QPINN attains the lowest error among the analytical embeddings with only four additional parameters. In two dimensions, LQNN-TE-QPINN attains the lowest training objective, although its solution error is not clearly separated from that of a data re-uploading QPINN. Under simulated hardware noise, LQNN-TE-QPINN retains the lowest absolute derivative error while degrading most relative to its noiseless baseline. These results demonstrate that embedding design substantially influences the approximation and optimization behavior of QPINNs.", "url": "https://arxiv.org/abs/2609.33700", "type": "理论+数值", "summary": "量子物理信息神经网络 (QPINN) 通过针对基于物理的残差训练参数化量子电路来求解偏微分方程 (PDE)，但将坐标映射到量子态的嵌入的作用仍然没有得到充分理解。在这项研究中，我们引入了一个统一的嵌入框架，该框架将嵌入表述为一种函数变换，塑造了变分电路可用的特征表示，并且我们在其中提出了两种嵌入。线性量子神经网络可训练嵌入 QPINN (LQNN-TE-QPINN) 使用辅助量子电路生成数据相关特征，并将它们添加到输入坐标，而不是像我们之前的公式那样将它们相乘。自适应频率 QPINN (AdaFreq-QPINN) 将 arccos-Chebyshev 编码的频率缩放因子提升为可训练参数。我们针对一维和二维 Burgers 方程上的直接和固定分析频率编码以及替代混合架构进行评估。\n\n在一维中，LQNN-TE-QPINN 在具有 720 个可训练参数的情况下实现了 0.0916 的相对 $L_2$ 误差，而直接编码 QPINN 的相对 $L_2$ 误差为 0.4501，参数数量大约增加了 11 倍的局部自适应经典物理信息神经网络的相对 $L_2$ 误差为 0.1233，而 AdaFreq-QPINN 仅通过四个附加参数就实现了分析嵌入中的最低误差。在二维中，LQNN-TE-QPINN 达到了最低的训练目标，尽管其解算误差与数据重新上传 QPINN 的解算误差没有明显区分。在模拟硬件噪声下，LQNN-TE-QPINN 保留了最低的绝对导数误差，同时相对于其无噪声基线降级最多。这些结果表明，嵌入设计极大地影响了 QPINN 的近似和优化行为。", "authors": [{"name": "Ban Q. Tran"}, {"name": "Nahid Binandeh Dehaghani"}, {"name": "Susan Mengel"}, {"name": "Rafal Wisniewski"}, {"name": "A. Pedro Aguiar"}], "featured_authors": [{"name": "Ban Q. Tran"}, {"name": "Nahid Binandeh Dehaghani"}, {"name": "Susan Mengel"}, {"name": "Rafal Wisniewski"}, {"name": "A. Pedro Aguiar"}], "author_count": 5}, {"id": "2609.33815", "category": "quant-ph", "title": "Quantum data processing equality", "abstract": "The quantum data processing inequality asserts that quantum relative entropy is monotonically non-increasing under quantum channels. Here, we promote this fundamental inequality to an exact equality via boundary and surface Poisson integral representations across a complex strip. The relative-entropy loss is resolved into two independent, nonnegative physical mechanisms: an operational Petz recovery component governing state reconstructibility, and a boundary term measuring the mismatch of relative modular dynamics. We further express the loss as the measured relative entropy between the original state and its averaged Petz recovery state plus a nonnegative variational remainder. For the Belavkin--Staszewski (BS) loss, analogous integral representations yield a decomposition into negative log Uhlmann fidelity with an averaged reconstruction plus a nonnegative variational remainder. Furthermore, we establish recovery bounds at any prescribed modular parameter, including the canonical unrotated Petz map, with optimal square-root scaling in the relative entropy loss. The prefactors depend on distinct-eigenvalue counts or logarithmic spectral quantities, improving upon the inverse-power dependence on small eigenvalues in previous bounds.", "url": "https://arxiv.org/abs/2609.33815", "type": "理论+数值", "summary": "量子数据处理不等式断言量子相对熵在量子通道下单调不增加。在这里，我们通过复杂条带上的边界和表面泊松积分表示，将这种基本不等式提升为精确等式。相对熵损失被分解为两个独立的、非负的物理机制：一个控制状态可重构性的可操作 Petz 恢复组件，以及一个测量相对模动力学不匹配的边界项。我们进一步将损失表示为原始状态与其平均 Petz 恢复状态之间的测量相对熵加上非负变分余数。对于 Belavkin-Staszewski (BS) 损失，类似的积分表示通过平均重建加上非负变分余数产生负对数 Uhlmann 保真度的分解。此外，我们在任何规定的模块化参数（包括规范的
