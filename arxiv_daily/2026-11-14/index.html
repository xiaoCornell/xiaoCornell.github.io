  <style>
    :root {

    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));

      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }

    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }

    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }

    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2611.14570", "category": "cond-mat", "title": "Quantitative Gaussian limits of periodic O(N) models at and below the critical temperature", "abstract": "We prove a volume-uniform Gaussian approximation for local spin coordinates in the zero-field nearest-neighbour $O(N)$ model on periodic boxes of side $M$ in $d\\ge3$, at and below the critical temperature of the limiting spherical model. On a fixed spatial window, for sufficiently large $M,N$, the unnormalized $1$-Wasserstein error for the first $p\\le N$ coordinates is at most $C\\sqrt p (N^{-1/2}+s_M)$, where $s_M\\to0$ is the spectral shift of the finite-volume mean spherical model. The estimate is uniform on compact ranges of positive directional couplings and inverse temperatures. The target has independent coordinate fields, each a scaled anisotropic Gaussian free field with an independent spatially constant Gaussian term below criticality. On a window containing a nearest-neighbour star (a site and its $d$ positive-direction neighbours), the error tends to zero as $M,N\\to\\infty$ exactly when $p=o(N)$ and $\\sqrt p s_M\\to0$. For any choice of periodic infinite-volume accumulation states, the error on any nonempty fixed window tends to zero as $N\\to\\infty$ exactly when $p=o(N)$. In $d\\ge5$, when the inverse temperature exceeds its critical value by at least a fixed positive amount, the bound improves to $C(p/N+\\sqrt p M^{-d})$. For fixed $p$, the sharp order is $N^{-1}+M^{-d}$ on star-containing windows and $N^{-1}$ on every nonempty fixed window in periodic accumulation states.", "url": "https://arxiv.org/abs/2611.14570", "type": "理论", "summary": "我们证明了在 $d\\ge3$ 中 $M$ 边周期盒上的零场最近邻 $O(N)$ 模型中局部自旋坐标的体积均匀高斯近似，处于或低于极限球面模型的临界温度。在固定空间窗口上，对于足够大的 $M,N$，第一个 $p\\le N$ 坐标的非归一化 $1$-Wasserstein 误差至多为 $C\\sqrt p (N^{-1/2}+s_M)$，其中 $s_M\\to0$ 是有限体积平均球面模型的谱位移。该估计在正方向耦合和逆温度的紧凑范围内是一致的。目标具有独立的坐标场，每个坐标场都是缩放的各向异性高斯自由场，具有低于临界点的独立空间常数高斯项。在包含最近邻恒星（一个站点及其 $d$ 正向邻居）的窗口上，当 $p=o(N)$ 和 $\\sqrt p s_M\\to0$ 时，误差趋于为零，即 $M,N\\to\\infty$。对于任何周期性无限体积累积状态的选择，当 $p=o(N)$ 时，任何非空固定窗口上的误差趋于为零，即 $N\\to\\infty$。\n\n在 $d\\ge5$ 中，当逆温度超过其临界值至少一个固定的正量时，界限会提高到 $C(p/N+\\sqrt p M^{-d})$。对于固定$p$，在包含恒星的窗口上，锐阶为$N^{-1}+M^{-d}$，在周期性累积状态下，在每个非空固定窗口上，锐阶为$N^{-1}$。", "authors": [{"name": "Weiqi Jiang"}, {"name": "Pengcheng Hou"}, {"name": "Zhiyi Li"}], "featured_authors": [{"name": "Weiqi Jiang"}, {"name": "Pengcheng Hou"}, {"name": "Zhiyi Li"}], "author_count": 3}, {"id": "2611.14577", "category": "cond-mat", "title": "Rational layers in the low temperature expansion of the three-dimensional Ising model", "abstract": "A low-temperature expansion orders Ising droplets by wall area, but droplets with different transverse spans can occur at the same order. We instead organize the zero-field simple-cubic model by the excess above the minimum wall area compatible with two prescribed spans. We prove that every fixed excess layer, including all logarithmic cover corrections and Euler inversion, has a rational bivariate generating function with denominator factors restricted to 1 - x, 1 - y and 1 - x - y. The proof compresses repeated coordinate cuts into bounded decorations and assigns each unbounded interval to one monotone chain. A finite controller then enforces induced contacts and arbitrary cover-color reuse. We explicitly assemble the complete layers of excess zero through three over all widths, attributing their known geometric constituents to earlier polyomino enumeration. Exact lattice checks corroborate the formulas. A certified low-temperature comparison shows a modest hybrid accuracy gain at one sampling point and higher evaluation cost. The result establishes an exact layer structure; summation over unbounded excess remains a separate problem.", "url": "https://arxiv.org/abs/2611.14577", "type": "理论", "summary": "低温膨胀按壁面积对伊辛液滴进行排序，但具有不同横向跨度的液滴可以按相同顺序出现。相反，我们通过与两个规定跨度兼容的最小壁面积之上的多余部分来组织零场简单立方模型。我们证明每个固定的多余层，包括所有对数覆盖校正和欧拉反演，都具有一个有理二元生成函数，其分母因子限制为 1 - x、1 - y 和 1 - x - y。该证明将重复的坐标切割压缩为有界装饰，并将每个无界区间分配给一个单调链。然后，有限控制器强制执行感应接触和任意覆盖颜色重用。我们明确地组装了所有宽度上多余的零到三层的完整层，将它们已知的几何成分归因于早期的多骨牌枚举。精确的晶格检查证实了这些公式。经过认证的低温比较显示，一个采样点的混合精度增益适中，且评估成本较高。结果建立了精确的层结构；对无界超额求和仍然是一个单独的问题。", "authors": [{"name": "Ran Huang"}], "featured_authors": [{"name": "Ran Huang"}], "author_count": 1}, {"id": "2611.14597", "category": "cond-mat", "title": "Little-Parks Oscillations and Parity Effects in Mesoscopic Superconducting Rings", "abstract": "We analytically investigate the Little-Parks (LP) effect, the periodic oscillation of the superconducting transition temperature $T_c$ driven by an applied magnetic flux $\\Phi$, from the weak-coupling Bardeen-Cooper-Schrieffer (BCS) limit to the intermediate-coupling regime in a mesoscopic, quasi-one-dimensional ring. Utilizing a Ginzburg-Landau (GL) expansion with twisted boundary conditions, we correctly incorporate both the discrete finite-size topological parity interference and the continuous center-of-mass (CM) kinetic energy shift induced by the supercurrent. We derive a closed-form expression for $T_c(\\Phi)$ valid within the GL framework across variable interaction strengths. We demonstrate that the LP response comprises two distinct physical contributions: a discrete topological parity effect governed by the correlation length ratio $\\xi/R$, and a continuous kinetic energy term scaling as $1/R^2$. As the coupling increases and the spatial correlation length of the pairs contracts ($\\xi \\ll R$), the constituent pairs become geometrically blind to the global boundary constraint, leading to an exponential suppression of the discrete parity modulation. However, the requirement that the condensate acquires a flux-dependent macroscopic CM momentum persists. This ensures that the critical temperature $T_c$ maintains an algebraic LP modulation driven predominantly by the macroscopic kinetic energy of the supercurrent. We bound our theoretical approach by discussing the breakdown of mean-field GL validity before phase fluctuations dominate near the strong-coupling limit.", "url": "https://arxiv.org/abs/2611.14597", "type": "理论", "summary": "我们分析研究了小帕克斯 (LP) 效应，即由外加磁通量 $\\Phi$ 驱动的超导转变温度 $T_c$ 的周期性振荡，从弱耦合 Bardeen-Cooper-Schrieffer (BCS) 极限到介观准一维环中的中间耦合状态。利用具有扭曲边界条件的金茨堡-朗道（GL）展开，我们正确地结合了离散有限尺寸拓扑宇称干涉和超流引起的连续质心（CM）动能移动。我们推导出 $T_c(\\Phi)$ 的封闭式表达式，该表达式在 GL 框架内跨变量交互强度有效。我们证明，LP 响应包括两个不同的物理贡献：由相关长度比 $\\xi/R$ 控制的离散拓扑宇称效应，以及连续动能项缩放为 $1/R^2$。随着耦合的增加和对的空间相关长度的收缩（$\\xi \\ll R$），组成对在几何上变得对全局边界约束视而不见，导致离散奇偶校验调制的指数抑制。\n\n然而，凝聚态获得依赖于通量的宏观CM动量的要求仍然存在。这确保了临界温度 $T_c$ 保持主要由超流的宏观动能驱动的代数 LP 调制。我们通过讨论强耦合极限附近相位波动占主导地位之前平均场 GL 有效性的崩溃来限制我们的理论方法。", "authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "featured_authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "author_count": 2}, {"id": "2611.14609", "category": "cond-mat", "title": "Singlet-triplet superconductivity from repulsive interactions in a $p$-wave magnet", "abstract": "Motivated by recent proposals of $p$-wave magnets, which host odd-parity spin splitting, we study electrons near Van Hove singularities with local repulsive interactions. We demonstrate how the symmetry of the $p$-wave spin splitting governs the competition among instabilities. Using a parquet renormalization group (pRG) analysis of a simple one-sublattice model of a $p$-wave magnet, we find that superconductivity is the leading instability over the entire phase diagram for purely repulsive interactions. The resulting superconducting state is generically a mixture of spin-singlet and spin-triplet pairing and approaches an equal-weight mixture when $T_c$ is small compared with the energy offset between each Van Hove electron and its inversion partner. Extending the pRG analysis to a more realistic two-sublattice model, we find that superconductivity remains the leading instability, while the sublattice degree of freedom leads to a competition among various singlet-triplet pairing channels and even a finite-momentum equal-spin pair-density wave. Our mechanism applies broadly to odd-parity magnets and opens a natural route to nodal topological superconductivity.", "url": "https://arxiv.org/abs/2611.14609", "type": "理论+数值", "summary": "受最近提出的 p$ 波磁体（其具有奇宇称自旋分裂）的推动，我们研究了范霍夫奇点附近具有局部排斥相互作用的电子。我们证明了 $p$ 波自旋分裂的对称性如何控制不稳定性之间的竞争。通过对 $p$ 波磁体的简单单子晶格模型进行 Parquet 重正化群 (pRG) 分析，我们发现超导性是纯排斥相互作用的整个相图上的主要不稳定性。由此产生的超导态通常是自旋单重态和自旋三重态配对的混合物，并且当 $T_c$ 与每个范霍夫电子及其反演伙伴之间的能量偏移相比较小时，接近等重混合物。将pRG分析扩展到更现实的二亚晶格模型，我们发现超导性仍然是主要的不稳定性，而亚晶格自由度导致各种单重态-三重态配对通道之间的竞争，甚至是有限动量等自旋对密度波。我们的机制广泛适用于奇宇称磁体，并为节点拓扑超导开辟了一条自然途径。", "authors": [{"name": "Hanbit Oh"}, {"name": "Laura Classen"}, {"name": "Daniel F. Agterberg"}], "featured_authors": [{"name": "Hanbit Oh"}, {"name": "Laura Classen"}, {"name": "Daniel F. Agterberg"}], "author_count": 3}, {"id": "2611.14615", "category": "cond-mat", "title": "Symmetry-Enabled Rolling of Composite Bosons: A Route to Superconductivity from Strong Repulsion with $T_c$ Proportional to the Electron Bandwidth", "abstract": "Motivated by superconductors discovered in systems with a strong Coulomb repulsion, we ask whether such a repulsion can give rise to superconductivity with a transition temperature $T_c$ bounded only by the electron bandwidth. Coulomb repulsion can produce pairing as it binds electrons to holes. If each hole binds three electrons into a three-electron-one-hole (3e1h) composite, the condensation of these bosonic composites can give rise to superconductivity. However, the resulting $T_c$ falls far below the electron bandwidth in the controlled regime where the binding is much stronger than the carriers' kinetic energy. This is because, on a lattice, a tightly bound composite usually has to move through a higher-order process where the intermediate state costs an energy of order the binding energy, so that the strong binding makes the composite heavy, limiting the superfluid stiffness and hence $T_c$. Here, we show that symmetry offers a way around this tradeoff. In lattices satisfying certain symmetry requirements, a composite can move by single-particle hops without any costly intermediate state, a motion we call rolling. Such rolling keeps the mass of the composite finite even for an infinitely strong binding, so that a $T_c$ proportional to the electron bandwidth can be achieved in the controlled regime. We derive a criterion for rolling and apply it to construct all fourteen minimal lattice models that support such rolling. We show that rollable 3e1h composites can indeed be stabilized in the ground state. We then propose to realize such superconductivity in a dual-gate bilayer, and use exact numerics to show that $T_c$ can reach a few percent of the electron hopping. These results establish rollability as a guiding principle in the search for and design of superconductors in strongly repelling electron systems, with the minimal models constructed here as prototypes.", "url": "https://arxiv.org/abs/2611.14615", "type": "理论", "summary": "受在具有强库仑斥力的系统中发现的超导体的启发，我们询问这种斥力是否可以产生转变温度 $T_c$ 仅受电子带宽限制的超导性。库仑斥力可以在电子与空穴结合时产生配对。如果每个空穴将三个电子结合成三电子一空穴（3e1h）复合材料，这些玻色子复合材料的凝聚可以产生超导性。然而，所得的 $T_c$ 远远低于受控区域中的电子带宽，其中结合比载流子的动能强得多。这是因为，在晶格上，紧密结合的复合材料通常必须经历一个高阶过程，其中中间态消耗结合能的有序能量，因此强结合使复合材料变重，限制了超流体刚度，从而限制了$T_c$。在这里，我们证明对称性提供了一种解决这种权衡的方法。在满足某些对称性要求的晶格中，复合材料可以通过单粒子跳跃移动，而无需任何昂贵的中间状态，这种运动我们称为滚动。\n\n即使对于无限强的结合，这种滚动也能保持复合材料的质量有限，因此可以在受控状态下实现与电子带宽成比例的$T_c$。我们推导了滚动标准，并将其应用于构建支持这种滚动的所有十四个最小晶格模型。我们证明可卷曲的 3e1h 复合材料确实可以在基态下稳定。然后，我们建议在双栅双层中实现这种超导性，并使用精确的数字来表明 $T_c$ 可以达到电子跳跃的百分之几。这些结果将可滚动性确立为强排斥电子系统中超导体搜索和设计的指导原则，并以此处构建的最小模型作为原型。", "authors": [{"name": "Zhiyu Dong"}], "featured_authors": [{"name": "Zhiyu Dong"}], "author_count": 1}, {"id": "2611.14621", "category": "cond-mat", "title": "Hidden universality of rare fluctuations and a central-limit structure at criticality", "abstract": "The central limit theorem is among the most fundamental principles in the natural sciences, governing the fluctuations of sums of weakly correlated random variables through Gaussian statistics. At critical points, however, long-range correlations invalidate this paradigm, raising a fundamental question: does any general limit theorem survive at criticality? Although scale invariance has long been recognised as the defining feature of typical critical fluctuations, the behaviour of rare fluctuations has remained largely unexplored, as their extraordinarily small probabilities place them beyond the reach of conventional numerical methods. Recent theoretical advances suggest that universal asymptotic laws {may govern large deviations in systems at criticality}, yet direct numerical evidence has been lacking. Here we provide the first such evidence in the two-dimensional Ising universality class. Using large-scale Tethered Monte Carlo simulations, we probe order-parameter fluctuations with probabilities as small as $10^{-200}$ and show that, once normalised by their characteristic width, the far tails collapse onto a single asymptotic law shared by distinct microscopic models in the same universality class. This collapse is governed by a universal amplitude, whose numerical extraction is compatible with the conjectured exact result we derive from conformal field theory, and points towards a generalised central limit theorem for critical fluctuations.", "url": "https://arxiv.org/abs/2611.14621", "type": "理论+数值", "summary": "中心极限定理是自然科学中最基本的原理之一，通过高斯统计来控制弱相关随机变量之和的波动。然而，在临界点，长程相关性使这一范式失效，从而提出了一个基本问题：任何一般极限定理在临界点仍然存在吗？尽管尺度不变性长期以来一直被认为是典型临界波动的定义特征，但罕见波动的行为在很大程度上仍未得到探索，因为它们的概率极小，超出了传统数值方法的范围。最近的理论进展表明，普遍渐近定律{可能控制临界系统中的大偏差}，但缺乏直接的数值证据。在这里，我们在二维伊辛普遍性类别中提供了第一个这样的证据。\n\n使用大规模系留蒙特卡罗模拟，我们探测了概率小至 10^{-200}$ 的阶次参数波动，并表明，一旦通过其特征宽度进行归一化，远尾就会崩溃到由同一普遍性类别中的不同微观模型共享的单一渐近定律上。这种塌缩是由通用振幅控制的，其数值提取与我们从共形场论推导出来的精确猜想结果兼容，并指向临界涨落的广义中心极限定理。", "authors": [{"name": "Nikolaos G. Fytas"}, {"name": "Víctor Martín-Mayor"}, {"name": "Attilio L. Stella"}, {"name": "Gianluca Teza"}, {"name": "Alexandros Vasilopoulos"}, {"name": "David Yllanes"}], "featured_authors": [{"name": "Nikolaos G. Fytas"}, {"name": "Víctor Martín-Mayor"}, {"name": "Attilio L. Stella"}, {"name": "Gianluca Teza"}, {"name": "Alexandros Vasilopoulos"}, {"name": "David Yllanes"}], "author_count": 6}, {"id": "2611.14637", "category": "cond-mat", "title": "A discrete realization of the boundary sine-Gordon model and the Schmid transition", "abstract": "The phase diagram of the boundary sine-Gordon model (bsG), or equivalently of the resistively shunted Josephson junction, has been the subject of recent debate. We introduce a discrete model that reproduces exactly the properties of the bsG model and can be simulated extremely efficiently using cluster Monte Carlo algorithms. This enables us to explore a broad range of parameters and compute the complete universal crossover between the weak- and strong-tunneling regimes. We establish the self-duality of the model and unambiguously identify the vertical line of critical fixed points characteristic of the Schmid transition, recovering the conformal field theory predictions along this line with high accuracy. We further clarify the essential distinctions between the Schmid and Berezinskii-Kosterlitz-Thouless transitions. Our results definitively establish the existence and nature of the Schmid transition and demonstrate the validity of the Schmid-Bulgadaev scenario.", "url": "https://arxiv.org/abs/2611.14637", "type": "理论+数值", "summary": "边界正弦戈登模型 (bsG) 的相图，或等效的电阻分流约瑟夫森结的相图，一直是最近争论的主题。我们引入了一种离散模型，它可以准确地再现 bsG 模型的属性，并且可以使用集群蒙特卡罗算法极其有效地进行模拟。这使我们能够探索广泛的参数并计算弱隧道机制和强隧道机制之间的完整通用交叉。我们建立了模型的自对偶性，并明确地识别了施密德转变的临界不动点特征的垂直线，沿着这条线高精度地恢复了共形场理论预测。 We further clarify the essential distinctions between the Schmid and Berezinskii-Kosterlitz-Thouless transitions.我们的结果明确证实了施密德转变的存在和性质，并证明了施密德-布尔加达耶夫情景的有效性。", "authors": [{"name": "Nicolas Paris"}, {"name": "Oscar Bouverot-Dupuis"}, {"name": "Christophe Mora"}], "featured_authors": [{"name": "Nicolas Paris"}, {"name": "Oscar Bouverot-Dupuis"}, {"name": "Christophe Mora"}], "author_count": 3}, {"id": "2611.14722", "category": "cond-mat", "title": "Fatigue crack growth without plasticity under cyclically reversed shear", "abstract": "We show that cyclic fatigue can occur in a system whose elements behave elastically up to an irreversible failure threshold, without plasticity, friction, or any time-dependent process. The model represents a weak interface between two elastic bodies loaded in shear. Under sufficiently large cyclic loading below the static failure threshold, a pre-existing flaw advances progressively, by a few lattice spacings per cycle. Two conditions are needed for this behavior: each bond fails more easily under one sense of the shear than the opposite, and the shear must be reversed during the cycle by an amount large enough to break bonds that have not yet failed. The model thus identifies the minimal conditions for an intrinsic, plasticity-free fatigue mechanism. Such conditions may be met at interfaces and weak planes subjected to strongly reversed shear, as in fretting, rolling contact, and reversed torsion, or in cyclic shear of cemented granular materials.", "url": "https://arxiv.org/abs/2611.14722", "type": "理论+数值", "summary": "我们表明，循环疲劳可能发生在一个系统中，该系统的元件弹性行为达到不可逆失效阈值，没有塑性、摩擦或任何依赖时间的过程。该模型表示两个承受剪切力的弹性体之间的弱界面。在低于静态失效阈值的足够大的循环载荷下，预先存在的缺陷逐渐前进，每个循环几个晶格间距。这种行为需要两个条件：每个键在一种剪切力作用下比在相反的剪切力作用下更容易失效，并且在循环过程中剪切力必须反转足够大以破坏尚未失效的键。因此，该模型确定了固有的无塑性疲劳机制的最低条件。这些条件可能在遭受强烈反向剪切的界面和弱平面处满足，如在微动、滚动接触和反向扭转中，或在胶结颗粒材料的循环剪切中。", "authors": [{"name": "E. A. Jagla"}], "featured_authors": [{"name": "E. A. Jagla"}], "author_count": 1}, {"id": "2611.14727", "category": "cond-mat", "title": "Susceptibility Bottlenecks in Equilibrium Propagation Using Oscillator Ising Machines", "abstract": "Equilibrium propagation (EP) enables learning in physical systems by exploiting the displacement between free and weakly perturbed equilibrium states. Here, we investigate how the underlying oscillator dynamics govern the transmission of learning signals in oscillator Ising machines (OIMs). We show that the hidden-layer response can be decomposed into two distinct factors: the nudging force applied at the output and the susceptibility governing its transmission to the hidden layer. Using a bipartite OIM with interactions interpolating between phase-difference and phase-sum coupling, we investigate these factors while ensuring that all coupling forms realize the same Ising Hamiltonian at binary phase-locked states. We demonstrate that second-harmonic injection primarily influences the nudging force through phase binarization, whereas the coupling form controls the cross-layer susceptibility through the mixed curvature of the energy landscape. At equal mixing, the mixed curvature vanishes on the binary manifold, strongly suppressing hidden-layer learning signals. Numerical simulations validate these mechanisms and reveal their consequences for classification performance. Our findings establish that realizing a desired energy landscape alone is insufficient to ensure effective physical learning; the system must also support the transmission of perturbations required for learning.", "url": "https://arxiv.org/abs/2611.14727", "type": "理论+数值", "summary": "平衡传播（EP）通过利用自由和弱扰动平衡状态之间的位移来实现物理系统中的学习。在这里，我们研究了潜在的振荡器动力学如何控制振荡器伊辛机（OIM）中学习信号的传输。我们表明，隐藏层响应可以分解为两个不同的因素：输出端施加的推动力和控制其传输到隐藏层的敏感性。使用二分 OIM，在相位差耦合和相位和耦合之间进行插值交互，我们研究这些因素，同时确保所有耦合形式在二元锁相状态下实现相同的伊辛哈密顿量。我们证明二次谐波注入主要通过相位二值化影响推动力，而耦合形式通过能量景观的混合曲率控制跨层磁化率。在相等混合时，混合曲率在二元流形上消失，强烈抑制隐藏层学习信号。数值模拟验证了这些机制并揭示了它们对分类性能的影响。\n\n我们的研究结果表明，仅实现理想的能源景观不足以确保有效的体育学习；该系统还必须支持学习所需扰动的传输。", "authors": [{"name": "Malihe Farasat"}, {"name": "Oshada Rathnayake"}, {"name": "Nikhil Shukla"}], "featured_authors": [{"name": "Malihe Farasat"}, {"name": "Oshada Rathnayake"}, {"name": "Nikhil Shukla"}], "author_count": 3}, {"id": "2611.14744", "category": "cond-mat", "title": "Beyond Ground States: Learning Many-Body Hamiltonians for p-Bit Invertible Arithmetic", "abstract": "Probabilistic-bit (p-bit) invertible logic encodes a Boolean relation as an energy whose ground states are its legal assignments, computing in any direction by sampling. Traditional constructions target ground-state membership and a wide minimum energy gap, yet finite-time samplers traverse excited states. We cast Hamiltonian design as inverse statistical mechanics: fit an energy with interactions up to order four whose Gibbs law approaches uniformity on each clamp case's legal states, under a gap floor keeping every legal state below every illegal one. Constrained maximum likelihood with pruning and refitting fits terms from a fixed pool, and every delivered energy is audited exactly on all cases. Each energy is scored by time to a verified solution under restarts with its best of nine tuned samplers. In underdetermined modes, learned multipliers factor in 0.55, 0.44, 0.52 and 0.46 [0.38, 0.56] of the hand-written encodings' updates from 4x4 to 7x7, faster within every family below 7x7 at no resolved work penalty; learned adders solve the reverse mode in 0.71 of the updates at 8 bits and about a quarter at 24 and 32 bits, at 0.55 of the work at 32 bits. At 5x5 under equal pool, budget and floor, a gap-maximizing fit reaches 0.79 [0.73, 0.88] in updates and 1.26 in work against the hand-written encoding, while likelihood fitting takes 0.55 [0.46, 0.58] and 0.58 [0.48, 0.61] of the gap fit's updates and work. Rounding coefficients to the narrowest exact integer words tested, we run both energies at each pair's common word on one FPGA color-sweep SSA core, bit-exact with software: learned multipliers take 0.41 of the hand-written encoding's cycles at 4x4 and 0.057 [0.045, 0.068] at 7x7, at up to 2.4 times its lookup tables. The method requires only a circuit's legal assignments; in determined modes, hand-written encodings take less work, and from 12 bits on the adder fewer updates.", "url": "https://arxiv.org/abs/2611.14744", "type": "理论+数值", "summary": "概率位（p 位）可逆逻辑将布尔关系编码为能量，其基态为其合法分配，通过采样在任意方向进行计算。传统结构的目标是基态成员资格和较宽的最小能隙，但有限时间采样器会遍历激发态。我们将哈密顿设计视为逆统计力学：拟合一种具有高达四阶相互作用的能量，其吉布斯定律在每个钳位情况的合法状态上接近均匀性，在间隙底下保持每个合法状态低于每个非法状态。修剪和改装的约束最大似然符合固定池中的条件，并且在所有情况下对每个传递的能量进行精确审核。每个能量都根据时间进行评分，以在重新启动时使用九个调谐采样器中最好的一个经过验证的解决方案。在欠定模式下，学习乘数将手写编码从 4x4 更新到 7x7 的 0.55、0.44、0.52 和 0.46 [0.38、0.56] 因素考虑在内，在低于 7x7 的每个系列中速度更快，且没有解决工作损失；学习加法器在 8 位时用 0.71 的更新求解反向模式，在 24 和 32 位时用大约四分之一的更新，在 32 位时用 0.55 的更新求解逆向模式。\n\n在相同池、预算和下限的 5x5 下，间隙最大化拟合在更新中达到 0.79 [0.73, 0.88]，在针对手写编码的工作中达到 1.26，而似然拟合需要间隙拟合更新和工作的 0.55 [0.46, 0.58] 和 0.58 [0.48, 0.61]。将系数舍入到测试的最窄精确整数字，我们在一个 FPGA 颜色扫描 SSA 核心上运行每对公共字的能量，使用软件进行位精确：学习乘法器在 4x4 时占用手写编码周期的 0.41，在 7x7 时占用 0.057 [0.045, 0.068]，最多可达其查找表的 2.4 倍。该方法只需要电路的合法分配；在确定的模式下，手写编码需要更少的工作，并且加法器上的 12 位更新更少。", "authors": [{"name": "Tian Feng"}, {"name": "Xutang Fan"}, {"name": "Yiyun Chen"}], "featured_authors": [{"name": "Tian Feng"}, {"name": "Xutang Fan"}, {"name": "Yiyun Chen"}], "author_count": 3}, {"id": "2611.14797", "category": "cond-mat", "title": "Zeroth persistent homology of ground-state correlations at clean and disordered quantum transitions", "abstract": "The antiferromagnetic Ising chain in transverse and longitudinal fields exhibits a continuous critical point, a mixed-order transition line and, with quenched disorder, an infinite-disorder fixed point and reentrant order. Using exact free-fermion solutions and the density-matrix renormalization group, we examine what the zeroth persistent homology of staggered ground-state correlations adds to conventional responses. Its barcode records the merge scales of the single-linkage hierarchy, and the maximum of its persistence-landscape velocity defines a threshold-free pseudocritical point. This point locates the clean critical point and the mixed-order line with an accuracy comparable to conventional responses. In the reentrant regime, the global velocity misplaces the entry, which is recovered only by restricting the filtration to the ordering scale, and none of the tested estimators locates the exit. A domain wall forced by the boundary conditions suppresses the disorder-averaged reentrant lobe. For individual disordered realizations, the labelled merge tree recovers most strong-disorder renormalization-group clusters, including noncontiguous ones missed by lattice-restricted hierarchies, with increasing agreement at stronger disorder. This information resides in the full correlation matrix, while zeroth homology provides a stable, threshold-free hierarchy.", "url": "https://arxiv.org/abs/2611.14797", "type": "理论", "summary": "横向和纵向场中的反铁磁伊辛链表现出连续临界点、混合序过渡线以及淬灭无序、无限无序不动点和重入序。使用精确的自由费米子解和密度矩阵重正化群，我们研究了交错基态相关性的第零个持久同源性对传统响应的影响。它的条形码记录了单链接层次结构的合并尺度，并且其持久景观速度的最大值定义了无阈值的伪临界点。该点以与传统响应相当的精度定位干净临界点和混合阶线。在重入状态下，全局速度错位了入口，只能通过将过滤限制在有序尺度来恢复，并且没有一个经过测试的估计器找到出口。边界条件强制的磁畴壁抑制了无序平均凹凸瓣。\n\n对于个体无序实现，标记的合并树恢复了大多数强无序重整化群簇，包括被格限制层次结构遗漏的不连续簇，并且在更强的无序性方面的一致性不断增加。该信息驻留在完整的相关矩阵中，而零同源性提供了稳定的、无阈值的层次结构。", "authors": [{"name": "Francisco Belchí"}, {"name": "Nahuel Statuto"}], "featured_authors": [{"name": "Francisco Belchí"}, {"name": "Nahuel Statuto"}], "author_count": 2}, {"id": "2611.14809", "category": "cond-mat", "title": "Controlling the Vacuum: Tunable Magnonic Casimir Effect in Magnetic Moiré Systems", "abstract": "We prove that the quantum fluctuations of the magnetic degrees of freedom of moiré structures can be tuned by adjusting the moiré lattice. Using the Bistritzer-MacDonald approach, we explore the consequences of this fact for the magnonic vacuum energy and the magnonic Casimir force, which become functions of the moiré pattern parameters. This allows a prototypical engine to be run with the vacuum fluctuations as a working agent and, in that way, to furnish a novel type of magneto-mechanical effect. Our calculations focus on the moiré Ladder as an example but can be generalized to any moiré structure in a straightforward fashion. We anticipate that our results belong to a generic property of moiré structures, regardless of the physical nature of the excitations at hand.", "url": "https://arxiv.org/abs/2611.14809", "type": "数值", "summary": "我们证明了莫尔结构磁自由度的量子涨落可以通过调整莫尔晶格来调节。使用 Bistritzer-MacDonald 方法，我们探索了这一事实对波角真空能和波角卡西米尔力的影响，它们成为莫尔图案参数的函数。这使得原型发动机能够以真空波动作为工作介质来运行，并以这种方式提供一种新型的磁机械效应。我们的计算重点以莫尔阶梯为例，但可以以简单的方式推广到任何莫尔结构。我们预计我们的结果属于莫尔结构的通用属性，无论当前激励的物理性质如何。", "authors": [{"name": "Alejandro Roldan"}, {"name": "Dante Navarrete"}, {"name": "Mario A. Castro"}, {"name": "Sebastián Allende"}, {"name": "Roberto E. Troncoso"}, {"name": "Alvaro S. Nunez"}], "featured_authors": [{"name": "Alejandro Roldan"}, {"name": "Dante Navarrete"}, {"name": "Mario A. Castro"}, {"name": "Sebastián Allende"}, {"name": "Roberto E. Troncoso"}, {"name": "Alvaro S. Nunez"}], "author_count": 6}, {"id": "2611.14891", "category": "cond-mat", "title": "Optimal Driving between Nonequilibrium Steady States under a Dissipation Budget", "abstract": "Driving between nonequilibrium steady states incurs two thermodynamic costs: excess entropy production (EP) resulting from changing control parameters, and housekeeping EP required to sustain steady currents. Conventional fixed-duration optimization minimizes the former while neglecting the latter. Here, we instead optimize excess EP over both the protocol and its duration subject to a fixed leading order of housekeeping-EP budget, thereby minimizing total EP for that budget constraint. In the slow-driving regime, accumulated housekeeping EP acts as an entropic time, mapping the problem to a geodesic optimization under a friction metric weighted by the steady-state EP rate. This resource-based geometry determines optimal paths and schedules for systems that continue to dissipate even in steady states, establishing an intrinsic trade-off between housekeeping and excess EPs. Near equilibrium, this framework further yields geometric lower bounds on total EP, attained with equipartition at the optimal budget given by a modified thermodynamic length. Numerical simulations of a three-state model for an ATP-driven calcium pump reveal distinct optimal protocols compared to fixed-duration driving, confirming the total-EP bounds.", "url": "https://arxiv.org/abs/2611.14891", "type": "理论+数值", "summary": "在非平衡稳态之间驱动会产生两种热力学成本：控制参数变化导致的过量熵产生 (EP)，以及维持稳定电流所需的内务 EP。传统的固定持续时间优化最大限度地减少了前者，而忽略了后者。在这里，我们根据内务 EP 预算的固定主导顺序优化协议及其持续时间上的多余 EP，从而最小化该预算约束的总 EP。在慢速驾驶状态下，累积的内务 EP 充当熵时间，将问题映射到由稳态 EP 速率加权的摩擦度量下的测地线优化。这种基于资源的几何结构确定了系统的最佳路径和时间表，即使在稳定状态下，系统也会继续耗散，从而在内务处理和过剩 EP 之间建立内在的权衡。接近平衡时，该框架进一步产生总 EP 的几何下限，这是通过在修改后的热力学长度给出的最佳预算下进行均分来实现的。\n\nATP 驱动的钙泵三态模型的数值模拟揭示了与固定持续时间驱动相比不同的最佳方案，从而确认了总 EP 范围。", "authors": [{"name": "Keisuke Sugie"}, {"name": "Dimitri Loutchko"}, {"name": "Tetsuya J. Kobayashi"}], "featured_authors": [{"name": "Keisuke Sugie"}, {"name": "Dimitri Loutchko"}, {"name": "Tetsuya J. Kobayashi"}], "author_count": 3}, {"id": "2611.14915", "category": "cond-mat", "title": "Structural Relaxation in Supercooled Water: Hydrogen-Bond Exchange, Defect Propagation, and Power-Law Scaling", "abstract": "Molecular simulations of deeply supercooled water reveal an intriguing power-law relationship between structural relaxation time and the concentration of a specific three-coordinated hydrogen-bond defect, $3'=H^1O^2$. We develop a reaction--transport theory in which active $3'$ defects propagate through concerted hydrogen-bond rearrangements. An unsatisfied donor hydrogen forms a new bond, creating a transient five-coordinated intermediate; subsequent breaking of another bond transfers the defect to a neighboring molecule. The dynamics includes propagation, self-decay, and encounter-induced annihilation with five-coordinated defects. Independently acting defects yield the mean-field result $\\tau_\\alpha\\propto c_{3'}^{-1}$. By contrast, concentration-dependent propagation, defect interactions, and correlations between successive network rearrangements can generate a larger, noninteger effective exponent $\\alpha_D$. Analytical results and illustrative calculations on a four-connected network show how elementary exchange kinetics, finite defect lifetimes, and repeated exploration of local environments modify the relaxation efficiency and hence the observed power law.", "url": "https://arxiv.org/abs/2611.14915", "type": "理论+数值", "summary": "深度过冷水的分子模拟揭示了结构弛豫时间与特定三配位氢键缺陷浓度之间有趣的幂律关系，$3'=H^1O^2$。我们发展了一种反应-输运理论，其中活跃的 $3'$ 缺陷通过协调的氢键重排传播。未满足的供体氢形成新键，产生瞬态五配位中间体；随后另一个键的断裂会将缺陷转移到邻近的分子。动力学包括传播、自衰变和五配位缺陷的遭遇诱发湮灭。独立作用的缺陷产生平均场结果 $\\tau_\\alpha\\propto c_{3'}^{-1}$。相比之下，浓度依赖性传播、缺陷相互作用以及连续网络重排之间的相关性可以生成更大的非整数有效指数 $\\alpha_D$。四连接网络的分析结果和说明性计算显示了基本交换动力学、有限缺陷寿命和对局部环境的重复探索如何改变弛豫效率，从而改变观察到的幂律。", "authors": [{"name": "Biman Bagchi"}], "featured_authors": [{"name": "Biman Bagchi"}], "author_count": 1}, {"id": "2611.14921", "category": "cond-mat", "title": "The metastability of icosahedral quasicrystals assembled from one-component systems with isotropic interactions", "abstract": "Icosahedral quasicrystals (IQCs) are long-range ordered materials that lack translational periodicity. While they have only been observed in multi-component metallic systems, simulations have shown that one-component IQCs can robustly self-assemble using oscillatory potentials. However, their thermodynamic stability remains an open question. Here, we employ direct coexistence simulations to estimate the melting line of the competing solids for one such family of potentials. We find that the IQCs are never thermodynamically stable within the explored parameter space, being consistently outcompeted by periodic crystalline phases. This metastability is primarily driven by the higher internal energy of the IQC relative to the competing solids. Our findings suggest that the observed formation of these single-component IQCs in simulations is likely a kinetic phenomenon rather than a thermodynamic one.", "url": "https://arxiv.org/abs/2611.14921", "type": "数值", "summary": "二十面体准晶体（IQC）是缺乏平移周期性的长程有序材料。虽然它们仅在多组分金属系统中观察到，但模拟表明单组分 IQC 可以利用振荡电位进行稳健的自组装。然而，它们的热力学稳定性仍然是一个悬而未决的问题。在这里，我们采用直接共存模拟来估计此类势族中竞争固体的熔线。我们发现，IQC 在所探索的参数空间内从来都不是热力学稳定的，始终被周期性结晶相击败。这种亚稳定性主要是由 IQC 相对于竞争固体更高的内能驱动的。我们的研究结果表明，在模拟中观察到的这些单组分 IQC 的形成可能是一种动力学现象，而不是热力学现象。", "authors": [{"name": "Cosmin A. Dicu-Gohoreanu"}, {"name": "Jonathan P. K. Doye"}, {"name": "Eva G. Noya"}], "featured_authors": [{"name": "Cosmin A. Dicu-Gohoreanu"}, {"name": "Jonathan P. K. Doye"}, {"name": "Eva G. Noya"}], "author_count": 3}, {"id": "2611.14957", "category": "cond-mat", "title": "Improving Nonequilibrium Thermal Conduction in CaF2 by Breaking the Phonon Bottleneck Effect", "abstract": "Heat dissipation in laser optical materials depends not only on their thermal conductivity but also on how absorbed energy is redistributed among various phonon modes. In calcium fluoride (CaF2), rapid energy transfer from hot electrons to weakly propagating longitudinal optical (LO) phonons can create a nonequilibrium phonon bottleneck effect that limits efficient heat removal. Here, we propose selective phonon excitation as an effective strategy to break this bottleneck. Combining electron-phonon scattering calculations, phonon Boltzmann transport analysis, and nonequilibrium molecular dynamics simulations, we identify LO phonons as the primary modes that preferentially receive energy from hot carriers, leading to energy accumulation due to their inefficient transport and relaxation. Guided by three-phonon scattering phase-space analysis, selective excitation of transverse acoustic (TA) modes can accelerate LO relaxation and promote energy transfer toward heat-carrying acoustic modes. While sustained LO-phonon excitation reduces the thermal conductivity by approximately 12%, additional TA-mode excitation improves heat conduction by approximately 21% compared to the state limited by the LO-phonon bottleneck, surpassing the unexcited value. These findings demonstrate that controlling interbranch energy redistribution can counteract phonon-bottleneck-induced heat accumulation and reveal a working route for active thermal management in laser optical materials through selective control of phonon populations.", "url": "https://arxiv.org/abs/2611.14957", "type": "数值", "summary": "激光光学材料的散热不仅取决于其热导率，还取决于吸收的能量如何在各种声子模式之间重新分配。在氟化钙 (CaF2) 中，从热电子到弱传播纵向光学 (LO) 声子的快速能量转移会产生非平衡声子瓶颈效应，限制有效散热。在这里，我们提出选择性声子激发作为打破这一瓶颈的有效策略。结合电子声子散射计算、声子玻尔兹曼输运分析和非平衡分子动力学模拟，我们将LO声子确定为优先从热载流子接收能量的主要模式，由于其低效的输运和弛豫而导致能量积累。在三声子散射相空间分析的指导下，选择性激发横声（TA）模式可以加速LO弛豫并促进能量向载热声模式转移。\n\n虽然持续的 LO 声子激励使热导率降低了约 12%，但与受 LO 声子瓶颈限制的状态相比，额外的 TA 模式激励将热导率提高了约 21%，超过了未激励的值。这些发现表明，控制支路间能量重新分配可以抵消声子瓶颈引起的热量积累，并揭示了通过选择性控制声子数量来实现激光光学材料主动热管理的工作途径。", "authors": [{"name": "Mingde Qu"}, {"name": "Minghuan Song"}, {"name": "Yuxing Wang"}, {"name": "Wudi Wang"}, {"name": "Chenbo Zhang"}, {"name": "Jiamin Quan"}, {"name": "Jun Xu"}, {"name": "Zhongwei Zhang"}, {"name": "Jie Chen"}], "featured_authors": [{"name": "Mingde Qu"}, {"name": "Minghuan Song"}, {"name": "Yuxing Wang"}, {"name": "Jun Xu"}, {"name": "Zhongwei Zhang"}, {"name": "Jie Chen"}], "author_count": 9}, {"id": "2611.14991", "category": "cond-mat", "title": "Interplay of the Fano-Andreev Effect and Nonlinear Screening in Electric and Thermoelectric Transport through a T-Shaped Double Quantum Dot", "abstract": "We present a theoretical study of weakly nonlinear electric and thermoelectric transport through a T-shaped double quantum dot coupled to normal and superconducting leads. Nonlinear screening is treated within the characteristic-potential formalism, in which an internal electrostatic potential accounts for nonequilibrium charge redistribution on the lead-coupled central dot. The side-coupled dot induces the Fano-Andreev effect, which, together with nonlinear screening, significantly modifies the transport properties. Under voltage bias, the screening-induced level renormalization produces a pronounced bias asymmetry in the Andreev differential conductance. In response to a pure thermal bias, increasing the interdot coupling weakens the level renormalization and suppresses the quasiparticle thermoelectric response, leading to reduced thermovoltage and nonlinear Seebeck coefficient. When voltage and thermal biases are applied simultaneously, a finite subgap cross thermoelectric response emerges beyond the linear regime. The sign of this response is governed by the competition between the energy-dependent transport contribution, modified by the Fano-Andreev effect, and the nonlinear screening contribution, thereby determining whether a thermal bias enhances or suppresses the low-bias Andreev current.", "url": "https://arxiv.org/abs/2611.14991", "type": "理论", "summary": "我们提出了通过与普通和超导引线耦合的 T 形双量子点弱非线性电和热电传输的理论研究。非线性屏蔽在特征电势形式中进行处理，其中内部静电势解释了铅耦合中心点上的非平衡电荷重新分布。侧面耦合点会引起法诺-安德烈夫效应，该效应与非线性屏蔽一起显着改变传输特性。在电压偏置下，屏蔽引起的电平重整化在安德烈夫微分电导中产生明显的偏置不对称性。为了响应纯热偏置，增加点间耦合会削弱能级重正化并抑制准粒子热电响应，从而导致热电压和非线性塞贝克系数降低。当同时施加电压和热偏置时，会出现超出线性状态的有限子间隙交叉热电响应。\n\n该响应的符号由受法诺-安德烈夫效应修改的能量依赖传输贡献与非线性屏蔽贡献之间的竞争控制，从而确定热偏置是增强还是抑制低偏置安德烈夫电流。", "authors": [{"name": "Sachin Verma"}], "featured_authors": [{"name": "Sachin Verma"}], "author_count": 1}, {"id": "2611.15134", "category": "cond-mat", "title": "Magnetically Compensated Spin-Polarized Edge States in Coplanar Magnets", "abstract": "A boundary can release spin-polarized electronic states from a magnetically compensated, spin-degenerate layer. We establish the symmetry criterion governing this release in coplanar exchange magnets: the allowed even-parity edge-spin space equals the allowed uniform-magnetization space. Symmetry-protected compensation therefore selects an odd spin texture perpendicular to the moment plane. Six maximal sectors organize the possible edge textures. Orthogonal cuts of one exchange model realize odd and even sectors, while FeSe spin-vortex and NiI$_2$ period-four spiral Wannier models provide material realizations. Their semi-infinite boundaries exhibit complementary electrical responses: perpendicular spin accumulation at the odd edge and in-plane spin-current response at the even edge. Boundary symmetry thus connects magnetic compensation to equilibrium spin textures and electrical spin readout.", "url": "https://arxiv.org/abs/2611.15134", "type": "理论", "summary": "边界可以从磁补偿的自旋简并层释放自旋极化电子态。我们建立了控制共面交换磁体中这种释放的对称标准：允许的偶校验边缘自旋空间等于允许的均匀磁化空间。因此，对称保护补偿选择垂直于力矩平面的奇数自旋纹理。六个最大扇区组织可能的边缘纹理。一种交换模型的正交切割实现了奇数扇区和偶扇区，而 FeSe 自旋涡流和 NiI$_2$ 四周期螺旋 Wannier 模型提供了材料实现。它们的半无限边界表现出互补的电响应：奇数边缘处的垂直自旋累积和偶数边缘处的面内自旋电流响应。因此，边界对称性将磁补偿与平衡自旋纹理和电自旋读出联系起来。", "authors": [{"name": "Dinghui Wang"}, {"name": "Lulu Liu"}], "featured_authors": [{"name": "Dinghui Wang"}, {"name": "Lulu Liu"}], "author_count": 2}, {"id": "2611.15152", "category": "cond-mat", "title": "Kitaev Exchange and Altermagnetism in the Double Perovskite Sr$_2$CoTeO$_6$: An Ab Initio Study", "abstract": "The Co$^{2+}$-based double perovskite Sr$_2$CoTeO$_6$ attracts attention due to its nontrivial magnetic properties. \\textit{Ab initio} density functional theory calculations reveal a substantial ferromagnetic Kitaev exchange $|K|\\sim J/3$ between nearest neighbors that, combined with the face-centered cubic lattice, leads to pronounced exchange frustration and places Sr$_2$CoTeO$_6$ among Kitaev materials with moderate Kitaev interaction strength. In addition, Sr$_2$CoTeO$_6$ is found to be altermagnetic with a sizable non-relativistic spin splitting, which can give rise to a transverse piezomagnetic effect and a nontrivial magneto-optical response.", "url": "https://arxiv.org/abs/2611.15152", "type": "理论+数值", "summary": "Co$^{2+}$基双钙钛矿Sr$_2$CoTeO$_6$因其非凡的磁性而引起人们的关注。 \\textit{Ab initio} 密度泛函理论计算表明，最近邻之间存在大量铁磁 Kitaev 交换 $|K|\\sim J/3$，与面心立方晶格相结合，导致明显的交换挫败，并将 Sr$_2$CoTeO$_6$ 置于具有中等 Kitaev 相互作用强度的 Kitaev 材料中。此外，Sr$_2$CoTeO$_6$ 被发现具有交变磁性，具有相当大的非相对论性自旋分裂，这可以产生横向压磁效应和非平凡的磁光响应。", "authors": [{"name": "Alexey V. Ushakov"}, {"name": "Sergey V. Strelsov"}], "featured_authors": [{"name": "Alexey V. Ushakov"}, {"name": "Sergey V. Strelsov"}], "author_count": 2}, {"id": "2611.15183", "category": "cond-mat", "title": "Polymer rigidity controls conformational response to deformation-dependent nonreciprocal interactions", "abstract": "Nonreciprocal interactions, which violate action-reaction symmetry, constitute a broadly applicable mechanism for generating nonequilibrium forces in active and driven systems. Here, we explore how such interactions remodel polymer conformations using a minimal model in which local strain along the backbone gives rise to nonreciprocal forces. We find that bending rigidity is the decisive control parameter: flexible polymers contract under activity, whereas semiflexible polymers display a non-monotonic response that ultimately yields extension. These large-scale conformational changes arise despite only weak shifts in local structural statistics. Instead, activity reassigns bond-orientational correlations along the contour, damping orientational memory in flexible chains while amplifying it in semiflexible ones. Collectively, our results show that bending rigidity governs how deformation-dependent nonreciprocal activity transmits across length scales, offering a mechanism to regulate the structure and mechanics of active filamentous matter.", "url": "https://arxiv.org/abs/2611.15183", "type": "理论", "summary": "非互易相互作用违反了作用-反应对称性，构成了在主动和驱动系统中产生非平衡力的广泛适用的机制。在这里，我们探索这种相互作用如何使用最小模型重塑聚合物构象，其中沿主干的局部应变产生非互易力。我们发现弯曲刚度是决定性的控制参数：柔性聚合物在活动下收缩，而半柔性聚合物表现出非单调响应，最终产生延伸。尽管局部结构统计数据只有微弱的变化，但这些大规模的构象变化还是出现了。相反，活动沿着轮廓重新分配键方向相关性，抑制柔性链中的方向记忆，同时放大半柔性链中的方向记忆。总的来说，我们的结果表明，弯曲刚度控制着变形相关的非互易活动如何在长度尺度上传递，提供了一种调节活性丝状物质的结构和力学的机制。", "authors": [{"name": "Shalabh K. Anand"}], "featured_authors": [{"name": "Shalabh K. Anand"}], "author_count": 1}, {"id": "2611.15200", "category": "cond-mat", "title": "Competing Octahedral Tilting and $B$-Site Off-Centering Govern the Phase Diagram of CsGe$_{1-x}$Sn$_x$Br$_3$ Perovskite Alloys", "abstract": "Lead-free halide perovskites based on Ge and Sn avoid the toxicity of Pb, but the two cations favor different structural distortions. The stereochemically active Ge $4s^2$ lone pair drives polar $B$-site off-centering, whereas the larger Sn$^{2+}$ cation favors octahedral tilting. Here, we map how these two instabilities compete across the full composition range of CsGe$_{1-x}$Sn$_x$Br$_3$ using large-scale molecular dynamics simulations with a charge-aware machine-learned interatomic potential trained on hybrid-functional data. At low temperature the alloy exhibits a morphotropic phase boundary between $x=0.60$ and $0.65$ that separates a ferroelectric monoclinic $Cc$ phase from a monoclinic $P2_1$ phase with mixed antipolar and polar off-centering, with both the tilt pattern and the off-centering order changing discontinuously. The composition-temperature phase diagram reproduces the known transition sequences and temperatures of both end members and reveals an intermediate tetragonal $I4/mcm$ phase near the boundary that has no counterpart in either parent compound. Above the transition temperatures the $B$ cations remain locally off-centered but orientationally disordered. The structural transition at the boundary causes a jump in the band gap at low temperature, whereas at $350$ K the gap decreases smoothly with Sn content. These results establish $B$-site mixing as a means to tune polar and rotational order in lead-free halide perovskites.", "url": "https://arxiv.org/abs/2611.15200", "type": "理论+数值", "summary": "基于Ge和Sn的无铅卤化物钙钛矿避免了Pb的毒性，但这两种阳离子有利于不同的结构扭曲。具有立体化学活性的 Ge $4s^2$ 孤对电子驱动极性 $B$ 位点偏心，而较大的 Sn$^{2+}$ 阳离子有利于八面体倾斜。在这里，我们使用大规模分子动力学模拟以及在混合功能数据上训练的电荷感知机器学习原子间势，绘制了这两种不稳定性如何在 CsGe$_{1-x}$Sn$_x$Br$_3$ 的整个组成范围内竞争。在低温下，合金表现出 $x=0.60$ 和 $0.65$ 之间的同形相界，将铁电单斜 $Cc$ 相与具有混合反极和极性偏心的单斜 $P2_1$ 相分开，倾斜模式和偏心顺序均不连续变化。组成-温度相图再现了两个端元的已知转变序列和温度，并揭示了边界附近的中间四方 $I4/mcm$ 相，该相在任一母体化合物中都没有对应物。高于转变温度时，$B$ 阳离子仍然局部偏心，但方向无序。\n\n边界处的结构转变导致低温下带隙跳跃，而在 350$K 时，带隙随 Sn 含量平滑减小。这些结果确立了 $B$ 位点混合作为调节无铅卤化物钙钛矿中极性和旋转顺序的一种手段。", "authors": [{"name": "Apinya Ngoipala"}, {"name": "Erik Fransson"}, {"name": "Paul Erhart"}, {"name": "Julia Wiktor"}], "featured_authors": [{"name": "Apinya Ngoipala"}, {"name": "Erik Fransson"}, {"name": "Paul Erhart"}, {"name": "Julia Wiktor"}], "author_count": 4}, {"id": "2611.15253", "category": "cond-mat", "title": "Steering Skyrmion Diffusion with Chiral Molecules", "abstract": "Chiral molecules adsorbed on a magnetic film interact with its magnetization and can thereby alter the thermal motion of magnetic skyrmions. Here we develop a theoretical model in which an aligned layer of tilted molecules modifies the interfacial magnetic interactions according to its handedness. Within this model a skyrmion responds only to spatial variations of the coupling, so a uniform layer leaves its position unaffected, whereas boundaries and coverage gradients exert forces on it. Near a chiral region, these forces deflect the skyrmion transversely in a direction that reverses between enantiomers, which provides a direct signature of the chiral interaction. In extended periodic patterns, the same forces reshape the long-time diffusion, suppressing it in the direction in which the potential varies and enhancing it in the perpendicular direction. The net effect on the mean diffusion is set by the balance between the gyrotropic and dissipative responses of the skyrmion, as we show exactly for one-dimensional landscapes. Stochastic micromagnetic simulations and collective-coordinate calculations confirm these predictions and show how molecular orientation, spatial patterning, and skyrmion properties together determine the motion.", "url": "https://arxiv.org/abs/2611.15253", "type": "理论+数值", "summary": "吸附在磁性薄膜上的手性分子与其磁化强度相互作用，从而改变磁性斯格明子的热运动。在这里，我们开发了一个理论模型，其中倾斜分子的对齐层根据其旋向性改变界面磁相互作用。在该模型中，斯格明子仅响应耦合的空间变化，因此均匀层使其位置不受影响，而边界和覆盖梯度对其施加力。在手性区域附近，这些力使斯格明子沿对映体之间相反的方向横向偏转，这提供了手性相互作用的直接特征。在延长的周期图案中，相同的力重塑长时间扩散，在电势变化的方向上抑制它，并在垂直方向上增强它。对平均扩散的净效应是由斯格明子的回旋和耗散响应之间的平衡决定的，正如我们针对一维景观所精确显示的那样。\n\n随机微磁模拟和集体坐标计算证实了这些预测，并显示了分子取向、空间图案和斯格明子特性如何共同决定运动。", "authors": [{"name": "Palina Shaban"}, {"name": "Ulrich Pototschnig"}, {"name": "Gulnaz Rakhmanova"}, {"name": "Mikhail Lemeshko"}, {"name": "Ragheed Alhyder"}], "featured_authors": [{"name": "Palina Shaban"}, {"name": "Ulrich Pototschnig"}, {"name": "Gulnaz Rakhmanova"}, {"name": "Mikhail Lemeshko"}, {"name": "Ragheed Alhyder"}], "author_count": 5}, {"id": "2611.15297", "category": "cond-mat", "title": "Periodic Trends in Oxygen Vacancy Formation Energies Across Binary Main-Group Metal Oxides", "abstract": "The function of oxide materials, from solid-oxide fuel cells to solar thermochemical fuel production, depends on their oxygen vacancies. Their formation energetics have been mapped systematically for ternary perovskites, but reported values for the binary oxides, their conceptual and thermochemical building blocks, remain scattered across studies with differing computational methods. Here we report a systematic r$^2$SCAN density functional theory survey of neutral oxygen vacancy formation energies across 39 binary main-group metal oxide polymorphs spanning groups 1, 2, 13, 14, and 15, using the ShakeNBreak method to locate reconstructed defect ground states. The formation energies span 8 eV and decrease down each group and, for most multivalent cations, with increasing oxidation state. Both trends follow the reducibility of the cation. An interpretable crystal feature model is fit to these energies; its inputs are properties of the pristine bulk, with the reduction potential alternatively taken from tabulated thermochemistry. Retaining only its two dominant descriptors, the crystal reduction potential and the band gap, the model reproduces the formation energies with a held-out mean absolute error of 0.31 eV, lower than that of its four-descriptor parent model for transition-metal perovskites. The bond-breaking and stability terms of the full Born-Haber fit prove statistically null for the binary oxides, and the largest residuals identify the hosts where electron accommodation departs from the cation-reduction picture that the descriptors encode. The dataset provides a benchmark for machine-learning interatomic potentials, and the model estimates vacancy formation energies of main-group oxides from bulk properties alone.", "url": "https://arxiv.org/abs/2611.15297", "type": "理论+数值", "summary": "从固体氧化物燃料电池到太阳能热化学燃料生产，氧化物材料的功能取决于它们的氧空位。三元钙钛矿的形成能量学已被系统地绘制出来，但二元氧化物（其概念和热化学构件）的报告值仍然分散在不同计算方法的研究中。在这里，我们报告了对跨越第 1、2、13、14 和 15 族的 39 种二元主族金属氧化物多晶型物的中性氧空位形成能的系统 r$^2$SCAN 密度泛函理论调查，使用 ShakeNBreak 方法来定位重建的缺陷基态。形成能跨度为 8 eV，并且每个基团向下降低，对于大多数多价阳离子，随着氧化态的增加而降低。两种趋势都遵循阳离子的还原性。可解释的晶体特征模型适合这些能量；它的输入是原始本体的属性，还原电位也可以取自表格热化学。\n\n该模型仅保留两个主要描述符，即晶体还原电势和带隙，以 0.31 eV 的平均绝对误差重现形成能，低于其过渡金属钙钛矿的四描述符母模型。完整的 Born-Haber 拟合的断键项和稳定性项在统计上证明对于二元氧化物来说是无效的，并且最大的残差确定了电子调节偏离描述符编码的阳离子还原图的主体。该数据集为机器学习原子间势提供了基准，并且该模型仅根据块体特性估计主族氧化物的空位形成能。", "authors": [{"name": "Manish Kumar"}, {"name": "Bridget S. Ferris"}, {"name": "Avital Isakov"}, {"name": "Robert B. Wexler"}], "featured_authors": [{"name": "Manish Kumar"}, {"name": "Bridget S. Ferris"}, {"name": "Avital Isakov"}, {"name": "Robert B. Wexler"}], "author_count": 4}, {"id": "2611.15354", "category": "cond-mat", "title": "Interplay of Pair Density Wave and Uniform Superconductivity on the Kagome Lattice", "abstract": "We study the interplay between pair density wave (PDW) and uniform superconductivity on the kagome lattice within a single-orbital $t$-$W$-$J$ model near the $p$-type van Hove filling, where $W$ and $J$ denote effective pairing attractions on lattice sites and nearest-neighbor bonds, respectively. While onsite attraction favors zero-momentum pairing through the conventional BCS instability, nearest-neighbor attraction naturally promotes finite-momentum pairing due to the kagome geometry and sublattice interference. The model therefore provides a framework for exploring the competition and coexistence between uniform superconductivity and PDW order. Self-consistent mean-field calculations in a $2\\times2$ supercell reveal that the uniform component reorganizes both the amplitudes and phase structure of the three $F_1$ PDW components, giving rise to superconducting states absent in the pure bond-pairing limit. A Ginzburg--Landau analysis identifies symmetry-allowed couplings that can favor this reorganization. The resulting states exhibit distinct charge modulations and quasiparticle spectra, while the chiral PDW undergoes topological transitions as the onsite attraction increases. Our results demonstrate how uniform superconductivity reshapes the order-parameter landscape and quasiparticle topology of a PDW state.", "url": "https://arxiv.org/abs/2611.15354", "type": "理论+数值", "summary": "我们研究了 $p$ 型 van Hove 填充附近的单轨道 $t$-$W$-$J$ 模型中的对密度波 (PDW) 和 kagome 晶格上均匀超导性之间的相互作用，其中 $W$ 和 $J$ 分别表示晶格位点和最近邻键上的有效配对吸引力。虽然现场吸引力通过传统的 BCS 不稳定性有利于零动量配对，但由于 kagome 几何结构和亚晶格干扰，最近邻吸引力自然会促进有限动量配对。因此，该模型为探索均匀超导性与PDW有序性之间的竞争与共存提供了一个框架。 $2\\times2$ 超晶胞中的自洽平均场计算表明，均匀分量重组了三个 $F_1$ PDW 分量的振幅和相位结构，从而产生了纯键配对极限中不存在的超导态。金兹堡-兰道分析确定了允许对称的耦合，这有利于这种重组。由此产生的状态表现出独特的电荷调制和准粒子光谱，而手性 PDW 随着现场吸引力的增加而经历拓扑转变。\n\n我们的结果证明了均匀超导如何重塑 PDW 态的有序参数景观和准粒子拓扑。", "authors": [{"name": "Ruiqing Fu"}, {"name": "Xianxin Wu"}, {"name": "Ziqiang Wang"}, {"name": "Sen Zhou"}], "featured_authors": [{"name": "Ruiqing Fu"}, {"name": "Xianxin Wu"}, {"name": "Ziqiang Wang"}, {"name": "Sen Zhou"}], "author_count": 4}, {"id": "2611.15380", "category": "cond-mat", "title": "Anisotropy driven critical phenomena in a van der Waals ferromagnet", "abstract": "We report a detailed investigation into the field-dependent critical behavior of the van der Waals ferromagnet $\\mathrm{Fe_3GeTe_2}$ to elucidate how applied magnetic fields ($B$), strong magnetocrystalline anisotropy, and emerging other energy scales modulate its critical behavior. Utilizing the recently developed method, viz., the average of normalized slope (ANS), for analysis of critical behavior, we evaluate the critical exponents ($\\beta$, $\\gamma$, and $\\delta$) across distinct field windows up to $\\rm{7\\,T}$. For $B$ applied along the crystal's easy axis ($B\\parallel c$), the system exhibits long-range interactions dominated by competing double-exchange and itinerant Ruderman-Kittel-Kasuya-Yosida (RKKY) mechanisms, which is systematically suppressed with increasing $B$ to converge toward the long-range 3D Ising universality class ($\\beta\\sim0.330$, $\\gamma\\sim1.00$). Conversely, under an in-plane hard-axis configuration ($B\\perp c$), the critical behavior study exhibits a sub-unity regime ($\\gamma<1$) across the measured range of $B$. This behavior is attributed to the intense competitive interplay between the external Zeeman energy and strong out-of-plane magnetocrystalline anisotropy. Our findings demonstrate that critical behavior in nontrivial van der Waals magnets is fundamentally modulated by the orientation of $B$ and the strength of magnetocrystalline anisotropy, demonstrating the necessity of $B$-dependent critical behavior investigation over conventional frameworks.", "url": "https://arxiv.org/abs/2611.15380", "type": "理论+数值", "summary": "我们报告了对范德华铁磁体 $\\mathrm{Fe_3GeTe_2}$ 场相关临界行为的详细研究，以阐明外加磁场 ($B$)、强磁晶各向异性和新兴的其他能量尺度如何调节其临界行为。利用最近开发的方法，即归一化斜率平均值 (ANS) 来分析关键行为，我们评估了高达 $\\rm{7\\,T}$ 的不同场窗口中的关键指数（$\\beta$、$\\gamma$ 和 $\\delta$）。对于沿晶体易磁化轴（$B\\parallel c$）应用的 $B$，系统表现出由竞争性双交换和巡回 Ruderman-Kittel-Kasuya-Yosida (RKKY) 机制主导的长程相互作用，随着 $B$ 的增加，系统地抑制该相互作用，以向长程 3D Ising 普适性类别收敛（$\\beta\\sim0.330$、$\\gamma\\sim1.00$）。相反，在面内硬轴配置 ($B\\perp c$) 下，临界行为研究在 $B$ 的测量范围内表现出亚统一状态 ($\\gamma<1$)。\n\n这种行为归因于外部塞曼能量和强面外磁晶各向异性之间的激烈竞争相互作用。我们的研究结果表明，非平凡范德华磁体的关键行为从根本上是由 $B$ 的方向和磁晶各向异性的强度调节的，这证明了在传统框架上进行依赖于 $B$ 的关键行为研究的必要性。", "authors": [{"name": "Neesha Yadav"}, {"name": "Harish Chandr Chauhan"}, {"name": "Pintu Das"}], "featured_authors": [{"name": "Neesha Yadav"}, {"name": "Harish Chandr Chauhan"}, {"name": "Pintu Das"}], "author_count": 3}, {"id": "2611.15409", "category": "cond-mat", "title": "Going beyond the standard quasiparticle picture: Entanglement spreading after quenching from highly entangled states", "abstract": "The quasiparticle picture provides a quantitative description of entanglement spreading after quantum quenches in integrable systems. In interacting models, however, it relies on the assumption that the quench creates entangled pairs of quasiparticles, which is justified only for the so-called integrable initial states. Here we go beyond this setting by studying quenches in the XXZ spin chain from the $n$-rainbow states, a family of macroscopically homogeneous states formed by increasingly long-range Bell pairs, which are not integrable for $n>1$. The local stationary state after the quench approaches the infinite-temperature state as $n\\to\\infty$, with corrections of order $1/n$, as we show analytically. Nevertheless, in the noninteracting XX chain the quench produces entangled multiplets of $2n$ species of quasiparticles. Although interspecies correlations vanish as $1/n$, they strongly suppress the growth of the entanglement entropy, whose rate vanishes as $n\\to\\infty$. We capture this behaviour within a generalized quasiparticle picture. In the interacting XXZ chain, instead, time-dependent density matrix renormalization group (tDMRG) simulations show that the entanglement entropy grows at the rate at which thermodynamic entropy is exchanged across the cut. Within the time scales accessible to tDMRG, the data show no trace of the multiplet suppression. This holds both after homogeneous quenches and after joining the $n$-rainbow state with an infinite-temperature state, for which we conjecture a formula for the von Neumann entropy.", "url": "https://arxiv.org/abs/2611.15409", "type": "理论+数值", "summary": "准粒子图提供了可积系统中量子淬灭后纠缠扩展的定量描述。然而，在相互作用模型中，它依赖于淬灭产生纠缠准粒子对的假设，这仅对于所谓的可积初始态是合理的。在这里，我们超越了这一设置，通过研究来自 $n$ 彩虹态的 XXZ 自旋链中的淬灭，彩虹态是由越来越长程的贝尔对形成的宏观均匀态族，对于 $n>1$ 是不可积的。正如我们分析所示，淬火后的局部稳态接近无限温度状态 $n\\to\\infty$，并进行 $1/n$ 阶的校正。然而，在非相互作用的 XX 链中，猝灭会产生 ​​$2n$ 准粒子的纠缠多重态。尽管种间相关性随着 $1/n$ 消失，但它们强烈抑制了纠缠熵的增长，其速率随着 $n\\to\\infty$ 消失。我们在广义的准粒子图像中捕捉到这种行为。\n\n相反，在相互作用的 XXZ 链中，时间相关的密度矩阵重正化群 (tDMRG) 模拟表明，纠缠熵的增长速度与热力学熵在切口上交换的速度相同。在 tDMRG 可访问的时间尺度内，数据没有显示多重抑制的痕迹。这在均匀淬火之后以及将 $n$-彩虹状态与无限温度状态连接之后都成立，为此我们推测了冯·诺依曼熵的公式。", "authors": [{"name": "Elisa Sabadini"}, {"name": "Vincenzo Alba"}], "featured_authors": [{"name": "Elisa Sabadini"}, {"name": "Vincenzo Alba"}], "author_count": 2}, {"id": "2611.15438", "category": "cond-mat", "title": "Nonlocal multipolar spin accumulation in altermagnets beyond d-wave", "abstract": "In spin-conserving models of $g$- and $i$-wave altermagnets, the uniform longitudinal conductivity has no spin-odd component. A point injector reveals higher moments of the Fermi velocity through the nonlocal spin accumulation. Boltzmann theory predicts that the rank $m=2,4,6$ of the first nonzero spin-odd velocity moment sets the leading angular harmonic, its asymptotic radial dependence $r^{2-m}$, and its amplitude scaling $\\tau^{m-3}$ at fixed distance and injected current. For $g$-wave order, the fourth moment produces a fourth angular harmonic with an asymptotic $r^{-2}$ tail. Quantum transport simulations support the radial profiles predicted by finite-geometry Boltzmann theory without an amplitude fit. Across the three symmetries, the quantum amplitudes exceed the Boltzmann predictions based on the Born scattering time by $15-65$\\% in the windows analyzed. In a two-contact ribbon, we detect the $g$-wave fourth harmonic at $6.8\\,\\sigma$ in an independent set of 1800 disorder realizations using a preselected radial window. Its amplitude decreases when the altermagnetic splitting is reduced.", "url": "https://arxiv.org/abs/2611.15438", "type": "理论+数值", "summary": "在 $g$ 和 $i$ 波交替磁体的自旋守恒模型中，均匀纵向电导率没有自旋奇数分量。点注入器通过非局部自旋积累揭示了费米速度的更高矩。玻尔兹曼理论预测，第一个非零自旋奇数速度矩的秩 $m=2,4,6$ 设置了主导角谐波、其渐近径向相关性 $r^{2-m}$ 及其在固定距离和注入电流下的振幅缩放 $\\tau^{m-3}$。对于 $g$ 波阶，四阶矩产生具有渐近 $r^{-2}$ 尾部的第四角谐波。量子输运模拟支持有限几何玻尔兹曼理论预测的径向分布，无需振幅拟合。在所分析的窗口中，在三种对称性上，量子振幅超出了基于玻恩散射时间的玻尔兹曼预测 $15-65$\\%。在双接触带中，我们使用预选的径向窗口在一组独立的 1800 个无序实现中检测到 $6.8\\,\\sigma$ 处的 $g$ 波第四谐波。当交变磁分裂减少时，其振幅减小。", "authors": [{"name": "J. W. Gonzalez"}], "featured_authors": [{"name": "J. W. Gonzalez"}], "author_count": 1}, {"id": "2611.15504", "category": "cond-mat", "title": "Engineering many-body tunneling dynamics of one-dimensional bosons with finite-core power-law interactions", "abstract": "We investigate the many-body dynamics of a one-dimensional Bose-Josephson junction of ultracold bosons in a box-like potential with a central barrier, interacting via finite-core power-law interactions $V_\\alpha(r)=g/(r^\\alpha+d^\\alpha)$, where $d$ sets the short-distance scale and $\\alpha$ controls the spatial dependence. Using the multiconfigurational time-dependent Hartree method for bosons (MCTDHB), we explore how the interaction profile and strength, barrier, and initial population imbalance shape tunneling dynamics. At weak interaction, increasing $\\alpha$ drives a crossover from Josephson oscillations to dephasing and recurrent rephasing, demonstrating the importance of the interaction kernel's spatial structure. A higher barrier suppresses recurrences, whereas a larger initial imbalance promotes relaxation toward nearly vanishing population imbalance. Increasing interaction strength progressively suppresses population-transfer fluctuations, particularly at larger $\\alpha$. The two-mode extended Bose-Hubbard model captures the dynamics when the lowest orbital in each well dominates, but loses accuracy as additional orbitals become populated. In the strongly interacting regime, many-body spatial structures develop and several natural orbitals are needed for converged dynamics, placing the system beyond a two-mode description. Our results establish the interaction profile and strength, barrier, and initial state as distinct control parameters for coherent, dephasing, recurrent, and suppressed many-body tunneling of one-dimensional bosons. The ability to tailor soft-core interactions via Rydberg dressing offers a promising route to exploring interaction-engineered tunneling in ultracold atoms.", "url": "https://arxiv.org/abs/2611.15504", "type": "理论+数值", "summary": "我们研究了具有中心势垒的盒状势中超冷玻色子一维玻色-约瑟夫森结的多体动力学，通过有限核心幂律相互作用 $V_\\alpha(r)=g/(r^\\alpha+d^\\alpha)$ 进行相互作用，其中 $d$ 设置短距离尺度，$\\alpha$ 控制空间依赖性。使用玻色子的多构型时间相关 Hartree 方法 (MCTDHB)，我们探索了相互作用轮廓和强度、势垒和初始种群不平衡如何塑造隧道动力学。在弱相互作用下，增加 $\\alpha$ 驱动从约瑟夫森振荡到移相和循环重移相的交叉，证明了相互作用核空间结构的重要性。较高的障碍会抑制复发，而较大的初始失衡会促进放松，直至人口失衡几乎消失。增加相互作用强度逐渐抑制人口转移波动，特别是在较大的$\\alpha$ 下。当每个井中的最低轨道占主导地位时，双模扩展 Bose-Hubbard 模型捕获了动态，但随着额外轨道的填充而失去了准确性。\n\n在强相互作用的情况下，多体空间结构发展，并且需要几个自然轨道来实现收敛动力学，使系统超出了两种模式的描述。我们的结果将相互作用轮廓和强度、势垒和初始状态确定为一维玻色子的相干、相干、循环和抑制多体隧道的不同控制参数。通过里德伯敷料定制软核相互作用的能力为探索超冷原子中的相互作用工程隧道提供了一条有前途的途径。", "authors": [{"name": "Abhik Kumar Saha"}, {"name": "Cesare Vianello"}, {"name": "Andrea Trombettoni"}, {"name": "Barnali Chakrabarti"}], "featured_authors": [{"name": "Abhik Kumar Saha"}, {"name": "Cesare Vianello"}, {"name": "Andrea Trombettoni"}, {"name": "Barnali Chakrabarti"}], "author_count": 4}, {"id": "2611.15518", "category": "cond-mat", "title": "Probe Dynamics in Active Baths via Trajectory-Response Relations", "abstract": "Passive probes in active baths can undergo spontaneous motion driven by nonequilibrium forces that depend on probe velocity and interaction geometry. Using trajectory-response relations that express the bath response to a probe in terms of free-particle displacement statistics, we investigate the dynamics of freely moving probes weakly coupled to ideal active baths. The mean force exerted by the bath defines a velocity-space potential whose minima describe the stable states. By analyzing how the mean force depends on the probe velocity, we identify stable resting and moving states and determine the parameter regime in which they coexist. For elliptical interactions, the resting state becomes unstable first along the narrow axis, resulting in direction selection already at the linear-response level. For fourfold interactions, linear friction remains isotropic, while the nonlinear dependence of the mean force on probe velocity selects axial or diagonal motion and produces directional multistability. We further show that the trajectory-response relations extend to higher orders in the probe strength, where multi-interval free-particle trajectory statistics become relevant. For a Gaussian probe, these higher-order terms shift the speed of the stable moving state.", "url": "https://arxiv.org/abs/2611.15518", "type": "理论", "summary": "主动浴中的被动探针可以经历由非平衡力驱动的自发运动，该非平衡力取决于探针速度和相互作用几何形状。使用以自由粒子位移统计来表达浴对探针的响应的轨迹响应关系，我们研究了与理想活性浴弱耦合的自由移动探针的动力学。浴施加的平均力定义了速度空间势，其最小值描述了稳定状态。通过分析平均力如何依赖于探针速度，我们确定了稳定的静止和移动状态，并确定了它们共存的参数状态。对于椭圆相互作用，静止状态首先沿着窄轴变得不稳定，导致方向选择已经处于线性响应水平。对于四重相互作用，线性摩擦保持各向同性，而平均力对探针速度的非线性依赖性选择轴向或对角运动并产生方向多稳定性。我们进一步表明，轨迹响应关系扩展到探测强度的更高阶，其中多区间自由粒子轨迹统计变得相关。\n\n对于高斯探针，这些高阶项会改变稳定移动状态的速度。", "authors": [{"name": "Chul-Ung Woo"}, {"name": "Jiwon Choi"}, {"name": "Heiko Rieger"}], "featured_authors": [{"name": "Chul-Ung Woo"}, {"name": "Jiwon Choi"}, {"name": "Heiko Rieger"}], "author_count": 3}, {"id": "2611.15550", "category": "cond-mat", "title": "Competing lattice instabilities in epitaxially strained BaSnO3", "abstract": "We use density functional theory to map the lattice-dynamical landscape of BaSnO3 under biaxial compressive strain and uncover the hierarchy of structural instabilities. Our results demonstrate that the phase stability of strained BaSnO3 cannot be inferred from the softening of the polar mode alone. Instead it is governed by the competition among lattice instabilities and their anharmonic coupling to structural relaxation. Two-mode energy-surface analyses show that the polar and rotational order parameters interact predominantly competitively. While A- and M-point octahedral rotations become unstable before the zone-center polar mode and dominate the harmonic response for moderate values of strain, they are related to a continuous transition without anharmonic lattice coupling and a moderate gain of energy with strain. Large strain may induce a first order transition to a supertetragonal polar state. Once this state is stabilized, the magnitude of polarization and ferroelectric energy well depth are comparable to BaTiO3 under compressive strain. Furthermore, we discuss how an electric field or electron doping may tip the balance between the different modes and favor of the supertetragonal structure over antipolar and rotational alternatives at a reduced critical strain.", "url": "https://arxiv.org/abs/2611.15550", "type": "理论+数值", "summary": "我们使用密度泛函理论来绘制双轴压缩应变下 BaSnO3 的晶格动力学图谱，并揭示结构不稳定性的层次结构。我们的结果表明，应变 BaSnO3 的相稳定性不能仅从极性模式的软化来推断。相反，它受到晶格不稳定性之间的竞争及其与结构弛豫的非和谐耦合的控制。双模式能量面分析表明，极性和旋转有序参数主要竞争性地相互作用。虽然 A 点和 M 点八面体旋转在区域中心极性模式之前变得不稳定，并且在中等应变值的谐波响应中占主导地位，但它们与无非谐晶格耦合的连续转变以及随应变的适度能量增益有关。大应变可能引起向超四方极性态的一级转变。一旦这种状态稳定，极化强度和铁电能井深度就与压缩应变下的 BaTiO3 相当。\n\n此外，我们讨论了电场或电子掺杂如何打破不同模式之间的平衡，并在降低临界应变的情况下，超四方结构优于反极性和旋转替代结构。", "authors": [{"name": "Benyao Sun"}, {"name": "Anna Grünebohm"}], "featured_authors": [{"name": "Benyao Sun"}, {"name": "Anna Grünebohm"}], "author_count": 2}, {"id": "2611.15594", "category": "cond-mat", "title": "States, localization, and oxidation dynamics in gene segments with CAG repeats", "abstract": "We study coherent quantum-mechanical properties of gene segments with CAG repeats: eigenstates including density of states, mean over time probabilities of finding the hole at each site after initial oxidation at a particular site, mean transfer rates between sites, participation ratios, and inverse participation ratios. The genes are analyzed at the base-pair level within the framework of the Tight-Binding Wire Model. All selected genes share a common feature: a region consisting of multiple repeats of the CAG triplet (referring to a strand in the 5'-3' direction). For each gene, there exists a range of CAG repeat numbers for which the gene remains functional, while values outside this range are associated with pathogenicity. We examine the genes associated with (a) Huntington's disease, (b) Kennedy's disease, (c) Spinocerebellar Ataxia 6, and (d) Spinocerebellar Ataxia 7. These genes differ in the sequences flanking the CAG repeats, as well as in the thresholds separating non-pathogenic and pathogenic repeat lengths. In the literature, the underlying cause of these disorders is attributed to errors in DNA replication, repair and transcription leading to expansion of the triplet repeats. We model both pathogenic and non-pathogenic sequences. We find that periodic CAG regions promote hole delocalization, while primers break periodicity, enhancing localization. This is of purely coherent quantum-mechanical origin, arising from the periodic structure of the CAG repeats and the disruption of periodicity at the primers, and cannot be explained by thermally activated hopping. Finally, transfer depends on oxidation site, e.g., a hole generated at a C-G or G-C site is mainly transferred through other C-G and G-C base pairs, while transfer through A-T sites is much less probable.", "url": "https://arxiv.org/abs/2611.15594", "type": "理论", "summary": "我们研究具有 CAG 重复的基因片段的相干量子力学特性：本征态，包括状态密度、在特定位点初始氧化后在每个位点发现空穴的平均随时间概率、位点之间的平均转移率、参与比率和逆参与比率。在紧结合线模型的框架内对基因进行碱基对水平的分析。所有选定的基因都有一个共同特征：由 CAG 三联体的多个重复组成的区域（指 5'-3' 方向的链）。对于每个基因，存在一定范围的 CAG 重复次数，使该基因保持功能，而超出该范围的值则与致病性相关。我们检查了与 (a) 亨廷顿病、(b) 肯尼迪病、(c) 脊髓小脑共济失调 6 和 (d) 脊髓小脑共济失调 7 相关的基因。这些基因的不同之处在于 CAG 重复序列侧翼的序列，以及分隔非致病性和致病性重复长度的阈值。\n\n在文献中，这些疾病的根本原因是 DNA 复制、修复和转录中的错误导致三联体重复的扩展。我们对致病序列和非致病序列进行建模。我们发现周期性的 CAG 区域促进空穴离域，而引物则打破周期性，增强定位。这是纯粹的相干量子力学起源，由 CAG 重复的周期性结构和引物处的周期性破坏引起，并且不能用热激活的跳跃来解释。最后，转移取决于氧化位点，例如，在C-G或G-C位点产生的空穴主要通过其他C-G和G-C碱基对转移，而通过A-T位点转移的可能性要小得多。", "authors": [{"name": "Gerasimos Papadopoulos"}, {"name": "Constantinos Simserides"}], "featured_authors": [{"name": "Gerasimos Papadopoulos"}, {"name": "Constantinos Simserides"}], "author_count": 2}, {"id": "2611.15677", "category": "cond-mat", "title": "Spin Structure Factor of the classical Ising Model on the Centered Pyrochlore Lattice", "abstract": "We present the spin structure factor of the Ising model on the centered pyrochlore lattice. Generalizing Henley's method [Phys. Rev. B 71, 014424] to the case of inequivalent center and vertex spins, we obtain spin correlation functions that are in excellent agreement with Monte Carlo results and can capture sharp and broadened pinch points, also at finite temperature. Our approach can be extended to other centered lattice structures in classical frustrated magnetism.", "url": "https://arxiv.org/abs/2611.15677", "type": "理论+数值", "summary": "我们提出了居中烧绿石晶格上伊辛模型的自旋结构因子。亨利方法的推广 [Phys. Rev. B 71, 014424]对于不等中心和顶点自旋的情况，我们获得了与蒙特卡罗结果非常一致的自旋相关函数，并且在有限温度下也可以捕获尖锐和加宽的夹点。我们的方法可以扩展到经典受挫磁性中的其他中心晶格结构。", "authors": [{"name": "L. Xu"}, {"name": "T. Kreißel"}, {"name": "N. Davier"}, {"name": "L. D. C. Jaubert"}, {"name": "L. Pollet"}], "featured_authors": [{"name": "L. Xu"}, {"name": "T. Kreißel"}, {"name": "N. Davier"}, {"name": "L. D. C. Jaubert"}, {"name": "L. Pollet"}], "author_count": 5}, {"id": "2611.15739", "category": "cond-mat", "title": "Large deviations of spatial moments of the Kipnis-Marchioro-Presutti lattice gas following a localized energy release", "abstract": "We study the long-time statistics of spatial moments of the time-dependent energy distribution in a one-dimensional Kipnis-Marchioro-Presutti model following an instantaneous release of energy on a single lattice site. The moments are $M_n(T)=\\sum_i x_i^n u_i(T)$, where $u_i(T)$ is the energy at site $i$ at the observation time $T$. Employing macroscopic fluctuation theory (MFT), we calculate the variance of $M_n$ for every positive integer $n$ and determine the non-Gaussian distribution tails for the representative cases $n=1$ and $2$. For the first moment, we establish an exact duality, within MFT, to integrated-current statistics for a deterministic flat initial density. For both $n=1$ and $n=2$, the large-moment tails are dominated by a single adiabatically evolving doublon: a rapidly propagating pair of narrow solitary pulses of the energy density and of the gradient of the conjugate field. The small-second-moment tail is associated with concentration of the energy near the origin at time $T$. Comparing single- and two-doublon histories, we predict a dynamical phase transition at a critical value of $M_2$ at which the optimal path breaks reflection symmetry $x\\to -x$. Numerical solutions obtained by direct minimization of the MFT action establish the second-order character of this transition and support our analytical predictions. Finally, we extend calculations of the large- and small-moment tails to arbitrary $n$ and numerically find a transition of the same type for $n=4$.", "url": "https://arxiv.org/abs/2611.15739", "type": "理论+数值", "summary": "我们研究了一维 Kipnis-Marchioro-Presutti 模型中与时间相关的能量分布的空间矩的长期统计数据，该模型遵循单个晶格位置上的瞬时能量释放。这些矩为 $M_n(T)=\\sum_ix_i^n u_i(T)$，其中 $u_i(T)$ 是观测时间 $T$ 处 $i$ 处的能量。采用宏观波动理论（MFT），我们计算每个正整数$n$的$M_n$的方差，并确定代表情况$n=1$和$2$的非高斯分布尾部。首先，我们在 MFT 内建立了精确的对偶性，以积分电流统计来确定确定性的平坦初始密度。对于 $n=1$ 和 $n=2$，大矩尾部由单个绝热演化的双布朗主导：一对快速传播的能量密度和共轭场梯度的窄孤立脉冲。小二阶矩尾部与 $T$ 时刻原点附近的能量集中有关。比较单双倍隆和双双倍隆的历史，我们预测在 $M_2$ 临界值处的动态相变，此时最佳路径打破反射对称性 $x\\to -x$。\n\n通过直接最小化 MFT 作用获得的数值解建立了该转变的二阶特征并支持我们的分析预测。最后，我们将大矩尾部和小矩尾部的计算扩展到任意$n$，并在数值上找到$n=4$的相同类型的转变。", "authors": [{"name": "Timo Schorlepp"}, {"name": "Baruch Meerson"}, {"name": "Pavel Sasorov"}], "featured_authors": [{"name": "Timo Schorlepp"}, {"name": "Baruch Meerson"}, {"name": "Pavel Sasorov"}], "author_count": 3}, {"id": "2611.15786", "category": "cond-mat", "title": "Evidential Deep Regression for Universal Density Functional Theory Hamiltonian Models", "abstract": "Universal density functional theory (DFT) Hamiltonian models trained across broad chemical and structural spaces offer an efficient route from atomic structure to electronic properties. However, estimating prediction uncertainty alongside fast Hamiltonian predictions remains a challenge. In this work, we present EviDTB, an evidential deep regression approach for tight-binding DFT Hamiltonians that effectively estimates prediction uncertainty in a single forward pass. Compared with deep ensembles, Monte Carlo dropout, and mean-variance estimation (MVE), EviDTB achieves a better balance between computational cost and uncertainty-quantification performance. On 5,478 held-out test structures, EviDTB achieves a full spin--orbit-coupled (SOC) Hamiltonian matrix-element mean absolute error of 0.622meV. Its mean uncertainty per atom correlates with the mean local squared prediction error (Spearman $\\rho=0.812$); removing the 15% most uncertain structures reduces the 99th percentile of this error by 78%, from 16.63 to 3.72eV$^2$. This score offers a practical way to prioritize candidates for first-principles verification. We hope that combining fast Hamiltonian prediction with uncertainty-guided screening will accelerate the search for materials with desirable electronic properties.", "url": "https://arxiv.org/abs/2611.15786", "type": "理论+数值", "summary": "在广泛的化学和结构空间中训练的通用密度泛函理论 (DFT) 哈密顿模型提供了从原子结构到电子特性的有效途径。然而，估计预测不确定性以及快速哈密顿预测仍然是一个挑战。在这项工作中，我们提出了 EviDTB，这是一种用于紧束缚 DFT 哈密顿量的证据深度回归方法，可有效估计单次前向传递中的预测不确定性。与深度集成、蒙特卡罗 dropout 和均值方差估计 (MVE) 相比，EviDTB 在计算成本和不确定性量化性能之间实现了更好的平衡。在 5,478 个保留的测试结构上，EviDTB 实现了 0.622meV 的全自旋轨道耦合 (SOC) 哈密顿矩阵元素平均绝对误差。每个原子的平均不确定性与平均局部平方预测误差相关（Spearman $\\rho=0.812$）；去除 15% 最不确定的结构后，该误差的第 99 个百分位数降低了 78%，从 16.63 降低到 3.72eV$^2$。该分数提供了一种实用的方法来确定第一性原则验证候选人的优先顺序。\n\n我们希望将快速哈密顿预测与不确定性引导筛选相结合将加速寻找具有理想电子特性的材料。", "authors": [{"name": "Jiaxuan Liu"}, {"name": "Yan Zhang"}, {"name": "Caiyuan Ye"}, {"name": "Tiannian Zhu"}, {"name": "Zhong Fang"}, {"name": "Hongming Weng"}, {"name": "Quansheng Wu"}], "featured_authors": [{"name": "Jiaxuan Liu"}, {"name": "Yan Zhang"}, {"name": "Caiyuan Ye"}, {"name": "Zhong Fang"}, {"name": "Hongming Weng"}, {"name": "Quansheng Wu"}], "author_count": 7}, {"id": "2611.15806", "category": "cond-mat", "title": "Heterogeneous ice nucleation with TIP4P/Ice: the role of lattice mismatch", "abstract": "Ice formation, a crucial phase transition for life on Earth, mainly occurs through heterogeneous nucleation on a solid substrate. Despite the importance of this phenomenon, the correlation between the structure of the substrate and its ability to induce ice nucleation remains poorly understood. In this work, we use molecular dynamics simulations with an atomistic model of water to investigate how the lattice mismatch affects the ability of the substrate to nucleate ice. To unambiguously quantify the mismatch, we use substrates with a stretched ice structure. We put the substrate in contact with supercooled water and determine the temperature at which ice spontaneously nucleates during the course of the simulations. We find that the nucleation temperature decreases by $\\sim$ 5-6 K for each percent by which the substrate lattice is stretched relative to that of ice. This trend is similar to that previously obtained with a coarse-grained water model [Camarillo et al., J. Chem. Phys. 160, 134505 (2024)]. \\textcolor{black}{The substrate induces a fluctuating network of subcritical ice-like clusters, from which a spherical-cap-shaped supercritical nucleus eventually emerges stochastically.} Using Classical Nucleation Theory, combine previously reported homogeneous nucleation rates with heterogeneous nucleation rates computed in this work to estimate key heterogeneous nucleation parameters, including the nucleation barrier, the kinetic pre-factor, and the contact angle. The latter is consistent with a microscopic visualization of nucleation trajectories, supporting the applicability of Classical Nucleation Theory to describe a microscopic phenomenon such as heterogeneous ice nucleation.", "url": "https://arxiv.org/abs/2611.15806", "type": "理论+数值", "summary": "冰的形成是地球生命的关键相变，主要通过固体基质上的异质成核发生。尽管这种现象很重要，但基底结构与其诱导冰成核能力之间的相关性仍然知之甚少。在这项工作中，我们使用分子动力学模拟和水原子模型来研究晶格失配如何影响基底使冰成核的能力。为了明确量化不匹配，我们使用具有拉伸冰结构的基底。我们将基底与过冷水接触，并确定模拟过程中冰自发成核的温度。我们发现，基底晶格相对于冰每拉伸 1%，成核温度就会降低 $\\sim$ 5-6 K。这种趋势与之前使用粗粒度水模型获得的趋势类似 [Camarillo 等人，J. Chem.物理。 160, 134505 (2024)]。\n\n\\textcolor{黑色}{基底诱导亚临界冰状团簇的波动网络，最终随机出现球帽形超临界核。}使用经典成核理论，将先前报道的均质成核速率与本工作中计算的异质成核速率相结合，以估计关键的异质成核参数，包括成核势垒、动力学预因子和接触角。后者与成核轨迹的微观可视化一致，支持经典成核理论在描述微观现象（例如异质冰成核）方面的适用性。", "authors": [{"name": "M. Camarillo
