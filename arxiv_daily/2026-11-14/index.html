fluxes. At weak transverse field $h$, this symmetry is spontaneously broken, stabilizing a vison crystal. We argue that this phase is deconfined: fermions, charged under an emergent $\\mathbb{Z}_2$ gauge field, propagate in an ordered $\\pi$-flux background and form a Dirac semimetal. Increasing the transverse field triggers a first-order quantum phase transition to a confined $s$-wave superfluid, at which confinement and global symmetry breaking occur simultaneously. This contrasts with the square lattice, where the corresponding transition is continuous. We extend our analysis to finite temperature and determine the thermal phase boundaries of both ordered phases. The superfluid melts through a Kosterlitz--Thouless transition, whereas the vison crystal undergoes a thermal Ising transition. Together, our results establish the $T \\times h$ phase diagram and demonstrate how the triangular geometry leads to qualitative changes in both the phases and the criticality of the model.", "url": "https://arxiv.org/abs/2611.16988", "type": "理论+数值", "summary": "我们使用辅助场量子蒙特卡罗模拟，研究了半填充时与三角晶格上的费米子耦合的无约束 $\\mathbb{Z}_2$ 规范理论。三角形几何产生了全局 $\\mathbb{Z}_2$ 对称性，它充当了斑块通量上的伊辛对称性。在弱横向场 $h$ 下，这种对称性自发破缺，从而稳定了视觉晶体。我们认为这个阶段是解除限制的：费米子在出现的 $\\mathbb{Z}_2$ 规范场下充电，在有序的 $\\pi$ 通量背景中传播并形成狄拉克半金属。增加横向场会触发向受限$s$波超流体的一阶量子相变，此时约束和全局对称性破缺同时发生。这与方晶格形成对比，方晶格中相应的过渡是连续的。我们将分析扩展到有限温度并确定两个有序相的热相边界。超流体通过科斯特利茨-托利斯转变熔化，而视觉晶体则经历热伊辛转变。\n\n我们的结果共同建立了 $T \\times h$ 相图，并展示了三角形几何结构如何导致模型的相和关键性发生质变。", "authors": [{"name": "Welberth Kennedy"}, {"name": "João C. Inácio"}, {"name": "Fakher F. Assaad"}], "featured_authors": [{"name": "Welberth Kennedy"}, {"name": "João C. Inácio"}, {"name": "Fakher F. Assaad"}], "author_count": 3}, {"id": "2611.17081", "category": "cond-mat", "title": "Theory of critical behavior at non-polar structural phase transitions from functional renormalization", "abstract": "$O(N)$ models provide a versatile framework for describing continuous phase transitions in a wide variety of physical systems. We investigate an extension of these models arising from order parameters that transform under interlocked internal and spatial symmetries which describe transitions towards non-polar structural order. Such order occurs, for instance, in dipolar antiferromagnets, spin-orbit-coupled magnets, non-polar ferroics, and certain nematic systems. The resulting effective theory is an $O(d)$ model with an additional symmetry-allowed kinetic term $h(\\partial_i\\phi_i)^2$, which modifies the relative stiffness of longitudinal and transverse fluctuations. We study both thermal and quantum phase transitions within this $O(d)$ model using the functional renormalization group (FRG). In contrast to conventional $O(N)$ models, the interlocking of internal and spatial symmetries distinguishes spatial and imaginary-time derivatives, such that the quantum model is not simply obtained from the thermal one by a dimensional extension $d\\rightarrow d+1$. We derive and analyze the corresponding FRG flow equations, paying particular attention to the tensor structure of the two-point function, which is essential for consistently extracting the flow of the kinetic terms. Our analysis shows that the additional kinetic coupling is irrelevant at the $O(d)$ Wilson-Fisher fixed point in both thermal and quantum cases, where quantum-to-classical correspondence thus re-emerges. However, its small but sizable correction-to-scaling exponent gives rise to substantial corrections to scaling in the vicinity of the critical point.", "url": "https://arxiv.org/abs/2611.17081", "type": "理论", "summary": "$O(N)$ 模型提供了一个通用框架，用于描述各种物理系统中的连续相变。我们研究了这些模型的扩展，这些模型源于顺序参数，这些参数在互锁的内部和空间对称性下进行变换，描述了向非极性结构顺序的转变。例如，这种顺序出现在偶极反铁磁体、自旋轨道耦合磁体、非极性铁磁性材料和某些向列系统中。由此产生的有效理论是一个 $O(d)$ 模型，带有附加的对称允许动力学项 $h(\\partial_i\\phi_i)^2$，它修改了纵向和横向波动的相对刚度。我们使用函数重正化群 (FRG) 研究此 $O(d)$ 模型中的热相变和量子相变。与传统的 $O(N)$ 模型相比，内部对称性和空间对称性的联锁区分了空间导数和虚时间导数，因此量子模型不是简单地通过维度扩展 $d\\rightarrow d+1$ 从热模型获得的。\n\n我们推导并分析了相应的 FRG 流动方程，特别关注两点函数的张量结构，这对于一致地提取动力学项的流动至关重要。我们的分析表明，在热和量子情况下，额外的动力学耦合在 $O(d)$ Wilson-Fisher 不动点上都是无关紧要的，因此量子与经典的对应关系重新出现。然而，其小但相当大的缩放校正指数引起了对临界点附近的缩放的大量校正。", "authors": [{"name": "Max Fornoville"}, {"name": "Kilian Fraboulet"}, {"name": "Michael M. Scherer"}, {"name": "Laura Classen"}], "featured_authors": [{"name": "Max Fornoville"}, {"name": "Kilian Fraboulet"}, {"name": "Michael M. Scherer"}, {"name": "Laura Classen"}], "author_count": 4}, {"id": "2611.17092", "category": "cond-mat", "title": "Time reparametrization across kinetic rules in a glass-forming liquid", "abstract": "Monte Carlo algorithms combining swap moves with kinetic constraints allow the relaxation pathways of a liquid to be modified without changing its equilibrium measure. Recent work suggests that much of this change can be absorbed into a time reparametrization, yielding a near-collapse of parametric relations between overlaps measured at different spatial scales. We examine this correspondence in a three-dimensional polydisperse hard-sphere liquid by comparing a planar $f_P$ rule that confines the translation of a fraction of particles to randomly oriented planes with a pure-$f_R$ rule that restricts swap participation. At each packing fraction, the two rules are tuned to comparable structural relaxation times, and time is eliminated explicitly. For $0.58 \\leq \\phi \\leq 0.62$, we find a near-collapse accompanied by a small but resolved residual that persists when directly confined particles are excluded from the observable. A self--distinct decomposition shows that the statistics of individual displacements reproduce most of the scale of this residual. Among translationally free particles, the probability of large displacements decreases as the relative directions to constrained neighbors become more aligned with their forbidden normals, even when the number of constrained neighbors is held fixed. This association is consistent with zero in a ghost control, where the same normals impose no translational restriction. Our findings complement the time-reparametrization picture by showing that a near-collapse of collective parametric relations can coexist with rule-dependent displacement statistics and an orientational signature in the mobility of particles that are not directly constrained.", "url": "https://arxiv.org/abs/2611.17092", "type": "理论+数值", "summary": "蒙特卡罗算法将交换移动与动力学约束相结合，允许在不改变其平衡测量的情况下修改液体的弛豫路径。最近的工作表明，这种变化的大部分可以被吸收到时间重新参数化中，从而导致在不同空间尺度上测量的重叠之间的参数关系接近崩溃。我们通过比较平面 $f_P$ 规则（将部分粒子的平移限制为随机定向平面）与限制交换参与的纯 $f_R$ 规则来检查三维多分散硬球液体中的这种对应关系。在每个堆积分数，这两个规则被调整为可比较的结构松弛时间，并且时间被明确地消除。对于 $0.58 \\leq \\phi \\leq 0.62$，我们发现一个接近崩溃的现象，伴随着一个小的但已解决的残差，当直接限制的粒子被排除在可观测范围之外时，该残差仍然存在。自我区分的分解表明，各个位移的统计数据再现了该残差的大部分规模。\n\n在平移自由粒子中，随着受约束邻居的相对方向变得更符合其禁止法线，即使受约束邻居的数量保持固定，大位移的概率也会降低。这种关联与幻影控制中的零一致，其中相同的法线不施加平移限制。我们的研究结果补充了时间重参数化图景，表明集体参数关系的近乎崩溃可以与规则相关的位移统计数据和不受直接约束的粒子移动性的方向特征共存。", "authors": [{"name": "Leonardo dos Santos Vitoria"}], "featured_authors": [{"name": "Leonardo dos Santos Vitoria"}], "author_count": 1}, {"id": "2611.17144", "category": "cond-mat", "title": "A neural quantum state variational Monte Carlo study of Aharonov-Casher bands", "abstract": "We use neural-network-based variational Monte Carlo to investigate the competition between fractional Chern insulators and generalized Wigner crystals in the Aharonov-Casher Hamiltonian, a continuum model for moiré materials. We introduce a variational wave function inspired by flux attachment that captures fractionalized phases and, by comparing its energy with that of a Slater--Jastrow ansatz that captures crystalline phases, we determine the phase diagram at fractional fillings in regimes of strong band mixing and for system sizes beyond the reach of other methods. We find that discrete translation symmetry, encoded in a nonuniform quantum geometry, affects fractionalized states at filling fractions $\\nu=1/3$ and $\\nu=2/3$ differently, and that band mixing can stabilize incommensurate crystalline ground states. Our results further reveal the delicate competition between topological and non-topological crystalline phases.", "url": "https://arxiv.org/abs/2611.17144", "type": "理论+数值", "summary": "我们使用基于神经网络的变分蒙特卡罗来研究阿哈罗诺夫-卡舍尔哈密顿量（莫尔材料的连续介质模型）中分数陈绝缘体与广义维格纳晶体之间的竞争。我们引入了一种受通量附件启发的变分波函数，它捕获了分数化相，并通过将其能量与捕获结晶相的 Slater-Jastrow ansatz 的能量进行比较，我们确定了强带混合状态下分数填充的相图，以及超出其他方法范围的系统尺寸。我们发现，以非均匀量子几何编码的离散平移对称性对填充分数 $\\nu=1/3$ 和 $\\nu=2/3$ 处的分数化状态有不同的影响，并且能带混合可以稳定不相称的晶体基态。我们的结果进一步揭示了拓扑和非拓扑晶相之间的微妙竞争。", "authors": [{"name": "Conor Smith"}, {"name": "Nicolás Morales-Durán"}, {"name": "Jingtian Shi"}, {"name": "Andrew J. Millis"}, {"name": "Miguel A. Morales"}, {"name": "Shiwei Zhang"}], "featured_authors": [{"name": "Conor Smith"}, {"name": "Nicolás Morales-Durán"}, {"name": "Jingtian Shi"}, {"name": "Andrew J. Millis"}, {"name": "Miguel A. Morales"}, {"name": "Shiwei Zhang"}], "author_count": 6}, {"id": "2611.17182", "category": "cond-mat", "title": "Lattice response theory for subsystem symmetry-protected topological phases", "abstract": "We develop a framework to study subsystem symmetry-protected topological (SSPT) phases using lattice response theory. We begin with a systematic construction of spacetime lattice gauge fields from general microscopic $X$-type symmetry actions on qudit systems, including global symmetries, subsystem symmetries, and more general modulated symmetries. Given a gauge-invariant response action, we then construct a corresponding entangler and explicitly show that it implements stacking with the SSPT phase described by the response action. We show that a broad class of SSPT phases can be described by intersection pairings and realized by cluster entanglers. We also study SSPT phases beyond intersection pairings, including those described by subsystem analogues of type-II group cocycles involving the Bockstein homomorphism. We construct a new 3+1d SSPT phase protected by two 2-foliated planar subsystem symmetries and a global 0-form symmetry, whose response action is a subsystem analogue of a type-III cocycle. On its boundary, the 0-form symmetry acts by stacking with a 2+1d linear SSPT phase, signaling a mixed 't Hooft anomaly.", "url": "https://arxiv.org/abs/2611.17182", "type": "理论", "summary": "我们开发了一个框架，使用晶格响应理论来研究子系统对称保护拓扑 (SSPT) 相。我们首先从 qudit 系统上的一般微观 $X$ 型对称作用系统地构建时空晶格规范场，包括全局对称性、子系统对称性和更一般的调制对称性。给定规范不变的响应动作，我们然后构建相应的纠缠器并明确表明它实现了与响应动作描述的 SSPT 相的堆叠。我们表明，一类广泛的 SSPT 相可以通过交叉配对来描述，并通过簇纠缠器来实现。我们还研究了交叉配对以外的 SSPT 相，包括涉及 Bockstein 同态的 II 型群共循环子系统类似物所描述的相。我们构造了一个新的 3+1d SSPT 相，由两个 2 叶平面子系统对称性和全局 0 型对称性保护，其响应动作是 III 型余循环的子系统类似物。在其边界上，0 型对称性通过与 2+1d 线性 SSPT 相叠加起作用，表示混合的 't Hooft 异常。", "authors": [{"name": "Yuki Furukawa"}, {"name": "Takuya Okuda"}], "featured_authors": [{"name": "Yuki Furukawa"}, {"name": "Takuya Okuda"}], "author_count": 2}, {"id": "2611.17188", "category": "cond-mat", "title": "Optimizing Chern Bands for Moore-Read States: A Parent Hamiltonian Approach", "abstract": "The recent realization of fractional quantum anomalous Hall states in moiré materials motivates efforts to stabilize non-Abelian topological order in the absence of a magnetic field. Here, we propose a framework for optimizing interactions to favor the non-Abelian Moore-Read state. Our approach compares band-projected three-particle spectra to that of the Moore-Read parent Hamiltonian, which is defined by a three-body interaction, and quantifies the comparison by defining a cost function that estimates proximity to the ideal Moore-Read limit. We apply our approach to Landau levels and to the Chern bands of twisted MoTe$_2$.", "url": "https://arxiv.org/abs/2611.17188", "type": "理论+数值", "summary": "最近在莫尔材料中实现分数量子反常霍尔态激发了在没有磁场的情况下稳定非阿贝尔拓扑序的努力。在这里，我们提出了一个优化交互的框架，以支持非阿贝尔摩尔读状态。我们的方法将带投影三粒子光谱与由三体相互作用定义的摩尔-里德父哈密顿量光谱进行比较，并通过定义估计接近理想摩尔-里德极限的成本函数来量化比较。我们将我们的方法应用于朗道能级和扭曲 MoTe$_2$ 的陈能带。", "authors": [{"name": "Bishoy M. Kousa"}, {"name": "Yung-Chun Chao"}, {"name": "Jung-Jung Su"}, {"name": "Allan H. MacDonald"}], "featured_authors": [{"name": "Bishoy M. Kousa"}, {"name": "Yung-Chun Chao"}, {"name": "Jung-Jung Su"}, {"name": "Allan H. MacDonald"}], "author_count": 4}, {"id": "2611.17192", "category": "cond-mat", "title": "Cubic, Non-Fermi Liquid Exchange Couplings for Doublet Impurities", "abstract": "We construct non-Fermi liquid (NFL) quantum impurity models for doublet impurities in a cubic metal, involving conduction electrons with half-integer total angular momentum, $J$. We highlight the only two crystal-symmetry-protected NFL quantum impurity models: the spin-half impurity, $J=3/2$ conduction electron Kondo model, and the two-channel Kondo model originally derived in the context of the quadrupolar Kondo model. We show explicitly that the quadrupolar Kondo model preserves time-reversal symmetry. We also construct two cubic quantum impurity models in which NFL behavior is not symmetry-protected. Each has $\\Gamma_8$ and either $\\Gamma_{6}$ or $\\Gamma_{7}$ conduction electrons screening the impurity simultaneously, one model for a non-Kramers doublet and the other for a Kramers doublet impurity ground state. To our knowledge, the latter model has not been considered before; we expect it to realize a new NFL fixed point, but its solution is left for future work. Finally, we derive the relevant cubic perturbation that drives the non-symmetry-protected systems away from their NFL scaling regimes.", "url": "https://arxiv.org/abs/2611.17192", "type": "理论", "summary": "我们为立方金属中的双态杂质构建了非费米液体 (NFL) 量子杂质模型，其中涉及具有半整数总角动量 $J$ 的传导电子。我们重点介绍了仅有的两个受晶体对称性保护的 NFL 量子杂质模型：自旋半杂质、$J=3/2$ 传导电子 Kondo 模型和最初在四极 Kondo 模型背景下导出的双通道 Kondo 模型。我们明确表明四极近藤模型保留了时间反转对称性。我们还构建了两个立方量子杂质模型，其中 NFL 行为不受对称性保护。每个模型都有 $\\Gamma_8$ 和 $\\Gamma_{6}$ 或 $\\Gamma_{7}$ 传导电子同时筛选杂质，一个模型用于非克莱默双峰，另一个模型用于克莱默双峰杂质基态。据我们所知，后一种模型以前没有被考虑过；我们期望它实现一个新的 NFL 定点，但其解决方案留待未来工作。最后，我们推导了相关的三次扰动，该扰动驱动非对称保护系统远离其 NFL 缩放机制。", "authors": [{"name": "Anna I. Tóth"}, {"name": "Davide Marenduzzo"}, {"name": "Andrew D. Huxley"}], "featured_authors": [{"name": "Anna I. Tóth"}, {"name": "Davide Marenduzzo"}, {"name": "Andrew D. Huxley"}], "author_count": 3}, {"id": "2611.17217", "category": "cond-mat", "title": "Integer and Fractional Chern Plateaus Shaped by Layer-Dependent Disorder", "abstract": "The realization of integer and fractional Chern insulators in moiré systems provides a lattice setting for exploring how the structure of Bloch wave functions influences the interplay between topology and disorder. Here we investigate how layer-dependent disorder shapes Hall plateau widths and transitions. Using a realistic three-orbital model of twisted bilayer MoTe$_2$, we compare Hall and bulk transport under onsite-potential, displacement-field, and twist-angle disorder. At equal bare disorder strength, onsite-potential disorder produces broad integer plateaus with nearly direct transitions, whereas displacement-field disorder yields narrow plateaus separated by conducting regions with pronounced Hall-resistance dips. These contrasting behaviors arise from the layer composition of the Bloch states: contributions from different layer under displacement-field disorder partially cancel, weakening the bulk localization. Composite-fermion mean-field theory further yields fractional plateaus at $\\nu_h=2/3$ and $3/5$ with the same disorder dependence of plateau widths. These findings identify layer-dependent disorder as an important mechanism shaping Chern plateau stability in moiré systems beyond bare disorder strength alone.", "url": "https://arxiv.org/abs/2611.17217", "type": "理论", "summary": "莫尔系统中整数和分数陈绝缘体的实现为探索布洛赫波函数的结构如何影响拓扑和无序之间的相互作用提供了一个晶格设置。在这里，我们研究层相关的无序如何塑造霍尔平台宽度和过渡。使用扭曲双层 MoTe$_2$ 的真实三轨道模型，我们比较了现场电势、位移场和扭曲角无序下的霍尔传输和体传输。在相同的裸无序强度下，现场电位无序产生几乎直接转变的宽整数平台，而位移场无序产生由具有明显霍尔电阻下降的导电区域分隔的狭窄平台。这些对比行为源于布洛赫态的层组成：位移场无序下不同层的贡献部分抵消，削弱了体局域化。复合费米子平均场理论进一步在 $\\nu_h=2/3$ 和 $3/5$ 处产生分数平台，并且平台宽度具有相同的无序依赖性。\n\n这些发现表明，层依赖性无序是影响莫尔系统中陈省身稳定性的重要机制，超越了单纯的无序强度。", "authors": [{"name": "Ziyue Qi"}, {"name": "Zhan Wang"}, {"name": "Hongming Weng"}, {"name": "Kun Jiang"}], "featured_authors": [{"name": "Ziyue Qi"}, {"name": "Zhan Wang"}, {"name": "Hongming Weng"}, {"name": "Kun Jiang"}], "author_count": 4}, {"id": "2611.17254", "category": "cond-mat", "title": "Inter-Nanoparticle Repulsion Effect on Self-Organization in Polymer Nanocomposites: A Langevin Dynamics Simulation Study", "abstract": "Demixing through liquid-liquid phase separation is relevant to nanoparticle (NP) aggregation in polymer nanocomposites (PNCs), biomolecular compartmentalization, and liquids embedded in elastic networks. Mixing-demixing phase behavior depends on factors, such as particle size distribution, system dimen-sionality, intermolecular interactions, and relative concentrations. Here, using Langevin Dynamics simu-lations, we systematically investigate the effect of inter-nanoparticle repulsion on the self-assembly of PNCs under extreme confinement. A nanoparticle assembly, in the form of a compact droplet, is immersed in a polymer matrix of semiflexible, rod-like chains. By varying the nanoparticle-nanoparticle repulsion strength, while fixing all other interactions, we identify four distinct regimes with respect to the self-assembled NP morphologies: droplet, slab, crystalline droplet, and dispersed. Cluster-based analysis reveals a progressive loss of nanoparticle droplet integrity, leading to fragmentation within the dispersed regime. Local order of the nanoparticle assembly and global order of polymer chains are gauged through refined descriptors, quantifying the degrees of crystallinity and of nematic order, respectively. Interest-ingly, the slab regime exhibits negligible nanoparticle crystallization yet demonstrates the strongest polymer nematic ordering. In contrast, the crystalline droplet displays extensive triangular close-packed crystallites accompanied by a significant reduction in polymer nematic order, owing to its rhomboid shape. In the dispersed regime, nanoparticle fragmentation facilitates efficient mixing and local smectic-like ordering of the polymer chains. These findings demonstrate that fine-tuning inter-NP repulsions can control self-organization and the resulting morphologies, providing insights into PNCs with tailored functionality.", "url": "https://arxiv.org/abs/2611.17254", "type": "理论+数值", "summary": "通过液-液相分离进行的分层与聚合物纳米复合材料 (PNC) 中的纳米颗粒 (NP) 聚集、生物分子区室化和嵌入弹性网络中的液体有关。混合-分层相行为取决于多种因素，例如粒径分布、系统维度、分子间相互作用和相对浓度。在这里，我们利用 Langevin Dynamics 模拟，系统地研究了极端约束下纳米颗粒间排斥力对 PNC 自组装的影响。将紧密液滴形式的纳米颗粒组件浸入半柔性棒状链的聚合物基质中。通过改变纳米颗粒-纳米颗粒的排斥强度，同时固定所有其他相互作用，我们确定了自组装纳米粒子形态的四种不同状态：液滴、板状、结晶液滴和分散。基于簇的分析揭示了纳米颗粒液滴完整性的逐渐丧失，导致分散区域内的碎片。\n\n纳米颗粒组装体的局部顺序和聚合物链的整体顺序通过精细描述符来测量，分别量化结晶度和向列顺序。有趣的是，平板状态表现出可忽略不计的纳米颗粒结晶，但表现出最强的聚合物向列有序性。相比之下，结晶液滴显示出广泛的三角形密堆积微晶，并且由于其菱形形状，聚合物向列序显着减少。在分散状态下，纳米粒子破碎有利于聚合物链的有效混合和局部近晶状有序化。这些发现表明，微调 NP 间的排斥力可以控制自组织和由此产生的形态，从而为具有定制功能的 PNC 提供见解。", "authors": [{"name": "Paawan Chandrakanth"}, {"name": "Nikos Ch. Karayiannis"}, {"name": "Subhalaxmi Das"}, {"name": "Supriya Roy"}], "featured_authors": [{"name": "Paawan Chandrakanth"}, {"name": "Nikos Ch. Karayiannis"}, {"name": "Subhalaxmi Das"}, {"name": "Supriya Roy"}], "author_count": 4}, {"id": "2611.17257", "category": "cond-mat", "title": "Interactions from memory footprints: Cage-hopping, mnemotaxis & nonreciprocity", "abstract": "Cellular motility is integral to biological processes ranging from foraging to immune responses and cancer metastasis. While cells often navigate by sensing pre-existing environmental cues, many actively steer their future trajectories by remodeling their surroundings via shared, long-lived physicochemical trails called memory footprints. These stigmergic responses to shared footprints also influence large-scale self-organization, such as the early stages of microcolony formation. Despite recent progress, a unified framework connecting single-cell dynamics and collective organization through effective pairwise interactions remains elusive. To bridge this gap, we perform extensive agent-based simulations of an interacting random walk model that explicitly accounts for footprint deposition and decay. Our approach reveals distinct cage-hopping dynamics in solitary cells, as well as complex mnemotactic responses to externally imposed memory gradients. Furthermore, we demonstrate that shared spatial memory fields generate nontrivial effective pairwise interactions, both reciprocal and nonreciprocal, that shape the collective organization of cell populations. Beyond multiscale cellular dynamics, our findings have broader implications for the collective behavior of synthetic active matter, such as swarm robots.", "url": "https://arxiv.org/abs/2611.17257", "type": "理论+数值", "summary": "细胞运动是从觅食到免疫反应和癌症转移等生物过程不可或缺的一部分。虽然细胞通常通过感知预先存在的环境线索进行导航，但许多细胞通过共享的、长期存在的物理化学轨迹（称为记忆足迹）来重塑周围环境，从而主动引导其未来的轨迹。这些对共享足迹的耻辱反应也会影响大规模的自组织，例如微菌落形成的早期阶段。尽管最近取得了进展，但通过有效的成对相互作用连接单细胞动力学和集体组织的统一框架仍然难以实现。为了弥补这一差距，我们对交互随机游走模型进行了广泛的基于代理的模拟，该模型明确地解释了足迹沉积和衰减。我们的方法揭示了孤立细胞中独特的笼子跳跃动力学，以及对外部施加的记忆梯度的复杂记忆反应。此外，我们证明共享空间记忆场会产生非平凡的有效成对相互作用，包括相互的和非相互的，从而塑造细胞群体的集体组织。\n\n除了多尺度细胞动力学之外，我们的发现对合成活性物质（例如群体机器人）的集体行为具有更广泛的影响。", "authors": [{"name": "Jyoti Prasad Banerjee"}, {"name": "Sambodh Sinha"}, {"name": "Shashi Thutupalli"}, {"name": "Rituparno Mandal"}, {"name": "Deb Sankar Banerjee"}], "featured_authors": [{"name": "Jyoti Prasad Banerjee"}, {"name": "Sambodh Sinha"}, {"name": "Shashi Thutupalli"}, {"name": "Rituparno Mandal"}, {"name": "Deb Sankar Banerjee"}], "author_count": 5}, {"id": "2611.17283", "category": "cond-mat", "title": "SiC-BN composites with extreme thermal and environmental stability", "abstract": "Ceramic materials that maintain structural integrity and resist thermal-shock under extreme conditions are critical for many applications. Here we show that spark plasma sintered composites containing equal weight fractions of hexagonal silicon carbide (6H-SiC) and boron nitride (h-BN) exhibit exceptional stability under extreme high-temperature oxidizing conditions and unusually stable temperature-independent thermal conductivity across a broad temperature range. Under high-velocity oxygen-fuel torch exposure in air, it withstands prolonged heating and thermal-cycling at surface temperatures reaching >1500 °C, whereas pure 6H-SiC and h-BN rapidly fractures or erodes. Microstructural evaluation shows the formation of a multi-phase surface silica layer that further protects the material from oxidation. Finite-element analysis heat-flux map shows that intrinsic porosity mitigates thermal stress, while ReaxFF molecular dynamics simulations reveal thermally driven interfacial reconstruction and the formation of a Si-N/C-B-rich bonding network, enhancing the interfacial cohesion at elevated temperatures. This lightweight, easily machinable ceramic composite will be a promising structural material in extreme environment applications.", "url": "https://arxiv.org/abs/2611.17283", "type": "理论+数值", "summary": "在极端条件下保持结构完整性并抵抗热冲击的陶瓷材料对于许多应用至关重要。在这里，我们表明，含有等重量分数的六方碳化硅（6H-SiC）和氮化硼（h-BN）的放电等离子烧结复合材料在极端高温氧化条件下表现出卓越的稳定性，并且在广泛的温度范围内表现出异常稳定的与温度无关的导热性。在高速氧燃料炬暴露在空气中的情况下，它可以在表面温度达到 >1500 °C 的情况下承受长时间的加热和热循环，而纯 6H-SiC 和 h-BN 会迅速破裂或腐蚀。微观结构评估显示多相表面二氧化硅层的形成，进一步保护材料免遭氧化。有限元分析热通量图显示，固有孔隙度可减轻热应力，而 ReaxFF 分子动力学模拟揭示了热驱动的界面重建和富含 Si-N/C-B 的键合网络的形成，从而增强了高温下的界面凝聚力。\n\n这种轻质、易于加工的陶瓷复合材料将成为极端环境应用中很有前途的结构材料。", "authors": [{"name": "Abhijit Biswas"}, {"name": "Eugenio Garcia-Granados"}, {"name": "Saman Zare"}, {"name": "Mozhdeh Mirakhory"}, {"name": "JungHun Park"}, {"name": "Shuvodeep De"}, {"name": "Jessica Reyes"}, {"name": "Hunter B. Schonfeld"}, {"name": "Noah A. Burke"}, {"name": "William Riffe"}, {"name": "Michael S. Lafferty"}, {"name": "Sudaice Kazibwe"}, {"name": "Maryam Amiri"}, {"name": "Shreyasi Chattopadhyay"}, {"name": "Mingrui Xu"}, {"name": "Gelu Costin"}, {"name": "Tanguy Terlier"}, {"name": "Jianhua Li"}, {"name": "Ching-Wu Chu"}, {"name": "Liangzi Deng"}, {"name": "Bharat K. Jasthi"}, {"name": "Manoj Tripathi"}, {"name": "Venkataramana Gadhamshetty"}, {"name": "Gi-Dong Sim"}, {"name": "Kathy Lu"}, {"name": "Adri C. T. van Duin"}, {"name": "Patrick E. Hopkins"}, {"name": "Sanjay Sampath"}, {"name": "Pulickel M. Ajayan"}], "featured_authors": [{"name": "Abhijit Biswas"}, {"name": "Eugenio Garcia-Granados"}, {"name": "Saman Zare"}, {"name": "Patrick E. Hopkins"}, {"name": "Sanjay Sampath"}, {"name": "Pulickel M. Ajayan"}], "author_count": 29}, {"id": "2611.17306", "category": "cond-mat", "title": "Statistics of Fock-space correlation lengths in the many-body localised phase", "abstract": "The presence of long-ranged, many-body resonances in the many-body localised phase of disordered quantum systems is manifest in strong inhomogeneities of eigenstate amplitudes on the Fock space. We develop a quantitative, microscopic theory for this, centred on two-point Fock-space correlation functions. Exact diagonalisation of the disordered tilted-field Ising chain uncovers a stark contrast: typical correlations decay perfectly exponentially, whereas average correlations exhibit subexponential decay with systematic system-size dependence driven by rare resonant nodes. We show that this behaviour stems from an underlying distribution of Fock-space correlation lengths with a variance that scales inversely with system size. Crucially, the interplay of this distribution with the high-dimensional geometry of the hypercubic Fock-space graph, leads to the qualitative difference between the typical and average behaviours. The theory also allows us to derive the singularity spectrum of the many-body localised eigenstates, and to establish theoretically the anomalous symmetry violation of quantum multifractality as an inherent consequence of the Fock-space geometry.", "url": "https://arxiv.org/abs/2611.17306", "type": "理论", "summary": "无序量子系统的多体局域相中存在长程多体共振，这体现在福克空间上本征态振幅的强烈不均匀性。我们为此开发了一种以两点福克空间相关函数为中心的定量微观理论。无序倾斜场伊辛链的精确对角化揭示了鲜明的对比：典型的相关性完全呈指数衰减，而平均相关性则表现出次指数衰减，且由稀有共振节点驱动的系统系统尺寸依赖性。我们表明，这种行为源于 Fock 空间相关长度的基本分布，其方差与系统大小成反比。至关重要的是，这种分布与超立方福克空间图的高维几何的相互作用，导致了典型行为和平均行为之间的质的差异。该理论还使我们能够导出多体局域本征态的奇点谱，并在理论上将量子多重分形的反常对称性破坏确立为福克空间几何的固有结果。", "authors": [{"name": "Bibek Saha"}, {"name": "David E. Logan"}, {"name": "Sthitadhi Roy"}], "featured_authors": [{"name": "Bibek Saha"}, {"name": "David E. Logan"}, {"name": "Sthitadhi Roy"}], "author_count": 3}, {"id": "2611.14612", "category": "hep-th", "title": "When Nonlocal Total Derivatives Are Not Variationally Trivial", "abstract": "We study total time derivatives in infinite-order and nonlocal Lagrangian mechanics. In the formal infinite-order setting, such terms remain variationally trivial. For nonlocal functionals on trajectories, however, exactness in the form $L=DW$ is not sufficient to ensure a vanishing nonlocal Euler-Lagrange expression. We exhibit a smooth convolution-type counterexample.", "url": "https://arxiv.org/abs/2611.14612", "type": "理论", "summary": "我们研究无限阶和非局部拉格朗日力学中的总时间导数。在正式的无限阶设置中，这些项在变分上仍然是微不足道的。然而，对于轨迹上的非局部泛函，$L=DW$ 形式的精确性不足以确保消失的非局部欧拉-拉格朗日表达式。我们展示了一个平滑卷积型反例。", "authors": [{"name": "Carlos Heredia"}], "featured_authors": [{"name": "Carlos Heredia"}], "author_count": 1}, {"id": "2611.14636", "category": "hep-th", "title": "Galilean cosmologies in two dimensions", "abstract": "Inspired by Carroll black holes, we consider the most general theory of Galilean dilaton gravity in two dimensions. We find generically that the solution space describes cosmological spacetimes. From a limiting perspective, these Galilean geometries connect the white and black hole singularities through the bifurcation surface. The latter turns into a Galilean extremal surface in the limit of infinite speed of light. We also discuss aspects of Galilean tachydynamics and find that the entropy is given by the dilaton evaluated at the Galilean extremal surface.", "url": "https://arxiv.org/abs/2611.14636", "type": "理论", "summary": "受卡罗尔黑洞的启发，我们考虑二维伽利略膨胀引力的最普遍理论。我们发现，解空间一般描述了宇宙时空。从有限的角度来看，这些伽利略几何通过分叉面连接白洞和黑洞奇点。后者在无限光速极限下变成伽利略极值面。我们还讨论了伽利略速动力学的各个方面，并发现熵是由在伽利略极值表面评估的膨胀子给出的。", "authors": [{"name": "Daniel Grumiller"}, {"name": "Kai-Yu Zhang"}], "featured_authors": [{"name": "Daniel Grumiller"}, {"name": "Kai-Yu Zhang"}], "author_count": 2}, {"id": "2611.14670", "category": "hep-th", "title": "A cubic closed string field theory", "abstract": "The action of closed bosonic string field theory is non-polynomial, and for more than thirty years a no-go theorem of Sonoda and Zwiebach (1990) has excluded a cubic formulation with a single string field, a symmetric vertex and the canonical propagator. We evade it with a Hubbard--Stratonovich transformation and provide an explicit construction of a cubic closed string field theory at all orders. The transformation introduces an infinite tower of auxiliary $k$-string fields $\\Sigma_k$, entering at order $g_s^{2 k - 2}$, which turn the vertices with four or more legs into kinetic terms and cubic couplings. The action is cubic, at most quadratic in each auxiliary field, and triangular: eliminating the auxiliary fields by Gaussian integrals recovers the original action order by order at tree level, under invertibility and kernel conditions on the auxiliary kinetic operators. The original gauge symmetry lifts to the cubic action with no new parameter, and we argue that the auxiliary fields add no physical state at generic momentum, wherever their kinetic operators are invertible. On the worldsheet, $\\Sigma_2$ is an entangled two-string state: by an operator product expansion, the quartic form reduces to a gluing of two asymmetric cubic vertices dressed by the motion of the local coordinates and defined on states without level matching. We expect this picture to generalize to higher orders, defining a gluing of patches carrying $k$ punctures each. The string vertices, read as products with several outputs, satisfy an extended form of the genus-zero $\\mathrm{IBL}_\\infty$ relations, including operations with no input or no output, exactly when the string products form a cyclic $L_\\infty$ algebra. Finally, we compare our action with the bar--cobar construction of Chiaffrino, Mamade and Zwiebach.", "url": "https://arxiv.org/abs/2611.14670", "type": "理论", "summary": "封闭玻色弦场理论的作用是非多项式的，三十多年来，Sonoda 和 Zwiebach（1990）的不可行定理已经排除了具有单弦场、对称顶点和正则传播子的三次公式。我们用哈伯德-斯特拉托诺维奇变换来避免它，并提供所有阶次的三次闭弦场论的显式构造。该变换引入了辅助 $k$ 串场 $\\Sigma_k$ 的无限塔，按顺序 $g_s^{2 k - 2}$ 进入，这将具有四个或更多腿的顶点转换为动力学项和三次耦合。每个辅助场的作用是三次的，最多是二次的，并且是三角形的：在辅助动力学算子的可逆性和核条件下，通过高斯积分消除辅助场可以在树级别按顺序恢复原始作用顺序。原始的规范对称性在没有新参数的情况下提升到立方作用，并且我们认为辅助场在通用动量下不会添加物理状态，只要它们的动力学算子是可逆的。\n\n在世界表上，$\\Sigma_2$ 是一个纠缠的双串状态：通过算子乘积展开，四次形式简化为由局部坐标的运动修饰的两个不对称立方顶点的粘合，并在没有级别匹配的状态上定义。我们期望这张图能够推广到更高阶，定义每个带有 $k$ 穿孔的补丁的粘合。字符串顶点，读作具有多个输出的乘积，满足属零 $\\mathrm{IBL}_\\infty$ 关系的扩展形式，包括没有输入或没有输出的操作，恰好当字符串乘积形成循环 $L_\\infty$ 代数时。最后，我们将我们的动作与 Chiaffrino、Mamade 和 Zwiebach 的 bar-cobar 结构进行比较。", "authors": [{"name": "Harold Erbin"}], "featured_authors": [{"name": "Harold Erbin"}], "author_count": 1}, {"id": "2611.14688", "category": "hep-th", "title": "Anatomy of AdS black hole on-shell actions", "abstract": "We revisit the regularized on-shell actions of rotating electrically charged AdS black holes of gauged supergravity via holographic renormalization and background subtraction, with a particular emphasis on the frame in which the radial cutoff is placed. For holographic renormalization, the asymptotically global AdS frame, recently employed in seven dimensions, works equally well in five and six dimensions: the renormalized on-shell action of the AdS$_d$ black holes with $S^1\\times S^{d-2}$ conformal boundaries satisfies the quantum statistical relation, up to a parameter-independent Casimir term in odd dimensions, and thereby places the holographic comparisons that so far relied on this relation on a first-principles footing. Background subtraction, in contrast, fails to reproduce this result in the same frame; the mismatch, which we identify exactly in terms of the Casimir term and the counterterms, demands a criterion for the cutoff surface yet to be established. For precision holography, our results settle the choice of frame for holographic renormalization with conformally flat boundaries and delineate the ambiguities that remain in background subtraction and in holographic renormalization for boundaries that are not conformally flat.", "url": "https://arxiv.org/abs/2611.14688", "type": "理论", "summary": "我们通过全息重正化和背景减法重新审视了测量超重力的旋转带电 AdS 黑洞的正则化壳内行为，特别强调了径向截止所在的框架。对于全息重正化，最近在七维中使用的渐近全局 AdS 框架在五维和六维中同样有效：具有 $S^1\\times S^{d-2}$ 共形边界的 AdS$_d$ 黑洞的重正化壳上作用满足量子统计关系，直到奇数维度中参数无关的卡西米尔项，从而将迄今为止依赖于该关系的全息比较置于第一原则立足点。相比之下，背景减法无法在同一帧中再现此结果。我们根据卡西米尔项和反项准确识别了这种不匹配，需要一个尚未建立的截断面标准。\n\n对于精密全息术，我们的结果解决了具有共形平坦边界的全息重整化框架的选择，并描绘了背景减法和非共形平坦边界的全息重整化中保留的模糊性。", "authors": [{"name": "Junho Hong"}, {"name": "Sourav Roychowdhury"}], "featured_authors": [{"name": "Junho Hong"}, {"name": "Sourav Roychowdhury"}], "author_count": 2}, {"id": "2611.14721", "category": "hep-th", "title": "Time Advances and Dispersive Constraints in Dressed Gravitational Scattering", "abstract": "We derive a low energy group time advance in 4D dressed gravitational scattering at leading eikonal order with full soft dependence for a sharp dressing profile of finite soft scale. Dispersive matching of nonnegative absorption excludes the amplitude's analytic crossing with high energy boundedness. This reflects internal scales growing with energy via string diffusion in quantum gravity and high energy nonlinear graviton rescattering, coupled to soft clouds beyond leading soft order. Interference preserving joint detection of hard particles and coherent soft radiation may reveal the advance.", "url": "https://arxiv.org/abs/2611.14721", "type": "理论", "summary": "我们推导了 4D 修饰引力散射的低能群时间超前，其处于领先的 eikonal 阶，具有完全的软依赖性，以获得有限软尺度的锐利修饰轮廓。非负吸收的色散匹配排除了振幅与高能量有界性的解析交叉。这反映了内部尺度通过量子引力中的弦扩散和高能非线性引力子再散射与能量一起增长，并与领先软序之外的软云耦合。硬粒子和相干软辐射的抗干扰联合检测可能会揭示这一进展。", "authors": [{"name": "Ziyu Dong"}], "featured_authors": [{"name": "Ziyu Dong"}], "author_count": 1}, {"id": "2611.14772", "category": "hep-th", "title": "Self-gravitating spinning mesonic tubes", "abstract": "In this paper, we construct new self-gravitating solutions for the four-dimensional $SU(2)$ Einstein non-linear sigma model and the Einstein-Skyrme model, both minimally coupled to the Maxwell field, which describes spinning pulsed mesonic tubes. These solutions are gyratonic in the sense that they are characterized by a propagation axis and possess angular momentum. The gyratonic solutions are described by a smooth matter distribution, which is free of curvature singularities. The maximum of the energy density is concentrated on a tube around the propagation axis. We first consider the $SU(2)$ non-linear sigma model minimally coupled to General Relativity and the Maxwell field, constructing asymptotically flat, spinning, pulsed gyratonic solutions. Subsequently, we include the Skyrme term in the analysis. In this case, we show that in order to maintain the resolvability of the matter field equations, the spacetime must be asymptotically de Sitter. It is also shown that, despite the fact that the total topological charge is zero, these solutions possess a non-zero topological charge density.", "url": "https://arxiv.org/abs/2611.14772", "type": "理论", "summary": "在本文中，我们为四维 $SU(2)$ Einstein 非线性 sigma 模型和 Einstein-Skyrme 模型构建了新的自引力解，两者都与麦克斯韦场最小耦合，麦克斯韦场描述了旋转脉冲介子管。这些解是回旋的，因为它们以传播轴为特征并具有角动量。回旋解由平滑的物质分布描述，不存在曲率奇点。能量密度的最大值集中在传播轴周围的管上。我们首先考虑 $SU(2)$ 非线性 sigma 模型与广义相对论和麦克斯韦场的最小耦合，构建渐近平坦、旋转、脉冲回旋解。随后，我们将 Skyrme 项纳入分析中。在这种情况下，我们表明，为了保持物质场方程的可解性，时空必须渐近德西特。还表明，尽管总拓扑电荷为零，但这些解决方案具有非零拓扑电荷密度。", "authors": [{"name": "Alex Giacomini"}, {"name": "Marcela Lagos"}, {"name": "Seung Hun Oh"}, {"name": "Aldo Vera"}], "featured_authors": [{"name": "Alex Giacomini"}, {"name": "Marcela Lagos"}, {"name": "Seung Hun Oh"}, {"name": "Aldo Vera"}], "author_count": 4}, {"id": "2611.14793", "category": "hep-th", "title": "On Tunnel Fusion and Yangian $R$-matrices", "abstract": "XXX spin-chain Hamiltonians can be derived within the $R$-matrix formalism. For a simple Lie algebra $\\mathfrak{g}$, the rational $R$-matrix $R$ intertwines the coproduct $\\Delta$ in the Yangian $\\mathsf{Y}(\\mathfrak{g})$. $R$ admits a particular Gauss decomposition $R=LDU$, where the upper-triangular matrix $U$ can be obtained from the lower-triangular matrix $L$. We treat $U$ in three ways. Algebraically, $U$ is known as a factorization twist. It plays the role of a ``universalizer'': it conjugates a non-universal pseudo-coproduct $\\mathscr{D}$ in the molten crystal chain basis to the true Yangian coproduct $\\Delta=U^{-1}\\mathscr{D} U$. Physically, $U$ can be obtained as a Berry phase in SUSY quiver QFT for a quiver associated with the Dynkin diagram of $\\mathfrak{g}$. In this case, $U$ is calculated as a sum over tunneling amplitudes. Geometrically, $U$ can be interpreted as a renormalized Maulik-Okounkov stable envelope localized at a fixed point. In the physical setting, the Yang-Baxter equation (YBE), which ensures integrability, follows from the flatness of the Berry connection, which in turn follows from supersymmetry. However, the YBE imposes subtle constraints on the tunneling amplitudes, which we examine here. We construct recursion relations that allow higher collective amplitudes to be obtained from more elementary ones. We observe that different tunneling channels are in fact intertwined, leading to finer cancellations among amplitudes and to wall-crossing phenomena: depending on the parameters, the same amplitude is represented as a sum over different channels. We focus on $\\mathsf{Y}(\\mathfrak{sl}_2)$ with higher-spin and non-evaluation representations, as well as on the fundamental representation of $\\mathsf{Y}(\\mathfrak{sl}_{n+1})$.", "url": "https://arxiv.org/abs/2611.14793", "type": "理论", "summary": "XXX 自旋链哈密顿量可以在 $R$ 矩阵形式中导出。对于简单的李代数$\\mathfrak{g}$，有理$R$-矩阵$R$与Yangian$\\mathsf{Y}(\\mathfrak{g})$中的余积$\\Delta$交织在一起。 $R$ 允许特定的高斯分解 $R=LDU$，其中上三角矩阵 $U$ 可以从下三角矩阵 $L$ 获得。我们以三种方式对待$U$。在代数上，$U$ 被称为因式分解。它扮演着“通用化器”的角色：它将熔融晶体链基础中的非通用伪余积$\\mathscr{D}$与真正的Yangian余积$\\Delta=U^{-1}\\mathscr{D} U$共轭。物理上，$U$ 可以作为 SUSY 箭袋 QFT 中的 Berry 相获得，用于与 $\\mathfrak{g}$ 的 Dynkin 图相关的箭袋。在这种情况下，$U$ 计算为隧道振幅之和。从几何角度来说，$U$ 可以解释为位于固定点的重正化 Maulik-Okounkov 稳定包络线。在物理环境中，确保可积性的杨-巴克斯特方程 (YBE) 源自贝里连接的平坦度，而贝里连接又源自超对称性。\n\n然而，YBE 对隧道振幅施加了微妙的限制，我们在这里进行了研究。我们构建递归关系，允许从更基本的振幅中获得更高的集体振幅。我们观察到，不同的隧道通道实际上是交织在一起的，导致振幅之间更精细的抵消和穿墙现象：根据参数，相同的振幅表示为不同通道上的总和。我们关注具有更高自旋和非评估表示的 $\\mathsf{Y}(\\mathfrak{sl}_2)$ 以及 $\\mathsf{Y}(\\mathfrak{sl}_{n+1})$ 的基本表示。", "authors": [{"name": "Dmitry Galakhov"}], "featured_authors": [{"name": "Dmitry Galakhov"}], "author_count": 1}, {"id": "2611.14799", "category": "hep-th", "title": "Casimir Attraction and Repulsion in a Magnetic Domain-Wall Background", "abstract": "We study the one-loop Casimir interaction between two $\\delta$--$\\delta'$ plates in the fixed one-soliton Pöschl--Teller background of the sine-Gordon kink. The transverse fluctuation problem is the Gaussian truncation of an $S^2$ sigma model, equivalently an easy-axis antiferromagnet with a domain wall, in which the plates exert no classical force on the wall. For $v\\ge2|w|$ the fluctuation operators are non-negative, and strictly stable couplings, $v>2|w|$, also exclude zero modes, so the quadratic field theory is consistent at the fixed sine-Gordon mass. The background-dressed relative determinant factorises exactly into effective, gradient-dependent strengths of the two plates, and the sign of each frequency channel of the interaction energy is fixed by their orientation. Two identical, equally oriented, strictly stable plates switch from attraction near the kink to repulsion away from it under a rigid translation at fixed couplings and separation. The interaction energy and the force conjugate to the separation neither share their sign everywhere nor change sign at the same positions: there are regions of negative energy and repulsive force, so attraction and repulsion must be read from the force. For such plates with $w\\neq0$ the force is repulsive at short and attractive at large separation, and the interaction energy has a minimum at a separation that depends on the position of the pair. For $v=1.05$, $w=0.5$ and $d=1.5$ the energy changes sign at $c\\simeq-0.44$ and $2.63$, and the force at $c\\simeq-0.30$ and $2.00$.", "url": "https://arxiv.org/abs/2611.14799", "type": "理论", "summary": "我们研究了正弦戈登扭结的固定单孤子 Pöschl-Teller 背景中两个 $\\delta$--$\\delta'$ 板之间的单环卡西米尔相互作用。横向涨落问题是 $S^2$ sigma 模型的高斯截断，相当于具有磁畴壁的易轴反铁磁体，其中板不对壁施加经典力。对于 $v\\ge2|w|$ ，涨落算子是非负的，并且严格稳定的耦合 $v>2|w|$ 也排除零模式，因此二次场论在固定的正弦戈登质量下是一致的。背景处理的相对行列式精确地分解为两个板的有效的、梯度相关的强度，并且相互作用能量的每个频率通道的符号由它们的方向固定。两个相同、方向相同、严格稳定的板在固定耦合和分离处的刚性平移下从扭结附近的吸引转变为远离扭结的排斥。\n\n相互作用能和与分离共轭的力既不会在任何地方共享它们的符号，也不会在相同位置改变符号：存在负能量和排斥力的区域，因此必须从力中读取吸引力和排斥力。对于具有 $w\\neq0$ 的此类板，力在短距离时为排斥力，在大距离时为吸引力，并且相互作用能在取决于配对位置的距离处具有最小值。对于 $v=1.05$、$w=0.5$ 和 $d=1.5$，能量在 $c\\simeq-0.44$ 和 $2.63$ 处变化符号，力在 $c\\simeq-0.30$ 和 $2.00$ 处变化。", "authors": [{"name": "Inés Cavero-Peláez"}, {"name": "Beatriz Gómez-López"}, {"name": "Jose M. Muñoz-Castañeda"}, {"name": "Gonzalo Sancho-Garrido"}], "featured_authors": [{"name": "Inés Cavero-Peláez"}, {"name": "Beatriz Gómez-López"}, {"name": "Jose M. Muñoz-Castañeda"}, {"name": "Gonzalo Sancho-Garrido"}], "author_count": 4}, {"id": "2611.15070", "category": "hep-th", "title": "Solving spectral flow in AdS$_3$: from covering maps to pencils", "abstract": "Strings in AdS$_3$ with pure NS-NS flux are described by the exactly solvable SL(2,$\\mathbb{R}$) WZW model, yet correlators of winding strings, given by spectrally flowed operators, were so far known only up to three points. We obtain all of them, for any number of insertions and windings, in terms of unflowed correlators, proving the four-point conjecture of Dei and Eberhardt. The key ingredient is a pencil of rational maps from the worldsheet to the boundary which exists for generic insertion points, unwinds all insertions at once, and collapses to the covering map when the latter exists.", "url": "https://arxiv.org/abs/2611.15070", "type": "理论", "summary": "AdS$_3$ 中具有纯 NS-NS 通量的弦由精确可解的 SL(2,$\\mathbb{R}$) WZW 模型描述，但由谱流算子给出的缠绕弦的相关器迄今为止仅已知三个点。对于任意数量的插入和缠绕，我们根据不流动相关器获得了所有这些，证明了 Dei 和 Eberhardt 的四点猜想。关键成分是从世界表到边界的理性地图铅笔，该边界存在通用插入点，立即展开所有插入，并在后者存在时折叠到覆盖地图。", "authors": [{"name": "Sergio Iguri"}, {"name": "Nicolas Kovensky"}, {"name": "Julian H. Toro"}], "featured_authors": [{"name": "Sergio Iguri"}, {"name": "Nicolas Kovensky"}, {"name": "Julian H. Toro"}], "author_count": 3}, {"id": "2611.15072", "category": "hep-th", "title": "Solitons of the intermediate long wave equation with residue source", "abstract": "We revisit the bilinear formulation of the intermediate long-wave (ILW) equation by interpreting its principal-value integrals in the framework of Sato hyperfunctions. When the tau-functions have no zeros inside the relevant contours, the conventional source-free ILW equation is recovered. When zeros enter the contours, their residue contributions must instead be retained, leading naturally to a residue-extended ILW system with self-consistent sources determined by the tau-functions themselves. We introduce a residue index that counts the zeros enclosed in each analytic strip and use it to classify the resulting soliton sectors. The conventional elevation-soliton belongs to the zero-residue sector, whereas depression-solitons and higher elevation branches generally carry non-zero residue indices. Exact one- and multisoliton tau-functions are constructed, including mixed elevation--depression configurations with factorised two-body interactions. Their residue indices are additive and remain invariant during collisions, provided that no zero crosses a contour boundary. A Fourier-space analysis shows that the soliton spectra decay exponentially at large wavenumbers, with a decay rate determined by the distance of the nearest complex singularity from the real axis. This rate vanishes as an odd-multiple boundary between adjacent residue sectors is approached, providing a direct spectral signature of the transition between them.", "url": "https://arxiv.org/abs/2611.15072", "type": "理论", "summary": "我们通过在 Sato 超函数框架中解释其主值积分来重新审视中长波 (ILW) 方程的双线性公式。当 tau 函数在相关轮廓内没有零点时，传统的无源 ILW 方程被恢复。当零进入等值线时，必须保留它们的残差贡献，自然导致残差扩展 ILW 系统，其具有由 tau 函数本身确定的自洽源。我们引入了一个残差索引，它对每个分析带中包含的零进行计数，并用它来对所得的孤子扇区进行分类。传统的仰角孤子属于零残差扇区，而凹陷孤子和更高仰角分支通常带有非零残差指数。构建了精确的单孤子和多孤子 tau 函数，包括具有因式分解的两体相互作用的混合高低配置。它们的残差指数是相加的，并且在碰撞期间保持不变，前提是没有零跨越轮廓边界。\n\n傅立叶空间分析表明，孤子光谱在大波数下呈指数衰减，衰减率由最近的复奇点距实轴的距离决定。当接近相邻残留扇区之间的奇数倍边界时，该速率消失，提供了它们之间过渡的直接光谱特征。", "authors": [{"name": "Yuto Ishii"}, {"name": "Atsushi Nakamula"}, {"name": "Soma Yoshida"}], "featured_authors": [{"name": "Yuto Ishii"}, {"name": "Atsushi Nakamula"}, {"name": "Soma Yoshida"}], "author_count": 3}, {"id": "2611.15147", "category": "hep-th", "title": "$n$-Gon Correlators in $d$-dimensions", "abstract": "We study the analytic structure of scalar one-loop cosmological $n$-gon correlators using an integrand-level reduction and a Baikov representation adapted to linear tube-energy denominators. At spatial dimension $d=n$, we determine the algebraic factors that normalize their local leading singularities to unity and construct explicit $d\\log$ forms for arbitrary $n$. For the complete box at $d=n=4$, we evaluate an external-energy discontinuity in a collinear kinematic family and find a nonvanishing complete elliptic integral of the second kind after summing all time orderings. We also compare successive tube-energy discontinuities in $d=3$ and $d=4$, and relate selected tube cuts to the cosmological dressing representation. These results illustrate the importance of integration domains in determining the analytic structure beyond local leading singularities.", "url": "https://arxiv.org/abs/2611.15147", "type": "理论", "summary": "我们使用被积函数级约简和适用于线性管能量分母的 Baikov 表示来研究标量单环宇宙学 $n$-gon 相关器的解析结构。在空间维度 $d=n$ 处，我们确定将其局部主导奇点归一化为统一的代数因子，并为任意 $n$ 构造显式 $d\\log$ 形式。对于 $d=n=4$ 处的完整框，我们评估共线运动学族中的外部能量不连续性，并在对所有时间排序求和后找到第二类非零完全椭圆积分。我们还比较了 $d=3$ 和 $d=4$ 中连续的管能量不连续性，并将选定的管切割与宇宙学敷料表示联系起来。这些结果说明了积分域在确定超越局部领先奇点的分析结构中的重要性。", "authors": [{"name": "Yong-Xiang Su"}, {"name": "Dongyu Yang"}], "featured_authors": [{"name": "Yong-Xiang Su"}, {"name": "Dongyu Yang"}], "author_count": 2}, {"id": "2611.15173", "category": "hep-th", "title": "Canonical Commutation Relations and Poisson Brackets with Non-locality in Time", "abstract": "We study the canonical structure of a string-inspired model in which the kinetic term couples fields at times separated by a finite shift $\\sigma$, with a coupling $\\lambda$ to a fixed background. From the boundary term in the variation of the action, we construct a conserved symplectic form and derive the positive-time Poisson bracket. Using the Schwinger--Dyson relation, we show that at positive time separation $s$ the commutator equals $i\\hbar$ times this bracket. The canonical normalization $\\hbar$ appears as a jump of the commutator expectation value at $s=\\sigma$, which is equal time for shifted variables with a local kinetic term; for $0<s<\\sigma$ the commutator vanishes for every $\\lambda>0$. Hence $\\lambda\\to0$ at fixed $\\sigma$ does not reproduce the free commutator on this interval, whereas $\\sigma\\to0$ at fixed $\\lambda$ recovers the local commutator at every fixed $s>0$.", "url": "https://arxiv.org/abs/2611.15173", "type": "理论", "summary": "我们研究了弦启发模型的规范结构，其中动力学项有时耦合由有限位移 $\\sigma$ 分隔的场，并将 $\\lambda$ 耦合到固定背景。从作用变化中的边界项，我们构造了守恒辛形式并推导了正时间泊松括号。使用 Schwinger--Dyson 关系，我们表明在正时间间隔 $s$ 时，换向器等于 $i\\hbar$ 乘以这个括号。规范归一化 $\\hbar$ 表现为换向器期望值在 $s=\\sigma$ 处的跳跃，这对于具有局部动力学项的移位变量来说是相等的时间；对于 $0<s<\\sigma$，换向器对于每个 $\\lambda>0$ 消失。因此，固定 $\\sigma$ 处的 $\\lambda\\to0$ 不会在此间隔上再现自由换向器，而固定 $\\lambda$ 处的 $\\sigma\\to0$ 会在每个固定 $s>0$ 处恢复本地换向器。", "authors": [{"name": "Yasu Gen"}, {"name": "Hiroaki Matsunaga"}, {"name": "Jojiro Totsuka"}], "featured_authors": [{"name": "Yasu Gen"}, {"name": "Hiroaki Matsunaga"}, {"name": "Jojiro Totsuka"}], "author_count": 3}, {"id": "2611.15193", "category": "hep-th", "title": "Simplicity of the Three-Loop Six-Point ABJM Amplitude", "abstract": "We compute the three-loop six-point amplitude in planar ABJM theory using negative geometries. At this order, only a single bipartite chain contributes to the logarithm of the amplitude, and we find that its dual-conformally invariant integrand is locally finite. The integrated chain is therefore infrared finite and, remarkably, equals exactly $-\\pi^2$ times the one-loop amplitude. Hence the collinear anomalous dimension, like the cusp, receives no three-loop correction. Restoring the disconnected products of lower-loop contributions, which carry all the infrared divergences, we obtain the full three-loop amplitude, fixed entirely by lower-loop data and the coefficient $-\\pi^2$. These results reveal an unexpected simplicity of the six-point ABJM amplitude and suggest an iterative relation between its odd- and even-loop terms.", "url": "https://arxiv.org/abs/2611.15193", "type": "理论", "summary": "我们使用负几何计算平面 ABJM 理论中的三环六点振幅。在这个阶上，只有一个二分链对振幅的对数有贡献，我们发现它的双共形不变被积函数是局部有限的。因此，积分链是红外有限的，值得注意的是，它恰好等于 $-\\pi^2$ 乘以单环幅度。因此，共线异常尺寸（如尖点）不接受三环校正。恢复带有所有红外发散的下环贡献的断开乘积，我们获得完整的三环幅度，完全由下环数据和系数 $-\\pi^2$ 固定。这些结果揭示了六点 ABJM 幅度出乎意料的简单性，并表明了其奇数环路项和偶数环路项之间的迭代关系。", "authors": [{"name": "Hanyu Fang"}, {"name": "Chia-Kai Kuo"}, {"name": "Kai Yan"}], "featured_authors": [{"name": "Hanyu Fang"}, {"name": "Chia-Kai Kuo"}, {"name": "Kai Yan"}], "author_count": 3}, {"id": "2611.15423", "category": "hep-th", "title": "D(-1)/D7 bound states in supergravity", "abstract": "We construct D($-$1)/D7 bound states in Euclidean type IIB supergravity motivated by the string-theory setup of Billò et al., whose open-string description realizes instantons in eight-dimensional super Yang--Mills theory. Previous supergravity constructions either left unresolved issues concerning ten-dimensional Euclidean supersymmetry or relied on partial smearing to codimension one. We classify the local codimension-two solutions by showing that the supersymmetric field equations reduce to two holomorphic functions subject to a single complex constraint. The candidate bound-state solutions require complementary D3-brane fluxes, consistent with the D7 worldvolume analysis. A particularly interesting solution has constant dilaton and connects the vacuum at infinity to a controlled scaling limit in which the geometry becomes $\\mathbb R\\times S^1\\times\\mathbb T^8$.", "url": "https://arxiv.org/abs/2611.15423", "type": "理论", "summary": "我们在 Billò 等人的弦理论设置的推动下构造了欧几里得 IIB 型超引力中的 D($-$1)/D7 束缚态，其开弦描述实现了八维超杨米尔斯理论中的瞬时子。以前的超引力构造要么留下了有关十维欧几里得超对称性的未解决问题，要么依赖于对余维一的部分涂抹。我们通过证明超对称场方程简化为受单个复数约束的两个全纯函数来对局部余维二解进行分类。候选束缚态解决方案需要互补的 D3 膜通量，与 D7 世界体积分析一致。一个特别有趣的解决方案具有恒定的膨胀，并将无穷远的真空连接到受控的缩放极限，其中几何形状变为 $\\mathbb R\\times S^1\\times\\mathbb T^8$。", "authors": [{"name": "Gongrui Cheng"}, {"name": "Klaas Parmentier"}, {"name": "Thomas Van Riet"}], "featured_authors": [{"name": "Gongrui Cheng"}, {"name": "Klaas Parmentier"}, {"name": "Thomas Van Riet"}], "author_count": 3}, {"id": "2611.15424", "category": "hep-th", "title": "A ménage à quatre without strings attached", "abstract": "When two D-branes with eight mixed Dirichlet-Neumann directions cross, a fundamental string is created. This is the Hanany-Witten (HW) effect. In supergravity, the string shows up as an electric NSNS B-field sourced by the RR fields of the two branes. We show that two brane pairs, each of which would create an HW string on its own, can combine into a quadruple bound state with no HW strings attached. We explicitly construct a background with the fluxes of such a D0-D8-D4-D4' quadruple. Requiring no HW strings imposes a quadratic relation among the fluxes. We also realize this bound state as a supersymmetric solution of the non-Abelian DBI action of the D8-branes, whose Killing spinors match those of the bulk supergravity solution. The fluxed D8 stack acts as a domain wall between two supersymmetric D0-D8-D4-D4' backgrounds. Each background satisfies the no-string constraint, and the jumps in the fluxes give the charges carried by the stack.", "url": "https://arxiv.org/abs/2611.15424", "type": "理论", "summary": "当两个具有八个混合狄利克雷-诺依曼方向的 D 膜交叉时，就会创建一个基本弦。这就是 Hanany-Witten (HW) 效应。在超重力下，弦显示为由两个膜的 RR 场提供的电 NSNS B 场。我们证明，两个膜对（每个膜对都会单独创建一个硬件字符串）可以组合成一个四重束缚状态，而无需附加任何硬件字符串。我们明确地用 D0-D8-D4-D4' 四元组的通量构建背景。不需要 HW 串会在通量之间施加二次关系。我们还将这种束缚态实现为 D8 膜的非阿贝尔 DBI 作用的超对称解，其杀死旋量与体超重力解的旋量相匹配。通量 D8 堆栈充当两个超对称 D0-D8-D4-D4' 背景之间的畴壁。每个背景都满足无弦约束，并且通量的跳跃给出了堆栈所携带的电荷。", "authors": [{"name": "Iosif Bena"}, {"name": "Gongrui Cheng"}, {"name": "Klaas Parmentier"}, {"name": "Dimitrios Toulikas"}, {"name": "Thomas Van Riet"}], "featured_authors": [{"name": "Iosif Bena"}, {"name": "Gongrui Cheng"}, {"name": "Klaas Parmentier"}, {"name": "Dimitrios Toulikas"}, {"name": "Thomas Van Riet"}], "author_count": 5}, {"id": "2611.15444", "category": "hep-th", "title": "Spectra and Central Charges of Gauged Curvature Squared Supergravities in Five Dimensions", "abstract": "We study the spectra and the central charges of off-shell gauged five-dimensional $\\mathcal N=2$ supergravity extended by the Weyl squared, Ricci tensor squared and Ricci scalar squared invariants, and by their Gauss-Bonnet combination. Working exactly in the couplings and keeping all auxiliary fields, we organize the spectra around the maximally supersymmetric AdS$_5$ vacuum into supermultiplets. With the Ricci scalar squared invariant, the spectrum gains a long vector multiplet and is free of ghosts in a finite range of the coupling, while with the Weyl squared or Ricci tensor squared invariant, it gains a long spin-2 multiplet and always contains ghosts or instabilities. The Gauss-Bonnet combination adds no new modes: around its supersymmetric vacuum, the quadratic action is a rescaled copy of that of the two-derivative theory, and this fixes the spectrum of the Ricci tensor squared extension. We also compute the central charges $a$ and $c$ and the flavor central charge exactly in the couplings. The vacuum equation is $a$-maximization, and the kinetic terms of the massless graviton and vector multiplets are proportional to $c$ and to the flavor central charge, so that the critical points, where the massive spin-2 multiplet becomes degenerate with the graviton multiplet, are zeros of $c$. Finally, around supersymmetric AdS$_3\\times\\Sigma_2$ backgrounds of the Gauss-Bonnet extension, the two-dimensional central charges are reproduced by $c$-extremization, while the spectrum is generically not unitary and contains towers of states whose energies stay bounded at large Kaluza-Klein levels. In part of the parameter space, the tower of spin-2 multiplets has positive norm, so that the spectrum has no finite density of states.", "url": "https://arxiv.org/abs/2611.15444", "type": "理论", "summary": "我们研究了由 Weyl 平方、Ricci 张量平方和 Ricci 标量平方不变量以及它们的 Gauss-Bonnet 组合扩展的离壳测量五维 $\\mathcal N=2$ 超重力的光谱和中心电荷。精确地在耦合中工作并保留所有辅助场，我们将最大超对称 AdS$_5$ 真空周围的光谱组织成超多重态。利用 Ricci 标量平方不变量，谱获得长矢量多重态，并且在耦合的有限范围内没有鬼影，而利用 Weyl 平方或 Ricci 张量平方不变量，它获得长自旋 2 多重态，并且始终包含鬼影或不稳定性。高斯-博内特组合没有添加新模式：在其超对称真空周围，二次作用是二阶导数理论的重新缩放的副本，这固定了里奇张量平方扩展的谱。我们还计算耦合中的中心电荷 $a$ 和 $c$ 以及风味中心电荷。\n\n真空方程是 $a$ 最大化，无质量引力子和矢量多重态的动力学项与 $c$ 和风味中心电荷成正比，因此，质量自旋 2 多重态随引力子多重态退化的临界点是 $c$ 的零点。最后，围绕 Gauss-Bonnet 扩展的超对称 AdS$_3\\times\\Sigma_2$ 背景，二维中心电荷通过 $c$-极端化再现，而频谱通常不是单一的，并且包含其能量保持在大 Kaluza-Klein 能级范围内的状态塔。在部分参数空间中，自旋2多重态塔具有正范数，因此谱图没有有限态密度。", "authors": [{"name": "Erol Aksoy"}, {"name": "Cagatay Okyay"}, {"name": "Mehmet Ozkan"}, {"name": "Cemal Berfu Senisik"}], "featured_authors": [{"name": "Erol Aksoy"}, {"name": "Cagatay Okyay"}, {"name": "Mehmet Ozkan"}, {"name": "Cemal Berfu Senisik"}], "author_count": 4}, {"id": "2611.15468", "category": "hep-th", "title": "Radiation from scattering on multiple shockwaves", "abstract": "It is well known that radiation produced by scattering an electron off multiple sources depends on the length of the mean free path between these scatterings. When this is sufficiently small, the spectrum is suppressed due to destructive interference, a famous result known as the Landau-Pomeranchuk-Migdal (LPM) effect. This is usually modelled approximately, with scattering centres treated linearly (e.g., as screened Coulomb potentials), high-energy probes and soft emitted photons. In this paper, we consider a scenario where multiple scatterings can be computed exactly: charged probe scattering on multiple null electromagnetic shockwaves. Here, the amplitudes for elastic scattering and single photon emission can be determined exactly, for arbitrary kinematics, in terms of the shock profiles in the transverse plane. We use these amplitudes to compute the radiation density (doubly-averaged over shock locations in the transverse plane and lightfront time) in the regimes of independent and interfering scatterings. For shock profiles which are radially symmetric in the transverse plane (including the ultraboosted Coulomb field), we recover the known LPM suppression, albeit with more general kinematics. In addition, our setup allows us to consider the source-free case of multiple scattering on impulsive/ultra-short plane waves, where we find much stronger suppression of the spectrum in the LPM regime.", "url": "https://arxiv.org/abs/2611.15468", "type": "理论", "summary": "众所周知，从多个源散射电子所产生的辐射取决于这些散射之间的平均自由程的长度。当这个值足够小时，光谱会因相消干涉而受到抑制，这是一个著名的结果，称为朗道-波美兰丘克-米格达尔（LPM）效应。这通常是近似建模的，使用线性处理的散射中心（例如，作为屏蔽库仑势）、高能探针和软发射光子。在本文中，我们考虑了一种可以精确计算多重散射的场景：带电探针在多个零电磁冲击波上的散射。在这里，对于任意运动学，弹性散射和单光子发射的幅度可以根据横向平面中的冲击剖面精确确定。我们使用这些振幅来计算独立散射和干涉散射范围内的辐射密度（对横向平面中的冲击位置和光前时间进行双重平均）。\n\n对于在横向平面上径向对称的冲击剖面（包括超增压库仑场），我们恢复了已知的 LPM 抑制，尽管具有更一般的运动学。此外，我们的设置允许我们考虑脉冲/超短平面波多次散射的无源情况，我们发现 LPM 区域中的频谱抑制要强得多。", "authors": [{"name": "Tim Adamo"}, {"name": "Anton Ilderton"}, {"name": "Hannah Kingham"}], "featured_authors": [{"name": "Tim Adamo"}, {"name": "Anton Ilderton"}, {"name": "Hannah Kingham"}], "author_count": 3}, {"id": "2611.15470", "category": "hep-th", "title": "Numerical Thermodynamics of AdS Black Holes with Higher-Order Mass Corrections", "abstract": "Inspired by noncommutative geometry and quintessence, we construct a new class of asymptotically anti-de Sitter black hole solutions characterized by a higher-order mass deformation term $\\frac{aM^{n-1}}{r^n}$ involving two parameters, $a$ and $n$. Due to analytical difficulties, we approach the underlying thermodynamics through parallel programming simulations using CUDA codes. By considering models with $n=3$, $n=4$, and $n=5$, we numerically study certain thermodynamic properties, including the stability, the $P$-$v$ criticality, and the phase transitions.", "url": "https://arxiv.org/abs/2611.15470", "type": "理论", "summary": "受非交换几何和精髓的启发，我们构造了一类新的渐近反德西特黑洞解，其特征是高阶质量变形项$\\frac{aM^{n-1}}{r^n}$，涉及两个参数$a$和$n$。由于分析困难，我们通过使用 CUDA 代码的并行编程模拟来研究底层热力学。通过考虑 $n=3$、$n=4$ 和 $n=5$ 的模型，我们对某些热力学性质进行数值研究，包括稳定性、$P$-$v$ 临界性和相变。", "authors": [{"name": "Saad Eddine Baddis"}, {"name": "Adil Belhaj"}, {"name": "Hajar Belmahi"}, {"name": "Yassine Hassouni"}, {"name": "Maryem Jemri"}], "featured_authors": [{"name": "Saad Eddine Baddis"}, {"name": "Adil Belhaj"}, {"name": "Hajar Belmahi"}, {"name": "Yassine Hassouni"}, {"name": "Maryem Jemri"}], "author_count": 5}, {"id": "2611.15480", "category": "hep-th", "title": "BPS invariants from resurgent topological string", "abstract": "We review recent progress on the conjectural relation between the resurgent structure of topological string free energies and BPS invariants of type II string theory compactified on the same Calabi-Yau threefold. In this picture, Borel singularities are located at integral periods associated with central charges of stable D-brane bound states, while Stokes constants encode their BPS indices, or generalized DT invariants. After introducing resurgence and perturbative topological strings, we explain how trans-series solutions of the holomorphic anomaly equations determine non-perturbative amplitudes and illustrate the proposed correspondence in local and compact geometries. We discuss the behavior under changes of polarization and moduli, and review supporting arguments based on exact WKB analysis, blowup equations, the Stokes automorphisms of flat coordinates and dual partition functions, and Kontsevich-Soibelman wall-crossing. We conclude with open questions concerning a general proof, the interpretation of non-perturbative amplitudes, and the construction of non-perturbative completions.", "url": "https://arxiv.org/abs/2611.15480", "type": "理论", "summary": "我们回顾了拓扑弦自由能的复兴结构与在同一卡拉比-丘三重上紧缩的 II 型弦理论的 BPS 不变量之间的猜想关系的最新进展。在这张图中，Borel 奇点位于与稳定 D 膜束缚态的中心电荷相关的积分周期，而斯托克斯常数编码其 BPS 指数或广义 DT 不变量。在介绍复苏和微扰拓扑弦之后，我们解释了全纯异常方程的反级数解如何确定非微扰振幅，并说明了局部和紧凑几何中所提出的对应关系。我们讨论了极化和模量变化下的行为，并回顾了基于精确 WKB 分析、爆炸方程、平面坐标的斯托克斯自同构和对偶配分函数以及 Kontsevich-Soibelman 穿墙的支持论点。最后，我们提出了有关一般证明、非微扰振幅的解释以及非微扰完成的构造的开放性问题。", "authors": [{"name": "Jie Gu"}], "featured_authors": [{"name": "Jie Gu"}], "author_count": 1}, {"id": "2611.15484", "category": "hep-th", "title": "Holographic dual of the 2d Ising model", "abstract": "We propose a holographic dual of the 2d Ising model on a torus as the Turaev-Viro TQFT on a solid torus. The bulk spacetime is divided into the ``core'' region and the ``sandwich'' region. The core region prepares a defect state $|\\mathcal{D}\\rangle$ on the topological boundary $\\mathbb{D}$. The sandwich region computes the Turaev-Viro state sum $\\langle\\mathcal{D}|\\Pi|\\mathcal{F}\\rangle$ between the state $|\\mathcal{D}\\rangle$ on $\\mathbb{D}$ and the state $|\\mathcal{F}\\rangle$ on the physical boundary $\\mathbb{B}$. The fusion diagram (or string-net) $\\mathcal{F}$ on $\\mathbb{B}$ is given by the Aasen-Fendley-Mong construction. There is also a ``bedding surface'' $\\mathbb{S}$ between $\\mathbb{D}$ and $\\mathbb{B}$, and the height variables (or Ising spins inside/outside of the domain wall) are naturally living on $\\mathbb{S}$. The bulk spacetime is discretized by the 2-skeleton $P$ which interpolates $\\mathcal{D}$ and $\\mathcal{F}$. When the defect $\\mathcal{D}$ is absent, the 2-skeleton $P$ ends on the bedding surface $\\mathbb{S}$ and $P$ is interpreted as the bulk worldsheet of the string-net $\\mathcal{F}$.", "url": "https://arxiv.org/abs/2611.15484", "type": "理论", "summary": "我们提出了环面上 2d Ising 模型的全息对偶，作为实体环面上的 Turaev-Viro TQFT。大块时空分为“核心”区域和“三明治”区域。核心区域在拓扑边界$\\mathbb{D}$上准备缺陷状态$|\\mathcal{D}\\rangle$。三明治区域计算 $\\mathbb{D}$ 上的状态 $|\\mathcal{D}\\rangle$ 与物理边界 $\\mathbb{B}$ 上的状态 $|\\mathcal{F}\\rangle$ 之间的 Turaev-Viro 状态和 $\\langle\\mathcal{D}|\\Pi|\\mathcal{F}\\rangle$。 $\\mathbb{B}$ 上的融合图（或字符串网络）$\\mathcal{F}$ 由 Aasen-Fendley-Mong 构造给出。在 $\\mathbb{D}$ 和 $\\mathbb{B}$ 之间还有一个“床面”$\\mathbb{S}$，高度变量（或域壁内部/外部的伊辛自旋）自然存在于 $\\mathbb{S}$ 上。体时空由 2 骨架 $P$ 离散化，它插入 $\\mathcal{D}$ 和 $\\mathcal{F}$。当缺陷 $\\mathcal{D}$ 不存在时，2 骨架 $P$ 在层理表面 $\\mathbb{S}$ 上结束，并且 $P$ 被解释为弦网 $\\mathcal{F}$ 的块世界表。", "authors": [{"name": "Kazumi Okuyama"}], "featured_authors": [{"name": "Kazumi Okuyama"}], "author_count": 1}, {"id": "2611.15510", "category": "hep-th", "title": "1-loop partition function of 11d supergravity on $\\mathrm{AdS}_4\\times S^7/\\mathbb{Z}_k$: matching $A(k)$ in ABJM free energy", "abstract": "The function $A(k)$ appearing in the large $N$ expansion of free energy of ABJM theory on $S^3$ is known exactly from localization. An earlier calculation of the 1-loop partition function of 11d supergravity on $\\mathrm{AdS}_4\\times S^7/\\mathbb Z_k$, based on the standard KK spectrum on $S^7$, did not reproduce it. We identify a missing 1-loop supergravity contribution as that of the 3-form field fluctuations built from square-integrable harmonic 2-forms on Euclidean $\\mathrm{AdS}_4$ tensored with $S^7$ modes, which are not captured by the KK spectrum. Adding it to the KK tower contribution expressed in terms of superconformal characters and applying the $\\mathbb{Z}_k$ projection, the total expression simplifies, and its evaluation in a zeta-function prescription reproduces the expression for $A(k)$. We also apply a similar approach to the 3d ADHM theory whose M-theory dual is the orbifold $\\mathrm{AdS}_4\\times S^7/\\mathbb{Z}_p$, which has singularity along the fixed locus $\\mathrm{AdS}_4\\times S^3$, supporting a 7d $SU(p)$ vector multiplet. Adding the localized KK modes of this multiplet to the $\\mathbb{Z}_p$-projected supergravity spectrum gives a 1-loop free energy that reproduces the ADHM localization counterpart of $A(k)$.", "url": "https://arxiv.org/abs/2611.15510", "type": "理论", "summary": "ABJM 理论在 $S^3$ 上的自由能大 $N$ 展开式中出现的函数 $A(k)$ 可以从定位中准确得知。早期基于 $S^7$ 上的标准 KK 谱计算的 $\\mathrm{AdS}_4\\times S^7/\\mathbb Z_k$ 上 11d 超重力的 1 环配分函数没有重现。我们将缺失的 1 环超重力贡献确定为由欧几里德 $\\mathrm{AdS}_4$ 上的平方可积谐波 2-形式构建的 3-形式场涨落，用 $S^7$ 模式张量，这些没有被 KK 谱捕获。将其添加到以超共形特征表示的 KK 塔贡献中并应用 $\\mathbb{Z}_k$ 投影，总表达式得到简化，并且其在 zeta 函数处方中的评估再现了 $A(k)$ 的表达式。我们还对 3d ADHM 理论应用了类似的方法，其 M 理论对偶是轨道 $\\mathrm{AdS}_4\\times S^7/\\mathbb{Z}_p$，它沿着固定轨迹 $\\mathrm{AdS}_4\\times S^3$ 具有奇点，支持 7d $SU(p)$ 向量多重态。\n\n将该多重态的局域 KK 模式添加到 $\\mathbb{Z}_p$ 投影超重力谱中，得到一个 1 环自由能，可再现 $A(k)$ 的 ADHM 局域对应部分。", "authors": [{"name": "Stefan A. Kurlyand"}, {"name": "Arkady A. Tseytlin"}], "featured_authors": [{"name": "Stefan A. Kurlyand"}, {"name": "Arkady A. Tseytlin"}], "author_count": 2}, {"id": "2611.15623", "category": "hep-th", "title": "Schwinger-Unruh Interplay and Mode-Resolved Entanglement of Charged Scalar Fields in Rindler Spacetime", "abstract": "We study pairwise and cross-horizon correlations of a charged scalar field in Rindler spacetime in the presence of parallel electric and magnetic fields. The transverse magnetic field produces Landau levels, while the longitudinal mode problem follows the charged-scalar Rindler construction with the effective mass $M_n^2=m^2+(2n+1)|qB|$. For a specified global vacuum in the negative-frequency sector, we obtain the outgoing four-mode Gaussian state and calculate logarithmic negativity and quantum mutual information for selected mode pairs. We find that the cross-wedge antiparticle-particle pair is entangled only when $q_2<\\tanh r_U$. It can therefore become separable although its mutual information remains nonzero. The intra-wedge particle-antiparticle pair remains entangled for nonzero Schwinger squeezing. Using the Gaussian Schmidt decomposition, we show that the entanglement across the complete right--left wedge partition is carried by a pair of collective modes, even when the selected outgoing cross-wedge pair becomes separable. Using the Gaussian Schmidt decomposition, we show that the entanglement across the complete right--left wedge partition is carried by a pair of collective modes, even when the selected outgoing cross-wedge pair becomes separable. We discuss the Landau-level dependence and the limits of these mode-resolved conclusions, without identifying the vacuum-dependent mixing parameter with a detector temperature.", "url": "https://arxiv.org/abs/2611.15623", "type": "理论", "summary": "我们研究了林德勒时空中存在平行电场和磁场的情况下带电标量场的成对和跨视界相关性。横向磁场产生朗道能级，而纵模问题遵循有效质量 $M_n^2=m^2+(2n+1)|qB|$ 的带电标量 Rindler 结构。对于负频率区域中的指定全局真空，我们获得传出四模高斯态并计算所选模式对的对数负性和量子互信息。我们发现，只有当 $q_2<\\tanh r_U$ 时，十字楔形反粒子-粒子对才会纠缠。因此，尽管它的互信息仍然不为零，但它可以变得可分离。楔内粒子-反粒子对保持纠缠以实现非零施温格挤压。使用高斯施密特分解，我们表明，即使选定的传出交叉楔对变得可分离，整个左右楔分区的纠缠也由一对集体模式承载。\n\n使用高斯施密特分解，我们表明，即使选定的传出交叉楔对变得可分离，整个左右楔分区的纠缠也由一对集体模式承载。我们讨论了朗道能级依赖性和这些模式解析结论的局限性，但没有确定与探测器温度相关的真空相关混合参数。", "authors": [{"name": "Shagun Kaushal"}, {"name": "Himanshu Parihar"}], "featured_authors": [{"name": "Shagun Kaushal"}, {"name": "Himanshu Parihar"}], "author_count": 2}, {"id": "2611.15654", "category": "hep-th", "title": "Entropy and charge transport limit Mpemba preparation in holography", "abstract": "We study Mpemba relaxation and its preparation cost in a holographic superconductor with full backreaction. At matched final energy and charge, boundary drives can reverse the ordering of the remaining horizon entropy after source removal. In separate numerical comparisons, some protocols reach a given tolerance earlier even when driving and waiting times are included. To examine the limits of preparation, we consider critical states that already carry a slow scalar field and exterior charge. Along the critical slow branch at fixed energy and charge, horizon displacement cancels the quadratic area response, leaving an entropy reserve of $O(\\varepsilon^4)$ for an initial scalar amplitude $\\varepsilon$. The same coefficient connects this reserve to the entropy advantage of the nearby superconducting equilibrium and the entropy weight of the slow tail on the normal side. This limited reserve constrains how quickly the existing field can be removed. For releases that suppress the leading horizon field and exterior charge, the preparation time grows at least as $\\varepsilon^{-2}$ under horizon regularity and uniform radial control. Charge transport constrains the same covariant scalar flux that produces horizon entropy, raising the minimum flux cost and strengthening the time bound.", "url": "https://arxiv.org/abs/2611.15654", "type": "理论", "summary": "我们研究了具有完全逆反应的全息超导体中的 Mpemba 弛豫及其制备成本。在匹配的最终能量和电荷下，边界驱动可以反转源移除后剩余层位熵的顺序。在单独的数值比较中，即使包括驾驶和等待时间，某些协议也能更早地达到给定的容差。为了检查准备的局限性，我们考虑已经带有慢标量场和外部电荷的临界态。沿着固定能量和电荷的临界慢分支，水平位移消除了二次面积响应，为初始标量幅度 $\\varepsilon$ 留下 $O(\\varepsilon^4)$ 的熵储备。相同的系数将该储备与附近超导平衡的熵优势和正常侧慢尾的熵权重联系起来。这种有限的储备限制了现有油田拆除的速度。对于抑制领先地平线场和外部电荷的释放，在地平线规律性和均匀径向控制下，准备时间至少增长$\\varepsilon^{-2}$。\n\n电荷传输约束产生水平熵的相同协变标量通量，从而提高了最小通量成本并加强了时间限制。", "authors": [{"name": "Yu Shi"}, {"name": "Sheng Long"}], "featured_authors": [{"name": "Yu Shi"}, {"name": "Sheng Long"}], "author_count": 2}, {"id": "2611.15660", "category": "hep-th", "title": "Triple-Massive-Exchange Bispectrum of Quasi-Single-Field Inflation", "abstract": "The triple-exchange bispectrum of the scalar quasi-single-field inflation model has resisted analytic evaluation across its full parameter space since its advent, despite rapid progress in cosmological collider physics. In this Letter, we solve it for general mass and mixing strength as a convergent double series, by applying the Mellin-Barnes representation directly to the mixed propagator between the massless and massive modes. The result is exact, non-perturbative, and physically transparent; the method is broadly applicable.", "url": "https://arxiv.org/abs/2611.15660", "type": "理论", "summary": "尽管宇宙对撞机物理学取得了快速进展，但标量准单场暴胀模型的三重交换双谱自出现以来一直抵制其整个参数空间的分析评估。在这封信中，我们通过将 Mellin-Barnes 表示直接应用于无质量和质量模式之间的混合传播器，将其作为收敛双级数来求解一般质量和混合强度。结果准确、无扰动且物理透明；该方法适用范围广泛。", "authors": [{"name": "Xingang Chen"}, {"name": "Zhong-Zhi Xianyu"}], "featured_authors": [{"name": "Xingang Chen"}, {"name": "Zhong-Zhi Xianyu"}], "author_count": 2}, {"id": "2611.15749", "category": "hep-th", "title": "Quantum and classical thermal equilibrium for probabilistic classical fields", "abstract": "The time evolution of the probability distribution for classical fields can be described by the quantum formalism. For free classical fields the free quantum field theory arises as a subsystem. Different probability distributions for classical fields correspond to the classical thermal equilibrium with the Rayleigh-Jeans divergence or the quantum thermal equilibrium with the Planck spectrum. The selection of the Rayleigh-Jeans or Planck spectrum is not a question of fundamental concepts. It becomes an issue of dynamical selection once interactions are present. We compare the momentum dependence of the classical energy and field correlations for the classical and quantum equilibrium. This permits to decide which equilibrium is selected as a result of asymptotic dynamics by numerical simulations of the probabilistic classical fields including interactions. For free probabilistic classical fields we construct a general ``classical-quantum map'' between the classical probability distribution and the density matrix of the quantum field theory.", "url": "https://arxiv.org/abs/2611.15749", "type": "理论", "summary": "经典场概率分布的时间演化可以用量子形式来描述。对于自由经典场，自由量子场论作为一个子系统出现。经典场的不同概率分布对应于瑞利-詹斯散度的经典热平衡或普朗克谱的量子热平衡。瑞利-金斯谱或普朗克谱的选择不是基本概念的问题。一旦存在相互作用，这就成为动态选择的问题。我们比较了经典平衡和量子平衡的经典能量和场相关性的动量依赖性。这允许通过对包括相互作用在内的概率经典场的数值模拟来决定选择哪种平衡作为渐近动力学的结果。对于自由概率经典场，我们在经典概率分布和量子场论的密度矩阵之间构建了一个通用的“经典量子映射”。", "authors": [{"name": "C. Wetterich"}], "featured_authors": [{"name": "C. Wetterich"}], "author_count": 1}, {"id": "2611.15782", "category": "hep-th", "title": "Harmonic superspace and Kaluza-Klein reduction", "abstract": "We extend the Kaluza-Klein reduction procedure to the framework of harmonic superspace and apply it to the construction of off-shell superfield formulations of supersymmetric gauge multiplets. The reduction is implemented by a deformation of the harmonic derivatives by mass terms, while ensuring that manifest off-shell supersymmetry and Grassmann analyticity are preserved at all stages. As a first application, we reduce the free \\(5D,\\mathcal{N}=1\\) Maxwell theory and obtain an off-shell superfield description of the BPS \\(4D,\\mathcal{N}=2\\) massive vector supermultiplet. The resulting formulation naturally incorporates an analytic Stückelberg-type gauge symmetry. We then reduce linearized \\(5D,\\mathcal{N}=1\\) Poincaré supergravity and derive the unconstrained harmonic-superspace action for the BPS \\(4D,\\mathcal{N}=2\\) massive supergravity multiplet. The technical simplicity of the procedure stems from the structure of gauge theories in harmonic superspace, where the gauge symmetry is naturally encoded in analytic prepotentials and harmonic derivatives. The approach presented in this paper opens a direct route to gauge-invariant off-shell superfield formulations of massive higher-spin $4D,\\mathcal{N}=2$ BPS multiplets. Furthermore, the resulting theories can be reformulated in $4D,\\mathcal{N}=1$ superspace, opening the way to gauge-invariant off-shell descriptions of $4D,\\mathcal{N}=1$ massive higher-spin theories.", "url": "https://arxiv.org/abs/2611.15782", "type": "理论", "summary": "我们将 Kaluza-Klein 约简过程扩展到调和超空间的框架，并将其应用于超对称规范多重态的离壳超场公式的构造。这种简化是通过质量项对调和导数进行变形来实现的，同时确保在所有阶段都保留明显的离壳超对称性和格拉斯曼解析性。作为第一个应用，我们简化了自由 \\(5D,\\mathcal{N}=1\\) 麦克斯韦理论，并获得了 BPS \\(4D,\\mathcal{N}=2\\) 大规模矢量超多重态的离壳超场描述。由此产生的公式自然地包含了解析的 Stückelberg 型规范对称性。然后，我们减少线性化 \\(5D,\\mathcal{N}=1\\) 庞加莱超引力，并导出 BPS \\(4D,\\mathcal{N}=2\\) 大规模超引力多重态的无约束谐波超空间作用。该过程的技术简单性源于调和超空间中规范理论的结构，其中规范对称性自然地编码在解析预势和调和导数中。\n\n本文提出的方法为大规模高自旋 $4D,\\mathcal{N}=2$ BPS 多重态的规范不变离壳超场公式开辟了一条直接途径。此外，由此产生的理论可以在 $4D,\\mathcal{N}=1$ 超空间中重新表述，为 $4D,\\mathcal{N}=1$ 大规模高自旋理论的规范不变的离壳描述开辟了道路。", "authors": [{"name": "Nikita Zaigraev"}], "featured_authors": [{"name": "Nikita Zaigraev"}], "author_count": 1}, {"id": "2611.15795", "category": "hep-th", "title": "How to find regular black-hole islands in the swamp", "abstract": "An infinite tower of higher-curvature corrections is expected to lead to regular black-hole solutions. We assume that this regular behavior does not abruptly arise, but gradually builds up with each successive order of the effective field theory of gravity. In addition, we assume that the effective field theory comes with a single scale of singularity-resolving new physics. We translate this assumption into a monotonicity requirement for deviations of the metric functions from a Schwarzschild black hole. Under these assumptions, conditions can be formulated which trace the increase of ``less singular'' black-hole behavior on and outside of the black-hole horizon within the regime of validity of the effective field theory. These conditions constrain the effective field theory coefficients. To exemplify this construction, we motivate five specific conditions and find a corresponding island of black hole regularity conditions at order eight in the effective field theory. We also explore whether string theory as well as asymptotically safe gravity lie on this island.", "url": "https://arxiv.org/abs/2611.15795", "type": "理论", "summary": "更高曲率修正的无限塔预计将产生常规的黑洞解决方案。我们假设这种规则行为不会突然出现，而是随着有效引力场论的每个连续阶次逐渐建立。此外，我们假设有效场论伴随着单一尺度的奇点解析新物理。我们将此假设转化为史瓦西黑洞度量函数偏差的单调性要求。在这些假设下，可以制定条件，在有效场论的有效性范围内追踪黑洞视界内外“不太奇异”的黑洞行为的增加。这些条件限制了有效场论系数。为了举例说明这种构造，我们激发了五个特定条件，并在有效场理论中找到了相应的八阶黑洞规律性条件岛。我们还探讨了弦理论和渐近安全引力是否存在于这个岛上。", "authors": [{"name": "Astrid Eichhorn"}, {"name": "Pedro G. S. Fernandes"}, {"name": "Verena Koeder"}], "featured_authors": [{"name": "Astrid Eichhorn"}, {"name": "Pedro G. S. Fernandes"}, {"name": "Verena Koeder"}], "author_count": 3}, {"id": "2611.15854", "category": "hep-th", "title": "Swing Surfaces in AdS/CFT", "abstract": "We study holographic entanglement entropy in the flat limit of AdS$_3$/CFT$_2$, and clarify the relation between Ryu-Takayanagi surfaces and the swing surfaces proposed for flat-space holography. We show that the ordinary RT formula does not admit a well-defined flat-space limit and connect this to subtleties of the state-operator map in the flat limit. We then construct an AdS$_3$ uplift of the swing prescription and develop its corresponding information-theoretic interpretation through two complementary approaches. First, we show that the swing surface length computes the mutual information between suitably chosen nearly null boundary intervals in a special class of pure CFT states. The gravity interpretation of this result involves scattering processes which take place deep inside of the AdS$_3$ bulk. Second, we reduce the problem of finding an information-theoretic interpretation for swing surfaces to the more general problem of finding an information-theoretic interpretation of black hole inner horizons in holography.", "url": "https://arxiv.org/abs/2611.15854", "type": "理论", "summary": "我们研究了 AdS$_3$/CFT$_2$ 平坦极限下的全息纠缠熵，并阐明了 Ryu-Takayanagi 表面与平坦空间全息术提出的摆动表面之间的关系。我们证明了普通的 RT 公式不承认明确定义的平坦空间极限，并将其与平坦极限中状态算子映射的微妙之处联系起来。然后，我们构建了挥杆处方的 AdS$_3$ 提升，并通过两种互补的方法开发了其相应的信息理论解释。首先，我们证明摆动表面长度计算一类特殊的纯 CFT 状态中适当选择的近零边界区间之间的互信息。该结果的重力解释涉及发生在 AdS$_3$ 块体深处的散射过程。其次，我们将寻找摆动面的信息论解释的问题简化为寻找全息术中黑洞内视界的信息论解释的更普遍的问题。", "authors": [{"name": "Jacqueline Caminiti"}, {"name": "Sabrina Pasterski"}], "featured_authors": [{"name": "Jacqueline Caminiti"}, {"name": "Sabrina Pasterski"}], "author_count": 2}, {"id": "2611.15862", "category": "hep-th", "title": "$α'^2$-corrections to the bosonic string from an action-level double copy map", "abstract": "The low-energy effective action of the bosonic string contains higher-derivative corrections of the form Riem$^2$ and Riem$^3$ to the Einstein--Hilbert action, together with the associated Kalb--Ramond couplings. We construct an action-level double copy description of these corrections up to cubic order in the fields. Two ingredients are required: a higher-derivative gauge-theory Lagrangian, which up to field redefinitions is controlled by a single $F^3$ coupling, and a deformation of the color-to-kinematics replacement of the structure constants by the corresponding three-momentum tensor. We show that no higher-derivative gauge-theory operator can produce the Riem$^3$ vertex with the standard replacement rule, and that the matching conditions for the gauge-theory coupling and the deformation of the map admit a unique solution, a double root, which renders the cubic action left--right symmetric, of the form $(\\mathrm{YM}+F^3)\\otimes(\\mathrm{YM}+F^3)$. Without further input, the resulting map reproduces the cubic $\\mathrm{Riem}\\,H^2$ coupling of the bosonic string at order $\\alpha'$, the absence of six-derivative cubic Kalb--Ramond couplings at order $\\alpha'^2$, and the absence of interactions odd in the Kalb--Ramond field. The comparison is performed in transverse-traceless gauge, up to field redefinitions.", "url": "https://arxiv.org/abs/2611.15862", "type": "理论", "summary": "玻色弦的低能有效作用包含对爱因斯坦-希尔伯特作用以及相关的卡尔布-拉蒙德耦合的 Riem$^2$ 和 Riem$^3$ 形式的高导数修正。我们构建了这些校正的动作级双副本描述，直至字段中的立方阶。需要两个成分：高导数规范理论拉格朗日，其直到场重新定义都由单个 $F^3$ 耦合控制，以及由相应的三动量张量对结构常数进行颜色到运动学替换的变形。我们表明，没有高导数规范理论算子可以用标准替换规则产生 Riem$^3$ 顶点，并且规范理论耦合和映射变形​​的匹配条件允许唯一的解决方案，即双根，它使立方作用左右对称，形式为 $(\\mathrm{YM}+F^3)\\otimes(\\mathrm{YM}+F^3)$。\n\n无需进一步输入，生成的图将重现 $\\alpha'$ 阶玻色弦的三次 $\\mathrm{Riem}\\,H^2$ 耦合，不存在 $\\alpha'^2$ 阶的六阶三次 Kalb-Ramond 耦合，并且在 Kalb-Ramond 场中不存在奇数相互作用。比较是在横向无痕量规中进行的，直至现场重新定义。", "authors": [{"name": "Eric Lescano"}, {"name": "Agustina Pereyra Grau"}, {"name": "Jesús A. Rodrí
