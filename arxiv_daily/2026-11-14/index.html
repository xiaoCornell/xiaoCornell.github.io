参数独立策略上使用的最佳渐近对称对数导数 (SLD) Fisher 信息的可计算上限。即使 Choi 矩阵是正定的，也并不总是能够达到界限。我们使用仅涉及 Choi 矩阵及其一阶导数的半定可行性条件来准确确定等式何时成立。该条件允许 RLD 矩阵和秩亏 Choi 矩阵的简并最大特征值，并在其范围上支持导数。原来的频道家族可能会在附近改变等级。对于在评估点处具有正定相关矩阵的广义相移通道，该条件变成总和为 1 的非负证书权重的线性方程组。在完全失相点，我们还计算了每个有限次数使用的最佳 SLD 信息，并表明即使针对自适应策略，重复的、无辅助的探针也能实现该信息。\n\n显式示例给出了通道 RLD 信息与每次使用的最佳渐近 SLD 信息的无界比率，无论是随着维度增长，还是在固定量子位维度，因为最小 Choi 特征值趋于零。我们从 Zhou 和 Jiang 的渐近优化中推导出了平等准则及其结果。", "authors": [{"name": "Masahito Hayashi"}], "featured_authors": [{"name": "Masahito Hayashi"}], "author_count": 1}, {"id": "2611.16610", "category": "quant-ph", "title": "A Quantum Algorithm for Computing All Eigenvalues and Eigenstates of Sparse Hermitian Matrices", "abstract": "Computation of eigenvalues and eigenvectors of a sparse Hermitian matrix is a fundamental problem in algebra, arising both as a problem of independent interest and as a key subroutine in a wide range of computational and scientific applications. In this work, we develop a quantum algorithm that determines the spectrum of a sparse Hermitian matrix, defined as the set of its distinct eigenvalues, and for each eigenvalue, prepares a corresponding eigenvector as a quantum state in its eigenspace. The eigenvalues are represented as binary strings with a prescribed precision, while the corresponding eigenvectors are kept as quantum states, eliminating the need to reconstruct their classical counterparts. The algorithm instead enables estimation of expectation values $\\braket{x|M|x}$, where $\\ket{x}$ is a prepared eigenstate and $M$ is an observable. For an $n \\times n$ $s$-sparse Hermitian matrix $H$, dense methods based on Householder tridiagonalization and QR iteration compute all eigenvalues and eigenvectors in $\\mathcal{O}(n^3)$ time. Exploiting sparsity, the Lanczos method computes all eigenvalues in $\\mathcal{O}(n^2 s)$ time in exact arithmetic, but recovering all eigenvectors still requires $\\mathcal{O}(n^3)$ time. In contrast, our algorithm runs in time $\\tilde{\\mathcal{O}}(n s^2 \\log^2 n / \\Delta_{\\min})$, where $\\Delta_{\\min}$ denotes the minimum spectral gap of the normalized matrix. For inverse gaps up to $\\Delta_{\\min}^{-1} = \\mathcal{O}(n)$, the most favorable scaling for $n$ distinct eigenvalues, attained by nearly uniformly spaced spectra such as those of perfect-state-transfer spin chains and the Sylvester-Kac matrix, and for sparsity up to $s = o(\\sqrt{n}/\\log n)$, the proposed algorithm achieves an improved asymptotic runtime over the classical $\\mathcal{O}(n^3)$ approach for computing all eigenvalues and eigenvectors, under standard sparse-access assumptions.", "url": "https://arxiv.org/abs/2611.16610", "type": "理论+数值", "summary": "稀疏埃尔米特矩阵的特征值和特征向量的计算是代数中的一个基本问题，它既是一个独立的问题，也是广泛的计算和科学应用中的关键子程序。在这项工作中，我们开发了一种量子算法，可以确定稀疏埃尔米特矩阵的谱，定义为其不同特征值的集合，并且对于每个特征值，准备相应的特征向量作为其特征空间中的量子态。特征值表示为具有规定精度的二进制字符串，而相应的特征向量则保留为量子态，从而无需重建其经典对应项。相反，该算法可以估计期望值 $\\braket{x|M|x}$，其中 $\\ket{x}$ 是准备好的本征态，$M$ 是可观测量。对于 $n \\times n$ $s$ 稀疏 Hermitian 矩阵 $H$，基于 Householder 三对角化和 QR 迭代的密集方法可在 $\\mathcal{O}(n^3)$ 时间内计算所有特征值和特征向量。\n\n利用稀疏性，Lanczos 方法可以在 $\\mathcal{O}(n^2 s)$ 时间内以精确算术计算出所有特征值，但恢复所有特征向量仍需要 $\\mathcal{O}(n^3)$ 时间。相比之下，我们的算法运行时间为 $\\tilde{\\mathcal{O}}(ns^2 \\log^2 n / \\Delta_{\\min})$，其中 $\\Delta_{\\min}$ 表示归一化矩阵的最小光谱间隙。对于高达 $\\Delta_{\\min}^{-1} = \\mathcal{O}(n)$ 的逆间隙，对 $n$ 个不同特征值最有利的缩放，通过几乎均匀间隔的谱（例如完美状态转移自旋链和 Sylvester-Kac 矩阵）获得，并且对于高达 $s = o(\\sqrt{n}/\\log n)$ 的稀疏性，所提出的算法实现了改进的渐近运行时间在标准稀疏访问假设下计算所有特征值和特征向量的经典 $\\mathcal{O}(n^3)$ 方法。", "authors": [{"name": "Krishnakanta Barik"}, {"name": "Goutam Paul"}], "featured_authors": [{"name": "Krishnakanta Barik"}, {"name": "Goutam Paul"}], "author_count": 2}, {"id": "2611.16683", "category": "quant-ph", "title": "Geometric Theory of Quasiperiodically Driven Systems", "abstract": "Quasiperiodically driven systems give rise to a rich set of physical phenomena in contemporary quantum physics, with applications ranging from nonequilibrium dynamics to Hamiltonian engineering and control. However, unlike periodically driven (Floquet) systems, their study is hindered by the absence of a generic theory to describe their evolution using an effective time-independent Hamiltonian and its eigenstates. Based on counterdiabatic driving, we construct a general framework to identify and determine the dynamically invariant spaces of arbitrary quasiperiodic drives (i.e., the generalization of Floquet states). We decompose their unitary evolution using the exact effective average-energy operator Æ and the corresponding gauge potential, which we compute via a variational principle in frequency-lattice operator space. We then formulate a four-fold taxonomy of quasiperiodic drives based on the geometry and topology of their dynamically invariant spaces into (non)abelian and (un)twisted classes. The abelian untwisted class admits a direct extension of Floquet's theorem to incommensurate quasiperiodic drives; going beyond, we derive a nonabelian generalization of Floquet theory. Finally, we propose a concept of ergodicity whose onset is marked by coalescing dynamically invariant eigenspaces, in direct analogy to the emergence of ergodicity in a mixed classical phase space. The effective mathematical framework, variational principle, and nonabelian ergodicity we put forward apply beyond quasiperiodic drives.", "url": "https://arxiv.org/abs/2611.16683", "type": "理论+数值", "summary": "准周期驱动系统在当代量子物理学中产生了丰富的物理现象，其应用范围从非平衡动力学到哈密顿工程和控制。然而，与周期性驱动（Floquet）系统不同，他们的研究因缺乏通用理论来使用有效的时间独立哈密顿量及其本征态来描述其演化而受到阻碍。基于反非绝热驱动，我们构建了一个通用框架来识别和确定任意准周期驱动的动态不变空间（即 Floquet 状态的推广）。我们使用精确的有效平均能量算子 Æ 和相应的规范势来分解它们的酉演化，我们通过频率格算子空间中的变分原理进行计算。然后，我们根据动态不变空间的几何和拓扑将准周期驱动制定为（非）阿贝尔和（非）扭曲类的四重分类法。阿贝尔无扭曲类承认弗洛奎特定理直接扩展到不可通约准周期驱动；除此之外，我们得出了 Floquet 理论的非阿贝尔概括。\n\n最后，我们提出了遍历性的概念，其开始以合并动态不变的特征空间为标志，这直接类似于混合经典相空间中遍历性的出现。我们提出的有效数学框架、变分原理和非交换遍历性适用于准周期驱动之外。", "authors": [{"name": "Chengzhi Ye"}, {"name": "Marin Bukov"}], "featured_authors": [{"name": "Chengzhi Ye"}, {"name": "Marin Bukov"}], "author_count": 2}, {"id": "2611.16708", "category": "quant-ph", "title": "Thermodynamically Consistent Quantum-Classical Hybrid Dynamics: A Metriplectic Approach to Generalized Lindblad and Bloch-Torrey Equations", "abstract": "We develop a metriplectic framework for quantum--classical hybrid dynamics that ensures thermodynamic consistency through conservation of energy and non-negative entropy production. The approach combines a hybrid Poisson bracket with a metriplectic $4$-bracket, with coupling between quantum and classical subsystems arising solely through dissipative processes. Within this hybrid formulation, we produce thermodynamically consistent generalizations of the Lindblad master equations and the Bloch--Torrey equations for open quantum systems. This provides a unified description of quantum relaxation and classical diffusion, together with a clear interpretation of entropy production.", "url": "https://arxiv.org/abs/2611.16708", "type": "理论", "summary": "我们开发了量子-经典混合动力学的三重框架，通过能量守恒和非负熵产生来确保热力学一致性。该方法将混合泊松支架与三重 4 美元支架相结合，量子和经典子系统之间的耦合仅通过耗散过程产生。在这个混合公式中，我们为开放量子系统生成了 Lindblad 主方程和 Bloch--Torrey 方程的热力学一致概括。这提供了量子弛豫和经典扩散的统一描述，以及对熵产生的清晰解释。", "authors": [{"name": "Azeddine Zaidni"}, {"name": "Ayoub Arraji"}, {"name": "Philip J. Morrison"}], "featured_authors": [{"name": "Azeddine Zaidni"}, {"name": "Ayoub Arraji"}, {"name": "Philip J. Morrison"}], "author_count": 3}, {"id": "2611.16719", "category": "quant-ph", "title": "Probabilistic distillation of superposition", "abstract": "How well a superposition of nonorthogonal states, such as an optical cat state, serves as a resource depends on how its components interfere. Here we determine the optimal probability of converting one such superposition into another by superposition-free operations. These operations cannot make the components of a superposition interfere more destructively with certainty while keeping all of them, and this principle fixes the optimal probability for every source that is symmetric under permutations of its components. When the reference states are coherent states, as in a cat state, every operation that maps each of them to a coherent state, such as photon loss or photon subtraction, is superposition-free. For two reference states we solve the problem completely. Superpositions with coefficients of equal modulus, the counterparts of the maximally coherent states of coherence theory, are therefore inequivalent resources: an odd cat state becomes even with certainty by a normalized photon subtraction, whereas an even one becomes odd only with a probability that vanishes for small amplitudes, and the even and the Yurke$-$Stoler cat states cannot be converted into each other with certainty in either direction. Collective operations on several copies can do better than converting them one at a time, except in the distillation of coherence, which gains nothing from them. For three or more reference states with equal positive overlaps, no state reaches every other state with certainty; the equal-modulus superpositions that interfere most destructively still yield a maximally coherent state with certainty and reach every superposition of all reference states at least as well as such a state does, but in the worst case no better.", "url": "https://arxiv.org/abs/2611.16719", "type": "理论", "summary": "非正交状态的叠加（例如光猫状态）作为资源的效果取决于其组件的干扰方式。在这里，我们确定通过无叠加运算将一种这样的叠加转换为另一种叠加的最佳概率。这些操作不能使叠加的分量在保留所有分量的同时对确定性产生更具破坏性的干扰，并且该原理确定了在其分量排列下对称的每个源的最佳概率。当参考态是相干态时，如在猫态中，将它们映射到相干态的每个操作（例如光子损失或光子减法）都是无叠加的。对于两个参考状态，我们完全解决了问题。\n\n因此，具有等模系数的叠加（相干理论的最大相干态的对应物）是不等价的资源：通过归一化光子减法，奇数猫状态可以确定地变为偶数，而偶数只有在小幅度消失的概率下才变为奇数，并且偶数和 Yurke$-$Stoler 猫状态不能在任一方向上确定地相互转换。对多个副本进行集体操作比一次转换一个副本效果更好，除非是在提高连贯性方面，否则不会从中获得任何好处。对于具有相同正重叠的三个或更多参考状态，没有一个状态可以确定地达到所有其他状态；最具破坏性干扰的等模叠加仍然可以确定地产生最大相干状态，并至少达到所有参考状态的每个叠加状态，但在最坏的情况下也不会更好。", "authors": [{"name": "Gökhan Torun"}], "featured_authors": [{"name": "Gökhan Torun"}], "author_count": 1}, {"id": "2611.16794", "category": "quant-ph", "title": "Hong$-$Ou$-$Mandel-like interference between two independent narrowband thermal states", "abstract": "Narrowband photonic sources are promising candidates in quantum networks for a direct interface with atomic quantum memories. However, building a large-scale quantum network requires many indistinguishable sources, and matching the frequencies of independent narrowband sources is generally challenging. Here, we propose a method to measure the frequency difference between two narrowband light sources in the single-photon power regime by studying Hong$-$Ou$-$Mandel-like (HOM) interference between thermal states. Our results show that the absolute value of the frequency difference can be extracted from the temporal coincidence counts, and these results agree well with our theoretical model. We also demonstrate that the beat signal of the HOM-like interference between two thermal states has a similar oscillation profile to the HOM interference between two heralded single-photon sources, confirming that this method can be used to find the zero detuning of two heralded single-photon sources.", "url": "https://arxiv.org/abs/2611.16794", "type": "理论", "summary": "窄带光子源是量子网络中与原子量子存储器直接接口的有希望的候选者。然而，构建大规模量子网络需要许多无法区分的源，并且匹配独立窄带源的频率通常具有挑战性。在这里，我们提出了一种通过研究热态之间的 Hong$-$Ou$-$Mandel-like (HOM) 干涉来测量单光子功率范围内两个窄带光源之间的频率差的方法。我们的结果表明，可以从时间重合计数中提取频率差的绝对值，这些结果与我们的理论模型非常吻合。我们还证明了两个热态之间的类 HOM 干涉的拍频信号与两个预示单光子源之间的 HOM 干涉具有相似的振荡轮廓，证实该方法可用于找到两个预示单光子源的零失谐。", "authors": [{"name": "Sheng-Hsuan Huang"}, {"name": "Thomas Dirmeier"}, {"name": "Andrea Aiello"}, {"name": "Kaisa Laiho"}, {"name": "Dmitry V. Strekalov"}, {"name": "Gerd Leuchs"}, {"name": "Christoph Marquardt"}], "featured_authors": [{"name": "Sheng-Hsuan Huang"}, {"name": "Thomas Dirmeier"}, {"name": "Andrea Aiello"}, {"name": "Dmitry V. Strekalov"}, {"name": "Gerd Leuchs"}, {"name": "Christoph Marquardt"}], "author_count": 7}, {"id": "2611.16903", "category": "quant-ph", "title": "Uncertainty-aware quantum machine learning based on Dempster-Shafer theory", "abstract": "A large body of work in quantum machine learning has centered on characterizing the expressivity and performance of quantum models. In contrast, little attention has been paid to the reliability of predictions beyond average performance measures such as accuracy. In this work, we introduce an uncertainty-aware quantum classification framework based on Dempster-Shafer theory. This theory allows to express uncertainty through weights assigned not only to individual classification labels but to sets of labels. We introduce a training strategy that enables parameterized quantum circuits to learn such assignments directly from data. This provides an efficient way to prepare the corresponding quantum states and enables the application of different post-processing strategies. In particular, it offers a practical setting for quantum Dempster-Shafer fusion procedures with polynomial resource requirements, even when the corresponding mass functions are defined over exponentially many subsets. Overall, our work represents a step toward enabling quantum models to express uncertainty about their predictions, thereby extending the evaluation of quantum models beyond predictive performance alone.", "url": "https://arxiv.org/abs/2611.16903", "type": "理论+数值", "summary": "量子机器学习领域的大量工作集中在表征量子模型的表达性和性能。相比之下，除了准确性等平均性能指标外，很少有人关注预测的可靠性。在这项工作中，我们介绍了一种基于 Dempster-Shafer 理论的不确定性感知量子分类框架。该理论允许通过不仅分配给单个分类标签而且分配给标签集的权重来表达不确定性。我们引入了一种训练策略，使参数化量子电路能够直接从数据中学习此类分配。这提供了一种有效的方法来准备相应的量子态，并能够应用不同的后处理策略。特别是，它为具有多项式资源需求的量子 Dempster-Shafer 融合程序提供了实用的设置，即使相应的质量函数是在指数多个子集上定义的。总的来说，我们的工作代表了使量子模型能够表达其预测的不确定性的一步，从而将量子模型的评估扩展到仅预测性能之外。", "authors": [{"name": "Marie Kempkes"}, {"name": "Jakob Spiegelberg"}, {"name": "Evert van Nieuwenburg"}, {"name": "Vedran Dunjko"}], "featured_authors": [{"name": "Marie Kempkes"}, {"name": "Jakob Spiegelberg"}, {"name": "Evert van Nieuwenburg"}, {"name": "Vedran Dunjko"}], "author_count": 4}, {"id": "2611.16962", "category": "quant-ph", "title": "Higher-Group Statistics on Lattices", "abstract": "Crossing a domain wall can permute anyons, and intersecting strings can create a particle. These couplings between defects of various dimensions are specified by higher groups. We develop a lattice framework defining higher-group statistics as Berry phases of closed sequences of hopping operators, invariant under local modifications of the operators. Our central example is a closed Majorana chain, a 1-dimensional topological superconductor, embedded in 3 dimensions. We construct a loop-flip process with phase $+i$, refining the usual $\\pm 1$ loop-flip invariant through intermediate transfer of fermion parity between the chain and physical fermions. In two dimensions, charge-wall statistics distinguish two $\\mathbb Z_4$ toric codes enriched by $\\mathbb Z_2$ charge-conjugation symmetry, with identical anyon statistics but distinct gauged theories: the quantum doubles of the dihedral group $D_4$ and the quaternion group $Q_8$. We provide two complementary constructions of statistical processes. The first extends the Smith normal form algorithm in [Phys. Rev. X $\\textbf{16}$, 011010 (2026), arXiv:2412.01886 ] to higher groups, generating processes from lattice geometry and prescribed local moves. For a finite higher group $\\mathbb G$, we prove that statistical processes on a $d$-sphere are classified by $H_{d+2}(B\\mathbb G,\\mathbb Z)$. The second constructs processes directly from homology classes without examining exponentially many defect configurations, enabling us to study statistics for complex higher-group structures where the previous method is computationally prohibitive. These processes detect boundary anomalies of higher-group symmetry-protected topological phases. For example, we distinguish 2-group anomalies in 1, 2, and 3 dimensions. Higher-group statistics provide new invariants for characterizing coupled defects in quantum many-body systems.", "url": "https://arxiv.org/abs/2611.16962", "type": "理论+数值", "summary": "跨越磁畴壁可以排列任意子，相交的弦可以创建粒子。这些不同维度的缺陷之间的耦合由更高的组指定。我们开发了一个格框架，将高群统计定义为跳跃算子的闭合序列的贝里相，在算子的局部修改下保持不变。我们的中心例子是一个封闭的马约拉纳链，一个嵌入三维的一维拓扑超导体。我们构建了一个阶段$+i$的循环翻转过程，通过链和物理费米子之间的费米子奇偶校验的中间传递来改进通常的$\\pm 1$循环翻转不变量。在二维中，电荷墙统计区分了两个由 $\\mathbb Z_2$ 电荷共轭对称性丰富的 $\\mathbb Z_4$ 复曲面码，具有相同的任意子统计但不同的规范理论：二面体群 $D_4$ 和四元数群 $Q_8$ 的量子双打。我们提供两种互补的统计过程结构。第一个扩展了 [Phys.1] 中的 Smith 范式算法。牧师。\n\nX $\\textbf{16}$, 011010 (2026), arXiv:2412.01886 ] 到更高的组，从晶格几何和规定的局部移动生成过程。对于有限更高群 $\\mathbb G$，我们证明 $d$ 球面上的统计过程可按 $H_{d+2}(B\\mathbb G,\\mathbb Z)$ 分类。第二种方法直接从同源类构建过程，而无需检查指数级的许多缺陷配置，这使我们能够研究复杂的高群结构的统计数据，而以前的方法在计算上是令人望而却步的。这些过程检测高群对称保护拓扑相的边界异常。例如，我们在 1、2 和 3 维度上区分 2 组异常。高群统计为表征量子多体系统中的耦合缺陷提供了新的不变量。", "authors": [{"name": "Chen Yang"}, {"name": "Yu-An Chen"}], "featured_authors": [{"name": "Chen Yang"}, {"name": "Yu-An Chen"}], "author_count": 2}, {"id": "2611.17036", "category": "quant-ph", "title": "Ergodicity breaking for data classification in a dissipative Ising model with competing two- and four-body interactions", "abstract": "We explore the close relationship between the processing of data and the dynamics of interacting many-body systems. For example, certain classes of quantum neural networks can be mapped onto dissipative quantum Ising models whose evolution is described by a Lindblad master equation. In these architectures, emergent nonlinearities lead to non-ergodic dynamics under which initial states located in different basins of attraction evolve towards distinguishable stationary states. This mechanism underlies the classification of quantum data. Motivated by this connection, we consider an Ising model with competing two- and four-body interactions. Using a combination of mean-field calculations and exact small-scale numerics, we show that the stationary state manifold can be designed to enable multi-class classification. We also investigate the structure of the ensuing basins of attraction, thereby showing that these systems allow for the classification of quantum states with nonlinear decision boundaries.", "url": "https://arxiv.org/abs/2611.17036", "type": "理论+数值", "summary": "我们探索数据处理与交互多体系统动力学之间的密切关系。例如，某些类别的量子神经网络可以映射到耗散量子伊辛模型，其演化由 Lindblad 主方程描述。在这些架构中，出现的非线性导致非遍历动力学，在这种动力学下，位于不同吸引力盆地的初始状态演变成可区分的静止状态。这种机制是量子数据分类的基础。受这种联系的启发，我们考虑具有竞争性二体和四体相互作用的伊辛模型。通过结合平均场计算和精确的小规模数值，我们表明可以设计稳态流形来实现多类分类。我们还研究了随后的吸引力盆地的结构，从而表明这些系统允许对具有非线性决策边界的量子态进行分类。", "authors": [{"name": "Simon Kochsiek"}, {"name": "Mario Boneberg"}, {"name": "Igor Lesanovsky"}], "featured_authors": [{"name": "Simon Kochsiek"}, {"name": "Mario Boneberg"}, {"name": "Igor Lesanovsky"}], "author_count": 3}, {"id": "2611.17061", "category": "quant-ph", "title": "Multi-particle quantum walk search on a two-dimensional lattice", "abstract": "In the present paper we study the formulation of a search problem and the efficiency of multi-particle quantum walk search algorithms. The discrete-time evolution of each particle in space is treated according to Grover's quantum walk evolution operator. We focus on the local interactions models, where the particles' states are modified only when two or more of them appear on the same grid site. The main focus is given to the two-dimensional grid in space. We study the dependence of the search algorithm asymptotic success time and probability on the interaction strength and the generated maximal entanglement between particles. We show that the interacting and non-interacting two- and three-particle search algorithm attains a constant factor improvement over the single-particle counterpart. In addition, we provide a new generalized model of interactions for multi-particle quantum walks.", "url": "https://arxiv.org/abs/2611.17061", "type": "理论+数值", "summary": "在本文中，我们研究了搜索问题的表述和多粒子量子行走搜索算法的效率。空间中每个粒子的离散时间演化根据格罗弗的量子行走演化算子进行处理。我们关注局部相互作用模型，其中只有当两个或多个粒子出现在同一网格位置时，粒子的状态才会被修改。主要关注空间中的二维网格。我们研究了搜索算法渐近成功时间和概率对相互作用强度和粒子之间生成的最大纠缠的依赖性。我们表明，相互作用和非相互作用的两粒子和三粒子搜索算法比单粒子搜索算法获得了恒定的因子改进。此外，我们还为多粒子量子行走提供了一种新的广义相互作用模型。", "authors": [{"name": "Gonçalo Meneses"}, {"name": "D. O. Oriekhov"}], "featured_authors": [{"name": "Gonçalo Meneses"}, {"name": "D. O. Oriekhov"}], "author_count": 2}, {"id": "2611.17158", "category": "quant-ph", "title": "Efficient computation of PEPS gradients for optimized quantum state preparation on 2D topologies", "abstract": "Quantum state preparation is a fundamental subroutine for quantum computation. For complex, entangled initial states it is, however, difficult to prepare shallow quantum circuits approximating the state with sufficient accuracy. Tensor networks provide a promising avenue of synthesis of such circuits, but most approaches employ 1D Matrix Products States, which struggle to accurately express entangled states in higher dimensions. Here we present a hardware topology-aware quantum state preparation method based on gradient optimization of 2D projected entangled pair states (PEPS). Our approach combines local disentanglement, with global fine tuning based on PEPS gradient optimization. Towards this end we describe an efficient procedure for PEPS gradient computation. We test the convergence and performance of our method in numerical simulations.", "url": "https://arxiv.org/abs/2611.17158", "type": "理论+数值", "summary": "量子态准备是量子计算的基本子程序。然而，对于复杂的纠缠初始态，很难制备以足够的精度逼近该态的浅量子电路。张量网络为此类电路的合成提供了一种有前景的途径，但大多数方法都采用一维矩阵积状态，该状态难以准确表达更高维度的纠缠态。在这里，我们提出了一种基于二维投影纠缠对态（PEPS）梯度优化的硬件拓扑感知量子态制备方法。我们的方法结合了局部解缠和基于 PEPS 梯度优化的全局微调。为此，我们描述了一种有效的 PEPS 梯度计算过程。我们在数值模拟中测试了我们方法的收敛性和性能。", "authors": [{"name": "Illia Lukin"}, {"name": "Vladyslav Bohun"}, {"name": "Maciej Koch-Janusz"}], "featured_authors": [{"name": "Illia Lukin"}, {"name": "Vladyslav Bohun"}, {"name": "Maciej Koch-Janusz"}], "author_count": 3}, {"id": "2611.17216", "category": "quant-ph", "title": "Explicit Absolutely Maximally Entangled states in dimensions twice a prime power", "abstract": "Absolutely maximally entangled (AME) states are pure multipartite states with maximally mixed reductions on every set of at most half the parties. We construct explicit families in local dimension $2q$, twice an odd prime power $q$, using an established coupling of qubits and $q$-level systems. The $q$-level states remove interference between branches, so the qubit states need maximally mixed reductions only on average. This gives AME$(9,2q)$ and AME$(11,2q)$ for every odd prime power $q\\geq5$, AME$(13,2q)$ for $q\\geq17$, AME$(15,2q)$ for $q\\geq9$, and AME$(17,2q)$ for $q\\geq67$. For every odd $N\\geq3$, the same coupling gives AME$(N,2q)$ under the sufficient condition $q\\geq\\max\\{N,2^{N-2}\\}$ on the odd prime power $q$. Within this coupling, the smallest such $q$ must grow exponentially with $N$. Combined with known inputs and products, these families complete the nine-party classification: for integer $d\\geq2$, an AME$(9,d)$ state exists if and only if $d\\geq3$. Choosing the branch pairing also gives AME$(15,2p)$ states with a cyclic shift of the parties compensated by local unitaries, for every prime $p\\equiv1\\pmod{15}$.", "url": "https://arxiv.org/abs/2611.17216", "type": "理论", "summary": "绝对最大纠缠（AME）状态是纯多方状态，每组最多一半的参与方具有最大混合约简。我们使用已建立的量子位和 $q$ 级系统的耦合，在局部维度 $2q$（奇质数幂 $q$ 的两倍）中构建显式族。 $q$ 级状态消除了分支之间的干扰，因此量子位状态仅需要平均最大混合减少。这对于每个奇素数幂 $q\\geq5$ 给出 AME$(9,2q)$ 和 AME$(11,2q)$，对于 $q\\geq17$ 给出 AME$(13,2q)$，对于 $q\\geq9$ 给出 AME$(15,2q)$，对于 $q\\geq67$ 给出 AME$(17,2q)$。对于每个奇数 $N\\geq3$，在充分条件 $q\\geq\\max\\{N,2^{N-2}\\}$ 上的奇素数幂 $q$ 上，相同的耦合给出 AME$(N,2q)$。在这种耦合中，最小的 $q$ 必须随 $N$ 呈指数增长。结合已知的输入和乘积，这些族完成了九方分类：对于整数 $d\\geq2$，当且仅当 $d\\geq3$ 时，存在 AME$(9,d)$ 状态。对于每个素数 $p\\equiv1\\pmod{15}$，选择分支配对还会给出 AME$(15,2p)$ 状态，其中各方的循环移位由局部酉补偿。", "authors": [{"name": "Palash Pandya"}], "featured_authors": [{"name": "Palash Pandya"}], "author_count": 1}, {"id": "2611.17262", "category": "quant-ph", "title": "Scalable Pauli propagation through $\\mathbb{F}_2$-linear partitioning", "abstract": "Pauli propagation simulates quantum circuits and many-body dynamics by evolving observables in the Heisenberg picture as sparse sums of Pauli strings. As Pauli-string operations reduce to bit manipulations, its performance is limited by memory bandwidth and capacity rather than computational throughput. Pooling the memory of many cores and nodes is hindered by the deduplication step after every gate, which can require global synchronization. We avoid this bottleneck by partitioning the strings with an $\\mathbb{F}_2$-linear hash function, which guarantees that a $k$-qubit channel couples each partition to at most $4^k$ partitions fixed by the gate, decomposing gate application into independent tasks with bounded communication. Benchmarks of our open-source implementation demonstrate efficient parallel scaling within and across compute nodes, enabling simulations with over $10^{11}$ Pauli strings and extending the accessible timescales of quantum many-body dynamics.", "url": "https://arxiv.org/abs/2611.17262", "type": "理论+数值", "summary": "泡利传播通过将海森堡图中的可观测量演化为泡利弦的稀疏和来模拟量子电路和多体动力学。由于泡利串运算简化为位操作，其性能受到内存带宽和容量的限制，而不是计算吞吐量的限制。每个门之后的重复数据删除步骤会阻碍池化许多核心和节点的内存，这可能需要全局同步。我们通过使用 $\\mathbb{F}_2$-线性哈希函数对字符串进行分区来避免这个瓶颈，这保证了 $k$-qubit 通道将每个分区耦合到由门固定的最多 $4^k$ 分区，将门应用程序分解为具有有限通信的独立任务。我们的开源实现的基准展示了计算节点内部和跨计算节点的高效并行扩展，支持使用超过 10^{11}$ 的泡利弦进行模拟，并扩展了量子多体动力学的可访问时间尺度。", "authors": [{"name": "Alev Orfi"}, {"name": "Andrew Kille"}, {"name": "J. Clayton Peacock"}, {"name": "Jack Dunham"}, {"name": "Lukas Devos"}], "featured_authors": [{"name": "Alev Orfi"}, {"name": "Andrew Kille"}, {"name": "J. Clayton Peacock"}, {"name": "Jack Dunham"}, {"name": "Lukas Devos"}], "author_count": 5}, {"id": "2611.17272", "category": "quant-ph", "title": "Stiffness in Confined Quantum Walks", "abstract": "We investigate boundary-induced stiffness in discrete-time quantum walks confined to a finite lattice by unitary reflecting boundaries implemented through coin-flip operations. We define a dimensionless spreading stiffness from the instantaneous variation of the spatial width relative to the asymptotic spreading rate of the corresponding unconfined Hadamard walk and compare localized, Gaussian, and truncated-uniform initial states. The long-time response retains a strong dependence on the initial spatial profile: the localized and truncated-uniform states show an overall increase in stiffness with increasing confinement size, whereas the Gaussian state exhibits a nonmonotonic dependence with a broad maximum at intermediate sizes. The first and second stiffness moments satisfy the expected asymptotic consistency relation in the high-stiffness regime. The normalized Kullback--Leibler divergence reveals a slower spatial reorganization and qualitatively different finite-size trends, showing that dynamical stiffness and spatial homogenization are distinct properties. These results indicate that unitary confinement produces an intrinsically nonstationary regime whose long-time properties emerge from the interplay between boundary reflections, system size, and the spatial structure of the initial state.", "url": "https://arxiv.org/abs/2611.17272", "type": "理论", "summary": "我们通过硬币翻转操作实现的单一反射边界来研究限制在有限晶格内的离散时间量子行走中的边界诱导刚度。我们根据空间宽度相对于相应无约束哈达玛行走的渐近扩展率的瞬时变化来定义无量纲扩展刚度，并比较局部、高斯和截断均匀初始状态。长时间响应保留了对初始空间轮廓的强烈依赖性：局部和截断均匀状态显示出刚度随着限制尺寸的增加而整体增加，而高斯状态则表现出非单调依赖性，在中间尺寸处具有广泛的最大值。第一和第二刚度矩满足高刚度状态下预期的渐近一致性关系。归一化的库尔贝克-莱布勒散度揭示了较慢的空间重组和定性不同的有限尺寸趋势，表明动态刚度和空间均匀化是不同的属性。\n\n这些结果表明，酉约束产生了一种本质上非平稳的状态，其长期特性源于边界反射、系统尺寸和初始状态的空间结构之间的相互作用。", "authors": [{"name": "Pablo G. M. Dantas"}, {"name": "Rafael Vieira"}, {"name": "Edgard P. M. Amorim"}], "featured_authors": [{"name": "Pablo G. M. Dantas"}, {"name": "Rafael Vieira"}, {"name": "Edgard P. M. Amorim"}], "author_count": 3}];

    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
