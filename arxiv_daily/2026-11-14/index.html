guez"}], "featured_authors": [{"name": "Eric Lescano"}, {"name": "Agustina Pereyra Grau"}, {"name": "Jesús A. Rodríguez"}], "author_count": 3}, {"id": "2611.15868", "category": "hep-th", "title": "Cosmological correlators and kinematic flow on complex Hartle-Hawking saddles", "abstract": "The Lorentzian gravitational path integral over homogeneous and isotropic metrics in a closed universe with positive cosmological constant is dominated by complex saddle points, such as the Hartle-Hawking saddles. We ask how to compute cosmological correlators on such complex backgrounds, and how they respond to the shifts of the kinematic variables---the kinematic flow---without tracking the bulk time evolution explicitly. We, specifically, study a conformally coupled scalar test field with a cubic interaction around these saddles. We find that the wave function coefficients can be written as discrete spectral sums with the summands containing the corresponding coefficients in the Einstein static universe, which are obtainable in analogy with the polytopes program for flat spacetime. Whereas the wave function coefficients of the flat FLRW case are given by integrals over shifted kinematics, the discrete spectrum on the three-sphere for Hartle-Hawking saddles produces sums. We identify the coefficients, which depend on the final hypersurface through a phase fixed by its size, with Srivastava-Daoust multi-variable hypergeometric functions. They satisfy recursion relations for any number of sites, under which the sums collapse into rational functions. For the one- and two-site Feynman-Witten tree diagrams, we derive difference equations in the kinematic variables which close on a finite set of sums, giving a discrete kinematic flow. The transformation matrices are upper triangular with rational elements, and satisfy a consistency condition which makes the flow path independent. We then obtain the two-, three- and four-point cosmological correlators. At the late-time conformal boundary, we derive an explicit difference equation for the four-point function.", "url": "https://arxiv.org/abs/2611.15868", "type": "理论", "summary": "在具有正宇宙学常数的封闭宇宙中，均匀和各向同性度量上的洛伦兹引力路径积分由复杂鞍点主导，例如哈特尔-霍金鞍点。我们询问如何在如此复杂的背景下计算宇宙学相关器，以及它们如何响应运动学变量（运动学流）的变化，而无需明确跟踪整体时间演化。我们具体研究了一个共形耦合标量测试场，这些测试场在这些鞍座周围具有立方相互作用。我们发现波函数系数可以写成离散谱和，被加数包含爱因斯坦静态宇宙中的相应系数，这可以与平坦时空的多面体程序类似地获得。平坦 FLRW 情况的波函数系数由平移运动学上的积分给出，而 Hartle-Hawking 鞍座的三球体上的离散谱则产生总和。我们使用 Srivastava-Daoust 多变量超几何函数来确定系数，这些系数取决于最终超曲面通过由其大小固定的相位。\n\n它们满足任意数量站点的递归关系，在该递归关系下，总和分解为有理函数。对于单点和两点 Feynman-Witten 树图，我们推导出运动学变量中的差分方程，该方程闭合于一组有限和，给出离散运动学流。变换矩阵是有理元的上三角矩阵，满足流路独立的一致性条件。然后我们得到两点、三点和四点宇宙学相关器。在后期共形边界，我们推导了四点函数的显式差分方程。", "authors": [{"name": "Vikramaditya Mondal"}, {"name": "Shinji Mukohyama"}], "featured_authors": [{"name": "Vikramaditya Mondal"}, {"name": "Shinji Mukohyama"}], "author_count": 2}, {"id": "2611.15870", "category": "hep-th", "title": "Cosmological Dressing Rules for Massive Scalars", "abstract": "The Schwinger-Keldysh formulation of de Sitter correlation functions comes in different guises including harmonic analysis and dressed flat space correlators. We observe that these are equivalent spectral representations of the same Sturm-Liouville problem. Starting from the latter we derive dressing rules for scalar fields of arbitrary mass with auxiliary propagators in the form of Euler integrals that are accessible to flat space diagrammatic tools.", "url": "https://arxiv.org/abs/2611.15870", "type": "理论", "summary": "德西特相关函数的施温格-凯尔迪什公式有不同的形式，包括谐波分析和修饰平坦空间相关器。我们观察到这些是同一 Sturm-Liouville 问题的等效谱表示。从后者开始，我们推导出具有欧拉积分形式的辅助传播器的任意质量标量场的修整规则，这些辅助传播器可以通过平坦空间图解工具访问。", "authors": [{"name": "Jonathan Gräfe"}, {"name": "Matthias Nowinski"}, {"name": "Ivo Sachs"}, {"name": "Siva Pawan Venna"}], "featured_authors": [{"name": "Jonathan Gräfe"}, {"name": "Matthias Nowinski"}, {"name": "Ivo Sachs"}, {"name": "Siva Pawan Venna"}], "author_count": 4}, {"id": "2611.15887", "category": "hep-th", "title": "Subsystem Flow: Quantum Error Correction, Petz Recovery, and Ergodic Inclusions", "abstract": "In quantum error correction (QEC), the goal is to engineer an encoding that protects logical information against the erasure of a physical subsystem. In local many-body quantum systems, by contrast, nature provides a subsystem inclusion $\\mN\\subset \\mM$ in a fixed reference state $\\ket{\\Omega}$. Asking whether the inclusion admits a reference-preserving code that protects subsystem $\\mN$ against erasure of the complement is equivalent to asking whether $\\mN$ is preserved under the modular dynamics of $\\mM$ in this state (modular autonomy). We define the subsystem flow, which measures the departure from this error correction regime. Away from autonomy, the infinitesimal flow quantifies relative-entropy loss, while the history algebra and persistent core describe which observables the modular orbit generates and retains. We call an inclusion ergodic when modular orbits generate everything and retain nothing. Analytic continuation of subsystem flow yields Petz recovery maps and a family of positive inclusion parent Hamiltonians. We show that, in general, evolving with these parent Hamiltonians allows $\\mN$ to leave $\\mM$, and in some cases, it can generate the entire $\\mM\\vee\\mM'$. Inclusions with a common cyclic and separating vector generate everything, and standard inclusions of factors, such as those of nested subregions in QFT, are ergodic. Moreover, the $L^2$-nuclearity property implies that the spectrum of parent Hamiltonians is discrete. We define a dissipative semigroup by repeating the Petz recovery map, whose fixed-point algebra is the modular persistent core and whose spectrum is gapped under the assumption of $L^2$-nuclearity. We conjecture that the eigenvalues and eigenvectors of inclusion parent Hamiltonians can be used to define local spectral measures of quantum chaos.", "url": "https://arxiv.org/abs/2611.15887", "type": "理论", "summary": "在量子纠错（QEC）中，目标是设计一种编码来保护逻辑信息免遭物理子系统的擦除。相比之下，在局部多体量子系统中，大自然提供了一个处于固定参考状态 $\\ket{\\Omega}$ 的子系统包含 $\\mN\\subset \\mM$。询问包含是否承认一个引用保留代码来保护子系统 $\\mN$ 免遭补集擦除，相当于询问 $\\mN$ 在这种状态下 $\\mM$ 的模块化动态下是否被保留（模块化自治）。我们定义了子系统流，它测量与此纠错机制的偏离。远离自主性，无穷小流量化相对熵损失，而历史代数和持久核心描述模块化轨道生成和保留哪些可观测量。当模轨道产生一切但不保留任何东西时，我们将其称为包含遍历。子系统流的分析延拓产生 Petz 恢复图和一系列正包含父哈密顿量。我们表明，一般来说，与这些父哈密顿量一起进化允许 $\\mN$ 离开 $\\mM$，并且在某些情况下，它可以生成整个 $\\mM\\vee\\mM'$。\n\n具有共同循环和分离向量的包含生成一切，并且因子的标准包含（例如 QFT 中的嵌套子区域）是遍历的。此外，$L^2$-核属性意味着父哈密顿量的谱是离散的。我们通过重复 Petz 恢复映射来定义耗散半群，其定点代数是模持久核，其谱在 $L^2$-核性假设下有间隙。我们推测包含父哈密顿量的特征值和特征向量可用于定义量子混沌的局部谱测度。", "authors": [{"name": "Yidong Chen"}, {"name": "Nima Lashkari"}, {"name": "Kwing Lam Leung"}], "featured_authors": [{"name": "Yidong Chen"}, {"name": "Nima Lashkari"}, {"name": "Kwing Lam Leung"}], "author_count": 3}, {"id": "2611.15921", "category": "hep-th", "title": "Exact Infrared Triangle in Gravity with Long-Range Interactions", "abstract": "Einstein gravity coupled to massless matter exhibits universality in the infrared. In the presence of long-range interactions we show that a novel superrotation charge conservation is equivalent to the massless limit of the classical logarithmic soft graviton theorem, and we propose a formula for the corresponding tail to the displacement memory. These results, which extend earlier work on gravity coupled to massive matter in a qualitatively different way, are exact in the gravitational coupling and reveal that long-range gravitational dressings resum. We also compute higher-order corrections to the known superrotation charge which are exact in the gravitational coupling and would correspond to a 1-loop exact correction to the Cachazo-Strominger subleading soft graviton theorem.", "url": "https://arxiv.org/abs/2611.15921", "type": "理论", "summary": "与无质量物质耦合的爱因斯坦引力在红外线中表现出普遍性。在存在长程相互作用的情况下，我们证明了一种新颖的超旋转电荷守恒相当于经典对数软引力子定理的无质量极限，并且我们提出了位移记忆相应尾部的公式。这些结果以一种性质不同的方式扩展了早期关于重力与大质量物质耦合的研究，在重力耦合方面是精确的，并揭示了长程引力修整的恢复。我们还计算了对已知超自转电荷的高阶修正，这些修正在引力耦合中是精确的，并且对应于 Cachazo-Strominger 次领先软引力子定理的 1 环精确修正。", "authors": [{"name": "Sangmin Choi"}, {"name": "Ameya Kadhe"}, {"name": "Prahar Mitra"}, {"name": "Andrea Puhm"}], "featured_authors": [{"name": "Sangmin Choi"}, {"name": "Ameya Kadhe"}, {"name": "Prahar Mitra"}, {"name": "Andrea Puhm"}], "author_count": 4}, {"id": "2611.15929", "category": "hep-th", "title": "Magnetic-slope crossovers in the QCD bulk-to-shear viscosity ratio", "abstract": "How a magnetic field alters dissipation in quark--gluon matter is almost unconstrained from first principles, since real-time transport is not directly accessible to lattice simulation. Using a top-down MQGP-inspired M/string-theory construction of a QCD-like thermal plasma, together with a kinetic-theory identity within a specified single-mode quasiparticle truncation and a compatibility construction using available lattice equation-of-state data, we propose a normalization-insensitive sign prediction that the field slope of the longitudinal bulk-to-shear viscosity ratio \\zeta_\\parallel/\\eta_\\parallel reverses sign twice with temperature---below and above the deconfinement pseudo-critical temperature T_0, at T_1<T_0<T_2 (the lower reversal T_1 conditional on a stated pion-gas rate inequality). A kinetic-theory identity with phase-appropriate carriers, a quark--gluon plasma above T_0 and a chiral pion gas below, reproduces the same pattern, and lattice speed-of-sound data can be shown to be consistent as well. The bottom-up VQCD in the deconfined phase supports a negative slope for large temperatures; the slope crossover is not resolvable from the available \\zeta_\\parallel/s, \\eta_\\parallel/s plots.", "url": "https://arxiv.org/abs/2611.15929", "type": "理论", "summary": "磁场如何改变夸克胶子物质的耗散几乎不受第一原理的限制，因为实时传输无法直接用于晶格模拟。使用自上而下的 MQGP 启发的 M/弦理论构造类 QCD 热等离子体，以及指定单模准粒子截断内的动力学理论恒等式以及使用可用晶格状态方程数据的兼容性构造，我们提出了一种归一化不敏感的符号预测，即纵向体剪切粘度比 \\zeta_\\parallel/\\eta_\\parallel 的场斜率随温度反转符号两次——低于和高于解禁伪临界温度 T_0，T_1<T_0<T_2（较低反转 T_1 以规定的π介子气体速率不等式为条件）。与相适当的载流子、T_0 上方的夸克-胶子等离子体和下方的手性介子气体的动力学理论相同，再现了相同的模式，并且晶格声速数据也可以被证明是一致的。\n\n去约束相中的自下而上的 VQCD 支持大温度的负斜率；斜率交叉无法从可用的 \\zeta_\\parallel/s、\\eta_\\parallel/s 图中解析。", "authors": [{"name": "Aalok Misra"}, {"name": "Shivam S. Kushwah"}, {"name": "Keshav Dasgupta"}, {"name": "Charles Gale"}, {"name": "Sangyong Jeon"}], "featured_authors": [{"name": "Aalok Misra"}, {"name": "Shivam S. Kushwah"}, {"name": "Keshav Dasgupta"}, {"name": "Charles Gale"}, {"name": "Sangyong Jeon"}], "author_count": 5}, {"id": "2611.15933", "category": "hep-th", "title": "Imaging the two-sided black hole interior with four-point correlators", "abstract": "We propose a boundary four-point function smeared with wavepackets, which probes local physics behind the horizon of a two-sided AdS black hole. At high frequencies, boundary wavepackets aimed at an interior bulk point travel along geodesics and scatter locally about the bulk point, factorizing the correlator into a flat-space like scattering amplitude. To obtain this configuration, we utilize a non-trivial time ordering of operators, and also use one state-dependent operator insertion moved halfway across the thermal circle. An interesting property of this observable is that it also probes features of nontrivial states: null shocks and matter shells behind the horizon show up as jumps in the observed signal as the bulk point crosses them, thereby imaging the black hole interior.", "url": "https://arxiv.org/abs/2611.15933", "type": "理论", "summary": "我们提出了一个涂有波包的边界四点函数，它探测两侧 AdS 黑洞视界后面的局部物理。在高频下，针对内部散装点的边界波包沿着测地线行进并在散装点周围局部散射，将相关器分解为类似散射幅度的平坦空间。为了获得这种配置，我们利用了算子的重要时间排序，并且还使用了一个与状态相关的算子插入，移动到热循环的一半。这个可观测值的一个有趣的特性是，它还探测了非平凡状态的特征：零激波和地平线后面的物质壳在体点穿过它们时表现为观测信号的跳跃，从而对黑洞内部进行成像。", "authors": [{"name": "Joydeep Chakravarty"}], "featured_authors": [{"name": "Joydeep Chakravarty"}], "author_count": 1}, {"id": "2611.15946", "category": "hep-th", "title": "Extension of Poincare superalgebra via hidden symmetries", "abstract": "Isometries of a manifold and special types of spinors called Killing spinors which are related to Killing vector fields constitute a symmetry superalgebra structure corresponding to Poincare superalgebra. The antisymmetric generalization of Killing vector fields to higher degree forms which are called Killing-Yano forms are considered. The odd part of the Poincare superalgebra is extended from the space of Killing vector fields and their rotational representation to the space of special odd Killing-Yano forms and special even closed conformal Killing-Yano forms. The even part is again corresponds to the space of Killing spinors. By defining the relevant brackets, we show that hidden symmetries and Killing spinors together define an extension of the Poincare superalgebra.", "url": "https://arxiv.org/abs/2611.15946", "type": "理论", "summary": "与 Killing 向量场相关的流形和特殊类型的旋量（称为 Killing 旋量）的等距构成了与庞加莱超代数相对应的对称超代数结构。考虑将 Killing 矢量场反对称推广到更高程度的形式，称为 Killing-Yano 形式。庞加莱超代数的奇数部分从Killing向量场及其旋转表示空间扩展到特殊奇奇Killing-Yano形式和特殊偶闭共形Killing-Yano形式的空间。偶数部分再次对应于杀死旋量的空间。通过定义相关的括号，我们证明隐藏对称性和杀死旋量一起定义了庞加莱超代数的扩展。", "authors": [{"name": "Ümit Ertem"}], "featured_authors": [{"name": "Ümit Ertem"}], "author_count": 1}, {"id": "2611.15993", "category": "hep-th", "title": "Self-Force and Bremsstrahlung in Finite Electrodynamics", "abstract": "We study the self-force and the accompanying Bremsstrahlung for a moving point charge in nonlinear electrodynamics with finite self-field and self-energy. The self-force in the Maxwell theory has been the subject of many studies, often by renowned physicists. After reviewing Coleman's lucid treatise for Maxwell among them, we wish to explore the same question in the Born--Infeld theory, our prototype. We independently compute the local self-force and the global radiative dissipation, and show how the two are mutually consistent. Despite the nonlinearity turning off for the asymptotic radiative field, its residual effect survives via the effective multipole moments of a moving charge, allowing deviation from Maxwell. We close with a detailed discussion about two different manifestations of the self-force in the literature and how these enter our computation. One of the appendices explores Born--Infeld ModMax as a generalization.", "url": "https://arxiv.org/abs/2611.15993", "type": "理论", "summary": "我们研究了具有有限自场和自能的非线性电动力学中移动点电荷的自力和伴随的轫致辐射。麦克斯韦理论中的自力一直是许多研究的主题，通常是由著名物理学家进行的。在回顾了科尔曼为麦克斯韦撰写的清晰的论文之后，我们希望在我们的原型——玻恩-因费尔德理论中探索同样的问题。我们独立计算局部自力和全局辐射耗散，并展示两者如何相互一致。尽管渐进辐射场的非线性关闭，但其残余效应通过移动电荷的有效多极矩而存在，从而允许偏离麦克斯韦。最后，我们详细讨论了文献中自力的两种不同表现形式以及它们如何进入我们的计算。其中一个附录探讨了 Born-Infeld ModMax 作为一种概括。", "authors": [{"name": "Kyungsun Lee"}, {"name": "Piljin Yi"}], "featured_authors": [{"name": "Kyungsun Lee"}, {"name": "Piljin Yi"}], "author_count": 2}, {"id": "2611.16029", "category": "hep-th", "title": "Silent Heavy Fields: An Exclusion Rule for the Cosmological Collider", "abstract": "The cosmological collider uses oscillatory signatures in primordial correlators to probe heavy fields during inflation. This probe has blind spots, as heavy fields can keep ticking in time while remaining silent in the correlators. In this letter, we derive an exclusion rule under which cosmological collider signals vanish. The rule covers two classes of diagrams where a de Sitter invariant heavy sector couples covariantly to a single external field at one vertex. We first prove it for exchanges mediated by the two-point function of the heavy sector to all loop orders, using a spectral decomposition followed by a field redefinition. The result then extends to one-loop polygons by matching their oscillatory contributions onto those of the first class. The approximate signals of previously studied processes that fall into these classes must therefore be revisited. As a nonvanishing example, we derive the leading signal of a triangle loop for the first time in a toy model motivated by chemical potentials.", "url": "https://arxiv.org/abs/2611.16029", "type": "理论", "summary": "宇宙对撞机利用原初相关器中的振荡特征来探测暴胀期间的重场。该探测器存在盲点，因为重磁场可以及时保持滴答作响，同时在相关器中保持沉默。在这封信中，我们推导出了宇宙对撞机信号消失的排除规则。该规则涵盖两类图，其中德西特不变重扇区协变耦合到一个顶点处的单个外部场。我们首先使用谱分解和字段重新定义来证明重扇区的两点函数与所有循环阶之间的交换。然后，通过将其振荡贡献与第一类的振荡贡献相匹配，将结果扩展到单环多边形。因此，必须重新审视先前研究的属于这些类别的过程的近似信号。作为一个非消失的例子，我们首次在由化学势驱动的玩具模型中推导出三角形环的主导信号。", "authors": [{"name": "Shuntaro Aoki"}, {"name": "Zhehan Qin"}, {"name": "Masahide Yamaguchi"}, {"name": "Yuhang Zhu"}], "featured_authors": [{"name": "Shuntaro Aoki"}, {"name": "Zhehan Qin"}, {"name": "Masahide Yamaguchi"}, {"name": "Yuhang Zhu"}], "author_count": 4}, {"id": "2611.16047", "category": "hep-th", "title": "Anti-periodic Gravitino and Dirac Effective Operators", "abstract": "Introducing a preserved $U(1)_R$ symmetry forbids gravitini Majorana masses while allowing a Dirac mass. We investigate how a Dirac mass for gravitini can be described by an effective operator in $N=1$ superspace, in analogy with the well-known Dirac gaugino mass. We find that the corresponding spin-$3/2$ bilinear operator can be expressed in terms of gauge-invariant gravitino curvature superfields coupled through a nonlocal kernel involving an inverse d'Alembertian. We study this construction in minimal five-dimensional supergravity compactified on $S^1/\\mathbb Z_2$. The gravitino satisfies anti-periodic boundary conditions induced by a Scherk-Schwarz twist. The physical Kaluza-Klein Dirac masses then appear as poles in the two-point functions of the curvature superfields associated with sources localized at the endpoints. Separation of physical and gauge modes relates these propagators to a quadratic fermionic kernel represented by a $16\\times16$ matrix. Its elements match the fermionic components of two invariants written in $N=1$ superspace, including their spinor contractions and normalization. This matching is carried out on a fixed background with a nonzero radion auxiliary field.", "url": "https://arxiv.org/abs/2611.16047", "type": "理论", "summary": "引入保留的 $U(1)_R$ 对称性会禁止引力马约拉纳质量，同时允许狄拉克质量。我们研究如何在 $N=1$ 超空间中通过有效算子来描述引力的狄拉克质量，类似于著名的狄拉克高吉诺质量。我们发现相应的自旋$3/2$双线性算子可以用规范不变的引力曲率超场来表示，通过涉及逆达朗伯的非局部核耦合。我们在 $S^1/\\mathbb Z_2$ 上压缩的最小五维超重力中研究这种结构。引力子满足由 Scherk-Schwarz 扭曲引起的反周期边界条件。然后，物理卡鲁扎-克莱因狄拉克质量在与位于端点的源相关的曲率超场的两点函数中显示为极点。物理模式和规范模式的分离将这些传播器与由 $16\\times16$ 矩阵表示的二次费米子核相关联。它的元素与 $N=1$ 超空间中写入的两个不变量的费米子分量相匹配，包括它们的旋量收缩和归一化。\n\n这种匹配是在具有非零放射性辅助场的固定背景上进行的。", "authors": [{"name": "Karim Benakli"}], "featured_authors": [{"name": "Karim Benakli"}], "author_count": 1}, {"id": "2611.16074", "category": "hep-th", "title": "Holographic Wilsonian RG of Yang-Mills theory in AdS", "abstract": "In this work, we extend the equilibrium-evolution duality between stochastic quantization and Wilsonian renormalization to non-abelian gauge theories in anti-de Sitter space, for which the radial coordinate of AdS plays the role of the stochastic time. We show, to all orders in the fields for bulk theories without explicit radial dependence, that the Langevin distribution at time $t$ is the product of the ultraviolet and infrared radial wavefunctions at the cutoff $\\epsilon=t$. We therefore identify this Langevin process as the ground-state (Doob) transform of the radial evolution. By explicit calculation, we also extend the existing dictionary in the stochastic-renormalization duality: the radial component of the bulk field is Zwanziger's stochastic gauge-fixing function; radial gauge is Parisi-Wu quantization; and the bulk gauge $A_z=\\alpha^{-1}\\partial_iA_i$ is Zwanziger's gauge. We also obtain the expressions for the triple-trace and quadruple-trace couplings of the holographic Wilsonian action at finite cutoff in closed form; in the infrared, they reduce to the known gluon correlators and, at the total-energy pole, to flat-space Yang-Mills amplitudes as expected. Although our explicit results are provided at tree-level and derived in AdS$_4$, we also comment on the de Sitter counterpart of these statements and on the loop corrections.", "url": "https://arxiv.org/abs/2611.16074", "type": "理论", "summary": "在这项工作中，我们将随机量化和威尔逊重整化之间的平衡演化对偶性扩展到反德西特空间中的非阿贝尔规范理论，其中AdS的径向坐标扮演随机时间的角色。我们证明，对于没有明确径向依赖性的体理论领域中的所有阶数，$t$ 时刻的朗之万分布是截止点 $\\epsilon=t$ 处的紫外和红外径向波函数的乘积。因此，我们将朗之万过程识别为径向演化的基态（Doob）变换。通过显式计算，我们还扩展了随机重正化对偶性中的现有字典：体场的径向分量是Zwanziger的随机规范固定函数；径向规范为Pararisi-Wu量子化；体积规格 $A_z=\\alpha^{-1}\\partial_iA_i$ 是 Zwanziger 的规格。我们还得到了有限截止时全息威尔逊作用的三迹和四迹耦合的封闭形式表达式；在红外线中，它们减少到已知的胶子相关器，并且在总能量极点，减少到预期的平坦空间杨-米尔斯振幅。\n\n尽管我们的显式结果是在树级别提供并在 AdS$_4$ 中导出的，但我们还对这些语句的 de Sitter 对应部分以及循环更正进行了评论。", "authors": [{"name": "Soner Albayrak"}], "featured_authors": [{"name": "Soner Albayrak"}], "author_count": 1}, {"id": "2611.16187", "category": "hep-th", "title": "Holographic Counterterms from Restricted Weyl Symmetry in Even-Dimensional Einstein-AdS Gravity", "abstract": "We develop a symmetry-based approach to renormalization for even-dimensional Einstein-AdS gravity based on infinitesimal bulk Weyl transformations that preserve its field equations asymptotically. We determine a bulk-covariant completion of the Einstein-Hilbert density by requiring its variation under restricted Weyl transformations with parameter $\\Sigma(X)$ to vanish modulo terms whose integrals remain finite as the radial cutoff is removed. This requirement induces two types of compensating terms with fixed couplings: the Euler density and a hierarchy of covariant total derivatives. The resulting recursive relations admit a factorized solution in terms of shifted Laplacians, yielding a closed-form completion in arbitrary even bulk dimensions. On Einstein backgrounds, these expressions agree, after matching normalizations, with those obtained through the ambient construction of conformal invariants. The associated renormalized-volume identity establishes on-shell finiteness for Euclidean AlAdS Einstein geometries in arbitrary even dimensions. The prescription reproduces the known conformally renormalized actions in four, six and eight dimensions and provides an explicit ten-dimensional completion involving powers of the Laplacian up to $\\Box^3$. Applications to eight- and ten-dimensional AdS black holes with non-conformally-flat Einstein horizons yield finite on-shell actions in agreement with Holographic Renormalization.", "url": "https://arxiv.org/abs/2611.16187", "type": "理论", "summary": "我们开发了一种基于对称性的偶维爱因斯坦-AdS 引力重整化方法，该方法基于渐进地保留其场方程的无穷小体积 Weyl 变换。我们通过要求其在参数 $\\Sigma(X)$ 的受限 Weyl 变换下的变化来确定爱因斯坦-希尔伯特密度的体协变完成，以消除模项，其积分在径向截止被移除时保持有限。这一要求引入了两种具有固定耦合的补偿项：欧拉密度和协变全导数的层次结构。由此产生的递归关系允许根据移位拉普拉斯算子进行因式分解，从而在任意甚至体积维度上产生封闭形式的完成。在爱因斯坦背景下，这些表达式在匹配归一化后与通过共形不变量的环境构造获得的表达式一致。相关的重正化体积恒等式为任意偶数维度的欧几里得 AlAdS 爱因斯坦几何建立了壳上有限性。\n\n该处方在四维、六维和八维中再现了已知的共形重整化动作，并提供了涉及高达 $\\Box^3$ 的拉普拉斯幂的明确的十维完成。应用于具有非共形平坦爱因斯坦视界的八维和十维 AdS 黑洞会产生与全息重正化一致的有限壳上作用。", "authors": [{"name": "Giorgos Anastasiou"}], "featured_authors": [{"name": "Giorgos Anastasiou"}], "author_count": 1}, {"id": "2611.16280", "category": "hep-th", "title": "Multiparticle residues of open-string tachyon amplitudes from DDF sewing", "abstract": "We compute the maximal simultaneous residues of color-ordered tachyon disk amplitudes in the critical open bosonic string by summing all physical intermediate states. Sewing cubic Del Giudice--Di Vecchia--Fubini (DDF) vertices reduces this sum to Gaussian contractions for any planar cubic tree, with the internal levels specified independently. Each internal level fixes an exact finite mode cutoff. The residue then follows by coefficient extraction in the sewing variables from a determinant prefactor times the exponential of a quadratic form in the sources. With consistent sewing conventions, the local-coordinate scales cancel between the vertices and the sewing metric. At four points, cubic local maps and a one-boson stress-tensor Ward identity give an all-order resummation that recovers the Veneziano pole coefficients. The same construction gives explicit matrices for the five-point double residue and the six-point comb and snowflake, with low-level checks against independent Koba--Nielsen expansions. The determinant is the vacuum sewing factor of the transverse bosons. We formulate the operator, coordinate-map and measure identities needed to relate this construction to Grunsky operators and the full higher-point Koba--Nielsen top forms.", "url": "https://arxiv.org/abs/2611.16280", "type": "理论", "summary": "我们通过对所有物理中间状态求和来计算临界开放玻色弦中颜色排序的快子盘振幅的最大同时残差。缝合立方 Del Giudice--Di Vecchia--Fubini (DDF) 顶点可将任何平面立方树的总和减少为高斯收缩，且内部级别独立指定。每个内部级别都固定一个精确的有限模式截止。然后，从行列式前因子乘以源中的二次形式的指数中提取缝合变量中的系数，得到余数。通过一致的缝纫约定，局部坐标比例在顶点和缝纫度量之间取消。在四个点处，三次局部映射和单玻色子应力张量 Ward 恒等式给出了恢复 Veneziano 极系数的全序恢复。相同的构造给出了五点双留数和六点梳和雪花的显式矩阵，并对独立的 Koba-Nielsen 展开进行了低级检查。行列式是横向玻色子的真空缝合因子。\n\n我们制定了将这种构造与 Grunsky 算子和完整的更高点 Koba-Nielsen 顶形式联系起来所需的算子、坐标图和测量恒等式。", "authors": [{"name": "Dripto Biswas"}, {"name": "Qu Cao"}], "featured_authors": [{"name": "Dripto Biswas"}, {"name": "Qu Cao"}], "author_count": 2}, {"id": "2611.16309", "category": "hep-th", "title": "Generalized Kosmann derivative and symmetry operators on Dirac structures", "abstract": "We develop a spinorial symmetry framework for metric Dirac structures in $H$-twisted exact Courant algebroids. A generalized metric equips a Dirac structure with an intrinsic Riemannian Lie-algebroid geometry and identifies it isometrically with the positive subbundle of the generalized tangent bundle. For sections preserving the generalized metric, we prove an exact intertwining between the positive-spinor Kosmann--Dorfman action and the intrinsic Kosmann derivative. The comparison is independent of the auxiliary compatible generalized connection. Within the intrinsic geometry we derive Killing--Yano (KY) and conformal Killing--Yano (CKY) integrability identities, construct Killing-spinor-preserving operators from odd special KY and even special closed CKY forms, and obtain these forms from Hermitian bilinears of Killing spinors with imaginary Killing number. We illustrate the framework on a global Dirac structure over $S^2\\times S^1$ with nontrivial $H$-flux class and rank-two anchor. Its spin connection and symmetry operators are explicit, and its Killing-spinor space is a transverse family $C^\\infty(S^1,\\mathbb C^2)$. Finally, intrinsic Killing sections act on Killing spinors by a Lie algebra representation. For a graph Dirac structure over $S^3$, the odd Jacobi identity of the Hermitian-current bracket fails by a phase, and adjoining a single even phase generator yields a Lie superalgebra. These results connect generalized isometries, hidden spinorial symmetries, and flux-sensitive Lie-algebroid geometry.", "url": "https://arxiv.org/abs/2611.16309", "type": "理论", "summary": "我们为 $H$ 扭曲精确库朗代数体中的度量狄拉克结构开发了一个旋对称框架。广义度量为狄拉克结构配备了固有的黎曼李代数体几何，并将其与广义正切丛的正子丛等距识别。对于保留广义度量的部分，我们证明了正旋量 Kosmann-Dorfman 作用和内在 Kosmann 导数之间的精确交织。该比较与辅助兼容广义连接无关。在内几何中，我们导出Killing--Yano (KY) 和共形Killing--Yano (CKY) 可积恒等式，从奇数特殊KY 和偶数特殊闭CKY 形式构造Killing-自旋保持算子，并从具有虚数Killing 数的Killing 旋量的埃尔米特双线性中获得这些形式。我们在 $S^2\\times S^1$ 上说明了全局狄拉克结构的框架，具有非平凡的 $H$-flux 类和二级锚点。它的自旋连接和对称算子是显式的，并且它的Killing-spinor空间是横向族$C^\\infty(S^1,\\mathbb C^2)$。\n\n最后，内在的 Killing 部分通过李代数表示作用于 Killing 旋量。对于 $S^3$ 上的图狄拉克结构，埃尔米特电流括号的奇雅可比恒等式失败一个相位，并且毗邻单个偶相位生成器产生李超代数。这些结果将广义等距、隐旋对称性和通量敏感的李代数几何联系起来。", "authors": [{"name": "Ümit Ertem"}, {"name": "Özgür Açık"}, {"name": "Özgür Kelekçi"}], "featured_authors": [{"name": "Ümit Ertem"}, {"name": "Özgür Açık"}, {"name": "Özgür Kelekçi"}], "author_count": 3}, {"id": "2611.16364", "category": "hep-th", "title": "Thermodynamics within and across AdS Gauss--Bonnet holographic CFTs", "abstract": "We study thermal competition within individual holographic conformal field theories (CFTs) and across theories with different anomaly coefficients in five-dimensional AdS Gauss--Bonnet gravity. We derive the work term conjugate to the dimensionless coupling from the boundary first law and use a common boundary clock to compare charged spherical saddles at fixed external source. Varying this source drives a first-order switch between the CFTs at the endpoints of the chosen coupling interval. In the unit-lapse cylinder clock with the zero-type-D vacuum energy, strict concavity at fixed radius reduces the global comparison to these two endpoints. The preferred coupling jumps across the coexistence line, whose slope is related to the entropy difference by a generalized Clapeyron relation. Where the Einstein endpoint itself undergoes small--large coexistence, a third saddle joins the competition and produces a kink in the cross-theory boundary. A compensating change of the external control preserves saddle ordering under finite energy shifts. Within fixed CFTs, we determine the neutral Hawking--Page line and the charged small--large black hole coexistence surface. The critical charge tends to zero at a finite coupling. The entropy gap closes with exponent one half, and the heat capacity diverges with exponent two thirds along a temperature sweep at the critical charge.", "url": "https://arxiv.org/abs/2611.16364", "type": "理论", "summary": "我们研究了单个全息共形场理论 (CFT) 内的热竞争以及五维 AdS 高斯 - Bonnet 引力中具有不同异常系数的理论之间的热竞争。我们从边界第一定律推导出无量纲耦合的工作项共轭，并使用公共边界时钟来比较固定外部源下的带电球形鞍。改变该源会在所选耦合间隔的端点处驱动 CFT 之间的一阶切换。在具有零 D 型真空能量的单位经过圆柱钟中，固定半径处的严格凹性降低了与这两个端点的全局比较。首选耦合跨越共存线，其斜率通过广义克拉佩龙关系与熵差相关。当爱因斯坦端点本身经历小-大共存时，第三个鞍点加入竞争，并在跨理论边界产生扭结。外部控制的补偿性改变在有限能量转移下保持鞍排序。在固定的 CFT 内，我们确定中性的霍金-佩奇线和带电的小-大黑洞共存面。\n\n有限耦合时临界电荷趋于零。熵差以指数二分之一闭合，并且热容沿着临界电荷处的温度扫描以指数三分之二发散。", "authors": [{"name": "Limin Zeng"}], "featured_authors": [{"name": "Limin Zeng"}], "author_count": 1}, {"id": "2611.16544", "category": "hep-th", "title": "Matching lattice and continuum chiral determinants at finite volume", "abstract": "Recent formulations of lattice chiral gauge theories define a complex fermion weight either through Craig's gauge-invariant overlap measure or, following Hsu and Witten, through a continuum Weyl determinant on a reconstructed gauge connection, with its phase fixed by the five-dimensional $\\eta$-invariant. For one $SU(5)$ generation on a flat four-torus, we prove that their relative weights agree in the continuum limit along smooth gapped paths, after fixing a normalization and subtracting a local Yang-Mills counterterm, whose coefficient we determine. On bounded smooth families a uniform Dirac gap suffices: the vacuum expansion need not converge. We obtain explicit uniform convergence rates for the logarithmic variations and, for Craig's interpolation, prove the reconstruction bounds that the matching requires, extending Hsu's small-field comparison to finite amplitude. For Hsu's reflection-positive reconstruction with flat collars, the phase variations still match, while the logarithmic coefficient of the quadratic counterterm is enhanced by a calculable, profile-dependent factor. In a hypercharge background on which the vacuum expansion diverges, numerical comparisons at the input gauge field support quadratic convergence of the phase, whereas the modulus acquires a logarithmic correction to quadratic scaling, whose coefficient follows analytically from the free overlap vacuum polarization.", "url": "https://arxiv.org/abs/2611.16544", "type": "理论", "summary": "格子手性规范理论的最新表述通过克雷格的规范不变重叠测度定义了复杂的费米子权重，或者按照 Hsu 和 Witten 的思路，通过重构规范连接上的连续统 Weyl 行列式定义了复杂的费米子权重，其相位由五维 $\\eta$ 不变量固定。对于平坦四环上的 $SU(5)$ 代，在修复归一化并减去局部 Yang-Mills 反项（我们确定其系数）后，我们证明它们的相对权重在沿着平滑间隙路径的连续极限内一致。在有界光滑族上，均匀的狄拉克间隙就足够了：真空展开不需要收敛。我们获得了对数变化的显式一致收敛率，并且对于 Craig 的插值，证明了匹配所需的重构边界，将 Hsu 的小场比较扩展到有限幅度。对于 Hsu 的平环反射正重建，相位变化仍然匹配，而二次反项的对数系数通过可计算的、轮廓相关的因子得到增强。\n\n在真空膨胀发散的超充背景下，输入规范场处的数值比较支持相位的二次收敛，而模量获得二次缩放的对数校正，其系数在分析上遵循自由重叠真空极化。", "authors": [{"name": "Zhengwen Liu"}], "featured_authors": [{"name": "Zhengwen Liu"}], "author_count": 1}, {"id": "2611.16568", "category": "hep-th", "title": "Accelerating solitons in Rindler space", "abstract": "Relativistic nonlinear field theories that are integrable in two-dimensional Minkowski spacetime remain integrable in Rindler space. We investigate the properties of classical sine-Gordon (SG) solitons in Rindler space. Accelerating observers in each of the two Rindler wedges can see only a portion of the full soliton in Minkowski spacetime; this portion itself forms a soliton carrying a partial topological charge. The soliton solution admits the following interpretation: a soliton incoming from the horizon decelerates to stop at some point, then falls back and accelerates to the speed of light toward the horizon. Energy can flow into and out of the Rindler horizon. The higher energy soliton gains energy from the horizon while the lower one loses energy.", "url": "https://arxiv.org/abs/2611.16568", "type": "理论", "summary": "在二维 Minkowski 时空中可积的相对论非线性场论在 Rindler 空间中仍然可积。我们研究 Rindler 空间中经典正弦戈登 (SG) 孤子的性质。两个 Rindler 楔中的加速观察者只能看到闵可夫斯基时空中完整孤子的一部分；这部分本身形成带有部分拓扑电荷的孤子。孤子解决方案承认以下解释：从地平线进入的孤子减速并在某个点停止，然后回落并加速到朝向地平线的光速。能量可以流入和流出林德勒地平线。能量较高的孤子从视界获得能量，而能量较低的孤子则失去能量。", "authors": [{"name": "Huiquan Li"}, {"name": "Jianyong Wang"}], "featured_authors": [{"name": "Huiquan Li"}, {"name": "Jianyong Wang"}], "author_count": 2}, {"id": "2611.16684", "category": "hep-th", "title": "Is Spin Slow in Hot QCD?", "abstract": "Promoting spin to a hydrodynamic variable requires slow relaxation, as mass-suppressed helicity flips in hot QCD suggest. Using the full leading-order collision operator, we show instead that light-quark spin damps at the transport rate $g^4T\\ln(1/g)$, nearly as fast as vector currents. Since spatial spin locks to momentum, helicity-conserving soft, small-angle scatterings readily rotate it. Damping involves multiple kinetic modes beyond a single relaxation time, global rotation adds only reversible precession, and stronger coupling further disfavors a slow spin mode in quark-gluon plasma.", "url": "https://arxiv.org/abs/2611.16684", "type": "理论", "summary": "将自旋提升为流体动力学变量需要缓慢弛豫，正如热 QCD 中质量抑制螺旋性翻转所表明的那样。使用完整的前序碰撞算子，我们表明轻夸克自旋以传输速率 $g^4T\\ln(1/g)$ 衰减，几乎与矢量流一样快。由于空间自旋锁定动量，螺旋度守恒的软小角度散射很容易使其旋转。阻尼涉及超出单个弛豫时间的多种动力学模式，全局旋转仅增加可逆进动，而更强的耦合进一步不利于夸克-胶子等离子体中的慢自旋模式。", "authors": [{"name": "Zi-Hao Liu"}, {"name": "Mei Huang"}], "featured_authors": [{"name": "Zi-Hao Liu"}, {"name": "Mei Huang"}], "author_count": 2}, {"id": "2611.16696", "category": "hep-th", "title": "Discrete anomaly inflow from SymTFT of $U(1)$ global symmetry: the modified Villain resolution", "abstract": "We construct a lattice SymTFT for a $U(1)$ global symmetry with anomaly coefficient $k$ using the modified Villain formulation, in which the spin structure required for odd $k$ is realised explicitly by lattice Majorana fermions. We demonstrate that the same Majorana fermions sit at the junctions of the symmetry lines, exactly where the fusion of two $U(1)$ elements wraps around the circle. From the lattice algebra of lines and junctions we derive the $R$- and $F$-symbols in the bulk and on the gapped boundary, and show that for odd $k$ the boundary $F$-symbol obeys the Gu-Wen relation for the $U(1)$ symmetry defect, without passing through a bosonic shadow. Restricting to $\\mathbb{Z}_2\\subset U(1)$, we reproduce the mod-4 anomalous phase from a mapping torus and the fermionic stacking rule. As a simple application of this SymTFT, we also determine which subgroups $\\mathbb{Z}_d\\subset U(1)$ can be gauged and the symmetry of the resulting theories. This is a first step towards deriving, from the anomaly inflow of a continuous symmetry, the junction data of global anomalies beyond group cohomology.", "url": "https://arxiv.org/abs/2611.16696", "type": "理论", "summary": "我们使用修改后的 Villain 公式构建了具有异常系数 $k$ 的 $U(1)$ 全局对称性的晶格 SymTFT，其中奇数 $k$ 所需的自旋结构由晶格马约拉纳费米子明确实现。我们证明相同的马约拉纳费米子位于对称线的交界处，正是两个 $U(1)$ 元素的融合环绕圆圈的位置。从线和交点的晶格代数中，我们推导出块体和间隙边界上的 $R$- 和 $F$-符号，并表明对于奇数 $k$，边界 $F$-符号遵循 $U(1)$ 对称缺陷的 Gu-Wen 关系，而不穿过玻色子阴影。限制于 $\\mathbb{Z}_2\\subset U(1)$，我们从映射环面和费米子堆叠规则重现 mod-4 反常相位。作为此 SymTFT 的简单应用，我们还确定可以测量哪些子群 $\\mathbb{Z}_d\\subset U(1)$ 以及所得理论的对称性。这是从连续对称性的异常流入中导出超越群上同调的全局异常的交汇数据的第一步。", "authors": [{"name": "Napat Poovuttikul"}, {"name": "K. Sapmee"}], "featured_authors": [{"name": "Napat Poovuttikul"}, {"name": "K. Sapmee"}], "author_count": 2}, {"id": "2611.16823", "category": "hep-th", "title": "Finite cyclic monodromy in BMS3 gravity", "abstract": "We investigate inducing data for three dimensional asymptotically flat BMS gravity on hyperbolic Virasoro orbits with winding, which contain no constant supermomentum, and the restriction of formal smooth equivariant sections to global Lorentz orbits. Using the developing map of the associated Hill operator we rederive their stabilizer and show that, in the spin double cover, it is the direct product of a line with a cyclic group of even order. The character of the cyclic factor is therefore a discrete inducing label independent of the continuous one, unlike for the massive BMS particles, where it is fixed by the spin. At points with the corresponding finite rotational symmetry, restriction of formal smooth equivariant sections to a global Lorentz orbit yields the finite cyclic equivariance condition, while an independently defined unitary global branch realizes the associated finite difference equation. At points with timelike projected momentum we derive the resulting ladder of Poincare helicities, show that the projected rest energy is not an orbit invariant, construct locally flat winding BMS geometries with hyperbolic Lorentz holonomy, prove that the smooth real periodic near horizon current model excludes these winding orbits, and obtain selection rules and closed form expressions for finite monodromy resolved orbital functionals. A unitary realization on the full infinite dimensional orbit is not constructed, and the interpretation of the cyclic sectors in quantum gravity remains conjectural.", "url": "https://arxiv.org/abs/2611.16823", "type": "理论", "summary": "我们研究了在具有缠绕的双曲 Virasoro 轨道上的三维渐近平坦 BMS 引力的感应数据，该轨道不包含恒定的超动量，以及形式光滑等变截面对全局洛伦兹轨道的限制。使用相关希尔算子的展开图，我们重新推导了它们的稳定子，并表明，在自旋双覆盖中，它是具有偶阶循环群的直线的直积。因此，循环因子的特征是独立于连续因子的离散诱导标签，这与通过自旋固定的大量 BMS 粒子不同。在具有相应有限旋转对称性的点处，将形式光滑等变截面限制到全局洛伦兹轨道产生有限循环等变条件，而独立定义的酉全局分支实现相关的有限差分方程。\n\n在具有类时投影动量的点上，我们推导了庞加莱螺旋梯，表明投影静止能量不是轨道不变性，用双曲洛伦兹完整性构造局部平坦缠绕BMS几何结构，证明光滑实周期近地平线电流模型排除了这些缠绕轨道，并获得了有限单向解析轨道泛函的选择规则和封闭形式表达式。完整的无限维轨道的统一实现尚未构建，并且量子引力中循环扇区的解释仍然是推测性的。", "authors": [{"name": "Evangelos Melas"}], "featured_authors": [{"name": "Evangelos Melas"}], "author_count": 1}, {"id": "2611.16824", "category": "hep-th", "title": "Gauge Theory Bootstrap with varying $N_c$", "abstract": "We use the Gauge Theory Bootstrap to study asymptotically free gauge theories with a varying number of colors $N_c$. The parameter $N_c$ enters the computation through the sum rules and asymptotic form factors, allowing us to tune this microscopic parameter directly and examine the corresponding low-energy strongly coupled dynamics. For $3\\le N_c\\le 12$, we extract the scattering lengths, effective ranges, and low-energy constants $\\bar{l}_i$, and study their $N_c$ dependence. We also obtain the $\\sigma$, $\\rho$, and $f_2$ resonances for the same range of $N_c$. The $\\rho$ and $f_2$ masses depend only weakly on $N_c$, and their widths decrease as $N_c$ increases, consistent with the $1/N_c$ scaling expected for conventional $q\\bar{q}$ mesons. In contrast, the $\\sigma$ meson mass and width both increase with $N_c$, in agreement with a previous unitarized $\\chi$PT analysis. These results provide a further test of the Gauge Theory Bootstrap for studying asymptotically free gauge theories.", "url": "https://arxiv.org/abs/2611.16824", "type": "理论", "summary": "我们使用规范理论引导程序来研究具有不同数量的颜色 $N_c$ 的渐近自由规范理论。参数$N_c$通过求和规则和渐近形状因子进入计算，使我们能够直接调整这个微观参数并检查相应的低能强耦合动力学。对于$3\\le N_c\\le 12$，我们提取散射长度、有效范围和低能量常数$\\bar{l}_i$，并研究它们的$N_c$依赖性。我们还获得了相同范围的 $N_c$ 的 $\\sigma$、$\\rho$ 和 $f_2$ 共振。 $\\rho$ 和 $f_2$ 质量仅较弱地依赖于 $N_c$，并且它们的宽度随着 $N_c$ 的增加而减小，与传统 $q\\bar{q}$ 介子预期的 $1/N_c$ 缩放一致。相比之下，$\\sigma$ 介子质量和宽度均随 $N_c$ 增加，与之前的统一化 $\\chi$PT 分析一​​致。这些结果为研究渐进自由规范理论提供了对规范理论 Bootstrap 的进一步检验。", "authors": [{"name": "Rafael Cordoba"}, {"name": "Yifei He"}, {"name": "Martin Kruczenski"}, {"name": "Derek Ping"}, {"name": "Jignesh Mohanty"}, {"name": "Emil Alegria"}], "featured_authors": [{"name": "Rafael Cordoba"}, {"name": "Yifei He"}, {"name": "Martin Kruczenski"}, {"name": "Derek Ping"}, {"name": "Jignesh Mohanty"}, {"name": "Emil Alegria"}], "author_count": 6}, {"id": "2611.16936", "category": "hep-th", "title": "Holographic viscous transport in scalar-coupled Gauss-Bonnet gravity", "abstract": "We test horizon formulas for the shear and bulk viscosities of a holographic plasma against viscosities extracted directly from retarded stress-tensor correlators. We work in a five-dimensional Einstein-dilaton-Gauss-Bonnet model calibrated to the lattice QCD equation of state at zero baryon density. UV-finite renormalized correlators are obtained by including the required curvature and scalar counterterms, and the fluctuation equations are solved while retaining the full dependence on the Gauss-Bonnet coupling $\\alpha$, without using a horizon conservation law or an entropy-production formula. For constant coupling, the horizon conserved-current calculation reproduces the boundary Kubo results in both channels. For the scalar-dependent coupling studied here, both methods find a minimum in the shear-viscosity-to-entropy-density ratio $\\eta/s$. In the bulk channel, the conserved-current calculation truncated at first order in $\\alpha$ yields a lower peak height in $\\zeta/s$, with the peak temperature nearly unchanged relative to the boundary result. For both couplings, the unmodified Eling-Oz (EO) formula, $\\zeta/s=(4\\pi)^{-1}(\\partial\\phi_h/\\partial\\ln s)^2$, reproduces the boundary result for $\\zeta/s$, where $\\phi_h$ is the horizon value of the scalar. The prefactor $1/(4\\pi)$ is thus retained even when the Gauss-Bonnet interaction shifts $\\eta/s$ from this value. These results provide a direct boundary benchmark for horizon prescriptions and support the unmodified EO formula beyond constant coupling.", "url": "https://arxiv.org/abs/2611.16936", "type": "理论", "summary": "我们根据直接从延迟应力张量相关器中提取的粘度来测试全息等离子体的剪切和体积粘度的层位公式。我们使用五维爱因斯坦-膨胀-高斯-博内特模型，该模型校准为零重子密度下的晶格 QCD 状态方程。通过包含所需的曲率和标量反项来获得 UV 有限重整化相关器，并且在保留对高斯-邦内耦合 $\\alpha$ 的完全依赖的同时求解涨落方程，而不使用视界守恒定律或熵产生公式。对于恒定耦合，地平线守恒电流计算在两个通道中重现边界 Kubo 结果。对于此处研究的标量相关耦合，两种方法都找到剪切粘度与熵密度比 $\\eta/s$ 的最小值。在体通道中，守恒电流计算在 $\\alpha$ 中按一阶截断，在 $\\zeta/s$ 中产生较低的峰高，而峰值温度相对于边界结果几乎没有变化。\n\n对于这两种耦合，未修改的 Eling-Oz (EO) 公式 $\\zeta/s=(4\\pi)^{-1}(\\partial\\phi_h/\\partial\\ln s)^2$ 再现 $\\zeta/s$ 的边界结果，其中 $\\phi_h$ 是标量的水平值。因此，即使高斯-邦内相互作用使 $\\eta/s$ 偏离该值，前因子 $1/(4\\pi)$ 也会被保留。这些结果为地平线规定提供了直接的边界基准，并支持超越恒定耦合的未修改的 EO 公式。", "authors": [{"name": "Tao Ma"}, {"name": "Song He"}, {"name": "Li Li"}], "featured_authors": [{"name": "Tao Ma"}, {"name": "Song He"}, {"name": "Li Li"}], "author_count": 3}, {"id": "2611.17006", "category": "hep-th", "title": "Infinite spin superparticles", "abstract": "We obtain infinite spin representations of the super-Poincaré algebra from a higher-derivative superparticle action on a super-Minkowski background in 3, 4, 6 and 10 dimensions. Super-twistor transforms are performed, and used to deduce first-quantised spectra.", "url": "https://arxiv.org/abs/2611.17006", "type": "理论", "summary": "我们从 3、4、6 和 10 维超闵可夫斯基背景上的高导数超粒子作用中获得了超庞加莱代数的无限自旋表示。执行超扭曲变换，并用于推导第一量化光谱。", "authors": [{"name": "Eugenia Boffo"}, {"name": "Martin Cederwall"}], "featured_authors": [{"name": "Eugenia Boffo"}, {"name": "Martin Cederwall"}], "author_count": 2}, {"id": "2611.17045", "category": "hep-th", "title": "De Sitter Gravity and Emergent Time from Fusion Matrix Product States and SYK", "abstract": "We propose a quantum-mechanical model dual to two-dimensional de Sitter (dS) gravity. It is a quantum channel, defined by a matrix product state that fuses one spin at each step, and is related to a limit of the Sachdev-Ye-Kitaev model without chord crossings. Its simplest part is a random walk with an emergent $SL(2,\\mathbb R)$ symmetry, which we identify with the symmetry of the future boundary of dS. It selects a time variable in which the walk obeys the Schwarzian action and yields the disk amplitude of dS Jackiw-Teitelboim gravity. As the simplest case, we consider free massless scalar fields in the fixed background of dS$_2$. We find the agreement of the two-point function in the Bunch-Davies vacuum and the matching of symmetry. Our construction provides a concrete model for the dS/CFT correspondence for two-dimensional de Sitter gravity.", "url": "https://arxiv.org/abs/2611.17045", "type": "理论", "summary": "我们提出了一种与二维德西特 (dS) 引力对偶的量子力学模型。它是一个量子通道，由在每一步融合一个自旋的矩阵乘积状态定义，并且与没有弦交叉的 Sachdev-Ye-Kitaev 模型的极限相关。它最简单的部分是具有新兴 $SL(2,\\mathbb R)$ 对称性的随机游走，我们将其与 dS 未来边界的对称性进行识别。它选择一个时间变量，其中行走服从施瓦茨作用并产生 dS Jackiw-Teitelboim 引力的圆盘振幅。作为最简单的情况，我们考虑 dS$_2$ 固定背景中的自由无质量标量场。我们发现了Bunch-Davies真空中两点函数的一致性和对称性的匹配。我们的构造为二维德西特重力的 dS/CFT 对应关系提供了具体模型。", "authors": [{"name": "Shinsei Ryu"}, {"name": "Yu-ki Suzuki"}], "featured_authors": [{"name": "Shinsei Ryu"}, {"name": "Yu-ki Suzuki"}], "author_count": 2}, {"id": "2611.17178", "category": "hep-th", "title": "Covariant Wigner--Weyl calculus, non-dissipative transport and the chiral anomaly in inhomogeneous systems with nontrivial momentum-space topology", "abstract": "We review, systematize and extend the covariant Wigner--Weyl calculus for fermions in non-Abelian gauge fields and its applications to systems inhomogeneous in coordinate space with nontrivial momentum-space topology: the non-Abelian chiral separation and quantum Hall effects, their stability under interactions, the Fermi-surface invariant of inhomogeneous systems and the non-elliptic models that carry it, with their equilibrium chiral magnetic effect, the factorization of the chiral anomaly into the instanton number and the momentum-space invariant $N_3$, and the noncommutative-geometric form of the invariants. Previous results are brought to common conventions, with hypotheses stated and notions defined. New results: the characterization of the operators whose covariant symbol is gauge-field independent and the ordering independence of the integrated anomaly; the anomaly factorization on a closed four-manifold without the homotopy hypothesis, the factorization into instanton number and $N_3$ holding exactly when the untwisted index vanishes; the Luttinger--Ward identity behind the renormalized-velocity current and the continuum conditions replacing the compactness of the Brillouin zone in the non-renormalization theorems; the identification of the Moyal $N_3$ of the chiral separation effect with the fibre degree of the principal symbol; the residue evaluation of the Fermi-surface invariant of the non-elliptic models, in the continuum and on a lattice, and the equilibrium current of the conserved charge along the magnetic field that it implies -- a chiral magnetic effect permitted by the non-Hamiltonian form of these models -- which the model with spherical Fermi surfaces trades for a chiral separation effect and a single-Weyl anomaly, and a modification of it restores at the price of the anomaly; and the index-pairing form of the chiral separation invariant.", "url": "https://arxiv.org/abs/2611.17178", "type": "理论", "summary": "我们回顾、系统化和扩展了非阿贝尔规范场中费米子的协变维格纳-韦尔演算及其在具有非平凡动量空间拓扑的坐标空间中非齐次系统中的应用：非阿贝尔手征分离和量子霍尔效应，它们在相互作用下的稳定性，非齐次系统的费米表面不变量和承载它的非椭圆模型，及其平衡手征磁效应，手征分解异常为瞬时数和动量空间不变量 $N_3$，以及不变量的非交换几何形式。先前的结果被纳入共同惯例，并提出假设并定义概念。\n\n新结果：协变符号与规范场无关的算子的表征以及积分异常的排序独立性；没有同伦假设的闭四流形上的反常分解，分解为瞬时数并且 $N_3$ 在未扭曲索引消失时准确地保持；重整化速度流背后的Luttinger-Ward恒等式和连续介质条件取代了非重整化定理中布里渊区的紧性；手性分离效应的Moyal $N_3$与主符号纤维度的识别；连续体和晶格上非椭圆模型的费米表面不变量的剩余评估，以及它所暗示的沿着磁场的守恒电荷的平衡电流——这些模型的非哈密尔顿形式允许的手性磁效应——具有球形费米表面的模型用手性分离效应和单韦尔异常进行交换，并且对其进行修改以异常的价格恢复；以及手性分离不变量的索引配对形式。", "authors": [{"name": "M.A.Zubkov"}], "featured_authors": [{"name": "M.A.Zubkov"}], "author_count": 1}, {"id": "2611.17261", "category": "hep-th", "title": "Love numbers for the Myers-Perry geometry", "abstract": "We analyze Love numbers for scalar fields in the Myers-Perry geometry in arbitrary dimensions. The tidal responses of black holes are specified by two constants which encode a potential logarithmic running and the Love number. We argue that the parameter specifying the running is not sensitive to the structure of the horizon, and we explicitly compute this parameter for Myers-Perry black holes in arbitrary dimensions by utilizing the asymptotic expansion of the wave equation. The Love numbers rely on the details of the boundary conditions at the horizon, and we compute them using several distinct approximations.", "url": "https://arxiv.org/abs/2611.17261", "type": "理论", "summary": "我们分析任意维度的迈尔斯-佩里几何中标量场的洛夫数。黑洞的潮汐响应由两个常数指定，这两个常数编码潜在的对数运行和洛夫数。我们认为，指定运行的参数对视界的结构不敏感，并且我们利用波动方程的渐近展开，明确地计算了任意维度的迈尔斯-佩里黑洞的该参数。洛夫数依赖于地平线边界条件的细节，我们使用几种不同的近似值来计算它们。", "authors": [{"name": "Rhucha Deshpande"}, {"name": "Oleg Lunin"}], "featured_authors": [{"name": "Rhucha Deshpande"}, {"name": "Oleg Lunin"}], "author_count": 2}, {"id": "2611.17270", "category": "hep-th", "title": "Twisting IKKT with branes", "abstract": "Motivated by the conjectural relationship between the IKKT matrix model and type IIB string theory, we classify supersymmetric twists of the matrix model, allowing for both dynamical and kinematical supercharges. Beyond the two twists available at any finite $N$, which we studied in our previous work, we find five additional classes at infinite rank which require non-commuting backgrounds associated with D-branes in IIB supergravity. Together, these twists realize representatives of every equivalence class of twisting supercharges in flat-space type IIB supergravity recently classified by the first author; however, the precise form of the orbit stratification differs. This difference is related to a higher central extension of the IIB superalgebra that appears in our treatment of the IKKT model in the BV formalism. Expanding around the non-commutative backgrounds gives worldvolume theories on products of A- and B-branes, including four-dimensional BF theory on an emergent D3-brane. We relate all these twists to deformations of BCOV theory (the closed string field theory of the topological B-model) using the open-closed duality of classical string field theory. For one of the twists with Spin$(7)$ symmetry, we also show the localization of the IKKT partition function by Moore, Nekrasov, and Shatashvili can be directly reconstructed with the BV formalism, with their auxiliary field completion encoded by quadratic antifield terms. Throughout, we provide self-contained treatments of the formal techniques we employ.", "url": "https://arxiv.org/abs/2611.17270", "type": "理论", "summary": "受 IKKT 矩阵模型和 IIB 型弦理论之间猜想关系的启发，我们对矩阵模型的超对称扭曲进行了分类，同时考虑了动力学和运动学增压。除了我们在之前的工作中研究的任何有限 $N$ 下可用的两种扭曲之外，我们还发现了无限等级的五个额外类别，它们需要与 IIB 超重力中的 D 膜相关的非通勤背景。这些扭曲共同实现了第一作者最近分类的平坦空间 IIB 型超重力中扭曲增压的每个等价类的代表；然而，轨道分层的精确形式有所不同。这种差异与 IIB 超代数的更高中心扩展有关，该扩展出现在我们对 BV 形式主义中的 IKKT 模型的处理中。围绕非交换背景展开，给出了关于 A 膜和 B 膜乘积的世界体积理论，包括关于新兴 D3 膜的四维 BF 理论。我们使用经典弦场理论的开闭对偶性将所有这些扭曲与 BCOV 理论（拓扑 B 模型的闭弦场理论）的变形联系起来。\n\n对于 Spin$(7)$ 对称性的扭曲之一，我们还证明了 Moore、Nekrasov 和 Shatashvili 的 IKKT 配分函数的局域化可以用 BV 形式直接重构，其辅助场完成由二次反场项编码。自始至终，我们都对我们所采用的正式技术提供了独立的处理。", "authors": [{"name": "Fabian Hahner"}, {"name": "Natalie M. Paquette"}], "featured_authors": [{"name": "Fabian Hahner"}, {"name": "Natalie M. Paquette"}], "author_count": 2}, {"id": "2611.17274", "category": "hep-th", "title": "A precision bound for gravitational transseries", "abstract": "We propose that the large $N$ transseries of a holographic observable above the black hole threshold admits a precision bound, a limit on how precisely the transseries can determine the observable at finite $N$, set by the data of its D-brane instanton sectors. In doing so, we develop methods in large $N$ resurgence, based on the work of Écalle, that capture the $e^{-N^2}$ asymptotics of gravitational saddles beyond the $e^{-N}$ instantons. Under an assumption on the growth of the D-brane instanton sums that we expect in the black hole phase, we find an analytic obstruction to the resummation of the large $N$ transseries. This obstruction sets the precision bound. As our main example and consistency check, we study the $\\frac{1}{16}$-BPS index of $\\mathcal{N}=4$ super Yang-Mills and its black hole. We derive relations between the D-brane instanton data on thermal AdS and on the black hole, in the form of a duality that exchanges the numbers of D-brane instantons on the two backgrounds. In the index, these relations reproduce the actions of D3-branes wrapped on the black hole. We conclude with our expectations for generic situations and their relation to the double-cone wormhole.", "url": "https://arxiv.org/abs/2611.17274", "type": "理论", "summary": "我们提出，高于黑洞阈值的全息可观测值的大 $N$ 穿越序列承认精度界限，即穿越序列如何精确地确定有限 $N$ 处的可观测值的限制，由其 D 膜瞬子扇区的数据设置。在此过程中，我们基于 Écalle 的工作，开发了大规模 $N$ 复苏的方法，捕获 $e^{-N^2}$ 超越 $e^{-N}$ 瞬子的引力鞍的渐近线。根据我们在黑洞阶段预期的 D 膜瞬时子和增长的假设，我们发现对大型 $N$ 越序恢复的分析障碍。 This obstruction sets the precision bound.作为我们的主要例子和一致性检验，我们研究 $\\mathcal{N}=4$ super Yang-Mills 及其黑洞的 $\\frac{1}{16}$-BPS 指数。我们推导出热 AdS 和黑洞上的 D 膜瞬子数据之间的关系，以对偶的形式交换两个背景上的 D 膜瞬时子数量。在索引中，这些关系再现了包裹在黑洞上的 D3 膜的行为。我们以对一般情况的期望及其与双锥虫洞的关系作为结论。", "authors": [{"name": "Ji Hoon Lee"}], "featured_authors": [{"name": "Ji Hoon Lee"}], "author_count": 1}, {"id": "2611.17275", "category": "hep-th", "title": "The $(5,5)$ String", "abstract": "We study an $N=(2,1)$ heterotic string with right-movers on $\\mathbb R^{2,2}$ and left-movers of signature $(5,5)$, obtained by adjoining the lattice $\\mathrm{II}_{3,3}$. Unlike the standard $N=(2,1)$ strings it requires no null current, and its target space remains four-dimensional. All of its states, an infinite tower with sixteen supercharges, are massless. For the neutral bosons, the Kutasov-Martinec determinant action is dual to a cubic action for a self-dual metric coupled to self-dual Maxwell fields, and we complete it with fermions using a single superfield. For the charged states we give evidence that the couplings are the structure constants of a Lie superalgebra formed by the physical states of the left-movers. We are thus led to propose that the classical target theory is a self-dual gauge theory for this superalgebra: every state of the string is a gauge field, and gravity is part of the gauge algebra. This would be a purely cubic field theory of all the modes of a closed string.", "url": "https://arxiv.org/abs/2611.17275", "type": "理论", "summary": "我们研究一个 $N=(2,1)$ 异质串，其在 $\\mathbb R^{2,2}$ 上具有右动子，在签名 $(5,5)$ 上具有左动子，通过邻接格子 $\\mathrm{II}_{3,3}$ 获得。与标准 $N=(2,1)$ 字符串不同，它不需要空电流，并且其目标空间仍然是四维的。它的所有状态，一个具有十六个增压的无限塔，都是无质量的。对于中性玻色子，库塔索夫-马丁内克行列式作用对于与自对偶麦克斯韦场耦合的自对偶度量的三次作用是对偶的，并且我们使用单个超场用费米子来完成它。对于带电状态，我们证明耦合是由左动子的物理状态形成的李超代数的结构常数。因此，我们提出经典目标理论是这个超代数的自对偶规范理论：弦的每个状态都是规范场，而重力是规范代数的一部分。这将是闭弦所有模态的纯三次场论。", "authors": [{"name": "Justin Kaidi"}], "featured_authors": [{"name": "Justin Kaidi"}], "author_count": 1}, {"id": "2611.17325", "category": "hep-th", "title": "Bound States of Two D0-Branes and the Three-Graviton Coupling", "abstract": "We numerically solve for the ground state of the $SU(2)$ BFSS matrix model for M-theory. This state corresponds to the zero-energy bound state of two D0-branes or, by the BFSS conjecture, to the eleven-dimensional graviton with two units of momentum along the M-theory circle. The wavefunction exhibits a strongly coupled core, as well as an asymptotic power-law tail where the D0-branes are well separated. The coefficient of this power-law decay is the three-graviton coupling, previously computed by Herderschee and Maldacena, which our numerical solution reproduces with high accuracy. We also show that this coupling is protected by supersymmetry in the matrix model, and derive its value from the non-renormalized one-loop interaction of the two D0-branes. Lastly, we provide a simple representation-theoretic argument regarding the recently proposed excited bound states of the model.", "url": "https://arxiv.org/abs/2611.17325", "type": "理论", "summary": "我们对 M 理论的 $SU(2)$ BFSS 矩阵模型的基态进行数值求解。该状态对应于两个 D0 膜的零能量束缚态，或者根据 BFSS 猜想，对应于沿着 M 理论圆具有两个动量单位的十一维引力子。该波函数表现出强耦合核心以及 D0 膜分离良好的渐近幂律尾部。这种幂律衰减的系数是三引力子耦合，之前由 Herderschee 和 Maldacena 计算，我们的数值解以高精度再现了该系数。我们还表明，这种耦合受到矩阵模型中超对称性的保护，并从两个 D0 膜的非重整化单环相互作用中得出其值。最后，我们提供了关于最近提出的模型激发束缚态的简单表示理论论证。", "authors": [{"name": "Sergio Sanjurjo"}, {"name": "Themistocles Zikopoulos"}], "featured_authors": [{"name": "Sergio Sanjurjo"}, {"name": "Themistocles Zikopoulos"}], "author_count": 2}, {"id": "2611.17327", "category": "hep-th", "title": "Decoupling Dynamics: A Tale of Two Limits", "abstract": "The symmetries of a $d$-dimensional QFT are known to be captured by a topological theory in one dimension higher, the Symmetry Topological Field Theory (SymTFT), which is invariant under gauging finite symmetries of the QFT, but not under dynamical gauging of continuous symmetries. We show that the distinct SymTFTs of a $d$-dimensional QFT before and after dynamical gauging of a continuous Abelian symmetry arise as different topological limits of the same dynamical holographic gauge theory in $(d+1)$-dimensions. Gauging changes the boundary condition of this dynamical theory and thereby selects a different topological limit, explaining why the associated SymTFT changes. We give a fully quantum definition of these SymTFTs at the level of Hilbert spaces and operators by combining suitable limits of the bulk holographic theory with photon truncation. This construction clarifies how topological symmetry defects, charges, and anomalies survive while the dynamical information carried by currents is discarded. We study non-anomalous and anomalous examples, providing a complete quantum analysis for $(2+1)$-dimensional bulks. For a four-dimensional boundary theory with a mixed axial-vector anomaly, we recover the SymTFT of the non-invertible chiral symmetry that remains after gauging the vector symmetry.", "url": "https://arxiv.org/abs/2611.17327", "type": "理论", "summary": "已知 $d$ 维 QFT 的对称性可以通过更高一维的拓扑理论（即对称拓扑场论 (SymTFT)）来捕获，该理论在测量 QFT 的有限对称性下是不变的，但在连续对称性的动态测量下则不然。我们表明，在连续阿贝尔对称性的动态计量之前和之后，$d$ 维 QFT 的不同 SymTFT 是由于同一动态全息规范理论在 $(d+1)$ 维中的不同拓扑极限而出现的。测量改变了该动力学理论的边界条件，从而选择了不同的拓扑极限，解释了相关 SymTFT 发生变化的原因。我们通过将体全息理论的适当限制与光子截断相结合，在希尔伯特空间和算子的水平上给出了这些 SymTFT 的完全量子定义。这种结构阐明了拓扑对称缺陷、电荷和异常如何在电流携带的动态信息被丢弃的情况下继续存在。我们研究非异常和异常示例，为 $(2+1)$ 维块提供完整的量子分析。\n\n对于具有混合轴矢量异常的四维边界理论，我们恢复了在测量矢量对称性后剩余的不可逆手性对称性的 SymTFT。", "authors": [{"name": "Andrea Antinucci"}, {"name": "Oscar Lewis"}], "featured_authors": [{"name": "Andrea Antinucci"}, {"name": "Oscar Lewis"}], "author_count": 2}, {"id": "2611.14658", "category": "math-ph", "title": "Emergent Anyons in a Weakly Interacting Gauged Chern Insulator", "abstract": "We derive a microscopic relation between the many-body Chern number $C$ of the fermionic ground state and the braiding of fluxes in $\\mathbb{Z}_{2}$ gauge theory coupled to matter: under a spectral gap condition, dressed flux loops obey $W_2W_1=e^{i\\frac{\\pi}{2}C}W_1W_2$ on the ground-state sector. We realize $C=1$ by gauging charge parity in a weakly interacting Qi-Wu-Zhang insulator. Reflection positivity and chessboard estimates show that flux defects are massive, which yields a gapped, topologically ordered phase with four locally indistinguishable ground states.", "url": "https://arxiv.org/abs/2611.14658", "type": "理论", "summary": "我们推导出费米子基态的多体陈数 $C$ 与与物质耦合的 $\\mathbb{Z}_{2}$ 规范理论中的通量编织之间的微观关系：在光谱间隙条件下，修饰的通量环在基态扇区上服从 $W_2W_1=e^{i\\frac{\\pi}{2}C}W_1W_2$。我们通过测量弱相互作用的 Qi-Wu-Zhang 绝缘体中的电荷平价来实现 $C=1$。反射正性和棋盘估计表明，通量缺陷很大，这会产生有间隙的拓扑有序相，具有四种局部无法区分的基态。", "authors": [{"name": "Sven Bachmann"}, {"name": "Leonardo Goller"}, {"name": "Marcello Porta"}], "featured_authors": [{"name": "Sven Bachmann"}, {"name": "Leonardo Goller"}, {"name": "Marcello Porta"}], "author_count": 3}, {"id": "2611.14784", "category": "math-ph", "title": "Making Poisson σ again - an étude on groupoidal gauging, anomalies, gerbes, and defects", "abstract": "The Poisson $\\sigma$-model (PSM) over a closed worldsheet $\\Sigma$ is reinterpreted as a theory of connections on a trivial principaloid bundle $P_0 = \\Sigma \\times G \\to \\Sigma$ with the symplectic structure groupoid $(G,\\omega)$ integrating the Poisson target $(M,\\Pi)$, and that of sections of the shadow bundle $F_0 = \\Sigma \\times M \\to \\Sigma$ - as defined in 2503.09886 [math.DG]. The flat directions of the PSM are explained as linearisations of automorphisms of $P_0$, modelled on maps from $\\Sigma$ into the group of lagrangean bisections of $G$, which induce Poisson automorphisms of $(M,\\Pi)$. The gauge anomaly of the ensuing field theory is derived and demonstrated to vanish for prequantisable $\\omega$. A general anomaly-cancellation mechanism is proposed, which couples the bare model - rewritten as the holonomy of a connection-dependent trivial gerbe on $F_0$ - to a background gerbe over $M$ endowed with a $G$-equivariant structure. The coupling takes the form of the tensor product of the two gerbes and the extended PSM is defined as the holonomy of the product gerbe. An essential generalisation of the theory is then proposed - to shadows $F$ of principaloid bundles $P$ of arbitrary topology, in keeping with the interpretation of the gauging as descent to the orbistack $M//G$. The generalisation uses local product gerbes depending on local connections over trivialisations of $F$. The $G$-equivariant structure is proven to ensure a 2-stacky descent of the local gerbes to a global one over $F$. Its holonomy is taken as the definition of the generalised PSM. A cohomological discussion of obstructions against the descent is provided. Finally, a reformulation of the generalised PSM as a field theory with a topological gauge-symmetry defect is given, in which the $G$-equivariant structure is employed - alongside the transition cocycle of $P$ - as the datum of the defect.", "url": "https://arxiv.org/abs/2611.14784", "type": "理论", "summary": "封闭世界表 $\\Sigma$ 上的泊松 $\\sigma$ 模型 (PSM) 被重新解释为平凡委托丛 $P_0 = \\Sigma \\times G \\to \\Sigma$ 与辛结构群形 $(G,\\omega)$ 整合泊松目标 $(M,\\Pi)$ 和影子丛 $F_0 = \\Sigma \\times M \\to \\Sigma$ 的部分的连接理论 - 如定义在 2503.09886 [math.DG]。 PSM 的平面方向被解释为 $P_0$ 自同构的线性化，在从 $\\Sigma$ 到 $G$ 拉格朗日二等分组的映射上建模，从而引发 $(M,\\Pi)$ 的泊松自同构。随后的场论的规范异常被推导并证明对于可预先量化的 $\\omega$ 来说消失。提出了一种通用的异常消除机制，它将裸模型（重写为 $F_0$ 上依赖于连接的平凡 gerbe 的完整模型）耦合到 $M$ 上赋予 $G$ 等变结构的背景 gerbe。耦合采用两个 gerbe 的张量积的形式，并且扩展 PSM 被定义为乘积 gerbe 的完整性。\n\n然后提出了该理论的基本概括 - 任意拓扑的主形束 $P$ 的阴影 $F$，与对轨道栈 $M//G$ 下降的测量解释保持一致。泛化使用本地产品 gerbes，依赖于本地连接而不是 $F$ 的平凡化。 $G$ 等变结构被证明可以确保局部非洲菊通过 $F$ 进行 2 层下降到全局下降。其完整性被视为广义PSM的定义。提供了对下降障碍的上同调讨论。最后，给出了将广义 PSM 重新表述为具有拓扑规范对称缺陷的场论，其中采用 $G$ 等变结构 - 与 $P$ 的过渡余循环一起 - 作为缺陷的基准。", "authors": [{"name": "Rafał R. Suszek"}], "featured_authors": [{"name": "Rafał R. Suszek"}], "author_count": 1}, {"id": "2611.15304", "category": "math-ph", "title": "Cumulants of Operator Semigroups for Hierarchies of Many-Particle Evolution Equations", "abstract": "The paper presents a brief overview of recent advances in the mathematical theory of evolution equations for quantum many-particle systems. The structure of expansions representing non-perturbative solutions to the Cauchy problem for hierarchies of fundamental evolution equations for many quantum particles is outlined. It has been shown that the concept of cumulants of operator semigroups forms the basis for non-perturbative representation of solutions to hierarchies of evolution equations that describe the state and observables. It is proven that the constructed dynamics of correlations underlie the description of the evolution of the state, both for finitely and infinitely many particles, governed by the BBGKY hierarchy for reduced density operators or by the hierarchy of nonlinear evolution equations for reduced correlation operators. In fact, it is demonstrated that the behavior of particle correlations governs the dynamics of states in quantum systems with an infinite number of particles.", "url": "https://arxiv.org/abs/2611.15304", "type": "理论", "summary": "本文简要概述了量子多粒子系统演化方程数学理论的最新进展。概述了表示许多量子粒子的基本演化方程层次结构的柯西问题的非微扰解的展开结构。已经表明，算子半群的累积量概念构成了描述状态和可观测量的演化方程层次结构的解的非微扰表示的基础。事实证明，相关性的构造动力学是对有限和无限多个粒子的状态演化描述的基础，由约化密度算子的 BBGKY 层次结构或约化相关算子的非线性演化方程层次结构控制。事实上，事实证明，粒子相关性的行为控制着具有无限数量粒子的量子系统中的状态动力学。", "authors": [{"name": "V.I. Gerasimenko"}], "featured_authors": [{"name": "V.I. Gerasimenko"}], "author_count": 1}, {"id": "2611.15452", "category": "math-ph", "title": "On JT boundary algebras", "abstract": "We construct the canonical boundary algebras of Jackiw--Teitelboim gravity coupled to free bosonic matter. For a nonempty finite or countable family of species with lowest weights greater than one half, the two boundary algebras are mutual commutants and nonhyperfinite type $\\mathrm{II}_\\infty$ factors. Their nonzero finite corners are nonhyperfinite type $\\mathrm{II}_1$ factors. The construction uses bounded heat-regularized fields and a Hilbert algebra, which gives a faithful normal semifinite trace without a path-integral argument. The weight restriction is sharp: elementary point fields remain unbounded after positive heat regularization when $0<d\\leq1/2$. For one massless scalar, specified bounded observables and normal states have a high energy limit described by a hyperfinite continuous core. We explain why this limit does not preserve the nonhyperfiniteness of the exact algebra.", "url": "https://arxiv.org/abs/2611.15452", "type": "理论", "summary": "我们构造了与自由玻色子物质耦合的 Jackiw-Teitelboim 引力的规范边界代数。对于最低权重大于二分之一的非空有限或可数物种族，两个边界代数是互交换子和非超有限型 $\\mathrm{II}_\\infty$ 因子。它们的非零有限角是非超有限型 $\\mathrm{II}_1$ 因子。该构造使用有界热正则化场和希尔伯特代数，它给出了忠实的正常半有限迹，而无需路径积分参数。权重限制很严格：当 $0<d\\leq1/2$ 时，在正热正则化后，基本点场保持无界。对于一个无质量标量，指定的有界可观测量和正常状态具有由超有限连续核心描述的高能量极限。我们解释为什么这个极限不能保留精确代数的非超有限性。", "authors": [{"name": "Feng Xu"}], "featured_authors": [{"name": "Feng Xu"}], "author_count": 1}, {"id": "2611.15632", "category": "math-ph", "title": "Metriplectic Lotka--Volterra systems with noise:interactions invisible at stationarity, visible in time", "abstract": "We show that a Lotka--Volterra system with an interior equilibrium admits a metriplectic structure, with a Volterra function $V_C$ as energy and an entropy variable for the environment, if and only if Volterra's dissipativity condition $CA+A^{\\top}C\\le0$ holds, and we construct it explicitly with a log-canonical Poisson bivector. Adding noise through the fluctuation--dissipation relation of stochastic GENERIC yields multiplicative environmental noise, with covariance fixed by the symmetric part of $AC^{-1}$, whose stationary law is an explicit Gibbs measure: a product of independent Gamma distributions. Unlike known Gibbs measures for stochastic Lotka--Volterra systems, this holds for nonsymmetric interactions, predator--prey included. The stationary law determines only the equilibrium and $C/k$: every interaction matrix in an open cone of dimension $n^2$, in particular any Poisson part, produces with its compatible noise the same law as uncoupled stochastic logistic equations. Gamma-distributed, uncorrelated abundance fluctuations, as observed in microbial communities, are therefore no evidence of absence of interactions. The interactions are, however, visible in time: the zero-lag derivative of the log-abundance covariance equals $A(C/k)^{-1}$, and its antisymmetric part is the Poisson part, which carries all the stationary entropy production, computed in closed form. Finally, for general noise we prove an exact Lyapunov-type identity $AK+K^\\top A^\\top+Q=0$ for $K=\\mathrm{Cov}(x,\\log x)$ at any stationary solution. It implies that the populations are independent if and only if the noise is metriplectically compatible, and gives an explicit lower bound on interspecies cross-covariances in terms of the distance of $Q$ to the compatible family. Simulations of a predator--prey model show that the bound is nearly sharp.", "url": "https://arxiv.org/abs/2611.15632", "type": "理论", "summary": "我们证明，当且仅当 Volterra 的耗散条件 $CA+A^{\\top}C\\le0$ 成立时，具有内部平衡的 Lotka--Volterra 系统承认三重结构，以 Volterra 函数 $V_C$ 作为能量和环境的熵变量，并且我们使用对数正则泊松双向量显式构造它。通过随机 GENERIC 的涨落-耗散关系添加噪声会产生乘性环境噪声，协方差由 $AC^{-1}$ 的对称部分固定，其平稳律是显式吉布斯测度：独立伽马分布的乘积。与已知的随机 Lotka-Volterra 系统的吉布斯测量不同，这适用于非对称相互作用，包括捕食者-猎物。平稳定律仅决定平衡和 $C/k$：维度 $n^2$ 的开放锥体中的每个相互作用矩阵，特别是任何泊松部分，与其兼容噪声产生与非耦合随机逻辑方程相同的定律。因此，在微生物群落中观察到的伽马分布、不相关的丰度波动并不能证明不存在相互作用。\n\n然而，相互作用在时间上是可见的：对数丰度协方差的零滞后导数等于 $A(C/k)^{-1}$，其反对称部分是泊松部分，它承载所有以封闭形式计算的平稳熵产生。最后，对于一般噪声，我们在任何平稳解下证明 $K=\\mathrm{Cov}(x,\\log x)$ 的精确李雅普诺夫型恒等式 $AK+K^\\top A^\\top+Q=0$。它意味着当且仅当噪声是相容的时，种群是独立的，并且根据 $Q$ 到相容族的距离给出了种间互协方差的明确下界。捕食者-被捕食者模型的模拟表明，界限几乎是尖锐的。", "authors": [{"name": "J.A. Capitán"}, {"name": "A. Megías"}, {"name": "C. Sardón"}], "featured_authors": [{"name": "J.A. Capitán"}, {"name": "A. Megías"}, {"name": "C. Sardón"}], "author_count": 3}, {"id": "2611.15833", "category": "math-ph", "title": "Point symmetries and Lie reductions of Kadomtsev-Petviashvili equation", "abstract": "We compute the point symmetry pseudogroup of the Kadomtsev-Petviashvili equation using both the direct and the algebraic methods. We also revisit the classical Lie symmetry analysis of this model in detail, concentrating on hidden infinitesimal and hidden point symmetries. Additionally, we re-examine the symmetry properties of each codimension-one reduced model and determine their point symmetry pseudogroups.", "url": "https://arxiv.org/abs/2611.15833", "type": "理论", "summary": "我们使用直接方法和代数方法计算 Kadomtsev-Petviashvili 方程的点对称伪群。我们还详细回顾了该模型的经典李对称分析，重点关注隐藏无穷小和隐藏点对称。此外，我们重新检查每个余维一简化模型的对称性，并确定它们的点对称伪群。", "authors": [{"name": "Yevhenii Yu. Chapovskyi"}, {"name": "Serhii D. Koval"}], "featured_authors": [{"name": "Yevhenii Yu. Chapovskyi"}, {"name": "Serhii D. Koval"}], "author_count": 2}, {"id": "2611.16021", "category": "math-ph", "title": "Fréchet structure over AF algebras I: The compact case", "abstract": "This is the first of two papers devoted to spatial Fréchet structures on AF algebras and their derivations. Here, we study the simplest example of such a structure: the Fréchet algebra of almost-local compact operators associated with a fixed orthonormal basis. We revisit the characterization of its continuous derivations in terms of infinite matrices and their operator-theoretic implementation on rapidly decreasing vectors. Reformulating this description in the language of 0-chains, borrowed from the theory of quantum many-body systems, we establish a sufficient condition for continuity in terms of spatial growth. Finally, we construct a Fréchet-continuous symmetric derivation that does not generate a one-parameter group of automorphisms of this algebra that is strongly continuous with respect to its Fréchet topology.", "url": "https://arxiv.org/abs/2611.16021", "type": "理论", "summary": "这是专门讨论 AF 代数的空间 Fréchet 结构及其推导的两篇论文中的第一篇。在这里，我们研究这种结构的最简单的例子：与固定正交基相关的近局部紧算子的 Fréchet 代数。我们重新审视其在无限矩阵方面的连续导数的表征及其在快速递减向量上的算子理论实现。借用量子多体系统理论，用 0 链语言重新表述这一描述，我们为空间增长的连续性建立了充分条件。最后，我们构造了一个 Fréchet 连续对称推导，它不会生成该代数的单参数自同构群，该代数相对于其 Fréchet 拓扑是强连续的。", "authors": [{"name": "Giuseppe De Nittis"}, {"name": "Julián Gómez"}], "featured_authors": [{"name": "Giuseppe De Nittis"}, {"name": "Julián Gómez"}], "author_count": 2}, {"id": "2611.16105", "category": "math-ph", "title": "Baxter $\\mathbb{Q}$-operator and Separation of Variables for BC-type open $SL(2,\\mathbb{C})$ spin chain", "abstract": "We construct two-parameter Baxter $\\mathbb{Q}$-operators for the transfer matrices of noncompact open $SL(2,\\mathbb{C})$ BC-type spin chains with general boundary interactions, treating both one-boundary and two-boundary models. The $\\mathbb{Q}$-operators are defined as traces of general monodromy matrices over infinite-dimensional auxiliary spaces carrying principal series representations of $SL(2,\\mathbb{C})$. At specific values of parameters the two-parameter $\\mathbb{Q}$-operators degenerate into simpler one-parameter Baxter operators. We prove that the general transfer matrices factorize into products of these one-parameter $Q$-operators. We provide both an algebraic derivation based on local operator identities and a diagrammatic proof using Feynman diagrammatic techniques. Finally, we apply the quantum Separation of Variables (SoV) method to the spectral problem of the one-boundary transfer matrix. We derive the system of separated difference equations for the transfer matrix eigenfunctions and show that, under the assumption of kernel factorization, it reduces to a one-dimensional difference equation coinciding precisely with the Baxter equation for eigenvalues of appropriately normalized one-parameter Baxter $Q$-operator.", "url": "https://arxiv.org/abs/2611.16105", "type": "理论", "summary": "我们为具有一般边界相互作用的非紧开 $SL(2,\\mathbb{C})$ BC 型自旋链的传递矩阵构建了双参数 Baxter $\\mathbb{Q}$ 算子，同时处理一边界和二边界模型。 $\\mathbb{Q}$ 算子被定义为无限维辅助空间上的一般单向矩阵的迹，带有 $SL(2,\\mathbb{C})$ 的主级数表示。在参数的特定值处，二参数 $\\mathbb{Q}$ 运算符退化为更简单的单参数 Baxter 运算符。我们证明了一般转移矩阵可以分解为这些单参数 $Q$ 算子的乘积。我们提供基于局部算子恒等式的代数推导和使用费曼图解技术的图解证明。最后，我们将量子变量分离（SoV）方法应用于一边界传递矩阵的谱问题。\n\n我们推导了传递矩阵特征函数的分离差分方程组，并表明，在核因式分解的假设下，它简化为一维差分方程，与适当归一化的单参数 Baxter $Q$ 算子的特征值的 Baxter 方程精确一致。", "authors": [{"name": "I. Kotikov"}, {"name": "P. Antonenko"}], "featured_authors": [{"name": "I. Kotikov"}, {"name": "P. Antonenko"}], "author_count": 2}, {"id": "2611.16133", "category": "math-ph", "title": "A Probabilistic Characterization of the Ideals of Resolvent Algebras", "abstract": "We give a probabilistic characterization of the ideals of resolvent algebras. Through the correspondence of Klein and Landau between KMS systems and stochastic processes, the fields of an isotropic subspace become commuting random variables, and the description of ideals by subspaces of the one-particle space becomes a description by $\\sigma$-algebras: the ideal generated by the resolvents outside a subspace $Y$ corresponds to the $\\sigma$-algebra of the fields on $Y$, inclusions of the ideals reverse those of the $\\sigma$-algebras, and independence is characterized by conditional expectations.", "url": "https://arxiv.org/abs/2611.16133", "type": "理论", "summary": "我们给出了可解代数的理想的概率特征。通过 KMS 系统与随机过程之间的 Klein 和 Landau 对应关系，各向同性子空间的场变成了交换随机变量，单粒子空间子空间对理想的描述变成了$\\sigma$-代数的描述：子空间 $Y$ 之外的解析物生成的理想对应于 $Y$ 上场的 $\\sigma$-代数，理想的包含与 $Y$ 上场的$\\sigma$-代数相反。 $\\sigma$-代数，独立性的特点是条件期望。", "authors": [{"name": "Yoshitsugu Sekine"}], "featured_authors": [{"name": "Yoshitsugu Sekine"}], "author_count": 1}, {"id": "2611.16261", "category": "math-ph", "title": "Intrinsic Chiral HOTI Stabilized by a Single Diagonal Reflection", "abstract": "Higher-order topological insulators and superconductors, under combined point and fundamental symmetries, display topological modes supported by boundaries of higher codimensions, such as a corner mode. In this work, we explain a theoretical device that enables us to claim that there exists {\\it one and only one} intrinsic chiral-symmetric higher-order topological phase for the quarter-plane geometry with point-symmetry given by reflection about the diagonal of the corner. Furthermore, we supply a minimal tight-binding model of this phase and design an acoustic crystal whose dynamics reproduce that of the model. The robust properties of the corner mode are investigated by COMSOL simulations.", "url": "https://arxiv.org/abs/2611.16261", "type": "理论", "summary": "高阶拓扑绝缘体和超导体在组合点对称和基本对称下，显示出由更高余维边界支持的拓扑模式，例如角模式。在这项工作中，我们解释了一种理论装置，使我们能够声称对于具有由角对角线反射给出的点对称性的四分之一平面几何，存在{\\it one and only one}固有手性对称高阶拓扑相。此外，我们提供了该相的最小紧束缚模型，并设计了一种声学晶体，其动力学再现了该模型的动力学。通过 COMSOL 仿真研究了角点模式的鲁棒特性。", "authors": [{"name": "Danilo Polo Ojito"}, {"name": "Jackson Saunders"}, {"name": "Ellis Bender"}, {"name": "Camelia Prodan"}, {"name": "Emil Prodan"}], "featured_authors": [{"name": "Danilo Polo Ojito"}, {"name": "Jackson Saunders"}, {"name": "Ellis Bender"}, {"name": "Camelia Prodan"}, {"name": "Emil Prodan"}], "author_count": 5}, {"id": "2611.16468", "category": "math-ph", "title": "Physics-constrained differentiable causal discovery of constitutive mechanisms through boundary value problems", "abstract": "Data-driven constitutive model discovery is recast as causal discovery of mechanism parent sets using time-unrolled structural causal models. Hard-coding balance laws and constitutive skeletons, candidate graphs score environment--mechanism and state--state edges via weak-form equilibrium gaps evaluated from full-field displacements, avoiding the need to measure stresses or internal variables. An adaptive lasso and a NOTEARS-type constraint ensure graph acyclicity and an explicit evaluation order, treating climate-chamber protocols as interventions. Automatic differentiation yields the score's Gauss--Newton matrix as a local identifiability certificate, driving greedy D-optimal test design. In a synthetic study on a hygro-thermo-viscoelastic damaging plate (8 true edges among 13 candidates), interventional data recover the exact true graph in 7 of 10 runs (0.01px displacement noise) with zero attribution error. Conversely, observational data with a temperature--moisture correlation of $-0.998$ fail entirely because confounded scores are 250--380 times flatter. Observationally discovered models reproduce training climates (3.6% error) but mispredict hot and humid climates by up to 41.5% (16.9% average), whereas interventionally discovered models stay within 3.2%. A correlation sweep shows the certificate successfully predicts attribution errors, though weak-form score noise bias remains a primary limitation. Computed without knowledge of the truth, the D-optimal design selects test sets ranked second or third out of 126 candidates.", "url": "https://arxiv.org/abs/2611.16468", "type": "理论", "summary": "数据驱动的本构模型发现被改写为使用时间展开的结构因果模型对机制父集的因果发现。硬编码平衡定律和本构骨架，候选图通过从全场位移评估的弱形式平衡间隙对环境-机制和状态-状态边缘进行评分，避免了测量应力或内部变量的需要。自适应套索和注释类型约束确保图的非循环性和明确的评估顺序，将气候室协议视为干预措施。自动微分产生分数的高斯-牛顿矩阵作为局部可识别性证书，驱动贪婪的 D 最优测试设计。在一项针对湿热粘弹损伤板（13 个候选板中的 8 个真实边缘）的综合研究中，介入数据在 10 次运行中的 7 次（0.01px 位移噪声）中恢复了精确的真实图形，且归因误差为零。相反，温度-湿度相关性为 -0.998 美元的观测数据完全失败，因为混杂分数平坦 250--380 倍。\n\n观察发现的模型再现了训练气候（误差为 3.6%），但对炎热和潮湿气候的错误预测高达 41.5%（平均 16.9%），而干预发现的模型则保持在 3.2% 以内。相关性扫描显示该证书成功预测了归因错误，尽管弱形式得分噪声偏差仍然是主要限制。在不了解真相的情况下进行计算，D 最优设计选择了 126 个候选测试集中排名第二或第三的测试集。", "authors": [{"name": "Michael A. Kraus"}], "featured_authors": [{"name": "Michael A. Kraus"}], "author_count": 1}, {"id": "2611.16685", "category": "math-ph", "title": "Fluctuations of Local Patterns in Non-Periodic Uniquely Ergodic Systems", "abstract": "We study various families of non-periodic configurations of symbols assigned to vertices of regular graphs. We restrict ourselves to such systems where considered configurations support a uniquely ergodic measure. Symbols can be interpreted as particles and we are concerned with configurations which minimize the interaction energy of particles, the so-called ground-state configurations. One of the main questions then is whether ground-state configurations are stable with respect to small perturbations of interactions. Such stability may be interpreted as a sort of rigidity of non-periodic structures such as tilings, substitution systems, Sturmian systems, and other uniquely ergodic non-periodic systems. We introduce a property of bounded fluctuations of finite patterns of non-periodic configurations, the so-called Strict Boundary Property. We discuss how relevant this property is for stability of non-periodic structures. Examples of Robinson's tilings, Thue-Morse, and Sturmian systems are presented. Some open problems are formulated.", "url": "https://arxiv.org/abs/2611.16685", "type": "理论", "summary": "我们研究分配给正则图顶点的各种非周期符号配置族。我们将自己限制在这样的系统中，其中经过深思熟虑的配置支持独特的遍历测量。符号可以解释为粒子，我们关心的是最小化粒子相互作用能的配置，即所谓的基态配置。主要问题之一是基态构型对于相互作用的小扰动是否稳定。这种稳定性可以解释为非周期结构的一种刚性，例如平铺、替换系统、Sturmian 系统和其他独特的遍历非周期系统。我们引入了非周期配置的有限模式的有界涨落的性质，即所谓的严格边界性质。我们讨论这个性质与非周期结构稳定性的相关性。给出了 Robinson 平铺系统、Thue-Morse 系统和 Sturmian 系统的示例。提出了一些开放性问题。", "authors": [{"name": "Jacek Miękisz"}], "featured_authors": [{"name": "Jacek Miękisz"}], "author_count": 1}, {"id": "2611.16797", "category": "math-ph", "title": "Finite Bodies on Norton's Dome: Escape-Time Divergence and a Center-of-Mass Barrier Theorem", "abstract": "Norton's dome illustrates how a Newtonian initial-value problem can admit both rest and delayed departure from the same initial state. We examine how this nonuniqueness changes when the point particle is replaced
