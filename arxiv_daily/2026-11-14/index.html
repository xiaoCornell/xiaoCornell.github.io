 by a rigid sphere of positive radius. For a generalized family of Norton's domes, we show that any fixed positive sphere radius prevents spontaneous departure from rest at the apex. We then extend the analysis to more general bodies and establish two sufficient conditions: a geometric constraint on the distance between the center of mass and the apex, and an interior tangent ball condition for rigid bodies whose center of mass is vertically aligned with the initial contact point. Both arguments combine geometric estimates with an energy inequality and Grönwall's inequality. The first condition also applies to passive deformable bodies without releasable internal energy. These results identify explicit conditions under which finite-body geometry excludes the spontaneous motion allowed by Norton's point-particle model.", "url": "https://arxiv.org/abs/2611.16797", "type": "理论", "summary": "诺顿的圆顶说明了牛顿初始值问题如何承认静止和延迟偏离同一初始状态。我们研究当点粒子被正半径的刚性球体取代时，这种非唯一性如何变化。对于诺顿圆顶的广义族，我们表明任何固定的正球体半径都可以防止自发偏离顶点处的静止。然后，我们将分析扩展到更一般的物体，并建立两个充分条件：质心和顶点之间距离的几何约束，以及质心与初始接触点垂直对齐的刚体的内切球条件。这两个论点都将几何估计与能量不等式和格伦沃尔不等式结合起来。第一个条件也适用于没有可释放内能的被动变形体。这些结果确定了有限体几何排除诺顿点粒子模型允许的自发运动的明确条件。", "authors": [{"name": "Guan-Chuan Chen"}, {"name": "En-Jui Kuo"}], "featured_authors": [{"name": "Guan-Chuan Chen"}, {"name": "En-Jui Kuo"}], "author_count": 2}, {"id": "2611.16809", "category": "math-ph", "title": "Concentration of Quasimodes at Spherical Interface between 3D-Topological Insulators", "abstract": "In this work, we study the edge states localized at a spherical interface between two $3\\mathrm{D}$-topological insulators from a continuous model of the semiclassical Dirac equation. Using the dynamical and spectral properties of the semiclassical Dirac operator tangent to the interface and the Landau level stratification of the energy in the transverse variable, we describe several concentration and invariance properties of the semiclassical measures associated with quasimodes of the system localized at the interface. Moreover, we construct explicit quasimodes which fulfill some of these properties and concentrate on some particular single periodic geodesics of the sphere.", "url": "https://arxiv.org/abs/2611.16809", "type": "理论", "summary": "在这项工作中，我们从半经典狄拉克方程的连续模型中研究了位于两个 $3\\mathrm{D}$ 拓扑绝缘体之间球形界面处的边缘态。利用与界面相切的半经典狄拉克算子的动力学和谱特性以及横向变量能量的朗道能级分层，我们描述了与界面处系统准模态相关的半经典测度的几个浓度和不变性特性。此外，我们构造了满足其中一些属性的显式准模态，并集中于球体的某些特定的单周期测地线。", "authors": [{"name": "Víctor Arnaiz"}, {"name": "Éric Vacelet"}], "featured_authors": [{"name": "Víctor Arnaiz"}, {"name": "Éric Vacelet"}], "author_count": 2}, {"id": "2611.17025", "category": "math-ph", "title": "Spin-Boson Hamiltonians as Generators of Spin-Dressed Bogoliubov Dynamics", "abstract": "Following Bach, Lieb and Solovej, quadratic Hamiltonians can be defined as generators of unitary groups implementing one-parameter groups of Bogoliubov transformations. We develop an analogous dynamical definition of generalized spin--boson Hamiltonians. For a single spin level, we review results of Guichardet and Dereziński: the van Hove Hamiltonians, including the renormalized ones, are exactly the generators of affine Bogoliubov dynamics that do not mix creation and annihilation operators. For several spin levels, there is no analogue of this group, and we introduce spin-dressed implementations, that is to say the free flow of the fields is implemented up to bounded operator-valued displacements, which vanish at a rate measured by a so-called regularity scale and have a spin observable, the coupling map, as derivative at time zero. The one-particle Hamiltonian $\\Upsilon$ and the coupling map are determined by the Hamiltonian, and the field obeys a quantum Langevin equation. Spin-dressed implementations in Fock space, at the finest scale and for form factors in $D(\\Upsilon^{-1/2})$, are exactly the generalized spin--boson Hamiltonians, unique up to the spin Hamiltonian. At the roughest scale, the renormalized spin--boson Hamiltonian of a two-level system with ultraviolet-singular form factor and arbitrary tunnelling is a spin-dressed implementation, and the definition alone yields asymptotic Weyl operators on the test functions along which the coupling map is integrable, a dense set under standard assumptions.", "url": "https://arxiv.org/abs/2611.17025", "type": "理论", "summary": "继 Bach、Lieb 和 Solovej 之后，二次哈密顿量可以定义为实现 Bogoliubov 变换的单参数群的酉群生成器。我们对广义自旋玻色子哈密顿量提出了一个类似的动力学定义。对于单个自旋能级，我们回顾 Guichardet 和 Dereziński 的结果：van Hove Hamiltonian，包括重正化的，正是仿射 Bogoliubov 动力学的生成器，不混合创建和湮灭算子。对于几个自旋水平，没有这组的类似物，我们引入了自旋修饰的实现，也就是说，场的自由流动被实现到有界算子值位移，该位移以所谓的规律性尺度测量的速率消失，并且具有自旋可观察的耦合图，作为时间零时的导数。单粒子哈密顿量 $\\Upsilon$ 和耦合图由哈密顿量确定，场服从量子朗之万方程。福克空间中的自旋修饰实现，以最精细的尺度和 $D(\\Upsilon^{-1/2})$ 中的形状因子，正是广义自旋-玻色子哈密顿量，对于自旋哈密顿量来说是唯一的。\n\n在最粗略的尺度上，具有紫外奇异形状因子和任意隧道效应的二能级系统的重整化自旋玻色子哈密顿量是一种自旋修饰的实现，并且该定义本身就产生了测试函数上的渐近Weyl算子，沿着该测试函数耦合图是可积的，在标准假设下是一个稠密集。", "authors": [{"name": "Nathan Metraud"}], "featured_authors": [{"name": "Nathan Metraud"}], "author_count": 1}, {"id": "2611.17117", "category": "math-ph", "title": "Generalized ladder operators and construction of families of superintegrable systems with Painlevé VI", "abstract": "We study quantum Hamiltonians whose separated angular component is expressed through a generic Painlevé VI transcendent. We construct generalized ladder operators for one-dimensional Schrödinger operators with a quadratic spectral variable. For the Painlevé VI angular Hamiltonian these operators satisfy $[N,J_\\pm]=\\pm2kJ_\\pm$, where $N=\\sqrt M$, and close through an eighth-degree norm polynomial. Combining the angular shifts with the radial shift operators of the oscillator, Coulomb and free Bessel systems yields higher-order integrals and deformed Racah-type polynomial algebras for the two-dimensional superintegrable models. This construction provides new families of Tremblay-Turbiner-Winternitz (TTW)- and Post-Winternitz (PW)-like Hamiltonians with integrals of arbitrarily high order and Painlevé VI in the potential. This framework also recovers models from the classification of third- and fourth-order integrals as particular cases. For a representative oscillator extension we compute the Casimir explicitly and recover the finite-dimensional energy spectrum from a deformed-oscillator realization. We then analyze the special-solution sector using the explicit families collected by Gromak, Laine and Shimomura. The resulting potentials are organized into a small number of spectral classes, and the distinction between formal zeros of the ladder norm and physical self-adjoint representations is made explicit. The regular nonclassical rational examples are rational Darboux deformations of the trigonometric Pöschl--Teller system and lead to strictly isospectral exceptional-Jacobi sectors or to state-adding representations with an isolated angular level. A singular branch produces an interior inverse-square barrier and a split-domain problem. For one regular exceptional sector and two state-adding sectors we display the polynomial algebras.", "url": "https://arxiv.org/abs/2611.17117", "type": "理论", "summary": "我们研究量子哈密顿量，其分离角分量通过通用 Painlevé VI 超越式表示。我们为具有二次谱变量的一维薛定谔算子构造了广义梯算子。对于 Painlevé VI 角度哈密顿量，这些运算符满足 $[N,J_\\pm]=\\pm2kJ_\\pm$，其中 $N=\\sqrt M$，并通过八次范数多项式闭合。将角位移与振子、库仑和自由贝塞尔系统的径向位移算子相结合，产生二维超可积模型的高阶积分和变形 Racah 型多项式代数。这种构造为类似 Tremblay-Turbiner-Winternitz (TTW) 和后 Winternitz (PW) 的哈密顿量提供了新的族，具有任意高阶积分和潜在的 Painlevé VI。该框架还从三阶和四阶积分的分类中恢复模型作为特殊情况。对于代表性振荡器扩展，我们显式计算卡西米尔并从变形振荡器实现中恢复有限维能谱。\n\n然后，我们使用 Gromak、Laine 和 Shimomura 收集的显式族来分析特殊解决方案部门。由此产生的势被组织成少量的谱类，并且梯范数的形式零和物理自伴随表示之间的区别变得明确。常规的非经典有理数例子是三角波施尔-泰勒系统的有理达布变形，并导致严格的等谱异常雅可比扇区或具有孤立角水平的状态添加表示。奇异分支产生内部平方反比势垒和分裂域问题。对于一个常规异常扇区和两个状态添加扇区，我们显示多项式代数。", "authors": [{"name": "Ian Marquette"}, {"name": "Anthony J. L. Parr"}], "featured_authors": [{"name": "Ian Marquette"}, {"name": "Anthony J. L. Parr"}], "author_count": 2}, {"id": "2611.17174", "category": "math-ph", "title": "Existence of a fluid phase for the two-dimensional one-component plasma", "abstract": "The two-dimensional one-component plasma is a system of point charges that repel each other logarithmically, in a uniform neutralizing background. When the inverse temperature $\\beta$ is at most $2$, we prove that its correlations decay exponentially, and that its Gibbs state is unique among point processes whose fluctuations are controlled. This constitutes part of the fluid phase predicted by physicists. As a consequence, we obtain the existence of an infinite-volume limit, extending the Ginibre point process, which we call $\\mathrm{Gin}_\\beta$. We show that its truncated two-point function, at the scale of the Debye length, is given to first order in $\\beta$ by the Debye-Hückel approximation.", "url": "https://arxiv.org/abs/2611.17174", "type": "理论", "summary": "二维单组分等离子体是一种点电荷系统，在均匀的中和背景下以对数方式相互排斥。当逆温度$\\beta$至多$2$时，我们证明其相关性呈指数衰减，并且其吉布斯状态在涨落受控的点过程中是唯一的。这构成了物理学家预测的流体相的一部分。结果，我们得到了无限体积极限的存在，扩展了吉尼伯点过程，我们称之为$\\mathrm{Gin}_\\beta$。我们证明，在德拜长度的尺度上，其截断的两点函数通过 Debye-Hückel 近似被赋予 $\\beta$ 中的一阶。", "authors": [{"name": "Jeanne Boursier"}, {"name": "Thomas Leblé"}], "featured_authors": [{"name": "Jeanne Boursier"}, {"name": "Thomas Leblé"}], "author_count": 2}, {"id": "2611.14623", "category": "quant-ph", "title": "Towards Distributed Quantum Computing: Quantum Gate Teleportation via Satellite-Distributed Entanglement under Atmospheric Depolarization", "abstract": "We investigate quantum gate teleportation as a primitive for satellite-enabled distributed quantum computing. In the considered architecture, a satellite distributes entangled photon pairs to two optical ground stations, which transfer the shared quantum resource to remote quantum processing units. This entanglement is then used to implement a nonlocal controlled-NOT gate between two circuit qubits located in different processors. We formulate the minimal four-qubit protocol, consisting of two network qubits that provide the entangled resource and two circuit qubits on which the distributed gate is performed. Atmospheric propagation effects in the gravitational field are modeled through an effective two-qubit depolarizing channel whose parameters depend on atmospheric and optical quantities, including the Fried parameter and receiver aperture. The performance of the protocol is quantified by the fidelity between the ideal CNOT output state and the state produced by noisy quantum gate teleportation. Our results show that the fidelity is governed by the quality of the distributed entanglement and depends jointly on atmospheric coherence, aperture size, and effective depolarization strength. These findings connect physical-layer modeling of satellite optical channels with gate-level performance in distributed quantum computing.", "url": "https://arxiv.org/abs/2611.14623", "type": "理论", "summary": "我们研究量子门隐形传态作为卫星分布式量子计算的原语。在所考虑的架构中，卫星将纠缠光子对分配到两个光学地面站，这两个光学地面站将共享的量子资源传输到远程量子处理单元。然后，使用这种纠缠来实现位于不同处理器中的两个电路量子位之间的非局部受控非门。我们制定了最小的四量子位协议，由两个提供纠缠资源的网络量子位和两个执行分布式门的电路量子位组成。引力场中的大气传播效应通过有效的双量子位去极化通道进行建模，其参数取决于大气和光学量，包括弗里德参数和接收器孔径。该协议的性能通过理想 CNOT 输出状态与噪声量子门隐形传态产生的状态之间的保真度来量化。\n\n我们的结果表明，保真度由分布式纠缠的质量决定，并共同取决于大气相干性、孔径大小和有效去偏振强度。这些发现将卫星光通道的物理层建模与分布式量子计算中的门级性能联系起来。", "authors": [{"name": "Artur Czerwinski"}, {"name": "Jakub J. Borkowski"}, {"name": "Maciej Wiśniewski"}, {"name": "Saeed Haddadi"}], "featured_authors": [{"name": "Artur Czerwinski"}, {"name": "Jakub J. Borkowski"}, {"name": "Maciej Wiśniewski"}, {"name": "Saeed Haddadi"}], "author_count": 4}, {"id": "2611.14657", "category": "quant-ph", "title": "Quantum synchronization in XX chains under relaxation", "abstract": "We study stable synchronization in qubit XX chains with site-dependent frequencies and exchange couplings under multi-local amplitude damping noise, extending the uniform-chain results of B. Çakmak et al., [Phys. Rev. A 114, L030202 2026] in several directions. We establish that the dark-mode energies are precisely the eigenvalues shared by all undamped segments separated by the damped sites. Generic stable synchronization of the edge qubits occurs if and only if these segments share exactly one eigenvalue and this eigenvalue is nonzero, in which case every qubit on the support of the corresponding dark mode is synchronized with locking constants independent of the initial preparation. This spectral matching condition identifies the Hamiltonian parameters that support synchronization, while the couplings to the damped sites control the relative oscillation amplitudes. We present analytical examples which show how inhomogeneity can create synchronization absent in uniform chains and turn preparation-dependent locking into generic synchronization. We also calculate the asymptotic pairwise concurrence and prove that, in the single-dark-mode regime, every pair participating in synchronized oscillations remains entangled with a nonzero, constant concurrence.", "url": "https://arxiv.org/abs/2611.14657", "type": "理论", "summary": "我们研究了多局部振幅阻尼噪声下具有位点相关频率和交换耦合的量子位 XX 链的稳定同步，扩展了 B. Çakmak 等人的均匀链结果，[Phys. Rev. A 114, L030202 2026] 在几个方向上。我们确定暗模式能量正是由阻尼位点分隔的所有无阻尼段共享的特征值。当且仅当这些段恰好共享一个特征值并且该特征值非零时，才会发生边缘量子位的通用稳定同步，在这种情况下，相应暗模式支持上的每个量子位都与独立于初始准备的锁定常数同步。该光谱匹配条件识别支持同步的哈密顿参数，而与阻尼位点的耦合控制相对振荡幅度。我们提供了分析示例，展示了非同质性如何创建统一链中缺少的同步，并将依赖于准备的锁定转变为通用同步。\n\n我们还计算了渐近成对并发性，并证明在单暗模式下，参与同步振荡的每一对仍然与非零、恒定并发性纠缠在一起。", "authors": [{"name": "Kübra Sümer"}, {"name": "Ege Yiğit Aldırmaz"}, {"name": "Steve Campbell"}, {"name": "Barış Çakmak"}, {"name": "Göktuğ Karpat"}], "featured_authors": [{"name": "Kübra Sümer"}, {"name": "Ege Yiğit Aldırmaz"}, {"name": "Steve Campbell"}, {"name": "Barış Çakmak"}, {"name": "Göktuğ Karpat"}], "author_count": 5}, {"id": "2611.14822", "category": "quant-ph", "title": "Quantum Telatar formula: fading quantum capacity of Haar-random multimode attenuators", "abstract": "Cellular communication is done over an imperfectly predictable multimode environment, where the sender only knows about the distribution of possible intermode coupling and scattering a signal faces. It may thus seem surprising that such communication is efficient. Telatar proved that the sender's lack of exact knowledge about the channel, on average, does not significantly hinder multimode communication. As the number $N$ of modes increases at fixed signal-to-noise ratio, the average capacity of a classical multimode fading channel grows linearly in $N$, like that of $N$ decoupled single-mode channels. We study the quantum analogue in a Haar-random passive bosonic network and prove a similar scaling for unassisted quantum information transmission. Suppose that the sender drives a fixed fraction of the input modes and the receiver collects more than half of the output modes. Then the quantum capacity of such channels at zero temperature grows linearly with the number of modes at fixed photon number per mode, just like the classical capacity grows with the number of antennas. At nonzero temperature, the Haar-averaged coherent information of the isotropic thermal input bounds the capacity from below, and its value per mode converges to an integral against Wachter's law. We numerically identify positive achievable rates in models motivated by cryogenic microwave networks and room-temperature multimode fibers.", "url": "https://arxiv.org/abs/2611.14822", "type": "理论+数值", "summary": "蜂窝通信是在不完全可预测的多模环境中完成的，其中发送者只知道可能的模间耦合和散射信号面的分布。因此，这种沟通的效率似乎令人惊讶。 Telatar 证明，平均而言，发送者缺乏对信道的准确了解并不会显着阻碍多模通信。随着模式数量 $N$ 在固定信噪比下增加，经典多模衰落信道的平均容量以 $N$ 线性增长，就像 $N$ 解耦单模信道一样。我们研究了哈尔随机无源玻色子网络中的量子模拟，并证明了无辅助量子信息传输的类似缩放。假设发送器驱动固定部分的输入模式，接收器收集一半以上的输出模式。然后，这种通道在零温度下的量子容量随着每个模式固定光子数的模式数量线性增长，就像经典容量随着天线数量增长一样。\n\n在非零温度下，各向同性热输入的哈尔平均相干信息从下方限制了容量，并且其每个模式的值收敛为违反瓦赫特定律的积分。我们通过数字方式确定了由低温微波网络和室温多模光纤驱动的模型中可实现的正速率。", "authors": [{"name": "Eric Culf"}, {"name": "Victor V. Albert"}], "featured_authors": [{"name": "Eric Culf"}, {"name": "Victor V. Albert"}], "author_count": 2}, {"id": "2611.14919", "category": "quant-ph", "title": "Evaluating Quantum Circuit Protection Methods After Compilation: An Empirical Comparison", "abstract": "Quantum cloud providers can read the circuits they receive and their outputs, yet methods for hiding a circuit are usually evaluated on the circuit as written, before compilation optimises it. We compare three ObfusQate schemes (inverse, composite and delayed gates), ECQCO and Q-MaskCut under one protocol that compiles every protected circuit at optimisation level 3 before measuring it; the goal is to keep the provider from learning the user's algorithm and answer. Q-MaskCut is one example combination of existing techniques: a one-time-pad key, decoy wires, circuit cutting with a random rotation pair across each cut, and Pauli twirling with dynamical-decoupling masking after compilation. We simulate 11 circuits of 3 to 19 qubits without noise and on two noise models, measure the compiled structure and execution time of 23 circuits of 3 to 127 qubits, and test whether the structural disguise survives a second compilation by the provider. Composite and delayed gates lose most of their structural disguise in compilation and leave the output readable; inverse gates keep a high normalised graph edit distance (normGED) only by making execution 7 to 112 times longer; ECQCO's output could not be decoded with the implementation provided by its authors. Q-MaskCut hides the output (mean total variation distance without the key 0.94), and without noise, with exact fragment probabilities, it decodes exactly. Its compiled normGED of 0.88 comes mostly from the masking, which a second compilation removes, leaving 0.42 from the key, decoys and padlocks. With noise, its fidelity is comparable to the original's; it needs 7 to 91 fragment variants per circuit in the simulations (7 to 61 in a run on ibm_marrakesh) and a classical reconstruction. Protection should therefore be evaluated on the compiled circuit and again after the provider recompiles it.", "url": "https://arxiv.org/abs/2611.14919", "type": "理论+数值", "summary": "量子云提供商可以读取他们接收到的电路及其输出，但隐藏电路的方法通常会在编译优化电路之前对所编写的电路进行评估。我们在一种协议下比较了三种 ObfusQate 方案（逆门、复合门和延迟门）、ECQCO 和 Q-MaskCut，该协议在测量之前以优化级别 3 编译每个受保护的电路；目标是防止提供者了解用户的算法和答案。 Q-MaskCut 是现有技术的一个示例组合：一次性按键、诱饵线、每次切割上具有随机旋转对的电路切割，以及编译后具有动态解耦掩蔽的保利旋转。我们在两个噪声模型上模拟 11 个 3 至 19 个量子位的无噪声电路，测量 23 个 3 至 127 个量子位的电路的编译结构和执行时间，并测试结构伪装是否能经受住提供商的第二次编译。\n\n复合门和延迟门在编译时丢失了大部分结构伪装，并使输出可读；逆门仅通过使执行时间延长 7 至 112 倍来保持较高的归一化图形编辑距离 (normGED)； ECQCO 的输出无法使用其作者提供的实现进行解码。 Q-MaskCut 隐藏了输出（没有密钥的平均总变异距离 0.94），并且没有噪声，具有精确的片段概率，它可以准确解码。其编译后的normGED为0.88，主要来自掩码，第二次编译将其删除，留下钥匙、诱饵和挂锁的0.42。对于噪音，其保真度可与原件相媲美；在模拟中，每个电路需要 7 到 91 个片段变体（在 ibm_marrakesh 上运行需要 7 到 61 个片段变体）和经典重建。因此，应在编译后的电路上评估保护，并在提供商重新编译电路后再次评估。", "authors": [{"name": "Ing Muyleang"}, {"name": "Leanghok Hour"}, {"name": "Youngsun Han"}], "featured_authors": [{"name": "Ing Muyleang"}, {"name": "Leanghok Hour"}, {"name": "Youngsun Han"}], "author_count": 3}, {"id": "2611.14923", "category": "quant-ph", "title": "Quantum CSS codes: Decoder-aware multiobjective design and bound-certified selection", "abstract": "Quantum error-correcting codes trade decoding reliability against the resources needed to measure their checks. We formulate Calderbank-Shor-Steane (CSS) code design at fixed encoding resources as a decoder-aware multiobjective problem. The objectives are failure probability under sector-wise degenerate maximum-likelihood decoding and check weight, the minimum total weight of an independent pure-type generator basis. For independent bit- and phase-flip noise with perfect syndrome extraction, deterministic truncation bounds support selection under a failure-rate constraint. At a per-sector error probability of 0.01, the bounds certify that a code encoding two logical qubits into 40 physical qubits meets a failure-rate target of 0.001 at check weight 139. The lower bound of every cheaper candidate in the corresponding (40,2) main menu exceeds this target. In paired searches sharing one annealing kernel and equal query budgets, decoder-aware guidance gives significantly higher mean final hypervolume than distance guidance in all eight tested configurations under the reported Holm correction. Against distance-multiplicity guidance, five configurations show significant gains and three do not, including one with a negative mean difference. All arms are scored in common truncated-reliability and normalized-check-weight coordinates. The framework connects reliability-check-weight trade-offs to bound-certified selection within evaluated CSS pools.", "url": "https://arxiv.org/abs/2611.14923", "type": "理论+数值", "summary": "量子纠错码将解码可靠性与测量其检查所需的资源进行交换。我们将固定编码资源上的 Calderbank-Shor-Steane (CSS) 代码设计制定为解码器感知的多目标问题。目标是扇区退化最大似然解码和检查权重下的故障概率，即独立纯类型生成器基础的最小总权重。对于具有完美校正子提取的独立比特和相位翻转噪声，确定性截断边界支持故障率约束下的选择。在每扇区错误概率为 0.01 的情况下，该界限证明将两个逻辑量子位编码为 40 个物理量子位的代码在检查权重 139 时满足 0.001 的故障率目标。相应 (40,2) 主菜单中每个更便宜的候选者的下限都超过了该目标。在共享一个退火内核和相同查询预算的配对搜索中，在报告的 Holm 校正下，在所有八种测试配置中，解码器感知指导给出的平均最终超体积显着高于距离指导。\n\n相对于距离多重性指导，五种配置显示出显着的增益，而三种则没有，其中一种具有负平均差。所有手臂均以共同的截断可靠性和标准化检查重量坐标进行评分。该框架将可靠性检查权重权衡与评估的 CSS 池中的有界认证选择联系起来。", "authors": [{"name": "Jiapei Zhuang"}, {"name": "Yaocheng Chen"}, {"name": "Xingyao Wu"}], "featured_authors": [{"name": "Jiapei Zhuang"}, {"name": "Yaocheng Chen"}, {"name": "Xingyao Wu"}], "author_count": 3}, {"id": "2611.14944", "category": "quant-ph", "title": "CSS Circuits: useful quantum circuits that can be simulated with $O(1)$ cost per gate", "abstract": "\"CSS circuits\" are quantum circuits generated by $X$, $Z$, $M_X$, $M_Z$, and CNOT gates. Although CSS circuits are extremely restrictive, they can implement important quantum protocols like teleportation, error correction, and entanglement purification. We present a simple CSS circuit simulator that uses $O(1)$ work per gate. The simulator corresponds to a local hidden variable model, so we use Bell inequalities to prove the simulator can't also support Hadamard gates, CZ gates, or S gates. We note that CSS circuits appear ideal for benchmarking quantum error correction in the presence of atom loss errors.", "url": "https://arxiv.org/abs/2611.14944", "type": "理论", "summary": "“CSS 电路”是由 $X$、$Z$、$M_X$、$M_Z$ 和 CNOT 门生成的量子电路。尽管 CSS 电路受到极大限制，但它们可以实现重要的量子协议，如隐形传态、纠错和纠缠净化。我们提出了一个简单的 CSS 电路模拟器，每个门使用 $O(1)$ 工作量。模拟器对应于局部隐变量模型，因此我们使用贝尔不等式来证明模拟器不能同时支持Hadamard门、CZ门或S门。我们注意到，CSS 电路似乎非常适合在存在原子损失错误的情况下对量子纠错进行基准测试。", "authors": [{"name": "Craig Gidney"}, {"name": "Cody Jones"}], "featured_authors": [{"name": "Craig Gidney"}, {"name": "Cody Jones"}], "author_count": 2}, {"id": "2611.15000", "category": "quant-ph", "title": "QSim-Arena: an evolving developer for quantum simulation advantage", "abstract": "Where practical advantage emerges in quantum dynamics simulation remains a central debate in quantum computing. Claimed advantages can be rapidly narrowed or overturned by stronger classical methods, while progress on both sides can outpace the journal publication cycle. We present QSim-Arena, a research framework in which AI agents combine a closed loop of verification and benchmarking with open exploration. Hamiltonians, initial states and accuracy targets for evolved states or observable expectation values provide explicit specifications for evaluating simulation methods. Agents translate published techniques into executable components, reproduce reported results and benchmark their performance across diverse Hamiltonian families. Competing classical methods are implemented and independently crosschecked, providing credible baselines for end-to-end quantum resource estimates based on rigorous error bounds and empirical calibration. Alongside this closed loop, agents recombine classical simulation techniques and co-design fault-tolerant quantum circuits using knowledge extracted from the literature. Initial applications improve baseline resource estimates through the integration of established techniques. QSim-Arena thus treats quantum advantage assessment as an evolving, reproducible research process that can respond to advances in algorithms, error analysis and hardware.", "url": "https://arxiv.org/abs/2611.15000", "type": "理论+数值", "summary": "量子动力学模拟中出现的实际优势仍然是量子计算中的一个中心争论。所谓的优势可能会被更强大的经典方法迅速缩小或推翻，而双方的进展可能会超过期刊出版周期。我们提出了 QSim-Arena，这是一个研究框架，其中人工智能代理将验证和基准测试的闭环与开放探索相结合。哈密​​顿量、初始状态和演化状态的精度目标或可观察的期望值为评估模拟方法提供了明确的规范。代理将已发布的技术转化为可执行组件，重现报告的结果并在不同的哈密顿家族中对其性能进行基准测试。相互竞争的经典方法得到实施并独立交叉检查，为基于严格误差范围和经验校准的端到端量子资源估计提供可靠的基线。除了这个闭环之外，智能体还重新组合经典模拟技术，并使用从文献中提取的知识共同设计容错量子电路。\n\n初始应用通过整合现有技术改进了基线资源估算。因此，QSim-Arena 将量子优势评估视为一个不断发展的、可重复的研究过程，可以响应算法、错误分析和硬件的进步。", "authors": [{"name": "Jue Xu"}, {"name": "Yue Wang"}, {"name": "Qi Zhao"}], "featured_authors": [{"name": "Jue Xu"}, {"name": "Yue Wang"}, {"name": "Qi Zhao"}], "author_count": 3}, {"id": "2611.15018", "category": "quant-ph", "title": "Time- and Photon-Optimal Paths for the Preparation and Logical Flip of Gottesman-Kitaev-Preskill States", "abstract": "Gottesman-Kitaev-Preskill (GKP) states are highly non-Gaussian, making their control challenging, particularly in the presence of photon loss. Here, we use the brachistochrone, the fastest path at bounded speed, to construct ideal nonlinear Hamiltonians for state preparation and logical gates, and compare it with the photon-optimal path. We find that the two paths nearly coincide for state preparation but differ markedly for logical operations, namely the brachistochrone preserves the encoded qubit during a bit flip, whereas the photon-optimal path flips a known state through the vacuum. We then introduce the tangential capacity to quantify how effectively gate sets track these paths. Using this analysis, we find that conditional squeezing achieves the highest capacity, preparing GKP states in 824 ns with a fidelity of 0.99 and a minimum closeness to the path of 0.90, compared with 0.98 and 0.51 for conditional displacements and 0.83 and 0.19 for SNAP gates.", "url": "https://arxiv.org/abs/2611.15018", "type": "理论", "summary": "Gottesman-Kitaev-Preskill (GKP) 态是高度非高斯的，这使得它们的控制具有挑战性，特别是在存在光子损失的情况下。在这里，我们使用速时线（有界速度下的最快路径）来构造用于状态准备和逻辑门的理想非线性哈密顿量，并将其与光子最优路径进行比较。我们发现这两条路径在状态准备方面几乎一致，但在逻辑运算方面却明显不同，即速速线在位翻转期间保留编码的量子位，而光子最优路径则通过真空翻转已知状态。然后，我们引入切向容量来量化门组跟踪这些路径的有效性。通过此分析，我们发现条件压缩实现了最高容量，在 824 ns 内准备好 GKP 状态，保真度为 0.99，与路径的最小接近度为 0.90，而条件位移为 0.98 和 0.51，SNAP 门为 0.83 和 0.19。", "authors": [{"name": "Aidan Curtis"}, {"name": "Juan S. Salcedo-Gallo"}, {"name": "Sergei Leonov"}, {"name": "Kevin Limanta"}, {"name": "Peter Chin"}, {"name": "Salil Bedkihal"}, {"name": "Mattias Fitzpatrick"}], "featured_authors": [{"name": "Aidan Curtis"}, {"name": "Juan S. Salcedo-Gallo"}, {"name": "Sergei Leonov"}, {"name": "Peter Chin"}, {"name": "Salil Bedkihal"}, {"name": "Mattias Fitzpatrick"}], "author_count": 7}, {"id": "2611.15057", "category": "quant-ph", "title": "Sensing frequencies at the discrete Grover-Heisenberg limit using a single qubit", "abstract": "We consider a fundamental quantum sensing task: detecting weak oscillating fields with unknown strength and frequency. Recent work by Allen et al. established a fundamental lower bound on the required sensing time, which they named the \"Grover-Heisenberg limit\", and gave a protocol attaining this limit. The protocol relies on auxiliary qubits, which are used to run Grover's algorithm as a subroutine, leaving open the question of whether a single sensing qubit can achieve the same scaling. We show that a single qubit suffices for a discrete version of this problem, in which the signal strength is known and the frequency belongs to an arbitrary, but known, finite set of candidate frequencies. Our protocol's sensing time grows only as the square root of the number of candidate frequencies. We prove that this square-root dependence, which we refer to as the \"discrete Grover-Heisenberg limit\", is optimal in the worst case.", "url": "https://arxiv.org/abs/2611.15057", "type": "理论+数值", "summary": "我们考虑一个基本的量子传感任务：检测强度和频率未知的弱振荡场。艾伦等人的最新工作。建立了所需传感时间的基本下限，他们将其命名为“格罗弗-海森堡极限”，并给出了达到该极限的协议。该协议依赖于辅助量子位，辅助量子位用于将 Grover 算法作为子程序运行，从而留下了单个传感量子位是否可以实现相同缩放比例的问题。我们证明，单个量子位足以解决该问题的离散版本，其中信号强度已知，并且频率属于任意但已知的有限候选频率集。我们协议的感知时间仅随着候选频率数量的平方根而增长。我们证明，这种平方根依赖性（我们称之为“离散格罗弗-海森堡极限”）在最坏情况下是最优的。", "authors": [{"name": "Boyang Chen"}, {"name": "Andrea Coladangelo"}, {"name": "Jerry Li"}, {"name": "Haocheng Zhang"}], "featured_authors": [{"name": "Boyang Chen"}, {"name": "Andrea Coladangelo"}, {"name": "Jerry Li"}, {"name": "Haocheng Zhang"}], "author_count": 4}, {"id": "2611.15198", "category": "quant-ph", "title": "Dissipaton-embedded quantum master equation for nonlinear system-bath coupling", "abstract": "The dissipaton theory was proposed more than a decade ago as a statistical quasiparticle theory for open quantum systems and was soon extended to nonlinear system-bath coupling. Although numerical results provided strong evidence for its validity, a rigorous mathematical foundation, particularly for nonlinear system-bath coupling, was established only recently. On this basis, we formulate the dissipaton-embedded quantum master equation for nonlinear system-bath coupling. This in-principle exact master equation describes the joint dynamics of the reduced system and all dissipaton degrees of freedom.", "url": "https://arxiv.org/abs/2611.15198", "type": "理论+数值", "summary": "耗散理论是十多年前提出的，作为开放量子系统的统计准粒子理论，并很快扩展到非线性系统浴耦合。尽管数值结果为其有效性提供了强有力的证据，但严格的数学基础，特别是非线性系统-浴耦合的数学基础，直到最近才建立起来。在此基础上，我们建立了非线性系统-浴耦合的耗散嵌入量子主方程。这个原则上精确的主方程描述了简化系统的联合动力学和所有耗散自由度。", "authors": [{"name": "Zi-Fan Zhu"}, {"name": "Yao Wang"}, {"name": "Rui-Xue Xu"}, {"name": "YiJing Yan"}], "featured_authors": [{"name": "Zi-Fan Zhu"}, {"name": "Yao Wang"}, {"name": "Rui-Xue Xu"}, {"name": "YiJing Yan"}], "author_count": 4}, {"id": "2611.15298", "category": "quant-ph", "title": "Quantum Recurrent Architectures for Financial Time Series Prediction", "abstract": "This study evaluates quantum classical hybrid recurrent architectures for financial time-series forecasting: a Quantum Long Short-Term Memory (QLSTM) network and Quantum Reservoir Computing (QRC) with lag-based inputs. Classical lag vectors are encoded into quantum states via amplitude encoding, which compactly represents normalized observations but requires nontrivial state preparation; the QLSTM gates and the QRC reservoir are implemented with parameterized quantum circuits, while classical optimizers train the interface and readout layers. On a monthly revenue series extended to 1056 months by a Gaussian-process--hidden-Markov generator, with a fixed chronological 70/15/15 split and one-step-ahead forecasts, we compare both models against a full-size LSTM, a classical control matched in parameter budget and interface architecture, a small plain LSTM, and classical reservoir computing, over ten seeds and against persistence, seasonal-naive and SARIMA benchmark forecasts. The QLSTM, with 2,105 parameters, is statistically indistinguishable from an LSTM 126 times larger, but equally indistinguishable from the matched classical control and from a plain LSTM of the same budget, so its parameter efficiency cannot be attributed to the quantum circuits. The quantum reservoir is worse than a classical reservoir of equal feature dimension in all ten seeds and worse than SARIMA, whereas all recurrent models and both classical reservoirs improve on SARIMA by about 2\\% in RMSE. In a 24-month rolling-origin backtest the classical LSTMs degrade more slowly than the QLSTM. We find no evidence of a quantum accuracy or parameter-efficiency advantage in this low-dimensional setting.", "url": "https://arxiv.org/abs/2611.15298", "type": "理论+数值", "summary": "本研究评估了用于金融时间序列预测的量子经典混合循环架构：量子长短期记忆（QLSTM）网络和具有基于滞后输入的量子储层计算（QRC）。经典滞后向量通过幅度编码被编码成量子态，它紧凑地表示归一化的观察结果，但需要不平凡的状态准备； QLSTM 门和 QRC 存储库是通过参数化量子电路实现的，而经典优化器则训练接口和读出层。在由高斯过程-隐马尔可夫生成器扩展至 1056 个月的每月收入系列中，具有固定的时间顺序 70/15/15 分割和一步提前预测，我们将这两个模型与全尺寸 LSTM、参数预算和接口架构匹配的经典控制、小型普通 LSTM 和经典水库计算、十多个种子以及持久性、季节性朴素和 SARIMA 基准预测进行比较。\n\n具有 2,105 个参数的 QLSTM 在统计上与大 126 倍的 LSTM 没有什么区别，但与匹配的经典控制和相同预算的普通 LSTM 也同样没有区别，因此它的参数效率不能归因于量子电路。量子存储库在所有十个种子中都比相同特征维度的经典存储库差，并且比 SARIMA 更差，而所有循环模型和两个经典存储库在 RMSE 上比 SARIMA 提高了约 2%。在 24 个月的滚动源回测中，经典 LSTM 的退化速度比 QLSTM 慢。我们没有发现在这种低维设置中具有量子精度或参数效率优势的证据。", "authors": [{"name": "Danyal Maheshwari"}, {"name": "Gerhard Hellstern"}, {"name": "Martin Zaefferer"}, {"name": "Martin Braun"}, {"name": "Tanja Döhler"}], "featured_authors": [{"name": "Danyal Maheshwari"}, {"name": "Gerhard Hellstern"}, {"name": "Martin Zaefferer"}, {"name": "Martin Braun"}, {"name": "Tanja Döhler"}], "author_count": 5}, {"id": "2611.15322", "category": "quant-ph", "title": "On the domain of the effective non-Hermitian Hamiltonian in quantum markovian dynamics", "abstract": "The GKLS representation of the unbounded generator of a quantum Markov semigroup crucially depends on an unbounded operator $G$, generating a strongly continuous contraction semigroup on the underlying Hilbert space, which is formally the sum of a negative self-adjoint operator $G_0$ and $-\\mathrm{i}H$ with $H$ symmetric. In many situations it is useful to know the relationships between the domains of the three operators, in particular whether $\\Dom(G)=\\Dom(G_0)\\cap\\Dom(H)$ when both $G_0$ and $H$ are unbounded. In this note we show that this happens when $G_0$ and $H$ are self-adjoint quadratic polynomials in annihilation and creation operators in a finite-mode bosonic Fock space and $G_0\\leq0$ or assuming a certain half bound on the commutator of $G_0$ and $H$. A counterexample shows that the conclusion does not hold in general situations.", "url": "https://arxiv.org/abs/2611.15322", "type": "理论", "summary": "量子马尔可夫半群的无界生成元的 GKLS 表示关键取决于无界算子 $G$，在底层希尔伯特空间上生成强连续收缩半群，其形式上是负自伴算子 $G_0$ 和 $-\\mathrm{i}H$ 与 $H$ 对称的和。在许多情况下，了解三个运算符的域之间的关系很有用，特别是当 $G_0$ 和 $H$ 都无界时 $\\Dom(G)=\\Dom(G_0)\\cap\\Dom(H)$ 是否成立。在本文中，我们表明，当 $G_0$ 和 $H$ 是有限模式玻色 Fock 空间中的湮没和创建算子中的自伴二次多项式和 $G_0\\leq0$ 时，或者假设 $G_0$ 和 $H$ 的换向器上存在某个半界时，就会发生这种情况。一个反例表明这个结论在一般情况下不成立。", "authors": [{"name": "Franco Fagnola"}, {"name": "Zheng Li"}], "featured_authors": [{"name": "Franco Fagnola"}, {"name": "Zheng Li"}], "author_count": 2}, {"id": "2611.15349", "category": "quant-ph", "title": "Quantization Breaks Classical Mpemba Constraints", "abstract": "The Mpemba effect, in which an initially hotter system relaxes faster than a colder one, has been widely studied in both classical and quantum systems, yet identifying the specific effects of quantization requires a consistent comparison with the corresponding classical dynamics. Starting from the Caldeira-Leggett model, we establish a quantum-classical correspondence for thermal relaxation. We find that the locality of classical energy diffusion forbids the Mpemba effect in single-well and symmetric double-well potentials. Conversely, quantum dynamics allows for direct transitions between nonadjacent energy levels, overcoming the constraints of classical local energy diffusion and enabling the Mpemba effect in these potentials. In the semiclassical limit $\\hbar\\to0$, the nonlocal transitions become increasingly suppressed, restoring the classical constraints. Our findings reveal that quantization fundamentally unlocks anomalous relaxation pathways, rather than merely modifying relaxation rates.", "url": "https://arxiv.org/abs/2611.15349", "type": "理论", "summary": "姆彭巴效应（即最初较热的系统比较冷的系统弛豫得更快）已在经典系统和量子系统中得到广泛研究，但识别量子化的具体效应需要与相应的经典动力学进行一致的比较。从 Caldeira-Leggett 模型开始，我们建立了热弛豫的量子经典对应关系。我们发现经典能量扩散的局域性禁止单阱和对称双阱势中的 Mpemba 效应。相反，量子动力学允许非相邻能级之间的直接跃迁，克服了经典局域能量扩散的限制，并在这些势能中实现姆潘巴效应。在半经典极限 $\\hbar\\to0$ 中，非局域转变变得越来越受到抑制，恢复了经典约束。我们的研究结果表明，量化从根本上解锁了异常弛豫路径，而不仅仅是改变弛豫率。", "authors": [{"name": "Yue Liu"}, {"name": "Tan Van Vu"}, {"name": "Frédéric van Wijland"}, {"name": "Hisao Hayakawa"}], "featured_authors": [{"name": "Yue Liu"}, {"name": "Tan Van Vu"}, {"name": "Frédéric van Wijland"}, {"name": "Hisao Hayakawa"}], "author_count": 4}, {"id": "2611.15351", "category": "quant-ph", "title": "When Do Quantum Correlations Matter for Quantum Annealing?", "abstract": "Whether quantum correlations give non-adiabatic annealing a scaling advantage remains an open question. We address it by comparing quantum annealing (QA) with quantum-inspired annealing (QIA), a classical protocol that retains the Hamiltonian structure and annealing schedule of QA while excluding nonlocal quantum correlations. Across models varying in dimensionality, disorder, and frustration, we find that the difference in scaling between the two protocols is strongly model dependent. QA shows a clear advantage in clean, low-dimensional systems, but the advantage diminishes with increasing dimensionality and becomes negligible in three or more dimensions. Disorder and frustration further narrow the difference. These results identify where quantum correlations have a qualitative effect on annealing scaling and provide a classical baseline for assessing their role.", "url": "https://arxiv.org/abs/2611.15351", "type": "理论", "summary": "量子关联是否赋予非绝热退火缩放优势仍然是一个悬而未决的问题。我们通过比较量子退火 (QA) 与量子启发退火 (QIA) 来解决这个问题，量子启发退火是一种经典协议，保留了 QA 的哈密顿结构和退火时间表，同时排除非局域量子相关性。在维度、无序性和挫败度各不相同的模型中，我们发现两种协议之间的缩放差异强烈依赖于模型。 QA 在干净的低维系统中显示出明显的优势，但这种优势随着维度的增加而减弱，并且在三个或更多维度中变得可以忽略不计。混乱和沮丧进一步缩小了差距。这些结果确定了量子相关性对退火缩放的定性影响，并为评估其作用提供了经典基线。", "authors": [{"name": "Rongfeng Xie"}, {"name": "Evgenii Ievlev"}, {"name": "Alex Kamenev"}], "featured_authors": [{"name": "Rongfeng Xie"}, {"name": "Evgenii Ievlev"}, {"name": "Alex Kamenev"}], "author_count": 3}, {"id": "2611.15374", "category": "quant-ph", "title": "Full Mesh Dynamic Four-User Entanglement-based Switched QKD Network Integrated with SD-KMS", "abstract": "We demonstrate a reconfigurable, four-user, full-mesh quantum key distribution network using polarization entanglement, integrated with a software-defined key management system to orchestrate dynamic optical switching and real-time key provisioning for quantum-safe applications.", "url": "https://arxiv.org/abs/2611.15374", "type": "理论", "summary": "我们展示了一种使用偏振纠缠的可重构、四用户、全网状量子密钥分发网络，与软件定义的密钥管理系统集成，为量子安全应用协调动态光交换和实时密钥配置。", "authors": [{"name": "Nikolas Makris"}, {"name": "Persefoni Konteli"}, {"name": "Zafeirios Georgiadis"}, {"name": "Alkinoos Papageorgopoulos"}, {"name": "Grigorios Anastasiou"}, {"name": "Panagiotis Papanastasiou"}, {"name": "Konstantinos Tsimvrakidis"}, {"name": "George T. Kanellos"}], "featured_authors": [{"name": "Nikolas Makris"}, {"name": "Persefoni Konteli"}, {"name": "Zafeirios Georgiadis"}, {"name": "Panagiotis Papanastasiou"}, {"name": "Konstantinos Tsimvrakidis"}, {"name": "George T. Kanellos"}], "author_count": 8}, {"id": "2611.15416", "category": "quant-ph", "title": "Extractable Work from Collective Dark-State Charging of Quantum Batteries", "abstract": "We consider two ensembles of superconducting qubits coupled to a common lossy resonator, one serving as the charger and the other the battery. Destructive interference between their collective decay amplitudes selects a tunable family of many-body dark states, allowing controlled excitation transfer from the charger to the battery. The collective charging dynamics preserves the symmetric Dicke subspace of the battery, so its reduced state has at most $N+1$ nonzero eigenvalues. Together with the $N$-fold degeneracy of the battery's first excited energy level, this restriction keeps the passive energy of the entire battery below the single-qubit excitation energy $\\omega_0$, independently of the battery size. When the average stored energy per battery qubit is fixed and nonzero, the total stored energy grows linearly with $N$, while the ratio of global ergotropy to stored energy approaches unity as $N$ increases.", "url": "https://arxiv.org/abs/2611.15416", "type": "理论", "summary": "我们考虑与一个公共有损谐振器耦合的两个超导量子位集合，一个用作充电器，另一个用作电池。它们的集体衰减幅度之间的破坏性干扰选择了可调谐的多体暗态系列，从而允许从充电器到电池的受控激励传输。集体充电动态保留了电池的对称迪克子空间，因此其简化状态最多具有 $N+1$ 个非零特征值。加上电池第一激发能级的 $N$ 倍简并性，这一限制使整个电池的被动能量保持在单量子位激发能量 $\\omega_0$ 以下，与电池尺寸无关。当每个电池量子位的平均存储能量固定且非零时，总存储能量随 $N$ 线性增长，而全局各向异性与存储能量的比率随着 $N$ 的增加而接近 1。", "authors": [{"name": "Jian-Jian Cheng"}, {"name": "Ming-Liang Hu"}], "featured_authors": [{"name": "Jian-Jian Cheng"}, {"name": "Ming-Liang Hu"}], "author_count": 2}, {"id": "2611.15487", "category": "quant-ph", "title": "Restoring Heisenberg Scaling in Hamiltonian Estimation despite Noise Uncertainty", "abstract": "Noise degrades quantum coherence and limits the precision of quantum sensors. Quantum control can counteract these effects, but existing strategies typically assume that the noise is known. In practice, noise is often only partially characterized, so its parameters must be estimated jointly with the Hamiltonian parameters of interest. Here we show that uncertainty in the noise parameters can destroy otherwise attainable Heisenberg scaling, even when coherence is preserved. For general Markovian dynamics under arbitrary quantum control, we derive a necessary and sufficient condition for each Hamiltonian parameter to retain this scaling and determine its optimal asymptotic precision when the condition holds. When the condition fails, we propose a protocol that uses a suitable noisy reference system to restore this scaling, and prove that a reference insensitive to the Hamiltonian parameters but subject to an independent copy of the sensor's noise recovers the optimal precision attainable with known noise. Our results reveal how incomplete knowledge of the noise affects the fundamental limits of quantum metrology, with broad implications for achieving quantum-enhanced precision in realistic environments.", "url": "https://arxiv.org/abs/2611.15487", "type": "理论", "summary": "噪声会降低量子相干性并限制量子传感器的精度。量子控制可以抵消这些影响，但现有策略通常假设噪声是已知的。在实践中，噪声通常只能部分表征，因此其参数必须与感兴趣的哈密顿参数联合估计。在这里，我们表明，即使保持相干性，噪声参数的不确定性也会破坏原本可实现的海森堡缩放比例。对于任意量子控制下的一般马尔可夫动力学，我们推导出每个哈密顿参数的充分必要条件，以保持这种标度并在条件成立时确定其最佳渐近精度。当条件失败时，我们提出了一种协议，使用合适的噪声参考系统来恢复这种缩放，并证明对哈密顿参数不敏感但受传感器噪声的独立副本影响的参考可以恢复已知噪声可达到的最佳精度。\n\n我们的结果揭示了对噪声的不完整了解如何影响量子计量学的基本极限，这对于在现实环境中实现量子增强精度具有广泛的影响。", "authors": [{"name": "Yan Luo"}, {"name": "Lingna Wang"}, {"name": "Hongzhen Chen"}], "featured_authors": [{"name": "Yan Luo"}, {"name": "Lingna Wang"}, {"name": "Hongzhen Chen"}], "author_count": 3}, {"id": "2611.15839", "category": "quant-ph", "title": "k-partite quantum homomorphisms", "abstract": "$k$-partite XOR games and linear binary constraint system (BCS) games arise from systems of linear equations over $\\mathbb{Z}_2$, providing distinct quantum relaxations of the same classical constraint satisfaction problem (CSP). Linear BCS games have been generalised to synchronous homomorphism games on arbitrary relational structures, with compositional semantics provided by the quantum monad. We introduce $k$-partite homomorphism games, extending $k$-XOR games from linear systems to arbitrary relational structures. This yields a framework for studying multipartite quantum CSPs and quantum homomorphisms. We characterise perfect strategies in both the tensor-product and commuting-operator models as Kleisli morphisms of suitable state-dependent graded quantum monads on a category of $k$-partite relational structures. We then study quantum advantage in the pseudotelepathic sense: the existence of a perfect quantum strategy without a perfect classical strategy. We show that synchronous and $k$-partite quantum advantage are incomparable at the level of CSP instances. The GHZ instance admits three-player quantum advantage but no synchronous commuting-operator advantage, whereas the magic-square instance admits synchronous quantum advantage but no $k$-partite commuting-operator advantage for any number of players or proper colouring. We also exhibit an explicit six-element template whose CSP is NP-complete and admits two-player quantum advantage. Finally, we prove that no bounded-width CSP template admits $k$-partite quantum advantage, even in the commuting-operator model.", "url": "https://arxiv.org/abs/2611.15839", "type": "理论", "summary": "$k$ 部分异或游戏和线性二元约束系统 (BCS) 游戏源自 $\\mathbb{Z}_2$ 上的线性方程组，为相同的经典约束满足问题 (CSP) 提供不同的量子松弛。线性 BCS 博弈已推广到任意关系结构上的同步同态博弈，并具有由量子单子提供的组合语义。我们引入$k$-部分同态博弈，将$k$-XOR博弈从线性系统扩展到任意关系结构。这产生了一个研究多部分量子 CSP 和量子同态的框架。我们将张量积和通勤算子模型中的完美策略描述为 $k$ 部分关系结构类别上合适的状态相关分级量子单子的 Kleisli 态射。然后，我们研究伪心灵感应意义上的量子优势：在没有完美经典策略的情况下存在完美的量子策略。我们表明，同步和 $k$ 部分的量子优势在 CSP 实例级别上是无可比拟的。\n\nGHZ 实例承认三人量子优势，但没有同步通勤运营商优势，而幻方实例承认同步量子优势，但对于任何数量的玩家或适当的着色都没有 $k$ 部分通勤运营商优势。我们还展示了一个显式的六元素模板，其 CSP 是 NP 完全的，并且承认两人量子优势。最后，我们证明，即使在通勤运营商模型中，也没有有限宽度的 CSP 模板承认 $k$ 部分量子优势。", "authors": [{"name": "Amin Karamlou"}], "featured_authors": [{"name": "Amin Karamlou"}], "author_count": 1}, {"id": "2611.15898", "category": "quant-ph", "title": "Superradiant photon bunching in nanolasers: from a polarization-order hierarchy of the master equation to Dicke Markov chains", "abstract": "In nanolasers, a few to a few hundred quantum emitters share a single mode of light. Coupled identically to the mode, the emitters do not radiate independently but form collective bright and dark states, producing superradiant bursts and strongly bunched photon statistics below the laser threshold. We investigate to what extent this behavior can be understood as random jumps between collective Dicke states. From the laser master equation, we derive a hierarchy of models defined by the polarization order, i.e., the number of photons involved in the coherence between the emitters and the light, and include the coherence to various orders. With all of the coherences eliminated, we obtain a Dicke Markov chain, a stochastic jump process over the photon number and the Dicke states, in which collective effects enter only through enhanced or suppressed transition rates. It predicts superthermal bunching and a strong even--odd dependence on the emitter number. It recovers about 80\\% of the bunching in the most coherent regime, where conventional rate equations predict no superthermal bunching. Keeping the first polarization order, i.e., the optical polarization, and eliminating the second order, i.e., the two-photon coherences, yields a population-polarization model, which recovers the bunching of the full master equation almost perfectly. This hierarchy of polarization orders is an alternative to the cumulant expansion and, unlike it, recovers the master equation at the highest order. As a numerically exact reference, a symmetry-reduced master equation extends the simulation range all the way to 34 (24) emitters below (above) threshold. The Dicke Markov chain can be solved directly for hundreds of emitters and sampled for thousands of emitters, further extending the range of numerical methods. We compare the numerical performance of the methods in detail to guide the choice of technique.", "url": "https://arxiv.org/abs/2611.15898", "type": "理论+数值", "summary": "在纳米激光器中，几个到几百个量子发射器共享单一模式的光。与模式相同地耦合，发射器不会独立辐射，而是形成集体亮态和暗态，产生超辐射爆发和低于激光阈值的强束光子统计数据。我们研究了这种行为在多大程度上可以被理解为集体迪克状态之间的随机跳跃。从激光主方程中，我们推导出由偏振阶定义的模型层次结构，即涉及发射器和光之间相干性的光子数量，并包括各种阶的相干性。消除所有相干性后，我们获得了迪克马尔可夫链，这是光子数和迪克态上的随机跳跃过程，其中集体效应仅通过增强或抑制的跃迁率进入。它预测超热聚束和对发射器数量的强烈偶数-奇数依赖性。它在最相干的状态下恢复了大约 80% 的聚束，其中传统的速率方程预测没有超热聚束。\n\n保持第一偏振阶，即光学偏振，并消除第二阶，即双光子相干性，产生群体偏振模型，该模型几乎完美地恢复了完整主方程的聚束。这种偏振阶次层次结构是累积量展开的替代方案，与它不同的是，它恢复了最高阶的主方程。作为数字上的精确参考，对称性降低的主方程将模拟范围一直扩展到低于（高于）阈值的 34 (24) 个发射器。迪克马尔可夫链可以直接求解数百个发射器，并对数千个发射器进行采样，进一步扩展了数值方法的范围。我们详细比较这些方法的数值性能，以指导技术的选择。", "authors": [{"name": "Matias Bundgaard-Nielsen"}, {"name": "Jesper Mørk"}], "featured_authors": [{"name": "Matias Bundgaard-Nielsen"}, {"name": "Jesper Mørk"}], "author_count": 2}, {"id": "2611.15952", "category": "quant-ph", "title": "Quasi-Cyclic Qudit Lifted Product Codes with Almost Linear Minimum Distance", "abstract": "Quantum low-density parity-check (QLDPC) codes are a promising route to fault-tolerant quantum computation with low overhead, and qudits offer advantages over qubits including more efficient information representation, improved magic state distillation, and richer algebraic structure for code design. Asymptotically good QLDPC codes arise from the lifted product (LP) construction with non-abelian lifts, but cyclic lifts remain attractive in practice because the resulting quasi-cyclic codes have circulant structure that hardware decoders exploit, which matters especially for non-binary decoders with costly check node operations. We introduce a qudit generalization of the LP construction over cyclic group algebras, which extends hypergraph product and LP codes to arbitrary prime-power dimensions and yields quasi-cyclic qudit CSS codes for every stacking order. We bound encoding rates via a connection to additive codes, and show that in the fully stacked case, qudit LP codes built from lifted Tanner codes on expander graphs form families with $\\Theta(\\log N)$ logical qudits and almost linear minimum distance $\\Theta(N/\\log N)$, via a distance bound that holds for a general class of LP factors. We also study an additive decoder for general qudit codes and a linear merged-syndrome decoder for fully stacked codes. Monte Carlo simulations under a depolarizing channel with equal symbol error probability show that qudit codes achieve lower frame error rates than comparable qubit codes, and that the linear decoder gives further gains for fully stacked codes.", "url": "https://arxiv.org/abs/2611.15952", "type": "理论+数值", "summary": "量子低密度奇偶校验（QLDPC）代码是一种低开销的容错量子计算的有前途的途径，并且与量子位相比，qudits 具有优势，包括更有效的信息表示、改进的魔态蒸馏以及用于代码设计的更丰富的代数结构。渐进良好的 QLDPC 码源自具有非交换提升的提升积 (LP) 构造，但循环提升在实践中仍然有吸引力，因为生成的准循环码具有硬件解码器利用的循环结构，这对于具有昂贵的校验节点操作的非二进制解码器尤其重要。我们引入了循环群代数上 LP 构造的 qudit 泛化，它将超图积和 LP 代码扩展到任意素数幂维度，并为每个堆叠顺序生成准循环 qudit CSS 代码。\n\n我们通过与附加代码的连接来限制编码率，并表明在完全堆叠的情况下，从扩展图上的提升 Tanner 代码构建的 qudit LP 代码形成具有 $\\Theta(\\log N)$ 逻辑 qudits 和几乎线性最小距离 $\\Theta(N/\\log N)$ 的族，通过适用于一般类 LP 因子的距离界限。我们还研究了通用 qdit 代码的加法解码器和全堆叠代码的线性合并综合症解码器。在具有相等符号错误概率的去极化通道下进行的蒙特卡罗模拟表明，qudit 代码比同类量子位代码实现了更低的帧错误率，并且线性解码器为完全堆叠的代码提供了进一步的增益。", "authors": [{"name": "Shantom K. Borah"}, {"name": "Abhinav Vaishya"}, {"name": "V. Lalitha"}, {"name": "Asit Kumar Pradhan"}, {"name": "Bane Vasic"}, {"name": "Narayanan Rengaswamy"}], "featured_authors": [{"name": "Shantom K. Borah"}, {"name": "Abhinav Vaishya"}, {"name": "V. Lalitha"}, {"name": "Asit Kumar Pradhan"}, {"name": "Bane Vasic"}, {"name": "Narayanan Rengaswamy"}], "author_count": 6}, {"id": "2611.15967", "category": "quant-ph", "title": "Comprehensive quantum electrodynamics of fast electrons interacting with dissipative nanostructures and quantum light", "abstract": "Theoretical descriptions of the quantum electrodynamical interaction between fast electrons and nanostructures conventionally rely on standard macroscopic quantum electrodynamics (MQED), which, when applied to bounded objects in vacuum, formally requires an asymptotic limiting procedure to account for free-space radiation modes. To explicitly incorporate these modes from the outset, we employ the modified Langevin noise formalism (MLNF), which independently quantizes both the asymptotic scattering modes and the electromagnetic field generated by dissipative material sources. Utilizing an exact second-order Magnus expansion, we derive a closed-form, nonperturbative master formula for the transverse-momentum-resolved energy exchange probability. In the unilluminated regime, we demonstrate that at finite nanostructure temperatures, the vacuum scattering and thermal material fluctuations do not mathematically recombine into the total imaginary part of the dyadic Green's function. This breakdown does not violate the Fluctuation-Dissipation Theorem, because the explicit zero-temperature scattering field acts as an independent dynamical system that maintains the configuration out of global thermodynamic equilibrium. This fundamental separation reveals an intrinsic Stokes--Anti-Stokes asymmetry, yielding distinct transverse diffraction patterns for energy loss and thermal energy gain, and establishing a generalized detailed-balance relation that governs the radiative reduction of the apparent temperature in nanoscale electron thermometry. In the illuminated regime, our framework rigorously incorporates quantum-optical states into macroscopic dissipative electrodynamics, demonstrating that...", "url": "https://arxiv.org/abs/2611.15967", "type": "理论+数值", "summary": "快速电子和纳米结构之间的量子电动力学相互作用的理论描述通常依赖于标准宏观量子电动力学（MQED），当应用于真空中的有界物体时，形式上需要渐近限制程序来解释自由空间辐射模式。为了从一开始就明确地合并这些模式，我们采用了改进的朗之万噪声形式（MLNF），它独立地量化渐近散射模式和耗散材料源产生的电磁场。利用精确的二阶马格努斯展开式，我们推导出横向动量分辨能量交换概率的封闭式非微扰主公式。在未照明的情况下，我们证明在有限的纳米结构温度下，真空散射和热材料涨落在数学上不会重新组合成二进格林函数的总虚部。\n\n这种分解并不违反涨落耗散定理，因为显式零温度散射场充当独立的动力系统，维持整体热力学平衡之外的配置。这种基本分离揭示了固有的斯托克斯-反斯托克斯不对称性，产生能量损失和热能增益的独特横向衍射图案，并建立了控制纳米级电子测温中表观温度的辐射降低的广义详细平衡关系。在照明状态下，我们的框架严格地将量子光学态纳入宏观耗散电动力学，证明......", "authors": [{"name": "Alessandro Ciattoni"}], "featured_authors": [{"name": "Alessandro Ciattoni"}], "author_count": 1}, {"id": "2611.15977", "category": "quant-ph", "title": "Quantum geometric bounds and uncertainty relations for velocity variance and spread of Wannier function", "abstract": "By utilizing the derivation of quantum Cramér-Rao bound and an argument put forward by Efimov and Dodonov, we derive several uncertainty relations for mixed states that constrain the diagonal product, trace, and each diagonal element of the covariance matrix of multiple observables. By choosing the observables to be the symmetric logarithmic derivative, the uncertainty relations imply various geometric bounds on quantum Fisher information matrix caused by mean Uhlmann curvature, which in pure states become geometric bounds on quantum metric caused by Berry curvature. Our formalism reveals optical sum rules for velocity variance and spread of valence band Wannier functions, and how they are bounded by the Berry curvature and commutator of velocity operators. Canonical ensembles of spins, topological materials, common semiconductors, and transition metal dichalcogenides are used to verify these geometric bounds and uncertainty relations.", "url": "https://arxiv.org/abs/2611.15977", "type": "理论", "summary": "通过利用量子 Cramér-Rao 界的推导以及 Efimov 和 Dodonov 提出的论点，我们推导了混合态的几种不确定性关系，这些不确定性关系约束多个可观测量的协方差矩阵的对角积、迹和每个对角元素。通过选择可观测量为对称对数导数，不确定性关系意味着由平均乌尔曼曲率引起的量子费希尔信息矩阵上的各种几何界限，在纯态下成为由贝里曲率引起的量子度量上的几何界限。我们的形式主义揭示了速度方差和价带 Wannier 函数扩展的光学和规则，以及它们如何受到速度算子的贝里曲率和换向子的限制。自旋、拓扑材料、常见半导体和过渡金属二硫化物的规范系综用于验证这些几何边界和不确定性关系。", "authors": [{"name": "Felipe P. Abreu"}, {"name": "Luis F. Cárdenas-Castillo"}, {"name": "David Porlles"}, {"name": "Wei Chen"}], "featured_authors": [{"name": "Felipe P. Abreu"}, {"name": "Luis F. Cárdenas-Castillo"}, {"name": "David Porlles"}, {"name": "Wei Chen"}], "author_count": 4}, {"id": "2611.16016", "category": "quant-ph", "title": "Quantum Material Generation via Coherent Hamiltonian Search", "abstract": "Discovering new materials with targeted properties is a central goal of materials science, yet the space of candidates is vast. Data-driven generative models learn the distribution of known materials, but they extrapolate poorly, and a generated structure is not known to be stable. A material's properties follow from its Hamiltonian, and a quantum computer can calculate them from it. We introduce the quantum material generative algorithm (QMage), a coherent search, guided by the Hamiltonian, over crystalline configurations of atomic composition, unit cell structure, and atomic positions, for one whose calculated properties meet the targets to within a given error tolerance. The computation is a single coherent quantum circuit in which each configuration's Hamiltonian is block-encoded, its target eigenstate isolated and properties evaluated, and the satisfying configurations amplified by fixed-point search and measured. One framework covers many targets, from formation energy and band gaps to elasticity and conductivity. We design the algorithm for the mature fault-tolerant era and estimate its cost in logical qubits and Toffoli depth from a classically routine benchmark to targets where established methods are unreliable. The approach generates candidate materials from first principles, rather than generalizing from those known, and could enable materials discovery when the target properties are difficult to predict classically.", "url": "https://arxiv.org/abs/2611.16016", "type": "理论+数值", "summary": "发现具有目标特性的新材料是材料科学的中心目标，但候选材料的空间是巨大的。数据驱动的生成模型可以学习已知材料的分布，但它们的推断效果很差，并且生成的结构未知是否稳定。材料的属性源自其哈密顿量，量子计算机可以从中计算它们。我们引入了量子材料生成算法（QMage），这是一种由哈密顿量引导的相干搜索，针对原子组成、晶胞结构和原子位置的晶体构型，计算出的属性在给定的误差容限内满足目标。计算是单个相干量子电路，其中每个配置的哈密顿量被块编码，其目标本征态被隔离并评估属性，并且通过定点搜索放大和测量令人满意的配置。一个框架涵盖了许多目标，从形成能和带隙到弹性和电导率。\n\n我们为成熟的容错时代设计了算法，并从经典的常规基准到已建立的方法不可靠的目标，估计了逻辑量子位和 Toffoli 深度的成本。该方法根据第一原理生成候选材料，而不是根据已知材料进行概括，并且可以在目标特性难以经典预测时实现材料发现。", "authors": [{"name": "Jiang Yuhan"}, {"name": "Matthew Otten"}], "featured_authors": [{"name": "Jiang Yuhan"}, {"name": "Matthew Otten"}], "author_count": 2}, {"id": "2611.16080", "category": "quant-ph", "title": "TGen-SQD: Physics-Informed Transferable Configuration Generator for Sample-Based Quantum Diagonalization", "abstract": "Sample-based quantum diagonalization (SQD) avoids iterative variational circuit optimization, but its accuracy and cost depend on selecting a compact determinant subspace that captures the ground state. Existing machine-learning selectors use task-specific physical cues and typically retrain for each Hamiltonian. We introduce TGen-SQD, a physics-informed generator jointly trained across multiple Hamiltonians. It learns from configuration-interaction-weighted data and uses orbital- and system-level descriptors to guide generation. After training, its weights remain frozen for inference on seen and zero-shot geometries. On a 20-qubit H10 chain, TGen-SQD achieves mean energy errors of 40.18 +/- 1.52 and 43.97 +/- 1.20 mHa on seen and unseen geometries, respectively, 12.7% and 11.7% lower than the state-of-the-art PIGen-SQD baseline under matched shot and proposal budgets.", "url": "https://arxiv.org/abs/2611.16080", "type": "理论+数值", "summary": "基于样本的量子对角化（SQD）避免了迭代变分电路优化，但其准确性和成本取决于选择捕获基态的紧凑行列式子空间。现有的机器学习选择器使用特定于任务的物理线索，并且通常对每个哈密顿量进行重新训练。我们引入了 TGen-SQD，这是一种在多个哈密顿量之间联合训练的物理信息生成器。它从配置交互加权数据中学习，并使用轨道和系统级描述符来指导生成。训练后，其权重保持冻结状态，用于对可见几何和零样本几何进行推断。在 20 量子位 H10 链上，TGen-SQD 在可见和不可见的几何形状上分别实现了 40.18 +/- 1.52 和 43.97 +/- 1.20 mHa 的平均能量误差，比匹配镜头和提案预算下最先进的 PIGen-SQD 基线低 12.7% 和 11.7%。", "authors": [{"name": "Niloy Deb Roy Mishu"}, {"name": "Lei Jiang"}, {"name": "Mohsen Heidari"}, {"name": "Ruizhe Zhang"}, {"name": "Fan Chen"}], "featured_authors": [{"name": "Niloy Deb Roy Mishu"}, {"name": "Lei Jiang"}, {"name": "Mohsen Heidari"}, {"name": "Ruizhe Zhang"}, {"name": "Fan Chen"}], "author_count": 5}, {"id": "2611.16113", "category": "quant-ph", "title": "Testing Quantum Advantage in High-Frequency Trading with Market-Derived Nonlocal Games", "abstract": "Non-classical correlations enabled by entanglement could be exploited for distributed coordination tasks with communication constraints such as high-frequency trading in fragmented markets. However, previous studies have largely specified the game and its payoff structure theoretically, using toy market models without testing how well these models reflect observed market behavior. Here, we introduce market-derived nonlocal games, in which historical order-book data and backtests of joint actions determine the game's inputs and payoffs, rather than a prespecified idealized model. We start from classical trading strategies based on market considerations, using quantum correlations only to coordinate the agents' decisions. We compute exact classical optima and quantum upper bounds for the payoff. For games with a possible quantum advantage, we introduce an optimization algorithm to find explicit entangled strategies and end-to-end backtest them on historical data. We demonstrate the approach in a two-agent, three-stock cross-venue arbitrage setting. The game derived from the observed market data shows no resolved quantum-classical gap at the measured interaction scales. Controlled variations in liquidity competition and cross-stock repricing then show how the approach identifies regimes supporting quantum advantage, constructs explicit strategies, and tests whether their advantage survives end-to-end backtesting on modified historical market data.", "url": "https://arxiv.org/abs/2611.16113", "type": "理论+数值", "summary": "纠缠所实现的非经典相关性可用于具有通信限制的分布式协调任务，例如分散市场中的高频交易。然而，以前的研究很大程度上从理论上指定了游戏及其支付结构，使用玩具市场模型，而没有测试这些模型在多大程度上反映了观察到的市场行为。在这里，我们引入市场衍生的非本地博弈，其中历史订单数据和联合行动的回测决定博弈的投入和收益，而不是预先指定的理想化模型。我们从基于市场考虑的经典交易策略开始，仅使用量子相关性来协调代理的决策。我们计算精确的经典最优值和收益的量子上限。对于可能具有量子优势的游戏，我们引入了一种优化算法来找到显式的纠缠策略，并根据历史数据对其进行端到端回测。我们在两个代理、三个股票的跨场所套利环境中演示了该方法。从观察到的市场数据得出的博弈表明，在测量的相互作用尺度上没有解决量子经典差距。\n\n然后，流动性竞争和跨股票重新定价的受控变化表明该方法如何识别支持量子优势的制度，构建明确的策略，并测试其优势是否能够经受住修改后的历史市场数据的端到端回测。", "authors": [{"name": "Daiwei Zhu"}, {"name": "Brendan Pankovich"}, {"name": "Alireza Marefat Khah"}, {"name": "Haakam Aujla"}, {"name": "Ramis Movassagh"}, {"name": "Martin Roetteler"}, {"name": "Johannes Borregaard"}], "featured_authors": [{"name": "Daiwei Zhu"}, {"name": "Brendan Pankovich"}, {"name": "Alireza Marefat Khah"}, {"name": "Ramis Movassagh"}, {"name": "Martin Roetteler"}, {"name": "Johannes Borregaard"}], "author_count": 7}, {"id": "2611.16117", "category": "quant-ph", "title": "Quantum Control", "abstract": "Quantum Control is the art of steering the fragile dynamics of a quantum system in a precise way toward a desired final state or transformation. It is a cornerstone of many quantum technology applications and at the same time allows us to shed light on the fundamental connection between the energy structure and the time dynamics of quantum systems at the heart of some of the most interesting phenomena of quantum mechanics. In this chapter on quantum control, we introduce the control problem, go through basic error sources and methods to suppress these errors and then discuss state-of-the-art techniques to solve the control problem, like adiabatic methods, quantum optimal control and methods of machine learning.", "url": "https://arxiv.org/abs/2611.16117", "type": "数值", "summary": "量子控制是一门以精确的方式引导量子系统脆弱的动力学达到所需的最终状态或转变的艺术。它是许多量子技术应用的基石，同时使我们能够阐明量子系统的能量结构和时间动力学之间的基本联系，而量子系统是量子力学中一些最有趣的现象的核心。在量子控制这一章中，我们介绍控制问题，介绍基本误差源和抑制这些误差的方法，然后讨论解决控制问题的最先进技术，如绝热方法、量子最优控制和机器学习方法。", "authors": [{"name": "Matthias M. Müller"}, {"name": "Tommaso Calarco"}, {"name": "Felix Motzoi"}], "featured_authors": [{"name": "Matthias M. Müller"}, {"name": "Tommaso Calarco"}, {"name": "Felix Motzoi"}], "author_count": 3}, {"id": "2611.16365", "category": "quant-ph", "title": "Training quantum neural networks one job at a time", "abstract": "When a quantum processor is reached through a cloud queue, a variational algorithm pays for every round trip, and a single round trip can carry many circuits. The classical optimizer therefore decides how much is learned per job, not only per shot. We study this for a quantum neural network classifier. We compare optimizers that are given the same number of jobs and the same shots per job, and that differ only in how they fill each job. This comparison treats hybrid quantum-classical training as an execution-efficiency problem: how to obtain useful optimization progress from each costly interaction with a quantum processor. The resulting perspective connects optimizer design to overhead amortization and efficient use of accelerator resources. A direct port of a batched pattern search that worked for the quantum approximate optimization algorithm stalls once the model has a few dozen parameters. What does transfer is the principle behind it: fill each job with a batch of parameter vectors that is fixed before the job is sent. For circuits built from Pauli rotations the natural batch is the parameter-shift stencil. We show that its gradient error falls as the inverse of the shots per job, while the error of simultaneous-perturbation methods (SPSA) has a floor that no number of shots removes. In simulation, batched parameter-shift training needs between a fifth and a half of the jobs SPSA needs, for 24 to 48 parameters, and the ordering holds at two noise levels. A new structure-aware stencil search reads the same kind of rows as sinusoids and also beats SPSA. On IBM's ibm_fez processor, in three interleaved runs at six and eight qubits, the batched optimizer reached SPSA's final training loss within 4 to 20 of its 50 jobs. Its test accuracy was clearly higher at eight qubits; at six qubits the difference was not significant. All hardware numbers can be re-derived from the raw shots.", "url": "https://arxiv.org/abs/2611.16365", "type": "理论+数值", "summary": "当通过云队列到达量子处理器时，变分算法会为每次往返付费，并且单次往返可以承载许多电路。因此，经典优化器决定每个作业学习多少，而不仅仅是每个镜头。我们针对量子神经网络分类器进行了研究。我们比较了给予相同数量的作业和每个作业相同的镜头的优化器，不同之处仅在于它们如何填充每个作业。这种比较将混合量子经典训练视为执行效率问题：如何从与量子处理器的每次昂贵的交互中获得有用的优化进度。由此产生的观点将优化器设计与间接费用摊销和加速器资源的有效利用联系起来。一旦模型有几十个参数，适用于量子近似优化算法的批量模式搜索的直接端口就会停止。 Transfer是什么，其背后的原理是：用一批在作业发送之前固定的参数向量填充每个作业。对于从泡利旋转构建的电路，自然批次是参数移位模板。\n\n我们表明，它的梯度误差随着每个作业的发射次数的倒数而下降，而同时扰动方法（SPSA）的误差具有一个无法通过发射次数消除的下限。在模拟中，对于 24 到 48 个参数，批量参数转换训练需要的工作量是 SPSA 所需工作量的五分之一到一半，并且排序保持在两个噪声水平。新的结构感知模板搜索读取与正弦曲线相同类型的行，并且也击败了 SPSA。在 IBM 的 ibm_fez 处理器上，在 6 个和 8 个量子位的 3 次交错运行中，批处理优化器在 50 个作业中的 4 到 20 个作业中达到了 SPSA 的最终训练损失。八个量子位时其测试精度明显更高；在六个量子位上，差异并不显着。所有硬件数字都可以从原始镜头中重新得出。", "authors": [{"name": "Muhammad Faryad"}, {"name": "Rabab Alomairy"}], "featured_authors": [{"name": "Muhammad Faryad"}, {"name": "Rabab Alomairy"}], "author_count": 2}, {"id": "2611.16372", "category": "quant-ph", "title": "No Convergence in Learned Eavesdropping-Detection Dynamics for BB84 Quantum Key Distribution", "abstract": "In prior work we showed that a reinforcement-learning eavesdropper can intercept BB84 quantum key distribution while holding the quantum bit error rate below the abort threshold and keeping a usable distillable key. In this paper we ask whether an equally adaptive learning detector can close this stealth window. We cast the interaction as an alternating best-response game between a tabular eavesdropper and a tabular threshold-adapting detector. We measure exploitability, which is the detection rate and distillable key fraction achieved by a fresh attacker best-responding to the final detector. Across three learning rules (Q-Learning, SARSA, Double Q-Learning), three channel-noise levels, and a uniform false-alarm discipline, the dynamics do not settle out to twenty rounds. The exploitability does not approach a fixed point, and its round-to-round swings do not decay. Two controls, one retraining the attacker against a frozen defender and one retraining the defender against a frozen attacker, show that the swings on each side match the variance of the best-response procedure itself. The dynamics fluctuate at the scale of best-response variance rather than converging, with neither player settling to a fixed response. The behavior is noise-dependent, and the stealth window stays open at the low noise where practical QKD operates. The defender contains the attacker on average at intermediate noise without the contest settling, and at high noise the channel rather than the learned policy suppresses the attack. As a candidate mechanism we examine a last-mover information asymmetry, supported by significant anti-persistence at intermediate noise and consistent with best-response noise at low noise. The results suggest that a learned detector cannot be certified from any single round, and that closing the window calls for breaking the information structure rather than out-adapting the attacker.", "url": "https://arxiv.org/abs/2611.16372", "type": "理论", "summary": "在之前的工作中，我们表明强化学习窃听者可以拦截 BB84 量子密钥分发，同时将量子误码率保持在中止阈值以下并保留可用的可提取密钥。在本文中，我们询问同样自适应的学习检测器是否可以关闭这个隐形窗口。我们将交互视为表格窃听者和表格阈值自适应检测器之间的交替最佳响应游戏。我们测量可利用性，即对最终检测器做出最佳响应的新攻击者所实现的检测率和可提取的关键部分。在三种学习规则（Q-Learning、SARSA、Double Q-Learning）、三种通道噪声级别和统一的误报规则中，动态不会稳定到二十轮。可利用性不会接近固定点，其逐轮波动不会衰减。两种控制，一种是重新训练攻击者对抗冻结的防守者，另一种是重新训练防守者对抗冻结的攻击者，表明每一侧的波动与最佳响应程序本身的方差相匹配。\n\n动态在最佳响应方差的范围内波动而不是收敛，两个玩家都没有达到固定的响应。该行为与噪声相关，并且隐形窗口在实际 QKD 运行的低噪声下保持打开状态。防御者平均在中等噪声下遏制攻击者而不会解决竞争，而在高噪声下，通道而不是学习的策略会抑制攻击。作为一种候选机制，我们检查了最后推动者信息不对称性，该信息不对称性由中间噪声下的显着反持久性支持，并且与低噪声下的最佳响应噪声一致。结果表明，学习的检测器无法通过任何单轮验证，并且关闭窗口需要破坏信息结构而不是超越攻击者。", "authors": [{"name": "Ramon Jose C. Bagunu"}], "featured_authors": [{"name": "Ramon Jose C. Bagunu"}], "author_count": 1}, {"id": "2611.16398", "category": "quant-ph", "title": "Loss of the quadratic speedup in Grover search under local and coherent noise", "abstract": "Grover's algorithm searches an unstructured database with a number of oracle queries that grows only as the square root of its size. Noise erodes this advantage, and we ask, analytically, how quickly. When a depolarizing channel acts on the whole register after every gate layer, it commutes with the gates, and the noisy state is the noiseless one with a coherent weight that decays geometrically with depth. The Grover rotation is not slowed. Its weight decays, the best stopping point moves earlier, and the expected query cost keeps its square-root scaling only while the accumulated noise over the circuit stays small. For independent errors on the qubits we show that the ideal Grover operator freezes any amplitude pushed out of the two-dimensional search plane. This gives the exact effect of a single error: phase flips do most damage early in the search, bit flips late, and combined errors at any time. For large databases it also reduces the noisy search to Bloch-type equations for the part of the state that stays in the plane, in which the algorithm is a rotation and the noise appears as leakage and dephasing. We derive the rates for bit-flip, phase-flip, depolarizing, and amplitude-damping noise and solve the equations. Local noise acts, to leading order, like a global channel strengthened by the number of qubits, so the tolerable error per qubit falls faster than the inverse square root of the database size by one power of the register size. For coherent errors in the rotation angle we bound the success probability by a band that widens linearly with depth. Our results recover, in closed form, scalings found earlier for particular noise models, and they explain why some errors are more harmful than others.", "url": "https://arxiv.org/abs/2611.16398", "type": "理论+数值", "summary": "Grover 的算法使用大量 Oracle 查询来搜索非结构化数据库，这些查询仅按其大小的平方根增长。噪音会侵蚀这一优势，我们分析地问，侵蚀的速度有多快。当去极化通道作用于每个门层之后的整个寄存器时，它与门交换，并且噪声状态是无噪声状态，其相干权重随深度呈几何衰减。格罗弗旋转并未减慢。它的权重衰减，最佳停止点移动得更早，并且预期查询成本仅在电路上的累积噪声保持较小的情况下保持其平方根缩放。对于量子位上的独立误差，我们表明理想的 Grover 算子会冻结从二维搜索平面推出的任何幅度。这给出了单个错误的确切影响：相位翻转在搜索早期造成最大损害，位翻转后期，以及任何时间的组合错误。对于大型数据库，它还减少了对留在平面中的状态部分的布洛赫型方程的噪声搜索，其中算法是旋转，噪声表现为泄漏和相移。\n\n我们推导出位翻转、相位翻转、去极化和幅度阻尼噪声的速率并求解方程。局部噪声按照前导顺序起作用，就像通过量子位数量增强的全局通道一样，因此每个量子位的可容忍错误比数据库大小的倒数平方根下降得更快，下降的速度是寄存器大小的一个幂。对于旋转角度的相干误差，我们通过随深度线性加宽的频带来限制成功概率。我们的结果以封闭形式恢复了之前针对特定噪声模型发现的缩放比例，并且它们解释了为什么某些错误比其他错误更有害。", "authors": [{"name": "Imama Tul Birrah Khan"}, {"name": "Muhammad Faryad"}], "featured_authors": [{"name": "Imama Tul Birrah Khan"}, {"name": "Muhammad Faryad"}], "author_count": 2}, {"id": "2611.16435", "category": "quant-ph", "title": "Circuit-Level Analysis of Quantum Error Correction in Second-Generation Quantum Repeaters", "abstract": "We present a circuit-level simulation of second-generation quantum repeaters with stabilizer-based quantum error correction. We model a two-segment repeater link including encoding, syndrome extraction, decoding, and entanglement swapping, and compare the performance of the single-error-correcting Steane and five-qubit stabilizer codes under different noise scenarios. To that extent, we consider noise sources with incoherent (depolarizing and dephasing) and coherent (systematic over-rotation) errors and incorporate them directly at the circuit level. While the Steane code outperforms the five-qubit code at coherent errors, the five-qubit code achieves higher end-to-end fidelities under incoherent noise in the low-noise regime when a large number of physical qubits is affected by it. At higher noise regimes, employing no code turns out to be the best option. In mixed noise scenarios, we observe moderate cross-effects between the noise classes regarding the error correction performance. We conclude that code selection in second-generation quantum repeaters must be adapted to the dominant physical noise mechanism and that circuit complexity and hardware-aware implementation options influence performance in coherent-error-dominated regimes, providing design insights for error correction in quantum repeaters.", "url": "https://arxiv.org/abs/2611.16435", "type": "理论+数值", "summary": "我们提出了具有基于稳定器的量子纠错的第二代量子中继器的电路级仿真。我们对两段中继器链路进行建模，包括编码、校正子提取、解码和纠缠交换，并比较单纠错 Steane 和五量子位稳定器代码在不同噪声场景下的性能。在这个意义上，我们考虑具有不相干（去极化和相移）和相干（系统过度旋转）误差的噪声源，并将它们直接合并到电路级。虽然 Steane 代码在相干误差方面优于五量子位代码，但当大量物理量子位受到影响时，五量子位代码在低噪声区域的非相干噪声下实现了更高的端到端保真度。在较高噪声情况下，不使用代码被证明是最佳选择。在混合噪声场景中，我们观察到噪声类别之间关于纠错性能的适度交叉影响。\n\n我们得出的结论是，第二代量子中继器中的代码选择必须适应主要的物理噪声机制，并且电路复杂性和硬件感知的实现选项会影响相干误差主导体系中的性能，从而为量子中继器中的纠错提供设计见解。", "authors": [{"name": "Suraj Vishwanath"}, {"name": "Jonas Hawellek"}, {"name": "Roberto Ferrara"}, {"name": "Christian Deppe"}], "featured_authors": [{"name": "Suraj Vishwanath"}, {"name": "Jonas Hawellek"}, {"name": "Roberto Ferrara"}, {"name": "Christian Deppe"}], "author_count": 4}, {"id": "2611.16474", "category": "quant-ph", "title": "Symmetry and quasi-gauge invariance of Krylov complexity", "abstract": "Krylov spread complexity quantifies how extensively a quantum system explores its Hilbert space during time evolution. We identify two classes of unitary transformations that preserve the complexity of the associated dynamics, and relate this property to the invariance of the energy distribution of the initial state and of its associated Hamiltonian moments. These transformations are either symmetry operator of the Hamiltonian, or local $U(1)$ transformations of which the initial state is an eigenstate. The latter naturally arise as quasi-gauge transformations in chiral continuous-time quantum walks, to which the invariance properties are applied. We show that chiral phases in circulant Hamiltonians generically lift spectral degeneracies, leading to a discontinuous change in the long-time-averaged complexity. For a localized initial states and a nondegenerate spectrum, complexity is $\\bar{C}=(D-1)/2$, where $D$ is the Hilbert-space dimension, independently of the degree of connectivity. A non-circulant quantum router illustrates the additional role of phase-dependent spectral weights. These examples show that Krylov complexity can change even when probability time-reversal symmetry is preserved, linking its response to chirality to spectral changes rather than directly to transport asymmetry.", "url": "https://arxiv.org/abs/2611.16474", "type": "理论", "summary": "克雷洛夫扩展复杂性量化了量子系统在时间演化过程中探索其希尔伯特空间的范围。我们确定了两类酉变换，它们保留了相关动力学的复杂性，并将此属性与初始状态及其相关哈密顿矩的能量分布的不变性联系起来。这些变换要么是哈密顿量的对称算子，要么是初始状态是本征态的局部 $U(1)$ 变换。后者自然地作为手性连续时间量子行走中的准规范变换而出现，其中应用了不变性。我们表明，循环哈密顿量中的手性相通常会提升谱简并性，导致长期平均复杂度的不连续变化。对于局部初始状态和非简并谱，复杂度为 $\\bar{C}=(D-1)/2$，其中 $D$ 是希尔伯特空间维度，与连通度无关。非循环量子路由器说明了相位相关光谱权重的附加作用。\n\n这些例子表明，即使保留概率时间反转对称性，克雷洛夫复杂度也会发生变化，将其对手性的响应与光谱变化联系起来，而不是直接与传输不对称联系起来。", "authors": [{"name": "Edoardo Ferretti"}, {"name": "Matteo G. A. Paris"}, {"name": "Claudia Benedetti"}], "featured_authors": [{"name": "Edoardo Ferretti"}, {"name": "Matteo G. A. Paris"}, {"name": "Claudia Benedetti"}], "author_count": 3}, {"id": "2611.16479", "category": "quant-ph", "title": "Quantum Mpemba effect from logical-information exposure in monitored circuits", "abstract": "In the Mpemba effect, a state initially farther from stationarity overtakes one that starts closer. After one cycle in a monitored Clifford chain, an unencoded Bell-pair state has lower mean entanglement entropy than a scrambled reference prepared from fewer pairs. The gap grows linearly with chain length. This reversal is driven by logical-information exposure: a stabilizer state loses one ebit per independent logical parity resolved by the record. Scrambling within each half can spread this information over many sites while preserving every Schmidt coefficient. We prove that with independent exact unitary two-design encoders, any pure reference ensemble with no greater mean initial entropy can lead in mean entropy by at most two ebits at any time. If the stationary entropy is subextensive, the unencoded reversal is a quantum Mpemba effect at large sizes. We further certify this effect at 128 and 256 qubits using stationary-entropy bounds.", "url": "https://arxiv.org/abs/2611.16479", "type": "理论+数值", "summary": "在姆潘巴效应中，一开始离静止状态较远的状态会超越一开始离静止状态较近的状态。在受监控的克利福德链中的一个周期之后，未编码的贝尔对状态的平均纠缠熵低于由较少对准备的加扰参考。间隙随着链长度线性增长。这种逆转是由逻辑信息暴露驱动的：稳定器状态会因记录解析的每个独立逻辑奇偶校验而丢失一个 ebit。在每一半内进行加扰可以将该信息传播到许多站点，同时保留每个施密特系数。我们证明，使用独立的精确单一双设计编码器，任何没有更大平均初始熵的纯参考系综在任何时候都可以领先平均熵最多两个 ebit。如果稳态熵是次广延的，则未编码的反转是大尺寸下的量子 Mpemba 效应。我们使用固定熵界限进一步证明了 128 和 256 量子位的这种效应。", "authors": [{"name": "Bochen Huang"}, {"name": "D. L. Zhou"}, {"name": "Chenfeng Cao"}], "featured_authors": [{"name": "Bochen Huang"}, {"name": "D. L. Zhou"}, {"name": "Chenfeng Cao"}], "author_count": 3}, {"id": "2611.16519", "category": "quant-ph", "title": "Effect of atomic interactions on quantum communication protocols", "abstract": "We develop a first-principles framework for analyzing photonic quantum communication in an atomic medium. Starting from a real-space quantization of the electromagnetic field coupled to an ensemble of two-level atoms, we derive an effective model for polarization-encoded single-photon states. We apply this framework to superdense coding to study communication efficiency and to the BB84 quantum key distribution protocol for communication security. For superdense coding, we evaluate the protocol capacity of the fixed Bell-state alphabet under erasure, dephasing, and depolarizing channels and show that it decreases monotonically with increasing atom-field coupling. For BB84, we formulate a modified protocol that discards erasure outcomes and uses the microscopic model to estimate the intrinsic loss rate. We derive the corresponding asymptotic key rate and show that it decreases monotonically with coupling strength and vanishes beyond a finite critical coupling.", "url": "https://arxiv.org/abs/2611.16519", "type": "理论+数值", "summary": "我们开发了用于分析原子介质中的光子量子通信的第一原理框架。从耦合到两级原子系综的电磁场的实空间量子化开始，我们推导出偏振编码单光子态的有效模型。我们将该框架应用于超密集编码以研究通信效率，并应用于 BB84 量子密钥分发协议以确保通信安全。对于超密集编码，我们评估了固定贝尔态字母表在擦除、相移和去极化通道下的协议容量，并表明它随着原子场耦合的增加而单调下降。对于 BB84，我们制定了一个修改后的协议，丢弃擦除结果并使用微观模型来估计内在丢失率。我们推导了相应的渐近关键速率，并表明它随着耦合强度单调下降，并在超出有限临界耦合时消失。", "authors": [{"name": "Zixian Hong"}, {"name": "John C. Schotland"}], "featured_authors": [{"name": "Zixian Hong"}, {"name": "John C. Schotland"}], "author_count": 2}, {"id": "2611.16578", "category": "quant-ph", "title": "Asymptotic Attainability of the Channel RLD Fisher-Information Bound", "abstract": "The channel right-logarithmic-derivative (RLD) Fisher information is a computable upper bound on the optimal asymptotic symmetric-logarithmic-derivative (SLD) Fisher information per channel use over causally ordered, parameter-independent strategies. The bound is not always attained, even if the Choi matrix is positive definite. We determine exactly when equality holds using a semidefinite feasibility condition involving only the Choi matrix and its first derivative. The condition allows a degenerate largest eigenvalue of the RLD matrix and rank-deficient Choi matrices with derivatives supported on their range. The original channel family may change rank nearby. For generalized dephasing channels with a positive-definite correlation matrix at the evaluation point, the condition becomes a system of linear equations for nonnegative certificate weights that sum to one. At a completely dephasing point we also calculate the optimal SLD information for every finite number of uses and show that a repeated, ancilla-free probe attains it, even against adaptive strategies. Explicit examples give an unbounded ratio of the channel RLD information to the optimal asymptotic SLD information per use, either as the dimension grows or at fixed qubit dimension as the smallest Choi eigenvalue tends to zero. We derive the equality criterion and its consequences from the asymptotic optimization of Zhou and Jiang.", "url": "https://arxiv.org/abs/2611.16578", "type": "理论+数值", "summary": "通道右对数导数 (RLD) Fisher 信息是每个通道在因果排序、
