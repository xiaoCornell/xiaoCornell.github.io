"}, {"name": "J. Oller-Iscar"}, {"name": "M.M. Conde"}, {"name": "J. Ramírez"}, {"name": "S. Blazquez"}, {"name": "E. Sanz"}], "featured_authors": [{"name": "M. Camarillo"}, {"name": "J. Oller-Iscar"}, {"name": "M.M. Conde"}, {"name": "J. Ramírez"}, {"name": "S. Blazquez"}, {"name": "E. Sanz"}], "author_count": 6}, {"id": "2611.15845", "category": "cond-mat", "title": "Potts Order Preempts Emergence of 2-Form U(1) Spin Liquidity in Three-Dimensional Spin Vorticity Models", "abstract": "Three-dimensional (3D) spin vorticity models (SVMs) have been proposed to realize an exotic 2-form U(1) classical spin liquid (CSL), characterized by a zero-curl constraint, string excitations, and deconfined fluctuating membranes. A previous numerical study [PRB 111, 064417 (2025)] uncovered a puzzle in the pyrochlore lattice SVM: despite exhibiting pinch points characteristic of a U(1) spin liquid, it also develops weak all-in--all-out (AIAO) order. Here, we show that the emergence of the 2-form CSL in 3D SVMs is preempted by an intrinsic instability towards entropy-driven height locking. We establish this by resolving the ground state constraints using a height mapping, which we further relate to a 3-state Potts antiferromagnet. This identifies the pyrochlore's weak AIAO order as permutationally symmetric sublattice (PSS) order, albeit with an exceptionally weak locking strength. We extend the SVM to lattices of corner-sharing octahedra and cubes, where we identify the alternative broken-sublattice-symmetry (BSS) order, a hidden order without magnetic Bragg peaks coexisting with collective paramagnetism. All three models undergo a 3D Ising transition consistent with a symmetry-allowed locking potential in the coarse-grained height theory. The spin liquid persists over intermediate length and temperature scales, but a critical Coulomb ground state ensemble fails to materialize, its correlations cut off by the finite locking length. These findings illustrate how microscopic constraints can determine the ultimate stability of emergent gauge theories in frustrated spin systems.", "url": "https://arxiv.org/abs/2611.15845", "type": "理论+数值", "summary": "三维 (3D) 自旋涡度模型 (SVM) 已被提出来实现奇异的 2 型 U(1) 经典自旋液体 (CSL)，其特征在于零旋度约束、弦激励和去限制波动膜。之前的一项数值研究 [PRB 111, 064417 (2025)] 揭示了烧绿石晶格 SVM 中的一个难题：尽管表现出 U(1) 自旋液体的夹点特征，但它也产生了弱全进全出 (AIAO) 顺序。在这里，我们证明了 3D SVM 中 2 型 CSL 的出现被熵驱动高度锁定的内在不稳定性所取代。我们通过使用高度映射解决基态约束来建立这一点，我们进一步将其与三态 Potts 反铁磁体相关联。这将烧绿石的弱 AIAO 序识别为排列对称亚晶格 (PSS) 序，尽管锁定强度异常弱。我们将支持向量机扩展到共享角八面体和立方体的晶格，在那里我们确定了替代的破缺子晶格对称（BSS）阶数，这是一种没有与集体顺磁性共存的磁性布拉格峰的隐藏阶数。\n\n所有三个模型都经历了 3D Ising 转变，与粗粒度高度理论中允许对称的锁定势一致。自旋液体在中等长度和温度尺度上持续存在，但临界库仑基态系综未能实现，其相关性被有限的锁定长度切断。这些发现说明了微观约束如何决定受挫自旋系统中新兴规范理论的最终稳定性。", "authors": [{"name": "Michael D. Burke"}, {"name": "Mohid U. Farooqi"}, {"name": "Kristian Tyn Kai Chung"}, {"name": "Michel J. P. Gingras"}], "featured_authors": [{"name": "Michael D. Burke"}, {"name": "Mohid U. Farooqi"}, {"name": "Kristian Tyn Kai Chung"}, {"name": "Michel J. P. Gingras"}], "author_count": 4}, {"id": "2611.15851", "category": "cond-mat", "title": "Universal Theory of Strange and Bad Metals from Spatially Random Interactions with Underdamped Quantum-Critical Bosons", "abstract": "One of the most important challenges in condensed matter physics is understanding the macroscopic properties of strange metals, particularly why their resistivity remains linear in temperature over several decades. We propose that a (2+1)d theory of fermions coupled to underdamped quantum-critical bosons through a spatially disordered interaction provides this long-sought-after theoretical explanation. The key novelty of our work is to establish the appropriate separation of scales so that the bosons are underdamped. Using this framework, we obtain two distinct forms for the fermionic self-energy: a conformal-limit solution, $\\Sigma\\sim\\sqrt{\\omega}$, and a marginal Fermi-liquid solution, $\\Sigma\\sim\\omega\\log(1/\\omega)$, corresponding to regimes above and below the Mott-Ioffe-Regel limit, respectively. These solutions produce Planckian scattering, exhibit exact $T$-linear resistivity, $\\omega/T$ scaling in the optical conductivity, as well as $\\sim T\\log(1/T)$ heat capacity at low temperatures. Moreover, our theory naturally unifies strange- and bad-metal phenomena within a single framework, suggesting that we are now approaching a new epoch in understanding the physics of strongly correlated matter.", "url": "https://arxiv.org/abs/2611.15851", "type": "理论", "summary": "凝聚态物理学最重要的挑战之一是了解奇怪金属的宏观性质，特别是为什么它们的电阻率在几十年内保持与温度呈线性关系。我们提出，通过空间无序相互作用与欠阻尼量子临界玻色子耦合的费米子 (2+1)d 理论提供了这种长期寻求的理论解释。我们工作的关键新颖之处在于建立适当的尺度分离，以使玻色子阻尼不足。使用这个框架，我们获得了费米子自能的两种不同形式：共形极限解 $\\Sigma\\sim\\sqrt{\\omega}$ 和边际费米液体解 $\\Sigma\\sim\\omega\\log(1/\\omega)$，分别对应于高于和低于 Mott-Ioffe-Regel 极限的状态。这些解决方案产生普朗克散射，表现出精确的 $T$ 线性电阻率、$\\omega/T$ 光导率缩放，以及 $\\sim T\\log(1/T)$ 低温热容。\n\n此外，我们的理论自然地将奇怪的和坏的金属现象统一在一个框架内，这表明我们现在正在接近理解强相关物质物理学的新纪元。", "authors": [{"name": "Aaron Kleger"}, {"name": "Rufus Boyack"}], "featured_authors": [{"name": "Aaron Kleger"}, {"name": "Rufus Boyack"}], "author_count": 2}, {"id": "2611.15857", "category": "cond-mat", "title": "Crystalline Equivalence Principle for Anomalies", "abstract": "We develop a microscopic characterization of crystalline symmetry anomalies in bosonic lattice systems in (1+1) and (2+1) dimensions with a combination of crystalline and finite unitary internal symmetry. We construct anomaly indices of symmetry operators and derive their cocycle conditions and coboundary ambiguities. For generalized crystalline symmetries combining permutations of onsite Hilbert spaces with quantum cellular automata, anomaly indices take values in $H^3(B\\widetilde \\Gamma,U(1)_r)$ and $H^4(B\\widetilde \\Gamma,U(1)_r)$ respectively, where $\\widetilde \\Gamma$ is the total group of crystalline and internal symmetries, and the coefficient twist $r$ accounts for spatial orientation reversal. When crystalline symmetries act solely by permuting onsite Hilbert spaces, the anomaly classes restrict trivially to the spatial subgroup. These results establish a crystalline equivalence principle for bosonic anomalies at the microscopic level, without assuming a continuum description or emergent Lorentz invariance. We prove that a nontrivial total anomaly index obstructs any symmetric invertible phase. The framework incorporates modulated symmetries where spatial symmetries permute internal symmetries. Our results reproduce LSM and SPT--LSM constraints, with the latter illustrating how spectral-sequence differentials can trivialize candidate LSM anomaly indices.", "url": "https://arxiv.org/abs/2611.15857", "type": "理论", "summary": "我们结合晶体和有限酉内对称性，对 (1+1) 和 (2+1) 维玻色晶格系统中的晶体对称异常进行了微观表征。我们构造对称算子的异常指数并推导它们的共循环条件和共边界模糊度。对于将现场希尔伯特空间的排列与量子元胞自动机相结合的广义晶体对称性，异常指数分别采用 $H^3(B\\widetilde \\Gamma,U(1)_r)$ 和 $H^4(B\\widetilde \\Gamma,U(1)_r)$ 中的值，其中 $\\widetilde \\Gamma$ 是晶体和内部对称性的总组，系数扭曲 $r$ 说明空间方向逆转。当晶体对称性仅通过排列现场希尔伯特空间来起作用时，异常类简单地限制为空间子群。这些结果在微观水平上建立了玻色子异常的晶体等效原理，而不假设连续统描述或出现的洛伦兹不变性。我们证明，一个不平凡的总异常指数会阻碍任何对称可逆相位。\n\n该框架结合了调制对称性，其中空间对称性置换了内部对称性。我们的结果再现了 LSM 和 SPT--LSM 约束，后者说明了谱序列差异如何使候选 LSM 异常指数变得微不足道。", "authors": [{"name": "Ching-Yu Yao"}, {"name": "Ryohei Kobayashi"}], "featured_authors": [{"name": "Ching-Yu Yao"}, {"name": "Ryohei Kobayashi"}], "author_count": 2}, {"id": "2611.15863", "category": "cond-mat", "title": "Non-Bloch Topology of Frustrated Non-Hermitian Flat Bands", "abstract": "Frustrated lattices with exactly flat bands and compact localized states provide an ideal setting to uncover the topology of flat bands, leading to intriguing physics in two dimensions. Extending from Hermitian to non-Hermitian systems, however, band structures are drastically changed by the non-Hermitian skin effect, which is less well understood beyond one dimension. Here, we construct a broad class of two-dimensional frustrated non-Hermitian lattice models with exactly flat bands which can be naturally described in a non-Bloch band theory. Using non-Hermitian breathing Kagome and checkerboard models as illustrations, we reveal how flat bands acquire a basis-independent skin effect induced by the other bands; in the breathing Kagome model it appears exactly when the flat band enters the area spanned by the periodic-boundary spectra of the dispersive bands. A flat band becomes singular when its eigenvectors hold immovable discontinuities at band crossings. Such singularity in non-Hermitian systems is sensitive to boundary conditions and unprotected by band flatness. Non-Bloch topology underlying is uncovered in a bulk-boundary correspondence with the formation of a singular band touching in the bulk and a robust flat band skin mode on the boundary. We present a geometric approach to construct this boundary skin mode from a macroscopic sum of compact localized skin modes and trace its topological origin to two linearly independent noncontractible loop states on a non-Bloch torus. To characterize the correspondence, an invariant is proposed based on biorthogonal polarization of the zero-energy corner mode. Breaking exact flatness, we further realize nearly flat non-Bloch Chern bands.", "url": "https://arxiv.org/abs/2611.15863", "type": "理论", "summary": "具有精确平带和紧凑局域态的受抑晶格为揭示平带拓扑提供了理想的环境，从而产生了有趣的二维物理。然而，从厄米系统扩展到非厄米系统，能带结构因非厄米趋肤效应而发生了巨大的变化，而这一效应在一维之外却不太容易理解。在这里，我们构建了一类广泛的二维受挫非厄米格模型，其具有完全平坦的能带，可以在非布洛赫能带理论中自然地描述。使用非厄米呼吸 Kagome 和棋盘模型作为说明，我们揭示了平坦带如何获得由其他带引起的与基无关的集肤效应；在呼吸 Kagome 模型中，当平带进入色散带的周期边界谱所跨越的区域时，它恰好出现。当平带的特征向量在带交叉处具有不可移动的不连续性时，它就会变成奇异的。非厄米系统中的这种奇点对边界条件敏感并且不受能带平坦度的保护。\n\n底层的非布洛赫拓扑在体边界对应中被发现，与体中接触的奇异能带的形成和边界上的鲁棒平带趋肤模式有关。我们提出了一种几何方法，从紧凑局部趋肤模式的宏观总和构建这种边界趋肤模式，并将其拓扑起源追溯到非布洛赫环面上的两个线性独立的不可收缩环状态。为了表征对应关系，提出了基于零能量角模式的双正交偏振的不变量。打破精确的平坦度，我们进一步实现了几乎平坦的非布洛赫陈能带。", "authors": [{"name": "Fan Yang"}, {"name": "Jiong-Hao Wang"}, {"name": "Hui Liu"}, {"name": "Emil J. Bergholtz"}], "featured_authors": [{"name": "Fan Yang"}, {"name": "Jiong-Hao Wang"}, {"name": "Hui Liu"}, {"name": "Emil J. Bergholtz"}], "author_count": 4}, {"id": "2611.15872", "category": "cond-mat", "title": "Band geometry, Anderson's theorem, and vortex nucleation in unconventional 2D superconductors", "abstract": "Motivated by the recent discovery of chiral superconductors in 2d materials, we study the effects of disorder on superconductivity in materials with non-trivial band geometry. First, we show how Anderson's theorem and the conventional Abrikosov-Gorkov description of disorder-induced pair breaking are modified by the structure of the normal-state Bloch functions. We apply these results to twisted MoTe2 and show that a BCS pairing mechanism for the observed superconductor is in tension with the measured normal state residual resistivity. Second, we study whether random potential disorder can nucleate superconducting vortices in a chiral time- reversal-breaking superconductor. We show that, for a superconductor stabilized by the usual BCS mechanism, weak disorder does not induce a vortex glass phase, in contrast to superconductivity formed from an anyon fluid.", "url": "https://arxiv.org/abs/2611.15872", "type": "理论", "summary": "受最近在二维材料中发现手性超导体的启发，我们研究了非平凡能带几何材料中无序对超导性的影响。首先，我们展示安德森定理和无序引起的双断裂的传统 Abrikosov-Gorkov 描述如何通过正常状态 Bloch 函数的结构进行修改。我们将这些结果应用于扭曲的 MoTe2，并表明所观察到的超导体的 BCS 配对机制与测量的正常状态残余电阻率存在张力。其次，我们研究随机势紊乱是否可以使手性时间反转破断超导体中的超导涡旋成核。我们表明，对于通过通常的 BCS 机制稳定的超导体，弱无序不会引起涡旋玻璃相，这与任意子流体形成的超导性相反。", "authors": [{"name": "Vladislav Poliakov"}, {"name": "Inti Sodemann Villadiego"}, {"name": "T. Senthil"}], "featured_authors": [{"name": "Vladislav Poliakov"}, {"name": "Inti Sodemann Villadiego"}, {"name": "T. Senthil"}], "author_count": 3}, {"id": "2611.15896", "category": "cond-mat", "title": "U(1)-Symmetric Spin SYK Models: Ordering, Chaos, and Transport", "abstract": "The Sachdev--Ye--Kitaev (SYK) model provides an analytically controlled setting for strongly interacting quantum dynamics and holography, but its fermionic formulation leads to nonlocal encoding overheads on qubit-based quantum processors. We study a U(1)-symmetric spin analogue of the complex SYK model, constructed from random charge-conserving $q$-spin interactions that are native to a qubit Hilbert space. In the large-$N$, large-$q$ limit, the model reproduces the leading saddle-point structure of complex fermionic SYK under the identification of chemical potential with magnetic field and charge density with magnetization. We investigate the finite-$N$, finite-$q$ regime using exact diagonalization. A U(1)-invariant ordering susceptibility increases with system size for $q = 2, 4$ but decreases for $q = 6$, while bulk-spectrum level statistics are consistent with the Gaussian orthogonal ensemble at half filling and the Gaussian unitary ensemble in the adjacent magnetization sector. We further construct coupled-cluster chains and obtain domain-wall dynamics consistent with diffusive magnetization transport in a small-cluster regime accessible to matrix-product-state simulations. These results establish analytical benchmarks and finite-size signatures of ordering, quantum chaos, and magnetization transport in U(1)-symmetric spin-SYK models, and they motivate quantum simulation of the low-temperature, large-system regime, which remains difficult for classical methods.", "url": "https://arxiv.org/abs/2611.15896", "type": "理论+数值", "summary": "Sachdev--Ye--Kitaev (SYK) 模型为强相互作用的量子动力学和全息术提供了分析控制设置，但其费米子公式导致基于量子位的量子处理器上的非局域编码开销。我们研究了复杂 SYK 模型的 U(1) 对称自旋类似物，该模型是由量子位希尔伯特空间固有的随机电荷守恒 $q$-自旋相互作用构建的。在大$N$、大$q$极限下，该模型在用磁场识别化学势和用磁化强度识别电荷密度的情况下再现了复杂费米子SYK的主导鞍点结构。我们使用精确对角化研究有限-$N$、有限-$q$ 体系。当 $q = 2, 4$ 时，U(1) 不变的排序敏感性随着系统大小的增加而增加，但当 $q = 6$ 时则减少，而体谱水平统计与半填充时的高斯正交系综和相邻磁化扇区中的高斯酉系综一致。我们进一步构建了耦合簇链，并获得了与可进行矩阵产物状态模拟的小簇区域中的扩散磁化输运一致的畴壁动力学。\n\n这些结果在 U(1) 对称自旋-SYK 模型中建立了有序、量子混沌和磁化输运的分析基准和有限尺寸特征，并促进了低温大系统状态的量子模拟，这对于经典方法来说仍然很困难。", "authors": [{"name": "Shiyong Guo"}, {"name": "Enrico Rinaldi"}, {"name": "Jad C. Halimeh"}, {"name": "Brian Swingle"}], "featured_authors": [{"name": "Shiyong Guo"}, {"name": "Enrico Rinaldi"}, {"name": "Jad C. Halimeh"}, {"name": "Brian Swingle"}], "author_count": 4}, {"id": "2611.15927", "category": "cond-mat", "title": "Eigenvalue Crossings and Discontinuous BBP Transitions in Spiked Euclidean Random Matrices", "abstract": "We study the recovery of a rank-one signal embedded in a symmetric Euclidean random matrix, whose dense and geometrically correlated entries generally lack rotational invariance. We show that signal recovery through the leading eigenvector is governed by a competition between the principal directions of the noise and the signal. In particular, the signal may already be encoded in a subleading eigendirection, while remaining undetected by the leading principal component. As the signal strength increases, a crossing between competing eigenvalues can change their ordering, causing the leading eigenvector to switch abruptly from a noise-dominated to a signal-bearing direction. This mechanism gives rise to a discontinuous BBP-type transition, in which the overlap with the signal jumps from zero to a finite value. Using the replica method, we reduce the problem to a Fredholm eigenvalue equation and derive general criteria for the existence of a positive recovery threshold, expressed in terms of the unperturbed spectral edge, the spike mean and the spatial averages of the principal eigenfunctions. We obtain analytically the limiting largest eigenvalue, eigenvector-component distribution and signal overlap, and illustrate the results with explicit solutions for quadratic distance and rank-two kernels, finding excellent agreement with numerical diagonalisation.", "url": "https://arxiv.org/abs/2611.15927", "type": "理论+数值", "summary": "我们研究嵌入对称欧几里得随机矩阵中的一阶信号的恢复，该矩阵的密集且几何相关的条目通常缺乏旋转不变性。我们表明，通过主要特征向量的信号恢复是由噪声和信号的主方向之间的竞争决定的。特别地，信号可能已经在次主导本征方向上被编码，同时保持不被主导主成分检测到。随着信号强度的增加，竞争特征值之间的交叉会改变它们的顺序，导致主导特征向量突然从噪声主导方向切换到信号承载方向。这种机制会产生不连续的 BBP 型转变，其中与信号的重叠从零跳到有限值。使用复制方法，我们将问题简化为 Fredholm 特征值方程，并推导出存在正恢复阈值的一般标准，以未受扰动的谱边缘、尖峰均值和主特征函数的空间平均值表示。\n\n我们通过分析获得了极限最大特征值、特征向量分量分布和信号重叠，并用二次距离和二阶核的显式解说明了结果，发现与数值对角化非常一致。", "authors": [{"name": "Pasquale Casaburi"}, {"name": "Pierpaolo Vivo"}], "featured_authors": [{"name": "Pasquale Casaburi"}, {"name": "Pierpaolo Vivo"}], "author_count": 2}, {"id": "2611.15940", "category": "cond-mat", "title": "What Hall Measures in Strongly Correlated Metals", "abstract": "The Hall effect provides a sensitive probe of electronic correlations in strongly interacting metals, yet its microscopic interpretation beyond quasiparticle transport remains poorly understood. Here, we develop a Liouvillian formulation of the Hall conductivity that organizes the response into different classes of flux-sensitive many-body interference operators. Using a Schrieffer-Wolff transformation of the Hubbard model, we identify how projected charge motion and virtual hopping processes contribute to oriented trajectories enclosing magnetic flux. A high-temperature expansion reveals a hierarchy of inverse-temperature contributions associated with these interference processes. This framework provides a possible microscopic interpretation of the integer power laws previously observed in determinant quantum Monte Carlo calculations, which emerge at temperatures below the regime where the expansion is formally controlled. Our results highlight the sensitivity of Hall transport to coherent many-body dynamics and establish a connection between lattice geometry, electronic correlations, and transverse charge response.", "url": "https://arxiv.org/abs/2611.15940", "type": "理论+数值", "summary": "霍尔效应为强相互作用金属中的电子相关性提供了一种灵敏的探针，但其在准粒子输运之外的微观解释仍然知之甚少。在这里，我们开发了霍尔电导率的刘维尔公式，将响应组织成不同类别的通量敏感多体干涉算子。使用哈伯德模型的施里弗-沃尔夫变换，我们确定了投影电荷运动和虚拟跳跃过程如何有助于形成包围磁通量的定向轨迹。高温展开揭示了与这些干扰过程相关的反温度贡献的层次结构。该框架为先前在行列式量子蒙特卡罗计算中观察到的整数幂定律提供了可能的微观解释，该定律出现在低于正式控制膨胀的范围的温度下。我们的结果强调了霍尔传输对相干多体动力学的敏感性，并在晶格几何、电子相关性和横向电荷响应之间建立了联系。", "authors": [{"name": "Emily Z. Zhang"}, {"name": "Thomas P. Devereaux"}], "featured_authors": [{"name": "Emily Z. Zhang"}, {"name": "Thomas P. Devereaux"}], "author_count": 2}, {"id": "2611.15969", "category": "cond-mat", "title": "A New High $γ$-$γ'$ Fraction Polycrystalline Co/Ni Superalloy", "abstract": "An ingot-processable Co/Ni-based $\\gamma/\\gamma'$ superalloy has been developed for wrought parts in aircraft engines. An 8.5 kg VIM ingot was homogenised and hot rolled to a true strain of 1. A heat treatment was then developed to produce 50% $\\gamma'$ and a grain size of 142 $\\mu$m. High-temperature tensile testing showed yield strengths of 820 MPa at 700 $^\\circ$C, 785 MPa at 800 $^\\circ$C and 783 MPa at 850 $^\\circ$C. Creep tests at 750 $^\\circ$C/600 MPa and 800 $^\\circ$C/300 MPa demonstrated reduced minimum creep rates and extended rupture lives relative to current wrought Ni-base alloys. Oxidation at 800 $^\\circ$C for 100 h formed a 1 $\\mu$m dual chromia/alumina scale with minimal subsurface degradation. Long-term exposure at 800 $^\\circ$C for 8000 h showed limited $\\gamma'$ coarsening and no deleterious intermetallic or grain boundary phases. The alloy therefore offers a promising balance of processability, strength and oxidation resistance for high-temperature static and rotating this http URL grain boundary phases. The alloy therefore offers a promising balance of processability, strength and oxidation resistance for high-temperature static and rotating components.", "url": "https://arxiv.org/abs/2611.15969", "type": "理论", "summary": "一种可铸锭加工的 Co/Ni 基 $\\gamma/\\gamma'$ 超级合金已开发用于飞机发动机的锻造零件。将 8.5 kg V​​IM 锭均质化并热轧至真实应变为 1。然后进行热处理以产生 50% $\\gamma'$ 和 142 $\\mu$m 晶粒尺寸。高温拉伸测试显示，700 ℃时的屈服强度为 820 MPa，800 ℃时的屈服强度为 785 MPa，850 ℃时的屈服强度为 783 MPa。在 750 $^\\circ$C/600 MPa 和 800 $^\\circ$C/300 MPa 下进行的蠕变测试表明，相对于当前的锻造镍基合金，最小蠕变速率降低，断裂寿命延长。在 800 $^\\circ$C 下氧化 100 小时形成 1 $\\mu$m 双氧化铬/氧化铝氧化皮，且表面下降解最小。在 800 $^\\circ$C 下长期暴露 8000 小时，显示出有限的 $\\gamma'$ 粗化，并且没有有害的金属间或晶界相。因此，该合金为高温静态和旋转该 http URL 晶界相提供了可加工性、强度和抗氧化性的良好平衡。因此，该合金为高温静态和旋转部件提供了可加工性、强度和抗氧化性的良好平衡。", "authors": [{"name": "Cameron Crabb"}, {"name": "Mark C. Hardy"}, {"name": "Michelle S. Conroy"}, {"name": "David Dye"}], "featured_authors": [{"name": "Cameron Crabb"}, {"name": "Mark C. Hardy"}, {"name": "Michelle S. Conroy"}, {"name": "David Dye"}], "author_count": 4}, {"id": "2611.16033", "category": "cond-mat", "title": "Mott transitions in Dirac nodal-line semimetals", "abstract": "Nodal-line semimetals provide a natural setting to investigate how the geometry of a nodal manifold affects interaction-driven quantum phase transitions. Here, we study the Hubbard model on a cubic lattice supporting either nodal-point (cubic $\\pi$-flux model) or nodal-line semimetallic states using mean-field theory, determinant quantum Monte Carlo simulations, and a weak-coupling renormalization-group (RG) analysis. In both cases, antiferromagnetic order develops only above a finite interaction strength, with the nodal-line system exhibiting a smaller critical coupling due to its enhanced low-energy density of states and markedly stronger finite-size effects. For the nodal-point model, the quantum critical behavior is compatible with $(3+1)$-dimensional Gross--Neveu mean-field scaling. In contrast, the weak-coupling RG reveals that the nodal line itself is unstable against interactions: although the Hubbard interaction is perturbatively irrelevant, its second-order self-energy generates a symmetry-allowed relevant term proportional to $U^2\\cos k_z$, reconstructing the nodal line into isolated, strongly anisotropic nodal points. This weak-coupling reconstruction is distinct from the strong-coupling antiferromagnetic transition and highlights the role of nodal-manifold geometry in interacting semimetals.", "url": "https://arxiv.org/abs/2611.16033", "type": "理论+数值", "summary": "节点线半金属提供了一个自然的环境来研究节点流形的几何形状如何影响相互作用驱动的量子相变。在这里，我们使用平均场理论、行列式量子蒙特卡罗模拟和弱耦合重整化群 (RG) 分析，研究支持节点（立方 $\\pi$-通量模型）或节点线半金属态的立方晶格上的哈伯德模型。在这两种情况下，反铁磁序仅在有限相互作用强度之上发展，节点线系统由于其增强的低能量状态密度和明显更强的有限尺寸效应而表现出较小的临界耦合。对于节点模型，量子临界行为与 $(3+1)$ 维 Gross--Neveu 平均场标度兼容。相比之下，弱耦合RG揭示了节点线本身对于相互作用是不稳定的：尽管哈伯德相互作用是微扰无关的，但其二阶自能生成了一个与$U^2\\cos k_z$成比例的对称允许的相关项，将节点线重建为孤立的、强各向异性的节点。\n\n这种弱耦合重建与强耦合反铁磁转变不同，突出了节点流形几何在半金属相互作用中的作用。", "authors": [{"name": "Andressa R. Medeiros-Silva"}, {"name": "Lucas O. Lima"}, {"name": "Marcello B. da Silva Neto"}, {"name": "Fakher F. Assaad"}, {"name": "Natanael C. Costa"}], "featured_authors": [{"name": "Andressa R. Medeiros-Silva"}, {"name": "Lucas O. Lima"}, {"name": "Marcello B. da Silva Neto"}, {"name": "Fakher F. Assaad"}, {"name": "Natanael C. Costa"}], "author_count": 5}, {"id": "2611.16035", "category": "cond-mat", "title": "Phase Transitions of Polar Nematic Liquid Crystals Driven by Electrostatics and Flexoelectricity", "abstract": "Polar liquid crystals can exhibit a series of phases and phase transitions, from the conventional nematic phase at high temperature to a modulated nematic (antiferroelectric) phase at intermediate temperature, and then to a uniform polar (ferroelectric) phase at lower temperature. Here, we develop a theory for this phase behavior. The theory is based on a competition between flexoelectricity (which favors splay in the modulated phase) and electrostatics (which provides an energy penalty for splay). Minimizing the free energy leads to differential equations that describe the spatial variation of the director, the polar order, and the electric potential. By solving the differential equations numerically, we determine the structure of the antiferroelectric phase. At high temperature, the modulated structure is sinusoidal. At lower temperature, it crosses over to a structure of wide domains separated by narrow domain walls. These numerical solutions can be compared with simplified models that apply near the phase transitions.", "url": "https://arxiv.org/abs/2611.16035", "type": "理论+数值", "summary": "极性液晶可以表现出一系列相和相变，从高温下的传统向列相到中温下的调制向列相（反铁电），然后到较低温度下的均匀极性（铁电）相。在这里，我们开发了这种相行为的理论。该理论基于挠曲电（有利于调制阶段的展开）和静电（为展开提供能量损失）之间的竞争。最小化自由能导致微分方程描述指向矢、极序和电势的空间变化。通过数值求解微分方程，我们确定了反铁电相的结构。在高温下，调制结构为正弦曲线。在较低温度下，它会转变为由窄畴壁隔开的宽畴结构。这些数值解可以与相变附近应用的简化模型进行比较。", "authors": [{"name": "Lincoln Paik"}, {"name": "Jonathan V. Selinger"}], "featured_authors": [{"name": "Lincoln Paik"}, {"name": "Jonathan V. Selinger"}], "author_count": 2}, {"id": "2611.16196", "category": "cond-mat", "title": "Evidence of anisotropic surface state residual loss in UTe$_2$ amid isotropic low-energy excitations", "abstract": "We explore the pairing mechanism and possible topological properties of the unconventional superconductor UTe$_2$ through their influence on both the inductive and resistive channels using resonant cavity perturbation techniques. We measure a composite surface impedance for a variety of UTe$_2$ single crystals at microwave frequencies, where the inductive and resistive channels are comparable and can be treated on equal footing. By studying the composite electrodynamics for a large number of resonant modes, we are able to provide a comprehensive picture of the directional dependence of the excitations out of the ground state. We find similar power-law temperature dependencies at low-temperature for both the penetration depth and surface resistance, which in aggregate across modes, are quadratic and isotropic. On the other hand, we find a distinct and systematic anisotropy of the residual loss. The power-law results are inconsistent with a single pair of point nodes on the Fermi surface under weak scattering. We discuss the possibility of topological superconductivity as an interpretation of these isotropic power-laws in conjunction with the anisotropic residual loss.", "url": "https://arxiv.org/abs/2611.16196", "type": "理论", "summary": "我们利用谐振腔微扰技术，通过非常规超导体 UTe$_2$ 对电感和电阻通道的影响，探索其配对机制和可能的拓扑特性。我们在微波频率下测量了各种 UTe$_2$ 单晶的复合表面阻抗，其中电感通道和电阻通道具有可比性，可以同等对待。通过研究大量谐振模式的复合电动力学，我们能够全面了解基态激发的方向依赖性。我们发现穿透深度和表面电阻在低温下具有类似的幂律温度依赖性，它们在不同模式下聚合，是二次和各向同性的。另一方面，我们发现残余损失具有明显且系统的各向异性。幂律结果与弱散射下费米面上的一对点节点不一致。我们讨论拓扑超导作为这些各向同性幂律与各向异性剩余损耗的解释的可能性。", "authors": [{"name": "Arthur Carlton-Jones"}, {"name": "Jared Z. Dans"}, {"name": "Gicela Saucedo Salas"}, {"name": "Shanta R. Saha"}, {"name": "Johnpierre Paglione"}, {"name": "Nicholas P. Butch"}, {"name": "Steven M. Anlage"}], "featured_authors": [{"name": "Arthur Carlton-Jones"}, {"name": "Jared Z. Dans"}, {"name": "Gicela Saucedo Salas"}, {"name": "Johnpierre Paglione"}, {"name": "Nicholas P. Butch"}, {"name": "Steven M. Anlage"}], "author_count": 7}, {"id": "2611.16237", "category": "cond-mat", "title": "Anti-Kibble-Zurek behavior driven by dichotomous Markov noise in a quantum Ising chain: Generalized stochastic resonance in the defect density", "abstract": "The anti-Kibble-Zurek behavior may arise under noise, adding a noise-induced contribution to the defect density beyond the conventional Kibble-Zurek term. Most investigations of such behavior have so far been restricted to Gaussian noise. For Gaussian colored noise (GCN), the power spectrum dictates a monotonic variation of this term with the correlation time. Here, we focus on dichotomous Markov noise (DMN), a prototypical non-Gaussian colored noise, in the quantum Ising chain. We show that the noise-induced defect density, taken as the response function, exhibits generalized stochastic resonance: it is nonmonotonic in the correlation time, growing in the fast-noise regime and decreasing in the slow-noise regime. This resonance stems from the anomalous AKZ behavior in the slow-noise regime, where the DMN-induced trend is nonmonotonic, in contrast to the monotonic GCN case. The underlying mechanism lies in the sparse realizations of DMN in the slow-noise regime, a feature not captured by the power spectrum. Our work thereby reveals a fundamental distinction between Gaussian and non-Gaussian noises in the nonequilibrium critical quench dynamics of the quantum Ising chain.", "url": "https://arxiv.org/abs/2611.16237", "type": "理论", "summary": "反 Kibble-Zurek 行为可能会在噪声下出现，从而在传统的 Kibble-Zurek 项之外添加噪声引起的对缺陷密度的贡献。迄今为止，大多数对此类行为的研究仅限于高斯噪声。对于高斯有色噪声 (GCN)，功率谱指示该项随相关时间的单调变化。在这里，我们重点关注量子伊辛链中的二分马尔可夫噪声（DMN），一种典型的非高斯有色噪声。我们表明，作为响应函数的噪声引起的缺陷密度表现出广义随机共振：它在相关时间上是非单调的，在快噪声区域中增长，在慢噪声区域中减小。这种共振源于慢噪声状态下的异常 AKZ 行为，其中 DMN 引起的趋势是非单调的，与单调 GCN 情况相反。其根本机制在于慢噪声区域中 DMN 的稀疏实现，这是功率谱无法捕获的特征。因此，我们的工作揭示了量子伊辛链的非平衡临界淬灭动力学中高斯噪声和非高斯噪声之间的根本区别。", "authors": [{"name": "Mingwei Yang"}, {"name": "Peng Li"}], "featured_authors": [{"name": "Mingwei Yang"}, {"name": "Peng Li"}], "author_count": 2}, {"id": "2611.16247", "category": "cond-mat", "title": "Quantum Cost of Emptiness in a One-Dimensional Bose Gas", "abstract": "The probability $P_0(R)$ of an empty interval of radius $R$ probes the far tail of density fluctuations in the thermodynamic ground state of the repulsive Lieb--Liniger gas. Here $\\rho$ is the bulk density and $c$ the repulsion. As $\\ell = \\rho R \\to \\infty$ at fixed $\\gamma = c/\\rho > 0$, we find $-\\log P_0 = f(\\gamma)\\ell^2 + B(\\gamma)\\sqrt{\\ell} - \\frac{1}{4}\\log\\ell + O_\\gamma(1)$, with no linear term and $B = 2\\zeta(3/2)\\sqrt{f/(\\pi\\gamma)}$. Exact Gaussian completion of the auxiliary-field determinant reduces the leading collective response to an electrostatic slit problem, yielding $f(\\gamma)$ in elliptic integrals. Its dipole polarization tail drives auxiliary scattering returns whose local density saturates while the active rapidity range expands as $\\sqrt{R}$, producing the square-root boundary cost. The full return spectrum and the occupied-rapidity endpoints together fix the $-1/4$ logarithmic coefficient. Through the contact identity, widening the void probes a dense healing scale at the boundary whose growing characteristic occupation supports an emergent classical-field description even in a strongly interacting bulk.", "url": "https://arxiv.org/abs/2611.16247", "type": "理论", "summary": "半径为 $R$ 的空区间的概率 $P_0(R)$ 探测排斥性 Lieb-Liniger 气体热力学基态中密度涨落的远尾。这里 $\\rho$ 是体积密度，$c$ 是斥力。由于 $\\ell = \\rho R \\to \\infty$ 在固定 $\\gamma = c/\\rho > 0$ 处，我们发现 $-\\log P_0 = f(\\gamma)\\ell^2 + B(\\gamma)\\sqrt{\\ell} - \\frac{1}{4}\\log\\ell + O_\\gamma(1)$，没有线性项且 $B = 2\\zeta(3/2)\\sqrt{f/(\\pi\\gamma)}$。辅助场行列式的精确高斯完成减少了对静电狭缝问题的主要集体响应，产生椭圆积分中的$f(\\gamma)$。其偶极子极化尾部驱动辅助散射返回，其局部密度饱和，而主动快速度范围扩大为 $\\sqrt{R}$，产生平方根边界成本。完整回波谱和占用速度端点共同确定了 $-1/4$ 对数系数。通过接触恒等式，扩大空隙在边界处探测密集的愈合尺度，即使在强相互作用的体块中，其不断增长的特征占据也支持新兴的经典场描述。", "authors": [{"name": "Bin Huang"}, {"name": "Ziyan Zhu"}], "featured_authors": [{"name": "Bin Huang"}, {"name": "Ziyan Zhu"}], "author_count": 2}, {"id": "2611.16249", "category": "cond-mat", "title": "Noninvertible Lieb-Schultz-Mattis Constraints and Deconfined Criticality", "abstract": "We derive Lieb-Schultz-Mattis theorems for one-dimensional qudit systems with a class of internal noninvertible symmetries implemented by bilinear phase map operators. We show that any Hamiltonian preserving these symmetries together with translation or inversion symmetry must either be gapless or have degenerate ground states. Unlike conventional LSM constraints based on projective representations, these new constraints arise from nontrivial algebraic relations between the internal and crystalline symmetries. We illustrate this mechanism in a $\\mathbb{Z}_4$ qudit model hosting two competing phases that spontaneously break the internal noninvertible symmetry and inversion symmetry, respectively. Numerical simulations reveal a direct continuous transition between these phases, realizing a stable deconfined quantum critical point involving an internal noninvertible symmetry.", "url": "https://arxiv.org/abs/2611.16249", "type": "理论+数值", "summary": "我们推导了一维 qudit 系统的 Lieb-Schultz-Mattis 定理，该系统具有由双线性相图算子实现的一类内部不可逆对称性。我们证明，任何保持这些对称性以及平移或反演对称性的哈密顿量必须是无间隙的或具有简并基态。与基于射影表示的传统 LSM 约束不同，这些新约束源自内部对称性和晶体对称性之间的非平凡代数关系。我们在 $\\mathbb{Z}_4$ qdit 模型中说明了这种机制，该模型包含两个竞争相，分别自发地打破内部不可逆对称性和反演对称性。数值模拟揭示了这些相之间的直接连续转变，实现了涉及内部不可逆对称性的稳定的解禁量子临界点。", "authors": [{"name": "Linhao Li"}, {"name": "Zhen Bi"}], "featured_authors": [{"name": "Linhao Li"}, {"name": "Zhen Bi"}], "author_count": 2}, {"id": "2611.16266", "category": "cond-mat", "title": "Studying temperature-induced decrease of spontaneous polarization in PbTiO$_3$ from vibrational amplitude", "abstract": "PbTiO$_3$ is a typical ferroelectric polarization induced negative thermal expansion (NTE) material at a wide range of temperature. The elegant TiO$_6$ octahedron is used to study the polarization and NTE, whereas lacking its quantitative characterization. In this work, we propose a concise projection of vibrational amplitude to describe anisotropic distortion of atoms with temperature based on $ab$ $initio$ molecular dynamics simulations. We find that the huge negative mode Grüneisen coefficient is mainly from the different vibrational modes of the TiO$_6$ octahedral rotation at two boundary symmetry points in tetragonal phase along $c$ direction. The potential energy surface as a function of amplitude suggests the $c$-axis compression facilitates the TiO$_6$ octahedral rotation. We show that the vibrational mode of TiO$_6$ octahedral rotation around negative-expansion axis can promote spontaneous polarization reduction with increasing temperature, making transformation of PbTiO$_3$ from tetragonal to cubic phase occur, via the projected amplitude, potential energy surface, and forces of individual atoms.", "url": "https://arxiv.org/abs/2611.16266", "type": "理论+数值", "summary": "PbTiO$_3$是一种典型的宽温度范围内铁电极化引起的负热膨胀（NTE）材料。优雅的 TiO$_6$ 八面体用于研究偏振和 NTE，但缺乏其定量表征。在这项工作中，我们基于 $ab$ $initio$ 分子动力学模拟提出了一种简明的振动幅度投影来描述原子随温度的各向异性变形。我们发现巨大的负模Grüneisen系数主要来自于沿$c$方向四方相两个边界对称点处TiO$_6$八面体旋转的不同振动模式。势能面作为振幅的函数表明 $c$ 轴压缩有利于 TiO$_6$ 八面体旋转。我们发现，TiO$_6$ 八面体绕负膨胀轴旋转的振动模式可以随着温度的升高促进自发极化减少，通过投影振幅、势能面和单个原子的力，使 PbTiO$_3$ 从四方相转变为立方相。", "authors": [{"name": "Zhikai Gao"}, {"name": "Yuanji Xu"}, {"name": "Fuyang Tian"}], "featured_authors": [{"name": "Zhikai Gao"}, {"name": "Yuanji Xu"}, {"name": "Fuyang Tian"}], "author_count": 3}, {"id": "2611.16325", "category": "cond-mat", "title": "Optimal staircase structure for bacterial adaptation in antibiotic landscapes", "abstract": "Spatial heterogeneity in antibiotic environments drives the evolution of bacterial resistance. However, how the discrete structure of these environments controls the time required for adaptation of bacteria remains unclear. We study this question using a stochastic model on a two-dimensional lattice whose axes represent physical space and phenotype space, comparing different numbers of steps while holding the overall spatial and concentration ranges fixed and scaling the migration and mutation rates by their end-to-end first-passage times. We find that increasing the number of steps accelerates the search for the next adapted state but increases the cumulative cost of repeated population saturation; this competition can produce an optimum at an intermediate number of steps. Direct Gillespie simulations reproduce the predicted dependence of the adaptation time on the number of steps, providing testable predictions for how discrete environmental structure shapes the timescale of evolutionary adaptation.", "url": "https://arxiv.org/abs/2611.16325", "type": "理论+数值", "summary": "抗生素环境中的空间异质性推动了细菌耐药性的进化。然而，这些环境的离散结构如何控制细菌适应所需的时间仍不清楚。我们使用二维晶格上的随机模型来研究这个问题，二维晶格的轴代表物理空间和表型空间，比较不同的步骤数，同时保持整体空间和浓度范围固定，并通过端到端的首次传代时间来缩放迁移和突变率。我们发现增加步数会加速寻找下一个适应状态，但会增加重复种群饱和的累积成本；这种竞争可以在中间数量的步骤中产生最佳结果。直接吉莱斯皮模拟再现了适应时间对步数的预测依赖性，为离散环境结构如何塑造进化适应的时间尺度提供了可测试的预测。", "authors": [{"name": "Kento Matsukawa"}, {"name": "Shin-ichi Sasa"}, {"name": "Namiko Mitarai"}], "featured_authors": [{"name": "Kento Matsukawa"}, {"name": "Shin-ichi Sasa"}, {"name": "Namiko Mitarai"}], "author_count": 3}, {"id": "2611.16383", "category": "cond-mat", "title": "Continuous-Time Random Walks with Internal Stochastic Renewal Process", "abstract": "We introduce a continuous-time random walk process via a structured density by tracking the state of the particle as the system evolves. Whenever the particle makes a jump, its internal state either increases by one or resets to zero, so that the internal state evolves according to a renewal process. A wide range of governing integro-differential equations may be obtained from this formulation, some of which exhibit various types of anomalous behaviour. For certain choices of reset probabilities, waiting times and jump distributions, we explicitly derive the mode-dependent memory kernels and investigate their continuum limits. The framework can recover the time-and-space-fractional Fokker-Planck equation, which traditionally models the interplay between long wait times and large jumps and exhibits anomalous diffusion. Furthermore, we obtain a process which converges toward the equilibrium distribution as time approaches some finite value through a sequence of waiting times which decrease geometrically. Finally, we investigate a process that incorporates self-excitation and self-inhibition into the waiting times for each state to produce a mean square displacement proportional to $t^\\nu$ for any $\\nu > 0$. Through these examples, we illustrate the link between the microscopic mechanisms in these processes and their non-local macroscopic governing equations.", "url": "https://arxiv.org/abs/2611.16383", "type": "理论", "summary": "我们通过跟踪系统演化过程中粒子的状态，通过结构化密度引入连续时间随机游走过程。每当粒子跳跃时，其内部状态要么增加1，要么重置为零，从而内部状态按照更新过程演变。从这个公式中可以获得广泛的控制积分微分方程，其中一些表现出各种类型的反常行为。对于重置概率、等待时间和跳转分布的某些选择，我们显式地推导了模式相关的内存内核并研究了它们的连续体限制。该框架可以恢复时空分数福克-普朗克方程，该方程传统上对长等待时间和大跳跃之间的相互作用进行建模，并表现出异常扩散。此外，我们通过一系列几何减少的等待时间，获得了一个随着时间接近某个有限值而收敛到平衡分布的过程。\n\n最后，我们研究了一个过程，该过程将自激励和自抑制合并到每个状态的等待时间中，以针对任何 $\\nu > 0$ 产生与 $t^\\nu$ 成比例的均方位移。通过这些例子，我们说明了这些过程中的微观机制与其非局部宏观控制方程之间的联系。", "authors": [{"name": "Boris Z. Huang"}], "featured_authors": [{"name": "Boris Z. Huang"}], "author_count": 1}, {"id": "2611.16387", "category": "cond-mat", "title": "Quantum geometry drives orbital paramagnetism in superconducting fluctuations", "abstract": "Superconductors expel magnetic fields through the Meissner effect. Even slightly above the superconducting transition temperature, electrons can briefly form Cooper pairs, leading to an orbital diamagnetic susceptibility that diverges as the transition is approached. In this work, we use Gaussian fluctuation theory to study a generic multicomponent superconductor above its transition temperature and show that fluctuations can instead produce a paramagnetic response. We identify two competing contributions: the usual diamagnetic contribution from the center-of-mass motion of Cooper pairs and a paramagnetic contribution from interference between different components of the superconducting order parameter. The latter is related to pair quantum geometry, which describes how the internal components of the Cooper pair change with momentum. We then apply our theory to a model of a kagome superconductor with two chiral pairing modes. When the parent state preserves time-reversal symmetry, the paramagnetic contribution can outweigh the conventional diamagnetic contribution, producing net fluctuation paramagnetism. However, when the orbital time-reversal symmetry is broken, e.g., by forming a weak loop-current order, the degeneracy between the two chiral modes is then lifted. Upon cooling toward the superconducting transition, the lower-energy mode dominates the fluctuations, and diamagnetism wins as single-component physics takes over. Our results provide a mechanism for fluctuation paramagnetism in superconductors and show that the orbital magnetic response can probe the quantum geometry of Cooper pairs.", "url": "https://arxiv.org/abs/2611.16387", "type": "理论", "summary": "超导体通过迈斯纳效应排出磁场。即使略高于超导转变温度，电子也可以短暂地形成库珀对，导致轨道抗磁化率随着接近转变而发散。在这项工作中，我们使用高斯涨落理论来研究高于其转变温度的通用多组分超导体，并表明涨落可以产生顺磁响应。我们确定了两个相互竞争的贡献：来自库珀对的质心运动的通常抗磁贡献和来自超导有序参数的不同分量之间的干扰的顺磁贡献。后者与量子对几何相关，描述了库珀对的内部成分如何随动量变化。然后，我们将我们的理论应用于具有两种手性配对模式的戈薇超导体模型。当母态保持时间反演对称性时，顺磁贡献可以超过传统的反磁贡献，产生净涨落顺磁性。\n\n然而，当轨道时间反演对称性被打破时，例如通过形成弱环流顺序，两种手性模式之间的简并性就会被解除。当冷却到超导转变时，低能模式主导波动，随着单组分物理学的接管，抗磁性获胜。我们的结果提供了超导体涨落顺磁性的机制，并表明轨道磁响应可以探测库珀对的量子几何结构。", "authors": [{"name": "Zi-Ting Sun"}, {"name": "Ying-Ming Xie"}, {"name": "Chunli Huang"}, {"name": "Naoto Nagaosa"}], "featured_authors": [{"name": "Zi-Ting Sun"}, {"name": "Ying-Ming Xie"}, {"name": "Chunli Huang"}, {"name": "Naoto Nagaosa"}], "author_count": 4}, {"id": "2611.16430", "category": "cond-mat", "title": "Multi-reference variational states resolve stripe selection and local $d$-wave pairing in the Hubbard model", "abstract": "Whether stripes compete with $d$-wave superconductivity or promote pairing through fluctuations remains unsettled in the two-dimensional Hubbard model. Using multi-reference neural variational auxiliary-field quantum Monte Carlo (MR-nVAFQMC) at $U/t=8$, we superpose unpaired Slater determinants across stripe periods and domain-wall positions, reaching variational energies competitive with leading benchmarks on periodic lattices up to $32\\times32$ sites. For cuprate next-nearest-neighbor hopping ($t'/t=-0.2$), diagonal hopping preserves electron-doped antiferromagnetism while kinetically frustrating hole motion into Yamada stripes with a dome of short-range connected $d$-wave pairing. At $1/8$ hole doping, hole delocalization across antiphase spin boundaries outweighs on-site repulsion, splitting the filled stripes of the pure model into half-filled walls with strong local pairing. Coherently delocalizing shifted walls strongly suppresses static charge modulation yet leaves short-range pairing unchanged, showing that local pairing is intrinsic to half-filled walls rather than driven by stripe fluctuations. Across intervening antiferromagnetic domains, however, pairing correlations become unresolved at one stripe period and beyond. Both parameter transfer to larger lattices without reoptimization and deep benchmark checkpoints retain stripe spin order without resolving long-range pairing, within uncertainties allowing weak superconductivity. Half-filled antiphase walls thus generate local $d$-wave pairs, whereas suppressing static stripe order alone yields no resolved coherence across stripes in the states studied.", "url": "https://arxiv.org/abs/2611.16430", "type": "理论+数值", "summary": "在二维哈伯德模型中，条纹是否与$d$波超导性竞争或通过涨落促进配对仍然悬而未决。使用 $U/t=8$ 的多参考神经变分辅助场量子蒙特卡罗 (MR-nVAFQMC)，我们在条纹周期和畴壁位置上叠加不成对的 Slater 行列式，达到与周期晶格上高达 $32\\times32$ 位点的领先基准相媲美的变分能量。对于铜酸盐次近邻跳跃（$t'/t=-0.2$），对角线跳跃保留了电子掺杂的反铁磁性，同时在动力学上抑制空穴运动进入具有短程连接的 $d$ 波配对圆顶的山田条纹。在 1/8$ 空穴掺杂时，跨反相自旋边界的空穴离域超过了现场排斥，将纯模型的填充条纹分裂成具有强局部配对的半填充壁。相干离域移动壁强烈抑制静电荷调制，但使短程配对保持不变，这表明局部配对是半填充壁固有的，而不是由条纹波动驱动的。\n\n然而，在中间的反铁磁域中，配对相关性在一个条带周期及更长的时间段内变得无法解决。两个参数都无需重新优化即可转移到更大的晶格，并且深度基准检查点可以在不解决长程配对的情况下保留条带自旋顺序，从而在允许弱超导性的不确定性范围内。因此，半填充反相壁会产生局部 $d$ 波对，而单独抑制静态条纹顺序不会在所研究的状态中产生跨条纹的解析相干性。", "authors": [{"name": "Honghui Shang"}, {"name": "Jinlong Yang"}], "featured_authors": [{"name": "Honghui Shang"}, {"name": "Jinlong Yang"}], "author_count": 2}, {"id": "2611.16528", "category": "cond-mat", "title": "Edge-scaling softening of a universal machine-learned potential: point-defect formation energies in a coronene graphene quantum dot", "abstract": "Universal machine-learning interatomic potentials (MLIPs) are increasingly used as computationally efficient surrogates for density functional theory (DFT) in high-throughput nanomaterials screening. Systematic softening has been reported for several universal MLIPs when high-energy and far-from-equilibrium configurations are underrepresented in training data. We examine how this behavior appears at under-coordinated edge sites in graphene quantum dots (GQDs), where a vacancy can have pronounced molecular-radical character. Using coronene (C$_{24}$H$_{12}$), a hexagonal GQD with $D_{6h}$ symmetry and three carbon classes, we benchmark SevenNet (7net-omni-i12) against spin-polarized PBE DFT (GPAW) for monovacancy, divacancy, and Stone-Wales defects. Beyond the full site- and bond-resolved landscapes, we perform a controlled matched-reconstruction comparison in which 28 vacancy and divacancy configurations are scored by both engines using self-consistent chemical-potential reservoirs. In this dataset, SevenNet underestimates all 28 vacancy and divacancy formation energies, and the mean deficit increases with under-coordination within each defect family: 0.30-0.74 eV for monovacancies and 0.65-1.11 eV for divacancies as the number of broken edge C-H bonds increases. By contrast, the mean Stone-Wales energies differ by only 0.013 eV. SevenNet also preserves the ordering of three hydrogen-dependent reconstruction basins and reproduces $D_{6h}$-equivalent sites to within a few meV. The within-class symmetry spread therefore provides a practical diagnostic of basin-sensitive relaxations. Within the present coronene benchmark, these results support MLIP-based structure screening and preliminary ranking, while absolute vacancy energies and multi-basin edge configurations still require DFT validation.", "url": "https://arxiv.org/abs/2611.16528", "type": "理论+数值", "summary": "通用机器学习原子间势 (MLIP) 越来越多地用作高通量纳米材料筛选中密度泛函理论 (DFT) 的计算高效替代品。据报道，当训练数据中高能和远离平衡构型的代表性不足时，几种通用 MLIP 会出现系统软化。我们研究了这种行为如何出现在石墨烯量子点（GQD）的欠配位边缘位点，其中空位可能具有明显的分子自由基特征。使用晕苯 (C$_{24}$H$_{12}$)（一种具有 $D_{6h}$ 对称性和三个碳类的六方 GQD，我们将 SevenNet (7net-omni-i12) 与自旋极化 PBE DFT (GPAW) 进行基准测试，以检测单空位、双空位和 Stone-Wales 缺陷。除了完整的位点和键解析景观之外，我们还进行了受控匹配重建比较，其中两个引擎使用自洽化学势库对 28 个空位和双空位配置进行评分。\n\n在此数据集中，SevenNet 低估了所有 28 个空位和双空位形成能，并且平均赤字随着每个缺陷族内的协调不足而增加：随着断裂边缘 C-H 键数量的增加，单空位为 0.30-0.74 eV，双空位为 0.65-1.11 eV。相比之下，平均 Stone-Wales 能量仅相差 0.013 eV。 SevenNet 还保留了三个依赖于氢的重建盆地的顺序，并将 $D_{6h}$ 等效位点复制到几 meV 以内。因此，类内对称性分布提供了对盆地敏感松弛的实用诊断。在目前的 Coronene 基准中，这些结果支持基于 MLIP 的结构筛选和初步排序，而绝对空位能和多盆边缘配置仍然需要 DFT 验证。", "authors": [{"name": "Andrii Tuzhykov"}, {"name": "Vladimir Soloviev"}, {"name": "Arnold Kiv"}, {"name": "Andrii Bielinskyi"}], "featured_authors": [{"name": "Andrii Tuzhykov"}, {"name": "Vladimir Soloviev"}, {"name": "Arnold Kiv"}, {"name": "Andrii Bielinskyi"}], "author_count": 4}, {"id": "2611.16532", "category": "cond-mat", "title": "Thermal and dynamical behaviors of the spin-nematic phases in a spin-1 triangular lattice", "abstract": "The triangular lattice compound Na$_2$BaNi(PO$_4$)$_2$ has been recently established as a strong candidate for realizing the spin-nematic physics. In this theoretical work, we study the finite-temperature properties and the dynamics of a spin-1 triangular lattice model, which reproduces the spin-nematic physics and provides insights relevant to the compound. We show that a small biquadratic interaction can be used for stabilizing the SN phases in the semiclassical approach with SU(3) coherent states, which allows for a mathematical parameterization of the spin-nematic wave functions. With a semiclassical Monte Carlo calculation, the finite temperature transitions into the spin-nematic phases are shown to be related to BKT transitions associated with the proliferation of half vortices in the original spin-1 model. Using quantum Monte Carlo calculations with a low-energy effective model, the phase boundaries are determined and found to agree qualitatively with the semiclassical analysis. Within the spin wave approach, the low-energy spin dynamics can be captured equally well by either the spin-1 model with a small biquadratic term, or the effective spin-$1/2$ model. The accidental degeneracy of the semiclassical approach at zero field is revealed by explicit analytical parameterization, and is shown to be associated with the pseudo-Goldstone mode observed in the spin dynamics.", "url": "https://arxiv.org/abs/2611.16532", "type": "理论+数值", "summary": "三角晶格化合物Na$_2$BaNi(PO$_4$)$_2$最近被确定为实现自旋向列物理的有力候选者。在这项理论工作中，我们研究了 spin-1 三角晶格模型的有限温度特性和动力学，该模型再现了自旋向列物理并提供了与该化合物相关的见解。我们证明，在具有 SU(3) 相干态的半经典方法中，小的双二次相互作用可用于稳定 SN 相位，这允许对自旋向列波函数进行数学参数化。通过半经典蒙特卡罗计算，进入自旋向列相的有限温度转变被证明与原始 spin-1 模型中半涡扩散相关的 BKT 转变有关。使用量子蒙特卡罗计算和低能有效模型，确定了相边界，并发现其与半经典分析定性一致。在自旋波方法中，低能自旋动力学可以通过具有小双二次项的 spin-1 模型或有效 spin-$1/2$ 模型同样好地捕获。\n\n通过显式分析参数化揭示了半经典方法在零场下的意外简并性，并显示出与自旋动力学中观察到的伪戈德斯通模式相关。", "authors": [{"name": "Lei Xu"}, {"name": "Zhentao Wang"}], "featured_authors": [{"name": "Lei Xu"}, {"name": "Zhentao Wang"}], "author_count": 2}, {"id": "2611.16535", "category": "cond-mat", "title": "Bulk CMSX-4 Single-Crystal Builds via Laser-Directed Energy Deposition: Epitaxial Stability and Microstructure Evolution", "abstract": "Single-crystal processing of Ni-based superalloys using laser-directed energy deposition (L-DED) is extremely challenging, given the interplay of a number of processing parameters. In this work, we develop strategies to maintain single-crystal growth in long cylindrical rod geometries by combining dynamic adjustment of laser power, informed by in-situ infrared thermal feedback, with a simulation-guided external cooling system. This combined approach ensures optimal heat extraction during additive manufacturing, maintaining near-steady-state conditions at the solidification interface and extending continuous epitaxial growth to nearly twice the build height achievable through process control alone. The developed strategy results in continuous single-crystal growth, as validated by electron backscatter diffraction (EBSD). The steady-state nature of solidification is revealed through the near-constant primary dendritic arm spacing. Further, the heat-treatment is optimized by reducing the solutionizing time (by 47\\%), resulting in faster eutectic dissolution. Comparison of the aged microstructures reveals a similar distribution of precipitates between the classical Bridgman- and L-DED-processed samples.", "url": "https://arxiv.org/abs/2611.16535", "type": "数值", "summary": "考虑到许多加工参数的相互作用，使用激光定向能量沉积 (L-DED) 对镍基高温合金进行单晶加工极具挑战性。在这项工作中，我们通过将原位红外热反馈信息的激光功率动态调整与模拟引导的外部冷却系统相结合，制定了维持长圆柱棒几何形状中单晶生长的策略。这种组合方法可确保增材制造过程中的最佳排热，在凝固界面保持接近稳态的条件，并将连续外延生长延伸至仅通过过程控制可实现的构建高度的近两倍。所开发的策略可实现连续的单晶生长，并通过电子背散射衍射 (EBSD) 进行了验证。凝固的稳态性质是通过近乎恒定的初级枝晶臂间距揭示的。此外，通过减少固溶时间（减少 47%）来优化热处理，从而实现更快的共晶溶解。\n\n老化微观结构的比较揭示了经典 Bridgman 和 L-DED 处理的样品之间析出物的相似分布。", "authors": [{"name": "Divya Nalajala"}, {"name": "Swapnil Bhure"}, {"name": "R. Ajithkannan"}, {"name": "Shubhang Galagali"}, {"name": "Abhik Choudhury"}], "featured_authors": [{"name": "Divya Nalajala"}, {"name": "Swapnil Bhure"}, {"name": "R. Ajithkannan"}, {"name": "Shubhang Galagali"}, {"name": "Abhik Choudhury"}], "author_count": 5}, {"id": "2611.16575", "category": "cond-mat", "title": "Elasto-inertial force exerted on a sphere oscillating in a fluid near a soft interface", "abstract": "Fluid inertia can remain important in confined flows, even at low Reynolds number when convective inertia is negligible; yet its coupling with interface deformability is an open problem. Here, we theoretically investigate the high-frequency oscillations of an immersed sphere near an elastic wall in the lubrication regime. We first reconcile previous predictions for the added mass near a rigid wall by consistently matching the inner lubrication flow with the outer flow. Using this rigid-wall problem as a reference, we then develop a perturbative analysis of wall deformation and derive the leading elasto-inertial correction to the hydrodynamic force. Our results reveal that the coupling between interface softness and fluid inertia produces a dominant non-dissipative force contribution scaling as the power four of the frequency in the high-frequency limit, thus corresponding to the fourth time derivative of the sphere's position. This finding may have implications regarding the short-time dynamics of colloidal particles near deformable interfaces in biological and soft-matter settings.", "url": "https://arxiv.org/abs/2611.16575", "type": "理论", "summary": "即使在对流惯性可以忽略不计的低雷诺数下，流体惯性在受限流动中仍然很重要；然而它与界面变形性的耦合是一个悬而未决的问题。在这里，我们从理论上研究了润滑状态下弹性壁附近浸入球体的高频振荡。我们首先通过一致地将内部润滑流与外部流相匹配来协调先前对刚性壁附近增加的质量的预测。然后，我们以该刚性壁问题为参考，对壁变形进行微扰分析，并导出对水动力的主要弹惯性修正。我们的结果表明，界面柔软性和流体惯性之间的耦合产生了占主导地位的非耗散力贡献比例，其比例为高频极限中频率的四次方，因此对应于球体位置的四次时间导数。这一发现可能对生物和软物质环境中可变形界面附近胶体粒子的短时动力学产生影响。", "authors": [{"name": "Axel Batalha"}, {"name": "Harshit Joshi"}, {"name": "Yacine Amarouchene"}, {"name": "Thomas Salez"}], "featured_authors": [{"name": "Axel Batalha"}, {"name": "Harshit Joshi"}, {"name": "Yacine Amarouchene"}, {"name": "Thomas Salez"}], "author_count": 4}, {"id": "2611.16681", "category": "cond-mat", "title": "Dislocation Arrays Hosting Topological Bound States in Epitaxial Tetragonal FeSe Films", "abstract": "Topological defects in real space can host robust, localized quantum states for quantum information processing and sensing, yet deterministic control over their formation in crystalline materials remain challenging.", "url": "https://arxiv.org/abs/2611.16681", "type": "理论", "summary": "真实空间中的拓扑缺陷可以承载用于量子信息处理和传感的鲁棒、局域量子态，但对其在晶体材料中形成的确定性控制仍然具有挑战性。", "authors": [{"name": "Huimin Zhang"}, {"name": "Basu Oli"}, {"name": "Zhengfei Wang"}, {"name": "Michael Weinert"}, {"name": "Lian Li"}], "featured_authors": [{"name": "Huimin Zhang"}, {"name": "Basu Oli"}, {"name": "Zhengfei Wang"}, {"name": "Michael Weinert"}, {"name": "Lian Li"}], "author_count": 5}, {"id": "2611.16730", "category": "cond-mat", "title": "Metric random tilings: exact entropy and the diffraction of counted disorder", "abstract": "Tiling mathematics has twice become the language of a state of matter: crystals, then quasicrystals, whose thermodynamics are described by the random tiling of fixed shapes. There the counted variable is the arrangement rather than the geometry, although the metric is what chemical design sets and diffraction measures. Here we introduce metric random tilings, periodic networks of locked topology whose edge lengths fluctuate under exact face closure, so that the geometry itself is countable. Purpose-built counting engines enumerate Kepler's eleven uniform networks and divide them into seven zero-entropy ones and four carriers with positive metric entropy, each certified by an explicit construction. On the honeycomb, the densest carrier, all edge-length value domains considered carry extensive entropy, with the arithmetic class reaching $s = 0.544\\,k_B$ per tile (fit band 0.53--0.58), the other two $\\approx 0.2$. In diffraction, translational increase of the value domain leaves the entropy exactly invariant while the coherent fraction of the Bragg intensity at fixed patch size varies from $9\\times10^{-4}$ to 0.58, following the Debye--Waller law of the amplitude flow. Metric disorder thus enters the exact-counting paradigm, and is identifiable in real materials by Bragg spots wrapped in metric halos.", "url": "https://arxiv.org/abs/2611.16730", "type": "理论", "summary": "平铺数学已经两次成为物质状态的语言：晶体，然后是准晶体，其热力学是通过固定形状的随机平铺来描述的。尽管度量是化学设计设定和衍射测量的，但计算的变量是排列而不是几何形状。在这里，我们引入度量随机平铺，即锁定拓扑的周期性网络，其边长在精确的面闭合下波动，因此几何体本身是可数的。专门构建的计数引擎枚举了开普勒的十一个统一网络，并将它们分为七个零熵网络和四个具有正度量熵的载波，每个网络都经过显式构造的认证。在蜂窝上，最密集的载体上，所有考虑的边长值域都带有广泛的熵，算术类达到每块 $s = 0.544\\,k_B$（拟合带 0.53--0.58），其他两个 $\\approx 0.2$。在衍射中，值域的平移增加使熵完全不变，而固定斑块尺寸下布拉格强度的相干分数从 $9\\times10^{-4}$ 变化到 0.58，遵循振幅流的德拜-沃勒定律。\n\n因此，公制无序进入了精确计数范式，并且在真实材料中可以通过公制光环包裹的布拉格点来识别。", "authors": [{"name": "Xinyan Wu"}, {"name": "Qingqing Ji"}], "featured_authors": [{"name": "Xinyan Wu"}, {"name": "Qingqing Ji"}], "author_count": 2}, {"id": "2611.16733", "category": "cond-mat", "title": "Freezing transition and shock-like transients in ballistic random walks under threshold resetting", "abstract": "We investigate the transient dynamics of a one-dimensional ballistic random walker under threshold resetting (TR). The walker starts at $x_0>0$, moves towards a threshold at the origin with a velocity drawn from a distribution $\\phi(v)$, and on reaching the threshold is reset to $x_0$ with a new sampled velocity. Whenever the mean first-passage time to the threshold is finite, the walker reaches a steady state that is uniform on $[0,x_0]$ and independent of $\\phi(v)$. The relaxation towards it, in contrast, is highly sensitive to the behavior of $\\phi(v)$. For a large class of $\\phi(v)$-s, we find, rather remarkably, that the relaxation rate depends explicitly on the spatial coordinate, in contrast to conventional relaxation phenomena, where the rate is typically position-independent. Furthermore, this space-dependent relaxation rate eventually freezes to a constant, position-independent value beyond a critical position, a phenomenon we identify as \\textit{freezing transition}. Additionally, for a power-law velocity distribution, the system exhibits an anomalously slow, algebraic relaxation towards the steady state. We also showed that a sharp cutoff in $\\phi(v)$ generates a shock-like discontinuity in the particle propagator that travels towards the threshold, with a jump height that decays with time. These results demonstrate how velocity fluctuations, despite leaving the steady state unchanged, can profoundly influence the transient spatial structures and showcase rich non-equilibrium behavior. Our analytical results are corroborated by Monte Carlo simulations, showing an excellent agreement.", "url": "https://arxiv.org/abs/2611.16733", "type": "理论+数值", "summary": "我们研究了阈值重置（TR）下一维弹道随机游走器的瞬态动力学。步行者从 $x_0>0$ 开始，以从分布 $\\phi(v)$ 中得出的速度向原点处的阈值移动，并在达到阈值时以新的采样速度重置为 $x_0$。每当达到阈值的平均首次通过时间有限时，步行器就会达到稳定状态，该状态在 $[0,x_0]$ 上一致且与 $\\phi(v)$ 无关。相反，对它的放松对 $\\phi(v)$ 的行为高度敏感。对于一大类 $\\phi(v)$-s，我们发现，相当引人注目的是，弛豫率明显取决于空间坐标，这与传统的弛豫现象相反，在传统的弛豫现象中，弛豫率通常与位置无关。此外，这种与空间相关的弛豫率最终会冻结到超出临界位置的恒定的、与位置无关的值，我们将这种现象称为 \\textit{冻结转变}。此外，对于幂律速度分布，系统表现出异常缓慢的代数松弛趋向稳态。\n\n我们还表明，$\\phi(v)$ 中的急剧截止会在粒子传播器中产生类似冲击的不连续性，该不连续性向阈值行进，跳跃高度随时间衰减。这些结果表明，尽管保持稳态不变，但速度波动如何能够深刻影响瞬态空间结构并展示丰富的非平衡行为。我们的分析结果得到了蒙特卡罗模拟的证实，显示出极好的一致性。", "authors": [{"name": "Rahul Das"}, {"name": "Satya N Majumdar"}, {"name": "Arnab Pal"}], "featured_authors": [{"name": "Rahul Das"}, {"name": "Satya N Majumdar"}, {"name": "Arnab Pal"}], "author_count": 3}, {"id": "2611.16743", "category": "cond-mat", "title": "Work extraction from a single negative-temperature bath: a temperature gradient-driven heat flow", "abstract": "Work dissipation into a thermal bath is standard, whereas the reverse process -- sole work extraction from a thermal bath without a net state change -- contradicts the Kelvin-Planck formulation of the second law of thermodynamics. However, this prohibition is bypassed for baths at negative absolute temperature, sparking ongoing debate regarding their thermodynamic stability. Here, we reconcile the second law with sole work extraction from a negative-temperature bath by considering a large virtual assembly of weakly coupled working systems rather than an isolated machine. By assigning this assembly a canonical temperature derived from its Shannon/information entropy, the framework naturally extends to molecular-scale machines. We demonstrate paradigmatic examples where the assembly's canonical temperature is cooler than the negative-temperature bath. Consequently, sole work extraction represents standard heat flow from a hot system (the negative-temperature bath) to a cooler system (the working assembly), rendering the process fully consistent with the second law. This informational and statistical-mechanical framework also naturally explains the counter-intuitive phenomenon of \"donkey behavior\", where increasing the workload in a negative-temperature bath leads to enhanced work extraction.", "url": "https://arxiv.org/abs/2611.16743", "type": "理论", "summary": "功耗散到热浴中是标准的，而相反的过程——仅从热浴中提取功而没有净状态变化——与热力学第二定律的开尔文-普朗克公式相矛盾。然而，对于负绝对温度的浴液来说，这一禁令被绕过，引发了关于其热力学稳定性的持续争论。在这里，我们通过考虑弱耦合工作系统的大型虚拟组件而不是孤立的机器，将第二定律与从负温浴中单独提取功相协调。通过为该组件分配一个源自其香农/信息熵的规范温度，该框架自然可以扩展到分子级机器。我们展示了典型示例，其中组件的标准温度比负温浴更低。因此，唯一的功提取代表从热系统（负温浴）到冷却器系统（工作组件）的标准热流，使该过程完全符合第二定律。\n\n这种信息和统计机械框架也自然地解释了“驴行为”的反直觉现象，即增加负温浴中的工作量会导致功提取增强。", "authors": [{"name": "Wolfgang Rudolf Bauer"}], "featured_authors": [{"name": "Wolfgang Rudolf Bauer"}], "author_count": 1}, {"id": "2611.16745", "category": "cond-mat", "title": "Detecting non-Hermitian topology from long-time dynamics", "abstract": "We propose a protocol to measure the non-Hermitian topological invariant associated with the Lindbladian spectrum of chiral-symmetric open Gaussian systems from the relaxation of the covariance matrix. Importantly, the method works in the long-time regime and does not rely on isolating edge modes, so it remains applicable even when the Liouvillian skin effect may obscure them. We illustrate the technique on a Kitaev chain with reservoir-induced nonreciprocity, for which we first obtain a fully analytical and previously unknown description of its topological phase diagram. We then show that our protocol reliably distinguishes all the different phases.", "url": "https://arxiv.org/abs/2611.16745", "type": "理论+数值", "summary": "我们提出了一种协议，通过协方差矩阵的松弛来测量与手性对称开放高斯系统的 Lindbladian 谱相关的非厄米拓扑不变量。重要的是，该方法适用于长时间状态，并且不依赖于隔离边缘模式，因此即使刘维尔集肤效应可能掩盖它们，它仍然适用。我们在具有储层诱导非互易性的 Kitaev 链上说明了该技术，为此我们首先获得了其拓扑相图的完全分析和先前未知的描述。然后我们证明我们的协议能够可靠地区分所有不同的阶段。", "authors": [{"name": "Antonio D'Abbruzzo"}, {"name": "Rosario Fazio"}], "featured_authors": [{"name": "Antonio D'Abbruzzo"}, {"name": "Rosario Fazio"}], "author_count": 2}, {"id": "2611.16765", "category": "cond-mat", "title": "Physical interpretation of spin-glass models with correlated disorder", "abstract": "Ising spin-glass models with a specific type of correlated bond disorder have recently been used to relate properties of spin-glass phases, such as temperature chaos and magnetic-field chaos, to ferromagnetic order. This correlated disorder has a simple physical interpretation, which underlies the sampling procedure introduced by Oshima, Arai, and Hukushima for numerical simulations: the bond configuration is obtained from the Edwards-Anderson model with the symmetric $\\pm J$ distribution by drawing one of its equilibrium spin configurations and writing the model in the gauge in which this reference configuration becomes the all-up state. The construction is analogous to the Mattis model, with the roles of the ferromagnet and the spin glass reversed: whereas the Mattis model is a ferromagnet in disguise, the ferromagnetic phase of the correlated model is essentially a spin-glass phase in disguise. The frustration statistics of the correlated-disorder model are exactly those of the symmetric $\\pm J$ model, and, in a generalization with an additional parameter $\\gamma$, the probabilities of the gauge equivalence classes are determined by $\\gamma$ alone, whereas the inverse temperature at which the reference configuration is drawn determines only the distribution within each class. The magnetization of this model is the overlap with the reference configuration. Through this correspondence, studies of its ferromagnetic phase have led to unexpected results on temperature chaos and magnetic-field chaos in the spin-glass phase of the Edwards-Anderson model. Models with correlated disorder have thus provided a new perspective on spin glasses and have proved fertile ground for highly nontrivial results on the spin-glass problem.", "url": "https://arxiv.org/abs/2611.16765", "type": "理论+数值", "summary": "具有特定类型相关键无序的伊辛自旋玻璃模型最近被用来将自旋玻璃相的特性（例如温度混沌和磁场混沌）与铁磁有序相关联。这种相关无序有一个简单的物理解释，它是 Oshima、Arai 和 Hukushima 引入的用于数值模拟的采样程序的基础：键构型是从具有对称 $\\pm J$ 分布的 Edwards-Anderson 模型中获得的，通过绘制其平衡自旋构型之一并将该模型写入规范中，其中该参考构型成为全部状态。该结构类似于马蒂斯模型，只是铁磁体和自旋玻璃的角色颠倒了：马蒂斯模型是伪装的铁磁体，而相关模型的铁磁相本质上是伪装的自旋玻璃相。\n\n相关无序模型的挫败统计与对称 $\\pm J$ 模型的挫败统计完全相同，并且在具有附加参数 $\\gamma$ 的推广中，规范等价类的概率仅由 $\\gamma$ 确定，而绘制参考配置的逆温度仅确定每个类内的分布。该模型的磁化强度与参考配置重叠。通过这种对应关系，对其铁磁相的研究在爱德华兹-安德森模型的自旋玻璃相中的温度混沌和磁场混沌方面取得了意想不到的结果。因此，具有相关无序的模型为自旋玻璃提供了新的视角，并为自旋玻璃问题的非常重要的结果提供了肥沃的土壤。", "authors": [{"name": "Hidetoshi Nishimori"}], "featured_authors": [{"name": "Hidetoshi Nishimori"}], "author_count": 1}, {"id": "2611.16780", "category": "cond-mat", "title": "Learning to control and predict light-driven electron-phonon dynamics", "abstract": "Driving lattice vibrations provides a direct route to manipulating electronic correlations through nonlinear electron-phonon coupling. Finding suitable driving fields, however, requires control over the coupled dynamics beyond a simple choice of pulse amplitude and frequency. Here we develop a differentiable framework that combines field optimization with neural-network prediction in a two-site electron-phonon model. We compare piecewise-constant, B-spline, feed-forward, and recurrent control parameterizations, optimized to increase the accumulated electronic double occupation. For the dissipation-free model at zero Hubbard interaction, all the methods increase double occupation, with the B-spline raising the mean total double occupation of approximately 30%. Alongside control optimization, a separate recurrent network learns to predict the next-step double occupation and phonon observables from their preceding values and the applied field. These results establish a computational proof of concept for shaping local electronic correlations through a phonon drive and identify a promising route toward learned models for nonequilibrium materials control.", "url": "https://arxiv.org/abs/2611.16780", "type": "理论+数值", "summary": "驱动晶格振动提供了通过非线性电子声子耦合操纵电子相关性的直接途径。然而，找到合适的驱动场需要控制耦合动态，而不仅仅是简单选择脉冲幅度和频率。在这里，我们开发了一个可微分框架，将场优化与两站点电子声子模型中的神经网络预测相结合。我们比较分段常数、B 样条、前馈和循环控制参数化，并进行优化以增加累积的电子双占用。对于零哈伯德相互作用的无耗散模型，所有方法都增加了双占据，其中 B 样条将平均总双占据提高了大约 30%。除了控制优化之外，一个单独的循环网络还学习根据先前的值和应用场来预测下一步的双占据和声子可观测量。这些结果建立了通过声子驱动塑造局部电子相关性的计算概念证明，并确定了一条通往非平衡材料控制学习模型的有前途的途径。", "authors": [{"name": "Matteo Puviani"}], "featured_authors": [{"name": "Matteo Puviani"}], "author_count": 1}, {"id": "2611.16792", "category": "cond-mat", "title": "Systematic Evaluation of Training Data Generation Strategies for Machine Learning-Based Molecular and Materials Property Prediction", "abstract": "Machine-learning (ML) models for molecular and materials property prediction are often trained on large datasets curated through arbitrary or generic sampling strategies. Such approaches can lead to the over- or under-representation of regions of chemical and materials space that are most relevant to the prediction task. An important challenge is therefore how to efficiently curate training data to maximize predictive performance while minimising the number of labelled examples required. Here, we systematically compare training data acquisition strategies for molecular and materials property prediction, ranging from random sampling to various active learning approaches. We evaluate their performance across different model classes, representations, datasets, and target properties. Our results show that the effectiveness of data acquisition strategies depend strongly on the interplay between the model, dataset, and prediction task, although uncertainty-based sampling generally outperforms alternative strategies. Based on these findings, we derive guidelines for selecting data acquisition strategies under a given labelling budget.", "url": "https://arxiv.org/abs/2611.16792", "type": "理论+数值", "summary": "用于分子和材料属性预测的机器学习 (ML) 模型通常在通过任意或通用采样策略管理的大型数据集上进行训练。这种方法可能会导致与预测任务最相关的化学和材料空间区域的代表性过高或过低。因此，一个重要的挑战是如何有效地管理训练数据，以最大限度地提高预测性能，同时最大限度地减少所需的标记示例的数量。在这里，我们系统地比较了分子和材料特性预测的训练数据获取策略，从随机采样到各种主动学习方法。我们评估它们在不同模型类、表示、数据集和目标属性上的性能。我们的结果表明，数据采集策略的有效性在很大程度上取决于模型、数据集和预测任务之间的相互作用，尽管基于不确定性的采样通常优于替代策略。根据这些发现，我们得出了在给定标签预算下选择数据采集策略的指南。", "authors": [{"name": "Minh Nghia Nguyen"}, {"name": "Beate Paulus"}, {"name": "Akhil S. Nair"}], "featured_authors": [{"name": "Minh Nghia Nguyen"}, {"name": "Beate Paulus"}, {"name": "Akhil S. Nair"}], "author_count": 3}, {"id": "2611.16841", "category": "cond-mat", "title": "Two Unconventional Hall Effects in the Kagome Magnet TmMn4Cr$_2$Sn$_6$", "abstract": "We identify two Hall anomalies in the kagome magnet TmMn$_4$Cr$_2$Sn$_6$. We propose that the high-field anomaly reflects a discontinuous spin reorientation and differing sublattice contributions to Hall transport and magnetization. At low fields, Hall hysteresis persists despite negligible magnetic hysteresis, suggesting a chirality-related contribution, although its microscopic origin remains unresolved. These contrasting regimes show how magnetic transitions can mimic unconventional Hall signals and highlight the limits of magnetization-based Hall decomposition.", "url": "https://arxiv.org/abs/2611.16841", "type": "数值", "summary": "我们在 kagome 磁铁 TmMn$_4$Cr$_2$Sn$_6$ 中发现了两个霍尔异常。我们认为高场异常反映了不连续的自旋重定向以及对霍尔传输和磁化的不同亚晶格贡献。在低磁场下，尽管磁滞可以忽略不计，但霍尔磁滞仍然存在，这表明与手性相关的贡献，尽管其微观起源仍未解决。这些对比状态显示了磁转变如何模拟非常规霍尔信号并突出基于磁化的霍尔分解的局限性。", "authors": [{"name": "Mohamed El Gazzah"}, {"name": "Fehmi Sami Yasin"}, {"name": "Bishal Thapa"}, {"name": "Sk Jamaluddin"}, {"name": "Abhijeet Nayak"}, {"name": "Resham Babu Regmi"}, {"name": "Mary Kate Carroll"}, {"name": "Igor I. Mazin"}, {"name": "Nirmal J. Ghimire"}], "featured_authors": [{"name": "Mohamed El Gazzah"}, {"name": "Fehmi Sami Yasin"}, {"name": "Bishal Thapa"}, {"name": "Mary Kate Carroll"}, {"name": "Igor I. Mazin"}, {"name": "Nirmal J. Ghimire"}], "author_count": 9}, {"id": "2611.16857", "category": "cond-mat", "title": "Complex nematic dynamics driven by steady Kolmogorov flows", "abstract": "Complex nematohydrodynamics, including irregular defect dynamics, is commonly associated with time-dependent flows, most notably in active turbulence. Here we consider a simple model of a planar nematic subjected to a temporally steady but spatially varying flow and investigate the onset of time-dependent dynamics. Subjecting a passive nematic to steady Kolmogorov flow, while eliminating velocity fluctuations and hydrodynamic feedback, we find that increasing the flow strength drives a transition from stationary to periodic and, at stronger forcing, irregular spatiotemporal dynamics. The time-dependent states involve repeated local suppression of nematic order and director reorganisation, arising from the competition between spatially varying shear and nematic relaxation. Bifurcation and phase-space analyses characterise this progression, while reduced-order models identify the dynamical origins. A two-mode model captures the onset of periodic motion through a saddle-node infinite-period bifurcation. A five-mode Galerkin truncation further recovers the progression from stationary to periodic and irregular dynamics. These results allow us to explain how a fixed, spatially heterogeneous velocity field can generate temporal complexity through the nonlinear dynamics of nematic order alone.", "url": "https://arxiv.org/abs/2611.16857", "type": "理论+数值", "summary": "复杂的线流体动力学，包括不规则的缺陷动力学，通常与时间相关的流动相关，尤其是在活跃的湍流中。在这里，我们考虑一个简单的平面向列模型，该模型受到时间稳定但空间变化的流动的影响，并研究与时间相关的动力学的开始。将被动向列置于稳定的柯尔莫哥洛夫流中，同时消除速度波动和流体动力反馈，我们发现增加流动强度可驱动从静止到周期性的转变，并且在更强的作用力下，驱动不规则的时空动力学。时间依赖状态涉及向列序的重复局部抑制和导向重组，这是由空间变化的剪切和向列弛豫之间的竞争引起的。分岔和相空间分析描述了这一过程的特征，而降阶模型则确定了动力学起源。双模式模型通过鞍节点无限周期分叉捕获周期性运动的开始。五模伽辽金截断进一步恢复了从静止到周期性和不规则动力学的进展。\n\n这些结果使我们能够解释固定的空间异质速度场如何仅通过向列序的非线性动力学产生时间复杂性。", "authors": [{"name": "Rahil N Valani"}, {"name": "Sumesh P Thampi"}, {"name": "Julia M Yeomans"}], "featured_authors": [{"name": "Rahil N Valani"}, {"name": "Sumesh P Thampi"}, {"name": "Julia M Yeomans"}], "author_count": 3}, {"id": "2611.16893", "category": "cond-mat", "title": "A deterministic theory of kinetic fluctuations in long-range interacting homogeneous systems without collective effects", "abstract": "Finite-$N$ fluctuations govern the slow relaxation of long-range interacting systems, yet accessing their full statistics demands huge ensembles of costly simulations. We show that, in homogeneous systems without collective effects, this statistical problem collapses onto just three deterministic kinetic equations. Starting from the Landau-Dean-Kawasaki equation, i.e. the stochastic counterpart of the large deviation principle for the Landau equation, we derive the infinite hierarchy of $n$-point moments of the empirical distribution function at leading order in $1/N$. We prove that it is solved exactly by a quasi-Gaussian closure. The resulting minimal Landau fluctuation hierarchy is formed by the Landau equation, a Lyapunov equation for the two-point moment, and a kinetic equation for the three-point moment. From these three equations, all higher-order moments follow algebraically. The hierarchy exactly preserves the collisional invariants and their fluctuations, and predicts the full probability distribution of observables in the central fluctuation regime. Benchmarked against $N$-body realizations, it reproduces the mean, variance and higher-order moments with an accuracy that improves systematically with $N$. A single deterministic time-integration of three coupled partial differential equations thus replaces large ensembles of simulations, for any large $N$.", "url": "https://arxiv.org/abs/2611.16893", "type": "理论+数值", "summary": "有限的$N$波动控制着远程交互系统的缓慢松弛，但访问其完整的统计数据需要大量昂贵的模拟集合。我们证明，在没有集体效应的同质系统中，这个统计问题只能分解为三个确定性动力学方程。从Landau-Dean-Kawasaki方程（即Landau方程大偏差原理的随机对应部分）出发，我们推导了$1/N$中前导阶经验分布函数的$n$点矩的无限层次结构。我们证明它可以通过准高斯闭包精确求解。由此产生的最小朗道涨落层次由朗道方程、两点矩的李亚普诺夫方程和三点矩的动力学方程组成。从这三个方程中，所有高阶矩都遵循代数法则。该层次结构准确地保留了碰撞不变量及其波动，并预测了中心波动区域中可观测量的完整概率分布。\n\n以 $N$ 体实现为基准，它再现了均值、方差和高阶矩，其准确度随着 $N$ 系统性地提高。因此，对于任何大的$N$，三个耦合偏微分方程的单一确定性时间积分取代了大型模拟集合。", "authors": [{"name": "Anwar El Rhirhayi"}, {"name": "Jean-Baptiste Fouvry"}, {"name": "Julien Barré"}], "featured_authors": [{"name": "Anwar El Rhirhayi"}, {"name": "Jean-Baptiste Fouvry"}, {"name": "Julien Barré"}], "author_count": 3}, {"id": "2611.16939", "category": "cond-mat", "title": "Symmetry-preserving gapped Dirac state revealed by site-selective $^{13}$C NMR in $α$-(BETS)$_2$I$_3$", "abstract": "We report evidence that the low-temperature insulating phase of $\\alpha$-(BETS)$_2$I$_3$ preserves both inversion and time-reversal symmetries using site-selective $^{13}$C nuclear magnetic resonance. $\\alpha$-(BETS)$_2$I$_3$ undergoes a metal-insulator transition or sharp crossover at approximately 50 K and has been proposed as a candidate spin-orbit-coupling-induced Dirac insulator, yet the nature of its insulating ground state remains unresolved. The NMR spectra exhibit no additional splitting down to 2 K and remain fully described by one quartet and two doublets associated with the three types of molecular sites, A (=A$^{\\prime}$), B and C sites, demonstrating the preservation of inversion symmetry. Furthermore, no anomalous line broadening or critical enhancement of the nuclear spin-lattice relaxation rate is observed, indicating the absence of magnetic ordering and time-reversal-symmetry breaking. Analysis of the Knight shifts yields site-specific spin susceptibilities satisfying $\\chi_{\\mathrm{C}} > \\chi_{\\mathrm{A}} > \\chi_{\\mathrm{B}}$, a characteristic feature of tilted Dirac-cone electronic states as observed in $\\alpha$-(BEDT-TTF)$_2$I$_3$ under pressure. However, the faint field-induced ferrimagnetic-like spin excitations observed in $\\alpha$-(BEDT-TTF)$_2$I$_3$, which are ascribed to the gapless tilted Dirac cones, are absent in $\\alpha$-(BETS)$_2$I$_3$. These results demonstrate that the insulating ground state of $\\alpha$-(BETS)$_2$I$_3$ is a symmetry-preserving gapped Dirac state and provide microscopic constraints on proposed correlated topological phases in this molecular Dirac system.", "url": "https://arxiv.org/abs/2611.16939", "type": "理论+数值", "summary": "我们报告的证据表明，$\\alpha$-(BETS)$_2$I$_3$ 的低温绝缘相使用位点选择性 $^{13}$C 核磁共振保留了反转和时间反转对称性。 $\\alpha$-(BETS)$_2$I$_3$ 在大约 50 K 时经历金属-绝缘体转变或急剧交叉，并被提议作为候选自旋轨道耦合诱导狄拉克绝缘体，但其绝缘基态的性质仍未解决。 NMR 谱没有表现出向下至 2 K 的额外分裂，并且仍然由与三种类型的分子位点 A (=A$^{\\prime}$)、B 和 C 位点相关的一个四重态和两个双峰充分描述，证明了反演对称性的保留。此外，没有观察到核自旋晶格弛豫率的异常谱线展宽或临界增强，表明不存在磁有序和时间反转对称性破缺。奈特位移分析产生满足 $\\chi_{\\mathrm{C}} > \\chi_{\\mathrm{A}} > \\chi_{\\mathrm{B}}$ 的位点特定自旋敏感性，这是在压力下 $\\alpha$-(BEDT-TTF)$_2$I$_3$ 中观察到的倾斜狄拉克锥电子态的特征。\n\n然而，在 $\\alpha$-(BEDT-TTF)$_2$I$_3$ 中观察到的微弱场感应类亚铁磁自旋激发（归因于无间隙倾斜狄拉克锥）在 $\\alpha$-(BETS)$_2$I$_3$ 中不存在。这些结果表明 $\\alpha$-(BETS)$_2$I$_3$ 的绝缘基态是一种保持对称性的带隙狄拉克态，并为该分子狄拉克系统中提出的相关拓扑相提供了微观约束。", "authors": [{"name": "Takahiko Sekine"}, {"name": "Kazuya Miyagawa"}, {"name": "Koichi Hiraki"}, {"name": "Reizo Kato"}, {"name": "Kazushi Kanoda"}], "featured_authors": [{"name": "Takahiko Sekine"}, {"name": "Kazuya Miyagawa"}, {"name": "Koichi Hiraki"}, {"name": "Reizo Kato"}, {"name": "Kazushi Kanoda"}], "author_count": 5}, {"id": "2611.16973", "category": "cond-mat", "title": "Interfacial Structure and Dynamics of Active-Passive Fluid Mixtures", "abstract": "We investigate the interface between an active and a passive fluid using molecular dynamics simulations of active Brownian particles in contact with a passive Lennard-Jones fluid. We compute the surface tension via two independent routes, pressure anisotropy and capillary-wave analysis, and find that they disagree systematically once activity is switched on. Static density and orientation profiles reveal three distinct activity regimes, with particles preferentially oriented toward the interface. Going beyond these static properties, we characterize the interface dynamics: a threshold activity above which mixing becomes irreversible, coinciding with the onset of the mixing regime, and a transient overshoot in interfacial width before relaxation to steady state.", "url": "https://arxiv.org/abs/2611.16973", "type": "数值", "summary": "我们使用与被动伦纳德-琼斯流体接触的主动布朗粒子的分子动力学模拟来研究主动流体和被动流体之间的界面。我们通过压力各向异性和毛细波分析这两条独立的途径计算表面张力，并发现一旦活动开启，它们就会系统地不一致。静态密度和取向分布揭示了三种不同的活动状态，粒子优先朝向界面。除了这些静态特性之外，我们还描述了界面动力学：阈值活动，高于该阈值活动，混合变得不可逆，与混合状态的开始一致，以及在松弛到稳态之前界面宽度的瞬态超调。", "authors": [{"name": "Linnea Heitmeier"}], "featured_authors": [{"name": "Linnea Heitmeier"}], "author_count": 1}, {"id": "2611.16979", "category": "cond-mat", "title": "Cup and cap synchronization: higher-order node dynamics from topology", "abstract": "Higher-order node-based synchronization provides distinct mechanisms for discontinuous synchronization transitions. However, a comprehensive theoretical framework capable of encompassing existing models and revealing the role of higher-order interactions beyond triangles is still missing. Here, combining algebraic topology and nonlinear dynamics, we introduce Cup and Cap Synchronization, a unifying theoretical framework for higher-order node-based dynamics that naturally incorporates the topological organization of the underlying higher-order network. We show that Cup and Cap Synchronization can display critical behavior belonging to the universality classes of two existing higher-order Kuramoto-like models, whose distinct critical behaviors were thought to originate from different mechanisms. Remarkably, we demonstrate that Cup and Cap Synchronization displays additional phenomenology not captured by the previously proposed models of higher-order node-based synchronization. Most relevantly, the inclusion of four-body interactions can fundamentally alter the critical properties of the synchronization transition, giving rise to collective phenomena that cannot be observed in models including only interactions mediated by edges and triangles. These findings reveal the importance of going beyond the commonly studied three-body terms and establish Cup and Cap Synchronization as a unifying theoretical framework for understanding collective dynamics in higher-order networks.", "url": "https://arxiv.org/abs/2611.16979", "type": "理论", "summary": "基于高阶节点的同步为不连续同步转换提供了独特的机制。然而，仍然缺乏能够涵盖现有模型并揭示三角形之外的高阶相互作用的作用的综合理论框架。在这里，结合代数拓扑和非线性动力学，我们引入了 Cup and Cap Synchronization，这是一种基于高阶节点的动力学的统一理论框架，自然地结合了底层高阶网络的拓扑组织。我们证明，Cup 和 Cap 同步可以显示属于两个现有高阶 Kuramoto 类模型的普遍性类别的关键行为，其独特的关键行为被认为源自不同的机制。值得注意的是，我们证明了杯和帽同步显示了先前提出的基于高阶节点的同步模型未捕获的额外现象。\n\n最相关的是，包含四体相互作用可以从根本上改变同步转变的关键特性，从而产生在仅包括由边和三角形介导的相互作用的模型中无法观察到的集体现象。这些发现揭示了超越普遍研究的三体术语并将杯和帽同步建立为理解高阶网络中集体动力学的统一理论框架的重要性。", "authors": [{"name": "Runyue Wang"}, {"name": "Yuanzhao Zhang"}, {"name": "Ginestra Bianconi"}], "featured_authors": [{"name": "Runyue Wang"}, {"name": "Yuanzhao Zhang"}, {"name": "Ginestra Bianconi"}], "author_count": 3}, {"id": "2611.16988", "category": "cond-mat", "title": "Unconstrained $\\mathbb{Z}_2$ gauge theory on a triangular lattice: deconfined fermions in a vison crystal and superfluidity", "abstract": "We investigate an unconstrained $\\mathbb{Z}_2$ gauge theory coupled to fermions on the triangular lattice at half filling, using auxiliary field quantum Monte Carlo simulations. The triangular geometry gives rise to a global $\\mathbb{Z}_2$ symmetry that acts as an Ising symmetry on the plaquette
