  <style>

    .author-note { color: var(--muted); font-size: 12px; }

  <script>
    const papers = [{"id": "2609.13256", "category": "cond-mat", "title": "Localization Landscapes as Operator-Induced Geometry for Heterogeneous Systems", "abstract": "Heterogeneous operators often organize response through hidden barriers, wells, and weakly communicating compartments that are not faithfully described by Euclidean distance or raw graph connectivity alone. We study this structure through the localization landscape, obtained from a single source solve, and the associated effective potential $W_{\\mathrm{eff}} = 1/u$. Starting from both discrete Schrödinger-type operators and heterogeneous reaction-diffusion operators, we show how $W_{\\mathrm{eff}}$ induces effective wells, basin partitions, and Agmon-type neighborhoods that serve as an operator-aware geometry for localization and transport. This geometry explains the spatial support of low-energy eigenmodes, produces adaptive receptive fields on a fixed graph, sharpens locality in attention-like interactions, and yields bottleneck-sensitive modulation of diffusion. We also include a finite-element reaction-diffusion example with strongly compartmentalized coefficients, demonstrating that the same framework extends beyond simple grid operators to heterogeneous continuum systems. The results support a precise conclusion: localization-landscape geometry is a strong inductive bias when relevance is controlled by confinement, barriers, and low-energy accessibility, but its benefits are task-dependent rather than universal.", "url": "https://arxiv.org/abs/2609.13256", "type": "理论", "summary": "异构操作员通常通过隐藏的障碍、井和弱通信隔间来组织响应，而这些隔间不能仅通过欧几里德距离或原始图连接性来忠实地描述。我们通过从单源求解获得的定位景观以及相关的有效势 $W_{\\mathrm{eff}} = 1/u$ 来研究这种结构。从离散薛定谔型算子和异质反应扩散算子开始，我们展示了 $W_{\\mathrm{eff}}$ 如何诱导有效井、盆地分区和 Agmon 型邻域，这些邻域充当用于定位和传输的算子感知几何结构。这种几何结构解释了低能量本征模的空间支持，在固定图上产生自适应感受野，锐化类似注意力的交互中的局部性，并产生瓶颈敏感的扩散调制。我们还包括一个具有强分区系数的有限元反应扩散示例，证明相同的框架超越简单的网格算子扩展到异构连续体系统。\n\n结果支持一个精确的结论：当相关性受到限制、障碍和低能量可达性控制时，定位-景观几何是一种很强的归纳偏差，但它的好处是依赖于任务的，而不是普遍的。", "authors": [{"name": "Josué García-Ávila"}], "featured_authors": [{"name": "Josué García-Ávila"}], "author_count": 1}, {"id": "2609.13273", "category": "cond-mat", "title": "A thermomechanical framework for strongly nonlocal continua", "abstract": "The paper presents a consistent thermomechanical framework for strongly nonlocal continua, a type of generalized media in which a material's response at a point depends on deformation and temperature gradients within its neighborhood. Such dependence is responsible for localization phenomena having an intrinsic size, and nonlocal modeling also serves as a practical regularization tool to prevent mesh dependence. Nonlocality is of the integral type, using a kernel function that gives the relative influence of neighboring points on a central point. The paper develops three sources of nonlocality: (1) nonlocal momentum balance equations; (2) nonlocal conservation laws (including the first and second laws of thermodynamics); and (3) a material's nonlocal constitutive structure. Balance equations are derived using the principle of virtual power, permitting non-smooth force and displacement fields and non-smooth boundary surfaces with indistinct normal directions. The balance equations differ from those of classical local continua. Conservation laws also differ from those of local continua, with the mechanical power and heating at a point being averaged over its neighborhood. These laws are developed for processes that are sufficiently slow to minimize additional meso-scale kinetic energy due to internal turbulence. Stress, entropy, and dissipative forces are obtained as averaged derivatives of the free energy function with respect to strain, temperature, and internal variables. An example is presented of a stretched elastoplastic bar with a small defect, and nonlocality is shown to impart a characteristic size to the deformation pattern.", "url": "https://arxiv.org/abs/2609.13273", "type": "理论", "summary": "该论文提出了强非局部连续体的一致热机械框架，这是一种广义介质，其中材料在某一点的响应取决于其邻域内的变形和温度梯度。这种依赖性是造成具有固有尺寸的局部化现象的原因，并且非局部建模也可以作为防止网格依赖性的实用正则化工具。非局部性是积分类型，使用核函数给出相邻点对中心点的相对影响。本文提出了非定域性的三个来源：（1）非定域动量平衡方程； (2)非定域守恒定律（包括热力学第一、第二定律）； (3) 材料的非局部本构结构。利用虚力原理导出平衡方程，允许非光滑力场和位移场以及法线方向不明确的非光滑边界表面。平衡方程与经典局部连续体的平衡方程不同。守恒定律也不同于局部连续体的守恒定律，其中一点的机械功率和热量在其邻近区域取平均值。\n\n这些定律是为足够慢的过程而制定的，以最大限度地减少由于内部湍流而产生的额外介观动能。应力、熵和耗散力作为自由能函数相对于应变、温度和内部变量的平均导数获得。给出了一个带有小缺陷的拉伸弹塑性杆的示例，并且显示了非局部性为变形模式赋予了特征尺寸。", "authors": [{"name": "Matthew R. Kuhn"}], "featured_authors": [{"name": "Matthew R. Kuhn"}], "author_count": 1}, {"id": "2609.13378", "category": "cond-mat", "title": "The price of locality: Maxwell-Cattaneo charge transport in Schwinger-Keldysh effective field theory", "abstract": "We determine the conditions under which the nonlinear Maxwell-Cattaneo theory of charge transport admits a local Gaussian Schwinger-Keldysh embedding with a particular modified dynamical KMS symmetry. We show that treating the additional vector as intrinsically dissipative fundamentally modifies the entropy-current analysis: the hydrostatic generating functional no longer fixes all entropy-current improvements, which must instead be supplied independently. Subsequently we discuss the additional constraints not contained in the hydrodynamic analysis that are imposed by the modified KMS transformation becoming a symmetry of the action. We both interpret and supply the corresponding stochastic quasi-hydrodynamics.", "url": "https://arxiv.org/abs/2609.13378", "type": "理论", "summary": "我们确定了电荷传输的非线性 Maxwell-Cattaneo 理论允许局部高斯 Schwinger-Keldysh 嵌入与特定修改的动态 KMS 对称性的条件。我们表明，将附加向量视为本质上耗散的从根本上修改了熵流分析：静水力生成函数不再修复所有熵流改进，而是必须独立提供。随后我们讨论了流体动力学分析中未包含的附加约束，这些附加约束是由修改后的 KMS 变换变成作用的对称性而施加的。我们解释并提供了相应的随机准流体动力学。", "authors": [{"name": "Andrea Amoretti"}, {"name": "Matteo Anselmi"}, {"name": "Daniel K. Brattan"}], "featured_authors": [{"name": "Andrea Amoretti"}, {"name": "Matteo Anselmi"}, {"name": "Daniel K. Brattan"}], "author_count": 3}, {"id": "2609.13387", "category": "cond-mat", "title": "Quantum Stochastic Walks on the Permutation Group", "abstract": "How rapidly does order give way to randomness, and can quantum coherence accelerate this process? We address these questions through the paradigmatic problem of card shuffling, formulated as a random walk on the symmetric group $S_n$. We first recast the random-transposition walk studied by Diaconis and Shahshahani, as well as more general walks generated by conjugacy classes of $S_n$, in continuous time. We then identify the transition matrix of each classical walk with a permutation Hamiltonian generating a corresponding unitary quantum walk. Purely unitary evolution, however, does not generically converge to the uniform distribution in the classical sense of mixing: coherence preserves information rather than erasing it. We therefore embed the problem into a quantum stochastic walk, where coherent dynamics competes with the dissipative process responsible for classical mixing. In this setting, quantum coherence assists randomization. We prove that it can only decrease the distance from the uniform distribution in the computational basis and can therefore accelerate mixing. An analysis of the slowest mode yields a criterion for the coupling strength required to produce an appreciable speedup. Finally, numerical results reveal a scaling collapse of the ratio between quantum and classical mixing times onto a simple one-parameter form. Our results illustrate how coherence and dissipation can cooperate in the emergence of randomness in walks on permutation groups.", "url": "https://arxiv.org/abs/2609.13387", "type": "理论+数值", "summary": "秩序让位于随机性的速度有多快？量子相干性能否加速这一过程？我们通过洗牌的范例问题来解决这些问题，将其表述为对称群 $S_n$ 上的随机游走。我们首先在连续时间内重新构建 Diaconis 和 Shahshahani 研究的随机转置游走，以及由 $S_n$ 共轭类生成的更一般的游走。然后，我们用排列哈密顿量来识别每个经典游走的转移矩阵，生成相应的酉量子游走。然而，纯粹的单一进化通常不会收敛到经典混合意义上的均匀分布：一致性会保留信息而不是删除信息。因此，我们将问题嵌入到量子随机行走中，其中相干动力学与负责经典混合的耗散过程竞争。在这种情况下，量子相干性有助于随机化。我们证明它只能减少计算基础上与均匀分布的距离，因此可以加速混合。\n\n对最慢模式的分析得出了产生明显加速所需的耦合强度的标准。最后，数值结果揭示了量子和经典混合时间之间的比率按比例崩溃为简单的单参数形式。我们的结果说明了相干性和耗散如何在排列群游走中随机性的出现中相互配合。", "authors": [{"name": "Feng He"}, {"name": "Arthur Hutsalyuk"}, {"name": "Giuseppe Mussardo"}, {"name": "Andrea Stampiggi"}], "featured_authors": [{"name": "Feng He"}, {"name": "Arthur Hutsalyuk"}, {"name": "Giuseppe Mussardo"}, {"name": "Andrea Stampiggi"}], "author_count": 4}, {"id": "2609.13391", "category": "cond-mat", "title": "Effective theory of the hidden-order pseudogap phase in a doped antiferromagnet", "abstract": "The microscopic origin of the pseudogap phase constitutes a longstanding puzzle related to the emergence of high-temperature superconductivity in cuprate materials. In this work, we develop an effective model for doped antiferromagnets in terms of fluctuating stripes, or string-like domain walls, which obscure the antiferromagnetic order of the spin background. The open ends of such domain walls of the N'eel order are treated as vortices in the resulting lattice gauge theory. We numerically evaluate the phase diagram by classical Monte Carlo simulations, using percolation-based geometric order parameters to diagnose hidden N'eel order. At high temperatures, we identify a BKT-type crossover in which the domain wall ends become deconfined. We interpret this as the $T^*$ crossover from the hidden order regime to the paramagnetic metal above. At low temperatures, we identify stripe instabilities. Predictions of our effective model can be tested in ultracold fermion quantum simulators.", "url": "https://arxiv.org/abs/2609.13391", "type": "理论+数值", "summary": "赝能隙相的微观起源构成了与铜酸盐材料中高温超导性的出现相关的长期谜题。在这项工作中，我们根据波动条纹或弦状畴壁开发了一种有效的掺杂反铁磁体模型，这些模型模糊了自旋背景的反铁磁顺序。在由此产生的晶格规范理论中，这种尼尔级磁畴壁的开放端被视为涡旋。我们通过经典蒙特卡罗模拟对相图进行数值评估，使用基于渗流的几何阶参数来诊断隐藏的 N'eel 阶。在高温下，我们发现了 BKT 型交叉，其中磁畴壁末端变得不受限制。我们将其解释为从隐藏秩序状态到上面的顺磁金属的 $T^*$ 交叉。在低温下，我们发现条纹不稳定性。我们的有效模型的预测可以在超冷费米子量子模拟器中进行测试。", "authors": [{"name": "Gaia De Paciani"}, {"name": "Gesa Dünnweber"}, {"name": "Johannes Poersch"}, {"name": "Simon M. Linsel"}, {"name": "Henning Schlömer"}, {"name": "Fabian Grusdt"}], "featured_authors": [{"name": "Gaia De Paciani"}, {"name": "Gesa Dünnweber"}, {"name": "Johannes Poersch"}, {"name": "Simon M. Linsel"}, {"name": "Henning Schlömer"}, {"name": "Fabian Grusdt"}], "author_count": 6}, {"id": "2609.13399", "category": "cond-mat", "title": "Superconducting Diode Effect in Josephson $φ_0$ Junction", "abstract": "We investigate the superconducting diode effect in a Josephson junction with a ferromagnetic weak link in the presence of Rashba spin-orbit coupling. While the standard $\\varphi_0$ junction model is valid only for weak exchange fields $h \\lesssim T_c$, realistic ferromagnetic barriers typically operate in the regime $h \\gg T_c$, where the conventional Ginzburg-Landau gradient expansion becomes insufficient and requires the inclusion of higher order gradient terms to ensure stability of the free energy. By extending the free energy with such higher order term, we demonstrate that the linear gradient coupling alone leads to finite momentum Cooper pairing while leaving the critical current symmetry unchanged. The interplay between this linear term and the higher order gradient one leads to the Josephson diode effect.", "url": "https://arxiv.org/abs/2609.13399", "type": "理论", "summary": "我们研究了存在 Rashba 自旋轨道耦合的情况下具有铁磁弱连接的约瑟夫森结中的超导二极管效应。虽然标准 $\\varphi_0$ 结模型仅对弱交换场 $h \\lesssim T_c$ 有效，但现实的铁磁势垒通常在 $h \\gg T_c$ 状态下运行，其中传统的 Ginzburg-Landau 梯度展开变得不够，需要包含更高阶的梯度项以确保自由能的稳定性。通过用这样的高阶项扩展自由能，我们证明了线性梯度耦合单独导致有限动量库珀配对，同时保持临界电流对称性不变。该线性项与高阶梯度项之间的相互作用导致约瑟夫森二极管效应。", "authors": [{"name": "A. Janalizadeh"}, {"name": "Y. M. Shukrinov"}, {"name": "M. R. Kolahchi"}], "featured_authors": [{"name": "A. Janalizadeh"}, {"name": "Y. M. Shukrinov"}, {"name": "M. R. Kolahchi"}], "author_count": 3}, {"id": "2609.13411", "category": "cond-mat", "title": "Tripartite entanglement in chaotic eigenstates", "abstract": "It is now well-established that classical statistical mechanics emerges from the entanglement structure of quantum chaotic systems, as quantified by the (subsystem) eigenstate thermalization hypothesis (ETH). While this statement rests on the well-studied bipartite entanglement of the eigenstates of such systems, recent years have shown that many-body states are often characterized by multipartite entanglement, raising the question: what are the universal multipartite entanglement features of chaotic eigenstates? We answer this question in part by studying a tripartite generalization of the ergodic bipartition ansatz through the lens of two tripartite entanglement probes, the Rényi tripartite multi-entropy and the Rényi reflected entropy. We derive leading-order analytical expressions for the ensemble averages of both quantities using a saddle-point analysis. Beyond these measures, we obtain the average of the Rényi-2 reflected density matrix, $\\rho_{AA^*}^{(2)}$,which controls the Rényi-2 reflected entropy. We show that $\\rho_{AA^*}^{(2)}$ in a chaotic eigenstate is well-described by this ensemble average which, unlike an ordinary reduced density matrix, takes three qualitatively distinct forms across subsystem-size regimes, which may be viewed as a tripartite generalization of subsystem ETH. We benchmark our analytical predictions against exact diagonalization of the mixed-field Ising model.", "url": "https://arxiv.org/abs/2609.13411", "type": "理论+数值", "summary": "现在已经公认的是，经典统计力学是从量子混沌系统的纠缠结构中产生的，正如（子系统）本征态热化假说（ETH）所量化的那样。虽然这一说法基于对此类系统本征态的二分纠缠进行了充分研究，但近年来的研究表明，多体态通常具有多分纠缠的特征，这就提出了一个问题：混沌本征态的普遍多分纠缠特征是什么？我们通过两个三方纠缠探针（Rényi 三方多熵和 Rényi 反射熵）的透镜来研究遍历二分 ansatz 的三方概括，部分回答了这个问题。我们使用鞍点分析得出两个量的系综平均值的前序分析表达式。除了这些措施之外，我们还获得了 Rényi-2 反射密度矩阵的平均值 $\\rho_{AA^*}^{(2)}$，它控制着 Rényi-2 反射熵。\n\n我们证明，混沌本征态中的 $\\rho_{AA^*}^{(2)}$ 可以通过该系综平均值得到很好的描述，与普通的约简密度矩阵不同，它在子系统大小范围内采用三种性质不同的形式，这可以被视为子系统 ETH 的三方概括。我们根据混合场伊辛模型的精确对角化来对我们的分析预测进行基准测试。", "authors": [{"name": "Junjia Zhang"}, {"name": "Ramanjit Sohal"}, {"name": "Shinsei Ryu"}], "featured_authors": [{"name": "Junjia Zhang"}, {"name": "Ramanjit Sohal"}, {"name": "Shinsei Ryu"}], "author_count": 3}, {"id": "2609.13426", "category": "cond-mat", "title": "Spatial instability of a homogeneous superconductor after an interaction quench", "abstract": "We investigate the quantum dynamics of a conventional superconductor, described by the attrac- tive Hubbard model, driven far from equilibrium by quenching the Hubbard attraction. We evolve the full density matrix of the system in time using the Heisenberg equation of motion, tracking the spatiotemporal dynamics of the pairing and density fields. We use very weakly inhomogeneous initial conditions to probe the stability of the homogeneous dynamics to spatial perturbations. At initial times after the quench the pairing and density fields remain homogeneous in space while fluctuating in time. However, depending on the quench strength the spatially uniform dynamics can become unstable beyond a threshold time, with emergence of spatial textures. The onset time for the instability depends on the strength of the quench and the initial inhomogeneity. At long times the system evolves towards a state with significantly reduced spatial heterogeneity. The time dependence of the global superconducting order parameter suggests two broad categories of re- sponse to a quench. One of these involves strongly inhomogeneous pairing and bond currents in the nonequilibrium superconductor.", "url": "https://arxiv.org/abs/2609.13426", "type": "理论", "summary": "我们研究了传统超导体的量子动力学，由有吸引力的哈伯德模型描述，通过消除哈伯德吸引力而远离平衡。我们使用海森堡运动方程及时演化系统的全密度矩阵，跟踪配对和密度场的时空动力学。我们使用非常弱的非均匀初始条件来探讨均匀动力学对空间扰动的稳定性。在淬火后的初始时间，配对和密度场在空间上保持均匀，但在时间上波动。然而，根据淬火强度，空间均匀动力学在超过阈值时间后可能会变得不稳定，并出现空间纹理。不稳定的开始时间取决于淬火的强度和初始不均匀性。在很长一段时间内，系统会朝着空间异质性显着降低的状态演化。整体超导序参数的时间依赖性表明对失超的响应有两大类。其中之一涉及非平衡超导体中的强烈不均匀配对和键合电流。", "authors": [{"name": "Medha Roy Choudhury"}, {"name": "Sankha Subhra Bakshi"}, {"name": "Pinaki Majumdar"}, {"name": "Amit Ghosal"}], "featured_authors": [{"name": "Medha Roy Choudhury"}, {"name": "Sankha Subhra Bakshi"}, {"name": "Pinaki Majumdar"}, {"name": "Amit Ghosal"}], "author_count": 4}, {"id": "2609.13432", "category": "cond-mat", "title": "Fuzzy Erdos-Renyi random graphs: Spectral statistics", "abstract": "Within a random-matrix-theory (RMT) approach, we perform a detailed numerical study of the spectral statistics of fuzzy Erdos-Renyi (ER) random graphs. Specifically, we consider the membership values of the vertices and edges of a fuzzy ER graph model as random variables. In this way, the corresponding adjacency matrices become sparse matrices with random entries. Then, we apply standard RMT measures to characterize the eigenvalues and eigenvectors of ensembles of Hermitian and non-Hermitian adjacency matrices of both undirected and directed fuzzy graphs. We demonstrate that the average degree of the ER model serves as the scaling parameter of the spectral properties of the corresponding fuzzy setups.", "url": "https://arxiv.org/abs/2609.13432", "type": "理论+数值", "summary": "在随机矩阵理论 (RMT) 方法中，我们对模糊 Erdos-Renyi (ER) 随机图的谱统计进行了详细的数值研究。具体来说，我们将模糊 ER 图模型的顶点和边的隶属值视为随机变量。这样，相应的邻接矩阵就变成了具有随机条目的稀疏矩阵。然后，我们应用标准 RMT 度量来表征无向和有向模糊图的 Hermitian 和非 Hermitian 邻接矩阵系综的特征值和特征向量。我们证明 ER 模型的平均度可以作为相应模糊设置的光谱属性的缩放参数。", "authors": [{"name": "J. A. Mendez-Bermudez"}], "featured_authors": [{"name": "J. A. Mendez-Bermudez"}], "author_count": 1}, {"id": "2609.13474", "category": "cond-mat", "title": "Magnon Theory of Domain Wall Wavefronts and the Ballistic Diffusive Crossover in the Classical Anisotropic Landau Lifshitz Spin Chain", "abstract": "We study the far-from-equilibrium dynamics of domain-wall initial states in the integrable lattice Landau--Lifshitz spin chain. Building on the linear spin-wave description of domain-wall spreading, we derive the long-wavelength magnon dispersion directly from the microscopic integrable Hamiltonian and use it to characterize the propagation and broadening of the resulting wavefronts. The dispersion interpolates between a quadratic form at the isotropic point and a linear form in the easy-plane regime. In the isotropic limit, the quadratic dispersion leads to diffusive broadening, whereas in the easy-plane regime the domain-wall front propagates ballistically. Keeping the leading nonlinear correction to the linear dispersion gives a cubic dispersive term, which produces a characteristic $t^{1/3}$ broadening of the ballistic front. We further show that the sign of this cubic correction changes at a critical anisotropy, leading to a reversal of the dispersive wake from trailing to advancing. The resulting critical point occurs at $\\Delta_c=1/7$, corresponding to $\\gamma_c\\simeq 1.047$. Numerical simulations of the full nonlinear spin dynamics confirm the analytical scaling and demonstrate the coexistence of the amplitude-independent spin-wave front with amplitude-dependent nonlinear soliton propagation.", "url": "https://arxiv.org/abs/2609.13474", "type": "理论+数值", "summary": "我们研究了可积晶格 Landau-Lifshitz 自旋链中畴壁初始态的远离平衡动力学。基于畴壁扩展的线性自旋波描述，我们直接从微观可积哈密顿量导出长波长磁振子色散，并用它来表征所得波前的传播和展宽。色散在各向同性点的二次形式和易平面区域的线性形式之间进行插值。在各向同性极限下，二次色散导致扩散展宽，而在易平面状态下，畴壁前沿以弹道方式传播。对线性色散保持领先的非线性校正会产生三次色散项，从而产生弹道前沿的特征 $t^{1/3}$ 展宽。我们进一步表明，这种三次校正的符号在临界各向异性处发生变化，导致色散尾流从尾随逆转为前进。由此产生的临界点出现在 $\\Delta_c=1/7$ 处，对应于 $\\gamma_c\\simeq 1.047$。\n\n全非线性自旋动力学的数值模拟证实了解析标度，并证明了振幅无关的自旋波前与振幅相关的非线性孤子传播的共存。", "authors": [{"name": "Akash Sarkar"}], "featured_authors": [{"name": "Akash Sarkar"}], "author_count": 1}, {"id": "2609.13497", "category": "cond-mat", "title": "Scaling equations for Bose-Einstein condensate dynamics across all interaction regimes", "abstract": "We derive a unified set of scaling equations for Bose-Einstein condensates in time-dependent harmonic traps, connecting the weakly interacting Gaussian regime to the strongly interacting Thomas-Fermi regime. The exact Gross-Pitaevskii ground-state density is taken as a fixed profile in rescaled coordinates, with its dynamics described by three scaling factors corresponding to compression or expansion along the three spatial directions. The resulting equations contain no adjustable parameter, since their coefficients are determined once from the initial state. They recover analytically the Gaussian variational and Thomas-Fermi scaling equations in their respective limits and satisfy an axis-resolved virial theorem. The approach also yields the global phase and the low-lying collective-mode frequencies of the condensate. We benchmark the model against three-dimensional Gross-Pitaevskii simulations and against measured expansion energies. The model remains accurate across all interaction regimes, in strongly anisotropic traps, and along time-dependent sequences including a relatively fast quench, up to the point where the underlying frozen-profile hypothesis, shared by all three scaling approaches, breaks down.", "url": "https://arxiv.org/abs/2609.13497", "type": "理论+数值", "summary": "我们推导了与时间相关的谐波陷阱中玻色-爱因斯坦凝聚体的一组统一的标度方程，将弱相互作用的高斯体系与强相互作用的托马斯-费米体系联系起来。精确的 Gross-Pitaevskii 基态密度被视为重新缩放坐标中的固定轮廓，其动力学由对应于沿三个空间方向的压缩或膨胀的三个缩放因子描述。所得方程不包含可调整参数，因为它们的系数是从初始状态确定一次。他们在各自的极限内解析地恢复了高斯变分方程和托马斯-费米标度方程，并满足轴解析维里定理。该方法还产生了凝结水的整体相位和低位集体模式频率。我们根据三维 Gross-Pitaevskii 模拟和测量的膨胀能对模型进行基准测试。\n\n该模型在所有相互作用状态下、在强各向异性陷阱中以及沿着包括相对快速淬灭的时间依赖性序列保持准确，直到所有三种缩放方法共享的基础冻结剖面假设崩溃的点。", "authors": [{"name": "D. C. Marinica"}, {"name": "C. Puertas González"}, {"name": "T. Estrampes"}, {"name": "N. Gaaloul"}, {"name": "E. Charron"}], "featured_authors": [{"name": "D. C. Marinica"}, {"name": "C. Puertas González"}, {"name": "T. Estrampes"}, {"name": "N. Gaaloul"}, {"name": "E. Charron"}], "author_count": 5}, {"id": "2609.13532", "category": "cond-mat", "title": "Non-reactive sintering enhances density and ionic conductivity of NASICON solid electrolytes", "abstract": "NASICON materials are promising solid electrolytes for room-temperature sodium solid-state batteries and are typically synthesized via solid-state reaction. While sintering has been extensively studied, the effect of calcination on electrolyte properties remains poorly understood. In this work, the temperatures at which the NASICON phase forms in Na3Zr2Si2PO12 and Na3.4Zr2Si2.4P0.6O12 are identified. Calcination temperature is then varied between 900 °C and 1200 °C to obtain powders with different degrees of reaction prior to sintering. Under identical sintering conditions, higher NASICON phase content in the calcined powder is shown to yield denser electrolytes. Non-reactive sintering also improves grain boundary conductivity, increasing it by 130% for Na3.4Zr2Si2.4P0.6O12 and raising total conductivity from 1.60 to 2.95 mS/cm for powders calcined at 900 °C and 1200 °C, respectively. Finally, it is shown that phosphorus loss during processing compromises cycling stability against Na metal electrodes, and that adding off-stoichiometric phosphorus resolves this issue, while reaching a critical current density of 5.0 mA/cm^2 and a room-temperature conductivity of 3.82 mS/cm with over 400 hours of stable cycling. Overall, these findings directly relate synthesis and processing conditions to the final material properties and electrochemical performance of NASICON solid electrolytes.", "url": "https://arxiv.org/abs/2609.13532", "type": "理论", "summary": "NASICON 材料是用于室温钠固态电池的有前景的固体电解质，通常通过固态反应合成。尽管烧结已被广泛研究，但煅烧对电解质性能的影响仍知之甚少。在这项工作中，确定了 Na3Zr2Si2PO12 和 Na3.4Zr2Si2.4P0.6O12 中 NASICON 相形成的温度。然后将煅烧温度在900℃至1200℃之间变化，以获得在烧结前具有不同反应程度的粉末。在相同的烧结条件下，煅烧粉末中较高的 NASICON 相含量可产生更致密的电解质。非反应烧结还提高了晶界电导率，Na3.4Zr2Si2.4P0.6O12 的晶界电导率提高了 130%，而在 900 °C 和 1200 °C 下煅烧的粉末的总电导率分别从 1.60 mS/cm 提高到 2.95 mS/cm。\n\n最后，研究表明，加工过程中磷的损失会损害钠金属电极的循环稳定性，而添加非化学计量的磷可以解决这个问题，同时在稳定循环超过 400 小时的情况下达到 5.0 mA/cm^2 的临界电流密度和 3.82 mS/cm 的室温电导率。总体而言，这些发现将合成和加工条件与 NASICON 固体电解质的最终材料性能和电化学性能直接相关。", "authors": [{"name": "Andrea Cornelio"}, {"name": "Björn Mieller"}, {"name": "Johannes Baller"}, {"name": "Andrea Fantin"}, {"name": "Janina Roik"}, {"name": "Jessica Kindt"}, {"name": "Jonas Krug von Nidda"}, {"name": "Tim-Patrick Fellinger"}, {"name": "Gustav Graeber"}], "featured_authors": [{"name": "Andrea Cornelio"}, {"name": "Björn Mieller"}, {"name": "Johannes Baller"}, {"name": "Jonas Krug von Nidda"}, {"name": "Tim-Patrick Fellinger"}, {"name": "Gustav Graeber"}], "author_count": 9}, {"id": "2609.13541", "category": "cond-mat", "title": "Slow Thermalization and Long-Lived Coherence across Acoustic Phonon Branches in BAs", "abstract": "The exceptionally high thermal conductivity of cubic boron arsenide (BAs) arises from suppressed three-phonon scattering associated with its large acoustic--optical gap. In this regime, four-phonon processes become non-negligible, creating an unusual scattering hierarchy with unexplored consequences for nonequilibrium phonon dynamics. Here, time-resolved x-ray diffuse scattering reveals exceptionally slow, branch-dependent acoustic phonon thermalization and long-lived coherence. Exploiting branch sensitivity in one-phonon diffuse scattering, we resolve transverse acoustic (TA) and longitudinal acoustic (LA) thermalization times of 29.2 and 13.9~ps, respectively; even the LA timescale is at least three times that in common semiconductors. Phonon dispersion calculations assign coherent oscillations at 0.19 and 0.27~THz to the TA and LA modes, respectively; both persist with little decay over 50~ps, with comparable coherence found only in diamond. These findings provide a direct dynamical manifestation of the weak phonon scattering underlying the exceptional thermal transport of BAs.", "url": "https://arxiv.org/abs/2609.13541", "type": "理论+数值", "summary": "立方砷化硼（BA）具有极高的热导率，这是由于与其大的声光间隙相关的抑制三声子散射。在这种情况下，四声子过程变得不可忽略，创造了一个不寻常的散射层次结构，对非平衡声子动力学产生了未经探索的后果。在这里，时间分辨 X 射线漫散射揭示了异常缓慢的、依赖于分支的声声子热化和长寿命的相干性。利用单声子漫散射中的分支敏感性，我们分别解析了横向声学 (TA) 和纵向声学 (LA) 热化时间为 29.2 和 13.9~ps；甚至 LA 时间尺度也至少是普通半导体的三倍。声子色散计算将 0.19 和 0.27~THz 的相干振荡分别分配给 TA 和 LA 模式；两者都在超过 50ps 的时间内几乎没有衰减，只有在钻石中才具有类似的相干性。这些发现提供了 BA 异常热传输背后的弱声子散射的直接动力学表现。", "authors": [{"name": "Zeyu Xiang"}, {"name": "Ying Peng"}, {"name": "Ange Benise Niyikiza"}, {"name": "Fanghao Zhang"}, {"name": "Haoyuan Li"}, {"name": "Takahiro Sato"}, {"name": "Thomas Linker"}, {"name": "Yanwen Sun"}, {"name": "Meredith Henstridge"}, {"name": "Vincent Esposito"}, {"name": "James F. Cotter"}, {"name": "Diling Zhu"}, {"name": "Zhifeng Ren"}, {"name": "Bolin Liao"}], "featured_authors": [{"name": "Zeyu Xiang"}, {"name": "Ying Peng"}, {"name": "Ange Benise Niyikiza"}, {"name": "Diling Zhu"}, {"name": "Zhifeng Ren"}, {"name": "Bolin Liao"}], "author_count": 14}, {"id": "2609.13542", "category": "cond-mat", "title": "Local Response Theory of Electrified Interfaces from Screened Effective Charges", "abstract": "First-principles, electronic-structure simulations provide direct access to ground-state, global system properties. In the context of computational electrochemistry these are, e.g., bias-dependent energies, free energies, work functions, and capacitances. However, a comparably systematic local description of how these quantities respond to biasing via interfacial charging is still missing. Here, we introduce the screened electrochemical Born effective charge (SEBEC), a mixed total-energy derivative that measures the force response of an atomic degree of freedom to interfacial charging under electrochemical boundary conditions. SEBECs play the role for electrochemistry that Born effective charges play in the modern theory of polarization: they provide an unambiguous decomposition of global response and generate the same formal structures for structural relaxation, capacitance, and electrochemical Stark tuning that are familiar from solid-state response theory. The broader implication is a local response framework that brings electrochemical interfaces closer to the conceptual rigor long established for insulating solids.", "url": "https://arxiv.org/abs/2609.13542", "type": "理论+数值", "summary": "第一性原理、电子结构模拟提供了对基态、全局系统属性的直接访问。在计算电化学的背景下，这些是例如偏压相关能量、自由能、功函数和电容。然而，仍然缺乏对这些量如何响应界面充电偏置的相对系统的局部描述。在这里，我们介绍了筛选电化学玻恩有效电荷（SEBEC），这是一种混合总能量导数，用于测量电化学边界条件下原子自由度对界面充电的力响应。 SEBEC 在电化学中所扮演的角色就像玻恩有效电荷在现代极化理论中所扮演的角色一样：它们提供了全局响应的明确分解，并生成与固态响应理论中熟悉的结构弛豫、电容和电化学斯塔克调谐相同的形式结构。更广泛的含义是局部响应框架，使电化学界面更接近长期以来为绝缘固体建立的严格概念。", "authors": [{"name": "Nicolas G. Hörmann"}, {"name": "Nicolas Bergmann"}, {"name": "Karsten Reuter"}], "featured_authors": [{"name": "Nicolas G. Hörmann"}, {"name": "Nicolas Bergmann"}, {"name": "Karsten Reuter"}], "author_count": 3}, {"id": "2609.13656", "category": "cond-mat", "title": "Probing the anomalous symmetry-breaking in kagome material CsV3Sb5 via third-order nonlinearity", "abstract": "The kagome material has rapidly established itself as a research frontier in condensed matter physics, owing to its distinctive geometric structure and the rich array of unconventional physical phenomena. In the kagome AV3Sb5 (A = K, Rb, Cs) family, the charge-ordered state exhibits a remarkable characteristic, i.e., anomalous symmetry-breaking, which is tied to the topological nature of the electronic band structure. Here, we report the third-order nonlinear longitudinal and Hall responses that persist stably up to room temperature in the kagome material CsV3Sb5. Notably, the nonlinear responses demonstrate significant enhancement below the charge density wave (~ 77 K) order and anomalous symmetry-breaking (~ 39 K) state. The scaling analysis indicates that the third-order nonlinear transport is governed jointly by quantum geometric contribution and extrinsic scattering. This study realizes a giant third-order nonlinear response and provides a distinct method to detect anomalous symmetry-breaking in CsV3Sb5.", "url": "https://arxiv.org/abs/2609.13656", "type": "理论", "summary": "由于其独特的几何结构和丰富的非常规物理现象，戈薇材料迅速成为凝聚态物理的研究前沿。在kagome AV3Sb5（A = K，Rb，Cs）家族中，电荷有序态表现出一个显着的特征，即反常对称性破缺，这与电子能带结构的拓扑性质有关。在这里，我们报告了 kagome 材料 CsV3Sb5 中在室温下稳定持续的三阶非线性纵向和霍尔响应。值得注意的是，非线性响应表现出低于电荷密度波 (~ 77 K) 级和反常对称破缺 (~ 39 K) 状态的显着增强。标度分析表明，三阶非线性输运是由量子几何贡献和外在散射共同控制的。这项研究实现了巨大的三阶非线性响应，并提供了一种独特的方法来检测 CsV3Sb5 中的反常对称性破缺。", "authors": [{"name": "Zheng Dai"}, {"name": "Fengyi Guo"}, {"name": "Shuai Zhang"}, {"name": "Xiubing Li"}, {"name": "Congcong Li"}, {"name": "Yufan Ju"}, {"name": "Ziqi Wang"}, {"name": "Bin Cheng"}, {"name": "Zhe Ying"}, {"name": "Fengqi Song"}], "featured_authors": [{"name": "Zheng Dai"}, {"name": "Fengyi Guo"}, {"name": "Shuai Zhang"}, {"name": "Bin Cheng"}, {"name": "Zhe Ying"}, {"name": "Fengqi Song"}], "author_count": 10}, {"id": "2609.13658", "category": "cond-mat", "title": "Thixotropy versus viscoelasticity: a matter of time", "abstract": "Thixotropic and viscoelastic materials both retain their deformation history and are difficult to distinguish. However, a stationary linear response obeys the Kramers-Kronig relations. A structure that evolves during a sweep renders the spectrum inconsistent with them, so the residual from one chirp and no model measures nonstationarity. It survives the small-amplitude limit, returns to its baseline at any stationary state, and, for bounded restructuring, peaks near the structural time. We verify this on eight models and demonstrate it on published spectra of a thixotropic silica suspension.", "url": "https://arxiv.org/abs/2609.13658", "type": "理论", "summary": "触变材料和粘弹性材料都保留其变形历史并且难以区分。然而，平稳线性响应遵循 Kramers-Kronig 关系。在扫描过程中演变的结构使频谱与它们不一致，因此来自一个线性调频脉冲的残差并且没有模型可以测量非平稳性。它能够克服小幅度限制，在任何静止状态下返回到其基线，并且对于有界重组，在结构时间附近达到峰值。我们在八个模型上验证了这一点，并在已发布的触变二氧化硅悬浮液光谱上进行了演示。", "authors": [{"name": "Rishabh V. More"}], "featured_authors": [{"name": "Rishabh V. More"}], "author_count": 1}, {"id": "2609.13683", "category": "cond-mat", "title": "Heating of black-Si by microwaves at 2.45 GHz: effect of nano-needle orientation", "abstract": "Silicon, which is highly reflective and has negligible absorption at the microwave 2.45 GHz range, can be heated when it is turned into black-Si with a surface texture of nano-needles made by SF6/O2 plasma etching. Microwave heating of flat Si and of black-Si with vertical and with tilted (oriented) nano-needles was compared under identical conditions in a cylindrical TM010 resonator. Samples were placed horizontally on a 150-micrometer-thick cover glass, which standardized their height and position inside the cavity and allowed a common calibration of the radiation thermometer against a K-type thermocouple. Under a stepwise protocol of only 2-3-4 W of microwave power (60 s per step), black-Si with vertical needles reached ~ 260 C, systematically exceeding flat Si (~ 190 C), while black-Si with oriented needles showed a delayed but abrupt onset of heating at 3 W. In situ monitoring of the cavity resonance revealed a 2-3 MHz downshift of the resonance frequency f for all samples, with the drift consistently appearing once the sample temperature exceeded ~ 120 - 150 C, consistent with thermally activated carrier generation in Si. At a given temperature, each sample loads the cavity at a different f and quality factor Q, indicating an orientation-dependent effective permittivity of the nano-needle array, in line with the strong form birefringence of tilted black-Si. Application potential and challenges in the quantitative temperature and permittivity determination are discussed.", "url": "https://arxiv.org/abs/2609.13683", "type": "理论", "summary": "硅具有高反射性，在2.45 GHz微波范围内的吸收可以忽略不计，通过SF6/O2等离子刻蚀将其变成具有纳米针表面纹理的黑硅，可以对其进行加热。在相同条件下，在圆柱形 TM010 谐振器中对扁平硅和具有垂直和倾斜（定向）纳米针的黑硅的微波加热进行了比较。样品被水平放置在 150 微米厚的盖玻片上，该盖玻片标准化了样品在腔内的高度和位置，并允许根据 K 型热电偶对辐射温度计进行共同校准。在仅 2-3-4 W 微波功率（每步 60 秒）的逐步方案下，具有垂直针的黑硅达到约 260°C，系统地超过平面硅（约 190°C），而具有定向针的黑硅在 3W 时显示出延迟但突然的加热开始。对腔谐振的原位监测显示，所有样品的谐振频率 f 下移 2-3 MHz，一旦样品温度超过约 100°C，就会一致出现漂移。 120 - 150 C，与 Si 中热激活载流子的生成一致。\n\n在给定温度下，每个样品以不同的 f 和品质因数 Q 加载腔体，表明纳米针阵列的有效介电常数与方向相关，与倾斜黑硅的强形式双折射一致。讨论了定量温度和介电常数测定中的应用潜力和挑战。", "authors": [{"name": "Massimiliano Zamengo"}, {"name": "Haoran Mu"}, {"name": "Hsin-Hui Huang"}, {"name": "Tomas Katkus"}, {"name": "Darius Gailevičius"}, {"name": "Saulius Juodkazis"}, {"name": "Junko Morikawa"}], "featured_authors": [{"name": "Massimiliano Zamengo"}, {"name": "Haoran Mu"}, {"name": "Hsin-Hui Huang"}, {"name": "Darius Gailevičius"}, {"name": "Saulius Juodkazis"}, {"name": "Junko Morikawa"}], "author_count": 7}, {"id": "2609.13724", "category": "cond-mat", "title": "Lagrangian approach to origami vertex analysis: Multistability", "abstract": "Studying the multistability of origami structures presents challenges due to the nonlinearity of their kinematics and the high-dimensional configuration spaces that are difficult to visualize and explore exhaustively. To address this, we utilize the Lagrangian framework for origami to exploit symmetries and obtain reduced-dimensional slices of the configuration space. Our analysis of degree-6 vertices with reflection symmetry reveals topological transitions in their kinematic space as sector angles are varied, with implications for the number of symmetry-constrained minima and the emergence of metastable regions. These lower-dimensional slices are amenable to exhaustive search and visualization. A subsequent full-space stability analysis shows that 18 of 41 degree-6 and 14 of 45 degree-8 symmetry-constrained minima remain minima when all locally compatible perturbations, including those that break symmetry, are admitted. The metastable regions, which would likely be overlooked by numerical optimization alone, are influenced by the interplay between the boundaries of admissible kinematic space and crease mechanical properties. We extend our analysis to cone-like vertices with higher symmetry and one-degree-of-freedom kinematics, exploring symmetry-breaking phenomena, combinatorial structure, and their consequences for branchwise stability. The stability landscapes uncovered have potential applications in mechanical metamaterials, mechanical computing, origami-based robotics, and structures designed to self-deploy and retain their shape.", "url": "https://arxiv.org/abs/2609.13724", "type": "理论+数值", "summary": "由于折纸结构运动学的非线性和难以彻底可视化和探索的高维构型空间，研究折纸结构的多稳定性提出了挑战。为了解决这个问题，我们利用拉格朗日折纸框架来利用对称性并获得配置空间的降维切片。我们对具有反射对称性的 6 度顶点的分析揭示了当扇形角度变化时其运动空间中的拓扑转变，这对对称约束最小值的数量和亚稳态区域的出现有影响。这些低维切片适合详尽的搜索和可视化。随后的全空间稳定性分析表明，当承认所有局部兼容扰动（包括破坏对称性的扰动）时，41 度 6 度对称约束最小值中的 18 个和 45 度 8 度对称约束最小值中的 14 个仍保持最小值。仅通过数值优化可能会忽略的亚稳态区域受到允许运动空间边界和折痕机械性能之间相互作用的影响。\n\n我们将分析扩展到具有更高对称性和一自由度运动学的锥状顶点，探索对称破缺现象、组合结构及其对分支稳定性的影响。所发现的稳定性景观在机械超材料、机械计算、基于折纸的机器人以及设计用于自我部署和保持其形状的结构方面具有潜在的应用。", "authors": [{"name": "Matthew Grasinger"}, {"name": "Andrew Gillman"}, {"name": "Philip Buskohl"}], "featured_authors": [{"name": "Matthew Grasinger"}, {"name": "Andrew Gillman"}, {"name": "Philip Buskohl"}], "author_count": 3}, {"id": "2609.13762", "category": "cond-mat", "title": "Surrogate-assisted three-dimensional Gross--Pitaevskii characterization of Bose--Einstein condensate transport on an atom chip", "abstract": "We develop a surrogate-assisted workflow for millimeter-scale transport of a $^{87}$Rb Bose--Einstein condensate (BEC) on a multi-wire atom chip. Gradient-based inverse optimization generates 42 current schedules spanning seven regularization strengths and six transport durations. A low-cost Gaussian phase-space model ranks these schedules by endpoint overlap at three atom numbers. A Thomas--Fermi scaling (Ermakov) model estimates cloud dimensions for case-specific moving-grid construction. We then evaluate selected schedules in detail with the three-dimensional Gross--Pitaevskii equation (GPE). At $N=10^3$ and $T=0.5$ s, the surrogate predicts a larger axial center-of-mass (COM) excursion than at longer durations. The GPE confirms this prediction and reveals sloshing that persists through delivery, with an endpoint fidelity $F_{3D}=0.9244$. For all five longer transports, the surrogate predicts near-unit endpoint overlap for the top-ranked schedules, and GPE propagation using these schedules gives $F_{3D}>0.9997$. At $N=10^4$ and $T=2.0$ s, the surrogate-selected schedule similarly gives $F_{3D}=0.999932$. These results demonstrate that the surrogate estimates provide a useful low-cost basis for candidate screening, while GPE propagation resolves the transport dynamics and the delivered condensate state.", "url": "https://arxiv.org/abs/2609.13762", "type": "理论+数值", "summary": "我们开发了一种替代辅助工作流程，用于在多线原子芯片上进行 $^{87}$Rb 玻色-爱因斯坦凝聚 (BEC) 的毫米级传输。基于梯度的逆优化生成 42 个当前时间表，涵盖 7 个正则化强度和 6 个传输持续时间。低成本高斯相空间模型通过三个原子数的端点重叠对这些时间表进行排序。托马斯-费米标度（Ermakov）模型估计特定情况的移动网格构造的云尺寸。然后，我们使用三维 Gross--Pitaevskii 方程 (GPE) 详细评估选定的时间表。在 $N=10^3$ 和 $T=0.5$ s 时，代理预测比较长持续时间时更大的轴向质心 (COM) 偏移。 GPE 证实了这一预测，并揭示了在整个交付过程中持续存在的晃动，端点保真度为 $F_{3D}=0.9244$。对于所有五个较长的传输，代理预测排名靠前的调度的近单元端点重叠，并且使用这些调度的 GPE 传播给出 $F_{3D}>0.9997$。在 $N=10^4$ 和 $T=2.0$ s 处，代理选择的时间表类似地给出 $F_{3D}=0.999932$。\n\n这些结果表明，替代估计为候选筛选提供了有用的低成本基础，而 GPE 传播解决了输运动力学和传递的冷凝态。", "authors": [{"name": "Naoki Shibuya"}], "featured_authors": [{"name": "Naoki Shibuya"}], "author_count": 1}, {"id": "2609.13787", "category": "cond-mat", "title": "Thermodynamic geometry of inclusion statistics", "abstract": "We investigate the thermodynamic geometry of an ideal quantum gas obeying inclusion statistics, characterized by a negative statistical parameter $g < 0$. In this framework the grand-canonical partition function admits a finite maximum fugacity, and the thermodynamic scalar curvature $R$ is strictly positive for all $g < 0$, reflecting effective attractive statistical interactions analogous to those of a bosonic system. As the fugacity approaches its maximum value, $R$ diverges, signaling a phase transition of the Bose-Einstein condensation type. A key distinction from the ordinary ideal Bose gas is that the condensation temperature is elevated relative to the bosonic case, and finite-temperature condensation occurs even in the dimensional regime $1/2 < D/\\sigma \\leq 1$ where standard bosons do not condense, while for $D/\\sigma \\leq 1/2$ the transition temperature vanishes. Three independent criteria; divergence of $R$, the maximum fugacity singularity, and the non-analytic cusp in the specific heat, coincide at the same condensation point, confirming the thermodynamic consistency of the transition.", "url": "https://arxiv.org/abs/2609.13787", "type": "理论", "summary": "我们研究了服从包含统计的理想量子气体的热力学几何，其特征是负统计参数 $g < 0$。在此框架中，大正则配分函数允许有限的最大逸度，并且热力学标量曲率 $R$ 对于所有 $g < 0$ 严格为正，反映了类似于玻色子系统的有效有吸引力的统计相互作用。当逸度接近其最大值时，$R$ 发散，标志着玻色-爱因斯坦凝聚类型的相变。与普通理想玻色气体的一个关键区别在于，凝结温度相对于玻色子情况有所升高，即使在标准玻色子不凝结的尺寸范围 $1/2 < D/\\sigma \\leq 1$ 中，有限温度凝结也会发生，而对于 $D/\\sigma \\leq 1/2$ ，转变温度消失。三个独立的标准； $R$ 的散度、最大逸度奇点和比热的非解析尖点在同一凝结点处重合，证实了转变的热力学一致性。", "authors": [{"name": "M. H. Naghizadeh Ardabili"}, {"name": "Omid Yahyayi Monem"}, {"name": "Habib Esmaili"}, {"name": "Zahra Ebadi"}, {"name": "Hosein Mohammadzadeh"}], "featured_authors": [{"name": "M. H. Naghizadeh Ardabili"}, {"name": "Omid Yahyayi Monem"}, {"name": "Habib Esmaili"}, {"name": "Zahra Ebadi"}, {"name": "Hosein Mohammadzadeh"}], "author_count": 5}, {"id": "2609.13834", "category": "cond-mat", "title": "On Rare Nonresonant Regions and Subdiffusive Transport in an Interacting Disordered Quantum Chain", "abstract": "We study rare nonresonant regions in a canonical one-dimensional disordered quantum spin chain by directly implementing the iterated Schrieffer-Wolff construction underlying the recent work of De Roeck, Giacomin, Huveneers and Prosniak on subdiffusive transport. For finite systems, we compute the probability that a disorder realization remains nonresonant through successive scales of the flow, while separately monitoring operator proliferation and the spatial localization of dressed local observables. The survival probability decays at most exponentially with system size over the numerically accessible regime. Resolving this decay scale by scale yields failure rates associated with successive Schrieffer-Wolff steps. The first rate is obtained analytically in excellent agreement with numerics, while higher-scale rates decrease rapidly throughout the regime studied. These results support the summability mechanism required for exponentially rare but parametrically long nonresonant regions, which provide the insulating bottlenecks responsible for subdiffusive transport. At the smallest couplings studied, the survival probability under our conditions exceeds the rigorous lower bound by six to seven orders of magnitude, demonstrating how conservative the constants required by the proof are while confirming that its underlying physical mechanism is quantitatively visible at accessible scales. More broadly, our results show how direct numerical implementations can provide an independent and physically transparent test of technically demanding constructive proofs, a methodology that may become increasingly useful as machine-assisted proofs become more common.", "url": "https://arxiv.org/abs/2609.13834", "type": "理论+数值", "summary": "我们通过直接实现迭代 Schrieffer-Wolff 结构来研究规范一维无序量子自旋链中的罕见非共振区域，该结构是 De Roeck、Giacomin、Huveneers 和 Prosniak 最近关于次扩散输运工作的基础。对于有限系统，我们计算无序实现通过连续的流尺度保持非共振的概率，同时单独监视算子扩散和修饰的局部可观测量的空间定位。在数值可访问的范围内，生存概率随着系统规模的增加而最多呈指数衰减。按规模解决这种衰减规模会产生与连续的 Schrieffer-Wolff 步骤相关的失败率。第一个速率是通过分析获得的，与数值非常一致，而更高规模的速率在整个研究范围内迅速下降。这些结果支持指数稀有但参数长的非谐振区域所需的可求和机制，该区域提供了负责次扩散传输的绝缘瓶颈。\n\n在研究的最小耦合下，我们条件下的生存概率超出了严格的下限六到七个数量级，这证明了证明所需的常数是多么保守，同时确认其潜在的物理机制在可访问的尺度上是定量可见的。更广泛地说，我们的结果表明，直接数值实现如何为技术要求高的构造性证明提供独立且物理透明的测试，随着机器辅助证明变得更加普遍，这种方法可能会变得越来越有用。", "authors": [{"name": "A. Scardicchio"}, {"name": "S. L. Sondhi"}], "featured_authors": [{"name": "A. Scardicchio"}, {"name": "S. L. Sondhi"}], "author_count": 2}, {"id": "2609.13884", "category": "cond-mat", "title": "A Direct Algebraic Approach to Normal Ordering of Exponential Bosonic Operators with Applications to Two-Dimensional Excitonic Form Factors", "abstract": "We develop a systematic algebraic approach, based on the Wei--Norman factorization method, to the normal ordering of exponential bosonic operators and apply it to derive analytical excitonic form factors in two-dimensional semiconducting materials. By introducing an auxiliary parameter, the normal-ordering problem is reduced to a system of ordinary differential equations determined by the commutation relations of the underlying closed Lie algebra. The approach is first illustrated for exponential operators associated with the Heisenberg--Weyl and $su(1,1)$ algebras, and is then extended to two-mode bosonic operators involving $su(2)$ and a six-generator closed algebra that contains two coupled $su(1,1)$ subalgebras. For the excitonic application, the Levi--Civita transformation maps the two-dimensional exciton problem onto an oscillator representation, providing a natural formulation in terms of bosonic creation and annihilation operators. Combined with the Laplace and Fourier representations of the Rytova--Keldysh potential, this formulation reduces the interaction matrix elements to the evaluation of exponential bosonic form factors. The isotropic problem is governed by a three-generator $su(1,1)$ algebra, whereas the anisotropic case requires the full six-generator algebra together with an additional $su(2)$ factorization. Explicit analytical expressions for both form factors, $\\langle e^{-rt}\\rangle$ and $\\langle e^{i\\mathbf q\\cdot\\mathbf r}\\rangle$, are obtained, providing useful building blocks for matrix-element calculations in two-dimensional excitonic systems and potentially in other quantum problems involving exponential bosonic operators.", "url": "https://arxiv.org/abs/2609.13884", "type": "理论+数值", "summary": "我们开发了一种基于 Wei-Norman 分解方法的系统代数方法，用于指数玻色子算子的正常排序，并将其应用于二维半导体材料中的解析激子形状因子。通过引入辅助参数，正序问题被简化为由基础闭李代数的交换关系确定的常微分方程组。该方法首先针对与 Heisenberg--Weyl 和 $su(1,1)$ 代数相关的指数算子进行说明，然后扩展到涉及 $su(2)$ 和包含两个耦合 $su(1,1)$ 子代数的六生成器闭合代数的两模玻色子算子。对于激子应用，列维-奇维塔变换将二维激子问题映射到振荡器表示上，提供了玻色子产生和湮灭算子的自然公式。结合 Rytova-Keldysh 势的拉普拉斯和傅里叶表示，该公式将相互作用矩阵元素简化为指数玻色子形状因子的评估。\n\n各向同性问题由三元 $su(1,1)$ 代数控制，而各向异性情况则需要完整的六元代数以及额外的 $su(2)$ 分解。获得了两种形状因子 $\\langle e^{-rt}\\rangle$ 和 $\\langle e^{i\\mathbf q\\cdot\\mathbf r}\\rangle$ 的显式解析表达式，为二维激子系统中的矩阵元素计算以及可能在涉及指数玻色子算子的其他量子问题中提供有用的构建块。", "authors": [{"name": "Duy-Anh P. Nguyen"}, {"name": "Ngoc-Tram D. Hoang"}, {"name": "Dang-Khoa D. Le"}, {"name": "Van-Hoang Le"}], "featured_authors": [{"name": "Duy-Anh P. Nguyen"}, {"name": "Ngoc-Tram D. Hoang"}, {"name": "Dang-Khoa D. Le"}, {"name": "Van-Hoang Le"}], "author_count": 4}, {"id": "2609.13912", "category": "cond-mat", "title": "Unbiased first-principles construction of complete tensorial spin Hamiltonians", "abstract": "Magnetic ground states are commonly predicted using spin Hamiltonians whose interaction terms are selected a priori, potentially overlooking the microscopic interactions that govern complex magnetic order. Here, we introduce a general framework for the unbiased first-principles construction of symmetry-complete tensorial spin Hamiltonians and its automated implementation in AMATIS. The framework constructs the Hamiltonian directly from density-functional theory while rigorously enforcing quantum spin algebra and crystallographic symmetry. Applied to representative two-dimensional van der Waals magnets, the framework reproduces established magnetic interactions and uncovers hidden physics beyond conventional spin models, including chiral interactions that stabilize metastable skyrmions, higher-rank tensorial interactions that reconstruct the magnetic phase diagram and establish stabilizing competing multi-Q phases, and an emergent p-wave altermagnetic electronic structure. Our results demonstrate that unbiased tensorial Hamiltonian construction provides a predictive alternative to the conventional practice of manually selecting spin-model interactions, enabling first-principles discovery of unconventional magnetic phases.", "url": "https://arxiv.org/abs/2609.13912", "type": "理论+数值", "summary": "磁性基态通常使用自旋哈密顿量来预测，其相互作用项是先验选择的，可能忽略了控制复杂磁序的微观相互作用。在这里，我们介绍了对称完全张量自旋哈密顿量的无偏第一原理构造的通用框架及其在 AMATIS 中的自动实现。该框架直接从密度泛函理论构建哈密顿量，同时严格执行量子自旋代数和晶体学对称性。应用于代表性二维范德瓦尔斯磁体时，该框架再现了已建立的磁相互作用，并揭示了传统自旋模型之外的隐藏物理现象，包括稳定亚稳态斯格明子的手性相互作用、重建磁相图并建立稳定竞争多Q相的高阶张量相互作用，以及新兴的p波交磁电子结构。\n\n我们的结果表明，无偏张量哈密顿量构造为手动选择自旋模型相互作用的传统实践提供了预测性替代方案，从而实现了非常规磁相的第一原理发现。", "authors": [{"name": "Haichang Lu"}, {"name": "Boyang Deng"}, {"name": "Hiroshi Katsumoto"}, {"name": "John Robertson"}, {"name": "Weisheng Zhao"}, {"name": "Stefan Blügel"}], "featured_authors": [{"name": "Haichang Lu"}, {"name": "Boyang Deng"}, {"name": "Hiroshi Katsumoto"}, {"name": "John Robertson"}, {"name": "Weisheng Zhao"}, {"name": "Stefan Blügel"}], "author_count": 6}, {"id": "2609.13939", "category": "cond-mat", "title": "Towards a Metal-Organic Framework with Pore-Confined Electrons", "abstract": "Electrides are an unconventional class of materials in which electrons are localized in crystallographic void spaces rather than solely around atomic nuclei, giving rise to appealing properties such as low work functions, strong electron-donating character, and even superconductivity. Here, we use ab initio methods to investigate metal-organic framework (MOF) electrides, a new class of materials that combines the interstitial electrons of electrides with the permanent porosity and chemical tunability of MOFs. These materials host pore-confined electrons: occupied electronic states localized in the pore space and with bands slightly below or crossing through the Fermi level. Using density functional theory calculations, we establish several design rules for stabilizing pore-confined electrons in MOFs via an anion-electron exchange process and identify candidate MOF electrides. As a proof-of-concept, we also demonstrate that the pore-confined electrons can directly facilitate chemical reactions, substantially lowering the activation barrier for H2 dissociation without requiring adsorption at a surface site. We envision that pore-confined electrons in nanoporous materials may enable a fundamentally new type of catalysis in which chemical reactions take place in the pore space, driven by electron-centered active sites.", "url": "https://arxiv.org/abs/2609.13939", "type": "理论+数值", "summary": "电子化合物是一类非常规材料，其中电子位于晶体空隙空间中，而不仅仅是原子核周围，从而具有低逸出功、强给电子特性甚至超导性等吸引人的特性。在这里，我们使用从头计算的方法来研究金属有机骨架（MOF）电子化合物，这是一种将电子化合物的间隙电子与MOF的永久孔隙率和化学可调性相结合的新型材料。这些材料拥有孔隙限制电子：占据的电子态位于孔隙空间中，并且能带略低于或穿过费米能级。利用密度泛函理论计算，我们建立了几种设计规则，通过阴离子-电子交换过程稳定 MOF 中的孔隙限制电子，并确定了候选 MOF 电子化合物。作为概念验证，我们还证明孔隙限制电子可以直接促进化学反应，显着降低 H2 解离的活化势垒，而不需要在表面位点吸附。\n\n我们设想，纳米多孔材料中的孔隙限制电子可能会实现一种全新类型的催化，其中化学反应在以电子为中心的活性位点的驱动下在孔隙空间中发生。", "authors": [{"name": "Julia H. Baratta"}, {"name": "Andrew S. Rosen"}], "featured_authors": [{"name": "Julia H. Baratta"}, {"name": "Andrew S. Rosen"}], "author_count": 2}, {"id": "2609.13987", "category": "cond-mat", "title": "Sequential Retrieval in Dense Associative Memory: Asymptotic Dynamics and Storage Capacity", "abstract": "We study the retrieval dynamics of an $n$-body asymmetric dense associative memory model, in which sequential retrieval is implemented by shifting one pattern index in the higher-order Hebbian interaction. The model exhibits sequential retrieval of the stored patterns, and the retrieval state corresponds to a stable limit-cycle attractor. The storage capacity is defined as the maximum loading rate for which this limit cycle remains stable. Using generating functional analysis, we derive the dynamical equations describing the sequential retrieval state. The generating functional analysis reveals that the retarded self-interaction term vanishes in the asymmetric model, and the resulting overlap dynamics is reproduced by an Amari-Maginu-type signal-to-noise analysis. Also, we find that for the interaction order $n\\ge 3$, the normalized storage capacity decreases monotonically with increasing interaction order, in contrast to symmetric Modern Hopfield models.", "url": "https://arxiv.org/abs/2609.13987", "type": "理论", "summary": "我们研究了 $n$ 体不对称密集联想记忆模型的检索动力学，其中顺序检索是通过在高阶赫布交互中移动一个模式索引来实现的。该模型表现出存储模式的顺序检索，并且检索状态对应于稳定的极限环吸引子。存储容量定义为该极限环保持稳定的最大负载率。使用生成泛函分析，我们推导出描述顺序检索状态的动力学方程。生成泛函分析表明，延迟的自相互作用项在不对称模型中消失，并且所产生的重叠动态通过 Amari-Maginu 型信噪分析来再现。此外，我们发现，对于交互阶数 $n\\ge 3$，归一化存储容量随着交互阶数的增加而单调减小，与对称现代 Hopfield 模型相反。", "authors": [{"name": "Mao Mishima"}, {"name": "Ayaka Sakata"}, {"name": "Kazushi Mimura"}], "featured_authors": [{"name": "Mao Mishima"}, {"name": "Ayaka Sakata"}, {"name": "Kazushi Mimura"}], "author_count": 3}, {"id": "2609.13996", "category": "cond-mat", "title": "Local pair correlations and network geometry govern collective oscillations in nonreciprocal Ising networks", "abstract": "Nonreciprocal many-body dynamics can develop a swap phase characterized by spontaneous global oscillations far from equilibrium. To determine how local nonreciprocal interactions predict global oscillations and how broadly this prediction applies, we compare mean-field theory, independent-node theory, and nearest-neighbor spin-coupling theory for a two-spin nonreciprocal Ising model on networks of fixed coordination number (\\(z=4\\)). Nearest-neighbor spin-coupling theory retains nine independent joint edge probabilities. Monte Carlo benchmarks show that it predicts the oscillation amplitude, angular momentum, and period on edge-swapped networks with a 2.1\\% aggregate mean absolute relative error. We then extend the square lattice to degree-preserving edge-swapped networks and find sharply different behavior. With increasing system size, the oscillation amplitude and angular momentum decay strongly on the periodic square lattice but remain nearly size independent on edge-swapped networks. These results show that identical local parameters do not determine the macroscopic phase. The contrasting finite-size trends identify network geometry as a key determinant of collective oscillations at fixed local interaction parameters.", "url": "https://arxiv.org/abs/2609.13996", "type": "理论+数值", "summary": "非互易多体动力学可以发展出一个交换阶段，其特征是远离平衡的自发全局振荡。为了确定局部非互易相互作用如何预测全局振荡以及该预测的适用范围，我们比较了固定配位数 (\\(z=4\\)) 网络上的双自旋非互易 Ising 模型的平均场理论、独立节点理论和最近邻自旋耦合理论。最近邻自旋耦合理论保留了九个独立的联合边缘概率。蒙特卡罗基准测试表明，它可以预测边缘交换网络上的振荡幅度、角动量和周期，总平均绝对相对误差为 2.1%。然后，我们将方格扩展到保度边缘交换网络，并发现截然不同的行为。随着系统尺寸的增加，振荡幅度和角动量在周期性方晶格上强烈衰减，但在边缘交换网络上几乎保持尺寸独立。这些结果表明相同的局部参数并不能确定宏观相位。\n\n对比有限尺寸趋势将网络几何形状确定为固定局部交互参数下集体振荡的关键决定因素。", "authors": [{"name": "Zihua Liu"}, {"name": "Xudong Wu"}, {"name": "Liantuan Xiao"}], "featured_authors": [{"name": "Zihua Liu"}, {"name": "Xudong Wu"}, {"name": "Liantuan Xiao"}], "author_count": 3}, {"id": "2609.14134", "category": "cond-mat", "title": "Exact solutions of hidden free fermion models", "abstract": "Hidden-free-fermion (HFF) Hamiltonians exhibit free-fermion spectra despite lacking an explicit quadratic representation, yet their algebraic provenance and periodic-boundary behavior remain open questions. Here we establish that a broad class of HFF models arises from distinct Lax operator realizations of a twisted multistate Perk--Schultz \\(R\\) matrix. Its reflected degeneration generates a closed finite hierarchy of mutually commuting transfer matrices, whose functional relations determine the complete many-body spectrum. As a decisive example, we solve the inhomogeneous free-fermions-in-disguise (FFD) chain, which exhibits HFF, nested HFF, or interacting spectra, depending on its coupling. The homogeneous FFD chain with both one-wrap and periodic boundary conditions exhibits an emergent cubic finite-size gap while retaining the exact \\(z=3/2\\) bulk behavior. The construction extends to higher-state and face-type realizations, providing a common algebraic framework for coupling-dependent spectral organization and multiscale behavior in interacting quantum systems.", "url": "https://arxiv.org/abs/2609.14134", "type": "理论", "summary": "尽管缺乏明确的二次表示，隐藏自由费米子（HFF）哈密顿量仍表现出自由费米子谱，但它们的代数起源和周期性边界行为仍然是悬而未决的问题。在这里，我们确定了一大类 HFF 模型源自扭曲多态 Perk--Schultz \\(R\\) 矩阵的不同 Lax 算子实现。其反射退化生成相互交换传递矩阵的封闭有限层次结构，其函数关系决定完整的多体谱。作为一个决定性的例子，我们解决了非齐次的伪装自由费米子 (FFD) 链，该链表现出 HFF、嵌套 HFF 或相互作用光谱，具体取决于其耦合。具有单绕和周期性边界条件的同质 FFD 链表现出一种新兴的立方有限尺寸间隙，同时保留了精确的 \\(z=3/2\\) 体行为。该结构扩展到更高的状态和面型实现，为相互作用的量子系统中依赖于耦合的光谱组织和多尺度行为提供了通用的代数框架。", "authors": [{"name": "Mingchen Zheng"}, {"name": "Balázs Pozsgay"}, {"name": "Shu Chen"}], "featured_authors": [{"name": "Mingchen Zheng"}, {"name": "Balázs Pozsgay"}, {"name": "Shu Chen"}], "author_count": 3}, {"id": "2609.14179", "category": "cond-mat", "title": "Ultrafast Magnetization Induced from Raman-Active Axial Chiral Phonons", "abstract": "Axial chiral phonons, which carry angular momentum and exhibit unusually large magnetic moments, provide a new degree of freedom for controlling the time-reversal symmetry and magnetic properties of quantum materials. While infrared-active axial phonons are efficiently excited to large amplitudes by circularly polarized terahertz pulses, their application may be constrained by short lifetimes, small penetration depths, low spatial resolution, and limited availability of optical sources. Here, we report that an axial Raman-active phonon mode in CeF3 exhibits a significant magnetic moment and an exceedingly long lifetime that more closely matches the paramagnetic spin dynamics. The axial phonon population is resonantly driven by a near-infrared laser pulse with rotating linear polarization, known as an optical centrifuge, a coherent control scheme never applied to solids before. The phonon-driven magnetization observed by time-resolved Faraday rotation scales quadratically with incident power and rapidly decreases at high temperatures, consistent with phonon inverse Faraday effect from many-body spin-phonon coupling. Our findings open a new avenue for using shaped laser pulses from widely accessible light sources to manipulate coherent axial chiral phonons and ultrafast spintronics.", "url": "https://arxiv.org/abs/2609.14179", "type": "理论+数值", "summary": "轴向手性声子携带角动量并表现出异常大的磁矩，为控制量子材料的时间反转对称性和磁性提供了新的自由度。虽然红外活性轴向声子被圆偏振太赫兹脉冲有效地激发到大振幅，但它们的应用可能受到寿命短、穿透深度小、空间分辨率低和光源可用性有限的限制。在这里，我们报告了 CeF3 中的轴向拉曼活性声子模式表现出显着的磁矩和极长的寿命，与顺磁自旋动力学更加匹配。轴向声子群由具有旋转线性偏振的近红外激光脉冲共振驱动，称为光学离心机，这是一种以前从未应用于固体的相干控制方案。通过时间分辨法拉第旋转观察到的声子驱动磁化强度与入射功率呈二次方关系，并且在高温下迅速减小，这与多体自旋声子耦合的声子逆法拉第效应一致。\n\n我们的研究结果为使用来自广泛可用光源的成形激光脉冲来操纵相干轴向手性声子和超快自旋电子学开辟了一条新途径。", "authors": [{"name": "Chuankun Huang"}, {"name": "Alexander Milner"}, {"name": "Jiaming Luo"}, {"name": "Jianbo Ye"}, {"name": "Gaihua Ye"}, {"name": "Junjie Zhang"}, {"name": "Cynthia Nnokwe"}, {"name": "Boris I. Yakobson"}, {"name": "Rui He"}, {"name": "Valery Milner"}, {"name": "Hanyu Zhu"}], "featured_authors": [{"name": "Chuankun Huang"}, {"name": "Alexander Milner"}, {"name": "Jiaming Luo"}, {"name": "Rui He"}, {"name": "Valery Milner"}, {"name": "Hanyu Zhu"}], "author_count": 11}, {"id": "2609.14191", "category": "cond-mat", "title": "Haldane-Holstein model at fractional filling: Route to bosonic fractional Chern insulator and quantum anomalous Hall crystal", "abstract": "Electron-phonon coupling is generally expected to suppress band topology, driving a topological band insulator into a trivial phase. Here we show that, using the prototypical Haldane-Holstein model at partial filling of a topological band, strong electron-phonon coupling can instead stabilize topological phases of matter. The electron-phonon coupling plays a double role: it generates the longer-range interactions that correlate the carriers and, in the attractive channel, also binds them into bosonic pairs. For spinful electrons, it pairs opposite spins into charge-$2e$ bipolarons that form a bosonic fractional Chern insulator (FCI) at filling $\\nu=1/2$ with charge-$e$ semionic excitations. Tuning the band topology and the coupling strength maps out a rich phase diagram containing this bosonic FCI, superconductors condensed at the $M$ and $K$ points, and several charge-ordered solids. For spin-polarized electrons, strong coupling instead stabilizes a $C=2$ quantum anomalous Hall crystal (QAHC) at $\\nu=1/3$. Electron-phonon coupling thus emerges as a route to, rather than an obstruction against, topology in partially filled Chern bands.", "url": "https://arxiv.org/abs/2609.14191", "type": "理论+数值", "summary": "通常期望电子声子耦合能够抑制能带拓扑，从而驱动拓扑能带绝缘体进入平凡相。在这里，我们证明，使用部分填充拓扑带的原型 Haldane-Holstein 模型，强电子声子耦合可以稳定物质的拓扑相。电子-声子耦合起着双重作用：它产生与载流子相关的长程相互作用，并在吸引通道中将它们结合成玻色子对。对于自旋电子，它将相反的自旋配对成电荷 $2e$ 双极子，在用电荷 $e$ 半子激发填充 $\\nu=1/2$ 时形成玻色分数陈绝缘体 (FCI)。调整能带拓扑和耦合强度可以绘制出丰富的相图，其中包含玻色子 FCI、在 $M$ 和 $K$ 点凝聚的超导体以及几个电荷有序固体。对于自旋极化电子，强耦合将 $C=2$ 量子反常霍尔晶体 (QAHC) 稳定在 $\\nu=1/3$。因此，电子声子耦合成为部分填充的陈氏能带拓扑的一种途径，而不是阻碍。", "authors": [{"name": "Zezhu Wei"}, {"name": "Ang-Kun Wu"}, {"name": "Di Xiao"}, {"name": "Shi-Zeng Lin"}], "featured_authors": [{"name": "Zezhu Wei"}, {"name": "Ang-Kun Wu"}, {"name": "Di Xiao"}, {"name": "Shi-Zeng Lin"}], "author_count": 4}, {"id": "2609.14241", "category": "cond-mat", "title": "The effect of light scattering in cavity electrodynamics: Fresnel equations with decoherence", "abstract": "We consider the effect of light decoherence in a Fabri-Perot (FP) microcavity. We show that, when present, it may significantly change its linear response to the incident this http URL optical properties of the bounding mirrors are described using the classical electrodynamics, and the light scattering causing the phase breaking is treated as a multichannel scattering problem employing a model introduced by Büttiker to describe dephasing in electron transport. We show that the dephasing causes a gradual erosion of the cavity photon mode and thus impedes the formation of molecular polaritons. Consequently, the polaritons signatures in the transmission and absorption optical spectra of the microcavity are fading away as the scattering intensifies.", "url": "https://arxiv.org/abs/2609.14241", "type": "理论", "summary": "我们考虑法布里-珀罗 (FP) 微腔中光退相干的影响。我们表明，当存在时，它可能会显着改变其对入射的线性响应，使用经典电动力学描述边界镜的光学特性，并且使用 Büttiker 引入的模型来描述电子传输中的相移，将导致相破坏的光散射视为多通道散射问题。我们表明，移相会导致腔光子模式逐渐侵蚀，从而阻碍分子极化子的形成。因此，随着散射的加剧，微腔的透射和吸收光谱中的极化子特征逐渐消失。", "authors": [{"name": "Natalya A. Zimbovskaya"}, {"name": "Abraham Nitzan"}], "featured_authors": [{"name": "Natalya A. Zimbovskaya"}, {"name": "Abraham Nitzan"}], "author_count": 2}, {"id": "2609.14390", "category": "cond-mat", "title": "Reservoir-conditioned virtual returns generate random Liouvillian skin localization in a reciprocal Mott insulator", "abstract": "Directional dissipation can concentrate relaxation modes in space, but connecting this accumulation to controlled microscopic processes in correlated matter requires separating virtual charge motion from spin coherence. We study this connection in a half-filled Hubbard chain with reciprocal hopping and number-conserving, direction-selective returns of virtual doublon--hole defects. Eliminating charge defects and then Mott coherences yields asymmetric spin-exchange rates under an explicit separation of timescales, with full short-chain dynamics supporting the reduction on finite exchange times. Balanced random returns concentrate the stationary population and several low-lying right modes at sample-selected positions rather than a predetermined edge, producing random Liouvillian skin localization despite zero end-to-end logarithmic rate bias. The accumulated rate imbalance determines an exact finite-density hard-core stationary state and a one-particle activated relaxation scale governed by random barriers. This connection between locally calibrated return rates, many-body stationary weights and slow relaxation offers a means of controlling transport in constrained open quantum matter without changing the reciprocal Hamiltonian.", "url": "https://arxiv.org/abs/2609.14390", "type": "理论", "summary": "定向耗散可以集中空间中的弛豫模式，但是将这种积累与相关物质中的受控微观过程联系起来需要将虚拟电荷运动与自旋相干性分开。我们研究了半填充哈伯德链中的这种联系，该链具有相互跳跃和数量守恒、方向选择性返回的虚拟双布隆孔缺陷。消除电荷缺陷，然后消除莫特相干性，在时间尺度的显式分离下产生不对称的自旋交换率，并且完整的短链动力学支持有限交换时间的减少。平衡的随机回报将静止群体和几个低洼右模式集中在样本选择的位置而不是预定的边缘，尽管端到端对数率偏差为零，但仍产生随机的刘维尔皮肤定位。累积速率不平衡决定了精确的有限密度硬核静止状态和由随机势垒控制的单粒子激活弛豫尺度。\n\n局部校准返回率、多体固定重量和缓慢弛豫之间的这种联系提供了一种在不改变哈密顿量倒数的情况下控制受约束开放量子物质中的传输的方法。", "authors": [{"name": "Y. T. Wang"}, {"name": "X. Z. Zhang"}, {"name": "W. M. Liu"}], "featured_authors": [{"name": "Y. T. Wang"}, {"name": "X. Z. Zhang"}, {"name": "W. M. Liu"}], "author_count": 3}, {"id": "2609.14540", "category": "cond-mat", "title": "Anisotropic Nanoparticle Rejamming Triggers Thermodynamic Cavitation in Elastomer Nanocomposites", "abstract": "Nanoparticles can dramatically reinforce elastomers while paradoxically causing cavitation at lower strains. Despite decades of research, the microscopic origin of this behavior has remained unsettled. Here, molecular dynamics simulations reveal that cavitation and failure arise from the nanoparticulate reinforcement mechanism itself. Initial jamming of the nanoparticulate network leads to a buildup of negative pressure in the elastomer matrix, reinforcing it and simultaneously driving it towards a cavitation limit. This crisis is initially averted by yield of the particle network. However, an anisotropic rejamming event of the nanoparticles ultimately drives a runaway negative pressure buildup that leads to cavitation and failure. These results identify nanoparticle-network-induced thermodynamic cavitation as the origin of void formation in elastomeric nanocomposites, and they establish collective filler dynamics as a potential point of control of ultimate failure.", "url": "https://arxiv.org/abs/2609.14540", "type": "理论+数值", "summary": "纳米颗粒可以显着增强弹性体，但在较低应变下却会引起空化。尽管经过了数十年的研究，这种行为的微观起源仍然悬而未决。在这里，分子动力学模拟表明，空化和失效是由纳米颗粒增强机制本身引起的。纳米颗粒网络的初始干扰导致弹性体基质中负压的积累，增强其并同时将其推向空化极限。这场危机最初是通过粒子网络的产量避免的。然而，纳米粒子的各向异性重新堵塞事件最终会导致失控的负压积聚，从而导致空化和故障。这些结果将纳米粒子网络引起的热力学空化确定为弹性体纳米复合材料中空隙形成的根源，并将集体填料动力学确立为最终失效的潜在控制点。", "authors": [{"name": "Harshad Bhapkar"}, {"name": "Pierre Kawak"}, {"name": "David S. Simmons"}], "featured_authors": [{"name": "Harshad Bhapkar"}, {"name": "Pierre Kawak"}, {"name": "David S. Simmons"}], "author_count": 3}, {"id": "2609.14541", "category": "cond-mat", "title": "Phase ordering kinetics in Light-Heavy-Vacancy model: unusual coarsening dynamics", "abstract": "We study a one dimensional lattice model of coupled driven system where two kinds of hardcore particle species, `light' and `heavy', move on a fluctuating landscape. Light particles prefer to move upward along the local height gradient of the landscape, and heavy particles prefer to move downhill. In addition, these particle species also exert bias on the local height profile. The unoccupied or vacant parts of the landscape experience no bias and undergo symmetric height fluctuations. In an earlier work, we had derived a phase diagram of the system consisting of different kinds of ordered and disordered phases. In the ordered phase, one or both particle species phase-separate, while the landscape forms a large hill or deep valley. Here we study coarsening by monitoring the development of long-range order in the particles and landscape from an initially disordered state. Unlike conventional phase-ordering systems, where coarsening proceeds through the formation and merger of ordered domains, here we find that domains formed at early times become unsustainable at later times. Instead of merging together, these early domains disintegrate and new domains emerge which finally give rise to large scale ordered structure in the long time limit, resulting a highly unusual coarsening behavior. For particle coarsening, the characteristic length scale grows with two distinctly different power law exponents at early and late times. The landscape coarsening is even more dramatic where the length scale decreases for brief time-intervals, instead of increasing continuously. The height fluctuations of the landscape shows periodic oscillations with time during the coarsening phase. Using linear hydrodynamics we explain that this is caused by three normal modes which move through the system like travelling waves. We calculate the propagation velocities of these modes within mean field approximation.", "url": "https://arxiv.org/abs/2609.14541", "type": "理论+数值", "summary": "我们研究了耦合驱动系统的一维晶格模型，其中两种核心粒子种类“轻”和“重”在波动的景观上移动。轻粒子更喜欢沿着景观的局部高度梯度向上移动，而重粒子更喜欢向下移动。此外，这些粒子种类也会对局部高度轮廓产生偏差。景观中未被占用或空置的部分没有偏差，并且经历对称的高度波动。在早期的工作中，我们得出了由不同种类的有序相和无序相组成的系统的相图。在有序相中，一种或两种粒子发生相分离，而景观则形成大山或深谷。在这里，我们通过监测粒子和景观中从最初无序状态的长程有序的发展来研究粗化。与传统的相序系统不同，传统的相序系统通过有序域的形成和合并进行粗化，在这里我们发现早期形成的域在以后变得不可持续。\n\n这些早期域没有合并在一起，而是分解并出现新的域，最终在很长的时间内产生大规模的有序结构，从而导致非常不寻常的粗化行为。对于颗粒粗化，特征长度尺度在早期和晚期以两个明显不同的幂律指数增长。当长度尺度在短暂的时间间隔内减小而不是连续增加时，景观粗化甚至更加显着。在粗化阶段，景观的高度波动显示出随时间的周期性振荡。使用线性流体动力学，我们解释这是由三种正常模式引起的，它们像行波一样在系统中移动。我们在平均场近似内计算这些模式的传播速度。", "authors": [{"name": "Chandradip Khamrai"}, {"name": "Sakuntala Chatterjee"}], "featured_authors": [{"name": "Chandradip Khamrai"}, {"name": "Sakuntala Chatterjee"}], "author_count": 2}, {"id": "2609.14550", "category": "cond-mat", "title": "Statistical Landscape Exploration and Weak-Field Defects in Selective Oscillator Ising Machines", "abstract": "Oscillator Ising machines (OIMs) provide an analog dynamical approach to combinatorial optimization, but comparatively little is known about the statistical structure of the ensembles they generate. Using the Sherrington-Kirkpatrick (SK) spin-glass model, we introduce a selective oscillator scheme, OIM+, in which successive annealing epochs are combined with energy-based elimination and repopulation of replicas. We characterize the resulting states through overlap distributions, Hamming distances, hierarchical clustering, and local-field statistics. OIM+ explores structured low-energy regions while retaining a nontrivial ensemble of configurations despite repeated selection. We identify sparse weak-local-field residual defects as a characteristic limitation of the dynamics. A short Metropolis-Hastings refinement preferentially corrects these defects, indicating that the oscillator dynamics performs the dominant collective exploration while the remaining corrections are predominantly local. The weak fields arise mainly from cancellation among competing interaction terms rather than uniformly weak couplings. The same behavior persists for an antiferromagnetically biased SK ensemble, where the hybrid method reaches a pooled mean energy comparable to a substantially longer pure Metropolis anneal. The complete protocol also achieves competitive performance on standard G-set Max-Cut benchmarks. These results suggest a natural division of labor between collective analog search and targeted local refinement.", "url": "https://arxiv.org/abs/2609.14550", "type": "理论+数值", "summary": "振荡器伊辛机 (OIM) 提供了一种组合优化的模拟动态方法，但人们对它们生成的集合的统计结构知之甚少。使用 Sherrington-Kirkpatrick (SK) 自旋玻璃模型，我们引入了一种选择性振荡器方案 OIM+，其中连续退火周期与基于能量的消除和复制品重新填充相结合。我们通过重叠分布、汉明距离、层次聚类和局部场统计来表征结果状态。 OIM+ 探索结构化的低能区域，同时在反复选择的情况下保留重要的配置集合。我们将稀疏弱局部场残余缺陷确定为动力学的特征限制。简短的 Metropolis-Hastings 细化优先纠正这些缺陷，表明振荡动力学执行主导的集体探索，而其余的修正主要是局部的。弱场主要来自竞争相互作用项之间的抵消，而不是均匀的弱耦合。\n\n对于反铁磁偏置 SK 系综来说，同样的行为仍然存在，其中混合方法达到的合并平均能量与更长的纯 Metropolis 退火相当。完整的协议还在标准 G-set Max-Cut 基准测试中实现了具有竞争力的性能。这些结果表明集体模拟搜索和有针对性的局部细化之间存在自然的分工。", "authors": [{"name": "Ömer Önder"}, {"name": "Aydın Cem Keser"}], "featured_authors": [{"name": "Ömer Önder"}, {"name": "Aydın Cem Keser"}], "author_count": 2}, {"id": "2609.14556", "category": "cond-mat", "title": "Conserved quantities in a bosonic tight-binding chain with non-Hermitian quartic terms", "abstract": "We investigate local conserved quantities in non-Hermitian bosonic lattice systems whose underlying Yang--Baxter structure remains unclear. Focusing on a one-dimensional bosonic chain with quartic interactions of creation operators, we provide a new representation of the local conserved quantities previously constructed by Sanatani and Shiraishi. Using Fourier transformation and trigonometric identities, we systematically derive these conserved quantities and show directly that they form a mutually commuting family. We further extend the construction to interactions extending beyond a single site, cubic interactions, asymmetric hopping, and an on-site potential. Our results provide a unified framework for constructing and characterizing local conserved quantities in this class of non-Hermitian many-body systems.", "url": "https://arxiv.org/abs/2609.14556", "type": "理论", "summary": "我们研究了非厄米玻色子晶格系统中的局部守恒量，其潜在的杨-巴克斯特结构仍不清楚。着眼于具有创生算子四次相互作用的一维玻色子链，我们提供了 Sanatani 和 Shiraishi 先前构造的局部守恒量的新表示。利用傅立叶变换和三角恒等式，我们系统地推导了这些守恒量，并直接表明它们形成了一个相互交换的族。我们进一步将结构扩展到超出单个位点的相互作用、立方相互作用、不对称跳跃和现场势。我们的结果为构建和表征此类非厄米多体系统中的局部守恒量提供了一个统一的框架。", "authors": [{"name": "Tetsuya Iwasaki"}, {"name": "Hosho Katsura"}], "featured_authors": [{"name": "Tetsuya Iwasaki"}, {"name": "Hosho Katsura"}], "author_count": 2}, {"id": "2609.14586", "category": "cond-mat", "title": "A New Framework for Interfacial Statistics: Exact n-Point Correlations of Gaussian Level Sets", "abstract": "We derive exact analytical expressions for higher-order correlations of Gaussian level-set interfaces, establishing a direct link between bulk field statistics and interface geometry. This framework enables efficient reconstruction of disordered media, detailed modeling of {Gaussian foams}---structured, double-thresholded interfaces with tunable morphology---and analysis of {memory-enhanced anisotropy} reflecting directional persistence in surface structure. These results open new possibilities for characterizing complex transport, guiding stochastic reconstructions, designing materials with desired properties, quantifying the information content of correlation functions and modelling directional processes on irregular boundaries.", "url": "https://arxiv.org/abs/2609.14586", "type": "理论", "summary": "我们推导了高斯水平集接口的高阶相关性的精确解析表达式，在体场统计和界面几何之间建立了直接联系。该框架能够有效重建无序介质，对{高斯泡沫}（具有可调形态的结构化双阈值界面）进行详细建模，并对反映表面结构方向持久性的{记忆增强各向异性}进行分析。这些结果为表征复杂输运、指导随机重建、设计具有所需特性的材料、量化相关函数的信息内容以及对不规则边界上的方向过程进行建模提供了新的可能性。", "authors": [{"name": "Aleksei M. Cherkasov"}, {"name": "Kirill M. Gerke"}, {"name": "Aleksey Khlyupin"}], "featured_authors": [{"name": "Aleksei M. Cherkasov"}, {"name": "Kirill M. Gerke"}, {"name": "Aleksey Khlyupin"}], "author_count": 3}, {"id": "2609.14609", "category": "cond-mat", "title": "Why 2D Models Fail to Capture Flow Properties in 3D Heterogeneous Media: A Connectivity Perspective", "abstract": "We analyze how the equivalent hydraulic conductivity, $K_{eq}$, varies with the coarsening scale $\\lambda/I$ in 2D and 3D heterogeneous media. Their local hydraulic conductivity, $k({\\bf r})$, follows a lognormal distribution in all cases, while spatial connectivity of $k({\\bf r})$ ranges from high (HCS), through intermediate or multi-Gaussian (ICS) and low (LCS), to unstructured (NS). Using a stochastic approach, we characterize the full distribution $P[\\log(K_{eq})]$, and its moments: mean $\\langle K_{eq}\\rangle$, log-variance $\\sigma_{\\log(K_{eq})}^{2}$, and log-skewness $\\gamma_{\\log(K_{eq})}$, as a function of $\\lambda/I$. Significant contrasts appear between 2D and 3D, which we interpret in terms of two key factors associated with spatial dimensionality. We observe that, compared with ICS, LCS and HCS exhibit two distinct features: existing analytical expressions for coarse-graining of $k({\\bf r})$ in multi-Gaussian media do not apply, while $P[\\log(K_{eq})]$ deviates from Gaussian at all scales $\\lambda/I$. Critical path analysis is then used to quantify the connectivity of our samples, and show that $K_{eq}$ exhibits a power-law dependence on it. Our results reveal that connectivity can lead to substantial differences between 2D and 3D macroscopic flow properties, even for the same geostatistical parameters, highlighting the severe limitations of using 2D models to represent 3D flows.", "url": "https://arxiv.org/abs/2609.14609", "type": "理论", "summary": "我们分析了 2D 和 3D 异质介质中等效水力传导率 $K_{eq}$ 如何随粗化尺度 $\\lambda/I$ 变化。它们的局部水力传导率 $k({\\bf r})$ 在所有情况下都遵循对数正态分布，而 $k({\\bf r})$ 的空间连通性范围从高 (HCS)、中或多高斯 (ICS) 和低 (LCS) 到非结构化 (NS)。使用随机方法，我们表征完整分布 $P[\\log(K_{eq})]$ 及其矩：均值 $\\langle K_{eq}\\rangle$、对数方差 $\\sigma_{\\log(K_{eq})}^{2}$ 和对数偏度 $\\gamma_{\\log(K_{eq})}$，作为 $\\lambda/I$ 的函数。 2D 和 3D 之间存在显着的对比，我们用与空间维度相关的两个关键因素来解释。我们观察到，与 ICS 相比，LCS 和 HCS 表现出两个不同的特征：多高斯介质中 $k({\\bf r})$ 粗粒度的现有解析表达式不适用，而 $P[\\log(K_{eq})]$ 在所有尺度 $\\lambda/I$ 上都偏离高斯。然后使用关键路径分析来量化样本的连通性，并表明 $K_{eq}$ 表现出对其的幂律依赖性。\n\n我们的结果表明，即使对于相同的地质统计参数，连通性也会导致 2D 和 3D 宏观流动特性之间存在显着差异，这凸显了使用 2D 模型表示 3D 流动的严重局限性。", "authors": [{"name": "Cristian Picighelli"}, {"name": "Ivan Colecchio"}, {"name": "Marcelo Piva"}, {"name": "Alejandro D. Otero"}, {"name": "Alejandro Boschan"}], "featured_authors": [{"name": "Cristian Picighelli"}, {"name": "Ivan Colecchio"}, {"name": "Marcelo Piva"}, {"name": "Alejandro D. Otero"}, {"name": "Alejandro Boschan"}], "author_count": 5}, {"id": "2609.14613", "category": "cond-mat", "title": "Altermagnetism across the BCS-BEC crossover", "abstract": "We study a two-dimensional paired Fermi system in which altermagnetism produces a spin splitting that depends on momentum. The interaction strength is described through the two-body binding energy, so that the chemical potential and pairing gap evolve self-consistently from the weak-coupling Bardeen-Cooper-Schrieffer (BCS) regime to the strong-coupling Bose-Einstein-condensate (BEC) regime at fixed density. The stability of the uniform paired state is examined by giving the pairs a small center-of-mass momentum and following the resulting change in free energy. We show that at zero temperature, the phase stiffness follows a universal quadratic suppression, $J/J_0 = 1 - (\\alpha/\\alpha_0)^2$, across the entire fully gapped crossover regime. Deviations from this relation emerge only on the BCS side upon the opening of gapless Bogoliubov pockets, which rapidly reduce the stiffness and can trigger an instability toward finite-momentum pairing. In the BEC regime, this universal quadratic correction corresponds to the altered effective mass of the tightly bound composite bosons. The model therefore provides a simple setting in which to compare altermagnetic pair breaking on the BCS and BEC sides of the crossover.", "url": "https://arxiv.org/abs/2609.14613", "type": "理论", "summary": "我们研究了一个二维配对费米系统，其中交替磁性产生取决于动量的自旋分裂。相互作用强度通过二体结合能来描述，使得化学势和配对间隙自洽地从弱耦合巴丁-库珀-施里弗（BCS）体系演化到固定密度下的强耦合玻色-爱因斯坦凝聚态（BEC）体系。均匀配对态的稳定性通过给配对一个小的质心动量并跟踪由此产生的自由能变化来检查。我们表明，在零温度下，在整个完全有间隙的交叉区域，相位刚度遵循通用二次抑制 $J/J_0 = 1 - (\\alpha/\\alpha_0)^2$。这种关系的偏差仅出现在 BCS 侧，当无间隙 Bogoliubov 口袋打开时，这会迅速降低刚度，并可能引发有限动量配对的不稳定。在 BEC 体系中，这种通用二次校正对应于紧密结合的复合玻色子
