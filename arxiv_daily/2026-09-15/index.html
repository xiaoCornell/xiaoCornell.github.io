ions of a square-lattice spiral spin liquid reveal that these vortices are dense in the spiral-spin-liquid regime, and bind tightly below an order-by-disorder phase transition, eventually fusing to vacuum.", "url": "https://arxiv.org/abs/2609.15941", "type": "理论+数值", "summary": "螺旋自旋液体是磁态，其经典基态流形由平面不通约自旋螺旋组成，波矢量位于倒易空间中的连续环或表面上。由此产生的次广泛简并抑制了磁性长程有序并产生了类似液体的行为。尽管有大量的材料实现和理论研究，但对自旋各向同性海森堡螺旋自旋液体的低温自旋构型的结构仍然知之甚少。在这里，我们对这些系统支持的经典拓扑缺陷进行分类和表征。我们发现了丰富的涡流类型，涉及自旋方向、螺旋平面法线和波矢量方向的一致缠绕，产生 $\\mathbb{Z} \\times \\mathbb{Z}_2$ 分类。值得注意的是，基本缺陷是在自旋和动量空间中带有分数 $2\\pi$ 缠绕的半涡流，并遵守类似于伊辛任意子的融合规则。\n\n对方晶格螺旋自旋液体的大规模经典模拟表明，这些漩涡在螺旋自旋液体状态下是密集的，并且在有序相变下方紧密结合，最终融合到真空。", "authors": [{"name": "Cecilie Glittum"}, {"name": "Han Yan"}, {"name": "Johannes Reuther"}], "featured_authors": [{"name": "Cecilie Glittum"}, {"name": "Han Yan"}, {"name": "Johannes Reuther"}], "author_count": 3}, {"id": "2609.15947", "category": "cond-mat", "title": "Charge order before superconductivity in the doped kagome Dirac spin liquid", "abstract": "Doping a quantum spin liquid is expected to give a superconductor. On kagome it gives charge order first, because of band structure rather than interaction. In the chargon (Higgs) construction of its U(1) Dirac spin liquid the two gauge components, degenerate on square and triangular lattices, are split by a line-graph effect: one disperses, four minima at $-(1+\\sqrt6)t$; the other has two exactly flat lowest bands at $-2t$. Only the dispersive component condenses, over a bare-mass window of width exactly $(\\sqrt6-1)t$, in which the doped spin liquid forms charge and loop-current crystals on the $M$, $K$ and $K/2$ stars, the physical U(1) unbroken: a chargon Higgs phase that does not superconduct. Its pairing channels are those of the $\\mathbb{Z}_2$ descendants, a pair-density wave, uniform $d+id$ excluded at leading order and at all orders on the $M$ star. The projective symmetry group reduces the quartic competition to one angle, on which projected on-site repulsion sits exactly at the $M$/$K/2$ boundary, a direction protected to all orders by $O(4)\\times U(1)$ under renormalization, though lattice matching gives the physical coupling off-ray components. The competing $M$-star crystals are degenerate through sextic order, split only at eighth. The charge sector carries its own classification, the charged counterpart of the undoped bilinear-and-monopole catalog, which holds no charge-carrying operator; it puts the doped Mott insulator and kagome metals on one $F$-irrep grid, separated by the charge-order irrep ($F_1$ there, $F_3$ here) and the Landau cubic. Predicted: $C_2$-odd ($F_3$) charge order, no cubic invariant; vestigial pair phases of period $h/4e$ or $h/6e$; loop-current fields of order ten gauss at herbertsmithite's $^{17}$O and $^{35}$Cl; and, if the $\\Gamma$ flux orders with the condensate, charge and current order setting in together below the condensation scale.", "url": "https://arxiv.org/abs/2609.15947", "type": "理论", "summary": "掺杂量子自旋液体有望产生超导体。在戈薇上，它首先给出电荷顺序，因为能带结构而不是相互作用。在其 U(1) 狄拉克自旋液体的卡贡 (希格斯) 结构中，在方形和三角形晶格上简并的两个规范分量被线图效应分开：一个分散，四个最小值位于 $-(1+\\sqrt6)t$；另一个有两个完全平坦的最低带 $-2t$。只有色散成分在宽度恰好为 $(\\sqrt6-1)t$ 的裸质量窗口上凝结，其中掺杂的自旋液体在 $M$、$K$ 和 $K/2$ 恒星上形成电荷和环流晶体，物理 U(1) 未被破坏：不超导的电荷希格斯相。它的配对通道是 $\\mathbb{Z}_2$ 后代的配对通道，配对密度波，均匀 $d+id$ 排除在 $M$ 星上的前导顺序和所有顺序上。射影对称群将四次竞争减少到一个角度，在该角度上，投影的现场斥力恰好位于 $M$/$K/2$ 边界，该方向在重整化下受到 $O(4)\\times U(1)$ 的保护，尽管晶格匹配给出了物理耦合离射线分量。\n\n竞争的$M$星晶体通过六序简并，仅在第八分裂。电荷扇区有自己的分类，即未掺杂双线性和单极子目录的带电对应部分，它不包含任何携带电荷的运算符；它将掺杂的莫特绝缘体和 kagome 金属放在一个 $F$-irrep 网格上，由电荷顺序的 irrep（那里是 $F_1$，这里是 $F_3$）和朗道立方体分开。预测：$C_2$-奇数 ($F_3$) 电荷顺序，无三次不变量； $h/4e$ 或 $h/6e$ 期间的退化对阶段； Herbertsmithite 的 $^{17}$O 和 $^{35}$Cl 处的环路电流场为 10 高斯；并且，如果 $\\Gamma$ 通量与凝结水有序，电荷和电流有序设置一起低于凝结水标。", "authors": [{"name": "Yasir Iqbal"}], "featured_authors": [{"name": "Yasir Iqbal"}], "author_count": 1}, {"id": "2609.13163", "category": "hep-th", "title": "The Fuzzy-Sphere as a Black Hole in the IKKT Matrix Model: An Assessment", "abstract": "Black-hole thermodynamics has been reproduced with remarkable success from the BFSS matrix model, but the corresponding test in the closely related IKKT matrix model has awaited its recently proposed finite-temperature formulation. We investigate this correspondence within that framework. Introducing a cubic Myers term, we compute the complete one-loop thermodynamics -- free energy, internal energy, entropy, and heat capacity -- of a fuzzy $S^2$ background. No gravitational dual is known for this specific background, so we compare these quantities against the D0 and D2 black holes as the closest available reference points. At fixed Myers coupling, the leading entropy exhibits an $O(N^3)$ scaling rather than the $O(N^2)$ behavior characteristic of conventional black holes; this scaling mismatch is the central result of our analysis. We further find no intrinsic Hawking temperature -- only a characteristic scale -- and a heat capacity that is negative at both the low- and high-temperature endpoints. Holding the physical radius fixed instead yields a genuine $O(N^2)$ scaling, so the power of $N$ is convention-dependent rather than an unambiguous prediction -- though the sign and temperature-scale mismatches persist either way. Rather than establishing a black-hole interpretation of the finite-temperature IKKT matrix model, these results provide a quantitative benchmark against which future analytical, numerical, and holographic investigations can be tested.", "url": "https://arxiv.org/abs/2609.13163", "type": "理论", "summary": "BFSS 矩阵模型已经非常成功地再现了黑洞热力学，但密切相关的 IKKT 矩阵模型中的相应测试仍在等待其最近提出的有限温度公式。我们在该框架内调查这种对应关系。引入三次迈尔斯项，我们计算模糊 $S^2$ 背景的完整单环热力学——自由能、内能、熵和热容。对于该特定背景，尚无已知的引力对偶，因此我们将这些量与 D0 和 D2 黑洞作为最接近的可用参考点进行比较。在固定迈尔斯耦合下，领先熵表现出 $O(N^3)$ 缩放比例，而不是传统黑洞的 $O(N^2)$ 行为特征；这种缩放比例不匹配是我们分析的核心结果。我们进一步发现没有内在的霍金温度——只有一个特征尺度——并且在低温和高温端点处的热容均为负值。\n\n保持物理半径固定会产生真正的 $O(N^2)$ 缩放，因此 $N$ 的幂取决于约定而不是明确的预测 - 尽管符号和温度尺度不匹配仍然存在。这些结果不是建立有限温度 IKKT 矩阵模型的黑洞解释，而是提供了一个定量基准，可以测试未来的分析、数值和全息研究。", "authors": [{"name": "Koichiro Matsumoto"}], "featured_authors": [{"name": "Koichiro Matsumoto"}], "author_count": 1}, {"id": "2609.13365", "category": "hep-th", "title": "Constructing Concrete Colour Tensors for Simple Lie Algebras", "abstract": "We describe the implementation and use of colour_tensors: a Mathematica package built for the concrete construction of explicit colour tensors involving arbitrarily charged particles in any gauge theory. These can be used to directly determine linear relations among colour tensors and compute a number of otherwise difficult, representation-theoretic quantities relevant to scattering amplitudes such as colour-interference between partial amplitudes.", "url": "https://arxiv.org/abs/2609.13365", "type": "理论", "summary": "我们描述了 color_tensors 的实现和使用：一个 Mathematica 包，用于具体构建涉及任何规范理论中的任意带电粒子的显式颜色张量。这些可用于直接确定颜色张量之间的线性关系，并计算许多与散射幅度相关的其他困难的表示理论量，例如部分幅度之间的颜色干涉。", "authors": [{"name": "Jacob L. Bourjaily"}, {"name": "Michael Plesser"}, {"name": "Philip Velie"}], "featured_authors": [{"name": "Jacob L. Bourjaily"}, {"name": "Michael Plesser"}, {"name": "Philip Velie"}], "author_count": 3}, {"id": "2609.13370", "category": "hep-th", "title": "Bootstrapping currents and stress tensors in 3d CFTs", "abstract": "We perform a numerical conformal bootstrap study of the mixed system of correlation functions involving a spin-1 $\\mathrm{U}(1)$ current $J$ and the stress-energy tensor $T$ in parity-preserving 3d CFTs. We find universal bounds on the stress-tensor two-point function $c_T$, which numerically reproduce the conformal collider bounds on $\\langle JJT\\rangle$ and $\\langle TTT\\rangle$, as well as bounds on the leading parity-even and parity-odd scalar operator dimensions. Under mild assumptions, we determine the values of the $\\langle JJT\\rangle$ and $\\langle TTT\\rangle$ three-point functions in the $\\mathrm{O}(2)$ vector model. The $\\langle TTT\\rangle$ result is new and $\\langle JJT\\rangle$ is consistent with a previous result in the literature.", "url": "https://arxiv.org/abs/2609.13370", "type": "理论", "summary": "我们对相关函数的混合系统进行了数值共形自举研究，涉及自旋 1 $\\mathrm{U}(1)$ 电流 $J$ 和保偶性 3d CFT 中的应力能量张量 $T$。我们在应力张量两点函数 $c_T$ 上找到了通用界限，它以数字方式再现了 $\\langle JJT\\rangle$ 和 $\\langle TTT\\rangle$ 上的共形碰撞器界限，以及领先奇偶校验和奇偶校验标量算子维度上的界限。在温和的假设下，我们确定了$\\mathrm{O}(2)$向量模型中$\\langle JJT\\rangle$和$\\langle TTT\\rangle$三点函数的值。 $\\langle TTT\\rangle$ 结果是新的，$\\langle JJT\\rangle$ 与文献中先前的结果一致。", "authors": [{"name": "Vasiliy Dommes"}, {"name": "Rajeev S. Erramilli"}, {"name": "Colum Flynn"}, {"name": "Alexandre Homrich"}, {"name": "Petr Kravchuk"}, {"name": "David Poland"}, {"name": "David Simmons-Duffin"}, {"name": "George Yuzhe Zhou"}], "featured_authors": [{"name": "Vasiliy Dommes"}, {"name": "Rajeev S. Erramilli"}, {"name": "Colum Flynn"}, {"name": "David Poland"}, {"name": "David Simmons-Duffin"}, {"name": "George Yuzhe Zhou"}], "author_count": 8}, {"id": "2609.13374", "category": "hep-th", "title": "The index from a nonpoint and RG flows", "abstract": "We extend the algebro-geometric construction of bifiltered affine schemes that encode both the Higgs branch and the Macdonald index of 4d $\\mathcal{N}=2$ superconformal field theories to theories with non-trivial Higgs branches. For the Argyres--Douglas theories $\\mathcal{D}_p(SU(N))$, we find that a universal potential, given by a function in the Casimir invariants of $\\mathfrak{sl}(N)$, determines the scheme. The scheme is given by a `fattened' nilpotent orbit closure, encoding the OPE decoupling structure of the 4d theory. A procedure we call syzygy maximization fixes the precise potential in a broad range of examples, and the resulting schemes reproduce the 4d data. The underlying graded ring gives conjectural presentations of Zhu's $C_2$-algebra of the associated vertex operator algebra, while the bifiltration refines Arakawa's associated scheme by retaining the R-symmetry information. We find that Higgs branch renormalization group flows are realized by pulling back the same universal potential to the corresponding Slodowy slices, including flows for which the infrared Higgs branch is a point. In particular, our construction provides a systematic method for determining the Macdonald indices of the $\\mathcal{D}_p(SU(N), O)$ theories, for which no general expressions were previously known.", "url": "https://arxiv.org/abs/2609.13374", "type": "理论", "summary": "我们将双滤仿射方案的代数几何构造扩展为将 4d $\\mathcal{N}=2$ 超共形场论的希格斯分支和麦克唐纳指数编码为具有非平凡希格斯分支的理论。对于Argyres--Douglas理论$\\mathcal{D}_p(SU(N))$，我们发现由$\\mathfrak{sl}(N)$的卡西米尔不变量中的函数给出的普适势决定了该方案。该方案由“肥胖”幂零轨道闭包给出，编码 4d 理论的 OPE 解耦结构。我们称为 syzygy 最大化的过程修复了广泛示例中的精确势，并且生成的方案再现了 4d 数据。底层分级环给出了相关顶点算子代数的 Zhu 的 $C_2$ 代数的猜想表示，而双过滤通过保留 R 对称信息来完善 Arakawa 的相关方案。我们发现希格斯分支重正化群流是通过将相同的通用势拉回相应的 Slodowy 切片来实现的，包括以红外希格斯分支为点的流。\n\n特别是，我们的构造提供了一种系统方法来确定 $\\mathcal{D}_p(SU(N), O)$ 理论的麦克唐纳指数，而此前尚无通用表达式。", "authors": [{"name": "Monica Jinwoo Kang"}, {"name": "Craig Lawrie"}, {"name": "Jaewon Song"}], "featured_authors": [{"name": "Monica Jinwoo Kang"}, {"name": "Craig Lawrie"}, {"name": "Jaewon Song"}], "author_count": 3}, {"id": "2609.13377", "category": "hep-th", "title": "Integrable Chiral Quantum Field Theories with Spacetime-Dependent Interactions", "abstract": "We construct a class of integrable chiral fermionic quantum field theories with interactions depending on both space and time. The construction starts with a unitary, regular, difference-form two-body scattering matrix that satisfies braiding unitarity and the Yang--Baxter equation. Each freely moving right- or left-moving particle carries a characteristic coordinate that remains constant along its trajectory, and the scattering matrix depends on differences of these coordinates. The many-body amplitudes form a discrete connection over coordinate-ordering sectors. The Yang--Baxter equation gives its local flatness, while periodicity on a spatial circle produces quantum Knizhnik--Zamolodchikov difference equations expressing global flatness. In terms of a reference amplitude satisfying the exchange and qKZ constraints, these transports determine the exact fixed-particle-number wavefunction. We derive the characteristic form of the spacetime-dependent interaction and illustrate the construction with a chiral $SU(2)$ Gross--Neveu realization. Independent reparametrizations of the right- and left-moving characteristics yield genuine space-time dependence, whereas equal-slope affine maps recover the spatially homogeneous, time-dependent case.", "url": "https://arxiv.org/abs/2609.13377", "type": "理论", "summary": "我们构建了一类可积的手性费米子量子场论，其相互作用取决于空间和时间。构造从满足编织幺正性和 Yang--Baxter 方程的酉正则差型二体散射矩阵开始。每个自由移动的向右或向左移动的粒子都带有一个沿其轨迹保持恒定的特征坐标，并且散射矩阵取决于这些坐标的差异。多体振幅在坐标排序扇区上形成离散连接。 Yang--Baxter 方程给出了其局部平坦度，而空间圆上的周期性则产生了表达全局平坦度的量子 Knizhnik--Zamolodchikov 差分方程。就满足交换和 qKZ 约束的参考幅度而言，这些传输确定了精确的固定粒子数波函数。我们推导了时空相关相互作用的特征形式，并用手性 $SU(2)$ Gross--Neveu 实现来说明其构造。\n\n左右移动特征的独立重新参数化产生真正的时空依赖性，而等斜率仿射图则恢复空间均匀、时间相关的情况。", "authors": [{"name": "Pradip Kattel"}], "featured_authors": [{"name": "Pradip Kattel"}], "author_count": 1}, {"id": "2609.13381", "category": "hep-th", "title": "The Conformal $w$-Algebra", "abstract": "Einstein gravity in four asymptotically flat dimensions is governed by a tower of soft theorems obeying an $\\mathcal{L}w_{1+\\infty}$ commutator algebra. This algebra is deformed to $\\mathcal{L}_\\Lambda w_{1+\\infty}$ in the conformally related AdS$_4$ and dS$_4$ spacetimes. Here we construct the larger ``conformal $w$-algebra\", denoted $\\mathcal{C}w_{1+\\infty}$, which acts on conformal gravity in all of these spacetimes. It includes $\\mathcal{L}w_{1+\\infty}$, $\\mathcal{L}_\\Lambda w_{1+\\infty}$ and the $\\mathfrak{so}(4,2)$ 4D conformal algebra as subalgebras. We show that $\\mathcal{C}w_{1+\\infty}$ is the conformal completion of either $\\mathcal{L}w_{1+\\infty}$ or $\\mathcal{L}_\\Lambda w_{1+\\infty}$. A derivation of $\\mathcal{C}w_{1+\\infty}$ is given as the symmetry of the twistor action of self-dual conformal gravity.", "url": "https://arxiv.org/abs/2609.13381", "type": "理论", "summary": "四个渐近平坦维度中的爱因斯坦引力由遵守 $\\mathcal{L}w_{1+\\infty}$ 交换子代数的软定理塔控制。该代数在共形相关的 AdS$_4$ 和 dS$_4$ 时空中变形为 $\\mathcal{L}_\\Lambda w_{1+\\infty}$。这里我们构造了更大的“共形$w$-代数”，表示为$\\mathcal{C}w_{1+\\infty}$，它作用于所有这些时空中的共形引力。它包括$\\mathcal{L}w_{1+\\infty}$、$\\mathcal{L}_\\Lambda w_{1+\\infty}$和$\\mathfrak{so}(4,2)$我们证明 $\\mathcal{C}w_{1+\\infty}$ 是 $\\mathcal{L}w_{1+\\infty}$ 或 $\\mathcal{L}_\\Lambda w_{1+\\infty}$ 的保形完成，$\\mathcal{C}w_{1+\\infty}$ 的推导如下：自对偶共形引力扭转作用的对称性。", "authors": [{"name": "Simon Heuveline"}, {"name": "Nia Robles Del Pino"}, {"name": "Andrew Strominger"}], "featured_authors": [{"name": "Simon Heuveline"}, {"name": "Nia Robles Del Pino"}, {"name": "Andrew Strominger"}], "author_count": 3}, {"id": "2609.13386", "category": "hep-th", "title": "Matrix Theory from Holography", "abstract": "We propose a setup that embeds Matrix Theory for M-theory into the AdS/CFT correspondence, allowing the former to be tested using the latter. The central claim is a triality among the BMN matrix model of rank $m$, a large-charge monopole sector of ABJM theory with charge $J$, and M-theory on the maximally supersymmetric eleven-dimensional pp-wave with a compact lightlike direction. The relevant ABJM limit sends $N,k,J\\to\\infty$ while keeping $N/k^2$ and $m=J/k$ fixed. We provide quantitative evidence for this triality by showing that, in this triple-scaling limit, the ABJM superconformal index agrees precisely with a grand-canonical sum of Witten indices of the $U(m)$ BMN matrix model. This relation also yields a compact grand-canonical expression for the BMN index, which we use to revisit its large-$m$ behavior. Our analytic and numerical results reveal strong boson--fermion cancellations and show no evidence for the previously claimed $e^{O(m^2)}$ growth when the BMN charge scales as $Q \\sim m^2$. We further study the correspondence between the BPS cohomologies of the two theories by constructing a letter-level dictionary. This leads to a new notion of BPS fortuity in ABJM theory that survives even at strict $N=\\infty$: although the usual fortuity associated with finite-$N$ trace relations disappears in the triple-scaling limit, each fixed-monopole sector is governed by the effective rank $m$, and finite-$m$ trace relations generate fortuitous states that map directly to fortuitous states of the BMN matrix model. Finally, we discuss connections to related concepts such as large-charge matrix models, open--closed--open triality, and worldline holography.", "url": "https://arxiv.org/abs/2609.13386", "type": "理论", "summary": "我们提出了一种将 M 理论的矩阵理论嵌入到 AdS/CFT 对应关系中的设置，允许使用后者来测试前者。核心主张是阶 $m$ 的 BMN 矩阵模型、带电荷 $J$ 的 ABJM 理论的大电荷单极扇区以及具有紧致光方向的最大超对称十一维 pp 波的 M 理论。相关 ABJM 限制发送 $N,k,J\\to\\infty$，同时保持 $N/k^2$ 和 $m=J/k$ 固定。我们通过证明在这个三倍尺度极限下，ABJM 超共形指数与 $U(m)$ BMN 矩阵模型的 Witten 指数的大正则和完全一致，为这种试验性提供了定量证据。这种关系还为 BMN 索引生成了一个紧凑的大规范表达式，我们用它来重新审视其大 $m$ 行为。我们的分析和数值结果揭示了强烈的玻色子-费米子抵消，并且没有证据表明当 BMN 电荷缩放为 $Q \\sim m^2$ 时先前声称的 $e^{O(m^2)}$ 增长。我们通过构建字母级字典进一步研究两种理论的 BPS 上同调之间的对应关系。\n\n这导致了 ABJM 理论中 BPS 偶然性的新概念，即使在严格的 $N=\\infty$ 下也仍然存在：尽管与有限 $N$ 迹关系相关的通常偶然性在三倍缩放极限中消失，但每个固定单极子扇区都由有效秩 $m$ 控制，并且有限 $m$ 迹关系生成直接映射到 BMN 矩阵模型的偶然状态的偶然状态。最后，我们讨论与相关概念的联系，例如大电荷矩阵模型、开放-封闭-开放试验和世界线全息术。", "authors": [{"name": "Shota Komatsu"}, {"name": "Eunwoo Lee"}, {"name": "Chintan Patel"}], "featured_authors": [{"name": "Shota Komatsu"}, {"name": "Eunwoo Lee"}, {"name": "Chintan Patel"}], "author_count": 3}, {"id": "2609.13558", "category": "hep-th", "title": "Electromagnetic Duality Sensitivity of Holographic Complexity", "abstract": "We investigate electromagnetic duality as a diagnostic of the sensitivity of information content of holographic complexity via \"complexity=anything\" in Einstein-ModMax theory. Functionals constructed solely from gravitational invariants are duality invariant, whereas matter-sensitive functionals can distinguish electromagnetic configurations that share the same bulk geometry and energy-momentum tensor. As an explicit example, we consider a functional involving $F_{\\mu\\nu}F^{\\mu\\nu}$ and show that its complexity and complexity growth vary along the duality orbit, interpolating between purely electric, mixed electric-magnetic, and purely magnetic configurations. This provides an explicit realization of the freedom inherent in generalized holographic complexity and shows that different choices of complexity functional can retain different sensitivity to information about the bulk matter sector even when the gravitational geometry is insensitive to that information.", "url": "https://arxiv.org/abs/2609.13558", "type": "理论", "summary": "我们通过爱因斯坦-ModMax 理论中的“复杂性=任何东西”来研究电磁对偶性，作为全息复杂性信息内容敏感性的诊断。仅由引力不变量构造的泛函是对偶不变量，而物质敏感泛函可以区分共享相同体积几何和能量动量张量的电磁配置。作为一个明确的例子，我们考虑一个涉及 $F_{\\mu\\nu}F^{\\mu\\nu}$ 的函数，并表明其复杂性和复杂性增长沿对偶轨道变化，在纯电、混合电磁和纯磁配置之间进行插值。这提供了广义全息复杂性固有的自由度的明确实现，并表明复杂性泛函的不同选择可以保留对散装物质扇区信息的不同敏感性，即使重力几何对该信息不敏感。", "authors": [{"name": "Mojtaba Shahbazi"}, {"name": "Mehdi Sadeghi"}], "featured_authors": [{"name": "Mojtaba Shahbazi"}, {"name": "Mehdi Sadeghi"}], "author_count": 2}, {"id": "2609.13649", "category": "hep-th", "title": "Dimensional reduction and thermodynamics of a non-local scalar field theory", "abstract": "In this paper, we study the dimensional reduction of a nonlocal scalar field theory to 1+2 dimensions. This nonlocal model introduces a light mass parameter as a scale that primarily modifies the infrared regime of the theory. We constraint the external sources to a bidimensional plane to obtain the effective Green's function and propose an effective Lagrangian for the scalar field in 1+2 dimensions. Using the static propagator, we calculate the interaction energy between point-like charges in the planar space. Furthermore, we evaluate the causal and Feynman Green's functions, and discuss the unitarity of the effective planar model at tree level. Finally, we implement the Matsubara formalism to investigate the thermodynamics of the planar model. The exact thermal free energy shows the fractional degrees of freedom characteristic of kinematic confinement and imposes a strict low-temperature validity bound ($T \\ll \\Lambda$) to preserve the macroscopic thermodynamic stability.", "url": "https://arxiv.org/abs/2609.13649", "type": "理论", "summary": "在本文中，我们研究将非局部标量场理论降维至 1+2 维。该非局域模型引入了轻质量参数作为主要修改理论红外范围的尺度。我们将外部源限制在二维平面上以获得有效的格林函数，并提出了 1+2 维标量场的有效拉格朗日函数。使用静态传播器，我们计算平面空间中点状电荷之间的相互作用能。此外，我们评估了因果函数和费曼格林函数，并讨论了树级有效平面模型的幺正性。最后，我们采用松原形式主义来研究平面模型的热力学。精确的热自由能显示了运动约束的分数自由度特征，并施加严格的低温有效性界限（$T \\ll \\Lambda$）以保持宏观热力学稳定性。", "authors": [{"name": "S. Duque Cesar"}, {"name": "M. J. Neves"}], "featured_authors": [{"name": "S. Duque Cesar"}, {"name": "M. J. Neves"}], "author_count": 2}, {"id": "2609.13994", "category": "hep-th", "title": "A new product entropy", "abstract": "We propose a new product entropy, defined as the Rényi (or von Neumann) entropy of a normalized product operator constructed from two density matrices. We establish a duality showing that the SVD entanglement entropy of a subsystem for two pure states is exactly equivalent to the product entropy of the complementary subsystem. This connection provides both a transparent physical interpretation in terms of the spectral diversity of the subsystem state product and a computationally efficient route that bypasses the reduced transition matrix. For low-lying eigenstates, we derive analytical expressions for the subsystem product entropy between the ground state and primary excitations in two-dimensional conformal field theories, explicitly verified against the critical Ising chain. In quantum quench dynamics, the quasiparticle picture yields time evolution in the scaling limit: following a global quench, the subsystem product entropy exhibits distinct sequences of thermalization and revivals, whereas under a local operator quench, it develops characteristic plateaus whose constant values are determined by the inserted operator. Extensive numerical calculations on the critical Ising chain confirm the analytical predictions with excellent accuracy.", "url": "https://arxiv.org/abs/2609.13994", "type": "理论", "summary": "我们提出了一种新的乘积熵，定义为由两个密度矩阵构造的归一化乘积算子的 Rényi（或冯·诺依曼）熵。我们建立了一个对偶性，表明两个纯态子系统的 SVD 纠缠熵完全等于互补子系统的乘积熵。这种连接既提供了子系统状态乘积的光谱多样性方面的透明物理解释，又提供了绕过简化转移矩阵的计算有效路线。对于低位本征态，我们推导了二维共形场论中基态和初级激励之间的子系统积熵的解析表达式，并针对临界伊辛链进行了明确验证。在量子淬灭动力学中，准粒子图产生缩放极限内的时间演化：在全局淬灭之后，子系统产物熵表现出不同的热化和复兴序列，而在局部算子淬灭下，它形成特征平台，其常数值由插入的算子确定。\n\n对关键伊辛链的大量数值计算以极高的精度证实了分析预测。", "authors": [{"name": "Jiaju Zhang"}, {"name": "Zhuo-Yu Xian"}, {"name": "René Meyer"}, {"name": "Song He"}, {"name": "Bin Chen"}], "featured_authors": [{"name": "Jiaju Zhang"}, {"name": "Zhuo-Yu Xian"}, {"name": "René Meyer"}, {"name": "Song He"}, {"name": "Bin Chen"}], "author_count": 5}, {"id": "2609.14165", "category": "hep-th", "title": "Modular flow and the area operator", "abstract": "In the context of the AdS/CFT correspondence, the Jafferis-Lewkowycz-Maldacena-Suh (JLMS) formula relates the boundary modular Hamiltonian to the HRT area operator and the corresponding bulk modular Hamiltonian. In standard discussions of a holographic code built from perturbative excitations on a fixed classical background, the $A/4G$ term dominates over the bulk modular Hamiltonian in the limit $G \\to 0$. However, this setup is insufficient to describe the action of boundary modular flows that change the classical background. In contrast, our recent discussion of `large' codes provides a useful framework to obtain a JLMS formula that relates bulk and boundary modular flows acting on appropriate states in the code. Here, one sees that the bulk modular Hamiltonian is not in fact subdominant when the modular flow defined by one state acts on another state peaked around a sufficiently different classical background. Instead, the bulk modular Hamiltonian can be of order $1/G$ and can dominate over the $A/4G$ term. Nevertheless, we show that if the two states have the same classical background except for data conjugate to the HRT area then, under mild assumptions and over a large range of flow parameters, the modular-flowed state is described by a classical background given by the HRT-area flow alone.", "url": "https://arxiv.org/abs/2609.14165", "type": "理论", "summary": "在 AdS/CFT 对应关系的上下文中，Jafferis-Lewkowycz-Maldacena-Suh (JLMS) 公式将边界模哈密顿量与 HRT 区域算子和相应的块模哈密顿量联系起来。在对固定经典背景上的微扰激励构建的全息码的标准讨论中，$A/4G$ 项在 $G \\to 0$ 的限制中优于体模哈密顿量。然而，这种设置不足以描述改变经典背景的边界模块化流的作用。相比之下，我们最近对“大型”代码的讨论提供了一个有用的框架来获得 JLMS 公式，该公式将作用于代码中适当状态的体块和边界模块化流联系起来。在这里，人们发现，当一个状态定义的模块化流作用于在充分不同的经典背景周围达到峰值的另一个状态时，体模哈密顿量实际上并不占主导地位。相反，块状模哈密顿量的阶数可以为 $1/G$，并且可以主导 $A/4G$ 项。\n\n尽管如此，我们表明，如果这两个状态除了与 HRT 区域的数据共轭之外具有相同的经典背景，那么在温和的假设和大范围的流动参数下，模块化流动状态由仅由 HRT 区域流动给出的经典背景来描述。", "authors": [{"name": "Xi Dong"}, {"name": "Donald Marolf"}, {"name": "Pratik Rath"}], "featured_authors": [{"name": "Xi Dong"}, {"name": "Donald Marolf"}, {"name": "Pratik Rath"}], "author_count": 3}, {"id": "2609.14296", "category": "hep-th", "title": "Holographic Casimir Effect for Mixed Boundary Conditions and non-CFTs", "abstract": "This paper investigates the holographic Casimir effect in AdS/BCFT with a brane-localized scalar field. The scalar field takes different values at the strip's two boundaries, leading to mixed boundary conditions. The massive brane-localized scalar field typically breaks the boundary conformal symmetries, allowing us to study the holographic Casimir effect in non-CFTs. In two-dimensional spacetime, we apply the holographic g-theorem to prove the holographic bound on the Casimir effect for general brane-localized matter fields. In higher dimensions, we find that the brane-localized scalar field reduces the Casimir amplitude when the mass squared \\(m^2=0\\), but can increase it when \\(m^2 < 0\\). Additionally, there is a no-hair theorem for the cases where \\(m^2>0\\). These findings indicate that relevant boundary deformations can enhance the Casimir effect. As a byproduct, we obtain a gravitational dual of the repulsive Casimir force under mixed boundary conditions and argue that it aligns with the cosmic censorship conjecture.", "url": "https://arxiv.org/abs/2609.14296", "type": "理论", "summary": "本文研究了具有膜局域标量场的 AdS/BCFT 中的全息卡西米尔效应。标量场在带的两个边界处采用不同的值，从而导致混合边界条件。巨大的膜局域标量场通常会打破边界共形对称性，使我们能够研究非 CFT 中的全息卡西米尔效应。在二维时空中，我们应用全息g定理证明了一般膜局域物质场的卡西米尔效应的全息界。在更高维度中，我们发现当质量平方 \\(m^2=0\\) 时膜局域标量场会降低卡西米尔振幅，但当 \\(m^2 < 0\\) 时会增加卡西米尔振幅。此外，对于 \\(m^2>0\\) 的情况存在无毛定理。这些发现表明相关的边界变形可以增强卡西米尔效应。作为副产品，我们在混合边界条件下获得了排斥卡西米尔力的引力对偶，并认为它与宇宙审查猜想相符。", "authors": [{"name": "Bing-Ji Ding"}, {"name": "Hua-Chao Liu"}, {"name": "Rong-Xin Miao"}], "featured_authors": [{"name": "Bing-Ji Ding"}, {"name": "Hua-Chao Liu"}, {"name": "Rong-Xin Miao"}], "author_count": 3}, {"id": "2609.14305", "category": "hep-th", "title": "Pseudo entropy from entanglement entropy", "abstract": "Pseudo entropy extends entanglement entropy from a single quantum state to a pair of nonorthogonal states and is generally complex. Taking advantage of Cauchy-Riemann equations, Kramers-Kronig relations, and analytic continuation in state parameters, we show how and to what extent real and imaginary parts of pseudo entropy can be derived from ordinary entanglement entropy. For families with holomorphic coefficients in finite-dimensional Hilbert spaces, the reduced transition matrix equals the ordinary reduced density matrix formula evaluated at complex parameters. Then a convergent Taylor series gives the real and imaginary parts of pseudo entropy from even and odd derivatives of entanglement entropy at the real midpoint. The matrix identity also gives formulae for excess pseudo entropy and Renyi entropies, and interpolation formulae for families with polynomial coefficients. We apply these results to boundary-state quenches and thermal states in conformal field theory, and to fermionic and bosonic Gaussian states and quenches. In conformal field theory, Kramers-Kronig relations give the first moment of the imaginary part in terms of the central charge and one-point functions for boundary states.", "url": "https://arxiv.org/abs/2609.14305", "type": "理论", "summary": "伪熵将纠缠熵从单个量子态扩展到一对非正交态，并且通常很复杂。利用柯西-黎曼方程、Kramers-Kronig 关系和状态参数的解析延拓，我们展示了如何以及在多大程度上可以从普通纠缠熵导出伪熵的实部和虚部。对于有限维希尔伯特空间中具有全纯系数的族，简化的转移矩阵等于在复参数下评估的普通简化密度矩阵公式。然后，收敛泰勒级数根据实中点处纠缠熵的偶数和奇数导数给出伪熵的实部和虚部。矩阵恒等式还给出了过剩伪熵和 Renyi 熵的公式，以及多项式系数族的插值公式。我们将这些结果应用于共形场论中的边界态淬火和热态，以及费米子和玻色高斯态和淬火。\n\n在共形场论中，Kramers-Kronig 关系给出了以中心电荷和边界态单点函数表示的虚部的一阶矩。", "authors": [{"name": "Abhigyan Saha"}, {"name": "Piotr Sułkowski"}, {"name": "Tadashi Takayanagi"}], "featured_authors": [{"name": "Abhigyan Saha"}, {"name": "Piotr Sułkowski"}, {"name": "Tadashi Takayanagi"}], "author_count": 3}, {"id": "2609.14330", "category": "hep-th", "title": "Relations between the higher Hamiltonians of the trigonometric and the rational spin Calogero-Sutherland models", "abstract": "In this paper we study the relations between the Hamiltonian hierarchy generated by trigonometric Cherednik-Dunkl operators and the one generated by rational Dunkl operators. We develop two nested structures relating these two hierarchies. The first nested relation reconstructs the higher rational spin Calogero-Sutherland Hamiltonians exactly from the trigonometric ones. The second nested relation reconstructs the higher trigonometric spin Calogero-Sutherland Hamiltonians as leading terms from the rational ones. In addition, we provide an explanation of the eigenvalues of the trigonometric spin Calogero-Sutherland Hamiltonians in terms of $N$-colored Young diagrams and Maya diagrams.", "url": "https://arxiv.org/abs/2609.14330", "type": "理论", "summary": "在本文中，我们研究了三角 Cherednik-Dunkl 算子生成的哈密顿层次结构与有理 Dunkl 算子生成的哈密顿层次结构之间的关系。我们开发了两个与这两个层次结构相关的嵌套结构。第一个嵌套关系准确地从三角函数重建了更高的有理自旋卡洛杰罗-萨瑟兰哈密顿量。第二个嵌套关系将更高的三角自旋卡洛杰罗-萨瑟兰哈密顿量重建为有理项的主导项。此外，我们还用 $N$ 色杨氏图和玛雅图解释了三角自旋卡洛杰罗-萨瑟兰哈密顿量的特征值。", "authors": [{"name": "Yue Li"}, {"name": "Fan Liu"}, {"name": "Lu-Yao Wang"}, {"name": "Jie Yang"}], "featured_authors": [{"name": "Yue Li"}, {"name": "Fan Liu"}, {"name": "Lu-Yao Wang"}, {"name": "Jie Yang"}], "author_count": 4}, {"id": "2609.14345", "category": "hep-th", "title": "Free Field Realization of $\\mathcal{W}$-Algebra Associated with Exceptional Lie Algebras", "abstract": "We study the free field realization of the $\\mathcal{W}$-algebra associated with the exceptional Lie algebras $E_6$, $E_7$, $E_8$, and $F_4$. We develop a recursive construction in which a $\\mathcal{W}$-algebra of rank $r$ is obtained from a $\\mathcal{W}$-algebra of rank $r-1$ together with a free boson. The $\\mathcal{W}$-currents are constructed from the zero commutation relation with the screening charges. The $\\mathcal{W}E_6/\\mathcal{W}E_7$ algebra is constructed from the $\\mathcal{W}D_5/\\mathcal{W}D_6$ algebra and is shown to be the same as that realized from the $\\mathcal{W}A_5/\\mathcal{W}E_6$ algebra, up to a change of the free field basis. The spin-$8$ generator of the $\\mathcal{W}E_8$ algebra is built from the $\\mathcal{W}D_7$ algebra. The recursive construction of the $\\mathcal{W}BC_r$ algebras is also studied. We then realize the $\\mathcal{W}F_4$ algebra based on the $\\mathcal{W}BC_3$ algebra. Furthermore, the $\\mathcal{W}$-charges of the generators of the $\\mathcal{W}E_{6,7}$, $\\mathcal{W}BC_{2,3}$, and $\\mathcal{W}F_4$ algebras are calculated and expressed in terms of the Casimir invariants.", "url": "https://arxiv.org/abs/2609.14345", "type": "理论", "summary": "我们研究与特殊李代数 $E_6$、$E_7$、$E_8$ 和 $F_4$ 相关的 $\\mathcal{W}$ 代数的自由场实现。我们开发了一种递归结构，其中等级为 $r$ 的 $\\mathcal{W}$ 代数是从等级为 $r-1$ 的 $\\mathcal{W}$ 代数与自由玻色子一起获得的。 $\\mathcal{W}$-电流是根据与屏蔽电荷的零换向关系构造的。 $\\mathcal{W}E_6/\\mathcal{W}E_7$ 代数是由 $\\mathcal{W}D_5/\\mathcal{W}D_6$ 代数构造的，并且与 $\\mathcal{W}A_5/\\mathcal{W}E_6$ 代数实现的相同，直到自由场基发生变化。 $\\mathcal{W}E_8$ 代数的 spin-$8$ 生成器是根据 $\\mathcal{W}D_7$ 代数构建的。还研究了 $\\mathcal{W}BC_r$ 代数的递归构造。然后我们基于$\\mathcal{W}BC_3$代数实现$\\mathcal{W}F_4$代数。此外，$\\mathcal{W}E_{6,7}$、$\\mathcal{W}BC_{2,3}$和$\\mathcal{W}F_4$代数的生成元的$\\mathcal{W}$电荷是用卡西米尔不变量计算和表达的。", "authors": [{"name": "Daichi Ide"}, {"name": "Katsushi Ito"}, {"name": "Shigeki Miyazaki"}], "featured_authors": [{"name": "Daichi Ide"}, {"name": "Katsushi Ito"}, {"name": "Shigeki Miyazaki"}], "author_count": 3}, {"id": "2609.14401", "category": "hep-th", "title": "Entanglement Harvesting Landscapes: A Common Computational Framework", "abstract": "Entanglement harvesting provides an operational means of probing the nonlocal correlation structure of quantum fields through localized detector-field interactions. Although harvesting has been investigated in a wide variety of spacetime backgrounds and quantum field states, existing studies largely focus on individual detector configurations or specific physical settings. In this work, we develop a unified perturbative framework for entanglement harvesting with localized Unruh-DeWitt detectors that is applicable to arbitrary detector trajectories and quantum field states through the corresponding Wightman function. By expressing the detector response in terms of dimensionless variables and analytically reducing the perturbative integrals to numerically efficient representations, the framework enables a systematic exploration of multidimensional harvesting landscapes, phase boundaries, and harvesting robustness. As representative applications, we investigate inertial detectors in the Minkowski vacuum, thermal field states, and uniformly accelerated observers. We show that finite temperature enhances both the local detector response and the nonlocal exchange amplitude, leading, within the perturbative Gaussian-switching framework considered here, to an enlargement of the harvesting region in parameter space. The resulting harvesting landscapes provide a global characterization of detector-field interactions and demonstrate how temperature and observer motion reshape the competition between local detector noise and nonlocal field correlations. The framework developed here provides a unified and readily extensible methodology for investigating entanglement harvesting across a broad class of relativistic quantum systems.", "url": "https://arxiv.org/abs/2609.14401", "type": "理论", "summary": "纠缠收获提供了一种通过局域探测器场相互作用探测量子场非局域相关结构的操作方法。尽管收集已经在各种时空背景和量子场状态下进行了研究，但现有的研究主要集中在单个探测器配置或特定的物理设置上。在这项工作中，我们开发了一个统一的微扰框架，用于使用局部 Unruh-DeWitt 探测器进行纠缠收获，该框架通过相应的 Wightman 函数适用于任意探测器轨迹和量子场态。通过用无量纲变量表达探测器响应，并通过分析将微扰积分减少为数值有效的表示，该框架能够系统地探索多维采集景观、相边界和采集鲁棒性。作为代表性应用，我们研究了闵可夫斯基真空中的惯性探测器、热场状态和均匀加速观测器。\n\n我们表明，有限温度增强了局部探测器响应和非局部交换幅度，从而在此处考虑的微扰高斯切换框架内导致参数空间中收集区域的扩大。由此产生的采集景观提供了探测器与场相互作用的全局特征，并展示了温度和观察者运动如何重塑局部探测器噪声和非局部场相关性之间的竞争。这里开发的框架提供了一种统一且易于扩展的方法，用于研究广泛的相对论量子系统中的纠缠收获。", "authors": [{"name": "Rahul Nigam"}, {"name": "Ujjwala Vadrevu"}, {"name": "Akshay Kulkarni"}], "featured_authors": [{"name": "Rahul Nigam"}, {"name": "Ujjwala Vadrevu"}, {"name": "Akshay Kulkarni"}], "author_count": 3}, {"id": "2609.14423", "category": "hep-th", "title": "Caterpillar Degenerations of Spectral Curves and Double Gelfand-Zeitlin Geometry", "abstract": "In this paper, we study the decomposition, in the caterpillar or weak-coupling limit, of a spectral curve with two irregular poles of order two, namely a spectral curve of type $(2,2)$, into two spectral curves each having one regular singularity(order-$1$ pole) and one irregular pole of order two, namely spectral curves of type $(1,2)$ or $(2,1)$. Such spectral curves can be identified with a double Gelfand--Zeitlin (DGZ) system. We show that the Duistermaat--Heckman measure on the DGZ side can be identified with the Weyl measure on the gauge-theory side arises from gluing two quivers. Furthermore, the Fourier expansion of the isomonodromic tau function can be interpreted as a Peter--Weyl expansion in the real polarization of the DGZ system. On the other hand, we introduce the nodal caterpillar spectral network. Applying the caterpillar spectral network, we then obtain an explicit expression for the Stokes matrix up to a normalization factor. This expression agrees with the existing analytic formulas. Moreover, we identify the variation of endpoint normalization arising in the Stokes computation with the equivariant Euler class of the fluctuation complex over the Coulomb moduli space. As a result, the variations produce both the perturbative coefficients of isomonodromy tau and the perturbative partition function, and thus give an identification of them without using conformal blocks. Finally, using the gluing technique for spectral curves and the DGZ system, we predict the perturbative coefficients of the conjectural higher-rank $P_{\\mathrm{III}}$ isomonodromic tau function from the viewpoint of spectral geometry.", "url": "https://arxiv.org/abs/2609.14423", "type": "理论", "summary": "在本文中，我们研究在毛毛虫或弱耦合极限下，将具有两个二阶不规则极点的谱曲线（即 $(2,2)$ 类型的谱曲线）分解为两条谱曲线，每条谱曲线具有一个正则奇点（阶 $1$ 极点）和一个二阶不规则极点，即 $(1,2)$ 或 $(2,1)$ 类型的谱曲线。这种光谱曲线可以用双 Gelfand-Zeitlin (DGZ) 系统来识别。我们表明，DGZ 侧的 Duistermaat-Heckman 测度可以与规范理论侧的 Weyl 测度相同，这是由粘合两个箭袋产生的。此外，等单向 tau 函数的傅立叶展开可以解释为 DGZ 系统真实极化中的 Peter-Weyl 展开。另一方面，我们介绍了节点毛毛虫谱网络。应用卡特彼勒谱网络，我们可以获得斯托克斯矩阵高达归一化因子的显式表达式。该表达式与现有的解析公式一致。\n\n此外，我们利用库仑模空间上涨落复形的等变欧拉类来识别斯托克斯计算中出现的端点归一化的变化。结果，这些变化产生了等单性 tau 的扰动系数和扰动配分函数，从而无需使用共形块即可识别它们。最后，利用谱曲线粘合技术和DGZ系统，从谱几何的角度预测了猜想的高阶$P_{\\mathrm{III}}$等单向tau函数的微扰系数。", "authors": [{"name": "George Y. Liu"}], "featured_authors": [{"name": "George Y. Liu"}], "author_count": 1}, {"id": "2609.14497", "category": "hep-th", "title": "M2 brane in AdS$_4\\times S^7/\\mathbb Z_k$: 2-loop correction to $\\frac{1}{2}$-BPS Wilson loop vs localization in ABJM theory", "abstract": "We study the quantization of an M2 brane wrapping $\\mathrm{AdS}_2\\times S^1$ inside $\\mathrm{AdS}_4\\times S^7/\\mathbb{Z}_k$, dual to the $\\frac{1}{2}$-BPS circular Wilson loop in ABJM theory. The classical action and the one-loop contribution were previously shown to reproduce the gauge-theory localization result. Here we extend the analysis to the two-loop order. In an adapted static and $\\kappa$-symmetry gauge the world-volume action contains no cubic interaction vertices, so that the two-loop correction is determined entirely by quartic interactions and is manifestly free of logarithmic UV divergences. We find that the bosonic and fermionic contributions combine into a perfect square $ {\\mathscr X}^2$ where ${\\mathscr X}$ is a linear combination of the bosonic and fermionic 3d Green's functions and their derivatives. The evaluation of $\\mathscr X$ requires fixing the $\\mathrm{AdS}_2$ boundary quantization of the massless fermionic modes. With the boundary conditions selected by the preserved supersymmetry, $\\mathscr X$ vanishes and hence the complete two-loop correction is found to be zero. This result would not be consistent with identifying the M2-brane loop expansion directly with the large-$N$ expansion of the canonical, fixed-$(N,k)$ localization prediction. Instead, it agrees precisely with the recent proposal that the semiclassical M2-brane partition function should be matched to the gauge-theory grand-canonical ensemble, in which the Wilson loop expectation value is perturbatively one-loop exact. The vanishing of the two-loop correction thus provides a non-trivial test of this grand-canonical identification.", "url": "https://arxiv.org/abs/2609.14497", "type": "理论", "summary": "我们研究了在 $\\mathrm{AdS}_2\\times S^1$ 内部包裹 $\\mathrm{AdS}_2\\times S^1$ 的 M2 膜的量化 $\\mathrm{AdS}_4\\times S^7/\\mathbb{Z}_k$，与 ABJM 理论中的 $\\frac{1}{2}$-BPS 圆形 Wilson 环对偶。先前已证明经典作用和单环贡献可以重现规范理论定位结果。这里我们将分析扩展到二循环阶。在适应的静态和 $\\kappa$ 对称规范中，世界体积作用不包含三次相互作用顶点，因此双环校正完全由四次相互作用确定，并且明显不受对数 UV 发散的影响。我们发现玻色子和费米子的贡献组合成一个完美的平方$ {\\mathscr X}^2$，其中${\\mathscr X}$是玻色子和费米子3d格林函数及其导数的线性组合。 $\\mathscr X$ 的评估需要修复无质量费米子模式的 $\\mathrm{AdS}_2$ 边界量化。在保留超对称性选择的边界条件下，$\\mathscr X$ 消失，因此发现完整的两环校正为零。\n\n该结果与直接使用规范的固定 $(N,k)$ 定位预测的大 $N$ 扩展来识别 M2 膜循环扩展不一致。相反，它与最近的提议完全一致，即半经典 M2 膜配分函数应该与规范理论大正则系综相匹配，其中威尔逊环期望值是微扰单环精确的。因此，双环校正的消失为这种大规范识别提供了一个重要的测试。", "authors": [{"name": "M. Beccaria"}, {"name": "S.A. Kurlyand"}, {"name": "A.A. Tseytlin"}, {"name": "J. van Muiden"}], "featured_authors": [{"name": "M. Beccaria"}, {"name": "S.A. Kurlyand"}, {"name": "A.A. Tseytlin"}, {"name": "J. van Muiden"}], "author_count": 4}, {"id": "2609.14603", "category": "hep-th", "title": "Attraction and repulsion along extremal Einstein--two-Maxwell--dilaton branches", "abstract": "We study extremal mass branches in four-dimensional Einstein gravity coupled to one dilaton and two Maxwell fields with opposite-sign dilaton couplings. For generic couplings the extremal mass is governed by a nonlinear first-order equation with no known closed-form solution. We prove that this equation has a unique positive $C^2$ solution on the full real charge-ratio line and that the solution is real analytic, so positivity on the entire positive charge cone selects a unique global mass branch. Along this branch, any two nonproportional positive charge vectors attract for $ab>-1$, have vanishing leading force at $ab=-1$, and repel for $ab<-1$. The same transition fixes the transverse convexity of the extremal mass surface and the sign of the mass difference under arbitrary finite positive-charge partitions. The sign theorem extends to higher dimensions through the known dimensional rescaling. A radial reconstruction then shows that every point of the mass branch defines an asymptotically flat exterior with a finite-area inner endpoint, while smooth or analytic horizon extension is a separate condition that restricts the couplings and scalar flow.", "url": "https://arxiv.org/abs/2609.14603", "type": "理论", "summary": "我们研究了四维爱因斯坦引力中的极值质量分支，该引力与一个膨胀子场和两个具有相反符号膨胀子耦合的麦克斯韦场耦合。对于一般耦合，极值质量由没有已知闭合形式解的非线性一阶方程控制。我们证明该方程在完整的实电荷比线上有唯一的正 $C^2$ 解，并且该解是实解析的，因此整个正电荷锥上的正性选择了唯一的全局质量分支。沿着该分支，任何两个不成比例的正电荷矢量在 $ab>-1$ 时吸引，在 $ab=-1$ 时主导力消失，在 $ab<-1$ 时排斥。相同的转变固定了任意有限正电荷分区下极值质量表面的横向凸性和质量差的符号。符号定理通过已知的维度重新缩放扩展到更高的维度。然后，径向重建表明，质量分支的每个点都定义了一个渐近平坦的外部，具有有限面积的内部端点，而平滑或解析的地平线延伸是限制耦合和标量流的单独条件。", "authors": [{"name": "Ye Zhou"}], "featured_authors": [{"name": "Ye Zhou"}], "author_count": 1}, {"id": "2609.14617", "category": "hep-th", "title": "Monopole fission", "abstract": "There is a 4N-dimensional moduli space of SU(2) BPS monopoles with charge N, but introducing a Higgs potential removes this degeneracy and yields a repulsive force between monopoles. However, if a point in the BPS monopole moduli space is sufficiently symmetric, then it flows to a similar non-BPS saddle point solution once the Higgs potential is introduced. Monopole fission, into constituent monopoles with lower charges, results from symmetry breaking perturbations of such saddle point solutions. This fission is investigated numerically, by evolving the gradient flow equations of the Yang-Mills-Higgs theory, with initial conditions and symmetry breaking perturbations created using rational maps between Riemann spheres. The results resemble components of BPS monopole scattering processes obtained within the geodesic approximation for low speed monopole dynamics.", "url": "https://arxiv.org/abs/2609.14617", "type": "理论", "summary": "存在带电荷 N 的 SU(2) BPS 单极子的 4N 维模空间，但引入希格斯势消除了这种简并性并在单极子之间产生排斥力。然而，如果 BPS 单极模空间中的点足够对称，那么一旦引入希格斯势，它就会流向类似的非 BPS 鞍点解。单极子裂变为具有较低电荷的组成单极子，是由此类鞍点解的对称性破缺扰动引起的。通过演化杨-米尔斯-希格斯理论的梯度流方程，利用黎曼球之间的有理图创建初始条件和对称破缺扰动，对这种裂变进行数值研究。结果类似于在低速单极动力学的测地线近似中获得的 BPS 单极散射过程的组成部分。", "authors": [{"name": "Paul Sutcliffe"}], "featured_authors": [{"name": "Paul Sutcliffe"}], "author_count": 1}, {"id": "2609.14627", "category": "hep-th", "title": "Emergent Einstein-Cartan gravity from a spinor loop", "abstract": "In Einstein-Cartan spinor gravity under the irreversible vierbein postulate, only the spinor among the first-order variables has a kinetic term of its own at tree level. Any nonzero background vierbein breaks the local-Lorentz (LL) symmetry spontaneously. Our previous work showed that the spinor loop generates the kinetic and mass terms of the LL gauge field, manifesting LL as a hidden local symmetry. Here we show that the spinor loop also generates the vierbein two-point function, while respecting the background gauge invariance and satisfying the Ward-Takahashi identities of the true gauge invariance, for both the general-coordinate and LL symmetries. The scheme-independent logarithmic divergence assembles the familiar induced-gravity ingredients: a cosmological constant, an Einstein-Hilbert and a Weyl-squared term for the metric sector, and a mass and a higher-derivative kinetic term for the totally antisymmetric torsion. In the vierbein sector, this torsion is carried by the derivative of the antisymmetric part of the linear vierbein fluctuation. This part is the would-be Nambu-Goldstone boson of the spontaneously broken LL symmetry, and its couplings in the minimally coupled action are all fixed by general-coordinate and LL gauge invariance. The five induced terms form a single effective action, manifestly invariant under both symmetries, completing the vierbein sector of the hidden-local-Lorentz emergent-gravity scenario.", "url": "https://arxiv.org/abs/2609.14627", "type": "理论", "summary": "在不可逆维宾假设下的爱因斯坦-嘉当旋量引力中，只有一阶变量中的旋量在树级上有自己的动力学项。任何非零背景 vierbein 都会自发地破坏局域洛伦兹 (LL) 对称性。我们之前的工作表明，旋量环产生 LL 规范场的动力学项和质量项，将 LL 表现为隐藏的局部对称性。在这里，我们表明，对于一般坐标和 LL 对称性，旋量循环还生成 vierbein 两点函数，同时尊重背景规范不变性并满足真实规范不变性的 Ward-Takahashi 恒等式。与方案无关的对数散度集合了熟悉的诱导引力成分：宇宙常数、爱因斯坦-希尔伯特和公制扇区的韦尔平方项，以及完全反对称挠率的质量和高阶导数动力学项。在维尔宾扇区中，该扭转由线性维尔宾波动的反对称部分的导数承载。\n\n这部分是自发破缺 LL 对称性的南部-戈德斯通玻色子，其最小耦合作用中的耦合均由一般坐标和 LL 规范不变性固定。五个诱导项形成一个有效作用，在两种对称性下明显不变，完成隐藏局部洛伦兹涌现重力场景的 vierbein 扇区。", "authors": [{"name": "Yadikaer Maitiniyazi"}, {"name": "Shinya Matsuzaki"}, {"name": "Kin-ya Oda"}, {"name": "Yoshiki Uchida"}, {"name": "Masatoshi Yamada"}], "featured_authors": [{"name": "Yadikaer Maitiniyazi"}, {"name": "Shinya Matsuzaki"}, {"name": "Kin-ya Oda"}, {"name": "Yoshiki Uchida"}, {"name": "Masatoshi Yamada"}], "author_count": 5}, {"id": "2609.14689", "category": "hep-th", "title": "BCS Gap Equation on Riemannian Manifolds: A Heat Kernel Analysis", "abstract": "In this paper, we investigate the Bardeen-Cooper-Schrieffer (BCS) theory of superconductivity formulated on a three dimensional Riemannian manifold. We derive the gap equation in the path integral picture by employing a Hubbard-Stratonovich transformation followed by a saddle point approximation. Under the assumption that the length scale set by the metric is much larger than the healing length, we solve the gap equation to find a slowly varying gap function that exhibits the effects of curvature. To rigorously address the ultraviolet divergences inherent in the gap equation, we utilize heat kernel expansion techniques, which provide a systematic and mathematically transparent renormalization scheme. We explicitly evaluate the renormalized gap equation at both zero and finite temperatures, computing the relevant integrals asymptotically in the weak-coupling limit ($\\Delta \\ll \\mu$). Furthermore, we establish a universal, regularization-independent relation connecting the finite-temperature gap to the zero-temperature gap and the temperature itself. Based on this fundamental relation, we analytically prove the monotonic decrease of the energy gap with increasing temperature ($\\partial \\Delta / \\partial T < 0$), successfully recovering the standard universal BCS behavior near the critical temperature within a curved space framework.", "url": "https://arxiv.org/abs/2609.14689", "type": "理论", "summary": "在本文中，我们研究了在三维黎曼流形上表述的巴丁-库珀-施里弗 (BCS) 超导理论。我们通过采用 Hubbard-Stratonovich 变换和鞍点近似来推导路径积分图中的间隙方程。假设度量设置的长度尺度远大于愈合长度，我们求解间隙方程以找到表现出曲率效应的缓慢变化的间隙函数。为了严格解决间隙方程中固有的紫外发散问题，我们利用热核展开技术，该技术提供了系统且数学上透明的重正化方案。我们在零温度和有限温度下明确评估重整化间隙方程，在弱耦合极限 ($\\Delta \\ll \\mu$) 内渐近计算相关积分。此外，我们建立了一种通用的、与正则化无关的关系，将有限温度间隙与零温度间隙和温度本身连接起来。\n\n基于这一基本关系，我们分析证明了能隙随着温度的升高而单调减小（$\\partial \\Delta / \\partial T < 0$），成功地恢复了弯曲空间框架内临界温度附近的标准通用 BCS 行为。", "authors": [{"name": "Levent Akant"}, {"name": "Emine Ertugrul"}, {"name": "O. Teoman Turgut"}], "featured_authors": [{"name": "Levent Akant"}, {"name": "Emine Ertugrul"}, {"name": "O. Teoman Turgut"}], "author_count": 3}, {"id": "2609.15109", "category": "hep-th", "title": "Hyperbolic monopole-type solutions in $SU(3)$ Yang-Mills theory", "abstract": "We construct $S^1$-invariant solutions of the $SU(3)$ pure Yang-Mills theory on four-dimensional Euclidean space using the Cho-Faddeev-Niemi decomposition and a harmonic map from $S^2$ into the flag manifold $F_3=SU(3)/U(1)^2$. The resulting ansatz reduces the full Yang-Mills equations to coupled radial equations. Solving the coupled equations, we derive two types of solutions: analytic self-dual solutions interpreted as noninteracting clusters of hyperbolic monopoles and non-self-dual numerical solutions that can be interpreted as hyperbolic monopole-antimonopole bound states. In the large-mass limit of the hyperbolic monopole-antimonopole bound states, their normalized action approaches the energy of the corresponding non-Bogomolny $SU(3)$ monopole in flat space.", "url": "https://arxiv.org/abs/2609.15109", "type": "理论", "summary": "我们使用 Cho-Faddeev-Niemi 分解和从 $S^2$ 到标志流形 $F_3=SU(3)/U(1)^2$ 的调和映射，在四维欧几里得空间上构造 $SU(3)$ 纯 Yang-Mills 理论的 $S^1$ 不变解。由此产生的 ansatz 将完整的 Yang-Mills 方程简化为耦合径向方程。求解耦合方程，我们得出两种类型的解：解释为双曲单极子的非相互作用簇的解析自对偶解和可解释为双曲单极子-反单极子束缚态的非自对偶数值解。在双曲单极子-反单极子束缚态的大质量极限下，它们的归一化作用接近平坦空间中相应的非博戈莫尔尼 $SU(3)$ 单极子的能量。", "authors": [{"name": "Yuki Amari"}], "featured_authors": [{"name": "Yuki Amari"}], "author_count": 1}, {"id": "2609.15237", "category": "hep-th", "title": "Quantum geometry of gravitons", "abstract": "We uncover the quantum geometric structure of graviton Wigner functions and stress-energy tensors via quantum field theory in curved spacetime, revealing the phase-space geometry of spacetime and relativistic quantum-state manifolds. We show that the polarization mode expansion of the underlying graviton field operator is fully captured by quantum geometry, as encoded in the spinor-helicity formalism, thereby establishing the geometric framework from the outset. Applying this to a weak gravitational background, we demonstrate the roles of the quantum metric and connection in describing graviton transport beyond the chiral vortical effect. We also clarify the role of the quantum metric in normalizing the perfect-fluid graviton stress tensor within this approach. This work paves the path for explorations of multistate Hilbert-space geometry in high-energy and gravitational physics. In addition, this framework naturally encompasses lower-spin excitations, allowing for a unified quantum geometric treatment of bosonic and fermionic many-body systems in condensed matter and particle physics.", "url": "https://arxiv.org/abs/2609.15237", "type": "理论", "summary": "我们通过弯曲时空中的量子场论揭示了引力维格纳函数和应力能量张量的量子几何结构，揭示了时空的相空间几何和相对论量子态流形。我们证明，量子几何完全捕获了基础引力场算符的偏振模式展开，如旋量螺旋形式主义中所编码，从而从一开始就建立了几何框架。将其应用于弱引力背景，我们证明了量子度量和联系在描述超越手性涡旋效应的引力子输运中的作用。我们还阐明了量子度量在该方法中标准化完美流体引力子应力张量中的作用。这项工作为高能和引力物理中多态希尔伯特空间几何的探索铺平了道路。此外，该框架自然包含低自旋激发，允许对凝聚态和粒子物理学中的玻色子和费米子多体系统进行统一的量子几何处理。", "authors": [{"name": "M. Mehraeen"}], "featured_authors": [{"name": "M. Mehraeen"}], "author_count": 1}, {"id": "2609.15286", "category": "hep-th", "title": "Spectral Chaos from a Fluctuating Quantum Horizon", "abstract": "Black holes are conjectured to be maximally chaotic, with their quantum spectra expected to exhibit universal random-matrix correlations. This expectation, however, has so far rested largely on holographic descriptions or on many-body models in which randomness is introduced rather than derived from the microscopic degrees of freedom of the horizon itself. In the horizon matrix model, the fuzzy sphere supports highly degenerate parton states whose multiplicity accounts for the black-hole entropy. We show that quantum fluctuations of the horizon geometry lift this degeneracy and generate an ensemble of one-parton Hamiltonians. Both the operator structure and the rank-dependent covariance of this ensemble are determined by the microscopic model, rather than fixed by quenched couplings. Despite this structured covariance, the resulting spectra exhibit GOE, GUE, and GSE statistics dictated by their antiunitary symmetry classes, with the adjacent-gap statistic becoming increasingly self-averaging with matrix size. The model also realizes the universal Pandey--Mehta orthogonal-to-unitary crossover, with the crossover scale determined by the microscopic geometric covariance. A rank-resolved variance analysis shows that the fluctuation strength remains broadly distributed across tensor ranks up to the microscopic cutoff, providing a microscopic basis for the observed Wigner--Dyson universality and effectively nonlocal dynamics. The antiunitary symmetry acts directly on the fuzzy-sphere geometry, so the Dyson class of a conditional Hamiltonian is determined by the antiunitary symmetry of the underlying quantum geometry. This provides a microscopic counterpart of the Stanford--Witten relation between geometry and random-matrix universality in JT gravity. These results establish a microscopic route from quantum horizon geometry to black-hole spectral chaos.", "url": "https://arxiv.org/abs/2609.15286", "type": "理论", "summary": "据推测，黑洞是最混乱的，它们的量子光谱预计会表现出普遍的随机矩阵相关性。然而，迄今为止，这种期望主要依赖于全息描述或多体模型，其中引入了随机性，而不是从视界本身的微观自由度导出随机性。在水平矩阵模型中，模糊球支持高度简并的部分子态，其多重性解释了黑洞熵。我们证明了地平线几何的量子涨落提升了这种简并性并产生了单部分哈密顿量的集合。该系综的算子结构和秩相关协方差均​​由微观模型决定，而不是由淬火耦合固定。尽管存在这种结构化协方差，生成的谱仍表现出由其反酉对称类决定的 GOE、GUE 和 GSE 统计量，并且相邻间隙统计量随着矩阵大小变得越来越自平均。该模型还实现了通用的Pandey-Mehta正交到酉交叉，交叉尺度由微观几何协方差决定。\n\n等级解析方差分析表明，波动强度在张量等级上保持广泛分布，直至微观截止，为观察到的维格纳-戴森普遍性和有效的非局域动力学提供了微观基础。反酉对称性直接作用于模糊球几何，因此条件哈密顿量的戴森类由基础量子几何的反酉对称性决定。这提供了 JT 引力中几何和随机矩阵普适性之间的斯坦福-威滕关系的微观对应。这些结果建立了从量子视界几何到黑洞光谱混沌的微观路线。", "authors": [{"name": "Chong-Sun Chu"}], "featured_authors": [{"name": "Chong-Sun Chu"}], "author_count": 1}, {"id": "2609.15316", "category": "hep-th", "title": "On the commuting charges and the Bethe ansatz for the quantised Kadomtsev-Petviashvili equation", "abstract": "We study the quantised version of the Kadomtsev-Petviashvili equation in the formulation proposed in [4]. We analyse two aspects. One is the conservation of the first higher charge $H_3$ (besides the total mass $H_0$, the momentum $H_1$ and the Hamiltonian $H_2$). We find the expression of $H_3$ and prove commutativity, provided we regularise a specific ultraviolet divergence. The result then does not depend on the choice of a regulator, under fairly general assumptions. We then study the Bethe ansatz in finite volume and obtain a general solution to the two-body problem. We have used AI supervised by us to aid the proofs.", "url": "https://arxiv.org/abs/2609.15316", "type": "理论", "summary": "我们研究了 [4] 中提出的公式中 Kadomtsev-Petviashvili 方程的量化版本。我们从两个方面来分析。一个是第一个较高电荷 $H_3$ 的守恒（除了总质量 $H_0$、动量 $H_1$ 和哈密顿量 $H_2$）。只要我们规范特定的紫外线发散度，我们就能找到 $H_3$ 的表达式并证明交换律。在相当普遍的假设下，结果并不取决于监管机构的选择。然后我们研究有限体积中的 Bethe ansatz 并获得二体问题的通用解。我们使用了我们监督的人工智能来辅助证明。", "authors": [{"name": "Chiara Paletta"}, {"name": "Alessandro Torrielli"}], "featured_authors": [{"name": "Chiara Paletta"}, {"name": "Alessandro Torrielli"}], "author_count": 2}, {"id": "2609.15512", "category": "hep-th", "title": "A fluid dual to large $D$ membrane paradigm at first subleading order", "abstract": "The large $D$ membrane paradigm establishes a duality between the dynamics of black holes and the evolution of a codimension-one timelike membrane in a non-gravitational background. In this work, we formulate the relativistic fluid dynamics dual to an uncharged black hole in asymptotically flat spacetime at the first subleading order in the $1/D$ expansion. Due to the absence of a timelike asymptotic boundary, unlike in AdS/CFT fluid-gravity duality, we construct an effective fluid intrinsically on the dynamical membrane, whose equations of motion are exactly equivalent to the subleading order membrane equations. By performing this fluid-dynamical analysis in the Landau frame, we show that the system behaves as a fluid influenced by an effective background force. Out-of-equilibrium viscous effects emerge naturally, allowing us to extract the fluid transport coefficients directly from the bulk viscous pressure and shear stress tensor. Furthermore, the fluid exhibits a negative pressure, capturing the intrinsic surface tension of the $(D-1)$-dimensional membrane worldvolume.", "url": "https://arxiv.org/abs/2609.15512", "type": "理论", "summary": "大$D$膜范式建立了黑洞动力学与非引力背景下余维一类时膜演化之间的二元性。在这项工作中，我们在 $1/D$ 展开式中的第一副主序处制定了渐近平坦时空中不带电黑洞的相对论流体动力学。由于不存在类时渐近边界，与 AdS/CFT 流体重力对偶性不同，我们在动力膜上本质上构造了有效流体，其运动方程完全等价于次导阶膜方程。通过在朗道框架中进行流体动力学分析，我们表明系统的行为就像受有效背景力影响的流体一样。非平衡粘性效应自然出现，使我们能够直接从体粘性压力和剪切应力张量中提取流体传输系数。此外，流体表现出负压，捕获 $(D-1)$ 维膜世界体积的固有表面张力。", "authors": [{"name": "Supratim Halder"}, {"name": "Manu Kurian"}, {"name": "Mangesh Mandlik"}], "featured_authors": [{"name": "Supratim Halder"}, {"name": "Manu Kurian"}, {"name": "Mangesh Mandlik"}], "author_count": 3}, {"id": "2609.15737", "category": "hep-th", "title": "Black holes and phase transitions in Conformal Gravity", "abstract": "We explore the thermodynamic properties of static black holes in conformal gravities in arbitrary, even dimensions. In the spherically symmetric case, up to local Weyl rescalings, these spacetimes are static and unique, due to a Birkhoff's theorem that applies for all conformal gravities whose Lagrangians are complete contractions of $k$ Weyl tensors in dimension $D=2k$. The solutions can be chosen to be asymptotically locally (A)dS or flat, and the horizon can be extended to be a surface of arbitrary constant curvature, $\\gamma$. We focus on the asymptotically AdS case, for which the cosmological constant at infinity is an integration constant, and compute the mass of the spacetime in terms of the diverse hair parameters which have a purely gravitational origin. We show that the first law of thermodynamics is satisfied, and study phase transitions in the canonical ensemble, showing the existence of zeroth-order black-hole/black-hole phase transitions for arbitrary dimension.", "url": "https://arxiv.org/abs/2609.15737", "type": "理论", "summary": "我们探索了任意均匀维度的共形重力下静态黑洞的热力学性质。在球对称情况下，直到局部外尔重新缩放，这些时空都是静态且唯一的，因为伯克霍夫定理适用于所有共形引力，其拉格朗日量是维度 $D=2k$ 中 $k$ 外尔张量的完全收缩。解可以选择为渐近局部 (A)dS 或平坦的，并且视界可以扩展为任意恒定曲率 $\\gamma$ 的表面。我们关注渐进 AdS 情况，其中无穷远的宇宙学常数是积分常数，并根据具有纯粹引力起源的各种毛发参数来计算时空质量。我们证明了热力学第一定律的满足，并研究了正则系综中的相变，证明了任意维度的零级黑洞/黑洞相变的存在。", "authors": [{"name": "Luis Guajardo"}, {"name": "Luis Gutiérrez Frez"}, {"name": "Seyed Naseh Sajadi"}, {"name": "Julio Oliva"}], "featured_authors": [{"name": "Luis Guajardo"}, {"name": "Luis Gutiérrez Frez"}, {"name": "Seyed Naseh Sajadi"}, {"name": "Julio Oliva"}], "author_count": 4}, {"id": "2609.15929", "category": "hep-th", "title": "String charge density/bit threads correspondence and its S-duality in type IIB supergravity", "abstract": "We identify the spatial projection of a conserved string charge density with a bit-thread flow. This correspondence gives bit threads a string worldsheet description and allows us to compute black hole entropy from the maximal entropy flux of a worldsheet-derived current. We first reproduce the BTZ entropy and then extend the construction to the ten-dimensional F1-NS5-P and D1-D5-P systems. Under Type IIB S-duality, the F1 current maps to the D1 current. Although the local currents, metrics, and flow norms change, the maximal physical flux remains unchanged and gives the same entropy. This provides a nontrivial check of the correspondence. Finally, we propose a D1-D5 boundary-matching conjecture. In the coarse-grained picture, each string-charge line defines an entropy-carrying tube. The boundary CFT entanglement entropy and the bulk black hole entropy both fix the product of the number of tubes and the maximum entropy carried by each tube. For a fixed tube discretization, they assign the same capacity to each tube. They therefore describe the same conserved maximal entropy flux, providing an information-flow interpretation of the equality between entanglement entropy and black hole entropy.", "url": "https://arxiv.org/abs/2609.15929", "type": "理论", "summary": "我们通过位线流确定了守恒串电荷密度的空间投影。这种对应关系为位线程提供了字符串世界表描述，并允许我们根据世界表导出的电流的最大熵通量来计算黑洞熵。我们首先重现 BTZ 熵，然后将构造扩展到十维 F1-NS5-P 和 D1-D5-P 系统。在 IIB 型 S 对偶性下，F1 电流映射到 D1 电流。尽管局部电流、度量和流量规范发生变化，但最大物理通量保持不变并给出相同的熵。这提供了对对应关系的重要检查。最后，我们提出了D1-D5边界匹配猜想。在粗粒度图中，每条弦电荷线定义了一个携带熵的管。边界CFT纠缠熵和体黑洞熵都固定了管的数量和每个管携带的最大熵的乘积。对于固定管离散化，他们为每个管分配相同的容量。\n\n因此，它们描述了相同的守恒最大熵通量，提供了纠缠熵和黑洞熵之间等式的信息流解释。", "authors": [{"name": "Houwen Wu"}, {"name": "Shuxuan Ying"}], "featured_authors": [{"name": "Houwen Wu"}, {"name": "Shuxuan Ying"}], "author_count": 2}, {"id": "2609.15952", "category": "hep-th", "title": "Direct-to-Symbol Integration from Landau Analysis", "abstract": "We propose a Landau-analysis-inspired strategy for directly computing the symbol of integrals that evaluate to multiple polylogarithms in twisted cohomology. The central idea is to identify all ways in which singular hypersurfaces, twisted hypersurfaces, and integration boundaries can interact when external parameters are varied, giving rise to logarithmic or algebraic branch points. By tracking how an integral is modified when analytically continued around each of its branch points, we can recursively construct its symbol. We illustrate this approach by outlining an efficient algorithm for computing the symbol of finite integrals over twisted hyperplane arrangements, when they are expanded around special values of the twist parameter. This algorithm can be used to compute the (transcendental) integrands of cosmological correlators in conformally coupled theories to any order in the twist expansion.", "url": "https://arxiv.org/abs/2609.15952", "type": "理论", "summary": "我们提出了一种受朗道分析启发的策略，用于直接计算积分符号，以计算扭曲上同调中的多个多对数。中心思想是确定当外部参数变化时奇异超曲面、扭曲超曲面和积分边界相互作用的所有方式，从而产生对数或代数分支点。通过跟踪积分在其每个分支点周围继续分析时如何修改，我们可以递归地构造其符号。我们通过概述一种有效的算法来说明这种方法，该算法用于计算扭曲超平面排列上的有限积分的符号，当它们围绕扭曲参数的特殊值展开时。该算法可用于计算共形耦合理论中宇宙相关器到扭曲展开中任意阶的（超越）被积函数。", "authors": [{"name": "Craig Larkin"}, {"name": "Andrew J. McLeod"}, {"name": "Andrzej Pokraka"}, {"name": "Lecheng Ren"}], "featured_authors": [{"name": "Craig Larkin"}, {"name": "Andrew J. McLeod"}, {"name": "Andrzej Pokraka"}, {"name": "Lecheng Ren"}], "author_count": 4}, {"id": "2609.13434", "category": "math-ph", "title": "Microscopic Parametric Correlations and Spectral Rigidity in the Non-Hermitian Threefold Way", "abstract": "We study microscopic spectral correlations between two nearby parameter values in the three non-Hermitian Gaussian bulk classes: $A$ (unconstrained), $AI^\\dagger$ (complex symmetric), and $AII^\\dagger$ (complex self-dual, with each degenerate doublet counted once). Parameter dependence is modelled by stationary matrix Ornstein--Uhlenbeck evolution, whose microscopic time scale is $N^{-1}$. For every positive integer replica number $n$, we derive exact finite-$N$ auxiliary-field integral representations for joint characteristic-polynomial moments and obtain their bulk asymptotics as $N\\to\\infty$ with $n$ fixed. With the spectrum normalized to the unit disk, correlations near a bulk point $z_0$, between spectral positions $z_1,z_2$ at times $t_1,t_2$, depend only on $s=N|z_1-z_2|^2+N(1-|z_0|^2)|t_1-t_2|$. Adopting the static Hermitian/non-Hermitian replica continuation yields explicit two-time kernels; for $AI^\\dagger$ and $AII^\\dagger$ these are replica conjectures and, to our knowledge, the first microscopic two-time kernels proposed for these classes. They determine density correlations, cross-time eigenvalue-count covariances, and equal-time number variances. For a disk of mean eigenvalue count $y$, the latter obey $\\mbox{Var}\\mathcal N_X(D_y)=\\kappa_X\\sqrt y+ \\beta_X/\\sqrt y+o(y^{-1/2})$, with explicitly given constants for each class. Exact perturbation theory further identifies eigenvector nonorthogonality as the mechanism of short-time spectral diffusion and yields a basis-independent condition number for a two-dimensional Kramers eigenspace in class $AII^\\dagger$. Direct simulations agree quantitatively with its conjectured inverse-gamma law.", "url": "https://arxiv.org/abs/2609.13434", "type": "理论", "summary": "我们研究三个非厄米高斯体类中两个邻近参数值之间的微观光谱相关性：$A$（无约束）、$AI^\\dagger$（复对称）和 $AII^\\dagger$（复自对偶，每个简并双峰计数一次）。参数依赖性通过平稳矩阵Ornstein--Uhlenbeck演化来建模，其微观时间尺度为$N^{-1}$。对于每个正整数副本数 $n$，我们导出联合特征多项式矩的精确有限 $N$ 辅助场积分表示，并获得其整体渐近线为 $N\\to\\infty$（其中 $n$ 固定）。将频谱标准化为单位圆盘后，在时间 $t_1,t_2$ 时的频谱位置 $z_1,z_2$ 之间的大点 $z_0$ 附近的相关性仅取决于 $s=N|z_1-z_2|^2+N(1-|z_0|^2)|t_1-t_2|$。采用静态 Hermitian/非 Hermitian 副本延续会产生显式的两次内核；对于 $AI^\\dagger$ 和 $AII^\\dagger$ 来说，这些是复制猜想，据我们所知，这是为这些类提出的第一个微观二次内核。它们确定密度相关性、跨时间特征值计数协方差和等时间数方差。\n\n对于平均特征值计数 $y$ 的磁盘，后者服从 $\\mbox{Var}\\mathcal N_X(D_y)=\\kappa_X\\sqrt y+ \\beta_X/\\sqrt y+o(y^{-1/2})$，并为每个类明确给出常量。精确微扰理论进一步将特征向量非正交性识别为短时谱扩散机制，并为 $AII^\\dagger$ 类中的二维 Kramers 特征空间生成与基无关的条件数。直接模拟在数量上与其推测的逆伽马定律一致。", "authors": [{"name": "Yan V Fyodorov"}], "featured_authors": [{"name": "Yan V Fyodorov"}], "author_count": 1}, {"id": "2609.14172", "category": "math-ph", "title": "Certified robustness of quantum spin textures under magnetic-field perturbations", "abstract": "How much can a magnetic field change before a quantum spin texture loses its skyrmion charge? We address this question by combining the geometry of local spin expectation values with spectral perturbation theory. For a triangulated spin-$s$ texture, we determine the smallest change in its local moments that makes the reconstructed topological charge ill-defined, allowing unequal error bounds and fixed boundary moments. This geometric threshold yields explicit bounds on magnetic-field perturbations that preserve the ground-state charge, with $1/N$ scaling when the gap and geometric margin have positive limits. We apply the bounds to finite spin-$1/2$ systems with exchange and Dzyaloshinskii--Moriya interactions. In a rigorously verified seven-spin example, the charge changes at a single certified field while the excitation gap and all local spin polarizations remain bounded away from zero; at such a crossing the geometric margin and the field certificate vanish linearly. The results provide quantitative certificates of texture stability and clarify the limitations of spectral-gap protection.", "url": "https://arxiv.org/abs/2609.14172", "type": "理论", "summary": "在量子自旋结构失去斯格明子电荷之前，磁场可以改变多少？我们通过将局部自旋期望值的几何形状与谱微扰理论相结合来解决这个问题。对于三角自旋 $s$ 纹理，我们确定其局部矩的最小变化，该变化使重建的拓扑电荷定义不明确，从而允许不等的误差界限和固定的边界矩。该几何阈值对保持基态电荷的磁场扰动产生明确的界限，当间隙和几何裕度具有正极限时，具有 $1/N$ 缩放比例。我们将边界应用于具有交换和 Dzyaloshinskii-Moriya 相互作用的有限自旋 $1/2$ 系统。在经过严格验证的七自旋示例中，电荷在单个认证场中发生变化，而激发间隙和所有局部自旋极化仍然远离零；在这样的交叉处，几何边缘和现场证书线性消失。结果提供了纹理稳定性的定量证明，并阐明了光谱间隙保护的局限性。", "authors": [{"name": "Raúl Sánchez Galán"}, {"name": "Robert Wieser"}], "featured_authors": [{"name": "Raúl Sánchez Galán"}, {"name": "Robert Wieser"}], "author_count": 2}, {"id": "2609.14209", "category": "math-ph", "title": "Pauli Supported Invariants for Periodic Graphs-Derived Hamiltonians", "abstract": "We introduce a graph invariant obtained from Pauli decompositions of Hamiltonians derived from local graph neighborhoods. Given a rooted h-hop neighborhood, we construct a local adjacency operator, embed it into a common Hilbert space dimension, and define its Pauli-support set as the collection of Pauli strings appearing with nonzero coefficients. For periodic graphs, we prove invariance under lattice-compatible graph equivalence and establish converse results under root-separation hypothesis. The framework naturally extends to Lie closures, commutants, and Cartan-type structures generated by the associated Pauli supports. We further discuss extensions to aperiodic graphs with finite local complexity and make connections to cut-and-project models of quasicrystals and notably, Penrose tilings. From a quantum information perspective, the resulting invariants provide a operator-theoretic description of graph-based Hamiltonians and offer a new mechanism for comparing graph-based quantum systems through Pauli-support data.", "url": "https://arxiv.org/abs/2609.14209", "type": "理论", "summary": "我们引入了从局部图邻域导出的哈密顿量的泡利分解获得的图不变量。给定一个有根 h 跳邻域，我们构造一个局部邻接算子，将其嵌入到公共希尔伯特空间维度中，并将其泡利支持集定义为以非零系数出现的泡利串的集合。对于周期图，我们证明了格兼容图等价下的不变性，并在根分离假设下建立了相反的结果。该框架自然地扩展到由相关泡利支持生成的李闭包、交换子和嘉当型结构。我们进一步讨论了具有有限局部复杂性的非周期图的扩展，并与准晶体的切割和投影模型（特别是彭罗斯平铺模型）建立了联系。从量子信息的角度来看，所得的不变量提供了基于图的哈密顿量的算子理论描述，并提供了一种通过泡利支持数据比较基于图的量子系统的新机制。", "authors": [{"name": "Sarah Chehade"}, {"name": "Andrew Vlasic"}, {"name": "Rebekah Herrman"}, {"name": "Rick Mukherjee"}], "featured_authors": [{"name": "Sarah Chehade"}, {"name": "Andrew Vlasic"}, {"name": "Rebekah Herrman"}, {"name": "Rick Mukherjee"}], "author_count": 4}, {"id": "2609.14242", "category": "math-ph", "title": "Liouville integrability of Beltrami-Maxwell fields with sources: A geometric theory of magnetic surfaces", "abstract": "We study classical Maxwell fields with non-trivial sources in four-dimensional Minkowski spacetime. In particular, contact and symplectic geometric aspects are discussed. As a point of departure, it is shown that a few classes of solutions with sources are constructed from the so-called Beltrami fields, where these fields are contact forms on three-dimensional Riemannian manifolds. In addition, several applications in these classes are provided. One is to give a solution to the London equations for superconductors. Another one is that, if there is a non-trivial conserved quantity along the magnetic vector field, then the Maxwell system can be viewed as a Liouville integrable Hamiltonian system on a four-dimensional symplectic manifold, where this manifold is obtained by a symplectization of the contact manifold. As examples, Maxwell fields with the Lundquist model, a restricted case of the ABC flow model, and so on, are shown to be integrable in the above sense.", "url": "https://arxiv.org/abs/2609.14242", "type": "理论", "summary": "我们研究四维闵可夫斯基时空中具有非平凡源的经典麦克斯韦场。特别讨论了接触和辛几何方面。作为出发点，它表明几类具有源的解是从所谓的贝尔特拉米场构造的，其中这些场是三维黎曼流形上的接触形式。此外，还提供了这些类别中的多个应用程序。一是给出超导体伦敦方程的解。另一个是，如果沿着磁矢量场存在非平凡守恒量，那么麦克斯韦系统可以被视为四维辛流形上的刘维尔可积哈密顿系统，其中该流形是通过接触流形的辛化获得的。作为例子，具有 Lundquist 模型的麦克斯韦场、ABC 流模型的限制情况等等，在上述意义上被证明是可积的。", "authors": [{"name": "Shin-itiro Goto"}], "featured_authors": [{"name": "Shin-itiro Goto"}], "author_count": 1}, {"id": "2609.14949", "category": "math-ph", "title": "Boundary transmission and excursion geometry in the Lorentz mirror model: a numerical study", "abstract": "We study boundary transmission and excursion geometry in the planar Lorentz mirror model through finite-volume numerical experiments. Cylinder penetration quantiles grow approximately linearly with circumference over the simulated range, with a systematic upward drift in the normalized quantiles when vacancies are present. Estimated slab-transmission probabilities yield exponential confinement bounds with quantified statistical confidence at the tested widths. Planar excursions conditioned to reach a distant boundary exhibit transverse ranges proportional to the exit radius, while their repeated-visit fractions vary strongly with mirror density. Endpoint-label collision probabilities substantially exceed a general gluing lower bound, although they account for only part of the observed same-column crossing probability. Finally, rerouting at repeated vertices preserves the exit while substantially shortening the sampled paths. These findings characterize finite-volume transport and excursion geometry without determining an asymptotic scaling exponent or resolving infinite-plane localization.", "url": "https://arxiv.org/abs/2609.14949", "type": "理论", "summary": "我们通过有限体积数值实验研究平面洛伦兹镜模型中的边界传输和偏移几何。在模拟范围内，圆柱渗透分位数与周长近似线性增长，当存在空位时，标准化分位数会系统性向上漂移。估计的平板传输概率产生指数限制边界，并在测试宽度上具有量化的统计置信度。达到远处边界的平面偏移表现出与出口半径成正比的横向范围，而它们的重复访问分数随镜面密度的变化而变化很大。端点标签碰撞概率大大超过了一般粘合下限，尽管它们仅占观察到的同列交叉概率的一部分。最后，在重复顶点处重新路由可以保留出口，同时大大缩短采样路径。这些发现表征了有限体积传输和偏移几何形状，而无需确定渐近标度指数或解决无限平面定位。", "authors": [{"name": "Jian Gu"}, {"name": "Qin Hao"}], "featured_authors": [{"name": "Jian Gu"}, {"name": "Qin Hao"}], "author_count": 2}, {"id": "2609.15812", "category": "math-ph", "title": "The Robust Ten Martini Problem", "abstract": "We solve the robust ten martini problem: Cantor spectrum with no arithmetic restriction on the irrational frequency for Type I analytic one-frequency quasiperiodic Schrodinger operators. We introduce Type I through a new acceleration-type quantity with stability under analytic perturbations. This yields a global open class of analytic potentials whose associated operators have Cantor spectrum for every irrational frequency.", "url": "https://arxiv.org/abs/2609.15812", "type": "理论", "summary": "我们解决了稳健的十马提尼问题：I 类解析单频准周期薛定谔算子的无理频率没有算术限制的康托谱。我们通过在分析扰动下具有稳定性的新加速型量引入类型 I。这产生了解析势的全局开放类，其相关算子具有每个无理频率的康托谱。", "authors": [{"name": "Lingrui Ge"}, {"name": "Svetlana Jitomirskaya"}, {"name": "Jiangong You"}], "featured_authors": [{"name": "Lingrui Ge"}, {"name": "Svetlana Jitomirskaya"}, {"name": "Jiangong You"}], "author_count": 3}, {"id": "2609.15908", "category": "math-ph", "title": "Sharp decay thresholds for eigenvalues of discrete Schrödinger operators on $\\mathbb{Z}^2$", "abstract": "We study eigenvalues of discrete Schrödinger operators $H=\\Delta+V$ on $\\mathbb{Z}^2$, where $\\Delta$ is the uncentered Laplacian, i.e., the un-normalized adjacency operator of $\\mathbb{Z}^2$ and $V$ decays at infinity. By Weyl's theorem, the essential spectrum of $H$ is $[-4,4]$. We determine the sharp decay thresholds for existence of eigenvalues in three distinct spectral regimes. While it is natural to expect different behavior at the spectral edge $\\lambda=\\pm4$, and the bulk, there is a further distinction between the regular energies $0<|\\lambda|<4$ and the interior critical energy $\\lambda=0$ stemming from the reducibility of the corresponding Fermi surface in the latter case. For every $0<|\\lambda|<4$, we construct potentials $V$ satisfying $|V(n)|\\leq C|n|^{-1}$ for which $\\lambda$ is an eigenvalue of $\\Delta+V$, and prove absence of eigenvalues when $|V(n)|\\leq C|n|^{-1-\\varepsilon}$ for some $\\varepsilon>0$. At $\\lambda=0$, the critical power changes and we construct potentials $V$ satisfying $|V(n)|\\leq C|n| ^{-2}$ for which $0$ is an eigenvalue of $\\Delta+V$, as well as prove absence when $|V(n)|\\leq C|n|^{-2-\\varepsilon}$ for any $\\varepsilon>0$. Finally, at each spectral edge, we show that, for every $K\\geq3$, an eigenvalue can be created by potentials supported on exactly $K$ sites, whereas a potential supported on at most two sites cannot create an edge eigenvalue. The proofs combine Green-function expansions and moment cancellation, Hilbert-space-valued iterations, discrete Carleman estimates, and a uniform Green-kernel estimate.", "url": "https://arxiv.org/abs/2609.15908", "type": "理论", "summary": "我们研究 $\\mathbb{Z}^2$ 上离散薛定谔算子 $H=\\Delta+V$ 的特征值，其中 $\\Delta$ 是无中心拉普拉斯算子，即 $\\mathbb{Z}^2$ 和 $V$ 的非归一化邻接算子在无穷大衰减。根据Weyl定理，$H$的本质谱是$[-4,4]$。我们确定了三个不同光谱范围中特征值存在的急剧衰减阈值。虽然在光谱边缘 $\\lambda=\\pm4$ 和体块上期望有不同的行为是很自然的，但常规能量 $0<|\\lambda|<4$ 和内部临界能量 $\\lambda=0$ 之间存在进一步的区别，这源于后一种情况下相应费米表面的可还原性。对于每个$0<|\\lambda|<4$，我们构建满足$|V(n)|\\leq C|n|^{-1}$的势$V$，其中$\\lambda$是$\\Delta+V$的特征值，并证明当$|V(n)|\\leq C|n|^{-1-\\varepsilon}$对于某些$\\varepsilon>0$时不存在特征值。在 $\\lambda=0$ 处，临界功率发生变化，我们构建满足 $|V(n)|\\leq C|n| 的势 $V$ ^{-2}$ 其中 $0$ 是 $\\Delta+V$ 的特征值，并证明当 $|V(n)|\\leq C|n|^{-2-\\varepsilon}$ 对于任何 $\\varepsilon>0$ 时不存在。\n\n最后，在每个谱边缘，我们表明，对于每个 $K\\geq3$，可以通过恰好 $K$ 站点上支持的势来创建特征值，而最多两个站点上支持的势不能创建边缘特征值。该证明结合了格林函数展开和矩消除、希尔伯特空间值迭代、离散卡尔曼估计和统一格林核估计。", "authors": [{"name": "Shirshendu Ganguly"}, {"name": "Wencai Liu"}], "featured_authors": [{"name": "Shirshendu Ganguly"}, {"name": "Wencai Liu"}], "author_count": 2}, {"id": "2609.13312", "category": "quant-ph", "title": "Physical Counterexamples to the Wigner Shannon Entropy Conjecture", "abstract": "We construct physical quantum states with everywhere positive Wigner functions whose Shannon entropy lies below the vacuum value $1+\\ln\\pi$. Besides an explicit finite-energy counterexample, we obtain rank-two finite-Fock-support families with analytic positivity and entropy bounds. For fixed Fock level $n$ and coherence fraction $0\\le\\lambda<1$, the entropy difference satisfies $h(W)-(1+\\ln\\pi)=(2n-2^n\\lambda^2)t^2+O_{n,\\lambda}(t^4)$, yielding finite-support counterexamples for every $n\\ge3$ above an explicit coherence threshold. We also show that the absence of a negative quadratic term does not preclude entropy descent: a fully coherent vacuum--one-photon core with a vanishing positive thermal repair gives $h(W)-(1+\\ln\\pi)=-4t^6/3+o(t^6)$. For the vacuum--three-photon construction, we determine the logarithmic asymptotic of the minimum fixed-thermal mixing weight required for Wigner nonnegativity. Finally, optimizing over all one-mode Wigner-nonnegative states with mean photon number at most $E$, we prove that the maximal entropy deficit has the sharp scale $E^\\gamma/[\\ln(1/E)]^\\beta$, where $\\gamma\\simeq0.7412033679$ and $\\beta\\simeq0.5861054961$. Thus the vacuum entropy is recovered as $E\\to0$, but the optimal deficit decays much more slowly than any universal linear correction in the mean energy.", "url": "https://arxiv.org/abs/2609.13312", "type": "理论+数值", "summary": "我们构造具有处处正维格纳函数的物理量子态，其香农熵低于真空值 $1+\\ln\\pi$。除了明确的有限能量反例之外，我们还获得了具有解析正性和熵界的二阶有限 Fock 支持族。对于固定 Fock 水平 $n$ 和相干分数 $0\\le\\lambda<1$，熵差满足 $h(W)-(1+\\ln\\pi)=(2n-2^n\\lambda^2)t^2+O_{n,\\lambda}(t^4)$，为每个高于显式相干阈值的 $n\\ge3$ 生成有限支持反例。我们还表明，不存在负二次项并不排除熵下降：具有消失正热修复的完全相干真空单光子核心给出 $h(W)-(1+\\ln\\pi)=-4t^6/3+o(t^6)$。对于真空三光子结构，我们确定了维格纳非负性所需的最小固定热混合权的对数渐近。最后，对平均光子数最多 $E$ 的所有单模维格纳非负状态进行优化，我们证明最大熵赤字具有尖锐的尺度 $E^\\gamma/[\\ln(1/E)]^\\beta$，其中 $\\gamma\\simeq0.7412033679$ 和 $\\beta\\simeq0.5861054961$。\n\n因此，真空熵恢复为 $E\\to0$，但最佳赤字的衰减速度比平均能量的任何通用线性校正要慢得多。", "authors": [{"name": "Zixuan He"}], "featured_authors": [{"name": "Zixuan He"}], "author_count": 1}, {"id": "2609.13360", "category": "quant-ph", "title": "Structured Quantum Kernels for Chaotic Forecasting", "abstract": "Quantum kernels promise exponentially large feature spaces, but expressive circuits render their Gram matrices uninformative, bandwidth tuning collapses them toward classical RBF, and the practical consensus is that quantum kernels add nothing on classical data. We answer another productive question, an architectural one: whether the structure of an encoding circuit can carry an inductive bias that tuned classical kernels lack. We introduce AeRot, a quantum kernel fusing amplitude encoding of l2-normalized delay windows with a grouped single-qubit rotation layer that assigns contiguous temporal blocks to each qubit, making the circuit delay-window-aware. On Lorenz-63 kernel ridge regression with cross-validated bandwidths over 100 seeds, AeRot outperforms tuned RBF and Matern-5/2, the advantage emerging at physical horizons >= 0.15 tu and reaching +0.137 mean R^2 at 0.25 tu (5 qubits, window 32). Linear-stability analysis of the window tail localises the advantage to the unstable saddle-approach regime: AeRot wins 83% of windows in the most unstable decile, with the win rate rising monotonically with tail instability and a sign flip at the local stability boundary. The difficulty is fold-branch ambiguity: trajectories approaching the saddle are locally diverging, and Euclidean kernels struggle to resolve which lobe the trajectory will commit to. Structural diagnostics confirm Gram matrices structurally distinct from tuned RBF, with strictly higher target-kernel alignment at every horizon. The gain is architectural: a finite-sample inductive-bias effect of temporally structured encoding on a folded attractor, with no computational-separation claim attached. To our knowledge this is the first mechanistic localisation of quantum-kernel advantage to a specific dynamical regime of a classical system.", "url": "https://arxiv.org/abs/2609.13360", "type": "理论", "summary": "量子内核承诺指数级大的特征空间，但表达电路使其 Gram 矩阵缺乏信息，带宽调整使它们向经典 RBF 崩溃，而实际共识是量子内核不会在经典数据上添加任何内容。我们回答了另一个富有成效的问题，一个架构问题：编码电路的结构是否可以携带调整经典内核所缺乏的归纳偏差。我们引入了 AeRot，这是一种量子内核，它将 l2 归一化延迟窗口的幅度编码与分组的单量子位旋转层相融合，该旋转层为每个量子位分配连续的时间块，从而使电路具有延迟窗口感知能力。在具有超过 100 个种子的交叉验证带宽的 Lorenz-63 核岭回归上，AeRot 优于调整的 RBF 和 Matern-5/2，在物理视野 >= 0.15 tu 时
