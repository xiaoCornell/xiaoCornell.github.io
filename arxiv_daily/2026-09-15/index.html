hors": [{"name": "Tingfei Li"}], "author_count": 1}, {"id": "2609.15705", "category": "quant-ph", "title": "Performance in Symmetry-Restricted Searches for Post-Quantum Correlations", "abstract": "Searches for post-quantum correlations depend on two distinct ingredients: how abundant such correlations are in the underlying correlation space and how efficiently the chosen representation preserves their distinguishability from quantum correlations. We quantify these effects by introducing the popularity rate and the projection acceptance, whose product defines the search performance. We illustrate these concepts in binary-outcome Bell scenarios with symmetry-related sites, using the CHSH and pyramid representations. Particular attention is paid to the distinction between exchange-symmetric synchronous correlations and correlations satisfying only exchange symmetry. In the synchronous quantum sector, the common-vector representation follows automatically from synchrony, whereas exchange symmetry alone defines a substantially larger correlation space. We show that this distinction can qualitatively change the effectiveness of a projected search: the pyramid representation, which retains substantial discriminatory power in the synchronous sector, has no discriminatory power when only exchange symmetry is imposed. Our results provide a simple framework for assessing and comparing searches for post-quantum correlations.", "url": "https://arxiv.org/abs/2609.15705", "type": "理论", "summary": "对后量子相关性的搜索取决于两个不同的因素：底层相关性空间中此类相关性的丰富程度以及所选表示如何有效地保持其与量子相关性的区别。我们通过引入流行率和预测接受度来量化这些影响，其乘积定义了搜索性能。我们使用 CHSH 和金字塔表示，在具有对称性相关位点的二元结果 Bell 场景中说明这些概念。特别注意交换对称同步相关性和仅满足交换对称性的相关性之间的区别。在同步量子领域，公共向量表示自动遵循同步，而交换对称性单独定义了更大的相关空间。我们表明，这种区别可以从质上改变预计搜索的有效性：金字塔表示在同步区域中保留了大量的歧视力，而当仅强加交换对称性时，金字塔表示就没有歧视力。\n\n我们的结果为评估和比较后量子相关性的搜索提供了一个简单的框架。", "authors": [{"name": "Marek Gazdzicki"}, {"name": "Francesco Giacosa"}], "featured_authors": [{"name": "Marek Gazdzicki"}, {"name": "Francesco Giacosa"}], "author_count": 2}, {"id": "2609.15728", "category": "quant-ph", "title": "A Modular, Topology-Aware Software Stack for Entanglement-Based Distributed Quantum Computing", "abstract": "Distributed quantum computing (DQC) seeks to scale beyond the limits of monolithic processors by interconnecting multiple quantum processing units (QPUs) through entanglement-based links. Realizing this vision requires the co-design of hardware and software across the domains of quantum networking, compilation, and scheduling, yet existing tools remain fragmented between monolithic circuit compilers and long-distance quantum network simulators. We present an open-source, topology-informed framework for the compilation and scheduling of distributed quantum programs. Given an input circuit and a description of the target network, the framework partitions and reconstructs the circuit into a distributed program that respects the specified inter- and intra-QPU topology, covers cross-QPU operations through gate and state teleportation, and schedules the result under either deterministic or stochastic entanglement-generation models. By accepting and emitting standard OpenQASM, the framework interoperates with existing monolithic toolchains, and its standardized module interfaces allow partitioning and scheduling strategies to be interchanged and benchmarked. Using this framework, we show that the best-performing compilation strategy varies across the tested circuits and network configurations, and that both network topology and intra-QPU connectivity substantially affect the entanglement cost of execution. These findings underscore the need for a co-design approach to distributed quantum computing, which our framework is designed to support.", "url": "https://arxiv.org/abs/2609.15728", "type": "理论", "summary": "分布式量子计算 (DQC) 旨在通过基于纠缠的链路互连多个量子处理单元 (QPU)，从而超越单片处理器的限制。实现这一愿景需要跨量子网络、编译和调度领域的硬件和软件的协同设计，但现有工具在单片电路编译器和长距离量子网络模拟器之间仍然分散。我们提出了一个开源的、基于拓扑的框架，用于分布式量子程序的编译和调度。给定输入电路和目标网络的描述，该框架将电路分区并重构为分布式程序，该程序尊重指定的 QPU 间和 QPU 内拓扑，通过门和状态隐形传态覆盖跨 QPU 操作，并在确定性或随机纠缠生成模型下调度结果。通过接受和发布标准 OpenQASM，该框架可与现有的整体工具链进行互操作，其标准化模块接口允许交换分区和调度策略并进行基准测试。\n\n使用该框架，我们表明最佳性能的编译策略因测试的电路和网络配置而异，并且网络拓扑和 QPU 内连接都会极大地影响执行的纠缠成本。这些发现强调了分布式量子计算的协同设计方法的必要性，我们的框架旨在支持这种方法。", "authors": [{"name": "Luke Andreesen"}, {"name": "Shobhit Gupta"}, {"name": "Sean Sullivan"}, {"name": "Manish Kumar Singh"}], "featured_authors": [{"name": "Luke Andreesen"}, {"name": "Shobhit Gupta"}, {"name": "Sean Sullivan"}, {"name": "Manish Kumar Singh"}], "author_count": 4}, {"id": "2609.15738", "category": "quant-ph", "title": "Disentangling QAOA: From Weakly Entangled Circuits to a Classical QUBO Solver", "abstract": "The role of entanglement in quantum optimization remains actively debated. To address this question, we focus on the fixed-parameter expanding-depth regime of the quantum approximate optimization algorithm (QAOA), where a compact two-parameter schedule is trained once on small instances and then applied as the problem size and circuit depth increase. To probe this regime beyond full state-vector simulation, we perform approximate matrix product state simulations for up to 50 qubits and 100 layers and quantify entanglement by the bond dimension. We observe an entangle--disentangle profile, with the peak bond dimension decreasing with depth and eventually saturating. This observation motivates an extreme approximation: projecting the state onto the product-state manifold (bond dimension one) after every two-qubit interaction. Based on this approximation, we introduce BOND-1, a quantum-inspired classical solver. Despite the drastic simplification, BOND-1 achieves cut ratios above 0.95 relative to the best known values on standard GSet MaxCut benchmarks with up to 20000 variables, and in some cases it matches those values. It achieves these results without per-instance optimization and has linear memory cost, while per-instance tuning can provide further improvement. These results show that, in this regime, a substantial fraction of the optimization power of QAOA survives even in the complete absence of entanglement. Our conclusions, however, are specific to this setting and do not imply that entanglement is unnecessary for quantum optimization in general.", "url": "https://arxiv.org/abs/2609.15738", "type": "理论+数值", "summary": "纠缠在量子优化中的作用仍然存在激烈争论。为了解决这个问题，我们重点关注量子近似优化算法（QAOA）的固定参数扩展深度机制，其中紧凑的两参数调度在小实例上训练一次，然后随着问题规模和电路深度的增加而应用。为了在完整的状态向量模拟之外探索这种状态，我们对多达 50 个量子位和 100 个层执行近似矩阵乘积状态模拟，并通过键维数量化纠缠。我们观察到缠结-解缠结曲线，峰值键尺寸随着深度而减小并最终饱和。这一观察激发了一种极端的近似：在每两个量子位相互作用后将状态投影到乘积状态流形（键维一）上。基于这种近似，我们引入了 BOND-1，一种受量子启发的经典求解器。尽管进行了大幅简化，但相对于具有多达 20000 个变量的标准 GSet MaxCut 基准上的最著名值，BOND-1 的切割率仍达到 0.95 以上，并且在某些情况下它与这些值相匹配。\n\n它无需按实例优化即可实现这些结果，并且具有线性内存成本，而按实例调整可以提供进一步的改进。这些结果表明，在这种情况下，即使完全没有纠缠，QAOA 的优化能力的很大一部分仍然存在。然而，我们的结论是特定于这种设置的，并不意味着纠缠对于一般的量子优化来说是不必要的。", "authors": [{"name": "Boris I. Bantysh"}, {"name": "Andrey Yu. Chernyavskiy"}, {"name": "Denis A. Kulikov"}, {"name": "Maksim A. Gavreev"}, {"name": "Evgeniy O. Kiktenko"}], "featured_authors": [{"name": "Boris I. Bantysh"}, {"name": "Andrey Yu. Chernyavskiy"}, {"name": "Denis A. Kulikov"}, {"name": "Maksim A. Gavreev"}, {"name": "Evgeniy O. Kiktenko"}], "author_count": 5}, {"id": "2609.15739", "category": "quant-ph", "title": "Pauli spectrum and nonstabilizerness of random fermionic Gaussian states", "abstract": "We characterize the magic of random fermionic Gaussian states through their Pauli spectrum and their stabilizer entropies. For the Haar ensemble of Majorana Gaussian states we derive closed finite-$N$ expressions for the average stabilizer purities and reconstruct the Pauli spectrum exactly, as a mixture of products of beta-distributed variables resolved by Majorana weight. The stabilizer entropies, and their filtered versions, freeze at Rényi index $q_c=2$: for $q>2$ the magic density is $1/(q-1)$, controlled by rare weight-two Majorana strings. Resolving these contributions requires exponentially many characteristic samples, making direct sampling estimates of the stabilizer entropies inefficient in this frozen regime. For Haar-random Gaussian states at fixed filling, we express the averaged stabilizer purities at positive integer $q$ as coefficient integrals over $\\mathrm{SU}(2q)$, with dimension independent of $N$, and evaluate the $q=2$ case exactly. We establish that the frozen density describes typical states in the Majorana and half-filled number-conserving ensembles and relate these ensembles to the corresponding $\\mathrm{SYK}_2$ ground states. Finally, we show that typical fermionic Gaussian states retain certified magic after discarding any fixed fraction $\\kappa<\\kappa_\\star^{\\rm G}\\simeq0.7613$ of their modes in the thermodynamic limit, remaining magical even beyond the $2/3$ threshold for Haar-random states in the full Hilbert space.", "url": "https://arxiv.org/abs/2609.15739", "type": "理论+数值", "summary": "我们通过泡利谱和稳定熵来描述随机费米子高斯态的魔力。对于马约拉纳高斯态的 Haar 系综，我们推导出平均稳定剂纯度的封闭有限 $N$ 表达式，并准确地重建泡利谱，作为由马约拉纳权重解析的 β 分布变量的乘积的混合物。稳定器熵及其过滤版本冻结在 Rényi 索引 $q_c=2$ 处：对于 $q>2$，魔法密度为 $1/(q-1)$，由稀有权重两个马约拉纳弦控制。解决这些贡献需要指数级数量的特征样本，使得稳定器熵的直接采样估计在这种冻结状态下效率低下。对于固定填充的哈尔随机高斯态，我们将正整数 $q$ 处的平均稳定剂纯度表示为 $\\mathrm{SU}(2q)$ 上的系数积分，维度与 $N$ 无关，并准确评估 $q=2$ 的情况。我们确定冻结密度描述了马约拉纳和半填充数守恒系综中的典型状态，并将这些系综与相应的 $\\mathrm{SYK}_2$ 基态相关联。\n\n最后，我们表明，典型的费米子高斯态在丢弃热力学极限中模式的任何固定分数 $\\kappa<\\kappa_\\star^{\\rm G}\\simeq0.7613$ 后仍保留经过认证的魔力，即使超出完整希尔伯特空间中哈尔随机态的 $2/3$ 阈值，仍然保持魔力。", "authors": [{"name": "Xhek Turkeshi"}, {"name": "Piotr Sierant"}, {"name": "Poetri Sonya Tarabunga"}], "featured_authors": [{"name": "Xhek Turkeshi"}, {"name": "Piotr Sierant"}, {"name": "Poetri Sonya Tarabunga"}], "author_count": 3}, {"id": "2609.15764", "category": "quant-ph", "title": "Low-Depth Initial-State Preparation for Ground-State Energy Estimation of Two-Dimensional Strongly Correlated Systems", "abstract": "Quantum algorithms for ground-state energy estimation require initial states with non-negligible fidelity to the ground state. Guided by classical simulations, we design shallow circuits for the two-dimensional half-filled Hubbard model by first preparing an approximate Heisenberg ground state and then applying charge-fluctuation gates derived directly from the Schrieffer-Wolff (SW) generator. For the Heisenberg model, we demonstrate effective parameter transfer from a $4\\times4$ lattice to lattices up to $10\\times10$ without further optimization. We obtain promising lower bounds on the ground-state fidelity using tensor-network simulations, variational Monte Carlo reference states, and estimates of the ground-state energy and singlet gap. Exact $4\\times4$ calculations show that the SW gates substantially improve the Hubbard ground-state fidelity of the embedded Heisenberg state. The successful Heisenberg parameter transfer supports the use of these small-lattice results to design shallow Hubbard circuits on larger lattices beyond the reach of classical simulations. For a $10\\times10$ lattice, the estimated preparation cost is on the order of $10^5$ $T$ gates, including Clifford+$T$ synthesis, which is well within the megaquop regime. These results offer a route to low-cost initial-state preparation for ground-starongly correlated systems.", "url": "https://arxiv.org/abs/2609.15764", "type": "理论+数值", "summary": "用于基态能量估计的量子算法需要对基态具有不可忽略的保真度的初始状态。在经典模拟的指导下，我们为二维半填充哈伯德模型设计了浅层电路，首先准备一个近似的海森堡基态，然后应用直接从 Schrieffer-Wolff (SW) 发生器导出的电荷涨落门。对于海森堡模型，我们证明了从 $4\\times4$ 晶格到高达 $10\\times10$ 晶格的有效参数传递，无需进一步优化。我们使用张量网络模拟、变分蒙特卡罗参考态以及基态能量和单线态带隙的估计获得了有希望的基态保真度下界。精确的 4\\times4$ 计算表明，SW 门大大提高了嵌入海森堡态的哈伯德基态保真度。成功的海森堡参数传递支持使用这些小晶格结果在超出经典模拟范围的较大晶格上设计浅哈伯德电路。\n\n对于 $10\\times10$ 晶格，估计的准备成本约为 $10^5$ $T$ 门，包括 Clifford+$T$ 合成，这完全在 megaquop 范围内。这些结果为地面紧密相关系统的低成本初始状态准备提供了一条途径。", "authors": [{"name": "Ryo Watanabe"}, {"name": "Keisuke Fujii"}], "featured_authors": [{"name": "Ryo Watanabe"}, {"name": "Keisuke Fujii"}], "author_count": 2}, {"id": "2609.15829", "category": "quant-ph", "title": "Higher-order quantum thermodynamics: equilibrium and causal structure", "abstract": "Quantum thermodynamics is traditionally formulated as a theory of equilibrium states and state transformations. Recent advances in higher-order quantum transformations, which describe physical scenarios beyond states and channels and provide a systematic framework for causal order, raise the question of how equilibrium should be defined and preserved in this more general setting. Starting from the Gibbs state as the unique equilibrium state, we identify equilibrium preservation as its natural higher-order extension. We show that, while this principle can in general give rise to distinct classes of transformations, all such distinctions disappear when equilibrium preservation is required completely, namely under arbitrary ancillary extensions. Remarkably, every transformation satisfying this condition is causally ordered, making causal order an emergent consequence of thermodynamic equilibrium. We establish this result for arbitrary higher-order maps and use the resulting framework to introduce free-energy-like quantities for quantum channels. Our findings reveal a fundamental connection between thermodynamic equilibrium and causal structure, providing a foundation for a fully fledged theory of higher-order quantum thermodynamics.", "url": "https://arxiv.org/abs/2609.15829", "type": "理论", "summary": "量子热力学传统上被表述为平衡态和状态转换的理论。高阶量子变换的最新进展描述了超越状态和通道的物理场景，并为因果顺序提供了系统框架，提出了如何在这种更一般的环境中定义和保持平衡的问题。从作为唯一平衡状态的吉布斯状态开始，我们将平衡保持视为其自然的高阶扩展。我们表明，虽然这一原理通常可以产生不同类别的变换，但当完全需要保持平衡时，即在任意辅助扩展下，所有这些区别都会消失。值得注意的是，满足该条件的每个变换都是因果顺序的，使得因果顺序成为热力学平衡的自然结果。我们为任意高阶映射建立了这个结果，并使用所得框架为量子通道引入类似自由能的量。\n\n我们的研究结果揭示了热力学平衡和因果结构之间的基本联系，为成熟的高阶量子热力学理论奠定了基础。", "authors": [{"name": "Simon Milz"}, {"name": "Kyrylo Simonov"}, {"name": "Zoltán Zimborás"}, {"name": "Tamal Guha"}, {"name": "Saptarshi Roy"}, {"name": "Giulio Chiribella"}], "featured_authors": [{"name": "Simon Milz"}, {"name": "Kyrylo Simonov"}, {"name": "Zoltán Zimborás"}, {"name": "Tamal Guha"}, {"name": "Saptarshi Roy"}, {"name": "Giulio Chiribella"}], "author_count": 6}, {"id": "2609.15842", "category": "quant-ph", "title": "Instantiating Microcrypt: Obstacles and opportunities via tailored state certification", "abstract": "Recent work has introduced the Hamiltonian phase state (HPS) assumptions, which postulate that Hamiltonian phase states can be used to instantiate pseudorandom and one-way state generators. Additionally, it has been conjectured that these assumptions can be true, even if one-way functions do not exist. This is exciting, because if true, then the HPS assumptions provide a route to the instantiation of Microcrypt. In this work we falsify this conjecture, by proving that if the HPS assumptions are true, then one-way functions exist. While this removes the possibility of instantiating genuine Microcrypt cryptography with Hamiltonian phase states, it shows that the HPS assumptions provide novel inherently quantum assumptions for the construction of classical cryptography. Technically we achieve this via a method for the construction of one-way puzzles from one-way state generators and tailored \"measure first, ask later\" state certification protocols. This generalizes prior constructions of one-way puzzles from one-way state generators via classical shadows and allows us to relate properties of the one-way puzzle to properties of the state certification protocol used in the construction. Specifically, if the state certification protocol admits efficient classical post-processing then one obtains an efficiently verifiable one-way puzzle, and if the state certification protocol can be efficiently classically simulated in a certain sense, then one obtains a classical one-way puzzle, which implies one-way functions. The latter observation allows us to prove that the HPS assumptions imply one-way functions, by exploiting properties of state certification protocols for phase states. The former observation provides a new toolbox for the construction of efficiently verifiable one-way puzzles by exploiting tailored state certification protocols for pseudorandom and one-way state generators.", "url": "https://arxiv.org/abs/2609.15842", "type": "理论", "summary": "最近的工作引入了哈密顿相态（HPS）假设，该假设假设哈密顿相态可用于实例化伪随机和单向状态生成器。此外，据推测，即使单向函数不存在，这些假设也可能是正确的。这是令人兴奋的，因为如果为真，那么 HPS 假设将提供一条通往 Microcrypt 实例化的途径。在这项工作中，我们通过证明如果 HPS 假设为真，则存在单向函数，从而证伪了这一猜想。虽然这消除了用哈密顿相态实例化真正的 Microcrypt 密码学的可能性，但它表明 HPS 假设为经典密码学的构造提供了新颖的固有量子假设。从技术上讲，我们通过一种从单向状态生成器构造单向谜题的方法和定制的“先测量，后询问”状态认证协议来实现这一目标。这概括了单向状态生成器通过经典阴影对单向谜题的先前构造，并允许我们将单向谜题的属性与构造中使用的状态认证协议的属性相关联。\n\n具体来说，如果状态认证协议允许有效的经典后处理，那么我们就获得了一个有效的可验证的单向难题，并且如果状态认证协议可以在某种意义上进行有效的经典模拟，那么我们就获得了一个经典的单向难题，这意味着单向函数。后一种观察使我们能够通过利用阶段状态的状态认证协议的属性来证明 HPS 假设意味着单向函数。前一种观察提供了一个新的工具箱，通过利用伪随机和单向状态生成器的定制状态认证协议来构建有效可验证的单向难题。", "authors": [{"name": "Jose Carrasco"}, {"name": "Jens Eisert"}, {"name": "Soumik Ghosh"}, {"name": "Dominik Hangleiter"}, {"name": "Nicky Kai Hong Li"}, {"name": "Ryan Sweke"}], "featured_authors": [{"name": "Jose Carrasco"}, {"name": "Jens Eisert"}, {"name": "Soumik Ghosh"}, {"name": "Dominik Hangleiter"}, {"name": "Nicky Kai Hong Li"}, {"name": "Ryan Sweke"}], "author_count": 6}, {"id": "2609.15902", "category": "quant-ph", "title": "Relative Entropy Decay via BKM coercivity for Quantum Markov Semigroups", "abstract": "We introduce the notion of the BKM coercivity constant and show that the positivity of this constant governs the exponential relative entropy decay of the semigroup. Indeed, we prove that the modified log-Sobolev constant is equivalent to the BKM coercivity constant up to a constant depending on the asymptotic conditional expectation. We also discover that the BKM coercivity constants for matrix amplifications are already attained with a qubit auxiliary system, which also coincides with the GNS spectral gap of the generating Lindbladian. As a corollary, we establish a criterion that the complete modified log-Sobolev inequality holds if and only if the GNS gap of the semigroup is strictly positive. All the discussion above applies to quantum Markov semigroups that admit a faithful asymptotic conditional expectation as long-time equilibration, with no detailed balance condition assumed. As an application, we show the finite-dimensional Chen-Kastoryano-Gilyén Gibbs samplers always satisfy the complete modified log-Sobolev inequality.", "url": "https://arxiv.org/abs/2609.15902", "type": "理论", "summary": "我们引入了 BKM 矫顽力常数的概念，并表明该常数的正性控制着半群的指数相对熵衰减。事实上，我们证明了修改后的 log-Sobolev 常数相当于 BKM 矫顽力常数，直到取决于渐近条件期望的常数。我们还发现，矩阵放大的 BKM 矫顽力常数已经通过量子位辅助系统获得，这也与生成的 Lindbladian 的 GNS 谱间隙一致。作为推论，我们建立了一个标准，即当且仅当半群的 GNS 间隙严格为正时，完全修正的 log-Sobolev 不等式才成立。上述所有讨论都适用于量子马尔可夫半群，它承认忠实的渐近条件期望作为长期平衡，没有假设详细的平衡条件。作为一个应用，我们证明了有限维 Chen-Kastoryano-Gilyén Gibbs 采样器始终满足完全修正的 log-Sobolev 不等式。", "authors": [{"name": "Li Gao"}, {"name": "Jingyu Guo"}], "featured_authors": [{"name": "Li Gao"}, {"name": "Jingyu Guo"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
