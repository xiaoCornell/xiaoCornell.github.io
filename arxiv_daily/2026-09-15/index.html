出现优势，并在 0.25 tu 处达到 +0.137 平均 R^2（5 量子位，窗口 32）。窗口尾部的线性稳定性分析将优势定位于不稳定的鞍形接近状态：AeRot 在最不稳定的十分位数中赢得了 83% 的窗口，获胜率随着尾部不稳定和局部稳定边界处的符号翻转而单调上升。\n\n困难在于折叠分支的模糊性：接近鞍点的轨迹在局部发散，欧几里德内核努力解决轨迹将致力于哪个波瓣。结构诊断证实 Gram 矩阵在结构上与调整的 RBF 不同，在每个范围内具有严格更高的目标内核对齐。增益是建筑性的：折叠吸引子上的时间结构化编码的有限样本归纳偏置效应，不附加计算分离声明。据我们所知，这是量子核优势首次机械定位于经典系统的特定动态机制。", "authors": [{"name": "Zhihui Wang"}, {"name": "Sujit Roy"}, {"name": "Ata Akbari"}, {"name": "Manil Maskey"}, {"name": "Rahul Ramachandran"}], "featured_authors": [{"name": "Zhihui Wang"}, {"name": "Sujit Roy"}, {"name": "Ata Akbari"}, {"name": "Manil Maskey"}, {"name": "Rahul Ramachandran"}], "author_count": 5}, {"id": "2609.13371", "category": "quant-ph", "title": "Moment-Selective Quantum Designs in Aperiodic Temporal Ensembles", "abstract": "We introduce a general mechanism for engineering moment-selective temporal designs with hierarchically structured aperiodic drives. At special control settings where the driven dynamics is constrained by a finite symmetry group, lower-order moments can already reproduce Haar statistics while a selected higher-order deviation remains nonzero. A small static detuning from such a setting generically produces an exponentially long lifetime whose exponent scales inversely with the square of the detuning. We illustrate this mechanism in qubit systems through exact Fibonacci and silver-mean constructions with tetrahedral and icosahedral resonances, for which the first retained non-Haar moments occur at orders $3$ and $6$, respectively. We further show that stochastic control fluctuations produce a qualitatively different cutoff from coherent detuning. Finally, we propose a finite-time signature of the long-lived moment that can be measured without requiring observations over exponentially long times.", "url": "https://arxiv.org/abs/2609.13371", "type": "理论", "summary": "我们引入了一种具有分层结构非周期驱动的工程矩选择性时间设计的通用机制。在驱动动力学受到有限对称群约束的特殊控制设置下，低阶矩已经可以重现 Haar 统计数据，而选定的高阶偏差保持非零。这种设置产生的小静态失谐通常会产生指数级的长寿命，其指数与失谐的平方成反比。我们通过具有四面体和二十面体共振的精确斐波那契和银均值结构来说明量子比特系统中的这种机制，其中第一个保留的非哈尔矩分别出现在 $3$ 和 $6$ 阶。我们进一步表明，随机控制波动产生与相干失谐性质不同的截止。最后，我们提出了长寿命时刻的有限时间签名，可以测量它，而不需要指数级长时间的观察。", "authors": [{"name": "Yang Peng"}], "featured_authors": [{"name": "Yang Peng"}], "author_count": 1}, {"id": "2609.13388", "category": "quant-ph", "title": "CUDA-Q Logical: Retargetable Compilation for Fault-Tolerant Quantum Computing", "abstract": "Realizing fault-tolerant quantum computing requires mapping logical programs to heterogeneous quantum error correction (QEC) codes and diverse fault-tolerant execution models, scheduling physical resources, and coupling to real-time classical control and feedback. Specialized tools exist for each step but rely on manual composition and translation that discard assumptions and provenance, separating resource estimates from the compiler artifacts they describe, and making it difficult to validate correctness, compare architectures, or attribute costs to specific design choices. We present CUDA-Q Logical, an extensible compiler infrastructure for retargetable fault-tolerant compilation, analysis, and execution. Interoperable with CUDA-Q and other mainstream front-ends, CUDA-Q Logical progressively lowers target-independent logical programs through a constrained logical virtual machine, QEC microcode, physical gate schedules, and real-time control plans, with each layer preserving semantics and provenance, while verifying composition and resource constraints. By deriving every resource estimate directly from compiler artifacts, the framework unifies compilation and resource analysis, enabling successively refined estimates and principled cross-architecture comparison while permitting QEC codes, execution models, decoders, and hardware architectures to be introduced as modular extensions. Across workloads ranging from application-architecture studies to qLDPC surgery and detector-error-model composition, we show that schedule-derived estimates reconcile with established independent models. Crucially, this compiler-visible structure exposes cost drivers hidden by aggregate analytical formulas, carries QEC artifacts intact into simulation, and demonstrates a complete compilation pipeline for fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2609.13388", "type": "理论+数值", "summary": "实现容错量子计算需要将逻辑程序映射到异构量子纠错（QEC）代码和多样化的容错执行模型，调度物理资源，并耦合到实时经典控制和反馈。每个步骤都有专门的工具，但依赖于手动组合和翻译，这些工具放弃了假设和出处，将资源估计与它们描述的编译器工件分开，并且使得验证正确性、比较架构或将成本归因于特定设计选择变得困难。我们推出了 CUDA-Q Logical，这是一种可扩展的编译器基础架构，用于可重定向的容错编译、分析和执行。 CUDA-Q Logical 可与 CUDA-Q 和其他主流前端进行互操作，通过受限逻辑虚拟机、QEC 微代码、物理门调度和实时控制计划，逐步降低与目标无关的逻辑程序，每一层都保留语义和来源，同时验证组成和资源约束。\n\n通过直接从编译器工件导出每个资源估计，该框架统一了编译和资源分析，实现了连续细化的估计和有原则的跨架构比较，同时允许 QEC 代码、执行模型、解码器和硬件架构作为模块化扩展引入。在从应用程序架构研究到 qLDPC 手术和检测器误差模型组成的工作负载中，我们表明，基于时间表的估计与已建立的独立模型相一致。至关重要的是，这种编译器可见的结构暴露了聚合分析公式隐藏的成本驱动因素，将 QEC 工件完整地带入模拟中，并演示了用于容错量子计算的完整编译管道。", "authors": [{"name": "Alexander McCaskey"}, {"name": "Justin Lietz"}, {"name": "Adam Holmes"}, {"name": "Kohei Nakaji"}, {"name": "Vadym Kliuchnikov"}, {"name": "Yifan Hong"}, {"name": "Amalee Wilson"}, {"name": "Andres Paz"}, {"name": "Bettina Heim"}, {"name": "Bruno Schmitt"}, {"name": "Krysta M. Svore"}], "featured_authors": [{"name": "Alexander McCaskey"}, {"name": "Justin Lietz"}, {"name": "Adam Holmes"}, {"name": "Bettina Heim"}, {"name": "Bruno Schmitt"}, {"name": "Krysta M. Svore"}], "author_count": 11}, {"id": "2609.13392", "category": "quant-ph", "title": "Orientation-dependent Pauli noise in one-dimensional discrete-time quantum walks", "abstract": "Discrete-time quantum walks exhibit ballistic spreading that is highly sensitive to decoherence. We study the long-time dynamics of a one-dimensional discrete-time quantum walk under Pauli noise acting on the coin. Choosing the unitary coin such that its invariant Bloch-sphere axis is orthogonal to the axis fixed by the conditional shift, we identify the distinct effects of noise aligned with either dynamical axis or orthogonal to both. Using a Fourier-space Pauli-superoperator formalism, we derive expressions for the first two position moments and long-time asymptotics for X-, Y-, Z-, and depolarizing noise. All channels induce a crossover from ballistic to diffusive spreading, with a second moment growing linearly at long times. The approach to this regime is channel dependent: it is exponentially fast for X-, Z-, and depolarizing noise, but algebraic, with a leading $t^{-1/2}$ correction, for Y-noise. The position distributions retain distinct finite-noise signatures, including a Gaussian-like profile with a central depression for Y-noise. In the maximal-noise limit, depolarizing, Y-, and Z-noise yield the classical binomial distribution for arbitrary initial coin states, whereas X-noise does so only when the initial state has no component along the noise axis. Thus, the quantum-to-classical transition is governed by the relative alignment of the noise, the coherent walk dynamics, and the initial state.", "url": "https://arxiv.org/abs/2609.13392", "type": "理论", "summary": "离散时间量子行走表现出对退相干高度敏感的弹道扩散。我们研究了作用在硬币上的泡利噪声下一维离散时间量子行走的长期动力学。选择单一硬币，使其不变的布洛赫球体轴与条件位移固定的轴正交，我们确定了与动力轴对齐或与两者都正交的噪声的独特影响。使用傅立叶空间泡利超算子形式，我们推导了前两个位置矩的表达式以及 X、Y、Z 和去极化噪声的长时间渐近。所有通道都会引起从弹道传播到扩散传播的交叉，二阶矩在长时间内呈线性增长。这种机制的方法与通道相关：对于 X、Z 和去极化噪声，它的速度呈指数级增长，但对于 Y 噪声，它是代数的，具有领先的 $t^{-1/2}$ 校正。位置分布保留了独特的有限噪声特征，包括具有 Y 噪声中心凹陷的类高斯分布。\n\n在最大噪声限制下，去极化、Y 和 Z 噪声对于任意初始硬币状态都会产生经典二项式分布，而 X 噪声仅当初始状态沿噪声轴没有分量时才会产生这种分布。因此，量子到经典的转变是由噪声的相对排列、相干行走动力学和初始状态控制的。", "authors": [{"name": "Alejandro Contreras Reynoso"}, {"name": "Adrian Ortega"}, {"name": "Thomas Gorin"}], "featured_authors": [{"name": "Alejandro Contreras Reynoso"}, {"name": "Adrian Ortega"}, {"name": "Thomas Gorin"}], "author_count": 3}, {"id": "2609.13456", "category": "quant-ph", "title": "Reusable selected-time channels for quantum simulation of non-Markovian dynamics", "abstract": "Non-Markovian quantum-state diffusion (QSD) provides a microscopic trajectory description of open-system dynamics, but trajectories associated with a chosen initial state are not directly reusable as quantum channels. We develop a constructive framework that converts the QSD propagator into an input-independent Kraus channel for a fixed bath preparation and a selected evolution time. The construction incorporates reservoir memory through a finite-mode approximation of the bath covariance and yields a deterministic channel representation that can be compressed for approximate implementation with a system-ancilla circuit. For the qubit systems considered here, the construction closes exactly in vacuum and extends systematically to finite temperatures. Two-qubit examples with structured reservoirs validate the vacuum channel construction, illustrate its finite-temperature extension for a chosen initial state, and show that the complexity of the reservoir description can differ substantially from the ancilla space required for quantum realization. The framework therefore establishes a direct bridge from microscopic reservoir memory to reusable non-Markovian quantum simulation and provides a foundation for optimized hardware implementations and extensions to larger systems and multitime dynamics.", "url": "https://arxiv.org/abs/2609.13456", "type": "理论+数值", "summary": "非马尔可夫量子态扩散（QSD）提供了开放系统动力学的微观轨迹描述，但与所选初始状态相关的轨迹不能直接作为量子通道重复使用。我们开发了一个建设性框架，将 QSD 传播器转换为与输入无关的 Kraus 通道，用于固定浴准备和选定的演化时间。该结构通过浴协方差的有限模式近似结合了储层存储器，并产生了确定性通道表示，可以对其进行压缩以通过系统辅助电路进行近似实现。对于这里考虑的量子位系统，其结构完全在真空中闭合，并系统地延伸到有限的温度。具有结构化储存器的两个量子位示例验证了真空通道结构，说明了其在选定初始状态下的有限温度扩展，并表明储存器描述的复杂性可能与量子实现所需的辅助空间有很大不同。\n\n因此，该框架建立了从微观储层存储器到可重复使用的非马尔可夫量子模拟的直接桥梁，并为优化硬件实现和扩展到更大系统和多时间动力学提供了基础。", "authors": [{"name": "Yusui Chen"}], "featured_authors": [{"name": "Yusui Chen"}], "author_count": 1}, {"id": "2609.13496", "category": "quant-ph", "title": "Reservoir Support Sets the Minimum Loss for Non-Hermitian Dynamics", "abstract": "The minimum loss required to reproduce non-Hermitian dynamics depends on how many physical modes each reservoir can address coherently. Established positive-matrix criteria bound this cost. We construct a phase-controlled cubic-root Su-Schrieffer-Heeger chain in which three-mode reservoirs attain the unrestricted passivity threshold throughout its phase diagram and halve the minimum pair-supported loss at a tuned point. The bound constrains exact conditional trajectories, including time-dependent Markov controls, rather than preparation of one final state. A connected-chain protocol tests effective reservoir support through calibrated finite-time emission. Full system-auxiliary propagation then bounds conditional fidelity and target yield for every one-particle input. A coherent controller that accurately prepares the selected endpoint fails this propagator test. A singular-value bound excludes every unitary realization of the same conditional map. These results connect local reservoir access to a measurable loss cost for prescribed dynamics.", "url": "https://arxiv.org/abs/2609.13496", "type": "理论+数值", "summary": "再现非厄米动力学所需的最小损失取决于每个储层可以连贯地处理多少个物理模式。既定的正矩阵标准限制了这一成本。我们构建了相控立方根 Su-Schrieffer-Heeger 链，其中三模式储层在整个相图中达到无限制的无源性阈值，并将调谐点处的最小对支撑损耗减半。该界限限制了精确的条件轨迹，包括时间相关的马尔可夫控制，而不是准备一个最终状态。连接链协议通过校准的有限时间发射来测试有效的储层支持。然后，完整的系统辅助传播限制了每个单粒子输入的条件保真度和目标产量。准确准备所选端点的相干控制器未通过此传播器测试。奇异值界限排除同一条件映射的每个单一实现。这些结果将当地水库接入与规定动态的可测量损失成本联系起来。", "authors": [{"name": "Alena Mastiukova"}], "featured_authors": [{"name": "Alena Mastiukova"}], "author_count": 1}, {"id": "2609.13505", "category": "quant-ph", "title": "Heuristic Quantum Amplitude Amplification: A Traffic QUBO Case Study", "abstract": "Quantum Amplitude Amplification (QAA), the generalization of Grover's algorithm, is well-positioned for combinatorial optimization and is particularly promising for Quadratic Unconstrained Binary Optimization (QUBO) problems. QAA is appealing due to its ability to drive the quantum system to a target state, yielding the globally optimal solution with probability over $90$+%. However, realizing QAA for application-scale optimization currently exceeds quantum hardware capacity, which is further compounded by unresolved algorithmic challenges regarding the choice of free parameters. In this study, we address these issues by utilizing a realistic traffic flow QUBO problem to investigate the implementation of QAA as a heuristic solver. Specifically, allowing the diffusion operator parameter to take non-$\\pi$ values expands the capabilities of QAA. This unlocks a new multiple-shot, low-iteration strategy that aims for a high cumulative probability rather than maximizing the probability of a single basis state. Using $25$-qubit simulations, our results demonstrate that heuristic QAA addresses two of the main challenges cited in previous studies. Firstly, heuristic QAA works even at a single iteration, reducing circuit depth by orders of magnitude compared to standard QAA. And secondly, we show that the problem-dependent parameters necessary for reaching optimal algorithmic performance can be reliably approximated with minimal upfront classical computing overhead.", "url": "https://arxiv.org/abs/2609.13505", "type": "数值", "summary": "量子振幅放大 (QAA) 是 Grover 算法的推广，非常适合组合优化，尤其适用于二次无约束二元优化 (QUBO) 问题。 QAA 之所以有吸引力，是因为它能够将量子系统驱动到目标状态，产生全局最优解决方案，概率超过 90$+%。然而，实现应用规模优化的 QAA 目前超出了量子硬件的能力，而自由参数选择方面尚未解决的算法挑战进一步加剧了这一问题。在本研究中，我们通过利用现实交通流 QUBO 问题来研究 QAA 作为启发式求解器的实施来解决这些问题。具体来说，允许扩散算子参数采用非 $\\pi$ 值扩展了 QAA 的功能。这开启了一种新的多次射击、低迭代策略，其目标是获得高累积概率，而不是最大化单个基本状态的概率。使用 25 美元量子位模拟，我们的结果表明启发式 QAA 解决了之前研究中提到的两个主要挑战。\n\n首先，启发式 QAA 即使在单次迭代中也能发挥作用，与标准 QAA 相比，电路深度减少了几个数量级。其次，我们表明，达到最佳算法性能所需的与问题相关的参数可以用最小的前期经典计算开销可靠地近似。", "authors": [{"name": "Kip Nieman"}, {"name": "Daniel Koch"}], "featured_authors": [{"name": "Kip Nieman"}, {"name": "Daniel Koch"}], "author_count": 2}, {"id": "2609.13550", "category": "quant-ph", "title": "An entropic characterization of Haag duality", "abstract": "Motivated by Haag duality in quantum spin systems, we show that Haag duality for a pair of commuting factors generated by increasing sequences of finite-dimensional matrix algebras is equivalent to the asymptotic vanishing of a suitable conditional mutual information. For two-dimensional spin systems, let an annulus separate a finite region from the exterior. Haag duality then holds for a region $A$ if and only if the mutual information of the inner region and the exterior, conditioned on the part of $A$ inside the annulus, vanishes as the outer radius becomes large. As a corollary, assuming a strict area law with subleading corrections, Haag duality holds for single cones, and it holds for unions of two or more disjoint cones precisely when the topological entanglement entropy vanishes. For translation-invariant pure states on spin chains, half-chain Haag duality is equivalent to vanishing entropy density.", "url": "https://arxiv.org/abs/2609.13550", "type": "理论", "summary": "受量子自旋系统中哈格对偶性的启发，我们证明了由有限维矩阵代数递增序列生成的一对交换因子的哈格对偶性等价于合适的条件互信息的渐近消失。对于二维自旋系统，让一个环将有限区域与外部分开。那么，哈格对偶性对于区域 $A$ 成立，当且仅当以环内 $A$ 部分为条件的内部区域和外部区域的互信息随着外部半径变大而消失。作为推论，假设严格的面积定律和次导修正，哈格对偶性适用于单个锥体，并且当拓扑纠缠熵消失时，它恰好适用于两个或多个不相交锥体的并集。对于自旋链上平移不变的纯态，半链哈格对偶性等价于熵密度消失。", "authors": [{"name": "Ruizhi Liu"}, {"name": "Lauritz van Luijk"}], "featured_authors": [{"name": "Ruizhi Liu"}, {"name": "Lauritz van Luijk"}], "author_count": 2}, {"id": "2609.13600", "category": "quant-ph", "title": "Braid map definition of SLH-networks and the series product", "abstract": "This article investigates a cascade of quantum systems within an SLH-network. The SLH-network is defined rigorously by using the so-called braid-map. An expression is derived for the time-evolution of the network with finite delay. The series product is retrieved in the instantaneous feed-forward limit.", "url": "https://arxiv.org/abs/2609.13600", "type": "理论", "summary": "本文研究了 SLH 网络中的级联量子系统。 SLH 网络是通过使用所谓的辫子图严格定义的。推导了具有有限延迟的网络的时间演化表达式。该系列产品在瞬时前馈极限内进行检索。", "authors": [{"name": "Luc Bouten"}], "featured_authors": [{"name": "Luc Bouten"}], "author_count": 1}, {"id": "2609.13749", "category": "quant-ph", "title": "Time domain non-linear quantum interferometry", "abstract": "Interferometry is a powerful method for studying many fundamental phenomena ranging from gravitational waves to anyon excitations. Besides loss of coherence in the interferometer paths, quantum mechanics sets an incompressible bound for linear interferometry arising from the quantum noise of the light beam, called the shot noise limit. Here, we implement a non-linear quantum interferometer that uses a microwave cavity and a magnetic field resilient anharmonic superconducting quantum circuit made of granular aluminum. The circuit enables interferometry beyond the shot noise limit. A direct application of our findings is the detection of dark matter (axions or dark photons), high-frequency gravitational waves or astronomical masers.", "url": "https://arxiv.org/abs/2609.13749", "type": "理论", "summary": "干涉测量是研究从引力波到任意子激发等许多基本现象的强大方法。除了干涉仪路径中的相干性损失之外，量子力学还为由光束的量子噪声引起的线性干涉测量设置了不可压缩的界限，称为散粒噪声极限。在这里，我们实现了一种非线性量子干涉仪，它使用微波腔和由粒状铝制成的磁场弹性非谐波超导量子电路。该电路使干涉测量能够超出散粒噪声限制。我们的发现的直接应用是暗物质（轴子或暗光子）、高频引力波或天文微波激射器的检测。", "authors": [{"name": "C. Fruy"}, {"name": "A. Théry"}, {"name": "B. Hue"}, {"name": "W. Legrand"}, {"name": "L. Jarjat"}, {"name": "J. Craquelin"}, {"name": "M.R. Delbecq"}, {"name": "A. Cottet"}, {"name": "T. Kontos"}], "featured_authors": [{"name": "C. Fruy"}, {"name": "A. Théry"}, {"name": "B. Hue"}, {"name": "M.R. Delbecq"}, {"name": "A. Cottet"}, {"name": "T. Kontos"}], "author_count": 9}, {"id": "2609.13790", "category": "quant-ph", "title": "Binary Optimization with Complex Constraints via Quantum Approximate Multi-Objective Optimization", "abstract": "We show that a class of binary optimization problems with complex non-quadratic objectives or constraints can be reformulated as multi-objective quadratic unconstrained binary optimization problems. When the objective and constraints depend on a small number of quadratic features and are monotone with respect to their preferred directions, at least one globally optimal solution lies in the Pareto set of the associated MO-QUBO. This enables the constraints to be evaluated classically on Pareto-optimal candidates rather than encoded as penalties. We demonstrate the approach for binary portfolio optimization under a Conditional Value-at-Risk constraint. Using Quantum Approximate Multi-Objective Optimization on an illustrative 100-asset instance, we approximate the mean-variance Pareto front using an IBM Quantum computer and derive mean-CVaR fronts through classical post-processing. The hardware results recover the overall structure of the classical front and yield near-optimal feasible portfolios for different risk bounds.", "url": "https://arxiv.org/abs/2609.13790", "type": "理论+数值", "summary": "我们证明了一类具有复杂非二次目标或约束的二元优化问题可以重新表述为多目标二次无约束二元优化问题。当目标和约束依赖于少量二次特征并且相对于其首选方向单调时，至少一个全局最优解位于相关 MO-QUBO 的 Pareto 集中。这使得约束能够在帕累托最优候选上进行经典评估，而不是编码为惩罚。我们演示了条件风险价值约束下的二元投资组合优化方法。在示例性的 100 个资产实例上使用量子近似多目标优化，我们使用 IBM 量子计算机近似均值方差 Pareto 前沿，并通过经典后处理导出均值 CVaR 前沿。硬件结果恢复了经典前沿的整体结构，并针对不同的风险界限产生接近最优的可行投资组合。", "authors": [{"name": "Andres Ruiz"}, {"name": "Soumyadip Ghosh"}, {"name": "Stefan Woerner"}], "featured_authors": [{"name": "Andres Ruiz"}, {"name": "Soumyadip Ghosh"}, {"name": "Stefan Woerner"}], "author_count": 3}, {"id": "2609.13839", "category": "quant-ph", "title": "What Output-Equivalence Oracles Miss: An Empirical Study of Equivalence-Invisible Bug Fixes in Quantum Transpilers (Qiskit, tket, Cirq)", "abstract": "Quantum compilers are judged correct by an output-equivalence oracle: the compiled circuit must compute the same unitary as the original, modulo global phase and a qubit-layout permutation. This oracle, by construction, checks only that semantic map, not the circuit's own layout, permutation, or phase records: a defect there, or in a fixed-seed run's determinism, can pass unseen though the record is public. We measure how often this happens in real merged compiler fixes: a systematically identified corpus of Qiskit transpiler bug-fixes, classified by an independently dual-coded, source-validated manifestation taxonomy. Nineteen of 68 fixes (28%, 95% Wilson CI 19-40%) repair faults that this equivalence screen does not catch, even one augmented with compilation-validity, circuit-quality, and performance checks. A secondary wider-window robustness sample produced a nearly identical fraction (29/104, 27.9%, CI 20-37%). A conservative floor remains even restricted to the one unconditionally equivalence-invisible channel (a corrupted layout or permutation record): 10 of 68 fixes (15%, CI 8-25%) beneath the 28% headline. The gap is not Qiskit-specific: it replicates in tket (7 of 21, 33%), with Cirq smaller but consistent. We detected no systematic differences on five inexpensive PR-level characteristics (19 vs 49, underpowered to rule out a modest true difference). This class dominates the invisible set, concentrating at representation-boundary crossings. We release the corpus, codebook, and coding artifacts. Here we only measure it.", "url": "https://arxiv.org/abs/2609.13839", "type": "理论", "summary": "量子编译器通过输出等价预言来判断是否正确：编译电路必须计算与原始模全局相位和量子位布局排列相同的酉。通过构建，该预言机仅检查语义图，而不检查电路自身的布局、排列或阶段记录：那里的缺陷或固定种子运行的确定性中的缺陷可能会在不可见的情况下通过，尽管记录是公开的。我们测量这种情况在实际合并的编译器修复中发生的频率：系统识别的 Qiskit 转译器错误修复语料库，通过独立的双编码、源验证的表现分类法进行分类。 68 个修复中的 19 个（28%、95% Wilson CI 19-40%）修复了此等效屏幕无法捕获的错误，甚至还增加了编译有效性、电路质量和性能检查。第二个更宽窗口稳健性样本产生了几乎相同的分数（29/104，27.9％，CI 20-37％）。保守的下限甚至仍然仅限于一个无条件等价的隐形通道（损坏的布局或排列记录）：28% 标题下方的 68 个修复中的 10 个（15%，CI 8-25%）。\n\n这种差距并不是 Qiskit 特有的：它在 tket 中也有重复（21 个中的 7 个，占 33%），Cirq 较小但一致。我们在五个廉价的 PR 级别特征上没有发现系统性差异（19 比 49，动力不足，无法排除适度的真实差异）。这个类别在不可见集合中占主导地位，集中在表征边界交叉处。我们发布语料库、密码本和编码工件。这里我们只测量它。", "authors": [{"name": "Furqan Nasir"}, {"name": "Arif Shah"}, {"name": "Iftikhar Alam"}], "featured_authors": [{"name": "Furqan Nasir"}, {"name": "Arif Shah"}, {"name": "Iftikhar Alam"}], "author_count": 3}, {"id": "2609.13863", "category": "quant-ph", "title": "Open Quantum Systems", "abstract": "Open quantum systems describe quantum systems that interact unavoidably with their environments. These notes introduce the physical origins of decoherence and dissipation in realistic settings, developing the theoretical framework of reduced dynamics and quantum master equations within the connection to thermodynamics in the quantum regime. Additionally, a set of relevant exercises are proposed to reinforce the acquisition of knowledge. The text equips readers with the tools to model and analyze open quantum dynamics.", "url": "https://arxiv.org/abs/2609.13863", "type": "理论", "summary": "开放量子系统描述了不可避免地与其环境相互作用的量子系统。这些笔记介绍了现实环境中退相干和耗散的物理起源，在与量子态热力学的联系中发展了简化动力学和量子主方程的理论框架。此外，还提出了一系列相关练习来加强知识的获取。本书为读者提供了建模和分析开放量子动力学的工具。", "authors": [{"name": "Erik Torrontegui"}, {"name": "Ricardo Puebla"}], "featured_authors": [{"name": "Erik Torrontegui"}, {"name": "Ricardo Puebla"}], "author_count": 2}, {"id": "2609.13870", "category": "quant-ph", "title": "Hiai--Petz Skew Informations and Sharp Uncertainty Relations for a Single Observable", "abstract": "We study intrinsic quantum uncertainty associated with a single observable from the viewpoint of skew information. By relaxing ordinary additivity while retaining the other fundamental uncertainty requirements, we introduce a class of Hiai--Petz nonadditive skew informations that contains Hansen's metric-adjusted skew informations as the boundary case $\\theta=1$. Our main quantitative result is a sharp single-observable uncertainty relation for the full Hiai--Petz class. For a fixed state, the optimal coefficient depends only on its largest and smallest eigenvalues and remains sharp even after the maximal classical contribution to the variance is retained. The general theorem yields, as special cases, sharp bounds for metric-adjusted skew informations, the SLD quantum Fisher information, and the power-commutator family. We further show that $K_s(\\rho,A)=\\frac12\\|[\\rho^s,A]\\|_{\\mathrm{HS}}^2$, $1/2\\le s<1$, is realized within the Hiai--Petz framework through Stolarsky operator means, thereby establishing its convexity for $1/2<s<1$. More generally, for each fixed operator monotone function $f$, the Hiai--Petz spectral kernel interpolates geometrically between the metric-adjusted skew information $I^f$ and the common endpoint $K_1$. The resulting family obeys an exact power-trace-weighted composition law, replacing ordinary additivity in the interior $0<\\theta<1$.", "url": "https://arxiv.org/abs/2609.13870", "type": "理论", "summary": "我们从偏斜信息的角度研究与单个可观测值相关的内在量子不确定性。通过放宽普通可加性，同时保留其他基本不确定性要求，我们引入了一类 Hiai--Petz 非可加偏斜信息，其中包含汉森度量调整偏斜信息作为边界情况 $\\theta=1$。我们的主要定量结果是整个 Hiai--Petz 类的尖锐的单可观测不确定性关系。对于固定状态，最优系数仅取决于其最大和最小特征值，并且即使在保留对方差的最大经典贡献之后仍然保持锐利。作为特殊情况，一般定理给出了度量调整偏斜信息、SLD 量子费希尔信息和功率换向器族的锐界。我们进一步证明$K_s(\\rho,A)=\\frac12\\|[\\rho^s,A]\\|_{\\mathrm{HS}}^2$, $1/2\\le s<1$，是在Hiai--Petz框架内通过Stolarsky算子手段实现的，从而建立了$1/2<s<1$的凸性。\n\n更一般地，对于每个固定算子单调函数 $f$，Hiai--Petz 谱内核在度量调整的偏斜信息 $I^f$ 和公共端点 $K_1$ 之间进行几何插值。由此产生的族遵循精确的幂迹加权合成定律，取代了内部 $0<\\theta<1$ 中的普通可加性。", "authors": [{"name": "Gen Kimura"}], "featured_authors": [{"name": "Gen Kimura"}], "author_count": 1}, {"id": "2609.14019", "category": "quant-ph", "title": "Conditional Quantum Flow Matching for Data-Scarce Physiological Signal Augmentation", "abstract": "Generative augmentation is a standard remedy for label scarcity in physiological signal classification, but existing quantum generative models start from uninformative noise, ignoring class structure that is already available. We propose Conditional Quantum Flow Matching (CQFM): a single 306-parameter circuit, conditioned on both flow time and class label, transports a compact class-conditional prior toward the target distribution. Quantum flow matching as published is unconditional, so this is to our knowledge the first conditional one, and the first EEG augmentation on a parameterized quantum circuit. A nonnegative spectral embedding removes the need for tomography at readout. On BCI Competition IV-2a, starting from a prior rather than noise is worth $+5.1$ accuracy points over QuDDPM (9/9 subjects), though at that operating point a class-conditional Gaussian matches CQFM. Where the prior fails the transport earns its keep: given one transferred from other subjects it regains $+7.2$ TSTR points (9/9).", "url": "https://arxiv.org/abs/2609.14019", "type": "理论", "summary": "生成增强是生理信号分类中标签稀缺的标准补救措施，但现有的量子生成模型从无信息的噪声开始，忽略了已经可用的类结构。我们提出条件量子流匹配（CQFM）：单个 306 参数电路，以流时间和类标签为条件，向目标分布传输紧凑的类条件先验。已发布的量子流匹配是无条件的，因此据我们所知，这是第一个有条件的匹配，也是参数化量子电路上的第一个脑电图增强。非负光谱嵌入消除了读出时断层扫描的需要。在 BCI 竞赛 IV-2a 上，从先验而不是噪声开始，比 QuDDPM（9/9 受试者）价值 $+5.1$ 准确度点，尽管在该操作点，类别条件高斯与 CQFM 匹配。如果先前的失败，传输将获得保留：如果从其他科目转移一个，它会重新获得 $+7.2$ TSTR 积分 (9/9)。", "authors": [{"name": "Chi-Sheng Chen"}, {"name": "Samuel Yen-Chi Chen"}], "featured_authors": [{"name": "Chi-Sheng Chen"}, {"name": "Samuel Yen-Chi Chen"}], "author_count": 2}, {"id": "2609.14031", "category": "quant-ph", "title": "No cardinality bound for squashed entanglement", "abstract": "Squashed entanglement is an additive bipartite entanglement measure. For a state $\\rho_{AB}$, it is defined as the infimum of all conditional mutual information $I(A:B\\mid E)$ evaluated on extensions $\\rho_{ABE}$. It was unresolved whether there is a bound on the dimension of the conditioning system, $E$, needed for this optimization. We show that no such cardinality bound is possible. Explicitly, we find that the squashed entanglement for a partially dephased Bell pair on two qubits cannot be achieved for any finite dimensional extension $E$. A crucial ingredient of this proof is a direct sum step, which in a sense, symmetrizes two purifying systems while keeping the conditional mutual information unchanged and the coherence no worse.", "url": "https://arxiv.org/abs/2609.14031", "type": "理论+数值", "summary": "压扁纠缠是一种加性二分纠缠度量。对于状态 $\\rho_{AB}$，它被定义为在扩展 $\\rho_{ABE}$ 上评估的所有条件互信息 $I(A:B\\mid E)$ 的下确界。此优化所需的调节系统 $E$ 的尺寸是否有限制尚未解决。我们证明这样的基数界限是不可能的。明确地，我们发现对于任何有限维扩展 $E$ 都无法实现两个量子位上部分相移贝尔对的压缩纠缠。该证明的一个关键要素是直接求和步骤，从某种意义上说，它使两个净化系统对称，同时保持条件互信息不变且相干性不恶化。", "authors": [{"name": "Rabsan Galib Ahmed"}, {"name": "Graeme Smith"}], "featured_authors": [{"name": "Rabsan Galib Ahmed"}, {"name": "Graeme Smith"}], "author_count": 2}, {"id": "2609.14070", "category": "quant-ph", "title": "Formulating Multistage Cutting Stock Problems as QUBO", "abstract": "Cutting stock problems are of large relevance to a variety of industry branches. Here, we present a linear programming formulation for a restricted version of the multistage 2D cutting stock problem with Guillotine cuts and test it on published benchmark instances. After this, we derive a non-exact reformulation in quadratic unconstrained binary optimization (QUBO) form via unbalanced penalization, which we show to have possible benefits in modeling the problem with usable leftovers. This work mainly considers the restricted formulation, in which the dimensions of each cut are determined by those of a single required piece. We further discuss how the approach can be extended to the unrestricted problem, which allows more general cutting patterns involving cuts with dimensions of multiple required pieces and naturally gives rise to quadratic terms in the inequalities of the problem formulation. We showcase solutions via a Simulated Annealing solver for the restricted problem class, where we mainly study the performance of the iterative augmented Lagrangian method. We also discuss possible applications of Quantum Annealing in this setting, as a strong motivation to research QUBO formulations.", "url": "https://arxiv.org/abs/2609.14070", "type": "理论+数值", "summary": "库存减少问题与各个行业部门都有很大关系。在这里，我们提出了一种针对带有断头台切割的多级二维切削坯料问题的受限版本的线性规划公式，并在已发布的基准实例上对其进行了测试。之后，我们通过不平衡惩罚导出二次无约束二元优化（QUBO）形式的非精确重构，我们证明这在使用可用剩余物对问题进行建模时可能有好处。这项工作主要考虑受限公式，其中每次切割的尺寸由单个所需零件的尺寸决定。我们进一步讨论如何将该方法扩展到无限制问题，这允许更通用的切割模式，涉及具有多个所需零件尺寸的切割，并且自然地在问题公式的不等式中产生二次项。我们通过模拟退火求解器展示了针对受限问题类的解决方案，其中我们主要研究迭代增强拉格朗日方法的性能。\n\n我们还讨论了量子退火在这种情况下的可能应用，作为研究 QUBO 配方的强大动力。", "authors": [{"name": "Marcel Seelbach Benkner"}, {"name": "Chiara Capecci"}, {"name": "Sebastian Nagies"}, {"name": "Javed Akram"}, {"name": "Sebastian Rubbert"}, {"name": "Dimitrios Bantounas"}, {"name": "Philipp Hauke"}, {"name": "Michael Johanning"}, {"name": "Michael Moeller"}], "featured_authors": [{"name": "Marcel Seelbach Benkner"}, {"name": "Chiara Capecci"}, {"name": "Sebastian Nagies"}, {"name": "Philipp Hauke"}, {"name": "Michael Johanning"}, {"name": "Michael Moeller"}], "author_count": 9}, {"id": "2609.14110", "category": "quant-ph", "title": "Torsion detection in clique complexes is conditionally $QMA_1$-hard", "abstract": "Quantum algorithms for topological data analysis compute Betti numbers, the ranks of the homology groups of a simplicial complex, which can be read off from the kernel of a combinatorial Laplacian. Deciding whether a Betti number of a clique complex is nonzero is $QMA_1$-hard, and remains so under a spectral gap promise on vertex-weighted graphs. Integral homology, however, contains information inaccessible to the Laplacian spectrum. A new part that appears in integral homology is torsion: cycles that become boundaries only after being traversed several times, as in a projective plane or a Klein bottle. We ask how hard it is to detect torsion, and we answer with a simple reduction. We attach to an arbitrary clique complex a fixed $31$-vertex triangulation of the projective plane. The $k$th mod-$2$ Betti number of the input then reappears as $2$-torsion two degrees up, while all rational homology disappears and every combinatorial Laplacian acquires a constant spectral gap. We conclude that detecting torsion in clique complexes of unweighted graphs is $NP$-hard, even under a constant gap promise, and that it is $QMA_1$-hard if mod-$2$ clique homology is.", "url": "https://arxiv.org/abs/2609.14110", "type": "理论+数值", "summary": "用于拓扑数据分析的量子算法计算贝蒂数，即单纯复形的同调群的等级，可以从组合拉普拉斯算子的核中读取。决定派系复合体的贝蒂数是否非零是 $QMA_1$ 困难的，并且在顶点加权图上的谱间隙承诺下仍然如此。然而，积分同源性包含拉普拉斯谱无法访问的信息。积分同调中出现的一个新部分是挠率：只有在经过几次之后才成为边界的循环，就像在射影平面或克莱因瓶中一样。我们问检测扭转有多困难，我们用简单的简化来回答。我们将投影平面的固定 $31$ 顶点三角剖分附加到任意派系复合体上。然后，输入的 $k$th mod-$2$ Betti 数重新出现为 $2$- 向上扭转两度，同时所有有理同源性消失，并且每个组合拉普拉斯算子获得恒定的谱间隙。我们的结论是，检测未加权图的派系复合体中的扭转是 $NP$-困难的，即使在恒定间隙承诺下也是如此，并且如果 mod-$2$ 派系同源性是，则它是 $QMA_1$-困难。", "authors": [{"name": "Adam Wesołowski"}], "featured_authors": [{"name": "Adam Wesołowski"}], "author_count": 1}, {"id": "2609.14131", "category": "quant-ph", "title": "Operator Learning with Variational Quantum Circuits", "abstract": "A new methodology is developed for quantum machine learning which enables variational quantum circuits to learn linear and non-linear solution operators to differential equations. This is devised by extending the framework of the DeepONet, a technique for modeling differential equations. The branch and trunk neural networks are replaced by variational quantum circuits, leveraging the quantum universal approximation theorem. The methodology is tested on several differential equations and yields low approximation & generalization errors even with shallow circuit depths. In addition, it does not encounter barren plateaus during training. The model displays improved error and parameter scaling relative to the classical DeepONet. This is due to the intrinsic property that the approximation error depends on the dimension of the input function space, rather than the number of sensor locations. A theoretical framework is established in the form of explicit error bounds, which measure the contributions of the truncation, branch, and trunk circuit errors to the total operator approximation error. Full derivations for the error bounds are developed in the norms $L^2$, $L^p$, $C^0$, and Sobolev $H^k$, along with a classical-quantum comparative analysis (as Supplemental Materials).", "url": "https://arxiv.org/abs/2609.14131", "type": "理论+数值", "summary": "为量子机器学习开发了一种新方法，使变分量子电路能够学习微分方程的线性和非线性解算子。这是通过扩展 DeepONet 的框架而设计的，DeepONet 是一种微分方程建模技术。利用量子通用逼近定理，分支和主干神经网络被变分量子电路取代。该方法在多个微分方程上进行了测试，即使电路深度较浅，也能产生较低的近似和泛化误差。另外，它在训练时不会遇到荒芜的高原。相对于经典 DeepONet，该模型显示出改进的误差和参数缩放。这是由于近似误差取决于输入函数空间的维度而不是传感器位置的数量的固有属性。以显式误差界限的形式建立了一个理论框架，该框架测量截断、分支和干线电路误差对总算子逼近误差的贡献。\n\n误差范围的完整推导是在规范 $L^2$、$L^p$、$C^0$ 和 Sobolev $H^k$ 中开发的，并进行了经典量子比较分析（作为补充材料）。", "authors": [{"name": "Jorgen Wu"}, {"name": "Masoud Barati"}, {"name": "Peyman Givi"}], "featured_authors": [{"name": "Jorgen Wu"}, {"name": "Masoud Barati"}, {"name": "Peyman Givi"}], "author_count": 3}, {"id": "2609.14203", "category": "quant-ph", "title": "Trace-Norm Overlaps of Quantum States: Interpolation, Equality, and Data-Processing Rigidity", "abstract": "Let $\\rho$ and $\\sigma$ be density operators on a separable Hilbert space. For $0<\\alpha<1$, we study the directed trace-norm overlap $\\Phi_\\alpha(\\rho,\\sigma)=\\|\\rho^\\alpha\\sigma^{1-\\alpha}\\|_1$ and its symmetrized form $\\mathcal F_\\alpha(\\rho,\\sigma)=\\frac12\\bigl(\\Phi_\\alpha(\\rho,\\sigma)+\\Phi_{1-\\alpha}(\\rho,\\sigma)\\bigr)$. At $\\alpha=\\tfrac12$, both quantities coincide with the root Uhlmann--Jozsa fidelity. Our aim is not to introduce a new notion of fidelity, but to understand how these overlaps vary with the parameter and when equality occurs in the resulting inequalities. We first prove that $\\alpha\\mapsto\\Phi_\\alpha(\\rho,\\sigma)$ is log-convex. This yields a sharp lower bound for $\\mathcal F_\\alpha$ in terms of the root fidelity, together with a stronger intermediate geometric-mean bound. We also show that $\\Phi_\\alpha$ is the trace functional $Q_{\\alpha,1/2}$ associated with the $\\alpha$-$z$ Renyi divergence, which connects the directed overlap with the known $\\alpha$-$z$ Renyi theory. We then determine the exact data-processing behavior of the symmetrized family. Universal monotonicity under quantum channels holds only at $\\alpha=\\tfrac12$; for every other value of $\\alpha$, it already fails under diagonal pinching of faithful real qubit states. In finite dimensions, we give a complete spectral description of the equality cases and provide explicit noncommuting examples. We also discuss some natural questions about overlap-preserving maps. Finally, we prove that the difference between the Petz overlap and the directed trace-norm overlap vanishes exactly when $\\rho$ and $\\sigma$ commute, without requiring either faithfulness or any additional support assumption.", "url": "https://arxiv.org/abs/2609.14203", "type": "理论", "summary": "令 $\\rho$ 和 $\\sigma$ 为可分离希尔伯特空间上的密度算子。对于 $0<\\alpha<1$，我们研究有向迹范数重叠 $\\Phi_\\alpha(\\rho,\\sigma)=\\|\\rho^\\alpha\\sigma^{1-\\alpha}\\|_1$ 及其对称形式 $\\mathcal F_\\alpha(\\rho,\\sigma)=\\frac12\\bigl(\\Phi_\\alpha(\\rho,\\sigma)+\\Phi_{1-\\alpha}(\\rho,\\sigma)\\bigr)$。在 $\\alpha=\\tfrac12$ 处，两个量都与根 Uhlmann-Jozsa 保真度一致。我们的目的不是引入新的保真度概念，而是了解这些重叠如何随参数变化，以及在产生的不等式中何时发生等式。我们首先证明 $\\alpha\\mapsto\\Phi_\\alpha(\\rho,\\sigma)$ 是对数凸的。这在根保真度方面产生了 $\\mathcal F_\\alpha$ 的急剧下限，以及更强的中间几何平均限。我们还表明 $\\Phi_\\alpha$ 是与 $\\alpha$-$z$ Renyi 散度相关的迹函数 $Q_{\\alpha,1/2}$，它将有向重叠与已知的 $\\alpha$-$z$ Renyi 理论联系起来。然后我们确定对称族的确切数据处理行为。\n\n量子通道下的普遍单调性仅在$\\alpha=\\tfrac12$处成立；对于 $\\alpha$ 的每个其他值，它已经在忠实真实量子位状态的对角挤压下失败了。在有限维度中，我们给出了等式情况的完整谱描述，并提供了明确的非交换示例。我们还讨论了有关重叠保留地图的一些自然问题。最后，我们证明，当 $\\rho$ 和 $\\sigma$ 通勤时，Petz 重叠和有向迹范数重叠之间的差异完全消失，不需要忠实度或任何额外的支持假设。", "authors": [{"name": "Zahra Maleki Khouzani"}, {"name": "Seyed Mahmoud Manjegani"}], "featured_authors": [{"name": "Zahra Maleki Khouzani"}, {"name": "Seyed Mahmoud Manjegani"}], "author_count": 2}, {"id": "2609.14252", "category": "quant-ph", "title": "Efficient expectation value estimation for quantum circuits via extended stabilizer frameworks and adaptive variance estimation", "abstract": "Classical simulability of quantum circuits plays a central role in characterizing and quantifying quantum computational advantage. Typically, the presence of non-Clifford gates introduces an exponential runtime overhead for classically estimating expectation values of observables. In this work, we introduce an efficient simulation framework that integrates the sum-over-Clifford method with quasi-probability-based stabilizer simulation to directly estimate expectation values. To optimize efficiency, we incorporate a circuit-adaptive reduction via variance estimation protocol, which terminates simulations once an empirical confidence bound is sufficient to guarantee the prescribed error tolerance. Our method circumvents overly conservative Hoeffding's inequality, thereby reducing the dependence on the gate-wise stabilizer extent from quadratic to linear in the low-variance regime, while maintaining the same space complexity as previous approaches. We explicitly prove the sample-complexity reduction for random quantum circuits and T-doped Clifford circuits and also empirically validate these advantages in the quantum approximate optimization algorithm and quantum kernel method.", "url": "https://arxiv.org/abs/2609.14252", "type": "理论+数值", "summary": "量子电路的经典可模拟性在表征和量化量子计算优势方面发挥着核心作用。通常，非 Clifford 门的存在会给经典估计可观测值的期望值带来指数运行时开销。在这项工作中，我们引入了一种有效的模拟框架，该框架将 Sum-over-Clifford 方法与基于准概率的稳定器模拟相结合，以直接估计期望值。为了优化效率，我们通过方差估计协议合并了电路自适应缩减，一旦经验置信界限足以保证规定的误差容限，该协议就会终止模拟。我们的方法规避了过于保守的霍夫丁不等式，从而减少了对低方差状态下对门级稳定器程度的依赖，从二次到线性，同时保持与以前的方法相同的空间复杂度。我们明确证明了随机量子电路和 T 掺杂 Clifford 电路的样本复杂度降低，并在量子近似优化算法和量子核方法中凭经验验证了这些优势。", "authors": [{"name": "Yunseo Hwang"}, {"name": "Giwon Song"}, {"name": "Kyoung Keun Park"}, {"name": "Hyukjoon Kwon"}, {"name": "Taehyun Kim"}], "featured_authors": [{"name": "Yunseo Hwang"}, {"name": "Giwon Song"}, {"name": "Kyoung Keun Park"}, {"name": "Hyukjoon Kwon"}, {"name": "Taehyun Kim"}], "author_count": 5}, {"id": "2609.14463", "category": "quant-ph", "title": "Arithmetic of Bohr Frequencies Governs Uniform Mixing in Randomly Timed Quantum Spin Chains", "abstract": "Randomizing the readout time averages the mode interference in a quantum walk. We ask when this makes the site populations of a uniformly coupled $XY$ chain exactly uniform for every initial site. For $N\\ge2$ spins, this is possible when $N+1$ is a power of two, a prime, or twice a prime. It is impossible when $15\\mid(N+1)$, $21\\mid(N+1)$, or $6\\mid(N+1)$ with $N\\ge11$. Uniformity uniquely fixes the averaged cosine coherences according to the mirror parities of the modes. Equal Bohr frequencies can impose incompatible coherence values. We classify these parity collisions using vanishing sums of roots of unity and prove existence in the positive cases through a phase distribution on a torus.", "url": "https://arxiv.org/abs/2609.14463", "type": "理论", "summary": "随机化读出时间可以平均量子行走中的模式干扰。我们问，这何时使得均匀耦合 $XY$ 链的站点数量对于每个初始站点都完全一致。对于 $N\\ge2$ 自旋，当 $N+1$ 是 2 的幂、素数或素数的两倍时，这是可能的。当 $15\\mid(N+1)$、$21\\mid(N+1)$ 或 $6\\mid(N+1)$ 与 $N\\ge11$ 时，这是不可能的。均匀性根据模式的镜像奇偶性独特地固定平均余弦相干性。相同的玻尔频率可能会产生不兼容的相干值。我们使用统一根的消失和对这些宇称碰撞进行分类，并通过环面上的相位分布证明在正情况下的存在性。", "authors": [{"name": "Musung Kang"}], "featured_authors": [{"name": "Musung Kang"}], "author_count": 1}, {"id": "2609.14519", "category": "quant-ph", "title": "Robustness of Hidden-Variable Theories and Matrix Scaling", "abstract": "Motivated by quantum foundations and complexity theory, Aaronson formalized a hidden-variable theory inspired by a proposal by Schrödinger. To any quantum state and unitary, this Schrödinger theory assigns a joint probability distribution via the Sinkhorn algorithm: rescale the columns and rows of the entrywise modulus of the unitary so that the marginals match the Born rule for the initial and final quantum states, respectively. He conjectured that this map is robust, i.e., inverse polynomially small perturbations in the inputs lead to inverse polynomially small perturbations of the joint distribution, which is important for complexity theoretic applications. We present a counterexample to this conjecture: We construct a pure state and two unitaries that are exponentially close, yet the joint probability distributions assigned by the Schrödinger theory differ by at least an inverse-linear term in at least one entry, and by a constant in total variation distance. We also propose a modified version of Schrödinger's theory that satisfies robustness, while retaining all of its other desirable properties. This yields a complete picture of which axioms of Aaronson can be simultaneously satisfied by hidden-variable theories.", "url": "https://arxiv.org/abs/2609.14519", "type": "理论+数值", "summary": "在量子基础和复杂性理论的推动下，阿伦森在薛定谔的提议的启发下形式化了隐变量理论。对于任何量子态和酉态，该薛定谔理论通过 Sinkhorn 算法分配联合概率分布：重新调整酉态的逐项模量的列和行，以便边缘分别匹配初始和最终量子态的玻恩规则。他推测该映射是鲁棒的，即输入中的逆多项式小扰动会导致联合分布的逆多项式小扰动，这对于复杂性理论应用很重要。我们提出了这个猜想的反例：我们构造了一个纯状态和两个指数接近的酉式，但薛定谔理论分配的联合概率分布在至少一个条目中至少有一个逆线性项，并且总变异距离有一个常数。我们还提出了薛定谔理论的修改版本，该版本满足稳健性，同时保留其所有其他所需属性。\n\n这产生了一幅完整的图景，其中隐变量理论可以同时满足阿伦森公理。", "authors": [{"name": "Giulio Malavolta"}, {"name": "Harold Nieuwboer"}, {"name": "Akshay Ramachandran"}, {"name": "Michael Walter"}], "featured_authors": [{"name": "Giulio Malavolta"}, {"name": "Harold Nieuwboer"}, {"name": "Akshay Ramachandran"}, {"name": "Michael Walter"}], "author_count": 4}, {"id": "2609.14524", "category": "quant-ph", "title": "Preparation of Multimode NOON States via Floquet-Engineered Conditional Chiral Excitation", "abstract": "The NOON states possess Heisenberg-limited phase sensitivity and are crucial for quantum-enhanced metrology. In our work, we develop a Floquet-engineered conditional-routing framework in which a $d$-level quantum controller mediates the dynamics of $d$ bosonic modes. For an arbitrary odd dimension $d=2s+1$, the $d$-level system can act as a ``quantum knob\" by tuning its initial states to coherently control the direction of chiral excitation flow, such that different controller eigenstates generate distinct cyclic-routing branches of the bosonic excitations. By choosing $s$ harmonics, we construct an exact qudit-controlled cyclic permutation and use it to formulate a general protocol for preparing odd-$d$-mode NOON states. The same framework also enables programmable complex amplitudes through appropriate preparation of the controller state. As concrete realizations, we show that the three-mode case requires only a single harmonic and exhibits two oppositely directed chiral branches together with a stationary branch, whereas the five-mode case requires two harmonics and both nearest- and next-nearest-neighbor chiral hoppings. Meanwhile, taking the three-mode realization as a representative example, we assess the influence of systematic imperfections and dissipation on the conditional-routing dynamics and identify parameter regimes in which the routing operation remains accurate. Our results establish a systematic Floquet construction for controllable chiral routing and multimode NOON-state generation in arbitrary odd-dimensional networks, with potential applications in quantum information processing and quantum metrology.", "url": "https://arxiv.org/abs/2609.14524", "type": "理论", "summary": "NOON 态具有海森堡限制的相位灵敏度，对于量子增强计量学至关重要。在我们的工作中，我们开发了一个 Floquet 设计的条件路由框架，其中 $d$ 级量子控制器调节 $d$ 玻色子模式的动态。对于任意奇数维度 $d=2s+1$，$d$ 级系统可以充当“量子旋钮”，通过调整其初始状态来连贯地控制手性激发流的方向，从而使不同的控制器本征态生成玻色子激发的不同循环路由分支。通过选择 $s$ 谐波，我们构建了精确的 qudit 控制的循环排列，并用它来制定用于准备奇数 $d$ 模式 NOON 状态的通用协议。相同的框架还通过适当准备控制器状态来实现可编程复振幅。作为具体实现，我们表明三模情况仅需要一个谐波，并表现出两个方向相反的手性分支和一个固定分支，而五模情况需要两个谐波以及最近邻和次近邻手性跳跃。\n\n同时，以三模式实现为代表，我们评估了系统缺陷和耗散对条件路由动态的影响，并确定了路由操作保持准确的参数机制。我们的结果建立了一种系统的 Floquet 结构，用于任意奇数维网络中的可控手性路由和多模 NOON 状态生成，在量子信息处理和量子计量中具有潜在的应用。", "authors": [{"name": "Mengxue Li"}, {"name": "Bo Tian"}, {"name": "H. Z. Shen"}, {"name": "Haodi Liu"}, {"name": "Gangcheng Wang"}], "featured_authors": [{"name": "Mengxue Li"}, {"name": "Bo Tian"}, {"name": "H. Z. Shen"}, {"name": "Haodi Liu"}, {"name": "Gangcheng Wang"}], "author_count": 5}, {"id": "2609.14529", "category": "quant-ph", "title": "Parameter-Efficient Quantum NLP for Paraphrase Detection: Performance, Robustness, and Entanglement", "abstract": "Rigorous empirical validation of quantum machine learning on natural language tasks remains scarce. We evaluate a 10-qubit hybrid quantum-classical variational circuit (2,148 parameters) for paraphrase detection across three benchmarks: MRPC, Quora Question Pairs (QQP), and adversarial PAWS. On QQP (n = 10 seeds), the circuit achieves 75.53% +/- 0.75%. accuracy, statistically outperforming parameter-matched classical baselines (DeepMLP: p = 0.015, Cohen's d = 1.20; F1: p < 0.001, d = 2.32) and surpassing DistilBERT-4bit with 31,191 fewer parameters. On MRPC the optimal 2-layer variant reaches 92% of BERT-base accuracy at 54,000 lower parameter cost. Circuit depth analysis reveals a dataset-depth scaling effect; entanglement analysis via the Meyer-Wallach measure identifies multi-qubit entanglement as the primary performance driver (r = 0.85 across four variants). Adversarial evaluation on PAWS reveals emergent robustness: 98.2% recall versus 81.6% classical (+16.6 pp, d = 1.24, p < 0.001), without adversarial training. These results constitute the first systematic parameter-matched multi-benchmark empirical validation of hybrid variational circuits for NLP. All results are from classical simulation; hardware validation is future work.", "url": "https://arxiv.org/abs/2609.14529", "type": "理论+数值", "summary": "量子机器学习在自然语言任务上的严格实证验证仍然很少。我们评估了 10 量子位混合量子经典变分电路（2,148 个参数），用于跨三个基准的释义检测：MRPC、Quora 问题对 (QQP) 和对抗性 PAWS。在 QQP（n = 10 个种子）上，电路达到 75.53% +/- 0.75%。准确性，统计上优于参数匹配的经典基线（DeepMLP：p = 0.015，Cohen's d = 1.20；F1：p < 0.001，d = 2.32），并以少 31,191 个参数超越 DistilBERT-4bit。在 MRPC 上，最佳 2 层变体以较低的 54,000 参数成本达到了 BERT 基础准确率的 92%。电路深度分析揭示了数据集深度缩放效应；通过 Meyer-Wallach 测量进行的纠缠分析将多量子位纠缠确定为主要性能驱动因素（四种变体中 r = 0.85）。 PAWS 的对抗性评估揭示了新兴的鲁棒性：在没有对抗性训练的情况下，召回率为 98.2%，经典召回率为 81.6%（+16.6 pp，d = 1.24，p < 0.001）。这些结果构成了 NLP 混合变分电路的第一个系统参数匹配多基准经验验证。\n\n所有结果均来自经典模拟；硬件验证是未来的工作。", "authors": [{"name": "Farha Nausheen"}, {"name": "Khandakar Ahmed"}, {"name": "Farina Riaz"}], "featured_authors": [{"name": "Farha Nausheen"}, {"name": "Khandakar Ahmed"}, {"name": "Farina Riaz"}], "author_count": 3}, {"id": "2609.14537", "category": "quant-ph", "title": "Controlling quantum state transfer in rooted products", "abstract": "Godsil and McKay (1978) showed that the rooted product is a powerful tool for constructing non-isomorphic cospectral pairs of graphs. Despite lacking a convenient tensor product structure, we show that the rooted product is useful for constructing graphs with good quantum state transfer properties. In particular, we prove a simple transference principle: if a graph $X$ has quantum state transfer and $Y$ is a controllable graph, their rooted product $X^Y$ has quantum state transfer (inherited from $X$). This complements a folklore property of Cartesian product which preserves perfect state transfer. However, the rooted product is a significantly sparser graph and, more importantly, can be easily used to construct efficient high-fidelity state transfer even if $X$ has no quantum state transfer. Our proof exploits the fact that a rooted product creates a large number of strongly cospectral pairs of vertices and that its condition number can be controlled by its pendant subgraph.", "url": "https://arxiv.org/abs/2609.14537", "type": "理论", "summary": "Godsil 和 McKay (1978) 表明，根乘积是构建非同构共谱图对的强大工具。尽管缺乏方便的张量积结构，但我们证明了根积对于构造具有良好量子状态转移特性的图很有用。特别是，我们证明了一个简单的转移原理：如果图$X$具有量子状态转移并且$Y$是可控图，则它们的根乘积$X^Y$具有量子状态转移（继承自$X$）。这补充了笛卡尔积的民间传说属性，保留了完美的状态转移。然而，根乘积是一个显着稀疏的图，更重要的是，即使 $X$ 没有量子状态转移，也可以轻松用于构造高效的高保真状态转移。我们的证明利用了这样一个事实：根乘积创建了大量强共谱顶点对，并且其条件数可以由其下垂子图控制。", "authors": [{"name": "Addison Ballif"}, {"name": "Christino Tamon"}, {"name": "Gabriel Tucker"}], "featured_authors": [{"name": "Addison Ballif"}, {"name": "Christino Tamon"}, {"name": "Gabriel Tucker"}], "author_count": 3}, {"id": "2609.14621", "category": "quant-ph", "title": "A pretty-tight converse on the classical capacity of generalized amplitude-damping channels", "abstract": "The classical capacity of a quantum channel is the highest rate at which classical information can be transmitted with vanishing error. Although the capacities of many fundamental quantum channels have been established, the capacity of the generalized amplitude-damping channel remains an open problem in quantum Shannon theory. In this work, we revisit a converse bound introduced by Brandão et al. [Phys. Rev. Lett. 106, 230502 (2011)], which upper-bounds the classical capacity in terms of a correlation measure. For the generalized amplitude-damping channel, we derive a relaxation of this measure that makes the converse bound efficiently computable. Numerical comparisons demonstrate that our bound is pretty tight in general and nearly coincides with the Holevo information at nonzero temperatures, significantly improving upon existing bounds across the entire parameter range.", "url": "https://arxiv.org/abs/2609.14621", "type": "理论+数值", "summary": "量子信道的经典容量是经典信息可以在误差消失的情况下传输的最高速率。尽管许多基本量子通道的容量已经确定，但广义振幅阻尼通道的容量仍然是量子香农理论中的一个悬而未决的问题。在这项工作中，我们重新审视了 Brandão 等人提出的逆界。 [物理。莱特牧师。 106, 230502 (2011)]，它在相关性度量方面限制了经典容量。对于广义振幅阻尼通道，我们推导出该度量的松弛，使得逆界可有效计算。数值比较表明，我们的界限总体上相当严格，并且几乎与非零温度下的 Holevo 信息一致，显着改善了整个参数范围内的现有界限。", "authors": [{"name": "Kun Fang"}], "featured_authors": [{"name": "Kun Fang"}], "author_count": 1}, {"id": "2609.14626", "category": "quant-ph", "title": "Derivatives of Quantum Randomness: Separating Pseudorandom Unitaries from Pseudorandom (Function-like) States", "abstract": "Quantum computation gives rise to new pseudorandom primitives for states and unitaries, including pseudorandom state generators (PRSGs), pseudorandom function-like state generators (PRFSGs), and pseudorandom unitaries (PRUs). In this paper, we show a full unitary oracle separation between PRFSGs and PRUs. The separation holds between the strongest state notion and the weakest unitary notion: even adaptively secure, quantum-accessible PRFSGs do not imply non-adaptively secure, forward-only PRUs, even when their implementations are allowed to be non-unitary and use an arbitrary number of ancillary qubits. This reveals a fundamental distinction between pseudorandomness for quantum states and for quantum unitaries. Our main technical idea is to view a candidate PRU construction with access to state generation oracles as a map from the underlying oracle states to implemented unitaries, and to study the derivatives of this map. These derivatives are inherently low rank, and we exploit this low-rank structure to distinguish the resulting unitaries from truly random ones. We believe this differential perspective may be useful for studying other structural questions about quantum states and unitaries.", "url": "https://arxiv.org/abs/2609.14626", "type": "理论", "summary": "量子计算产生了新的状态和酉伪随机原语，包括伪随机状态生成器（PRSG）、伪随机函数状状态生成器（PRFSG）和伪随机酉元（PRU）。在本文中，我们展示了 PRFSG 和 PRU 之间完全统一的预言机分离。最强的状态概念和最弱的统一概念之间存在着分离：即使是自适应安全、量子可访问的 PRFSG，也不意味着非自适应安全、仅前向的 PRU，即使它们的实现被允许是非统一的并使用任意数量的辅助量子位。这揭示了量子态和量子酉的伪随机性之间的根本区别。我们的主要技术思想是将能够访问状态生成预言机的候选 PRU 构造视为从底层预言机状态到已实现酉​​式的映射，并研究该映射的导数。这些导数本质上是低秩的，我们利用这种低秩结构来区分所得的酉和真正随机的。\n\n我们相信这种不同的视角可能有助于研究有关量子态和幺正的其他结构问题。", "authors": [{"name": "Minki Hhan"}], "featured_authors": [{"name": "Minki Hhan"}], "author_count": 1}, {"id": "2609.14632", "category": "quant-ph", "title": "Linear equations mod $n$ are pseudo-telepathic", "abstract": "We prove that the quantum monad in dimension $2n$ admits no natural transformation to the polymorphism clone of linear equations modulo $n$. Consequently, for every $n\\geq 2$, there exists an unsatisfiable system of linear equations over $\\mathbb{Z}_n$ whose constraint system game admits a perfect finite-dimensional quantum strategy. As a corollary, we completely characterise pseudo-telepathic constraint languages in finite dimension. The proof combines a result of Harding, Jager, and Smith on group-valued measures on subspaces of Hilbert spaces with the polymorphism-minion characterisation of quantum pseudo-telepathy.", "url": "https://arxiv.org/abs/2609.14632", "type": "理论", "summary": "我们证明维度 $2n$ 中的量子单子不允许自然变换到模 $n$ 的线性方程的多态性克隆。因此，对于每个 $n\\geq 2$，在 $\\mathbb{Z}_n$ 上存在一个不可满足的线性方程组，其约束系统博弈承认完美的有限维量子策略。作为推论，我们在有限维度上完全表征了伪心灵感应约束语言。该证明结合了 Harding、Jager 和 Smith 在希尔伯特空间子空间上的群值测度的结果与量子伪心灵感应的多态性-minion 表征。", "authors": [{"name": "Lorenzo Ciardo"}], "featured_authors": [{"name": "Lorenzo Ciardo"}], "author_count": 1}, {"id": "2609.14644", "category": "quant-ph", "title": "Collective-dissipation-controlled thermal rectification and entropy production in a three-terminal three-qubit XXZ spin chain", "abstract": "We investigate thermal rectification and its thermodynamic cost in a three-qubit XXZ spin chain coupled to three thermal reservoirs: two local baths attached to the boundary qubits and a collective bath jointly coupled to the middle and right qubits. This asymmetric dissipative architecture allows the collective environment to actively reshape energy transport. We show that the heat current carried by the collective bath changes sign as its temperature is varied, and that the spin-chain anisotropy provides an effective internal control parameter for suppressing the boundary heat currents. These features yield thermal rectification coefficients of about $3.36\\%$ at maximum bias and up to $20.1\\%$ in the strongly anisotropic regime, although the latter comes at the cost of severely reduced heat currents. Beyond rectification, we evaluate the steady-state entropy production rate and identify a low-irreversibility operating window near the collective-current reversal, whereas increasing the local boundary couplings monotonically raises the thermodynamic cost. Our results establish collective dissipation as a tunable control mechanism for quantum heat transport and uncover a nontrivial trade-off among rectification, heat-current magnitude, and irreversible losses.", "url": "https://arxiv.org/abs/2609.14644", "type": "理论+数值", "summary": "我们研究了与三个热库耦合的三量子位 XXZ 自旋链中的热整流及其热力学成本：两个局部浴连接到边界量子位，一个集体浴共同耦合到中间和右侧量子位。这种不对称的耗散架构允许集体环境主动重塑能量传输。我们表明，集体浴所携带的热流随着温度的变化而改变符号，并且自旋链各向异性为抑制边界热流提供了有效的内部控制参数。这些特性在最大偏置下产生约 3.36\\%$ 的热整流系数，在强各向异性状态下产生高达 20.1\\%$ 的热整流系数，尽管后者是以严重减少热流为代价的。除了整流之外，我们还评估了稳态熵产生率并确定了集体电流反转附近的低不可逆操作窗口，而单调增加局部边界耦合会增加热力学成本。\n\n我们的结果将集体耗散建立为量子热传输的可调控制机制，并揭示了整流、热流幅度和不可逆损失之间的重要权衡。", "authors": [{"name": "Alireza Nourmandipour"}], "featured_authors": [{"name": "Alireza Nourmandipour"}], "author_count": 1}, {"id": "2609.14707", "category": "quant-ph", "title": "Unique determination and generation of rank two single-qubit quantum channels", "abstract": "An important problem in quantum technologies is the generation of a target evolution of an open quantum system. A core component of this task is the ability to determine whether the actual evolution of the system coincides with the target evolution. For the generation of unitary quantum channels in open quantum systems, it was shown by Goerz, Reich and Koch [New J. Phys. {\\bf 16} 055012 (2014)] that for determining whether the actual evolution coincides with a desired unitary it is sufficient to compare their action on three special density matrices. In this work, we consider controlled generation and unique determination of non-unitary quantum channels in open quantum systems with particular emphasis on rank two single-qubit quantum channels. We prove that to uniquely determine such quantum channels it is sufficient to consider their action on only three suitably chosen density matrices. Based on this theoretical result, we numerically investigate generation of various non-unitary target single-qubit quantum channels in open quantum systems using coherent and incoherent controls.", "url": "https://arxiv.org/abs/2609.14707", "type": "数值", "summary": "量子技术中的一个重要问题是生成开放量子系统的目标演化。该任务的核心组成部分是能够确定系统的实际演化是否与目标演化一致。 Goerz、Reich 和 Koch 展示了开放量子系统中酉量子通道的生成 [New J. Phys. {\\bf 16} 055012 (2014)]为了确定实际演化是否与期望的单一一致，比较它们在三个特殊密度矩阵上的作用就足够了。在这项工作中，我们考虑开放量子系统中非单一量子通道的受控生成和唯一确定，特别强调二级单量子位量子通道。我们证明，要唯一地确定此类量子通道，只需考虑它们在三个适当选择的密度矩阵上的作用就足够了。基于这一理论结果，我们利用相干和非相干控制对开放量子系统中各种非单一目标单量子位量子通道的生成进行了数值研究。", "authors": [{"name": "Nina Kuklina"}, {"name": "Vasilii Vasilenko"}, {"name": "Boris Volkov"}, {"name": "Alexander Pechen"}], "featured_authors": [{"name": "Nina Kuklina"}, {"name": "Vasilii Vasilenko"}, {"name": "Boris Volkov"}, {"name": "Alexander Pechen"}], "author_count": 4}, {"id": "2609.14964", "category": "quant-ph", "title": "Exact Breit-Rabi formulae for the nitrogen-vacancy center in diamond", "abstract": "The hyperfine structure that the nitrogen-vacancy (NV) center in diamond has with its nitrogen nucleus is of immense importance for quantum sensing and quantum computing. Current methods of calculating the NV hyperfine energy eigenvalues and eigenstates with respect to an axial magnetic field - i.e., calculating the NV Breit-Rabi formula - resort to numerical methods and analytic approximations. Here we provide an exact, closed-form expression to the NV hyperfine energy eigenvalues and eigenstates for both the nitrogen-14 and -15 cases.", "url": "https://arxiv.org/abs/2609.14964", "type": "理论+数值", "summary": "金刚石中的氮空位（NV）中心及其氮核所具有的超精细结构对于量子传感和量子计算非常重要。当前计算相对于轴向磁场的 NV 超精细能量本征值和本征态的方法（即计算 NV Breit-Rabi 公式）采用数值方法和解析近似。在这里，我们为氮 14 和 -15 情况提供了 NV 超精细能量本征值和本征态的精确封闭式表达式。", "authors": [{"name": "Alex Tritt"}, {"name": "Lincoln D. Turner"}, {"name": "Michael S. J. Barson"}], "featured_authors": [{"name": "Alex Tritt"}, {"name": "Lincoln D. Turner"}, {"name": "Michael S. J. Barson"}], "author_count": 3}, {"id": "2609.14989", "category": "quant-ph", "title": "Correlation and Branching Mechanisms in the Quantum-to-Classical Transition of Interacting Systems", "abstract": "We analyze the quantum-to-classical transition of interacting systems from the viewpoint of reduced dynamical closure. Bohmian trajectories are used as a diagnostic of the probability flow generated by the full wavefunction, rather than as an alternative set of quantum predictions. A closed classical or semiclassical description of a retained coordinate can emerge either because interaction-induced correlations are suppressed or because the observable of interest is insensitive to the correlations that remain. Three models are used to isolate distinct mechanisms. In a hard-core collision, the leading tail of a broad relative-coordinate wave packet reaches the boundary before its center and generates spatial nonseparability through reflection and interference. In the Rabi model, the mixed quantum-classical Ehrenfest approximation fails when spin-position covariances prevent the spin dynamics from being determined solely by the mean oscillator coordinate. In an internal-state-dependent force model, the total mean position obeys an exact Ehrenfest equation, while the wavefunction separates into branch-resolved pointer components; mean classicality therefore does not imply branch-level classicality. These examples show that the quantum-to-classical transition of interacting systems is controlled not only by wave-packet localization but also by whether and how interaction-induced correlations enter the reduced equations of motion.", "url": "https://arxiv.org/abs/2609.14989", "type": "理论+数值", "summary": "我们从简化的动力学闭包的角度分析了相互作用系统的量子到经典的转变。波姆轨迹被用作对完整波函数生成的概率流的诊断，而不是作为一组替代的量子预测。保留坐标的封闭经典或半经典描述可能会出现，因为相互作用引起的相关性被抑制，或者因为感兴趣的可观察量对保留的相关性不敏感。三个模型用于隔离不同的机制。在硬核碰撞中，宽相对坐标波包的前导尾部在其中心之前到达边界，并通过反射和干涉产生空间不可分离性。在拉比模型中，当自旋位置协方差阻止自旋动力学仅由平均振子坐标确定时，混合量子经典埃伦菲斯特近似会失败。\n\n在内部状态相关力模型中，总平均位置服从精确的 Ehrenfest 方程，而波函数则分解为分支解析的指针分量；因此，平均经典性并不意味着分支级别的经典性。这些例子表明，相互作用系统的量子到经典的转变不仅受到波包局域化的控制，而且还受到相互作用引起的相关性是否以及如何进入简化运动方程的控制。", "authors": [{"name": "Bingyu Cui"}], "featured_authors": [{"name": "Bingyu Cui"}], "author_count": 1}, {"id": "2609.15004", "category": "quant-ph", "title": "Failure of the Asymptotic Equipartition Property for Quantum Channels", "abstract": "We establish two results on the asymptotic equipartition property (AEP) for quantum channels. First, the AEP formulated using smoothing over completely positive trace-preserving maps fails in general. Second, the AEP with smoothing over subchannels (completely positive trace-nonincreasing maps) is equivalent to the strong converse for parallel quantum channel Stein's lemma, to a sharp threshold for the channel hockey-stick divergence, and to an AEP for the channel Lorenz divergence. The counterexample reveals a surprising separation between channel and subchannel smoothing. Although states and classical channels admit a sharp, dimension-independent completion bound, which we establish, the corresponding single-shot gap for quantum channels is unbounded already for qubits. This separation persists asymptotically: we construct qutrit channel pairs with finite max-relative entropy whose CPTP-smoothed rate strictly exceeds the regularized channel relative entropy. The asymptotic gap between channel and subchannel smoothing is unbounded across the family, even when the subchannel approximation error decays exponentially. To establish the equivalences, we develop a uniform filter that converts Lorenz smoothing into a single nearby subchannel. The four conjectured formulations thus share a common asymptotic threshold, whose validity for general channel pairs remains open. Together, these results separate this threshold question from the obstruction imposed by exact trace preservation.", "url": "https://arxiv.org/abs/2609.15004", "type": "理论", "summary": "我们建立了关于量子通道渐近均分性质（AEP）的两个结果。首先，使用对完全正迹保留图进行平滑来制定的 AEP 通常会失败。其次，子通道平滑的 AEP（完全正迹非增映射）相当于并行量子通道斯坦因引理的强逆，通道曲棍球棒散度的尖锐阈值，以及通道洛伦兹散度的 AEP。反例揭示了通道和子通道平滑之间令人惊讶的分离。尽管状态和经典通道承认我们建立的尖锐的、与维度无关的完成界限，但量子通道的相应单次间隙对于量子位来说已经是无界的。这种分离渐近地持续存在：我们构造具有有限最大相对熵的 qutrit 通道对，其 CPTP 平滑率严格超过正则化通道相对熵。即使子通道近似误差呈指数衰减，通道和子通道平滑之间的渐近差距在整个系列中也是无界的。\n\n为了建立等价性，我们开发了一个统一滤波器，将洛伦兹平滑转换为单个附近的子通道。因此，四种推测的公式共享一个共同的渐近阈值，其对于一般通道对的有效性仍然开放。总之，这些结果将这个阈值问题与精确痕迹保存带来的障碍区分开来。", "authors": [{"name": "Gilad Gour"}], "featured_authors": [{"name": "Gilad Gour"}], "author_count": 1}, {"id": "2609.15040", "category": "quant-ph", "title": "Scaling up multi-mode entanglement generated by mode swapping", "abstract": "Entanglement between two local multi-photon multi-mode systems can be generated by swapping a pair of modes between the two local multi-mode systems. In this presentation, we consider possible strategies for the efficient generation of entanglement between systems with three or more modes. It is shown that the choice of photon number inputs in the local systems adds a new degree of freedom to the non-local interference effects observed in the output photon number statistics.", "url": "https://arxiv.org/abs/2609.15040", "type": "理论", "summary": "两个局部多光子多模系统之间的纠缠可以通过在两个局部多模系统之间交换一对模式来产生。在本次演讲中，我们考虑了在具有三种或更多模式的系统之间有效生成纠缠的可能策略。结果表明，局部系统中光子数输入的选择为输出光子数统计中观察到的非局部干涉效应增加了新的自由度。", "authors": [{"name": "Yuki Kodama"}, {"name": "Holger F. Hofmann"}], "featured_authors": [{"name": "Yuki Kodama"}, {"name": "Holger F. Hofmann"}], "author_count": 2}, {"id": "2609.15099", "category": "quant-ph", "title": "Biorthogonal Time-Dependent Variational Principle for Non-Hermitian Systems", "abstract": "We develop a biorthogonal time-dependent variational principle for real-time dynamics of non-Hermitian quantum many-body systems. Independent left and right matrix-product states obey coupled bivariational tangent-space equations whose cross-Gram matrix defines an oblique projection. A matrix-free scaled Taylor action propagates the resulting non-normal local generators without assembling dense matrices or storing a Krylov basis. We distinguish the fully coupled algorithm, which solves the cross-pairing problem and truncates the two bond bases jointly, from an efficient independently propagated approximation used for large systems. Independent truncation can make the retained left-right pairing nearly singular; overlap drift and the smallest singular value of the bond cross matrix expose this failure, while coupled truncation substantially delays it. Exact benchmarks and convergence tests validate the method. Applied to an interacting long-range non-Hermitian Ising chain, it resolves a biorthogonal dynamical quantum phase transition and shows that a weak imaginary field shifts the leading critical time from $t^{\\ast}|J|=1.84$ to $1.04$.", "url": "https://arxiv.org/abs/2609.15099", "type": "理论+数值", "summary": "我们为非厄米量子多体系统的实时动力学开发了双正交时间相关变分原理。独立的左、右矩阵乘积状态服从耦合的二变分切空间方程，其交叉格拉姆矩阵定义了斜投影。无矩阵缩放泰勒动作可传播所得的非正态局部生成器，而无需组装密集矩阵或存储 Krylov 基。我们将完全耦合算法与用于大型系统的高效独立传播近似算法区分开来，该算法解决交叉配对问题并联合截断两个键基。独立截断可以使保留的左右配对近乎奇异；重叠漂移和键交叉矩阵的最小奇异值暴露了这种失败，而耦合截断则大大延迟了这种失败。精确的基准测试和收敛测试验证了该方法。应用于相互作用的长程非厄米伊辛链，它解决了双正交动态量子相变，并表明弱虚场将领先临界时间从 $t^{\\ast}|J|=1.84$ 移动到 $1.04$。", "authors": [{"name": "Younes Javanmard"}, {"name": "Sina Kazemian"}], "featured_authors": [{"name": "Younes Javanmard"}, {"name": "Sina Kazemian"}], "author_count": 2}, {"id": "2609.15139", "category": "quant-ph", "title": "A train--prune--readout--rewrite workflow for interpretable quantum learning", "abstract": "AI for Science aims not only to predict complex physical systems from data, but also to extract mathematical structure and physically testable representations from learned models. Here, a train--prune--readout--rewrite workflow is developed that separates physical-domain grounding from three increasingly stringent analysis claims: algebraically equivalent readout of a trained predictor, compact teacher-faithful symbolic rewriting on the sampled physical domain, and transformation-based tests of learned internal representations. The workflow is implemented with complex-valued Kolmogorov--Arnold networks, whose explicit edge functions enable post-pruning analytic readout of the retained computation. In analytically controlled single-qubit tasks, rewriting recovered the quadratic structure of purity, whereas von Neumann entropy yielded only a domain-bounded symbolic surrogate; physics-aligned variable grouping preserved symbolic fidelity. For two-qubit entanglement-related tasks, shared learning exposed a common internal representation whose physical content was interrogated directly. Local-unitary transformations rejected a direct invariant-coordinate interpretation, while fixed-decoder transfer showed that the shared activation carries Pauli-correlation information in a transformation-consistent form. Task-related invariant spectral features were subsequently recovered through low-order nonlinear readouts. Separate predictive tests retained high accuracy for three-qubit classification and controlled ten-qubit purity regression with over one million complex inputs. These results establish an evidence-resolved framework for distinguishing physical grounding, readable computation, faithful symbolic compression and transformation-tested physical structure in constrained complex-valued scientific learning.", "url": "https://arxiv.org/abs/2609.15139", "type": "理论+数值", "summary": "科学人工智能不仅旨在从数据中预测复杂的物理系统，而且还从学习模型中提取数学结构和物理可测试的表示。在这里，开发了一个训练-修剪-读出-重写工作流程，将物理域基础与三个日益严格的分析要求分开：经过训练的预测器的代数等效读出、采样物理域上的紧凑的忠实于教师的符号重写以及对学习的内部表示的基于变换的测试。该工作流程是通过复值 Kolmogorov-Arnold 网络实现的，其显式边缘函数可以对保留计算进行剪枝后分析读出。在分析控制的单量子位任务中，重写恢复了纯度的二次结构，而冯·诺依曼熵仅产生了域界符号代理；物理对齐的变量分组保留了符号保真度。对于与两个量子位纠缠相关的任务，共享学习暴露了一个共同的内部表示，其物理内容被直接询问。\n\n局部酉变换拒绝直接的不变坐标解释，而固定解码器传输表明共享激活以变换一致的形式携带泡利相关信息。随后通过低阶非线性读数恢复与任务相关的不变光谱特征。单独的预测测试保留了三量子位分类的高精度，并通过超过一百万个复杂输入控制了十量子位纯度回归。这些结果建立了一个证据解析框架，用于区分受约束的复杂值科学学习中的物理基础、可读计算、忠实的符号压缩和经过转换测试的物理结构。", "authors": [{"name": "Siran Zhang"}, {"name": "Shuming Cheng"}, {"name": "Xiang Li"}, {"name": "Jinyi Liu"}], "featured_authors": [{"name": "Siran Zhang"}, {"name": "Shuming Cheng"}, {"name": "Xiang Li"}, {"name": "Jinyi Liu"}], "author_count": 4}, {"id": "2609.15302", "category": "quant-ph", "title": "Universality from Quadratic Angular-Momentum Operations: Exact Dynamical Lie Algebras and the Role of the Casimir Obstruction", "abstract": "Universality relies on combining operators with different algebraic properties, which depend on the physical structure of the Hilbert space encoding the information. Systems of identical symmetric particles---including bosons and symmetric collections of spin-$1/2$ particles---can be mapped to angular-momentum systems, where rotations supplemented by quadratic, spin-squeezing interactions provide universal control. We revisit universality in this framework and confirm that such linear and quadratic operations provide universal control on every fixed-particle-number subspace. At the abstract level, however, we show that the dynamical Lie algebra generated by all degree-at-most-two elements does not exhaust the full universal enveloping algebra of $\\mathfrak{su}_{\\mathbb{R}}(2)$, contrary to a stronger claim made previously: higher powers of the quadratic Casimir element cannot be generated by commutators and linear combinations. This obstruction does not conflict with fixed-sector universality because, under a fixed irreducible spin-$n/2$ representation, all powers of the Casimir element act as scalar multiples of the identity. We determine the resulting abstract dynamical Lie algebras exactly and show that the central-free and full degree-at-most-two algebras map, respectively, onto $\\mathfrak{su}_{\\mathbb{R}}(n+1)$ and $\\mathfrak{u}_{\\mathbb{R}}(n+1)$, establishing special-unitary and full-unitary universality. We further derive a practical degree-two universality criterion and discuss finite-dimensional SSRC universality.", "url": "https://arxiv.org/abs/2609.15302", "type": "理论", "summary": "普适性依赖于具有不同代数性质的算子的组合，这取决于编码信息的希尔伯特空间的物理结构。相同对称粒子的系统（包括玻色子和自旋 $1/2$ 粒子的对称集合）可以映射到角动量系统，其中由二次自旋挤压相互作用补充的旋转提供了通用控制。我们重新审视该框架中的普遍性，并确认这种线性和二次运算为每个固定粒子数子空间提供通用控制。然而，在抽象层面上，我们表明由所有至多二阶元素生成的动态李代数并没有穷尽 $\\mathfrak{su}_{\\mathbb{R}}(2)$ 的完整通用包络代数，这与之前提出的更强有力的主张相反：二次卡西米尔元素的更高幂不能由交换器和线性组合生成。这种阻碍与固定扇区普遍性并不冲突，因为在固定的不可约自旋$n/2$表示下，卡西米尔元素的所有幂都充当恒等式的标量倍数。\n\n我们准确地确定了所得的抽象动态李代数，并表明无中心和最多二度满度代数分别映射到 $\\mathfrak{su}_{\\mathbb{R}}(n+1)$ 和 $\\mathfrak{u}_{\\mathbb{R}}(n+1)$ 上，建立了特殊酉和全酉普遍性。我们进一步推导了实用的二级普适性标准并讨论了有限维 SSRC 普适性。", "authors": [{"name": "Tim Heib"}, {"name": "Pérola Milman"}], "featured_authors": [{"name": "Tim Heib"}, {"name": "Pérola Milman"}], "author_count": 2}, {"id": "2609.15394", "category": "quant-ph", "title": "Object Detection Using Quantum Transfer Learning", "abstract": "Object detection requires the joint learning of semantic identity and continuous spatial geometry. Existing quantum transfer learning approaches have focused mainly on classification tasks and do not support regression. Here, we introduce a physics informed hybrid classical-quantum architecture for object detection in which a pre-trained MobileNetV2 maps visual features into an eight qubits variationally quantum Hilbert space. The Hilbert space is partitioned into two task specific subspaces for semantic classification and geometric localization. Local quantum expectation values are used to predict continuous bounding box coordinates, while circuit topology regulates the flow of quantum information between the two tasks. We compare linear and circular CNOT topologies and show that periodic boundary conditions suppress bipartite entanglement without degrading detection performance. The circular architecture reaches a bipartite von Neumann entropy of 0.1688 bits and a Meyer-Wallach entanglement measure of 0.0370, while achieving an mAP@0.5 of 0.9448 and an mAP@0.5:0.95 of 0.6558. A thermodynamic formulation further interprets the total learning loss as a variation in Helmholtz free energy. It interprets geometric localization as an effective internal energy contribution and semantic classification as an entropic contribution. These results indicate that high performance in the proposed object detection model does not require maximal entanglement. Instead, efficient learning can emerge through topology controlled information flow, targeted restriction of entanglement, and information renormalization within the Hilbert space.", "url": "https://arxiv.org/abs/2609.15394", "type": "理论+数值", "summary": "对象检测需要语义识别和连续空间几何的联合学习。现有的量子迁移学习方法主要关注分类任务，不支持回归。在这里，我们引入了一种用于对象检测的物理知识混合经典量子架构，其中预先训练的 MobileNetV2 将视觉特征映射到八个量子位变分量子希尔伯特空间。希尔伯特空间被划分为两个特定于任务的子空间，用于语义分类和几何定位。局部量子期望值用于预测连续边界框坐标，而电路拓扑调节两个任务之间的量子信息流。我们比较了线性和圆形 CNOT 拓扑，结果表明周期性边界条件可以抑制二分纠缠，而不会降低检测性能。该圆形架构达到了 0.1688 位的二分冯诺依曼熵和 0.0370 的 Meyer-Wallach 纠缠度量，同时实现了 0.9448 的 mAP@0.5 和 0.6558 的 mAP@0.5:0.95。\n\n热力学公式进一步将总学习损失解释为亥姆霍兹自由能的变化。它将几何定位解释为有效的内能贡献，将语义分类解释为熵贡献。这些结果表明所提出的目标检测模型的高性能不需要最大纠缠。相反，有效的学习可以通过拓扑控制的信息流、有针对性的纠缠限制以及希尔伯特空间内的信息重整化来实现。", "authors": [{"name": "Mohammad Bahrami"}, {"name": "Morteza Rafiee"}, {"name": "Mohsen Norouzi"}], "featured_authors": [{"name": "Mohammad Bahrami"}, {"name": "Morteza Rafiee"}, {"name": "Mohsen Norouzi"}], "author_count": 3}, {"id": "2609.15411", "category": "quant-ph", "title": "Exact quantum circuits for a Heisenberg triangle with Dzyaloshinskii-Moriya interaction", "abstract": "We construct exact quantum circuits for a three-spin Heisenberg triangle with Dzyaloshinskii-Moriya (DM) interaction. A change of basis reduces pure DM evolution with arbitrary couplings to two single-qubit rotations, giving a circuit with at most 8 CNOT gates. When $J$ and $D$ are each the same on all bonds, one fixed basis gives a circuit with at most 10 CNOT gates for any real $J,D,t$. Local spin rotations extend the construction to a family with unequal DM couplings and nonzero exchange, requiring at most 14 CNOT gates. All circuits act on the full Hilbert space. An alternative pure DM implementation uses five two-qubit DM gates: analytically retuning the angles of one symmetric Strang step makes it exact. A 12-spin kagome example illustrates the use of these exact local blocks in lattice simulation.", "url": "https://arxiv.org/abs/2609.15411", "type": "数值", "summary": "我们为具有 Dzyaloshinskii-Moriya (DM) 相互作用的三自旋海森堡三角形构建了精确的量子电路。基础的改变将任意耦合的纯 DM 演化减少到两个单量子位旋转，从而给出最多具有 8 个 CNOT 门的电路。当所有债券上的 $J$ 和 $D$ 都相同时，对于任何真实的 $J,D,t$，一个固定基础给出的电路最多有 10 个 CNOT 门。局部自旋旋转将结构扩展到具有不等 DM 耦合和非零交换的系列，最多需要 14 个 CNOT 门。所有电路都作用于完整的希尔伯特空间。另一种纯 DM 实现使用五个两量子位 DM 门：通过分析重新调整一个对称 Strang 步骤的角度使其精确。 12 个自旋 kagome 示例说明了这些精确局部块在晶格模拟中的使用。", "authors": [{"name": "Andrey Zhukov"}], "featured_authors": [{"name": "Andrey Zhukov"}], "author_count": 1}, {"id": "2609.15477", "category": "quant-ph", "title": "Engineering dissipation and control pulses for high-fidelity fault-tolerance quantum computing", "abstract": "Cat-state qubits, a prominent class of bosonic encodings, offer a promising pathway toward hardware-efficient fault-tolerant quantum computing. In this manuscript, we propose an optimally robust control protocol for the cat-state qubits which are stabilized by engineering two-photon dissipation. By deriving an effective two-level description in the cat-state subspace and applying shortcut-to-adiabaticity via inverse engineering, we design a robust protocol to achieve fast and high-fidelity state transfer in the cat-state qubit. We analyze the sensitivity to systematic control errors and identify an optimal robustness condition that strongly suppresses errors induced by imperfections in the driving fields. Furthermore, we show that dissipative confinement efficiently suppresses leakage out of the cat-state subspace caused by the pure dephasing, highlighting an intrinsic advantage of dissipative-cat qubits. This work establishes a robust and leakage-suppressing framework for high-fidelity bosonic qubit control, offering a promising route toward scalable fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2609.15477", "type": "理论", "summary": "猫态量子位是一类著名的玻色子编码，为实现硬件高效的容错量子计算提供了一条有前途的途径。在这份手稿中，我们提出了一种针对猫态量子位的最佳鲁棒控制协议，该协议通过工程双光子耗散来稳定。通过在猫状态子空间中导出有效的两级描述并通过逆向工程应用绝热捷径，我们设计了一个鲁棒的协议来实现猫状态量子位中的快速、高保真状态转移。我们分析了对系统控制误差的敏感性，并确定了一个最佳的鲁棒性条件，该条件可以强烈抑制由驱动场缺陷引起的误差。此外，我们表明，耗散限制有效地抑制了由纯相移引起的猫状态子空间的泄漏，突出了耗散猫量子位的内在优势。这项工作为高保真玻色量子位控制建立了一个强大的泄漏抑制框架，为可扩展的容错量子计算提供了一条有希望的途径。", "authors": [{"name": "Shao-Wei Xu"}, {"name": "Zhe-Yuan Zhang"}, {"name": "Yi-Tong Shi"}, {"name": "Ye-Hong Chen"}, {"name": "Yan Xia"}], "featured_authors": [{"name": "Shao-Wei Xu"}, {"name": "Zhe-Yuan Zhang"}, {"name": "Yi-Tong Shi"}, {"name": "Ye-Hong Chen"}, {"name": "Yan Xia"}], "author_count": 5}, {"id": "2609.15632", "category": "quant-ph", "title": "A Nonrecursive Lindblad Quantization of Dissipative Polynomial Dynamics", "abstract": "We present a direct and nonrecursive construction that maps an arbitrary planar polynomial dissipative flow $\\dot{\\alpha}=h(\\alpha,\\alpha^*)$ to an open quantum system in Gorini--Kossakowski--Sudarshan--Lindblad form. Given the homogeneous components of the classical drift, the corresponding Hamiltonian and collapse-operator blocks are obtained algebraically and independently at each degree. No recursive cancellation of lower-order terms is required: in the large-amplitude limit $|\\alpha|\\sim S\\to\\infty$, ordering-generated lower-degree terms are parametrically suppressed, while mean-field closure yields the prescribed leading $O(S)$ drift for semiclassically localized states. This provides a simple and systematic route from dissipative classical dynamics to explicit open-quantum-system realizations, without claiming a unique microscopic quantization of the classical flow. We demonstrate the construction for stable fixed points, a Hopf bifurcation, and a bistable-ring flow. The corresponding Liouvillian spectra recover the classical relaxation exponents, the radial Floquet exponent and neutral phase direction of a limit cycle, and the separation between local relaxation and inter-ring switching in the bistable case. These examples show that the construction can be used not only to analyze a given quantum model, but also to design open quantum systems with prescribed classical dynamical structures in the semiclassical limit.", "url": "https://arxiv.org/abs/2609.15632", "type": "理论", "summary": "我们提出了一种直接且非递归的构造，将任意平面多项式耗散流 $\\dot{\\alpha}=h(\\alpha,\\alpha^*)$ 映射到 Gorini--Kossakowski--Sudarshan--Lindblad 形式的开放量子系统。给定经典漂移的齐次分量，相应的哈密顿算子和塌缩算子块在每个度上以代数方式独立地获得。不需要递归消除低阶项：在大振幅限制 $|\\alpha|\\sim S\\to\\infty$ 中，排序生成的低阶项被参数抑制，而平均场闭包产生半经典定域态的规定前导 $O(S)$ 漂移。这提供了从耗散经典动力学到显式开放量子系统实现的简单而系统的途径，而不需要对经典流进行独特的微观量子化。我们演示了稳定不动点、Hopf 分岔和双稳态环流的构造。\n\n相应的刘维尔谱恢复了极限环的经典弛豫指数、径向Floquet指数和中性相位方向，以及双稳态情况下局部弛豫和环间切换之间的分离。这些例子表明，该结构不仅可以用于分析给定的量子模型，还可以在半经典极限下设计具有规定经典动力学结构的开放量子系统。", "authors": [{"name": "Tingfei Li"}], "featured_aut
