的有效质量的改变。\n\n因此，该模型提供了一个简单的设置，用于比较分频器 BCS 和 BEC 侧的交流磁对断裂。", "authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "featured_authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "author_count": 2}, {"id": "2609.14623", "category": "cond-mat", "title": "Thermodynamic Realizability of Hidden Markov Processes: Attainment, Observable Certificates, and the Price of Architecture", "abstract": "What is the least dissipative finite Markov machine that can reproduce a given stochastic process exactly? A basic compactness worry is that a minimizing sequence might lower its cost only by sending microscopic rates to infinity, never converging to an actual finite-rate machine. We prove that this escape is impossible at fixed hidden dimension. States of vanishing stationary occupation can be traced out, and infinitely fast conductance classes can be contracted, without increasing entropy production or losing the limiting observed path law. Hence the exact-law cost $V_n(P)$ is attained and lower semicontinuous at every fixed state count, with no cap on rates or mean activity. Adding a positive price $\\kappa$ per used hidden state yields an attained optimum over all finite dimensions and an exact representation by globally calibrated lower certificates built from finitely many observable path expectations. The lower envelope $G_\\kappa(P)=\\min_n[V_n(P)+\\kappa n]$ defines an architecture phase diagram whose slope is the selected state count; divergence of that count as $\\kappa\\downarrow0$ is equivalent to failure of any finite machine to attain the all-dimension infimum $V_\\infty(P)$. For the two-block renewal family $P_q$, we derive complete finite-dimensional phase-type cancellation equations, give an explicit four-phase counterexample to a tempting restricted parameterization, and prove strictly positive minimal dissipation at every feasible finite dimension for all $0<q<1$. These results reduce the remaining problem to one sharp question: can growing hidden architecture drive the dissipation of $P_q$ to its all-dimension infimum without any finite optimizer, and in the strongest scenario, to zero?", "url": "https://arxiv.org/abs/2609.14623", "type": "理论+数值", "summary": "能够精确再现给定随机过程的最小耗散有限马尔可夫机是什么？一个基本的紧凑性担忧是，最小化序列只能通过将微观速率发送到无穷大来降低其成本，而永远不会收敛到实际的有限速率机器。我们证明这种逃逸在固定的隐藏维度上是不可能的。可以追踪出静止占据消失的状态，并且可以收缩无限快的电导等级，而不会增加熵产生或失去限制的观察到的路径定律。因此，在每个固定状态计数下，获得了精确律成本 $V_n(P)$ 并具有较低的半连续性，并且对速率或平均活动没有上限。为每个使用的隐藏状态添加正价格 $\\kappa$ 会产生在所有有限维度上获得的最佳值，并通过根据有限多个可观察路径期望构建的全局校准较低证书来精确表示。\n\n下包络 $G_\\kappa(P)=\\min_n[V_n(P)+\\kappa n]$ 定义了一个架构相图，其斜率是所选状态计数； $\\kappa\\downarrow0$ 计数的散度相当于任何有限机器无法达到全维下确界 $V_\\infty(P)$。对于两块更新族 $P_q$，我们推导了完整的有限维相位型抵消方程，为诱人的受限参数化给出了明确的四相反例，并证明了所有 $0<q<1$ 在每个可行有限维度上的严格正最小耗散。这些结果将剩下的问题简化为一个尖锐的问题：在没有任何有限优化器的情况下，不断增长的隐藏架构是否可以将 $P_q$ 的耗散驱动到其全维下确界，并且在最强大的情况下驱动到零？", "authors": [{"name": "Murad Aznagulov"}], "featured_authors": [{"name": "Murad Aznagulov"}], "author_count": 1}, {"id": "2609.14665", "category": "cond-mat", "title": "Thermodynamic Geometry of an Ideal Quon Gas", "abstract": "We investigate the equilibrium thermodynamics and thermodynamic Riemannian geometry of an ideal quon gas within the grand canonical ensemble. By incorporating the algebraic deformation parameter $q$, the system generalizes standard bosonic behavior while recovering the conventional ideal Bose gas in the undeformed limit. A rigorous examination of the ground-state occupation reveals two disconnected mathematical domains of the fugacity. By enforcing thermodynamic continuity, single-valuedness, and consistency with the high-temperature classical limit, we exclude the second mathematical branch and establish the lower interval as the unique physically admissible state space. This identifies the deformation parameter as an intrinsic, generalized Bose--Einstein condensation threshold. Employing the Fisher-Rao metric on the equilibrium parameter manifold, we probe the thermodynamic scalar curvature across all temperature regimes. The scalar curvature remains strictly positive throughout the physical domain, confirming that the deformation preserves an effectively attractive statistical interaction without inducing fermionic tendencies. Near the critical condensation threshold, the curvature increases sharply and exhibits a definitive divergence, providing an unambiguous geometric signature of macroscopic coherence and critical fluctuations. Below the transition temperature, the pinning of fugacity eliminates a fluctuating degree of freedom, collapsing the scalar curvature to zero.", "url": "https://arxiv.org/abs/2609.14665", "type": "理论", "summary": "我们研究了大正则系综中理想量子气体的平衡热力学和热力学黎曼几何。通过结合代数变形参数 $q$，系统推广了标准玻色子行为，同时恢复了未变形极限下的传统理想玻色气体。对基态占据的严格检查揭示了逸度的两个互不相关的数学域。通过加强热力学连续性、单值性以及与高温经典极限的一致性，我们排除了第二个数学分支，并将较低的区间建立为唯一的物理允许状态空间。这将变形参数识别为固有的、广义的玻色-爱因斯坦凝聚阈值。在平衡参数流形上采用 Fisher-Rao 度量，我们探测了所有温度范围内的热力学标量曲率。标量曲率在整个物理域中保持严格的正值，证实变形保留了有效有吸引力的统计相互作用，而不会诱发费米子倾向。\n\n在临界凝结阈值附近，曲率急剧增加并表现出明确的发散，提供宏观相干性和临界波动的明确几何特征。在转变温度以下，逸度的钉扎消除了波动的自由度，将标量曲率压缩为零。", "authors": [{"name": "Leila Yousefzadeh"}, {"name": "Hosein Mohammadzadeh"}, {"name": "Habib Esmaili"}, {"name": "Zahra Ebadi"}, {"name": "Morteza Nattagh Najafi"}], "featured_authors": [{"name": "Leila Yousefzadeh"}, {"name": "Hosein Mohammadzadeh"}, {"name": "Habib Esmaili"}, {"name": "Zahra Ebadi"}, {"name": "Morteza Nattagh Najafi"}], "author_count": 5}, {"id": "2609.14668", "category": "cond-mat", "title": "Finite-temperature quantum Monte Carlo study of Dirac quantum criticality: Algorithmic advances and comprehensive analysis", "abstract": "We present a systematic study of the quantum phase transition from a Dirac semimetal to an antiferromagnetic Mott insulator in the honeycomb-lattice Hubbard model, using finite-temperature auxiliary-field quantum Monte Carlo (AFQMC) simulations. Given the dynamical critical exponent $z=1$ at criticality, we scale the inverse temperature $\\beta$ with the linear system size $L$, i.e., $\\beta t=L$ (with $t$ as the hopping amplitude), to approach the thermodynamic and zero-temperature limits simultaneously. On the algorithmic front, we generalize the fast Fourier transform in path propagation to multi-sublattice systems and employ the delayed update technique in configuration updates to accelerate the AFQMC simulations. These advances enable us to access unprecedented system sizes of up to $3528$ sites (with $L=42$ and $\\beta t = 42$). We additionally use twist-averaged boundary conditions to reduce the finite-size effects in computed observables. On the physical side, we determine the Dirac quantum criticality via finite-size scaling analysis of the spin correlations and off-diagonal single-particle Green's function, and locate the critical point at $U_c/t=3.731(4)$ with the critical exponents $\\nu=1.097(7)$, $\\eta_{\\phi}=0.72(2)$ and $\\eta_{\\psi}=0.155(6)$. We further corroborate the critical point by examining several relevant quantities, including the quasiparticle weight, Fermi-liquid parameter, charge compressibility, $U$-derivative of double occupancy, and fidelity susceptibility. Our work establishes an independent benchmark for the chiral Heisenberg Gross-Neveu-Yukawa criticality in the honeycomb Hubbard model, offering a complementary perspective to previous ground-state simulations.", "url": "https://arxiv.org/abs/2609.14668", "type": "理论+数值", "summary": "我们使用有限温度辅助场量子蒙特卡罗 (AFQMC) 模拟，对蜂窝晶格哈伯德模型中从狄拉克半金属到反铁磁莫特绝缘体的量子相变进行了系统研究。给定临界点的动态临界指数$z=1$，我们将逆温度$\\beta$与线性系统尺寸$L$进行缩放，即$\\beta t=L$（以$t$作为跳跃幅度），以同时接近热力学和零温度极限。在算法方面，我们将路径传播中的快速傅立叶变换推广到多子晶格系统，并在配置更新中采用延迟更新技术来加速 AFQMC 模拟。这些进步使我们能够访问前所未有的系统规模，高达 3528$ 站点（其中 $L=42$ 且 $\\beta t = 42$）。我们还使用扭曲平均边界条件来减少计算可观测量中的有限尺寸效应。\n\n在物理方面，我们通过自旋相关性和非对角单粒子格林函数的有限尺寸尺度分析确定了狄拉克量子临界性，并将临界点定位在$U_c/t=3.731(4)$，临界指数为$\\nu=1.097(7)$、$\\eta_{\\phi}=0.72(2)$和$\\eta_{\\psi}=0.155(6)$。我们通过检查几个相关量进一步证实了临界点，包括准粒子重量、费米液体参数、电荷压缩性、双占用的 $U$ 导数和保真磁化率。我们的工作为蜂窝哈伯德模型中的手性海森堡 Gross-Neveu-Yukawa 临界性建立了独立的基准，为之前的基态模拟提供了补充视角。", "authors": [{"name": "Hou-Min Du"}, {"name": "Qian Sun"}, {"name": "Yuan-Yao He"}], "featured_authors": [{"name": "Hou-Min Du"}, {"name": "Qian Sun"}, {"name": "Yuan-Yao He"}], "author_count": 3}, {"id": "2609.14673", "category": "cond-mat", "title": "Misfit-dislocation hierarchy governs sliding of asymmetric non-CSL grain boundaries", "abstract": "Grain boundary (GB) deformation significantly influences the mechanical response of polycrystalline materials, yet most atomistic studies have focused on coincidence site lattice (CSL) boundaries. Motivated by in situ atomic-resolution observations, we investigate step-free sliding along asymmetric non-CSL tilt GBs in face-centered cubic (FCC) metals using atomistic modeling. In these incommensurate GBs, a dense array of primary misfit dislocations accommodates the local interfacial mismatch, whereas a more widely spaced array of secondary GB misfit dislocations accommodates the residual mismatch. Uniform sliding calculations reveal two distinct quantities: the minimum GB structural periodicity {\\lambda}, defined by the repeating arrangement of primary GB misfit dislocations, and the slip vector b, determined by the minimum displacement-shift-complete translation that restores an equivalent GB structure. Nonuniform sliding proceeds through the glide of secondary GB misfit dislocations, which carry b and transform successive boundary segments between crystallographically equivalent translation states. These secondary misfit dislocations dissociate into partials, each carrying a partial Burgers vector b_p and connecting intermediate interfacial states. The characteristic spacing between secondary misfit partials defines a longer periodicity {\\Lambda}. Below the athermal stress, each partial glides through a two-step thermally activated kink-pair mechanism, advances the partial by one structural period l. These results establish a unified crystallographic and dislocation-based framework for understanding stress-driven sliding in structurally complex asymmetric GBs.", "url": "https://arxiv.org/abs/2609.14673", "type": "理论+数值", "summary": "晶界（GB）变形显着影响多晶材料的机械响应，但大多数原子学研究都集中在重合位点晶格（CSL）边界上。在原位原子分辨率观测的推动下，我们使用原子建模研究了面心立方 (FCC) 金属中沿不对称非 CSL 倾斜 GB 的无级滑动。在这些不相称的晶界中，密集的初级失配位错阵列容纳局部界面失配，而间隔更宽的次生晶界失配位错阵列容纳残余失配。均匀滑动计算揭示了两个不同的量：最小晶界结构周期{\\lambda}，由初级晶界失配位错的重复排列定义，以及滑移矢量b，由恢复等效晶界结构的最小位移-移位-完全平移确定。非均匀滑动通过次生晶界失配位错的滑动进行，该位错携带 b 并在晶体学等效平移状态之间变换连续的边界段。\n\n这些次级失配位错解离成部分位错，每个位错携带部分伯格斯矢量 b_p 并连接中间界面状态。次要失配部分之间的特征间距定义了较长的周期{\\Lambda}。在非热应力之下，每个部分通过两步热激活扭结对机制滑动，使部分提前一个结构周期l。这些结果建立了一个统一的晶体学和基于位错的框架，用于理解结构复杂的不对称晶界中的应力驱动滑动。", "authors": [{"name": "Kunqing Ding"}, {"name": "Yazhuo Liu"}, {"name": "Yin Zhang"}, {"name": "Lihua Wang"}, {"name": "Xiaodong Han"}, {"name": "Ting Zhu"}], "featured_authors": [{"name": "Kunqing Ding"}, {"name": "Yazhuo Liu"}, {"name": "Yin Zhang"}, {"name": "Lihua Wang"}, {"name": "Xiaodong Han"}, {"name": "Ting Zhu"}], "author_count": 6}, {"id": "2609.14683", "category": "cond-mat", "title": "Persistent nonlinear Hall effect driven by parallel field across a topological phase transition and intraband sign-reversing integer quantum Hall effect", "abstract": "We investigate the linear and nonlinear Hall effects in a two-dimensional Rashba spin-orbit coupled nodal ring electronic system. We consider both the cases of linear Hall effect, the Berry curvature induced anomalous Hall and the perpendicular magnetic field-induced integer quantum Hall effect. We observe that the system exhibits a topological gap along the boundary of the nodal ring that strongly depends on the radius of the nodal ring and the strength of the Rashba spin-orbit interaction, resulting in the quantum anomalous Hall effect. Subsequently, we include a perpendicular uniform magnetic field and obtain the exact Landau levels that exhibit sign reversal in the slope with magnetic field around the ring boundary. This causes a sign reversal in the quantum Hall conductivity in the same band by tuning the magnetic field. Most importantly, we also show that when the magnetic field is strictly parallel to the system, it can induce an anisotropy to the Berry curvature that leads to the emergence of the nonlinear Hall effect. Additionally, tuning the parallel field can close and reopen the topological gap, resulting in the reverse topological phase transition from the topological Chern insulator to a trivial insulator. The nonlinear Hall effect remains persistent in both phases, but its dependence on the chemical potential exhibits distinct signatures. Noticeably, the nonlinear Hall response exhibits a sign-changing peak structure in Chern insulating phase whereas it displays a single-sign response in trivial insulating phase. These distinct signatures suggest that nonlinear Hall can serve as a probe to study such a topological phase transition.", "url": "https://arxiv.org/abs/2609.14683", "type": "理论", "summary": "我们研究了二维 Rashba 自旋轨道耦合节环电子系统中的线性和非线性霍尔效应。我们考虑线性霍尔效应、贝里曲率引起的反常霍尔效应和垂直磁场引起的整数量子霍尔效应这两种情况。我们观察到，系统沿节环边界呈现出拓扑间隙，该间隙强烈依赖于节环半径和 Rashba 自旋轨道相互作用的强度，从而产生量子反常霍尔效应。随后，我们加入垂直均匀磁场，并获得精确的朗道能级，该朗道能级在环边界周围的磁场的斜率中表现出符号反转。通过调节磁场，这会导致同一频带内量子霍尔电导率的符号反转。最重要的是，我们还表明，当磁场严格平行于系统时，它会引起贝里曲率的各向异性，从而导致非线性霍尔效应的出现。\n\n此外，调整平行场可以关闭并重新打开拓扑间隙，从而导致从拓扑陈绝缘体到平凡绝缘体的反向拓扑相变。非线性霍尔效应在两个相中仍然持续存在，但其对化学势的依赖性表现出不同的特征。值得注意的是，非线性霍尔响应在陈绝缘相中表现出符号变化的峰值结构，而在平凡绝缘相中表现出单符号响应。这些独特的特征表明非线性霍尔可以作为研究这种拓扑相变的探针。", "authors": [{"name": "Suheel Ahmad Malik"}, {"name": "M. A. H. Ahsan"}, {"name": "SK Firoz Islam"}], "featured_authors": [{"name": "Suheel Ahmad Malik"}, {"name": "M. A. H. Ahsan"}, {"name": "SK Firoz Islam"}], "author_count": 3}, {"id": "2609.14731", "category": "cond-mat", "title": "Colossal magnetostriction effect in rare-earth orthoferrites", "abstract": "Within the entire gamut of magnetostrictive, piezomagnetic, and ferromagnetic shape memory alloy systems, the striction effect is found to vary from a few tens of parts per million to a few percent. Here, we report the observation of an unprecedentedly large magnetic-field-induced lattice strain along the $c$ axis (more than 60-100% at 90 kOe field) in single crystals of orthorhombic $R$FeO$_3$ ($R$ = Dy, Ho) below their spin-reorientation transition temperature $T_{SR}$. However, the striction effect is two orders of magnitude smaller along the $a$ and $b$ axes. Like magnetostriction, the magnetodielectric effect is highly anisotropic and very large along the $c$ axis. Such gigantic striction and dielectric effects along the $c$ axis arise as a result of a magnetic-field-induced first-order structural phase transition which possibly stems from large spin-orbit coupling (and, thereby, enormous magnetocrystalline anisotropy). The observed colossal striction in rare-earth orthoferrites could open new opportunities for applications requiring large, reversible magnetic-field-induced strain.", "url": "https://arxiv.org/abs/2609.14731", "type": "理论", "summary": "在磁致伸缩、压磁和铁磁形状记忆合金系统的整个范围内，人们发现严格效应从百万分之几十到百分之几不等。在这里，我们报告了在低于其自旋重定向转变温度 $T_{SR}$ 的斜方 $R$FeO$_3$ ($R$ = Dy, Ho) 单晶中沿 $c$ 轴观察到前所未有的大磁场引起的晶格应变（在 90 kOe 场下超过 60-100%）。然而，沿 $a$ 和 $b$ 轴的限制效应小两个数量级。与磁致伸缩一样，磁介电效应具有高度各向异性，并且沿 $c$ 轴非常大。沿着$c$轴的这种巨大的严格和介电效应是由磁场引起的一阶结构相变产生的，这可能源于大的自旋轨道耦合（以及由此产生的巨大的磁晶各向异性）。在稀土正铁氧体中观察到的巨大限制可能为需要大的可逆磁场感应应变的应用带来新的机会。", "authors": [{"name": "Moumita Das"}, {"name": "Arup Ghosh"}, {"name": "Moumita Nandi"}, {"name": "Arumugam Thamizhavel"}, {"name": "Dipten Bhattacharya"}, {"name": "Prabhat Mandal"}], "featured_authors": [{"name": "Moumita Das"}, {"name": "Arup Ghosh"}, {"name": "Moumita Nandi"}, {"name": "Arumugam Thamizhavel"}, {"name": "Dipten Bhattacharya"}, {"name": "Prabhat Mandal"}], "author_count": 6}, {"id": "2609.14786", "category": "cond-mat", "title": "Fast dynamical control of quantum droplets via Feshbach resonances", "abstract": "We propose a variational shortcut-to-adiabaticity scheme for the fast dynamical control of one-dimensional quantum droplets in ultracold Bose-Bose mixtures. The control is implemented through time-dependent mean-field (MF) and beyond-mean-field (BMF) nonlinearities, which can be adjusted by tuning intra- and interspecies scattering lengths near Feshbach resonances. Using a bright-droplet variational ansatz, together with inverse engineering, we derive time-dependent interaction protocols that connect prescribed initial and target self-bound states while suppressing residual excitations. We analyze three representative settings: simultaneous control of the MF and BMF terms, control with fixed BMF nonlinearity and time-dependent MF interaction, and control with fixed MF nonlinearity and time-dependent BMF interaction. For the constrained cases, additional variational degrees of freedom are introduced to optimize the protocols while respecting the imposed restrictions. Direct numerical simulations of the extended Gross-Pitaevskii equation confirm final fidelities exceeding $0.99$ on short time scales, and show that the optimised protocols are robust against finite calibration errors of the nonlinear control strength. Our results provide a route toward fast state-to-state manipulation of self-bound quantum fluids and may be useful for controlled matter-wave engineering in ultracold mixtures.", "url": "https://arxiv.org/abs/2609.14786", "type": "理论+数值", "summary": "我们提出了一种变分绝热捷径方案，用于超冷玻色-玻色混合物中一维量子液滴的快速动态控制。该控制是通过时间相关的平均场 (MF) 和超平均场 (BMF) 非线性来实现的，可以通过调整费什巴赫共振附近的种内和种间散射长度来调整。使用明亮的液滴变分模拟，结合逆向工程，我们推导出依赖于时间的相互作用协议，该协议连接规定的初始和目标自束缚态，同时抑制残余激发。我们分析了三种代表性设置：MF 和 BMF 项的同时控制、固定 BMF 非线性和时间相关 MF 相互作用的控制、以及固定 MF 非线性和时间相关 BMF 相互作用的控制。对于受限情况，引入额外的变分自由度来优化协议，同时尊重施加的限制。\n\n扩展 Gross-Pitaevskii 方程的直接数值模拟证实了短时间尺度上的最终保真度超过 0.99 美元，并表明优化的协议对于非线性控制强度的有限校准误差具有鲁棒性。我们的结果为自束缚量子流体的快速状态到状态操纵提供了一条途径，并且可能对超冷混合物中的受控物质波工程有用。", "authors": [{"name": "Jing Li"}, {"name": "Thomas Fogarty"}, {"name": "Thomas Busch"}, {"name": "Andreas Ruschhaupt"}], "featured_authors": [{"name": "Jing Li"}, {"name": "Thomas Fogarty"}, {"name": "Thomas Busch"}, {"name": "Andreas Ruschhaupt"}], "author_count": 4}, {"id": "2609.14846", "category": "cond-mat", "title": "Prescreening Point Defects in Semiconductors With Machine Learning", "abstract": "High-throughput calculations using density-functional theory (DFT) are commonly used to explore point defects for applications in power electronics and quantum technologies. There is currently a major shift away from these traditional simulation techniques towards machine learning (ML) methods. We explore a class of physics-guided ML models for predicting defect formation energies and zero-phonon lines (ZPL) to identify point defects for quantum applications. The models are specifically targeted for use in a prescreening step for accelerated high-throughput workflows, and are therefore designed to avoid the costly relaxation step typically present with ML interatomic potentials (MLIPs). We compare performance for single and double point defect systems in 4H-SiC with ridge, kernel ridge, and multilayer perceptron (MLP) models using three different descriptors representing the defect systems. For vacancies and substitutions, the optimized models give mean absolute errors (MAEs) of 0.437 eV for the formation energy and 0.202 eV for ZPLs, which is just above the level at which such predictions can be useful even beyond the targeted prescreening, i.e., in some applications they may completely replace the need for costly DFT calculations. For interstitials the MAEs are larger, 1.101 eV for the formation energy and 0.230 eV for the ZPL, which, while still useful for prescreening, will not generally be useful for more detailed characterization. Hence, while the results may be further improved by model design and optimization, the models presented in this work are already useful for prescreening in high-throughput characterization of point defects.", "url": "https://arxiv.org/abs/2609.14846", "type": "理论+数值", "summary": "使用密度泛函理论 (DFT) 的高通量计算通常用于探索电力电子和量子技术应用中的点缺陷。目前，这些传统模拟技术正在向机器学习 (ML) 方法发生重大转变。我们探索了一类物理引导的机器学习模型，用于预测缺陷形成能量和零声子线 (ZPL)，以识别量子应用的点缺陷。这些模型专门用于加速高通量工作流程的预筛选步骤，因此旨在避免 ML 原子间势 (MLIP) 中通常存在的昂贵的弛豫步骤。我们使用代表缺陷系统的三种不同描述符，比较了 4H-SiC 中单点和双点缺陷系统与脊、核脊和多层感知器 (MLP) 模型的性能。\n\n对于空位和取代，优化模型给出的形成能平均绝对误差 (MAE) 为 0.437 eV，ZPL 为 0.202 eV，这略高于此类预测甚至超出目标预筛选的有用水平，即，在某些应用中，它们可能完全取代昂贵的 DFT 计算的需要。对于间隙原子，MAE 较大，形成能为 1.101 eV，ZPL 为 0.230 eV，虽然对于预筛选仍然有用，但通常对于更详细的表征没有用处。因此，虽然结果可以通过模型设计和优化进一步改进，但本工作中提出的模型已经可用于点缺陷高通量表征的预筛选。", "authors": [{"name": "Paul Karlsson"}, {"name": "Joel Davidsson"}, {"name": "Rickard Armiento"}], "featured_authors": [{"name": "Paul Karlsson"}, {"name": "Joel Davidsson"}, {"name": "Rickard Armiento"}], "author_count": 3}, {"id": "2609.14906", "category": "cond-mat", "title": "Neural-Network Solutions to Real-Space Charge Density and Generalization", "abstract": "The Hohenberg-Kohn theorem establishes that, in principle, the ground state (GS) charge density contains all GS information of a many-electron system, such that all GS observables can be expressed as functionals of the GS charge density. Conventional Kohn-Sham density functional theory requires iterative solution of the self-consistent-field equations at substantial computational cost, motivating the development of deep learning surrogates for electronic structure calculations and, in turn, accelerating computer-aided materials design. Here, we propose \\textbf{AIDEN}, an \\underline{A}tomic-\\underline{I}nteraction \\underline{D}ensity \\underline{E}quivariant \\underline{N}etwork for solving real-space charge density. AIDEN separates the element-dependent one-center density from environment-induced density redistribution and represents the latter through complementary atom- and edge-centered tensor correlations. A continuous low-rank Gaussian decoder then reconstructs the density at arbitrary spatial coordinates while reusing atomic encodings independently of the evaluation grid. AIDEN achieves state-of-the-art accuracy on periodic crystal benchmarks while remaining competitive for molecular systems, and further demonstrates zero-shot transferability across several structurally distinct out-of-distribution case studies. Furthermore, AIDEN provides substantially faster inference than both baseline models and full SCF calculations, enabling efficient charge density reconstruction for large-scale electronic structure calculations.", "url": "https://arxiv.org/abs/2609.14906", "type": "理论+数值", "summary": "Hohenberg-Kohn 定理规定，原则上，基态 (GS) 电荷密度包含多电子系统的所有 GS 信息，因此所有 GS 可观测量都可以表示为 GS 电荷密度的函数。传统的 Kohn-Sham 密度泛函理论需要以大量计算成本迭代求解自洽场方程，这推动了电子结构计算深度学习替代方法的开发，进而加速了计算机辅助材料设计。在这里，我们提出 \\textbf{AIDEN}，一个 \\underline{A}tomic-\\underline{I}interaction \\underline{D}ensity \\underline{E}quivariant \\underline{N}网络来求解真实空间电荷密度。 AIDEN 将元素相关的单中心密度与环境引起的密度重新分布分开，并通过互补的原子和边缘中心张量相关性来表示后者。然后，连续低秩高斯解码器重建任意空间坐标处的密度，同时独立于评估网格重新使用原子编码。\n\nAIDEN 在周期性晶体基准上实现了最先进的精度，同时在分子系统方面保持竞争力，并进一步证明了在几个结构不同的分布外案例研究中的零样本可转移性。此外，AIDEN 提供比基线模型和完整 SCF 计算快得多的推理速度，从而实现大规模电子结构计算的高效电荷密度重建。", "authors": [{"name": "Yuxuan Zeng"}, {"name": "Taoyuze Lv"}, {"name": "Zhicheng Zhong"}], "featured_authors": [{"name": "Yuxuan Zeng"}, {"name": "Taoyuze Lv"}, {"name": "Zhicheng Zhong"}], "author_count": 3}, {"id": "2609.14925", "category": "cond-mat", "title": "Machine Learning Guided CALPHAD Design of Ru-Stabilized BCC B2 Refractory Alloys", "abstract": "Refractory alloys with a ductile body-centered-cubic (BCC) matrix strengthened by ordered B2 precipitates offer a high-temperature analogue to the gamma/gamma-prime architecture of Ni-based superalloys. Ruthenium is particularly attractive as a B2 stabilizer because RuHf, RuZr, and RuTi can retain ordered phases well above 1300 C. In this work, equilibrium CALPHAD calculations were coupled with random-forest-guided active learning to explore a ten-element Nb-based, Ru-bearing composition space containing Nb, Ta, Mo, V, Ru, Ti, Zr, Hf, Al, and Y at 1 at.% resolution. Across 500 CALPHAD-evaluated alloys, the calculations reproduced the principal trends reported for the Ru-B2 design space. RuHf and RuZr remained stable to the solidus, RuTi commonly exhibited a solutionizing window, and Al-containing alloys preferentially formed competing sigma and A15 phases. The upper bound of the BCC+B2 field increased from a median of approximately 1570 C at 5 at.% Ru to approximately 1980 C near 9-10 at.% Ru. Among the group-IV additions, Hf, Zr, and Ti produced progressively lower two-phase stability. Re-screening using physically motivated criteria identified 100 alloys satisfying requirements for high-temperature BCC+B2 stability, absence of liquid, phase purity, and appropriate secondary-phase fraction, including 19 Ru-lean compositions and two independently reported HfRu-B2 alloys. The results establish practical compositional design rules for Ru-stabilized dual-phase refractory alloys and identify phase-specific BCC/B2 lattice misfit as a key target for future design cycles.", "url": "https://arxiv.org/abs/2609.14925", "type": "理论+数值", "summary": "具有延展性体心立方 (BCC) 基体并通过有序 B2 沉淀物强化的难熔合金提供了类似于镍基高温合金的伽马/伽马素结构的高温模拟。钌作为 B2 稳定剂特别有吸引力，因为 RuHf、RuZr 和 RuTi 可以在远高于 1300 C 的温度下保留有序相。在这项工作中，平衡 CALPHAD 计算与随机森林引导的主动学习相结合，以 1 at.% 分辨率探索包含 Nb、Ta、Mo、V、Ru、Ti、Zr、Hf、Al 和 Y 的十元素 Nb 基、含 Ru 成分空间。在 500 种 CALPHAD 评估的合金中，计算再现了 Ru-B2 设计空间报告的主要趋势。 RuHf 和 RuZr 对固相线保持稳定，RuTi 通常表现出固溶窗口，含 Al 合金优先形成竞争的 σ 相和 A15 相。 BCC+B2 场的上限从 5 at.% Ru 时的中值约 1570°C 增加到接近 9-10 at.% Ru 时的约 1980°C。在 IV 族添加物中，Hf、Zr 和 Ti 产生的两相稳定性逐渐降低。\n\n使用物理激励标准进行重新筛选，确定了 100 种合金满足高温 BCC+B2 稳定性、无液体、相纯度和适当的第二相分数的要求，其中包括 19 种贫 Ru 成分和两种独立报道的 HfRu-B2 合金。结果建立了 Ru 稳定双相耐火合金的实用成分设计规则，并将特定相的 BCC/B2 晶格失配确定为未来设计周期的关键目标。", "authors": [{"name": "Nathan Peterson"}, {"name": "Avik Mahata"}, {"name": "Nick Beaver"}, {"name": "Mohsen Kivy"}], "featured_authors": [{"name": "Nathan Peterson"}, {"name": "Avik Mahata"}, {"name": "Nick Beaver"}, {"name": "Mohsen Kivy"}], "author_count": 4}, {"id": "2609.14994", "category": "cond-mat", "title": "Heisenberg-like critical behavior in the quasi-two-dimensional metallic ferromagnet LaCrSb3", "abstract": "LaCrSb3 is a material exhibiting both quasi-two-dimensional spin fluctuations and three-dimensional magnetic interaction characteristics. By measuring the isothermal magnetization of single-crystals and conducting a systematic critical behavior analysis, we clarify the critical properties of its ferromagnetic phase transition and the intrinsic magnetic interaction mechanism. Based on high-precision isothermal magnetization data measured in the vicinity of the critical point, the Curie temperature for the ferromagnetic-paramagnetic phase transition is determined to be TC = 126 K, with the critical exponents obtained as $\\beta$ = 0.376, $\\gamma$ = 1.417 and $\\delta$ = 4.76 via the self-consistent iterative method based on the Arrott-Noakes equation. The reliability of these critical exponents is verified by the Widom scaling law, the magnetic state scaling equation and other analyses. A comparison with theoretical models demonstrates that the critical behavior of the magnetic phase transition in this system basically belongs to the universality class of the three-dimensional Heisenberg model. This conclusion is further confirmed by the distance-dependent decay behavior of the exchange interaction J(r), revealing the dominant role of isotropic direct exchange interactions in this system. Finally, drawing on research findings of other quasi-two-dimensional magnetic materials, this work proposes that LaCrSb3 may exhibit finite-temperature magnetic order in the two-dimensional limit, thereby possessing important theoretical research significance and promising practical application prospects.", "url": "https://arxiv.org/abs/2609.14994", "type": "理论", "summary": "LaCrSb3是一种同时表现出准二维自旋涨落和三维磁相互作用特性的材料。通过测量单晶的等温磁化强度并进行系统的临界行为分析，我们阐明了其铁磁相变的临界性质和固有的磁相互作用机制。根据临界点附近测得的高精度等温磁化数据，通过基于Arrott-Noakes方程的自洽迭代法，确定铁磁-顺磁相变的居里温度为TC = 126 K，临界指数为$\\beta$ = 0.376、$\\gamma$ = 1.417和$\\delta$ = 4.76。这些临界指数的可靠性通过Widom标度定律、磁态标度方程等分析得到验证。与理论模型的比较表明，该体系中磁相变的临界行为基本上属于三维海森堡模型的普适类。\n\n交换相互作用 J(r) 的距离依赖性衰减行为进一步证实了这一结论，揭示了各向同性直接交换相互作用在该系统中的主导作用。最后，借鉴其他准二维磁性材料的研究成果，提出LaCrSb3可能在二维极限下表现出有限温度磁序，具有重要的理论研究意义和良好的实际应用前景。", "authors": [{"name": "Qianhui Mao"}, {"name": "Haotian Deng"}, {"name": "Bin Chen"}, {"name": "Jinhu Yang"}], "featured_authors": [{"name": "Qianhui Mao"}, {"name": "Haotian Deng"}, {"name": "Bin Chen"}, {"name": "Jinhu Yang"}], "author_count": 4}, {"id": "2609.15050", "category": "cond-mat", "title": "Scalable construction of force-constant basis sets for large-scale anharmonic lattice-dynamical calculations", "abstract": "A projector-based formulation of force constants in crystalline materials provides a systematic framework for constructing force-constant bases and determining force constants from force--displacement datasets while rigorously satisfying crystal symmetry, permutation symmetry, and translational invariance. In this work, we develop an efficient eigenvalue solver for projection matrices and integrate it into the projector-based framework. The proposed method substantially reduces the computational cost and enables practical calculations for large-scale systems, low-symmetry crystals, and higher-order force constants that are difficult to treat using conventional approaches. Applications to self-consistent phonon calculations for assessing the grain-boundary excess free energy, lattice thermal conductivity calculations in complex compounds, and fourth-order force-constant estimations demonstrate the efficiency and robustness of the proposed framework for large and complex materials systems.", "url": "https://arxiv.org/abs/2609.15050", "type": "理论+数值", "summary": "晶体材料中基于投影仪的力常数公式提供了一个系统框架，用于构建力常数基础并根据力-位移数据集确定力常数，同时严格满足晶体对称性、排列对称性和平移不变性。在这项工作中，我们开发了一种高效的投影矩阵特征值求解器，并将其集成到基于投影仪的框架中。所提出的方法大大降低了计算成本，并能够对使用传统方法难以处理的大规模系统、低对称性晶体和高阶力常数进行实际计算。用于评估晶界过剩自由能的自洽声子计算、复杂化合物中的晶格热导率计算以及四阶力常数估计的应用证明了所提出的大型复杂材料系统框架的效率和鲁棒性。", "authors": [{"name": "Atsuto Seko"}, {"name": "Atsushi Togo"}], "featured_authors": [{"name": "Atsuto Seko"}, {"name": "Atsushi Togo"}], "author_count": 2}, {"id": "2609.15092", "category": "cond-mat", "title": "Bias and Correlations in Quasiperiodicity: Impact on Localization in an Extended Aubry-André Model", "abstract": "Unlike in Anderson localization - where any amount of uncorrelated disorder localizes all eigenstates in one dimension - a one-dimensional system with quasiperiodic potential supports a richer range of localization behavior. This paper investigates the fundamental question of which potential characteristics govern localization properties. We characterize quasiperiodic potentials using two independent parameters, correlation and bias, and demonstrate that bias, in addition to correlation, critically influences localization. Through the study of an extended Aubry-André model, in which a tunable parameter allows systematic control over both the bias and correlation of the potential, we show that bias is key in determining the fraction of delocalized states. An increase in the potential strength generally enhances the tendency toward localization, while simultaneously strengthening the correlations in the quasiperiodic potential. This apparent counterintuitive behavior can be understood in terms of the bias parameter: increasing the potential strength reduces the bias, which in turn favors localization. For the family of Hamiltonians considered, we identify two critical bias thresholds: below the lower threshold, the entire spectrum is localized, whereas below the higher threshold, at most a fraction of the states can be delocalized, precluding delocalization of the entire spectrum. To further test our framework, we examine a quasiperiodic model with zero bias and find that, despite its correlated nature, all states become localized even at very weak potential strengths - recovering the Anderson-like scenario.", "url": "https://arxiv.org/abs/2609.15092", "type": "理论", "summary": "与安德森定位不同的是，任何数量的不相关无序都将所有本征态定位在一维中，具有准周期势的一维系统支持更丰富的定位行为。本文研究了哪些潜在特征控制本地化属性的基本问题。我们使用两个独立的参数（相关性和偏差）来表征准周期势，并证明除了相关性之外，偏差也会严重影响定位。通过对扩展 Aubry-André 模型的研究，其中可调参数允许系统地控制势的偏差和相关性，我们表明偏差是确定离域态比例的关键。势能强度的增加通常会增强局域化趋势，同时增强准周期势的相关性。这种明显违反直觉的行为可以用偏差参数来理解：增加潜在强度会减少偏差，从而有利于定位。\n\n对于所考虑的哈密顿量族，我们确定了两个关键的偏差阈值：低于较低阈值，整个谱是局域化的，而低于较高阈值，至多一部分状态可以离域，从而排除整个谱的离域。为了进一步测试我们的框架，我们检查了一个零偏差的准周期模型，发现尽管其具有相关性，但所有状态即使在潜在强度非常弱的情况下也会变得局部化 - 恢复安德森式的场景。", "authors": [{"name": "Adithya J D"}, {"name": "Ranjan Modak"}, {"name": "Shaon Sahoo"}], "featured_authors": [{"name": "Adithya J D"}, {"name": "Ranjan Modak"}, {"name": "Shaon Sahoo"}], "author_count": 3}, {"id": "2609.15116", "category": "cond-mat", "title": "Ionic-Radius Mismatch as a Structural Lever for Tuning Phase Transitions and Luminescent Thermometry", "abstract": "The widespread implementation of luminescence thermometers requires a comprehensive understanding of the structural factors governing their thermometric performance. Establishing such structure-property relationships is essential for the rational design of sensing materials with application-tailored characteristics. This is particularly relevant for phase-transition-based luminescence thermometers, which offer exceptionally high relative sensitivities. The systematic analysis of K3Lu(PO4)2:Eu3+ demonstrates that introducing co-dopant ions with a controlled ionic-radius mismatch provides an effective strategy for tailoring phase-transition characteristics. This approach enables both the phase-transition temperature and thermal operating range to be controlled. Specifically, the transition temperature shifts from 210 K for K3Lu(PO4)2:Eu3+ to 310 K for K3Lu(PO4)2:Eu3+,10%La3+, while the operating range broadens from 30 to 60 K. Importantly, linear correlations between the ionic-radius mismatch parameter, {\\Omega}, and the phase-transition temperature, enthalpy, and entropy provide a quantitative framework for controlling the thermodynamics of the transition through compositional engineering. Beyond luminescence thermometry, these relationships establish a general strategy for designing materials exhibiting first-order phase transitions with tailored thermodynamic characteristics, opening opportunities for their optimization across a broad range of functional applications.", "url": "https://arxiv.org/abs/2609.15116", "type": "理论+数值", "summary": "发光温度计的广泛应用需要全面了解控制其测温性能的结构因素。建立这种结构-性能关系对于合理设计具有应用定制特性的传感材料至关重要。这对于基于相变的发光温度计尤其重要，它具有极高的相对灵敏度。 K3Lu(PO4)2:Eu3+ 的系统分析表明，引入具有受控离子半径失配的共掺杂离子为定制相变特性提供了有效的策略。这种方法可以控制相变温度和热工作范围。具体而言，转变温度从 K3Lu(PO4)2:Eu3+ 的 210 K 变为 K3Lu(PO4)2:Eu3+,10%La3+ 的 310 K，而工作范围从 30 K 扩大到 60 K。\n\n重要的是，离子半径失配参数 {\\Omega} 与相变温度、焓和熵之间的线性相关性为通过成分工程控制相变的热力学提供了定量框架。除了发光测温之外，这些关系还建立了设计具有定制热力学特性的一级相变材料的通用策略，为它们在广泛的功能应用中的优化提供了机会。", "authors": [{"name": "A. Javaid"}, {"name": "M. Szymczak"}, {"name": "A. Sieradzki"}, {"name": "L. Marciniak"}], "featured_authors": [{"name": "A. Javaid"}, {"name": "M. Szymczak"}, {"name": "A. Sieradzki"}, {"name": "L. Marciniak"}], "author_count": 4}, {"id": "2609.15231", "category": "cond-mat", "title": "Quasilocal transport in the integer quantised Hall effect: adiabatic separation, local Ohm's law, and Joule heating of the incompressible strips", "abstract": "We reassess the semiclassical route to integer quantum Hall transport around one idea: the separation of fast, quantised cyclotron motion from a slow, self-consistently screened guiding-centre landscape. Bohr--Sommerfeld quantisation of the canonical action fixes the Landau spectrum; smooth confinement turns it into Born--Oppenheimer surfaces with adiabatic parameter $\\ell|\\nabla V|/\\hbar\\omega_c$; screening supplies the self-consistent field. Transport is quasilocal, $R_H=\\int\\rho_Hj_y\\,dx/\\int j_y\\,dx$ with $j_y\\propto1/\\rho_l$, so within the regularised local Ohm model the incompressible strips attract the current by weight and the computed Joule-power profile follows the current profile. In linear response the intrinsic electrostatic AC correction of the frozen-profile model is reactive, $\\mathrm{Im}\\,R_H\\propto\\omega$, with $\\mathrm{Re}\\,R_H-R_H^{\\rm DC}\\propto\\omega^{2}$ below $10^{-9}$ up to $2$~MHz. With the current fed back into the electrostatics at $1$--$5\\,\\mu$A, where the Hall drop is one to five cyclotron gaps, the driven boundary condition breaks the reflection symmetry of the bar, the Hall drop concentrates in one strip (interchanged to $10^{-9}$ under current reversal), and the plateau narrows from its low-field flank while, for the GaAs parameters studied, its high-field edge stays at $\\nu(0)=2$. A local transverse thermal closure inspired by Akera, evaluated as a post-process on the frozen profile with two phonon-loss laws, indicates that the narrow current-carrying strips of the low-field flank may heat by of order the lattice temperature; with the activated-heat-capacity closure the cold strip loses its stationary solution at model-dependent currents of $0.3$--$2\\,\\mu$A. The thermal conclusions are bounded by the loss law and by the frozen profile, and are presented as estimates.", "url": "https://arxiv.org/abs/2609.15231", "type": "理论+数值", "summary": "我们围绕一个想法重新评估整数量子霍尔传输的半经典路线：将快速、量子化的回旋运动与缓慢、自洽的屏蔽引导中心景观分离。玻尔-索末菲规范作用的量子化固定了朗道谱；平滑限制将其变成具有绝热参数 $\\ell|\\nabla V|/\\hbar\\omega_c$ 的玻恩-奥本海默曲面；筛选提供了自洽场。传输是准局部的，$R_H=\\int\\rho_Hj_y\\,dx/\\int j_y\\,dx$ 和 $j_y\\propto1/\\rho_l$，因此在正则化局部欧姆模型中，不可压缩带通过重量吸引电流，并且计算出的焦耳功率分布遵循电流分布。在线性响应中，冻结轮廓模型的固有静电 AC 校正是反应性的，$\\mathrm{Im}\\,R_H\\propto\\omega$，$\\mathrm{Re}\\,R_H-R_H^{\\rm DC}\\propto\\omega^{2}$ 低于 $10^{-9}$，最高可达 $2$~MHz。\n\n当电流以 $1$--$5\\,mu$A 反馈到静电时，其中霍尔压降为一到五个回旋加速器间隙，驱动边界条件打破了棒的反射对称性，霍尔压降集中在一条带中（在电流反转下交换为 $10^{-9}$），平台从其低场侧面变窄，而对于所研究的 GaAs 参数，其高场边缘保持在$\\nu(0)=2$。受 Akera 启发的局部横向热闭合，通过两个声子损耗定律对冻结轮廓进行后处理进行评估，表明低场侧面的窄载流带可能会按晶格温度加热；随着激活热容量闭合，冷带在 $0.3$--$2\\,\\mu$A 的模型相关电流下失去其稳态解。热结论受损失定律和冻结剖面的限制，并以估计值的形式呈现。", "authors": [{"name": "A. Siddiki"}], "featured_authors": [{"name": "A. Siddiki"}], "author_count": 1}, {"id": "2609.15259", "category": "cond-mat", "title": "Borromean Criticality in Two Dimensions", "abstract": "The characteristic feature of counterflow superfluids consisting of $N\\geq 3$ components -- the so-called Borromean supercounterfluids (BSCF) -- is the presence of $N$ distinct elementary topological excitations (vortices) despite having only $N-1$ independent Goldstone modes. We show that this remarkable property clearly manifests itself at the Berezinskii-Kosterlitz-Thouless-type transition from the BSCF to the normal state, under the conditions of slight to moderate deviations from the case of exact intercomponent symmetry. More generally, our analysis also applies to any multicomponent superfluid with intercomponent drag fine-tuned to the value when certain composite vortices compete energetically with elementary ones.", "url": "https://arxiv.org/abs/2609.15259", "type": "理论", "summary": "由 $N\\geq 3$ 成分组成的逆流超流体的特征 - 所谓的博罗米安超级反流体（BSCF） - 是存在 $N$ 不同的基本拓扑激发（涡流），尽管只有 $N-1$ 独立的戈德斯通模式。我们表明，在与精确组件间对称情况有轻微到中度偏差的条件下，这种显着的特性在从 BSCF 到正常状态的 Berezinskii-Kosterlitz-Thouless 型转变中清楚地体现出来。更一般地说，我们的分析也适用于任何多组分超流体，当某些复合涡流与基本涡流激烈竞争时，组分间阻力会微调到该值。", "authors": [{"name": "Alexandru Golic"}, {"name": "Igor Timoshuk"}, {"name": "Albert Samoilenka"}, {"name": "Egor Babaev"}, {"name": "Boris Svistunov"}], "featured_authors": [{"name": "Alexandru Golic"}, {"name": "Igor Timoshuk"}, {"name": "Albert Samoilenka"}, {"name": "Egor Babaev"}, {"name": "Boris Svistunov"}], "author_count": 5}, {"id": "2609.15271", "category": "cond-mat", "title": "Disorder-Tailored Delocalization", "abstract": "We derive disorder fields tailored by the details of a choice of a delocalized wave function. We first investigate the unidirectional Hatano-Nelson chain and its localization properties under $M$-base diagonal disorder with variable weights. The spectrum forms loops in the complex plane and the loop parameter is a good quantum number similar to a momentum. All eigenstates are subexponentially `localized', i.e. the logarithm of the absolute value of the wave function performs a random walk in space, and are characterized by a corresponding length scale $\\xi_{sel}$ as shown in 1998 by Silvestrov for the general Hatano-Nelson chain. For $M=2$ real-valued binary disorder with equal weights the model was solved in Zeitschrift für Naturforschung A 81 421, yielding Cassini oval spectral loops and a diverging subexponential localization length for two eigenstates and for disorder weaker than a critical value set by the hopping strength. When the disorder field for any $M$ and arbitrary weights is confined to circles in the complex plane with radius equal to the hopping strength, the circle center will belong to the spectrum and to one of the spectral loops, and host a plane-wave-like eigenstate with diverging $\\xi_{sel}$. We generalize to tailoring on-site disorder for a given eigenstate at a given energy, for any lattice dimension, and any hopping field (both ordered and disordered), for Hermitian and non-Hermitian systems. We exemplify by constructing a one-dimensional chain with Anderson-localized eigenstates hosting a completely delocalized one with random phases. The localization length diverges as $1/|E|^{2/3}$ upon approaching the delocalized state. Our method can be used for the systematic construction of disorder fields which host predefined eigenstates with arbitrary properties.", "url": "https://arxiv.org/abs/2609.15271", "type": "理论+数值", "summary": "我们通过离域波函数的选择细节来导出无序场。我们首先研究单向 Hatano-Nelson 链及其在具有可变权重的 $M$ 基对角无序下的定位特性。谱在复平面上形成环，环参数是类似于动量的良好量子数。所有本征态都是次指数“局部化”的，即波函数绝对值的对数在空间中执行随机游走，并由相应的长度尺度 $\\xi_{sel}$ 来表征，如 Silvestrov 在 1998 年针对一般 Hatano-Nelson 链所示。对于具有相等权重的 $M=2$ 实值二元无序，该模型在 Zeitschrift für Naturforschung A 81 421 中求解，产生卡西尼椭圆形谱环和两个本征态的发散次指数局部化长度以及弱于跳跃强度设置的临界值的无序。\n\n当任何$M$和任意权重的无序场被限制在复平面中半径等于跳跃强度的圆时，圆心将属于谱和谱环之一，并具有发散$\\xi_{sel}$的平面波状本征态。我们概括为在给定能量、任何晶格尺寸和任何跳跃场（有序和无序）、厄米和非厄米系统下为给定本征态定制现场无序。我们通过构建一个一维链来举例说明，其中安德森局域本征态承载着具有随机相位的完全离域的本征态。当接近离域状态时，定位长度发散为 $1/|E|^{2/3}$。我们的方法可用于系统构建无序场，该无序场包含具有任意属性的预定义本征态。", "authors": [{"name": "Yeongjun Kim"}, {"name": "Supriyo Ghosh"}, {"name": "Sergej Flach"}], "featured_authors": [{"name": "Yeongjun Kim"}, {"name": "Supriyo Ghosh"}, {"name": "Sergej Flach"}], "author_count": 3}, {"id": "2609.15299", "category": "cond-mat", "title": "Benchmarking Machine-Learning Interatomic Potentials for Dynamical Stability in Inorganic Semiconductor Nanocrystals: A CdSe Case Study", "abstract": "Machine-learning interatomic potentials (MLIPs) enable nanosecond-scale atomistic simulations of inorganic semiconductor nanocrystals, but low errors on held-out configurations do not necessarily guarantee stable molecular dynamics. We benchmark five graph-neural-network MLIPs, SchNet, PaiNN, NequIP, Allegro and MACE, for dynamical stability in a chloride-passivated cadmium selenide nanocluster containing 149 atoms. The models were trained under harmonized conditions on 1,000 configurations and evaluated against 2,000 held-out configurations generated using density functional theory, considering force accuracy, computational efficiency, uncertainty and structural stability during 1 ns simulations at 300 K. Allegro produced the lowest validation force mean absolute errors, ranging from 12 to 14 meV per angstrom, whereas SchNet produced the largest, ranging from 84 to 110 meV per angstrom. This ranking did not predict dynamical robustness: NequIP remained stable for 1 ns without additional training data, whereas MACE became stable only after an ensemble-based active-learning procedure added 34 uncertainty-selected configurations. PaiNN and Allegro remained unstable after the addition of 100 and 95 configurations, respectively, and SchNet also failed to achieve stable dynamics within the tested augmentation budget. Under the benchmark hardware conditions, the machine-learning potentials required 6-66 ms per molecular-dynamics step, compared with approximately 20 s for density functional theory. These results show that held-out prediction errors alone are insufficient for selecting interatomic potentials for finite, surface-dominated nanostructures. Reliable deployment requires long-timescale dynamical testing combined with uncertainty-guided refinement, while the effectiveness and data efficiency of active learning remain strongly architecture dependent.", "url": "https://arxiv.org/abs/2609.15299", "type": "理论+数值", "summary": "机器学习原子间势（MLIP）能够对无机半导体纳米晶体进行纳秒级原子模拟，但保留配置的低误差并不一定能保证稳定的分子动力学。我们对五个图神经网络 MLIP、SchNet、PaiNN、NequIP、Allegro 和 MACE 进行了基准测试，以检测包含 149 个原子的氯化物钝化硒化镉纳米团簇的动态稳定性。这些模型在统一条件下对 1,000 个配置进行训练，并针对使用密度泛函理论生成的 2,000 个保留配置进行评估，考虑到 300 K 下 1 ns 模拟期间的力精度、计算效率、不确定性和结构稳定性。Allegro 产生的验证力平均绝对误差最低，范围为每埃 12 至 14 meV，而 SchNet 产生的验证力平均绝对误差最大，范围为每埃 84 至 110 meV。该排名并未预测动态鲁棒性：NequIP 在没有额外训练数据的情况下保持稳定 1 ns，而 MACE 仅在基于集成的主动学习过程添加 34 个不确定性选择的配置后才变得稳定。\n\nPaiNN 和 Allegro 在分别添加 100 和 95 个配置后仍然不稳定，SchNet 也未能在测试的增强预算内实现稳定的动态。在基准硬件条件下，机器学习潜力每个分子动力学步骤需要 6-66 毫秒，而密度泛函理论大约需要 20 秒。这些结果表明，仅保留预测误差不足以选择有限的、表面主导的纳米结构的原子间势。可靠的部署需要长期动态测试与不确定性引导的细化相结合，而主动学习的有效性和数据效率仍然强烈依赖于架构。", "authors": [{"name": "M. Usman"}, {"name": "M. Suleymanova"}, {"name": "Z. U. Abideen"}, {"name": "M. Fernández-Pendás"}, {"name": "I. Infante"}], "featured_authors": [{"name": "M. Usman"}, {"name": "M. Suleymanova"}, {"name": "Z. U. Abideen"}, {"name": "M. Fernández-Pendás"}, {"name": "I. Infante"}], "author_count": 5}, {"id": "2609.15300", "category": "cond-mat", "title": "Engineering Competing Fractional Topological States in a BHZ Superlattice", "abstract": "Scalar superlattices offer a route from simple topological bands to fractionalized states, while multicomponent systems raise the additional question of which fractional order is energetically selected. We show that a scalar superlattice applied to the Qi-Wu-Zhang (QWZ) Chern-insulator model produces an isolated C = +1 miniband with strongly improved Berry-curvature and quantum metric uniformity. Exact diagonalization of the projected interaction identifies a 1/3 fractional Chern insulator in this miniband. Restoring the time-reversed partner to form the Bernevig-Hughes-Zhang (BHZ) superlattice yields, at total filling 2/3, a balanced fractional quantum spin Hall (FQSH)-like state and a fully polarized 2/3 fractional Chern insulator. Their competition separates two aspects of fractional-state control: the finite-momentum intercomponent coupling governs the stability of the balanced FQSH-like state, whereas a uniform pseudospin anisotropy shifts the relative energies of conserved sectors and can switch the global ground state between the balanced and polarized states. These results establish a minimal lattice setting that connects topological-miniband reconstruction, fractional-state formation, and fractional-state selection, illustrating how distinct levels of control can be combined to navigate competing fractional topological states.", "url": "https://arxiv.org/abs/2609.15300", "type": "理论+数值", "summary": "标量超晶格提供了从简单拓扑带到分数化状态的途径，而多组分系统则提出了积极选择哪种分数阶的额外问题。我们证明，应用于 Qi-Wu-Zhang (QWZ) Chern 绝缘体模型的标量超晶格会产生孤立的 C = +1 微带，其贝里曲率和量子度量均匀性得到显着改善。投影相互作用的精确对角化确定了该迷你带中的 1/3 分数陈绝缘体。恢复时间反转伙伴以形成 Bernevig-Hughes-Zhang (BHZ) 超晶格，在总填充量为 2/3 时，产生平衡分数量子自旋霍尔 (FQSH) 状状态和完全极化的 2/3 分数陈绝缘体。他们的竞争将分数态控制的两个方面分开：有限动量组分间耦合控制着平衡类 FQSH 态的稳定性，而均匀赝自旋各向异性则改变了守恒扇区的相对能量，并且可以在平衡态和极化态之间切换全局基态。\n\n这些结果建立了一个连接拓扑微带重建、分数状态形成和分数状态选择的最小晶格设置，说明了如何组合不同级别的控制来导航竞争的分数拓扑状态。", "authors": [{"name": "Ke-Chen Liu"}, {"name": "Chen Cheng"}], "featured_authors": [{"name": "Ke-Chen Liu"}, {"name": "Chen Cheng"}], "author_count": 2}, {"id": "2609.15323", "category": "cond-mat", "title": "Statistical levels and spatial modes of Fock-space heterogeneity in many-body localization crossovers", "abstract": "Near many-body localization crossovers, local memory fluctuates strongly among eigenstates and ensemble realizations, but the observed heterogeneity combines contributions from different statistical levels. We develop a statistical framework based on configuration-space distance distributions that uses a variance decomposition to separate fluctuations within eigenstates, between eigenstates of one sample, and between samples. Applying this framework to random-cosine and quasiperiodic-cosine Ising ensembles with the same one-site field marginal, we find that, at the exact-diagonalization sizes studied, the clearest difference occurs among disorder realizations or quasiperiodic phase samples, whereas within-eigenstate and within-sample eigenstate-to- eigenstate contributions remain broadly comparable. Spatial covariances show that random outer fluctuations have a much stronger uniform component, whereas quasiperiodic phase fluctuations are organized more strongly at finite wave number and partly cancel in the spatial average controlling the distance center. We find that, near the crossover in the random ensemble, the ensemble-averaged distance center is particularly sensitive to changes in the nominal field strength. Combined with sample-to-sample differences in the realized field amplitude, this mean response accounts for much of the sample-to-sample variation in the distance center. Analysis of half-chain entanglement further shows that its sample-to-sample fluctuations likewise reflect the combined effects of amplitude variations and its own mean response. An application to a fixed-magnetization spin chain demonstrates the framework in a constrained configuration space. Resolving both statistical level and spatial mode therefore provides a more complete picture of sample- dependent many-body memory and its configuration-space probability geometry.", "url": "https://arxiv.org/abs/2609.15323", "type": "理论", "summary": "在多体定位交叉附近，局部记忆在本征态和系综实现之间剧烈波动，但观察到的异质性结合了不同统计水平的贡献。我们开发了一种基于配置空间距离分布的统计框架，该框架使用方差分解来分离本征态内、一个样本的本征态之间以及样本之间的波动。将此框架应用于具有相同单点场边际的随机余弦和准周期余弦伊辛系综，我们发现，在研究的精确对角化大小下，无序实现或准周期相位样本之间出现最明显的差异，而本征态内和样本内本征态到本征态的贡献仍然大致可比。空间协方差表明，随机外部波动具有更强的均匀分量，而准周期相位波动在有限波数下组织得更强，并且在控制距离中心的空间平均中部分抵消。\n\n我们发现，在随机系综的交叉点附近，系综平均距离中心对标称场强的变化特别敏感。与实现的场振幅中样本间的差异相结合，该平均响应解释了距离中心的样本间变化的大部分。对半链纠缠的分析进一步表明，其样本间波动同样反映了幅度变化及其自身平均响应的综合影响。固定磁化自旋链的应用演示了受限配置空间中的框架。因此，解决统计水平和空间模式可以提供样本相关多体记忆及其配置空间概率几何的更完整图像。", "authors": [{"name": "Yu-Jing Liu"}, {"name": "Chen Cheng"}], "featured_authors": [{"name": "Yu-Jing Liu"}, {"name": "Chen Cheng"}], "author_count": 2}, {"id": "2609.15371", "category": "cond-mat", "title": "Unified contact-free formulation of linear-response transport theory", "abstract": "Thermal Hall transport is conventionally formulated as a current--current Kubo response supplemented by an energy-magnetization correction obtained through an auxiliary pseudogravitational magnetic field. Motivated by this structure, we develop a unified contact-free moment formulation of linear response to scalar sources. For channels whose source contributions vanish in the dc limit, the transport coefficient is the low-frequency residue of a retarded moment--moment correlator, with equal-time endpoint contributions incorporated before the dc limit is taken. The formulation uses only scalar sources, requires no separate magnetization subtraction, is independent of the local-current gauge, and is invariant under admissible redistributions of bond or interaction energy. It organizes particle, grand-energy, and specified spin-density channels within a common source--moment response matrix. Quadratic Landau--Lifshitz spin waves illustrate the method: the secular growth of polarization-moment correlations isolates the finite Hall residue and yields the magnon thermal Hall and spin Nernst coefficients from the same paraunitary band geometry. The formulation provides a unified operator framework that simplifies the organization of particle, thermal, and spin transport and can streamline calculations by eliminating separate contact and magnetization corrections.", "url": "https://arxiv.org/abs/2609.15371", "type": "理论+数值", "summary": "热霍尔传输通常被表述为电流-电流 Kubo 响应，并辅以通过辅助伪重力磁场获得的能量磁化校正。受这种结构的启发，我们开发了对标量源线性响应的统一无接触力矩公式。对于源贡献在直流限制中消失的通道，传输系数是延迟矩相关器的低频残差，在采用直流限制之前合并了等时间端点贡献。该公式仅使用标量源，不需要单独的磁化强度减法，独立于局部电流规范，并且在键合能或相互作用能的允许重新分布下保持不变。它将粒子、大能量和指定的自旋密度通道组织在一个公共源——矩响应矩阵内。二次朗道-利夫希茨自旋波说明了该方法：极化矩相关性的长期增长隔离了有限的霍尔剩余，并从相同的副酉能带几何结构中产生磁振子热霍尔和自旋能斯特系数。\n\n该公式提供了一个统一的算子框架，简化了粒子、热和自旋输运的组织，并且可以通过消除单独的接触和磁化校正来简化计算。", "authors": [{"name": "Ziqian Wang"}, {"name": "Ji Feng"}], "featured_authors": [{"name": "Ziqian Wang"}, {"name": "Ji Feng"}], "author_count": 2}, {"id": "2609.15380", "category": "cond-mat", "title": "Active pistons extract work by periodic compression alone", "abstract": "Active matter is liable to invent protocols that evade the constraints of equilibrium thermodynamics. We put forward active pistons that extract work by periodic compression alone without changing any bulk property of the system. Such pistons necessarily couple the perturbation imposed by an external operator with some degrees of freedom internal to active components. We illustrate this design principle with elastic networks composed of self-aligning motile particles. For slow protocols, self-alignment always overwhelms mechanical friction when the internal activity exceeds a specific threshold controlled by fluctuations. We identify the key response coefficient that helps delineate regimes of work extraction, and reveal that the corresponding phase diagram follows a master curve with re-entrance in terms of noise amplitude. Overall, our active pistons embody a novel design principle with broad implications for building innovative engines far from equilibrium.", "url": "https://arxiv.org/abs/2609.15380", "type": "数值", "summary": "活性物质很容易发明出逃避平衡热力学约束的协议。我们提出了主动活塞，仅通过周期性压缩来提取功，而不改变系统的任何整体特性。这种活塞必然将外部操作员施加的扰动与活动部件内部的某些自由度结合起来。我们用由自对准运动粒子组成的弹性网络来说明这一设计原理。对于慢速协议，当内部活动超过由波动控制的特定阈值时，自对准总是压倒机械摩擦。我们确定了有助于描绘功提取范围的关键响应系数，并揭示了相应的相图遵循噪声幅度重入的主曲线。总体而言，我们的主动活塞体现了一种新颖的设计原理，对于构建远离平衡的创新发动机具有广泛的影响。", "authors": [{"name": "Paul Bernard"}, {"name": "Euijoon Kwon"}, {"name": "Benjamin Buhl"}, {"name": "Étienne Fodor"}, {"name": "Olivier Dauchot"}], "featured_authors": [{"name": "Paul Bernard"}, {"name": "Euijoon Kwon"}, {"name": "Benjamin Buhl"}, {"name": "Étienne Fodor"}, {"name": "Olivier Dauchot"}], "author_count": 5}, {"id": "2609.15402", "category": "cond-mat", "title": "Geometry-induced flocking and topological sound on a defect-free curved surface", "abstract": "We study an ordered polar active flock on a torus and show that topological sound persists on a compact curved surface without topological defects or physical boundaries. Using the covariant Toner Tu theory, we derive an effective nonHermitian Dirac operator whose curvature-induced mass changes sign across the outer and inner equators, producing two Jackiw Rebbi domain walls. These support co-propagating but distinct chiral edge excitations: a density mode localized on the positively curved outer equator and a Goldstone mode localized on the negatively curved inner equator. The bulk bands possess opposite half-integer Chern numbers whose jumps across the domain walls are determined by the sign of the Gaussian curvature. We further show that the localised modes are protected by a one-dimensional Callias index theorem, while the sum of the local indices obeys the Poincare Hopf theorem on the compact surface. Our results establish that curvature alone, independent of defects and boundaries, is sufficient to generate and protect topological sound in active matter, providing a unified connection between non-Hermitian topology, differential geometry, and hydrodynamic theory of collective motion.", "url": "https://arxiv.org/abs/2609.15402", "type": "理论", "summary": "我们研究了环面上有序的极性活动群，并表明拓扑声音持续存在于紧凑的曲面上，没有拓扑缺陷或物理边界。利用协变 Toner Tu 理论，我们推导了一个有效的非厄米狄拉克算子，其曲率引起的质量在外赤道和内赤道上改变符号，产生两个 Jackiw Rebbi 畴壁。这些支持共同传播但不同的手性边缘激发：位于正弯曲外赤道上的密度模式和位于负弯曲内赤道上的戈德斯通模式。体能带具有相反的半整数陈数，其跨越磁畴壁的跳跃由高斯曲率的符号决定。我们进一步表明，局域模态受到一维 Callias 指数定理的保护，而局域指数之和遵守紧致表面上的 Poincare Hopf 定理。\n\n我们的结果表明，独立于缺陷和边界的曲率本身就足以在活性物质中产生和保护拓扑声音，从而在非厄米拓扑、微分几何和集体运动的流体动力学理论之间提供统一的联系。", "authors": [{"name": "Devendra Saini"}, {"name": "Atanu Bhatta"}, {"name": "Pritha Dolai"}], "featured_authors": [{"name": "Devendra Saini"}, {"name": "Atanu Bhatta"}, {"name": "Pritha Dolai"}], "author_count": 3}, {"id": "2609.15417", "category": "cond-mat", "title": "From bending to stretching driven peeling of heterogeneous adhesives", "abstract": "We study theoretically the peeling behavior of adhesives. Adopting a fracture mechanics approach, we derive the equation of motion of the adhesion front propagating at the interface between the adhesive and the substrate from which the peel strength is inferred. The originality of our approach lies in the description of the interplay during peeling between the stretching and the bending modes of deformation of the adhesive that is described as a F{\\''o}ppl-Von Karman's thin film. Considering first a straight adhesion front, we retrieve the most salient feature of homogeneous adhesives, namely a peeling angle dependent peel strength driven by bending at large angles and by stretching at low angles. We also derive the shape of the adhesive that can be described using a single bending length scale derived from our model. We then investigate the impact of adhesion heterogeneities. We evidence that the deformations of the adhesion front are governed by a non-local interface elasticity the strength of which decreases with the peeling angle. This phenomenon reflects the transition between a stretching dominated peeling at low angle to a bending driven peeling at large angles that is captured in our model. This transition impacts the stability of adhesive fronts that relaxe more slowly from perturbations and gives rise to a stronger toughening effect in presence of a disorder distribution of adhesion energy at low peeling angles. Overall, this study sheds light on the central role played the elastic deformations of adhesives on their peeling behavior. The proposed framework unfolds the complex interplay between the deformation of adhesives and the peeling driving force that may be leveraged to engineer heterogeneous adhesives with enhanced properties. It also provides rich insights on the mechanisms underlying the emergence of non-local elasticity in interface problems.", "url": "https://arxiv.org/abs/2609.15417", "type": "理论", "summary": "我们从理论上研究了粘合剂的剥离行为。采用断裂力学方法，我们推导了在粘合剂和基材之间的界面处传播的粘合前沿的运动方程，并由此推断出剥离强度。我们方法的独创性在于描述了剥离过程中粘合剂的拉伸和弯曲变形模式之间的相互作用，该粘合剂被描述为 F{\\''o}ppl-Von Karman 薄膜。首先考虑直的粘合前沿，我们检索均质粘合剂的最显着特征，即由大角度弯曲和小角度拉伸驱动的剥离角度依赖性剥离强度。我们还推导了粘合剂的形状，可以使用从我们的模型导出的单个弯曲长度尺度来描述该形状。然后我们研究粘附异质性的影响。我们证明粘附前沿的变形是由非局部界面弹性控制的，其强度随着剥离角度的增加而降低。\n\n这种现象反映了我们的模型中捕获的小角度拉伸主导剥离与大角度弯曲驱动剥离之间的过渡。这种转变影响了粘合剂前端的稳定性，粘合剂前端因扰动而松弛得更慢，并且在低剥离角度下存在粘合能无序分布的情况下产生更强的增韧效果。总的来说，这项研究揭示了粘合剂的弹性变形对其剥离行为的核心作用。所提出的框架揭示了粘合剂变形和剥离驱动力之间复杂的相互作用，可用于设计具有增强性能的异质粘合剂。它还提供了关于界面问题中非局部弹性出现的机制的丰富见解。", "authors": [{"name": "Laurent Ponson"}], "featured_authors": [{"name": "Laurent Ponson"}], "author_count": 1}, {"id": "2609.15428", "category": "cond-mat", "title": "Shannon Entropy as an Order Parameter for the Two-Dimensional Confined Coulomb Systems: Exact Balance Law, Topological Charge Sum Rule, and Boundary Saturation", "abstract": "We establish a complete information-theoretic framework for the known minimum-energy configurations of the two-dimensional Thomson problem on a hard-wall disk, based on the Shannon entropy of the Voronoi topological charge distribution. Two exact results are proven and hold for all studied systems of size $N=12$--$10^5$. First, an entropy balance law decomposes the total entropy into bulk, boundary, and mixing contributions without approximation. Second, a topological charge sum rule fixes the total charge at twice the number of boundary particles plus six; together with the observed separation of bulk and boundary coordination numbers, it yields exact relations between the populations of three- and four-coordinated boundary particles and the bulk charge. We further prove that the boundary entropy is bounded by the binary maximum and that saturation of this bound is equivalent to the bulk charge per boundary particle approaching minus one half, a regime that the framework itself restricts to boundaries of at least twelve particles. All identities are verified numerically to machine precision, locating bulk nucleation at $56$ particles, the maximum of global disorder at $146$, and the onset of boundary saturation beyond about $1000$. The framework carries over to closed spherical geometry, where the total charge is fixed at twelve.", "url": "https://arxiv.org/abs/2609.15428", "type": "理论+数值", "summary": "我们基于 Voronoi 拓扑电荷分布的香农熵，为硬壁磁盘上二维汤姆逊问题的已知最小能量配置建立了完整的信息论框架。两个精确的结果已得到证明，并且适用于所有研究的大小为 $N=12$--$10^5$ 的系统。首先，熵平衡定律将总熵分解为体积、边界和混合贡献，而无需近似。其次，拓扑电荷和规则将总电荷固定为边界粒子数量的两倍加上六；连同观察到的体配位数和边界配位数的分离，它产生了三配位和四配位边界粒子的数量与体电荷之间的精确关系。我们进一步证明，边界熵受二元最大值限制，并且该边界的饱和度相当于每个边界粒子的体电荷接近负二分之一，框架本身将其限制为至少十二个粒子的边界。\n\n所有身份都经过数字验证，以达到机器精度，将块体成核定位在 56 美元的粒子处，全局无序的最大值在 146 美元处，边界饱和的开始位置超过约 1000 美元。该框架延续到封闭的球形几何结构，其中总电荷固定为十二。", "authors": [{"name": "Goergiy K. Lavrov"}, {"name": "Eduard G. Nikonov"}], "featured_authors": [{"name": "Goergiy K. Lavrov"}, {"name": "Eduard G. Nikonov"}], "author_count": 2}, {"id": "2609.15441", "category": "cond-mat", "title": "Analysis of Granular Flow in a Wedge-Shaped Hopper", "abstract": "We study the velocity and stress distribution for a planar granular flow in a wedge-shaped hopper using Discrete Element Method simulations. Periodic boundary conditions are used in the direction normal to the plane of the flow to simulate a layer system. A parametric study is carried out varying system parameters (orifice width, wedge angle, wall friction and hopper height) and particle properties (particle diameter and particle friction). Scaling relations are obtained for the velocity and stress ratios. The data indicate that the stresses are not dependent on the shear rate, as in the Mohr-Coulomb rheology, however, the friction coefficient varies spatially, and the coaxiality condition is violated in some regions of the flow. A theory based on the scaling relations is presented, which gives good predictions for all the cases studied. Based on the theory, an expression for the mass flow rate, incorporating the effect of system parameters and particle properties is derived, which gives a close match with the computed mass flow rates for all the cases.", "url": "https://arxiv.org/abs/2609.15441", "type": "理论+数值", "summary": "我们使用离散元法模拟研究楔形料斗中平面颗粒流的速度和应力分布。在垂直于流动平面的方向上使用周期性边界条件来模拟层系统。通过改变系统参数（孔口宽度、楔角、壁摩擦力和料斗高度）和颗粒特性（颗粒直径和颗粒摩擦力）进行参数研究。获得速度和应力比的比例关系。数据表明，应力并不像莫尔-库仑流变学中那样依赖于剪切速率，但是摩擦系数随空间变化，并且在某些流动区域违反了同轴性条件。提出了一种基于标度关系的理论，它为所有研究的案例提供了良好的预测。基于该理论，推导了包含系统参数和颗粒特性影响的质量流量表达式，该表达式与所有情况下计算的质量流量非常匹配。", "authors": [{"name": "Afroz Momin"}, {"name": "Devang Khakhar"}], "featured_authors": [{"name": "Afroz Momin"}, {"name": "Devang Khakhar"}], "author_count": 2}, {"id": "2609.15466", "category": "cond-mat", "title": "Reconstruction of the superstatistical temperature distribution from single-particle kinetic energies", "abstract": "The framework of superstatistics can be used to describe non-Maxwellian single-particle velocity distributions as mixtures of Maxwellian distributions, where the weight is imposed by a probability density associated to the inverse temperature $\\beta = 1/(k_B T)$. Among the typical model choices for $\\beta$ are gamma, inverse gamma and lognormal distributions, sometimes called the universality classes of superstatistics. Given a set of observed velocities, however, there is no direct method to determine the underlying temperature distribution, as temperature itself is not a phase-space observable, and numerically inverting the Laplace transform is an unreliable process. In this work, we show that Jaynes' principle of maximum entropy can be used to successfully reconstruct the inverse temperature distribution from data, by using the logarithmic moments of the kinetic energy as constraints. Although the kinetic energy distributions for the three universality classes are almost indistinguishable at the same mean and variance of $\\beta$, the method correctly discriminates between them.", "url": "https://arxiv.org/abs/2609.15466", "type": "理论+数值", "summary": "超统计框架可用于将非麦克斯韦单粒子速度分布描述为麦克斯韦分布的混合，其中权重由与逆温度 $\\beta = 1/(k_B T)$ 相关的概率密度施加。 $\\beta$ 的典型模型选择包括伽玛分布、逆伽玛分布和对数正态分布，有时称为超级统计的普遍性类别。然而，给定一组观测到的速度，没有直接的方法来确定潜在的温度分布，因为温度本身不是可观测的相空间，并且拉普拉斯变换的数值反转是一个不可靠的过程。在这项工作中，我们表明，通过使用动能的对数矩作为约束，杰恩斯的最大熵原理可以成功地从数据中重建逆温度分布。尽管在 $\\beta$ 的均值和方差相同的情况下，三个普遍性类别的动能分布几乎无法区分，但该方法可以正确地区分它们。", "authors": [{"name": "Sergio Davis"}], "featured_authors": [{"name": "Sergio Davis"}], "author_count": 1}, {"id": "2609.15629", "category": "cond-mat", "title": "Percolation threshold in cluster-assembled nanogranular palladium films and related strategies for hydrogen detection", "abstract": "Electrical transport in cluster-assembled nanogranular palladium films was investigated in-situ during growth by Supersonic Cluster Beam Deposition. The percolation onset is observed at a thickness of 1.5 nm, while the percolation completion at 2.5 nm. Films at the percolation thickness (2 nm) and beyond the percolation end (5 nm) were subsequently exposed ex-situ to 0.25% hydrogen in air to investigate how hydrogen-induced structural changes in Pd clusters modulate electrical transport and can be exploited as mechanism for selective hydrogen detection. Implantation of palladium clusters in soft polymer styrene-ethylene-butylene-styrene was also explored to promote clusters separation and enhance quantum tunnelling phenomena within electrical transport. The observed electrical transport pattern features stable baselines in air, suggesting material stability, fast response time (T50% < 10 s), and the coexistence of reversible and irreversible components in conduction changes induced by hydrogen exposure. The irreversible component is tentatively attributed to hydrogen-promoted partial coalescence of Pd clusters. The behaviour of the polymer implanted samples suggests an alternative gas detection mechanism where hydrogen-induced polymer swelling dominates over palladium structural modifications. These results disclose novel possible transducing routes for miniaturized hydrogen detection and multimodal sensing.", "url": "https://arxiv.org/abs/2609.15629", "type": "理论", "summary": "通过超音速簇束沉积在生长过程中原位研究了簇组装的纳米颗粒钯薄膜中的电传输。在 1.5 nm 的厚度处观察到渗滤开始，而在 2.5 nm 的厚度处观察到渗滤完成。随后将渗滤厚度（2 nm）和超出渗滤末端（5 nm）的薄膜异位暴露于空气中的 0.25% 氢气中，以研究氢引起的 Pd 簇结构变化如何调节电传输，并可用作选择性氢检测的机制。还探索了将钯簇植入软聚合物苯乙烯-乙烯-丁烯-苯乙烯中，以促进簇分离并增强电传输中的量子隧道现象。观察到的电传输模式在空气中具有稳定的基线，表明材料稳定性、快速响应时间（T50% < 10 s）以及氢暴露引起的传导变化中可逆和不可逆成分的共存。不可逆成分暂时归因于氢促进的 Pd 簇的部分聚结。\n\n聚合物植入样品的行为表明了另一种气体检测机制，其中氢诱导的聚合物膨胀优于钯结构修饰。这些结果揭示了用于小型化氢检测和多模态传感的新的可能的转换途径。", "authors": [{"name": "A. Debot"}, {"name": "D. Balakrishnan"}, {"name": "A.M. Philippe"}, {"name": "E. Barborini"}], "featured_authors": [{"name": "A. Debot"}, {"name": "D. Balakrishnan"}, {"name": "A.M. Philippe"}, {"name": "E. Barborini"}], "author_count": 4}, {"id": "2609.15646", "category": "cond-mat", "title": "Liquid water stability as network resilience", "abstract": "Liquid water is unusually stable, remaining liquid across a wide range of temperatures and even when confined to spaces only a few molecules wide. Yet it eventually fails in both settings: boiling at the critical temperature or drying in narrow pores, phenomena normally studied separately. Water's hydrogen-bond network is thought to underlie this stability, but tracking bond survival has not resolved the puzzle. Extending a concept we recently introduced for wetting (J. Am. Chem. Soc. 148, 21572 (2026)), we show that these stability limits can be accurately derived from a previously overlooked network property: resilience, the capacity to locally repair a broken bond. Only interactions too weak to be repaired constitute genuine defects, a far smaller population than conventional definitions suggest. While intact bonds remain abundant up to failure and conventionally broken bonds already percolate well before it, instability coincides with the percolation of these genuine defects. Comparing local interaction energies with a single intrinsic scale (identified a priori) predicts the wetting-hydrophobicity crossover, nanoconfinement cavitation, and bulk criticality. These phenomena are thus unified through a common molecular framework whose energetic scale also matches a long-unexplained spectroscopic feature of water. A single, parameter-free molecular criterion rooted in network resilience suffices.", "url": "https://arxiv.org/abs/2609.15646", "type": "理论+数值", "summary": "液态水异常稳定，即使在很宽的温度范围内，甚至在只有几个分子宽的空间内，也能保持液态。然而，它最终在两种情况下都会失败：在临界温度下沸腾或在狭窄的孔隙中干燥，这些现象通常是单独研究的。水的氢键网络被认为是这种稳定性的基础，但追踪键的生存并没有解决这个难题。扩展我们最近引入的润湿概念（J. Am. Chem. Soc. 148, 21572 (2026)），我们表明这些稳定性极限可以准确地从之前被忽视的网络特性中推导出来：弹性，即局部修复断裂键的能力。只有太弱而无法修复的相互作用才构成真正的缺陷，其数量比传统定义所暗示的要少得多。虽然完整的键在失效之前仍然丰富，而传统的断裂键早在失效之前就已经渗透，但不稳定与这些真正缺陷的渗透同时发生。将局部相互作用能与单个固有尺度（先验确定）进行比较可以预测润湿疏水性交叉、纳米限制空化和体积临界性。\n\n因此，这些现象通过一个共同的分子框架统一起来，其能量尺度也与长期无法解释的水光谱特征相匹配。植根于网络弹性的单一、无参数分子标准就足够了。", "authors": [{"name": "Nicolás A. Loubet"}, {"name": "Gustavo A. Appignanesi"}], "featured_authors": [{"name": "Nicolás A. Loubet"}, {"name": "Gustavo A. Appignanesi"}], "author_count": 2}, {"id": "2609.15717", "category": "cond-mat", "title": "The Case Against Hall-Petch Hardening in High Entropy Carbide Ceramics", "abstract": "Grain size is often used with the Hall-Petch relationship to justify differences in hardness in ceramic materials. Herein, hardness does not vary systematically with grain-size for fully dense, single-phase (Cr,Mo,Ta,V,W)C1-{\\delta} high entropy carbide ceramics for grain sizes that varied by a factor of three. Fully dense, single-phase ceramics with grain sizes from 9.3+/-0.3 to 28.8+/-0.7 microns exhibited a pronounced indentation size effect, with Vickers hardness decreasing from ~28-30 GPa at 0.49 N to ~20-21 GPa at 9.81 N, and Berkovich nanohardness ranging from 26 to 30 GPa at 10 mN. However, at a given load, hardness remained within a narrow range across the grain-size series, and no consistent Hall-Petch dependence was resolved. The lack of grain-size dependence likely indicates that the deformation volume sampled by the indenter was not controlled by grain-boundary interactions; instead, hardness was governed primarily by indentation load and local response of the rock salt carbide matrix.", "url": "https://arxiv.org/abs/2609.15717", "type": "理论+数值", "summary": "晶粒尺寸通常与 Hall-Petch 关系一起使用来证明陶瓷材料硬度差异的合理性。在此，对于晶粒尺寸变化三倍的全致密单相 (Cr,Mo,Ta,V,W)C1-{\\δ} 高熵碳化物陶瓷，硬度不随晶粒尺寸系统性地变化。晶粒尺寸为 9.3+/-0.3 至 28.8+/-0.7 微米的全致密单相陶瓷表现出明显的压痕尺寸效应，维氏硬度从 0.49 N 时的约 28-30 GPa 降至 9.81 N 时的约 20-21 GPa，伯科维奇纳米硬度范围为 10 mN 时的 26 至 30 GPa。然而，在给定的载荷下，整个晶粒尺寸系列的硬度保持在一个狭窄的范围内，并且没有解决一致的霍尔-佩奇依赖性问题。缺乏晶粒尺寸依赖性可能表明压头采样的变形体积不受晶界相互作用控制；相反，硬度主要由压痕载荷和岩盐碳化物基体的局部响应决定。", "authors": [{"name": "Ali Sarikhani"}, {"name": "Ana C. Feltrin"}, {"name": "Gregory E. Hilmas"}, {"name": "David W. Lipke"}, {"name": "Douglas E. Wolfe"}, {"name": "Stefano Curtarolo"}, {"name": "Shen J. Dillon"}, {"name": "William G. Fahrenholtz"}], "featured_authors": [{"name": "Ali Sarikhani"}, {"name": "Ana C. Feltrin"}, {"name": "Gregory E. Hilmas"}, {"name": "Stefano Curtarolo"}, {"name": "Shen J. Dillon"}, {"name": "William G. Fahrenholtz"}], "author_count": 8}, {"id": "2609.15839", "category": "cond-mat", "title": "Collective adaptation to time-dependent targets for active Brownian particles", "abstract": "We consider a minimal model of active agents which collectively learn to reach a target macroscopic state via a decentralized adaptation process. Agents are modeled as active Brownian particles which randomly reorient to a given direction through tumbling events. An average target state is encoded into a reward function evaluated by each agent. Agents can tune one of the parameters of their microscopic dynamics, called `policy' (e.g., speed or reorientation direction), to optimize their reward function thanks to information exchange with neighboring agents. We describe the evolution of the policy distribution across the agent population with a kinetic theory, under the assumption that the adaptation process is slow with respect to the physical dynamics. The adaptation process is illustrated on several learning protocols with either fixed or time-dependent target velocities. A characteristic learning time $\\tau$ combining teaching and mutations emerges from the dynamics. For time-oscillating targets at angular frequency $\\omega$, the collective dynamics oscillates in time, with an oscillation amplitude and phase shift determined by the product $\\omega \\tau$. An unlocking transition to a non-adaptable state is also observed for a rotating target velocity.", "url": "https://arxiv.org/abs/2609.15839", "type": "理论+数值", "summary": "我们考虑一个最小的主动代理模型，它们通过分散的适应过程共同学习达到目标宏观状态。代理被建模为活跃的布朗粒子，它们通过翻滚事件随机重新定向到给定方向。平均目标状态被编码到由每个代理评估的奖励函数中。智能体可以调整其微观动力学参数之一，称为“策略”（例如速度或重新定向方向），以通过与邻近智能体的信息交换来优化其奖励函数。我们在假设适应过程相对于物理动力学缓慢的情况下，用动力学理论描述了整个代理群体的策略分布的演变。适应过程在几个具有固定或时间相关目标速度的学习协议上进行了说明。结合教学和突变的特征学习时间 $\\tau$ 从动态中出现。对于角频率 $\\omega$ 的时间振荡目标，集体动力学随时间振荡，振荡幅度和相移由乘积 $\\omega \\tau$ 确定。\n\n对于旋转目标速度，还观察到解锁到不可适应状态的转变。", "authors": [{"name": "Gerhard Jung"}, {"name": "Eric Bertin"}], "featured_authors": [{"name": "Gerhard Jung"}, {"name": "Eric Bertin"}], "author_count": 2}, {"id": "2609.15854", "category": "cond-mat", "title": "Chiral Antiferromagnetism from Momentum-Space Resonance in a 2D Semiconductor", "abstract": "Understanding the principles governing the emergence of chiral quantum phases is a fundamental challenge, not only for uncovering new mechanisms of quantum-state formation but also for realizing giant electronic responses and transport phenomena arising from chirality and topology. While Fermi-surface instabilities in metals can stabilize complex ordered states through multiple competing scattering channels, their microscopic origin is often obscured by the complexity of the underlying electronic structure, limiting the development of general microscopic design principles. Here, we introduce a complementary strategy based on the simplicity of semiconductor band extrema. Using the layered van der Waals semiconductor GdGaI, whose low-energy electronic structure consists of simple electron and hole valleys, we discover the spontaneous emergence of an intertwined chiral triple-$q$ antiferromagnetic state accompanied by a cooperative reconstruction of the electron-hole band edges, beyond the conventional expectation of a single-$q$ ground state. This collective reconstruction generates substantial momentum-space Berry curvature, giving rise to a pronounced spontaneous anomalous Hall effect despite the semiconducting character and negligible net magnetization. Remarkably, this chiral state is realized within an atomically well-defined ($\\approx2a$), topologically nontrivial magnetic texture, showing that such collective quantum states can emerge at an exceptionally small length scale from a simple two-dimensional magnetic semiconductor. More broadly, our results introduce a remarkably simple design concept for chiral quantum matter: using simple semiconductor band extrema as building blocks for resonance-like interplay in momentum space, providing a route to Berry curvature, topological transport, and emergent quantum phases.", "url": "https://arxiv.org/abs/2609.15854", "type": "理论", "summary": "了解控制手性量子相出现的原理是一个根本性的挑战，不仅对于揭示量子态形成的新机制，而且对于实现由手性和拓扑产生的巨大电子响应和输运现象。虽然金属中的费米表面不稳定性可以通过多个竞争的散射通道稳定复杂的有序态，但它们的微观起源常常被底层电子结构的复杂性所掩盖，从而限制了一般微观设计原理的发展。在这里，我们引入一种基于半导体能带极值简单性的互补策略。使用层状范德华半导体GdGaI（其低能电子结构由简单的电子和空穴谷组成），我们发现自发出现的相互交织的手性三$q$反铁磁态，伴随着电子-空穴能带边缘的协同重建，超出了单$q$基态的传统预期。\n\n这种集体重建产生了大量的动量空间贝里曲率，尽管具有半导体特性和可忽略的净磁化强度，但仍产生明显的自发反常霍尔效应。值得注意的是，这种手性态是在原子上明确定义的（$\\approx2a$）、拓扑上非平凡的磁性纹理中实现的，这表明这种集体量子态可以从简单的二维磁性半导体中以极小的长度尺度出现。更广泛地说，我们的结果为手性量子物质引入了一个非常简单的设计概念：使用简单的半导体带极值作为动量空间中类似共振相互作用的构建块，为贝里曲率、拓扑输运和涌现量子相提供了一条途径。", "authors": [{"name": "R. Okuma"}, {"name": "T. Ikenobe"}, {"name": "Y. Fujisawa"}, {"name": "K. Yamagami"}, {"name": "H. C. H. Wu"}, {"name": "T. Nakamura"}, {"name": "Y. Ihara"}, {"name": "H. Ishikawa"}, {"name": "H. Suwa"}, {"name": "H. Ishizuka"}, {"name": "Y. Akagi"}, {"name": "T. Kaneko"}, {"name": "C. H. Hsu"}, {"name": "Y. Obata"}, {"name": "N. Tomoda"}, {"name": "M. Dronova"}, {"name": "K. Nagasawa"}, {"name": "H. Saito"}, {"name": "D. Ueta"}, {"name": "H. Sagayama"}, {"name": "J. Yamaura"}, {"name": "M. Arita"}, {"name": "K. Yogendra"}, {"name": "S. Ideta"}, {"name": "K. Kindo"}, {"name": "T. Nakajima"}, {"name": "S. J. Blundell"}, {"name": "T. Kondo"}, {"name": "K. Shimada"}, {"name": "Y. Okamoto"}, {"name": "Y. Okada"}], "featured_authors": [{"name": "R. Okuma"}, {"name": "T. Ikenobe"}, {"name": "Y. Fujisawa"}, {"name": "K. Shimada"}, {"name": "Y. Okamoto"}, {"name": "Y. Okada"}], "author_count": 31}, {"id": "2609.15891", "category": "cond-mat", "title": "Modulated structures in discrete approximations to a three-dimensional cholesteric model on a recursive lattice", "abstract": "We study finite-state approximations to a chiral nematic lattice model whose local directors are embedded in three-dimensional orientational space. The model analyzed here is formulated in terms of a rotated quadrupolar interaction, which provides a direct angular chirality parameter $\\Delta$ and reduces to the usual planar chiral-nematic form for directors confined to the xy plane. On a rooted Cayley tree, the statistical problem is written as a nonlinear recursion for branch partition functions. In the infinite-coordination limit, with $rJ_Q$ fixed, the recursion becomes a softmax map for the state probabilities. We analyze Cartesian three-state, planar four-state, and non-planar four-state discretizations. The first supports ordered and period-two attractors, whereas the planar four-state discretization displays a sequence of commensurate and longer-period modulated attractors. Its disordered fixed point loses stability at $t=9/16$ through a complex-conjugate pair with phase $q=\\pm 2\\Delta$, so a modulated critical mode is selected for every nonzero chirality. The non-planar four-state set is intrinsically anisotropic and, when the stated model is reconstructed directly, supports prominent period-three as well as period-two and higher-period cycles. Because attractor stability does not by itself establish global thermodynamic stability, the diagrams reported here are interpreted as attractor/stability diagrams rather than equilibrium phase diagrams.", "url": "https://arxiv.org/abs/2609.15891", "type": "理论+数值", "summary": "我们研究手性向列晶格模型的有限状态近似，该模型的局部指向矢嵌入三维取向空间中。这里分析的模型是根据旋转四极相互作用制定的，它提供了直接角手性参数$\\Delta$，并简化为限制在 xy 平面的指向矢的通常平面手性向列形式。在有根凯莱树上，统计问题被写为分支划分函数的非线性递归。在无限协调限制下，$rJ_Q$ 固定，递归变成状态概率的 softmax 映射。我们分析笛卡尔三态、平面四态和非平面四态离散化。第一个支持有序和周期二吸引子，而平面四态离散则显示一系列相称且周期较长的调制吸引子。其无序固定点通过相位 $q=\\pm 2\\Delta$ 的复共轭对在 $t=9/16$ 处失去稳定性，因此为每个非零手性选择调制临界模式。\n\n非平面四态集本质上是各向异性的，并且当直接重建所述模型时，支持突出的第三周期以及第二周期和更高周期的循环。由于吸引子稳定性本身并不建立全局热力学稳定性，因此此处报告的图被解释为吸引子/稳定性图而不是平衡相图。", "authors": [{"name": "William de Castilho"}], "featured_authors": [{"name": "William de Castilho"}], "author_count": 1}, {"id": "2609.15941", "category": "cond-mat", "title": "Fractional vortices in a spin-isotropic spiral spin liquid", "abstract": "Spiral spin liquids are magnetic states whose classical ground-state manifold consists of planar incommensurate spin spirals with wave vectors lying on a continuous ring or surface in reciprocal space. The resulting subextensive degeneracy suppresses magnetic long-range order and gives rise to liquid-like behavior. Despite numerous material realizations and theoretical investigations, the structure of low-temperature spin configurations of spin-isotropic Heisenberg spiral spin liquids has remained poorly understood. Here, we classify and characterize the classical topological defects supported by these systems. We uncover a rich family of vortex types involving concerted windings of spin directions, spiral-plane normals, and wave-vector orientations, yielding a $\\mathbb{Z} \\times \\mathbb{Z}_2$ classification. Remarkably, the elementary defects are half-vortices carrying fractional $2\\pi$ windings in both spin and momentum space and obey fusion rules resembling to those of Ising anyons. Large-scale classical simulat
