末日 EOW 膜解释为携带边界状态数据的物理接口。通过开发一个将共边组合映射到全息缝合的字典，我们表明欧几里得作用以及 Ryu 和 Takayanagi 处方一致地分离了通用边界熵 (log g)。应用复杂性作用提议，我们证明了相对重整化处方从惠勒和德威特作用中提取了相同的普遍贡献。最后，我们将分析扩展到 BTZ 黑洞，其中后期复杂性增长显示出通过膜张力对热内部动力学和边界条件的通用信息进行编码。", "authors": [{"name": "Fabiano F. Santos"}], "featured_authors": [{"name": "Fabiano F. Santos"}], "author_count": 1}, {"id": "2608.10667", "category": "hep-th", "title": "Tachyon couplings from S-matrix elements in bosonic string theory", "abstract": "We introduce a systematic framework for constructing spacetime and D-brane effective actions in bosonic string theory, encompassing both tachyon and massless modes. The actions are required to be gauge invariant and compatible with the expansion of sphere- and disk-level S-matrix elements. Our central proposal stipulates that, for each closed- or open-string channel, S-matrix poles involving an odd number of tachyons must be reproduced via an expansion in the effective action, whereas those with an even number of tachyons must be matched exactly. This criterion imposes strong selection rules: the bulk action contains only even powers of closed-string tachyon fields, and the D-brane action only even powers of open-string tachyon fields. In contrast, couplings of closed-string tachyons to D-branes are less constrained and allow both even and odd field multiplicities. As a concrete application, we analyze the disk-level amplitude involving two closed-string tachyons and demonstrate that the resulting linear and quadratic tachyon-D-brane interactions coincide precisely with those of type 0 theory. This is consistent with the duality between the orbifold of type 0 theory and the compactification of bosonic string theory on \\(T^{16}\\).", "url": "https://arxiv.org/abs/2608.10667", "type": "理论", "summary": "我们引入了一个系统框架，用于构建玻色弦理论中的时空和 D 膜有效作用，包括快子和无质量模式。这些动作需要规范不变并且与球体级和圆盘级 S 矩阵元素的扩展兼容。我们的中心提案规定，对于每个闭弦或开弦通道，涉及奇数个快子的 S 矩阵极点必须通过有效作用的扩展来再现，而那些具有偶数个快子的矩阵极点必须精确匹配。该标准强加了强选择规则：体作用仅包含闭弦快子场的偶次幂，而D膜作用仅包含开弦速子场的偶次次幂。相比之下，闭弦快子与 D 膜的耦合受到的限制较少，并且允许偶数场和奇数场多重性。作为一个具体应用，我们分析了涉及两个闭弦快子的盘级振幅，并证明了由此产生的线性和二次快子-D-膜相互作用与0型理论的相互作用完全一致。\n\n这与0型理论的轨道折叠和玻色弦理论在\\(T^{16}\\)上的紧化之间的对偶性是一致的。", "authors": [{"name": "Mohammad R. Garousi"}], "featured_authors": [{"name": "Mohammad R. Garousi"}], "author_count": 1}, {"id": "2608.10833", "category": "hep-th", "title": "False vacuum decay around black holes: calculation from first principles in the (3+1)-dimensional case", "abstract": "In $(3+1)$ spacetime dimensions, we numerically calculate the suppression exponent of the false vacuum decay probability in the presence of a thermal bath and a black hole.", "url": "https://arxiv.org/abs/2608.10833", "type": "理论", "summary": "在$(3+1)$时空维度中，我们数值计算了存在热浴和黑洞的情况下假真空衰变概率的抑制指数。", "authors": [{"name": "Ratmir Gazizov"}, {"name": "Dmitry Gorbunov"}, {"name": "Dmitry Levkov"}], "featured_authors": [{"name": "Ratmir Gazizov"}, {"name": "Dmitry Gorbunov"}, {"name": "Dmitry Levkov"}], "author_count": 3}, {"id": "2608.10840", "category": "hep-th", "title": "Monodromy defects in ABJM theory and integrability", "abstract": "We establish that supersymmetric monodromy defects in ABJM theory, also known as vortex loops, define integrable boundary states of the underlying alternating SU(4) spin chain. Exploiting the KT relation within the framework of the algebraic Bethe ansatz, we derive a closed-form expression for the leading-order one-point functions of non- protected operators in the presence of these defects. As a special case, our result reproduces the spin-chain overlap governing the three-point functions of two maximal giant gravitons and a single tiny graviton. We furthermore investigate the quantization of the theory in the defect background and compute the first quantum correction to the one-point functions in the simplest setting. Finally, we discuss possible extensions of our overlap formula.", "url": "https://arxiv.org/abs/2608.10840", "type": "理论", "summary": "我们建立了 ABJM 理论中的超对称单向缺陷（也称为涡环），定义了底层交替 SU(4) 自旋链的可积边界态。利用代数 Bethe ansatz 框架内的 KT 关系，我们导出了存在这些缺陷时非受保护算子的前导单点函数的封闭式表达式。作为一个特例，我们的结果再现了控制两个最大巨引力子和一个微小引力子的三点函数的自旋链重叠。我们还研究了缺陷背景下理论的量子化，并在最简单的设置下计算了对单点函数的第一次量子校正。最后，我们讨论重叠公式的可能扩展。", "authors": [{"name": "Charlotte Kristjansen"}, {"name": "Andrey Shusharin"}], "featured_authors": [{"name": "Charlotte Kristjansen"}, {"name": "Andrey Shusharin"}], "author_count": 2}, {"id": "2608.10861", "category": "hep-th", "title": "Anomalous symmetries in Kähler geometry", "abstract": "We initiate a study of centrally extended ($\\textit{anomalous}$) symmetries in Kähler geometry, focusing on the simplest, and most ubiquitous, Abelian case. In particular, we provide a local description of the geometry admitting such isometries. A long-standing no-go theorem asserts that there is an obstruction to gauging such symmetries in the purely Kähler framework. Utilizing the language of sypersymmetry, we then show that these symmetries may be gauged within the setup of generalized Kähler geometry. Our results may be applied to quotients, T-dualities, etc.", "url": "https://arxiv.org/abs/2608.10861", "type": "理论", "summary": "我们发起了一项关于凯勒几何中中心扩展（$\\textit{异常}$）对称性的研究，重点关注最简单、最普遍的阿贝尔情况。特别是，我们提供了允许这种等轴测的几何形状的局部描述。一个长期存在的不可行定理断言，在纯粹的凯勒框架中测量这种对称性存在障碍。然后，利用超对称性的语言，我们表明这些对称性可以在广义卡勒几何的设置中进行测量。我们的结果可以应用于商、T 对偶性等。", "authors": [{"name": "Dmitri Bykov"}, {"name": "Andrew Kuzovchikov"}], "featured_authors": [{"name": "Dmitri Bykov"}, {"name": "Andrew Kuzovchikov"}], "author_count": 2}, {"id": "2608.10871", "category": "hep-th", "title": "Gravitational Faraday rotation, gravitational spin Hall effect, and spin-refined causality analysis from Magnusian matrix in effective field theories of gravity", "abstract": "The effects of black hole's spin in effective field theories (EFTs) of gravity are explored through observables of wave scattering on black hole backgrounds in the geometric optics approximation. The considered observables are polarisation rotation angle, wavenumber kick (or deflection angle), and (Shapiro/Wigner--Smith) time delay, each of which are related to gravitational Faraday rotation, gravitational spin Hall effect, and infrared causality. The observables are computed from scattering amplitudes through the Magnusian formalism, where the Magnusian is promoted to a matrix to account for helicity information. It is found that (1) the gravitational spin Hall effect in EFTs of gravity are qualitatively different from that of general relativity due to \"noncommutative\" wavenumber kicks, and (2) black hole's spin slightly enhances the causality constraints on EFT coefficients.", "url": "https://arxiv.org/abs/2608.10871", "type": "理论", "summary": "通过几何光学近似中黑洞背景上波散射的可观测量，探索了引力有效场论（EFT）中黑洞自旋的影响。考虑的可观测量是偏振旋转角、波数冲击（或偏转角）和（夏皮罗/维格纳-史密斯）时间延迟，每一个都与引力法拉第旋转、引力自旋霍尔效应和红外因果关系有关。可观测量是通过马格努斯形式从散射幅度计算出来的，其中马格努斯被提升为矩阵以解释螺旋度信息。研究发现：（1）由于“非交换”波数冲击，引力 EFT 中的引力自旋霍尔效应与广义相对论有质的不同；（2）黑洞的自旋略微增强了 EFT 系数的因果约束。", "authors": [{"name": "Kibok Jeong"}, {"name": "Jung-Wook Kim"}, {"name": "Soochang Lee"}], "featured_authors": [{"name": "Kibok Jeong"}, {"name": "Jung-Wook Kim"}, {"name": "Soochang Lee"}], "author_count": 3}, {"id": "2608.10925", "category": "hep-th", "title": "A fermion primer", "abstract": "This is a review paper intended to illustrate a few critical issues concerning Dirac, Weyl and Majorana fermions and their differences. The first part consists in basic introductions to fermions, and more in detail to fermions in 4d, focusing in particular in what differentiate the three type of fermions: chirality, helicity, mass, field equations, properties under discrete symmetry transformations, Actions, Observables. On this basis we tackle a series of challenging and sometime controversial problems: the non-existence of Weyl fermion propagators, and the ways to circumvent it; the regularizations for Weyl fermion amplitudes, in particular the appropriateness of using the PV regularization; the definition of a functional integral for Weyl fermion, the difference between Weyl and massless Majorana fermions and the difference between the Dirac and Majorana mass terms. Most notably we come to the conclusion that the trick of replacing the non-existing Weyl fermion propagator with a massless Dirac one, although it may yield in some cases correct results, is flawed at the very origin by a logical loophole. We then show which is the correct way to proceed in this case. We consider also the topic of applying the Wick rotation at the classical Action level for Weyl fermions and conclude that this procedure leads to a nonequivalent theory. Finally, although anomalies are not the central focus here, we have deemed it useful to summarily review the relation, and its cohomological basis, that exists between the lack of a Weyl fermion propagator (non-invertibility of the Weyl-Dirac operator) and the appearance of dangerous anomalies in the theory.", "url": "https://arxiv.org/abs/2608.10925", "type": "理论", "summary": "这是一篇综述论文，旨在说明有关狄拉克、外尔和马约拉纳费米子及其差异的一些关键问题。第一部分包括对费米子的基本介绍，更详细地介绍 4d 中的费米子，特别关注三种类型费米子的区别：手性、螺旋性、质量、场方程、离散对称变换下的属性、动作、可观测量。在此基础上，我们解决了一系列具有挑战性和有时有争议的问题：外尔费米子传播器不存在，以及规避它的方法； Weyl 费米子振幅的正则化，特别是使用 PV 正则化的适当性；外尔费米子的泛函积分的定义、外尔费米子和无质量马约拉纳费米子之间的差异以及狄拉克和马约拉纳质量项之间的差异。最值得注意的是，我们得出的结论是，用无质量狄拉克传播器取代不存在的外尔费米子传播器的技巧虽然在某些情况下可能产生正确的结果，但从一开始就存在逻辑漏洞。然后我们将展示在这种情况下哪种是正确的处理方法。\n\n我们还考虑了在外尔费米子的经典作用水平上应用威克旋转的主题，并得出结论，该过程导致了不等价的理论。最后，虽然异常不是这里的中心焦点，但我们认为总结一下缺乏韦尔费米子传播器（韦尔-狄拉克算子的不可逆性）与理论中出现危险异常之间存在的关系及其上同调基础是有用的。", "authors": [{"name": "Loriano Bonora"}, {"name": "Roberto Soldati"}], "featured_authors": [{"name": "Loriano Bonora"}, {"name": "Roberto Soldati"}], "author_count": 2}, {"id": "2608.10982", "category": "hep-th", "title": "Vortices of the Hitchin Equations", "abstract": "The vortices that appear in Hitchin's pioneering study of Higgs bundles are interpreted as a new version of the abelian Higgs vortices more familiar to theoretical physicists. Their conformal covariance is made explicit.", "url": "https://arxiv.org/abs/2608.10982", "type": "理论", "summary": "希钦对希格斯束的开创性研究中出现的涡旋被解释为理论物理学家更熟悉的阿贝尔希格斯涡旋的新版本。它们的共形协方差变得明确。", "authors": [{"name": "Nicholas S. Manton"}], "featured_authors": [{"name": "Nicholas S. Manton"}], "author_count": 1}, {"id": "2608.11086", "category": "hep-th", "title": "Distance-Higuchi Bounds on Inflationary Field Ranges and Lifetimes", "abstract": "We show that quasi-de Sitter inflation driven by a nearly flat scalar potential has a finite polynomial lifespan dictated by the interplay between the swampland Distance Conjecture and the generalized Higuchi bound. By analyzing classical scalar rolling and quantum stochastic diffusion, we demonstrate that for any arbitrarily high but fixed statistical confidence, a universe cannot live longer than $\\sim \\min\\left\\{\\ln(\\frac{1}{H})\\frac{\\sqrt V}{V'},V^{-\\frac{d-1}{2}}\\ln^2(\\frac{1}{H})\\right\\}$ in reduced Planck units while remaining Higuchi-consistent, where $H$ is the Hubble parameter, $V$ is the scalar potential, $d$ is the number of spacetime dimensions, and prime denotes derivative with respect to the scalar field. This bound despite being weaker than the Trans-Planckian Censorship Conjecture, which has been argued for classical cosmologies that flow to the asymptotic of the field space without tunneling, is powerful given its minimal quantum gravity input and applicability to all points in the moduli space.", "url": "https://arxiv.org/abs/2608.11086", "type": "理论", "summary": "我们证明，由近乎平坦的标量势驱动的准德西特膨胀具有有限的多项式寿命，该寿命由沼泽距离猜想和广义 Higuchi 界限之间的相互作用决定。通过分析经典标量滚动和量子随机扩散，我们证明，对于任何任意高但固定的统计置信度，宇宙的寿命不能超过简化普朗克单位的 $\\sim \\min\\left\\{\\ln(\\frac{1}{H})\\frac{\\sqrt V}{V'},V^{-\\frac{d-1}{2}}\\ln^2(\\frac{1}{H})\\right\\}$，同时保持樋口一致，其中$H$ 是哈勃参数，$V$ 是标量势，$d$ 是时空维度的数量，prime 表示相对于标量场的导数。尽管这个界限弱于跨普朗克审查猜想（跨普朗克审查猜想一直被认为是流向场空间渐近而无需隧道效应的经典宇宙论），但鉴于其最小的量子引力输入和对模空间中所有点的适用性，该界限是强大的。", "authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Ignatios Antoniadis"}, {"name": "Alek Bedroya"}], "featured_authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Ignatios Antoniadis"}, {"name": "Alek Bedroya"}], "author_count": 3}, {"id": "2608.11129", "category": "hep-th", "title": "Moment of Inertia of an Interacting Bose Gas", "abstract": "The response of many-body quantum systems to rotation can be characterized by the moment of inertia. For a classical gas, the moment of inertia can be expressed as the integral of the enthalpy density multiplied by the squared radial distance from the rotation axis. In quantum field theory, the finite rotation in the grand canonical ensemble demands the causality bound. This constraint imposes technical challenges in treating transverse momenta discretized with the Bessel function zeros. However, we define the moment of inertia in the limit of zero angular velocity, in which the causality constraint is irrelevant and ordinary quantum field theoretical techniques can be applied. We evaluate the moment of inertia in the $\\phi^4$ theory and find that, surprisingly, the interacting effects including the ring-diagram resummation are consistent with the classical expectation and the moment of inertia density remains proportional to the enthalpy density.", "url": "https://arxiv.org/abs/2608.11129", "type": "理论", "summary": "多体量子系统对旋转的响应可以用惯性矩来表征。对于经典气体，惯性矩可以表示为焓密度乘以距旋转轴的径向距离的平方的积分。在量子场论中，大正则系综中的有限旋转需要因果关系界限。这一约束给处理用贝塞尔函数零点离散的横向动量带来了技术挑战。然而，我们在零角速度的极限下定义惯性矩，其中因果关系约束是不相关的，并且可以应用普通的量子场理论技术。我们评估了 $\\phi^4$ 理论中的转动惯量，令人惊讶地发现，包括环图恢复在内的相互作用效应与经典预期一致，并且转动惯量密度仍然与焓密度成正比。", "authors": [{"name": "Aleksandar Gecic"}, {"name": "Victor E. Ambrus"}, {"name": "Kenji Fukushima"}], "featured_authors": [{"name": "Aleksandar Gecic"}, {"name": "Victor E. Ambrus"}, {"name": "Kenji Fukushima"}], "author_count": 3}, {"id": "2608.10685", "category": "math-ph", "title": "Reflection Positivity in Free Fermionic Theories", "abstract": "Reflection positivity is one of the Osterwalder--Schrader axioms for Euclidean quantum field theory, ensuring that the reconstructed relativistic Hilbert space carries a positive-definite inner product. For free fermionic theories whose covariance is a real rational function of the Dirac operator, we prove that reflection positivity holds if and only if all poles are real, simple, and carry non-negative residues. We also explicitly show the failure of reflection positivity for covariances with exponential regulators.", "url": "https://arxiv.org/abs/2608.10685", "type": "理论", "summary": "反射正性是欧几里得量子场论的奥斯特瓦尔德-施拉德公理之一，确保重建的相对论希尔伯特空间具有正定内积。对于协方差是狄拉克算子的实有理函数的自由费米子理论，我们证明当且仅当所有极点都是实数、简单且带有非负留数时，反射正性才成立。我们还明确地表明了指数调节器协方差反射正性的失败。", "authors": [{"name": "Carl Handrack"}, {"name": "Manfred Salmhofer"}], "featured_authors": [{"name": "Carl Handrack"}, {"name": "Manfred Salmhofer"}], "author_count": 2}, {"id": "2608.10797", "category": "math-ph", "title": "Emergence of fractal structures from breather interactions in the $(2+1)$-dimensional Konopelchenko--Dubrovsky equation", "abstract": "Fractal structures generated through nonlinear breather interactions are investigated for the $(2+1)$-dimensional Konopelchenko--Dubrovsky (KD) equation by means of the Hirota bilinear method. The bilinear form of the system is first derived, after which breather interaction solutions are constructed analytically through suitable auxiliary functions. It is shown that the interaction of breather waves in the coupled nonlinear environment gives rise to highly intricate multiscale patterns exhibiting self-similar behaviour under successive magnification. To characterize the geometric complexity of the obtained structures, a three-dimensional voxel-based box-counting method is employed. The computed dimensions are found to be non-integer, confirming the fractal nature of the generated patterns. In addition, relative error analysis, standard error estimation, bootstrap standard deviation and convergence analysis are performed to examine the robustness and reproducibility of the estimated dimensions. The present work suggests that nonlinear breather interactions in coupled dispersive systems may provide a natural mechanism for the emergence of fractal geometries and complex multiscale structures. The combined analytical and quantitative framework developed here may provide further insight into nonlinear energy localization and scale-dependent structures arising in fluid dynamics, plasma physics and nonlinear wave propagation.", "url": "https://arxiv.org/abs/2608.10797", "type": "理论", "summary": "通过 Hirota 双线性方法，研究了 $(2+1)$ 维 Konopelchenko-Dubrovsky (KD) 方程中通过非线性呼吸相互作用生成的分形结构。首先导出系统的双线性形式，然后通过适当的辅助函数分析构建呼吸器相互作用解。结果表明，耦合非线性环境中呼吸波的相互作用产生了高度复杂的多尺度图案，在连续放大下表现出自相似行为。为了表征所获得的结构的几何复杂性，采用了基于三维体素的盒计数方法。发现计算出的维度不是整数，证实了生成图案的分形性质。此外，还进行相对误差分析、标准误差估计、引导标准差和收敛分析，以检查估计维度的稳健性和再现性。\n\n目前的工作表明，耦合色散系统中的非线性呼吸相互作用可能为分形几何和复杂多尺度结构的出现提供自然机制。这里开发的组合分析和定量框架可以进一步深入了解流体动力学、等离子体物理学和非线性波传播中出现的非线性能量局域化和尺度相关结构。", "authors": [{"name": "Snehalata Nasipuri"}, {"name": "Prasanta Chatterjee"}, {"name": "Saugata Dutta"}], "featured_authors": [{"name": "Snehalata Nasipuri"}, {"name": "Prasanta Chatterjee"}, {"name": "Saugata Dutta"}], "author_count": 3}, {"id": "2608.11106", "category": "math-ph", "title": "The Renormalization Group as a Stochastic Exploration Process", "abstract": "The Renormalization Group (RG) is a powerful and versatile framework for analyzing complex physical systems. Here, we reinterpret it as a stochastic process that explores physical phase spaces, scale by scale, progressively revealing finer details of small-scale structures. This perspective establishes a natural connection to other random exploration processes, such as the Schramm-Loewner evolution, and is more suited for a probabilist audience. It links RG concepts such as RG transformations, effective actions, etc, to usual probabilistic tools such as conditional expectation values, martingales, etc, but also makes contact with stochastic quantization.", "url": "https://arxiv.org/abs/2608.11106", "type": "理论", "summary": "重整化群 (RG) 是一个强大且通用的框架，用于分析复杂的物理系统。在这里，我们将其重新解释为一个随机过程，逐个尺度地探索物理相空间，逐步揭示小尺度结构的更精细细节。这种观点与其他随机探索过程（例如 Schramm-Loewner 演化）建立了自然的联系，并且更适合概率论受众。它将 RG 概念（例如 RG 变换、有效行动等）与常用的概率工具（例如条件期望值、鞅等）联系起来，同时也与随机量化建立了联系。", "authors": [{"name": "Denis Bernard"}], "featured_authors": [{"name": "Denis Bernard"}], "author_count": 1}, {"id": "2608.11128", "category": "math-ph", "title": "Nonlinear systems of PDEs admitting infinite-dimensional Lie algebras and their connection with Ricci flows. II: The two-dimensional space case", "abstract": "The work is a natural continuation of that published in Stud Appl Math. 2024; 153:e12737. All possible two-components evolutions systems of (1+2)-dimensional second-order PDEs admitting an infinite-dimensional Lie algebra are constructed. It is shown that a natural generalisation of this Lie algebra to the higher-dimensional case does not lead to a more general result because the infinite-dimensional symmetry is broken. The recently derived system, which is related to Ricci flows, is identified as a very particular case among the evolution systems obtained. All possible stationary solutions of this system in the radially symmetric case are constructed using the surprisingly rich Lie algebra of the reduced system of ODEs. Moreover, it is proved that this Lie algebra is reducible to the fifteen-dimensional algebra of the simplest system of two second-order ODEs. Several time-dependent exact solutions in the radially symmetric case are constructed as well. It is shown that the solutions obtained are bounded and smooth provided arbitrary parameters are correctly specified.", "url": "https://arxiv.org/abs/2608.11128", "type": "理论", "summary": "这项工作是《Stud Appl Math》上发表的工作的自然延续。 2024； 153：e12737。构造了所有可能的承认无限维李代数的(1+2)维二阶偏微分方程的双分量演化系统。结果表明，将该李代数自然推广到高维情况不会导致更一般的结果，因为无限维对称性被破坏。最近导出的与 Ricci 流相关的系统被认为是所获得的演化系统中的一个非常特殊的情况。在径向对称情况下，该系统的所有可能的平稳解都是使用常微分方程简化系统中极其丰富的李代数来构造的。此外，还证明了该李代数可简化为最简单的两个二阶常微分方程组的十五维代数。还构造了径向对称情况下的几个与时间相关的精确解。结果表明，如果正确指定任意参数，所获得的解是有界且平滑的。", "authors": [{"name": "Roman Cherniha"}, {"name": "John R. King"}], "featured_authors": [{"name": "Roman Cherniha"}, {"name": "John R. King"}], "author_count": 2}, {"id": "2608.10013", "category": "quant-ph", "title": "RF-Budgeted Frame Compilation for Frequency-Multiplexed Superconducting-Qubit Control Using Qubit-Control Identity Records and a Circuit-Informed RFSoC Model", "abstract": "Frequency-multiplexed superconducting-qubit control requires more than carrier assignment: the RF budget of a shared source can perturb multi-qubit rotations through finite bandwidth, crest factor, clipping, quantization, jitter, spurs, compression, crosstalk, and leakage. We present an RF-budgeted frame-compilation and validation workflow that combines qubit-control identity (QID) records, a MATLAB/Simulink-based circuit-informed RFSoC source-chain model, QuTiP qutrit dynamics, and Qiskit-derived algorithm workloads. QID records encode qubit-specific computational and leakage transition frequencies, pulse parameters, and drive-scale calibration, while the RF-chain profile and effective crosstalk-coupling matrix are provided as separate compiler inputs. Candidate multitone RF frames are scheduled under RF-budget constraints, propagated through the RFSoC model, decoded into computational and leakage transition frames, and evaluated in QuTiP for rotation error, leakage-aware fidelity, computational-subspace survival, and transient leakage. The studies progress from single-qutrit pulse closure to pairwise coexistence, multitone RF-frame capacity, and Bernstein-Vazirani (BV) and QAOA microwave layers extracted from Qiskit circuits. The simulations show that longer pulses improve per-frame aggregation but do not necessarily minimize time-normalized layer cost; clustered frequency maps, larger rotations, and multitone leakage stacking tighten closure. Under the nominal RF budget, a Qiskit-derived 12-qubit BV -Y90 layer closes in three validated four-tone frames at 240 ns, while QAOA mixer partitions vary with rotation angle and pulse duration. All reported results are model-based, decoherence-free simulation diagnostics rather than measured hardware fidelities or wiring-reduction claims.", "url": "https://arxiv.org/abs/2608.10013", "type": "理论+数值", "summary": "频率复用超导量子位控制需要的不仅仅是载波分配：共享源的射频预算可以通过有限带宽、波峰因数、削波、量化、抖动、杂散、压缩、串扰和泄漏来扰乱多量子位旋转。我们提出了一种 RF 预算框架编译和验证工作流程，该工作流程结合了量子位控制身份 (QID) 记录、基于 MATLAB/Simulink 的电路通知 RFSoC 源链模型、QuTiP qutrit 动力学和 Qiskit 派生的算法工作负载。 QID 记录对特定于量子位的计算和泄漏过渡频率、脉冲参数和驱动规模校准进行编码，而 RF 链配置文件和有效串扰耦合矩阵作为单独的编译器输入提供。候选多音 RF 帧在 RF 预算约束下进行调度，通过 RFSoC 模型传播，解码为计算和泄漏过渡帧，并在 QuTiP 中评估旋转误差、泄漏感知保真度、计算子空间生存和瞬态泄漏。\n\n研究进展从单量子脉冲闭合到成对共存、多音射频帧容量以及从 Qiskit 电路中提取的 Bernstein-Vazirani (BV) 和 QAOA 微波层。模拟表明，较长的脉冲可以改善每帧聚合，但不一定能最小化时间归一化层成本；聚集的频率图、更大的旋转和多音泄漏叠加收紧闭合。在标称 RF 预算下，Qiskit 衍生的 12 量子位 BV -Y90 层在 240 ns 时以三个经过验证的四音帧结束，而 QAOA 混频器分区随旋转角度和脉冲持续时间而变化。所有报告的结果都是基于模型的、无退相干的模拟诊断，而不是测量的硬件保真度或减少接线的声明。", "authors": [{"name": "Mingqi Ge"}, {"name": "Anne-Marie Valente-Feliciano"}], "featured_authors": [{"name": "Mingqi Ge"}, {"name": "Anne-Marie Valente-Feliciano"}], "author_count": 2}, {"id": "2608.10019", "category": "quant-ph", "title": "Local Complex Dependence and Separability in Madelung Hydrodynamics", "abstract": "For a many-particle pure state in a fixed position representation, we consider the mixed cross-particle derivatives of the logarithm of the wave function. Their real part is one half of the Holland-Wang local dependence function of the configuration density, while their imaginary part is the cross-Jacobian of the Madelung velocity field. On a node-free product region, vanishing of all cross blocks throughout the region is equivalent to local multiplicative separability. Under Schrodinger evolution with a real scalar potential, the initial growth of a cross block from a separable state is sourced by the corresponding mixed Hessian of the potential and is purely imaginary to first order in time. The construction is a local separability and dependence diagnostic, rather than a basis-independent entanglement measure.", "url": "https://arxiv.org/abs/2608.10019", "type": "理论", "summary": "对于固定位置表示中的多粒子纯态，我们考虑波函数对数的混合跨粒子导数。它们的实部是构型密度的 Holland-Wang 局域相关函数的二分之一，而虚部是马德隆速度场的正交雅可比行列式。在无节点乘积区域上，整个区域中所有交叉块的消失相当于局部乘法可分性。在具有实标量势的薛定谔演化下，可分离态的交叉块的初始增长源自势的相应混合海森矩阵，并且在时间上是纯虚数的一阶。该构造是局部可分离性和依赖性诊断，而不是独立于基础的纠缠测量。", "authors": [{"name": "Lorenzo Pirovano"}], "featured_authors": [{"name": "Lorenzo Pirovano"}], "author_count": 1}, {"id": "2608.10069", "category": "quant-ph", "title": "Coupled-Layer Codes: Beyond Quantum Product Constructions", "abstract": "Product codes are an important class of quantum error-correcting codes constructed from multiple input codes, which can give rise to asymptotically good quantum low-density parity check codes. In previous work, we showed how the product between two codes can be physically implemented by coupling layers of the first code using checks of the second code. In this work, we further unify product code constructions with coupled-layer constructions of phases of matter by introducing coupled-layer codes. The essential strategy is to condense general excitations created by Pauli operators among multiple decoupled layers of the first code. The condensation is specified by an excitation algebra, which encodes the excitations, along with an algebra-preserving map. This coupling between layers generalizes the notion of gauging in physics as well as the mapping cone in homological algebra, and can be used to produce non-CSS codes. As examples, we show how coupled-layer codes reproduce the X-cube and Chamon models. We further generalize the balanced product code by allowing a unitary transformation in addition to a group action by free permutation and describe its corresponding coupled-layer construction. In particular, we show how balancing by a ZX-duality can reproduce non-CSS codes such as the fermionic toric code and the 3-fermion Walker-Wang model in 3D.", "url": "https://arxiv.org/abs/2608.10069", "type": "理论", "summary": "乘积码是一类重要的量子纠错码，由多个输入码构造而成，可以产生渐近良好的量子低密度奇偶校验码。在之前的工作中，我们展示了如何使用第二个代码的检查通过第一个代码的耦合层来物理实现两个代码之间的乘积。在这项工作中，我们通过引入耦合层代码进一步将产品代码结构与物相的耦合层结构统一起来。基本策略是将泡利算子创建的一般激励压缩到第一个代码的多个解耦层中。凝聚由对激励进行编码的激励代数以及代数保留图来指定。这种层之间的耦合概括了物理学中的测量概念以及同调代数中的映射锥，并且可用于生成非 CSS 代码。作为示例，我们展示了耦合层代码如何重现 X 立方体和 Chamon 模型。\n\n除了自由排列的群动作之外，我们还通过允许酉变换来进一步推广平衡乘积代码，并描述其相应的耦合层结构。特别是，我们展示了通过 ZX 对偶性进行平衡如何在 3D 中重现非 CSS 代码，例如费米子环面代码和 3-费米子 Walker-Wang 模型。", "authors": [{"name": "Shuyu Zhang"}, {"name": "Tzu-Chieh Wei"}, {"name": "Nathanan Tantivasadakarn"}], "featured_authors": [{"name": "Shuyu Zhang"}, {"name": "Tzu-Chieh Wei"}, {"name": "Nathanan Tantivasadakarn"}], "author_count": 3}, {"id": "2608.10075", "category": "quant-ph", "title": "Phase diagram of lasing under correlated pump from GPU-accelerated Truncated Wigner dynamics", "abstract": "Superradiant (SR) lasers store optical coherence in the atomic medium rather than the cavity field, but the incoherent drive that sustains inversion imposes a trade-off: local pumping yields coherent light at a rate that grows linearly with the atom number $N$, heating the medium through photon recoil, whereas fully collective pumping removes this scaling but limits the emission to partial coherence. We interpolate between these limits employing a spatially correlated pump on a chain of $N$ two-level atoms, with rates decaying with distance between atoms as a power law of exponent $\\alpha$. To study systems beyond the reach of exact solutions, we employ the Truncated Wigner Approximation (TWA), whose independent trajectories are ideally suited to GPU parallelism. Harnessing this, we perform a full scan of the steady-state observables for up to $10^4$ atoms at a computational cost that is practical. Our findings indicate that ultra-narrow emission persists for all $\\alpha$, while the coherence improves as the pump becomes shorter ranged, with $g^{(2)} \\to 1$ surviving at least down to $\\alpha \\approx 1$, indicating that fully coherent light thus does not require local pumping. The drive strength needed for lasing is reduced by a factor $N^{1-\\alpha}$ for $\\alpha < 1$, and by $\\log N$ as $\\alpha \\to 1$, parametrically suppressing recoil heating; notably, $\\alpha = 1$ matches the far-field envelope of dissipative couplings in free space. The correlation range of the pump thus acts as a knob trading drive intensity, and the heating it causes, against optical coherence.", "url": "https://arxiv.org/abs/2608.10075", "type": "理论+数值", "summary": "超辐射（SR）激光器将光学相干性存储在原子介质而不是腔场中，但维持反转的非相干驱动会带来一种权衡：局部泵浦以随原子数$N$线性增长的速率产生相干光，通过光子反冲加热介质，而完全集体泵浦消除了这种缩放，但将发射限制为部分相干。我们在 $N$ 两级原子链上使用空间相关泵在这些限制之间进行插值，速率随着原子之间的距离衰减，作为指数 $\\alpha$ 的幂律。为了研究超出精确解范围的系统，我们采用了截断维格纳近似 (TWA)，其独立轨迹非常适合 GPU 并行性。利用这一点，我们以实用的计算成本对高达 10^4$ 原子的稳态可观测量进行全面扫描。我们的研究结果表明，超窄发射对于所有 $\\alpha$ 都持续存在，而随着泵浦距离变短，相干性会提高，$g^{(2)} \\to 1$ 至少存活到 $\\alpha \\approx 1$，这表明完全相干光因此不需要局部泵浦。\n\n当 $\\alpha < 1$ 时，激光发射所需的驱动强度减少 $N^{1-\\alpha}$，当 $\\alpha \\to 1$ 时，减少 $\\log N$，以参数方式抑制反冲加热；值得注意的是，$\\alpha = 1$ 与自由空间中耗散耦合的远场包络相匹配。因此，泵浦的相关范围充当了调节驱动强度及其引起的热量与光学相干性的旋钮。", "authors": [{"name": "Oksana Chelpanova"}, {"name": "Martino Stefanini"}, {"name": "Michael O'Keeffe"}, {"name": "Jamir Marino"}], "featured_authors": [{"name": "Oksana Chelpanova"}, {"name": "Martino Stefanini"}, {"name": "Michael O'Keeffe"}, {"name": "Jamir Marino"}], "author_count": 4}, {"id": "2608.10078", "category": "quant-ph", "title": "Eliminating photon transport in long-baseline optical interferometry using quantum memories", "abstract": "In this paper, we describe the fundamental operating mechanisms of optical interferometry using quantum memory and entanglement. We show how these remove the optical delay line bottleneck. Quantum memory is not without its own set of challenges, some of which include very small bandwidths as well as limitations in storage time. We examine the influence of timing artifacts on memory photon capture probability and interferometric complex visibility. We highlight keystone areas of technology that require further development and are essential to realizing these opportunities, as well as ongoing work to overcome these challenges.", "url": "https://arxiv.org/abs/2608.10078", "type": "理论", "summary": "在本文中，我们描述了使用量子存储和纠缠的光学干涉测量的基本操作机制。我们展示了它们如何消除光学延迟线瓶颈。量子存储器也面临着一系列挑战，其中一些挑战包括非常小的带宽以及存储时间的限制。我们研究了定时伪影对记忆光子捕获概率和干涉复数可见性的影响。我们重点介绍需要进一步发展且对于实现这些机遇至关重要的关键技术领域，以及为克服这些挑战而正在进行的工作。", "authors": [{"name": "Yousef K. Chahine"}, {"name": "Chaohan Cui"}, {"name": "William DeRocco"}, {"name": "Daniel Gottesman"}, {"name": "Saikat Guha"}, {"name": "Emil T. Khabiboulline"}, {"name": "Zhenning Liu"}, {"name": "Brittany McClinton"}, {"name": "Jayadev Rajagopal"}, {"name": "Fredrik Rantakyro"}, {"name": "J. Gabriel Richardson"}, {"name": "Stephen Ridgway"}, {"name": "Aqil Sajjad"}, {"name": "Joohyung Song"}], "featured_authors": [{"name": "Yousef K. Chahine"}, {"name": "Chaohan Cui"}, {"name": "William DeRocco"}, {"name": "Stephen Ridgway"}, {"name": "Aqil Sajjad"}, {"name": "Joohyung Song"}], "author_count": 14}, {"id": "2608.10087", "category": "quant-ph", "title": "Long-lived memory effects in the defect bath of superconducting qubits", "abstract": "We reveal long-lived memory effects in the defect bath of a superconducting transmon qubit through electric-field tuning of two-level system (TLS) defects coupled to the qubit. Using a fast TLS mapping method we observe several hysteretic effects in the TLS environment with memory timescales of the order of seconds, far beyond the lifetimes of individual TLS defects. The observations can be explained by TLS coupling to electric field-polarised charge fluctuators in the defect bath. Our method enables detailed mapping of the dynamics of the bath's coupled microscopic degrees of freedom and the associated memory effects which can introduce temporally correlated noise. This information may be used to improve qubit-stabilisation and quantum error correction protocols.", "url": "https://arxiv.org/abs/2608.10087", "type": "理论", "summary": "我们通过耦合到量子位的两能级系统（TLS）缺陷的电场调谐揭示了超导跨量子位的缺陷池中的长寿命记忆效应。使用快速 TLS 映射方法，我们观察到 TLS 环境中的几种滞后效应，其内存时间尺度为秒级，远远超出了单个 TLS 缺陷的生命周期。这些观察结果可以通过 TLS 与缺陷槽中电场极化电荷波动器的耦合来解释。我们的方法能够详细映射浴耦合微观自由度的动态以及相关的记忆效应，这些效应可能会引入时间相关的噪声。该信息可用于改进量子位稳定性和量子纠错协议。", "authors": [{"name": "Abhishek Agarwal"}, {"name": "Masum Uddin"}, {"name": "Shroya Vaidya"}, {"name": "Lachlan P. Lindoy"}, {"name": "Ehsaneh Daghigh Ahmadi"}, {"name": "Tobias Lindström"}, {"name": "Sebastian E. de Graaf"}, {"name": "Ivan Rungger"}], "featured_authors": [{"name": "Abhishek Agarwal"}, {"name": "Masum Uddin"}, {"name": "Shroya Vaidya"}, {"name": "Tobias Lindström"}, {"name": "Sebastian E. de Graaf"}, {"name": "Ivan Rungger"}], "author_count": 8}, {"id": "2608.10118", "category": "quant-ph", "title": "Bounds for Apparent Second-Law Violations in Quantum Trajectories", "abstract": "Negative stochastic entropy production is commonly called an apparent violation of the second law. In general quantum-trajectory dynamics, however, the physical entropy production $\\sigma$ need not obey a forward detailed fluctuation theorem. A general arbitrary-coupling formulation identifies a dynamical-asymmetry term $\\sigma^\\ast$ that completes it into $\\Omega=\\sigma+\\sigma^\\ast$, whose mean is $\\langle\\Omega\\rangle=\\Sigma+\\Sigma^\\ast$. We prove that the likelihood-ratio sign is optimal among reversal-odd trajectory observables and use this fact to transfer an established sharp fluctuation-theorem floor to the tie-corrected physical sign statistic $\\Pi_\\sigma=\\Pr(\\sigma<0)+\\Pr(\\sigma=0)/2$. When $\\Pr(\\sigma=0)=0$, the result reads $\\Pr(\\sigma<0)\\ge[1-\\langle\\Omega\\rangle/g(\\langle\\Omega\\rangle)]/2$, where $g$ is the inverse of $a\\mapsto a\\tanh(a/2)$. The physical integral fluctuation theorem simultaneously suppresses large negative events, producing a quantitative ``frequent but mild'' law, while the sign imbalance lower-bounds the hidden mean $\\Sigma^\\ast$. We formulate the measured-record protocol explicitly and illustrate and numerically audit the tie-corrected theorem in random finite-coupling collision models and a coherently driven qubit interacting with thermal ancillas.", "url": "https://arxiv.org/abs/2608.10118", "type": "理论+数值", "summary": "负随机熵的产生通常被称为明显违反第二定律。然而，在一般的量子轨迹动力学中，物理熵产生 $\\sigma$ 不需要遵守前向详细涨落定理。一般的任意耦合公式确定了一个动态不对称项$\\sigma^\\ast$，将其补充为$\\Omega=\\sigma+\\sigma^\\ast$，其平均值为$\\langle\\Omega\\rangle=\\Sigma+\\Sigma^\\ast$。我们证明似然比符号在反转奇数轨迹可观测量中是最优的，并利用这一事实将已建立的急剧波动定理底转移到平局校正物理符号统计量 $\\Pi_\\sigma=\\Pr(\\sigma<0)+\\Pr(\\sigma=0)/2$。当$\\Pr(\\sigma=0)=0$时，结果为$\\Pr(\\sigma<0)\\ge[1-\\langle\\Omega\\rangle/g(\\langle\\Omega\\rangle)]/2$，其中$g$是$a\\mapsto a\\tanh(a/2)$的倒数。物理积分涨落定理同时抑制了大的负面事件，产生了“频繁但温和”的定量定律，而符号不平衡则限制了隐藏平均值 $\\Sigma^\\ast$ 的下限。\n\n我们明确地制定了测量记录协议，并说明和数值审核了随机有限耦合碰撞模型中的平局校正定理以及与热辅助相互作用的相干驱动的量子位。", "authors": [{"name": "Domingos S. P. Salazar"}], "featured_authors": [{"name": "Domingos S. P. Salazar"}], "author_count": 1}, {"id": "2608.10202", "category": "quant-ph", "title": "Unextendible stabiliser bases", "abstract": "We study incomplete sets of orthogonal stabiliser states that cannot be extended by a further stabiliser state orthogonal to all of its members. Such sets are the stabiliser analogue of unextendible product bases (UPBs), and we thus call them unextendible stabiliser bases (USBs). Leveraging the symplectic geometry underlying the $n$-qudit Pauli group in prime local dimension, we explicitly construct USBs for systems of four qubits and three qudits of odd prime local dimension. Moreover, we show that these are the respective minimal qubit, respectively qudit numbers for which such bases exist, and that USBs exist for all $n\\geq4$ qubit and for all $n\\geq3$ odd-prime-dimensional qudit systems. Finally, we compare the resource-theoretic aspects of USBs with those of UPBs. We establish that, analogous to the case of UPBs, the orthogonal complement of every unextendible stabiliser set is a stabiliser-free subspace, and its normalised projector is necessarily magic; moreover, it is bound magic in odd prime dimension, yet need not be for qubits. We also show that USB unextendibility alone imposes no uniform quantitative obstruction to discrimination by stabiliser operations.", "url": "https://arxiv.org/abs/2608.10202", "type": "理论", "summary": "我们研究不完整的正交稳定器状态集，这些状态不能通过与其所有成员正交的进一步稳定器状态进行扩展。此类套件是不可扩展产品底座 (UPB) 的稳定器类似物，因此我们将其称为不可扩展稳定器底座 (USB)。利用素数局部维度中 $n$-qudit Pauli 群基础的辛几何，我们显式地为四个量子位和三个奇数素数局部维度的 qudits 的系统构造 USB。此外，我们证明这些是各自的最小量子位，分别是存在此类基数的 qudit 数，并且所有 $n\\geq4$ 量子位和所有 $n\\geq3$ 奇素数维 qudit 系统都存在 USB。最后，我们将 USB 与 UPB 的资源理论方面进行比较。我们确定，与 UPB 的情况类似，每个不可扩展稳定器集的正交补集都是无稳定器子空间，并且其归一化投影仪必然是魔法的；此外，它是奇数素数维度中的束缚魔法，但不一定适用于量子位。我们还表明，USB 不可扩展性本身并没有对稳定器操作的歧视造成统一的定量障碍。", "authors": [{"name": "Markus Frembs"}], "featured_authors": [{"name": "Markus Frembs"}], "author_count": 1}, {"id": "2608.10334", "category": "quant-ph", "title": "Wave-particle-mixedness redistribution in Schwarzschild spacetime", "abstract": "The redistribution of the wave feature, particle feature, and mixedness is investigated for two-qubit isotropic states in Schwarzschild spacetime under Hawking radiation and environmental decoherence. It is shown that Hawking radiation changes their relative weights among different horizon regions rather than simply suppressing them. The analysis is further extended to phase damping, phase flip, and bit flip channels. Phase damping monotonically suppresses the wave feature and enhances mixedness, phase flip produces a symmetric death-and-revival behavior of the wave feature, and bit flip mainly reshapes the particle feature and mixedness through diagonal population redistribution. However, although Hawking radiation and channel noise affect the distribution of wave feature, particle feature, and mixedness in the subsystems, the triality relation among them still holds and remains unaffected by thermal and environmental noises.", "url": "https://arxiv.org/abs/2608.10334", "type": "理论", "summary": "研究了霍金辐射和环境退相干下史瓦西时空中两个量子位各向同性态的波特征、粒子特征和混合性的重新分布。结果表明，霍金辐射改变了不同视界区域之间的相对权重，而不是简单地抑制它们。该分析进一步扩展到相位阻尼、相位翻转和位翻转通道。相位阻尼单调抑制波动特征并增强混合性，相位翻转产生波动特征的对称死与复活行为，位翻转主要通过对角总体重新分布来重塑粒子特征和混合性。然而，尽管霍金辐射和通道噪声影响子系统中波特征、粒子特征和混合度的分布，但它们之间的三重关系仍然成立，并且不受热和环境噪声的影响。", "authors": [{"name": "Sumeng Wang"}, {"name": "Xiaofen Huang"}], "featured_authors": [{"name": "Sumeng Wang"}, {"name": "Xiaofen Huang"}], "author_count": 2}, {"id": "2608.10365", "category": "quant-ph", "title": "Symmetrized Block-Product Periodic Marginals in Infinite Translation-Invariant Quantum Chains", "abstract": "We study local marginals in one-dimensional translation-invariant quantum systems that may hide finite-period structure. Given an $n$-site reduced density matrix, we ask whether it can be obtained by repeating a finite $p$-site block state along the chain and averaging over the $p$ lattice translations. This defines a symmetrized block-product periodic marginal problem, which provides a route both to diagnosing hidden periodic order from local data and to upper bounding ground-state energy densities of infinite translation-invariant local Hamiltonians. We develop two complementary methods. The first is a semidefinite-programming relaxation based on block permutation symmetry and positive partial transpose constraints, which outer-approximates the convex hull of such marginals and yields certified infeasibility tests. The second is a symmetrized matrix product state ansatz, which constructs explicit block-product periodic states and gives variational upper bounds. We benchmark the framework on the Majumdar-Ghosh model, transverse-field Ising, XX, XXZ, and contextuality-related spin models. The results show that the method captures the expected finite-period structure in exactly solvable cases and gives systematically improving variational energies as the period and bond dimension increase. We also formulate a periodic-NPA relaxation for translation-invariant contextuality witnesses and recover the known quantum limits in the tested examples.", "url": "https://arxiv.org/abs/2608.10365", "type": "理论+数值", "summary": "我们研究可能隐藏有限周期结构的一维平移不变量子系统中的局部边缘。给定一个 $n$ 位降密度矩阵，我们询问是否可以通过沿链重复有限的 $p$ 位块状态并对 $p$ 晶格平移求平均值来获得它。这定义了一个对称的块积周期性边际问题，它提供了一种从局部数据诊断隐藏周期顺序和无限平移不变局部哈密顿量的上界基态能量密度的途径。我们开发了两种互补的方法。第一个是基于块置换对称性和正部分转置约束的半定规划松弛，其外部逼近此类边际的凸包并产生经过认证的不可行性测试。第二个是对称矩阵乘积状态 ansatz，它构造显式的块乘积周期状态并给出变分上限。我们在 Majumdar-Ghosh 模型、横向场 Ising、XX、XXZ 和上下文相关自旋模型上对框架进行基准测试。\n\n结果表明，该方法在完全可解的情况下捕获了预期的有限周期结构，并随着周期和键维数的增加系统地改进了变分能量。我们还为平移不变上下文见证制定了周期性 NPA 松弛，并恢复了测试示例中的已知量子极限。", "authors": [{"name": "Xiao Zeng"}, {"name": "Kaiyan Yang"}, {"name": "Lingxia Zhang"}, {"name": "Zizhu Wang"}], "featured_authors": [{"name": "Xiao Zeng"}, {"name": "Kaiyan Yang"}, {"name": "Lingxia Zhang"}, {"name": "Zizhu Wang"}], "author_count": 4}, {"id": "2608.10540", "category": "quant-ph", "title": "State-Dependent Visibility of Non-Commutative Ordering in Quantum Dynamics", "abstract": "A nonzero commutator proves that two orderings differ as operators, but it does not ensure that a physical state can reveal the difference. We ask when non-Abelian ordering information becomes dynamically invisible. For Hermitian operators $B$ and $C$, we compare the evolutions generated by the opposite-order products $M=(B+iC)(B-iC)$ and $\\widetilde M=(B-iC)(B+iC)$, and define their operational visibility from the minimum overlap of the output states over a normalized time window. This visibility bounds the difference produced by the two orderings in every observable on the chosen state. An exact one-qubit solution shows that the same fixed pair can be perfectly invisible in one state and visible in another. We then keep the ordered generators fixed and vary only the many-body ground state across a quantum phase transition. The same ordering difference is nearly invisible in one regime and clearly visible in the other. Moreover, states with identical leading quadratic decay can develop sharply different finite-time visibility because their first distinction appears at higher order. The effect persists across distinct operator pairs and coefficient perturbations. Thus dynamical Abelianization is a property of the state-dependent process, i.e., non-Abelian ordering information can become operationally inaccessible even though the underlying operators remain non-commuting.", "url": "https://arxiv.org/abs/2608.10540", "type": "理论", "summary": "非零交换子证明两个排序作为运算符是不同的，但它不能确保物理状态可以揭示差异。我们询问非阿贝尔排序信息何时变得动态不可见。对于 Hermitian 算子 $B$ 和 $C$，我们比较由相反顺序乘积 $M=(B+iC)(B-iC)$ 和 $\\widetilde M=(B-iC)(B+iC)$ 生成的演化，并根据标准化时间窗口上输出状态的最小重叠来定义它们的操作可见性。这种可见性限制了所选状态上每个可观察值中两个排序产生的差异。精确的单量子位解决方案表明，同一固定对在一种状态下完全不可见，而在另一种状态下可见。然后，我们保持有序生成器固定，并仅改变量子相变中的多体基态。同样的排序差异在一种制度中几乎看不见，而在另一种制度中则清晰可见。此外，具有相同领先二次衰变的状态可以发展出截然不同的有限时间可见性，因为它们的第一个区别出现在更高阶。该效应在不同的算子对和系数扰动中持续存在。\n\n因此，动态阿贝尔化是状态相关过程的一个属性，即，即使底层运算符保持非交换状态，非阿贝尔排序信息也可能在操作上变得不可访问。", "authors": [{"name": "Ji-Chong Yang"}, {"name": "Gui-Qi Hu"}], "featured_authors": [{"name": "Ji-Chong Yang"}, {"name": "Gui-Qi Hu"}], "author_count": 2}, {"id": "2608.10576", "category": "quant-ph", "title": "Stream Decoding with Confidence Scores at Room and Cryogenic Temperatures", "abstract": "In fault-tolerant quantum computing, fast and accurate decoding is crucial. Snowflake is a decoder for the surface code that runs in a streaming fashion. In this paper, we implement Snowflake on commercial FPGAs and validate them at room and cryogenic temperatures. Our results demonstrate high decoding throughput for small code distances that, when extrapolated, remains within acceptable limits for larger distances. Further, we incorporate the calculation of certain decoder confidence scores with negligible overhead both in terms of latency and physical resource utilisation. We note that implementing a large-scale system would require either a large FPGA beyond today's technology or clusters of FPGAs connected via a high-speed bus. Thus, we discuss an alternative architecture that exploits the locality of Snowflake by processing 2D slices of the 3D decoding window and offloading segments of the 3D structure to a high-speed memory.", "url": "https://arxiv.org/abs/2608.10576", "type": "数值", "summary": "在容错量子计算中，快速准确的解码至关重要。 Snowflake 是以流方式运行的表面代码的解码器。在本文中，我们在商用 FPGA 上实现了 Snowflake，并在室温和低温下对其进行了验证。我们的结果表明，对于较小的代码距离，解码吞吐量很高，而当外推时，对于较大的距离，仍保持在可接受的限度内。此外，我们将某些解码器置信度分数的计算纳入其中，在延迟和物理资源利用率方面的开销可以忽略不计。我们注意到，实现大规模系统需要超越当今技术的大型 FPGA 或通过高速总线连接的 FPGA 集群。因此，我们讨论了一种替代架构，该架构通过处理 3D 解码窗口的 2D 切片并将 3D 结构的片段卸载到高速存储器来利用 Snowflake 的局部性。", "authors": [{"name": "Maries Tahaab"}, {"name": "Tim Chan"}, {"name": "James Kirkman"}, {"name": "Simon C. Benjamin"}], "featured_authors": [{"name": "Maries Tahaab"}, {"name": "Tim Chan"}, {"name": "James Kirkman"}, {"name": "Simon C. Benjamin"}], "author_count": 4}, {"id": "2608.10643", "category": "quant-ph", "title": "Zero transfer on mixed graphs", "abstract": "In this paper, we investigate zero transfer on mixed graphs. Zero transfer is a quantum walk phenomenon in which the transition amplitude between two vertices is identically zero for all times, so that no quantum state transfer occurs between them. Using the Hermitian adjacency matrix, we derive necessary and sufficient conditions for zero transfer in mixed graphs. We then specialize these criteria to oriented circulant graphs, obtaining nonexistence results for prime order, structural restrictions for even order, and exhaustive computational classifications for small orders.", "url": "https://arxiv.org/abs/2608.10643", "type": "理论", "summary": "在本文中，我们研究混合图上的零转移。零转移是一种量子行走现象，其中两个顶点之间的跃迁幅度始终为零，因此它们之间不会发生量子态转移。使用埃尔米特邻接矩阵，我们推导了混合图中零传递的充分必要条件。然后，我们将这些标准专门用于定向循环图，获得素数阶的不存在结果、偶数阶的结构限制以及小阶的详尽计算分类。", "authors": [{"name": "Xingkun Song"}, {"name": "Huiqiu Lin"}], "featured_authors": [{"name": "Xingkun Song"}, {"name": "Huiqiu Lin"}], "author_count": 2}, {"id": "2608.10671", "category": "quant-ph", "title": "Quantum Computing for Industrial Electromagnetics: Applicability and Case Studies in Solving Maxwell's Equations", "abstract": "Computational electromagnetics plays a central role in many industrial applications but often requires substantial computational resources, particularly when fine spatial discretizations are needed. While classical approaches remain the standard, quantum computing offers the potential to accelerate large-scale simulations by encoding them with a limited number of qubits. Here, we investigate the performance and resource scaling of the Harrow-Hassidim-Lloyd (HHL) and Quantum Singular Value Transformation (QSVT) algorithms for solving linear systems generated by the finite-difference time-domain (FDTD) method, a widely adopted numerical scheme for discretizing Maxwell's equations. We benchmark their performance across representative industrial use cases, including radar propagation, lens simulations, and beamforming processes. Our results demonstrate the validity of the approaches, achieving state infidelities smaller than $2\\cdot 10^{-3}$ with success probabilities greater than $10^{-3}$, compatible with practical quantum state sampling. Overall, we observe that the QSVT method consistently delivers higher accuracy. We further observe that the condition number of the linear matrix, a key factor governing the performance of quantum solvers, saturates as the number of spatial lattice points increases. This implies that the spatial grid can be scaled to realistic industrial dimensions without increasing the HHL or QSVT circuit depth due to ill-conditioned matrices.", "url": "https://arxiv.org/abs/2608.10671", "type": "理论+数值", "summary": "计算电磁学在许多工业应用中发挥着核心作用，但通常需要大量计算资源，特别是在需要精细空间离散化时。虽然经典方法仍然是标准，但量子计算通过使用有限数量的量子位进行编码，提供了加速大规模模拟的潜力。在这里，我们研究了 Harrow-Hassidim-Lloyd (HHL) 和量子奇异值变换 (QSVT) 算法的性能和资源扩展，用于求解时域有限差分 (FDTD) 方法生成的线性系统，FDTD 是一种广泛采用的离散化麦克斯韦方程组的数值方案。我们在代表性工业用例中对它们的性能进行基准测试，包括雷达传播、透镜模拟和波束成形过程。我们的结果证明了该方法的有效性，实现了小于 $2\\cdot 10^{-3}$ 的状态不忠实度，成功概率大于 $10^{-3}$，与实际的量子态采样兼容。总体而言，我们观察到 QSVT 方法始终提供更高的准确度。\n\n我们进一步观察到，线性矩阵的条件数是控制量子求解器性能的关键因素，随着空间晶格点数量的增加而饱和。这意味着空间网格可以缩放到实际的工业尺寸，而不会因病态矩阵而增加 HHL 或 QSVT 电路深度。", "authors": [{"name": "Francesco Turro"}, {"name": "Marco Maronese"}, {"name": "Daniele Dragoni"}], "featured_authors": [{"name": "Francesco Turro"}, {"name": "Marco Maronese"}, {"name": "Daniele Dragoni"}], "author_count": 3}, {"id": "2608.10674", "category": "quant-ph", "title": "Optimal fidelity estimation when one state is pure via algorithmic Uhlmann transform", "abstract": "The Uhlmann fidelity ${\\rm F}(\\rho_0,\\rho_1) = {\\rm tr}|\\sqrt{\\rho_0}\\sqrt{\\rho_1}|$ is one of the most fundamental quantities in quantum information theory for quantifying the closeness between two quantum states. Estimating the Uhlmann fidelity to within additive error $\\varepsilon$ requires a number of copies of the states, or queries to their state-preparation circuits, that depends at least linearly on the smaller of the ranks of $\\rho_0$ and $\\rho_1$. Consequently, this rank dependence disappears when either state is pure, in which case the query and sample complexities depend only polynomially on $1/\\varepsilon$. However, the known optimal estimator for ${\\rm F}(\\rho,|\\psi\\rangle\\!\\langle\\psi|)$ due to Fang and Wang (ESA 2025) requires prior knowledge of which state is pure. In this work, we remove this mathematically unnecessary prior-knowledge requirement and establish an optimal estimator for ${\\rm F}(\\rho, |\\psi\\rangle\\!\\langle\\psi|)$ under the sole promise that one of the two states is pure, without knowing which one. Our estimator is obtained by specializing the refined algorithmic Uhlmann transform of Utsumi, Nakata, Wang, and Takagi (2025) to the case where one state is pure. In this setting, the Uhlmann fidelity can be recovered as follows: apply a unitary dilation of ${\\rm tr}_{\\sf A}(|\\psi_0\\rangle\\!\\langle\\psi_1|)$ (or its inverse) to the reference register $\\sf R$ of the purification $|\\psi_1\\rangle$ (or $|\\psi_0\\rangle$) on the registers $\\sf A$ and $\\sf R$, estimate the corresponding square-root amplitude in each case, and take the maximum of the resulting two estimates.", "url": "https://arxiv.org/abs/2608.10674", "type": "理论+数值", "summary": "乌尔曼保真度 ${\\rm F}(\\rho_0,\\rho_1) = {\\rm tr}|\\sqrt{\\rho_0}\\sqrt{\\rho_1}|$ 是量子信息论中用于量化两个量子态之间的接近程度的最基本量之一。估计加性误差 $\\varepsilon$ 内的乌尔曼保真度需要多个状态副本，或对其状态准备电路进行查询，这至少线性依赖于 $\\rho_0$ 和 $\\rho_1$ 的秩中较小的一个。因此，当任一状态是纯状态时，这种等级依赖性就会消失，在这种情况下，查询和样本复杂性仅多项式地依赖于 $1/\\varepsilon$。然而，Fang 和 Wang (ESA 2025) 提出的 ${\\rm F}(\\rho,|\\psi\\rangle\\!\\langle\\psi|)$ 的已知最优估计器需要先验知识哪个状态是纯的。在这项工作中，我们消除了这种数学上不必要的先验知识要求，并建立了 ${\\rm F}(\\rho, |\\psi\\rangle\\!\\langle\\psi|)$ 的最佳估计器，唯一的承诺是两个状态之一是纯的，而不知道哪一个。\n\n我们的估计量是通过将 Utsumi、Nakata、Wang 和 Takagi (2025) 的改进算法 Uhlmann 变换专门针对一种状态为纯状态的情况而获得的。在此设置中，可以按如下方式恢复乌尔曼保真度：将 ${\\rm tr}_{\\sf A}(|\\psi_0\\rangle\\!\\langle\\psi_1|)$ （或其逆）的酉扩张应用于寄存器 $\\sf A$ 和 $\\sf 上净化 $|\\psi_1\\rangle$ （或 $|\\psi_0\\rangle$）的参考寄存器 $\\sf R$ R$，估计每种情况下相应的平方根幅度，并取所得两个估计值的最大值。", "authors": [{"name": "Yupan Liu"}, {"name": "Qisheng Wang"}], "featured_authors": [{"name": "Yupan Liu"}, {"name": "Qisheng Wang"}], "author_count": 2}, {"id": "2608.10695", "category": "quant-ph", "title": "Helium-like ions $(Z,e,e)$ in Lagrange Mesh method, interpolating the highly-accurate energy spectra vs. Z", "abstract": "Two alternative approaches for studying Helium-like atomic ions in non-relativistic quantum mechanics are proposed: (I) a numerical approach, based on the Lagrange-mesh method which can easily reach up to 14-15 significant digits in the energy spectrum for any nuclear charge $Z$ with modest CPU time in single processor mode and (II) a highly-accurate, few-parametric interpolation formula for the energies {\\it vs.} $Z$. The interpolation formula of general nature is proposed, it can be applied to the energies of any excited state of the helium-like sequence. It is based on matching the $1/Z$-expansion at large $Z$ and the Puiseux expansion with integer and half-integer powers around the so-called second critical charge $Z_B$, introduced by F and D Stillinger (1969, 1974), confirmed by the present authors in 2019 for the ground state $1^1 S$, then revisited here, and extended to the excited states in the present work. For example for the first two spin-singlet $1^1 S$, $2^1 S$ and the first two spin-triplet $2^3 S$, $3^3 S$ states this interpolation formula with nine free parameters can reach an accuracy of 10-14 significant digits (s.d.) in the energies for any physically-relevant nuclear charge $Z$, giving absolute accuracy at large $Z$. Many results are obtained for the first time.", "url": "https://arxiv.org/abs/2608.10695", "type": "理论+数值", "summary": "提出了两种研究非相对论量子力学中类氦原子离子的替代方法：(I) 基于拉格朗日网格方法的数值方法，该方法可以在单处理器模式下以适当的 CPU 时间轻松达到任何核电荷 $Z$ 能谱中高达 14-15 个有效数字；(II) 能量 {\\it vs.} $Z$ 的高精度、少参数插值公式。提出了一般性质的插值公式，它可以应用于类氦序列的任何激发态的能量。它基于匹配大 $Z$ 处的 $1/Z$ 展开式和围绕所谓的第二临界电荷 $Z_B$ 的整数和半整数幂的 Puiseux 展开式，由 F 和 D Stillinger (1969, 1974) 引入，由本作者于 2019 年针对基态 $1^1 S$ 进行确认，然后在这里重新审视，并扩展到本工作中的激发态。\n\n例如，对于前两个自旋单态 $1^1 S$、$2^1 S$ 和前两个自旋三重态 $2^3 S$、$3^3 S$ 表明，对于任何物理相关核电荷 $Z$，具有九个自由参数的插值公式可以在能量中达到 10-14 个有效数字 (s.d.) 的精度，从而给出大 $Z$ 的绝对精度。许多成果都是首次获得。", "authors": [{"name": "H Olivares-Pilon"}, {"name": "JC Lopez-Vieyra"}, {"name": "AV Turbiner"}], "featured_authors": [{"name": "H Olivares-Pilon"}, {"name": "JC Lopez-Vieyra"}, {"name": "AV Turbiner"}], "author_count": 3}, {"id": "2608.10789", "category": "quant-ph", "title": "Resource-bounded controllability benchmarking of open quantum systems", "abstract": "This paper develops a resource-bounded framework for evaluating practical controllability in open quantum systems using a trained graybox response model. Rather than treating controllability as a binary property of an idealised Hamiltonian model, the proposed approach evaluates the best-achievable process fidelity over a finite, hardware-realisable pulse family under explicit control constraints. The graybox model retains the known coherent dynamics while learning control-dependent open-system distortions from pulse-response data. The resulting surrogate predictions are used to reconstruct the implemented processes and compare them with Haar-random target gates. Practical controllability is then characterised through the distribution of best-achievable infidelities and an area-based summary metric. The framework is demonstrated for a driven qubit under closed-system, classical-noise, and combined quantum-plus-classical-noise dynamics, with pulse amplitude and inverse Gaussian width used as the control-resource coordinates. The results show how finite control resources and open-system noise jointly constrain the gate performance attainable by the chosen pulse family.", "url": "https://arxiv.org/abs/2608.10789", "type": "理论+数值", "summary": "本文开发了一个资源有限的框架，用于使用经过训练的灰盒响应模型评估开放量子系统的实际可控性。所提出的方法不是将可控性视为理想化哈密顿模型的二元属性，而是在显式控制约束下评估有限的、硬件可实现的脉冲族上可实现的最佳过程保真度。灰盒模型保留了已知的相干动力学，同时从脉冲响应数据中学习控制相关的开放系统失真。由此产生的代理预测用于重建所实现的过程并将其与哈尔随机目标门进行比较。然后通过最佳可实现的不忠度的分布和基于区域的汇总指标来表征实际的可控性。该框架针对封闭系统、经典噪声和组合量子加经典噪声动力学下的驱动量子位进行了演示，其中脉冲幅度和逆高斯宽度用作控制资源坐标。结果表明，有限的控制资源和开放系统噪声如何共同限制所选脉冲系列所能达到的门性能。", "authors": [{"name": "Yule Mayevsky"}, {"name": "Akram Youssry"}, {"name": "Alberto Peruzzo"}], "featured_authors": [{"name": "Yule Mayevsky"}, {"name": "Akram Youssry"}, {"name": "Alberto Peruzzo"}], "author_count": 3}, {"id": "2608.10809", "category": "quant-ph", "title": "A Quantum Algorithm for Solving the Poisson Equation for Free Field Conditions via the Hockney Method", "abstract": "For the often encountered problem of the Poisson equation, this work presents a quantum algorithm solving it based on the quantum Fourier transform (QFT) for periodic boundary conditions as well as free field conditions, where the latter is realized via the Hockney method. Besides the QFT and an initialization procedure for amplitude encoding, the algorithm just uses a procedure for multiplying the state vector by a diagonal matrix w.r.t. amplitude encoding. For the latter, two alternative implementations are considered here. The first variant is a version of the LCU method and the second is a sequence of multi-controlled rotation gates that represents a factoring of the multiplied values into absolute values and complex phase factors. The functionality of the algorithm is verified via comparing the results obtained from state vector simulations for one- and two-dimensional test examples with their analytical solutions. For the considered test examples, it is found that the success probability for obtaining the desired ancilla qubit subspace in the LCU version is a factor of around two higher than that for the sequence of multi-controlled rotation gates. However, the LCU version requires a number of ancilla qubits up to the number of qubits that is set to store the discretized source term of the Poisson equation in amplitude encoding, whereas the sequence of multi-controlled rotation gates demands only one ancilla qubit. Computations of the success probabilities for both variants furthermore indicate that the success probability converges for a specific problem with increasing resolution. Concerning the required computational resources for the quantum algorithm, the conclusion is drawn that while the QFT is a more efficient procedure than its classical counterpart, the current implementations of the other necessary steps in the algorithm diminish the efficiency w.r.t. the runtime.", "url": "https://arxiv.org/abs/2608.10809", "type": "理论+数值", "summary": "针对经常遇到的泊松方程问题，本文提出了一种基于量子傅里叶变换（QFT）的量子算法来求解周期性边界条件和自由场条件，其中后者通过霍克尼方法实现。除了 QFT 和幅度编码的初始化过程之外，该算法仅使用将状态向量乘以对角矩阵的过程。幅度编码。对于后者，这里考虑两种替代实现。第一个变体是 LCU 方法的一个版本，第二个变体是一系列多重控制旋转门，表示将乘积分解为绝对值和复相位因子。通过将一维和二维测试实例的状态向量模拟结果与其解析解进行比较，验证了该算法的功能。对于所考虑的测试示例，发现在 LCU 版本中获得所需辅助量子位子空间的成功概率比多控制旋转门序列高出约两倍。\n\n然而，LCU 版本需要多个辅助量子位，最多可达设置为存储幅度编码中泊松方程的离散源项的量子位数量，而多控制旋转门序列仅需要一个辅助量子位。两种变体的成功概率的计算进一步表明，随着分辨率的增加，成功概率针对特定问题收敛。关于量子算法所需的计算资源，得出的结论是，虽然 QFT 是比经典算法更有效的过程，但算法中其他必要步骤的当前实现降低了效率。运行时。", "authors": [{"name": "Hans A. Kösel"}, {"name": "Roland Ewert"}, {"name": "Jan W. Delfs"}], "featured_authors": [{"name": "Hans A. Kösel"}, {"name": "Roland Ewert"}, {"name": "Jan W. Delfs"}], "author_count": 3}, {"id": "2608.11000", "category": "quant-ph", "title": "The entanglement-assisted transmission capacity is a strong converse bound for identification", "abstract": "Classical identification via a noisy channel is a communication task in which the receiver is not required to reconstruct the full transmitted message, but only to decide whether it coincides with a message of interest. This relaxation allows the number of identifiable messages to grow doubly exponentially with the blocklength. For quantum channels, the resulting (doubly exponential) identification capacity $C_{\\mathrm{ID}}$ can strictly exceed the ordinary (exponential) transmission capacity $C$. In this paper, we prove that the entanglement-assisted transmission capacity $C_E$ is a strong converse bound for this task: $C_{\\mathrm{ID}}\\leq C_E$. For sufficiently low-noise channels, this bound can also be achieved via the Hayden-Winter (quantum) identification + fingerprinting codes. This yields an exact characterization $C_{\\mathrm{ID}}=C_E$ of identification capacity for such channels. However, for general channels, we prove that this upper bound can be strict. We exhibit an explicit family of transpose-depolarizing channels for which $C_{\\mathrm{ID}}<C_E$. As a consequence, we also obtain the first example of strict superadditivity of the identification capacity $C_{\\mathrm{ID}}$.", "url": "https://arxiv.org/abs/2608.11000", "type": "理论", "summary": "通过噪声信道进行的经典识别是一种通信任务，其中接收者不需要重建完整的传输消息，而只需确定它是否与感兴趣的消息一致。这种放宽允许可识别消息的数量随着块长度呈双倍指数增长。对于量子信道，由此产生的（双指数）识别能力$C_{\\mathrm{ID}}$可以严格超过普通（指数）传输能力$C$。在本文中，我们证明了纠缠辅助传输容量 $C_E$ 是该任务的强逆界：$C_{\\mathrm{ID}}\\leq C_E$。对于足够低噪声的通道，也可以通过 Hayden-Winter（量子）识别 + 指纹码来实现此界限。这产生了此类通道的识别能力的精确表征$C_{\\mathrm{ID}}=C_E$。然而，对于一般渠道，我们证明这个上限可以是严格的。我们展示了一个明确的转置去极化通道族，其中 $C_{\\mathrm{ID}}<C_E$。\n\n因此，我们还获得了识别能力 $C_{\\mathrm{ID}}$ 的严格超可加性的第一个例子。", "authors": [{"name": "Satvik Singh"}], "featured_authors": [{"name": "Satvik Singh"}], "author_count": 1}, {"id": "2608.11042", "category": "quant-ph", "title": "Entanglement depth and ancilla efficiency in quantum channel estimation", "abstract": "We study the role of ancillary entanglement in quantum channel parameter estimation and investigate the minimal ancilla dimension required to achieve the maximum Fisher information. We introduce the $k$-ancilla Fisher information, which quantifies the optimal estimation precision achievable with input states of rank at most $k$, and derive a variational characterization in terms of a rank-constrained optimization problem. This formulation leads to a simple characterization of the minimum ancilla dimension $k^*$ required for optimal estimation, given by the minimum rank among the maximizers of the associated variational problem. We further identify sufficient conditions under which ancillary entanglement provides no advantage, including channel families admitting a fixed measure-and-prepare representation and channels satisfying a natural horizontality condition. In addition, we derive a bound on the incremental gain in Fisher information obtained by increasing the ancilla dimension under suitable structural assumptions on the optimal input states. The general results are illustrated through explicit examples, including unitary channels, qubit depolarizing and amplitude damping channels. These results provide a systematic framework for understanding and quantifying the entanglement resources required for optimal quantum channel estimation.", "url": "https://arxiv.org/abs/2608.11042", "type": "理论+数值", "summary": "我们研究了辅助纠缠在量子通道参数估计中的作用，并研究了实现最大费希尔信息所需的最小辅助维数。我们引入了 $k$-ancilla Fisher 信息，该信息量化了等级最多为 $k$ 的输入状态可实现的最佳估计精度，并根据等级约束优化问题导出了变分表征。这个公式导致了最佳估计所需的最小辅助维度 $k^*$ 的简单表征，由相关变分问题的最大化者之间的最小等级给出。我们进一步确定了辅助纠缠不提供任何优势的充分条件，包括允许固定测量和准备表示的通道族和满足自然水平条件的通道。此外，我们在最佳输入状态的适当结构假设下，通过增加辅助维数获得了费舍尔信息增量增益的界限。\n\n一般结果通过明确的示例进行说明，包括单一通道、量子位去极化和幅度阻尼通道。这些结果为理解和量化最佳量子信道估计所需的纠缠资源提供了一个系统框架。", "authors": [{"name": "Javid Naikoo"}], "featured_authors": [{"name": "Javid Naikoo"}], "author_count": 1}, {"id": "2608.11066", "category": "quant-ph", "title": "Quantum Coordination Advantages in AI State-Tracking Tasks: Semantic Compilation and Latent Memory", "abstract": "We prove inference-time quantum coordination advantages for specified AI state-tracking tasks. A solver compresses semantic history into a future-accessible boundary state and later answers a query. We count communication $B$, persistent instance-dependent memory $M$, and local work $D$; classical recurrence, caches, tools, and recomputation are allowed and charged. The central result is a boundary-preserving semantic-compilation theorem. It maps a finite one-way, streaming, or adaptive causal task into a semantic AI interface while preserving event order and access to past input. Classical boundary-state lower bounds and quantum-memory upper bounds transfer up to explicit compiler overhead, independently of the finite-precision recurrent architecture. Two applications have classical semantics. Matched-entity synopsis QA inherits the hidden-matching separation between $O(\\log N)$ qubits and $\\Omega(\\sqrt{N})$ classical boundary bits. Continual requirements auditing inherits a Max-$k$SAT streaming separation: a recurrent solver uses $O(\\log^5 n\\log(1/\\delta))$ qubits and polylogarithmic classical workspace to obtain a $0.7172$-approximation, whereas every classical one-pass finite-information solver attaining that ratio requires $\\Omega(\\sqrt{n})$ coordination width. As a quantum-native compiler test, a stabilizer latent-state dialogue uses $n$ qubits, while every exact finite-state classical causal online realization satisfies $B+M \\ge \\frac{1}{2}n^2+(\\frac{3}{2}-\\log_2 3)n+O(1)$. The source protocols, streaming algorithms, and stabilizer witness are imported; the new result is their architecture-independent semantic transfer. These are memory and coordination separations, not runtime or empirical advantages for present-day language models. The stabilizer result assumes exact simulation and ideal noiseless quantum memory.", "url": "https://arxiv.org/abs/2608.11066", "type": "理论+数值", "summary": "我们证明了特定人工智能状态跟踪任务的推理时间量子协调优势。求解器将语义历史压缩为未来可访问的边界状态，然后回答查询。我们计算通信 $B$、持久实例相关内存 $M$ 和本地工作 $D$；允许经典的递归、缓存、工具和重新计算并收费。核心结果是边界保留语义编译定理。它将有限的单向、流式或自适应因果任务映射到语义人工智能接口，同时保留事件顺序和对过去输入的访问。经典边界状态下界和量子内存上限转移到显式编译器开销，独立于有限精度循环架构。两个应用程序具有经典语义。匹配实体概要 QA 继承了 $O(\\log N)$ 量子位和 $\\Omega(\\sqrt{N})$ 经典边界位之间的隐藏匹配分离。\n\n持续需求审计继承了 Max-$k$SAT 流分离：循环求解器使用 $O(\\log^5 n\\log(1/\\delta))$ 量子位和多对数经典工作空间来获得 $0.7172$ 近似值，而每个达到该比率的经典单通道有限信息求解器都需要 $\\Omega(\\sqrt{n})$ 协调宽度。作为量子原生编译器测试，稳定器潜在状态对话使用 $n$ 个量子位，而每个精确的有限状态经典因果在线实现都满足 $B+M \\ge \\frac{1}{2}n^2+(\\frac{3}{2}-\\log_2 3)n+O(1)$。导入源协议、流算法、稳定器见证；新的结果是它们与架构无关的语义转移。这些是记忆和协调的分离，而不是当今语言模型的运行时或经验优势。稳定器结果假设精确的模拟和理想的无噪声量子存储器。", "authors": [{"name": "Ming Yang"}], "featured_authors": [{"name": "Ming Yang"}], "author_count": 1}, {"id": "2608.11139", "category": "quant-ph", "title": "A Sharp Local-Question Threshold for GHZ-Equatorial Completeness in Four-Player XOR Games", "abstract": "We determine the smallest number of active questions per player at which a four-player binary exclusive-or (XOR) game of commuting-operator value one need not admit a Greenberger--Horne--Zeilinger (GHZ) equatorial realization. Such a realization uses the four-qubit GHZ state and equatorial qubit observables, reducing perfect play to additive phase equations. We prove that every four-player XOR game with commuting-operator value one and at most three active questions per player has a perfect GHZ-equatorial strategy. Conversely, we construct a uniform eight-clause game with four active questions per player whose commuting-operator value is one but whose phase equations are inconsistent. Thus four is the sharp local-question threshold. The positive result follows by lifting every integral incidence obstruction to an ordered noncommutative refutation, using primitive circuits, forest matchings, and ternary Hamming geometry. For the separating game, a Klein four-group incidence relation obstructs the phase system, while an even-subgroup normal form and degree-one and degree-two Magnus coefficients exclude refutations of arbitrary length.", "url": "https://arxiv.org/abs/2608.11139", "type": "理论", "summary": "我们确定每个玩家的最小活跃问题数，在该数量下，通勤算子值的四人二元异或（XOR）游戏不需要承认 Greenberger-Horne-Zeilinger（GHZ）赤道实现。这种实现使用四量子位 GHZ 状态和赤道量子位可观测量，减少了对加性相位方程的完美发挥。我们证明，每个四人 XOR 游戏（每个玩家的通勤运营商价值为 1 个且最多 3 个主动问题）都具有完美的 GHZ 赤道策略。相反，我们构建了一个统一的八子游戏，每个玩家有四个主动问题，其通勤算子值为 1，但其相位方程不一致。因此，四是尖锐的本地问题阈值。积极的结果是使用原始电路、森林匹配和三元汉明几何将每个积分关联障碍提升为有序的非交换反驳。对于分离游戏，克莱因四群关联关系阻碍了相位系统，而偶数子群范式以及一级和二级马格努斯系数排除了任意长度的反驳。", "authors": [{"name": "Ziao Tang"}, {"name": "Chengkai Zhu"}, {"name": "Ge Bai"}, {"name": "Xin Wang"}, {"name": "Ranyiliu Chen"}], "featured_authors": [{"name": "Ziao Tang"}, {"name": "Chengkai Zhu"}, {"name": "Ge Bai"}, {"name": "Xin Wang"}, {"name": "Ranyiliu Chen"}], "author_count": 5}, {"id": "2608.11151", "category": "quant-ph", "title": "Breaking the Quadratic Barrier for von Neumann Entropy Estimation", "abstract": "We study the sample complexity of estimating the von Neumann entropy of an unknown $d$-dimensional quantum state. All previously known estimators require $\\Omega(d^2)$ samples, and plug-in estimators are known to face a quadratic barrier. We give the first subquadratic-sample estimator: for additive error $\\varepsilon$, our estimator uses \\[ O\\!\\left(\\frac{d^2 \\log^2(\\log(d)) \\log(1/\\varepsilon)}{\\varepsilon^2 \\log^2(d)} + \\frac{\\log^2(d/\\varepsilon)}{\\varepsilon^2}\\right) \\] samples. In particular, for constant $\\varepsilon$, the complexity is $O_\\varepsilon(d^2\\log^2(\\log(d))/\\log^2(d))=o(d^2)$. Our analysis introduces a new pinching inequality that bounds the entropy loss under a space direct-sum decomposition, together with a bias-corrected estimator for large eigenvalues and a new bounded-coefficient polynomial estimator for small eigenvalues.", "url": "https://arxiv.org/abs/2608.11151", "type": "理论", "summary": "我们研究了估计未知 $d$ 维量子态的冯·诺依曼熵的样本复杂性。所有先前已知的估计器都需要 $\\Omega(d^2)$ 样本，并且已知插件估计器面临二次障碍。我们给出第一个二次样本估计器：对于加性误差 $\\varepsilon$，我们的估计器使用 \\[ O\\!\\left(\\frac{d^2 \\log^2(\\log(d)) \\log(1/\\varepsilon)}{\\varepsilon^2 \\log^2(d)} + \\frac{\\log^2(d/\\varepsilon)}{\\varepsilon^2}\\right) \\] 样本。特别是，对于常数 $\\varepsilon$，复杂度为 $O_\\varepsilon(d^2\\log^2(\\log(d))/\\log^2(d))=o(d^2)$。我们的分析引入了一种新的收缩不等式，它限制了空间直和分解下的熵损失，以及大特征值的偏差校正估计器和小特征值的新有界系数多项式估计器。", "authors": [{"name": "Minbo Gao"}, {"name": "Qisheng Wang"}], "featured_authors": [{"name": "Minbo Gao"}, {"name": "Qisheng Wang"}], "author_count": 2}, {"id": "2608.11160", "category": "quant-ph", "title": "Quantum Codes with Arbitrary Z-Rotation logical Gates and Applications to Fault-Tolerant Code Switching", "abstract": "A technique for realizing a universal set of fault-tolerant quantum operations is the code switching method, which leverages two quantum codes with complementary sets of transversal gates. To date, the application of this technique has been largely limited to families of color codes supporting a logical $T$ gate. No analogous code switching protocols exist for many other prominent families, such as rotated surface codes, or for finer $Z$-rotation gates. In this work, we first utilize the doubling technique as a unified framework to construct a class of quantum color codes encoding a single logical qubit with an arbitrarily large minimum distance, enabling the transversal realization of arbitrary small logical $Z$-rotation gates. We investigate the structural properties of this code family, demonstrating that they improve upon the parameters of state-of-the-art triorthogonal codes, achieve lower qubit overhead compared to certain known color codes, and admit single-shot decoding of $Z$-syndromes via meta-checks. Furthermore, we show that this framework extends beyond color codes; specifically, it enables the generation of $r$-orthogonal quantum codes, $r \\ge 2$, that inherit the local geometry of rotated surface codes. We then provide an overhead optimization protocol alongside several candidate codes tailored for realizing logical $Z$-rotation gates within rotated surface codes. Finally, we extend the fault-tolerant code switching protocol based on transversal CNOT gates to incorporate fault-tolerant realization of $Z$-rotation gates at any level of the Clifford hierarchy for geometries compatible with rotated surface codes. We present the first demonstration of fault-tolerant magic state preparation by means of code switching within a distance-three rotated surface code using a total footprint of only 45 physical qubits, and evaluate its performance through a simulation.", "url": "https://arxiv.org/abs/2608.11160", "type": "理论+数值", "summary": "实现通用容错量子操作集的技术是代码交换方法，它利用两个具有互补横向门集的量子代码。迄今为止，该技术的应用很大程度上仅限于支持逻辑 $T$ 门的颜色代码系列。许多其他著名家族不存在类似的代码交换协议，例如旋转表面代码或更精细的 $Z$ 旋转门。在这项工作中，我们首先利用倍增技术作为统一框架来构造一类量子颜色代码，以任意大的最小距离编码单个逻辑量子位，从而能够横向实现任意小的逻辑$Z$旋转门。我们研究了该代码系列的结构特性，证明它们改进了最先进的三正交代码的参数，与某些已知的颜色代码相比，实现了更低的量子位开销，并允许通过元检查对 $Z$ 综合症进行单次解码。\n\n此外，我们表明这个框架超越了颜色代码；具体来说，它能够生成 $r$ 正交量子代码 $r \\ge 2$，继承旋转表面代码的局部几何形状。然后，我们提供了一个开销优化协议以及几个为在旋转表面代码中实现逻辑 $Z$ 旋转门而定制的候选代码。最后，我们扩展了基于横向 CNOT 门的容错代码交换协议，以在 Clifford 层次结构的任何级别合并 $Z$ 旋转门的容错实现，以实现与旋转表面代码兼容的几何形状。我们首次演示了通过在距离内进行代码切换的容错魔法状态准备——三旋转表面代码，总占用空间仅为 45 个物理量子位，并通过模拟评估其性能。", "authors": [{"name": "Reza Dastbasteh"}, {"name": "Ruben M. Otxoa"}, {"name": "Pedro M. Crespo"}, {"name": "Josu Etxezarreta Martinez"}], "featured_authors": [{"name": "Reza Dastbasteh"}, {"name": "Ruben M. Otxoa"}, {"name": "Pedro M. Crespo"}, {"name": "Josu Etxezarreta Martinez"}], "author_count": 4}, {"id": "2608.11187", "category": "quant-ph", "title": "Statistically-Secure Bit Commitment and Coin Flipping Protocols Based on Quantum Hardware Assumptions", "abstract": "Bit commitment is impossible to achieve with unconditional security, even in quantum cryptogra- phy. We show that statistically secure bit commitment, satisfying both hiding and binding, can be constructed from hybrid locked physical unclonable functions (HLPUFs), a hardware primitive that combines classical hardware tokens and quantum communication. Our protocol uses these hardware assumptions in a novel and non-trivial way to achieve the first mistrustful two-party cryptographic protocol based on hybrid hardware modules. We prove statistical hiding and binding under natu- ral assumptions on the HLPUF and using a carefully designed challenge generation algorithm as a subroutine of our bit-commitment protocol. The construction also yields the first hardware-based coin-flipping protocol. Our results suggest a new paradigm for secure two-party cryptography in quantum networks, combining rigorous security guarantees with a concrete route toward practical implementation.", "url": "https://arxiv.org/abs/2608.11187", "type": "数值", "summary": "即使在量子密码学中，比特承诺也不可能以无条件的安全性实现。我们证明，满足隐藏和绑定的统计安全位承诺可以由混合锁定物理不可克隆函数（HLPUF）构建，HLPUF 是一种结合了经典硬件令牌和量子通信的硬件原语。我们的协议以一种新颖且重要的方式使用这些硬件假设，以实现第一个基于混合硬件模块的不信任两方加密协议。我们在 HLPUF 的自然假设下证明了统计隐藏和绑定，并使用精心设计的挑战生成算法作为我们的比特承诺协议的子例程。该结构还产生了第一个基于硬件的抛硬币协议。我们的结果提出了量子网络中安全两方加密的新范式，将严格的安全保证与实际实施的具体路线相结合。", "authors": [{"name": "Roo Dunnill"}, {"name": "Mina Doosti"}], "featured_authors": [{"name": "Roo Dunnill"}, {"name": "Mina Doosti"}], "author_count": 2}, {"id": "2608.11196", "category": "quant-ph", "title": "Work distribution for strongly coupled many-body open quantum systems", "abstract": "The non-equilibrium quantum thermodynamics of many-body open systems is notoriously rich, especially in the strong-coupling regime where strong system-bath correlations develop and interactions produce non-perturbative effects. Such systems can be described by `quantum impurity models' where the system and bath are treated on an equal footing as a single composite. Paradigmatic examples are the spin-boson and Anderson impurity models, in which system degrees of freedom interact with either bosonic or fermionic gapless baths. Here we study the quantum work distribution function (WDF) of such systems following a quench. Capturing the full continuum of many-body excitations in the WDF requires a non-perturbative solution of the underlying non-equilibrium quantum impurity problem. For this purpose, we extend the time-dependent numerical renormalization group (TDNRG) approach to the calculation of the WDF, which applies directly in the thermodynamic limit, can be used for arbitrary quench amplitudes at zero or finite temperature, and provides exponentially fine low-energy resolution. Our numerically-exact solution reveals power-law threshold behavior due to the Anderson orthogonality catastrophe when the work approaches its minimum value, with universal scaling collapse of the distribution below an emergent low-energy scale induced by system-bath correlations.", "url": "https://arxiv.org/abs/2608.11196", "type": "理论+数值", "summary": "众所周知，多体开放系统的非平衡量子热力学非常丰富，特别是在强耦合状态下，系统与浴之间存在强相关性，相互作用产生非微扰效应。这种系统可以通过“量子杂质模型”来描述，其中系统和浴被平等地视为单一复合材料。典型的例子是自旋玻色子和安德森杂质模型，其中系统自由度与玻色子或费米子无间隙浴相互作用。在这里，我们研究了此类系统在淬火后的量子功分布函数（WDF）。捕获 WDF 中多体激发的完整连续体需要对潜在的非平衡量子杂质问题进行非微扰解决。为此，我们将瞬态数值重正化群 (TDNRG) 方法扩展到 WDF 的计算，该方法直接应用于热力学极限，可用于零或有限温度下的任意淬火振幅，并提供指数级精细的低能量分辨率。\n\n我们的数值精确解揭示了当功接近最小值时，由于安德森正交性灾难而导致的幂律阈值行为，以及系统浴相关性引起的新兴低能尺度以下分布的普遍尺度崩溃。", "authors": [{"name": "H. T. M. Nghiem"}, {"name": "T. A. Costi"}, {"name": "S. Campbell"}, {"name": "A. K. Mitchell"}], "featured_authors": [{"name": "H. T. M. Nghiem"}, {"name": "T. A. Costi"}, {"name": "S. Campbell"}, {"name": "A. K. Mitchell"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>自动翻译</span><a href="${safeUrl}" target="_blank" rel="noreferrer">打开 arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
